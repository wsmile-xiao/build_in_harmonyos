knowledge_gained:
  - "本包最大门槛不是依赖而是三元组：tarball 自带预生成 configure（autoconf 2.61, 2006）与 config.guess(2007-07-22)/config.sub(2007-06-28)，两者对 aarch64 与 ohos 一律拒绝；B 机缺 automake，故不能走 autoreconf 自举，只能按 §3.6 优先级②直接改生成件；knowledge_ref: notes.md:42 与 notes.md:43（症状 1/2 的根因与补丁 0001/0002 落点，即改生成件的两处动作）、notes.md:84（autoreconf -fvi 路线不可行＝B 机无 automake ⇒ 按 §3.6 优先级②直接改生成件）、notes.md:192（适用边界与该路线的判别式）"
  - "官方处方脚本 scripts/patch-autotools-ohos.pl 对本包无效：2007 版 config.sub 尚无 android 分支（grep -c android = 0），其三处锚点（android-linux 块 / gnu* | android* OS 列表 / linux-uclibc* ) 收尾）全部落空，实测 Score 1/5 且 rc=1；只有 config.guess 的 HarmonyOS 块插入成功；knowledge_ref: notes.md:44（Score 1/5、rc=1、三处 [warn] 锚点落空的一手记录）、notes.md:82（已试过的失败方案第 2 条）、knowledge/graph/E007.kv:45 与 knowledge/graph/E122.kv:37（两条 forbid_1_pattern 原文，执行强度分级登记于 notes.md:224）"
  - "config.guess(2007) 没有 GUESS= 累积机制（后版 GNU config 才引入），perl 脚本插进去的 GUESS=赋值 块形同无效并掉进 unable-to-guess 尾部；须改成 echo 三元组 + exit 0；knowledge_ref: notes.md:42（补丁 0001 的动作＝按 UNAME_MACHINE 映射后 echo 三元组 + exit 0，不用 GUESS= 赋值形态）、notes.md:54（最小复现 sh config.guess 期望 unable to guess rc=1）、notes.md:192（判别式 grep -c '^GUESS=' config.guess 返回 0）"
  - "config.sub 的两处白名单缺一不可，且顺序敏感：KERNEL-OS 拆分列表缺 linux-ohos* 时三元组被切成 machine=aarch64-unknown-linux（报 machine not recognized）；OS 白名单缺 -linux-ohos* 时会先命中通用 -linux*) 分支，被 sed 改写成 -linux-gnu-ohos（平台被伪装）；knowledge_ref: notes.md:43（两处白名单各补一项 + 新增项须排在通用 -linux*) 之前 + sh config.sub 原样回显同一三元组的验收读数）、notes.md:55 与 notes.md:56（负/正对照两条复现命令）、knowledge/graph/E072.kv:53（该条 forbid_1 实为 host_alias 绕过，读点 notes.md:224）"
  - "configure 退出码 0 不等于 configure 成功：autoconf 的 AS_TMPDIR 用 (umask 077 && mktemp -d \"./confXXXXXX\")，而本机 euid=20020084 并非构建树 owner（全盘 uid=20001006/group file_manager），写权限只能来自 group 位；toybox mktemp -d 跟随 umask（022 -> drwxr-s--x 可写，077 -> drwx--S--- 不可写），普通 mkdir 则被归一成 drwxrws--x 故不受影响，chmod 改不动模式；结果 config.status 静默产不出任何 Makefile/config.h；knowledge_ref: notes.md:45（症状 4 与补丁 0003 的动作＝umask 077→022）、notes.md:60 与 notes.md:61（umask 077 与 umask 022 的 mktemp 判别实验）、notes.md:67（euid 20020084 与树 owner 20001006 的实测读数）、knowledge/graph/E011.kv:40 与 knowledge/graph/E011.kv:47（字面按处方执行）、knowledge/graph/E206.kv:6（等价执行）、knowledge/graph/E136.kv:5（仅根因命中、处方未采用）——三档分级见 notes.md:224"
  - "E060 的 tmpfs 处方在本包未被执行 ⇒ 既未证实也未否证（证据不足；第 1 棒据此判 E060 不成立的结论已撤回）：$HOME 即 /storage/Users/currentUser 自身的 fs 类型就是 hmdfs（/proc/mounts:71，父级 tmpfs 被子挂载覆盖），三条构建树按最长前缀实算全为 hmdfs ⇒ 处方从未被现场满足；且本机非特权 uid 下无可写的真 tmpfs（/dev/shm 为真 tmpfs 但 mkdir EACCES、/storage/hmdfs EPERM、/mnt/hmdfs/100 EACCES、/data/local/tmp 不可写、/tmp 只读 erofs）⇒ tmpfs 与 hmdfs 的成对对照做不出来，不得写作 OHOS 不支持 tmpfs 或 E060 处方无效；本包实际生效的是 E011 的 umask 077->022 处方（补丁 0003），与文件系统种类无关；knowledge_ref: notes.md:80（撤回第 1 棒的否证、改判证据不足的全程取证：逐路径 fs 类型与可写性配对）、notes.md:81（E060 条目自身两处可披露缺陷，属观察非新机制主张）、notes.md:225（3+2 处同一口径）、knowledge/graph/E060.kv:21（被指为 $HOME/tmp 落点写错的原文行）"
  - "yasr.h 自带的 openpty/forkpty 原型是非 const，与 OHOS musl <pty.h> 冲突；而 config.h 报 HAVE_OPENPTY/HAVE_FORKPTY/HAVE_PTY_H=1 且 yasr/Makefile 的 LIBOBJS 为空（自带替代实现根本没编译），故用 HAVE_* 守卫这两条原型即可，无需平台宏（PF5/R8 干净）；knowledge_ref: notes.md:46（症状 5 与补丁 0004 的动作＝HAVE_* 守卫两条原型、不含平台宏）、notes.md:194（判据＝先看 config.h 的 HAVE_<FUNC> 与 Makefile 的 LIBOBJS 是否为空）、notes.md:163（补丁清单表 0004 行 +6/-2）"
  - "产物面：只有 bin/yasr（+ share/man/man1/yasr.1、share/yasr/yasr.conf）；keytest 是 noinst_PROGRAMS，acclogin 仅在 YASR_SUN(Solaris) 条件分支构建；knowledge_ref: notes.md:100（冒烟用例①②③逐条断言 bin/yasr、share/yasr/yasr.conf、share/man/man1/yasr.1）、notes.md:95（noinst_PROGRAMS = keytest 的唯一命中）、archives/y/yasr/README.md:16（acclogin 仅在 YASR_SUN 即 Solaris 条件分支入 SUBDIRS＝该子句在一手载体中的位置；notes.md 无与之对应的独立动作行）"
  - "上游零测试：三份 Makefile.am 里没有 TESTS / check_PROGRAMS，唯一相关项是 noinst_PROGRAMS = keytest（交互式按键诊断，非测试）；knowledge_ref: notes.md:95（静态总数 0 的完整 grep 命中集）、notes.md:96（可执行数 0：make -n check 报 No rule to make target）、notes.md:102（88 条 tar 目录项逐一核过，同登记于 test_package/MANIFEST.yml 的 upstream_test_audit）"
  - "yasr 无 --version/--help；CLI 为 -C conf / -c / -s synth / -p port / program args。冒烟须走 -C：-C 指向不存在的配置 -> rc=1 并打印搜索列表；-C 指向随包安装的 yasr.conf -> rc=0 静默（真实走通 pty 会话并干净收尾）；knowledge_ref: notes.md:104（yasr.1 SYNOPSIS 与 --version/--help 实测 unrecognized option）、notes.md:100（用例④⑤走 -C 的实测 rc 与输出）、notes.md:138（L2 的判据正是 --version/--help，故该步在本包不成立）"
  - "本机实测 bin/yasr 未签名亦可 exec（无 rc=126 签名墙）；GNU make 4.4.1 的 jobserver FIFO 在 /storage/Users 上 Operation not permitted，故并行 make 不可用（-j1）；knowledge_ref: notes.md:47（jobserver mkfifo Operation not permitted ⇒ 配方 -j1 的动作）、notes.md:139 与 notes.md:140（bindir entry exec=True 与 rc=1/rc=0 真跑＝产物可 exec 的一手证据）、archives/y/yasr/README.md:33（未签名亦可 exec、无 rc=126 签名墙的同一读数；notes.md 无独立的签名动作行）"
