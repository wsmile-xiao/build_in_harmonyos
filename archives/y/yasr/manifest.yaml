# 软件级 manifest — yasr
software: yasr
display: "yasr"
description: "Yet Another Screen Reader —— 在 pty 里跑 shell、把屏幕内容经 TTS 朗读出来的轻量控制台屏幕阅读器"
category: utility
homepage: "https://yasr.sourceforge.net"
license: LGPL-2.0-or-later
repository: "https://sourceforge.net/projects/yasr/"
keywords:
  - screen-reader
  - accessibility
  - tts
  - pty
  - console

build_system: autotools

ohos_adaptation:
  key_points:
    - "门槛全在平台三元组而非依赖：tarball 自带预生成 configure（autoconf 2.61）与 config.guess(2007-07-22)/config.sub(2007-06-28)，三者既不认 aarch64 也不认 ohos；构建机缺 automake，故不走 autoreconf 自举，按 §3.6 优先级②直接改生成件"
    - "官方处方脚本 scripts/patch-autotools-ohos.pl 只补得上 config.guess，config.sub 三处锚点在 pre-Android 的 2007 版件上全部落空（实测 Score 1/5、rc=1），须自行按 E072 的三处白名单落点，且 -linux-ohos* 必须排在通用 -linux*) 之前否则三元组被改写成 -linux-gnu-ohos"
    - "config.status 的私有临时目录用 (umask 077 && mktemp -d)，而本机 euid 不是构建树 owner ⇒ 0700 目录对本 euid 不可写 ⇒ 静默产不出 Makefile/config.h 而 configure 仍退 0；解法取 E011 的 umask 077->022（判别实验见版本级 notes.md）"
    - "yasr.h 自带的非 const openpty/forkpty 原型与 musl <pty.h> 冲突；因 LIBOBJS 为空（自带替代实现未编译），用 HAVE_OPENPTY/HAVE_FORKPTY 守卫即可，不引入平台宏"
    - "零 Conan 依赖（W0）：configure 只探测 libc/libutil/gettext，OHOS musl sysroot 全部满足（INTLLIBS 与 LIBOBJS 均为空），故 requires()/tool_requires() 皆空"
    - "上游无任何测试套件（Makefile.am 无 TESTS/check_PROGRAMS，仅 noinst_PROGRAMS = keytest 交互式诊断）；test_package 新增 5 个鸿蒙消费者冒烟用例"
    - "yasr 无 --version/--help，冒烟只能走 -C <配置文件>：不存在的配置 rc=1 并打印搜索列表，随包安装的 yasr.conf 则 rc=0 静默走完 pty 会话"
    - "已知限制：Conan 的 autotools 打包约定是 --prefix=/，而 yasr/Makefile.am 把 PACKAGE_DATA_DIR 作编译期宏烙进二进制（实际值 //share/yasr）⇒ 不带 -C 且无 ~/.yasr.conf 时找不到随包默认配置；配置文件本身随包安装且非空，前两级搜索路径不受影响，故用 ~/.yasr.conf 或显式 -C 即功能完整（证据与三个处置选项见版本级 notes.md「已知限制」）"
  common_dependencies: []

versions:
  "0.6.9":
    status: built
    build_date: "2026-09-26"
    conan_ref: "yasr/0.6.9"
