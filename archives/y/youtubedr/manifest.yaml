# 软件级 manifest — youtubedr
# 文件位置: archives/y/youtubedr/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: youtubedr

display: "youtubedr"

description: "Youtube 视频下载器（Go 实现），同时是 kkdai/youtube/v2 Go 库与 youtubedr CLI 工具"

category: utility

homepage: "https://github.com/kkdai/youtube"

license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 项目（go 1.26），CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64 交叉编译"
    - "自包含下载 Go 1.26.3 工具链（aliyun 镜像，参照 murex/aliae 先例）"
    - "GOPROXY=https://goproxy.cn,direct （proxy.golang.org 被墙）"
    - "OHOS 可执行文件与 go test 测试二进制需 binary-sign-tool 签名后才能 exec"
    - "上游部分单元测试直接访问 YouTube 网络端点，需外网；无网/受限环境按环境 gap 如实报告"

  common_dependencies: []

versions:
  "2.10.6":
    status: built
    build_date: 2026-09-29
