# test_package/MANIFEST.yml
# 上游官方测试声明 (CI build_and_test.sh L0e 强制要求存在)
package: youtubedr/2.10.6
homepage: "https://github.com/kkdai/youtube"

# 上游测试入口 (conanfile.py 的 build() 内执行)
upstream_check_command: "go test ./..."
upstream_test_in_build: true
upstream_test_command: "go test ./... -timeout 30m -v"
upstream_tests_exist: true
upstream_test_framework: "go test（官方 make test-unit 即 `go test -v -cover ./...`）：31 个非 integration 的 func Test（根包 27 + downloader 包 4）"

# 计数口径: 31 = 数 `func Test` 顶层测试函数定义,
# 与官方 go test 发现的顶层用例数一致（integration 标签的 TestDownload_HighQuality 不计入）。
upstream_test_total: 31
upstream_test_count_method: "gtest_macros（数 `func Test` 定义，root 27 + downloader 4）"

upstream_test_audit: >-
  youtubedr 2.10.6（github.com/kkdai/youtube/v2，go 1.26）官方测试命令为 go test ./...
  （见 Makefile test-unit）。31 个非 integration func Test 中的纯逻辑/解析用例
  （ExtractVideoId / findVideoID / GetItagInfo / FormatList Filter|Sort / getVideoAudioFormats /
  DownloadWithHighQualityFails / SanitizeFilename / GetChunks / ProtoBuilder / PlayerCache /
  extractPlaylistID / Errors 等）在 OHOS aarch64 上可离线执行；其余约 17 个用例直接访问
  YouTube 网络端点（真实 GetVideo/GetPlaylist/GetStream/字幕/下载），在无外网或 YouTube 受限的
  OHOS 沙盒里会失败/超时，属于环境性 gap，按 test_failure/ohos_feature 如实上报，不包装成通过。
  精确的 discovered/passed/failed 以真机 go test 输出为准（见 HMBS_UPSTREAM_TEST_RESULT），
  不以估值替代。go test 整包编译失败（无任何 === RUN 行）在配方视为硬故障直接抛出。

upstream_tests:
  - file: 根包 *_test.go（client/video/format_list/transcript/utils/itag/player_cache/playlist/protobuilder/errors）
    source: youtube-2.10.6/*_test.go
    description: "根包 27 个 func Test；其中约 17 个直接访问 YouTube 网络端点，纯解析/逻辑用例可离线跑"
    command: "go test ./..."

  - file: downloader/*_test.go
    source: youtube-2.10.6/downloader/*_test.go
    description: "downloader 包 4 个非 integration 的 func Test（TestDownload_FirstStream 需网络，其余离线纯逻辑）"
    command: "go test ./..."

test_package_tests:
  - file: test.sh
    description: "运行打包产物 youtubedr version（断言输出含 2.10.6 与 Version 字段）与 youtubedr --help（断言输出 cobra help 的 'for more information about a command'，因 Short+Long 并存时 cobra 显示 Long，故不含 'Youtube downloader'）；R34 反空壳：真实执行被测包二进制"
    command: "bash test.sh <bin/youtubedr>"

assertion_count: 3
