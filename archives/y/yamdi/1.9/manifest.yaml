# 版本级 manifest —— yamdi 1.9
# 遵循 ARCHIVE-SPEC v2.0

version: "1.9"
software: yamdi

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-19"
build_system: makefile

source:
  url: "https://github.com/ioppermann/yamdi/archive/refs/tags/1.9.tar.gz"
  sha256: "c9f1b2a31cf9bee994581140f652bf8cf85189a821f5b7ceda5f9637123f9126"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "上游 Makefile 硬编码 gcc 且 install 规则要求 root+/usr/local——配方改为直接用 profile 编译器编译单文件（CC 取自 tools.build:compiler_executables）"
    - "构建环境显式清空 LD_LIBRARY_PATH（部分 CI worker 的 ambient 指向不兼容 libxml2 会破坏 SDK lld——同 libodfgen/libabw 根因）"
  dependencies: []
  cc: clang

patches_applied:
  - "patches/0001-help-version-exit-zero.patch：main() 在 getopt 前拦截 --version/--help，打印用法并以 0 退出（上游 plain getopt 在 musl 对长选项直接报未知选项退出 1，平台 smoke test 与 CLI 惯例要求帮助/版本探针可成功退出）"

knowledge_gained:
  - "单文件 C 工具（无构建系统实质内容）的最简配方形态：build() 内直接 $(CC) 编译，绕过硬编码 gcc 的上游 Makefile"
  - "musl getopt 不识别 --help/--version 长选项（返回 '?' 直接退出 1），L2 smoke test 前需确认 CLI 探针可退出 0"
