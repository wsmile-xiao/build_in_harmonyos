# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: yamdi/1.9
homepage: "https://github.com/ioppermann/yamdi"

# 上游**没有**测试套件：全仓仅 yamdi.c 单源文件 + Makefile，无 tests/ 目录、
# 无测试目标（清点证据：ls 全仓 7 个条目，grep -i test 命中 0）。
upstream_check_command: "上游无测试套件（0 项），无可运行入口"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_yamdi.sh
    description: >-
      CLI 功能测试（8 项断言）：--version 探针退出 0 且输出版本串（1 项）→
      base64 解码最小 FLV 夹具（1 项）→ yamdi -i/-o/-x 注入产出非空文件且
      体积增长（2 项）→ 输出含 onMetaData（1 项）→ XML 导出含
      hasMetadata=true 与文件条目（2 项）→ 负例：无 -i 参数非零退出（1 项）；
      任一失败即非零退出。
