patches:
  "1.9":
    - patch_file: "patches/0001-help-version-exit-zero.patch"
      patch_description: "main() 在 getopt 前拦截 --version/--help：打印用法并以 0 退出——上游 plain getopt 在 musl 上对 --help/--version 直接报未知选项退出 1，且 -h 也退出 1（YAMDI_ERROR），平台 smoke test 与常规 CLI 约定均要求帮助/版本探针可成功退出"
      patch_type: "portability"
