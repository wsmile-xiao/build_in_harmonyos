software: ytfzf
display: "ytfzf"
description: "A POSIX shell script to find and watch YouTube videos from the terminal (Without API)"
category: network
homepage: "https://github.com/pystardust/ytfzf"
license: GPL-3.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 shell 脚本工具，无需 configure/make 编译，直接 make install DESTDIR 模式"
    - "使用 ${TMPDIR:-/tmp}，正确适配 HarmonyOS TMPDIR 机制"
    - "运行时依赖 jq，未安装时 ytfzf --version 直接报错"
  common_dependencies:
    - jq
    - curl
    - fzf

versions:
  "2.6.2":
    status: built
    build_date: "2026-06-02"