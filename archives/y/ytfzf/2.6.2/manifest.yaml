software: ytfzf
build_system: makefile

# ============================================================
# 必须字段
# ============================================================

version: "2.6.2"

status: built

build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/pystardust/ytfzf/archive/refs/tags/v2.6.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "DESTDIR=$TEST_PREFIX"
  dependencies: []
  runtime_dependencies:
    - "jq"
    - "curl"
    - "fzf"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ytfzf 是纯 shell 脚本工具，无需 configure/make 编译，直接 make install PREFIX DESTDIR 模式"
  - "需同时执行 make install doc addons 三个目标"
  - "Makefile 的 install 步骤自动用 sed 替换 YTFZF_SYSTEM_ADDON_DIR 路径，确保非 /usr/local 前缀下 addons 路径正确"
  - "ytfzf 使用 ${TMPDIR:-/tmp}，正确适配 HarmonyOS TMPDIR 机制，无需 E002 补丁"
  - "运行时依赖 jq，未安装时 ytfzf --version 直接报错"
