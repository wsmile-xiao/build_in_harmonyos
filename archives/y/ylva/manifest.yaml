# 软件级 manifest — ylva
software: ylva
display: "Ylva"
description: "命令行密码管理器：SQLite 条目库 + AES-256-CTR/PBKDF2/HMAC-SHA512 整库加密，支持 LIKE 与正则检索、随机口令生成与终端二维码显示"
category: utility
homepage: "https://github.com/nrosvall/ylva"
upstream_repo: "https://github.com/nrosvall/ylva"
license: "MIT"
language: "c"
build_system: "makefile"
package_type: "application"

ohos_adaptation:
  key_points:
    - "src/Makefile 写死 CC=gcc：用 make 命令行注入 CC/CFLAGS/LDFLAGS（取自 Conan conf，R33），构建系统零补丁"
    - "上游 LIBS 的 -lrt 在 OHOS/musl 上是空壳档案，timer/clock 入口点在 libc，保留上游链接行即可"
    - "<qrcodegen/qrcodegen.h> 与生态内 libqrcodegen 包的平铺头文件布局不一致，用 build-only 转发头复现惯例布局，不改上游源码"
    - "openssl/sqlite3/libqrcodegen 均取静态变体，产物 DT_NEEDED 只有 libc.so（R26）"
    - "状态文件在 $HOME/.ylva.open_db，不写 /tmp（R10）；数据库文件 chmod 0600"
    - "交互口令提示走 termios 关回显，非 tty 的 stdin 会被上游直接判失败，故功能测试在真实 pty 下驱动"
  common_dependencies:
    - openssl
    - sqlite3
    - libqrcodegen

versions:
  "1.7":
    status: built
    build_date: "2026-09-29"
    conan_ref: "ylva/1.7"
