knowledge_gained:
  - "ylva 的 src/Makefile 把 CC 写死为 gcc、CFLAGS 用 ?= 且自带追加，LIBS 是固定列表；GNU make 命令行赋值胜过 makefile 内赋值，故 CC/CFLAGS/LDFLAGS 全部在 make 命令行接管即可零补丁（同类先例 archives/v/vamps/0.99.2、archives/s/secpwgen/1.3）"  # knowledge_ref: R33（编译器取自 conan conf）、R9（-j1）；先例 archives/v/vamps/0.99.2、archives/s/secpwgen/1.3
  - "上游 LIBS 里的 -lrt 在 OHOS/musl 上是空壳：musl 安装空的 librt.a 兼容档案，timer/clock 入口点在 libc 本身；实测 OHOS SDK sysroot 有 usr/lib/aarch64-linux-ohos/librt.a，链接不报错，无需删改上游链接行"  # knowledge_ref: 无需独立条目（musl 空 librt.a 兼容档案，属工具链常识，已写入 README/notes）
  - "ylva 按 Debian libqrcodegen-dev 的布局 include <qrcodegen/qrcodegen.h>，而本生态 libqrcodegen/1.8.0 包把 C 头文件平铺安装为 include/qrcodegen.h；用 build() 生成的 build-only 转发头（<build>/_qrcodegen_compat/qrcodegen/qrcodegen.h 内容一行 #include <qrcodegen.h>）复现惯例布局，上游源码零修改"  # knowledge_ref: 无需独立条目（打包布局差异，非平台问题）
  - "openssl/sqlite3/libqrcodegen 三者在制品仓均为 shared=False 静态变体，链入后产物 DT_NEEDED 只有 libc.so：R26 系统同名库（libcrypto/libssl/libsqlite3）不向 OHOS /lib 投放同名 .so，已固化为 A3 断言"  # knowledge_ref: R26（系统同名库禁止动态链接）
  - "ylva 的加密开销是固定 148 字节（sizeof(int)=4 魔数 + IV 16 + SALT 64 + HMAC-SHA512 64），数据库密文文件大小恰好是明文 +148，可直接作为加解密往返的强断言"  # knowledge_ref: 无需独立条目（包内特性，已固化在 functional_test.py 的 F16 断言）
  - "ylva 用 my_getpass() 关闭终端回显读口令：stdin 不是 tty 时 tcgetattr 直接失败返回 -1 且不写入缓冲区，随后 strcmp(pass, \"\") 读未初始化栈内存（上游缺陷，不属适配范围）；因此交互用例必须在真实 pty 下驱动，参照 archives/n/ne/3.3.4、archives/p/pinentry/1.3.3 的 pty 范式"  # knowledge_ref: 无需独立条目（pty 交互测试范式，先例 archives/n/ne/3.3.4、archives/p/pinentry/1.3.3）
  - "entry_new_empty() 分配 Entry_t 后不初始化字段：db_get_entry_by_id() 未命中时 sqlite 回调不执行，随后 entry_free() 对野指针调用 free()。glibc/macOS 在刚分配的零页上会静默通过，OHOS 的 musl malloc 检出非法释放并以 SIGTRAP 终止（CI 实测 rc=-5）；补丁改为 malloc 后 memset 清零，纯 C 标准库、无平台宏（R8/PF5）"  # knowledge_ref: knowledge/drafts/E429-draft-DF30.kv + .md（本次新增草稿配对，路径 B 配置）
  - "musl 的 stdout 只在遇到换行时刷新（不像 glibc 会在读取行缓冲输入前刷新全部行缓冲输出），ylva 的无换行提示（\"Title: \"）在 OHOS 上不会先出现；pty 用例因此不能以提示出现作为同步点，改为按序写入普通行 + 循环重写口令行直到进程退出（TCSAFLUSH 只丢弃当次未消费的输入，重写可自愈）"  # knowledge_ref: 无需独立条目（musl stdio 行为；已固化在 test_package/functional_test.py 的 pty 驱动说明里）

