# test_package/MANIFEST.yml — ylva 1.7
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径（唯一口径，贯穿 MANIFEST / notes.md / 测试日志 / PR 两张表）：
#   按「独立检查项数量」计数 —— 每个检查项可单独判定成败、单独打印 ok/FAIL。
#   同一检查项在 build() 与 test_package 各执行一次也只计 1 项（A1-A4）。
#   适配后合计 29 项 = 功能 21 项（F1-F21）+ 鸿蒙特有 8 项（A1-A4 + H1-H4）。

package: ylva/1.7
homepage: "https://github.com/nrosvall/ylva"

# ── 上游测试套件存在性（经审计官方 tar 包确认）──────────────────────
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

upstream_test_audit:
  source_tarball: "ylva-1.7.tar.gz (https://github.com/nrosvall/ylva/archive/refs/tags/v1.7.tar.gz)"
  source_sha256: "7c557c0c30a4b3bf0a66cec41e909d491bc84a575e9fc7c0942b8d158bf199cc"
  upstream_tag: "v1.7 (NEWS: Release 1.7 - 2021-09-11)"
  build_system: "手写 src/Makefile（无 configure / 无 CMake / 无 meson；README 只说明 make && make install）"
  scanned_for:
    - "tests/ 或 test/ 目录"
    - "src/Makefile 中的 check / test 目标"
    - "gtest / criterion / check / CUnit 等 C 测试框架绑定"
    - "*_test.c / test_*.c 命名的测试源文件"
    - "*.sh / *.spec / corpus / fixture 等候选资产"
  scan_result: "tarball 共 27 个条目 / 24 个文件：.gitignore、INSTALL、LICENSE、NEWS、README.md、ylva.png、src/{Makefile, ylva.1, ylva.c, cmd_ui.c/.h, crypto.c/.h, db.c/.h, entry.c/.h, pwd-gen.c/.h, qr.c/.h, regexfind.c/.h, utils.c/.h}。无 tests/ 或 test/ 目录；src/Makefile 的目标只有 all/%.o/ylva/clean/install/uninstall，无 check 或 test 目标；无第三方测试框架依赖；无 *_test.c、test_*.c、.sh、.spec 或语料/夹具目录。"
  reason: "ylva 1.7 上游无任何测试框架与测试目标（src/Makefile 只有 all/install/uninstall/clean），按 no_tests 处理；适配后由 test_package 补全 29 个独立检查项。"

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ── test_package 自带的功能测试（上游无测试，适配后补全）────────────
# 执行位置: test_package/functional_test.py（can_run() 为真时在 HarmonyOS 上实跑）
test_package_tests:
  - file: functional_test.py
    description: >-
      功能补全 21 项（F1-F21），覆盖上游全部文档化 CLI 能力：
      F1 -v 输出版本 1.7；F2 -h 与 F3 无参数输出 SYNOPSIS/OPTIONS 且 rc=0；
      F4 -g 24 生成长度恰为 24 且字符属于上游字母表的口令；
      F5 -g 0 因 length<1 不输出且 rc=0；F6 -i 建立真正的 SQLite 库
      （文件头 "SQLite format 3\0"）；F7 -p 回显当前库路径；F8 空库 -A 无条目；
      F9 -l 1 报 "Nothing found with id 1"；F10 无活动库时 -E 拒绝；
      F11 对明文文件 -D 报 "File is already decrypted or malformed?"；
      F12 空库正则检索、F13 空库 -t、F14 空库 -q 均干净返回；
      F15 在真实 pty 上走 -a 交互新增（空口令触发内置生成器）；
      F16 -A --show-passwords 显示条目与 20 位生成口令；
      F17 -f（LIKE）命中且口令被掩码；F18 -F（POSIX 正则）命中；
      F19 -l 1 --show-passwords 显示全部字段与 Modified 时间戳；
      F20 -q 快速检索回显真实口令；
      F21 加解密往返：-E 后密文恰比明文大 148 字节（4 魔数 + IV 16 +
      SALT 64 + HMAC-SHA512 64），错误口令被 HMAC 校验拒绝且密文不被改动，
      正确口令 -D 后体积复原、条目与口令完好。
    command: "python3 functional_test.py --bindir <pkg>/bin"
    assertion_count: 21

# ── 鸿蒙特有测试（rule12: N >= 1，本包 N = 8）──────────────────────
harmonyos_specific_tests:
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A1: 产物为 ELF64 小端且 e_machine == EM_AARCH64(183)，
      即 HarmonyOS PC arm64 目标（交叉编译三元组 aarch64-linux-ohos 生效）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/ylva"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A2: .interp == /lib/ld-musl-aarch64.so.1，即鸿蒙 musl 动态
      加载器；glibc 产物会是 /lib/ld-linux-aarch64.so.1，故该断言可区分
      工具链/sysroot 是否真的指向 OHOS。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/ylva"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A3: DT_NEEDED 不含 libcrypto/libssl/libsqlite3/libqrcodegen
      （实测只有 libc.so）。R26 要求系统同名库静态链接，避免向鸿蒙 /lib
      投放同名 .so；该断言把这条平台约束固化成可执行检查。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/ylva"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A4: .dynamic 中不存在 DT_RPATH/DT_RUNPATH。OHOS 包会被装载到
      版本化前缀并从 conan 缓存搬移，构建期 RPATH 会让加载器去找只存在于
      构建机的库；产物必须依赖 OHOS 系统搜索路径。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/ylva"
    assertion_count: 1
  - file: functional_test.py
    description: >-
      鸿蒙特有 H1: 鸿蒙应用沙箱的 HOME 语义。ylva 把"当前数据库"记在
      $HOME/.ylva.open_db，本项断言 -i 之后该文件确实落在沙箱 HOME 下、
      内容等于传入的数据库路径，且 -p 回显同一路径。
    command: "python3 functional_test.py --bindir <pkg>/bin"
    assertion_count: 1
  - file: functional_test.py
    description: >-
      鸿蒙特有 H2: HMDFS 权限归一化。set_file_owner_rw() 请求 0600，鸿蒙
      HMDFS 会把权限归一化（历史实测 700→760 类改写），故断言不写死 0600，
      而是要求属主有 rw 且 other 位为 0 —— 即数据库文件对该沙箱之外的
      用户不可读。
    command: "python3 functional_test.py --bindir <pkg>/bin"
    assertion_count: 1
  - file: functional_test.py
    description: >-
      鸿蒙特有 H3: SQLite 的 datetime('now','localtime') 在 OHOS 上必须
      解析出真实本地时间。断言 -l 1 输出的 Modified 时间戳形如
      YYYY-MM-DD HH:MM:SS 且与当天相差不超过 2 天（1970 或空值会失败）。
    command: "python3 functional_test.py --bindir <pkg>/bin"
    assertion_count: 1
  - file: functional_test.py
    description: >-
      鸿蒙特有 H4: 二维码渲染的 UTF-8 输出。qr.c 用 U+2585（UTF-8 e2 96 85）
      半块字符绘制终端二维码，本项断言 --show-qrcode 输出至少含 100 组
      该字符且未报 "Unable to generate QR code" —— 同时证明 libqrcodegen
      链接成功与鸿蒙终端上的 UTF-8 处理正确。
    command: "python3 functional_test.py --bindir <pkg>/bin"
    assertion_count: 1

# 测试断言总数（独立检查项：功能 21 + 鸿蒙特有 8）
assertion_count: 29
test_package_test_count: 21
harmonyos_specific_test_count: 8
count_method: "independent_check_items"
