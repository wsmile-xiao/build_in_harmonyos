# conandata.yml - ylva 1.7
#
# 上游源码: GitHub 官方仓库 nrosvall/ylva 的 tag v1.7（作者 Niko Rosvall）。
#   https://github.com/nrosvall/ylva/archive/refs/tags/v1.7.tar.gz
#   sha256 = 7c557c0c30a4b3bf0a66cec41e909d491bc84a575e9fc7c0942b8d158bf199cc
#   （本地真实 GET 下载校验；tarball 共 24 个文件，NEWS 记录 Release 1.7 = 2021-09-11）
#   该 tag 同时也是 Debian ylva 1.7-2（bookworm/trixie/forky, main）与 FreeBSD ports
#   的来源，不是 Debian 重打包产物（R39/PF7）。
#
# 注意（R39/PF7）：此处只写官方源，不手写镜像前缀。ci/conan/build_and_test.sh
#   会在运行时自动加镜像回退；写进版本库反而会被 create-pr 的 PF7 源URL闸判为违规。
#
# 补丁共 1 个（见下方 patches 段）：entry_new_empty() 的未初始化结构体修复。
#   qrcodegen 头文件布局差异不落补丁，由 conanfile.py build() 生成的 build-only
#   转发头解决。

sources:
  url: "https://github.com/nrosvall/ylva/archive/refs/tags/v1.7.tar.gz"
  sha256: "7c557c0c30a4b3bf0a66cec41e909d491bc84a575e9fc7c0942b8d158bf199cc"

patches:
  - patch_file: "patches/0001-src-entry.c.patch"
    patch_description: >-
      entry_new_empty() 用 malloc 分配 Entry_t 后从不初始化字段，db_get_entry_by_id()
      查不到行时 sqlite 回调不会执行，list_by_id()/edit_entry()/copy_entry() 随即对
      该结构体调用 entry_free()，于是 free() 收到 title/user/url/password/notes/next
      这些野指针。glibc/macOS 在整页刚分配、内容恰为 0 时会静默通过，OHOS 的 musl
      malloc 会检出非法释放并以 SIGTRAP 终止（实测 CI rc=-5；macOS 打开
      MallocScribble 后同样复现 invalid free，rc=134）。修复方式是在 malloc 之后
      memset 清零整个结构体 —— 纯 C 标准库调用，对非鸿蒙平台语义等价（这些字段在
      成功路径上随后会被赋值），不含任何平台宏（R8/PF5）。
    patch_type: "bugfix"
