# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: yell/1.1
homepage: "https://www.critical.ch/yell/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游没有测试套件：tarball 只含 Makefile / yell.c / yell.h / README 四个
# 文件，Makefile 仅有 default / install / deinstall 三个目标（default 只
# 打印提示），不存在 check/test 目标，`make -n check` 输出
# "make: *** No rule to make target 'check'"。上游也无任何测试框架文件。
# 因此上游测试计 0 项；功能验证由本 test_package 的 test.sh 端到端断言
# （T1–T6，对安装出的 bin/yell 实测）承担。

upstream_test_notes: >
  上游 Makefile 无 check 目标（仅 default/install/deinstall），无测试框架
  与任何测试文件，上游官方测试 = 0 项。test.sh 的 6 项断言为鸿蒙侧补测：
  T1 安装产物存在可执行、T2 ELF64/AArch64、T3 DT_NEEDED 仅 libc.so、
  T4 无 speaker 设备时退出码 0（优雅降级契约）、T5 运行无任何输出、
  T6 二次运行幂等退出 0。
