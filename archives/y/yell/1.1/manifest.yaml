# 版本级 manifest — yell 1.1
version: "1.1"
software: "yell"
conan_ref: "yell/1.1"
status: built
build_date: "2026-09-28"
build_system: makefile

source:
  url: "http://distcache.freebsd.org/local-distfiles/ehaupt/yell-1.1.tar.gz"
  sha256: "aadc8e5babde0116253312b58be1ea940ddee7fbeadb2e21d9eb98a1cb7cabc6"
  tar_format: tar.gz
  note: >
    critical.ch/yell（作者 ehaupt，FreeBSD audio/yell port 的 MAINTAINER）
    经 FreeBSD distcache local-distfiles 分发（port Makefile
    MASTER_SITES= LOCAL/ehaupt）。发布物仅 4 个文件（Makefile / yell.c /
    yell.h / README）。许可证 BSD2CLAUSE（FreeBSD port 记录；tarball 内无
    许可证文件，归档侧以 licenses/LICENSE 说明 + 上游 README 兜底）。
    作者官网 HTTP 直链会 302 到 HTTPS，而 OHOS 环境 HTTPS 在 TLS 握手后被
    RST 阻断（知识库既有约束），故固定 distcache HTTP 直链（实测 200，
    SHA256 与 FreshPorts 记录一致）。

build:
  system: makefile
  target: "FreeBSD port do-build 单行命令的等价单次调用（yell.c -> yell）"
  configure_options:
    - '-O3 -DNDEBUG -Wall  # 沿用上游 Makefile 的 COPT=-O3 release 语义并加告警'
    - '> yell-build.log 2>&1  # 必需：/system/bin/sh 做 recipe shell 时编译器 stdio 直连捕获管道会静默退出 1'
  dependencies: []          # 零外部依赖：唯一系统要求是 libc（open/write/close）
  cc: clang

patches_applied:
  - "patches/0001-speaker-include-unistd.patch  # <dev/speaker/speaker.h>（FreeBSD 内核头，声明未被使用）替换为 <unistd.h>（补 write/close 显式声明）"

# 扁平汇总键（仓内既有约定：170+ 个包用 test_passed/test_failed，
# submission 的 PR body 生成器与部分门禁读这三个扁平键）
test_total: 0               # 上游无测试套件（Makefile 无 check 目标）
test_passed: 0
test_failed: 0
upstream_test_total: 0
test_package_total: 6       # 鸿蒙特有断言（对安装出来的 bin/yell 实测）
test_package_passed: 6
test_package_failed: 0

package_contents:
  - "bin/yell"
  - "licenses/README"
  - "licenses/LICENSE"
# licenses/LICENSE = 许可证归属说明 + BSD-2-Clause 标准文本（tarball 内无
# 许可证文件，FreeBSD port 记录 LICENSE= BSD2CLAUSE）

test_results:
  upstream:
    type: official
    total: 0
    passed: 0
    failed: 0
    command: ""
    note: >
      上游无测试套件：Makefile 仅有 default（打印提示）/ install /
      deinstall 三个目标，无 check/test 目标，也无任何测试框架文件。
  test_package:
    type: ohos_extra
    total: 6
    passed: 6
    failed: 0
    command: "conan create（test_package/test.sh，解释器取 $CONFIG_SHELL，否则按固定候选清单探测 bash）"
    note: "T1 安装产物存在且可执行、T2 ELF64/AArch64（readelf -h）、T3 DT_NEEDED 仅 libc.so、T4 无 /dev/speaker 时退出码 0（yell.c 的 open 结果有 if (handle >= 0) 守卫，优雅降级契约）、T5 运行无任何输出、T6 二次运行幂等退出 0。脚本以 set -euo pipefail 开头。"

validation:
  native_build:
    status: built
    command: "conan create archives/y/yell/1.1 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --build=missing --user=ohpcd --channel=stable"
    note: "clang 15.0.4，-Wall 无告警，产物 bin/yell，DT_NEEDED 仅 libc.so"
  upstream_tests:
    status: built
    command: ""
    note: "上游无测试套件（Makefile 无 check 目标）"
  conan_verify:
    status: built
    command: "ohc-run.py conan-verify yell 1.1"
    levels:
      G0: pass         # 零外部依赖，无依赖预查询可执行
      G1: pass
      G2: pass
      G3: pass         # 无 lib/ → 无系统同名库可冲突
      G4: skipped      # application 包无 lib/，工具报『无法找到程序包 ID』——未执行，不计入通过
      L2: skipped      # 跳过（无 cache 路径）——未执行，不计入通过
      L4: skipped      # 跳过（无 cache 路径）——未执行，不计入通过
      L5: skipped      # 跳过（无 cache 路径）——未执行，不计入通过
    verdict: "以 conan-verify 实际报告为准（application 类型包 G4/L2/L4/L5 按既有口径记跳过，真实证据以 test_package 6/6 断言为准）"
    supplement: "reports/conan-verify-report.md"

knowledge_gained:
  - "yell 1.1 唯一的不兼容点是 #include <dev/speaker/speaker.h>（FreeBSD 内核头，代码未使用其中任何声明）；移植时不能只删该 include——write/close 在 FreeBSD 上经 speaker 头传递引入，必须换成 <unistd.h> 补显式声明，否则 clang 报隐式声明告警（-Werror 环境会直接失败）（knowledge_ref: knowledge/drafts/yell-1.1-speaker-include-unistd.kv）"
  - "FreeBSD port 的 ONLY_FOR_ARCHS=i386 amd64 来自内核 speaker(4) 设备而非 C 源码，纯用户态 syscalls（open/write/close）的 C 代码本身可移植 aarch64；port 的 do-build 单行命令可直接作为 Conan 配方的 build 等价物（knowledge_ref: knowledge/drafts/yell-1.1-speaker-include-unistd.kv）"
  - "上游 Makefile 的 install 目标硬编码 BINDIR=/usr/local/bin + chown root + chmod 4110（setuid），Conan 配方必须绕开改用 package() 手工 copy；同理 setuid 场景在 OHOS 沙箱无意义（knowledge_ref: knowledge/drafts/yell-1.1-speaker-include-unistd.kv）"

knowledge_ref:
  - "knowledge/drafts/yell-1.1-speaker-include-unistd.kv"
