# conandata.yml — yell 1.1
#
# 上游: critical.ch/yell（作者 ehaupt，即 FreeBSD audio/yell port 的
#       MAINTAINER），经 FreeBSD distcache 的 local-distfiles 分发
#       （port Makefile: MASTER_SITES= LOCAL/ehaupt）。FreshPorts 与
#       作者官网均记录 SHA256 与 SIZE（919 字节），本文件与之一致。
# 版本: 1.1（2002-12-06 文件时间戳，上游最后一次发布）
# 内容: Makefile / yell.c / yell.h / README（共 4 个文件）
# 许可证: BSD2CLAUSE（FreeBSD port 记录；tarball 内无许可证文件，
#         归档侧以 licenses/LICENSE 说明 + 上游 README 兜底）
#
# 注意：本文件（含注释）只保留下面 sources.url 一处 URL 字面量。
# CI 的 mirror-fallback 与 Pre-download 两步会按「文件中出现的全部 URL」
# 做字符串替换：注释里再写仓库地址或官网地址会被当成源码 URL 一并预下载，
# 而裸仓库地址又是 tarball 地址的前缀，替换后会把 sources.url 改写回
# 镜像/畸形路径，source() 随即失败（zpaq 7.15 实证）。
# 另：作者官网 www.critical.ch 对该 tarball 的 HTTP 路径会 302 到 HTTPS，
# 而 OHOS 环境下 HTTPS 在 TLS 握手后被 RST 阻断（知识库既有约束），
# 故 sources.url 固定用 distcache 的 HTTP 直链（实测 200，SHA256 与
# FreshPorts 记录一致）。

sources:
  url: "http://distcache.freebsd.org/local-distfiles/ehaupt/yell-1.1.tar.gz"
  sha256: "aadc8e5babde0116253312b58be1ea940ddee7fbeadb2e21d9eb98a1cb7cabc6"

patches:
  "1.1":
    - patch_file: "patches/0001-yell.c.patch"
      patch_description: "yell.c：<dev/speaker/speaker.h>（FreeBSD 内核头，OHOS 无且其声明未被使用）替换为 <unistd.h>（补上 write/close 的显式声明——FreeBSD 上这两个符号经 speaker 头传递引入，仅删不加会触发隐式声明错误）"
      patch_type: "portability"
