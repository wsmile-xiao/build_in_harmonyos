# test_package/MANIFEST.yml
# 上游测试声明 + 本包测试清单（CI 门禁 build_and_test.sh 要求此文件存在）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# ── 上游测试清点（R51 三步法第一步，适配前在源码包内实测） ──────────────
# 清点对象: ydpdict-1.0.5.tar.gz（437989 字节，
#           sha256 024d1b2116dd8a529950e6cde0b430c0b7a425bc3cc403129ebac3779750b68e）
# 清点命令与结果:
#   $ find . -name "tests" -o -name "test" -o -name "*test*" | head
#     → m4/progtest.m4           (gettext 的 AM_PATH_PROG_WITH_TEST 宏，非测试程序)
#   $ grep -rn "TESTS\|check_PROGRAMS\|check-local" Makefile.am src/Makefile.am contrib/Makefile.am
#     → 无匹配。根 Makefile.am: SUBDIRS = src contrib po；src/Makefile.am 仅
#       bin_PROGRAMS = ydpdict（单一可执行目标）
#   → 上游发布包不提供任何测试用例（场景三：消费者测试由适配方补全）

package: ydpdict/1.0.5-1.1
homepage: "https://toxygen.net/ydpdict/"

# 上游 check 目标：Makefile.am 未定义 TESTS/check_PROGRAMS，`make check` 为空目标
upstream_check_command: "make check"
# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试程序（清点结果为 0）
upstream_tests: []

# 适配方补全的测试（消费者视角，全部在 test_package/test() 中实际运行）
test_package_tests:
  - file: test_consumer.c
    description: >
      消费者用例（C，链接被测包依赖的词典引擎 libydpdict）：版本契约、
      词典打开失败路径（文件缺失 / 索引 magic 错误 / 索引截断）、空指针守护、
      cp1250 与音标编码转换 —— 16 条断言，真实调用公开 API 并创建样本文件
    command: "./test_consumer"
    assertion_count: 16
  - file: test_app.sh
    description: >
      平台契约 + TUI 端到端：OHOS-1..4（bin/ydpdict 存在且可执行、AArch64 ELF、
      DT_NEEDED 无共享 curses 库、DT_NEEDED 无绝对路径条目）、TUI-1..2（伪终端下
      启动渲染并以退出键或 SIGTERM 兜底终止 rc=0、首屏渲染出 ydpdict 文案）、
      CONSUMER-C（消费者程序全部断言通过）—— 7 条断言。上游 main() 解析参数后
      无条件 initscr()，没有 --version/--help 非交互分支，故不设 CLI 断言
    command: "sh test_app.sh <package_folder> bin/ydpdict ./test_consumer <terminfo>"
    assertion_count: 7
  - file: pty_drive.py
    description: >
      test_app.sh 的运行时支撑：分配伪终端、自动挑选本机真实存在的 TERM、
      按 TERMINFO_DIRS 多目录发现 terminfo、采集首屏，退出键无效时以 SIGTERM
      兜底终止（TUI 无法用管道验证）
    command: "python3 pty_drive.py bin/ydpdict dump.bin 30"

# 断言总数：test_app.sh 7 条（平台 OHOS-1..4 + TUI-1..2 = 6，加消费者程序 1）
# + test_consumer.c 内部 16 条 = 23。实测输出: "platform-check assertions=7 failures=0"
assertion_count: 23
