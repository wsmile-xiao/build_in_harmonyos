# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.5-1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.5-1.1"

# 软件名
software: "ydpdict"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/wojtekka/ydpdict/releases/download/1.0.5/ydpdict-1.0.5.tar.gz"

  # 源码校验和
  sha256: "024d1b2116dd8a529950e6cde0b430c0b7a425bc3cc403129ebac3779750b68e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--without-libao"   # 可选音频后端 libao 未适配，缺失时 configure 静默降级
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ncurses/6.6"       # 需 Unicode 版：configure 要求 ncursesw 头与 -lncursesw
    - "libydpdict/1.0.4"  # 词典引擎
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"   # config.guess: HarmonyOS 主机三元组归一化为 *-unknown-linux-ohos
  - "0002-config.sub.patch"     # config.sub: OS 白名单增加 ohos*
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autotools 的 AC_CHECK_HEADER(ncursesw/ncurses.h) 不搜索依赖包路径：profile [buildenv] 的 CPPFLAGS/LDFLAGS 会覆盖 generate() 注入，须在 build() 用命令前缀强制 -I/-L"
  - "config.guess/config.sub 缺 ohos 支持时 configure 直接失败（E007）；按主机三元组分支 + OS 白名单分支打补丁即可，无需平台宏"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/ydpdict-1.0.5-1.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/ydpdict-1.0.5-1.1.work
  source_orig_hash: e1ff42341cf5f50a
  source_work_hash: a75fb74dd76e9ad1
  generated_at: '2026-09-29T15:31:17'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'config.guess: *:HarmonyOS:*:* 三元组分支'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'config.sub: OS 白名单 ohos* 分支'
