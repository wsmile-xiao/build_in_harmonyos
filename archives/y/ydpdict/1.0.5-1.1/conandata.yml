sources:
  "1.0.5-1.1":
    url:
      - "https://github.com/wojtekka/ydpdict/releases/download/1.0.5/ydpdict-1.0.5.tar.gz"
    sha256: "024d1b2116dd8a529950e6cde0b430c0b7a425bc3cc403129ebac3779750b68e"

# 上游 config.guess / config.sub 为 2022-05-25 版本，不认识构建机返回的
# uname -s=HarmonyOS，configure 直接报 "cannot guess build type; you must
# specify one"（知识条目 E007）。两枚补丁与 libydpdict/1.0.4 同源同构，属该
# 家族已验证修法（E007 标准做法：改 config.guess/config.sub，而非加
# --build/--host/--target 参数）：
#   0001-config.guess.patch —— 增加 *:HarmonyOS:*:* 分支，输出
#                              aarch64-unknown-linux-ohos 三元组；
#   0002-config.sub.patch   —— 接受 -linux-ohos* OS 与裸 aarch64 CPU。
# 两者只改 autotools 构建脚本，不触碰任何被编译源码（R8）。
patches:
  "1.0.5-1.1":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "config.guess: 补充 HarmonyOS 分支，识别 aarch64-unknown-linux-ohos (E007)"
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "config.sub: 接受 linux-ohos 三元组与 aarch64 CPU (E007)"
      patch_type: "portability"
