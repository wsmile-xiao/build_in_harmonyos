# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: yyjson/0.10.0
homepage: "https://github.com/ibireme/yyjson"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_allocator.c
    source: yyjson-0.10.0/test/test_allocator.c
    description: "内存分配器测试"
    command: "./test_allocator"
  - file: test/test_err_code.c
    source: yyjson-0.10.0/test/test_err_code.c
    description: "错误码测试"
    command: "./test_err_code"
  - file: test/test_json_merge_patch.c
    source: yyjson-0.10.0/test/test_json_merge_patch.c
    description: "JSON Merge Patch 测试"
    command: "./test_json_merge_patch"
  - file: test/test_json_mut_val.c
    source: yyjson-0.10.0/test/test_json_mut_val.c
    description: "可变 JSON 值测试"
    command: "./test_json_mut_val"
  - file: test/test_json_patch.c
    source: yyjson-0.10.0/test/test_json_patch.c
    description: "JSON Patch 测试"
    command: "./test_json_patch"
  - file: test/test_json_pointer.c
    source: yyjson-0.10.0/test/test_json_pointer.c
    description: "JSON Pointer 测试"
    command: "./test_json_pointer"
  - file: test/test_json_reader.c
    source: yyjson-0.10.0/test/test_json_reader.c
    description: "JSON 读取器测试"
    command: "./test_json_reader"
  - file: test/test_json_val.c
    source: yyjson-0.10.0/test/test_json_val.c
    description: "JSON 值测试"
    command: "./test_json_val"
  - file: test/test_json_writer.c
    source: yyjson-0.10.0/test/test_json_writer.c
    description: "JSON 写入器测试"
    command: "./test_json_writer"
  - file: test/test_number.c
    source: yyjson-0.10.0/test/test_number.c
    description: "数字解析测试"
    command: "./test_number"
  - file: test/test_roundtrip.c
    source: yyjson-0.10.0/test/test_roundtrip.c
    description: "JSON 往返测试"
    command: "./test_roundtrip"
  - file: test/test_string.c
    source: yyjson-0.10.0/test/test_string.c
    description: "字符串处理测试"
    command: "./test_string"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: yyjson read/write/mut API"
    command: "./test_yyjson"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
