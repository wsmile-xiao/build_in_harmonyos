# test_package/MANIFEST.yml
# 上游测试与消费者测试声明

package: yyjson/0.13.0
homepage: "https://github.com/ibireme/yyjson"

upstream_check_command: "cmake --build <build_folder> --target test"
upstream_test_in_build: true
upstream_test_command: "cmake --build <build_folder> --target test"

upstream_tests:
  - file: test/test_allocator.c
    source: yyjson-0.13.0/test/test_allocator.c
    description: "Allocator tests - custom allocator callbacks"
    command: "./test_allocator"
  - file: test/test_err_code.c
    source: yyjson-0.13.0/test/test_err_code.c
    description: "Error code tests"
    command: "./test_err_code"
  - file: test/test_json_merge_patch.c
    source: yyjson-0.13.0/test/test_json_merge_patch.c
    description: "JSON Merge Patch tests"
    command: "./test_json_merge_patch"
  - file: test/test_json_mut_val.c
    source: yyjson-0.13.0/test/test_json_mut_val.c
    description: "Mutable JSON value tests"
    command: "./test_json_mut_val"
  - file: test/test_json_patch.c
    source: yyjson-0.13.0/test/test_json_patch.c
    description: "JSON Patch tests"
    command: "./test_json_patch"
  - file: test/test_json_pointer.c
    source: yyjson-0.13.0/test/test_json_pointer.c
    description: "JSON Pointer tests"
    command: "./test_json_pointer"
  - file: test/test_json_reader.c
    source: yyjson-0.13.0/test/test_json_reader.c
    description: "JSON reader tests - parsing and validation"
    command: "./test_json_reader"
  - file: test/test_json_val.c
    source: yyjson-0.13.0/test/test_json_val.c
    description: "JSON value type and access tests"
    command: "./test_json_val"
  - file: test/test_json_writer.c
    source: yyjson-0.13.0/test/test_json_writer.c
    description: "JSON writer tests - serialization"
    command: "./test_json_writer"
  - file: test/test_number.c
    source: yyjson-0.13.0/test/test_number.c
    description: "Number parsing and formatting tests"
    command: "./test_number"
  - file: test/test_roundtrip.c
    source: yyjson-0.13.0/test/test_roundtrip.c
    description: "Round-trip read/write tests"
    command: "./test_roundtrip"
  - file: test/test_string.c
    source: yyjson-0.13.0/test/test_string.c
    description: "String escaping and encoding tests"
    command: "./test_string"

test_package_tests:
  - file: test.c
    description: "Consumer test - parse JSON, access fields, and write mutable JSON"
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    assertion_count: 4

assertion_count: 4