sources:
  "4.05.01":
    url: "https://gitlab.com/fbb-git/yodl/-/archive/4.05.01/yodl-4.05.01.tar.bz2"
    sha256: "9591b2fdba60d8e9c37edd8c61ea3e13e7a224ee5783cda9cfcef2773ac7c84b"
patches:
  "4.05.01":
    - patch_file: "patches/0001-portable-interpreter-shebangs.patch"
      patch_description: >-
        Use /usr/bin/env for Perl macro generation, its Bash helper, and
        converter scripts because HarmonyOS HNP installs interpreters outside
        the upstream /usr/bin and /bin paths.
      patch_type: "portability"
    - patch_file: "patches/0002-include-stdbool-for-c-sources.patch"
      patch_description: >-
        Include the C99 standard bool definitions from the shared upstream
        root header, which is required by the C sources on HarmonyOS clang.
      patch_type: "portability"
