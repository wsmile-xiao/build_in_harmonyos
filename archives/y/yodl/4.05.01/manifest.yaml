version: "4.05.01"
software: yodl
status: built
build_date: "2026-09-27"
conan_ref: "yodl/4.05.01"
build_system: cmake

source:
  url: "https://gitlab.com/fbb-git/yodl/-/archive/4.05.01/yodl-4.05.01.tar.bz2"
  sha256: "9591b2fdba60d8e9c37edd8c61ea3e13e7a224ee5783cda9cfcef2773ac7c84b"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "Conan CMakeToolchain with the OHOS 6.0 armv8 profile"
    - "C99 for upstream C sources and C++17 for yodlverbinsert"
    - "Single-job build on HarmonyOS HNP"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-portable-interpreter-shebangs.patch"
  - "0002-include-stdbool-for-c-sources.patch"

test_results:
  upstream_tests: 0
  upstream_test_status: "The upstream source archive has no test suite or test/check target."
  conan_test_package: PASS
  harmonyos_specific_test: "PASS: HarmonyOS/aarch64 runtime, Yodl text conversion, yodlverbinsert all-lines mode, and missing-input error handling."

quality_gates:
  local_ci: PASS
  L0_recipe_and_package_structure: PASS
  L1_conan_create_and_consumer_test: PASS
  R34_destructive_negative_test: PASS
  L2_smoke: "PASS; optional --version/--help probes warn for yodl2ms, yodl2sgml, yodlpost, and yodlverbinsert, which do not implement those options."
  L4_patch_scan: PASS
  L5_package_artifacts: PASS

knowledge_gained:
  - "The upstream shared C header used bool without including stdbool.h; adding the standard header restores C99 compilation with HarmonyOS clang."
  - "Adding each component directory to the global C include search path lets the project's string/string.h shadow the system string.h; source-relative includes work without those component include directories."
  - "The upstream icmake orchestration can be replaced by CMake while preserving generated builtin declarations, macro data, and converter scripts."
