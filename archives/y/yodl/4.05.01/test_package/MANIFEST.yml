# Upstream source distribution inventory for yodl/4.05.01.
package: yodl/4.05.01
homepage: "https://fbb-git.gitlab.io/yodl/"

# The official 4.05.01 source archive has no tests/ directory and its build
# script exposes build actions for programs, macros, and documentation only.
upstream_check_command: >-
  on the extracted official yodl-4.05.01.tar.bz2 source tree, find directories
  named tests or test, then grep CMakeLists.txt, *.cmake, Makefile, Makefile.in,
  *.mk, *.im, and icmake* for add_test, enable_testing, pytest, unittest,
  ^test:, or ^check:; both directory searches and the registration/target scan
  returned no output
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_package/test_yodl.sh
    description: >-
      HarmonyOS PC consumer test: asserts HarmonyOS and aarch64 at runtime,
      checks Yodl reports 4.05.01, converts a Yodl document to text, exercises
      yodlverbinsert's all-lines input mode, then verifies missing input fails.
