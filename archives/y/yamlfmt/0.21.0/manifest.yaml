software: yamlfmt
version: "0.21.0"
build_system: custom
status: built
build_date: "2026-06-15"

source:
  url: "https://github.com/google/yamlfmt/archive/refs/tags/v0.21.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOROOT=/storage/Users/currentUser/usr/local/go1.26/go"
    - "-ldflags=-X main.version=0.21.0"
  dependencies:
    - "go/1.26.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Go 1.24.x linker mmap on HMDFS fails with permission denied; Go 1.26.0 linker works ref:E081-draft-9616"
  - "Go toolchain directive causes auto-download of unsigned binary; remove toolchain line and set GOTOOLCHAIN=local ref:E082-draft-C3BE"
  - "Go test binaries need ELF signing on HarmonyOS; use go test -c + sign-elf ref:E077 ref:E083-draft-BAB4"
