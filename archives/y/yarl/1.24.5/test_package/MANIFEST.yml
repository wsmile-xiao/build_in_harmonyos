# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: yarl/1.24.5
homepage: "https://github.com/aio-libs/yarl"

# 上游测试命令（pytest 测试套件，tests/ 目录，16 个测试文件）
upstream_check_command: "pytest -m 'not hypothesis' --no-cov tests/"

# conanfile.py build() 方法中是否已集成上游测试（test_package 集成，见下）
upstream_test_in_build: true
upstream_test_command: "YARL_NO_EXTENSIONS=1 python3 -m pytest -m 'not hypothesis' --no-cov -o addopts='' tests/"

# 上游实际运行的测试程序（实测 2026-08-15，OHOS 环境，纯 Python 回退模式）：
#   1235 passed, 105 skipped, 2 xfailed（-m "not hypothesis"，排除 hypothesis
#   属性测试与 benchmark；YARL_NO_EXTENSIONS=1 与本配方打包的纯 Python 回退一致）
upstream_tests:
  - file: tests/
    source: yarl-1.24.5/tests/
    description: "上游 pytest 全套（16 文件 1340 用例收集；实测 1235 passed / 105 skipped / 2 xfailed）"
    command: "YARL_NO_EXTENSIONS=1 python3 -m pytest -m 'not hypothesis' --no-cov -o addopts='' tests/"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_yarl.py
    description: "消费者 API 冒烟测试（URL.scheme/host/str，模块来源校验）"
    command: "python3 test_yarl.py"
  - file: tests/（随包附带）
    description: "上游 pytest 全套在 test_package 中实际运行（1235 passed）"
    command: "YARL_NO_EXTENSIONS=1 python3 -m pytest -m 'not hypothesis' --no-cov -o addopts='' <pkg>/share/yarl/tests"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 1235
