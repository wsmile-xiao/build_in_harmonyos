package: yavta/0.0-git20260603.4257331
homepage: "https://git.ideasonboard.org/yavta.git"

upstream_check_command: "meson test --list"
upstream_test_in_build: false
upstream_test_command: ""

# Inventory of the pinned upstream source: there is no tests/ or test/ directory,
# no test-like source file, and meson.build registers no test() target.
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Run the packaged yavta executable with --help and verify the Usage line"
    command: "yavta --help"
  - file: test.sh
    description: "Verify yavta help advertises the --help option"
    command: "yavta --help"
  - file: test.sh
    description: "Enumerate V4L2 formats on each accessible HarmonyOS video device"
    command: "yavta --enum-formats <accessible /dev/video*>"

assertion_count: 3
