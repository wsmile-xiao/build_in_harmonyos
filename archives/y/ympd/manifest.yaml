software: ympd
display: "ympd"
description: "面向 Music Player Daemon 的轻量级网页控制界面"
category: network
homepage: "https://github.com/notandy/ympd"
license: GPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "HarmonyOS PC AArch64 原生构建，Clang 默认 -fno-common 下为 MPD 状态补充唯一实体定义"
    - "将上游 v1.3.0 标签中错误的 1.2.3 运行时版本号修正为 1.3.0"
    - "通过 Conan CMakeDeps 提供 libmpdclient/OpenSSL，并映射上游 Find 模块使用的变量"
    - "CMake 4.x 配置传入 CMAKE_POLICY_VERSION_MINIMUM=3.5，保持上游旧最低版本兼容"
    - "libmpdclient 按已发布包动态链接，运行时需启用 Conan runenv 提供共享库搜索路径"
  common_dependencies:
    - libmpdclient
    - openssl

versions:
  "1.3.0":
    status: built
    build_date: "2026-09-27"
    conan_ref: "ympd/1.3.0"
