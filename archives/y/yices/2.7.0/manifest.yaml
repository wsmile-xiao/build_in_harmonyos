# 版本级 manifest —— yices 2.7.0
# 遵循 ARCHIVE-SPEC v2.0

version: "2.7.0"
software: yices

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-19"
build_system: autotools

source:
  url: "https://github.com/SRI-CSL/yices2/archive/refs/tags/yices-2.7.0.tar.gz"
  sha256: "584db72abf6643927b2c3ba98ff793f602216b452b8ff2f34a8851d35904804a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "configure 由 tool_requires autoconf/2.72 从 configure.ac 现场生成（发布包无预生成 configure；纯 autoconf，无需 automake/libtool）"
    - "--prefix=/（DESTDIR staging 打包）"
    - "--with-static-gmp=<conan gmp 包 libgmp.a> + --with-static-gmp-include-dir（gmp/6.3.0 已发布，静态）"
    - "CC 从 profile 显式导出；SHELL/CONFIG_SHELL 用 hnp bash；stdin < /dev/null"
    - "构建环境显式清空 LD_LIBRARY_PATH（lld/libxml2 根因，同 libodfgen/libabw）"
  dependencies:
    - "gmp/6.3.0"
  tool_dependencies:
    - "autoconf/2.72"
  cc: clang

patches_applied: []

knowledge_gained:
  - "yices2 发布包只有 configure.ac，纯 autoconf（无 automake/libtool）——tool_requires autoconf/2.72（制品仓已发布）现场生成即可，不必打生成态大补丁"
  - "上游测试双套件：tests/unit 201 个 C 单元测试（make test）+ tests/regress .smt2 回归（make check）"
