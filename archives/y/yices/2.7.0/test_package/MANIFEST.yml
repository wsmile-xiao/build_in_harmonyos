# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: yices/2.7.0
homepage: "https://github.com/SRI-CSL/yices2"

# 上游**有**测试：tests/unit 下 201 个 C 单元测试程序（make test 编译并逐个运行，
# 链接 libyices.a）；tests/regress 下 .smt2 回归套件（make check/regress，跑求解器基准，
# 量大耗时长）。配方 build() 内执行 make test（单元测试）并解析日志统计；
# 回归套件的执行情况见 notes.md 与 PR 描述如实申报。
upstream_check_command: "make test（tests/unit 单元测试）/ make check（tests/regress 回归）"
upstream_test_in_build: true
upstream_test_command: "make test（build() 内执行，输出落 unit-tests.log）"

upstream_tests:
  - file: tests/unit/*.c
    description: "201 个 C 单元测试程序，真机实跑，结果统计见构建日志"
  - file: tests/regress/**
    description: ".smt2 回归基准套件（求解器端到端），耗时大，执行情况如实申报"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_yices.c
    description: >-
      库级消费者测试（3 项断言）：yices_version 版本串 →
      UNSAT 实例（x>0 且 x<0）判定 STATUS_UNSAT → SAT 实例判定 STATUS_SAT；
      失败即非零退出。
  - file: test_package/test_yices_cli.sh
    description: >-
      CLI 消费者测试（2 项断言）：yices-smt2 求解 UNSAT 实例输出含 "unsat"
      且进程成功退出；失败即非零退出。
