    - patch_file: "patches/0001-config-guess-harmonyos.patch"
      patch_description: "config.guess（2016 版）不认识 HarmonyOS（uname -s=HarmonyOS）导致 configure 无法判定 build 类型（cannot guess build type）——新增 aarch64:HarmonyOS 分支输出 aarch64-unknown-linux-musl，与 Makefile 侧 ./config.sub $(./config.guess) 的查找名保持一致"
      patch_type: "portability"
