# 编译中学到的知识
knowledge_gained:
  - "bootstrap 仅需 tool_requires autoconf（零 AM_ 宏/零 .y）; 必须 PATH 前置 conan 包 bin, 否则系统 autoconf + conan PERL5LIB 双 perl ABI 冲突（Perl_my_cxt_init, DRAFT-20001）"
  - "yate 自研 configure 不支持 out-of-source 子目录构建（子目录 @srcdir@ 前置断裂 → No rule to make target）, 必须 in-source（DRAFT-20002）"
  - "OHOS 无 pthread_cancel 函数（宏常量在）→ 硬取消分支编译必炸; 软取消关闭路径 s_tmutex FUTEX 非确定性挂起, 冒烟测试需 timeout 守卫断言功能状态（DRAFT-20003）"
  - "公共头 yateclass.h 的 YATOMIC_OP 宏门控: 消费者必须定义 ATOMIC_OPS（cpp_info.defines 重传, 对齐 yate-config --cflags）否则 incomplete type RLock（DRAFT-20004）"
  - "下载完整性: curl --max-time 截断可 exit 0 → sha256 必验（本包曾遇 3,117,117/4,321,116 字节截断）"

