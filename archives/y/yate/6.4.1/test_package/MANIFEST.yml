# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# R51 清点结论: 上游无正式单元测试套件（清点证据见 notes.md "R51 上游测试清点" 表）:
#   - 无顶层 tests/ 或 test/ 目录; modules/test/ 为 8 个演示模块
#     (按模块规则编成 .yate 加载到引擎, 非测试框架)
#   - 全树无 ctest/pytest/add_test/enable_testing 注册
#   - 根/engine/modules Makefile.in 无 make check 目标
#   - share/scripts/test.{php,py,sh} 为 PBX 场景脚本(需运行中 PBX+信道, 非单元测试)
#   - windows/msvcrtest.c 为 MSVC CRT 测试(不适用)

package: yate/6.4.1
homepage: "https://yate.null.ro/"

# 上游测试命令（上游 Makefile 无 check 目标, 无法执行）
upstream_check_command: "make check"

# conanfile.py build() 中未集成上游测试（上游确无测试套件）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无, 清点证据见 notes.md）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "C++ 消费者编译+链接+String API 行为断言 (R34 实质依赖 libyate)"
    command: "./test_yate"
  - file: conanfile.py
    description: "yate -V 版本断言 / yate-config --cflags / yate.pc 元数据(-lyate) / -Dx 引擎初始化+SIP 模块加载断言"
    command: "conanfile.py test() (5 断言)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
