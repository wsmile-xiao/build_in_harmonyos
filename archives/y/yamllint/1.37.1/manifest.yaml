software: yamllint
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.37.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.37.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-20"

# 构建系统（顶层字段，用于兼容性）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/source/y/yamllint/yamllint-1.37.1.tar.gz"

  # 源码校验和
