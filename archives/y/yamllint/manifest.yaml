software: yamllint
display: "yamllint"
description: "A linter for YAML files"
category: doc
homepage: "https://github.com/adrienverge/yamllint"
license: GPL-3.0
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Python 包使用 setup.py install 方式安装"
    - "需要 Python 3.9+ 环境"
    - "依赖 pathspec 和 pyyaml"
  common_dependencies:
    - python3
    - pyyaml
    - pathspec

# 版本索引
versions:
  "1.37.1":
    status: built
    build_date: "2026-05-20"