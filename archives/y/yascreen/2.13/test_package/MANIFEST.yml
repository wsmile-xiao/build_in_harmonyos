package: yascreen/2.13
homepage: https://github.com/bbonev/yascreen

upstream_check_command: "make -f GNUmakefile"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_notes: "Upstream ships no automated test suite: GNUmakefile has no check/test target, the GitHub Actions workflow only runs `make` (build) on Linux/macOS/BSD matrices, and yastest.c is an interactive visual demo that drives a real terminal with sleep() calls and holds no assertions. N_static=0 was counted from the GNUmakefile targets and the workflow definition. The consumer test below exercises the installed library API with real assertions instead."

test_package_tests:
  - file: test.c
    description: "Initializes a 20x10 screen, captures library output through yascreen_setout(), writes text with yascreen_putsxy/yascreen_update and asserts the flushed buffer contains it, resizes to 30x12 and asserts the new geometry, then clears and frees the screen."
    command: "./test_yascreen"

assertion_count: 7
assertion_count_note: "7 logical assertion groups (10 individual failure guards); N_consumer=1 program"
