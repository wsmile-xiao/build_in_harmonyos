# test_package/MANIFEST.yml - yetris 2.3.0
# CI L0e requires this file to exist. Upstream test declaration (rule 4:
# no fabricated pass rates - the numbers below are backed by evidence).

package: yetris/2.3.0
homepage: "https://github.com/alexdantas/yetris"

# Upstream test inventory (R51): the 2.3.0 tag ships a plain GNU Makefile
# whose targets are all/documenting: all, run, install, uninstall, clean,
# dist, doc, docclean (see Makefile header comment). There is NO test or
# check target, no tests/ directory, and no CTest/CUnit/check wiring:
#   $ grep -nE '^(test|check)' Makefile  -> no matches
#   $ ls tests/                          -> no such directory
# Therefore N_static (upstream declared automated test cases) = 0, recorded
# honestly; the consumer test_package below carries the behavioural
# validation for this package.
upstream_check_command: "none (upstream has no test target)"
upstream_test_in_build: false
upstream_test_command: "none (upstream has no test target)"
upstream_tests: []
upstream_test_skipped: []

# test_package (consumer perspective) - HarmonyOS-added validation:
# run the packaged binary through its real CLI contract and assert the
# output content and exit code (R34: run the program and assert behaviour).
# test_yetris.c is the compilable consumer program required by CI L0c; it is
# built by CMake and executed from conanfile.py test() via self.run() (L0d).
test_package_tests:
  - file: test_yetris.c
    description: "1) packaged yetris binary exists and is executable; 2) `yetris --version` exits 0 and prints 'yetris v2.3.0'; 3) `yetris --help` exits 0, prints a usage screen and lists the --version option"
    command: "test_yetris <pkg>/bin/yetris  (spawns: yetris --version; yetris --help)"

assertion_count: 6
