# 版本级 manifest
# 文件位置: archives/y/yetris/2.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.0"

# 软件名
software: "yetris"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/alexdantas/yetris/archive/refs/tags/v2.3.0.tar.gz"

  # 源码校验和
  sha256: "720c222325361e855e2dcfec34f8f0ae61dd418867a87f7af03c9a59d723b919"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 上游 Makefile 无 configure；以下为 make 命令行覆盖
  configure_options:
  - "CC=<profile tools.build:compiler_executables.c>"
  - "CXX=<profile tools.build:compiler_executables.cpp>"
  - "CFLAGS_PLATFORM=-I<ncurses include> -Wno-narrowing"
  - "LDFLAGS=-L<ncurses lib> -lncursesw"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - ncurses/6.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "ohpcd ncurses 包只提供宽字符构建 libncursesw.a，上游链接 -lncurses 的 Makefile 需用命令行 LDFLAGS 全量覆盖"
- "hnp make 二进制内置 CI worker 路径的默认 CXX（/home/runner/...），Makefile 未定义 CC/CXX 的包必须显式传递"
- "clang 对 C++ 聚合初始化收窄（{-2,-3} 赋 char）按 error 处理，gcc 仅告警；跨编译器包需 -Wno-narrowing"
