software: yetris
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/alexdantas/yetris/archive/refs/tags/v2.3.0.tar.gz"

  # 源码校验和
  sha256: "720c222325361e855e2dcfec34f8f0ae61dd418867a87f7af03c9a59d723b919"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: makefile

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CFLAGS_PLATFORM=-I$DEFAULT_PREFIX/include -Wno-narrowing"
    - "LDFLAGS_PLATFORM=-L$DEFAULT_PREFIX/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ncurses/6.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ncurses.h 第274行使用 #if 0 禁用 C++ bool 兼容分支，导致 C++ 编译时 bool 被 #define 为 int，与 C++ 标准库冲突。修复：#if 0 → #if defined(__cplusplus)。影响所有使用 ncurses 的 C++ 项目。 ref: E081-draft"
  - "yetris PieceDefinitions.cpp 中 char 数组用负整数初始化触发 C++11 narrowing 错误，通过 -Wno-narrowing 抑制（不改源码）。 ref: E082-draft"
  - "纯 Makefile 项目通过 CFLAGS_PLATFORM/LDFLAGS_PLATFORM 传递自定义编译器/链接器参数，无需修改 Makefile。 ref: E083-draft"
