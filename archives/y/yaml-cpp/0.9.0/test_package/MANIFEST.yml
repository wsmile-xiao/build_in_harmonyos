package: yaml-cpp/0.9.0
homepage: "https://github.com/jbeder/yaml-cpp"

upstream_check_command: "ctest --test-dir build --output-on-failure --no-tests=error"
upstream_test_in_build: false
upstream_test_command: ""

# yaml-cpp's upstream test suite (test/) is disabled in the recipe via
# YAML_CPP_BUILD_TESTS=False to keep the package a self-contained library
# artifact. Upstream tests live in the source tree and are not shipped.
upstream_tests: []

test_package_tests:
  - file: test.cpp
    description: "Consumer parse/sequence/nested-map/round-trip/emitter functional test"
    command: "ctest --test-dir build -R '^test_yaml_cpp$' --output-on-failure"

assertion_count: 12
