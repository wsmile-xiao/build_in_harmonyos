software: yaml-cpp
version: "0.9.0"
status: built
build_date: "2026-08-14"
build_system: cmake

source:
  url: "https://github.com/jbeder/yaml-cpp/archive/refs/tags/yaml-cpp-0.9.0.tar.gz"
  sha256: "25cb043240f828a8c51beb830569634bc7ac603978e0f69d6b63558dadefd49a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DYAML_CPP_BUILD_TESTS=OFF"
    - "-DYAML_CPP_BUILD_TOOLS=OFF"
    - "-DYAML_CPP_BUILD_CONTRIB=OFF"
    - "-DYAML_CPP_FORMAT_SOURCE=OFF"
    - "-DYAML_CPP_INSTALL=ON"
    - "-DYAML_CPP_MAIN_INCLUDE=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

artifacts:
  libraries:
    - lib/libyaml-cpp.a
    - lib/libyaml-cpp.so
  headers:
    - include/yaml-cpp/yaml.h
  cmake:
    - lib/cmake/yaml-cpp/yaml-cpp-config.cmake
  pkg_config:
    - lib/pkgconfig/yaml-cpp.pc

validation:
  upstream_tests: "disabled (YAML_CPP_BUILD_TESTS=OFF)"
  test_package: "parse/sequence/nested-map/round-trip/emitter/version functional test"
  ohos_device: "pending"

knowledge_gained:
  - "GitHub tag is yaml-cpp-0.9.0 (not 0.9.0); archive URL uses the tag name and extracts to yaml-cpp-yaml-cpp-0.9.0/ — strip_root collapses it."
  - "CMake variables YAML_CPP_BUILD_TESTS/TOOLS/CONTRIB/FORMAT_SOURCE/MAIN_INCLUDE disable non-library targets to keep the package a self-contained library artifact."
  - "R32: settings.os check uses `in (Linux, OHOS)`, not `== Linux`, so OHOS aarch64 targets are accepted."
  - "CMakeToolchain defaults CMAKE_SYSTEM_NAME to HarmonyOS on OHOS, but CMake only ships Platform/OHOS.cmake — fixing the name + processor via tc.blocks[generic_system] restores DT_SONAME generation for shared libs."
