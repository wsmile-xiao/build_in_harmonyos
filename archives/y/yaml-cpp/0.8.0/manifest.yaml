software: yaml-cpp
version: "0.8.0"
status: built
build_date: "2026-08-25"
build_system: cmake

source:
  url: "https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz"
  sha256: "fbe74bbdcee21d656715688706da3c8becfd946d92cd44705cc6098bb23b3a16"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DYAML_CPP_BUILD_TESTS=OFF"
    - "-DYAML_CPP_BUILD_TOOLS=OFF"
    - "-DYAML_CPP_BUILD_CONTRIB=OFF"
    - "-DYAML_CPP_FORMAT_SOURCE=OFF"
    - "-DYAML_CPP_INSTALL=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

artifacts:
  libraries:
    - lib/libyaml-cpp.a
  headers:
    - include/yaml-cpp/yaml.h
  cmake:
    - lib/cmake/yaml-cpp/yaml-cpp-config.cmake
  pkg_config:
    - lib/pkgconfig/yaml-cpp.pc

validation:
  upstream_tests: "disabled (YAML_CPP_BUILD_TESTS=OFF)"
  test_package: "parse/sequence/nested-map/round-trip/emitter functional test"
  ohos_device: "pending"

knowledge_gained:
  - "CMake 4.x rejects cmake_minimum_required < 3.5; set CMAKE_POLICY_VERSION_MINIMUM=3.5 via cache_variables (not variables) so it becomes a -D flag."
  - "GitHub tag for 0.8.0 is just '0.8.0' (not 'yaml-cpp-0.8.0'); archive extracts to yaml-cpp-0.8.0/ — strip_root collapses it."
  - "R32: settings.os check uses `in (Linux, OHOS)`, not `== Linux`, so OHOS aarch64 targets are accepted."
  - "CMakeToolchain defaults CMAKE_SYSTEM_NAME to HarmonyOS on OHOS, but CMake only ships Platform/OHOS.cmake — fixing the name + processor via tc.blocks[generic_system] restores DT_SONAME generation for shared libs."
