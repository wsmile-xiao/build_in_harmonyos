package: "yale/5.0.95"
homepage: "https://cdsarc.cds.unistra.fr/viz-bin/cat/V/50"
upstream_test_in_build: false
upstream_check_command: "none; the upstream archive is a raw data distribution"
upstream_tests: []
upstream_test_count: 0
upstream_test_evidence: >-
  CDS V/50 ReadMe's File Summary lists only ReadMe, catalog (9,110 records), and
  notes (9,190 records). This is a data distribution with no source build system,
  test directory, test registration, or upstream functional test command.
test_package_tests:
  - file: "test_data.py"
    count: 4
    description: >-
      Conan consumer verifies the exact installed file set and upstream SHA256 values,
      streams and parses every fixed-width catalog/remark row, checks sequential HR
      identifiers, coordinate fields, categories, source metadata, and the Sirius
      reference record.
    command: "python3 test_data.py"
  - file: "test_data.py"
    count: 1
    description: >-
      HarmonyOS-only test checks the running platform and aarch64 machine, then
      independently streams and parses the installed catalog and notes through the
      Conan-provided YALE_BSC5_DIR environment variable.
    command: "python3 test_data.py --require-ohos"
test_package_assertion_count: 4
harmonyos_test_count: 1
assertion_count: 5
counting_policy: "Named test cases; per-record and per-field checks are not counted as separate cases."
