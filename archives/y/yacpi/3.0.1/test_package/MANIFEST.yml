package: yacpi/3.0.1
homepage: "http://www.ngolde.de/yacpi.html"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: "上游压缩包没有 tests/ 目录，Makefile 也没有 check/test 目标。"

test_package_tests:
  - file: "test_yacpi_harmonyos.sh"
    cases: 4
    passed: 4
    description: "真实运行被测 yacpi 二进制；核对版本、CPU 频率落在 HarmonyOS cpuinfo_min/max_freq 的实时设备范围内，并确认 ACPI 缺失时退化运行。"

test_assertions:
  - "yacpi -v reports version 3.0.1"
  - "With scaling_* absent, HarmonyOS current MHz is within the live cpuinfo_min_freq/cpuinfo_max_freq range and max MHz equals cpuinfo_max_freq"
  - "default plain-text output reports unavailable AC power information without exiting"
  - "default plain-text output still includes available CPU frequency"

assertion_count: 4
