software: yacpi
display: "YACPI"
description: "终端中的 ACPI 与 CPU 状态监视工具"
category: system
homepage: "http://www.ngolde.de/yacpi.html"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "无 ACPI 接口时继续运行，并展示平台可用的 CPU 频率"
    - "CPU 频率优先读取 scaling_*，并回退到 cpuinfo_* sysfs 节点"
    - "ACPI 电池、适配器、风扇和热区缺失时报告无信息"
  common_dependencies:
    - libacpi/0.2
    - ncurses/6.5

versions:
  "3.0.1":
    status: built
    build_date: "2026-10-06"
    conan_ref: "yacpi/3.0.1"
