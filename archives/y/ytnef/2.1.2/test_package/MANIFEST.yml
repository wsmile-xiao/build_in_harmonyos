# test_package/MANIFEST.yml
# 上游测试声明（CI 门禁 L0e 强制要求本文件存在）
package: ytnef/2.1.2
homepage: "https://github.com/Yeraze/ytnef"

# 上游测试命令：上游没有 `make check` 目标（test-data/Makefile.am 只声明
# EXTRA_DIST），唯一测试入口是 bash 集成脚本 test-data/test.sh（上游
# travis-build.sh 也是直接调用它）。
upstream_check_command: "cd test-data && ./test.sh"

# conanfile.py 的 build() 已集成上游测试（R51）
upstream_test_in_build: true
upstream_test_command: "cd test-data && rm -rf data && bash ./test.sh"

# 上游实际运行的测试：test-data/test.sh（8 组断言：2 组附件提取 + 1 组
# 逐字节 diff + 5 组 ytnefprint 字段/健壮性断言）
upstream_tests:
  - file: test-data/test.sh
    source: ytnef-2.1.2/test-data/test.sh
    description: >-
      bash 集成测试：用 ytnef 提取 winmail.dat + 6 个 *.tnef 的附件并与
      test-data/results/ 逐字节比对，再用 ytnefprint 校验 5 个 MAPI 字段
      （PR_MESSAGE_DELIVERY_TIME / PR_TNEF_CORRELATION_KEY /
      PR_RTF_SYNC_BODY_CRC / PR_RTF_SYNC_BODY_COUNT / PR_RTF_COMPRESSED），
      最后对畸形输入 ytnef-oob-TNEFVersion-SwapWord 断言报错信息。
    command: "./test.sh"

# test_package 中的消费者测试（库 API + 已安装 CLI）
test_package_tests:
  - file: test.c
    description: >-
      链接 libytnef 消费测试：TNEF 签名识别、TNEFParseFile 端到端解析
      one-file.tnef（真实上游夹具，以 base64 文本 one-file.tnef.b64 分发，
      由 conanfile.py 在 ctest 前还原为二进制）、附件链表与文件名校验、
      TNEFInitialize/TNEFFree 生命周期
    command: "./ytnef_test"
  - file: conanfile.py
    description: "已安装的 ytnef / ytnefprint 命令行工具可执行（-h 退出码 0）"
    command: "ytnef -h && ytnefprint -h"

# 测试断言总数（上游 8 + 消费者 8 + CLI 2）
assertion_count: 18
