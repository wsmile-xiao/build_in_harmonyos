# 版本级 manifest — ytnef 2.1.2
# 文件位置: archives/y/ytnef/2.1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "2.1.2"
software: "ytnef"
status: published
build_date: "2026-09-18"
build_system: autotools
os: OHOS
arch: armv8

source:
  url: "https://codeload.github.com/Yeraze/ytnef/tar.gz/refs/tags/v2.1.2"
  filename: "ytnef-2.1.2.tar.gz"
  sha256: "340f03f495884611209e9c0bc943fad06ce920e8c79655aa228d5ca7418dc360"
  tar_format: tar.gz
  upstream_repo: "https://github.com/Yeraze/ytnef"
  upstream_tag: "v2.1.2"
  upstream_commit: "d9f089144414d3b0912c29ab96f8f1c591d00319"

build:
  system: autotools
  bootstrap: "autoreconf -fi"   # git-archive 快照不含 configure
  configure_options:
    - "--disable-shared"
    - "--enable-static"
  dependencies: []
  tool_requires:
    - automake/1.18
    - libtool/2.5.4
  cc: clang
  cxx: clang++
  make_parallelism: 1           # E074: HMDFS 禁止 make jobserver FIFO
  artifacts:
    - lib/libytnef.a
    - lib/pkgconfig/libytnef.pc
    - include/ytnef.h
    - include/mapi.h
    - include/mapidefs.h
    - include/mapitags.h
    - include/tnef-types.h
    - include/tnef-errors.h
    - bin/ytnef
    - bin/ytnefprint
    - bin/ytnefprocess

patches_applied: []             # 无源码补丁：OHOS 适配全部在配方运行时完成

knowledge_gained:
  - "E007: 上游 git-archive 快照不含 configure 时，config.guess/config.sub 由 autoreconf 生成，pristine 中不存在，无法用 conandata 补丁表达——须在 build() 中 autoreconf 之后就地为 config.guess 注入 HarmonyOS 分支"
  - "E007: config.guess 的 HarmonyOS 分支插在 *:NetBSD:*:*) 之前，直接输出 ${MACHINE}-unknown-linux-ohos，绕过编译器探针；不需要 __OHOS__ LIBC 探针（HarmonyOS 不进入 Linux/GNU 段），因此不触发 R8/PF5 平台宏红线"
  - "E114: HMDFS 上 `mktemp -d`（umask 077）产生不可写的 drwx--S--- 目录，而 `mkdir`（umask 077）产生可写的 drwxrws--x——configure/config.status 的临时目录必须去掉 umask 077"
  - "conan automake/1.18 的 aclocal/automake 包装脚本 shebang 指向系统 perl，与 VirtualBuildEnv 指向的 conan perl ABI 不同；引导 autoreconf 时须统一 perl 并把 automake share 目录加入 PERL5LIB"
  - "E074: make -j>1 在 HMDFS 上无法创建 jobserver FIFO（仅告警并退化），统一 -j1 可消除噪声"
  - "R51: 上游 test.sh 以 ../ytnef/ytnef 相对路径取二进制，Conan out-of-source 构建须先把 test-data 夹具镜像进 build 目录"
  - "codeload 形式的源码 URL 以裸 tag 结尾，conandata sources 必须补 filename，否则 Conan 按 zip 解压报 BadZipFile"
