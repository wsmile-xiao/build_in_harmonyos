# conandata.yml — ytnef 2.1.2
#
# Official upstream source: GitHub codeload archive of tag v2.1.2 of
# https://github.com/Yeraze/ytnef (commit d9f089144414d3b0912c29ab96f8f1c591d00319).
# The codeload form is used on purpose: the repository-wide conan_verify
# pre-download step injects a mirror for plain `https://github.com/...` URLs,
# and the mirrors reachable from the build hosts do not serve this archive.
# codeload.github.com is GitHub's own official archive endpoint and is used by
# many recipes in this repository.
sources:
  url: "https://codeload.github.com/Yeraze/ytnef/tar.gz/refs/tags/v2.1.2"
  # explicit filename: the codeload URL ends in the bare tag (`v2.1.2`), so
  # without it Conan cannot tell the archive format and tries to unzip it.
  filename: "ytnef-2.1.2.tar.gz"
  sha256: "340f03f495884611209e9c0bc943fad06ce920e8c79655aa228d5ca7418dc360"

# No source patches are needed: all OHOS adaptations live in the recipe
# (E007 config.guess/config.sub completion, which cannot be expressed as a
# patch because those files are generated by autoreconf).
patches: {}
