# 版本级 manifest（ARCHIVE-SPEC v2.0）
# 文件位置: archives/y/yersinia/0.8.2/manifest.yaml

version: "0.8.2"
software: "yersinia"

# published | built | failed | archived
# built = conan-verify/finish 全绿但尚未 release/upload 到制品仓
status: built
build_date: "2026-09-22"
build_system: "autotools"

source:
  url: "https://github.com/tomac/yersinia/archive/refs/tags/v0.8.2.tar.gz"
  sha256: "964f528dbffd904376ab7986e69b1e8639591c929e2f39186ac9ebf2d3bc761f"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
  - "--build=aarch64-unknown-linux-ohos"
  - "--host=aarch64-unknown-linux-ohos"
  - "--disable-gtk"
  - "--with-pcap-includes=<libpcap>/include"
  - "--with-libnet-includes=<libnet>/include"
  - "--with-ncurses=<ncurses 包前缀>"
  dependencies:
  - "libpcap/1.10.6"
  - "libnet/1.2"
  - "ncurses/6.6"
  - "automake/1.18"
  - "libtool/2.5.4"
  cc: clang
  cxx: clang++

patches_applied:
- "0001-configure-in.patch"
- "0002-configure-in-no-glib-gettext.patch"
- "0003-configure-in-fcommon.patch"
- "0004-configure-in-thread-cancel-probe.patch"
- "0005-thread-util-no-cancellation-fallback.patch"

knowledge_gained:
- "conan 2 的 AutotoolsToolchain 无 cpp_flags/ld_flags 属性；追加标志走 extra_cflags/extra_ldflags，依赖目录必须用 package_folder 拼绝对路径"
- "dlcache sidecar 的 URL 集合必须覆盖 conan-verify 当前注入的加速代理域（代理域不一致 ⇒ 条目被判 dirty 并删除预置文件）；修复=重新播种 tarball 并把官方与两个代理域 URL 一并登记进 references"
- "AM_GLIB_GNU_GETTEXT 由 glib 的 m4 提供，OHOS 无；它在 configure.in 的 --disable-gtk 分支内也会被 autoconf 于 m4 期展开，故须把该行降级为 dnl（本包 ALL_LINGUAS 为空且无 po/，NLS 仅已禁用的 gtk UI 引用）"
- "把 --build 写成非 OHOS 值会让 autoconf 判 cross_compiling=yes，裸 AC_TRY_RUN 探测随即 fatal；鸿蒙 PC 构建即在目标机，应让 build 与 host 一致（详见随本 PR 提交的知识草稿）"
- "上游 configure.in 对 CFLAGS 是整行硬赋值 ⇒ tc.extra_cflags 与 os.environ['CFLAGS'] 两条注入通道都会被丢弃，-fcommon 只能补在那个唯一赋值处"
- "conan ncurses/6.6 只发布宽字符归档名（libncursesw.a/libpanelw.a），老包写死 -lncurses/-lpanel：用私有 shim 目录建别名 + LDFLAGS 指过去；AC_CHECK_HEADERS 走 $CPP $CPPFLAGS，所以 -I 必须同时进 CPPFLAGS"
- "OHOS libc 无 pthread_cancel/pthread_setcancelstate/pthread_setcanceltype（连声明都没有）：configure 探测 + 关机路径改 pthread_detach，取消状态开关用 static inline 空操作收敛"
- "E114/E074：HMDFS setgid 令 umask 077 临时目录不可写、jobserver mkfifo 被拒，故就地改写 configure 的 umask 并全程 make -j1"
