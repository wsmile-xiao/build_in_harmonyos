# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: yersinia/0.8.2
homepage: "https://github.com/tomac/yersinia"

# 上游测试命令：上游 0.8.2（2006 年代码基线）不含任何测试套件——
# 全仓无 TESTS/check_PROGRAMS/TEST_CASE（顶层与 src/ Makefile.am 均无）。
upstream_check_command: "无（上游无测试套件，N_static=0）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序
upstream_tests:
  - file: "（无）"
    source: "yersinia-0.8.2（无 tests/ 目录，无测试注册）"
    description: "上游无自动化测试（N_static=0，如实申报：全仓 grep 无 TESTS/check_PROGRAMS、无 test*/ 目录、无 *RUNTEST* 脚本、无示例/语料测试目录）；配方仍真实执行 make check 目标，按规则以消费者测试补位"
    command: "make -j1 check（已真实执行；automake 无注册用例，退出码 0，非人为跳过）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 以使用者身份运行**安装后的** yersinia 二进制，7 条行为断言全部按退出码判定：无参路径 ①退出码 0（clean_exit）②横幅 GNU yersinia 0.8.2 ③提示 Try 'yersinia -h' ④上游 MOTD 行存在；带选项路径 ⑤-h ⑥--version ⑦-l 均命中 getuid 门禁并打印 must be root to run yersinia 0.8.2（root 环境下这三项打印 SKIP 而非失败）"
    command: "bash test.sh（VirtualRunEnv conanrun 环境）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
