# conandata.yml — yersinia 0.8.2
# 源码 = 官方 GitHub tomac/yersinia tag v0.8.2（git archive）
# 补丁策略：仅 1 个修改文件补丁（configure.in），把 2006 年的双参旧式
#   AM_INIT_AUTOMAKE(NAME, VERSION) 改为无参现代形式——automake >=1.13
#   已移除双参形式，autoreconf -fi（automake 1.18）无法通过旧写法。

sources:
  url: "https://github.com/tomac/yersinia/archive/refs/tags/v0.8.2.tar.gz"
  sha256: "964f528dbffd904376ab7986e69b1e8639591c929e2f39186ac9ebf2d3bc761f"

patches:
  - patch_file: "patches/0001-configure-in.patch"
    patch_description: "AM_INIT_AUTOMAKE 双参旧式改为无参现代形式（automake 1.18 兼容）"
    patch_type: "platform"
    patch_strip: 1
  - patch_file: "patches/0002-configure-in-no-glib-gettext.patch"
    patch_description: "注释掉 configure.in 的 AM_GLIB_GNU_GETTEXT 调用：该宏由 glib 的 m4 提供，OHOS 侧不存在；autoreconf 在 --disable-gtk 下仍会展开它"
    patch_type: "platform"
    patch_strip: 1
  - patch_file: "patches/0003-configure-in-fcommon.patch"
    patch_description: "在 configure.in 唯一的 CFLAGS 赋值处补 -fcommon（上游头文件用暂定定义，clang 默认 -fno-common 会链接期报 duplicate symbol）"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0004-configure-in-thread-cancel-probe.patch"
    patch_description: "configure.in 增 AC_CHECK_FUNCS([pthread_cancel pthread_setcancelstate pthread_setcanceltype])：OHOS libc 无该组符号（E407 的 configure-feature-probe 处方）"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0005-thread-util-no-cancellation-fallback.patch"
    patch_description: "按探测结果兜底：thread_destroy_cancel 在无取消支持时改 pthread_detach（唯一调用点是关机路径上的 uptime 线程），并把 setcancelstate/setcanceltype 调用点收敛为内联空操作"
    patch_type: "portability"
    patch_strip: 1
