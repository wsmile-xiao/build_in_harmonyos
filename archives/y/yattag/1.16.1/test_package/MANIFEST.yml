package: yattag/1.16.1
homepage: "https://www.yattag.org"

upstream_check_command: "python3 -m unittest discover -s test -v"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/test_doc.py
    source: yattag-1.16.1/test/test_doc.py
    description: "Upstream document and form rendering tests"
    command: "python3 -m unittest discover -s test -v"
  - file: test/test_indentation.py
    source: yattag-1.16.1/test/test_indentation.py
    description: "Upstream indentation tests"
    command: "python3 -m unittest discover -s test -v"
  - file: test/test_simpledoc.py
    source: yattag-1.16.1/test/test_simpledoc.py
    description: "Upstream simple document generation tests"
    command: "python3 -m unittest discover -s test -v"

test_package_tests:
  - file: functional.py
    description: "Import yattag from the Conan package and verify HTML escaping"
    command: "python functional.py <package-folder>"
  - file: ohos_document_roundtrip.py
    description: "On OHOS, generate a UTF-8 HTML page with the Conan package, persist it, and parse the saved page"
    command: "python ohos_document_roundtrip.py <package-folder> <writable-build-folder>"

assertion_count: 7
