# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: yash/2.60
homepage: "https://github.com/magicant/yash"

# 上游**有**完整测试套件：tests/ 下 243 个 .tst 文件（126 POSIX 组 + 117 yash
# 扩展组，由 tests/Makefile 的 test 目标驱动，逐断言写 .trs：%%% OK[/ERROR[/SKIPPED:）。
# 配方 build() 真实执行其中**非 %REQUIRETTY% 的 171 个**并解析 .trs 统计进日志；
# 72 个 %REQUIRETTY%（作业控制/信号组）因平台差异排除并如实申报：
# 本平台会话有控制终端（checkfg 通过）但无前台进程组语义，ptwrap 与直接执行下
# 作业控制测试均挂死（sigstop3-p.tst 实测挂起 >10 分钟，两次复现）；
# enqueue.sh 串行回退在 hmdfs 上不可靠（硬链接队列残留卡死）。
upstream_check_command: "make test（tests/ 目录，243 个 .tst，其中 72 个 %REQUIRETTY% 因平台 TTY 语义差异排除）"
upstream_test_in_build: true
upstream_test_command: "make -C tests test TEST_SOURCES=<171 个非 REQUIRETTY> RUN_TEST='timeout -s KILL 120 ...'（build() 内自动执行并解析 .trs）"

upstream_tests:
  - file: tests/*.tst
    description: "243 个 shell 语义测试文件（126 POSIX + 117 yash），其中 171 个真机实跑、72 个 %REQUIRETTY% 作业控制/TTY 类因平台差异排除；断言级统计见构建日志与 PR 描述"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_yash.sh
    description: >-
      CLI 消费者测试（6 组断言）：--version 版本串 → 基本脚本执行
      （echo/命令替换/算术展开）→ POSIX 特性（for/case/参数展开）→
      yash 扩展 array 内建 → 管道+while read → 退出码传播契约；
      任一失败即非零退出。
