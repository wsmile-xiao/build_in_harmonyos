patches:
  "2.60":
    - patch_file: "patches/0001-bracket-mandatory.patch"
      patch_description: "builtin.c 把 [ 从 BI_SUBSTITUTIVE 改为 BI_MANDATORY——substitutive 内建仅当 PATH 存在同名外部命令时启用，而本平台无 /bin/[（实测 /bin/[ 不存在），导致 [ 完全不可用（上游测试 409 项断言因此连锁报错）；BI_MANDATORY 语义相同（substitutive 内建本就定义为与外部工具行为一致）"
      patch_type: "portability"
