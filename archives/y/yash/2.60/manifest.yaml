# 版本级 manifest —— yash 2.60
# 遵循 ARCHIVE-SPEC v2.0

version: "2.60"
software: yash

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-19"
build_system: makefile

source:
  url: "https://github.com/magicant/yash/releases/download/2.60/yash-2.60.tar.xz"
  sha256: "cc152f65221916c508e3ec013edda40028d1f77a9ca3dcf2489ee825fd746f75"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "--prefix=/（DESTDIR staging 打包）"
    - "--with-term-lib=ncurses（行编辑需要 terminfo；ncurses/6.6 来自制品仓，CPPFLAGS/LDFLAGS 显式指向其包目录）"
    - "--disable-nls（平台无 gettext）"
    - "CC 从 profile 的 tools.build:compiler_executables 显式导出；SHELL/CONFIG_SHELL 用 hnp bash"
    - "构建环境显式清空 LD_LIBRARY_PATH（lld/libxml2 根因，同 libodfgen/libabw）"
  dependencies:
    - "ncurses/6.6"
  cc: clang

patches_applied:
  - "patches/0001-bracket-mandatory.patch：[ 从 BI_SUBSTITUTIVE 改 BI_MANDATORY（平台无 /bin/[ 外部命令，substitutive 机制会让 [ 完全不可用）"

knowledge_gained:
  - "yash 的 configure 是手写 POSIX sh（非 autoconf），config.guess 类问题不存在；探测在本机原生编译运行（build=host=OHOS）"
  - "上游测试为 tests/ 下 243 个 .tst（126 POSIX + 117 yash 扩展），make -C tests test 驱动，.trs 逐断言行 %%% OK[/%%% ERROR[ 格式"
  - "yash substitutive 内建仅当 PATH 有同名外部命令时启用——平台缺 /bin/[ 时 [ 不可用（本包补丁 0001 修复）"
  - "shell 作业控制测试在本平台挂死（无前台进程组语义）；测试输出必须落文件防孤儿进程持有管道"
