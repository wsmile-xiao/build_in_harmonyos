# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: yder/1.4.20
homepage: "https://github.com/babelouest/yder"

# 上游有测试目录（test/yder_test.c），但其 Makefile 硬链 `check` 框架
# （pkg-config --libs check）与 valgrind，本平台均不存在，无法在仓内
# 口径执行——如实申报；验证由 test_package 消费者测试承担。
upstream_check_command: "上游测试链接 check 框架（平台无），无法执行"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "test/yder_test.c"
    description: >-
      上游单元测试（依赖 check 框架 + valgrind，平台均无，无法执行）：
      覆盖 console/syslog/file/callback 各后端的 init/log/close 流程。

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_yder.c
    description: >-
      消费者测试（4 项断言）：console 后端 init/log/close 往返（1）；
      file 后端真实写盘且日志文件含标记串（2）；级别常量严重度顺序
      保持（3）；close 后可重新 init（4）。失败即非零退出。
