sources:
  url: "https://github.com/IENT/YUView/archive/refs/tags/v2.14.tar.gz"
  sha256: "cde4e5726286d18cd7b7f2458fc3e6fb198c1bd629075e8f654b365c3b866c51"

patches:
  - patch_file: "patches/0001-YUViewApp-YUViewApp.pro.patch"
    patch_description: "Link the Qt OpenGL module only when the configured Qt provides it, so Qt builds without OpenGL can still build the application."
    patch_type: "portability"
  - patch_file: "patches/0002-YUViewApp-src-yuviewapp.cpp.patch"
    patch_description: "Report the version and usage on the command line before constructing QApplication, so headless builds can be queried."
    patch_type: "portability"
  - patch_file: "patches/0003-YUViewLib-YUViewLib.pro.patch"
    patch_description: "Link the Qt OpenGL module only when the configured Qt provides it, so Qt builds without OpenGL can still build the library."
    patch_type: "portability"
  - patch_file: "patches/0004-YUViewLib-src-handler-UpdateHandler.cpp.patch"
    patch_description: "Guard the Qt Network SSL error signal and encrypted connection call with QT_CONFIG(ssl) so Qt builds without SSL compile."
    patch_type: "portability"
  - patch_file: "patches/0005-YUViewLib-src-handler-UpdateHandler.h.patch"
    patch_description: "Forward declare QSslError only when the configured Qt provides the SSL feature."
    patch_type: "portability"
  - patch_file: "patches/0006-YUViewLib-src-video-VideoCache.cpp.patch"
    patch_description: "Include the generated moc file outside the project namespace so Qt 6 moc helper namespaces resolve correctly."
    patch_type: "portability"
