package: yuview/2.14
homepage: "https://github.com/IENT/YUView"

# Upstream registers the unit tests through qmake: `CONFIG+=UNITTESTS` adds the
# YUViewUnitTest subdir project, and the generated top level Makefile forwards
# the `check` target to every test executable. The recipe builds and runs all
# eleven QtTest binaries directly so a single failing test fails the build.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "qmake CONFIG+=UNITTESTS && make && make check"

upstream_tests:
  - file: FilesourceTest.cpp
    source: YUViewUnitTest/filesource/filesource/FilesourceTest.cpp
    description: "FileSource raw file handling and frame retrieval."
    command: "./FilesourceTest"
  - file: FilesourceAnnexBTest.cpp
    source: YUViewUnitTest/filesource/filesourceAnnexB/FilesourceAnnexBTest.cpp
    description: "Annex B bitstream file source access units."
    command: "./FilesourceAnnexBTest"
  - file: StatisticsDataTest.cpp
    source: YUViewUnitTest/statistics/statisticsData/StatisticsDataTest.cpp
    description: "Statistics data model calculations."
    command: "./StatisticsDataTest"
  - file: StatisticsFileCSVTest.cpp
    source: YUViewUnitTest/statistics/statisticsFileCSV/StatisticsFileCSVTest.cpp
    description: "Statistics CSV import and export."
    command: "./StatisticsFileCSVTest"
  - file: StatisticsFileVTMBMSTest.cpp
    source: YUViewUnitTest/statistics/statisticsFileVTMBMS/StatisticsFileVTMBMSTest.cpp
    description: "Statistics VTMBMS file parsing."
    command: "./StatisticsFileVTMBMSTest"
  - file: ConversionRGBTest.cpp
    source: YUViewUnitTest/video/rgb/ConversionRGBTest/ConversionRGBTest.cpp
    description: "RGB conversion routines."
    command: "./ConversionRGBTest"
  - file: Issue511RGBConversionInvalidMemoryAccess.cpp
    source: YUViewUnitTest/video/rgb/Issue511RGBConversionInvalidMemoryAccess/Issue511RGBConversionInvalidMemoryAccess.cpp
    description: "Regression test for the RGB conversion out-of-bounds access (issue 511)."
    command: "./Issue511RGBConversionInvalidMemoryAccess"
  - file: PixelFormatRGBGuessTest.cpp
    source: YUViewUnitTest/video/rgb/PixelFormatRGBGuessTest/PixelFormatRGBGuessTest.cpp
    description: "Reporting of the best matching RGB pixel format."
    command: "./PixelFormatRGBGuessTest"
  - file: PixelFormatRGBTest.cpp
    source: YUViewUnitTest/video/rgb/PixelFormatRGBTest/PixelFormatRGBTest.cpp
    description: "RGB pixel format name round trips."
    command: "./PixelFormatRGBTest"
  - file: PixelFormatYUVGuessTest.cpp
    source: YUViewUnitTest/video/yuv/PixelFormatYUVGuessTest/PixelFormatYUVGuessTest.cpp
    description: "Reporting of the best matching YUV pixel format."
    command: "./PixelFormatYUVGuessTest"
  - file: PixelFormatYUVTest.cpp
    source: YUViewUnitTest/video/yuv/PixelFormatYUVTest/PixelFormatYUVTest.cpp
    description: "YUV pixel format name round trips for all supported formats."
    command: "./PixelFormatYUVTest"

test_package_tests:
  - file: test_yuviewlib.cpp
    description: "Links the packaged YUViewLib archive and asserts a pixel format name round trip through the public API."
    command: "./test_yuviewlib"
  - file: test_package/conanfile.py
    description: "Runs the packaged YUView executable with --version and --help without opening the GUI."
    command: "./bin/YUView --version ; ./bin/YUView --help"

assertion_count: 4
