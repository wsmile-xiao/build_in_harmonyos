knowledge_gained:
  - "YUView 2.14 is a qmake subdirs project (YUViewLib static library plus YUViewApp executable); registry-published qtbase/6.11.1.3 provides a runnable qmake6 for HarmonyOS PC."
  - "The HarmonyOS PC Qt Base build has FEATURE_opengl=OFF and no OpenGL qmake module, so `QT += opengl` must be replaced by qtHaveModule(opengl) guards instead of being deleted."
  - "qtbase/6.11.1.3 is built without SSL (QT_NO_SSL), so Qt Network consumers must guard sslErrors and connectToHostEncrypted with QT_CONFIG(ssl) to compile."
  - "Qt 6 moc output references its helper namespaces (for example q20::identity) unqualified; a moc file included inside a project namespace resolves those names against the project namespace and fails to compile. VideoCache.cpp had to include VideoCache.moc outside namespace video."
  - "Release archives are not git checkouts; qmake `$$system(\"git describe --tags\")` returns empty there, so the version must be injected through a qmake variable (VERSION=) with the upstream fallback kept intact."
  - "YUView's eleven unit test binaries only need QtCore, QtXml and QtTest (QT -= gui) and run headless, so all of them execute on HarmonyOS PC without a window system."
  - "The GUI itself needs a QPA platform plugin; only offscreen/minimal are available, so package validation uses the CLI (--version/--help) plus the YUViewLib API and the upstream unit tests."

