# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: yacas/1.9.1
homepage: "https://github.com/grzegorzmazur/yacas"

# 上游**有**测试且随本配方真实执行：tests/ 下 53 个 .yts 脚本经 ctest 注册
# （上游 test-yacas runner 驱动，--rootdir 指向构建树 scripts/），另开启
# ENABLE_CYACAS_UNIT_TESTS 构建 C++ 引擎单元测试。配方 build() 内执行
# ctest 并解析统计进日志（输出落文件防孤儿进程持管道，yash 教训）。
upstream_check_command: "ctest（53 个 .yts + C++ 单元测试）"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --timeout 300（build() 内执行）"

upstream_tests:
  - file: tests/*.yts
    description: "53 个 yacas 脚本测试（算术/代数/微积分/解方程等），真机实跑"
  - file: cyacas/libyacas/tests（unit）
    description: "C++ 引擎单元测试（ENABLE_CYACAS_UNIT_TESTS=ON 构建运行）"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_yacas.cpp
    description: >-
      库级消费者测试（5 项断言）：CYacas 引擎求值——算术 2+3=5、
      Factorial(10)=3628800、因式分解 Factor(x^2-1)、求导 D(x) x^3、
      有理数 1/3+1/6=1/2；失败即非零退出。
  - file: test_package/test_yacas_cli.sh
    description: >-
      CLI 消费者测试（2 项断言）：--version 探针 → 控制台经
      --rootdir 加载包内 share/yacas/scripts 求值 Simplify(1/3+1/6)=1/2
      （验证脚本库随包交付且可加载）；失败即非零退出。
