# 版本级 manifest —— yacas 1.9.1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.9.1"
software: yacas

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-19"
build_system: cmake

source:
  url: "https://github.com/grzegorzmazur/yacas/archive/refs/tags/v1.9.1.tar.gz"
  sha256: "36333e9627a0ed27def7a3d14628ecaab25df350036e274b37f7af1d1ff7ef5b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "ENABLE_CYACAS_CONSOLE=ON / GUI=OFF（Qt 不在本平台）/ KERNEL=OFF / JYACAS=OFF / DOCS=OFF"
    - "ENABLE_CYACAS_UNIT_TESTS=ON（构建 C++ 引擎单元测试）"
    - "构建环境显式清空 LD_LIBRARY_PATH（lld/libxml2 根因，同 libodfgen/libabw）"
  dependencies: []
  test_dependencies:
    - "gtest/1.17.0.2（仅引擎单元测试构建用，visible=False 不进消费者依赖）"
  cc: clang

patches_applied: []

knowledge_gained:
  - "yacas 顶层仓含大量 JS（jyacas/web），GitHub lang 字段误标 JavaScript——R47 以源码实测为准（cyacas 核心 C++）"
  - "yacas 控制台运行期依赖脚本库：包必须带 share/yacas/scripts，测试用 --rootdir 指向"
  - "上游 53 个 .yts 经 ctest 注册（test-yacas runner），CMake 最低 3.10 与 CMake 4.x 兼容"
