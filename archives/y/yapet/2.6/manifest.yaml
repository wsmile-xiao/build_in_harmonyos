# 版本级 manifest — yapet 2.6
# 文件位置: archives/y/yapet/2.6/manifest.yaml （ARCHIVE-SPEC v3.0）

software: yapet
version: "2.6"
status: built
build_system: autotools
build_date: "2026-09-24"
conan_ref: "yapet/2.6"

source:
  url: "https://yapet.guengel.ch/downloads/yapet-2.6.tar.xz"
  sha256: "54ca11c9c71d1bc530908f7f68d0a6021c871d283bdc1b421d8776ba8b456302"
  tar_format: tar.xz

build:
  system: autotools
  bootstrap_command: ""   # 发布版 tarball 自带 configure，无需 autoreconf
  # ARCHIVE-SPEC §4.2: configure_options 须与 conanfile.py 一致。
  # 本配方 generate() 不追加 configure 参数，实际由 conan AutotoolsToolchain
  # 注入 prefix 系选项（config.log 实测 `configure --prefix=/ --bindir=...`）。
  # 故此处只登记 prefix，其余前缀系选项由工具链默认给出。
  #
  # **不传 --disable-shared / --enable-static**（与配方一致）：上游
  # libyacurs/tests/preloadlib/Makefile.am:16 把 `-shared` 硬编码进
  # `libtool --mode=compile` 规则，configure 带 --disable-shared 会让该
  # compile 命中 "cannot build a shared library"，而 libtool 2.4.6 的
  # func_fatal_configuration() 调用**未定义**的 func__fatal_error（双下划线），
  # 真错误被 `command not found` 掩盖。详见 notes.md 问题表 #11。
  #
  # native 编译：未传 --build/--host 三元组（OHOS 三元组由 config.guess/config.sub
  # 整文件补丁产出）；PKG_CONFIG_PATH 由 AutotoolsToolchain env 前置 generators
  # 目录；ARGON2 经 PkgConfigDeps set_property 改名 libargon2.pc。
  # 上述说明属注释、不进选项列表（列表项必须以 `-` 开头，否则 finish 的
  # G0 clean-verify 判「清单解析失败」）。
  configure_options:
    - "--prefix=/"
  dependencies:
    - "openssl/3.0.21"
    - "argon2/20190702"
    - "ncurses/6.5"
    - "cppunit/1.15.1"
  tool_dependencies:
    - "gettext/0.22.5.1"
  cc: clang
  cxx: clang++
  # 与 conanfile.py `package_type = "application"` 一致（ARCHIVE-SPEC §2.1：CLI 包）；
  # application 包**不声明** shared/fPIC 选项（conanfile 已无 options/default_options）。
  package_type: application

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure.patch"
  - "0004-libyacurs-build-aux-config.guess.patch"
  - "0005-libyacurs-build-aux-config.sub.patch"
  - "0006-libyacurs-configure.patch"
  - "0007-src-libs-crypt-crypto.cc.patch"
  - "0008-tests-converters-Makefile.am.patch"
  - "0009-tests-converters-Makefile.in.patch"


artifacts:
  programs:
    - bin/yapet
    - bin/csv2yapet
    - bin/yapet2csv
  licenses:
    - licenses/LICENSE

knowledge_gained:
  - "config.guess/config.sub 陈旧族：发布版 tarball 自带 2018-08-29 件（顶层 build-aux 与捆绑 libyacurs/build-aux 各一份，共 4 份），uname -s=HarmonyOS 直接打回 unable to guess system type；修法=新件（2026-05-17）整文件补丁 + 注入 HarmonyOS 分支输出 aarch64-unknown-linux-ohos（新 config.sub 认收该三元组），经 refresh_patch 两面登记；新件在本机也会因 HMDFS umask 077 草稿目录不可写落入编译探针失败，分支必须在探针前先行命中"  # knowledge_ref: E007
  - "PkgConfigDeps 只写 .pc 不扩展 PKG_CONFIG_PATH：上游 PKG_CHECK_MODULES 探测会漏掉 conan 元数据，须在 AutotoolsToolchain 的 env 里 prepend_path generators 目录"  # knowledge_ref: E468
  - "PKG_CHECK_MODULES 模块名与 conan 包默认 .pc 名不一致（上游要 libargon2、argon2 配方无 pkg_config_name 属性产 argon2.pc）：消费侧 PkgConfigDeps.set_property('argon2','pkg_config_name','libargon2') 即可，比 ARGON2_CFLAGS/LIBS 环境覆盖与手写 .pc 垫片都小（最小面、单一 pkg-config 机制），三案取舍见 notes.md 问题表 #2"  # knowledge_ref: E695
  - "上游 tests/converters/check-local 硬编码 /tmp/ 夹具路径，OHOS /tmp 只读导致 csv2yapet 无法创建夹具：补丁迁入 $(builddir)（E002 族，已在 PR 声明为上游测试修改）"  # knowledge_ref: E002

validation:
  upstream_tests:
    command: "env HOME=$TASK_DIR/test-home OPENSSL_MODULES=<openssl包>/lib/ossl-modules make -k check（out-of-source $TASK_DIR/explore/otree）"
    result: "TOTAL=102 PASS=35 FAIL=6 SKIP=56 NOT_RUN=5（35+6+56+5=102）；6 FAIL 全为 HMDFS 权限语义（hasSecurePermissions 恒假，硬探针见 reports/test-report.md），5 NOT_RUN 为 istty 门控整块未进入"
    source: "reports/test-report.md + $TASK_DIR/logs/check-v2.log"
  test_package:
    command: "conan create 的 test() 阶段：yapet/csv2yapet/yapet2csv CLI 4 项 + 加密往返 2 项 + 负向 2 项（共 8 个消费者用例）"
    result: "8/8 PASS（探索期 consumer 步全绿：CLI 4 + csv→pet 非空 16018B + pet→csv 逐字节一致 + 错口令拒 rc=3 + 未知选项拒 rc=1）"
    source: "reports/conan-verify-report.md"
  conan_verify: "reports/conan-verify-report.md（Verdict: PASS，实跑 4/4 跳过 0/4）"
