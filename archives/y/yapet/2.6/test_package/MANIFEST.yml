# test_package/MANIFEST.yml
# 上游测试声明（CI 门禁 L0e 强制要求本文件存在）
package: yapet/2.6
homepage: "https://yapet.guengel.ch/"

# 上游测试命令：autotools 标准 `make check`（automake serial tests +
# check-local），顶层 SUBDIRS = libyacurs src po tests doc
upstream_check_command: "make check"

# conanfile.py 的 build() 目前只跑 configure+make（上游测试在设备侧
# 沙箱 HOME 下单独执行并留档 reports/test-report.md）
upstream_test_in_build: false
upstream_test_command: "HOME=$TASK_DIR/test-home make check"

# 上游实际运行的测试面（N 清点以 tests/ 各 Makefile.am 注册为准）
upstream_tests:
  - file: tests/utils/Makefile.am
    description: "TESTS=$(check_PROGRAMS)：ods、securearray、utils（cppunit）"
    command: "make -C tests/utils check"
  - file: tests/metadata/Makefile.am
    description: "TESTS=$(check_PROGRAMS)：metadata（cppunit）"
    command: "make -C tests/metadata check"
  - file: tests/passwordrecord/Makefile.am
    description: "TESTS=$(check_PROGRAMS)：passwordrecord、passwordlistitem（cppunit）"
    command: "make -C tests/passwordrecord check"
  - file: tests/crypt/Makefile.am
    description: "TESTS 显式列 10 个加密用例（key448、key256、blowfish、aes256、blowfishfactory、aes256factory、file_blowfish、file_aes256、foreign、cryptofactoryhelper，cppunit；check_PROGRAMS 另含 passwordchange_exerciser 未入 TESTS）"
    command: "make -C tests/crypt check"
  - file: tests/cfg/Makefile.am
    description: "TESTS=$(check_PROGRAMS)：cfg1、cfgfile1（cppunit）"
    command: "make -C tests/cfg check"
  - file: tests/file/Makefile.am
    description: "TESTS=$(check_PROGRAMS)：rawfile、fileutils、yapetfile、yapet10file、yapet20file、header10、headerversion、filehelper（cppunit）"
    command: "make -C tests/file check"
  - file: tests/pwgen/Makefile.am
    description: "TESTS=characterpool、rng_engine、rng、pwgen（另注册未进 TESTS 的 rng_distribution、pwgen_distribution）"
    command: "make -C tests/pwgen check"
  - file: tests/converters/Makefile.am
    description: "check-local：csv2yapet/yapet2csv 加密往返 + diff（/tmp 夹具路径经 0008/0009 双面补丁迁入构建目录）"
    command: "make -C tests/converters check"
  - file: tests/converters/csv/Makefile.am
    description: "TESTS=$(check_PROGRAMS)：csvstringfield、csvline（cppunit）"
    command: "make -C tests/converters/csv check"
  - file: tests/converters/import/Makefile.am
    description: "TESTS=$(check_PROGRAMS)：import、import2（cppunit）"
    command: "make -C tests/converters/import check"
  - file: tests/preload/Makefile.am
    description: "check-local 由 istty 门控：非 tty 下上游自身逻辑整块跳过，5 项交互用例计 SKIP（yapet -i ×2、checktestpwrecord、yapet -i masterpwchange、checkmasterpwchange）"
    command: "make -C tests/preload check"
  - file: libyacurs/tests/Makefile.am
    description: "捆绑 libyacurs 子测试：basic 14 项（filter-out eventqueue9）+ ui-non-interactive 27 项 = 41 项 TESTS（两者均源码 isatty 门控 exit(77) 计 SKIP）；ui-interactive 20 项走 check-local、经 preloadlib 返 77 计 skip；basic check-local 的 eventqueue9 同 preloadlib 返 77；preloadlib 自身无 TESTS"
    command: "make -C libyacurs/tests check"

# test_package 中的消费者测试（非交互 CLI，共 8 例）
test_package_tests:
  - file: test.sh
    description: "测试源（L0c 要求）：已安装 CLI 可执行与版本自报 —— yapet -V / csv2yapet -V / yapet2csv -V 三项断言输出含 2.6（不只查 rc），yapet -h 查 rc=0；不初始化 curses"
    command: "sh test.sh <bindir> <isolated-work> <input.csv>  # 内部逐条跑 yapet -V/-h、csv2yapet -V、yapet2csv -V"
  - file: test.sh
    description: "加密往返（case 5/6）：csv2yapet 以命令行口令把 input.csv 加密为非空 .pet，再 yapet2csv 解密回 CSV 并 cmp 逐字节比对"
    command: "csv2yapet -q -p <pw> -s , input.csv out.pet && yapet2csv -q -p <pw> -s , out.pet out.csv && cmp input.csv out.csv"
  - file: test.sh
    description: "负向断言（case 7/8）：错误主口令被拒绝（非零退出）、yapet 未知选项被拒绝（getopt 返回 1）"
    driver: "test_package/conanfile.py 的 test() 通过 self.run(sh test.sh, env=conanrun) 驱动（L0d 要求 def test + self.run）"
    command: "yapet2csv -q -p wrong … → rc!=0；yapet -Z → rc!=0"
  - file: input.csv
    description: "消费者夹具：11 行 5 列 CSV（含引号内逗号、嵌入引号、空字段），改自上游 tests/converters/testimport.csv"
    command: "-"

# 测试断言总数（上游设备日志复算 + 消费者 8）
assertion_count: "源码宏口径 566（CPPUNIT_ASSERT 559 + 裸 assert 7，任务卡约数 560）为上限；用例口径 N=102（automake TESTS 75 + check-local 27）；实际执行数受 FAIL/SKIP/NOT_RUN 影响，逐项见 reports/test-report.md；消费者 8（不含在上游口径内）"
