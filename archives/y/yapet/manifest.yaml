# 软件级 manifest
# 文件位置: archives/y/yapet/manifest.yaml （ARCHIVE-SPEC v3.0）

# 软件名称（小写，与目录名一致）
software: yapet

# 显示名
display: "YAPET"

# 一句话描述
description: "Yet Another Password Encryption Tool — curses 界面密码管理器，OpenSSL（Blowfish/AES-256）+ Argon2 加密，记录存于单个 .pet 文件"

# 分类标签 crypto
category: crypto

# 官网 URL
homepage: "https://yapet.guengel.ch/"

# 开源许可证（SPDX 标识；附 OpenSSL 例外条款）
license: GPL-3.0-or-later

# 常用构建系统
build_system: autotools

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "发布版 tarball 自带 config.guess/config.sub（2018-08-29），uname -s=HarmonyOS 无法识别：须整文件补丁升级到 2026-05-17 并注入 HarmonyOS 分支输出 aarch64-unknown-linux-ohos；顶层与捆绑 libyacurs 各一份，共 4 个补丁"
    - "PKG_CHECK_MODULES 要 libargon2 模块名，conan argon2 默认产 argon2.pc：配方内 PkgConfigDeps.set_property('argon2','pkg_config_name','libargon2') 消费者侧改名，无需环境覆盖或 .pc 垫片"
    - "AC_CONFIG_SUBDIRS 捆绑 libyacurs（curses 组件库），ncurses 经其 ax_with_curses.m4 探测，依赖 -I/-L 须由 AutotoolsDeps 注入"
    - "AM_GNU_GETTEXT([external]) 需 msgfmt：device 侧 harmonybrew 有、CI worker PATH 无，必须 tool_requires gettext"
    - "make check 的 istty 门控块（tests/preload）与 /tmp 硬编码（tests/converters）按 SKIP/补丁归因处理"
  common_dependencies:
    - openssl
    - argon2
    - ncurses
    - cppunit

# 版本索引
versions:
  "2.6":
    status: built
    build_date: "2026-09-24"
    conan_ref: "yapet/2.6"
