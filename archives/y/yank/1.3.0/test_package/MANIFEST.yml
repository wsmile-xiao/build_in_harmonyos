# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: yank/1.3.0
homepage: "https://github.com/mptre/yank"

# 上游**没有**测试套件：全仓仅 yank.c + BSD Makefile + 文档，无 tests/ 目录
upstream_check_command: "上游无测试套件（0 项），无可运行入口"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_yank.sh
    description: >-
      CLI 测试（3 项断言）：-v 版本输出精确匹配 "yank 1.3.0"（1 项）→
      未知选项拒绝（非零退出 + usage 提示，2 项）。yank 为交互式选择器
      （/dev/tty 读键且 UI 模式忽略 SIGTERM），可脚本化面即退出前的探针路径；
      所有调用包 timeout -s KILL 兜底；失败即非零退出。
