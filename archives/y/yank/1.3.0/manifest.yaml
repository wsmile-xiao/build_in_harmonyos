# 版本级 manifest —— yank 1.3.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.3.0"
software: yank

status: built
build_date: "2026-09-20"
build_system: makefile

source:
  url: "https://github.com/mptre/yank/archive/refs/tags/v1.3.0.tar.gz"
  sha256: "40f5472df5f6356a4d6f48862a19091bd4de3f802b3444891b3bc4b710fb35ca"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "上游 Makefile 是 BSD make（${.CURDIR} 语法，GNU make 无法解析）且 install 规则带 install -s——配方直接用 profile 编译器编译单文件（yank.c），绕过 Makefile"
    - "不 strip：llvm-strip 产物被平台执行策略拒绝（yices 2.7.0 实证，knowledge draft）"
    - "构建环境显式清空 LD_LIBRARY_PATH（lld/libxml2 根因）"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "yank 为交互式选择器（/dev/tty 读键），可脚本化测试面 = -v 版本 + 非法正则拒绝 + 无 tty 错误契约"
  - "BSD make 的 \${.CURDIR} 语法与 install -s 在平台均不可用——单文件工具直接编译最稳"
