software: yj
version: "5.1.0"
build_system: custom
status: built
build_date: "2026-06-15"

source:
  url: "https://github.com/sclevine/yj/archive/refs/tags/v5.1.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOROOT=/storage/Users/currentUser/usr/local/go1.26/go"
    - "-ldflags=-X main.Version=5.1.0"
  dependencies:
    - "go/1.26.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Go linker mmap on HMDFS fails with permission denied (Go 1.24.x); Go 1.26.0 linker works with 'Copied OK' output"
  - "Go toolchain binaries on HMDFS need ELF signing (binary-sign-tool) for execution"
  - "Go test binaries also need ELF signing on HMDFS; use go test -c + manual sign + execution"
  - "yj is a Go project using custom build system (go build), no configure/make step needed"
