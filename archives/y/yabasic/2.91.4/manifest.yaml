# 版本级 manifest
# 文件位置: archives/y/yabasic/2.91.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.91.4"

# 软件名
software: "yabasic"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/marcIhm/yabasic/archive/refs/tags/2.91.4.tar.gz"

  # 源码校验和
  sha256: "c01b3ea5515cd4799628886074984a63913e3b2ba5bf10037ab2cd0b36166476"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 构建子目录为 tag monorepo 的 unix/lang/（自带生成的 configure）
  configure_options:
  - "--build=aarch64-unknown-linux-gnu"
  - "--host=aarch64-unknown-linux-musl"
  - "--x-includes=<合并的 conan X11 头目录>"
  - "--x-libraries=<合并的 conan X11 库目录>"
  - "LIBS=-lncursesw"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - ncurses/6.6
  - libffi/3.4.4
  - libx11/1.8.13
  - libxt/1.3.1
  - xorgproto/2025.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "yabasic 2.91.4 git tag 为 monorepo 布局，可构建 autoconf 源码在 unix/lang/ 子树"
- "HMDFS 上 autotools 助手脚本丢执行位且 chmod 无效：sh ./configure 显式路由（E490/E046）"
- "autoconf 临时目录 umask 077 在 HMDFS 不可读致 subs1.awk Permission denied：受控替换为普通 mkdir（E011/E114）"
- "ohpcd hnp make 内置 CI worker 路径默认 CXX，Makefile 未定义 CC/CXX 的包必须显式传递"
- "旧 config.sub 不识别 OHOS 三元组，用 musl 三元组代替（OHOS 为 musl 系）"
- "AC_PATH_XTRA 硬要求 X11 时，可合并 conan libx11/libxt 头与库目录传 --x-includes/--x-libraries"
- "yabasic 字符串函数带 $ 后缀（upper$/mid$），单行 if 不带 then 直接跟语句"
