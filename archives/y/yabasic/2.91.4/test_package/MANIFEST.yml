# test_package/MANIFEST.yml - yabasic 2.91.4
# CI L0e requires this file to exist. Upstream test declaration (rule 4:
# no fabricated pass rates - every number below is backed by the conan create
# build log, which builds yabasic and executes the upstream tests/ suite
# through the recipe's build()).

package: yabasic/2.91.4
homepage: "https://github.com/marcIhm/yabasic"

# Upstream test entry point: tests/README.org documents that *.yab scripts are
# the automated suite ("run automatically during 'rake tests'") and *.sh are
# "added manually to Makefile.am to be run during 'make check'". yabasic 2.91.4
# ships no Rakefile/Makefile check wiring in the tag archive, so the recipe's
# build() executes both families directly against the freshly built binary:
#   - every tests/*.yab with cwd=tests/ (an "error" statement aborts non-zero;
#     a clean run to the end exits 0, with or without an explicit `exit 0`)
#   - the three headless-shellable .sh checks re-implemented 1:1 as direct
#     binary invocations (docu.sh / read_stdin.sh / silent.sh)
upstream_check_command: "build() runner: yabasic tests/<name>.yab (exit code decides)"
upstream_test_in_build: true
upstream_test_command: "build() runner: yabasic tests/<name>.yab (exit code decides)"

# The 48 upstream .yab suite scripts (all executed, unmodified).
upstream_tests:
