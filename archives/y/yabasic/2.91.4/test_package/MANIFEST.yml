# Shell checks from the documented suite, executed unmodified in intent:
upstream_shell_checks:
  - file: tests/docu.sh
    description: "`yabasic --docu tests/resources/docu.yab` output must contain 'one' (grep -q one)"
  - file: tests/read_stdin.sh
    description: "read_stdin.yab and read_stdin2.yab must read tests/resources/digits.txt on stdin and exit 0"
  - file: tests/silent.sh
    description: "empty program tests/resources/silent.yab must produce no output at all"

# Skipped with technical reason (platform/环境限制, executed where possible):
upstream_test_skipped:
  - file: tests/bind_import.yab
    reason: "EXECUTED, non-zero exit: yabasic's `bind` writes a standalone ELF at runtime and re-executes it; HMDFS denies exec on freshly written unsigned files (E046/ELF-signing platform limit, SKILL §7) - evidence in build log"
  - file: tests/nested_bind_import.yab
    reason: "EXECUTED, non-zero exit: same bind mechanism as bind_import.yab - evidence in build log"
  - file: tests/foreign3.yab
    reason: "EXECUTED, non-zero exit: dlopen 'libcurl.so.4' - a glibc-distro library that does not exist on OHOS - evidence in build log"
  - file: tests/speed.yab
    reason: "EXECUTED, non-zero exit: shells out to stress-ng, absent on OHOS - evidence in build log"
  - file: tests/inkey.sh
    reason: "NOT EXECUTED: drives the interpreter through tmux terminal automation to feed keypresses; a headless OHOS build environment provides no tmux/TTY"
  - file: tests/print-at.sh
    reason: "NOT EXECUTED: asserts curses screen cursor positions through tmux terminal automation; unavailable headless"
  - file: tests/run_in_script.sh
    reason: "NOT EXECUTED: runs yabasic inside a shell script under tmux terminal automation; unavailable headless"

# test_package (consumer perspective: run the packaged interpreter on an
# assertion script) - HarmonyOS-added validation.
test_package_tests:
  - file: smoke.yab
    description: "Run the packaged yabasic binary on smoke.yab: arithmetic (^, min), string functions (len/upper/mid/token), arrays, subroutines and control flow (for/repeat), each expectation guarded by error (non-zero abort); prints 'smoke ok' and exits 0"
    command: "yabasic smoke.yab"

assertion_count: 11
