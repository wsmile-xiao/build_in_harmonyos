# test_package MANIFEST — yojimbo 1.13.5
name: test_package
package: yojimbo/1.13.5
test_type: conan-test-package
framework: ctest
description: >
  Loopback client/server session over the installed libyojimbo.a:
  InsecureConnect handshake (netcode connect token + libsodium AEAD over
  127.0.0.1 UDP), bidirectional reliable-ordered message exchange (plain +
  block messages), clean disconnect. The environment probe calls uname()
  (pure POSIX) and prints the rule12 verification line unconditionally
  (no platform-conditional macros, per R8).
target: OHOS aarch64 (aarch64-linux-ohos)
commands:
  - conan create . -pr:h=<profile> -pr:b=<profile>
  - ctest --test-dir build/<config> --output-on-failure
