software: yara
display: "yara"
description: "Pattern matching tool for malware identification and classification"
category: security
homepage: "https://github.com/VirusTotal/yara"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools build system, requires autoreconf -fi to generate configure"
    - "Pre-generated autotools files shipped in patches/autotools/ (CI worker has no automake)"
    - "E011: umask 077 -> 022 fix in configure/Makefile.in for HMDFS compatibility"
    - "OpenSSL dependency for crypto/hash/pe modules"
    - "Source ships pre-generated flex/bison .c files, no build-time flex/bison needed"
    - "test-exception fails due to platform signal handling differences (known limitation)"
  common_dependencies:
    - openssl/1.1.1w

versions:
  "4.5.5":
    status: built
    build_date: "2026-08-19"
