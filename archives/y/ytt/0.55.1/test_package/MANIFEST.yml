package: ytt/0.55.1
homepage: "https://github.com/carvel-dev/ytt"

upstream_check_command: "go test -v -count=1 ./..."
upstream_test_in_build: true
upstream_test_command: "go test -v -count=1 ./..."

upstream_tests:
  - file: pkg/cmd/template/cmd_test.go
    source: ytt-0.55.1/pkg/cmd/template/cmd_test.go
    description: "端到端模板渲染测试（21 个 Test 函数，覆盖 data values 与 overlays）"
    command: "go test -v ./pkg/cmd/template/ -run TestCmd"
  - file: pkg/cmd/template/cmd_data_values_test.go
    source: ytt-0.55.1/pkg/cmd/template/cmd_data_values_test.go
    description: "data values 注入与校验测试（17 个 Test 函数）"
    command: "go test -v ./pkg/cmd/template/ -run TestDataValues"
  - file: pkg/cmd/template/cmd_library_module_test.go
    source: ytt-0.55.1/pkg/cmd/template/cmd_library_module_test.go
    description: "library 模块与私有库测试（26 个 Test 函数）"
    command: "go test -v ./pkg/cmd/template/ -run TestLibrary"
  - file: pkg/yamlmeta/parser_test.go
    source: ytt-0.55.1/pkg/yamlmeta/parser_test.go
    description: "YAML 解析器测试（20 个 Test 函数）"
    command: "go test -v ./pkg/yamlmeta/ -run TestParser"
  - file: pkg/yamltemplate/template_test.go
    source: ytt-0.55.1/pkg/yamltemplate/template_test.go
    description: "yamltemplate 模板测试，驱动 filetests 下 .tpltest fixture"
    command: "go test -v ./pkg/yamltemplate/"
  - file: pkg/validations/validations_test.go
    source: ytt-0.55.1/pkg/validations/validations_test.go
    description: "schema 校验测试，驱动 validations/filetests 下 .tpltest fixture"
    command: "go test -v ./pkg/validations/"
  - file: test/e2e/e2e_test.go
    source: ytt-0.55.1/test/e2e/e2e_test.go
    description: "e2e 测试（12 个 Test 函数，通过 exec ../../ytt 调用已构建二进制）"
    command: "go test -v ./test/e2e/"
  - file: test/filetests/filetests_test.go
    source: ytt-0.55.1/test/filetests/filetests_test.go
    description: "filetests 运行器单测"
    command: "go test -v ./test/filetests/"

test_package_tests:
  - file: test.sh
    description: "消费者视角冒烟测试：ytt version / 基础模板渲染 / --data-value 覆写"
    command: "bash test.sh"

assertion_count: 158
