version: "0.55.1"
software: "ytt"
status: built
build_date: "2026-09-18"
build_system: custom
source:
  url: "https://github.com/carvel-dev/ytt/archive/refs/tags/v0.55.1.tar.gz"
  sha256: "4591a3b659dba43a6e8b3d5dd2ef9cb03011868bacab66684c0cfb6b7a698eb1"
  tar_format: tar.gz
build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "go_build_pkg=./cmd/ytt"
    - "ldflags=-X carvel.dev/ytt/pkg/version.Version=0.55.1"
    - "GOPROXY=https://goproxy.cn,https://proxy.golang.org,direct"
    - "GOTOOLCHAIN=local"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
  - patches/0001-e2e-pipe-tests-tmpdir.patch
knowledge_gained:
  - "Go 1.26.3 自举并签名，GOROOT 与 GOTMPDIR 重定向到非 HMDFS 路径"
  - "Go linker 在 HMDFS 上 mmap 失败，需将链接输出放到 link-out 后再签名拷贝"
  - "go test 生成的 .test ELF 需通过 -exec wrapper 在执行前用 binary-sign-tool 签名"
  - "上游 e2e 通过 exec ../../ytt 调用源码根已签名二进制，build() 需预先 staged"
