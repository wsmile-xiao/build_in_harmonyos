  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "本赛事 yubico-c 对应上游 Yubico/yubico-c-client (libykclient)，非 Yubico/yubico-c (libyubikey/1.13)"
  - "config.sub (2014) 不识别 ohos vendor string，--build/--host 用 aarch64-unknown-linux-gnu（编译器由 compiler_executables 指定）"
  - "E114: configure umask 077 + mktemp -d 在 HMDFS 上产生不可写 setgid 目录"
  - "E289: help2man 在 OHOS 缺失，make/install 传 MANS= man_MANS= man1_MANS= 跳过 man page 生成与安装"
  - "CONFIG_SHELL 需覆盖为 sh（profile 默认指向 /data/service/hnp/bin/bash，本地构建不存在）"

