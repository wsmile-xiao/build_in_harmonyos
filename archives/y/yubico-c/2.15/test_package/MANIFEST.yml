# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: yubico-c/2.15
homepage: "https://developers.yubico.com/yubico-c-client/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 计数口径: 独立检查项（assert / return 失败点数量）
# 上游 tests/selftest.c 为单二进制自测，使用 assert() + TEST() 宏。
# 共 30 个独立检查项：13 个离线（版本/初始化/编码/strerror），
# 17 个需网络访问 api.yubico.com（鸿蒙 CI 无外网，通过 TEST_WITHOUT_INTERNET 排除）。
upstream_tests:
  - file: tests/selftest.c
    source: ykclient-2.15/tests/selftest.c
    description: "上游自测单二进制（13 离线检查项可运行；17 网络检查项需 api.yubico.com，鸿蒙 CI 无外网不运行）"
    command: "./tests/selftest"
    status: pending
    note: "离线 13 项待设备验证；网络 17 项因无外网不运行"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "鸿蒙特有测试：验证 ykclient_global_init 在 OHOS 初始化交叉编译的 libcurl、版本一致性、离线 API（init/set_client_hex/strerror）"
    command: "./test_package"
    status: pending

# 显式 API 检查总数
# 上游离线 13 项 + test_package 9 项 = 22
assertion_count: 22
