software: yubico-c

display: "Yubico C Client (ykclient)"
description: "Yubico C client library (libykclient) for YubiKey OTP validation via YubiCloud"
category: networking
homepage: "https://developers.yubico.com/yubico-c-client/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Upstream is Yubico/yubico-c-client (libykclient); not Yubico/yubico-c (libyubikey, already adapted as libyubikey/1.13)."
    - "config.sub (2014) rejects ohos vendor string; --build/--host=aarch64-unknown-linux-gnu (actual compiler is OHOS clang via compiler_executables)."
    - "E114: configure umask 077 + mktemp -d creates drwx--S--- temp dirs on HMDFS; umask stripped in build()."
    - "mktemp wrapper (exit 1) forces mkdir fallback; LD_LIBRARY_PATH injected for conftest."
    - "CONFIG_SHELL overridden to 'sh' in buildenv: profile sets /data/service/hnp/bin/bash which does not exist on local macOS build host."
    - "libcurl/8.5.0 dependency via AutotoolsDeps + PkgConfigDeps."
    - "make -j1 to avoid HMDFS jobserver fifo EPERM."
    - "Command-line tool (ykclient) requires commands.json (R38)."

versions:
  "2.15":
    status: built
    build_date: "2026-09-18"
    conan_ref: "yubico-c/2.15"
