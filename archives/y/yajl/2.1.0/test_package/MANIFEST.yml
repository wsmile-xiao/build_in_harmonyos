# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: yajl/2.1.0
homepage: "https://github.com/lloyd/yajl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# yajl ships a shell-based test runner (test/parsing/run_tests.sh) that is not
# integrated into CMake's `test` target via ctest. The top-level CMakeLists.txt
# defines a custom `test` target that invokes run_tests.sh.
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/parsing/yajl_test.c
    source: yajl-2.1.0/test/parsing/yajl_test.c
    description: "yajl stream parser regression tests over JSON test cases"
    command: "./test/parsing/run_tests.sh"
  - file: test/api/gen-extra-close.c
    source: yajl-2.1.0/test/api/gen-extra-close.c
    description: "API-level test generator (extra close bracket handling)"
    command: "./test/api/run_tests.sh"

# 上游测试集成说明:
# conanfile.py package() 额外打包 yajl_test 二进制 + test/cases/*.json(58 个用例) + *.json.gold(期望输出)
# test_package test() 调用 yajl_test 对每个 case 从 stdin 喂入 JSON, stdout 与 .gold 逐字节比对
# 58 个用例覆盖: 基础解析、注释(ac_*)、容错(ag_*)、多文档(am_*)、部分(ap_*) 等
upstream_cases:
  total: 58
  source_dir: "test/cases/"
  harness: "yajl_test (packaged in bin/, driven by test_package test())"
  coverage: "全部 58 个 test/cases/*.json 回归用例 + .gold 期望输出比对"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：用 yajl_tree_parse 解析 JSON 并用 yajl_tree_get 提取字符串/整数值"
    command: "./test_yajl"

# 测试断言总数 (近似值, 用于质量评估)
# test.c: name==test, nested.key==hello, value==42 → 3 assertions
assertion_count: 3
