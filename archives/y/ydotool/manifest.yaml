# 软件级 manifest — ydotool
# 文件位置: archives/y/ydotool/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: ydotool
display: "ydotool"
description: "Generic command-line input automation tool via Linux uinput (client ydotool + daemon ydotoold)"
category: utility
homepage: "https://github.com/ReimuNotMoe/ydotool"
license: AGPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "编译面：OHOS native sysroot 自带 linux/uinput.h 与 linux/input-event-codes.h（struct uinput_setup、UI_DEV_SETUP/UI_DEV_CREATE/UI_SET_*_BIT 全可用），uinput API 零改动通过编译"
    - "运行面：/dev/uinput 设备节点对普通用户进程 EACCES（/proc/misc 有 `223 uinput`，内核支持存在；SELinux/ueventd 管控拒绝访问）。ydotoold 无法以普通进程创建虚拟输入设备——需系统级权限（root/system domain）；属平台安全模型边界，本包不伪造该能力"
    - "socket 路径：/tmp 只读（E002/E052 同族，touch 报 Read-only file system），上游默认 socket 路径 /tmp/.ydotool_socket 在 OHOS 不可用；须用 `ydotoold -p $TMPDIR/...` 或 XDG_RUNTIME_DIR（客户端/服务端同源回退逻辑）"
    - "AF_UNIX 路径名 socket bind() 被 SELinux 拒绝（E024：真机域 hishell_hap 下所有可写文件系统 EPERM；abstract/TCP 可用）——daemon/client 的 socket 通道需在允许该操作的执行域运行；消费者测试以能力探针 + 条件执行适配该边界"
    - "版本宏：源码归档无 git 元数据，上游 `execute_process(git describe ...)` 失败后 VERSION 宏为空（--version 输出 unknown）；补丁 0001 支持 -DYDOTOOL_VERSION 覆盖 + 版本回退（配方从 self.version 注入）"
    - "man 页：上游 manpage/CMakeLists.txt 无条件执行 scdoc（ALL target），OHOS 无 scdoc 会导致构建失败；补丁 0002 将 man 页改为可选（scdoc 缺失时跳过）"
    - "CMake ≥4.0 拒绝 cmake_minimum_required(VERSION 3.4)（<3.5 兼容已移除）；配方注入 CMAKE_POLICY_VERSION_MINIMUM=3.5，源码零改动"
    - "上游无测试套件；test_package 以用户态 AF_UNIX 对端（mock_daemon）逐字节断言客户端线协议，并覆盖 CLI 契约、负路径与 /dev/uinput 平台边界，共 16 条断言"
  common_dependencies: []

versions:
  "1.0.4":
    status: built
    build_date: "2026-09-26"
    conan_ref: "ydotool/1.0.4"
