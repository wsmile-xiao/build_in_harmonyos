knowledge_gained:
  - "OHOS native sysroot 提供 linux/uinput.h 与 linux/input-event-codes.h（struct uinput_setup/UI_DEV_SETUP/UI_DEV_CREATE/UI_SET_*_BIT 实测可编译），uinput 客户端的编译面零改动（ref: DRAFT-12283-ohos-uinput-injection-device-permission-boundary）"
  - "OHOS 运行时 /dev/uinput 对普通用户进程 EACCES：内核支持存在（/proc/misc `223 uinput`），设备节点访问被 SELinux/ueventd 管控——注入类工具（ydotool/uinput）需系统级权限方能创建虚拟输入设备，属平台安全模型边界（ref: DRAFT-12283-ohos-uinput-injection-device-permission-boundary）"
  - "系统目录 /tmp 只读（EROFS，E002/E052 同族）导致上游默认 socket 路径 /tmp/.ydotool_socket 不可用；-p $TMPDIR/... 或 XDG_RUNTIME_DIR 为可用替代，客户端与守护进程的路径回退逻辑一致（ref: E002/E052、DRAFT-12283-socket-dependent-tests-probe-gated-adaptation）"
  - "源码归档（GitHub tag tarball）无 git 元数据：上游 execute_process(git describe) 取版本失败后 VERSION 宏为空（--version 输出 unknown）——发布源码归档的软件需提供版本注入/回退路径（小补丁）（ref: DRAFT-12283-source-archive-version-injection）"
  - "可选文档工具（scdoc）被上游作为 ALL target 无条件执行导致构建失败；补丁使 man 页在工具缺失时跳过——'文档工具不应成为构建硬依赖'的通用处理范式（ref: DRAFT-12283-source-archive-version-injection）"
  - "CMake ≥4.0 拒绝 cmake_minimum_required(VERSION 3.4)（<3.5 兼容移除），注入 CMAKE_POLICY_VERSION_MINIMUM=3.5 可零补丁解决（ref: E103/E187）"
  - "AF_UNIX 路径名 socket bind() 在 OHOS 被 SELinux 拒绝（真机域 u:r:hishell_hap:s0，所有可写文件系统 EPERM，E024 同族；abstract socket/TCP 可用）——ydotool 类 daemon/client 架构在受限执行域无法建立 socket 通道；测试按 E024 自适应（A8 能力探针 + 协议断言条件执行）（ref: E461/E024、DRAFT-12283-socket-dependent-tests-probe-gated-adaptation）"
  - "源码归档内的版本来源不可依赖 git：若构建目录恰在无关 git 仓库内，git describe 会返回无关标签——打包覆盖（-DYDOTOOL_VERSION）应优先于 git 元数据，保证包版本稳定（本配方补丁 0001 即此序）（ref: DRAFT-12283-source-archive-version-injection）"

