  note: "上游无测试套件：v1.0.4 源包 21 个文件中无 tests/ 目录，全树无 enable_testing()/include(CTest)/add_test()/ctest 引用，无测试框架依赖；GitHub workflow 仅 configure+build。test_package 设计 16 条消费者断言（CLI 契约与产物 7 + AF_UNIX 能力探针 1 + 线协议逐字节 7 + /dev/uinput 平台边界 1）；OHOS 真机（E024：SELinux 禁止 AF_UNIX bind）执行 9 条全通过、7 条协议断言平台受限跳过，在允许 AF_UNIX 的环境自动 16/16。证据见 test_package/MANIFEST.yml 与 reports/test-report.md（R51）"

