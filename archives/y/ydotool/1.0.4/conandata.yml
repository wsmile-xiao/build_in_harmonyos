# conandata.yml — ydotool 1.0.4
# Upstream: ReimuNotMoe/ydotool (AGPL-3.0-or-later).
# Official source URL verified on device 2026-09-26: the GitHub release tag
# archive https://github.com/ReimuNotMoe/ydotool/archive/refs/tags/v1.0.4.tar.gz
# SHA256 verified on device against the downloaded tarball (matches the
# .tarball-sha256 recorded by init-build):
#   ba075a43aa6ead51940e892ecffa4d0b8b40c241e4e2bc4bd9bd26b61fde23bd

sources:
  url: "https://github.com/ReimuNotMoe/ydotool/archive/refs/tags/v1.0.4.tar.gz"
  sha256: "ba075a43aa6ead51940e892ecffa4d0b8b40c241e4e2bc4bd9bd26b61fde23bd"

patches:
  # Release tarballs carry no git metadata; `git describe` fails and the
  # VERSION macro would be empty ("unknown"). Add a packaging override
  # (-DYDOTOOL_VERSION, fed from conanfile.generate()) with a release fallback.
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Resolve VERSION from -DYDOTOOL_VERSION / git metadata with a release fallback instead of relying on git describe alone (release tarballs have no git metadata)"
    patch_type: "portability"
  # Upstream runs scdoc unconditionally for the man pages; scdoc is an optional
  # documentation tool and is absent from this platform, which made the ALL
  # target fail. Only build/install man pages when scdoc is available.
  - patch_file: "patches/0002-manpage-CMakeLists.txt.patch"
    patch_description: "Make man page generation optional when scdoc is not installed (upstream documentation-only dependency)"
    patch_type: "portability"
