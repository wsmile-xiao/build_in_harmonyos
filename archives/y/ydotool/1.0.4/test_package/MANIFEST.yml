# test_package/MANIFEST.yml — ydotool 1.0.4
# R34/R51: test_package must exercise the packaged binaries
#
# E024 平台限制说明（真机实测，与知识库 E024 一致）：
#   HarmonyOS SELinux（真机 hishell_hap 域）禁止 AF_UNIX 路径名 socket 的
#   bind()，所有可写文件系统均返回 EPERM ("Operation not permitted")。
#   ydotool 客户端——守护进程链路依赖 AF_UNIX 数据报 socket，因此 A9-A15
#   的逐字节线协议断言在 OHOS 上无法执行，test.sh 按 E024 记为跳过（不计
#   失败），在允许 AF_UNIX 的环境中会自动执行（16/16）。A8 即为该平台能力
#   探针（LISTENING 或 BIND-FAILED errno=1），A16 为 /dev/uinput 平台边界。

package: ydotool/1.0.4
homepage: "https://github.com/ReimuNotMoe/ydotool"

# R51 上游测试三步法:
# 1. 清点: v1.0.4 源码包共 21 个文件（.editorconfig / .gitignore /
#    .github/{FUNDING.yml, workflows/push_pr_build_cmake.yml,
#    workflows/release_cmake.yml} / CMakeLists.txt / Client/{tool_click.c,
#    tool_key.c, tool_mousemove.c, tool_type.c, ydotool.c, ydotool.h} /
#    Daemon/{CMakeLists.txt, ydotoold.c, ydotool.service.in,
#    ydotool.service-openrc.in} / LICENSE / README.md /
#    manpage/{CMakeLists.txt, ydotool.1.scd, ydotoold.8.scd}），无 tests/、
#    test/、unittests/ 目录；全树无 enable_testing() / include(CTest) /
#    add_test() / ctest 引用，无任何测试框架依赖；.github 工作流仅
#    configure+build 两个二进制（无任何测试步骤）。
# 2. 实测: 无测试目标可运行（CMake 未注册任何测试；`ctest -N` 无用例）。
# 3. 结论: 上游真实可运行测试数 = 0，PR 声明 0，不多报不少报。

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "none  # 无 enable_testing()/add_test()，无测试目标"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (0 个)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 设计 16 条断言)
test_package_tests:
  - file: test.sh
    description: >-
      A1 ydotool help 列出命令集; A2 未知命令退出码 1 + 提示; A3
      ydotoold --version 输出打包版本 1.0.4（补丁 0001）; A4 ydotoold
      --help 退出码 0; A5 缺失 socket → 退出码 2 + "failed to connect
      socket" + "Please check if ydotoold is running"; A6 非 socket 路径 →
      退出码 2（负路径）; A7 两个产物存在且为 ELF; A8 平台 AF_UNIX 能力
      探针（mock daemon 绑定成功 → LISTENING；E024 受限 → BIND-FAILED
      errno=1 记录平台限制）; A9-A15 线协议逐字节断言（仅 AF_UNIX 可用时
      执行）——key 单键、key 按下/抬起、click 0xC0（BTN_LEFT=272）、
      mousemove 相对位移、mousemove --absolute 的 INT32_MIN 同步标记、
      type a（KEY_A=30）、type A（LEFTSHIFT=42 包裹）; A16 真实 ydotoold
      + /dev/uinput 平台边界（可用则 READY 并转发事件；被平台阻断则退出码
      2 + "failed to open uinput device"）
    command: "bash test.sh"

# 测试断言总数 (设计 16: CLI 契约与产物 7 + 平台能力探针 1 + 线协议 7 +
# 平台边界 1; OHOS E024 环境执行 9 条全通过、7 条线协议断言跳过)
assertion_count: 16
