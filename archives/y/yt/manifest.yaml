software: yt
# 软件级 manifest
# 文件位置: archives/y/yt/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

name: yt
description: "yt — 天体物理/天体模拟数据分析工具包（Python，上游 54 个 Cython 扩展源 / wheel 内 53 个已编译扩展模块），封装 HarmonyOS 社区源 OHOS aarch64 预编译 wheel"
category: science
license: BSD-3-Clause
homepage: "https://github.com/yt-project/yt"

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.4.2":
    status: built
    build_date: "2026-09-17"
    tarball: "yt-4.4.2-ohos-aarch64.tar.gz"

# ============================================================
# 源码信息
# ============================================================

source:
  upstream_url: "https://github.com/yt-project/yt"
  registry_url: "https://pypi.cnb.cool/OpenHarmonyPCDeveloper/pypi/-/packages/packages/c9/10/6a448267a2d4fe26eb1442d33b9a88c481ef74f82149a55535072870d857/yt-4.4.2-cp312-cp312-ohos_aarch64.whl"

# ============================================================
# 运行时依赖
# ============================================================

runtime_dependencies:
  - "python3 == 3.12"
  - "numpy >= 1.22, < 2.3（平台 scipy 1.14.1 约束；包内已捆绑 2.2.6）"

# ============================================================
# 备注
# ============================================================

notes: "yt 4.4.2 上游含 54 个 Cython 扩展源（wheel 内 53 个已编译扩展模块），本归档走『封装 OHOS 预编译 wheel』路径（PATH A/B 中的 A 路径配方 + 知识图谱草稿）。安装后需按本机 EXT_SUFFIX 归一化扩展后缀（*.cpython-312-aarch64-linux-ohos.so → *.cpython-312.so），并捆绑运行时依赖闭包（pip 实测 20 个分发：numpy 2.2.6/matplotlib 3.11.1/unyt 3.1.0/cmyt 2.0.2/ewah-bool-utils 1.3.0/tqdm/sympy/pillow 等），使 `conan install yt/4.4.2` 后 `yt` CLI 与 `import yt` 均可直接离线使用。"
