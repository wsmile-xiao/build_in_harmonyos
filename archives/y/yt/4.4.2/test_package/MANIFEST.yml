# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: yt/4.4.2
homepage: "https://yt-project.org"

# 上游测试命令（yt 上游使用 pytest 驱动，非 autotools make check）
upstream_check_command: "python3 -m pytest yt"

# build() 内未集成上游测试：本适配走"封装 OHOS 预编译 wheel"路径，build() 只做
# 安装+扩展后缀归一化+自检；上游全量套件由适配方对 packaged tree 完整执行，
# 实测结果（通过/失败/错误计数）记录于 notes.md「三、测试」小节与 PR 正文
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: yt/**/tests/test_*.py
    source: yt-4.4.2/yt/
    description: "上游 pytest 套件：51 个 tests 目录 / 214 个测试文件 / 1041 个 test_* 函数（口径：上游源树内 grep -rhE '^[[:space:]]*def test_' --include='test_*.py' yt | wc -l），覆盖 units、geometry、fields、frontends、visualization、data_objects、utilities 等"
    command: "python3 -m pytest yt -q"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_yt_consumer.py
    description: "消费者集成测试（7 组真实断言）：导入+版本、运行时依赖闭包、鸿蒙扩展后缀归一化（53 个 .so 全部为 .cpython-312.so）、Cython 编译扩展加载、真实数据集分析（4096 cells 总质量/温度极值）、投影编译路径、派生字段+单位系统（含负对照：把刻意错误的派生实现真的送进 yt 的 add_field 机制，断言同一条逐格相对误差判据会拒绝它；改回正确实现即失败，已实测可翻转）；对 OHOS 上被 hmmac 拒绝的 Conan 用户路径，测试改为静态校验并以 0 退出：每个 .so 的 ELF magic + .codesign 段，外加两道守卫——E580 扩展后缀归一化守卫（每个扩展文件名须能按「模块名 + 运行解释器接受的后缀」解析，即 import 机制确实加载得到；并断言扩展数不低于基线 93。后缀集合取自运行解释器的 importlib.machinery.EXTENSION_SUFFIXES，不硬编码平台标签——CI worker 的 HNP python 其 EXT_SUFFIX 本身带平台标签、设备侧为 .cpython-312.so，两者接受的名字不同）与包 API 版本断言（按文件路径执行包内 yt/_version.py，核对 __version__ 与 dist-info 元数据 == 被测引用版本），并说明运行时 import 需在真机上经 HNP 安装"
    command: "python3 test_yt_consumer.py"

# assertion_count 字段名沿用 CI L0e / templates/test_package/MANIFEST.yml.tmpl /
# docs 约定的 schema key（更名为兼容性风险，故保留），但其精确含义并非 pytest 的
# assert 语句数，也非 collect 到的用例数——它统计的是：
#   「上游源树内 test_*.py 文件中 `def test_` 函数声明的数量」。
# 统计命令: grep -rhE '^[[:space:]]*def test_' --include='test_*.py' yt | wc -l
# 已实测：1041 个 `def test_` 函数 = 被上游 81 条 --ignore-glob 排除的 71 个模块
#   （含 517 个） + 被覆盖的 143 个模块（含 524 个）。
# 与本仓 reports/test-report.md 的 pytest collect 口径（901 项 / 143 个模块）是
#   不同量纲，二者不矛盾（详见 test-report.md §4.3 与 pr-body.md 模块计数口径注）。
assertion_count: 1041
# 显式声明 assertion_count 的计数口径（预置 schema key，见 archives/a/abx/0.1 等先例）
assertion_count_basis:
  counts: "上游 test_*.py 中 `def test_` 函数声明数（非 pytest assert 语句数，非 collect 用例数）"
  command: "grep -rhE '^[[:space:]]*def test_' --include='test_*.py' yt | wc -l"
  upstream_test_files: 214
  excluded_modules: 71
  retained_modules: 143
  pytest_collected_items: 901
