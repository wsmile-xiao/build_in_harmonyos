# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 预编译 wheel 的 C 扩展名后缀（*.cpython-312-aarch64-linux-ohos.so）与镜像内 Python 的 EXTENSION_SUFFIXES（.cpython-312.so）不一致，安装后必须按 sysconfig EXT_SUFFIX 归一化，否则 import 直接失败（ref: knowledge/drafts/E580-draft-4E17.kv）"
  - "OHOS 社区源 scipy 1.14.1 要求 numpy<2.3，而索引默认解析 numpy 2.5.x；Python 依赖闭包必须显式钉 numpy<2.3（实测 2.2.6 可用），否则套件收集期即报 numpy._core 导入失败（ref: knowledge/drafts/E581-draft-4E17.kv）"
  - "CI worker 与设备 Python 的扩展后缀口径不同（CI 侧 EXT_SUFFIX/SOABI 带 MULTIARCH，形如 .cpython-312-aarch64-linux-ohos.so，设备侧为 .cpython-312.so；同轮日志 normalised 0 vs 93），因此归一化目标与静态守卫的合法性判据都必须取运行解释器的 importlib.machinery.EXTENSION_SUFFIXES——硬编码平台标签正则会误判 CI 上本可加载的文件名（ref: knowledge/drafts/E583-draft-4E17.kv）"
  - "复用既有知识：E036（Python 平台/文件系统配置）、E319（Python 网络与打包）、E512（Python 依赖与 CI 环境）、E077（链接/打包/安全）——ref: knowledge/graph/E036.kv, knowledge/graph/E319.kv, knowledge/graph/E512.kv, knowledge/graph/E077.kv"
