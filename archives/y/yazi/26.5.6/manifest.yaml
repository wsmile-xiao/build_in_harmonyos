# 编译中学到的知识
knowledge_gained:
  - "tikv-jemallocator 在 OHOS HMDFS 上 configure 无法创建临时文件，需要移除并使用系统默认分配器"
  - "Rust cargo 编译需要 ohos-clang wrapper 将 --target=aarch64-unknown-linux-musl 替换为 --target=aarch64-linux-ohos"
  - "RUSTFLAGS=-C linker=ohos-clang 让 cargo 使用 OHOS clang 作为 linker"
  - "TMPDIR 需设为 /data/storage/el2/base/haps/entry/temp 以避免 HMDFS 临时文件问题"

