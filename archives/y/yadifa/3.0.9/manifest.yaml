# 版本级编译元数据 — yadifa 3.0.9（ARCHIVE-SPEC v3.0）

version: "3.0.9"
software: yadifa
status: built
build_date: "2026-09-25"
build_system: cmake
conan_ref: "yadifa/3.0.9"
homepage: "https://www.yadifa.eu"
license: BSD-3-Clause

source:
  url: "https://github.com/yadifa/yadifa/archive/refs/tags/v3.0.9.tar.gz"
  sha256: "dbdf4b07bdac616b01a07a5f511ba4083720607071c4ef5f8b49327de0fcc2e7"
  tar_format: tar.gz
  upstream_tag: "v3.0.9"
  note: >-
    上游官方 GitHub tag 归档（R39 官方源头口径）。conandata.yml 只保留官方标量 URL；
    框架在 conan create 期间会临时注入镜像前源并以 trap 回滚，提交态若见镜像即为脏版残留。

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_INSTALL_BINDIR=bin"
    - "-DCMAKE_INSTALL_SBINDIR=bin"
    - "-DCMAKE_INSTALL_SYSCONFDIR=res/etc"
    - "-DCMAKE_INSTALL_LOCALSTATEDIR=res/var"
    - "-DOPENSSL_ADDITIONAL_PATH 指向 openssl 依赖的 package_folder"
  dependencies:
    - "openssl/3.5.8.1"
  bundled_dependencies:
    - "dnscore（上游内部库，安装到包内 lib/）"
    - "dnsdb（上游内部库，安装到包内 lib/）"
    - "dnslg（上游内部库，安装到包内 lib/）"
    - "libyaml（上游自带）"
  cc: clang
  cxx: clang++
  env_vars:
    - "CFLAGS 与 CXXFLAGS 追加 -D__MUSL__（激活上游 musl 守卫）"
    - "ctest 阶段注入 LD_PRELOAD 与 YADIFA_TEST_TMPDIR（仅测试期，不进产物）"

patches_applied:
  - "0001-findopenssl-additional-path-injectable.patch"
  - "0002-dnscore-pthread-musl-fallback.patch"
  - "0003-thread-affinity-musl-guard.patch"

knowledge_gained:
  - "上游自带 FindOpenSSL 只探测硬编码系统路径时，用最小补丁把无条件 set 改成 if(NOT DEFINED) 以接受 -D 注入，再由配方传 Conan 依赖的 package_folder（conan2 组件对象没有 cpp_info.rootpath）。"
  - "CMake 安装期改写 RPATH 会让 OHOS 链接期嵌入的 .codesign 与产物不同源：包目录产物 execve 得 EPERM(126)、私有 .so 报 Error loading shared library；须对 bin/ 与 lib/ 的 ELF 实体无条件 objcopy --remove-section .codesign 后 selfSign 重签并复验执行。"
  - "只读 /tmp 使硬编码 /tmp 的整套件测试失绿时，测试期 LD_PRELOAD 具名路径重写 shim 可复活它们；前缀匹配必须先折叠重复斜杠，否则 //tmp/ 形态绕过。"
  - "上游版本旗标可能打印版本却返回非零（yadifa -V 与 --version 实测 rc=1，-h 实测 rc=0）：消费者测试的退出码断言必须按实测行为写，不能默认 0。"

tests:
  upstream:
    command: "ctest --parallel 2 --output-on-failure --timeout 120（配方 build() 内真实执行）"
    counting_unit: "CMake add_test 声明（lib/*/tests/*/CMakeLists.txt）"
    declared_n_static: 860
    registered: 858
    executed: 858
    passed: 758
    failed: 100
    skipped: 0
    total_seconds: 612.73
    evidence: "reports/conan-create-full.log 汇总行 log:19899，失败清单自 log:19904 起（2026-09-28 01:26 CI 同构轮，绑 HEAD 8dd95cfcf7）"
    breakdown_by_group:
      fdtools: 51
      rest_server: 19
      xfr_input_stream: 7
      dns_message: 8
      mutex: 5
      file_input_stream: 3
      chroot: 2
      crypto: 1
      error_state: 1
      parser: 1
      pushback_input_stream: 1
      rewind_input_stream: 1
    attribution: >-
      fdtools 与 rest_server 两组 SEGFAULT 归因 glibchooks（glibc 内部符号 interposition）
      在 musl 上不可用；chroot 组归因 seccomp 按号拦截；超时组为时序敏感；其余是断言级
      行为差异。整份日志 EROFS 命中 0 处，只读 /tmp 已不再是失败原因。
  consumer:
    command: "test_package/test_yadifa_consumer <package bin dir>"
    programs: 1
    assertions: 4
    assertion_list:
      - "回环 DNS 服务端校验客户端报文的 qname 与 qtype"
      - "包内客户端打印出服务端应答的 A 记录"
      - "包内客户端 -V 输出含打包版本串"
      - "包内客户端 -h 退出码 0 且有输出"
    evidence: "见 notes.md 验证结果节的消费者取证行号"

blockers: []

path_b:
  candidate: "knowledge/drafts/DRAFT-yadifa-3.0.9-ld-preload-tmp-redirect"
  issue: "#3201"
  evidence: "notes.md 路径 B 判定素材节（含 knowledge/drafts 手工 grep 结果与既有 E 条目行号）"
  note: "判定口径由主理定案，本文件只登记证据位置"
