# test_package/MANIFEST.yml
# 上游官方测试声明文件
# yadifa 3.0.9 上游测试：上游同时带 configure.ac（无 check 目标，grep
# TESTS/check_PROGRAMS 为空）与 CMake/CTest——lib/*/tests/*/CMakeLists.txt
# 注册 860 个 add_test（每条 COMMAND <prog> <case>），配方走 CMake +
# cmake.ctest() 真实执行。

package: yadifa/3.0.9
homepage: "https://www.yadifa.eu"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N (BUILD_TESTING=On，860 个 add_test)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.build() + cmake.ctest(--output-on-failure --timeout 120)"

# 上游实际运行的测试程序
upstream_tests:
  - file: ctest 套件
    source: yadifa-3.0.9/lib/*/tests/*/CMakeLists.txt（dnscore-test/config-test/fdtools-test 等测试程序）
    description: "860 个 CTest 用例：dnscore 解析/配置/文件流/线程/网络回环"
    command: "ctest --output-on-failure --timeout 120"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_yadifa_consumer.c
    description: "消费者测试 — 内建回环 DNS 服务器 + 包内 yadifa dig 子命令真实查询/解析断言 + yadifa -V 版本断言（4 项断言）"
    command: "./test_yadifa_consumer <bin_dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 860
