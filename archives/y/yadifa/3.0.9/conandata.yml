# conandata.yml — yadifa 3.0.9
sources:
  url: "https://github.com/yadifa/yadifa/archive/refs/tags/v3.0.9.tar.gz"
  sha256: "dbdf4b07bdac616b01a07a5f511ba4083720607071c4ef5f8b49327de0fcc2e7"

patches:
  - patch_file: "patches/0001-findopenssl-additional-path-injectable.patch"
    patch_description: "Let the bundled OpenSSL finder honor a pre-set OPENSSL_ADDITIONAL_PATH so the Conan openssl package root can be injected"
    patch_type: "portability"
  - patch_file: "patches/0002-dnscore-pthread-musl-fallback.patch"
    patch_description: "Fall back to plain 'pthread' when find_library misses standalone libpthread (musl/OHOS sysroot keeps pthread symbols in libc)"
    patch_type: "portability"
  - patch_file: "patches/0003-thread-affinity-musl-guard.patch"
    patch_description: "Skip pthread_setaffinity_np CPU-affinity hint on musl (OHOS libc has no _np affinity call); thread_setaffinity returns FEATURE_NOT_IMPLEMENTED_ERROR"
    patch_type: "portability"
