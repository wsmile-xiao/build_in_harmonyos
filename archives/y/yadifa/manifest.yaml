software: yadifa
display: "yadifa — YADIFA authoritative DNS server suite"
description: "EURid 维护的权威 DNS 服务器套件：yadifad 服务进程、yadifa 控制与查询客户端、yadifa-keygen 密钥生成、yadifa-zonesign 区域签名、yakeyrolld 密钥滚动；纯 C，CMake 构建，上游测试经 CTest 驱动"
category: networking
homepage: "https://www.yadifa.eu"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游自带 cmake/FindOpenSSL.cmake 只探测硬编码系统路径（/usr/local/openssl、/usr/local、/usr），Conan 依赖对其不可见，configure 报 crypto: not found；补丁 0001 把无条件的 set(OPENSSL_ADDITIONAL_PATH) 改成 if(NOT DEFINED) 包裹，配方在 generate() 里注入 openssl 的 package_folder（注意 conan2 组件对象没有 cpp_info.rootpath，必须用 package_folder）"
    - "musl/OHOS 侧没有独立 libpthread，也没有 glibc 的 pthread_setaffinity_np 扩展；补丁 0002 让 find_library 未命中时回落到裸 pthread，补丁 0003 守卫 affinity 调用，并在 build() 里加 -D__MUSL__ 激活上游自带的 musl 头文件守卫（E091 同族）"
    - "上游 CMake 工程没有 OHOS 平台模块，交叉构建按 Linux 描述：CMAKE_SYSTEM_NAME=Linux、CMAKE_SYSTEM_PROCESSOR=aarch64；BUILD_TESTING=On 保留 858 条 CTest 注册供 build() 真实执行"
    - "安装目录收拢：yadifad 默认装 sbin，而 Conan 包只暴露一个 bin 目录，故 CMAKE_INSTALL_BINDIR 与 CMAKE_INSTALL_SBINDIR 同为 bin，etc/var 落到 res/ 子目录"
    - "OHOS 的 /tmp 是只读文件系统（E002），而上游测试把临时路径硬编码为 /tmp：测试阶段用 LD_PRELOAD 路径重定向 shim 把 /tmp 前缀改写进 YADIFA_TEST_TMPDIR 指向的可写目录；不改上游源码、不进打包产物、不改测试分母"
  common_dependencies:
    - "openssl/3.5.8.1"

versions:
  "3.0.9":
    status: built
    build_date: "2026-09-25"
    conan_ref: "yadifa/3.0.9"
    source_url: "https://github.com/yadifa/yadifa/archive/refs/tags/v3.0.9.tar.gz"
