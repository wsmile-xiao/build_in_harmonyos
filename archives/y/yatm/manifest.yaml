software: yatm
display: "YATM"
description: "Command line audio player with time stretching and pitch control"
category: multimedia
homepage: "https://github.com/mlang/yatm"
license: "GPL-2.0-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Uses Conan PkgConfigDeps so upstream pkg_search_module sees only declared dependencies"
    - "Uses the libao built-in null driver for headless runtime validation"
  common_dependencies:
    - libao-pulse
    - libmad
    - libsndfile
    - soundtouch
    - slang
    - speex
    - libogg

versions:
  "0.9":
    status: built
    build_date: "2026-09-29"
    conan_ref: "yatm/0.9"
