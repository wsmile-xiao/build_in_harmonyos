  # GNU Savannah 下载路径已失效（yydecode group 不存在）。
  url: "https://sourceforge.net/projects/yydecode/files/yydecode/0.2.10/yydecode-0.2.10.tar.gz"
  # 与 Debian 未修改的 .orig.tar.gz 逐字节一致，佐证为原始上游源码
