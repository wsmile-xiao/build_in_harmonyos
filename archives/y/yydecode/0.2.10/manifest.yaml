    缺陷，与 HarmonyOS 无关。二者以 automake 自带的 XFAIL_TESTS 声明为
    预期失败，未修改任何上游测试文件。

test_package:
  assertion_count: 6
  description: "执行打包后的 yydecode 二进制：--version、yEnc 解码与参考载荷逐字节比对、按头部文件名解码、损坏 CRC32 输入被拒绝并隔离为 .broken"
