# test_package/MANIFEST.yml — yydecode 0.2.10
# Upstream test declaration (CI L0e) + consumer test description.

package: yydecode/0.2.10
homepage: "https://sourceforge.net/projects/yydecode/"

# Upstream regression suite lives in checks/ and is registered with automake
# (checks/Makefile.am: TESTS = t0.sh .. t8.sh).  It is exercised from the
# recipe build() via `make check`.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check XFAIL_TESTS='t3.sh t7.sh'"

upstream_tests:
  - file: checks/t0.sh
    source: yydecode-0.2.10/checks/t0.sh
    description: "Decode the yEnc reference stream and compare with the reference payload"
    command: "../src/yydecode yEnc.reference && cmp data.reference data.output.bin"
  - file: checks/t1.sh
    source: yydecode-0.2.10/checks/t1.sh
    description: "--force-overwrite really overwrites an existing output file"
    command: "../src/yydecode --force-overwrite yEnc.reference && cmp data.reference data.output.bin"
  - file: checks/t2.sh
    source: yydecode-0.2.10/checks/t2.sh
    description: "--force-overwrite combined with --write-broken"
    command: "../src/yydecode --force-overwrite --write-broken yEnc.reference && cmp data.reference data.output.bin"
  - file: checks/t3.sh
    source: yydecode-0.2.10/checks/t3.sh
    description: "Mixed good/bad parts (needs fixture uuencode.mixed_parts, absent from the tarball)"
    command: "../src/yydecode yEnc.mixed_parts yEnc.mixed_parts"
  - file: checks/t4.sh
    source: yydecode-0.2.10/checks/t4.sh
    description: "Broken input is rejected and output renamed to data.output.bin.broken"
    command: "../src/yydecode yEnc.broken_parts"
  - file: checks/t5.sh
    source: yydecode-0.2.10/checks/t5.sh
    description: "Parts supplied in reverse order still decode correctly"
    command: "../src/yydecode yEnc.reverse_order && cmp data.reference data.output.bin"
  - file: checks/t6.sh
    source: yydecode-0.2.10/checks/t6.sh
    description: "uuencode and Base64 input (and mixed piped input)"
    command: "../src/yydecode uuencode.reference && ../src/yydecode base64.reference"
  - file: checks/t7.sh
    source: yydecode-0.2.10/checks/t7.sh
    description: "Bad CRC32 handling / --broken-encoder (needs fixture yEnc.crc01, absent from the tarball)"
    command: "../src/yydecode yEnc.crc01"
  - file: checks/t8.sh
    source: yydecode-0.2.10/checks/t8.sh
    description: "-D/--directory writes the decoded file into the given directory"
    command: "../src/yydecode -D tmp yEnc.reference && cmp data.reference tmp/data.output.bin"

# Consumer-side test run through `conan create` (test_package).
test_package_tests:
  - file: test.sh
    description: "Runs the packaged yydecode binary: version check, yEnc decode vs reference payload, and rejection of a corrupt CRC32 stream"
    command: "bash test.sh testdata"

# Approximate number of assertions performed by the consumer test
# (2 upstream-independent runs + 3 output comparisons + 1 negative case).
assertion_count: 6
