# 软件级 manifest — yydecode
# 遵循 ARCHIVE-SPEC v2.0

software: yydecode
display: "yydecode"
description: "yEnc / uuencode / Base64 编码的 Usenet 二进制解码命令行工具"
category: utility
license: GPL-2.0-or-later
homepage: "https://sourceforge.net/projects/yydecode/"
repository: "https://sourceforge.net/projects/yydecode/"

keywords:
  - yenc
  - uudecode
  - base64
  - usenet
  - decoder

build_system: autotools

ohos_adaptation:
  key_points:
    - "config.status 在 HMDFS 上创建临时目录时，umask 077 + toybox mktemp -d 会生成不可写目录（drwx--S---）导致 configure 失败；补丁 0001 将 umask 改为 022"
    - "上游 make install 走通用 install -c，OHOS 构建环境的 install 包装脚本在成功复制后仍返回非零，故 recipe 的 package() 直接 copy 可执行文件到 bin/"
    - "无第三方依赖，仅链接 libc"
  common_dependencies: []

versions:
  0.2.10:
    status: built
    build_date: "2026-09-18"
    patches: 1
