# 版本级 manifest — yasw 0.6
# 遵循 ARCHIVE-SPEC v2.0
#
# 状态：built —— 上游源码已在 OHOS aarch64 上真实编译、封装并通过全部本地验证。
#   * 构建：qmake（harmonyos-clang spec）+ make -j1，EXIT=0；产物为 OHOS arm64 musl ELF，
#     NEEDED 含 libQt5PrintSupport/Widgets/Gui/Xml/Core + libc++_shared。
#   * conan create：EXIT=0；test_package 3 用例 / 9 断言全部通过（含 GUI 真实启动 124）。
#   * conan-verify：G1/G2/G3/G4 全 PASS（L2/L4/L5 因 harness 既有缺陷自动跳过；
#     已另行对包产物执行 L2 等效冒烟实测，3/3 用例通过，见 notes.md）。
# 未执行（等用户确认）：commit / push / Issue / PR / 上传制品 / 远端 Review。
# 依赖决策：采用 qt/5.15.19.1 作为直接依赖，不修改任何依赖包、不开依赖 PR。

version: "0.6"
software: "yasw"
status: built
build_date: "2026-09-21"
build_system: qmake

source:
  url: "https://downloads.sourceforge.net/project/yascanw/YASW%200.6/yasw_0.6.tgz"
  sha256: "f3bb6cec5e62042e58aa126c7fb1aa387a899e97fb00e2f3d7dca563c163b2e8"
  tar_format: tar.gz

build:
  system: qmake
  configure_options:
    - "src: qmake yasw.pro              # spec = harmonyos-clang（Qt 默认）"
    - "src: make -j1 QMAKE_STRIP=\"\"    # OHOS 加载器拒绝 stripped ELF"
  dependencies:
    required:
      - "qt/5.15.19.1 (published; 包 ID 01d92cf349a0dd98ff915f4bd99a04430171517f, 实下 23.3MB)"
    replaced:
      - "qt5-qtbase/5.15.2.2 -> 弃用：mkspecs/modules/*.pri 50/50 悬空指向已删除构建树，clean 环境不可被 qmake 消费"
    rejected_candidates:
      - "qt5/5.15.19 -> 弃用：mkspecs/modules/*.pri 46/46 含绝对路径（指向 ~/.cache/conan2 另一 conan home 的残留构建树）"
  cc: clang
  cxx: clang++

patches_applied:
  - file: 0001-src-main.cpp.patch
    type: portability
    description: "在 QApplication 构造之前应答 --version / --help，使命令行自省不依赖 Qt 平台插件（headless 构建机 / 打包脚本 / L2 冒烟门禁）"

knowledge_gained:
  - "yasw 0.6 = Yet Another Scan Wizard（SourceForge yascanw，GPLv3，Qt5 qmake 工程，TEMPLATE=app）；上游 0.6 本身即 Qt5，无需 Qt4 移植 (ref: yasw/0.6)"
  - "qt5-qtbase/5.15.2.2 不可被 qmake 消费：package() 原样拷贝 mkspecs 未重写 modules/*.pri 的构建期绝对路径（50/50 悬空），clean 环境报 Project ERROR: Unknown module(s) in QT: core gui xml widgets printsupport（exit 3） (ref: E543)"
  - "qt5/5.15.19 同类缺陷（46/46 悬空，且指向 ~/.cache/conan2 另一 conan home）；qt/5.15.19.1 的 mkspecs/modules 为 0/34 绝对路径（全部用 $$QT_MODULE_*_BASE 变量，可搬迁）→ 可被 qmake 正常消费 (ref: E543)"
  - "QMAKEMODULES 无法覆盖 qt5-qtbase 自身 mkspecs/modules 的解析，仅对外部模块包（qtsvg/qtx11extras）有效 (ref: E543)"
  - "正确模式已存在于本仓库：qtserialport-opensource-src/5.15.15 的 package() 用 re.sub(re.escape(src), pkg, content) 重写 mkspecs/{modules,modules-inst} (ref: E543)"
  - "yasw 0.6 上游无任何自动化测试（无 tests/ 目录、无测试文件、无 ctest/pytest/CI 配置、yasw.pro 无 testlib/SUBDIRS）；install.txt 规定的手工校验为 cd src && qmake && make && ./yasw (ref: yasw/0.6)"
  - "Conan 2.29 的 conan download 不支持 -pr/--profile，必须用 -p '<package-query>' 指定二进制 (ref: yasw/0.6)"
  - "qmake 的编译器探测由 toolchain.prf 用 $$system()（内部 QProcess）分两步完成：① line 38 <cxx> -E macros.cpp → COMPILER_MACROS；② line 210 LC_ALL=C <cxx> … -E -v -xc++ - → INCDIRS/LIBDIRS。宿主超载时 ② 的 QProcess::waitForStarted() 因 fork()/exec() 失败返回 false，qmake 报 Cannot run target compiler 'clang++'. Output: 且 **Output 段为空**，现场留下半写的 .qmake.stash（仅 COMPILER_MACROS，513B；完整 1440B） (ref: DRAFT-11153-knowthelist-qmake-path-compiler-probe)"
  - "该 G2 失败为宿主资源性瞬时失败（实测 load avg 38 / 20 CPU，Committed_AS 129GiB vs 物理 31GiB），非配方缺陷：同命令同环境同目录冷启动 20/20 通过；PATH / LD_LIBRARY_PATH / TMPDIR / cwd 形式 / QMAKE_* 命令行赋值 / safe-delete 沙箱均已逐一排除。处置 = 对该指纹做 3 次有限重试（重试前清半写 stash） (ref: DRAFT-yasw-0.6-qmake-probe-fork-pressure-empty-output)"
  - "Conan 2.29 的 conan list --format=json 中 'Local Cache' 以**完整 ref** 为键（如 yasw/0.6@ohpcd/stable），conan_verify.py 的 G4 用 [software][ref] 两层取键会 KeyError，导致 G4 报『无法找到程序包 ID』且 L2/L4/L5 全部跳过；该现象在仓库内几乎所有归档包上一致（harness 既有缺陷，与 E478 的点号版本号正则缺陷为同族两机制） (ref: DRAFT-yasw-0.6-conan-verify-g4-localcache-ref-key)"
  - "本机 musl 不跟随 .so 版本化符号链接（qt 包内 lib/libQt5*.so.5 为符号链接），运行期需按 DT_NEEDED 传递闭包解引用复制；直连运行表现为 Error loading shared library libQt5*.so.5 → 退出码 127。20 行最小复现已确认（符号链接 127 / 真实文件 0） (ref: DRAFT-yasw-0.6-ohos-musl-versioned-symlink-runtime)"

failure_reason: null

