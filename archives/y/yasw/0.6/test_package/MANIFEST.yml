notes: >
  yasw 0.6 = Yet Another Scan Wizard（SourceForge yascanw，GPLv3），
  Qt5 GUI 应用，用于校正翻拍书籍/文档的扫描图像（去梯形畸变、旋转、裁切、
  色彩校正、导出 PDF）；构建系统 qmake（src/yasw.pro）。

  上游 R51 清点结论：零自动化测试。install.txt 规定的唯一校验入口为手工冒烟
  “cd src && qmake && make && ./yasw”。本 test_package 以可自动化的方式覆盖该
  入口，新增 3 个鸿蒙消费者用例（test.sh，共 9 条断言）：
    1) consumer.ohos.arch    —— 产物为 OHOS PC 目标架构 aarch64 的 ELF 动态链接文件；
    2) consumer.ohos.qt5     —— Qt5 动态依赖链完整（PrintSupport/Widgets/Gui/Xml/Core
                                + libc++_shared），即 yasw 的 PDF 导出与其全部 GUI
                                能力所依赖的符号在目标平台上可解析；
    3) consumer.ohos.runtime —— GUI 真实启动并进入 Qt 事件循环
                                （QT_QPA_PLATFORM=offscreen，以“超时被杀(124)=
                                成功进入事件循环”判定，非静态占位断言）。

  适配要点（环境相关，非上游缺陷）：本 OHOS 环境下 musl 动态加载器不跟随
  .so 版本化符号链接加载共享库（conan 包内 lib/libQt5*.so.5 均为符号链接）。
  构建期不受影响（qmake/moc/uic/rcc 静态链接 Qt，NEEDED 仅 libc++_shared/libc）；
  运行期由 test.sh 自动检测该特征并解引用复制到可写目录后重试，
  因此在有/无该限制的环境下均可给出真实结论。
