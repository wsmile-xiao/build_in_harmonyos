# conandata.yml — yasw 0.6（Yet Another Scan Wizard）
#
# 上游：SourceForge 项目 yascanw，YASW 0.6（2014-12-26，Beta，GPLv3）
#       作者 tibob42（Robert Chéramy）
# R39：仅官方源 URL —— downloads.sourceforge.net 为 SourceForge 官方发布通道，
#      归档 MD5 与官方 RSS 元数据逐字符一致
#      （9a1c8423d79726139765074fc4966295）。
# 镜像 fallback 由 CI 自动添加。

sources:
  url: "https://downloads.sourceforge.net/project/yascanw/YASW%200.6/yasw_0.6.tgz"
  sha256: "f3bb6cec5e62042e58aa126c7fb1aa387a899e97fb00e2f3d7dca563c163b2e8"

patches:
  # 唯一补丁，由 refresh-patch --auto 生成（per-file difflib），
  # 对应变更：src/main.cpp（见 manifest.yaml 的 patch_classification）。
  #
  # 内容：在构造 QApplication 之前应答 --version / --help 并直接退出。
  # 原因：yasw 为纯 GUI 应用（TEMPLATE = app），原 main() 无条件构造
  #       QApplication；在没有可用 Qt 平台插件的环境（headless 构建机、
  #       打包脚本、CI 冒烟测试）中会 abort（"no Qt platform plugin could
  #       be initialized"，exit 134），导致构建流水线的 --version 冒烟
  #       门禁无法对产物做任何功能判定。
  # 性质：通用可移植性改进（不依赖任何平台宏，非 OHOS 专属），
  #       同时是上游缺失的命令行自省能力。
  - patch_file: "patches/0001-src-main.cpp.patch"
    patch_description: >
      Handle --version and --help before QApplication is constructed so the
      query works where no Qt platform plugin is available (headless builds,
      packaging scripts and smoke tests).
    patch_type: "portability"
