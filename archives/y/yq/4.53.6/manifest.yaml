# yq 4.53.6 适配清单（mikefarah/yq，MIT）
# 纯 Go 项目：main 包在仓库根目录（yq.go），上游 Makefile 用
#   go build --ldflags "$(LDFLAGS)"      # LDFLAGS 里的 -X main.GitCommit/GitDescribe
# 但这两个变量实际定义在 package cmd，-X main.* 对它们无效 ⇒ 版本串始终由源码里的
# cmd/version.go `Version = "v4.53.6"` 决定。本配方等价命令：
#   go build -trimpath -ldflags "-s -w" -o <ext2>/out/yq .
# 本机无 OHOS SDK ⇒ 配方自举 Go 1.26.3 工具链，模块经 goproxy.cn 拉取（约 113 MB），
# 在 OHOS 上对工具链与交付二进制用 binary-sign-tool 自签名（E128）。

version: "4.53.6"
status: built

source:
  url: "https://github.com/mikefarah/yq/archive/refs/tags/v4.53.6.tar.gz"
  sha256: "132a28a669526f99dba52486ac80de3bdafdf9a1a52a0c6bd6045301aca0cd25"
  tar_format: tar.gz

build:
  system: go
  configure_options:
    - "go build -trimpath -ldflags \"-s -w\" -o <ext2>/out/yq ."
  cc: go-1.26.3
  notes: "CGO_ENABLED=0 + GOOS=linux + GOARCH=arm64；GOPROXY=goproxy.cn；Go 1.26.3 自举工具链（golang.google.cn / dl.google.com / aliyun 三镜像）；GOCACHE/GOMODCACHE/GOPATH/GOTMPDIR/TMPDIR 与链接输出全部落在 ext2 分区（E166）；源码整树复制到 ext2（E046/HMDFS 无 getcwd，且 pkg/yqlib 用例会回写 doc/*.md 需要可写构建树）"

dependencies: []

patches_applied: []

test:
  upstream_cases: 496
  upstream_suite: "go test -count=1 -json -timeout 300s ./...（4 个含 _test.go 的包：根包、cmd、pkg/yqlib、test；默认调度 361 个顶层 Test 函数 + 135 个子测试 = 496 个用例事件）"
  runnable: 360
  runnable_note: "3 个上游正式测试包（根包 8 + cmd 58 + pkg/yqlib 294 = 360 个顶层用例）为硬门禁：不得有失败、通过数不低于 350；yq 的上游测试全部离线（纯内存/字符串/黄金 YAML-JSON 比对，无网络、无凭据、无外部进程）"
  pass_rate: "Linux/x86_64 预检：496 个用例事件 pass 495 / fail 1 = 99.8%；唯一失败是上游自带失效用例 test/TestFormatStringFromFilename（上游 scripts/test.sh 自己排除 test 包）；门禁三包 360/360 = 100%"
  consumer_test: "test_package/consumer_check.py 真跑 bin/yq 9 个用例：--version/--help/1+1/map(. * 2)/YAML→紧凑 JSON/JSON→YAML/upcase，以及非法表达式与缺失文件两条错误路径的退出码与 stderr"
  self_checks: 13

knowledge_gained:
  - "yq 版本串硬编码在 cmd/version.go（Version = \"v4.53.6\"），上游 Makefile 的 -X main.GitCommit/-X main.GitDescribe 指向不存在的 main 包符号、对版本显示无影响 ⇒ 交付时只能用 --version 断言 tarball 版本，不能靠 -X 注入"
  - "yq 的 pkg/yqlib 用例会回写源码树里的 doc/*.md ⇒ 构建树必须可写（OHOS 上复制到 ext2 副本既满足可写又规避 HMDFS 无 getcwd）"
  - "上游 scripts/test.sh 显式把 test 包排除（grep -v -E 'test'）：该包唯一用例 test/TestFormatStringFromFilename 与实现矛盾（实现 pkg/yqlib/format.go:125 对未知扩展名回退 yaml），是上游失效用例，不应计入验收"
  - "go_install_test.go 位于 //go:build goinstall 标记下（需要 go install + 网络），默认 go test ./... 不调度；N 的口径要把它单列"
