# conandata.yml — yq 4.53.6 (mikefarah/yq, MIT)
# yq 是纯 Go 项目（main 包在仓库根目录 yq.go），依赖 participle / goccy-yaml /
# hcl / cobra / gopher-lua / go-toml / ini / properties 等纯 Go 模块，经
# GOPROXY=https://goproxy.cn,direct 拉取（模块缓存约 113 MB，远小于 k8s/AWS 系）。
# 本机没有 OHOS SDK/工具链，配方自举下载 Go 1.26.3（go.mod 要求 go >= 1.25.0），
# 在 OHOS 上用 binary-sign-tool 对工具链与产物签名（E128）。
# URL 为上游官方源；Go 工具链主候选是 Go 官方分发主机，另附国内镜像作 fallback。

sources:
  url: "https://github.com/mikefarah/yq/archive/refs/tags/v4.53.6.tar.gz"
  sha256: "132a28a669526f99dba52486ac80de3bdafdf9a1a52a0c6bd6045301aca0cd25"

go_toolchain:
  version: "1.26.3"
  linux-arm64:
    url:
      - "https://golang.google.cn/dl/go1.26.3.linux-arm64.tar.gz"
      - "https://dl.google.com/go/go1.26.3.linux-arm64.tar.gz"
      - "https://mirrors.aliyun.com/golang/go1.26.3.linux-arm64.tar.gz"
    sha256: "9d89a3ea57d141c2b22d70083f2c8459ba3890f2d9e818e7e933b75614936565"
    filename: "go1.26.3.linux-arm64.tar.gz"
  # amd64 仅在 Linux/x86_64 上做配方回归时使用；交付目标是鸿蒙 PC（aarch64）。
  linux-amd64:
    url:
      - "https://golang.google.cn/dl/go1.26.3.linux-amd64.tar.gz"
      - "https://dl.google.com/go/go1.26.3.linux-amd64.tar.gz"
      - "https://mirrors.aliyun.com/golang/go1.26.3.linux-amd64.tar.gz"
    sha256: "2b2cfc7148493da5e73981bffbf3353af381d5f93e789c82c79aff64962eb556"
    filename: "go1.26.3.linux-amd64.tar.gz"
