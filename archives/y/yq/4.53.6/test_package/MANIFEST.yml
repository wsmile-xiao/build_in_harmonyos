# yq/4.53.6 test_package 清单
# 上游测试在 conanfile.py 的 build() 阶段真跑（go test -count=1 -json ./...），
# 本 test_package 负责消费者视角：真跑 bin/yq（9 个用例）+ 13 项交付形态自检。

package: yq/4.53.6
homepage: "https://github.com/mikefarah/yq"

# 上游测试命令（值即 build() 里真实执行的命令；OHOS 上追加
# -exec=<go-test-exec.sh> 对 go 内部生成的测试二进制就地签名，E128）
upstream_check_command: "go test -count=1 -json -timeout 300s ./..."
upstream_test_in_build: true
upstream_test_command: "go test -count=1 -json -timeout 300s ./...  -exec=<binary-sign-tool wrapper>"

upstream_tests:
  - file: yq_test.go
    source: yq-4.53.6/yq_test.go
    description: "根包（main）CLI 装配：command.New() 与 cmd.Find 行为（8 个顶层 Test；另有 1 个 TestMain 测试钩子）"
    command: "go test -count=1 ."
  - file: cmd/*_test.go
    source: yq-4.53.6/cmd/
    description: "cmd 包：版本串渲染、eval/eval-all 命令、pflag 处理（58 个顶层 Test）"
    command: "go test -count=1 ./cmd/"
  - file: pkg/yqlib/*_test.go
    source: yq-4.53.6/pkg/yqlib/
    description: "yqlib 引擎：表达式解析/求值、各算子、YAML/JSON/XML/TOML/INI/CSV/properties 编解码、base64、lua、hcl、锚点别名等（294 个顶层 Test + 135 个子测试，表驱动黄金用例）"
    command: "go test -count=1 ./pkg/yqlib/"
  - file: test/format_test.go
    source: yq-4.53.6/test/format_test.go
    description: "⚠ 上游失效用例（不计入门禁）：TestFormatStringFromFilename 断言未知扩展名 → \"unknown\"，而 pkg/yqlib/format.go:125 明确回退 \"yaml\"；上游自己的 scripts/test.sh 把 test 包排除在测试选择之外"
    command: "go test -count=1 ./test/"
  - file: go_install_test.go
    source: yq-4.53.6/go_install_test.go
    description: "⚠ 默认不调度（不计入门禁）：//go:build goinstall 标记，需要 go install + 网络；上游用 `go test -tags goinstall -run TestGoInstallCompatibility .` 单独跑"
    command: "go test -tags goinstall -run TestGoInstallCompatibility ."

offline_gating_tests:
  description: "上游 3 个正式测试包（根包 8 + cmd 58 + pkg/yqlib 294 = 360 个顶层用例）作为硬门禁：不得有任何失败，通过数不得低于 350（容忍上游平台条件性 t.Skip，见 conanfile.py 的 _GATED_PACKAGES/_GATED_MIN_PASSED）"
  count: 360
  packages: "(root) 8 + cmd 58 + pkg/yqlib 294"

test_package_tests:
  - file: consumer_check.py
    description: "消费者用例 C1-C9：真跑 bin/yq 的 --version/--help/1+1/map 求值/YAML→紧凑 JSON/JSON→YAML/upcase 与两条错误路径（非法表达式、缺失文件），断言真实 stdout/stderr/退出码；并做 M1-M13 交付形态自检"
    command: "python3 consumer_check.py <package_folder> --expect-machine aarch64 --expect-version v4.53.6 --require-signature"

assertion_count: 43
