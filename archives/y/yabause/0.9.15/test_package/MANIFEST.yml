# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
# 依据 R51 三步法：清点 → 实跑 → 如实回填

package: yabause/0.9.15
homepage: "https://github.com/Yabause/yabause"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 清点结论：上游无自动化测试框架（无 tests/ 目录、ctest 注册 0、无 make check 目标）。
# 仅有的 2 个诊断程序 cdtest/pertest（-DYAB_TESTS=ON 才构建）均因 OHOS 平台缺
# 硬件相关头文件/端口后端而无法链接（平台限制，非上游缺陷），如实记录如下：
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    source: test_package/test.c
    description: "消费者测试：真实调用 yabause 核心库 API（YabauseInit/Emulate/DeInit，headless 核心表 + skip_load）"
    command: "./test_yabause"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 3
