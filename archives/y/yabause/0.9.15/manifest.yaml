# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "CMake 4.x 移除了 <3.5 兼容，cmake_minimum_required(VERSION 2.x/2.6/2.8) 必须提升到 >=3.5，否则 configure 直接失败；嵌套 ExternalProject（musashi m68kmake / c68k gen68k）的子项目同样会被 CMake 4 拒绝，需同步提升其 cmake_minimum_required (ref: knowledge/graph/E458.kv; knowledge/drafts/DRAFT-E321-cmake4-policy-version-minimum.kv)"
- "OHOS sysroot 无 linux/cdrom.h、linux/joystick.h，CMAKE_SYSTEM_NAME=HarmonyOS 落入 src/CMakeLists.txt 的 UNKNOWN_ARCH 分支（sock-dummy/thr-dummy），不编译 cd-linux/perlinuxjoy；因此上游诊断工具 cdtest/pertest 缺 ArchCD/PERLinuxJoy 后端而无法链接（属预期，工具需硬件） (ref: knowledge/drafts/DRAFT-yabause-ohos-sysroot-missing-linux-hardware-headers.kv)"
- "CMAKE_SYSTEM_NAME=HarmonyOS 时 l10n/CMakeLists.txt 的 if(UNIX AND NOT APPLE) 不成立，上游无任何 install() 规则注册，make install 目标不存在；交付物为静态库 libyabause.a，由 conan recipe 负责安装 (ref: knowledge/drafts/DRAFT-yabause-cmake-no-install-rules-manual-package.kv)"
- "上游 yabause 无自动化测试框架：无 tests/ 目录、无 ctest 注册、无 make check 目标；src/tools 下 cdtest/pertest 为需硬件的诊断工具，YAB_TESTS=ON 才构建 (ref: reports/test-report.md R51 清点)"

