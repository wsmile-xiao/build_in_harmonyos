# test_package/MANIFEST.yml
# 上游官方测试声明文件（yazpp 1.9.2，DS-12 实测 2026-09-21）

package: yazpp/1.9.2
homepage: "https://www.indexdata.com/resources/software/yazpp/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C src check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C src check -j1（先 TESTS= 编译，再 VirtualRunEnv 下真跑）"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test_query.cpp
    source: yazpp-1.9.2/src/test_query.cpp
    description: "Yaz_Z_Query Type-1 查询解析/拷贝/回印断言（yaz/test.h 框架），PASS"
    command: "make -C src check -j1"
  - file: src/test_gdu.cpp
    source: yazpp-1.9.2/src/test_gdu.cpp
    description: "GDU（通用数据单元）封装与队列断言（yaz/test.h 框架），PASS"
    command: "make -C src check -j1"

# 未执行子集说明：
# 1) zlint/ 与 zoom/ 为 noinst 样例程序，上游未注册 TESTS；
# 2) doc/ 无测试目标。——均为上游自身定义，非本适配删减。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接静态 libyazpp.a+libyaz.a，调用 Yaz_Z_Query 解析/拷贝/print 回印，3 组断言（@and a b / x / 空查询）全部相等才退出码 0；ELF 签名后真机运行"
    command: "./consumer_test（经 conanrun 环境执行）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
# 口径: 上游 2 个注册测试程序（PASS）+ 消费者 1 程序 3 组断言
