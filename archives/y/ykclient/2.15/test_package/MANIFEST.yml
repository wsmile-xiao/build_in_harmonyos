# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ykclient/2.15
homepage: "https://developers.yubico.com/yubico-c-client/"

# 上游测试命令（git archive 无 configure，build() 先 autoreconf -fi 再
# automake TESTS：tests/Makefile.am check_PROGRAMS=selftest，TESTS=$(check_PROGRAMS)）
upstream_check_command: "make check（autoreconf -fi 后，automake TESTS 注册 1 条：selftest）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\", args=[\"-j1\"])（CPPFLAGS 含 -DTEST_WITHOUT_INTERNET）"

# 上游实际运行的测试程序（N_runner=1：tests/selftest 单一二进制）
upstream_tests:
  - file: tests/selftest.c
    source: yubico-c-client-ykclient-2.15/tests/
    description: "上游自测（单 runner tests/selftest）四层口径实测：源文件 36 处 TEST() 标记点，其中 9 处位于上游自身 #if 0 死区（test_base64×2 + test_hmac×7），活跃 27；启用 -DTEST_WITHOUT_INTERNET 后 6 处位于 #ifndef TEST_WITHOUT_INTERNET 内的标记点被上游自身编译排除，故运行进入 21 处；21 处中 15 处内含网络断言并打印 Test SKIPPED（合计 16 次，selftest.c:317 因循环打印两次），另 6 处为纯离线完整断言。网络断言的目标端点 api.yubico.com wsapi v1 已由服务方停用（实测 HTTP 403），属上游预期的跳过通道而非适配缺陷。runner 结果：tests/test-suite.log TOTAL 1 / PASS 1 / FAIL 0 / ERROR 0"
    command: "make -j1 check（CPPFLAGS 含 -DTEST_WITHOUT_INTERNET，经 AutotoolsToolchain extra_cflags 注入）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer_test.c
    description: "消费者测试 — 以库使用者身份链接 libykclient 并调用公开 API：ykclient_check_version 三态检查、global_init/init/done 生命周期、set_client_hex 非法输入(a/zz)返回 YKCLIENT_HEX_DECODE_ERROR 且上游 fixture hex key 返回 OK、set_client_b64 非法输入走上游 rfc2045 宽松解码路径返回 YKCLIENT_OK（上游无 decode-error 返回分支）、fixture 返回 OK、set_url_template/set_nonce/set_verify_signature 配置面、strerror 代表码非空，共 15 项硬断言，退出码判定"
    command: "ctest（CMake add_test consumer_test，链接 ykclient::ykclient）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
