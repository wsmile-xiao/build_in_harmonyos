# 版本级 manifest（ARCHIVE-SPEC v2.0）
# 文件位置: archives/y/ykclient/2.15/manifest.yaml

version: "2.15"
software: "ykclient"

# published | built | failed | archived
# built = conan-verify/finish 全绿但尚未 release/upload 到制品仓
status: built
build_date: "2026-09-21"
build_system: "autotools"

source:
  url: "https://github.com/Yubico/yubico-c-client/archive/refs/tags/ykclient-2.15.tar.gz"
  sha256: "3863f4fc2f3320c59fcbf57862bba48bcb716fddb886840bb0dd8db14d5ab7f0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
  - "--build=aarch64-unknown-linux-gnu"
  - "--host=aarch64-unknown-linux-ohos"
  - "--enable-static"
  - "--disable-shared"
  dependencies:
  - "curl/8.15.0.1"
  - "automake/1.18"
  - "libtool/2.5.4"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
- "conan 2 的 AutotoolsToolchain 无 cpp_flags/ld_flags 属性，追加标志要用 extra_cflags/extra_ldflags"
- "E386：profile 把 SHELL/CONFIG_SHELL 钉在 hnp bash → configure 报 working directory cannot be determined；改写 generators_folder 下全部 *.sh（psocksxx/1.1.1 先例）"
- "E289：OHOS 无 help2man；HELP2MAN=/bin/true 单独用会在 install 再挂，须同时清空 dist_man_MANS"
- "VPATH 下 automake 给 tests/ 的 DEFAULT_INCLUDES 无 -I$(top_builddir)，configure 生成的 ykclient_version.h 找不到；命令行 INCLUDES=-I<build_folder> 追加（AM_CPPFLAGS 已被 LIBCURL_CFLAGS 占用，不可覆盖）"
- "musl 忽略 DT_RUNPATH：make check 前须把 curl 的 libdir 与 .libs 注入 LD_LIBRARY_PATH（llvm-readelf 实测 libcurl.so NEEDED 仅 libc）"
- "ykclient_check_version()：req<=库版本→返回库版本串，仅 req 更高→NULL；上游 rfc2045 base64 解码对非法字符宽松跳过，不返回 BASE64_DECODE_ERROR"
