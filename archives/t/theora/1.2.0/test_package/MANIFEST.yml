# test_package/MANIFEST.yml
# Upstream test declaration file (CI L0e requires this file to exist)
# See docs/TEST_QUALITY_SPEC.md

package: "theora/1.2.0"
homepage: "https://xiph.org/theora/"

# Upstream test command: tests/Makefile.am wires `check:` to build and run
# the 9 check programs under the libtool wrapper.
upstream_check_command: "make check"

# The upstream test suite is executed inside conanfile.py build() via
# autotools.make(target="check") during conan create (ogg 1.1.1 precedent).
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream check programs (tests/Makefile.am, TESTS_DEC + TESTS_ENC):
#  - TESTS_DEC = noop_theora comment comment_theoradec comment_theora
#  - TESTS_ENC = noop noop_theoraenc granulepos granulepos_theoraenc granulepos_theora
upstream_tests:
  - file: tests/noop_theora.c
    description: "legacy libtheora 链接面 dummy 调用自测（pre-1.0 API）"
    command: "./noop_theora"
  - file: tests/comment.c
    description: "theoradec/theoraenc comment 头部构造与解析往返自测（当前 API）"
    command: "./comment"
  - file: tests/comment.c
    description: "theoradec legacy 链接线 comment 构造/解析自测"
    command: "./comment_theoradec"
  - file: tests/comment_theora.c
    description: "libtheora legacy 链接线 comment 构造/解析自测（pre-1.0 API）"
    command: "./comment_theora"
  - file: tests/noop.c
    description: "theoraenc+theoradec dummy 调用自测（当前 API 链接面）"
    command: "./noop"
  - file: tests/noop_theora.c
    description: "theoraenc legacy 链接线 dummy 调用自测"
    command: "./noop_theoraenc"
  - file: tests/granulepos.c
    description: "编码器 granule position 计算自测（当前 API，覆盖关键帧位移/双精度取整）"
    command: "./granulepos"
  - file: tests/granulepos_theora.c
    description: "theoraenc legacy 链接线 granule position 计算自测"
    command: "./granulepos_theoraenc"
  - file: tests/granulepos_theora.c
    description: "libtheora legacy 链接线 granule position 计算自测（pre-1.0 API）"
    command: "./granulepos_theora"

# test_package consumer tests (installed-package verification)
test_package_tests:
  - file: test_theora.c
    description: "安装包消费者往返测试：th_encode_alloc 产 3 头部包 + th_decode_headerin/alloc 完整解码链 + legacy theora_info API 符号链接"
    command: "./test_theora"

# Assertion count: 9 upstream check programs + 5 consumer exit gates
assertion_count: 14
