# manifest.yaml — theora 1.2.0 version-level metadata
# follows ARCHIVE-SPEC v2.0 (ogg 1.1.1 precedent: version dir only)

version: "1.2.0"
software: theora
status: built
build_date: "2026-09-19"
build_system: autotools

source:
  url: "https://downloads.xiph.org/releases/theora/libtheora-1.2.0.tar.gz"
  sha256: "279327339903b544c28a92aeada7d0dcfd0397b59c2f368cc698ac56f515906e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--disable-examples"
    - "--with-ogg=<conan:ogg package_folder>"
    - "--disable-oggtest"
  dependencies:
    - "ogg/1.1.1"
  cc: clang

patches_applied:
  - "0001-ogg-uint64-portability.patch"
# config.guess/config.sub（2022 版，新式 GUESS=）在 build() 里用官方
# perl 补丁打 E007 + 配方内 kernel-OS 白名单修复；configure 的
# umask 077→022（E114）也是运行时替换，无静态补丁文件。

knowledge_gained:
  - "theora 1.2.0 tarball 自带完整 configure + 2022-01-09 版 config.guess/config.sub（新式 GUESS=），无需 autoreconf；但 2022 版 config.sub 有 kernel-OS 组合白名单（case $kernel-$os），官方 perl 补丁的 linux-ohos 注入会被其『already present』守卫误跳（2.1 步的 ohos-linux triplet 已含字面 linux-ohos）——配方内需补 kernel 白名单（linux-gnu* 行加 | linux-ohos*）"
  - "configure.ac 的 PKG_CHECK_MODULES(OGG, ogg >= 1.3.4) 会因 ogg/1.1.1 包名线的版本号失败，走 XIPH_PATH_OGG fallback（--with-ogg + --disable-oggtest，仅编译链接探测无版本闸）"
  - "theora 1.2.0 的 lib/state.c 用了 ogg_uint64_t（libogg >= 1.3.x 才有的类型；ogg 1.1.1 的 Linux config_types.h 只有 ogg_int64_t）——静态补丁换 uint64_t + stdint.h（这也是上游 ogg >= 1.3.4 版本闸的真实根因之一）"
  - "theora 库本体（libtheoradec/enc/theora）只依赖 ogg；SDL/PNG/TIFF/cairo/vorbis 全是 examples 专用，--disable-examples 一刀切关闭"
  - "aarch64 不匹配 configure.ac asm 分派的 arm* case → 纯 C 路径（无 ARM 汇编、无 perl 依赖），交叉编译最干净"
  - "上游测试 9 个 check 程序（TESTS_DEC 4 + TESTS_ENC 5）在 make check 里由 libtool wrapper 驱动，链接 in-tree .la + OGG_LIBS"
