software: tectonic
display: "Tectonic"
description: "A modernized, complete, embeddable TeX/LaTeX engine"
category: doc
homepage: "https://tectonic-typesetting.github.io/"
license: MIT
build_system: cargo
type: tool

ohos_adaptation:
  key_points:
    - "Rust cargo 构建系统，host triple: aarch64-unknown-linux-ohos（Harmonybrew 安装）"
    - ".cargo/config.toml 配置 OHOS target 链接器（clang + lld）+ C/C++ 编译器（CC/CXX）+ crates.io 镜像（rsproxy.cn）"
    - "使用 --features external-harfbuzz 以使用系统 harfbuzz（Conan 包）而非 git submodule"
    - "default_options={'*:shared':False} 强制所有 C/C++ 依赖静态链接"
    - "bridge crates 通过 pkg-config 查找 C/C++ 库（freetype2/fontconfig/harfbuzz/graphite2/icu-uc/libpng）"
    - "Conan PkgConfigDeps 生成 icu4c.pc，需复制为 icu-uc.pc（tectonic bridge_icu 期望 'icu-uc'）"
    - "engine_xetex 需手动设置 DEP_FONTCONFIG_INCLUDE_PATH 环境变量"
    - "SSL_CERT_FILE=/etc/ssl/certs/cacert.pem 必须设置，否则 reqwest 无法下载 TeX bundle"
    - "expat conanfile 硬编码 EXPAT_SHARED_LIBS='ON'（上游 bug），.so 打包到 lib/ + wrapper 脚本"
    - "Conan copy() 破坏 ELF $ORIGIN RUNPATH → shutil.copy2() 保存为 tectonic.real + wrapper 脚本"
    - "wrapper 脚本使用 #!/system/bin/sh（非 #!/bin/bash）"
    - "patchelf 修改后 OHOS 拒绝执行 → 不修改 ELF，使用 wrapper 脚本"
    - "LaTeX 编译功能完全正常：SSL 修复后成功下载 TeX 包并生成 PDF"
  packaging:
    structure: "wrapper"
    bin_tectonic: "wrapper 脚本 (#!/system/bin/sh, 设置 LD_LIBRARY_PATH)"
    bin_tectonic_real: "实际 ELF64 aarch64 二进制"
    lib_libexpat_so: "唯一动态 C/C++ 依赖 (182KB, expat 上游 bug)"
  common_dependencies:
    - freetype/2.14.3 (静态)
    - fontconfig/2.18.1 (静态)
    - harfbuzz/14.2.0.2 (静态, 含 graphite2)
    - graphite2/1.3.14 (静态)
    - icu4c/78 (静态)
    - libpng/1.6.58 (静态)
    - zlib/1.3.1.1 (静态)
    - openssl/3.5.6 (静态)
    - expat/2.8.2 (动态, .so 打包)

versions:
  "0.16.9":
    status: built
    build_date: "2026-07-23"
    notes: "Rust TeX 引擎，8 个 C/C++ 依赖静态链接，LaTeX 编译功能正常，wrapper 脚本方案"
