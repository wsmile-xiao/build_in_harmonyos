# 版本级 manifest
# 文件位置: archives/t/tectonic/0.16.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.16.9"
software: "tectonic"

# published | built | failed | archived
status: built

build_date: "2026-07-23"
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/tectonic-typesetting/tectonic/archive/refs/tags/tectonic@0.16.9.tar.gz"
  sha256: "9861d4d4230b987d8560f1b84fe6c8a550738401be65b9425b0c7d0466178f2b"
  tar_format: tar.gz

# ============================================================
# 构建环境
# ============================================================

build:
  system: cargo
  rust_version: "1.97.1"
  rust_host_triple: "aarch64-unknown-linux-ohos"
  cargo_command: "cargo build --release --features external-harfbuzz"
  configure_options:
    - "--release"
    - "--features external-harfbuzz"
  cc: clang (15.0.4)
  cxx: clang++ (15.0.4)
  cargo_config:
    target: "aarch64-unknown-linux-ohos"
    linker: "clang"
    rustflags: ["-C", "link-arg=-fuse-ld=lld", "-C", "link-arg=-Wl,-rpath,$ORIGIN/../lib"]
    env:
      CC: "clang"
      CXX: "clang++"
    crates_io_mirror: "rsproxy.cn (sparse+https://rsproxy.cn/index/)"

# ============================================================
# 依赖
# ============================================================

dependencies:
  - "freetype/2.14.3 (静态)"
  - "fontconfig/2.18.1 (静态)"
  - "harfbuzz/14.2.0.2 (静态, graphite2 disabled)"
  - "graphite2/1.3.14 (静态)"
  - "icu4c/78 (静态)"
  - "libpng/1.6.58 (静态)"
  - "zlib/1.3.1.1 (静态)"
  - "openssl/3.5.6 (静态)"
  - "expat/2.8.2 (动态, .so 打包)"

default_options:
  "*:shared": False  # 强制所有 C/C++ 依赖静态链接 (expat 除外, 上游 bug)

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# 注意: .cargo/config.toml, icu-uc.pc, SSL 证书, wrapper 脚本均在
# conanfile.py 的 build()/package() 中动态生成，不作为 patches/ 文件。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "tectonic 使用 Cargo/Rust 构建系统，Rust host triple 为 aarch64-unknown-linux-ohos（通过 Harmonybrew 安装）"
  - "需创建 .cargo/config.toml 配置 OHOS target 链接器（clang + lld）和 C/C++ 编译器（CC/CXX）"
  - "使用 --features external-harfbuzz 以使用系统 harfbuzz（Conan 包）而非 git submodule"
  - "tectonic 有 7 个 bridge crates，各自 build.rs 调用 pkg-config 查找对应 C/C++ 库"
  - "Conan PkgConfigDeps 生成 icu4c.pc，但 tectonic bridge_icu 期望 icu-uc，需在 build() 中复制"
  - "engine_xetex crate 不直接依赖 bridge_fontconfig，需手动解析 .pc 文件设置 DEP_FONTCONFIG_INCLUDE_PATH"
  - "crates.io 在 OHOS 网络下访问慢，需在 .cargo/config.toml 配置 rsproxy.cn sparse 镜像源"
  - "default_options={'*:shared':False} 强制 C/C++ 依赖静态链接，消除运行时 .so 依赖"
  - "expat conanfile.py 硬编码 EXPAT_SHARED_LIBS='ON'（上游 bug），shared=False 仍只生成 .so"
  - "expat .so (182KB) 打包到 lib/ 目录，通过 wrapper 脚本设置 LD_LIBRARY_PATH 解决"
  - "Conan copy() 和打包后处理破坏 ELF $ORIGIN RUNPATH（展开为空字符串）→ 使用 shutil.copy2 + wrapper 脚本"
  - "patchelf 修改二进制后 OHOS 拒绝执行（安全策略）→ 不修改 ELF，改用 wrapper 脚本"
  - "SSL_CERT_FILE=/etc/ssl/certs/cacert.pem 必须设置，否则 reqwest 无法下载 TeX bundle"
  - "wrapper 脚本使用 #!/system/bin/sh（非 #!/bin/bash，OHOS 上 /bin/bash 不存在）"
  - "LaTeX 编译功能完全正常：SSL 修复后 tectonic 成功下载 TeX 包并生成 PDF"
  - "conanfile.py build() 中直接修改 os.environ 设置 PATH/CARGO_HOME/RUSTUP_HOME（R33: 不依赖未定义 shell 变量）"
  - "package_id() 删除 compiler 设置（Rust 不依赖 C/C++ compiler ABI）"
  - "fontconfig 重建需要 meson（pip3 install meson）"

# ============================================================
# 产物清单
# ============================================================

artifacts:
  - "bin/tectonic (wrapper 脚本, 134 bytes, #!/system/bin/sh)"
  - "bin/tectonic.real (ELF64 aarch64, ~60MB, PIE, 未 strip)"
  - "lib/libexpat.so (182KB, 唯一动态 C/C++ 依赖)"

dynamic_dependencies:
  - "libexpat.so (打包在 lib/, expat 上游 bug 无法静态)"
  - "libc++_shared.so (OHOS 系统库)"
  - "libtime_service_ndk.so (OHOS 系统库)"
  - "libc.so (系统库)"

static_dependencies:
  - "freetype/2.14.3 (libfreetype.a)"
  - "fontconfig/2.18.1 (libfontconfig.a)"
  - "harfbuzz/14.2.0.2 (libharfbuzz.a, graphite2 disabled)"
  - "graphite2/1.3.14 (libgraphite2.a)"
  - "icu4c/78 (libicudata.a + libicuuc.a + libicui18n.a)"
  - "libpng/1.6.58 (libpng16.a)"
  - "zlib/1.3.1.1 (libz.a)"
  - "openssl/3.5.6 (libssl.a + libcrypto.a)"

# ============================================================
# 测试结果摘要
# ============================================================

test_summary:
  conan_verify: "8/8 PASS (G0/G1/G2/G3/G4/L2/L4/L5)"
  test_package: "PASS — tectonic --version: Tectonic 0.16.9"
  ci_clean_build: "PASS — conan create exit code 0"
  functional_test: "PASS — --version, --help 正常输出"
  latex_compilation: "PASS — 成功编译 LaTeX 文档并生成 test.pdf (6.5KB)"
  standalone_execution: "PASS — 无需 LD_LIBRARY_PATH 即可直接运行"
  static_linking: "PASS — 8/9 C/C++ 依赖静态链接, 仅 expat 动态 (.so 打包)"
  ssl_download: "PASS — SSL_CERT_FILE 修复后 reqwest 成功下载 TeX bundle"
