# test_package/MANIFEST.yml — tsl-ordered-map/1.1.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: tsl-ordered-map/1.1.0
homepage: "https://github.com/Tessil/ordered-map"

# Upstream provides a Boost.Test suite under tests/. The Conan build compiles
# all upstream test translation units and executes the resulting binary.
upstream_check_command: "./tsl_ordered_map_tests --log_level=test_suite"
upstream_test_in_build: true
upstream_test_command: "./tsl_ordered_map_tests --log_level=test_suite"

upstream_tests:
  - file: custom_allocator_tests.cpp
    source: ordered-map-1.1.0/tests/custom_allocator_tests.cpp
    description: "Custom allocator behavior"
    command: "./tsl_ordered_map_tests --run_test=test_custom_allocator"
  - file: ordered_map_tests.cpp
    source: ordered-map-1.1.0/tests/ordered_map_tests.cpp
    description: "ordered_map API, lifecycle, lookup, erase and serialization tests"
    command: "./tsl_ordered_map_tests --run_test=test_ordered_map"
  - file: ordered_set_tests.cpp
    source: ordered-map-1.1.0/tests/ordered_set_tests.cpp
    description: "ordered_set API and serialization tests"
    command: "./tsl_ordered_map_tests --run_test=test_ordered_set"

test_package_tests:
  - file: main.cpp
    description: "Consumer: insert {1:one, 2:two} into tsl::ordered_map; assert size==2, map[1]=='one', map[2]=='two', iteration order 1,2; print"
    command: "./ordered_map_test"

# Boost.Test expanded upstream cases (ordered_map + ordered_set + custom allocator).
upstream_test_count: 30
test_package_test_count: 1
assertion_count: 3
