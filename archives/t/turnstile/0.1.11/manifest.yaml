# 版本级 manifest
# 文件位置: archives/t/turnstile/0.1.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: turnstile
version: "0.1.11"
status: published
build_date: "2026-09-21"
build_system: meson

source:
  url: "https://github.com/chimera-linux/turnstile/archive/refs/tags/v0.1.11.tar.gz"
  sha256: "04904eff68a726bed281820b3497e018ede55a5d745f31ceb9a502f905d0ed56"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dman=false"
    - "-Dpam_moddir=lib/security"
  dependencies:
    - linux-pam/1.7.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "meson dependency('pam') 通过 pkg-config 探测；linux-pam 配方以 components(pam/pam_misc) 提供 pkg_config_name"
  - "OHOS 上 meson sanity check 需 LD_LIBRARY_PATH 含 OHOS SDK 的 libc++_shared.so（aarch64-linux-ohos 目录）"
  - "pam_moddir 默认由 pam .pc 的 libdir 推导会指向 conan 缓存，需显式 -Dpam_moddir=lib/security 固定在包内"
