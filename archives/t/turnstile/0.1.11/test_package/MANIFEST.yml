# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: turnstile/0.1.11
homepage: "https://github.com/chimera-linux/turnstile"

# 上游测试命令 — turnstile 上游 meson.build 无 test() 注册（已实测：
# grep test( meson.build backend/meson.build → 0；源码树无 tests/ 目录、
# 无 *_test.* / check 文件）——上游无独立测试套件
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-09-21 清点记录）：
# - meson.build: 无 test() 注册（grep 实测 0 条）
# - backend/meson.build: 无 test() 注册（grep 实测 0 条）
# - 源码树：无 tests/ 目录、无 test 源文件、无 check 脚本
# 结论：上游无测试用例（R51 清点证据：meson.build + backend/meson.build
# 全文无 test( 调用；find 无 *test* 文件）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
# R34 降级（away 0.9.5 先例）：turnstiled 为守护进程，真实运行需 /run
# 基础目录 + PAM 会话（OHOS 构建节点不具备）；且 conan 缓存中 release
# 构建二进制被 OHOS hmmac 执行策略拒绝（EPERM，已对照验证：work 目录
# debugoptimized 二进制可执行至 RUN_PATH 检查 rc=1、其他缓存包二进制可
# 正常执行）→ 不执行守护进程，验证打包产物静态完整性：
# turnstiled 存在 + 可执行 + ELF；pam_turnstile.so ELF；turnstiled.conf /
# pam.d/turnstiled / dinit backend 存在
test_package_tests:
  - file: test_turnstile.py
    description: "R34 降级静态产物验证：turnstiled 存在+可执行+ELF、pam_turnstile.so ELF、配置与 dinit backend 存在（守护进程运行需 /run+PAM 会话，OHOS 构建节点不具备；缓存二进制被 hmmac 执行策略拒绝 EPERM 已验证）"
    command: "python3 test_turnstile.py <package-folder>"
