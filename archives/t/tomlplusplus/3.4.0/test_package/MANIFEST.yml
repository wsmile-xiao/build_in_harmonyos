# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tomlplusplus/3.4.0
homepage: "https://github.com/marzer/tomlplusplus"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tomlplusplus 上游使用 Catch2 测试框架，测试在 tests/ 目录)
upstream_tests:
  - file: tests/at_path.cpp
    source: tomlplusplus-3.4.0/tests/at_path.cpp
    description: "at_path 功能测试"
    command: "./tests/at_path"
  - file: tests/formatters.cpp
    source: tomlplusplus-3.4.0/tests/formatters.cpp
    description: "格式化器测试 (TOML/JSON/YAML)"
    command: "./tests/formatters"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：解析、验证、序列化 TOML 数据"
    command: "./test_tomlplusplus"

# 测试断言总数 (近似值)
assertion_count: 6
