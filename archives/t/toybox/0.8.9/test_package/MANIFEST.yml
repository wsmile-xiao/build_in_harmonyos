# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: toybox/0.8.9
homepage: "https://www.toybox.org"

# 上游测试命令（toybox 不用 make check，测试入口是自有 harness）
upstream_check_command: "bash scripts/test.sh"

# 上游测试在配方 build() 中真实全量执行（§10 硬规则）
upstream_test_in_build: true
upstream_test_command: "TEST_ALL=1 VERBOSE=all bash scripts/test.sh"
upstream_test_accounting: >-
  N_static=1952 条原子断言（tests/*.test 中以 testcmd/testing/txpect 开头的行，
  按 0.8.9 官方件逐项 grep 计数），分布在 118 个 .test 文件上。TEST_ALL=1 是必需的：
  test.sh 默认跳过没有可执行位的 .test 文件，而 HMDFS 的模式位不可靠，不强制就会
  静默漏跑；VERBOSE=all 让首个失败不打断整轮，保证 118 个文件都被尝试。
  本次实际执行 1703 项（pass 1330 / fail 325 / skip 48）；执行数与静态注册数的净差
  由循环展开（约 +282）和 21 个未编入本次 config 的 applet 整文件 0 执行（531 条）
  两个相反方向构成，不并入通过、不缩分母。

# 上游实际运行的测试程序
upstream_tests:
  - file: scripts/test.sh
    description: >-
      toybox 自研 shell 测试 harness：逐个 source tests/*.test，经 testcmd/testing
      对被测二进制断言 stdout/stderr/退出码；输出 PASS:/FAIL:/SKIP: 行。
    command: "bash scripts/test.sh"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: smoke.sh
    description: >-
      多调用二进制消费者测试：以打包后的 bin/toybox 逐条真实调用 applet 并比对精确输出，
      内容断言 10 条——basename 取路径末段、seq 1 3 的三行区间、sort -n 数值序（9 在 10 前）、
      sha256sum 经 cut 取首字段比对 abc 的已知摘要、wc -l 行数、cut -d: -f2 取字段、
      sed 首次替换（aaa 变 baa）、sort 字典序、wc -w 词数、head -n 2 取前两行。
      每条断言打到的 applet 都先经被测二进制自带的 applet 清单确认确实编入了本次 config。
    command: "conan test"
  - file: smoke.sh
    description: >-
      失败路径断言 2 条：basename 缺操作数必须返回 rc=1；未知 applet 必须非零退出
      （实测 rc=127，多调用二进制拒绝未编入的命令）。
    command: "conan test"

# 测试断言总数（消费者侧；上游 1952 条另计，不混并）
assertion_count: 12

# 消费者测试内存预算（§14.1④：先 memcap-run.py --probe 评估后执行）
# toybox 是多调用小二进制，单条 applet 峰值 RSS 在数 MB 级；预算留 >10 倍余量。
max_rss_mb: 64
