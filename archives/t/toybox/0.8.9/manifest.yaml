version: "0.8.9"
software: "toybox"
status: built
build_date: "2026-09-29"
build_system: "kconfig-plus-handwritten-makefile"

source:
  url: "https://www.landley.net/toybox/downloads/toybox-0.8.9.tar.gz"
  sha256: "06913dde3de7139b40f947bd7f23869dfc8796e9c6ff39de02719f8b7b2d47ad"
  tar_format: tar.gz
  note: >-
    官方站点文件，HEAD 200 实测 3517516 字节；conandata.yml 只保留这一条官方 HTTPS URL
    与真实 sha256，无任何镜像或代理前缀。

build:
  system: make
  command: "make defconfig && make"
  make_flags:
    - "CC=<target compiler>"
    - "HOSTCC=<host compiler>"
    - "CROSS_COMPILE="
    - "NOSTRIP=1"
    - "LDFLAGS=-static"
    - "-j1"
  dependencies: []
  tool_dependencies:
    - "bash/5.3"
  cc: clang
  cross_building: true
  package_type: application
  output_binary: "bin/toybox"

patches_applied:
  - "patches/0002-ohos-utmpx-shadow-declarations.patch"

tests:
  upstream_entry: "TEST_ALL=1 VERBOSE=all bash scripts/test.sh"
  upstream_test_in_build: true
  n_static: 1952
  n_files: 118
  n_executed: 1703
  n_pass: 1330
  n_fail: 325
  n_fail_accounted: 325
  n_fail_unexplained: 0
  n_skip: 48
  n_consumer: 1
  n_consumer_assertion: 12
  consumer_result: "12/12"
  max_rss_mb: 64
  accounting: >-
    三个方向的偏差分别记账，不互相抵消。静态分母 1952 是 tests/*.test 里 testcmd/testing/txpect
    注册语句行的逐文件计数；本次实际执行 1703 等于 pass 1330 加 fail 325 加 skip 48；
    1952 与 1703 之间约 249 的净差由两个相反方向构成：循环展开使执行项多于注册行（约 +282，
    chmod 6 到 154、chattr 7 到 15、date 35 到 40 等），同时 21 个 .test 因 applet 未编入本次
    config 而整文件 0 执行（531 条，机制逐字为 scripts/test.sh:43）。325 例失败全部逐条落
    upstream-test-ledger.tsv 并按族归账，accounted=325、unexplained=0；名单之外或名字对而上下文
    不含该族签名的失败一律判未定性并中断构建，不静默放行。

knowledge_gained:
  - >-
    toybox 的 host/target 编译器分野：Makefile、scripts/kconfig 与 scripts/portability.sh
    三处都按默认 cc 取宿主工具并做编译器存在性探测，OHOS 侧只有 clang、没有 cc，于是构建期与测试期
    在同一点死（portability.sh 探测失败即 No cc found 退出 1，连 TEST_HOST=1 的只读模式也被挡）。
    处置是把 CC/HOSTCC 显式传入 make，并在 cross_building 下要求 CC_FOR_BUILD。
  - >-
    toybox 全部驱动脚本的 shebang 是 bin/bash 形式，而本平台没有 /bin/bash（设备完全不存在，
    CI worker 在 /data/service/hnp/bin/bash）。make 的报错是 scripts/genconfig.sh: No such file
    or directory，缺的是解释器不是脚本，误导性强。处置是构建前把 configure 与 scripts/ 下的 shebang
    逐个改写为 tool_requires(bash/5.3) 的 package_folder 绝对路径，并在改写数为 0 时主动抛错，
    防止上游布局变化后修法静默失效。tests/*.test 故意不改：harness 是 source 它们，从不 exec，
    shebang 是惰性的。
  - >-
    HMDFS 不允许 mkfifo（EPERM），GNU make 的 jobserver 因此建不起来，只报警后退化成串行。
    所以 -j 在本平台是看起来并行、实际串行还附带噪声，配方固定 -j1（toybox 的构建顺序本来就是
    Makefile 手工排的）。
  - >-
    OHOS 的共享 libc.so 里没有 getspnam/getspnam_r（两个符号只在 libc.a），链接期会产生未定义引用；
    处置是 LDFLAGS=-static，并用 0002 补丁声明 OHOS musl 头缺失的 utmpx/shadow 入口，
    使 shadow-passwd 类 applet 真正链上。
  - >-
    toybox 的测试统计不能用单一分母表达：注册行数、循环展开后的执行项数、未编入本次 config 的
    applet 整文件 0 执行，三者量纲不同。scripts/test.sh:43 的机制是 applet 的 shim 未生成就直接
    return 并只打一行 SKIP: <name> disabled。同时 test.sh 默认跳过没有可执行位的 .test 文件，
    而 HMDFS 的模式位不可靠，必须 TEST_ALL=1 才不会被静默漏跑。
  - >-
    失败族的归账必须按证据有序匹配，不能按 applet 名归族：同一 applet 可能同时命中多个机制
    （实测 tar 的失败里既有 bad group sys 的账户命名空间族，也有 drwxr-x--- 与 drwxrws--x 的纯
    mode 模板族；find 的失败里 fifo、mode、-printf 转义三种机制并存）。通用值差异族必须排在具体族
    之后垫底，否则会把 printf 转义这类异机制吞成权限位问题，台账就把失败原因报错了。
  - >-
    E543 配套：HMDFS 默认文件模式 660，打包后的 bin/toybox 可能没有可执行位，package() 内显式
    chmod 0755。
