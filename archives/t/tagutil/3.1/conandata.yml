patches:
  "3.1":
    - patch_file: "patches/0001-fix-clang-compile-options.patch"
      patch_description: "Remove an accidental output-file argument from Clang flags"
      patch_type: "portability"
    - patch_file: "patches/0002-honor-caller-build-type.patch"
      patch_description: "Keep a caller-selected CMake build type instead of forcing DEBUG and ubsan"
      patch_type: "portability"
    - patch_file: "patches/0003-find-iconv-in-libc.patch"
      patch_description: "Accept iconv provided by libc when find_path misses the compiler sysroot"
      patch_type: "portability"
    - patch_file: "patches/0004-skip-flac-assert-usr-include.patch"
      patch_description: "Do not include the glibc-only /usr/include/assert.h FLAC workaround"
      patch_type: "portability"
    - patch_file: "patches/0005-taglib-header-layout.patch"
      patch_description: "Find tag_c.h under include/taglib and define TAGLIB_STATIC"
      patch_type: "portability"
    - patch_file: "patches/0006-bundler4-vendor-install.patch"
      patch_description: "Run Cucumber from gems extracted outside Ruby. Bundler 4 removed --deployment, and Ruby 3.4.5 aborts while extracting gems"
      patch_type: "portability"
    - patch_file: "patches/0007-ruby4-ostruct-logger.patch"
      patch_description: "Declare ostruct and logger, and drop the Bundler 1.16.1 pin, for Ruby 4"
      patch_type: "portability"
    - patch_file: "patches/0008-cucumber-libc-system.patch"
      patch_description: "Run tagutil from Cucumber with libc system(). Ruby 3.4.5 aborts inside Open3.capture2e"
      patch_type: "portability"
