package: tut/2.0.1
homepage: "https://github.com/RasmusLindroth/tut"

# -- Upstream test audit (R51 three-step) --
# The 2.0.1 release tarball unpacks to exactly 96 files (top dir tut-2.0.1/:
# main.go, go.mod, go.sum, config.example.toml, LICENSE, README.md plus
# api/, auth/, config/, docs/man/, feed/, images/, ui/, util/).
# Measured on the unpacked tree 2026-10-04:
# - no file matching *_test.go (0 hits across the whole tree),
# - no `func Test` definitions in any *.go file,
# - no tests/, testdata/ or testing/ directories,
# - Makefile/CI test target: none (repo builds with `go build` / `go install`
#   only; .github/ holds release workflows, not tests).
# `go test ./...` therefore has nothing to run (0 packages with test files).
# Verified twice: (1) unpacked-tarball scan 2026-10-04; (2) GitHub API tree
# for tag 2.0.1 (sha 33d7cd8cbf5f8048b49bf218a3c7aed2ab3d6346, non-truncated)
# lists every blob: zero paths ending in _test.go, no tests/testdata dirs.
upstream_tests_exist: false
upstream_test_audit:
  source_tarball: "tut-2.0.1.tar.gz (https://github.com/RasmusLindroth/tut/archive/refs/tags/2.0.1.tar.gz)"
  source_sha256: "afa8c49036461a36c091d83ef51f9a3bbd938ee78f817c6467175699a989b863"
  build_system: "Go modules (go 1.18, `go build .` at module root)"
  scanned_for:
    - "*_test.go files (whole tree)"
    - "func Test definitions in any *.go file"
    - "tests/ / testdata/ / testing/ directories"
    - "Makefile / check / test targets, ctest/gtest/pytest registration"
  scan_result: "96 files, 0 *_test.go, 0 func Test, no tests/testdata dirs, no check/test target (build only via `go build` / `go install`; .github/ holds release workflows)"
  reason: "Upstream tut 2.0.1 genuinely ships no tests: recursive tarball scan finds zero *_test.go and zero Test functions; GitHub API tree for tag 2.0.1 confirms zero _test.go blobs. `go test ./...` has nothing to run."
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_total: 0
upstream_test_count_method: manual_audit
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: >-
      Really runs the installed tut binary: `tut --help` must print usage
      (non-empty, names tut/usage/commands); `tut --version` must print a
      non-empty version string containing a digit; `tut example-config` must
      produce a non-empty config.example.toml. Every check has an explicit
      failure exit path; outputs are verified non-empty (not silent pass).
    command: "sh test.sh"

test_files:
  - path: test_package/test.sh
    test_type: R34
    assertion_count: 3

test_package_test_count: 1
consumer_assertion_count: 3
assertion_count: 3
test_case_count: 3
max_rss_mb: 10
