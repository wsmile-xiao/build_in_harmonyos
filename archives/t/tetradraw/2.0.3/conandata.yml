# conandata.yml — tetradraw 2.0.3
sources:
  url: "http://deb.debian.org/debian/pool/main/t/tetradraw/tetradraw_2.0.3.orig.tar.gz"
  sha256: "0fec43eea9ff3622547bccb602f52c4241f675921967cd46446de833fe67450a"

patches:
  - patch_file: "patches/0001-config.sub.patch"
    patch_description: "Add aarch64 CPU and linux-ohos OS to autoconf 2.57 config.sub"
    patch_type: "portability"
  - patch_file: "patches/0002-makefile-ldadd.patch"
    patch_description: "Link against -lncursesw -lmenuw (wide-char static ncurses from ncurses/6.6) and accept build LDFLAGS"
    patch_type: "portability"
  - patch_file: "patches/0003-interface-opaque-menu.patch"
    patch_description: "Use item_index() instead of struct tagITEM.index (opaque ncurses MENU API, ncurses 6.x)"
    patch_type: "portability"
  - patch_file: "patches/0004-load-rindex.patch"
    patch_description: "Replace removed musl symbol rindex with strrchr"
    patch_type: "portability"
  - patch_file: "patches/0005-select-fd-set-portability.patch"
    patch_description: "Restore classic POSIX FD_SET in src/network.c; the OHOS sys/select.h injects the private __fd_chk() call into the macro, which makes the binaries unloadable on any libc other than the OHOS sysroot one"
    patch_type: "portability"
  - patch_file: "patches/0006-configure-umask-hmdfs.patch"
    patch_description: "Lower autoconf 2.57 configure tmp-dir umask from 077 to 022: on HMDFS a 0700 mktemp dir makes config.status fail with Permission denied (silent Error 1)"
    patch_type: "portability"
