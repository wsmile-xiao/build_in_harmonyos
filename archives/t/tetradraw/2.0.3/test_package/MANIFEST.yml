# test_package/MANIFEST.yml — tetradraw 2.0.3
package: tetradraw/2.0.3
homepage: "http://tetradraw.sourceforge.net/"

# Upstream ships no test suite at all: the 2003 tarball has no tests/
# directory, no ctest wiring, and no Makefile.am `check_PROGRAMS` /
# `TESTS`.  Verified by inspecting the pristine source tree (only
# AUTHORS COPYING ChangeLog INSTALL Makefile.am Makefile.in NEWS README
# THANKS TODO aclocal.m4 config.guess config.h.in config.sub configure
# configure.in depcomp install-sh ltmain.sh missing mkinstalldirs src/).
# `make check` does exist, but it is the automake-generated empty
# `check: check-recursive` no-op -- so it is recorded as NOT_RUN rather
# than as an upstream test that passed.
upstream_check_command: "make check (automake no-op: check-recursive with no TESTS)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_tetradraw.sh
    description: "tetradraw/tetraview 存在且为 aarch64 ELF，并真实执行穿透到程序自身 setup_ncurses()，退出码排除 loader/信号/挂死"
    command: "sh test_tetradraw.sh <package>/bin"

assertion_count: 8
