# test_package/MANIFEST.yml — tiv 1.2.1
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tiv/1.2.1
homepage: "https://github.com/stefanhaustein/TerminalImageViewer"

# 上游测试命令
# tiv 1.2.1 的 GitHub tag 归档里没有 tests/ 目录、Makefile 里也没有 check/test
# 目标（已逐项核对归档文件清单：LICENSE README.md snapcraft.yaml
# terminalimageviewer.rb src/{CImg.h,Makefile,tiv.cpp} src/java/ .github/）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无自动化测试程序可跑（R51：如实声明，不虚报数量）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: >-
      通过 conanrun PATH 实跑打包后的 bin/tiv：(1) PATH 上的 tiv 就是依赖包
      bin/ 里的文件（TIV_PKG_DIR 比对，防止宿主同名 tiv 顶包）；(2) --help
      有输出 + 版本横幅 v1.2.1 + usage；(3) 无参数 usage；(4) 未知选项退出码
      64 (EX_USAGE)、文件不存在退出码 66 (EX_NOINPUT)；(5) 64x64 PPM 渲染出
      24-bit RGB 转义序列 ESC[48;2; / ESC[38;2; / ESC[0m 与 Unicode 下半块
      U+2584；(6) -h 4/-h 8 分别输出 4/8 行；(7) -w 10 与 -w 20 输出字节数
      不同（缩放生效）；(8) --256 走 ESC[48;5;/ESC[38;5; 索引色模式且不再出现
      ESC[48;2;；(9) 条纹图默认模式选中最佳块字符 U+2582，而 -0 模式固定
      输出 U+2584 且不含 U+2582（-0 关闭块字符优化）；(10) 灰度 PPM(P5) 的
      24-bit 前景色与背景色三通道各自相等（spectrum==1 → 复制到 3 通道）；
      (11) dir 模式渲染双文件目录退出码 0。另含 6 条「捕获输出非空」守卫：
      反向断言（assert_not_contains）在空输出上会真空转绿，非空守卫先把这条路堵死。
    command: "TIV_PKG_DIR=<package_folder> bash test.sh"

# 断言总数：见 test.sh 内各 assert_* 调用（不含二次判定分支）
assertion_count: 34