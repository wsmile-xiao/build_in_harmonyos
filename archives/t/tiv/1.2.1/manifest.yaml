# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "tiv 1.2.1 的 Makefile 在 src/ 子目录里，tarball 顶层没有 makefile，cwd 必须指向 src/"
  - "Makefile 默认规则 `tiv.o: CImg.h` 要求头文件与源码同目录；用制品仓 cimg/3.6.6 的头文件拷进 src/ 覆盖 tarball 自带的 CImg.h 3.3.1"
  - "上游 Makefile 用 `CXXFLAGS ?= -O2 -fpermissive`，-fpermissive 是 GCC 专有选项；命令行传 CXXFLAGS 覆盖即可（Makefile 里 override += 的 -std=c++2a 仍会追加）"
  - "tiv.cpp 顶部自带 `#define cimg_display 0`，不依赖 X11，OHOS 上无需额外配置"
  - "tiv 用 ioctl(TIOCGWINSZ) 取终端尺寸，输出重定向时回退 80x24 并往 stderr 打 warning；不影响测试"
  - "未定义 cimg_use_png/cimg_use_jpeg，PNG/JPEG 解码未启用（OHOS 上 ImageMagick 不可用），但 PPM/PNM 是 CImg 内建格式，实测可正常渲染"