knowledge_gained:
  - "config.guess/config.sub 需要更新以识别 aarch64-unknown-linux-ohos（ref: E007）"
  - "pcap_offline_read 在现代 libpcap 中已移除，需替换为 pcap_dispatch（ref: E081）"
  - "旧版 Autoconf (2.52) 的 config.status 使用 umask 077 创建临时目录，在 HarmonyOS SGID 环境下导致权限冲突，需改为 umask 007（ref: E082）"
  - "/tmp 在鸿蒙上为只读，需设置 TMPDIR 为可写目录（ref: E002）"
  - "Makefile.in 的 install/install-man 目标需添加 DESTDIR 支持、移除 -o/-g 参数、BINDIR/MANDIR 使用 @prefix@ 替换硬编码路径（ref: E083）"
  - "旧版 bison 1.28 生成的 filt_parser.c 与现代 bison 3.8.2 不兼容，通过设置 YACC=bison -y LEX=flex 环境变量让 Makefile 在构建时重新生成"

