# test_package/MANIFEST.yml
package: tcptrace/6.6.7
homepage: https://github.com/blitz/tcptrace

upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Verify the packaged executable is on PATH"
    command: "command -v tcptrace"
  - file: test.sh
    description: "Run tcptrace with no args and check usage output"
    command: "tcptrace"
  - file: test.sh
    description: "Run tcptrace -hargs and verify version info"
    command: "tcptrace -hargs"

assertion_count: 4
