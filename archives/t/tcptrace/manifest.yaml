software: tcptrace
display: "tcptrace"
description: "Analyze tcpdump output - TCP connection analysis tool"
category: network
homepage: "https://github.com/blitz/tcptrace"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需更新为 automake 1.17 版本以识别 aarch64-unknown-linux-ohos"
    - "pcap_offline_read 在现代 libpcap 中已移除，需替换为 pcap_dispatch"
    - "/tmp 在鸿蒙上为只读，需设置 TMPDIR 为可写目录"
  common_dependencies:
    - "libpcap"

versions:
  "6.6.7":
    status: built
    build_date: "2026-07-24"
    published_as: tcptrace