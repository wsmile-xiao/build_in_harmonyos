    command: "test_tap_plugins <package>/lib/ladspa"
  - file: test_tap_plugins.c
    description: "HarmonyOS-specific native test validates AArch64 via uname and runs all LADSPA modules through the HarmonyOS musl dynamic loader."
    command: "test_tap_plugins <package>/lib/ladspa --expect-ohos"

assertion_count: 79
