# conandata.yml — tmfs 7
# Upstream release archive, taken from the official Debian source pool (the
# tarball is byte-identical to upstream's tmfs-r7 tag; verified against the
# signed tmfs_7-1.dsc Checksums-Sha256).
sources:
  url: "https://deb.debian.org/debian/pool/main/t/tmfs/tmfs_7.orig.tar.gz"
  sha256: "7566fc69a96d8e08c5e8c598b1e43e0b676b7f041746f12e7b3a594635e82f89"

patches:
  - patch_file: "patches/0001-fuse3-support.patch"
    patch_description: "Build against libfuse 3 as well as libfuse 2 (Debian's quilt patch, upstream PR #35): pkg-config fuse3 first with a fuse2 fallback, FUSE_USE_VERSION 30 and the fuse3 getattr/readdir/filler signatures"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-posix-s-ifdir-and-link-order.patch"
    patch_description: "Use the POSIX S_IFDIR instead of the glibc-only __S_IFDIR, and move link_directories() above add_executable() so -L reaches the link line"
    patch_type: "portability"
