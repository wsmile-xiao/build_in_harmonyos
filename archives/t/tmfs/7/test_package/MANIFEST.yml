# test_package/MANIFEST.yml — tmfs 7

package: tmfs/7
homepage: "https://github.com/abique/tmfs"

# ── 上游测试审计 (hmbs 机器证据门禁) ───────────────────────────────────────
# 审计结论：tmfs 7 上游没有任何自动化测试。
upstream_test_audit:
  - source: "tmfs-7 官方归档 (tmfs_7.orig.tar.gz, 4574 字节)"
    reason: "tar 内共 9 个条目：CMakeLists.txt、LICENSE、README.markdown、AUTHORS、ChangeLog 与 src/{tmfs.hh,main.cc,getattr.cc,read.cc,readdir.cc,readlink.cc,get_real_path.cc}；无 tests/、test/ 目录，无任何测试框架文件（gtest/Catch2/ctest/pytest 均无）"
  - source: "CMakeLists.txt"
    reason: "无 enable_testing()/add_test()/ctest 调用，无 test 目标；只定义 tmfs 可执行目标与 install(TARGETS tmfs RUNTIME DESTINATION bin)"
  - source: "上游仓库 abique/tmfs"
    reason: "release 7 之后上游未再维护（ChangeLog 最后一条为 2013 年的 release 4），Debian 亦仅打包该版本，无独立测试套件"
  - conclusion: "上游未提供自动化测试；由 test_package 对打包的 tmfs 二进制执行真实行为测试（参数校验两条分支，2 项断言）+ ELF 结构校验（3 项断言）"

# 上游测试命令：无（上游无测试套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：—
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "真实调用打包的 tmfs：无参数应打印 usage 并 exit 2；传入普通文件应报 'is not a directory' 并 exit 1（夹具建在 $TMPDIR → $HOME → 当前目录 → /tmp 中第一个可写目录里，不让 worker 的只读 /tmp 把这条判失败）；另做 ELF 结构校验（ELF64 / AArch64 / PIE / 仅有 libc.so 动态依赖，C++ 运行时与 FUSE 均静态链接）"
    command: "ctest --output-on-failure"

# 测试断言总数
assertion_count: 5
