# 版本级 manifest — tmfs 7
version: "7"
software: tmfs
upstream_version: "r7"
conan_ref: "tmfs/r7"
status: built
build_date: "2026-10-05"
build_system: cmake

source:
  url: https://deb.debian.org/debian/pool/main/t/tmfs/tmfs_7.orig.tar.gz
  sha256: 7566fc69a96d8e08c5e8c598b1e43e0b676b7f041746f12e7b3a594635e82f89
  tar_format: tar.gz

build:
  system: cmake
  configure_options: []
  dependencies:
  - libfuse/3.18.2
  cc: clang
  cxx: clang++

patches_applied:
- patches/0001-fuse3-support.patch
- patches/0002-ohos-posix-s-ifdir-and-link-order.patch

knowledge_gained:
- tmfs 7 的 README 声称依赖 boost，但 6 个 .cc 无任何 boost 头，CMakeLists 的 Boost_INCLUDE_DIRS 是空变量；实际只需 libfuse
  # reference: notes.md
- '"__S_IFDIR" 是 glibc 内部别名（需 __USE_MISC），musl/OHOS 只有 POSIX 的 "S_IFDIR"'
  # reference: notes.md
- link_directories() 只对其后创建的目标生效：上游把它写在 add_executable() 之后，依赖系统默认链接路径才侥幸可用；换成 Conan 包目录即断链
  # reference: notes.md
- libfuse 配方声明 includedirs=["include"] 但头文件实际在 include/fuse3/；PkgConfigDeps 生成的 fuse3.pc 需改写 includedir，否则 `#include <fuse.h>` 找不到（同 sshfs 3.7.5-r0 的 _patch_fuse_pkg_config）
  # reference: notes.md
- Conan 2 拒绝单字符版本号（RecipeReference slug 需 ≥2 字符）：目录/分支保持任务卡 7，配方 set_version() 归一化为上游 tag r7
  # reference: notes.md
- libfuse3.a 的 fuse_signals.c.o 引用 backtrace/backtrace_symbols；上游 musl 1.2.6 的 libc 不导出这两个符号，交叉执行需静态链接探针（真机 SDK libc 有）
  # reference: notes.md
- "OHOS CI worker 的 /tmp 是只读的：测试夹具必须按 $TMPDIR/$HOME/当前目录//tmp 逐个尝试，硬编码 /tmp 会以 EROFS 失败（CI #84208）"
  # reference: notes.md
- "OHOS NDK 驱动默认动态链接 libc++_shared.so，而该库只在 SDK 的 llvm/lib/aarch64-linux-ohos/ 下、加载器无默认搜索路径：C++ 程序应加 -static-libstdc++，否则真机产物 DT_NEEDED 会多出 libc++_shared.so（本地 /opt/lpk-fixed 垫片永远静态链接，看不出来）"
  # reference: notes.md
