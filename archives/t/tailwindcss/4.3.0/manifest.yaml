software: tailwindcss
version: "4.3.0"
status: built
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/tailwindlabs/tailwindcss/archive/refs/tags/v4.3.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 混合构建系统：Rust + Node.js
  system: custom

  # Rust 编译命令
  rust_build: "cargo build --release"

  # Node.js 构建受阻于 esbuild/bun 缺失
  node_build_blocked: true
  blocked_reasons:
    - "esbuild: No OpenHarmony precompiled package"
    - "bun: No OpenHarmony precompiled package"

  configure_options: []

  dependencies:
    - rust/1.95.0
    - node/24.13.0
    - pnpm/9.6.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "tailwindcss v4 是 Rust + Node.js 混合架构"
  - "核心用 Rust 重写，CLI 用 TypeScript"
  - "napi-rs 用于创建 Node.js native binding"
  - "esbuild/bun 是构建瓶颈，需要优先解决"
  - ".node 文件在 OpenHarmony 上有权限限制"

# ============================================================
# 产物信息
# ============================================================

artifacts:
  rust_binding: "libtailwind_oxide.so (3.2M)"
  rust_tool: "tailwindcss-oxide (530K, performance test tool)"
  wrapper: "tailwindcss-wrapper.sh (npx wrapper)"

# ============================================================
# 安装方法
# ============================================================

installation:
  method: "npx wrapper"
  command: "cp bin/tailwindcss ~/usr/local/bin/"
  usage: "tailwindcss --version"

# ============================================================
# 已知问题
# ============================================================

issues:
  - id: 1
    description: "esbuild/bun 缺失导致无法完整构建"
    severity: high
    workaround: "使用 npx wrapper"

  - id: 2
    description: ".node 文件权限问题"
    severity: medium
    workaround: "需要用户触发安全弹窗"