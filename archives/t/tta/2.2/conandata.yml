# conandata.yml — libtta 2.2
# Single source of truth for source URL + SHA256 + patches.
sources:
  url: "https://downloads.sourceforge.net/project/tta/tta/libtta/libtta-2.2.tar.gz"
  sha256: "1723424d75b3cda907ff68abf727bb9bc0c23982ea8f91ed1cc045804c1435c4"

patches:
  - patch_file: "patches/0001-config-sub-aarch64.patch"
    patch_description: "Accept modern aarch64 host triples in the bundled 2005 config.sub"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-cpu-arm.patch"
    patch_description: "Recognize aarch64 host_cpu as ARM in the generated configure script"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-as-tmpdir-mkdir.patch"
    patch_description: "In the generated configure script, drop the mktemp branch of autoconf AS_TMPDIR and always build the ./conf* temp dir with the mkdir fallback under umask 022 (not 077), because on HMDFS a setgid dir made with umask 077 is owner-unwritable so config.status fails with 'can't create ./conf*/subs1.awk: Permission denied'"
    patch_type: "portability"
  - patch_file: "patches/0004-console-open-no-nonblock.patch"
    patch_description: "Drop the O_NONBLOCK flag from the console tool's tta_open_read helper (console/tta.h). The upstream helper opens input files with O_RDONLY|O_NONBLOCK; on the HarmonyOS device filesystem an open(2) carrying O_NONBLOCK on a regular file can fail (EINVAL), so the console encoder/decoder aborts with 'can't open file' / TTA_OPEN_ERROR and exits 255 on both encode and decode. O_NONBLOCK has no effect on regular-file reads per POSIX, so opening with plain O_RDONLY is strictly more portable and does not change correct behavior. Note: console/tta.h uses CRLF line endings, so this patch is written with CRLF so git apply matches the extracted source."
    patch_type: "portability"
  - patch_file: "patches/0005-console-getopt-eof-int-c.patch"
    patch_description: "Fix the classic signed/unsigned char getopt EOF bug in the console tool's main loop (console/tta.c). tta_main declares `char c;` to hold the return of getopt(), whose end-of-options sentinel is -1. On AArch64 (the HarmonyOS PC target) `char` is unsigned by default, so assigning -1 yields 0xFF (255) and the loop-termination test `(c = getopt(...)) != -1` then evaluates 255 != -1 as true, so the loop runs one extra iteration where c=0xFF matches `case '?': default:` and silently `goto done` -> main returns -1 -> the tool exits 255 after printing only the version banner (no 'Encoding'/no error message), failing both encode and decode identical to the device log. On x86 `char` is signed, so -1 stays -1 and the loop terminates correctly, which is why the tool works in local x86 runs but not on the device. Changing `char c;` to `int c;` preserves getopt's -1 sentinel on every architecture. Note: console/tta.c uses CRLF line endings, so this patch is written with CRLF context so conan's patch_ng matches the extracted source."
    patch_type: "portability"
