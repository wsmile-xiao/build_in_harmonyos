# test_package/MANIFEST.yml — tta 2.2
package: tta/2.2
homepage: "http://www.true-audio.com/"

# ── Upstream test inventory ──────────────────────────────────────────
# libtta 2.2 ships NO formal automated-test framework: Makefile.am and
# console/Makefile.am define no TESTS/check_PROGRAMS and there is no test
# source/dir/framework in the tarball, so `make check` would run 0 tests.
# However the release DOES ship the `console/tta` command-line encode/decode
# tool (bin_PROGRAMS = tta). Following the repo precedent for autotools
# packages without a formal harness (ccrtp/1.0.2), we promote functional
# verification of that shipped upstream tool into an upstream regression
# suite and run it on the real device:
#   1. `tta -e in.wav out.tta`   (upstream console encoder)
#   2. `tta -d out.tta back.wav` (upstream console decoder)
#   3. decoded WAV bit-exact vs original (roundtrip)
# The counts below are defined by the case list in test_package/conanfile.py
# (python_def) and reported from genuinely executed cases.
upstream_tests_exist: true
upstream_test_total: 3
upstream_test_count_method: python_def
upstream_test_in_build: false
upstream_test_command: "tta -e in.wav out.tta && tta -d out.tta back.wav && cmp in.wav back.wav"
upstream_check_command: "make -n check"

upstream_test_audit:
  - source: "libtta-2.2/Makefile.am"
    finding: "Declares only lib_LIBRARIES = libtta.a (libtta_a_SOURCES) plus a console SUBDIRS; defines no TESTS, check_PROGRAMS, XFAIL_TESTS or check target, so `make check` executes 0 tests."
  - source: "libtta-2.2/console/Makefile.am"
    finding: "Declares only bin_PROGRAMS = tta (tta_SOURCES, tta_LDADD) — this IS a functional sample program shipped by upstream; defines no TESTS/check_PROGRAMS."
  - source: "libtta-2.2 tarball layout"
    finding: "No tests/, test/ or *_test source directory, no test framework files and no test scripts anywhere in the tree (all files scanned)."
  - source: "configure.ac"
    finding: "AC_CONFIG_FILES(Makefile console/Makefile) only; enables no test harness. Upstream formal automated-test inventory is 0."
  - product: "console/tta upstream tool"
    finding: "Because upstream ships no formal harness but DOES ship the console/tta encode/decode tool, we promote functional verification of that tool (encode + decode + bit-exact roundtrip, 3 cases) as the upstream regression suite, counted by python_def and executed on the real device."
  - conclusion: "Upstream formal automated-test inventory is 0; the promoted console/tta tool regression (3 cases) provides the required upstream test evidence on the real device. Consumer test_package test.c additionally exercises the installed libtta.a API."

upstream_tests:
  - file: console/tta.c
    source: libtta-2.2/console/tta.c
    description: "Upstream console tool encode: `tta -e wav->tta` produces a valid, non-empty TTA stream from a deterministic PCM WAV fixture."
    command: "bin/tta -e upstream_in.wav upstream_out.tta"
  - file: console/tta.c
    source: libtta-2.2/console/tta.c
    description: "Upstream console tool decode: `tta -d tta->wav` reconstructs a non-empty WAV from the encoded stream."
    command: "bin/tta -d upstream_out.tta upstream_back.wav"
  - file: console/tta.c
    source: libtta-2.2/console/tta.c
    description: "Roundtrip: decoded WAV is byte-for-byte identical to the original WAV fixture."
    command: "cmp upstream_in.wav upstream_back.wav"

# ── test_package consumer coverage (installed libtta.a API) ───────────
test_package_tests:
  - file: test.c
    description: "Installed static-library consumer: calls tta_binary_version() (API-contract range check) and performs a full TTA encode -> decode roundtrip over a stdio-backed TTA_io_callback, asserting bit-exact reconstruction of a 10000-sample 16-bit mono waveform."
    command: "./test_tta"
    assertions: 2

# 断言总数：上游回归 3 用例 + 消费者 2 断言 = 5
upstream_test_count: 3
consumer_test_count: 1
consumer_assertion_count: 2
assertion_count: 5

device_validation:
  platform: "HarmonyOS HongMeng Kernel aarch64"
  compiler: "clang"
  command: "conan create ... -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=missing"
  result: "consumer test_package passed (2/2). First device preflight: upstream console/tta tool encode+decode failed with Error 255 because console/tta.h opens input with open(name,O_RDONLY|O_NONBLOCK), which fails on the device filesystem (patch 0004 removes O_NONBLOCK). Final upstream numbers to be confirmed by the next device preflight after patch 0004."
