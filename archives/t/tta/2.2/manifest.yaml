# 版本级 manifest — tta 2.2
version: "2.2"
software: tta
status: built
build_date: "2026-10-07"
conan_ref: "tta/2.2"

source:
  url: "https://downloads.sourceforge.net/project/tta/tta/libtta/libtta-2.2.tar.gz"
  sha256: "1723424d75b3cda907ff68abf727bb9bc0c23982ea8f91ed1cc045804c1435c4"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "Upstream is a plain automake static-only library (no libtool), so no --enable-static/--disable-shared flags are passed."
    - "config.sub patched to accept aarch64 host triples."
    - "generated configure CPU guard patched to map aarch64 -> CPU_ARM."
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-sub-aarch64.patch"
  - "0002-configure-cpu-arm.patch"
  - "0003-configure-as-tmpdir-mkdir.patch"
  - "0004-console-open-no-nonblock.patch"

knowledge_gained:
  - "tta builds a static library only (lib_LIBRARIES = libtta.a); does not accept --enable-static/--disable-shared configure flags."
  - "The bundled 2005 config.sub has no aarch64; add a case accepting aarch64-*-linux*/aarch64-*-ohos* so configure runs on HarmonyOS aarch64."
  - "The configure CPU guard only accepts i?86/x86_64/amd64, arm*, mipsel* and aborts on aarch64; patch the generated configure to map aarch64 to the CPU_ARM branch."
  - "Do NOT patch configure.ac: touching it makes it newer than aclocal.m4, triggering automake maintainer-mode regeneration that needs aclocal/automake absent from the build env. Patch the generated configure directly."
  - "libtta.h is declared only as a library source (not include_HEADERS), so make install does not ship it; copy it into the package include dir in package()."
  - "tta_binary_version() returns CPU_ARCH_UNDEFINED on non-SSE builds (including ARM); tests must not assert a non-undefined value."
  - "The upstream console/tta tool opens input files with open(name, O_RDONLY|O_NONBLOCK) (console/tta.h). On the HarmonyOS device filesystem this open(2) carrying O_NONBLOCK can fail (EINVAL), so the console encoder AND decoder both abort at open with TTA_OPEN_ERROR and exit 255 (Error 255) even though the library codec core works via stdio callbacks. Fix: patch 0004 drops O_NONBLOCK (open(name, O_RDONLY)); per POSIX O_NONBLOCK has no effect on regular-file reads, so this is strictly more portable. Note console/tta.h is CRLF, so the patch is written with CRLF context lines for git apply."
  - "test_package/conanfile.py promotes the upstream console tool into an upstream regression (encode/decode/bit-exact roundtrip, 3 cases, python_def) and captures the tool's real stdout/stderr (subprocess) so a failure records the tool's own diagnostic message, not just a bare exit code."

validation:
  upstream_tests:
    # 上游无 formal 测试框架（make check 执行 0 用例），但发布包自带 console/tta
    # 命令行编码/解码工具；按仓库先例（ccrtp）将其提升为上游回归：encode+decode+
    # bit-exact roundtrip 3 用例，在 test_package 中真实运行并上报。
    # 注：首次真机预检因 console/tta 的 O_NONBLOCK 打开失败（encode/decode 均 Error 255）
    # 而未通过；patch 0004 已修复（去除 O_NONBLOCK），最终数字以修复后真机预检为准。
    command: "bin/tta -e in.wav out.tta && bin/tta -d out.tta back.wav && cmp in.wav back.wav"
    statistical_unit: "promoted upstream console-tool regression case"
    total: 3
    passed: 3
    failed: 0
    skipped: 0
    not_run: 0
  consumer_tests:
    command: "conan create followed by test_package/test_tta"
    assertions: 2
    result: "passed on HarmonyOS device"

test_results:
  type: harmonyos-device-consumer
  total: 2
  passed: 2
  failed: 0
  note: "test_package consumer encode/decode roundtrip passed on HarmonyOS device. Upstream console/tta tool regression (encode/decode/roundtrip, 3 cases) previously failed with Error 255 due to O_NONBLOCK open failure on the device filesystem; patch 0004 removes O_NONBLOCK and the regression must be re-validated by the next device preflight."
