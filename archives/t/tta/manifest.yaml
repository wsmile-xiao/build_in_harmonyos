# 软件级 manifest — tta
software: tta
display: "TTA (True Audio)"
description: "True Audio (TTA) lossless audio codec library (ANSI-C) 及命令行编码/解码器"
category: compress
homepage: "http://www.true-audio.com/"
license: LGPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Patch the bundled 2005 config.sub to accept aarch64 host triples."
    - "Patch the generated configure CPU guard to map aarch64 to the CPU_ARM branch."
    - "Do not patch configure.ac (touching it triggers automake maintainer-mode regeneration that needs absent autotools)."
    - "Copy libtta.h into the package include dir (make install does not ship it)."

  common_dependencies: []

versions:
  "2.2":
    status: built
    build_date: "2026-10-07"
    conan_ref: "tta/2.2"
