# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: thread-pool/4.1.0
homepage: "https://github.com/bshoshany/thread-pool"

# 上游单文件测试程序（4.1.0 无 CMake 项目、无 scripts/compile_cpp.py，用 clang++ 直接编译运行）
upstream_test_command: "clang++ -std=c++17 -O2 -Iinclude tests/BS_thread_pool_test.cpp -o tp_test && ./tp_test"

upstream_tests:
  - file: tests/BS_thread_pool_test.cpp
    source: thread-pool-4.1.0/tests/BS_thread_pool_test.cpp
    description: "BS::thread_pool 上游全量测试程序（submit/blocks/loops/wait/pause/priority/future 多线程检查，自带 check() 计数框架）"
    command: "clang++ -std=c++17 -O2 -Iinclude tests/BS_thread_pool_test.cpp -o tp_test && ./tp_test"

test_package_tests:
  - file: test_thread_pool.cpp
    description: "消费者测试: submit_task/get、detach_loop/wait、submit_blocks/multi_future 求和、utils 头 synced_stream、版本宏"
    command: "./test_thread_pool"

assertion_count: 6
