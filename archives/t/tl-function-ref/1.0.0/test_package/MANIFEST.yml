# test_package/MANIFEST.yml
# 上游官方测试声明文件 — tl-function-ref 1.0.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tl-function-ref/1.0.0
homepage: "https://github.com/TartanLlama/function_ref"

# 上游测试命令: CMake 项目, 无 add_test 注册; 实际直接运行 tests 二进制
upstream_check_command: "cd build && ./tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Catch, tests/{main,constructors,call,issues,assignment}.cpp)
upstream_tests:
  - file: tests/main.cpp
    source: tl-function-ref-1.0.0/tests/main.cpp
    description: "Catch2 测试入口 (6 test cases)"
    command: "./tests"

# test_package 中自带的测试 (消费者视角验证, 真实调用 tl::function_ref API)
test_package_tests:
  - file: test_tl-function-ref.cpp
    description: "消费者测试: 自由函数/lambda/成员函数对象/泛型算法 四类调用"
    command: "./test_tl-function-ref"

# 测试断言总数 (上游 6 + 消费者 4)
assertion_count: 10
