package: tetraproc/0.9.2
homepage: "https://kokkinizita.linuxaudio.org/linuxaudio/"

upstream_check_command: "make -C source check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  The 0.9.2 tarball ships AUTHORS, COPYING, README, doc/, share/ and
  source/: the source/Makefile defines only all, install, uninstall and
  clean targets.  There is no test/check target and no test directory, so
  `make -C source check` fails with "No rule to make target 'check'".
  The packaged programs are exercised instead by the consumer test below.

test_package_tests:
  - file: test_package/conanfile.py + test_package/test.sh
    description: >-
      Consumer verification of the installed package: both programs
      (tetraproc, tetrafile) exist and are regular executables; tetrafile
      --help prints the upstream usage banner and exits 1 exactly as
      upstream; the three K-meter PNG images the GUI loads at startup are
      packaged under share/tetraproc.  On OHOS the consumer is staged with
      the full runtime shared-library closure (copied + ELF-signed) and run
      through LD_LIBRARY_PATH, mirroring the clxclient OHOS runtime
      pattern.  tetraproc itself is an X11/JACK GUI and cannot be launched
      headless; it is built and packaged but not executed.
    command: "bash test_package/test.sh"

test_case_count: 1
assertion_count: 4
