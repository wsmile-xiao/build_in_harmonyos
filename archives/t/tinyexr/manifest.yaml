software: tinyexr
display: "tinyexr"
description: "小型 OpenEXR 图像加载/保存库"
category: graphics
homepage: "https://github.com/syoyo/tinyexr"
license: BSD-3-Clause
build_system: custom
ohos_adaptation:
  key_points:
    - "v1 单头 tinyexr.h + tinyexr.cc 与自带 miniz 编成 libtinyexr.a，零外部依赖"
    - "不用上游 CMakeLists.txt（cmake_minimum_required 2.8 且无安装规则）"
    - "上游测试入口 test/unit/make check（Catch2 tester.cc）与根目录 make test（asakusa.exr）"
    - "test/unit/Makefile 默认 ASan/UBSan，OHOS 用命令行 CFLAGS/CXXFLAGS 覆盖"
  common_dependencies: []
versions:
  "1.0.10":
    status: built
    build_date: "2026-09-21"
    conan_ref: "tinyexr/1.0.10"
  "1.0.13":
    status: built
    build_date: "2026-09-18"
    conan_ref: "tinyexr/1.0.13"
