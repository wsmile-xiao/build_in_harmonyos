package: tinyexr/1.0.10
homepage: https://github.com/syoyo/tinyexr

upstream_check_command: "make -C test/unit tester && ./tester && make all && make test"
upstream_test_in_build: true
upstream_test_command: "make -C test/unit tester && ./tester && make all && make test"

upstream_tests:
  - file: test/unit/tester.cc
    source: tinyexr-1.0.10/test/unit/tester.cc
    description: "Catch2 V1：38 个 TEST_CASE（含 openexr-images 样本与 regression/fuzz 用例）"
    command: "./tester"
  - file: test_tinyexr.cc
    source: tinyexr-1.0.10/test_tinyexr.cc
    description: "根目录 make test：./test_tinyexr asakusa.exr 载入往返"
    command: "make all && make test"

test_package_tests:
  - file: test_tinyexr.cpp
    description: "鸿蒙特有：__OHOS__、SaveEXR/LoadEXR 往返、IsEXR、ParseEXRVersionFromFile"
    command: "./test_tinyexr"

assertion_count: 10
