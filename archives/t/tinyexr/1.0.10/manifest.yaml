software: tinyexr
version: "1.0.10"
status: built
build_date: "2026-09-21"
build_system: custom
homepage: https://github.com/syoyo/tinyexr
license: BSD-3-Clause

source:
  url: "https://github.com/syoyo/tinyexr/archive/refs/tags/v1.0.10.tar.gz"
  sha256: "d2e4cef7ec1ad48e5c363171d15458def77749221db8510bfdfd68cd927fe6cc"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "clang 编译 tinyexr.cc + deps/miniz/miniz.c 为 libtinyexr.a"
    - "上游测试：make -C test/unit tester && ./tester（Catch2 V1）与根目录 make test"
  dependencies: []
  cc: clang
  cxx: clang++
  parallelism: 1

patches_applied: []

validation:
  upstream_tests:
    command: "./tester && make test"
    total: 39
    passed: 38
    failed: 0
    skipped: 0
    not_run: 1
    note: >-
      声明口径 39 = tester.cc 的 38 个 TEST_CASE 宏 + 根目录 make test 1 项；
      实跑 38 = Catch2 37/37（2759 assertions）+ 根 make test 1/1。
      not_run 1 = TEST_CASE("Tiles/Spirals.exr") 位于 tester.cc:1011
      `#if 0  // Spirals.exr uses pxr24 compression`，上游自身未注册。
  conan_create:
    command: >-
      conan create archives/t/tinyexr/1.0.10
      -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=missing
    result: passed
  test_package:
    command: "./test_tinyexr"
    assertions: 10
    harmonyos_specific_assertions: 1
    result: passed
