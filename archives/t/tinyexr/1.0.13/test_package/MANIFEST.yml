package: tinyexr/1.0.13
homepage: https://github.com/syoyo/tinyexr

upstream_check_command: "make -C test/unit tester && ./tester -f run_tests.txt && make test"
upstream_test_in_build: true
upstream_test_command: "make -C test/unit tester && ./tester -f run_tests.txt && make test"

upstream_tests:
  - file: test/unit/tester.cc
    source: tinyexr-1.0.13/test/unit/tester.cc
    description: "Catch2 V1：tarball 内可跑的 35 个 TEST_CASE（16375 assertions）"
    command: "./tester -f run_tests.txt"
  - file: test_tinyexr.cc
    source: tinyexr-1.0.13/test_tinyexr.cc
    description: "Load/Save asakusa.exr"
    command: "make test"

test_package_tests:
  - file: test_tinyexr.cpp
    description: "鸿蒙特有：__OHOS__、SaveEXR/LoadEXR 往返、IsEXR"
    command: "./test_tinyexr"

assertion_count: 10
