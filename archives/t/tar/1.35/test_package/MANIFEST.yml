# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tar/1.35
homepage: "https://www.gnu.org/software/tar/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (GNU tar testsuite 由 tests/testsuite 生成，
# 独立上游用例在 task 台账中完整枚举)
upstream_tests:
  - file: tests/testsuite
    source: tar-1.35/tests/testsuite
    description: "GNU tar autotest testsuite (源码声明的独立用例在台账中枚举)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证 tar CLI)
test_package_tests:
  - file: test_tar.sh
    description: "消费者测试: version/create/list/extract/gzip 往返验证"
    command: "bash test_tar.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6