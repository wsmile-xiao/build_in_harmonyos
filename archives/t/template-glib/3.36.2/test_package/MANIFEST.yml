# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: template-glib/3.36.2
homepage: "https://gitlab.gnome.org/GNOME/template-glib"

# 上游测试命令 (meson test 结果)
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test-expr.c
    source: template-glib-3.36.2/tests/test-expr.c
    description: "TmplExpr 表达式求值测试"
    command: "test-expr"
  - file: tests/test-template.c
    source: template-glib-3.36.2/tests/test-template.c
    description: "TmplTemplate 模板解析与展开测试"
    command: "test-template"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tmpl.c
    description: "消费者测试：TmplTemplate 解析 + TmplScope 变量注入 + expand 输出断言"
    command: "./test_tmpl"

# 测试断言总数 (近似值)
assertion_count: 3
