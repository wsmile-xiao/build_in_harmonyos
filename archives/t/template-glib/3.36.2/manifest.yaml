version: "3.36.2"
software: template-glib
status: built
build_date: "2026-09-15"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/template-glib/3.36/template-glib-3.36.2.tar.xz"
  sha256: "0020f3a401888ce763b3a17508c2f58e91972a483a0c547afdb7ccbe25619948"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
  - "-Ddefault_library=static"
  - "-Dintrospection=disabled"
  - "-Dvapi=false"
  - "-Dgtk_doc=false"
  - "-Dtests=true"
  dependencies:
  - glib2/2.88.0
  - gobject-introspection/1.78.1
  cc: clang
  cxx: clang++

