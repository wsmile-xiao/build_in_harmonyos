version: "1.6.0"
software: "tetgen"
status: built
build_date: "2026-09-20"
build_system: makefile

source:
  url: "https://wias-berlin.de/software/tetgen/1.5/src/tetgen1.6.0.tar.gz"
  sha256: "87b5e61ebd3a471fc4f2cdd7124c2b11dd6639f4feb1f941a5d2f5110d05ce39"
  tar_format: tar.gz

build:
  system: direct
  configure_options:
    - "static library libtet.a: tetgen.cxx -DTETLIBRARY -O3 + predicates.cxx -O0"
    - "CLI tetgen: tetgen.cxx + predicates.cxx -O3 -lm"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  type: upstream_and_consumer
  upstream_tests: 1
  consumer_tests: 1
  passed: 2
  failed: 0

knowledge_gained:
  - "TetGen 1.6.0 is a two-source-file C++ library with no third-party dependencies (links only libm)"
  - "Upstream ships both a handwritten Makefile and a minimal CMakeLists.txt; the Makefile rules are used for a deterministic direct build"
  - "libtet.a is built with -DTETLIBRARY; predicates.cxx is compiled at -O0 (Shewchuk's adaptive predicates are FP-optimization sensitive)"
  - "The CLI tetgen binary requires HarmonyOS ELF signing before it can be executed"
