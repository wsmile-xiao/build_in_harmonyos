package: tetgen/1.6.0
homepage: "https://wias-berlin.de/software/tetgen/"

upstream_check_command: "tetgen example.poly"
upstream_test_in_build: true
upstream_test_command: "./tetgen example.poly"

upstream_tests:
  - file: example.poly
    source: tetgen1.6.0/example.poly
    description: "Upstream smoke test: tetrahedralize the bundled 28-point PLC example and emit mesh output"
    command: "./tetgen example.poly"
    tests: 1

test_package_tests:
  - file: test_tetgen.cpp
    description: "Consumer boundary: link libtet and tetrahedralize a 4-point unit tetrahedron via the public API"
    command: "./test_tetgen"
    assertions: 3

upstream_test_count: 1
consumer_test_count: 1
consumer_assertion_count: 3
assertion_count: 3
