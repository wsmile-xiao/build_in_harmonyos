software: tag
display: "tag"
description: "为 stdin 数据流添加前缀标记（消息/日期/主机名/行号）的小型 C 命令行工具"
category: utility
homepage: "https://github.com/mafintosh/tag"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "构建仅产出 bin/tag 可执行文件，无库产物（package_type=application）"
    - "上游 make install 依赖 install 工具，OHOS 环境改用 Conan copy() 直接搬运二进制到 bin/"
    - "上游无测试套件（无 check/test 目标、无 tests/ 目录），test_package 对打包二进制做真实 stdin 打标功能验证"
  common_dependencies: []

versions:
  "0.1":
    status: built
    build_date: "2026-08-19"
    conan_ref: "tag/0.1"
