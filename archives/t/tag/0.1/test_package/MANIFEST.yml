# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tag/0.1
homepage: "https://github.com/mafintosh/tag"

# 上游源码审计：0.1.0 发布归档不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "0.1.0 源码归档 (mafintosh/tag@0.1.0)"
    reason: "归档仅含 4 个文件：Makefile、README.md、package.json、src/tag.c；无 tests/、test/ 目录，无任何测试源文件。"
  - source: "Makefile"
    reason: "仅有 all/install/uninstall/clean 目标（all 由 $(CC) src/tag.c -std=c99 -O3 -Wall 直接编译），无 check/test 目标，无 TESTS 变量。"
  - source: "src/tag.c"
    reason: "单文件 157 行 C 程序，main() 即程序本体（stdin 打标），无断言、无测试入口、无测试宏。"
  - source: "package.json"
    reason: "npm 元数据仅含 install 指令（make install），无 test 脚本字段。"
  - conclusion: "上游 0.1.0 未提供任何自动化测试；由 test_package 对打包二进制做消费者视角的真实功能验证。"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 check/test 目标，无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无官方测试套件；验证手段为 test_package 对打包二进制的真实执行。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tag.sh
    description: "真实执行打包的 tag 二进制：消息前缀打标（echo world | tag hello）、%l 行号计数、%d 日期戳格式、无参数用法退出码 1、非法格式 %z 退出码 2 与 stderr 报错"
    command: "bash test_tag.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
