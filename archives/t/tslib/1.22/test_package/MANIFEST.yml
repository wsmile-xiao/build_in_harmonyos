# test_package/MANIFEST.yml — tslib 1.22
# CI L0e requires this file to exist.

package: tslib/1.22
homepage: "https://github.com/libts/tslib"

# tslib ships NO automated upstream test suite: no TESTS or check_PROGRAMS
# variable exists in any Makefile.am (root, etc, src, plugins, tests, tools),
# so automake's `make check` target is a structural no-op. The programs under
# tests/ (ts_calibrate, ts_test, ts_test_mt, ts_print*, ts_verify, ts_conf,
# ts_finddev, ts_harvest) are interactive hardware utilities that require a
# real touchscreen plus framebuffer device, not headless test cases.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# No automated upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_tslib_consumer.c
    description: "Consumer links -lts and asserts ts_libversion() package_version==1.22, TSLIB_VERSION_VERSION feature bit, tslib_version() 'tslib 1.22' prefix, and a clean NULL failure path of ts_open() on an absent device"
    command: "./test_tslib_consumer"

# Assertion count: NULL guard, package_version, feature bit, version prefix, error path
assertion_count: 5
