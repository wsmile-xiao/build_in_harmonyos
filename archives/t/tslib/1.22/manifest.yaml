version: "1.22"
software: "tslib"
status: built
build_date: "2026-09-17"
build_system: "autotools"

source:
  url: "https://github.com/libts/tslib/releases/download/1.22/tslib-1.22.tar.xz"
  sha256: "aaf0aed410a268d7b51385d07fe4d9d64312038e87c447ec8a24c8db0a15617a"
  tar_format: "tar.xz"

build:
  system: "autotools"
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-shared"
    - "--disable-static"
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-configure-umask-022-for-hmdfs-temp-dirs.patch"

knowledge_gained:
  - "HMDFS 上 configure 的 `umask 077 && mktemp -d` 临时目录创建后不可写（UID 映射），config.status 报 cannot create subs1.awk；补丁放宽为 umask 022（知识 E011，两种回退路径都要改）"
  - "OHOS 适配版 conan 的 AutotoolsToolchain 不把 tools.build:compiler_executables 映射为 CC/CXX，autotools 配方需 _compiler_env() 显式注入（adplay/1.9、jack/1.9.22 先例）"
  - "tslib 1.22 自带 2018 年 config.sub/config.guess，不识别 ohos 系统也猜不出 uname -s=HarmonyOS，需显式 --build/--host=aarch64-unknown-linux-gnu"
