software: tslib
display: "tslib"
description: "触摸屏访问库，提供可插拔输入/过滤模块与校准、打印、测试等诊断工具"
category: library
homepage: "https://github.com/libts/tslib"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "HMDFS 上 configure 的 umask 077 mktemp 临时目录不可写（E011），补丁放宽为 022"
    - "hnp bash 在 HMDFS 路径 getcwd 失败，CONFIG_SHELL/SHELL 固定 /bin/sh（E386 同族）"
    - "2018 年 config.sub/config.guess 不识别 ohos，显式 aarch64-unknown-linux-gnu 三元组"
  common_dependencies: []

versions:
  "1.22":
    status: built
    build_date: "2026-09-17"
