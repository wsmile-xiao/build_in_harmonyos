# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: thrulay/0.9
homepage: "https://sourceforge.net/projects/thrulay/"

# ── 上游测试清点（R51 三步法：清点 → 实跑 → 回填）────────────────────────
# 【清点】官方发布包 thrulay-0.9.tar.gz（sha256 373d5613dfe371f6b4f48fc853f6c27701b2981ba4100388c9881cb802d1780d，
#   370312 字节，44 个文件）实测：
#   - test/tests 目录计数 = 0（tar tzf … | grep -cE "(^|/)(test|tests)/"）；
#   - test*.{c,cc,cpp,sh,py} 与 *check* 模式文件计数 = 0；
#   - configure.ac 无 AC_CONFIG_TESTDIR / AC_CONFIG_FILES（该版本用旧式 AC_OUTPUT）；
#   - src/Makefile.am 中 check_PROGRAMS / TESTS / EXTRA_PROGRAMS 计数 = 0；
#   - 顶层仅 README/TODO/ChangeLog/LICENSE/thrulay.spec.in + src/ + doc/。
# 【实跑】在已完成 configure 的源码树内执行 make check：
#   make[1]: Entering directory '.../thrulay-0.9.work/doc'
#   make[1]: Nothing to be done for 'check'.
#   make[1]: Leaving directory '.../thrulay-0.9.work'
#   → 0 个用例被注册或执行；"Nothing to be done" 为上游自身输出（确无测试套件，
#     非"环境跑不了"）。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "(none — 上游发布包不含测试套件)"
upstream_tests:
  - file: "(none)"
    source: "thrulay-0.9.tar.gz（全量 44 个文件）"
    description: "上游 0.9 发布包不含测试套件：无 test/tests 目录，src/Makefile.am 无 check_PROGRAMS/TESTS/EXTRA_PROGRAMS 注册"
    command: "make check"
    cases: 0
    executed: false
    not_executed_reason: "上游发布包内不存在可执行的测试对象（清点证据：test 目录计数 0、test* 模式文件计数 0、Makefile.am 测试目标计数 0）；make check 输出 Nothing to be done for 'check'，无用例被注册"
    evidence: "configure.ac 无 AC_CONFIG_TESTDIR/AC_CONFIG_FILES；src/Makefile.am grep -cE '^(check_PROGRAMS|TESTS|EXTRA_PROGRAMS)' = 0"

# ── 本包补全的消费者测试（对打包产物的真实使用，非空壳断言）────────────────
# 两层测试都直接消费打包产物：链接 lib/libthrulay.a + include/thrulay/*.h，
# 以及调用 bin/thrulay / bin/thrulayd，并各自完成一次真实 TCP 容量测量。
test_package_tests:
  - file: test_lib_consumer.c
    layer: "库 API 消费者"
    user_scenario: "在自有程序中链接 libthrulay.a：fork 出 server.h 服务端（init/listen/start），父进程用 client.h（options_init/init/start/report_final/exit）对 127.0.0.1 完成一次完整 TCP 测量，解析客户端上报的实测报告"
    apis: "thrulay_server_init, thrulay_server_listen, thrulay_server_start, acl_allow_add, thrulay_client_options_init, thrulay_client_init, thrulay_client_start, thrulay_client_report_final, thrulay_client_exit, THRULAY_VERSION, STREAMS_MAX, THRULAY_DEFAULT_SERVER_TCP_PORT, THRULAY_DEFAULT_WINDOW"
    cases: 13
    assertions: "头文件契约宏 4 项 + options_init 默认值 5 项 + 服务端子进程退出码 1 项 + 报告采样区间行 1 项 + 实测吞吐量 > 0 且 > 1 Mb/s 2 项"
  - file: test_cli_e2e.py
    layer: "命令行消费者"
    user_scenario: "conan install 后直接调用打包的可执行文件：thrulayd -d 起服务端，thrulay -p PORT -t 2 -i 1 127.0.0.1 跑一次完整测量并解析报告"
    cases: 17
    assertions: "产物存在/可执行 4 项 + 版本与帮助冒烟 6 项 + 服务端就绪 1 项 + 客户端退出码 1 项 + 报告区间与吞吐量 3 项 + 服务端日志 2 项"
    sigpipe_note: "子进程输出全部重定向到文件（不使用管道，读侧不 head 截断），规避 SIGPIPE"
# ── 实测结果（R51 三步法第三步：回填）──────────────────────────────────
# 环境：OHOS aarch64（ci/conan/profiles/ohos-aarch64，clang 15），
#       `conan create archives/t/thrulay/0.9 --build=missing -pr:h ohos-aarch64`
#       干净构建（G2 PASS，包 ID 见 reports/conan-create.log）。
measured:
  upstream_cases: "0（上游无测试套件；make check → Nothing to be done for 'check'）"
  package_tests:
    - file: test_lib_consumer.c
      passed: 13
      total: 13
      rate: "13/13 (100%)"
      evidence: "conan create 日志: thrulay lib consumer: 13/13 checks passed（含真实回环测量：2 个采样区间，吞吐 14242.118 Mb/s）"
    - file: test_cli_e2e.py
      passed: 17
      total: 17
      rate: "17/17 (100%)"
      evidence: "conan create 日志: thrulay CLI e2e: 17/17 checks passed（thrulay 客户端 rc=0，2 个采样区间，吞吐 14054.227 Mb/s）"
  aggregate: "30/30 (100%) 通过"
  conan_create: "PASS（G2 干净构建 + 两层消费者测试全绿；不含失败/跳过项）"

results: "本地 conan create 实测 30/30 通过（100%），详见上节 measured 与 reports/test-report.md；上游可执行用例 0 项（上游无测试套件）"
