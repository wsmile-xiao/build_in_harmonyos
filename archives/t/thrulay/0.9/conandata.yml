# conandata.yml — thrulay 0.9
# Official upstream release tarball (SourceForge project "thrulay").

sources:
  url: "https://downloads.sourceforge.net/project/thrulay/thrulay/0.9/thrulay-0.9.tar.gz"
  sha256: "373d5613dfe371f6b4f48fc853f6c27701b2981ba4100388c9881cb802d1780d"

patches:
  "0.9":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "Replace the 2006-era config.guess with the autoconf 2.72 version plus HarmonyOS identification (patch-autotools-ohos.pl), so configure resolves aarch64-unknown-linux-ohos instead of failing with 'cannot guess build type'"
      patch_type: "portability"
      patch_source: "https://git.savannah.gnu.org/cgit/config.git/plain/config.guess"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "Replace the 2006-era config.sub with the autoconf 2.72 version plus linux-ohos (HarmonyOS) CPU/OS/kernel recognition, so the aarch64-unknown-linux-ohos triplet validates"
      patch_type: "portability"
      patch_source: "https://git.savannah.gnu.org/cgit/config.git/plain/config.sub"
    - patch_file: "patches/0003-configure.patch"
      patch_description: "E114: drop 'umask 077' from configure — on HMDFS the setgid temp dirs created by config.status end up drwx--S--- and writing into them fails with Permission denied"
      patch_type: "portability"
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/tree/main/knowledge/graph/E114.kv"
