  url: "https://downloads.sourceforge.net/project/thrulay/thrulay/0.9/thrulay-0.9.tar.gz"
  sha256: "373d5613dfe371f6b4f48fc853f6c27701b2981ba4100388c9881cb802d1780d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 静态构建：避免 libtool 自建 .so 带不可移植 RUNPATH（R26 同族口径）
  configure_options:
    - "--enable-static"
    - "--disable-shared"

  # 无三方依赖（OHOS sysroot 已提供 libc/libm/libpthread/librt/libresolv）
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "老版 config.guess/config.sub（2006-07-02）不识别 HarmonyOS：./configure 报 cannot guess build type（E007）；整体替换为 autoconf 2.72 版本并在 config.sub 的 OS/kernel 组合白名单加入 linux-ohos*（E072）"
  - "configure 内含 umask 077，HMDFS 下 config.status 临时目录无 x 权限 → mv: Permission denied（E114）；删除该语句"
  - "OHOS SELinux 禁止用户态创建 FIFO，GNU make jobserver 不可用（E525）：autotools 构建须 make -j1"
  - "libtool 自建 .so 的可执行文件带构建期绝对 RUNPATH，不可移植：--enable-static --disable-shared 让两个 CLI 静态内嵌 libthrulay"
  - "thrulay 公开 API acl_allow_add() 就地改写实参（server.c: *pmask++ = '\\0' 拆掉 /32），传字符串字面量会写只读段 SIGSEGV；须传可写缓冲"
  - "设备 uname -s 返回 HarmonyOS（非 OHOS），config.guess 走 *:HarmonyOS:*:* 专用分支；删除其中的 __OHOS__ libc 探针分支后三元组输出不变（实测一致），故补丁内无需平台宏"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmpdir/builds/thrulay-0.9.orig
  source_work_dir: /storage/Users/currentUser/tmpdir/builds/thrulay-0.9.work
  source_orig_hash: eee402b00b491651
  source_work_hash: eafa74d0312ea2ca
  generated_at: '2026-09-30T14:20:00'
  patches_count: 3

