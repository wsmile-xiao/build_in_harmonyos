software: tty-solitaire
version: "1.4.1"
status: published
build_date: "2026-06-11"
build_system: makefile

source:
  url: "https://github.com/mpereira/tty-solitaire/archive/refs/tags/v1.4.1.tar.gz"
  sha256: "8eb536a87f0586e1f057a3aa05256df34cbd92a3e22545d1df2f945e27d89db2"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "CFLAGS=-fPIC -O2 -I$DEFAULT_PREFIX/include -W -Wall -pedantic -ansi -std=c99 -DVERSION=\"1.4.1\""
    - "LDFLAGS=-lncursesw -L$DEFAULT_PREFIX/lib"
  dependencies:
    - ncurses/6.4
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ncurses 预编译包不含开发头文件 (curses.h)，需从源码手动生成 ref:E090"
  - "HMDFS 文件系统限制 config.status 创建临时文件，autoconf configure 可能失败 ref:E010"
  - "plain Makefile 项目无需 configure，直接 make CC=clang 编译 ref:E091"
  - "VERSION 宏必须引号包裹 DVERSION=\"1.4.1\" 否则编译报浮点常量错误 ref:E091"

compatibility:
  level: high
  issues:
    - "4个 -Wreturn-type 警告（上游代码缺陷，cursor.c/game.c），不影响功能"
  notes: |
    - 🔴 ncurses 必须静态链接 (--without-shared)，运行时仅依赖 libc.so
    - 游戏运行需要真实终端 (xterm/VT100)，无终端时报 "Error opening terminal" 退出
    - 无 configure 脚本，是 plain Makefile 项目

test_results:
  type: manual
  passed: 9
  failed: 0
  note: "ttysolitaire_test 退出码 0，所有单元测试通过；R7安全弹窗已触发"

references:
  - https://github.com/mpereira/tty-solitaire