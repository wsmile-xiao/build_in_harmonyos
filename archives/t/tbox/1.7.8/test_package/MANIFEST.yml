package: tbox/1.7.8
homepage: "https://github.com/tboox/tbox"

upstream_check_command: "build/linux/arm64/release/demo (no args) prints 97 registered testname entries"
upstream_test_in_build: true
upstream_test_command: "build() runs each of the 97 `demo <testname>` entries (stdin=/dev/null, 20s timeout guard)"

upstream_tests:
  - name: src-demo-sources
    command: "conanfile.py build(): demo binary per-entry execution; ledger line 'UPSTREAM-DEMO LEDGER' in conan-create log"
    expected: "N_static=160 (find src/demo -name '*.c'); N_runner=97 executable entries, all executed: PASS 84 / FAIL 7 / TIMEOUT 6 (2026-09-20 device run; non-pass items are env-capability or upstream self-check behavior, see notes.md)"

test_package_tests:
  - file: test.c
