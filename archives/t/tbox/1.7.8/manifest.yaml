# 版本级 manifest — tbox 1.7.8
# 遵循 ARCHIVE-SPEC v2.0

version: "1.7.8"
software: "tbox"

status: built
build_date: "2026-09-17"
build_system: makefile

source:
  url: "https://github.com/tboox/tbox/archive/refs/tags/v1.7.8.tar.gz"
  sha256: "eda4ea0fe53b55594a0c4842fcf1f3510fec5b183936142873c47455fdaefa4a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=<profile clang> ./configure --plat=linux --arch=arm64 --toolchain=clang"
    - "--mode=release --kind=static --demo=n"
    - "make -j2 && make install"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "tbox 1.7.8 自带 xmake.sh 的 configure 脚本（非 autotools）：CC 环境变量可注入 OHOS clang，--plat=linux --arch=arm64 特性探测自动适配 musl"
  - "上游无测试套件（src/demo 仅为示例），验证依赖消费者测试"
  - "make install 布局为 include/tbox/... 与 lib/libtbox.a"
