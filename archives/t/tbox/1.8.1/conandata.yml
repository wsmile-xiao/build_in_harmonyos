# conandata.yml — tbox 1.8.1
# 源码：上游 GitHub tag 归档（release v1.8.1 未上传 assets，官方只提供 tag 归档）
#   https://github.com/tboox/tbox/releases/tag/v1.8.1  -> assets: []
# 用 github.com/.../archive/refs/tags/*.tar.gz 形态（仓库内 1160 个配方同形）；
# 该 URL 必须带 .tar.gz 后缀，否则 Conan get() 按后缀判定格式会把 tar.gz 当 zip。
sources:
  url: "https://github.com/tboox/tbox/archive/refs/tags/v1.8.1.tar.gz"
  sha256: "48284c1f1f6e4e74ce1b4d2447c3141fdfdd3a20ef1cb30fc2f1021149227fdb"

patches:
  - patch_file: "patches/0002-src-tbox-platform-bsd-filelock.c.patch"
    patch_description: "HarmonyOS: bsd/filelock.c 的 <sys/file.h> 守卫只认 TB_CONFIG_OS_HARMONY，而 configure 生成的是 TB_CONFIG_OS_HARMONYOS，导致 flock/LOCK_EX/LOCK_SH/LOCK_NB 未声明、编译失败（1.8.1 回归）"
    patch_type: "portability"
  - patch_file: "patches/0003-src-tbox-xmake.sh.patch"
    patch_description: "database 模块的 sqlite3 后端接线：shell 构建前端（xmake.sh）没有 xmake.lua 的 add_packages()/has_package() 包探测，故 TB_CONFIG_PACKAGE_HAVE_SQLITE3 永不置位、database/impl/sqlite3.c 也不会被编译；改为在 tbox target 内读取 TB_SQLITE3_INCLUDEDIR/TB_SQLITE3_LIBDIR 环境变量后 add_defines/add_includedirs/add_linkdirs/add_links 并加入后端源文件"
    patch_type: "portability"
  - patch_file: "patches/0001-src-demo-xmake.sh.patch"
    patch_description: "与上一条同一原因，作用于 demo target：让上游 demo 测试套件（--demo=yes）能链接 sqlite3，使 database_sql 用例可被真实执行；不影响库本身的产物"
    patch_type: "portability"
