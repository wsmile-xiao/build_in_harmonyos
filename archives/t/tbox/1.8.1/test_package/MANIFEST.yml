# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在

package: tbox/1.8.1
homepage: "https://github.com/tboox/tbox"

# 上游测试入口：configure 生成的 demo 二进制按名字调度全部用例
#   ./configure --plat=harmonyos --arch=arm64 --toolchain=envs --kind=static \
#       --charset=y --hash=y --float=y --force_utf8=y --xml=y --object=y \
#       --regex=y --coroutine=y --small=no --demo=yes && make && ./demo
# 不带参数运行 ./demo 会打印全部 testname
upstream_check_command: "./demo <testname>"

# 上游套件包含需要外网/对端进程的用例（network_*/stream_http 等），
# 在 conan create 内跑会让 CI 依赖外部网络，故上游套件在设备采信轮单独执行，
# 逐用例结果与失败归因见 reports/。
upstream_test_in_build: false
upstream_test_command: "./demo <testname>   # 158 个用例逐个执行"

upstream_tests:
  - file: src/demo/demo.c
    source: tbox-1.8.1.tar.gz/src/demo/demo.c
    description: "上游 demo 测试套件：g_demo[] 注册并按名字调度用例（libc/libm/math/utils/hash/string/memory/platform/container/algorithm/stream/network/charset/xml/object/regex/coroutine），每个用例内含 tb_assert 断言"
    command: "./demo <testname>"

test_package_tests:
  - file: test.c
    description: "消费者视角验证：版本自证 1.8.1 + md5 + base64 往返 + UTF-8/GB2312 转换往返 + 容器"
    command: "./test_tbox"

assertion_count: 10
