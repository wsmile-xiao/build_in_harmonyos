# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.1"

# 软件名
software: "tbox"

# 编译状态
# published | built | failed | archived
# built: 设备侧 conan-verify 干净轮通过；合并后 release upload 未确认前不标 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
# 顶层 build_system 与 build.system 必须一致（门禁读的是顶层这个键）。
# 注意：门禁的 _BUILD_SYSTEM_ALIASES 不认 "custom"，会打印
# "build.system='custom' 无法识别，回退到入口探测" 并按入口文件探测
# （configure 优先于 Makefile）→ 先 ./configure 再 make，G0 通过。
# 标 "makefile" 会让它直接 make，报 "No targets specified and no makefile found"。
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tboox/tbox/archive/refs/tags/v1.8.1.tar.gz"

  # 源码校验和
  sha256: "48284c1f1f6e4e74ce1b4d2447c3141fdfdd3a20ef1cb30fc2f1021149227fdb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  # 注意：门禁的 _BUILD_SYSTEM_ALIASES 不识别 custom → 回退到按入口文件探测；
  # 这里取 custom 是刻意的（上游是自带 POSIX configure 的"自定义前端"，既非 autotools
  # 也非裸 Makefile），靠回退探测命中 configure 才能先 configure 再 make。
  # 上游自带 POSIX configure 脚本（xmake.sh 前端）生成 Makefile：既不是 autotools，
  # 也不是"裸 Makefile"。标 custom 可让门禁按入口文件探测（configure 优先于 Makefile），
  # 从而先跑 ./configure 再 make；标 makefile 会让 G0 直接 make 而报
  # "No targets specified and no makefile found"。
  system: custom

  # 配置选项列表
  configure_options:
    - "--plat=harmonyos"
    - "--arch=arm64"
    - "--toolchain=envs"
    - "--mode=release"
    - "--kind=static"
    - "--small=no"
    - "--micro=no"
    - "--float=y"
    - "--force_utf8=y"
    - "--charset=y"
    - "--hash=y"
    - "--xml=y"
    - "--object=y"
    - "--regex=y"
    - "--coroutine=y"
    - "--database=y"
    - "--exception=y"
    - "--zip=no"
    - "--demo=no"
    - "--prefix=/"

  # 编译依赖列表（格式: name/version）
  # database 模块的 sqlite3 后端（上游 shell 前端无包探测，由补丁 0003 接线）
  dependencies:
    - "sqlite3/3.49.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0002-src-tbox-platform-bsd-filelock.c.patch"
  - "0003-src-tbox-xmake.sh.patch"
  - "0001-src-demo-xmake.sh.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "1.8.1 的 configure 把平台识别为 harmonyos 并生成 TB_CONFIG_OS_HARMONYOS，但源码里 bsd/filelock.c 的 include 守卫仍写 TB_CONFIG_OS_HARMONY（唯一一处拼写不一致）→ 编译失败"
  - "上游 release v1.8.1 未上传 assets，官方只提供 tag 归档（codeload tar.gz 形态）"
  - "TBox 只需 POSIX configure + make，不需要 xmake 二进制、也不需要 autotools（--generator=gmake 已内置）"
  - "汇编内核符号被 prefix.S 的 function 宏无条件标注 .hidden，shared 版 libtbox.so 不导出 tb_context_make/jump，消费者无法链接 → 只能提供 static（上游默认 kind 也是 static）"
  - "本机 uname=HarmonyOS/aarch64，CI worker 使用同一 OHOS SDK clang（aarch64-unknown-linux-ohos），设备原生构建与 CI 构建同构"
  - "xmake.sh 的 --info=y 不生效（同一批 --float=y/--force_utf8=y/模块开关都生效，只有 info 不生成 TB_CONFIG_INFO_HAVE_VERSION）→ TB_CONFIG_INFO_HAVE_VERSION 未定义、tb_version() 在产物中不可用，故配方不下发 --info"
  - "shell 构建前端（xmake.sh）没有 xmake.lua 的 add_packages()/has_package() 包探测：--database=y 只会编出没有任何后端的 database 模块（TB_CONFIG_PACKAGE_HAVE_SQLITE3 永不置位、database/impl/sqlite3.c 不参与编译），必须由配方注入头/库路径并显式加源文件"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/ws/tmp/builds/tbox-1.8.1.orig
  source_work_dir: /storage/Users/currentUser/ws/tmp/builds/tbox-1.8.1.work
  source_orig_hash: 24a3135989f4b7f9
  source_work_hash: 9964330a2fc327ff
  generated_at: '2026-09-17T10:57:26'
  patches_count: 3

patch_classification:
  - file: 0001-src-demo-xmake.sh.patch
    type: portability
    platform_only: True
    guard: 'TB_SQLITE3_INCLUDEDIR (demo target)'
  - file: 0002-src-tbox-platform-bsd-filelock.c.patch
    type: portability
    platform_only: True
    guard: 'TB_CONFIG_OS_HARMONYOS'
  - file: 0003-src-tbox-xmake.sh.patch
    type: portability
    platform_only: True
    guard: 'TB_SQLITE3_INCLUDEDIR (tbox target)'
