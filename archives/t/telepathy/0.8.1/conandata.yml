# conandata.yml — telepathy-glib (Telepathy-GLib) 0.8.1
# 上游：freedesktop Telepathy 框架 GLib 绑定库，官方发布件 2009-10-15
sources:
  url: "https://telepathy.freedesktop.org/releases/telepathy-glib/telepathy-glib-0.8.1.tar.gz"
  sha256: "2f6fd08822be6d2d2fc6ff5472167d932b909fbe42c373daec3a3574d5f6da38"

patches:
  "0.8.1":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "config.guess（2009 旧版风格）增加 *:HarmonyOS:*:* → ${UNAME_MACHINE}-unknown-linux-ohos"
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "config.sub 接受 aarch64 CPU 与 linux-ohos OS（maybe_os 列表 + os 校验列表）"
      patch_type: "portability"
