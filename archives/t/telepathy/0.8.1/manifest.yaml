# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "2009 年版 config.guess（timestamp 2009-06-10）无 HarmonyOS 分支也无 aarch64：需按旧版风格（各分支自行 echo+exit）在 arm*:Linux 前插入 *:HarmonyOS:*:* 输出 ${UNAME_MACHINE}-unknown-linux-ohos"
- "同版 config.sub 需三处改动：CPU 列表加 aarch64、maybe_os 列表加 linux-ohos*、os 校验列表加 -linux-ohos*)（否则被 -linux* 分支改写为 linux-gnu-ohos）"
- "0.8.1 的代码生成脚本（tools/*.py）是 Python2 产物：print 语句、xrange、内建 cmp()、sets 模块、codecs.getwriter 包装文本流、字符串 encode 后写文件——OHOS 无 python2 时必须移植；lib2to3（py3.12 仍可用）+ 手工修 cmp/sets/codecs/encode 共 15 个文件"
- "glib-2.0.pc 声明 Requires: pcre2，而 pcre2 包只提供 libpcre2-8.pc；且 pcre2 包内 libpcre2-8.la 的 libdir 硬编码 '//lib'（构建期 prefix=/）——libtool 以 .la 的 libdir 为准查找库，必须把 .a/.la 复制到可写目录并改写 libdir，同时 pcre2.pc 的 prefix/libdir 指向该目录"
- "dbus 包 recipe 未声明 pkg_config_name，PkgConfigDeps 只生成 dbus.pc，而 configure.ac:151 直接 PKG_CHECK dbus-1——需生成 dbus-1.pc 别名（同 0.24.2 经验）"
- "configure.ac 用 pkg-config --variable=glib_genmarshal 取 glib 工具，conan 生成的 glib-2.0.pc 不含该自定义变量（取到空 → make Error 127）——make 命令行注入 GLIB_GENMARSHAL/GLIB_MKENUMS 绝对路径"
- "增量构建陷阱：早期失败留下的空壳 _gen/signals-marshal.c 与缓存了 -L//lib 的 libtelepathy-glib-internal.la 都不会被增量 make 重建，导致后续链接报符号未定义/找不到库——必须删除陈旧中间产物"
- "制品仓 glib/2.88.0 只有静态 binary（-o glib/*:shared=True 报 Missing prebuilt package）：libtelepathy-glib.so 会内嵌一份 glib，与消费者静态链接的 glib 形成双副本；glib ≥2.80 的 GType 索引随机化使跨副本的 boxed GType/GQuark 比较失效（GStrv 的 tp_asv_get_strv 返回 NULL、g_quark_to_string 反查 NULL）——上游测试与 test_package 需按此约束设计"
- "conan build() 内用 subprocess 跑上游脚本测试时，PATH/sys.executable 指向的解释器可能不可执行（inaccessible or not found，exit 127）——需逐候选实测可执行性后选用 python3"
- "libxslt/1.1.45 包不含 xsltproc 二进制（只有 xslt-config），而 0.8.1 的 configure.ac:164-167 无条件强制 xsltproc——本机由平台 /data/service/hnp 提供 libxslt 1.1.39 的 xsltproc"

test_results:
  type: manual
  total: 10
  passed: 8
  failed: 2
  note: "口径：上游入口逐项实际执行。tests/ 顶层 8/8 通过（7 个 C 用例 test-asv / test-availability-cmp / test-heap / test-internal-debug / test-intset / test-util / test-debug-domain + all-errors-documented.py），日志 reports/conan-create.log。tests/tools 2 个脚本用例在 conan create 内 exit 2（subprocess 解释器路径不可执行（已改为逐候选实测可执行性后选用 python3；conan 内仍 exit 2，属该环境解释器不可执行，源码树手工执行可复现通过/顺序差异结论））；手工在源码树执行 test-gobject-foo.sh 通过，test-glib-gtypes-generator.sh 生成内容与 expected 仅字典迭代顺序不同（25 处差异全为顺序，sort 后逐字节一致，语义等价，py2 哈希序 vs py3 插入序）。tests/dbus 39 例需运行中的 D-Bus 会话总线，本环境无 dbus-daemon（证据：test-account setup 断言 test->dbus != NULL 失败 exit 134）→ 平台限制如实声明。test_package（R34 + 鸿蒙 aarch64 ELF 校验）通过，日志 reports/conan-create.log。"

