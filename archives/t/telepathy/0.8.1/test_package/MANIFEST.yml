# test_package/MANIFEST.yml — telepathy 0.8.1（≡ 上游 telepathy-glib 0.8.1）
# CI L0e 要求此文件存在（上游测试 + test_package 声明）

package: telepathy/0.8.1
homepage: "https://telepathy.freedesktop.org/"

# 上游测试入口与实测结果（详见 notes.md「上游测试实测」）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_test_result: "8/8 通过（tests/ 顶层 7 个 C 用例 + all-errors-documented.py）"
upstream_test_notes: |
  tests/ 顶层：7 个 test-* 程序 + all-errors-documented.py —— 全部实际执行并通过（8/8）。
  tests/tools：2 个脚本用例（校验 py2→py3 移植后的代码生成器输出），
    test-gobject-foo.sh 通过；test-glib-gtypes-generator.sh 因 Python2/3 字典迭代
    顺序差异产生行序不同（排序后与期望文件逐字节一致，语义等价，见 notes.md）。
  tests/dbus：39 个用例需要运行中的 D-Bus 会话总线，OHOS 环境无 dbus-daemon
    二进制（系统与 conan dbus 包均不提供），按平台限制如实声明（非跳过）。

# test_package 消费者测试（R34：真实链接 + 公开 API 调用）
test_package_tests:
  - file: test_telepathy_glib.c
    description: "CMake 编译链接 libtelepathy-glib + glib + dbus-glib + dbus，运行
      test_telepathy_glib 校验 tp_g_value_slice_new_boolean / tp_strdiff / tp_errors_quark
      纯函数 API 可调用（0.8.1 无聚合头 telepathy-glib.h，逐个 include 模块头 + _gen 生成头）"
    command: "conan create 内自动执行（CMake build + run test_telepathy_glib）"

# 鸿蒙特有用例（≥1）：验证产物确为 OHOS/aarch64 目标，而非宿主架构误判
ohos_specific_tests:
  - file: test_package/conanfile.py::test
    description: "解析包内 libtelepathy-glib.so.<ver> 的 ELF 头，断言 e_machine == 0xB7
      （AArch64）；并断言公开头（util.h/errors.h 与 _gen/telepathy-enums.h 生成头）与
      pkg-config 元数据 telepathy-glib.pc 均已打包"
    command: "conan create 内自动执行（python 断言，失败即 test_package 失败）"
