software: tnef
version: "1.4.18"
status: built
build_date: "2026-09-20"
build_system: autotools (maintainer snapshot, bootstrap via tool_requires automake + autoreconf)
conan_ref: "tnef/1.4.18"

source:
  url: "https://deb.debian.org/debian/pool/main/t/tnef/tnef_1.4.18.orig.tar.gz"
  sha256: "fa56dd08649f51b173017911cae277dc4b2c98211721c2a60708bf1d28839922"
  tar_format: tar.gz

build:
  system: autotools
  build_command: "autoreconf -fi; CC=<clang> ./configure --build=aarch64-unknown-linux-ohos --prefix=<pkg>; make -j1; make check"
  dependencies: []
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "automake test harness（tests/cmdline 14 个 *.test + tests/files 15 个 *.test，共 29 个脚本；自包含样本与 baseline）"
  upstream_discovered: 29
  upstream_passed: 27
  upstream_failed: 0
  upstream_note: "`make check` 共执行 29 个 .test 脚本：tests/cmdline 12/12 PASS + tests/files 15/15 PASS = 27 PASS；另 2 个 use-path/interactive 属上游 XFAIL_TESTS（预期失败，不计入通过）"
  test_package_passed: 3
  test_package_failed: 0
  test_package_assertions: 3
  execution: "conan create rc=0 + 上游 29 脚本执行（27 PASS + 2 上游 XFAIL）+ 消费者 3/3（--version/--help/缺失输入优雅失败）"

test_passed: 30
test_failed: 0

patches_applied:
  - "0001-rindex-to-strrchr.patch（src/path.c 的 BSD rindex() → 标准 strrchr()；知识库 DRAFT-cconv-0.6.3-rindex-strrchr）"

knowledge_gained:
  - "CI 构建机只有 autoconf（/data/service/hnp）而无 automake/aclocal → 用 tool_requires(\"automake/1.18\")+libtool 注入 PATH 后 autoreconf 自举（abiword-plugin-* 先例；注意 automake 包的 aclocal 包装依赖 /data/service/hnp/bin/perl）"
  - "复用知识库 E114 / DRAFT-6507：autoconf 生成的 configure/config.status 用 umask 077 && mktemp -d，HMDFS setgid 目录下不可写 → 去掉 umask 077"
  - "复用知识库 DRAFT-cconv-0.6.3-rindex-strrchr：OHOS libc 不导出 BSD rindex → 用 strrchr"
  - "上游 cmdline 测试的 baseline 内嵌相对路径 ./../../src/tnef，仅 in-source 构建通过 → 手动在源码目录 configure/make，绕过 conan 的 out-of-source 布局"
  - "设备 uname 返回 HarmonyOS，configure 需显式 --build=aarch64-unknown-linux-ohos"
