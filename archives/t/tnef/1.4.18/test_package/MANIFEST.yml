# test_package/MANIFEST.yml
# tnef 1.4.18.

package: tnef/1.4.18
homepage: https://github.com/verdammelt/tnef

upstream_tests_exist: true
upstream_test_audit: "29 *.test scripts total: tests/cmdline (14 files: help, version, basic, body, debug, list, verbose, overwrite, directory, maxsize, mime-types, stdin = 12 in TESTS; use-path, interactive = 2 in XFAIL_TESTS) + tests/files (15 extraction tests); all ship their own test.tnef samples and *.baseline and are run with `make check`"
upstream_test_count: 29
upstream_test_passed: 27
upstream_test_xfail: 2
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: "help.test"
    description: "tnef --help output vs baseline"
  - name: "version.test"
    description: "tnef --version/-V output vs baseline"
  - name: "basic.test"
    description: "basic extraction of test.tnef"
  - name: "debug.test"
    description: "debug output"
  - name: "list.test"
    description: "list mode (-t)"
  - name: "verbose.test"
    description: "verbose mode"
  - name: "overwrite.test"
    description: "overwrite handling"
  - name: "directory.test"
    description: "extraction into -C DIR"
  - name: "maxsize.test"
    description: "-x/--maxsize limit"
  - name: "body.test"
    description: "body extraction"
  - name: "mime-types.test"
    description: "--list-with-mime-types"
  - name: "stdin.test"
    description: "reading from stdin (-f -)"
  - name: "tests/files/* (15 tests)"
    description: "extraction tests: one-file, rtf, two-files, missing-filenames, long-filename, data-before-name, MAPI_OBJECT, MAPI_ATTACH_DATA_OBJ, triples, body, multi-name-property, garbage-at-end, multi-value-attribute, unicode-mapi-attr, unicode-mapi-attr-name"

test_package_tests:
  - file: test_tnef.sh
    description: "runs the installed tnef: --version, --help, graceful failure on a missing input file"
    command: "sh test_tnef.sh"

test_files:
  - path: "test_package/test_tnef.sh"
    test_type: "R34"
    assertion_count: 3

test_package_test_count: 1
consumer_assertion_count: 3
assertion_count: 3
