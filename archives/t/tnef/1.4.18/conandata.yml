patches:
  - patch_file: "patches/0001-rindex-to-strrchr.patch"
    patch_description: "src/path.c uses the BSD legacy function rindex(); OHOS libc does not export rindex, so linking fails with 'undefined symbol: rindex'. Replace it with the equivalent standard strrchr() (same semantics). See knowledge base DRAFT-cconv-0.6.3-rindex-strrchr."
    patch_type: "portability"
