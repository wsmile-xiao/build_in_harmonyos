software: tnef
display: "tnef"
description: "解码 Microsoft TNEF（winmail.dat）附件并提取内嵌文件的命令行工具"
category: tool
homepage: "https://github.com/verdammelt/tnef"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Debian/上游发布包是 maintainer 快照，只有 configure.ac/Makefile.am 而没有生成的 configure；且 CI 构建机只有 autoconf 没有 automake/aclocal → `tool_requires(\"automake/1.18\")`+`libtool/2.5.4` 注入 PATH，`autoreconf -fi`（env=conanbuild）自举（对齐 abiword-plugin-* 先例）"
    - "设备 uname 返回 HarmonyOS，config.guess 猜不出三元组 → configure 显式传 `--build=aarch64-unknown-linux-ohos`"
    - "autoconf 生成的 configure/config.status 用 `umask 077 && mktemp -d` 建暂存目录，HMDFS 下为不可写的 `drwx--S---` → 去掉 `umask 077`（E114 / DRAFT-6507）"
    - "src/path.c 用 BSD 遗留函数 rindex()，OHOS libc 无该符号 → 复用知识库 DRAFT-cconv-0.6.3-rindex-strrchr：改用标准 strrchr()"
    - "上游测试假定 in-source 构建（baseline 内嵌 `./../../src/tnef`）→ build() 在源码目录手动 configure/make/make check，不用 conan 的 out-of-source Autotools"
    - "CLI 工具：装 bin/tnef + man1/tnef.1，并提供软件级 commands.json"

versions:
  "1.4.18":
    status: built
    build_date: "2026-09-20"
    conan_ref: "tnef/1.4.18"
