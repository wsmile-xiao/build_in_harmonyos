# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e compliance

package: task/2.6.2
homepage: "https://taskwarrior.org/"

# Upstream test command (CMake-based, tests excluded from default build)
upstream_check_command: "ctest -N"

# conanfile.py build() method does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (Taskwarrior uses a shell-based test suite, not ctest)
upstream_tests:
  - file: "test/*.t"
    source: "task-2.6.2/test/*.t"
    description: "Taskwarrior shell-based test suite (not run in conan build)"
    command: "./test/run_all"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: "conanfile.py"
    description: "Run task --version, add, list, done workflow"
    command: "conan test"

# Approximate assertion count
assertion_count: 4
