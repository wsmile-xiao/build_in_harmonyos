# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tsl-hat-trie/0.6.0
homepage: "https://github.com/Tessil/hat-trie"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游官方测试入口: tests/ 目录 CMake 构建 tsl_hat_trie_tests (Boost.Test)，见 README "To run the tests..."
upstream_check_command: "cd tests && mkdir build && cd build && cmake .. && cmake --build . && ./tsl_hat_trie_tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（header-only 库，无构建期测试；测试需依赖 Boost.Test）
upstream_tests:
  - file: tests/trie_map_tests.cpp
    source: hat-trie-0.6.0/tests/trie_map_tests.cpp
    description: "htrie_map 上游测试套件 (Boost.Test)"
    command: "./tsl_hat_trie_tests"
  - file: tests/trie_set_tests.cpp
    source: hat-trie-0.6.0/tests/trie_set_tests.cpp
    description: "htrie_set 上游测试套件 (Boost.Test)"
    command: "./tsl_hat_trie_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：htrie_map insert/at/equal_prefix_range + htrie_set insert/count"
    command: "./test_tsl_hat_trie"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8