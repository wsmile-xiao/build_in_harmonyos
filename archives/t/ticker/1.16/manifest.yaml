status: built
build_date: "2026-10-13"
build_system: autotools
conan_ref: "ticker/1.16"

source:
  url: "https://deb.debian.org/debian/pool/main/t/ticker/ticker_1.16.tar.xz"
  sha256: "af88c0a7b6d56ee7d129b5c8ff98831ff2cd10080b131411cad89cdb09b23c69"
  tar_format: tar.xz

build:
  system: autotools
  build_command: "sh configure --prefix=<package> && make -j1（源码内构建：上游 Makefile 无 VPATH）"
  configure_options:
    - "--prefix=$PACKAGE_FOLDER"
  dependencies:
    - slang/2.3.3
  cc: clang

test_results:
  target: "OpenHarmony aarch64（待 HMBS 真机预检回填）"
