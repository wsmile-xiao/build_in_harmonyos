  upstream_passed: 0
  upstream_failed: 0
  test_package_passed: 0
  test_package_failed: 0
  test_package_assertions: 5
  harmonyos_specific_tests: 1
  execution: "待 HMBS 真机预检回填（首轮工作树，尚未执行 conan create）"

test_passed: 0
test_failed: 0

patches_applied: []

knowledge_gained:
  - "ticker 1.16 是 Debian native 包（3.0 native），上游作者 git 仅到 1.10，1.11-1.16 为 Debian QA 上传，官方源即 Debian archive"
  - "configure 硬依赖 -lslang 与 slang.h（AC_CHECK_LIB 失败即报错），由仓内 slang/2.3.3 提供"
  - "2002 年 configure 无 VPATH 支持，必须源码内构建；显式 sh configure 规避 HMDFS exec 位不可靠"
  - "ticker -h 等帮助/错误路径在 Parse_Params 内退出，不触终端，headless 可测；滚动主循环需终端，不纳入自动化"
