# test_package/MANIFEST.yml — ticker 1.16

package: ticker/1.16
homepage: "https://joeyh.name/code/ticker/"

# 上游测试命令（Debian autopkgtest 声明）
upstream_check_command: "ticker -h"

# conanfile.py build() 方法中已集成上游测试（_run_upstream_tests）
upstream_test_in_build: true
upstream_test_command: "./ticker -h (build() 内执行，LD_LIBRARY_PATH 指向 conan slang 产物，断言用法横幅真实输出）"
upstream_tests_exist: true
upstream_test_audit: "ticker_1.16.tar.xz 共 17 个顶层条目：CHANGES、INSTALL、LICENSE.md、Makefile、README.md、autoconf/、configure、configure.ac、debian/、sysinfo-ticker、ticker.1、ticker.c、ticker.spec。无 test/ 或 tests/ 目录；Makefile 目标仅 all/ticker/demo/distclean/clean/install/configure/config.status/makeinfo，无 check/test 目标。唯一的官方测试声明是 debian/tests/control：Test-Command: ticker -h（Restrictions: superficial）。因此上游测试总数为 1，口径 auto（单一 autopkgtest 命令）。"
upstream_test_total: 1
upstream_test_count_method: auto
upstream_tests:
  - file: debian/tests/control
    source: ticker_1.16/debian/tests/control
    description: "Debian autopkgtest：ticker -h 必须退出 0（superficial 级别）"
    command: "ticker -h"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_ticker.sh
    description: "执行交付产物 bin/ticker（AArch64 原生或经 qemu-aarch64）：-h 退出 0 且输出用法横幅（与上游 autopkgtest 同命令）、--help 长选项同理、无消息参数时输出 Must specify a message（负向路径；上游 Usage() 在此路径仍退出 0，故断言文本而非退出码）"
    command: 'bash test_ticker.sh <package>/bin/ticker [<qemu-aarch64>]'
  - file: test_ticker_ohos.sh
    category: "harmonyos-specific"
    description: "鸿蒙特有验证（纯文件检查，无需终端）：readelf 确认交付产物为 AArch64 ELF，且 NEEDED 链接 conan 提供的 libslang（依赖经 Conan 链解决，而非宿主库）"
    command: 'bash test_ticker_ohos.sh <package>/bin/ticker'

test_files:
  - path: "test_package/test_ticker.sh"
    test_type: "R34"
    assertion_count: 3
  - path: "test_package/test_ticker_ohos.sh"
    test_type: "R34 / harmonyos-specific"
    assertion_count: 2

harmonyos_specific_test_count: 1
test_package_test_count: 2
assertion_count: 5
