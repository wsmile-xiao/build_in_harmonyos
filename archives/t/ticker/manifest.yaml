software: ticker
display: "ticker"
description: "可配置的文本滚动器：在屏幕顶行或底行滚动显示消息，支持 SysV 共享内存通信"
category: utility
homepage: "https://joeyh.name/code/ticker/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "硬依赖 S-Lang（configure 找不到 -lslang 即报错），由仓内 slang/2.3.3 提供"
    - "2002 年 configure 无 VPATH，必须源码内构建；显式 sh configure 规避 HMDFS exec 位不可靠"
    - "-Werror=implicit-function-declaration 防 musl 隐式声明截断 64 位指针（tal/1.9 同类事故）"
    - "帮助/错误路径在 Parse_Params 内退出、不触终端，headless 可测；滚动主循环需真实终端，未纳入自动化"
  common_dependencies:
    - slang

versions:
  "1.16":
    status: built
    build_date: "2026-10-13"
    conan_ref: "ticker/1.16"
