# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: toml11/4.4.0
homepage: "https://github.com/ToruNiina/toml11"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# toml11 uses doctest framework via git submodules (not included in tarball)
upstream_tests:
  - file: tests/test_parse.cpp
    source: toml11-4.4.0/tests/test_parse.cpp
    description: "TOML parsing tests (doctest-based, requires submodule)"
    command: "./test_parse"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/main.cpp
    description: "Consumer smoke test: parse TOML, access strings/integers/arrays/nested tables"
    command: "./test_toml11"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
