# 软件级 manifest — tachyon
# 遵循 ARCHIVE-SPEC v2.0

software: tachyon
display: "Tachyon"
description: "并行光线追踪渲染器 — 读场景描述文件渲染出 PNG/Targa/BMP 等格式图像，支持多线程"
category: graphics
homepage: "https://jedi.ks.uiuc.edu/~johns/raytracer/"
license: BSD-3-Clause
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "手写 Makefile，按「架构目标」分派（make <target> 再递归调自身并带一整套 CFLAGS/LIBS）；原始 tarball 里**没有 aarch64 目标**，由 sage/passagemath 的 Make-arch 补丁补上 linux-arm / linux-arm-thr，本 recipe 沿用同一份"
    - "linux-arm-thr 目标不设 CC/AR/RANLIB，会落到 make 内置默认 `cc`（设备上没有该名字），必须在命令行显式给绝对路径"
    - "链接之后紧跟 `${STRIP} <binary>`（unix/Makefile:169）会把链接器的自签改废 → package() 必须重签，不能沿用「靠链接器自签」的默认路径"
    - "PNG 支持是**静默可选**的：`-format PNG` 被 `#if defined(USEPNG)` 包着，libpng 没接上时不报错、只打印一行 Unknown/Unsupported Image Format 然后回退成 Targa。故 test_package 断言产物真是 PNG 且 IHDR 尺寸正确"
    - "只 make 架构目标（libtachyon.a + libmgf + tachyon），不碰 OptiX/OpenGL demo"
  common_dependencies:
    - libpng

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.99.5":
    status: built
    build_date: "2026-08-16"
    notes: >-
      passagemath 系列（passagemath-tachyon）适配鸿蒙 PC 所需的 C 底座；wheel 把
      bin/tachyon 塞进 sage_wheels/bin/，sage.interfaces.tachyon 起子进程调它。
      源码 tarball 与 sage 用的 tachyon-0.99.5.p0.tar.gz 逐字节相同（sha256 已核对）。
