software: tofrodos
display: "Tofrodos"
description: "DOS/Unix 文本格式转换工具，提供 fromdos 和 todos 命令"
category: text
homepage: "https://packages.debian.org/sid/tofrodos"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "tofrodos 使用简单 Makefile，不是标准 autotools 项目"
    - "需设置 CC=clang（系统无 gcc）"
    - "Makefile 不支持 DESTDIR，需手动安装到 staging 目录"
    - "HMDFS 上 ln -sf 会卡住，必须使用 rm -f && ln -s"
  common_dependencies: []

versions:
