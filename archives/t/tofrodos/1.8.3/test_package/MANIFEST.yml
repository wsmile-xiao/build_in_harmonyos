# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: tofrodos/1.8.3
homepage: "https://www.thefreecountry.com/tofrodos/"

# Upstream test command (simple Makefile, no test target)
upstream_check_command: "make -C src all"

# Upstream tests not run in build (simple Makefile, no test suite)
upstream_test_in_build: false

# test_package consumer-side tests
test_package_tests:
  - file: conanfile.py
    description: "Verify fromdos/todos binaries execute and convert CRLF→LF"

# Test assertion count
assertion_count: 2
