software: tofrodos
# 版本级 manifest
# 文件位置: archives/t/tofrodos/2.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.0.0"
status: published
build_date: "2026-06-10"

source:
  url: "https://github.com/ChristopherHeng/tofrodos/archive/refs/tags/2.0.0.tar.gz"
  sha256: "9bac37ec72323fa0a98218e457c31d93c8fad5ba2e4f953e5c82bdcbc0aafaab"
  tar_format: tar.gz

build:
  system: makefile
  build_system: makefile
  configure_options:
    - "make -f makefile.gcc CC=clang LD=clang CDEBUG=-fPIC -O2"
  make_command: "make -f makefile.gcc CC=clang LD=clang CDEBUG=-fPIC -O2 LDEBUG= FROMDOS=fromdos all"
  install_command: "手动 install 到 DESTDIR=$TEST_PREFIX/$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

binaries:
  - fromdos
  - todos

patches_applied: []

knowledge_gained:
  - "tofrodos 使用自定义 makefile.gcc，构建系统为 Makefile 而非 autotools"
  - "使用 make -f makefile.gcc CC=clang LD=clang 可成功编译"
  - "软链接创建需用 rm -f && ln -s 而非 ln -sf（HMDFS 限制）"
  - "源码 tests/crlf/ 目录 CRLF 行尾在解压时被去除，需用 .orig 原始数据做测试参考"
