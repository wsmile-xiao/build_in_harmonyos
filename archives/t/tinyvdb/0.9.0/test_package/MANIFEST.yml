# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tinyvdb/0.9.0
homepage: "https://github.com/syoyo/tinyvdb"

# 上游测试命令 (CMakeLists.txt 条件注册 15 个 add_test；上游 CI 不跑 ctest，
# 本配方在 build() 中实跑可用的 C 测试目标)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -E test_corpus_roundtrip && test_corpus_roundtrip(语料缺失子项单独核算)"

# 上游静态注册 15 个 add_test 目标；test_bridge_ops_py 受 Python 选项条件控制
upstream_tests:
  - file: tests/test_ops.c
    source: tinyvdb-0.9.0/tests
    description: "ops 冒烟: morphology/CSG/filters/gradient 等 (自足, 无外部资产)"
    command: "./test_ops"
  - file: tests/test_sparse_tree.c
    source: tinyvdb-0.9.0/tests
    description: "sparse op bridge 冒烟 (加载 sphere SDF 语料)"
    command: "./test_sparse_tree <source_dir>/sphere.vdb"
  - file: tests/test_grid_from_sparse.c
    source: tinyvdb-0.9.0/tests
    description: "sparse_grid 提取与重建 (sphere SDF 语料)"
    command: "./test_grid_from_sparse <source_dir>/sphere.vdb"
  - file: tests/test_simd.c
    source: tinyvdb-0.9.0/tests
    description: "SIMD 路径测试 (aarch64 走 scalar fallback)"
    command: "./test_simd"
  - file: tests/test_fast_sweeping.c
    source: tinyvdb-0.9.0/tests
    description: "fast sweeping SDF 求解 (自足)"
    command: "./test_fast_sweeping"
  - file: tests/test_vec3_extend.c
    source: tinyvdb-0.9.0/tests
    description: "extend_from_sparse (sphere SDF 语料)"
    command: "./test_vec3_extend <source_dir>/sphere.vdb"
  - file: tests/test_dense_d.c
    source: tinyvdb-0.9.0/tests
    description: "double 精度 dense grid (自足)"
    command: "./test_dense_d"
  - file: tests/test_autograd.c
    source: tinyvdb-0.9.0/tests
    description: "autograd 反传 (自足)"
    command: "./test_autograd"
  - file: tests/test_nanovdb_transform.c
    source: tinyvdb-0.9.0/tests
    description: "NanoVDB transform (自足)"
    command: "./test_nanovdb_transform"
  - file: tests/test_scalar_writer_audit.c
    source: tinyvdb-0.9.0/tests
    description: "typed scalar writer 审计 (以 sphere 语料为布局模板)"
    command: "./test_scalar_writer_audit <source_dir>/sphere.vdb <build_dir>"
  - file: tests/test_corpus_roundtrip.c
    source: tinyvdb-0.9.0/tests
    description: "6 文件语料读写往返 (bunny/cube/smoke.vdb 上游未分发, 部分执行)"
    command: "./test_corpus_roundtrip <source_dir> <build_dir>"
  - file: tests/test_reference_roundtrip.c
    source: tinyvdb-0.9.0/tests
    description: "OpenVDB 参考语料往返 (语料缺失时官方逻辑优雅跳过 exit 0)"
    command: "./test_reference_roundtrip <source_dir> <build_dir>"
  - file: tests/test_gaussian_backward.c
    source: tinyvdb-0.9.0/tests
    description: "高斯 splat 反向传播梯度校验 (自足)"
    command: "./test_gaussian_backward"
  - file: tests/test_nanovdb_reference.c
    source: tinyvdb-0.9.0/tests
    description: "libopenvdb 生成 .nvdb 参考校验 (语料缺失时官方逻辑优雅跳过 exit 0)"
    command: "./test_nanovdb_reference <source_dir>"
  - file: tests/test_bridge_ops.py
    source: tinyvdb-0.9.0/tests
    description: "Python 桥接操作测试；仅在 TINYVDB_BUILD_PYTHON=ON 且找到 Python3 时注册"
    command: "python3 tests/test_bridge_ops.py (本配方 TINYVDB_BUILD_PYTHON=OFF，未注册/未执行)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tinyvdb_ops.c
    description: "消费者测试: 真实调用 packaged 库 API (dense grid 构建/volume/surface_area/dilate/erode/csg_union 并断言数值)"
    command: "./test_tinyvdb_ops"

# 测试断言总数 (近似值, 用于质量评估): tests/*.c 中 EXPECT/EXPECT_NEAR 静态计数
assertion_count: 116
