# 软件级 manifest — twclock
software: twclock
display: "twclock"
description: "Ham-radio world clock with beep/CW ID (X11/Motif) by WA0EIR"
category: hamradio
homepage: "https://packages.debian.org/sid/twclock"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Written against X Toolkit (Xt) + Motif (libXm); depends on the locally adapted motif/2.3.8 (libXm.so.4)."
    - "Requires libxt, libx11, pulseaudio, xorgproto as direct dependencies; libxpm omitted due to libX11 track conflict with motif."
    - "VPATH-capable automake build; out-of-source build used."
    - "No X server on OHOS: GUI cannot be exercised; the headless display error is the expected behavior, asserted only where the binary can really be executed (native target); foreign-arch hosts report SKIP."
    - "E011: configure umask 077->022 and /bin/sh shebang/SHELL retarget to the OHOS shell."
    - "PKG_CHECK_MODULES(APPDEFS, xt) satisfied via libxt/1.3.1 pkg_config_name='xt'."
    - "ac_cv_func_malloc_0_nonnull=yes pinned for cross-compile malloc test."
  common_dependencies:
    - motif
    - libxt
    - libx11
    - pulseaudio
    - xorgproto

versions:
  "3.5":
    status: built
    build_date: "2026-09-27"
    conan_ref: "twclock/3.5"
    note: >-
      First OHOS adaptation. VPATH autotools build; no source patches.
      All dependency *recipes* exist in the registry (L0i verified), but the
      libxext/6.4.0.1 binary for the libx11/1.8.13 track is not published yet,
      so CI has to rebuild it from source - see archives/t/twclock/3.5/notes.md.