# test_package/MANIFEST.yml — twclock 3.5
# 上游官方测试声明文件 (CI L0e 强制要求). 详见 docs/TEST_QUALITY_SPEC.md 与 notes.md.
package: twclock/3.5
homepage: "https://packages.debian.org/sid/twclock"

# ── R51 上游测试清点（证据见 notes.md "R51 上游测试清点"） ──
# twclock 3.5 不提供正式测试套件：
#   * `find . -iname "*test*"`      -> 0 个文件
#   * `Makefile.in` 只有 1 个测试相关目标 `check:`（= `check-recursive`，空 pass-through）
#   * 无 `test:` 目标（`make test` 报 "No rule to make target 'test'"）
#   * 无测试源文件
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游可运行的测试目标（唯一一个；`check-am: all-am`，不执行任何实质测试）
upstream_tests:
  - target: "check"
    file: "Makefile.in:738"
    command: "check-recursive (empty pass-through)"
    description: "上游唯一的 check 目标：空 pass-through。build() 内以 `timeout 300 make check` 原样执行并捕获原始输出（见 notes.md 原始日志），未删除、未伪造。"

# test_package 中自带的消费者测试（R34 实质调用被测二进制）
test_package_tests:
  - file: test_twclock.sh
    description: >
      执行打包后的 bin/twclock：(a) 存在且可执行；(b) readelf -d 断言 ELF DT_NEEDED
      含 libXm.so.4 / libXt.so.6 / libX11.so.6 / libpulse-simple.so.0 / libpulse.so.0
      （证明真正链接打包的 Motif/X11/PulseAudio 链）；(c) DISPLAY 取消下
      `timeout 30 twclock` 不得挂起（timeout=FAIL），须打印真实 display 错误；
      (d) 验证打包产物：app-defaults / man page / desktop entry / icon 存在；
      (e) 运行期**递归**闭包：从 bin/twclock 的 DT_NEEDED 出发逐层跟随 DT_NEEDED，
      每个 soname 都必须能从 conanrun 注入的 LD_LIBRARY_PATH 解析到
      （实测 12 个库，无需执行二进制，任意宿主架构均可验证）。
      (e) 带**非真空守卫**：PASS 需正向证据支撑 —— 遍历至少解析到 1 个库，
      且必须覆盖 (b) 断言的 5 个直接 soname；空走一遍判 VACUOUS FAIL，
      汇总行同步输出 TRANSITIVE_CLOSURE=vacuous（详见 notes.md）。
      (c) 的加载器失败以 (e) 的闭包结果为判据：闭包不完整 => FAIL（本包交付缺陷），
      闭包完整 => SKIP / NOT VERIFIED（平台/worker 条件，不冒充证据）。
    command: "sh test_twclock.sh <bin_dir> /data/service/hnp/bin/llvm-readelf"
  - file: conanfile.py
    description: "消费者测试入口：test() 调用 test_twclock.sh 执行被测包二进制"
    command: "conan create 内 test() 阶段运行"

# 测试断言总数：12（(a) 1 + (b) 5 + (c) 1 + (d) 4 + (e) 1）
# 12 是**上限**；(e) 的递归闭包遍历不额外计数。
#
# 两种实测取值（均为真实结果，不是目标值）：
#   * aarch64 OHOS 原生 worker，加载器可解析打包库
#     （实测 CI #63074，worker OpenHarmonyPCDeveloper-CI-005）：
#       assertions=12 failures=0 skipped=0
#   * 加载器拒绝加载打包库，但递归闭包完整
#     （实测 CI #63039，worker OpenHarmonyPCDeveloper-CI-036）：
#       assertions=11 failures=0 skipped=1  —— (c) 如实记 NOT VERIFIED
#   * 异构宿主（x86_64）无完整 OHOS sysroot：assertions=11 failures=0 skipped=1
#
# 反例（负向对照，证明该断言有鉴别力而非空壳）：
#   从 LD_LIBRARY_PATH 去掉 <pulseaudio>/p/lib/pulseaudio 后，
#   libpulsecommon-17.0.so 不可解析 => (c) 与 (e) 双双 FAIL，exit 1。
assertion_count: 12