# 版本级 manifest — twclock 3.5
version: "3.5"
software: twclock
status: built
build_date: "2026-09-27"
conan_ref: "twclock/3.5"
build_system: autotools

source:
  url: "https://ftp.debian.org/debian/pool/main/t/twclock/twclock_3.5.orig.tar.gz"
  sha256: "382ac6671c8315bb3cbddc6bad1ea421e80dc2aa22d0c139cb142a073a25fee2"
  tar_format: tar.gz
  upstream_version: "3.5"
  version_mapping: "Conan twclock/3.5 builds upstream twclock 3.5 (PACKAGE_STRING \"TWCLOCK 3.5\")."

build:
  system: autotools
  in_source: false
  configure_options:
    - "--x-includes=<libx11>/include"
    - "--x-libraries=<libx11>/lib"
    - "--with-motif-includes=<motif>/include"
    - "--with-motif-libraries=<motif>/lib"
    - "--with-appdefaultdir=${prefix}/share/X11/app-defaults"
    - "ac_cv_func_malloc_0_nonnull=yes"
    - "--prefix=/"
  make_target: "all"
  dependencies:
    - "motif/2.3.8"
    - "libxt/1.3.1"
    - "libx11/1.8.13"
    - "pulseaudio/17.0"
    - "xorgproto/2025.1"
  cc: clang
  cxx: clang++

patches_applied: []

validation:
  local:
    - "python3 -m py_compile passed for conanfile.py and test_package/conanfile.py"
    - "sh -n passed for test_package/test_twclock.sh"
    - "conan create with ohos-aarch64-wsl (host+build) -> assertions=11 failures=0 skipped=1 on x86_64 host ((c) headless run is SKIP: foreign-arch host without a complete OHOS sysroot)"
    - "packaged bin/twclock present; ELF DT_NEEDED libXm.so.4/libXt.so.6/libX11.so.6/libpulse-simple.so.0/libpulse.so.0"
    - "runtime closure: transitive DT_NEEDED walk resolved 12 libraries from the conanrun LD_LIBRARY_PATH, 5/5 direct sonames covered (host-independent check)"
    - "(e) non-vacuity guard verified both ways: 0-library walk => FAIL: VACUOUS / TRANSITIVE_CLOSURE=vacuous; deep libX11.so.6 or direct libpulse.so.0 removed => FAIL: incomplete; full closure => PASS"
    - "packaged share/X11/app-defaults/Twclock, share/man/man1/twclock.1, share/applications/twclock.desktop, share/pixmaps/twclock.png present"
    - "L1e destructive reverse check: with bin/ moved away the consumer test fails (exit 1) -> test genuinely depends on the package"
  pending:
    - "CI PR verification (L0/L1/JC/KC/L2/L4/L5 gates) on the aarch64 OHOS worker, where (c) headless runs natively -> assertions=12 failures=0 skipped=0"

knowledge_gained:
  - "twclock 3.5 is a ham-radio world clock written against Xt + Motif; needs the locally adapted motif/2.3.8 (libXm.so.4)."
  - "AC_FIND_MOTIF is satisfied with --with-motif-includes/--with-motif-libraries override knobs."
  - "PKG_CHECK_MODULES(APPDEFS, xt) requires libxt/1.3.1 with pkg_config_name='xt'."
  - "Cross-compile malloc test needs ac_cv_func_malloc_0_nonnull=yes to avoid rpl_malloc substitution."
  - "Headless: XtVaOpenApplication fails -> prints 'Can't open display' and exits non-zero; this is the expected behavior. The consumer test asserts it only where the binary can really be executed (native target); a foreign-arch host without a complete sysroot reports SKIP, never a hollow PASS."
  - "make install is not the packaging driver on OHOS/HMDFS (install-sh not executable); explicit copy() staging with verification used instead."
  - "An assertion phrased as 'nothing is missing' is vacuous when nothing was inspected: the runtime-closure check must also prove it resolved >=1 library and covered the 5 direct sonames, else it passes on an empty walk."