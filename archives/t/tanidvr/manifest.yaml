# 软件级 manifest（ARCHIVE-SPEC v2.0）
software: tanidvr
display: "TaniDVR"
description: "Dahua DVR/IP camera command-line clients for the DVR-IP protocol (TCP 37777)"
category: utility
homepage: "https://tanidvr.sourceforge.net/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 tarball 自带 configure，AutotoolsToolchain 注入 OHOS clang 的 CC/CXX/CFLAGS，编译侧零补丁（patches/0001 只去掉 configure 的 umask 077，不改编译语义）"
    - "上游 configure.ac 含 AC_PROG_CXX 但项目是纯 C；靠 tools.build:compiler_executables[cpp] 让探测走交叉编译器"
    - "产物为 aarch64 OHOS PIE，动态链接 OHOS musl（解释器为 /lib/ld-musl-aarch64.so.1 或 /lib/ld-linux-aarch64.so.1 之一，DT_NEEDED 恰为 libc.so）"
  common_dependencies: []

versions:
  "1.4.1":
    status: built
    build_date: "2026-10-01"
    conan_ref: "tanidvr/1.4.1"
