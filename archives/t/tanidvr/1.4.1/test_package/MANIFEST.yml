# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: tanidvr/1.4.1
homepage: "https://tanidvr.sourceforge.net/"

# 上游测试命令（用于 make -n check 实证）
upstream_check_command: "make -n check"   # 无 check_PROGRAMS，输出 Nothing to be done for 'check'（见 upstream_test_evidence）

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

upstream_test_evidence: >-
  上游 tarball 没有任何测试（如实申报 0 个用例）：顶层 Makefile.am 只有
  "SUBDIRS = src"，src/Makefile.am 只有 "bin_PROGRAMS = tanidvr dhav2mkv"，
  没有 check_PROGRAMS / TESTS；tarball 共 57 个条目 / 53 个文件（tar tjf | wc -l 实测）
  逐条核对，无 tests/ 或 test/ 目录、无 .sh/.py 测试脚本；
  `make -n check` 输出 "Nothing to be done for 'check'"。

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_tanidvr.py
    description: "tanidvr 命令行契约：-h 帮助/版本/长选项/GPL 声明、缺 -m 与缺 -t 报错、未知长选项、越界 -m 取值（14 项断言）"
    command: "python3 test_tanidvr.py --tanidvr <tanidvr 命令前缀>"
  - file: test_dhav2mkv.py
    description: "dhav2mkv 端到端转换：按上游 src/mctools.c 帧格式合成 DHAV 录像流 → Matroska，逐字节校验 EBML magic/matroska DocType/V_MPEG4-ISO-AVC/帧宽 640/帧高 480/三帧 H.264 负载/cluster 数=3、stdin-stdout 与文件模式字节一致；另覆盖 -r 越界、-i 缺参、输入文件缺失、垃圾流四类错误路径（25 项断言）"
    command: "python3 test_dhav2mkv.py --dhav2mkv <命令前缀> --tanidvr <命令前缀>"
  - file: test_ohos_platform.py
    description: "鸿蒙特有：aarch64 OHOS PIE ELF（EM_AARCH64/ET_DYN/ELF64）、musl 解释器（/lib/ld-musl-aarch64.so.1 或 /lib/ld-linux-aarch64.so.1，且显式排除 glibc 的 ld-linux-aarch64.so.2）、解析 PT_DYNAMIC/DT_STRTAB 断言 DT_NEEDED 恰为 OHOS 的 libc.so（并确认不含 glibc 专有 soname libc.so.6/libpthread.so/libdl.so）、两个二进制在 OHOS 用户态实际执行并自报版本、重复转换字节一致（25 项断言）"
    command: "python3 test_ohos_platform.py --tanidvr <命令前缀> --dhav2mkv <命令前缀>"

# 测试断言总数（本地 W3 conan create 实测：三个脚本各自打印 passed 计数）
assertion_count: 64

# 鸿蒙特有测试用例数（积分赛要求 N>=1）
harmonyos_specific_tests: 1
harmonyos_specific_assertions: 25
harmonyos_specific_files:
  - test_ohos_platform.py
