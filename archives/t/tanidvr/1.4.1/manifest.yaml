version: "1.4.1"
software: tanidvr
status: built
build_date: "2026-10-01"
build_system: autotools
conan_ref: "tanidvr/1.4.1"

source:
  url: "https://downloads.sourceforge.net/project/tanidvr/TaniDVR/tanidvr-1.4.1/tanidvr-1.4.1.tar.bz2"
  mirror_url: "https://distfiles.alpinelinux.org/distfiles/edge/tanidvr-1.4.1.tar.bz2"
  sha256: "149b075a60625ca23a96d71b46db6ed42e1b10d08366d6891f569c558de33c47"
  md5: "b0acaaa156560676d864d2826f5fcbf8"
  tar_format: tar.bz2
  note: >-
    上游官方源在 SourceForge，其下载 CDN（downloads.sourceforge.net 及全部
    *.dl.sourceforge.net 镜像）在本次适配网络不可达（HTTP 522 / DNS 解析失败，
    共实测 24 个镜像主机）。因此 conandata.yml 用 URL 列表登记「官方源优先 +
    Alpine Linux 官方 distfiles 镜像兜底」，两者字节完全相同
    （cmp 逐字节一致；md5 b0acaaa156560676d864d2826f5fcbf8 与 Ubuntu/Debian 源索引
    公布的 tanidvr_1.4.1.orig.tar.bz2 一致），故共用同一 sha256。

build:
  system: "GNU Autotools（tarball 自带 2015 年生成的 configure + config/ 辅助脚本，无需 bootstrap）"
  configure_options:
    - "--prefix=<package_folder>（AutotoolsToolchain 默认注入）"
    - "CC/CXX/CFLAGS/CXXFLAGS 全部来自 tools.build:compiler_executables（OHOS aarch64 clang 15），configure 不落到构建机 gcc"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-configure-umask-hmdfs-scratch-dir.patch"
    target: "configure"
    reason: >-
      CI #66193（worker OpenHarmonyPCDeveloper-CI-033，HMDFS）实测失败：
      `./config.status: line 616: ./confkOBMlg/subs1.awk: Permission denied`。
      根因见知识库 E011 / E114 / E129 / E136：HMDFS 对新建目录强制 setgid，
      `umask 077 && mktemp -d "./confXXXXXX"` 得到 drwx--S---（2700），
      连属主都无法在里面建文件，config.status 写 subs1.awk 必然失败。
      补丁把 configure 里两处 `umask 077` 去掉（改用默认 umask）；
      config.status 由 configure 生成，因此同一个补丁同时修好两处。
      无平台宏（PF5 口径），无行为语义改变（临时目录仍是 mktemp 随机名）。
    verified_locally: >-
      本地 W3（ext4）conan create rc=0；生成目录里的 config.status 实测
      `umask 077` 命中数 = 0（打补丁前为 2），64 项断言全绿。
      HMDFS 上的实际效果由 CI #66193 复验（本机无法模拟 setgid 语义）。

test_passed: 3
test_failed: 0

test_results:
  upstream_suite: none
  upstream_note: >-
    上游没有任何测试（实测清点）：顶层 Makefile.am 仅 "SUBDIRS = src"，src/Makefile.am
    仅 "bin_PROGRAMS = tanidvr dhav2mkv"，无 check_PROGRAMS/TESTS；tarball 共 57 个条目 /
    53 个文件逐条核对，无 tests/ 或 test/ 目录、无测试脚本。如实申报 0 个上游用例。
  test_package_registered: 3
  test_package_executed: 3
  assertion_count: 64
  harmonyos_specific_assertions: 25
  note: >-
    消费者用例全部执行交付物本身（不是空壳）：tanidvr 的命令行契约 14 项断言、
    dhav2mkv 按上游 src/mctools.c 帧格式合成 DHAV 录像流做端到端转换并逐字节校验
    Matroska 输出（EBML magic、matroska DocType、V_MPEG4/ISO/AVC、PixelWidth=640、
    PixelHeight=480、三帧 H.264 负载、cluster 数=3、stdin/stdout 与文件模式字节一致）
    共 25 项断言，以及鸿蒙特有的 25 项断言（aarch64 OHOS PIE ELF、musl 解释器为
    OHOS 并存的两个 loader 之一（/lib/ld-musl-aarch64.so.1 或 /lib/ld-linux-aarch64.so.1，
    并显式排除 glibc 的 ld-linux-aarch64.so.2）、无 glibc 专有 DT_NEEDED、两个二进制
    在 OHOS 用户态实际执行、重复转换字节一致）。CI L1e 破坏性反向验证已确认用例真实依赖交付包。

knowledge_gained:
  - "上游 configure.ac 里有 **AC_PROG_CXX**，但整个项目是纯 C（src/Makefile.am 只有 bin_PROGRAMS，没有 .cpp）。conan 侧只要让 AutotoolsToolchain 正常拿到 tools.build:compiler_executables[cpp]，configure 的 C++ 探测就会用 OHOS clang++ 而不是构建机 g++；不要在 generate()/build() 里裸读 ${CXX}（R33）。"
  - "**HMDFS setgid + umask 077 是所有 autotools 包在 OHOS 上的头号坑（E011/E114/E129/E136）**：本包本地（ext4）全绿但 CI #66193 挂在 `./confXXXXXX/subs1.awk: Permission denied` —— 根因是 configure/config.status 用 `umask 077 && mktemp -d` 建临时目录，HMDFS 强制 setgid 后该目录变成 drwx--S--- 连属主都写不进去；改用默认 umask 即可（aaphoto/0.45 patches/0003、a52dec/0.7.4 patches/0002 同款）。**打补丁要改 configure 而不是 config.status**：后者是 configure 运行时生成的，改前者一次覆盖两处。"
  - "SourceForge 下载 CDN 在本适配网络整体不可达（downloads.sourceforge.net 与全部 *.dl.sourceforge.net 镜像：HTTP 522 或 DNS 解析失败）。可用的官方字节级替代是 distfiles.alpinelinux.org（Alpine 官方 distfiles，逐字保留上游 tarball），适合放进 conandata.yml 的 url 列表做兜底；两条 URL 共用一个 sha256 前必须先 cmp + md5 验证字节一致。"
  - "dhav2mkv 的 DHAV 帧格式（src/mctools.c，可用于构造合法测试流）：4 字节 'DHAV' + type@4 + epoch@16(u32 LE) + ts@20(u16 LE) + 扩展头长度@22 + 24 字节头 + 扩展头 + body + 尾部 'dhav' + 总长度(u32 LE)；总长度同时冗余存放在偏移 12。扩展头 dhav_sf_parse_ext_head() 按「每组 4 字节 = [id, s0, s1, s2]」填数组（**只有 id==0x88 是 8 字节**），读取时 0x80 组的 sub-field 2 = 宽/8、sub-field 3 = 高/8，0x81 组 sub-field 3 = 帧率 —— 槽位错位一字节就会得到 480x0 这种废分辨率。type 0xfd 是带几何信息的 I 帧（0xfc 是普通帧，必须在 I 帧之后）。"
  - "**架构相关 UB（可移植性坑）**：mctools.c:651 用 `(v_width * 1000) / v_height` 猜宽高比（v_height 为 uint32_t），当 DHAV I 帧报告高度 0 时是整数除零 —— UB。aarch64 的 UDIV/SDIV 除零返回 0 不陷阱（OHOS aarch64 实测不崩，只产出 480x0 的废 MKV），而 x86_64 上 idiv 会陷阱；clang -O3 对常量 0 甚至直接折叠出任意值（实测 quotient=1）。**跨架构验证 conandata 构造数据时必须让输入本身合法**，否则「aarch64 能过」并不代表数据对。"
  - "验证构造数据是否真被上游解析，最稳的办法是反查产物里的字段：mctools.c 把 PixelWidth/PixelHeight 以大端 uint16 写在 MKV 头固定偏移 0x170/0x174（源里是 MKV_HOFF_PixelWidth = 0x16e+2），用它反查能一眼看出生成了什么分辨率，比读日志可靠。"
  - "dhav2mkv 的上游行为瑕疵：输入文件打不开时 process_dhav_stream() 返回 4，但 main() 忽略返回值直接 exit(0) —— 即「读不到文件」也返回 0，测试只能断言日志文本（FATAL ERROR ... Unable to read DHAV stream data.）而不能断言退出码。"
  - "同族坑：dhav2mkv 对无法识别的容器会 fallback 成 DHAV 并继续跑（只打 WARNING），最终产出 0 字节 MKV 且退出码仍为 0 —— 自动化测试必须以输出文件内容而非退出码判定成败。"
  - "OHOS musl 把 pthread/dl 并入 libc，且 soname 是 libc.so 而非 glibc 的 libc.so.6：检查 aarch64 OHOS 产物是否真的适配到平台，可以直接断言 ELF 解释器是 **两个合法 loader 之一**（/lib/ld-musl-aarch64.so.1 或 /lib/ld-linux-aarch64.so.1）且显式排除 glibc 的 ld-linux-aarch64.so.2，再断言 DT_NEEDED 恰为 ['libc.so']，比只跑 --version 有力得多。**教训（本包 CI #66216 实测踩到）**：本地 WSL 产物解释器是 /lib/ld-linux-aarch64.so.1，而 OHOS 设备上 NDK clang 产物的解释器名不同 —— 只写死一个 loader 名的断言会在设备/CI 上假失败，断言必须覆盖设备上并存的两种 loader 名，或只断言『不是 glibc 那个』。"
