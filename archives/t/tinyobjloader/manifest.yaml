category: data
homepage: "https://github.com/tinyobjloader/tinyobjloader"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only 单文件库：consumer 须在单一翻译单元定义 TINYOBJLOADER_IMPLEMENTATION 内嵌实现，否则链接失败"
    - "Conan package_info() 仅声明 include 目录，不声明库文件"
    - "无第三方依赖，仅 C++ STL"
  common_dependencies: []

versions:
  "2.0.0rc13":
    status: built
    build_date: 2026-09-01
