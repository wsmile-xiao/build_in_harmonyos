software: ttyload
display: "ttyload"
description: "Terminal load-average grapher (1/5/15 min) drawn as a live ASCII chart, no curses and no external libraries"
category: utility-monitor
homepage: "https://github.com/lindes/ttyload"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 用 'uname -s' 的结果去拼架构目录白名单 (arch/<OS>/getload.o)，tarball 只带 FreeBSD/IRIX/Linux/SunOS；HarmonyOS PC 上 uname -s = HarmonyOS，裸 make 直接 'No rule to make target arch/HarmonyOS/getload.o'。用上游自己的 ARCHLINKS「架构互仿」机制把 HarmonyOS 映射到 Linux 后端（同一机制已把 Darwin/Isilon-OneFS 映射到 FreeBSD）"
    - "映射依据是实测不是猜：arch/Linux/getload.c 只读 /proc/loadavg（B 机可读，值与 ttyload 报出的一致），arch/Linux/terminfo.c 只用 ioctl(TIOCGWINSZ)"
    - "上游把 CC 写死成 'gcc -pedantic -Wall -Werror'；构建机只有 OHOS SDK clang（无 gcc 也无 cc），且 -Werror 会被平台自身 sysroot 头文件的 #warning 判死。CC 走 self.conf 解析（R33），-pedantic -Wall 全留、只去掉 -Werror"
    - "不跑上游 'make test'：它就是 './ttyload -i 1'，optstring 没有迭代上限，按设计永不退出，会挂死构建机；改在 test_package 里有界执行同一程序、另加 -m 单色选项（实物 'ttyload -m -i 1'）+ 4 条断言"
    - "install 不用上游 /bin/cp + 绝对 INSTALLDIR，改成 Conan copy 到包内 bin/（R49/PF6）"
  common_dependencies: []

versions:
  "0.5-20131024-gitf949537":
    status: built
    build_date: "2026-09-27"
    conan_ref: "ttyload/0.5-20131024-gitf949537"
