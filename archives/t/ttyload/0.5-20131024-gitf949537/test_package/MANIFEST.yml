# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ttyload/0.5-20131024-gitf949537
homepage: "https://github.com/lindes/ttyload"

# 上游测试命令：Makefile 里唯一名为 test 的目标
upstream_check_command: "make test"

# 上游测试是否已集成进 conanfile.py build()
# true —— 但集成的不是 'make test' 本身，见下面 upstream_test_command 与 notes.md：
# build() 实际执行的是上游自带的平台自检程序 ./archtest（有限运行、退出码 0）。
upstream_test_in_build: true
upstream_test_command: "./archtest"

# ── R51 上游测试清点（实物：24 个普通文件，逐项目录扫过；6 个目录不计，tar 条目 30）──
# 上游没有任何断言式测试框架：无 tests/ 目录、无 ctest/pytest、无 check 目标。
# 与"测试"沾边的只有两处，都在盘上实测过：
upstream_tests:
  - name: "make test"
    kind: "makefile-target"
    command: "make test"
    # Makefile:37-38  test: $(PROGRAMS) / ./ttyload -i 1
    # 实测：该命令**按设计永不退出**。ttyload.c:38 的 optstring 是 "i:hvmr:c:"，
    # 没有"跑 N 帧后结束"的选项，作者说明是 "(Note: use ctrl-C to quit)"。
    # 直接跑会把 CI 挂死 ⇒ 不在 build() 里裸跑，改在 test_package 里用
    # "stdout 交给 head、读够就 SIGPIPE 收尾"的方式有界执行同一程序。
    runnable_unchanged: false
    reason: "无限循环的交互式绘图，没有迭代上限参数；裸跑会挂死构建机"
  - name: "archtest"
    kind: "upstream-arch-harness"
    command: "./archtest"
    # archtest.c:1-29 自述 "simple harness to the arch-specific stuff, so that
    # we can test those things in relative isolation" —— 上游自己写的架构后端
    # 隔离测试程序，有限运行。在 build() 中执行，B 机实测 rc=0，
    # 输出 termsize + 三档真实负载 + Version 0.5.3。
    runnable_unchanged: true

# test_package 自带的消费者侧测试
test_package_tests:
  - file: test_ttyload.sh
    description: >-
      POSIX sh 执行被测二进制 ttyload 的 4 项断言：T1 -v 版本横幅、T2 -h usage、
      T3 有界真实绘图并把标题行里的 1 分钟负载与内核 /proc/loadavg 比对（证明
      arch/Linux 后端在 HarmonyOS 上取数正确）、T4 ASCII 曲线的 y 轴刻度与数据点
      确实被画出。任一项不成立即 exit 1。
