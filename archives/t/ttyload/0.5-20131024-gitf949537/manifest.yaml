# 文件位置: archives/t/ttyload/0.5-20131024-gitf949537/manifest.yaml

version: "0.5-20131024-gitf949537"
software: "ttyload"

# conan-verify 的 G2/G3/G4/L2/L4/L5 由主窗复跑后才升级为 published；
# 本窗在 B 机实测到的是 conan create 全绿 + test_package 4/4 ⇒ 如实标 built。
status: built

build_date: "2026-09-27"
build_system: "makefile"

source:
  url: "https://deb.debian.org/debian/pool/main/t/ttyload/ttyload_0.5+20131024+gitf949537.orig.tar.gz"
  sha256: "2c07532785fbf87895111b69bfec70adc8913855bdc025a57582da0cfefea82b"
  tar_format: tar.gz

build:
  system: makefile
  # 上游没有 configure。唯一的构建期入参就是两个 make 命令行变量：
  #   CC           <- Conan 解析出的 C 编译器（R33，不读裸 shell 变量）
  #   OTHER_FLAGS  <- 上游的 -pedantic -Wall 全留，只把 -Werror 降为 -Wno-error
  # 带空格的 make 变量值必须自带引号，否则 conan 拼命令行时会被 shell 拆开。
  configure_options:
    - "make -j1 CC=\"<conan 解析的 clang>\" OTHER_FLAGS=\"-pedantic -Wall -Wno-error\""
  # ttyload 零依赖：不用 curses/ncurses，纯 libc + /proc + ioctl(TIOCGWINSZ)。
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.patch"

knowledge_gained:
  - "上游 Makefile 以 'uname -s' 结果拼架构目录白名单（OBJS = arch/${ARCH}/*.o），tarball 只带 FreeBSD/IRIX/Linux/SunOS；HarmonyOS PC 的 uname -s = HarmonyOS ⇒ 裸 make 必报 No rule to make target 'arch/HarmonyOS/getload.o'。修法是走上游自己的 ARCHLINKS『架构互仿』机制加 arch/HarmonyOS -> Linux 符号链接（Darwin/Isilon-OneFS 本就是这么映射到 FreeBSD 的），不是新建平台源文件、不用平台宏"
  - "映射合法性靠实测：arch/Linux/getload.c 只 fopen(/proc/loadavg)，arch/Linux/terminfo.c 只 ioctl(TIOCGWINSZ)，两者在 HongMeng Kernel 1.12.0 上均可用；ttyload 报出的 1min 负载与 /proc/loadavg 首列实测一致"
  - "HarmonyOS PC 构建机上 gcc 与 cc 都不存在（只有 OHOS SDK clang），任何把 CC 写死成 gcc/cc 的上游 Makefile 都必须把编译器作为 make 命令行变量传入"
  - "OHOS sysroot 自己的头文件 sys/fcntl.h 会发出 #warning（redirecting incorrect include），上游带 -Werror 的工程在 OHOS 上会被这条平台告警直接判死 —— 与补丁质量无关，只能降级 -Werror 并留证据"
  - "conan 的 Autotools.make(args=[...]) 只做空格拼接、不转义：值里带空格的 make 变量（OTHER_FLAGS/CFLAGS 等）必须自己写成 KEY=\"v1 v2\"，否则只有第一个 word 能到 make 手里"
  - "同版本多形态版本串并存时不得归一化：平台/归档目录用连字符 0.5-20131024-gitf949537，tarball 与解包顶层目录用加号 0.5+20131024+gitf949537，程序自报版本又第三种（上游 Version 文件 = 0.5.3）；配方用 strip_root=True 绕开解包目录名"
  - "HarmonyOS PC 的 /proc 访问按工具不对称：cat/head/sed/cut 与 shell read 能读 /proc/loadavg，grep 与 awk 直接开该文件报 Permission denied，而 test -r 却返回可读 —— 测试脚本取 /proc 值要用 sed/cut，且 'ls -l /proc/<file>' 被拒不代表读不到"
  - "上游『make test』就是一个永不退出的交互式绘图（ttyload optstring 里没有迭代上限参数），不能进 build()；对这类上游测试要用『stdout 交给 head、读够即 SIGPIPE 收尾』做有界执行 + 内容断言"

