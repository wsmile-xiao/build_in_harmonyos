# test_package/MANIFEST.yml — tl-expected 1.1.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 上游测试: Catch2 驱动的 CTest（fetch 自 GitHub 的 Catch2 v2.13.10）

package: tl-expected/1.1.0
homepage: "https://tl.tartanllama.xyz"

# 上游测试命令
upstream_check_command: "cmake -DEXPECTED_BUILD_TESTS=ON && cmake --build . && ctest"

# conanfile.py build() 方法中未集成上游测试（测试依赖 Catch2，需网络 fetch）
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际运行的测试程序（tl-expected-tests: 451 assertions / 36 test cases）
upstream_tests:
  - file: tests/*.cpp
    source: tl-expected-1.1.0/tests/
    description: "上游 Catch2 测试套件: assertions/assignment/bases/constexpr/constructors/emplace/extensions/issues/noexcept/observers/relops/swap"
    command: "./tl-expected-tests"

# test_package 中自带的 HarmonyOS 专项测试（消费者视角验证）
test_package_tests:
  - file: test_tl_expected_ohos.cpp
    description: "HarmonyOS 专项测试: 值/错误分支、and_then/map 链式调用、constexpr、版本宏、OHOS aarch64 平台检测"
    command: "./test_tl_expected"

# 测试断言总数
assertion_count: 451