software: tl-expected
# 版本级 manifest
# 文件位置: archives/t/tl-expected/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/TartanLlama/expected/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "1db357f46dd2b24447156aaf970c4c40a793ef12a8a9c2ad9e096d9801368df6"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DEXPECTED_BUILD_TESTS=ON"
    - "-DEXPECTED_BUILD_PACKAGE=OFF"
    - "-DCMAKE_CXX_STANDARD=17"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "tl-expected 是 header-only 库（CMake INTERFACE library），无需编译二进制，无任何依赖"
  - "仅包含单头文件 include/tl/expected.hpp（C++11/14/17 std::expected + functional 扩展）"
  - "CMake 命名空间：tl::expected / cmake_file_name=tl-expected"
  - "上游测试用 Catch2（FetchContent 下载），本地需用 FETCHCONTENT_SOURCE_DIR_CATCH2 指向可达源避免 github.com 下载失败"
  - "make_unexpected() 在 1.1.0 中非 constexpr，constexpr 路径需直接构造 unexpected"
  - "OHOS aarch64 下 clang 15 编译通过，451 assertions / 36 test cases 全绿；HarmonyOS 专项测试 17 checks PASS"
