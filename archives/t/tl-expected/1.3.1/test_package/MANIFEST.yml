# test_package/MANIFEST.yml
package: tl-expected/1.3.1
homepage: "https://github.com/TartanLlama/expected"

upstream_check_command: "cmake --build . && ctest"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - file: tests/*.cpp
    source: expected-1.3.1/tests/
    description: >-
      Upstream Catch2 test suite (excluding test.cpp which has its own main).
      Built and executed via CMake ctest in build(). Catch2 provided by
      conan catch2/2.13.10-r0 instead of FetchContent.
    command: "ctest"

test_package_tests:
  - file: test.cpp
    description: >-
      Consumer-side API validation: tl::expected value/error/map operations,
      7 assertions covering has_value, value(), error(), and map().
    command: "./test_tl_expected"

assertion_count: 7
