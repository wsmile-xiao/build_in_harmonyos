package: ta-lib/0.7.1
homepage: "https://github.com/ta-lib/ta-lib"

upstream_check_command: "make -C src/tools/ta_regtest"
upstream_test_in_build: true
upstream_test_command: "export LD_LIBRARY_PATH=src/.libs; src/tools/ta_regtest/.libs/ta_regtest"

upstream_tests:
  - file: src/tools/ta_regtest/ta_regtest.c
    source: ta-lib-0.7.1/src/tools/ta_regtest/ta_regtest.c
    description: "ta_regtest: regression tests for all technical indicator function families (math/vector, moving averages, aroon/correl/beta/midprice, cci/willr/ultosc/natr, bop/avgprice, rsi/cmo, imi, min/max family, po/apo, adx family, sar, stoch family, mfi/ad, phasor/sine, trix, macd family, mom family, trange/atr, stddev/var, avgdev, bbands, period boundary, all candlesticks)"
    command: "./src/tools/ta_regtest/.libs/ta_regtest"
  - file: src/tools/ta_regtest/ta_test_func/test_ma.c
    source: ta-lib-0.7.1/src/tools/ta_regtest/ta_test_func/test_ma.c
    description: "Moving-average correctness tests (SMA/EMA/WMA/DEMA/TEMA/TRIMA/KAMA/MAVP/MIDPOINT), part of ta_regtest"
    command: "./src/tools/ta_regtest/.libs/ta_regtest"
  - file: src/tools/ta_regtest/ta_test_func/test_rsi.c
    source: ta-lib-0.7.1/src/tools/ta_regtest/ta_test_func/test_rsi.c
    description: "RSI/CMO correctness tests, part of ta_regtest"
    command: "./src/tools/ta_regtest/.libs/ta_regtest"
  - file: src/tools/ta_regtest/ta_test_func/test_macd.c
    source: ta-lib-0.7.1/src/tools/ta_regtest/ta_test_func/test_macd.c
    description: "MACD/MACDEXT/MACDFIX correctness tests, part of ta_regtest"
    command: "./src/tools/ta_regtest/.libs/ta_regtest"
  - file: src/tools/ta_regtest/ta_test_func/test_candlestick.c
    source: ta-lib-0.7.1/src/tools/ta_regtest/ta_test_func/test_candlestick.c
    description: "All candlestick pattern recognition tests, part of ta_regtest"
    command: "./src/tools/ta_regtest/.libs/ta_regtest"

test_package_tests:
  - file: test.c
    description: "Consumer test: TA_Initialize + TA_SMA(3) known values + TA_EMA(3) known values + TA_RSI(14) pure-trend = 100"
    command: "./test_ta_lib"

assertion_count: 9
