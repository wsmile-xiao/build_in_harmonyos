knowledge_gained:
  - category: platform_truth
    layer: L1
    content: "HMDFS 临时目录权限问题：umask 077 创建目录导致权限过严(drwx--S---)，后续写入失败"
    solution: "修改 configure 脚本移除 umask 077，改为直接 mktemp -d"
    keywords: [HMDFS, umask, tmpdir, permission]
  - category: platform_truth
    layer: L1
    content: "HarmonyOS 平台识别：config.guess 不识别 HarmonyOS 系统"
    solution: "在 config.guess 中添加 aarch64:HarmonyOS:*:*) 分支，返回 aarch64-unknown-linux-gnu"
    keywords: [config.guess, HarmonyOS, platform, triplet]
  - category: build_system
    layer: L2
    content: "ta-lib autotools 构建需 touch autotools 文件避免重新生成"
    solution: "touch m4/*.m4 aclocal.m4 configure.ac configure Makefile.in"
    keywords: [autotools, touch, regeneration]

