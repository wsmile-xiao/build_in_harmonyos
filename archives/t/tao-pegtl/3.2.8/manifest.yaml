# 版本级 manifest — tao-pegtl 3.2.8

# 版本号
version: "3.2.8"

# 软件名
software: "tao-pegtl"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方正式源，R39）
  url: "https://github.com/taocpp/PEGTL/archive/refs/tags/3.2.8.tar.gz"

  # 源码校验和
  sha256: "319e8238daebc3a163f60c88c78922a8012772076fdd64a8dafaf5619cd64773"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DPEGTL_BUILD_TESTS=ON"
  - "-DPEGTL_BUILD_EXAMPLES=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "tao-pegtl 是纯 header-only C++17 库（src/ 下无库源码，仅 example/test），配方必须用 header-library 变体而非 autotools/library"
- "conan2 的 copy() 用 fnmatch 按文件相对路径匹配：嵌套头文件（include/tao/**）需从 include 目录整体 copy('*') 并指定 package_folder 绝对 dst，pattern '*.hpp' 仅匹配顶层"
- "test_package 用 must<> 组合子解析无效输入时会抛 parse_error 而非返回 false，测试需 try/catch 捕获异常验证拒绝路径"
- "L0d 门禁要求 test_package/conanfile.py 的 test() 含 self.run 实际执行被测二进制，仅 cmake.test() 会被判 stub"
- "JC5 在 full 模式按 git ls-files 扫描 archives 隐藏文件；其他库基线隐藏文件（如 .ci-trigger）需临时 index 隔离（git rm --cached）+ 复验 + 无条件恢复"