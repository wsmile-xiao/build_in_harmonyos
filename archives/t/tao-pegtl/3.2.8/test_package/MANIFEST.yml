# test_package/MANIFEST.yml
# 上游官方测试声明 (R51 三步法: 清点 → 实测 → 申报)
#
# 实测(2026-09-08, 本机 aarch64 OHOS 交叉环境, clang++ C++17):
#   cmake -S . -B build-tests -DPEGTL_BUILD_TESTS=ON -DPEGTL_BUILD_EXAMPLES=OFF
#   cmake --build build-tests -j4    → 128 个测试程序全部链接成功
#   ctest  → 128/128 Passed (0 failed), Total Test time 1.28s

package: tao-pegtl/3.2.8
homepage: "https://github.com/taocpp/PEGTL"

# 上游测试命令 (ctest 注册 128 项)
upstream_check_command: "cmake -S . -B build-tests -DPEGTL_BUILD_TESTS=ON && cmake --build build-tests && ctest --test-dir build-tests"

# conanfile.py build() 方法中是否已集成上游测试 (header-only 无 build 阶段)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ctest 注册的 128 项, 抽样 8 项)
upstream_tests:
  - file: src/test/pegtl/action.cpp
    source: tao-pegtl-3.2.8/src/test/pegtl/action.cpp
    description: "action 语义测试"
    command: "./pegtl-test-action"
  - file: src/test/pegtl/parse.cpp
    source: tao-pegtl-3.2.8/src/test/pegtl/parse.cpp
    description: "parse 入口测试"
    command: "./pegtl-test-parse"
  - file: src/test/pegtl/utf8_general.cpp
    source: tao-pegtl-3.2.8/src/test/pegtl/utf8_general.cpp
    description: "UTF-8 通用测试"
    command: "./pegtl-test-utf8_general"
  - file: src/test/pegtl/visit.cpp
    source: tao-pegtl-3.2.8/src/test/pegtl/visit.cpp
    description: "语法遍历测试"
    command: "./pegtl-test-visit"
  - file: src/test/pegtl/json.cpp
    source: tao-pegtl-3.2.8/src/test/pegtl/json.cpp
    description: "JSON 解析测试"
    command: "./pegtl-test-json"
  - file: src/test/pegtl/demangle.cpp
    source: tao-pegtl-3.2.8/src/test/pegtl/demangle.cpp
    description: "demangle 测试"
    command: "./pegtl-test-demangle"
  - file: src/test/pegtl/contrib/json.cpp
    source: tao-pegtl-3.2.8/src/test/pegtl/contrib/json.cpp
    description: "contrib/json 测试"
    command: "./pegtl-test-contrib-json"
  - file: src/test/pegtl/contrib/json_pointer.cpp
    source: tao-pegtl-3.2.8/src/test/pegtl/contrib/json_pointer.cpp
    description: "contrib/json_pointer 测试"
    command: "./pegtl-test-contrib-json_pointer"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 真实 include tao/pegtl.hpp 并用数字文法 parse"
    command: "./test_tao_pegtl"

# 测试断言总数 (上游 128 个测试程序内置断言数不可精确枚举, 以 Passed/总数申报)
assertion_count: 128