software: tinycdb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.81/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.81"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# 构建系统类型（顶级字段，verify 需要）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.corpit.ru/mjt/tinycdb/tinycdb-0.81.tar.gz"

  # 源码校验和
  sha256: "469de2d445bf54880f652f4b6dc95c7cdf6f5502c35524a45b2122d70d47ebc2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "AR=llvm-ar"
    - "RANLIB=llvm-ranlib"
    - "LDFLAGS=-fuse-ld=/data/service/hnp/bin/ld.bfd"
    - "CFLAGS=-fPIC -O2"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 项目无需 configure，直接通过 make 命令行参数覆盖编译器设置"
  - "OpenHarmony 上新编译二进制必须 ELF 签名(sign-elf)才能执行，否则会 Permission denied"
  - "OpenHarmony (musl libc) 不支持 ulimit -f 限制文件大小，导致 cdb 文件大小限制测试无法通过"
  - "必须使用 GNU ld (ld.bfd) 替代 lld，通过 -fuse-ld=/data/service/hnp/bin/ld.bfd"
  - "Makefile 已原生支持 DESTDIR，无需修改安装目标"
