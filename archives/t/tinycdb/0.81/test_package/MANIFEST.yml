# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tinycdb/0.81
homepage: "https://www.corpit.ru/mjt/tinycdb/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests.sh
    source: tinycdb-0.81/tests.sh
    description: "Functional tests: create, query, dump, list, stats"
    command: "./cdb"

test_package_tests:
  - file: test.c
    description: "CDB create+query verification: creates database, queries keys, verifies values"
    command: "./test_tinycdb"

assertion_count: 5
