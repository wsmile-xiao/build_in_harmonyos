software: tinycdb
display: "tinycdb"
description: "小型、快速、可靠的常量数据库（CDB 格式）创建和读取工具及库"
category: database
homepage: "https://www.corpit.ru/mjt/tinycdb/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目无需 configure，直接通过 make 命令行参数覆盖编译器设置"
    - "OpenHarmony 上新编译二进制必须 ELF 签名才能执行"
    - "必须使用 GNU ld (ld.bfd) 替代 lld，通过 -fuse-ld=/data/service/hnp/bin/ld.bfd"
    - "Makefile 已原生支持 DESTDIR，无需修改安装目标"
    - "ulimit -f 文件大小限制测试在 OpenHarmony (musl libc) 上不生效，不影响软件功能"
  common_dependencies: []

versions:
  "0.81":
    status: built
    build_date: "2026-06-09"
