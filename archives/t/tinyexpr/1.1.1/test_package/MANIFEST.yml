package: tinyexpr/1.1.1
homepage: "https://github.com/codeplea/tinyexpr"

upstream_check_command: "./smoke && ./smoke_pr"
upstream_test_in_build: true
upstream_test_command: "./smoke && ./smoke_pr"

upstream_tests:
  - file: smoke.c
    source: tinyexpr-1.1.1/smoke.c
    description: "Default TinyExpr semantics; 15 named upstream test groups"
    command: "./smoke"
    tests: 1
  - file: smoke.c
    source: tinyexpr-1.1.1/smoke.c
    description: "Right-associative power and natural-log configuration; 15 named upstream test groups"
    command: "./smoke_pr"
    tests: 1

test_package_tests:
  - file: test_tinyexpr.c
    description: "One consumer boundary covering direct evaluation, variables, reuse, math functions, and parse errors"
    command: "./test_tinyexpr"
    assertions: 8

upstream_test_count: 2
upstream_test_groups_per_target: 15
consumer_test_count: 1
consumer_assertion_count: 8
assertion_count: 8
