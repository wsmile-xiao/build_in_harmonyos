# test_package/MANIFEST.yml
package: tinyply/3.0
homepage: "https://github.com/ddiakopoulos/tinyply"

upstream_check_command: "source/Makefile all + source/tests.cpp (doctest)"
upstream_test_in_build: true
upstream_test_command: "example round-trip executed + doctest suite executed with --test-case-exclude"

upstream_tests:
  - file: example.cpp
    source: tinyply-3.0/source/example.cpp
    description: >-
      Upstream source/Makefile `all` target shape: compile tinyply.cpp +
      example.cpp and run the self-contained circular write/read round-trip
      (writes example_cube ascii + binary PLY, reads both back).
    command: "./tinyply-example"
  - file: tests.cpp
    source: tinyply-3.0/source/tests.cpp
    description: >-
      doctest suite with 31 TEST_CASEs. 19 cases are self-contained and are
      executed unmodified (all pass). The remaining 12 cases read fixture
      files under ../assets/validate/{valid,invalid}/ which upstream
      explicitly does not redistribute (see the header comment of
      tests.cpp) and which upstream's own CI (appveyor.yml) never runs;
      they are excluded with doctest's official --test-case-exclude flag.
    command: "./tinyply-tests --no-version --test-case-exclude=<12 asset-dependent cases>"

test_package_tests:
  - file: test.cpp
    description: >-
      Consumer-side API validation: 10 CHECKs exercising the real PLY API —
      ascii/binary write via add_properties_to_element + write, header parse
      (parse_header, is_binary_file, get_elements), request_properties_from_element,
      read() data counts and value round-trip, face list element buffer, and
      malformed-header rejection. Returns non-zero on any failed check.
    command: "./test_tinyply"

assertion_count: 10
