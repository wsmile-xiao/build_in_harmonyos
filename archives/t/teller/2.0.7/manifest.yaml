# 版本级 manifest — teller 2.0.7

version: "2.0.7"
software: "teller"

# 编译状态
# built：本地 OHOS aarch64 真实构建 + 上游测试实跑 + conan create + test_package 全通过；未上传发布。
# Rust 工具链由制品仓基础设施包 rust-toolchain/1.97.1 提供（tool_requires），
# 不使用系统 cargo、不使用 rustup 引导（rustup 无法识别 HarmonyOS 宿主，E105/E154）。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "cargo"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://github.com/tellerops/teller/archive/refs/tags/v2.0.7.tar.gz"

  # 源码校验和（实测 sha256）
  sha256: "1d4275ede4366a31efc94039c58da4cec87466d09cc01444c3c18e9432716d23"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（Rust cargo workspace）
  system: custom

  # 配置选项列表（cargo 无 configure 选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "openssl/3.5.8.1"

  # 构建期工具依赖（tool_requires）
  build_tools:
    - "rust-toolchain/1.97.1"
    - "protobuf/3.17.3"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 未改动上游源码（零补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Rust 配方在竞赛 CI 的可行路径：tool_requires rust-toolchain/1.97.1（rust-lang 官方 dist 预编译，宿主=目标=aarch64-unknown-linux-ohos），规避『本机无 cargo』与『rustup 不识别 HarmonyOS 宿主（E105/E154）』两个坑"
  - "rust-toolchain 包内 cargo/rustc 未带 OHOS code signature，execve 报 EACCES；须复制到 build_folder 内用 binary-sign-tool -selfSign 1 自签名（含 rustc dlopen 的 librustc_driver），签名后还需 chmod 755"
  - "cargo 1.97 动态链接 libssl/libcrypto（系统 3.0.x 缺 SSL_get0_group_name），需 preload Harmonybrew openssl@3-3.6.4 bottle；libz.so 由 OHOS 系统默认路径提供，无需额外 bottle"
  - "teller 的 etcd provider 经 etcd-client→tonic-build→prost-build 需要 protoc：tool_requires protobuf/3.17.3 提供；hashicorp_vault 经 rustify→native-tls→openssl-sys 需要 OpenSSL：requires openssl/3.5.8.1（静态链接，产物 DT_NEEDED 仅 libc.so）"
  - "cargo test 的 trycmd 快照依赖 git 仓库语义：源码 tarball 无 .git 时 ignore crate 不应用 .gitignore，scan.trycmd 有 2 例误判失败；构建期补建 .git 目录即与上游 git checkout 环境对齐（29/29 用例通过）"
  - "OHOS 平台 Rust 工具链（制品仓 rust-toolchain/1.97.1 与 Harmonybrew rust bottle）均不含 rustdoc，doctest 无法执行，测试目标须显式排除 --doc"
