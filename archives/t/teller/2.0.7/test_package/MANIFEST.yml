# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）

package: teller/2.0.7
homepage: "https://github.com/tellerops/teller"

# 上游测试命令（Rust cargo 项目，无 make check / ctest）
upstream_check_command: "cargo test --all-features --all"   # 上游 CI .github/workflows/build.yml

# conanfile.py build() 方法中是否已集成上游测试（默认执行；OHC_SKIP_UPSTREAM_TESTS=1 可跳过）
# 注：本机 conan create / conan-verify / finish(W3) 为压缩时间预算均以该变量跳过 build() 内测试，
#     上游测试已在同一源码树上独立实跑并留档（见 notes.md §上游测试用例申报与 §本地执行口径说明）；
#     CI 侧不设该变量，故远端 conan create 默认执行上游测试。
upstream_test_in_build: true
upstream_test_command: >-
  cargo test --release --locked --target aarch64-unknown-linux-ohos
  --all-features --workspace --no-fail-fast
  --lib --bins --tests --benches --examples

# 上游测试（静态清点 19 个测试函数；本机实跑 12 通过 / 6 失败 / 1 忽略）
upstream_tests:
  - file: "teller-cli/tests/cli_tests.rs（trycmd，注册 tests/cmd/*.trycmd）"
    source: "teller-2.0.7/teller-cli/tests/cli_tests.rs"
    description: "trycmd 快照集成测试：29 个用例（scan/export/redact/new/put/delete/copy/run/template），本机 29/29 通过"
    command: "cargo test --test cli_tests --target aarch64-unknown-linux-ohos --release"
    case_count: 29
  - file: "teller-cli/tests/flow_test.rs"
    source: "teller-2.0.7/teller-cli/tests/flow_test.rs"
    description: "dockertest 集成测试（Vault 1.8.2 + LocalStack）：需 Docker，本机无 Docker 而失败（环境限制）"
    command: "cargo test --test flow_test --target aarch64-unknown-linux-ohos --release"
    case_count: 1
  - file: "teller-core/src/{config,exec,redact,scan,template}.rs"
    source: "teller-2.0.7/teller-core/src/*.rs"
    description: "teller-core 单元测试 9 例：8 通过 / 1 忽略（exec::tests::env_reset 上游 #[ignore]）"
    command: "cargo test -p teller-core --target aarch64-unknown-linux-ohos --release"
    case_count: 9
  - file: "teller-providers/src/providers/*.rs"
    source: "teller-2.0.7/teller-providers/src/providers/*.rs"
    description: "teller-providers 单元测试 8 例：3 通过（dotenv/inmem/google_secretmanager）/ 5 失败（dockertest 需 Docker）"
    command: "cargo test -p teller-providers --target aarch64-unknown-linux-ohos --release"
    case_count: 8

# test_package 自带的消费者测试（消费者视角验证）
test_package_tests:
  - file: test_teller.py
    description: "消费者冒烟 + 端到端：--version / --help / export json / scan（临时 .teller.yml + .env），5 项断言"
    command: "PACKAGE_FOLDER=<pkg> python3 test_teller.py"
    assertion_count: 5

# 鸿蒙特有测试 (HarmonyOS-specific)：断言产物在本平台可用所必需的特性
# B1 ELF machine = AArch64；B2 PT_INTERP = OHOS musl loader（证明是 OHOS
# bionic/musl 二进制而非 glibc Linux）；B3 含 OHOS code signature（未签名 ELF
# 在 HarmonyOS 上无法 execve，EACCES errno 13，正是配方 _sign_binaries() 修复的
# 失败点）；B4 非空可执行文件
harmonyos_specific_tests:
  - file: test_teller.py
    description: "鸿蒙特有测试 4 项（AArch64 / musl 解释器 / code signature / 产物完整性）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_teller.py"
    assertion_count: 4

# 依赖测试 (dependency functional test)：teller 经 rustify(default-tls) →
# reqwest → native-tls → openssl-sys 使用 openssl/3.5.8.1，且为**静态链接**
# （产物 DT_NEEDED 仅 libc.so），仅运行 teller 无法证明该依赖在 HarmonyOS 上
# 真实可用。test_deps.c 以消费者身份用 OHOS clang 编译并链接 openssl 包，
# 在设备上实际执行 OpenSSL 代码路径。
dependency_tests:
  - file: test_deps.c
    description: "依赖功能测试 7 项断言（OpenSSL_version/version_num、SHA256、EVP_Digest、RAND_bytes、BN_set_word、AES-128-CBC 加解密往返）"
    command: "PACKAGE_FOLDER=<pkg> conan test …（自动编译并执行）"
    assertion_count: 7
    dependencies:
      - "openssl/3.5.8.1"

# 测试断言总数（用于质量评估）
# 上游 cargo 测试 19（12 通过 / 6 Docker 环境限制失败 / 1 忽略；trycmd 内含 29 用例全通过）
# + test_package 消费者 5 + 鸿蒙特有 4 + 依赖功能 7
assertion_count: 35
