# cargo 本体运行期所需的共享库（Harmonybrew OHOS 预编译 bottle）：
# cargo 1.97 的 DT_NEEDED = libssl.so / libcrypto.so / libz.so / libc.so，
# 而 OHOS loader 忽略 DT_RUNPATH，必须显式加入 LD_LIBRARY_PATH；系统
# /usr/lib 的 libssl.so.3 为 3.0.x，缺 cargo 1.97 需要的 SSL_get0_group_name，
# 故取 3.6.4 预编译 bottle（sha256 为实测值；argc/bottom/below 先例）。
# libz.so 由 OHOS 系统默认路径提供（实测仅 preload openssl bottle 即可完成
# cargo fetch 的 TLS + crates 索引拉取），故不再引入 zlib bottle。
rust_runtime:
  - name: "openssl3"
    url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4.arm64_ohos.bottle.tar.gz"
    sha256: "e1be73c6c68e29c33ff43761045e43e23e7c369f0fb1a24f40e226ec5cb28f98"
