# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）

package: tinyusb/0.18.0
homepage: "https://www.tinyusb.org"

# 上游没有 make test 目标：test/unit-test 是 Ceedling 0.31.1 工程，
# 入口是 test/unit-test/ceedling（一个几十字节的 shell 包装，内部跑
# vendor/ceedling 里 vendored 的 Ruby gem），默认任务 `test:all`。
upstream_check_command: "cd test/unit-test && ./ceedling"

# conanfile.py build() 已集成上游测试中无需 CMock 的那两个文件
upstream_test_in_build: true
upstream_test_command: "./test_common_func && ./test_fifo"

upstream_tests:
  - file: "test/unit-test/test/test_common_func.c"
    source: "tinyusb-0.18.0/test/unit-test/test/test_common_func.c"
    description: "1 个 Unity 用例 test_TU_ARGS_NUM：TU_ARGS_NUM/TU_ARGS_NUM_HELPER 可变参数计数宏，33 处 TEST_ASSERT"
    command: "./test_common_func"
  - file: "test/unit-test/test/test_fifo.c"
    source: "tinyusb-0.18.0/test/unit-test/test/test_fifo.c"
    description: "14 个 Unity 用例（test_normal / test_item_size / test_read_n / test_write_n / test_write_double_overflowed / test_write_overwritable2 / test_peek / test_get_read_info_when_no_wrap / test_get_read_info_when_wrapped / test_get_write_info_when_no_wrap / test_get_write_info_when_wrapped / test_empty / test_full / test_rd_idx_wrap）：tu_fifo 环形缓冲的读写/回绕/覆盖/空满语义，61 处 TEST_ASSERT"
    command: "./test_fifo"
  - file: "test/unit-test/test/device/usbd/test_usbd.c"
    source: "tinyusb-0.18.0/test/unit-test/test/device/usbd/test_usbd.c"
    description: "5 个 Unity 用例（test_usbd_get_device_descriptor / _null / test_usbd_get_configuration_descriptor / _null / test_usbd_control_in_zlp），经 CMock 桩 mock_dcd / mock_msc_device 驱动 usbd 状态机"
    command: "./test_usbd"
    excluded: true
    exclude_reason: "第 35 行 #include \"mock_dcd.h\"、第 36 行 #include \"mock_msc_device.h\"：这两个头由 Ceedling 调 CMock 生成，脱离 Ceedling 0.31.1（Ruby gem）无法产出；OHOS 构建 worker 上没有 Ruby 运行时。"
  - file: "test/unit-test/test/device/msc/test_msc_device.c"
    source: "tinyusb-0.18.0/test/unit-test/test/device/msc/test_msc_device.c"
    description: "1 个 Unity 用例 test_msc，经 CMock 桩 mock_dcd 驱动 MSC 类状态机"
    command: "./test_msc"
    excluded: true
    exclude_reason: "第 39 行 #include \"mock_dcd.h\"，同上：依赖 CMock 生成的桩，需要 Ruby/Ceedling。"

# 上游另有两条非 Ceedling 的测试通道，都不在 test/unit-test 之下：
#   - test/fuzz/：libFuzzer 入口（fuzz.cc / dcd_fuzz.cc / msc_fuzz.cc /
#     net_fuzz.cc / usbd_fuzz.cc）+ device/{cdc,msc,net,net_ncm} 语料，
#     需要 -fsanitize=fuzzer 且以长时间随机输入跑，OHOS CI worker 不适用。
#   - test/hil/：Python 硬件在环（hil_test.py 等），必须插真实 USB 板子。
# 两者都在 body 的「验证结果」里逐条说明未执行原因。

test_package_tests:
  - file: test_tinyusb.c
    description: "消费者测试：版本常量、tu_fifo 读写往返、USB 描述符长度/类型辅助函数、OPT_MCU_NONE/OPT_OS_NONE 下 tusb_init、OHOS aarch64 描述符结构体打包布局（鸿蒙特有）、tud_task 无 OS 等待原语非阻塞（鸿蒙特有）、默认配置关闭主机栈且设备栈在跑（鸿蒙特有），共 7 组断言"
    command: "./test_tinyusb"

# 测试断言总数（消费者程序 7 组行为断言；上游可执行的 15 个 Unity 用例 94 处 TEST_ASSERT）
assertion_count: 7
