version: "0.18.0"
software: tinyusb
status: built
build_date: "2026-09-20"
conan_ref: "tinyusb/0.18.0"
build_system: direct-cc

source:
  url: "https://github.com/hathach/tinyusb/archive/refs/tags/0.18.0.tar.gz"
  sha256: "e7fa1bd723213749a0362c79eaccc99e84c8adea8f0a63588c4e4812608b7aa9"
  tar_format: tar.gz

build:
  system: direct-cc
  configure_options:
    - "CFG_TUSB_MCU=OPT_MCU_NONE"
    - "CFG_TUSB_OS=OPT_OS_NONE"
    - "TUP_DCD_ENDPOINT_MAX=8"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "tinyusb 是源码库而非可独立构建的库：它没有自带构建入口（src/CMakeLists.txt 只是个 add_tinyusb() 函数，src/tinyusb.mk 同理），全部编译期行为由使用者的 tusb_config.h 决定。要在 OHOS 上产出可直接链接的 libtinyusb.a，必须先把这份配置钉死并随包发运（ref: files/tusb_config.h）"
  - "tinyusb 0.18.0 的 src/portable/ 下没有任何面向 Linux/OHOS 的控制器后端（只有 vendor 中立的 template/ 一对），OHOS 也不在上游四个 OSAL 端口（FreeRTOS/Mynewt/Zephyr/RT-Thread）之内，因此 OHOS 适配必然走 CFG_TUSB_MCU=OPT_MCU_NONE + CFG_TUSB_OS=OPT_OS_NONE，并额外编入 src/portable/template/{dcd,hcd}_template.c（这两个文件不在上游 CMake 的源文件列表里，上游留给 MCU port 提供）"
  - "OPT_MCU_NONE 的 template 端口是不完整的：dcd_template.c 只实现了 dcd_edpt_close_all()，dcd.h:184 声明的 dcd_edpt_close() 与 usbd.h:76 声明的 dcd_int_handler() 在模板端口里没有定义，链接期必为强未定义符号；加上 OPT_OS_NONE 下 tusb.h:173 的 tusb_time_millis_api()，OHOS 消费者至少要补 3 个钩子（ref: test_package/test_tinyusb.c）"
  - "Ceedling 的 project.yml 用 `:source: ../../src/**` 把 src/ 下每个子目录都加进 include 搜索路径，所以上游用例写的是 `#include \"tusb_fifo.h\"` / `\"tusb_common.h\"` 而非 `\"common/tusb_fifo.h\"`；脱离 Ceedling 手工编译这些用例时，只给 -Isrc 会 fatal error: file not found，必须补全所有子目录（ref: conanfile.py _src_include_dirs()）"
  - "0.18.0 起 CFG_TUD_NET 被拆分为 CFG_TUD_ECM_RNDIS / CFG_TUD_NCM，沿用旧名只会触发 tusb_option.h:529 的 #warning 再回填；TUP_DCD_ENDPOINT_MAX 对不在 tusb_mcu.h 里的 MCU（含 OPT_MCU_NONE）会 #warning 后默认 8，在 tusb_config.h 里显式钉成 8 可让整个构建零警告"
  - "上游 CMake 的权威源文件列表是 src/CMakeLists.txt 的 add_tinyusb()：23 个文件，含 class/vendor/vendor_host.c，不含 src/portable/template/*；class/bth/bth_device.c 与 class/cdc/cdc_rndis_host.c 不在其中，本包与上游两条构建路径保持一致"
  - "上游 test/unit-test 的 4 个测试文件中，test_common_func.c 与 test_fifo.c 不使用任何 CMock 桩（只 include unity.h + tusb 头），因此可以用源码树内 vendored 的 Unity（test/unit-test/vendor/ceedling/vendor/unity/src）配一个最小 runner 直接编译运行；device/usbd 与 device/msc 则 #include CMock 生成的 mock_*.h，必须依赖 Ruby/Ceedling 0.31.1（ref: files/unity_runner_*.c）"
