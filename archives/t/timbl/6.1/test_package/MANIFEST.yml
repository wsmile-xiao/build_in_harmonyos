# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: timbl/6.1
homepage: "https://github.com/LanguageMachines/timbl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# timbl 6.1 source includes demos/ directory with API test files (api_test1-6.cxx)
# These are example programs, not automated tests
upstream_tests:
  - file: demos/api_test1.cxx
    source: timbl-6.1/demos/api_test1.cxx
    description: "API example: creates TimblAPI experiment with IGTREE algorithm"
    command: "./api_test1"
  - file: demos/cross_val.test
    source: timbl-6.1/demos/cross_val.test
    description: "Cross-validation test data file"
    command: "N/A (test data, not executable)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cxx
    description: "消费者测试: 创建 TimblAPI 实验对象验证库链接"
    command: "./test_timbl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
