# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tng/1.8.2
homepage: "https://github.com/gromacs/tng"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build build && ./build/bin/tests/tng_testing"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# tng_testing: 用户测试源 src/tests/tng_io_testing.c（独立可执行，11 个检查点全过）
# compression: src/tests/compression/testsuite.c + test1..78.h（TNG_BUILD_COMPRESSION_TESTS=ON，
#              78 gen + 78 read 二进制；上游默认 OFF，探索期使能后实测 gen 86/87、read 77/78）
upstream_tests:
  - file: tng_io_testing.c
    source: tng-1.8.2/src/tests/tng_io_testing.c
    description: "上游主测试程序（版本控制/初始化/读写文件/粒子数据/工具函数/追加/容器拷贝共 11 项检查点）"
    command: "./tng_testing"
  - file: testsuite.c
    source: tng-1.8.2/src/tests/compression/testsuite.c
    description: "压缩库测试套件（test1.h..test78.h 参数化，gen 写入 + read 读回）"
    command: "test_tng_compress_read{1..78} / test_tng_compress_gen{1..78}"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 tng_trajectory_init/tng_version/tng_trajectory_destroy 真实 API 并核验版本号"
    command: "./test_tng"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 89
