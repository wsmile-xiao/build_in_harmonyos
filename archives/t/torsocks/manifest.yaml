software: torsocks
display: "torsocks"
description: "透明 SOCKS 代理包装器：LD_PRELOAD 拦截 socket 调用并转发到 Tor SOCKS5 代理"
category: network
homepage: "https://gitlab.torproject.org/tpo/core/torsocks"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 git 归档无 configure，build() 需 autoreconf -fi 自举（tool_requires automake/1.18 + libtool/2.5.4）"
    - "生成的 configure 需去除 umask 077（E114：HMDFS 下 0700 临时目录不可写）"
    - "显式 --build/--host=aarch64-unknown-linux-ohos（E007：config.guess 不识别 HarmonyOS）"
    - "LIBC_NAME 探测回退改为 libc.so（OHOS musl 无 libc.so.6，运行期 dlopen 依赖）"
    - "tests 链接去掉 -lpthread（OHOS musl 把 pthread 并入 libc）"
    - "make -j1（E074：HMDFS jobserver fifo EPERM）"
  common_dependencies: []

versions:
  "2.5.0":
    status: building
    build_date: "2026-08-15"
    source_url: "https://gitlab.torproject.org/tpo/core/torsocks/-/archive/v2.5.0/torsocks-v2.5.0.tar.bz2"
