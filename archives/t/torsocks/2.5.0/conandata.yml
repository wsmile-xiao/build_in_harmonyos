patches:
  "2.5.0":
    - patch_file: "patches/0001-configure-ac-ohos-libc.patch"
      patch_description: "LIBC_NAME 探测回退改为 libc.so（OHOS musl 无 libc.so.6，运行期 dlopen 真实 libc 的依赖）"
      patch_type: "portability"
    - patch_file: "patches/0002-tests-drop-lpthread.patch"
      patch_description: "OHOS musl 把 pthread 并入 libc，无独立 libpthread.so，去掉 tests 链接的 -lpthread"
      patch_type: "portability"
