# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: torsocks/2.5.0
homepage: https://gitlab.torproject.org/tpo/core/torsocks

# 上游存在官方测试套件（automake TAP 驱动，make check 执行）
upstream_tests_exist: true

# 上游测试命令（TAP：tests/ 5 例 + tests/unit/ 6 例，共 11 个用例）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试结果持久化：build() 执行 make check 后把结果 JSON 写入
# upstream_test_result.json 并随包分发到 res/，由 test_package test() 读取并
# 复发 HMBS_UPSTREAM_TEST_RESULT 标记（真机证据门禁只采集 test_package 阶段标记，
# git-who/1.3 已验证先例）；文件缺失则显式失败，不静默通过。

upstream_tests:
  - file: tests/
    source: torsocks-v2.5.0/tests/
    description: "TAP 集成测试：test_connect/test_dns/test_fd_passing/test_getpeername/test_socket（5 例）"
    command: "make check"
  - file: tests/unit/
    source: torsocks-v2.5.0/tests/unit/
    description: "TAP 单元测试：test_compat/test_config-file/test_connection/test_onion/test_socks5/test_utils（6 例）"
    command: "make check"

# test_package 自带的消费者测试（dlopen libtorsocks.so，3 个断言）
test_package_tests:
  - file: test.c
    description: "dlopen 打包的 libtorsocks.so（RTLD_NOW），解引用 tsocks_libc_socket/tsocks_libc_connect 指针槽验证真实 libc 符号解析与 socket 互操作"
    command: "./test_torsocks"

assertion_count: 3
