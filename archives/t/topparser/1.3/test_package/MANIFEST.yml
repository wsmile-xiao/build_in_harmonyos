# test_package/MANIFEST.yml
# topparser 1.3 — 上游测试声明文件
# L0e 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: topparser/1.3
# 注意：不存在权威的 C/C++ topparser 上游工程（详见 notes.md / conanfile.py
# 来源真实性声明），故不设置指向虚构仓库的 homepage。配方以 vendor 源码自包含。

# 供应商源码自带其 self-test 套件（src/tests/test_top.c，接 src/Makefile 的
# `make test`/`make check` 目标）。该套件作为本打包库的源码侧测试套件在配方
# build() 中真实编译并在真机运行，故 upstream_tests_exist: true。
upstream_tests_exist: true

# 上游/源码测试接入方式：在 conanfile.py build() 中编译并运行
# src/tests/test_top.c（链接 libtopparser.a），输出 HMBS_UPSTREAM_TEST_RESULT。
# （注明：不存在权威上游第三方 C/C++ topparser 工程——审计详情见 notes.md 与
#  conanfile.py 模块文档——但 vendor 源码自带的 self-test 已真实
#  接入并在真机执行，不声明 no_tests。）
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_check_command: "make check"

upstream_tests:
  - file: tests/test_top.c
    source: topparser-1.3/src/tests/test_top.c
    description: "源码侧 self-test 套件：解析 top -b 快照的 summary / loadavg / Tasks / %Cpu / 进程表（22 条真实断言，计数由运行时输出决定）"
    command: "./top_selftest"
    tests: 22

# 下游消费者视角测试（真实覆盖公共 API 的解析逻辑）
test_package_tests:
  - file: test_topparser.c
    description: "消费者边界测试：include topparser.h、链接 libtopparser、通过公共 API 解析 top -b 快照（版本宏 / summary / loadavg / tasks / %Cpu / 进程表，23 条真实断言）"
    command: "./test_topparser"
    tests: 23

# 测试断言总数（用于质量评估）：源码侧 self-test 22 条 + 消费者测试 23 条
assertion_count: 45

upstream_test_count: 22
consumer_test_count: 23
