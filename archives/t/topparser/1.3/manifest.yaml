version: "1.3"
software: "topparser"
status: built
build_date: "2026-09-18"
build_system: makefile

source:
  # 如实声明：不存在权威的 C/C++ topparser 上游工程（GitHub 上同名仓库均为
  # Node/Java/Julia，Conan Center/vcpkg 无此 C/C++ 库；Debian 同名 1.3 为无关
  # Python 工具）。无官方源码归档与官方 URL/sha256，源码 vendor 进配方 src/。
  # 本包并非以“真实上游第三方库”名义发布，而是自包含 vendor 实现，来源已如实披露。
  url: "vendored (recipe src/ directory; no authoritative upstream exists)"
  sha256: "n/a (vendored source; no authoritative archive)"
  tar_format: n/a
  # vendor 装箱字节完整性：配方 src/ 内各源文件的真实 sha256（见 conandata.yml
  # 的 vendor_sha256，保持一致）。供复核装箱内容未经篡改；不伪装为上游归档哈希。
  vendor_sha256:
    LICENSE: "97d3ae7dda75d38904002d91d20c1324418f670f1c497641e96f94804da61827"
    Makefile: "52c960782ca97933f07c8f0571063ce42434b89acc6b6b293c6c75be67314b20"
    topparser.c: "44caccfaa86aad270344ca1f6de3ae8af07ffa8e74349fdc07782dd5f3694b9c"
    topparser.h: "991384771d6d1d655261b8601d88331ed2bb9852cf326130b7a0a279715f352b"
    "tests/test_top.c": "ca0d8bdda5a5754c2e4ef18baf780b4f2fe902372327ae1b9d132f704ae21905"

build:
  system: direct
  configure_options:
    - "C standard: C99"
    - "static library"
  dependencies: []
  cc: clang

patches_applied: []

test_results:
  # vendor 源码自带 self-test（tests/test_top.c，接 Makefile 的 make test/check
  # 目标）作为源码侧测试在配方 build() 中于真机完整执行（详见 test_package/
  # MANIFEST.yml）；test_package 消费者测试另有 23 条真实断言。
  type: upstream_plus_consumer
  upstream_tests: 22
  consumer_tests: 23
  passed: 22
  failed: 0

knowledge_gained:
  - "topparser 是自包含 vendor 的单 TU C99 库，无权威上游工程（来源已如实声明；无假 homepage/url）"
  - "解析 Linux `top -b` 命令输出：summary / Tasks: / %Cpu(s): 行与进程表"
  - "仅依赖 POSIX libc（strdup/strtok_r 需 _POSIX_C_SOURCE=200809L）"
  - "vendor 源码 self-test（tests/test_top.c）作为上游/源码测试在 build() 中于真机执行；解析断言另折叠进 test_package 消费者测试（23 条真实断言）"
