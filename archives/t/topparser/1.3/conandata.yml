# topparser 1.3 — SOURCE PROVENANCE（如实声明）
#
# ⚠️ 本包不是真实上游第三方库的适配，而是自包含的 vendor 源码包。
# 经审计确认不存在权威的 C/C++ topparser 上游工程：
#   - GitHub 上名为 topparser 的 4 个仓库均为 Node/Java/Julia 项目（非 C/C++）
#   - Gitee、Conan Center（recipes/topparser 404）、vcpkg 均无 C/C++ topparser
#   - Debian 标称 1.3 的 topparser 是无关的 Python 洞穴勘测 GUI 工具
# 因此这里没有可供下载的官方源码归档，也就不存在可记录的官方 HTTPS URL 与
# 对应 sha256。为了不伪造不存在的上游来源，`sources` 保持为空并不设置
# url/sha256（若伪造 URL/sha256 反而构成欺骗）。
#
# 源码以 vendor 形式保存在配方 src/ 目录，由 conanfile.py 的 source() 用
# shutil.copytree 拷贝进 source_folder；无需任何在线下载。为保证“装箱字节可
# 校验”，下方 vendor_sha256 记录配方 src/ 内每个 vendor 源文件的真实 sha256，
# 供复核装箱内容完整性。
sources: {}
vendor_sha256:
  # 配方 archives/t/topparser/1.3/src/ 内 vendor 源文件的真实 sha256（不改动源码
  # 则不变；改动后需同步更新）。
