# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 对 umask 077 新建目录强制 setgid（umask 077 + SGID → drwx--S---），owner 也无法在其中写文件；autoconf 生成的 configure/config.status 用 `(umask 077 && mktemp -d \"./confXXXXXX\")` 建临时目录，因此报 `./confXXXXXX/subs1.awk: Permission denied` / `could not setup config files machinery`。补丁把 configure 内两处 `umask 077` 改为 `umask 022` 即修复（知识库 E129/E112/E136；与已合入的 a52dec/0.7.4 同款补丁一致）。ref: E129, E112, E136"
  - "teseq 自带的 mdate-sh 无法解析 HarmonyOS toybox `ls` 输出的 ISO-8601 日期（无 Jan..Dec 月份名）；automake 的 stamp-vti 规则调用它，解析失败后裸 `set` 把整个环境变量表写入 doc/version.texi，进而触发 makeinfo（OHOS 无 texinfo）重建 doc/teseq.info → make install失败。补丁 0001-Makefile.in.patch 把 stamp-vti 规则改为 no-op，保持发行 tarball 自带的 version.texi/info/man 原样安装；配合 in-source 构建（同 a52dec/0.7.4）。ref: DRAFT-11103"
  - "teseq 的两个 libcheck 单元测试由 configure.ac 的 `PKG_CHECK_MODULES([libcheck], [check], , :)` 可选启用；ohpcd 制品仓已有 check/0.15.2，配方以 test_requires + PkgConfigDeps 暴露后，make check 会额外构建并执行 src/test-ringbuf（7 checks）与 src/test-inputbuf（3 checks）。ref: E547"
  - "check/0.15.2 包内同时含 libcheck.a 与 libcheck.so，链接器优先 .so，需将其 lib/ 加入 LD_LIBRARY_PATH 才能运行测试；且 libcheck 的 open_tmp_file 探测顺序为 TEMP → P_tmpdir(/tmp，OHOS 只读) → TMPDIR → \".\"，仅设 TMPDIR 无效，必须设 TEMP（知识库 E547；同 ezstream/1.0.2 的 LD_LIBRARY_PATH 经验）。ref: E547"

knowledge_ref:
  - "E129"
  - "E112"
  - "E136"
  - "E547"

