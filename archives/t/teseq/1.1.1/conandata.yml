sources:
  url: "https://ftp.gnu.org/gnu/teseq/teseq-1.1.1.tar.gz"
  sha256: "32fbd22bc1e16796a02a3915ac6c29015607a19b00a50de570c747860b009622"

patches:
  - patch_file: "patches/0001-Makefile.in.patch"
    patch_description: >-
      Turn the automake stamp-vti rule into a no-op: it calls mdate-sh, which
      cannot parse the ISO-8601 dates printed by the HarmonyOS ls (and dumps
      the environment into doc/version.texi when parsing fails), while
      texinfo/makeinfo are unavailable on the target.  The release tarball's
      doc/version.texi, doc/teseq.info and the manpages stay as shipped.
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: >-
      Use umask 022 for the config.status temp directory: HMDFS force-sets the
      setgid bit, so umask 077 yields a directory that rejects writes even from
      its owner ("could not setup config files machinery", knowledge base E129)
    patch_type: "portability"
