# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点证据 (R51)：
#   1. 上游 GNU 官方源包 teseq-1.1.1.tar.gz（sha256
#      32fbd22bc1e16796a02a3915ac6c29015607a19b00a50de570c747860b009622）
#      含 tests/ 目录，内有 28 个子目录，每个含 input/expected（部分含 vars）；
#   2. tests/run.in 的 TESEQ_TESTS 变量逐条列出这 28 个用例名，与目录数
#      一一对应（清点证据：`ls -d tests/*/ | wc -l` = 28）；
#   3. src/test-ringbuf.c、src/test-inputbuf.c 为 2 个基于 libcheck 的 C 单元
#      测试，由 Makefile.am 的 check_PROGRAMS 注册，仅当 PKG_CHECK_MODULES
#      探测到 check 时才启用（AM_CONDITIONAL DO_CHECK_TESTS）；本配方以
#      test_requires check/0.15.2 + PkgConfigDeps 使其真实启用；
#   4. 主测试套件 tests/run-tests 为纯 POSIX sh 脚本，除 teseq/reseq 自身外
#      无任何外部依赖，在 OHOS 目标上完整运行。
# 因此上游用例数 = 28（teseq 套件）+ 28（reseq 套件）+ 2（libcheck 单元测试程序）,
# 另有 exercise-seqs 穷举脚本。

package: teseq/1.1.1
homepage: "https://www.gnu.org/software/teseq/"

# 上游测试命令 (Makefile.am: check: check-teseq check-reseq check-seqs)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# （build() 调用 autotools.make(target="check", args=["-j1"])，
#  在 OHOS 目标设备上真实执行，test_package 只做消费者视角回归）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（在 HarmonyOS PC 目标上实测，2026-09-20）
upstream_tests:
  - name: teseq
    command: "make check-teseq  # ./run-tests"
    cases: 28
    passed: 28
    failed: 0
    rc: 0
    note: "以 tests/<name>/expected 为基准比对 teseq 的实际输出"
  - name: reseq
    command: "make check-reseq  # ./run-tests -r"
    cases: 28
    passed: 28
    failed: 0
    rc: 0
    note: >-
      反转 teseq 输出；其中 prompt-descript-only 与 hardstatus-color 两个
      用例在 vars 中声明 run_reseq=false，由上游 harness 判为 (skipped)，
      上游统计仍计为通过
  - name: exercise-seqs
    command: "make check-seqs  # TESEQ=./teseq ./exercise-seqs"
    cases: 0
    passed: 0
    failed: 0
    rc: 0
    note: "Perl 穷举脚本（无固定用例计数），输出 'Results: All runs look okay.'"
  - name: libcheck-unit-tests
    command: "make check-TESTS  # src/test-ringbuf, src/test-inputbuf"
    cases: 2
    passed: 2
    failed: 0
    rc: 0
    note: >-
      check/0.15.2 作为 test_requires 使 configure 探测成功；单个程序内部断言
      数分别为 7 与 3（100%: Checks: 7/3, Failures: 0, Errors: 0）

# test_package 中自带的测试 (消费者视角验证，不替代上游测试统计)
test_package_tests:
  - file: conanfile.py
    description: >-
      消费者视角回归（无编译期 API，teseq 为命令行工具）：包内 bin/teseq 与
      bin/reseq 存在且可执行；`teseq --version` 报 GNU teseq 1.1.1；
      `teseq --help`/`reseq --help` 暴露 --timings；对
      "ESC[1mBOLD ESC[0m" 实输入验证 SGR 描述生成与字面文本透传；
      reseq 两参数反转结果与原始输入 cmp 逐字节一致（往返闭环）；
      1.1.1 修复的 fuzz 回归输入 "ESC!!DEL" 能即时正常退出
    command: "conan create（test_package 阶段自动执行 test()）"

# 测试断言总数 (精确值)：13 个 self.run() 断言
assertion_count: 13
