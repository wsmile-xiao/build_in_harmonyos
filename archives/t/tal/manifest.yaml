software: tal
display: "tal"
description: "文本过滤器：把多行文本共同的结尾字符（如 */、宏续行符）对齐到同一列"
category: utility
homepage: "https://thomasjensen.com/software/tal/"
license: LicenseRef-tal
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游平台目标 make linux 带 -ansi：musl 在 __STRICT_ANSI__ 下隐藏 strdup/strcasecmp 声明，C89 隐式 int 声明截断 64 位指针，编译只有 -Wint-to-pointer-cast 告警、运行即 SIGSEGV → 改用通用目标 make tal + clang 默认 C 方言，并加 -Werror=implicit-function-declaration 防回归"
    - "make 不带目标且未设环境变量 OS 时落到 _tal 目标：只打印提示、退出 0、不产出二进制 → 配方显式指定 tal 目标"
    - "编译器取自 Conan tools.build:compiler_executables（R33），经 make 命令行变量覆盖上游 CC/CFLAGS"
    - "-static-pie 链接：保留 PIE/RELRO/BIND_NOW，同一产物真机原生运行、x86 运行器经 qemu-aarch64 运行"
  common_dependencies: []

versions:
  "1.9":
    status: built
    build_date: "2026-09-24"
    conan_ref: "tal/1.9"
