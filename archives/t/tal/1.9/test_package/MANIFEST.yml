# test_package/MANIFEST.yml — tal 1.9

package: tal/1.9
homepage: "https://thomasjensen.com/software/tal/"

upstream_tests_exist: false
upstream_test_audit: "tal-1.9.tar.gz contains exactly 8 files (FILES, INSTALL, LICENSE, Makefile, tal.1, tal.c, tal-1.9.man.ps, tal19.txt): no test/ or tests/ directory, no test sources, and the Makefile only has the platform targets (all, aix41, osf1, hpux9, hpux10, irix5, irix6, linux, sunos4, sunos5 and their *_tal helpers), $(BIN)/tal, _tal, clean and love; there is no check or test target. Upstream automated tests: 0."
upstream_check_command: "none — upstream Makefile has no check/test target"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# The upstream examples page documents 6 examples / 9 command variants with
# exact input and output; test_tal.sh embeds them as golden vectors.
upstream_documented_examples:
  source: "https://thomasjensen.com/software/tal/examples.html"
  count: 9

test_package_tests:
  - file: test_tal.sh
    description: "Runs the packaged bin/tal (natively on AArch64, via qemu-aarch64 elsewhere): -v and -h output, the 9 upstream example vectors compared byte for byte, explicit trailer (-e), infile/outfile arguments, rejection of an invalid -t value, and no zero-byte outfile on an illegal third file name. Fails if the packaged binary is missing."
    command: "bash test_tal.sh <package>/bin/tal"
  - file: tal_consumer.c
    category: "harmonyos-specific consumer use case"
    description: "HarmonyOS PC build-pipeline consumer: conanfile.py build() generates a ragged 1202-line X-macro header (one line is 3000 columns), the packaged bin/tal aligns its continuation backslashes (infile/outfile), CMake with the OHOS toolchain compiles tal_consumer.c against the tal output, and test() runs the program, which lints the header it was built from and uses the compiled-in error table (1200 codes, value sum, E_BLOB from the 3000-column line). OHOS musl LINE_MAX is 4096 and tal reads lines in LINE_MAX chunks: a LINE_MAX=2048 build of tal splits the long line and the consumer no longer compiles; the upstream -ansi build crashes; unaligned input fails the lint."
    command: "tal <gen>/error_table.h.in <gen>/error_table.h; cmake build; tal_consumer <gen>/error_table.h"

test_files:
  - path: "test_package/tal_consumer.c"
    test_type: "R34 / harmonyos-specific consumer use case"
    build: "test_package/CMakeLists.txt + conanfile.py build()"
  - path: "test_package/test_tal.sh"
    test_type: "R34"
    assertion_count: 15

harmonyos_specific_test_count: 1
test_package_test_count: 2
assertion_count: 15
