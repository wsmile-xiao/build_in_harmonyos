software: tal
version: "1.9"
status: built
build_date: "2026-06-17"

source:
  url: "https://thomasjensen.com/software/tal/tal-1.9.tar.gz"
  sha256: ""
  tar_format: tar.gz

build_system: makefile

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  cflags: "-fPIC -O2"
  compile_cmd: "clang -fPIC -O2 -o tal tal.c"
  no_configure: true
  no_make_check: true
  no_make_install: true

patches_applied: []

knowledge_gained:
  - "tal 1.9 是单文件 C 程序（tal.c），无 configure 脚本，无 make install/check 目标"
  - "原始 Makefile 硬编码 CC=gcc 和 -ansi 标志；本平台无 gcc 需用 clang"
  - "-ansi 标志导致 strdup 未声明（返回 int），64 位平台指针截断引发 segfault；去掉 -ansi 解决"
  - "手动安装：cp tal 到 bin/，cp tal.1 到 man/man1/"
