knowledge_gained:
  - "上游 Makefile 的平台目标（make linux/sunos5/...）硬编码 CC=gcc 与 -ansi；-ansi 定义 __STRICT_ANSI__，musl 随之隐藏 strdup()/strcasecmp() 的 POSIX 声明，C89 隐式 int 声明把 64 位返回指针截断为 32 位——仅报 6 条 -Wint-to-pointer-cast 告警即编译成功，运行首行输入即 SIGSEGV（ref: knowledge/drafts/E585-draft-04E7）"
  - "改走通用目标 make tal（clang 默认 C 方言），并加 -Werror=implicit-function-declaration 把同类回归拦在编译期（ref: knowledge/drafts/E585-draft-04E7）"
  - "上游 all 目标依赖环境变量 OS；OS 未设置时落到 _tal 目标只打印提示、退出码 0 且不产出二进制（ref: notes.md 问题 #2，tal 专属，未单独立条）"
