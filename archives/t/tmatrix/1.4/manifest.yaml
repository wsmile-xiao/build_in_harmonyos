# ============================================================
# Knowledge gained
# ============================================================

knowledge_gained:
  - "CMake FindCurses has no sysroot notion: it locates a seeded CURSES_LIBRARY but link_libraries(${CURSES_LIBRARIES}) then contributes the archive without any include directory, so '#include <ncurses.h>' fails. Resolving the Conan ncurses CONFIG package (ncurses::ncurses) carries both."
  - "Upstream set(CMAKE_CXX_FLAGS ...) / set(CMAKE_EXE_LINKER_FLAGS ...) overwrite the cache entries Conan injects (libc++ selection, build-type flags); appending instead keeps both."
  - "A CMake custom target that shells out to gzip fails the whole build when gzip is absent, because the target is part of 'all'; find_program() plus a fallback keeps the build honest."
  - "ncurses 6.6 as published ignores $TERMINFO when euid == 0 (_nc_env_access() returns false without USE_ROOT_ENVIRON), so a root-run test cannot reach a terminfo database. Consumers must assert on the render path being entered, not on a painted frame, when the suite runs as root."
  - "runenv_info is last-writer-wins across the graph: a package must not re-declare TERMINFO/TERMINFO_DIRS that an ncurses dependency already exports, or it silently repoints the variable at a directory it never creates."
  - "E077: a freshly linked OHOS executable carries only an unsigned .codesign placeholder, so the kernel refuses to load it and every exec reports 126 ('operation not permitted') however the file mode is set. Diagnose it by splitting assertions into exec-based vs read-only: a read-only ELF-header assertion passing next to every exec failing is the signature of an unsigned binary, not a permissions or filesystem problem. Fix is the four-step flow (llvm-objcopy --remove-section .codesign -> binary-sign-tool sign -selfSign 1 -> replace -> chmod 0755) in package(); the order is load-bearing because the signer refuses to overwrite an existing section."

