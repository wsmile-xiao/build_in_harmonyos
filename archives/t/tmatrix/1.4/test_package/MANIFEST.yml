# test_package/MANIFEST.yml - tmatrix 1.4
# Required by CI quality gate build_and_test.sh L0e. See docs/TEST_QUALITY_SPEC.md.
package: tmatrix/1.4
homepage: "https://github.com/M4444/TMatrix"

# ---------------------------------------------------------------------------
# Upstream test inventory (R51: count before adapting, then report what ran)
# ---------------------------------------------------------------------------
# The v1.4 release tarball ships no test suite:
#   * no tests/ or test/ directory
#   * CMakeLists.txt registers no ctest test (no enable_testing/add_test) and
#     declares no check/test target
#   * .github/workflows/ carries no test job
# Inventory command: `tar tzf <tarball> | grep -iE 'test|spec'` -> no matches
# in src/, include/ or the project root. Upstream ships a single `tmatrix`
# executable whose behaviour is its command-line surface, so the executable
# itself is the test subject below.
upstream_check_command: "cmake --build . --target help   # no check/test target"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ---------------------------------------------------------------------------
# test_package tests (executed by conanfile.py test() via self.run -> L0d)
# ---------------------------------------------------------------------------
test_package_tests:
  - file: test_tmatrix.sh
    description: |
      T1 --version prints 'tmatrix version 1.4' (tmatrix.h VERSION_NUMBER).
      T2 --help prints the Parser option table.
      T3 an unknown option is rejected before the render path is entered.
      T4 an out-of-range --steps-per-sec value is rejected the same way.
      T5 a fractional --fall-speed range (0.4,1.7 -- the feature 1.4 added, and
         a value the pre-1.4 integer-only parser could not take) is accepted and
         the render path is entered.
      T6 under a pseudo-terminal the render path is entered, proven by a painted
         escape sequence, the ncurses terminal-type diagnostic, or the loop still
         running when the timer fires.
      T6b when a terminfo database is reachable, the painted frame carries the
         bright-attribute and cursor-home escape sequences. Skipped, not failed,
         when no database is reachable (see notes.md: the published ncurses/6.6
         ignores $TERMINFO when euid == 0).
      T6c an out-of-range --fall-speed=99,100 never reaches curses.
      T7 the artifact is a 64-bit AArch64 PIE ELF, read from the ELF header
         with od(1).
    command: "sh test_tmatrix.sh <package-folder>/bin/tmatrix [qemu-aarch64 -L <sysroot>]"
    executed_by: "test_package/conanfile.py test() via self.run (L0d)"

upstream_test_count: 0
test_package_test_count: 9
# 8 always executed; T6b is conditional on a reachable terminfo database.
assertion_count: 8

# HarmonyOS-specific test (required >= 1 for the scoring competition):
#   T7 is a direct artifact assertion that the delivered binary is a 64-bit
#   AArch64 PIE ELF, and T5/T6 execute the OHOS ncurses wide-character render
#   path including the ioctl(TIOCGWINSZ) terminal-size probe -- behaviour only
#   the OHOS aarch64 build provides.
harmonyos_specific_tests:
  - "T7: delivered artifact is a 64-bit AArch64 PIE ELF"
  - "T5/T6: ncurses wide-char render path entered on OHOS aarch64 (initscr + TIOCGWINSZ probe)"
