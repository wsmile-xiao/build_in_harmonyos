# test_package/MANIFEST.yml
# 上游官方测试声明文件（L0e 要求）
# tau 1.0.0 = Muon（header-only C/C++ 微单元测试框架）

package: tau/1.0.0
homepage: "https://github.com/jasmcaus/tau"

# 上游测试命令（CMake 构建后运行 MuonInternalTests；本库实证为源码内构建）
upstream_check_command: "cmake --build . && ./test/InternalTests/MuonInternalTests"

# conanfile.py build() 中未集成上游测试（header-only 无编译阶段）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（MuonInternalTests：124 个 suite，124/124 通过）
upstream_tests:
  - file: test/InternalTests/main.c
    source: tau-1.0.0/test/InternalTests/main.c
    description: "Muon 测试框架入口（MUON_MAIN），注册 124 个测试 suite"
    command: "./build/test/InternalTests/MuonInternalTests"
  - file: test/InternalTests/test.c
    source: tau-1.0.0/test/InternalTests/test.c
    description: "C 语言断言宏测试（TEST 宏 38 个：CHECK/REQUIRE/字符串/浮点）"
    command: "./build/test/InternalTests/MuonInternalTests"
  - file: test/InternalTests/test.cpp
    source: tau-1.0.0/test/InternalTests/test.cpp
    description: "C++ 断言宏测试（TEST 宏 65 个 + TEST_F fixture 1 个）"
    command: "./build/test/InternalTests/MuonInternalTests"
  - file: test/InternalTests/DeathTests/test_assertion_macros.c
    source: tau-1.0.0/test/InternalTests/DeathTests/test_assertion_macros.c
    description: "C 断言死亡测试（生成数据，~7000 断言/场景）"
    command: "./build/test/InternalTests/MuonInternalTests"
  - file: test/InternalTests/DeathTests/test_string_macros.c
    source: tau-1.0.0/test/InternalTests/DeathTests/test_string_macros.c
    description: "C 字符串宏死亡测试（生成数据）"
    command: "./build/test/InternalTests/MuonInternalTests"
  - file: test/InternalTests/DeathTests/test_assertion_macros.cpp
    source: tau-1.0.0/test/InternalTests/DeathTests/test_assertion_macros.cpp
    description: "C++ 断言死亡测试（生成数据）"
    command: "./build/test/InternalTests/MuonInternalTests"
  - file: test/InternalTests/DeathTests/test_string_macros.cpp
    source: tau-1.0.0/test/InternalTests/DeathTests/test_string_macros.cpp
    description: "C++ 字符串宏死亡测试（生成数据）"
    command: "./build/test/InternalTests/MuonInternalTests"

# test_package 消费者验证（仅用安装后的公开头文件与 API）
test_package_tests:
  - file: test.c
    description: "消费者视角验证：include <Muon/Muon.h>，运行 6 个真实断言 suite"
    command: "./test_tau"

# 上游断言总数（MuonInternalTests 运行输出：124 suites，0 failed）
assertion_count: 124
