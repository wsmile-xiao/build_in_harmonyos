# 软件级 manifest — tau
# 遵循 ARCHIVE-SPEC v2.0

software: tau

display: "Muon (tau)"

description: "Muon — A Micro Unit Testing Framework for C/C++ (header-only)"

category: library

homepage: "https://github.com/jasmcaus/tau"

license: MIT

# 常用构建系统
build_system: cmake

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.0":
    status: published
    build_date: "2026-09-19"

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "header-only 库：无需编译，配方 package_type=header-library，打包 Muon/ 头文件到 include/Muon/"
    - "断言宏 CHECK/REQUIRE 必须携带消息参数（__VA_ARGS__ 为空时 sizeof(char[]){}) 编译错误）"
    - "CHECK_STRNE/REQUIRE_STRNE/CHECK_STRNNE/REQUIRE_STRNNE 为 3 参宏（actual, expected, n）"
    - "POSIX 计时路径（clock_gettime/CLOCK_MONOTONIC）在 OHOS musl 下可用"
  common_dependencies: []
