software: tofuenv
display: "tofuenv"
description: "OpenTofu version manager inspired by tfenv"
category: utility
homepage: "https://github.com/tofuutils/tofuenv"
license: MIT

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 bash shell 脚本工具，无需编译，package() 直接复制脚本文件"
    - "所有脚本 shebang 需从 #!/usr/bin/env bash 改写为 #!/data/service/hnp/bin/bash"
    - "运行时依赖 jq（系统级工具，非 Conan 包）、curl、grep、sed、awk"
    - "tofuenv --version 通过 awk 解析 CHANGELOG.md 获取版本号，需打包 CHANGELOG.md"
  common_dependencies:
    - jq
    - curl

versions:
  "1.0.7":
    status: built
    build_date: "2026-07-15"
