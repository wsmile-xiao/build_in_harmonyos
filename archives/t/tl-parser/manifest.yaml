# 软件级 manifest — tl-parser
software: tl-parser
display: "tl-parser"
description: "TL (Type Language) schema compiler: parses a TL schema and exports a serialized .tlo file"
category: build-tool
homepage: "https://github.com/vysheng/tl-parser"
license: GPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 无 OHOS 平台模块；纯 POSIX 应用原生以 clang 构建时对 OHOS 设置 CMAKE_SYSTEM_NAME=Linux"
    - "上游 CMakeLists.txt 无 install 规则，补丁增加 install(TARGETS ... RUNTIME DESTINATION bin)"
    - "tl-parser 部分解析失败时仍返回退出码 0，消费者测试必须校验 .tlo 输出非空而非仅退出码"
  common_dependencies: []

versions:
  "0.0.0-git20210107.1933e76f":
    status: built
    build_date: "2026-09-18"
    conan_ref: "tl-parser/0.0.0-git20210107.1933e76f"
