sources:
  url: "https://github.com/vysheng/tl-parser/archive/1933e76f8f4fb74311be723b432e4c56e3a5ec06.tar.gz"
  sha256: "32c1c0b710a75bf7054f46d9db1790a5793d0615d019ef5ec2e20bb43889c94d"

patches:
  - patch_file: "patches/0001-cmakelists-add-install-target.patch"
    patch_description: "Add an install(TARGETS ... RUNTIME DESTINATION bin) rule so Conan can package the tl-parser executable"
    patch_type: "portability"
  - patch_file: "patches/0002-cmakelists-bump-min-cmake-version.patch"
    patch_description: "Bump cmake_minimum_required from 3.0 to 3.5 so CMake >= 4.x (which removed compatibility with CMake < 3.5) can configure the project"
    patch_type: "portability"
