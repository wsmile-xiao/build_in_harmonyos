build:
  system: "cmake"
  configure_options: []
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-cmakelists-add-install-target.patch"
  - "0002-cmakelists-bump-min-cmake-version.patch"

tests:
  upstream:
    # Upstream ships no automated test suite (see test_package/MANIFEST.yml
    # upstream_test_audit). tl-parser has no tests/ dir, no enable_testing()
    # and no ctest registration in CMakeLists.txt.
    exist: false
    command: ""
    cases: 0
    passed: 0
  adapted:
    # test_package runs the installed tl-parser binary on a real TL schema
    # fixture and asserts a non-empty serialized .tlo (TLS_SCHEMA_V2) is
    # produced. Exact pass count is filled from the HarmonyOS true-machine run.
    command: "tl-parser -e out.tlo <fixture>.tl"
    cases: 0
    passed: 0

knowledge_gained:
  - "tl-parser is a single-file CMake application (no library); upstream CMakeLists.txt has no install rule, so a patch adds install(TARGETS ... RUNTIME DESTINATION bin)."
  - "CMake has no OHOS platform module; a pure-POSIX CMake app builds natively with clang when CMAKE_SYSTEM_NAME=Linux is set for OHOS."
  - "tl-parser returns exit 0 for some parse failures, so a consumer test must verify the serialized .tlo output is non-empty (and carries the 0x3a2f9be2 TLS_SCHEMA_V2 magic), not just the process exit code."
