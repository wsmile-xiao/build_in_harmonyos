package: toolz/1.1.0
homepage: "https://github.com/pytoolz/toolz"
upstream_check_command: "python3 -m pytest toolz -q"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest toolz -q"
upstream_tests:
  - file: toolz/tests/
    source: toolz-1.1.0/toolz/tests/
    description: "Original upstream pytest suite; 186 passed on OHOS on 2026-10-01, executed separately after W3; no upstream changes"
    command: "python3 -m pytest toolz -q"
test_package_tests:
  - file: functional.py
    description: "Five consumer groups and 12 assertions for installed provenance, toolz operations, dictionaries, and tlz aliases"
    command: "python3 functional.py <absolute-package-folder> <results-json>"
assertion_count: 12
