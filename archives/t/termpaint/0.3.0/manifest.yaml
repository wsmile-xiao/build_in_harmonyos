version: "0.3.0"
software: "termpaint"
status: built
build_date: "2026-09-08"
build_system: "meson"

source:
  url: "https://github.com/termpaint/termpaint/archive/refs/tags/0.3.0.tar.gz"
  sha256: "30f4355629bd3999a2b3bd4c6d241e3165f625509832aa40e399d511ddf1ec98"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dttyrescue-fexec-blob=false"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "fix-strict-prototypes.patch"

knowledge_gained:
  - "Clang 15 treats empty parameter lists as deprecated (C2x), -Werror=strict-prototypes turns this into an error. Fix: add void to function definitions."
  - "Meson build system, need to set ttyrescue-fexec-blob=false for non-Linux platforms (OHOS)."
  - "All third-party deps (picojson, docopt, fmt, catch2) are bundled in source tree, no conan dependencies needed."
