software: termpaint
display: "termpaint"
description: "Low level terminal interface library for modern terminals"
category: library
homepage: "https://github.com/termpaint/termpaint"
license: BSL-1.0
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 构建系统，需设置 -Dttyrescue-fexec-blob=false（仅 Linux 支持 fexec blob）"
    - "Clang 15 -Werror=strict-prototypes 将空参数列表 () 视为错误，需补丁修复 termpaint_input.c"
    - "所有第三方依赖（picojson, docopt, fmt, catch2）内嵌源码树，无 Conan 依赖"
    - "产物为两个库: libtermpaint (核心) + libtermpaint_image (图像支持)"
  common_dependencies: []

versions:
  "0.3.0":
    status: built
    build_date: "2026-09-08"
    conan_ref: "termpaint/0.3.0"
