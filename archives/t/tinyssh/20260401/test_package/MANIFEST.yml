# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file to exist

package: tinyssh/20260401
homepage: "https://github.com/janmojzis/tinyssh"

# Upstream test command (from Makefile: `make test`)
upstream_check_command: "make test"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (run via `make test`)
upstream_tests:
  - file: test-crypto.c
    source: tinyssh-20260401/test-crypto.c
    description: "Crypto primitive tests (DH, hash, KEM, onetimeauth, sign, sort, verify)"
    command: "./test-crypto"
  - file: test-tinysshd.sh
    source: tinyssh-20260401/test-tinysshd.sh
    description: "Integration test for tinysshd server functionality"
    command: "sh runtest.sh test-tinysshd.sh"
  - file: test-tinysshd-makekey.sh
    source: tinyssh-20260401/test-tinysshd-makekey.sh
    description: "Test for tinysshd-makekey key generation"
    command: "sh runtest.sh test-tinysshd-makekey.sh"
  - file: test-tinysshd-printkey.sh
    source: tinyssh-20260401/test-tinysshd-printkey.sh
    description: "Test for tinysshd-printkey key printing"
    command: "sh runtest.sh test-tinysshd-printkey.sh"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Verifies tinysshd binary is installed and prints usage"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 20
