package: transmission-extra/4.1.3
homepage: https://transmissionbt.com/

upstream_test_in_build: false
upstream_tests:
  - directory: tests
    command: >-
      ctest --output-on-failure -j8 -E
      '^(LT\.DhtTest\.usesBootstrapFile|LT\.FileTest\.dirCreate|LT\.SessionTest\.sessionId)$'
    description: >-
      Transmission upstream GoogleTest and utility suite: 545 discovered,
      3 explicit OHOS/environment exclusions, 509 passed, 22 skipped by upstream,
      11 disabled by upstream, 0 failed.

upstream_test_statistics:
  discovered: 545
  explicit_exclusions: 3
  selected: 542
  passed: 509
  skipped: 22
  disabled: 11
  failed: 0

explicit_exclusions:
  - test: LT.DhtTest.usesBootstrapFile
    reason: "Requires an external DHT bootstrap file/network environment"
  - test: LT.FileTest.dirCreate
    reason: "HarmonyOS media storage does not preserve the requested POSIX 0700 permission bits"
  - test: LT.SessionTest.sessionId
    reason: "HarmonyOS file-lock semantics do not satisfy the local-session lock expectation"

test_package_tests:
  - file: test_tools.py
    type: integration
    count: 12
    description: "Validate exact package scope plus an end-to-end create/show/edit/show torrent workflow"
    command: "python3 test_tools.py <package_folder>"

assertion_count: 12
