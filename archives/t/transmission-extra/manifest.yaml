software: transmission-extra
display: "Transmission Extra"
description: "Transmission torrent create, edit, and show command-line utilities"
category: network
homepage: "https://transmissionbt.com/"
license: "GPL-2.0-only OR GPL-3.0-only"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Build only transmission-create, transmission-edit, and transmission-show"
    - "Disable GUI, daemon, web, NLS, systemd, inotify, and kqueue integrations"
    - "Use published curl/8.15.0 and bundled optional Transmission dependencies"
  common_dependencies:
    - curl

versions:
  "4.1.3":
    status: built
    build_date: "2026-08-18"
    source_url: "https://github.com/transmission/transmission/releases/download/4.1.3/transmission-4.1.3.tar.xz"
