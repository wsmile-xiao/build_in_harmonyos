# 软件级 manifest
# 文件位置: archives/t/tuptime/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: tuptime

# 显示名
display: "tuptime"

# 一句话描述
description: "Report historical and statistical system uptime, preserved across reboots (uptime with a SQLite register back end)"

# 分类标签
category: system

# 官网 URL
homepage: "https://github.com/rfmoz/tuptime"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 上游没有构建系统：交付物就是一个 Python 3 脚本（src/tuptime）。
# 本仓库按 SKILL「无构建打包族」变体 C（解释型脚本工具：只装不编）适配。
build_system: none

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游是单文件 Python 3 程序（src/tuptime，shebang #!/usr/bin/env python3）+ SQLite 数据库；无 C/C++ 源码、无 configure/make/cmake，属解释型脚本工具包（只装不编）"
    - "OHOS 平台识别：CPython on OpenHarmony 的 sys.platform == 'ohos'，上游只认 linux/bsd 两族，其余直接 logging.error('System = %s not supported') + sys.exit(1)，tuptime 在鸿蒙PC上完全不可用；补丁 0001 把 'ohos' 并入 os_linux() 分支"
    - "OHOS 用 HongMeng 内核但提供 Linux 的 /proc 接口（/proc/uptime、/proc/stat、/proc/sys/kernel/random/boot_id）与 clock_gettime(CLOCK_BOOTTIME/MONOTONIC)，正是 os_linux() 消费的全部接口，因此并入 linux 分支是实质适配而非 stub"
    - "运行期只依赖 Python 3 标准库（sqlite3/argparse/locale/platform/signal/logging），无第三方 Conan 依赖"
    - "默认 DB 路径 /var/lib/tuptime/tuptime.db 由发行版包管理器预置（tuptime-install.sh:131-149）；鸿蒙PC /var 只读且未预置该目录时，需用 -f 或上游 TUPTIME_DBF 环境变量指定可写路径（系统供给问题，不改默认常量）"
    - "上游 CI 只有 CodeQL 安全扫描（language=python），无业务测试作业；可运行测试入口为 debian/tests/ 两个 autopkgtest 与 misc/scripts/tuptime_dbcheck.py（10 用例）"
  # 跨版本通用依赖（无第三方依赖）
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "5.2.5":
    status: built
    build_date: 2026-10-04
