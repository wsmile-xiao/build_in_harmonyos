# test_package/MANIFEST.yml — tuptime/5.2.5
# CI (ci/conan/build_and_test.sh L0e) requires this file: it declares where the
# upstream tests are and which consumer tests the package itself adds.

package: tuptime/5.2.5
homepage: "https://github.com/rfmoz/tuptime"

# ── 上游测试台账（R51：先清点、再实跑、如实回填）────────────────────────────
# tuptime 上游没有 make check / ctest / pytest 注册，也没有 CI 测试作业；
# .github/workflows/ 下只有 codeql-analysis.yml（CodeQL 安全扫描，language=
# python，不执行业务用例）。逐处清点后的可运行测试入口只有两类：
#
#   debian/tests/exec-simple   Debian autopkgtest：`tuptime`（默认 DB）
#   debian/tests/exec-debug    Debian autopkgtest：`tuptime -v`
#                              → debian/tests/control 声明
#                                Restrictions: isolation-container
#                              → 需要 tuptime 已安装进 PATH（.deb 由
#                                debian/tuptime.install 装 src/tuptime → usr/bin）
#   misc/scripts/tuptime_dbcheck.py  SQLite 库结构与一致性校验器，10 个用例
#                              （### Test 1 ### … ### Test 10 ###，
#                               输出 Errors/Fixed 计数）
#
# 两个 autopkgtest 脚本原样使用上游文档化的 TUPTIME_DBF 环境变量覆盖默认
# DB 路径 /var/lib/tuptime/tuptime.db（src/tuptime:456-458：
# `if arg.db_file == DB_FILE and os.environ.get('TUPTIME_DBF')`）。鸿蒙PC 的
# /var 为只读挂载，且本会话非 root，无法预置 /var/lib/tuptime；TUPTIME_DBF
# 是上游自带的官方覆盖机制，不是对测试脚本的改写。
upstream_check_command: >-
  TUPTIME_DBF=<writable>/tuptime.db sh debian/tests/exec-simple &&
  TUPTIME_DBF=<writable>/tuptime.db sh debian/tests/exec-debug &&
  python3 misc/scripts/tuptime_dbcheck.py -f <writable>/tuptime.db
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: debian/tests/exec-simple
    description: >-
      Debian autopkgtest（debian/tests/control: Tests: exec-simple，
      Depends: @，Restrictions: isolation-container）。脚本内容仅
      `set -e` + `tuptime`：断言已安装的 tuptime 能写/读默认 DB 并以 0 退出。
      ohos_runner=false 的原因：脚本硬用默认路径 /var/lib/tuptime/tuptime.db，
      鸿蒙PC /var 只读且非 root，未预置该目录；实跑使用上游 TUPTIME_DBF 覆盖。
    sha256: "e800372bca7d46dad018b8c43ba59283a6fe9e0925ea69128bbedda23dc39b06"
    case_count: 1
    runnable_on_ohos: true
    result: "实跑通过（rc=0，输出 12 行汇总报告）"
  - file: debian/tests/exec-debug
    description: >-
      Debian autopkgtest（debian/tests/control: Tests: exec-debug，
      Restrictions: isolation-container, allow-stderr）。脚本内容仅
      `set -e` + `tuptime -v`：断言 verbose 模式（INFO 日志到 stderr）能跑通。
    sha256: "21a1a8eaff1d7652c96ecb1af3aa29502e973f3146ea2390681e0bfed8adc9e9"
    case_count: 1
    runnable_on_ohos: true
    result: "实跑通过（rc=0，stderr 26 行 INFO，stdout 13 行汇总报告）"
  - file: misc/scripts/tuptime_dbcheck.py
    description: >-
      上游自带的 SQLite 数据库校验器：逐项执行 Test 1…Test 10（表结构、
      user_version=5、时间戳单调性、downtime 一致性等），最后打印
      Errors/Fixed 计数。
    sha256: "76b5b4300c8358a1870408e3a5cd0116229c993e3784e7ac30041f57bb6b38ad"
    case_count: 10
    runnable_on_ohos: true
    result: "实跑通过（10/10 用例执行，Errors: 0, Fixed: 0, rc=0）"

upstream_sha256:
  src/tuptime: "397a129d7f2faa58a928b4aa2410e1bd278f7de37a34c09f7e05bf1f22499b8a（上游 tarball 内原文件；本仓库经补丁 0001 修改）"
  debian/tests/exec-simple: "e800372bca7d46dad018b8c43ba59283a6fe9e0925ea69128bbedda23dc39b06"
  debian/tests/exec-debug: "21a1a8eaff1d7652c96ecb1af3aa29502e973f3146ea2390681e0bfed8adc9e9"
  misc/scripts/tuptime_dbcheck.py: "76b5b4300c8358a1870408e3a5cd0116229c993e3784e7ac30041f57bb6b38ad"

# ── 适配后新增的消费者测试（conan create 自动执行）──────────────────────────
test_package_tests:
  - file: test_tuptime.py
    description: >-
      11 个用例，全部真实执行已安装的 bin/tuptime（R34）：version /
      summary-report / table-mode / list-mode / csv-mode / seconds-mode /
      kernel-mode / invert-mode / graceful-shutdown（-g 后校验 SQLite 行
      endst=1）/ install-layout（bin + man1 + licenses）/ 以及鸿蒙特有用例
      ohos-platform-backend。每条用例单独打印 PASS/FAIL/SKIP 与明细。
    command: "python3 test_tuptime.py"
  - file: conanfile.py
    description: >-
      消费者测试入口：VirtualRunEnv 把被测包 bin/ 加入 PATH，再用显式解释器
      启动已安装脚本（避免依赖 PATH 中可解析的 python3）。
    command: "conan create . --version=5.2.5 -pr:h=ci/conan/profiles/ohos-aarch64"

# 断言总数：11（消费者测试）；上游 12 个用例已在本机实跑，不在 conan create 内重复执行
assertion_count: 11
upstream_case_count: 12

# ── 鸿蒙适配说明 ────────────────────────────────────────────────────────────
ohos_notes:
  source_patches: >-
    1 个补丁（patches/0001-src-tuptime.patch，+4/-1）：把 sys.platform
    'ohos' 并入 os_linux() 后端选择。补丁不含任何平台宏。
  language: >-
    上游 100% 为 Python 3 源码（无 C/C++、无构建系统）。本包按 SKILL
    "无构建打包族" 变体 C（解释型脚本工具：只装不编）适配，无 build()，
    不产生伪造编译日志（R34）。
  runtime: >-
    运行期只需 Python 3 解释器（标准库 sqlite3 等），无第三方 Conan 依赖。
  default_db_path: >-
    上游默认 DB 路径 /var/lib/tuptime/tuptime.db 是 Debian/RPM 打包时由
    包管理器预置的（tuptime-install.sh:131-149）。鸿蒙PC /var 为只读挂载，
    未预置该目录时需用 -f 或上游 TUPTIME_DBF 环境变量指定可写路径；这是
    系统供给问题，非 OHOS 特有代码缺陷，故不修改默认常量（R1 最小改动）。
  ohos_case: >-
    ohos-platform-backend：在鸿蒙PC 上断言 tuptime 走 Linux 后端
    （stderr 出现 "System = Linux"）、退出码 0、且不出现
    "not supported"。移除补丁 0001 该用例即失败（回归保护）。
