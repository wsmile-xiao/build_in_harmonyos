# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CPython on OpenHarmony 的 sys.platform 是 'ohos'（不是 'linux'）；OHOS 与 Linux 同族（/proc/uptime、/proc/stat、/proc/sys/kernel/random/boot_id、clock_gettime 全可用），按 sys.platform.startswith('linux') 分平台的程序须把 'ohos' 并入 linux 分支，否则必然落进 else 分支（knowledge_ref: DRAFT-TUPTIME-525-OHOS-SYS-PLATFORM-PYTHON-LINUX-FAMILY）"
  - "解释型脚本工具包（application，变体 C）：上游 tarball 里脚本是 0664，package() 必须显式 chmod 0755，否则装出的 bin/ 不可执行；且 HMDFS 上 os.access(X_OK)/shutil.which() 不可靠，test_package 应经被测包绝对 bindirs 解析被测产物（knowledge_ref: DRAFT-TUPTIME-525-SCRIPT-TOOL-EXEC-BIT-HMDFS）"
  - "hmdfs 先耗尽 inode 而非空间：全量 git worktree add 会在中途随机文件处失败（每次重试路径不同），须用 sparse-checkout 稀疏检出（knowledge_ref: DRAFT-TUPTIME-525-HMDFS-INODE-EXHAUSTION-WORKTREE）"

