# conandata.yml — tuptime 5.2.5
#
# 上游官方源（R39）：两条 GitHub 官方归档端点，指向同一份字节。
#   https://github.com/rfmoz/tuptime/releases/tag/5.2.5
#   tag 5.2.5（无 v 前缀），tarball 内顶层目录 tuptime-5.2.5/
#
# 为什么是两条（均为 GitHub 官方基础设施，非第三方镜像）：
#   github.com/rfmoz/tuptime/archive/... 会 302 到
#   codeload.github.com/rfmoz/tuptime/tar.gz/... —— 两者实测返回同一份
#   tar.gz（sha256 均为 a4dfeac8…6737ec48，cmp 逐字节一致）。列出 codeload
#   作为回退，使配方在 github.com 侧不可达（或被改写为不可达镜像）时仍能取到
#   同一份校验过的源码。conan get() 按序尝试，sha256 仍强制校验。
sources:
  url:
    - "https://github.com/rfmoz/tuptime/archive/refs/tags/5.2.5.tar.gz"
    - "https://codeload.github.com/rfmoz/tuptime/tar.gz/refs/tags/5.2.5"
  sha256: "a4dfeac8221688be1452273458d69075c83a2ecad0dc8a27f973e8456737ec48"

patches:
  5.2.5:
    - patch_file: "patches/0001-src-tuptime.patch"
      patch_description: >-
        OHOS 平台识别：CPython on OpenHarmony 的 sys.platform 为 'ohos'，
        上游只识别 linux/bsd 两族，其余一律 logging.error('System = %s not
        supported') 后 sys.exit(1)，导致 tuptime 在鸿蒙PC上完全无法运行。
        OHOS 用 HongMeng 内核但提供 Linux 的 /proc 接口
        （/proc/uptime、/proc/stat、/proc/sys/kernel/random/boot_id）与
        clock_gettime(CLOCK_BOOTTIME/MONOTONIC) 时钟，正是 os_linux() 消费的
        全部接口，故把 'ohos' 并入 linux 分支（非空壳 stub，是实质走
        os_linux() 全路径）。补丁不含任何平台宏。
      patch_type: "portability"
