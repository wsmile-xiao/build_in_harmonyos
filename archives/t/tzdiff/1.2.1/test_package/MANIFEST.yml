package: tzdiff/1.2.1
homepage: "https://github.com/belgianbeer/tzdiff"

# 上游无测试：1.2.1 tag 仅含 tzdiff、tzdiff.1、README.md、LICENSE、.gitignore，
# 无 tests/ 目录、无 Makefile、无 .github/workflows（清点证据见 notes.md）
upstream_check_command: "none (upstream ships no test suite)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_tzdiff.sh
    description: "Run the packaged wrapper with fixed start times: version, bundled TZif data, multi-zone table, DST transition, city lookup + header, TZDIR contract (OHOS-specific: no system Olson tree, bundled data must be used), localtime column vs system date, PATH lookup"
    command: "bash test_tzdiff.sh <package>/bin/tzdiff"

assertion_count: 8
