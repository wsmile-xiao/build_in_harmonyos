# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.1"

# 软件名
software: "tzdiff"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "none"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/belgianbeer/tzdiff/archive/refs/tags/1.2.1.tar.gz"

  # 源码校验和
  sha256: "3438af02d6f808e9984e1746d5fd2e4bbf6e53cdb866fc0d4ded74a382d48d62"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: none

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - tzdata/2026.3
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: none   # 纯 sh 脚本，无编译
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-tzdiff.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 无 Olson 目录（/usr/share/zoneinfo 缺失），musl 只读打包格式 /etc/zoneinfo/tzdata，但接受绝对路径 TZ=<TZif 文件>"
  - "toybox date 无 --date 长选项，需用 -d；-d 不接受 ISO 'T' 分隔"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /root/tmp/builds/tzdiff-1.2.1.orig
  source_work_dir: /root/tmp/builds/tzdiff-1.2.1.work
  source_orig_hash: d49406069eadd053
  source_work_hash: 99a580d4e7cd3b01
  generated_at: '2026-09-25T22:48:10'
  patches_count: 1

patch_classification:
  - file: 0001-tzdiff.patch
    type: portability
    platform_only: False
    guard: 'none (TZDIR 可覆盖 + date -d 为 GNU/toybox 共同子集，无平台宏)'
