patches:
  "1.2.1":
    - patch_file: "patches/0001-tzdiff.patch"
      patch_description: "Make zoneinfo dir overridable via TZDIR and pass absolute TZ paths (OHOS musl has no Olson tree, only packed /etc/zoneinfo/tzdata); use 'date -d' (common GNU/toybox subset) instead of GNU-only '--date', mapping ISO 'T' separator to a space for -t"
      patch_type: "portability"
