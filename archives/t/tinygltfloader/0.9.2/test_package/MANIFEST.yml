# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: tinygltfloader/0.9.2
homepage: "https://github.com/syoyo/tinygltfloader"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -j1"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./loader_test box.gltf"

# 上游实际运行的测试程序
upstream_tests:
  - file: test.cc
    source: tinygltfloader-0.9.2/test.cc
    description: "官方 loader_test 解析仓库自带的 box.gltf fixture"
    command: "./loader_test box.gltf"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者调用 LoadFromString 验证有效/无效 glTF 解析"
    command: "./test_tinygltfloader"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
