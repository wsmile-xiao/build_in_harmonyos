software: tinygltfloader
display: "TinyGLTFLoader"
description: "Header-only C++ glTF 1.x parser"
category: library
homepage: "https://github.com/syoyo/tinygltfloader"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Header-only C++ glTF 1.x parser; the package installs public headers and has no runtime library"
    - "The upstream sample build uses -Wall -Werror; two boolean bitwise operations are patched to logical && for Clang compatibility"
    - "Conan test_package compiles and runs a real consumer against the packaged headers and an embedded glTF fixture"
  common_dependencies: []

versions:
  "0.9.2":
    status: built
    build_date: "2026-09-03"
    conan_ref: "tinygltfloader/0.9.2"
