# conandata.yml — tucnak 4.67
#
# Upstream publishes tucnak and its sibling library libzia as two tarballs that
# are unpacked side by side (tucnak's configure looks for a ../libzia directory
# and links ../libzia/src/.libs/libzia.a statically).
#
# Source provenance
# -----------------
# Upstream's own endpoints were both unreachable while this recipe was written
# (2026-10-04):
#   * https://gitlab.com/tucnak/tucnak/-/archive/4.67/tucnak-4.67.tar.gz
#     -> HTTP 403, Cloudflare "Just a moment..." JS challenge (also blocks the
#        git smart-HTTP endpoint: git ls-remote times out)
#   * https://www.tucnak.org/tucnak-4.67.tar.gz
#     -> HTTP 502 "WEDOS.protection - Origin server error"; the whole host is
#        down, including https://www.tucnak.org/ itself
#
# The URLs below are Debian's pool copies of the *unmodified upstream* release
# tarballs.  Debian never repacks a .orig.tar.gz, and the sha256 values are the
# ones Debian records in its signed tucnak_4.67-1.dsc, so matching them is proof
# that these bytes are identical to the upstream 4.67 release:
#   https://deb.debian.org/debian/pool/main/t/tucnak/tucnak_4.67-1.dsc
#     tucnak_4.67.orig.tar.gz        sha256 d2c62691df7ddd1154930e2341449501630fc02a81f31dd5b8da81b3c009f4f8
#     tucnak_4.67.orig-libzia.tar.gz sha256 305b505abad5b0258a31c7aca190ff4de9bcf6c133d3bc5802ef8b980feb2f38

sources:
  tucnak:
    url:
      - "https://deb.debian.org/debian/pool/main/t/tucnak/tucnak_4.67.orig.tar.gz"
    sha256: "d2c62691df7ddd1154930e2341449501630fc02a81f31dd5b8da81b3c009f4f8"
  libzia:
    url:
      - "https://deb.debian.org/debian/pool/main/t/tucnak/tucnak_4.67.orig-libzia.tar.gz"
    sha256: "305b505abad5b0258a31c7aca190ff4de9bcf6c133d3bc5802ef8b980feb2f38"

# The snippet this patch rewrites is autoconf-generated boilerplate emitted by
# AC_OUTPUT; it exists only in the generated configure scripts, never in either
# configure.ac, so patching the generated files is the only place it can be
# fixed without re-running autoconf.
patches:
  "4.67":
    - patch_file: "patches/0001-fix-config-status-hmdfs-umask.patch"
      patch_description: "Allow config.status temporary files on the OHOS HMDFS workspace (umask 077 -> 022)"
      patch_type: "portability"