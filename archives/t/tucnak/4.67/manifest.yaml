# manifest.yaml — tucnak 4.67 (version level)
version: "4.67"
software: tucnak
status: built
build_date: "2026-10-04"
build_system: autotools
conan_ref: "tucnak/4.67"

source:
  url: "https://deb.debian.org/debian/pool/main/t/tucnak/tucnak_4.67.orig.tar.gz"
  sha256: "d2c62691df7ddd1154930e2341449501630fc02a81f31dd5b8da81b3c009f4f8"
  tar_format: tar.gz
  provenance: >-
    Upstream's own endpoints were unreachable on 2026-10-04:
    gitlab.com/tucnak/tucnak archive downloads return HTTP 403 behind a
    Cloudflare JS challenge (and the git smart-HTTP endpoint times out), while
    the whole of tucnak.org returns HTTP 502 "WEDOS.protection - Origin server
    error" including its root page.  The URL above is Debian's pool copy of the
    unmodified upstream release tarball; Debian never repacks a .orig.tar.gz and
    records these sha256 values in its signed tucnak_4.67-1.dsc, so a match is
    proof of byte-identity with the upstream 4.67 release.  The sibling library
    tarball is https://deb.debian.org/debian/pool/main/t/tucnak/tucnak_4.67.orig-libzia.tar.gz
    sha256 305b505abad5b0258a31c7aca190ff4de9bcf6c133d3bc5802ef8b980feb2f38

build:
  system: autotools
  configure_options:
    - "libzia: --host=aarch64-unknown-linux-ohos --enable-static --disable-shared --without-sdl --without-sdl_ttf --without-png --without-ftdi --without-bfd"
    - "tucnak: --host=aarch64-unknown-linux-gnu --prefix=/ --with-pkg=tucnak --without-gpm --without-hamlib --without-fftw3 --without-portaudio --without-rtlsdr --without-hidapi --without-sndfile --without-alsa"
    - "libzia is built first and consumed as the ../libzia sibling directory tucnak's configure requires"
  dependencies:
    - "glib/2.88.0"
  transitive_dependencies:
    - "pcre2/10.45"
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-fix-config-status-hmdfs-umask.patch

knowledge_gained:
  - "Both bundled autoconf 2.71 configures (libzia/configure, tucnak/configure) create their config.status staging dir with umask 077; on the OHOS HMDFS worker that dir comes up unwritable, so config.status dies with ./confXXXXXX/subs1.awk: Permission denied before Makefile/config.h exist. The umask 077 -> 022 patch must actually be applied (apply_conandata_patches in build()) before either configure runs - exporting the patch file alone does nothing."
  - "tucnak 4.67 is pure C with no curses and no gettext: src/ contains no <curses.h>, and intl/ only ships .lng language files. ncurses is therefore NOT a dependency despite it being a TUI program."
  - "Upstream ships tucnak and libzia as two release tarballs meant to be unpacked side by side. tucnak's configure looks for a ../libzia directory and links ../libzia/src/.libs/libzia.a statically; the libzia Conan recipe does not need to exist."
  - "glib is a hard requirement of libzia, not an optional feature: include/zerror.h and include/zstr.h include <glib.h> unconditionally and ten libzia sources include it directly. libzia's configure only omits glib from its report when pkg-config misses it, then the build dies later with 'Missing mandatory libraries: libglib2'."
  - "libzia's configure writes the strerror_r return-type probe into config.h as Z_STRERROR_R_RETURNS_INT, but no libzia source ever includes config.h (they read include/zconfig.h). On glibc the stale macro is harmless because glibc's strerror_r returns char*, which is the branch the code falls into; on OHOS the XSI/musl flavour returns int and src/zerror.c fails with 'incompatible integer to pointer conversion'. The recipe passes -DZ_STRERROR_R_RETURNS_INT, the exact value configure computed."
  - "Cross-building autotools on OHOS requires PKG_CONFIG_LIBDIR to point at PkgConfigDeps' generated conan/ directory. Leaving it at the pkg-config default made libzia compile against the build host's x86_64 /usr/include/glib-2.0. The generated .pc files must be used rather than the ones in the package folders, because the shipped glib-2.0.pc has a bare prefix=/ that would resolve to /lib."
  - "pcre2/10.45 in the registry ships libpcre2-8.la with libdir='//lib' and dependency_libs pointing at the HarmonyOS device prefix, leftovers from an on-device build. libtool treats the library as 'moved' and then seds the stale //lib path, failing with \"'//lib/libpcre2-8.la' is not a valid libtool archive\". The recipe stages corrected .la copies (real absolute libdir, emptied dependency_libs) into the build folder and puts that dir first on LDFLAGS, leaving the Conan cache untouched."
  - "libzia must be built static-only. A shared libzia makes libtool try to embed its dependencies, but glib and pcre2 ship as plain archives with unusable .la files. Conversely libzia's src/Makefile.am has an unconditional 'libzia-4.67.so.d: libzia.la map2d' target that sed's a link map only a shared build produces, so 'make all' cannot succeed static-only; the recipe builds 'make -C src libzia.la' instead."
  - "tucnak bundles config.sub from 2018-02-22 and rejects every -ohos triplet ('machine aarch64-unknown-linux not recognized'); libzia bundles a 2019-06-30 copy that canonicalises it. tucnak's configure.ac has no host_os/host_cpu branching at all, so the plain aarch64-unknown-linux-gnu spelling is inert and only needs to satisfy config.sub."
  - "The packaged binary is an AArch64 PIE needing only libc.so: glib/pcre2 are static Conan archives, so the result is self-contained apart from the platform libc."