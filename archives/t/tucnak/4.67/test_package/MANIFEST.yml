package: tucnak/4.67
homepage: "https://github.com/Tucnak/tucnak"

test_type: explicit

upstream_check_command: "make -j1"
upstream_test_in_build: false
upstream_test_command: "make -j1"
upstream_tests:
  - file: src/Makefile.am
    source: tucnak-4.67/src/Makefile.am
    description: "Upstream's own build target is `make`; tucnak ships no separate `make check` suite"
    command: "make -j1"

test_package_tests:
  - file: conanfile.py
    description: "Asserts the packaged tucnak binary exists and is an AArch64 ELF, then runs it and checks the 4.67 banner (runtime part executes on aarch64 hosts)"
    command: "tucnak --version"

assertion_count: 3

notes:
  - "test() always asserts against the package folder first (bin/tucnak exists, and its ELF header is AArch64), so the gate's destructive L1e check - which moves bin/ and lib/ away and re-runs `conan test` - fails as it must; the runtime banner check then executes only where the target can run (aarch64 host, can_run()==True) and reports that deferral explicitly instead of passing silently."
  - "test_version.sh carries the same runtime assertions (banner reports 4.67, svn revision line present) so the checks can be replayed by hand against an extracted package."
  - 'tucnak parses options with plain getopt(":c:dgh:ikmst?x") and never getopt_long: "-i" prints the info banner and exits 0, and "--version" reaches that same branch because getopt matches the "i" inside the word. "--help" must never be passed - "h" takes an argument, so getopt consumes "elp" as the home directory and the program aborts while trying to create it.'
