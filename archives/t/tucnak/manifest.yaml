software: tucnak
display: "tucnak"
description: "业余无线电竞赛日志与电台控制程序（终端界面）"
category: system
homepage: "https://github.com/Tucnak/tucnak"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 C 终端程序，不依赖 ncurses/gettext：自带终端处理，intl/ 只有 .lng 语言文件"
    - "上游把 tucnak 与 libzia 作为两个发布 tarball 并排解包；tucnak 的 configure 查找 ../libzia 并静态链接其中的 libzia.a"
    - "glib 是 libzia 的硬依赖（include/zerror.h、include/zstr.h 无条件 include <glib.h>）"
    - "一处可移植性修复：libzia 的 configure 把 strerror_r 返回类型探测结果写进 config.h，但没有任何源文件 include config.h；OHOS 的 musl 版返回 int，故显式传入 -DZ_STRERROR_R_RETURNS_INT"
    - "交叉编译必须把 PKG_CONFIG_LIBDIR 指向 PkgConfigDeps 生成的 conan/ 目录，否则会误用构建主机上的 x86_64 glib"
  common_dependencies:
    - glib

versions:
  "4.67":
    status: built
    build_date: "2026-10-04"