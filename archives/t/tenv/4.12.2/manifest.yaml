software: tenv
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.12.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.12.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# ============================================================
# 二进制文件
# ============================================================

# 编译产物列表
binaries:
  - name: tenv
    size: "19M"
    description: "主命令，版本管理器核心"
  - name: tofu
    size: "2.5M"
    description: "OpenTofu 包装器"
  - name: terraform
    size: "2.5M"
    description: "Terraform 包装器"
  - name: terragrunt
    size: "2.5M"
    description: "Terragrunt 包装器"
  - name: terramate
    size: "2.5M"
    description: "Terramate 包装器"
  - name: atmos
    size: "2.5M"
    description: "Atmos 包装器"

# ELF 签名覆盖率
elf_signature_coverage: "100%"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tofuutils/tenv/tarball/v4.12.2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | go
  system: go

  # 配置选项列表
  configure_options:
    - "GOPROXY=https://goproxy.cn,direct"
    - "make build"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.25.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 工具链需要 ELF 签名才能在 HarmonyOS 上运行"
  - "Go 预编译包的所有工具链文件（go、gofmt、compile、link、asm 等）都需要签名"
  - "Go 项目编译必须设置 GOPROXY=https://goproxy.cn,direct 以访问依赖包"
  - "binary-sign-tool 的 self-sign 模式可用于签名 Go 工具链"
  - "Go 编译产物是静态链接的 ELF 文件，不需要动态库依赖"
  - "verify-build 脚本需要适配 Go 构建系统的检测逻辑"
