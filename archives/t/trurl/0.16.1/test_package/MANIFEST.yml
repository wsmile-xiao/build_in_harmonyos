# test_package/MANIFEST.yml — trurl 0.16.1
# 上游官方测试声明文件（CI L0e 门禁读取）

package: trurl/0.16.1
homepage: "https://github.com/curl/trurl"

# 上游测试：Python 驱动（test.py + tests.json），在配方 build() 内真实运行
upstream_check_command: "python3 test.py --trurl=<built trurl>"
upstream_test_in_build: true
upstream_test_command: "python3 test.py --trurl=<built trurl>"

# 上游测试入口清点（源码审计结论）：
# - test.py：测试驱动，加载 tests.json，按 --version 特性列表做 required/excludes
#   门控后逐条执行，输出 Failed/Passed/Skipped/Total 尾行
# - tests.json：用例数组（每条含 command/expected stdout-stderr-returncode），
#   覆盖 get/set/query/append/trim 等 URL 操作与各 libcurl 特性门控分支
# 具体用例总数以真机实测 trailer 中的 Total 为准（此处不预估）。
upstream_tests:
  - file: test.py
    source: trurl-0.16.1/test.py
    description: "上游测试驱动：加载 tests.json 并执行全部用例"
    command: "python3 test.py --trurl=<built trurl>"
  - file: tests.json
    source: trurl-0.16.1/tests.json
    description: "上游测试用例库：URL 解析与改写断言数组"
    command: "python3 test.py --trurl=<built trurl>"

# test_package 消费者用例（计入「鸿蒙特有/新增」口径，不计入上游分母）
test_package_tests:
  - file: test_trurl.sh
    description: "T1 trurl --version 输出 trurl version 0.16.1"
    command: "sh test_trurl.sh <pkg>/bin/trurl"
  - file: test_trurl.sh
    description: "T2 trurl --help 输出 --url/--get 选项表"
    command: "sh test_trurl.sh <pkg>/bin/trurl"
  - file: test_trurl.sh
    description: "T3 离线抽取 path：--get '{path}' => /we/are.html"
    command: "sh test_trurl.sh <pkg>/bin/trurl"
  - file: test_trurl.sh
    description: "T4 离线推导默认端口：--get '{default:port}' => 443"
    command: "sh test_trurl.sh <pkg>/bin/trurl"
  - file: test_trurl.sh
    description: "T5 离线改写 host：--set host=example.com"
    command: "sh test_trurl.sh <pkg>/bin/trurl"
  - file: test_trurl.sh
    description: "T6 离线多组件组合抽取 scheme/host/port/path/query"
    command: "sh test_trurl.sh <pkg>/bin/trurl"

assertion_count: 6
