software: trurl
version: "0.16.1"
status: built
build_date: "2026-09-17"
build_system: make

source:
  url: "https://github.com/curl/trurl/releases/download/trurl-0.16.1/trurl-0.16.1.tar.gz"
  sha256: "aac947d4fb421a58abc19a3771e87942cd4721b8f855c433478c94c11a8203ba"
  tar_format: tar.gz
  note: "release tarball ships plain Makefile only (no CMakeLists.txt)"

build:
  system: make
  make_target: trurl
  make_vars:
    - "TRURL_IGNORE_CURL_CONFIG=1"
    - "NDEBUG=1"
  dependencies:
    - curl/8.15.0
    - libidn2/2.3.8
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-trurl-uppercase-hex-feature.patch"
  - "patches/0002-test-excludes-support.patch"
  - "patches/0003-tests-uppercase-hex-excludes.patch"

knowledge_gained:
  - "trurl 上游测试为 Python 驱动（test.py + tests.json），需用 HMBS_PYTHON3 运行并解析 Failed/Passed/Skipped/Total 尾行作为机器证据"
  - "0.16.1 release tarball has Makefile only"
