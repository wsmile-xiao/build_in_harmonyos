software: trurl
display: "trurl"
description: "Command line tool for parsing and manipulating URLs using libcurl"
category: network
homepage: "https://curl.se/trurl/"
license: curl
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建：TRURL_MANUAL=OFF 免 Perl 依赖，TRURL_TESTS=OFF 后在 build() 内手动运行上游 test.py"
    - "唯一依赖为 curl/8.15.0 提供的 libcurl（find_package(CURL) 经 CMakeDeps 注入）"
    - "纯命令行包，只交付 bin/trurl；test_package 离线断言 6 项真实 URL 解析与改写行为"
  common_dependencies:
    - curl

versions:
  "0.16.1":
    status: built
    build_date: "2026-09-17"
    conan_ref: "trurl/0.16.1"
    source_url: "https://github.com/curl/trurl/releases/download/trurl-0.16.1/trurl-0.16.1.tar.gz"
