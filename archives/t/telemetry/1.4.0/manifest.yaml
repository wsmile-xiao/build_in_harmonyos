# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS SDK 的 libc++ 15 未实现 std::ranges 算法（find_if_not/any_of 报 no member named），需回退到 <algorithm> 经典版本"
  - "stdc++fs 是 GCC 专用运行库，libc++ 环境把 std::filesystem 放在主运行库；链接 -lstdc++fs 会 ld.lld: unable to find library"
  - "静态 libfuse3.a 带 FUSE_3.x 符号版本节点，链接进共享库时 lld 报 undefined version；--undefined-version 无效，需 -Wl,--exclude-libs,libfuse3.a 隐藏归档符号"
  - "OHOS CMake 平台模块只定义 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG，未定义 CXX 变体，CMake 会丢弃 -soname；需配方注入 CXX/C 两个变量并在 CMakeLists 设置 SOVERSION 才能得到 DT_SONAME"
  - "cmake/installation.cmake 用 GNUInstallDirs 的绝对 FULL_* 路径，--prefix 不生效；上游预留 LIB_INSTALL_DIR/INCLUDE_INSTALL_DIR 覆盖变量可改为相对路径"

