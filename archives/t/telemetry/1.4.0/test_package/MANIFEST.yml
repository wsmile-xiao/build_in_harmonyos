# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: telemetry/1.4.0
homepage: "https://github.com/CESNET/telemetry"

# 上游测试入口 (Google Test 单元测试, 由 CMake 的 TELEMETRY_ENABLE_TESTS 开关构建)
# 上游 cmake/googletest.cmake 通过 FetchContent 获取 googletest v1.14.0;
# 本配方用制品仓的 gtest/1.17.0.2 替代 (见 patches/0001-cmake-googletest.cmake.patch),
# 无需访问 github.com。
upstream_check_command: "cmake --build build && ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/telemetry/tests/testContent.cpp
    source: telemetry-1.4.0/src/telemetry/tests/testContent.cpp
    description: "telemetry::Content 字符串化 (scalar/scalarWithUnit/array/dict)"
    command: "ctest -R TelemetryContent"
  - file: src/telemetry/tests/testFile.cpp
    source: telemetry-1.4.0/src/telemetry/tests/testFile.cpp
    description: "telemetry::File 读/清空/禁用操作"
    command: "ctest -R TelemetryFile"
  - file: src/telemetry/tests/testDirectory.cpp
    source: telemetry-1.4.0/src/telemetry/tests/testDirectory.cpp
    description: "telemetry::Directory 目录/文件/符号链接与路径解析"
    command: "ctest -R TelemetryDirectory"
  - file: src/telemetry/tests/testHolder.cpp
    source: telemetry-1.4.0/src/telemetry/tests/testHolder.cpp
    description: "telemetry::Holder 节点生命周期与引用计数"
    command: "ctest -R TelemetryHolder"
  - file: src/telemetry/tests/testSymlink.cpp
    source: telemetry-1.4.0/src/telemetry/tests/testSymlink.cpp
    description: "telemetry::Symlink 链接目标与路径"
    command: "ctest -R TelemetrySymlink"
  - file: src/telemetry/tests/testUtility.cpp
    source: telemetry-1.4.0/src/telemetry/tests/testUtility.cpp
    description: "telemetry::utility 路径拼接与名称校验"
    command: "ctest -R TelemetryUtility"
  - file: src/telemetry/tests/testAggFile.cpp
    source: telemetry-1.4.0/src/telemetry/tests/testAggFile.cpp
    description: "telemetry::AggregatedFile 正则匹配与 SUM/AVG/MIN/MAX/JOIN 聚合"
    command: "ctest -R TelemetryAggFile"
  - file: src/telemetry/aggregator/tests/testAggSum.cpp
    source: telemetry-1.4.0/src/telemetry/aggregator/tests/testAggSum.cpp
    description: "AggSumTest: SUM 聚合的标量/带单位/字典聚合（5 例）"
    command: "ctest -R AggSumTest"
  - file: src/telemetry/aggregator/tests/testAggAvg.cpp
    source: telemetry-1.4.0/src/telemetry/aggregator/tests/testAggAvg.cpp
    description: "AggAvgTest: AVG 聚合与平均值换算（3 例）"
    command: "ctest -R AggAvgTest"
  - file: src/telemetry/aggregator/tests/testAggMinMax.cpp
    source: telemetry-1.4.0/src/telemetry/aggregator/tests/testAggMinMax.cpp
    description: "AggMinMaxTest: MIN/MAX 查找与聚合（6 例）"
    command: "ctest -R AggMinMaxTest"
  - file: src/telemetry/aggregator/tests/testAggJoin.cpp
    source: telemetry-1.4.0/src/telemetry/aggregator/tests/testAggJoin.cpp
    description: "AggJoinTest: JOIN 聚合与收集值（2 例）"
    command: "ctest -R AggJoinTest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_telemetry.cpp
    description: "消费者视角使用 telemetry 核心 API: 文件操作、目录树/符号链接、聚合文件、内容格式化"
    command: "./test_telemetry_consumer"
  - file: test_appfs_ohos.cpp
    description: "鸿蒙特有用例: appFs 发布的 FUSE_USE_VERSION=30 / _FILE_OFFSET_BITS=64 / 64 位 off_t 契约, fuse3 头文件可达, libtelemetry.so.1 与 libappFs.so.1 按 DT_SONAME 加载成功且不依赖 libfuse3.so"
    command: "./test_appfs_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 31
