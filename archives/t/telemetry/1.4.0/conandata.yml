# conandata.yml — telemetry 1.4.0
# Upstream source (official GitHub tag archive, v1.4.0 -> 33287a91b344cc54af1a52ac091fd18b234b50bf)
sources:
  url: "https://github.com/CESNET/telemetry/archive/refs/tags/v1.4.0.tar.gz"
  sha256: "aa7c0b457f507924a1b5ebd9df8b80db02fabb61b13f035ef803489b51d057d0"

patches:
  - patch_file: "patches/0001-cmake-googletest.cmake.patch"
    patch_description: "cmake/googletest.cmake: prefer an externally provided Google Test package (Conan gtest) and keep FetchContent only as fallback (no github.com dependency)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-appFs-CMakeLists.txt.patch"
    patch_description: "src/appFs/CMakeLists.txt: link stdc++fs only with GCC, hide the symbols of a static libfuse3.a from the shared library (FUSE_3.x version nodes) and pin SOVERSION"
    patch_type: "portability"
  - patch_file: "patches/0003-src-telemetry-CMakeLists.txt.patch"
    patch_description: "src/telemetry/CMakeLists.txt: pin SOVERSION so libtelemetry.so exports a DT_SONAME"
    patch_type: "portability"
  - patch_file: "patches/0004-src-telemetry-aggFile.cpp.patch"
    patch_description: "src/telemetry/aggFile.cpp: use std::any_of instead of std::ranges::any_of, which libc++ 15 of the OHOS SDK does not provide"
    patch_type: "portability"
  - patch_file: "patches/0005-src-telemetry-node.cpp.patch"
    patch_description: "src/telemetry/node.cpp: use std::find_if_not instead of std::ranges::find_if_not, which libc++ 15 of the OHOS SDK does not provide"
    patch_type: "portability"
