software: tpix
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.3"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统（顶级字段，verify-build 检查）
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jesvedberg/tpix/archive/refs/tags/v1.0.3.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # Nim 构建命令
  # 编译命令: nim -p:$PIXIE/src -p:$CLIGEN -p:$DEPS... -d:release -d:pixieUseStb --mm:arc -o:tpix c tpix.nim
  configure_options:
    - "nim c -d:release -d:pixieUseStb --mm:arc tpix.nim"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - nim/2.2.8
    - pixie/6.1.0
    - cligen/1.9.6
    - vmath/master
    - chroma/master
    - zippy/master
    - flatty/master
    - nimsimd/master
    - bumpy/master
    - crunchy/master

  # 编译器
  cc: clang
  cxx: clang++
  # 实际使用 Nim 编译器，Nim 后端编译为 C 再由 clang 编译
  language: nim

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "tpix 是 Nim 语言项目（非 C/C++），构建系统为 NimScript/nimble，非 autotools"
  - "Nim 编译器需要从 nim-lang.org 下载 linux_arm64 版本并签名"
  - "nimble 无法自动安装依赖（SSL CA 证书问题），需手动下载 pixie/cligen 及其依赖并用 nim -p 编译"
  - "pixie 依赖链: vmath, chroma, zippy, flatty, nimsimd, bumpy, crunchy"
