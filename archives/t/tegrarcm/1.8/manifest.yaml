knowledge_gained:
  - "The v1.8 GitHub tag archive is a 29-member autotools snapshot without generated configure; it must be bootstrapped with autoreconf -fi from conan automake/autoconf/libtool before configure."
  - "OHOS musl lacks glibc error.h which src/main.c includes unconditionally; the portable fix is AC_CHECK_HEADERS([error.h]) plus a static error() fallback guarded by HAVE_ERROR_H, keeping the recipe free of platform macros."
  - "tegrarcm --help exits 1 (EXIT_FAILURE) by upstream design while --version exits 0; the consumer test asserts rc!=0 plus a non-empty usage banner so an exit-0 stub cannot fake a pass."
  - "Upstream registers no TESTS/check_PROGRAMS so make check is the empty automake default; the adaptation reports no_tests/0 with a file-level audit and validates the binary through 4 consumer assertions."
