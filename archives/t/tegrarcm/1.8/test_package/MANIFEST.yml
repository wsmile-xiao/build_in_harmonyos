package: tegrarcm/1.8
homepage: "https://github.com/NVIDIA/tegrarcm"

# Upstream test audit (tegrarcm 1.8 tarball 08329ee0..., 29 members).
upstream_tests_exist: false
upstream_test_audit:
  - source: "tegrarcm-1.8 tarball file listing (29 members)"
    reason: "No tests/, test/, spec/ or t/ directory anywhere; only src/, src/miniloader/, Makefile.am, configure.ac, autogen.sh, README, LICENSE."
  - source: "top Makefile.am + src/Makefile.am"
    reason: "Top declares SUBDIRS=src only; src declares bin_PROGRAMS=tegrarcm with explicit SOURCES list; neither defines TESTS, check_PROGRAMS, check-local or any test target."
  - source: "configure.ac (60 lines)"
    reason: "Probes compilers, pkg-config libusb-1.0, cryptopp link test, standard headers and type checks; no test-framework probe (no CUnit/Check/gtest/ctest, no AC_CONFIG_TESTDIR)."
  - source: "make check semantics"
    reason: "With no TESTS registered, automake generates only the empty default check-am target; running make check executes 0 cases and exits 0."
  - conclusion: "Upstream 1.8 provides no automated tests; the adaptation validates the installed binary through the consumer test_package below and never presents it as upstream coverage."

upstream_test_total: 0
upstream_test_count_method: autotools_tests
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_tegrarcm.sh
    description: "Packaged binary executable bit check."
    command: "sh test_tegrarcm.sh <pkg>/bin/tegrarcm <workdir>"
  - file: test_tegrarcm.sh
    description: "--version exits 0 with non-empty output containing 1.8."
    command: "sh test_tegrarcm.sh <pkg>/bin/tegrarcm <workdir>"
  - file: test_tegrarcm.sh
    description: "--help prints non-empty usage banner (rc=1 upstream); rc!=0 proves a real binary, not an exit-0 stub."
    command: "sh test_tegrarcm.sh <pkg>/bin/tegrarcm <workdir>"
  - file: test_tegrarcm.sh
    description: "No-args run fails with BCT hint (proves CLI validation runs)."
    command: "sh test_tegrarcm.sh <pkg>/bin/tegrarcm <workdir>"

assertion_count: 4
