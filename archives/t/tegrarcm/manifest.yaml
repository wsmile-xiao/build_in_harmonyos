software: tegrarcm
display: "tegrarcm"
description: "Tegra ReCovery Mode tool; communicates with Tegra boot ROM to download code over USB"
category: utility
homepage: "https://github.com/NVIDIA/tegrarcm"
license: LicenseRef-NVIDIA-tegrarcm
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag archive ships configure.ac/Makefile.am but no generated configure; bootstrap with autoreconf -fi via automake/autoconf/libtool/pkgconf tool_requires."
    - "musl-based OHOS lacks glibc <error.h>; feature-detect it in configure.ac and provide a portable error() fallback in src/main.c (no platform macro)."
    - "Depends on published libusb/1.0.29 (pkg-config) and cryptopp/8.9.0 (link test); resolved via PkgConfigDeps + AutotoolsDeps."
  common_dependencies:
    - libusb
    - cryptopp

versions:
  "1.8":
    status: built
    build_date: "2026-10-13"
    source_url: "https://github.com/NVIDIA/tegrarcm/archive/refs/tags/v1.8.tar.gz"
    source_sha256: "08329ee0247499b28ec37b0cc639f35443792dfb9bc4a8a182eea63dae6f64ea"
