# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: traceroute/2.1.6
homepage: "https://traceroute.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# traceroute 无自动化测试套件，功能测试通过运行二进制验证
upstream_tests:
  - file: traceroute/traceroute
    source: traceroute-2.1.6/traceroute/traceroute
    description: "traceroute 二进制 --version 输出验证"
    command: "./traceroute --version"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "运行 traceroute --version 验证二进制安装正确"
    command: "traceroute --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
