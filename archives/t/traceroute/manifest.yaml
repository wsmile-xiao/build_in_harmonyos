software: traceroute
display: "traceroute"
description: "Modern traceroute for Linux, supports UDP, ICMP, TCP, DCCP"
category: network
homepage: "https://traceroute.sourceforge.net/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Make.rules 默认使用 gcc，改为 clang"
    - "LIBDEPS 过滤不完整导致链接失败，需添加 -l% 过滤"
    - "使用 env=yes 让 Makefile 接受命令行变量覆盖"
    - "需要 raw socket 权限发送 UDP/ICMP 包"
  common_dependencies: []

versions:
  "2.1.6":
    status: built
    build_date: "2026-05-14"
