build:
  system: autotools
  configure_options:
    - "--prefix=/usr/local --exec_prefix=/usr/local"
    - "--with-tcl=${TCL_ROOT}/lib"
    - "--enable-shared=yes"
    - "tcl_cv_sys_version=Linux-6.6"
  dependencies:
    - tcl/8.6.16
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.patch"

knowledge_gained:
  - "TEA(autotools) 扩展的 config.status 用 umask 077 建临时目录；OHOS HMDFS 下不可写 → Permission denied，需改 022（与 tcl/8.6.16 E011 同源）"
  - "TEA 的 tcl.m4 无 HarmonyOS 分支，uname -s(HarmonyOS-...) 使 SHLIB_LD/SHLIB_SUFFIX 为空 → 传 tcl_cv_sys_version=Linux-6.6 走官方 Linux 分支"
  - "TEA_PREFIX 未显式给 --exec_prefix 时会继承 Tcl 的 TCL_EXEC_PREFIX(${TCL_ROOT})，pkglibdir 会落进 tcl 依赖包目录 → 显式 --prefix/--exec_prefix 隔离安装树"

