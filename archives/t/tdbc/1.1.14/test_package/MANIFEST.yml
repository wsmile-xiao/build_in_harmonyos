# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
package: tdbc/1.1.14
homepage: "https://core.tcl-lang.org/tdbc/"

# 上游测试入口：TEA 生成的 Makefile 的 `test` 目标 → tests/all.tcl（tcltest 2.2）
upstream_check_command: "make test"

# conanfile.py build() 中已真实执行上游测试并校验汇总
upstream_test_in_build: true
upstream_test_command: "make test TESTFLAGS=\"-verbose pass\"（tests/all.tcl 驱动，日志 upstream_test.log）"

# 上游实际运行的测试文件（13 个 tcltest 用例）
upstream_tests:
  - file: tests/tdbc.test
    source: tdbc1.1.14/tests/tdbc.test
    description: "TDBC 基类/分词 API：tdbc-1.1 ~ tdbc-1.4（4 用例）"
    command: "make test"
  - file: tests/tokenize.test
    source: tdbc1.1.14/tests/tokenize.test
    description: "SQL 分词器 tdbc::tokenize：tokenize-1.0 ~ tokenize-4.3（9 用例）"
    command: "make test"

# test_package 中自带的消费者测试（Tcl 包形态：shell 入口 + tclsh 加载 + API 调用）
test_package_tests:
  - file: test_tdbc.sh
    description: "消费者测试入口（shell 包装；CI L0c 要求的测试源文件扩展名），内部以 tclsh8.6 执行断言"
    command: "sh test_tdbc.sh"
  - file: test_tdbc.tcl
    description: "断言实现：package require tdbc + tokenize/mapSqlState/类注册/动态库加载 + 鸿蒙平台与 ELF 架构断言（9 用例，其中鸿蒙特有 2 项）"
    command: "tclsh8.6 test_tdbc.tcl"

# 上游测试用例数（tcltest）
assertion_count: 13
