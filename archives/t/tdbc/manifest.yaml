# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: tdbc
display: "TDBC (Tcl Database Connectivity)"
description: "Tcl 数据库连接接口标准的基础包：连接/语句/结果集基类与 SQL 分词器；具体数据库驱动由 tdbcmysql/tdbcodbc/tdbcpostgres/tdbcsqlite3 单独提供"
category: library
homepage: "https://core.tcl-lang.org/tdbc/"
license: TCL

build_system: autotools

ohos_adaptation:
  key_points:
    - "TEA 构建：configure/config.status 的 umask 077 临时目录在 HMDFS 上不可写（E011 同源）→ 022"
    - "TEA tcl.m4 无 HarmonyOS 分支 → 传 tcl_cv_sys_version=Linux-6.6 启用共享库链接"
    - "显式 --exec_prefix，避免 pkglibdir 落进 tcl 依赖包 cache（TEA_PREFIX 继承 TCL_EXEC_PREFIX）"
    - "make -j1（OHOS 无 mkfifo jobserver）；测试 make test 在 build() 内真实执行并校验汇总"

  common_dependencies:
    - tcl

versions:
  "1.1.14":
    status: built
    build_date: 2026-09-24
