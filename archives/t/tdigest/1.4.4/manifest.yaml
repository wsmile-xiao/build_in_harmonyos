# 版本级 manifest
# 文件位置: archives/t/tdigest/1.4.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.4.4"
software: tdigest
status: built
build_date: "2026-09-24"
build_system: pgxs

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/tvondra/tdigest/archive/refs/tags/v1.4.4.tar.gz"
  sha256: "cdaf21af212138a2d608c3864b45004e6b6c0197637052ad921d74ae525bf764"
  tar_format: tar.gz
  upstream_tag: "v1.4.4"
  upstream_commit: "31f375c4f5437530a3d359d0eed01338cfde806a"
  pgxn_release_date: "2026-07-08"

# ============================================================
# 构建配置
# ============================================================

build:
  system: pgxs
  configure_options: []
  make_options:
    - "PG_CONFIG=<postgresql-pkg>/bin/pg_config"
    - "rpath=   # 去除 PGXS 默认 -Wl,-rpath,'$(libdir)'，避免把构建机 conan 缓存路径写进产物"
  dependencies:
    - postgresql/18.3
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无源码补丁：上游 1.4.4 在 OHOS PC（clang 15.0.4 + musl）上一次编译通过
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PostgreSQL 扩展（PGXS）适配的完整依赖来自 conan postgresql 包：服务端头文件 include/postgresql/server、pgxs.mk、以及可重定位 pg_config；不需要在 build() 里构建 PostgreSQL 源码"
  - "PG 18 的 pg_config 运行时按自身位置解析前缀，因此它输出的 --includedir-server/--pgxs 指向 conan 缓存内的真实路径，PGXS 构建可直接用"
  - "PGXS 的 LINK.shared 会带 -Wl,-rpath,'$(libdir)'（Makefile.global: rpathdir=$(libdir)），会把构建机 conan 缓存绝对路径写进 .so；服务端模块不需要 rpath，用 make rpath= 去掉可得到只依赖 libc.so 的可复现产物"
  - "PG 18.3 包内 pg_regress 位于 lib/postgresql/pgxs/src/test/regress/，其 RUNPATH '//lib:$ORIGIN/../lib' 只对 bin/ 下程序有效 → 直接运行会报 'Error loading shared library libpq.so.5'，需 LD_LIBRARY_PATH=<pgrroot>/lib"
  - "OHOS /tmp 为只读 erofs 挂载（E002）：上游 test/sql/copy.sql 硬编码 /tmp，必须重定向到可写目录，否则该用例 100% 失败（其它 9 个用例不受影响）"
  - "上游测试脚本用 \\i tdigest--*.sql 相对包含扩展 SQL，pg_regress 的 psql 子进程 cwd 必须是含这些脚本的目录（否则 basic 等用例整体报 'No such file or directory'）"
  - "OHOS PC 可原生运行 PostgreSQL 18.3 服务端：initdb/pg_ctl/psql/pg_regress 均可用，扩展 .so 在 CREATE EXTENSION 时 dlopen 成功（无需 ELF 签名干预）"
