# test_package/MANIFEST.yml — tdigest/1.4.4
# CI (ci/conan/build_and_test.sh L0e) requires this file: it declares where the
# upstream tests are and which consumer tests the package itself adds.

package: tdigest/1.4.4
homepage: "https://github.com/tvondra/tdigest"

# ── 上游测试台账 ────────────────────────────────────────────────────────────
# tdigest 上游自带完整回归套件，由 PGXS 的 REGRESS 变量驱动
# （Makefile:19 `REGRESS = basic copy cast conversions incremental
#   parallel_query value_count_api trimmed_aggregates combine_crash combine`,
#   Makefile:20 `REGRESS_OPTS = --inputdir=test`），
# 上游 CI 在 PG 9.6–18 全矩阵执行 `make installcheck`
# （.github/workflows/ci.yml:7 `pg: [18, 17, 16, 15, 14, 13, 12, 11, 10, 9.6]`）。
# 上游用例数 = 10（唯一入口 `make installcheck`）。
upstream_check_command: "make installcheck"
upstream_test_in_build: false
upstream_test_command: ""

# 10 个上游回归用例，逐字节取自上游 test/sql + test/expected（sha256 如下，
# 与 v1.4.4 tarball 完全一致；本仓库归档内不做任何删改）。
upstream_tests:
  - file: sql/basic.sql
    sha256: "353c62ab2c57c4c1b6fea72dc5efe91441931e6102bb0a37b8ec05aeb0feeb65"
    description: "tdigest_percentile/tdigest/tdigest_digest 基本聚合语义、值域与压缩参数"
  - file: sql/copy.sql
    sha256: "f62566a47c5ff2829f98f41d7a2ab40fcd3e34a9358f3bfa6191967963386b34"
    description: "100 个 sketch 的 text/binary COPY 导出导入往返一致性（200 行 0 mismatch）"
  - file: sql/cast.sql
    sha256: "d64df3a62a8fda97c136246ed7a9d234c92f42f0ea0540fe42427030f2643d71"
    description: "tdigest 类型与 text/bytea 之间的 cast 行为"
  - file: sql/conversions.sql
    sha256: "910900728753723651b561ed5a6c9e14ed356ab8073b327ce42f0bc91842fd5b"
    description: "tdigest_digest / tdigest_percentile 各重载（数组分位、double 值）"
  - file: sql/incremental.sql
    sha256: "2fb94cc1a160f481886a9dfe7206acd6d2677c326aae85c2271601aa3662674f"
    description: "增量构建的 digest 与一次性构建结果的等价性"
  - file: sql/parallel_query.sql
    sha256: "be35a7d4c380b29dfa59b4b9dc9382a0b7ca1c63b3da28672dab3be647975cd0"
    description: "并行 worker 部分 digest 的合并（combine 函数）与结果一致性"
  - file: sql/value_count_api.sql
    sha256: "155cc1c57c39b7a085b9e43cdcff5ac43aac1843917fd9383ebd3f163c1fd1c2"
    description: "tdigest_value/tdigest_count 访问器与 1.4 版 API 语义"
  - file: sql/trimmed_aggregates.sql
    sha256: "278fa0138bc9045afdd23f911cd75e9b1f185d876454e34bb94809bffab5a04f"
    description: "trimmed mean（截尾均值）聚合"
  - file: sql/combine_crash.sql
    sha256: "4b61d685e8cfefb63f00789bbd3e49453d39f3ccf60b082b6eaa1b83377286d2"
    description: "1.4.4 修复项：不同参数 digest 合并时的异常输入（回归保护）"
  - file: sql/combine.sql
    sha256: "89f8d1e1d3a20e17c3eb8ef92d175d58de7e74a3b4a7f606413abcbb5bd10ff7"
    description: "1.4.4 修复项：不同 compression 的 digest 合并语义"
# expected/ 目录为 25 个黄金输出文件（含 PG 版本相关的 _0.._4 变体），
# 与上游 test/expected 全量一致。

# ── 适配后新增的消费者测试（conan create 自动执行）──────────────────────────
test_package_tests:
  - file: run_pg_test.sh
    description: "在隔离的 PostgreSQL 18.3 实例中装载包内 tdigest.so，用 pg_regress 重放上游 10 个回归用例（10/10 通过），随后执行 4 条鸿蒙特有断言：OH-1 模块在 OHOS 原生 postgres 进程中 dlopen 成功（CREATE EXTENSION + pg_extension 计数）；OH-2 产物 ABI（ELF AArch64、DT_NEEDED 仅 libc.so、无构建机 RUNPATH）；OH-3 /tmp 只读（E002）路径重定向后 text/binary COPY 往返一致（5/10/0）；OH-4 tdigest_percentile 中位数≈0.5"
    command: "bash run_pg_test.sh <pg_bindir> <pkg_libdir> <pkg_sharedir> <tests_dir>"
  - file: conanfile.py
    description: "消费者测试入口：require postgresql/18.3 提供 initdb/pg_ctl/psql/pg_regress，模块只从被测包的 package_folder 取（保证 CI L1e 负向破坏性验证真实失败）"
    command: "conan create . --version=1.4.4 -pr:h=ci/conan/profiles/ohos-aarch64"

# 断言总数：4 (鸿蒙) + 10 (上游回归用例) = 14；pg_regress 内部另有逐行输出比对
assertion_count: 14

# ── 鸿蒙适配说明（无源码补丁）───────────────────────────────────────────────
ohos_notes:
  source_patches: "无。tdigest 1.4.4 在 OHOS PC（clang 15.0.4 + musl）上一次编译通过，未修改任何上游源码，无 patches/ 目录。"
  tmp_read_only: "上游 test/sql/copy.sql 硬编码 /tmp 作为 COPY 落盘路径；OHOS 上 /tmp 是只读 erofs 挂载（E002）。测试脚本在运行时把该路径字面量重写到工作目录下的可写 tmp/（脚本与 expected 输出同时替换，保证 psql 回显逐行匹配）；归档内保存的测试文件与上游逐字节一致。"
  pg_regress_runpath: "PG 18.3 的 pg_regress 位于 lib/postgresql/pgxs/src/test/regress/，其 RUNPATH 为 '//lib:$ORIGIN/../lib'，只对 bin/ 下的可执行文件有效，因此测试脚本为其设置 LD_LIBRARY_PATH=<pgrroot>/lib 才能加载 libpq.so.5。"
