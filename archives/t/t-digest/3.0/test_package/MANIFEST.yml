# test_package/MANIFEST.yml
# Upstream and consumer test declaration required by CI L0e.
# See docs/TEST_QUALITY_SPEC.md

package: t-digest/3.0
homepage: "https://github.com/tdunning/t-digest"

upstream_tests_exist: true
upstream_test_audit: >-
  The official t-digest-3.0 tag tarball contains 6 *Test.java files under
  src/test/java/com/tdunning/math/stats/ (AVLGroupTreeTest 5, AVLTreeDigestTest
  19, ArrayDigestTest 21, GroupTreeTest 6, IntAVLTreeTest 2, TreeDigestTest 19;
  total 72 @Test methods counted by grep -r @Test). TDigestTest.java is a
  shared base class with 0 @Test; TDigestBenchmark/MemoryBenchmark are Caliper
  benchmarks, not Surefire cases. Framework is JUnit 4.8.2 via
  maven-surefire-plugin 2.16; runtime case counts are read from TEST-*.xml
  on the OHOS worker.
upstream_check_command: "mvn clean package -B -DskipTests=false -Dmaven.javadoc.skip=true"
upstream_test_in_build: true
upstream_test_command: "mvn clean package -B -DskipTests=false -Dmaven.javadoc.skip=true"
upstream_tests:
  - file: "src/test/java/com/tdunning/math/stats/"
    source: "t-digest-3.0.tar.gz/src/test/java/com/tdunning/math/stats/"
    description: "JUnit 4 upstream suite (72 @Test methods in 6 *Test.java files)"
    command: "mvn clean package -B -DskipTests=false -Dmaven.javadoc.skip=true"

# Counting unit: one @Test method (grep -r @Test src/test/java).
upstream_test_total: 72
upstream_test_count_method: auto

test_package_tests:
  - file: "TestTDigest.java"
    description: "Compile and run a Java program calling TDigest create/add/quantile/cdf/merge/compress APIs (14 assertions, R34 substantive verification)"
    command: "sh test.sh"
  - file: "test.sh"
    description: "Verify JAR presence, javac compile, java run, PASS output, and HMBS evidence"
    command: "sh test.sh <package_folder>"
  - file: "conanfile.py"
    description: "Consume t-digest as a library requirement and activate its runenv contract"
    command: "self.run(test.sh, env=conanrun)"

assertion_count: 14
