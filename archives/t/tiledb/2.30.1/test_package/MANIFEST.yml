# test_package/MANIFEST.yml — tiledb 2.30.1
# CI L0e 要求此文件存在。

package: tiledb/2.30.1
homepage: "https://github.com/TileDB-Inc/TileDB"

# tiledb 上游 C++ 测试套件（catch2 + rapidcheck，数百用例）在 OHOS 交叉编译下
# 未启用：rapidcheck 未发布到制品仓，tiledb 测试入口依赖 Catch2 的 C++ 工具链。
# 因此 upstream 测试未纳入本地 OHOS 构建，消费者侧用 test_package 做 C API 探测。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试入口（记录供参考，未在本次 OHOS 构建中执行）
upstream_tests:
  - name: cpp-integration
    command: "ctest -R cpp-integration"
    expected: "requires Catch2 + rapidcheck; disabled in OHOS build (TILEDB_TESTS=OFF)"

# test_package 自带测试（消费者视角，验证 libtiledb.so 已链接且符号可解析）
test_package_tests:
  - file: test.c
    description: "调用 TileDB C API：tiledb_version / tiledb_config_alloc / tiledb_ctx_alloc_with_error / tiledb_ctx_free，验证库已链接"
    command: "./test_probe"

# 断言总数（4 个 API 调用 + 非空 ctx 检查）
assertion_count: 4
