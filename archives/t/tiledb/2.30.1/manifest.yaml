# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.30.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.30.1"

# 软件名
software: tiledb

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/TileDB-Inc/TileDB/archive/refs/tags/2.30.1.tar.gz"

  # 源码校验和
  sha256: "36381f9eaa2a6defc8990aa1a95d1f0e87971748a50bf6fb705bf032ac7384cf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py build() 的 defs 一致）
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=<OHOS NDK>/build/cmake/ohos.toolchain.cmake"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_CXX_STANDARD=20"
    - "-DCMAKE_CXX_STANDARD_REQUIRED=ON"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=OFF"
    - "-DTILEDB_WERROR=OFF"
    - "-DTILEDB_S3=OFF"
    - "-DTILEDB_AZURE=OFF"
    - "-DTILEDB_GCS=OFF"
    - "-DTILEDB_SERIALIZATION=OFF"
    - "-DTILEDB_WEBP=OFF"
    - "-DTILEDB_TOOLS=OFF"
    - "-DTILEDB_TESTS=OFF"
    - "-DTILEDB_ALLOW_REGEX_CHAR_PATH=ON"

  # 编译依赖列表（格式: name/version，全部来自 ohpcd 制品仓）
  dependencies:
    - blosc2/3.2.3
    - bzip2/1.0.8.2
    - lz4/1.10.0.3
    - openssl/3.5.6.1.2
    - nlohmann_json/3.12.0
    - spdlog/1.17.0
    - fmt/12.2.0
    - zlib/1.3.1.2
    - zstd/1.5.7.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（与 conandata.yml patches 段一致）
patches_applied:
  - "0001-tiledb-CMakeLists.txt.patch"          # 顶层 CMakeLists 补 ZLIB/BZip2/LZ4/Zstd imported target 别名
  - "0002-tiledb-common-indexed_list.h.patch"    # indexed_list.h 依赖类型补 typename（OHOS libc++ 严于 libstdc++）
  - "0003-tiledb-common-log_duration_instrument.h.patch"  # fmt 12.x 移除 std::chrono 内置格式化 → 显式转换
  - "0004-tiledb-sm-compressors-CMakeLists.txt.patch"     # compressors 子工程补 BZip2/ZLIB/LZ4 别名
  - "0005-tiledb-sm-compressors-dd_compressor.cc.patch"  # dd_compressor.cc 依赖类型补 typename
  - "0006-tiledb-sm-crypto-CMakeLists.txt.patch"          # crypto 子工程补 OpenSSL::SSL/Crypto 别名
  - "0007-tiledb-sm-filesystem-uri.cc.patch"              # uri.cc operator<=> 改 < / > 组合（OHOS libc++ 支持不全）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "顶层 CMakeLists 硬编码 C++20；OHOS toolchain 默认 c++17，须显式 -DCMAKE_CXX_STANDARD=20 + CXX_STANDARD_REQUIRED=ON"
  - "OHOS NDK toolchain 会注入 --gcc-toolchain=<sdk>/llvm，clang 报 -Wunused-command-line-argument；TILEDB_WERROR 会把它升级为硬错误 → 只能关 WERROR"
  - "CMake 4.1 的 FindBZip2/FindLZ4/FindZLIB 只解析库变量、不生成 imported target；按 *_INCLUDE_DIR + *_LIBRARY_RELEASE 注值后仍需自行 add_library(... ALIAS ...)"
  - "FindOpenSSL 在 OPENSSL_CRYPTO_LIBRARY 未入缓存时不建 OpenSSL::SSL/Crypto target；OHOS openssl 包只有静态 libssl.a/libcrypto.a"
  - "CMake 4.1 CONFIG 模式不从 CMAKE_PREFIX_PATH 搜 <pkg>-config.cmake，必须显式给 Blosc2_DIR / nlohmann_json_DIR / spdlog_DIR / zstd_DIR / fmt_DIR"
  - "OHOS SDK 无 llvm-ranlib，需用 llvm-ar s 生成 ranlib shim（CMAKE_RANLIB）"
  - "libtiledb.so 需 binary-sign-tool -selfSign 1 重新签名，否则设备侧 dlopen 失败"
  - "上游 Catch2+rapidcheck 测试套件因 rapidcheck 未发布到 ohpcd 而关闭（TILEDB_TESTS=OFF），改用消费者侧 C API 探测"

