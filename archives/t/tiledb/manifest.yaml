software: tiledb
display: "TileDB"
description: "TileDB：面向多维、异构数据的高速分析查询数组数据库（C/C++/C API）"
category: library
homepage: "https://github.com/TileDB-Inc/TileDB"
license: MIT
build_system: cmake
ohos_adaptation:
  key_points:
    - "CMake 构建；顶层 CMakeLists 硬编码 C++20，OHOS libc++(clang 15) 须强制 -std=c++20（OHOS toolchain 默认 c++17）"
    - "OHOS NDK toolchain 注入 --gcc-toolchain=<sdk>/llvm，tiledb TILEDB_WERROR 将其升级为硬错误 → 关 WERROR 保留其余告警"
    - "CMake 4.1 的 FindBZip2/FindLZ4/FindZLIB 模块只解析库变量、不建 BZip2::BZip2/LZ4::LZ4/ZLIB::ZLIB imported target，按 *_LIBRARY_RELEASE 变量补建"
    - "FindOpenSSL 在 OPENSSL_CRYPTO_LIBRARY 未入缓存时不建 OpenSSL::SSL/Crypto target；OHOS openssl 包仅静态库 libssl.a/libcrypto.a，按变量补建 imported target"
    - "CMakeDeps 生成 fmt-config.cmake，CMake 4.1 CONFIG 模式需显式 fmt_DIR（generators 目录）"
    - "上游 C++ 测试套件（Catch2+rapidcheck，数百用例）rapidcheck 未发布制品仓 → TILEDB_TESTS=OFF；消费者侧用 test_package C API 探测"
    - "fmt 12.x 移除 std::chrono 内置格式化，log_duration_instrument.h 显式转 duration/time_point"
    - "indexed_list.h / dd_compressor.cc 缺 typename（OHOS libc++ 模板依赖类型）"
    - "uri.cc operator<=> 改 < / > 组合（OHOS libc++ 对 std::string 三向比较支持不全）"
  common_dependencies: []
versions:
  "2.30.1":
    status: built
    build_date: "2026-09-20"
    conan_ref: "tiledb/2.30.1"
    format: conan
    note: "CMake 配方；C++20 硬依赖；OHOS NDK toolchain；关 WERROR；Find 模块 imported target 补建；测试套件因 rapidcheck 未发布而关闭"
