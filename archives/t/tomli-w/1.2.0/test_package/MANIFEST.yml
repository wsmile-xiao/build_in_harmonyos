# test_package/MANIFEST.yml — tomli-w 1.2.0
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: tomli-w/1.2.0
homepage: "https://github.com/hukkin/tomli-w"

# 上游测试套件：tests/ 目录 pytest 套件（tomli-w 零依赖，可本地运行）
upstream_check_command: "pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: tests/
    source: tomli_w-1.2.0/tests/*.py
    description: "pytest 套件：本地实测 269 passed + 2 xfailed（269/269 = 100%，xfailed 不计分母），零失败"
    command: "pytest tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 tomli_w + dump dict 为 TOML）
test_package_tests:
  - file: test_tomli_w.py
    description: "Imports packaged tomli_w and dumps a dict to a TOML string, asserting the output"
    command: "python3 test_tomli_w.py"

# 断言总数：1（TOML dump 输出校验）
assertion_count: 1
