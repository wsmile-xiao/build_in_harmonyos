# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tqdm/4.70.1
homepage: "https://github.com/tqdm/tqdm"

upstream_check_command: "python3 -m pytest tests/"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/"

upstream_tests:
  - name: tests/（pytest 套件）
    count: "collected 179 / passed 169 / failed 1 / skipped 9"
    description: "依赖补齐后 OHOS 全量重跑（pytest 9.1.1 + pytest-asyncio 1.4.0 +
      pytest-mock 3.16.0，隔离 venv），原 9 例 asyncio 用例全部转绿。残余 1 例
      tests_main.py::test_pipes：该 CPython 构建的列表式 subprocess 不做裸命令名
      PATH 搜索（显式设置 PATH 仍 FileNotFoundError，shell=True 正常），为真平台
      差异而非移植缺陷。证据：upstream-tqdm-rerun.log"

test_package_tests:
  - file: test_tqdm.py
    description: "消费者测试（R34）：非 TTY 流（StringIO/重定向）下 trange 静默
      迭代、iterable 包装、format_meter 渲染、类 API update 计数；__version__ 按
      4.70 系列断言（上游 sdist 版本号回填遗漏，见 notes.md）。"
    command: "python3 test_tqdm.py <site-packages>"

assertion_count: 7
