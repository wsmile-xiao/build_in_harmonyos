conan_ref: "tesseract/5.5.3"

source:
  url: "https://github.com/tesseract-ocr/tesseract/archive/refs/tags/5.5.3.tar.gz"
  sha256: "9218e62793116d42a9f6d14cd9348518b27f382096eea3d0f2d1a24616bb5884"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_TRAINING_TOOLS=False"
    - "GRAPHICS_DISABLED=True"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "DISABLE_CURL=True"
  dependencies:
    - leptonica/1.87.0
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-src-arch-simddetect.cpp.patch"

patches_description:
  0001-src-arch-simddetect.cpp.patch: "Fix aarch64 NEON SIMD detection: guard NEON code paths with HAVE_NEON macro to prevent link errors on OpenHarmony where HAVE_NEON is not defined at compile time"

knowledge_gained:
  - "aarch64 平台 SIMD 检测逻辑与 5.3.3 相同：原代码在 #if defined(__aarch64__) 时无条件启用 NEON，但 HAVE_NEON 未定义导致 NEON 函数链接错误"
  - "修复方案：将 #if defined(__aarch64__) 改为 #if defined(HAVE_NEON) && defined(__aarch64__)，添加 #elif defined(__aarch64__) 设 neon_available_=false"
  - "训练工具（BUILD_TRAINING_TOOLS）依赖 pango/cairo，鸿蒙平台不可用，需禁用"
  - "ScrollView 图形界面（GRAPHICS_DISABLED）在无头构建环境下需禁用"
  - "DISABLE_CURL=True 禁用 curl 支持，因 conan 构建环境中 curl 不可用"
  - "tesseract 既有库（libtesseract）又有可执行文件（tesseract binary），需 commands.json (R38)"

ci_verification:
  environment: "Python 3.12.9, Conan 2.29.1, Clang 15.0.4"

