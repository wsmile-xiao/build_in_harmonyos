# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tesseract/5.5.3
homepage: "https://github.com/tesseract-ocr/tesseract"

upstream_check_command: "ctest"

upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure --timeout 120"

upstream_test_total: 59
upstream_test_passed: 45
upstream_test_failed: 14
upstream_test_pass_rate: "76.3%"

upstream_failure_categories:
  - category: "/tmp 只读导致 Subprocess aborted"
    count: 2
    tests: ["commandlineflags_test", "fileio_test"]
    reason: "OHOS /tmp 只读，googletest 无法创建临时文件"
    fix: "设置 TMPDIR 环境变量"
  - category: "LSTM 计算超时"
    count: 3
    tests: ["lstm_recode_test", "lstm_squashed_test", "lstm_test"]
    reason: "LSTM 神经网络测试 120s 超时不够"
    fix: "增加超时至 600s"
  - category: "缺少特定语言模型导致 SEGFAULT"
    count: 3
    tests: ["baseapi_test", "baseapi_thread_test", "layout_test"]
    reason: "baseapi_test 前10个子测试通过，第11个缺少 hin.traineddata；layout_test 前2个通过，第3个缺少希伯来文数据"
    fix: "下载 hin.traineddata 和希伯来文测试数据"
  - category: "缺少训练数据导致 SEGFAULT"
    count: 2
    tests: ["lstmtrainer_test", "mastertrainer_test"]
    reason: "需要 langdata_lstm 训练数据集"
    fix: "下载 langdata_lstm"
  - category: "断言失败 - 具体原因各异"
    count: 4
    tests: ["unicharcompress_test", "loadlang_test", "osd_test", "lang_model_test"]
    details:
      unicharcompress_test: "traineddata版本差异, DoesChinese/DoesJapanese断言失败, DoesKorean/DoesKannada通过"
      loadlang_test: "缺少kmr.traineddata(库尔德语), 前3个英语子测试通过"
      osd_test: "leptonica未启用PNG, hebrew.png无法读取, 前2个子测试通过"
      lang_model_test: "缺少langdata_lstm/radical-stroke.txt"
    reason: "数据版本差异/缺少特定语言模型/PNG未启用/缺少训练数据"
    fix: "使用匹配版本traineddata/下载kmr.traineddata/启用PNG/下载langdata_lstm"

upstream_tests:
  - file: unittest/apiexample_test.cc
    description: "API example test (OCR)"
    status: "passed"
  - file: unittest/baseapi_test.cc
    description: "Base API test - 前10个子测试通过，第11个缺少hin.traineddata"
    status: "failed"
    reason: "第11个子测试TestMultipleTessInstances缺少hin.traineddata"
  - file: unittest/bitvector_test.cc
    description: "Bit vector test"
    status: "passed"
  - file: unittest/equationdetect_test.cc
    description: "Equation detection test"
    status: "passed"
  - file: unittest/pagesegmode_test.cc
    description: "Page segmentation mode test"
    status: "passed"
  - file: unittest/textlineprojection_test.cc
    description: "Text line projection test"
    status: "passed"

test_package_tests:
  - file: test.cpp
    description: "消费者测试: TessVersion API"
    command: "./test_tesseract"
    status: "passed"

assertion_count: 2
upstream_test_count: 59
upstream_test_passed: 45
upstream_test_failed: 14
