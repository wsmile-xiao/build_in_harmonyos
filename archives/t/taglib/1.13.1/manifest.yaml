# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.13.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.13.1"

# 软件名
software: "taglib"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-04"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/taglib/taglib/releases/download/v1.13.1/taglib-1.13.1.tar.gz"

  # 源码校验和
  sha256: "c8da2b10f1bfec2cd7dbfcd33f4a2338db0765d851a50583d410bacf055cfd0b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "BUILD_BINDINGS=ON"
    - "BUILD_TESTING=ON"
    - "BUILD_EXAMPLES=OFF"
    - "WITH_ZLIB=ON"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - cppunit/1.15.1 (build-only)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "taglib 1.13.1 declares cmake_minimum_required(VERSION 3.0.0); CMake 4.x requires CMAKE_POLICY_VERSION_MINIMUM=3.5 in the toolchain."
  - "BUILD_BINDINGS=ON builds the official C bindings (bindings/c) into libtag_c with include/taglib/tag_c.h installed next to the C++ headers."
  - "Upstream maps Conan zlib onto the ZLIB::ZLIB CMake target before CMakeDeps generation."
  - "364 upstream CppUnit cases are compiled into test_runner; on OHOS the aggregate runner is not executed (CI segfault policy inherited from taglib 2.3 archive)."
