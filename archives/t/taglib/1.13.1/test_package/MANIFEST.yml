# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
package: taglib/1.13.1
homepage: https://taglib.org/

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "cmake --build . --target test_runner"
upstream_tests:
  - file: tests/test_string.cpp
    source: taglib-1.13.1.tar.gz/tests/test_string.cpp
    description: "TagLib string API cases compiled into the upstream CppUnit runner"
    command: "cmake --build . --target test_runner"
  - file: tests/test_fileref.cpp
    source: taglib-1.13.1.tar.gz/tests/test_fileref.cpp
    description: "FileRef format handling cases compiled into the upstream CppUnit runner"
    command: "cmake --build . --target test_runner"
  - file: tests/test_id3v2.cpp
    source: taglib-1.13.1.tar.gz/tests/test_id3v2.cpp
    description: "ID3v2 tag parsing cases compiled into the upstream CppUnit runner"
    command: "cmake --build . --target test_runner"
  - file: tests/test_mp4.cpp
    source: taglib-1.13.1.tar.gz/tests/test_mp4.cpp
    description: "MP4 metadata cases compiled into the upstream CppUnit runner"
    command: "cmake --build . --target test_runner"
  - file: bindings/c/tag_c.cpp
    source: taglib-1.13.1.tar.gz/bindings/c/tag_c.cpp
    description: "Official C bindings implementation compiled into libtag_c (validated by the consumer test)"
    command: "cmake --build . --target tag_c"

test_package_tests:
  - file: test_tag_c.c
    description: "Pure-C consumer exercising taglib_file_new/taglib_tag_set_*/taglib_tag_title round-trip and audio properties through tag_c.h"
    command: "./test_tag_c"

assertion_count: 373
