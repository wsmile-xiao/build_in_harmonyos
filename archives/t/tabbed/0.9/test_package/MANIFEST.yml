package: tabbed/0.9
homepage: https://tools.suckless.org/tabbed/

# ── 上游测试清点（R51 三步法，四类资产在解包树上递归实测）──────────────
upstream_tests_exist: false
upstream_test_audit: >-
  The published tabbed-0.9.tar.gz unpacks to exactly 9 files (Makefile, arg.h,
  config.def.h, tabbed.c, xembed.c, tabbed.1, xembed.1, LICENSE, README) and no
  subdirectory at all. Measured on the unpacked tree: no file matching the
  test* / *test* patterns, nothing under */res/*, no RUNTEST shell script, no
  demo/examples C source; the assert( counter is 0 in every source file and
  <assert.h> is never included. The Makefile declares only
  all/clean/dist/install/uninstall, so there is no check/test target to run.
upstream_check_command: N/A — 上游 Makefile 的 .PHONY 行实测只有 all clean dist install uninstall，无 check/test 目标
upstream_test_in_build: false
upstream_test_command: N/A
upstream_test_count: 0
upstream_tests_ran: 0
upstream_tests_passed: 0
upstream_tests_note: >-
  上游确实零测试（静态清点 N=0），按检查清单通用#12 允许只补消费者测试。消费者测试补
  4 条断言；差集理由：tabbed 的完整职责（建容器窗、绘制标签栏、XEmbed 事件循环）需要
  一个 X server，本机没有，服务端往返明确记为未覆盖；可无头执行的是 XOpenDisplay 之前
  的全部参数路径，以及 xembed 辅助程序自身的 usage 路径（注意 xembed 并非零依赖：上游
  单条 .o 规则把同一套 -lX11 -lfontconfig -lXft 也链进了它），消费者测试只断言这两类。
  R40 标注：本包属图形/窗口类，容器窗与 XEmbed 事件循环在 OHOS 上未验证，需人工确认
  适配完整性（配方层无实质平台补丁，patches 为空）。

test_package_tests:
  - file: test_tabbed.sh
    description: >-
      Really runs the two installed programs: tabbed -v must print the
      "tabbed-0.9," banner on stderr; tabbed -Z must print the usage banner
      naming tabbed [-dfksv]; tabbed with no display must reach XOpenDisplay
      and print "cannot open display", which also proves the libX11/libXft/
      libfontconfig runtime closure really loaded; xembed with too few
      arguments must print its own usage line. Every assertion matches stderr
      TEXT, because upstream routes all of tabbed's early exits through die()
      and exit(EXIT_FAILURE), so exit codes carry no information here.
    command: sh test_tabbed.sh

# ── 申报数（静态声明 ↔ 运行汇总双向一致）──────────────────────────────
test_files:
  - path: test_package/test_tabbed.sh
    test_type: R34
    assertion_count: 4

test_package_test_count: 1
consumer_assertion_count: 4
assertion_count: 4
test_case_count: 4
# A 机实测（2026-09-24，memcap-run.py --probe）：被测命令最重路径
# （tabbed 加载完整 X11/Xft/fontconfig 闭包后走到 XOpenDisplay）与整份
# test_tabbed.sh（4 断言全跑）峰值均为 5MB；单跑 tabbed -v 为 3MB。
# 取最重者 5MB 申报（原申报 4MB 系 B 机未实测的估值）。证据边界：probe 的原始 stdout
# 未归档，故本字段是申报值而非门禁证据（G0-G4/L0-L5/W3 均不引用它）；复现方法见
# notes.md 第 6 节。
max_rss_mb: 5
