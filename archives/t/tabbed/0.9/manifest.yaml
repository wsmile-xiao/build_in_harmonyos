patches_applied: []

knowledge_gained:
  - .POSIX: 让 GNU make 的隐式 CC 变成 c99，本机无 c99 ⇒ 必须在 make 命令行显式注入交叉 clang
  - Makefile 的 TABBED_CPPFLAGS 不引用 CPPFLAGS，头文件搜索目录只能塞进 CFLAGS 才有效
  - 上游链接 -lX11 -lfontconfig -lXft，依赖不是台账写的只依赖 libx11
  - tabbed 的所有早退路径（含 -v）都经 die() 返回 EXIT_FAILURE ⇒ 断言只能核 stderr 文本
  - 产物是两个 ELF（tabbed 与 xembed），commands.json 属软件级且 type 为 tool
