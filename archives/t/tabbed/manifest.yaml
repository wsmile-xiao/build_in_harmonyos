software: tabbed
display: tabbed
description: X11 tab container — gives any application a tab bar by embedding each window as a tab
category: system
homepage: https://tools.suckless.org/tabbed/
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - 上游是裸 .POSIX: Makefile，没有 configure/CMake；.POSIX: 会把 GNU make 的隐式 CC 变成 c99，本机没有 c99，必须在 make 命令行注入交叉 clang
    - TABBED_CPPFLAGS 不引用 CPPFLAGS，依赖的 -I 只能走 CFLAGS，-L 走 LDFLAGS
    - 真实链接集是 -lX11 -lfontconfig -lXft（不是只依赖 libx11），libxft 会传递带上 freetype/xrender
    - 一次 make 产出两个 ELF：tabbed 与 xembed，两者都要装、都要签
    - 不使用 make install：PREFIX 是普通 = 赋值，产物在 package() 里手工放置
  common_dependencies:
    - libx11
    - libxft
    - fontconfig
    - xorgproto

versions:
  0.9:
    status: built
    build_date: 2026-09-24
