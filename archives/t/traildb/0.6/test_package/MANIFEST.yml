package: traildb/0.6
homepage: "https://github.com/traildb/traildb"

upstream_tests_exist: true

upstream_test_audit:
  source_tarball: "0.6.tar.gz"
  source_sha256: "f73515fe56c547f861296cf8eecc98b8e8bf00d175ad9fb7f4b981ad7cf8b67c"
  top_level_files:
    - tests/c-tests/                # 38 .c test programs + tdb_test.h (waf test suite)
    - tests/tdbcli/test_tdbcli.py   # CLI test, needs test_cli variant (not in default suite)
    - wscript                       # waf build + test runner (./waf test)
    - configure.ac                  # autotools build (no make check targets)
    - Makefile.am                   # libtraildb.la + tdb + traildb_bench, no TESTS
    - src/traildb.h                 # public C API
  scanned_for:
    - "tests/c-tests/*.c (waf test programs)"
    - "waf_unit_test registration in wscript"
    - "Makefile.am TESTS / check_PROGRAMS"
    - "ctest / gtest macros"
  scan_result: "tests/c-tests holds 38 .c programs (39 files minus tdb_test.h); wscript builds each as waf_unit_test program and runs them via ./waf test; Makefile.am defines no TESTS/check targets so autotools make check runs nothing; recipe compiles+runs the same 38 programs in conanfile build() against the directly compiled lib (no autotools bootstrap)"
  total_from_c_tests_glob: 38
  reason: "upstream test suite is the waf c-tests directory; autotools has no own tests, so the recipe reuses the waf program list for the autotools build"

upstream_test_total: 38
upstream_test_count_method: auto

upstream_check_command: "./waf test"
upstream_test_in_build: true
upstream_test_command: "compile+run tests/c-tests/*.c (37 on release lib + out_of_memory.c on -DEVENTS_ARENA_INCREMENT=100 debug-variant lib per wscript test variant; ohos_feature skip with real evidence if absolute RLIMIT baseline blocks it)"

upstream_tests:
  - file: tests/c-tests/basic_append.c
    source: traildb-0.6/tests/c-tests/basic_append.c
    description: "append + cons/open/cursor API coverage (representative of 38 c-tests)"
    command: "./basic_append (TDB_TMP_DIR set per test)"
  - file: tests/c-tests/smoke_test.c
    source: traildb-0.6/tests/c-tests/smoke_test.c
    description: "link + include smoke test"
    command: "./smoke_test (TDB_TMP_DIR set per test)"
  - file: tests/c-tests/out_of_memory.c
    source: traildb-0.6/tests/c-tests/out_of_memory.c
    description: "RLIMIT_AS stress test run for real against debug-variant lib (-DEVENTS_ARENA_INCREMENT=100, wscript test variant); upstream wscript skips it on darwin; if OHOS absolute-RLIMIT vs HNP baseline blocks later decrease loops it is recorded as ohos_feature skip with the real exit tail"
    command: "./out_of_memory against libtraildb_dbg.a (TDB_TMP_DIR isolated, 900s timeout)"

test_package_tests:
  - file: test_traildb.c
    description: "consumer API test: cons open/add/finalize + open/cursor read (7 checks)"
    command: "ctest --output-on-failure"

assertion_count: 45
