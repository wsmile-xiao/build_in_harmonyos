patches:
  - patch_file: "patches/0001-disk.c.patch"
    patch_description: "HarmonyOS PC 上 /proc/diskstats（-> /sys/block/diskstats）仅 root 可读且 CI 无 sudo：init_disks() 打不开时告警降级为纯 CPU 监控而非 die() 退出，do_disks() 对 NULL 早退"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-topline.c.patch"
    patch_description: "musl/HarmonyOS 的 pselect6 不回写剩余超时（上游目标平台的 select() 语义会回写），主循环 delay 永不归零导致永远不采样；每轮迭代末手动清零 delay 恢复采样节奏"
    patch_type: "portability"
    strip: 1
