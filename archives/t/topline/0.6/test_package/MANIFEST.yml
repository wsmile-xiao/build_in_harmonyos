# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# 上游测试清点证据（topline 0.6, tag v0.6）：
#   - 源码树仅含 topline.c / cpu.c / disk.c / signals.c + Makefile，无 tests/ 目录；
#   - Makefile 目标仅 all/clean，无 check/test 目标（`make -n check` 报
#     "No rule to make target 'check'"）；
#   - 源码无任何测试框架注册宏（无 TEST(*/CHECK*/assert-test 套件入口）。
# 故 N_static=0 属上游事实，按规则以消费者测试补位。

package: topline/0.6
homepage: "https://github.com/kilobyte/topline"

upstream_check_command: "make check（上游 Makefile 无 check 目标，N_static=0）"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.c
    description: "消费者测试：真实执行包内 topline 二进制（重定向 stdout 采样 3 秒），断言其完成 exec、产出监控输出且输出含数字统计"
    command: "./test_topline <package>/bin/topline"

assertion_count: 3
