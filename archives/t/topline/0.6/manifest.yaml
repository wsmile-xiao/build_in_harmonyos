knowledge_gained:
  - "HarmonyOS PC 上 /proc/diskstats（-> /sys/block/diskstats）仅 root 可读、CI 无 sudo：读取类监控工具必须代码级优雅降级（sudo-run 方案在 CI 不可用）"
  - "musl/HarmonyOS 的 pselect6 不回写剩余 timeout（与上游目标平台 select() 语义不同），依赖 delay 归零判断的循环永不采样；需手动清零或改用时钟计时"
  - "上游 Makefile 硬编码 CC=gcc（OHOS 工具链无 gcc/cc），必须显式传 make CC=<conan conf 的 clang>"
  - "topline 首次 do_line(1) 为静默采样（log_output 重定向 /dev/null），真实输出自首个 interval 周期后开始"
  - "上游无测试套件（无 check 目标/无 tests 目录），N_static=0，以消费者行为测试补位"

