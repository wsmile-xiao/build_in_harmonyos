# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.2"

# 软件名
software: "taocpp-operators"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-04"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/taocpp/operators/archive/refs/tags/1.2.2.tar.gz"

  # 源码校验和
  sha256: "9e7811621c86444d6c4f47f822eaee713039b04ab38fb9ad652046e4ab4f647c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DTAOCPP_OPERATORS_BUILD_TESTS=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - Header-only package: use package_type header-library and target taocpp-operators::taocpp-operators.
  - CMake 4.1.2 requires explicit CMAKE_POLICY_VERSION_MINIMUM=3.5 for this legacy project.
test_results:
  type: official
  total: 2
  executed: 2
  passed: 2
  failed: 0
  skipped: 0
  note: "Two upstream CTest targets executed and passed; test_operators.cpp contains 39 assert and 40 static_assert statements, which are assertions rather than additional test cases."
consumer_results:
  type: test_package
  total: 1
  executed: 1
  passed: 1
  failed: 0
  skipped: 0
  assertions: 2
