# 版本级 manifest — trousers 0.3.15
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3.15"
software: "trousers"
status: built
build_date: "2026-10-03"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/t/trousers/trousers_0.3.15.orig.tar.gz"
  sha256: "1e5be93e518372acf1d92d2f567d01a46fdb0b730487e544e6fb896c59cac77f"
  tar_format: tar.gz
  upstream: "https://trousers.sourceforge.net/ (0.3.15; SourceForge mirrors time out, Debian official archive used)"

build:
  system: autotools
  configure_options:
    - "autoreconf -fi（release tarball 不含 configure）"
    - "--with-gui=none（不依赖 GTK2 口令弹窗）"
    - "--build/--host=aarch64-unknown-linux-gnu（避免运行 conftest，E064）"
    - "--disable-shared --enable-static"
  dependencies:
    - openssl/3.5.6.1
  build_tools:
    - automake/1.18 (tool_requires)
    - libtool/2.5.4 (tool_requires)
    - pkg-config/0.29.2 (tool_requires)
    - "worker autoconf 2.72 / m4 / make"
  cc: clang

patches_applied:
  - "0001-tcsd-posix-portability.patch"
  - "0002-tspi-ps-portable-getpwent.patch"

package_type: library
artifacts:
  - "lib/libtspi.a"
  - "lib/libtddl.a"
  - "bin/tcsd"
  - "include/tss/*.h（TSS 1.2 API 头，23 个）"
  - "include/trousers/*.h"
  - "share/man/man8/tcsd.8、share/man/man5/tcsd.conf.5"
  - "etc/tcsd.conf、licenses/LICENSE"
libs:
  - tspi
  - tddl
requires:
  - openssl/3.5.6.1

tests:
  upstream_suite: "无（Makefile.am 未注册 check_PROGRAMS/TESTS；*_selftest.c 需要真实 TPM）"
  upstream_audit: "build() 内执行 grep -nE 'check_PROGRAMS|^TESTS|check-local|^check:' 与 find -iname '*test*'，结果随 conan create 日志留证"
  consumer_checks: 6
  consumer_failures: 0
  consumer_pass_rate: "6/6 (100%)"
  command: "conan create archives/t/trousers/0.3.15 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"

adaptation_paths:
  - A
