package: trousers/0.3.15
homepage: "https://trousers.sourceforge.net/"

upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests:
  - name: upstream-suite-audit
    command: "grep -nE 'check_PROGRAMS|^TESTS|check-local|^check:' Makefile.am src/Makefile.am src/*/Makefile.am"
    expected: "no match: no Makefile.am registers a check target; the *_selftest.c sources are compiled into the libraries and only run against a live TPM, so the audit runs in build() and is recorded in the conan create log"

test_package_tests:
  - file: test_trousers.c
    description: "Link against libtspi and drive the public TSPI context/policy API offline: context create/close, default policy, usage policy object, plain secret"
    command: "./trousers_consumer"

assertion_count: 6
