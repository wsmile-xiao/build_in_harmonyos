sources:
  # Upstream is hosted on SourceForge; the release tarball is identical to the
  # Debian archive copy, and downloads.sourceforge.net's mirrors time out from
  # the build workers (twds.dl.sourceforge.net read timeout), so the stable
  # Debian official archive of the same release is used (see notes.md).
  url: "https://deb.debian.org/debian/pool/main/t/trousers/trousers_0.3.15.orig.tar.gz"
  sha256: "1e5be93e518372acf1d92d2f567d01a46fdb0b730487e544e6fb896c59cac77f"

patches:
  - patch_file: "patches/0001-tcsd-posix-portability.patch"
    patch_description: "Use portable C library entry points in tcsd: strrchr() instead of the BSD rindex(), and a getutent() scan instead of the getutid() entry point musl/HarmonyOS does not export"
    patch_type: "portability"
  - patch_file: "patches/0002-tspi-ps-portable-getpwent.patch"
    patch_description: "Resolve the user home directory with the portable setpwent/getpwent/endpwent iterator instead of the non-POSIX getpwent_r(), which musl/HarmonyOS does not export"
    patch_type: "portability"
