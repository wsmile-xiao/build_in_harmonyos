# test_package/MANIFEST.yml
# 上游官方测试声明文件（taocpp-tuple 1.0.0）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: taocpp-tuple/1.0.0
homepage: "https://github.com/taocpp/tuple"

# 上游测试入口：CMake 测试目标（src/test/tuple/CMakeLists.txt 注册 3 个可执行测试）
upstream_check_command: "ctest -N"

# conanfile.py build() 中未集成上游测试（header-only，无编译阶段）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（源码声明 3 个独立可执行用例）
upstream_tests:
  - file: src/test/tuple/tuple_main.cpp
    source: tuple-1.0.0/src/test/tuple/tuple_main.cpp
    description: "tao::tuple 构造/get/比较/tie/make_tuple 基础断言"
    command: "./tuple_main"
  - file: src/test/tuple/tuple_cat.cpp
    source: tuple-1.0.0/src/test/tuple/tuple_cat.cpp
    description: "tao::tuple_cat 拼接与按类型 get 断言"
    command: "./tuple_cat"
  - file: src/test/tuple/tuple_benchmark.cpp
    source: tuple-1.0.0/src/test/tuple/tuple_benchmark.cpp
    description: "编译期 tuple 构造基准（constexpr 编译期验证）"
    command: "./tuple_benchmark"

# test_package 中自带的测试（消费者视角验证，R34 实质调用公开 API）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：tao::tuple/make_tuple/tie/tuple_cat/按类型 get"
    command: "./test_taocpp_tuple"
  - file: test_ohos.cpp
    description: "HarmonyOS 专项测试：constexpr/get/tie/tuple_cat/比较运算（OHOS 工具链真实运行）"
    command: "./test_ohos"

# 测试断言总数（近似值，质量评估用）：test.cpp 18 + test_ohos.cpp 23 ≈ 41
assertion_count: 41
