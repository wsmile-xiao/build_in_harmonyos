# 版本级 manifest — taocpp-tuple 1.0.0

version: "1.0.0"

software: "taocpp-tuple"

# 编译状态: built（conan create 通过；尚未 upload）
status: built

# 编译日期
build_date: "2026-09-19"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源 URL（taocpp/tuple tag 1.0.0 官方归档）
  url: "https://codeload.github.com/taocpp/tuple/tar.gz/refs/tags/1.0.0"

  # 官方归档 SHA-256
  sha256: "a35de253039fa1095244c2cc399458975a87b7f835e4d841fc10e8c8c14cc9dc"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（header-only，CMake 仅安装头文件）
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（无第三方依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁（header-only 库，纯头文件直接可用）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "taocpp/tuple 是 header-only C++11 库，无需编译；打包方式对齐 sole/tinyformat/ctl 先例（package_type=header-library）"
  - "上游 CMakeLists 导出 NAMESPACE taocpp:: 的 config，package_info 需显式设置 cmake_target_name=taocpp::tuple 以对齐上游目标名"
