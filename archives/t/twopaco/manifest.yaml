# 软件级 manifest — twopaco
# 遵循 ARCHIVE-SPEC v2.0

software: twopaco
display: "TwoPaCo"
description: "基因组 de Bruijn 图压缩构建工具 — 从多份完整基因组直接构建压缩图（twopaco + graphdump）"
category: science
homepage: "https://github.com/medvedevgroup/TwoPaCo"
license: "Custom OSS (见 LICENSE.txt)"
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "CMake 双可执行包（twopaco + graphdump），无库无头；TCLAP 已 vendored 在 src/common/tclap，仅外部依赖 Intel TBB"
    - "上游 CMake 用 TBB_INCLUDE_DIR/TBB_LIB_DIR 变量接线（非 find_package），配方从 tbb 依赖的 cpp_info 绝对路径喂入"
    - "constructor.cpp 用 log2 却未含 <cmath>，GCC 宽松通过、clang/libc++ 报错，需补丁"
    - "上游测试为 twopaco --test（10 组随机 junction 对照），退出码恒 0，必须逐行解析 Test # N PASSED/FAILED，不可信退出码"
    - "可执行文件需 binary-sign-tool 重签，否则 OHOS 上 exec 报 Permission denied"
  common_dependencies:
    - tbb

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.0":
    status: adapting
    notes: >-
      1.0.0 为 TBB 依赖版本（1.1.0 起去 TBB）；Debian/conda 同版均链 TBB，
      本配方沿用 tbb/2023.0.0 依赖。
