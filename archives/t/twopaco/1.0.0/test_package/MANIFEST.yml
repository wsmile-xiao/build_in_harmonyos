# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: twopaco/1.0.0
homepage: "https://github.com/medvedevgroup/TwoPaCo"

# ── 上游测试：在主配方 build() 内真实编译并执行 ──────────────────────────
# 上游测试是 twopaco 内建的随机 junction 对照（非 ctest）：
#   src/graphconstructor/constructor.cpp: RunTests(10, 20, 9000, 6, ...)
# 主配方 build() 执行 <build>/graphconstructor/twopaco --test --tmpdir <tmp>，
# 逐行解析 "Test # N PASSED|FAILED"（N=0..9），passed+failed==10 才放行。
# 注意上游 --test 恒 exit 0，退出码不可信，只认日志行。
upstream_check_command: "twopaco --test --tmpdir <build>/upstream-tmp -f 32 <build>/upstream-tmp/upstream-dummy.fa   # build() 内直接执行（-f/dummy 仅满足 TCLAP 必选参数，--test 分支不使用其内容）"
upstream_test_in_build: true
upstream_test_command: "\"<build_folder>/build-ohos/graphconstructor/twopaco\" --test --tmpdir \"<build_folder>/upstream-tmp\" -f 32 \"<build_folder>/upstream-tmp/upstream-dummy.fa\""

# ── 分母（与官方口径一致）────────────────────────────────────────────
# 取数：grep -n "RunTests(10," src/graphconstructor/constructor.cpp → 首参 10。
# 输出行 "Test # <t> PASSED"（src/graphconstructor/test.cpp），t=0..9 共 10 行。
upstream_test_total: 10
upstream_test_count_method: auto

# 逐套件用例数（单一内部套件，交付配置下真实编译执行）
upstream_tests:
  - suite: internal junction tests
    cases: 10
    delivered_config: compiled
    source: "src/graphconstructor/test.cpp (RunTests) via twopaco --test"
    note: "随机序列对照（naive vs Bloom），filterBits=20/len=9000/chr=6/k=3,5,7,9/rounds=1..4/threads=4"

# test_package 消费者测试（4 个真实用例，见 test_twopaco.py）
test_package_tests:
  - file: test_twopaco.py
    description: "twopaco --help 真实执行（exit 0 + 输出非空）"
    command: "python3 test_twopaco.py <pkg>"
  - file: test_twopaco.py
    description: "graphdump --help 真实执行（exit 0 + 输出非空）"
    command: "python3 test_twopaco.py <pkg>"
  - file: test_twopaco.py
    description: "twopaco 端到端建图（确定性 2x200bp FASTA，out.bin 存在且非空）"
    command: "python3 test_twopaco.py <pkg>"
  - file: test_twopaco.py
    description: "graphdump -f seq 转储（输出非空，每行 chr pos id 三列）"
    command: "python3 test_twopaco.py <pkg>"
assertion_count: 4

# 依赖处置（与 conanfile.py 一致）
dependencies_notes:
  - "tbb/2023.0.0: 上游 graphconstructor/graphdump 直链 tbb/tbbmalloc/tbbmalloc_proxy + pthread；TCLAP 已 vendored，无需外部 tclap。"
