software: twopaco
version: "1.0.0"
build_system: cmake
status: adapting
source:
  url: "https://github.com/medvedevgroup/TwoPaCo/archive/refs/tags/v1.0.0.tar.gz"
  sha256: "2e32a8f924d42526a5298ddf5baa78a24880934f62cc958d073a34cd9c4eaa3d"
knowledge_gained:
  - "OHOS/musl 下 libtbbmalloc_proxy.so 的 DT_NEEDED 为相对路径（../../clang_*/libtbbmalloc.so），musl 按路径解析，LD_LIBRARY_PATH/RPATH 无法满足，启动即 Error 127；twopaco 仅需 libtbbmalloc 的显式 scalable_malloc/scalable_free，proxy 系透明劫持非必需，故 0002 补丁去 -ltbbmalloc_proxy（TBB 升级时需复查该库 DT_NEEDED 是否仍为相对路径）"
