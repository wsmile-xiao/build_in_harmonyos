software: tcc
version: "0.9.27mob"
status: built
build_date: "2026-05-26"
build_system: autotools

source:
  url: "https://repo.or.cz/tinycc.git/snapshot/3b1fe97a596a7c69e693e962f4fe9b35128b68fd.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--cc=clang"
    - "--sysroot=/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot"
    - "--triplet=aarch64-linux-ohos"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "configure 需要指定 --cc=clang（系统无 gcc）"
  - "必须指定 --sysroot 和 --triplet 才能找到 OpenHarmony SDK 的头文件"
  - "libtcc1.a 需要用 clang 编译（arm64-libtcc1-usegcc=yes），因为 tcc 解析器不支持 OpenHarmony 头文件中的 __attribute__((__availability__...))"
  - "OpenHarmony 要求所有可执行文件经过 ELF 签名，tcc 编译的程序也需要签名"