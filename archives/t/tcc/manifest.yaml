software: tcc
display: "Tiny C Compiler"
description: "A small, fast, and unlimited C compiler"
category: compiler
homepage: "https://bellard.org/tcc/"
license: LGPL
build_system: autotools

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "系统无 gcc，需要指定 --cc=clang"
    - "必须指定 --sysroot 和 --triplet 才能找到 OpenHarmony SDK 头文件"
    - "libtcc1.a 需用 clang 编译（arm64-libtcc1-usegcc=yes）"
    - "OpenHarmony 要求所有可执行文件经过 ELF 签名"
  common_dependencies: []

# 版本索引
versions:
  "0.9.27mob":
    status: built
    build_date: "2026-05-26"