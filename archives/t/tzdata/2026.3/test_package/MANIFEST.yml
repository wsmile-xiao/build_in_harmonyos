# test_package/MANIFEST.yml — tzdata 2026.3
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: tzdata/2026.3
homepage: "https://github.com/python/tzdata"

# 上游测试套件：tests/ 目录 pytest 套件（tzdata 零依赖，可本地运行）
upstream_check_command: "pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: tests/
    source: tzdata-2026.3/tests/*.py
    description: "pytest 套件：本地实测 628/628（100%），30 passed + 598 subtests passed，零失败"
    command: "pytest tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 tzdata + zoneinfo.ZoneInfo）
test_package_tests:
  - file: test_tzdata.py
    description: "Imports packaged tzdata and exercises zoneinfo.ZoneInfo('Asia/Shanghai') — proves the timezone data is functional"
    command: "python3 test_tzdata.py"

# 断言总数：上游 628 + test_package 1 = 629
assertion_count: 629
