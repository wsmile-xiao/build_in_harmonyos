# test_package/MANIFEST.yml — tablib 3.10.0
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: tablib/3.10.0
homepage: "https://github.com/jazzband/tablib"

# 上游测试套件：tests/ 目录 pytest 套件（test_tablib.py 等；核心零依赖可本地运行）
upstream_check_command: "pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: tests/
    source: tablib-3.10.0/tests/*.py
    description: "pytest 套件：本地实测 183/183（100%），零失败（两轮修复：装齐格式依赖 + TZ=UTC 对齐时区）"
    command: "pytest tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 tablib + Dataset/CSV 导出）
test_package_tests:
  - file: test_tablib.py
    description: "Imports packaged tablib, builds a Dataset with headers+rows, exports to CSV and asserts content"
    command: "python3 test_tablib.py"

# 断言总数：1（CSV 导出内容校验）
assertion_count: 1
