# test_package/MANIFEST.yml
# 上游官方测试声明文件
# te (boost-ext/te) 1.0.0 — header-only C++17 type erasure library

package: te/1.0.0
homepage: "https://github.com/boost-ext/te"

# 上游测试命令：CMake 构建，测试程序为 test/te.cpp 编译出的 te 可执行文件；
# 另有 13 个 example/*.cpp 示例程序由 CMake 构建为独立可执行文件
upstream_check_command: "cmake --build . && ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/te.cpp
    source: te-1.0.0/test/te.cpp
    description: "上游单元测试（源码声明 28 个独立用例：类型擦除/存储策略/概念擦除等；其中 2 个 concepts 用例受 #if __cpp_concepts 守卫，OHOS profile cppstd=17 时不实例化 → 实际执行 26 个），构建为 te 可执行文件，C++20 下 28/28 全过"
    command: "./te"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：include boost/te.hpp，实际使用 te::poly/Drawable 类型擦除调用"
    command: "./test_te"
  - file: ohos_special_test.cpp
    description: "OHOS 专项测试：本地/共享/动态存储策略在 aarch64-linux-ohos libcxx 下的行为"
    command: "./ohos_special_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 184
