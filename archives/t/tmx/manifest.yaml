software: tmx
display: "tmx"
description: "Portable C library to load Tiled maps in games"
category: data
homepage: "https://github.com/baylej/tmx"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Raw cmake with self-discovered ohos.toolchain (same as libxml2/tinyxml2)"
    - "Module-mode find_package(ZLIB/LibXml2) pinned to Conan packages via ROOT and find-cache variables"
    - "Upstream ships no test suite; verification lives in test_package (14 assertions)"
  common_dependencies:
    - libxml2/2.15.3.1
    - zlib/1.3.1.1

versions:
  "1.10.1":
    packaging: conan
    status: built
    build_date: "2026-09-28"
