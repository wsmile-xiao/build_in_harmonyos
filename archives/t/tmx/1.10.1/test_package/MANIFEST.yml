package: tmx/1.10.1
homepage: "https://github.com/baylej/tmx"

upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: ctest_entries
upstream_test_audit:
  - source: "tmx_1.10.1 tarball top-level listing (61 entries)"
    reason: "The archive contains only src/, examples/, doc/, .github/ and build files; there is no tests/ or test/ directory and no test source file."
  - source: "CMakeLists.txt at tag tmx_1.10.1"
    reason: "No enable_testing(), add_test(), or test target anywhere; the only add_subdirectory is doc/ (Sphinx docs, off by default). CTest entry count is therefore 0."
  - source: ".github/workflows/buildandtest.yaml"
    reason: "Upstream CI only builds the library, builds/runs the dumper demo on data files (no assertions, no pass/fail verdict) and compile-checks the header as C++; it is a demo workflow, not an automated test suite."
  - source: "examples/ (allegro, sdl, raylib, dumper)"
    reason: "Game-engine rendering demos requiring allegro/sdl/raylib plus a map-dump demo; none contain assertions or a test harness."
  - conclusion: "Upstream 1.10.1 provides zero automated tests; verification is carried entirely by the test_package consumer test below."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_tmx.c
    description: "Installed-library consumer test (15 checks): CSV fixture map parses via tmx_load (dimensions, tileset name, layer id/gids, GID tile lookup); tmx_load_buffer covers the same document; missing file fails closed with non-zero tmx_errno plus message (upstream reports E_UNKN, never E_NOENT); malformed XML fails with non-zero tmx_errno; base64+zlib layer decodes through the WANT_ZLIB linkage; ARGB color conversion; id lookup agrees with name lookup. Any failure exits non-zero."
    command: "./test_tmx"
    assertions: 15

upstream_test_count: 0
consumer_test_count: 1
consumer_assertion_count: 15
assertion_count: 15
