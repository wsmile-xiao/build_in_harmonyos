software: time
display: "GNU Time"
description: "测量命令执行时间和资源使用情况"
category: utils
homepage: "https://www.gnu.org/software/time/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 需替换为 automake-1.16 版本支持 HarmonyOS"
    - "configure 中 umask 077 需改为 022 解决 HMDFS 权限问题"
    - "使用 make -j1 单线程编译避免 jobserver FIFO 错误"
    - "gnulib getopt 替换库可能需手动编译（getopt.c, getopt1.c, error.c）"
  common_dependencies: []

versions:
  "1.9":
    status: published
    build_date: "2026-05-21"
    published_as: time
    source_url: "https://ftp.gnu.org/gnu/time/time-1.9.tar.gz"