# transfuse 0.7.6 — 版本级编译元数据
# 注意：source.url / source.sha256 / patches_applied 以 conandata.yml 为准。

version: "0.7.6"
status: built
build_date: "2026-10-01"
conan_ref: "transfuse/0.7.6"

source:
  url: "https://github.com/TinoDidriksen/transfuse/releases/download/v0.7.6/transfuse-0.7.6.tar.bz2"
  sha256: "6ef69d8e2a2361d0add7a9fe0eb0b3af9cad3a29a7c77605e918d1d5f71aaad4"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUNDLED_XXHASH=OFF"
    - "-DBUILD_DOCS=OFF"
    - "-DBUILD_MAN=OFF"
    - "-DCMAKE_PROJECT_INCLUDE=<build>/transfuse_adapt_hook.cmake"
    - "-DCMAKE_CXX_STANDARD=20（由适配钩子设置，见 notes.md §2）"
  dependencies:
    - icu/76.1
    - libxml2/2.15.3.1
    - libzip/1.11.4
    - sqlite3/3.53.4
    - xxhash/0.8.4
  cc: clang
  cxx: clang++
  target: aarch64-linux-ohos

patches_applied:
  - "0001-fix-xxhash-include-dir-parent-scope.patch"

upstream_tests:
  framework: ctest
  count: 14
  command: "ctest（由 build() 中的 cmake.test() 触发）"

consumer_tests:
  framework: shell
  count: 11
  command: "bash test.sh（test_package/）"

knowledge_gained:
  - "OHOS profile 的 compiler.cppstd=17 会经 CMakeToolchain 变成无条件 set(CMAKE_CXX_STANDARD 17)，且该 normal set() 同时屏蔽命令行 -D 与 cache 传值；unset 也不行（会回退到 CMAKE_CXX_STANDARD_DEFAULT=14，同样追加在最后）；正解是 CMAKE_PROJECT_INCLUDE 钩子里 set 成真实值"
  - "CMake 的 pkg_search_module() 把 -l 放进 <PREFIX>_LIBRARIES、-L 放进 <PREFIX>_LIBRARY_DIRS；上游只链前者，故需 link_directories() 补 -L"
  - "CMake FindICU 只在 ICU_FIND_COMPONENTS 含 data 时才查 libicudata，find_package(ICU) 不带组件时静态 ICU 链接会出现 icudt<ver>_dat 未定义"
  - "libzip 依赖 arc4random/arc4random_buf：OHOS libc 有，musl 1.2 之前的运行时没有（跨编译容器常见误判来源）"