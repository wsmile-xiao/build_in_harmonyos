# conandata.yml — transfuse 0.7.6
# Source: official GitHub release tarball for tag v0.7.6
# (https://github.com/TinoDidriksen/transfuse/releases/tag/v0.7.6)

sources:
  url: "https://github.com/TinoDidriksen/transfuse/releases/download/v0.7.6/transfuse-0.7.6.tar.bz2"
  sha256: "6ef69d8e2a2361d0add7a9fe0eb0b3af9cad3a29a7c77605e918d1d5f71aaad4"

patches:
  - patch_file: "patches/0001-fix-xxhash-include-dir-parent-scope.patch"
    patch_type: "bugfix"
    patch_description: "Propagate XXHASH_INCLUDE_DIR (the variable find_path fills in) instead of the never-assigned XXHASH_INCLUDE_DIRS, so #include <xxhash.h> resolves when using a system xxhash"
  - patch_file: "patches/0002-portable-interpreter-shebang.patch"
    patch_type: "portability"
    patch_description: "Resolve bash through PATH (#!/usr/bin/env bash) in tests/extract.sh and tests/clean.sh; CTest execve()s them directly and /bin/bash does not exist on HarmonyOS, so all 14 cases were BAD_COMMAND/Not Run. Interpreter line only, no test logic or .expect change"