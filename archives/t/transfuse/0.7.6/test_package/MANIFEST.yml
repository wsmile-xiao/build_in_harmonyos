# test_package/MANIFEST.yml
# transfuse 0.7.6 — 上游测试声明 + 消费者（鸿蒙特有）测试声明
#
# 上游测试：tests/CMakeLists.txt 用 add_test() 注册 14 个 ctest 用例，
# 由配方 build() 阶段的 cmake.test() 实跑（CI L1c 要求上游测试在 build 期执行）。
#   · extract-{docx,html,html-fragment,pptx,odt,txt}-{apertium,visl} = 6 × 2 = 12
#   · clean-html-{apertium,visl}                                = 2
# 每个用例执行 tests/extract.sh 或 tests/clean.sh，驱动刚构建出的 transfuse
# 可执行文件，并与源码树内已提交的 .expect 文件做 diff 比对。
# 上游 .expect 文件零修改、零删除；两个驱动脚本仅由
# patches/0002-portable-interpreter-shebang.patch 改了解释器行
# (#!/bin/bash → #!/usr/bin/env bash)，测试逻辑与断言未变。

package: transfuse/0.7.6
homepage: "https://github.com/TinoDidriksen/transfuse"

# 上游测试命令（配方 build() 中以 cmake.test() 触发 ctest）
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()"

upstream_tests:
  - file: tests/CMakeLists.txt
    source: transfuse-0.7.6/tests/CMakeLists.txt
    description: "上游唯一测试入口，add_test() 注册 14 个 ctest 用例"
    command: "ctest"
  - file: tests/extract.sh
    source: transfuse-0.7.6/tests/extract.sh
    description: "extract 模式驱动器（6 种格式 × 2 个 handler），diff 比对 .expect"
    command: "tests/extract.sh <binary> <srcdir> <format> <handler>"
  - file: tests/clean.sh
    source: transfuse-0.7.6/tests/clean.sh
    description: "clean 模式驱动器（html × 2 个 handler），diff 比对 .expect"
    command: "tests/clean.sh <binary> <srcdir> <format> <handler> <outdir>"

# 上游测试用例数（ctest 注册项）
upstream_test_count: 14

# 上游测试数据文件（驱动测试的输入与期望输出，均来自源码树，未改动）
upstream_test_data:
  - "tests/test.docx / tests/extract-docx-{apertium,visl}.expect"
  - "tests/test.html / tests/extract-html-{apertium,visl}.expect"
  - "tests/test.html-fragment / tests/extract-html-fragment-{apertium,visl}.expect"
  - "tests/test.pptx / tests/extract-pptx-{apertium,visl}.expect"
  - "tests/test.odt / tests/extract-odt-{apertium,visl}.expect"
  - "tests/test.txt / tests/extract-txt-{apertium,visl}.expect"
  - "tests/clean-html-{apertium,visl}.expect"

# test_package 自带的消费者测试（鸿蒙特有，不计入上游分母）
test_package_tests:
  - file: test.sh
    description: "鸿蒙特有消费者测试 — 调用已安装的 transfuse/tf-extract/tf-inject/tf-clean，断言 ELF 架构、--version、块标记、内联 span 标记、UTF-8 往返、golden 逐字节比对、clean 模式回注，共 11 条断言"
    command: "bash test.sh"
  - file: data/test-ohos.html
    description: "鸿蒙特有测试输入 — 含纯文本、<b> 内联 span、Ünïcödé 与中文字符的 UTF-8 HTML 文档"
    command: "transfuse -v -m extract -K -s apertium data/test-ohos.html <out>"
  - file: data/test-ohos.expect
    description: "上述输入的期望输出（[tf-block:N-<hash>] + [[t:b:...]] 内联标记），逐字节比对"
    command: "diff -u data/test-ohos.expect <out>"

# 上游测试断言总数（ctest 用例数；.expect 比对为逐用例 1 次全量 diff）
upstream_assertion_count: 14

# 消费者（鸿蒙特有）断言数
consumer_assertion_count: 11