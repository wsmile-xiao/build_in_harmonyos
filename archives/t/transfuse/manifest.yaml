# transfuse — 软件级元数据

software: transfuse
display: "Transfuse"
description: "文档内联格式抽取/回注工具，供机器翻译等转换流程使用"
category: doc
homepage: "https://github.com/TinoDidriksen/transfuse"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "package_type=application，静态链接，产物为 transfuse 可执行文件 + tf-extract/tf-inject/tf-clean 别名"
    - "上游用 pkg_search_module() 解析 libxml2/sqlite3，配方生成 PkgConfigDeps 的 .pc 文件"
    - "CMake 适配钩子（CMAKE_PROJECT_INCLUDE）补回 -L 搜索路径并把 C++ 标准纠正为 20"
    - "FindICU 不查 data 组件导致 icudt<ver>_dat 未定义，钩子里显式补 libicudata.a"
    - "上游 include/xxhash/CMakeLists.txt 的 XXHASH_INCLUDE_DIRS 拼写错误需补丁修复"
    - "产物含可执行文件，鸿蒙 PC XPM 要求签名；签名器仅存在于 CI worker，故签名步骤为 best-effort"
    - "libzip 依赖 arc4random/arc4random_buf：OHOS libc 提供，musl < 1.2 的运行时没有"
  common_dependencies:
    - icu
    - libxml2
    - libzip
    - sqlite3
    - xxhash

versions:
  "0.7.6":
    status: built
    build_date: "2026-10-01"
    conan_ref: "transfuse/0.7.6"