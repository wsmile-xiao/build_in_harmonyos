# conandata.yml — tshark 4.6.7
# Source: official Wireshark GitHub tag (v4.6.7). The wireshark.org
# /download/src/ directory has pruned 4.6.7 (only 4.6.8/4.6.9 remain), so the
# canonical GitHub tag tarball is used (R39: official source).
sources:
  url:
    - "https://gh-proxy.com/https://github.com/wireshark/wireshark/archive/refs/tags/v4.6.7.tar.gz"
    - "https://github.com/wireshark/wireshark/archive/refs/tags/v4.6.7.tar.gz"
  sha256: "c2717d3d0aef72032f78c4564ea254523ad90490398d2e2f2757c987880c2a7a"

patches:
  - patch_file: "patches/0001-capture-CMakeLists.txt.patch"
    patch_description: "Treat OHOS/HarmonyOS as a POSIX capture platform: uname reports 'HarmonyOS' so CMake leaves UNIX=FALSE and the libpcap/POSIX capture sources are dropped from the static caputils lib, leaving capture symbols undefined; use if(NOT WIN32) to compile the same capture sources as other non-Windows POSIX platforms"
    patch_type: "platform"
