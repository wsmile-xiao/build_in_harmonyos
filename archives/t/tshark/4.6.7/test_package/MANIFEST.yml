# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51）。tshark 4.6.7 的测试框架是 pytest（非 ctest/autotools）。
package: tshark/4.6.7
homepage: "https://www.wireshark.org"

# 上游测试命令（构建目录内运行；CMake 以 add_custom_target(test) 包装 `python -m pytest`）
upstream_check_command: "pytest   # 等价: cmake --build . --target test"

# conanfile.py build() 未集成上游测试（仅构建 tshark；上游 pytest 需在构建目录+依赖环境下运行）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试（tshark 相关 pytest 子集；完整清点见 notes.md R51 申报表）
upstream_tests:
  - file: test/suite_dfilter/group_*.py
    source: wireshark-4.6.7/test/suite_dfilter/
    description: "dfilter 单元测试（496 个静态 test 函数）"
    command: "pytest test/suite_dfilter"
  - file: test/suite_dissectors/group_*.py
    source: wireshark-4.6.7/test/suite_dissectors/
    description: "dissector 解封装测试（23 个静态 test 函数：asterix 11 / mysql 6 / netperfmeter 5 / zabbix 1×7 参数化；category 034 2 函数上游 _disabled_ 禁用）——OHOS 真机实测 27/27 项通过，已移植为 L2 bash 快照（见下方 test_package_tests runner.sh）"
    command: "pytest test/suite_dissectors"
  - file: test/suite_dissection.py
    source: wireshark-4.6.7/test/suite_dissection.py
    description: "解封装测试（72 静态；183 个 captures 夹具）"
    command: "pytest test/suite_dissection.py"
  - file: test/suite_decryption.py
    source: wireshark-4.6.7/test/suite_decryption.py
    description: "解密测试（需 OpenSSL；103 静态）"
    command: "pytest test/suite_decryption.py"
  - file: test/suite_clopts.py
    source: wireshark-4.6.7/test/suite_clopts.py
    description: "tshark 命令行选项测试（34 静态）"
    command: "pytest test/suite_clopts.py"
  - file: test/suite_outputformats.py
    source: wireshark-4.6.7/test/suite_outputformats.py
    description: "tshark 输出格式测试（7 静态）"
    command: "pytest test/suite_outputformats.py"

# test_package 自带的消费者视角验证
test_package_tests:
  - file: test.sh
    description: "运行 tshark --version / -G protocols / -G versions（L1 冒烟+解封装引擎初始化）"
    command: "bash test.sh"
  - file: dissectors/runner.sh
    description: "L2：上游 suite_dissectors 移植的 27 个快照用例（23 静态 test 函数 / 27 收集项，asterix category 034 上游禁用）；同输入 capture + 同 tshark 命令行 + 输出比对（TZ=UTC、PDML 头运行值归一化）；bash-only，CI 无需 python/pytest"
    command: "bash dissectors/runner.sh"

# 静态 test 函数总数（顶层 18 套件 460 + suite_dfilter 496 + suite_dissectors 23 + C 辅助程序 10 = 989；
# 参数化后 pytest --collect-only 实际收集数更高）
assertion_count: 989
