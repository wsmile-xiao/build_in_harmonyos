# 软件级 manifest — tweeny
# 遵循 ARCHIVE-SPEC v2.0
software: tweeny
display: "tweeny"
description: "Modern C++ animation/tweening library (header-only, 30+ easings)"
category: graphics
homepage: "https://github.com/mobius3/tweeny"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only（CMake INTERFACE 库）；上游自带 install/export 规则，配方走真实 CMake 安装，下游可用 find_package(Tweeny)"
    - "上游 cmake_minimum_required(VERSION 3.0) 被 CMake 4.x 拒绝 → 配方注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（E103）"
    - "任务卡单字符版本 3 不能作 conan 版本（slug 需 ≥2 字符）；归档目录/分支保持 3，配方 set_version() 归一化为 v3（同 rapidhash/3 先例）"
    - "单值 tween 走标量 API（tween<T> 特化），多值才返回 std::tuple —— 消费者测试据此编写"
    - "上游 v3 无测试套件（N_static=0），验证由 test_package 消费者测试承载（17 条断言）"
    - "制品版本为 tweeny/v3；下游引用请写 tweeny/v3"

versions:
  "3":
    status: built
    build_date: "2026-09-15"
