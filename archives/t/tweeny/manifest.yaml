# 软件级 manifest — tweeny
# 遵循 ARCHIVE-SPEC v2.0
software: tweeny
display: "tweeny"
description: "Modern C++ animation/tweening library (header-only, 30+ easings)"
category: graphics
homepage: "https://github.com/mobius3/tweeny"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only（CMake INTERFACE 库）；上游自带 install/export 规则，配方走真实 CMake 安装，下游可用 find_package(Tweeny)"
    - "v3（tag v3）：上游 cmake_minimum_required(VERSION 3.0) 被 CMake 4.x 拒绝 → 配方注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（E103）；任务卡单字符版本 3 不能作 conan 版本（slug 需 ≥2 字符），配方 set_version() 归一化为 v3（同 rapidhash/3 先例）"
    - "v4（tag v4.1.0）：cmake_minimum_required(VERSION 3.23...3.28) 被 CMake 4.x 直接接受，无需 E103 注入；自带 Catch2 v3 测试套件（src/tests/，135 TEST_CASE，配方保持 TESTS=OFF 避免引入测试依赖，上游测试在适配流程独立运行 135/135）"
    - "单值 tween 走标量 API（tween<T> 特化），多值才返回 std::tuple —— 消费者测试据此编写"
    - "v4 API 破坏性变更（相对 v3）：事件接口 onStep→t.on(event::step, cb)（回调返回 event::response）、during() 帧数参数强约束 uint32_t 且须与组件数一一对应"
    - "制品版本：v3 为 tweeny/v3（set_version 归一化），v4 为 tweeny/4.1.0（合法版本号直接使用）"

versions:
  "3":
    status: built
    build_date: "2026-09-15"
  "4.1.0":
    status: built
    build_date: "2026-09-19"
