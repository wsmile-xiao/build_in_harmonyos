# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点证据（R51 三步法，tweeny 4.1.0 tag v4.1.0）:
#   * 仓库 src/tests/ 下 Catch2 v3 测试套件：28 个 .cpp（1 sanity + 6 tween/
#     + 7 events/ + 14 easings/），共 135 个 TEST_CASE（grep -c TEST_CASE 全量
#     枚举 = 135，ctest -N 注册 135 项完全一致；无 TEMPLATE_TEST_CASE）
#   * 构建入口：CMakeLists.txt option(TWEENY_BUILD_TESTS ...) + 
#     src/tests/CMakeLists.txt（find_package(Catch2 3 REQUIRED CONFIG)，
#     catch_discover_tests 注册）
#   * 适配流程实测：cmake -DTWEENY_BUILD_TESTS=ON + Catch2/3.8.1（ohpcd 制品）
#     → tweeny_tests 构建成功 → ctest 135/135 PASSED（100%，1.75s）
#   * 双口径：source_declared_total=135 / configured_executable_total=135/
#     executed_passed_total=135/135（135/135 = 100%）
#   * 依赖：Catch2 3（v3 必须，测试仅；库本体零依赖，header-only）

package: tweeny/4.1.0
homepage: "https://github.com/mobius3/tweeny"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -DTWEENY_BUILD_TESTS=ON .. && cmake --build . && ctest"

# conanfile.py build() 方法中是否已集成上游测试
# （否：上游测试依赖 Catch2 v3 与测试目标 tweeny_tests，配方构建禁用测试
#   以避免把 Catch2 引入制品依赖；上游测试在适配流程单独枚举并运行 135/135）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（v4.1.0 tag：src/tests/ 目录，Catch2 v3 套件，
# 135 个 TEST_CASE，见上方清点证据）
upstream_tests:
  - file: src/tests/sanity.cpp
    source: tweeny-4.1.0/src/tests/sanity.cpp
    description: "Catch2 框架冒烟（1 TEST_CASE）"
    command: "./tweeny_tests"
  - file: "src/tests/tween/*.cpp"
    source: "tweeny-4.1.0/src/tests/tween/*.cpp"
    description: "tween 核心语义：peek/step/seek/jump/progress/navigation（29 TEST_CASE）"
    command: "./tweeny_tests"
  - file: "src/tests/events/*.cpp"
    source: "tweeny-4.1.0/src/tests/events/*.cpp"
    description: "事件回调（v4 API）：event::step/seek/jump/complete/keyframe 进出/update（33 TEST_CASE）"
    command: "./tweeny_tests"
  - file: "src/tests/easings/*.cpp"
    source: "tweeny-4.1.0/src/tests/easings/*.cpp"
    description: "缓动函数族线性/二次…bounce/stepped/def/by-name（72 TEST_CASE）"
    command: "./tweeny_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tweeny.cpp
    description: "消费者测试：编译并调用 tweeny 公开 API（线性插值、多值 tween、easing 形状、seek/step 语义、event::step 回调（v4）、越界钳制），断言决定退出码"
    command: "./test_tweeny"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17