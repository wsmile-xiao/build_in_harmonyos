# 版本级 manifest — tweeny 4.1.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.1.0"

# 软件名
software: tweeny

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39 官方源）
  url: "https://github.com/mobius3/tweeny/archive/refs/tags/v4.1.0.tar.gz"

  # 源码校验和
  sha256: "110903c6b5e2a68b28927c0ecf0c504d1b682fcd451f874880448857311a88b4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DTWEENY_BUILD_TESTS=OFF"
    - "-DTWEENY_BUILD_DOCUMENTATION=OFF"
    - "-DTWEENY_BUILD_SINGLE_HEADER=OFF"

  # 编译依赖列表（格式: name/version；tweeny 为 header-only，零第三方依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（上游源码未修改，patches 为空）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "tweeny 4.1.0 为 header-only CMake INTERFACE 库，上游自带 install/export（TweenyConfig.cmake，NAMESPACE tweeny::），配方走真实 CMake 安装，下游 find_package(Tweeny) + tweeny::tweeny"
  - "v4 API 与 v3 差异：during() 参数必须为 uint32_t（int 字面量触发 static_assert）；事件接口由 onStep() 改为 t.on(event::step, cb)，回调签名 event::response(tween&)"
  - "上游 v4.1.0 自带 Catch2 v3 测试套件（src/tests/，135 TEST_CASE）；配方构建禁用 TWEENY_BUILD_TESTS，避免把 Catch2 引入制品依赖；上游测试在适配流程单独枚举并运行 135/135"
  - "cmake_minimum_required(VERSION 3.23...3.28) 被 CMake 4.x 接受（最低 3.5 以上），无需 E103 的 CMAKE_POLICY_VERSION_MINIMUM 注入（与 v3 的 3.0 不同）"