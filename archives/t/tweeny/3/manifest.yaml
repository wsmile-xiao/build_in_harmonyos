# 版本级 manifest — tweeny 3
version: "3"
software: tweeny
upstream_version: "3"
conan_ref: "tweeny/v3"
status: built
build_date: "2026-09-15"
build_system: cmake

source:
  url: "https://github.com/mobius3/tweeny/archive/refs/tags/v3.tar.gz"
  sha256: "699633578f958cbb1363f80164ac063dc40ce08dfc26b0591752ca412e64c941"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DTWEENY_BUILD_EXAMPLES=OFF"
    - "-DTWEENY_BUILD_EXTRAS=OFF"
    - "-DTWEENY_BUILD_DOCUMENTATION=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 cmake_minimum_required(VERSION 3.0) 被 CMake 4.x 直接拒绝；注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（E103）"  # reference: notes.md
  - "任务卡单字符版本 3 不能当 conan 版本（ConanName slug 需 ≥2 字符，Invalid package version '3'）；归档目录/分支保持 3（过 CI L0n），配方 set_version() 归一化为 v3（同 rapidhash/3 先例，且刻意不写 version= 字面量以避开 CI L0m-3/PF8 的字面量-目录比对）"  # reference: notes.md
  - "conan.tools.files.copy() 的相对 dst 不解析到 package_folder（落到进程 cwd）——licenses 拷贝必须用绝对路径"  # reference: notes.md
