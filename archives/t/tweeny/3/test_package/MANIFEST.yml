# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点证据（R51 三步法）:
#   * v3 tag 仓库根目录清单（GitHub API contents?ref=v3）：
#     .gitignore / CHANGELOG.md / CMakeLists.txt / LICENSE / README.md /
#     cmake / doc / include —— 无 test/ 或 tests/ 目录
#   * CHANGELOG.md 无 test/catch 相关条目
#   结论: 上游 v3 无自动化测试套件，N_static = 0

package: tweeny/v3
homepage: "https://github.com/mobius3/tweeny"

# 上游测试命令（v3 tag 无测试套件，无 make check / ctest 目标）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# （上游无测试可跑，见上方清点证据；N_static = 0）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（v3 tag 无 test/ 目录，无上游测试可执行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tweeny.cpp
    description: "消费者测试：编译并调用 tweeny 公开 API（线性插值、多值 tween、easing 形状、seek/step 语义、onStep 回调、越界钳制），断言决定退出码"
    command: "./test_tweeny"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17
