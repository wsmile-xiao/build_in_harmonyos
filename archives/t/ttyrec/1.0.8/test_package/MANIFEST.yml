# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ttyrec/1.0.8
homepage: "http://0xcc.net/ttyrec/"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# ttyrec 无测试套件
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "创建最小录制文件并运行 ttytime 验证二进制可用"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
