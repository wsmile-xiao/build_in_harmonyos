# test_package/MANIFEST.yml — tidyhtml 5.8.0
# 上游官方测试声明文件（CI L0e 硬门禁要求存在）

package: tidyhtml/5.8.0
homepage: "https://github.com/htacg/tidy-html5"

# 上游测试套件存在性：有。上游 regression_testing/ 为 Ruby test.rb 驱动的
# 回归套件（4 个 -cases 测试集 + 4 个 -expects 参照集），CI 曾误判为无测试，
# 人工审查核定 N=649（见下方审计口径）。
upstream_tests_exist: true

# 上游测试审计：tidy-html5 5.8.0 regression_testing/ 文件级盘点。
upstream_test_audit:
  source_tarball: "5.8.0.tar.gz"
  source_sha256: "59c86d5b2e452f63c5cdb29c866a12a4c55b1741d7025cf2f3ce0cde99b0660e"
  source_url: "https://github.com/htacg/tidy-html5/archive/refs/tags/5.8.0.tar.gz"
  harness: "regression_testing/test.rb（Ruby + bundler/thor；真机无 Ruby，故配方 build() 内嵌等价 Python 复刻，调用与判定逻辑与 test.rb `test` 一致）"
  invocation: "tidy -lang en_us -f <result.txt> -config <case.conf|config_default.conf> --tidy-mark no -o <result.html> <input-with-@N>"
  pass_rule: "exit code == @N 且 result.html 与 -expects html 字节一致 且 result.txt 与 -expects txt 字节一致（缺参照文件的 corner 规则与 test.rb 一致）"
  file_breakdown_649:
    - "*-cases 可执行输入（含 @N 退出码元数据）：391（access 119 + github 22 + legacy 223 + xml 27）"
    - "*.conf 配置文件：250（246 用例专属 + 4 config_default.conf）"
    - "*-cases README.txt：4"
    - "regression_testing 根支撑文件：4（test.rb/Gemfile/Gemfile.lock/README.md）"
    - "合计评审口径：391 + 250 + 4 + 4 = 649（与人工审查实测 N=649 一致）"
  reference_files: "-expects 参照文件 776 个（384 html/xml + 392 txt），为比对基准，不计入用例数；全部非空 LF 文本"
  scanned_for:
    - "regression_testing/cases/*-cases/*@*（可执行输入，glob 盘点）"
    - "enable_testing / add_test（ctest）— 顶层 CMakeLists 无，回归由 test.rb 驱动"
    - "TEST( / TEST_F（gtest）— 0 命中"
    - "def test_（pytest）— 0 命中"
  scan_result: "391 个可执行回归用例 + 258 个配置/支撑文件 = 649 评审口径；776 个 -expects 参照文件"
  reason: >-
    上游 5.8.0 的自动化测试即 regression_testing/ 回归套件（test.rb test 遍历全部
    *-cases 输入）。配方 build() 在构建出 tidy 二进制后立即用内嵌 Python 复刻
    全量执行 391 个可执行用例并字节比对 776 个参照文件，发射
    HMBS_UPSTREAM_TEST_RESULT（tidy_regression 口径，discovered=391 可执行用例）。
    258 个 .conf/README/支撑文件不可单独执行，随可执行用例一并校验，
    不归零、不忽略（审计见 file_breakdown_649）。

# HMBS 官方盘点口径：与人工审查一致的 649 文件口径；可执行子集 391 全量运行。
# rule4 对齐：marker discovered=391（可执行输入）+ gaps[258]=conf/README/harness
# 支撑文件（随可执行用例一并校验，不可单独执行），391+258=649=本total。
upstream_test_total: 649
upstream_test_count_method: auto
upstream_test_count_detail: "391 executable regression inputs (glob *-cases/*@*) + 250 conf + 8 support/README + 4 harness root = 649；harness marker discovered=391（可执行用例）+ gaps environment count=258（支撑文件，随包校验），通过率按 391/391 计，258 非可执行文件随包审计"

# 上游测试命令（conanfile build() 中已集成，真机 conan create 即真实运行）。
upstream_check_command: "tidy regression (test.rb reimplementation, python stdlib)"
upstream_test_in_build: true
upstream_test_command: "tidy regression (test.rb reimplementation, python stdlib)"

# 上游实际运行的测试集（4 个测试集，391 可执行用例）。
upstream_tests:
  - file: regression_testing/cases/access-cases
    source: tidy-html5-5.8.0/regression_testing/cases/access-cases
    description: "无障碍检查回归集 119 例（accessibility-check: 3，latin1）"
    command: "tidy -lang en_us -f <r>.txt -config <conf> --tidy-mark no -o <r>.html <case@N.html>"
  - file: regression_testing/cases/github-cases
    source: tidy-html5-5.8.0/regression_testing/cases/github-cases
    description: "GitHub issue 回归集 22 例"
    command: "tidy -lang en_us -f <r>.txt -config <conf> --tidy-mark no -o <r>.html <case@N.html>"
  - file: regression_testing/cases/legacy-cases
    source: tidy-html5-5.8.0/regression_testing/cases/legacy-cases
    description: "历史回归集 223 例"
    command: "tidy -lang en_us -f <r>.txt -config <conf> --tidy-mark no -o <r>.html <case@N.html>"
  - file: regression_testing/cases/xml-cases
    source: tidy-html5-5.8.0/regression_testing/cases/xml-cases
    description: "XML 回归集 27 例"
    command: "tidy -lang en_us -f <r>.txt -config <conf> --tidy-mark no -o <r>.html <case@N.xml>"

# test_package 中自带的测试（消费者视角验证）。
# R34: 实质调用被测包 API，非空壳。
test_package_tests:
  - file: test_tidy.c
    description: "libtidy 真实 API 往返：tidyCreate 建文档、tidyParseString 解析、tidyCleanAndRepair 清理修复、tidySaveBuffer 序列化非空、输出内容校验，共 5 个 CASE PASS 断言"
    command: "ctest (tidy_test)"

# 测试断言总数（test_tidy.c 的 5 个 CASE PASS，与 HMBS_TEST_PACKAGE_RESULT discovered=5 一致）。
assertion_count: 5
