# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tinymembench/0.4
homepage: "https://github.com/ssvb/tinymembench"

# 上游测试注册口径：tinymembench 0.4 的 makefile 只有 all/clean 目标，
# 无 check/test 目标；源码树不含任何测试文件或测试框架。
# 清点证据: tarball 顶层仅 main.c util.c asm-opt.c + 4 组架构 .S/.h +
# Makefile/LICENSE/readme.txt/version.h，无任何 test 文件
upstream_check_command: "make -n check   # -> make: *** No rule to make target 'check'"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tinymembench.py
    description: "运行安装后的 tinymembench 完整 benchmark：断言 banner 'tinymembench v0.4'、带宽段标题、≥10 条 'MB/s' 带宽结果行、延迟段 'block size : single random read' 表头及延迟数据行，退出码 0"
    command: "python3 test_tinymembench.py <package>/bin/tinymembench"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
