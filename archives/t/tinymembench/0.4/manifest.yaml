software: tinymembench
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.4"
status: built
build_system: makefile
build_date: "2026-09-29"

source:
  url: "https://github.com/ssvb/tinymembench/archive/refs/tags/v0.4.tar.gz"
  sha256: "e37a2682065b2778f2fa7f22bd59472f5ca2191be48503952ae020b8f023f23d"
  tar_format: tar.gz
  # 上游 tag 为 v0.4（2016），源码 version.h 中 VERSION "0.4"
  upstream_version: "0.4"

build:
  system: makefile
  configure_options:
    - 'CC=<ohos clang from tools.build:compiler_executables>'
    - 'CFLAGS=""'
    - "target: all (makefile 默认 all，产出单个可执行文件 tinymembench)"
  dependencies: []
  cc: clang
  cxx: ""

patches_applied:
  - "patches/0001-asm-delete-.func-.endfunc-directives.patch (clang 集成汇编器不支持 .func/.endfunc 指令，'unknown directive .func'；与 OpenEmbedded 上游同款修复)"
  - "patches/0002-main-include-sys-ioctl.h.patch (musl 不经 sys/mman.h 间接暴露 ioctl，补 include 消除 C99 隐式函数声明警告)"

knowledge_gained:
  - "tinymembench 0.4 是纯 C + 各架构手写汇编(经 C 预处理器的 .S)+手写 makefile，无 configure/install/check 目标"
  - "四个架构 .S 文件整体包在 #ifdef <arch> 保护内，任何目标架构都能编译全部 .S，非本平台的成为空目标文件；aarch64 上仅 aarch64-asm.S 有效"
  - "clang(含 OHOS SDK clang 15)集成汇编器不支持 GNU gas 的 .func/.endfunc 指令，报 'unknown directive .func'，必须删除这些 DWARF 注记指令(OpenEmbedded 上游同款补丁)；gas 兼容性不受影响"
  - "musl 下 ioctl 需显式 #include <sys/ioctl.h>，main.c 原依赖 glibc 间接暴露，musl 编译报 C99 隐式函数声明警告"
  - "makefile 用 ${CC} 与 ${CFLAGS}，命令行覆盖即可交叉编译；ifdef WINDIR 分支会在 Windows 宿主强制 CC=gcc，命令行 CC= 覆盖优先，build() 同时清掉 WINDIR 环境变量"
  - "链接行固定为 main.c + 5 个 .o + -lm，-lm 在末尾，链接顺序天然正确"
  - "main.c 的 __linux__ 分支 include <linux/fb.h> 做 framebuffer 测试，/dev/fb0 打不开则自动跳过；OHOS SDK sysroot 含 linux/fb.h 可直接编译"
  - "延迟测试用 posix_memalign + madvise(MADV_HUGEPAGE)，musl 提供 MADV_HUGEPAGE，失败则降级 malloc 路径"
  - "上游无单元测试套件，验证方式=完整构建 + 消费端运行完整 benchmark 并断言输出"
  - "完整 benchmark 需数分钟(自适应重复×每轮≥0.5s，延迟部分 64MiB×hugepage/非hugepage)，test_package 需放宽超时(1200s)"
  - "OHOS 需对 ELF 可执行文件 binary-sign-tool -selfSign 签名后才能运行(与 simh/3.8.1 同)"

conan_adaptation:
  recipe: conanfile.py
  conandata: conandata.yml
  test_package: test_package/
  package_type: application
  commands_json: true
