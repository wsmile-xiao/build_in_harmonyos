# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess需要添加HarmonyOS系统识别，三处补丁: §2.1 LIBC检测(Ironclad|Linux|GNU|GNU/*|HarmonyOS)，§2.2 主case兜底(*:HarmonyOS:*:*)，§2.3 专门HarmonyOS case直接设置GUESS跳过set_cc_for_build"
  - "E007: config.sub已内置ohos* vendor别名支持，无需额外补丁"
  - "E105: 仅加§2.1补丁不够，HMDFS上set_cc_for_build失败后需§2.2+§2.3补丁兜底(直接设置GUESS=musl)"
  - "E011: HMDFS沙箱环境下config.guess无法创建临时文件(dummy.c)做编译器检测，需专门HarmonyOS case跳过set_cc_for_build"
  - "E106: config.status在HMDFS上mktemp创建临时目录不可写，需改用$TMPDIR固定预创建目录"
  - "autotools项目make时需touch时间戳使aclocal.m4 > configure.ac > m4/*.m4，否则触发aclocal-1.16重建"
  - "tinyproxy --version不支持，需用-v获取版本号"
  - "G0 clean-verify在HMDFS上因Python subprocess管道权限限制失败，非源码问题而是
