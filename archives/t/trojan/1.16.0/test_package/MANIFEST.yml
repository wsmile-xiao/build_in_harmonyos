# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: trojan/1.16.0
homepage: "https://github.com/trojan-gfw/trojan"

# 上游测试命令（trojan 无 CTest/make check；上游测试入口为 tests/LinuxSmokeTest/
# 下的 basic.sh 与 fake-client.sh 两条端到端代理冒烟）
upstream_check_command: "bash tests/LinuxSmokeTest/basic.sh <built-trojan> && bash tests/LinuxSmokeTest/fake-client.sh <built-trojan>"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bash tests/LinuxSmokeTest/basic.sh <built-trojan>; bash tests/LinuxSmokeTest/fake-client.sh <built-trojan>"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/LinuxSmokeTest/basic.sh
    source: trojan-1.16.0/tests/LinuxSmokeTest/basic.sh
    description: "端到端冒烟：自签证书 → trojan server+client 回环组网 → curl socks5/forward 双路径取回 whoami 断言（含 trojan -v/-t 调用）"
    command: "bash tests/LinuxSmokeTest/basic.sh ./trojan"
  - file: tests/LinuxSmokeTest/fake-client.sh
    source: trojan-1.16.0/tests/LinuxSmokeTest/fake-client.sh
    description: "端到端冒烟（负路径）：断言纯 TLS 客户端直连 trojan 端口取不到真源站内容（WHOAMI != true），且 fake-client 路径返回 fake"
    command: "bash tests/LinuxSmokeTest/fake-client.sh ./trojan"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tls.sh
    description: "消费者测试：trojan -t 校验配置 → 起包内 trojan server → openssl s_client 完成 TLS 握手并断言 Verify return code: 0"
    command: "bash test_tls.sh <bindir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8

# 被测二进制内存预算（AGENTS §14.1④：本机无内核级封顶手段，一律由父进程监管止损）
# 实测峰值 592MB（memcap-run 整进程组 0.5s 采样，budget=3500MB rc=0）
max_rss_mb: 3500
