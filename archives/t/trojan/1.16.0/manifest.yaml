# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DENABLE_MYSQL=OFF"      # 上游默认 ON 且 find_package REQUIRED，OHOS 无 mysql 制品
    - "-DSYSTEMD_SERVICE=OFF"   # OHOS 无 systemd
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.84.0      # 含 system + program_options 组件（ohpcd 定制配方）
    - openssl/3.5.8.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

