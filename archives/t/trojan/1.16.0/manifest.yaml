# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "DRAFT-trojan-1.16.0-openssl-cli-stale-openssldir（新增·路径 B）：已发布 openssl 制品把 --openssldir 编译成构建期 conan 包目录绝对路径，制品不可迁移；消费方在 conanrun 环境调用包内 openssl req 因默认 openssl.cnf 缺失而失败。判症关键=同一命令在 build()（VirtualBuildEnv→设备 openssl）通过、在 test_package（conanrun→包内 openssl）失败。修法=消费者脚本 export OPENSSL_CONF=/dev/null，需模板字段时自备最小 cnf 传 -config"
  - "hit：DRAFT-hnp-bash-pwd-unbound-set-u-scripts / E386 家族——hnp bash 在 HMDFS 上 getcwd 失败使内建 PWD 未赋值，上游 common.sh 用 $PWD 拼临时目录即报 unbound variable；修法=同 shell 内先 cd 再显式种子 PWD"
  - "hit：E002/E052——/tmp 只读，上游 mktemp -d 须改到可写构建目录内"
  - "已处理：E092（CMake 不识别 HarmonyOS 平台，conan-verify G0 已确认配方侧覆盖）"
