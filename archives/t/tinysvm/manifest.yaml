software: tinysvm
display: "TinySVM"
description: "Small C++ support vector machine library and command-line toolkit"
category: data
homepage: "http://www.chasen.org/~taku/software/TinySVM/"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Patch 2002-era config.guess/config.sub to recognize aarch64-unknown-linux-ohos natively"
    - "Replace the pre-ANSI getopt declaration with the POSIX prototype required by HarmonyOS Clang headers"
    - "Use make -j1 on HarmonyOS because HMDFS does not provide GNU make jobserver FIFOs"
    - "Run all five upstream make check scripts natively on HarmonyOS PC"
  common_dependencies: []

versions:
  "0.09":
    status: built
    build_date: "2026-09-20"
    conan_ref: "tinysvm/0.09"
