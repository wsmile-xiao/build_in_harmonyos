version: "0.09"
software: tinysvm
status: built
build_date: "2026-09-20"
conan_ref: "tinysvm/0.09"
build_system: autotools

source:
  url: "https://cdn.netbsd.org/pub/pkgsrc/distfiles/TinySVM-0.09.tar.gz"
  sha256: "e377f7ede3e022247da31774a4f75f3595ce768bc1afe3de9fc8e962242c7ab8"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix={package_folder}"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-src-getopt.h.patch"

upstream_tests:
  command: "make check"
  test_count: 5
  notes: "The five official scripts test classification, polynomial kernels, regression, and incremental model updates; all run natively."

test_package:
  assertion_count: 9
  description: "HarmonyOS-specific installed-package tests cover the public C++ Model API and the three packaged CLI tools."

knowledge_gained:
  - "TinySVM 0.09 ships 2002-era config.guess/config.sub scripts which do not recognize HarmonyOS or aarch64; a native linux-ohos triplet patch keeps build==host without forbidden configure triplet overrides"
  - "HarmonyOS Clang headers expose the POSIX getopt prototype while TinySVM's non-glibc branch declares getopt() without parameters; giving that branch the POSIX prototype removes the conflicting declaration"
  - "The release's legacy libtool produces libtinysvm.a only on both upstream Linux and HarmonyOS, so the Conan package intentionally preserves the upstream static-library output"
  - "GNU make jobserver FIFOs are unsupported on HarmonyOS HMDFS; serial target builds avoid the warning and remain deterministic"
