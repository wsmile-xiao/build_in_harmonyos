package: tinysvm/0.09
homepage: "http://www.chasen.org/~taku/software/TinySVM/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: upstream-shell-suite
    source: TinySVM-0.09/tests/test.sh through test5.sh
    description: "Five official integration tests covering classification, polynomial kernels, regression, and incremental model updates"
    command: "make check"

test_package_tests:
  - file: test_tinysvm.cpp
    description: "HarmonyOS installed-library consumer: load a CLI-trained model through the public C++ API and classify positive/negative samples"
    command: "./tinysvm_api_test <model>"
  - file: conanfile.py (CLI)
    description: "HarmonyOS installed-command consumer: verify all tool versions, train a six-sample model, classify 2/2 samples, and inspect model metadata"
    command: "svm_learn <train> <model>; svm_classify <test> <model>; svm_model <model>"

assertion_count: 9
