package: tinyarray/1.2.5
homepage: "https://gitlab.kwant-project.org/kwant/tinyarray"
license: BSD-3-Clause
upstream:
  repository: "https://gitlab.kwant-project.org/kwant/tinyarray"
  tag: "v1.2.5"
  commit: "99c2fd8396de4f8a833d5b7a3124bb80452046d8"
  source_archive_sha256: "445ac905745c462a8a939103c8fe5c4b527a735b3b053c7de168daa64fe38a3a"
build:
  system: "setuptools build_ext"
  target: "HarmonyOS aarch64 CPython extension"
  python_abi_option: "3.12, 3.14, 3.15"
  release_version: "归档 version 文件的 __use_git__ 哨兵在无 .git 元数据时会使 setuptools 得到 unknown；构建前固定为 1.2.5"
  extension_linker: "覆盖解释器 LDSHARED 中与扩展无关且 HarmonyOS SDK 不提供的 -lintl"
patches:
  - "用精确的 2 的幂边界检测浮点转 long 溢出，消除 AArch64 对越界浮点强转结果的依赖"
