# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: trf/4.09.1
homepage: "https://github.com/Benson-Genomics-Lab/TRF"

# 上游测试命令
upstream_check_command: "（上游无自动化测试）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无任何自动化测试（无 TESTS/check_PROGRAMS/ctest，Makefile.am 仅 SUBDIRS=src
# + dist_doc_DATA）；test_seqs.fasta / test_seqs.txt 为仓库自带的手工样例数据
# （输入 fasta 与期望输出表），不构成可执行测试套件。N_static = 0（如实申报）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：以默认参数运行打包后的 trf 二进制处理嵌入式 FASTA 样例（对齐上游手工样例 test_seqs.fasta），断言退出码非崩溃（TRF 上游行为：退出码=处理序列条数）、.dat 数据表生成、两条样例重复模式（TCATCGG / ACCCCTCAGGGT）与 Period size 表头均出现在报告中，共 5 处断言"
    command: "bash test.sh (conanrun env)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
