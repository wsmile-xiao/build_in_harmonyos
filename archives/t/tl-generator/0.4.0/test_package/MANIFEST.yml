# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tl-generator/0.4.0
homepage: "https://github.com/TartanLlama/generator"

# 上游测试命令 (ctest -N 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "upstream_tests"

# 上游实际运行的测试程序 (本地适配运行证据)
upstream_tests:
  - file: tests/test.cpp
    source: tl-generator-0.4.0/tests/test.cpp
    description: "Catch2 v2 suite: firstn / iota / split / pointers (45 assertions, 4 cases, all passed; iota uses manual take due to OHOS libc++ lacking std::views)"
    command: "./upstream_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "OHOS consumer test: real tl::generator usage via packaged header (firstn integers + split_lines vectors)"
    command: "./test_tl-generator"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 49