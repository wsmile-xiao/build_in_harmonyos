package: ttylog/0.31
homepage: "https://sourceforge.net/projects/ttylog/"
upstream_check_command: "ctest --output-on-failure (CMakeLists.txt:40-43)"
upstream_test_in_build: false
upstream_test_command: "qemu-aarch64 ttylog-static; qemu-aarch64 ttylog-static -h"
upstream_tests:
  - file: ttylog.c
    source: ttylog-0.31/ttylog.c
    description: "ttylogRuns: invocation with no arguments prints no params."
    command: "qemu-aarch64 ttylog-static"
  - file: ttylog.c
    source: ttylog-0.31/ttylog.c
    description: "ttylogHelp: -h prints Usage:"
    command: "qemu-aarch64 ttylog-static -h"
test_package_tests:
  - file: test_ttylog.py
    description: "Run the delivered CLI under qemu: no arguments, help, version, invalid device"
    command: "python3 test_ttylog.py <package>/bin/ttylog qemu-aarch64"
assertion_count: 6
