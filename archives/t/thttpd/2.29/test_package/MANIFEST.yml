# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: thttpd/2.29
homepage: "https://acme.com/software/thttpd/"

# 上游测试命令 (thttpd 没有 make check 目标)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (thttpd 无测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "构建测试验证"
    command: "./test_thttpd"
  - file: conanfile.py
    description: "执行 thttpd -V 验证二进制可用性"
    command: "thttpd -V"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
