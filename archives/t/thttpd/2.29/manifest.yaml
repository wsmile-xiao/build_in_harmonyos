software: thttpd
version: "2.29"
status: built
build_date: "2026-08-22"
build_system: autotools

source:
  url: "https://acme.com/software/thttpd/thttpd-2.29.tar.gz"
  sha256: "99c09f47da326b1e7b5295c45549d2b65534dce27c44812cf7eef1441681a397"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-extras-Makefile.in.patch"
  - "0004-extras-htpasswd.c.patch"

knowledge_gained:
  - "Old autoconf 2.13 config.guess cannot detect OHOS - replace with minimal stub"
  - "getpass() not available on OHOS - replace with portable read_password() helper (POSIX stdio, no platform macros, fgets return checked)"
  - "www group does not exist on OHOS - use -chgrp prefix to make non-fatal"
  - "Makefile install expects man/man1, man/man8, www/cgi-bin dirs - pre-create them"
  - "Old autotools 2.13 does not support out-of-source builds - use cwd=self.source_folder"

patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: true
  - file: 0002-config.sub.patch
    type: portability
    platform_only: true
  - file: 0003-extras-Makefile.in.patch
    type: portability
    platform_only: true
  - file: 0004-extras-htpasswd.c.patch
    type: portability
    platform_only: true
