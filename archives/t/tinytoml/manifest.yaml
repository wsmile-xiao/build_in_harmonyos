software: tinytoml
display: "tinytoml"
description: "Header-only C++11 TOML v0.4.0 解析器库，无外部依赖"
category: parser
homepage: "https://github.com/mayah/tinytoml"
license: Simplified BSD
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only 库，CMake 仅用于编译测试，无二进制产物"
    - "嵌套源码提升(_promote_nested_source) 会丢失 include/ 目录，需从 tarball 恢复"
    - "CMake 4.x 不兼容 cmake_minimum_required(VERSION 2.8)，需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "CMakeLists.txt 中 include_directories(../include) 在提升后需改为 include_directories(include)"
  common_dependencies: []

versions:
  "0.4.0":
    status: published
    build_date: "2026-06-25"
    published_as: tinytoml
    source_url: "https://github.com/mayah/tinytoml/archive/refs/tags/0.4.tar.gz"
