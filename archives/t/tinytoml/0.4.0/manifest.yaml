software: tinytoml
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.0"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（G4 门禁字段）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"
compile_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mayah/tinytoml/archive/refs/tags/0.4.tar.gz"

  # 源码校验和
  sha256: "bd5e330dcddceba26a2794f543071e0ef2a62ea52afb322d23674c36060e0afa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: ""
  # cmake options handled by configure wrapper (0002-cmake-configure-wrapper.patch)

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-cmake-configure-wrapper.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "tinytoml 是 header-only C++ 库，无二进制产物，CMake 仅用于测试"
  - "嵌套源码提升(_promote_nested_source) 会丢失 include/ 目录，需手动恢复"
  - "CMake 4.x 不兼容 cmake_minimum_required(VERSION 2.8)，需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "CMakeLists.txt 中 include_directories(../include) 在提升后需改为 include_directories(include)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/tinytoml-0.4.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/tinytoml-0.4.0.work
  source_orig_hash: f5d9fa27a6da48a1
  source_work_hash: 7dabeb7cd6d9be3d
  generated_at: '2026-06-25T12:02:49'
  patches_count: 2

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-cmake-configure-wrapper.patch
    type: manual
    platform_only: True
    guard: 'pending'

# ============================================================
# 功能测试
# ============================================================

functional_test:
  test_date: "2026-06-25"
  platform: "OpenHarmony (aarch64)"
  compiler: "Clang 15.0.4"
  results:
    cmake_unit_tests:
      total: 8
      passed: 8
      failed: 0
    official_testcases:
      total: 40
      passed: 40
      failed: 0
    platform_functional_tests:
      total: 28
      passed: 28
      failed: 0
    cli_tools:
      parse_stdin: PASS
      parse_file: PASS
  overall_pass_rate: "100% (76/76)"
  verdict: "tinytoml v0.4.0 在鸿蒙平台功能完全正常，无平台兼容性问题"
  coverage:
    data_types: ["string", "integer", "float", "boolean", "array", "table", "inline_table", "array_of_tables", "datetime", "multiline_string", "literal_string", "escape_sequences"]
    core_api: ["parse", "parseFile", "find(dotted_key)", "get<T>", "is<T>", "as<T>", "has", "setChild", "write", "operator<<", "find(index)"]
