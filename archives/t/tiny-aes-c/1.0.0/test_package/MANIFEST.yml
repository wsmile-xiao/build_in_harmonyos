# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: tiny-aes-c/1.0.0
homepage: "https://github.com/kokke/tiny-AES-c"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: tiny-aes-c-1.0.0/test.c
    description: "NIST SP 800-38A AES128/192/256 ECB/CBC/CTR 加解密向量验证（上游 make 构建 test.elf 运行，实测 0 失败）"
    command: "./test.elf"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：NIST SP 800-38A AES128 ECB/CBC/CTR 向量验证（调用被测包 aes.h API）"
    command: "./test_tiny-aes-c"
  - file: test_harmony.c
    description: "鸿蒙特有测试（rule12）：TMPDIR/HOME/tmp 临时文件读写 + AES-CBC 加密-落盘-重读-解密 round-trip，验证 E002 /tmp 只读与鸿蒙平台文件 I/O 下的加解密往返完整性（调用被测包 aes.h API）"
    command: "./test_harmony"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40