package: tiny-aes-c/0.4.2
homepage: "https://github.com/CryptoManiac/tiny-aes-cpp"

upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit
upstream_test_audit:
  - source: "CryptoManiac/tiny-aes-cpp commit b2761c223710 archive"
    reason: "The complete archive contains only README.md, aes.cpp, aes.h, and unlicense.txt; it has no test source or test directory."
  - source: "archive root"
    reason: "No CMakeLists.txt, Makefile, Meson file, package script, or other test command exists."
  - conclusion: "The pinned upstream snapshot provides zero automated tests; test_package supplies separate installed-package consumer coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_tiny_aes_c.cpp
    description: "Installed static-library consumer covering the NIST SP 800-38A AES-256-CTR vectors, both public overloads, round trips, counter carry, empty input, and an OHOS target compile check."
    command: "./test_tiny_aes_c"
    assertions: 12

upstream_test_count: 0
consumer_test_count: 1
consumer_assertion_count: 12
assertion_count: 12

device_validation:
  platform: "HarmonyOS HongMeng Kernel 1.12.0 aarch64"
  compiler: "clang 15.0.4"
  command: "conan create ... -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=missing -tf=test_package"
  result: "12/12 consumer assertions passed"
