package: tektoncd-cli/0.45.0
homepage: "https://github.com/tektoncd/cli"

upstream_check_command: "go test ./..."
upstream_test_in_build: false
upstream_test_command: "go test ./..."
upstream_tests:
  - "go test ./... (not run locally; official CI provides target verification)"
upstream_case_count: 0
upstream_test_note: "The package smoke test focuses on the installed command because full upstream Go tests need the target Go toolchain and Kubernetes-oriented test fixtures."

test_package_tests:
  - file: "test_tkn.py"
    description: "Execute the packaged tkn command and verify help/version output."
    command: "python3 test_tkn.py <path-to-tkn>"

test_package_assertion_count: 3
assertion_count: 3
