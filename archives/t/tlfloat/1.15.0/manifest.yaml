  license: "BSL-1.0"

build:
  system: cmake
  configure_options:
    - "BUILD_LIBS=ON"
    - "BUILD_TESTS=ON"
    - "BUILD_UTILS=OFF"
    - "BUILD_BENCH=OFF"
    - "BUILD_EXHAUSTIVE_TESTING=OFF"
    - "ENABLE_CUDA_TEST=OFF"
    - "SET_LONGDOUBLE_IS_FLOAT128=OFF"
    - "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-test-exp10-fallback.patch"

knowledge_gained:
  - "TLFloat's CMake probes must use CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY for a target-only HarmonyOS toolchain."
  - "The upstream install exports the static tlfloat archive and generated tlfloatconfig.hpp, but no usable CMake package config; Conan CMakeDeps supplies the consumer target."
  - "The source test inventory contains 22 entries; the HarmonyOS clang profile selects 12 default CTest targets, while exhaustive, MPFR, and CUDA entries remain opt-in."
  - "HarmonyOS libc++ lacks isnanl/isinfl/finitel; forcing SET_LONGDOUBLE_IS_FLOAT128=OFF avoids the upstream optional test path that assumes those symbols."
  - "HarmonyOS libc++ has no exp10; the C++11 API test fallback uses std::pow only for its reference value."

validation:
  upstream_tests:
    command: "ctest --output-on-failure"
    statistical_unit: "CTest target"
    inventory_source_targets: 22
    total: 22
    passed: 7
    failed: 5
    skipped: 10
    not_run: 0
  consumer_tests:
    command: "conan create followed by CTest and direct installed consumers"
    assertions: 8
    workflows: 1
    result: "8/8 assertions and 1/1 workflow passed on HarmonyOS device"

test_results:
  type: target-consumer
  total: 9
  passed: 9
  failed: 0
  note: "Conan create on HarmonyOS HongMeng Kernel 1.12.0, aarch64, clang 15.0.4; 8 contract assertions plus one installed-package workflow; target and upstream runtime results are kept separate."

