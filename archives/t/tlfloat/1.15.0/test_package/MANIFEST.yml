package: tlfloat/1.15.0
homepage: https://github.com/shibatch/tlfloat

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: src/tester/CMakeLists.txt
    source: tlfloat-fb0390157d5c8811fc2a5a6d7d8eac27261f06fb.tar.gz/src/tester/CMakeLists.txt
    description: "Default CTest target inventory and conditional suite selection"
    command: "ctest --output-on-failure"

test_package_tests:
  - file: test_tlfloat.cpp
    description: "Check installed C and C++ APIs, arithmetic, classification, and printf"
    command: "./test_tlfloat"
  - file: consumer_workflow.cpp
    description: "HarmonyOS installed-package workflow: 36-month tlfloat savings projection and C-format report"
    command: "./tlfloat_consumer_workflow"

upstream_inventory:
  registered_targets: 22
  selected_default_targets: 12
  target_profile: "HarmonyOS clang, BUILD_EXHAUSTIVE_TESTING=OFF, no MPFR/CUDA; 10 optional entries excluded by profile"

assertion_count: 8
consumer_workflow_count: 1

device_validation:
  platform: "HarmonyOS HongMeng Kernel 1.12.0 aarch64"
  compiler: "clang 15.0.4"
  command: "conan create ... -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=missing -tf=test_package"
  result: "8/8 consumer assertions and 1/1 installed-package workflow passed; 12 selected upstream targets compiled"
