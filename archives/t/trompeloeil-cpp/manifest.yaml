# 软件级 manifest — trompeloeil-cpp
software: trompeloeil-cpp
display: "trompeloeil"
description: "Header-only C++ mocking framework (expectations, matchers, sequences, C++20 coroutines)"
category: library
homepage: "https://github.com/rollbear/trompeloeil"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 header-only：包内只有 include/ 与 licenses/，无 .a/.so、无 bin/，因此不需要 commands.json"
    - "上游自测需要 Catch2 v3；配方用 tool_requires 提供并以 CMAKE_PREFIX_PATH 预置，杜绝构建期联网下载 catch.hpp"
    - "68 个 expect-to-fail 编译用例以线程池驱动上游 verify_compilation_error.sh（OHOS 无 GNU parallel）；TMPDIR 必须指向可写目录"
    - "无源码补丁：上游源码与测试用例零修改"
  common_dependencies: []

versions:
  "49":
    status: built
    build_date: "2026-09-27"
    conan_ref: "trompeloeil-cpp/49"
