# 版本级 manifest — trompeloeil-cpp 49 (ARCHIVE-SPEC v3.0)
version: "49"
software: trompeloeil-cpp
status: built
build_date: "2026-09-27"
conan_ref: "trompeloeil-cpp/49"
build_system: cmake

source:
  url: "https://github.com/rollbear/trompeloeil/archive/refs/tags/v49.tar.gz"
  sha256: "2523571fb7920b2813cbc23b46e60294aba8ead7eba434bfec69c24408615593"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DTROMPELOEIL_BUILD_TESTS=YES"
    - "-DCXX_STANDARD=14"
    - "-DCXX_STANDARD=20"
    - "-DCMAKE_PREFIX_PATH=<catch2 tool_requires package folder>"
  # header-only library: build() only compiles and runs the upstream test
  # suite; no library artefact is produced.
  dependencies:
    - catch2/3.8.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 tag 形态是 v49（refs/tags/49 为 404），版本号为 49，不归一化（ref: trompeloeil/49 同 upstream 同 tag 归档件互证 sha256）"
  - "上游 test/CMakeLists.txt 在 find_package(Catch2) 失败时构建期 file(DOWNLOAD) 抓 catch.hpp；必须 tool_requires catch2 并以 CMAKE_PREFIX_PATH 预置（ref: E017 GitHub 下载慢/超时）"
  - "上游根 CMakeLists 不写 add_test/enable_testing（ctest 注册数 0），测试是 3 个独立可执行目标 + 68 个 expect-to-fail 编译用例（ref: DRAFT-11301-ohos-compile-fail-suite）"
  - "check_errors.sh 依赖 GNU parallel（OHOS 无）；用线程池驱动同一 verify_compilation_error.sh，语义等价（ref: DRAFT-11301-ohos-compile-fail-suite）"
  - "OHOS /tmp 只读，负向编译用例的 mktemp 需要 TMPDIR 指向构建目录（ref: E002 临时目录不可写）"

