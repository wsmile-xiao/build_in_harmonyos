# test_package/MANIFEST.yml — tsl-hopscotch-map/2.4.0
# CI L0e requires this file. See docs/TEST_QUALITY_SPEC.md

package: tsl-hopscotch-map/2.4.0
homepage: "https://github.com/Tessil/hopscotch-map"

# Upstream provides a custom test harness under tests/ (main.cpp + test TUs,
# no external framework). Built/run under CMake.
upstream_check_command: "./hopscotch_map_tests"
upstream_test_in_build: true
upstream_test_command: "./hopscotch_map_tests"

upstream_tests:
  - file: hopscotch_map_tests.cpp
    source: hopscotch-map-2.4.0/tests/hopscotch_map_tests.cpp
    description: "hopscotch_map API, lifecycle, lookup, erase tests"
    command: "./hopscotch_map_tests"
  - file: hopscotch_set_tests.cpp
    source: hopscotch-map-2.4.0/tests/hopscotch_set_tests.cpp
    description: "hopscotch_set API tests"
    command: "./hopscotch_set_tests"
  - file: custom_allocator_tests.cpp
    source: hopscotch-map-2.4.0/tests/custom_allocator_tests.cpp
    description: "Custom allocator behavior"
    command: "./hopscotch_map_tests"
  - file: policy_tests.cpp
    source: hopscotch-map-2.4.0/tests/policy_tests.cpp
    description: "Growth policy parameterized tests"
    command: "./hopscotch_map_tests"

test_package_tests:
  - file: main.cpp
    description: "Consumer: insert/lookup/erase hopscotch_map + insert/contains hopscotch_set; assert size/values; print PASS"
    command: "./tsl_hopscotch_map_test"

test_package_test_count: 1
assertion_count: 5
