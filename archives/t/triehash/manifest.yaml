software: triehash
display: "triehash"
description: "Generate a hash function from a set of keywords using a trie"
category: build-tool
homepage: "https://github.com/julian-klode/triehash"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本，无需编译"
    - "shebang 需修改为 OpenHarmony perl 路径"
  common_dependencies:
    - perl

versions:
  "0.3":
    status: published
    build_date: "2026-04-24"
    notes: "占位（仅 manifest/notes/patch/README，无 conanfile）——不可用"
  "0.3.1":
    status: built
    build_date: "2026-09-12"
    notes: "补齐可用配方（conanfile + test_package + shebang patch）；上游版本 v0.3，配方修订 0.3.1"
