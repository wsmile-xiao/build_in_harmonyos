test_status: passed

test_note: "**上游测试已实跑：7/7 用例通过**。上游 tests/ 有 7 个用例（test-basic / test-case-insensitive / test-enum-include-name-flags / test-fallback-syntax / test-label-mangling / test-multi-byte-level / test-next-and-counter-values），由 tests/run-tests.sh 驱动。其框架 tests/framework.sh 经 `perl -MDevel::Cover=...` 运行被测脚本，而 **Devel::Cover 不在 ohpcd 的 perl 包内** → 配方在门控 option `run_upstream_tests=True` 时现场生成**空操作桩**（Devel/Cover.pm + cover，仅让 `-M` 加载成功、不改被测逻辑）后真实执行。**做了阴性对照**：令 triehash.pl 强制 exit 1 → 框架正确报错，证明套件非空转。另 test_package 的 run_triehash_tests.sh 做 6 项消费者功能校验（含负向用例），实测 6/6 通过。"

knowledge_gained:
  - "triehash 是**纯 Perl 脚本**（单文件 triehash.pl），无需编译 —— 配方 install 阶段仅复制脚本并 chmod +x"
  - "shebang 必须改写：上游 `#!/usr/bin/perl -w`，OHOS 无 /usr/bin/perl（perl 由 ohpcd 的 perl/5.42.2 提供，位于包内 bin/）→ 改为 `#!/usr/bin/env perl`"
  - "**`#!/usr/bin/env perl -w` 是错误写法**：内核只把 shebang 首个空白之后的全部内容作为**一个**参数传给解释器 → env 会把 `perl -w` 当作单个程序名去查找而失败；故改写时须一并去掉 `-w`（脚本内已有 `use warnings`）"
  - "**conan 的 perl 包内建 @INC 是坏的**：其编译期前缀被解析成空串，@INC 里全是 `//lib/perl5/...`（双斜杠根路径，**均不存在**）→ 连核心模块都加载不了（实测 `env -u PERL5LIB <perl> -e 'require strict'` → `Can't locate strict.pm in @INC`）。必须自行把 `<pkg>/lib/perl5/<ver>` 与其 arch 子目录（aarch64-linux-thread-multi）补齐。该问题表现为 triehash.pl 的 `:encoding(utf8)` 报 `Unknown PerlIO layer \"encoding\"`，并连带产生 Wide character 警告**污染测试输出**导致上游用例 diff 失败（不是被测程序的功能缺陷）"
  - "**不要依赖 conanbuildenv 的 PERL5LIB 来补齐**：实测它**确实**导出了长 PERL5LIB（含各子目录），且写法是 `export PERL5LIB=\"<conan 长列表>${PERL5LIB:+:$PERL5LIB}\"` —— 是**追加而非覆盖**；但其排在前面的 `//lib/perl5` 条目是坏的 → 实测仍失败。故问题不是\"没注入\"，而是\"注入的内容里含坏路径\""
  - "**`-I` 的优先级高于 PERL5LIB**（实测决定性依据）：即便 PERL5LIB 给的是错误值，只要 `-I<正确目录>`，perl 核心模块即可加载。据此采「桩目录内放 perl 包装器（`exec <真perl> -I... \"$@\"`）+ 前置 PATH」的做法，对环境里 PERL5LIB 的取值/顺序**不敏感**，无需与 conan 的长列表较劲"
  - "选 perl 模块目录**不能按名称逆序取第一个**：`lib/perl5` 下同时有版本目录（如 `5.42.2`）与 `site_perl`，后者**不含核心模块**（无 `strict.pm`）→ 逆序选中它仍会失败。应以「**是否含 strict.pm**」判定版本目录"
  - "本包 sha256 与 Debian 的 triehash_0.3.orig.tar.gz **逐字节相同**（实测 cmp 一致，均 14059 字节）—— 上游 GitHub codeload 与 Debian orig 同源，可互相印证"
