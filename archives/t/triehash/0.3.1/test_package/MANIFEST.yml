# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: triehash/0.3.1
homepage: "https://github.com/julian-klode/triehash"

# 上游测试：tests/ 下有 7 个用例，由 tests/run-tests.sh 驱动。
# 但其 tests/framework.sh 用 `perl -MDevel::Cover=...` 运行被测脚本，
# 而 Devel::Cover **不在 ohpcd 的 perl 包内**（实测 Can't locate Devel/Cover.pm）
# → 该驱动方式在本环境不可直接使用（实测记录，非虚构通过）。
upstream_check_command: "sh tests/run-tests.sh（需 Devel::Cover，ohpcd perl 包不含）"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "tests/test-basic"
    source: "triehash-0.3/tests/test-basic"
    description: "上游集成用例（共 7 个）：test-basic / test-case-insensitive / test-enum-include-name-flags / test-fallback-syntax / test-label-mangling / test-multi-byte-level / test-next-and-counter-values"
    command: "sh tests/run-tests.sh  # 依赖 Devel::Cover（本环境不可用）"
    note: "上游框架经 perl -MDevel::Cover 运行；ohpcd perl 包不含该模块"

# test_package 中新增的测试（真实执行脚本，R34）
test_package_tests:
  - file: run_triehash_tests.sh
    description: "真实执行 bin/triehash 的 6 项功能校验：① --help 可用；② 生成非空 .h；③ 生成非空 .c；④ 头文件含 enum 与关键字；⑤ -C -（标准输出）可用；⑥ 不存在的输入文件应失败"
    command: "sh run_triehash_tests.sh triehash <out_dir>"

# 断言总数（test_package 6 个断言）
assertion_count: 6

# R19 合规声明：PR 内不含预编译二进制（本包为纯 Perl 脚本，无构建产物）
no_prebuilt_binaries: true
