# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点（R51，依据 v0.13.1 tarball 实测）:
#   tests/ 目录数 = 1（test/ 为独立 CMake 工程 tracy-test，链接 TracyClient）
#   ctest/pytest 注册数 = 0（全树无 add_test/enable_testing；根 CMakeLists.txt 0 处提及 test，
#     故 conan create 不会构建它）
#   test/test.cpp 是手动插桩演示程序：main() 起 23 个线程后 for(;;) 永不退出，无断言、
#     无成功退出路径（仅 SIGUSR2 触发插桩失败时 return 2）；上游 CI 只编译不运行
#   ⇒ 可自动化回填的用例数 = 0，本包验证由 test_package 承担

package: tracy/0.13.1
homepage: "https://github.com/wolfpld/tracy"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest（全树无 add_test/enable_testing ⇒ 0 个注册用例）；上游 CI 的 'Test application' 步骤仅用 4 组 TRACY_* 旗标编译 test/ 工程，不运行"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# 上游测试清点证据（R51 要求的三个数字）
upstream_inventory:
  tests_dir_count: 1
  ctest_registered: 0
  automatable_cases: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tracy.cpp
    description: "消费者视角验证 Tracy 客户端（3 项实质断言）：TRACY_ENABLE 可见性（TracyCIsStarted==1）、源码位置分配、zone begin/name/end 往返并断言返回 zone id 非零；连接状态仅作信息打印（上游 ___tracy_connected() 返回 IsConnected() 的 0/1，无区分度）"
    command: "./test_tracy"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
