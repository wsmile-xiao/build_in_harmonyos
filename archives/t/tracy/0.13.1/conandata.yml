  url: "https://github.com/wolfpld/tracy/archive/refs/tags/v0.13.1.tar.gz"
  sha256: "d4efc50ebcb0bfcfdbba148995aeb75044c0d80f5d91223aebfaa8fa9e563d2b"

patches:
  - patch_file: "patches/0001-TracySystem-libc-probe-thread-cancel.patch"
    patch_description: >-
      0001 TracySystem: guard the pthread cancellation-state calls in GetThreadName()
      with a C library probe (__GLIBC__ / __BIONIC__) instead of __ANDROID__. musl —
      and therefore the OHOS libc — implements no thread cancellation at all, so
      pthread_setcancelstate() is neither declared in <pthread.h> nor exported by
      libc.so and the file failed to compile ("use of undeclared identifier
      'pthread_setcancelstate'"). Behaviour on glibc and Android is unchanged; this is
      a libc capability probe, not a platform macro.
    patch_type: "portability"

  - patch_file: "patches/0002-TracyProfiler-musl-process-name.patch"
    patch_description: >-
      0002 TracyProfiler: add a procfs fallback for the process name and executable
      path. Tracy's Linux branch is guarded by "__linux__ && _GNU_SOURCE", and the
      OHOS clang driver predefines _GNU_SOURCE unconditionally (verified with
      -dM -E for both -std=c++17 and -std=gnu++17), so the build selected glibc's
      program_invocation_short_name / program_invocation_name — symbols musl does
      not provide. The guard is tightened to __GLIBC__ and a new __linux__ branch
      reads /proc/self/comm and /proc/self/exe instead of degrading to "unknown".
    patch_type: "portability"
