version: "0.13.1"
software: "tracy"
status: built
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://github.com/wolfpld/tracy/archive/refs/tags/v0.13.1.tar.gz"
  sha256: "d4efc50ebcb0bfcfdbba148995aeb75044c0d80f5d91223aebfaa8fa9e563d2b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DTRACY_STATIC=ON"
    - "-DTRACY_ENABLE=ON"
    - "-DTRACY_Fortran=OFF"
    - "-DTRACY_LTO=OFF"
    - "-DTRACY_CLIENT_PYTHON=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-TracySystem-libc-probe-thread-cancel.patch"
  - "0002-TracyProfiler-musl-process-name.patch"

knowledge_gained:
  - "Tracy 根 CMakeLists.txt 只定义客户端库 TracyClient（单编译单元 public/TracyClient.cpp）；profiler GUI 在独立的 profiler/ 子工程，未被 add_subdirectory，因此默认构建天然无 GLFW/X11/Wayland 依赖"
  - "根 CMakeLists.txt 的平台分支很友好：execinfo 仅在 FreeBSD 生效，libunwind/debuginfod/rocprofiler-sdk 默认 OFF，OHOS 下无需额外系统库"
  - "find_package(Threads REQUIRED) 与 CMAKE_DL_LIBS 在 OHOS sysroot 上由 libpthread.a / libdl.a 满足（--target=aarch64-linux-ohos 下链接通过）"
  - "上游把公开头文件装到 <prefix>/include/tracy/{tracy,client,common}/，且 INSTALL_INTERFACE 声明 include/tracy，故消费者应以 -I<prefix>/include/tracy 配合 #include <tracy/TracyC.h>"
  - "TRACY_ENABLE 是 PUBLIC 编译定义，必须随 cpp_info.defines 导出：缺少该宏时 TracyC.h 的 #ifndef TRACY_ENABLE 分支会把整个 API 退化为空宏"
  - "cmake/version.cmake 通过正则从 public/common/TracyVersion.hpp 读取版本号，不依赖 git describe，因此 GitHub 归档 tarball（无 .git）也能正常配置"
  - "musl（OHOS libc）没有线程取消实现：pthread_setcancelstate 既无声明也无导出，需以 libc 探针（__GLIBC__/__BIONIC__）门控调用点"
  - "musl 同样没有 glibc 的 program_invocation_short_name/program_invocation_name；OHOS clang 驱动**无条件**预定义 _GNU_SOURCE（实测 -std=c++17 与 -std=gnu++17 下 -dM -E 均输出 #define _GNU_SOURCE 1），使上游 __linux__ && _GNU_SOURCE 分支在 musl 上也被选中，故需改用 __GLIBC__ 探针 + /proc 回退"
  - "上游测试面清点（R51）：tests/ 目录数=1（test/ 独立 CMake 工程 tracy-test，链接 TracyClient），ctest/pytest 注册数=0（全树无 add_test/enable_testing，根 CMakeLists.txt 不引用 test，故 conan create 不构建它）；test/test.cpp 是手动插桩演示程序（23 线程 + for(;;)，无断言、无成功退出路径），上游 CI 亦只编译不运行 ⇒ 可自动化用例数=0"
