software: tracy
display: "Tracy"
description: "Frame profiler — client library (TracyClient) for instrumented applications"
category: library
homepage: "https://github.com/wolfpld/tracy"
license: "BSD-3-Clause"
build_system: cmake

ohos_adaptation:
  key_points:
    - "根 CMakeLists.txt 只构建客户端库 TracyClient（单编译单元），profiler GUI 属独立子工程，无 GLFW/X11/Wayland 依赖"
    - "musl/OHOS 无线程取消 API：pthread_setcancelstate 需以 libc 探针 (__GLIBC__/__BIONIC__) 门控"
    - "musl 无 program_invocation_*：OHOS clang 无条件预定义 _GNU_SOURCE，使上游 __linux__ && _GNU_SOURCE 分支在 musl 上被选中，需收紧为 __GLIBC__ 并加 /proc 回退"
    - "上游测试面：test/ 为独立 CMake 工程（可编译、无断言、非 CTest），本包验证由 test_package 的 3 项实质断言承担"
    - "TRACY_ENABLE 是 PUBLIC 编译定义，必须随 cpp_info.defines 导出，否则 TracyC.h 把 API 退化为空宏"
    - "头文件根为 <prefix>/include/tracy（INSTALL_INTERFACE include/tracy）"
  common_dependencies: []

versions:
  "0.13.1":
    status: built
    build_date: "2026-09-19"
    conan_ref: "tracy/0.13.1"
