# 版本级 manifest 模板
# 文件位置: archives/t/termcolor/2.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.0"

# 软件名
software: "termcolor"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/ikalnytskyi/termcolor/tar.gz/refs/tags/v2.1.0"

  # 源码校验和
  sha256: "435994c32557674469404cb1527c283fdcf45746f7df75fd2996bb200d6a759f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-DTERMCOLOR_TESTS=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
