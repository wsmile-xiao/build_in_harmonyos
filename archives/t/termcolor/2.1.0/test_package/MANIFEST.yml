# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: termcolor/2.1.0
homepage: "https://github.com/ikalnytskyi/termcolor"

# 上游测试：CMake option TERMCOLOR_TESTS=ON 构建 test/test.cpp + test/subtest.cpp
# 为视觉测试（打印各 ANSI 颜色样例），运行退出码 0 即通过。
upstream_check_command: "cmake -DTERMCOLOR_TESTS=ON . && make && ./test_termcolor"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./test_termcolor"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: termcolor-2.1.0/test/test.cpp
    description: "上游视觉测试：打印 foreground/background/256/truecolor 等 ANSI 样例，退出码 0"
    command: "./test_termcolor"

# test_package 中自带的测试（消费者视角验证 + HarmonyOS 专项断言）
test_package_tests:
  - file: test.cpp
    description: "消费者+HarmonyOS 专项测试：ostringstream 捕获断言 red/on_blue/bold/underline/reset 的 ANSI 序列与 nocolorize 抑制"
    command: "./test_termcolor"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 10