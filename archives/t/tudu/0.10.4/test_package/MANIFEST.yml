# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tudu/0.10.4
homepage: "https://savannah.nongnu.org/projects/tudu"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# tudu 0.10.4 上游无自动化测试套件:
#   - Makefile 仅有 all / install / uninstall / dist / clean / mrproper / distclean 目标，无 check/test
#   - 源码树无 test/ 或 tests/ 目录（find 无结果）
#   - 唯一可执行入口为 `tudu` / `tudu --help` / `tudu --version`（冒烟级）
#   结论: 上游自动化测试规模 0/0 (N/A)
upstream_check_command: "make -j1 check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无自动化测试, 真实可执行入口仅 tudu CLI 冒烟）
upstream_tests:
  - file: "src/tudu"
    source: "tudu-0.10.4/src/tudu"
    description: "上游无自动化测试套件（Makefile 无 TESTS/check 目标, 无 test/ 目录）; 真实可执行入口仅 tudu CLI 冒烟（--help / --version）"
    command: "./src/tudu --help"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: "conanfile.py"
    description: "消费者测试驱动：验证打包产物 bin/tudu 存在；同架构以 bash 驱动 test.sh 实际运行 `tudu --help`，或 OHOS 交叉校验其为合法 aarch64 ELF（消费者可行性）"
    command: "bash test.sh <pkg>/bin/tudu"
  - file: "test.sh"
    description: "消费者端到端测试：校验 bin/tudu 存在且可执行（PASS 1），并运行 `tudu --help` 断言退出码 0 且输出含 usage 横幅（PASS 2）"
    command: "tudu --help"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 2
