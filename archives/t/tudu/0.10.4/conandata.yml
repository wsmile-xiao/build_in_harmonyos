sources:
  # tudu 官方托管（Savannah nongnu / code.meskio.net）当前均不可达：
  #   - https://download.savannah.nongnu.org/releases/tudu/tudu-0.10.4.tar.gz            -> 404
  #   - https://download-mirror.savannah.nongnu.org/releases/tudu/tudu-0.10.4.tar.gz      -> 404
  #   - https://savannah.nongnu.org/files/tudu-0.10.4.tar.gz/download                    -> 仅返回 HTML 落地页
  #   - https://code.meskio.net/tudu/tudu-0.10.4.tar.gz                                  -> 连接失败
  # 改用 Debian 官方归档池中的 pristine upstream tarball（.orig.tar.gz 为上游未改动源码，
  # Debian 不修改上游 tarball 内容），sha256 与本地校验一致。仓库内 tinyxml/2.6.2、
  # tnef/1.4.18 等同源 precedent（PF7 官方托管例外，PR 说明）。
  url: "https://deb.debian.org/debian/pool/main/t/tudu/tudu_0.10.4.orig.tar.gz"
  sha256: "5eebc5299330037be429355321aa4ab53650f4ff8575b349d623466492c55993"
  filename: "tudu-0.10.4.tar.gz"

patches:
  - patch_file: "patches/configure-clang-implicit-int.patch"
    patch_description: "acr 生成的 configure 在编译探针里用隐式 int main()（无返回类型），clang 15 视作硬错误（'a type specifier is required'）。改为显式 int main(){...}。属通用 clang 适配，非 OHOS 特例、不含 __OHOS__ 宏（PF5 合规）。"
    patch_type: "portability"
