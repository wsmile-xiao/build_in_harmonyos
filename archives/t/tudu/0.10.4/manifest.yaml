# tudu 版本级 manifest
# 文件位置: archives/t/tudu/0.10.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: tudu
version: "0.10.4"
status: built
build_system: autotools
compile_date: "2026-09-27"
conan_ref: "tudu/0.10.4"

source:
  url: "https://deb.debian.org/debian/pool/main/t/tudu/tudu_0.10.4.orig.tar.gz"
  sha256: "5eebc5299330037be429355321aa4ab53650f4ff8575b349d623466492c55993"
  tar_format: tar.gz

dependencies:
  required:
    - ncurses/6.5
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options: []
  note: "acr configure 不识别 --host；编译器与 ncurses 路径通过 Environment 注入"

patches_applied:
  - configure-clang-implicit-int.patch

knowledge_gained:
  - "acr 生成的 configure 在编译探针里用隐式 int main()，clang 15 视作硬错误，需改为显式 int main()"
  - "acr 的 WIDEC 探针只用 ${CXXFLAGS}（不含 ${CPPFLAGS}），ncurses 头文件路径必须同时放到 CXXFLAGS"
  - "ncurses OHOS 配方 include/ 不含 ncursesw/ 子目录，configure/includes.h 回退到 <curses.h> 即可"
