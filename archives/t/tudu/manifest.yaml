# tudu 软件级 manifest
# 文件位置: archives/t/tudu/manifest.yaml
# 链接到 ARCHIVE-SPEC v2.0

software: tudu
display_name: "tudu"
description: "Terminal hierarchical todo list manager (ncurses TUI)"
category: utility
homepage: "https://savannah.nongnu.org/projects/tudu"
license: GPL-3.0-or-later
build_system: autotools

# 跨版本适配要点
ohos_adaptation:
  key_points:
    - "acr 生成的 configure 不识别 --host/--build，需通过 Environment 手动注入编译器与依赖路径"
    - "configure 编译探针用隐式 int main()，clang 15 硬错误，patch 改为显式 int main()（通用 clang 适配）"
    - "WIDEC 探针只用 CXXFLAGS，ncurses 头文件路径须同时注入 CXXFLAGS/CFLAGS/CPPFLAGS"
    - "依赖 ncurses/6.5（OHOS 静态 libncursesw.a），已发布可消费"
  common_dependencies:
    - ncurses

versions:
  - version: "0.10.4"
    status: built
    build_date: "2026-09-27"
    patches: 1
    notes: "acr/configure 适配 clang 15 隐式 int main() + WIDEC CXXFLAGS；ncurses 6.5 静态链接"
    conan_ref: "tudu/0.10.4"
