# test_package/MANIFEST.yml — tarlz 0.29 consumer-test declaration (G1/L0e).

upstream:
  source: "https://www.nongnu.org/lzip/tarlz.html (mailing-list release notes)"
  suite: "upstream ships a testsuite/ harness run via `make check` (exact count taken on-device during build; declared here after device verification)"
  note: "consumer test below always runs in CI L1, independent of the upstream harness"

consumer_tests:
  - file: "test_tarlz.sh"
    runs: "tarlz --version / create .tar.lz / list members / extract + byte-compare"
    asserts:
      - "--version output names tarlz"
      - "archive created and non-empty"
      - "member list contains greeting.txt and nested.txt"
      - "extracted files byte-identical (3/3 cmp)"
