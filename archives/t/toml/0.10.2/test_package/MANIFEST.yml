tests:
  - name: toml-smoke
    type: conan-test-package
    file: conanfile.py
    assertions:
      - import toml from packaged PYTHONPATH
      - toml.loads('k=1') returns {'k': 1}
  - name: toml-upstream-pytest
    type: upstream-pytest
    file: upstream_tests/test_api.py
    assertions:
      - 23 upstream pytest cases collected
      - upstream pytest suite executed against installed toml module
