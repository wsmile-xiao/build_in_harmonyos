# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: toml/0.10.2
homepage: "https://github.com/uiri/toml"

# 上游测试命令 — toml pytest 套件
upstream_check_command: "python3 -m pytest tests/ -o addopts=""" ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - tests/ 目录（test_api/test_encoding 等，unittest/pytest 风格）
# - 实测结果：**21 passed / 2 failed（test_valid_tests/test_invalid_tests
#   需 toml-test 子模块规范数据（tests/valid/ 目录——sdist 不带、
#   GitHub 拉取网络不通）——真环境限制，如实记录不臆造）**
upstream_tests:
  - file: tests/
    source: toml-0.10.2/tests/
    description: "上游 pytest 套件（实测 21 passed / 2 failed——toml-test 规范数据缺失，sdist 不带、GitHub 不通）"
    command: "python3 -m pytest tests/ -o addopts=""" ""

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_toml.py
    description: "消费者测试：真实 API（R34）——toml.loads 解码 + toml.dumps 编码 round-trip"
    command: "python3 test_toml.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
