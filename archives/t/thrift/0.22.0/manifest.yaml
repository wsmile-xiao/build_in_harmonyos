  - "thrift 0.22.0 是 Arrow C++ parquet 组件的硬依赖，制品仓此前没有（本批新做）"
  - "Arrow 各版本锁的 thrift 版本：20.0.0→0.20.0、22.0.0/23.0.1/25.0.1→0.22.0；Arrow 用 FORCE_ANY_NEWER_VERSION，故 0.22.0 可被 20.0.0 消费"
  - "只编 lib/cpp（BUILD_COMPILER=OFF、WITH_JAVA/PYTHON/NODEJS/C_GLIB/AS3/LIBEVENT/QT5/ZLIB/OPENSSL 全关）——这是 Arrow 内嵌构建时的同一配置"
  - "test_package 用 C++ 而非 C：thrift.h 是 C++ 头（内含 #include <string>），用 C 编会报 'string' file not found"
