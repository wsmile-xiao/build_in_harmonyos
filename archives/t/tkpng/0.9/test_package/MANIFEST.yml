# test_package/MANIFEST.yml — tkpng 0.9
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: tkpng/0.9
homepage: "http://www.mindspring.com/~peterb/tkpng.html"

# 上游测试套件：无（纯 C Tcl 扩展，仅 generic/*.c + ChangeLog，无测试套件——rule 1.2 如实声明）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（如实声明：上游无测试套件）
upstream_tests: []

# test_package 消费者测试（R34 真实产物校验：ELF shared object + 含 tkImgFmtPNG 注册符号）
test_package_tests:
  - file: test_tkpng.py
    description: "Verifies lib/tkpng0.9.so exists, is a valid aarch64 ELF shared object (ET_DYN), and contains the tkImgFmtPNG registration symbol (TEA static stub link — symbol merged into .so) — OHOS 沙箱无法运行 tclsh9.0（libtcl9.0.so 重定位错误，tcl 包自身 E212 类 dlopen 限制），故用静态 ELF 产物校验"
    command: "python3 test_tkpng.py"

# 断言总数：3（.so 存在 + ELF shared object + tkImgFmtPNG 符号）
assertion_count: 3
