# 版本级 manifest — tkpng 0.9
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "0.9"

# 软件名
software: tkpng

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（SourceForge 官方发行）
  url: "https://sourceforge.net/projects/tkpng/files/tkpng0.9.tgz/download"

  # 源码校验和（sha256，实测）
  sha256: "92f361d4f43c3a0638f85f87af6cef30c63a1896fa59a9220bcfab4852ab10fb"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "tkpng0.9"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - tk/9.0.3.2
    - zlib/1.3.1.1.1
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "纯 C Tcl/Tk 扩展（tkImgPNG.c + tkImgPNGInit.c），TEA（Tcl Extension Architecture）autotools 构建，产物 libtkpng0.9.so；--with-tcl/--with-tk 指向 tcl/tk 包的 tclConfig.sh/tkConfig.sh；依赖 tk/9.0.3.2（自动带 tcl/9.0.3.2）+ zlib/1.3.1.1.1（均已发布）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-tcl9-compat.patch"

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "纯 C Tcl/Tk PNG 图像格式扩展，依赖 tk/9.0.3.2（自动带 tcl/9.0.3.2，均已发布）+ zlib/1.3.1.1.1（已发布）；TEA 构建需 tclConfig.sh/tkConfig.sh；0001-tcl9-compat.patch 适配 Tcl 9（_ANSI_ARGS_/CONST/Tcl_SaveResult 旧 API → Tcl 9 替代）"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 1
  failed: 0
  note: |
    上游无测试套件（纯 C Tcl 扩展，仅 generic/*.c + ChangeLog，rule 1.2 如实声明）。
    适配后：test_package R34 真实产物校验——OHOS 沙箱无法运行 tclsh9.0
    （libtcl9.0.so 重定位错误，tcl 包自身 E212 类 dlopen 限制），故用静态 ELF
    产物校验：lib/tkpng0.9.so 存在 + 合法 aarch64 ELF shared object（ET_DYN）+
    含 tkImgFmtPNG 注册符号（TEA 静态 stub 链接，符号并入 .so）（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "tkpng 是纯 C Tcl/Tk PNG 扩展（tkImgPNG.c，TEA autotools 构建，产物 tkpng0.9.so）：--with-tcl 指向 tcl 包 tclConfig.sh；依赖 tcl + zlib；上游无测试套件，R34 用静态 ELF 产物校验（OHOS 沙箱无法运行 tclsh9.0，E212 类 dlopen 限制）"

references:
  - http://www.mindspring.com/~peterb/tkpng.html
