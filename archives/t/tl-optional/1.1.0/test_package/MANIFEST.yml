# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tl-optional/1.1.0
homepage: "https://github.com/TartanLlama/optional"

# 上游测试命令 (ctest 注册 15 个单测入口)
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 中通过 cmake.test() 集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游实际运行的测试程序 (15 个单测入口)
upstream_tests:
  - file: tests/assignment.cpp
    source: optional-1.1.0/tests/assignment.cpp
    description: "tl::optional 赋值语义测试"
    command: "./tl-optional-test-assignment"
  - file: tests/bases.cpp
    source: optional-1.1.0/tests/bases.cpp
    description: "基类/析构计数测试"
    command: "./tl-optional-test-bases"
  - file: tests/constexpr.cpp
    source: optional-1.1.0/tests/constexpr.cpp
    description: "constexpr 上下文字面量测试"
    command: "./tl-optional-test-constexpr"
  - file: tests/constructors.cpp
    source: optional-1.1.0/tests/constructors.cpp
    description: "构造函数族测试"
    command: "./tl-optional-test-constructors"
  - file: tests/emplace.cpp
    source: optional-1.1.0/tests/emplace.cpp
    description: "emplace 原位构造测试"
    command: "./tl-optional-test-emplace"
  - file: tests/extensions.cpp
    source: optional-1.1.0/tests/extensions.cpp
    description: "map/and_then/or_else 等扩展 API 测试"
    command: "./tl-optional-test-extensions"
  - file: tests/hash.cpp
    source: optional-1.1.0/tests/hash.cpp
    description: "hash 支持测试"
    command: "./tl-optional-test-hash"
  - file: tests/in_place.cpp
    source: optional-1.1.0/tests/in_place.cpp
    description: "in_place 构造测试"
    command: "./tl-optional-test-in_place"
  - file: tests/issues.cpp
    source: optional-1.1.0/tests/issues.cpp
    description: "GitHub issue 回归测试"
    command: "./tl-optional-test-issues"
  - file: tests/make_optional.cpp
    source: optional-1.1.0/tests/make_optional.cpp
    description: "make_optional 工厂函数测试"
    command: "./tl-optional-test-make_optional"
  - file: tests/noexcept.cpp
    source: optional-1.1.0/tests/noexcept.cpp
    description: "noexcept 保证测试"
    command: "./tl-optional-test-noexcept"
  - file: tests/nullopt.cpp
    source: optional-1.1.0/tests/nullopt.cpp
    description: "nullopt 语义测试"
    command: "./tl-optional-test-nullopt"
  - file: tests/observers.cpp
    source: optional-1.1.0/tests/observers.cpp
    description: "value/value_or/operator* 等观察器测试"
    command: "./tl-optional-test-observers"
  - file: tests/relops.cpp
    source: optional-1.1.0/tests/relops.cpp
    description: "关系比较运算符测试"
    command: "./tl-optional-test-relops"
  - file: tests/swap.cpp
    source: optional-1.1.0/tests/swap.cpp
    description: "swap 测试"
    command: "./tl-optional-test-swap"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_optional.cpp
    description: "消费者测试：核心/扩展 API 真实编译运行断言"
    command: "./test_tl_optional"
  - file: harmonyos_specific_test.cpp
    description: "HarmonyOS 专项测试：OHOS 工具链下真实编译运行的调用入口"
    command: "./harmonyos_specific_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 31
