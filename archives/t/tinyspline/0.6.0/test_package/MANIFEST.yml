# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 实测: 上游 CMake/CTest 2 个测试全部通过

package: tinyspline/0.6.0
homepage: "https://github.com/msteinbeck/tinyspline"

# 上游测试命令 (实测 ctest -N 输出)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本地 Step 2 实测: 2/2 通过)
upstream_tests:
  - file: test/c
    source: tinyspline-0.6.0/test/c
    description: "C API 测试 (tinyspline_tests, 覆盖 bspline/bezier/deboornet 等)"
    command: "./tinyspline_tests"
  - file: test/cxx
    source: tinyspline-0.6.0/test/cxx
    description: "C++ API 测试 (tinysplinecxx_tests)"
    command: "./tinysplinecxx_tests"

# test_package 中自带的测试 (消费者视角验证, 真实调用 C API)
test_package_tests:
  - file: test.c
    description: "消费者测试: 创建/求值 B-spline 并转 Bezier, 断言非 NULL"
    command: "./test_tinyspline"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
