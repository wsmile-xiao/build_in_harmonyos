knowledge_gained:
  - "lang-preflight 误检风险：tinyspline 顶层 CMakeLists.txt 为主 manifest，examples/go、test/go 下 go.mod 属绑定示例，不应判为 go 语言主体；c/cpp 兼容族按源码主体判定"
  - "OHOS sysroot math.h 的 isinf 宏展开使用 long long，在 -std=c89 -Werror 下触发 -Werror,-Wlong-long（E063）；CMakeToolchain 加 CMAKE_C_FLAGS=-Wno-error=long-long 修复"
  - "tinyspline 上游 GNUInstallDirs 在 OHOS 下选 lib64，conan CMakeDeps 默认查 lib -> Library 'tinysplinecxx' not found；用 CMakeToolchain cache_variables[CMAKE_INSTALL_LIBDIR]=lib 并 package_info.libdirs 兼容 lib/lib64"
  - "C API 测试须用 ts_bspline_eval（含 status 参数），无 ts_bspline_evaluate"
  - "C 库 C 接口 test_package 用 TS_TRY/TS_CATCH/TS_FINALLY/TS_END_TRY 宏，且 TS_END_TRY 只允许出现一次在最后"
