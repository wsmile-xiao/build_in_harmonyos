# 软件级 manifest — ttmath
software: ttmath
display: "TTMath"
description: "Header-only C++ 模板大数库：大无符号/有符号整数与大浮点数，附数学表达式解析器。"
category: library
homepage: "https://www.ttmath.org/"
license: BSD-3-Clause

build_system: none

ohos_adaptation:
  key_points:
    - "header-only 模板库，无编译，仅打包头文件到 include/ttmath/"
    - "OHOS aarch64 下自动选择 TTMATH_PLATFORM32 + TTMATH_NOASM 可移植实现，无需补丁"
    - "官方 release 包不含 tests/，上游测试位于 0.9.3 git tag 的 tests/，已 vendored 到 upstream_tests/ 并在 build() 运行"
  common_dependencies: []

versions:
  "0.9.3-src":
    status: built
    build_date: "2026-09-18"
    conan_ref: "ttmath/0.9.3-src"
