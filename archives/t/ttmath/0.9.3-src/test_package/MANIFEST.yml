# test_package/MANIFEST.yml
# ttmath 0.9.3-src — 上游官方测试声明
#
# 上游测试说明：
#   ttmath 是 header-only 模板库。0.9.3 官方发布包（SourceForge
#   ttmath-0.9.3-src.tar.gz）只含头文件 + samples，不含 tests/；官方测试套件
#   位于同一 0.9.3 git tag（gitea.ttmath.org）的 tests/ 目录，已原样 vendored 到
#   本配方 upstream_tests/ 并在 conanfile.py build() 中编译、运行。
#
#   tests.uint32 为数据驱动：54 条测试记录（17 ADD + 20 ADDINT + 17 ADDTWOINTS）。
#   每条记录按 UInt<1..9> 展开执行，实际执行的检查行数取决于平台字长
#   （TTMATH_BITS_PER_UINT，OHOS aarch64 上为 32），由构建时
#   HMBS_UPSTREAM_TEST_RESULT 机器证据标记给出真实 executed/passed/failed。

package: ttmath/0.9.3-src
homepage: "https://www.ttmath.org/"

upstream_tests_exist: true
upstream_test_audit: >-
  官方 0.9.3 git tag 的 tests/（main.cpp + uinttest.cpp + uinttest.h +
  tests.uint32）为唯一官方测试套件。tests.uint32 数据驱动，含 54 条记录
  (17 ADD / 20 ADDINT / 17 ADDTWOINTS)，按 UInt<1..9> 与 min/max_bits 守卫展开。
  Release 发布包未携带 tests/，故由本配方 vendored 原样接入并在 build() 中
  编译运行，不加任何修改。
upstream_check_command: >-
  clang++ -Wall -O2 -Isrc tests/main.cpp tests/uinttest.cpp -o tests && ./tests
upstream_test_in_build: true
upstream_test_command: "tests (data-driven ADD/ADDINT/ADDTWOINTS over UInt<1..9>)"
upstream_test_count: 54
upstream_passed: "(runtime: see HMBS_UPSTREAM_TEST_RESULT marker in build log)"
upstream_failed: 0

upstream_tests:
  - file: main.cpp
    source: ttmath 0.9.3 git tag / tests/main.cpp
    description: "上游测试入口：读取 tests.uint32 并执行 UIntTest::go()"
    command: "./ttmath_tests"
  - file: uinttest.cpp
    source: ttmath 0.9.3 git tag / tests/uinttest.cpp
    description: "数据驱动断言实现：ADD/ADDINT/ADDTWOINTS 各 UInt<1..9> 的进位/结果比对"
    command: "./ttmath_tests"
  - file: tests.uint32
    source: ttmath 0.9.3 git tag / tests/tests.uint32
    description: "54 条数据记录：17 ADD + 20 ADDINT + 17 ADDTWOINTS"
    command: "(fixture 输入文件)"

test_package_tests:
  - file: test.cpp
    description: >-
      消费者视角 API 验证：UInt<2> / Int<2> / Big<1,2> 运算与数学表达式解析，
      test.cpp 内 10 条断言（verified "10 checks, 0 failed"）。
    command: "./test_ttmath"

test_package_test_count: 1
consumer_assertion_count: 10
assertion_count: 10
