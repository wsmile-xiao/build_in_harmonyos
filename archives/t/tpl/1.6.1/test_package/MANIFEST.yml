# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tpl/1.6.1
homepage: "https://github.com/troydhanson/tpl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# tpl 上游测试套件位于 tests/，由 `make all` 驱动（内部调用 perl do_tests，
# 编译并运行 test1~test125，逐项与 .ans 期望输出 diff 比对）。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 make check 无注册（automake 顶层未声明 TESTS），测试在 tests/ 目录
# 由独立 Makefile 驱动，实际验证在本地 Adapt 阶段完成（124/124 通过）。
upstream_test_in_build: false
upstream_test_command: "make -C tests all"

# 上游实际运行的测试程序
upstream_tests:
  - file: test1.c
    source: tpl-1.6.1/tests/test1.c
    description: "tpl 基础序列化 roundtrip（tpl_map/tpl_pack/tpl_dump/tpl_load/tpl_unpack）"
    command: "./test1"
  - file: test2.c
    source: tpl-1.6.1/tests/test2.c
    description: "文件 dump/load 全流程（适配：/tmp 只读改为相对路径）"
    command: "./test2"
  - file: test67.c
    source: tpl-1.6.1/tests/test67.c
    description: "数组长度不匹配错误路径（.ans 同步适配为相对路径名）"
    command: "./test67"
  - file: test125.c
    source: tpl-1.6.1/tests/test125.c
    description: "其余 test3~test125 覆盖嵌套结构、变长数组、对齐等场景"
    command: "./test125"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 roundtrip 测试：tpl_map('i') → pack → dump 到文件 → load → unpack → 校验值"
    command: "./test_tpl"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 124 个测试程序逐项与 .ans diff；test_package 1 个 roundtrip 断言
assertion_count: 125