# 软件级 manifest — termrec
# 遵循 ARCHIVE-SPEC v2.0
software: termrec
display: "termrec"
description: "Record and replay terminal sessions (ttyrec/asciicast) — libtty + CLI tools"
category: utils
homepage: "https://github.com/kilobyte/termrec"
license: LGPL-3.0-only

build_system: autotools

ohos_adaptation:
  key_points:
    - "musl 系 libc（OHOS）无 POSIX 线程取消：pthread_cancel/pthread_setcancelstate 链接期 undefined；按 autoconf 能力探测（HAVE_PTHREAD_CANCEL）在缺失时改用协作式停止（标志位+条件变量唤醒+分片 select），glibc 保持上游原生路径"
    - "configure.ac 用 AC_CHECK_LIB/AC_CHECK_HEADERS 探测压缩库，需要 AutotoolsDeps 注入 CPPFLAGS/LDFLAGS/LIBS，否则 lzma/zstd 探测为 no（.xz/.zst 功能静默缺失）"
    - "config.status 的 umask 077 临时目录在 HMDFS 上不可写 → 改为 umask 022（E011/E114 受控方案）；hnp bash 在 HMDFS 下 getcwd 失败 → CONFIG_SHELL unset + SHELL=/bin/sh（E386）"
    - "out-of-source 构建下 doc/Makefile.am 以 include 并入顶层 Makefile，man 页规则需 build 目录预先存在 doc/"
    - "Conan 2 的 package_type=application 不向消费者暴露 cpp_info（实测 include 路径为空）→ 本包声明为 library + shared 选项，CLI 依据 R38 额外提供 commands.json"
    - "静态 libtty（默认）使工具自包含：OHOS musl 忽略 DT_RUNPATH"

versions:
  "0.19":
    status: built
    build_date: "2026-09-16"
