# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点证据（R51 三步法）:
#   * tests/testsuite.at 内 AT_SETUP 计数 = 16：seeks / timeval arithmetics /
#     recording / loading-saving ttyrecs / asciicasts / v1 asciicasts /
#     .gz / .bz2 / .xz / .zst / split UTF-8 / vt100 sequences / long vt100
#     writes / vt-on-vt / replayed onto vt / fuzzing vt
#   * tests/Makefile.am: check_PROGRAMS = seeks tarith loadsave rec vt vtmir vtgen
#   * 机制: AC_CONFIG_TESTDIR(tests) Autotest 套件，make check 经 check-local
#     生成并运行 testsuite（autom4te 由 SDK autoconf 提供）
#   * 其中 .gz/.bz2/.xz/.zst 四例带 AT_SKIP_IF(config.h 压缩宏)，本配方提供
#     bzip2/zlib/liblzma/zstd 依赖，四例应实际执行而非跳过

package: termrec/0.19
homepage: "https://github.com/kilobyte/termrec"

# 上游测试命令（Autotest 套件）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/testsuite.at
    source: termrec-0.19/tests/testsuite.at
    description: "上游 Autotest 套件：16 个 AT_SETUP 用例（seeks/tarith/recording/loadsave×3/压缩格式×4/UTF-8/vt 系×5）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.c
    description: "消费者测试：链接 libtty 调用公开 API（格式注册表、tty 生命周期、ttyrec 录制→读回往返、数据与时间戳断言）；另运行安装后的 termcat 做 asciicast→ttyrec 端到端转换"
    command: "./test_consumer"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
