sources:
  url: "https://github.com/kilobyte/termrec/archive/refs/tags/v0.19.tar.gz"
  sha256: "0550c12266ac524a8afb764890c420c917270b0a876013592f608ed786ca91dc"

patches:
  "0.19":
    - patch_file: "patches/0001-configure.ac.patch"
      patch_description: "Probe pthread_cancel/pthread_setcancelstate via AC_CHECK_FUNCS (musl-derived libcs, eg. OpenHarmony, do not provide them)"
      patch_type: "portability"
    - patch_file: "patches/0002-play-player.c.patch"
      patch_description: "Stop the playback thread cooperatively when POSIX thread cancellation is unavailable (HAVE_PTHREAD_CANCEL); frame writes stay uninterruptible"
      patch_type: "portability"
    - patch_file: "patches/0003-play-termplay.c.patch"
      patch_description: "Stop the loader thread cooperatively on exit when POSIX thread cancellation is unavailable; avoids a hang on a blocking read"
      patch_type: "portability"
