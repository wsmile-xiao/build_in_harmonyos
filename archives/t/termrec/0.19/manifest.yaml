# 版本级 manifest — termrec 0.19
version: "0.19"
software: termrec
status: built
build_date: "2026-09-16"
build_system: autotools

source:
  url: "https://github.com/kilobyte/termrec/archive/refs/tags/v0.19.tar.gz"
  sha256: "0550c12266ac524a8afb764890c420c917270b0a876013592f608ed786ca91dc"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-shared"
    - "--enable-static"
  dependencies:
    - "bzip2/1.0.8"
    - "liblzma/5.8.1"
    - "zlib/1.3.1.1"
    - "zstd/1.5.7"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.ac.patch"
  - "0002-play-player.c.patch"
  - "0003-play-termplay.c.patch"

knowledge_gained:
  - "musl 系 libc（含 OpenHarmony）不提供 POSIX 线程取消：pthread_cancel/pthread_setcancelstate 链接期 undefined；上游 termplay 以 cancel+join 管理播放/加载线程，改为 HAVE_PTHREAD_CANCEL 探测 + 协作式停止（volatile 标志 + 唤醒 cond + 分片 select），行为等价且不引入 stub"  # reference: notes.md
  - "configure.ac 用 AC_CHECK_LIB 直接探测压缩库（非 pkg-config），需 AutotoolsDeps 注入 CPPFLAGS/LDFLAGS/LIBS；仅靠 AutotoolsToolchain 时 lzma/zstd 探测为 no，功能静默缺失"  # reference: notes.md
  - "out-of-source 构建下 doc/Makefile.am 以 include 方式并入顶层 Makefile（非 SUBDIRS），.pod→.1/.3 规则写 doc/<page> 时目录不存在会 /bin/sh: can't create，需在 build() 预建 build/doc"  # reference: notes.md
  - "Conan 2 的 package_type=application 不向消费者暴露 cpp_info（消费者 include 路径为空）——含库+CLI 的包必须声明为 library 并额外提供 commands.json"  # reference: notes.md
