# test_package/MANIFEST.yml
# 上游官方测试声明文件 — tinydng 0.1.0

package: tinydng/0.1.0
homepage: "https://github.com/syoyo/tinydng"

# 上游无自动化测试框架：CMakeLists.txt 无 enable_testing()/ctest，
# 顶层 Makefile 只构建 test_dng_loader 可执行文件，无 make check 目标。
upstream_check_command: "cmake --build . --target test_dng_loader"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./test_dng_loader colorchart.dng（校验输出无 'Fail to load' 且含图像元数据）"

# 上游实际测试入口（静态 2 个，均无测试框架/断言体系）
upstream_tests:
  - file: test_loader.cc
    source: tinydng-0.1.0/test_loader.cc
    description: "DNG 加载冒烟程序：解析 DNG 并打印图像元数据；无断言，exit 恒 0（上游实现如此）"
    command: "./test_dng_loader colorchart.dng"
  - file: tests/byteorder/main.cc
    source: tinydng-0.1.0/tests/byteorder/main.cc
    description: "字节序实验工具：依赖 libtiff（独立 Makefile clang++ -ltiff），上游未接入任何构建/测试体系，未执行（依赖未发布且非上游自动化套件成员）"
    command: "（未执行）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_tinydng.cpp
    description: "消费者测试：tinydngwriter 写 16x16 RGB16 DNG → tinydng loader 读回，断言尺寸/位深/采样格式/像素字节逐位一致（22 处 CHECK 断言）"
    command: "./test_tinydng"

# 测试断言总数（消费者测试中 CHECK 宏计数）
assertion_count: 22
