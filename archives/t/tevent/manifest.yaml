software: tevent
display: "tevent"
description: "Samba 的事件循环与异步请求（tevent_req）库"
category: system
homepage: "https://tevent.samba.org/"
license: LGPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "上游为 Samba waf 构建，configure 通过 wafsamba 跑 mandatory 运行探针且需可写 /tmp；OHOS worker 上应绕开 waf，用 direct-cc 直接编译 15 个 tevent*.c"
    - "lib/replace/replace.h 在未定义 HAVE_STRERROR 时把 strerror() 重映射为 sys_errlist[]（musl 无该符号）→ 必须 -DHAVE_STRERROR；同理 strerror_r 需同时定义 HAVE_STRERROR_R 与 STRERROR_R_XSI_NOT_GNU 才不会被重映射为未实现的 rep_strerror_r"
    - "replace.h 的 ZERO_STRUCT/BURN_DATA 宏会展开出 rep_memset_s()；上游实现位于 lib/replace/replace.c，而该文件依赖 waf 生成的全量特性矩阵无法单独编译，需自带 compat 实现（files/tevent_ohos_compat.c，volatile 写入防止清零被优化掉）"
    - "OHOS 具备 sys/epoll.h，务必置 HAVE_EPOLL 并编入 tevent_epoll.c，否则静默退化为 poll 后端且 tevent_backend_list() 不含 epoll"
    - "TEVENT_NUM_SIGNALS 由 waf 取 max(64, NSIG, _NSIG, SIGRTMAX, SIGRTMIN*2)；OHOS _NSIG=65 而 SIGRTMIN/SIGRTMAX 是运行时函数，最终值为 65"
    - "tevent.h 公共头 include <talloc.h>，依赖 talloc 须声明 transitive_headers/transitive_libs"
  common_dependencies:
    - talloc

versions:
  "0.17.1":
    status: built
    build_date: "2026-09-20"
    conan_ref: "tevent/0.17.1"
