version: "0.17.1"
software: tevent
status: built
build_date: "2026-09-20"
conan_ref: "tevent/0.17.1"
build_system: direct-cc

source:
  url: "https://download.samba.org/pub/tevent/tevent-0.17.1.tar.gz"
  sha256: "1be2dea737cde25fe06621f84945e63eb71259e0c43e9f8f5da482dab1a7be92"
  tar_format: tar.gz

build:
  system: direct-cc
  configure_options:
    - "-DNO_CONFIG_H"
    - "-DHAVE_EPOLL -DHAVE_SYS_EPOLL_H"
    - "-DTEVENT_NUM_SIGNALS=65"
  dependencies:
    - talloc/2.4.4
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 tevent 的 waf 构建不可直接用：configure 的 mandatory 探针依赖可写的 /tmp 与完整 lib/replace 构建，OHOS worker 上必须绕开；tevent 的全部 15 个 tevent*.c 可用 direct-cc 一组固定宏直接编译（ref: conanfile.py TEVENT_SOURCES）"
  - "replace.h 在未定义 HAVE_STRERROR 时把 strerror() 重映射为 sys_errlist[]（glibc/BSD 遗留符号，musl 无此符号）→ 链接期 undefined reference to `sys_errlist'；must define HAVE_STRERROR（ref: lib/replace/replace.h:208）"
  - "replace.h 只在同时定义 HAVE_STRERROR_R 与 STRERROR_R_XSI_NOT_GNU 时才不把 strerror_r 重映射为未实现的 rep_strerror_r（ref: lib/replace/replace.h:645）"
  - "tevent_signal.o/tevent_epoll.o 经 replace.h 的 ZERO_STRUCT/BURN_DATA 引用 rep_memset_s；lib/replace/replace.c 无法单独编译（依赖 waf 生成的 AC_LIBREPLACE_NETWORK_CHECKS/HAVE_FTRUNCATE/struct tm 全量特性矩阵），改为在 files/tevent_ohos_compat.c 提供该单符号（ref: files/tevent_ohos_compat.c）"
  - "waf 计算 TEVENT_NUM_SIGNALS = max(64, NSIG, _NSIG, SIGRTMAX, SIGRTMIN*2)；OHOS 的 _NSIG=65 而 SIGRTMIN/SIGRTMAX 是运行时函数 __libc_current_sigrtmin/max，CHECK_VALUEOF 无法折叠为常量，最终取 65（ref: wscript configure()）"
  - "tevent_epoll.c 仅在 HAVE_EPOLL 时编译进库；OHOS 有 sys/epoll.h，漏掉该文件会静默退化为 poll 后端（事件循环仍可跑但性能与语义不同），故显式置 HAVE_EPOLL/HAVE_SYS_EPOLL_H 并把 tevent_epoll.c 列入源文件（ref: wscript build()）"
