# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）

package: tevent/0.17.1
homepage: "https://tevent.samba.org/"

# 上游 wscript test() 目标：test_tevent_tag + test_tevent_trace（cmocka 单测）
# 以及 bindings.py（pytevent CPython 扩展测试，本配方不构建扩展，见下）
upstream_check_command: "make test"

# conanfile.py build() 已集成上游测试（conan create 即编译并运行两个 cmocka 单测）
upstream_test_in_build: true
upstream_test_command: "./test_tevent_tag && ./test_tevent_trace"

upstream_tests:
  - file: "tests/test_tevent_tag.c"
    source: "tevent-0.17.1/tests/test_tevent_tag.c"
    description: "5 个 cmocka 单测：tevent fd/timer/signal/immediate/queue_entry 的 tag 语义（tevent_fd_set_tag 等），24 处断言"
    command: "./test_tevent_tag"
  - file: "tests/test_tevent_trace.c"
    source: "tevent-0.17.1/tests/test_tevent_trace.c"
    description: "24 个 cmocka 单测：trace callback 在 attach/before_handler/handler/detach/wrapper 各阶段的可观测行为，425 处断言"
    command: "./test_tevent_trace"
  - file: "bindings.py"
    source: "tevent-0.17.1/bindings.py"
    description: "pytevent CPython 扩展测试（上游 wscript 中经 RUN_PYTHON_TESTS 执行）"
    command: "python3 bindings.py"
    excluded: true

# 上游 test_req.c / testsuite.c 位于源码根目录，但未出现在 wscript 的
# build()/test() 目标中（wscript 仅注释说明 testsuite 已并入 samba 的
# smbtorture），因此既非构建目标也非测试目标，本包不编译。

test_package_tests:
  - file: test_tevent.c
    description: "消费者测试：tevent_backend_list 含 epoll 后端、tevent_context_init、immediate/timer/fd 三类事件经事件循环各投递一次、读到管道字节、循环有界收敛、talloc_free 释放 context，6 处行为断言"
    command: "./test_tevent"

# 测试断言总数（消费者程序 6 处行为断言；上游 29 个 cmocka 单测 449 处断言）
assertion_count: 6
