software: tinyxml2
version: "10.1.0"
build_system: cmake
status: built
build_date: "2026-09-07"

source:
  url: "https://github.com/leethomason/tinyxml2/archive/refs/tags/10.1.0.tar.gz"
  sha256: "9da7e1aebbf180ef6f39044b9740a4e96fa69e54a01318488512ae92ca97a685"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-Dtinyxml2_SHARED_LIBS=${shared}"
    - "-Dtinyxml2_BUILD_TESTING=ON"
    - "-DBUILD_TESTING=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "Upstream CMake uses tinyxml2_SHARED_LIBS rather than BUILD_SHARED_LIBS as its primary shared/static switch."
  - "Cross builds must not execute target binaries on the build host; native-capable builds still run upstream CTest."
  - "The official 10.1.0 xmltest reports 517 assertions on HarmonyOS 6.0."
  - "Native HarmonyOS CTest must sign build-tree ELF files and expose the build library directory through LD_LIBRARY_PATH before execution."
