package: tvm-ffi/0.1.12
homepage: "https://github.com/apache/tvm-ffi"

# Upstream test audit (source: tag v0.1.12). With -DTVM_FFI_BUILD_TESTS=ON the
# top-level CMakeLists calls enable_testing(), includes
# cmake/Utils/AddGoogleTest.cmake (upstream FetchContent googletest v1.14.0;
# recipe vendors googletest v1.17.0 tarball offline via
# FETCHCONTENT_SOURCE_DIR_GOOGLETEST, framework only, no case changes) and adds
# tests/cpp/, whose CMakeLists builds one binary tvm_ffi_tests from
# test*.cc (+ extra/test*.cc when TVM_FFI_USE_EXTRA_CXX_API=ON, the default)
# and registers it via TVM_FFI_ADD_GTEST (add_test NAME tvm_ffi_tests plus
# gtest_discover_tests DISCOVERY_MODE PRE_TEST). `ctest -N` at configure time
# reports 1 entry, but at test time PRE_TEST discovery expands every gtest
# into its own ctest entry: the 2026-09-21 preflight run reported
# "27 tests failed out of 387", the 2026-09-22 run showed ".../389"
# per-test lines (1 entry DISABLED_ListCycleDetection excluded in both;
# earlier manual count 388 TEST() macros: 24 core files 275 + 9 extra files
# 113, counted 2026-09-21, likely missed 1-2 TEST_F/P variants).
# Latest evidence (389) is used as the total; the recipe determines the
# exact count at runtime via post-build ctest -N plus per-test Test # lines.
# Portion below uses the post-discovery ctest count as the
# single deterministic source.
upstream_tests_exist: true
upstream_test_audit: "tests/cpp/CMakeLists.txt globs test*.cc plus extra/test*.cc into one binary tvm_ffi_tests (TVM_FFI_ADD_GTEST, PRE_TEST discovery); configure-time ctest -N shows 1 entry, test-time discovery expands to 389 enabled ctest entries ( 1 DISABLED excluded; earlier manual count 388 TEST() macros likely missed variants, latest preflight shows .../389)"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_test_total: 389
upstream_test_count_method: "ctest_entries"

upstream_tests:
  - file: "tests/cpp/test_any.cc"
    source: "apache/tvm-ffi v0.1.12 / tests/cpp"
    description: "Any/AnyView value semantics (part of tvm_ffi_tests)"
    command: "ctest --output-on-failure"
  - file: "tests/cpp/test_function.cc"
    source: "apache/tvm-ffi v0.1.12 / tests/cpp"
    description: "Function/global-registry tests (part of tvm_ffi_tests)"
    command: "ctest --output-on-failure"
  - file: "tests/cpp/test_tensor.cc"
    source: "apache/tvm-ffi v0.1.12 / tests/cpp"
    description: "Tensor/DLPack interop tests (part of tvm_ffi_tests)"
    command: "ctest --output-on-failure"
  - file: "tests/cpp/extra/test_serialization.cc"
    source: "apache/tvm-ffi v0.1.12 / tests/cpp/extra"
    description: "Serialization roundtrip tests (part of tvm_ffi_tests)"
    command: "ctest --output-on-failure"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer API test: version macros, C version API, Any int roundtrip, String roundtrip, Array sum, Shape dims (6 checks)"
    command: "ctest --output-on-failure"

assertion_count: 6
