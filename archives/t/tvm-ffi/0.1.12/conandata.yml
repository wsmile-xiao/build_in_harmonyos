# Vendored GoogleTest for the upstream ctest suite (FetchContent override).
# Upstream cmake/Utils/AddGoogleTest.cmake does
#   FetchContent_Declare(googletest GIT_REPOSITORY https://github.com/google/googletest.git GIT_TAG v1.14.0)
# which git-clones github.com at configure time; the preflight worker cannot
# reach github.com:443 (3x 65s timeouts, 2026-09-23 round). source() fetches
# this tarball (same archive+sha256 as the in-repo gtest/1.17.0.1 recipe,
# whose OHOS TMPDIR sandbox patch is also reused) and generate() points
# FETCHCONTENT_SOURCE_DIR_GOOGLETEST at it, so configure is fully offline.
# GTest framework upgrade (1.14.0 -> 1.17.0) does not change any of the 389
# upstream tvm-ffi test cases; it is only the test runner.
googletest:
  url:
    - "https://gh-proxy.com/https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz"
    - "https://github.com/google/googletest/archive/refs/tags/v1.17.0.tar.gz"
  sha256: "65fab701d9829d38cb77c14acdc431d2108bfdbf8979e40eb8ae567edf10b27c"
