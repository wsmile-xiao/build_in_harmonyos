# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.12"

# 软件名
software: "tvm-ffi"

# 编译状态
# published | built | failed | archived
status: "built"

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag）
  url: "https://github.com/apache/tvm-ffi/archive/refs/tags/v0.1.12.tar.gz"

  # 源码校验和
  sha256: "4a25fe74cc599d2aedb7e5278a5c46a63395b40f5ee6e33867ccac53bc78e1f8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DTVM_FFI_USE_LIBBACKTRACE=OFF"
    - "-DTVM_FFI_USE_EXTRA_CXX_API=ON"
    - "-DTVM_FFI_USE_THREADS=ON"
    - "-DTVM_FFI_USE_DL_LIBS=ON"
    - "-DTVM_FFI_BACKTRACE_ON_SEGFAULT=ON"
    - "-DTVM_FFI_BUILD_TESTS=ON"
    - "-DTVM_FFI_BUILD_PYTHON_MODULE=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=True"
    - "-DCMAKE_INSTALL_RPATH=$ORIGIN"
    - "-DCMAKE_C_FLAGS_RELEASE=-O1 -DNDEBUG -g0"
    - "-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG -g0"
    - "-DCMAKE_BUILD_RPATH_USE_ORIGIN=True"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本版本无独立补丁文件，测试链静态化由 conanfile build() 内 replace_in_file 完成）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Apache TVM FFI 是机器学习开放 ABI/FFI，C++17，对外 libtvm_ffi.so 与 libtvm_ffi_static.a"
  - "GitHub tag 包 3rdparty 子模块为空目录，需在 source() 拉取 dlpack v1.3 头文件"
  - "TVM_FFI_USE_LIBBACKTRACE=OFF 可避开 libbacktrace 子模块与 autotools 编译"
  - "上游 ctest 仅注册 1 个 tvm_ffi_tests 条目，内含 388 个 GTest 用例"
  - "Python 模块默认关闭，避免 cython 依赖"
  - "许可证：Apache-2.0"
  - "主要 API: tvm::ffi::Any/AnyView/String/Array/Shape/Function，C API TVMFFIGetVersion"
