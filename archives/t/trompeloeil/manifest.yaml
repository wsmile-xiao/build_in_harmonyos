# 软件级 manifest — trompeloeil
software: trompeloeil
display: "trompeloeil"
description: "Header-only C++ mocking framework (expectations, matchers, sequences, C++20 coroutines)"
category: library
homepage: "https://github.com/rollbear/trompeloeil"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游自测需要 Catch2 v3；配方以 tool_requires 提供，防止 test/CMakeLists.txt 构建期下载 catch.hpp"
    - "68 个负向编译测试用线程池驱动（OHOS 无 GNU parallel）；TMPDIR 必须指向可写目录"
    - "无源码补丁：OpenHarmony clang 15 / libc++ 15 下上游测试套件零修改通过（C++14 与 C++20）"
  common_dependencies: []

versions:
