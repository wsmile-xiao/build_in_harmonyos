# 版本级 manifest — trompeloeil 49
# 遵循 ARCHIVE-SPEC v3.0
version: "49"
software: trompeloeil
status: built
build_date: "2026-09-16"
conan_ref: "trompeloeil/49"
build_system: cmake

source:
  url: "https://github.com/rollbear/trompeloeil/archive/refs/tags/v49.tar.gz"
  sha256: "2523571fb7920b2813cbc23b46e60294aba8ead7eba434bfec69c24408615593"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DTROMPELOEIL_BUILD_TESTS=YES"
    - "-DCXX_STANDARD=14"
    - "-DCXX_STANDARD=20"
    - "-DCMAKE_PREFIX_PATH=<catch2 tool_requires package folder>"
  # header-only 库：build() 只编译/运行上游测试套件，无库产物
  dependencies:
    - catch2/3.8.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 test/CMakeLists.txt 在找不到 Catch2 时会从 GitHub 下载 catch.hpp（构建期联网）；必须 tool_requires catch2 + CMAKE_PREFIX_PATH 预置"
  - "check_errors.sh 依赖 GNU parallel；OHOS 无 parallel，用线程池驱动同一 verify_compilation_error.sh，语义等价"
  - "OHOS /tmp 只读：负向编译测试的 mktemp 需要 TMPDIR 指向构建目录"
  - "OHOS clang 15 + libc++ 15 下 68 个 expect-to-fail 用例诊断文本全部命中上游声明的正则（C++20），无需白名单"
