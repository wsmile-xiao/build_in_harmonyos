# test_package/MANIFEST.yml — upstream test declaration (CI L0e)
package: trompeloeil/49
homepage: "https://github.com/rollbear/trompeloeil"

# Upstream test entry points (see test/CMakeLists.txt and check_errors.sh)
upstream_check_command: >-
  cmake -S . -B build -DTROMPELOEIL_BUILD_TESTS=YES -DCXX_STANDARD=14
  && cmake --build build --target self_test && ./build/test/self_test;
  CXXFLAGS="-std=c++14" ./check_errors.sh
upstream_test_in_build: true
upstream_test_command: >-
  conanfile.py build(): Catch2 v3 self_test at C++14 and C++20 (C++20 adds
  test_co_mock.cpp), thread_terror, custom_recursive_mutex, and all 68
  compilation_errors cases at C++14 and C++20

upstream_tests:
  - file: test/compiling_tests.cpp
    source: trompeloeil-49/test/compiling_tests.cpp
    description: >-
      Catch2 v3 self-test: 604 test cases / 1361 assertions at C++14;
      615 test cases / 1394 assertions at C++20 (coroutine cases from
      test_co_mock.cpp + micro_coro.hpp). Run unmodified on OHOS aarch64.
    command: "./build-cxx14/test/self_test and ./build-cxx20/test/self_test"

  - file: test/compiling_tests_11.cpp
    source: trompeloeil-49/test/compiling_tests_11.cpp
    description: "C++11 syntax variant of the mock tests (linked into self_test)."
    command: "(linked into self_test)"

  - file: test/compiling_tests_14.cpp
    source: trompeloeil-49/test/compiling_tests_14.cpp
    description: "C++14 syntax variant of the mock tests (linked into self_test)."
    command: "(linked into self_test)"

  - file: test/thread_terror.cpp
    source: trompeloeil-49/test/thread_terror.cpp
    description: "Multi-threaded call/return accounting stress test."
    command: "./build-cxx14/test/thread_terror"

  - file: test/custom_recursive_mutex.cpp
    source: trompeloeil-49/test/custom_recursive_mutex.cpp
    description: "Custom recursive mutex adapter smoke test (prints 'Pass!')."
    command: "./build-cxx14/test/custom_recursive_mutex"

  - file: compilation_errors/*.cpp
    source: trompeloeil-49/compilation_errors/
    description: >-
      68 expect-to-fail translation units: each must FAIL to compile and the
      diagnostic text must match the regex declared in the file
      (// pass: ...). Upstream check_errors.sh needs GNU parallel (absent on
      OHOS); conanfile.py drives the same verify_compilation_error.sh through
      a thread pool. C++14 executes 50 cases (18 excluded by upstream
      // exception: rules); C++20 executes all 68.
    command: "sh verify_compilation_error.sh <case>.cpp (CXXFLAGS -std=c++14/-std=c++20)"

test_package_tests:
  - file: test_trompeloeil.cpp
    description: >-
      Catch2 consumer test against the packaged header: RETURN stub, gt()
      matcher + TIMES, LR_SIDE_EFFECT argument observation, and
      expectation_violation raised on an unexpected call.
    command: "./test_trompeloeil"

upstream_test_case_count: 604
upstream_runtime_assertions_cxx14: 1361
upstream_runtime_assertions_cxx20: 1394
negative_compile_cases: 68
test_package_test_case_count: 4
test_package_assertion_count: 5
assertion_count: 2760
