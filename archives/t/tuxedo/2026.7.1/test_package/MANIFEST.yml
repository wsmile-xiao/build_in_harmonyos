# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制）
# 详见: docs/TEST_QUALITY_SPEC.md

package: tuxedo/2026.7.1
homepage: "https://github.com/webstonehq/tuxedo"

# 上游测试命令（cargo test 注册清单；与 conanfile.py build() 实际命令
# 保持一致：--release --locked --target <_ohos_target()> --tests）
upstream_check_command: "cargo test --release --locked --target aarch64-unknown-linux-ohos --tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cargo test --release --locked --target aarch64-unknown-linux-ohos --tests"

# 上游实际运行的测试程序（tests/snapshots.rs 集成测试 + src/ 单元测试，
# 由 cargo test 统一调度；自研/补充断言见 test_package_tests）
upstream_tests:
  - file: "（cargo test 自动注册）"
    source: "tuxedo-2026.7.1/tests/snapshots.rs + src/**"
    description: "cargo test 注册的全部上游测试（快照集成测试与单元测试，见 notes.md R51 申报表）"
    command: "cargo test --release --locked --target aarch64-unknown-linux-ohos --tests"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_tuxedo.sh
    description: "消费者测试 — 验证 tuxedo --version/--help 与 todo.txt CLI add/list/done 闭环（7 项断言）"
    command: "bash test_tuxedo.sh"
