knowledge_gained:
  - ref: E077
    text: "OHOS 上 Rust 二进制需 binary-sign-tool 自签名（cargo/rustc 及产物），未签名 ELF 被 loader 拒绝（EACCES）——复用既有知识"
  - ref: E105
    ref2: E154
    text: "rustup 无法识别 HarmonyOS 宿主，工具链必须以 rust-toolchain/1.97.1 tool_requires 提供——复用既有知识"
  - ref: E186
    text: "cargo 运行期共享库（openssl/zlib）需显式 LD_LIBRARY_PATH（OHOS loader 忽略 DT_RUNPATH）——复用既有知识"
