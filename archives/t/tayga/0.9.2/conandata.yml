patches:
  - patch_file: "patches/0001-tayga.h-ohos-skip-linux-socket.h.patch"
    patch_description: "OHOS/musl: skip linux/socket.h (sockaddr_storage redefinition with musl sys/socket.h, knowledge E091/E119) and include sys/uio.h explicitly for writev()"
    patch_type: "portability"
    sha256: "f72ef804971413305aa926fdae4491f7c1f861d893156ec212d3905aa37ba354"
  - patch_file: "patches/0002-configure-hmdfs-mktemp.patch"
    patch_description: "HMDFS: drop 'umask 077' around mktemp/mkdir in configure tmp-dir setup; chmod g-s after mktemp (built-in 0700) and chmod 700 in the no-mktemp fallback branch, so config.status can create subs1.awk inside confXXXXXX while keeping the 'secure tmp directory' semantics (knowledge E011/E052; approach as tftp-hpa 5.2)"
    patch_type: "bugfix"
    sha256: "e0aa3cf95bdfaa69ccf8073b7aa3b236770542fc69722fc32c47a770c7d8f933"
