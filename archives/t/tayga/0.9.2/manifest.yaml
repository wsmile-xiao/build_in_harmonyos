software: tayga
version: "0.9.2"
status: built
build_date: "2026-10-01"
build_system: autotools

source:
  url: "http://www.litech.org/tayga/tayga-0.9.2.tar.bz2"
  sha256: "2b1f7927a9d2dcff9095aff3c271924b052ccfd2faca9588b277431a44f0009c"
  tar_format: tar.bz2
  upstream_homepage: "http://www.litech.org/tayga/"
  note: "official upstream URL (README-stated download location); CI worker verified reachable; transiently 404 from one local network on 2026-10-01 afternoon but restored same day — identical file (same SHA256) also mirrored in Debian pool as tayga_0.9.2.orig.tar.bz2"

build:
  system: autotools
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  notes:
    - "configure.ac has no AC_CANONICAL_HOST and ships no config.guess/config.sub — no triplet detection issues on OHOS"
    - "CFLAGS hardcoded to '-g -Wall' inside configure; harmless"

patches_applied:
  - "0001-tayga.h-ohos-skip-linux-socket.h.patch"
  - "0002-configure-hmdfs-mktemp.patch"

knowledge_gained:
  - "E091/E119: linux/if.h pulls in linux/socket.h which redefines sockaddr_storage already defined by musl sys/socket.h; guard with #define _UAPI_LINUX_SOCKET_H under __OHOS__"
  - "musl headers do not pull in writev() indirectly (glibc does); explicit #include <sys/uio.h> needed under __OHOS__"

runtime_notes:
  - "daemon needs /dev/net/tun and root privileges; NAT64 data-plane cannot be exercised in test_package, only CLI smoke tests"
