software: typobuster
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/nwg-piotr/typobuster/tar.gz/refs/tags/v1.0.0"

  # 源码校验和
  sha256: "0c098645c0db6836c3c5021782c991b2ee1cd1bef3da09534db582d6b46a67c0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python setuptools package: use setup.py check then setup.py install --root=staging"
  - "Codeload URL has no filename suffix; pass filename='v1.0.0.tar.gz' to Conan get()"
  - "Pure Python package: no C/C++ compilation, conanfile.py uses sys.executable setup.py install"
  - "Target GUI runtime must provide GTK3, GtkSourceView 4, PyGObject and PyCairo"
