# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: typobuster/1.0.0
homepage: "https://github.com/nwg-piotr/typobuster"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "python3 setup.py check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 setup.py check"

# 上游实际运行的测试程序
upstream_tests:
  - file: setup.py
    source: typobuster-1.0.0/setup.py
    description: "Upstream setuptools metadata consistency check"
    command: "python3 setup.py check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_typobuster.py
    description: "Pure-Python smoke test — verifies typobuster.tools text transformations and bundled language data"
    command: "python3 test_typobuster.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
