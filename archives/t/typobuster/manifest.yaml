software: typobuster
display: "TypoBuster"
description: "轻量级 GTK3 文本编辑器，提供文本变换与拼写纠正功能（Python/GTK3 应用）"
category: editor
homepage: "https://github.com/nwg-piotr/typobuster"
license: GPL-3.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Python 应用，使用 setuptools (setup.py) 打包"
    - "Codeload URL 无文件名后缀，需向 Conan get() 显式传 filename='v1.0.0.tar.gz'"
    - "GUI 运行时需 GTK3、GtkSourceView 4、PyGObject 与 PyCairo"
  common_dependencies: []

versions:
  - version: "1.0.0"
    status: built
    build_date: "2026-08-17"
    conan_ref: "typobuster/1.0.0@ohpcd/stable"
