software: trippy
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.13.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.13.0"

# 构建系统类型
# cmake | autotools | makefile | meson | cargo | custom
build_system: cargo

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/fujiapple852/trippy/archive/refs/tags/0.13.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cargo

  # 配置选项列表
  configure_options:
    - "cargo build --release"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # Rust toolchain: rustc 1.95.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Rust workspace projects from GitHub archives need include_str! path fixes: copy referenced files to the correct relative location"
  - "trippy-config-sample.toml needs to be copied from project root to crates/trippy-tui/"
  - "README.md needs to be copied from project root to crates/trippy/"
  - "Build command: cargo build --release (binary name: trip)"
  - "Tests require CAP_NET_RAW/root privileges (skip on build environment)"
