# 版本级 manifest
# 位置: archives/t/tigr/3.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游官方 tag v3.1.0）
version: "3.1.0"

# 软件名
software: "tigr"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方 GitHub tag archive，codeload 官方归档）
