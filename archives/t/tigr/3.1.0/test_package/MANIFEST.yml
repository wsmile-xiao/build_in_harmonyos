# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tigr/3.1.0
homepage: "https://github.com/erkkah/tigr"

# 上游测试命令（tigr 为单文件库，无独立测试套件；ci/ 目录含 CI massage 程序
# ci.c，R03 以最小补丁 patches/0001-ci-headless-guard.patch 将窗口/GL/输入路径
# guard 在 #ifndef TIGR_HEADLESS 内，已在配方 build() 中编译运行；
# examples/headless 为 headless 冒烟示例，可运行）
upstream_check_command: "cd ci && ../ci_headless"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "clang -DTIGR_HEADLESS -I<src> ci/ci.c tigr.c -lm -o ci_headless && cd ci && ../ci_headless"

# 上游实际运行的测试程序
upstream_tests:
  - file: ci/ci.c
    source: tigr-3.1.0/ci/ci.c
    description: "CI massage 测试（R03 headless 版）：offscreen/Drawing API/Unicode 断言，实测 *** All tests pass OK（窗口/GL/输入路径按 TIGR_HEADLESS guard 剔除）"
    command: "cd ci && ../ci_headless"
  - file: examples/headless/headless.c
    source: tigr-3.1.0/examples/headless/headless.c
    description: "headless 冒烟示例：离屏位图绘制文字并保存 PNG（TIGR_HEADLESS，可运行）"
    command: "./headless"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tigr.c
    source: archives/t/tigr/3.1.0/test_package/test_tigr.c
    description: "消费者测试：headless 位图绘制/文字/PNG 读写全流程校验"
    command: "./test_tigr"
  - file: test_tigr_ohos.c
    source: archives/t/tigr/3.1.0/test_package/test_tigr_ohos.c
    description: "鸿蒙专项测试：__OHOS__ 平台宏、arm64 小端像素布局、tigrInflate 解压路径、64 位大位图边界"
    command: "./test_tigr_ohos"
