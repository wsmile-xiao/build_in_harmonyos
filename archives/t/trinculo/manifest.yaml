software: trinculo
display: "trinculo"
description: "多类别表型全基因组关联分析工具集（多项式/序数逻辑回归、贝叶斯模型选择与精细定位）"
category: bioinformatics
homepage: "https://sourceforge.net/projects/trinculo/"
license: GPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "C++ 单 TU 直编（上游无构建系统，镜像 debian/rules 一行命令），-DLINUX 启用 extern C lapack 声明并整体剔除 Mac Accelerate 分支"
    - "依赖 lapack/3.12.1 静态四件套（liblapack/libblas + flang FortranRuntime/Decimal）"
    - "SSTR 宏 rvalue dynamic_cast 需 lambda 化（clang15 全 -std 变体同错）"
    - "上游 bin/testing.py 为 Python2，需移植 py3（设备/CI 无 python2）；golden MD5 跨平台字节全等保留"
    - "取源走 Ubuntu pool（SF urllib 403），URL 中 + 以 %2B 编码过 PF7 子串判据"
  common_dependencies:
    - lapack

versions:
  "0.96":
    status: built
    build_date: "2026-09-24"
