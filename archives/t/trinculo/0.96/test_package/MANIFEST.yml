# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: trinculo/0.96
homepage: "https://sourceforge.net/projects/trinculo/"

# 上游测试面 = bin/testing.py（2016 Python2 驱动，已按补丁 0001 移植 py3）。
# 不进 conan build()：需沙箱 HOME + 随包 examples 相对路径，采信轮外独立跑。
upstream_check_command: "python3 bin/testing.py"
upstream_test_in_build: false
upstream_test_command: "HOME=$TASK_DIR/test-home python3 bin/testing.py（cwd=源码根，9 用例 × 3 断言）"

upstream_tests:
  - name: "1 frequentist association (plink .bed)"
    command: "trinculo multinom --bfile examples/genotypes --pheno examples/phenos.txt --phenoname Pheno --basepheno Control"
    expected: "rc=0 + .log/.assoc.multinom 存在 + assoc golden MD5 字节全等"
  - name: "2 frequentist association (dosage)"
    command: "trinculo multinom --dosage examples/genotypes.dose --pheno examples/phenos.txt --phenoname Pheno --basepheno Control"
    expected: "rc=0 + 双产物 + golden MD5（3d36d0b3d81553578ff98613999053ba）"
  - name: "3 frequentist association (covariates)"
    command: "trinculo multinom --bfile examples/genotypes --covar examples/pcs.txt ..."
    expected: "rc=0 + 双产物 + golden MD5"
  - name: "4 conditioning"
    command: "trinculo multinom ... --condition <tmp>"
    expected: "rc=0 + 双产物 + golden MD5"
  - name: "5 Bayesian (--defaultprior --normalize)"
    command: "trinculo multinom ... --normalize --defaultprior"
    expected: "rc=0 + 双产物 + golden MD5"
  - name: "6 Bayesian (--priors file)"
    command: "trinculo multinom ... --normalize --priors examples/priors.txt"
    expected: "rc=0 + 双产物 + golden MD5"
  - name: "7 model selection (--select)"
    command: "trinculo multinom ... --select"
    expected: "rc=0 + .select.multinom 存在 + golden MD5"
  - name: "8 model selection (empirical prior)"
    command: "trinculo multinom ... --empiricalprior --select"
    expected: "rc=0 + .select/.prior 存在 + golden MD5"
  - name: "9 ordinal regression"
    command: "trinculo ordinal --bfile examples/genotypes --phenoname Order --covar examples/pcs.txt"
    expected: "rc=0 + .assoc.ordinal 存在 + golden MD5"

# 消费者断言：装好的 CLI + 包内 share/trinculo/examples 真实跑
test_package_tests:
  - file: test_trinculo.py
    description: "消费已安装 trinculo：--help 冒烟、dosage/plink(.bed) 真实分析、golden MD5、同输入确定性、错误路径非零退出"
    command: "python3 test_trinculo.py <binpath> <examples_dir> <work_dir>"

# 13 = help(2) + dosage(6: rc/产物/行数/表头/MD5/log) + plink(3: rc/产物/行数) + 确定性(1) + 错误路径(1)
assertion_count: 13
