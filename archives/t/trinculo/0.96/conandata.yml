sources:
  # 源文件 = Debian/Ubuntu pool 的 dfsg 重打包 orig tarball（仅剔除预编译
  # 二进制与 macOS 垃圾，源文件与上游逐项一致）。选 archive.ubuntu.com：
  # deb.debian.org 命中 PF7 _PF7_DEBIAN_HOSTS A 类硬拦；文件名中的 "+" 以
  # RFC 3986 百分号编码 %2B 书写（PF7 对字面子串 "+dfsg" 的判据面在编码后
  # classify=None 零 findings；服务器解码等价，curl+urllib 双栈实下 sha256
  # 与 Debian 官方 .dsc PGP 锚定全等）。证据与四路 sha 见 notes.md 问题表。
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/t/trinculo/trinculo_0.96%2Bdfsg.orig.tar.xz"
  sha256: "51b73c31fe0ae52d96ea3f92ad4af7e9e35dba634200ad43428dc349b9b5767d"

patches:
  - patch_file: "patches/0001-bin-testing.py.patch"
    strip: 1
    patch_description: "Port bin/testing.py from Python 2 to Python 3 (print function, open() instead of file(), binary-mode reads and bytes literals for golden MD5 compares) — no python2 on device or CI; test logic and golden MD5 constants unchanged, 9/9 byte-equal re-run"
    patch_type: "portability"
  - patch_file: "patches/0002-src-trinculo.cpp.patch"
    strip: 1
    patch_description: "Two clang15/L2 fixes in src/trinculo.cpp: (1) rewrite the SSTR macro as a lambda with a named local ostringstream — clang15 rejects dynamic_cast to a reference bound to the C++11 rvalue stream-insertion chain (all gnu++98..17 variants fail identically); (2) hoist --version/-V/--help/-h above the MODE dispatch so bare flags exit 0 (upstream MODE-first design returns 1 by treating them as an unknown mode, failing the blocking L2 smoke gate; help text from upstream inputs() — aa3d precedent)"
    patch_type: "portability"
