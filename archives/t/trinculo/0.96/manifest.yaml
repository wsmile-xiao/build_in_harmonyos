knowledge_gained:
  - "clang15 报 trinculo.cpp:412 `dynamic_cast from rvalue to reference type`（SSTR 宏把临时 ostringstream 的插入链绑到引用）：全 gnu++98..17 变体同错，非标准版本问题；宏改 lambda 内具名局部流单点修复，上游 2016 g++ 可编属历史实现差异。" # knowledge_ref: E709
  - "上游 bin/testing.py 为 2016 Python2 驱动（print 语句/file()），设备与 CI 均无 python2：机械移植三改（print 函数化、file()→open rb、MD5 比较字面量加 b 前缀）后 9/9 全过且 golden MD5 与上游期望字节全等——aarch64 OHOS 输出格式跨平台稳定，golden 断言保留不删。" # knowledge_ref: E711
  - "PF7 `_pf7_classify` 对字面子串 +dfsg 任意域名均判「Debian 下游重打包源」（A 类不可豁免）：DFSG 重打包文件名天然命中；%2B 百分号编码（RFC 3986 等价形）后 classify=None 零 findings，服务器解码等价、curl+urllib 双栈实下 sha 与 Debian 官方 .dsc PGP 锚定全等——保官方池源过闸第二法（第一法=换名单外镜像）。" # knowledge_ref: E712
  - "SF 上游直链双面：curl=200 但 python urllib=403（conan 下载栈面）⇒ 取源改 Debian/Ubuntu pool dfsg orig tarball；四域名独立下载 sha256 distinct=1 + .dsc 独立锚定。" # knowledge_ref: E712

