version: "1.0.0"
software: "tiny-aes"
status: built
build_date: "2026-09-10"
build_system: makefile

source:
  url: "https://github.com/kokke/tiny-AES-c/archive/refs/tags/v1.0.0.tar.gz"
  sha256: "61fd99ac95df30e9ab39d6cdd41e88909b2eaf9b9806f23aa235485ac0bed2fd"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "无 configure；显式 make 目标 aes.a 与上游测试目标 test"
    - "CFLAGS 按上游 Makefile 取值 -Wall -Os -c 并追加 -fPIC"
    - "CC/AR 取自 profile tools.build:compiler_executables (hnp clang 15) 并回退到编译器同目录的 llvm-ar"
    - "CMakeLists.txt 未使用：其 cmake_minimum_required(2.8.12) 被 CMake 4.x 拒绝且无安装规则"
  dependencies: []
  cc: clang
  cxx: clang++
  parallelism: 1

patches_applied: []

knowledge_gained:
  - "tiny-AES-c 1.0.0 库源码零平台条件编译：aes.c 仅包含 stdint.h 与 string.h 无 OS/字节序分支故零补丁 (reference: archives/t/tiny-aes/1.0.0/notes.md)"
  - "上游 CMakeLists.txt 在本仓库不可用：cmake_minimum_required(2.8.12) 触发 CMake 4.x 兼容性移除错误 且 target_include_directories 指向 tarball 中不存在的 tiny-AES-c/ 子目录 且无 install 规则 因此以 raw Makefile 为主构建入口 (reference: archives/t/tiny-aes/1.0.0/notes.md)"
  - "上游 Makefile 的 CFLAGS += -DAES192/-DAES256 会被命令行 CFLAGS 覆盖 故库产物固定 AES128 默认配置 密钥长度与模式宏会改变 struct AES_ctx 布局 不宜暴露为 Conan 选项以免头文件与库 ABI 静默错配 (reference: archives/t/tiny-aes/1.0.0/notes.md)"
  - "上游测试向量已用 OpenSSL 3.6.4 独立复算核对一致 证明 test.c 的期望值是真 AES 向量而非自洽错误值 (reference: archives/t/tiny-aes/1.0.0/test_package/MANIFEST.yml)"
  - "Conan profile 用相对路径会被 $CONAN_HOME/profiles 下同名陈旧副本静默旁路 报 Invalid: 'settings.os.version' value not defined 必须传绝对路径 本模式已由他人草稿覆盖 本包直接引用不重复建草稿 (reference: knowledge/drafts/DRAFT-elfio-3.9-conan-profile-relative-path-shadowing.kv)"
  - "git [safe] 段内空值 directory = 会重置此前的 safe 累积状态 其后读取的条目仍有效 故症状是配置里已列出该路径却仍报 dubious ownership 而 E101 的追加修复因落在段尾依然有效 增量在空值判定步骤与读取顺序判据及 --add 空变量静默写入的预防 本包新建草稿 E566 (knowledge_ref: E566)"

validation:
  upstream_tests:
    command: "make CC=clang LD=clang AR=llvm-ar test"
    statistical_unit: "test.c 的验证例程 x make test 的密钥长度构建配置 = 6 x 3"
    total: 18
    passed: 18
    failed: 0
    skipped: 0
    not_run: 0
  conan_create:
    # 实跑命令原样记录（conan-verify 采信轮；<repo> 展开为
    # /storage/Users/currentUser/ws/wt-tiny-aes-1.0.0）。
    # profile 必须传绝对路径：Conan 对相对参数会先拼 $CONAN_HOME/profiles/，
    # 命中陈旧同名副本即静默旁路仓库内 profile（本机实测报
    # Invalid: 'settings.os.version' value not defined），详见 notes.md。
    command: >-
      conan create <repo>/archives/t/tiny-aes/1.0.0
      -pr:h=<repo>/ci/conan/profiles/ohos-aarch64
      -pr:b=<repo>/ci/conan/profiles/ohos-aarch64
      --build=missing --user=ohpcd --channel=stable
    profile_note: "本机 profile 必须用绝对路径（$CONAN_HOME 陈旧副本会静默旁路仓库内 profile）"
    result: passed
  test_package:
    command: "./test_tiny_aes"
    assertions: 17
    harmonyos_specific_assertions: 1
    result: passed
