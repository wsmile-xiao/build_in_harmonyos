# test_package/MANIFEST.yml — tiny-aes 1.0.0
# Upstream and consumer test declaration required by CI L0e.

package: tiny-aes/1.0.0
homepage: "https://github.com/kokke/tiny-AES-c"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "tiny-AES-c-1.0.0.tar.gz (GitHub v1.0.0 tag archive)"
  source_sha256: "61fd99ac95df30e9ab39d6cdd41e88909b2eaf9b9806f23aa235485ac0bed2fd"
  source_provenance: >
    The release tarball was cross-checked against the upstream git history: the
    v1.0.0 tag resolves to commit e72b6eff0884673997d0ca6385169bbd9b31936d and
    `diff -r` between the extracted tarball and a `git clone --branch v1.0.0`
    working tree reports no content differences.
  build_system: "Makefile (repository-root raw make; upstream primary and only working build entry)"
  test_definition: >
    Upstream ships a single self-contained test harness in test.c with no
    external test framework. `make test` is the upstream test entry: for each of
    the three key-size configurations (default AES128, then AES192=1, then
    AES256=1) it runs `make clean`, rebuilds test.elf from test.c + aes.c and
    executes it. test.elf calls six verification routines
    (test_encrypt_cbc, test_decrypt_cbc, test_encrypt_ctr, test_decrypt_ctr,
    test_decrypt_ecb, test_encrypt_ecb); each compares a computed buffer against
    a published AES known-answer vector embedded in test.c and returns 1 on
    mismatch. main() returns the sum of the six results, so any single mismatch
    makes `make test` fail with a non-zero exit status.
  test_data_provenance: >
    The vectors embedded in test.c were independently re-derived during this
    adaptation with OpenSSL 3.6.4 (AES-128 ECB/CBC/CTR) and match the values the
    upstream suite expects (ECB 3ad77bb40d7a3660a89ecaf32466ef97 for key
    2b7e151628aed2a6abf7158809cf4f3c, CBC 7649abac8119b246cee98e9b12e9197d,
    CTR 874d6191b620e3261bef6864990db6ce), so a pass here is a genuine
    correctness result and not a self-consistent-but-wrong comparison.
  dependency: "none (self-contained harness; libc only)"
  excluded_from_count: >
    test_encrypt_ecb_verbose() is a void demonstration helper: it prints the ECB
    verbose output and performs no comparison, so it contributes no assertion
    and is not counted. It is still executed by every run.
  patches_touching_tests: "none (this package applies zero patches)"

upstream_check_command: "make test (make clean + rebuild + run, three times)"
upstream_test_in_build: true
upstream_test_command: 'make CC=<clang> LD=<clang> AR=<llvm-ar> test (invoked by conanfile.py build())'

# ── Counting unit ────────────────────────────────────────────────────────────
# Declared denominator: 18 assertions = 6 verification routines in test.c x 3
# key-size build configurations driven by `make test`.
#   TOTAL  = PASS + FAIL + SKIP + NOT_RUN = 18 + 0 + 0 + 0 = 18
# Take-number command (run in the extracted upstream source tree):
#   make CC=clang LD=clang AR=llvm-ar test | grep -c 'SUCCESS!'
#     -> 18
# Equivalent exact-count command from the same run:
#   make ... test | grep -c '^Testing AES'   -> 3   (build configurations)
# Reconciliation with other possible counting units, so the reviewer can match
# its own clone of upstream without a discrepancy:
#   - verification routines in test.c (main()'s summed return): 6
#   - key-size build configurations executed by `make test`: 3
#   - routine x configuration executions actually performed: 18  <-- declared
# Not counted: test_encrypt_ecb_verbose() (no comparison, see above) and the
# per-call printf lines inside each routine (18 "SUCCESS!" lines total).
upstream_tests:
  - test_name: "test_encrypt_cbc (AES128/AES192/AES256)"
    source: "test.c -> test_encrypt_cbc()"
    kind: unit
  - test_name: "test_decrypt_cbc (AES128/AES192/AES256)"
    source: "test.c -> test_decrypt_cbc()"
    kind: unit
  - test_name: "test_encrypt_ctr (AES128/AES192/AES256)"
    source: "test.c -> test_xcrypt_ctr(\"encrypt\")"
    kind: unit
  - test_name: "test_decrypt_ctr (AES128/AES192/AES256)"
    source: "test.c -> test_xcrypt_ctr(\"decrypt\")"
    kind: unit
  - test_name: "test_decrypt_ecb (AES128/AES192/AES256)"
    source: "test.c -> test_decrypt_ecb()"
    kind: unit
  - test_name: "test_encrypt_ecb (AES128/AES192/AES256)"
    source: "test.c -> test_encrypt_ecb()"
    kind: unit

upstream_test_total: 18
upstream_test_passed: 18
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_test_not_run: 0

# Consumer-perspective checks. The consumer includes the packaged aes.h with its
# default macros (exactly how a downstream project consumes the package), links
# the packaged libtiny-aes and drives the public API.
test_package_tests:
  - file: test_tiny_aes.c
    scenario: "consumer-api"
    description: >
      Link a C consumer against the packaged library and assert: the packaged
      header defaults (AES_BLOCKLEN 16, AES_KEYLEN 16, AES_keyExpSize 176,
      CBC/ECB/CTR all enabled) and the struct AES_ctx layout they imply
      (192 bytes = 176-byte round keys + 16-byte IV); the FIPS-197 C.1 AES-128
      ECB known answer with the Appendix C.1 key in both directions; the
      NIST SP 800-38A F.1.1 AES-128 ECB known answer with the F.1.1 key in both
      directions (the same vector the upstream test.c harness asserts); the
      NIST SP 800-38A F.2.2 CBC-AES128 known answer over two chained blocks in
      both directions; the NIST SP 800-38A F.5.1 CTR-AES128 known answer plus
      CTR involution; CBC chaining of two identical blocks; AES_ctx_set_iv
      equivalence with AES_init_ctx_iv; determinism; and IV sensitivity (the
      same plaintext encrypted under two different IVs must differ, so an
      implementation that ignores the IV fails this check). Both
      ECB key/plaintext pairings are asserted on purpose: each published vector
      belongs to its own key, so mixing the two keys is caught rather than
      silently accepted. All vectors were recomputed with OpenSSL 3.6.4 before
      being frozen in the test.
    command: "./test_tiny_aes"
    assertions: 17

harmonyos_specific_tests:
  - test_name: "HarmonyOS native consumer target"
    source: "test_package/test_tiny_aes.c"
    trigger: "__OHOS__ compile-time target macro"
    description: >
      The native consumer fails unless it was compiled for the HarmonyOS target,
      so a host-built consumer result cannot be counted as OHOS package
      validation.
    assertions: 1

assertion_count: 17
