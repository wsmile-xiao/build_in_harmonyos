software: tiny-aes
display: "tiny-AES-c"
description: "小型可移植的 AES128/192/256 C 实现（ECB、CTR、CBC 三种工作模式，无外部依赖）"
category: crypto
homepage: "https://github.com/kokke/tiny-AES-c"
license: The Unlicense
build_system: makefile
ohos_adaptation:
  key_points:
    - "库源码零平台条件编译：aes.c 仅包含 stdint.h 与 string.h，OHOS 与 Linux 共用同一份源码，本包零补丁"
    - "上游 root Makefile 是唯一可用构建入口；CMakeLists.txt 的 cmake_minimum_required(2.8.12) 被 CMake 4.x 拒绝且无安装规则，不使用"
    - "库产物固定为上游默认配置 AES128 + CBC/ECB/CTR；密钥长度与模式宏会改变 struct AES_ctx 布局，作为 Conan 选项会与打包头文件产生静默 ABI 错配"
    - "上游测试入口 make test 会依次以 AES128、AES192、AES256 三种配置重建并运行 test.elf，共 18 项断言"
    - "头文件为单头 aes.h 加 C++ 包装 aes.hpp（extern \"C\" 包裹 aes.h），已随包安装"
  common_dependencies: []
versions:
  "1.0.0":
    status: built
    build_date: "2026-09-10"
    conan_ref: "tiny-aes/1.0.0"
