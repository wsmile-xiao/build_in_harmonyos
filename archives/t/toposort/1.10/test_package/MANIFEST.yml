package: toposort/1.10
homepage: "https://gitlab.com/ericvsmith/toposort"
upstream_check_command: "PYTHONPATH=src python3 test/test_toposort.py"
upstream_test_in_build: true
upstream_test_command: "PYTHONPATH=src python3 test/test_toposort.py"
upstream_tests:
