# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.5.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.5.2"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "{BUILD_SYSTEM}"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/source/t/tornado/tornado-6.5.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Python wheel 包适配模式：pip wheel --no-deps 构建 + zipfile 解包到 package/lib/python3.X/site-packages，package_type=build-scripts（Conan 2 无 python 类型，library 会触发 E216 shared option 要求），settings 必须含全部四项（os/arch/compiler/build_type）否则 W3 L0p 拦截"
  - "可选 C 加速扩展（tornado.speedups）由上游 setup.py optional=True 天然降级：不设 TORNADO_EXTENSION=0，构建失败自动回退纯 Python，test_package 报告实际状态"
  - "test_package 消费者脚本写临时 .py 文件执行，避免 shell 引号包装多行 -c 片段；站点目录经 conf_info user.tornado:sitedir 传递给消费者"
  - "上游 1222 例套件设备原生 38s 跑完：3 error 全为沙箱限制（unix socket bind EPERM×2、ExpectLog 日志顺序×1）已豁免，57 skipped 为上游显式 skipif"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
