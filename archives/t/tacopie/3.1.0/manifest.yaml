# 版本级 manifest
# 文件位置: archives/t/tacopie/3.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "3.1.0"

# 软件名
software: tacopie

# 编译状态
# published | built | failed | archived
status: "built"

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 3.1.0）
  url: "https://github.com/Cylix/tacopie/archive/refs/tags/3.1.0.tar.gz"

  # 源码校验和（2026-09-17 实测下载值）
  sha256: "6072fdd991778bd3a549bcada9a220b18a2388ef4af345e75f371f3bd8f050ce"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游 CMake）
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTS=OFF"
    - "-DBUILD_EXAMPLES=OFF"

  # 编译依赖列表（库本体无第三方依赖，仅 C++11；测试期 gtest 由上游
  # ExternalProject 拉取，配方不发布上游测试目标）
  dependencies: []

  # 编译器（OHOS aarch64 工具链，clang 15）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-fix-connect-select-nfds.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "select() nfds 语义错误：非阻塞 connect 用 select(0,...) 等待可写必超时，应传 m_fd+1（E543 草稿，跨库可复用）"
  - "tacopie tcp_server 连接回调返回 true 时 server 不持有客户端，异步回调须按值捕获 client shared_ptr 保持连接存活"