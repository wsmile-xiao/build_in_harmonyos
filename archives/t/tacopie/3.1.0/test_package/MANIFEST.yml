# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tacopie/3.1.0
homepage: "https://github.com/Cylix/tacopie"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build . --target tacopie_tests; ./tacopie_tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (官方 3.1.0 tag 未携带独立 TEST_CASE 声明；
# 仅 tests/sources/main.cpp gtest runner。实测链接 gtest 1.17.0 运行: 0 tests, PASSED)
upstream_tests:
  - file: tests/sources/main.cpp
    source: tacopie-3.1.0/tests/sources/main.cpp
    description: "gtest runner 主函数（tag 内无 spec 用例源，0 个 TEST_CASE 声明）"
    command: "./tacopie_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tacopie.cpp
    description: "消费者测试: tcp_server/tcp_client 真实回环往返（async_read/async_write 校验 payload）"
    command: "./test_tacopie"
  - file: test_tacopie_hmos.cpp
    description: "HarmonyOS 专项: OHOS tcp_server bind + loopback connect/read/write + io_service 清理路径"
    command: "./test_tacopie_hmos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
