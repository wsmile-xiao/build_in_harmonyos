# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tdlib/1.8.0
homepage: "https://github.com/tdlib/td"

# 上游存在完整测试框架: test/ 目录下的自研 td::TestsRunner 框架,
# 通过 test/CMakeLists.txt 的 add_test(run_all_tests run_all_tests)
# 注册到 CTest (唯一注册项), 另有 3 个 EXCLUDE_FROM_ALL 测试程序。
upstream_tests_exist: true
upstream_check_command: "ctest --output-on-failure"

# 配方 build() 不执行上游测试套件 (全套约 8 分钟且含 mtproto 真实网络用例,
# 不适合放进每次 conan create)。本次适配已在 OHOS 上实际执行完整套件,
# 逐用例台账见 notes.md 与 reports/test-report.md。
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure  # -> run_all_tests"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/CMakeLists.txt
    source: td-1.8.0/test/
    description: "run_all_tests (CTest 注册项 id=1) — tdlib 自研测试框架, 213 个用例 (210 个 TEST 宏 + 3 个 RegisterTest), OHOS 上编入 208 个并全部通过"
    command: "ctest --output-on-failure"
  - file: test/CMakeLists.txt
    source: td-1.8.0/test/
    description: "test-tdutils (EXCLUDE_FROM_ALL) — tdutils 子集, 109 个用例, 全部通过"
    command: "./test-tdutils"
  - file: test/CMakeLists.txt
    source: td-1.8.0/test/
    description: "test-crypto (EXCLUDE_FROM_ALL) — 独立 crypto 演示程序 (无 TestsRunner 计数), 端到端运行 exit 0"
    command: "./test-crypto"
  - file: test/CMakeLists.txt
    source: td-1.8.0/test/
    description: "test-online (EXCLUDE_FROM_ALL) — 交互式真实 Telegram 客户端测试器, 需要 my.telegram.org 申请的 api-id/api-hash, 本环境无法提供凭据, 未执行 (上游设计如此, 非失败)"
    command: "./test-online"

# test_package 中自带的测试 (消费者视角验证, 实质调用 tdlib 公共 JSON/C API)
test_package_tests:
  - file: test_tdlib.cpp
    description: "链接已打包的 libtdjson.so (Td::TdJson): OHOS 动态加载 + dladdr 溯源 + gperf MIME 表 + 文本实体 + 完整 TDLib 客户端版本 (23 条断言, 其中鸿蒙专有 14 条 = OH-1 动态加载 7 + OH-2 产物溯源 2 + OH-3 gperf MIME 表 5)"
    command: "./test_tdlib"

# 测试断言总数 (上游声明用例数 213 + test_package 断言 23)
assertion_count: 236
