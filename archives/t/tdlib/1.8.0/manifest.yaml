# 版本级 manifest — tdlib 1.8.0（ARCHIVE-SPEC v2.0）
version: "1.8.0"
software: "tdlib"
status: built
build_date: "2026-09-24"
build_system: cmake

source:
  url: "https://github.com/tdlib/td/archive/refs/tags/v1.8.0.tar.gz"
  sha256: "30d560205fe82fb811cd57a8fcbc7ac853a5b6195e9cb9e6ff142f5e2d8be217"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"          # CMake 4.x 拒绝 cmake_minimum_required(<3.5)
    - "CXXFLAGS += -Wno-register"                    # gperf 生成表含 register，C++17 下为错误
    - "-DOPENSSL_FOUND=TRUE / OPENSSL_ROOT_DIR / OPENSSL_INCLUDE_DIR / OPENSSL_CRYPTO_LIBRARY / OPENSSL_SSL_LIBRARY"
    - "-DCMAKE_USER_MAKE_RULES_OVERRIDE_{C,CXX}=<ohos shares-lib soname rules>"
  dependencies:
    - openssl/3.5.6
    - zlib/1.3.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS: CMake 4.x 移除 cmake_minimum_required(<3.5) 兼容；CMAKE_POLICY_VERSION_MINIMUM 放在 conan toolchain 里无效（toolchain 在首个 project() 才被读取，晚于 CMakeLists.txt:1），必须走 configure 命令行 -D"
  - "OHOS: conan profile 固定 compiler.cppstd=17，而上游自加 -std=c++14 且 CMake 把标准开关放在最后；gperf 生成的 MIME 表含 register 在 C++17 下被 clang 判为错误（-Wregister），需 -Wno-register"
  - "OHOS: tdlib 只认经典 FindOpenSSL 变量名（OPENSSL_FOUND/OPENSSL_INCLUDE_DIR/OPENSSL_CRYPTO_LIBRARY/OPENSSL_SSL_LIBRARY），Conan CMakeDeps 只产出小写 openssl_*；需在 generate() 里接线（zlib 无需，ZLIBConfig.cmake 已带大写变量）"
  - "OHOS: CMake 无 HarmonyOS 平台模块 → CMAKE_SHARED_LIBRARY_SONAME_<LANG>_FLAG 为空，共享库无 DT_SONAME、导出的 TdTargets.cmake 带 IMPORTED_NO_SONAME；用 CMAKE_USER_MAKE_RULES_OVERRIDE_{C,CXX} 恢复 -Wl,-soname,"
  - "OHOS: conan 的 VirtualRunEnv 只对 package_type=shared-library/application 注入 LD_LIBRARY_PATH；需要跑共享库消费者的 test_package 应改用 CMAKE_BUILD_RPATH + 平台 RPATH 规则（cpr 范式）"
  - "OHOS: Conan profile 不设置 CMAKE_SYSTEM_NAME → CMAKE_CROSSCOMPILING=FALSE，上游 test/ 与 tg_cli 被正常构建，可在设备上原生跑完整测试套件"
