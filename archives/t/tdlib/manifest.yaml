software: tdlib
display: "TDLib"
description: "Cross-platform client library for Telegram (C++14, JSON/C API)"
category: net
homepage: "https://github.com/tdlib/td"
license: BSL-1.0
build_system: cmake
ohos_adaptation:
  key_points:
    - "OHOS: CMake 4.x removed cmake_minimum_required(<3.5); pass -DCMAKE_POLICY_VERSION_MINIMUM=3.5 on the configure command line (a Conan toolchain variable is applied too late — CMake reads the toolchain only at the first project())"
    - "OHOS: Conan profile pins compiler.cppstd=17 while upstream appends -std=c++14; CMake puts the standard flag last, so gperf-generated MIME tables ('register') fail under C++17. Inject -Wno-register via tc.extra_cxxflags"
    - "OHOS: tdlib uses the classic OPENSSL_FOUND/OPENSSL_INCLUDE_DIR/OPENSSL_CRYPTO_LIBRARY/OPENSSL_SSL_LIBRARY variables; Conan CMakeDeps only defines lowercase openssl_*. Wire the classic names to the Conan package (static libcrypto.a/libssl.a); zlib needs no wiring (its package generates ZLIBConfig.cmake)"
    - "Deps from conan: openssl/3.5.6 (pinned ohpcd recipe revision 748fc4de...) + zlib/1.3.2, both mandatory upstream"
    - "No upstream source patched (patches/ empty)"
versions:
  "1.8.0":
    status: built
    build_date: "2026-09-24"
    packaging: conan
    notes: "conan recipe (os=OHOS arch=armv8, clang 15, libc++); CMake build; upstream run_all_tests 208/208 on device, test-tdutils 109/109, test-crypto exit 0"
    dependencies:
      - openssl/3.5.6
      - zlib/1.3.2
