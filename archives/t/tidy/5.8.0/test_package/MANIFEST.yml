# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: tidy/5.8.0
homepage: "https://github.com/htacg/tidy-html5"

# 上游回归套件（regression_testing/）驱动为 Ruby（Gemfile + test.rb）。
# 平台无 Ruby/bundler，故以 POSIX sh 1:1 复刻 test.rb 的用例语义（同一
# 命令行、同一通过判据：期望退出码 + expected html diff + expected 消息
# diff，见 test_upstream_regression.sh），在设备真机用交付的 tidy 5.8.0
# 二进制全量执行：
#   regression_testing/cases/ 共 645 个文件（access 240 / github 43 /
#   legacy 306 / xml 56），其中 391 个为可执行用例（case-*@*，带期望退
#   出码），其余 254 个为用例配套 config；391 个用例全部执行，
#   391 通过 / 0 失败（access 119、github 22、legacy 223、xml 27）。
upstream_check_command: "TIDY_BIN=<tidy> CASES_DIR=<regression_testing/cases> sh test_upstream_regression.sh"
upstream_test_in_build: false
upstream_test_command: "真机已执行：391/391 通过（复刻驱动 test_upstream_regression.sh，证据见 PR 描述）"

upstream_tests:
  - file: "regression_testing/cases/access-cases (case-*@*)"
    description: "access 套件可执行用例 119 个，真机全部执行，119 通过 / 0 失败"
  - file: "regression_testing/cases/github-cases (case-*@*)"
    description: "github 套件可执行用例 22 个，真机全部执行，22 通过 / 0 失败"
  - file: "regression_testing/cases/legacy-cases (case-*@*)"
    description: "legacy 套件可执行用例 223 个，真机全部执行，223 通过 / 0 失败"
  - file: "regression_testing/cases/xml-cases (case-*@*)"
    description: "xml 套件可执行用例 27 个，真机全部执行，27 通过 / 0 失败"
  - file: "test_package/test_upstream_regression.sh"
    description: >-
      上游套件驱动的 POSIX sh 复刻（test.rb 语义 1:1）。CI 不自动执行
      （需上游源码树与 tidy 产物，非 test_package 环境），真机执行证据
      见 PR 描述。

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_tidy.c
    description: >-
      库级消费者测试（4 项断言）：tidyCreate/tidySetCharEncoding（1）、
      内存解析合法文档（2）、cleanAndRepair 后输出含 <html>（3）、
      合法文档错误计数为 0（4）。失败即非零退出。
  - file: test_package/test_tidy_cli.sh
    description: >-
      CLI 消费者测试（3 项断言）：tidy -version 输出含 HTML Tidy（1）；
      干净文档 -errors 退出 0（2）；破损文档非零退出且有诊断输出（3）。
