software: tcpkali
display: "tcpkali"
description: "高性能 TCP/WebSocket 负载测试工具，基于 libev 事件循环库"
category: network
homepage: "https://github.com/MumiaiGene/tcpkali"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "OHOS musl libc 缺少 sys/sysctl.h，需用 #ifdef HAVE_SYS_SYSCTL_H 守卫"
    - "OHOS musl libc sys/queue.h 缺少 __containerof/QUEUE_TYPEOF 宏，需补充定义"
    - "源码 tarball 无预生成 configure，需 autoreconf -fi"
    - "ncurses 静态链接（系统预编译），NEED 仅 libc.so"
  common_dependencies:
    - ncurses

versions:
  "1.1.1":
    status: published
    build_date: "2026-06-17"
