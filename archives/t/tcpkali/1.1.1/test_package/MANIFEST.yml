# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tcpkali/1.1.1
homepage: https://github.com/MumiaiGene/tcpkali

# 上游测试命令
# tcpkali 没有标准的 make check 测试套件
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "tcpkali --version smoke test"
    command: "sh test.sh"

# 测试断言总数 (近似值)
assertion_count: 1
