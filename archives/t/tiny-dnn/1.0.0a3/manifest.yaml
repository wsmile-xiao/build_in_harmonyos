version: "1.0.0a3"
software: tiny-dnn
status: built
build_date: "2026-09-20"
conan_ref: "tiny-dnn/1.0.0a3"
build_system: header-only（上游 CMakeLists 是 add_library(tiny_dnn INTERFACE)，无编译产物）

source:
  url: "https://github.com/tiny-dnn/tiny-dnn/archive/refs/tags/v1.0.0a3.tar.gz"
  sha256: "e2c61ce8c5debaa644121179e9dbdcf83f497f39de853f8dd5175846505aa18b"
  tar_format: tar.gz
  note: "标签名带 v 前缀（v1.0.0a3），无 v 前缀的 1.0.0a3 返回 404/HTML"

build:
  system: header-only
  configure_options:
    - "test_requires gtest/1.17.0#ab1bc3bf51522490eef07a83c2dbd203（上游 test/CMakeLists.txt 用 DownloadProject 在 configure 期联网拉 googletest master，CI worker 不可用）"
    - "-std=c++17（上游声明 C++11，但 gtest 1.15+ 要求 C++14/17；tiny-dnn 源码零改动）"
    - "-Wno-unused-value（上游 test/test_serialization.h:430 的 `s1 << (f2, f3) << c4;` 是逗号运算符笔误；只压这一条，不改上游源码）"
  dependencies: []
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "tiny-dnn 1.0.0a3 是 header-only（上游 CMakeLists.txt 里 add_library(tiny_dnn INTERFACE)），但**头文件布局必须整棵发运**：tiny_dnn/ 内部的 #include 同时使用 <cereal/...>（角括号，需 include 根）与 \"third_party/...\"（相对 include 根），而上游 CMake 的 install(DIRECTORY .../tiny_dnn ...) **只装 tiny_dnn/**，cereal/ 与 third_party/ 缺失。本包把三棵目录并排装进同一个 include 根，消费者只需一个 -I（ref: conanfile.py package()）"
  - "上游测试只有一个 gtest 可执行文件（test/test.cpp + test/test_no_duplicate_symbols.cpp），且 test/CMakeLists.txt 用 DownloadProject 在 configure 期从 GitHub 拉 googletest（GIT_TAG master）——CI worker 不可联网。改用 Conan 已发布的 gtest/1.17.0 直接编译实跑（ref: conanfile.py build()）"
  - "test/test.cpp 用 #include \"test_xxx.h\" 把 24 个测试头全部编进同一个 TU；钉版 v1.0.0a3 的 test/ 朴素文本扫描为 267 个 TEST( 宏，但实际注册进 gtest 的只有 199 个（clang++ -E -P 预处理后统计 `class *_Test : public ::testing::Test` 为 198，+test_no_duplicate_symbols.cpp 的 1）。差额 68 全部可归因：test_average_unpooling_layer.h 4（test.cpp:41 上游自行注释，TODO(yida)）+ test_caffe_converter.h 14（#ifdef CNN_USE_CAFFE_CONVERTER 门控，需 Caffe protobuf）+ 50 处位于未启用 #ifdef 分支内的 TEST( 宏（test_deconvolutional_layer.h 11、test_quantized_convolutional_layer.h 8、test_quantized_deconvolutional_layer.h 8、test_quantized_fully_connected_layer.h 5 落在 #ifdef CNN_USE_NNPACK 里，test_convolutional_layer.h 11 落在 #ifdef CNN_USE_AVX/NNPACK 里）"
  - "test/testhelper.h 的 resolve_path() 依次试 \"\"/\"./test/\"/\"../test/\"…，因此 test_image 等用例的测试二进制必须在**含 test/testimage/ 的目录**（即源码根）下运行；本包 build() 内以 cwd=source_folder 执行（ref: conanfile.py build()）"
  - "tiny_dnn/config.h:80 在非 MSVC/非 Windows 平台无条件 #define CNN_USE_GEMMLOWP；aarch64/OHOS 命中的是内置 gemmlowp 的 int8 量化路径，core::default_engine() 退化为 backend_t::internal（无 AVX）。两者都是平台相关的可观测行为（ref: test_package/test_tiny_dnn.cpp 组 5）"
  - "tiny-dnn 的批训练用 CNN_TASK_SIZE 个任务走 std::thread（无 OpenMP 时 CNN_TASK_SIZE=8），OHOS 的 bionic 上必须可用；固定随机种子 + n_threads=1 的结果在 OHOS 上逐位可复现（ref: test_package/test_tiny_dnn.cpp 组 6）"
