# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）

package: tiny-dnn/1.0.0a3
homepage: "https://github.com/tiny-dnn/tiny-dnn"

# 上游没有 make test 的独立入口：test/CMakeLists.txt 用 CMake 的
# DownloadProject 在 configure 期从 GitHub 拉 googletest（GIT_TAG master），
# 再编出唯一一个 gtest 可执行文件 tiny_dnn_test。
upstream_check_command: "cmake -S . -B build -DBUILD_TESTS=ON && cmake --build build && ./build/test/tiny_dnn_test"

# conanfile.py build() 已集成上游测试：用 Conan 的 gtest/1.17.0 替代
# DownloadProject（CI worker 不可联网），编 test.cpp + test_no_duplicate_symbols.cpp
# 并在 build() 内实跑，硬校验汇总行。
upstream_test_in_build: true
upstream_test_command: "./tiny_dnn_test  (cwd=source root；gtest 汇总行要求 passed==ran 且 ran>=180)"

upstream_tests:
  - file: "test/test.cpp"
    source: "tiny-dnn-1.0.0a3/test/test.cpp"
    description: "唯一测试 TU，用 #include \"test_xxx.h\" 编入 24 个测试头（tensor 36 / image 27 / network 31 / convolutional 19 / serialization 14 / max_pooling 12 / quantization 10 / target_cost 7 / average_pooling 7 / fully_connected 6 / core 5 / nodes 4 / batchnorm 3 / lrn 2 / dropout 2 / slice 2 / power 2 / quantized_convolutional 2 / quantized_deconvolutional 2 / quantized_fully_connected 2 / concat 1 / models 1 / large_thread_count 1，注册数），实跑 198 例"
    command: "./tiny_dnn_test --gtest_filter='*'"
  - file: "test/test_no_duplicate_symbols.cpp"
    source: "tiny-dnn-1.0.0a3/test/test_no_duplicate_symbols.cpp"
    description: "独立的第二个 TU，1 个用例 test_no_duplicate_symbols：把 tiny_dnn/tiny_dnn.h 在另一个翻译单元里再包一次，验证头文件只有声明、无重复符号（header-only 库的关键契约）"
    command: "./tiny_dnn_test --gtest_filter='no_duplicate_symbols.*'"

# 钉版 test/ 下的另外两个文件不在默认构建里：
#   - test_average_unpooling_layer.h（4 个 TEST）：test.cpp:41 被上游自己注释掉
#     （// TODO(yida): fix broken test），默认构建不编译。
#   - test_caffe_converter.h（14 个 TEST）：#ifdef CNN_USE_CAFFE_CONVERTER 门控，
#     需要 Caffe 的 protobuf 工具链。
# 另有两组被 #ifdef 屏蔽的用例（test_deconvolutional_layer.h 11、
# test_quantized_*.h 21、test_convolutional_layer.h 11 等共 50 处）落在
# CNN_USE_NNPACK（Intel CPU 加速后端）/ CNN_USE_AVX（x86 指令集）分支内，
# aarch64/OHOS 上不适用。三者在 body 的「未执行说明」里逐条列出。

test_package_tests:
  - file: test_tiny_dnn.cpp
    description: "消费者测试 6 组：include 根三树可见性 + float_t/CNN_TASK_SIZE 平台宽度；MLP 在 XOR 上训练后 4/4 分类正确；conv+ave_pool+fc 前向形状；序列化双路（to_json/from_json 架构往返 + weights_and_model JSON 往返逐位保住预测）；鸿蒙特有 A —— aarch64 上 default_engine()==internal 且 gemmlowp 量化路径启用、q_conv 元数据契约；鸿蒙特有 B —— 固定种子 n_threads=1 逐位可复现 + n_threads=CNN_TASK_SIZE 在 bionic std::thread 上跑通"
    command: "./test_tiny_dnn"

# 上游可执行部分的注册用例数（本包 build() 内实跑）
upstream_test_count: 199

# 消费者测试断言组数
assertion_count: 6
