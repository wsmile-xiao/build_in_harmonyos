# test_package/MANIFEST.yml
# 上游官方测试声明文件 — tinyformat 2.3.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

# 包信息
package: tinyformat/2.3.0
homepage: "https://github.com/c42f/tinyformat"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# 上游 Makefile test 目标：运行 cxx98 与 cxx11 两个变体
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tinyformat_test.cpp
    source: tinyformat-2.3.0/tinyformat_test.cpp
    description: "单元测试（CHECK_EQUAL/EXPECT_ERROR 断言，~120 断言；C++98 与 C++11 双变体实测通过）"
    command: "./tinyformat_test_cxx11 && ./tinyformat_test_cxx98"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：include <tinyformat.h>，断言 tfm::format/printf/位置参数/精度宽度"
    command: "./test_tinyformat"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 120