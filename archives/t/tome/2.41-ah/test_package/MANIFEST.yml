# test_package/MANIFEST.yml
# tome 2.41-ah - upstream test declaration.

package: tome/2.41-ah
homepage: "https://github.com/tome2/tome2"

upstream_tests_exist: true
upstream_test_audit: >-
  Upstream builds a Bandit BDD test harness (src/harness from tests/harness.cc
  plus tests/flag_set.cc, tests/grid.cc, tests/lua_get_level.cc,
  tests/get_level_device.cc and the vendored CppQuickCheck arbitrary for
  boost::optional).  The harness links only the headless core (game, squelch)
  and needs no display.  It is built unconditionally by src/CMakeLists.txt.
  Run: `harness --reporter=spec` -> "Test run complete. 44 tests run.
  44 succeeded." (44 = flag_set 10 + grid 4 + lua_get_level 12 +
  get_level_device 18).  There is no CTest integration upstream.
upstream_check_command: "src/harness --reporter=spec"
upstream_test_in_build: true
upstream_test_command: "src/harness --reporter=spec"
upstream_tests:
  - file: "tests/harness.cc + tests/{flag_set,grid,lua_get_level,get_level_device}.cc"
    description: "Bandit BDD suite over the game-engine core (44 test cases)"

test_package_tests:
  - file: test_tome.cpp
    description: "C++ consumer: exercises the installed flag_set<> and grid<> public headers (16 assertions)"
    command: "clang++ test_tome.cpp -lgame -lsquelch && ./test_tome"

test_files:
  - path: "test_package/test_tome.cpp"
    test_type: "R34"
    assertion_count: 16

test_package_test_count: 1
consumer_assertion_count: 16
upstream_test_cases: 44
assertion_count: 16
