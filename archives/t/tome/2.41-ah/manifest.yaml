version: "2.41-ah"
software: "tome"
status: built
build_date: "2026-09-26"
build_system: "cmake"

source:
  url: "https://deb.debian.org/debian/pool/non-free/t/tome/tome_2.41-ah~0.git.20200131.orig.tar.gz"
  sha256: "d031a3a89cce0f379d92ddaf9d53b4aae6ee0c47b81aaf3b0d700b2ab0375385"
  tar_format: tar.gz
  note: >-
    上游 github.com/tome2/tome2 无 2.41-ah 标签（该版本号为源码内字符串），
    且 Debian 快照把 vendor 子模块（fmt/jsoncons/pcg-cpp/bandit/CppQuickCheck）
    一并打包；官方 codeload 归档不含子模块内容，故采用 Debian 同版本 orig tarball。

build:
  system: cmake
  configure_options:
    - "-DCMAKE_DISABLE_FIND_PACKAGE_X11=TRUE"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_GTK2=TRUE"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_Curses=TRUE"
  dependencies:
    - "boost/1.85.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-init1-add-cstdio.patch"
  - "patches/0002-squelch-condition-add-map.patch"
  - "patches/0003-cppquickcheck-random-shuffle-cxx17.patch"

knowledge_gained:
  - "上游为 CMake C++17 工程；核心引擎是 game + squelch 两个静态库，前端（X11/GTK2/ncurses）仅薄显示层，可用 CMAKE_DISABLE_FIND_PACKAGE_* 关闭"
  - "强制依赖 Boost(system,filesystem)：Conan 2 必须显式启用 CMakeDeps 生成器，否则 find_package(Boost) 落到系统模块模式、Boost_FOUND 假但 PATH 无头文件"
  - "vendored CppQuickCheck 使用已被 C++17 移除的 std::random_shuffle → 最小补丁改 std::shuffle(rng)"
  - "Debian orig tarball 内含 vendor 子模块的符号链接（vendor/fmt→fmt-4.1.0 等），Windows 解压会丢，Linux/CI 正常"
  - "上游 Bandit 测试可非交互运行：`harness --reporter=spec` → Test run complete. 44 tests run. 44 succeeded."
