software: tome
display: "tome"
description: "Tales of Middle Earth（Angband/Moria 衍生的 roguelike）游戏引擎核心"
category: library
homepage: "https://github.com/tome2/tome2"
license: "ToME/Angband license (see README.md)"
build_system: cmake

ohos_adaptation:
  key_points:
    - "关闭 X11/GTK2/ncurses 三个可选前端，只构建无头引擎 game + squelch 静态库"
    - "强制依赖 Boost(system,filesystem)；必须显式启用 CMakeDeps 生成器，否则 find_package(Boost) 走系统模块模式找不到头文件"
    - "vendored CppQuickCheck 的 std::random_shuffle 在 C++17 被移除 → 改 std::shuffle；另补 <cstdio>/<map> 两处缺头"
    - "上游 Bandit 测试可非交互跑：harness --reporter=spec → 44/44"
  common_dependencies:
    - "boost/1.85.0"

versions:
  - version: "2.41-ah"
    status: built
    build_date: "2026-09-26"
