software: texlive
display: "TeX Live"
description: "Comprehensive TeX typesetting system distribution (tex, pdftex, xetex, luatex, metapost, mf, dvisvgm, etc.)"
category: typesetting
homepage: "https://www.tug.org/texlive/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "HMDFS E046: configure 测试程序无法执行 (SELinux)，需 patch 跳过 AC_TRY_RUN"
    - "E007: config.guess 不识别 HarmonyOS，需映射到 Linux"
    - "E165: shebang #!/bin/bash 不存在，需修复为 HarmonyOS 路径"
    - "umask 077 导致 HMDFS 文件权限过严，需改为 umask 002"
    - "rpath + LD_LIBRARY_PATH: 构建工具 (如 GMP gen-bases) 需要 conan 共享库运行时路径"
    - "getpass() 在 HarmonyOS 不可用，需为 dvipdfm-x 添加实现"
    - "xetex 链接需要 -lexpat (系统 fontconfig.a 使用 expat)"
  common_dependencies:
    - "fontconfig"

versions:
  "20260301":
    status: built
    build_date: "2026-08-21"
