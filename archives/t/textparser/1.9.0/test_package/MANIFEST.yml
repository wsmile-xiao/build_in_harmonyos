package: textparser/1.9.0
homepage: "https://github.com/avr-aics-riken/TextParser"

# Upstream test audit (source: master HEAD 31ec1f2, code-identical to tag
# 1.8.8; tag 1.9.0 does not exist upstream, see notes.md). With
# -Denable_test=yes the top-level CMakeLists adds Examples/ which registers
# ctest cases: 8 serial C++ examples (test_cpp_1..8) + 6 serial C examples
# (test_c_1..5, test_c_7) = 14 cases. MPI (2 cases) and Fortran (6 cases)
# variants are disabled in this recipe (with_MPI=no, enable_fapi=no).
upstream_tests_exist: true
upstream_test_audit: "Examples/CMakeLists.txt registers 8 serial C++ ctest cases (test_cpp_1 to test_cpp_8) and 6 serial C ctest cases (test_c_1..5, test_c_7); total 14 with enable_test=yes, with_MPI=no, enable_fapi=no"
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: "Examples/Example1_cpp.cpp"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C++ read/write roundtrip (test_cpp_1)"
    command: "ctest -R test_cpp_1"
  - file: "Examples/Example2_cpp.cpp"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C++ correct/incorrect fixture sweep (test_cpp_2)"
    command: "ctest -R test_cpp_2"
  - file: "Examples/Example3_cpp.cpp"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C++ parameter read (test_cpp_3)"
    command: "ctest -R test_cpp_3"
  - file: "Examples/Example4_cpp.cpp"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C++ label enumeration (test_cpp_4)"
    command: "ctest -R test_cpp_4"
  - file: "Examples/Example5_cpp.cpp"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C++ node traversal (test_cpp_5)"
    command: "ctest -R test_cpp_5"
  - file: "Examples/Example6_cpp.cpp"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C++ value inspection (test_cpp_6)"
    command: "ctest -R test_cpp_6"
  - file: "Examples/Example7_cpp.cpp"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C++ conditional expressions (test_cpp_7)"
    command: "ctest -R test_cpp_7"
  - file: "Examples/Example8_cpp.cpp"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C++ range/list values (test_cpp_8)"
    command: "ctest -R test_cpp_8"
  - file: "Examples/Example1_c.c"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C API read/write roundtrip (test_c_1)"
    command: "ctest -R test_c_1"
  - file: "Examples/Example2_c.c"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C API fixture sweep (test_c_2)"
    command: "ctest -R test_c_2"
  - file: "Examples/Example3_c.c"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C API parameter read (test_c_3)"
    command: "ctest -R test_c_3"
  - file: "Examples/Example4_c.c"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C API label enumeration (test_c_4)"
    command: "ctest -R test_c_4"
  - file: "Examples/Example5_c.c"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C API node traversal (test_c_5)"
    command: "ctest -R test_c_5"
  - file: "Examples/Example7_c.c"
    source: "TextParser master HEAD 31ec1f2 / Examples"
    description: "Serial C API conditional expressions (test_c_7)"
    command: "ctest -R test_c_7"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer API test: singleton, TP_VERSION 1.9.0, fixture read, getAllLabels/getValue, changeNode+getLabels, write roundtrip, remove (8 checks)"
    command: "ctest --output-on-failure"

assertion_count: 8
