sources:
  "1.9.0":
    # Upstream publishes no 1.9.0 tag (latest tag is 1.8.8); this pins the
    # post-1.8.8 master HEAD (commit 31ec1f2, code-identical to tag 1.8.8).
    # Official GitHub source (R39). See notes.md for the audit trail.
    url: "https://github.com/avr-aics-riken/TextParser/archive/31ec1f23df21611d0765c27a6458fdbbf4cde66d.tar.gz"
    sha256: "76912fc1506d121f9f2a74496b5dc481c4be2f389f6000f442a2befc2a8f92ce"
patches:
  "1.9.0":
    - patch_file: "patches/0001-update-cmake-minimum-version.patch"
      patch_description: "0001 update CMake minimum version from 2.6 to 3.15"
      patch_type: "portability"
    - patch_file: "patches/0002-bump-version-to-1.9.0.patch"
      patch_description: "0002 bump PROJECT_VERSION from 1.8.8 to 1.9.0"
      patch_type: "portability"
    - patch_file: "patches/0004-fix-uninit-and-tailspace.patch"
      patch_description: "0004 init getType return value; fix unsigned wraparound in TextParserRemoveTailSpaces"
      patch_type: "bugfix"
    - patch_file: "patches/0005-fix-examples-build-order.patch"
      patch_description: "0005 enforce Examples->TP build order for parallel make"
      patch_type: "portability"
