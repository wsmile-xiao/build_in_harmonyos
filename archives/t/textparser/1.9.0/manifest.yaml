# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9.0"

# 软件名
software: "textparser"

# 编译状态
# published | built | failed | archived
status: "built"

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub；上游无 1.9.0 tag，锁定 post-1.8.8 master HEAD，见 notes.md）
  url: "https://github.com/avr-aics-riken/TextParser/archive/31ec1f23df21611d0765c27a6458fdbbf4cde66d.tar.gz"

  # 源码校验和
  sha256: "76912fc1506d121f9f2a74496b5dc481c4be2f389f6000f442a2befc2a8f92ce"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-Denable_fapi=OFF"
    - "-Denable_test=ON"
    - "-Dwith_MPI=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-update-cmake-minimum-version.patch"
  - "0002-bump-version-to-1.9.0.patch"
  - "0004-fix-uninit-and-tailspace.patch"
  # Note: negative-test assertion fix (ex-0003 intent) is applied
  # programmatically in conanfile.py::_fix_negative_tests (byte-level),
  # not as a patch file, after unified-diff 0003 twice failed to apply
  # on the preflight host. See notes.md.

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "TextParser 是 YAML-like 文本参数解析库，无外部依赖"
  - "支持 C、C++ 和 Fortran API（OHOS 仅启用串行 C/C++，禁用 MPI 与 Fortran）"
  - "使用 Singleton 模式实现"
  - "许可证：BSD-2-Clause"
  - "需要补丁更新 CMake 最低版本从 2.6 到 3.15"
  - "上游无 1.9.0 tag；配方锁定 post-1.8.8 master HEAD 并补丁 bump 版本"
  - "主要 API: TextParser::get_instance_singleton(), read(), getLabels(), getValue(), write(), remove()"
  - "生成静态库 libTP.a，对外 target textparser::textparser"
  - "上游 ctest 套件 14 例（8 C++ + 6 C 串行 Example），out-of-source 构建需把 tpp_examples 数据拷贝到 BUILD/Examples"
  - "上游测试实测计数待真机预检回填"
