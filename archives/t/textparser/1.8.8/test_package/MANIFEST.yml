# test_package MANIFEST.yml
# 声明上游测试来源

# 上游构建系统
build_system: cmake

# 测试类型
# - unit: 单元测试
# - integration: 集成测试  
# - example: 示例程序
# - custom: 自定义测试
test_type: custom

# 上游测试来源说明
upstream_test_source: |
  上游 TextParser 在 Examples/ 目录提供了 3 个集成测试示例程序：
  - sample_input.C: 读取测试
  - sample_output_NonUni.C: 非均匀网格输出测试
  - sample_output_Uni.C: 均匀网格输出测试
  
  这些测试需要 MPI 环境和实际数据文件，在交叉编译环境下无法运行。

# 适配说明
adaptation_note: |
  本 test_package 为自定义 API 可访问性测试，验证：
  1. TextParser singleton 实例可以成功创建
  2. 版本宏 TP_VERSION 和 TP_REVISION 可访问
  3. status() 方法可以调用
  
  测试不依赖外部数据文件，适合交叉编译验证。

# 与上游测试的关系
# - reuse: 直接复用上游测试
# - adapt: 适配上游测试
# - custom: 自定义测试（上游测试不可用）
test_origin: custom

# 为什么不使用上游测试
upstream_test_unavailable_reason: |
  上游测试依赖 MPI 环境和运行时数据文件，交叉编译环境无法满足。
  因此创建了轻量级 API 测试验证库的基本功能。
