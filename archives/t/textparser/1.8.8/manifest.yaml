# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.8"

# 软件名
software: "textparser"

# 编译状态
# published | built | failed | archived
status: "built"

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/avr-aics-riken/TextParser/archive/refs/tags/1.8.8.tar.gz"

  # 源码校验和
  sha256: "ff87020943fdd1b9ead3c7e461fe364adc7651b87d57bce8e004ab7f82375194"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-Denable_fapi=OFF"
    - "-Denable_test=OFF"
    - "-Dwith_MPI=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-update-cmake-minimum-version.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "TextParser 是 YAML-like 文本参数解析库，无外部依赖"
  - "支持 C、C++ 和 Fortran API（Fortran 可选）"
  - "使用 Singleton 模式实现"
  - "许可证：BSD-2-Clause"
  - "需要补丁更新 CMake 最低版本从 2.6 到 3.15"
  - "OHOS 平台需要设置 compiler.libcxx=c++_shared"
  - "主要 API: TextParser::get_instance_singleton(), read(), getValue()"
  - "生成静态库 libTP.a"
