# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: tk
display: "Tk (GUI Toolkit for Tcl)"
description: "Tcl 的图形界面工具包；HarmonyOS PC 提供动态 libtcl9tk9.0，依赖 tcl"
category: library
homepage: "https://www.tcl-lang.org"
license: TCL

build_system: autotools

ohos_adaptation:
  key_points:
    - "9.0.3.1 产动态 libtcl9tk9.0.so，依赖 tcl/9.0.3.1@ohpcd/stable：configure --with-tcl 指向 tcl 包 libdir（找 tclConfig.sh）+ AutotoolsDeps 注入 tcl 的 -I/-L/-l"
    - "--disable-zipfs 出干净 .so（避免脚本库 zip 尾拼破坏链接器自签）；脚本库散文件 + TK_LIBRARY"
    - "系统识别 uname shim + tcl_cv_sys_version=Linux-6.6；umask 077→022（E011）"

  common_dependencies:
    - "tcl/9.0.3.1@ohpcd/stable"

versions:
  "9.0.3.1":
    status: built
