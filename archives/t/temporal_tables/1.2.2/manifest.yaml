software: temporal_tables
# 版本级 manifest
# 文件位置: archives/t/temporal_tables/1.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/arkhipov/temporal_tables/archive/refs/tags/v1.2.2.tar.gz"

  # 源码校验和
  sha256: "85517266748a438ab140147cb70d238ca19ad14c5d7acd6007c520d378db662e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pg_config 16.4 不支持 --pkgincludedir 选项，需创建 wrapper 脚本拦截该选项"
  - "PGXS Makefile.global 通过 $(pkgincludedir)/server 和 $(pkgincludedir)/internal 构造 include 路径，需在自定义路径下创建符号链接"
  - "Conan 2.12 无 conan.tools.make 模块，Makefile 项目需用 AutotoolsToolchain + self.run() 替代"
  - "PostgreSQL 扩展的 Conan 配方需在 package() 中复制头文件，否则 test_package CMake 找不到 include 目录"
