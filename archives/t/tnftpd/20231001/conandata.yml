# conandata.yml — tnftpd 20231001
# 源码：NetBSD 官方 tnftp 发行站点（tnftpd = NetBSD FTP daemon 的移植版）
# 仅官方单值 URL，无镜像前缀（R39 官方源）
sources:
  url: "https://cdn.netbsd.org/pub/NetBSD/misc/tnftp/tnftpd-20231001.tar.gz"
  sha256: "24a51bd2e5818ddb8c2479df9c8175a78dd8a5ef49ee3ab09f5f39c35069826e"

patches:
  - patch_file: "patches/0001-config.guess-ohos.patch"
    patch_description: >-
      config.guess（timestamp 2018-03-08）不识别 uname -s=HarmonyOS
      （HongMeng Kernel / aarch64）。configure 因 LT_INIT 内部调用
      AC_CANONICAL_HOST 而必跑 config.guess+config.sub，不补丁则起手报
      "cannot guess build type"。加 HarmonyOS 分支输出
      aarch64-unknown-linux-ohos（本版 config.guess 的 case 风格是
      echo ...; exit ;;，与 radvd 同源先例）。
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-ohos.patch"
    patch_description: >-
      config.sub（timestamp 2018-05-05）的 KERNEL-OS 组合表与 OS 后缀表
      均不含 ohos，会把 aarch64-unknown-linux-ohos 判为
      "Invalid configuration ... system `ohos' not recognized"。
      补入 linux-ohos* / -linux-ohos* 后 .config.sub 原样输出、RC=0。
    patch_type: "portability"
  - patch_file: "patches/0003-configure-hmdfs-umask.patch"
    patch_description: >-
      HMDFS 上 configure 以 `(umask 077 && mktemp -d "./confXXXXXX")` 建的
      临时目录不可写（写 subs1.awk 报 Permission denied）⇒ "config.status:
      could not setup config files machinery"（E011/E112/E114 家族；
      libradsec/avfs/autocutsel 同法）。把 mktemp 换成 false 强制走 mkdir
      fallback，并把两处 umask 077 → 022，让 mkdir 建的 ./conf$-$RANDOM
      可写、config.status 能正常写入（本项目唯一的 autoconf 临时目录块，
      同时被 configure 运行时与生成的 config.status 复用 $ac_tmp）。
    patch_type: "portability"
