# test_package/MANIFEST.yml
# tnftpd 20231001
# 上游官方测试声明：tnftpd 无任何上游测试套件（逐文件审计确认）。
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。

package: tnftpd/20231001
homepage: "https://www.NetBSD.org/"

upstream_tests_exist: false
upstream_test_audit: >-
  逐文件审计 tnftpd-20231001 源码包（配置源面，未解压亦可由自带的
  Makefile.am / Makefile.in / configure.ac 确认）：
  1) Makefile.am（顶层含 SUBDIRS=examples libnetbsd ls src）与
     src/Makefile.am、ls/Makefile.am、libnetbsd/Makefile.am、examples/Makefile.am
     全文均无 TESTS、check_PROGRAMS、AM_TESTS、XFAIL 等 automake 测试变量；
  2) 源码树无 test/、tests/、regress/ 等测试目录型入口，find 不到任何 test 源文件；
  3) configure.ac 无 AC_ARG_ENABLE(enable-tests) / AC_PROG_test 相关宏，
     Makefile.in 的 check 目标仅为空操作的 `check-am: all-am`（只重建不跑用例）；
  4) 无 gtest / autotest / pytest / 自定义测试脚本或 harness。
  ⇒ 上游不提供任何测试框架，无 make check，upstream_test_total = 0。

upstream_test_total: 0
upstream_test_count_method: "none"  # 上游无任何可声明的测试框架/计数口径
reason: "tnftpd 20231001 无上游测试套件（无 test 目录、无 TESTS/check 目标、无 gtest 绑定），已逐文件审计确认。"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 消费者验证（R34: 真实执行被适配的 tnftpd 二进制）
test_package_tests:
  - file: test.sh
    description: "离线确定性断言：①bin/tnftpd 存在 ②可执行 ③ELF 魔数校验 ④`tnftpd -C <bogus-user>` 访问检查自终止（rc 0/1，证明二进制加载、解析参数、跑 sgetpwnam/checkaccess 不挂起不崩溃）。守护进程不在此起监听端口。"
    command: "sh test.sh <bindir>"

# 断言总数近似值（消费者 4 项确定性断言）
assertion_count: 4
