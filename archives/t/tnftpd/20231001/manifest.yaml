# 版本级 manifest — tnftpd 20231001
# 遵循 ARCHIVE-SPEC v2.0

version: "20231001"
software: "tnftpd"
status: built
build_date: "2026-09-30"
build_system: autotools
conan_ref: "tnftpd/20231001"

source:
  url: "https://cdn.netbsd.org/pub/NetBSD/misc/tnftp/tnftpd-20231001.tar.gz"
  sha256: "24a51bd2e5818ddb8c2479df9c8175a78dd8a5ef49ee3ab09f5f39c35069826e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-pam"
    - "--without-skey"
    - "--without-sia"
    - "--with-blocklist=no"
  dependencies: []  # 无运行时/链接期 conan 依赖（自包含 daemon）
  build_tools:
    - bison/3.8.2  # tool_require：ftpcmd.c 由 ftpcmd.y 现场生成
  cc: clang
  upstream_test_command: ""  # 上游无测试框架

patches_applied:
  - "0001-config.guess-ohos.patch"
  - "0002-config.sub-ohos.patch"
  - "0003-configure-hmdfs-umask.patch"

knowledge_gained:
  - "tnftpd release 包自带 configure（无需 autoreconf），但 ftpcmd.c 由 ftpcmd.y 现场生成 ⇒ bison/yacc 是硬性构建期依赖（configure 的 AC_PROG_YACC 找不到就报 missing bison or yacc）"
  - "configure 因 LT_INIT() 内部调用 AC_CANONICAL_HOST 必跑 config.guess/config.sub；2018 版 config.guess 不识别 uname -s=HarmonyOS、config.sub 不认 ohos ⇒ 需 0001/0002 补丁（radvd 同款，同为 echo...exit;; 风格）"
  - "configure/config.status 的 umask 077 && mktemp -d ./confXXXXXX 在 HMDFS setgid 目录下不可写，且该 FS 上 mktemp 派生 fork 失败（unsafe_local_mktemp；E011/E112/E114 家族）⇒ 0003 补丁把 mktemp 换成 false 强制走 mkdir fallback + umask 077→022（libradsec/avfs/autocutsel 同法）"
  - "HMDFS 构建环境需统一可写 TMPDIR/TMP/TEMP + PWD 钉到 build_folder + SHELL/CONFIG_SHELL=/bin/sh（getcwd 失败回落 $PWD；apertium/radvd 同法）"
  - "tnftpd 是 libexec_PROGRAMS，默认装 $prefix/libexec；package() 将其重命名到 $prefix/bin 便于 PATH 与消费者测试"
  - "私有 libnetbsd.la / libls.la 为 noinst_LTLIBRARIES 不会被安装，tnftpd 静态链接它们成为自包含二进制"
  - "可选 PAM/S/Key/blocklist 认证在 OHOS 制品仓未发布，显式 --without-* 禁用保证确定性（daemon 走 Unix passwd 认证即可）"
  - "上游无任何测试套件（无 test/、TESTS、check 目标），消费者测试用自终止的 -C <user> 访问检查 + ELF/可执行校验"

upstream_tests_exist: false
upstream_test_audit: >-
  逐项审计 tnftpd-20231001 源码包：src/、ls/、libnetbsd/、examples/ 各
  Makefile.am 均无 TESTS / check_PROGRAMS / AM_TESTS，无 test/ 或 tests/
  目录，configure.ac 无 AC_ARG_ENABLE(enable-tests)/AC_PROG test 宏，
  Makefile.in 的 check 目标仅为空操作的 `check-am: all-am`（只重建不跑任何
  用例）。无 gtest / autotest / 自定义测试脚本。官方仓库发布包同样不含任
  何测试。故上游无测试框架，无 make check，upstream_test_total = 0。
reason: "tnftpd 20231001 上游无任何测试套件（无 test 目录、无 TESTS/check 目标、无 gtest 绑定），已逐文件审计确认。"
