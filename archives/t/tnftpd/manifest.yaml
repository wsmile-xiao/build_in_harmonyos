# 软件级 manifest — tnftpd
# 遵循 ARCHIVE-SPEC v2.0

software: tnftpd
display: "tnftpd"
description: "NetBSD FTP 服务端守护进程的移植版（lukemftpd），供 inetd 调用，支持 IPv6、ftpusers/ftpd.conf 访问控制"
category: network
homepage: "https://www.NetBSD.org/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 因 LT_INIT 必跑 config.guess（2018 版不认 uname -s=HarmonyOS）⇒ 0001 补丁加 HarmonyOS 分支"
    - "config.sub 2018 版 OS 白名单不含 ohos ⇒ 0002 补丁补 linux-ohos*（native 编译，R1 不传 --build/--host/--target）"
    - "configure 的 umask 077 && mktemp -d 在 HMDFS setgid 目录不可写（E011/E112/E114）⇒ 0003 补丁改 umask 022"
    - "ftpcmd.c 由 ftpcmd.y 现场生成 ⇒ bison/3.8.2 为 tool_requires"
    - "可选 PAM/S/Key/blocklist 认证 OHOS 未发布，--without-* 显式禁用"
    - "libexec_PROGRAMS 默认装 $prefix/libexec ⇒ --libexecdir=$prefix/bin 归一化"
    - "上游无测试套件，消费者测试用自终止 -C <user> 访问检查 + ELF 校验"
  common_dependencies:
    - bison (tool_requires)

versions:
  "20231001":
    status: built
    build_date: "2026-09-30"
    conan_ref: "tnftpd/20231001"
