version: "4.3"
software: tua
status: built
build_date: "2026-09-30"
build_system: autotools
conan_ref: "tua/4.3"

source:
  # 上游原站 stone.trew.it/~lele/（作者 Lele Gaifax）已失效（域名停用），
  # 无 salsa.debian.org 维护仓库；采用 Debian 官方源码归档 pool 的 orig tarball
  # （SHA256 与 tua_4.3-17.dsc 的 Checksums-Sha256 一致）。
  url: "https://deb.debian.org/debian/pool/main/t/tua/tua_4.3.orig.tar.gz"
  sha256: "aaf2b40e34e0e4056f127720286287ecf3dfa8fc7ef234dd9c1d3e5ac3b2baba"
  tar_format: tar.gz

build:
  system: autotools
  # --prefix 由 Conan AutotoolsToolchain 生成；NLS 必须关闭（归档不含 intl/）。
  configure_options:
    - "--disable-nls"
  dependencies: []
  cc: clang

patches_applied:
  - "0001-Makefile.in.patch"
  - "0002-configure.patch"
  - "0003-lib-Makefile.in.patch"
  - "0004-src-Makefile.in.patch"
  - "0005-src-tua.c.patch"
  - "0006-src-tua.h.patch"

knowledge_gained:
  - "Debian 重打包的 orig tarball 删除了 intl/ 后，随包 configure 在 --disable-nls 路径下仍会链接 intl/libgettext.h 并以 'configure: error: ./intl/libgettext.h: File not found' 退出；需中和 nls_cv_header_intl/libgt 别名。knowledge_ref: E027"
  - "OHOS SDK 的链接期 libc.so 是 stub，nm 查不到 gettext/textdomain/bindtextdomain（运行期 /lib/ld-musl-aarch64.so.1 才导出）；因此 NLS 程序应以 --disable-nls 构建，避免依赖 stub 中不存在的符号。knowledge_ref: E027"
  - "musl 系的 <libintl.h> 为空壳（不声明 gettext），而 libc 导出 gettext → 直接用该符号需自行声明或关闭 NLS。knowledge_ref: E027"
  - "clang 15 不再把 __FUNCTION__ 当作字符串字面量（无法用于字面量拼接），老代码的 LOG/__FUNCTION__ 模式需改为 __func__ 实参"
  - "老 autoconf(2.4) 生成的 Makefile.in 不支持 out-of-source 构建（install/recursive 规则写死 $(top_srcdir)/config.status），须就地构建"
  - "上游 1996 年的 install 规则不使用 $(DESTDIR)，conan 封包需以 make 变量覆写 prefix 定位到包目录。knowledge_ref: E317"
  - "install 目标经直接路径调用 mkinstalldirs helper 时，若 helper 无可执行位会报 'Error 127: Permission denied'；改为 $(SHELL) <helper> 调用即可。knowledge_ref: E108"
  - "本机沙箱下 clang 在 conan（python 子进程树）中会静默失败（rc=1、无任何输出、不产出 .o）；须以脱离会话的后台方式（nohup + disown，启动命令立即返回）运行 conan 才能正常编译。knowledge_ref: E219"

