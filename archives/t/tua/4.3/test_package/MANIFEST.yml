# test_package/MANIFEST.yml
# 上游/消费者测试声明（CI build_and_test.sh L0e 强制要求本文件存在）
package: tua/4.3
homepage: "https://sources.debian.org/src/tua/"

# 上游测试入口（make check 的分析口径）
upstream_check_command: "make check"

# ── 上游测试清点（R51 三步法）────────────────────────────────────
# 上游 tua 4.3（1996）没有任何自动化测试基础设施：
#   * 无 tests/ / test/ 目录（find 全树无匹配）
#   * 无 ctest / meson / pytest 入口；无 Makefile.am（autoconf 2.4 手写 Makefile.in）
#   * 唯一的“测试”入口是顶层 Makefile.in 的 check 目标：
#         check: all
#                 ./tua
#     即在无参数下运行刚构建出的程序本身——无任何断言，且需要本机存在
#     真实的 Taylor UUCP spool（Log / Stats）才能正常结束。
#   实测：`make check` 退出码 2，输出 “TUA (read_stats_log): cannot open
#   /usr/local/spool/uucp/Stats” → “Error in processing stats”
#   （因测试环境无 UUCP 安装，非构建缺陷）。
# 结论：上游无自动化测试、无上游样例数据文件；消费者侧验证由 test_package
# 提供（合成本地 spool，实质运行被测二进制并断言报表内容）。
upstream_test_in_build: false
upstream_test_command: "make check  (== ./tua ; 无断言, 需真实 UUCP spool)"
upstream_tests_total: 0
upstream_tests_passed: 0
upstream_tests_failed: 0
upstream_tests_skipped: 0
upstream_tests_skipped_reason: >-
  上游 tua 4.3 全树无自动化测试（无 tests/ 目录、无 TESTS 声明、无
  ctest/meson/pytest 入口），顶层 `make check` 只是无断言地运行 ./tua，
  且需依赖真实 Taylor UUCP spool 数据（测试环境不存在）；上游亦无样例数据，
  故无可运行的上游用例。

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 消费者侧测试
test_package_tests:
  - file: test_tua.sh
    description: >-
      tua 真实功能测试：构造合成 Taylor UUCP spool（Stats + Log），运行被测
      二进制，校验版本横幅、用法、按系统/用户报表、字节量统计、系统别名、
      only-system 过滤、小时活动图、国家费率输出，以及【鸿蒙特有】产物
      AArch64 OHOS ELF（magic/class/EM_AARCH64 + musl 解释器）断言
    command: "bash test_tua.sh <bin_dir>"

# 测试用例统计（test_package）
test_case_count: 10
test_case_ohos_specific_count: 1
test_case_names:
  - TC-01-version            # tua -V 版本横幅
  - TC-02-usage              # tua -i 用法
  - TC-03-system-report      # 按系统报表（解析合成 Stats/Log）
  - TC-04-bytes              # 字节量统计
  - TC-05-user-report        # 按用户报表
  - TC-06-system-alias       # -s 别名替换
  - TC-07-only-system        # -O 过滤
  - TC-08-hourly-chart       # -o 小时活动图
  - TC-09-print-country      # --print-country 费率配置
  - TC-10-ohos-abi           # 鸿蒙特有：AArch64 OHOS ELF + musl 解释器

# 断言总数（check() 调用数，见 test_tua.sh）
assertion_count: 22
