# conandata.yml — tua 4.3 (The UUCP Analyzer)
#
# 源码来源：Debian 官方源码归档 pool（deb.debian.org）。
#   tua 上游作者 Lele Gaifax 的原始发布站点 stone.trew.it 已失效（域名停用），
#   亦无 salsa.debian.org 维护仓库；Debian pool 的 tua_4.3.orig.tar.gz 是当前
#   唯一权威可获取的上游源码归档，SHA256 与 Debian .dsc 的 Checksums-Sha256 一致。
#   注意：该 orig 由 Debian 重新打包（删除 intl/、src/getopt.[ch]、src/alloca.c、
#   doc/tua.1l），随包 configure/Makefile.in 仍引用它们，故 patches/ 中做等价修复。
sources:
  url: "https://deb.debian.org/debian/pool/main/t/tua/tua_4.3.orig.tar.gz"
  sha256: "aaf2b40e34e0e4056f127720286287ecf3dfa8fc7ef234dd9c1d3e5ac3b2baba"

patches:
  - patch_file: "patches/0001-Makefile.in.patch"
    patch_description: "Drop the doc/ subdirectory from SUBDIRS: the documentation targets need makeinfo/texi2dvi (absent from the toolchain) and the man page source doc/tua.1l was removed by the repackage"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "Do not emit the gettext header symlink steps for the removed intl/ directory (the repackaged source ships no intl/libgettext.h, which made configure abort)"
    patch_type: "portability"
  - patch_file: "patches/0003-lib-Makefile.in.patch"
    patch_description: "Run the mkinstalldirs helper through $(SHELL) so install works when the copied helper script is not directly executable"
    patch_type: "portability"
  - patch_file: "patches/0004-src-Makefile.in.patch"
    patch_description: "Use the C library getopt_long(), drop the removed getopt.c/getopt.h/alloca.c from OBJECTS/SOURCES, and run mkinstalldirs through $(SHELL)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-tua.c.patch"
    patch_description: "Include <locale.h> explicitly (previously pulled in by the bundled intl header) and guard the gettext domain setup behind ENABLE_NLS"
    patch_type: "portability"
  - patch_file: "patches/0006-src-tua.h.patch"
    patch_description: "Replace the private intl/libgettext.h include with the public gettext API, make _( ) a no-op when NLS is disabled, and use __func__ in the LOG() macro (clang no longer treats __FUNCTION__ as a string literal)"
    patch_type: "portability"
