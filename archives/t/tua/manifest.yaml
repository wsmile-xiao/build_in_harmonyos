software: tua
display: "TUA (The UUCP Analyzer)"
description: "解析 Taylor UUCP 的 Log/Stats 日志，输出按系统、用户、日期、小时维度的 UUCP 流量与费用报表"
category: utility
homepage: "https://sources.debian.org/src/tua/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "源码归档为 Debian 重打包版（删除 intl/、src/getopt.[ch]、src/alloca.c、doc/tua.1l），随包 configure/Makefile.in 仍引用它们 → 补丁做等价修复"
    - "使用 --disable-nls 构建：intl/ 缺失，gettext 运行期由 OHOS libc 提供；tua.h 的 _( ) 在无 NLS 时退化为恒等映射"
    - "LOG() 宏原先用 __FUNCTION__ 做字符串拼接，clang 已不作为字面量 → 改用 __func__"
    - "--disable-nls 下 configure 仍会尝试链接已删除的 intl 头，需中和 intl 头别名（补丁 0002）"
    - "产物为 bin/tua 命令行工具（R38：软件级 commands.json 已声明）"
  common_dependencies: []

versions:
  "4.3":
    status: built
    build_date: "2026-09-30"
    conan_ref: "tua/4.3"
    source_url: "https://deb.debian.org/debian/pool/main/t/tua/tua_4.3.orig.tar.gz"
    build_system: autotools
    configure_options:
      - "--disable-nls"
    notes:
      - "无第三方链接依赖（仅 OHOS libc）；bison/3.8.2 为构建期工具（生成 pcdl_gram.c）"
      - "6 个可移植性补丁（见 4.3/manifest.yaml patches_applied）"
      - "消费者测试 22 项全通过（含 2 项鸿蒙特有 AArch64 OHOS ELF + musl 解释器断言）"
