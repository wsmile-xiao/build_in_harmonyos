software: tiger
display: "tiger"
description: "Tiger - UNIX/Linux 安全审计与入侵检测工具集，含 tiger/tigexp/tigercron 与 5 个 C 辅助工具"
category: security
homepage: "https://savannah.nongnu.org/projects/tiger/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游为 Autotools 变体：预生成 configure（Autoconf 2.69）+ 手写 Makefile.in，无 automake/CMake/meson"
    - "Makefile 不支持 VPATH，必须 in-source 构建（basic_layout src_folder='.', build_folder='.'）"
    - "E165: configure 与全部安装脚本的 #!/bin/sh 在 OHOS 上不存在，需改写为 /system/bin/sh（构建期探测，不硬编码）"
    - "make(1) 忽略环境变量 SHELL，而 Makefile.in 写死 SHELL = /bin/sh，必须用命令行 SHELL=<可用 shell>"
    - "LP64 正确性: c/md5.c 与 c/snefru.c 的 32 位字长被写成 unsigned long int，aarch64 上是 64 位，摘要会算错，补丁固定为 uint32_t"
    - "命令查找: tigexp 与 util/genmsgidx 的 findcmd() 写死 /usr/ucb:/usr/bin:/bin:/etc:/usr/etc，OHOS 需追加 /system/bin，否则 make 生成 explain.idx 直接失败"
    - "E129: configure/config.status 的 umask 077 在 HMDFS 上生成不可写目录，改写为 umask 022"
    - "profile 的 CONFIG_SHELL=/data/service/hnp/bin/bash 在 CI shell 中不一定可执行，配方改用本机可用 POSIX shell"
    - "上游无测试套件（三份 Makefile 均无 check 目标），验证依赖 test_package 的 11 条功能断言"
    - "运行期限制: tiger 主流程与平台配置仍写死 Linux FHS 路径（PATH=/sbin:/usr/sbin:/bin:/usr/bin、/etc/passwd、/var/log 等），完整检查流程需要后续新增 OHOS 平台配置"
    - "R38: 产物含可执行文件，软件级目录提供 commands.json"
  common_dependencies: []

versions:
  "3.2.4":
    status: built
    build_date: "2026-09-30"
    conan_ref: "tiger/3.2.4"
    notes: "真机 HarmonyOS aarch64: L0/L1/L2/L4/L5 全 pass, test_package 11/11; RUN_ID tiger-3.2.4-tiger-3.2.4-build-conan-20260930-161758-52502"
