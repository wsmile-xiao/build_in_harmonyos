# conandata.yml — tiger 3.2.4
#
# 源码为上游 Savannah 官方发布制品。3.2.4 系列只有 rc1 一个发布文件：
# 上游 git 标签止于 version_3_2_3，从未打过 3.2.4 正式版，
# 因此 tiger_3.2.4rc1.tar.gz 就是 3.2.4 的官方发布物。
# 该 tarball 与 Debian orig 源码包 (tiger_3.2.4~rc1.orig.tar.gz) 字节一致：
#   md5    169207ac9c211983a7ef9d19c1e5b3cb
#   sha256 91b259da8f0d3f6244f815c2b067ea4433b9ae378308ce63c2eb60b93efe7f96
sources:
  url: "https://download.savannah.nongnu.org/releases/tiger/tiger_3.2.4rc1.tar.gz"
  sha256: "91b259da8f0d3f6244f815c2b067ea4433b9ae378308ce63c2eb60b93efe7f96"

patches:
  - patch_file: "patches/0001-use-32bit-hash-word-types.patch"
    patch_description: >-
      Pin the bundled RSAREF MD5 (c/md5.c) and Snefru (c/snefru.c) 32-bit word
      types to uint32_t; `unsigned long int` is 64 bits wide on LP64 targets
      such as aarch64 HarmonyOS, which silently corrupts every digest.
    patch_type: "portability"
  - patch_file: "patches/0002-find-posix-tools-in-system-bin.patch"
    patch_description: >-
      Append /system/bin to the hardcoded command search paths used by tigexp
      and util/genmsgidx; HarmonyOS has no /bin, so without this genmsgidx
      cannot build doc/explain.idx (make fails) and tigexp cannot find grep.
    patch_type: "portability"
