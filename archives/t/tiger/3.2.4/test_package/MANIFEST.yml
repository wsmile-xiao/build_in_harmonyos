# test_package/MANIFEST.yml — tiger 3.2.4
# CI L0e requires this file to exist (see docs/TEST_QUALITY_SPEC.md).

package: tiger/3.2.4
homepage: "https://savannah.nongnu.org/projects/tiger/"

# tiger has no upstream test suite: the top level Makefile only implements
# all / install / clean / distclean, there is no `check` target and the tree
# ships no test programs (`util/consistency-check` is an operator helper, not a
# test harness).  Verified with `grep -n '^check' Makefile.in c/Makefile.in
# doc/Makefile.in` -> no match.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs are registered.
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_tiger.sh
    description: >-
      Installs the package and exercises the real artifacts: installation
      layout, the shebang interpreters of bin/{tiger,tigexp,tigercron},
      the five c/ helper binaries (RFC 1321 MD5 vectors and the Snefru vector
      documented in c/snefru.c, realpath, getpermit), the message explanation
      lookup of tigexp through the generated doc/explain.idx, and the
      `tiger -h` / `tiger -v` entry points.
    command: "sh test_tiger.sh <package_folder>"

# 11 assertions: layout, shebang, helpers, md5 x2, snefru, realpath, getpermit,
# tigexp, tiger -h, tiger -v
assertion_count: 11
