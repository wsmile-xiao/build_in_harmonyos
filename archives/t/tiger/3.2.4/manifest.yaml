# 版本级 manifest — tiger 3.2.4
# 文件位置: archives/t/tiger/3.2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC（status 允许值: published | built | failed | archived）

software: tiger
version: "3.2.4"

# 真机（HarmonyOS aarch64）conan create + test_package + L0–L5 已全部通过，
# 尚未 conan upload → built。
# 证据: $HOME/ohos-test-runs/tiger-3.2.4-tiger-3.2.4-build-conan-20260930-161758-52502
#       (exit 0, L0/L1/L2/L4/L5 = pass 全绿, test_package 11/11 断言通过)
status: built
build_date: "2026-09-30"
build_system: autotools

source:
  url: "https://download.savannah.nongnu.org/releases/tiger/tiger_3.2.4rc1.tar.gz"
  sha256: "91b259da8f0d3f6244f815c2b067ea4433b9ae378308ce63c2eb60b93efe7f96"
  tar_format: tar.gz
  notes: >-
    3.2.4 系列唯一官方发布物是 tiger_3.2.4rc1.tar.gz（上游 git 标签止于
    version_3_2_3，从未发布最终 3.2.4）。该文件与 Debian orig 源码包
    tiger_3.2.4~rc1.orig.tar.gz 完全一致（md5 169207ac9c211983a7ef9d19c1e5b3cb）。

build:
  system: autotools
  # AutotoolsToolchain 默认追加 --prefix=/，其余路径在配方中显式指定
  configure_options:
    - "--with-tigerhome=/share/tiger"
    - "--with-tigerbin=/bin"
    - "--with-tigerconfig=/etc/tiger"
    - "--with-tigerwork=/var/tiger/run"
    - "--with-tigerlog=/var/tiger/log"
    - "--mandir=/share/man"
  # W0: tiger 只链接 libc，无 Conan 依赖
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-use-32bit-hash-word-types.patch"
  - "0002-find-posix-tools-in-system-bin.patch"

knowledge_gained:
  - "tiger 的 c/md5.c 与 c/snefru.c 把 32 位字长写成 `unsigned long int`；aarch64/LP64 上该类型是 64 位，会静默产出错误摘要（本地已用 32/64 位对照实验复现）。"
  - "tiger 的工具查找函数 findcmd() 把搜索路径写死为 /usr/ucb:/usr/bin:/bin:/etc:/usr/etc，OHOS 无 /bin，需要补 /system/bin，否则 make 阶段 doc/explain.idx 无法生成、tigexp 无法运行。"
  - "tiger 的 Makefile.in/doc/Makefile.in 不支持 VPATH，必须在源码目录内构建（basic_layout build_folder=\".\"）。"
  - "configure 由 autoconf 2.69 预生成，第一行是 `#! /bin/sh`，OHOS 需改写为 /system/bin/sh（E165）。"
  - "上游 tarball 自带 install.sh（shtool install），因此 AC_PROG_INSTALL 在没有 GNU install 时仍有回退路径，不需要额外 shim。"
  - "make(1) 不接受环境变量 SHELL，Makefile.in 又写死 SHELL = /bin/sh，必须在命令行传 SHELL=<可用 shell>。"
  - "configure/config.status 的 umask 077 在 HMDFS 上会产生 drwx--S--- 目录（E129），需改写为 umask 022。"
  - "tiger 上游没有测试套件（三份 Makefile 均无 check 目标），验证只能依赖 test_package 的功能冒烟。"
