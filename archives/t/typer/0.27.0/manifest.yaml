software: typer
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.27.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.27.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-31"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/fastapi/typer/archive/refs/tags/0.27.0.tar.gz"

  # 源码校验和
  sha256: "56499ec64292780d030d2948156572c3052b3f09ff14d7d49d6973745cf779d5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "pip install --target=install"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "python/3.10"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "typer is a pure Python package"
  - "Requires Python >= 3.10"
  - "Built using pip install --target"
  - "Main dependencies: click, rich, shellingham, annotated-doc"