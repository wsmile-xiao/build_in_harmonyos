software: typer
# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: typer

# 软件描述
description: Typer, build great CLIs. Easy to code. Based on Python type hints.

# 上游仓库
homepage: https://github.com/fastapi/typer

# 许可证
license: MIT

# 构建系统
build_system: pip

# 分类
category: cli

# ============================================================
# 版本信息
# ============================================================

versions:
  "0.27.0":
    status: built
    build_date: "2026-07-31"

# ============================================================
# OHOS 适配信息
# ============================================================

ohos_adaptation:
  key_points:
    - "typer 是纯 Python 包，无需编译"
    - "使用 pip install --no-deps --target 构建"
    - "依赖 click, rich, shellingham, annotated-doc（需要单独适配）"
  common_dependencies:
    - python3