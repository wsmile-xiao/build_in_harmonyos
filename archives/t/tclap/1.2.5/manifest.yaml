# 编译中学到的知识
knowledge_gained:
  - "header-only 库的上游测试面可直接接进 conan build()：autoreconf → configure → make → make check，91 项在 G2 内真实执行"
  - "HMDFS /tmp 只读会让 test_wrapper 的 std::tmpnam 全线失败（比较前就死），临时文件改走 $TMPDIR 即恢复"
  - "tool_requires autoconf 会连带 perl/5.42.2，其线程版 XS 的 PERL5LIB 被 HNP 非线程 perl 读到即 Perl_my_cxt_init 符号失配；正解=只 tool_requires automake/1.18 并把 PERL5LIB 收窄到 automake share # knowledge_ref: E749"
