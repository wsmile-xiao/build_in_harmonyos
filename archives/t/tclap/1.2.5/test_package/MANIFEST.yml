# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tclap/1.2.5
homepage: "https://github.com/mirror/tclap"

# 上游测试命令（上游 tests/Makefile.am 的 automake 并行测试：make check →
#   tests/test1.sh .. test91.sh，逐个调 ./test_wrapper 比对 tests/testN.out）
upstream_check_command: "make check (autotools: autoreconf -fi && ./configure && make && make check)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "配方 build() 在 build 目录复刻源码后 autoreconf -fi → ./configure CC/CXX 取自 conf → make（编译 30 个 examples = header 编译面）→ TMPDIR=<build>/tmp make check LOG_COMPILER=/bin/sh；随后按 tests/*.sh.log 逐用例统计 PASS/FAIL 并与候选数法清点的 N 对账（不符即抛异常）"

# 上游实际运行的测试程序（N=91，候选数法三口径同值：
#   test[0-9]*.sh ×91、test[0-9]*.out ×91、tests/Makefile.am 的 TESTS 声明 ×91）
upstream_tests:
  - file: tests/Makefile.am
    source: tclap-1.2.5/tests/Makefile.am
    description: "上游唯一测试面：91 个 shell 用例（tests/test1.sh .. test91.sh），每个用 ./test_wrapper 把 ../examples/testN 的 stdout 与 tests/testN.out 逐字节比对，rc=0 判 PASS；上游无单元测试框架，无 assertion 宏"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tclap.cpp
    description: "消费者测试：交付面指纹（头文件数 25 / CmdLine.h 14764 字节 / include guard+版权行 / 无 lib//COPYING 已交付）+ 解析行为（ValueArg/SwitchArg/MultiArg/int 转换/缺必填异常）；11 条运行期断言逐条打印读数"
    command: "./test_tclap <conan-package-folder>"

# 测试断言总数（上游 91 个比对用例；消费者 test_package 另计 11 条断言，不进上游分母）
assertion_count: 91
