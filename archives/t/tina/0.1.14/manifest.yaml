# tina 0.1.14 编译档案
software: tina
version: 0.1.14
status: built
build_system: autotools
compile_date: 2026-09-20

dependencies:
  required:
    - ncurses/6.5
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --without-shared
  cflags: "-fPIC -O2"
  env:
    CC: clang

patches_applied:
  - file: (inline)
    purpose: "configure umask 077→022（OHOS 沙箱 0700 目录不可写，config.status 必需）"

compatibility:
  level: high
  issues: []
  notes: |
    - AC_CHECK_LIB(curses, initscr) 由 ncurses/6.5 conan requires 提供
    - ncurses 库名为 libncursesw.a，configure 探测 -lcurses →
      build() 内创建 libcurses.a 符号链接指向 libncursesw.a
    - man 页 tina.1 安装到 share/man/man1
    - 上游 C 侧无自动化测试入口（Makefile.am 仅 bin_PROGRAMS=tina，无
      check_PROGRAMS / TESTS，已核对 release/0.1.14）
    - 上游 15 例测试全在 Python 侧（tox -e unit-tests / pytest）：
      grep -rh 'def test_' tests/python/unit --include='*.py' | wc -l → 15。
      OHOS 目标环境无 Python 运行时，CI worker 亦无 Rust 工具链
      （9 例依赖 Rust tina-convert），另 6 例需 pty 驱动 TUI，
      故上游侧记 0/15，逐类技术原因见 test_package/MANIFEST.yml
    - curses 终端程序，OHOS aarch64 运行模型待实测（无 ptrace 依赖）

test_results:
  type: consumer_smoke
  passed: 1
  failed: 0
  rate: "1/1 (100%)"
  note: |
    上游测试入口：tox -e unit-tests（Python pytest，tests/python/unit），
    实测 N=15（取数命令 grep -rh 'def test_' tests/python/unit --include='*.py' | wc -l）；
    C 主程序无 check_PROGRAMS（Makefile.am 仅 bin_PROGRAMS=tina），
    故 C 侧自动化测试 0 例，上游侧记 0/15（不可执行原因分类见
    test_package/MANIFEST.yml）。
    test_package 补全消费者冒烟测试 1 例（4 段断言：参数用法/二进制可执行性/
    退出码/输出内容）：执行打包的 tina --version
    （main.c:707 在 main.c:727 的 initscr() 之前 puts("Tina " VERSION) 并 return 0，
    headless 可运行），断言输出含 "Tina 0.1.14"。

knowledge_gained:
  - "tina 依赖仅 ncurses（AC_CHECK_LIB curses initscr），配方 requires ncurses/6.5 即可满足"
  - "ncurses 库名 ncursesw，configure 探测 -lcurses 需符号链接桥接"
  - "curses TUI 的 headless 测试：tina --version 在 initscr() 前 exit 0，可免终端验证二进制"

references:
  - https://devel.ringlet.net/misc/tina/
  - https://gitlab.com/tina-mgr/tina-mgr
