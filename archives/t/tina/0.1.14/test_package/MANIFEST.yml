# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tina/0.1.14
homepage: "https://devel.ringlet.net/misc/tina/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "tox -e unit-tests"

# 上游用例清点方法（R51 三步法 / 平台 rule4「实测 N」口径，源码行数法）：
#   tar -xzf tina-mgr-release-0.1.14.tar.gz
#   grep -rh 'def test_' tests/python/unit --include='*.py' | wc -l   → 15
# 实测 N = 15（源码行数法，7 个测试文件）。
# 注：上游多数用例为 pytest parametrize，运行时展开的注册用例数 > 15；
#     本 PR 按源码行数法申报，与平台 rule4 实测口径一致（实测 N ≤ 声明 N）。
upstream_test_count: 15
upstream_test_count_command: "grep -rh 'def test_' tests/python/unit --include='*.py' | wc -l"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清单（Python/pytest，tests/python/unit），共 15 例。
# 上游 C 侧无自动化测试入口（Makefile.am 仅 bin_PROGRAMS=tina，
# 无 check_PROGRAMS / TESTS）——已核对 release/0.1.14 的 Makefile.am。
#
# 15 例在 OHOS aarch64 目标环境均不可执行，逐类技术原因：
#   (a) 全部用例需 CPython >= 3.10 运行时（源码使用 match/case 结构化模式匹配）
#       + pytest + PyYAML（convert/test_convert.py:11 import yaml）；
#       OHOS 目标环境无 Python 运行时，CI worker 亦不提供。
#   (b) convert/* 与 combined/* 共 9 例经 unit/util.py 的 ProgramType 解析
#       TINA_CONVERT 可执行文件，该文件是 Rust 实现的 tina-convert
#       （rust/src/bin/tina-convert/cli.rs），tox unit-tests 通过
#       TINA_CONVERT={envdir}/bin/tina-convert 注入；CI 无 Rust 工具链。
#   (c) mgr/* 共 6 例（test_simple.py 4 + test_many.py 2）经
#       unit/mgr/util.py 的 tina_with_test_db_in_tempd 用 pty 驱动
#       编译产物 tina 并模拟按键，属交互式 TUI 集成测试，
#       需要伪终端设备，headless CI worker 无 TTY。
# 因此本 PR 不声明上游通过率，上游侧记 0/15。
upstream_tests:
  - file: tests/python/unit/mgr/test_simple.py
    source: tina-mgr-release-0.1.14/tests/python/unit/mgr/test_simple.py
    description: "pty 驱动的 tina 交互测试 4 例（test_start_quit_empty/test_display_test_db/test_search_change/test_insert_categorize）；需伪终端，headless 不可执行"
    command: "tox -e unit-tests"
  - file: tests/python/unit/mgr/test_many.py
    source: tina-mgr-release-0.1.14/tests/python/unit/mgr/test_many.py
    description: "pty 驱动的 tina 多次运行测试 2 例（test_one_run/test_many_runs[recycle]）；需伪终端，headless 不可执行"
    command: "tox -e unit-tests"
  - file: tests/python/unit/combined/test_mgr_convert.py
    source: tina-mgr-release-0.1.14/tests/python/unit/combined/test_mgr_convert.py
    description: "tina 与 tina-convert 组合测试 1 例（test_categorize_invert）；依赖 Rust tina-convert，CI 无 Rust 工具链"
    command: "tox -e unit-tests"
  - file: tests/python/unit/convert/test_convert.py
    source: tina-mgr-release-0.1.14/tests/python/unit/convert/test_convert.py
    description: "格式转换测试 3 例（test_convert[fmt]/test_invalid_contents[fmt]/test_duplicates[fmt]）；依赖 Rust tina-convert + PyYAML"
    command: "tox -e unit-tests"
  - file: tests/python/unit/convert/test_loops.py
    source: tina-mgr-release-0.1.14/tests/python/unit/convert/test_loops.py
    description: "环路检测测试 2 例（test_loop[length]/test_unreachable[...]）；依赖 Rust tina-convert"
    command: "tox -e unit-tests"
  - file: tests/python/unit/convert/test_metadata.py
    source: tina-mgr-release-0.1.14/tests/python/unit/convert/test_metadata.py
    description: "元数据测试 2 例（test_help_version[opts]/test_list_formats）；依赖 Rust tina-convert"
    command: "tox -e unit-tests"
  - file: tests/python/unit/convert/test_py_convert.py
    source: tina-mgr-release-0.1.14/tests/python/unit/convert/test_py_convert.py
    description: "Python 转换回读测试 1 例（test_read_db）；依赖 Rust tina-convert"
    command: "tox -e unit-tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tina.sh
    description: "消费者测试：执行打包的 tina --version（main.c:707 在 main.c:727 的 initscr() 之前 puts(\"Tina \" VERSION) 并 return 0，headless 可运行），四段断言：①参数用法($# 校验) ②二进制可执行性([ -x ]) ③退出码(RC==0) ④--version 输出含 'Tina 0.1.14'；覆盖 ELF 加载 + 动态链接 + ncurses 链接全链路"
    command: "sh test_tina.sh <pkg>/bin/tina"

# 测试断言总数 (近似值, 用于质量评估)
# test_tina.sh 四段断言：参数用法($#)、二进制可执行性([ -x ])、
# 退出码(RC)、--version 输出内容
assertion_count: 4
