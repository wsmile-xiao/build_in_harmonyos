# test_package/MANIFEST.yml
# tinyxxd 1.3.16.
#
# Upstream `make test` diffs tinyxxd against vim's xxd (downloaded at build
# time) and builds an ASan binary, which is not CI-friendly. The repository
# also ships 4 self-contained scripts under testfiles/. This package
# reproduces the xxd-independent cases (16 total) against the installed
# binary.

package: tinyxxd/1.3.16
homepage: https://github.com/xyproto/tinyxxd

upstream_tests_exist: true
upstream_test_audit: "make test = 27 xxd-diff cases + 5 self-contained cases; testfiles/ has test13/test14/test15/test_c0 scripts"
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "test_package/test_tinyxxd.py (testfiles/*.sh + self-contained make test cases)"
upstream_test_count: 16
upstream_passed: 16
upstream_failed: 0

upstream_tests:
  - make_test_help_stdout
  - make_test_error_stderr
  - test13_i_b_binary_include
  - test14_1_e_c6
  - test14_2_e_c9
  - test15_i_stdin
  - test_c0_1_normal_default_cols
  - test_c0_2_ps_single_line
  - test_c0_3_b_default_cols
  - test_c0_4_i_default_cols
  - test_c0_5_e_default_cols
  - test_c0_6_ps_large_single_line
  - test_c0_7_ps_200_hex_chars
  - make_test_le_padding
  - make_test_revert_crlf
  - make_test_dump_revert_roundtrip

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tinyxxd.py
    description: "运行安装后的 tinyxxd 二进制：16 组上游用例 + -v 版本 + 256 字节往返"
    command: "python3 test_tinyxxd.py <path-to-tinyxxd>"

test_files:
  - path: "test_package/test_tinyxxd.py"
    test_type: "R34"
    assertion_count: 18
    description: "16 upstream reproductions + 2 consumer checks against the installed binary"

test_package_test_count: 1
consumer_assertion_count: 18
assertion_count: 18
