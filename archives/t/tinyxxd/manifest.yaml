software: tinyxxd
display: "tinyxxd"
description: "小型、自包含的 xxd 克隆：十六进制/二进制转储，并可从转储还原"
category: utility
homepage: "https://github.com/xyproto/tinyxxd"
license: GPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "单个 C11 源文件 main.c，直接编译成 bin/tinyxxd，无外部依赖"
    - "上游 make test 依赖下载 vim xxd 并开 ASan，不可在 CI 复现；改用 testfiles/ 的自包含用例"
    - "命令行工具，软件级提供 commands.json（R38）"
  common_dependencies: []

versions:
  "1.3.16":
    status: built
    build_date: "2026-09-15"
    conan_ref: "tinyxxd/1.3.16"
