software: taskwarrior-tui
version: "0.27.0"
status: built
build_date: "2026-08-23"
build_system: cargo
conan_ref: "taskwarrior-tui/0.27.0"

source:
  url: "https://github.com/kdheepak/taskwarrior-tui/archive/refs/tags/v0.27.0.tar.gz"
  sha256: "e4f5d10428dc1917b6084b5b0ed502ffe691cb14908cedd04ffff3940f9ffceb"
  tar_format: tar.gz

build:
  system: cargo
  configure_options:
    - "cargo build --release --locked"
    - "OHOS target: aarch64-unknown-linux-ohos (override with RUST_TARGET)"
    - "OHOS fallback: checksum-pinned Harmonybrew Rust 1.97.1, OpenSSL, zlib, and CA bottles"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "taskwarrior-tui 0.27.0 is a pure Rust CLI (edition 2024) with one binary and no Conan dependencies."
  - "Runtime depends on taskwarrior for full functionality, but --version works without it."
  - "The OHOS runner image has no Rust/Cargo; four SHA256-pinned Harmonybrew arm64_ohos bottles provide an isolated fallback."
  - "Rust edition 2024 requires Rust 1.85+; Harmonybrew Rust 1.97.1 bottle satisfies this requirement."
  - "build.rs generates shell completions and optionally man pages (pandoc optional, non-fatal)."
  - "The software-level commands.json declares the packaged executable as an R38 tool."
  - "Recipe follows the cargo-bloat/0.12.1 pattern for Rust toolchain bootstrap on OHOS."
