# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tinycthread/1.1
homepage: "http://tinycthread.bitsnbites.eu/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 configure/ctest；test/ 目录 Makefile 构建 hello + test 两个程序
upstream_check_command: "make -C test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.c
    source: tinycthread-1.1/test/test.c
    description: "TinyCThread 上游自检程序（PART I-VII：线程创建/join、TLS、互斥锁 100 线程×10000 次、条件变量、yield、sleep、当前时间）"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：4 线程 × 1000 次互斥锁保护计数，调用 thrd_create/thrd_join/mtx_init/mtx_lock/mtx_unlock/mtx_destroy"
    command: "./test_tinycthread"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 30
