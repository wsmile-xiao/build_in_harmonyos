# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: tinycthread/1.2
homepage: "https://tinycthread.github.io"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.c
    source: tinycthread-1.2/test/test.c
    description: "C11 threads API comprehensive test suite"
    command: "./test-tinycthread"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Basic thread create and join test"
    command: "./test_tinycthread"

# 上游注册 12 个测试项，另有 1 个消费者集成测试
assertion_count: 13
