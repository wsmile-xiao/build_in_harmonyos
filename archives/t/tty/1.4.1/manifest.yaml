# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.1"

# 软件名
software: "tty"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mpereira/tty-solitaire/archive/refs/tags/v1.4.1.tar.gz"

  # 源码校验和
  sha256: "8eb536a87f0586e1f057a3aa05256df34cbd92a3e22545d1df2f945e27d89db2"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "ncurses/6.5"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "裸 Makefile 项目命令行 CFLAGS/LDFLAGS 会覆盖 Makefile 内赋值且 += 对命令行变量无效，ncurses 头文件/库路径必须全部显式传入 (ref: E545-raw-makefile-command-line-flags)"
  - "-DVERSION=\\\"1.4.1\\\" 需经 shell 转义保留 C 字符串引号，裸 1.4.1 触发 invalid suffix '.1' on floating constant (ref: E546-define-version-quoting-through-make)"
  - "OHOS 静态 ncurses 的 tcsetattr raw/noecho 未生效（同 tty-clock terminfo stale 路径属 musl+静态 ncurses 类问题），pty 消费者用例输入需带换行提交，terminfo 用 TERMINFO 环境变量指向依赖包运行期修复 (ref: E547-ohos-static-ncurses-termios-terminfo)"
