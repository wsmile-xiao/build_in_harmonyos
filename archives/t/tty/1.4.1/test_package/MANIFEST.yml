# test_package/MANIFEST.yml — tty 1.4.1
# 上游官方测试声明文件（CI L0e 强制要求）

package: tty/1.4.1
homepage: "https://github.com/mpereira/tty-solitaire"

# 上游测试命令（纯 Makefile 项目，测试目标为 make test）
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test CC=clang CFLAGS='-I<ncurses-include> -std=c99 -DNCURSES_WIDECHAR' LDFLAGS='-L<ncurses-lib> -lncursesw'"

# 上游实际运行的测试程序：tests/ttysolitaire_test.c 编译出 ttysolitaire_test，
# 汇集 9 个模块测试文件、67 个具名测试函数、115 个断言
upstream_tests:
  - file: tests/ttysolitaire_test.c
    source: tty-solitaire-1.4.1/tests/ttysolitaire_test.c
    description: "测试总入口，依次调用 9 个模块测试函数"
    command: "./ttysolitaire_test"
  - file: tests/card_test.c
    description: "card 模块：test_card_init/test_card_dup/test_card_set/test_card_expose/test_card_cover/test_card"
  - file: tests/cursor_test.c
    description: "cursor 模块：test_cursor"
  - file: tests/deck_test.c
    description: "deck 模块：test_deck"
  - file: tests/frame_test.c
    description: "frame 模块：test_frame_init/test_frame_dup/test_frame_set/test_frame"
  - file: tests/game_test.c
    description: "game 模块：test_valid_move_*（16 个移动合法性）+ test_move_card_*（24 个移动）+ test_game"
  - file: tests/gui_test.c
    description: "gui 模块：test_gui"
  - file: tests/keyboard_test.c
    description: "keyboard 模块：test_keyboard"
  - file: tests/stack_test.c
    description: "stack 模块：test_stack_push/pop等（29 个断言）"
  - file: tests/test_helper_test.c
    description: "测试辅助：frames_equal/cards_equal/stacks_equal（16 个断言）"

# test_package 自带的验证（消费者视角）
test_package_tests:
  - file: test.c
    description: "消费者 C 测试：执行包内 ttysolitaire -v/-h 验证输出"
    command: "./test_tty_solitaire <pkg>/bin/ttysolitaire"
  - file: test.sh
    description: "鸿蒙端到端消费者用例 HC-1 版本 / HC-2 帮助 / HC-3 pty 内真实启动游戏并退出"
    command: "bash test.sh <pkg>/bin/ttysolitaire"

# 测试断言总数（上游 115 + 消费者端到端 3 场景）
assertion_count: 115
