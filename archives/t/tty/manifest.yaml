# 软件级 manifest — tty
# 文件位置: archives/t/tty/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: tty
display: "tty-solitaire（tty）"
description: "Ncurses-based klondike solitaire game for the terminal"
category: games
homepage: "https://github.com/mpereira/tty-solitaire"
license: MIT

# ============================================================
# 构建信息
# ============================================================

build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "ncurses 必须静态链接（-lncursesw + -DNCURSES_WIDECHAR），OHOS 上 shared ncurses 会导致系统崩溃"
    - "裸 Makefile 项目：命令行 CFLAGS/LDFLAGS 全量显式传入（+= 对命令行变量无效），-DVERSION 需保留 C 字符串引号"
    - "静态 ncurses 内置 stale staging terminfo 路径，运行期用 TERMINFO 环境变量指向依赖包 share/terminfo 修复"
    - "OHOS musl + 静态 ncurses 下 tcsetattr raw/noecho 未生效，pty 自动化用例输入需带换行提交"
  common_dependencies:
    - ncurses

# ============================================================
# 版本索引
# ============================================================

versions:
  1.4.1:
    status: built
    build_date: "2026-09-30"
