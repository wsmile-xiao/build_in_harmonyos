sources:
  url: "https://deb.debian.org/debian/pool/main/t/tgl/tgl_2.0.1+git20160323.ffb04cac.orig.tar.xz"
  sha256: "fdaa7ae13faede841d98c604be8ad1804b2827ce6816ec03c8770ec6d1562a22"

patches:
  - patch_file: "patches/0001-makefile-use-system-tl-parser.patch"
    patch_description: "Build against the packaged tl-parser tool instead of the tl-parser git submodule missing from the release tarball"
    patch_type: "portability"
  - patch_file: "patches/0002-makefile-install-target-and-compiler-flags.patch"
    patch_description: "Add the install target that lets the library and headers be packaged; drop -Werror for clang 15 and add -UNDEBUG so the assert-driven TL generator keeps working in a Release build"
    patch_type: "portability"
  - patch_file: "patches/0003-openssl-1.1-opaque-rsa.patch"
    patch_description: "Use the OpenSSL 1.1+ opaque RSA API (RSA_set0_key/RSA_get0_key)"
    patch_type: "portability"
  - patch_file: "patches/0004-queries-initialize-peer-id.patch"
    patch_description: "Initialize the whole tgl_peer_id_t in tgl_do_send_document instead of only peer_id"
    patch_type: "bugfix"
  - patch_file: "patches/0005-configure-hmdfs-pwd-tmpdir.patch"
    patch_description: "HMDFS: fall back to $PWD when getcwd() fails in configure, and create the config.status scratch directory with umask 022"
    patch_type: "portability"
  - patch_file: "patches/0006-configure-cross-compiling-conftest.patch"
    patch_description: "Keep cross_compiling=yes instead of aborting when a freshly linked conftest cannot be executed (HarmonyOS runs only signed binaries)"
    patch_type: "portability"
  - patch_file: "patches/0007-add-tl-parser-schema-header.patch"
    patch_description: "Add tl-parser/tl-tl.h and tl-parser/portable_endian.h, which generate.c and mtproto-utils.c include: the tarball only carries an empty tl-parser/ submodule directory"
    patch_type: "portability"
