# test_package/MANIFEST.yml — tzdb 2026c
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: tzdb/2026c
homepage: "https://www.iana.org/time-zones"

# 上游测试套件：`make check`（19 个 .ck 一致性检查，见 conanfile.py _EXPECTED_CK）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1 CC=<conf> AR=<conf> RANLIB=<conf> VERSION=2026c"

# 上游测试程序（按 check 目标分组；完整 19 项枚举见 conanfile.py _EXPECTED_CK）
upstream_tests:
  - file: theory.ck/tz-art.ck/tz-how-to.ck/tz-link.ck
    source: tz-2026c/Makefile (check_web)
    description: "HTML 文档校验（curl 缺失时自动跳过，validator.w3.org 可达时在线校验）"
    command: "make check"
  - file: zishrink-posix.ck/zishrink-right.ck
    source: tz-2026c/Makefile (check_zishrink)
    description: "zic 编译往返数据完整性比对（posix/right 双模式）"
    command: "make check"
  - file: character-set.ck/white-space.ck/links.ck/mainguard.ck/name-lengths.ck/news.ck/slashed-abbrs.ck/sorted.ck/tables.ck/ziguard.ck/tzs.ck
    source: tz-2026c/Makefile (check_mild)
    description: "时区数据源一致性检查（字符集/空白/链接/排序/表格/版本等 11 项）"
    command: "make check"
  - file: back.ck
    source: tz-2026c/Makefile
    description: "backzone 数据与主数据一致性检查"
    command: "make check"
  - file: now.ck
    source: tz-2026c/Makefile
    description: "用新编译的 date/zdump/zic 做当前时间实测检查"
    command: "make check"

# test_package 消费者测试（R34 真实工具调用：版本/TZif/时区偏移/DST/zic 往返）
test_package_tests:
  - file: test_tzdb.sh
    description: "Staged zic/zdump version, TZif magic, Shanghai +0800, New York DST, zic compile round-trip"
    command: "sh test_tzdb.sh <package>"

# 断言总数：上游 19 + test_package 6 = 25（上游计数为 Makefile 审计注册数，通过率以真机 HMBS 标记为准）
assertion_count: 25

# rule4 真机门禁字段
upstream_tests_exist: true
upstream_test_total: 19
upstream_test_count_method: manual_audit
upstream_test_audit: "tz-2026c/Makefile 的 check/check_mild 目标审计：check_web 4 项（theory/tz-art/tz-how-to/tz-link）+ check_zishrink 2 项（posix/right）+ check_mild 其余 11 项（character-set/white-space/links/mainguard/name-lengths/news/slashed-abbrs/sorted/tables/ziguard/tzs）+ back.ck + now.ck = 19。口径为上游 .ck stamp 目标数（单一 make 框架无 ctest/gtest 注册表，manual_audit）。conanfile.py build() 在全新源码树运行 make check，以 19 个 .ck 文件存在性为唯一计数源并打印 HMBS_UPSTREAM_TEST_RESULT。"
