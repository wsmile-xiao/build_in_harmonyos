# 版本级 manifest — tzdb 2026c
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "2026c"

# 软件名
software: tzdb

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游维护者官方 GitHub tag 包，与 IANA 发布同源）
  url: "https://github.com/eggert/tz/archive/refs/tags/2026c.tar.gz"

  # 源码校验和（sha256，实测）
  sha256: "99fcce3d468fbb94b9395db2d4a83777ffdf7740a1890ba2e52e8ae089cc8e3b"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "tz-2026c"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - "REDO=posix_only（上游默认，单套 zoneinfo 树）"
    - "VERSION=2026c（无 git 时 version/version.h 回退为 unknown，必须显式传入）"
    - "CC/AR/RANLIB 取自 Conan conf（R33，不依赖 shell 环境变量）"
    - "AWK 按 gawk→nawk→awk 功能自测优选并透传（上游 Makefile 明示 mawk/busybox 不可用；now.ck 的 checknow.awk 对 awk 方言最敏感）"
    - "SHELL 保持 HMBS 注入的 /bin/sh（全局覆盖曾选 zsh 导致 5/19 回归，已回退）；now.ck 的 future=2676067957 超 INT32_MAX 问题改由 Makefile 单行补丁用 $(AWK) 计算（数值一致）"
    - "now.ck 两处 zone 发现 find 改宽为 regular-or-symlink（无 hardlink 时 link 装成 symlink；断言不变）"
    - "make -j1（R9）"
  notes: "纯 Makefile 项目（无 configure）；build() 先 make 再 make check（19 .ck），package() 用 make install DESTDIR=<package_folder> 暂存（usr/bin、usr/sbin、usr/share/zoneinfo、usr/lib/libtz.a、man 页）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "conanfile.py:_patch_zic_eperm_fallback (in-recipe, no .patch file)"
    description: "zic dolink treats EPERM as not-supported so identical zone files fall back to symlink/copy on filesystems without hardlink support"

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "POSIX C 工具链（zic/zdump/tzselect）+ awk/grep/diff 文本检查，无平台相关系统调用；check_web 仅在 curl 存在且外网可达时在线校验，否则自动跳过"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 0
  failed: 0
  note: |
    上游测试：`make check` 19 个 .ck 检查（conanfile.py build() 真实运行，
    以 .ck 文件存在性计数并打印 HMBS_UPSTREAM_TEST_RESULT）。
    适配后：test_package/test_tzdb.sh 6 个真实断言（zic/zdump 版本、
    TZif 魔数、Shanghai +0800、New York DST、zic 编译往返）。
    通过数以 HarmonyOS aarch64 真机预检 HMBS 标记为准，待回填。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "tzdb（eggert/tz）是单一 Makefile 同时管构建与测试：all 产出 zic/zdump/tzselect/libtz.a，install 用 DESTDIR 暂存且自带 REDO 数据编译；check 是 19 个 .ck stamp 文件，可直接作为确定性计数源"
  - "tar 包内无 version 文件时 version/version.h 回退为 unknown，必须 make VERSION=<ver> 显式传入，否则 news.ck 失败且 --version 失真"

references:
  - https://www.iana.org/time-zones
  - https://github.com/eggert/tz
