# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: twolame/0.4.0
homepage: "https://github.com/njh/twolame"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test.pl
    source: twolame-0.4.0/tests/test.pl
    description: "Perl 测试脚本：用 twolame/stwolame 前端编码 3 个 WAV 样例（44100/22050/float32），逐用例校验 MD5 输出指纹（118 个子用例）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：初始化 twolame_options，设置声道/采样率/码率，对 1024 采样执行真实 MP2 编码并 flush"
    command: "./test_twolame"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 118