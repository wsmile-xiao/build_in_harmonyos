# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tree-hh/3.18
homepage: "https://github.com/kpeeters/tree.hh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "test_tree.bin（输出与 src/test_tree.output 对比）"

upstream_tests:
  - name: src/（test_tree.cc 主测试 + test1~4.cc 共 5 个测试程序）
    count: "5"
    description: "上游测试实测（rule 4，分母=全部 5 测试程序）：4/5 = 80%——test1/test2/test4 通过（exit=0）；test_tree 运行成功（rc=0，输出 331 行 vs 旧版 test_tree.output 311 行、26 处 diff 为上游数据未同步——tr9 部分缺失，非 OHOS 适配问题）；test3 编译失败（上游旧语法 main() 缺返回类型，需 g++ 宽松模式，OHOS 无 g++）——如实记录"

test_package_tests:
  - file: test_tree_hh.py
    description: "R34：头文件存在 + 编译运行使用 tree.hh 的 smoke（tree<T> 插入遍历）"
    command: "python3 test_tree_hh.py <package>"

assertion_count: 2
