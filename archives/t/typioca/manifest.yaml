# 软件级 manifest — typioca
software: typioca
display: "typioca"
description: "Cozy terminal typing-speed tester (纯 Go CLI，基于 bubbletea TUI)"
category: utility
homepage: "https://github.com/bloznelis/typioca"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 静态编译（CGO_ENABLED=0，GOOS=linux，GOARCH=arm64）"
    - "Go linker fallocate/mmap 在 HMDFS 上返回 EACCES（mapping output file failed: permission denied，E523/E134）→ 链接输出放到 ext2 可写分区（/data/storage/el2/base/haps/entry/files）"
    - "OHOS 上每个被 fork/exec 的 ELF 必须用 binary-sign-tool 自签名（含 .codesign section），Go SDK 工具链同样需要签名"
    - "Go netgo 解析器只读 /etc/resolv.conf，OHOS 开发镜像上其 nameserver 不可达 → GOPROXY 支持 env 覆盖（本地用 file:// 模块代理，CI 用公共代理）"
    - "上游 3.1.0 无任何测试文件（`go test ./...` 每包 [no test files]），新增消费者冒烟测试 + 鸿蒙签名断言作为补充覆盖"
  common_dependencies: []

versions:
  "3.1.0":
    status: built
    build_date: "2026-10-12"
    conan_ref: "typioca/3.1.0"
