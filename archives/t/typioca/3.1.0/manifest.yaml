# manifest.yaml — typioca 3.1.0 (HarmonyOS PC)
# 遵循 ARCHIVE-SPEC v3.0 §4.2
version: "3.1.0"
software: "typioca"
status: "built"
build_date: "2026-10-12"
conan_ref: "typioca/3.1.0"

source:
  url: "https://github.com/bloznelis/typioca/archive/refs/tags/3.1.0.tar.gz"
  sha256: "b58dfd36e9f23054b96cbd5859d1a93bc8d3f22b4ce4fd16546c9f19fc4a003c"
  tar_format: tar.gz
  upstream: "https://github.com/bloznelis/typioca"
  license: "MIT"

build:
  system: custom
  # 上游 Makefile 的等价命令（去掉 -a 全量重编译，其它一致）
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux GOARCH=arm64"
    - "GOTOOLCHAIN=local"
  entry: "go build -trimpath ."
  output_binary: "typioca"
  ldflags: "-s -w -X github.com/bloznelis/typioca/cmd.Version=3.1.0"
  dependencies: []
  cc: go
  cxx: ""

patches_applied: []

knowledge_gained:
  - "typioca is a pure-Go CLI (module github.com/bloznelis/typioca, main.go at repo root); CGO disabled, GOOS=linux, static binary for OHOS/Linux aarch64 (also x86_64)."
  - "go.mod declares go 1.22.1; Go 1.26.5 satisfies it, GOTOOLCHAIN=local prevents toolchain auto-download."
  - "Go linker fallocate/mmap fails on HMDFS/tmpfs (E523/E134): link output must be placed on an ext2-like writable workspace (/data/storage/el2/base/haps/entry/files)."
  - "On OHOS every fork/exec'd ELF (the typioca binary and the Go SDK tool binaries) must carry a .codesign section; sign with binary-sign-tool."
  - "Go's netgo resolver only reads /etc/resolv.conf; on OHOS dev images its nameservers are unreachable, so `go mod download` fails with `dial tcp: lookup ... i/o timeout`. GOPROXY is overridable from the environment so a file:// module proxy can substitute locally while CI keeps the public proxy."
  - "Upstream 3.1.0 ships no *_test.go files and its CI (.github/workflows/ci.yml) only runs `make build-all`; upstream test count is 0 (no_tests)."
