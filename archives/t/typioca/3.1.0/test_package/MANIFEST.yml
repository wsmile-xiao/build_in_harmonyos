# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: typioca/3.1.0
homepage: "https://github.com/bloznelis/typioca"

# 上游测试入口：空串。typioca 3.1.0 上游无任何 *_test.go / make check / ctest / pytest，
# Makefile 也没有 test/check 目标；upstream_check_command / upstream_test_command 留空以
# 声明「上游未绑定测试入口」（与 aribb24 / aiac / augustus / xidle 等已通过门禁的配方对齐）。
upstream_check_command: ""

# conanfile.py build() 中是否已集成上游测试（作为门禁判定依据）
# typioca 3.1.0 上游无测试；build() 里的 `go test -v -count=1 ./...` 仅作源码树审计留痕，
# HMBS_UPSTREAM_TEST_RESULT=no_tests 证据在 test_package 阶段用裸 print() 输出。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# ── 上游测试审计（upstream_tests_exist=false 的显式证据）──
upstream_tests_exist: false
upstream_test_audit:
  - source: "typioca-3.1.0 源码树 (`find . -name '*_test.go'`)"
    reason: "全模块 15 个 .go 文件（main.go、cmd/、cmd/words/）中没有任何 *_test.go 文件，Test/Benchmark/Example 函数数为 0。"
  - source: "Makefile"
    reason: "仅有 build/build-all/build-win-*/build-mac-*/build-linux-*/help 目标，没有 test/check 目标。"
  - source: ".github/workflows/ci.yml"
    reason: "CI 只有 `make build-all` 构建 + 上传产物 + release + winget 发布 job，无任何测试 step。"
  - conclusion: "上游 3.1.0 不提供任何自动化测试；`go test -v -count=1 ./...` 实测每个包输出 [no test files]。本适配新增二进制消费者冒烟测试（test_typioca.sh + OHOS 签名断言）作为补充测试，不冒充上游覆盖。"
upstream_test_count: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_typioca.sh
    description: "冒烟测试: typioca --version 断言 3.1.0 + --help 根命令 + serve --help 参数 + 未知命令非零退出"
    command: "sh test_typioca.sh <bin/typioca>"
  - file: conanfile.py
    description: "[鸿蒙特有] 校验产物 ELF 带 binary-sign-tool 生成的 .codesign/.note.ohos 段"
    command: "conan test"

# 断言数:
#   test_typioca.sh（6）:
#     1. `typioca --version` 退出码为 0
#     2. --version 输出包含 "typioca"
#     3. --version 输出包含 "3.1.0"
#     4. --help 输出包含 "Usage:"
#     5. --help 输出列出 "serve"
#     6. 未知命令退出码非 0
#   conanfile.py（1，鸿蒙特有）:
#     7. OHOS 产物 ELF 含 .codesign/.note.ohos 签名段
assertion_count: 7
