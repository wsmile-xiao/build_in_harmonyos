# test_package MANIFEST - tsduck 4676 (TSDuck 3.44-4676)
# R34 反空壳：测试源实质调用被测包 API/二进制。
# 上游 src/utest/ TSUnit 套件随 make 默认构建，conanfile.py build() 内真实
# 运行 utest + utest_static 并解析输出取证；test_package 从消费者视角执行
# 包内库 API 与 CLI 二进制。

package: tsduck/4676
homepage: "https://github.com/tsduck/tsduck"

# 上游测试：无需 make check，utest 二进制直跑（-l 列清单，空参执行）
upstream_check_command: "make (src/utest 默认构建 utest + utest_static)"
upstream_test_in_build: true
upstream_test_command: "utest -l ; TSPLUGINS_PATH/LD_LIBRARY_PATH=bindir utest"

# 上游测试资产审计（静态源码清点，运行时刻以 "utest -l" 输出为准）：
# src/utest/utest*.cpp 共 87 个文件，TSUNIT_DECLARE_TEST 宏共 747 个；
# 其中 utestDirectShow.cpp 全文件在 "#if defined(TS_WINDOWS)" 内，
# Linux/OHOS 下 1 个用例缺席 -> 可运行 746 个。单一 TSUnit 框架，
# "-l" 输出 "    Suite::test" 行可解析，runner 汇总行
# "OK (N tests, M assertions)" / "*** FAILURES (F tests FAILED, P passed)"
# 为确定性单源计数，故用 auto（与配方标记解析口径一致）。
upstream_tests:
  - file: src/utest/utest*.cpp (87 files, TSUNIT_DECLARE_TEST x747)
    source: tsduck-3.44-4676/src/utest/
    description: "TSUnit 单元测试：87 个测试类文件，746 个可运行用例（Windows-only DirectShow 除外），覆盖 TS 包/PSI/SI/描述符/字符集/加密/网络/插件仓库等"
    command: "utest"
  - file: src/utest/utest.cpp + tsunit.cpp
    source: tsduck-3.44-4676/src/utest/
    description: "TSUnit runner 本体（-l 清单模式 + OK/FAILURES 汇总行），与 utest_static（静态库版本，插件测试除外）同跑"
    command: "utest_static"

# test_package 中自带的测试 (消费者视角验证，8 检查点)
test_package_tests:
  - file: test_tsduck.cpp
    description: "链接 tsduck::tsduck 的消费者：版本宏/ TSPacket init-同步字节/null-PID/setPID 回环/连续计数器/UString 大小写，共 6 个 CHECK-OK 断言"
    command: "./test_tsduck"
  - file: data/null10.ts + packaged tsp/tsversion
    description: "执行包内二进制：tsversion --version 含 3.44-4676；tsp -I file -O file 回环 10 个空包 1880 字节完全一致"
    command: "tsversion --version ; tsp -I file data/null10.ts -O file out.ts"

# 测试断言总数（源码审计近似值，用于质量评估；执行结论以真机 evidence 为准）
assertion_count: 8

# rule4 门禁：上游测试总数声明（静态审计 747-1=746；单一可解析 TSUnit 框架故用 auto；
# 运行时刻 discovered 取自 "utest -l" 实测行数，真机 evidence 轮如有差异以实测为准同步）
upstream_test_total: 746
upstream_test_count_method: auto
upstream_tests_exist: true
