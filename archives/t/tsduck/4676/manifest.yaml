software: tsduck
version: "4676"
status: built
build_date: "2026-09-28"
build_system: makefile
conan_ref: tsduck/4676

source:
  url: "https://github.com/tsduck/tsduck/archive/refs/tags/v3.44-4676.tar.gz"
  sha256: "22a6be2fdaa1714200c5ce0640dba551a9be9e2b2b8fb53067224ebf80c7c30e"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "BINDIR=<build>/tsduck-bin"
    - "SHELL=<bash> CXX=<ohos clang++> CC=<ohos clang>"
    - "NODEKTEC=1 NODTAPI=1 NOHIDES=1 NOVATEK=1 NOCURL=1 NOPCSC=1"
    - "NOOPENSSL=1 NOZLIB=1 NOSRT=1 NORIST=1 NOJAVA=1 NOPYTHON=1"
    - "NOEDITLINE=1 NOHWACCEL=1 NOGITHUB=1"
  dependencies: []
  cc: clang
  cxx: clang++
  build_command: make -j1 <flags...>（cwd=<source>/src，跳过根 Makefile 的 git-hooks 目标）
  install_command: 不使用 make install（E108：HarmonyOS 无 GNU install）——package() 手工放置工具/库/插件/头文件/数据文件

test_results:
  target: OpenHarmony aarch64
  upstream_framework: TSUnit（上游自研单断言框架，utest 二进制直跑）
  upstream_discovered: 746
  upstream_passed: 0
  upstream_failed: 0
  upstream_note: 746 为静态源码审计数（747 TSUNIT_DECLARE_TEST 宏减 1 个 Windows-only）；passed/failed 待真机 evidence 轮回填实测值
  test_package_passed: 0
  test_package_failed: 0
  test_package_assertions: 8
  execution: 待真机 conan create 实测（test_tsduck 6 API 断言 + tsversion/tsp 2 CLI 检查）

test_passed: 0
test_failed: 0

patches_applied: []

knowledge_gained:
  - TSDuck nodep 标志集即官方支持的零依赖构建形态，无需源码补丁
  - Makefile.inc 硬编码 SHELL=/usr/bin/env bash，OHOS 下必须在 make 命令行覆盖 SHELL
  - LLVM=1 会强制覆盖 CXX，只能显式传 CXX 并依赖版本探针选中 LLVM 警告集
  - make install 用到 GNU install（E108），改走 package() 手工复制并复刻 install-devel 的 TS_NO_* 追加逻辑
  - utest -l 输出 Suite::test 行即 discovered 单源；OK/FAILURES 汇总行即 passed/failed 单源
