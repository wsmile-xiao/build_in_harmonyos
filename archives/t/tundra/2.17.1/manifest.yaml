knowledge_gained:
  - OHOS Clang defines __linux__ and __unix__, allowing Tundra's POSIX code to compile without source changes.
  - The Makefile uses uname; native OHOS builds select its Linux POSIX configuration with UNAME=Linux.
  - Tundra accepts the worker limit as '-j 2'; make -j2 alone does not limit Tundra's internal build workers.
  - The device lacks GNU install; Python copies the three binaries and Lua tree into the upstream install layout.
