# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tcpflow/1.6.1
homepage: https://github.com/simsong/tcpflow

# 上游测试命令 (make check 实际执行)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游 make check 实际运行的测试程序 (tests/Makefile.am SH_TESTS)
upstream_tests:
  - file: test1.sh
    source: tcpflow-1.6.1/tests/test1.sh
    description: "离线 pcap 解析核心工作流：tcpflow -o out -X out/report.xml -r test{1,2,3}.pcap。断言共 6 个流文件：test1.pcap(t=1) 4 个流文件 md5+size+mtime(2008) + test2.pcap(t=2) 2 个流文件 md5；t=3 无断言。注：上游 checkmd5 仅比较 md5（size 仅打印），test_package 额外断言 size 与 mtime 以与上游期望值逐字节对齐"
    command: "./test1.sh"
  - file: test-pdfs.sh
    source: tcpflow-1.6.1/tests/test-pdfs.sh
    description: "netviz 报告生成（依赖 cairo，本适配以 --enable-cairo=false 关闭该能力，该用例不适配后运行）"
    command: "./test-pdfs.sh"
  - file: test-multifile.sh
    source: tcpflow-1.6.1/tests/test-multifile.sh
    description: "多文件描述符测试（需要外部 2013-httpxfer 大 pcap，缺文件时 exit 0 跳过）"
    command: "./test-multifile.sh"
  - file: test-iptree.sh
    source: tcpflow-1.6.1/tests/test-iptree.sh
    description: "IP tree 测试（需要外部 nitroba.pcap，缺文件时跳过）"
    command: "./test-iptree.sh"
  - file: test-chroot.sh
    source: tcpflow-1.6.1/tests/test-chroot.sh
    description: "chroot 模式测试（需要 root + 外部 nitroba.pcap，CI 不可运行）"
    command: "./test-chroot.sh"

# test_package 中自带的测试 (消费者视角验证，真实执行 tcpflow 二进制)
test_package_tests:
  - file: test_tcpflow.py
    description: "消费者测试：--version/-h 入口 + 默认 report 离线 pcap 工作流，4 流文件 md5/size/mtime(2008) 与上游 test1.sh t=1 分支断言逐字节一致。夹具 test1.pcap 由配方 package() 从上游源码复制到包内 test/fixtures/（SHA256 41cc8c96a2502fd6adb5f4498950264f79f7cbb19afc02e094c5105b32b19668，7047 字节），test_package 经 package_folder 定位，不携带二进制进入 PR diff"
    command: "python3 test_tcpflow.py <tcpflow-bin> <package_folder>/test/fixtures/test1.pcap"

# 测试用例数与断言数 (test_tcpflow.py 实际统计)
case_count: 4
assertion_count: 20
