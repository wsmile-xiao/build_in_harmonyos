knowledge_gained:
  - "官方 GitHub release tarball 不含 git submodule 内容，须用 conandata submodules 段声明固定 commit 源码并在 source() 合并 (http-parser)"
  - "GitHub archive tarball 无预生成 configure，build() 中检测缺失后 autoreconf 自举"
  - "tcpflow 实时抓包依赖 CAP_NET_RAW，但离线 pcap 解析 (-r) 是完整可测核心工作流，上游测试全部基于离线 pcap"

