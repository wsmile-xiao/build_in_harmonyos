software: teensy_loader_cli
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/PaulStoffregen/teensy_loader_cli/archive/refs/tags/2.3.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项（平面字符串格式，供 clean_verify 正则匹配）
  configure_options: ""

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libusb/1.0.27"

  # 编译器
  cc: clang
  cxx: clang++

  # 静态链接依赖（OHOS LD_LIBRARY_PATH 不可靠）
  static_deps:
    - "libusb-1.0"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-configure.patch"
  - "0003-teensy_loader_cli.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 项目需要 dummy configure 脚本和 install target 补丁（E105 模式）"
  - "OHOS LD_LIBRARY_PATH 不可靠，libusb 必须静态链接 (-l:libusb-1.0.a)"
  - "OHOS /bin/sh 不支持 heredoc (<<EOF) 语法，configure 脚本必须用 echo/printf 替代"
  - "manifest.yaml configure_options 必须使用平面字符串格式（非 YAML 列表），否则 clean_verify 正则截断引号导致 G0 失败"
  - "源码使用旧版 libusb-0.1 API (usb.h, -lusb)，需移植到 libusb 1.0 API (libusb.h, libusb_*)"

patch_generation:
  method: per-file-difflib
