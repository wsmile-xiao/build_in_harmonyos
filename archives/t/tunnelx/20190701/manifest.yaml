# manifest.yaml — tunnelx 20190701
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "20190701"
software: tunnelx
status: built
build_date: "2026-10-04"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 GitHub 官方 tag 归档（R2019a = version2019-07-01 快照）
  url: "https://github.com/goatchurchprime/tunnelx/archive/refs/tags/R2019a.tar.gz"
  sha256: "de8fbee92325233ccab703a5661b8e119b8bbb710660b7f590454eba82240cfd"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # javac + jar（复刻上游 build/jmake 脚本），无 configure/make/cmake
  system: custom
  configure_options: []
  dependencies:
    - "bishengjdk/17.0.13"
  cc: javac
  cxx: jar

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - ref: notes.md "tunnelx 是纯 Java 应用（81 个 src/*.java，包 Tunnel），无 C/C++ 原生层，上游构建入口为 javac(build)+jar(jmake)"
  - ref: notes.md "上游无 20190701 对应 tag（5 个候选命名全 404）；GitHub 官方 tag R2019a 的 src/ 与 Debian orig 包 tunnelx_20190701.orig.tar.gz 逐字节一致（diff -rq 无差异），故以 R2019a 归档为源码 URL"
  - ref: notes.md "OHOS 无 PATH 内 java：配方定位 HNP 预装 ~/bishengjdk17，缺失时经 conan get() 从 cmd-pkgs 官方通道安装（R33：不使用裸 shell 变量 / 不 curl）"
  - ref: notes.md "OHOS /tmp 不可写（E002）：安装的 bin/tunnelx 启动器以 -Djava.io.tmpdir 重定向到 $TMPDIR/$HOME/tmp，覆盖上游 FileAbstraction.java:136-142 的 tmpdir 回退链"
  - ref: notes.md "JAR 内必须包含 symbols/listdir.txt 与 tutorials/listdir.txt（上游 jmake 的 ls -1 步骤），否则 FileAbstraction.java:146-160 的类加载器资源查找在未解包场景失效"
  - ref: notes.md "BiSheng OpenJDK 17 仅含 libawt/libawt_headless，无 libawt_xawt：AWT/Swing 无法创建窗口（HeadlessException），GUI 为平台限制，构建/打包/加载不受影响"
  - ref: notes.md "上游无任何自动化测试（无 JUnit/test 源/make check/ctest/pytest/autopkgtest），唯一入口为 GUI 主类 Tunnel.MainBox；test.sh T4 以栈帧含 Tunnel.MainBox.main 断言入口装配正确"
  - ref: notes.md "CI L2 smoke test 探测 <bin> --version|--help；上游 GUI 主类不适用，须由安装的 bin/tunnelx 启动器承接该 CLI 契约（在 JDK 探测之前处理，无需 JVM，退出码 0）"
  - ref: notes.md "Java 包安装 bin/ 启动器时必须同步提供 --version/--help 契约，否则 CI 的 L2 平台功能矩阵只能记 skip（<bin> version/help failed）"
