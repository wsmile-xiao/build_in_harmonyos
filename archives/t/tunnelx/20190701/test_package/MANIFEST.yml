# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 本文件如实记录 tunnelx 20190701 的上游测试入口核验结果。
#
package: tunnelx/20190701
homepage: "https://github.com/goatchurchprime/tunnelx"

# ── 上游测试入口核验（真实命令与原始输出见 notes.md「上游测试入口」节）──
# $ find <src> -iname '*test*' -o -iname '*Test*'        → 空（无测试目录/文件）
# $ grep -rln 'junit\|@Test\|org.junit' <src>/            → 空（无 JUnit）
# $ grep -rn 'public static void main' <src>/*.java
#     src/MainBox.java:596:    public static void main(String args[])
#     src/PrintScaleDialog.java:192://	public static void main(String[] args)   ← 已注释
# $ find <src> -name 'debian' -prune -o -name '*test*' -print  → 空（无 autopkgtest）
# 结论：上游无自动化测试（无 JUnit / 无 test 源文件 / 无 make check / 无 ctest /
#       无 pytest / 无 autopkgtest）。唯一可执行入口为 GUI 主类 Tunnel.MainBox。
upstream_check_command: "N/A — 上游无 make check/ctest/pytest/autopkgtest（0 个自动化用例）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A — 上游仅提供 GUI 入口：java -ea -Xmx3000M -cp tunnelx.jar Tunnel.MainBox <datadir>"

# 上游实际运行的测试程序（上游无自动化用例；此处登记唯一可执行入口的核验结果）
upstream_tests:
  - file: src/MainBox.java
    source: tunnelx-R2019a/src/MainBox.java
    description: >-
      上游唯一可执行入口 Tunnel.MainBox.main（AWT/Swing GUI，需图形显示）。
      HarmonyOS BiSheng OpenJDK 17 只有 libawt/libawt_headless、无 xawt 后端，
      headless 运行在 MainBox.java:423 的 JFrame 构造处抛 HeadlessException
      （栈帧含 Tunnel.MainBox.main）——test.sh T4 即据此断言入口已正确装配。
    command: "java -cp tunnelx.jar Tunnel.MainBox --quiet"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: >-
      T1 包布局(lib/tunnelx.jar + bin/tunnelx 启动器)；T2 JAR 清单
      Main-Class=Tunnel.MainBox；T3 打包内容(Tunnel/*.class≥230 +
      symbols/listdir.txt + tutorials/listdir.txt + symbols/helpfile.md)；
      T4 上游入口可达性；T5 鸿蒙启动器自动定位 BiSheng JDK 并拉起应用；
      T5b 启动器 CLI 契约(bin/tunnelx --version/--help 均 exit 0，同 CI L2
      smoke test 口径)；T6 鸿蒙探针（OHOS-1 平台/OHOS-2 java.io.tmpdir
      重定向 + PKG-1..5 包内容）。
    command: "bash test.sh <package_dir>"
  - file: TunnelOhosProbe.java
    description: >-
      消费者侧 Java 探针（package Tunnel，与上游同为包级私有，可直接断言
      打包字节码身份）：OHOS-1/OHOS-2 鸿蒙平台断言 + PKG-1 上游版本标记
      version2019-07-01 DoES + PKG-2..4 类加载器资源查找
      (symbols/listdir.txt=38、tutorials/listdir.txt=8——上游 jmake 的
      `ls -1 symbols > symbols/listdir.txt` 使列表含 listdir.txt 自身，
      消费端 src/FileAbstraction.java:194,718 会过滤该名) +
      PKG-5 上游 Vec3d 几何内核。
    command: "java -cp tunnelx.jar:<classes> Tunnel.TunnelOhosProbe"

# 测试断言总数 (近似值, 用于质量评估)
#   上游自动化用例 = 0（如实申报，见上）
#   本包新增消费者测试 = test.sh 的 11 项检查 + 鸿蒙探针 7 项断言 = 18
assertion_count: 18
upstream_test_count: 0
harmony_specific_test_count: 2
