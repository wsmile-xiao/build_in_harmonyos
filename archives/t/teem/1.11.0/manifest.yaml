# 版本级 manifest
# 文件位置: archives/t/teem/1.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: teem

# 版本号
version: "1.11.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceforge.net/projects/teem/files/teem/1.11.0/teem-1.11.0-src.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 构建系统（用于快速查询）
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - cmake/4.1.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 版本要求更新：原 CMAKE_MINIMUM_REQUIRED(VERSION 2.4) 不兼容 CMake 4.x，需更新为 VERSION 3.5"
  - "废弃模块处理：CMAKE_EXPORT_BUILD_SETTINGS 在 CMake 2.8+ 已移除，需注释掉 INCLUDE(Export/CMAKE_EXPORT_BUILD_SETTINGS)"
  - "可选依赖处理：ZLIB/PNG/BZIP2 缺失时 CMake 自动禁用，不影响核心编译"
  - "实际构建系统识别：teem 使用 cmake 构建，不是 autotools"
  - "测试通过率评估：94% 通过率（33/35）表明核心功能可用"

# ============================================================
# 打包信息
# ============================================================

# 预编译包信息
package:
  # 预编译包文件名
  file: "teem-1.11.0-ohos-aarch64.tar.gz"

  # 包大小（KB）
  size: 17356

  # 调试符号包
  debug_file: "teem-1.11.0-ohos-aarch64-debug.tar.gz"
  debug_size: 1800

  # 包含文件数
  files_count: 42

  # ELF 签名状态
  elf_signed: true

# ============================================================
# 测试信息
# ============================================================

# 测试结果摘要
test_result:
  total: 35
  passed: 33
  failed: 2
  pass_rate: 94
  failed_tests:
    - "probeSS_ctmr04"
    - "probeSS_ctmr10"
  duration: "11.10 seconds"

# ============================================================
# 功能验证
# ============================================================

# 功能验证命令
verification:
  commands:
    - "unu --version"
    - "tend --version"
    - "nrrdSanity"
  results:
    - "Teem version 1.11.0 (19 Dec 2012)"
    - "Teem version 1.11.0 (19 Dec 2012)"
    - "nrrd sanity check passed"