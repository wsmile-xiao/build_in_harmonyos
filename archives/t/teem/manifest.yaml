# 软件级 manifest
# 文件位置: archives/t/teem/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: teem

# 显示名
display: "Teem"

# 一句话描述
description: "Tools to process and visualize scientific data and images - a collection of C libraries for scientific data processing"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: data

# 官网 URL
homepage: "https://sourceforge.net/projects/teem/"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "CMake 版本要求至少 3.5（旧版本 CMAKE_MINIMUM_REQUIRED 2.4 不兼容 CMake 4.x）"
    - "废弃的 CMAKE_EXPORT_BUILD_SETTINGS 模块需注释掉"
    - "可选依赖（ZLIB/PNG/BZIP2）缺失时自动禁用，不影响核心功能"

  # 跨版本通用依赖
  common_dependencies:
    - cmake

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.11.0":
    status: published
    build_date: 2026-06-17
    published_as: teem