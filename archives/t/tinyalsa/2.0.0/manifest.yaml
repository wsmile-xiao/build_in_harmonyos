# 版本级 manifest —— tinyalsa 2.0.0
# 文件位置: archives/t/tinyalsa/2.0.0/manifest.yaml（ARCHIVE-SPEC v2.0）

# ============================================================
# 必须字段
# ============================================================

version: "2.0.0"
software: "tinyalsa"

# 编译状态（O5 口径：未合并 + 未见 release upload 一律 built）
# published | built | failed | archived
status: built

build_date: "2026-09-25"
build_system: "cmake"

# ============================================================
# 源码信息（W0 复核：与 conan-center-index recipes/tinyalsa 2.0.0 条目逐字一致）
# ============================================================

source:
  url: "https://github.com/tinyalsa/tinyalsa/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "573ae0b2d3480851c1d2a12503ead2beea27f92d44ed47b74b553ba947994ef1"
  tar_format: tar.gz

# ============================================================
# 构建配置（上游 make / cmake / meson 三入口，manifest 选定 cmake）
# ============================================================

build:
  system: "cmake"

  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DTINYALSA_BUILD_UTILS=OFF"
    - "-DTINYALSA_BUILD_EXAMPLES=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"

  # 零运行依赖（只用内核 UAPI 头 + libdl，不链 alsa-lib）；
  # gtest 只在 build() 编译上游 tests/ 时以 test_requires 挂载，不进消费面。
  dependencies:
    - "gtest/1.17.0 (test_requires)"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息（本包上游源码零改动）
# ============================================================

patches_applied: []

# ============================================================
# 测试结果（同一台设备、同一次 conan create 日志复算）
# ============================================================

test_results:
  type: conan-verify
  upstream_total: 68
  upstream_ran: 2
  upstream_passed: 2
  upstream_skipped: 66
  upstream_failed: 0
  # PR 正文申报的上游用例数 N（候选数法最大值，防少报）：上游当前 HEAD
  # (9fab97ca) 的 gtest 框架注册数 70 > 本版本注册 68 > HEAD 源码宏 42 > 版本源码宏 40
  declared_n: 70
  declared_n_head_registered: 70
  declared_n_version_registered: 68
  test_package_assertions: 10
  test_package_passed: 10
  note: >-
    上游 gtest 注册数 68（gtest --gtest_list_tests 清点；源码 TEST 宏 40，
    差额 28 全部来自 mixer_test.cc 14 个 TEST_P × Range(0,3) 参数化展开）。
    设备 /dev/snd 与 controlC* 实测 EACCES ⇒ 66 条设备依赖用例按环境限制记
    SKIP（不计 PASS），与设备无关的 2 条真实运行且通过；test_package 消费者
    断言 10/10。PR 正文申报 N=70（上游当前 HEAD 注册数下界），与本版本 68
    的差额 2 = HEAD 在 v2.0.0 之后新增 3 项、删除回环用例 1 项，逐项归因见
    reports/pr-body.md；对应四分项 70 = PASS 2 + FAIL 0 + SKIP 66 + NOT_RUN 2。

# ============================================================
# 知识沉淀（行尾注释 # knowledge_ref: 是 check_knowledge_gap 认的唯一形态）
# ============================================================

knowledge_gained:
  - "上游 tests/ 只接 Bazel（cc_test）时，配方在 build() 内生成 CMake 子工程编译同一份 tests/src/*.cc 并经 ctest 运行；conan gtest 1.17.0 只导出 gtest::gtest 且 cpp_info.libs 只有 gtest，gtest_main 需自带；钩子必须写在 build_requirements() 里调 self.test_requires()。 # knowledge_ref: DRAFT-E738"
  - "OHOS 设备 /dev/snd 目录与 controlC* 全部 EACCES：音频设备依赖用例先用 os.open 探针拿 errno 逐字进日志，再按环境限制记 SKIP（不写 PASS），非设备用例照常实跑并由 ctest 把关。 # knowledge_ref: DRAFT-E739"
  - "上游根目录带 Bazel BUILD 文件时，大小写不敏感 FS 上 cmake_layout 默认 build/ 会撞名 NotADirectoryError，layout 需显式 build_folder。 # knowledge_ref: E470"
  - "CMake 4.x 拒绝 cmake_minimum_required(<3.5)：-DCMAKE_POLICY_VERSION_MINIMUM=3.5 必须走命令行（写进 toolchain 的 cache 变量在 CMakeLists 解析后才加载，无效）。 # knowledge_ref: E321"
