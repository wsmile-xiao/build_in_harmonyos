# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 详见 docs/TEST_QUALITY_SPEC.md
#
# 上游测试入口现状（实测 tinyalsa v2.0.0 源码）：
#   * tests/ 下 6 个 gtest 用例文件（C++17，gtest 断言）；
#   * 上游只接了 Bazel（BUILD 的 cc_test + @googletest//:gtest_main），
#     CMakeLists.txt / meson.build / Makefile 三处都没有测试目标，
#     也没有 `make check` / `ctest` / `meson test` 任何入口。
#   ⇒ 配方在 build() 内生成 CMake 子工程编译同一份 tests/src/*.cc，
#     经 ctest 运行（层 1）。未修改任何上游测试文件。

package: tinyalsa/2.0.0
homepage: "https://github.com/tinyalsa/tinyalsa"

# 上游等效清点入口（gtest 注册数口径）
upstream_check_command: '"<conan build>/upstream-tests/build/tinyalsa_upstream_tests" --gtest_list_tests'

# conanfile.py build() 内已集成上游测试
upstream_test_in_build: true
upstream_test_command: 'ctest --test-dir "<conan build>/upstream-tests/build" --output-on-failure'

# 上游测试清单（全部由上述一个 gtest 二进制承载；注册数 = gtest 口径）
upstream_tests:
  - file: tests/src/mixer_test.cc
    source: tinyalsa-2.0.0/tests/src/mixer_test.cc
    description: "Mixer 控制接口；源码 15 个 TEST 宏（1 普通 + 14 TEST_P），参数化 Range(0,3) 展开后注册 43 条"
    command: './tinyalsa_upstream_tests --gtest_filter="MixerTest.*"'
  - file: tests/src/pcm_out_test.cc
    source: tinyalsa-2.0.0/tests/src/pcm_out_test.cc
    description: "PCM 播放路径（PcmOutTest 13 条 + PcmOutMmapTest 1 条），注册 14 条"
    command: './tinyalsa_upstream_tests --gtest_filter="PcmOut*"'
  - file: tests/src/pcm_params_test.cc
    source: tinyalsa-2.0.0/tests/src/pcm_params_test.cc
    description: "pcm_params 接口，注册 5 条"
    command: './tinyalsa_upstream_tests --gtest_filter="PcmParamsTest.*"'
  - file: tests/src/pcm_in_test.cc
    source: tinyalsa-2.0.0/tests/src/pcm_in_test.cc
    description: "PCM 录音路径，注册 3 条"
    command: './tinyalsa_upstream_tests --gtest_filter="PcmInTest.*"'
  - file: tests/src/pcm_test.cc
    source: tinyalsa-2.0.0/tests/src/pcm_test.cc
    description: "格式转换与 pcm_open/close，注册 2 条"
    command: './tinyalsa_upstream_tests --gtest_filter="PcmTest.*"'
  - file: tests/src/pcm_loopback_test.cc
    source: tinyalsa-2.0.0/tests/src/pcm_loopback_test.cc
    description: "回环卡（loopback）收发联测，注册 1 条"
    command: './tinyalsa_upstream_tests --gtest_filter="PcmLoopbackTest.*"'

# 口径说明：源码 TEST 宏 40 个；参数化用例经 INSTANTIATE_TEST_SUITE_P
# 的 Range(0, kMaxCardIndex+1)=3 组展开后，gtest 注册数 = 68（两种口径
# 差额 28 全部来自 mixer_test.cc 的 14 个 TEST_P × 3 组参数）。
upstream_test_count_source_macros: 40
upstream_test_count_registered: 68
# 上游当前 HEAD（9fab97ca, 2026-07-27）同口径：源码宏 42、框架注册 70。
# PR 申报 N 取候选数法最大值 70（防少报，对照 notes/device-facts.md §三.27
# 的「声明 N 下界 = 上游当前 HEAD 注册项数」）；与被审版本 68 的差额 +2 =
# HEAD 在 v2.0.0 之后新增 3 项（MixerTest.NullParametersCheck 等）、
# 删除回环用例 1 项（pcm_loopback_test.cc），逐项归因见 reports/pr-body.md。
upstream_test_count_source_macros_head: 42
upstream_test_count_registered_head: 70
declared_n: 70

# test_package 中自带的测试（消费者视角验证，不进上游分母）
test_package_tests:
  - file: test.c
    description: "消费者 10 项断言：版本宏 ×2、pcm_format_to_bits ×4、空指针安全 ×1、不存在声卡负向路径 ×3"
    command: "./test_tinyalsa"

# 测试断言总数（= PR 正文「鸿蒙特有测试」行）
test_count: 10
assertion_count: 10

# 设备依赖说明（OHOS 实测）：/dev/snd 目录与 controlC* 全部 EACCES，
# 66 条设备依赖用例按环境限制记 SKIP（不计 PASS）；与设备无关的 2 条
# （MixerTest.OpenAndClose、PcmTest.FormatToBits）真实运行。
device_dependent_skipped: 66
device_independent_ran: 2
