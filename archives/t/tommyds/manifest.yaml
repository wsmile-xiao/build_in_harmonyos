# 软件级 manifest — tommyds
# 遵循 ARCHIVE-SPEC v2.0

software: tommyds
display: "TommyDS"
description: "C 高性能数据结构和容器库 — 数组、哈希表、树、trie 等，为高性能设计"
category: library
homepage: "https://www.tommyds.it"
license: BSD-2-Clause
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游是 header + 单 C 聚合文件(tommy.c 内联全部实现) 的纯 C 数据结构库，无 configure、无 install 目标，非 autotools"
    - "库本质是静态库 libtommy.a：conanfile build() 用 Conan Toolchain 编译器直接编译 tommyds/tommy.c，头文件来自 tommyds/ 目录"
    - "上游 Makefile 的 CFLAGS 带 -march=native，Conan 构建需避免该 flag（用工具链默认 arch flag）"
    - "make check 目标运行 tommycheck 自检程序（验证全部数据结构的正确性），可作为上游测试集成进配方"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.0":
    status: published
    build_date: "2026-09-03"
