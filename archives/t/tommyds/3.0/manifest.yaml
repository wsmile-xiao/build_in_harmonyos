# 版本级 manifest — tommyds 3.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0"
software: tommyds

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/amadvance/tommyds/archive/refs/tags/v3.0.tar.gz"

  # 源码校验和
  sha256: "b9e4572ee5965d85880c7c8b8752bfaac1530767206d44887c671f26ef249d3e"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "tommyds 上游无 configure/install 目标，纯 Makefile；库为 tommy.c 聚合文件 + tommyds/ 头文件的 C 数据结构库，按静态库手工打包 [ref: E097]"
  - "上游 Makefile CFLAGS 含 -march=native，Conan 交叉构建（armv8 OHOS）需移除该 flag，使用工具链默认 arch [ref: E543-draft-TOMMYDS]"

# 本次新增的知识草稿（路径 B 知识贡献，DRAFT 状态，待主编合入）
knowledge_drafts:
  - "E543-draft-TOMMYDS"
