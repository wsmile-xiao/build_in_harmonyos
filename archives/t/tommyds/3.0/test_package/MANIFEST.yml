# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tommyds/3.0
homepage: "https://www.tommyds.it"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "tommycheck"

# 上游实际运行的测试程序
upstream_tests:
  - file: check.c
    source: tommyds-3.0/check.c
    description: "TommyDS 自检 — 覆盖 list/array/arrayblk/hashtable/hashdyn/hashlin/tree/trie/trie_inplace 全部数据结构的正确性与性能回归"
    command: "./tommycheck"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 用安装的 tommyds 头文件构建 tommy_hashtable，验证 insert/search/remove 全流程"
    command: "./test_tommyds"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3000
