knowledge_gained:
  - "ThreadWeaver registers 7 ctest tests in autotests/ via ecm_add_test; benchmarks/QueueBenchmarks has its add_test commented out upstream (never registered); examples/ (HelloWorld/HelloWorldRaw/HelloInternet/ThumbNailer) are demo programs with no test registration."
  - "ThreadWeaver is the rare KF5 library whose only runtime dependency is QtCore (metainfo.yaml tier 1 functional): the consumer graph is qt5-qtbase/5.15.2.2 + ecm/6.26.0 only, the lightest KF5 recipe in the chain."
  - "The OHOS toolchain maps os=OHOS to CMAKE_SYSTEM_NAME=HarmonyOS (no UNIX, cross-compiling); forcing CMAKE_SYSTEM_NAME=Linux restores UNIX=1 and makes the ECM ctest registration build the 7 tests (chain-wide convention, kcoreaddons5/kitemviews5 precedent)."
  - "The 7 QTEST targets link Qt5::Test and run plain QCoreApplication event loops (QTEST_MAIN / QTEST_APPLESS_MAIN): fully headless, no GUI, no D-Bus — the whole suite runs natively on the OHOS PC runner with no exclusions."
  - "E537-class: OHOS refuses to mmap PROT_EXEC a shared library whose ELF was rewritten after linking; CMAKE_BUILD_WITH_INSTALL_RPATH=ON makes the linker write the final install RPATH so the install step does not rewrite libKF5ThreadWeaver.so; every packaged ELF is then re-signed with llvm-objcopy + binary-sign-tool (kitemmodels/kirigami/ki18n precedent)."
  - "Unversioned DT_SONAME (CMAKE_PLATFORM_NO_VERSIONED_SONAME + CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG) and the mkspec/qplatformdefs + AUTOMOC/AUTORCC/AUTOUIC wiring are reused verbatim from the validated kcoreaddons5/kconfig5/kitemviews5 KF5 skeleton."
