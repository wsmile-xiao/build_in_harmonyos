version: 1
package: threadweaver5/5.116.0
homepage: https://invent.kde.org/frameworks/threadweaver

tests:
  upstream:
    status: planned
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    source: "threadweaver-5.116.0/autotests/"
    expected:
      - ThreadWeaverJobTests
      - ThreadWeaverSequencesTests
      - ThreadWeaverQueueTests
      - ThreadWeaverDeleteTest
      - ThreadWeaverLifecycleTest
      - ThreadWeaverShutdownOnQApplicationQuitTest
      - ThreadWeaverQueueFactoryTest
  package:
    status: planned
    source: test.cpp
    command: "./test_threadweaver5"
    description: >-
      Drives the real ThreadWeaver public API (Job subclassing, JobPointer,
      Sequence ordering with a failing job, Collection, the global stream()
      and enqueue()/make_job() queueing helpers, QObjectDecorator
      started/done signals, ResourceRestrictionPolicy concurrency cap, Job
      status transitions) and asserts HarmonyOS-specific behaviour: the
      loaded libKF5ThreadWeaver.so carries the unversioned DT_SONAME plus a
      DT_RUNPATH (E537 install-RPATH adaptation) and a .codesign section
      (binary-sign-tool re-signing after install).

notes:
  - "ThreadWeaver is a pure QtCore library (the only Q_OS_ guard upstream is
     Q_OS_WIN in debuggingaids.h); OHOS runs the headless QTEST_MAIN bodies
     natively (plain QCoreApplication, no GUI, no session bus)."
  - "The recipe forces CMAKE_SYSTEM_NAME=Linux so CMake defines UNIX and does
     not report a cross build; without that ECM skips the ctest registration
     of the 7 upstream autotests and the POSIX flag/rpath settings."
  - "Upstream tests are run from build() with ctest; any test that cannot run
     in the headless sandbox is listed in notes.md with the concrete reason."
