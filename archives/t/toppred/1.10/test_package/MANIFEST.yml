# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试框架: automake 简单测试驱动（test/Makefile.am TESTS 注册 7 个 shell 脚本；
# float.test 被上游注释、未注册，不计入）。每个脚本内部含多个行为断言（运行
# ../src/toppred 后比对 stdout/stderr 基准文件或检查退出码）。

package: toppred/1.10
homepage: "https://github.com/bioinfo-center-pasteur-fr/toppred"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\", args=[\"-j1\"])"

# 上游实际运行的测试程序（TESTS 注册口径，7 项）
upstream_tests:
  - file: test/toppred.test
    source: toppred-1.10/test/toppred.test
    description: "基础预测冒烟：单序列运行 + 同序列双输入文件"
    command: "../src/toppred -g none -t none <fasta>"
  - file: test/hydro.test
    source: toppred-1.10/test/hydro.test
    description: "疏水性刻度文件加载：GES/GVH/KD 三种刻度逐一加载并校验输出"
    command: "../src/toppred -g none -t none -H <scale> -o <out> <fasta>"
  - file: test/detect_segments.test
    source: toppred-1.10/test/detect_segments.test
    description: "片段检测边界：序列开头/结尾片段与无片段三场景，stdout/stderr 基准比对"
    command: "../src/toppred -g none -t none <fasta> + diff"
  - file: test/seqlen.test
    source: toppred-1.10/test/seqlen.test
    description: "最短序列边界：序列长度等于窗口大小时的输出与错误基准比对"
    command: "../src/toppred -g none -t none <fasta> + diff"
  - file: test/construct_topos.test
    source: toppred-1.10/test/construct_topos.test
    description: "拓扑枚举边界：拓扑过多不可全算/多算少印/仅疑似片段三场景基准比对"
    command: "../src/toppred -g none -t none <fasta> + diff"
  - file: test/naming.test
    source: toppred-1.10/test/naming.test
    description: "序列命名：匿名序列检测与命名序列（Q60967）标识，基准比对"
    command: "../src/toppred -g none -t none <fasta> + diff/grep"
  - file: test/math.test
    source: toppred-1.10/test/math.test
    description: "PNG 图形除零防护（-g png，需 gnuplot+libgd）；OHOS 无 gnuplot，上游脚本自带 exit 77 跳过守卫，automake 计为 SKIP"
    command: "(skipped: gnuplot unavailable, upstream exit-77 guard)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：对打包后的 toppred 二进制端到端运行 min_seqlen 场景并断言预测输出，另验证打包的 3 个疏水性刻度文件可加载"
    command: "bash test.sh (conanrun env)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
# 上游 7 脚本内部断言约 35（run/exit-code + diff/grep 基准比对），
# 消费者 test.sh 断言 5（1 片段数 + 1 跨膜区段位置 + 3 刻度加载）。
