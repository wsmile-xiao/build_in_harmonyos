  sha256: "3593666a4ae65b752e8d7945dc9ce1b8d21d888190f9917c31c48335157394b3"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
