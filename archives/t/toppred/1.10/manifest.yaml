  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "2014 年代预生成 configure：显式传 gnu 双 triplet 绕开 config.guess 探测与 ohos triplet 解析（a52dec 同例），无需 automake tool_requires"
