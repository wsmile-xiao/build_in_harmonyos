# conandata.yml — ttysnoop 0.12d
# Upstream (Carl Declerck, last release 1998-04-08) no longer exists: Debian's
# copyright file records the source as "extinct, originally from
# ftp.cc.gatech.edu".  The pristine release tarball survives as the
# Debian/Ubuntu orig tarball (unmodified upstream files, 1994-1998 mtimes,
# owner carl).  The Ubuntu archive copy below is byte-identical to the Debian
# pool copy; its sha256 matches the Checksums-Sha256 entry of the signed
# ttysnoop_0.12d-6.2.dsc.  None of Debian's own patches are pulled from it.
sources:
  "0.12d":
    url: "https://archive.ubuntu.com/ubuntu/pool/universe/t/ttysnoop/ttysnoop_0.12d.orig.tar.gz"
    sha256: "645f9c174f2d1785a2f333a585175212ba3e8911c69e62d555fc2ab92dd815d8"

patches:
  "0.12d":
    - patch_file: "patches/0001-common.c.patch"
      patch_description: "Add conf_path(): TTYSNOOP_SNOOPTAB / TTYSNOOP_SPOOLDIR may replace the compiled-in snooptab and spool paths, which are read-only or missing on OHOS; ignored when running as root or set-id. Include stdlib.h/unistd.h (exit/write were undeclared)."
      patch_type: "portability"
    - patch_file: "patches/0002-common.h.patch"
      patch_description: "Declare conf_path()."
      patch_type: "portability"
    - patch_file: "patches/0003-ttysnoop.c.patch"
      patch_description: "Client: spool directory from conf_path(); bounded snprintf() of the socket path instead of sprintf() of argv[1] into a 128-byte stack buffer; names longer than sun_path are refused."
      patch_type: "portability"
    - patch_file: "patches/0004-ttysnoops.c.patch"
      patch_description: "Server: UNIX98 ptys (posix_openpt/grantpt/unlockpt/ptsname, after Debian 02_unix98_pty.diff by Peter Samuelson) since BSD ptys do not exist on OHOS; utmp cleanup through a NULL-checked getutent() scan because getutline() is neither declared nor exported by the OHOS libc.so; snooptab/spool via conf_path() with a bounded socket path; initialised accept() address length (Debian 03_address_length.diff); fail closed when the snoop user is unknown; include sys/wait.h and time.h."
      patch_type: "portability"
