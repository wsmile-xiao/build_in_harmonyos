package: ttysnoop/0.12d
homepage: https://tracker.debian.org/pkg/ttysnoop

# ── 上游测试清点（R51）────────────────────────────────────────────
# ttysnoop 0.12d 上游没有任何测试，清点证据：
#   1) 官方包 ttysnoop_0.12d.orig.tar.gz（sha256 645f9c17…d815d8，8514 B）解包后只有
#      9 个文件：Makefile README common.c common.h config.h snooptab.dist
#      ttysnoop.8 ttysnoop.c ttysnoops.c —— 无 tests/、无 t/、无 *test* 文件。
#   2) Makefile 目标全集：all ttysnoops ttysnoop ttysnoops.o ttysnoop.o common.o
#      clean install；`make -n check` → "No rule to make target 'check'"。
#   3) 源码中无 assert( 与测试框架代码。
# 结论：上游 0 用例，按“上游无测试、适配后补全”申报。
upstream_check_command: "none (upstream ships no test suite)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests: []

# ── 适配后消费者测试（test_package/test_ttysnoop.c）────────────────
# test_package 用 OHOS 工具链编译 test_ttysnoop.c，由它驱动包内的 bin/ttysnoops 与
# bin/ttysnoop；同一个可执行文件还被 ttysnoops 当作“登录程序”在其分配的 pty 上执行。
test_package_tests:
  - file: test_ttysnoop.c
    description: >-
      S1【鸿蒙特有，9 项】ttysnoops 以会话首进程身份跑在 pty 上（与 getty/telnetd 拉起方式
      一致），TTYSNOOP_SNOOPTAB 指定的 snooptab 把会话镜像到第二个 pty：登录程序运行在
      ttysnoops 用 posix_openpt/grantpt/unlockpt/ptsname 新分配的 pty 上且为其控制终端；
      会话端与监视端的输入都送达登录程序，输出同时到达两端；登录程序结束后 ttysnoops
      以 0 退出（utmp 清理不再解引用 getutline() 的 NULL）
    command: "./test_ttysnoop <pkg>/bin/ttysnoops <pkg>/bin/ttysnoop"
  - file: test_ttysnoop.c
    description: >-
      S2（3 项）ttysnoop 客户端：无参数打印 usage 退出 1；服务端不存在报
      "can't connect to server" 退出 1；超长 pty 名被 "socket path too long" 拒绝（上游为
      sprintf 溢出 128 字节栈缓冲）
    command: "./test_ttysnoop <pkg>/bin/ttysnoops <pkg>/bin/ttysnoop"
  - file: test_ttysnoop.c
    description: >-
      S3（4 项，仅在工作目录允许 AF_UNIX bind() 时执行；HMDFS 拒绝 bind 时打印
      "skip - S3 ... errno" 并不计入通过数，见 E461）socket 模式：会话套接字出现在
      TTYSNOOP_SPOOLDIR；客户端连上并收到口令提示；错误口令被拒且服务端挂断、无
      "Verified OK"；登录程序结束后 ttysnoops 以 0 退出
    command: "./test_ttysnoop <pkg>/bin/ttysnoops <pkg>/bin/ttysnoop"
  - file: test_ttysnoop.c
    description: >-
      以 root 运行时 S1/S3 不执行（TTYSNOOP_* 覆盖对特权进程按设计失效），改为断言
      特权 ttysnoops 忽略 TTYSNOOP_SNOOPTAB（仍报 can't open /etc/snooptab）
    command: "./test_ttysnoop <pkg>/bin/ttysnoops <pkg>/bin/ttysnoop"

assertion_count: 16
