software: ttysnoop
display: "ttysnoop"
description: "Snoop on a login tty: mirror a terminal session to another tty or to a password-protected socket client"
category: system
homepage: "https://tracker.debian.org/pkg/ttysnoop"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Upstream (1998) looks for BSD ptys /dev/ptyXX only; the server now allocates UNIX98 ptys (after Debian's 02_unix98_pty.diff)."
    - "getutline() is neither declared nor exported by the OHOS libc.so (and returns NULL in musl); utmp cleanup uses a NULL-safe getutent() scan (draft E639)."
    - "The compiled-in snooptab and spool paths (read-only or missing on OHOS) can be replaced through TTYSNOOP_SNOOPTAB / TTYSNOOP_SPOOLDIR for unprivileged use; ignored when privileged or set-id."
    - "Upstream bugs on the used code paths fixed: uninitialised accept() length, fail-open authentication when the snoop user is unknown, unbounded sprintf of the client's pty argument."
  common_dependencies: []

versions:
  "0.12d":
    status: built
    build_date: "2026-09-27"
