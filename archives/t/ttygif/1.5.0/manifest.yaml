patches_applied:
  - patches/0001-ttygif-work-headless-and-honor-TMPDIR.patch
  - patches/0002-Makefile-VERSION-string-1.5.0.patch

knowledge_gained:
  - "上游 ttygif 1.5.0 是纯 C（4 个 .c + 4 个头），不是 icholy/ttygif 后来的 Go 重写；.go 文件数实测为 0"
  - "取源必须用不带 v 前缀的 tag：codeload.github.com/icholy/ttygif/tar.gz/refs/tags/1.5.0；refs/tags/v1.5.0 实测 404"
  - "codeload URL 末段是裸版本号（无 .tar.gz 扩展名）⇒ conan get() 必须显式传 filename=，否则猜错解码器（与 vamps 的 SourceForge /download 同型坑）"
  - "Makefile 的 `CC = gcc` 是裸赋值 ⇒ 环境变量 CC 会被吞，只有 make 命令行赋值能覆盖；CFLAGS 用 `+=` ⇒ 一旦命令行给 CFLAGS 就整体丢弃，连带丢掉 -DVERSION，所以只覆盖 CC、不覆盖 CFLAGS"
  - "鸿蒙 PC 的 /tmp 在只读挂载上（touch /tmp/x -> Read-only file system）；ttygif 在 main() 开头无条件 mkdtemp(\"/tmp/ttygif.XXXXXX\") ⇒ 任何调用（含 --version/--help）都先 fatal 退出。补丁改走 TMPDIR（E002 的正解），未设置时回落 /tmp 保持上游语义"
  - "同一个 main() 里 --help/--version 的判定排在 WINDOWID 检查之后 ⇒ 无头环境下连版本号都取不到；补丁把它提到所有显示相关初始化之前，CI 的 L2 冒烟探针才有稳定读数"
  - "上游 tag 1.5.0 的 Makefile 里 VERSION 仍写 \"1.4.0\"（ttygif -v 打印该宏）⇒ 不修则包自述版本与包版本矛盾"
  - "Makefile 用 `UNAME := $(shell uname)` 只匹配 Darwin/Linux，本机 uname 返回 HarmonyOS ⇒ -DOS_DARWIN/-DOS_LINUX 都不定义；但全树 grep OS_LINUX 命中 0 次、只有 3 处 #ifdef OS_DARWIN ⇒ 默认编译路径就是 Linux 行为。**这是假雷，不要为它打补丁、不要加 -DOS_LINUX、更不要据此判平台不兼容**"
  - "运行期工具依赖用 requires(<tool>/<ver>, headers=False, libs=False, run=True)（datefudge→coreutils、fcheck→perl、alive→guile 同型）；tool_requires/run=False 不进 conanrun（E365/E442，presage 三轮 CI 实证）"
  - "已发布的 imagemagick 配方只声明 components、没有 cpp_info.bindirs ⇒ 即便 run=True，它的 bin/ 也不会进 conanrun 的 PATH（实测 conanrun.sh 里只出现 libpng 的 bindir）。⇒ 消费者需自行让 convert 可达；本包在 test_package 里按依赖包目录显式解析，不把别的包的绝对缓存路径写进本包 env_info"
  - "xwd 在本仓不是 conan 包：archives/x/xwd/1.0.9 只有 manifest.yaml/notes.md/patches（无 conanfile.py），`conan download xwd --only-recipe -r=ohpcd` 报 Recipe 'xwd' not found ⇒ 依 R36/PF4 不得在本 PR 里捎带补它，改为在 README 里声明外部命令依赖，并把抓帧面登记为未执行项"
  - "上游测试提取脚本 ci/tools/extract_upstream_tests.sh 硬编码 /tmp ⇒ 在本平台必然失败，改用手工等价扫描（tar 全清单 + 六类标记 grep + find t/tests/test/spec + make -np 目标 dump），证据 reports/upstream-test-scan.txt"
  - "toybox /bin/sh 的命令替换 $(…) 会在只读的 /tmp 落临时件 ⇒ 测试脚本一律零 $(…)、零反引号，计数用 `wc -c < f > g` + `read` 传递"

upstream_tests_exist: false
upstream_test_audit: "Audited the ttygif 1.5.0 release tarball (14 entries, 13 files: .gitignore, LICENSE, Makefile, README.md, io.c, io.h, string_builder.c, string_builder.h, ttygif.c, ttygif.png, ttyrec.h, utils.c, utils.h). No tests/t/spec directory; no test_*/​*_test.*/*.t/*.py/*.rb/*.pl file; a case-insensitive grep for test|spec|assert|fixture|_test|check hits only BSD licence prose plus two real assert() calls (io.c:59 sizeof(int)==4, ttygif.c:383 input!=NULL); `make -np` exposes exactly all/ttygif/install/uninstall/clean plus implicit rules — no check target, no TESTS variable. Scan kept at reports/upstream-test-scan.txt."
reason: "ttygif 1.5.0 ships no upstream test framework (no test directory, no `make check`, no assert bindings, 13 files total), and the framework extractor itself cannot run on this platform because it hardcodes the read-only /tmp. test_package/test.sh therefore adds 51 HarmonyOS consumer assertions that really execute the packaged binary; the X11 capture half is disclosed as unexecuted with measured evidence instead of being stubbed."
