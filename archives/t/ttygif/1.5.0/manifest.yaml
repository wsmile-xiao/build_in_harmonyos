version: "1.5.0"

software: ttygif

# published | built | failed | archived
# R29: 本地 conan create 真实通过但尚未发布 ⇒ built，不伪造 published
status: built

build_date: "2026-09-25"
build_system: makefile

source:
  url: "https://codeload.github.com/icholy/ttygif/tar.gz/refs/tags/1.5.0"
  sha256: "b5cc9108b1add88c6175e3e001ad4615a628f93f2fffcb7da9e85a9ec7f23ef6"
  tar_format: tar.gz

