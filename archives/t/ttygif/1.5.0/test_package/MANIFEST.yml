# test_package/MANIFEST.yml — 上游测试来源声明（CI L0e 必查，非空）
package: ttygif/1.5.0
homepage: "https://github.com/icholy/ttygif"

# 上游 ttygif 1.5.0（C 版）不含任何自动化测试：
#   * tarball 14 个条目（13 文件 + 1 目录项），无 tests/、无 t/、无 spec/
#   * Makefile 目标只有 all / ttygif / install / uninstall / clean，无 check、
#     无 TESTS、无 add_test/enable_testing/BUILD_TESTING
#   * 全仓 grep -rEni "test|spec|assert|fixture|_test|check" 仅命中 BSD 许可证
#     文案与 io.c/ttygif.c 的 assert.h/assert(sizeof(int)==4)/assert(input!=NULL)
# 清点证据：reports/upstream-test-scan.txt（手工等价扫描，见下方 reason）
upstream_tests_exist: false
upstream_test_command: ""

test_package_tests:
  - file: test.sh
    description: "鸿蒙消费者功能测试：CLI 语义（-v/-h/无参/坏输入/缺 WINDOWID）、TTYGIF_DEBUG 帧回放与命令编排断言（帧数/帧序/-delay 时序数学/-speed 换算/末帧 delay/-loop 0/-layers Optimize/输出名）、TMPDIR 暂存目录断言、以及用打包的 ImageMagick 真跑 convert 合成 GIF 的产物断言"
    command: "sh test.sh <ttygif_bindir> <imagemagick_bindir>"

assertion_count: 51

# 上游测试提取脚本 ci/tools/extract_upstream_tests.sh 在本平台必然失败：
# 它把临时目录硬编码成 /tmp，而鸿蒙 PC 的 /tmp 是只读 erofs 挂载
# （touch /tmp/x → "Read-only file system"）。因此本包改用**手工等价扫描**
# （tar 全清单 + 六类标记 grep + find t/tests/test/spec + make -np 目标枚举），
# 输出留档 reports/upstream-test-scan.txt，未执行项亦在此如实登记。
reason: |
  ttygif 1.5.0 ships no upstream test suite at all (no test directory, no
  `make check`, no assert framework, 13 files in the release tarball), and the
  framework's own extractor cannot run on this platform because it hardcodes
  the read-only /tmp.  The upstream-test inventory was therefore produced by a
  manual equivalent scan, and test_package/test.sh adds 51 HarmonyOS consumer
  assertions that execute the packaged binary end-to-end as far as the device
  allows.  The X11 capture half is reported as an unexecuted item with measured
  evidence rather than stubbed into a pass.
