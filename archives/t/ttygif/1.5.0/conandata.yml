# conandata.yml — ttygif 1.5.0
# 单一事实源：源码 URL + SHA256 + 补丁声明
# （conanfile.py 用 self.conan_data["sources"] 取源、apply_conandata_patches() 打补丁）
#
# 取源口径（R39 / PF7）：
#   上游 icholy/ttygif 的 tag **不带 v 前缀**：refs/tags/1.5.0。
#   refs/tags/v1.5.0 实测 HTTP 404（见 notes.md「已试过的失败方案」）。
#   deb.debian.org 池里的 ttygif_1.5.0.orig.tar.gz 与本 tarball sha256 逐字节
#   相同，但 PF7 把 Debian 池 URL 判为「下游重打包源」一律拦截 ⇒ 只用于 sha256
#   交叉校验，不写进 conandata/manifest。
#   镜像域名（gh-proxy.com / ghfast.top / cnb.cool 等）由 CI 自动回退，
#   配方不得手写（R39 违规 579 例）。
#
# URL 末段是裸 tag 名 1.5.0（无 .tar.gz 扩展名）⇒ conanfile.source() 必须
# 显式传 filename=，否则 conan 的 get() 按末段猜压缩格式会选错解码器
# （archives/v/vamps/0.99.2 的 SourceForge /download 同型坑）。

sources:
  url: "https://codeload.github.com/icholy/ttygif/tar.gz/refs/tags/1.5.0"
  sha256: "b5cc9108b1add88c6175e3e001ad4615a628f93f2fffcb7da9e85a9ec7f23ef6"

# 按顺序应用；均为 POSIX 可移植性 / 上游笔误修正，补丁新增行不含任何平台宏（R8/PF5）。
patches:
  - patch_file: "patches/0001-ttygif-work-headless-and-honor-TMPDIR.patch"
    patch_description: 'ttygif.c 两处：① 帧暂存目录模板不再硬编码 /tmp，改为优先取 TMPDIR、未设置或为空时回落 /tmp —— 鸿蒙 PC 的 /tmp 挂在只读文件系统上，main() 开头无条件 mkdtemp("/tmp/ttygif.XXXXXX") 必然失败，未看任何参数就 fatal 退出（实测与完整证据链见 notes.md）；② 把 argc<2 的 usage 以及 --help/--version 的判定从 WINDOWID 相关初始化之后上移到所有显示相关初始化之前，否则无头环境下连版本号都取不到。回落分支保持原行为，Linux/macOS 语义不变'
    patch_type: "portability"
  - patch_file: "patches/0002-Makefile-VERSION-string-1.5.0.patch"
    patch_description: 'Makefile: VERSION 由上游 tag 里遗留的 1.4.0 更正为与 tag 一致的 1.5.0（ttygif -v 打印的就是这个宏；不改则包自述版本与包版本 1.5.0 自相矛盾）'
    patch_type: "bugfix"
