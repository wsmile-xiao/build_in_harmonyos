software: ttygif
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# 构建系统（与build.system一致，顶层字段用于G4门禁）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/icholy/ttygif/archive/refs/tags/1.4.0.tar.gz"

  # 源码校验和
  sha256: "6ca3dc5dcade2bdcf8000068ae991eac518204960c157634d92f87248c3cee2a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "CC=clang"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "imagemagick/7.1.1"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-configure.patch"
  - "0003-ttygif.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Makefile项目需要添加DESTDIR支持才能实现staging隔离安装"
  - "R10铁律：硬编码/tmp路径必须改为读取TMPDIR环境变量"
  - "G4门禁检查manifest顶层build_system字段，需与build.system保持一致"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/ttygif-1.4.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/ttygif-1.4.0.work
  source_orig_hash: b687d02940f3d10d
  source_work_hash: a61c801e5db6342a
  generated_at: '2026-05-29T11:02:20'
  patches_count: 2

patch_classification:
  - file: 0001-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-ttygif.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
