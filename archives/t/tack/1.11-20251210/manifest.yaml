# 版本级 manifest — tack 1.11-20251210
# 文件位置: archives/t/tack/1.11-20251210/manifest.yaml

version: "1.11-20251210"
software: "tack"
status: built
build_date: "2026-09-26"
build_system: autotools

source:
  # invisible-island 不为 tack 提供版本化文件名；本件解包顶层是 tack-1.11-20251210，
  # tack.h 里 MAJOR=1 / MINOR=11 / PATCH=20251210，与本版本串一致，sha256 本机复测。
  # ⚠ URL 滚动：日后失配只重取哈希，不改版本串（详见 conandata.yml 头注释与 notes.md）。
  url: "https://invisible-island.net/datafiles/current/tack.tar.gz"
  sha256: "7df17f0dbe96ab92b747d68cb65d9d703ba57ee774d24d5bbd93d78c455affcb"
  tar_format: tar.gz
  size_bytes: 264825

build:
  system: autotools
  configure_options:
    - "--prefix=/（AutotoolsToolchain 默认，安装期用 DESTDIR=<package_folder> 落包）"
    - "--with-ncursesw：走宽字符 ncursesw"
    - "--with-curses-dir=<ncurses package_folder>：把 curses 探测钉到 Conan 包，不捡宿主副本"
    - "ac_cv_prog_NCURSES_CONFIG= 与 ac_cv_prog_ac_ct_NCURSES_CONFIG=：清空 AC_CHECK_PROG 缓存，否则 configure 会用 ~/.harmonybrew 的 ncursesw6-config 去链系统 libncursesw.so.6"
    - "其余目录与编译变量由 AutotoolsToolchain 写入，配方不自加编译开关（R1/R33/R49）"
  build_command: "env -u CONFIG_SHELL SHELL=/bin/sh 「<src>/configure」 <AutotoolsToolchain configure_args> && env -u CONFIG_SHELL SHELL=/bin/sh make -j1"
  configure_note: >-
    configure 参数取 toolchain 落盘的 load_toolchain_args(...).configure_args（唯一事实来源），
    只在同一条命令前加 E386 守卫 env -u CONFIG_SHELL SHELL=/bin/sh。
    layout() 把 source 与 build 都指向 src：推导实际在上游 configure（实测 configure:3146 的
    DFT_OBJ_SUBDIR=`pwd|sed -e 's:.*/::'`），Makefile.in:63 只以 MODEL=../@DFT_OBJ_SUBDIR@ 消费 ⇒ 只支持 in-tree 构建。
  install_method: "make install DESTDIR=<package_folder>（同一条命令带 E386 守卫；装出 bin/tack 与 share/man/man1/tack.1）"
  dependencies:
    - "ncurses/6.6（--with-ncursesw 硬需求；本 profile 下 shared=False 静态，故 requires(..., run=True) 才能把它的 runenv_info TERMINFO/TERMINFO_DIRS 传进消费者运行环境）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

patch_classification:
  - file: 0001-config.guess.patch
    type: platform-build-environment
    upstream_rationale: "E160/E007：随包 config.guess 无 HarmonyOS 分支，configure 报 cannot guess build type；用仓内 scripts/patch-autotools-ohos.pl 生成，并摘掉其 __OHOS__ LIBC 探测 hunk（PF5 禁止补丁新增行出现 __OHOS__，且该分支不读 LIBC）"
  - file: 0002-config.sub.patch
    type: platform-build-environment
    upstream_rationale: "E007 配套/防御性：把 ohos-linux 归一为 linux-ohos。本包构建路径并未命中该分支——设备实测 config.sub 对 ohos-linux 打补丁前后均 rc=1，而本包实际使用的 aarch64-unknown-linux-ohos 打补丁前后均 rc=0；保留此补丁只为与成对刷新的 config.guess 口径一致（同口径亦见 conandata.yml 的 0002 描述）"

in_build_source_transformations:
  - file: configure
    type: platform-build-environment
    applied_by: "conanfile._relax_hmdfs_umask()（build() 内就地改写，不落 patches/）"
    change: "umask 077 → umask 022（打印 UMASK077_RELAXED hits=N；命中 0 处打 warning）"
    reason: >-
      E011/E114：config.status 以 (umask 077 && mktemp -d ...) 建的临时目录在 HMDFS 回读丢检索位，
      随后写 subs*.awk 报 Permission denied。configure 是发布包里的生成文件，
      按 CONTRIBUTING 不用 .patch 改生成文件，故在 build() 内就地改写。
  - file: "configure, config.guess, config.sub, install-sh"
    type: platform-build-environment
    applied_by: "source() 内 os.chmod(path, 0o755)（仅对存在的文件）"
    change: 恢复发布件里丢失的可执行位
    reason: 上游 tarball 经打包链后 helper 执行位不可靠；configure 直接 exec config.guess/install-sh，缺位会以 Permission denied 形式表现为三元组猜测失败

knowledge_ref:
  - "E007"
  - "E160"
  - "E011"
  - "E114"
  - "E386"
  - "E467"

knowledge_gained: []

