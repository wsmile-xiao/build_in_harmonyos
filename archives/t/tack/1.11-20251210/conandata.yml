patches:
  "1.11-20251210":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "Add a `*:HarmonyOS:*:*)` branch to the shipped config.guess (timestamp 2025-07-10) so it emits aarch64-unknown-linux-ohos instead of dying with 'unable to guess system type' (E160/E007). Generated with scripts/patch-autotools-ohos.pl, without its __OHOS__ LIBC-probe hunk: the HarmonyOS branch never reads LIBC."
      patch_type: "portability"
      sha256: "9e027064f476e6759df0f04d09e08b7473b8b53eb5a488c6d920e3e4a5d35ea3"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "Defensive E007 companion only: normalise an `ohos-linux` OS field to `linux-ohos`. NOT required for this build - measured on device: config.sub rejects `ohos-linux` both before and after this patch (rc=1), while the triple actually used here, `aarch64-unknown-linux-ohos`, is accepted both before and after (rc=0). Kept so the paired config.guess/config.sub refresh stays internally consistent for downstream callers that pass a canonical `ohos-linux` triple."
      patch_type: "portability"
      sha256: "14439633b58d94bc08edb69bf93f21e259f3912f7d734b180afab54f50fd4221"
