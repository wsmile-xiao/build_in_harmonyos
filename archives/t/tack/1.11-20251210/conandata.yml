# conandata.yml - tack 1.11-20251210
# 单一事实来源：官方源 URL + SHA256 + 补丁清单。
#
# 货源说明（见 notes.md「已知限制」）：
#   invisible-island.net 不为 tack 提供版本化文件名。
#   /datafiles/current/tack.tar.gz 是本版本的正式发布件；
#   /datafiles/release/tack.tar.gz 是同位滚动快照（PATCH_VERSION=20250503），
#   /archives/tack/、/archives/ncurses/tack/、/datafiles/current/tack-1.11-20251210.tgz
#   均返回 404（本窗 8 轮实测由主窗提供，解包后 tack.h 的
#   MAJOR=1 / MINOR=11 / PATCH=20251210 与本版本串一致，sha256 已在本机复测）。
#   ⇒ URL 是滚动的，下游若取到不同内容只会有两种表现：sha256 失配（本文件）或
#     解包后 tack.h 的 PATCH_VERSION 不再是 20251210。届时**重取哈希**即可，
#     绝不改写版本串（版本串必须与任务/归档目录/分支一致）。

sources:
  "1.11-20251210":
