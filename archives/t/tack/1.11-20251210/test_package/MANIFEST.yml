# test_package/MANIFEST.yml - tack 1.11-20251210
#
# CI 的 build_and_test.sh 只看 L0e「该文件存在」；本文件的数字口径是给评审看的：
# 上游有多少测试面、本包实际跑了几条、用什么命令可以复算。

package: tack/1.11-20251210
homepage: "https://invisible-island.net/tack/"
build_system: autotools

# ── 上游测试面：实测清点（四类资产逐一给命令与命中数，均为 0）──────────────────
# 复现目录 = 解包后的 tack-1.11-20251210/ 顶层；本窗在 B 机
# ~/tmp/uc2/z63-tack/srcwork/tack-1.11-20251210 实跑，日志 ~/tmp/uc2/z63-tack/02-srcprobe2.log
upstream_test_inventory:
  - {class: "test* 框架源码", command: "find . -iname 'test*' | wc -l", hits: 0}
  - {class: "*/res 语料条目", command: "find . -type d -name res | wc -l", hits: 0}
  - {class: "**/*RUNTEST*.sh", command: "find . -iname '*RUNTEST*' | wc -l", hits: 0}
  - {class: "src/demo|examples/**/*.c",
     command: "find . \\( -path '*demo*' -o -path '*example*' \\) -name '*.c' | wc -l", hits: 0}
  - {class: "tests/ 目录", command: "ls -d tests test", hits: 0, note: "No such file or directory"}
  - {class: "Makefile.in 里的测试注册", command: "grep -cE '^(check|TESTS|check_PROGRAMS)' Makefile.in",
     hits: 1,
     note: "唯一命中就是 check 目标本身，其目标体是 `@echo \"** no self-test available\"`（Makefile.in:211-212）"}
  - {class: ".sh/.pl 脚本", command: "find . \\( -name '*.sh' -o -name '*.pl' \\) | wc -l", hits: 0}

upstream_check_command: 'make check'
upstream_check_measured_output: '** no self-test available'   # 由上面 Makefile.in:211 的目标体决定
upstream_test_in_build: false
upstream_test_command: ''

# ── 测试数量变化原因 ───────────────────────────────────────────────────────────
# 上游 tack 1.11-20251210 的自动化测试数 = 0：`make check` 是上游自己写死的
# "** no self-test available"，源码树里没有任何测试框架/语料/示例（见上表 7 条命令，
# 6 条 0 命中、第 7 条命中的就是那句 echo）。
# 所以 21 条检查点**全部是新增的消费者测试**，不是"上游 21 条我们只剩 N 条"：
# 没有一条被删、没有一条被降级为 skip 后计入通过。分母从 0 变 21 的原因是
# "被测对象是命令行程序，其契约就是命令行行为"，只能由外部消费者断言。
test_count_change_reason: "上游 0 条（make check 目标体为 echo 无自测）=> 21 条全部为新增消费者断言，未删除、未降级任何上游用例"

# ── 两个口径（都可复算）────────────────────────────────────────────────────────
# 1) 用例数 = 一次运行里**实际打印出来**的检查点数（OHOS 分支）
test_case_count_measured: 21
test_case_count_measured_reproduce: "grep -c '^ok ' <本轮 conan-verify 日志>"
# 2) 判定表达式静态数 = 载体里 gate 判定调用点的条数
#    （F6 写成 OHOS / 非 OHOS 两个互斥分支，同一次运行只判定一次，故静态 22 > 实测 21）
judgment_expression_count_static: 22
judgment_expression_count_static_reproduce: >-
  grep -cE '^[[:space:]]*gate \$\(' archives/t/tack/1.11-20251210/test_package/test.sh

# ── 消费者测试清单 ─────────────────────────────────────────────────────────────
consumer_test_files:
  - file: test.sh
    role: "断言载体（21 个检查点，见下）"
    invoked_by: "test_package/conanfile.py 的 test() -> self.run('sh test.sh ...', env='conanrun')"
  - file: conanfile.py
    role: "载体驱动：定位包内 ELF -> 复制到归档树外临时目录 -> llvm-objcopy 去旧签 + binary-sign-tool 自签 -> 调起 test.sh -> finally 删临时目录"

checkpoints:
  A:
    - {id: A1, expect: "rc(tack -V) == 1", why: "上游 tack.c: print_version() 后 ExitProgram(EXIT_FAILURE)"}
    - {id: A2, expect: "stdout 含 'tack version 1.11 (20251210)'", why: "版本串与本归档版本一致"}
    - {id: A3, expect: "stdout 含 'License version 2'", why: "GPL-2 授权声明随产物打印"}
  B:
    - {id: B1, expect: "rc(tack -q) == 0", why: "上游 main() 的 default 分支 ExitProgram(EXIT_SUCCESS)；不是本窗改的行为"}
    - {id: B2, expect: "stderr 含 'usage: '", why: "show_usage() 只写 stderr"}
  C:
    - {id: C1, expect: "rc(tack) == 1 且 TERM 未设置", why: "validate_term() 在碰终端之前退出"}
    - {id: C2, expect: "stderr 含 'no useful value found for'", why: "validate_term() 的固定文案"}
  D:
    - {id: D1, expect: "rc(tack vt100 xterm) == 1", why: "两个位置参数 -> show_usage + EXIT_FAILURE"}
    - {id: D2, expect: "stderr 含 'usage: '", why: "同上"}
  E:
    - {id: E1, expect: "rc(tack) == 1，TERM=tack-no-such-term-zz9", why: "setupterm 走不通 -> EXIT_FAILURE"}
    - {id: E2, expect: "stderr 含 'listed as generic'", why: "证明 conan/ncurses 的 TERMINFO runenv 生效、terminfo 数据库真的可达（TERMINFO 缺失时上游改报 'The terminal database could not be found'）"}
  F:
    - {id: F1, expect: "readelf -h Machine == AArch64", why: "鸿蒙特有"}
    - {id: F2, expect: "DT_NEEDED 不含 ncursesw", why: "鸿蒙特有：证明链进 conan 静态归档，没被宿主 harmonybrew/system 的同名 libncursesw.so.6 劫持（本包真实踩点，见 notes.md）"}
    - {id: F3, expect: "DT_NEEDED 含 libc.so", why: "产物是完整可执行 ELF"}
    - {id: F4, expect: "DT_NEEDED 全部是裸 soname（不含 '/'）", why: "鸿蒙特有：绝对路径 NEEDED 会被加载器拒载"}
    - {id: F5, expect: "program interpreter == /lib/ld-musl-aarch64.so.1", why: "鸿蒙特有：OHOS musl 目标"}
    - {id: F6, expect: ".codesign 段数 == 1（自签分支）", why: "鸿蒙特有：CI 不给产物签名，所以由 test() 在归档树外自签后再断言；非 OHOS 分支断言 ==0"}
  G:
    - {id: G1, expect: "二进制内 'harmonybrew' 计数 == 0", why: "宿主前缀泄漏检查"}
    - {id: G2, expect: "二进制 + man 页内 '/usr/local' 计数 == 0", why: "SCT 预警的 18 处 /usr/local 默认前缀未烤进产物"}
  H:
    - {id: H1, expect: "包内 bin/ 条目数 == 1", why: "与 commands.json 做双向集合差的实有侧"}
    - {id: H2, expect: "share/man/man1/tack.1 存在且非空", why: "install.tack 的第二件产物"}

# ── 跳过项（不记为通过，附实测证据）────────────────────────────────────────────
skipped:
  - name: "交互式主循环（tack 的真实用途：探测终端并重建 terminfo 条目）"
    reason: "无头构建主机没有可控终端；tack 进菜单后等真实终端输入，不会自行结束"
    evidence: >-
      B 机实测（探索构建产物 ~/tmp/uc2/z63-tack/explore/stageC/.../bin/tack，
      TERM=vt100、stdin=/dev/null）：
      `timeout 20 tack vt100 < /dev/null` -> **rc=124**（被 timeout 杀掉），
      期间 stdout 写了 **89440575 字节**终端流、stderr 为空；
      流里能读到 `Using terminfo from: <ncurses 包>/share/terminfo/./v/vt100` 与
      `Terminal reset (rs2)` / `init`，说明初始化路径本身是通的、只是不能无人值守收敛。
      另一次未加 timeout 的同路径运行，ps 采样到 CPU 时间 00:09:32 仍未退出（本窗自行 kill）。
    declared_not_passed: true
  - name: "upstream `make check`"
    reason: "上游目标体是 echo \"** no self-test available\"，没有可运行用例"
    evidence: "解包源码 Makefile.in:211-212（见 upstream_test_inventory 第 6 行）"
    declared_not_passed: true

verification:
  host: "B 机 HarmonyOS aarch64（HongMeng Kernel 1.12.0），真机 native 构建"
  conan_profile: "ci/conan/profiles/ohos-aarch64 (os=OHOS, os.version=6.0, arch=armv8, clang 15)"
