# 软件级 manifest — tack
# 遵循 ARCHIVE-SPEC v3.0

software: tack
display: "tack"
description: "T.A.C.K.（terminfo action checker）：按 $TERM 的 terminfo 条目驱动终端并逐项校验，必要时从探测结果生成或校正 terminfo 条目"
category: tools
homepage: "https://invisible-island.net/tack/"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "package_type=application 的纯命令行工具：package_info 只声明 cpp_info.bindirs=bin（不导出 libs），可执行命令由软件级 commands.json 声明为 [tack]（R38/L0k）；包目录实测为 bin/tack 与 share/man/man1/tack.1（上游 COPYING **未随包安装**，许可证由配方 license 字段声明）"
    - "终端类程序运行期需要 ncurses 包内的 terminfo 数据库，而 ncurses 的 package_info 是用 runenv_info.define_path 声明 TERMINFO/TERMINFO_DIRS 的。本 profile 下 ncurses 是 shared=False 的静态包 ⇒ Conan 2 默认**不传 run 信息** ⇒ 消费者运行环境里没有 TERMINFO，实测报 'The terminal database could not be found'。正解=self.requires('ncurses/6.6', run=True)（机制同族先例见 knowledge/drafts/DRAFT-E568-mdp-ohos-musl-terminfo-path、DRAFT-E5xx-terminfo-database-bundle；给静态依赖传 run 的写法在本仓已有 6+ 处）"
    - "E160/E007：随包 config.guess（2025-07-10）不识别 `uname -s = HarmonyOS` ⇒ configure: error: cannot guess build type。处方=起草期用仓内 scripts/patch-autotools-ohos.pl 生成成对随包补丁（config.guess + config.sub）并登记 conandata，配 export_conandata_patches + apply_conandata_patches；⛔ 不要用 --build/--host 绕过（会被判交叉编译、AC_RUN_IFELSE 探测静默跳过）。helper 的 __OHOS__ LIBC 探测 hunk 要摘掉——PF5 禁止补丁新增行出现 __OHOS__，且 HarmonyOS 分支不读 LIBC"
    - "E011/E114：config.status 的 `(umask 077 && mktemp -d ...)` 在 HMDFS 上建的目录回读丢检索位；build() 内就地把 configure 的 umask 077 改为 022（打印命中数，命中 0 处打 warning）"
    - "E386：profile [buildenv] 注入 CONFIG_SHELL=/data/service/hnp/bin/bash，该 bash 在 HMDFS getcwd() 失败而 configure 会 re-exec 自身 ⇒ 所有命令统一前缀 'env -u CONFIG_SHELL SHELL=/bin/sh' 并与 configure/make 写在同一条命令行里"
    - "防宿主串味：tack 的 configure 有 AC_CHECK_PROG([NCURSES_CONFIG], ncursesw*-config) 分支，会捡 ~/.harmonybrew 里的 ncursesw6-config 去链系统 libncursesw.so.6。处方=清空探测缓存（ac_cv_prog_NCURSES_CONFIG= 与 ac_cv_prog_ac_ct_NCURSES_CONFIG=）+ --with-curses-dir=<ncurses 包目录>，并在产物层断言：DT_NEEDED 不含 ncursesw（链的确实是 conan 静态归档）、二进制字节里 harmonybrew 计数=0、/usr/local 计数=0（Makefile.in/configure 内 /usr/local 字面出现 18 次）"
    - "tack 的推导发生在上游 configure：实测 configure:3146 的 DFT_OBJ_SUBDIR=`pwd|sed -e 's:.*/::'`；Makefile.in:63 只是以 MODEL = ../@DFT_OBJ_SUBDIR@ 消费这个占位符 ⇒ 只能 in-tree 构建。layout 把 source 与 build 都指向 src、generators 单独放 build-generators，否则 make 会在子目录里找不到 ../<basename> 前缀"
    - "OHOS 装载与签名：包目录 ELF 直接 exec 报 Operation not permitted，且 CI 从不给产物签名 ⇒ 消费者测试必须按本仓形状在归档树外临时目录复制 ELF → llvm-objcopy --remove-section .codesign → binary-sign-tool -selfSign 1 再断言（F6 按 OHOS/非 OHOS 分支分别期望 1 段/0 段），并 finally 删临时目录，避免签名后的 ELF 被 git add 折进 PR"
    - "上游无自动化测试：Makefile.in 的 check 目标体就是 '@echo 「** no self-test available」'（源码树四类测试资产 test*/res/RUNTEST*/demo 实测命中全 0）⇒ 不存在'上游测试通过'这一档证据，测试面只能由消费者断言补；交互主循环在无头主机上不可无人值守（timeout 20 判 124、单核空转累计 CPU 9 分钟不退出、期间 stdout 约 8944 万字节）⇒ 记为未验证能力，不塞进通过数"
    - "上游退出码语义不一致且不应由适配层修：-V 打印版本后 ExitProgram(EXIT_FAILURE)（rc=1），非法选项走 default: 分支 ExitProgram(EXIT_SUCCESS)（rc=0）。这两条都做成断言（A1/B1），目的是让后来人不会把上游行为误当适配回归去'修'"
  common_dependencies:
    - ncurses

versions:
  "1.11-20251210":
    status: built
    build_date: "2026-09-26"
    conan_ref: "tack/1.11-20251210"
