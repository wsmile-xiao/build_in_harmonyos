# 版本级 manifest
# 文件位置: archives/t/telepathy-glib/0.24.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.24.2"

# 软件名
software: "telepathy-glib"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://telepathy.freedesktop.org/releases/telepathy-glib/telepathy-glib-0.24.2.tar.gz"

  # 源码校验和
  sha256: "b0a374d771cdd081125f38c3abd079657642301c71a543d555e2bf21919273f0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--disable-maintainer-mode"
  - "--disable-vala-bindings"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - glib/2.88.0
  - dbus-glib/0.114
  - dbus/1.14.10

  # 构建工具依赖（tool_requires）
  tool_requires:
  - automake/1.18
  - libtool/2.5.4
  - gettext/0.22.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 说明：无外部补丁文件；config.guess/config.sub OHOS 识别、pcre2/dbus-1
# .pc 别名、glib 工具变量注入、make 只构建库子目录等均在 conanfile.py
# 内联处理（见 notes.md）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "config.guess 2020-04-26 版为旧版风格（各分支自行 echo+exit），HarmonyOS 分支须用 echo+exit 格式在 aarch64:Linux 前插入；config.sub 需同时改 maybe_os 与 os 合法性列表加 linux-ohos*"
- "dbus 包的 PkgConfigDeps 按 cmake_file_name 生成 dbus.pc（非 dbus-1.pc），但 telepathy-glib configure.ac 直接 PKG_CHECK dbus-1——需生成 dbus-1.pc 别名"
- "glib 工具（glib-mkenums/glib-genmarshal）由 pkg-config --variable 查询，conan PkgConfigDeps 的 glib-2.0.pc 不含这些自定义变量（返回空 → make 报 _gen/genums.c Error 127）——需 make 命令行变量覆盖为 glib 包 bin 绝对路径"
- "telepathy-glib 公开头文件链 proxy.h→dbus-glib.h→dbus/dbus-shared.h 需 dbus 头，dbus 仅为 dbus-glib 传递依赖时 include 不透传——需声明为直接依赖（transitive_headers）+ package_info requires 引用 dbus::dbus"
- "examples/tests/docs 对库适配无意义（examples 链接缺 pcre2、tests 需运行环境、docs 需 gtk-doc）——make 只构建 telepathy-glib 库子目录 + package 手动复制产物（参考 dbus 配方）"
- "telepathy-glib 生成头（_gen/telepathy-enums.h，glib-mkenums 生成）在源码子目录，package 需一并复制"
- "上游 tests/ 需活 D-Bus 会话：OHOS/ohpcd dbus 包均无 dbus-daemon 二进制（同 dbustest #8469 根因）——build() 构建 tests/ 子目录并逐用例实跑纯单测（参考 #8469 模式），得真实通过率而非 0/24 未运行"

test_results:
  type: manual
  total: 15
  passed: 11
  failed: 4
  note: "上游 tests/ 共 24 用例（TESTS=15 个 test-* 程序 + all-errors-documented.py + tests/dbus 子目录 8 个）；build() 实跑 tests/ 下 15 个 test-*：11/15 通过（73.3%，口径 passed/(passed+failed+errors)，无 skipped/xfailed）——PASS 11（asv/availability-cmp/capabilities/contact-search-result/debug-domain/enums/heap/internal-debug/intset/util/util-cxx）；FAIL 4 已补 dbus-daemon 实测复核（非'缺总线'）：gnio-util（glib 2.88 GVariant type-info 断言失败，真实差异）、dtfm-player（1/8 通过后 GLib-GObject-FATAL-CRITICAL signal 'started-tone' invalid，有总线同样失败）、message/signal-connect-object（有会话总线仍 Signal 11，沙箱）；dbus-daemon 可构建（dbus-1.14.10 源码 CMake 同款配置 + expat 链接注入，实测启动会话总线），但 D-Bus 用例在 OHOS 沙箱仍不通过（Signal 11/GLib-GObject-FATAL-CRITICAL/SIGALRM，同 dbustest #8469 沙箱限制）按 rule 1.2 声明；test_package R34 PASS（1 通过）；适配后合计=上游 15 实跑 + 新增 1 = 16"
