# test_package/MANIFEST.yml — telepathy-glib 0.24.2
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: telepathy-glib/0.24.2
homepage: "https://telepathy.freedesktop.org/"

# 上游测试：tests/ 目录基于 GLib 测试框架（需运行中的 D-Bus 会话/模拟器）；
# OHOS 无运行中的 D-Bus 会话（且缺 dbus-daemon 二进制），按 rule 1.2 如实
# 声明平台限制（详见 notes.md）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# test_package 消费者测试（R34 真实产物 + util/error 纯函数实质调用）
test_package_tests:
  - file: test_telepathy_glib.c
    description: "CMake 编译链接 libtelepathy-glib + glib + dbus-glib（dbus-glib::dbus-glib），运行 test_telepathy_glib 验证 tp_g_value_slice_new_boolean/tp_errors_quark 纯函数 API"
    command: "conan create 内自动执行（CMake build + run test_telepathy_glib）"
