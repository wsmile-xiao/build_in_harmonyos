# test_package/MANIFEST.yml — test-future-io-impl 0.21
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: test-future-io-impl/0.21
homepage: "https://metacpan.org/pod/Test::Future::IO::Impl"

# 上游测试命令：上游为 Module::Build（Build.PL），但 Module::Build 在 OHOS
# 不可得（设备 perl / hnp perl 均无 Module/Build.pm，制品仓亦无
# perl-module-build），故配方由 ExtUtils::MakeMaker 生成等价 Makefile.PL，
# 上游测试经 make test 运行。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试套件（2026-09-18 实测，hnp perl 5.42.0）：
# - t/ 目录：2 个 .t 测试文件
# - 实测结果：**Files=2, Tests=1, Result: PASS**（含 1 个 skip 文件）
#   skip：99pod.t —— `skipped: Test::Pod 1.00 required for testing POD`
#   实际执行的是 00use.t（`require Test::Future::IO::Impl` + pass）
#
# ⚠️ 上游测试覆盖面的如实说明：本发行版的**主体价值是 13 个验收套件**
#   （run_accept_test / run_connect_test / run_poll_test / run_poll_no_hup_test /
#   run_read_test / run_sysread_test / run_recv_test / run_recvfrom_test /
#   run_send_test / run_sleep_test / run_write_test / run_syswrite_test /
#   run_waitpid_test），它们由 `run_tests` 分发，**必须由调用方先加载一个
#   Future::IO 实现**才能运行。而 Future::IO 在本环境（hnp perl）与制品仓
#   （ohpcd）中均不存在，本仓 main 亦无相应归档——其依赖链为
#   Future::IO → Future，而仓内 future/0.52 尚处 PR 阶段（未合入 main）。
#   因此上游 t/ 只能覆盖模块加载；13 个套件的实跑需待 Future::IO 及某个实现
#   适配后由消费方触发。此为依赖链限制，未以任何方式伪造通过率。
upstream_tests:
  - file: t/00use.t
    source: Test-Future-IO-Impl-0.21/t/00use.t
    description: "上游 00use.t：require 模块并 pass（1 用例）——上游 t/ 的全部可执行内容"
    command: "make test"

# test_package 消费者测试（R34 真实 API：加载打包的 Test::Future::IO::Impl，
# 真实调用其唯一公开 API `run_tests`）
#
# 本消费者测试**不依赖真实 Future::IO**：脚本内提供一份 Future::IO 桩实现
# （sleep/alarm + future 的 get/cancel/await/is_ready），据此真实驱动
# `run_tests 'sleep'` 这一个自包含验收套件（无需 socket/pipe/fork，稳定可复现），
# 并对其余 12 个套件做存在性核验。故消费者侧实际执行 11 项断言
# （本脚本 5 项 + sleep 套件自身 6 项）。
test_package_tests:
  - file: test_test_future_io_impl.pl
    description: "消费者测试：版本与导出核验、13 个验收套件与 time_about 齐备、未知套件名必须 die，并配 Future::IO 桩实现真实跑通 sleep 验收套件（含取消与 await 语义）"
    command: "perl -I<site> test_test_future_io_impl.pl <site>"

# 测试断言总数（实测：本脚本 5 项 + sleep 套件 6 项 = 11）
assertion_count: 11
