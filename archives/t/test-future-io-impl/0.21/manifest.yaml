# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 1
  failed: 0
  note: |
    上游测试（R51，2026-09-18 实测，hnp perl 5.42.0）：t/ 目录 2 个 .t 文件，
    `make test` 实测 **Files=2, Tests=1, Result: PASS**，零失败。
    1 个文件跳过（99pod.t，需 Test::Pod 1.00，可选依赖缺失非失败）；
    实际执行的是 00use.t（require 模块 + pass）。
    上游测试已集成进 build()（upstream_test_in_build: true）。

    覆盖边界（如实申报）：本发行版主体价值是 13 个验收套件，它们经 run_tests
    分发、必须由调用方先加载 Future::IO 实现才能运行；Future::IO 在本环境与
    ohpcd 均不存在，故上游 t/ 只能覆盖模块加载。13 个套件的实跑属依赖链限制，
    未伪造通过率。

    适配后：test_package 消费者测试（R34 真实 API）11/11 = 100%——脚本内提供
    Future::IO 桩实现，真实驱动 run_tests 'sleep' 套件（6 项断言）并核验全部
    13 个套件与 time_about 齐备、未知套件名必须 die。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CPAN 发行版以 Module::Build（Build.PL）为构建系统时，若 Module::Build 在 OHOS 不可得且制品仓无 perl-module-build，可用 perl 核心 ExtUtils::MakeMaker 生成等价 Makefile.PL 替代，上游 t/ 测试仍可经 make test 真实运行 (ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "「验收测试工具集」类 CPAN 模块（如 Test::Future::IO::Impl）自身测试极少（本包 t/ 仅 1 个可执行用例），其真实价值在 run_tests 驱动的 13 个套件——这些套件要求调用方先加载被验收的目标实现（Future::IO 及其实现），属**逻辑依赖**而非 META prereqs 声明的依赖；适配时须如实申报该覆盖边界，消费者侧可用桩实现真实跑通自包含套件（本包选 sleep 套件，无需 socket/pipe/fork） (ref: DRAFT-perl-acceptance-test-toolkit-deps)"
  - "纯 Perl 模块的 site 目录定位：模块相对路径有几层就须逐级上溯几层（Test/Future/IO/Impl.pm 需上溯三级）；返回末级目录会让 PERL5LIB/-I 指向错误层级，test_package 报 missing packaged module (ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "判定 ohpcd 制品是否存在必须用 conan search <pkg>/* -r=ohpcd；conan download 对不存在/未发布的包报误导性的 system acceleration policy not enabled (ref: DRAFT-perl-module-build-makemaker-substitution)"

references:
  - https://metacpan.org/pod/Test::Future::IO::Impl
  - https://metacpan.org/dist/Test-Future-IO-Impl
