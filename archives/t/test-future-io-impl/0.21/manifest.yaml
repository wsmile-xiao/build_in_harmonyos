# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  note: |
    META.json prereqs.runtime.requires 全部为 perl 核心模块或环境已有模块
    （Errno / IO::Handle / Socket / Time::HiRes / Test2::V0 / perl>=5.014），
    无外部 CPAN 依赖、无 Conan 依赖。
    configure.requires Module::Build>=0.4004 在 OHOS 不可得 → 配方以
    ExtUtils::MakeMaker（perl 核心）生成等价 Makefile.PL 替代。

    ⚠️ 运行期**逻辑**依赖（不体现在 META prereqs，但决定本模块能否真正使用）：
    本模块导出 run_tests 供 **Future::IO 实现方**做验收测试，调用方必须先加载
    一个 Future::IO 实现。而 Future::IO 本身在本环境与 ohpcd 制品仓均不存在，
    本仓 main 亦无相应归档（依赖链 Future::IO → Future，仓内 future/0.52 尚在
    PR 阶段）。故 13 个验收套件的实跑需待该依赖链适配后由消费方触发。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Perl 模块无二进制产物，沿用
    perl-uri / metrics-any / test-refcount 先例；不产生 bindirs，故无需
    commands.json，R38 不适用）。
    构建：perl Makefile.PL INSTALLDIRS=site → make → make test →
    make install DESTDIR=<staging>；package() 按登台树原样拷入
    package_folder，并以遍历定位 Test/Future/IO/Impl.pm 后**上溯三级**得到
    site 目录（模块相对路径为 Test/Future/IO/Impl.pm；安装前缀随 perl 构建
    而异，实测 /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0）。
    package_info() 以 runenv_info 注入 PERL5LIB；无 C/C++ 库可链接
    （cpp_info.libs=[]，R26 不适用）。
    解释器固定 /data/service/hnp/bin/perl（5.42.0），与 metrics-any /
    test-refcount / file-sharedir-install 口径一致（本模块直接依赖
    Errno 常量，设备 perl 5.42.2 的别名去重风险尤需规避）。

