patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    纯 Perl（lib/Test/Future/IO/Impl.pm 单模块，798 行，13 个验收套件 +
    time_about 计时助手），无 XS、无 C/C++ 编译、无平台相关代码；运行时依赖
    的 Errno / IO::Handle / Socket / IO::Poll / Time::HiRes / Test2::V0 在
    OHOS perl 中齐备。
