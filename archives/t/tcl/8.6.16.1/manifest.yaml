# 版本级 manifest — tcl 8.6.16.1
# R37 递增修订：官方 main 已存在 archives/t/tcl/8.6.16（2026-07-29 合入，status=built），
# 同版本配方目录不可复用（L0j 门禁），故以 8.6.16.1 作为适配修订版本号重新提交。
# 上游源码仍为 tcl 8.6.16 官方 release tarball（URL/sha256 与 8.6.16 配方一致）。
version: "8.6.16.1"
software: "tcl"
status: published
build_date: "2026-09-26"

source:
  url: "https://prdownloads.sourceforge.net/tcl/tcl8.6.16-src.tar.gz"
  sha256: "91cb8fa61771c63c262efb553059b7c7ad6757afa5857af6265e4b0bdc2a14a5"
  tar_format: tar.gz

build:
  system: autotools
  # 配方无 conan requires：zlib 由 OHOS 工具链 sysroot 提供（tcl configure 检测到
  # zlib.h 即链系统 zlib；缺失时上游自带 compat/zlib 兜底），不引入制品仓依赖。
  dependencies: []
  cc: clang
  cxx: clang++
