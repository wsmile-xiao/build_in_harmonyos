package: thorvg/1.0.6
homepage: "https://www.thorvg.org/"

upstream_check_command: "meson test --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test --print-errorlogs"

upstream_tests:
  - file: test/
    source: thorvg-1.0.6/test/
    description: "Official ThorVG test suite: 14 test sources, 51 cases, 13314 assertions"
    command: "meson test --print-errorlogs"

test_package_tests:
  - file: test_thorvg.cpp
    description: "Compile and link the installed ThorVG package, render a software rectangle, and verify nonzero pixels"
    command: "./test_thorvg"

assertion_count: 3
