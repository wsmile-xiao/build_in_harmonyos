# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tinycbor/0.6.0
homepage: "https://github.com/intel/tinycbor"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# tinycbor 上游测试为 Qt Test 子项目 (make check -> qmake -> tests/*/tst_*),
# 详见 reports/upstream-test-ledger.md (R03 实测: qt/5.15.19 OHOS 二进制存在, 54/54 实例化,
# 42/54 通过, 12/54 因运行期 open_memstream 缺陷失败)
upstream_check_command: "qmake && make -C tests check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Qt Test 槽函数全量 54 项: parser 26 + encoder 16 + tojson 12)
# 注: 上游独立用例均以 Qt Test 槽函数声明; c90/cpp 为编译性检查非独立用例。
upstream_tests:
  - file: tests/parser/tst_parser.cpp
    source: tinycbor-0.6.0/tests/parser
    description: "Parser test slots (integers/halfFloat/fixed/strings/tags/containers/validation/recursion)"
    command: "./tst_parser"
  - file: tests/encoder/tst_encoder.cpp
    source: tinycbor-0.6.0/tests/encoder
    description: "Encoder test slots (floatAsHalfFloat/halfFloat/fixed/strings/tags/arrays/maps/writerApi/shortBuffer/tooShort/tooBig/illegalSimpleType)"
    command: "./tst_encoder"
  - file: tests/tojson/tst_tojson.cpp
    source: tinycbor-0.6.0/tests/tojson
    description: "CBOR-to-JSON conversion test slots (fixed/textstrings/nonjson/bytestrings/arrays/maps/tags/metaData)"
    command: "./tst_tojson"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tinycbor.c
    description: "HarmonyOS 消费者测试：真实 encode->parse->verify 回环调用 tinycbor 公共 API"
    command: "./test_tinycbor"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 54