# 版本级 manifest
# 文件位置: archives/t/tinycbor/0.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.6.0"

# 软件名
software: "tinycbor"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/intel/tinycbor/archive/refs/tags/v0.6.0.tar.gz"

  # 源码校验和
  sha256: "512e2c9fce74f60ef9ed3af59161e905f9e19f30a52e433fc55f39f4c70d27e4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（tinycbor 用 make configure 生成 .config 特性探测）
  configure_options:
  - "make configure (Makefile.configure 探测 open_memstream/fopencookie/gc_sections 等)"

  # 编译依赖列表（格式: name/version）— 无外部依赖，仅链接 libm
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "tinycbor 0.6.0 为纯 Makefile 构建（非 CMake/autotools）：make configure 生成 .config 特性探测，make 产出 libtinycbor.a/.so + cbordump"
- "上游测试为 Qt Test 子项目（make check 需 qmake/Qt 5）。R03 实测 qt/5.15.19 在 ohpcd 有 OHOS armv8 预编译二进制（conan install --build=never 成功），54/54 实例化执行：42/54 通过，12/54（tojson）因 OHOS 运行期 open_memstream 缺陷失败（库无关，详见 reports/upstream-test-ledger.md R03 修正版）"
- "OHOS 环境无 /usr/bin/install，Makefile install 目标不可用，conanfile.py package() 需手动拷贝产物并生成 package-relative tinycbor.pc"
- "libtinycbor 头文件按上游布局安装于 include/tinycbor/，消费者必须 include <tinycbor/cbor.h>"
