sources:
  # Upstream lives on SourceForge; its download mirrors time out from the
  # build workers, so the Debian official archive of the same release is used
  # (same rationale as the trousers recipe).
  url: "https://deb.debian.org/debian/pool/main/t/tpm-tools/tpm-tools_1.3.9.2.orig.tar.gz"
  sha256: "8af837949a2ec30b195389ac8a2b31bc49fe315050751b7d4d0d432bf7812a97"

patches:
  - patch_file: "patches/0001-tpm-utils-termios-password.patch"
    patch_description: "Read passwords with a termios helper instead of the BSD/glibc getpass(), which musl/HarmonyOS neither declares nor exports"
    patch_type: "portability"
  - patch_file: "patches/0002-lib-makefile-let-libtool-decide.patch"
    patch_description: "Drop the hard-coded -shared flag from libtpm_unseal_la_LDFLAGS so libtool can also build the library statically"
    patch_type: "portability"
