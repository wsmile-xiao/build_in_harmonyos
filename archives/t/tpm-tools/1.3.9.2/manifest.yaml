# 版本级 manifest — tpm-tools 1.3.9.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.3.9.2"
software: "tpm-tools"
status: built
build_date: "2026-10-03"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/t/tpm-tools/tpm-tools_1.3.9.2.orig.tar.gz"
  sha256: "8af837949a2ec30b195389ac8a2b31bc49fe315050751b7d4d0d432bf7812a97"
  tar_format: tar.gz
  upstream: "https://trousers.sourceforge.net/ (1.3.9.2; SourceForge mirrors time out, Debian official archive used)"

build:
  system: autotools
  configure_options:
    - "autoreconf -fi（release tarball 不含 configure；po_/ → po/ 与 m4/ 由配方准备）"
    - "AUTOPOINT=<worker gettext prefix>/bin/autopoint + gettext_datadir=<same prefix>/share/gettext"
    - "--disable-pkcs11-support（opencryptoki 未发布）"
    - "--build/--host=aarch64-unknown-linux-gnu（避免运行 conftest，E064）"
    - "--disable-shared --enable-static（默认；shared=True 时相反）"
  dependencies:
    - trousers/0.3.15
    - openssl/3.5.6.1
    - gettext/0.22.5
  build_tools:
    - automake/1.18 (tool_requires)
    - libtool/2.5.4 (tool_requires)
    - pkg-config/0.29.2 (tool_requires)
    - "worker autoconf 2.72 / autopoint / m4 / make"
  cc: clang

patches_applied:
  - "0001-tpm-utils-termios-password.patch"
  - "0002-lib-makefile-let-libtool-decide.patch"

package_type: library
artifacts:
  - "lib/libtpm_unseal.a"
  - "include/tpm_tools/tpm_unseal.h"
  - "bin/tpm_*（tpm_version、tpm_takeownership、tpm_nv*、tpm_sealdata、tpm_unsealdata …）"
  - "share/man/man1、man3、man8（tpmUnsealFile/Strerror/Shred 等手册页）"
  - "licenses/LICENSE"
libs:
  - tpm_unseal
requires:
  - trousers/0.3.15
  - openssl/3.5.6.1
  - gettext/0.22.5

tests:
  upstream_suite: "无（Makefile.am 未注册 check_PROGRAMS/TESTS；test/tpm_changeownerauth01.sh 需要真实 TPM）"
  upstream_audit: "build() 内执行 grep -nE 'check_PROGRAMS|^TESTS|check-local|^check:' 与 ls test，结果随 conan create 日志留证"
  consumer_checks: 4
  consumer_failures: 0
  consumer_pass_rate: "4/4 (100%)（库 API 2 条断言 + tpm_version --version/--help 两个 CLI 冒烟）"
  command: "conan create archives/t/tpm-tools/1.3.9.2 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"

adaptation_paths:
  - A
