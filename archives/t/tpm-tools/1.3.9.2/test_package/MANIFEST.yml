package: tpm-tools/1.3.9.2
homepage: "https://trousers.sourceforge.net/"

upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests:
  - name: upstream-suite-audit
    command: "grep -nE 'check_PROGRAMS|^TESTS|check-local|^check:' Makefile.am src/*/Makefile.am lib/Makefile.am"
    expected: "no match: the release only ships test/tpm_changeownerauth01.sh (EXTRA_DIST, unregistered, drives a real TPM); the audit runs in build() and is recorded in the conan create log"

test_package_tests:
  - file: test_tpm_tools.c
    description: "Link against libtpm_unseal and drive its public error-message API offline (tpmUnsealStrerror)"
    command: "./tpm_tools_consumer"
  - file: conanfile.py
    description: "Smoke test the shipped TPM-free command line paths: tpm_version --version and tpm_version --help"
    command: "tpm_version --version; tpm_version --help"

assertion_count: 4
