# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tomli/2.4.1
homepage: "https://github.com/hukkin/tomli"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "pytest tests/ -q"

upstream_tests:
  - name: tests/（pytest 套件——17 用例 + 744 subtests，含 toml-test 数据，GitHub 2.4.1 tag 下载，sdist 不含）
    count: "17"
    description: "上游测试实测（rule 4，分母=全部 17 用例）：17 passed / 0 failed / 0 skipped（100%，744 subtests 全过）——sdist 不含 tests/（仅 GitHub 仓库）——build() 从 GitHub 2.4.1 tag 下载 tests/ 跑 pytest（同 rich 模式）"

test_package_tests:
  - file: test_tomli.py
    description: "R34：模块存在 + import tomli 真实调用 loads"
    command: "python3 test_tomli.py <package>"

assertion_count: 2
