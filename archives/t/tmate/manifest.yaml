# tmate 软件级 manifest
# 文件位置: archives/t/tmate/manifest.yaml
# 链接到 ARCHIVE-SPEC v2.0

software: tmate
display_name: "tmate"
description: "Instant terminal sharing (tmux fork with SSH)"
category: network
homepage: "https://tmate.io/"
license: ISC
build_system: autotools

# 跨版本适配要点
ohos_adaptation:
  key_points:
    - "GitHub tag 归档无预生成 configure/Makefile.in,须先 autogen(aclocal+automake+autoreconf)或用 0001-0010 patch 落盘预生成产物"
    - "configure.ac 探测名需对齐 ohpcd 配方: msgpack->msgpack-c、ncurses->ncursesw (0001 patch)"
    - "config.guess 需加 HarmonyOS 探测块(aarch64/arm/amd64/x86 -> *-unknown-linux-ohos, 0003 patch)"
    - "强制依赖均已在 ohpcd 发布可消费: libevent/2.1.13、ncurses/6.6、msgpack-c/7.0.0、libssh/0.11.4(传递 openssl/1.1.1w+zlib/1.3.1)"
    - "libutempter 为上游可选依赖(HAVE_UTEMPTER 守卫),ohpcd 未发布,保持禁用(仅缺 utmp 记录),不阻塞构建"
    - "OHOS 构建需 TMPDIR=$HOME/tmp(CONFIG_SHELL=/data/service/hnp/bin/bash),静态链接(R26)"
    - "上游无自动化测试套件(Makefile.am 无 TESTS/check 目标),仅 ./tmate -V 冒烟"
  common_dependencies:
    - libevent
    - ncurses
    - msgpack-c
    - libssh

versions:
  - version: "2.4.0"
    status: built
    build_date: "2026-08-15"
    patches: 10
    notes: "首轮依赖分析完成(evidence),本轮 adapt rebuild_required 本地闭环;强制依赖全部可消费"
    conan_ref: "tmate/2.4.0"
