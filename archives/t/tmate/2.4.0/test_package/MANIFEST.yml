# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tmate/2.4.0
homepage: "https://tmate.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# tmate 2.4.0 (tmux fork) 上游无自动化测试套件:
#   - Makefile.am 无 TESTS / check 目标 (grep TESTS/check 仅命中 install-exec-hook 的 MANFORMAT shell 判断)
#   - 源码树无 test/ 或 tests/ 目录 (find 无结果)
#   - CI (.travis.yml / Dockerfile) 仅做 docker build + ./tmate -V 冒烟
#   结论: 上游自动化测试规模 0/0 (N/A)
upstream_check_command: "make -j1 check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无自动化测试, 空列表 + 冒烟说明)
upstream_tests:
  - file: "CHANGES"
    source: "tmate-2.4.0/CHANGES"
    description: "上游无自动化测试套件 (Makefile.am 无 TESTS/check 目标, 无 test/ 目录); CI 仅冒烟 ./tmate -V"
    command: "./tmate -V"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "conanfile.py"
    description: "验证打包产物 bin/tmate 存在, 并运行 ./tmate -V 冒烟 (env=conanrun 提供 libevent.so 运行路径)"
    command: "./tmate -V"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
