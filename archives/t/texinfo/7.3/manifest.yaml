# texinfo 编译档案
software: texinfo
version: 7.3
status: success
build_system: autotools
compile_date: 2026-04-01

# 依赖信息
dependencies:
  required: []
  optional: []

# 编译配置
build_config:
  target: aarch64-unknown-linux-gnu
  options:
    - --prefix=/storage/Users/currentUser/usr/local
    - --disable-nls
    - CC=clang
    - CFLAGS=-I/storage/Users/currentUser/usr/local/include
    - LDFLAGS=-L/storage/Users/currentUser/usr/local/lib

# 补丁信息
patches_applied: []

# 安装信息
install_info:
  prefix: /storage/Users/currentUser/usr/local
  binaries:
    - texi2any
    - makeinfo
    - install-info
    - texindex
    - pod2texi
    - texi2pdf
    - texi2dvi
    - pdftexi2dvi
  directories:
    bin: /storage/Users/currentUser/usr/local/bin
    share: /storage/Users/currentUser/usr/local/share
    perl_modules: /storage/Users/currentUser/usr/local/share/texi2any
    info_docs: /storage/Users/currentUser/usr/local/share/info
    man_pages: /storage/Users/currentUser/usr/local/share/man

# 报告文件
reports:
  build_report: reports/build-report.md
  test_report: reports/test-report.md

# 兼容性评估
compatibility:
  level: high
  issues: []
  notes: "核心功能正常，文档编译功能验证通过，软链接可用性已确认。官方测试套件138个测试中92个通过，46个跳过（因缺少外部工具），无失败测试。"
  limitations:
    - "gzip 相关功能受限：鸿蒙系统的 gzip 是 toybox 版本 (0.8.12)，不支持完整的 gzip 功能"
    - "LaTeX 工具链未安装：texi2pdf、texi2dvi 等工具需要 LaTeX 支持"
    - "语法高亮工具未安装：HTML 输出的语法高亮功能需要 pygments 或 highlight"

# 测试结果
test_results:
  type: official
  total: 138
  passed: 92
  skipped: 46
  failed: 0
  error: 0
  note: "官方测试套件运行完成，无失败测试。跳过的46个测试均因缺少外部工具（LaTeX、语法高亮工具、特定locale），非鸿蒙系统兼容性问题。核心功能测试全部通过。"

# 知识沉淀
knowledge_gained:
  - "texinfo 7.3 在 HarmonyOS 上使用 autotools 编译成功"
  - "使用 --disable-nls 禁用 NLS 支持（HarmonyOS 缺少相关库）"
  - "使用 clang 编译器，无需特殊补丁"
  - "构建系统类型: autotools"
  - "软链接 makeinfo -> texi2any 可正常使用"
  - "文档编译功能完整，可生成 .info 文件"
  - "鸿蒙系统上 config.status 创建临时目录会失败，需要提前创建 .config_tmp 目录并修改 config.status"
  - "tta 子目录需要单独配置，因为有自己的 configure 脚本"

# 参考
references:
  - https://www.gnu.org/software/texinfo/
