software: texinfo
display: "GNU Texinfo"
description: "GNU documentation system producing Info, HTML, PDF and other formats"
category: doc
homepage: "https://www.gnu.org/software/texinfo/"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "3 处独立的 config.guess/config.sub 需修补：主目录、tta/、tta/perl/CheckXS/"
    - "使用 --disable-nls 禁用 NLS（缺少相关库）"
    - "文档目录需从 SUBDIRS 移除以跳过文档构建"
    - "configure shell 脚本在 HarmonyOS 上原生支持"
  common_dependencies:
    - perl

versions:
  "7.3":
    status: published
    build_date: "2026-04-20"
