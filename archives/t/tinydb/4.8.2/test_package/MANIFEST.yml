package: tinydb/4.8.2
homepage: "https://github.com/msiemens/tinydb"

upstream_check_command: "pytest tests/ -q --no-header -p no:cacheprovider"
upstream_test_in_build: true
upstream_test_command: "pytest tests/ -q --no-header -p no:cacheprovider"
upstream_tests:
  - file: tests/
    source: tinydb-4.8.2/tests/test_*.py
    description: "Seven upstream pytest files; 204 cases; pytest 8.4.2 installed privately; --basetemp avoids shared-root ownership mismatch"
    command: "pytest tests/ -q --no-header -p no:cacheprovider"

test_package_tests:
  - file: test_tinydb.py
    description: "Imports the packaged module and exercises TinyDB JSON storage and Query search"
    command: "python test_tinydb.py"

assertion_count: 208