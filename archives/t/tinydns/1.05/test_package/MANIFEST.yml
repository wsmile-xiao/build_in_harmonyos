# test_package/MANIFEST.yml -- tinydns 1.05 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
# 详见: docs/TEST_QUALITY_SPEC.md

package: tinydns/1.05
homepage: "https://cr.yp.to/djbdns.html"

# 上游测试命令 (make -n check / ctest -N / meson test --list)
# R51 清点（实测 djbdns-1.05 纯净上游）：
#   - 上游**存在** Makefile check 目标，不是"无 check 目标"：
#       Makefile:193  check: it instcheck   + ./instcheck
#       Makefile:46   it: prog install instcheck
#     故 `make check` 会展开出 `make install`，写入系统前缀、需要 root，
#     CI（普通用户）无法运行。
#   - instcheck.c 只 stat() 已安装文件并核对 uid/gid/mode，是安装结果校验器，
#     不产出可计数的功能测试用例。
#   - 无 tests/ test/ 目录；无 autotools 测试机制（无 configure.ac/Makefile.am）。
#   => 上游可运行功能测试用例数 N=0 成立。
upstream_check_command: "make check"
upstream_check_command_runnable: false
upstream_check_command_blocked_reason: "make check => 'check: it instcheck' => make install (writes system prefix, needs root); instcheck only verifies installed file uid/gid/mode"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_blocked_reason: "no runnable upstream functional test suite (see upstream_check_command_blocked_reason)"

# 上游实际运行的测试程序（无，见上）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_tinydns.sh
    description: "tinydns-data 生成真实 CDB (data.cdb, magic 5f08) 并由 tinydns-get 回读断言；含负向对照与 CLI 参数序断言"
    command: "bash test_tinydns.sh"

# 测试断言总数 (实测 grep 统计: 12 处 '|| fail' + 2 处 'if ... fail' = 14)
assertion_count: 14