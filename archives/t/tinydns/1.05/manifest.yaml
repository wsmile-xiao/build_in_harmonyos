# 版本级 manifest -- tinydns 1.05

version: "1.05"
software: "tinydns"
status: published
build_date: "2026-09-27"
build_system: makefile

source:
  url: "https://cr.yp.to/djbdns/djbdns-1.05.tar.gz"
  sha256: "3ccd826a02f3cde39be088e1fc6aed9fd57756b8f970de5dc99fcd2d92536b48"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-error-h-include-errno-h-for-OHOS.patch"

knowledge_gained:
  - "upstream error.h declares 'extern int errno;', which binds errno as a plain external symbol and collides with any libc that implements errno as TLS. Fails on OHOS/musl ('undefined symbol: errno') and equally on glibc ('TLS definition in libc.so.6 section .tbss mismatches non-TLS reference in buffer.a(buffer_put.o)') -- not OHOS-specific. Fix: include <errno.h> in error.h instead of declaring errno [knowledge_ref: E###]"
  - "djbdns 1.05 has no configure script; uses conf-cc/conf-ld/conf-home files. Must override these in build() with OHOS compiler from tools.build:compiler_executables (R33) [knowledge_ref: E###]"
  - "Upstream default target 'it' runs 'make install' which needs root and installs to /usr/local; use 'make prog' to build all programs without install [knowledge_ref: E###]"
  - "tinydns-get takes arguments as <type> <name> (reversed order exits 100 with usage), reads ./data.cdb from the cwd via tdlookup.c, and prints 'name ttl A a.b.c.d' per record; a data file line starting with '=' only delegates a zone and yields NO readable A record, whereas '&' declares the name together with its nameserver A record and IS readable back [knowledge_ref: E###]"
  - "djbdns 1.05 does have a Makefile 'check' target, so do not report 'no check target': 'check: it instcheck' + './instcheck' where 'it: prog install instcheck'. Running it therefore invokes 'make install' (writes the system prefix, needs root) and instcheck only stat()s installed files for uid/gid/mode -- it is an install verifier, not a functional test. Hence upstream functional test count N=0 holds, for that reason [knowledge_ref: E###]"

patch_classification:
  - file: 0001-error-h-include-errno-h-for-OHOS.patch
    type: auto
    platform_only: false
    guard: "verified: without the patch `make prog` exits 2 on the errno/TLS link error and produces no binaries; with it the build exits 0"