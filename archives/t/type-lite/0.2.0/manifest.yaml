# 版本级 manifest — type-lite 0.2.0
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.2.0"

# 软件名
software: "type-lite"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/nonstd-lite/type-lite/archive/refs/tags/v0.2.0.tar.gz"

  # 源码校验和
  sha256: "47d6f78c3e8588f0a63e86c357d0d9e83543d754334df9dece7a4242047aea37"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DTYPE_LITE_OPT_BUILD_TESTS=ON"
  - "-DTYPE_LITE_OPT_BUILD_EXAMPLES=OFF"

  # 编译依赖列表（格式: name/version）— header-only，无依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

