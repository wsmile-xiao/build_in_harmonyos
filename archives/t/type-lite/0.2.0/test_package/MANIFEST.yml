# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: type-lite/0.2.0
homepage: "https://github.com/nonstd-lite/type-lite"

# 上游测试命令 (ctest -N 枚举: 4 个目标)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（同一份 115 用例按 4 个 C++ 标准编译）
upstream_tests:
  - file: test/type.t.cpp
    source: type-lite-0.2.0/test/type.t.cpp
    description: "上游 lest 用例 115 个（cpp98/11/14/17 各编译一版，ctest 4/4 通过）"
    command: "./type-lite-cpp98.t && ./type-lite-cpp11.t && ./type-lite-cpp14.t && ./type-lite-cpp17.t"
  - file: test/type-main.t.cpp
    source: type-lite-0.2.0/test/type-main.t.cpp
    description: "信息类用例 6 个（版本/宏断言，显式运行 6/6 通过）"
    command: "./type-lite-cpp98.t --pass \"type version\""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：通过 Conan 包消费 nonstd/type.hpp 验证强类型语义"
    command: "./test_type_lite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 121