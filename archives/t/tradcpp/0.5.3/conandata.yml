sources:
  url: "https://cdn.NetBSD.org/pub/NetBSD/misc/dholland/tradcpp-0.5.3.tar.gz"
  sha256: "e17b9f42cf74b360d5691bc59fb53f37e41581c45b75fcd64bb965e5e2fe4c5e"

patches:
  - patch_file: "patches/0001-add-GNUmakefile.patch"
    patch_description: >-
      add GNUmakefile: the upstream Makefile is a NetBSD makefile ending in
      ".include <bsd.prog.mk>" and cannot be read by GNU make at all.  GNU make
      prefers GNUmakefile over Makefile, so the upstream file is left untouched
      for NetBSD users while the HarmonyOS worker builds with plain GNU make
    patch_type: "portability"
