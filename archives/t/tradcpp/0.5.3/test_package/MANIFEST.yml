# 说明：40 条用例不依赖任何平台相关预定义宏（已 grep 全部 .c/.good，
# 无 __linux__ / __aarch64__ / __NetBSD__ / __ELF__ / __LP64__ 等），
# 且 config.h 对未知平台回落为 __unix__，因此 x86_64 Linux 与 aarch64 OHOS
# 的输出应完全一致。WSL 侧 x86_64 实测：40/40 PASS。

test_package_tests:
  - file: test_package/conanfile.py
    description: "CLI 消费者测试：用安装后的 tradcpp 预处理一段传统 C，断言三行输出（abcdef / #hello / bonjour）——其中 # 不被字符串化，正是 tradcpp 区别于 ISO cpp 的传统语义"
    command: "tradcpp -DGREETING=bonjour input.c output.txt"

assertion_count: 4
