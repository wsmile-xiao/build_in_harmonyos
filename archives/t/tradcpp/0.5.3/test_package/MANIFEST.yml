# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（tradcpp 0.5.3，tarball 内实测）：
#
#   upstream_case_total  = 40   （**可靠枚举**，非 UNKNOWN）
#       tests/Makefile 里显式列出：
#         TESTS=
#           t01 t02 ... t39 t40
#       每个 tNN 对应 tests/tNN.c + tests/tNN.good，harness 用 diff 逐字节比较。
#       这是上游 runner 的显式枚举，可直接作为 case 级总数。
#
#   upstream_test_files  = 80
#       tests/tNN.c   40 个（输入）
#       tests/tNN.good 40 个（期望输出）
#       另有 tests/subdir/test.h（t17/t38 用到的被包含文件）与 tests/Makefile。
#
#   upstream_test_targets = 1
#       tests/Makefile: all: run-tests .WAIT show-diffs —— 唯一的聚合目标；
#       40 个 $(T).diff 是它的内部依赖，不是独立测试程序。
#
# 执行方式：build() 内逐条复现上游 harness（conanfile.py::_run_upstream_tests）：
#     cd tests && <abs>/tradcpp tNN.c > tNN.run 2>&1 || echo FAILED >> tNN.run
#     compare tNN.run with tNN.good
#   两项细节必须照做：cwd 必须是 tests/，且传裸文件名 —— t38 断言 __FILE__，
#   换成绝对路径或从别的目录运行都会导致输出不同。
#   **实测通过数由真机日志回填，本文件不预设。**

package: tradcpp/0.5.3
homepage: "https://www.NetBSD.org/~dholland/tradcpp/"

upstream_check_command: "cd tests && make (NetBSD make)；本配方在 build() 内等价复现"
upstream_test_in_build: true
upstream_test_command: "逐用例：tradcpp tNN.c 的输出与 tests/tNN.good 比较（见 conanfile.py）"

upstream_tests:
  - file: tests/t01.c
    source: "tests/Makefile: TESTS 列表（t01..t40）"
    description: "上游用例 t01：tradcpp t01.c 的输出须与 tests/t01.good 逐字节一致"
    command: "tradcpp t01.c"
    count: 1
    count_unit: cases
