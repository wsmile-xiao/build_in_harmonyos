source:
  url: "https://cdn.NetBSD.org/pub/NetBSD/misc/dholland/tradcpp-0.5.3.tar.gz"
  sha256: "e17b9f42cf74b360d5691bc59fb53f37e41581c45b75fcd64bb965e5e2fe4c5e"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make   # GNUmakefile（本仓库补丁新增；上游 Makefile 是 NetBSD bsd.prog.mk，GNU make 读不了）"
  dependencies: []

patches_applied:
  - "patches/0001-add-GNUmakefile.patch"

knowledge_gained:
  - "上游 Makefile 只有 9 行、以 '.include <bsd.prog.mk>' 结尾，是 NetBSD make 专用；GNU make 完全无法解析（不是警告，是语法错误）。不删上游文件，改为补一个 GNUmakefile —— GNU make 的查找顺序 GNUmakefile > makefile > Makefile 会自动优先它，NetBSD 用户仍可用原 Makefile"
  - "patch 新增文件要用 diff -u /dev/null b/<file> 的 /dev/null 约定，patch -p1 --batch 才会无交互创建；diff -N 产生的 '--- a/<file>' 头会让 patch 询问 'File to patch:'"
  - "tradcpp 的 tests/ 目录就是完整测试套件：40 个 tNN.c + 40 个 tNN.good，harness 逐字节 diff。用例级总数可靠（tests/Makefile 里 TESTS= 显式枚举），不是 UNKNOWN"
  - "复现该 harness 有两个必须照做的细节：cwd 必须是 tests/（t17/t38 用相对路径 #include \"subdir/test.h\"），且必须传裸文件名 tNN.c（t38 断言 __FILE__，绝对路径会让输出变成绝对路径从而 diff 失败）"
  - "40 条用例都不依赖平台相关预定义宏（grep 全部 .c/.good 无 __linux__/__aarch64__/__NetBSD__/__ELF__/__LP64__/__TRADCPP__），config.h 对未知平台回落 __unix__，因此 x86_64 Linux 与 aarch64 OHOS 输出应一致"
  - "tradcpp 不实现 ISO 的 # 字符串化：'#define STR(x) #x' 后 STR(hello) 输出 #hello。这是它作为传统预处理器的本质特征，可用作 test_package 的真实语义断言"
  - "官方下载站是 https://www.NetBSD.org/~dholland/tradcpp/ 指向的 ftp/cdn.NetBSD.org/pub/NetBSD/misc/dholland/；CI 的镜像回退列表不含 netbsd.org 域，需直连"

