# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）

package: tinygltf/2.9.3
homepage: https://github.com/syoyo/tinygltf

upstream_check_command: "grep -c TEST_CASE tests/tester.cc（静态清点 34）"
upstream_test_in_build: true
upstream_test_command: "clang++ tester.cc [-DTINYGLTF_NOEXCEPTION] -o <variant>; ./<variant>（上游 tests/Makefile 同构）"

upstream_tests:
  - file: tests/tester.cc
    source: tests/
    description: "上游唯一测试程序（内嵌 Catch 框架）注册 34 个 TEST_CASE（303 断言）；上游 tests/Makefile 构建两个变体 tester 与 tester_noexcept（-DTINYGLTF_NOEXCEPTION），各自完整运行全部 34 用例：34 用例 x 2 变体 = 68 次用例执行全部通过；测试资产（*.gltf/*.glb 与 ../models/）随 tarball 提供，无需外部依赖"
    command: "conan create 内由 OHOS profile 编译器（tools.build:compiler_executables cpp）以 -std=c++11 编译并运行，cwd=tests"

test_package_tests:
  - file: test_package/test_tinygltf.cpp
    description: "消费者测试：以库使用者身份（TINYGLTF_IMPLEMENTATION 编译模式）编译链接已安装包，解析内嵌最小 glTF 2.0 资产，5 项断言（解析成功、asset 版本、场景图->节点->网格、POSITION 属性、accessor 组件类型/数量/VEC3）"
    command: "conan create（编译并运行 test_tinygltf）"

assertion_count: 5
upstream_discovered: 34
upstream_compiled: 2
upstream_executed: 68
upstream_passed: 68
upstream_skipped: 0
