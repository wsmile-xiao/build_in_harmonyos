# 软件级 manifest — ARCHIVE-SPEC v2.0
# 文件位置: archives/t/thc/manifest.yaml
software: thc
display: "THC IPv6 Attack Toolkit"
description: "THC IPv6 攻击工具集（parasite6、alive6、thcping6、fake_router6 等 68+ 款 IPv6 安全/审计工具）"
category: network
homepage: "https://github.com/vanhauser-thc/thc-ipv6"
license: AGPL-3.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 Makefile 构建；通过 MANPAGES= 关闭 man 页生成（避免运行编译出的二进制）"
    - "移除 -march=native/-flto（OHOS clang 不支持）与 -lresolv/-lrt（musl 已并入 libc）"
    - "依赖 include/lib 目录经 CPPFLAGS/LDFLAGS 注入；编译器取自 conan conf（R33）"
  common_dependencies:
    - libpcap
    - openssl
    - libnetfilter_queue

versions:
  "3.8":
    status: published
    build_date: "2026-09-22"
    published_as: thc
