# test_package/MANIFEST.yml
package: thc/3.8
homepage: "https://github.com/vanhauser-thc/thc-ipv6"

# 上游测试命令（R51：上游无自动化测试套件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# R51 核验说明
upstream_test_note: >
  R51 核验：thc-ipv6 v3.8 上游仓库（106 个文件）仅含 6to4test.sh 运维脚本，
  Makefile 无 test/check 目标，无 CUnit/CMocka 等单元测试框架。
  因此不存在上游自动化测试入口可供运行；可行性验证改由下方 test_package 消费者用例承担。

# test_package 中自带的测试（消费者视角验证，含 ≥1 鸿蒙用例）
test_package_tests:
  - file: test.sh
    description: >-
      消费者冒烟测试：address6 真实运行二进制（R34，非桩）。
      A1 fe80::0211:22ff:fe33:4455 解码 MAC=00:11:22:33:44:55；
      A2 fe80::aabb:ccff:fedd:eeff 解码 MAC=a8:bb:cc:dd:ee:ff；
      A3 2001:db8::1 进入错误路径（stderr 含 Error:，证明是真实 thc 二进制）。
      注：address6 成功解码返回退出码 1、仅错误路径返回非零，故以解码输出内容断言。
    command: "bash test.sh"

# 测试断言总数
assertion_count: 3
