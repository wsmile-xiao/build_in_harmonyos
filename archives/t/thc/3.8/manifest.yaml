# 版本级 manifest — ARCHIVE-SPEC v2.0
# 文件位置: archives/t/thc/3.8/manifest.yaml
version: "3.8"
software: "thc"
status: built
build_date: "2026-09-22"
build_system: makefile

source:
  url: "https://github.com/vanhauser-thc/thc-ipv6/archive/refs/tags/v3.8.tar.gz"
  sha256: "b60be61a8b0a944a66e3b719704b4c03c1bc2c22f32d5d21e99e434c82a9d769"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "MANPAGES=  # 禁止 all 目标执行每个二进制去生成 man 页（%.8 规则会运行二进制，交叉/OHOS 不安全）"
    - "CC=clang (取自 conan conf tools.build:compiler_executables，禁止裸 shell 变量，R33)"
    - "CFLAGS=-O2 -fPIC -Wall (patch 0001 改写，移除 -march=native/-flto)"
    - "CPPFLAGS=-I<libpcap> -I<openssl> -I<libnetfilter_queue>"
    - "LDFLAGS=-L<libpcap> -L<openssl> -L<libnetfilter_queue>"
  dependencies:
    - libpcap/1.10.6
    - openssl/3.5.6
    - libnetfilter_queue/1.0.5
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefile-ohos.patch"
  - "0002-sockaddr-storage-ohos.patch"

knowledge_gained:
  - "OHOS musl 已将 libresolv (getaddrinfo/Resolver) 与 librt (clock_*) 并入 libc；上游 Makefile 为 glibc 额外链接 -lresolv/-lrt，在 musl 下多余，patch 移除（dnsdict6 / thcping6 规则）"
  - "OHOS clang 不支持 -march=native（目标 CPU 未知）与 -flto（需全程序 LTO 链接），patch 改为 -O2 -fPIC -Wall"
  - "上游 Makefile 的 all 目标含 $(MANPAGES)，%.8 规则会执行每个编译出的二进制来生成 man 页；交叉/OHOS 构建下运行主机二进制不安全且会失败，构建时传 MANPAGES= 关闭"
  - "依赖 include/lib 目录 musl 不默认搜索，需经 CPPFLAGS/LDFLAGS 显式注入各依赖的 includedirs/libdirs（R33：编译器取自 conan conf，禁止裸 shell 变量）"
  - "R8 实战：thc-ipv6-lib.c 在 SIOCGIFHWADDR 分支下 #include <linux/netlink.h>，其传递包含 linux/socket.h 重定义 sys/socket.h 已定义的 sockaddr_storage（musl 下 _UAPI_LINUX_SOCKET_H 守卫冲突）；补丁 0002 以 _SYS_SOCKET_H 特性检测 + 预定义 _UAPI_LINUX_SOCKET_H 跳过冲突定义并补 __kernel_sa_family_t，未引入 __OHOS__ 平台宏"
  - "R8 合规：全程未引入 __OHOS__ 平台宏；仅删除 musl 不适用的链接标志（0001）与特性检测跳过 sockaddr_storage 重定义（0002）"

patch_generation:
  method: manual-unified-diff
  source_orig_dir: /data/storage/el2/base/cache/tmp/patchbuild/a
  source_work_dir: /data/storage/el2/base/cache/tmp/patchbuild/b
  source_orig_hash: 585539eca3b75444
  source_work_hash: 48d9ebc5e2b46374
  generated_at: '2026-09-22T01:00:00'
  patches_count: 2

patch_classification:
  - file: 0001-makefile-ohos.patch
    type: portability
    platform_only: false
    guard: none
  - file: 0002-sockaddr-storage-ohos.patch
    type: portability
    platform_only: false
    guard: _SYS_SOCKET_H
