sources:
  url:
    - "https://github.com/vanhauser-thc/thc-ipv6/archive/refs/tags/v3.8.tar.gz"
  sha256: "b60be61a8b0a944a66e3b719704b4c03c1bc2c22f32d5d21e99e434c82a9d769"

patches:
  - patch_file: "patches/0001-makefile-ohos.patch"
    patch_description: "Drop -march=native/-flto (cross/OHOS clang) and -lresolv/-lrt (musl provides them in libc); dep include/lib dirs injected via CPPFLAGS/LDFLAGS at build time"
    patch_type: "portability"
  - patch_file: "patches/0002-sockaddr-storage-ohos.patch"
    patch_description: "R8 feature-detection fix for sockaddr_storage redefinition: linux/netlink.h pulls in linux/socket.h which redefines sockaddr_storage already defined by sys/socket.h under musl; guard via _SYS_SOCKET_H + _UAPI_LINUX_SOCKET_H and provide __kernel_sa_family_t (no __OHOS__ macro)"
    patch_type: "portability"
