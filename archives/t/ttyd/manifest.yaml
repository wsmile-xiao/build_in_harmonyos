# 软件级 manifest — ttyd
# 文件位置: archives/t/ttyd/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: ttyd
display: "ttyd"
description: "Share your terminal over the web (libwebsockets + libuv based web terminal server)"
category: utility
homepage: "https://github.com/tsl0922/ttyd"
license: MIT

# ============================================================
# 构建信息
# ============================================================

build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "libwebsockets 必须开启 LWS_WITH_LIBUV（ttyd CMakeLists 无条件 FATAL_ERROR 检查），使用 libwebsockets/4.3.5.1"
    - "ttyd 直接链接 libuv（pty.c 使用 uv_pipe/uv_async），需显式声明 libuv/1.52.1"
    - "CMakeLists 通过 find_path/find_library 定位 json-c/libuv，需通过 CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH 注入依赖路径"
  common_dependencies:
    - libwebsockets
    - libuv
    - json-c
    - zlib
    - openssl

# ============================================================
# 版本索引
# ============================================================

versions:
  1.7.7:
    status: built
    build_date: "2026-08-17"
