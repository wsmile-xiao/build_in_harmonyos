# test_package/MANIFEST.yml — ttyd 1.7.7
# CI L0e requires this file to exist.

package: ttyd/1.7.7
homepage: "https://github.com/tsl0922/ttyd"

# ttyd 1.7.7 upstream has NO automated test suite:
#  - no tests/ directory in the source tree (verified: only src/ html/ man/ scripts/)
#  - CMakeLists.txt has no enable_testing() / add_test() and no `make check` target
#  - .github/workflows only cross-build (scripts/cross-build.sh) and package frontend
upstream_check_command: "cmake --build . && ctest"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: >
      Runs the installed ttyd CLI: binary presence, ttyd --version (1.7.7),
      ttyd --help and -h usage output, and minimal local web-terminal server
      startup on a loopback port (offline, no external network).
    command: "bash test.sh"

# Approximate assertion count (binary presence + version + help + short-help + server startup)
assertion_count: 5
