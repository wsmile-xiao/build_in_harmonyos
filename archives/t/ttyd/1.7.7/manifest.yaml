software: ttyd
# 版本级 manifest（ARCHIVE-SPEC v2.0）
# 文件位置: archives/t/ttyd/1.7.7/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "1.7.7"

# 编译状态
# published | built | failed | archived
# 注意：本版本已通过 conan-verify 与 finish built，但未提交 release/upload CI，
# 因此只能标记为 built，不得标记为 published。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub release 归档，不使用本机 file:// 路径）
  url: "https://github.com/tsl0922/ttyd/archive/refs/tags/1.7.7.tar.gz"

  # 源码校验和
  sha256: "039dd995229377caee919898b7bd54484accec3bba49c118e2d5cd6ec51e3650"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libwebsockets/4.3.5.1
    - libuv/1.52.1
    - json-c/0.18
    - zlib/1.3.1
    - openssl/3.5.6

  # 编译器（由 Conan OHOS profile 提供）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ttyd 1.7.7 的 CMakeLists 无条件检查 LWS_WITH_LIBUV（FATAL_ERROR），libwebsockets 必须开启 libuv 支持；libwebsockets/4.3.5.1 已满足"
  - "ttyd 通过 find_path/find_library 定位 json-c 与 libuv（非 CONFIG target），conanfile.py 需通过 CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH 注入依赖路径"
  - "ttyd 上游无自动化测试（无 tests/ 目录、无 enable_testing/ctest），仅提供 cross-build CI 脚本"
