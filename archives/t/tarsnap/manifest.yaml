software: tarsnap
display: "tarsnap"
description: "Tarsnap 安全在线备份客户端命令行工具集（tarsnap + 密钥管理工具）"
category: tool
homepage: "https://www.tarsnap.com/"
license: Tarsnap
build_system: autotools

ohos_adaptation:
  key_points:
    - "设备 uname 返回 HarmonyOS，config.guess 猜不出三元组 → configure 显式传 --build=aarch64-unknown-linux-ohos（tnef 1.4.18 先例）"
    - "autoconf 生成的 configure/config.status 用 umask 077 && mktemp -d 建暂存目录，HMDFS setgid 目录下不可写（E114 / DRAFT-6507）→ 配方内 _drop_umask_077 就地去除"
    - "openssl/zlib 依赖来自制品仓（openssl/3.0.21、zlib/1.3.2），AutotoolsDeps 注入 CPPFLAGS/LDFLAGS/LIBS（R33）"
    - "上游无标准 make check；官方测试为自定义 make test 目标（tests/test_tarsnap.sh，6 场景，5 个离线可跑 + 1 个需真实账号密钥自跳过）"
    - "E074: HMDFS jobserver fifo EPERM → make -j1"
    - "--build=*-*-linux-ohos 使 $target_os 命中 linux* 分支后 m4/check_linux_ext2fs.m4 硬性检查 ext2fs/ext2_fs.h → 依赖 e2fsprogs/1.47.4 提供头文件"
    - "tarsnap-keygen 完整流程需联网注册真实账号，离线不可验证 → 消费者测试用上游 tests/fake.keys 夹具走 keymgmt 密钥路径"
    - "CLI 工具门禁：软件级 commands.json；make install 装 bin/tarsnap* 与 man 页"

versions:
  "1.0.41":
    status: built
    build_date: "2026-09-24"
    conan_ref: "tarsnap/1.0.41"
    test_summary: "上游 make test 5 SUCCESS + 1 设计性 SKIP（04 需真实账号密钥）；消费者 15/15"
