version: "1.0.41"
software: "tarsnap"
status: built
build_date: "2026-09-24"
build_system: autotools
conan_ref: "tarsnap/1.0.41"

source:
  url: "https://www.tarsnap.com/download/tarsnap-autoconf-1.0.41.tgz"
  sha256: "bebdbe1e6e91233755beb42ef0b4adbefd9573455258f009fb331556c799b3d0"
  tar_format: tgz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--prefix=<package_folder>"
  dependencies:
    - openssl/3.0.21
    - zlib/1.3.2
    - e2fsprogs/1.47.4
  cc: clang
  upstream_test_command: "make test"

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "自定义 make test 目标（tests/test_tarsnap.sh .，6 场景串行，多个 check/断言）"
  upstream_discovered: 6
  upstream_passed: 5
  upstream_failed: 0
  upstream_skipped: 1
  upstream_note: "make test 实测：01/02/03/05/06 场景 SUCCESS，04-c-d-real-keyfile 需真实 Tarsnap 账号密钥（TARSNAP_TEST_KEYFILE 未设置）按上游设计自跳过（SKIP），非失败；离线可跑场景 5/5 通过"
  test_package_passed: 15
  test_package_failed: 0
  test_package_assertions: 15
  execution: "conan create rc=0（configure/make -j1/make test/make install）+ 上游 make test（5 SUCCESS + 1 上游设计性 SKIP）+ 消费者 15/15（五工具冒烟/keymgmt 密钥读取与只读派生/initialize-cachedir/dry-run）"

patches_applied: []  # E114 umask 077 由配方内 _drop_umask_077 就地修正，无补丁文件

knowledge_gained:
  - "tarsnap 上游无标准 make check 目标，官方测试为自定义 make test 目标（tests/test_tarsnap.sh，6 场景）"
  - "场景 04 需要真实 Tarsnap 账号密钥（TARSNAP_TEST_KEYFILE），离线构建按上游设计自跳过，非失败"
  - "autoconf 官方 tarball 自带 configure，无需 autoreconf/tool_requires automake"
  - "configure/config.status 的 umask 077 && mktemp -d 在 HMDFS setgid 目录下不可写（E114），配方就地去除"
  - "--build=*-*-linux-ohos 使 configure 的 $target_os 命中 linux* 分支，m4/check_linux_ext2fs.m4 硬性检查 ext2fs/ext2_fs.h → 需 e2fsprogs/1.47.4 提供头文件"
  - "tarsnap-keygen 完整流程必须联网向 Tarsnap 服务器注册真实账号（keygen_network_register），无法离线验证 → 消费者测试改用上游 tests/fake.keys 夹具走 keymgmt 密钥路径"
  - "openssl/zlib 依赖由 AutotoolsDeps 注入 CPPFLAGS/LDFLAGS/LIBS（R33）"
