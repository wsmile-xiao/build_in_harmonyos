# test_package/MANIFEST.yml
# tarsnap 1.0.41
# 上游没有标准的 automake check 目标；官方测试框架为自定义 `make test`
# 目标（tests/test_tarsnap.sh），通过后输出 "ALL TESTS SUCCESSFULLY COMPLETED"。

package: tarsnap/1.0.41
homepage: "https://www.tarsnap.com/"

upstream_tests_exist: true
upstream_test_audit: >
  tests/test_tarsnap.sh 串行运行 6 个场景（01-trivial, 02-c-dry-run-no-keyfile,
  03-c-dry-run-fake-keyfile, 04-c-d-real-keyfile, 05-passphrase,
  06-progress-output）；每个场景含多个 check（--help/--version/退出码/输出
  grep 断言）。04 场景需要真实 Tarsnap 账号密钥（TARSNAP_TEST_KEYFILE），
  未设置时按上游设计自跳过（echo "-1"）；其余场景全部离线可跑。
upstream_test_count: 6
upstream_test_skipped_offline: 1
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# make test 实际运行的场景（tests/test_tarsnap.sh .）
upstream_tests:
  - file: tests/01-trivial.sh
    description: "tarsnap --help/--version/无参数退出码与输出断言（离线）"
    command: "make test"
  - file: tests/02-c-dry-run-no-keyfile.sh
    description: "无密钥 dry-run 的报错行为断言（离线）"
    command: "make test"
  - file: tests/03-c-dry-run-fake-keyfile.sh
    description: "fake.keys 下 --initialize-cachedir + -c --dry-run --print-stats（离线）"
    command: "make test"
  - file: tests/04-c-d-real-keyfile.sh
    description: "需真实 Tarsnap 账号密钥；无 TARSNAP_TEST_KEYFILE 时按上游设计自跳过"
    command: "make test"
  - file: tests/05-passphrase.sh
    description: "带口令密钥 fake-passphrased.keys 的解密路径（离线）"
    command: "make test"
  - file: tests/06-progress-output.sh
    description: "--progress 输出与 .good 基线比对（离线）"
    command: "make test"

# test_package 中自带的测试（消费者视角, R34: 真实执行被适配工具）
test_package_tests:
  - file: test_tarsnap.sh
    description: "消费者视角: 真实执行 tarsnap --version/--help、五工具 --version 冒烟、keymgmt 读真实密钥/打印 key-id/派生只读密钥、初始化 cachedir、dry-run 模拟归档, 共 15 项断言"
    command: "./test_tarsnap.sh"

# 密钥夹具：上游 tests/fake.keys 的副本。tarsnap-keygen 完整流程必须联网向
# Tarsnap 服务器注册真实账号（keygen_network_register），无法离线验证；
# 密钥路径改用上游场景 03 同款夹具（见 test_tarsnap.sh 头部说明）。
test_fixtures:
  - file: fake.keys
    source: "上游 tarball tests/fake.keys 原样副本（sha256 与源码包一致）"

# 断言总数近似值（上游 5 个可离线场景的 check 断言 + 消费者 15 项）
assertion_count: 36
