software: ttyplot
display: "ttyplot"
description: "终端实时绘图工具，从 stdin 读取数据绘制折线图"
category: system
homepage: "https://github.com/tenox7/ttyplot"
license: Apache-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "ncurses 预编译包缺少 .pc pkg-config 文件，需手动创建 ncursesw.pc 和 ncurses.pc"
    - "ncursesw.pc Cflags 需包含 -D_XOPEN_SOURCE_EXTENDED 以启用宽字符支持"
    - "mvvline_set 函数声明警告（4个），不影响功能"
    - "ttyplot 版本标志使用 -v 而非 --version"
  common_dependencies:
    - ncurses

versions:
  "1.7.1":
    status: built
    build_date: "2026-07-24"