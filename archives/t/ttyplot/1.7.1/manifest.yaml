software: ttyplot
version: "1.7.1"
build_system: makefile
status: built
build_date: "2026-07-24"

source:
  url: "https://github.com/tenox7/ttyplot/archive/refs/tags/1.7.1.tar.gz"
  sha256: "d1624eea52abec5538c9b19bae00f81642c2d2886cd7755988466b74424ce9ca"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make CC=/data/service/hnp/bin/clang CFLAGS='-Wall -Wextra -I<ncurses>/include' LDLIBS='-L<ncurses>/lib -lncursesw -lm' -j1"
  dependencies:
    - ncurses/6.5 (Conan dependency, static libncursesw.a)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ttyplot 使用 plain Makefile 构建，非 autotools" ref:E052
  - "需要手动创建 ncursesw.pc pkg-config 文件（ncurses 预编译包未提供 .pc 文件）" ref:E052
  - "mvvline_set 函数警告属于 ncursesw wide-char API，不影响功能" ref:E052
  - "ttyplot 版本标志使用 -v 而非 --version" ref:E052