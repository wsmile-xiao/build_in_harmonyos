# test_package/MANIFEST.yml
# CI 脚本 (ci/conan/build_and_test.sh L0e) 要求此文件存在。
package: tlsh/5.0.0
homepage: "https://github.com/trendmicro/tlsh"

# 上游测试入口（本包 build() 内真实执行）
upstream_check_command: "ctest (Testing/CMakeLists.txt 注册 tlsh_unittest_len_xlen -> Testing/test.sh)"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target test; sh Testing/test_parts.sh; sh Testing/test_pattern.sh"

upstream_tests:
  - file: Testing/test.sh
    source: tlsh-5.0.0/Testing/test.sh
    description: "上游官方 shell 回归：len/xlen 两场景的编号测试块 1-5 + testlen/-force/-l2/-lcsv/-split/simple_unittest"
    command: "ctest --output-on-failure"
  - file: Testing/test_parts.sh
    source: tlsh-5.0.0/Testing/test_parts.sh
    description: "tlsh_parts 分解输出回归：1 个 digest 用例 + 80 个样例文件 x {默认,private,thread} 三种形态"
    command: "sh Testing/test_parts.sh"
  - file: Testing/test_pattern.sh
    source: tlsh-5.0.0/Testing/test_pattern.sh
    description: "tlsh_pattern 模式匹配回归：TAB/COMMA 两种分隔符各 3 次 diff"
    command: "sh Testing/test_pattern.sh"

test_package_tests:
  - file: test_package/test_tlsh.cpp
    description: "消费者断言：Tlsh::version() 前缀、上游已知输入->已知 digest、距离计算、fromTlshStr 往返；并执行安装后的 CLI"
    command: "./test_tlsh; tlsh -version"

assertion_count: 16
