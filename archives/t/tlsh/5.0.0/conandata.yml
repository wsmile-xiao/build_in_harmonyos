# conandata.yml — tlsh 5.0.0
# 上游官方源码（GitHub tag 5.0.0 无附件资产，用官方 archive 源码包；CI 自动追加镜像回退）
sources:
  url: "https://github.com/trendmicro/tlsh/archive/refs/tags/5.0.0.tar.gz"
  sha256: "2e513993b6b08380dd03777c22caab33a6d0d93ef230250b1b12027d9b7d8a4b"

patches:
  - patch_file: "patches/0001-src-input_desc.cpp.patch"
    patch_description: >-
      修复 -split 的未初始化指针解引用（段错误）：inputd->tptr 用 malloc 分配后
      只在分发循环里初始化 tptr[0]，而 splitlines 分支第一轮就把该循环短路
      (ti = n_file)，于是超出「实际命中分隔位置数」的槽位保持未初始化堆内容，
      输出循环仍按 n_file 遍历并解引用。上游在 glibc 下靠新分配页为 0 侥幸通过，
      OHOS 上必现段错误（tlsh -split 50,100,200 -f Week3.txt → SIGSEGV）。
    patch_type: "bugfix"

# 说明：CMake 4.x 的 cmake_minimum_required(2.6) 兼容问题不用补丁解决，
# 由配方 generate() 的 CMAKE_POLICY_VERSION_MINIMUM cache 变量处理（不改源码）。
