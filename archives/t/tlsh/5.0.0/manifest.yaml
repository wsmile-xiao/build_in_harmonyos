  dependencies: []
  cc: clang
  cxx: clang++

# 源码补丁 1 个：上游 -split 未初始化指针解引用（真实缺陷，非平台适配补丁）。
# CMake 4 兼容问题用配方 cache 变量解决，不进补丁。
patches_applied:
  - "0001-src-input_desc.cpp.patch"

knowledge_gained:
  - "上游根 CMakeLists.txt 声明 cmake_minimum_required(VERSION 2.6)，CMake 4.x（本机 4.1.2）已移除 <3.5 兼容：修复变量 CMAKE_POLICY_VERSION_MINIMUM 必须走 cache_variables(-D)，tc.variables 写进 conan_toolchain.cmake、加载时机在 cmake_minimum_required 之后故无效"  # knowledge_ref: E187（同族 E103）
  - "上游测试主体是 shell 回归（Testing/test.sh + Testing/exp/*_EXP 夹具 + testlen.sh），ctest 只注册 1 个用例 tlsh_unittest_len_xlen；test_parts.sh / test_pattern.sh 未接入 ctest，需在 build() 内显式执行才能进入干净轮证据"  # knowledge_ref: E581
  - "上游 install 只装 tlsh_unittest 并在 bin/ 建符号链接 tlsh（install(CODE file(CREATE_LINK ... SYMBOLIC))）；tlsh_parts/tlsh_pattern/simple_unittest 不安装，因此包内 CLI 只有 bin/tlsh"  # knowledge_ref: E581
  - "src/CMakeLists.txt 默认只建静态库 libtlsh.a（TLSH_SHARED_LIBRARY 默认 0，上游注释明确不推荐共享库），shared 选项须显式映射到该开关；共享形态下测试二进制带 SKIP_BUILD_RPATH，需 LD_LIBRARY_PATH 指向源码 lib/"  # knowledge_ref: E581
  - "上游缺陷（0001 补丁）：src/input_desc.cpp 的 inputd->tptr 用 malloc 分配后只在分发循环里置 tptr[0]=NULL，而 splitlines 分支第一轮就 ti=n_file 短路该循环；-split 请求的分隔行号大于文件行数时，实际命中的段数少于 n_file，尾部槽位保持未初始化堆内容，输出循环按 n_file 解引用 → SIGSEGV。glibc 上新页为 0 侥幸不触发（上游 exp 夹具正是 3 行），OHOS 必现"  # knowledge_ref: E581
  - "库自身的 add_definitions(-DBUCKETS_128) 决定公共头文件的 TLSH_STRING_LEN_REQ 与 getHash() 默认参数签名，必须用 cpp_info.defines 导出给消费者，否则消费者编译期的常量与函数签名不一致"  # knowledge_ref: E581

