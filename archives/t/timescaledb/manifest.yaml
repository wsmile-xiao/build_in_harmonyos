software: timescaledb
display: "TimescaleDB"
description: "PostgreSQL extension for high-performance real-time analytics on time-series and event data"
category: db
homepage: "https://www.timescale.com/"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "需要 PostgreSQL 17.0+ 作为依赖"
    - "EXPERIMENTAL=ON 模式支持 PG17.0（官方要求 17.2+）"
    - "CMake 构建需要从 pg_config CPPFLAGS 提取 OpenSSL include 路径"
  common_dependencies:
    - postgresql >= 17.0

versions:
  "2.27.2":
    status: built
    build_date: "2026-06-03"
