version: "2.27.2"
status: built
build_date: "2026-06-03"

source:
  url: "https://api.github.com/repos/timescale/timescaledb/tarball/2.27.2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DEXPERIMENTAL=ON"
  dependencies:
    - "postgresql >= 17.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-compat-compat.h.patch"
  - "0003-src-nodes-modify_hypertable_exec.c.patch"

knowledge_gained:
  - "TimescaleDB 2.27.2 官方要求 PG17.2+，使用 EXPERIMENTAL=ON 可支持 PG17.0"
  - "CMake 需要从 pg_config CPPFLAGS 提取 OpenSSL include 路径"
  - "PG17.0 缺少 ri_needLockTagTuple API（PG17.1+ 引入），需条件编译"
