package: tinyframe/0.1.1
homepage: "https://github.com/DNS-OARC/tinyframe"

upstream_check_command: "make check -j1"
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\", args=[\"-j1\"])"

# Upstream registers three shell tests.  test1.sh invokes six chunk sizes,
# test2.sh invokes write and read separately, and test3.sh invokes one API test:
# nine executable scenarios in total.
upstream_tests:
  - file: "src/test/test1.sh"
    source: "tinyframe-0.1.1/src/test/test1.sh"
    description: "Read test.fstrm in 7-byte chunks"
    command: "./test1 test.fstrm 7"
  - file: "src/test/test1.sh"
    source: "tinyframe-0.1.1/src/test/test1.sh"
    description: "Read test.fstrm in 15-byte chunks"
    command: "./test1 test.fstrm 15"
  - file: "src/test/test1.sh"
    source: "tinyframe-0.1.1/src/test/test1.sh"
    description: "Read test.fstrm in 24-byte chunks"
    command: "./test1 test.fstrm 24"
  - file: "src/test/test1.sh"
    source: "tinyframe-0.1.1/src/test/test1.sh"
    description: "Read test.fstrm in 44-byte chunks"
    command: "./test1 test.fstrm 44"
  - file: "src/test/test1.sh"
    source: "tinyframe-0.1.1/src/test/test1.sh"
    description: "Read test.fstrm in 79-byte chunks"
    command: "./test1 test.fstrm 79"
  - file: "src/test/test1.sh"
    source: "tinyframe-0.1.1/src/test/test1.sh"
    description: "Read test.fstrm in 134-byte chunks"
    command: "./test1 test.fstrm 134"
  - file: "src/test/test2.sh"
    source: "tinyframe-0.1.1/src/test/test2.sh"
    description: "Write a Frame Streams sequence"
    command: "./test2 w test2.fstrm"
  - file: "src/test/test2.sh"
    source: "tinyframe-0.1.1/src/test/test2.sh"
    description: "Read and validate the generated Frame Streams sequence"
    command: "./test2 r test2.fstrm"
  - file: "src/test/test3.sh"
    source: "tinyframe-0.1.1/src/test/test3.sh"
    description: "Validate public API bounds, errors, and big-endian header"
    command: "./test3"

test_package_tests:
  - file: "tinyframe_tests.c"
    description: "Frame size calculation"
    command: "ctest -R '^tinyframe.frame_size$'"
  - file: "tinyframe_tests.c"
    description: "Big-endian header serialization"
    command: "ctest -R '^tinyframe.header_endian$'"
  - file: "tinyframe_tests.c"
    description: "READY control frame encoding"
    command: "ctest -R '^tinyframe.ready_control$'"
  - file: "tinyframe_tests.c"
    description: "START control and content-type field encoding"
    command: "ctest -R '^tinyframe.start_control$'"
  - file: "tinyframe_tests.c"
    description: "Binary data-frame writer/reader round trip"
    command: "ctest -R '^tinyframe.frame_roundtrip$'"
  - file: "tinyframe_tests.c"
    description: "STOP state transition"
    command: "ctest -R '^tinyframe.stop_control$'"
  - file: "tinyframe_tests.c"
    description: "FINISH state transition"
    command: "ctest -R '^tinyframe.finish_control$'"
  - file: "tinyframe_tests.c"
    description: "Partial control input handling"
    command: "ctest -R '^tinyframe.partial_input$'"
  - file: "tinyframe_tests.c"
    description: "Invalid control field rejection"
    command: "ctest -R '^tinyframe.invalid_field$'"
  - file: "ohos_platform_test.c"
    description: "HarmonyOS kernel, 64-bit PC data model, page size, and public API verification"
    command: "ctest -R '^tinyframe.harmonyos_platform$'"

assertion_count: 28
upstream_test_count: 9
