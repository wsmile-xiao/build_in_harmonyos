# 软件级 manifest
# 文件位置: archives/t/tboot/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: tboot

# 显示名
display: "tboot (Intel TXT)"

# 一句话描述
description: "Intel TXT measured-launch tooling: LCP policy tools (lcptools-v2), tb_polgen and the txt-stat/txt-parse_err utilities"

# 分类标签
category: crypto

# 官网 URL
homepage: "https://sourceforge.net/projects/tboot/"

# 开源许可证（SPDX 标识）
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游是手写多级 Makefile（无 configure/cmake）：默认构建 tboot(引导模块) + safestringlib + lcptools-v2 + tb_polgen + utils + docs"
    - "tboot 子项目是 freestanding x86-32 引导固件（-m32 -march=i686、LDFLAGS=-melf_i386），无法为 aarch64 产出，非 x86 目标需从 SUBDIRS 剔除"
    - "utils/txt-acminfo 读 x86 MSR/IO 端口（tboot/include/{processor,io}.h），仅 x86 可用"
    - "CLI 侧仅 lcptools-v2 / tb_polgen 链接第三方库：LIBS += -lcrypto -lz（lcptools-v2/Makefile:69、tb_polgen/Makefile:18）"
    - "lcptools-v2/lcputils.c 使用 OpenSSL 3 provider API（core.h/decoder.h/param_build.h），必须配 OpenSSL 3.x"
    - "上游 CFLAGS_WARN 带 -Werror，clang 15 会对 GNU 老式指定初始化、packed 结构里的变长成员、未使用静态函数、'\\0' 空指针常量报错；按诊断逐条 -Wno-error= 有界降级，不整体取消 -Werror"
    - "lcp2_mlehash 用 tmpfile() 建解压临时文件，固定落在 /tmp；OHOS /tmp 是只读挂载（E002），必须改为 $TMPDIR"
    - "自带静态库 liblcp.a / libsafestring.a 随源码树构建，不是第三方依赖"
  # 跨版本通用依赖
  common_dependencies:
    - openssl
    - zlib

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.10.5":
    status: built
    build_date: 2026-09-24
