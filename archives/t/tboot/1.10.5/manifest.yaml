# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（SourceForge 官方 release，R39）
  url: "https://downloads.sourceforge.net/project/tboot/tboot/tboot-1.10.5.tar.gz"

  # 源码校验和（实测：sha256sum 得到，与 Debian orig tarball 逐字节一致）
  sha256: "3b4be16c03cbc25071ef1d4bda0b4fd550eed86dac6c7f7efdf02423c551b393"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # 上游 ref
  upstream_tag: "v1.10.5"
  upstream_commit: "9c406d761d2ebb51ef7e762a7ed37a0664c65370"   # hg node (.hg_archival.txt)
  upstream_archive_id: "cedd93279188334eb41d248d5eb70a41a2bc70ca"
  release_date: "2022-03-04"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 手写多级 Makefile：无 configure，参数只有工具链与依赖路径
  configure_options: []
  make_options:
    - "CC=<clang>  AR=<llvm-ar>  RANLIB=<llvm-ranlib>（来自 tools.build:compiler_executables）"
    - "CFLAGS/-L 通过环境变量传入（Makefile 各层用 += 追加，命令行覆盖会吃掉 safestringlib/utils 的私有标志）"
    - "-j1"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6.1
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# 目标范围（aarch64/OHOS 实际构建的子项目）
build_scope:
  subdirs: [safestringlib, lcptools-v2, tb_polgen, utils, docs]
  tools: [lcp2_mlehash, lcp2_crtpol, lcp2_crtpollist, lcp2_crtpolelt, tb_polgen, txt-stat, txt-parse_err]
  excluded:
    - "tboot：freestanding x86-32 引导固件（-m32 -march=i686、-melf_i386），aarch64 无法产出"
    - "utils/txt-acminfo：读 x86 MSR/IO 端口（tboot/include/{processor,io}.h）"
    - "txt-test / test-patches：需要 Linux 内核源码树（上游 Makefile:16 明确排除）"
    - "lcp-gen2：Python + M2Crypto GUI，不在 SUBDIRS"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Config.mk.patch"
  - "0002-Makefile.patch"
  - "0003-lcptools-v2-crtpol.c.patch"
  - "0004-lcptools-v2-mlehash.c.patch"
  - "0005-lcptools-v2-pollist2.c.patch"
  - "0006-safestringlib-makefile.patch"
  - "0007-safestringlib-safeclib-strpbrk_s.c.patch"
  - "0008-safestringlib-unittests-test_wmemmove_s.c.patch"
  - "0009-utils-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "手写多级 Makefile 的 arch 分支：tboot 用 `uname -m` 推 TARGET_ARCH，非 x86_64 一律加 -m32 -march=i686 → aarch64 上 clang 直接 error: unsupported argument 'i686' to option '-march='"
  - "老代码 + clang 15 + 上游自带 -Werror：GNU 老式指定初始化（-Wgnu-designator）、packed 结构中的变长成员（-Wgnu-variable-sized-type-not-at-end）、未使用 static inline（-Wunused-function）、'\\0' 当空指针（-Wnon-literal-null-conversion）；按诊断逐条 -Wno-error= 降级，保留告警输出"
  - "OHOS /tmp 只读（E002）：上游 tmpfile() 固定落在 /tmp，lcp2_mlehash 解压路径完全不可用；改为 $TMPDIR（mkstemp + unlink 保持匿名语义），TMPDIR=/tmp 可复现失败、指向可写目录即成功"
  - "OpenSSL 3 静态链接：lcputils.c 用 provider API（core.h/decoder.h/param_build.h），-lcrypto 静态归档 + OHOS musl 无需额外 -ldl/-lpthread；产物 DT_NEEDED 仅 libc.so"
  - "上游用例自身缺陷：test_wmemmove_s.c 把 char* 误转 (wchar_t)（整数），clang 报 -Wint-conversion；test_strcasestr_s.c 依赖 _GNU_SOURCE 下的 libc strcasestr 声明"
  - "tb_polgen 的 image 型哈希 = SHA256(SHA256(cmdline) || SHA256(image))（commands.c:do_add + hash.c:extend_hash），可作为跨平台黄金值断言 libcrypto 是否真实工作"

