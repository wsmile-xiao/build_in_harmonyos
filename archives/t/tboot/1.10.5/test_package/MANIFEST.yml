# test_package/MANIFEST.yml — tboot/1.10.5
# CI (ci/conan/build_and_test.sh L0e) requires this file: it declares where the
# upstream tests are and which consumer tests the package itself adds.

package: tboot/1.10.5
homepage: "https://sourceforge.net/projects/tboot/"

# ── 上游测试台账（R51：先清点、再实跑、如实回填）────────────────────────────
# tboot 上游没有 `make check` 目标，也没有 CI 测试配置。逐目录清点结果：
#   safestringlib/unittests/  65 个 test_*.c + Safe_String_UnitTestMain.c，
#                             由 safestringlib/makefile:49 的 `safestringtest`
#                             目标构建（`all: libsafestring.a safestringtest`）
#   txt-test/                 Linux 内核模块（Kbuild + txt-test.c），需要
#                             内核源码树，未纳入 SUBDIRS（Makefile:16）
#   test-patches/             内核侧测试补丁（e820/mtrrs/tpm/vsprintf），同样
#                             需要内核源码树
#   uml/                      PlantUML 流程图（launch/load_sinit/prepare_cpu/
#                             shutdown），不是测试
#   tboot/                    x86-32 引导模块自身无用例；本平台不构建该模块
#
# 唯一可运行的上游自动化套件 = safestringlib 单元测试（以下命令已实际执行）。
upstream_check_command: "make -C safestringlib safestringtest && (cd safestringlib && ./safestringtest)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: safestringlib/unittests/Safe_String_UnitTestMain.c
    description: >-
      上游 safestringlib 单元测试驱动：main() 顺序调用 65 个 test_*_s() 用例函数。
      实测：`make -C safestringlib safestringtest` 构建通过，`./safestringtest`
      退出码 0，输出 214 个 `Test #N` 用例、12 个 "Testing xxx_s:" 分组头；
      全部用例执行完毕（BEGIN/END TEST 齐全）。
    sha256: "efc7fd1062ea989685b443372f5aab68b333ef6b50c974f468b566af6970add4"  # 上游 tarball 内原文件（未打补丁）
    case_count: 214
    groups: 65
    runnable_on_ohos: true
    result: "214/214 用例执行；安全库断言 0 失败；4 处与 libc strcmp 返回值量级不同的对照提示（见 notes.md）"
  - file: safestringlib/unittests/test_wmemmove_s.c
    description: >-
      用例 17/18 缓冲区偏移移动：上游把 char* 误转为 wchar_t（整数），clang 15
      直接报 -Wint-conversion 错误（GCC 仅告警）。补丁 0008 修正为 wchar_t*，
      修正后的用例实际执行通过。
    sha256: "e4ebd8a3cccf42d2c0b33f22a6ffa81cd79b2d3e73ad61cedda2eaeaadde439f"  # 上游原文件；本仓库经补丁 0008 修改（sha256 见 patches/）
    runnable_on_ohos: true
    result: "用例执行通过（含 19 个 Test #）"
  - file: txt-test/txt-test.c
    description: >-
      Linux 内核模块形式的 TXT 测试（Kbuild），需要一份内核源码树做外部构建；
      上游 Makefile:16 明确说明该目录“requires pathing to Linux src”，不在
      SUBDIRS 内。本环境无内核源码树，无法执行。
    sha256: "17c1e4592731f292a2b267fcf2ebc0587a83ab1f1c7bfa40f076dd1b870e6035"
    runnable_on_ohos: false
    result: "未执行（需要 Linux 内核源码树；非本包产物路径）"
  - file: test-patches/vsprintf-test.patch
    description: 面向上游 Linux 内核的测试补丁（另见 e820-test.patch、mtrrs-test.patch、tpm-test.patch），同样依赖内核源码树。
    sha256: "8a3981f49199ff5b7eebfb00b85cbda17230750d2a8b8486077e9932412e2b57"
    runnable_on_ohos: false
    result: "未执行（需要 Linux 内核源码树）"

# ── 适配后新增的消费者测试（conan create 自动执行）──────────────────────────
test_package_tests:
  - file: test.sh
    description: >-
      22 条断言：A) 7 个可执行文件均存在于 PATH；B) tb_polgen 策略创建/追加/
      回读，并把打印出的摘要钉死为 SHA256(SHA256(cmdline)||SHA256(image))
      黄金值（真正让 OpenSSL EVP-SHA256 工作起来）；C) lcptools-v2 的元素/
      策略列表（--show 通过 TPM2.0 结构自校验、版本 0x300）/策略+策略数据
      生成，以及 txt-parse_err 解析 TXT.ERRORCODE；D) 鸿蒙特有 4 条——
      OH-1/OH-2 验证解压临时文件走 $TMPDIR（/tmp 在 OHOS 是只读挂载，上游
      tmpfile() 路径不可用），OH-3/OH-4 验证 7 个产物均为 ELF64/AArch64、
      DT_NEEDED 仅 libc.so、无 RUNPATH/RPATH。
    command: "bash test.sh"
  - file: conanfile.py
    description: 消费者测试入口：通过 VirtualRunEnv 把被测包的 bin/ 加进 PATH，工具一律从被测包的 package_folder 解析（保证 CI L1e 破坏性负向验证真实失败）。
    command: "conan create . --version=1.10.5 -pr:h=ci/conan/profiles/ohos-aarch64"

# 断言总数：20（消费者测试）+ 214（上游 safestringlib 用例，本地实跑，不在 conan create 内重复执行）
assertion_count: 22
upstream_case_count: 214

# ── 鸿蒙适配说明 ────────────────────────────────────────────────────────────
ohos_notes:
  source_patches: >-
    9 个补丁（见 conandata.yml / patches/）：0001 x86 机器参数与 clang 新增
    诊断的有界降级；0002/0009 非 x86 目标不构建 tboot 模块与 txt-acminfo；
    0003/0005 两处 clang 控制流分析发现的未初始化读取；0004 解压临时文件改用
    $TMPDIR（/tmp 在 OHOS 只读，E002）；0006 safestringlib 链接参数拼写与
    `-D_GNU_SOURCE`；0007 删除只写不读的局部变量；0008 修正上游用例的
    char*→wchar_t 误转。所有补丁均不含 __OHOS__ 平台宏。
  scope: >-
    aarch64/OHOS 上构建的是 7 个宿主侧工具（lcptools-v2 / tb_polgen / utils）
    与自带静态库 safestringlib；x86-32 引导模块 tboot 与仅 x86 可用的
    txt-acminfo 不构建（前者是 freestanding x86 固件，后者读 x86 MSR/IO 端口）。
  tmp_read_only: >-
    本机 /tmp 为只读挂载（`touch /tmp/x` → Read-only file system）。上游
    lcp2_mlehash 用 tmpfile() 解压输入，固定落在 /tmp，导致该工具在本平台
    完全不可用；补丁 0004 改为在 $TMPDIR 下创建（unlink 后保持匿名语义）。
