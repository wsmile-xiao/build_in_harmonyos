# conandata.yml — tboot 1.10.5
#
# 上游官方源：SourceForge 项目 tboot 的官方下载服务（R39）。
# 用 `downloads.sourceforge.net` 直连而不是 `.../files/.../download` 页面式
# 链接：后者虽然也返回同一份 tar.gz，但 URL 末段是 `download` 没有扩展名，
# Conan 的 get() 会据此猜错归档格式（BadZipFile），且页面式链接面向浏览器。
# 两者实测返回完全相同的字节（907657 B，sha256 3b4be16c…b393），与 Debian
# orig tarball 逐字节一致；.hg_archival.txt 记录 tag: v1.10.5 /
# node 9c406d761d2ebb51ef7e762a7ed37a0664c65370。
sources:
  url: "https://downloads.sourceforge.net/project/tboot/tboot/tboot-1.10.5.tar.gz"
  sha256: "3b4be16c03cbc25071ef1d4bda0b4fd550eed86dac6c7f7efdf02423c551b393"

patches:
  1.10.5:
    - patch_file: "patches/0001-Config.mk.patch"
      patch_description: "只在 x86 目标上追加 -m32/-march=i686；aarch64 上 clang 会拒绝该参数。同一补丁对 clang 新增的诊断（GNU 扩展/未使用静态函数/'\0' 空指针常量）做有界降级，仍保留告警输出，不整体取消 -Werror"
      patch_type: "portability"
    - patch_file: "patches/0002-Makefile.patch"
      patch_description: "非 x86 目标不再构建 tboot 子项目（该子项目是 x86-32 freestanding 引导固件，无法为 aarch64 产出）"
      patch_type: "portability"
    - patch_file: "patches/0003-lcptools-v2-crtpol.c.patch"
      patch_description: "初始化 use_only_version，消除 clang 控制流分析报告的未初始化读取"
      patch_type: "bugfix"
    - patch_file: "patches/0004-lcptools-v2-mlehash.c.patch"
      patch_description: "解压临时文件改用 $TMPDIR（tmpfile() 固定落在只读的 /tmp，OHOS 上导致 lcp2_mlehash 完全无法工作）"
      patch_type: "portability"
    - patch_file: "patches/0005-lcptools-v2-pollist2.c.patch"
      patch_description: "初始化 EVP_PKEY *pubkey，避免 OpenSSL 3 错误分支释放未初始化指针"
      patch_type: "bugfix"
    - patch_file: "patches/0006-safestringlib-makefile.patch"
      patch_description: "修正链接选项拼写 -z relo -> -z relro；编译规则不再传链接器选项；单元测试编译加 -D_GNU_SOURCE（对照 libc 的 GNU 扩展）"
      patch_type: "portability"
    - patch_file: "patches/0007-safestringlib-safeclib-strpbrk_s.c.patch"
      patch_description: "删除只写不读的局部变量 len（同时消除 -Werror,-Wunused-but-set-variable），行为不变"
      patch_type: "portability"
    - patch_file: "patches/0008-safestringlib-unittests-test_wmemmove_s.c.patch"
      patch_description: "上游用例把 char* 误转为 wchar_t（整数）改为 wchar_t*，修复用例本身的类型错误"
      patch_type: "bugfix"
    - patch_file: "patches/0009-utils-Makefile.patch"
      patch_description: "非 x86 目标不再构建 txt-acminfo（该工具读 x86 MSR/IO 端口，仅 x86 可用）"
      patch_type: "portability"
