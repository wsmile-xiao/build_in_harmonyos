# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: topkg/1.1.1
homepage: "https://erratique.ch/software/topkg"

# 上游测试入口（pkg/pkg.ml 的 Pkg.test 条目）
upstream_check_command: "ocaml pkg/pkg.ml build && ocaml pkg/pkg.ml test（topkg 自举）"
upstream_test_in_build: true
upstream_test_command: "ocamlopt -I src src/topkg.cmxa test/test.ml -o test.exe && ./test.exe"

# 上游实际运行的测试程序（build() 中编译并执行）
upstream_tests:
  source: "pkg/pkg.ml Pkg.test \"test/test\"（test/test.ml 冒烟测试）"
  mechanism: >
    build() 以直连 ocamlc/ocamlopt 复现上游构建（registry 无 ocamlbuild），
    并编译运行 test/test.ml（打印参数并 exit 0）。
  discovered: 1
  passed: 1
  modified_reason: "无源码修改；上游 topkg 自举（需 ocamlfind/ocamlbuild）由直连编译替代（见 notes.md）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_topkg.ml
    description: >
      消费者程序：链接打包的 topkg.cmxa（native）与 topkg.cma（bytecode 经
      ocamlrun），断言 Topkg.String/R 与 Topkg.OS（cwd、目录列表、/dev/null
      写读、命令查找）共 14 项。
    command: "sh test.sh <pkg_dir> <ocaml_lib> <ocaml_bin> <cc> <shim>"

# 断言总数（test_topkg.ml 内部 14 项，native+bytecode 双路径各执行一次）
assertion_count: 14

# 鸿蒙特有测试（rule12：至少一个完整消费者用例）
harmony_specific_test_count: 1
harmony_specific_tests:
  - file: test_package/test_topkg.ml
    kind: e2e_consumer_case
    label: "鸿蒙特有测试"
    description: >
      端到端消费者用例（真机 OS 交互）：Topkg.OS.Dir.current 取设备 cwd 并断言
      存在与目录列表成功；对 /dev/null 执行 Topkg.OS.File.write/read 并断言
      EOF 语义；Topkg.OS.Cmd.exists/must_exist 在设备 PATH 上解析 sh；
      另覆盖 Topkg.String 的 cut/is_prefix/is_suffix 与 R 组合子。
    executed: true
    result: "ALL TESTS PASSED (assertions=14 failures=0)"
