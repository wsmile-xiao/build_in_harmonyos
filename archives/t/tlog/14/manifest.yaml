# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "发布 tarball 已自带预生成 configure 时不要跑 autoreconf：CI worker 的 PATH 无 automake/aclocal，autoreconf 稳定失败；umask 补丁直接打在 configure 本体即可。ref: archives/b/bti/034/conanfile.py"
  - "E007：上游 config.guess/config.sub 不认 aarch64-unknown-linux-ohos，需在补丁中注入 OHOS 三元组，且**不传** --build/--host（R15）。ref: E007"
  - "E114/HMDFS：configure 内 `umask 077` 会让构建目录 0700 而不可写（E129 同族），补丁改为 022。ref: E114"
  - "musl/OHOS 公开头未连带声明 struct timespec/ssize_t/pthread_t/FILE 等 POSIX 类型，上游头也未 include：补最小 `#include <time.h>` 等，禁止空壳 stub（R8）。ref: knowledge/doc/E008.md"
  - "OHOS 受限域（u:r:adhoc_bin:s0）不能 exec 缓存目录文件 → configure 需经显式 `/system/bin/sh <configure>` 调用（autotools.configure() 会报 Error 126 Permission denied）。ref: archives/e/elfutils/0.195.1/conanfile.py"
  - "tlog 的 CLI 启动即要求**默认配置**（share/tlog/*.default.conf）与**本地配置**（etc/tlog/*.conf）同时存在，缺一即 rc=1；且配置查找路径按「二进制自身路径」判定（libtool .libs 目录 → 相对路径 ../，否则编译期绝对路径）。ref: archives/t/tlog/14/reports/test-report.md"
  - "configure 的 conftest 链到依赖 .so 时必须为构建期进程注入 LD_LIBRARY_PATH（Environment.save_script），不能用 -Wl,-rpath —— 后者会把 conan 缓存绝对路径烤进产物 RPATH（E524 同族）。ref: E524"
  - "依赖 cpp_info 里的**相对** libdir 会以 `-Llib` 形式进入 LDFLAGS，libtool 随即硬失败（cannot determine absolute directory name）：generate() 里注入前必须用 os.path.isabs() 过滤相对搜索目录。ref: knowledge/drafts/E544-draft-CB89.kv"
  - "依赖包自带 .pc 的 prefix 指向已被删除的构建目录时，pkg-config 解析出空路径 → 必须让 PkgConfigDeps 生成的 .pc 在 PKG_CONFIG_PATH 里优先，并补嵌套头目录（json-c 的 include/json-c，上游扁平 include json_tokener.h 依赖它）。ref: knowledge/drafts/E545-draft-A4D6.kv"
  - "本地 W3 模拟（finish step 5）在这个 worker 上会因 /tmp 只读而挂：zsh 的 here-doc 临时文件取自 TMPPREFIX（环境变量注入无效），表现为 L0i 谎报 conanfile.py AST 解析失败。修法：ZDOTDIR 指向含 TMPPREFIX=<可写目录>/zsh- 的 .zshenv。ref: knowledge/drafts/E546-draft-C6EC.kv"
  - "test_package 复用固定工作目录（clone 上游 .libs 布局）在 HMDFS 上会因残留目录属主/权限（drwxrws--x）导致 cp 报 Operation not permitted：每次运行都要新建唯一目录并在 finally 删除。ref: knowledge/drafts/E546-draft-C6EC.kv"

