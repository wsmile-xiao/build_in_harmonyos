# ============================================================

source:
  url: "https://github.com/Scribery/tlog/releases/download/v14/tlog-14.tar.gz"
  sha256: "5e8e725db97e91cf4d14f82c1d75b45428b6f972eb4e5bd695e5aeefcad3686b"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 默认静态构建（R26）；options.shared=True 时改注入 --enable-shared --disable-static。
  # journal 支持必须显式关闭：OHOS 无 systemd/journal，而 configure 默认启用该
  # 特性并强制要求 libsystemd（configure.ac:87-89）→ 不关即 configure 失败。
  # --enable-utempter 未启用（OHOS 无 libutempter，configure 默认 no）。
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-journal"

  dependencies:
    - json-c/0.18
    - curl/8.15.0

  cc: clang
  cxx: clang++

