# conandata.yml — tlog 14
# 上游：https://github.com/Scribery/tlog (Tlog — terminal I/O logging)
sources:
  url: "https://github.com/Scribery/tlog/releases/download/v14/tlog-14.tar.gz"
  sha256: "5e8e725db97e91cf4d14f82c1d75b45428b6f972eb4e5bd695e5aeefcad3686b"

patches:
  # E007：tarball 内置的 config.guess/config.sub 早于 HarmonyOS 支持，
  # 交叉编译时 host 被识别为 aarch64-unknown-linux-gnu（R15：不传 --host，
  # 只能补 config.guess/config.sub 本身）。
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "E007: teach config.guess about aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "E007: teach config.sub about the ohos OS triplet"
    patch_type: "portability"
  # E114：HMDFS 上 `umask 077` 会让 autoreconf/configure 生成的临时目录
  # 权限异常导致后续访问失败；放宽为 022（bwm-ng 同款处理）。
  - patch_file: "patches/0003-configure.patch"
    patch_description: "E114: relax umask 077 -> 022 in generated configure (HMDFS)"
    patch_type: "portability"
  # musl/OHOS 的 sysroot 不通过 <sys/types.h>/<time.h> 隐式传播 POSIX 类型，
  # 上游头文件直接使用 timespec/pid_t/ssize_t 等需显式包含（最小改动，不动逻辑）。
  - patch_file: "patches/0004-include-tlog-json_msg.h.patch"
    patch_description: "portability: include <time.h> for timespec (musl/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0005-include-tlog-json_stream.h.patch"
    patch_description: "portability: include <time.h> for timespec (musl/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0006-include-tlog-pkt.h.patch"
    patch_description: "portability: include <time.h> for timespec (musl/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0007-include-tlog-rl_json_writer.h.patch"
    patch_description: "portability: include <sys/types.h> for ssize_t (musl/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0008-include-tlog-source.h.patch"
    patch_description: "portability: include <sys/types.h> for ssize_t (musl/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0009-include-tlog-timestr.h.patch"
    patch_description: "portability: include <time.h> for timespec/time_t (musl/OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0010-include-tlog-tty_source.h.patch"
    patch_description: "portability: include <sys/types.h> for ssize_t (musl/OHOS)"
    patch_type: "portability"
