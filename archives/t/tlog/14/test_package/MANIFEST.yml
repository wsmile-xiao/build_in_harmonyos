# MANIFEST.yml — tlog 14 test_package 声明
# 上游测试入口盘点（真实盘点，未伪造）

upstream_tests:
  runner_dir: "src/tltest/"
  entries: 13                 # src/tltest/Makefile.am 的 TESTS = ... 共 13 项
  executed_by: "../conanfile.py :: _run_upstream_tests() -> make check"
  result: "13/13 通过（OHOS PC aarch64 / clang，实测记录见 ../reports/test-report.md）"
  list:
    - tltest-fd-json-reader
    - tltest-grc
    - tltest-json-esc
    - tltest-json-overlay
    - tltest-json-passthrough
    - tltest-json-sink
    - tltest-json-source
    - tltest-json-stream
    - tltest-json-stream-btoa
    - tltest-json-stream-enc-bin
    - tltest-json-stream-enc-txt
    - tltest-timespec
    - tltest-timestr

consumer_tests:
  test_libtlog.c: 18          # 编译链接 + 真实 API 调用（grc 6 / utf8 2 / timestr 5 / pkt 5）
  test_cli.sh: 7              # tlog-rec / tlog-play / tlog-rec-session 的
                              # --version ×3、--help ×2、--configuration ×2
  ohos_header_self_containment: 7   # OHOS/musl 特有：补丁 0004-0010 涉及的 7 个
                              # 公开头各自作为 TU 的唯一 include 单独编译
                              # （build() 中 -fsyntax-only -include <h> -x c /dev/null）。
                              # 鉴别力实测：未打补丁 2/7，打补丁 7/7 —— glibc 下这些
                              # 头能间接取到 struct timespec/ssize_t，musl(OHOS) 下不能。
  assertions: 32
  cli_configs_required:       # 上游要求「默认配置 + 本地配置」同时存在，缺一 rc=1
    - "share/tlog/*.default.conf"
    - "etc/tlog/*.conf"

platform_notes:
  record_replay_e2e: >-
    未做真实「录制→回放」端到端：lib/tlog/rec.c:712 要求 getpwuid(getuid())
    非 NULL，而本构建机 UID 20020093 不在 /etc/passwd（`id -un` 报
    cannot find name for user ID），tlog-rec 必然以 "User entry not found"
    rc=1 退出。属环境限制，如实记录，不伪造通过。
  static_default: >-
    默认静态构建（options.shared=False）：tlog-rec/play/rec-session 不依赖
    libtlog.so，因此 CLI 只需依赖（json-c/curl）的 .so 即可运行；
    shared=True 时 CLI 还会 NEEDED libtlog.so.0。
