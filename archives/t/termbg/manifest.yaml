# 软件级 manifest — termbg
# 遵循 ARCHIVE-SPEC v2.0

software: termbg
display: "termbg"
description: "终端背景色检测 — 输出终端类型、背景 RGB 与主题（Dark/Light）"
category: utility
homepage: "https://github.com/dalance/termbg"
license: MIT OR Apache-2.0
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Rust / cargo 项目：Cargo.toml build=false，无 build.rs、无 CMake/autotools/meson，cargo build --release 直接编译"
    - "Rust 工具链走制品仓基础设施包 rust-toolchain/1.97.1（tool_requires）；不使用 rustup（无法识别 HarmonyOS 宿主，E105/E154）"
    - "rust-toolchain 包内 cargo/rustc/librustc_driver*.so 无 code signature，OHOS 拒绝 execve（errno 13）→ binary-sign-tool 自签名私有副本（below/librsvg 先例）；CI 干净环境可直接执行时自动跳过签名"
    - "cargo 1.97 动态链接 libssl/libcrypto（需 OpenSSL 3.5+ 符号），系统 OpenSSL 3.0 缺 SSL_get0_group_name（E509）→ Harmonybrew OHOS bottle + LD_LIBRARY_PATH 前置"
    - "crates.io 直连在设备上无可用 CA → rsproxy.cn sparse 镜像 + CA bundle（cargo 读取 $CARGO_HOME/config.toml）"
    - "链接器用 OHOS SDK clang（aarch64-unknown-linux-ohos），目标三元组 aarch64-unknown-linux-ohos"
    - "OHOS /tmp 只读，构建与测试需用可写 TMPDIR"
    - "上游测试为 src/lib.rs 的 cargo 单元测试，无 tests/ 目录；结果须随包携带并由 test_package 重发 HMBS_UPSTREAM_TEST_RESULT"
  common_dependencies:
    - rust

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.6.2":
    status: built
    build_date: "2026-09-24"
    published_as: termbg/0.6.2
