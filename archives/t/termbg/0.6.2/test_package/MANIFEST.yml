# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）

package: termbg/0.6.2
homepage: "https://github.com/dalance/termbg"

# ── 上游测试入口清点（三步法第 1 步）────────────────────────────────────
# termbg 是纯 cargo 项目，无 tests/ 目录、无 Makefile/CTest/meson 测试目标；
# 上游唯一测试入口为 src/lib.rs 内的 #[cfg(test)] mod tests。
upstream_check_command: "cargo test --verbose"          # 上游 CI (.github/workflows/rust.yml)
upstream_test_files:
  - "src/lib.rs"          # #[cfg(test)] mod tests（第 659 行起）

# 静态清点：grep -c '#\[test\]' src/lib.rs = 6；src/bin/termbg.rs = 0；tests/ 不存在
upstream_test_discovered: 6

# conanfile.py build() 中是否已集成上游测试（三步法第 2 步，真机实际运行）
upstream_test_in_build: true
upstream_test_command: "cargo test --release --locked --tests --no-fail-fast --target aarch64-unknown-linux-ohos"

# ── 真机实际运行结果（三步法第 3 步，2026-09-24 实测）──────────────────
# HMBS_UPSTREAM_TEST_RESULT={"status":"passed","framework":"cargo-test",
#   "discovered":6,"executed":6,"passed":6,"failed":0,"skipped":0}
upstream_tests:
  - file: "src/lib.rs (#[cfg(test)] mod tests, 6 个 #[test])"
    source: "termbg-0.6.2/src/lib.rs"
    description: "上游全部单元测试（xterm 查询/超时/终止符解析 + X11 颜色解码）"
    command: "cargo test --release --locked --tests --no-fail-fast --target aarch64-unknown-linux-ohos"
    discovered: 6
    executed: 6
    passed: 6
    failed: 0
    skipped: 0
    cases:
      - "tests::test_query_xterm_with_various_terminators"
      - "tests::test_query_xterm_timeout_no_response"
      - "tests::test_query_xterm_timeout_incomplete_response_1"
      - "tests::test_query_xterm_timeout_incomplete_response_2"
      - "tests::test_query_xterm_timeout_unterminated_response"
      - "tests::test_decode_x11_color"

# 说明：上游 CI 的 `cargo test --verbose` 还会跑 doc-test，但
# rust-toolchain/1.97.1 基础设施包不含 rustdoc 二进制（bin/ 下无 rustdoc），
# 且 termbg 源码无任何 doc 代码块（grep -c '```' src/lib.rs = 0），
# 故 --doc 目标编译 0 个用例，用 --tests 覆盖全部真实用例。

# ── test_package 自带测试（消费者视角）────────────────────────────────
test_package_tests:
  - file: test_termbg.py
    description: "消费者冒烟：运行打包的 termbg 二进制，断言 --version / 检测输出 / COLORFGBG Dark·Light 两分支 / 非法参数退出码"
    command: "PACKAGE_FOLDER=<pkg> python3 test_termbg.py"
    assertion_count: 8

# ── 鸿蒙特有测试（HarmonyOS-specific）───────────────────────────────────
# 断言产物在本平台可执行所必需的特性
harmonyos_specific_tests:
  - file: test_termbg.py
    description: "鸿蒙特有测试 4 项（ELFCLASS64 / EM_AARCH64 / OHOS musl 解释器 / .note.ohos.ident 段）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_termbg.py"
    assertion_count: 4

# 测试断言总数（近似值，用于质量评估）
# 上游 6 + test_package 消费者 8 + 鸿蒙特有 4
assertion_count: 18
