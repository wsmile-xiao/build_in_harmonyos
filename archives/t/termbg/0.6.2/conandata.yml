# conandata.yml — termbg 0.6.2
#
# 源：crates.io 官方 crate 包（该 crate 唯一发行渠道；未进 Debian，
#     sources.debian.org/api/src/termbg/ → {"error":404}）。
#     上游仓库 https://github.com/dalance/termbg 的 tag v0.6.2 对应 crate 内
#     .cargo_vcs_info.json 记录的 commit c5b066a56bf3a20b4942768f5e0da8eb29292a5b。
#     官方 crate 包含 Cargo.lock，可 --locked 构建（无需在配方内解析依赖）。

sources:
  url: "https://static.crates.io/crates/termbg/termbg-0.6.2.crate"
  sha256: "8bf44577a1adf3dfd7fec3b8763074467e27b2ad35ff9157bc3f0a51bb0a3dd4"

# cargo 运行期动态链接的共享库（OHOS loader 忽略 DT_RUNPATH，必须显式进
# LD_LIBRARY_PATH）。系统 /usr/lib 的 OpenSSL 3.0 缺 cargo 1.97 需要的
# SSL_get0_group_name 等符号（知识条目 E509），故使用 Harmonybrew 的 OHOS
# 预编译 bottle；sha256 为实测固定值（below/argc/cargo-bloat 同源先例）。
# 仅在 os=OHOS 且探测到系统库不可用时使用，下载失败降级为警告。
rust_runtime:
  - name: openssl3
    url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4.arm64_ohos.bottle.tar.gz"
    sha256: "e1be73c6c68e29c33ff43761045e43e23e7c369f0fb1a24f40e226ec5cb28f98"
  - name: zlib
    url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_1.arm64_ohos.bottle.tar.gz"
    sha256: "1c17a31f8104701bce6b471af8dbbd14bb67d16a504eec087018feb05493a430"

patches: {}
