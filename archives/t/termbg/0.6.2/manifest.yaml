# 版本级 manifest — termbg 0.6.2

version: "0.6.2"
software: "termbg"

# built：本地 OHOS aarch64 真实构建 + 上游测试（6/6）通过；未上传发布。
# Rust 工具链由制品仓基础设施包 rust-toolchain/1.97.1 提供（tool_requires），
# 不依赖系统 cargo、不使用 rustup 引导（rustup 无法识别 HarmonyOS 宿主，E105/E154）。
status: built

build_date: "2026-09-24"
build_system: "cargo"

# ============================================================
# 源码信息
# ============================================================

source:
  # crates.io 官方 crate 包（该 crate 唯一发行渠道；未进 Debian →
  # sources.debian.org/api/src/termbg/ = {"error":404}）
  url: "https://static.crates.io/crates/termbg/termbg-0.6.2.crate"
  sha256: "8bf44577a1adf3dfd7fec3b8763074467e27b2ad35ff9157bc3f0a51bb0a3dd4"
  tar_format: tar.gz
  upstream_repository: "https://github.com/dalance/termbg"
  upstream_tag: "v0.6.2"
  upstream_commit: "c5b066a56bf3a20b4942768f5e0da8eb29292a5b"

# ============================================================
# 构建配置
# ============================================================

build:
  system: custom            # cargo（Cargo.toml build=false；无 build.rs / CMake / autotools / meson）
  configure_options: []
  dependencies: []          # 无 Conan host 依赖：8 个直接依赖全部是 crates.io crate，由 cargo 管理
  build_tools:
    - "rust-toolchain/1.97.1"
  rust_target: "aarch64-unknown-linux-ohos"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 上游源码零改动：OHOS 适配全部发生在构建环境层（工具链签名 / cargo 运行库 / 镜像源）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "termbg 是纯 Rust crate（lib + bin），crossterm/mio/rustix 全链在 rustc 1.97.1 的 aarch64-unknown-linux-ohos 目标下直接编译通过，无需任何平台补丁（与 E358 描述的旧锁图不兼容场景不同：本 crate 的 Cargo.lock 依赖组合已兼容 target_env=ohos）"
  - "rust-toolchain/1.97.1 基础设施包内 cargo/rustc 未签名，OHOS 拒绝 execve（errno 13）；配方用 binary-sign-tool 自签名副本并保持 <root>/bin + <root>/lib/rustlib 的 sysroot 布局（below/librsvg 先例）"
  - "cargo 1.97 动态链接 libssl/libcrypto（需 OpenSSL 3.5+ 的 SSL_get0_group_name 等符号），系统 OpenSSL 3.0 缺符号（E509）→ Harmonybrew OHOS bottle + LD_LIBRARY_PATH 前置"
  - "hmbs preflight 只从 test_package 阶段 stdout 采集 HMBS_UPSTREAM_TEST_RESULT；上游测试在 build() 运行后必须把结果随包携带（res/upstream_test_result.json）由 test_package 重发（scooter/abuild-sudo 先例）"
  - "rust-toolchain/1.97.1 基础设施包不含 rustdoc 二进制，`cargo test` 的 --doc 目标无法执行（No such file or directory）；对无 doc 代码块的 crate 用 --tests 即可覆盖全部真实用例"
