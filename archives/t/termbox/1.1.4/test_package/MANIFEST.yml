# test_package/MANIFEST.yml — termbox 1.1.4
# Upstream contains demos but no automated test suite or check target.

package: "termbox/1.1.4"
homepage: "https://github.com/termbox/termbox"

upstream_check_command: "make -n check (no such target)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: "test_api.c"
    description: "16 assertions for pre-init state, public constants, UTF-8 lengths and Unicode roundtrips"
    command: "./test_api"
  - file: "test_ohos_pty.c"
    description: "17 HarmonyOS-only assertions for aarch64, PTY/termios/ioctl, tb_init_fd, screen state and SIGWINCH"
    command: "./test_ohos_pty"

assertion_count: 33
