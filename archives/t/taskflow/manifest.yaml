# 软件级 manifest — taskflow
# 文件位置: archives/t/taskflow/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: taskflow
display: "taskflow"
description: "通用并行与异构任务编程系统（work-stealing 任务图，header-only C++20 库）"
# 分类标签: foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library
homepage: "https://github.com/taskflow/taskflow"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only 库（CMake INTERFACE target）：无编译产物；conan 配方用 package_type=header-library、package_id 清空为单一 id，包内只有 include/taskflow/**.hpp 与 LICENSE"
    - "上游强制 C++20（CMAKE_CXX_STANDARD 20 + REQUIRED）而 OHOS profile 固定 cppstd=17：包本身不编译，配方用 cpp_info.cxxflags=[\"-std=c++20\"] 把要求下传消费者（test_package 另显式 set(CMAKE_CXX_STANDARD 20) 留证）"
    - "OHOS libc++15 无 <memory_resource> 且 libc++.so 不导出 std::pmr 符号、experimental/memory_resource 也没有 pool resource：object_pool 冷路径后备分配器按 __has_include 特性探测降级为库内等价实现 tf::SynchronizedBlockPool（patches/0003，真实实现非空 stub），标准库具备 pmr 时仍走原生 std::pmr"
    - "OHOS clang15 未实现别名模板 CTAD（LLVM issue 106839）：上游 unittests 中 3 处 tf::IndexRange 构造改为显式模板实参，用例数与断言数不变（patches/0001、patches/0002）"
    - "上游算法（for_each/reduce 等）定义在各算法头文件中，伞头文件 taskflow/taskflow.hpp 不含；消费者须自行包含 taskflow/algorithm/*.hpp"
    - "消费者需线程支持：上游链 Threads::Threads；配方在 os in (Linux, OHOS) 时声明 system_libs=[\"pthread\"]（OHOS sysroot 提供空归档 libpthread.a，-lpthread 可用）"
    - "保留上游 find_package(Taskflow)/Taskflow::taskflow 命名兼容（cmake_file_name/cmake_target_name 属性）"
    - "上游测试为 doctest 套件（TF_BUILD_TESTS 默认 ON）：上游用例行计数共 3606（grep -rh TEST_CASE unittests sandbox，其中 unittests/**/*.cpp = 3246 为审方实测口径），设备端实跑覆盖 2891 行/ctest 注册 2909 项全部通过；未执行 715 行 = serializer 15 + 上游从未接入且已失效的 3 个源 324 + modules 16 + cuda 256 + sandbox 104，逐组证据见 4.1.0/test_package/MANIFEST.yml"
  common_dependencies: []

versions:
  "4.0.0":
    status: built
    build_date: "2026-05-21"
  "4.1.0":
    status: built
    build_date: "2026-09-10"
