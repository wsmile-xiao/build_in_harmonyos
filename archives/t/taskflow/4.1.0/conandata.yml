# conandata.yml — taskflow 4.1.0
# 官方 GitHub tag tarball；sha256 唯一锚定。
# 全文件除 sources.url 外无任何裸 http(s) URL（CI 预下载器无边界抓取，注释里的 URL 也曾打挂 source()）。

sources:
  url: "https://github.com/taskflow/taskflow/archive/refs/tags/v4.1.0.tar.gz"
  sha256: "2107f90e315e48a676922010b036357ff2b0c6b9160ce17fa9396e5860b1d715"

patches:
  "4.1.0":
    - patch_file: "patches/0003-taskflow-utility-object_pool.hpp.patch"
      patch_type: "portability"
      patch_description: "OHOS libc++15 无 <memory_resource> 且不导出 std::pmr 符号：object_pool 冷路径后备分配器按 __has_include 特性探测降级为库内等价的固定块同步池 SynchronizedBlockPool（互斥保护的空闲链表 + 1024 块分块增长 + 分块登记失败时释放并重抛的强异常安全）；标准库具备 pmr 时仍走原生 std::pmr 路径"
    - patch_file: "patches/0002-unittests-test_iterators.cpp.patch"
      patch_type: "portability"
      patch_description: "OHOS clang 15 未实现别名模板的类模板实参推导（alias template CTAD — LLVM issue 106839）：test_iterators 的 IndexRange1D.CTAD 用例改为显式写出模板实参 tf::IndexRange<int>；同时把用例名改为 IndexRange1D.alias_construction（原名已不反映实现）。用例数与断言数不变，static_assert on decltype 保留"
    - patch_file: "patches/0001-unittests-test_for_each.cpp.patch"
      patch_type: "portability"
      patch_description: "同上：test_for_each 两处 tf::IndexRange 别名 CTAD 构造改为显式模板实参 tf::IndexRange<int>，用例数与断言数不变"
