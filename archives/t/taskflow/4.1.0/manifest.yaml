# 版本级 manifest — taskflow 4.1.0
# 文件位置: archives/t/taskflow/4.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "4.1.0"
software: taskflow

# 设备端真实验证完成后的状态口径（built ≠ published）
status: built
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://github.com/taskflow/taskflow/archive/refs/tags/v4.1.0.tar.gz"
  sha256: "2107f90e315e48a676922010b036357ff2b0c6b9160ce17fa9396e5860b1d715"
  tar_format: tar.gz

build:
  # header-only（CMake INTERFACE target）：conan 包内只有 include/taskflow/**.hpp 与 LICENSE。
  # 配方的 build() 只对上游 CMake 项目做 configure + build 一致性校验（INTERFACE 目标，
  # 不编译任何翻译单元、不产出二进制）；下列 configure_options 是设备端上游测试套件
  # （unittests/，doctest）的原生 CMake 构建参数，同样不是 conan 包构建参数。
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_CXX_STANDARD=20"
    - "-DTF_BUILD_TESTS=ON"
    - "-DTF_BUILD_EXAMPLES=OFF"
    - "-DTF_BUILD_BENCHMARKS=OFF"
    - "-DTF_BUILD_PROFILER=OFF"
    - "-DTF_BUILD_CUDA=OFF"
    - "-DTF_BUILD_MODULES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁清单（文件名与 patches/ 逐条对应，描述不含逗号以免 finalize 按逗号 split 误计数）：
# 0003 = OHOS libc++15 无 std::pmr：object_pool 后备分配器按 __has_include 降级为库内等价同步块池（含 _grow 分块登记的强异常安全）
# 0002 = clang 15 不支持别名模板 CTAD：test_iterators 的 IndexRange1D.CTAD 用例显式写出模板实参
#        并改名为 IndexRange1D.alias_construction（用例数与断言数不变）
# 0001 = 同上：test_for_each 两处 tf::IndexRange 构造显式写出模板实参（用例名不变）
patches_applied:
  - "0001-unittests-test_for_each.cpp.patch"
  - "0002-unittests-test_iterators.cpp.patch"
  - "0003-taskflow-utility-object_pool.hpp.patch"

knowledge_gained:
  - "OHOS SDK libc++15 既无 <memory_resource> 头也不导出 std::pmr 符号，C++17/20 库的 pmr 后备路径须用 __has_include 特性探测降级为库内等价实现"  # knowledge_ref: E560
  - "OHOS clang15 未实现别名模板的类模板实参推导（alias template CTAD），上游测试中的 tf::IndexRange r(...) 写法须显式写出模板实参"  # knowledge_ref: E563
