  passed: 10
  failed: 0
  skipped: 1
  note: |
    上游测试（R51，2026-09-20 实测，hnp perl 5.42.0）：t/ 目录 **4 个 .t
    文件**，`make test` 实测 **Files=4, Tests=10, Result: PASS**，零失败。
    逐文件明细（prove -v 实测）：
