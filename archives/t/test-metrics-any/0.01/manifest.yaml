    上游测试已集成进 build()（upstream_test_in_build: true）。
    适配后：test_package 消费者测试（R34 真实 API）**15/15 = 100%**。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CPAN 发行版以 Module::Build（Build.PL）为构建系统、而 Module::Build 在 OHOS 不可得时，可用 perl 核心 ExtUtils::MakeMaker 生成等价 Makefile.PL 替代（逐项转写 Build.PL 的 module_name/requires/test_requires），上游 t/ 测试仍可经 make test 真实运行（先例：metrics-any 0.10、future 0.52）(ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "依赖包只声明 runenv_info（未声明 buildenv_info）时，其 env 变量不会进入下游包的 build 上下文——下游若在 build() 内跑依赖该模块的测试，必须自行遍历依赖包目录定位并注入（本例 metrics-any 未声明 buildenv_info，test-metrics-any 需 PERL5LIB 才能 use Metrics::Any::Adapter::Test）(ref: DRAFT-perl-buildenv-info-missing-dependency-injection)"
  - "两个 perl 包都声明同一 env 变量（PERL5LIB）时应各自用 prepend_path 而非 define_path：define_path 是覆盖语义，会让依赖的取值丢失；prepend 保证两侧都被消费方拿到 (ref: DRAFT-perl-buildenv-info-missing-dependency-injection)"
  - "Test::Builder::Tester 的 test_fail/test_err 按**调用点行号**匹配 Test::Builder 的 'Failed test ... at line N' 诊断，对文件任何增删行都会误报；负例断言应改查 stdout（test_out 必须为 not ok）+ test_test(skip_err => 1)，既证明非恒真又不脆 (ref: DRAFT-perl-buildenv-info-missing-dependency-injection)"

references:
