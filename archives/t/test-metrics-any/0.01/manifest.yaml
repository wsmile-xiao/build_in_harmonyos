# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "metrics-any/0.10"
  optional: []
  note: |
    META.json prereqs 逐项对齐（实测复核）：
      runtime requires  Metrics::Any::Adapter          → 由 metrics-any/0.10 提供
      runtime requires  Metrics::Any::Adapter::Test    → 由 metrics-any/0.10 提供
      runtime requires  Test::Builder::Module          → perl 核心模块，hnp perl 自带
      test      requires Test::More >= 0.88            → hnp perl 自带（实测 1.302210）
      configure requires Module::Build >= 0.4004       → OHOS 不可得（见下）

    故 Conan 依赖仅 **metrics-any/0.10 一个**（已在 ohpcd 发布，实测
    `conan list metrics-any/0.10:* -r=ohpcd` 得到 1 个 package_id）。
    注意其 package 内已含 `Metrics/Any/Adapter/Test.pm`（本包运行时依赖），
    无需额外声明 Adapter::Test 所在包。

    configure.requires Module::Build 在 OHOS 不可得（实测设备 perl 与
    /data/service/hnp/bin/perl 的 @INC 均无 Module/Build.pm，制品仓亦无
    perl-module-build）→ 配方以 ExtUtils::MakeMaker（perl 核心）生成等价
    Makefile.PL 替代。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Perl 模块无二进制产物，沿用
    metrics-any / perl-uri / future 先例；不产生 bindirs，故无需
    commands.json，R38 不适用）。

    构建：perl Makefile.PL INSTALLDIRS=site → make → make test →
    make install DESTDIR=<staging>；package() 按登台树原样拷入
    package_folder，并以遍历定位 Test/Metrics/Any.pm 得到 perl lib 根。

    ⚠️ 依赖注入（本包与 metrics-any 的关键差异）：metrics-any 的
    package_info() 只声明了 **runenv_info**、未声明 buildenv_info，故其
    PERL5LIB 不会自动进入本包的 build 上下文 —— 而本包 build() 内跑
    `make test` 时必须能 `use Metrics::Any::Adapter::Test`。配方在
    build() 内遍历依赖包目录定位其 perl lib 根并显式注入 PERL5LIB
    （不改动已合入的 metrics-any 配方）。

    package_info() 用 prepend_path 注入 PERL5LIB（而非 define_path）：
    本包与依赖 metrics-any 都声明了 PERL5LIB，prepend 可保证两者同时
    被消费方拿到而不相互覆盖。

    解释器：固定使用 /data/service/hnp/bin/perl（5.42.0），与
    metrics-any / perl-uri 先例一致，避免设备 perl 与 hnp perl 的
    Errno 实现差异（详见 metrics-any notes.md 的 EWOULDBLOCK/ENOTSUP 记录）。

