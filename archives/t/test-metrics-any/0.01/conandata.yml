# conandata.yml — test-metrics-any 0.01
# 源码为 CPAN 官方发行版（R39 合规），sha256 与 MetaCPAN release 元数据的
# checksum_sha256 一致（本机对下列每个镜像逐一下载并复核，5 个源 sha256 全部相同）。
#
# ⚠️ 为什么写成「多 URL 列表」而不是单条官方 URL（对 E549 的有意例外）：
#   CI 的 mirror fallback（ci/conan/build_and_test.sh L1027 入口正则 + get_mirrors()）
#   **不覆盖任何 CPAN 域名**，配成单条 cpan.metacpan.org 时 CI 不会注入镜像；而
#   Worker 上 (a) 无 curl（预下载必失败）、(b) 直连 cpan.metacpan.org 30s 连接超时
#   → source() 裸连失败、conan create 红（PR #11279 CI 实测）。
#   故此处直接内置镜像列表，并把可达的国内镜像**排在官方源之前**（E549 的回退方案
#   要求：镜像须在前，否则 conan 按序先试官方源仍会失败）。E549 所述「多 URL 关闭
#   CI 自动镜像注入」在此无影响 —— 镜像已经显式写进来了。
#   官方源保留在末位作兜底（官方恢复或 Worker 网络放开时自动生效）。
sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/CPAN/authors/id/P/PE/PEVANS/Test-Metrics-Any-0.01.tar.gz"
    - "https://mirrors.ustc.edu.cn/CPAN/authors/id/P/PE/PEVANS/Test-Metrics-Any-0.01.tar.gz"
    - "https://mirrors.aliyun.com/CPAN/authors/id/P/PE/PEVANS/Test-Metrics-Any-0.01.tar.gz"
    - "https://www.cpan.org/authors/id/P/PE/PEVANS/Test-Metrics-Any-0.01.tar.gz"
    - "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Test-Metrics-Any-0.01.tar.gz"
  sha256: "2506c88d4eb21b274b1085f806c918dcc97fff69e16d1249e6e19d943625e468"

# 无补丁：上游为 Module::Build（Build.PL），OHOS 不可得 →
# 由 build() 生成等价的 Makefile.PL（只新增构建脚本，不改动上游源码）
patches: {}
