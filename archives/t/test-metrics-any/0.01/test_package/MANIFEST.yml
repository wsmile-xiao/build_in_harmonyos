# test_package/MANIFEST.yml — test-metrics-any 0.01
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: test-metrics-any/0.01
homepage: "https://metacpan.org/pod/Test::Metrics::Any"

# 上游测试命令：上游为 Module::Build（Build.PL），但 Module::Build 在 OHOS
# 不可得（实测设备 perl 与 /data/service/hnp/bin/perl 的 @INC 均无
# Module/Build.pm，制品仓亦无 perl-module-build），故配方由
# ExtUtils::MakeMaker 生成等价 Makefile.PL，上游测试经 make test 运行。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试套件（2026-09-20 本机实测，hnp perl 5.42.0）：
# - t/ 目录：4 个 .t 测试文件
# - 实测结果：**Files=4, Tests=10, Result: PASS**（1 个文件 skip）
# - 逐文件明细（prove -v 实测）：
#     t/00use.t         1 用例（use_ok）
#     t/01metrics.t     3 用例（metric OK / missing fails / differing fails）
#     t/02predicates.t  6 用例（positive / at_least / greater_than 各正反例）
#     t/99pod.t         skip —— `Test::Pod 1.00 required for testing POD`
#                       （可选 POD 校验依赖未安装，非失败）
#
# ⚠️ 依赖注入：本包运行时依赖 Metrics::Any::Adapter 与
#   Metrics::Any::Adapter::Test（由 metrics-any/0.10 提供）。该依赖的
#   package_info() 只声明了 runenv_info、**未声明 buildenv_info**，故其
#   PERL5LIB 不会自动进入 build 上下文 —— 本配方在 build() 内显式定位依赖
#   的 perl lib 根并注入 PERL5LIB（不改动已合入的 metrics-any 配方）。
upstream_tests:
  - file: t/
    source: Test-Metrics-Any-0.01/t/*.t
    description: "上游 perl 测试套件（4 文件 10 用例；hnp perl 5.42.0 实测 Result: PASS，t/99pod.t 因缺 Test::Pod skip，零失败）"
    command: "make test"

# test_package 消费者测试（R34 真实 API：载入打包的 Test::Metrics::Any，
# 真实调用导出 API is_metrics / is_metrics_from 与谓词助手
# positive / at_least / greater_than；并含**负例**证明断言真的会失败）
#
# 驱动方式：.pl 不在 CI L0c 认可的测试源扩展名内，故以
# test_test_metrics_any.py 作为 L0c 可见入口驱动 perl 测试源
# （与 metrics-any 0.10 先例同款）。
test_package_tests:
  - file: test_test_metrics_any.pl
    description: >-
      消费者测试（15 断言）：版本、导出符号、谓词可用性、is_metrics 精确值 /
      标签命名（name label:value）/ 谓词断言（at_least / greater_than /
      positive）、is_metrics_from 代码块断言、额外指标不导致失败、
      以及 2 个**负例**（值不匹配 / 指标缺失必须失败，证明非恒真空壳）
    command: "perl -I<site> test_test_metrics_any.pl"
  - file: test_test_metrics_any.py
    description: >-
      L0c 可见入口：校验打包完整性（Test/Metrics/Any.pm）后以绝对路径 perl
      驱动上述 .pl，并校验输出含 ALL OK 标记
    command: "python3 test_test_metrics_any.py <site-perl-dir>"

# 测试断言总数（实测：15）
assertion_count: 15

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游 t/ 套件在 build() 内真实运行（make test），实测 Files=4 / Tests=10 /
  Result: PASS，1 个文件因缺可选依赖 Test::Pod 而 skip（非失败），零失败。
  **未豁免任何失败**：make test 退出码非 0 时 conan create 直接失败。
