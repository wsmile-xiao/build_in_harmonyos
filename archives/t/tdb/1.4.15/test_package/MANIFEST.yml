# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）

package: tdb/1.4.15
homepage: "https://tdb.samba.org/"

# 上游测试命令：waf test（testonly 目标：2 个 shell 集成测试 + 37 个 TAP 单测 + tdbtorture）
upstream_check_command: "make test"

# conanfile.py build() 已集成上游测试（conan create 即执行 make test）
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - file: "test/run-check.c"
    source: "tdb-1.4.15/test/run-check.c"
    description: "37 个 TAP 单元测试（wscript tdb1_unit_tests 列表）：基础读写/事务/遍历/恢复/加锁/deadlock 等，真机全部通过"
    command: "make test"
  - file: "test/test_tdbbackup.sh"
    source: "tdb-1.4.15/test/test_tdbbackup.sh"
    description: "集成测试：tdbbackup 正常/只读备份与 tdbdump 比对，通过"
    command: "make test"
  - file: "test/test_tdbdump.sh"
    source: "tdb-1.4.15/test/test_tdbdump.sh"
    description: "集成测试：tdbdump 对样本库输出与预期文本比对，通过"
    command: "make test"
  - file: "tools/tdbtorture.c"
    source: "tdb-1.4.15/tools/tdbtorture.c"
    description: "多进程并发压力测试：testsuite returned 0"
    command: "make test"

# python 绑定测试（python/tests/simple.py，45 项）未启用：本包以 --disable-python 构建
# 纯 C 库（平台 python3-config 输出含平台不存在的 -lintl，pyembed 探针无法链接），
# 补丁 0002 在禁用时显式跳过并打印原因
test_package_tests:
  - file: test_tdb.c
    description: "消费者测试：tdb_open/tdb_store/tdb_fetch/tdb_delete/tdb_close 真实调用，9 处断言；并执行包内 tdbdump 读取消费端创建的数据库"
    command: "./test_tdb"

# 测试断言总数（消费者程序 1 个，9 处行为断言）
assertion_count: 9
