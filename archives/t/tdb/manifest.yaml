software: tdb
display: "TDB"
description: "Samba trivial database library (key-value store)"
category: db
homepage: "https://tdb.samba.org/"
license: LGPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "构建系统为 Samba waf（wafsamba）：python3 驱动 buildtools/bin/waf，configure 包装脚本要求 $PYTHON 指向可用的 python3"
    - "lib/replace 的 mkstemp 运行探针硬编码 /tmp（鸿蒙只读）且断言文件权限 0600（HMDFS 归一化为 0640），上游标 mandatory——补丁 0001 改为非致命，走内置 mkstemp 替代实现"
    - "OHOS musl 未实现 pthread robust mutex（pthread_mutexattr_setrobust 未声明），configure 自动探测为否，tdb 互斥锁支持自动关闭（无需显式 --disable-tdb-mutex-locking）"
    - "python 绑定（pytdb）为可选特性：平台 python3-config 的 --embed 链接参数含平台不存在的 -lintl，pyembed 探针无法通过；本包以 --disable-python 构建纯 C 库，补丁 0002 在禁用时跳过 python 测试"
    - "37 个 TAP 单测 + 2 个 shell 集成测试 + tdbtorture（多进程压力）全部真机执行通过（make test）"
  common_dependencies: []

versions:
  "1.4.15":
    status: built
    build_date: "2026-09-16"
    conan_ref: "tdb/1.4.15"
