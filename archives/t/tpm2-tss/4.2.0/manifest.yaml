software: tpm2-tss
version: "4.2.0"
upstream_name: tpm2-tss
upstream_version: "4.2.0"
display: "TPM 2.0 Software Stack"
build_system: autotools
status: built
build_date: "2026-09-19"
target_platform: aarch64-unknown-linux-ohos

source:
  url: "https://github.com/tpm2-software/tpm2-tss/releases/download/4.2.0/tpm2-tss-4.2.0.tar.gz"
  sha256: "b53f0c5c8c4ce17f05701a410ca9688f725ca380c9bc4640eacd0eadb1fea124"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: "--disable-fapi --disable-policy --with-crypto=ossl --enable-unit"
  dependencies:
    - "openssl/3.5.6"
  test_dependencies:
    - "cmocka/2.0.2 (shared=True)"
  cc: clang

patches_applied:
  - "0001-config-guess-ohos.patch"
  - "0002-config-sub-ohos.patch"
  - "0003-configure-umask.patch"
  - "0004-tests-disable-fortify.patch"

# ── 依赖拓扑（本包是 gnupg 测试链的上游，务必按序）─────────────────
#   tpm2-tss (本包)  →  swtpm (TPM 模拟器，运行时)  →  gnupg tests/tpm2dtests
#
#   gnupg 的 configure 先探测 libtss（AC_SEARCH_LIBS([Esys_Initialize],
#   [tss2-esys])），**只有探测到 libtss 才会执行 AC_PATH_PROG(SWTPM, swtpm)**；
#   两者缺一都会让 tests/tpm2dtests 不进入 SUBDIRS（即 4 项用例不执行）。
#   本包提供前者（libtss2-esys 等），swtpm 提供后者。
#   实测：装上本包后 gnupg configure 输出
#     checking for library containing Esys_Initialize... -ltss2-esys
#     checking for Esys_TR_GetTpmHandle in -ltss2-esys... yes
#     checking for swtpm... no            ← 该探测仅在 have_libtss != no 时执行
#   即 have_libtss ≠ no 已达成，gnupg 侧缺口只剩 swtpm。

topology:
  upstream_of:
    - package: swtpm
      role: "运行时 TPM 模拟器（供 gnupg tpm2dtests 使用）"
      status: "配方在 main，但未发布 ohpcd；且 conandata 引用的 patch 文件缺失（conan export 会失败）"
    - package: gnupg
      role: "消费者：其 tests/tpm2dtests 需要 libtss2 + swtpm"
      status: "PR #9613（2.5.22）；装上本包后 tpm2dtests 仍缺 swtpm，故仍未执行"
  order: "tpm2-tss → swtpm → gnupg"

validation:
  built:
    - "conan create 端到端 EXIT=0，Package 'afc612c9541e60c362bf23c3aa265db7c358fa13' created"
    - "产物含 libtss2-esys/mu/rc/tctildr/tcti-*，且 Esys_Initialize 符号存在"
    - "上游单元测试 make check 47/47（100%）"
  pending:
    - "GitCode CI build_and_test.sh run on PR"
