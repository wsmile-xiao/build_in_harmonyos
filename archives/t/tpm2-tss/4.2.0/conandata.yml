# conandata.yml — tpm2-tss 4.2.0 (TPM Software Stack)
# 单一事实来源：源码 URL + SHA256 + 补丁清单

sources:
  url: "https://github.com/tpm2-software/tpm2-tss/releases/download/4.2.0/tpm2-tss-4.2.0.tar.gz"
  sha256: "b53f0c5c8c4ce17f05701a410ca9688f725ca380c9bc4640eacd0eadb1fea124"

patches:
  # 0001/0002：让自带 config.guess/config.sub 识别 aarch64-unknown-linux-ohos。
  # 4.2.0 sdist 的 config.sub 中 `grep -c ohos` = 0 → 直接 configure 会报
  # "Kernel 'linux' not known to work with OS 'ohos'" 之类错误。
  # 补丁由仓库脚本 scripts/patch-autotools-ohos.pl 生成（与本仓其他 autotools 库一致）。
  - patch_file: "patches/0001-config-guess-ohos.patch"
    patch_description: "0001 config.guess: 加入 HarmonyOS/ohos 三元组识别"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "0002 config.sub: 加入 ohos-linux / linux-ohos* 识别与 kernel-os 白名单"
    patch_type: "portability"
  # 0003：E114 类问题——autoconf 生成的 configure 用 `umask 077 && mktemp -d`
  # 建临时目录；HMDFS 上 077 会导致 config.status 无法创建临时文件。
  # configure.ac 内无 umask（来自 autoconf 模板），故只能改已生成的 configure。
  - patch_file: "patches/0003-configure-umask.patch"
    patch_description: "0003 configure: umask 077 → 022（HMDFS 上 077 导致 config.status 临时目录创建失败，E114）"
    patch_type: "portability"
  # 0004：cmocka 单测用 `-Wl,--wrap=read,--wrap=write` 等对 libc 调用打桩，
  # 而上游自己通过 AX_ADD_FORTIFY_SOURCE 注入了 `-D_FORTIFY_SOURCE=2`，
  # 该宏会把调用点改写成 `__read_chk`/`__write_chk`/`__open_chk`/… ——
  # `--wrap` 只能拦截普通符号，拦不到 `__*_chk` → 桩函数从未被调用 →
  # cmocka 报 "Has remaining non-returned values: __wrap_read" 而失败
  # （实测 io / tcti-{mssim,swtpm,device,pcap} / tctildr-getinfo 共 6 项）。
  # 上游本身即对个别测试目标用 `-U_FORTIFY_SOURCE`（见 Makefile-test.am 中
  # test_tpmclient_tpmclient_int_CFLAGS），但未覆盖这些 cmocka 单测。
  # 本补丁在 TESTS_CFLAGS 前加 -U_FORTIFY_SOURCE（该变量经
  # `test_unit_*_CFLAGS = $(CMOCKA_CFLAGS) $(TESTS_CFLAGS)` 传导到所有测试目标，
  # 且在编译行中位于 $(CPPFLAGS) 之后，故能撤销其 -D）。
  # 仅影响**测试二进制**，交付的 .so 仍保留 hardening。
  - patch_file: "patches/0004-tests-disable-fortify.patch"
    patch_description: "0004 Makefile.in: TESTS_CFLAGS 加 -U_FORTIFY_SOURCE，使 cmocka --wrap 打桩可用（_FORTIFY_SOURCE 把 read/write 改写为 __*_chk 致 --wrap 失效）"
    patch_type: "portability"
