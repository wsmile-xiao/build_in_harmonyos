package: tpm2-tss/4.2.0
homepage: "https://github.com/tpm2-software/tpm2-tss"

# 本包是 gnupg 测试链的上游：tpm2-tss → swtpm → gnupg tests/tpm2dtests
topology: "tpm2-tss (本包) → swtpm (运行时模拟器) → gnupg (tpm2dtests 消费者)"

upstream_test_in_build: true
upstream_test_command: "make check -j1（build() 内真实执行；--enable-unit 显式开启）"

upstream_tests:
  - name: unit
    source: "test/unit/*.c"
    command: "make check（cmocka 单元测试）"
    expected: "pass"
    run_2026_09_19:
      total: 47
      passed: 47
      failed: 0
      skipped: 0
      pass_rate: "47/47 = 100.0%"
      notes:
        - "上游 --enable-unit 默认为 no：不显式开启时单测根本不编译，make check 会以 '0 tests run' 静默通过（假阳性）。配方显式传 --enable-unit。"
        - "6 项失效根因 = 上游 AX_ADD_FORTIFY_SOURCE 的 -D_FORTIFY_SOURCE=2 把 libc 调用改写为 __read_chk/__write_chk，使 cmocka 的 -Wl,--wrap=read/write 打桩失配（桩函数从不被调用）。"
        - "1 项 SIGSEGV 根因 = cmocka 静态链入时其自身 calloc 也被 --wrap=calloc 拦截。改用 shared 变体后转 12/12 PASSED。"
  - name: integration
    source: "test/integration/*.int"
    command: "make check（需 --enable-integration）"
    expected: "not-run"
    run_2026_09_19:
      total: 29
      executed: 0
      reason: "未启用：上游 --enable-integration 强制要求宿主机有 ss（iproute2）并连真实/模拟 TPM，本沙箱无 ss。如实申报，不计入通过率分母。"

test_package:
  framework: "C + dlopen/dlsym"
  assertions:
    - "dlopen(libtss2-esys.so, RTLD_NOW) 成功"
    - "dlsym 断言 Esys_Initialize / Esys_Finalize / Esys_GetTcti / Tss2_TctiLdr_Initialize / Tss2_RC_Decode 均存在"
  rationale: "gnupg 的 configure 以 AC_SEARCH_LIBS([Esys_Initialize],[tss2-esys]) 判据探测 libtss，故 Esys_Initialize 必须真实存在——断言的是运行时可用性而非文件存在性（R34 反空壳）。"
