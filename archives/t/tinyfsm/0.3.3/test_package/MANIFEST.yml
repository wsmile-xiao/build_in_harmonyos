# test_package/MANIFEST.yml
# 上游官方测试声明文件
# tinyfsm 0.3.3 — header-only C++11 FSM 库

package: tinyfsm/0.3.3
homepage: "https://digint.ch/tinyfsm"

# 上游无 make check / ctest 入口；examples/ 目录为唯一"测试载体"
upstream_check_command: "make (examples/api, examples/elevator)"

# conanfile.py build() 中未集成上游测试（header-only，无编译）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机 clang++ 编译并运行 6 个 examples/api 示例工程）
upstream_tests:
  - file: examples/api/simple_switch.cpp
    source: tinyfsm-0.3.3/examples/api/simple_switch.cpp
    description: "单开关状态机（On/Off 切换）API 示例"
    command: "./simple_switch"
  - file: examples/api/resetting_switch.cpp
    source: tinyfsm-0.3.3/examples/api/resetting_switch.cpp
    description: "带 reset() 与 entry 动作的开关状态机"
    command: "./resetting_switch"
  - file: examples/api/multiple_switch.cpp
    source: tinyfsm-0.3.3/examples/api/multiple_switch.cpp
    description: "FsmList 多状态机并行示例"
    command: "./multiple_switch"
  - file: examples/api/debugging_switch.cpp
    source: tinyfsm-0.3.3/examples/api/debugging_switch.cpp
    description: "状态追踪/调试示例"
    command: "./debugging_switch"
  - file: examples/api/mealy_machine.cpp
    source: tinyfsm-0.3.3/examples/api/mealy_machine.cpp
    description: "Mealy 状态机示例"
    command: "./mealy_machine"
  - file: examples/api/moore_machine.cpp
    source: tinyfsm-0.3.3/examples/api/moore_machine.cpp
    description: "Moore 状态机示例"
    command: "./moore_machine"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：Fsm 状态机真实 API（start/is_in_state/dispatch/transit）3 项断言"
    command: "./test_tinyfsm"

# 测试断言总数：上游示例以交互输出为准（运行验证），test_package 固定 3 项断言
assertion_count: 3