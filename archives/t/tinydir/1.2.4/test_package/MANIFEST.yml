# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: tinydir/1.2.4
homepage: "https://github.com/cxong/tinydir"

# 上游测试命令 (tests/CMakeLists.txt 注册的 CTest 测试)
upstream_check_command: "ctest"

# conanfile.py build() 中未集成上游测试（header-only 无 build()）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（cbehave 框架）
upstream_tests:
  - file: file_open_test.c
    source: tinydir-1.2.4/tests/file_open_test.c
    description: "上游 file_open 测试：FEATURE 'File open' 1 个 SCENARIO（打开当前目录文件），cbehave 框架"
    command: "./file_open_test"
  - file: windows_unicode_test.c
    source: tinydir-1.2.4/tests/windows_unicode_test.c
    description: "上游 Windows Unicode 测试：仅 MSVC 分支构建（if(MSVC)），OHOS/Linux 不实例化"
    command: ""

# test_package 中自带的测试 (消费者视角验证, HarmonyOS 专项)
test_package_tests:
  - file: test_tinydir_harmonyos.c
    description: "HarmonyOS 专项消费者测试: aarch64 平台断言 + OHOS libc (getcwd/mkdir/access) 集成 + tinydir 公开 API（open/readfile/next/close/open_sorted/readfile_n/open_subdir_n/file_open/扩展名提取）"
    command: "./test_tinydir_harmonyos"

# 测试断言总数 (上游 cbehave 断言 + 鸿蒙专项断言, 近似值)
assertion_count: 30
