build:
  system: makefile
  configure_options:
    - "make triangle          # CLI（triangle.c，不带 -DTRILIBRARY）"
    - "make trilibrary        # triangle.o（带 -DTRILIBRARY）+ tricall"
    - "ar rcs libtriangle.a triangle.o"
  dependencies: []

patches_applied:
  - "patches/0001-makefile-ohos.patch"

knowledge_gained:
  - "triangle.c 的 -DLINUX 分支只做两件事：include <fpu_control.h> 与调用 _FPU_SETCW()（triangle.c:351-353, 4891-4905）。这两样是 glibc/x86 专有，OHOS(musl, aarch64) 上不存在；aarch64 本身原生 IEEE double，不需要控制 x87 精度控制字，因此直接不定义 -DLINUX 即可，不是绕过而是不需要"
  - "triangle.c 是 1990 年代 K&R C：124 个函数使用 old-style 定义（无原型参数表）。C23 删除了该语法，GCC 15（默认 -std=gnu23）直接报 'too many arguments to function readline; expected 0'。改为在 makefile 的 CSWITCHES 固定 -std=gnu17 可解；clang 15 默认 gnu17 本来就能过，固定只是防新编译器默认上浮"
  - 'triangle 的 makefile 硬编码 CC = cc 与 -I/usr/X11R6/...；改成 CC ?= 并让 CSWITCHES 取 $(CPPFLAGS) $(CFLAGS)，构建标志才能由 Conan toolchain 提供（R33：不依赖未定义的 shell 变量）'
  - "triangle.h 不自己定义 REAL/VOID，且仅当调用方定义 ANSI_DECLARATORS 时才给出 ANSI 原型；消费者须按上游 tricall.c 的写法先 #define REAL double / VOID void 再 include"
  - "上游分发无任何测试目标（makefile 只有 all/trilibrary/triangle/tricall/triangle.o/showme/distclean），未提供测试源文件；唯一随包样例是 A.poly"
  - "netlib 的 triangle.zip 是常驻镜像（文件时间戳 2005-07-27），sha256 稳定可作硬门禁"

patch_generation:
