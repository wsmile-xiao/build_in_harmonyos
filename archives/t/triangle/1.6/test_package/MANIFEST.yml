# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（triangle 1.6，netlib 分发 zip 内实测）：
#
#   upstream_test_targets = 0
#       zip 内容为 README / triangle.c / triangle.h / tricall.c / showme.c /
#       makefile / A.poly 共 7 项。makefile 的目标只有 all / trilibrary /
#       triangle / tricall / triangle.o / showme / distclean —— **没有 check
#       或 test 目标**，也没有 ctest / autotest / 任何测试框架依赖。
#
#   upstream_test_files   = 0
#       没有任何测试源文件：tricall.c 是"如何调用 Triangle"的示例程序
#       （README 原文 "Sample program that calls Triangle"），需要人工喂输入，
#       不是自动化测试；A.poly 是唯一一个样例输入，不是测试用例。
#
#   upstream_case_total   = 0
#       上游不提供任何用例（不是 UNKNOWN——是确认为 0，依据是 makefile 目标
#       清单 + zip 文件清单，两者都可逐条核对）。
#
# 因此本配方**不申报上游测试通过率**，转而提供两类可核查的替代验证：
#   (a) build() 内用上游自带样例 A.poly 跑通 CLI（distribution-sample），
#       并要求生成 A.1.node / A.1.ele / A.1.poly —— 证明精确算术代码在目标
#       平台上真的执行了，而不是只链接成功；
#   (b) test_package 里的 API 消费者测试 + 自建 PSLG 的 CLI 冒烟。
# 两者都不是上游测试，故不计入上游用例统计。

package: triangle/1.6
homepage: "https://www.cs.cmu.edu/~quake/triangle.html"

upstream_tests_exist: false
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# 上游分发自带的样例（非测试，仅作用户/build() 冒烟素材）
distribution_samples:
  - file: A.poly
    description: "上游唯一随包分发的 PSLG 样例（29 顶点 / 29 段 / 1 洞）；build() 用它跑 `./triangle -pq A.poly`，要求退出码 0 且产出 A.1.node / A.1.ele / A.1.poly"

test_package_tests:
  - file: src/test_triangle.c
    description: "C 消费者链接 libtriangle.a，调用 triangulate()/trifree() 对单位正方形做 Delaunay 三角化：断言 4 顶点保持、恰 2 个三角形、三线性角、角标在范围内、两三角形面积和 == 1.0（R34 真实 API 调用）"
    command: "./test_triangle"
  - file: test_package/conanfile.py (test())
    description: "CLI 冒烟：test() 现场写 test_square.poly，运行安装后的 triangle -pzQ，要求产出 test_square.1.node/.ele/.poly"
    command: "triangle -pzQ test_square.poly"

assertion_count: 6
