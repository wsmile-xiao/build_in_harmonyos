# conandata.yml — triangle 1.6
# Source: the distribution archive linked from the author's own page
#   https://www.cs.cmu.edu/~quake/triangle.html  ->  netlib mirror
# The zip is a flat archive (README, triangle.c, triangle.h, tricall.c,
# showme.c, makefile, A.poly) with no top-level directory, so no strip_root.
# sha256 computed from the downloaded archive.

sources:
  url: "https://www.netlib.org/voronoi/triangle.zip"
  sha256: "1766327add038495fa3499e9b7cc642179229750f7201b94f8e1b7bee76f8480"

patches:
  - patch_file: "patches/0001-makefile-ohos.patch"
    patch_description: >-
      makefile: drop -DLINUX (it pulls glibc/x86 <fpu_control.h> and
      _FPU_SETCW, absent on OHOS), drop the X11 include/lib paths that only
      Show Me needs, take optimisation flags from the Conan toolchain via
      $(CPPFLAGS)/$(CFLAGS), allow CC override, and pin -std=gnu17 because
      triangle.c uses 124 K&R old-style function definitions that C23 removed
    patch_type: "portability"
