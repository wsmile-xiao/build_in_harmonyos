software:
  name: tinyxml
  version: 2.6.2
  description: Small, simple C++ XML parser
  license: Zlib
  build_system: cmake
  source_url: https://deb.debian.org/debian/pool/main/t/tinyxml/tinyxml_2.6.2.orig.tar.gz
  source_sha256: 15bdfdcec58a7da30adc87ac2b078e4417dbe5392f3afb719f9ba6d062645593

status: built

configure_options:
  - -DBUILD_SHARED_LIBS=OFF
  - -DTINYXML_USE_STL=ON

build_commands:
  - conan create archives/t/tinyxml/2.6.2 --profile:host ohos-host-tinyxml.profile --profile:build windows-build.profile --build=missing

install_commands:
  - cmake --install (generated Conan build directory)

dependencies: []

products:
  libraries:
    - name: tinyxml
      path: lib/libtinyxml.a
  headers:
    - tinyxml.h
    - tinystr.h

tests:
  upstream: xmltest.cpp (109/109)
  consumer: test_package/consumer.cpp (1/1 host, 1/1 target)

notes: |
  TinyXML 2.6.2 has no CMake or install target upstream. The recipe injects a
  task-owned CMake entry point, keeps the four implementation sources unchanged,
  and installs the two public headers plus libtinyxml.a.
