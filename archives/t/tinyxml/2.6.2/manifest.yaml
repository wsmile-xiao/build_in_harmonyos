software:
  name: tinyxml
  version: 2.6.2
  description: XML parser
  license: Zlib
  build_system: make
  source_url: https://downloads.sourceforge.net/project/tinyxml/tinyxml/2.6.2/tinyxml_2_6_2.tar.gz

status: published

configure_options: []

build_commands:
  - make

install_commands:
  - manual install (no standard install target)

dependencies: []

products:
  libraries:
    - name: libtinyxml
      path: lib/libtinyxml.a
  executables:
    - name: xmltest
      path: bin/xmltest

notes: |
  tinyxml 2.6.2 is a simple XML parser library.
  It uses a simple Makefile without standard configure/install targets.
  Manual installation required for library and headers.