schema_version: 1
package: tinyxml/2.6.2
homepage: 'https://sourceforge.net/projects/tinyxml/'

upstream_check_command: 'make clean && make && ./xmltest'
upstream_test_in_build: false
upstream_test_command: ''
upstream_tests:
  - file: xmltest.cpp
    source: tinyxml/xmltest.cpp
    description: 'TinyXML 官方回归测试程序，覆盖 DOM、UTF-8、流和错误处理'
    command: './xmltest'
    fixtures:
      - utf8test.xml
      - utf8testverify.xml
    assertion_count: 109

test_package_tests:
  - file: consumer.cpp
    description: '消费者测试：解析 XML、读取属性、实体展开并序列化 DOM'
    command: './tinyxml_consumer'
    assertion_count: 3

assertion_count: 112

notes: |
  上游仅提供 GNU Makefile，配方通过任务私有 CMakeLists.txt 构建静态或共享库。
  上游测试在适配证据阶段以原始 Makefile 独立运行；test_package 保持独立的消费者 API 检查。
