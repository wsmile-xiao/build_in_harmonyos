# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: tomsfastmath/0.13.1
homepage: "https://github.com/libtom/tomsfastmath"

# 上游测试（demo/ 目录自带测试程序；配方 build() 内嵌运行）
upstream_test_command: "make CC=<clang> && make test_standalone CC=<clang> && ./stest && ./test"

upstream_tests:
  - file: demo/stest.c
    source: tomsfastmath-0.13.1/demo/stest.c
    description: "上游自测程序（mul/sqr/mont 三组校验，9 项 passed，退出码 0）"
    command: "make CC=<clang> -j2 && clang -O2 -Isrc/headers demo/stest.c libtfm.a -o stest && ./stest"
  - file: demo/test.c
    source: tomsfastmath-0.13.1/demo/test.c
    description: "上游主测试套件（make test_standalone 构建；Montgomery #1/#2 Passed、素数扫描 512-639 bits、RSA/ECC 段等，退出码 0）"
    command: "make test_standalone CC=<clang> -j2 && ./test"

test_package_tests:
  - file: test_tomsfastmath.c
    description: "消费者测试: 位计数/加法/乘法/有符号减法/十进制输出/大数平方位宽（7 项断言，链接打包 libtfm.a）"
    command: "./test_tomsfastmath"

assertion_count: 7
