# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  note: |
    META.json prereqs.runtime.requires 全部为 perl 核心模块
    （B / Scalar::Util / Test::Builder），OHOS perl 内建，无外部 CPAN 依赖、
    无 Conan 依赖。
    上游 Build.PL 另声明 `recommends => { Devel::MAT => 0.04 }`——这是可选
    增强（缺失时模块以 HAVE_DEVEL_MAT_DUMPER=0 降级，上游测试亦按该常量
    分支），故**不写入 PREREQ_PM**，不把可选依赖变成硬依赖。
    configure.requires Module::Build>=0.4004 在 OHOS 不可得 → 配方以
    ExtUtils::MakeMaker（perl 核心）生成等价 Makefile.PL 替代。
    test.requires Test::Builder::Tester / Test::More>=0.88 由 OHOS perl 自带，
    故上游测试可真跑。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Perl 模块无二进制产物，沿用
    perl-uri / perl-io-multiplex / metrics-any 先例；不产生 bindirs，故无需
    commands.json，R38 不适用）。
    构建：perl Makefile.PL INSTALLDIRS=site → make → make test →
    make install DESTDIR=<staging>；package() 按登台树原样拷入
    package_folder，并以遍历定位 Test/Refcount.pm 后**回溯父级**得到 site
    目录（安装前缀随 perl 构建而异，实测
    /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0）。
    package_info() 以 runenv_info 注入 PERL5LIB，下游 perl 脚本可直接
    use Test::Refcount；无 C/C++ 库可链接（cpp_info.libs=[]，R26 不适用）。
    解释器固定 /data/service/hnp/bin/perl（5.42.0），与 metrics-any 0.10
    口径一致（设备 perl 5.42.2 的 Errno 缺别名常量，统一用 hnp perl 规避
    同类假失败）。

