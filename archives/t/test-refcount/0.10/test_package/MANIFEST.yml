# test_package/MANIFEST.yml — test-refcount 0.10
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: test-refcount/0.10
homepage: "https://metacpan.org/pod/Test::Refcount"

# 上游测试命令：上游为 Module::Build（Build.PL），但 Module::Build 在 OHOS
# 不可得（设备 perl / hnp perl 均无 Module/Build.pm，制品仓亦无
# perl-module-build），故配方由 ExtUtils::MakeMaker 生成等价 Makefile.PL，
# 上游测试经 make test 运行。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试套件（2026-09-18 实测，hnp perl 5.42.0）：
# - t/ 目录：6 个 .t 测试文件
# - 实测结果：**Files=6, Tests=20, Result: PASS**（含 1 个 skip 文件）
#   skip：99pod.t —— `skipped: Test::Pod 1.00 required for testing POD`
#   （可选 POD 校验依赖未安装，非失败）
# - 上游测试用 Test::Builder::Tester 捕获被测断言产生的 TAP 并比对期望，
#   覆盖 is_refcount / is_oneref 的成功与失败两条路径（含 weak ref 与循环自引用）
upstream_tests:
  - file: t/
    source: Test-Refcount-0.10/t/*.t
    description: "上游 perl 测试套件（6 文件 20 用例；hnp perl 5.42.0 实测 Result: PASS，1 个 skip 文件 99pod.t 需 Test::Pod，零失败）"
    command: "make test"

# test_package 消费者测试（R34 真实 API：加载打包的 Test::Refcount，真实调用
# is_refcount / is_oneref / refcount）
#
# ⚠️ 两个测试源必须**独立进程**运行：
#   - 正向脚本要求全过（rc=0）
#   - 失败路径脚本**故意**让被测断言失败（rc 非 0 为预期），由 .py 驱动核对
#     STDOUT/STDERR 中确实出现上游语义要求的诊断文案
test_package_tests:
  - file: test_test_refcount.pl
    description: "消费者测试（正向）：版本号、is_oneref/is_refcount、aliasing 后引用数、refcount() 公开 API、weak 引用不计入、循环自引用、SCALAR/ARRAY/HASH/CODE/GLOB 各类型、导出接口齐全（12 断言）"
    command: "perl -I<site> test_test_refcount.pl"
  - file: test_test_refcount_negative.pl
    description: "消费者测试（失败路径，故意失败）：非引用入参须报 'expected a reference, was not given one'；引用数不符须报 'expected 1 references, found 2'（4 处断言失败为预期）"
    command: "perl -I<site> test_test_refcount_negative.pl"

# 测试断言总数（实测：正向 12 条 + 失败路径 4 条 = 16）
assertion_count: 16
