# test_package/MANIFEST.yml
# 上游测试声明文件（CI 强制要求 / L0e）
package: thunk-gen/1.10
homepage: "https://github.com/stsp/thunk_gen"

# ============================================================
# 上游测试实情（R51 三步法：清点 -> 实跑 -> 如实回填）
# ============================================================
# 清点结论：上游 1.10 **没有自动化测试套件**。
#   - 官方 tarball 无 tests/ 目录（21 个文件：meson.build / src/ / scripts/
#     / debian/ / configure / build_deb.sh / build_rpm.sh / 文档）
#   - meson.build 与 src/meson.build 未注册任何 test()
#   - README.md 的"构建/验证"只有一句：运行 ./configure 然后照屏幕提示
#   - debian/rules 用 dh --buildsystem=meson，无 override_dh_auto_test
upstream_tests_exist: false
upstream_check_command: "无（上游无 make check / meson test / ctest 入口）"
upstream_verifiable_entry: "./configure && meson compile -C build"
upstream_entry_executed_in_build: true
upstream_entry_note: >-
  ./configure 只是 `meson setup $* build .` 的 bash 包装（非 autotools，
  故 init-build 的 BUILD_SYSTEM=autotools 为文件名误判）。配方 build() 用
  Meson 工具类执行等价的 meson setup + meson compile，即上游唯一可核验入口。

# ============================================================
# 新增的 OHOS 消费者测试（本适配新增，替代缺失的上游套件）
# ============================================================
ohos_consumer_tests:
  source: "tests/（随 recipe exports_sources 导出，落在源码树根与 scripts/ 同级）"
  driver: "tests/ohos_consumer_test.sh"
  command: "bash tests/ohos_consumer_test.sh <mode> <built thunk_gen> <tests_dir> <work_dir> [out]"
  executed_in: "conanfile.py build() 末尾（针对本次构建出的 thunk_gen 真实执行）"
  modes:
    - name: parse-decls
      input: "tests/ohos_consumer_decls.h"
      description: "parse_decls.sh 模式 1-7 + mkasmdefs.sh 的筛选/编号/宏生成语义"
      check_count: 23
    - name: gen-c
      input: "tests/ohos_consumer_decls.h"
      description: "thunk_type=0：C 派发表逐条核对 _DISPATCH/_DISPATCH_v/_ARG/_ARG_PTR/_ARG_R"
      check_count: 7
    - name: asm-templates
      input: "tests/ohos_consumer_decls.h"
      description: "thunk_type=1 的 THUNK(...) 与 thunk_type=2 的 _THUNK<n><suffix> 交叉一致性"
      check_count: 11
    - name: m4-pipeline
      input: "tests/ohos_consumer_decls.h"
      description: "tg_m4 + thunks.m4 的 m4sugar 展开（依赖下游工具 autom4te）"
      check_count: 4
  total_check_count: 65
  c_probe:
    file: "tests/consumer_c_dispatch.c"
    description: >-
      真实消费者用法探针：把 thunk_gen 生成的 thunk_calls.h include 进 switch，
      自备 _DISPATCH/_DISPATCH_v/_ARG/_ARG_PTR/_ARG_R/_RET 后编译、链接、运行，
      逐条核对 case 编号 -> 符号名 / 返回形态 / 返回宽度 / 参数编组。
    command: "<cc> -O1 -Wall -I<work_dir> -o consumer_c_dispatch tests/consumer_c_dispatch.c && ./consumer_c_dispatch"
    check_count: 20

# 计数口径：全部由脚本/探针在真机自报（OHOS_CONSUMER_TESTS / OHOS_CONSUMER_C
# 汇总行），不硬编码；详细数字见 reports/test-report.md 与
# package 内 hmbs_upstream_result.json。
#
# 真机实测（OHOS PC aarch64）：
#   上游消费者测试 build() 阶段 = 65 （23 + 7 + 11 + 4 + 20），failed 0, skipped 0
#   test_package 阶段           = 49 （test.sh 29 + 探针 20），failed 0

# ============================================================
# test_package 中自带的测试（消费者视角验证）
# ============================================================
test_package_tests:
  - file: test.sh
    description: >-
      只用包装好的产物跑通 dj64dev/comcom64/fdpp 的调用管线
      （parse_decls.sh -> nl -v 0 -> thunk_gen），并编译运行 test_thunk_gen.c
    command: "bash test.sh <package_folder> <cc>"
    check_count: 29
  - file: test_thunk_gen.c
    description: "消费者 C 探针（与版本目录 tests/consumer_c_dispatch.c 同源）"
    command: "./test_thunk_gen"
    check_count: 20

assertion_count: 49
