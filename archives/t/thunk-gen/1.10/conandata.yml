sources:
  # R39：单一官方源 URL。thunk_gen 上游 tags 直接提供 tar.gz 归档
  # （顶层目录 thunk_gen-1.10/）。真机 2026-10-08 实测 github.com 直连可用，
  # 重下归档 sha256 与 init-build 落盘归档逐字节一致。
  url: "https://github.com/stsp/thunk_gen/archive/refs/tags/1.10.tar.gz"
  sha256: "42ef5151bf0dd74a6afbf5a55b1df6d9ac6c289cdd1362dc4aaec69440605656"

patches:
  # 两处均为"上游脚本在 OHOS 用户态（toybox）下无法工作"的真实可移植性缺陷
  # 修复，各自独立成因，故拆成两个补丁，按序应用。
  - patch_file: "patches/0001-fix-plt-asmp-sed-capture-group.patch"
    patch_description: >-
      scripts/parse_decls.sh 的 gen_plt_asmp()（模式 5，pascal 跳转表）
      在 sed 替换串里引用了不存在的第 3 个捕获组（\3），而该表达式只定义了
      两个捕获组；改为引用第 2 个捕获组（\2），与同文件 gen_plt_asmc()
      的 ASMCSYM 语义对齐。该缺陷与实现无关：GNU sed 3.12 与 toybox sed
      都会直接报错退出（`sed: no s//\3/`，exit 1），使模式 5 完全不可用。
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-toybox-grep-ere-alternation.patch"
    patch_description: >-
      scripts/parse_decls.sh 的 gen_asms_tmp()（模式 2，定义侧筛选）使用
      BRE 交替 `grep 'ASMFUNC\|ASMPASCAL'`。`\|` 是 GNU grep 的 BRE 扩展，
      OHOS 的 toybox grep 不支持——它把整个模式当字面量匹配，结果零输出且
      退出码 1，消费者侧"定义侧声明流"直接为空。改用可移植的 ERE 形式
      `grep -E 'ASMFUNC|ASMPASCAL'`（GNU grep 与 toybox grep 行为一致）。
    patch_type: "portability"

