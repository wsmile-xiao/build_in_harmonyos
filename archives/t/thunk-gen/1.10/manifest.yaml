# 版本级 manifest — thunk-gen 1.10
version: "1.10"
software: "thunk-gen"
status: built
build_date: "2026-10-08"
build_system: meson

source:
  url: "https://github.com/stsp/thunk_gen/archive/refs/tags/1.10.tar.gz"
  sha256: "42ef5151bf0dd74a6afbf5a55b1df6d9ac6c289cdd1362dc4aaec69440605656"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "meson setup --prefix=/ --native-file conan_meson_native.ini（MesonToolchain 生成）"
    - "-Ddefault_library=static（R26：终端工具静态链接）"
  dependencies:
    - "meson/1.11.0"
    - "ninja/1.12.1"
    - "bison/3.8.2"
    - "flex/2.6.4"
    - "bash/5.3"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-plt-asmp-sed-capture-group.patch"
  - "0002-ohos-toybox-grep-ere-alternation.patch"

testing:
  upstream_tests_exist: false
  upstream_tests_note: >-
    上游 1.10 无自动化测试套件：官方 tarball 无 tests/ 目录，meson.build 未
    注册 test()，README 只写 "run ./configure"；debian/rules 也无
    override_dh_auto_test。唯一可核验的真实入口是 ./configure →
    meson compile，配方 build() 已执行等价命令。
  ohos_consumer_tests:
    - name: "parse-decls"
      status: "integrated"
      command: "bash tests/ohos_consumer_test.sh parse-decls <built thunk_gen> <tests> <work>"
    - name: "gen-c"
      status: "integrated"
      command: "bash tests/ohos_consumer_test.sh gen-c <built thunk_gen> <tests> <work> <out>"
    - name: "asm-templates"
      status: "integrated"
      command: "bash tests/ohos_consumer_test.sh asm-templates <built thunk_gen> <tests> <work>"
    - name: "m4-pipeline"
      status: "integrated"
      command: "bash tests/ohos_consumer_test.sh m4-pipeline <built thunk_gen> <tests> <work>"
    - name: "consumer-c-dispatch-probe"
      status: "integrated"
      command: "clang -O1 -Wall -I<work> -o consumer_c_dispatch tests/consumer_c_dispatch.c && ./consumer_c_dispatch"
  ohos_consumer_tests_measured:
    # 真机实测（OHOS PC aarch64，随 conan create 的 build() 执行并写入包内
    # hmbs_upstream_result.json）：discovered 65 / executed 65 / passed 65 /
    # failed 0 / skipped 0
    total: 65
    by_mode:
      parse-decls: 23
      gen-c: 7
      asm-templates: 11
      m4-pipeline: 4
      c-dispatch-probe: 20
  test_package_tests:
    - name: "consumer pipeline via packaged artifacts + C probe"
      test_command: "bash test.sh <package_folder> <cc>"
      assertion_count: 49   # 真机实测：test.sh 29 + 消费者 C 探针 20，failed 0

consumer_contract:
  pkg_config_name: "thunk_gen"
  note: >-
    下游（dj64dev / comcom64 / fdpp）经 scripts/thunk_gen.mk 用
    pkg-config --variable={binary,tgscript,pdscript,mkadscript,
    m4script,m4_32script,makeinc} 取用工具，故 package_info() 用
    pkg_config_custom_content 显式补出这 7 个变量，并把随包 .pc 的 prefix
    改写成 ${pcfiledir}/../.. 以保证可重定位。
  verified:
    - "裸 pkg-config：8/8 变量解析为真实存在文件"
    - "Conan PkgConfigDeps 生成器：8/8 变量解析为真实存在文件"
    - "按 scripts/thunk_gen.mk 复刻全管线：13/13 目标产物非空且退出码 0"

knowledge_gained:
  - "上游 configure 只是 meson setup 的 bash 包装，按文件名判定构建系统会误判为 autotools (ref: reports/test-report.md 源码核验节)"
  - "Conan MesonToolchain 把 cpp_info.bindirs[0] 同时映射为 meson 的 bindir/sbindir/libexecdir，故上游 libexecdir/thunk_gen 安装点会落到包的 bin/thunk_gen/ (ref: conan/tools/meson/toolchain.py:337-359)"
  - "scripts/parse_decls.sh 模式 5 的 sed 替换串引用不存在的第 3 个捕获组，toybox sed 与 GNU sed 都报错退出 1，须补丁改为第 2 个捕获组 (ref: patches/0001-fix-plt-asmp-sed-capture-group.patch)"
  - "scripts/parse_decls.sh 模式 2 用 GNU BRE 扩展 `grep 'A\\|B'` 做交替匹配；OHOS 的 /system/bin/grep 是 toybox，把 \\| 当字面量 → 零输出且退出 1，须改为 grep -E (ref: patches/0002-ohos-toybox-grep-ere-alternation.patch)"
  - "meson 的 pkg.generate() 会把 MesonToolchain 设定的 prefix=/ 烘进 .pc，须在 package() 改写为 ${pcfiledir}/../.. 才可重定位 (ref: reports/test-report.md 消费者契约节)"

# 补丁生成方式：人工策展（两个补丁各自独立成因），不使用 refresh-patch --auto
# 的合并式生成——auto 会按"每文件一个补丁"把两处修复合并为单个
# 0001-scripts-parse_decls.sh.patch，与本 conandata.yml 的 patches 清单不一致，
# 并触发 export_sources() 的 "Patch file does not exist"。
patch_generation:
  method: curated
  patches_count: 2
  note: >-
    refresh-patch --auto 需要"每文件一个补丁"；本包同一文件有两处独立缺陷，
    故保留两个补丁并重置 edit_tracker 基线，使 auto 走"保留现有补丁"分支。
