software: thunk-gen
display: "thunk_gen"
description: "thunk 代码生成器，为 dj64dev/comcom64/fdpp 一类工程生成 16/32 位 DOS 调用桩（thunk）"
category: build-tool
homepage: "https://github.com/stsp/thunk_gen"
license: GPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "仓库根的 configure 是 meson setup 的 bash 包装（非 autotools），构建系统按 Meson 处理"
    - "上游把可执行文件与消费者脚本装在 libexecdir/thunk_gen/；MesonToolchain 把 cpp_info.bindirs 映射为 meson 的 libexecdir，故包内落在 bin/thunk_gen/"
    - "上游无自动化测试套件，本适配新增 tests/ 下的 OHOS 消费者测试并在 build() 真实执行（65/65 通过）"
    - "scripts/parse_decls.sh 的 gen_plt_asmp()（模式 5）sed 替换串引用了不存在的第 3 个捕获组，toybox sed 与 GNU sed 均报错退出，需补丁改为第 2 个捕获组"
    - "scripts/parse_decls.sh 的 gen_asms_tmp()（模式 2）用 GNU BRE 扩展 grep 'A\\|B'；OHOS /system/bin/grep 是 toybox，把 \\| 当字面量导致零输出，需改为 grep -E"
    - "随包 lib/pkgconfig/thunk_gen.pc 的 prefix 由 meson 烘成 /，须在 package() 改写为 ${pcfiledir}/../.. 才能随包目录搬移"
  common_dependencies:
    - meson
    - ninja
    - bison
    - flex

versions:
  "1.10":
    status: built
    build_date: "2026-10-08"
