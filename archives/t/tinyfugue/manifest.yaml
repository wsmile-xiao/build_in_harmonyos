software: tinyfugue
display: "TinyFugue"
description: "可编程的终端 MUD 客户端"
category: utility
homepage: "https://github.com/ingwarsw/tinyfugue"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "termcap 是核心 TUI 能力，通过 Conan 静态 ncurses/6.4 保持启用"
    - "widechar 依赖 ICU，基础配方显式关闭"
    - "SSL、Lua、Python 为可选能力，基础配方显式关闭"
    - "PCRE2 和 zlib 是 configure 必需依赖"
    - "configure 的 umask 077 需要改为 022 以兼容 HMDFS"
    - "上游没有 check/test 目标，官方测试统计为 0/0"
  common_dependencies:
    - "pcre2/10.45"
    - "zlib/1.3.1.1"
    - "ncurses/6.4 (shared=False)"

versions:
  "5.2.2":
    status: prepared
    build_date: "2026-09-30"
    conan_ref: "tinyfugue/5.2.2"
