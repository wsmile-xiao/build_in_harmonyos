# test_package/MANIFEST.yml
# Consumer-test declaration for TinyFugue 5.2.2.
#
# Upstream check: none. The 5.2.2 tree has no check/test target and its
# GitHub workflow runs configure, make, and make install only.

package: tinyfugue/5.2.2
homepage: "https://github.com/ingwarsw/tinyfugue"

# No upstream test command exists in the selected source archive.
upstream_check_command: ""

# build() intentionally does not invent make check or make test.
upstream_test_in_build: false
upstream_test_command: ""

# No upstream automated regression tests are declared or run.
upstream_tests: []

# These are consumer smoke checks, not upstream tests.
#
# The TUI is intentionally not launched: upstream CI never does, and a
# headless worker has no controlling terminal.
test_package_tests:
  - file: test.sh
    description: "Run the installed tf binary: check PATH lookup, --version, --help, non-empty stdlib.tf, and at least 40 packaged tf-lib scripts"
    command: "bash test.sh"

assertion_count: 5
