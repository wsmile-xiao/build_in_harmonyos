version: "5.2.2"
software: "tinyfugue"
status: prepared
verification: unverified
build_date: "2026-09-30"
build_system: autotools

source:
  url: "https://github.com/ingwarsw/tinyfugue/archive/refs/tags/5.2.2.tar.gz"
  sha256: "b7d0d914e6ae86f817bee341da77b74a62e22d601e7763e9bc86b074daa8892c"
  tar_format: tar.gz
  tag: "5.2.2"
  commit: "d9e519a92a76d23e889a0d2717266fdaa3578531"

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-widechar"
    - "--disable-ssl"
    - "--disable-python"
    - "--disable-lua"
    - "--enable-termcap=ncursesw"
  dependencies:
    - "pcre2/10.45"
    - "zlib/1.3.1.1"
    - "ncurses/6.4 (shared=False)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-main-long-options.patch"
  - "0002-configure-hmdfs-umask.patch"

knowledge_gained:
  - "The generated TinyFugue configure script forces enable_lua=yes even for --disable-lua; the recipe honors the parsed option value before configure probes for Lua."
  - "GitHub source archives omit .git metadata, so the upstream git-describe version fallback reports development; build() replaces that expression with TFVER=5.2.2."
  - "The upstream 5.2.2 tree has no check or test target; its CI runs configure, make, and make install only."
  - "PCRE2 and zlib are mandatory configure dependencies; ncurses termcap is kept enabled for the core TUI."
  - "generate() uses AutotoolsDeps so configure sees PCRE2/zlib from Conan instead of accidentally probing host libraries."
  - "Terminal support uses the repository ncurses/6.4 static package; terminal linking keeps -static."
  - "configure uses umask 077 for temporary directories, which conflicts with HMDFS; it is changed to 022."
  - "widechar, SSL, Lua, and Python are optional and off in this package; history, process, floating point, 256-color, and terminal client features remain enabled."
  - "The terminal client is interactive; consumer validation is limited to --version, --help, and a no-world startup that executes /quit."
