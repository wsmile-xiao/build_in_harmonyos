# Build hints for txt2man 1.7.1
# txt2man has no configure script - it's a simple Makefile project
# Shell script tool: converts flat ASCII text to man page format

skip_configure: true

build_commands:
  - "make prefix=$DEFAULT_PREFIX"
  - "make install prefix=$DEFAULT_PREFIX DESTDIR=$TEST_PREFIX"

make_parallel: 1

# No test suite available
skip_check: true

# Dependencies: requires gawk for generating man pages
dependencies_runtime:
  - gawk
