version: "2.5.13"
software: teckit
status: built
build_date: "2026-09-29"
conan_ref: "teckit/2.5.13"

source:
  url: "https://github.com/silnrsi/teckit/releases/download/v2.5.13/teckit-2.5.13.tar.xz"
  sha256: "3f55cd3670f1ff1a439d5a40071870b9e4ca2be8877a0eb80e24783cb532b380"
  tar_format: tar.xz

build:
  system: manual
  dependencies:
    - zlib/1.3.1.1
    - expat/2.8.2
  build_requirements: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "The upstream release contains configure.ac and Makefile.am but no generated configure/Makefile.in files. The OHOS worker cannot reliably run autoreconf because Conan's Perl and the device system Perl come from incompatible installations, so the recipe compiles the small Kylix-independent C++ source set directly with clang++ instead of mixing Autotools generations."
  - "The bundled zlib source is not used; the recipe links against the already-published zlib/1.3.1.1 OHOS package."
  - "The bundled expat source is not used; sfconv is linked directly against the published expat/2.8.2 OHOS package, and both dependency include/lib directories are passed to clang++ and embedded through rpath."
  - "HarmonyOS mounts '/' and '/tmp' read-only, so compilation and the upstream Perl test runner must point TMPDIR/TMP/TEMP inside the Conan build folder."
  - "The upstream test/dotests.pl runner can be invoked directly with BINDIR and SRCDIR pointing at the cross-built binaries and the untouched upstream test directory; this avoids Autotools while still executing the complete upstream regression suite."
  - "The upstream Makefile installs public headers through pkginclude_HEADERS, so they land in <prefix>/include/teckit/; cpp_info lists both include/teckit and include for consumers."
  - "The compiled academy.tec fixture is kept as base64 text in the PR and decoded by test_package because GitCode/CI cannot reliably apply binary patches; no Autotools archive or other binary payload remains in the PR."

tests:
  upstream:
    framework: perl/dotests.pl
    test_count: 23
    note: "The upstream runner performs 13 explicit compile/convert/compare checks plus 10 normalization-form pair comparisons."
  adapted:
    command: "direct dotests.pl execution plus Conan test_package"
    passed: 30
    failed: 0
    pass_rate: 30/30
    breakdown:
      upstream_checks: 23
      consumer_api_checks: 7

blockers: []

verification:
  environment: OpenDesk HarmonyOS aarch64
  job: "20260929-153823-f263b1-teckit-manual-build-r3"
  command: "conan create archives/t/teckit/2.5.13 -pr:b=ci/conan/profiles/ohos-aarch64 -pr:h=ci/conan/profiles/ohos-aarch64 --build=missing"
  upstream_pass_rate: 23/23 (100%)
  adapted_pass_rate: 30/30 (100%)
