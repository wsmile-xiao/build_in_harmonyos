package: teckit/2.5.13
homepage: "https://software.sil.org/teckit/"

upstream_check_command: "BINDIR=<build/bin> SRCDIR=<source/test> perl test/dotests.pl"
upstream_test_in_build: true
upstream_test_command: "BINDIR=<build/bin> SRCDIR=<source/test> perl test/dotests.pl"

upstream_tests:
  - file: test/dotests.pl
    source: test/dotests.pl
    description: "Compile and compare the upstream Greek mapping, convert text through txtconv in both directions, run sfconv, and compare the upstream normalization corpus at the end."
    command: "BINDIR=<build/bin> SRCDIR=<source/test> perl test/dotests.pl"

test_package_tests:
  - file: consumer.cpp
    description: "Link the installed public engine and compiler libraries and exercise version, compile, converter creation, conversion, and disposal APIs."
    command: "clang++ consumer.cpp"

assertion_count: 30
