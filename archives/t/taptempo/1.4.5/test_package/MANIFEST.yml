package: taptempo/1.4.5
homepage: "https://taptempo.tuxfamily.org/"
upstream_test_in_build: false
upstream_check_command: "cmake --build <native-build-dir> --target test"
upstream_test_command: "<native-build-dir>/test/optionsTest --reporter compact"
upstream_tests:
  - file: test/optionsTest.cpp
    description: "19 Catch2 v2 test cases and 95 REQUIRE checks for CLI option parsing"
test_package_tests:
  - file: functional.py
    description: "10 executable CLI scenarios including timed BPM, sample window, reset and game mode"
    command: "python3 functional.py <absolute-package-bin>/taptempo --report-dir <results-dir>"
assertion_count: 95
