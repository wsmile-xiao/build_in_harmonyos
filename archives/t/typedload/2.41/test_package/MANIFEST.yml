# test_package/MANIFEST.yml — typedload 2.41
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: typedload/2.41
homepage: "https://ltworf.codeberg.page/typedload/"

# 上游测试命令 — 上游用 **unittest**（15 个 test_*.py，无 pytest 配置）
upstream_check_command: "python3 -m unittest discover -s tests -v"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTHONPATH=<src>:<attrs-site> python3 -m unittest discover -s tests -v"

# 上游实际运行的测试程序（2026-10-04 实测记录）
# - tests/ 目录：15 个 test_*.py（全部 `import unittest`；上游无 pytest 配置）
# - 实测：**Ran 212 tests — OK**（212 passed / 0 failed / 0 error / 0 skipped）
# - 唯一第三方测试依赖：attrs（tests/test_attrload.py 顶层
#   `from attr import attrs, attrib, define, field`；test_literal.py:110、
#   test_typealias.py:25 为函数内可选导入）→ 构建期以
#   tool_requires("attrs/26.1.0") 提供（ohpcd 已发布），不传播给消费者。
# - 缺 attrs 时的对照实测：**Ran 187 tests — FAILED (errors=1)**（test_attrload
#   收集期 ImportError）→ 佐证「不为凑数跳过上游用例」，硬性以 attrs 补齐后全跑。
upstream_tests:
  - file: tests/
    source: typedload-2.41/tests/
    description: >-
      上游 unittest 套件（15 个测试文件：dataloader / datadumper / dataclass /
      attrload / datetime / deferred / dumpload / exceptions /
      legacytuples_dataloader / literal / moretypes / name_manglers /
      typealias / typechecks / typeddict）。实测 212 passed / 0 failed。
    command: "python3 -m unittest discover -s tests -v"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_typedload.py
    description: >-
      消费者测试（17 用例）：打包契约 4（pure-Python payload、py.typed/
      __init__.pyi、零运行时第三方依赖子进程核验、moretypes 版本标记）、
      上游能力 7（dataclass 往返含 hidedefault 语义、NamedTuple+Enum、容器、
      Optional/Union/Literal、TypedDict、datetime/UUID/IP/re.Pattern、
      moretypes.HexRGB）、负例 3（类型不匹配、缺字段、裸泛型必须抛
      TypedloadException）、**鸿蒙专有 3**（ohos 平台身份、OHOS
      lib/python3.12/site-packages purelib 布局、OHOS 真实路径 Path 往返）。
    command: "python3 test_typedload.py <site-packages-dir>"

# 测试断言总数（实测：17 个用例）
assertion_count: 17

# 鸿蒙特有测试用例（≥1，本包为 3）
ohos_specific_tests:
  - name: ohos_platform_identity
    description: "sys.platform==ohos、sysconfig.get_platform() 以 ohos 开头、arch=aarch64、uname 报 HarmonyOS/HongMeng"
  - name: ohos_purelib_layout_site_packages
    description: "产物必须落在 <prefix>/lib/python3.12/site-packages（OHOS python3.12 purelib 布局）且与 sysconfig purelib 约定一致"
  - name: ohos_path_roundtrip
    description: "OHOS 真实路径（/storage/Users/currentUser/*、/data/storage/el2/base/*）经 pathlib.Path 处理器 load/dump 往返"

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游 unittest 套件在 build() 内真实运行：**Ran 212 tests — OK**
  （212 passed / 0 failed / 0 error / 0 skipped，全量、无跳过、无允许失败清单）。
  套件退出码非 0（或超时 3600s）时 conan create 直接抛 ConanException，
  杜绝「测试没跑通但构建成功」。测试期第三方依赖 attrs 由
  tool_requires("attrs/26.1.0") 从 ohpcd 获取；解析失败同样显式抛错。
  test_package 消费者测试：**17/17 passed**（含 3 项鸿蒙专有断言）。
