      依赖写成 requires。
    reason: "typedload 2.41 适配实测（上游 212 passed，tool_requires attrs/26.1.0）"
  - knowledge_ref: knowledge/drafts/typedload-2.41-pure-python-conan-adaptation-pattern.kv
    category: L1
    content: >-
      typedload 语义细节（写消费者测试时的真值，实测得出）：裸泛型 list/dict/
      set/tuple（无类型参数）无法处理 → 抛 TypedloadTypeError；数值到 int/str
      会做合法转换（1.5→1、123→'123'）而非报错；Dumper 默认 hidedefault=True，
      dump 会省略等于默认值的 dataclass 字段，需要完整往返必须
      dump(..., hidedefault=False)。
    reason: "typedload 消费者测试 17 用例实测（首轮 3 处断言错误由此修正）"
