version: "2.1.4"
software: "t1ha"
status: built
build_date: "2026-09-09"
build_system: makefile

source:
  url: "https://github.com/PositiveTechnologies/t1ha/archive/refs/tags/v2.1.4.tar.gz"
  sha256: "b3bc5bf5f337559b9d6f70e6bde1dec3854eb27f2aea51a147e69383fc6b05ef"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "无 configure；显式 make 目标 libt1ha.a 或 libt1ha.so"
    - "CC/CXX 取自 profile tools.build:compiler_executables (hnp clang 15)"
  dependencies: []
  cc: clang
  cxx: clang++
  parallelism: 1

patches_applied:
  - "0001-fix-elseif-directive.patch"

knowledge_gained:
  - "t1ha 2.1.4 上游 Makefile 在 OHOS aarch64 走 portable 分支 (x86 AES-NI 对象由 TARGET_ARCH_ia32 门控编译排除)；GNU IFUNC 运行时分发仅在 ELF x86_64 默认启用，musl 平台无 IFUNC 冲突，库源码零平台补丁 (reference: archives/t/t1ha/2.1.4/notes.md)"
  - "上游 tests/main.c 的 print_build_info 含无效预处理指令 #elseif (标准 CPP 应为 #elif)，clang 按错误拒绝；一条可移植性补丁修复后完整测试套件可编译，属测试文件笔误与平台无关 (reference: archives/t/t1ha/2.1.4/patches/0001-fix-elseif-directive.patch)"
  - "prescan PSCAN-GLIBC-001 对 t1ha.h endian.h 探测链与 tests/mera.c sched_getcpu 亲和性分支的命中均为安全分支解析：musl/clang 下走 __has_include 与非 glibc 路径，无需修改 (reference: archives/t/t1ha/2.1.4/notes.md)"

validation:
  upstream_tests:
    command: "./test --test-only (make test 构建的上游测试二进制)"
    statistical_unit: "tests/main.c 的 verify() 条目 (每条目内部约 81 个参考模式探针)"
    suites: 12
    total: 12
    passed: 12
    failed: 0
    skipped: 0
    not_run: 0
  conan_create:
    command: "conan create archives/t/t1ha/2.1.4 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --build=missing"
    result: passed
  test_package:
    command: "./test_t1ha"
    assertions: 12
    harmonyos_specific_assertions: 1
    result: passed
