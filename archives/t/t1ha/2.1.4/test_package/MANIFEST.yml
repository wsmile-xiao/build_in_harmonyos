# test_package/MANIFEST.yml — t1ha 2.1.4
# Upstream and consumer test declaration required by CI L0e.

package: t1ha/2.1.4
homepage: "https://github.com/PositiveTechnologies/t1ha"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "t1ha-2.1.4.tar.gz (GitHub v2.1.4 tag archive)"
  source_sha256: "b3bc5bf5f337559b9d6f70e6bde1dec3854eb27f2aea51a147e69383fc6b05ef"
  build_system: "Makefile (raw make, upstream primary build entry)"
  test_definition: >
    Upstream test entry point is the `test` binary built by the Makefile
    (make test) and run by the upstream `make check` target. tests/main.c
    executes one verify() entry per hash implementation, printing
    "Testing <name>... Ok" and exiting non-zero on any failure. On aarch64
    OHOS the AES-NI implementations (t1ha0_ia32aes_*) and the x86 HighwayHash
    variants are compiled out (T1HA0_AESNI_AVAILABLE=0, __ia32__ undefined),
    and t1ha0 runtime dispatch resolves to t1ha1_le. Each verify() entry
    internally probes ~81 reference patterns (empty inputs with seed 0/~0,
    a 64-byte pattern under 63 single-bit seeds, 7 tail-alignment cases and
    8 long-input cases). 4 of the 12 entries verify the third-party
    comparison hashes bundled with the upstream harness (HighwayHash pure C
    and portable C++, StadtX, wyhash v7); the remaining 8 verify t1ha itself.
    patches/0001-fix-elseif-directive.patch only repairs an invalid
    `#elseif` directive in tests/main.c and does not touch test logic.
  dependency: "none (self-contained harness; third-party bench sources are vendored upstream and built with the test target)"

upstream_check_command: "make check (runs ./test)"
upstream_test_in_build: true
upstream_test_command: "./test --test-only (built by conanfile.py build() with make test)"

# Counting unit: one verify() entry in tests/main.c ("Testing <name>... Ok"
# line). Take-number command: `./test --test-only | grep -c '^Testing '`.
upstream_tests:
  - test_name: "t1ha2_atonce"
    source: "src/t1ha2.c + src/t1ha2_selfcheck.c (entries in tests/main.c)"
    kind: unit
  - test_name: "t1ha2_atonce128"
    source: "src/t1ha2.c + src/t1ha2_selfcheck.c"
    kind: unit
  - test_name: "t1ha2_stream"
    source: "src/t1ha2.c + src/t1ha2_selfcheck.c"
    kind: unit
  - test_name: "t1ha2_stream128"
    source: "src/t1ha2.c + src/t1ha2_selfcheck.c"
    kind: unit
  - test_name: "t1ha1_64le"
    source: "src/t1ha1.c + src/t1ha1_selfcheck.c"
    kind: unit
  - test_name: "t1ha1_64be"
    source: "src/t1ha1.c + src/t1ha1_selfcheck.c"
    kind: unit
  - test_name: "t1ha0_32le"
    source: "src/t1ha0.c + src/t1ha0_selfcheck.c"
    kind: unit
  - test_name: "t1ha0_32be"
    source: "src/t1ha0.c + src/t1ha0_selfcheck.c"
    kind: unit
  - test_name: "HighwayHash64_pure_c"
    source: "tests/highwayhash/pure_c.c + tests/highwayhash/verifier.c"
    kind: third-party-comparison
  - test_name: "HighwayHash64_portable_cxx"
    source: "tests/highwayhash/hh_portable.cc + tests/highwayhash/verifier.c"
    kind: third-party-comparison
  - test_name: "StadtX"
    source: "tests/stadtx/stadtx_thunk.c (entries in tests/main.c)"
    kind: third-party-comparison
  - test_name: "wyhash_v7"
    source: "tests/wyhash/wyhash_thunk.c (entries in tests/main.c)"
    kind: third-party-comparison

upstream_test_total: 12
upstream_test_passed: 12
upstream_test_failed: 0

# Compiled-out on aarch64 OHOS (not skipped at runtime; the code does not
# exist in the binary): t1ha0_ia32aes_noavx / t1ha0_ia32aes_avx /
# t1ha0_ia32aes_avx2 and HighwayHash64_sse41 / HighwayHash64_avx2 are gated
# behind T1HA0_AESNI_AVAILABLE / __ia32__ in tests/main.c.

# Consumer-perspective checks: an OHOS target-macro guard, upstream self-check
# API, cross-platform known-answer vectors (generated from pristine upstream
# sources on aarch64 macOS), streaming/one-shot 128-bit equivalence,
# determinism and seed sensitivity. Every check has a failure exit path.
test_package_tests:
  - file: test_t1ha.c
    scenario: "consumer-api"
    description: >
      Link a C consumer against the packaged library and verify the OHOS
      target macro (__OHOS__) before exercising upstream self-check across
      all enabled functions; known-answer values for t1ha2_atonce (33-byte
      vector, empty input, single byte), t1ha1_le and t1ha0_32le; t1ha2
      streaming (init/update/final) split-buffer equivalence with its
      single-part result plus the 128-bit known answer (t1ha2 stream is a
      distinct algorithm from t1ha2_atonce128); determinism and seed
      sensitivity.
    command: "./test_t1ha"
    assertions: 12

harmonyos_specific_tests:
  - test_name: "HarmonyOS native consumer target"
    source: "test_package/test_t1ha.c"
    trigger: "__OHOS__ compile-time target macro"
    description: >
      The native consumer exits non-zero unless it was compiled for the
      HarmonyOS target. This prevents a host-built consumer result from being
      counted as the OHOS package validation.
    assertions: 1

assertion_count: 12
