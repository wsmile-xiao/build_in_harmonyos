software: t1ha
display: "t1ha"
description: "Fast Positive Hash：可移植的非加密 64/128 位快速哈希函数库（t1ha0/t1ha1/t1ha2）"
category: library
homepage: "https://github.com/PositiveTechnologies/t1ha"
license: Zlib
build_system: makefile
ohos_adaptation:
  key_points:
    - "上游 raw Makefile 为主构建入口；显式 make 目标 libt1ha.a / libt1ha.so，无 configure、无 install 目标，recipe 手工拷贝 t1ha.h 与库产物"
    - "aarch64 上 Makefile 判定 Target-ARCH: portable，x86 AES-NI 对象被编译排除；t1ha.h 的 GNU IFUNC 仅在 ELF x86_64 默认启用，无 musl 冲突"
    - "上游 tests/main.c 含无效预处理指令 #elseif，以一条 tests-only 可移植性补丁修复（0001-fix-elseif-directive.patch）"
    - "上游测试二进制依赖 C++ 编译器（比较基准含 HighwayHash C++ 实现）与 libm"
  common_dependencies: []
versions:
  "2.1.4":
    status: built
    build_date: "2026-09-09"
    conan_ref: "t1ha/2.1.4"
