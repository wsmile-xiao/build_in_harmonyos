# test_package/MANIFEST.yml — trimal/1.5.1
# CI L0e 强制要求此文件存在（声明上游测试来源）。
package: trimal/1.5.1
homepage: "https://github.com/inab/trimal"

# 上游测试入口（.github/workflows/build.yml 的 test_ubuntu_x86_64 job）：
#   tar -xvf source/source_bin.tar -C source && source/trimal &&
#   ./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh
# 上游仓库没有 tests/ 目录、没有 ctest/pytest 注册，Makefile 也没有 check 目标；
# 回归测试以 dataset/ 参考比对实现：
#   generate 脚本对 84 个 dataset 比对文件 × 6 种修剪模式生成 504 个 MSA；
#   compare  脚本对每个生成结果与 dataset/trimmed_msas/<mode>/ 参考输出逐一 diff，
#            任一不同即 exit 1。
upstream_check_command: "./scripts/generate_trimmed_msas.sh && ./scripts/compare_trimmed_msas.sh"

# 已集成进 conanfile.py 的 build()：make 构建完成后立即原样执行上述两个脚本
upstream_test_in_build: true
upstream_test_command: "bash scripts/generate_trimmed_msas.sh && bash scripts/compare_trimmed_msas.sh（conanfile.py build() 内执行）"

# 实机实测（HarmonyOS PC / HongMeng Kernel 1.12 / aarch64 / clang 15.0.4）
upstream_test_result:
  total: 504
  passed: 504
  failed: 0
  skipped: 0
  not_applicable: 0
  log: "reports/upstream-tests.log（精简证据：504/504 比对结论文本 + 首尾样本；完整输出可用 run_upstream_tests.sh 重现）"
  runner: "run_upstream_tests.sh（自包含重现脚本）"

# 上游测试用例清点（84 输入 × 6 模式 = 504）
upstream_tests:
  - file: scripts/generate_trimmed_msas.sh
    source: trimal-1.5.1/scripts/generate_trimmed_msas.sh
    description: "84 个 dataset 比对输入 × 6 种修剪模式（gappyout/strict/strictplus/automated1/nogaps/noallgaps），共 504 次 trimal 调用"
    command: "bash scripts/generate_trimmed_msas.sh"
  - file: scripts/compare_trimmed_msas.sh
    source: trimal-1.5.1/scripts/compare_trimmed_msas.sh
    description: "将 504 个生成 MSA 与 dataset/trimmed_msas/ 下的上游参考输出逐一 diff，不一致即失败"
    command: "bash scripts/compare_trimmed_msas.sh"

# 补全用例（适配时新增，覆盖上游回归缺失的消费者/边界路径）
added_tests:
  - name: "缺失输入文件负向控制"
    reason: "上游脚本只覆盖正常路径；test_package 验证输入文件不存在时 trimal 以非零状态退出并打印 ERROR（防止打包后二进制静默失败）"
    command: "test.sh 断言 4-5"
  - name: "readal/statal 统计路径"
    reason: "上游回归只驱动 trimal；readal/statal 同为交付二进制，用 -info/-sgc 验证统计输出与列缺口率语义"
    command: "test.sh 断言 6-10"

# test_package 自带测试（消费者视角验证，conanrun 环境调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: "调用包内 bin/ 的 trimal/readal/statal：版本冒烟、-nogaps 自动修剪、-gt 0.6 手动阈值修剪（与手工核对过的期望输出 diff）、缺失输入负向控制、readal -info 统计、statal -sgc 列缺口率，共 10 项断言"
    command: "bash test.sh"

# 测试断言总数（消费者 10；上游 504 例由 build() 集成执行）
assertion_count: 10
