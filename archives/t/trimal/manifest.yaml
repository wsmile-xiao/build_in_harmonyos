software: trimal
display: "trimAl"
description: "多序列比对（MSA）自动化修剪工具套件（trimal/readal/statal）"
category: science
homepage: "https://github.com/inab/trimal"
license: "GPL-3.0-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 直接构建（make CC=<clang++> -j1），零源码补丁，产出 aarch64-linux-ohos 的 trimal/readal/statal"
    - "conanfile.py build() 集成上游 dataset 回归套件（84 输入 × 6 模式 = 504 用例，逐一 diff 参考输出）"
    - "test_package 提供 10 项消费者断言（版本、自动/手动修剪期望输出、负向控制、readal/statal 统计）"
  common_dependencies: []

versions:
  "1.5.1":
    status: built
    build_date: "2026-09-26"
    conan_ref: "trimal/1.5.1"
