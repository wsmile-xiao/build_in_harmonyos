software: tor
display: "Tor"
description: "Tor 匿名网络守护进程（洋葱路由客户端/中继）"
category: network
homepage: "https://www.torproject.org/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "显式 --build/--host=aarch64-unknown-linux-ohos（E007：config.guess 不识别 HarmonyOS）"
    - "config.sub 补 linux-ohos（patch 0001：KERNEL-OS 识别列表 + OS 透传列表，同 aalib 1.4p5 先例）"
    - "--with-openssl-dir/--with-libevent-dir/--with-zlib-dir=<包前缀> + CPPFLAGS/LDFLAGS 注入；configure/make/make check 加 LD_LIBRARY_PATH 前缀（TOR_SEARCH_LIBRARY link+RUN 探测）"
    - "上游自带 configure 去除 umask 077（E114：HMDFS 下 0700 临时目录不可写）"
    - "改写 configure pwd 判定为失败时回退 $PWD（HMDFS getcwd 不可达）"
    - "install shim 替换 -c 形式 install（E182/E188：HMFS install -c 失败 Error 64）"
    - "make -j1（E074：HMDFS jobserver fifo EPERM）"
    - "可选特性全关：seccomp/systemd/zstd/lzma/asciidoc（OHOS 无对应环境）"
  common_dependencies:
    - openssl
    - libevent
    - zlib

versions:
  "0.4.9.11":
    status: building
    build_date: "2026-10-03"
    conan_ref: "tor/0.4.9.11"
    source_url: "https://sources.voidlinux.org/tor-0.4.9.11/tor-0.4.9.11.tar.gz"
