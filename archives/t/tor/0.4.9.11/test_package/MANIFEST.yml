# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: tor/0.4.9.11
homepage: https://www.torproject.org/

# 上游存在官方测试套件（autotools make check 驱动 src/test/，tinytest 框架）
upstream_tests_exist: true

# 上游测试命令（make check 执行；tinytest 用例级结果汇总于各测试程序日志）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试结果持久化：build() 执行 make check 后把结果 JSON 写入
# upstream_test_result.json 并随包分发到 res/，由 test_package test() 读取并
# 复发 HMBS_UPSTREAM_TEST_RESULT 标记（真机证据门禁只采集 test_package 阶段标记，
# torsocks 2.5.0 / git-who/1.3 已验证先例）；文件缺失则显式失败，不静默通过。

upstream_tests:
  - file: src/test/
    description: "tinytest 单元测试（make check 构建并执行 src/test/test，覆盖
      crypto/container/dir/fs/hs/ipv6/net/orm/...)；用例级计数（8 个 unittest
      分区日志汇总）"
    command: "make check"

# test_package 自带的消费者测试（运行打包的 tor 二进制，4 个离线消费者用例）
test_package_tests:
  - file: test.sh
    description: "tor --version 报告 0.4.9.11；tor --verify-config 接受最小
      torrc（DataDirectory + SocksPort 0）；tor --list-torrc-options 含
      SocksPort；tor --hash-password 输出 16: 前缀哈希（运行期真实调用
      OpenSSL 完成 S2K）"
    command: "./test.sh"

assertion_count: 4
