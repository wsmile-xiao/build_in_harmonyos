# conandata.yml — ts 10.9.2 (upstream: ts-node)
# Source: https://github.com/TypeStrong/ts-node/archive/refs/tags/v10.9.2.tar.gz
# CI auto-adds mirror fallbacks, only official URL needed
# Note: recipe keeps URL/SHA256 inline in conanfile.py source() to avoid the
# conandata pre-download BUILD_DIR issue; this file documents them and stays
# the canonical place for future patch entries.

sources:
  # Multi-source list: conan 2 tries each URL in order. Public GitHub proxies
  # are intermittently reachable from CI workers (ghfast succeeded in build
  # #69652 but timed out in #69882), so we list several and let conan fall
  # back. All proxies return the byte-identical official archive
  # (SHA256 verified against github.com).
  url:
    - "https://gh-proxy.com/https://github.com/TypeStrong/ts-node/archive/refs/tags/v10.9.2.tar.gz"
    - "https://ghfast.top/https://github.com/TypeStrong/ts-node/archive/refs/tags/v10.9.2.tar.gz"
    - "https://github.com/TypeStrong/ts-node/archive/refs/tags/v10.9.2.tar.gz"
  sha256: "bc43e9d99293e81845c7362bfc6275bf0c486387bb01edb4bda7b95a713171d5"

patches: []
