# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ts/10.9.2
homepage: "https://github.com/TypeStrong/ts-node"

# 上游测试命令 (npm test = build + dprint lint + nyc ava)
upstream_check_command: "npm test"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 npm test 依赖 dprint（native lint 二进制，无 OpenHarmony 版本）与
# nyc/ava 全量套件；build 阶段只执行编译与 schema 生成，上游测试在
# 真机/shadow CI 阶段以 `npx ava` 子集方式运行（见 notes.md）。
upstream_test_in_build: false
upstream_test_command: "npm ci --ignore-scripts --legacy-peer-deps && npm run build-tsc && npx ava"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/
    source: ts-node-10.9.2/tests/
    description: "上游 ava 测试套件（tests/*.spec.js 等，需在真机执行）"
    command: "npx ava"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ts.sh
    description: "Smoke test: ts-node --version 为 10.9.2；执行带类型标注的 .ts 文件输出正确；类型错误被拒绝"
    command: "sh test_ts.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
