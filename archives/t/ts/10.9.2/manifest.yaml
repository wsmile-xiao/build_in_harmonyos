  - "npm prune --omit=dev removes peer typescript/@types/node (declared only as devDep+peer); fix by moving them into dependencies before prune"
  - "Never generate shell wrappers with str.format(): ${VAR:-...} is misparsed as a Python placeholder"
  - "Upstream npm test needs dprint (native lint binary) and nyc/ava; lint step must be skipped on OpenHarmony"
  - "npm tgz ships dist/ but no tests/; GitHub tag archive ships tests/ but no dist/ (must build)"
  - "Windows caveat: tag archive contains 2 symlinks (tests/main-realpath, website logo) that fail to extract on Windows"
