  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>（1995 configure 仅支持 --prefix）"
    - "CFLAGS=-std=gnu89 -g -O2"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-tcutil.c.patch"
  - "0002-tparam.c.patch"

knowledge_gained:
  - "1995 年 autoconf 生成的 configure 只认 --prefix，Conan Autotools.configure() 传入的 --bindir 等参数需回避，直接 sh configure --prefix=<package_folder>（同 termcap 1.3.1 先例）"
  - "老代码 #define bcopy(s,d,n) memcpy((d),(s),(n)) 必须放在 #include <string.h> 之后，否则宏污染 OHOS sysroot strings.h 的 bcopy 声明导致 conflicting types"
  - "clang 15 编译 1995 年 K&R 源码需 -std=gnu89"
  - "tcutil.c 的 restore_translations/disable_xtabs 在非 tty 时会用未初始化 termios 调 tcsetattr，需 isatty 守卫"

