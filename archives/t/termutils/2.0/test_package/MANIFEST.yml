# test_package/MANIFEST.yml — termutils 2.0
#
# 上游测试清点证据（R51 上游测试三步法）：
#   - termutils 2.0 源码树（https://ftp.gnu.org/gnu/termutils/termutils-2.0.tar.gz）
#     没有 tests/ 目录，也没有任何 *_test* / test* 源文件；
#   - Makefile.am 无 check 目标、无 TESTS 变量（grep 证据：Makefile.am 仅含
#     PROGRAMS/LIBRARIES/SOURCES 定义）；
#   - configure.in（AC_OUTPUT(Makefile)）未注册任何测试。
#   结论：上游静态测试声明总数 N_static = 0，无上游套件可执行。

package: termutils/2.0
homepage: "https://ftp.gnu.org/gnu/termutils/"

upstream_check_command: ""
upstream_check_command_note: "上游无 make check 目标（清点证据见文件头注释）"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_termutils.sh
    description: "消费者测试：以工具使用者身份执行包内 tput，断言 termcap 查询行为（co=80、li=24、未知能力非零退出）"
    command: "sh test_termutils.sh <bindir>"

assertion_count: 3
