# test_package/MANIFEST.yml — tasksh 1.2.0
# 上游测试来源声明（CI L0e 强制要求本文件存在）

package: tasksh/1.2.0
homepage: "https://taskwarrior.org/docs/tools/tasksh.html"

# ── 上游测试清点（R51 三步法 第 1 步）────────────────────────────────────
# 事实：v1.2.0 的 GitHub release 归档 tasksh-1.2.0.tar.gz **不含 test/ 目录**
#（实测 `tar tzf` 共 93 个条目，0 条匹配 test）。
# 上游 git tag v1.2.0 的 test/ 目录存在，含 2 个 .t 测试脚本
#（version.t / template.t）+ run_all 驱动 + basetest Python 模块，
# 由根 CMakeLists.txt 的 `if (EXISTS ${CMAKE_SOURCE_DIR}/test)` 守卫引入。
# 由于 release tarball 不含该目录，conan 构建里 add_subdirectory(test) 被跳过。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "test/version.t"
    source: "GothenburgBitFactory/taskshell@v1.2.0 test/version.t"
    description: "上游 Python 冒烟测试：启动 tasksh 交互会话并校验 --version 输出"
    command: "./run_all --verbose"
  - file: "test/template.t"
    source: "GothenburgBitFactory/taskshell@v1.2.0 test/template.t"
    description: "上游 Python 模板测试：校验 tasksh 交互会话的通用输入/回显行为"
    command: "./run_all --verbose"
  - file: "test/run_all"
    source: "GothenburgBitFactory/taskshell@v1.2.0 test/run_all"
    description: "上游测试驱动（Python，需 basetest 模块 + 已安装的 taskwarrior）；未随 release tarball 分发，故未纳入 conan build"
    command: "./run_all --verbose"

# 上游测试未纳入本次适配执行的理由（逐项技术原因，非"没环境"）：
#   1. test/ 不在官方 release 归档内 —— conan 的 source() 只取 release tarball，
#      CI 与本地都不可能拿到这些文件；改从 git 拉取会违反 R39（源码 URL 必须
#      官方发布源）。
#   2. test/version.t 与 test/template.t 的 shebang 是 `#!/usr/bin/env python2.7`，
#      脚本正文也按 py2 写；驱动脚本 run_all 自身兼容 py2/py3，但它用 Popen
#      直接 exec 这些 .t 文件，因此在只有 python3 的 worker 上同样跑不起来。
#   3. test 套件全程驱动交互式终端（readline/pty）并依赖已安装的 taskwarrior
#      二进制与已初始化的 TASKDATA，非 tty 管道下行为不同。
# 综上，上游测试「不可执行」，本次适配改为在 test_package 中补全等价的
# 非交互式真实测试（下方），覆盖上游测试所验证的同一批行为。

# ── 补全测试用例（test_package，消费者视角）──────────────────────────────
test_package_tests:
  - file: "test_tasksh.sh"
    description: "驱动 tasksh 交互式 REPL 的功能测试：--version 精确匹配、help 命令表、exec/! shell 逃逸、diagnostics 报告（证明静态 libreadline 已链接）、任意命令透传给 taskwarrior、EOF/exit/quit 干净退出"
    command: "bash test_tasksh.sh <tasksh_bin> [<task_bin>]"
    assertions: 12
  - file: "test_ohos.sh"
    description: "HarmonyOS 特有测试：EM_AARCH64/ELF64 三元组、PIE(ET_DYN)、DT_NEEDED 运行期依赖闭合、readline/ncurses 静态链接证明、在 OpenHarmony 目标上真实执行、man page 与许可证安装完整性"
    command: "bash test_ohos.sh <tasksh_bin>"
    assertions: 7
  - file: "runner.sh"
    description: "被上面两个脚本 source 的共用启动器：按产物 ELF 头决定直跑还是走 qemu-aarch64 + OHOS guest sysroot（-L / -E LD_PRELOAD），并滤掉宿主 x86_64 子进程加载 aarch64 shim 时产生的那一行无害 loader 告警"
    command: "source runner.sh"

# T1 --version 精确等于 1.2.0
# T2 argc!=2 时不短路进 REPL
# T3 help 输出含 Commands:/review/diagnostics/exec
# T4 exec <cmd> 执行 shell 命令并回显
# T5 !<cmd> 短形式执行 shell 命令
# T6 diagnostics 含 libreadline: 8.3 + tasksh 1.2.0 + Compliance
# T7 任意命令以 "[task <cmd>]" 形式透传
# T8（可选，需 task 在 PATH）经 tasksh 新建的任务能被 task list 读回
# T9 立即 EOF 退出码 0
# T10 quit 退出码 0
# T11 exit 退出码 0
# T12 review 分发不落入 catch-all 错误处理
# T13 平台为 OpenHarmony-*
# T14 ELF64 + EM_AARCH64
# T15 ET_DYN (PIE)
# T16 DT_NEEDED 全部可解析
# T17 readline/ncurses 不出现在 DT_NEEDED
# T18 在 OHOS 上执行 --version 成功
# T19 man page (share/man/man1/tasksh.1) 与许可证 (share/doc/tasksh/COPYING) 已安装
assertion_count: 19