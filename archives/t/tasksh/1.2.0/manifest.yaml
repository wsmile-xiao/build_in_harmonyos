# 版本级 manifest — tasksh 1.2.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.0"
software: "tasksh"
status: built
build_date: "2026-10-04"
build_system: "cmake"

source:
  url: "https://github.com/GothenburgBitFactory/taskshell/releases/download/v1.2.0/tasksh-1.2.0.tar.gz"
  sha256: "6e42f949bfd7fbdde4870af0e7b923114cc96c4344f82d9d924e984629e21ffd"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "READLINE_INCLUDE_DIR=<conan readline>/include"
    - "READLINE_readline_LIBRARY=<conan readline>/lib/libreadline.a"
    - "READLINE_ncurses_LIBRARY=<conan ncurses>/lib/libncursesw.a"
    - "CMAKE_EXE_LINKER_FLAGS=-L<conan ncurses>/lib -lncursesw"
  dependencies:
    - readline/8.3
    - ncurses/6.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 项目声明 cmake_minimum_required (VERSION 2.8) 时，用 CMakeToolchain 的 cache_variables 或 cmake.configure(variables=...) 传 CMAKE_POLICY_VERSION_MINIMUM=3.5，避免 CI 侧新版 CMake 硬报错"
  - "上游自带 FindReadline.cmake 只探测名为 ncurses 的库；本平台 ncurses 是 wide-character 静态构建（只有 libncursesw.a），静态链 readline 时必须在链接行显式补 -lncursesw，否则 tputs/tgetent 未定义"
  - "cmake/CXXSniffer.cmake 这类按 CMAKE_SYSTEM_NAME 穷举分支的平台探测模块，在 OHOS 下会落到末尾 else()；只要源码里没有对应的 #ifdef 分支就无需处理（不要为它写补丁）"