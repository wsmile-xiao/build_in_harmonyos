# 软件级 manifest — tasksh
# 遵循 ARCHIVE-SPEC v2.0

software: tasksh
display: "tasksh"
description: "Tasksh — Taskwarrior 的交互式 shell 前端，提供行编辑/历史/复盘会话，并把任意 task 命令直接透传"
category: utility
homepage: "https://taskwarrior.org/docs/tools/tasksh.html"
license: MIT
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "CMake 项目，根 CMakeLists.txt 声明 cmake_minimum_required (VERSION 2.8)；必须传 -DCMAKE_POLICY_VERSION_MINIMUM=3.5（CI 的 CMake ≥3.31 会警告，≥4.0 直接硬报错）"
    - "cmake/CXXSniffer.cmake 按 CMAKE_SYSTEM_NAME 分支匹配平台：OHOS 下 CMAKE_SYSTEM_NAME 不是 Linux，落到末尾 else() 置 UNKNOWN。源码里没有 #ifdef LINUX/#ifdef UNKNOWN 分支，只影响 cmake.h 的 #cmakedefine，无害"
    - "上游 find_package (Readline REQUIRED) + 自带 cmake/Modules/FindReadline.cmake；该模块只探测名为 readline 的库，配方用 CMakeToolchain 显式指定 READLINE_INCLUDE_DIR / READLINE_readline_LIBRARY"
    - "readline/8.3 是静态库，其光标/terminfo 符号（tputs / tgetent 等）由 ncurses 提供；FindReadline 探测的是名为 ncurses 的库，而本平台 ncurses/6.6 只产出 libncursesw.a → 必须在链接行显式补 -lncursesw"
    - "零 patch：所有适配都在 conanfile.py 的 CMakeToolchain/CMake 配置变量里完成，未改动任何上游源码"
    - "运行时依赖 task（Taskwarrior）可执行文件在 PATH 中；制品仓已有 task/2.6.2，由下游使用者自行安装"
    - "上游 release tarball 不含 test/ 目录（.gitmodules 里的 libshared 子模块已随 tarball 内联），根 CMakeLists.txt 的 add_subdirectory(test) 由 if (EXISTS) 守卫自动跳过"
  common_dependencies:
    - "readline/8.3"
    - "ncurses/6.6"

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.0":
    status: built
    build_date: "2026-10-04"