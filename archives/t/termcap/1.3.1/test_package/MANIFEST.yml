# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: termcap/1.3.1
homepage: "https://www.gnu.org/software/termcap/"

# 上游测试清点 (R51): termcap 1.3.1 源码树无任何测试资产 —— 无 tests/
# 目录、无测试源文件、无 dejagnu/ctest 注册; 上游 Makefile.in 为手写
# (非 automake), 连 `check` 目标都不存在 (grep "^check:" 计 0)。
# 上游静态用例总数: 0。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无 (上游无自动化测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 libtermcap.a 调用 tgetent/tgetnum/tgetflag/tgetstr 真实 API, 断言内联 TERMCAP 条目解析结果"
    command: "./test_termcap"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
