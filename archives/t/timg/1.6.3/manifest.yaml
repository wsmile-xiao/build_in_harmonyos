software: timg
version: 1.6.3
category: multimedia
status: built

build_system: cmake
compiler: clang
linker: GNU ld

dependencies:
  libdeflate: 1.21
  libsixel: 1.10.5

configure_options:
  - CMAKE_INSTALL_PREFIX=$HOME/usr/local
  - WITH_VIDEO_DECODING=OFF
  - WITH_VIDEO_DEVICE=OFF
  - WITH_GRAPHICSMAGICK=OFF
  - WITH_TURBOJPEG=OFF
  - WITH_RSVG=OFF
  - WITH_POPPLER=OFF
  - WITH_LIBSIXEL=ON
  - WITH_OPENSLIDE_SUPPORT=OFF
  - WITH_STB_IMAGE=ON
  - WITH_QOI_IMAGE=ON
  - TIMG_VERSION_FROM_GIT=OFF

features:
  image_loading: STB (builtin) + QOI (builtin)
  output: Libsixel 1.10.5 + half/quarter/iterm2/kitty blocks (builtin)
  compression: libdeflate 1.21
  disabled: Video, GraphicsMagick, TurboJPEG, RSVG, Poppler, OpenSlide

artifacts:
  - timg binary
  - libsixel.so dependency

source_url: https://github.com/hzeller/timg/archive/refs/tags/v1.6.3.tar.gz