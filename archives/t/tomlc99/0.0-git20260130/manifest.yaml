# ============================================================

# 版本号：上游 master-only 库（无 release tag），按仓库 git 快照惯例
# 0.0-gitYYYYMMDD（先例 asmjit 0.0-git20231115.1da9e4d）；
# 锚定的 master.tar.gz 内容日期为 2026-01-30。
version: "0.0-git20260130"

# 软件名
software: tomlc99

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-03"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39: GitHub 官方源，单一 URL，CI 自动加镜像 fallback）
  url: "https://github.com/cktan/tomlc99/archive/refs/heads/master.tar.gz"

  # 源码校验和（codeload master.tar.gz 实测）
  sha256: "f13b73073b0d749f69a3d1a1569b68ff3f0ec20d4d17c98759820583c1fb509f"

  # 压缩格式
