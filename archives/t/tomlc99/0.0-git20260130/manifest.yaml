# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-makefile-soname.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 Makefile 共享库链接规则 $(CC) -shared 不带 -Wl,-soname，任何平台产物均缺 DT_SONAME；补丁注入 libtoml.so.$(LIB_VERSION) 相对 SONAME 过 CI L5a 门禁"
  - "tomlc99 非 CMake 工程，OHOS 无 Platform/HarmonyOS.cmake 的问题不存在；手写 Makefile 场景 SONAME 必须在链接命令行显式给出（与 E383 的 CMake CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 路线互为镜像）"
  - "musl libc 对负 NaN 的 printf 显示为 -nan，glibc 2.23+ 同样；tomlc99 stdex/float6.toml 期望 nan——TOML v1.0 声明 NaN 符号编码 implementation-specific，属显示层差异，比对 harness 需归一化（草稿 DRAFT-14413）"
  - "上游 unittest/t1.c 通过 #include \"../toml.h\" 相对路径引用父目录头文件：零修改编译时把打包头文件暂存到 <build>/、把 t1.c 暂存到 <build>/upstream_unit/，相对包含即解析到打包产物（E14411 的反面：不覆盖 CFLAGS，保留上游 -std=c99 -Wall -Wextra）"
  - "toml_parse() 原地 tokenizes 输入缓冲区，消费者测试必须喂可写 char[] 而非字符串字面量"
  - "Release 配置 -DNDEBUG 会编译掉 assert()：真跑上游断言型测试须加 -UNDEBUG（上游 toml_cat.c 自身也是这么做的）"

# 产物
artifacts:
  - "include/toml.h"
  - "lib/libtoml.so.1.0（DT_SONAME=libtoml.so.1.0）+ lib/libtoml.so（开发符号链接）"
  - "lib/libtoml.a（shared=False 时）"
  - "bin/toml_cat、bin/toml_json（上游 Makefile 静态链接 libtoml.a，随包即用）"
  - "test/stdex/（62 个规范样例 + .res 期望输出，供 test_package 回归）"
