# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tomlc99/0.0-git20260130
homepage: "https://github.com/cktan/tomlc99"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# 上游无统一测试入口（Makefile 无 check/test 目标）；测试分散在四个目录：
#   unittest/  make + 直接运行（t1.c，20 断言）
#   stdex/     bash RUN.sh（62 个 *.toml → toml_cat 输出比对 *.res）
#   test1/     bash build.sh && run.sh（Go toml-test 框架 + 网络 go install）
#   test2/     bash build.sh && run.sh（git clone toml-spec-tests + jq）
upstream_check_command: "make -C unittest && unittest/t1 && (cd stdex && bash RUN.sh)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: unittest/t1.c
    source: tomlc99-master-20260130/unittest/t1.c
    description: "UTF-8 ↔ UCS 往返单元测试（toml_utf8_to_ucs/toml_ucs_to_utf8，20 个 assert）"
    command: "make -C unittest && unittest/t1"
  - file: stdex/RUN.sh
    source: tomlc99-master-20260130/stdex/RUN.sh
    description: "TOML v1.0 规范样例回归（62 个 *.toml，toml_cat 输出与 *.res 逐字节比对）"
    command: "cd stdex && bash RUN.sh"
  - file: test1/run.sh
    source: tomlc99-master-20260130/test1/run.sh
    description: "toml-lang/toml-test 官方测试套（需 Go 工具链与网络 go install，CI Worker 无 Rust/Go 生态）"
    command: "cd test1 && bash build.sh && bash run.sh"
  - file: test2/run.sh
    source: tomlc99-master-20260130/test2/run.sh
    description: "iarna toml-spec-tests（需 git clone 外部仓库 + jq 工具，网络依赖不可在 CI 内满足）"
    command: "cd test2 && bash build.sh && bash run.sh"

# 上游测试集成说明:
# conanfile.py package() 打包 bin/toml_cat + test/stdex/（62 个 *.toml + *.res）
# test_package test() 三层真跑：
#   1) consumer_test  — 消费者 API 契约测试（32 个编号 CHECK）
#   2) unittest_t1    — 上游 unittest/t1.c 字节级原样归档（sha256 与 tarball 内一致），
#                       零修改编译运行，20 个 assert 全部生效（-UNDEBUG）
#   3) stdex runner   — 打包的 bin/toml_cat 对 62 个打包样例逐一比对 *.res
#                       （与上游 stdex/RUN.sh 同构：stdout+stderr 合并捕获）
# test1（Go toml-test）与 test2（toml-spec-tests+jq）豁免：需 Go 工具链/外部仓库克隆/
# jq 工具，属 CI Worker 环境外依赖（上游 README 明示测试面，实测环境不可满足）
upstream_cases:
  total: 82
  breakdown: "unittest 1（20 断言）+ stdex 62 + test1 1 套（Go 依赖，豁免）+ test2 1 套（外部仓库+jq，豁免）"
  source_dir: "unittest/ + stdex/"
  harness: "ctest（consumer_test + unittest_t1）+ conanfile test() 内置 stdex runner（toml_cat 比对 .res）"
  coverage: "unittest/t1.c 20/20 断言 + stdex 62 样例真跑（61 字节精确 + 1 NaN 符号显示归一化，逐项定性见 notes.md）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer.c
    description: "消费者测试：全公开 API 契约（解析/表与数组遍历/类型化取值/时间戳/内省/错误路径/释放）"
    command: "./consumer_test"
  - file: upstream_unit/t1.c
    description: "上游 unittest/t1.c 字节级原样（零修改），20 个 assert"
    command: "./unittest_t1"
  - file: conanfile.py [test()]
    description: "stdex 62 样例回归 runner（打包 toml_cat × 打包样例）"
    command: "conan create test_package"

# 测试断言总数 (近似值, 用于质量评估)
# consumer.c: 32 CHECK + t1.c: 20 assert + stdex: 62 样例比对 = 114
assertion_count: 114
