# 上游官方测试声明文件
# 四个原始入口全部执行；765 个用例 ID 与输入 SHA 保留。

package: tomlc99/0git20260130
homepage: "https://github.com/cktan/tomlc99"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "unittest/t1 + stdex + test1 + test2"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python upstream_test.py <source> <pinned-fixtures> <build> --compiler <native-C-compiler> --signer <native-signer>"

# 上游实际运行的测试程序
upstream_tests:
  - "unittest/t1: 1 executable, 10 UTF-8 groups, 20 assertions"
  - "stdex: 62 exact-output fixtures"
  - "test1: 556 official TOML 1.0 inputs"
  - "test2: 146 official legacy inputs, explicit spec corrections"
upstream_inventory_count: 765

# test_package 中自带的测试 (消费者视角验证, 调用已安装库)
test_package_tests:
  - file: main.c
    description: "消费者冒烟 — toml_parse/string_in/int_in/double_in/bool_in/table_in/嵌套 string_in/free 共 8 断言"
    command: "tomlc99_smoke"

# Only the unit executable has a literal assertion denominator; corpus inputs
# use complete tagged JSON/diagnostic comparisons, not fabricated assertions.
upstream_unit_assertion_count: 20
consumer_assertion_count: 8
