# 软件级 manifest — tomlc99
# 文件位置: archives/t/tomlc99/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: tomlc99

# 显示名
display: "tomlc99 (TOML in C99)"

# 一句话描述
description: "TOML v1.0.0 compliant parser written in C99 (single toml.c + toml.h)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: data

# 官网 URL
homepage: "https://github.com/cktan/tomlc99"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "手写 Makefile 共享库规则不带 -Wl,-soname，产物缺 DT_SONAME——链接行显式注入（Makefile 侧 SONAME 方案，与 CMake 的 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 互为镜像）"
    - "unittest/t1.c 的 #include \"../toml.h\" 相对包含：暂存头文件到上一级目录实现零修改编译"
    - "Release -DNDEBUG 会编译掉 assert()，真跑上游断言需 -UNDEBUG"
    - "musl/glibc printf 对负 NaN 显示 -nan：TOML v1.0 声明 NaN 编码 implementation-specific，测试比对需显示层符号归一化"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.0-git20260130":
    status: built
    build_date: "2026-10-03"
