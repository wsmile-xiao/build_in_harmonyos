knowledge_gained:
  - "OHOS 制品仓的 openblas/blas 静态归档由 flang-ohos 工具链构建，但配方只把 flang 作为 build_requirements（tool_requires），Fortran 运行时 libFortranRuntime.a / libFortranDecimal.a 不会传给消费者：第三方链接静态 BLAS 时报 undefined symbol _FortranACharacterCompareScalar1。lapack/3.12.1 例外——它把两个运行时归档装进包内 lib 并在 cpp_info.libs 中声明，可作闭包使用"
  - "Tasmanian 的 BLAS 探测支持 -DBLAS_LIBRARIES/-DLAPACK_LIBRARIES 预置（sanity_check 中 if (NOT DEFINED BLAS_LIBRARIES) 才 find_package），因此可以用 Conan 依赖直接指定静态归档闭包，无需改上游 CMake"
  - "OHOS clang 15 能编译 -fopenmp 并链接 libomp，且 CMake FindOpenMP 报 found version 5.0；但生成的可执行文件在真机加载时报 Error loading shared library libomp.so（__kmpc_* symbol not found），Tasmanian 14 个套件中有 5 个无法运行——数值库在 OHOS 上宜默认关闭 OpenMP"
  - "Tasmanian 两种加速路径都要实测代价：BLAS 打开后 SparseGridsRefinement 套件从 13s 涨到 630s（制品仓 lapack 为 reference LAPACK，且上游 LQ 探测 zgelq_ 未命中会退回 QR）"

adaptation_paths:
  - A
