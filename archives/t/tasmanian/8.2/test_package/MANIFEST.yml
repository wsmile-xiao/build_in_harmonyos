# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: tasmanian/8.2
homepage: "https://github.com/ORNL/TASMANIAN"

# 上游是 CMake 工程，作为顶层工程时 enable_testing()，把全部回归套件注册进 ctest
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest (14 套件: SparseGrids 10 / DREAM 3 / Addons 1)"
upstream_test_count: 14
upstream_test_suites:
  - name: SparseGridsAcceleration
    command: "ctest -R SparseGridsAcceleration"
    binary: "SparseGrids/gridtest acceleration"
  - name: SparseGridsDomain
    command: "ctest -R SparseGridsDomain"
    binary: "SparseGrids/gridtest domain"
  - name: SparseGridsRefinement
    command: "ctest -R SparseGridsRefinement"
    binary: "SparseGrids/gridtest refinement"
  - name: SparseGridsGlobal
    command: "ctest -R SparseGridsGlobal"
    binary: "SparseGrids/gridtest global"
  - name: SparseGridsLocal
    command: "ctest -R SparseGridsLocal"
    binary: "SparseGrids/gridtest local"
  - name: SparseGridsWavelet
    command: "ctest -R SparseGridsWavelet"
    binary: "SparseGrids/gridtest wavelet"
  - name: SparseGridsFourier
    command: "ctest -R SparseGridsFourier"
    binary: "SparseGrids/gridtest fourier"
  - name: SparseGridsExceptions
    command: "ctest -R SparseGridsExceptions"
    binary: "SparseGrids/gridtest exceptions"
  - name: SparseGridsAPI
    command: "ctest -R SparseGridsAPI"
    binary: "SparseGrids/gridtest api"
  - name: SparseGridsC
    command: "ctest -R SparseGridsC"
    binary: "SparseGrids/gridtest c (C 接口)"
  - name: DreamAnalytic
    command: "ctest -R DreamAnalytic"
    binary: "DREAM/dreamtest analytic"
  - name: DreamModel
    command: "ctest -R DreamModel"
    binary: "DREAM/dreamtest model"
  - name: Optimization
    command: "ctest -R Optimization"
    binary: "DREAM/dreamtest optimization"
  - name: AddonTests
    command: "ctest -R AddonTests"
    binary: "Addons/addontester"

upstream_tests:
  - file: SparseGrids/gridtestUnitTests.cpp
    description: "SparseGrids 套件 1-10: 加速/域变换/细化/全局/局部/小波/傅里叶/异常/API/C 接口"
    command: "ctest -R SparseGrids"
  - file: DREAM/tasdreamUnitTests.cpp
    description: "DREAM 套件 11-13: 解析后验/模型似然/优化器"
    command: "ctest -R Dream; ctest -R Optimization"
  - file: Addons/testAddons.cpp
    description: "Addons 套件 14: 通用稀疏网格插件与 MPI 散列网格（MPI 关闭时跳过 MPI 用例）"
    command: "ctest -R AddonTests"

consumer_test_count: 1
test_package_tests:
  - file: test_tasmanian.cpp
    description: "第三方消费者视角: find_package(Tasmanian) 后构造全局网格做求积（对比上游精确值并验证两档收敛）、域变换、局部多项式插值加载/求值、C 接口头可编译可链接, 共 21 个断言"
    command: "./test_tasmanian"

assertion_count: 21
