test_package_tests:
  - file: test_tdom.tcl
    description: "完整消费者用例（rule12 端到端业务流程）：用交付的 libtdom0.9.6.so + tdom.tcl + pkgIndex.tcl 经 package require 加载，跑 XML 解析（bundled expat）→ DOM 结构与属性读写 → XPath 1.0（谓词/count/sum/string/命名空间前缀/position 谓词）→ DOM 增删改 → asXML 序列化再解析往返 → XSLT 1.0 变换 → JSON 解析 → 500 节点大文档 → 非法 XML 错误路径，21 项可核对结果"
    command: "tclsh8.6 test_tdom.tcl <package_folder>"
  - file: test_layout.py
    description: "适配自检（M=17）：TEA 布局（lib/tdom0.9.6/ 下 .so + stub + pkgIndex.tcl + tdom.tcl）、ELF ET_DYN 校验、pkgIndex 注册 0.9.6、tdom.tcl 非空壳、include/tdom.h、tdomConfig.sh、MPL-2.0 LICENSE、无 bin/（无需 commands.json）、无 usr/ 前缀、无构建中间产物、无隐藏文件（JC5）、未夹带上游 tests/"
    command: "python3 test_layout.py <package_folder>"

