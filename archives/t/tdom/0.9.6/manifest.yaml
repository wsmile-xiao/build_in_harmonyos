version: "0.9.6"
software: tdom
status: built
build_date: "2026-09-30"
build_system: autotools

source:
  url: "https://tdom.org/downloads/tdom-0.9.6-src.tgz"
  sha256: "6d24734aef46d1dc16f3476685414794d6a4e65f48079e1029374477104e8319"
  tar_format: tar.gz
  note: "上游官方站 tdom.org（TEA 扩展的标准分发方式就是这份 -src.tgz，上游没有 GitHub tag）"

build:
  system: "TEA / autotools（顶层 configure + Makefile.in，tarball 已带生成物）"
  configure_options:
    - "--with-tcl=<tcl 包内含 tclConfig.sh 的目录>"
    - "--with-tclinclude=<tcl 包>/include"
    - "--disable-html5（HTML5 需要 gumbo，仓库未发布；上游默认关闭）"
    - "tcl_cv_sys_version=Linux-6.6 / ac_cv_prog_cc_works=yes（TEA configure 缓存变量）"
  dependencies:
    - "tcl/8.6.16（唯一外部依赖；tdom 链接 tcl 的 stub 库，运行期符号由宿主 tclsh 提供）"
  bundled: "expat（configure 实测 'Using bundled expat distribution'，不需要外部 expat 包）"
  cc: clang

patches_applied:
  - file: "patches/0001-add-make-check-target.patch"
    target: "Makefile.in"
    description: >-
      TEA 上游只有 `make test`，没有 autotools 惯例的 `check` 目标；补一个
      `check: test` 别名（语义完全等同），使 `make check` 能触发同一套上游 tcltest
      套件（CI 的 L1c 门禁据此识别"上游测试真跑"）。不改任何测试内容。

test_passed: 2
test_failed: 0

test_results:
  upstream_registered: 2459
  upstream_executed: 2459
  upstream_passed: 2392
  upstream_failed: 0
  upstream_skipped: 67
  upstream_assertions: 2459
  test_package_registered: 1
  test_package_executed: 1
  test_package_passed: 1
  test_package_failed: 0
  assertion_count: 21
  adapter_self_checks: 17

knowledge_gained:
  - "tdom 是 **TEA（Tcl Extension Architecture）** 扩展的标准形态：产物是 libtdom0.9.6.so + tdom.tcl + pkgIndex.tcl，装在 lib/<pkg><ver>/ 下，由 tclsh 运行时 load；**不要**按普通共享库去链接它（消费者只需把该目录加进 auto_path）。"
  - "tdom 链接的是 tcl 的 **stub 库**（libtclstub8.6.a）：TEA 用它保证扩展能在不同 tcl 小版本/静态链接场景下加载。因此 conan 包里必须同时交付 stub .a（构建其它扩展时用得上），并让运行期符号由宿主 tclsh 提供。"
  - "TEA configure 的 `--with-tcl` 要的是**含 tclConfig.sh 的目录**；conan 的 tcl 包把 tclConfig.sh 放在 lib/ 且用 ${TCL_ROOT} 指回包目录（tcl 配方的 P1 改动），所以 --with-tcl=<pkg>/lib + --with-tclinclude=<pkg>/include 即可，不必依赖 tclConfig.sh 里可能写死的绝对路径。"
  - "⚠️ 上游 Makefile 的 `TCLSH_ENV = TCL_LIBRARY=<TCL_SRC_DIR>/library` 在 conan 场景下是坏的：tclConfig.sh 的 TCL_SRC_DIR 指向安装时已不存在的构建目录 → tclsh 会找不到 init.tcl。解法（redis 6.2 同款）：跑测试时用 `make check TCLSH_ENV=\"TCL_LIBRARY=<tcl pkg>/lib/tcl8.6\"` 覆盖。"
  - "tdom 的 upstream tcltest 套件在无头环境完全可跑：实测 Total 2459 / Passed 2392 / Failed 0（skip 67 全是 html5/Tcl9/knownBug/need_uri/nonetest/beyondBMP 这类约束跳过），是本仓库里测试证据最扎实的 Tcl 扩展之一。"
  - "上游 `make install` 走 TEA 的 install-sh：会把 exec_prefix 解析成 `/usr`（与 --prefix 不一致），导致 lib 落在 <DESTDIR>/usr/lib/...、头落在 <DESTDIR>/<prefix>/include/... → 包装时先 `make install DESTDIR=<stage>` 再按 TEA 布局显式收集（tkpng 0.9 先例），比依赖 configure 前缀更稳。"
  - "构建期两个 HMDFS/沙箱适配：① 上游 configure 里的 `umask 077` 要改成 022（E011）；② 时间戳要摆平（configure.ac/tdom.m4 = now-5，configure/Makefile.in/aclocal.m4 = now），否则 make 会误判需要 automake 重生成并报 `newly created file is older than distributed files`。"
  - "TEA 扩展的消费者用例天然是「真端到端」：tclsh + package require 会真实走 pkgIndex.tcl → tdom.tcl → dlopen(.so) → Tcl 命令注册 这条链路，比 C 侧链接测试更贴近用户实际用法（本包 21 项检查全部在交付物上完成）。"
