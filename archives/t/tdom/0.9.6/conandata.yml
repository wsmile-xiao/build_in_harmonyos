patches:
  "0.9.6":
    - patch_file: "patches/0001-add-make-check-target.patch"
      patch_description: >-
        TEA 上游只有 `make test`（跑 tests/all.tcl 的 tcltest 套件），没有 autotools
        惯例的 `check` 目标。补一个 `check: test` 别名，让 autotools/CI 流程用
        `make check` 就能触发同一套上游测试（语义完全等同，不改测试内容）。
      patch_type: "build"
