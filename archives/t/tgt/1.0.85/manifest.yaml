# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（括注 knowledge_ref: 指向知识图谱中匹配的既有条目）
knowledge_gained:
  - "OHOS 的 musl libc 未定义 glibc 的 __WORDSIZE：util.h 的 BITS_PER_LONG 与 tgtd.h 的数组维度须改用 (8 * sizeof(unsigned long))"
  - "musl 不提供 pthread_cancel()：面向 POSIX 可移植性应改为协作式退出（stop 标志 + pthread_cond_broadcast + pthread_join），并与 pthread_cleanup_push/pop 的 do/while 配对约束共存（knowledge_ref: E085）"
  - "musl 严格遵守 POSIX 的 open_memstream 语义（*bufp/*sizeloc 仅在 fflush/fclose 后发布），glibc 会提前更新 —— 依赖该行为的代码在 musl 上会得到长度 0 的缓冲区（knowledge_ref: E302）"
  - "clang 会告警 .c 文件中未使用的 static inline 函数，gcc 不会 —— 上游只测过 gcc 的包在 clang + -Werror 下需要 -Wno-unused-function（同类 knowledge_ref: E063）"
  - "OHOS 拒绝 unix domain socket bind()：HMDFS 挂载点与只读 /tmp 均不可用，tgtd 一类守护进程测试须把 IPC socket 放到 $TMPDIR 私有目录并导出 TGT_IPC_SOCKET（同类 knowledge_ref: E024）"
  - "纯 Makefile 项目无需 configure；仅 usr/ 与 scripts/ 子树参与 Conan 打包，doc/（依赖 xsltproc）与 conf/（安装到 /etc）应排除"

