# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tgt/1.0.85
homepage: "https://github.com/fujita/tgt"

# 上游测试命令
# 上游 1.0.85 没有 tests/ 目录、没有 ctest/meson 注册、顶层 Makefile 也没有
# check/test 目标（`make -n check` 输出 "No rule to make target 'check'"），
# 唯一的自动化测试入口是 scripts/tgt-core-test（bash 脚本，194 行）。
upstream_check_command: "bash scripts/tgt-core-test"

# conanfile.py build() 方法中是否已集成上游测试
# 否：上游脚本要求 tgtd 常驻并写 /var/run，OHOS/CI 沙箱内不可行，
# 因此按 R51 在适配后单独跑（见 ohos_specific_test.sh）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（唯一入口，脚本内 30+ 条 tgtadm 调用）
upstream_tests:
  - file: scripts/tgt-core-test
    source: tgt-1.0.85/scripts/tgt-core-test
    description: >-
      上游唯一自动化测试入口（bash）。步骤：启动 tgtd → 建 Target 1 →
      建 LUN1(disk)/LUN2-4(disk)/LUN5(changer) → 更新 scsi_sn/scsi_id/
      vendor_id/product_id → 两个期望失败的 mode_page（长度过长/过短）→
      合法 mode_page（0/0x1a/0x1c/0x1d/0x1e/0x1f）→ element_type 地址绑定 →
      media_home → bind -I ALL → tgtadm --op show。
      上游脚本硬编码 HOME=/d/01、依赖 `ps -ef` 自动拉起 tgtd、默认
      /var/run/tgtd/socket —— 在 OHOS 上均不可用。
    command: "bash scripts/tgt-core-test"

# test_package 中自带的测试（消费者视角）
test_package_tests:
  - file: test_tgt.sh
    description: >-
      消费者测试：tgtd/tgtadm/tgtimg 三个可执行文件的 --version/--help、
      tgtimg 磁带镜像创建+回读往返、以及无守护进程时 tgtadm 必须失败的
      反向验证（证明 IPC 代码路径真实链接执行）。6 项断言。
    command: "bash test_tgt.sh <bin_dir> <test_dir>"
  - file: ohos_specific_test.sh
    description: >-
      ★鸿蒙新增消费者用例：由上游 scripts/tgt-core-test 移植到 HarmonyOS。
      改造点：① 用 TGT_IPC_SOCKET 把 IPC 放到私有工作目录（OHOS 无可写
      /var/run）；② 显式拉起/停止 tgtd（不再依赖 `ps -ef`）；③ 数据文件
      放到调用方指定的工作目录（不再硬编码 /d/01）。
      覆盖：tgtd 启动与 IPC socket 建立、Target 创建、LUN1(disk)/LUN2(disk)/
      LUN5(changer) 创建、scsi_sn/scsi_id 与 vendor/product 更新、
      mode_page 长度过长（必须拒绝）、合法 mode_page 0、changer 五个模式页、
      element_type 数量/地址绑定/条码/media_home、bind -I ALL、
      tgtadm --op show 内容校验（IQN/LUN1/FRED00）、tgtimg 建镜像+回读、
      LUN/Target 删除、tgtd 协作式关闭（验证替代 pthread_cancel 的
      stop+join 路径能真正终止工作线程）。34 项断言。
    command: "bash ohos_specific_test.sh <bin_dir> <work_dir> <log_file>"

# 测试断言总数（test_tgt.sh 6 + ohos_specific_test.sh 34）
assertion_count: 40

# 上游用例与适配后用例的对应关系（R51 申报）
upstream_to_adapted:
  upstream_entry: "scripts/tgt-core-test"
  adapted_entry: "ohos_specific_test.sh"
  upstream_case_count: 30
  adapted_case_count: 34
  note: >-
    适配版保留上游全部语义步骤并额外覆盖 tgtimg 与 tgtd 关闭路径；
    其中 1 条上游注释期望失败（mode_page 长度过短）在 1.0.85 上实测被接受，
    已按实测行为断言并在 notes.md 记录该差异。
