# conandata.yml — tgt 1.0.85 (Linux SCSI target framework)

sources:
  # 官方归档 URL（必须是**单值**官方源，不得含任何镜像域）：
  #   * CI 的镜像回退（ci/conan/build_and_test.sh get_mirrors）只匹配
  #     ^https?://github\.com/ 且只重写 "url: <标量>" 行，镜像由 CI 自动加；
  #   * 但该回退的还原点取在改写**之后**，W3 结束后会把
  #     [gh-proxy.com/<官方>, <官方>] 留在工作区 → **每轮 W3/finish 之后
  #     必须把 url 手工改回本行单值形态**（R39/PF7 硬闸，见 notes.md 对话 #11）。
  # codeload 的 /tar.gz/refs/tags 形态与本形态产物 sha256 实测一致
  # （均 304648 B，见 notes.md 对话 #11）。
  # filename 必填：conan get() 依赖文件名判断压缩格式（否则报
  # "BadZipFile: File is not a zip file"）。
  filename: "tgt-1.0.85.tar.gz"
  url:
    - "https://gh-proxy.com/https://github.com/fujita/tgt/archive/refs/tags/v1.0.85.tar.gz"
    - "https://github.com/fujita/tgt/archive/refs/tags/v1.0.85.tar.gz"
  sha256: "b8454e06eaf6f024c1fa39de976c167c1ba7f43535bea96c3c364bd138552d8c"

patches:
  - patch_file: "patches/0001-usr-Makefile.patch"
    patch_description: "clang 对 .c 中未使用的 static inline 告警（gcc 不告警），-Werror 下中断编译；bs_sheepdog.c 有此类辅助函数"
    patch_type: "portability"
  - patch_file: "patches/0002-usr-bs.c.patch"
    patch_description: "pthread_cancel 在 musl 系 C 库不存在；改为协作式关闭（stop 标志 + cond_broadcast + join）"
    patch_type: "portability"
  - patch_file: "patches/0003-usr-bs_thread.h.patch"
    patch_description: "struct bs_thread_info 增加 stop 字段，配合 0002 的协作式线程关闭"
    patch_type: "portability"
  - patch_file: "patches/0004-usr-concat_buf.c.patch"
    patch_description: "concat_buf_init 初始化 buf/size；concat_buf_finish 显式 fflush——POSIX 下 memstream 的缓冲区与长度在 flush 前未定义"
    patch_type: "portability"
  - patch_file: "patches/0005-usr-target.c.patch"
    patch_description: "tgt_target_create 先判 targetname 为空再校验字符，避免请求体为空时解引用空指针导致 tgtd 崩溃"
    patch_type: "portability"
  - patch_file: "patches/0006-usr-tgtadm.c.patch"
    patch_description: "ipc_mgmt_req 先 flush concat buffer 再取 b->size，否则 musl 下负载长度为 0、请求体为空"
    patch_type: "portability"
  - patch_file: "patches/0007-usr-tgtd.h.patch"
    patch_description: "__WORDSIZE 是 glibc 专有宏，musl 未定义；改用 (8 * sizeof(unsigned long))"
    patch_type: "portability"
  - patch_file: "patches/0008-usr-util.h.patch"
    patch_description: "BITS_PER_LONG 由 __WORDSIZE 改为 (8 * sizeof(unsigned long))，musl 兼容"
    patch_type: "portability"
  - patch_file: "patches/0009-usr-work.c.patch"
    patch_description: "execute_work() 补 void 原型，满足 -Wstrict-prototypes（clang -Werror）"
    patch_type: "portability"
  - patch_file: "patches/0010-usr-tgtd.c.patch"
    patch_description: "signal_catch 上游为空函数（SIGTERM/SIGINT 被静默忽略，daemon 只能被 SIGKILL 杀）；改为在 SIGTERM/SIGINT 时置 system_active=0，复用 mgmt 通道同一条已验证的优雅关闭路径，使 tgtd 可被 SIGTERM 协作式停止（AI review #12277 [8]/[9]）"
    patch_type: "portability"
