software: tgt
display: "tgt"
description: "Linux SCSI target framework (TGT): user-space iSCSI/SMC target daemon (tgtd) and management tools (tgtadm, tgtimg)"
category: system
homepage: "https://github.com/fujita/tgt"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯递归 Makefile 构建，无 configure；只构建 usr（C 程序）与 scripts 两个子树，doc 需要 xsltproc、conf 安装到 /etc，均不纳入 Conan 包"
    - "musl 未定义 __WORDSIZE —— util.h 的 BITS_PER_LONG 与 tgtd.h 的数组长度改用 (8 * sizeof(unsigned long))"
    - "musl 无 pthread_cancel —— bs_thread 改为协作式关闭（stop 标志 + pthread_cond_broadcast + pthread_join）"
    - "musl 的 open_memstream 只在 fflush/fclose 时发布缓冲区与长度，导致 tgtadm 算出负载长度 0、tgtd 收到空请求体后空指针崩溃；改为先 flush 再取长度"
    - "clang 对 .c 中未使用的 static inline 告警（gcc 不告警），bs_sheepdog.c 需 -Wno-unused-function"
    - "默认特性开关（无 ISCSI_RDMA/CEPH_RBD/GLFS_BD/SD_NOTIFY）下无第三方依赖；aio 后端因 OHOS 无 <libaio.h> 自动跳过"
  common_dependencies: []

versions:
  "1.0.85":
    status: built
    build_date: "2026-09-22"
