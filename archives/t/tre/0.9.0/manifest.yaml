knowledge_gained:
  - "HMDFS setgid 环境 + autoconf umask 077 会导致临时目录不可写；修复：umask 022 + mktemp 用 $TMPDIR (ref:E097)"
  - "autotools 项目禁用 NLS：注释 AM_GNU_GETTEXT，添加 LIBINTL 空值 stubs，移除 po 子目录 (ref:E097)"
  - "dnl 注释在 AC_CONFIG_FILES 宏体内不是注释，会被注册为文件名 (ref:local)"
  - "wretest locale 限制是 OHOS 平台已知行为，4/53447 失败不影响核心功能 (ref:E099)"
  - "tre-0.9.0 tarball 不包含生成好的 configure 脚本，需要 autoreconf -fi 再加 umask 修复才能构建 (ref:E097)"
