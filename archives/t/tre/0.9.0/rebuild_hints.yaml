# Rebuild hints for tre-0.9.0 on OHOS aarch64
# This source does NOT ship with a configure script.
# Build requires autoreconf before configure.

build_system: autotools
requires_autoreconf: true
pre_configure_steps:
  - step: autoreconf
    command: "autoreconf -fi"
    description: "Regenerate configure, Makefile.in, config.h.in and auxiliary files from patched configure.ac"
  - step: umask_fix
    command: "sed -i 's/umask 077/umask 022/g' configure && sed -i 's|mktemp -d ./confXXXXXX|mktemp -d $TMPDIR/confXXXXXX|g' configure"
    description: "Fix HMDFS group-write issue: umask 077 strips group permissions, mktemp needs $TMPDIR"
configure_options: ""
post_configure_notes:
  - "OHOS lacks libintl/NLS support; NLS is disabled via configure.ac patches (AM_GNU_GETTEXT commented out, stub variables provided)"
  - "wretest will have 4/53447 failures due to missing en_US.ISO-8859-1 locale (OHOS platform limit, not a bug)"
  - "The source tarball contains only configure.ac, not a generated configure script"