# conandata.yml — trickle 1.08
# Upstream: https://github.com/mariusae/trickle (Debian 1.08+ds orig tarball,
#           repacked from git snapshot 2024-05-06; upstream has no 1.08 tag)
# License: BSD-3-Clause
#
# 说明：上游 monkey.org/GitHub 未发布 1.08 tag；1.08 版本号来自 configure.in
# AC_INIT([trickle], [1.08])，Debian 以 1.08+ds 形式从 git snapshot
# (git20240506) 重新打包。此处固定使用 Debian pool 的 orig tarball，
# 与 Debian trickle_1.08+ds-1.1 构建源一致（不含 debian/ 目录）。

sources:
  url: "https://deb.debian.org/debian/pool/main/t/trickle/trickle_1.08+ds.orig.tar.xz"
  sha256: "79163aea3a39f32c5a1619b2a532140ff7c7c18e8d4b2ed8dfbd247a9cf72f06"

patches:
  # ---- Debian 1.08+ds-1.1 series（按 debian/patches/series 顺序）----
  - patch_file: "patches/0001-debian-getopt-rename-optopt-to-optcopt.patch"
    patch_description: "Rename bundled getopt.c variable optopt to optcopt (symbol clash with libc getopt)"
    patch_type: "backport"
  - patch_file: "patches/0002-debian-add-test-c.patch"
    patch_description: "Add Debian's test.c smoke source (not wired into the build)"
    patch_type: "backport"
  - patch_file: "patches/0003-debian-trickle-c-overload-search-path.patch"
    patch_description: "trickle: use LIBDIR/trickle-overload.so directly and add -P to override the overload object path"
    patch_type: "backport"
  - patch_file: "patches/0004-debian-trickled-conf-5.patch"
    patch_description: "trickled.conf(5) documentation fixes"
    patch_type: "backport"
  - patch_file: "patches/0005-debian-fix-test-dh-compat-13.patch"
    patch_description: "Fix Debian test target under dh compat level 13 (test.c)"
    patch_type: "backport"
  - patch_file: "patches/0006-debian-fix-overload-search-path.patch"
    patch_description: "Make LIBDIR honor libdir (multilib-safe overload object location)"
    patch_type: "backport"
  - patch_file: "patches/0007-debian-drop-unknown-warning-option.patch"
    patch_description: "ax_pthread.m4: drop -Wunknown-warning-option (unsupported by clang for OHOS targets)"
    patch_type: "backport"
  - patch_file: "patches/0008-debian-gh34-misc-fixes.patch"
    patch_description: "Missing stdlib.h include in configure probes; xdr.c cast fix for libtirpc"
    patch_type: "backport"
  - patch_file: "patches/0009-debian-more-stdlib-include.patch"
    patch_description: "Add missing stdlib.h includes in remaining configure dlopen probes"
    patch_type: "backport"
  - patch_file: "patches/0010-debian-64bit-time-t.patch"
    patch_description: "xdr.c: use xdr_int64_t when _TIME_BITS == 64"
    patch_type: "backport"
  # ---- 本适配新增（OHOS 交叉编译 / 现代 autotools）----
  - patch_file: "patches/0011-cross-compile-libc-access-default.patch"
    patch_description: "Cross-compiling default: dlopen(\"libc.so\") on musl/OHOS (AC_TRY_RUN cannot run, E064 pattern)"
    patch_type: "portability"
  - patch_file: "patches/0012-modern-autotools-macros.patch"
    patch_description: "AM_CONFIG_HEADER->AC_CONFIG_HEADERS, AM_PROG_LIBTOOL->LT_INIT, AC_CONFIG_FILES (automake>=1.13 compatibility)"
    patch_type: "portability"
  - patch_file: "patches/0013-makefile-am-use-ltlibobjs-variable.patch"
    patch_description: "Use $(LTLIBOBJS) instead of @LTLIBOBJS@ (modern automake requirement)"
    patch_type: "portability"
  - patch_file: "patches/0014-configure-in-accept-shared-libevent.patch"
    patch_description: "Accept shared-only libevent installs in --with-libevent check (conan libevent ships only .so)"
    patch_type: "portability"
