software: trickle
version: 1.08
status: built        # 2026-10-02 OHOS aarch64 真机 shadow CI 通过（r23）
build_system: autotools
compile_date: 2026-10-02
conan_ref: trickle/1.08

source:
  url: "https://deb.debian.org/debian/pool/main/t/trickle/trickle_1.08+ds.orig.tar.xz"
  sha256: "79163aea3a39f32c5a1619b2a532140ff7c7c18e8d4b2ed8dfbd247a9cf72f06"
  tar_format: tar.xz
  note: >
    上游无 1.08 tag；版本号来自 configure.in AC_INIT([trickle],[1.08])。
    Debian 从 git snapshot (git20240506) 以 1.08+ds 形式 repack 并去除了
    bundled 内容。tarball 不含 configure/Makefile.in，需 autoreconf 自举。

build:
  system: autotools
  configure_options:
    - "--with-libevent=<conan-libevent-package-folder>"
  dependencies:
    - libevent/2.1.13
    - libtirpc/1.3.7
  tool_dependencies:
    - automake/1.18
    - libtool/2.5.4
    - pkgconf/3.0.6
  cc: clang
  note: >
    不使用 --enable-static/--disable-shared：trickle-overload.so 与
    libtrickle.so 是 libtool -module 共享模块（LD_PRELOAD 用），禁用
    shared 会使其无法产出。

patches_applied:
  - "0001-debian-getopt-rename-optopt-to-optcopt.patch"
  - "0002-debian-add-test-c.patch"
  - "0003-debian-trickle-c-overload-search-path.patch"
  - "0004-debian-trickled-conf-5.patch"
  - "0005-debian-fix-test-dh-compat-13.patch"
  - "0006-debian-fix-overload-search-path.patch"
  - "0007-debian-drop-unknown-warning-option.patch"
  - "0008-debian-gh34-misc-fixes.patch"
  - "0009-debian-more-stdlib-include.patch"
  - "0010-debian-64bit-time-t.patch"
  - "0011-cross-compile-libc-access-default.patch"
  - "0012-modern-autotools-macros.patch"
  - "0013-makefile-am-use-ltlibobjs-variable.patch"
  - "0014-configure-in-accept-shared-libevent.patch"

knowledge_gained:
  - "trickle 上游无 1.08 tag，1.08 版本号来自 configure.in AC_INIT；固定用 Debian 1.08+ds orig tarball 保证可重复"
  - "上游无自动化测试套件（无 tests/、make 无 check 用例），只能在 test_package 层做消费验证"
  - "configure 用 AC_TRY_RUN 探测 libc 访问方式，交叉编译必失败（E064 模式），补丁以 dlopen(\"libc.so\") 作为 musl/OHOS 默认"
  - "AM_CONFIG_HEADER 在 automake>=1.13 已移除，tarball 无预生成 configure 需 autoreconf 时必须补丁为 AC_CONFIG_HEADERS"
  - "trickle 的 LD_PRELOAD 模块必须保持 libtool -module shared 产出，配方不能传 --disable-shared"
  - "Conan 内置补丁应用器是 patch_ng（strip=1,fuzz=False）：按行号精确匹配、新文件必须 /dev/null 头，与 git apply 的上下文模糊搜索语义不同——本机可用 conan 自带 patch_ng 提前复现（省 3 轮真机）"
  - "HMDFS 上 conan 工具包脚本（aclocal/automake/configure/pkg-config）无有效执行位：解法是显式解释器序列（hnp perl 跑 aclocal/automake 真身、sh 跑 configure、TIRPC_CFLAGS/TIRPC_LIBS 绕过 pkg-config），已封装进配方回退路径"
  - "conan libevent 包仅 .so：上游 --with-libevent 硬性要求 libevent.a 需补丁放宽；conftest 运行时需显式注入 LD_LIBRARY_PATH（conanbuild 环境不含）；libtool 会被依赖包 .la 中的旧前缀误导拼出不存在路径，需删 .la"
  - "VPATH 构建下 Makefile.am 的相对 -Icompat 解析错位（sys/tree.h not found），configure 后改为绝对路径"
  - "tricklectl 的 usage() 上游为空实现（仅 exit 1 无输出），测试断言须按真实行为编写"

test_results:
  type: none
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  errors: 0
  timeout: 0
  notes: >
    上游无测试套件，无 make check 可执行用例。消费者测试（2026-10-02
    OHOS aarch64 真机执行）：case_count=5, assertion_count=13,
    passed=13, failed=0（含 L1e 破坏性反向验证确认非假测试）。
    CI 门禁：L0/L1/L4/L5 pass，L2 非阻塞 skip（CI smoke 用
    --version/--help 长选项，上游 CLI 仅 -V/-h 且 exit 1）。
    run：codex-1.08-trickle-1.08-20261001-conan-20261002-003359-49766
    exit code 0。
