# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: trickle/1.08
homepage: https://github.com/mariusae/trickle

# 上游测试命令：trickle 无自动化测试套件（无 tests/ 目录、Makefile.am
# 无 check 目标内容、.travis.yml 仅 ./configure && make），故无上游测试
# 可在 build() 中集成。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，真实执行已安装二进制)
test_package_tests:
  - file: test_trickle.py
    description: "消费者测试：trickle -V 版本入口（version 1.08, rc=1 为上游 errx 行为）、trickle/-h/无参数 usage 入口、trickled -h usage、tricklectl -h（上游 usage() 为空实现，仅 exit(1) 无输出，断言按真实行为编写）。仅参数解析入口，不启动守护进程、不执行 LD_PRELOAD 子进程、无网络流量；trickle -s 限速行为属于真机 shadow CI 阶段验证"
    command: "python3 test_trickle.py <trickle-bin> <trickled-bin> <tricklectl-bin>"

# 测试用例数与断言数 (test_trickle.py 实际统计)
case_count: 5
assertion_count: 13
