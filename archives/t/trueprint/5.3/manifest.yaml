  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-replace-replace.h.patch"
  - "0002-src-getopt.c.patch"
  - "0003-src-main.c.patch"

knowledge_gained:
  - "OHOS sysroot 的 libintl.h 是空壳（仅宏定义不声明 gettext），凡 #ifdef HAVE_LIBINTL_H 直接信任该头的代码会拿到隐式声明 gettext → 链接 undefined symbol；判定条件应同时要求 HAVE_GETTEXT"
  - "2001 年 automake 项目在无系统 gettext 的平台（OHOS）需手工把 AC_REPLACE_FUNCS 生成的 noinst libreplace.a 用 make LDADD= 覆盖链入主程序，避免改生成文件"
  - "老 autotools 项目 configure 硬性要求 lpr/lp 时，构建期 PATH 前置私有 stub 目录即可通过检测，PRINT_CMD 仅在真实打印时使用（-P/TP_PRINT_CMD 可覆盖）"
  - "musl tmpfile() 固定用 /tmp，OHOS 设备 /tmp 只读（E002）时返回 NULL；调用方需 TMPDIR 回退（mkstemp）"

