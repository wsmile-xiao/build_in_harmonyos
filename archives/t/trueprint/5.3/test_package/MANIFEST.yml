# test_package/MANIFEST.yml — trueprint 5.3
#
# 上游测试清点证据（R51 上游测试三步法）：
#   - tests/Run 为上游自带测试 runner（automake TESTS = Run），包含
#     test=1..test=49 共 49 个用例块（grep -c "^test=" Run → 49）；
#   - 每个用例以 TP_PRINT_CMD=cat 调用 src/trueprint 生成输出，与
#     tests/test<N>.out 期望文件 diff 比较；
#   - N_static = 49（tests/Run 按 test=N 块静态清点），
#     N_registered = 1（make check 注册的 runner 脚本数）。
#   设备实测（OHOS aarch64 原生，diff=/data/service/hnp/bin/diff）：
#     - 补丁后全量：49/49 passed，0 failed（make check rc=0）；
#     - 补丁前：47/49，用例 47/48（stdin 输入）因 tmpfile() 在只读 /tmp
#       返回 NULL → fileno(NULL) SIGSEGV（main.c:465，详见 notes.md），
#       已由 0003 补丁（TMPDIR 回退）修复。

package: trueprint/5.3
homepage: "https://www.gnu.org/software/trueprint/"

upstream_check_command: "make check"
upstream_check_command_note: "automake TESTS=Run；需 PATH 含 diff、环境 TP_PRINT_CMD=cat、TP_OPTS=--N；构建需 MAKEINFO=true 与 LDADD=../replace/libreplace.a"

upstream_test_in_build: false
upstream_test_command: "PATH=<diff>:$PATH make check MAKEINFO=true LDADD=../replace/libreplace.a"

upstream_tests:
  - file: tests/Run
    source: trueprint-5.3/tests/Run
    description: "49 个源码格式化用例（文件/stdin/语言/双面/页眉页脚等），输出与 test<N>.out 逐字节比较"
    command: "make check（TESTS=Run，49 原子用例）"

test_package_tests:
  - file: test_trueprint.sh
    description: "消费者测试：以工具使用者身份执行包内 trueprint，断言版本标识、C 文件格式化输出 PostScript、stdin（TMPDIR 暂存）格式化输出 PostScript"
    command: "sh test_trueprint.sh <bindir> <sample.c> <spool-dir>"

assertion_count: 3
