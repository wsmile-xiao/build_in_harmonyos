software: tree-sitter
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.25.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.25.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-21"

# 构建系统类型（顶层字段，供 submit 自检）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v0.25.0.tar.gz"

  # 源码校验和
  sha256: "3729e98e54a41a4c03f4f6c0be580d14ed88c113d75acf15397b16e05cf91129"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: makefile

  # 产物类型（库文件）
  product_type: library

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "tree-sitter 使用纯 Makefile 构建，无需 configure"
  - "库文件产物：libtree-sitter.a（静态）+ libtree-sitter.so（共享）"
  - "测试套件需要 Rust/cargo 环境，跳过测试不影响核心功能"
  - "pkg-config 文件由 Makefile 自动生成"
  - "版本号嵌入到共享库 soname（libtree-sitter.so.0.25）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
