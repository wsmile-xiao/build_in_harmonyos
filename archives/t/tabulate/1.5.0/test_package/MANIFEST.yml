# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: tabulate/1.5.0
homepage: "https://github.com/p-ranav/tabulate"

# 上游测试：tabulate 1.5.0 无 tests/ 目录、无 ctest 注册（option
# tabulate_BUILD_TESTS 声明但未接线任何测试 target），唯一可运行程序为
# samples/ 下 19 个示例（employees/markdown_export/unicode 等）。
# conanfile.py build() 构建 3 个代表示例 + 运行 employees 作为冒烟验证。
upstream_check_command: "cmake -DSAMPLES=ON . && cmake --build . --target employees markdown_export unicode && ./employees"

# conanfile.py build() 方法中已集成上游示例构建与运行
upstream_test_in_build: true
upstream_test_command: "./employees"

# 上游实际运行的测试程序（示例）
upstream_tests:
  - file: samples/employees.cpp
    source: tabulate-1.5.0/samples/employees.cpp
    description: "上游示例：构建雇员表并渲染（含列格式化），退出码 0"
    command: "./employees"
  - file: samples/markdown_export.cpp
    source: tabulate-1.5.0/samples/markdown_export.cpp
    description: "上游示例：Markdown 导出（构建验证）"
    command: "cmake --build . --target markdown_export"
  - file: samples/unicode.cpp
    source: tabulate-1.5.0/samples/unicode.cpp
    description: "上游示例：Unicode 内容渲染（构建验证）"
    command: "cmake --build . --target unicode"

# test_package 中自带的测试（消费者视角验证 + HarmonyOS 专项断言）
test_package_tests:
  - file: test.cpp
    description: "消费者+HarmonyOS 专项测试：Table 构造/add_row/列格式化渲染断言 + MarkdownExporter 导出断言"
    command: "./test_tabulate"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 9