  url: "https://codeload.github.com/p-ranav/tabulate/tar.gz/refs/tags/v1.5"

  # 源码校验和
  sha256: "16b289f46306283544bb593f4601e80d6ea51248fde52e910cc569ef08eba3fb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DSAMPLES=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

