# 版本级 manifest 模板
# 文件位置: archives/t/tabulate/1.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.0"

# 软件名
