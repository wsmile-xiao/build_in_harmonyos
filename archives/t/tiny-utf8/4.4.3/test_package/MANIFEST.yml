# test_package/MANIFEST.yml — tiny-utf8 4.4.3
# 上游官方测试声明文件 (L0e)
# 详见: docs/TEST_QUALITY_SPEC.md

package: tiny-utf8/4.4.3
homepage: "https://github.com/DuffsDevice/tiny-utf8"

# 上游测试入口: CMake + GoogleTest (test/CMakeLists.txt, gtest_discover_tests)
upstream_check_command: "ctest --test-dir build -N"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/tinyutf8_test, 由 test/CMakeLists.txt 构建)
upstream_tests:
  - file: test/src/test_construction.cpp
    source: tiny-utf8-4.4.3/test/src/test_construction.cpp
    description: "构造/复制/赋值测试 (GTest TEST_CASE, 独立上游用例)"
    command: "./tinyutf8_test"
  - file: test/src/test_conversion.cpp
    source: tiny-utf8-4.4.3/test/src/test_conversion.cpp
    description: "编码转换测试 (GTest TEST_CASE, 独立上游用例)"
    command: "./tinyutf8_test"
  - file: test/src/test_iterators.cpp
    source: tiny-utf8-4.4.3/test/src/test_iterators.cpp
    description: "迭代器/码点遍历测试 (GTest TEST_CASE, 独立上游用例)"
    command: "./tinyutf8_test"
  - file: test/src/test_manipulation.cpp
    source: tiny-utf8-4.4.3/test/src/test_manipulation.cpp
    description: "字符串操作/子串测试 (GTest TEST_CASE, 独立上游用例)"
    command: "./tinyutf8_test"
  - file: test/src/test_noexceptions.cpp
    source: tiny-utf8-4.4.3/test/src/test_noexceptions.cpp
    description: "noexcept 属性测试 (GTest TEST_CASE, 独立上游用例)"
    command: "./tinyutf8_test"
  - file: test/src/test_search.cpp
    source: tiny-utf8-4.4.3/test/src/test_search.cpp
    description: "查找/搜索测试 (GTest TEST_CASE, 独立上游用例)"
    command: "./tinyutf8_test"

# test_package 中自带的测试 (消费者视角验证, 调用真实公开 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 构造/码点长度/迭代/编解码往返/子串/比较"
    command: "./test_tiny-utf8"

# 测试断言总数 (GTest 用例 + 消费者断言近似值, 用于质量评估)
assertion_count: 200