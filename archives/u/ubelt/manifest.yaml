# 软件级 manifest — ubelt
# 遵循 ARCHIVE-SPEC v3.0

software: ubelt
display: "ubelt"
description: "ubelt — A Python utility belt（纯 Python 工具库，零强制运行时依赖）"
category: library
homepage: "https://github.com/Erotemic/ubelt"
license: Apache-2.0
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python noarch 包（py3-none-any，59 个 .py，无 C 扩展）——无编译、
      零强制依赖（install_requires 取自空的 requirements/runtime.txt），
      package_type=python-require，ubelt/ 包目录拷贝到 site-packages"
    - "OHOS Python 3.12 报告 sys.platform=='ohos'；ubelt.util_platform 按
      'posix' in sys.builtin_module_names 取 POSIX 分支，遵循运行时注入的
      XDG_CACHE_HOME（应用沙箱 /data/storage/el2/...），无需源码补丁"
    - "上游测试 pytest+xdoctest 真机实测 548 passed / 17 failed / 43 skipped；
      17 项失败均为平台环境限制（posix_spawnp 无 PATH 查找 15 项、无 passwd 记录 2 项）"

versions:
  "1.4.0":
    status: built
    build_date: "2026-10-04"
    conan_ref: "ubelt/1.4.0"
