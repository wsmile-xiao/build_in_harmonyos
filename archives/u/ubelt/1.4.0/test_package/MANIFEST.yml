# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: ubelt/1.4.0
homepage: "https://github.com/Erotemic/ubelt"

# 上游测试命令（pytest + xdoctest；来自 pyproject.toml [tool.pytest.ini_options]
# addopts 与 .github/workflows/tests.yml）
upstream_check_command: "python3 -m pytest -p no:doctest --xdoctest --xdoctest-style=google ubelt tests"

# conanfile.py build() 中是否集成了上游测试（纯 Python 包，包阶段不编译，
# 上游测试在适配阶段的真机环境实测，见 notes.md）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试（2026-10-04 OHOS 真机实测）
upstream_tests:
  - file: tests/test_*.py
    source: ubelt-1.4.0/tests/（25 个文件，244 个 def test_ 用例）
    description: "上游 pytest 套件（25 个测试文件）+ ubelt/*.py 内 xdoctest 用例；实测 548 passed / 17 failed / 43 skipped（17 项失败均为 OHOS 环境限制：15 项 posix_spawnp 无 PATH 查找、2 项无 passwd 记录）"
    command: "python3 -m pytest -v -p no:doctest --xdoctest --xdoctest-style=google ubelt tests"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_ubelt.py
    description: "消费者 API 测试：hash_data/dzip/dict_isect/peek/flatten/take/Path 真实文件读写（R34）"
    command: "python3 test_ubelt.py <site-packages>"
  - file: test_ohos_ubelt.py
    description: "鸿蒙特有测试：sys.platform=='ohos'、util_platform POSIX 分派、XDG 沙箱 appdir、沙箱可写"
    command: "python3 test_ohos_ubelt.py <site-packages>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 22
