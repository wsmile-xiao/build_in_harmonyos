software: util-linux-login
display: "util-linux login"
description: "PAM-based login(1) program and nologin shell from the util-linux suite"
category: system
homepage: "https://github.com/util-linux/util-linux"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Builds only login and nologin from the full util-linux suite (--disable-all-programs --enable-login --enable-nologin)."
    - "Hard dependency on linux-pam for PAM authentication (libpam + libpam_misc)."
    - "config.guess needs OHOS detection patch; config.sub v2.42.2 already supports linux-ohos* natively."
    - "login requires utmpx and GNU utmpx extensions; may need adaptation if musl utmpx differs."
  common_dependencies:
    - "linux-pam/1.7.2"

versions:
  "2.42.2":
    status: prepared
    build_date: "2026-08-27"
    format: conan
    note: "Pre-recipe complete. Pending linux-pam publication to ohpcd and real-device verification."
    issue: ""
