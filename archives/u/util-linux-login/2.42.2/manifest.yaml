software: util-linux-login
version: "2.42.2"
status: prepared
build_system: autotools
build_date: ""
issue: ""

source:
  url: "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
  sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
  tar_format: tar.xz

build:
  system: autotools
  options:
    - "--disable-all-programs"
    - "--enable-login"
    - "--enable-nologin"
    - "--with-pam"
    - "--without-systemd"
    - "--without-selinux"
    - "--without-audit"
    - "--disable-bash-completion"
    - "--disable-nls"

dependencies:
  runtime:
    - "linux-pam/1.7.2"
  build_tools:
    - "autotools: autoconf/automake/libtool from OHOS worker environment"

disabled_optional:
  - systemd
  - selinux
  - audit
  - cap-ng
  - utempter
  - plymouth
  - bash-completion
  - NLS/gettext

patches:
  - "0001-config-guess-ohos-detection.patch"

platform_requirements:
  - "PAM authentication framework (libpam, libpam_misc)"
  - "utmpx support"
  - "POSIX terminal I/O"

verification:
  local:
    - "Downloaded util-linux-2.42.2.tar.xz from cdn.kernel.org, verified sha256"
    - "Inspected configure.ac for login build requirements (PAM, utmpx)"
    - "Verified config.sub already contains linux-ohos* and ohos* patterns"
    - "Created config.guess patch for HarmonyOS detection"
    - "Prepared Conan Autotools recipe with linux-pam/1.7.2 dependency"
    - "Prepared non-empty test_package checking login and nologin binaries"
  not_run_locally:
    - "conan create: requires linux-pam to be published to ohpcd remote"
    - "conan create: requires OHOS cross-compilation toolchain"
  ohos_real_device:
    - "pending"

blocking:
  - "linux-pam/1.7.2 must be published to ohpcd remote before conan create can resolve the dependency"
  - "linux-pam issue: #1765"

next_commands:
  publish_dependency:
    - "conan export archives/l/linux-pam/1.7.2  # if not yet exported locally"
  local_create:
    - "conan create archives/u/util-linux-login/2.42.2 --profile:build=default --profile:host=ohos-aarch64"
  real_device_or_shadow_ci:
    - "CI_PACKAGES=\"archives/u/util-linux-login/2.42.2\" zsh ci/conan/build_and_test.sh"
    - "/path/to/run-ohos-shadow-ci.sh archives/u/util-linux-login/2.42.2"
