sources:
  "2.42.2":
    url: "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
    sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
patches:
  - patch_file: "patches/0001-config-guess-ohos-detection.patch"
    patch_description: "Add HarmonyOS detection to config.guess for OHOS cross-compilation"
    patch_type: "portability"
  - patch_file: "patches/0002-login-guard-updwtmpx-with-HAVE_UPDWTMPX.patch"
    patch_description: "Guard updwtmpx calls with HAVE_UPDWTMPX for musl libc compatibility"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-allow-login-without-gnu-utmpx.patch"
    patch_description: "Allow login to build without GNU utmpx functions (updwtmpx) on musl libc"
    patch_type: "portability"
  - patch_file: "patches/0004-login-declare-utmpx-functions-for-OHOS.patch"
    patch_description: "Provide no-op stubs for utmpx/vhangup and declare getusershell family in login.c (and shells.h/lib/shells.c) for OHOS musl, since login.c only includes shells.h under libeconf (disabled on OHOS)"
    patch_type: "portability"
