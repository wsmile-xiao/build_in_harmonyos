# test_package/MANIFEST.yml
# Test declaration for util-linux-login Conan L1 consumer verification.

package: util-linux-login/2.42.2
homepage: "https://github.com/util-linux/util-linux"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
# Note: util-linux upstream has login-related tests in tests/ts/login/
# but they require PAM configuration and a real terminal to run.
# These are not suitable for Conan test_package execution.

test_package_tests:
  - file: conanfile.py
    description: "Consumer test: verify login and nologin binaries exist and are loadable"
    command: "conan test_package verifies binary existence and --help execution"

assertion_count: 2
