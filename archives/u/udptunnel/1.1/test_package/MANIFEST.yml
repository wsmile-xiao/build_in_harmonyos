# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e compliance

package: udptunnel/1.1
homepage: "https://www1.cs.columbia.edu/~lennox/udptunnel/"

# Upstream test inventory (R51): the 1.1 tarball (14 files) ships no test
# suite - no tests/ directory, no check_PROGRAMS/TESTS in Makefile.am, no
# dejagnu/autotest scaffolding; Makefile.am only declares bin_PROGRAMS.
# automake's implicit `check` target therefore has nothing to run.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# Consumer-side tests in test_package (CLI contract layer; the tunnel data
# plane needs a live UDP/TCP topology and cannot run headlessly)
test_package_tests:
  - file: test.c
    description: "Consumer test: packaged udptunnel binary runs and honors --help (exit 0)"
    command: "./test_udptunnel"

# test(): 1) udptunnel --help exit 0; 2) usage banner on stdout; 3) no-args exits 2
assertion_count: 4
