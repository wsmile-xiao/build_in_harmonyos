software: unzoo
status: built
build_date: "2026-09-20"
build_system: makefile

source:
  url: "https://archive.debian.org/debian/pool/main/u/unzoo/unzoo_4.4.orig.tar.gz"
  sha256: "977bb2147a52370d3fce87947f66ea18eb927654d732f685d977a1f68ac35ef6"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make   # GNUmakefile（本仓库补丁新增；上游分发无任何构建文件）"
    - "-DSYS_IS_UNIX -DSYS_HAS_MKDIR（上游注释给出的 UNIX 构建宏）"
  dependencies: []

patches_applied:
  - "patches/0001-unzoo-unix-portability.patch"
  - "patches/0002-add-GNUmakefile.patch"

knowledge_gained:
  - "上游原始下载地址 archives.math.utk.edu/.../unzoo.c 已失效（HTTP 502/000，2026-09-20 实测）。Debian 的 unzoo_4.4.orig.tar.gz 是 pristine 上游打包（内含单个 unzoo.c，115328 字节，2002-05-06），与 packager 引用的原始文件同源且不带 Debian 补丁，可作为可信替代源——本仓库 cauchy/libpipeline 已有同类先例"
  - "unzoo.c 的 SYS_IS_UNIX 分支只 include 了 <stdio.h>，却调用 strcpy/strcat/malloc/mkdir/utime/chmod —— 6 个隐式声明。GCC 14+ 把 -Wimplicit-function-declaration 变成 error，C23 正式删除该语法，不补 <stdlib.h>/<string.h>/<sys/types.h>/<sys/stat.h>/<utime.h>/<unistd.h> 就编不过"
  - "SETF_TIME 在 UNIX 分支把 'unsigned int Secs[2]' 直接当 utime() 的第二参数，依赖 V7 原型。POSIX utime() 收 struct utimbuf*，LP64 上 time_t 是 64 位而 unsigned int 是 32 位 → utime() 从 8 字节对象读出 16 字节、写入错误时间戳。改为真正的 struct utimbuf（与 OS2_EMX 分支写法一致）"
  - "zoo 归档目录遍历靠 posnxt == 0 的结束项终止，不是靠 EOF（unzoo.c:2392-2398）；缺它必然报 'found bad directory entry'"
  - "zoo 目录项 majver=2 且 minver>1 会被判 'unknown method, you need a later version'（unzoo.c:2570）"
  - "zoo 的成员 CRC 是反射 CRC-16（poly 0xA001、初值 0、无末尾异或），与 unzoo.c 的 CRC_BYTE 宏一致；unzoo 打印 'extracted' 即代表 CRC 校验通过"
  - "unzoo.c:1481 'BlckReadArch(Descript.text,20L); Descript.text[20]=\\0;' 对 char text[20] 写越界一字节（上游既有缺陷，落在同一结构体的下一个字段上）。本配方不修改，仅记录"

