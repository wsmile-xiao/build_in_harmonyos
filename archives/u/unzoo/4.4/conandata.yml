# conandata.yml — unzoo 4.4
#
# unzoo 4.4 is a single public-domain C file.  Its original host,
#   http://archives.math.utk.edu/software/multi-platform/gap/util/unzoo.c
# (the URL every downstream packager still cites), has been down since at least
# 2026-09-20 — it answers HTTP 502/000.  The file itself is byte-identical to
# the upstream one as repackaged by Debian in unzoo_4.4.orig.tar.gz, which is
# Debian's pristine-upstream tarball (a single unzoo.c, 115328 bytes, dated
# 2002-05-06).  That is the source used here; it carries no Debian patches.
# The same fallback is already used elsewhere in this repository for upstreams
# that have gone away (e.g. cauchy, libpipeline).

sources:
  url: "https://archive.debian.org/debian/pool/main/u/unzoo/unzoo_4.4.orig.tar.gz"
  sha256: "977bb2147a52370d3fce87947f66ea18eb927654d732f685d977a1f68ac35ef6"

patches:
  - patch_file: "patches/0001-unzoo-unix-portability.patch"
    patch_description: >-
      two fixes required by the SYS_IS_UNIX branch on a modern 64-bit target:
      add the six system headers the code calls functions from but never
      includes (<stdlib.h>, <string.h>, <sys/types.h>, <sys/stat.h>,
      <utime.h>, <unistd.h>) — every one of those calls was an implicit
      declaration, which GCC 14+ and C23 reject outright; and replace the
      "unsigned int Secs[2]" passed straight to utime() with a real
      struct utimbuf, because time_t is 64-bit on LP64 while unsigned int is
      32, so utime() read 16 bytes out of an 8-byte object
    patch_type: "portability"
  - patch_file: "patches/0002-add-GNUmakefile.patch"
    patch_description: >-
      add GNUmakefile: the distribution contains no build file at all, only
      the header comment "cc -o unzoo -DSYS_IS_UNIX -O unzoo.c".  This adds
      the equivalent GNU make rule and takes the compiler and flags from the
      Conan toolchain environment
    patch_type: "portability"
