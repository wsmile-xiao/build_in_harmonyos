# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（unzoo 4.4，pristine 源码实测）：
#
#   upstream_test_targets = 0
#   upstream_test_files   = 0
#   upstream_case_total   = 0
#
# 依据（可逐条核对）：整份分发就是一个 115328 字节的 unzoo.c（另外只有源码
# 头部注释里的构建指示 "cc -o unzoo -DSYS_IS_UNIX -O unzoo.c"）。
# 没有测试目录、没有测试数据、没有 check/test 目标、没有断言代码。
# 是**确认的 0**，不是 UNKNOWN。

package: unzoo/4.4
homepage: "https://sources.debian.org/src/unzoo/"

upstream_tests_exist: false
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# 我们补的验证：真实 zoo 归档往返（不是"能启动就算过"）
test_package_tests:
  - file: test_package/conanfile.py
    description: >-
      test() 内用 Python 现场构造一个符合 zoo 规范的归档（42 字节归档描述符 +
      1 个目录项：stored 成员 + CRC-16 + posnxt 结束项），然后：① `unzoo -l`
      必须列出该成员且不报 "bad directory entry"；② `unzoo -x` 必须报
      "extracted" 且不出现 "CRC failed"（unzoo 只在成员 CRC-16 与目录项记录的
      值一致时才打印 extracted，因此这一条同时覆盖 CRC 校验路径）；
      ③ 解出的字节必须与原始 payload 逐字节相同。
    command: "unzoo -l good.zoo / unzoo -x good.zoo"

# 格式踩坑记录（第一版生成器逐条撞出来，均已实测复现）：
#   1. 目录遍历直到读到 posnxt == 0 的项才结束 —— 少了这个结束项，unzoo 会报
#      "found bad directory entry in archive"（即便成员本身完全正确）。
#   2. majver=2 且 minver>1 的项被拒绝为 "unknown method, you need a later
#      version"（unzoo.c:2570），故 minver 必须写 0。
#   3. 多字节字段是小端（WordReadArch 把第 0 字节放进 bit 0-7）。
#   4. CRC 是反射 CRC-16（poly 0xA001，初值 0，无末尾异或）；实现后由 unzoo
#      自己打印的 "extracted" 反证正确。
#   5. type != 2 的目录项没有变长部分，固定 51 字节。

assertion_count: 3
