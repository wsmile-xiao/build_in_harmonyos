# urlview-ng 软件级 manifest
# 文件位置: archives/u/urlview-ng/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: urlview-ng

description: |
  URL extractor and launcher for terminal applications.
  Extracts URLs from text and provides interactive selection menu.

category: utilities
license: GPL-2.0-or-later

# 版本索引
versions:
  1e:
    status: built
    date: "2026-06-03"
    build_system: makefile
    dependencies:
      - ncursesw/6.5
      - libintl/0.21

homepage: https://git.sr.ht/~nabijaczleweli/urlview-ng
source_url: http://ftp.debian.org/debian/pool/main/u/urlview/

keywords:
  - url
  - extractor
  - launcher
  - terminal
  - ncurses