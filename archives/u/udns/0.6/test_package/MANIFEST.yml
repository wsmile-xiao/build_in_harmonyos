# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: udns/0.6
homepage: "https://www.corpit.ru/mjt/udns.html"

# 上游测试命令: udns 0.6 源码包不存在任何测试目标，无独立 check 命令可声明
# （详细审计结论见 upstream_test_audit）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件审计结论:
# udns 0.6（官方 udns-0.6.tar.gz，2024-07-26 发布，sha256
# 696a2d0d...01c6e8）为自研 autoconf 风格工程：
#   - Makefile.in 目标仅含 all/static/staticlib/shared/sharedlib/dist/subdist/
#     clean/distclean/depend 及三个示例工具（dnsget/rblcheck/ex-rdns）的构建规则，
#     grep 全文确认无 check / test / TESTS / check_PROGRAMS 等测试目标；
#     `make -n check` 报 "No rule to make target `check'"。
#   - 源码包无 tests/ 或 test* 目录、无 gtest/cunit/tap 等测试框架，也无 CI 配置。
#   - 上游 configure(configure.lib) 只做编译/链接探测（conftest），不构成测试套件。
# 结论：上游确实没有任何自动化测试，status=no_tests 如实上报。
# 库的功能正确性（域名/DN 编解码、IP 地址转换、错误码映射、context 初始化）由
# test_package 对 libudns.a + udns.h 的实际 API 调用验证覆盖。
upstream_tests_exist: false
upstream_test_audit:
  - path: "Makefile.in"
    finding: "上游 Makefile 目标仅含 all / static / staticlib / shared / sharedlib / dist / subdist / clean / distclean / depend 及示例工具构建规则；grep 全文确认无 check、test、TESTS、check_PROGRAMS 等测试目标，`make -n check` 报 'No rule to make target'。无 install 目标，配方需手动打包产物。"
  - path: "configure / configure.lib"
    finding: "自研 autoconf 风格配置脚本，仅做 C 编译器、socket/inet_pton/ipv6/poll 等编译链接探测（conftest）用于生成 config.h；这些探测属于构建期特征检测，不构成自动化测试用例。configure 不识别 --prefix 等 GNU autoconf 选项，仅接受 --enable/--disable-ipv6 与 --help。"
  - path: "源码包整体（udns-0.6.tar.gz，2024-07-26）"
    finding: "无 tests/ 目录、无测试脚本、无 gtest/cunit/tap 测试框架、无 CI 配置（无 .github/workflows 等）；上游为纯自定义 Makefile 工程，功能正确性由 test_package 对 libudns.a 的实际 API 调用（dns_init/dns_version/dns_sptodn/dns_dntosp/dns_dnlen/dns_dnlabels/dns_dnequal/dns_pton/dns_ntop/dns_strerror）做实质验证覆盖。"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libudns.a 并调用真实 API，覆盖 11 项离线确定性断言——dns_init(NULL,0) 初始化返回 0、dns_version() 非空、dns_sptodn/dns_dntosp 域名往返一致、dns_dnlen/dns_dnlabels 标签解析、dns_dnequal 大小写不敏感相等、dns_dntop ASCII 输出、dns_pton/dns_ntop IPv4 往返一致、dns_strerror 错误码映射非空"
    command: "./test_udns（由 test_package/conanfile.py test() 经 self.run 实际执行并统计通过/失败断言数）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
