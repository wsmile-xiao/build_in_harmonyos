# 版本级 manifest — udns 0.6
# 文件位置: archives/u/udns/0.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一输入，本文件为交叉校验元数据）

# ============================================================
# 必须字段
# ============================================================

version: "0.6"
software: "udns"

# 编译状态: published | built | failed | archived
# 本地 gcc 编译 + test_package 11 项断言已通过；真机预检通过后由流程更新。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "autotools (自研 configure)"
conan_ref: "udns/0.6"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://www.corpit.ru/mjt/udns/udns-0.6.tar.gz"
  # 源码校验和（与 conandata.yml 一致）
  sha256: "696a2d0d518da985d975a65e11d166f3f57cdbd1d42376a0b85307f49601c6e8"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # udns 自研 configure 不接受 --prefix 等 GNU autoconf 标准选项，仅支持
  # --enable/--disable-ipv6 与 --help，故配方在源码目录内就地构建
  # （configure + make staticlib），package() 手动打包 libudns.a 与 udns.h。
  configure_options:
    - "--enable-ipv6"
  dependencies: []
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "R33: udns 自研 configure 用 $CC/$CFLAGS 环境变量探测编译器，配方通过 AutotoolsToolchain 生成的 conanbuild env 提供编译器，不在 self.run() 中用裸 ${CC}"
  - "udns configure 不接受 GNU autoconf 的 --prefix/--host 等选项，不能用 Autotools(self).configure()，须手动就地运行 configure + make"
  - "udns Makefile 无 VPATH 支持（SRCS 为裸文件名），且无 install 目标，须就地构建并由 package() 手动 stage 产物"
  - "上游无任何测试套件（无 check/test 目标、无 tests/ 目录），test_package 承担实质性消费者验证（11 项断言）"

# ============================================================
# 补丁生成元数据（refresh-patch 生成）
# ============================================================

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
