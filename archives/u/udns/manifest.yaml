# 软件级 manifest — udns
# 文件位置: archives/u/udns/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: udns
display: "udns"
description: "小型异步/同步 stub DNS 解析库（libudns）——支持同步与异步 DNS 查询，解析常见 RR 类型（A/AAAA/PTR/MX/TXT/SRV/NAPTR/DNSBL/RHSBL 等）"
category: network
homepage: "https://www.corpit.ru/mjt/udns.html"
license: LGPL-2.1-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "自研 configure 不接受 GNU autoconf 的 --prefix/--host 等选项，只能就地构建（configure + make staticlib），不能用 Autotools(self).configure()"
    - "编译器由 AutotoolsToolchain 的 conanbuild env 提供，self.run() 不裸用 ${CC}（R33）"
    - "Makefile 无 VPATH 支持、无 install 目标，package() 手动 stage libudns.a 与 udns.h"
    - "上游无测试套件，test_package 承担消费者视角实质性验证（三层：CMakeDeps 消费者 / 裸静态链接消费者 / 鸿蒙端到端解析闭环）"
    - "\u2605 0.5 专属：上游 configure 的 inet_pton()/inet_ntop() 探测程序原型错误（long* 传给 const char*、const char* 当 int 返回），clang 下探测必然失败且 configure 仍返回 0；config.h 因此缺 HAVE_INET_PTON_NTOP，udns_XtoX.c 走 `#define inet_XtoX_prefix udns_` 回退，libudns.a 导出 udns_pton()/udns_ntop() 而非头文件声明的 dns_pton()/dns_ntop()，任何消费者链接必然失败。须以补丁回移 0.6 的修正探测体；0.6 上游已自行修复"
    - "编译探测失败不总是『功能不可用』，也可能是探测程序自身写错：看 configure 退出码为 0 不够，必须核对生成的 config.h 宏与最终归档符号表是否与公开头文件一致"
    - "0.5 与 0.6 存在真实 API 差异：dns_dntop() 0.5 返回 int（0.6 返回 const char*）；dns_ntop() 末参数 0.5 为 int（0.6 为 unsigned）；dns_free() 0.5 只接受 ctx 且断言 ctx 非默认上下文（0.6 才支持 dns_free(ctx, result)），默认上下文的结果须由 dns_close(NULL) 回收"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "0.5":
    status: built
    build_date: "2026-09-30"
    conan_ref: "udns/0.5"
  "0.6":
    status: built
    build_date: "2026-09-18"
    conan_ref: "udns/0.6"
