# 软件级 manifest — udns
# 文件位置: archives/u/udns/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: udns
display: "udns"
description: "小型异步/同步 stub DNS 解析库（libudns）——支持同步与异步 DNS 查询，解析常见 RR 类型（A/AAAA/PTR/MX/TXT/SRV/NAPTR/DNSBL/RHSBL 等）"
category: network
homepage: "https://www.corpit.ru/mjt/udns.html"
license: LGPL-2.1-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "自研 configure 不接受 GNU autoconf 的 --prefix/--host 等选项，只能就地构建（configure + make staticlib），不能用 Autotools(self).configure()"
    - "编译器由 AutotoolsToolchain 的 conanbuild env 提供，self.run() 不裸用 ${CC}（R33）"
    - "Makefile 无 VPATH 支持、无 install 目标，package() 手动 stage libudns.a 与 udns.h"
    - "上游无测试套件，test_package 承担消费者视角实质性验证"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "0.6":
    status: built
    build_date: "2026-09-18"
    conan_ref: "udns/0.6"
