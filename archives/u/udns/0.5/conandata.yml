# conandata.yml — udns 0.5
# 官方源: https://www.corpit.ru/mjt/udns/udns-0.5.tar.gz
# SHA256 为本地下载实测值，与官方发布归档一致。

sources:
  url: "https://www.corpit.ru/mjt/udns/udns-0.5.tar.gz"
  sha256: "035bfc12e3819d0aba8f40ee8220a974b7e9b29c3259d310970cc4b2d1c203c0"

patches:
  - patch_file: "patches/0001-configure-fix-inet_pton-inet_ntop-probe-prototypes.patch"
    patch_description: >-
      修复上游 configure 中 inet_pton()/inet_ntop() 编译探测的原型错误
      （把 long* 传给 inet_pton() 的 const char* 参数、把 inet_ntop() 的
      const char* 返回值当成 int main() 的返回值）。clang 对该 ill-formed
      代码报硬错误，导致探测失败、config.h 缺失 HAVE_INET_PTON_NTOP，
      udns_XtoX.c 走入 `#define inet_XtoX_prefix udns_` 回退分支，产出
      udns_ntop()/udns_pton() 而非 udns.h 声明的 dns_ntop()/dns_pton()，
      libudns.a 与自身头文件符号不匹配，任何消费者链接必然失败
      （undefined symbol: dns_pton / dns_ntop）。补丁采用上游 0.6 已修正的
      探测体（类型与 libc 声明一致）。
    patch_type: portability
  - patch_file: "patches/0002-configure-drop-exec-of-cross-linked-probes.patch"
    patch_description: >-
      上游 0.5 的 configure.lib 在编译器自检里**执行**刚链接出来的 conftest
      （`ac_run $CC -o conftest conftest.c && ac_run ./conftest`，以及
      ac_compile_run = ac_link + 运行）。这是"本机原生编译"的假设；交叉编译到
      aarch64-OHOS 时，构建机无法执行该瞬时 AArch64 二进制，于是编译链接虽
      成功、运行步骤失败，configure 报
      `$CC (...) is not a working compiler` 并中止，一个目标文件都产不出。
      上游 0.6 已删除这两处执行步骤（改用只链接的 ac_link）。本补丁把该上游
      修正回移到 0.5；所有编译/链接探测（含 0001 修的 inet_pton/inet_ntop
      探测）语义不变，特性检测结果不受影响。
    patch_type: portability
