# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: udns/0.5
homepage: "https://www.corpit.ru/mjt/udns.html"

# 上游测试套件存在性（经审计官方源码 tar 包确认）
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

# 上游测试命令: udns 0.5 源码包不存在任何测试目标，无独立 check 命令可声明
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件审计结论（源码: udns-0.5.tar.gz，官方 corpit.ru，
# sha256 035bfc12e3819d0aba8f40ee8220a974b7e9b29c3259d310970cc4b2d1c203c0）
upstream_test_audit:
  source_tarball: "udns-0.5.tar.gz (https://www.corpit.ru/mjt/udns/udns-0.5.tar.gz, 2024-03-09)"
  source_sha256: "035bfc12e3819d0aba8f40ee8220a974b7e9b29c3259d310970cc4b2d1c203c0"
  build_system: "自研 autoconf 风格（configure + configure.lib + Makefile.in），非 GNU automake"
  scanned_for:
    - "TESTS / check_PROGRAMS / check-local（automake 测试注册）"
    - "Makefile.in 中 check / test / tests 目标"
    - "tests/ / test/ 目录"
    - "gtest / cunit / cmocka / tap / pytest 等测试框架"
    - "CI 配置（.github/workflows 等）"
  scan_result: >-
    包内共 31 个文件：15 个库源文件（udns_dn.c / udns_dntosp.c / udns_parse.c /
    udns_resolver.c / udns_init.c / udns_misc.c / udns_XtoX.c / udns_rr_*.c /
    udns_bl.c / udns_codes.c / udns_jran.c）、3 个示例工具（dnsget.c /
    rblcheck.c / ex-rdns.c）、udns.h、inet_XtoX.c、getopt.c、
    Makefile.in、configure、configure.lib、COPYING.LGPL、NEWS、NOTES、TODO、
    udns.3、dnsget.1、rblcheck.1。Makefile.in 的目标仅有
    all / static / staticlib / shared / sharedlib / dist / subdist / clean /
    distclean / depend 及示例工具构建规则，全文 grep 确认无 check、test、
    TESTS、check_PROGRAMS 等测试目标（`make -n check` 报
    "No rule to make target"）；无 tests/ 或 test/ 目录；无任何测试框架；
    无 CI 配置。
  reason: >-
    udns 0.5 上游无自动化测试套件。configure / configure.lib 中的 conftest
    仅为构建期编译链接探测（编译器可用性、getopt、socket、inet_pton/ntop、
    socklen_t、IPv6、poll），用于生成 config.h，不含任何断言或测试用例，
    不构成测试套件。按 no_tests 处理并如实上报 status=no_tests。

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

upstream_test_audit_paths:
  - path: "Makefile.in"
    finding: "目标仅含 all/static/staticlib/shared/sharedlib/dist/subdist/clean/distclean/depend 与 dnsget/rblcheck/ex-rdns 构建规则；无 check/test/TESTS/check_PROGRAMS（`make -n check` 报 'No rule to make target'）。另无 install 目标，故配方需手动 stage 产物。"
  - path: "configure / configure.lib"
    finding: "自研 autoconf 风格配置脚本，仅做 C 编译器、getopt、socket/connect、inet_pton/inet_ntop、socklen_t、IPv6、poll 的编译链接探测（conftest）以生成 config.h；不构成自动化测试用例。另不识别 --prefix/--host 等 GNU autoconf 选项，仅接受 --enable/--disable-ipv6 与 --help。"
  - path: "源码包整体（udns-0.5.tar.gz，2024-03-09）"
    finding: "无 tests/ 目录、无测试脚本、无 gtest/cunit/tap 等测试框架、无 CI 配置；上游为纯自定义 Makefile 工程。"

# test_package 中自带的测试（消费者视角验证，真实调用库 API）
test_package_tests:
  - file: test_package/test.c
    target: test_udns（经 Conan CMakeDeps 的 udns::udns 链接）
    description: "离线确定性 12 项断言（dns_init(NULL,0)=0、dns_version() 必须等于打包版本 0.5、dns_sptodn/dns_dntosp 域名 DN 线格式往返、dns_dnlen/dns_dnlabels 标签解析、dns_dnequal 大小写不敏感相等、dns_dntop ASCII 输出、dns_pton/dns_ntop IPv4 往返、dns_strerror 错误码映射）+ 端到端异步解析回环 dns_submit_a4 -> poll(dns_sock)/dns_timeouts -> dns_ioevent -> dns_ntop，输出 E2E_DNS_RESULT 与 HMBS_TEST_PACKAGE_RESULT"
    command: "./test_udns（由 test_package/conanfile.py test() 经 self.run 实际执行；aarch64 目标经 profile 的 CMAKE_CROSSCOMPILING_EMULATOR=qemu 运行）"
    assertions: 12
  - file: test_package/test_static_link.c
    target: test_static_link（裸 -ludns 直连 libudns.a，不经 CMakeDeps）
    description: "直接以 `$CC -I<prefix>/include test_static_link.c -L<prefix>/lib -ludns` 链接打包产物，只使用 udns.h 声明的公开符号并断言 dns_pton/dns_ntop/dns_dntop 可用、IPv4 往返正确。这是 udns 0.5 缺陷（上游 configure 的 inet_pton/ntop 探测原型错误 → libudns.a 导出 udns_pton/udns_ntop 而非 dns_pton/dns_ntop）的回归门禁：回退补丁 0001 后本目标链接即失败（undefined symbol: dns_pton / dns_ntop）"
    command: "./test_static_link"
    assertions: 8
  - file: test_package/test_udns_ohos.c
    target: test_udns_ohos（鸿蒙特有测试 rule12）
    description: >-
      OHOS/aarch64 上 libudns 的**完整消费者端到端闭环**。程序内置一个最小 UDP DNS
      应答器线程（绑定 127.0.0.1 临时端口），再用 dns_add_serv_s() 把解析器指向它，
      从而确定性走通 libudns 的真实解析链路：查询报文编码 -> sendto -> 应答接收 ->
      DNS 报文解析 -> RR 解码（dns_rr_a4）-> 回调派发 -> dns_ntop() 渲染为点分十进制
      -> dns_close() 回收上下文。断言解析结果必须等于应答器写入的期望值 127.0.0.1。
      内置应答器的意义：实测 DAYU200 完全无网络（wlan0/eth0/eth1 RX=TX=0，
      `ping 8.8.8.8` 报 Network unreachable），若只依赖外部 DNS 则只能 SKIP，
      等于放弃端到端验证；本地回环使该用例在无外网真机上也能确定性通过。
      本地回环是**权威**路径：未得到期望值即判 failed 并非 0 退出，不回退系统解析器。
      反向证伪：把应答 RDATA 改成全 0 后，本用例正确输出
      `{"status":"failed","expected":"127.0.0.1","got":"0.0.0.0"}` 且退出码 1。
    command: "./test_udns_ohos（由 test_package/conanfile.py test() 经 self.run 实际执行）"
    # 层 3 不含 CHECK 宏：它是单条端到端 pass/fail 门（退出码 + OHOS_E2E_RESULT），
    # 因此如实计为 1 项，而不是把它拆成 3 个"断言"抬高总数。
    assertions: 1
    assertion_basis: "single end-to-end pass/fail gate (no CHECK macros; verdict from exit code + OHOS_E2E_RESULT)"


upstream_tests_exist_note: "上游无测试，故 test_package 承担全部实质性验证（层 1 12 项 + 层 2 8 项 + 层 3 鸿蒙端到端闭环 1 项）"

harmonyos_specific_tests:
  - name: "libudns 端到端解析回环（OHOS aarch64，本地 DNS 应答器）"
    file: "test_package/test_udns_ohos.c"
    what: >-
      真实 DNS 查询全链路：dns_init -> dns_add_serv_s(127.0.0.1:port) -> dns_open
      -> dns_sock/dns_timeouts -> dns_submit_a4（非阻塞）-> poll + dns_ioevent 事件循环
      -> 应答接收 -> DNS 报文解析 -> RR 解码 -> 回调 -> dns_ntop 渲染 -> dns_close。
      应答器由用例自身在 127.0.0.1 上提供，故不依赖任何外部网络。
    evidence: >-
      DAYU200 真机（OpenHarmony 6.0.0.47, aarch64）实测：
      OHOS_E2E_RESULT={"status":"passed","mode":"local-responder",
      "server":"127.0.0.1:56974","nrr":1,"first":"127.0.0.1","expected":"127.0.0.1"}
      （device_runner.sh，exit_code=0）
    negative_control: >-
      把应答 RDATA 改为全 0 后，用例正确判失败：
      {"status":"failed","expected":"127.0.0.1","got":"0.0.0.0"}，退出码 1
    device_evidence:
      serial: "450100445634303332018f3e7d2dba00"
      system: "OpenHarmony 6.0.0.47 (API20, aarch64, 64bit)"
      job: "udns_ohos_e2e"
      exit_code: 0
    offline_behaviour: >-
      仅当本地回环 socket 都无法绑定时才 SKIP 并给出原因（属于环境不可能而非库缺陷）；
      本地应答器一旦未给出期望值则判 failed，绝不静默降级为通过

# 测试断言总数（层1 12 + 层2 8 + 层3 1 = 21；
# 层 3 是端到端 pass/fail 门，无 CHECK 宏，如实计 1 项）
assertion_count: 21
