# 版本级 manifest — udns 0.5
# 文件位置: archives/u/udns/0.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一输入，本文件为交叉校验元数据）

# ============================================================
# 必须字段
# ============================================================

version: "0.5"
software: "udns"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: "autotools (自研 configure)"
conan_ref: "udns/0.5"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://www.corpit.ru/mjt/udns/udns-0.5.tar.gz"
  # 源码校验和（与 conandata.yml 一致，本地下载实测）
  sha256: "035bfc12e3819d0aba8f40ee8220a974b7e9b29c3259d310970cc4b2d1c203c0"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # udns 自研 configure 不接受 --prefix 等 GNU autoconf 标准选项，仅支持
  # --enable/--disable-ipv6 与 --help，故配方在源码目录内就地构建
  # （configure + make staticlib），package() 手动打包 libudns.a 与 udns.h。
  configure_options:
    - "--enable-ipv6"
  dependencies: []
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "patches/0001-configure-fix-inet_pton-inet_ntop-probe-prototypes.patch"
    type: portability
    reason: >-
      上游 0.5 的 configure 用原型错误的程序探测 inet_pton()/inet_ntop()，
      clang 下必然失败，导致 config.h 缺 HAVE_INET_PTON_NTOP，libudns.a 导出
      udns_pton()/udns_ntop() 而非头文件声明的 dns_pton()/dns_ntop()，
      消费者链接必然失败。采用上游 0.6 修正后的探测体。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "R33: udns 自研 configure 用 $CC/$CFLAGS 环境变量探测编译器，配方通过 AutotoolsToolchain 生成的 conanbuild env 提供编译器，不在 self.run() 中用裸 ${CC}"
  - "udns configure 不接受 GNU autoconf 的 --prefix/--host 等选项，不能用 Autotools(self).configure()，须手动就地运行 configure + make"
  - "udns Makefile 无 VPATH 支持（SRCS 为裸文件名），且无 install 目标，须就地构建并由 package() 手动 stage 产物"
  - "上游无任何测试套件（无 check/test 目标、无 tests/ 目录），test_package 承担实质性消费者验证（12 项离线断言 + 端到端异步解析回环）"
  - "udns 0.5 的 configure inet_pton()/inet_ntop() 探测原型错误（long* 传给 const char*、返回 const char* 当 int），clang 下探测失败 → libudns.a 导出 udns_pton()/udns_ntop() 而非 dns_pton()/dns_ntop()，库与自身头文件不匹配、消费者全部链接失败；上游 0.6 已修复该探测，配方以补丁回移"
  - "编译探测（configure conftest / try_compile）失败不总是『功能不可用』，也可能是探测程序自身写错；探测失败时必须核对生成的 config.h 宏与最终归档符号表，不能只看 configure 退出码为 0"

# ============================================================
# 补丁生成元数据
# ============================================================

patch_generation:
  method: manual
  patches_count: 1

patch_classification:
  - portability
