# 版本级 manifest - uusi 0.4.4.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.4.4.0"
software: uusi
status: built
build_date: "2026-09-04"
build_system: custom
difficulty: "B"

source:
  url: "https://hackage.haskell.org/package/uusi-0.4.4.0/uusi-0.4.4.0.tar.gz"
  sha256: "88d9fdde7d3a67dd641f7ea85315357b1723153913b23171461439a998ad6a02"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "--enable-executable-static"
    - "--enable-tests"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-enable-upstream-tests-with-hunit-shim.patch"

knowledge_gained:
  - "uusi 是 Haskell/Cabal 项目，build-type: Simple，源码包自带 Setup.hs；真机验证时要先用 ghc --make Setup.hs 编出 Setup，再走 configure/build 两段式流程"
  - "复制出来的 GHC 不能只带 ghc/ghc-pkg，可执行树还要恢复 /storage/Users/currentUser/tmp/lib/settings、package.conf.d 和 aarch64-linux-ghc-9.14.1-7fac 运行时目录，ghc-pkg recache 之后才能稳定工作"
  - "GHC 调起 clang、ld.lld、ar、ranlib 时依赖 /data/service/hnp/bin 在 PATH 前列；否则 Setup build 会在工具链查找阶段卡住"
  - "PR CI 新装 harmonybrew GHC 后，Setup 可执行文件运行前也要把 harmonybrew 的 gmp、libffi、ncurses 和 GHC libdir 放进 LD_LIBRARY_PATH / LIBRARY_PATH，否则会在 libgmp.so.10 / libffi.so.8 动态加载阶段失败"
  - "uusi 的 library 与三个可执行文件只依赖 base/Cabal/text/directory/filepath/pretty，这些库随 GHC 工具链提供，不需要额外 Conan 依赖"
  - "test-suite uusi-tests 真实存在且必须运行；本轮提供 package-local Test.HUnit 兼容层覆盖上游使用到的 5 个 HUnit API，并通过 Setup test --show-details=direct 实跑 5 个上游断言"
  - "test_package 不能只做文件存在性检查；它需要同时覆盖 uusi、gen-setup、uusi-extract 三个入口，并验证语义改写、Setup.hs 生成和元信息提取"

knowledge_drafts:
  - "knowledge_drafts/DRAFT-uusi-setup-hs-bootstrap.md"
  - "knowledge_drafts/DRAFT-uusi-ghc-runtime-tree.md"
  - "knowledge_drafts/DRAFT-uusi-ghc-toolchain-path.md"
  - "knowledge_drafts/DRAFT-uusi-conan-os-version-cleanup.md"
  - "knowledge_drafts/DRAFT-uusi-test-package-contract.md"
  - "knowledge_drafts/DRAFT-uusi-hunit-shim-upstream-tests.md"
