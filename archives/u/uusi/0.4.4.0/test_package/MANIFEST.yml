# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: uusi/0.4.4.0
homepage: "https://hackage.haskell.org/package/uusi"

# 上游测试命令
upstream_check_command: "cabal test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./Setup test --show-details=direct"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/Main.hs
    source: uusi-0.4.4.0/test/Main.hs
    description: "HUnit-style test-suite for cabal-file rewrite and extraction helpers; upstream assertions are kept intact and run through a package-local Test.HUnit compatibility module"
    command: "./Setup test --show-details=direct"
    result: "5/5 passed on OHOS CI via conanfile.py build()"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_uusi.sh
    description: "验证 uusi 三个可执行文件：uusi-extract 名称/版本提取、uusi 语义改写、gen-setup 生成 Setup.hs"
    command: "sh test_uusi.sh"

# 测试断言总数 (近似值, 用于质量评估)
# upstream uusi-tests: 5 + test_package CLI checks: 6
assertion_count: 11
