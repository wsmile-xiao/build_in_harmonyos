package: ud/1.1.0
homepage: "https://github.com/xyproto/ud"
# Upstream registers no CTest cases; its workflow only runs ./ud as a smoke call,
# which is not counted as a result-asserting test case.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
test_package_tests:
  - file: test_ud.py
    description: "Installed CLI date conversions, version, help, and invalid input"
    command: "python3 test_ud.py <installed ud>"
assertion_count: 18
