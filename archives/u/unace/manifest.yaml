# 软件级 manifest
# 文件位置: archives/u/unace/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: unace

# 显示名
display: "unace"

# 一句话描述
description: "Command-line ACE archive extraction utility (public GPL UNACE)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: compress

# 官网 URL
homepage: "https://deb.debian.org/debian/pool/main/u/unace/"

# 开源许可证（SPDX 标识）
license: GPL-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "raw make（make -f unix/makefile），无 configure；makefile 需补丁修链接行 gcc 与 -d 宏风格"
    - "aarch64 小端：不注入字节序宏，portable.h 主机序直读即正确"
  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2b":
    status: built
    build_date: "2026-09-21"
