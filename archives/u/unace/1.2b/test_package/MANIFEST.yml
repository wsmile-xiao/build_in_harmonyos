# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: unace/1.2b
homepage: "https://deb.debian.org/debian/pool/main/u/unace/"

# 上游测试命令：1.2b tarball 不含任何测试目标（unix/makefile 仅有 unace/clean/dep）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Consumer test: build minimal stored ACE fixture, run l/t/e/x on the packaged binary, verify contents and CRC output"
    command: "conan test test_package unace/1.2b"

# 测试断言总数（A1..A7，与 test_unace.sh 输出的 total 一致）
assertion_count: 7
