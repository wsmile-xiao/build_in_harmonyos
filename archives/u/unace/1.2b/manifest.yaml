# 版本级 manifest
# 文件位置: archives/u/unace/1.2b/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2b"

# 软件名
software: "unace"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian pool，上游 tarball 的权威镜像）
  url: "https://deb.debian.org/debian/pool/main/u/unace/unace_1.2b.orig.tar.gz"

  # 源码校验和
  sha256: "a5f3b7d0994b2c6aa3b95ac1196ee18605d8dbd0660f978f8d64b8583fb55490"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（raw make，无 configure；make -f unix/makefile CC=<clang>）
  configure_options: []

  # 构建目标（makefile 系统）
  build_target: unace
  build_flags:
    - "CC=clang"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-unace.c.patch"
  - "0002-declare.h.patch"
  - "0003-unix-makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "unace 1.2b read_header 对带 ADDSIZE 的 FILE 头用不推进指针的 BUF2LONG 读 ADDSIZE，导致 PSIZE/SIZE/FTIME/ATTR/CRC32/FNAME 整体错位一格（文件名列空、CRC 校验读 ATTR 必失败）；改 BUFP2LONG 一处推进 tp 即对齐（acefile 格式权威确认 FILE 头必带 ADDSIZE，主头规范上不带）"  # knowledge_ref: E595
  - "declare.h 把 ULONG/LONG 定义为 long，LP64 下 8 字节而 ACE on-disk 字段全 32 位（BUFP2LONG 步进 4 字节），结构体槽位与解析步进错位；typedef 固定为 int 宽度即修（Debian 004_64_bit_clean 同方向）"  # knowledge_ref: E595
  - "unix/makefile 链接行硬编码 gcc；改为 $(CC) 并以命令行 CC=clang 覆盖（Debian 001 同方向）；上游 CFLAGS 的 -d 宏是 BCC 风格死 flag，clang 仅报 unused-argument warning 不阻断，保留不动减少 delta"  # knowledge_ref: E595
  - "pkgsrc distfiles 的 unace-1.2b.tar.gz 与 Debian pool 的 unace_1.2b.orig.tar.gz 字节不同：前者带陈旧 .o 编译残留（会把 make 骗进目标已最新），选 Debian 版并核对 gzip magic 与 tar 顶层目录"  # knowledge_ref: E595
  - "上游无测试套件的解压工具：用 Python 按源码头结构生成最小 stored 档案（纯文本生成器入库，避免二进制条目进提交面），以 l/t/e/x 消费者断言验证"  # knowledge_ref: E595
