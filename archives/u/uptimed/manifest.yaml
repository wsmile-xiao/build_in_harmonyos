# 软件级 manifest — uptimed
# 遵循 ARCHIVE-SPEC v2.0
software: uptimed
display: "uptimed"
description: "Uptime record daemon (uptimed) and top-uptime query tool (uprecords)"
category: utils
homepage: "https://github.com/rpodgorny/uptimed"
license: GPL-2.0-only

build_system: autotools

ohos_adaptation:
  key_points:
    - "git-tag 归档无生成式 configure：build() 先以 autogen.sh 引导（tool_requires automake/libtool；autoconf/m4 走 SDK PATH，termrec/accel-config 先例）"
    "config.guess 不识别 OHOS uname → 显式 --build/--host=aarch64-unknown-linux-gnu 双 gnu 三元组，使 configure.ac 的 *-linux* 分支定义 PLATFORM_LINUX（/proc/uptime 启动时间读取路径必需）"
    - "E011/E114：config.status 的 umask 077 临时目录在 HMDFS 不可写 → mktemp wrapper（build 目录内，不入仓）+ configure 内 umask 077→022 受控放宽"
    - "E386（§12.38）：unset CONFIG_SHELL + SHELL=/bin/sh，避开 hnp bash 在 HMDFS 构建目录的 getcwd 失败"
    - "无 make install（HMDFS install-sh/chmod 类问题）：纯 Python 拷贝 bin/uprecords、bin/uptimed、man 页与样例配置（dhcpoptinj 先例）"

versions:
  "0.4.6":
    status: built
    build_date: "2026-09-18"
