package: uptimed/0.4.6
homepage: "https://github.com/rpodgorny/uptimed"

upstream_tests_exist: false
upstream_test_audit:
  - source: "uptimed-0.4.6 source tree root"
    reason: "No tests/ or test/ directory present; only libuptimed/, src/, man/, etc/ plus docs."
  - source: "Makefile.am / src/Makefile.am / libuptimed/Makefile.am"
    reason: "No check_PROGRAMS or TESTS registered anywhere; automake check target is empty."
  - source: "configure.ac"
    reason: "No AC_CONFIG_TEST_DIR / test framework macros; only feature probing."
  - source: "src/*.c libuptimed/*.c full-text scan"
    reason: "No TEST/TEST_F/cmocka/munit harness strings; test-like hits are ordinary words."
  - conclusion: "Upstream 0.4.6 ships zero automated tests; adaptation validates via test_package binary checks without claiming upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "Run packaged bin/uptimed -v and verify version banner (uptimed 0.4.6)"
    command: "test_uptimed"
  - file: test.c
    description: "Run packaged bin/uprecords -v and verify version banner (uprecords 0.4.6)"
    command: "test_uptimed"
  - file: test.c
    description: "Run packaged bin/uprecords -? and verify option list output"
    command: "test_uptimed"
  - file: test.c
    description: "Run packaged bin/uptimed with invalid option -Z; require non-silent failure handling"
    command: "test_uptimed"
