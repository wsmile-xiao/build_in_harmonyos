software: uptimed
# 版本级 manifest
# 文件位置: archives/u/uptimed/0.4.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.7"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/rpodgorny/uptimed/archive/refs/tags/v0.4.7.tar.gz"

  # 源码校验和
  sha256: "2f669d2968ca1d0865b7a97791c9dbcca759631a1afc5d6702964f070a57252b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--disable-shared"
    - "--enable-static"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# uptimed 无需源码补丁，平台适配通过构建时 sed 和环境变量实现

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "uptimed 源码仅包含 configure.ac 和 autogen.sh，无预生成 configure，需先运行 autogen.sh 或 autoreconf -fi"
  - "HMDFS 文件系统上 umask 077 创建的 0700 权限目录无法写入文件，需将 configure/config.status 中的 umask 077 改为 umask 022"
  - "aclocal 需设置 AUTOM4TE=autom4te 环境变量才能正确调用 autom4te"
  - "autogen.sh 中的 libtoolize 不会自动安装 ltmain.sh，需手动运行 libtoolize --automake --copy --force"
  - "HMDFS 不支持 mkfifo，make jobserver 无法使用，需用 make -j1"
  - "uptimed 不安装公共头文件，Conan package_info 需设置 includedirs=[] 避免测试失败"
  - "Conan test_package 需用 VirtualRunEnv 生成器并直接引用二进制路径，不能依赖 PATH 查找"
  - "终端工具静态链接（R26）通过 --disable-shared --enable-static 和 -static 链接标志实现"
