# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: upower-glib/0.99.20
homepage: "https://gitlab.freedesktop.org/upower/upower"

# 上游测试命令 (meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/up-self-test.c
    source: upower-v0.99.20/src/up-self-test.c
    description: "daemon self test (dummy backend), registered as meson test 'self-test'; 6 个 g_test_add_func 用例全部通过 (6/6)"
    command: "./src/up_self_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 仅通过公开头文件/API 调用 upower-glib 的枚举转换与版本宏"
    command: "./test_upower-glib"
  - file: test_ohos.c
    description: "鸿蒙专项测试: 枚举 round-trip、版本宏、无 D-Bus 环境下 up_client_new_full 优雅失败"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
