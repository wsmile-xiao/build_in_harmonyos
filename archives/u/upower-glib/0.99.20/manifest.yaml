# 遵循 ARCHIVE-SPEC v2.0

version: "0.99.20"
software: "upower-glib"
status: built
build_date: "2026-09-19"
build_system: meson

source:
  url: "https://gitlab.freedesktop.org/upower/upower/-/archive/v0.99.20/upower-v0.99.20.tar.bz2"
  sha256: "6b11baeb4e9273def260ca86f2ed482ab4e56e8f4e999b2632d6ba0ea2bccd9a"
  tar_format: tar.bz2

build:
  system: meson
  configure_options:
    - "-Dman=false"
    - "-Dgtk-doc=false"
    - "-Dintrospection=disabled"
    - "-Didevice=disabled"
    - "-Dudevrulesdir=no"
    - "-Dudevhwdbdir=no"
    - "-Dsystemdsystemunitdir=no"
  dependencies:
    - glib/2.88.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS musl 加载器拒绝带无效 .codesign 占位段的共享库；package() 必须用 binary-sign-tool 签名安装的 ELF（glib 同款 PACKAGE_CODESIGN 流程）"
  - "PkgConfigDeps 不生成 gio-unix-2.0.pc；meson 硬依赖时需复制 glib 包 pkgconfig 并剥离 proxy-libintl/zlib/libpcre2-8 私有 Requires（glib-networking 同款 pc-fix）"
