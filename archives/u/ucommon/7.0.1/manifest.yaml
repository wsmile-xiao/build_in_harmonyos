version: "7.0.1"
software: ucommon
description: "GNU uCommon C++ threading, socket, and secure abstraction library"
homepage: "https://www.gnu.org/software/commoncpp/"
license: LGPL-2.1-or-later
category: network
status: built
build_system: cmake
build_date: "2026-08-31"

source:
  url: "https://deb.debian.org/debian/pool/main/u/ucommon/ucommon_7.0.1.orig.tar.gz"
  sha256: 99fd0e2c69f24e4ca93d01a14bc3fc4e40d69576f235f80f7a8ab37c16951f3e
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_STDLIB=ON"
    - "-DBUILD_STATIC=(not shared)"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_EXTRAS=OFF"
    - "-DCRYPTO_OPENSSL=(with_ssl=openssl)"
  dependencies:
    - gnutls/3.8.10
    - pkgconf/3.0.5
    # Optional alternative when with_ssl=openssl.
    - openssl/3.5.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 CMake 通过 pkg-config 选择 GnuTLS；配方必须把 PkgConfigDeps 生成目录加入 PKG_CONFIG_PATH，否则会静默回退到 nossl 后端。"
  - "上游安装库名为 libcommoncpp、libusecure、libucommon，Conan package_info 必须声明真实名称并按依赖顺序链接。"
  - "nossl/secure.cpp 的实现签名需与 inc/ucommon/secure.h 的双参数声明一致；配方在 build() 中使用 replace_in_file 保持源码修复可复现。"

quality_gates:
  conan_verify: "PASS (remote HarmonyOS W3 conan create; local conan_verify unavailable)"
  consumer_test_package: PASS
  with_ssl_false_consumer_test: PASS
