# test_package/MANIFEST.yml
# CI build_and_test.sh L0e requires this consumer-test declaration.

package: ucommon/7.0.1
homepage: "https://www.gnu.org/software/commoncpp/"

# The release CMake project does not register an upstream test target when
# BUILD_TESTING=OFF, so the Conan consumer test is the executable validation.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_package.cpp
    description: "Consumes the installed ucommon target, exercises String and Thread, conditionally initializes the selected TLS backend, and verifies a real SHA-256 digest."
    command: "./test_package"

assertion_count: 4
