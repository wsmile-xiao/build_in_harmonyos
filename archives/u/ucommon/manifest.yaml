software: ucommon
display: "GNU uCommon C++"
description: "Portable C++ threading, socket, utility, and secure abstraction library"
category: network
homepage: "https://www.gnu.org/software/commoncpp/"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use Conan's OHOS aarch64 CMake profile."
    - "Expose Conan-generated pkg-config metadata to the upstream CMake probes."
    - "Declare the three installed libraries with static-consumer dependency order."
  common_dependencies:
    - gnutls
    - openssl
    - pkgconf

versions:
  "7.0.1":
    status: built
    conan_ref: "ucommon/7.0.1"
