# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: udunits/2.2.28.1
homepage: "https://github.com/Unidata/UDUNITS-2"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# make check 结果（实测）:
#   - lib/    : Testsuite summary: # TOTAL: 0（CUNIT 未检测到，lib 内部
#               testUnits/testUnits-1 未注册执行）
#   - prog/   : check-local 运行 ./udunits2 ../lib/udunits2.xml </dev/null
#               程序正常启动、XML 数据库加载成功（smoke test 1 项）
#   - 顶层    : udunits2.info 文档生成（本环境 texinfo 缺失，以 MAKEINFO=true
#               跳过，不影响功能）
upstream_tests:
  - file: prog/udunits2.c
    source: udunits-2.2.28.1/prog/udunits2.c
    description: "udunits2 CLI smoke test：启动 + 加载 XML 单位数据库"
    command: "./udunits2 ../lib/udunits2.xml </dev/null"

# test_package 中自带的测试（消费者视角验证，R34 实质断言）
test_package_tests:
  - file: test.c
    description: "udunits2 公共 C API 实质断言：XML 加载/单位查找/转换器/数值转换/反向转换/温度换算/不兼容拒绝/可转换性检查"
    command: "./test_udunits"

# 测试断言总数（test.c 内 14 个 CHECK + 6 个 near_eq = 20 个断言点）
assertion_count: 20
