source:
  url: "https://github.com/unidata/UDUNITS-2/archive/refs/tags/v2.2.28.tar.gz"
  sha256: "a21d217ff0fe189fe9cd97891389e18d18a994c7e72e5c90d2a5a87f76299318"
  tar_format: tar.gz
build:
  system: autotools
  configure_options: "--disable-dependency-tracking"
  dependencies:
    - "expat/2.8.2.1"
  build_dependencies:
    - "autoconf/2.72"
    - "automake/1.18"
