  test_dependencies: []
  cc: clang
  cxx: clang++
  profile: "ci/conan/profiles/ohos-aarch64"
patches_applied: []
knowledge_gained:
  - "release tarball 只有 configure.ac，无预生成 configure；配方以 libtoolize → aclocal → autoconf → autoheader → automake 显式重建（R6，不提交生成文件差异）。"
  - "Conan perl 包 XS 模块（Cwd.so 等）无法在 HMDFS dlopen（Permission denied）；bootstrap 使用原生 OHOS perl（/data/service/hnp/bin/perl）并将 PERL5LIB 限定为 automake share 纯 perl 模块（ding-libs 0.7.0 同款）。"
  - "E129: HMDFS 对新目录强制 setgid，configure/config.status 临时目录 umask 077 → 022。"
  - "HMDFS getcwd 失效，automake/aclocal wrapper 的 cd+pwd 推算 libdir 失败；发布逻辑 PWD 供 wrapper 路径推算。"
  - "configure conftest 链接 -lexpat 后运行时找不到 libexpat.so.1；通过 Environment 将 expat lib 注入 LD_LIBRARY_PATH 使 configure 交叉编译探测通过。"
  - "CI 干净环境用 conan 工具链 automake 1.18 自带 config.guess（2024-07-27 版）无 OHOS 识别 → configure 报 cannot guess build type；在 build() 内向 build-aux/config.guess 与 config.sub 注入 HarmonyOS/linux-ohos 识别（幂等，参照 ding-libs 0001/0002 补丁）。"
  - "上游 make check：lib 目录 0 注册用例（CUnit 未检测），prog smoke test 启动正常；test_package 以公共 C API 20 项断言覆盖。"
patch_generation:
  method: "refresh-patch --auto"
  patches_count: 0
  generated_files_in_patch_set: false
  note: "配方在 build() 内以 libtoolize→aclocal→autoconf→autoheader→automake 重建生成文件（R6），无源码补丁；旧式手工归档的 0001/0002 补丁随 conan 化删除"
patch_classification: []
