compiler: clang 15.0.4
linker: GNU ld 2.45

dependencies:
  expat: 2.7.1

configure_options:
  - LDFLAGS='-Wl,-rpath,$ORIGIN/../lib'
  - --prefix=$HOME/usr/local

build_notes:
  - 源码仅有 configure.ac，需要 autoreconf -fi 生成 configure
  - HMDFS 软链接不被 musl linker 解析，共享库 .so/.so.N 用 cp 替代 ln -s
  - version.texi 被 mdate-sh 感染，从 .orig 恢复
  - 设置 $ORIGIN/../lib RUNPATH 支持相对路径库加载
  - CUNIT 未检测到（非核心依赖，不影响库功能）

artifacts:
  - udunits2 binary (dynamic linked)
  - libudunits2.so.0.1.0 shared library
  - libudunits2.a static library
  - header files (udunits2.h, converter.h, udunits.h)
  - XML database (udunits2.xml, udunits2-common.xml, etc.)

