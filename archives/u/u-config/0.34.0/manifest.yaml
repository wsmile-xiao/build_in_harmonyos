package: u-config
version: "0.34.0"
homepage: "https://github.com/skeeto/u-config"
license: Unlicense
status: built
build_system: custom
build_date: "2026-09-23"

source:
  url: "https://github.com/skeeto/u-config/archive/refs/tags/v0.34.0.tar.gz"
  sha256: "68b98bb42635b7c16263aeb762e92d6e7049e4937a987d9b0c5c78935485992f"

patches_applied: []

upstream_tests:
  command: "./tests"
  test_count: 63
  notes: "main_test.c is a libc platform layer over a virtual filesystem: 19 test functions, 63 atomic run() assertions, executed natively on the OHOS target inside build(); prints 'all tests pass'."

test_package:
  assertion_count: 10
  description: "Runs the installed pkg-config binary as a build system consumes it: .pc discovery via PKG_CONFIG_PATH, variable expansion, token order, --validate pass/fail, missing-package exit code, --newlines, PKG_CONFIG_LIBDIR override."

knowledge_gained:
  - "u-config 无 configure：README 指引分发者直接编译单个平台层 TU（OHOS 用 main_posix.c）；Makefile 的 pkg-config 目标会把宿主机 pc_path 编进二进制，交叉构建不可用"
  - "上游 main_test.c 是虚拟文件系统平台层，平台无关，可在 OHOS 目标上原生执行 ./tests（本机未签名 ELF 可直接执行）"
  - "UBSan 用 -fsanitize-undefined-trap-on-error 时不需要 ubsan 运行时库，可与纯 musl 链接共存"
