package: u-config/0.34.0
homepage: "https://github.com/skeeto/u-config"

upstream_check_command: "./tests (upstream virtual-filesystem test suite, run in build())"
upstream_test_in_build: true
upstream_test_command: "cc -g3 -Wall -Wextra -Wconversion -Wno-clobbered -fsanitize=undefined -fsanitize-undefined-trap-on-error -o tests main_test.c && ./tests"

upstream_tests:
  - name: main_test.c
    command: "./tests"
    expected: "prints 'all tests pass', exit 0"

test_package_tests:
  - file: test.sh
    description: "Run installed pkg-config against a generated .pc: version, pc_path, modversion, cflags/libs expansion, validate pass/fail, exists failure, --newlines, PKG_CONFIG_LIBDIR override, variable expansion"
    command: "sh test.sh"

assertion_count: 10
