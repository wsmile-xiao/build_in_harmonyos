# 版本级 manifest — uhubctl 2.6.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.6.0"

# 软件名
software: "uhubctl"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mvp/uhubctl/archive/refs/tags/v2.6.0.tar.gz"

  # 源码校验和
  sha256: "56ca15ddf96d39ab0bf8ee12d3daca13cea45af01bcd5a9732ffcc01664fdfa2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（裸 Makefile，无 configure；CFLAGS 以环境变量注入）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libusb/1.0.27

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "conanbuildenv_ 前缀的自定义 env 脚本才聚合进 conanbuild 且排在 profile buildenv 之后；save_script('conanbuild') 会把聚合脚本覆盖成自引用死递归（SIGSEGV）"
  - "make 变量须用 env 前缀传环境变量而非命令行覆盖，否则上游 Makefile 的 CFLAGS +=（pkg-config 旗标）被抹掉"
  - "PkgConfigDeps 的 includedir 带组件子目录时，需补父级 include 到 CPPFLAGS"
