# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: uhubctl/2.6.0
homepage: "https://github.com/mvp/uhubctl"

# 上游 Makefile 只有默认构建/clean/install 目标，没有 check/test 目标，
# 源码包仅含 uhubctl.c / Makefile / README / udev rules，无任何测试源码或测试脚本。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测二进制)
test_package_tests:
  - file: test_uhubctl.c
    description: "执行 uhubctl -v，断言退出码 0 且输出包含版本号 2.6.0"
    command: "./test_uhubctl <uhubctl-bin>"
  - file: test_uhubctl.c
    description: "执行 uhubctl -h，断言程序干净退出且 usage 文本包含 --version 选项说明"
    command: "./test_uhubctl <uhubctl-bin>"
  - file: test_uhubctl.c
    description: "无参数执行 uhubctl（真实 libusb-1.0 总线枚举），断言无智能 Hub 时干净退出（0/1）且有诊断输出，不崩溃"
    command: "./test_uhubctl <uhubctl-bin>"

# 测试断言总数 (test_uhubctl.c 中 check() 调用数)
assertion_count: 6
