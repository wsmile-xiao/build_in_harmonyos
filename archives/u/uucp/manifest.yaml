# 软件级 manifest — uucp
software: uucp
display: "Taylor UUCP"
description: "GNU Taylor UUCP — Unix-to-Unix copy protocol suite（传输守护进程、远程执行、文件传输与串行连接工具）"
category: network
homepage: "https://www.gnu.org/software/uucp/"
license: "GPL-2.0-or-later"

build_system: autotools

ohos_adaptation:
  key_points:
    - "零第三方依赖：configure.in 无 PKG_CHECK_MODULES/AM_PATH_*/AC_MSG_ERROR，链接面为包内三个 noinst 静态库，socket 系函数由 musl libc 提供"
    - "autoconf-2.13 交叉探测天然兼容：本机构建 conftest 可执行（cross-compiler... no），6 处 AC_TRY_RUN 全部真实运行（ftime/statvfs 命中 OHOS musl 能力）"
    - "绕过上游 install-exec-hook 的 chown（OWNER=uucp / root）：非 root 构建用户必然 EPERM，故不跑 make install，package() 显式复制 13 个 bin 产物"
    - "make 前 touch 过期生成物（uucp.info/Makefile.in 等），宿主无 makeinfo/autoconf/automake 亦不触发重建"
    - "消费者功能用例在 OHOS 真机走完整 uuconf 配置解析链（config→sysfile→sys→portfile→port TCP），18/18 断言通过"
  common_dependencies: []

versions:
  "1.07":
    status: built
    build_date: "2026-09-20"
    conan_ref: "uucp/1.07"
