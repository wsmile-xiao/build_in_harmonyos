# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: uucp/1.07
homepage: "https://www.gnu.org/software/uucp/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check (automake-1.4 empty check target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: upstream-check.log
    source: "uucp-1.07/Makefile.in: check-am"
    description: >
      上游无自动化测试套件：automake-1.4 生成的 Makefile.in 中不存在 TESTS
      变量，`check: check-recursive -> check-am: all-am` 是空目标（0 用例）。
      配方在 build() 里真实执行了 `make check` 并留档 upstream-check.log
      作为入口被驱动的证据。上游唯一的测试资产是手工测试驱动 tstuu.c
      （noinst_PROGRAMS，不挂入 check 目标），配方验证其编译产物存在但不
      执行——它 fork uucico 做会话回环，需要 setuid uucp 用户与 spool 目录
      写权限，OHOS 构建用户无法满足。
    command: "make check"
    total_cases: 0

# 宿主环境不兼容用例（conanfile.py build() 中白名单容忍；任何白名单外的失败都会中止构建）
host_incompatible_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_uucp_ohos.sh
    description: >
      消费者测试（OHOS 真机执行，18 条断言）：①11 个程序的 -v 版本横幅
      （exit 0 且含 'Taylor UUCP) 1.07'）；②uusched/uuto 脚本存在、可执行、
      sh -n 语法有效；③uname -m = aarch64 平台断言；④★OHOS 消费者功能
      用例：临时目录构造 config→sysfile→sys→portfile→port(TCP) 完整配置链，
      uuchk -I 解析整条链并打印系统定义、-s 按名检索、非法系统名退出非零、
      uuname -I -l 读出 nodename——与 uucico 启动时相同的解析代码路径。
    command: "sh test_uucp_ohos.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
