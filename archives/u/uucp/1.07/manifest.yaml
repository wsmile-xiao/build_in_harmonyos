software: uucp
version: "1.07"
status: built
build_date: "2026-09-20"
conan_ref: "uucp/1.07"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/uucp/uucp-1.07.tar.gz"
  sha256: "060c15bfba6cfd1171ad81f782789032113e199a5aded8f8e0c1c5bd1385b62c"
  tar_format: tar.gz
  mirror_note: >
    conandata.yml 的 sources.url 为镜像列表（TUNA/USTC/Aliyun 优先，GNU 官方源兜底），
    由 CI 的 Mirror fallback 步骤自动改写（ci/conan/build_and_test.sh）；Conan 2.x 的
    get() 支持 url 列表，逐个尝试直到 sha256 校验通过。官方源与 sha256 不变。

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--sbindir=/bin"
    - "--bindir=/bin"
    - "--mandir=/share/man"
    - "--infodir=/share/info"
  dependencies: []
  system_libraries: []
  build_tools:
    - "clang (OHOS SDK, via profile tools.build:compiler_executables)"
    - "make"
    - "ar/ranlib"
    - "bash (CONFIG_SHELL)"
  cc: clang

patches_applied: []

test_results:
  upstream_automated_total: 0
  upstream_check_entry_executed: true
  upstream_test_note: >
    上游无自动化测试套件：automake-1.4 生成的 Makefile.in 无 TESTS 变量，
    `make check` 已在 build() 中真实执行（reports/upstream-check.log），
    lib/uuconf/unix 三子目录均 'Nothing to be done for check' = 0 用例空转。
    上游唯一测试资产 tstuu.c（手工会话回环驱动）已验证编译产出（b/tstuu,
    43392 B），但需 setuid uucp 用户与 spool 写权限，OHOS 构建用户不可执行，
    按环境归因登记、不计数。
  test_package_total: 18
  test_package_passed: 18
  test_package_failed: 0
  conan_create_log_sha256: "e56139ee18a0f8370cb4a8068fd5f674d23b93764f7e20d5e3b200f952d198ef"
  conan_create_log_bytes: 372996
  recipe_revision: "830ab91b71486a9daf1f9faf84e567ab"
  package_id: "6b129b068851896169fae42d399fa922d239ce8a"
  package_revision: "1e5f4deb4a9a30ebb230fe71ab12f97b"
  graph_nodes: 1
  graph_info_invalid: 0
  build_rounds: 6
  build_rounds_note: >
    r1 失败=agent 会话 PATH 泄漏 safe-bin rm 垫片（bad interpreter，环境问题
    非配方问题，564 处）；r2 构建全绿+test_package 16/18（消费者用例 config
    指令名笔误 sysdir->sysfile）；r3 全绿 18/18；r4 = 对齐 CI Mirror fallback 改写
    后的 conandata（镜像列表）；r5 = 依独立审计意见修正配方 docstring 表述；r6 =
    **最终权威轮**（同为 revision 830ab91b71，因 conan-verify 的 G2 闸会重写
    reports/conan-create.log，故在全部 verify/finish 之后重跑并重新归档），
    CREATE_EXIT=0、test_package 18/18，日志 reports/conan-create.log
    （sha256 e56139ee…，与 reports/upstream-check.log 同源构建目录
    uucp450e7a098d152）。
    说明：仅 conanfile.py 与 conandata.yml 参与 recipe revision（exports_sources
    仅含 conandata.yml），故 r6 之后的 notes/manifest/README/test_package 修订不影响
    已构建产物的 revision 一致性。

knowledge_ref:
  - "openharmony-pc-autotools-patchng-hmdfs"

validation:
  local:
    conan_create: passed
    upstream_tests: "no upstream automated tests (make check empty; entry executed, 0 cases)"
    test_package: "18/18 passed (see test_package/MANIFEST.yml)"
    conan_verify: passed
    w3_local_ci: passed
    verify_build: "PASS-WARN (reports/quality-report.md)"
    packaging: "packaging/uucp-1.07-ohos-aarch64.tar.gz + -debug.tar.gz (.packaged)"
  notes: >
    零第三方依赖配方；configure 为 autoconf-2.13 生成，本机构建时 conftest
    可执行（is a cross-compiler... no），全部 TRY_RUN 走真实运行路径
    （ftime works correctly... yes、statvfs 命中 STAT_STATVFS）。
    未执行 make install（install-exec-hook 的 chown $(OWNER)=uucp 与 chown root
    对非 root 构建用户必然 EPERM），package() 显式复制 13 个 bin 产物 +
    man/info/licenses。
    零第三方依赖的另一侧证据：5 条 AC_CHECK_LIB（sun/nsl_s/nsl/socket/xti）均为
    非致命可选探测，其中 4 条（nsl_s/nsl/socket/xti）在 `case $LIBS` 守卫内、sun
    为顶层裸探测。
