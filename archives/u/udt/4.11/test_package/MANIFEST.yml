# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 强制要求）

package: udt/4.11
homepage: "https://udt.sourceforge.io/"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "udt.sdk.4.11.tar.gz"
  build_system: "Makefile (src/Makefile + app/Makefile)"
  test_definition: >
    Upstream ships a self-contained test harness in app/test.cpp. `make -C app test`
    builds the binary; running `./app/test` executes 4 loopback data path cases
    (simple stream, parallel UDT+TCP, rendezvous, multi-thread), each printing
    "Test # N completed." on success. main() returns 0 unconditionally, so the
    recipe counts markers and scans for failure indicators to avoid false passes.
  dependency: "none (self-contained; links libudt only)"

upstream_check_command: "app/test"
upstream_test_in_build: true
upstream_test_command: "app/test"

# 4 个上游用例（来源：app/test.cpp 的 test_case = 4，main() 内 Test_1..Test_4）
upstream_tests:
  - file: app/test.cpp
    source: udt4/app/test.cpp
    description: "Test 1 — 简单 UDT 流式回环数据传输；输出 'Test # 1 completed.'"
    command: "./app/test"
  - file: app/test.cpp
    source: udt4/app/test.cpp
    description: "Test 2 — UDT 与 TCP 并行数据通路（含 tcp 流量）；输出 'Test # 2 completed.'"
    command: "./app/test"
  - file: app/test.cpp
    source: udt4/app/test.cpp
    description: "Test 3 — rendezvous 模式连接与数据传输；输出 'Test # 3 completed.'"
    command: "./app/test"
  - file: app/test.cpp
    source: udt4/app/test.cpp
    description: "Test 4 — 多线程下多 socket 数据收发；输出 'Test # 4 completed.'"
    command: "./app/test"

upstream_test_total: 4
upstream_test_passed: 4
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_test_not_run: 0

test_package_tests:
  - file: test.cpp
    description: "真实回环 UDT 传输：server 线程 bind/listen/accept 并校验收到字节，client 线程 connect/send；总 2 处断言（服务器收到数据匹配、客户端发送全部字节）"
    command: "./test_udt"

assertion_count: 2
