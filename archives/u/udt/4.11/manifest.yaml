# 版本级 manifest — udt 4.11
# 遵循 ARCHIVE-SPEC v2.0

version: "4.11"
software: "udt"
conan_ref: "udt/4.11"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方正式源：SourceForge 上 UDT 4.11 的官方 release artifact
  url: "https://sourceforge.net/projects/udt/files/udt/4.11/udt.sdk.4.11.tar.gz/download"

  # 源码校验和（实测）
  sha256: "aa25b6d7cbac474ca05b7c7b36f59e9a3cd5c61faed8bf1b7174ac118c3de1db"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项
  configure_options:
  - "make -C src os=LINUX arch= C++=$(CXX) all"
  - "make -C app os=LINUX arch= C++=$(CXX) test"
  # arch= 为空：不定义 IA32/AMD64 宏，UDT 回退到 POSIX 微秒计时器（aarch64 安全）。

  # 编译依赖列表（格式: name/version）—— 无第三方依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# aarch64：通过架构宏选择规避 x86 rdtsc 内联汇编问题（传空 arch=），未改库本体。
# app/test.cpp 需 apply 一个自测代码补丁（app/test 编译必需）：见
# patches/0001-app-test-fix-bind-shadow.patch，把裸 bind 限定为 ::bind。
patches_applied:
- "patches/0001-app-test-fix-bind-shadow.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "UDT Makefile 的 arch=IA32/AMD64 宏会启用 CTimer 的 x86 rdtsc 内联汇编，aarch64 上无法编译；传空 arch= 让其回退到 POSIX getTime() 微秒计时器（portable 路径）"
- "UDT Makefile 硬编码 C++ = g++，需在 make 命令行覆盖为 Conan toolchain 的 clang++（R33）"
- "上游自包含测试 app/test 的线程函数返回 void*、main() 忽略返回值，退出码恒为 0；必须解析 'Test # N completed.' 标记数并扫描失败指示词来判定真实结果（防假通过）"
