# conandata.yml — udt 4.11
# R39: 官方正式源。UDT 的官方发布归档为 SourceForge 上的 udt.sdk.4.11.tar.gz。
# 该归档是 UDT 4.11 的官方 release artifact（udt4/ 布局），sha256 为实测哈希。
# 注：归档内每个条目都带 "./" 前缀（"./udt4/src/..."），Conan 的 strip_root 会
# 把根目录误判为 "."（只剥掉 ./），解包后仍留下 udt4/ 包装层。故配方 get() 不再
# 使用 strip_root，改由 conanfile 的 _src_root() 显式解析 udt4/ 为源码树根。
sources:
  url: "https://sourceforge.net/projects/udt/files/udt/4.11/udt.sdk.4.11.tar.gz/download"
  # SourceForge "/download" URL 尾部无归档扩展名，Conan 的 get() 无法据扩展名
  # 判定归档类型，误按 ZIP 解压导致 BadZipFile。显式给出 filename 让 get()
  # 按 .tar.gz 识别（同仓库 armadillo 等 SourceForge 包的既有做法）。
  filename: "udt.sdk.4.11.tar.gz"
  sha256: "aa25b6d7cbac474ca05b7c7b36f59e9a3cd5c61faed8bf1b7174ac118c3de1db"

# 补丁：aarch64 通过不在 make 时定义 IA32/AMD64 架构宏，回退到 UDT 自带的
# POSIX 微秒计时器路径即可编译运行。两个源码补丁：
#   - 0001：app/test.cpp 的 C++ 名字遮蔽修复（libc++ 下 ::bind 限定），只影响
#     上游自测程序编译，不改变库本体（src/）行为。
#   - 0002：src/Makefile 与 app/Makefile 把编译器变量 C++ 改名为 CXX（GNU make
#     会静默忽略含 `+` 变量名的命令行覆盖，导致上游硬编码的 g++ 恒被采用，无 g++
#     的 worker 编译失败；改名后 CXX= 覆盖才生效），并去掉 app 的 -lstdc++
#     （clang++/libc++ 无需它）。只改构建脚本，不改库源代码行为。
patches:
  - patch_file: "patches/0001-app-test-fix-bind-shadow.patch"
    description: "app/test.cpp createTCPSocket(): 把裸 bind(ssock,..) 限定为 ::bind(ssock,..)。test.cpp 顶部 using namespace std 使 libc++ 下裸 bind 优先解析为 std::bind（返回 __bind 对象，与 int 比较非法），导致 app/test 编译失败；用全局作用域限定符 :: 强制调用 POSIX socket bind。仅改自测代码，不影响库本体。"
  - patch_file: "patches/0002-fix-makefile-compiler-var.patch"
    description: "src/Makefile 与 app/Makefile 把硬编码的 `C++ = g++` 变量改名为 `CXX`（并把 $(C++) 引用同步为 $(CXX)），同时 app/Makefile 的 LDFLAGS 去掉 `-lstdc++`。根因：GNU make 会静默忽略命令行 `C++=...` 覆盖（变量名含 `+` 时 make 的 override 机制失效），因此上游硬编码的 g++ 恒被采用；无 g++ 的 worker 上编译报 `g++: No such file or directory`。改名后配方向 make 传 `CXX=<toolchain cpp>` 才能真正生效（clang++/libc++ 无需 -lstdc++，去掉它避免 libstdc++ 缺失链接失败）。仅改构建脚本，不影响库源代码行为。"
