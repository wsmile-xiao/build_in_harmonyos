# 软件级 manifest — udt (UDP-based Data Transfer)
# 遵循 ARCHIVE-SPEC v2.0

software: udt
display: "UDT"
description: "UDP-based Data Transfer（UDT）：基于 UDP 的高性能可靠应用层数据传输协议库"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: network

# 官网 URL
homepage: "https://udt.sourceforge.io/"

# 开源许可证（SPDX 标识）
license: BSD-3-Clause

# 常用构建系统
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Makefile 构建，使用 clang++ 覆盖默认的 g++（C++=clang++）"
    - "aarch64 下不能定义 IA32/AMD64 架构宏：UDT 的 rdtsc 分支用 x86 内联汇编，定义任一宏会导致 aarch64 编译失败；不定义任何架构宏时回退到 POSIX getTime() 微秒计时器（portable 路径）"
    - "os=LINUX：UDT 仅在 #ifndef WIN32 分支下走 POSIX socket，Linux/OHOS 语义一致"
    - "上游自包含测试 app/test 在本地回环跑 4 个数据通路用例，作为上游测试接入"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "4.11":
    status: built
    build_date: "2026-09-18"
    conan_ref: "udt/4.11"
