# 版本级 manifest — ulfius 2.7.15
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.7.15"

# 软件名
software: ulfius

# 编译状态
# published | built | failed | archived
# 本配方经 HarmonyOS aarch64 真机预检（conan create + upstream CTest + test_package）通过，
# 尚未 conan upload 到 cnb.cool 制品仓，故为 built（待 PR 合入后由 CI 发布置 published）。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: cmake

# Conan 引用
conan_ref: "ulfius/2.7.15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源（GitHub babelouest/ulfius release 源码归档）
  url: "https://github.com/babelouest/ulfius/archive/refs/tags/v2.7.15.tar.gz"

  # 源码校验和（与 conandata.yml 一致）
  sha256: "19cf789b2af1919b69f77c7701237bfc318a9781ec657b68fd4b6ffa9d53f111"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED=ON"
    - "-DBUILD_STATIC=OFF"
    - "-DWITH_CURL=ON"
    - "-DWITH_JANSSON=ON"
    - "-DWITH_GNUTLS=ON"
    - "-DWITH_WEBSOCKET=ON"
    - "-DWITH_WEBSOCKET_MESSAGE_LIST=ON"
    - "-DWITH_YDER=OFF"
    - "-DBUILD_UWSC=OFF"
    - "-DBUILD_ULFIUS_DOCUMENTATION=OFF"
    - "-DBUILD_ULFIUS_TESTING=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libmicrohttpd/1.0.1
    - orcania/2.3.3
    - curl/8.15.0
    - gnutls/3.8.10
    - jansson/2.15.1.1
    - zlib/1.3.1.1
    - gmp/6.3.0.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ohos-subunit-optional.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 依赖链 gmp 必须 override 到已发布/已验证的 6.3.0.1：gmp/6.3.0 无 ohpcd 二进制，conan-center 配方的 tool_require m4/1.4.19 在 OHOS config.guess 无法识别系统（只读 /tmp + hmdfs umask-077 tempdir EACCES + config.sub 无 linux-ohos 分支），不可靠环境变量修复，只能换配方（DRAFT-ulfius-gmp-6.3.0.1-override）"
  - "profile ci/conan/profiles/ohos-aarch64 的 CONFIG_SHELL/SHELL 改 /bin/sh（hmbs 注入的 POSIX sh）而非 /data/service/hnp/bin/bash：HNP bash 在 HMFS/HMDFS getcwd() 返回 ENOTSUP/EINVAL，autotools 全链路失败（HMBS 平台诊断 [shell_getcwd]，同 classads/DRAFT-6487）"
  - "libcheck（check/0.15.2）的 'Checks: N' 汇总数=被注册并执行的测试函数数（与断言宏数量无关），每测试程序输出一次，可跨程序相加得官方用例总数；本包 5 个 Check 程序合计 87（core 12 + u_map 9 + framework 28 + example_callbacks 25 + websocket 13）"
  - "ulfius 的 3 个测试用例（test_ulfius_start_instance / test_ulfius_server_ca_trust / test_ulfius_client_certificate）硬依赖 libmicrohttpd 的 GnuTLS/HTTPS 服务端；libmicrohttpd/1.0.1 发布时关闭 gnutls/HTTPS（'Optional HTTPS (gnutls) kept off'），MHD_USE_SSL 起不来 -> U_ERROR_LIBMHD(4)，3 用例 ohos_feature 阻塞（一个 PR 一个库，不改 libmicrohttpd）"
  - "ulfius 是 shared 库，公开头 include/ulfius.h 在 feature 全开时无条件 include gnutls/jansson/zlib/microhttpd/orcania 头；package_info() 需把全部直接依赖用 'pkg::pkg' 形式写进 cpp_info.requires（Conan 2 跨包引用必须 pkg::component；直接依赖必被 requires 引用否则报错），consumer 编译才找得到这些头"
  - "OHOS 加载器忽略 LD_LIBRARY_PATH，会绑定系统旧 libgnutls.so.30（缺新符号）；test_package 需 LD_PRELOAD 本次构建的 libgnutls.so.30（HMBS 平台诊断 [stale_runtime_library]，参考 airspy/1.0.10 test_package）"
  - "zlib/1.3.1.1 的 CMakeDeps 目标是 ZLIB::ZLIB（find_package(ZLIB)），不是 zlib::zlib（后者是 1.3.1.1.1+ 的命名）；消费者 test_package CMakeLists 需用 ZLIB::ZLIB"
