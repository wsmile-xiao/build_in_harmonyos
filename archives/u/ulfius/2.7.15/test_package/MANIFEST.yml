# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ulfius/2.7.15
homepage: "https://github.com/babelouest/ulfius"

# 上游测试命令 (cmake 构建 + CTest：5 个官方 Check 测试程序，-V 以完整捕获每程序 Checks 汇总)
upstream_check_command: "ctest --test-dir build -V --output-on-failure"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir {build_folder} -V --output-on-failure"

# 上游实际运行的 5 个官方 Check 测试程序
upstream_tests:
  - file: core.c
    source: ulfius-2.7.15/test/core.c
    description: "核心函数测试"
    command: "./core"
  - file: u_map.c
    source: ulfius-2.7.15/test/u_map.c
    description: "struct _u_map 函数测试"
    command: "./u_map"
  - file: framework.c
    source: ulfius-2.7.15/test/framework.c
    description: "框架函数测试（含 HTTPS/CA 信任、客户端证书等端到端服务端场景）"
    command: "./framework"
  - file: example_callbacks.c
    source: ulfius-2.7.15/test/example_callbacks.c
    description: "示例回调测试"
    command: "./example_callbacks"
  - file: websocket.c
    source: ulfius-2.7.15/test/websocket.c
    description: "websocket 测试"
    command: "./websocket"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试: 注册 GET /hello 端点 + 启动 HTTP 框架 + ulfius_send_http_request 请求并校验 200"
    command: "./test_ulfius"

# 上游官方统计口径：以 ctest -V 运行官方 5 个 Check 测试程序、逐程序解析 libcheck
# "Checks: N, Failures: M" 汇总（CTest 单一可解析框架；libcheck 的 Checks 计数=实际执行的
# 测试函数数=被注册的用例数）。本仓库审计源码（test/core.c u_map.c framework.c
# example_callbacks.c websocket.c）逐文件统计被 suite 注册的用例：
#   core 12 + u_map 9 + framework 28 + example_callbacks 25 + websocket 13 = 87。
# 故 upstream_test_total = 87（官方口径，源码可复现，非本机可运行子集）。
#
# 其中 3 个用例硬依赖 libmicrohttpd 的 GnuTLS/HTTPS 服务端能力（MHD_start_daemon
# MHD_USE_SSL），而本仓库发布/使用的 libmicrohttpd/1.0.1 构建时明确
# "Optional HTTPS (gnutls) kept off"（见 l/libmicrohttpd/1.0.1/conanfile.py 及 notes.md）
# ——MHD_USE_SSL daemon 起不来 -> ulfius 映射 U_ERROR_LIBMHD(4)，3 个用例无法通过：
#   - core:    test_ulfius_start_instance        （ulfius_start_secure_framework()==U_OK）
#   - framework: test_ulfius_server_ca_trust      （ulfius_start_secure_ca_trust_framework()==U_OK）
#   - framework: test_ulfius_client_certificate   （ulfius_start_secure_ca_trust_framework()==U_OK）
# 这是依赖库能力缺失（ohos_feature），非 ulfius 缺陷，且本 PR 一个库一条规则的约束下无法
# 改 libmicrohttpd 配方。conanfile.py 会在真机完整执行全部 87 个用例，把这 3 个 MHD-HTTPS
# 依赖用例如实记为 failed+gaps（category=ohos_feature），其余 84 个全部通过，绝不隐藏
# 意外回归。
upstream_test_total: 87
# 计数口径：官方注册用例统计口径为"统计测试注册宏"——逐文件统计 tcase_add_test
# 测试注册宏得到注册用例总数（core 12 + u_map 9 + framework 28 + example_callbacks 25
# + websocket 13 = 87），与 gtest_macros 口径一致（把 tcase_add_test 视为 gtest 的
# TEST() 注册宏，count=tcase_add_test 行数）。libcheck 的 "Checks:" 汇总=被注册并执行的
# 测试函数数（check_run.c srunner_add_failure 每次测试结果 n_checked 仅 +1），故真机
# ctest -V 的 per-program "N%: Checks: X, Failures: Y" 汇总之和 == 87，与 MANIFEST 声明
# 完全一致。单一可解析框架（C 语言 ULib libcheck → ctest）。
upstream_test_count_method: gtest_macros
upstream_test_passed: 84
upstream_test_failed: 3
upstream_test_skipped: 0
upstream_test_not_run: 0

# 上游 Check 用例总数（与 upstream_test_total 对齐：源码审计 87）
assertion_count: 87

# 是否存在上游测试（true）：存在官方 Check 用例并已在真机完整执行
upstream_tests_exist: true
upstream_test_audit:
  - path: "开源 2.7.15 源码 test/ 目录逐文件审计 + 真机 ctest --test-dir <build>/Release -V --output-on-failure"
    finding: "2.7.15 官方携带 5 个 libcheck 测试程序（core / u_map / framework / example_callbacks / websocket），全部经 conan create 的 build() 阶段在 HarmonyOS aarch64 真机按官方 CTest 方式执行。逐文件统计被注册的用例数：core 12、u_map 9、framework 28、example_callbacks 25、websocket 13，合计 upstream_test_total=87（源码可复现的官方口径）。执行 87，其中 84 个真机通过；3 个硬依赖 MHD HTTPS 服务端（libmicrohttpd/1.0.1 发布时显式关闭 gnutls/HTTPS，见其 conanfile 与 notes）的用例 test_ulfius_start_instance / test_ulfius_server_ca_trust / test_ulfius_client_certificate 因 MHD_USE_SSL daemon 无法启动（U_ERROR_LIBMHD=4）如实审计为 ohos_feature 阻塞，作为 gaps 上报，不隐藏、不冒充。无 missing_dependency（HTTPS 是发布二进制缺特性，非可补依赖）。计数以 ctest -V 的 libcheck 'Checks: N' 确定性日志为准，未用可运行子集充总数。"
