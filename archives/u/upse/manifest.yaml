software: upse
display: "UPSE"
description: "PlayStation Sound Format emulator library and command-line player"
category: multimedia
homepage: "https://www.nenolod.net/projects/upse/"
license: GPL-2.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "Build the declared C sources directly with OHOS Clang to avoid obsolete platform and Audacious probes"
    - "Link the published PIC static zlib into libupse without introducing a conflicting system libz.so"
  common_dependencies:
    - zlib

versions:
  "1.0.0":
    status: built
    build_date: "2026-09-29"
    conan_ref: "upse/1.0.0"
