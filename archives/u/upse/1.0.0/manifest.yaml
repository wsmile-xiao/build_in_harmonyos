version: "1.0.0"
software: upse
status: built
build_date: "2026-09-29"
conan_ref: "upse/1.0.0"
build_system: custom

source:
  url: "https://github.com/kaniini/upse/archive/b71b54f315f6f7218c033405d475a2ae31a58dc8.tar.gz"
  sha256: "fa5945a3d49b527f7ae33b2e8d1c5de7d611a02e9a75195e69aa8fa9b2e1c468"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "Direct OHOS Clang build of libupse and upse123"
    - "Shared libupse by default"
    - "Audacious and libao optional integrations disabled"
  dependencies:
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "UPSE 1.0.0 has no upstream automated tests or test target"
  - "The generated Makefile unconditionally enters the optional Audacious plugin directory even when configure disables it"
  - "The core C library and upse123 player can be built directly without optional Audacious or libao SDKs"
