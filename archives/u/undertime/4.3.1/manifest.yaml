# 版本级 manifest — undertime 4.3.1 (ARCHIVE-SPEC v3.0)
version: "4.3.1"
software: "undertime"
status: built
build_date: "2026-09-24"
build_system: "python"

source:
  url: "https://gitlab.com/anarcat/undertime/-/archive/4.3.1/undertime-4.3.1.tar.gz"
  sha256: "841a42903651cc7531903df82003b1f240b6f49d8cfc93241146cc671a3abb1c"
  tar_format: tar.gz

build:
  system: python
  configure_options:
    - "SETUPTOOLS_SCM_PRETEND_VERSION=4.3.1 pip install --no-build-isolation --prefix=<private prefix> ."
  dependencies: []
  cc: ""
  cxx: ""

patches_applied:
  - "0001-undertime-dateutil-fallback.patch"  # dateparser（依赖 regex C 扩展）在 CI 沙箱不可 dlopen 时回退 python-dateutil

test_results:
  type: explicit
  total: 10
  passed: 10
  failed: 0
  skipped: 0
  command: "TZ=UTC python3 -m pytest test_undertime.py -v"
  notes: "上游 pytest 套件在 conan build() 内真实执行（R51）；本地 python 3.12.9 与 CI 等价 HNP python 3.12.8 沙箱均实证 10/10"

knowledge_gained:
  - "本平台无 /usr/share/zoneinfo，stdlib zoneinfo（tzlocal 依赖）找不到任何时区，抛 ZoneInfoNotFoundError → 需随包 vendored PyPI tzdata（ref: E632）"
  - "环境级 PIP_TARGET 等 PIP_* 配置与配方内私有 --prefix/--target 安装冲突（Cannot set --home and --prefix together）→ 调用 pip 前剥离 PIP_*（ref: E633）"
  - "setuptools_scm 从 git tag 取版本，发布 tarball 不是 git checkout，构建在元数据阶段失败 → 注入 SETUPTOOLS_SCM_PRETEND_VERSION（ref: E634）"
  - "OHOS CI worker 的 HNP python（AppSpawn 沙箱）无法 dlopen 用户空间 C 扩展 .so（Permission denied）：dateparser 依赖的 regex、moonphases 依赖的 ephem 均不可用 → pip 依赖需纯 Python（或带纯 Python 回退如 pyyaml），功能缺失走方案 A 关闭（moonphases 不出包）（ref: E636）"
