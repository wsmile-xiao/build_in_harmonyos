# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: undertime/4.3.1
homepage: "https://gitlab.com/anarcat/undertime"

# 上游测试命令 (setup.cfg [tool:pytest] addopts = --cov=undertime --doctest-modules;
# tox.ini testenv 固定 TZ=UTC 并执行 `pytest`)
upstream_check_command: "python3 -m pytest test_undertime.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest test_undertime.py -v"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_undertime.py
    source: undertime-4.3.1/test_undertime.py
    description: "上游 pytest 套件（10 个用例）：表格/重叠计算、时区猜测、日期解析、--list-zones、--version、OffsetZone、compute_table"
    command: "python3 -m pytest test_undertime.py -v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_undertime_pkg.py
    description: "消费已安装包：console script 存在/可执行/shebang 可移植、undertime --version、真实时区表计算、7 个 vendored 纯 Python 运行时依赖可导入"
    command: "python3 test_undertime_pkg.py <pkg>/bin <pkg>/lib/pythonX.Y/site-packages"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
