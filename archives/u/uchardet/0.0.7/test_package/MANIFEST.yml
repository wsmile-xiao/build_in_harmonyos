# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: uchardet/0.0.7
homepage: "https://www.freedesktop.org/wiki/Software/uchardet/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test() -> ctest (116 corpus tests, 5 known-broken skipped upstream)"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/uchardet-tests.c
    source: uchardet-v0.0.7/test/uchardet-tests.c
    description: "上游语料库检测测试：test/<lang>/<charset>/ 下 116 个语料文件，逐个断言检测结果与目录名一致（上游 CMakeLists 跳过 5 个已知损坏项 ja:utf-16le/be、es:iso-8859-15、da:iso-8859-1、he:iso-8859-8）"
    command: "./uchardet-tests <corpus-file>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公共 C API (uchardet_new/handle_data/data_end/get_charset/reset/delete) 检测 4 段已知编码字节序列 (ASCII/UTF-8/GB18030/BIG5) 并断言结果，样本预先经上游 CLI 在 OHOS 上实测验证"
    command: "./test_uchardet"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 120
