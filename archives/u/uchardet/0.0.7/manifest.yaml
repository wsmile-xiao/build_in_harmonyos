software: uchardet
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.0.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 构建系统（顶层必填，submit 自检 _REQUIRED_MANIFEST_FIELDS）
build_system: cmake

# 版本号
version: "0.0.7"

# 编译状态
# published | built | failed | archived
# conan-verify 八道门禁全 PASS，CI release 流水线 conan upload 待 PR 合入后执行
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.freedesktop.org/uchardet/uchardet/-/archive/v0.0.7/uchardet-v0.0.7.tar.gz"

  # 源码校验和
  sha256: "f3635d1d10e1470452bc42c1bf509451a9926b399a11740a9949e86069d69f58"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
  # - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 cmake_minimum_required(2.8.5)：CMake>=4.0 必须以 cache 变量传 CMAKE_POLICY_VERSION_MINIMUM=3.5（tc.cache_variables），普通 tc.variables 写入 toolchain set() 对 cmake_minimum_required 太晚不生效"
  - "库本体为 C++（LINKER_LANGUAGE CXX），C 消费者测试程序需 set_target_properties LINKER_LANGUAGE CXX 才能解析 libc++ 符号（operator new/delete、__cxa typeinfo）"
  - "OHOS 本机构建时 CMake 自检为未知平台 HarmonyOS，共享库无 SONAME/版本化规则：需显式 tc.cache_variables['CMAKE_SYSTEM_NAME']='Linux'（abcmidi 先例），否则 shared 变体 CLI 记录相对 NEEDED ../libuchardet.so 包外不可解析"
