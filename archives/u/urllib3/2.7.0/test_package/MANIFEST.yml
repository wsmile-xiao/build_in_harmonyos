package: urllib3/2.7.0
homepage: "https://github.com/urllib3/urllib3"

upstream_check_command: "python3 -m pytest test/"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest test/"

upstream_tests:
  - name: test/（18 个 test_*.py + with_dummyserver 子集——HTTP 客户端测试套件）
    count: 2280
    description: "**实测 1781 passed / 96 failed / 68 errors / 335 skipped / 4 xfailed（2280 收集）**——python3 -m pytest test/（测试依赖 trio/quart/httpx/pyopenssl/brotli/zstandard 已装——**装 pyopenssl/brotli/zstandard 后消除 PyOpenSSL 122 个与 zstd/brotli 约 20 个 skipped 转真实运行**）；96 failed 含 with_dummyserver/ TLS 接口环境受限与 contrib/pyopenssl 测试问题（测试基础设施环境，非 urllib3 缺陷，如实分类）；335 skipped 为需特定环境/网络/依赖的场景（TLSv1/TLSv1.1 108 个、IPv6 7 个等——环境限制，如实）"

test_package_tests:
  - file: test_urllib3.py
    description: "冒烟测试：真实调用 parse_url + HTTPResponse（R34——纯用户态，无需网络）"
    command: "python3 test_urllib3.py <site-packages>"

assertion_count: 4
