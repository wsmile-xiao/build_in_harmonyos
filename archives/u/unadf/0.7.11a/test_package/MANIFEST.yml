package: unadf
version: 0.7.11a
summary: >
  ADFlib + unadf CLI on OHOS aarch64. Upstream ships a hand-written Makefile
  tree from 2006/2007 whose on-disk Amiga block structures are declared with
  `long`, and whose adf_env.c aborts unless sizeof(long)==4. Debian's own
  64-bit-fixes patch (Debian bug #458129) rewrites those fields to
  int32_t/uint32_t; it is shipped here verbatim as
  patches/0002-lp64-fixed-width-on-disk-structs.patch. Debian's
  source-code-fixes patch is shipped as
  patches/0001-fix-stray-comment-terminator-and-defendian-include.patch.

upstream_test_suite:
  present: false
  declared_upstream_cases: 0
  reason: >
    The unadf 0.7.11a tarball ships no test suite at all. The tarball contains
    94 entries: Lib/ (library sources + headers), Demo/unadf.c (the CLI),
    Docs/ (API HTML), Faq/ (documentation + images), Boot/stdboot3.bbk (a data
    file), Bin/Linux/libadf.a (a stale prebuilt i386 archive, not used), and
    Visual Studio .dsp/.dsw project files. There is no t/, tests/, check or
    runtest target in either Makefile, and no CI configuration. The 0/0
    declaration reflects the upstream reality, not a skipped run.

consumer_test:
  kind: real invocation of the packaged artifacts
  files:
    - test_unadf_lib.c
    - test_unadf_cli.sh
  assertions: 14
  counted: 14
  passed: pending-device-run
  what_it_does: >
    test_unadf_lib.c is compiled and linked against the packaged libadf.a and
    the packaged headers, then run. It exercises the real library API:
    adfEnvInitDefault() (the LP64 startup guard — on a 64-bit target it calls
    exit(1) unless the Debian fix is applied, so reaching the first PASS line
    is itself the proof that the on-disk structures are fixed-width),
    adfCreateDumpDevice(), adfCreateHdFile() (writes a genuine FFS volume with
    boot block, bitmap and root block to disk), adfReleaseDumpDevice(), then
    re-opens and adfMount()s the file it just wrote and asserts the volume name
    round-trips and the dosType reads back as FFS.

    test_unadf_cli.sh then drives the packaged unadf binary against that same
    image, checking: -h exits 0 and prints the program name; a missing input
    exits non-zero; -l lists the image, prints the device geometry and shows
    the volume name that libadf wrote; -r recursive listing exits 0; and -d
    extraction runs without abort. The image size is asserted to be exactly
    901120 bytes (880 blocks x 2 interleaved x 512), which is what a real
    standard Amiga floppy dump is.

known_platform_deviations:
  - >
    The two Debian patches are applied in the order 0001, 0002, which is the
    reverse of the numeric order of their upstream names. Debian's
    64-bit-fixes patch carries context lines that only exist after
    source-code-fixes has landed (adf_bitm.c:35 reads
    `#include"Win32/defendian.h"`, which is source-code-fixes' rewrite of
    `#include"defendian.h"`). GNU patch(1) absorbs the mismatch with fuzz;
    conan 2's apply_conandata_patches() defaults to `git apply -p1`, which
    does not. The quilt headers were additionally rewritten from Debian's
    `--- unadf-0.7.11a.orig/...` / `+++ unadf-0.7.11a/...` to `a/` and `b/`
    so `git apply -p1` resolves the targets under strip_root; the hunk bodies
    are byte-identical to Debian's.
  - >
    The upstream shared-library target is not used. The library is delivered
    static-only: the Lib/Makefile shared rule builds libadf.so.0.7.11 with no
    SONAME or versioning machinery, and OHOS provides its own process model.
  - >
    Lib/Makefile hardcodes CC=gcc and both Makefiles end with `include .depend`
    (a file whose entire content is one newline). The recipe overrides the
    toolchain on the make command line from Conan conf (R33) and passes an
    empty DEPEND= so nothing tries to regenerate the dependency file.
