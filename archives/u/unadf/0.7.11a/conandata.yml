sources:
  unadf/0.7.11a:
    url: "https://deb.debian.org/debian/pool/main/u/unadf/unadf_0.7.11a.orig.tar.gz"
    sha256: "fa9e0e34b1b0f4f4287905a3d485e3bba498451af98d6c12be87ab3a2b436471"

# Application order matters. These are two independent Debian quilt patches,
# but 0002 (64-bit-fixes) carries context lines that only exist once 0001
# (source-code-fixes) has landed -- e.g. adf_bitm.c:35 reads
#   #include"Win32/defendian.h"
# which is exactly 0001's rewrite of #include"defendian.h". GNU patch(1)
# absorbs the mismatch with fuzz; conan 2's apply_conandata_patches() defaults
# to `git apply -p1`, which is strict and aborts. So the list is ordered
# 0001, 0002 and the file numbers match the list positions.
#
# The quilt headers were also rewritten from Debian's
#   --- unadf-0.7.11a.orig/...  +++ unadf-0.7.11a/...
# to a/ + b/ so `git apply -p1` can find the targets under strip_root. The
# hunk bodies are byte-identical to Debian's patches.
patches:
  - patch_file: "patches/0001-fix-stray-comment-terminator-and-defendian-include.patch"
    patch_description: >
      Header fixes taken verbatim from Debian's unadf 0.7.11a-5+deb12u1
      (debian/patches/source-code-fixes, last updated 2012-05-31). It removes
      a stray duplicated comment terminator in Lib/Generic/adf_nativ.h and
      Lib/Generic/adf_nativ.c that makes any modern compiler fail with
      "expected identifier or '('" on line 23, and repoints the seven
      #include "defendian.h" sites at "Win32/defendian.h" — the header that
      actually ships in the tarball, which defines LITT_ENDIAN=1 for a
      little-endian host.
    patch_type: "portability"
  - patch_file: "patches/0002-lp64-fixed-width-on-disk-structs.patch"
    patch_description: >
      LP64 fix taken verbatim from Debian's unadf 0.7.11a-5+deb12u1
      (debian/patches/64-bit-fixes, by Henri Nowotka, Debian bug #458129).
      Rewrites the on-disk Amiga block structures from `long` to
      int32_t/uint32_t and relaxes adf_env.c's startup guard from
      sizeof(long)==4 to sizeof(int32_t)==4. Without it the tool exits 1
      immediately on any 64-bit target.
    patch_type: "portability"
