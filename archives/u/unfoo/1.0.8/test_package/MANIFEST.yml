package: unfoo/1.0.8
homepage: "https://github.com/vitaminmoo/unfoo"
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: tests/test_exit_status.sh
    source: tests/test_exit_status.sh
    description: "Three exit status cases"
    command: "make test"
  - file: tests/test_file_extract.sh
    source: tests/test_file_extract.sh
    description: "Single-stream gzip/bzip2/lzma/xz extraction"
    command: "make test"
  - file: tests/test_no_folder.sh
    source: tests/test_no_folder.sh
    description: "Archive with no top-level folder"
    command: "make test"
  - file: tests/test_single_file.sh
    source: tests/test_single_file.sh
    description: "Archives containing one file"
    command: "make test"
  - file: tests/test_with_subfolders.sh
    source: tests/test_with_subfolders.sh
    description: "Archives containing nested folders"
    command: "make test"
test_package_tests:
  - file: consumer.c
    description: "OHOS-specific Conan consumer: packaged unfoo extracts C source, cross-compile static aarch64 executable, qemu executes and checks output"
    command: "conan create . -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
assertion_count: 1
