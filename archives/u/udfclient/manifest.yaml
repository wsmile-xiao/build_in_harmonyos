# 软件级 manifest — udfclient
# 遵循 ARCHIVE-SPEC v2.0

software: udfclient
display: "udfclient (UDFtoolkit)"
description: "UDF 文件系统工具集（udfclient 交互客户端、udfdump 转储、newfs_udf 格式化、cd_sessions/cd_disect/mmc_format 光盘工具）"
category: utility
homepage: "https://www.13thmonkey.org/udfclient/"
license: ClArtistic

build_system: autotools

ohos_adaptation:
  key_points:
    - "E007/E160: config.guess 增加 HarmonyOS 分支（2018 老式结构需 echo+exit），输出 aarch64-unknown-linux-ohos"
    - "E205: config.sub 在 maybe_os 与 Basic OS 列表接受 linux-ohos*，供 conan 工具链三元组使用"
    - "E114: configure 内 config.status 临时目录需移除 umask 077（HMDFS setgid 目录属主不可写）"
    - "E074: make 必须 -j1（HMDFS/TMPDIR jobserver fifo EPERM）"
    - "Makefile.in 为 BSD make 语法，需静态模式规则 + VPATH 才能在 GNU make/out-of-source 下构建"
  common_dependencies: []

versions:
  "0.8.21":
    status: built
    build_date: 2026-09-27
    notes: "conan-verify G0-G4 全通过；test_package 13 项消费者断言全过；4 个补丁（Makefile.in/config.guess/config.sub/configure）"
