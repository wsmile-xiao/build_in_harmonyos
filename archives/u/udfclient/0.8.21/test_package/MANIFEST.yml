# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: udfclient/0.8.21
homepage: "https://www.13thmonkey.org/udfclient/"

# 上游测试命令 — udfclient 0.8.21 上游没有自动化测试套件 (R51 清点证据):
#   1) tarball 内无 tests/ 或 test/ 目录: `tar tzf UDFclient.0.8.21.tgz | grep -c test` = 0
#   2) Makefile.in 无 check/test 目标 (仅 all/install/depend/clean/cleandir 与
#      libudf.a / libuscsi.a / 程序链接规则)
#   3) configure.ac 无 AC_CONFIG_TESTDIR / 测试注册
# 上游没有可运行的 check 目标, 因此该字段留空 (仅保留清点证据)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (上游无测试程序)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 鸿蒙特有)
test_package_tests:
  - file: test.sh
    description: "消费者端到端测试: 六个工具用法横幅; newfs_udf 创建 UDF 镜像; udfdump 描述符顺序扫描/挂载卷集/目录树; udfclient 只读挂载并列出文件集; 缺失镜像负向控制"
    command: "bash test.sh"

# 测试断言总数 (test.sh 中 grep -q / test -s / 负向 if 断言, 共 13 项)
assertion_count: 13
