# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "E007/E160: 2018 版老式 config.guess 的 HarmonyOS 分支必须 echo+exit（该版本分支无统一出口）；框架 patch-autotools-ohos.pl 仅适配新式结构，未命中时按实际结构手写"
  - "E205: config.sub 需在 maybe_os 判定分支与 Basic OS 列表两处加入 linux-ohos*，才能接受 conan 工具链的 --host=aarch64-linux-ohos / --build 三元组"
  - "E114: HMDFS 上 umask 077 创建的 drwx--S--- 目录属主不可写（非 owner 权限判定），configure 内 config.status 临时目录需移除 umask 077"
  - "E074: make -j>1 在 HMDFS/TMPDIR 创建 jobserver fifo 被拒（Operation not permitted），必须 -j1"
  - "udfclient Makefile.in 为 BSD make 语法（$(.TARGET)），GNU make 下需改为静态模式规则（$@.o）才能构建"

