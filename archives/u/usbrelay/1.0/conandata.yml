# conandata.yml — usbrelay 1.0（Darryl Bond 的 USB 继电器板驱动库 + CLI）
# 官方源（R39 合规：GitHub 上游 tag archive；同已合入先例 archives/l/libuio/0.3.0）
# sha256 三源一致：本机 curl、设备 curl(codeload)、hw-coord 派单核验值。
#
# 构建形态：上游是裸 Makefile（C 库 libusbrelay.so + CLI usbrelay），
# 另含 python 绑定（libusbrelay_py.so/setup.py）与 usbrelayd 附加子包——
# 本次只打 C 本体，python/daemon 不在归档范围（派单口径）。
# 后端切换零补丁：Makefile `HIDAPI = hidraw` 为普通 `=` 赋值，make 命令行
# `HIDAPI=libusb` 即覆盖（命令行变量优先级高于文件赋值），改用与 ohpcd 已发布
# hidapi/0.15.0（libusb 后端，cpp_info.libs=["hidapi-libusb"]）一致的公共 API
# 后端；hidapi 两后端公共 C API 相同，属后端选择而非源码改动。
# PREFIX=/usr 同理由命令行 PREFIX=/ + DESTDIR=package_folder 覆盖，非 sed 补丁。

