# 文件位置: archives/u/usbrelay/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0"

software: usbrelay

# 编译状态：published | built | failed | archived
status: built

build_date: "2026-09-24"

build_system: make

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/darrylb123/usbrelay/archive/refs/tags/1.0.tar.gz"
  sha256: "f69684b7544623fbb9845542251b20020c9e490aba9f0624ec3ae89b2b2c191b"
  compression: tar.gz
  archive_root: "usbrelay-1.0"
  note: >-
    GitHub 官方 tag archive（R39）。三源同值：本机 curl、设备 codeload curl、
    hw-coord 派单核验（466023B/25 文件）。python 绑定（setup.py/libusbrelay_py.c）
    与 usbrelayd 属额外子包，本次只打 C 本体（派单口径）。

# ============================================================
# 依赖
# ============================================================

dependencies:
  required:
    - hidapi/0.15.0      # 公共 C API <hidapi/hidapi.h>；后端经 make 命令行切 libusb（ohpcd 发布形态）
    - argp-standalone/1.4.1  # E169 主解：musl/OHOS 无 glibc argp(3)，CLI usbrelay.c 依赖（已发布 static 制品，-largp 经 AutotoolsDeps 注入）
  build: []
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos-clang
  options:
    - "make HIDAPI=libusb"                       # 命令行覆盖上游 `HIDAPI = hidraw`（=普通赋值，命令行优先级更高），切到已发布后端
    - "make install PREFIX=/ LIBDIR=/lib DESTDIR=<pkg>"  # 覆盖写死 /usr；LIBDIR 显式给值防设备根 /lib64 探测分支改写
  notes: >-
    裸 Makefile（无 configure/无 CMake）；AutotoolsToolchain 注入 CC/CFLAGS/LDFLAGS
    （含 hidapi 的 -I/-L）。上游 install 规则装 libusbrelay.so→LIBDIR 与
    usbrelay CLI→bin；不装头文件，配方在 package() 补 copy libusbrelay.h→include/。
    gitversion.h 由 Makefile 现场生成（无 .git 时回落目录名），不纳入断言。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []   # 零源码修改：后端与安装路径均经 make 命令行变量覆盖

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: partial-functional
  issues:
    - "OHOS 数据面权限缺口（真机探针实证）：/dev/hidraw0 与 /dev/hidraw1 节点存在，但用户态 open(O_RDWR) 返回 EACCES(errno=13)；/dev/hidraw2 不存在。上游放权路径是 50-usbrelay.rules 的 udev 规则（KERNEL==\"hidraw*\", MODE=...），而 OHOS 无 udev ⇒ 枚举恒 0，无法在用户态验证真实继电器控制。"
    - "归档范围限定 C 本体：libusbrelay_py.so（python 绑定，setup.py 写死 /usr/lib/x86_64-linux-gnu 交叉不可用）与 usbrelayd（额外子包）本次不打包。"
  notes: >-
    交付面=编译/链接/打包/API 行为验证全绿（消费者 5/5）；设备控制功能面
    因上述权限模型只能按"枚举为空"如实收口，PR 正文与 notes 不声称可驱动真实板卡。
    hidraw 后端与 libusb 后端公共 API 等价，本包链已发布 hidapi/0.15.0（libusb 形态）。

# ============================================================
# 测试结果（五维账本）
# ============================================================

test_results:
  type: consumer
  static_total: 0          # N_static：上游无自动化测试注册（全树无 TESTS/ctest/make check/断言入口）
  review_count_total: 1    # 审查实测口径：test.py 演示资产数（PR 正文「上游表合计」按此申报，§12.72 宁高勿低）
  registered_total: 0      # N_registered
  executed_total: 0        # N_executed：上游无可执行对象（非跳过：清单证据见 notes.md「上游测试清点」）
  not_executed:
    - count: 1
      what: "test.py（仓库唯一测试命名文件）"
      reason: "只 print 无断言的手工演示脚本；且入口 import usbrelay_py（python 绑定，本次不打包），运行前提是插着真实 USB 继电器板——非 §10 自动化测试入口，不计分母也不虚报执行"
  skipped: []
  consumer_programs: 1     # N_consumer：test_package/test.c
  consumer_assertions: 5   # A1 version / A2 枚举一致性 / A3 find_board NULL / A4 坏路径报错 / A5 shutdown
  passed: 5                # 消费者断言 5/5（type=consumer）；不含任何上游用例——上游不存在自动化测试
  failed: 0
  note: |
    消费者测试（赛道二硬门禁）以库使用者身份编译、链接 libusbrelay.so 并调用公开
    C API：libusbrelay_version 非空、enumerate_relay_boards 调用链穿透 hidapi
    （hid_enumerate）无崩溃且与 get_relay_board_count 一致（OHOS 上为 0，见
    compatibility.issues 的探针实证）、find_board 未命中路径、operate_relay
    坏路径负值、shutdown 干净退出。ctest 1/1 + 直跑双路径通过。
    "上游 0 测试"按 §10 以清点证据如实申报（notes.md），功能验证由消费者测试承担。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "knowledge_ref: DRAFT-usbrelay-1.0-ohos-hidraw-devnodes-eacces-no-udev-data-plane —— OHOS 真机 /dev/hidraw* 节点存在（0/1）但用户态 open(O_RDWR)=EACCES、且上游放权依赖的 udev 规则机制在 OHOS 不存在；hidapi 公共 API 调用链可通（枚举恒 0 无崩溃）——所有 /dev/hidraw 数据面包的收口模板与签名判据（KB index.tsv hidraw 0 命中；E237=特权 daemon 运行期降级族，签名不含本数据面形态）"

knowledge_refs:
  - "E237（特权 daemon 运行期降级——本包非 daemon，定性差异见 notes.md）"
  - "DRAFT-PKG-VER-suckless-baked-paths-makevar-override（上游写死 PREFIX 的覆写手法——实测本包更简单：命令行变量即可，草稿的 sed 分支未用）"
  - "archives/h/hidapi/0.15.0（依赖包形态：libusb 后端，cpp_info.libs=[hidapi-libusb]）"
