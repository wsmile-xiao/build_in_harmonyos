# test_package/MANIFEST.yml — usbrelay 1.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: usbrelay/1.0
homepage: "https://github.com/darrylb123/usbrelay"

# 上游测试命令：无。上游不存在 make check / ctest / TESTS 自动化入口。
upstream_check_command: "(none: upstream has no automated test entry)"

# conanfile.py build() 未集成上游测试——因为上游没有可执行测试套件：
# 仓库唯一 test.py 是需要真实继电器板 + libusbrelay_py python 绑定（本次不打包）
# 且只 print 无断言的手工演示脚本，不构成 §10 测试入口（清点证据见 ../notes.md）。
# 功能验证由消费者测试承担（下方 test_package_tests）。
upstream_test_in_build: false
upstream_test_command: "(none)"

# 上游实际运行的测试程序：0 个（如实申报，非"跳过不跑"）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实编译链接 usbrelay::usbrelay（libusbrelay.so）并调用公开 C API，5 组断言——A1 libusbrelay_version() 非空；A2 enumerate_relay_boards() 无崩溃且与 get_relay_board_count() 一致（OHOS 上枚举为 0：/dev/hidraw0/1 存在但 open EACCES 且无 udev 放权，属数据面权限收口，详见 notes.md）；A3 find_board 未命中返回 NULL；A4 operate_relay 坏路径返回负值；A5 shutdown 干净返回"
    command: "./test_usbrelay"

# 测试断言总数 (test.c 实测 5 组)
assertion_count: 5
