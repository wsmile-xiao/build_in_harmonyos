software: uucpsend
display: "uucpsend"
description: "INN 的 UUCP 批处理前端：按站点控制文件调度 ctlinnd/batcher/uux 投递 Usenet 文章"
category: network
homepage: "https://www.infodrom.org/projects/uucpsend/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只有手写 POSIX Makefile：补 all: 默认目标、DESTDIR 分期安装与可覆盖的 BINDIR/CONFDIR/MANDIR"
    - "CC/CFLAGS/CPPFLAGS/LDFLAGS 改 ?=，否则 make 普通赋值会覆盖 Conan 注入的工具链环境变量"
    - "install 规则去掉无条件的 -o root -g root 与 install -d，非 root 构建用户才可打包"
    - "SHELL 固定 /bin/sh——OHOS 无 /bin/bash"
    - "index() 改 strchr()、删除 <malloc.h>：musl 不提供 BSD 别名与非标准头"
    - "paths.h 中的 INN/UUCP 绝对路径保持上游原样，改配置属功能变更，超出适配范围"
  common_dependencies: []
  runtime_prerequisites:
    - "inn2（ctlinnd、batcher）"
    - "uucp（uux）— 尚未发布到制品仓"

versions:
  "1.1":
    status: built
    build_date: "2026-10-02"
