software: uucpsend
version: "1.1"
status: built
build_date: "2026-10-02"
conan_ref: "uucpsend/1.1"
build_system: makefile

source:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/u/uucpsend/uucpsend_1.1.orig.tar.gz"
    - "https://mirrors.aliyun.com/debian/pool/main/u/uucpsend/uucpsend_1.1.orig.tar.gz"
    - "https://mirror.nju.edu.cn/debian/pool/main/u/uucpsend/uucpsend_1.1.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/main/u/uucpsend/uucpsend_1.1.orig.tar.gz"
    - "https://www.infodrom.org/projects/uucpsend/download/uucpsend-1.1.tar.gz"
  sha256: "3447ff358e21c9927f4a35409218bf6f77c6caaceeed298bc15a8cb6dec065bc"
  tar_format: tar.gz
  provenance_note: >-
    官方源 www.infodrom.org 是项目主页指向的规范发布地址；Debian 的 pristine
    orig 包与其逐字节相同（sha256 均为 3447ff35…），构成等价镜像，故用单个
    sha256 覆盖全部 URL，由 Conan get() 顺序回退。适配阶段实测 5 个 URL
    全部下载并哈希一致（其中 mirrors.ustc.edu.cn 该文件异常、仅 879 B，已剔除）。
    URL 顺序刻意采用「国内镜像在前、官方源兜底」，与本仓 archives/u/uucp/1.07
    （上游 ftp.gnu.org 在 CI 侧不可达）的既有做法一致：首轮 CI 报
    「源码下载超时 / Worker 网络受限」，故不再把可达性押在单一主机上。

build:
  system: makefile
  target: all
  build_flags:
    - "CFLAGS=-O2 -g -Wall -fPIE -fstack-protector-strong -std=gnu89"
    - "LDFLAGS=-pie -Wl,-z,relro,-z,now"
    - "DEBUG=1 (Debug/RelWithDebInfo，用于关闭上游无条件 -s strip)"
  cc: clang
  toolchain_note: >-
    CC/AR/RANLIB 取自 profile 的 tools.build:compiler_executables（R33），经
    generate() 写入名为 conanbuild 的环境脚本（ConanFile.run() 默认加载的
    环境文件名）。上游 Makefile 的 `CC = gcc` 被补丁 0001 改为 `CC ?=`，否则
    make 的普通赋值会覆盖环境变量。

  # 上游 Makefile 无 configure/DESTDIR，install 规则由补丁 0001 改造为
  # DESTDIR 分期安装，配方再据 DESTDIR 复制进 package_folder。
  install_method: "make DESTDIR=<stage> install + 配方显式复制"

  # 链接期第三方依赖：无。程序只用 libc。
  dependencies: []
  system_libraries: []

  # 运行期前置条件（非 Conan 依赖，不参与图求解）：
  # uucpsend 通过 system(3)/popen(3) 调用下列外部程序，路径在上游 paths.h 中
  # 编译期硬编码。
  runtime_prerequisites:
    note: >-
      以下均为运行期子进程目标，不是链接期符号，因此不建模为 requires()，
      单独打包不会拉入它们。离开 INN/UUCP 部署时程序仍可编译、打包、
      解析控制文件，只是批处理路径无法真正投递。
    tools:
      - tool: "ctlinnd"
        path: "/usr/lib/news/bin/ctlinnd"
        provider: "inn2/2.7.4"
        status: "published"
        evidence: >-
          conan download inn2/2.7.4 -r=ohpcd --only-recipe 成功；
          conan list 'inn2/2.7.4:*' -r=ohpcd 显示二进制包
          21b17f8b2bc0e9511e276e3d57a23893067cefe5（OHOS 6.0/armv8/Release）。
      - tool: "batcher"
        path: "/usr/lib/news/bin/batcher"
        provider: "inn2/2.7.4"
        status: "published"
        evidence: "同 ctlinnd"
      - tool: "uux"
        path: "/usr/bin/uux"
        provider: "uucp/1.07"
        status: "MISSING"
        evidence: >-
          conan list 'uucp/*' -r=ohpcd 返回 “There are no matching recipe
          references”；conan list 'uucp/1.07:*' -r=ohpcd 返回
          “error:system acceleration policy not enabled.”；
          conan download uucp/1.07 -r=ohpcd --only-recipe 同样报该错误。
          配方本体已在 main（commit 5b8165f5ad，archives/u/uucp/1.07），
          但其 manifest 仍为 status: built，未发布到 ohpcd。
      - tool: "df / du / sort / mv / cat / rm"
        path: "/bin/df /usr/bin/du /usr/bin/sort /bin/mv /bin/cat /bin/rm"
        provider: "系统工具（非 Conan 包）"
        status: "device-dependent"
        evidence: "libc 之外的 POSIX 工具，需在部署环境确认存在"

patches_applied:
  - "0001-Makefile-configurable-toolchain-and-staged-install.patch"
  - "0002-uucpsend.c-use-strchr-instead-of-BSD-index.patch"
  - "0003-uucpsend.c-fix-free_sites-lvalue-cast.patch"

patch_classification:
  - file: 0001-Makefile-configurable-toolchain-and-staged-install.patch
    type: portability
    platform_only: true
    summary: >-
      all: 默认目标（上游仅有 uucpsend:，无 all）；CC/CFLAGS/CPPFLAGS/LDFLAGS
      改 ?=；STRIP 仅在未设 DEBUG 时取 -s；DESTDIR 分期安装 +
      BINDIR/CONFDIR/MANDIR 可覆盖；install 规则去掉无条件的
      `-o root -g root`（非 root 构建必然失败，且 `OWNER=` 的空值写法会让
      install 吞掉下一个参数），改用 mkdir -p + install -m；SHELL 固定
      /bin/sh（OHOS 无 /bin/bash）。
  - file: 0002-uucpsend.c-use-strchr-instead-of-BSD-index.patch
    type: portability
    platform_only: true
    summary: >-
      index() -> strchr()（5 处）；删除 <malloc.h>。musl 仅在 _BSD_SOURCE
      下声明 index()，且不提供 <malloc.h>，原样编译会产生隐式声明并可能
      因头文件缺失直接失败。
  - file: 0003-uucpsend.c-fix-free_sites-lvalue-cast.patch
    type: portability
    platform_only: false
    summary: >-
      free_sites() 的形参类型写成 `struct s_sites *`——该 tag 在程序中根本
      不存在（只有 `struct s_site`）；函数体又对强制转换赋值
      `(struct s_sites *)act = ...`。clang 把「对 cast 赋值」判为硬错误
      （assignment to cast is illegal, lvalue casts are not supported），
      因此**未打补丁的上游源码在 OHOS 工具链下完全无法编译**。改为
      `struct s_site *` 形参并直接赋值即可，同时消除 3 处
      incompatible-pointer-types。真机首轮构建实测发现（见
      reports/device-build.md）。

test_results:
  # 上游无自动化测试套件（无 check/test 目标、无测试目录、无测试源文件）。
  upstream_automated_total: 0
  upstream_check_entry_executed: false
  upstream_test_note: >-
    上游发布包不含任何测试资产。build() 只驱动上游唯一存在的入口
    `make all`，并在日志中记录“无测试套件”，不以任何方式虚构通过率。
  test_package_total: 15
  test_package_passed: 15
  test_package_failed: 0
  test_package_status: "passed-on-device"
  test_package_note: >-
    真机实跑 15/15 通过（reports/device-build.md §4）。断言数由最初的 17 调整
    为 15：首轮失败的一条是我的断言写错——它假定必然走到 `end <site>`，但
    `makelock()` 写 /var/run/innd/LOCK.<site>（paths.h 硬编码），无 INN 部署
    时该目录不存在，程序报 "Can't open lock file" 后 `continue`，在 `end`
    之前就跳出。这是无 INN 主机上的正确行为，已改为接受两种确定终态之一。
    被检查的实质行为（解析、诊断、参数、退出码、日志回退）一条未减，未为
    让测试变绿而放宽检查。

device_build:
  date: "2026-10-02"
  path: reports/device-build.md
  run_dir: "$HOME/ohos-adapt-runs/uucpsend-1.1-20261002-220719"
  isolation: "private CONAN_HOME seeded from the device's settings.yml/global.conf/remotes.json"
  recipe_revision: "6c16e7ec911df6111e8c6c20ff7c8e53"
  package_id: "6b129b068851896169fae42d399fa922d239ce8a"
  binary_sha256: "70ff4a24a4700bfeed7492fe268a366054fafd1f9f9b032f8a08137dbea2fb86"
  binary_bytes: 43456
  profile_note: >-
    仓库的 ci/conan/profiles/ohos-aarch64 在本机不可直接用：其
    /data/service/hnp/bin/clang 路径在该设备上不存在，真实工具链位于
    /storage/Users/currentUser/usr/local/bin/clang。本轮用派生 profile
    （settings 相同，compiler_executables 指向真实 wrapper，
    PATH 补 /data/service/hnp/bin 以提供 git，TMPDIR 指向可写目录）。
  platform_findings:
    - >-
      该设备的 /tmp 只读，clang wrapper 会报 "unable to make temporary file"，
      必须设置 TMPDIR（避坑指南 §13）。
    - >-
      git 不在非交互 shell 的 PATH 里，实际位于 /data/service/hnp/bin/git；
      Conan 需要它。
    - >-
      在本设备上，source 过 conanbuild.sh 之后再运行 make 必 SIGSEGV
      （Error -11），而同样的变量用 env(1) 逐个/一起注入则完全正常，
      不加载该脚本也正常。属平台环境交互问题，非配方逻辑错误。配方因此
      不依赖 conanbuild 脚本，改为把 CC 作为 make 命令行变量显式传入。

validation:
  local:
    source_urls_reachable: passed
    sha256_matches_all_urls: passed
    official_vs_debian_orig_identical: passed
    patch_dry_run_on_pristine: passed
    patch_semantic_assertions: passed
    makefile_parse_gnu_make_4_2_1: passed
  device:
    conan_create_g2: passed
    test_package_l1: "15/15 passed"
    l4_elf_hardening: passed
    l5_artifact: passed
    shadow_ci_l0_l2_l3: blocked-by-ci-infrastructure
  ci:
    attempts: 4
    builds: ["#67882", "#68733", "#68764", "#68808"]
    verdict: "all four failed identically at worker-prep / git-clone with 'SSH bridge exec failed ... Connection refused'; conan create never started"
    diagnosis: >-
      CI 侧基础设施故障，非本包问题。第 4 次构建（#68808）跑的是「国内镜像
      优先」版本的 conandata，失败症状与前三轮逐字相同，证明失败与源码 URL
      无关。同期 10 个不相关 PR 中 7 个同症状失败，CI 构建墙 0 成功/50 失败，
      CI 看板一度返回 HTTP 503。已停止重试；恢复后的判定方法与证据见
      reports/ci-failure-analysis.md。
  notes: >-
    本机（Windows）无 OHOS clang，离线验证见 reports/local-verification.md；
    G2/L1/L4/L5 已在真机实跑，见 reports/device-build.md。真机首轮失败暴露了
    三个问题（补丁缺失 free_sites 修复、补丁 0001 丢 $(OBJS)、配方 cwd 错误）
    与一个平台问题（make 在 conanbuild 环境下 SIGSEGV），均已修复并记录。

