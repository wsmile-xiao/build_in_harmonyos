# conandata.yml — uucpsend 1.1
#
# Source provenance (R39):
#   * The canonical upstream release is the author's own tarball on
#     infodrom.org, the download location named by the project homepage.
#     uucpsend has no GitHub/GitLab repository, so no git-archive mirror exists.
#   * Debian's pristine-orig tarball is a *byte-identical* copy of that release,
#     which is what makes it admissible as a mirror:
#         sha256(uucpsend-1.1.tar.gz)       = 3447ff358e21c9927f4a35409218bf6f77c6caaceeed298bc15a8cb6dec065bc
#         sha256(uucpsend_1.1.orig.tar.gz)  = 3447ff358e21c9927f4a35409218bf6f77c6caaceeed298bc15a8cb6dec065bc
#     A single sha256 therefore covers every URL below, and Conan's get() tries
#     them in order until one passes the checksum.
#
#   * URL ORDER (mirrors first, official host last) follows the established
#     pattern of archives/u/uucp/1.07, whose upstream lives on ftp.gnu.org -- a
#     host the CI workers cannot reach.  The first CI run of this PR failed with
#     "源码下载超时 / Worker 网络受限", so the official host is kept as the last
#     fallback rather than the first choice: the mirrors and the official host
#     serve identical bytes, so ordering costs nothing and removes the
#     dependency on a single reachable host.
#
#   Each mirror below was downloaded and hashed during adaptation and matched
#   the digest above.  Per R39 the official source is retained in the list.
#
# No build-system-generated files are patched: the upstream tarball ships a
# hand-written POSIX Makefile and two C sources, with no configure script.
sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/u/uucpsend/uucpsend_1.1.orig.tar.gz"
    - "https://mirrors.aliyun.com/debian/pool/main/u/uucpsend/uucpsend_1.1.orig.tar.gz"
    - "https://mirror.nju.edu.cn/debian/pool/main/u/uucpsend/uucpsend_1.1.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/main/u/uucpsend/uucpsend_1.1.orig.tar.gz"
    - "https://www.infodrom.org/projects/uucpsend/download/uucpsend-1.1.tar.gz"
  filename: "uucpsend-1.1.tar.gz"
  sha256: "3447ff358e21c9927f4a35409218bf6f77c6caaceeed298bc15a8cb6dec065bc"

patches:
  - patch_file: "patches/0001-Makefile-configurable-toolchain-and-staged-install.patch"
    patch_description: >-
      Make the hand-written Makefile usable from a build system: conventional
      all: default target, ?= toolchain variables (CC/CFLAGS/CPPFLAGS/LDFLAGS),
      STRIP only when DEBUG is unset, DESTDIR-staged install with configurable
      BINDIR/CONFDIR/MANDIR, and a POSIX-portable install rule that does not
      demand root ownership.  SHELL is pinned to /bin/sh because /bin/bash is
      absent on OHOS.
    patch_type: "portability"
  - patch_file: "patches/0002-uucpsend.c-use-strchr-instead-of-BSD-index.patch"
    patch_description: >-
      Replace the BSD/legacy-POSIX index() alias with ISO C strchr() and drop
      <malloc.h>.  musl (OHOS libc) declares index() only under _BSD_SOURCE and
      does not ship <malloc.h> at all, so the unpatched source does not compile
      cleanly against it.
    patch_type: "portability"
  - patch_file: "patches/0003-uucpsend.c-fix-free_sites-lvalue-cast.patch"
    patch_description: >-
      Fix free_sites(): its parameter is declared as `struct s_sites *`, a tag
      that does not exist anywhere in the program, and the body assigns to a
      cast (`(struct s_sites *)act = (struct s_sites *)root`).  clang rejects an
      assignment to a cast as a hard error -- "assignment to cast is illegal,
      lvalue casts are not supported" -- so the unpatched source cannot be
      compiled by the OHOS toolchain at all.  Declaring the parameter as
      `struct s_site *` and assigning directly fixes the error and also removes
      the three incompatible-pointer-types diagnostics at the call sites.
      (This patch is diffed against the tree with 0002 applied, matching the
      order in which this list is applied.)
    patch_type: "portability"
