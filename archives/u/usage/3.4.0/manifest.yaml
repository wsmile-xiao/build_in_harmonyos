software: usage
version: "3.4.0"
status: published
build_system: custom
build_date: "2026-06-08"
install_prefix: /storage/Users/currentUser/usr/local
source_url: https://crates.io/api/v1/crates/usage-cli/3.4.0/download
tar_format: tar.gz
configure_options:
  - "cargo build --release"
  - "cargo test --release (10 unit tests passed, doc-tests skipped E051)"
dependencies:
  - rust/1.95.0
  - cargo/1.95.0
cc: clang
cxx: clang++
patches_applied: []
test_status: published
knowledge_gained:
  - rust_cargo_build: Rust/Cargo 项目可直接用 cargo build --release 编译，不需要 configure/make
  - crates_io_download: crates.io 是 Rust 项目的可靠下载源，比 GitHub 更稳定
  - doctest_e051: OpenHarmony 上 rustdoc doc-tests 因 exec(2) syscall 权限问题无法运行 (E051)