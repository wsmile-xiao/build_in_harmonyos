software: unifdef
display: "unifdef"
description: "Selectively process conditional C preprocessor directives"
category: build-tool
homepage: "http://dotat.at/prog/unifdef"
license: BSD-2-Clause AND BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用自定义 Makefile，无 configure 脚本，直接 make CC=clang 编译"
    - "unifdefall.sh 脚本内部调用 cc，需创建 cc → clang 软链接"
    - "测试套件中 outeperm/overperms 因 HMDFS 权限行为差异失败，非功能缺陷"
  common_dependencies: []

versions:
  "2.12":
    status: built
    build_date: "2026-06-30"
    conan_ref: "unifdef/2.12@ohpcd/stable"
