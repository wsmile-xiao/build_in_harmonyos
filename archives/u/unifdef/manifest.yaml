# 软件级 manifest — unifdef
software: unifdef
display: "unifdef"
description: "选择性移除 C 预处理条件编译（#if/#ifdef/#ifndef）的命令行工具"
category: utility
homepage: "https://dotat.at/prog/unifdef/"
license: BSD-2-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 ANSI C + POSIX Makefile，零补丁即可用 OHOS SDK clang 交叉编译"
    - "零第三方依赖（仅链接系统 libc）"
    - "上游 install 目标依赖 install(1)，package() 改为直接 copy 产物（bin/ 与 share/man）"
    - "上游 90 例 shell 回归在 OHOS 构建机 82/90 通过；8 例为宿主环境差异（宿主 cc -E 无 sysroot ×5、toybox diff 方言 ×2、HMDFS 不强制 chmod ×1），已在版本级 manifest.yaml/MANIFEST.yml 逐项登记"
    - "unifdefall 包装脚本依赖宿主可用的 C 预处理器；主程序 unifdef 不受影响"
  common_dependencies: []

versions:
  "2.12":
    status: built
    build_date: "2026-09-17"
    conan_ref: "unifdef/2.12"
