software: unifdef
# 版本级 manifest
# 文件位置: archives/u/unifdef/2.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.12"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# Conan 引用
conan_ref: "unifdef/2.12@ohpcd/stable"

# 构建系统（顶层字段，质量门禁要求）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://dotat.at/prog/unifdef/unifdef-2.12.tar.gz"

  # 源码校验和
  sha256: "fba564a24db7b97ebe9329713ac970627b902e5e9e8b14e19e024eb6e278d10b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "unifdef 使用自定义 Makefile（无 configure 脚本），conanfile.py 的 build() 应直接调用 make 而非 autotools.configure()"
  - "unifdefall.sh 脚本内部调用 cc 而非 clang，需创建 cc → clang 软链接"
  - "终端工具的 package_info 应使用 bindirs=[\"bin\"] 而非 cpp_info.libs"
  - "HMDFS 文件系统下 chmod 555 不限制写入且强制 group write，导致权限测试失败（E046）"
