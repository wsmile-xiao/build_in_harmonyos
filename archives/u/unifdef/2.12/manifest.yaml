# 知识沉淀
knowledge_gained:
  - "零补丁适配：上游 POSIX Makefile（单文件 unifdef.c）不经修改即可用 OHOS SDK clang 交叉编译"
  - "OHOS SDK 交叉 clang 无默认 sysroot：unifdefall 依赖的宿主 `cc -E` 找不到 libc 头文件，上游 if*-a 用例在设备上不可运行"
  - "OHOS 系统 diff 为 toybox 方言，GNU diff -u hunk 头格式与上游期望输出不一致（multimissing/multinewline）"
  - "HMDFS 不强制 chmod(2) 只读目录语义（outeperm 用例无法复现 Permission denied）"
  - "上游 install 目标依赖 install(1)，CI worker PATH 不保证存在——package() 改为直接 copy 产物"
