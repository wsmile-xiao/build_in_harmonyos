# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: unifdef/2.12
homepage: "https://dotat.at/prog/unifdef/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test (scripts/runtests.sh tests)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests
    source: unifdef-2.12/tests
    description: "90 个 shell 回归用例；scripts/runtests.sh 逐例比较 .out/.err/.rc 与 .expout/.experr/.exprc。OHOS 构建机上 82/90 通过，其余 8 例见 host_incompatible_tests（均为宿主环境能力差异，与 unifdef 本体无关）"
    command: "make test"

# 宿主环境不兼容用例（conanfile.py build() 中白名单容忍；任何白名单外的失败都会中止构建）
host_incompatible_tests:
  - names: [if1-a, if2-a, if3-a, if4-a, if5-a]
    reason: "unifdefall(1) 调用宿主 `cc -E` 预处理 .c 文件；OHOS SDK 交叉 clang 无默认 sysroot，找不到 libc 头文件（fatal error: 'stdio.h' file not found）。属工具链环境差异。"
  - names: [multimissing, multinewline]
    reason: "期望输出内嵌 GNU diff -u 的 hunk 头；OHOS 自带 toybox diff 对同一改动输出不同 hunk 范围（内容行一致），属 diff 实现方言差异。"
  - names: [outeperm]
    reason: "HMDFS 不强制 chmod(2)：0555 目录仍可写，无法复现期望的 'Permission denied'（rmdir 反而报目录非空），属文件系统语义差异。"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_unifdef.sh
    description: "功能测试：-V/-h 输出、-D/-U 分支选择、退出码语义（0 未变/1 已变）、嵌套条件、-m 原地修改、-M~ 备份、unifdefall 可执行（12 条断言，真实执行已安装二进制）"
    command: "sh test_unifdef.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
