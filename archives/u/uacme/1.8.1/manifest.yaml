knowledge_gained:
  - "uacme has no GitHub release assets; the tag archive refs/tags/v1.8.1 lacks configure and .tarball-version and builds as PACKAGE_VERSION=UNKNOWN. The pristine release is the upstream/1.8.1 tag."
  - "--with-libcurl=PATH and --with-openssl=PATH bypass pkg-config, so the packaged .pc files do not need to advertise supported_protocols."
  - "--disable-docs is mandatory: upstream hard-errors when a2x is missing (configure.ac:388-398)."
  - "libcurl is mandatory and exactly one of GnuTLS/OpenSSL/mbedTLS must be enabled; wolfSSL is not supported."
  - "ualpn is optional but enabled by default, and links the bundled libev copy when no system libev is present."
  - "The upstream test suite is empty: make check has no TESTS, no check_PROGRAMS and no tests/ directory in any upstream branch."
  - "ualpn's <ev.h> comes from a bare build-dir-relative '-Ilibev' (Makefile.am:32); under an out-of-tree VPATH configure that flag points at the empty libev/ directory automake's dirstamp creates, so the bundled copy is unreachable unless the source-tree directory is added to the compile flags."
  - "'uacme -V' exits 2 and 'ualpn -V' exits 1 by upstream design, so a version query is not a success exit: uacme main() opens with 'int ret = 2' (uacme.c:1536) and case 'V' jumps to the shared exit without resetting it; ualpn calls cleanup_and_exit(0, EXIT_FAILURE) (ualpn.c:4318-4320)."
