  test_package: "passed on the Harmony PC: the installed uacme -V and ualpn -V both start and report 'version 1.8.1'. Startup calls curl_version_info(CURLVERSION_NOW) and initialises the OpenSSL backend, so this is a real linkage check. Packaged binaries verified as ELF 64-bit LSB arm64, machine AArch64, dynamic, musl (/lib/ld-musl-aarch64.so.1)."
