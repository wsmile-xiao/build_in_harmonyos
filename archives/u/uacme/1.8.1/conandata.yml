# conandata.yml - uacme 1.8.1
#
# Upstream publishes no GitHub release assets (the releases API returns []),
# so there is no uacme-1.8.1.tar.gz on the releases page. Upstream documents
# the `upstream/latest` branch as the pristine-release channel, tagged as
# upstream/x.x.x, and that archive is the one shipping a generated `configure`
# and `.tarball-version`. The git tag archive refs/tags/v1.8.1 is the same
# source tree minus generated files and yields PACKAGE_VERSION=UNKNOWN.
#
# codeload.github.com is GitHub's own archive service (verbatim source tarball,
# not a third-party mirror); the github.com/.../archive/ redirect form is
# intermittently unreachable from this farm.
sources:
  "1.8.1":
    url: "https://codeload.github.com/ndilieto/uacme/tar.gz/refs/tags/upstream/1.8.1"
    sha256: "de7588577f8298dcb0d42dfaa9452a918fa692c4e165060207ac22f72fb0425d"

patches:
  "1.8.1":
    - patch_file: "patches/0001-configure-tmpdir.patch"
      patch_description: "config.status temp dir: replace mktemp -d in CWD with a plain mkdir; mktemp -d is unusable on the OHOS HMDFS filesystem (the same defect fixed for oggz 1.1.3)."
      patch_type: "portability"
