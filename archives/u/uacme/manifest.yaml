software: uacme
display: "uacme"
description: "Lightweight ACME (RFC 8555) client for issuing TLS certificates"
category: network
homepage: "https://github.com/ndilieto/uacme"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "C99 autotools project; --disable-docs is mandatory because upstream hard-errors without a2x"
    - "libcurl is mandatory and exactly one TLS backend must be enabled; OpenSSL is selected here"
    - "--with-libcurl=PATH / --with-openssl=PATH bypass the pkg-config driver"
    - "ualpn (optional tls-alpn-01 responder) is built at the upstream default, using the bundled libev"
    - "Upstream ships no automated tests: make check is an empty target"
  common_dependencies:
    - "curl/8.15.0"
    - "openssl/3.5.6.1"

versions:
  "1.8.1":
    status: built
    build_date: "2026-09-25"
