package: uthash/2.4.0
homepage: "https://github.com/troydhanson/uthash"

upstream_check_command: "make -C tests run_tests"

upstream_test_in_build: false
upstream_test_command: ""
upstream_test_count: 101

upstream_tests:
  - file: tests/test1.c .. tests/test102.c (excluding test64.c)
    source: uthash-2.4.0/tests/
    description: "All 101 upstream test programs listed by tests/Makefile and executed by do_tests"
    command: "make -C tests check"

test_package_tests:
  - file: test.c
    description: "Consumer test: add, count, find, delete, iterate on uthash hash table"
    command: "./test_uthash"

assertion_count: 5
