package: uthash/2.3.0
homepage: "https://github.com/troydhanson/uthash"

upstream_check_command: "make -C tests check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/test1.c
    source: uthash-2.3.0/tests/test1.c
    description: "Basic hash table add/find/delete test"
    command: "./tests/test1"
  - file: tests/example.c
    source: uthash-2.3.0/tests/example.c
    description: "Example: add users by int key, find, delete"
    command: "./tests/example"

test_package_tests:
  - file: test.c
    description: "Consumer test: add, count, find, delete, iterate on uthash hash table"
    command: "./test_uthash"

assertion_count: 5
