# uni-algo 1.2.0 test_package 清单
# L0e：声明上游测试来源、真实执行位置，以及未运行分区的**具体技术原因**。
sources:
  - CMakeLists.txt
  - consumer.cpp
  - test_ohos.cpp
  - conanfile.py

# 上游官方测试套件（不在本目录，本目录只做消费者/鸿蒙专项验证）
upstream_test:
  suite: "test/main.cpp + test/test_*.h（上游 test/ 是自带 project() 的独立 CMake 工程）"
  invocation: "cmake -S test -B build && cmake --build build && ctest --verbose --output-on-failure"
  executed_in: "conanfile.py 的 build()（按 .github/workflows/linux.yml 的原样跑法）"
  ctest_cases_registered: 1
  ctest_cases_name: "uni-algo-test"
  assertion_sites_in_source: 3447
  assertion_sites_compiled: 3328
  assertion_site_grep: "grep -rhoE '\\bTESTX\\b' test --include=*.h --include=*.cpp | wc -l"
  compiled_site_formula: "g++ -std=c++17 -E -DTEST_MODE_WITHOUT_UNICODE_TEST_FILES test/main.cpp | grep -c '\"TEST FAILED: \"'"
  sections_done: 15
  failure_semantics: "任一断言失败即 exit(111)，ctest 随之失败，conan create 退出码非 0"

# 上游有分区需要外部数据，本环境不运行，原因逐条写明（不是「平台限制」四个字）
upstream_not_run:
  - name: "Normalization with test files"
    reason: >-
      需要 -DDOWNLOAD_UNICODE_TEST_FILES=ON，该开关不是运行期选项而是在 configure 阶段
      用 file(DOWNLOAD) 拉 https://www.unicode.org/Public/15.1.0/ucd/NormalizationTest.txt，
      上游 func_download() 对任何非 0 状态码直接 FATAL_ERROR，会让整个 conan create 红；
      离线构建环境（CI worker 未装 curl，真机直连外网不稳定）下不可用。
      保持上游默认 OFF（上游自己的 CI 也是默认值），该分区在二进制里打印
      "SKIP: Normalization with test files"。
  - name: "Text Segmentation with test files"
    reason: >-
      同上，依赖 ucd/auxiliary/GraphemeBreakTest.txt 与 WordBreakTest.txt 两个外部数据文件，
      与 Normalization 分区共用同一个 DOWNLOAD_UNICODE_TEST_FILES 开关。
    note: "字素/词断句并非没测：test_segment.h 的内置用例（不含外部数据那部分）照常执行，另加本目录 ohos_probe/consumer_probe 的字素与词计数断言。"
