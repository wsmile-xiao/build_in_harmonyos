# uni-algo 1.2.0 版本级 manifest
# 位置: archives/u/uni-algo/1.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.2.0"

# 软件名
software: "uni-algo"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag 的 codeload 入口，与 github.com/archive 同字节流：
  # 437340 B / SHA-256 f2a1539c… 已本地对拍一致）
  url: "https://codeload.github.com/uni-algo/uni-algo/tar.gz/refs/tags/v1.2.0"

  # 源码校验和
  sha256: "f2a1539cd8635bc6088d05144a73ecfe7b4d74ee0361fabed6f87f9f19e74ca9"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（库工程）
  configure_options:
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DUNI_ALGO_HEADER_ONLY=OFF"
    - "-DUNI_ALGO_INSTALL=ON"

  # 上游官方测试工程（test/ 是独立 project()）的配置，按上游 CI 原样
  upstream_test_configure_options:
    - "-S test -B build-upstream-test（复用 conan_toolchain.cmake）"
    - "-DBUILD_UNI_ALGO=OFF"
    - "-DDOWNLOAD_UNICODE_TEST_FILES=OFF"
    - "ctest --verbose --output-on-failure"

  # 编译依赖列表（uni-algo 只依赖 C++17 标准库，零第三方依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（OHOS clang 15 + musl 下一次编过，未改上游源码）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "uni-algo 的上游测试是「1 个 ctest 用例 + 单二进制内 3447 个 TESTX 断言点」的形态；断言点里有一部分被 TEST_MODE_* 宏门控，声明口径要用预处理后的实际编译数（g++ -std=c++17 -E -DTEST_MODE_WITHOUT_UNICODE_TEST_FILES test/main.cpp | grep -c '\"TEST FAILED: \"' → 3328），避免与源码 3447 混淆"
  - "test/CMakeLists.txt 对 GNU/Clang 无条件加 -Werror，且只有 `NOT DEFINED CMAKE_CXX_STANDARD` 时才提 cxx_std_20；conan 的 ohos-aarch64 profile 写了 compiler.cppstd=17 → 测试工程按 C++17 编译（上游 CI 自己是 C++20），两种标准下 15 个 DONE 分区结果一致"
  - "DOWNLOAD_UNICODE_TEST_FILES 必须保持 OFF：它不是运行期选项，而是在 configure 阶段用 file(DOWNLOAD) 拉 unicode.org 的 3 个测试数据文件，func_download() 失败直接 FATAL_ERROR，会让整个 conan create 红；离线/受限网络环境只能接受随之而来的 2 个 SKIP 分区"
  - "要在 create 内单独 configure 第二个 CMake 工程（上游 test/ 自带 project()），必须把 CMakeToolchain 生成的 conan_toolchain.cmake 显式传给它的 -DCMAKE_TOOLCHAIN_FILE，否则第二个工程会退回宿主机默认编译器，测的就不是本包的产物"
  - "上游只 install 库与 include/，不 install 许可证 → package() 需手工 copy LICENSE.md 到 licenses/，否则 L5 产物完整性缺许可证据"
