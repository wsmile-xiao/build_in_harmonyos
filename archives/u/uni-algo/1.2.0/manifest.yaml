# 编译中学到的知识
knowledge_gained:
  - "uni-algo 是 C++17 Unicode 算法库，原生兼容 HarmonyOS，无需平台适配补丁"
  - "cmake 项目默认编译为静态库（BUILD_SHARED_LIBS=OFF），符合鸿蒙静态库优先策略"
  - "测试套件在 test/ 子目录独立构建（BUILD_UNI_ALGO=ON），非顶层 CMakeLists.txt 包含"
  - "纯库项目无二进制可执行文件，G2 门禁 '无二进制文件' 警告为预期行为"
  - "manifest.yaml 需添加顶层 build_system 字段以通过 G4 门禁检查"
