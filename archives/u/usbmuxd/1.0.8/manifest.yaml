software: usbmuxd
version: "1.0.8"
status: built
package_type: application
build_system: cmake
created_at: 2026-09-23
language: c
description: "USB multiplexing daemon for iPhone/iPod Touch devices (libimobiledevice ecosystem server side): sbin/usbmuxd daemon + bin/iproxy port forwarding tool"
homepage: https://github.com/libimobiledevice/usbmuxd
upstream_source: https://github.com/libimobiledevice/usbmuxd/archive/refs/tags/v1.0.8.tar.gz
source_sha256: 110722b8eac2d6e9705c5fb20b40ea0cedf87cb5d5398690a8ed8895f0dabcc0
license: "GPL-2.0-or-later AND LGPL-2.1-or-later"

dependencies:
  required:
    - libusb/1.0.27
    - libplist/2.7.0 (override=True: 对齐 libusbmuxd/2.0.2 图内 libplist 版本，配方默认 2.3.0 与本包 2.7.0 冲突)
    - libusbmuxd/2.0.2 (iproxy 客户端链接；内嵌 libusbmuxd 老库不构建)
  build: []

patches_applied:
  - patches/0001-ohos-cmake-standalone-libusbmuxd.patch

test_results:
  type: no_upstream_tests_consumer_verified
  upstream: "No upstream test suite: usbmuxd 1.0.8 (2012) contains no tests/ directory, no add_test()/enable_testing() and no make check/ctest target in its CMake build; the daemon requires a physical iOS device + USB passthrough to exercise its runtime paths (not available in CI/ohos-aarch64)."
  test_package: "passed: 3/3 consumer smoke assertions - (1) usbmuxd -h prints the 'usage: usbmuxd [options]' banner including the --force-exit option and exits 0 (ELF load + getopt_long parsing + libc printf exercised before any socket/USB work); (2) iproxy with no args prints its 'LOCAL_TCP_PORT DEVICE_TCP_PORT' usage line and exits 0 (proves libusbmuxd-2.0 client link + in-tree sock_stuff helpers); (3) consumer C program linking libusbmuxd asserts client-API error paths: usbmuxd_get_device_list()/usbmuxd_connect() return negative error codes without a running daemon (no crash), usbmuxd_device_list_free(NULL) safe."
  package_id: "(local conan create, filled by CI)"

platform_adaptations:
  - "内嵌 libusbmuxd 共享库不构建：独立 libusbmuxd/2.0.2 包已在制品仓；内嵌老版依赖 pthread_cancel（OHOS musl sysroot 不声明，E085/E127），且其 API 已由独立库覆盖"
  - "iproxy 改链制品仓 libusbmuxd-2.0 静态库；其私有 sock_stuff 三函数（create_socket/recv_buf_timeout/send_buf）从源码树直接编入 iproxy"
  - "daemon/client.c plist_dict_insert_item → plist_dict_set_item（libplist 2.7.0 API 更名，libimobiledevice-glue 先例）"
  - "cmake_minimum_required 2.6→3.5 + CMAKE_POLICY_VERSION_MINIMUM=3.5（CMake 4.x 移除 <3.5 兼容）"
  - "FindUSB/FindPLIST 老式 pkg-config 探测模块在交叉环境失效：配方直接注入 USB_INCLUDE_DIR/USB_LIBRARY/PLIST_INCLUDE_DIR/PLIST_LIBRARY cache 变量"
  - "udev 规则仅 Linux 平台安装（CMAKE_SYSTEM_NAME MATCHES Linux 分支保留）"
  - "守护进程型软件按工具交付：commands.json type=tool（kfourinline #11104 先例：type=app 被 L0k 拦截）"

known_issues:
  - "usbmuxd 守护进程的完整运行需要 USB 设备直通与 udev/热插拔环境（iOS 设备生态），OHOS PC 上以二进制交付 + 客户端库互操作为验证边界"
  - "drop-privileges 路径（-U user）依赖 getpwnam/initgroups（musl 提供），需要系统用户配置才能生效"
