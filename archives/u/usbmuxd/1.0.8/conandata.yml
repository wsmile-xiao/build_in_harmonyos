# releases/download/1.0.8/ 404，codeload 自动生成的 tag 源码归档为唯一
# 官方源；R39 官方源口径）
sources:
  url: "https://github.com/libimobiledevice/usbmuxd/archive/refs/tags/v1.0.8.tar.gz"
  sha256: "110722b8eac2d6e9705c5fb20b40ea0cedf87cb5d5398690a8ed8895f0dabcc0"

patches:
  - patch_file: "patches/0001-ohos-cmake-standalone-libusbmuxd.patch"
    patch_description: "OHOS 适配：(1) cmake_minimum_required 2.6→3.5（CMake 4.x 兼容）；(2) 不再构建内嵌 libusbmuxd 共享库（制品仓已有独立 libusbmuxd/2.0.2 包，内嵌版依赖 pthread_cancel——OHOS musl sysroot 无此符号声明，E085/E127）；(3) udev 规则子目录仅 Linux 构建安装；(4) iproxy 改链制品仓 libusbmuxd-2.0 静态库，其私有 sock_stuff 三函数（create_socket/recv_buf_timeout/send_buf）直接编入 iproxy；(5) daemon/client.c plist_dict_insert_item→plist_dict_set_item（libplist 2.7.0 API 更名，先例 libimobiledevice-glue）；(6) iproxy.c handle 打印 %d→%u（uint32_t）"
    patch_type: "portability"
