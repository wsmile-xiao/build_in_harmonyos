# test_package MANIFEST — usbmuxd 1.0.8
name: usbmuxd-consumer-test
version: "1.0.8"
description: >
  Consumer-side smoke for the usbmuxd daemon package: usbmuxd -h usage
  banner (exit 0), iproxy no-arg usage line, and a C consumer program
  linking libusbmuxd asserting the client-API error paths (negative rc
  without a running daemon; device_list_free(NULL) safety).
language: c
build_system: cmake
source_files:
  - test.c
  - CMakeLists.txt
  - conanfile.py
  - test.sh
