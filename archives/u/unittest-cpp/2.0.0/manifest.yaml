      what: "tests/TestRequireMacrosWithExceptionsOff.cpp 全文件 70 例（35 TEST + 35 TEST_FIXTURE）"
      reason: "文件整体在 #ifdef UNITTEST_NO_EXCEPTIONS 下，与本次构建配置（exceptions ON，上游默认）互斥；同功能对版本 TestRequireMacrosWithExceptionsOn.cpp 35 例在本配置下全数执行并通过 —— 非缺失，属上游配置互斥设计"
    - count: 8
      what: "AssertHandler 2 + MemoryOutStream 9 − LongMacros 3（行首锚定 grep 漏计 indent 续行）等 guard 差"
      reason: "用例级 #if 条件编译（_MSC_VER / UNITTEST_COMPILER_IS_MSVC6 / UNITTEST_NO_DEFERRED_REPORTER / #if defined(CHECK) 组合）在本平台不满足；per-file 链接实测注册数（notes.md 明细表）即分母，未并入通过也未从分母虚增"
  skipped: []
  consumer_programs: 1     # N_consumer：test_package/test.cpp（4 组断言）
  consumer_assertions: 4   # A1 runner 路径 / A2 崩溃翻译反向验证 / A3 MemoryOutStream / A4 TestResults 语义
  passed: 268              # 上游 268/268；消费者另列 4/4（见 notes.md 验证结果）
  failed: 0
  note: |
    上游套件经 CMake POST_BUILD 挂钩在 conan 构建内真实执行（Release -DNDEBUG 使
    CrashingTestsAreReportedAsFailures 参与编译——该用例正是 SignalTranslator 的
    崩溃→断言翻译验证）。通过率申报：执行项 268/268（100%）；本配置静态分母 268
    （注册即分母，逐文件链接枚举金标准），跨配置宏上限 346 的差额逐项说明如上，
    未把任何未执行项并入通过，也未从分母静默删除。
    消费者测试 4/4：其中 A2 是 §10/§10.1 反向验证的核心——链接已发布库产物触发
    真实 SIGSEGV，断言被翻译为恰好 1 条失败且进程存活；翻译器失效时该探针会
    以 SIGSEGV 直接死亡（rc=139），不可能产生 "PASS"——排除假通过。

