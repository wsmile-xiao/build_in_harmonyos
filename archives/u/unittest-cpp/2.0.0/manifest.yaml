  static_total: 268      # N_static：本构建配置有效注册口径 = 逐文件链接枚举金标准（与 registered/executed 同源）；
                         # 跨配置宏总数 346 中 70 例属 UNITTEST_NO_EXCEPTIONS 独占文件、8 例被用例级 guard 排除，
                         # per-file 明细表见 notes.md「上游测试清点」。
