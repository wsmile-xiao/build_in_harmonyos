software: unittest-cpp
version: "2.0.0"
status: published
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://github.com/unittest-cpp/unittest-cpp/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "74852198877dc2fdebdc4e5e9bd074018bf8ee03a13de139bfe41f4585b2f5b9"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DUTPP_INCLUDE_TESTS_IN_BUILD=ON"
  dependencies: []
  cc: clang
  cxx: clang++

tests:
  upstream:
    command: "TestUnitTest++"
    status: passed
    tests_passed: 268
  test_package:
    command: "test_package"
    assertions: 1

patches_applied:
  - "patches/0001-cmake-min-version.patch"
knowledge_gained:
  - "The upstream CMake build has no third-party Conan requirements."
  - "cmake_minimum_required(VERSION 2.8.1) is rejected by CMake >= 3.27; bumped to 3.5 via patch."
  - "CMakeDeps uses the conan package name (unittest-cpp) for generated config files; a UnitTest++ target alias is registered in package_info."
