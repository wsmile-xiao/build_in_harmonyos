software: unittest-cpp
version: "2.0.0"
status: published
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://github.com/unittest-cpp/unittest-cpp/archive/refs/tags/v2.0.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DUTPP_INCLUDE_TESTS_IN_BUILD=ON"
  dependencies: []
  cc: clang
  cxx: clang++

tests:
  upstream:
    command: "TestUnitTest++"
    status: pending_source_verification
  test_package:
    command: "test_package"
    assertions: 1

patches_applied: []
knowledge_gained:
  - "The upstream CMake build has no third-party Conan requirements."
  - "The source SHA256 must be filled from the verified v2.0.0 archive before submission."
