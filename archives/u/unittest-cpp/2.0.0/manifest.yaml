version: "2.0.0"

software: unittest-cpp

# 编译状态：published | built | failed | archived
status: built

build_date: "2026-09-24"

build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/unittest-cpp/unittest-cpp/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "74852198877dc2fdebdc4e5e9bd074018bf8ee03a13de139bfe41f4585b2f5b9"
  compression: tar.gz
  archive_root: "unittest-cpp-2.0.0"
  note: >-
    GitHub 官方 tag archive（R39 合规，同已合入先例 libuio/0.3.0 形态）。
    双源核对：本机 curl(github.com/archive) 与设备 curl(codeload.github.com)
    同大小同 sha256，且与 hw-coord 登记值一致。

# ============================================================
# 依赖
# ============================================================

dependencies:
  required: []
  build: []
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos-clang
  options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"     # 上游 cmake_minimum_required(2.8.1) 声明降级
    - "-DUTPP_AMPLIFY_WARNINGS=OFF"            # 上游 -Werror × OHOS code-sign 注入碰撞的官方降级开关
    - "-DUTPP_INCLUDE_TESTS_IN_BUILD=ON"       # 保持默认：POST_BUILD 真实执行上游 268 例套件
  notes: >-
    CMakeToolchain + cmake_layout；build() 内 cmake.build() 即触发上游
    add_custom_command(POST_BUILD COMMAND TestUnitTest++) 真实运行全量套件，
    随后 self.run 显式复跑留数；未用 ignore_errors（POST_BUILD/runner 非零
    退出都会让构建失败）。autotools 主线未采用（tag archive 不带 configure/
    Makefile.in，需 autoreconf+m4 工具链面；CMake 为上游推荐且自带测试挂钩）。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []   # 零源码修改：全部经上游官方开关

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues:
    - "OHOS 工具链全局注入 -Wl,--code-sign：编译阶段 clang 报 'linker input unused'，上游 UTPP_AMPLIFY_WARNINGS=ON 的 -Werror 会把它升级为 error（首错逐字见 notes.md 问题表 001）；用上游官方开关 UTPP_AMPLIFY_WARNINGS=OFF 降级，不改源码。"
  notes: >-
    SignalTranslator（sigaction + sigsetjmp/siglongjmp，sa_flags=0 无 sigaltstack）
    在 OHOS/musl/hishell 实测生效：Release 配置下上游
    CrashingTestsAreReportedAsFailures 用例参与编译并真实通过；消费者层反向验证
    （故意空指针崩溃 → 恰好 1 条失败、进程存活、无假通过无静默死）。

# ============================================================
# 测试结果（五维账本）
# ============================================================

test_results:
