# conandata.yml — unittest-cpp 2.0.0（UnitTest++ 轻量 C++ 单元测试框架）
# 官方源（R39 合规：GitHub 上游 tag archive；同已合入先例 archives/l/libuio/0.3.0）
# sha256 双源核对：本机 curl(github.com/archive) 与设备 curl(codeload) 同值；
# 与任务登记表 hw-coord 核验值一致。
#
# 构建主线选择：上游 CMake 与 autotools 双构建并存。本配方取 CMake 主线，原因：
#   1) GitHub tag archive 不自带 configure/Makefile.in（autotools 路径需 autoreconf
#      + m4 宏目录，扩大工具链面）；
#   2) CMake 主线经 add_custom_command(POST_BUILD COMMAND TestUnitTest++) 把上游
#      全量测试真实挂进构建（§10 硬规则天然满足），autotools 的 `make check` 依赖
#      automake wrapper 且测试同样经由该 runner。
# 补丁：无（零源码修改）。OHOS 工具链全局注入的 -Wl,--code-sign 与上游
# UTPP_AMPLIFY_WARNINGS 的 -Wall -Wextra -Werror 相撞（编译阶段 linker 参数
# unused 告警被升级为 error，首错逐字见 notes.md），用上游官方开关
# -DUTPP_AMPLIFY_WARNINGS=OFF 降级，不改上游源码。

