# test_package/MANIFEST.yml — unittest-cpp 2.0.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: unittest-cpp/2.0.0
homepage: "https://github.com/unittest-cpp/unittest-cpp"

# 上游测试命令：CMake 主线经 add_custom_command(TARGET TestUnitTest++ POST_BUILD
# COMMAND TestUnitTest++) 在 `cmake --build` 时自动执行；autotools 侧对应
# Makefile.am 的 TESTS = UnitTest++/TestUnitTest++（两条构建主线共用同一 runner 二进制）。
upstream_check_command: "ctest (upstream has no ctest registration; runner is POST_BUILD cmd)"

# conanfile.py build() 已真实执行上游测试：cmake.build() 触发 POST_BUILD 运行
# TestUnitTest++（非零退出即构建失败，未用 ignore_errors），随后配方再显式
# self.run(".../TestUnitTest++") 独立复跑留数。设备实测两次输出
# "Success: 268 tests passed."（含 Release 下 NDEBUG 才编译的
# CrashingTestsAreReportedAsFailures，即 SignalTranslator 崩溃翻译用例真绿）。
upstream_test_in_build: true
upstream_test_command: "TestUnitTest++ (POST_BUILD + explicit re-run in build())"

# 上游实际运行的测试程序：1 个 runner / 268 个注册用例。
upstream_tests:
  - file: tests/Main.cpp -> TestUnitTest++
    description: "UnitTest++ 自带全量套件（tests/Test*.cpp 宏注册）；运行时枚举 N_registered=268（自定义 reporter 计数 gold 标准，见 notes.md 账本），执行 268/268 通过、0 失败"
    command: "./TestUnitTest++"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实编译链接 unittest-cpp::unittest-cpp 并调用公开 API——A1 RunAllTests 全局注册路径；A2 故意空指针崩溃用例经 sigaction+siglongjmp 必须被翻译为恰好 1 条失败（OHOS/musl 信号翻译反向验证，翻译失效则进程 SIGSEGV 死亡走不到断言）；A3 MemoryOutStream 格式化；A4 TestResults 失败计数语义"
    command: "ctest --output-on-failure (test consumer_assertions -> ./test_unittest_cpp)"

# 测试断言总数 (test.cpp 实测 4 组)
assertion_count: 4
