software: unicrypto
display: "unicrypto"
description: "统一接口的密码学算法库（AES/DES/TDES/RC4 + hash/PBKDF2/HMAC/CMAC/KDF），自带纯 Python 后端，可作为多种 C-加速后端之上的统一封装"
category: crypto
homepage: "https://github.com/skelsec/unicrypto"
license: MIT
build_system: custom   # 纯 Python python-require，copytree 零编译

ohos_adaptation:
  key_points:
    - "纯 Python 三方库：python-require 发布，copytree 源码到 lib/python3.12/site-packages，零编译。"
    - "自带完整纯 Python 后端（unicrypto.backends.pure），无外部 C-加速加密依赖即可用于 OHOS；src 布局为顶层 unicrypto/ 包。"
    - "上游 pytest 套件对外部 C-加速后端（pycryptodomex 等）参数化，OHOS 未发布这些后端，仅纯后端自包含用例可运行。"
  common_dependencies: []
# 上游 install_requires 的 pycryptodomex 为可选加速后端，OHOS 未发布，不引入依赖

versions:
  "0.0.12":
    status: built
    build_date: "2026-09-18"
