# 版本级 manifest — unicrypto 0.0.12
version: "0.0.12"
software: "unicrypto"
status: built
build_date: "2026-09-18"
build_system: custom   # 纯 Python python-require，copytree 零编译

source:
  url: "https://files.pythonhosted.org/packages/26/80/3bdb8a8677a190be548c86e9247c5949ca0c9bc96e1b42c9ac9accf6681e/unicrypto-0.0.12.tar.gz"
  sha256: "7b7fc4f54d56422abbbc41f863f99b27a8674531f4a42003f3f953e4a722bde1"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "无 configure——python-require 纯拷贝安装（copytree src→site-packages/lib/python3.12）"
  dependencies: []
  cc: ""
  cxx: ""

testing:
  upstream_tests:
    - name: "tests/（198 个 def test_ + 172 条 @pytest.mark.parametrize 注册，共 370）"
      status: "integrated"
      command: "python3 run_upstream_tests.py（直接执行 -k 'pure or sha1' 纯后端子集，真机实测 5 通过/0 失败/0 跳过；剩余 365 为外部 C-加速后端参数化用例/注册，OHOS 无对应 backend 未运行，计入 environment gaps）"
    - name: "test_package 冒烟"
      status: "integrated"
      command: "python3 test_unicrypto.py（pure 后端 AES/DES/PBKDF2/SHA1 向量 6 断言）"
  test_package_tests:
    - name: "test_unicrypto.py"
      test_command: "PYTHONPATH=<site-packages> python3 test_unicrypto.py <site-packages>"
      assertion_count: 6

knowledge_gained:
  - "unicrypto 为纯 Python 三方库（python-require 发布），自带完整 pure 后端，无外部依赖即可用；install_requires 的 pycryptodomex 仅为可选加速后端，OHOS 未发布故不自带依赖。"
  - "上游 pytest 套件将同一算法向量对多 C-加速后端参数化，后端模块 import 时 `from Crypto...` 直接失败，导致 test_aes/des/rc4/tdes 在无后端主机构建即收集报错；test_import/test_pbkdf2 自包含可运行。"
  - "纯后端首选场景存在循环导入：unicrypto.symmetric 模块级 `AES = get_preferred_cipher('AES')` 在 import 早期触发对 in-progress pure.AES 的重复导入——测试 harness 用 conftest 预载 unicrypto.symmetric 规避。"
  - "python3.12 site-packages 路径：lib/python3.12/site-packages（与 python-slugify/dateutil 先例一致）。"
  - "源码 URL 用 PyPI source + files.pythonhosted 有序列表，两者 sha256 一致，下载可靠性有回退。"
