software: uclibc
version: '1.0.54'
status: built
build_date: '2026-09-19'
build_system: makefile

source:
  url: 'https://toolchains.bootlin.com/downloads/releases/sources/uclibc-1.0.54/uClibc-ng-1.0.54.tar.xz'
  sha256: 'd1ecf65cc2217dd4118a4dafc1abf27c585b5cb578f3bd7991fc640b79643ff2'
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - 'KCONFIG_ALLCONFIG=<fragment> ARCH=aarch64 allnoconfig'
    - 'ARCH=aarch64 CC=clang AR=llvm-ar NM=llvm-nm LD=ld.lld'
    - 'KERNEL_HEADERS=<sysroot>/usr/include'
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - 'uclibc 1.0.54 = uClibc-ng，独立 C 标准库（LGPL-2.1），自包含、无 Conan 依赖'
  - '构建系统为 Kconfig + GNU make（非 autotools/CMake），上游无 make check（测试在独立仓库 uClibc-ng-test）'
  - 'aarch64 无预置 defconfig，需 KCONFIG_ALLCONFIG 片段 + allnoconfig 生成 .config（同 buildroot 方式）'
  - 'Rules.mak 硬编码 CC=$(CROSS_COMPILE)gcc，需命令行覆盖 CC/AR/NM/OBJDUMP/STRIPTOOL/LD/HOSTCC'
  - '作为 libc 会与 OHOS musl sysroot 冲突，消费者需 -nostdinc/-nostdlib 方式使用'
  - '真机 shadow CI 通过：conan create + test_package 成功，L0/L1/L4/L5 pass、L2 skip（无 bin/）'
  - 'HMDFS 软链接被拒 → 用 cp 模拟 ln -fs 语义的 wrapper；/tmp 只读 → TMPDIR 指向 build 目录'
  - 'clang 不认 GCC 嵌套函数/裸 asm（@@@name@@@）/TLS alias，需源码级 patch 绕过'
  - 'OHOS 内核静态可执行入口 x0 未清零（携带栈/句柄地址），aarch64 crt1.S 把 x0 当 rtld_fini 传入，退出时 __uClibc_fini 对垃圾地址 br 触发 SIGSEGV（静态程序 exit 一律 rc=139）；静态链接应清零 x5（rtld_fini=NULL），仅 Scrt1 由 ld.so 经 x0 传入'
  - '上游测试在独立仓库 uclibc-ng-test（commit 996f404），已集成 5 个确定性基础测试静态链接真机运行 5/5 通过'
  - '官方 CI 部分 worker 文件系统对 .os/.oS 大小写不敏感，二者互相覆盖导致 SHARED 分配颠倒；把 .oS 后缀全局改名 .oshared（含 Makefile.commonarch 等所有 Makefile）可靠区分共享/静态 PIC 对象'
  - 'uclibc Rules.mak 硬编码 -Wl,-z,defs，lld 严格报 libc.so 对 ld.so 运行时符号的 undefined；去掉 -z defs 让 undefined 交由运行时解析'
  - 'ldso.c 的 init_tls() 无前向声明，严格 clang 报 -Wint-conversion；需补 extern void *init_tls(void) 声明'
