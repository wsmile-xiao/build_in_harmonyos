# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: uclibc/1.0.54
homepage: "https://uclibc-ng.org/"

# 上游测试命令（uClibc-ng 官方测试在独立仓库 uClibc-ng-test，本包无内建 make check）
upstream_check_command: "make compile && make run"

# conanfile.py 是否已集成上游测试（test_package 下载 uClibc-ng-test 并静态链接运行）
upstream_test_in_build: true
upstream_test_command: "clang --target=aarch64-linux-ohos -nostdlib crt1.o <test>.c libc.a -o <test> && ./<test>"

# 上游测试程序（从 uClibc-ng-test @996f404 选取的确定性基础子集）
upstream_tests:
  - file: test/string/tst-strlen.c
    source: "uclibc-ng-test@996f404/test/string/tst-strlen.c"
    description: "strlen/strnlen 边界与对齐（32 种基址 × 16 种尾部模式）"
    command: "./tst-strlen"
  - file: test/string/tst-memmove.c
    source: "uclibc-ng-test@996f404/test/string/tst-memmove.c"
    description: "memmove 重叠与非重叠拷贝正确性"
    command: "./tst-memmove"
  - file: test/string/tst-strtok.c
    source: "uclibc-ng-test@996f404/test/string/tst-strtok.c"
    description: "strtok 分隔符与边界处理"
    command: "./tst-strtok"
  - file: test/stdlib/teststrtol.c
    source: "uclibc-ng-test@996f404/test/stdlib/teststrtol.c"
    description: "strtol/strtoul 多种进制、溢出与非法输入"
    command: "./teststrtol"
  - file: test/stdlib/testatexit.c
    source: "uclibc-ng-test@996f404/test/stdlib/testatexit.c"
    description: "atexit 注册上限与逆序调用"
    command: "./testatexit"

# test_package 中自带的测试（消费者视角验证，R34：真实校验包内头文件/产物）
test_package_tests:
  - file: test.c
    description: "消费者视角: 校验 __UCLIBC__ 宏与版本号，验证安装后的 uClibc 头文件可用"
    command: "cc -c test.c -I<uclibc>/usr/include"

# 测试断言总数（近似值，用于质量评估）
# = 5 个上游测试程序（静态链接 uclibc 后真机运行）+ 4 个消费者断言（__UCLIBC__ 宏 + 版本号）
assertion_count: 9
