# uclibc 软件级 manifest
# 文件位置: archives/u/uclibc/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: uclibc
display_name: "uClibc-ng C Standard Library"
description: "面向嵌入式 Linux 的小型 C 标准库（glibc/musl 替代品）"
category: system
homepage: "https://uclibc-ng.org/"
license: LGPL-2.1
build_system: makefile

# 跨版本适配要点
ohos_adaptation:
  key_points:
    - "uClibc-ng 构建系统为 Kconfig + make，上游无 make check（测试在独立仓库 uClibc-ng-test）"
    - "aarch64 无预置 defconfig，需 KCONFIG_ALLCONFIG 片段 + allnoconfig 生成 .config"
    - "作为 libc 本体，与 OHOS musl sysroot 冲突，消费者需 -nostdinc/-nostdlib 方式使用"
  notes:
    - "可作为 OHOS 上嵌入式/交叉工具链的 C 标准库替代方案"

# 版本索引
versions:
  - version: "1.0.54"
    status: prepared
    build_date: "2026-09-18"
    patches: 0
    notes: "前置适配：配方与 test_package 已准备，待真机 shadow CI"
