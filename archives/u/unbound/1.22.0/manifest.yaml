software: unbound
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.22.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.22.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-22"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/unbound-1.22.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$HOME/usr/local"
    - "--with-ssl=$HOME/usr/local"
    - "--with-libexpat=$HOME/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/1.1.1w
    - expat/2.7.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ohos-header-guard.patch"
  - "0002-ohos-timestamping.patch"
  - "0003-config-guess-harmonyos.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS SDK 头文件冲突：linux/net_tstamp.h 与 sys/socket.h 中 sockaddr_storage 重复定义"
  - "解决方法：使用 #ifndef __OHOS__ 守卫排除 linux/net_tstamp.h 头文件"
  - "config.status 临时目录创建失败，需手动修改使用绝对路径临时目录"
  - "依赖 OpenSSL 1.1.1w 和 expat 2.7.1（预编译包）"