software: unac
version: "1.8.0"
status: published
build_date: "2026-06-16"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/u/unac/unac_1.8.0.orig.tar.gz"
  sha256: "29d316e5b74615d49237556929e95e0d68c4b77a0a0cfc346dc61cf0684b90bf"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  dependencies:
    - "iconv/system"
  cc: clang
  cxx: clang++

patches_applied: []

installed_files:
  binaries:
    - "bin/unaccent"
  libraries:
    - "lib/libunac.so.1.0.8"
    - "lib/libunac.so.1"
    - "lib/libunac.so"
    - "lib/libunac.a"
  headers:
    - "include/unac.h"
  pkgconfig:
    - "lib/pkgconfig/unac.pc"
  manpages:
    - "share/man/man1/unaccent.1"
    - "share/man/man3/unac.3"

elf_info:
  unaccent:
    runpath: "$DEFAULT_PREFIX/lib"
    needed:
      - "libunac.so.1"
      - "libc.so"

knowledge_gained:
  - "unac 是简单的 autotools 项目，configure --prefix=$DEFAULT_PREFIX 直接编译即可，无需额外参数"
  - "unaccent 不支持 --version 选项，版本信息需通过不带参数运行获取"
  - "首次 make 可能因 HMDFS 软链接延迟创建失败，make clean && make 重编可解决"
