software: unac
version: "1.8.0"
status: built
build_date: "2026-06-16"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/u/unac/unac_1.8.0.orig.tar.gz"
  sha256: "29d316e5b74615d49237556929e95e0d68c4b77a0a0cfc346dc61cf0684b90bf"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  dependencies:
    - "iconv/system"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-unaccent-c-fix-length-type.patch"
  - "0002-unac-c-fix-length-type.patch"

installed_files:
  binaries:
    - "bin/unaccent"
  libraries:
    - "lib/libunac.so.1.0.8"
    - "lib/libunac.so.1"
    - "lib/libunac.so"
    - "lib/libunac.a"
  headers:
    - "include/unac.h"
  pkgconfig:
    - "lib/pkgconfig/unac.pc"
  manpages:
    - "share/man/man1/unaccent.1"
    - "share/man/man3/unac.3"

elf_info:
  unaccent:
    runpath: "$DEFAULT_PREFIX/lib"
    needed:
      - "libunac.so.1"
      - "libc.so"

knowledge_gained:
  - "orig.tar.gz 不含预生成 configure，需 autoreconf --install --force 生成"
  - "AM_ICONV 宏由 gettext 提供，需设置 ACLOCAL_PATH 指向 gettext m4 目录"
  - "autoreconf 需要 config.rpath 文件，从 gettext 安装目录复制"
  - "builder Perl 脚本用 $ENV{'srcdir'} 定位文件，out-of-tree build 需设置 srcdir 环境变量"
  - "builder 脚本 slurp() 直接从 CWD 读取 unac.c/unac.h，需复制到 build 目录"
  - "unaccent.c 中 unaccented_length 声明为 int 但 unac_string 期望 size_t*，aarch64 上导致栈损坏 SIGSEGV"
  - "unac.c 生成文件中 utf16_length/utf16_unaccented_length 同样有 int→size_t 类型不匹配"
  - "unaccent 不支持 --version 选项，版本信息需通过不带参数运行获取"
