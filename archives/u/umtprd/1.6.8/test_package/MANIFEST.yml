# test_package/MANIFEST.yml
# Upstream test declaration for umtprd 1.6.8 (tag umtprd-1.6.8).
# Upstream ships no automated tests; the consumer test below validates the
# packaged daemon binary instead.

package: umtprd/1.6.8
homepage: "https://github.com/viveris/uMTP-Responder"

# ---- Upstream test audit ---------------------------------------------------
# Audited the umtprd-1.6.8 tag archive (GitHub API file listing + raw fetches
# of Makefile/README.md/inc + src/umtprd.c/src/mtp_cfg.c/src/usb_gadget.c/
# conf/umtprd.conf during adaptation):
upstream_tests_exist: false
upstream_test_audit:
  - source: "umtprd-1.6.8 tag root file listing (LICENSE, Makefile, README.md, Release-notes.txt, conf/, img/, inc/, src/)"
    reason: "There is no tests/, test/ or *_test.* test-harness directory at any level; conf/ holds only the sample umtprd.conf, img/ only logos."
  - source: "upstream Makefile (all/clean/help targets only)"
    reason: "No file defines a TESTS, check_PROGRAMS or check/test target; `make -n check` reports 'No rule to make target check'. The only build output is the ./umtprd daemon binary."
  - source: "README.md + Release-notes.txt (build/test documentation)"
    reason: "Documents only `make [CC=...] [USE_SYSLOG=1] [DEBUG=1] [SYSTEMD=1]` build variants and config-file setup; no test command or test framework is mentioned anywhere."
  - conclusion: "Upstream 1.6.8 provides no automated tests; the adaptation's test_package validates the installed umtprd binary as a runtime consumer check and does not claim upstream coverage."

# rule4 强制字段：upstream_test_total 必须显式声明。
# 上游经完整审计确认确实没有任何自动化测试，官方注册总数即 0；
# 手写 Makefile 无可枚举的测试注册口径，故用 manual_audit（ifplugd 先例）。
upstream_test_total: 0
upstream_test_count_method: manual_audit
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

# 上游无测试套件故无 check 命令。必须保持为空：HMBS 把非空值视为
# "upstream has tests" 并拒绝 no_tests/0（ifplugd/inspircd 先例）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ---- Consumer tests (test_package) -----------------------------------------
# test_package/conanfile.py runs test_umtprd.sh against the packaged
# bin/umtprd, parses its deterministic "RESULT: P passed, F failed" trailer
# into HMBS_TEST_PACKAGE_RESULT, and emits HMBS_UPSTREAM_TEST_RESULT
# (status=no_tests, 0 counts).
test_package_tests:
  - file: test_umtprd.sh
    description: "Addon: bin/umtprd present and executable (install layout proof)."
    command: "sh test_umtprd.sh <package>/bin/umtprd <workdir>"
  - file: test_umtprd.sh
    description: "No-arg run produces non-empty output (timeout-guarded; loop_on_disconnect=0 so the daemon exits after the single failed USB init)."
    command: "sh test_umtprd.sh <package>/bin/umtprd <workdir>"
  - file: test_umtprd.sh
    description: "Output contains the 'uMTP Responder' banner: proves ELF load + libc printf path."
    command: "sh test_umtprd.sh <package>/bin/umtprd <workdir>"
  - file: test_umtprd.sh
    description: "Output contains the 'Version:' line: proves the version string is compiled in."
    command: "sh test_umtprd.sh <package>/bin/umtprd <workdir>"
  - file: test_umtprd.sh
    description: "Negative control: exit code is non-zero (graceful USB-init-failure without a FunctionFS device node; an exit-0 stub fails here)."
    command: "sh test_umtprd.sh <package>/bin/umtprd <workdir>"

test_scenario_count: 5
assertion_count: 5
assertion_count_basis:
  package_layout: 1
  output_non_empty: 1
  banner: 1
  version_line: 1
  nonzero_exit_control: 1
privilege_required_for_test: false
privilege_note: "The consumer test only exercises the no-arg startup path (banner, default-config dump, graceful USB-init failure); no USB device node, config file, or network is touched."
