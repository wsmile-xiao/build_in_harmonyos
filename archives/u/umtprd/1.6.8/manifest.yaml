knowledge_gained:
  - "Upstream umtprd-1.6.8 is a pure hand-written Makefile project (targets: all/clean/help only); there is no configure step, no check/test target and no install target, so the recipe builds with `make -j1 CC=<conan cc>` and copies bin/umtprd + conf/umtprd.conf manually."
  - "Upstream ships no automated tests: no tests/ or test/ directory, no TESTS/check target in the Makefile, no ctest/pytest/gtest binding; the adaptation validates the packaged daemon through the consumer test_package instead."
  - "OHOS musl 不提供 pthread_cancel 符号（musl_use_pthread_cancel=false），直接调用会在链接期报 ld.lld undefined symbol；umtprd 两处调用点事前均已置 stop 标志且 io_thread 轮询该标志退出，因此 __OHOS__ 下仅 pthread_join 即可回收线程（bwfmetaedit/dvgrab/axel 先例），以构建时精确语句改写实现（ext4fuse 先例）。"
  - "The daemon needs a USB FunctionFS/GadgetFS device node (/dev/ffs-umtp/ep0 by default) which does not exist on HarmonyOS PC; without it the daemon prints its banner + default config and exits 2 via the graceful USB-init-failure path. The consumer test asserts exactly this path (banner + Version + non-zero exit), proving ELF load, libc linkage and config parsing without any USB hardware."
