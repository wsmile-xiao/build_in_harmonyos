version: "0.1.3.4"
software: "utmps"
status: built
build_date: "2026-09-27"
build_system: "skarnet-configure-make"

source:
  url: "https://github.com/skarnet/utmps/archive/refs/tags/v0.1.3.4.tar.gz"
  sha256: "e655d20f1a40a8e5fa24ffb558544f6a45a156637770edb7d3ed8dbd2127f7fb"
  tar_format: tar.gz
  alternate_official:
    url: "https://www.skarnet.org/software/utmps/utmps-0.1.3.4.tar.gz"
    sha256: "12dcc102ad6ac81f81aecc4950733db94f35081947054b9b1473cac5c90810bc"
    note: "同一棵源码树的另一容器：与上面的 GitHub 归档逐文件 sha256 比对为 94 个共有文件全等，仅 GitHub 多一个 .gitignore；选 GitHub 是因为 HarmonyOS PC 设备到 www.skarnet.org 出口 TLS 不可达（curl http=000 / conan SSLEOFError 实测三连）。"

build:
  system: custom
  configure_options:
    - "--prefix=<package_folder>"
    - "--disable-shared"
    - "--with-sysdeps=<skalibs_package_folder>/lib/skalibs/sysdeps"
    - "--with-include=<skalibs_package_folder>/include"
    - "--with-lib=<skalibs_package_folder>/lib"
  dependencies:
    - "skalibs/2.15.1.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "utmps 的运行面在 HarmonyOS PC 不可用：AF_UNIX 路径 socket 的 bind 在本机一律 EPERM（$HOME/子目录/cwd 全试），/dev/shm 为 EACCES，只有抽象命名空间可用；daemon 无法监听，因此 test_package 只能断言客户端契约（无 daemon 时 utmps_start 返回 0 且 errno=2）与交付程序的 usage 文本。"
  - "socket 路径并非编译期写死：utmps_start(utmps*, char const *socket_path, ...) 是运行期参数，utmps-write 另有 -U utmpd-socket / -W wtmpd-socket 覆盖；configure 的 --with-utmpd-socket/--with-wtmpd-socket 只给默认值。真正编译期钉死的是 UTMPX_FILE=/run/utmps/utmp，且 utmpxname() 在本平台返回 -1（实测）。"
  - "skarnet 自研 configure 不是 autotools：不认 --host/--build，也不用 AutotoolsToolchain；make 必须 -j1（构建顺序手写），且 HMDFS 上 make 的 jobserver mkfifo 会报 Operation not permitted 后退串行（非致命）。"
  - "utmps/utmps.h 自身 #include <skalibs/tai.h> 且全部计时入口收 tain 参数 ⇒ skalibs 属公共接口，配方必须 requires(..., transitive_headers=True, transitive_libs=True)；跨包传播不能用 cpp_info.requires（那是同包组件机制）。"
  - "package_type=library 的配方必须声明 shared 选项，否则 conan 2.29.1 在依赖图阶段直接报错；skarnet 默认静态，故 default_options 取 False 并映射到 --disable-shared。"
