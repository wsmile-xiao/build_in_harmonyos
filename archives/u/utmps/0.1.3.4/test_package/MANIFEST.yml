# test_package/MANIFEST.yml
# 上游测试与消费者测试声明（L0e 要求本文件存在）

package: utmps/0.1.3.4
homepage: "https://skarnet.org/software/utmps/"

# 上游没有自动化测试：src/Makefile 里 TEST_BINS 为空、tarball 不含 src/tests/，
# 但 check 目标与 tools/run-test.sh 框架在（缺 baseline 即 fatal + exit 100）。
# ⇒ N_static = 0 是真实零，不是漏跑；不得拿自写用例冒充上游全量。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_tests_skip_reason: >-
  Upstream ships no test cases: package/targets.mak declares an empty TEST_BINS and
  the release tarball contains no src/tests/ directory, although the check target and
  the tools/run-test.sh driver do exist (they abort without a baseline). N_static is
  therefore honestly zero; the consumer test below is reported separately and is not
  presented as an upstream suite.

upstream_tests: []

# 消费者测试（新增，独立计数）
test_package_tests:
  - file: test.c
    description: >-
      链接 libutmps 并调用公开 API：断言头文件 ABI 常量（UTMPS_UT_LINESIZE=32、
      UTMPS_UT_HOSTSIZE=256）、struct utmpx 字段可写可读回、以及"无 daemon 监听时
      utmps_start() 必须干净失败并返回 0"（本平台 AF_UNIX 路径 socket 被拒，daemon
      不可运行，故取客户端契约中仍可判定的一面）；utmpxname() 返回值仅记录不断言。
    command: "conan test"
  - file: smoke-cli.sh
    description: >-
      对交付程序 utmps-write 取 -h 用法文本，断言其中同时出现 -U utmpd-socket 与
      -W wtmpd-socket（本包唯一的运行期路径改向把手，也是"无需重启 daemon 即可改指
      socket"的凭据）。
    command: "conan test"

assertion_count: 5

# §14.1④：被测件内存预算（先 memcap-run --probe 评估后回填实测峰值）
max_rss_mb: 32
