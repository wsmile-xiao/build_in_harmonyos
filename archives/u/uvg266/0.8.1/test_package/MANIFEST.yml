# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: uvg266/0.8.1
homepage: "https://github.com/ultravideo/uvg266"

# 上游测试命令（cmake 驱动：enable_testing + add_test）
upstream_check_command: "cmake --build build --target test"

# conanfile.py build() 方法中已集成上游测试（ctest 执行 Test_uvg266 与 test_external_symbols）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（greatest 单元测试；wrapper 测试需 ffmpeg/VTM 解码器，
# 见 notes.md 台账：XFAIL_TESTS 排除 8 个外部工具依赖项）
upstream_tests:
  - file: tests/tests_main.c
    source: uvg266-0.8.1/tests/tests_main.c
    description: "greatest C 单元测试主程序（sad/satd/dct/mts/coeff_sum/mv_cand/speed suits）"
    command: "./uvg266_tests"
  - file: tests/test_external_symbols.sh
    source: uvg266-0.8.1/tests/test_external_symbols.sh
    description: "检查 libuvg266 导出符号均以 uvg_ 为前缀"
    command: "./test_external_symbols.sh"

# test_package 中自带的测试（消费者视角验证，真实调用 uvg266 公共 API 编码一帧）
test_package_tests:
  - file: test.c
    description: "消费者测试：uvg_api_get→config_alloc/init/parse→encoder_open→picture_alloc_csp→encoder_encode 输出非空比特流"
    command: "./test_uvg266"

# 测试断言总数（Test_uvg266 约 40 个 TEST 宏 + 消费者 6 个断言点）
assertion_count: 46