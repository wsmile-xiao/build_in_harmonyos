software: uvicorn
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.49.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.49.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://files.pythonhosted.org/packages/source/u/uvicorn/uvicorn-0.49.0.tar.gz"

  # 源码校验和（从 PyPI 获取）
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | python
  system: python

  # 配置选项列表
  configure_options:
    - "--no-deps"  # 不包含依赖，用户自行安装
    - "--wheel-dir ~/tmp/wheels"

  # 编译依赖列表（Python 包依赖）
  dependencies:
    # 核心依赖（运行时必需）
    - "click >=7.0"
    - "h11 >=0.8"
    - "typing_extensions >=4.0 (Python <3.11)"
    # 可选依赖（standard extras，推荐安装）
    - "httptools >=0.8.0 (optional)"
    - "uvloop >=0.15.1 (optional, Linux only)"
    - "watchfiles >=0.20 (optional)"
    - "websockets >=10.4 (optional)"
    - "PyYAML >=5.1 (optional)"
    - "python-dotenv >=0.13 (optional)"

  # 编译器（Python 包不需要）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# Python 包通常不需要补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Python 包使用 pyproject.toml 和 hatchling 构建"
  - "使用 'python3 -m pip wheel' 构建 wheel 包"
  - "安装到 --target 目录后生成 bin/uvicorn 启动脚本"
  - "启动脚本包含硬编码的 Python 路径，需要用户适配"