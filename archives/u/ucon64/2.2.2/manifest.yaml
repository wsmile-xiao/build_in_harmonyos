software: ucon64
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-17"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/ucon64/ucon64/ucon64-2.2.2/ucon64-2.2.2-src.tar.gz"

  # 源码校验和
  sha256: "e100ad4a30f6c19abde98e361c6a0ecac4e40477f54cfb75498c5ccd21fb3a18"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-parallel"
    - "LDFLAGS=-static"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess 2017 格式需原地修补添加 HarmonyOS 检测（echo+exit 格式，非 GUESS=）"
  - "HMDFS umask 077 创建目录不可写，需改为 022"
  - "aarch64 无 I/O 端口访问，需 --disable-parallel"
  - "ucon64 不支持 out-of-tree 构建，conanfile.py 需 in-tree"
  - "HMDFS 不支持 mkfifo，make 必须用 -j1"
  - "Conan 2 test_package 使用 self.dependencies 而非 deps_cpp_info"
  - "ucon64 Makefile 硬编码 -lz，需声明 zlib/1.3.1 依赖并通过 AutotoolsToolchain extra_ldflags 传递 -L 路径"
  - "AutotoolsToolchain 不自动添加依赖库路径，需手动从 self.dependencies[dep].cpp_info 获取并添加到 extra_ldflags"
  - "conandata.yml patches 必须显式声明 patch_file/patch_description/patch_type，apply_conandata_patches 才能正确应用"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/ucon64-2.2.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/ucon64-2.2.2.work
  source_orig_hash: 2fc05e2ffdd7dec1
  source_work_hash: 179bd4362c0f6457
  generated_at: '2026-06-29T15:25:13'
  patches_count: 4

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-misc-parallel.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
