# test_package/MANIFEST.yml — ucon64 2.2.2
# CI L0e requires this file to exist.

package: ucon64/2.2.2
homepage: "https://ucon64.sourceforge.net/"

# ucon64 has no formal upstream test suite (autotools project, no `make check` target)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_ucon64.sh
    description: "Smoke test: run ucon64 --version and --help to verify the binary is installed and executable"
    command: "bash test_ucon64.sh"

assertion_count: 1
