software: uid-wrapper
version: "1.2.5"
status: built
build_system: cmake
build_date: "2026-09-02"

source:
  url: "https://gitlab.com/cwrap/uid_wrapper/-/archive/uid_wrapper-1.2.5/uid_wrapper-uid_wrapper-1.2.5.tar.gz"
  sha256: "7cf89aae95f45d0c8b36c4b75eb36d65f7f769846eec7c6c0564fd6b6cb44275"
  tar_format: tar.gz

build:
  system: cmake
  options:
    - "UNIT_TESTING=OFF by default for consumers"
    - "with_upstream_tests=True (default) enables UNIT_TESTING=ON and runs ctest"
    - "with_upstream_tests=False disables upstream tests for cross-builds"

dependencies: []
test_dependencies:
  - "cmocka/2.0.2 when with_upstream_tests=True"

patches:
  - "0001-ohos-test-environment.patch"

platform_requirements:
  - "POSIX libc uid/gid APIs (getuid/setuid/setresuid/getgroups family)"
  - "LD_PRELOAD support for runtime interposition"
  - "RTLD_NEXT dlsym support in the dynamic loader"

verification:
  local:
    - "python3 -m py_compile conanfile.py test_package/conanfile.py"
    - "conan inspect ."
  ohos:
    result: pass
    profile: "ohos-aarch64"
    l1: "pass: LD_PRELOAD uid/gid interposition test_package executed"
    l2: "skip: library package without bin/ executables"
    l4: pass
    l5: pass
  upstream_tests:
    result: "24 passed, 0 failed, 1 disabled"
    command: "conan create archives/u/uid-wrapper/1.2.5 -o uid-wrapper/*:with_upstream_tests=True"
    disabled_reason: "test_uwrap_disabled expects the real (non-wrapped) setreuid to fail with -1/EPERM; OHOS seccomp terminates the unprivileged privileged-id syscall with SIGSYS instead, so the entry is disabled on HarmonyOS by patch 0001"
