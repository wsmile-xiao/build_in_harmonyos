# test_package/MANIFEST.yml
# Test declaration for Conan L1 consumer smoke test.

package: uid-wrapper/1.2.5
homepage: "https://cwrap.org/uid_wrapper.html"

upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_mode: "default: with_upstream_tests=True"
upstream_test_command: "conan create archives/u/uid-wrapper/1.2.5 -o uid-wrapper/*:with_upstream_tests=True"

upstream_tests:
  - file: "tests"
    source: "uid_wrapper-1.2.5/tests"
    description: "CTest/cmocka suite for uid/gid interposition; 25 upstream entries, 24 registered on OHOS after seccomp capability gating"
    command: "ctest --output-on-failure"
    status: "pass"
    result: "24 passed, 0 failed, 1 disabled (test_uwrap_disabled: OHOS seccomp SIGSYS on real setuid)"

test_package_tests:
  - file: test_uid_wrapper.c
    description: "Consumer test: LD_PRELOAD libuid_wrapper with UID_WRAPPER=1 UID_WRAPPER_ROOT=1; asserts fake-root id queries, reversible seteuid, setgid/setgroups, setresuid saved-id rules, and EPERM enforcement for unrelated-uid transitions"
    command: "./test_uid_wrapper"

assertion_count: 20
