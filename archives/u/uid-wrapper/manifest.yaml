software: uid-wrapper
display: "uid-wrapper"
description: "A wrapper for privilege separation of uid/gid operations in testing environments (cwrap LD_PRELOAD library)"
category: system
homepage: "https://cwrap.org/uid_wrapper.html"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "LD_PRELOAD interposition of the uid/gid libc family; activates via UID_WRAPPER=1 and UID_WRAPPER_ROOT=1"
    - "musl loader lacks RTLD_DEEPBIND and does not search the executable directory for DT_NEEDED libraries"
    - "OHOS seccomp turns the wrapper-disabled EPERM expectation into SIGSYS, so test_uwrap_disabled is gated off"
    - "test_package verifies LD_PRELOAD uid/gid interposition with 17 assertions"
    - "Upstream CTest suite runs with cmocka/2.0.2 from the registry"
  common_dependencies: []

versions:
  "1.2.5":
    status: built
    build_date: "2026-09-02"
