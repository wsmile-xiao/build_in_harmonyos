software: uncrustify
display: "Uncrustify"
description: "C/C++/C#/D/Java/Objective-C/Pawn/Vala 源码格式化工具，按配置文件统一缩进、空格与换行风格（命令行，零第三方依赖）"
category: tool
homepage: "https://uncrustify.sourceforge.net/"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 tag uncrustify-0.79.0 在 OHOS aarch64 + clang 15 + CMake 4.1 上开箱即用：W0 的 ISA 专属头（altivec/mmx/3dnow/SSE 系）与 glibc printf 钩子族 grep 全部 0 命中，配方零补丁（patches 为空）"
    - "0 个 Conan 依赖：上游 CMake 无任何外部 find_package，只链 libc/libc++；任务卡声明 0 依赖与源码实测一致"
    - "上游 CTest 套件（14 项注册 / 2049 个上游用例，按逐用例·逐检查项清点）真实集成进 conanfile.py 的 build()（cmake.test()），CI 的 conan create 会执行全部上游测试，失败即红"
    - "源与校验和三路取证一致（CCI conandata、GitHub archive 下载、codeload tag 归档）：e7afaeabf636b7f0ce4e3e9747b95f7bd939613a8db49579755dddf44fedca5f"
    - "test_package 以消费者视角真实驱动已安装的 uncrustify（13 条断言），含 3 条鸿蒙平台专项断言：AArch64 ELF + .codesign 执行段、经 hnp bash 包装在 OHOS 内真实执行"

versions:
