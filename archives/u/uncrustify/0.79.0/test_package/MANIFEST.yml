# test_package/MANIFEST.yml
# 上游测试声明与适配侧测试清单（CI L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 取数时间 2026-09-26，源码 = 官方 tag uncrustify-0.79.0
# （refs/tags/uncrustify-0.79.0 -> ab46b3231fc78fe5460f36f9be53139993faafc4，
#   tarball sha256 e7afaeabf636b7f0ce4e3e9747b95f7bd939613a8db49579755dddf44fedca5f）

package: uncrustify/0.79.0
homepage: https://uncrustify.sourceforge.net/

# ── 上游测试：真实集成进 conanfile.py 的 build()（cmake.test() → ctest）──────
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "cmake.test()   # conanfile.py build() 第 4 步，等价 ctest --output-on-failure"

# ctest 注册 14 个测试（ctest -N 实测）：11 个格式化套件 + sources_format +
# cli_options + sanity。统计按**统一的逐用例/逐检查项粒度**（同一口径，不混用
# 「ctest 注册数」与「逐用例数」）：
#   11 个格式化套件由 tests/*.test 逐用例驱动（框架注册数
#   test_uncrustify.read_format_tests = .test 文件数据行清点，两法一致）：
#   c-sharp 108 / c 444 / cpp 1050 / d 45 / ecma 1 / imported 0 /
#   java 36 / objective-c 161 / pawn 13 / vala 16 / staging 2   = 1876
# sources_format 按 src/ 顶层 *.cpp|*.h 逐文件 = 108
# cli_options 按脚本逐检查项 = 64（取数：
#   ctest --test-dir <build> -V -R cli_options | grep -E '^[0-9]+: Test ' |
#   grep -v -e 'Test command:' -e 'Test timeout' | wc -l  ->  64）
# sanity = 1（uncrustify --help）
# 合计上游用例 2049 = 1876 + 108 + 64 + 1（同一逐用例粒度，未与
# test_package 断言数混用；四段取数命令均可复现）
upstream_tests:
  - file: tests/*.test
    source: "uncrustify-0.79.0/tests/{c-sharp,c,cpp,d,ecma,imported,java,objective-c,pawn,vala,staging}.test"
    description: "格式化回归：逐用例比对输出与 tests/expected/ 黄金结果（1876 用例）"
    command: "ctest -R '^(c-sharp|c|cpp|d|ecma|imported|java|objective-c|pawn|vala|staging)$'"
  - file: tests/run_sources_tests.py
    source: uncrustify-0.79.0/tests/run_sources_tests.py
    description: "自身源码风格回归：src/ 顶层 108 个 *.cpp|*.h 按 forUncrustifySources.cfg 检查"
    command: "ctest -R sources_format"
  - file: tests/cli/test_cli_options.py
    source: uncrustify-0.79.0/tests/cli/test_cli_options.py
    description: >-
      CLI 选项回归：tests/cli 语料含 50 项文件（49 个 .cfg + 1 个 .txt）与 13 个输入，
      脚本按语料子集线性执行 64 次选项/输出黄金比对（单次 ctest 注册，统计按逐检查项计 64）
    command: "ctest -R cli_options"
  - file: "(ctest sanity)"
    source: uncrustify-0.79.0/tests/CMakeLists.txt
    description: "冒烟：uncrustify --help 可执行"
    command: "ctest -R sanity"

# ── 适配侧测试（test_package，消费者视角，计入「鸿蒙特有测试」行）─────────────
test_package_tests:
  - file: test.sh
    description: >-
      7 组 13 条断言：版本/帮助冒烟（3）、配置驱动的 C 格式化与黄金输出
      逐字节比对（2）、格式化幂等性（2）、stdin 与文件通道等价（2）、
      错误路径非零退出（1），以及鸿蒙平台专项 2 组 3 条——已安装 ELF 为
      AArch64 且带 .codesign 执行段（2）、经 hnp bash 包装在 OHOS 内真实
      执行（1）。
    command: "sh test.sh <package_folder>/bin <recipe_folder> <build_folder>   # test_package/conanfile.py 以 env=conanrun 调用"
    counting_rule: >-
      分母 TOTAL = PASS + FAIL；SKIP 单列不计入分母（readelf 或 hnp bash
      缺席时显式打印 SKIP，不冒充 PASS）。全部断言均为真实命令执行 +
      真实输出核对。

# test_package 断言总数（不计入上游分母）
assertion_count: 13
