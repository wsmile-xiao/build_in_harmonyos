version: "2.5"
software: "unilog"
status: built
build_date: "2026-09-18"
build_system: "cmake"

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/ubuntu/pool/universe/u/unilog/unilog_2.5.orig.tar.xz"
  sha256: "e151b8f31643533b46b84d958a9c086922f18c5521d08fc834660bb3722a9ef8"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TEST=ON"
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies:
    - "glog/0.7.1"
    - "boost/1.85.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Debian orig tar (11KB) is canonical upstream; Tsinghua/Aliyun mirrors serve identical sha"
  - "Upstream CMake needs BUILD_TEST=ON to register 3 ctests; ctest runs natively on OHOS aarch64"
