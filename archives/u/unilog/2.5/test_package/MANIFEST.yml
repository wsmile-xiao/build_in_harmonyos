package: unilog/2.5
homepage: "https://github.com/Xilinx/Vitis-AI"
# Upstream test source is src/vai_runtime/unilog/test (3 ctests) inside Vitis-AI monorepo;
# the Debian orig tar (unilog_2.5.orig.tar.xz) extracts as unilog-2.5 with the same 3 files.
upstream_test_in_build: true
upstream_tests:
  - file: "test/test_demo.cpp"
    description: "UniLog demo: init, prefix, INFO/WARNING/ERROR/verbosity macros, debug macros, UNI_LOG_CHECK"
    command: "ctest -R test_demo.bin"
    result: passed
  - file: "test/test_exception.cpp"
    description: "ErrorCode factory, GEN_ERROR throw/catch, dumpErrorCodeMap, stream output"
    command: "ctest -R test_exception.bin"
    result: passed
  - file: "test/test_exception_print.cpp"
    description: "ErrorCode print/stream extraction, extractErrMsg"
    command: "ctest -R test_exception_print.bin"
    result: passed
test_package_tests:
  - file: test.cpp
    description: "Consumer test: UniLog::Initial + setUniLogPrefix + UNI_LOG_INFO/WARNING/ERROR + REGISTER_ERROR_CODE + UNI_LOG_CHECK (real API linkage against libunilog, glog, Boost)"
    command: "./test_unilog"
assertion_count: 7  # INFO + WARNING + ERROR + VINFO + debug + ErrorCode throw/catch + UNI_LOG_CHECK
upstream_test_total: 3
upstream_test_count_method: ctest_entries
