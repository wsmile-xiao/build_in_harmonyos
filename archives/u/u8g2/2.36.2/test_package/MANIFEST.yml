# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: u8g2/2.36.2
homepage: "https://github.com/olikraus/u8g2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# u8g2 为嵌入式显示库：CMakeLists.txt 仅构建 csrc/*.c 静态库，无 ctest 注册
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游仓库无自动化测试套件；src 内 tools/ 为开发工具（非测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：初始化 null 显示器并执行 清屏→绘制→发送缓冲区→帧循环，验证 u8g2 库可链接且绘图 API 逻辑正常"
    command: "./test_u8g2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
