# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（unlzx 1.1，Aminet 分发实测）：
#
#   upstream_test_targets = 0
#   upstream_test_files   = 0
#   upstream_case_total   = 0
#
# 依据（可逐条核对）：Aminet 分发包只有两个文件 ——
#   unlzx.c.gz            单个 C 源文件（解压后 36298 字节，1374 行）
#   unlzx.c.readme        684 字节的简短说明
# 源文件里给出的唯一构建指示是顶部注释 "Compile with: gcc unlzx.c -ounlzx -O6"；
# 没有 makefile、没有测试目录、没有测试数据、没有任何 check/test 目标。
# 是**确认的 0**，不是 UNKNOWN。

package: unlzx/1.1
homepage: "https://aminet.net/package/misc/unix/unlzx.c"

upstream_tests_exist: false
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# 我们补的验证：真实 LZX 归档往返（不是"能启动就算过"）
test_package_tests:
  - file: test_package/conanfile.py
    description: >-
      在 test() 内用 Python 现场构造一个符合 LZX 规范的归档（10 字节 info header +
      31 字节 Archive_Header，含 unlzx 会自行重算的 header CRC + 一个 stored 成员的
      data CRC），然后：① `unlzx -v` 必须列出该成员；② `unlzx -x` 必须退出 0 且输出
      "crc good"；③ 解出的字节必须与原始 payload 逐字节相同；④ 故意破坏 header CRC
      的归档必须被拒绝（非 0 退出 + 报 "CRC: Archive_Header"）。
    command: "unlzx -v good.lzx / unlzx -x good.lzx / unlzx -v bad.lzx"

# 注：构造归档需要知道 LZX 头字段是**小端**存储（unlzx.c 末尾结构注释原文
# "FUCKED UP LITTLE ENDIAN SHIT"）。第一版生成器按大端写，header CRC 必被拒；
# 改为小端后 header CRC、data CRC 与解包内容全部通过（WSL 实测）。
# CRC 算法 = 标准 CRC-32（表首项 0x00000000/0x77073096/0xEE0E612C），
# 与 Python zlib.crc32 逐位一致（已用 unlzx 自身的 crc_calc 对照验证：
# 两边都得出 0xE190CC6E）。

assertion_count: 4
