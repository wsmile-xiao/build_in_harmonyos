# conandata.yml — unlzx 1.1
# Source: Aminet, the project's original distribution point.  The readme
#   (https://aminet.net/misc/unix/unlzx.c.readme) names Erik Meusel as the
#   author of v1.1 (03.04.01); the package is uploaded by David Tritscher.
# The distribution is a single gzip-compressed C file: unlzx.c.gz -> unlzx.c
# (36298 bytes uncompressed).  sha256 below is of the .gz as served.

sources:
  url: "https://aminet.net/misc/unix/unlzx.c.gz"
  sha256: "3cfd5dfe34482f91b6fbfc6a5fdd44c7454ce4867061e99cda8aaba628208f7d"

patches:
  - patch_file: "patches/0001-unlzx-missing-includes.patch"
    patch_description: >-
      add the two system headers the source uses but never includes:
      <sys/stat.h> for mkdir() and <unistd.h> for getopt()/optind.  Both were
      implicit declarations, which is a hard error with any compiler that
      treats -Wimplicit-function-declaration as an error (GCC 14+ does, and
      C23 made it one)
    patch_type: "portability"
  - patch_file: "patches/0002-add-GNUmakefile.patch"
    patch_description: >-
      add GNUmakefile: the distribution contains no build file at all, only
      the comment "Compile with: gcc unlzx.c -ounlzx -O6" at the top of the
      source.  This adds the equivalent GNU make rule and takes the compiler
      and flags from the Conan toolchain environment
    patch_type: "portability"
