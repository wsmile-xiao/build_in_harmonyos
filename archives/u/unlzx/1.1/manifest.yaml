knowledge_gained:
  - "unlzx.c 调用 mkdir() 与 getopt() 但只 include 了 stdlib.h/stdio.h —— 二者都是隐式声明。GCC 14+ 默认把 -Wimplicit-function-declaration 升级为 error（C23 正式删除隐式声明），不补 <sys/stat.h>/<unistd.h> 在现代工具链上根本无法编译"
  - "Conan 的 get() 支持裸 .gz 单文件源：unzip() 里 '.gz' 分支把 unlzx.c.gz 解成 unlzx.c（文件名去掉 .gz），不需要先解包成 tar"
  - "LZX 归档格式：10 字节 info header（'LZX'+flags+6B）后接每个成员 31 字节 Archive_Header（'FUCKED UP LITTLE ENDIAN SHIT' —— 所有多字节字段都是小端）+ filename + comment + data；pack_mode 0=stored、2=LZX 压缩、32=EOF"
  - "header CRC = CRC-32(31 字节 header，其中 CRC 字段先置 0) → 再 CRC-32(filename) → 再 CRC-32(comment)，链式累积；与 Python zlib.crc32 的增量语义完全一致（已用 unlzx 自身 crc_calc 对照：同得 0xE190CC6E）"
  - "构造测试归档时若按大端写多字节字段，header CRC 必然校验失败并报 'CRC: Archive_Header'（实测踩坑）；LZX 是小端"
  - "unlzx.c 的 view_archive() 用 %ld 打印 unsigned int（14 处），在 LP64 上是格式串与实参类型不匹配。属于上游 1998 年的既有缺陷，只影响 -v 的表格数字显示，不影响解包路径；本配方不修改，test_package 也不依赖这些数字"

