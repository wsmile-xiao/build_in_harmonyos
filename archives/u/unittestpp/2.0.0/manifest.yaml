# 版本级 manifest — unittestpp 2.0.0
# 遵循 ARCHIVE-SPEC v3.0

version: "2.0.0"
software: unittestpp
status: built
build_date: "2026-09-16"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/unittest-cpp/unittest-cpp/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "74852198877dc2fdebdc4e5e9bd074018bf8ee03a13de139bfe41f4585b2f5b9"
  tar_format: tar.gz

# ============================================================
# 构建信息
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"    # CMake 4.x 兼容上游 cmake_minimum_required(2.8.1)
    - "-DUTPP_INCLUDE_TESTS_IN_BUILD=ON"      # 构建并执行上游 TestUnitTest++
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"  # 静态库 PIC
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 4.x 移除 <3.5 兼容：上游 cmake_minimum_required(VERSION 2.8.1) 需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 放行（须在 cmake 命令行，toolchain 里 set 太晚）"
  - "上游 CMakeLists 硬编码 STATIC（add_library(UnitTest++ STATIC ...)），shared 选项显式拒绝"
  - "上游测试以 POST_BUILD 自动执行：构建机=OHOS aarch64 设备时 TestUnitTest++ 直接原生运行，268 用例全过"
  - "AArch64 上整数除零不触发 SIGFPE（SDIV 返回 0），不能作为崩溃注入手段"
  - "本设备上『执行空指针函数调用』的硬件指令中止会让进程挂起（raise(SIGSEGV)/空指针数据访问/__builtin_trap 均能被 SignalTranslator 正常翻译），控制类测试用 raise() 保证确定性"

# ============================================================
# 测试统计（实测，2026-09-16，OHOS aarch64 真机，clang 15.0.4）
# ============================================================

upstream_tests:
  type: custom            # CMake POST_BUILD 自动执行（非 ctest）
  source_files: 21        # tests/*.cpp（另含 Main.cpp）
  # 计数口径（与平台审查一致）：源码注册清点 277（含 9 个 UNITTEST_USE_CUSTOM_STREAMS
  # 专属用例；不含 2 个仅 UNITTEST_NO_EXCEPTIONS 模式生效的重复用例）
  total: 277
  # 实测执行：Release/Conan 构建 268（差异 9 = custom-stream 分支未启用）；
  # 上游默认构建配置 267（Release 额外启用 1 个 NDEBUG-only 崩溃用例）
  executed_release: 268
  executed_default: 267
  passed: 268
  failed: 0
  ignored: 0

conan_tests:
  positive: "9/9 通过（test_unittestpp，公共宏 API 消费者用例）"
  negative_control: "3 用例中 2 个预期失败被如实上报（rc=2，含 raise(SIGSEGV) 信号翻译）"
