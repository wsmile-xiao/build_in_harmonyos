# test_package/MANIFEST.yml — unittestpp 2.0.0
# 上游官方测试来源声明（CI L0e 门禁要求）

package: unittestpp/2.0.0
homepage: "https://github.com/unittest-cpp/unittest-cpp"

# 上游构建系统（CI 据此选择测试执行方式）
upstream:
  build_system: cmake
  # 测试类型: make_check | ctest | meson_test | pytest | none | custom
  # 上游不用 CTest：CMakeLists 以 add_custom_command(POST_BUILD) 自动执行
  # TestUnitTest++；配方 build() 末尾再显式运行一次并解析结果（HMBS_UPSTREAM_TEST_RESULT）
  test_type: custom
  test_command: "TestUnitTest++（cmake --build 时 POST_BUILD 自动执行；配方 build() 末尾显式重跑）"
  test_directory: "tests"

# 上游测试统计（2026-09-16，OHOS aarch64 真机，clang 15.0.4）
upstream_test_stats:
  source_files: 21     # tests/*.cpp（另有 Main.cpp 入口），框架自身 dogfood 测试
  # 计数口径（与平台审查一致）：源码注册清点 277（含 9 个 UNITTEST_USE_CUSTOM_STREAMS
  # 专属用例；不含 2 个仅 UNITTEST_NO_EXCEPTIONS 模式生效的重复用例）
  total_tests: 277
  # 实测执行：Release/Conan 构建 268（"Success: 268 tests passed."，差异 9 = custom-stream 分支未启用）；
  # 上游默认构建配置 267（Release 额外启用 1 个 NDEBUG-only 崩溃用例）
  executed_release: 268
  executed_default: 267
  passed: 268
  failed: 0
  ignored: 0

# OHOS 平台兼容性
ohos_compatibility:
  status: full
  detail: >-
    零源码补丁：平台层 UnitTest++/Posix/（gettimeofday/usleep + sigsetjmp/sigaction
    信号翻译）在 OHOS musl 上原生可用；Config.h 依据三元组自动选中 Posix 路径；
    上游测试 Release 实测 268/268 全过（源码清点 277，差异 9 为 custom-stream
    条件编译分支），Posix 信号翻译（raise(SIGSEGV) → 测试失败而非崩溃）经
    消费者反向对照实测通过
  verified_features:
    - "核心断言宏（CHECK/CHECK_EQUAL/CHECK_CLOSE/CHECK_ARRAY_*/CHECK_THROW）"
    - "TEST/TEST_FIXTURE/SUITE/REQUIRE 宏与 RequiredCheckException 路径"
    - "Posix Timer/SleepMs（gettimeofday/usleep）与时间约束 TimeConstraint"
    - "Posix SignalTranslator：raise(SIGSEGV) 被 sigsetjmp/siglongjmp 翻译为测试失败"
    - "静态库 libUnitTest++.a + 公共头文件 include/UnitTest++/ 安装树完整"

# Conan test_package 测试（CI 通过 conan create 自动执行）
conan_test:
  type: consumer_api_check
  description: >-
    正向 9 用例（宏 API/夹具/套件/异常/计时/时间约束）+ 反向对照 3 用例
    （断言失败与 raise(SIGSEGV) 信号必须被如实上报）
  test_method: >-
    真实链接打包静态库运行：正向退出码 0 且输出 "Success: 9 tests passed."；
    反向对照退出码 = 失败数 2 且输出 "FAILURE: 2 out of 3 tests failed (2 failures)."

# 测试断言总数（近似值：正向 18 次断言宏调用 + 反向对照 3 次 = 21）
assertion_count: 21
