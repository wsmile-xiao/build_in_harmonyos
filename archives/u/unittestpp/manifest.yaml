software: unittestpp
display: "UnitTest++"
description: "轻量级 C++ 单元测试框架（unittest-cpp），单静态库零依赖"
category: library
homepage: "https://github.com/unittest-cpp/unittest-cpp"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "零源码补丁；Posix 平台层（gettimeofday/usleep + sigsetjmp/sigaction 信号翻译）在 OHOS musl 上原生可用"
    - "CMake 4.x 需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 放行上游 cmake_minimum_required(VERSION 2.8.1)（recipe 内置）"
    - "上游构建系统默认静态库（add_library(... STATIC ...)），shared 选项显式拒绝"
    - "上游测试（POST_BUILD 自动执行的 TestUnitTest++；源码清点 277 用例，Release 实测执行 268 用例、默认配置 267）在 OHOS aarch64 真机全过"
  common_dependencies: []

versions:
  "2.0.0":
    status: built
    build_date: "2026-09-16"
    conan_ref: "unittestpp/2.0.0"
    source_url: "https://github.com/unittest-cpp/unittest-cpp/archive/refs/tags/v2.0.0.tar.gz"
