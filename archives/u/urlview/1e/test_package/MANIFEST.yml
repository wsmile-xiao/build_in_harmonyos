package: urlview/1e
homepage: "https://sr.ht/~nabijaczleweli/urlview-ng"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 CC=<tools.build:compiler_executables[c]> CXX=<...[cpp]> VERSION=1e SOURCE_DATE_EPOCH=0 SHELLCHECK=: LOCALES= check"
upstream_tests:
  - "quote.cpp `#if TEST` main() -> 2 assertions on quotesub() shell-escaping (both table cases); built and executed by `make check`"
  - ".builds/sid+void.yml -> `make -C urlview-ng check SHELLCHECK=:` + smoketest `urlview urlview-ng/text`"
  - "no tests/ directory, no ctest/CTestTestfile, no automake TESTS/check_PROGRAMS (bare Makefile, see notes.md 上游测试清点)"

test_package_tests:
  - file: test.sh
    description: >-
      真运行包内 urlview 二进制的行为测试：8 条 URL 抽取用例（逐字节比对 stdout，
      含 stderr 合并）+ 1 条 `urlview -` stdin 形态 + 1 条缺文件负例（比对 stderr 告警行），
      再核 4 个随包安装文件与 url_handler.sh 的 shebang；共 25 条断言
      （计数由脚本自增并打印 "urlview consumer assertions: 25"，任一不符 exit 1）。
      每次调用 HOME 钉在 mktemp 出来的空目录，避免 $HOME/.urlview 改写 REGEXP/COMMAND。
  - file: conanfile.py
    description: >-
      test() 只做驱动：以 test_type=explicit 依赖被测 reference，在 conanrun env 下
      `sh test.sh <pkg>/bin/urlview <pkg>`；self.run 非 0 退出即抛 ConanException。

assertion_count: 25
