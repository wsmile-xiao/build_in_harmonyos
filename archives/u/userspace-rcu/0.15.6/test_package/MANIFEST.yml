# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: userspace-rcu/0.15.6
homepage: "https://liburcu.org"

# Upstream test command (make check runs 636 tests: 632 PASS, 4 SKIP, 0 FAIL)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: ""

# Upstream test programs (unit tests run via TAP harness)
upstream_tests:
  - file: tests/unit/test_build
    source: userspace-rcu-0.15.6/tests/unit/test_build.c
    description: "Build mode validation (static/dynamic, C/C++)"
    command: "make check"
  - file: tests/unit/get_cpu_mask_from_sysfs
    source: userspace-rcu-0.15.6/tests/unit/get_cpu_mask_from_sysfs.c
    description: "CPU mask parsing from sysfs (SKIP on non-Linux)"
    command: "make check"

# test_package consumer-side tests
test_package_tests:
  - file: test.c
    description: "Link and call urcu_read_lock/urcu_read_unlock API"
    command: "./test_userspace_rcu"

# Test assertion count (approximate, for quality assessment)
assertion_count: 636
