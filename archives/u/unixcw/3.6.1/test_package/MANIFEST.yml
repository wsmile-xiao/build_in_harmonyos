# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 强制要求）
package: unixcw/3.6.1
homepage: "https://sourceforge.net/projects/unixcw/"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: libcw_tests
    source: unixcw-3.6.1/src/libcw/tests
    description: "libcw unit tests (NULL audio backend, -Q -S n)"
    command: "./libcw_tests -Q -S n -L 1"
  - file: cw_dictionary_tests
    source: unixcw-3.6.1/src/cwutils
    description: "cw dictionary unit tests"
    command: "./cw_dictionary_tests"
  - file: cwutils_tests
    source: unixcw-3.6.1/src/cwutils/tests
    description: "cwutils argument handling tests"
    command: "./cwutils_tests"
  - file: cwgen_args
    source: unixcw-3.6.1/src/cwgen/tests
    description: "cwgen argument handling tests"
    command: "./cwgen_args"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_unixcw.c
    description: "consumer linking libcw and exercising public API"
    command: "./test_unixcw"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 6
