# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: unixcw/3.5.1
homepage: "https://sourceforge.net/projects/unixcw/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/libcw/libcw_test_internal.sh
    source: unixcw-3.5.1/src/libcw/libcw_test_internal.sh
    description: "libcw internal tests"
    command: "./libcw_test_internal.sh"
  - file: src/libcw/tests/libcw_test_tq_short_space.sh
    source: unixcw-3.5.1/src/libcw/tests/libcw_test_tq_short_space.sh
    description: "libcw tone queue short space test (platform-dependent, may fail on OHOS)"
    command: "./tests/libcw_test_tq_short_space.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 libcw cw_generator_new API 可调用"
    command: "./test_unixcw"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
