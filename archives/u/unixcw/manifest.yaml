software: unixcw
display: "unixcw - Morse code library"
description: "Morse code (CW) library and tools (libcw)"
category: comms
homepage: "https://sourceforge.net/projects/unixcw/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub OHOS triplet 识别补丁（HarmonyOS -> aarch64-unknown-linux-ohos）"
    - "libtool 版本标志可覆盖（LIBCW_LIBTOOL_VERSION_FLAGS），OHOS 上以 -avoid-version 产出无版本号 libcw.so"
    - "禁用可选组件: --disable-xcwcp --disable-cwcp --disable-pulseaudio --disable-oss --disable-console"
    - "textdomain 探测改为非致命（OHOS libc 无 textdomain，i18n 优雅降级）"
    - "configure umask 077 -> 022（E002/HMDFS）"
  common_dependencies:
    - alsa-lib

versions:
  "3.6.1":
    status: built
    build_date: "2026-09-13"
