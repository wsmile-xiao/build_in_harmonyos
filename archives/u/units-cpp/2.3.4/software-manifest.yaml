software: units-cpp
display: "units-cpp (units)"
description: "编译期、header-only 的 C++14 单位换算与量纲分析库"
category: library
homepage: "https://github.com/nholthaus/units"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only：仅安装 include/units.h，被引用为 #include <units.h>，无 .a/.so"
    - "CMake 4.x 兼容：上游声明 cmake_minimum_required(VERSION 3.2...3.5)，需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "build() 用随源码分发的 googletest 1.12.1 编译并运行上游 188 个 TEST_F；其中 186 通过，2 项（to_string_locale 需 de_DE.utf8/en_US.utf8、cout 需可写 /tmp）因 OHOS 平台环境差异排除"
    - "CMake 目标 units::units（find_package(units)）"
  common_dependencies: []

versions:
  "2.3.4":
    status: built
    build_date: "2026-09-17"
    conan_ref: "units-cpp/2.3.4"
