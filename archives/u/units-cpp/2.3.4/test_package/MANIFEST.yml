# test_package/MANIFEST.yml
package: units-cpp/2.3.4
homepage: https://github.com/nholthaus/units

# 上游测试三步法（R51）清点结果
upstream_tests_exist: true
upstream_test_audit: >-
  unitTests/main.cpp 为 GoogleTest 套件，实测注册用例 188 个
  （取数：`unitTests/unitLibTest --gtest_list_tests | grep -c '^  '`；
  源码内 `TEST_F` 行 189 行，其中 UnitContainer.trivial 由 `#ifdef _MSC_VER`
  包裹，clang 下不编译）。googletest 1.12.1 以
  3rdParty/gtest/googletest-1.12.1.zip 随源码分发（FetchContent 本地 zip），
  CI 可离线构建，故 build() 内真实编译并运行。
upstream_check_command: >-
  cmake -S . -B build -DBUILD_TESTS=ON &&
  cmake --build build --target unitLibTest &&
  ./build/unitTests/unitLibTest
upstream_test_in_build: true
upstream_test_command: >-
  unitTests/unitLibTest
  --gtest_filter=-UnitContainer.to_string_locale:UnitContainer.cout

upstream_tests:
  - file: unitTests/main.cpp
    source: units-2.3.4/unitTests/main.cpp
    description: >-
      上游 GoogleTest 套件，注册 188 个 TEST_F（类型特征 47、单位容器 28、
      单位换算 38、数学 38、编译期算术 9、边界 16、常量 5、算子 5、案例 2）
    command: >-
      unitTests/unitLibTest
      --gtest_filter=-UnitContainer.to_string_locale:UnitContainer.cout
    skipped: false
    skip_reason: >-
      186/188 运行通过；排除 2 项，均为平台环境差异而非库缺陷：
      （1）UnitContainer.to_string_locale 断言 de_DE.utf8 / en_US.utf8
      （OHOS bionic 无 locale 数据，setlocale 返回 NULL）；
      （2）UnitContainer.cout 依赖 gtest CaptureStdout，其写入硬编码的 /tmp，
      而真机 /tmp 对普通用户只读。

test_package_tests:
  - file: test_units.cpp
    description: >-
      鸿蒙消费者用例 20 项：长度（m/ft/km/mi）、质量（kg→g）、时间（min→s）、
      温度（C↔F 仿射换算）、能量（kJ→J）、功率（kW→W）、速度（m/s→km/h）、
      数据单位（bit/byte/kB/KiB）、用户自定义字面量、容器算术、to_string、
      unit_cast、std::chrono 双向互操作
    command: "ctest -R test_units"

test_package_test_count: 1
consumer_assertion_count: 20
assertion_count: 20
