software: uuid
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.40/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.40"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.40/util-linux-2.40.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: autotools

build:

  # 配置选项列表
  configure_options:
    - "--disable-all-programs"
    - "--enable-libuuid"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-config.h.patch"
  - "0003-config.log.patch"
  - "0004-config.status.patch"
  - "0005-libblkid-docs-Makefile.patch"
  - "0006-libfdisk-docs-Makefile.patch"
  - "0007-libmount-docs-Makefile.patch"
  - "0008-libsmartcols-docs-Makefile.patch"
  - "0009-libtool.patch"
  - "0010-po-man-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "使用 --disable-all-programs --enable-libuuid 只编译 uuid 组件"
  - "util-linux 包含大量工具，只需编译 libuuid 即可满足依赖"