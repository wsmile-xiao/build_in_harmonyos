# test_package/MANIFEST.yml — uisp 20050207 上游测试声明
package: uisp/20050207
homepage: "https://www.nongnu.org/uisp/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 清点依据：configure 后 `make check` 仅递归进入 src/ 无实际测试动作
# （src/Makefile check-am 为空操作，上游未提供任何测试源/测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: run_uisp_test.c
    description: "运行打包产物 uisp --version，断言退出码 0 且输出版本号"
    command: "./run_uisp_test"

# 测试断言总数 (近似值)
assertion_count: 2
