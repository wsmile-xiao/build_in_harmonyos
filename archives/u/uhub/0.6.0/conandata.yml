sources:
  "0.6.0":
    url: "https://github.com/janvidar/uhub/archive/refs/tags/0.6.0.tar.gz"
    sha256: "2f0cc7f8b487ffc480c13810ee2da076f8b4420eecb815044fccbea25f23c49f"
patches:
  "0.6.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Use prefix-relative install destinations; upstream installs to absolute /usr/lib/uhub and /etc/uhub, which escape the package folder"
      patch_type: "portability"
    - patch_file: "patches/0002-src-util-threads.c.patch"
      patch_description: "Implement uhub_thread_cancel() without pthread_cancel(), which the OHOS libc does not provide"
      patch_type: "portability"
