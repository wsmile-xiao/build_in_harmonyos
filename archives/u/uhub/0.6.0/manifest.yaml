build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
  dependencies:
    - openssl/3.5.8.1
    - sqlite3/3.53.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-util-threads.c.patch"

knowledge_gained:
  - "OHOS 真机上 CMake 原生探测 CMAKE_SYSTEM_NAME=HarmonyOS，而 CMake 无 Platform/HarmonyOS.cmake → UNIX 变量为假，上游 if(UNIX) 分支（install 规则、pthread 链接、uhub-admin）被静默跳过；配方须显式钉为 Linux（tc.variables 写入 conan_toolchain.cmake 才生效，cache_variables 只进 presets）"
  - "OHOS libc 未提供 pthread_cancel()（头文件无声明且 libc.so 无该符号），可用 SIGUSR1 + pthread_exit() 实现等价中断语义"
  - "上游 install DESTINATION 使用绝对路径 /usr/lib/uhub 与 /etc/uhub，会越过 conan 包目录并污染构建机文件系统，须改为 lib/uhub 与 etc/uhub"
  - "Conan CMakeDeps 默认 config 模式不提供 legacy MODULE 变量（OPENSSL_INCLUDE_DIR / OPENSSL_SSL_LIBRARY / SQLite3_LIBRARY），需 cmake_find_mode=none 配合工具链变量钉住 conan 包内实际路径"

