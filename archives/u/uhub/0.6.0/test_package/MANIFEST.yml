# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: uhub/0.6.0
homepage: "https://github.com/janvidar/uhub"

# 上游未注册 ctest / automake check（无 enable_testing()/add_test()），测试入口为直接执行 autotest-bin
upstream_check_command: "./autotest-bin"

# conanfile.py build() 中未集成上游测试（application 包，上游测试需在真机运行目标二进制）
upstream_test_in_build: false
upstream_test_command: "./autotest-bin"

# 上游实际运行的测试程序
upstream_tests:
  - file: autotest/test.c
    source: uhub-0.6.0/autotest/test.c
    description: "上游单测驱动，链接 uhub 全部源文件（CMake 目标 autotest-bin）"
    command: "./autotest-bin"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行时冒烟：版本输出 / uhub-passwd 用户库增删查 / 插件产物 / uhub -C 配置解析 / 服务启动与插件加载"
    command: "sh ./test.sh"

# 测试断言总数（上游 autotest-bin 真机实测输出：Tests passed 817）
assertion_count: 817
