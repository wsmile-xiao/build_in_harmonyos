software: uWebSockets
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/18/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "18"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"
compile_date: "2026-06-24"

# 构建系统类型（顶级字段，用于质量门禁检查）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/uNetworking/uWebSockets/archive/refs/tags/v18.20.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "WITH_OPENSSL=1"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "openssl/3.5.6"
    - "zlib/1.3.1"
    - "uSockets/0.7.1"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "uWebSockets 是 header-only C++ 库，使用 Makefile 构建 examples/tests"
  - "GitHub tarball 不包含 git submodule，需手动下载 uSockets 源码到 uSockets/ 目录"
  - "需要 WITH_OPENSSL=1 启用 SSL 支持，使用已安装的 OpenSSL 3.5.6"
  - "编译使用 std=c++2a (C++20)，clang++ 默认支持"
  - "uSockets Makefile 先编译 .o 文件再创建 uSockets.a，examples 链接 uSockets/*.o"
  - "示例二进制运行前需 ELF 签名 (ohc-run.py sign-elf)"
  - "SSL 示例引用 ../misc/key.pem，需从 examples/ 子目录运行"

# ============================================================
# 功能测试
# ============================================================

functional_test:
  date: "2026-06-24"
  result: passed
  report: reports/functional-test-report.md
  tests:
    http_basic: pass
    http_concurrent_10: pass
    http_routing: pass
    ws_handshake: pass
    ws_echo: pass
    ws_binary: pass
    ws_concurrent_5: pass
    ssl_https: pass
    ssl_wss_upgrade: pass
  notes: "HTTP/WebSocket/SSL 功能全部正常，可在鸿蒙平台使用"
