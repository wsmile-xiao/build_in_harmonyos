software: uSockets
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.7.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶层，供 verify-build 检查）
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"
compile_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/uNetworking/uSockets/archive/c06112c89b4c1cf5a09b5f8daa2def756b925889.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "WITH_OPENSSL=1"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "uSockets 使用纯 Makefile，无 configure/make install，需手动安装头文件和静态库"
  - "WITH_OPENSSL=1 启用 OpenSSL 支持，编译 src/crypto/*.cpp 需要 C++17"
  - "OpenSSL 3.x 下 PEM_read_DHparams 和 DH_free 已 deprecated，仅为警告不阻塞"
  - "Makefile override CFLAGS/LDFLAGS 会追加到环境变量后面"
  - "静态库被 uWebSockets 链接使用，不单独产生可执行二进制"

# ============================================================
# 功能测试
# ============================================================

functional_test:
  date: "2026-06-24"
  result: passed
  report: ../uWebSockets/18/reports/functional-test-report.md
  method: "indirect (通过 uWebSockets 上层验证)"
  tests:
    epoll_event_loop: pass
    socket_listen: pass
    openssl_integration: pass
    concurrent_connections: pass
    websocket_frame_parsing: pass
    sni_support: pass
  notes: "核心 API 符号完整 (us_create_socket_context 等)，通过 uWebSockets 上层功能测试全部通过"
