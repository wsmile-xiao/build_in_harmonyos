# test_package/MANIFEST.yml
# upb 0.0.0-git200730 - upstream test declaration.

package: upb/0.0.0-git200730
homepage: "https://github.com/protocolbuffers/upb"

upstream_tests_exist: true
upstream_test_audit: >-
  Upstream declares 8 cc_test programs in ./BUILD (test_varint,
  test_generated_code, test_decoder, test_cpp, test_table, test_encoder,
  test_json, test_lua); the CMakeLists shipped in the snapshot builds none of
  them (cc_test is commented out in tools/make_cmakelists.py).  Two require no
  protoc-generated headers and are built and run here: tests/pb/test_varint.c
  and tests/test_table.cc (both linked through tests/testmain.cc).  The other
  six need `*.upb.h` / `*.upbdefs.h` generated by protoc + the protoc-gen-upb
  plugin built from upbc/ (protobuf + abseil, Bazel toolchain) or a Lua 5.2
  runtime, neither of which exists in this environment.
upstream_check_command: "clang test_varint.c testmain.cc libupb.a && ./test_varint; clang++ test_table.cc testmain.cc libupb.a && ./test_table"
upstream_test_in_build: true
upstream_test_command: "build+run tests/pb/test_varint.c and tests/test_table.cc"
upstream_tests:
  - file: "tests/pb/test_varint.c"
    description: "varint/zigzag encode-decode round trips (2 decoder variants); built and run here"
  - file: "tests/test_table.cc"
    description: "upb hash table (upb/table.int.h); built and run here"
  - file: "tests/test_json.cc"
    description: "needs tests/json/test.upb.h + test.upbdefs.h from protoc-gen-upb; not run (no protoc/upbc toolchain)"
  - file: "tests/test_cpp.cc"
    description: "needs tests/test_cpp.upbdefs.h from protoc-gen-upb; not run (no protoc/upbc toolchain)"
  - file: "tests/test_generated_code.c"
    description: "needs tests/test.upb.h + test_messages_proto3.upb.h; not run (no protoc/upbc toolchain)"
  - file: "tests/pb/test_decoder.cc"
    description: "needs tests/pb/test_decoder.upbdefs.h; not run (no protoc/upbc toolchain)"
  - file: "tests/pb/test_encoder.cc"
    description: "needs google/protobuf/descriptor.upbdefs.h; not run (no protoc/upbc toolchain)"
  - file: "tests/bindings/lua/test_upb.lua"
    description: "needs a Lua 5.2 runtime and the upb Lua bindings; not run (not available)"

test_package_tests:
  - file: test_upb.c
    description: "C consumer: varint/zigzag/size helpers from the installed upb/pb/varint.int.h against libupb.a (9 assertions)"
    command: "clang test_upb.c -lupb && ./test_upb"

test_files:
  - path: "test_package/test_upb.c"
    test_type: "R34"
    assertion_count: 11

test_package_test_count: 1
consumer_assertion_count: 11
upstream_test_cases: 8
assertion_count: 11
