# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 台账口径（R51 三步法，详见 notes.md「验证结果」）:
#   上游 ctest 注册 43 用例（17 个测试二进制，CMakeLists register_tests() 显式枚举）
#   OHOS aarch64 本机实测 43/43 PASSED（串行）；首轮 -j4 并发 7 条瞬时失败
#   （0.01-0.02s 即崩），串行重跑全绿——共享 TMPDIR 并发竞态瞬态环境问题，非产品缺陷

package: uhdm/1.86
homepage: "https://github.com/chipsalliance/UHDM"

# 上游测试命令
upstream_check_command: "cmake --build . --target UnitTests && ctest -N"

# conanfile.py build() 方法中是否已集成上游测试（配方无测试交付，UHDM_BUILD_TESTS=OFF）
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure（探索阶段已执行，TMPDIR 指向可写目录，见 notes.md）"

# 上游实际运行的测试程序（17/17 全跑，ctest 43/43 PASSED）
upstream_tests:
  - file: tests/classes_test.cpp
    source: UHDM-1.86/tests/classes_test.cpp
    description: "类层级/对象属性测试"
    command: "./classes_test"
  - file: tests/error-handler_test.cpp
    source: UHDM-1.86/tests/error-handler_test.cpp
    description: "错误处理器行为测试"
    command: "./error-handler_test"
  - file: tests/expr_prettyPrint_test.cpp
    source: UHDM-1.86/tests/expr_prettyPrint_test.cpp
    description: "表达式 prettyPrint 测试"
    command: "./expr_prettyPrint_test"
  - file: tests/expr_reduce_test.cpp
    source: UHDM-1.86/tests/expr_reduce_test.cpp
    description: "表达式化简（reduce）测试"
    command: "./expr_reduce_test"
  - file: tests/full_elab_test.cpp
    source: UHDM-1.86/tests/full_elab_test.cpp
    description: "全量 elaboration 测试"
    command: "./full_elab_test"
  - file: tests/garbage_collect_test.cpp
    source: UHDM-1.86/tests/garbage_collect_test.cpp
    description: "垃圾回收测试"
    command: "./garbage_collect_test"
  - file: tests/group_membership_test.cpp
    source: UHDM-1.86/tests/group_membership_test.cpp
    description: "组归属（group membership）测试"
    command: "./group_membership_test"
  - file: tests/listener_elab_test.cpp
    source: UHDM-1.86/tests/listener_elab_test.cpp
    description: "elaboration 监听器测试"
    command: "./listener_elab_test"
  - file: tests/module-port_test.cpp
    source: UHDM-1.86/tests/module-port_test.cpp
    description: "module-port 连接测试"
    command: "./module-port_test"
  - file: tests/process_test.cpp
    source: UHDM-1.86/tests/process_test.cpp
    description: "VPI process 对象测试"
    command: "./process_test"
  - file: tests/statement_test.cpp
    source: UHDM-1.86/tests/statement_test.cpp
    description: "statement 对象测试"
    command: "./statement_test"
  - file: tests/symbol_factory_test.cpp
    source: UHDM-1.86/tests/symbol_factory_test.cpp
    description: "符号工厂测试"
    command: "./symbol_factory_test"
  - file: tests/tf_call_test.cpp
    source: UHDM-1.86/tests/tf_call_test.cpp
    description: "TF 调用测试"
    command: "./tf_call_test"
  - file: tests/uhdm_listener_test.cpp
    source: UHDM-1.86/tests/uhdm_listener_test.cpp
    description: "UHDM 监听器测试"
    command: "./uhdm_listener_test"
  - file: tests/vpi_get_test.cpp
    source: UHDM-1.86/tests/vpi_get_test.cpp
    description: "vpi_get 属性读写回环测试（test_package test.cpp 即取其范式）"
    command: "./vpi_get_test"
  - file: tests/vpi_listener_test.cpp
    source: UHDM-1.86/tests/vpi_listener_test.cpp
    description: "VPI 监听器测试"
    command: "./vpi_listener_test"
  - file: tests/vpi_value_conversion_test.cpp
    source: UHDM-1.86/tests/vpi_value_conversion_test.cpp
    description: "VPI 值转换测试"
    command: "./vpi_value_conversion_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: libuhdm VPI API 读写回环（上游 vpi_get_test 范式）+ uhdm-dump CLI 冒烟（无参打印 usage，exit 0）"
    command: "./test_uhdm"

# 测试断言总数 (近似值, 用于质量评估): ctest 注册 43 用例
assertion_count: 43
