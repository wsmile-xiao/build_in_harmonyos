# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.86/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.86"

# 软件名
software: "uhdm"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-30"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/chipsalliance/UHDM/archive/refs/tags/v1.86.tar.gz"

  # 源码校验和
  sha256: "179203b166be5d1be12b901c69c6a569ebebf4fe47bc674b1268bd9319216fce"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DUHDM_USE_HOST_CAPNP=ON"
  - "-DUHDM_BUILD_TESTS=OFF"
  - "-DBUILD_SHARED_LIBS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "capnproto/1.3.0"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "CMake 不认识 HarmonyOS 平台（E092）：CMAKE_SONAME cache 变量（UNINITIALIZED+FORCE）写入 CMakeCache.txt 也不进入 link.txt，shared libuhdm.so 无 SONAME，DT_NEEDED 内嵌相对路径 lib/libuhdm.so，运行时 loader relocation 失败（符号实际在 .so 内，symbol not found 是下游症状）；配方改默认静态 + shared=True 时 CMAKE_SHARED_LINKER_FLAGS 显式 -Wl,-soname,libuhdm.so（详见本 PR 知识草稿 SONAME 条目）"
- "capnproto 双声明：tool_requires 提供 capnpc/capnpc-c++ 代码生成器，同时需 requires（生成的公共头 include capnp 头、静态 libuhdm.a 的消费者须链 capnp/kj 符号），package_info requires=capnproto::capnp（kj 经组件内依赖带入）"
- "UHDM_USE_HOST_CAPNP=ON 分支仅 find_package(CapnProto) 不设 CAPNP_EXECUTABLE/CAPNPC_CXX_EXECUTABLE（子项目分支才 FORCE 设置），消费方配方必须 tc.cache_variables 注入绝对路径"
- "pip 代码生成依赖（orderedmultidict 1.0.2/six 1.17.0）--no-deps --target 钉版进 build_folder/pydeps 私有 prefix（R49/E524）；PYTHONPATH 经 Environment().define + save_script（scope=build）注入"
- "上游 17 个 gtest 套件 / 43 个 ctest 用例，OHOS aarch64 串行实测 43/43 全绿；-j4 并发出现 7 条瞬态失败（共享 TMPDIR 竞态），串行复跑为口径"
- "上游 third_party/capnproto 子模块钉 1.1-dev 不构建（绕开 E543-66FA gnu++ 问题），制品不含测试（UHDM_BUILD_TESTS=OFF）"
- "上游 PUBLIC 编译选项 -include uhdm/config.h（O_BINARY 等）经 cmake_build_modules 构建模块携带（package() save + package_info set_property）；CMakeDeps 无法携带 raw compile options"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
