# 软件级 manifest
# 文件位置: archives/u/uwsgi/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: uwsgi

# 显示名
display: "uWSGI"

# 一句话描述
description: "uWSGI是一个快速、自我修复、开发者友好的WSGI服务器，用于部署Python Web应用"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: network

# 官网 URL
homepage: "https://uwsgi-docs.readthedocs.io/en/latest/"

# 开源许可证（SPDX 标识）
license: GPL-2.0+

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "uwsgiconfig.py需要添加HarmonyOS识别（uwsgi_os in ('Linux', 'HarmonyOS')）"
    - "使用nolang配置可成功编译核心功能，避免Python库路径问题"
    - "PTHREAD_CANCEL宏在鸿蒙上已定义，uwsgi.h重定义会触发警告但不阻塞"

  # 跨版本通用依赖
  common_dependencies:
    - libxml2
    - zlib
    - gettext

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.0.24":
    status: published
    build_date: "2026-05-25"
    published_as: uwsgi