# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS基于Linux内核，需在uwsgiconfig.py中添加识别（uwsgi_os in ('Linux', 'HarmonyOS')）"
  - "Python sysconfig在鸿蒙上返回错误路径（LIBDIR='/python3/lib'），导致无法链接libpython3.12"
  - "uwsgi使用自定义构建系统uwsgiconfig.py，不是标准autotools/cmake"
  - "PTHREAD_CANCEL宏在鸿蒙上已定义，uwsgi.h的重定义会触发警告但不阻塞编译"
  - "nolang配置可成功编译uwsgi核心功能，但无语言插件支持"
