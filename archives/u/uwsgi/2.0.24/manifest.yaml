# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "--build nolang"  # 使用nolang配置，避免Python库路径问题

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libxml2/2.12.5"  # XML配置支持
    - "zlib/1.3.1"      # 压缩支持
    - "gettext/0.22"    # libintl（Python运行时依赖）

  # 编译器
  cc: clang
  cxx: clang++

