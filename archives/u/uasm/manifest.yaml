software: uasm
display: "UASM"
description: "MASM 兼容的 x86 汇编器（UASM，Open Watcom 许可），可生成 bin/coff/elf64/win64/macho64 等目标格式"
category: development
homepage: "https://github.com/Terraspace/UASM"
license: Sybase-Open-Watcom-Public-License-1.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 C，无三方依赖；用上游 Makefile-Linux-GCC-64.mak + OHOS clang 构建"
    - "clang>=16 需降级 implicit-function-declaration / incompatible-pointer-types / int-conversion"
    - "codegenv2.c 在 aarch64 -O2 下被误编译，需 -O0（VEX/EVEX 编码才会正确）"
    - "expreval.c T_SHR 的 (unsigned long) 在 LP64 下位宽错误，改 uint_32（LLP64→LP64 坑）"
    - "上游 regress 为 Windows 专用，已移植 POSIX 运行器，机器码产物逐字节全对"
  common_dependencies: []

versions:
  "2.57":
    status: built
    build_date: "2026-10-03"
    conan_ref: "uasm/2.57"
    upstream_tag: "v2.57r"
