# test_package/MANIFEST.yml
# UASM 2.57 (upstream tag v2.57r).
#
# The upstream regression suite (regress/runtests.cmd + fcmp.exe) is
# Windows-only. This recipe ports it to POSIX (regress_runner.sh) and runs it
# in build() against the freshly built binary, byte-comparing with regress/exp/.
#
# The .err transcripts shipped in regress/exp/ are partly stale relative to the
# v2.57r sources (e.g. exp/plain_bin/ABSSEG.err references ..\src\mz\ABSSEG.ASM;
# exp/win64/record64.err was generated from a different revision of
# record64.asm: it reports lines 393/394/A2237 while the v2.57r source's
# corresponding constants are at lines 260/263/A2275; several error-category
# .err expectations predate v2.57r message changes). The runner therefore uses
# the machine code output (.bin/.obj) as the oracle for binary-output
# categories and the .err text only for the dedicated error categories.

package: uasm/2.57
homepage: https://github.com/Terraspace/UASM

upstream_tests_exist: true
upstream_test_audit: "regress/runtests.cmd iterates regress/src/<cat>/*.asm and compares with regress/exp/<cat>/ (Windows fcmp.exe)"
upstream_check_command: "regress/runtests.cmd (Windows-only); POSIX port = regress_runner.sh"
upstream_test_in_build: true
upstream_test_command: "bash regress_runner.sh <uasm> <regress-dir> oracle"
upstream_test_count: 477
upstream_passed: 469
upstream_failed: 8

# test_package consumer checks (OHOS-specific + portability-sensitive paths)
test_package_tests:
  - file: test_uasm.sh
    description: "version banner, plain MASM bin, 32-bit SHR (LP64 fix), CodeGenV2 VEX encoding, ELF64 object, error reporting"
    command: "sh test_uasm.sh <path-to-uasm> <workdir>"

test_files:
  - path: "test_package/test_uasm.sh"
    test_type: "R34"
    assertion_count: 6
    description: "6 consumer assertions against the installed uasm binary"

test_package_test_count: 1
consumer_assertion_count: 6
assertion_count: 6
