software: unittest
display: "unittest"
description: "xUnit 风格的 C++ 单元测试框架（David Carlton），以构造函数/析构函数做 setup/teardown"
category: library
homepage: "https://unittest.red-bean.com/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "零源码补丁：纯 C++03 + sigaction/siglongjmp 信号捕获 + cxxabi，在 OHOS musl 上原生可用"
    - "与 Homebrew 公式一致，以 -std=c++03 编译；静态库默认 -fPIC"
    - "上游只构建/安装静态库 libunittest.a，shared 选项显式拒绝"
    - "上游无 make check：make 默认目标即运行 test/unittesttest（63 叶子 + 6 套件容器 = 69 passes）"
    - "信号类测试以 raise() 注入，非硬件 fault，AArch64 语义一致"
  common_dependencies: []

versions:
  "0.50-62":
    status: built
    build_date: "2026-09-24"
    conan_ref: "unittest/0.50-62"
    source_url: "https://unittest.red-bean.com/tar/unittest-0.50-62.tar.gz"
