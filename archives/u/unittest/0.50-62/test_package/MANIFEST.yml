# test_package/MANIFEST.yml — unittest 0.50-62
# 上游官方测试来源声明（CI L0e 门禁要求）
# 详见: docs/TEST_QUALITY_SPEC.md

package: unittest/0.50-62
homepage: "https://unittest.red-bean.com/"

# ── 上游测试：已在包构建中真实编译并执行 ────────────────────────────────
# 上游为经典 Autotools 工程（无 make check / ctest；默认目标 all 依赖 test）。
# 配方 build() 执行 `./configure && make`（构建 lib/libunittest.a 并运行
# test/unittesttest，任一失败则 make 直接报错），随后显式重跑
# test/unittesttest 捕获日志、解析汇总行并输出 HMBS_UPSTREAM_TEST_RESULT
#（解析与断言逻辑见 conanfile.py _run_upstream_tests）。
upstream_check_command: "make (default all->test runs ./unittesttest)"
upstream_test_in_build: true
upstream_test_command: "test/unittesttest (built by make; re-run with log capture in build())"

# ── 分母（与官方口径一致）────────────────────────────────────────────
# 取数（unittest-0.50-62.tar.gz 解包审计）：
#   test/ 内 6 个 All 套件的 add<>/add(TestPtr) 注册，共 63 个叶子用例：
#     ExistingBaseTest.cpp: Count, Destructor = 2
#     RegistryTest.cpp: Zero, One, Two, Missing, ArgsFirst, PassFail,
#       Stream, StatusBad, StatusGood, Debug, DebugArg, List = 12
#     SuiteTest.cpp All: Order, PassFailLeaf, PassFailSuite, Stream,
#       StreamError, SetUpAssertionFailure, SetUpException, RunException,
#       TearDownException, SetUpSignal, RunSignal, TearDownSignal,
#       DivideByZero, Abort, BadAssertion, TemplatedNewTest,
#       TemplatedNewTestArgs, TemplatedNewTestManyArgs, SetUpFailure,
#       RunFailure, TearDownFailure, RunFailureNoDot = 22
#       （RunOtherThreadFailure、DebugSignalBacktrace 已被上游注释排除）
#     TestHolderTest.cpp: Name, Stages, Assertions, ExceptionOnTearDown,
#       Args = 5
#     TestPtrTest.cpp: CreateDestroy, TwoRefs, MultipleRefs, Default,
#       SimpleAssign, ComplexAssign, Dereference = 7
#     TestTest.cpp: Assert, AssertEquals, AssertEqualsPtr,
#       AssertEqualsStringChar, AssertEqualsStringString,
#       AssertEqualsCharString, AssertEqualsCompareHelper,
#       AssertEqualsCompareHelperInt, ExtraSpace, Name（TestPtr 式注册）,
#       RadixDecimal, RadixHex, AssertException, AssertExceptionMessage,
#       AssertionInOtherClass = 15
#   63 + 6（Registry::run 为 6 个套件容器各计 1 pass，见 lib/Suite.cpp
#   invokeOne：passes_ += test->passes() + passed）= 69。
# 上游无 TESTS/ctest 注册、无条件编译分支（test/ 内无平台 #ifdef，唯一
# #ifdef HAVE_EXECINFO_H 只影响崩溃栈回溯打印，不影响计数），无跳过机制；
# 全量运行 discovered == executed == passes + failures。
# 全绿时汇总行应为 "Tests finished with 69 passes and 0 failures."，
# 结论待真机预检运行确认。
upstream_test_total: 69
upstream_test_count_method: auto

upstream_tests:
  - suite: existing（ExistingBase/ExistingObject 构造析构计数与泄漏自检）
    cases: 2
    delivered_config: compiled
    source: "test/ExistingBaseTest.cpp（Count, Destructor）"
  - suite: registry（Registry 参数裁剪/按名取用例/运行与输出）
    cases: 12
    delivered_config: compiled
    source: "test/RegistryTest.cpp（Zero, One, Two, Missing, ArgsFirst, PassFail, Stream, StatusBad, StatusGood, Debug, DebugArg, List）"
  - suite: suite（Suite 调度：断言/异常/信号/模板注册/失败上报）
    cases: 22
    delivered_config: compiled
    source: "test/SuiteTest.cpp（Order … RunFailureNoDot，见上清单）"
  - suite: testholder（用例包装：名/阶段/断言/析构异常/参数）
    cases: 5
    delivered_config: compiled
    source: "test/TestHolderTest.cpp（Name, Stages, Assertions, ExceptionOnTearDown, Args）"
  - suite: testptr（TestPtr 引用计数：创建/拷贝/赋值/解引用）
    cases: 7
    delivered_config: compiled
    source: "test/TestPtrTest.cpp（CreateDestroy … Dereference）"
  - suite: test（断言宏：ASSERT/ASSERT_EQUALS/ASSERT_EXCEPTION/进制/消息）
    cases: 15
    delivered_config: compiled
    source: "test/TestTest.cpp（Assert … AssertionInOtherClass，见上清单）"

# test_package 中自带的测试 (消费者视角验证；同一 conan create 内执行)
test_package_tests:
  - file: test_unittest.cpp
    description: "8 个消费者用例（断言宏/字符串相等/异常断言/生命周期/嵌套套件聚合/TestPtr 引用语义/radix 开关/ExistingBase 包装），经 UnitTest::Registry 运行"
    command: "./test_unittest"

# 测试断言总数 (test_package 自带消费者测试：22 处静态断言宏调用 +
# 嵌套套件内复执行 6 次 = 28 次运行时断言，近似值)
assertion_count: 28
