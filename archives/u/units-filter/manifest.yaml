software: units-filter
display: "units-filter"
description: "物理量表达式解析过滤器：将 1.5e3 nN.m.s^-1 这类表达式换算为国际单位制数值与量纲向量"
category: science
homepage: "https://salsa.debian.org/georgesk/units-filter"
license: "GPL-3.0-or-later"
build_system: make

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，仅构建 src/ 目录，跳过需 sphinx 的顶层文档与 gui/ 子目录"
    - "RECODE_SUPPORT/LIBS 走 make 命令行覆盖，保持非 Debian 分支（无 librecode 依赖），LIBS 追加 -lgmpxx 以链接 decimal.cc 的 gmpxx 符号"
    - "CC/CXX 取 Conan 构建环境（HMBS 注入的 clang），覆盖 Makefile 内硬编码的 gcc/g++"
    - "flex/bison 走 conan tool_requires，perl 解释器优先用 conan perl 包，保证 units-test.pl 在真机可运行"
    - "上游 77 例 perl 测试在 build() 内真实执行，计数取自 OK/ERREUR 日志行"
  common_dependencies:
    - "gmp/6.3.0.1"

versions:
  "4.2.1":
    status: built
    build_date: "2026-10-02"
    conan_ref: "units-filter/4.2.1"
