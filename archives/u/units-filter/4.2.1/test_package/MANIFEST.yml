# test_package/MANIFEST.yml — units-filter 4.2.1
# Upstream test declaration (CI L0e / rule4 machine evidence).

package: units-filter/4.2.1
homepage: "https://salsa.debian.org/georgesk/units-filter"

# ---- Upstream test audit ---------------------------------------------------
# The 4.2.1 orig tarball ships a real test suite: src/units-test (sh driver),
# src/units-test.pl (perl harness) and fixtures src/test.1..4. `make test`
# at top level and `make test` in src/ both run it.
upstream_tests_exist: true

# Official registered total with this recipe's configure flags (plain
# `make -j1` in src/, no options): 77 input/expected pairs.
# Method: single custom perl harness, counted by simulating units-test.pl
# pairing logic (non-empty lines form pairs; "options=..." lines set flags
# for the next pair instead of being a case).
upstream_test_total: 77
upstream_test_count_method: auto
upstream_test_in_build: true
upstream_test_command: "sh units-test (cat test.1 test.2 test.3 test.4 | perl units-test.pl)"
upstream_check_command: "make test"

upstream_tests:
  - file: src/test.1
    source: units-filter_4.2.1.orig.tar.xz / units-filter/src/test.1
    description: "Base conversions and SI prefixes (49 input/expected pairs)"
    command: "sh units-test"
  - file: src/test.2
    source: units-filter_4.2.1.orig.tar.xz / units-filter/src/test.2
    description: "Compound units, division and powers (11 pairs)"
    command: "sh units-test"
  - file: src/test.3
    source: units-filter_4.2.1.orig.tar.xz / units-filter/src/test.3
    description: "Output-format options (-o flag, 5 pairs)"
    command: "sh units-test"
  - file: src/test.4
    source: units-filter_4.2.1.orig.tar.xz / units-filter/src/test.4
    description: "Tolerance/uncertainty and LaTeX output options (12 pairs)"
    command: "sh units-test"

# ---- Consumer tests (test_package) -----------------------------------------
test_package_tests:
  - file: test_units_filter.sh
    description: "Feeds 6 real expressions (m, km, h, cm^3, g, torque-rate) plus 1 negative control (invalid expression must be rejected) through the packaged bin/units-filter; prints a RESULT trailer parsed into HMBS_TEST_PACKAGE_RESULT"
    command: "sh test_units_filter.sh <package>/bin/units-filter <workdir>"

assertion_count: 7
