software: units-filter
version: "4.2.1"
upstream_version: "4.2.1"
status: built
build_date: "2026-10-02"
build_system: make
conan_ref: "units-filter/4.2.1"

source:
  url: "https://mirrors.aliyun.com/debian/pool/main/u/units-filter/units-filter_4.2.1.orig.tar.xz"
  sha256: "d187b16e982086b44d2ff6d444e24dd5485c0472e8a6558ca45c175de1b96eaa"
  tar_format: tar.xz

build:
  system: make
  configure_options: []
  dependencies:
    - "gmp/6.3.0.1"
  build_dependencies:
    - "perl/5.42.2"
  cc: clang
  outputs:
    - "bin/units-filter"
    - "licenses/COPYING"

patches_applied:
  - "vendored/src/ (export_sources byte-copy, not a patch)"
  - "src/Makefile flex/bison recipes neutralized in-recipe (no conandata patch)"

knowledge_gained:
  - "Debian orig tarball of a salsa-hosted science tool works as conan source; upstream Vcs-Git is salsa.debian.org/georgesk/units-filter"
  - "src/Makefile decides librecode via grep of /etc/issue: overriding RECODE_SUPPORT/LIBS on the make command line keeps OHOS on the -lm -lgmp branch without patches"
  - "decimal.cc needs gmpxx (mpz_class) so LIBS must gain -lgmpxx; upstream LIBS only lists -lgmp"
  - "flex/bison outputs (uniteslex.cc 2.6.4, unitesparser.cc 3.8.2, FlexLexer.h) travel via export_sources byte-copy with recipe-less Makefile rules; no flex/bison/m4 tool edge remains because ohpcd hosts no m4 recipe and conancenter m4 configure re-exec fails on CONFIG_SHELL=/data/service/hnp/bin/bash"

conan:
  reference: "units-filter/4.2.1"
  package_type: application
  architecture_independent: false
  user_channel: "ohpcd/stable"

test_scope:
  upstream_functional_cases: 77
  upstream_framework: make
  upstream_command: "sh units-test (cat test.1 test.2 test.3 test.4 | perl units-test.pl)"
  test_package_cases: 7
  test_package_assertions: 7
  upstream_test_evidence: >-
    Upstream ships src/units-test + src/units-test.pl + fixtures src/test.1..4
    (49+11+5+12 = 77 input/expected pairs); both the top-level and src/
    Makefiles expose a `test` target running the harness.
