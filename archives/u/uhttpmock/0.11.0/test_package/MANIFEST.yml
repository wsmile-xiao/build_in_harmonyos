# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）

package: uhttpmock/0.11.0
homepage: "https://gitlab.freedesktop.org/pwithnall/uhttpmock"

# 上游存在测试（libuhttpmock/tests/，meson test 注册 2 个程序）。
upstream_tests_exist: true
# 分母：meson test 程序级注册数。取数命令（0.11.0 源码包内）：
#   grep -A5 'uhm_tests =' libuhttpmock/tests/meson.build  → server, resolver
upstream_test_total: 2
# 计数口径：单一 meson test 框架，从 tests/meson.build 的 uhm_tests 列表解析。
upstream_test_count_method: auto
upstream_test_count_detail: "libuhttpmock/tests/meson.build: uhm_tests = ['server', 'resolver'] => 2"
upstream_test_audit: "Audited uhttpmock-0.11.0.tar.bz2 (39 entries, single uhttpmock-0.11.0/ root): libuhttpmock/tests/ holds server.c + resolver.c + meson.build registering test('server')/test('resolver'); no other test framework (no ctest/gtest/autotools check target)."

# 上游测试命令（meson test，build() 中在 OHOS 设备原生执行）
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 中集成上游测试（OHOS 设备原生跑）
upstream_test_in_build: true
upstream_test_command: "meson test -v -C builddir --no-rebuild"

# 上游实际运行的测试程序
upstream_tests:
  - file: libuhttpmock/tests/server.c
    source: uhttpmock-0.11.0.tar.bz2/libuhttpmock/tests/server.c
    description: "UhmServer 录制/回放/在线/离线/TLS/日志全流程测试"
    command: "meson test server"
    cases: 1
  - file: libuhttpmock/tests/resolver.c
    source: uhttpmock-0.11.0.tar.bz2/libuhttpmock/tests/resolver.c
    description: "UhmResolver 构造/A 记录查询/不存在域名/重置测试"
    command: "meson test resolver"
    cases: 1

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_uhttpmock.c
    description: "uhttpmock 真实 API 冒烟：uhm_resolver_new/add_A/g_resolver_lookup_by_name（命中与未命中）/reset + uhm_server_new/get_port/get_trace_directory/get_address（8 项 CHECK-OK，无网络流量、无 trace 文件）"
    command: "./test_uhttpmock"

# 测试断言总数：resolver-new + resolver-add-A + resolver-lookup-ok +
# resolver-lookup-addr + resolver-lookup-miss + resolver-reset +
# server-new + server-defaults = 8 项 CHECK-OK
assertion_count: 8
