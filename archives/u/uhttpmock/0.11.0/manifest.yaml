# uhttpmock 0.11.0 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "0.11.0"

software: uhttpmock

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（有序镜像列表见 conandata.yml；此处登记首选近端镜像）
  url: "https://mirrors.tuna.tsinghua.edu.cn/ubuntu/pool/universe/u/uhttpmock/uhttpmock_0.11.0.orig.tar.bz2"

  # 源码校验和（三方佐证见 conandata.yml 头注：Gentoo Manifest + 上游 GitLab tag）
  sha256: "27b591b34ed953100eee4589968f3978c2155c099b25c27a6bf0cffc7b148eef"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dintrospection=false"
    - "-Dvapi=disabled"
    - "-Dgtk_doc=false"
    - "-Ddefault_library=shared"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib2/2.88.0
    - libsoup3/3.6.5-r1
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "uhttpmock 上游测试为 meson test 注册的 2 个程序（server/resolver），非 TAP 子用例口径"
  - "GObject 单副本教义（继承 gssdp/gupnp）：GLib 系 .pc Libs 剔除静态 glib token，libuhttpmock 对 g_* 保持 UND，运行时解析到 libsoup-3.0.so 的唯一 gobject 副本"
  - "共享库 strip 破坏 .codesign 哈希，tc.strip=None；meson install 清理 DT_RUNPATH 需用 build 产物覆盖"
