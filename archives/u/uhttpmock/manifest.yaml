# uhttpmock 包级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# 软件名
software: uhttpmock

display: "uhttpmock"

# 一句话描述
description: "HTTP web service mocking library (recording and playback of HTTP traces, libuhttpmock-1.0)"

category: network

homepage: "https://gitlab.freedesktop.org/pwithnall/uhttpmock"

license: LGPL-2.1-or-later

build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建；与 gssdp/libsoup3/gupnp 同一 GLib 栈，处理方案直接继承"
    - "introspection/vapi/gtk_doc 在配方中关闭（文档/绑定特性，不影响库本体）"
    - "GObject 单副本教义：GLib 系 .pc Libs 剔除静态 glib token，libuhttpmock 对 g_* 保持 UND，运行时解析到 libsoup-3.0.so 的唯一 gobject 副本"
    - "共享库 strip 破坏 .codesign 哈希，tc.strip=None；meson install 清理 DT_RUNPATH 需用 build 产物覆盖"
    - "上游测试为 meson test 注册的 2 个程序（server/resolver），OHOS 设备原生执行"
  common_dependencies:
    - "glib2"
    - "libsoup3"
    - "zlib(PIC 变体 1.3.1.1)"

versions:
  "0.11.0":
    status: built
    build_date: "2026-09-24"
