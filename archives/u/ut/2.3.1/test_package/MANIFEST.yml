# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ut/2.3.1
homepage: "https://github.com/boost-ext/ut"

# 上游测试命令（header-only，CMake 驱动；口径见 .audit-tmp/logs/ut-2.3.1-test-ledger.md）
upstream_check_command: "cmake -S . -B build-ctest -DBOOST_UT_BUILD_TESTS=ON -DBOOST_UT_ENABLE_RUN_AFTER_BUILD=NO && cmake --build build-ctest && ctest --test-dir build-ctest"

# conanfile.py build() 方法中是否已集成上游测试（header-only 无编译阶段）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（OHOS aarch64 实测通过，ctest 4/4）
upstream_tests:
  - file: test/ut/ut.cpp
    source: ut-2.3.1/test/ut/ut.cpp
    description: "ut 框架自测（33 个 test 声明，fake_cfg 事件捕获验证，exit 0）"
    command: "./ut_test"
  - file: test/ft/test_suite_1.cpp
    source: ut-2.3.1/test/ft/test_suite_1.cpp
    description: "功能测试 suite 1（8 用例）；与 suite2/3+main 合并为 ft 二进制（另含 ft-no-exceptions/ft-link 变体）"
    command: "./ft"
  - file: test/ft/test_suite_2.cpp
    source: ut-2.3.1/test/ft/test_suite_2.cpp
    description: "功能测试 suite 2（3 用例）；与 suite1/3+main 合并为 ft 二进制"
    command: "./ft"
  - file: test/ft/test_suite_3.cpp
    source: ut-2.3.1/test/ft/test_suite_3.cpp
    description: "功能测试 suite 3（suite 级 expect）；与 suite1/2+main 合并为 ft 二进制"
    command: "./ft"
  - file: test/ut/win_compat_test.cpp
    source: ut-2.3.1/test/ut/win_compat_test.cpp
    description: "WIN32 专属（互斥编译分支，OHOS 未实例化）"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：include <boost/ut.hpp> 并运行 2 断言"
    command: "./test_ut"

# 测试断言总数（上游台账：44 个源码声明用例/4 个可执行目标全过；test_package 2 断言）
assertion_count: 44