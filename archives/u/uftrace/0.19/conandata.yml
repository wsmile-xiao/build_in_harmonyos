# conandata.yml — uftrace 0.19
# Single source of truth for source URL + SHA256 + patches.

sources:
  url: "https://github.com/namhyung/uftrace/archive/refs/tags/v0.19.tar.gz"
  sha256: "c35ef25f279684fc7d79dcc250fb29386890870fd2c9f812e587151419ca01af"

patches:
  - patch_file: "patches/0001-configure-recognize-harmonyos.patch"
    patch_description: "Recognize HarmonyOS as Linux-compatible in the hand-written configure script (uname -s returns HarmonyOS on OHOS, not Linux)"
    patch_type: "portability"
  - patch_file: "patches/0002-makefile-script-shebang.patch"
    patch_description: "HMDFS has no exec permission (E087) — invoke misc/version.sh and misc/gen-autoargs.py via sh/python3 prefix instead of relying on the shebang exec bit"
    patch_type: "portability"
  - patch_file: "patches/0003-symbol-rawelf-strlen.patch"
    patch_description: "Fix upstream typo in the rawelf fallback: elf_for_each_comment calls strcmp with one arg (should be strlen); only exposed when libelf is disabled"
    patch_type: "bugfix"
  - patch_file: "patches/0004-symbol-check-trace-notype.patch"
    patch_description: "check_trace_functions only accepts STT_FUNC for profiling symbols, but on OHOS the -finstrument-functions symbols (__cyg_profile_func_enter/exit) are undefined STT_NOTYPE, so static instrumentation is misdetected as 'no mcount' — allow STT_NOTYPE unconditionally (same as the Android path)"
    patch_type: "portability"
  - patch_file: "patches/0005-unittest-symbol-rebuild.patch"
    patch_description: "make the upstream unit-test suite run on a signed non-PIE OHOS binary: (1) add an i>=num bounds check because the symbol table has more func_* symbols than test slots; (2) always rebuild the test-case table from the symbol table because binary-sign-tool re-layouts sections and invalidates the stored name/func pointers; (3) force load_base=0 since a non-PIE binary's st_value is already absolute and OHOS dl_iterate_phdr reports a bogus heap dlpi_addr"
    patch_type: "portability"
  - patch_file: "patches/0009-agent-socket-tmpdir.patch"
    patch_description: "OHOS forbids Unix-domain socket bind() (EPERM), so the mcount agent can never start there; make the mcount_agent unit test return TEST_SKIP instead of spinning forever when the agent cannot start"
    patch_type: "portability"
