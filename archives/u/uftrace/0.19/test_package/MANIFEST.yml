# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: uftrace/0.19
homepage: "https://github.com/namhyung/uftrace"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# uftrace 上游测试 (tests/runtest.sh) 需要真实函数追踪环境（perf_event/ptrace
# 及插桩后的目标程序），且编译产物是 OHOS aarch64 交叉二进制，无法在构建机
# 直接执行。本版 build() 不集成上游测试。
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游测试套件（tests/runtest.sh 运行，依赖真实追踪能力）
upstream_tests:
  - file: tests/runtest.sh
    source: uftrace-0.19/tests/runtest.sh
    description: "uftrace 自追踪与追踪功能的端到端测试脚本"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
# OHOS 交叉编译产物无法在 Conan subprocess 中执行（E298），故采用静态验证：
# conanfile.py 纯 Python 校验 uftrace 为 AArch64 ELF，test.sh 校验 5 个
# libmcount 插桩库齐全。
test_package_tests:
  - file: test.sh
    description: "静态验证 uftrace 二进制存在 + 5 个 libmcount 插桩库齐全"
    command: "sh test.sh <uftrace-bin> <lib/uftrace-dir>"

# 测试断言总数（conanfile.py 2 项 ELF/架构 + test.sh 6 项存在性检查）
assertion_count: 8
