software: uftrace
display: "uftrace"
description: "Function (graph) tracer for userspace C/C++/Rust programs"
category: tool
homepage: "https://github.com/namhyung/uftrace"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 configure 的 uname -s 检查不识别 HarmonyOS → 补丁放宽为 Linux|HarmonyOS"
    - "全部可选依赖（libelf/libdw/libpython/libstdc++/ncurses/capstone 等）禁用，走内置 rawelf 兜底"
    - "make install 依赖 pandoc 构建 man 页 → package() 手动复制 uftrace + libmcount*.so"
    - "OHOS lld 需前置 SDK llvm/lib 到 LD_LIBRARY_PATH（libxml2.so.16 动态依赖）"
    - "产物 ELF 代码签名（鸿蒙 XPM 要求，同 elfutils/capstone）"
  common_dependencies: []
  status: built

versions:
  "0.19":
    status: built
    build_date: "2026-09-17"
