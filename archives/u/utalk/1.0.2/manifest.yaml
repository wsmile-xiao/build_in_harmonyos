software: utalk
version: "1.0.2"
status: built
build_system: makefile
build_date: "2026-09-30"
created_at: "2026-09-30"

# 源码信息
source:
  url: "https://deb.debian.org/debian/pool/main/u/utalk/utalk_1.0.2.orig.tar.gz"
  sha256: "6158312b2fcf51f80cec43f4c1ff2eb30ccf0550a5a199f1994fb05a71e8aa5c"
  tar_format: tar.gz

# 构建配置
build:
  system: makefile
  configure_options:
    - "make -j1 CC=<profile cc> LIBS='-L<ncurses>/lib -lncursesw' LDFLAGS='-Wl,--allow-multiple-definition' utalk"
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: clang++

build_command: "make -j1 CC=<cc> LIBS='-L<ncurses>/lib -lncursesw' LDFLAGS='-Wl,--allow-multiple-definition' utalk"
install_command: "staged copy: utalk->bin/, utalk.1->share/man/man1/, ncurses terminfo->share/terminfo/"

# 测试信息
test_command: "test_package/test.sh (T1-T6)"
test_result: "8 项断言全部通过（含 4 项 OHOS 特有）"
test_status: "passed"

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "静态系统同名库(ncurses)与目标程序同名符号(beep)冲突：-Wl,--allow-multiple-definition 使目标文件定义优先  [knowledge_ref: DRAFT-14410-static-ncurses-beep-duplicate-symbol]"
  - "make 项目用命令行变量覆盖 CFLAGS 时会丢弃 Makefile 的 OPTS/宏定义（-DLIBDIR），导致编译失败  [knowledge_ref: DRAFT-14411-make-cmdline-cflags-drops-opts]"

# 产物
artifacts:
  binaries:
    - bin/utalk
  libraries: []
