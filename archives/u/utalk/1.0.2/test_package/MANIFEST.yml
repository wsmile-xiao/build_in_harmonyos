package: utalk/1.0.2
homepage: "https://utalk.ourproject.org/"

# R51 upstream test inventory (evidence): the official 1.0.2 source archive
# (utalk_1.0.2.orig.tar.gz, sha256 6158312b…a5c) contains NO test sources.  The
# Makefile declares a `test:` target but it depends on `stest.c`, which upstream
# never shipped; `make test` therefore fails with
#   "make: *** No rule to make target 'stest.o', needed by 'test'.  Stop."
# (exit 2).  The full file listing (36 files) confirms no stest.c / tests/ dir.
upstream_tests_exist: false
upstream_test_audit: "tar tzf utalk_1.0.2.orig.tar.gz -> 36 files, no stest.c, no tests/ directory. Makefile:58 declares `test: stest.o srdp.o` and links stest from stest.o; stest.c is absent, so the target is unrunnable. Upstream ships no automated test suite; only the interactive client itself."
upstream_check_command: "make test"
upstream_test_runnable: false

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: |
      Consumer execution of the INSTALLED utalk tool:
      T2 `--help` prints usage; T3 no-arg prints usage; T4 refuses non-tty
      execution ("I can only run on a tty"); T5 [OHOS] ELF is AArch64 with
      static ncurses (R26) and libc.so; T6 [OHOS] ncurses screen initialises on
      a pty (banner "utalk version 1.0.2" + "waiting for connection" => the
      bundled terminfo database works).
    command: "bash test.sh <utalk-bin>"

assertion_count: 9
ohos_specific_assertions: 5   # T5a, T5b, T5c, T7（+ T6，pty 不可用时 skip）
