software: utalk
display: "utalk"
description: "UDP-based (SRDP) full-screen one-to-one talk client, alternative to the Unix talk program"
category: network
homepage: "https://utalk.ourproject.org/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "ncurses 作为系统同名库静态链接（R26）：libncursesw.a，避免运行期劫持 /lib/libncursesw.so"
    - "静态 ncurses 暴露的 beep 符号与 utalk termcap.c:beep() 冲突 → LDFLAGS 加 -Wl,--allow-multiple-definition（目标文件定义优先）"
    - "不覆盖 Makefile 的 CFLAGS，保留其 OPTS/OPT5（-DLIBDIR），否则 menu.c 的 HELPFILE 宏未定义"
    - "上游 make install 会 strip + chown root:root，package() 改为普通分阶段拷贝（可移植、无需 root）"
    - "ncurses 全屏需要 terminfo 数据库，OHOS 系统 terminfo 极少 → 打包内置 ncurses terminfo 并通过 TERMINFO 运行环境变量导出"
  common_dependencies:
    - ncurses

versions:
  "1.0.2":
    status: built
    build_date: "2026-09-30"
    conan_ref: "utalk/1.0.2"
