# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: util-macros/1.20.1
homepage: "https://gitlab.freedesktop.org/xorg/util/util-macros"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: xorg-macros.m4
    source: util-macros-1.20.1/xorg-macros.m4
    description: "验证 xorg-macros.m4 包含 XORG 宏定义"
    command: "grep XORG_MACROS_VERSION xorg-macros.m4"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 xorg-macros.m4 存在于 share/aclocal/ 且包含 XORG 宏"
    command: "python3 test_package/conanfile.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
