package: univalue
version: "1.1.1"
homepage: "https://github.com/jgarzik/univalue"
license: MIT
status: built
build_system: autotools
build_date: "2026-09-03"

source:
  url: "https://github.com/jgarzik/univalue/archive/refs/tags/v1.1.1.tar.gz"
  sha256: "72760ce6cdaa7b3cc1d47c54ca3e3f494d213084796b4c7694c4aba85a447db2"

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  command: "make check"
  test_count: 3
  notes: "TESTS = test/object test/unitester test/no_nul，全部 PASS；test/test_json 为 noinst_PROGRAMS（JSONTestSuite stdin 适配器），带合法输入手测退出 0。unitester 内部遍历 pass*.json(4)+round*.json(7)+fail*.json(44，无 fail43)。"

test_package:
  assertion_count: 18
  description: "消费者测试 test.cpp（JSON 解析/类型检查/序列化回读往返）+ 鸿蒙专项测试 ohos_special_test.cpp（强制 __OHOS__ 编译目标、嵌套解析、转义 NUL、类型安全 getter 抛异常），ctest 2/2 通过"

knowledge_gained:
  - "ref: E007/E072. config.guess/config.sub 不识别 HarmonyOS，conanfile.py build() 内联等价 patch-autotools-ohos.pl 五处修改（运行时代码，非 patches/，因对象为生成文件）"
  - "ref: E114. HMDFS setgid 下 configure 内 umask 077 临时目录不可写，build() 运行时 _drop_umask_077() 处理生成 configure"
  - "ref: E074. 鸿蒙 SELinux 禁止 jobserver FIFO，全部 make 使用 -j1"
  - "ref: E259. 上游 test/object.cpp 的 BOOST_CHECK(assert) 在 Release -DNDEBUG 下被编译掉导致未捕获异常，generate() 追加 -UNDEBUG 撤销（CXXFLAGS 位于 CPPFLAGS 之后）"


