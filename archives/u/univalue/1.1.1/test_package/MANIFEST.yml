# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: univalue/1.1.1
homepage: "https://github.com/jgarzik/univalue"

# 上游测试命令 (make check)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序 (make check TESTS = 3 个)
upstream_tests:
  - file: test/object.cpp
    source: univalue-1.1.1/test/object.cpp
    description: "对象写入/序列化冒烟测试 (object 程序)"
    command: "./test/object"
  - file: test/unitester.cpp
    source: univalue-1.1.1/test/unitester.cpp
    description: "JSON 解析器统一测试器：遍历 test/pass*.json(4) + round*.json(7) + fail*.json(44, 无 fail43)，断言通过/失败两类预期 (unitester 程序)"
    command: "./test/unitester"
  - file: test/no_nul.cpp
    source: univalue-1.1.1/test/no_nul.cpp
    description: "字符串中 NUL 字节处理测试 (no_nul 程序)"
    command: "./test/no_nul"
  - file: test/test_json.cpp
    source: univalue-1.1.1/test/test_json.cpp
    description: "JSONTestSuite 适配器：从 stdin 读 JSON，可解析则退出 0（noinst_PROGRAMS，未加入 TESTS；stdin 空输入退出 1 属预期行为，带合法 JSON 输入实测退出 0）"
    command: "./test/test_json < input.json"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：读入 JSON 对象/标量、类型检查、序列化回读往返，调用 libunivalue 真实 API"
    command: "./test_univalue"
  - file: ohos_special_test.cpp
    description: "HarmonyOS 专项测试：强制 __OHOS__ 编译目标 + univalue 嵌套 JSON 解析/转义 NUL/序列化往返/类型安全 getter 抛异常验证"
    command: "./ohos_special_test"

# 测试断言总数 (近似值)
assertion_count: 18
