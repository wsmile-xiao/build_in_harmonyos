# 上游官方 CMake/CTest 场景与消费者分别计数，不用消费者替代上游。

package: utest/0.0-git20260928-df92c758
homepage: "https://github.com/sheredom/utest.h"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -S test -B build && cmake --build build && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python upstream_test.py <source> <fresh-build> --compiler <cc> --cxx <cxx> --native-ohos"

# 上游实际运行的测试程序
upstream_tests:
  - file: upstream_test.py
    command: "ctest --test-dir <fresh-build>/cmake --output-on-failure --output-junit <results.xml>"
    description: "原上游完整注册场景，目标 r007 为13/13；内部2178用例含10个预期Todo skip控制，不重复累计"

# test_package 中自带的测试 (消费者视角验证, 编译+运行)
test_package_tests:
  - file: test_utest.py
    description: "安装头消费者2用例、4断言；OHOS 默认另运行计时器专项1用例，分母独立"
    command: "python test_utest.py <pkg> --work-root <task-build>"
  - file: harmony_tests/timer_backend.c
    description: "仅 HarmonyOS/aarch64：真实 libc 计时器与 utest_ns/utest_mul_div，1独立用例"
    command: "python test_utest.py <pkg> --work-root <task-build> --only harmony"

# 只统计两个消费者中的四个断言；不混入上游或鸿蒙专项分母。
consumer_test_count: 2
harmony_test_count: 1
assertion_count: 4
