# uriparser 1.0.2 版本级 manifest
version: "1.0.2"
software: uriparser

# 本地验证通过（conan-verify 全门禁 PASS），但本任务无远端授权（analysis_approved_remote_ci=false），
# 未执行 CI 上传发布，故状态为 built（非 published）。
status: built
build_date: "2026-08-28"
build_system: cmake

source:
  url: "https://github.com/uriparser/uriparser/releases/download/uriparser-1.0.2/uriparser-1.0.2.tar.bz2"
  sha256: "dd2e4843f43de6f5aedf430e530f1e2d159eba8ca4d64c2787af1c20f707a9e4"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "-DURIPARSER_BUILD_DOCS=OFF"
    - "-DURIPARSER_BUILD_TESTS=OFF"
    - "-DURIPARSER_BUILD_FUZZERS=OFF"
    - "-DURIPARSER_BUILD_TOOLS=ON"
    - "-DURIPARSER_BUILD_CHAR=ON"
    - "-DURIPARSER_BUILD_WCHAR_T=ON"
    - "-DURIPARSER_ENABLE_INSTALL=ON"
    - "-DBUILD_SHARED_LIBS=OFF(shared option)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "uriparser 1.0.2 的 configure 是 bash 专用 cmake wrapper（[[ =~ ]]、type -P 等），OHOS /bin/sh 无法执行；直接走 CMake 构建即可（历史 liburiparser 笔记同结论） [ref: notes.md#遇到的问题与解决方案]"
  - "uriToStringA(NULL, ...) 公开 API 恒返回 URI_ERROR_NULL（内部 charsRequired 传 NULL），取长度需用固定缓冲 + maxChars 重组 [ref: notes.md#遇到的问题与解决方案]"
  - "上游 GTest 测试套件构建强制 C++11，但 ohpcd registry 的 gtest/1.17.0 要求 C++17，测试执行阶段需提升到 C++17 [ref: notes.md#遇到的问题与解决方案]"

quality_gates:
  conan_verify: PASS
  G0_pre_build_risk: PASS
  G1_recipe_integrity: PASS
  G2_conan_create: PASS
  G3_system_same_name_isolation: PASS
  G4_artifact_integrity: PASS
  L2_smoke: PASS
  L4_sec_scan: PASS
  L5_baseline: PASS
  upstream_test_runner: "412/412 PASS (35 suites, GTest)"
  consumer_test_package: PASS
  finish_w3: "NOT DISPATCHED: 外部执行通道 ohpc_compile_worker(127.0.0.1:18082) 不可达"