# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: uriparser/1.0.2
homepage: "https://uriparser.github.io/"

# 上游测试命令 (ctest -N 实测)
upstream_check_command: "cmake --build <build> --target testrunner && ctest --test-dir <build>"

# conanfile.py build() 方法中是否已集成上游测试
# 否：URIPARSER_BUILD_TESTS=OFF（须 GTest>=1.8.0；ohpcd 仅 gtest/1.17.0 且要求 C++17，
# 而上游强制测试 C++11）；上游测试套件在独立步骤以 GTest 1.17.0 执行。
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build/uriparser-tests"

# 上游实际运行的测试程序（GTest testrunner，35 套件 412 用例全过）
upstream_tests:
  - file: test/test.cpp
    source: uriparser-1.0.2/test/test.cpp
    description: "GTest testrunner 主入口（35 suites / 412 tests，含 VersionSuite、SetHost*、SetScheme、FourSuite、MemoryManagerSuite、copy、CompareRangeLengthWrap 等）"
    command: "./testrunner"

# test_package 中自带的测试 (消费者视角验证, 调用 uriParseUriA/uriToStringA 真实 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：解析 http URI + 重组字符串并断言 host 与输出（R34 实质依赖）"
    command: "./test_uriparser"

# 测试断言总数 (testrunner GTest 实测 412 用例全 PASS; assert 数由 GTest 框架统计)
assertion_count: 412