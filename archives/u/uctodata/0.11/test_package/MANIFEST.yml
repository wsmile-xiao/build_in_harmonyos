# uctodata 0.11 — upstream test status
# uctodata is a pure datafile package (tokconfig-*, *.abr, *.rule, *.quote,
# *.eos, ligatures.filter). There is no source code in the tarball, therefore
# no upstream unit/integration test suite and no `check`/`test` target:
#   - Makefile.am       : SUBDIRS = config; pkgconfig_DATA = uctodata.pc
#   - config/Makefile.am: config_DATA = <data files>  (install-data only)
# Upstream's own documentation states "uctodata is architecture independent".
upstream_tests:
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  type: "none"
# All verification is implemented in test_package/test_data.py:
#   - pkg-config contract (prefix == package_folder), the exact query ucto runs
#   - every data group installed and non-empty
#   - tokconfig content sanity
new_tests:
  file: "test_package/test_data.py"
  # 14 个 check() 调用点，其中 1 个位于 7 项 %include 断言的循环内
  # => 脚本实际执行 20 条断言（构建环境无 pkg-config 时走 [skip] 分支，为 19 条）
  # 以脚本末尾打印的 "[test] <passed>/<total> assertions passed" 为准。
  assertions: 20

# 完整消费者用例（平台 rule12：鸿蒙特有测试不能只有断言，必须有真正跑通
# 功能/流程的端到端用例）。consumer_ucto.py 走 ucto 的真实启动路径：
# pkg-config --variable=prefix uctodata（无工具时直接读 uctodata.pc）→
# <prefix>/share/ucto/tokconfig-nld → 按 %include 约定加载数据文件
# （ABBREVIATIONS→.abr / RULES→.rule / QUOTES→.quote / EOSMARKERS→.eos /
#   FILTER→.filter）并逐条解析。实测：14 分节 / 8 个 %include → 8 文件 / 512 条目。
consumer_case:
  file: "test_package/consumer_ucto.py"
  kind: "end-to-end consumer (pkg-config contract -> tokconfig -> %include data files)"
  resolved_includes: 8
  resolved_entries: 512
