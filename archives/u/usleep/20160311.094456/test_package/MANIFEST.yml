# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: usleep/20160311.094456
homepage: "https://github.com/cpeuvrel/usleep-aur"

# 上游测试命令（清点证据：上游 Makefile 只有 usleep / install / clean 三个目标，
# `make -n check` 与 `make -n test` 均报 "No rule to make target"；
# 源码树共 6 个文件（usleep.c Makefile PKGBUILD .SRCINFO LICENSE .gitignore），
# 无 tests/ 目录、无 ctest/pytest 注册，上游测试用例数为 0）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无：上游不含任何测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，适配后补全）
test_package_tests:
  - file: test_usleep.py
    description: "A1-A3 产物检查（ELF64 AArch64 / PIE / PT_INTERP=/lib/ld-musl-aarch64.so.1，所有主机）+ F1-F6 功能检查（无参数、0、300000、1200000、非数字 abc、多余参数：退出码 0、无输出、实测睡眠时长下界，每次运行 30 s 超时保护；aarch64 CI worker 上必跑，异架构主机仅在加载器/格式标记下记 SKIPPED）"
    command: "python3 test_usleep.py <package_folder>/bin/usleep"

# 测试断言总数（按独立检查项计数：A1-A3 共 3 项 + F1-F6 共 6 项）
assertion_count: 9
