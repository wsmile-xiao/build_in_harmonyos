software: usleep
display: "usleep"
description: "微秒级睡眠命令：usleep <微秒数> 调用 usleep(3) 睡眠指定微秒后以 0 退出（Arch AUR 包 usleep 的上游源码）"
homepage: "https://github.com/cpeuvrel/usleep-aur"
license: "MIT"
category: utility
language: c
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C（stdlib + unistd），musl 默认特性集即声明 usleep()，零 patch 适配"
    - "上游 Makefile 写死 CC = gcc：make 命令行以 Conan conf 的编译器覆盖（R33），保留上游 CFLAGS"
    - "上游无 release/tag：版本 20160311.094456 = 提交 4f880a7a 的 committer 时间戳，官方 archive/<sha>.tar.gz 固定源码"
    - "单二进制命令行工具安装到 bin/，commands.json 声明（R38）"

versions:
  "20160311.094456":
    status: built
    build_date: "2026-09-23"
    conan_ref: "usleep/20160311.094456"
