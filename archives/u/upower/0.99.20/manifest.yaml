software: upower
version: 0.99.20
status: built
build_date: 2026-05-28
build_system: meson
test_date: 2026-05-28

configure_options:
  - --prefix=$HOME/usr/local
  - --libdir=lib
  - --buildtype=release
  - -Dgtk-doc=false
  - -Dman=false
  - -Dintrospection=disabled
  - -Didevice=disabled
  - -Dsystemdsystemunitdir=no
  - -Dos_backend=linux

dependencies:
  required:
    - glib-2.0 >= 2.58
    - gobject-2.0 >= 2.58
    - gio-2.0 >= 2.58
    - gio-unix-2.0 >= 2.58
    - gudev-1.0 >= 235
    - udev >= 251
  bundled:
    - libpcre2-8.so.0
    - libffi.so.8

products:
  executables:
    - path: bin/upower
      size: 27KB
      test: PASS (命令行参数正常)
    - path: libexec/upowerd
      size: 383KB
      test: PARTIAL (需 D-Bus 支持)
  libraries:
    - path: lib/libupower-glib.so.3.1.0
      size: 11.3MB
      api_symbols: 45+
      test: PASS (符号导出完整)
  headers:
    - include/libupower-glib/upower.h
    - include/libupower-glib/up-client.h
    - include/libupower-glib/up-device.h
    - include/libupower-glib/up-types.h
    - include/libupower-glib/up-version.h
    - include/libupower-glib/up-autocleanups.h
    - include/libupower-glib/up-history-item.h
    - include/libupower-glib/up-stats-item.h
  package:
    - upower-0.99.20-ohos-aarch64.tar.gz (11MB)
    - upower-0.99.20-ohos-aarch64-debug.tar.gz (171MB)

test_results:
  cli_tool: PASS
