software: ucpp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.com/scarabeusiv/ucpp/-/archive/master/ucpp-master.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

# 构建系统类型（用于质量门禁）
build_system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - name: "0001-src-cpp.c.patch"
    type: "platform_compatibility"
    guard: "#ifdef __OHOS__"
    description: "修复 void 函数声明缺少原型警告"
  - name: "0002-src-macro.c.patch"
    type: "platform_compatibility"
    guard: "#ifdef __OHOS__"
    description: "抑制未使用变量警告"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "需要运行 autogen.sh 生成 configure（原始 tarball 无 configure）"
  - "AUTOM4TE 环境变量设置解决 aclocal 失败"
  - "clang -Werror 导致严格原型检查失败，需要修复源码"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/ucpp-1.3.5.orig
  source_work_dir: /storage/Users/currentUser/builds/ucpp-1.3.5.work
  source_orig_hash: e7d9cbc65e0d1099
  source_work_hash: 17649ef6a1ed7a0d
  generated_at: '2026-06-15T11:26:08'
  patches_count: 2

patch_classification:
  - file: 0001-src-cpp.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-src-macro.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
