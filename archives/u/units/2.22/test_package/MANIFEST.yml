# test_package/MANIFEST.yml — units 2.22
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: units/2.22
homepage: "https://www.gnu.org/software/units/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试
# 上游 check 目标共两项：currency-update-check（联网拉取汇率数据的环境探测，
# 带 `-` 容错前缀、非功能断言）与 1 项真实功能校验（下条）。
upstream_tests:
  - file: Makefile.in
    source: "units-2.22/Makefile.in (check target)"
    description: "上游功能校验：units 计算 '(((square(kiloinch)+2.84m2) /0.5) meters^2)^(1|4)' m 应得 6"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/test.sh
    description: "运行安装后的 units 二进制：--version 冒烟、meter->foot 换算断言、上游 check 表达式断言（1 个消费者程序，3 处断言）"
    command: "conan test test_package units/2.22"

# Approximate assertion count
assertion_count: 3
