# 软件级 manifest 模板
# 文件位置: archives/u/unixodbc/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: unixodbc

# 显示名
display: "unixODBC"

# 一句话描述
description: "开源ODBC驱动管理器和测试工具集"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: db

# 官网 URL
homepage: "https://www.unixodbc.org/"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "HMDFS文件系统 configure/config.status 临时文件创建限制"
    - "libltdl子模块需手动生成Makefile和config.h"
    - "lt__argz.c需正确的LTDL和LT_CONFIG_H宏定义"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.3.12":
    status: built
    build_date: 2026-05-27