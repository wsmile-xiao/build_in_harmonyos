# Version-level manifest for unixodbc 2.3.12
software: unixodbc
version: "2.3.12"
status: built
build_date: "2026-05-29"

# Source information
source:
  url: "https://github.com/lurcher/unixODBC/releases/download/2.3.12/unixODBC-2.3.12.tar.gz"
  sha256: "f210501445ce21bf607ba51ef8c125e10e22dffdffec377646462df5f01915ec"
  tar_format: tar.gz

# Build configuration
build:
  system: autotools
  # Release tarball includes configure; recipe applies a unified-diff E011 patch.
  pre_build_cmd: "apply_conandata_patches; configure; make -j1; make check"
  configure_options:
    - "--sysconfdir=/etc"
    - "--disable-gui"
    - "--disable-drivers"
    - "--disable-driver-config"
    - "--disable-readline"
    - "--disable-editline"
    - "--disable-stats"
    - "--disable-iconv"
    - "--enable-threads"
  dependencies: []
  package_scope: library_only
  cc: clang
  cxx: clang++

# Hints applied
hints_applied:
  - "pre-build.sh (release tarball + unified OHOS umask patch)"
  - "g0-verify.sh (manual clean-build smoke aligned with Conan configure options)"

# G0 verification override
g0_verify_cmd: "sh hints/g0-verify.sh"
g0_verified_manually: true

# Patches applied by the current Conan recipe
patches_applied:
  - "0007-ohos-umask-tmpdir.patch"

# Historical patches retained from the earlier GitHub API tarball/autoreconf path.
# They are not applied by the current release-tarball Conan recipe.
patches_retained:
  - "0001-m4-ltargz.m4.patch"
  - "0002-m4-ltdl.m4.patch"
  - "0003-m4-ltoptions.m4.patch"
  - "0004-m4-ltsugar.m4.patch"
  - "0005-m4-ltversion.m4.patch"
  - "0006-m4-lt~obsolete.m4.patch"

# Knowledge gained
knowledge_gained:
  - "E011: HMDFS umask 077 → 022 fix required"
  - "Current recipe uses the GitHub release tarball because it already includes configure"
  - "libltdl/configure also needs umask fix"
  - "lt__argz.c compilation works with correct LTDL macros"
  - "Earlier GitHub API tarball experiments required autoreconf -fi and m4 refresh patches"

# Known issues
known_issues:
  - "Issue number is TBD; no explicit unixodbc issue was found in the delegated context or local target/downstream files."
  - "E011 workaround must be applied before configure; conandata now applies a unified patch instead of sed."
  - "True-device/shadow CI not run in this local front-loaded pass; single-package queue required."

# Installation products
products:
  libraries:
    - "libodbc.so.2.0.0 (1.7MB)"
    - "libodbcinst.so.2.0.0 (444KB)"
    - "libodbccr.so.2.0.0 (465KB)"
  binaries: []
  headers:
    - "sql.h, sqlext.h, sqltypes.h, odbcinst.h"
    - "unixodbc.h, unixodbc_conf.h"

# Verification
verification:
  user_verify_passed: true
  staging_verify_passed: true
  g0_clean_build_passed: false  # local front-loaded recipe checks only; OHOS CI pending

# Quality gates
quality_gates:
  G1_binary_integrity: pending
  G2_functional_availability: pending
  G3_portability: pending
  G4_archive_integrity: pending
