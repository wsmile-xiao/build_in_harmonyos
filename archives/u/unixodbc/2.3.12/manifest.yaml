# Version-level manifest for unixodbc 2.3.12
software: unixodbc
version: "2.3.12"
status: built
build_date: "2026-05-29"

# Source information
source:
  url: "https://api.github.com/repos/lurcher/unixODBC/tarball/2.3.12"
  sha256: ""
  tar_format: tar.gz

# Build configuration
build:
  system: autotools
  # GitHub tarball 没有 configure，需要 autoreconf + E011 fix
  pre_build_cmd: "autoreconf -fi && sed -i 's/umask 077/umask 022/g' configure && sed -i 's/umask 077/umask 022/g' libltdl/configure"
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++

# Hints applied
hints_applied:
  - "pre-build.sh (E011: autoreconf + umask 077→022)"
  - "g0-verify.sh (G0 clean-build-verify with autoreconf support)"

# G0 verification override
g0_verify_cmd: "sh hints/g0-verify.sh"
g0_verified_manually: true

# Patches applied (autoreconf generated m4 updates)
patches_applied:
  - "0001-m4-ltargz.m4.patch"
  - "0002-m4-ltdl.m4.patch"
  - "0003-m4-ltoptions.m4.patch"
  - "0004-m4-ltsugar.m4.patch"
  - "0005-m4-ltversion.m4.patch"
  - "0006-m4-lt~obsolete.m4.patch"

# Knowledge gained
knowledge_gained:
  - "E011: HMDFS umask 077 → 022 fix required"
  - "GitHub API tarball requires autoreconf -fi"
  - "libltdl/configure also needs umask fix"
  - "lt__argz.c compilation works with correct LTDL macros"
  - "G0 verification requires hints support for GitHub tarballs"

# Known issues
known_issues:
  - "E011 workaround must be applied before configure"
  - "G0 clean-build-verify requires pre-build.sh in G0 environment"

# Installation products
products:
  libraries:
    - "libodbc.so.2.0.0 (1.7MB)"
    - "libodbcinst.so.2.0.0 (444KB)"
    - "libodbccr.so.2.0.0 (465KB)"
  binaries:
    - "isql (76KB)"
    - "iusql (60KB)"
    - "odbcinst (43KB)"
    - "odbc_config (27KB)"
    - "dltest (117KB)"
    - "slencheck (27KB)"
  headers:
    - "sql.h, sqlext.h, sqltypes.h, odbcinst.h"
    - "unixodbc.h, unixodbc_conf.h"

# Verification
verification:
  user_verify_passed: true
  staging_verify_passed: true
  g0_clean_build_passed: false  # requires pre-build.sh in G0

# Quality gates
quality_gates:
  G1_binary_integrity: pending
  G2_functional_availability: pending
  G3_portability: pending
  G4_archive_integrity: pending