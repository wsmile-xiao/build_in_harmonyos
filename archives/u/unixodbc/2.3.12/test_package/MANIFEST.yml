package: unixodbc/2.3.12
homepage: "https://www.unixodbc.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check plus build-tree command smoke tests"

# The 2.3.12 release ships Automake check targets but no TESTS or
# check_PROGRAMS declarations. The recipe still runs make check, then executes
# odbc_config/isql/odbcinst smoke commands from the build tree.
upstream_tests: []

test_package_tests:
  - file: test_unixodbc.c
    description: "Consumer test for ODBC environment/connection handle lifecycle and odbcinst configuration APIs"
    command: "./test_unixodbc"

assertion_count: 15
