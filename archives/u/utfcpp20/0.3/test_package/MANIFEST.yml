# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: utfcpp20/0.3
homepage: "https://github.com/nemtrif/utfcpp20"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# 上游测试套件未集成进配方 build()：上游 tests/ 经 FetchContent 拉取
# nemtrif/ftest tag 0.3，该测试框架未发布到制品仓（conan download ftest/0.3
# 与 ftest/* 通配均无记录），Conan/CI 构建环境无网络回源。套件在真机验证
# 中以 FETCHCONTENT_SOURCE_DIR_FTEST 指向官方 ftest 源码单独运行
# （见 notes.md 与 reports/test-report.md）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/CMakeLists.txt 注册的 2 个 ctest)
upstream_tests:
  - file: tests/utfcpp20.test.cpp
    source: utfcpp20-0.3/tests/utfcpp20.test.cpp
    description: "公共 API 测试 (11 TEST 注册)"
    command: "ctest -R utfcpp20test"
  - file: tests/core.test.cpp
    source: utfcpp20-0.3/tests/core.test.cpp
    description: "内部 core 解码/编码测试，含 src/core.hpp (5 TEST 注册)"
    command: "ctest -R coretest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_utfcpp20.cpp
    description: "消费者测试: append_to_utf8/append_to_utf16、utf8_to_16/utf16_to_8 往返、无效输入异常拒绝、u8_iterator 解码往返 (9 项断言)"
    command: "./test_utfcpp20"

# 测试断言总数 (实测, rule 4)
# 上游 2 个测试可执行文件内 TEST 注册用例: 11 + 5 = 16
assertion_count: 16
