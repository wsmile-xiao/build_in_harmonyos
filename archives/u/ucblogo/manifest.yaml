software: ucblogo
display: "UCBLogo"
description: "Berkeley Logo 解释器"
category: utility
homepage: "https://github.com/jrincayc/ucblogo-code"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "tag 归档不含 configure，配方提供可复现的预生成 Autotools 文件"
    - "关闭 wxWidgets/X11/docs，保留核心解释器和 OOP 扩展"
    - "通过 Conan 依赖 ncurses/6.4 提供静态 termcap API"
    - "OHOS musl 无 termio.h，补丁改用 termios.h"
  common_dependencies:
    - "ncurses/6.4 (shared=False)"

versions:
  "6.2.5":
    status: prepared
    build_date: "2026-09-30"
    verification_status: unverified
