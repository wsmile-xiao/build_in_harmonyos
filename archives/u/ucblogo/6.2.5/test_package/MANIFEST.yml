# test_package/MANIFEST.yml
package: ucblogo/6.2.5
homepage: "https://github.com/jrincayc/ucblogo-code"

# Upstream CI command from .github/workflows/ci.yaml at tag version_6.2.5.
# The OHOS recipe disables wx/X11, so xvfb-run is not needed.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "LOGOLIB=<source>/logolib <build>/ucblogo UnitTests.lg - -f <build>/logo-unit-test-results.txt -x"

# UnitTests.lg loads exactly the following ten suites.  Counts are the number
# of procedure names listed in each suite's MAKE "Tests.*" list, not procedure
# definitions or helper procedures.
upstream_tests:
  - file: "tests/UnitTests.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests.lg"
    description: "Test harness; loads 10 suites and defines 94 named cases"
    command: "./ucblogo UnitTests.lg - -f logo-unit-test-results.txt -x"
  - file: "tests/UnitTests-Arithmetic.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-Arithmetic.lg"
    description: "Arithmetic suite: 18 named cases"
    command: "RunAll via UnitTests.lg"
  - file: "tests/UnitTests-Bitwise.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-Bitwise.lg"
    description: "Bitwise suite: 6 named cases"
    command: "RunAll via UnitTests.lg"
  - file: "tests/UnitTests-Constructors.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-Constructors.lg"
    description: "Constructors suite: 10 named cases"
    command: "RunAll via UnitTests.lg"
  - file: "tests/UnitTests-Files.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-Files.lg"
    description: "Files suite: 5 named cases"
    command: "RunAll via UnitTests.lg"
  - file: "tests/UnitTests-Macros.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-Macros.lg"
    description: "Macros suite: 3 named cases"
    command: "RunAll via UnitTests.lg"
  - file: "tests/UnitTests-Predicates.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-Predicates.lg"
    description: "Predicates suite: 8 named cases"
    command: "RunAll via UnitTests.lg"
  - file: "tests/UnitTests-Random.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-Random.lg"
    description: "Random suite: 5 named cases"
    command: "RunAll via UnitTests.lg"
  - file: "tests/UnitTests-MemMgr.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-MemMgr.lg"
    description: "Memory manager suite: 2 named cases"
    command: "RunAll via UnitTests.lg"
  - file: "tests/UnitTests-OOP.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-OOP.lg"
    description: "Object system suite: 29 named cases"
    command: "RunAll via UnitTests.lg"
  - file: "tests/UnitTests-Control.lg"
    source: "ucblogo-code-version_6.2.5/tests/UnitTests-Control.lg"
    description: "Control-flow suite: 8 named cases"
    command: "RunAll via UnitTests.lg"

test_package_tests:
  - file: "test.sh"
    description: "1/7: installed ucblogo executable exists and is executable"
    command: 'bash test.sh <package>/bin/ucblogo'
  - file: "test.sh"
    description: "2/7: packaged share/ucblogo/logolib directory is present"
    command: 'bash test.sh <package>/bin/ucblogo'
  - file: "test.sh"
    description: "3/7: packaged share/ucblogo/helpfiles directory is present"
    command: 'bash test.sh <package>/bin/ucblogo'
  - file: "test.sh"
    description: "4/7: packaged share/ucblogo/csls directory is present"
    command: 'bash test.sh <package>/bin/ucblogo'
  - file: "test.sh"
    description: "5/7: packaged logolib/Messages file is readable and non-empty"
    command: 'bash test.sh <package>/bin/ucblogo'
  - file: "test.sh"
    description: "6/7: installed binary evaluates a real Logo program and prints 42"
    command: 'bash test.sh <package>/bin/ucblogo'
  - file: "test.sh"
    description: "7/7: success marker is present and the failure marker is absent"
    command: 'bash test.sh <package>/bin/ucblogo'

# 94 upstream named cases; consumer checks are counted separately.
assertion_count: 94
consumer_assertion_count: 7
