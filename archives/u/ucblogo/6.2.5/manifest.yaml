version: "6.2.5"
software: ucblogo
status: prepared
verification_status: unverified
build_date: "2026-09-30"
build_system: autotools

source:
  url: "https://github.com/jrincayc/ucblogo-code/releases/download/version_6.2.5/ucblogo-6.2.5.tar.gz"
  sha256: "8f4033a79c95efd0d4d2fb257b1f45dd7ba33cf7a2c8d942c29b5467ce31a4fa"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-objects"
    - "--disable-wx"
    - "--disable-x11"
    - "--disable-docs"
    - "LIBS=-lncursesw"
  dependencies:
    - "ncurses/6.4 (shared=False)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-termios.patch"

knowledge_gained:
  - "The official 6.2.5 release asset contains generated Autotools files, unlike the tag archive; the recipe pins that release asset with its SHA256."
  - "Require ncurses/6.4 with shared=False and set LIBS=-lncursesw."
  - "OHOS musl has termios.h but no termio.h or sgtty.h; term.c needs a termios branch enabled by HAVE_TERMIOS_H."
  - "The upstream Logo harness prints one line per named case and reports 94 cases in 10 suites."
