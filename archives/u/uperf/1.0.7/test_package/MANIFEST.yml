package: uperf/1.0.7
homepage: "https://github.com/uperf/uperf"

upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "make -C tests check（build() 内先拉起 uperf slave，测试完回收）"

upstream_tests:
  - file: "tests/Makefile.am"
    description: "上游 automake 测试账本：TESTS 无条件 17 + 条件注册 16（SCTP8/PROC4/SSL1/UDP2/RDS1），N_static=33；XFAIL_TESTS=2（unknown_proto/parse_err 为上游预期失败）。本次 --disable-ssl --disable-sctp 后实际注册 23（SCTP 8 + SSL 1 + RDS 1 未注册，按条件未启用申报）"
    command: "make -C tests check"

test_package_tests:
  - file: test.sh
    description: "消费者回环测试：以库使用者身份拉起打包产物 slave，运行 master 计划（connect/write/disconnect），断言退出码 0、输出含 Run Statistics、传输量 128.00B"
    command: "bash test.sh"

assertion_count: 3
