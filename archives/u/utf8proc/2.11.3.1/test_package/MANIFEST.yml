# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: utf8proc/2.11.3.1
homepage: "https://github.com/JuliaStrings/utf8proc"

# 上游测试命令 (CMake 构建系统, ctest 驱动; 数据文件由 CMake configure 从 unicode.org 下载)
upstream_check_command: "cmake --build build && ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试 (ctest 10 个测试)
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (ctest 10 个, 在 OHOS aarch64 上 conan create 实际执行并通过)
upstream_tests:
  - file: test/case.c
    source: utf8proc-2.11.3/test/case.c
    description: "大小写转换 (case folding) 测试"
    command: "./case"
  - file: test/custom.c
    source: utf8proc-2.11.3/test/custom.c
    description: "自定义 API 行为测试"
    command: "./custom"
  - file: test/iterate.c
    source: utf8proc-2.11.3/test/iterate.c
    description: "UTF-8 迭代解码测试"
    command: "./iterate"
  - file: test/misc.c
    source: utf8proc-2.11.3/test/misc.c
    description: "杂项 API 测试 (encode/width 等)"
    command: "./misc"
  - file: test/printproperty.c
    source: utf8proc-2.11.3/test/printproperty.c
    description: "字符属性表一致性测试"
    command: "./printproperty"
  - file: test/valid.c
    source: utf8proc-2.11.3/test/valid.c
    description: "UTF-8 合法性校验测试"
    command: "./valid"
  - file: test/maxdecomposition.c
    source: utf8proc-2.11.3/test/maxdecomposition.c
    description: "最大分解长度测试"
    command: "./maxdecomposition"
  - file: test/charwidth.c
    source: utf8proc-2.11.3/test/charwidth.c
    description: "字符显示宽度测试"
    command: "./charwidth"
  - file: test/graphemetest.c
    source: utf8proc-2.11.3/test/graphemetest.c
    description: "GraphemeBreakTest.txt 数据驱动测试 (796 行数据文件)"
    command: "./graphemetest data/GraphemeBreakTest.txt"
  - file: test/normtest.c
    source: utf8proc-2.11.3/test/normtest.c
    description: "NormalizationTest.txt 数据驱动归一化测试 (20095 行数据文件)"
    command: "./normtest data/NormalizationTest.txt"

# test_package 中自带的测试 (消费者视角验证, 调用真实 API)
test_package_tests:
  - file: test.c
    description: "消费者测试: version/NFC/iterate/grapheme_break/property 共 10 个断言"
    command: "./test_utf8proc"

# 测试断言总数 (近似值: 归一化数据 20095 行 + 字素数据 796 行 + 各单元测试断言 + 消费者 10 个)
assertion_count: 20901
