# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: utf8proc/2.11.3
homepage: "https://github.com/JuliaStrings/utf8proc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# make check 需要 julia 生成测试数据文件，OHOS 平台无 julia，跳过上游测试
upstream_tests:
  - file: test/normtest.c
    source: utf8proc-2.11.3/test/normtest.c
    description: "Unicode normalization test (requires julia for data generation)"
    command: "./test/normtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "API smoke test: version, iterate, charwidth"
    command: "./test_utf8proc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
