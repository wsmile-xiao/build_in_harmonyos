# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点证据（R51 三步法）:
#   * upx 4.2.4 上游自带一等公民 ctest 套件（CMakeLists.txt "test" 节 +
#     misc/cmake/6_test.cmake + misc/cmake/self_pack_test.cmake），
#     由 include(CTest) 注册，`make test` / `ctest` 运行。
#   * 上游原生构建实际注册 44 用例（MateBook 2026-09-30 真机 ctest 日志
#     与上游 CMakeLists 双重证实）：9 个 CLI 冒烟（--version/--version-short/
#     --license/--help×3/--sysinfo×3）、8 个自打包（nrv2b/nrv2d/nrv2e/lzma ×
#     过滤器变体）、upx-list/--fileinfo/-t（3）、8 个解包、7 个逐字节比较、
#     1 个 run-unpacked、8 个 run-packed（加壳后自执行）。
#     （Windows 首版清单误写 53/11 CLI/8 run-unpacked，真机日志更正。）
#   * 本配方以 UPX_CONFIG_DISABLE_RUN_PACKED_TEST=True 关闭 run-packed 组
#     （8 用例）：真机决定性对照实验证实 HM-MAC（use_task）在 execve 层拦截
#     加壳二进制自解包（/proc/self/exe 重映射类），与 noexec 无关、非配方缺陷，
#     属平台边界——证据链见 notes.md。关闭后实际运行 36 用例，全部确定性通过。
#   * exhaustive 矩阵（4 方法 × 7 压缩级别 ≈ 170 额外自打包用例）以
#     UPX_CONFIG_DISABLE_EXHAUSTIVE_TESTS=True 关闭以控制 CI 时长；
#     基础套件已覆盖全部 4 种压缩方法与过滤器变体。

package: upx-ucl/4.2.4
homepage: "https://upx.github.io"

# 上游测试命令：CMake 注册，原生构建时在 build() 内以 ctest 运行
upstream_check_command: "ctest (CMake include(CTest), misc/cmake/6_test)"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error --timeout 300"

upstream_tests:
  - "upx-version / upx-version-short / upx-license / upx-help-1..3 / upx-sysinfo-1..3 (9 CLI smoke)"
  - "upx-self-pack / -fa / -fn / -fr / -nrv2b / -nrv2d / -nrv2e / -lzma (8 自打包)"
  - "upx-list / upx-fileinfo / upx-test (3 打包产物检查)"
  - "upx-unpack ×8 + upx-compare ×7 (解包且逐字节还原)"
  - "upx-run-unpacked (1, 原始二进制自执行)"
  - "upx-run-packed ×8 (上游注册；本配方按 HM-MAC 平台边界证据关闭，见上)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：运行安装后的 upx CLI。① --version 冒烟（版本串 upx 4.2.4）；② 对 upx 二进制副本做真实 pack → -t 完整性校验 → unpack → cmp 逐字节还原 → 压缩后更小 的完整往返（upstream self-pack/compare 先例）。加壳镜像的自执行不测（HM-MAC 平台边界，证据见 notes.md）。"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
