# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e compliance

package: udpxy/1.0.25.1
homepage: "https://github.com/pcherenkov/udpxy"

# Upstream test inventory (R51): the 1.0-25.1 tarball ships six standalone
# unit-test programs in chipmunk/test/ (test_a2size/a2time/addrport/cache/
# ifaddr/txtf.c), but the Makefile declares NO check/test target for them
# (verified: `test` appears in no Makefile target; only the mktestcache.sh
# helper builds test_cache, and even that script is stale — it references
# `cache.c` instead of `test/cache.c` and omits extrn.c for g_flog).
# getflv/mcprobe/upxc in the same directory are developer tools, not tests
# (mcprobe needs a live multicast feed). The recipe build() therefore compiles
# and runs all six test programs directly, plus negative controls.
upstream_check_command: "none (no make target; programs run from build())"
upstream_test_in_build: true
upstream_test_command: "compile+run test/test_a2size, test_a2time, test_addrport, test_cache, test_ifaddr, test_txtf in build()"

upstream_tests:
  - file: test/test_a2size.c
    source: udpxy-1.0-25.1/chipmunk/test/test_a2size.c
    description: "size-spec parsing unit test (a2size: 32Kb/1Mb)"
    command: "./t_a2size 32Kb 1Mb"
  - file: test/test_a2time.c
    source: udpxy-1.0-25.1/chipmunk/test/test_a2time.c
    description: "time-spec parsing unit test (a2time: +00:01/1:00.00)"
    command: "./t_a2time +00:01 1:00.00"
  - file: test/test_addrport.c
    source: udpxy-1.0-25.1/chipmunk/test/test_addrport.c
    description: "addr:port parsing unit test (get_addrport)"
    command: "./t_addrport 127.0.0.1:4022 239.0.0.1:5000"
  - file: test/test_cache.c
    source: udpxy-1.0-25.1/chipmunk/test/test_cache.c
    description: "in-memory stream-cache unit test (dscache read/write)"
    command: "./t_cache"
  - file: test/test_ifaddr.c
    source: udpxy-1.0-25.1/chipmunk/test/test_ifaddr.c
    description: "interface/address resolution unit test (get_ipv4_address)"
    command: "./t_ifaddr 127.0.0.1"
  - file: test/test_txtf.c
    source: udpxy-1.0-25.1/chipmunk/test/test_txtf.c
    description: "text-file reader unit test (txtf_read on README)"
    command: "./t_txtf README"

# hmbs rule4 evidence fields: six standalone test mains, no harness framework
# (no ctest/gtest/autotools TESTS), so the count method is auto with the audit
# above as the single deterministic source (6 test_*.c files, each one program).
upstream_tests_exist: true
upstream_test_audit: "Listed chipmunk/test/: 6 test_*.c mains (a2size/a2time/addrport/cache/ifaddr/txtf) + 3 dev tools (getflv/mcprobe/upxc, not tests) + mktestcache.sh helper; Makefile has no check/test target (findstr 'test' in Makefile: no target match). Total = 6."
upstream_test_total: 6
upstream_test_count_method: auto

# Consumer-side tests in test_package (CLI contract layer + live status page;
# relaying real multicast traffic needs a live feed and cannot run headlessly)
test_package_tests:
  - file: test.sh
    description: "CLI contract: -h/--help exit 0 with usage on stdout; no-args/-Z exit 1 (udpxy and udpxrec)"
    command: "bash test.sh"
  - file: test_status.py
    description: "Functional: live udpxy on 127.0.0.1 serves /status/ with HTTP 200, udpxy markers and the bound port"
    command: "python3 test_status.py"

# test.sh ok() count on success: -h rc(1) + banner(2), --help rc(3) + banner(4),
# no-args rc(5) + stderr usage(6), -Z nonzero(7), udpxrec --help(8),
# udpxrec no-args(9), status page(10)
assertion_count: 10
