# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: unfurl/0.4.3
homepage: "https://github.com/tomnomnom/unfurl"

# 上游测试命令 (Go 项目: go test ./...)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "go test -v -count=1 ./..."

# 上游实际运行的测试程序 (Go 单元测试，go test ./... 覆盖全部包)
# 上游仅 1 个测试文件 format_test.go，含 1 个测试函数 TestFormat
# 由 32 个表驱动子用例 (t.Run) 组成，覆盖 format 模式全部指令
# (%s scheme / %u userinfo / %d domain / %S subdomain / %r root / %t tld /
#  %P port / %p path / %e extension / %q raw query / %f fragment / %% /
#  %@ / %: / %? / %# / %a authority)
upstream_tests:
  - file: format_test.go
    source: unfurl-0.4.3/format_test.go
    description: "TestFormat 表驱动测试：format 模式 32 个指令用例（scheme/domain/path/query/extension/fragment/port/userinfo/apex/subdomain/tld/authority/字面量%%）"
    command: "go test -v -count=1 ./..."
    test_count: 32

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: stdin 喂入 URL 后依次验证 domains/paths/keys/format 四个模式的真实输出"
    command: "bash test.sh <bin/unfurl>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
