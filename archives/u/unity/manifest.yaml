software: unity
display: "Unity"
description: "C 语言单元测试框架（ThrowTheSwitch），100% ANSI C99，无第三方依赖"
category: dev-tools
homepage: "https://github.com/ThrowTheSwitch/Unity"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 ANSI C99 单文件核心（src/unity.c + unity.h + unity_internals.h），零依赖，OHOS 原生编译无需任何源码修改"
    - "上游自检套件（test/Makefile）的 runner 由 awk 脚本生成，CI worker 与本机均有 awk，无需 ruby（test/Makefile 的 *.Runner.c 规则走 awk 路径）"
    - "libunity.so 按最大能力编译（-D UNITY_SUPPORT_64 -D UNITY_INCLUDE_DOUBLE，与上游 doubles 套件同款）；消费者按需定义 UNITY_INCLUDE_DOUBLE 使用 double 断言"
  common_dependencies: []

versions:
  "2.7.0":
    status: built
    build_date: "2026-09-02"
    source_url: "https://github.com/ThrowTheSwitch/Unity/archive/refs/tags/v2.7.0.tar.gz"
