# test_package/MANIFEST.yml — unity 2.7.0
# 上游官方测试来源声明
# CI L0e 门禁通过此文件确认上游测试来源

package: unity
version: "2.7.0"

# 上游构建系统（CI 据此选择测试执行方式）
upstream:
  build_system: makefile
  # 测试类型: make_check | ctest | meson_test | pytest | none
  # Unity 自带自检套件（test/Makefile `make test`，8 个自检二进制）
  test_type: make_check
  # 上游官方测试命令（conanfile build() 中真实执行）
  test_command: "make -C test CC=clang CFLAGS='-O2' test"
  # 测试工作目录（相对于源码根目录）
  test_directory: "test"

# 上游测试统计（实测，2026-09-02，clang -O2，OHOS aarch64 真机）
upstream_test_stats:
  suites: 8          # arrays/core/doubles/float/integers/integers_64/memory/strings
  total_tests: 872   # 274+26+101+102+258+55+14+42
  failures: 0
  ignored: 3         # integers_64 套件内 3 个条件性忽略用例

# OHOS 平台兼容性
ohos_compatibility:
  status: full
  detail: "100% ANSI C99，纯用户态无 POSIX 依赖；上游 8 自检套件 872 用例 0 失败（3 ignored 为上游条件性跳过）；libunity.so 共享库链接正常"
  verified_features:
    - "arrays 套件 274 用例（数组/数组指针/数组内 delta 全过）"
    - "core 套件 26 用例（框架核心生命周期全过）"
    - "doubles 套件 101 用例（64 位浮点断言全过）"
    - "float 套件 102 用例（32 位浮点断言全过，3 ignored）"
    - "integers 套件 258 用例（int8/16/32/64/size_t 全过）"
    - "integers_64 套件 55 用例（int64 路径全过）"
    - "memory 套件 14 用例（memcmp 系断言全过）"
    - "strings 套件 42 用例（字符串/字符串数组全过）"

# Conan test_package 测试（CI 通过 conan create 自动执行）
conan_test:
  type: api_check
  description: "冒烟测试跑 UnityBegin/RUN_TEST/UNITY_END 完整生命周期（2 用例）+ 鸿蒙特有测试（4 用例）"
  test_method: "真实链接 libunity.so 运行，Unity 断言全过即通过"
