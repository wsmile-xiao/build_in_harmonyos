# ============================================================
# 构建信息
# ============================================================

build:
  system: makefile
  # 配方 build()：
  #   1. make -C test CC=clang CFLAGS='-O2' test  （上游自检 8 套件 872 用例，L1）
  #   2. clang -std=c99 -O2 -fPIC -shared src/unity.c
  #      -D UNITY_SUPPORT_64 -D UNITY_INCLUDE_DOUBLE -o libunity.so
  configure_options: []
  dependencies: []
  cc: clang
  cxx: ""

patches_applied: []
knowledge_gained:
  - "UNITY_OUTPUT_CHAR 函数式宏不能走 CMake target_compile_definitions（编译器告警
     function-style macro），须在测试源码 include unity.h 前 #define；
     UNITY_OUTPUT_CHAR_HEADER_DECLARATION 须展开为无返回类型声明（void f(int)）"
  - "UNITY_INCLUDE_DOUBLE 须库侧与消费者侧同时定义，否则断言运行时报
     'Unity Double Precision Disabled'"
  - "Unity 约定每个测试程序必须提供 setUp/tearDown，缺符号链接失败"

# ============================================================
# 测试统计（实测，2026-09-02，OHOS aarch64 真机，clang -O2）
# ============================================================

