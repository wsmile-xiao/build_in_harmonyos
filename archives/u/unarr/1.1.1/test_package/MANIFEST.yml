# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: unarr/1.1.1
homepage: "https://github.com/selmf/unarr"

# 上游测试在 conanfile.py 的 build() 中通过 cmake.test() 真实执行
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "cmake.test() -> ctest（BUILD_INTEGRATION_TESTS=ON + BUILD_UNIT_TESTS=ON）"

upstream_tests:
  - file: test/CMakeLists.txt
    source: unarr-1.1.1/test/CMakeLists.txt
    description: "集成测试：unarr-test 逐个读取 test/corpus/integration 下的 rar4/zip/7z/tar 样本并校验解压结果（20 条 run_test 注册项；zip-bzip2 与 zip-xz 受 find_package 结果保护，本配方已全部启用）"
    command: "ctest (test/CMakeLists.txt 中的 run_test 注册项)"
  - file: test/crc32-test.c
    source: unarr-1.1.1/test/crc32-test.c
    description: "单元测试：crc32 实现（需要 cmocka，配方用 test_requires(cmocka/2.0.2) 提供）"
    command: "ctest (crc32-test)"

test_package_tests:
  - file: test.c
    description: "内存构造最小 ustar 归档，经 ar_open_memory/ar_open_tar_archive/ar_parse_entry/ar_entry_get_name/ar_entry_get_size/ar_entry_uncompress 读取并断言条目名、大小与解压内容；另断言非归档数据被拒绝；11 项断言"
    command: "./test_unarr"

assertion_count: 11
