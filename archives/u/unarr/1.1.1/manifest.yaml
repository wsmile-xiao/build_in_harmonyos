# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.1"

# 软件名
software: "unarr"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/selmf/unarr/archive/refs/tags/v1.1.1.tar.gz"

  # 源码校验和
  sha256: "fa0ebf6d9b420d34171b1b6100949edce708c7933e7cfd2cedd03eae998d1c53"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - bzip2/1.0.8
    - liblzma/5.8.1
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 find_package(ZLIB/BZip2/LibLZMA) 找的是规范目标名，Conan CMakeDeps 默认生成小写目标（zlib::zlib），需 set_property(cmake_target_name) 对齐，否则 if(TARGET ...) 判空导致压缩库根本没链接"
  - "静态构建时上游对压缩库用 PRIVATE 链接不会传播给消费方，需改为 PUBLIC（静态库的链接接口）"
  - "平台 CMake 4.x 拒绝 cmake_minimum_required(<3.5)，用 cache_variables[CMAKE_POLICY_VERSION_MINIMUM]=3.5 兼容"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_hash: cce07a81ed1183a9
  source_work_hash: 49bdfbe306351c27
  generated_at: '2026-09-16T01:59:52'
  patches_count: 1

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: portability
    platform_only: false
    guard: none

conan_ref: "unarr/1.1.1@ohpcd/stable"
