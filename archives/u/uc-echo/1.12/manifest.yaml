knowledge_gained:
  - "OHOS clang/libc++ 无 C++ TR1 头：pre-C++11 源码需 tr1::X/std::tr1::X -> std::X、<tr1/y> -> <y>（C++11 等价语义）"
  - "aarch64 plain char 默认无符号：x86 时代代码用 char（index_t）存 -1 需 -fsigned-char 恢复语义，否则静默改行为"
  - "OHOS libc 不经 <fcntl.h> 传递声明 close()：mmap 封装类需显式 #include <unistd.h>"

