# test_package/MANIFEST.yml
# uc-echo 1.12 上游官方测试声明（R51 三步法清点）

package: uc-echo/1.12
homepage: "http://uc-echo.sourceforge.net/"

# 上游无自动测试命令：Makefile 仅 all/clean/release 目标，无 test/check；
# 无 tests/ 目录；无 ctest/pytest 注册。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游"测试"实为示例数据流程：sample_data.txt（10000 reads）经 Python2 + SciPy/NumPy
# 驱动 ErrorCorrection.py 纠错后与 sample_answer.txt 人工对比；README 明言输出与答案
# "There will be differences"——非逐字断言、非自动化。CI 能力矩阵无 Python2/SciPy，
# 该流程在本环境不可运行（证据：ErrorCorrection.py 第 16-20 行 scipy/numpy 导入、
# 第 110 行 print 语句为 Python2 语法）。
upstream_tests:
  - file: sample_data.txt
    source: sample_data.txt
    description: "示例数据 + sample_answer.txt 人工对比流程，非自动测试，本环境不可运行"
    command: "（上游无可执行自动测试）"

# test_package 自带测试（消费者视角，调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: "消费者端到端测试：构造 12 条目输入（2 处测序错误），串 hashing→HashMerge→NeighborJoin×2→NeighborMerge→Voting 全部 6 个二进制，纠错输出金标逐字断言 + 全二进制 K0 --version/--help"
    command: "bash test.sh"

# 断言总数：K0 6 二进制 × 2 = 12；流水线 9 条命令 rc（set -eu）；金标 cmp = 1
assertion_count: 22
