software: util-linux
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.42/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.42"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.tar.xz"

  # 源码校验和
  sha256: "3452b260bbaa775d6e749ac3bb22111785003fc1f444970025c8da26dfa758e9"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires: []

# 构建配置选项
build_options:
  - "autotools；沿用 2.39 裁剪：--disable-all-programs --enable-libblkid/libuuid/libmount；config.guess/config.sub OHOS patch；umask 077 修复（E011）"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游 ts 测试套件**已实跑**（2026-09-11 复查）：**91/91 套件全部 PASS**（176 个 sub-test）。此前声明'裁剪构建仅编库、ts 套件需完整工具集环境故不可运行'——经本地**完整构建**（非配方裁剪）验证，ts 套件**实际可跑通**，只需 3 项环境适配：① tools/ 下 7 处 `#!/bin/bash` shebang 改为 `/data/service/hnp/bin/bash`（OHOS 无 /bin/bash，否则 errnos.h 生成报 Error 126，E165）；② 补 GNU 兼容 xargs（OHOS toybox xargs 不支持 `-I`，run.sh 第 254 行依赖）——需注意 shim 遇首个非选项参数即须停止解析，否则会吞掉 `bash -c` 的 -c；③ TMPDIR 指向可写目录。要点：blkid 11/11、uuidgen 2/2、findmnt 6/6、mount 33/33；配方内 `--disable-all-programs` 裁剪（只编 libblkid/libuuid/libmount）使 ts 套件无法随包运行，故 ts 结果记录为本地实测、不并入配方构建。另注：`make check` 编译测试二进制时遇 `sockaddr_storage` 重复定义（OHOS sysroot 的 linux/socket.h:23 与 sys/socket.h:377 双重定义），因裁剪构建未触发 lsfd 故不影响配方出包。test_package 消费者探针（blkid_new_probe/free）验证 libblkid 链接 + 初始化，1/1 通过"
