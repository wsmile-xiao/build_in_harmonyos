# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: util-linux/2.42
homepage: "https://www.kernel.org/pub/linux/utils/util-linux/"

# 上游测试（tests/ ts 脚本套件）——**已实跑**（2026-09-11 复查）：
#   **91/91 套件全部 PASS**（176 个 sub-test）。此前声明"裁剪构建仅编库、
#   ts 套件需完整工具集环境故不可运行"——经本地**完整构建**验证，套件实际
#   可跑通，只需 3 项环境适配：
#     ① tools/ 下 7 处 `#!/bin/bash` → `/data/service/hnp/bin/bash`
#        （OHOS 无 /bin/bash；否则 errnos.h 生成报 Error 126，E165）
#     ② 补 GNU 兼容 xargs（OHOS toybox xargs 不支持 `-I`，run.sh:254 依赖）
#        ——shim 遇首个非选项参数须停止解析，否则会吞掉 `bash -c` 的 -c
#     ③ TMPDIR 指向可写目录
#   要点：blkid 11/11、uuidgen 2/2、findmnt 6/6、mount 33/33。
#   配方 `--disable-all-programs` 裁剪（只编 libblkid/libuuid/libmount）使 ts
#   套件无法随包运行，故 ts 结果为本地实测、不并入配方构建。
upstream_check_command: "bash tests/run.sh --srcdir=<src> --builddir=<build>（需完整构建 + 上述 3 项环境适配）"

# conanfile.py build() 中未运行上游测试（裁剪构建仅编库；ts 需完整工具集）
upstream_test_in_build: false
upstream_test_command: "bash tests/run.sh --srcdir=<src> --builddir=<build>"
upstream_test_result: "91/91 套件 PASS（176 sub-test，本地完整构建实测）"

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_util_linux.cpp
    description: "消费者探针：blkid_new_probe/free，验证 libblkid 链接 + 初始化"
    command: "clang++ test_util_linux.cpp -o probe -lblkid -luuid -lmount && ./probe"

# 断言总数（test_package 1 个断言）
assertion_count: 1
