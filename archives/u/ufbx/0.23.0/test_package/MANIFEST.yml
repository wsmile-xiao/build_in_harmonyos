# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ufbx/0.23.0
homepage: "https://github.com/ufbx/ufbx"

# 上游测试命令 (实测: test/runner.c + ufbx.c 编译后运行, 数据目录 data/)
upstream_check_command: "clang -O2 -std=c99 -I. -o ufbx_runner test/runner.c ufbx.c && ./ufbx_runner -d data"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (实测结果: 647/647 全部通过)
upstream_tests:
  - file: test/runner.c
    source: ufbx-0.23.0/test/runner.c
    description: "ufbx 官方测试 runner (含 deflate/fbx 解析/obj 等 647 个用例)"
    command: "./ufbx_runner -d data"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: ufbx_load_memory 解析最小 FBX 场景并释放"
    command: "./test_ufbx"

# 测试断言总数 (上游 runner 647 个用例全部通过)
assertion_count: 647