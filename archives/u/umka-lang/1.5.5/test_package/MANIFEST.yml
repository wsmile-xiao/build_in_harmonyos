package: umka-lang/1.5.5
homepage: "https://github.com/vtereshkov/umka-lang"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: "cd tests/lib && cc -fPIC -O3 -c lib.c && cc -shared -fPIC *.o -o lib.umi && rm -f *.o && cd .. && ../build/umka all.um"

upstream_tests:
  - name: all_um
    command: "build/umka all.um"
    expected: "exit code 0, 1396 lines output matching expected.log"

test_package_tests:
  - file: test.c
    description: "Call umka C embedding API: umkaGetVersion, umkaAlloc, umkaInit, umkaCompile, umkaRun"
    command: "./test_umka"

assertion_count: 3
