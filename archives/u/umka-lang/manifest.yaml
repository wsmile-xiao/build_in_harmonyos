# 软件级 manifest
# 文件位置: archives/u/umka-lang/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: umka-lang

# 显示名
display: "Umka-lang"

# 一句话描述
description: "Umka: a statically typed embeddable scripting language"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/vtereshkov/umka-lang"

# 开源许可证（SPDX 标识）
license: BSD-2-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Makefile 通过 uname -s 检测平台，HarmonyOS 需传 PLATFORM=Linux 覆盖"
    - "无 configure 脚本，直接 make + make install"
    - "Conan 配方需 cwd=self.source_folder 避免 make 找不到 Makefile"

  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.5.5":
    status: published
    build_date: "2026-06-29"
