# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法: 解压上游源码包 → ./configure → make -C tests check
#           （unuran 用 automake parallel-tests：tests/Makefile.am 的
#             `check_PROGRAMS` 列出全部用例程序，`TESTS = $(check_PROGRAMS)`
#             把它们全部注册给 `make check`）
#
# 本包不改任何上游源码，因此**没有 patches/**：
#   - E007 的 OHOS 三元组改写落在配方里（configure 已由 tarball 提供，
#     config.guess/config.sub 在 AC_CONFIG_AUX_DIR 指定的 autoconf/ 下）；
#   - E114 的 `umask 077` → `umask 022` 同样是对已生成 configure 的配方内改写。

package: unuran/1.12.0
homepage: "https://statmath.wu.ac.at/unuran/"

# 上游测试命令（顶层 `make check` 会连带下到 doc/ 触发 makeinfo，故只进 tests/）
upstream_check_command: "make -C tests check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C tests check"

# `tests/Makefile.am` 的 check_PROGRAMS：58 个自检程序（每个都自带参考序列
# 比对，不只是"跑起来不崩"）。另有 2 个 t_deprecated_* 受 AM_CONDITIONAL
# ENABLE_DEPRECATED 门控、2 个 Mathematica 程序受 HAVE_MATHEMATICA 门控，
# 上游默认配置下这两个变量为空 → 不注册。
upstream_tests:
  - file: tests/Makefile.am
    source: unuran-1.12.0.tar.gz/tests/Makefile.am
    description: >
      check_PROGRAMS 58 个程序，TESTS = $(check_PROGRAMS) 全量注册给
      `make check`。按功能分四类：
      (1) 框架与对象模型 —— t_unur_tests / t_unur_error / t_x_gen /
          t_util_matrix / t_info / t_stringparser / t_urng；
      (2) 分布对象 —— t_distr 及其 11 个派生（cemp/cont/corder/cvec/condi/
          cvemp/cxtrans/discr/matr/…）；
      (3) 每个已实现采样方法各一个回归程序 —— auto/arou/ars/cext/cstd/
          dari/dau/dext/dgt/dsrou/dss/dstd/empk/empl/gibbs/hinv/hist/hitro/
          hrb/hrd/hri/itdr/mcorr/mixt/mvstd/mvtdr/ninv/norta/nrou/pinv/srou/
          ssr/tabl/tdr(+gw/ps/ia)/unif/utdr/vempk/vnrou；
      (4) 工具 —— t_util_matrix、t_stringparser 等。
      每个程序读取 tests/*.conf 的参考值并逐点比对。
    command: "make -C tests check"

# test_package 中自带的测试 (消费者视角验证: 真实链接 libunuran 并调用公开 API)
test_package_tests:
  - file: test_unuran.c
    description: >
      消费者视角 6 组 / 86 条断言：
      (1) 对象模型与字符串解析器（unur_str2gen / unur_str2distr / 错误通道
          unur_get_errno+unur_get_strerror，含一次预期失败的负向用例）；
      (2) 种子语义（同种子逐位可复现、unur_gen_reset 回到上次 seed 的状态、
          不同种子产生不同流、内置 URNG 是**进程级单流**这一可观测行为）；
      (3) 统计正确性（20000 个正态样本 mean/var/±5σ 覆盖率；20000 个均匀
          样本落在 [0,1) 且 mean≈1/2、var≈1/12）；
      (4) 离散分布与 distr→par→init 对象 API（poisson(4.0) 的 DARI 方法、
          unur_distr_normal + unur_arou_new + unur_init、unur_get_distr、
          unur_gen_clone）；
      (5) 鸿蒙 aarch64 ABI（LP64、FLT_RADIX/DBL_MANT_DIG/DBL_MAX_EXP、
          1.0/3.0 的 IEEE-754 位型往返、内置 MRG31k3p URNG 的可用性与值域）；
      (6) 4 线程各持自己的 unur_urng_new() 源驱动独立生成器，断言全部有限、
          范围合理、单线程复跑逐位一致、4 条流两两不同、各自仍服从 N(0,1)。
    command: "./test_unuran"

# 鸿蒙特有测试条数 (rule12)
ohos_specific_tests: 2
ohos_specific_description: >
  第一组（group 5，ABI）：OHOS aarch64 是 LP64；unuran 的拒绝/反演内核直接
  对 double 做 log/exp，其常量表（chisq、intervals）按 IEEE-754 binary64
  生成。断言 sizeof(int)==4 / sizeof(size_t)>=8 / FLT_RADIX==2 /
  DBL_MANT_DIG==53 / DBL_MAX_EXP==1024，并用 memcpy 做 1.0/3.0 的位型往返
  ——这些在 32 位 long 或非二进制浮点的宿主上会直接失败，是可观测行为而非
  字符串比对。
  第二组（group 6，线程）：unuran 内置 URNG 的状态是文件级 static
  （src/uniform/mrg31k3p.c），全进程共享；OHOS PC 上库以静态库形式被链接进
  消费者，两个默认配置的生成器**无法**从两个线程驱动。断言演示正确姿势：
  用 unur_urng_new() 给每个线程一个自己的源，4 条流两两不同且各自仍服从
  N(0,1)，同一线程复跑逐位一致。

# 测试断言总数 (实测: 86/86 通过)
assertion_count: 86
