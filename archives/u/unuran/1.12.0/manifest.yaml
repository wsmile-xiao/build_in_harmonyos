package: unuran
version: "1.12.0"
homepage: "https://statmath.wu.ac.at/unuran/"
license: GPL-2.0-or-later
status: built
build_system: autotools
build_date: "2026-09-20"

source:
  url: "https://statmath.wu.ac.at/unuran/unuran-1.12.0.tar.gz"
  sha256: "aba0846715a486ded86cb208b091ea92a043f27281241e96a01a126de1ca0a85"
  notes: "上游官方 tarball，解出目录 unuran-1.12.0，配方用 strip_root=True 拉平。该 host 不在 ci/conan/build_and_test.sh 的镜像白名单内，CI 按原 URL 直连（与 tevent 的 download.samba.org 同类）。tarball 已附 configure / 全部 Makefile.in / autoconf/{config.guess,config.sub}，无需 autoreconf 引导。"

build:
  system: autotools
  bootstrap: none
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  make_args:
    - "-C scripts"
    - "-C src"
    - "-C tests check"
    - "-j1"
  dependencies: []
  tool_requires: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ref: E007（autotools 三元组）在 AC_CONFIG_AUX_DIR 下的定位陷阱. unuran 用 AC_CONFIG_AUX_DIR([autoconf])，config.guess/config.sub 因此位于 autoconf/ 而不是源码根 —— 只往源码根找的 E007 补丁会**静默地什么都没改**，随后 configure 以 'cannot guess build type' 失败，很难看出是补丁没落地。配方改成沿 ('.', 'autoconf', 'config', 'build-aux', 'scripts') 依次探测，并且每一处改写都带 idempotent guard + 未命中 anchor 时 warning。"
  - "E007 必须**按半量**应用：unuran 1.12.0 的 autotools 版本较新，config.sub 已经认识 ohos* 与 linux-ohos*（`gnu* | android* | ohos*`、`linux-uclibc* | linux-ohos*`），实际只有 config.guess 的两处需要补（__OHOS__ 的 LIBC 分支、*:HarmonyOS:*:* 的 case）。把四处的 guard 都写成 '若字符串已存在则跳过' 而不是无条件插入，才能既兼容只缺一半的 helper、又不重复插入。"
  - "ref: E114（HMDFS）. 已生成的 configure 里有 2 处 `umask 077 && mktemp -d ./confXXXXXX`；HMDFS 强制目录 setgid，产出的 temp dir 连 owner 都写不进去。统一改成 `umask 022`（a52dec/adcli/univalue/libxdg 同款做法）。"
  - "ref: E074（jobserver FIFO）. OHOS worker 的 SELinux 策略拒绝 make 的 jobserver FIFO，并行 make 必挂；本包所有 make 调用都带 -j1。"
  - "顶层 `make` 会下到 doc/，而 doc/ 需要 texinfo 的 makeinfo —— CI worker 的干净 PATH 里没有，整个构建会以 'makeinfo: not found' 收场。改成分目录驱动（make -C scripts / -C src / -C tests check / -C src install），而不是在命令行覆盖 SUBDIRS=...：后者会经 MAKEFLAGS 传播进每一层 sub-make，把 src/ 与 tests/ 自己的嵌套 SUBDIRS 变量也一并冲掉，反而漏掉子目录。"
  - "src/unuran.h 比 src/unuran.h.in 新（tarball 已生成好），因此不需要 perl，也不触发 merge_h.pl —— 这是判断某个 autotools 包能否在无 perl 的 worker 上直接构建的关键信号（比较两个文件的时间戳）。"
  - "新条目（草稿 DRAFT-unuran-1.12.0-configure-auxdir-triplet-patch-and-doc-subdir-make）：把上面三条（AUX_DIR 定位、半量 E007、顶层 make 误入 doc/）合并成一条『已带 configure 的 autotools 包在 OHOS 上的最小构建路径』判据。"
  - "unuran 内置 URNG 的状态是文件级 static（src/uniform/mrg31k3p.c 的 x10/x11/x12 等），全进程共享：unur_gen_seed(a, S) 之后再 seed 另一个生成器，会把同一个全局流重置；两个默认配置的生成器无法从两个线程驱动。多线程消费必须用 unur_urng_new() 给每个生成器一个自己的源。该属性在 test_package 里以可观测断言形式固定下来（group 2 与 group 6）。"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []

upstream_tests:
  command: "make -C tests check"
  registrations: 58
  test_count: 58
  executed: 58
  not_executed: 0
  notes: >
    rule4 口径：上游 unuran 不在 GitHub 上托管（发布在 statmath.wu.ac.at 的
    SVN/快照），没有"默认分支"可扫，故以钉版 tarball 的 tests/Makefile.am 为准，
    并取**朴素行扫描的上限**：该文件以 ` t_` 开头的行共 109 行
    （check_PROGRAMS 段 55 行 + EXTRA_DIST 段 54 行），去重后 t_* 标识符 62 个（58 注册 + 2 deprecated 门控 + 2 Mathematica 门控）。
    差额来源全部可归因：58 个是 check_PROGRAMS 真实程序；其余是同一程序在
    EXTRA_DIST 里按 `t_<name>.conf`（测试参考数据文件）重复列名，另有 2 个
    t_deprecated_* 受 AM_CONDITIONAL ENABLE_DEPRECATED 门控、2 个 Mathematica
    程序（test_StdDistr、test_functionparser）受 HAVE_MATHEMATICA 门控，上游默认
    配置下两个变量均为空、不注册。适配后 N' = 58 实跑 + 86 条 test_package 断言
    = 144 ≥ 109，无减少。

test_package:
  assertion_count: 86
  description: >
    消费者测试 test_unuran.c（C99，CMake 链接 unuran::unuran + Threads::Threads），
    6 组共 86 条断言，只用已安装头文件与 libunuran.a。分组：对象模型/解析器与错误
    通道（含一次预期失败）、种子语义（逐位可复现 / reset / 不同种子 / 进程级单流）、
    统计正确性（20000 样本的 mean/var/±5σ 与均匀分布）、离散分布与 distr→par→init
    对象 API、鸿蒙 aarch64 ABI（LP64 + IEEE-754 + 内置 URNG）、4 线程各持独立 URNG
    源。运行期由 test_package/conanfile.py 直接执行二进制（TMPDIR 指向 build 目录）。

ci:
  profile: ci/conan/profiles/ohos-aarch64
  package_type: library
  shared_default: false
