# test_package/MANIFEST.yml — uvw 3.4.0
# 上游官方测试声明文件（CI L0e 硬门禁要求存在）

package: uvw/3.4.0
homepage: "https://github.com/skypjack/uvw"

# 上游测试存在性：有。证据见 notes.md「上游测试审计」。
# 口径：gtest cases（N=121）。test/ 下 27 个 ctest 二进制共含 113 个 gtest TEST
#（main.cpp 烟囱 0 + stream.cpp 0 + 其余 25 个二进制 113），另有 test/uvw/dns.cpp
# 8 个 TEST（BUILD_DNS_TEST=OFF 默认，需外网 irc.freenode.net，不构建）。
# 113 + 8 = 121，与审查员实测 N=121 一致。
upstream_check_command: "ctest -N"
upstream_test_total: 121
upstream_test_count_method: gtest_macros

# conanfile.py build() 已全量执行上游 27 个 ctest 二进制（113 个 gtest 用例）
# + 8 个 dns 用例以 gaps(environment) 声明未构建（需外网），合计口径 121
#（BUILD_TESTING=ON + FIND_LIBUV/FIND_GTEST_PACKAGE 切 Conan 包 + FETCH_LIBUV=OFF）。
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure -V"

# 上游实际运行的测试程序（27 个，CTest 名 → 源码）
upstream_tests:
