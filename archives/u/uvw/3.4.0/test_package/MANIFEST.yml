  - file: test_uvw.cpp
    description: "真实驱动事件循环：libuv 版本探测、loop 创建、5ms 单次定时器恰好触发 1 次、循环正常排空"
    command: "./test_uvw"

# 测试断言总数（test_uvw.cpp 的 4 个 CASE PASS，与 HMBS_TEST_PACKAGE_RESULT discovered=4 一致）
