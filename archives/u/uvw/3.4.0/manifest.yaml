# 版本级 manifest — uvw 3.4.0
# 文件位置: archives/u/uvw/3.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "3.4.0"
software: "uvw"

# published | built | failed | archived
# 首轮：真机预检尚未执行，暂标 built，预检通过后由 HMBS 更新。
status: built

build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://github.com/skypjack/uvw/archive/v3.4.0_libuv_v1.48.tar.gz"
  sha256: "c16600573871a5feeb524234b378ab832c8971b2a68d030c6bd0e3077d416ade"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_TESTING=ON（全量接入上游套件；口径 gtest cases N=121 = 113 已构建 + 8 dns 未构建）"
    - "FIND_LIBUV=ON + FETCH_LIBUV=OFF（用 Conan libuv，禁用 FetchContent 网络拉取）"
    - "FIND_GTEST_PACKAGE=ON（用 Conan gtest/1.17.0，禁用 FetchContent 网络拉取）"
    - "BUILD_DOCS=OFF；BUILD_DNS_TEST=OFF（上游默认，需外网 DNS）"
    - "CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64（E092 规避）"
  dependencies:
    - "libuv/1.52.1"
  cc: clang
  cxx: clang++

patches_applied: []
# 口径：gtest cases N=121（113 构建内执行 + 8 dns 未构建需外网）；ctest 二进制 27 仅为载体。
# header-only 形态无需源码补丁；测试面切换全部通过 CMake 变量完成。

knowledge_gained:
  - "uvw 3.4.0 为 header-only 库（INTERFACE target uvw::uvw），C++17，配方 package_type=header-library + package_id clear"
  - "上游名义绑定 libuv 1.48.0，但制品仓仅有 libuv/1.52.1（published）；libuv C API 稳定，用 1.52.1 替代（R36 依赖必须先发布）"
  - "上游 test/CMakeLists.txt 默认用 FetchContent 从 GitHub 拉 googletest/libuv；FIND_GTEST_PACKAGE/FIND_LIBUV 双开关可切换为 find_package，适配 CI 无网环境"
  - "必须显式 FETCH_LIBUV=OFF，否则 find_package 失败时会回退到 git clone，CI 直接卡死"
  - "OHOS 下 CMAKE_HAVE_LIBC_PTHREAD=True，避免 CMake 误选不存在的 -lpthreads 兼容名"
  - "ctest 可执行文件取 CMakeCache.txt 的 CMAKE_CTEST_COMMAND 绝对路径，CI 的 PATH 不一定有 ctest"
  - "上游 N 口径为 gtest TEST 宏总数 121（113 构建内 + 8 dns 需外网未构建），27 仅为 ctest 二进制数，不可作声明 N"
