# 版本级 manifest — udiskie 2.6.2 (ARCHIVE-SPEC v3.0)
version: "2.6.2"
software: "udiskie"
status: built
build_date: "2026-10-12"
build_system: "python"

source:
  url: "https://github.com/coldfix/udiskie/archive/refs/tags/v2.6.2.tar.gz"
  sha256: "9d758efd4e3706ce824e693708cce1e0a840dae9aa5b130e3592d3588da8279c"
  tar_format: tar.gz

build:
  system: python
  configure_options: []
  dependencies:
    - "pygobject/3.58.0"   # gi (GLib/GObject/GIO) 绑定 —— 唯一需独立适配仓的原生依赖
  # 纯 Python 运行时依赖 docopt / PyYAML 以 vendor 方式随包发布（见 notes.md），
  # 由 tool_requires docopt/0.6.2 + pyyaml/6.0.2 提供来源（ohpcd 制品仓）。
  tool_dependencies:
    - "docopt/0.6.2"
    - "pyyaml/6.0.2"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-defer-gi-runtime-ohos.patch"
  - "0002-cache-optional-keyutils-ohos.patch"

test_results:
  upstream:
    command: "python3 test/test_match.py -v ; python3 test/test_cache.py -v"
    total: 6
    passed: 6
    failed: 0
    skipped: 0
    notes: >-
      test/test_match.py (TestFilterMatcher, 2 例) 与 test/test_cache.py
      (TestPasswordCache, 4 例) 全部通过。test_cache 通过 0002 补丁的进程内
      keyutils 回退（OHOS 无 libkeyutils/内核 keyring）运行成功。
  test_package:
    type: explicit
    total: 40
    passed: 40
    failed: 0
    skipped: 0
    command: "python3 test_udiskie_pkg.py <pkg> <site-packages>"
    notes: "含 OHOS 特有断言（启动器可移植 shebang + 包相对 site-packages 引导 / 四个启动器实际执行 --version / 模块解析位于包内 / 包可重定位 / XDG_CONFIG_HOME 生效）"
  platform_smoke:
    result: pass
    command: "<pkg>/bin/{udiskie,udiskie-mount,udiskie-umount,udiskie-info} --version"
    notes: "W3 L2：四个 CLI 在无 conan runenv 的裸环境下均输出 'udiskie 2.6.2'（0001 补丁惰性化 gi 运行时 + 内嵌 docopt）"

knowledge_gained:
  - "OHOS conan 包不得写入共享解释器 site-packages：setuptools entry point 生成的控制台脚本需重写为 `#!/usr/bin/env python3` + 包相对 site-packages 引导（ref: knowledge/drafts/E429-draft-51D8）"
  - "python-keyutils 在 OHOS 不可用：制品仓与社区镜像仅有 sdist（无 OHOS wheel），且内核 keyring 系统调用（add_key/request_key）被沙箱阻止（ctypes 直调进程被 kill）→ 需以进程内缓存按相同语义回退（ref: knowledge/drafts/E429-draft-51D8）"
  - "pygobject 的 _gi C 扩展在 CI 沙箱无法 dlopen（PyType_Ready: symbol not found）且无任何 typelib；纯 Python 客户端需将 gi 运行时导入惰性化，使 --version/--help 与消费者测试不依赖 gi（ref: knowledge/drafts/E429-draft-51D8）"
