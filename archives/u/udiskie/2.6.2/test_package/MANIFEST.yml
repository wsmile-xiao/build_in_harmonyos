# 上游官方测试声明文件
# CI 脚本（build_and_test.sh L0e）强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: udiskie/2.6.2
homepage: "https://github.com/coldfix/udiskie"

# 上游 CI（.github/workflows/python-package.yml）实际执行：
#   python test/test_match.py
# 仓库内另有 test/test_cache.py（标准库 unittest），上游 CI 已刻意不执行它
# （CHANGES.rst 2.5.7: "remove keyutils from CI workflow"）；本适配两者都执行。
upstream_check_command: "python3 test/test_match.py"
upstream_test_in_build: true
upstream_test_command: "python3 test/test_match.py -v ; python3 test/test_cache.py -v"

# 上游自动化测试（标准库 unittest，无第三方测试框架）
upstream_tests:
  - file: test/test_match.py
    source: udiskie-2.6.2/test/test_match.py
    description: "FilterMatcher/MountOptions/IgnoreDevice 设备匹配用例（unittest.TestCase = TestFilterMatcher，2 个用例：test_ignored / test_options）"
    command: "python3 test/test_match.py -v"
  - file: test/test_cache.py
    source: udiskie-2.6.2/test/test_cache.py
    description: "PasswordCache 用例（unittest.TestCase = TestPasswordCache，4 个用例：test_timeout / test_touch / test_revoke / test_update）；经 0002 补丁的 keyutils 进程内回退在 OHOS 上运行通过"
    command: "python3 test/test_cache.py -v"

# test_package 中自带的消费者视角测试
test_package_tests:
  - file: test_udiskie_pkg.py
    description: "消费已安装包：包布局 + 内嵌依赖、四个启动器（可执行 + OHOS 可移植 shebang + 包相对引导 + 实际执行 --version）、import udiskie 版本、上游 config/matcher 场景复跑、OHOS 打包不变量（模块解析位于包内 / 包可重定位 / XDG_CONFIG_HOME 生效）"
    command: "python3 test_udiskie_pkg.py <pkg> <site-packages>"

# 测试断言总数（test_package/test_udiskie_pkg.py 实际断言，见运行输出 ASSERTIONS 行）
assertion_count: 40
