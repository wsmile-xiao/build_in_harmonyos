# conandata.yml — udiskie 2.6.2
# Upstream: https://github.com/coldfix/udiskie (MIT, 可达)
# 纯 Python 3 应用（PEP 517 / setuptools），源码树无任何 C/C++ 源文件。
#
# sha256 为官方 tag v2.6.2 tarball 实测值：
#   curl -fsSL https://codeload.github.com/coldfix/udiskie/tar.gz/refs/tags/v2.6.2
#   sha256sum -> 9d758efd4e3706ce824e693708cce1e0a840dae9aa5b130e3592d3588da8279c
#   （143991 bytes；codeload 与 github.com/archive 为同一 tarball）
# CI 会将 github.com URL 重写为镜像并预下载为 file://（见 ci/conan/build_and_test.sh）。
sources:
  url: "https://github.com/coldfix/udiskie/archive/refs/tags/v2.6.2.tar.gz"
  sha256: "9d758efd4e3706ce824e693708cce1e0a840dae9aa5b130e3592d3588da8279c"

# OHOS 平台适配补丁（2 个，均为可移植性补丁，不改变上游功能语义）：
#   0001  将 gi(PyGObject) 运行时导入改为惰性 —— 使 `--version` / `--help`
#         在 gi C 扩展无法加载（OHOS 上 `_gi...so` 重定位失败：
#         "PyType_Ready: symbol not found"）或缺 GLib/Gio typelib 时仍可用。
#   0002  将 python-keyutils 变为可选 —— OHOS 无 libkeyutils / 内核 keyring，
#         缺失时以进程内缓存按相同语义（带超时、访问续期）回退，
#         使 udiskie.cache 可导入、上游 test_cache 可运行。
patches:
  - patch_file: "patches/0001-defer-gi-runtime-ohos.patch"
    patch_description: "OHOS 可移植性：gi(PyGObject) 运行时导入惰性化（PEP 562 module __getattr__）——使用户级 CLI 的 --version/--help 不再要求可加载的 gi/GLib/Gio"
    patch_type: "portability"
  - patch_file: "patches/0002-cache-optional-keyutils-ohos.patch"
    patch_description: "OHOS 可移植性：python-keyutils 变为可选，缺失时以进程内键值缓存按相同语义（带超时、访问续期）回退（无 libkeyutils/内核 keyring 的平台）"
    patch_type: "portability"

