# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.32/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.32"

# 软件名
software: "ubench"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.ibiblio.org/pub/Linux/system/benchmark/ubench-0.32.tar.gz"

  # 源码校验和
  sha256: "92277fe3c1bb6bdd08b155193d6ec051ad85b8cb45ec0d5786c791abb7c3cedc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cpubench.c.patch"
  - "0002-membench.c.patch"
  - "0003-ubench.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CLK_TCK 在 OHOS musl 头文件中不存在，替换为 sysconf(_SC_CLK_TCK) (ref: knowledge/drafts/E6418-draft-9D56.kv)"
  - "sys_errlist 在 musl 中不存在，替换为 strerror(errno) (ref: knowledge/drafts/tevent-0.17.1-musl-strerror-sys-errlist-remap.kv)"
  - "ibiblio 对 .tar.gz 回 Content-Encoding: x-gzip，conan get() 算到裸 tar 哈希，urllib 回退保持文件面 sha256 (ref: knowledge/drafts/DRAFT-E690-content-encoding-x-gzip-conan-decode-two-faced-sha256.kv)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /root/tmp/builds/ubench-0.32.orig
  source_work_dir: /root/tmp/builds/ubench-0.32.work
  source_orig_hash: 0e1347614e469a95
  source_work_hash: 7760c9d75a3a86ab
  generated_at: '2026-09-26T00:01:07'
  patches_count: 3

patch_classification:
  - file: 0001-cpubench.c.patch
    type: portability
    platform_only: False
    guard: 'none (portable POSIX replacement)'
  - file: 0002-membench.c.patch
    type: portability
    platform_only: False
    guard: 'none (portable POSIX replacement)'
  - file: 0003-ubench.c.patch
    type: portability
    platform_only: False
    guard: 'none (portable POSIX replacement)'
