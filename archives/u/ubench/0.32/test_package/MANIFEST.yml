# test_package/MANIFEST.yml — ubench 0.32
package: ubench/0.32
homepage: "https://www.ibiblio.org/pub/Linux/system/benchmark/"

upstream_tests_exist: false
upstream_test_audit: >-
  ubench-0.32.tar.gz (sha256 92277fe3c1bb6bdd08b155193d6ec051ad85b8cb45ec0d5786c791abb7c3cedc)
  has 18 members: configure, Makefile, README, ubench.8, ubench.lsm, a prebuilt
  i386 ubench binary, signals.h and 10 C sources (ubench, signals, cpubench,
  membench, diskbench, netbench, utime, tlock, creadok, cwriteok). No test/
  directory, no "check"/"test" Makefile target (targets: ubench, default,
  install, utime, clean), no registered tests or assertions. utime is a
  separate timing helper, not a test. The benchmark prints scores that
  README compares by hand; the consumer suite below checks them automatically.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_ubench.py
    description: "4 CLI cases: bad option (exit 1, banner, usage); -cs single CPU score + 0.4s calibration; -ms single MEM score; -cms AVG == (CPU+MEM)/2"
    command: "python3 test_ubench.py --binary <package>/bin/ubench --ohos"
  - file: test_ubench.py
    description: "[HarmonyOS] artefact: ELF64 AArch64, OHOS NDK note owner 'OHOS', static PIE without PT_INTERP"
    command: "python3 test_ubench.py --binary <package>/bin/ubench --ohos"
  - file: test_ubench.py
    description: "[HarmonyOS] CLK_TCK patch: times()/sysconf(_SC_CLK_TCK) calibration reports 0.1-2.0s and uname machine aarch64"
    command: "python3 test_ubench.py --binary <package>/bin/ubench --ohos"
  - file: test_ubench.py
    description: "[HarmonyOS] sys_errlist patch: RLIMIT_NOFILE=4 -> pipe EMFILE -> OHOS musl strerror 'No file descriptors available' for cpubench and membench"
    command: "python3 test_ubench.py --binary <package>/bin/ubench --ohos"

assertion_count: 27
