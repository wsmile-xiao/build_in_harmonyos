# 软件级 manifest — unixbench
software: unixbench
display: "UnixBench (byte-unixbench)"
description: "BYTE UNIX Benchmarks 基准套件：CPU/算术/进程/管道/系统调用/文件/Shell 性能基准（Perl 驱动 + C 程序，指数归一计分）"
category: utility
homepage: "https://github.com/kdlucas/byte-unixbench"
license: GPL-2.0

build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 零改动：上游 POSIX Makefile 不改动，构建以 make CC=clang 覆盖硬编码 CC=gcc（R33：编译器取 Conan conf）；仅 1 个 portability 补丁（src/arith.c 信号计数器 volatile）"
    - "图形项保持上游默认关闭（GRAPHIC_TESTS）；OHOS 无 X11/x11perf"
    - "预编译发行：包内 bin/unixbench 为完整运行目录（18 个基准程序产物 + Run 驱动 + testdir 数据）"
    - "Run 的 shebang /usr/bin/perl 在 OHOS 不存在，须以 perl Run 调用（Makefile run: 目标不可用）"
    - "OHOS /proc/cpuinfo 字段名（BogoMIPS/Features 大小写、无 model name）导致 Run 识别 0 CPUs，不跑多副本并发轮（平台行为，如实记录）"
    - "uname -o 输出 Toybox、locale/3dinfo/runlevel/who 缺失 → 报告字段为空/降级（非致命）"
    - "dc/gcc/X11 缺失 → dc、C、2D×10、ubgears 共 13 项 SKIP（逐项见版本级 reports/test-report.md）"
  common_dependencies: []

versions:
  "5.1.3-51":
    status: built
    build_date: "2026-09-27"
    conan_ref: "unixbench/5.1.3-51"
