# conandata.yml — unixbench 5.1.3-51
# 上游: byte-unixbench（BYTE UNIX Benchmarks），GitHub 官方 tag v5.1.3
# 源码 URL: codeload.github.com 是 GitHub 官方归档端点（/archive/refs/tags/ 的直达下载域，
#           字节完全一致），仓库内 371 个先例同用此形式（R39 官方源）。
# 版本口径: 平台任务版本为 5.1.3-51（-51 为发行版 pkgrel），上游 tag 为 v5.1.3；
#           配方/目录使用平台版本值，notes.md 记录该口径。
# Makefile 零改动: 上游 POSIX Makefile 不经修改即可用 OHOS SDK clang 构建（GRAPHIC_TESTS
#             上游默认关闭，图形项不在默认构建集内）；仅 1 个 portability 补丁（见下）。

sources:
  url: "https://codeload.github.com/kdlucas/byte-unixbench/tar.gz/refs/tags/v5.1.3"
  # codeload URL 末段是 tag（无扩展名），Conan get() 推断的文件名会退化为 zip 解码
  # （BadZipFile）；显式 filename 保证按 tar.gz 解压（仓库内 codeload 先例同法）。
  filename: "unixbench-5.1.3.tar.gz"
  sha256: "3a6bb00f270a5329682dff20fd2c1ab5332ef046eb54a96a0d7bd371005d31a3"

patches:
  - patch_file: "patches/0001-src-arith.c.patch"
    patch_description: >-
      将 src/arith.c 中由 SIGALRM 处理器读取的全局计数器 `iter` 标记为
      volatile。clang -O2 下该计数器的自增停留在寄存器（纯计算循环内没有
      外部函数调用），信号处理器读到的内存值恒为 0，导致 Run 可选的算术项
      （arithoh/short/int/long/float/double，共 6 项）全部输出 COUNT|0（Run 随即以 "Can't take log of 0" 中止）。volatile
      恢复逐迭代写内存语义（gcc 构建时的上游行为）；真机实测修复前
      COUNT|0 → 修复后 3 秒约 5e8。
    patch_type: "portability"
