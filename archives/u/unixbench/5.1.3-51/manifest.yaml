# 知识沉淀（每条注明记录位置，供 W5 完整性检查）
knowledge_gained:
  - knowledge_ref: "notes.md#编译步骤"
    text: "Makefile 零改动：上游 POSIX Makefile 不改动即可用 OHOS SDK clang 构建（make CC=clang 覆盖硬编码 CC=gcc；R33 编译器取 Conan conf）"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "clang -O2 会把 SIGALRM 处理器读取的全局计数器寄存器化：arith.c 的 iter 在纯计算循环内不落内存，信号处理器恒读到 0 → 算术族（Run 可选 6 项）输出 COUNT|0；补丁 0001 加 volatile 恢复逐迭代写内存（gcc 构建的上游语义）"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "OHOS /proc/cpuinfo 字段名差异（BogoMIPS/Features 大写、无 model name）导致 Run 的 getCpuInfo() 解析到 0 个处理器 → 报告固定 '0 CPUs in system'、不执行 N 副本并发轮"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "Toybox 的 uname -o 输出 'Toybox'（Linux 为 GNU/Linux），Run 报告 System/OS 字段随之变化；uname -i 不受支持（Unknown option）"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "OHOS 无 /usr/bin/perl：Run 的 shebang 失效，须以 perl Run 调用（Makefile 的 run: 目标不可用）"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "locale/3dinfo/runlevel/who/dc 在 Toybox 环境缺失 → 报告字段降级/为空与 Perl 警告（非致命）；dc 项无法运行"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "图形项（2D×10 + ubgears）上游默认关闭（GRAPHIC_TESTS 注释），OHOS 无 X11/x11perf，保持关闭"
  - knowledge_ref: "README.md#使用方法（OHOS）"
    text: "预编译发行模式：包内携带 18 个基准程序产物；复制必须保留时间戳（cp -a），否则 Run 启动的 make check 会用缺省 CC=gcc 触发重建"

