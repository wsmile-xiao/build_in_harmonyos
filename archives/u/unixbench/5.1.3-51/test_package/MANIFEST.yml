# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: unixbench/5.1.3-51
homepage: "https://github.com/kdlucas/byte-unixbench"

# 上游无断言式测试框架：Makefile 的 check 目标只做发行完整性检查与编译（make all）。
# 基准项的“通过”口径 = 每个选中用例产出有效分数（无 err/0 分）且套件退出码为 0
# （口径与逐项证据见 reports/test-report.md）。
upstream_check_command: "make check (发行完整性/编译检查；基准项执行即上游测试面)"

# 构建阶段只编译（make all）；基准项真机执行证据在 reports/，消费者回归在 test_package/。
upstream_test_in_build: false

upstream_tests:
  - file: "Run (driver) + src/ + pgms/"
    source: byte-unixbench-5.1.3/UnixBench
    description: "41 个基准项（系统 19 / 算术 6 / 非索引 5 / 图形 11）；本适配真机实跑 28 项全部有效分数、退出码 0，13 项平台原因 SKIP（逐项见 reports/test-report.md）"
    command: "perl Run -i 1 <test...>"

# 平台原因未运行项（OHOS 缺 X11/dc/gcc，非适配裁剪；上游默认构建即不含图形项）
platform_skipped_tests:
  - names: [C]
    reason: "C Compiler Throughput 使用 Run 内硬编码的 $cCompiler='gcc'；OHOS 无 gcc（SDK 工具链为 clang），无法执行该编译吞吐项"
  - names: [dc]
    reason: "系统缺少 dc（Toybox 未提供 dc 程序；Run 的 dc 项需要 dc 处理 dc.dat）"
  - names: [2d-rects, 2d-lines, 2d-circle, 2d-ellipse, 2d-shapes, 2d-aashapes, 2d-polys, 2d-text, 2d-blit, 2d-window]
    reason: "2D 图形项由 pgms/gfx-x11 驱动 x11perf，需要 X11 显示与 x11perf；OHOS 无 X11"
  - names: [ubgears]
    reason: "3D 图形项需要 X11/GL 头与库（上游 Makefile 默认关闭 GRAPHIC_TESTS，仅显式启用时才构建）；OHOS sysroot 无 X11"

# test_package 中自带的消费者测试（鸿蒙特有 // 消费者视角）
test_package_tests:
  - file: test_unixbench.sh
    description: "包结构与 18 个预编译基准程序；5 项基准真机实跑（退出码 0 + 有效分数 + Index Score，含算术族回归项 arithoh）；OHOS 系统信息采集（HongMeng Kernel / CPUs 行）；未知用例负向对照"
    command: "sh test_unixbench.sh <suite-dir> <work-dir>"

# 测试断言总数 (用于质量评估)
assertion_count: 18
