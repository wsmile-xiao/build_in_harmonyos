# 版本级 manifest
# 文件位置: archives/u/usrsctp/0.9.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.5.0"

# 软件名
software: "usrsctp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag tarball）
  url: "https://github.com/sctplab/usrsctp/archive/refs/tags/0.9.5.0.tar.gz"

  # 源码校验和（与 conandata.yml 一致）
  sha256: "260107caf318650a57a8caa593550e39bca6943e93f970c80d6c17e59d62cd92"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-Dsctp_build_programs=0"
    - "-Dsctp_debug=0"
    - "-Dsctp_werror=0"

  # 编译依赖列表（格式: name/version，本库无第三方运行时依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-add-ohos-compat-header.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E113: OHOS/musl 头文件缺 BSD 类型 (u_int/u_long/u_short/u_char/caddr_t)，经 CMAKE_C_FLAGS=-include ohos_compat.h 注入解决"
  - "musl 的 struct ifreq 完整定义与 timeradd/timercmp 宏受 _GNU_SOURCE 门控，compat 头需在 -std=c99 -pedantic 前启用 _GNU_SOURCE"
  - "CMake >= 4 移除 cmake_minimum_required(VERSION 3.0) 兼容，需设 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "OHOS libc 无 pthread_cancel 符号，usrsctp 可选示例 ekr_client/ekr_loop 无法链接（不影响库产物）"