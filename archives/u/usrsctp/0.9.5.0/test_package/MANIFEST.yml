# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: usrsctp/0.9.5.0
homepage: "https://github.com/sctplab/usrsctp"

# 上游测试命令 (本项目无 ctest/make check 注册; 上游以 cmake programs + fuzzer 为测试资产)
upstream_check_command: "cmake --build build --target test_timer test_libmgmt"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (本地实测, 2026-09-08, 见 notes.md 与 W3 日志)
upstream_tests:
  - file: programs/test_timer.c
    source: usrsctp-0.9.5.0/programs/test_timer.c
    description: "上游定时器单元测试 (test_timer, 实跑退出码 0)"
    command: "./test_timer"
  - file: programs/test_libmgmt.c
    source: usrsctp-0.9.5.0/programs/test_libmgmt.c
    description: "上游库生命周期测试 (test_libmgmt, 实跑退出码 0)"
    command: "./test_libmgmt"

# test_package 中自带的测试 (消费者视角验证, 实质调用 usrsctp API: R34)
test_package_tests:
  - file: test.c
    description: "消费者测试: usrsctp_init/socket/bind/close/finish 实质调用"
    command: "./test_usrsctp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3