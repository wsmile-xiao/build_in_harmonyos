software: umoci
# 版本级 manifest
# 文件位置: archives/u/umoci/0.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.6.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/opencontainers/umoci/archive/refs/tags/v0.6.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | go | custom
  system: go
  build_system: go

  # 配置选项列表
  configure_options: []
  # Go项目无configure步骤，使用 go build 编译

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 编译备注：Go linker 在 HarmonyOS 平台受限（file-backed mmap RWX），使用官方预编译 arm64 二进制
  build_note: "Go linker平台限制：file-backed mmap RWX被拒绝，使用官方预编译二进制替代"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go linker在HarmonyOS上因file-backed mmap RWX限制无法编译，需使用预编译二进制"
  - "所有Go项目在此平台面临相同限制（同skopeo v1.22.2）"
  - "预编译二进制需要ELF签名才能在鸿蒙上执行"