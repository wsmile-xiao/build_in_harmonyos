# test_package/MANIFEST.yml — unalz 0.65
# CI L0e requires this file to exist.

package: unalz/0.65
homepage: "http://www.kipple.pe.kr/win/unalz/"

# unalz has no upstream test suite (2009 plain-Makefile project: no check
# target, no test programs in the tarball)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: >
      9-case/28-assertion suite: no-args version banner, extraction of a
      generated stored ALZ member (byte-equal content), -l listing, -p pipe
      extraction, selective member extraction, missing-input error text,
      added -v/--version/-h/--help switches, EUC-KR→UTF-8 filename
      conversion (musl iconv), corrupt-archive error text. Minimal ALZ
      fixtures are generated at runtime with python3 (no binary archives
      committed).
    command: "bash test.sh"

# Assertion count synced with test.sh ok/bad call sites (28) and the PR body
assertion_count: 28
