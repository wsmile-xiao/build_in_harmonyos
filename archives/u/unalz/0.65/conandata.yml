# conandata.yml — unalz 0.65
#
# 源 URL 说明：官方源站 www.kipple.pe.kr 自 2026-09 实测不可达（HTTPS 无响应、
# HTTP 被 WAF 以 403 拦截、设备侧 DNS 假解析到 198.18.0.0/15 保留网段），
# 故采用 deb.debian.org 的 orig 源码包（Debian 未重打包的 pristine 上游
# tarball，与仓库既有 140+ 处先例一致，见 archives/a/a52dec/0.7.4 等）。
# sha256 由本任务实测：下载后 sha256sum 校验。

sources:
  url: "https://deb.debian.org/debian/pool/main/u/unalz/unalz_0.65.orig.tar.gz"
  sha256: "4c26699eb7545072de2ef7de79b4fff1f01c4db09cebff2d8d50ec03d5d74db0"

patches:
  - patch_file: "patches/0001-UnAlz.cpp.patch"
    patch_description: "Cast get_crc_table() result to const unsigned long* — modern zlib headers (OHOS SDK sysroot) declare the return type as const z_crc_t* (unsigned int) while UnAlz.cpp indexes the table as unsigned long entries, which is what the bundled zlib 1.2.3 implementation actually provides"
    patch_type: "portability"
  - patch_file: "patches/0002-main.cpp.patch"
    patch_description: "Add -v/--version and -h/--help switches so the CLI answers the standard version/help smoke probe (unalz previously only printed its banner when invoked with no arguments, and treated --version as an archive filename)"
    patch_type: "portability"
