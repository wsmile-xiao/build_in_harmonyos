  - "2009 年 CLI 无 --version/--help，仅无参打印横幅；按 aa3d 先例补 -v/--version 与 -h/--help 移植补丁过 L2 冒烟（错误路径上游恒 return 0，断言必须打输出文本而非退出码）" # knowledge_ref: E633
