software: usbutils
display: "usbutils"
description: "USB utilities for Linux including lsusb"
category: system
homepage: "https://github.com/gregkh/usbutils"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "需创建 fake libudev.pc 绕过 udev 依赖检查"
    - "OHOS SDK header 冲突：sys/socket.h 和 linux/socket.h 都定义 sockaddr_storage"
    - "需静态链接以规避 HarmonyOS 共享库加载限制"
  common_dependencies:
    - libusb

versions:
  "017":
    status: partial
    build_date: "2026-04-25"
