# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）

package: unqlite/1.2.1
homepage: https://unqlite.org

upstream_check_command: "上游无断言型测试套件（清点：无 tests/ 目录；CMakeLists 经 add_test 注册 samples/ 演示程序 1..6、unqlite_huge、unqlite_mp3、unqlite_tar、demovfs，但每项均为 API 演示、零断言，不属于独立上游用例）"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_package/test_unqlite.c
    description: "消费者用例：以库使用者身份编译链接已安装包，12 项断言驱动真实引擎行为——KV 引擎 6 项（内存库打开、kv_store 写入、kv_fetch 长度查询、kv_fetch 取回值比对、kv_delete 删除、删除后 fetch 返回 UNQLITE_NOTFOUND）+ Jx9 文档存储 6 项（打开内存库供 Jx9、编译 db_create/db_store/db_fetch_all 脚本、安装输出消费者、执行脚本、过滤回调保留 age>=30 记录、释放 VM）"
    command: "conan create（编译并运行 test_unqlite）"
  - file: test_package/test_unqlite_ohos.c
    description: "HarmonyOS 专项测试：磁盘文件持久化语义，12 项断言——创建文件库、kv_store 写入、commit 落盘、关闭、重开验证长度与值持久化、删除并 commit、重开验证删除已持久化、清理测试文件；验证 pBufLen 的 in|out 语义（先 NULL 查长度再带缓冲取回）"
    command: "conan create（编译并运行 test_unqlite_ohos）"

