software: unyaffs
display: "unyaffs"
description: "Extract files from a YAFFS2 (NAND flash) file system image, GPL-2.0-only"
category: system
homepage: "https://github.com/ehlers/unyaffs"
license: GPL-2.0-only
build_system: custom  # 单 .c + .h，上游 Makefile 只做直编与 clean，conanfile 直驱 clang

ohos_adaptation:
  key_points:
    - "单 .c + .h（unyaffs.c ~21KB），无外部库依赖"
    - "仅 libc：stdio/stdlib/string/errno/fcntl/getopt/limits/ctype/sys/stat/sys/types/unistd"
    - "musl 全支持，无 patch"
    - "上游 Makefile 只有 unyaffs 与 clean 两个目标，build() 直驱 clang 等价且不依赖 make"
    - "编译产出单可执行文件 bin/unyaffs（约 29KB）"
    - "★ 不校验 ECC：只读 yaffs_PackedTags2 的 seq/objectId/chunkId/byteCount 四字段，消费者测试可程序化合成镜像"
  common_dependencies:
    - libc (stdio, stdlib, string, errno, fcntl, getopt, limits, ctype, sys/stat, sys/types, unistd)

versions:
  "0.9.7":
    status: built
    build_date: "2026-09-18"
    source_url: "https://deb.debian.org/debian/pool/main/u/unyaffs/unyaffs_0.9.7.orig.tar.gz"
    source_sha256: "099ee9e51046b83fe8555d7a6284f6fe4fbae96be91404f770443d8129bd8775"
    test_assertions: 54
