# test_package/MANIFEST.yml — unyaffs 0.9.7
package: unyaffs/0.9.7
homepage: "https://github.com/ehlers/unyaffs"

# 上游无独立测试套件：unyaffs 0.9.7 是单 .c + .h 工具（unyaffs.c ~21KB）
# 上游 Makefile 只有 all（unyaffs）/ clean 两个目标，**没有 check 或 test 目标**；
# 源码 tarball 内也不含任何测试源文件或 YAFFS2 测试镜像。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_unyaffs.c
    description: >-
      消费者测试 54 条断言。**夹具在测试进程内程序化合成**（按 unyaffs.h 的
      对象头布局与 yaffs_PackedTags2 标签逐 chunk 拼装 2048+64 布局镜像，
      不依赖任何外部样本）。覆盖：① 版本/用法契约（-V、无参数、-h、位置参数
      过多）；② 选项边界（-c 上限 16K、-s 上限 512、非数字回落用法）；
      ③ 打不开的镜像；④ -t 列表与 -v -t 元数据；⑤ 提取后**逐字节比对**
      （14B 与跨 3 个 chunk 的 5120B）；⑥ **往返属性**：7 种尺寸
      （0/1/2047/2048/2049/4096/10000 字节）合成→提取→逐字节一致，
      覆盖空文件与 chunk 边界；⑦ 多文件列表行数 == 文件数+1；
      ⑧ **安全边界**：对象名含 '/' 时必须被拒绝（Illegal file name）
      且不得写出到目标目录之外；⑨ 损坏输入（0 字节 / 随机字节 / 截断镜像）。
      全程 popen 内存管道直读，scratch 目录由 argv 传入并显式探测可写性。
    command: "test_unyaffs <bin/unyaffs> <scratch-dir>"

# 测试断言总数
assertion_count: 54
