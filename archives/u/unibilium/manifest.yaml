software: unibilium
display: "unibilium"
description: "Very basic terminfo library (read/write ncurses-style terminfo files, no curses dependency)"
category: system
homepage: "https://github.com/neovim/unibilium"
license: MIT
build_system: cmake

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "纯 C 库，无外部依赖（不依赖 curses）"
    - "上游提供 autotools + CMake 双构建系统；CI 无 automake，采用 CMake 构建"
    - "上游 CMakeLists 不安装 pkg-config 文件，配方 package() 补充生成 unibilium.pc"
    - "libtermkey 等下游通过 pkg-config 名 'unibilium' 查找"
  common_dependencies: []

# 版本索引
versions:
  "2.1.2":
    status: built
    build_date: "2026-08-30"