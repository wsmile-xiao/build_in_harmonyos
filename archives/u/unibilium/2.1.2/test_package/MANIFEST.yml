# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: unibilium/2.1.2
homepage: "https://github.com/neovim/unibilium"

# 上游测试命令 (make test 运行 TAP 测试套件，prove 驱动)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "prove -f t/*.t"

# 上游实际运行的测试程序 (t/ 目录下每个 .c 编译为 .t 由 prove 运行)
upstream_tests:
  - file: t/00_load.c
    source: unibilium-2.1.2/t/00_load.c
    description: "load and destroy a dummy terminal"
    command: "./t/00_load.t"
  - file: t/if-then-else.c
    source: unibilium-2.1.2/t/if-then-else.c
    description: "terminfo if/then/else format expression evaluation"
    command: "./t/if-then-else.t"
  - file: t/wide-format.c
    source: unibilium-2.1.2/t/wide-format.c
    description: "wide-character terminfo format strings"
    command: "./t/wide-format.t"
  - file: t/static_screen.c
    source: unibilium-2.1.2/t/static_screen.c
    description: "screen terminfo entry capability assertions (static)"
    command: "./t/static_screen.t"
  - file: t/static_screen-256color.c
    source: unibilium-2.1.2/t/static_screen-256color.c
    description: "screen-256color terminfo entry capability assertions"
    command: "./t/static_screen-256color.t"
  - file: t/static_tmux.c
    source: unibilium-2.1.2/t/static_tmux.c
    description: "tmux terminfo entry capability assertions"
    command: "./t/static_tmux.t"
  - file: t/static_xterm.c
    source: unibilium-2.1.2/t/static_xterm.c
    description: "xterm terminfo entry capability assertions"
    command: "./t/static_xterm.t"
  - file: t/static_xterm-256color.c
    source: unibilium-2.1.2/t/static_xterm-256color.c
    description: "xterm-256color terminfo entry capability assertions"
    command: "./t/static_xterm-256color.t"
  - file: t/new-extended-format-static_screen.c
    source: unibilium-2.1.2/t/new-extended-format-static_screen.c
    description: "extended terminfo format loaded from file (t/fixtures/s/screen)"
    command: "./t/new-extended-format-static_screen.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: unibilium API 生命周期/能力往返/序列化往返/unibi_run 格式求值"
    command: "./test_unibilium"

# 测试断言总数 (上游 3678 + test_package 12)
assertion_count: 3690