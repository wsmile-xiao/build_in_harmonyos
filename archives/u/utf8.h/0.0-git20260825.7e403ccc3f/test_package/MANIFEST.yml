# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）

package: utf8.h/0.0-git20260825.7e403ccc3f
homepage: "https://github.com/sheredom/utf8.h"

# 上游 test/ 是自包含 CMake+CTest 工程（vendored utest.h），配方
# run_upstream_tests 选项驱动，与 CI/真机同路径执行
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中集成了上游测试（run_upstream_tests=True）
upstream_test_in_build: true
upstream_test_command: "cmake --build build && ctest --output-on-failure"

# 上游实际运行的测试程序（8 个 CTest 目标）
upstream_tests:
  - file: test/test.c
    source: test/test.c
    description: "utest 主套件（487 个原子用例，C/C++ 多标准变体）"
    command: "./utf8_test"
  - file: test/no_malloc.c
    source: test/no_malloc.c
    description: "无 malloc 变体（禁用动态分配的 UTF-8 路径）"
    command: "./utf8_no_malloc_test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：utf8len/utf8codepoint/utf8cat/utf8ncmp/utf8valid/utf8dup 真实断言"
    command: "./test_probe"

assertion_count: 9
