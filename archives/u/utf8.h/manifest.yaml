# 软件级 manifest — utf8.h
# 遵循 ARCHIVE-SPEC v3.0

software: utf8.h
display: "utf8.h"
description: "单头文件 UTF-8 字符串库（utf8len/utf8codepoint/utf8cat/utf8valid/utf8dup 等）"
category: text
homepage: "https://github.com/sheredom/utf8.h"
license: Unlicense

build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only 单头文件库：package() 仅安装 include/utf8.h + licenses/，package_type=header-library 且 package_id 清空"
    - "上游 test/ 是自包含 CMake+CTest 工程（vendored utest.h，487 原子用例 / 8 个 CTest 目标，含 ASan/UBSan/TSan 变体），经 run_upstream_tests 选项在 build() 内以 cmake.test() 执行，CI 与真机同路径"
    - "test/CMakeLists.txt 声明 cmake_minimum_required(VERSION 3.15)，generate() 注入 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 CMake 4.x"
    - "utf8len 返回码点数而非字节数（实现按码点递增），消费者断言以真机实测值为准"
  common_dependencies: []

versions:
  "0.0-git20260825.7e403ccc3f":
    status: built
    build_date: 2026-09-09
