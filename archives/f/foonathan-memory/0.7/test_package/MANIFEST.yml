# test_package/MANIFEST.yml — foonathan-memory 0.7
package: foonathan-memory/0.7
homepage: "https://github.com/foonathan/memory"

# 上游官方测试：test/CMakeLists.txt 使用 Catch2 v2 单头文件并注册一个 CTest。
upstream_check_command: "cmake -S . -B build -DFOONATHAN_MEMORY_BUILD_EXAMPLES=OFF -DFOONATHAN_MEMORY_BUILD_TESTS=ON -DFOONATHAN_MEMORY_BUILD_TOOLS=ON && cmake --build build --parallel 1 && ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

# 上游测试程序由下列 19 个测试源文件链接为 foonathan_memory_test。
upstream_tests:
  - file: test/test.cpp
    source: foonathan-memory-0.7/test/test.cpp
    description: "Catch2 测试入口"
    command: "./foonathan_memory_test"
  - file: test/detail/align.cpp
    source: foonathan-memory-0.7/test/detail/align.cpp
    description: "对齐工具测试"
    command: "./foonathan_memory_test [detail][core]"
  - file: test/detail/debug_helpers.cpp
    source: foonathan-memory-0.7/test/detail/debug_helpers.cpp
    description: "调试填充工具测试"
    command: "./foonathan_memory_test [detail][core]"
  - file: test/detail/free_list.cpp
    source: foonathan-memory-0.7/test/detail/free_list.cpp
    description: "空闲链表测试"
    command: "./foonathan_memory_test [detail][pool]"
  - file: test/detail/free_list_array.cpp
    source: foonathan-memory-0.7/test/detail/free_list_array.cpp
    description: "数组空闲链表测试"
    command: "./foonathan_memory_test [detail][pool]"
  - file: test/detail/ilog2.cpp
    source: foonathan-memory-0.7/test/detail/ilog2.cpp
    description: "整数对数工具测试"
    command: "./foonathan_memory_test [detail][core]"
  - file: test/detail/memory_stack.cpp
    source: foonathan-memory-0.7/test/detail/memory_stack.cpp
    description: "固定内存栈测试"
    command: "./foonathan_memory_test [detail][stack]"
  - file: test/aligned_allocator.cpp
    source: foonathan-memory-0.7/test/aligned_allocator.cpp
    description: "对齐分配器测试"
    command: "./foonathan_memory_test [adapter]"
  - file: test/allocator_traits.cpp
    source: foonathan-memory-0.7/test/allocator_traits.cpp
    description: "分配器 traits 测试"
    command: "./foonathan_memory_test [core]"
  - file: test/default_allocator.cpp
    source: foonathan-memory-0.7/test/default_allocator.cpp
    description: "默认分配器测试"
    command: "./foonathan_memory_test [default_allocator]"
  - file: test/fallback_allocator.cpp
    source: foonathan-memory-0.7/test/fallback_allocator.cpp
    description: "回退分配器测试"
