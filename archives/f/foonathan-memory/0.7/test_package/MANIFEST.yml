  - file: test/joint_allocator.cpp
    source: foonathan-memory-0.7/test/joint_allocator.cpp
    description: "联合分配器测试"
    command: "./foonathan_memory_test [allocator]"
  - file: test/memory_arena.cpp
    source: foonathan-memory-0.7/test/memory_arena.cpp
    description: "内存 arena 测试"
