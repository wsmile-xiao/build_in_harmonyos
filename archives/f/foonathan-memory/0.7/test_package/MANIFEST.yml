test_package_tests:
  - file: test.cpp
    description: "消费者测试：默认分配器最大对齐与 memory_pool/STL 适配器"
    command: "./test_foonathan_memory"

# CTest: 39 test cases, 140870 assertions, all passed on OHOS/aarch64.
assertion_count: 140870
