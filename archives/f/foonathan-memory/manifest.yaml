software: foonathan-memory
display: "foonathan/memory"
description: "STL-compatible C++ memory allocator library"
category: foundation
homepage: "https://github.com/foonathan/memory"
license: Zlib
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 原生平台判断需同时识别 HarmonyOS/OpenHarmony，避免 CMake 将 OHOS 视为未知平台。"
    - "OHOS 上 malloc/operator new 对小块内存可能仅满足 8 字节对齐，底层分配器使用 posix_memalign 保证 max_align_t 对齐。"
    - "构建工具 nodesize_dbg 用于生成 container_node_sizes_impl.hpp，随库包安装。"
  common_dependencies: []

versions:
  "0.7":
    status: built
    build_date: "2026-08-28"
    conan_ref: "foonathan-memory/0.7"
