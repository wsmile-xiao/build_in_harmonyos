# test_package/MANIFEST.yml — future 0.52
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: future/0.52
homepage: "https://metacpan.org/pod/Future"

# 上游测试命令：上游为 Module::Build（Build.PL），但 Module::Build 在 OHOS
# 不可得（设备 perl / hnp perl 均无 Module/Build.pm，制品仓亦无 perl-module-build），
# 故配方由 ExtUtils::MakeMaker 生成等价 Makefile.PL，上游测试经 make test 运行。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试套件（2026-09-18 本机实测）：
# - t/ 目录：56 个 .t 测试文件
# - 实测结果：**Files=56, Tests=778, Result: PASS**（含 24 个 skip 文件）
#   跳过项均为可选依赖缺失，非失败，分为三类：
#     · 22 个 `*-xs.t` 变体 —— `skipped: No Future::XS`（本发行版为纯 Perl，
#       不含 XS 实现；含 52awaitable-future-xs.t）
#     · 52awaitable-future-pp.t —— `skipped: No Test::Future::AsyncAwait::Awaitable`
#     · 99pod.t —— `skipped: Test::Pod 1.00 required for testing POD`
upstream_tests:
  - file: t/
    source: Future-0.52/t/*.t
    description: "上游 perl 测试套件（56 文件 778 用例；实测 Result: PASS，24 个 skip 文件均为可选依赖缺失——22 个 -xs 变体需 Future::XS、52awaitable-future-pp.t 需 Awaitable、99pod.t 需 Test::Pod，零失败）"
    command: "make test"

# test_package 消费者测试（R34 真实 API：加载打包的 Future/Future::Utils/
# Future::Mutex/Future::Exception 并真实调用 done/then/fail/wait_all/needs_all/
# call/fmap_void/repeat/Mutex->enter，共 16 项断言）
test_package_tests:
  - file: test_future.pl
    description: "消费者测试：真实调用 Future API（done/get/then/fail/wait_all/needs_all/Future::Utils::call/fmap_void/repeat/Future::Mutex）"
    command: "perl -I<site> test_future.pl"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 16
