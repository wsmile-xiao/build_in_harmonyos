# 版本级 manifest — future 0.52
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "0.52"

# 软件名
software: future

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（CPAN 官方发行，R39 合规）
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Future-0.52.tar.gz"

  # 源码校验和（sha256，经 metacpan + www.cpan.org 双向校验一致）
  sha256: "96765561271ee3285be3641c043a8bb262d341a564355352d37ed9512e6ea1eb"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "Future-0.52"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  note: |
    META.json prereqs.runtime.requires 全部为 perl 核心模块
    （Carp>=1.25 / List::Util>=1.29 / Test::Builder::Module /
    Time::HiRes / perl>=5.014），OHOS 预装 perl 已内建，无外部
    CPAN 依赖、无 Conan 依赖。
    configure.requires Module::Build>=0.4004 在 OHOS 不可得
    （设备 perl 5.42.2 与 /data/service/hnp/bin/perl 5.42.0 均无
    Module/Build.pm；制品仓 conan search perl-module-build/* 为 0 个）
    → 配方以 ExtUtils::MakeMaker（perl 核心）生成等价 Makefile.PL 替代。
    test.requires Test2::V0>=0.000148 由 OHOS perl 自带
    （实测 v1.302210），故上游测试可真实运行。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Perl 模块无二进制产物，沿用
    perl-uri 5.35 / perl-io-multiplex 1.16 先例；不产生 bindirs，
    故无需 commands.json，R38 不适用）。
    构建：perl Makefile.PL INSTALLDIRS=site → make → make test →
    make install DESTDIR=<staging>；package() 按登台树原样拷入
    package_folder，并以遍历定位 Future.pm（安装前缀随 perl 构建
    而异：/data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0）。
    package_info() 以 runenv_info 注入 PERL5LIB，下游 perl 脚本可直接
    use Future；无 C/C++ 库可链接（cpp_info.libs=[]，R26 不适用）。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    纯 Perl（lib/Future.pm + Future/{PP,Utils,Mutex,Exception}.pm +
    Test/Future.pm + Test/Future/Deferred.pm），无 XS、无 C/C++ 编译、
    无平台相关代码，aarch64-ohos 与上游行为一致。
    新增 Makefile.PL 仅为构建脚本补充（等价转写上游 Build.PL 的
    module_name/requires/test_requires），不改动上游源码，无需补丁。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 778
  failed: 0
  note: |
    上游测试（R51，2026-09-18 本机实测）：t/ 目录 56 个 .t 文件，
    `make test` 实测 **Files=56, Tests=778, Result: PASS**，零失败。
    24 个文件跳过，均为可选变体非失败：22 个 -xs 变体（需 Future::XS，
    本发行版不含 XS 实现）、52awaitable-future-pp.t（需
    Test::Future::AsyncAwait::Awaitable）、99pod.t（需 Test::Pod 1.00）。
    上游测试已集成进 build()（upstream_test_in_build: true）。
    适配后：test_package 消费者测试（R34 真实 API）16/16 = 100%。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CPAN 发行版以 Module::Build（Build.PL）为构建系统时，若 Module::Build 在 OHOS 不可得且制品仓无 perl-module-build，可用 perl 核心 ExtUtils::MakeMaker 生成等价 Makefile.PL 替代（逐项转写 Build.PL 的 module_name/requires/test_requires），上游 t/ 测试仍可经 make test 真实运行——先例：perl-parallel-pipes 0.201（上游 Module::Build::Tiny 同样缺失）(ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "纯 Perl 模块适配：package_type=python-require + make install DESTDIR=staging + 遍历定位 .pm（安装前缀随 perl 构建而异）+ runenv_info 注入 PERL5LIB；无 bindirs 故无需 commands.json（R38 仅约束含可执行文件的包）(ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "判定 ohpcd 制品是否存在必须用 conan search <pkg>/* -r=ohpcd（返回 Found 0 pkg/version recipes）；conan download 对不存在/未发布的包报误导性的 system acceleration policy not enabled，与网络故障不可区分 (ref: DRAFT-perl-module-build-makemaker-substitution)"

references:
  - https://metacpan.org/pod/Future
  - https://metacpan.org/dist/Future
