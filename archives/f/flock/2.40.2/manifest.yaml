software: flock
build_system: autotools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.40.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.40.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/util-linux/util-linux/archive/refs/tags/v2.40.2.tar.gz"

  # 源码校验和
  sha256: "8e5f5de12d1b02d44e2511e5f2c6c36236a5331b1cd915c2f7e8868bac677ace"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--disable-liblastlog2"
    - "--disable-libmount"
    - "--disable-libblkid"
    - "--disable-libfdisk"
    - "--disable-libsmartcols"
    - "--disable-libuuid"
    - "--disable-python"
    - "--disable-asciidoc"
    - "--disable-manpages"

  # 编译方式: selective (只编译 flock 子命令)
  build_method: selective

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "flock 是 util-linux 的子命令，需要指定整个 util-linux 源码 URL"
  - "util-linux 全量 make 在 OpenHarmony 上失败（wall 缺少 utmpx API）"
  - "使用 `make flock` 选择性编译可以只构建需要的子命令"
  - "DESTDIR 模式下 verify-build 需要 --install-prefix=$TEST_PREFIX/$DEFAULT_PREFIX"
  - "verify-build 要求 manifest.yaml 有顶层 build_system 字段"
  - "config.log 是生成文件，不应作为补丁追踪"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/cache/builds/flock-2.40.2.orig
  source_work_dir: /data/storage/el2/base/cache/builds/flock-2.40.2.work
  source_orig_hash: ec8b780e50860b06
  source_work_hash: 8162e4fa0618a063
  generated_at: '2026-06-09T11:19:57'
  patches_count: 0
  note: "config.log is a generated file, not a source file. No patches needed for flock."
