# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fasttext/0.9.2
homepage: "https://github.com/facebookresearch/fastText"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# fastText 0.9.2 无 ctest 注册目标（CMakeLists 无 add_test），
# Makefile 无 check 目标；上游测试入口是 Python unittest 体系：
#   python3 runtests.py -u（83 个单元用例）/ -i --data-dir（13 个集成用例）
upstream_check_command: "python3 runtests.py -u"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: python/fasttext_module/fasttext/tests/test_script.py
    source: fasttext-0.9.2/python/fasttext_module/fasttext/tests/test_script.py
    description: "上游单元测试（gen_unit_tests 83 个用例，numpy 1.26.4 下 83/83 通过）"
    command: "python3 runtests.py -u"
  - file: python/fasttext_module/fasttext/tests/test_configurations.py
    source: fasttext-0.9.2/python/fasttext_module/fasttext/tests/test_configurations.py
    description: "上游集成测试配置（13 个用例：cooking 2/2 通过，其余 11 个因外部数据集不可下载未运行）"
    command: "python3 runtests.py -i --data-dir <dir>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 fasttext::FastText train/predictLine 公开 API 训练微型监督模型并预测"
    command: "./test_fasttext"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 85
