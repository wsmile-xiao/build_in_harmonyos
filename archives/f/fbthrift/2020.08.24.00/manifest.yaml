software: fbthrift
# 版本级 manifest
# 文件位置: archives/f/fbthrift/2020.08.24.00/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2020.08.24.00"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-13"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/facebook/fbthrift/archive/refs/tags/v2020.08.24.00.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=OHOS"
    - "-DBUILD_TESTS=OFF"
    - "-Dcompiler_only=ON"
  dependencies:
    - "openssl/1.1.1w"
    - "boost/1.87.0"
    - "flex/2.6.4"
    - "bison/3.8.2"
    - "gflags/2.2.2"
    - "glog/0.7.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-thrift-compiler-generate-CMakeLists.txt.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "fbthrift 编译仅需 thrift compiler (compiler_only=ON)，完整库需更多依赖 (ref: E077)"
  - "cmake 4.1.2 已移除 FindBoost 模块，需手动指定 Boost 路径 (ref: E050)"
  - "fbthrift CMakeLists.txt 需手动添加 Boost include 和 library 路径"
