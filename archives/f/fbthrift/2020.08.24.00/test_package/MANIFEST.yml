# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fbthrift/2020.08.24.00
homepage: https://github.com/facebook/fbthrift

# 上游测试命令
upstream_check_command: "thrift1 --gen mstch_cpp2 -o out smoke.thrift"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false

# fbthrift 2020 upstream has no automated test suite for the compiler alone;
# the compiler is exercised by generating code from Thrift IDL files
# (upstream CI compiles thrift files with thrift1 the same way).
upstream_tests: []

# 新增/鸿蒙特有测试
added_tests:
  - name: "functional-test-thrift1"
    source: test_package/test.sh
    description: "thrift1 将 test.thrift 编译为 C++2 源码并校验产物 — 功能性冒烟测试（thrift1 2020 无 --version 参数）"
