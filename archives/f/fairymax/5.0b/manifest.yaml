software: fairymax
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.0b/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.0b"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/f/fairymax/fairymax_5.0b.orig.tar.gz"

  # 源码校验和
  sha256: "3e36ba168aa10179225f8dd6953d1c39c4cd4526572765b2e9c77717efe3e52f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang CFLAGS='-fPIC -O2'"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "plain Makefile 项目无 configure 脚本时，直接使用 make CC=clang CFLAGS='-fPIC -O2' 编译，跳过 configure 步骤"
    - "makefile 类项目 configure_options 中 CFLAGS 含空格时，G0 clean-verify 的 Python subprocess 会词分割导致 make 参数解析错误（-O2 被误解为 --output-sync），需将 configure_options 写为单字符串避免此问题"
    - "fairymax 上游 Makefile 默认 CFLAGS='-O2 -s' 含 -s strip 选项，编译时必须覆盖为 '-fPIC -O2' 由 packaging 管线统一 strip"
    - "maxqi 二进制的版本号显示为 4.8 (G) 而非 5.0b，这是上游代码行为（maxqi.c 有独立版本定义），非编译问题"
