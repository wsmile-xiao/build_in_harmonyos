# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fixed_point_arith/0.0-git9b5da0fa97
homepage: "https://github.com/jcarrano/fixed_point_arith"

# 上游无测试套件：源码仅 src/*.c + include/*.h，Makefile 无 check/test 目标
# （目标仅 library/proofs/docs/clean/unicodize；proofs 为 Frama-C 形式化验证，
#   依赖 frama-c + Z3，非可执行单元测试，不计入上游用例）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无独立测试入口）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开 API f_add/f_neg/f_mul/f_to_df/df_to_f、v_add/v_sub、q_conj/q_rot 验证固定点/向量/四元数计算的数值闭环"
    command: "./test_fixed_point_arith"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
