# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fast_zlib/0.0-git6141d21116
homepage: "https://github.com/gildor2/fast_zlib"

# 上游测试命令 (test.sh 会先 build.sh 生成 obj/bin/test-*-linux 再跑压缩测试)
upstream_check_command: "bash test.sh --c --memory"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: Test/test.cpp
    source: fast_zlib-0.0-git6141d21116/Test/test.cpp
    description: "上游压缩基准/验证程序（构建为 obj/bin/test-C-linux，对数据目录做 level 0-9 压缩与往返验证）"
    command: "./obj/bin/test-C-linux <data-dir> --compact --memory"

# test_package 中自带的测试 (消费者视角验证, 实质调用 zlib 兼容公开 API)
test_package_tests:
  - file: test.c
    description: "消费者验证: compress2/uncompress 往返压缩解压, 校验数据一致性与压缩率 (R34)"
    command: "./test_fast_zlib"
  - file: ohos_specific_test.c
    description: "HarmonyOS 专项测试 (R02 新增): 快速匹配实现符号 fast_lm_copyright 链接核验 + compress2/uncompress + 流式 deflate/inflate (Z_FINISH) 1MB 往返, 验证 OHOS aarch64 未对齐访问快速路径"
    command: "./ohos_specific_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6