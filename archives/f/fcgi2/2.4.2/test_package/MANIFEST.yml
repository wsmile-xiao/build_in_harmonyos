# test_package/MANIFEST.yml — fcgi2 2.4.2
# CI L0e requires this file to exist.

package: fcgi2/2.4.2
homepage: "https://github.com/FastCGI-Archives/fcgi2"

# fcgi2 2.4.2 ships no automated upstream test suite: the tarball has no
# tests/ harness (examples/ are standalone sample programs, perl/ is an
# auxiliary binding), Makefile.am registers no TESTS/check_PROGRAMS.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Compiles a FastCGI consumer program against the installed libfcgi headers/library and runs it in CGI fallback mode, asserting the FCGI_Accept loop serves one request ('fcgi-ok')"
    command: "bash test.sh"

# link + runtime request assertion
assertion_count: 2
