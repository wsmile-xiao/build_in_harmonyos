# test_package/MANIFEST.yml — fcgi2 2.4.7
# 上游官方测试声明文件 (CI L0e 强制要求存在)

package: fcgi2/2.4.7
homepage: "https://github.com/FastCGI-Archives/fcgi2"

# 上游测试命令分析:
#   - tarball 无 tests/ 目录
#   - Makefile.am 无 TESTS/check_PROGRAMS 目标 (make check 空转)
#   - 无 CTest/Meson 注册
#   - examples/ 为独立示例程序 (noinst_PROGRAMS, 非测试)
#   - perl/t/ 2 例为 perl 辅助绑定测试, 不参与 C/C++ 构建
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无: 上游无独立测试用例, N_static=0)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 调用公开 API)
test_package_tests:
  - file: test.c
    description: "消费者测试: 用 clang 链接 libfcgi, CGI 回退模式运行 FCGI_Accept 循环, 断言 fcgi-ok 输出"
    command: "test.sh"

# 测试断言总数 (消费者测试: fcgi-ok 标记 + 退出码 0)
assertion_count: 2
