# test_package/MANIFEST.yml — fleur 0.3 上游测试声明
package: fleur/0.3
homepage: "https://github.com/hashlookup/fleur"

# 上游测试命令（CMake 项目，TARGET_GROUP=test 构建两个 Unity 套件）
upstream_check_command: "cmake -GNinja -DTARGET_GROUP=test . && ninja -v"

# conanfile.py build() 中未集成上游测试（production 目标不含 test/external(Unity)）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（Unity 框架，8 个独立 RUN_TEST 用例）
upstream_tests:
  - file: test/suite_1/test_vectors.c
    source: fleur-0.3/test/suite_1/test_vectors.c
    description: "FNV 哈希向量测试（1 个用例 test_fnv）"
    command: "./test/suite_1/suite_1_app"
  - file: test/suite_2/test_fleur.c
    source: fleur-0.3/test/suite_2/test_fleur.c
    description: "Bloom Filter 头/读写/初始化/指纹/查询/序列化/join 测试（7 个用例）"
    command: "./test/suite_2/suite_2_app"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：fleur_initialize/add/check/destroy 真实调用"
    command: "./test_fleur"

# 测试断言总数（上游 8 用例 + test_package 5 断言 + 鸿蒙专项 12 项检查）
assertion_count: 25