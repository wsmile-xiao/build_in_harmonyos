# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: flatcv/0.3.0
homepage: "https://flatcv.ad-si.com/"

# 上游测试命令
upstream_check_command: "make test-units"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test.c
    source: flatcv-0.3.0/tests/test.c
    description: "单元测试：Otsu阈值、透视变换、Foerstner角点、二值形态学、修剪、直方图、边界、角点排序、EXIF方向、变换"
    command: "./test_bin"
  - file: tests/apply_test.c
    source: flatcv-0.3.0/tests/apply_test.c
    description: "矩阵测试：平移矩阵、翻转矩阵、缩放矩阵"
    command: "./apply_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "Conan 消费者测试：验证头文件和库链接"
    command: "./test_flatcv"

# 测试断言总数 (近似值, 用于质量评估)
# 上游测试通过数：17 个测试项（14 个单元测试 + 3 个矩阵测试）
assertion_count: 17
