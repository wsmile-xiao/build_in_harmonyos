# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  build_system: makefile
  configure_options:
    - "make -f Makefile.gnu"
  dependencies: []
  cc: clang
  cxx: clang++
  cflags:
    - "-fPIC"
    - "-O2"
    - "-fexceptions"
    - "-fvisibility=hidden"
    - "-DOPJ_STATIC"
    - "-DNO_LCMS"
    - "-DDISABLE_PERF_MEASUREMENT"
    - "-D__ANSI__"
    - "-DPNG_ARM_NEON_OPT=0"

# ============================================================
