software: ffmpeg-full
version: "8.1.1"
status: published
build_date: "2026-05-27"

source:
  url: "https://ffmpeg.org/releases/ffmpeg-8.1.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--cc=clang"
    - "--cxx=clang++"
    - "--host-cc=clang"
    - "--enable-cross-compile"
    - "--arch=aarch64"
    - "--target-os=linux"
    - "--enable-shared"
    - "--enable-gpl"
    - "--enable-version3"
    - "--enable-nonfree"
    - "--enable-libfreetype"
    - "--enable-libharfbuzz"
    - "--enable-libfribidi"
    - "--enable-libopus"
    - "--enable-libvorbis"
    - "--enable-libopenjpeg"
    - "--enable-libmp3lame"
    - "--enable-libsoxr"
    - "--enable-openssl"
  dependencies:
    - "freetype/2.14.3"
    - "fribidi/1.0.16"
    - "harfbuzz/14.2.0"
    - "opus/1.5.2"
    - "libvorbis/1.3.7"
    - "openjpeg/2.5.3"
    - "lame/3.100"
    - "soxr/0.1.3"
    - "openssl/3.5.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-add-harmonyos-os-detection.patch"

knowledge_gained:
  - "ffmpeg使用自定义configure系统（非autotools），需在configure中添加harmonyos OS识别块以启用section_data_rel_ro和linux_perf"
  - "ffmpeg-full启用大量编解码库依赖，需预先安装freetype/harfbuzz/fribidi/opus/vorbis/openjpeg/lame/soxr/openssl"
  - "ffmpeg configure需设置--target-os=linux使平台识别生效"
  - "libtheora编码器在aarch64共享库构建中存在oc_mcenc_*未定义符号问题（NEON汇编函数缺失），需禁用--enable-libtheora避免运行时链接错误"
  - "--extra-ldflags='-Wl,--allow-shlib-undefined'会掩盖共享库链接错误，不应使用"