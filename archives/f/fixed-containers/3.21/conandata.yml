# conandata.yml — fixed-containers 3.21
# 上游官方源：github.com/teslamotors/fixed-containers（无 release tag，取 main 分支）
# sha256 为官方 main 分支源码包实际哈希。
# patches: OHOS libc++（libcxx-ohos）未提供部分 C++20 ranges 算法/组件与 string_view 的 operator<=>，
# 替换为语义等价的标准 std:: 实现；并修复库头文件对 <cstdint> 缺失包含等问题。
# 测试文件补丁仅为 OHOS 平台缺失 std::make_unique_for_overwrite / <source_location> 的最小等价替换。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/teslamotors/fixed-containers/archive/refs/heads/main.tar.gz"
    - "https://github.com/teslamotors/fixed-containers/archive/refs/heads/main.tar.gz"
  sha256: "2ab4cbd3397423502f3878bed38debfb2060cfb8a34a83d76115f2c8f13c53ce"

patches:
  - patch_file: "patches/0001-include-fixed_containers-algorithm.hpp.patch"
    description: "lexicographical_compare_three_way 默认比较器改为 <=> 可用则用之、否则回退 < / ==（OHOS libc++ string_view 无 operator<=>）"
  - patch_file: "patches/0002-include-fixed_containers-fixed_deque.hpp.patch"
    description: "std::ranges::equal -> std::equal (fixed_deque)"
  - patch_file: "patches/0003-include-fixed_containers-fixed_list.hpp.patch"
    description: "std::ranges::equal -> std::equal (fixed_list)"
  - patch_file: "patches/0004-include-fixed_containers-fixed_map.hpp.patch"
    description: "std::ranges::equal -> std::equal (fixed_map)"
  - patch_file: "patches/0005-include-fixed_containers-fixed_map_adapter.hpp.patch"
    description: "std::ranges::all_of -> std::all_of (fixed_map_adapter)"
  - patch_file: "patches/0006-include-fixed_containers-fixed_set.hpp.patch"
    description: "std::ranges::equal -> std::equal (fixed_set)"
  - patch_file: "patches/0007-include-fixed_containers-fixed_set_adapter.hpp.patch"
    description: "std::ranges::all_of -> std::all_of (fixed_set_adapter)"
  - patch_file: "patches/0008-include-fixed_containers-fixed_string.hpp.patch"
    description: "operator<=> 改用 string_view::compare() <=> 0（OHOS libc++ 的 string_view 无 spaceship 运算符）"
  - patch_file: "patches/0009-include-fixed_containers-fixed_vector.hpp.patch"
    description: "std::ranges::equal -> std::equal (fixed_vector)"
  - patch_file: "patches/0010-include-fixed_containers-recursive_reflection.hpp.patch"
    description: "std::ranges::empty/construct_at/destroy_at -> std:: 等价实现 (recursive_reflection)"
  - patch_file: "patches/0011-include-fixed_containers-source_location.hpp.patch"
    description: "source_location.hpp 补充 #include <cstdint>（std::uint_least32_t 依赖，OHOS libc++ 不传递包含）"
  - patch_file: "patches/0012-include-fixed_containers-variadic_templates.hpp.patch"
    description: "variadic_templates.hpp 补充 #include <concepts>（std::invocable 依赖，OHOS libc++ 的 <utility> 不传递包含）"
  - patch_file: "patches/0013-test-in_out_test.cpp.patch"
    description: "std::make_unique_for_overwrite<int> -> std::make_unique<int>（OHOS libc++ 未实现，语义等价）"
  - patch_file: "patches/0014-test-macro_countermeasures_test.cpp.patch"
    description: "<source_location> 加 __has_include 守卫（OHOS libc++ 无该头，库自带兼容层）"
  - patch_file: "patches/0015-test-out_test.cpp.patch"
    description: "std::make_unique_for_overwrite<int> -> std::make_unique<int>（OHOS libc++ 未实现，语义等价）"