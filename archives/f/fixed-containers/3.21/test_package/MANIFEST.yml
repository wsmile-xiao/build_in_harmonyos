# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fixed-containers/3.21
homepage: "https://github.com/teslamotors/fixed-containers"

# 上游为 CMake + GTest 项目：ctest -N 枚举（见 test/ 目录 *_test.cpp）
upstream_check_command: "ctest -N"

# conanfile.py build() 中未集成上游测试（上游测试在适配验证阶段单独构建运行，R51）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（CMake 注册的 GTest 可执行目标，56 个）
upstream_tests:
  - file: test/fixed_vector_test.cpp
    source: fixed-containers-main/test/fixed_vector_test.cpp
    description: "FixedVector 单元测试"
    command: "./fixed_vector_test"
  - file: test/fixed_string_test.cpp
    source: fixed-containers-main/test/fixed_string_test.cpp
    description: "FixedString 单元测试"
    command: "./fixed_string_test"
  - file: test/fixed_map_test.cpp
    source: fixed-containers-main/test/fixed_map_test.cpp
    description: "FixedMap 单元测试"
    command: "./fixed_map_test"

# test_package 中自带的测试 (消费者视角验证，C++20 消费公开 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：通过公开头文件使用 fixed_vector/fixed_string 并断言结果"
    command: "./test_fixed-containers"

# 测试断言总数 (近似值, 用于质量评估；上游 GTest 断言数以实际运行台账为准)
assertion_count: 8