# test_ohos/MANIFEST.yml — fixed-containers 3.21 HarmonyOS PC 专项验证声明

package: fixed-containers/3.21
purpose: "HarmonyOS PC 平台专项验证：ELF/musl/签名段/路径泄漏 + 无堆分配核心保证（库核心卖点）"

checks:
  - id: T1
    name: "aarch64 ELF 验证"
    command: "readelf -h <exe>"
  - id: T2
    name: "musl libc（无 glibc/ld-linux）"
    command: "readelf -d <exe>"
  - id: T3
    name: ".codesign 段存在"
    command: "readelf -S <exe>"
  - id: T4
    name: "无宿主绝对路径泄漏"
    command: "strings <exe>"
  - id: T5
    name: "真实功能验证（FixedVector/FixedString 公开 API 插入/读取/溢出断言）+ 无堆分配断言"
    command: "<exe>"

run_command: "python3 run_ohos_test.py <conan_package_folder>"