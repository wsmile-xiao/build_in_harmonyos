# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fontopia/2.0
homepage: "https://www.gnu.org/software/fontopia/"

# 上游没有 check/test 目标：tarball 仅 AUTHORS/COPYING/ChangeLog/INSTALL/
# Makefile.am/NEWS/README/READMEkeys/THANKS/aclocal.m4/build-aux 辅助脚本/
# configure(.ac)/info/man/src，无 tests 目录与测试源。
upstream_check_command: ""

# 上游无测试套件，因此 build() 中没有可集成的上游测试
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34：实质驱动被测二进制）
test_package_tests:
  - file: test.sh
    description: "驱动已安装的 fontopia --version，断言输出含版本号 2.0"
    command: "sh test.sh"
  - file: test.sh
    description: "驱动 fontopia --help，断言退出码 0 且输出含 'Fontopia for GNU/Linux, Version' 横幅与 Usage 段"
    command: "sh test.sh"

# 测试断言总数（test.sh 中的 check/断言数）
assertion_count: 4
