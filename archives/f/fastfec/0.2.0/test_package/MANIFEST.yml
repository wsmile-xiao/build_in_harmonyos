# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fastfec/0.2.0
homepage: "https://github.com/washingtonpost/FastFEC"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游使用 zig build test 运行测试
upstream_check_command: "zig build test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (来自 build.zig tests 数组)
upstream_tests:
  - file: buffer_test.c
    source: fastfec-0.2.0/src/buffer_test.c
    description: "Buffer 数据结构单元测试 (6 tests)"
    command: "./buffer_test"
  - file: csv_test.c
    source: fastfec-0.2.0/src/csv_test.c
    description: "CSV 写入器单元测试 (3 tests)"
    command: "./csv_test"
  - file: writer_test.c
    source: fastfec-0.2.0/src/writer_test.c
    description: "Writer 单元测试 (4 tests)"
    command: "./writer_test"
  - file: cli_test.c
    source: fastfec-0.2.0/src/cli_test.c
    description: "CLI 参数解析单元测试 (8 tests)"
    command: "./cli_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_runner.sh
    description: "执行 fastfec CLI 可执行文件, 断言退出码 + 输出内容 (usage 文本/FEC URL)"
    command: "sh test_runner.sh (4 场景: 无参数/-x -p 有 id/不同 id/缺 id, 共 11 条断言)"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 21 (buffer 6 + csv 3 + writer 4 + cli 8) + test_package 11
assertion_count: 32
