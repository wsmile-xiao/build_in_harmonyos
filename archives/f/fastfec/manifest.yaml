# 软件级 manifest
# 文件位置: archives/f/fastfec/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: fastfec

# 显示名
display: "FastFEC"

# 一句话描述
description: "快速 FEC filing 解析器，将 FEC 电子归档文件转换为 CSV 格式"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

# 官网 URL
homepage: "https://github.com/washingtonpost/FastFEC"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "上游使用 Zig 构建，可改用 clang 直接编译纯 C 源码"
    - "PCRE vendored，编译需 -DHAVE_CONFIG_H"
    - "newCliContext() 需初始化所有指针成员为 NULL 防止 SIGSEGV"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.2.0":
    status: published
    build_date: 2026-08-31
