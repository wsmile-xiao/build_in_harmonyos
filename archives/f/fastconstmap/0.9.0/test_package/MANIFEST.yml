# Upstream pytest inventory for fastconstmap 0.9.0.
package: fastconstmap/0.9.0
homepage: "https://github.com/lemire/fastconstmap"

# Source-tree discovery command; the actual execution is in test_package.
upstream_check_command: "python3 -m pytest tests -q"
upstream_test_in_build: false
upstream_test_command: "python3 test_fastconstmap.py <packaged-tests>"

upstream_tests:
  - file: tests/test_constmap.py
    source: fastconstmap-0.9.0/tests/test_constmap.py
    description: "ConstMap/VerifiedConstMap API, serialization and batched lookup tests"
    command: "python3 -m pytest tests/test_constmap.py -q"
    test_functions: 44
    total: 44
    passed: 44
    failed: 0
    skipped: 0
    not_run: 0
    status: passed
  - file: tests/test_shared_memory.py
    source: fastconstmap-0.9.0/tests/test_shared_memory.py
    description: "Zero-copy buffer and multiprocessing shared-memory tests"
    command: "python3 -m pytest tests/test_shared_memory.py -q"
    test_functions: 12
    total: 12
    passed: 12
    failed: 0
    skipped: 0
    not_run: 0
    status: passed

# The two consumer assertions are separate from the 56 upstream functions.
test_package_tests:
  - file: test_fastconstmap.py
    description: "Consumer import and basic ConstMap string/bytes lookup"
    command: "python3 test_fastconstmap.py <packaged-tests>"
    total: 2
    passed: 2
    failed: 0
    skipped: 0
    not_run: 0

assertion_count: 2
validation_log: "$HOME/tmp/fastconstmap-0.9.0-conan-create.log"
test_tool:
  name: pytest
  version: "8.3.5"
  source: "https://pypi.org/project/pytest/8.3.5/"
  installation: "pinned universal wheels downloaded to disposable test-only target"
# Upstream total: 56 = 44 + 12; PASS 56, FAIL 0, SKIP 0, NOT_RUN 0.
# pytest is a CI test tool, not a fastconstmap runtime dependency; test() bootstraps
# its pinned wheel set privately, invokes it with the Conan Python interpreter,
# and passes an explicit writable --basetemp for HMDFS ownership semantics.
