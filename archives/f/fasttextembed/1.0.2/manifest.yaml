# 版本级 manifest — fasttextembed 1.0.2
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.0.2"

# 软件名
software: fasttextembed

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag archive，codeload.github.com 官方 tarball）
  url: "https://codeload.github.com/cemsina/fasttextembed/tar.gz/refs/tags/v1.0.2"

  # 源码校验和（实测官方 tarball SHA-256）
  sha256: "3605de5decdb389ec64083368524b582aad2c9606cb43a576c0f299789417541"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DFTE_DISABLE_NATIVE_CPU=ON"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无第三方依赖：仅 C 标准库 + libm

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-add-native-cpu-flag-option.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 CMake 自动启用 -mcpu=native/-march=native（host-CPU 标志），跨平台交叉编译需通过 option 关闭，保证可复现构建"
  - "上游模型权重由 Git-LFS 托管（66MB），官方源码 tarball 仅含 LFS 指针；e2e 测试在缺少模型时按上游设计输出 SKIP"
