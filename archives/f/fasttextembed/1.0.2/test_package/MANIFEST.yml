# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: fasttextembed/1.0.2
homepage: "https://github.com/cemsina/fasttextembed"

# 上游测试命令（CTest 注册，见 CMakeLists.txt enable_testing）
upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（CMake add_test 注册 3 项）
upstream_tests:
  - file: tests/test_kernels.c
    source: fasttextembed-1.0.2/tests/test_kernels.c
    description: "Kernel 单元测试（arena/layernorm/GELU/matmul，纯计算无外部文件依赖）"
    command: "./test_kernels"
  - file: tests/test_tokenizer.c
    source: fasttextembed-1.0.2/tests/test_tokenizer.c
    description: "Tokenizer 单元测试（vocab.tsv + tests/data/golden_tokens.txt 黄金对拍）"
    command: "./test_tokenizer"
  - file: tests/test_e2e.c
    source: fasttextembed-1.0.2/tests/test_e2e.c
    description: "端到端嵌入对拍（需 66MB Git-LFS 模型 model.fte；tarball 不含时按上游设计输出 SKIP）"
    command: "./test_e2e"

# test_package 自带消费者测试（真实闭环：包内 vocab.tsv + 合成 .fte 模型，
# 真实调用 fte_init/fte_embed/fte_embed_batch 并验证 384 维可观测输出）
test_package_tests:
  - file: test_package/test.c
    description: "消费者用例：公开 API 链接/调用/错误契约/FTE_DIM=384 + fte_init→fte_embed→fte_embed_batch 端到端（L2 归一化输出验证）"
    command: "./test_fasttextembed"

# 测试断言总数（近似值，用于质量评估；含真实业务调用闭环断言）
assertion_count: 24