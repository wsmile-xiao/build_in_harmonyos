# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: faster-utf8-validator/cf482014d0
homepage: "https://github.com/zwegner/faster-utf8-validator"

# 上游测试命令分析：仓库无 autotools/meson/ctest；测试源为 test.lua（LuaJIT ffi + AVX2/SSE4 .so）
upstream_check_command: "luajit test.lua"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（46 项独立声明用例已移植入 test_upstream_port.c，见 reports/upstream-test-ledger.md）
upstream_tests:
  - file: test.lua
    source: faster-utf8-validator-cf482014d0/test.lua
    description: "上游测试源（需 LuaJIT + x86 AVX2/SSE4 .so，aarch64 不可直接运行；46 项用例已移植并全量通过）"
    command: "luajit test.lua"

# test_package 中自带的测试 (消费者视角验证：真实调用 z_validate_utf8 公开 API 并断言结果)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 z_validate_utf8 验证 6 个合法输入 + 6 个非法输入（共 12 断言）"
    command: "./test_faster-utf8-validator"

# 测试断言总数（上游移植 46 项用例 + 鸿蒙专项 22 项 + test_package 12 项）
assertion_count: 80