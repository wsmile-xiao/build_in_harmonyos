# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fifo_map/1.0.1
homepage: "https://github.com/nlohmann/fifo_map"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/unit.cpp
    source: fifo_map-1.0.1/test/unit.cpp
    description: "doctest 单元测试：10 个独立 TEST_CASE（types/element access/iterators/capacity/modifiers/lookup/observers/non-member functions/regression tests/constructors）"
    command: "./unit"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅通过公开头文件 <fifo_map.hpp> 与公开 API 使用，验证 FIFO 插入顺序与 at/size 可观察结果"
    command: "./test_fifo_map"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1306