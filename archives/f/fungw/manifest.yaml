software: fungw
display: "fungw — language-agnostic function gateway"
description: "Tiny, portable C89 library that manages dynamic function calls across different programming languages"
category: library
homepage: "http://www.repo.hu/projects/fungw"
license: LGPL-2.1-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "scconfig 构建（项目内嵌 configure → 生成 Makefile → make / make install），非 autotools"
    - "scconfig 自举用默认 cc，OHOS 只有 clang：CC 由 tools.build:compiler_executables 注入"
    - "HMDFS 卷建不出 symlink/hardlink：genht_std.a 预复制、SONAME 别名在 package() 内复制"
    - "上游共享库漏链 src_3rd/genht，用 make LDFLAGS 把 genht 目标文件并入 .so（否则消费者撞 --no-allow-shlib-undefined）"
    - "上游 install 漏装 genht 头文件，package() 补 include/genht/（fungw.h 依赖 <genht/htsp.h>）"
    - "--disable-perl：scconfig 按系统探测语言绑定，OHOS 无可链 libperl"
    - "上游 regression/ 有 5 个测试程序（INSTALL 声称无测试），配方 build() 内逐一执行"
  common_dependencies: []

versions:
  "1.2.2":
    status: built
    build_date: "2026-09-27"
    source_url: "http://www.repo.hu/projects/fungw/releases/fungw-1.2.2.tar.bz2"
