# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fungw/1.2.2
homepage: "http://www.repo.hu/projects/fungw"

# 上游测试命令：上游无 make check 目标，测试程序在 regression/ 下由顶层 make 构建
upstream_check_command: "make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cd regression && ./test < /dev/null && ./test_c < /dev/null && ./test_custom < /dev/null && ./multicall | diff -u multicall.ref - && SCRIPT=../doc/example/00_hello/hello.fawk ./test_script"

# 上游实际运行的测试程序（regression/ 下 5 个可执行文件）
upstream_tests:
  - file: test.c
    source: fungw-1.2.2/regression/test.c
    description: "核心 API 交互测试：初始化上下文、创建对象、按行从 stdin 读函数调用并执行（fgw_func_lookup + 直接调用 + fgw_arg_conv）"
    command: "./test < /dev/null"
  - file: test_c.c
    source: fungw-1.2.2/regression/test_c.c
    description: "C 绑定测试：注册 string 引擎后，分别用直接 C 调用、fgw_scall 字符串调用、fgw_vcall 类型化调用执行 atoi，并校验返回值与上下文转储"
    command: "./test_c < /dev/null"
  - file: test_custom.c
    source: fungw-1.2.2/regression/test_custom.c
    description: "自定义类型转换测试：str <-> mm <-> double 的 proper/lazy 两条转换路径，校验自定义类型注册与实参转换结果"
    command: "./test_custom"
  - file: multicall.c
    source: fungw-1.2.2/regression/multicall.c
    description: "多重调用测试：同一函数被 fgw_scall_all / fgw_vcall_all / fgw_call_all 三种路径重复调用，校验首次调用的实参转换不污染后续调用；输出与 multicall.ref 逐字比对"
    command: "./multicall | diff -u multicall.ref -"
  - file: test_script.c
    source: fungw-1.2.2/regression/test_script.c
    description: "脚本引擎测试：通过内嵌 fawk 引擎加载并运行 ../doc/example/00_hello/hello.fawk，校验宿主函数调用脚本、脚本回调宿主与脚本内数值转换"
    command: "SCRIPT=../doc/example/00_hello/hello.fawk ./test_script"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者程序：fgw_init → fgw_obj_reg → fgw_func_reg（注册 C 函数 add）→ fgw_func_lookup → fgw_vcall_in 类型化调用 → fgw_scall 字符串化调用 → fgw_arg_conv/fgw_arg_free 类型转换 → fgw_dump_ctx → fgw_uninit/fgw_atexit，共 9 条断言"
    command: "./test_fungw"

# 测试断言总数 (上游 5 个测试程序 + 消费者 9 条断言)
assertion_count: 14
