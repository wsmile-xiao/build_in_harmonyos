# 版本级 manifest — fungw 1.2.2
# 文件位置: archives/f/fungw/1.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-version.yaml

version: "1.2.2"

software: "fungw"

# 编译状态: published | built | failed | archived
# conan create 已在本地 OHOS 真机跑通（含上游 regression + test_package），
# 待 CI 转绿后由流水线置为 published。
status: built

build_date: "2026-09-27"
build_system: "custom"

source:
  url: "http://www.repo.hu/projects/fungw/releases/fungw-1.2.2.tar.bz2"
  sha256: "334b36291ca233a81ba15bf3b704eb6555cf2eeb5b3276b048a0b92b5d36d7d5"
  tar_format: "tar.bz2"

build:
  system: custom
  configure_options:
    - "--disable-perl"
    - "sh ./configure --prefix=<package_folder>；CC 由 tools.build:compiler_executables 注入（scconfig 自举需要 cc，OHOS 只有 clang）"
    - "make LDFLAGS=\"-rdynamic -fPIC <src_3rd/genht/*.o>\"（把 genht 目标文件链进共享库）"
    - "说明：OHOS 无 libperl，--disable-perl 避免链到不存在的库；无 --enable-shared/--disable-shared（scconfig 不提供）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "scconfig 自举：项目内嵌的 configure 只有 51 字节（cd scconfig && make && ./configure \"$@\"），用默认 cc 编译 hooks.c；OHOS 只有 clang，必须显式 CC=<clang>（ref: knowledge/drafts/DRAFT-fungw-1.2.2-scconfig-ohos-build.md）"
  - "HMDFS 卷 os.symlink EACCES / os.link EPERM：genht 的 genht_std.a（ln -s）与 scconfig 的 SONAME 别名（sccbox ln -f 硬链接）都建不出来，前者让 make 直接 Error 2，后者静默失败只留下 .so.X.Y.Z；对策分别是预复制 libgenht.a、package() 内复制别名（ref: knowledge/drafts/DRAFT-fungw-1.2.2-scconfig-ohos-build.md）"
  - "上游共享库不自洽：libfungw*.so 的链接规则不含 src_3rd/genht，留下 strhash/htsp_init/htsp_get 等未定义符号，任何消费者链接都会撞 ld.lld --no-allow-shlib-undefined；用 make LDFLAGS 把 genht 目标文件链进去解决（ref: knowledge/drafts/DRAFT-fungw-1.2.2-scconfig-ohos-build.md）"
  - "上游 install 漏装 genht 头文件，而 libfungw/fungw.h 直接 #include <genht/htsp.h>；包内必须补 include/genht/*.h，否则消费者编译期即失败（ref: knowledge/drafts/DRAFT-fungw-1.2.2-scconfig-ohos-build.md）"
  - "scconfig 无 --with/--without，脚本语言绑定全靠系统探测；探测到 /data/service/hnp/bin/perl 会开 perl 绑定，须用 --disable-perl（hook: libfungwbind/scconfig_hooks.h CUSTOM_ARG）（ref: knowledge/drafts/DRAFT-fungw-1.2.2-scconfig-ohos-build.md）"
  - "上游 INSTALL 声称无自动化测试，实际 regression/ 有 5 个测试程序（test / test_c / test_custom / multicall / test_script），multicall 带 golden 文件 multicall.ref；build() 内逐个执行并 diff 参考输出（ref: knowledge/drafts/DRAFT-fungw-1.2.2-scconfig-ohos-build.md）"

homepage: "http://www.repo.hu/projects/fungw/"
license: "LGPL-2.1-or-later"

tests:
  upstream:
    command: "cd regression && ./test ./test_c ./test_custom ./multicall && SCRIPT=../doc/example/00_hello/hello.fawk ./test_script"
    cases: 5
    passed: 5
    note: "上游无 make check 目标；regression/ 下 5 个程序由顶层 make 构建，配方 build() 内逐一执行，multicall 输出与 multicall.ref 逐字比对"
  adapted:
    command: "test_package/test_fungw"
    cases: 9
    passed: 9
    pass_rate: "9/9 (100%)"
