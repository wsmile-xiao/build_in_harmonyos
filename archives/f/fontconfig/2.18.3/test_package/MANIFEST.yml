# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fontconfig/2.18.3
homepage: "https://www.freedesktop.org/wiki/Software/fontconfig/"

# 上游测试命令 — meson test（fontconfig 的 test/ 套件）
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序（本地实测回填）：
# - **meson test（上游 test/ 套件）**：build() 已集成——本地实测受 freetype
#   未发布制品仓阻塞（meson setup 的 freetype2 依赖检测——本地无 .pc——如实
#   记录——CI 的 freetype/2.14.3 已发布后 meson test 全量实测回填通过率）
upstream_tests:
  - file: test/
    source: fontconfig-2.18.3/test/
    description: "meson test（上游 test/ 套件——17 个测试）——**实测（2026-08-18，本地 conan create）**：Ok 15 / Fail 2（15/17——88.2%）——2 个失败为 **test_fontations_ft_query.py + test_genconf.py（外部测试字体需网络下载——RuntimeError: No external test fonts available——fetch-testfonts.py 正确运行（--target-dir）后 GitHub 的 roboto-flex 下载成功（本地联网确认）——但另 5 个外部字体的源 commondatastorage.googleapis.com 在本地网络不可达（curl 连接超时/HTTP 000——特定域名阻断——如实记录）**"
    command: "meson test -C <builddir> --no-rebuild"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_fontconfig.py
    description: "消费者测试（L0c）：fc-match 存在性 + 可执行检查（SELinux 域限制——OHOS 上执行 fc-match 报 Operation not permitted——改为存在性验证）"
    command: "python3 test_fontconfig.py <bin-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 1
