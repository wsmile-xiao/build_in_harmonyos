version: '2.18.3.2'
status: built
software: fontconfig
build_date: '2026-10-03'
build_system: meson

source:
  url: 'https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.18.3/fontconfig-2.18.3.tar.xz'
  sha256: '4f7b554a38cdf78c033f666c8871f3749e14a094f65a07f630c91ed0b43d35e3'
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - '-Dxml-backend=expat'
    - '-Ddoc=disabled'
    - '-Dnls=disabled'
    - '-Dtests=enabled'
    - '-Dtools=enabled'
    - '-Dcache-build=disabled'
  dependencies:
    - 'freetype/2.14.3'
    - 'expat/2.8.2.1'
  cc: clang

patches_applied: []

knowledge_gained:
  - '2.18.3 配方缺 _sign_shared_libs()：meson install 重写 rpath 使链接器自签失效 → OHOS dlopen Permission denied；重出修订须补回重签'
  - '2.18.3 声明 libxml2 却未设 xml-backend：meson 自动探测到系统 expat，DT_NEEDED 写入 expat 绝对路径 → 产物不可重定位；须显式 -Dxml-backend=expat + expat/2.8.2.1'
  - '2.18.3 build() 硬编码 os.environ[AR]/PATH（R33 违规）；应以 compiler_executables 推导并注入 conan_meson_native.ini'
