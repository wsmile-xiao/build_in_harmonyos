version: 1
test_package: fontconfig/2.18.3.3
upstream:
  framework: meson
  entrypoint: meson test -v (test-only fixture targets are built)
  testing_enabled: true
  status: PASS
tests:
  - name: config_and_font_matching
    source: test.c
    assertion_count: 3
    assertions:
      - explicitly loaded package XML is valid
      - actual font enumeration is nonempty
      - matched font file can be opened
  - name: invalid_and_missing_config
    source: test.c
    assertion_count: 2
    assertions:
      - malformed XML is rejected
      - absent explicit XML is rejected
