sources:
  url: "https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.18.3/fontconfig-2.18.3.tar.xz"
  sha256: "4f7b554a38cdf78c033f666c8871f3749e14a094f65a07f630c91ed0b43d35e3"
patches:
  "2.18.3.3":
    - patch_file: "patches/0001-test-test-bz106632.c.patch"
      patch_description: "Use TMPDIR for the cache regression and fail on setup failure"
      patch_type: "portability"
    - patch_file: "patches/0002-test-test-issue107.c.patch"
      patch_description: "Use bounded TMPDIR templates for the sysroot regression"
      patch_type: "portability"
    - patch_file: "patches/0003-test-test-mt-fccfg.c.patch"
      patch_description: "Verify configuration reinitialization by sentinel state, not a freed address"
      patch_type: "portability"
    - patch_file: "patches/0004-test-test_sandbox.py.patch"
      patch_description: "Enable explicit directory-view cache tests without claiming kernel sandbox isolation"
      patch_type: "portability"
    - patch_file: "patches/0005-test-fctest-__init__.py.patch"
      patch_description: "Provide a task-private directory-view fixture retaining the upstream cache assertions"
      patch_type: "portability"
