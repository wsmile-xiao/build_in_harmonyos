knowledge_gained:
  - "fft-c (FFTPACK 封装) 上游 fft_backward 在 FFT_SCALED_OUTPUT 下把 rfftb 的非归一逆结果再乘 n，导致 forward+backward 往返放大 n 倍——rfftb(rfftf(x))==n*x 是 FFTPACK 非归一约定，反向不应再缩放；实测 impulse 往返 y[0]=1024（n×1），补丁删除缩放后往返误差 <1e-14"
  - "FFTPACK 移植类库的 rfftf 输出排布不可想当然：fft-c 实测为 out[0]=R0(DC)、out[N-1]=R_{N/2}(Nyquist)、1<=k<=N/2-1 时 out[2k-1]=R_k、out[2k]=I_k（与 netlib 标准 [R0, R_{N/2}, R1,I1,…] 排布不同），消费方按 out[2k]/out[2k+1] 取 bin 会得到错位谱线"