# 软件级 manifest 模板
# 文件位置: archives/f/flactag/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: flactag

# 软件描述（简短）
description: "FLAC audio file tagging application with MusicBrainz integration"

# 软件分类
# audio | video | network | system | development | library | tool | other
category: audio

# 官方网站/源码仓库
homepage: "https://sourceforge.net/projects/flactag/"

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "2.0.4"
    status: published
    build_date: "2026-06-16"
    archive_path: "2.0.4/"
    package_file: "packaging/flactag-2.0.4-ohos-aarch64.tar.gz"
    notes: "Platform adaptation required (config.guess/config.sub patches)"

# ============================================================
# 软件元数据
# ============================================================

# License（SPDX 格式）
license: GPL-2.0-or-later

# 主要编程语言
language: C++

# 维护状态
# active | maintained | unmaintained | deprecated
maintenance_status: unmaintained

# 最后上游更新日期（如已知）
last_upstream_update: "2012-06-19"

# ============================================================
# 依赖概览
# ============================================================

# 典型依赖（跨版本通用）
common_dependencies:
  - "libdiscid"
  - "neon"
  - "flac"
  - "slang"
  - "libmusicbrainz5"
  - "unac"

# ============================================================
# 平台适配概览
# ============================================================

# 已适配平台
platforms_adapted:
  - "aarch64-unknown-linux-ohos"

# 通用补丁类型
patch_types:
  - "config.guess"
  - "config.sub"

# ============================================================
# 备注
# ============================================================

notes: |
  flactag 是一个用于编辑 FLAC 音频文件标签的工具，支持从 MusicBrainz 数据库获取元数据。

  版本 2.0.4 是最后发布的版本（2012年），软件已停止维护。

  在 HarmonyOS 平台编译需要：
  1. 更新 config.guess/config.sub 支持平台识别
  2. 安装依赖库：libdiscid, neon, flac, slang, libmusicbrainz5, unac
  3. 手动处理 HMDFS 临时文件限制