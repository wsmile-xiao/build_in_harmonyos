  - "0002-ffmpegthumbnailer.h.patch"
  - "0003-ffmpegthumbnailer-moviedecoder.cpp.patch"
  - "0004-compat-KIO-thumbcreator.h.patch"
  - "0005-compat-KIO-thumbnailresult.h.patch"
  - "0006-compat-ffmpeg_compat.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "KIOGui 不可用时，需创建 compat/KIO/compat shim 提供 ThumbnailCreator/ThumbnailResult 接口"
  - "FFmpeg 4.x (AVCODEC 58) 与 6.x (AVCODEC 60) API 差异需用条件编译处理：AV_FRAME_FLAG_KEY、AV_FRAME_FLAG_INTERLACED、nb_coded_side_data"
  - "FFmpeg 预编译静态库无 -fPIC，需将 KIO 插件改为 STATIC 构建"
  - "KDE cmake 项目在 OpenHarmony 上需要 CMAKE_SYSTEM_NAME 设为 Generic 或创建 Platform/HarmonyOS"

