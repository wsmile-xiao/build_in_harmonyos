  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ffmpeg/4.4.6"
    - "qt6/6.11.1"
    - "kf6/6.14.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
