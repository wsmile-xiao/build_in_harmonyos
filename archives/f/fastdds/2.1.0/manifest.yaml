version: "2.1.0"
status: built
build_date: "2026-06-29"
conan_ref: "fastdds/2.1.0@ohpcd/stable"

source:
  url: "https://github.com/eProsima/Fast-DDS/archive/refs/tags/v2.1.0.tar.gz"
  sha256: "6653772d5cbb0b188bb585d50e557ce5e587faaad4b607120694212bc726bb26"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DTHIRDPARTY=ON"
    - "-DTHIRDPARTY_UPDATE=OFF"
    - "-DTHIRDPARTY_TinyXML2=OFF"
    - "-DCMAKE_PREFIX_PATH=/storage/Users/currentUser/builds/fastdds-deps"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - fast-cdr/1.0.16
    - asio/1.18.0 (header-only)
    - tinyxml2/8.0.0
    - foonathan-memory/0.6-2
  cc: clang
  cxx: clang++

patches_applied:
  - "foonathan_memory: 手工编写 container_node_sizes_impl.hpp 替换 node_size_debugger 工具生成的常量（OHOS 无此工具）"
  - "tinyxml2: 用 -fPIC 重新编译（原预编译库缺少 -fPIC，无法链接到共享库）"
  - "foonathan_memory: 用 -fPIC 重新编译（同上）"
  - "TinyXML2Config.cmake: 使用绝对路径替代相对路径，修复 make 路径解析问题"
  - "config.h: 从 config.h.in 手动生成（CMake install 未自动生成）"

knowledge_gained:
  - "CMake 不识别 HarmonyOS 平台，出现 'System is unknown to cmake' 警告，不阻塞"
  - "v2.1.0 使用旧名称 fastrtps，生成的库为 libfastrtps.a（静态）"
  - "foonathan_memory 的 container_node_sizes_impl.hpp 在 OHOS/aarch64 上无 node_size_debugger 工具，需手写常量"
  - "foonathan_memory 的 container.hpp 从命名空间内部 include container_node_sizes_impl.hpp，不能再嵌套 namespace"
  - "map_node_size / unordered_map_node_size 在 foonathan_memory API 中接受单模板参数（value_type），不是 Key+Value 双参数"
  - "Fast-DDS 包装器对 set_node_size 传入 std::pair<size_t, value_type> 以避免 MSVC 对齐问题"
  - "OHOS 上所有静态库依赖必须用 -fPIC 编译，否则链接到 .so 时 R_AARCH64_ADD_ABS_LO12_NC 重定位失败"
  - "THIRDPARTY=ON + THIRDPARTY_UPDATE=OFF 可跳过 git submodule update，使用预装依赖"
  - "THIRDPARTY_TinyXML2=OFF 强制使用预编译 tinyxml2 而非从源码编译"
  - "make -j 在 OHOS 上 jobserver fifo 创建失败，用 make -j1 规避"
  - "Fast-CDR v1.0.16 编译需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "fast-discovery-server 工具链接失败（foonathan_memory 符号缺失），但核心库 libfastrtps.a 编译成功"
  - "冒烟测试通过：DomainParticipant 可正常创建和销毁"
