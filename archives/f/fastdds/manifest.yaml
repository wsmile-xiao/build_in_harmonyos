software: fastdds
display: "Fast DDS"
description: "The most complete OSS DDS implementation for embedded systems"
category: network
homepage: "https://www.eprosima.com/index.php/products-all/eprosima-fast-dds"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 不识别 HarmonyOS 平台，出现 'System is unknown to cmake' 警告，不阻塞"
    - "依赖 Fast-CDR、asio、tinyxml2、foonathan_memory，需预编译安装到统一 prefix"
    - "v2.1.0 使用旧名称 fastrtps，库文件名为 libfastrtps.a（静态构建）"
    - "需要 C++14 支持"
    - "所有静态库依赖必须用 -fPIC 编译，否则 aarch64 重定位失败"
    - "foonathan_memory 的 container_node_sizes_impl.hpp 需手写（OHOS 无 node_size_debugger 工具）"
    - "THIRDPARTY=ON + THIRDPARTY_UPDATE=OFF 跳过 git submodule update"
    - "make -j 在 OHOS 上 jobserver fifo 创建失败，使用 make -j1"
  common_dependencies:
    - fast-cdr
    - asio
    - tinyxml2
    - foonathan-memory

versions:
  "2.1.0":
    status: built
    build_date: "2026-06-29"
    conan_ref: "fastdds/2.1.0"
