# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fancyargumentparser/1.0.4
homepage: "https://github.com/simfeo/FancyArgumentParser"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -S tests -B build && cmake --build build && ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_argparse.cpp
    source: fancyargumentparser-1.0.4/tests/test_argparse.cpp
    description: "上游主测试套件（79 个 RUN 用例，单头文件解析器 API/类型/校验覆盖）"
    command: "./test_argparse"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实调用 argparse API（命名/位置/类型化参数解析与检索）"
    command: "./test_fancyargumentparser"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 79