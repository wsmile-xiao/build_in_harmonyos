# 版本级 manifest — fixed-point-fundamentals 1.0.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.0"
software: "fixed-point-fundamentals"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag tarball）
  url: "https://github.com/SpeyTech/fixed-point-fundamentals/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和
  sha256: "5db7f6533dda80f95aed47aabe3caffc634bcceff8dab868acb13f564de6ac52"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（纯 Makefile 项目，无 configure）
  configure_options: []
  # make 参数覆盖: CC=<Conan Toolchain cc>, CFLAGS 去掉 -Werror
  # （clang 将 unused static inline / 隐式 int→float 截断告警升级为错误，5/17 示例受影响）

  # 编译依赖列表（无第三方依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码补丁，构建期仅覆盖 CC/CFLAGS）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 Makefile 硬编码 CC=gcc：OHOS/CI 环境无 gcc，配方须注入 Conan Toolchain 的 CC（R33）"
  - "上游 CFLAGS 含 -Werror，clang 下 unused static inline 函数、int/int64→float/double 隐式转换会升级为错误（5/17 示例构建失败），移除 -Werror 即可全量构建"
  - "教学示例类仓库（无头文件/无库产物、纯 Makefile）按 application 型打包并声明 commands.json（R38）"
# 无源码补丁（patches/ 为空，patches_applied: []）；构建期仅覆盖 CC/CFLAGS。
