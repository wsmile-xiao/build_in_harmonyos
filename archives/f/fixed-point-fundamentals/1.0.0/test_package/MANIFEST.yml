# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: fixed-point-fundamentals/1.0.0
homepage: "https://github.com/SpeyTech/fixed-point-fundamentals"

# 上游测试命令（本库为纯 Makefile 教学项目，make test 会扫描 lessons/<lesson>/src/tests，
# 该路径全仓库不存在，实例化 0 个用例；完整枚举台账见 reports/knowledge-candidate-ledger.md 与
# worktree 内 .test-enum-ledger.md，17 个示例程序为可运行入口，已全部编译并逐一运行验证）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无独立测试框架；17 个示例程序为可运行入口）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者冒烟测试：运行安装到 bin/ 的示例程序 q16_16_basics 与 format_selector，校验退出码 0 且输出非空"
    command: "./test.sh"
  - file: ohos_test.sh
    description: "OHOS 专项测试：重复运行 4 个示例程序校验输出 SHA256 逐位一致（bit-identical 确定性），并断言 Q16.16 关键换算数值与格式清单"
    command: "./ohos_test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12