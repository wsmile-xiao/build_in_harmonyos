# test_package/MANIFEST.yml — fast_float 6.1.6

package: fast_float/6.1.6
homepage: "https://github.com/fastfloat/fast_float"

# 上游测试命令
upstream_check_command: "cmake -DFASTFLOAT_TEST=ON -B build && cmake --build build && ctest --test-dir build"

# conanfile.py build() 中是否已集成上游测试
# 未集成：conanfile.py FASTFLOAT_TEST=OFF，因 tests/CMakeLists.txt FetchContent
# doctest/supplemental_test_files clone GitHub 在 CI 禁网络；test_package 已含
# 消费者测试 + HarmonyOS 专项测试覆盖。upstream_check_command 仅供手动复现参考，不自动执行。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (默认启用组 10 个 + 补充随机 2 个，本机实测)
upstream_tests:
  - file: tests/example_test.cpp
    source: fast_float-6.1.6/tests/example_test.cpp
    description: "示例使用测试"
    command: "./example_test"
  - file: tests/example_comma_test.cpp
    source: fast_float-6.1.6/tests/example_comma_test.cpp
    description: "逗号格式解析测试"
    command: "./example_comma_test"
  - file: tests/rcppfastfloat_test.cpp
    source: fast_float-6.1.6/tests/rcppfastfloat_test.cpp
    description: "Rcpp fast_float 兼容性测试"
    command: "./rcppfastfloat_test"
  - file: tests/basictest.cpp
    source: fast_float-6.1.6/tests/basictest.cpp
    description: "基础功能测试（doctest 20 test cases / 6859 assertions）"
    command: "./basictest"
  - file: tests/long_test.cpp
    source: fast_float-6.1.6/tests/long_test.cpp
    description: "长字符串解析测试"
    command: "./long_test"
  - file: tests/powersoffive_hardround.cpp
    source: fast_float-6.1.6/tests/powersoffive_hardround.cpp
    description: "5 的幂次舍入测试"
    command: "./powersoffive_hardround"
  - file: tests/string_test.cpp
    source: fast_float-6.1.6/tests/string_test.cpp
    description: "字符串解析测试"
    command: "./string_test"
  - file: tests/fast_int.cpp
    source: fast_float-6.1.6/tests/fast_int.cpp
    description: "整数解析测试"
    command: "./fast_int"
  - file: tests/json_fmt.cpp
    source: fast_float-6.1.6/tests/json_fmt.cpp
    description: "JSON 格式解析测试"
    command: "./json_fmt"
  - file: tests/fortran.cpp
    source: fast_float-6.1.6/tests/fortran.cpp
    description: "Fortran 格式解析测试"
    command: "./fortran"
  - file: tests/short_random_string.cpp
    source: fast_float-6.1.6/tests/short_random_string.cpp
    description: "短随机字符串解析测试"
    command: "./short_random_string"
  - file: tests/random_string.cpp
    source: fast_float-6.1.6/tests/random_string.cpp
    description: "随机字符串解析测试"
    command: "./random_string"

# 穷举组（FASTFLOAT_EXHAUSTIVE=OFF 默认不启用，编译通过、限时探测持续进度无失败）
exhaustive_tests:
  - file: tests/exhaustive32.cpp
    description: "32 位穷举（全空间，需数小时，硬阻塞）"
  - file: tests/exhaustive32_64.cpp
    description: "32/64 位穷举（硬阻塞）"
  - file: tests/exhaustive32_midpoint.cpp
    description: "中点穷举（硬阻塞）"
  - file: tests/long_exhaustive32.cpp
    description: "长 32 位穷举（硬阻塞）"
  - file: tests/long_exhaustive32_64.cpp
    description: "长 32/64 位穷举（硬阻塞）"
  - file: tests/long_random64.cpp
    description: "长随机 64 位（硬阻塞）"
  - file: tests/random64.cpp
    description: "随机 64 位（硬阻塞）"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — 验证头文件包含和 API 调用"
    command: "./test_fast_float"
  - file: ohos_special_test.cpp
    description: "HarmonyOS 专项测试 — __OHOS__ 平台校验 + 边界/特殊值解析（15 checks）"
    command: "./test_ohos_special"

# 测试断言总数（basictest doctest assertions 6859 + 专项 15，实测）
assertion_count: ~7000