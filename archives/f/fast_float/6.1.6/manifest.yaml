# 版本级 manifest — fast_float 6.1.6
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "6.1.6"

# 软件名
software: fast_float

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方正式源，R39）
  url: "https://github.com/fastfloat/fast_float/archive/refs/tags/v6.1.6.tar.gz"

  # 源码校验和（实测 sha256，与镜像官方包一致）
  sha256: "4458aae4b0eb55717968edda42987cabf5f7fc737aee8fede87a70035dba9ab0"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_SYSTEM_NAME=Linux"  # OHOS 下 CMakeToolchain 自动映射
  - "-DBUILD_SHARED_LIBS=OFF"    # header-only，无共享库
  - "-DFASTFLOAT_TEST=OFF"       # 上游 tests 用 FetchContent 拉 GitHub，CI 禁网

  # 编译依赖列表（格式: name/version）— header-only 无依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "fast_float 为 header-only INTERFACE 库，无二进制产物"
- "上游 tests/CMakeLists.txt 用 FetchContent 从 GitHub 拉 doctest 与 supplemental_test_files，CI 禁 GitHub 网络时必须 FASTFLOAT_TEST=OFF，由 test_package 消费者+OHOS 专项测试覆盖"
- "OHOS 下 CMakeToolchain 自动映射 CMAKE_SYSTEM_NAME=Linux（R32 平台兼容）"