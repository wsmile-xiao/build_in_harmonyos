# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: fast_float/8.0.1
homepage: "https://github.com/fastfloat/fast_float"

# 上游测试（tests/，doctest 单测 + supplemental data 文件）——用 FetchContent 从
# GitHub 拉 doctest 与 supplemental_test_files，CI worker 网络禁 GitHub，构建时
# -DFASTFLOAT_TEST=OFF 关闭（header-only 库，test_package 补消费者测试）
upstream_check_command: "echo \"upstream tests use FetchContent from GitHub (blocked on CI); disabled via -DFASTFLOAT_TEST=OFF\""

# conanfile.py build() 中已按上游 CMake 配置裁剪（FASTFLOAT_TEST=OFF）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_fast_float.cpp
    description: "消费者探针：fast_float::from_chars 解析 \"3.14159265\" 校验数值，验证 header-only 库可用"
    command: "clang++ test_fast_float.cpp -o test_fast_float_probe && ./test_fast_float_probe"

# 断言总数（test_package 1 个断言）
assertion_count: 1
