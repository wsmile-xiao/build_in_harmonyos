# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fastk/1.2
homepage: "https://github.com/thegenemyers/FASTK"

# FastK 上游无 'make check' 测试套件；测试以运行二进制为主
upstream_check_command: "make check  # FastK 上游无 check target"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 — 上游 README 示例: FastK -k40 -t part1.fasta
upstream_tests:
  - file: test.sh
    source: test_package/test.sh
    description: "执行 FastK 二进制，验证 Usage 输出 + 处理 fasta 生成 .hist"
    command: "bash test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "FastK 二进制烟雾测试 (usage + fasta 处理)"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
