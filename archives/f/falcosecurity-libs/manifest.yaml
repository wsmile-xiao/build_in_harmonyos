software: "falcosecurity-libs"
display: "Falco Security Libraries"
description: "Falco 用户态事件采集、解析和过滤库集合"
category: system
homepage: "https://github.com/falcosecurity/libs"
license: Apache-2.0
build_system: cmake
status: built

ohos_adaptation:
  key_points:
    - "HarmonyOS PC aarch64 仅启用 libscap/libsinsp 用户态实现"
    - "Linux kernel driver、modern BPF 和 live-driver E2E 目标不注册"
    - "CMake configure-time fixture 与 ExternalProject 归档使用 checksum-bound Conan staging"
  common_dependencies:
    - "bundled zlib/1.3.1"
    - "bundled oneTBB/2022.1.0"
    - "bundled jsoncpp/1.9.5"
    - "bundled RE2/2022-06-01"
    - "bundled valijson/1.0.2"

versions:
  "0.25.4":
    status: built
    build_date: "2026-09-17"
    conan_ref: "falcosecurity-libs/0.25.4"
