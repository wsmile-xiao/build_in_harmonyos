package: falcosecurity-libs/0.25.4
homepage: "https://github.com/falcosecurity/libs"

upstream_check_command: "custom Conan build() runner"
upstream_test_in_build: true
upstream_test_command: "unit-test-libsinsp --gtest_color=no; libscap_test --gtest_color=no"

upstream_tests:
  - file: "userspace/libsinsp/test/**/*.cpp"
    source: "falcosecurity-libs-0.25.4/userspace/libsinsp/test"
    description: "libsinsp upstream GoogleTest suite; 778 static declarations, 715 registered source declarations, 805 runner cases, 804 passed and 1 skipped"
    command: "unit-test-libsinsp --gtest_color=no"
  - file: "test/libscap/test_suites/**/*.cpp"
    source: "falcosecurity-libs-0.25.4/test/libscap/test_suites"
    description: "libscap userspace and savefile converter GoogleTest suite; 393 static declarations, 363 registered and executed"
    command: "libscap_test --gtest_color=no"
  - file: "test/libsinsp_e2e/**/*.cpp"
    source: "falcosecurity-libs-0.25.4/test/libsinsp_e2e"
    description: "183 static declarations; not registered on OHOS because the upstream target depends on the Linux driver"
    command: "not registered on OHOS"
  - file: "test/drivers/**/*.cpp"
    source: "falcosecurity-libs-0.25.4/test/drivers"
    description: "467 static declarations; not registered on OHOS because the upstream driver and BPF targets are Linux-only"
    command: "not registered on OHOS"
  - file: "test/e2e/**/*.cpp"
    source: "falcosecurity-libs-0.25.4/test/e2e"
    description: "No TEST/TEST_F/TEST_P declarations in the 0.25.4 tag"
    command: "none"

test_package_tests:
  - file: "test_falcosecurity_libs.cpp"
    description: "Consumer calls scap_get_ppm_sc_name and sinsp_gethostname and asserts both results"
    command: "./test_falcosecurity_libs"

assertion_count: 2
consumer_tests: 1
consumer_passed: 1
