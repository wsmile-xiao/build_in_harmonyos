knowledge_gained:
  - "HarmonyOS is not a built-in CMake platform; SONAME flags must be supplied at configure time and propagated to ExternalProject children. (knowledge_ref: E092, E383)"
  - "The OHOS zlib configure branch defaults to LDSHARED without SONAME; the shared zlib link command must provide libz.so.1. (knowledge_ref: E383)"
  - "The OHOS userspace build uses libscap/libsinsp without Linux driver and BPF engines; Linux-only driver/e2e tests remain outside the runnable platform subset. (knowledge_ref: test_package/MANIFEST.yml)"
  - "A Linux scap-file fcntl fixture has a platform-specific parameter layout on OHOS and is recorded as one explicit upstream skip. (knowledge_ref: test_package/MANIFEST.yml)"
  - "When the CI source pre-download path rewrites github.com to an unreachable proxy, the official codeload.github.com archive preserves the same SHA256 and bypasses that rewrite; Conan get() uses an explicit tar.gz filename. (knowledge_ref: E276)"
  - "CMake configure-time test fixtures can be fetched in Conan source() with per-file SHA256 and staged into the build binary scap_files directory before configure; the original upstream download loop then skips all fixture network requests without changing test registration. (knowledge_ref: DRAFT-conan-cmake-test-fixture-prefetch)"
  - "URL-driven CMake ExternalProject archives can use the same checksum-bound Conan source() acquisition and be staged into each <name>-prefix/src directory before configure, so clean workers do not depend on CMake's network downloader. (knowledge_ref: DRAFT-conan-cmake-test-fixture-prefetch)"

knowledge_ref:
  - "E092"
  - "E383"
  - "E276"
  - "DRAFT-conan-cmake-test-fixture-prefetch"

