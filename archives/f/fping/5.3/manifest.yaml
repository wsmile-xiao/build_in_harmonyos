software: fping
build_system: autotools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitcode.com/schweikert/fping"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 额外步骤
  extra_steps:
    - "autoreconf -fi (源码仓库不含预生成 configure)"
    - "CONFIG_SHELL=bash (HMDFS 权限兼容)"
    - "umask 007 代替 077 (HMDFS setgid 目录 group 写权限)"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS setgid 目录下 umask 077 会剥夺 group 写权限，导致 config.status 创建临时文件 Permission denied"
  - "解决方案：umask 007 保留 group 写权限（E002 相关）"
  - "Savannah/GitHub 源码下载 SSL 证书在 OpenHarmony 上不可用，需从 gitcode.com 等 Git 镜像获取"
  - "git clone 源码需要 autoreconf -fi 生成 configure 脚本"