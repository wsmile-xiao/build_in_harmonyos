# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8.0.1"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"
build_system: "{BUILD_SYSTEM}"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/elfmz/far2l/archive/refs/tags/v_2.8.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py generate() 的 tc.variables 对齐）
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DUSEWX=NO"
    - "-DTTYX=NO"
    - "-DUSEUCD=NO"
    - "-DCOLORER=NO"
    - "-DNETROCKS=NO"
    - "-DMULTIARC=NO"
    - "-DPYTHON=NO"
    - "-DTESTING=NO"
    - "-DLEGACY=NO"
    - "-DMUSL=YES"
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  # 注意：CMAKE_POLICY_VERSION_MINIMUM=3.5 通过 cache_variables 设置，
  # 这里用 -D 传 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 确保 exploratory build
  # 阶段（非 conan create）也能解决 CMake 4.x 兼容（E103/E187）

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
