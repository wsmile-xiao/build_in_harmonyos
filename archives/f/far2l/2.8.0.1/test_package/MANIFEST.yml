# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: far2l/2.8.0.1
homepage: "https://github.com/elfmz/far2l"

# 上游测试命令
upstream_check_command: "testing/far2l-smoke-run.sh"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 smoke 测试框架需要 Go 工具链 + 外网拉取 goja/termtest 模块
# 设备无 go 工具链，无法运行上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游官方 6 个 smoke 测试用例（Go 框架，需 go>=1.18 + 外网）：
#   1. 0001-run-and-exit  2. 0002-copy-files  3. 0003-move-files
#   4. 0004-vt-shell      5. 0005-view-file   6. 0006-view-file-word-wrap
# 设备无 go 工具链且 far2l-smoke-run.sh 硬编码写 /tmp（鸿蒙只读），
# 上游测试 N/A（未运行）
upstream_tests:
  - file: testing/far2l-smoke-run.sh
    source: far2l-v_2.8.0/testing/far2l-smoke-run.sh
    description: "Go smoke test runner — N/A（未运行）：设备无 go 工具链，且脚本硬编码 /tmp 路径"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
# test_far2l.cpp: 13 个 CHECK 断言（ELF magic/class/machine/endian）
# test_far2l.sh: 9 个断言（文件存在、ELF magic/class/machine、--tty/--norgb/--version grep、TTY headless segfault/abort check）
# 验证 far2l 二进制：ELF 格式检查 + --help 输出检查 + TTY 无头启动不崩溃
test_package_tests:
  - file: test_far2l.cpp
    description: "Compiled binary test: verifies ELF magic, class (64-bit), endian, machine type (AARCH64) — 13 CHECK assertions"
    command: "test_far2l <far2l_path>"
  - file: test_far2l.sh
    description: "Functional test: ELF64/aarch64 format check + far2l --help output verification (--tty, --norgb, 2.8.0) + TTY headless launch (R40)"
    command: "bash test_far2l.sh"

# 测试断言总数
# test_far2l.cpp: 13 CHECK assertions
# test_far2l.sh: 9 assertions (file exists, ELF magic, ELF class, ELF machine, --tty grep, --norgb grep, version grep, TTY segfault check, TTY abort check)
# Total: 13 + 9 = 22
assertion_count: 22
