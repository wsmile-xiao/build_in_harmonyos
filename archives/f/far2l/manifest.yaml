software: far2l
version: 2.8.0.1
status: built
build_date: 2026-08-16
build_system: cmake

# 编译配置
configure_options:
  - "-DUSEWX=NO"
  - "-DTTYX=NO"
  - "-DUSEUCD=NO"
  - "-DNETROCKS=NO"
  - "-DMULTIARC=NO"
  - "-DPYTHON=NO"
  - "-DTESTING=NO"
  - "-DLEGACY=NO"
  - "-DMUSL=YES"
  - "-DCMAKE_CXX_STANDARD=17"

# 编译参数
compiler: clang
compiler_version: 15.0.4
target_arch: aarch64

# 依赖列表
dependencies:
  - name: cmake
    version: "4.1.2"
    type: build
  - name: clang
    version: "15.0.4"
    type: build

# 补丁信息
patches: []

# 产物信息
artifacts:
  binaries:
    - far2l
  libraries: []

# 质量门禁
quality_gates:
  G0: pending
  G1: pending
  G2: pending
  G3: pending
  G4: pending
