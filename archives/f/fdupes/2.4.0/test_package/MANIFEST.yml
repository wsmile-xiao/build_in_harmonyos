# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fdupes/2.4.0
homepage: "https://github.com/adrianlopezroche/fdupes"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# fdupes does not ship an automated test suite in the tarball;
# the testdir/ directory contains sample files for manual testing.
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证 fdupes 二进制可执行 (--version) 和重复文件检测功能"
    command: "fdupes --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
