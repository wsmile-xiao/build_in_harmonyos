software: flameshot
version: "14.0.0"
status: built
build_date: "2026-08-20"
build_system: cmake

source:
  url: "https://github.com/flameshot-org/flameshot/archive/refs/tags/v14.0.0.tar.gz"
  sha256: "810c399f3b9fbfd72e24e61417ede24243925f9c0d03040a8aba0d4866676d93"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DQT_DEFAULT_MAJOR_VERSION=5"
    - "-DQT_VERSION_MAJOR=5"
    - "-DUSE_KDSINGLEAPPLICATION=ON"
    - "-DUSE_BUNDLED_KDSINGLEAPPLICATION=ON"
    - "-DDISABLE_UPDATE_CHECKER=ON"
    - "-DENABLE_IMGUR=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies:
    - "qt5-qtbase/5.15.2.2"
    - "qt5-qtsvg/5.15.2.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-remove-linguisttools.patch"
  - "0002-qt5-default.patch"
  - "0003-kdsingleapplication-skip-qtinstallpaths.patch"
  - "0004-find-svg-separately.patch"
  - "0005-inject-qt5-include.patch"
  - "0006-replace-stringdecoder.patch"
  - "0007-enter-event-qt5.patch"
  - "0008-retrieve-data-qt5.patch"
  - "0009-remove-allocation-limit.patch"
  - "0010-std-pair-to-qpair.patch"
  - "0011-global-position-qt5.patch"
  - "0012-fontdatabase-families-qt5.patch"
  - "0013-main-qt5.patch"
  - "0014-dbus-sources-not-unix.patch"

knowledge_gained:
  - "Flameshot 14.0.0 targets Qt6 APIs; the OHOS registry only ships Qt5, so 14 portability patches bridge the Qt6->Qt5 gaps (enterEvent, retrieveData, QFontDatabase::families, QLibraryInfo::path, QSharedMemory, DBus sources on OHOS, ...)."
  - "qt5-qtbase/5.15.2.2 enters the graph via a version override (qt5-qtsvg pins 5.15.2); CMakeDeps then leaves Qt5 include/link metadata empty, so the recipe injects include dirs, Qt5 libs and moc/rcc/uic paths explicitly."
  - "The OHOS SDK ohos.toolchain.cmake sets CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY, so CMakeDeps configs in the generators dir need CMAKE_FIND_ROOT_PATH += generators_dir."
  - "The OHOS SDK toolchain points CMAKE_RANLIB at a missing llvm-ranlib; the host wrapper /data/service/hnp/bin/llvm-ranlib works."
  - "Strict OHOS execution contexts (CI worker sandbox, some shells) refuse to exec the produced GUI binary unless it is signed (Operation not permitted). test_package keeps the sandbox WARN fallback for sandboxed CI; in non-sandbox contexts sign with binary-sign-tool (selfSign) and run --version: verified on-device (Flameshot v14.0.0, PASS)."

verification:
  local_linux: "conan create . --build=missing"
  clean_worktree: "preflight_check.sh flameshot/14.0.0; conan create . --build=missing"
  consumer_test: "test_package/conanfile.py (flameshot --version; PASS in non-sandbox context after self-sign; sandbox WARN fallback kept for CI)"
