# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: flameshot/14.0.0
homepage: "https://flameshot.org"

# 上游测试命令（Qt Test，需图形环境，鸿蒙 CI 不执行）
upstream_check_command: "ctest (tests/ 目录，需 Qt Test 与图形环境)"
upstream_test_in_build: false
upstream_test_command: ""

# test_package 中自带的测试（消费者视角验证，实质调用被测包二进制）
test_package_tests:
  - file: conanfile.py
    source: test_package/conanfile.py
    description: "Run `flameshot --version` and verify the packaged binary executes"
    command: "flameshot --version"
