  sha256: "810c399f3b9fbfd72e24e61417ede24243925f9c0d03040a8aba0d4866676d93"

external:
  qt-color-widgets:
    url: "https://gitlab.com/api/v4/projects/mattbas%2FQt-Color-Widgets/repository/archive.tar.gz?sha=5d52e907e50dc88cf969b41cea44665ff6c475b1"
