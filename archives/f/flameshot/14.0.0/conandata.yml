patches:
  - patch_file: "patches/0001-remove-linguisttools.patch"
    patch_description: "Drop Qt5 LinguistTools from find_package and skip .ts translation generation (lrelease is not provided by qt5-qtbase in the registry)"
    patch_type: "portability"
  - patch_file: "patches/0002-qt5-default.patch"
    patch_description: "Default QT_VERSION_MAJOR/QT_DEFAULT_MAJOR_VERSION to 5 for the Qt5 toolchain"
    patch_type: "portability"
  - patch_file: "patches/0003-kdsingleapplication-skip-qtinstallpaths.patch"
    patch_description: "Skip KDQtInstallPaths qmake probe in bundled KDSingleApplication (CMakeDeps does not export Qt5::qmake; QT_INSTALL_* unused by its install rules)"
    patch_type: "portability"
  - patch_file: "patches/0004-find-svg-separately.patch"
    patch_description: "Find qt5-qtsvg as an independent CMakeDeps package (Qt5::Svg is not a Qt5Config component in the OHOS registry)"
    patch_type: "portability"
  - patch_file: "patches/0005-inject-qt5-include.patch"
    patch_description: "Inject FLAMESHOT_QT5_INCLUDE_DIR into include_directories (qt5-qtbase via override does not export Qt include paths through CMakeDeps)"
    patch_type: "portability"
  - patch_file: "patches/0006-replace-stringdecoder.patch"
    patch_description: "Replace QStringDecoder/QStringEncoder (qstringconverter.h not shipped by qt5-qtbase in registry) with QString::fromUtf8/toUtf8"
    patch_type: "portability"
  - patch_file: "patches/0007-enter-event-qt5.patch"
    patch_description: "Use Qt5 enterEvent(QEvent*) signature instead of Qt6 QEnterEvent in pin/monitorpreview/notifierbox"
    patch_type: "portability"
  - patch_file: "patches/0008-retrieve-data-qt5.patch"
    patch_description: "Use Qt5 QMimeData::retrieveData(QString, QVariant::Type) signature instead of Qt6 QMetaType"
    patch_type: "portability"
  - patch_file: "patches/0009-remove-allocation-limit.patch"
    patch_description: "Drop Qt6-only QImageReader::setAllocationLimit call (Qt5 image readers have no allocation cap)"
    patch_type: "portability"
  - patch_file: "patches/0010-std-pair-to-qpair.patch"
    patch_description: "Use QPair instead of std::pair in capturewidget keyMap (Qt5 QList operator<< only accepts QPair)"
    patch_type: "portability"
  - patch_file: "patches/0011-global-position-qt5.patch"
    patch_description: "Use Qt5 QMouseEvent::globalPos() instead of Qt6 globalPosition() in draggablewidgetmaker"
    patch_type: "portability"
  - patch_file: "patches/0012-fontdatabase-families-qt5.patch"
    patch_description: "Call QFontDatabase::families() on an instance (Qt5 instance method; static only in Qt6)"
    patch_type: "portability"
  - patch_file: "patches/0013-main-qt5.patch"
    patch_description: "Drop QSharedMemory guard (qt5-qtbase built with -no-feature-sharedmemory; KDSingleApplication covers single-instance) and use Qt5 QLibraryInfo::location()"
    patch_type: "portability"
  - patch_file: "patches/0014-dbus-sources-not-unix.patch"
    patch_description: "Compile request.cpp/flameshotdbusadapter.cpp on OHOS too (CMake leaves UNIX unset for CMAKE_SYSTEM_NAME=OHOS; gate on NOT APPLE AND NOT WIN32)"
    patch_type: "portability"
