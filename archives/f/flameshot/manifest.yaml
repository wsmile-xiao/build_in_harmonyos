# 软件级 manifest — flameshot
# 遵循 ARCHIVE-SPEC v2.0

software: flameshot
display: "Flameshot"
description: "Powerful yet simple to use screenshot software"
category: utility
homepage: "https://flameshot.org"
license: GPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "Flameshot 14.0.0 targets Qt6; the registry ships Qt5, so the recipe bridges Qt6->Qt5 API gaps with 14 portability patches."
    - "qt5-qtbase enters the graph via a version override, so CMakeDeps leaves Qt5 include/link metadata empty; the recipe injects include dirs, Qt5 libs and moc/rcc/uic paths explicitly."
    - "OHOS SDK ohos.toolchain.cmake sets CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY; add the generators dir to CMAKE_FIND_ROOT_PATH."
    - "Strict OHOS execution contexts refuse to exec the GUI binary unless signed; test_package keeps a sandbox WARN fallback and the runtime check is verified on-device after self-signing."
  common_dependencies:
    - qt5-qtbase
    - qt5-qtsvg

versions:
  "14.0.0":
    status: built
    build_date: "2026-08-20"
    conan_ref: "flameshot/14.0.0"
