software: fossa
display: "fossa"
description: "Cesanta Fossa — embedded C/C++ async networking library (HTTP/WebSocket/MQTT/CoAP/DNS)"
category: network
homepage: "https://github.com/cesanta/fossa"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "与 mongoose 同族的单文件合并产物（fossa.c + fossa.h），直接 clang 编译成静态库"
    - "tarball 缺 common/ 与 deps/frozen，src/modules.mk 的分模块构建不可用，只能用合并产物"
    - "NS_ENABLE_IPV6 会改变 union socket_address 布局，属 ABI 宏，已通过 cpp_info.defines 下发"
    - "只交付静态库：OHOS 用户态 .so 需 ELF 签名，validate() 拒绝 shared=True"
    - "上游 test/Makefile 无条件 -lssl 的缺陷以补丁改为条件链接；测试用上游自带 TEST_UNDER_VIRTUALBOX 适配 HMDFS 忽略 chmod"
  common_dependencies: []

versions:
  "2.1":
    status: built
    build_date: "2026-09-02"
    conan_ref: "fossa/2.1"
