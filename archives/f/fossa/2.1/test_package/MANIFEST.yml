# test_package/MANIFEST.yml
package: fossa/2.1
homepage: "https://github.com/cesanta/fossa"

# 列出上游测试目标实际会执行的命令（GNU make 3.81 实测）
upstream_check_command: "make -n -C test test"

# conanfile.py build() 已集成上游测试：逐用例驱动 unit_test
upstream_test_in_build: true
upstream_test_command: "make -C test -j1 unit_test CC=clang CFLAGS_EXTRA=-DTEST_UNDER_VIRTUALBOX && MallocLogFile=/dev/null ./unit_test <TEST_FILTER>"

upstream_tests:
  - file: test/unit_test.c
    source: fossa-2.1/test/unit_test.c
    description: "Fossa 官方单元测试（HTTP/WebSocket/MQTT/CoAP/DNS/mbuf/权限与事件循环），以 TEST_FILTER 逐用例执行"
    command: "MallocLogFile=/dev/null ./unit_test <TEST_FILTER>"

# 上游用例矩阵：数字全部由 conanfile.py 解析 unit_test 自身输出得到，
# 完整逐用例断言数见该版本 conan create 日志中的 HMBS_UPSTREAM_TEST_RESULT
upstream_case_matrix:
  registered: 60          # unit_test.c 中 RUN_TEST(...) 去重计数
  executed: 58            # 实际编入二进制并跑过的用例
  passed: 55
  failed: 3
  skipped: 2              # test_ssl / test_modern_crypto：NS_ENABLE_SSL 未启用
  assertions: 669         # 按超串归减法求得的断言总数（无重复计数）
  failed_cases:
    - test: test_cgi
      category: 工具未装
      reason: "设备 perl 5.44 无 CGI.pm（CGI 自 Perl 5.22 起移出核心），index.cgi 报 Can't locate CGI.pm in @INC"
    - test: test_connection_errors
      category: 环境限制
      reason: "运营商 resolver 对 does.not.exist 泛解析出 RFC 2544 地址 198.18.6.163 并有透明代理，期望失败的连接反而成功"
    - test: test_dns_resolve
      category: 环境限制
      reason: "同一泛解析 resolver 合成 198.18.6.164，与用例固定的 2015 年真实应答 52.16.170.74/CNAME dev.cesanta.com 不可能匹配"

  # 真机 conan create 日志「上游用例矩阵」行原样摘录；58 项求和 == 669，无重复项。
  # test_dns_uncompress / test_dns_decode_truncated 记 0：上游 unit_test.c 把这两个
  # 用例体写成 `#if 1 return NULL; #else ...`（2256、2379 行），本身即空壳，
  # 并非本配方跳过或截断所致。
  assertions_per_case: {
    test_mbuf: 28, test_parse_address: 27, test_check_ip_acl: 7,
    test_connect_opts: 4, test_connect_opts_error_string: 3, test_to64: 5,
    test_alloc_vprintf: 6, test_socketpair: 8, test_simple: 42, test_thread: 3,
    test_mgr: 7, test_parse_http_message: 44, test_get_http_var: 15,
    test_http: 14, test_http_errors: 5, test_http_index: 6,
    test_http_parse_header: 21, test_ssi: 1, test_cgi: 1, test_http_rewrites: 7,
    test_http_dav: 14, test_http_range: 14, test_http_multipart: 9,
    test_websocket: 3, test_websocket_big: 5, test_rpc: 3, test_http_chunk: 4,
    test_http_chunk2: 15, test_mqtt_handshake: 11, test_mqtt_publish: 11,
    test_mqtt_subscribe: 9, test_mqtt_unsubscribe: 8, test_mqtt_connack: 4,
    test_mqtt_suback: 7, test_mqtt_simple_acks: 30, test_mqtt_nullary: 9,
    test_mqtt_parse_mqtt: 5, test_mqtt_broker: 3, test_dns_encode: 24,
    test_dns_uncompress: 0, test_dns_decode: 17, test_dns_decode_truncated: 0,
    test_dns_reply_encode: 15, test_dns_server: 21, test_dns_resolve: 1,
    test_dns_resolve_timeout: 1, test_dns_resolve_hosts: 3,
    test_buffer_limit: 3, test_connection_errors: 11, test_connect_fail: 2,
    test_resolve: 3, test_base64: 6, test_sock_addr_to_str: 9,
    test_hexdump: 2, test_hexdump_file: 2, test_udp: 4, test_coap: 119,
    test_strcmp: 8,
  }

test_package_tests:
  - file: test_package/test.c
    description: "消费者视角验证：base64 编解码、ns_get_http_var、union socket_address 的 NS_ENABLE_IPV6 ABI 布局、127.0.0.1 上的真实 HTTP 往返"
    command: "./test_fossa"

# 断言总数 = 上游 669 + test_package 15
assertion_count: 684
