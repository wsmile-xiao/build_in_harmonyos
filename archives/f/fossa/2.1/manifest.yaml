  evidence_provenance: "上方 test_results 数字采自开发真机 aarch64 的 commit 1862ea8ad0 构建（补丁 0002 之前）。补丁 0002 之后 CI #36830 与 #36835 均返回通过，机器人评论逐项列出 Conan test_package、L0（结构完整性）、L1（测试执行验证）三项通过（评论未报告 L2 项，故不声称 L2 结论）；CI 评论正文不含被构建的 SHA，#36835 对应 HEAD a525ba3246 仅按 /rebuild 触发顺序推定。同一 SHA 的开发真机复跑尚未执行，0002 的守卫仅在 msg==NULL 时生效，预期矩阵不变，但仍以真机复跑为准。"

knowledge_gained:
  - "Fossa 2.1 与 mongoose 同为 Cesanta 单文件合并产物（fossa.c + fossa.h），但 tarball 缺 common/ 与 deps/frozen，src/modules.mk 的分模块构建不可用，只能走合并产物"
  - "NS_ENABLE_IPV6 是 ABI 级宏：fossa.h:537 据此把 union socket_address 的 sin6 在 sockaddr_in6 与 sockaddr 之间切换，库与消费者必须同宏，故通过 cpp_info.defines 下发"
  - "上游 test/Makefile 无条件链接 -lssl，但默认测试构建不定义 NS_ENABLE_SSL、不含任何 TLS 代码；在无 OpenSSL 开发文件的环境（含 CI）上必然链接失败"
  - "上游 RUN_TEST 用 strstr(#test, filter) 选测：一个 filter 会连带跑所有名字包含它的用例，且首个失败即中断整个进程，直接求和会重复计数、单次全量跑只能拿到第一个失败"
  - "HMDFS 忽略 chmod（chmod 000 后仍为 -rw-r----- 且 fopen 成功），上游 test_http_errors 依赖 POSIX 权限语义的分支需用上游自带的 TEST_UNDER_VIRTUALBOX 开关关闭，零源码改动"
  - "运营商 resolver 114.114.114.114 对不存在域名做泛解析（合成 RFC 2544 198.18.0.0/15 地址）并有透明代理，凡是『期望解析/连接失败』的用例在此环境都不可能通过"
  - "ns_base64_decode() 返回的是消耗的输入字符数而不是解码后的字节数，且自行补 '\\0'"
  - "上游 unit_test.c 自带被 `#if 1 return NULL; #else ...` 短路的空壳用例（test_dns_uncompress、test_dns_decode_truncated），逐用例度量必须能把『跑到但 0 断言』与『未编入二进制』和『被更早失败截断』区分开，否则用例数会失真"
  - "『期望外部 DNS/连接失败』与『逐字节比对固定历史应答』是两类不同的环境依赖断言：前者被运营商泛解析+透明代理反证为成功（test_connection_errors），后者只是合成的地址与 2015 年抓取的真实应答不等（test_dns_resolve），归因时要分开写清机制"
  - "同一环境依赖用例在真机与 CI 会呈现两种不同形态：真机泛解析给出应答 ⇒ test_dns_resolve 断言失配；CI 拿不到可用应答（NXDOMAIN 时应答 0 条、无应答时重试耗尽，两者都以 msg==NULL 回调），而上游 dns_resolve_cb 缺 NULL 守卫（ns_dns_next_record 无条件解引用 msg）⇒ SIGSEGV。凭单一环境的观察不足以描述缺陷全貌，必须把两种形态都写进归因"
  - "逐用例度量器把『没有框架汇总行』当作硬错误抛出，正好把一次崩溃（Signal 11）暴露成构建失败而不是被静默计成通过；这种『无法解释就失败』的自检比宽容的兜底更有价值"

