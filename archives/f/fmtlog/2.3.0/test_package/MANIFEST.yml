# test_package/MANIFEST.yml
# fmtlog 2.3.0 上游测试声明

package: fmtlog/2.3.0
homepage: "https://github.com/MengRao/fmtlog"

# 上游测试命令
upstream_check_command: "cmake --build . -j4 && ctest"

# conanfile.py build() 中未集成上游测试（由本地门禁单独跑上游 test/ 套件）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/log_test.cc
    source: fmtlog-2.3.0/test/log_test.cc
    description: "fmtlog 核心日志功能与 benchmark"
    command: "./log_test"
  - file: test/enc_dec_test.cc
    source: fmtlog-2.3.0/test/enc_dec_test.cc
    description: "参数编码/解码与命名参数"
    command: "./enc_dec_test"
  - file: test/multithread_test.cc
    source: fmtlog-2.3.0/test/multithread_test.cc
    description: "多线程吞吐测试"
    command: "./multithread_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者链接 fmtlog 并调用 logi/poll API"
    command: "./test_fmtlog"

# 测试断言总数
assertion_count: 20
