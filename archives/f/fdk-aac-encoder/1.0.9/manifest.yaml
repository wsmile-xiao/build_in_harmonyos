# 版本级 manifest — fdk-aac-encoder 1.0.9
# 文件位置: archives/f/fdk-aac-encoder/1.0.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0.9"
software: "fdk-aac-encoder"

# 编译状态
# published | built | failed | archived
status: published

build_date: "2026-09-04"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源为上游作者 GitHub 仓库（COPYING 的 Source 字段）；
  # 使用 v1.0.9 tag 归档，sha256 经镜像重下核验。
  url: "https://github.com/nu774/fdkaac/archive/refs/tags/v1.0.9.tar.gz"
  sha256: "be6de0851c447d132e9bff0141068ee6fec6d37e21973ea9304480c68178058b"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游双构建系统（CMake + autotools）；init-build 误判 autotools，
  # 实际用 CMake（官方主构建系统）。
  system: cmake

  # 参数最少化（R1）：仅 CMAKE_INSTALL_PREFIX（由 Conan 注入）
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=<prefix>"

  dependencies:
    - fdk-aac/2.0.3
    - libsndfile/1.2.2

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
# knowledge_ref 指向知识图谱条目/草稿（check_knowledge_gap 校验引用完整性）
knowledge_gained:
  - "官方源为上游作者 GitHub 仓库 nu774/fdkaac（COPYING Source 字段），源码取 v1.0.9 tag 归档 (knowledge_ref: notes.md 坑1)"
  - "源码双构建系统（CMake+autotools），init-build 会误判 autotools，应以 CMake 为准 (knowledge_ref: notes.md 坑2)"
  - "上游 CMakeLists 用 pkg_check_modules(fdk-aac) 探测依赖，Conan 侧需 PkgConfigDeps 提供 fdk-aac.pc (knowledge_ref: notes.md 编译步骤)"
  - "fdkaac CLI 无 --version 选项且 -h/--help 按设计返回退出码 1（usage() 后 return -1），测试须检查输出横幅而非退出码 (knowledge_ref: notes.md 坑3)"
  - "上游测试 verify_smart_padding.py 需要 ffmpeg 解码器，制品仓 ffmpeg/5.1.10 经 conanrun.sh 注入 PATH 可用 (knowledge_ref: notes.md 坑6)"
