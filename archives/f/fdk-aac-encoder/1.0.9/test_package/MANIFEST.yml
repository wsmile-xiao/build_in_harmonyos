# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fdk-aac-encoder/1.0.9
homepage: "https://github.com/nu774/fdkaac"

# 上游测试命令（上游无 make check / ctest 注册，测试为独立 python 回归脚本）
upstream_check_command: "python3 tests/verify_smart_padding.py --fdkaac <path>/fdkaac"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试需 ffmpeg 解码器（外部运行时依赖，非构建依赖），不入 build()
upstream_test_in_build: false
upstream_test_command: "python3 tests/verify_smart_padding.py --fdkaac $PREFIX/bin/fdkaac"

# 上游实际运行的测试程序（tests/ 目录清点：1 个文件，30 个断言场景）
upstream_tests:
  - file: tests/verify_smart_padding.py
    source: fdk-aac-encoder-1.0.9/tests/verify_smart_padding.py
    description: "smart-padding (LPC pre/post-roll) gapless 回归测试：fdkaac 编码后用 ffmpeg 解码，交叉相关定位真实音频起点，逐窗口校验 gapless 边界样本级精度"
    command: "python3 tests/verify_smart_padding.py --fdkaac ./bin/fdkaac"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "真实编码测试：生成 440Hz 立体声正弦波 WAV → fdkaac 编码 AAC-LC 128kbps → 校验 M4A ftyp 容器与 ADTS 同步字"
    command: "conan create . -tf"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 30 项（5 profiles × 6 场景，实测 30 passed 0 failed）+ test_package 4 组断言
assertion_count: 34
