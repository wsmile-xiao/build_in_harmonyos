# 版本级 manifest — future-queue 0.52
# 遵循 ARCHIVE-SPEC v3.0

version: "0.52"
software: future-queue
status: built
build_date: "2026-09-20"
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # CPAN 官方发行版（R39 合规）
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Future-Queue-0.52.tar.gz"
  sha256: "e98da929654bccb64592ac6355b7a7ef9ef9302abc8cd3a6c1dfd6003a57ee05"
  compression: tar.gz
  archive_root: "Future-Queue-0.52"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "future/0.52"
  optional: []
  note: |
    META.json prereqs 逐项对齐（实测复核）：
      runtime   requires   Future 0        → ohpcd 已发布 future/0.52
      runtime   requires   perl 5.014      → hnp perl 5.42.0 满足
      test      requires   Test2::V0 0     → hnp perl 自带（实测 1.302210）
      configure requires   Module::Build 0.4004 → OHOS 不可得，由 MakeMaker 替代

    Test2::V0 随 hnp perl 自带（1.302210），故**无需**声明为 Conan 依赖；
    Test::Pod **不在**本包 META.json 的 prereqs 中（上游自己也未声明），
    其缺失导致的 99pod.t skip 已如实申报（见测试结果）。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Perl 模块无二进制产物；不产生 bindirs，
    故无需 commands.json，R38 不适用）。

    构建：生成等价 Makefile.PL → perl Makefile.PL INSTALLDIRS=site → make →
    make test → make install DESTDIR=<staging>；package() 按登台树原样拷入
    package_folder。

    上游为 Module::Build（Build.PL，configure_requires Module::Build >= 0.4004），
    但 Module::Build 在 OHOS 不可得（实测 hnp perl 的 @INC 无 Module/Build.pm，
    制品仓亦无 perl-module-build）→ build() 生成等价 Makefile.PL，由 perl 核心
    ExtUtils::MakeMaker 驱动（先例：metrics-any 0.10、test-metrics-any 0.01）。
    转换逐项对齐 Build.PL：module_name / requires / test_requires →
    NAME+VERSION_FROM / PREREQ_PM / TEST_REQUIRES。

    ⚠️ 依赖注入（实测）：future/0.52 的 package_info() **只声明了 runenv_info**
    （`self.runenv_info.define_path("PERL5LIB", site)`），未声明 buildenv_info →
    其 PERL5LIB 不会进入本包 build 上下文，而 t/01queue.t 等需 `use Future`。
    故 build() 内遍历依赖定位其 perl lib 根并显式注入。

    解释器：固定 /data/service/hnp/bin/perl（5.42.0），与 metrics-any 先例一致。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues:
    - "上游 t/99pod.t 因缺 Test::Pod 而 skip（该依赖在 ohpcd/main/hnp perl 均不可得，且上游 META.json 亦未声明它）；已如实申报，Test::Pod 作为独立任务另行适配"
  notes: |
    纯 Perl 单模块（lib/Future/Queue.pm），无 XS、无 C/C++ 编译、无平台相关
    代码。新增 Makefile.PL 仅为构建脚本补充（等价转写上游 Build.PL），未改动
    上游源码，无需补丁。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  total: 35
  passed: 35
  failed: 0
  skipped: 1
  note: |
    上游测试（R51，2026-09-20 实测，hnp perl 5.42.0）：t/ 目录 **7 个 .t 文件**，
    `make test` 实测 **Files=7, Tests=35, Result: PASS**，零失败。
    逐文件：00use / 01queue / 02max-items / 03finish / 04bulk / 05prototype
    共 6 文件 35 用例全过；**99pod.t skip**（缺 Test::Pod 1.00）。
    通过率口径 = passed/(passed+failed) = 35/35 = **100%**（skip 不计入分母，
    已单列上述明细）。
    上游测试已集成进 build()（upstream_test_in_build: true）。
    适配后：test_package 消费者测试（R34 真实 API）**27/27 = 100%**。

    ⚠️ 关于 99pod.t 的如实申报（未以任何方式掩盖）：Test::Pod 是几十个 perl
    包的**共性缺口**，已确认作为独立任务另行适配；本 PR 不以
    ignore/deselect/allowlist 规避该用例，仅在 notes 与 MANIFEST 中记录其
    skip 原因，并保留套件退出码作为构建门（非 0 即失败）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "perl 依赖包只声明 runenv_info（无 buildenv_info）时，其 PERL5LIB 不会进入下游包的 build 上下文；下游在 build() 内跑依赖该模块的测试时必须自行定位并注入（本包需 `use Future`）"
  - "CPAN 包以 Module::Build（Build.PL）为构建系统而 Module::Build 在 OHOS 不可得时，可用 perl 核心 ExtUtils::MakeMaker 生成等价 Makefile.PL（逐项转写 Build.PL 的 module_name/requires/test_requires），上游 t/ 测试仍经 make test 真实运行 (ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "Future 并未导出 `await`（实测 `use Future qw(await)` 报 undefined import method）；消费 Future 系模块的惯用法是 `$future->result`（就绪时取值）与 `is_done`/`is_ready` 判状态，上游 t/ 亦如此"

references:
  - https://metacpan.org/pod/Future::Queue
  - https://metacpan.org/dist/Future-Queue
  - https://metacpan.org/pod/Future
