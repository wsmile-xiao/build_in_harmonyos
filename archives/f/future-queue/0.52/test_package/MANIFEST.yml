# test_package/MANIFEST.yml — future-queue 0.52
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: future-queue/0.52
homepage: "https://metacpan.org/pod/Future::Queue"

# 上游测试命令：上游为 Module::Build（Build.PL），OHOS 不可得（hnp perl 无
# Module/Build.pm，制品仓亦无）→ 配方由核心 ExtUtils::MakeMaker 生成等价
# Makefile.PL，上游测试经 make test 运行。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试套件（2026-09-20 本机实测，hnp perl 5.42.0）
# - t/ 目录：7 个 .t 测试文件
# - 实测结果：**Files=7, Tests=35, Result: PASS**，零失败
# - 逐文件：00use / 01queue / 02max-items / 03finish / 04bulk / 05prototype
#   共 6 个文件 35 用例全过；99pod.t 因缺 Test::Pod 而 skip
#
# ⚠️ 已知测试缺口（如实申报，未掩盖）：
#   t/99pod.t 执行 `eval "use Test::Pod 1.00"`，Test::Pod 在 OHOS 不可得
#   （ohpcd / main / hnp perl 均无）→ 该文件 skip。
#   注意 Test::Pod **并未**出现在本包 META.json 的 prereqs 中 —— 上游自己也
#   未把它声明为依赖，属"未声明的可选检查"。
#   已与用户确认：Test::Pod 是几十个 perl 包的共性缺口，作为**独立任务另行适配**；
#   本 PR 如实申报该 skip，不以 ignore/deselect/allowlist 等方式规避或掩盖。
#
# ⚠️ 依赖注入：future/0.52 的 package_info() 只声明 runenv_info、未声明
#   buildenv_info，其 PERL5LIB 不会自动进入本包 build 上下文；本配方在 build()
#   内遍历依赖定位其 perl lib 根并注入（t/01queue.t 等需 `use Future`）。
upstream_tests:
  - file: t/
    source: Future-Queue-0.52/t/*.t
    description: >-
      上游 perl 测试套件（7 文件；实测 Files=7 Tests=35 Result=PASS，
      6 文件 35 用例全过 + t/99pod.t 因缺 Test::Pod skip）
    command: "make test"

# test_package 消费者测试（R34 真实 API：载入打包的 Future::Queue，真实调用
# 全部公开 API 含 max_items 背压与 Future 异步语义，含 2 个负例）
#
# 驱动方式：.pl 不在 CI L0c 认可的测试源扩展名内，故以 test_future_queue.py
# 作为 L0c 可见入口驱动 perl 测试源（与 metrics-any 0.10、file-sharedir 1.118 同款）。
test_package_tests:
  - file: test_future_queue.pl
    description: >-
      消费者测试（27 断言）：版本、五个公开方法可调用、push 先于 shift /
      shift 先于 push（真实 pending→done 异步语义）、FIFO 顺序、shift_atmost
      批量与空队列 pending、max_items 背压（满时 push 返回 pending 的 Future、
      shift 腾空间后完成）、finish 耗尽后产出空列表，以及 2 个**负例**
      （finish 后 push 必须抛异常 / 空队列 shift 不得 ready，证明非恒真空壳）
    command: "perl -I<site> test_future_queue.pl"
  - file: test_future_queue.py
    description: >-
      L0c 可见入口：校验打包完整性（Future/Queue.pm）后以绝对路径 perl 驱动
      上述 .pl，并校验输出含 ALL OK 标记
    command: "python3 test_future_queue.py <site-perl-dir>"

# 测试断言总数（实测：27）
assertion_count: 27

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游 t/ 套件在 build() 内真实运行（make test），实测 Files=7 / Tests=35 /
  Result: PASS，零失败。唯一 skip 为 t/99pod.t（缺 Test::Pod，见上「已知测试
  缺口」，已如实申报且作为独立任务另排）。**未以 ignore/deselect/allowlist
  规避任何用例**：make test 退出码非 0 时 conan create 直接失败。
