# 软件级 manifest
# 文件位置: archives/f/fcron/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: fcron

# 显示名
display: "Fcron"

# 一句话描述
description: "周期性命令调度器，传统 cron 的现代化替代品"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: system

# 官网 URL
homepage: "http://fcron.free.fr"

# 开源许可证（SPDX 标识）
license: GPL-3.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "鸿蒙系统 /tmp 只读，configure 需要手动生成配置文件或使用 TMPDIR"
    - "C 语言字符串字面量拼接宏不支持，需要使用完整路径宏"
    - "需要创建 fcron 用户和组才能运行守护进程"
    - "配置文件权限必须为 root:fcron 640"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.4.1pre":
    status: published
    build_date: "2026-05-26"