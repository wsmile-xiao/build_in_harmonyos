# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: farmhash/1.1.0
homepage: "https://github.com/google/farmhash"

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# farmhash 上游使用 autotools TESTS 注册 farmhash_unittest，
# 该程序以 FARMHASHSELFTEST=1 编译，启动时运行内嵌自检（覆盖全部哈希函数）。
upstream_tests:
  - file: src/farm-test.cc
    source: farmhash-1.1.0/src/farm-test.cc
    description: "上游单元测试（FARMHASHSELFTEST 自检，覆盖 Hash32/64/128/Fingerprint 全系）"
    command: "./farmhash_unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接 libfarmhash 并断言 6 个上游已知向量"
    command: "./test_farmhash"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 farmhash_unittest 单程序内嵌自检（Test() 遍历自检数据表），
# 实测 1/1 PASS（TOTAL=1, PASS=1, FAIL=0）；test_package 另含 6 个向量断言。
assertion_count: 6
