# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 软件名
software: "farmhash"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/google/farmhash/archive/34c13ddfab0e35422f4c3979f360635a8c050260.tar.gz"

  # 源码校验和
  sha256: "9fb93e0b8881ef96a9f81f9096315eaf3cd727b58d7e2e569ac1208a2a81e76e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-config.guess.patch"
- "0002-config.sub.patch"
- "0003-src-farmhash.cc.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "C++17+libc++ 下 using namespace std; 与全局 data 标识符歧义 → 改名 farmhash_data（见 knowledge/drafts/DRAFT-farmhash-1.1.0-cxx17-std-data-ambiguity）"
- "2015 版 config.guess/sub 不识别 HarmonyOS → 按 E007 增 HarmonyOS/ohos-linux 分支"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  patches_count: 4
  generated_at: '2026-09-11T08:12:00'

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-src-farmhash.cc.patch
    type: auto
    platform_only: True
    guard: 'pending'
