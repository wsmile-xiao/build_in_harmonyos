# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fluent-bit/5.0.9
homepage: "https://fluentbit.io"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# fluent-bit 上游测试用 CMake ctest，需开启 FLB_TESTS_INTERNAL=On。
# 本次 OHOS 适配为应用配方（FLB_TESTS_INTERNAL=Off），ctest 不可用，
# 故 upstream_test_in_build=false；test_package 仅做二进制可执行性断言。
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（OHOS 应用配方下未集成，留空仅做记录）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 由于本配方是 application（cpp_info.libs=[]），test_package 不链接库，
# 而是直接运行已安装的 fluent-bit 二进制验证 --version/--help 退出码。
test_package_tests:
  - file: test.c
    description: "消费者测试：运行已安装的 fluent-bit 二进制并检查 --help 退出码"
    command: "fluent-bit --version && fluent-bit --help"

# 测试断言总数 (近似值, 用于质量评估)
# 2 个：fluent-bit --version 和 --help 退出码均为 0（成功）
assertion_count: 2
