software: fluent-bit
display: "Fluent Bit"
description: "Fast and lightweight log processor and forwarder"
category: utility
homepage: "https://fluentbit.io"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use real OpenSSL/sqlite3/libyaml/musl-fts dependencies instead of dependency stubs."
    - "Add generated monkey header include paths at the top-level CMake scope."
    - "Use musl-fts for BSD fts APIs required by chunkio on HarmonyOS musl."
  common_dependencies:
    - "openssl"
    - "sqlite3"
    - "libyaml"
    - "musl-fts"

versions:
  "5.0.9":
    status: success
    build_date: "2026-08-12"
    conan_ref: "fluent-bit/5.0.9"
