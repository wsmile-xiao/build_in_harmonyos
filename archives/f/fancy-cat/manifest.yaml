# fancy-cat 软件级清单（ARCHIVE-SPEC v2.0）

software: fancy-cat
display: "fancy-cat"
description: "PDF 终端阅读器（Kitty image protocol）"
category: utility
homepage: "https://github.com/freref/fancy-cat"
license: AGPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "Zig 0.15.2 项目（build.zig.zon minimum_zig_version），配方自包含下载 zig 0.15.2 工具链并签名"
    - "mupdf 是 git 子模块，单独下载固定 commit 归档放入 deps/mupdf，build.zig 内 make 构建静态库"
    - "zig 二进制与编译产物需 binary-sign-tool 签名才能在 OHOS 执行"
    - "zig build 的 build_runner execve 在 OHOS 可能被拒（AccessDenied），签名缓存内 ELF 后重试"
    - "上游无测试套件，按 no_tests 审计处理"
  common_dependencies: []

versions:
  "0.6.0.1":
    status: built
