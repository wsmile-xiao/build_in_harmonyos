# fancy-cat/0.6.0 test_package
# Verifies fancy-cat binary is installed and executable

package: fancy-cat/0.6.0.1
homepage: "https://github.com/freref/fancy-cat"

# 上游测试审计：fancy-cat 0.6.0（freref/fancy-cat，Zig 0.15.2 项目）不存在测试套件
# — build.zig 无 test step（仅 addExecutable/addSystemCommand/installArtifact，
#   全文件无 "test" step 定义）；
# — src/ 下无 *_test.zig 测试文件；
# — 上游 CI（.github/workflows/test.yml）仅执行 `zig build`（编译验证）与
#   `zig fmt --check`（格式检查），无任何测试用例/断言。
# 结论：上游无测试，按 no_tests 处理（HMBS_UPSTREAM_TEST_RESULT status=no_tests）。
upstream_tests_exist: false
upstream_test_audit: "审计 fancy-cat 0.6.0 上游（build.zig/build.zig.zon/src/）：1) build.zig 无 test step，仅 addExecutable + addSystemCommand(make mupdf) + installArtifact；2) src/ 目录无 *_test.zig 或 test 相关文件；3) .github/workflows/test.yml 仅 zig build 编译 + zig fmt --check 格式检查，无测试用例。上游确实无测试套件。HMBS_UPSTREAM_TEST_RESULT(status=no_tests) 标记由 test_package test() 每轮复发（包缓存命中时主配方 build() 不执行，靠 test_package 保证标记必现）。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_fancy_cat.c
    description: "验证 fancy-cat 二进制存在且可执行（test() 经 self.run() 真实执行 fancy-cat --version，退出码 0 即通过），R34 反空壳：test() 经 self.run() 执行被测包二进制"
    command: "self.run('\"<fancy_cat_bin>\" --version', env='conanrun')  # test_package/conanfile.py test() 定位 bin/fancy-cat 并执行 --version 验退出码"

assertion_count: 1
