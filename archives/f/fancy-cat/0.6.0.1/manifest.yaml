version: "0.6.0.1"
status: built
build_date: ""

source:
  url: "https://github.com/freref/fancy-cat/archive/refs/tags/v0.6.0.tar.gz"
  tar_format: tar.gz
  sha256: "c40cd59bef243b3bafa80a33ac97d07c54ab27490d13702abeccbd713f59e37c"

build:
  system: zig
  build_command: "zig build --release=small"
  cc: clang
  notes: |
    Zig 0.15.2 项目（build.zig.zon minimum_zig_version），配方自包含下载 zig 0.15.2 工具链。
    mupdf 为 git 子模块（单独下载固定 commit 归档放入 deps/mupdf，由 build.zig 内 make 构建静态库）。
    zig 二进制与编译产物需 binary-sign-tool 签名才能在 OHOS 执行。
    zig build 的 build_runner execve 在 OHOS 上被拒时签名缓存内 ELF 后重试（shell 包装器）。

patches_applied: []

knowledge_gained:
  - "Zig 0.15.2 工具链自包含下载并签名（build.zig.zon 要求 minimum_zig_version=0.15.2）"
  - "mupdf git 子模块需单独下载固定 commit 归档（GitHub tarball 不含子模块内容）"
  - "zig 二进制与编译产物需 binary-sign-tool 签名才能在 OHOS 执行"
  - "zig build 的 build_runner execve 在 OHOS 上被拒（AccessDenied），用 shell 包装器签名缓存内 ELF 后重试"
  - "Conan2 self.run() 的 env 列表不传给子进程，改用 os.environ 注入 ZIG_GLOBAL_CACHE_DIR 等"
  - "mupdf thirdparty 是 git submodule，需 vendor 10 个无条件下必建进 libmupdf-third.a 的库"
  - "OHOS SDK sysroot bits/ 头缺失，vendor zig 发行包自带完整 musl libc 头合并到 deps/ohos-shim"
  - "需显式设置 CC/CXX 指向真机工具链（避免 mupdf C++ 源文件使用 CI 硬编码路径）"
  - "上游无测试套件（build.zig 无 test step，CI 仅 zig build + zig fmt --check），按 no_tests 审计处理"
