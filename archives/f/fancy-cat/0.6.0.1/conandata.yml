# conandata.yml — fancy-cat 0.6.0
# fancy-cat 是 Zig 项目（freref/fancy-cat，终端 PDF 阅读器），需要 Zig 0.15.2
# （build.zig.zon minimum_zig_version；项目仅有 zig/0.16.0，build.zig API 与
# 0.16 不兼容），配方自包含下载 zig 0.15.2 作为构建工具链。
# mupdf 是 build.zig 依赖的 git 子模块（GitHub tarball 不含子模块内容），
# 单独下载固定 commit 归档放入 deps/mupdf，由 build.zig 内 make 构建静态库。

sources:
  # 官方 tag 归档（本机已下载验证 sha256：c40cd59b...）
  # GitHub 直连在真机间歇性超时（2026-08-15 预检），镜像优先、官方兜底（sha256 不变）
  url:
    - "https://gh-proxy.com/https://github.com/freref/fancy-cat/archive/refs/tags/v0.6.0.tar.gz"
    - "https://github.com/freref/fancy-cat/archive/refs/tags/v0.6.0.tar.gz"
  sha256: "c40cd59bef243b3bafa80a33ac97d07c54ab27490d13702abeccbd713f59e37c"

mupdf:
  # fancy-cat 0.6.0 固定 mupdf 子模块 commit 2b0b591153b50a06e64c5a7dd7a33bff8cdc61dc
  # （官方 ArtifexSoftware/mupdf，本机已下载验证 sha256：7da29c1f...）
  # 2026-08-15 真机预检 github.com 直连超时（ConnectTimeoutError）→ gh-proxy.com
  # 镜像优先（ci/conan/build_and_test.sh 维护的 GitHub 映射），官方 URL 最后兜底
  url:
    - "https://gh-proxy.com/https://github.com/ArtifexSoftware/mupdf/archive/2b0b591153b50a06e64c5a7dd7a33bff8cdc61dc.tar.gz"
    - "https://github.com/ArtifexSoftware/mupdf/archive/2b0b591153b50a06e64c5a7dd7a33bff8cdc61dc.tar.gz"
  sha256: "7da29c1ff01bb91c367b99c89a75786c3bf2afe4064a17d8d385af4d90a45c90"

# mupdf 的 thirdparty 是 git submodule：GitHub archive tarball 不含子模块内容
# （2026-08-16 真机预检缺 lcms2mt.h / openjpeg.h 即证据，thirdparty/* 目录全空）。
# 下面 10 个是 Makethird/Makelists 中无条件下必建进 libmupdf-third.a 的库
# （freetype/gumbo-parser/harfbuzz/libjpeg/lcms2/mujs/zlib/jbig2dec/openjpeg/extract；
# tesseract/leptonica/zxing-cpp/zint 由 USE_TESSERACT/USE_ZXINGCPP 开关 gate，
# freeglut 由 HAVE_GLUT=no gate，curl 由系统 curl 探测 gate，均不参与本构建）。
# SHA 为 mupdf 固定 commit 2b0b591 的 gitlink（GitHub trees API 查询所得），
# 归档内容已本机双源（gh-proxy.com vs github 直连）解包逐字节比对一致；
# sha256 为镜像下载值，镜像优先、官方 URL 兜底。
