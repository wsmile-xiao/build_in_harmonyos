# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 实测（aarch64 本机, clang 15）：CTest 注册 52 项测试，52/52 全部通过。

package: fastor/0.6.4
homepage: "https://github.com/romeric/fastor"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（CTest 注册的 52 项, 52/52 通过）
upstream_tests:
  - file: tests/test_auxiliary_funcs
    source: fastor-0.6.4/tests/test_auxiliary_funcs/test_auxiliary_funcs.cpp
    description: "辅助函数功能测试"
    command: "test_auxiliary_funcs"
  - file: tests/test_simd_vectors
    source: fastor-0.6.4/tests/test_simd_vectors/test_simd_vectors.cpp
    description: "SIMD 向量测试 (scalar ABI 回退)"
    command: "test_simd_vectors"
  - file: tests/test_simd_vectors_complex
    source: fastor-0.6.4/tests/test_simd_vectors/test_simd_vectors_complex.cpp
    description: "复数 SIMD 向量测试"
    command: "test_simd_vectors_complex"
  - file: tests/test_tensor_basics
    source: fastor-0.6.4/tests/test_tensor_basics/test_tensor_basics.cpp
    description: "张量基础功能测试"
    command: "test_tensor_basics"
  - file: tests/test_tensormap
    source: fastor-0.6.4/tests/test_tensormap/test_tensormap.cpp
    description: "TensorMap 测试"
    command: "test_tensormap"
  - file: tests/test_numerics
    source: fastor-0.6.4/tests/test_numerics/test_numerics.cpp
    description: "数值功能测试"
    command: "test_numerics"
  - file: tests/test_math_functions
    source: fastor-0.6.4/tests/test_math_functions/test_math_functions.cpp
    description: "数学函数测试"
    command: "test_math_functions"
  - file: tests/test_booleans
    source: fastor-0.6.4/tests/test_booleans/test_booleans.cpp
    description: "布尔运算测试"
    command: "test_booleans"
  - file: tests/test_matmul
    source: fastor-0.6.4/tests/test_matmul/test_matmul.cpp
    description: "矩阵乘法测试 (52 项中 matmul 一组)"
    command: "test_matmul_small"
  - file: tests/test_linalg
    source: fastor-0.6.4/tests/test_linalg/test_linalg.cpp
    description: "线性代数测试"
    command: "test_linalg"
  - file: tests/test_lu
    source: fastor-0.6.4/tests/test_lu/test_lu.cpp
    description: "LU 分解测试"
    command: "test_lu"
  - file: tests/test_qr
    source: fastor-0.6.4/tests/test_qr/test_qr.cpp
    description: "QR 分解测试"
    command: "test_qr"
  - file: tests/test_inverse
    source: fastor-0.6.4/tests/test_inverse/test_inverse.cpp
    description: "矩阵求逆测试"
    command: "test_inverse"
  - file: tests/test_solve
    source: fastor-0.6.4/tests/test_solve/test_solve.cpp
    description: "线性求解测试"
    command: "test_solve"
  - file: tests/test_views_1d
    source: fastor-0.6.4/tests/test_views_1d/test_views_1d.cpp
    description: "1D 视图测试"
    command: "test_views_1d"
  - file: tests/test_views_2d
    source: fastor-0.6.4/tests/test_views_2d/test_views_2d.cpp
    description: "2D 视图测试"
    command: "test_views_2d"
  - file: tests/test_views_nd
    source: fastor-0.6.4/tests/test_views_nd/test_views_nd.cpp
    description: "ND 视图测试"
    command: "test_views_nd"
  - file: tests/test_mixed_views
    source: fastor-0.6.4/tests/test_mixed_views/test_mixed_views.cpp
    description: "混合视图测试"
    command: "test_mixed_views"
  - file: tests/test_complex_expressions
    source: fastor-0.6.4/tests/test_complex_expressions/test_complex_expressions.cpp
    description: "复数表达式测试"
    command: "test_complex_expressions_1"
  - file: tests/test_unary_bool_ops
    source: fastor-0.6.4/tests/test_unary_bool_ops/test_unary_bool_ops.cpp
    description: "一元布尔运算测试"
    command: "test_unary_bool_ops"
  - file: tests/test_binary_cmp_ops
    source: fastor-0.6.4/tests/test_binary_cmp_ops/test_binary_cmp_ops.cpp
    description: "二元比较运算测试"
    command: "test_binary_cmp_ops"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：include Fastor.h 并对 Tensor 执行 matmul/sum 后数值验证"
    command: "./test_fastor"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 200