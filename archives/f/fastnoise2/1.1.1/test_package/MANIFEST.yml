# test_package/MANIFEST.yml — fastnoise2 1.1.1

package: fastnoise2/1.1.1
homepage: "https://github.com/Auburn/FastNoise2"

# 上游测试命令（FASTNOISE2_TESTS=ON 构建 2 个目标，无 CTest 注册，直接运行）
upstream_check_command: "cmake -DFASTNOISE2_TESTS=ON -B build && cmake --build build && ./build/Release/bin/FastNoiseCpp11Test"

# conanfile.py build() 中未集成上游测试（FASTNOISE2_TESTS=OFF on purpose：
# 上游测试在适配验证阶段独立构建运行，见 reports/upstream-tests-ledger.md；
# test_package 已含消费者测试 + HarmonyOS 专项测试覆盖）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/FastNoiseCpp11Include.cpp
    source: FastNoise2-1.1.1/tests/FastNoiseCpp11Include.cpp
    description: "C++11 include/运行测试（独立上游用例：FractalFBm+Simplex+Value 节点树，4x4 网格生成，可观察输出）"
    command: "./FastNoiseCpp11Test"
  - file: tests/FastNoiseBenchmark.cpp
    source: FastNoise2-1.1.1/tests/FastNoiseBenchmark.cpp
    description: "上游基准程序（google/benchmark，按规则不计独立用例，台账单列）"
    command: "./FastNoiseBenchmark"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "消费者测试 — 纯 C 消费 FastNoise2 C API，4x4 网格噪声值域校验"
    command: "./test_fastnoise2"
  - file: ohos_special_test.cpp
    description: "HarmonyOS 专项测试 — __OHOS__ 平台校验(字节序/硬浮点/SIMD) + 生成确定性 + C/C++ API 交叉一致性"
    command: "./test_ohos_special"

# 测试断言总数（上游 1 用例 + 专项 ~100 采样断言，实测）
assertion_count: ~120