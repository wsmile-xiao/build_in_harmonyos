# 版本级 manifest — fastnoise2 1.1.1
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.1"

# 软件名
software: fastnoise2

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方）
  url: "https://github.com/Auburn/FastNoise2/archive/refs/tags/v1.1.1.tar.gz"

  # 源码校验和（官方 tag v1.1.1，经 codeload 下载核验）
  sha256: "e460592c32e9b1a2cf6e6f6aea5e16c9fe23c68bd185adb315202a5a993656b9"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DFASTNOISE2_TOOLS=OFF"
  - "-DFASTNOISE2_TESTS=OFF"
  - "-DFASTNOISE2_UTILITY=OFF"
  - "-DCMAKE_SYSTEM_NAME=Linux"

  # 编译依赖列表（格式: name/version）
  # 内嵌依赖 FastSIMD（CPM 本地注入，精确 commit 16450dae）+ benchmark 1.5.5（测试用）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-cpm-fastsimd-local-source.patch"
- "0002-cpm-benchmark-local-source.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "FastNoise2 通过 CPM 拉取 FastSIMD 依赖，CI 禁 GitHub 网络时必须用 CPM SOURCE_DIR 本地注入依赖源码并打补丁自包含构建"
- "FastSIMD/FastSIMD_FastNoise 为 OBJECT 库，对象并入 libFastNoise.a，package_info 只声明 FastNoise 一个 lib"
- "C API (FastNoise_C.h) 未自带 stdbool.h，纯 C 消费者需先包含 <stdbool.h>；编码节点树必须使用上游 Base64 编码串（DemoNodeTrees.inl），可读格式串解析返回 NULL"
- "libFastNoise.a 含 C++ 对象，纯 C 消费者链接时需 LINKER_LANGUAGE CXX（C++ 链接器驱动）"
