software: fb303
# 版本级 manifest 模板
# 文件位置: archives/f/fb303/v2026.05.18.00/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "v2026.05.18.00"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/facebook/fb303/archive/refs/tags/v2026.05.18.00.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DENABLE_THRIFT_SERVICE=OFF"
    - "-Dglog_DIR=/storage/Users/currentUser/usr/local/lib/cmake/glog"
    - "-DGFLAGS_LIBRARY=/storage/Users/currentUser/usr/local/lib/libgflags.so"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "folly/v2026.05.18.00"
    - "glog/0.7.1"
    - "gflags/2.2.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-disable-thrift-service.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "fb303 依赖 FBThrift，但 FBThrift 需要 std::pmr 支持，OpenHarmony 暂不支持"
  - "方案 A：禁用 Thrift 服务（ENABLE_THRIFT_SERVICE=OFF）可成功编译核心库"
  - "禁用 Thrift 后需排除 BaseService.cpp 和 TFunctionStatHandler.cpp"
  - "使用 glog::glog 目标名而非 Glog::glog"