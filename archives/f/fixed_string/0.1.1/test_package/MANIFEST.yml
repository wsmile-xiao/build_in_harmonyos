# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fixed_string/0.1.1
homepage: "https://github.com/unterumarmung/fixed_string"

# 上游测试命令 (用于 ctest -N / 手动编译分析)
upstream_check_command: "cmake -DFIXED_STRING_OPT_BUILD_TESTS=ON .. && cmake --build . && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "./upstream_test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: fixed_string-0.1.1/test/test.cpp
    description: "Catch2 单元测试: basic_fixed_string 构造/比较/拼接/哈希等"
    command: "./upstream_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "按 Conan 生成的头文件调用 fixed_string API (constexpr 构造/比较/拼接)"
    command: "./test_fixed_string"

# 测试断言总数 (上游 Catch2 实测 76 条)
assertion_count: 76