software: fakeroot
version: "1.37.1.2"
status: built
build_date: "2026-08-18"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/f/fakeroot/fakeroot_1.37.1.2.orig.tar.gz"
  sha256: "959496928c8a676ec8377f665ff6a19a707bfad693325f9cc4a4126642f53224"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-libcap"
    - "--disable-acl"
    - "--with-ipc=tcp"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-libfakeroot-SEND_GET_XATTR.patch"

knowledge_gained:
  - "fakeroot 通过 LD_PRELOAD 拦截系统调用模拟 root 环境"
  - "OHOS 适配：config.guess/config.sub 增加 HarmonyOS 分支，configure 修复 mktemp/umask"
  - "OHOS 交叉编译：--build/--host 显式指定，关闭 libcap/ACL"
  - "OHOS 沙箱禁 sysv IPC（msgget 触发 SIGSYS）——--with-ipc=tcp 用 TCP 通信绕过"
  - "OHOS musl 无 STAT64_SUPPORT——INT_SEND_GET_XATTR 走无64宏分支未定义——补 SEND_GET_XATTR 宏"
  - "上游测试 make check：10/15 通过（4 FAIL 为 toybox/busybox 工具差异：chmod -h、chown --reference、cp -r 权限、无 daemon 用户——系统级阻塞如实记录）"
