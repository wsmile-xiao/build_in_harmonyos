software: fakeroot
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.37.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.37.2"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶层字段，G4门禁必需）
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/f/fakeroot/fakeroot_1.37.2.orig.tar.gz"

  # 源码校验和
  sha256: "0eea60fbe89771b88fcf415c8f2f0a6ccfe9edebbcf3ba5dc0212718d98884db"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS umask 077 创建的目录无法写入，需将 config.status/configure 中的 umask 077 改为 umask 022"
  - "fakeroot LD_PRELOAD 核心功能(getuid/chown拦截)在鸿蒙上可用，但部分测试因缺少系统命令(chown/mknod)和HMDFS权限限制而失败"
  - "config.guess/config.sub 需打 OHOS 补丁（E007）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/fakeroot-1.37.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/fakeroot-1.37.2.work
  source_orig_hash: 9a92b191dc2def5d
  source_work_hash: 6bea22c5ab6badf4
  generated_at: '2026-05-26T02:16:11'
  patches_count: 3

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
