# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: fixed_math/2.2.0
homepage: "https://github.com/arturbac/fixed_math"

# 上游单元测试（unit_tests/，boost-ext/ut 13 个可执行 + 1 个未注册源文件）——
# 上游 unit_tests/CMakeLists.txt 用 CPMAddPackage 从 GitHub 拉 arturbac/ut-ext，
# CI worker 网络禁 GitHub，配方构建时 -DFIXEDMATH_ENABLE_UNIT_TESTS=OFF 关闭
# （header-only 库，test_package 补消费者测试；上游测试单独枚举运行）
upstream_check_command: "echo \"upstream unit tests use CPMAddPackage from GitHub (blocked on CI); disabled via -DFIXEDMATH_ENABLE_UNIT_TESTS=OFF\""

upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源（完整枚举见本轮回报台账：13 个 add_fixedmath_ut 注册可执行
# + hypot_not_abacus.cc 未注册源文件 + 3 个 examples + perf_test_suite）
upstream_tests:
  - file: unit_tests/fixed_construction_ut.cc
    description: "fixed_t 构造/类型语义编译期测试"
  - file: unit_tests/type_convertions_ut.cc
    description: "类型转换测试"
  - file: unit_tests/addition_ut.cc
    description: "加法测试"
  - file: unit_tests/subtraction_ut.cc
    description: "减法测试"
  - file: unit_tests/sqrt_ut.cc
    description: "sqrt 测试"
  - file: unit_tests/multiplication_ut.cc
    description: "乘法测试"
  - file: unit_tests/division_ut.cc
    description: "除法测试"
  - file: unit_tests/modulo_ut.cc
    description: "取模测试"
  - file: unit_tests/misc_functions_ut.cc
    description: "杂项函数测试"
  - file: unit_tests/sin_cos_ut.cc
    description: "sin/cos 测试"
  - file: unit_tests/tan_ut.cc
    description: "tan 测试"
  - file: unit_tests/atan_ut.cc
    description: "atan 测试"
  - file: unit_tests/string_convertion_ut.cc
    description: "字符串转换测试"
  - file: unit_tests/hypot_not_abacus.cc
    description: "hypot 测试源（未在 CMake 注册的可执行）"

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_fixed_math.cpp
    description: "消费者探针：fixed_t 算术 + fobj::sin/cos + func::atan2 + from_string，验证 header-only 库可用"
    command: "clang++ -std=c++2b test_fixed_math.cpp -o test_fixed_math_probe && ./test_fixed_math_probe"

# 断言总数（test_package 4 组断言）
assertion_count: 4
