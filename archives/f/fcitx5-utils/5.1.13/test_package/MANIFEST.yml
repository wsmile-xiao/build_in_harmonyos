# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fcitx5-utils/5.1.13
homepage: https://github.com/fcitx/fcitx5

# Fcitx5Utils 是 fcitx5 源码树内纯库组件（src/lib/fcitx-utils），
# 无独立发布仓库，组件内无 add_executable/测试目标；fcitx5 顶层 test/
# 属于 fcitx5 core 范畴（另一任务），与 Fcitx5Utils 组件无直接对应测试入口。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 测试实质调用被测包 API — find_package + 链接 + stringutils/Key/Semver/StandardPaths
test_package_tests:
  - file: test_package/test_fcitx5_utils.cpp
    description: "find_package(Fcitx5Utils 5.1.13 REQUIRED) + 链接 Fcitx5::Utils + 实际运行调用 stringutils::trim / Key / Semver / StandardPaths API（鸿蒙 aarch64 真机运行）"
    command: "cmake --build . --target test_fcitx5_utils && ctest"

# 测试断言总数 (trim 断言 1 + Key 解析有效 1 + KeySym/KeyState 2 + Semver 2 + StandardPaths 调用 2 + 退出码 0)
assertion_count: 9