software: fcitx5-utils
version: "5.1.13"
status: built
build_date: "2026-09-22"
build_system: cmake

source:
  url: "https://github.com/fcitx/fcitx5/archive/refs/tags/5.1.13.tar.gz"
  tar_format: tar.gz
  sha256: "7621a7e4ea5545591fa8a5b1913ce1f7aec51158104a4fb1a28a7fe5b61c2fb6"

build:
  system: cmake
  configure_options: "-DENABLE_DBUS=Off -DEVENT_LOOP_BACKEND=none"

patches_applied:
  - "0001-standardpaths-ohos-ranges-compat.patch"
  - "0002-ohos-libcpp-missing-cxx20.patch"
  - "0003-i18n-format-guard.patch"

knowledge_gained:
  - "fcitx5-utils 是 fcitx5 源码树内 Fcitx5Utils 组件 (src/lib/fcitx-utils/)，无独立发布仓库，上游归档取自 fcitx5 tag 5.1.13"
  - "组件 CMakeLists 设计为从 fcitx5 顶层并入，独立构建需用 wrapper CMakeLists 等价复刻顶层上下文（ECM ecm_setup_version / cmake find 模块 / FCITX_INSTALL_* / config.h 生成）"
  - "OHOS sysroot 的 libintl.h 是空壳（353B，无任何函数声明），dgettext 不在 OHOS libc 中，必须依赖 gettext 包的真实 libintl 才能编译 i18n.cpp"
  - "OHOS 无 systemd/libuv 依赖时 EVENT_LOOP_BACKEND=none 是合法内置后端（event_none.cpp，纯库零外部事件循环依赖）"
  - "ecm_setup_version 需要 ECM 的 ECMSetupVersion 模块，extra-cmake-modules/6.19.0 已在 ohpcd 发布可作 tool_requires"