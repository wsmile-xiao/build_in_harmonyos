sources:
  url:
    - "https://github.com/fcitx/fcitx5/archive/refs/tags/5.1.13.tar.gz"
  sha256: "7621a7e4ea5545591fa8a5b1913ce1f7aec51158104a4fb1a28a7fe5b61c2fb6"

patches:
  - patch_file: "patches/0001-standardpaths-ohos-ranges-compat.patch"
    description: >
      OHOS 附带的 libcxx-ohos 裁剪了 C++20 <ranges>（头文件仅存骨架，
      std::ranges::transform/copy 与 std::views 均缺失）。将 standardpaths_p_unix.cpp
      中的 std::ranges/std::views 用法改写为标准 std::transform/std::copy 与
      等价循环（语义不变；仅影响 OHOS 编译路径，补丁对全部平台生效但等价）。
      先例：ada-url/ada 等 pkg 对 OHOS libc++ 的同类适配。
  - patch_file: "patches/0002-ohos-libcpp-missing-cxx20.patch"
    description: >
      OHOS 附带 libcxx-ohos 裁剪版缺失以下 C++20 设施（实测探测确认）：
      std::format、std::hash<std::filesystem::path>、std::views。
      逐一等价改写（语义不变）：
      - eventloopinterface.cpp：std::format → 字符串拼接
      - misc.cpp：std::format("/proc/{pid}/exe") → std::to_string 拼接
      - semver.cpp：std::format 版本串 → std::to_string 拼接
      - log.cpp：chrono std::format 日志时间 → strftime（%F %T 等价输出）
      - standardpaths_p_unix.cpp：std::unordered_set<filesystem::path>
        （依赖缺失的 hash<fs::path>）→ std::set（用 operator< 排序去重，语义等价）
      - testing.cpp：std::views::transform 拼接 → 显式循环 vector<string>
      先例：ada-url/ada/bitcoin 等 pkg 对 OHOS 裁剪 libc++ 的同类适配。
  - patch_file: "patches/0003-i18n-format-guard.patch"
    description: >
      i18n.h 的 translate()/translateCtx()/translateDomain()/translateDomainCtx()
      格式化模板使用 std::format_string/std::vformat/std::make_format_args，
      OHOS 裁剪版 libc++ <format> 无 __cpp_lib_format（实测 NO_FORMAT）。
      将守卫改为 __cplusplus >= 202002L && defined(__cpp_lib_format)：完整
      <format> 平台保留模板；OHOS 裁剪版跳过（组件内无多参数 translate 调用，
      非模板 translate(const char*/std::string) 重载仍在，等价）。