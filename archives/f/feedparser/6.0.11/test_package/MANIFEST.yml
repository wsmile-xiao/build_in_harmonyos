# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: feedparser/6.0.11
homepage: "https://github.com/kurtmckee/feedparser"

upstream_check_command: "python3 -m pytest tests/"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/"

upstream_tests:
  - name: tests/（pytest 套件）
    count: "N/A"
    description: "本轮未在 OHOS 上全量运行（N/A）——上游为 pytest 套件，CI 纯
      conan 流程不引入 pytest；不伪造通过数（WR-006）。等效验证以 test_package
      对打包产物的真实 parse 调用为准（R34）。"

test_package_tests:
  - file: test_feedparser.py
    description: "消费者测试（R34）：feedparser.parse() 字符串路径（完全离线）、
      条目字段、sgmllib3k 在导入路径上的联动（site-all PYTHONPATH 拼接）。"
    command: "python3 test_feedparser.py <site-packages>"

assertion_count: 6
