# test_package/MANIFEST.yml — fusion 1.3.3
# 上游官方测试声明：Fusion 1.3.3 上游无独立测试目录/测试框架；
# 可运行入口为 Examples/C 下两个示例程序（Simple/Advanced），
# 上游 Python 侧另有 test_*.py 脚本（依赖 imufusion 绑定 + numpy/scipy，
# 属 Python 打包绑定层示例，非 C 库测试）。
package: fusion/1.3.3
homepage: "https://github.com/xioTechnologies/Fusion"

upstream_check_command: "ctest -N"  # 上游 CMake 未启用 enable_testing，ctest 为空

# conanfile.py build() 中未集成上游测试（上游无 C 测试框架）
upstream_test_in_build: false
upstream_test_command: ""

# 上游可运行示例（C 库无独立测试用例，示例为唯一可运行入口）
upstream_tests:
  - file: Examples/C/Simple/main.c
    source: fusion-1.3.3/Examples/C/Simple/main.c
    description: "Simple AHRS 示例：静止 IMU 输出零欧拉角"
    command: "./Simple-Example"
  - file: Examples/C/Advanced/main.c
    source: fusion-1.3.3/Examples/C/Advanced/main.c
    description: "Advanced AHRS 示例：含磁力计补偿与欧拉角输出"
    command: "./Advanced-Example"

# test_package 自带的消费者视角验证（R34 实质调用公开 API）
test_package_tests:
  - file: test.c
    description: "消费者测试：FusionAhrs 姿态解算收敛 + 传感器模型"
    command: "./test_fusion"

# 测试断言总数（近似）
assertion_count: 5
