software: fusion
display: "Fusion"
description: "IMU 传感器融合 C 库：AHRS 姿态解算（Madgwick 算法）、Bias 校准、磁力计补偿、坐标重映射与传感器模型"
category: library
homepage: "https://github.com/xioTechnologies/Fusion"
license: MIT
build_system: cmake

versions:
  "1.3.3":
    status: built
    build_date: "2026-09-19"
    notes: >-
      Fusion 1.3.3 首版适配：纯 C 静态库，无第三方运行时依赖。
      上游 CMake 无 install 规则，配方 package() 手动装配公开头与 libFusion.a；
      test_package 通过公开 API 验证 AHRS 静止收敛与传感器模型输出。
      上游无独立 C 测试框架，可运行入口为 Examples/C 两个示例程序。
