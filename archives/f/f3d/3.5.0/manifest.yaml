name: f3d
version: "3.5.0"
build_system: cmake
url: "https://github.com/f3d-app/f3d"
license: "BSD-3-Clause"
description: "A fast and minimalist 3D viewer powered by VTK"
status: built
deps:
  - name: vtk
    version: "9.4.1"
    type: runtime
build_options:
  F3D_MODULE_RAYTRACING: OFF
  F3D_MODULE_EXR: OFF
  F3D_MODULE_WEBP: OFF
  F3D_MODULE_CLIP: OFF
  F3D_MODULE_UI: ON
  F3D_PLUGINS_STATIC_BUILD: ON
  BUILD_TESTING: ON
  F3D_TESTING_ENABLE_RENDERING_TESTS: ON
  F3D_TESTING_ENABLE_EGL_TESTS: ON
  F3D_TESTING_ENABLE_GLX_TESTS: OFF
  F3D_TESTING_ENABLE_OSMESA_TESTS: OFF
  F3D_BINDINGS_C: OFF
  F3D_BINDINGS_PYTHON: OFF
  F3D_BINDINGS_JAVA: OFF
patches:
  - file: "0001-fix-harmonyos-runtime-dep-set.patch"
    purpose: "skip CMake install RUNTIME_DEPENDENCY_SET on HarmonyOS"
  - file: "0002-gles31-compute-include.patch"
    purpose: "GLES3/gl31.h include for compute shader APIs"
  - file: "0003-gles-timer-query.patch"
    purpose: "map desktop timer-query APIs to GLES EXT_disjoint_timer_query"
  - file: "0004-libf3d-soname.patch"
    purpose: "bare SONAME on libf3d for LD_LIBRARY_PATH resolution"
  - file: "0005-vtkext-soname.patch"
    purpose: "bare SONAME on vtkext for LD_LIBRARY_PATH resolution"
notes: >
  f3d 3.5.0 adapted for HarmonyOS PC (aarch64).
  Primary dependency: vtk/9.4.1 (already published).
  External deps (cxxopts, nlohmann_json, dmon, imgui, tinyfiledialogs) bundled in source.
  Optional modules (raytracing, EXR, WebP, clip) disabled due to missing platform support.
  All plugins requiring unavailable deps (Alembic, ASSIMP, Draco, HDF, OCCT, USD, VDB, PDAL, WebIFC) disabled.
  Application produces f3d executable + libf3d shared library.
  Upstream tests enabled: source() fetches git-LFS test data from the GitHub
  media CDN (tarball ships LFS pointer stubs which make CMake abort);
  rendering tests run via EGL on the OHOS PC device GPU (Maleoon 916,
  GLES 3.2). CI headless workers auto-skip via EGL probe.
