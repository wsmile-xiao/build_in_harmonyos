sources:
  - url: "https://github.com/f3d-app/f3d/archive/refs/tags/v3.5.0.tar.gz"
    sha256: "033845b5d49af3ae60fcc3fe85d82c841d990d3534638a4472123f84b3e82795"

patches:
  - patch_file: "patches/0001-fix-harmonyos-runtime-dep-set.patch"
    patch_description: "Fix CMake install RUNTIME_DEPENDENCY_SET not supported on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0002-gles31-compute-include.patch"
    patch_description: "Add GLES3/gl31.h include for compute shader APIs (glDispatchCompute) missing from vtk_glad.h GLES3 mode"
    patch_type: "portability"
  - patch_file: "patches/0003-gles-timer-query.patch"
    patch_description: "Map desktop GL_TIME_ELAPSED/glGetQueryObjectiv to GLES EXT_disjoint_timer_query equivalents"
    patch_type: "portability"
  - patch_file: "patches/0004-libf3d-soname.patch"
    patch_description: "Set explicit SONAME on libf3d so DT_NEEDED is a bare name resolvable via LD_LIBRARY_PATH"
    patch_type: "portability"
  - patch_file: "patches/0005-vtkext-soname.patch"
    patch_description: "Set explicit SONAME on vtkext for LD_LIBRARY_PATH resolution"
    patch_type: "portability"
