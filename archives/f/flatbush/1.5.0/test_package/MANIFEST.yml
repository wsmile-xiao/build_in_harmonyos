# test_package/MANIFEST.yml
# 上游官方测试声明文件（L0e 强制要求）
# flatbush 1.5.0 为 header-only 库；上游测试见 test.cpp / fuzz.cpp / bench.cpp

package: flatbush/1.5.0
homepage: "https://github.com/chusitoo/flatbush"

# 上游测试命令（ctest -N 对应 unit_test 目标，gtest 注册 110 例）
upstream_check_command: "ctest -N -DWITH_TESTS=ON"
upstream_test_in_build: false
upstream_test_command: "./build/unit_test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test.cpp
    source: flatbush-1.5.0/test.cpp
    description: "gtest 单元测试：70 个 TEST + 5 个 TYPED_TEST（8 类型实例化，共 110 例 gtest 用例）"
    command: "./unit_test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_flatbush.cpp
    description: "消费者用例：添加矩形/点、finish、bbox 搜索、最近邻、跨类型重建"
    command: "./test_flatbush"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 110