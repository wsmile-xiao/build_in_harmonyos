# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fpzip/1.3.0
homepage: "https://github.com/LLNL/fpzip"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -V"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ctest 单测: compress-decompress-validate)
upstream_tests:
  - file: tests/testfpzip.c
    source: fpzip-1.3.0/tests/testfpzip.c
    description: "上游回归测试：float/double 多精度压缩-解压-校验"
    command: "./testfpzip"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：double 数组写/读往返一致性 (fpzip_write_*/fpzip_read_*)"
    command: "./test_fpzip"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 512