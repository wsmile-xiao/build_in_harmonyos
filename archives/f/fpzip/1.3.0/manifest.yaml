# 版本级 manifest — fpzip 1.3.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.3.0"
software: "fpzip"
status: built
build_date: "2026-09-03"
build_system: "cmake"

source:
  url: "https://github.com/LLNL/fpzip/archive/refs/tags/1.3.0.tar.gz"
  sha256: "248df7d84259e3feaa4c4797956b2a77c3fcd734e8f8fdc51ce171dcf4f0136c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DFPZIP_FP=FPZIP_FP_SAFE"
    - "-DBUILD_UTILITIES=OFF"
    - "-DBUILD_TESTING=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "fpzip 1.3.0 上游 CMakeLists 声明 cmake_minimum_required(3.1)，CMake >= 4 已移除 <3.5 兼容，须以 cache 变量 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 传入（toolchain 变量不生效）"
  - "fpzip 为纯 C++ 库，test_package 必须用 C++ 项目链接（libfpzip.a 引用 C++ 运行时符号），纯 C 项目链接报 undefined symbol: operator new/__cxa_*"
