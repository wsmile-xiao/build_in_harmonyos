# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ffc.h/26.07.01
homepage: "https://github.com/kolemannix/ffc.h"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test && ./out/test_runner && ./out/test_int_runner"

# conanfile.py build() 方法中是否已集成上游测试 (header-only: 无 build 步骤)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (源码声明 -> 构建目标 -> ctest 注册项)
upstream_tests:
  - file: test_src/test.c
    source: ffc.h-26.07.01/test_src/test.c
    description: "浮点数解析 CSV 用例 + 特殊值/JSON 模式单元测试 (test_runner)"
    command: "./out/test_runner"
  - file: test_src/test_int.c
    source: ffc.h-26.07.01/test_src/test_int.c
    description: "整数解析单元测试 (test_int_runner)"
    command: "./out/test_int_runner"
  - file: test_src/supplemental_tests.c
    source: ffc.h-26.07.01/test_src/supplemental_tests.c
    description: "fastfloat supplemental 数据文件比对测试 (supplemental_tests)"
    command: "./out/supplemental_tests"
  - file: test_src/test_exhaustive.c
    source: ffc.h-26.07.01/test_src/test_exhaustive.c
    description: "float32 穷举验证 (test_exhaustive_runner)"
    command: "./out/test_exhaustive_runner"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 ffc_parse_double_simple / ffc_parse_i64_simple 验证公开 API"
    command: "./test_ffc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
