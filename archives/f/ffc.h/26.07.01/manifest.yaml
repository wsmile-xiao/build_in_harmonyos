# 版本级 manifest
# 文件位置: archives/f/ffc.h/26.07.01/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "26.07.01"

# 软件名
software: "ffc.h"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "header-only"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://github.com/kolemannix/ffc.h/archive/refs/tags/v26.07.01.tar.gz"

  # 源码校验和（SHA-256，与 conandata.yml 一致）
  sha256: "78bc47d4bd2cf28c1487134e428214cdd105757527897ff8cd1ad226d31e7890"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（header-only 库：无编译产物，上游 CMake INTERFACE + Makefile 测试）
  # cmake | autotools | makefile | meson | custom
  system: header-only

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Makefile 用 `ifeq ($(UNAME_S),Linux)` 平台检测决定 -D_DEFAULT_SOURCE 时，OHOS 的 uname -s 返回 HarmonyOS 不匹配，导致 madvise/MADV_* 等 POSIX 声明缺失；编译需显式加 -D_DEFAULT_SOURCE -D_POSIX_C_SOURCE=200809L（与上游 CMakeLists 声明一致）。"
  - "Makefile 硬编码 gcc 的库在 OHOS 环境（只有 clang）报 'make: gcc: No such file or directory'；可用 gcc→clang 符号链接垫片（不改上游源码）解决。"
  - "包名含点号（如 ffc.h）时 conan-init 模板生成含点号的 Python 类名（Ffc.HTestConan）导致 SyntaxError；需改为合法标识符；CMakeDeps 的 cmake_file_name 需与 find_package 名一致。"
  - "ffc.h 为 FFC_IMPL 单头实现库：消费者 TU 需 #define FFC_IMPL 才能链接实现（test_package 前置定义）。"
