software: fcft
display: "fcft"
description: "Simple library for font loading and glyph rasterization using FontConfig, FreeType and pixman"
category: gfx
homepage: "https://codeberg.org/dnkl/fcft"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 构建，需 fontconfig、freetype、pixman 三个前置依赖"
    - "文档与示例默认关闭，SVG 使用内置 nanosvg，无需额外依赖"
    - "为保持依赖闭包最小，文本整形（harfbuzz/utf8proc）显式关闭"
  common_dependencies:
    - fontconfig
    - freetype
    - pixman

versions:
  "3.3.3":
    status: built
    build_date: "2026-09-09"
