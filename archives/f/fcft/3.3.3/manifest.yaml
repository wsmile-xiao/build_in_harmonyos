version: "3.3.3"
software: "fcft"
status: built
build_date: "2026-09-09"
build_system: meson

source:
  url: "https://codeberg.org/dnkl/fcft/releases/download/3.3.3/fcft-3.3.3.tar.gz"
  sha256: "bb298772d625e7d917373d541456f34f1957a9e22b16f17f64158b2c3816563c"
  tar_format: tar.gz
  vendored:
    - name: "tllist"
      version: "1.1.0"
      url: "https://codeberg.org/dnkl/tllist/releases/download/1.1.0/tllist-1.1.0.tar.gz"
      sha256: "a1f0ce0dc4fcb4ce59c37202a1d914c853a8bd2d7c5d57d623b15a8dd9778767"
      dest: "subprojects/tllist"
      reason: "meson fallback tllist被conan禁用wrap下载，内置固定版本子项目"

build:
  system: meson
  configure_options:
    - "-Ddefault_library=shared"
    - "-Ddocs=disabled"
    - "-Dexamples=false"
    - "-Dsvg-backend=nanosvg"
    - "-Dsystem-nanosvg=disabled"
    - "-Dgrapheme-shaping=disabled"
    - "-Drun-shaping=disabled"
    - "-Dtest-text-shaping=false"
  dependencies:
    - "fontconfig/2.18.1.1"
    - "freetype/2.14.3"
    - "pixman/0.46.4"
  test_requires:
    - "check/0.15.2"
  build_tools:
    - "meson/1.11.0 (tool_requires)"
    - "pkgconf/3.0.5 (tool_requires)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Meson feature auto would pull harfbuzz/utf8proc; explicitly disabled to keep closure minimal"
  - "conan MesonToolchain omits ar/ranlib; inject llvm-ar full path into conan_meson_native.ini"
  - "meson install rewrites rpath and breaks OHOS self-sign; re-sign libfcft.so in package()"
  - "Upstream tests need check via test_requires plus fonts; consumer test skips font checks cleanly without fonts"
