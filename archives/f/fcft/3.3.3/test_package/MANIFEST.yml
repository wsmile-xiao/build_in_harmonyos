package: "fcft/3.3.3"
homepage: "https://codeberg.org/dnkl/fcft"

upstream_check_command: "meson test --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test --print-errorlogs"

upstream_tests:
  - file: test.c
    source: "fcft-3.3.3/test.c"
    description: "Upstream check-framework suite (5 START_TEST cases: capabilities, from_name, glyph_rasterize, precompose, emoji_zwj)"
