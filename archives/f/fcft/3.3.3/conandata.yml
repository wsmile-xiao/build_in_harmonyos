  tllist:
    # NOTE (CI #43176/#43244/#43291/#43331): codeberg releases/download
    # answers sustained HTTP 429 from shared CI egress IPs (all attempts
    # failed in 4 consecutive builds), and the web.archive.org snapshot
    # added in #43291 times out from CI workers (ConnectTimeout in #43331),
    # so it is NOT listed. Gentoo mirrors are intentionally not listed
    # either: their tllist-1.1.0.ebuild uses
    # SRC_URI=.../tllist/archive/${PV}.tar.gz (git-archive artifact,
    # Manifest size 7639), every copy hashing to 0e7b7094..., which can
    # never verify against the releases artifact pinned below (7671 bytes,
    # getsolus pins the same); a 256-shard scan of the CN Gentoo mirror
    # confirmed the releases file is absent there.
    # Resilience comes from source(): the official URL below stays the
    # single primary (R39, sha256 unchanged); if it is unreachable, source()
    # falls back to vendor/tllist-1.1.0/ (exact extraction of this tarball,
    # per-file sha256 verified; see conanfile._VENDORED_TLLIST_FILES).
    url: "https://codeberg.org/dnkl/tllist/releases/download/1.1.0/tllist-1.1.0.tar.gz"
    sha256: "a1f0ce0dc4fcb4ce59c37202a1d914c853a8bd2d7c5d57d623b15a8dd9778767"
patches: {}
