# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 移除了对 cmake_minimum_required < 3.5 的支持，需提升最低版本要求"
  - "CMake 4.x 移除了 LOCATION 属性，需替换为 $<TARGET_FILE:> 生成器表达式"
  - "Expat CMakeLists.txt 使用 CRLF 行尾，replace_in_file 需分段替换"
  - "鸿蒙平台 dlopen/dlsym 限制导致 CS FMU 动态加载测试失败 (5/26)"
  - "make -j2 会因 mkfifo 权限报错，需使用 make -j1"
  - "GitHub 在中国大陆网络环境下访问不稳定，conanfile.py 需支持本地源码回退"

