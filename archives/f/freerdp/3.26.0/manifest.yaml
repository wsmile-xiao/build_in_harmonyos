software: freerdp
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.26.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.26.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/freerdp-3.26.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型（顶层字段，用于验证）
build_system: cmake

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DZLIB_LIBRARY=/storage/Users/currentUser/usr/local/lib/libz.a"
    - "-DZLIB_INCLUDE_DIR=/storage/Users/currentUser/usr/local/include"
    - "-DOPENSSL_ROOT_DIR=/storage/Users/currentUser/usr/local"
    - "-DWITH_FFMPEG=OFF"
    - "-DWITH_PCSC=OFF"
    - "-DWITH_CAIRO=OFF"
    - "-DWITH_SWSCALE=OFF"
    - "-DWITH_OPUS=OFF"
    - "-DWITH_WAYLAND=OFF"
    - "-DWITH_X11=OFF"
    - "-DWITH_KRB5=OFF"
    - "-DWITH_GSSAPI=OFF"
    - "-DWITH_UNICODE_BUILTIN=ON"
    - "-DWITH_CUPS=OFF"
    - "-DWITH_CHANNELS=OFF"
    - "-DWITH_FUSE=OFF"
    - "-DWITH_SERVER=OFF"
    - "-DWITH_SAMPLE=OFF"
    - "-DWITH_SHADOW=OFF"
    - "-DWITH_PROXY=OFF"
    - "-DWITH_PLATFORM_SERVER=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - openssl/3.5.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "FreeRDP 是 CMake 项目，需要指定 ZLIB 和 OpenSSL 路径"
    - "需要禁用大量可选依赖才能在鸿蒙上编译：FFmpeg, PCSC, Cairo, Wayland, X11, Kerberos, ICU"
    - "使用 WITH_UNICODE_BUILTIN=ON 避免对 ICU 的依赖"
    - "禁用 server 功能以避免 channels 相关链接问题"
