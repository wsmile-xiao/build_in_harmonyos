sources:
  "3.6.0":
    url: "https://github.com/flintlib/flint/releases/download/v3.6.0/flint-3.6.0.tar.gz"
    sha256: "b95e2c7792f5eea4a1c8d2d42c4098434756832e57a094b295eb5dfdc9b4c36b"
patches:
  "3.6.0":
    - patch_file: "patches/0001-config.guess-ohos.patch"
      patch_description: "0001 config.guess recognize HarmonyOS as linux-ohos"
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub-ohos.patch"
      patch_description: "0002 config.sub accept linux-ohos triples"
      patch_type: "portability"
    - patch_file: "patches/0003-configure-umask-022.patch"
      patch_description: "0003 configure umask 077 to 022 for HMDFS temp dirs"
      patch_type: "portability"
    - patch_file: "patches/0004-qsieve-tmpdir.patch"
      patch_description: "0004 qsieve honor TMPDIR for relations temp file (OHOS /tmp read-only)"
      patch_type: "portability"
    - patch_file: "patches/0005-test-tmpfile-tmpdir.patch"
      patch_description: "0005 dump_file tests use TMPDIR-aware tmpfile equivalent"
      patch_type: "portability"
