software: fonts-encodings
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.x.org/archive/individual/font/encodings-1.1.0.tar.xz"

  # 源码校验和
  sha256: "9ff13c621756cfa12e95f32ba48a5b23839e8f577d0048beda66c67dab4de975"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-fontrootdir=${prefix}/share/fonts/X11"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 文件系统不允许写入 700 权限目录，autotools configure 的 umask 077 需改为 022"
  - "config.guess 需添加 HarmonyOS 到 Linux 匹配规则，uname -s 返回 HarmonyOS"
  - "mkfontscale 不在预编译包中，可创建 wrapper 脚本生成 encodings.dir"
  - "X.Org XORG_FONTSUBDIR 宏检测系统字体路径而非 prefix，需 --with-fontrootdir 参数"
  - "数据包 G4 门禁可通过创建 lib/pkgconfig/*.pc 文件满足"

