# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# R51 清点证据：上游无独立 tests/ 目录、无 ctest/pytest 注册
# （源码树仅 8 个文件：CMakeLists.txt/LICENSE/README.md/main.c/dr_mp3.h/dr_wav.h/stb_fft.h/timing.h）

package: fftresampler/2.8
homepage: "https://github.com/cpuimage/FFTResampler"

# 上游测试命令（本库为 CMake 项目且无测试目标；ctest -N 注册数 = 0）
upstream_check_command: "cmake -S . -B build && ctest --test-dir build -N"

# conanfile.py build() 方法中是否已集成上游测试（上游无测试，未集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 —— 上游无任何测试，清点证据见上）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用已安装二进制）
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 生成 0.05s 44100Hz 单声道 PCM WAV，调用已安装 FFTResampler 重采样至 8000Hz，校验退出码与输出 WAV 头（RIFF/fmt/rate）"
    command: "bash test.sh"