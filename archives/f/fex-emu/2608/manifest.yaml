notes: |
  FEX-Emu 2608 provides the x86/x86-64 to AArch64 user-mode emulator core
  (SSA IR + Arm64 JIT), the Linux syscall emulation layer and the tooling
  (FEX, FEXServer, FEXBash, FEXGetConfig, FEXOfflineCompiler, FEXRootFSFetcher,
  FEXpidof). FEXConfig (Qt) is disabled because Qt is not published in the
  artifact repository, and the glibc allocator interposition is disabled
  because it cannot apply to the OHOS musl libc (it is only required for thunk
  execution, which is disabled as well). See notes.md for the full adaptation
  report, including the documented runtime boundary for guest execution.

test_results:
  upstream_ctest_total: 7861
  upstream_tests_defined: 7861
  host_side_tests_executed: 339
  host_side_tests_passed: 338
  host_side_pass_rate: "99.7%"
  asm_tests_defined: 7482
  asm_tests_executed: 0
  asm_tests_note: |
    The 7482 guest x86-64/x86 ASM tests are assembled and built, but executing
    them requires TestHarnessRunner to complete FEX's host<->guest deferred
    signal handshake, which does not complete on OHOS (single-threaded FUTEX
    wait, see notes.md). Documented as an explicit runtime boundary.
  struct_verifier_tests_defined: 40
  struct_verifier_tests_note: |
    unittests/StructPackVerifier.py requires the Python "clang" bindings together
    with a matching libclang; the OHOS worker ships neither, so these analysis
    tests error out with ModuleNotFoundError before doing any work.
  guest_side_tests_note: |
    unittests/POSIX, unittests/gvisor-tests and unittests/gcc-target-tests-*
    need an x86 Linux rootfs (and an x86 toolchain to rebuild the binaries), so
    they are not executed. The prebuilt binaries live in submodules that are
    intentionally not fetched.
  test_package: "test.sh (FEXGetConfig/FEXOfflineCompiler CLI + AArch64 ELF validation)"
  target_platform: "HarmonyOS PC 1.12.0 (AArch64)"
