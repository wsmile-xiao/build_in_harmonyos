# test_package/MANIFEST.yml
package: fex-emu/2608
homepage: "https://fex-emu.com/"

# Upstream test entry point. The suite is built by `conan create` and executed
# with CTest.
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: "ctest -E '^jit_1/|^jit_500/|^jit_500_m/|Test_verify'"

upstream_tests:
  - file: FEXCore/unittests/Emitter/*.cpp
    source: FEX-2608/FEXCore/unittests/Emitter
    description: "AArch64 code emitter tests, cross-checked through the vixl disassembler (273 CTest cases)"
    command: "ctest -R Emitter"
  - file: FEXCore/unittests/APITests/*.cpp
    source: FEX-2608/FEXCore/unittests/APITests
    description: "FEXCore API unit tests: allocator, file loading, bit sets, futex spin lock, ilog2 (42 CTest cases)"
    command: "ctest -R APITest"
  - file: unittests/ASM/**/*.asm
    source: FEX-2608/unittests/ASM
    description: "Guest x86-64 instruction tests assembled with NASM and executed in-process by TestHarnessRunner via the Arm64 JIT (7482 CTest cases). Documented runtime boundary on OHOS, see notes.md."
    command: "ctest -R '^jit_1/'"
  - file: unittests/32Bit_ASM/**/*.asm
    source: FEX-2608/unittests/32Bit_ASM
    description: "Guest x86 32-bit instruction tests (part of the 7482 ASM CTest cases)"
    command: "ctest -R '^jit_1/'"

# Consumer-facing tests shipped in test_package/
test_package_tests:
  - file: test.sh
    description: "Consumer smoke test: FEXGetConfig/FEXOfflineCompiler CLI behaviour plus AArch64 ELF validation of FEX, FEXServer, FEXBash and FEXpidof"
    command: "bash test.sh"

# Executed host-side CTest cases (Emitter + API tests + misc; excludes the ASM
# suite and the libclang dependent struct verifier).
assertion_count: 339
