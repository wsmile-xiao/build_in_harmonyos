patches:
  - patch_file: "patches/0001-cmake-harmonyos.patch"
    patch_description: "Accept the HarmonyOS system name, opt into the OHOS libc++ C++20 ranges, and normalise the empty program_invocation_name probe result"
    patch_type: "portability"
  - patch_file: "patches/0002-add-atomic-ref-shim.patch"
    patch_description: "Add a std::atomic_ref shim for the C++20 facility missing from the OHOS libc++"
    patch_type: "portability"
  - patch_file: "patches/0003-add-pmr-shim.patch"
    patch_description: "Add a std::pmr shim for the C++17 <memory_resource> facility missing from the OHOS libc++"
    patch_type: "portability"
  - patch_file: "patches/0004-spinwaitlock-atomicref.patch"
    patch_description: "Use the std::atomic_ref shim in SpinWaitLock"
    patch_type: "portability"
  - patch_file: "patches/0005-shmstats-atomicref.patch"
    patch_description: "Use the std::atomic_ref shim in SHMStats"
    patch_type: "portability"
  - patch_file: "patches/0006-writeprioritymutex-atomicref.patch"
    patch_description: "Use the std::atomic_ref shim in WritePriorityMutex"
    patch_type: "portability"
  - patch_file: "patches/0007-arm64-atomicref.patch"
    patch_description: "Use the std::atomic_ref shim in the Arm64 architecture helpers"
    patch_type: "portability"
  - patch_file: "patches/0008-jit-atomicref.patch"
    patch_description: "Use the std::atomic_ref shim in the Arm64 JIT code patching path"
    patch_type: "portability"
  - patch_file: "patches/0009-seccomp-atomicref.patch"
    patch_description: "Use the std::atomic_ref shim in the seccomp emulator"
    patch_type: "portability"
  - patch_file: "patches/0010-thread-atomicref.patch"
    patch_description: "Use the std::atomic_ref shim in the thread syscall emulation"
    patch_type: "portability"
  - patch_file: "patches/0011-threads-atomicref.patch"
    patch_description: "Use the std::atomic_ref shim in the thread reaping helpers"
    patch_type: "portability"
  - patch_file: "patches/0012-fextl-memory-resource-pmr.patch"
    patch_description: "Route FEXCore's pmr wrapper to the std::pmr shim"
    patch_type: "portability"
  - patch_file: "patches/0013-intrusive-arena-pmr.patch"
    patch_description: "Route the intrusive arena allocator to the std::pmr shim"
    patch_type: "portability"
  - patch_file: "patches/0014-filesystem-pmr.patch"
    patch_description: "Route FEXHeaderUtils::Filesystem to the std::pmr shim"
    patch_type: "portability"
  - patch_file: "patches/0015-functional-move-only-function.patch"
    patch_description: "Support the strictest libc++ in fextl::move_only_function and invoke member pointers correctly"
    patch_type: "portability"
  - patch_file: "patches/0016-testdisassembler-tmpdir.patch"
    patch_description: "Create the Emitter test scratch file in TMPDIR because the OHOS /tmp is read-only"
    patch_type: "portability"
  - patch_file: "patches/0017-apitests-allocator-tmpdir.patch"
    patch_description: "Create the APITests Allocator scratch file in TMPDIR because the OHOS /tmp is read-only"
    patch_type: "portability"
  - patch_file: "patches/0018-asm-tests-ret-append.patch"
    patch_description: "Append the trailing ret with a sed command that also works with toybox sed"
    patch_type: "portability"
  - patch_file: "patches/0019-32bit-asm-tests-ret-append.patch"
    patch_description: "Append the trailing ret with a sed command that also works with toybox sed (32-bit ASM tests)"
    patch_type: "portability"
  - patch_file: "patches/0020-sbrk-fixed-noreplace-fallback.patch"
    patch_description: "Fall back to MAP_FIXED when the OHOS kernel rejects MAP_FIXED_NOREPLACE with ENOSYS"
    patch_type: "portability"
  - patch_file: "patches/0021-x32-types-sigevent.patch"
    patch_description: "Handle the OHOS sigevent layout, which has no SIGEV_THREAD_ID or _sigev_un"
    patch_type: "portability"
  - patch_file: "patches/0022-info-uname26.patch"
    patch_description: "Define the glibc UNAME26 personality flag that the OHOS sys/utsname.h omits"
    patch_type: "portability"
  - patch_file: "patches/0023-codecache-mremap-dontunmap.patch"
    patch_description: "Define MREMAP_DONTUNMAP that the OHOS sys/mman.h omits"
    patch_type: "portability"
  - patch_file: "patches/0024-x32-wireless-sockaddr-storage.patch"
    patch_description: "Avoid the sockaddr_storage redefinition between the OHOS uapi and libc headers"
    patch_type: "portability"
  - patch_file: "patches/0025-x64-wireless-sockaddr-storage.patch"
    patch_description: "Avoid the sockaddr_storage redefinition between the OHOS uapi and libc headers (64-bit)"
    patch_type: "portability"
  - patch_file: "patches/0026-fexcore-shared-soname.patch"
    patch_description: "Emit a DT_SONAME for libFEXCore.so, which CMake cannot do without a Platform/HarmonyOS module"
    patch_type: "portability"
