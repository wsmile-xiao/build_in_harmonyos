# conandata.yml — fex-emu 2608 (FEX-Emu monthly release FEX-2608)
#
# Upstream ships the tag as a GitHub source archive that intentionally omits
# the git submodules recorded under External/ (plus Source/Common/cpp-optparse).
# The recipe therefore pins every submodule FEXCore needs at the exact commit
# recorded by the FEX-2608 tag and fetches it as a separate, checksum verified
# source, reproducing `git submodule update --init` without a git checkout.
#
# Submodules that are not needed for the HarmonyOS headless build are omitted:
#   - External/zydis        (x86 disassembler; ENABLE_ZYDIS=OFF)
#   - External/tracy        (profiler backend; ENABLE_FEXCORE_PROFILER=OFF)
#   - External/Vulkan-Headers (thunk libraries; BUILD_THUNKS=OFF)
#   - External/jemalloc_glibc (glibc allocator interposition; not applicable to
#                             the OHOS musl libc and only needed by thunks)
#   - External/tiny-json    (vendored in-tree, shipped by the tarball)
#   - External/fex-*-tests-bins (guest x86 binaries; require a Linux rootfs)

sources:
  fex:
    url: "https://github.com/FEX-Emu/FEX/archive/refs/tags/FEX-2608.tar.gz"
    sha256: "6b5927e8fd2da7ba82017fbeb8e9573ff09d7338bf476ab8a73fab2bf16b9245"
    destination: "."
