software: fex-emu
display: "FEX-Emu"
description: "Fast usermode x86 and x86-64 emulator for AArch64"
category: emulation
homepage: "https://fex-emu.com/"
license: "MIT"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Accept the HarmonyOS CMake system name, which the OHOS Conan toolchain sets for os=OHOS"
    - "Opt into _LIBCPP_ENABLE_EXPERIMENTAL; the OHOS libc++ 15 hides the C++20 ranges algorithms"
    - "Provide std::atomic_ref and std::pmr shims for the facilities removed from the OHOS libc++"
    - "Fetch the git submodules that the release tarball omits, at the pinned FEX-2608 commits"
    - "Disable FEXConfig (Qt) and the glibc allocator interposition, neither of which applies on OHOS"
    - "Guard the Linux-only UAPI constants (SIGEV_THREAD_ID, UNAME26, MREMAP_DONTUNMAP) missing from the OHOS headers"

versions:
  "2608":
    status: built
    build_date: "2026-09-29"
