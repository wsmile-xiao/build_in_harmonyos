# 软件级 manifest — fff
# 文件位置: archives/f/fff/manifest.yaml

software: fff

display: "fff (Fake Function Framework)"

description: "单头文件 C/C++ fake 函数（mock）测试框架，零外部依赖"

category: library

homepage: "https://github.com/meekrosoft/fff"

license: MIT

build_system: custom  # header-only：库本体无构建系统；上游测试为 Makefile

ohos_adaptation:
  key_points:
    - "header-only：package_type=header-library，package() 只装 include/fff.h 与 licenses/"
    - "上游测试（test/ + examples/）经 run_upstream_tests 选项由 OHOS clang 直接编译执行（R33 从 Conan conf 取编译器，替代上游硬编码 gcc/g++）"
    - "不复刻上游链接参数 -lpthread：fff 未引用独立 pthread 符号，OHOS musl 线程符号内建 libc"
  common_dependencies: []

versions:
  "1.1":
    status: built
    build_date: 2026-09-12
