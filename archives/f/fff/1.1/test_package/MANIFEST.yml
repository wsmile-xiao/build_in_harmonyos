# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）

package: fff/1.1
homepage: "https://github.com/meekrosoft/fff"

# 上游测试由配方 run_upstream_tests 选项驱动（build() 内逐目标编译并运行，
# 对应上游 buildandtest 脚本的 11 个测试二进制），CI 与真机同路径执行
upstream_check_command: "buildandtest（上游逐二进制执行 11 个测试程序）"
upstream_test_in_build: true
upstream_test_command: "配方 build()：OHOS clang 按 test/Makefile + examples Makefile 等价命令编译并运行"

# 上游实际运行的测试程序（11 个测试二进制；gtest 系复用 vendored google test）
upstream_tests:
  - file: test/fff_test_c.c
    source: test/fff_test_c.c
    description: "C 核心套件（36 个 RUN_TEST，自制 c_test_framework.h）"
    command: "./fff_test_c"
  - file: test/fff_test_cpp.cpp
    source: test/fff_test_cpp.cpp
    description: "C++ gtest 套件（45 个 TEST_F = test_cases.include 42 + 自有 3）"
    command: "./fff_test_cpp"
  - file: test/fff_test_global_c.c
    source: test/fff_test_global_c.c
    description: "C 全局 fake 套件（35 个 RUN_TEST）"
    command: "./fff_test_glob_c"
  - file: test/fff_test_global_cpp.cpp
    source: test/fff_test_global_cpp.cpp
    description: "C++ 全局 fake gtest 套件（42 个 TEST_F）"
    command: "./fff_test_glob_cpp"
  - file: examples/embedded_ui/UI_test_ansic.c
    source: examples/embedded_ui/UI_test_ansic.c
    description: "嵌入式 UI 示例 ANSI C 套件（11 个 RUN_TEST）"
    command: "./ui_test_ansic"
  - file: examples/embedded_ui/UI_test_cpp.cpp
    source: examples/embedded_ui/UI_test_cpp.cpp
    description: "嵌入式 UI 示例 gtest 套件（10 个 TEST）"
    command: "./ui_test_cpp"
  - file: examples/driver_testing/driver.test.cpp
    source: examples/driver_testing/driver.test.cpp
    description: "驱动示例普通 gtest 套件（2 个 TEST）"
    command: "./driver_testing"
  - file: examples/driver_testing/driver.test.fff.cpp
    source: examples/driver_testing/driver.test.fff.cpp
    description: "驱动示例 fff gtest 套件（3 个 TEST_F）"
    command: "./driver_testing_fff"
  - file: examples/weak_linking/test/display.test.c
    source: examples/weak_linking/test/display.test.c
    description: "弱链接示例 display（assert 式单 main 程序）"
    command: "./test_display"
  - file: examples/weak_linking/test/sensor.test.c
    source: examples/weak_linking/test/sensor.test.c
    description: "弱链接示例 sensor（assert 式单 main 程序）"
    command: "./test_sensor"
  - file: examples/weak_linking/test/main.test.c
    source: examples/weak_linking/test/main.test.c
    description: "弱链接示例 main（assert 式单 main 程序）"
    command: "./test_main"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：call_count/arg_history/fff.call_history/return_val_seq/custom_fake/RESET_FAKE 真实断言"
    command: "./test_probe"

assertion_count: 20
