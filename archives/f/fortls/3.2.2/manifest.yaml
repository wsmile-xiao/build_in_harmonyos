version: "3.2.2"
status: published
build_date: "2026-05-20"

source:
  url: "https://repo.huaweicloud.com/repository/pypi/packages/source/f/fortls/fortls-3.2.2.tar.gz"
  sha256: "待补充"
  tar_format: tar.gz

build:
  system: python
  configure_options:
    - "bdist_wheel"
  dependencies:
    - setuptools >= 61
    - wheel
    - json5
    - packaging
  cc: none
  cxx: none

patches_applied:
  - "0001-static-version.patch"

knowledge_gained:
  - "setuptools_scm requires git repository for version detection, use static version for tar.gz source"
  - "Pure Python project can be built with setup.py bdist_wheel directly"