software: fortls
display: "fortls"
description: "Fortran Language Server - LSP implementation for Fortran"
category: dev-tool
homepage: "https://fortls.fortran-lang.org"
license: MIT
build_system: python

ohos_adaptation:
  key_points:
    - "Pure Python project, requires setuptools and wheel for building"
    - "setuptools_scm needs git repository for version detection, use static version for tar.gz source"
    - "Dependencies: json5, packaging"
  common_dependencies:
    - python3 >= 3.7
    - json5
    - packaging

versions:
  "3.2.2":
    status: published
    build_date: "2026-05-20"