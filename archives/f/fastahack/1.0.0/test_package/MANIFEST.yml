# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fastahack/1.0.0
homepage: "https://github.com/ekg/fastahack"

# 上游无 'make check' 测试套件；只有 tests/ 目录下的 FASTA 测试数据文件。
# 上游验证方式为运行 fastahack 二进制对测试数据做索引与序列提取。
upstream_check_command: "make check  # 上游 Makefile 无 check target"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 — 上游 tests/ 为 FASTA 数据文件（fixture），无独立测试程序
upstream_tests:
  - file: correct.fasta
    source: fastahack-1.0.0/tests/correct.fasta
    description: "上游测试数据：3 条标准序列，用于索引与序列提取验证"
    command: "fastahack -i correct.fasta && fastahack -r 1:1..20 correct.fasta"
  - file: trailing_newlines.fasta
    source: fastahack-1.0.0/tests/trailing_newlines.fasta
    description: "上游测试数据：序列尾部带换行的文件，验证索引容错"
    command: "fastahack -i trailing_newlines.fasta"
  - file: crlf.fasta
    source: fastahack-1.0.0/tests/crlf.fasta
    description: "上游测试数据：CRLF 行尾文件，验证索引兼容"
    command: "fastahack -i crlf.fasta"
  - file: embedded_newline.fasta
    source: fastahack-1.0.0/tests/embedded_newline.fasta
    description: "上游测试数据：序列内嵌换行（上游 README 声明不支持索引，预期拒绝）"
    command: "fastahack -i embedded_newline.fasta; echo $? (预期非零)"
  - file: mismatched_lines.fasta
    source: fastahack-1.0.0/tests/mismatched_lines.fasta
    description: "上游测试数据：行长度不一致（上游 README 声明不支持索引，预期拒绝）"
    command: "fastahack -i mismatched_lines.fasta; echo $? (预期非零)"

# test_package 中自带的测试 (消费者视角验证, 实际执行 fastahack 二进制)
test_package_tests:
  - file: test.sh
    description: "CLI 烟雾测试：usage 横幅 + .fai 索引生成 + -r 子序列提取 + -e 熵 + -d dump"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
