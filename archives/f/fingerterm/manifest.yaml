software: fingerterm
version: 1.4.16
status: built
build_date: 2026-09-09
build_system: cmake

# 编译配置
configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
  - "-DCMAKE_CROSSCOMPILING=FALSE"
  - "-DCMAKE_CXX_STANDARD=17"
  - "-DFINGERTERM_DEPLOYMENT_PATH=<package>/share/fingerterm"

# 编译参数
compiler: clang
compiler_version: "15"
target_arch: aarch64

# 依赖列表
dependencies:
  - name: qtbase
    version: "6.11.1"
    type: runtime
  - name: qtdeclarative
    version: "6.11.1"
    type: runtime
  - name: qtshadertools
    version: "6.11.1"
    type: runtime

# 补丁
patches:
  - "0001-Port-fingerterm-to-Qt6-CMake-for-HarmonyOS-PC.patch"

# 描述
description: >-
  Qt Quick 终端模拟器（Sailfish OS fingerterm）。Qt6/CMake 移植版：
  VT 解析引擎 + QQuickPaintedItem 渲染 + forkpty pty 层 + QML
  虚拟键盘。上游 qmake/Qt5 → ohpcd Qt 6.11 栈。

# 上游
upstream:
  homepage: https://github.com/sailfishos/fingerterm
  license: GPL-2.0-only
