# 版本级 manifest
# 文件位置: archives/f/fingerterm/1.4.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.4.16"

software: "fingerterm"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-09"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/sailfishos/fingerterm/archive/refs/tags/1.4.16.tar.gz"
  sha256: "3dc651ff449c8a7f26af2a9e1fa30fa869fffa805f26ec8619bf553d1a69ee2e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=<package>"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DFINGERTERM_DEPLOYMENT_PATH=<package>/share/fingerterm"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_CROSSCOMPILING=FALSE"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "qtbase/6.11.1"
    - "qtdeclarative/6.11.1"
    - "qtshadertools/6.11.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Port-fingerterm-to-Qt6-CMake-for-HarmonyOS-PC.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS musl sysroot 的 pty.h 提供 forkpty/openpty（符号在 libc，另有 libutil.a stub），终端模拟器核心 pty 路径可用"
  - "QTextCodec 在 Qt6 移除，QStringDecoder/QStringEncoder 为等价替代（注意 QAnyStringView 构造需绑定本地 QByteArray 防悬垂）"
  - "QtQuick.XmlListModel 2.0 在 Qt6 更名为 QtQml.XmlListModel（qtdeclarative 包内 qml/QtQml/XmlListModel）"
  - "QScreen::setOrientationUpdateMask 是 Sailfish 私有扩展，上游 Qt6 无此 API，需 guard"
  - "Screen.angleBetween 在 Qt6 qtdeclarative 中仍存在（QQuickScreenAttached），无需改 QML"
