# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: fastgltf/0.9.0
homepage: "https://github.com/spnda/fastgltf"

# 上游测试命令（用于 ctest -N / meson test --list 分析）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（详表见 R01 上游测试枚举台账，实际执行输出见
# .executor-logs/fastgltf-r01/fastgltf-tests-nobench.log：独立用例 79、通过 76、
# 断言 267726/267724 通过。台账与日志为执行端证据，不随本 PR 提交）
upstream_tests:
  - file: tests/basic_test.cpp
    source: fastgltf-0.9.0/tests/basic_test.cpp
    description: "基础 glTF 加载/类型检测/动画/皮肤/相机等独立用例（Catch2 TEST_CASE）"
    command: "./fastgltf_tests"
  - file: tests/extension_tests.cpp
    source: fastgltf-0.9.0/tests/extension_tests.cpp
    description: "扩展解析独立用例（KHR_* / EXT_* 系列）"
    command: "./fastgltf_tests"
  - file: tests/base64_tests.cpp
    source: fastgltf-0.9.0/tests/base64_tests.cpp
    description: "base64 编解码独立用例"
    command: "./fastgltf_tests"
  - file: tests/vector_tests.cpp
    source: fastgltf-0.9.0/tests/vector_tests.cpp
    description: "SmallVector/StaticVector 独立用例"
    command: "./fastgltf_tests"
  - file: tests/uri_tests.cpp
    source: fastgltf-0.9.0/tests/uri_tests.cpp
    description: "URI/percent 解码独立用例"
    command: "./fastgltf_tests"

# test_package 中自带的测试（消费者视角验证，真实调用 fastgltf API 解析 glTF JSON）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：用 fastgltf::Parser 解析最小合法 glTF 2.0 并校验场景/版本字段"
    command: "./test_fastgltf"

# 测试断言总数（test_package 消费者测试实际断言数；上游全量断言见上述台账日志）
assertion_count: 267724