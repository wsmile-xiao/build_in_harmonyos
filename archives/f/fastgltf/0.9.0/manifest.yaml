# 版本级 manifest — fastgltf 0.9.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.9.0"
software: "fastgltf"
status: built
build_date: "2026-09-02"
build_system: cmake

source:
  url: "https://github.com/spnda/fastgltf/archive/refs/tags/v0.9.0.tar.gz"
  sha256: "0bb564e127b14c22f062db50f89381dd2e0a20dbaf4987ca138a4ae8728712f9"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies:
    - simdjson/4.6.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "fastgltf 0.9.0 为 CMake 库，依赖 simdjson；测试需 Catch2/glm 且样例资产来自 KhronosGroup/glTF-Sample-Models"
  - "OHOS 工具链 clang 15 默认未启用 ARMv8 CRC 特性，编译 fastgltf 需 -march=armv8.2-a+crc（按 os/arch 守卫）"
  - "OHOS libc++15 缺标准 <memory_resource> 时 fastgltf 经 FASTGLTF_MISSING_MEMORY_RESOURCE 自动回退普通容器，配方构建不依赖 pmr"