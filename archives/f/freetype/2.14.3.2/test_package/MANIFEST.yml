# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: freetype/2.14.3.2
homepage: https://freetype.org/

# 上游测试情况：
#  - autotools：官方无验证套件（builds/unix/install.mk:86 `check` 目标输出
#    "There is no validation suite for this package."）
#  - meson：tests/ 注册 1 个回归测试 issue-1063（tests/meson.build），
#    需 FREETYPE_TESTS_DATA_DIR 指向 tests/data 且需 As.I.Lay.Dying.ttf 字体
#    （字体来自 github.com/python-pillow/Pillow/files/6622147，本环境 github 不可达，
#    见 RESULT.md 环境约束证据；实测用系统字体替代跑通同一测试二进制）
upstream_test_in_build: false
upstream_tests:
  - name: issue-1063
    tool: meson
    type: regression
    requires: "FREETYPE_TESTS_DATA_DIR + As.I.Lay.Dying.ttf"
    note: "见 RESULT.md R51 三步法实测记录"

# test_package 自带测试（消费者视角：真实调用 freetype API 链路）
test_package_tests:
  - file: test.c
    description: >
      真实调用 FT_Init_FreeType/FT_Library_Version/FT_New_Face/
      FT_Get_Char_Index/FT_Load_Glyph/FT_Done_Face/FT_Done_FreeType，
      并真实链接 -lfreetype（非仅 dlopen）
    command: "./test_probe"

assertion_count: 3
