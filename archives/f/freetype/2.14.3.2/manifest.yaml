software: freetype
version: '2.14.3.2'
status: built
build_date: '2026-09-25'
build_system: autotools

source:
  url: 'https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.gz'
  sha256: 'e61b31ab26358b946e767ed7eb7f4bb2e507da1cfefeb7a8861ace7fd5c899a1'
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - '--with-zlib=no'
    - '--with-bzip2=no'
    - '--with-png=no'
    - '--with-harfbuzz=no'
    - '--with-brotli=no'
    - '--disable-static'
  cc: clang

patches_applied:
  - 'patches/0001-builds-unix-configure.patch'
  - 'patches/0002-builds-unix-config.guess.patch'
  - 'patches/0003-builds-unix-config.sub.patch'

knowledge_gained:
  - '禁全部可选依赖（harfbuzz 与 freetype 循环，须先建无 hb 版）→ 零外部依赖叶子'
  - 'E007: config.guess/config.sub 补丁识别 HarmonyOS → aarch64-unknown-linux-ohos（官方补丁方案）'
  - 'E011: configure 临时目录改用 TMPDIR + umask 022（HMDFS 权限限制）'
  - 'R33: 编译器/工具从 Conan Toolchain 环境注入（detect.mk 默认用 cc 非 clang，CI #29062 教训）'
  - '头 include/freetype2/ → includedirs=["include/freetype2","include"]'
  - 'freetype2.pc Version=26.6.20（libtool，version_info=26:6:20）非 release；system_package_version 覆盖，供 fontconfig/cairo 判 >=21.0.15'
  - 'R34: test_package 真实调用 FT API 链路并真链接 -lfreetype（替代原 dlopen 空壳）'
  - 'E307/E529: test_package 取编译器须读父级 conf 字典 tools.build:compiler_executables（check_type=dict），子 key :c 未注册'
