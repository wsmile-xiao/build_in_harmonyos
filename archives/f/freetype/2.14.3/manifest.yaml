software: freetype
version: 2.14.3
category: gfx
status: built

build_system: autotools
compiler: clang 15.0.4
linker: GNU ld 2.45

dependencies:
  zlib: 1.3.1
  libpng: 1.6.47

configure_options:
  - "--prefix=$HOME/usr/local"
  - "--without-harfbuzz"

build_notes:
  - 未启用 harfbuzz 支持（与 harfbuzz 存在循环依赖）
  - 使用 autotools 构建系统，需应用 10 个补丁适配 OpenHarmony 交叉编译环境
  - 补丁涵盖 config.mk、unix-cc.mk、unix-def.mk、freetype-config、ftconfig.h、ftoption.h、config.guess、ftexport.sym、ftmodule.h、configure 的适配修改
  - ELF signed for HarmonyOS execution

artifacts:
  - libfreetype.a static library
  - libfreetype.so shared library
  - freetype-config
  - header files

source_url: https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz

patches_applied:
  - 0001-config.mk.patch
  - 0002-builds-unix-unix-cc.mk.patch
  - 0003-builds-unix-unix-def.mk.patch
  - 0004-builds-unix-freetype-config.patch
  - 0005-builds-unix-ftconfig.h.patch
  - 0006-builds-unix-ftoption.h.patch
  - 0007-builds-unix-config.guess.patch
  - 0008-objs-ftexport.sym.patch
  - 0009-objs-ftmodule.h.patch
  - 0010-builds-unix-configure.patch