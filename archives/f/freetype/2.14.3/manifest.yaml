version: "2.14.3"
status: built
build_date: "2026-04-25"

source:
  url: "https://download.savannah.gnu.org/releases/freetype/freetype-2.14.3.tar.xz"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
  dependencies:
    - zlib
    - libpng

patches_applied: []

knowledge_gained:
  - "freetype 依赖 harfbuzz（可选），但 harfbuzz 又依赖 freetype 形成循环依赖"
  - "建议先编译不带 harfbuzz 依赖的 freetype，再编译 harfbuzz"
