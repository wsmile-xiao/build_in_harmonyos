software: freetype
display: "FreeType"
description: "Free, high-quality font rendering engine supporting TrueType, OpenType, CFF and others"
category: gfx
homepage: "https://freetype.org/"
license: FreeType-License OR GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "freetype 依赖 harfbuzz（可选），但 harfbuzz 又依赖 freetype 形成循环依赖"
    - "建议先编译不带 harfbuzz 依赖的 freetype，再编译 harfbuzz"
  common_dependencies:
    - zlib
    - libpng

versions:
  "2.14.3":
    status: built
    build_date: "2026-07-07"
  "2.14.3.2.1":
    status: built
    build_date: "2026-09-26"
