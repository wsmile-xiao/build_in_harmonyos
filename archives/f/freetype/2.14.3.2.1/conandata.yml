# conandata.yml — freetype 2.14.3.2.1（R37 递增版，上游源码 = freetype 2.14.3 发行包）
# 源：Debian sid 官方再打包 orig 归档（+dfsg 仅将 ft2demos/ft2docs 拆分为独立源包，
# 主包构建树与上游一致）；sha256 与 .dsc PGP 签名记录核对一致。
# 双镜像：USTC / deb.debian.org（CI worker 已实证可达）
sources:
  url:
    - "https://mirrors.ustc.edu.cn/debian/pool/main/f/freetype/freetype_2.14.3+dfsg.orig.tar.xz"
    - "https://deb.debian.org/debian/pool/main/f/freetype/freetype_2.14.3+dfsg.orig.tar.xz"
  sha256: "dc1bec263a6fffa436029efe6428f601d6b1a0b800837508ee3e49bbab8f1006"

patches:
  - patch_file: "patches/0001-builds-unix-configure.patch"
    patch_description: "configure 临时目录改用 TMPDIR + umask 022（HMDFS umask 077 目录不可写，E011 类问题）"
    patch_type: "portability"
  - patch_file: "patches/0002-builds-unix-config.guess.patch"
    patch_description: "config.guess 识别 HarmonyOS（uname -s=HarmonyOS）输出 aarch64-unknown-linux-ohos（E007 官方补丁）"
    patch_type: "portability"
  - patch_file: "patches/0003-builds-unix-config.sub.patch"
    patch_description: "config.sub 接受 ohos-linux 三元组（E007 官方补丁）"
    patch_type: "portability"
  - patch_file: "patches/0004-builds-unix-detect-mk-shell-configure.patch"
    patch_description: "detect.mk 两条 configure 调用改经 $(SHELL)（HMDFS 禁止直接 exec 脚本，EACCES）"
    patch_type: "portability"
  - patch_file: "patches/0005-builds-unix-libtool-shell.patch"
    patch_description: "unix-cc.in 的 LIBTOOL 改为 $(SHELL) 前缀（与 libtool 官方标准形式一致），unix-def.in DISTCLEAN 同步改裸路径"
    patch_type: "portability"
