software: freetype
version: "2.14.3.2.1"
status: published
build_date: "2026-09-26"
conan_ref: "freetype/2.14.3.2.1"
source:
  url: "https://deb.debian.org/debian/pool/main/f/freetype/freetype_2.14.3+dfsg.orig.tar.xz"
  sha256: "dc1bec263a6fffa436029efe6428f601d6b1a0b800837508ee3e49bbab8f1006"
  tar_format: tar.xz
build:
  system: autotools
  configure_options:
    - "--with-zlib=no"
    - "--with-bzip2=no"
    - "--with-png=no"
    - "--with-harfbuzz=no"
    - "--with-brotli=no"
  dependencies: []
  cc: clang
patches_applied:
  - "0001-builds-unix-configure.patch"
  - "0002-builds-unix-config.guess.patch"
  - "0003-builds-unix-config.sub.patch"
  - "0004-builds-unix-detect-mk-shell-configure.patch"
  - "0005-builds-unix-libtool-shell.patch"
knowledge_gained:
  - "禁全部可选依赖（harfbuzz 与 freetype 循环，须先建无 hb 版）→ 零外部依赖叶子"
  - "E007：config.guess/config.sub 官方补丁识别 HarmonyOS（uname -s=HarmonyOS → aarch64-unknown-linux-ohos）"
  - "E011：configure 临时目录 umask 077 在 HMDFS 不可写 → TMPDIR + umask 022 补丁"
  - "头装 include/freetype2/ → includedirs=[include/freetype2, include]"
  - "freetype2.pc Version=26.6.20（libtool version_info=26:6:20）非 release；system_package_version 覆盖，供 fontconfig/cairo 判 >=21.0.15"
  - "真机 GNU Make 4.4.1 -jN 并行编译静默失败 → 配方固定 make -j1 串行构建"
  - "上游发行包含 tests/（4 文件、1 个 meson 回归测试 issue-1063），数据字体在包外需联网 → 环境限制说明 + 消费者探针等价覆盖"
  - "HMDFS 用户存储禁止直接 exec shebang 脚本（EACCES，与 x 位无关/chmod 不生效）→ 脚本一律经解释器调用：配方 sh configure、detect.mk/LIBTOOL 加 $(SHELL) 前缀（libtool 官方标准形式）、INSTALL 用 toybox ELF"
  - "autotools 包在真机的脚本 exec 全链路清单：configure（配方级）、detect.mk 内层 configure（0004）、libtool 编译链接安装（0005）；config.guess/config.sub/config.status 上游本身经 $SHELL 调用，天然安全"
upstream_test_pass_rate: "0/1（tests/issue-1063 需 tests/data 字体（发行包不含、需联网下载）+ 仅 meson 集成；离线 autotools 构建无法执行——环境限制，等价语义已由消费者探针覆盖）"
adapted_test_pass_rate: "100%（消费者探针 18/18，真机 HarmonyOS PC aarch64 ohos 原生 conan create 实测全绿：真实链接 libfreetype.so + 内存加载嵌入 TTF + 光栅化出墨 + 度量 + issue-1063 等价码位循环）"
test_command: "conan create . --build=missing"
