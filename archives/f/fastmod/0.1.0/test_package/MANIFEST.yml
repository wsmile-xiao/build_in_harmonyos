# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: fastmod/0.1.0
homepage: "https://github.com/lemire/fastmod"

# 上游 CMake 测试命令；源码没有 make check 目标。
upstream_check_command: "cmake -B build -DFASTMOD_EXHAUSTIVE_TESTS=OFF && cmake --build build && ctest --test-dir build --output-on-failure"

# conanfile.py build() 已运行默认 CTest 清单中的 2 个 benchmark。
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/moddivnbenchmark.cpp
    source: fastmod-0.1.0/tests/moddivnbenchmark.cpp
    description: "上游 64 位除法与取余基准程序（CTest 注册项 1/2，运行并返回成功）"
    command: "./moddivnbenchmark"
    status: passed
  - file: tests/modnbenchmark.cpp
    source: fastmod-0.1.0/tests/modnbenchmark.cpp
    description: "上游 64 位取余基准程序（CTest 注册项 2/2，运行并返回成功）"
    command: "./modnbenchmark"
    status: passed

  - file: tests/unit.c
    source: fastmod-0.1.0/tests/unit.c
    description: "Makefile all 的完整正确性程序；已用设备 clang 编译并实际运行 120 秒，未完成（源码包含多组 2^32 级 dividend 遍历）"
    command: "make CC=clang CXX=clang++ -j1 unit && timeout 120 ./unit"
    status: not_completed
    result: "exit 124; 日志 60889 字节，SHA-256 c46abbb9b455fce16cad7fdc6284cd7baad6fb821264833c56651b6c513548f7"

  - file: tests/cppincludetest2.cpp
    source: fastmod-0.1.0/tests/cppincludetest2.cpp
    description: "Makefile all 及 FASTMOD_EXHAUSTIVE_TESTS=ON 的完整域正确性程序；首个调用为 8 个 divisor × 2^32 个 dividend"
    command: "make CC=clang CXX=clang++ -j1 cppincludetest2 && timeout 120 ./cppincludetest2"
    status: not_completed
    result: "exit 124; 日志 1 字节（换行），SHA-256 01ba4719c80b6fe911b091a7c05124b64eeece964e09c058ef8f9805daca546b"

# 默认 CTest 清单是 2 个 benchmark；FASTMOD_EXHAUSTIVE_TESTS=ON 会增加第 3 个 CTest。
# Makefile all 明确包含 unit 与 cppincludetest2；cppincludetest1.o 只是链接辅助对象，
# 不作为独立测试程序计数。上面两项的 124 是受控实跑未完成，不是测试失败。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者 API 测试：无符号/有符号除法取余、整除判断和模板接口"
    command: "./test_fastmod"

# 显式 API 检查总数
assertion_count: 11
