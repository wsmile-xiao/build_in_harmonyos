# 软件级 manifest — fatal
# 遵循 ARCHIVE-SPEC v3.0

software: fatal
display: "fatal (Facebook Template Library)"
description: "Facebook 开源的 header-only C++ 模板元编程库：类型列表/变换/反射/编译期算术、variant/optional 容器、rope 字符串等"
category: foundation
homepage: "https://github.com/facebook/fatal"
license: BSD-3-Clause
build_system: header-only

ohos_adaptation:
  key_points:
    - "header-only：只安装 fatal/ 头文件树到 include/，无编译产物"
    - "上游 harness（test.sh/compile.sh）在 build() 中原样复刻，67 个测试 TU / 839 个可执行用例 100% 通过"
    - "上游 compile.sh 固定写 /tmp/.build，鸿蒙 PC 的 /tmp 为只读 erofs，配方改为直接编译到构建目录"
    - "OHOS 下 subprocess 不搜 PATH（posix_spawn），编译器需绝对路径"
    - "OHOS libc++（clang 15 + libcxx-ohos）较严格：需 2 个 portability 补丁（std::iterator 弃用、std::tuple_element 越界 static_assert）"
  common_dependencies: []

versions:
