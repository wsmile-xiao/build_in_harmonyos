# test_package/MANIFEST.yml
# 上游官方测试声明文件 — fatal v2026.09.14.00 (Facebook Template Library)
#
# fatal 是 header-only 模板元编程库，上游不带 CMake/Meson/Autotools 构建系统，
# 因此没有 `make check` / `ctest` 目标：上游自带的 harness 是仓库根目录的
#   test.sh → compile.sh → scripts.inc
# 它遍历 fatal/ 下每个 *_test.cpp，按
#   -Wall -Werror -Wextra -O0 -g -pthread -ftemplate-depth-1024 -std=c++17
# 编译并运行，二进制自报 `succeeded: passed <N>/<N>`。
# 本包在 conanfile.py 的 build() 中原样复刻该 harness（rule 4 实测）。

package: fatal/v2026.09.14.00
homepage: "https://github.com/facebook/fatal"

# 上游测试命令（等价物；上游无 make check/ctest，harness 为 ./test.sh）
upstream_check_command: "./test.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./test.sh (等价实现: conanfile.py build() → _run_upstream_tests())"

# 上游实际运行的测试程序
upstream_tests:
  - file: "fatal/**/test/*_test.cpp"
    source: "fatal-2026.09.14.00/fatal"
    description: >-
      67 个上游测试 TU / 839 个可执行的 FATAL_TEST 用例。
      上游 FATAL_TEST 字面量共 845 个，其中 6 个（find/rfind/find_first_of/
      find_first_not_of/find_last_of/find_last_not_of 的 TODO 桩）位于
      fatal/string/test/rope_test.cpp 的 /* TODO: IMPLEMENT */ 块注释内，
      上游自身也不编译，故可执行用例 = 845 - 6 = 839。
    command: >-
      clang++ -Wall -Werror -Wextra -O0 -g -pthread -ftemplate-depth-1024
      -std=c++17 -I . <test.cpp> -o <binary> && ./<binary>

# test_package 中自带的测试（消费者视角，仅用包内 include 目录）
test_package_tests:
  - file: consumer_api_test.cpp
    description: >-
      消费者功能用例：fatal::list / size / reverse / push_front 类型级断言
      + 运行时用 fatal::foreach 遍历 fatal::list 并校验访问顺序
      （非纯断言：产生并校验运行期输出）
    command: "./consumer_api_test"
  - file: rope_iterator_test.cpp
    description: >-
      鸿蒙特有：fatal::rope<>::const_iterator 在 -Werror -Wextra 下可编译
      （验证 patch 0001 去掉 std::iterator 基类后的迭代器契约完整：
      iterator_category/value_type/difference_type/pointer/reference 及
      std::iterator_traits），并运行期遍历 rope 校验字符序列与长度
    command: "./rope_iterator_test"
  - file: ohos_libcxx_surface_test.cpp
    description: >-
      鸿蒙特有：fatal/type/ 公共头文件表面在 OHOS libc++（clang 15 +
      libcxx-ohos）下以 -Werror -Wextra -std=c++17 编译；同时覆盖 patch 0002
      涉及的 std::tuple_element 硬化路径（范围内索引仍可被 fatal::is_complete
      探测为完整类型）
    command: "./ohos_libcxx_surface_test"

# 上游测试断言总数（上游用例数，实测可执行 839，全部通过）
assertion_count: 839
