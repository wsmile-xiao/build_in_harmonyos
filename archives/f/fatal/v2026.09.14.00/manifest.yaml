  sha256: "da43cabebbe0a1b279f5eaf3fe7d3460ed7320887ca033d805b84079bc29e3a1"
  tar_format: tar.gz

build:
  system: header-only
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-rope-std-iterator-deprecated.patch"
    type: portability
    description: >-
      fatal/string/rope.h: const_iterator 不再继承 std::iterator（C++17 起弃用，
      libc++ 对其加 __attribute__((deprecated))，在 -Werror -Wextra 下直接编译失败），
      改为等价的显式成员 typedef。
  - file: "patches/0002-deprecated-transform-test-libcxx-tuple-element.patch"
    type: portability
    description: >-
      fatal/type/test/deprecated_transform_test.cpp: 用 #if !defined(_LIBCPP_VERSION)
      守卫 std::tuple_element<2, std::pair> 的「不完整类型」断言——新版 libc++/libstdc++
      对越界索引加了 static_assert，实例化即硬错误而非替换失败。

upstream_tests:
  harness: "./test.sh + ./compile.sh (上游自带)"
  test_translation_units: 67
  cases_declared: 845          # FATAL_TEST 字面量计数（含 6 个块注释内的 TODO 桩）
  cases_executable: 839        # 845 - 6（块注释内未被上游编译）
  cases_executed: 839
  cases_passed: 839
  pass_rate: "100%"
  runner: "conanfile.py build() → _run_upstream_tests()（rule 4 实测，非豁免）"

ohos_adaptation:
  key_points:
    - "上游 compile.sh 固定把中间产物写到 /tmp/.build；鸿蒙 PC 的 /tmp 是只读 erofs，必须改写到构建目录（配方直编，不经 compile.sh）"
    - "OHOS 下 subprocess 不通过 PATH 解析裸可执行名（posix_spawn 差异），编译器需用绝对路径"
    - "OHOS libc++（clang 15 + libcxx-ohos）比上游开发用的工具链严格：std::iterator 已标 deprecated、std::tuple_element 对越界索引有 static_assert"
  common_dependencies: []

knowledge_ref:
  - "DRAFT-fatal-v2026.09.14.00-rope-std-iterator-deprecated"
  - "DRAFT-fatal-v2026.09.14.00-libcxx-tuple-element-static-assert"

knowledge_gained:
  - category: L1
    content: >-
      header-only 库的上游 harness 复刻：fatal 用自带的 test.sh/compile.sh 遍历
      67 个 *_test.cpp（839 个可执行 FATAL_TEST 用例），按 -Wall -Werror -Wextra
      -O0 -g -pthread -ftemplate-depth-1024 -std=c++17 编译并运行，二进制自报
      "succeeded: passed N/N"。实测 839/839 = 100% 通过（rule 4 回填）。
    reason: "rule 4 实测回填（100%，分母=全部可执行用例 839）"
  - category: L1
    content: >-
      FATAL_TEST 计数口径：上游 845 个 FATAL_TEST 字面量中有 6 个位于
      fatal/string/test/rope_test.cpp 的 /* TODO: IMPLEMENT */ 块注释内，
      上游自身不编译 —— 因此「上游用例数 845」与「实际可执行 839」必须在
      PR 描述中区分声明，否则会被判为少报/虚报。
    reason: "rule 4 少报核验口径"
  - category: L2
    content: >-
      新版 libc++ 严格化打断上游 SFINAE 探测：std::tuple_element<2, std::pair>
      已加 static_assert（越界即硬错误），fatal::is_complete 的 sizeof 探测被击穿，
      上游 deprecated_transform_test.cpp:134 因此编译失败；修法是用
      #if !defined(_LIBCPP_VERSION) 守卫该断言。
    reason: "fatal/v2026.09.14.00 实测；同源风险适用于任何用 SFINAE 探测标准库类型完整性的库"
  - category: L2
    content: >-
      std::iterator 弃用：fatal/string/rope.h 的 const_iterator 继承
      std::iterator<...>（C++17 弃用、libc++ 标 deprecated），在 -Werror -Wextra
      下整个 rope_test 无法编译；改为显式 5 个成员 typedef 语义等价。
    reason: "fatal/v2026.09.14.00 实测；rope.h 是安装头文件，影响消费者 -Werror 构建"
