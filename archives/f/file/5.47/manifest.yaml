software: file
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.47/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.47"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://astron.com/pub/file/file-5.47.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--disable-libseccomp"
    - "--enable-static"
    - "--disable-shared"
    - "LDFLAGS=-static"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # zlib/bz2/lzma 使用系统自带，无额外依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0002-config.guess.patch"
  - "0003-config.sub.patch"
  - "0004-doc-file.1.patch"
  - "0005-doc-libmagic.3.patch"
  - "0006-doc-magic.4.patch"
  - "0007-src-magic.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需要补丁识别 OHOS 平台"
  - "E011: HMDFS umask 077 需改为 022 以解决临时目录权限问题"
  - "静态编译 (--enable-static --disable-shared) 解决动态库签名问题"
  - "LLVM linker (lld) 依赖 libxml2/libiconv/liblzma，需创建软链接指向 OHOS SDK 库文件"