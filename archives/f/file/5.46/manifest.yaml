software: file
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.46/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.46"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://ftp.astron.com/pub/file/file-5.46.tar.gz"

  # 源码校验和
  sha256: "c9cc77c7c760c543135edc555af609d5619dbef011997e988ce40a3d75d86088"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项（单行格式，clean-verify 会自动添加 --prefix）
  configure_options: "--disable-shared"

  # 关键改动：静态编译解决 HarmonyOS 动态库加载问题

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
# config.guess/config.sub 补丁是 autotools 平台适配的标准做法（见 Skill 示例）
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS 动态链接器不信任 ~/usr/local/lib，需使用 --disable-shared 静态编译"
  - "hmdfs 文件系统下 configure 临时目录权限问题（umask 077→022）"
  - "config.sub 需添加 linux-ohos* 到内核验证列表（第 1776 行）"

# ============================================================
# 产物信息
# ============================================================

artifacts:
  binary:
    - "bin/file"
  library:
    - "lib/libmagic.a"
    - "lib/libmagic.so.1.0.0"
  header:
    - "include/magic.h"
  data:
    - "share/misc/magic"
    - "share/misc/magic.mgc"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  build: []
  runtime: []