name: file
version: 5.45
category: utility
description: file - determine file type

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: clang 15.0.4

build:
  source: https://astron.com/pub/file/file-5.45.tar.gz
  system: autotools
  dependencies:
    - clang
    - make
    - zlib
    - bzip2
    - xz
  
  configure_flags:
    - --prefix=${HOME}/usr/local
    - --disable-libseccomp
    - --enable-static
    - --disable-shared
    - LDFLAGS=-static
  
  patches:
    - 0001-config-guess-harmonyos.patch
    - 0002-config-sub-harmonyos.patch

features:
  elf_support: yes
  zlib_support: yes
  bzlib_support: yes
  xzlib_support: yes
  zstdlib_support: no
  lzlib_support: no

test:
  total: 72
  passed: 72
  failed: 0
  result: "所有测试通过"
  note: "使用静态链接解决鸿蒙软链接限制问题"

issues:
  - 动态链接模式下 libmagic.so 软链接无法被加载（鸿蒙 SELinux 限制）
  - 解决方案：使用 --enable-static --disable-shared LDFLAGS=-static

install:
  binaries:
    - $HOME/usr/local/bin/file
  libraries:
    - $HOME/usr/local/lib/libmagic.a
  data:
    - $HOME/usr/local/share/misc/magic.mgc

build_date: 2026-03-23