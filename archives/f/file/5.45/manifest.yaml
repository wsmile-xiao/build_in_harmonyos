software: file
version: "5.45"
status: success
build_system: autotools
compile_date: "2026-03-23"

dependencies:
  required: [clang, make, zlib, bzip2, xz]
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  source: https://astron.com/pub/file/file-5.45.tar.gz
  configure_options:
    - --prefix=$HOME/usr/local
    - --disable-libseccomp
    - --enable-static
    - --disable-shared
    - LDFLAGS=-static
  cflags: null

patches_applied: []

compatibility:
  level: high
  issues:
    - "动态链接模式下 libmagic.so 软链接无法被加载（鸿蒙 SELinux 限制）"
    - "解决方案：使用 --enable-static --disable-shared LDFLAGS=-static"
  notes: |
    使用静态链接解决鸿蒙软链接限制问题。
    支持 elf、zlib、bzlib、xzlib 解压格式识别。
    不支持 zstdlib、lzlib。

test_results:
  type: automated
  total: 72
  passed: 72
  failed: 0
  note: "所有测试通过"

knowledge_gained:
  - "鸿蒙 SELinux 限制导致动态链接的 .so 软链接无法被加载"
  - "使用 --enable-static --disable-shared LDFLAGS=-static 可解决软链接加载问题"
  - "file 命令支持 elf、zlib、bzlib、xzlib 解压格式识别"
