software: ffmpeg
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.8.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8.9"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ffmpeg.org/releases/ffmpeg-2.8.9.tar.gz"

  # 源码校验和
  sha256: "70925edc3002e9b87104ad89c369bf7c0cf17846ff23bc844be9cc224afbb75d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--target-os=linux"
    - "--arch=aarch64"
    - "--cc=clang"
    - "--cxx=clang++"
    - "--ar=llvm-ar"
    - "--nm=llvm-nm"
    - "--ranlib=llvm-ranlib"
    - "--disable-asm"
    - "--disable-yasm"
    - "--disable-inline-asm"
    - "--disable-doc"
    - "--disable-network"
    - "--disable-debug"
    - "--enable-shared"
    - "--disable-ffserver"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - ref: E112
    summary: "ffmpeg 2.8.9 使用自定义 configure 脚本（非标准 autotools），需要 --target-os=linux 因为 uname -s 返回 HarmonyOS"
  - ref: E112
    summary: "需要显式指定 --cc=clang --cxx=clang++ 因为默认检测 gcc"
  - ref: E112
    summary: "ffmpeg 2.8.9 不支持 --disable-x86asm 选项（老版本），使用 --disable-asm --disable-yasm --disable-inline-asm 替代"
  - ref: E112
    summary: "无需修改任何源文件，configure 参数足以适配 OpenHarmony"