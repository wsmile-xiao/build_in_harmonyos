software: ffmpeg
version: 6.1.5
status: built
category: multimedia
license: LGPL-2.1-or-later

# 编译信息
build_system: autotools
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local

# 构建时间
build_date: 2026-05-22
build_duration_seconds: 1920

# 平台信息
platform: OpenHarmony
arch: aarch64
compiler: clang

# 产物信息
artifacts:
  - name: ffmpeg-6.1.5-ohos-aarch64.tar.gz
    size: 216M
    type: release
  - name: ffmpeg-6.1.5-ohos-aarch64-debug.tar.gz
    size: 331M
    type: debug

# 补丁信息
patches:
  - 0001-config.h.patch
  - 0002-config_components.h.patch
  - 0003-doc-config.texi.patch
  - 0004-doc-examples-pc-uninstalled-libavdevice-uninstalled.pc.patch
  - 0005-doc-examples-pc-uninstalled-libavfilter-uninstalled.pc.patch
  - 0006-ffbuild-config.fate.patch
  - 0007-ffbuild-config.log.patch
  - 0008-ffbuild-config.mak.patch
  - 0009-ffbuild-config.sh.patch
  - 0010-libavdevice-libavdevice.pc.patch
  - 0011-libavfilter-filter_list.c.patch
  - 0012-libavfilter-libavfilter.pc.patch
  - 0013-libavformat-udp.c.patch  # OHOS: pthread_cancel 替换为 shutdown
  - 0014-libavutil-file_open.c.patch  # OHOS: /tmp 替换为 /data/local/tmp

# 关键修复
fixes:
  - issue: TMPDIR-hardcoded
    file: libavutil/file_open.c
    description: 将硬编码的 /tmp 路径替换为 /data/local/tmp (OHOS)
  - issue: pthread_cancel-unavailable
    file: libavformat/udp.c
    description: 使用 shutdown() 替代 pthread_cancel() (musl)

# 知识提取
knowledge_gained:
  - E072: config.sub 三元组验证（ffmpeg 使用自定义 configure）
  - PSCAN-FS-001: /tmp 硬编码问题（OHOS 文件系统限制）
  - PSCAN-MUSL-001: pthread_cancel 在 musl 上不可用