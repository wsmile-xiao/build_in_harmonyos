software: fwup
version: 1.16.0
status: built
build_system: autotools
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - CFLAGS=-march=armv8-a+crypto -O2
  - CC=clang
dependencies:
  - libarchive (预编译包)
  - libconfuse (预编译包)
  - lzma (预编译包)
artifacts:
  - fwup-1.16.0-ohos-aarch64.tar.gz
issues_resolved:
  - HMDFS SELinux umask 077 -> 022
  - config.guess 平台识别失败 -> 使用 automake 提供的版本
  - ARM AESCE 编译错误 -> 添加 -march=armv8-a+crypto
  - reallocarray 未定义 -> 手动创建实现
  - liblzma 依赖缺失 -> 安装 lzma 预编译包
notes: |
  fwup 是动态链接的，依赖 libconfuse.so 和 libarchive.so。
  用户需要先安装这些依赖才能运行 fwup。
