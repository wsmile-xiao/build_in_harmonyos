software: fortune
# 软件级 manifest 模板
# 文件位置: archives/f/fortune/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: fortune

# 软件描述（一句话）
description: "Infamous electronic fortune-cookie generator"

# 软件分类（用于依赖排序）
# 基础库 | 工具 | 游戏 | 网络 | ...
category: games

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "9708"
    status: published
    build_date: "2026-05-19"
    patches: 1
    tarball: fortune-9708-ohos-aarch64.tar.gz

# ============================================================
# 源码信息
# ============================================================

source:
  # 默认源码 URL（可被版本级覆盖）
  url_template: "https://www.ibiblio.org/pub/linux/games/amusements/fortune/fortune-mod-{version}.tar.gz"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  build: []
  runtime: []

# ============================================================
# 平台适配
# ============================================================

platform_notes:
  ohos:
    - "使用 POSIX regex 替代 BSD regex"
    - "禁用 offensive 内容编译"
    - "Makefile 需添加 DESTDIR 支持"