# test_package/MANIFEST.yml
# 上游官方测试声明文件 — fxdiv 0.0-git63058eff77
# 上游测试在探索编译阶段已用等价 gtest 源码实际构建运行（ctest 2/2 通过），
# 见 reports/upstream-tests-ledger.md 的完整枚举台账。

package: fxdiv/0.0-git63058eff77
homepage: "https://github.com/Maratyszcza/FXDiv"

# 上游测试命令（本机探索编译阶段实测）
upstream_check_command: "cmake -DFXDIV_BUILD_TESTS=ON -DFXDIV_BUILD_BENCHMARKS=OFF -B build && cmake --build build --target multiply-high-test quotient-test && ctest --test-dir build"

# conanfile.py build() 中是否已集成上游测试
# 未集成：上游 CMake 用 ExternalProject 从 GitHub 下载 GoogleTest/GoogleBenchmark
# 源码（CI 网络禁 GitHub），conanfile.py 关闭 FXDIV_BUILD_TESTS；上游 20 个
# TEST_CASE 已在本机探索编译阶段用 gtest 源码实际构建运行全部通过。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（独立上游用例，均已实际构建运行并全部通过）
upstream_tests:
  - file: test/multiply-high.cc
    source: fxdiv-0.0-git63058eff77/test/multiply-high.cc
    description: "multiply-high 单元测试（3 个 TEST_CASE: uint32_t/uint64_t/size_t）"
    command: "./multiply-high-test"
  - file: test/quotient.cc
    source: fxdiv-0.0-git63058eff77/test/quotient.cc
    description: "quotient 单元测试（17 个 TEST_CASE，含 divide_by_1/divide_zero/2 的幂/与原生除法比对等）"
    command: "./quotient-test"

# 上游基准/样例（非独立测试用例，台账中明确列出）
benchmarks:
  - file: bench/divide.cc
    description: "除法微基准（google benchmark，非测试用例）"
  - file: bench/init.cc
    description: "init 微基准（google benchmark，非测试用例）"
  - file: bench/multiply.cc
    description: "multiply 微基准（google benchmark，非测试用例）"
  - file: bench/quotient.cc
    description: "quotient 微基准（google benchmark，非测试用例）"
  - file: bench/round-down.cc
    description: "round-down 微基准（google benchmark，非测试用例）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试 — 公开头文件 fxdiv.h 调用公开 API（divide/quotient/round_down/remainder），验证编译链接运行"
    command: "./test_fxdiv"
  - file: ohos_special_test.c
    description: "HarmonyOS 专项测试 — __OHOS__ 小端校验 + 64 位 magic divisor 交叉验证（5 组用例 + size_t 族）"
    command: "./test_ohos_special"

# 测试断言/校验总数（上游 20 个 TEST_CASE + 消费者 6 项 API 校验 + OHOS 专项 5 组除法交叉验证）
assertion_count: 31