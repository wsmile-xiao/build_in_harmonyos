# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.0-git63058eff77/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.0-git63058eff77"

# 软件名
software: fxdiv

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/Maratyszcza/FXDiv"

  # 源码校验和
  sha256: "ec74d882a0a47cfd9c0f95bc4fae9901a4ade802a96a3b76e02671bb7340a4c5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "fxdiv 为 header-only INTERFACE 库（CMake INTERFACE target），无二进制产物，package_info 中 cpp_info.libs 必须为空"
- "上游 CMake 用 ExternalProject 从 GitHub 下载 GoogleTest/GoogleBenchmark 源码（CI 禁 GitHub 直连），conanfile.py 必须 FXDIV_BUILD_TESTS=OFF / FXDIV_BUILD_BENCHMARKS=OFF，由 test_package 消费者测试 + OHOS 专项测试覆盖；本地探索编译阶段用 codeload 官方 archive + 制品仓等价 gtest 源码实测 20 个 TEST_CASE 全部通过"
- "OHOS 下 CMakeToolchain 需显式 CMAKE_SYSTEM_NAME=Linux（R32 平台兼容映射）"
- "CMake 4.x 与上游旧版 googletest 1.10 / benchmark 1.5 不兼容：需 CMAKE_POLICY_VERSION_MINIMUM=3.5；benchmark 1.5 的 write_basic_package_version_file 缺 VERSION 生成失败，基准非测试用例可关闭"
- "本地 W3 JC 门禁 full 模式整仓扫描会误拦截其他库 HEAD 已跟踪的基线隐藏文件（cloog/kics .build-closed/.staging-verified），需按基线隔离规则记录 SHA-256→临时隔离→复跑→原样恢复，或用 pr.diff（prdiff 模式）与真实 CI 同口径复跑受影响门禁"

# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
