# fdk-aac 2.0.3.2 test_package manifest
# 上游官方测试套件随包构建:官方发行包自带 test-encode-decode 工具不随
# cmake install 安装(仅 BUILD_PROGRAMS=ON 时留在构建树),故将上游源文件
# vendor 进 test_package,与消费者探针同批构建。

probe:
  name: fdk_aac_probe
  language: C
  assertion_count: 18
  description: |
    确定性合成 PCM(441Hz 正弦表+LCG 噪声, 2s@44.1kHz mono,纯整数运算
    与 libm 无关) → AAC-LC/ADTS 编码(逐帧+flush) → ADTS 流解码往返;
    结构断言(帧数/样本数/能量/往返误差/非法参数拒绝)+ 聚合 SHA-1 哈希
    输出(与上游同口径)。哈希仅同架构可比:FDK 在 aarch64 使用 16-bit
    系数表 + 32x16 定点乘法(FDK_archdef.h),码流跨架构设计上非位元一致。

upstream_tests:
  - name: test-encode-decode
    origin: fdk-aac 2.0.3 官方发行包(fdk-aac-2.0.3.tar.gz 根目录)
    sources:
      - upstream-test/test-encode-decode.c
      - upstream-test/wavreader.c
      - upstream-test/wavreader.h
      - upstream-test/sha1.c
      - upstream-test/sha1.h
    license: FDK-AAC(upstream-test/NOTICE 随附)
    note: |
      官方 run-test.sh 语义:输入 wav → 内部按声道数跑全模式矩阵
      (mono 11 模式 / stereo 25 模式,含 AAC-LC/HE-AAC/HE-AACv2/
      AAC-LD/AAC-ELD + VBR 变体),所有模式编码/解码块累计进同一对
      全局 SHA-1,输出两行哈希与 ref-stereo.txt/ref-mono.txt 比对;
      退出码 = failures 数(各模式解码 avg_diff 超上游阈值即计 failure)。
  - name: official-fixture-suite
    trigger: Sample01_4.wav 与 Sample01_4-mono.wav 置入测试输出目录
    semantics: |
      test.sh phase 2 = 官方 run-test.sh 全语义(md5 校验 + 哈希比对),
      按架构分流:官方 ref 生成于 x86;x86 必须与 ref 位元一致(MinGW
      本地已验证);其他架构(真机 aarch64)以上游工具自身质量门禁
      (退出码 0 + 各模式 avg_diff 阈值,真机 0 failures)+ 哈希行形状
      校验为准——FDK_archdef.h 按架构选 16-bit 系数表,跨架构位元非一致。
    fixtures:
      Sample01_4.wav: "官方 Xiph media.xiph.org/audio/HA_2011, 1543244 B,
        md5 a5c105544c64ce92c6c5c06d280e6b9c"
      Sample01_4-mono.wav: "ffmpeg -i Sample01_4.wav -ac 1 -fflags +bitexact,
        md5 3bfccac9f2e527ba3ef888874f09a409"
  - name: synthetic-wav-smoke
    trigger: 无官方 fixture 时(CI 兜底)
    semantics: "gen_fixture.py 生成确定性 wav,官方工具跑全矩阵,
      断言退出码 0 + 哈希行形状(正则 ^encode/decode hash: [0-9a-f]{40}$)"
