notes: |
  R37 版本递增:任务版本 2.0.3 已存在于官方 main 与制品仓(同赛道竞争者
  MR #12445/#12643 已占用 2.0.3/2.0.3.1),上游源码保持 2.0.3 发行包不变,
  仅 Conan 版本递增至 2.0.3.2。

  适配要点:
  - 零 patch:官方 cmake 原生可构建,SourceForge 官方源直连可用。
  - BUILD_PROGRAMS=ON:构建官方自检程序 aac-enc(install)+
    test-encode-decode(留构建树);后者源文件 vendor 进 test_package 随探针重编。
  - 真机 ninja 并行度限 8(进程配额,见 knowledge_gained)。
  - 消费者探针 18 断言 + 上游官方套件 + 合成 wav 烟测三阶段。
  - 官方套件哈希比对按架构分流(x86 位元 / aarch64 上游质量门禁)。

  真机验证(2026-09-27, aarch64, 通道2/3 中继):
  - conan-verify 八门禁 G0-G4 + L2/L4/L5 全绿,报告
    reports/conan-verify-report.md,无 EACCES。
  - probe 18/18 断言全过;官方 wav 双 fixture 全模式矩阵 0 failures
    (stereo 哈希 18bca4c9…/8b75d6c8…,mono e4cdfdcf…/cb13f43b…,与 x86
    官方 ref 不同为架构定点表位宽差异,非缺陷);phase 3 合成 wav 烟测过。
  - 本地 MinGW x86_64:官方双 wav 哈希与 ref-stereo.txt/ref-mono.txt
    逐字节一致(x86 位元一致性实证)。
