software: fdk-aac
version: "2.0.3.2"
status: published
build_system: cmake
build_date: "2026-09-27"
created_at: 2026-09-27
configure_options:
  - BUILD_PROGRAMS=ON
  - BUILD_SHARED_LIBS=ON
  - CMAKE_BUILD_PARALLEL_LEVEL 不可用:真机 ninja 并行度必须配方内限 --parallel 8
knowledge_gained:
  - "鸿蒙真机沙箱进程配额:20 核默认 ninja 并行度 ≈45 活进程触发 posix_spawn EAGAIN,cmake 家族配方必须 cmake.build(cli_args=['--parallel','8'])(坑位手册 #20 同源,kea meson compile -j 8)"
  - "上游官方测试套件语义:test-encode-decode 输入 wav 按声道数跑全模式矩阵,全模式编码/解码块累计进同一对全局 SHA-1,输出两行哈希与 ref-*.txt 比对,退出码=failures 数(各模式解码 avg_diff 超上游阈值计 failure)"
  - "定点编解码库跨架构位元非一致实证(FDK_archdef.h):aarch64 经 FDK_archdef.h:117 统一为 __arm__ 后选 ARCH_PREFER_MULT_32x16 + SINETABLE_16BIT/POW2COEFF_16BIT 等 16-bit 系数表,x86 用 32-bit 表 → 编码码流跨架构设计上非位元一致(真机 aarch64 全模式 0 failures 但哈希 ≠ x86 官方 ref)。官方哈希 ref 类测试必须按架构分流:x86 严格位元比对,其他架构以上游质量门禁(退出码 0 + avg_diff 阈值)+ 哈希行形状为准"
  - "跨平台确定性合成信号:测试输入 wav/PCM 禁用 math.sin(libm 跨实现非位元一致),改用编译期嵌入整数正弦表 + 整数 LCG,同架构跨工具链位元可复现(probe.c 与 gen_fixture.py 同表)"
patches_applied: []
build_log: logs/build.log
