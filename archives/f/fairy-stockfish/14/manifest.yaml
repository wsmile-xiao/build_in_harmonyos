software: fairy-stockfish
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "14"
status: published
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ghfast.top/https://github.com/fairy-stockfish/Fairy-Stockfish/archive/refs/tags/fairy_sf_14.tar.gz"
  sha256: "db5e96cf47faf4bfd4a500f58ae86e46fee92c2f5544e78750fc01ad098cbad2"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "ARCH=armv8"
    - "COMP=clang"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Makefile.patch"

patch_classification:
  - file: 0001-Makefile.patch
    type: portability
    description: "移除 -latomic（鸿蒙无此库），添加 -static-libstdc++（R26 静态链接）"
    platform_only: true
    guard: none

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "fairy-stockfish 使用自定义 Makefile，非 autotools/cmake"
  - "源码在 src/ 子目录中，GitHub 归档结构为 Fairy-Stockfish-fairy_sf_14/src/"
  - "鸿蒙 aarch64 无 libatomic，需移除 Makefile 中的 -latomic 链接选项"
  - "使用 ghfast.top 镜像解决 GitHub 下载超时问题（E017）"
  - "Conan 2.x test_package 中 deps_cpp_info 不可用，需用 self.dependencies"

# ============================================================
# Conan 配方信息
# ============================================================

conan:
  reference: "fairy-stockfish/14@ohpcd/stable"
  verify_status: PASS
  gates_passed: ["G0", "G1", "G2", "G3", "G4", "L2", "L4", "L5"]
  static_linking: true
  build_shared_libs: OFF
