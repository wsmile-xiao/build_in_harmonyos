# conandata.yml — folly v2026.07.27.00
# 源码唯一真相：下载 URL + sha256 + patches。
# conanfile.py 通过 self.conan_data["sources"] 和 apply_conandata_patches() 读取。
#
# 来源说明：官方 GitHub TagIt 自动发布 tag 的 archive URL（非 release 资产字节）。
# 本地 curl 实测得到该 URL 的 tar.gz SHA256（b3bc3805... 是官方 release 资产
# folly-v2026.07.27.00.tar.gz 的哈希，二者字节不同，不可混用——conan 用哪个 URL
# 就记录哪个 URL 的 sha）。Gitee mirrors 的 folly 未同步到 2026.07 版本，故用官方源。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/facebook/folly/archive/refs/tags/v2026.07.27.00.tar.gz"
    - "https://github.com/facebook/folly/archive/refs/tags/v2026.07.27.00.tar.gz"
  sha256: "dcb373984e571468659be8a74c0a43a1cb6548fbe5579a806674db43d7261c4e"

patches:
  # 0001：把 Boost::context 从主 Boost 组件拆出，单独 find_package(Boost.Context)。
  # OHOS 整合 boost 均不提供 context，context 由拆分包 boost1.84-context 提供。
  - patch_file: "patches/0001-CMake-folly-deps.cmake.split-context.patch"
    apply_to: source
  # 0002：Elf.cpp 的 FOLLY_ELF_NATIVE_CLASS 平台宏回退。
  # OHOS 不定义 __ELF_NATIVE_CLASS（musl 风格 libc），原宏链只覆盖 FreeBSD/Android，
  # 导致 257 行 EXPECTED_CLASS 展开为未声明标识符；按 Android 同款 __WORDSIZE 回退。
  - patch_file: "patches/0002-Elf.cpp.OHOS-ELF_NATIVE_CLASS.patch"
    apply_to: source
  # 0003：打包消费方配置 folly-config.cmake.in 亦硬编码 Boost COMPONENTS context，
  # 会让下游 find_package(folly CONFIG) 对主 Boost 请求 context 组件而失败；
  # 与 0001 (folly-deps.cmake) 同理拆出 context，独立 find_package(Boost.Context)。
  - patch_file: "patches/0003-CMake-folly-config.cmake.in.split-context-consumer.patch"
    apply_to: source