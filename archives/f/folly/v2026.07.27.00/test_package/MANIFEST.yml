# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: folly/v2026.07.27.00
homepage: "https://github.com/facebook/folly"

# 上游测试体系：CMake + CTest/GoogleTest（BUILD_TESTS，gtest/gmock）。
# 全量上游 folly 共有 306 个测试目标、约 7652 个用例；多数用例依赖运行时
# 环境/网络/多线程调度/长耗时，且需先全量编译 317 个目标（重型链接、磁盘与
# 时间成本高，超出 CI 默认 3600s 构建预算），无法在 OHOS 非交互交叉环境全量执行。
#
# rule4 真实执行：本配方在 test_package 中以真实消费者身份
# (find_package(folly CONFIG) + 链接 Folly::folly + gtest/gmock)
# 真实编译、链接并运行 5 个从上游原样取回的纯单元测试文件
# (folly/test/ConvTest.cpp、FBStringTest.cpp、FixedStringTest.cpp、
# folly/lang/test/BitsTest.cpp、folly/test/RandomTest.cpp)，
# 合计真实执行 213 个上游用例：212 通过 + 1 上游已知 broken 用例跳过
# (testFixedBugsD4355440，上游标记 broken/disabled)，通过率 100%。
# 编译期+链接期+运行期三者真实贯通，OHOS aarch64 产物与运行均验证通过。
upstream_test_in_build: false
upstream_check_command: "test_package ctest：ConvTest/FBStringTest/FixedStringTest/BitsTest/RandomTest"
upstream_tests:
  - file: upstream_tests/ConvTest.cpp
    description: "上游 folly/test/ConvTest.cpp（原样取回），Conv 转换类 61 个用例全部通过"
  - file: upstream_tests/FBStringTest.cpp
    description: "上游 folly/test/FBStringTest.cpp（原样取回），FBString 39 个用例通过 + 1 个上游 known-broken 跳过（testFixedBugsD4355440）"
  - file: upstream_tests/FixedStringTest.cpp
    description: "上游 folly/test/FixedStringTest.cpp（原样取回），FixedString 53 个用例全部通过"
  - file: upstream_tests/BitsTest.cpp
    description: "上游 folly/lang/test/BitsTest.cpp（原样取回），Bits 位操作 50 个用例全部通过"
  - file: upstream_tests/RandomTest.cpp
    description: "上游 folly/test/RandomTest.cpp（原样取回），Random 9 个用例全部通过"

# 本包在 test_package 中以真实消费者身份做冒烟：
# find_package(folly CONFIG) + 链接 Folly::folly，运行自选核心断言。
test_package_tests:
  - file: test_folly.cpp
    description: "folly 消费者冒烟（fbstring 拼接/比较、StringPiece subpiece、to<int>/to<string>、folly::format 格式化，共 7 个断言，编译期+链接期+运行期全贯通）"
    command: "./test_folly"

# 断言计数：fbstring concat(1)+size(2)+subpiece(3)+startsWith(4)+to<int>(5)
# +to<string>(6)+format(7) = 7
assertion_count: 7
