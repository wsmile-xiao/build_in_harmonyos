# 版本级 manifest — folly v2026.07.27.00
# 遵循 ARCHIVE-SPEC v2.0

software: folly
version: "v2026.07.27.00"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（官方 GitHub TagIt 自动发布 tag 的 archive URL）
  url: "https://github.com/facebook/folly/archive/refs/tags/v2026.07.27.00.tar.gz"
  # archive URL 实际字节的 SHA256（与官方 release 资产 b3bc3805... 不同，见 conandata.yml 注释）
  sha256: "dcb373984e571468659be8a74c0a43a1cb6548fbe5579a806674db43d7261c4e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: cmake
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "-DBUILD_TESTS=OFF"
  dependencies:
  - "boost/1.90.0.4"
  - "boost1.84-context/1.84.0.1"
  - "fast_float/8.0.1"
  - "glog/0.7.1"
  - "libevent/2.1.13"
  - "openssl/3.0.21"
  - "fmt/12.2.0"
  - "gflags/2.2.2"
  - "zlib/1.3.1"
  - "zstd/1.5.7"
  - "snappy/1.2.2"
  - "lz4/1.10.0.1"
  - "libsodium/1.0.20"
  - "libunwind/1.6.2"
  - "libaio/0.3.112.1"
  - "liburing/2.15"
  - "bzip2/1.0.8"
  - "gtest/1.17.0 (test)"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-CMake-folly-deps.cmake.split-context.patch: 主 Boost find_package 去掉 context 组件，改由拆分包 Boost.Context 提供（整合 boost 无 context 组件）"
  - "0002-Elf.cpp.OHOS-ELF_NATIVE_CLASS.patch: OHOS(musl) 不定义 __ELF_NATIVE_CLASS 且无 __WORDSIZE，按 __LP64__ 判定 FOLLY_ELF_NATIVE_CLASS"
  - "0003-CMake-folly-config.cmake.in.split-context-consumer.patch: 消费方 config 同步拆分 context（与 0001 一致），独立 find_package(Boost.Context)"
# 均为最小可解释补丁，基于源码解压后文件状态用 diff -ruN 生成，fuzz=0 严格行号。

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "conan 2.29 CMakeDeps 对静态库(library+shared=False)向下游裁剪依赖 headers（requires.py STATIC→headers=False）：公共头暴露的依赖必须在 requirements() 显式 transitive_headers=True + cpp_info.requires 声明，否则消费方拿不到 fmt/boost 等 INCLUDEDIRS，fmt/format.h not found"
  - "fmt 取代 double-conversion：folly 2026 版 folly-deps.cmake 已无 FindDoubleConversion，公共头 FBString.h 直接 #include <fmt/format.h>"
  - "OHOS 交叉编译 try_run 探测器可用 aarch64+musl 宿主机原生透传（ohos-emu.sh wrapper 作为 CMAKE_CROSSCOMPILING_EMULATOR）得到真实结果，非伪造 EXITCODE"
  - "OHOS(musl) 无 __ELF_NATIVE_CLASS/__WORDSIZE，需按 __LP64__ 判定 ELF 字宽；conan toolchain 默认 CMAKE_SYSTEM_NAME=HarmonyOS 需 os 守卫改回 OHOS 以免平台变量留空"

patch_generation:
  method: conan-apply-patches
  # patches 基于源码解压后的文件状态生成，fuzz=0 严格行号。

# 编译器环境备注
toolchain:
  clang: "15.0.4"
  target: "aarch64-unknown-linux-ohos"
