software: fpc
display: "Free Pascal Compiler"
description: "Free Pascal Compiler (FPC) 与 RTL，用于在 HarmonyOS PC 上编译 Object Pascal 程序（下游：lazarus）。"
category: build-tool
homepage: "https://www.freepascal.org/"
license: "GPL-2.0-or-later WITH GCC-exception-3.1 AND LGPL-2.1-or-later WITH GCC-exception-3.1"
build_system: custom

ohos_adaptation:
  key_points:
    - "FPC 3.2.2 无原生 ohos 目标（rtl/ 与 compiler/systems/ 只有 linux/android），目标定为 aarch64-linux。"
    - "官方编译器二进制静态链接（ELF statically linked），可在 OHOS aarch64 原生运行，不依赖 glibc/musl。"
    - "FPC 构建 RTL 时调用外部 GNU as，OHOS worker 不保证存在；因此改用官方 aarch64-linux 发行组装，配 pin 的 sha256。"
    - "包内 bin/fpc 为可重定位 shell 启动器，强制 -Aelf -Xi（FPC 内部 ELF 汇编器/链接器），无需宿主 binutils。"
    - "同时交付上游源码 rtl/ 子树，供下游 lazarus 的 FPCDIR/rtl 检查。"
  common_dependencies: []

versions:
  "3.2.2":
    status: built
    build_date: "2026-09-25"
    conan_ref: "fpc/3.2.2"
