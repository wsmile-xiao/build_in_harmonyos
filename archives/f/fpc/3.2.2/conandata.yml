# conandata.yml — fpc 3.2.2 (official Free Pascal release inputs)
# R39/PF7: official https sources only.
#
# FPC 3.2.2 has no native `ohos` target, so the target is aarch64-linux.
# The CI hits Conan's source download cache (`core.sources:download_cache`, keyed
# by the file-content sha256 below) so the 190 MB of inputs are served locally
# instead of being fetched from downloads.freepascal.org over the slow worker link.

sources:
  # Full upstream compiler sources (compiler + rtl + packages + utils).
  # The rtl/ subtree is re-exported as the FPCDIR source tree for consumers.
  # downloads.sourceforge.net is the alternate host linked from the official
  # freepascal.org download page; it is listed second so the canonical URL is
  # always tried first.
  url:
    - "https://downloads.freepascal.org/fpc/dist/3.2.2/source/fpc-3.2.2.source.tar.gz"
    - "https://downloads.sourceforge.net/project/freepascal/Source/3.2.2/fpc-3.2.2.source.tar.gz"
  sha256: "d542e349de246843d4f164829953d1f5b864126c5b62fd17c9b45b33e23d2f44"

distribution:
  # Official aarch64-linux binary distribution.  The compiler executables are
  # statically linked, so this runs natively on OHOS aarch64.
  # The outer tar contains a nested binary.aarch64-linux.tar with base/units/utils packs.
  url:
    - "https://downloads.freepascal.org/fpc/dist/3.2.2/aarch64-linux/fpc-3.2.2.aarch64-linux.tar"
    - "https://downloads.sourceforge.net/project/freepascal/Linux/3.2.2/fpc-3.2.2.aarch64-linux.tar"
  sha256: "b39470f9b6b5b82f50fc8680a5da37d2834f2129c65c24c5628a80894d565451"
