knowledge_gained:
  - "FPC 3.2.2 无 ohos 目标，OHOS PC 适配只能以 aarch64-linux 为目标（官方发行同此）。"
  - "FPC 官方 aarch64-linux 编译器静态链接，可直接在 OHOS aarch64 运行；包内不得依赖 glibc/musl。"
  - "FPC 从源码构建 aarch64 RTL 需外部 aarch64-linux-as（GNU binutils）；OHOS worker 不保证，故组装官方发行。"
  - "FPC 支持 -Aelf（内部 ELF 目标写入器）与 -Xi（内部链接器），可产出静态可执行文件，摆脱宿主 binutils。"
  - "包内 bin/fpc 用 shell 启动器按自身路径计算 unit 目录，使 conan 包路径变化后仍可用（官方 driver 保留为 fpc-driver）。"
  - "下游 lazarus 的 Makefile 要求 FPCDIR 下存在 rtl/，故包内附带上游 rtl/ 源码子树。"
  - "CI 到 freepascal.org/SourceForge 链路 ~10-22 KB/s 且会断流：配方按 sha256 预置/复用 Conan 源码缓存（DOWNLOAD_CACHE/s/<sha256>），并用 8 路 Range 分块 + 断点续传下载，规避 get() 单连接慢/超时。"
