# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fplus/0.2.28
homepage: "https://github.com/Dobiasd/FunctionalPlus"

# 上游测试命令 (ctest -N 列出)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# fplus 为 header-only 库，上游测试 (doctest) 独立于配方构建；
# 本地已全量编译运行上游 39 个测试程序并记录于 test-report.md
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（由 test-report.md 台账枚举，424 个独立用例全部通过）
upstream_tests:
  - file: test/compare_test.cpp
    source: fplus-0.2.28/test/compare_test.cpp
    description: "上游 doctest 用例（17 个独立用例）"
    command: "./compare_test"
  - file: test/container_common_test.cpp
    source: fplus-0.2.28/test/container_common_test.cpp
    description: "上游 doctest 用例（65 个独立用例）"
    command: "./container_common_test"
  - file: test/filter_test.cpp
    source: fplus-0.2.28/test/filter_test.cpp
    description: "上游 doctest 用例（27 个独立用例）"
    command: "./filter_test"
  - file: test/maybe_test.cpp
    source: fplus-0.2.28/test/maybe_test.cpp
    description: "上游 doctest 用例（18 个独立用例）"
    command: "./maybe_test"
  - file: test/transform_test.cpp
    source: fplus-0.2.28/test/transform_test.cpp
    description: "上游 doctest 用例（15 个独立用例）"
    command: "./transform_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_fplus.cpp
    description: "消费者验证：真实调用 fplus::keep_if/reduce_1/join 并断言"
    command: "./test_fplus"

# 测试断言总数 (上游 424 用例 + 消费者 3 断言)
assertion_count: 424
