# 版本级 manifest
# 文件位置: archives/f/fplus/0.2.28/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.28"

# 软件名
software: "fplus"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag）
  url: "https://github.com/Dobiasd/FunctionalPlus/archive/refs/tags/v0.2.28.tar.gz"

  # 源码校验和（官方 tag tarball 实测）
  sha256: "8864a3e9bebde6ebed71b49ac2a036cedf9ae0f02ce758bc28c21e6a2ae15803"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（fplus 为 header-only CMake 库）
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # fplus 为 header-only，无运行时/编译期第三方依赖
  # 测试依赖 doctest/2.5.2 仅用于上游测试，不进入配方 requirements

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "fplus (FunctionalPlus) 为 header-only CMake 库，配方应使用 package_type=header-library，package() 直接拷贝 include 树，无需编译"
  - "上游官方 conanfile.txt 声明测试依赖 doctest/2.4.12；制品仓已发布 doctest/2.5.2，测试编译可直接复用"
  - "Conan 2 中 self.copy 已废弃，package() 需用 conan.tools.files.copy(self, ...) 并传 source_folder/package_folder"
  - "CMakeDeps 生成 find_package 名称取自 cpp_info.set_property('cmake_file_name', ...)；test_package 的 find_package 名称必须与之一致（FunctionalPlus）"
  - "官方 GitHub tag tarball 与本地 git archive 产物的 SHA-256 不同属正常，须以 conan 实测 tarball 哈希为准"
