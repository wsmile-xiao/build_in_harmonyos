software: faiss
display: "FAISS"
description: "A library for efficient similarity search and clustering of dense vectors"
category: foundation
homepage: "https://github.com/facebookresearch/faiss"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "C++20 库，使用 CMake 构建系统"
    - "需要 BLAS/LAPACK，OHOS 上用最小 stub 实现（sgemm_/dgemm_/sgemv_）"
    - "ARM NEON 优化自动启用（hamming_neon.cpp, partitioning_neon.cpp 等）"
    - "禁用 GPU/MKL/Python/Metal/Extras 即可在 OHOS 上编译"

versions:
  "1.14.3":
    status: built
    build_date: "2026-07-22"
    build_type: static
  "1.15.0":
    status: built
    build_date: "2026-08-28"
    build_type: static
