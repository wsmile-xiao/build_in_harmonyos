# 版本级 manifest — faiss 1.15.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.15.0"
software: "faiss"
status: built
build_date: "2026-08-28"
build_system: cmake

source:
  url: "https://github.com/facebookresearch/faiss/archive/refs/tags/v1.15.0.tar.gz"
  sha256: "0b94bf4b17229b28a8a6686d7637ce93de4ef25f6308040184675befad9d9332"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DFAISS_ENABLE_GPU=OFF"
    - "-DFAISS_ENABLE_MKL=OFF"
    - "-DFAISS_ENABLE_SVS=OFF"
    - "-DFAISS_ENABLE_PYTHON=OFF"
    - "-DFAISS_ENABLE_C_API=OFF"
    - "-DFAISS_ENABLE_EXTRAS=OFF"
    - "-DFAISS_USE_LTO=OFF"
    - "-DFAISS_OPT_LEVEL=generic"
    - "-DBUILD_TESTING=OFF"
  dependencies: []
  cc: clang
  cxx: clang++
  notes: "C++20 CMake 项目；BLAS/LAPACK 用静态 stub（blas_stub.c）替代 OpenBLAS；CMake patch 在 project() 后强制 CMAKE_SYSTEM_PROCESSOR=aarch64 确保 10 个 NEON TU 编入 libfaiss.a"

patches_applied:
  - file: "patches/fix-neon-simd-on-ohos.patch"
    type: "official"
    description: "CMAKE_SYSTEM_NAME=HarmonyOS 时 CMake 无 Platform/HarmonyOS 模块，project() 将 CMAKE_SYSTEM_PROCESSOR 设为 unknown；conan_toolchain 的 CACHE set 被 project() 覆盖。此 patch 在 project() 返回后强制重设为 aarch64，使 faiss SIMD 选择命中 (aarch64|arm64|ARM64) 分支，10 个 FAISS_SIMD_NEON_SRC（含 distances_aarch64.cpp）编入 libfaiss.a 并定义 COMPILE_SIMD_ARM_NEON"

test_results:
  date: "2026-08-28"
  target: faiss_test
  framework: "GoogleTest 1.17.0"
  total_cases: 508
  total_files: 59
  compiled_files: 53
  excluded_files: 6
  excluded:
    - "test_simd_levels_x86_avx2.cpp   # x86 AVX2 intrinsics (arm64 exclude)"
    - "test_simd_levels_x86_avx512.cpp # x86 AVX512 intrinsics (arm64 exclude)"
    - "test_svs.cpp                     # FAISS_ENABLE_SVS=OFF"
    - "test_svs_metric.cpp              # FAISS_ENABLE_SVS=OFF"
    - "test_rabitq_simd.cpp             # DD-only x86 test; not in generic faiss_test target"
    - "test_simd_perf.cpp               # DD-only test; gated by FAISS_OPT_LEVEL=dd"
  build: PASS
  run: PARTIAL
  passed: 482
  skipped: 11
  failed: 1
  excluded_at_runtime: 14   # /tmp read-only + OnDiskInvertedLists mmap crash
  failures:
    - "ReadIndexDeserialize.SVSVamanaFourccRejected (test expects 'fourcc' substring in SVS-disabled rejection msg; library emits 'Index type 0x44565349 (ISVD) not recognized')"
  excluded_at_runtime_reason: "5 test files hardcode /tmp paths (test_merge, test_ondisk_ivf, test_ivf_sharding, test_disable_pq_sdc_tables, test_mmap); /tmp is read-only on host; OnDiskInvertedLists mmap path segfaults under musl/hmdfs"
  build_findings:
    - "初版构建 CMAKE_SYSTEM_NAME=HarmonyOS => CMAKE_SYSTEM_PROCESSOR=unknown => FAISS_SIMD_NEON_SRC 空、10 NEON TU 缺失；conan_toolchain tc.variables[CMAKE_SYSTEM_PROCESSOR]=aarch64 用 set(... CACHE) 写入，但被 project() 内部覆盖回 unknown；最终修复：CMake patch fix-neon-simd-on-ohos.patch 在 project() 返回后强制 set(CMAKE_SYSTEM_PROCESSOR aarch64)，10 NEON TU 全部编入 libfaiss.a，COMPILE_SIMD_ARM_NEON 已定义（ar t 确认 distances_aarch64.cpp 等 10 个 .o 入档）"
    - "GoogleTest obtained from conan cache (gtest/1.17.0, gtestd3a6fb4517e1a) - no FetchContent network fetch needed"
    - "Tests compiled against faiss source tree (-I<conan-build>/b) not installed headers (installed set lacks faiss/cppcontrib/ and faiss/build.h)"


knowledge_gained:
  - "faiss 1.15.0 要求 C++20（1.14.3 为 C++17），CMake 最低 3.24"
  - "新增 FAISS_ENABLE_SVS 选项（Intel Scalable Vector Search），需禁用"
  - "新增 FAISS_USE_LTO 选项，需禁用（OHOS 工具链 IPO 支持不稳定）"
  - "BLAS stub 方案与 1.14.3 完全通用：sgemm_/dgemm_/sgemv_ 功能实现 + LAPACK 桩"
  - "faiss 1.15.0 仍支持 user-provided BLAS_LIBRARIES/LAPACK_LIBRARIES，stub 方案无需改动"
