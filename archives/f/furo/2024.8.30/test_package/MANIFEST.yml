# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）

package: furo/2024.8.30
homepage: "https://github.com/pradyunsg/furo"

# 上游官方入口:Sphinx 主题(通过 dist-info entry point 注册,html_theme = "furo")
upstream_check_command: "python -c \"import furo; assert furo.__version__ == '2024.8.6'\""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  no_build: "Upstream ships no compiled code and no executable test suite in the wheel: furo is a pure-asset Sphinx theme (HTML templates + CSS/JS assets + __init__.py). The sdist's pytest suite exercises docs builds with a node/webpack toolchain unavailable here; the official wheel used as source is the upstream-built artifact of release 2024.8.6 (task ref 2024.8.30), verified byte-for-byte against the PyPI sha256."
  total: 85
  executed: 0
  passed: 0
  not_run_reason: "R34 data/source-package exemption (cf. pari-seadata-big, agnostic-lizard): a pure-asset theme has no callable API on the build host; consumer verification is byte-level integrity (85/85 pinned files, size+sha256) instead. Runtime rendering requires a Sphinx install (sphinx>=6,<9 + beautifulsoup4 + sphinx-basic-ng + pygments), which are platform Python-ecosystem prerequisites tracked separately."

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: verify_furo.py
    scenario: integrity
    description: "All 85 pinned files (80 theme + 5 dist-info) exist with exact byte identity (size + sha256), no missing and no extra entries; run against the unpacked wheel in build() and against the installed package in test()"
    command: "python3 verify_furo.py --package-root <package-folder>"
  - file: conanfile.py
    scenario: theme-layout
    description: "Theme discovery layout assertions: furo/__init__.py, theme descriptor (theme.toml/theme.conf) and dist-info METADATA present under share/python/site-packages"
    command: "asserted inline by test_package/conanfile.py test()"
