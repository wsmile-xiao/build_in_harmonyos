# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PyPI 主题/纯资产包的 sdist 往往需要 node/webpack 构建链(furo 的 CSS/JS 源在 src/);官方 wheel 即上游构建产物,取 wheel 作源可完全绕开 node 链,配合数据/源码包豁免模式(packagid 清空 + 钉死哈希校验)零编译落地"
  - "wheel 即 zip:conan get() 按 sha256 校验下载后用 unzip() 展开,无需 pip"
  - "Sphinx 主题按 site-packages 布局安装(share/python/site-packages/<pkg> + dist-info),导出 PYTHONPATH 使 dist-info 的 entry point 主题发现机制直接生效"

