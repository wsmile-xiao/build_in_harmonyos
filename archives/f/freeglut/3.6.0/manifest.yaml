software: freeglut
version: "3.6.0"
status: built
build_date: "2026-09-15"
build_system: cmake

source:
  url: "https://github.com/freeglut/freeglut/releases/download/v3.6.0/freeglut-3.6.0.tar.gz"
  sha256: "9c3d4d6516fbfa0280edc93c77698fb7303e443c1aaaf37d269e3288a6c3ea52"
  tar_format: tar.gz

build:
  system: cmake
  cmake_options:
    - "-DFREEGLUT_GLES=ON"
    - "-DFREEGLUT_BUILD_DEMOS=OFF"
    - "-DFREEGLUT_BUILD_TESTS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - egl/1.0.5
    - gles2/2.0.25
  cc: clang
  cxx: clang++

patches_applied:
  - "CMakeLists.txt.patch"
  - "src-fg_internal.h.patch"
  - "src-egl-fg_window_egl.c.patch"
  - "include-GL-freeglut_std.h.patch"
  - "0005-add-ohos-platform-header.patch"
  - "0006-add-ohos-platform-layer.patch"
  - "0007-add-ohos-gl-dispatch.patch"

knowledge_gained:
  - "OHOS 无 X11/Wayland/Android app-glue，但普通进程可用 EGL_DEFAULT_DISPLAY + EGL_KHR_surfaceless_context + pbuffer 配置"
  - "OHOS libGLESv2.so 的直连 GL 符号是调度空桩（glGetString 返回 NULL、glClear 无效），必须经 eglGetProcAddress 取真函数"
  - "OHOS 无 GLES1（GLES/gl.h 与 libGLESv1_CM 均不存在），GLES1 固定管线符号需自行提供桩"
  - "freeglut 各平台 init 必须设置 fgState.Initialised = GL_TRUE，否则 glutCreateWindow 报 called without first calling glutInit"
  - "cmake 4.x 不再兼容 cmake_minimum_required(VERSION 3.1.2)，需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "CMake 的 FindOpenGL 无法自行搜索交叉 sysroot，需显式传 OPENGL_egl_LIBRARY/OPENGL_gles2_LIBRARY/OPENGL_*_INCLUDE_DIR"
