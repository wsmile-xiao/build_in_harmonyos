# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: freeglut/3.6.0
homepage: "https://github.com/freeglut/freeglut"

# 上游测试命令
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
# 说明：上游测试（test/ 目录）依赖 X11/窗口系统，OHOS 上无法运行，故未启用。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 freeglut 无单元测试框架，其 test/ 目录下的用例均需真实窗口与输入设备，
# 在 OHOS（无窗口系统）环境下不可执行，故如实声明为空。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_freeglut.c
    description: >-
      消费者视角的真实端到端测试（本机即 HarmonyOS aarch64 设备，实际执行）：
      ① glutInit() 初始化；② glutCreateWindow() 创建 300x300 离屏渲染目标并校验
      glutGet(GLUT_WINDOW_WIDTH/HEIGHT)；③ 注册 display 回调，
      glutPostRedisplay()+glutMainLoopEvent() 触发真实渲染；
      ④ 回调内编译链接 GLES2 顶点/片元着色器、绘制三角形、glReadPixels 校验
      中心像素为蓝色（蓝通道>200）；⑤ glutSwapBuffers()+glutDestroyWindow()。
      断言为具体数值（非恒真）。
    command: "./test_freeglut"

verify_points:
  - "test_freeglut 编译通过（consumer 侧 find_package(freeglut) + 链接）"
  - "test_freeglut 实际执行并返回 0"
  - "glutInit/glutCreateWindow 成功（窗口尺寸 = 300x300）"
  - "display 回调被触发 ≥2 次"
  - "GLES2 着色器编译 + 链接成功（v=1 f=1 link=1）"
  - "三角形真实渲染：中心像素 = 0,0,255,255"
  - "GL 入口经 eglGetProcAddress 全部可解析（missing_procs=0）"
