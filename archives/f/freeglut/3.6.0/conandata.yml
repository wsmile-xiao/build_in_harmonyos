# conandata.yml — freeglut 3.6.0
#
# R39：只写官方原始 URL（镜像由 CI 自动注入）。
# 使用上游 GitHub **release** 资产（非 codeload 动态生成的 archive），
# 因为 release 资产的字节是稳定的、sha256 可复核。

sources:
  url: "https://github.com/freeglut/freeglut/releases/download/v3.6.0/freeglut-3.6.0.tar.gz"
  sha256: "9c3d4d6516fbfa0280edc93c77698fb7303e443c1aaaf37d269e3288a6c3ea52"
  # 实测 429,619 字节；顶层目录 freeglut-3.6.0/
  # 注：不在此处写 tar_format —— get() 不识别该参数（会 TypeError）；
  # conan 依 URL 的 .tar.gz 扩展名自动识别格式。

patches:
  # key 必须与 conanfile.version 完全一致，否则 apply_conandata_patches 静默跳过
  "3.6.0":
    - patch_file: "patches/CMakeLists.txt.patch"
      patch_description: >-
        新增 HarmonyOS 平台分支：(1) X11 闸门豁免 HarmonyOS；
        (2) GLES 分支不强制桌面 OpenGL 组件（OHOS 无 libGL）、
        GLESv1_CM 改为非必需（OHOS 无 GLES1）；
        (3) 平台源码选择新增 src/ohos/ 分支；
        (4) 加入 OHOS GL 调度层并设置 -Wl,-Bsymbolic。
      patch_type: "portability"
    - patch_file: "patches/src-fg_internal.h.patch"
      patch_description: >-
        新增 TARGET_HOST_OHOS 平台探测（__OHOS__），并 include
        ohos/fg_internal_ohos.h。
      patch_type: "portability"
    - patch_file: "patches/src-egl-fg_window_egl.c.patch"
      patch_description: >-
        OHOS 上 EGL 配置改用 EGL_PBUFFER_BIT、窗口表面改用
        eglCreatePbufferSurface（OHOS 无窗口系统）。
      patch_type: "portability"
    - patch_file: "patches/include-GL-freeglut_std.h.patch"
      patch_description: >-
        OHOS 无 GLES1 头（GLES/gl.h），故条件化该 include 并补齐核心仍引用的
        GLES1 常量（GL_CURRENT_COLOR 等）。
      patch_type: "portability"
    - patch_file: "patches/0005-add-ohos-platform-header.patch"
      patch_description: "新增 src/ohos/fg_internal_ohos.h（OHOS 平台内部头）。"
      patch_type: "portability"
    - patch_file: "patches/0006-add-ohos-platform-layer.patch"
      patch_description: >-
        新增 src/ohos/fg_ohos.c：实现 OHOS 平台层（生命周期、窗口、主循环、
        状态查询、光标、gamemode、spaceball、joystick、dial 等
        fgPlatform* 接口）。基于 EGL pbuffer 离屏表面实现。
      patch_type: "portability"
    - patch_file: "patches/0007-add-ohos-gl-dispatch.patch"
      patch_description: >-
        新增 src/ohos/fg_gl_dispatch_ohos.c：GL 入口调度层与 GLES1 兼容桩。
        OHOS 的 libGLESv2.so 直连符号是调度空桩，必须经 eglGetProcAddress
        取真函数；另补齐 OHOS 不存在的 GLES1 固定管线入口与串口 API。
      patch_type: "portability"
