# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: flag/0.1.2
homepage: "https://github.com/clibs/flag"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: flag_test.c
    source: flag-0.1.2/flag_test.c
    description: "上游测试：flag_parse()/flagset_parse()/flagset_int()/flagset_string()/flagset_bool()（describe/it 框架，14 个独立用例）"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开 flag.h API 调用 flagset_parse/flag_parse，验证解析结果与错误码"
    command: "./test_flag"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7