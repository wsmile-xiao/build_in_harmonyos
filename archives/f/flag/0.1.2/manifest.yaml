# 版本级 manifest — flag 0.1.2

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.2"

# 软件名
software: "flag"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/clibs/flag/archive/refs/tags/0.1.2.tar.gz"

  # 源码校验和
  sha256: "5f96171e60a4d945fbc460602a7eee3f2737813ec6d4999d4bc74aff0bbf117f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 C99 Makefile 库（无 configure）适配 OHOS：配方内直接用 conf 的 tools.build:compiler_executables 取 clang 编译源文件为静态库，避免裸用 shell ${CC}（R33）"
  - "上游 Makefile 仅构建 test/example 二进制、无 lib/install 目标时，conanfile.py 直接编译 .c 为 .a 并 copy 头文件/库文件完成打包"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
