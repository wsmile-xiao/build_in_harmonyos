# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fastnoiselite/1.1.1
homepage: "https://github.com/Auburn/FastNoiseLite"

# 上游测试命令分析结果：
# 官方 v1.1.1 tag 源码为单头文件库（Cpp/FastNoiseLite.h），无构建系统，
# 无 tests/ 目录、无 CTest/Make check/Meson test 注册，无独立测试用例。
# 仓库仅含各语言移植实现（C/Cpp/CSharp/GLSL/Go/HLSL/Java/JavaScript/Rust）
# 与 WebPreviewApp 交互演示（依赖 imgui_application，非测试）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方 tag 无任何测试注册）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅通过公开头文件 FastNoiseLite.h 与公开 API 生成 2D/3D Perlin 噪声，验证结果在 [-1,1] 且确定性一致"
    command: "./test_fastnoiselite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
