# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "codeload.github.com URL 会被 conan-verify E017 镜像注入误判为 github.com，ghfast.top 代理 codeload 返回 403 导致 BadZipFile；改用官方 github.com/<owner>/<repo>/archive/refs/tags/<tag>.tar.gz 形态（SHA-256 与 codeload 直连一致），详见知识草稿 DRAFT-fastnoiselite-1.1.1-e017-codeload-ghfast-403"
  - "W3/JC 全仓 full 模式会用 git ls-files（索引）扫描，其他库基线空标记文件（.build-closed/.staging-verified）会阻塞当前库；隔离须用 git rm --cached 临时取消跟踪 + 复跑 + git restore --staged 恢复，详见知识草稿 DRAFT-fastnoiselite-1.1.1-jc-full-mode-baseline-junk-isolation"
  - "init-build _promote_nested_source 对多语言仓库会误提升含 CMakeLists.txt 的演示子项目并删除真实源码子目录；恢复方式同 E195/E466：按官方 tarball 布局手工解压重建"
