# test_package/MANIFEST.yml
# Upstream test declaration for fish 3.7.1
# CI script (build_and_test.sh L0e) requires this file

package: fish/3.7.1
homepage: "https://fishshell.com/"

# Upstream test command
upstream_check_command: "make fish_run_tests"

# Conanfile build() does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: "make fish_run_tests"

# Upstream test programs
upstream_tests:
  - file: src/fish_tests.cpp
    source: fish-3.7.1/src/fish_tests.cpp
    description: "Fish low-level test suite (tokenizer, parser, etc.)"
    command: "./fish_tests"

# test_package consumer-perspective tests
test_package_tests:
  - file: conanfile.py
    description: "Verify fish, fish_indent binaries via --version and -c commands"
    command: "fish --version"

# Approximate assertion count
assertion_count: 50
