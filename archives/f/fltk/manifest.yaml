software: fltk
display: "FLTK"
description: "FLTK (Fast Light Toolkit) — cross-platform C++ GUI toolkit（X11 后端）"
category: gui
homepage: "https://www.fltk.org/"
license: LGPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "X11 后端必需 libx11（依赖 libx11/1.8.13，main 上已有适配）"
    - "1.4.x 起新增 FLTK_BACKEND_X11 / FLTK_BACKEND_WAYLAND 后端开关，后者在 UNIX 上默认 ON，必须显式关闭"
    - "可选 X 扩展库（Xinerama/Xfixes/Xcursor/Xft/Xrender）与 GL 全关闭，依赖链短"
    - "JPEG/PNG/ZLIB 用内置实现（FLTK_USE_SYSTEM_*=OFF），无外部图像依赖"
    - "上游无 CTest，test/ 为 demo 程序集合；FLTK_BUILD_TEST=ON 时随 all 目标构建即验证编译链接（沙箱无 X display 无法运行）"
    - "包名 fltk（1.4.x）。同软件另有 archives/l/libfltk 提供 1.3.11（包名 libfltk）；1.4.x 的构建选项整体改名且新增 Wayland 后端开关，无法用同一份配方覆盖"
  common_dependencies:
    - "libx11/1.8.13"
    - "xorgproto/2025.1"
