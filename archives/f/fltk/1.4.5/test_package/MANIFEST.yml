# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fltk/1.4.5
homepage: "https://www.fltk.org/"

# 上游测试形态说明：FLTK 1.4.5 **没有** CTest/单元测试框架，
# 源码树内不存在 enable_testing()/add_test()，`cmake --build . --target test`
# 会直接报错（这一点与 1.3.x 时期的档案不同）。
# 上游的 test/ 目录是一组独立 demo 程序，由 test/CMakeLists.txt 的
# fl_create_example() 生成并挂在默认的 all 目标下——因此本包
# FLTK_BUILD_TEST=ON 时，`cmake.build()`（即 `cmake --build .`）本身
# 就是上游的校验动作：96 个 demo 全部编译+链接成功才算过。
upstream_check_command: "cmake --build . --target all"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际参与构建的 demo 程序（节选代表项；全量 96 个）
upstream_tests:
  - file: test/hello.cxx
    description: "FLTK 最小 hello demo（编译+链接验证）"
    command: "cmake --build . --target hello"
  - file: test/unittests.cxx
    description: "上游唯一的断言型测试程序（unittests.cxx + 15 个 unittest_*.cxx），共 96 个编译单元；沙箱无 X display，只构建不运行"
    command: "cmake --build . --target unittests"
  - file: test/utf8.cxx
    description: "UTF-8 演示程序（编译+链接验证）"
    command: "cmake --build . --target utf8"
  - file: test/file_chooser.cxx
    description: "文件选择器 demo，链接 fltk_images（验证内置 png/jpeg/zlib 静态库可解析）"
    command: "cmake --build . --target file_chooser"
  - file: test/checkers.cxx
    description: "棋类游戏 demo，链接 fltk_images（FLTK_BUILD_TEST=ON 且 shared OFF 时构建）"
    command: "cmake --build . --target checkers"

# test_package 中自带的测试（消费者视角验证，真实编译 + 真实运行）
test_package_tests:
  - file: test_package/test_fltk.cxx
    description: "45 条断言，4 组：A 版本标识 6 条、B UTF-8 编解码 17 条、C 文件名 Unix 语义 9 条、D Fl_Text_Buffer 13 条。全部走不接触 X display 的代码路径，故可在无显示设备的 OHOS 沙箱直接运行"
    command: "test_fltk"
  - file: test_package/conanfile.py
    description: "测试驱动：用 clang++ 真实编译链接消费者程序（self.run() 字面调用）+ 运行；另以不同 LC_ALL 三次调用同一程序的 --expect-utf8locale 模式做平台特有差分断言；并执行包内 bin/fltk-config --version"
    command: "conan test"

# 平台特有测试：fl_utf8locale() 是纯 getenv 启发式
platform_specific_tests:
  - description: "LC_ALL=C 时 fl_utf8locale()==0；LC_ALL=C.UTF-8 / en_US.UTF-8 时 ==1。三次独立进程调用（结果缓存在函数内 static，单进程内无法做差分），断言失败即退出码非 0"
    command: "LC_ALL=<C|C.UTF-8|en_US.UTF-8> test_fltk --expect-utf8locale <0|1>"

# 断言总数：
#   test_package/test_fltk.cxx 内 45 条
#   + 平台特有差分 3 次独立进程调用
#   + bin/fltk-config --version 1 次
# = 49
assertion_count: 49
