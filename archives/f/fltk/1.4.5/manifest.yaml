version: "1.4.5"
software: fltk
status: built
build_date: "2026-09-20"
conan_ref: "fltk/1.4.5"
build_system: cmake

source:
  url: "https://github.com/fltk/fltk/releases/download/release-1.4.5/fltk-1.4.5-source.tar.gz"
  sha256: "eede1fb2b8e9c2e581e77082e15252145855c79aad30070ee3b24aabe2f926f1"
  tar_format: tar.gz

build:
  system: cmake
  dependencies:
    - "libx11/1.8.13"
    - "xorgproto/2025.1"
  configure_options:
    - "UNIX=TRUE"
    - "FLTK_BACKEND_X11=ON"
    - "FLTK_BACKEND_WAYLAND=OFF"
    - "FLTK_USE_XINERAMA=OFF"
    - "FLTK_USE_XFIXES=OFF"
    - "FLTK_USE_XCURSOR=OFF"
    - "FLTK_USE_XFT=OFF"
    - "FLTK_USE_XRENDER=OFF"
    - "FLTK_USE_PANGO=OFF"
    - "FLTK_GRAPHICS_CAIRO=OFF"
    - "FLTK_OPTION_CAIRO_WINDOW=OFF"
    - "FLTK_OPTION_CAIRO_EXT=OFF"
    - "FLTK_BUILD_GL=OFF"
    - "FLTK_USE_SYSTEM_LIBJPEG=OFF"
    - "FLTK_USE_SYSTEM_LIBPNG=OFF"
    - "FLTK_USE_SYSTEM_ZLIB=OFF"
    - "FLTK_BUILD_SHARED_LIBS=OFF"
    - "FLTK_BUILD_TEST=ON"
    - "FLTK_BUILD_EXAMPLES=OFF"
  artifacts:
    - "lib/libfltk.a"
    - "lib/libfltk_images.a"
    - "lib/libfltk_forms.a"
    - "lib/libfltk_png.a"
    - "lib/libfltk_jpeg.a"
    - "lib/libfltk_z.a"
    - "bin/fltk-config"
    - "bin/fltk-options"
    - "bin/fluid"
    - "bin/blocks, bin/checkers, bin/sudoku（FLTK_BUILD_TEST=ON 时随 demo 一并安装）"
    - "include/FL/*.H"
    - "include/FL/images/{png,jpeg,zlib}* 头文件"

patches_applied: []

knowledge_gained:
  - "1.4.x 把 1.3.x 的构建选项整体改名（OPTION_USE_XINERAMA→FLTK_USE_XINERAMA、OPTION_CAIRO→FLTK_GRAPHICS_CAIRO、FLTK_USE_SYSTEM_JPEG→FLTK_USE_SYSTEM_LIBJPEG、OPTION_USE_GL→FLTK_BUILD_GL）。沿用旧名 CMake 既不报错也不失败，只在 configure 末尾给一句 'Manually-specified variables were not used by the project'，于是配方'看起来把选项传进去了、实际一个都没生效'——升级 FLTK 大版本时必须逐个核对 CMake/options.cmake 的 option() 名（ref: conanfile.py generate()）"
  - "FLTK_BACKEND_WAYLAND 在 UNIX 上默认 ON（CMake/options.cmake:280）。保持开启会让 configure 走一条对适配极其不友好的分支：先 pkg_check_modules 探测 wayland-client>=1.18 / wayland-cursor / wayland-protocols>=1.15 / xkbcommon，探测不到就把 FLTK_BACKEND_WAYLAND 自己静默置 0（构建'成功'但选项根本没生效，是假通过）；一旦探测到则强制 FLTK_GRAPHICS_CAIRO=TRUE 并要求 Xfixes/Xrender/Xft/Xcursor/Xinerama 全部存在，缺一即 FATAL_ERROR '*** Terminating: one or more required software package(s) missing.'。显式 -DFLTK_BACKEND_WAYLAND=OFF 可完全绕开该分支"
  - "1.4.x 的库恒为静态构建：fl_add_library(fltk STATIC ...) 是无条件调用，FLTK_BUILD_SHARED_LIBS 的语义是'额外再建一份 shared'（输出名 libfltk.so），不是二选一。沿用 1.3.x 的 OPTION_BUILD_SHARED_LIBS=OFF 思路会让包同时含 .a 与 .so"
  - "1.4.x 已经没有 CTest 目标（源码树内无 enable_testing/add_test），cmake --build . --target test 直接失败。上游 test/ 是一组独立 demo 程序，由 test/CMakeLists.txt 的 fl_create_example() 生成，并被挂到 all 目标下——所以 FLTK_BUILD_TEST=ON 的构建期就是它的'测试期'"
  - "src/drivers/X11/Fl_X11_Window_Driver.cxx 对 XShape 系列符号走 dlopen/dlsym 动态解析（280-306 行），因此在 GL/Xrender 等扩展全关的配置下，静态消费者只需要 -lX11 -ldl，不需要 -lXext"
  - "Fl_System_Driver::filename_ext() 的文档注释写'无扩展名返回 NULL'，实际实现（src/filename_ext.cxx:50）返回指向结尾 '\\0' 的指针，即空串。依赖该返回值判空会写出永远为假的判断"
  - "FLTK_USE_SYSTEM_{LIBJPEG,LIBPNG,ZLIB}=OFF 并不意味着'图像库被编进 fltk_images'：上游把它们各自编译成独立静态库 fltk_png/fltk_jpeg/fltk_z 并 install 到 lib/，fltk_images 只是 PUBLIC 依赖它们（src/CMakeLists.txt:846,905-907，png/CMakeLists.txt:101）。conan 配方若只声明 libs=[\"fltk_images\",\"fltk\"]，用 Fl_PNG_Image/Fl_JPEG_Image 的消费者会在链接期拿到未定义符号"
