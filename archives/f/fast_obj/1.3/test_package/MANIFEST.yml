# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fast_obj/1.3
homepage: "https://github.com/thisistherk/fast_obj"

# 上游测试命令：fast_obj 上游 CMakeLists 提供 FAST_OBJ_BUILD_TEST 选项，
# 构建 test/test.cpp（与 tiny_obj_loader 对比读取同一 .obj 并逐项 CHECK，
# 需外部传入 .obj 文件参数，源码树不携带模型文件）
upstream_check_command: "cmake -DFAST_OBJ_BUILD_TEST=ON .. && cmake --build ."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: fast_obj-1.3/test/test.cpp
    description: "fast_obj vs tiny_obj_loader 对比解析（16 个 CHECK 断言，需命令行传入 .obj 文件）"
    command: "./fast_obj_test <obj file>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：解析 cube.obj，校验 position_count=8 / face_count=6 / group_count=1"
    command: "./test_fast_obj"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
