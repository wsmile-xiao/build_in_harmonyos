# fftwpp 3.03 编译档案
software: fftwpp
version: 3.03
status: built
build_system: upstream-cmake-unused
compile_date: 2026-09-13

dependencies:
  required:
    - fftw/3.3.10
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  package_type: header-library
  configure_options: []
  cflags: ""
  env: {}

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: |
    - header-only C++ 封装：包内 include/fftwpp/ 装 10 个公共头，
      src/fftwpp/ 装 4 个伴随编译单元（fftw++.cc/parallel.cc/Array.cc/Complex.cc），
      消费者按上游示例用法把 fftw++.cc+parallel.cc 编进自己的目标
    - 上游 CMakeLists 只驱动 tests/examples 编译、无 install 规则，
      配方不跑上游构建，直接 copy 头与 .cc 进包
    - 单线程模式（FFTWPP_SINGLE_THREAD）：上游 README 官方开关，
      与仓内 fftw/3.3.10 串行版对齐，同时避开 OHOS OpenMP RUNPATH 坑

test_results:
  type: conan-test-package
  passed: 3
  failed: 0
  note: |
    test_package 编消费者（含包内伴随 .cc、链接 fftw）并真机运行：
      [ok] FFTWPP_SINGLE_THREAD 生效（maxthreads==1）
      [ok] 1D 前向 FFT 数值正确（f[i]=i 的解析谱 X0=6, X1=-2+2i, X2=-2, X3=-2-2i）
      [ok] fftNormalized 反变换还原输入（max err = 0）
    本地 conan create（ohos-aarch64 profile）全绿，3/3 断言通过。

knowledge_gained:
  - "fftw/3.3.10-OHOS（autotools 版）存在计时死锁：WISDOM_ONLY 计划失败后 forget_wisdom 再用 MEASURE 计划会挂起；fftwpp 默认 effort=FFTW_MEASURE 且 Planner() 强制走该链，消费者必须设 fftw::effort=FFTW_ESTIMATE 避让"
  - "fftwpp 是 header+伴随 .cc 结构：CMakeDeps 不导出 srcdirs 变量，消费者需从 package_folder 定位（Conan 2 用 self.dependencies['fftwpp'].package_folder）"
  - "OHOS 上 C++ 消费者运行需显式补 libc++_shared.so 路径（SDK llvm/lib/aarch64-linux-ohos 或 /system/lib64），conanrun 只注入直接依赖 libdir"

references:
  - https://github.com/dealias/fftwpp
  - http://fftwpp.sourceforge.net
