knowledge_gained:
  - "StringZilla 5.1.2 的 gitlink 固定 ForkUnion 版本为上游提交 7f52520e，对应 VERSION 3.0.2；因此单独提供 forkunion/3.0.2。"
  - "ForkUnion 默认无条件获取 Taskflow 仅用于 benchmark；FORKUNION_BUILD_BENCHMARKS=OFF 后，核心 C/C++ 上游测试无需该测试依赖。"
  - "OHOS SDK 缺少 pthread_setaffinity_np；配方在 OHOS 关闭 FU_WITH_PLACE_THREADS_BY_AFFINITY，并通过 Conan header component 传递宏给消费者。"
  - "OHOS SDK 缺少 Block.h；Clang Blocks 用例经 CMake 头文件探测后跳过，不能计入通过数。"
