software: fbida
# 实际产物名称（用户需要的工具）
actual_product: exiftran
# 说明：exiftran 是 fbida 项目中的一个工具，源码包名为 fbida
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.14"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶级字段）
# cmake | autotools | makefile | meson | custom
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.kraxel.org/releases/fbida/fbida-2.14.tar.gz"

  # 源码校验和
  sha256: "95b7c01556cb6ef9819f358b314ddfeb8a4cbe862b521a3ed62f03d163154438"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "JPEG_VER=62"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 环境变量配置（用于 G0 干净构建）
  # 解决缺少 libdrm 等依赖导致的构建失败
  configure_env:
    HAVE_LINUX_FB_H: "no"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libexif/0.6.26
    - libjpeg/3.1.4.1
    - pixman/0.46.4
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - 0001-GNUmakefile.patch
# 注：libexif pkg-config 配置由 clean_verify.py 在构建时动态添加

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "GNUmakefile 使用自定义 autoconf 系统（mk/Autoconf.mk）"
    - "需要设置 JPEG_VER=62 以匹配系统 libjpeg-turbo"
    - "HAVE_LINUX_FB_H=yes 会启用 fbi/fbpdf 构建，需要大量依赖"
    - "G0 干净构建环境可能缺少 libdrm 等依赖，需要通过 configure_env 设置 HAVE_LINUX_FB_H=no"
    - "exiftran 和 thumbnail.cgi 不依赖 HAVE_LINUX_FB_H，可以在缺少部分依赖时正常构建"
    - "需要为 exiftran 和 thumbnail.cgi 添加 libexif 的 pkg-config 选项（通过 clean_verify.py 动态添加）"
    - "G0 干净构建环境缺少 install 命令，需要设置 INSTALL=ginstall"

# 知识图谱引用
knowledge_graph:
    - id: E097
      title: "fbida 使用自定义 autoconf 系统（非标准 autotools）"
      status: built
    - id: E098
      title: "fbida JPEG_VER 版本检测失败（缺少 cpp 预处理器）"
      status: built
    - id: E099
      title: "fbida GNUmakefile 缺少 libexif 的 pkg-config 配置"
      status: built

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/fbida-2.14.orig
  source_work_dir: /storage/Users/currentUser/builds/fbida-2.14.work
  source_orig_hash: bbf57ab263e9dbf0
  source_work_hash: e4e3a7d77448ee1f
  generated_at: '2026-06-12T10:57:32'
  patches_count: 1

patch_classification:
  - file: 0001-GNUmakefile.patch
    type: auto
    platform_only: True
    guard: 'pending'

# ============================================================
# 打包产物
# ============================================================

package:
  # 预编译包名称（基于实际产物命名）
  tarball: exiftran-2.14-ohos-aarch64.tar.gz
  debug_tarball: exiftran-2.14-ohos-aarch64-debug.tar.gz

  # 包内内容
  contents:
    - bin/exiftran
    - lib/external/libjpeg.so
    - lib/external/libpixman-1.so.0
    - share/man/man1/exiftran.1

  # 包大小
  size:
    release: 1644KB
    debug: 1900KB
