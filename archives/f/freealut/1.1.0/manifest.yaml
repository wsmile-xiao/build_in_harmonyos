software: freealut
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（G4 门禁检查字段）
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/f/freealut/freealut_1.1.0.orig.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  # autoreconf -fi (regenerate with autoconf 2.72 + automake 1.17)
  # configure modified: AS_TMPDIR uses ${TMPDIR:-.}/confXXXXXX, removed umask 077

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openal-soft/1.24.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
