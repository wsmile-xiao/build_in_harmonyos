# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 上 umask 077 创建的临时目录无法写入文件，需移除 autoconf AS_TMPDIR 中的 umask 077"
  - "autoconf 2.72 AS_TMPDIR 硬编码 ./confXXXXXX，需改为 ${TMPDIR:-.}/confXXXXXX"
  - "freealut 依赖 OpenAL (openal-soft)，cmd-pkgs 中无预编译包需手动编译"
  - "config.guess 需从 automake-1.17 更新以识别 aarch64-unknown-linux-ohos"

