# test_package/MANIFEST.yml — fmi-ls-bus 1.0.0 上游测试声明
# 上游测试完整枚举见 notes.md 与 adaptation 台账（双口径）：
#   source_declared_total = 234（can 130 + flexray 104）
#   configured_executable_total = 130（v1.0.0 发布版仅含 can 模块头）
#   executed_passed_total = 130（130/130 = 100% 可执行集合）

package: fmi-ls-bus/1.0.0
homepage: "https://github.com/modelica/fmi-ls-bus"

# 上游测试命令（用于 ctest -N 分析）
upstream_check_command: "ctest -N (tests/CMakeLists.txt, MODULE_LIST=can)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（当前 OHOS 配置可实例化集合）
upstream_tests:
  - file: fmi_3_ls_bus_header_tests_can.cpp
    source: fmi-ls-bus-1.0.0/tests/test/fmi_3_ls_bus_header_tests_can.cpp
    description: "CAN 模块头文件 GTest 用例（130 个独立 TEST，v1.0.0 唯一可实例化模块）"
    command: "fmi_3_ls_bus_header_test --gtest_list_tests"

# 上游声明但 v1.0.0 发布版不可实例化（flexray 模块头文件不在发布包内）
# 详见 notes.md 双口径台账：104 个 TEST 源声明计入分母，不计通过。
upstream_tests_declared_uninstantiable:
  - file: fmi_3_ls_bus_header_tests_flexray.cpp
    source: fmi-ls-bus-1.0.0/tests/test/fmi_3_ls_bus_header_tests_flexray.cpp
    description: "FlexRay 模块 GTest 用例（104 个独立 TEST），fmi3LsBusFlexRay.h 在 v1.0.0 发布版不存在（main/v1.1.0-beta.2 起才有），上游 CI 输入亦声明 'Available is can'"
    command: ""
    reason: "fatal error: 'fmi3LsBusFlexRay.h' file not found（MODULE_LIST=all 复现，BUILD_ALL_EXIT:2）"
    restore_condition: "上游发布含 flexray 头的版本后以 MODULE_LIST=all 重建"

# test_package 中自带的消费者测试
test_package_tests:
  - file: test.c
    description: "消费者用例：仅经已安装公开头文件调用 CAN Transmit/Wakeup API 并断言可观察结果"
    command: "./test_fmi-ls-bus"

# 测试断言总数（上游 130 + 消费者 8 + 鸿蒙专项 7）
assertion_count: 145