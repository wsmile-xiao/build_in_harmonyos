# 遵循 ARCHIVE-SPEC v2.0

version: "2.8.0"

software: "far2l-tty"

status: built

build_date: "2026-09-06"
build_system: "cmake"

source:
  url: "https://github.com/elfmz/far2l/archive/refs/tags/v_2.8.0.tar.gz"
  sha256: "b0fddad2e3985f245f9e691e23b90fb97f7d29d9a0b131fe686aa3cbb2e4ea01"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DUSEWX=NO"
    - "-DUSESDL=NO"
    - "-DTTYX=NO"
    - "-DTTYXI=NO"
    - "-DUSEUCD=NO"
    - "-DCOLORER=NO"
    - "-DNETROCKS=NO"
    - "-DNR_SMB=NO"
    - "-DNR_AWS=NO"
    - "-DMULTIARC=NO"
    - "-DPYTHON=NO"
    - "-DTESTING=NO"
    - "-DLEGACY=NO"
    - "-DMUSL=YES"
    - "-DCMAKE_CXX_STANDARD=17"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "far2l/2.8.0.1 同源 TTY 构建经验可直接复用（USEWX/TTYX/USEUCD/NETROCKS/MULTIARC 全关 + MUSL=YES）"
  - "Homebrew far2l-tty 的 NETROCKS/MULTIARC/COLORER=ON 在 OHOS 因缺 conan 依赖（libnfs/uchardet 无配方）降级为 NO"
  - "上游 6 个 Go smoke 测试需 Go 工具链 + 外网，设备不可跑（见 notes.md 实测记录）"
