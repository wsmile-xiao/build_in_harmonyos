# 版本级 manifest — findlib (ocamlfind) 1.9.8
# 文件位置: archives/f/findlib/1.9.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

software: findlib
version: "1.9.8"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/ocaml/ocamlfind/archive/refs/tags/findlib-1.9.8.tar.gz"
  sha256: "d6899935ccabf67f067a9af3f3f88d94e310075d13c648fa03ff498769ce039d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # findlib 自带 autoconf 风格 configure，非标准 autotools（无 Makefile.am）
  configure_options:
    - "-bindir <package_folder>/bin"
    - "-mandir <package_folder>/share/man"
    - "-sitelib <package_folder>/lib/ocaml"
    - "-config <package_folder>/etc/ocamlfind.conf"
    - "-no-custom"
    - "-no-camlp4"
  dependencies:
    - "ocaml/4.14.1.1.4"   # tool_requires；CI 无系统 OCaml 工具链
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure.patch"

patch_classification:
  - file: 0001-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
