# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: findlib/1.9.8
homepage: "http://projects.camlcity.org/projects/findlib.html"

# 上游测试命令。findlib 无 `make check`；上游集成测试为源码根目录的
# shell 脚本 `itest`（由 `make all` 构建出的 ocamlfind 驱动）。
upstream_check_command: "./itest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试：itest 遍历库列表并对每个库执行
#   ocamlfind ocamlc -linkall -linkpkg -custom -package <lib> -o simple simple_<lib>.ml
#   运行 simple，断言输出 "OK"
# itest 源码 L92 的库列表：unix str dbm graphics num threads bigarray labltk camlp4
# OCaml 4.14 默认仅存在 unix/str/threads/bigarray 的 META，其余上游自动跳过。
upstream_tests:
  - file: itest
    source: findlib-1.9.8/itest
    description: "集成测试：验证 ocamlfind 为 unix/str/threads/bigarray 正确解析 META linkopts 并驱动编译链接"
    command: "./itest"

# 上游测试结果（2026-09-22 真机实测，OHOS PC aarch64）
# 证据：reports/itest.log（4 个用例的编译阶段 itest-aux/err.out 均为空，
#       日志中无 "an error has occurred" 段落；失败行均为
#       "./itest[101]: itest-aux/simple: Operation not permitted"，即执行阶段）
# 复现方法见 reports/test-summary.md「复现方法与证据」。
upstream_test_results:
  considered: 4               # unix/str/threads/bigarray（其余库无 META，上游跳过）
  compile_pass: 4
  run_pass: 0
  platform_exempt: 4
  fail_analysis:
    - "unix/str/threads/bigarray(4): itest 阶段 1（ocamlfind 解析 META 并驱动编译）4/4 成功——err.out 为空可证；阶段 2 运行时，-custom 字节码混合产物被 OHOS hmmac 拦截（Operation not permitted），重签名后 OCaml custom runtime 报 'no bytecode file specified'（runtime 在 musl aarch64 上误把自身 ELF 当字节码参数）。属 OCaml 运行时平台缺陷，非 findlib 缺陷"
  equivalence_verification:
    method: "ocamlfind ocamlopt -linkall -linkpkg -package <lib>（上游 itest 的同等语义原生路径）"
    results: "unix/str/threads/bigarray 4/4 编译+运行通过（输出 OK）"
    evidence: "reports/equiv-verification.log（SUMMARY: pass=4 fail=0 total=4）"
  skip_analysis:
    - "dbm/graphics/num/labltk/camlp4: OCaml 4.14 默认无对应 META，itest 循环内自动跳过"

test_package_tests:
  - file: test.sh
    description: "消费者视角：ocamlfind 版本、list/query 包解析、驱动 ocamlopt 编译链接并运行真实程序"
    command: "/bin/sh test.sh <findlib_bin> <ocaml_bin> <ocaml_stdlib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
