software: findlib
display: "findlib (ocamlfind)"
description: "OCaml 库管理器，解析包 META 文件并驱动 OCaml 编译器/链接器"
category: development
homepage: "http://projects.camlcity.org/projects/findlib.html"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "OCaml 字节码工具的 shebang 指向编译期嵌入的 ocamlrun 绝对路径（conan store 迁移后失效）+ OHOS hmmac 拒绝执行 shebang 脚本；统一改为显式 $OCAMLRUN 调用"
    - "字节码链接/运行需 CAML_LD_LIBRARY_PATH 指向 ocaml 包的 lib/ocaml/stublibs（dllunix.so 等 C stubs）"
    - "OHOS 无 GNU install(1)，configure 回退为 mkdir -p / cp（上游 BSD 建议）"
    - "需要 tool_requires ocaml/4.14.1.1.4（CI 无系统 OCaml 工具链）"
  common_dependencies:
    - ocaml/4.14.1.1.4

versions:
  "1.9.8":
    status: built
    build_date: "2026-09-22"
