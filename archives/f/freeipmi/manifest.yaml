software: freeipmi
display: "FreeIPMI"
description: "IPMI (Intelligent Platform Management Interface) implementation providing in-band and out-of-band IPMI software"
category: system
homepage: "https://www.gnu.org/software/freeipmi/"
license: GPL-3.0-or-later
build_system: cmake-manual

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "原 autotools 构建系统在 HMDFS 上失败（config.status 无法创建临时文件）"
    - "需要手动创建 CMake 构建系统"
    - "需要更新 config.guess 和 config.sub 到 2023 版本"
    - "静态库需要 POSITION_INDEPENDENT_CODE 才能链接到共享库"
  common_dependencies:
    - libgcrypt

# 版本索引
versions:
  "1.6.10":
    status: built
    build_date: "2026-05-22"