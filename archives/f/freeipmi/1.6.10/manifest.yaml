software: freeipmi
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.10"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统（软件级 manifest.yaml 的字段）
build_system: cmake-manual

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-22"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.gnu.org/gnu/freeipmi/freeipmi-1.6.10.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake-manual
  # 特殊说明：原 autotools 构建系统在 HMDFS 上失败，手动创建 CMake 构建系统

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DWITH_ENCRYPTION=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libgcrypt/1.11.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"

# 编译产物信息
artifacts:
  shared_libraries:
    - "libfreeipmi.so"
    - "libipmiconsole.so"
    - "libipmidetect.so"
    - "libipmimonitoring.so"
  static_libraries:
    - "libdebugutil.a"
    - "libmiscutil.a"
    - "libportability.a"
    - "libparsecommon.a"
    - "libtoolcommon.a"
    - "libpingtool.a"
  executables: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "更新 config.guess 和 config.sub 到 2023 版本以支持 HarmonyOS 平台识别"
  - "config.guess 包含 HarmonyOS 识别逻辑：aarch64-unknown-linux-ohos"

patch_generation:
  method: manual-diff
  source_orig_dir: /storage/Users/currentUser/builds/freeipmi-1.6.10.orig
  source_work_dir: /storage/Users/currentUser/builds/freeipmi-1.6.10.work
  source_orig_hash: becf94e957987cb8
  source_work_hash: 6131c185da1771ce
  generated_at: '2026-05-22T10:39:00'
  patches_count: 2
  note: "手动生成正确的源码补丁，替换了错误生成的 config.log 和 config.status 补丁"

patch_classification:
  - file: 0001-config-config.guess.patch
    type: platform-support
    description: "更新 config.guess 到 2023 版本，添加 HarmonyOS 平台识别支持"
    guard: none
  - file: 0002-config-config.sub.patch
    type: platform-support
    description: "更新 config.sub 到 2023 版本，改进平台识别能力"
    guard: none
