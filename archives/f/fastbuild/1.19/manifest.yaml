# 编译中学到的知识
knowledge_gained:
  - "FASTBuild 硬编码 /tmp 用于锁文件和临时目录，OpenHarmony /tmp 只读需改为 TMPDIR/HOME/tmp"
  - "FASTBuild CPUId 类型仅在 x86_64 下定义，ARM64 需限制条件并添加回退逻辑"
  - "musl libc 缺少 pthread_timedjoin_np，需将 __OHOS__ 加入 Apple 回退分支"
  - "FASTBuild 原项目使用 .bff 自定义构建系统，需创建 CMakeLists.txt 适配"

