patches_applied:
  - "patches/0001-types-aarch64-uintptr.patch"
  - "patches/0002-thread-musl-timedjoin.patch"
  - "patches/0003-writable-tmpdir.patch"
  - "patches/0004-assert-aarch64-break.patch"
  - "patches/0005-readonly-chmod-probe.patch"
  - "patches/0006-failing-command-echo.patch"
