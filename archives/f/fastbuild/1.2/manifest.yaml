  - "patches/0009-save-restamp-outputs-linux.patch"
  - "patches/0010-testexe-order-norebuild-first.patch"

knowledge_gained:
  - "FASTBuild builds itself with .bff files; no ARM bootstrap exists, so the recipe replicates the Linux/Clang build directly with the OHOS clang (same source sets and -D__LINUX__)"
  - "Upstream test suites CoreTest (18 groups) and FBuildTest (34 non-Windows groups) run in build() from the source root; summaries feed HMBS_UPSTREAM_TEST_RESULT"
  - "TestBuildFBuild rebuilds the whole project via Code/fbuild.bff whose .LinuxCompatibilityOptions force-includes glibc_compat.h (.symver memcpy@GLIBC_2.2.5); dropped for the musl test inner-build (product build never uses it)"
  - "TestUnity LinkMultiple_InputFiles chmod probe is applied via anchor-based byte replacement in conanfile (_apply_unity_inputfiles_probe), not a static patch, to survive same-file line shifts from 0008"
