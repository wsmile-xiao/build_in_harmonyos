# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fastbuild/1.2
homepage: "https://fastbuild.org"

# 上游测试命令 (FBuildTest/CoreTest 为自研 TestFramework 二进制, 无 make check/ctest)
upstream_check_command: "./fbuildtest && ./coretest"
upstream_test_in_build: true
upstream_test_command: "coretest + fbuildtest, cwd=source root (FBuildTest::PreTest chdir 到 Code/)"

upstream_tests_exist: true
upstream_test_framework: "fbuild-unittest"
upstream_test_count: 496
upstream_test_audit: "audited FASTBuild-Src-v1.02 (upstream v1.02, FBUILD_VERSION_STRING v1.02) by REGISTER_TEST macro census: 522 textual REGISTER_TEST declarations = CoreTest 124 (18 groups, Code/Core/CoreTest/TestMain.cpp) + FBuildTest 398 (Code/Tools/FBuild/FBuildTest/TestMain.cpp). Windows-only groups excluded: 26 (TestCLR 7, TestCSharp 13, TestCUDA 3, TestResources 2, TestZW 1), yielding N=496 = CoreTest 124 + FBuildTest 372 across 34 non-Windows groups. On HarmonyOS aarch64 457 of the 496 compile and run (39 sit inside #if defined(__WINDOWS__) blocks that upstream Linux/macOS builds equally exclude); 457/457 pass via 'Passed: P / T (F failures)' summaries parsed for the HMBS marker; 0-test or missing summary fails closed."

# 上游实际运行的测试程序
upstream_tests:
  - file: Code/Core/CoreTest/TestMain.cpp
    source: FASTBuild-Src-v1.02/Code/Core/CoreTest/TestMain.cpp
    description: "Core unit tests - 18 groups (containers/threads/IO/network)"
    command: "./coretest"
  - file: Code/Tools/FBuild/FBuildTest/TestMain.cpp
    source: FASTBuild-Src-v1.02/Code/Tools/FBuild/FBuildTest/TestMain.cpp
    description: "FBuild functional tests - 34 groups (BFF parsing/graph/cache/distribution)"
    command: "./fbuildtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "fbuild -version 报告 v1.02"
    command: "fbuild -version"
  - file: hello.c
    description: "fbuild 驱动 OHOS clang 编译 hello.c, 产物 object 非空"
    command: "fbuild -config hello.bff"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
