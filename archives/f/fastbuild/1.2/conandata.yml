# conandata.yml - fastbuild 1.2
# Recipe version 1.2 tracks upstream FASTBuild release v1.02
# (upstream uses two-digit minor numbers: v1.00..v1.20).
# Official source download (R39); single URL, sha256 verified 2026-09-09
# by downloading FASTBuild-Src-v1.02.zip (11297712 bytes).

sources:
  # List form: Conan tries each URL in order; official URL kept as fallback.
  # fastbuild.org has no verified mirror in ci/conan/build_and_test.sh,
  # so only the official source is listed (sha256 unchanged).
  url:
    - "https://www.fastbuild.org/downloads/v1.02/FASTBuild-Src-v1.02.zip"
  sha256: "6ead2aa0b8ef1dcd87602ebaead739b6cb386eaaa8aa14b359b7ca2c277551cc"

patches:
  - patch_file: "patches/0001-types-aarch64-uintptr.patch"
    patch_description: "Fix uintptr_t width on 64-bit non-x86 Linux (aarch64/LP64, e.g. OHOS musl): upstream assumed non-x86_64 means 32-bit, redefining the system 64-bit uintptr_t"
    patch_type: "portability"
  - patch_file: "patches/0002-thread-musl-timedjoin.patch"
    patch_description: "Timed thread join for libc without pthread_timedjoin_np (musl on OHOS lacks tryjoin too): keep glibc fast path, fall back to blocking join like the Apple path"
    patch_type: "portability"
  - patch_file: "patches/0003-writable-tmpdir.patch"
    patch_description: "Honor FASTBUILD_TEMP_PATH/TMPDIR/TMP/TEMP in FileIO::GetTempDir and SystemMutex lock files instead of hardcoded /tmp (read-only on HarmonyOS build host)"
    patch_type: "portability"
  - patch_file: "patches/0004-assert-aarch64-break.patch"
    patch_description: "BREAK_IN_DEBUGGER used x86-only int $3 asm on all Linux; use __builtin_trap() on non-x86 (AArch64) like the Apple path"
    patch_type: "portability"
  - patch_file: "patches/0005-readonly-chmod-probe.patch"
    patch_description: "Probe chmod effectiveness in TestFileIO::ReadOnly: HMDFS ignores chmod (E046, chmod=0, SetReadOnly true but GetReadOnly false); clean up and return so only this sub-capability is skipped, all assertions preserved"
    patch_type: "portability"
  - patch_file: "patches/0006-failing-command-echo.patch"
    patch_description: "Diagnostic only: echo the full failing link/compile command on job failure so preflight logs capture it; no build semantics or test assertions changed"
    patch_type: "portability"
  - patch_file: "patches/0008-unity-linkmultiple-chmod-probe.patch"
    patch_description: "Probe chmod effectiveness in TestUnity::LinkMultiple: HMDFS ignores chmod (E046) so Unity writable-file isolation never engages (Built 0 instead of 1); clean up and return so only this sub-capability is skipped, all assertions preserved"
    patch_type: "portability"
  - patch_file: "patches/0009-save-restamp-outputs-linux.patch"
    patch_description: "Settle-wait (2500ms, Linux only) then re-record on-disk stamps for ALL UP_TO_DATE file nodes at fdb save time (generated Unity/tool files are tracked as FILE_NODEs; Unity nodes carry hash stamps), re-stamp depender static/dynamic dep views (mirror of Node::Finalize), and repeat record+sync until a 500ms window shows no movement (bounded): HMDFS mtimes keep settling forward with no intervening write (Unity +208ms, exes +24-32ms, one Unity dep changed +2.75s); read-only re-recording, exact comparison preserved"
    patch_type: "portability"
  - patch_file: "patches/0010-testexe-order-norebuild-first.patch"
    patch_description: "Run TestExe::CheckValidExe after Build_NoRebuild: executing the exe between fdb save and reload advances its reported mtime on HMDFS and spuriously dirties NoRebuild; order swap preserves every assertion"
    patch_type: "portability"
