# test_package/MANIFEST.yml - flatbuffers 25.12.19
# 上游官方测试声明 + 消费者测试账本

package: flatbuffers/25.12.19
homepage: "https://github.com/google/flatbuffers"

# 上游测试命令（CMake add_test 注册：flattests / flattests_cpp17）
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "flattests; flattests_cpp17（build() 内直接运行二进制，断言 ALL TESTS PASSED 且退出码 0）"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test.cpp
    source: flatbuffers-25.12.19/tests/test.cpp
    description: "flattests 主套件：直接调用层 102 项（FlatBufferTests 函数体 96 个直接调用 + main 内 FlatBufferBuilderTest 展开的 6 个套件调用）；runner 仅打印失败数（testing_fails），退出码 0 即全部通过（runner 随之输出 ALL TESTS PASSED）"
    command: "./flattests"
  - file: tests/cpp17/test_cpp17.cpp
    source: flatbuffers-25.12.19/tests/cpp17/test_cpp17.cpp
    description: "flattests_cpp17 C++17 套件：FlatBufferCpp17Tests 体内 3 个直接调用（CreateTableByTypeTest/OptionalScalarsTest/StringifyAnyFlatbuffersTypeTest）；退出码 0 即通过（runner 随之输出 C++17: ALL TESTS PASSED）"
    command: "./flattests_cpp17"
  - file: grpc/tests/grpctest.cpp
    source: flatbuffers-25.12.19/grpc/tests/grpctest.cpp
    description: "grpctest：上游默认 OFF（FLATBUFFERS_BUILD_GRPCTEST 默认 OFF），需外部 gRPC 安装（GRPC_INSTALL_PATH + gRPC::grpc++_unsecure，制品仓无 gRPC 配方），按上游默认配置不构建不执行"
    command: "skipped: upstream default OFF"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：FlatBufferBuilder/CreateVector/GetRoot<Vector> 往返 + flexbuffers map 往返，共 10 处 CHECK 断言"
    command: "./test_flatbuffers"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 10

# 机器可读消费者账本
consumer_tests: 1
consumer_passed: 1
consumer_assertions: 10

# 上游测试账本（直接调用层静态清点 vs 实际执行；runner 为 fail-only 口径）
upstream_static_total: 105
upstream_executed: 105
upstream_passed: 105
upstream_failed: 0
upstream_skipped: 0
