software: flake
display: "Flake"
description: "FLAC 音频编码器 — 将 WAV 音频无损压缩编码为 FLAC 格式"
category: compress
homepage: "https://sourceforge.net/projects/flake-enc/"
license: LGPL-2.1
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "flake 使用 ffmpeg-style 自定义 configure 脚本，不支持标准 autoconf 的 --build/--host/--target 参数"
    - "需显式传递 --cc=clang --ar=llvm-ar --ranlib=llvm-ranlib 适配鸿蒙工具链"
    - "并行构建有竞态条件，必须顺序构建：make lib && make progs && make utils"
    - "flake 无 make check 测试套件，需手动编码测试验证"
  common_dependencies: []

# 版本索引
versions:
  "0.11":
    status: published
    build_date: "2026-06-17"
