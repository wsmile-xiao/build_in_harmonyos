software: fontforge
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/20230101-r6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "20230101-r6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/fontforge/fontforge/archive/refs/tags/20230101.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DENABLE_GUI=OFF"
    - "-DENABLE_PYTHON_SCRIPTING=OFF"
    - "-DENABLE_PYTHON_EXTENSION=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - freetype/2.3.7+  # 缺失
    - gettext  # 缺失
    - intl  # 缺失
    - iconv  # 缺失
    - glib-2.0/2.88.0  # 已安装
    - libxml-2.0/2.11.9  # 已安装
    - zlib/1.3.1  # 已安装

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "fontforge 使用 CMake 构建系统，而非 autotools"
  - "CLI 工具仍需禁用 GUI 选项: -DENABLE_GUI=OFF"
  - "缺少 freetype 等依赖导致 cmake configure 失败"
  - "cmd-pkgs 预编译包索引获取失败（git init 问题）"
  - "网络下载不稳定，需要解决 SSL 和超时问题"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/cache/builds/fontforge-20230101-r6.orig
  source_work_dir: /data/storage/el2/base/cache/builds/fontforge-20230101-r6.work
  source_orig_hash: 48e9c7fa34809ca0
