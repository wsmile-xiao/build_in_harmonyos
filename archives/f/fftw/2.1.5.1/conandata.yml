# conandata.yml — fftw 2.1.5.1
# 上游源：FFTW 官方（fftw.org，R39 官方正式源）
# 构建为单精度带 s 前缀库（--enable-float --enable-type-prefix），
# 产出 libsfftw/libsrfftw 与 sfftw.h/srfftw.h，供 CCP4 clipper 使用。

sources:
  url: "https://www.fftw.org/fftw-2.1.5.tar.gz"
  sha256: "f8057fae1c7df8b99116783ef3e94a6a44518d49c72e2e630c24b689c6022630"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "0001 config.guess (upgrade to modern version with HarmonyOS aarch64-linux-ohos identification, E007)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "0002 config.sub (upgrade to modern version with ohos triplet support, E072)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "0003 configure (config.status tmp dir via mkdir+chmod; HMDFS mktemp 0700 dir owner-normalization write Permission denied)"
    patch_type: "portability"
  - patch_file: "patches/0004-Makefile.in-sed-source.patch"
    patch_description: "0004 fftw/Makefile.in (sfftw.h sed source uses $(srcdir)/fftw.h which is the unconfigured template under out-of-source builds; use build-dir fftw.h so FFTW_ENABLE_FLOAT stays defined)"
    patch_type: "portability"
  - patch_file: "patches/0005-fftw.h-float-template.patch"
    patch_description: "0005 fftw.h (force FFTW_ENABLE_FLOAT 1 in source template; library code includes fftw.h via quoted include which resolves to the unconfigured template under out-of-source builds, so the library is compiled as double; this forces single precision)"
    patch_type: "portability"
