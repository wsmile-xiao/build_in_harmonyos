knowledge_gained:
  - "FFTW2（2003 版）config.guess/config.sub 无法识别 HarmonyOS，需替换现代版 + 打 E007/E072 OHOS 补丁"
  - "config.status 临时目录用 mktemp+umask 077 创建 0700 目录，HMDFS 属主归一化后当前进程写入 Permission denied；改 mkdir+chmod（与 a52dec 0002 同因）"
  - "顶层 make 遍历 doc/threads/mpi 极慢，仅构建 fftw/rfftw 核心子目录即可（clipper 仅需 libsfftw/libsrfftw）"
  - "FFTW2 --enable-float --enable-type-prefix 产出 sfftw.h/srfftw.h + libsfftw/libsrfftw，符号保持 fftw_* 前缀"

