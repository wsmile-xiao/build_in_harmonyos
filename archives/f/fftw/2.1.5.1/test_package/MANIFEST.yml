# test_package/MANIFEST.yml — fftw 2.1.5.1
# 上游测试声明文件（CI L0e 强制要求）

package: fftw/2.1.5.1
homepage: "https://www.fftw.org/"

# 上游测试命令（autotools 无 make check/ctest 注册，测试为 tests/ 下独立程序）
upstream_check_command: ""

# conanfile.py build() 中未集成上游测试（测试程序仅在探索阶段真实运行过）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（探索阶段实际运行）
upstream_tests:
  - file: tests/fftw_test.c
    source: fftw-2.1.5/tests/fftw_test.c
    description: "FFTW 单精度核心 correctness 测试（-c 16/32/64 实测通过）"
    command: "./fftw_test -c 16"
  - file: tests/rfftw_test.c
    source: fftw-2.1.5/tests/rfftw_test.c
    description: "FFTW 实数 FFT correctness 测试（-c 16 实测通过）"
    command: "./rfftw_test -c 16"
  - file: tests/test_main.c
    source: fftw-2.1.5/tests/test_main.c
    description: "共享测试框架"

# test_package 自研测试（消费者视角验证 DFT 功能）
test_package_tests:
  - file: test.c
    description: "sfftw DFT 功能测试：delta 脉冲正变换应为全 1 谱（4 项断言）"
    command: "./test_fftw"

# 断言总数
assertion_count: 4
