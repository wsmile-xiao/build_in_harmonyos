version: "3.3.10"
status: built
build_date: "2026-04-26"

source:
  url: "http://www.fftw.org/fftw-3.3.10.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

knowledge_gained:
  - "Autotools 因 config.guess/config.sub 无法识别 OHOS 导致失败"
  - "使用 CMake 编译成功，需设置 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "已更新 config.guess/config.sub 为最新版本（包含 ohos 支持）"
