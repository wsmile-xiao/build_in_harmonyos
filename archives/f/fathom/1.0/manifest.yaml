# 版本级 manifest
# 文件位置: archives/f/fathom/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 软件名
software: fathom

# 编译状态
# published | built | failed | archived
# 说明: 真机 shadow CI 全绿（conan create 成功、test_package 21/21 断言
# 真机实跑通过、L0/L1/L4/L5 pass、L2 skip no bin）；待 submit 后升级 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag v1.0 归档，commit 70d0091f567b465dc2045c1db4961fabbe8ddda6）
  url: "https://github.com/basil00/Fathom/archive/refs/tags/v1.0.tar.gz"

  # 源码校验和
  sha256: "51d1f16af1b8b45c6fd5dfb8392a9dfb0282fa02df57d241ffac9896f0006d94"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  # 说明: 上游无库级构建系统（src/apps/Makefile 仅构建 CLI），
  # 配方注入最小 CMakeLists 编译 src/tbprobe.c（单翻译单元内含 tbcore.c）
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
  - "C 标准: C99 (GNU extensions)，与上游 -std=gnu99 一致"
  - "宏定义: TB_NO_THREADS TB_NO_HW_POP_COUNT，与上游 src/apps/Makefile 一致"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本包无 .patch 文件，源码可移植性修改在
# conanfile.py source() 内以 replace_in_file 完成，见 notes.md）
patches_applied: []

# 源码修改清单
source_modifications:
  - "src/tbprobe.c: #include <x86intrin.h> 增加 x86 目标守卫（aarch64 上该头文件自报错误）"
  - "src/tbprobe.c: lsb() 的 bsfq 内联汇编增加 x86 守卫，非 x86 目标改用 __builtin_ctzll"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 Makefile 只覆盖 CLI（src/apps）；库本体 tbprobe.c #include tbcore.c 是单翻译单元，注入 CMakeLists 即可静态构建"
  - "tbprobe.c 两处 x86 专属代码：无条件 x86intrin.h 包含与 lsb() 的 bsfq 内联汇编；TB_NO_HW_POP_COUNT 宏只解决 popcount，解决不了 bsfq"
  - "helper API（tb_lsb/tb_pop_count 等）恰好走被补丁的 lsb()/popcount() 路径，test_package 无需 Syzygy 表文件即可实质验证核心修复"
