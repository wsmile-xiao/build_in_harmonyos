# test_package/MANIFEST.yml — fathom 1.0
package: fathom/1.0
homepage: "https://github.com/basil00/Fathom"

# R51 上游测试盘点：v1.0 tag 归档（51d1f16a…）仅含 LICENSE、README.md、
# src/（tbprobe.c/h、tbcore.c/h、tbconfig.h、apps/fathom.c + apps/Makefile）。
# 无 test/ tests/ 目录，Makefile 只有 main 目标，无 ctest / make check，
# 上游测试为 0/0 (N/A)。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带测试（消费者视角验证安装后的包）
# 实际入口: test_fathom.c → 编译链接 libfathom.a 生成 test_fathom 可执行文件
# conan create 中 test() 实际执行 ./test_fathom，退出码 0
test_package_tests:
  - file: test_fathom.c
    description: "消费者测试：tb_init 契约（空路径/NULL 与 TB_LARGEST）、tb_probe_wdl/tb_probe_root 参数守卫、无表文件探测语义（KvK 上游特判直接判和且 root 给出走法，KQvK 缺失签名优雅失败 TB_RESULT_FAILED）、helper API 位运算（tb_pop_count/tb_lsb/tb_pop_lsb，覆盖非 x86 popcount/lsb 补丁路径）、攻击表一致性（tb_king_attacks）"
    command: "./test_fathom"

# 计数口径：上游 0 个测试；test_package 5 组共 21 个 CHECK 断言
test_counting:
  upstream_independent_total: 0
  integration_independent_total: 0
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 5
assertion_count: 21
