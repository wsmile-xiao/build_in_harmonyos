software: fastgron
# 版本级 manifest
# 文件位置: archives/f/fastgron/0.7.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.7.7"
status: published
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/adamritter/fastgron/archive/refs/tags/v0.7.7.tar.gz"
  sha256: "3011a3b99cd07d42648b2e964f459024b13ecc904d30501f0493fb0dc9fc33b2"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake项目，conan-init误生成Autotools模板，需手动改写为CMakeToolchain+CMake"
  - "fastgron可选依赖CURL，但鸿蒙环境缺少curl/curl.h头文件，需用CMAKE_DISABLE_FIND_PACKAGE_CURL=ON禁用"
  - "终端工具(纯可执行文件)的test_package不能用CMakeDeps链接库，应改用VirtualRunEnv+直接运行二进制"
  - "VirtualRunEnv可能不正确设置PATH，test_package中使用dependencies[].package_folder显式获取二进制路径更可靠"
  - "conandata.yml的sha256初始为占位符，必须用sha256sum计算真实值替换"
