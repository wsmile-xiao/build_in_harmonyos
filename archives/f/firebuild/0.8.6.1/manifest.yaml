software: firebuild
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.6.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.6.1"

# 构建系统类型
build_system: cmake

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/firebuild/firebuild/archive/refs/tags/v0.8.6.1.tar.gz"

  # 源码校验和
  sha256: "aec8dc318751063a974d7a188865479e67a8745f701a05589395b039cb791ff3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（与 conanfile.py build() 中 defs 静态项逐项一致）
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=<SDK>/ohos/native/build/cmake/ohos.toolchain.cmake"
    - "-DCMAKE_AR=<SDK>/ohos/native/llvm/bin/llvm-ar"
    - "-DCMAKE_RANLIB=<build>/llvm-ranlib-shim"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_INSTALL_PREFIX=<conan-package-folder>"
    - "-DENABLE_XXH_INLINE_ALL=ON"
    - "-DWITH_JEMALLOC=OFF"
    - "-DBUILD_MANPAGES=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libconfig/1.7.3"
    - "libelf/0.8.13"
    - "xxhash/0.8.3"
    - "zstd/1.5.7.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-generate_interceptors-ohos-platform.patch"
  - "0002-allow-conan-provided-dependency-paths.patch"
  - "0003-add-build-manpages-option.patch"
  - "0004-fix-bits-types-file-include-for-musl.patch"
  - "0005-fix-glibc-specific-includes-for-musl.patch"
  - "0006-fix-glibc-internal-types-in-generate-interceptors.patch"
  - "0007-fix-environ-glibc-internal-symbol-for-musl.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "firebuild 使用 CMake + C++20 构建，核心机制是 LD_PRELOAD 拦截 fork/exec"
  - "generate_interceptors 脚本检查 sys.platform，OHOS 上 Python 报 ohos 需 patch"
  - "tsl-hopscotch-map 是 header-only 库，从 GitHub 下载 vendored 到源码树"
  - "firebuild 许可证为专有许可（非 GPL），可修改和再分发但商用需授权"
  - "上游使用 pkg_check_modules 和 find_package 查找依赖，需 patch 以接受 Conan 提供的路径"
  - "man 页面生成需要 DocBook XSL（网络不可达），添加 BUILD_MANPAGES=OFF 跳过"
  - "intercept.h 包含 glibc 内部头文件 bits/types/FILE.h，musl 不提供，用 __GLIBC__ 守卫"
  - "interceptors.h 包含 error.h 和 bits/timex.h（glibc 内部），musl 不提供"
  - "generate_interceptors 生成的 gen_decl.h 使用 glibc 内部类型 __off_t、Lmid_t，musl 不提供"
  - "xxhash Conan 包只有 .so 共享库，没有 .a 静态库"

patch_generation:
  method: manual
  source_orig_dir: ""
  source_work_dir: ""
  source_orig_hash: ""
  source_work_hash: ""
  generated_at: '2026-08-18'
  patches_count: 7

patch_classification:
