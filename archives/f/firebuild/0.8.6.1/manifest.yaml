    guard: pending
  - file: 0004-fix-bits-types-file-include-for-musl.patch
    type: portability
    platform_only: True
    guard: pending
  - file: 0005-fix-glibc-specific-includes-for-musl.patch
    type: portability
    platform_only: True
    guard: pending
  - file: 0006-fix-glibc-internal-types-in-generate-interceptors.patch
    type: portability
