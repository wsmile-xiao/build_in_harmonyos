sources:
  url:
  - https://github.com/firebuild/firebuild/archive/refs/tags/v0.8.6.1.tar.gz
  sha256: aec8dc318751063a974d7a188865479e67a8745f701a05589395b039cb791ff3
patches:
- patch_file: patches/0001-fix-generate_interceptors-ohos-platform.patch
  patch_description: Fix generate_interceptors to recognize OHOS platform (sys.platform
    == ohos) as linux-like
  patch_type: portability
- patch_file: patches/0002-allow-conan-provided-dependency-paths.patch
  patch_description: Allow Conan-provided dependency paths in CMakeLists.txt
  patch_type: portability
- patch_file: patches/0003-add-build-manpages-option.patch
  patch_description: Add BUILD_MANPAGES option to skip man page generation (requires
    DocBook XSL)
  patch_type: portability
- patch_file: patches/0004-fix-bits-types-file-include-for-musl.patch
  patch_description: Fix bits/types/FILE.h include for musl libc (glibc-internal header)
  patch_type: portability
- patch_file: patches/0005-fix-glibc-specific-includes-for-musl.patch
  patch_description: Fix error.h and bits/timex.h glibc-specific includes for musl
    libc
  patch_type: portability
- patch_file: patches/0006-fix-glibc-internal-types-in-generate-interceptors.patch
  patch_description: Fix glibc-internal types (__off_t, Lmid_t, __GLIBC_PREREQ) in
    generate_interceptors for musl
  patch_type: portability
- patch_file: patches/0007-fix-environ-glibc-internal-symbol-for-musl.patch
  patch_description: Fix __environ glibc-internal symbol in intercept.c for musl libc
    (use POSIX environ)
  patch_type: portability
- patch_file: patches/0008-abstract-namespace-socket-fallback.patch
  patch_description: Fallback to abstract namespace AF_UNIX socket when filesystem
    bind returns EPERM (OHOS sandbox)
  patch_type: portability
