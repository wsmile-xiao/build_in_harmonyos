version: "2.6.6"

software: "fceux"

status: built

build_date: "2026-09-09"
build_system: "cmake"

source:
  url: "https://github.com/TASEmulators/fceux/archive/refs/tags/v2.6.6.tar.gz"
  sha256: "0320241d45c6d609f7aeb6f85fdd9019552047206b0864a7f9fddff15b004daa"
  tar_format: tar.gz

build:
  system: cmake
  toolchain: "SDK ohos.toolchain.cmake 自发现 + 裸 cmake（绕开 conan CMakeToolchain，ML-0035）"
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=<ohos.toolchain.cmake self-discovered>"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DQT_DEFAULT_MAJOR_VERSION=5"
    - "-DQT_VERSION_MAJOR=5"
    - "-DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
  dependencies:
    - qt5-qtbase/5.15.2.2
    - sdl2/2.30.10
    - minizip 1.3.1 vendored (zlib-1.3.1 contrib/minizip static, no external requires)
    - zlib/1.3.1.1 (override, unique OHOS rebuild; unifies qt5 transitive 1.3.1)
    - bzip2/1.0.8#3b49a968338a1932917a5049fce54a4e (override pin, transitive)
    - expat/2.8.2.1#332af6a48367eceadb1f9cf0c32f340d (override pin, transitive via dbus)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "fceux 上游无测试套件：顶层与 src/CMakeLists.txt 均无 enable_testing/add_test，唯一含 test 字样的 NewPPUtests.txt 为文档"
  - "Qt5 图形应用在无头环境用 QT_QPA_PLATFORM=offscreen 运行 --version/--help（fceuWrapper 打印后 exit(0)，不进事件循环）"
  - "上游 REQUIRED 依赖仅 Qt5/SDL2/zlib/minizip；libarchive/x264/x265/libav/X11/xkbcommon 缺失时自动降级"
  - "minizip 不可 RREV pin（本地复算 0e5742df 在远端不存在）：改从 zlib-1.3.1 contrib/minizip 内置静态编译并自产 minizip.pc"
