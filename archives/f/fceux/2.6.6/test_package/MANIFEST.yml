# test_package/MANIFEST.yml — fceux 2.6.6
# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: fceux/2.6.6
homepage: "https://github.com/TASEmulators/fceux"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "CMakeLists.txt（顶层，仅 add_subdirectory(src)）"
    finding: "全文件无 enable_testing() / add_test() / add_custom_target(check) 调用，无测试入口"
  - path: "src/CMakeLists.txt（约 400 行构建定义）"
    finding: "仅定义 Qt5/SDL2/ZLIB/minizip 依赖探测与 fceux 可执行目标；无 enable_testing() / add_test()，无 ctest/make check 入口"
  - path: "源码包全量文件清单（tar -tzf | findstr test）"
    finding: "22.2MB 归档中唯一含 test 字样的文件为 NewPPUtests.txt（PPU 说明文档），无 tests/ 目录、无 gtest/pytest 注册"
  - path: "pipelines/linux_build.sh（上游官方 Linux 构建脚本）"
    finding: "流程仅为 apt 安装依赖 → cmake/make → make install → ldd → 打包 → dpkg -i，无任何测试命令；pipelines 其余脚本与 azure-pipelines.yml 同样无测试步骤"

test_package_tests:
  - file: test_fceux.sh
    description: "消费者冒烟测试：无头执行包内 bin/fceux 完成 2 项验证——--version 输出含 2.6.6、--help 退出码 0（QT_QPA_PLATFORM=offscreen，上游 fceuWrapper 打印后 exit(0)，R34 合规）"
    command: "<shell> test_fceux.sh（参数为包内 bin/fceux 绝对路径）"

assertion_count: 2
