software: fceux
display: "fceux"
description: "任天堂 NES/Famicom 全功能模拟器（Qt/SDL 跨平台版）"
category: utility
homepage: "https://github.com/TASEmulators/fceux"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建的 Qt5 图形应用包，仅发布 fceux 二进制（application 包，R38）"
    - "Qt5 依赖 registry 已发布的 qt5-qtbase，SDL2/音频视频后端依赖 sdl2，压缩包读取依赖 minizip + zlib"
    - "Lua 使用上游内嵌版本静态编译，不引入外部 lua 依赖；libarchive/x264/x265/ffmpeg 均为可选，未找到时上游自动降级关闭对应功能"
    - "无头 test_package 使用 QT_QPA_PLATFORM=offscreen 执行 --version/--help（上游 fceuWrapper 在打印后 exit(0)，不进入事件循环）"
  common_dependencies:
    - qt5-qtbase
    - sdl2
    - minizip
    - zlib

versions:
  "2.6.6":
    status: built
    build_date: "2026-09-09"
