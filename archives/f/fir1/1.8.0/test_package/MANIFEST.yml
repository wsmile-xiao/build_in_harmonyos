# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fir1/1.8.0
homepage: "https://github.com/berndporr/fir1"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/CMakeLists.txt 注册的 6 个 ctest 用例)
upstream_tests:
  - file: test/impstep.cpp
    source: fir1-1.8.0/test/impstep.cpp
    description: "Impulse and step response of FIR filter"
    command: "./impstep"
  - file: test/lms.cpp
    source: fir1-1.8.0/test/lms.cpp
    description: "LMS adaptive canceller convergence (sine vs cosine)"
    command: "./lms"
  - file: test/coeffread.cpp
    source: fir1-1.8.0/test/coeffread.cpp
    description: "Coefficient file constructor + output match"
    command: "./coeffread"
  - file: test/getcoeff.cpp
    source: fir1-1.8.0/test/getcoeff.cpp
    description: "getCoeff round-trip, zero-padding, insufficient space exception"
    command: "./getcoeff"
  - file: test/getcoeffvector.cpp
    source: fir1-1.8.0/test/getcoeffvector.cpp
    description: "getCoeffVector round-trip"
    command: "./getcoeffvector"
  - file: test/initavg.cpp
    source: fir1-1.8.0/test/initavg.cpp
    description: "InitAvg moving average filter"
    command: "./initavg"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "Consumer test: array ctor, impulse, LMS, getCoeff"
    command: "./test_fir1"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
