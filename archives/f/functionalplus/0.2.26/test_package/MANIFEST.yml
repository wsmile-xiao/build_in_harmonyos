# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: functionalplus/0.2.26
homepage: "https://github.com/Dobiasd/FunctionalPlus"

# 上游测试命令（上游 CI .github/workflows/unit-test.yml：
#   cmake -S test -B build && cmake --build build && ctest --test-dir build）
upstream_check_command: "ctest -N（注册数） + ctest --output-on-failure（实跑）"

# conanfile.py build() 方法中是否已集成上游测试
# functionalplus 为 header-only 库，上游 doctest 套件独立于配方构建
# （与同上游已发布包 archives/f/fplus/0.2.28 的 upstream_test_in_build=false 先例一致）；
# 设备侧已全量编译运行 39 个测试程序并记录于 reports/test-report.md
upstream_test_in_build: false
upstream_test_command: "cmake -S test -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4 && ctest --test-dir build -j4 --output-on-failure（沙箱 HOME 下执行，见 reports/test-report.md）"

# ============================================================
# N 口径（四口径并列、不混用；申报 N = 候选数法最大值）
# ============================================================
# 1) 源码宏数  @被审 v0.2.26 = 423（grep -cE '^\s*TEST_CASE' test/*.cpp 求和）
#    源码宏数  @上游当前 HEAD = 424 → rule4「声明 N 下界 = 上游 HEAD 注册数」取 424
# 2) 框架注册数 @被审 v0.2.26 = 423（ctest -N → Total Tests: 423）
# 3) 断言数（doctest 运行期输出）= 1662（次口径，不作 N）
# 4) 消费者断言数（test_package）= 10（不进上游分母，计入 PR「鸿蒙特有测试」行）
# 差额 1 例（424 - 423）逐项归因：
#   test/result_test.cpp "result_test - compose_first_error_and_result" 为上游 HEAD
#   新增用例；其依赖的 fplus::compose_first_error_and_result 在被审 v0.2.26 的
#   include/fplus/result.hpp 中不存在（grep -rn compose_first_error_and_result
#   include test → 0 命中），无法对被审源码编译运行 → NOT_RUN。
# ============================================================

upstream_declared_n: 424
upstream_n_prime: 423

