# 版本级 manifest — functionalplus 0.2.26
# 文件位置: archives/f/functionalplus/0.2.26/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
#
# 同源披露：本包与仓内既有 archives/f/fplus/0.2.28 指向上游同一项目
# github.com/Dobiasd/FunctionalPlus（fplus = 本仓既有包名，functionalplus =
# 本任务平台任务卡/CCI 包名）。本包按平台任务名功能定位独立建包，别名同源关系
# 已在本文件、notes.md 与 PR 正文三处披露（mdocml/mandoc 先例口径）。

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.26"

# 软件名
software: "functionalplus"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag）
  url: "https://github.com/Dobiasd/FunctionalPlus/archive/refs/tags/v0.2.26.tar.gz"

  # 源码校验和（与 conan-center-index recipes/functionalplus conandata 逐字一致，
  # 2026-09-28 设备实测下载复核通过）
  sha256: "119894b4ab521d22e7dbd4692c364dc911cf206fca011071575658d4053e61f2"

  # 压缩格式: tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # 上游 tag 与指向 commit（git ls-remote 2026-09-28 实测，轻量 tag）
  tag: "v0.2.26"
  tag_commit: "0584adbcbc72ece33925115154da5ca7742417ba"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（上游根 CMakeLists 为 INTERFACE 目标，header-only）
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # functionalplus 为 header-only，零第三方编译/运行依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试统计（四口径并列，不混用；N 取候选数法最大值）
# ============================================================

test_summary:
  # 口径一：源码宏数（grep TEST_CASE）
  upstream_source_macros_tag: 423      # 被审 v0.2.26：grep -cE '^\s*TEST_CASE' test/*.cpp
  upstream_source_macros_head: 424     # 上游当前 HEAD 同口径（rule4 下界）
  # 口径二：框架注册数（doctest 注册，ctest -N）
  upstream_framework_registered: 423   # 被审 v0.2.26：ctest -N → Total Tests: 423
  # 口径三：断言数（doctest 运行期输出，次口径、不作 N）
  upstream_assertions_total: 1662
  # 口径四：消费者断言数（test_package，不进上游分母）
  consumer_assertions: 10

  # 申报 N（候选数法最大值 = 424 = 上游 HEAD 源码宏数下界）
  upstream_declared_n: 424
  upstream_n_prime: 423                # 被审版本实际运行数
  upstream_pass: 423
  upstream_fail: 0
  upstream_skip: 0
  upstream_not_run: 1                  # 差额归因：上游 HEAD 新增用例，不在被审版本源码
  # 差额 1 例：test/result_test.cpp 的 "result_test - compose_first_error_and_result"
  # （上游 HEAD 才有；其依赖的 fplus::compose_first_error_and_result 在 v0.2.26 的
  #  include/fplus/result.hpp 中不存在，grep 0 命中，无法对被审源码编译运行）
  upstream_test_programs: 39
  upstream_test_files: 39
  test_package_programs: 1

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only 库配方形态：package_type=\"header-library\" + implements auto_header_only_mode（单一 package_id）+ no_copy_source，package() 只交付 include 树与 LICENSE，build() 无编译面" # knowledge_ref: E322
  - "CMakeDeps 的 find_package 名与 target 名由 cpp_info.set_property 的 cmake_file_name/cmake_target_name 决定，test_package 的 find_package 必须与之一致（FunctionalPlus / FunctionalPlus::fplus）" # knowledge_ref: E321
  - "上游测试计数：源码宏数与框架注册数、断言数、消费者断言数四口径不得混用；申报 N 取候选数法最大值并把上游 HEAD 注册数当下界，差额逐项归因" # knowledge_ref: knowledge/drafts/DRAFT-jsoncons-1.9.0-test-count-and-baseline-noise.kv
