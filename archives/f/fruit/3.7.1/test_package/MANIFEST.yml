# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: fruit/3.7.1
homepage: "https://github.com/google/fruit"

# 上游测试：Python pytest 套件（31 个 test_*.py，336 个 test 方法），每个用例
# 用 clang++ 编译 C++ 片段并链接 libfruit 后运行。recipe 的 conan create 按
# 上游 CMake 约定跳过 tests 目标（FRUIT_IS_BEING_BUILT_BY_CONAN=YES），上游
# 套件在适配门禁中单独构建并运行（见 notes.md 与回报证据）。
upstream_check_command: "python3 -m pytest -n auto -r a <BUILD_DIR>/tests <SOURCE_DIR>/tests"

# conanfile.py build() 中已按上游 CMake 配置裁剪（仅库本体，不建上游测试目标）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源（由适配门禁单独枚举运行）
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_fruit.cpp
    description: "消费者探针：fruit::createComponent 绑定 Greeter 接口，Injector 注入并调用 greet() 校验输出，验证已安装头文件/公开 API/链接目标/运行时产物"
    command: "clang++ -std=c++11 test_fruit.cpp -o test_fruit_probe -I<installed-include> -L<installed-lib> -lfruit && ./test_fruit_probe"

# 断言总数（test_package 2 个断言：greet 输出 + 二次注入一致性）
assertion_count: 2
