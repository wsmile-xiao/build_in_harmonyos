software: flashrom
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"
# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL
  url: "https://codeload.github.com/flashrom/flashrom/tar.gz/refs/tags/v1.6.0"
  # 源码校验和（需要在编译完成后更新）
  sha256: ""
  # 压缩格式
  tar_format: tar.gz
# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型
  system: meson
  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-Dprogrammer=dummy"
    - "-Drpmc=disabled"
    - "-Dtests=disabled"
    - "-Dclassic_cli=enabled"
    - "-Ddocumentation=disabled"
  # 编译依赖列表（格式: name/version）
  dependencies:
    - libusb-1.0/1.0.27
  # 编译器
  cc: clang
  cxx: clang++
# ============================================================
# 补丁信息
# ============================================================
# 应用的补丁列表
patches_applied: []
# ============================================================
# 知识沉淀
# ============================================================
# 编译中学到的知识
knowledge_gained:
  - "flashrom 使用 meson 构建系统"
  - "最小化配置时只启用 programmer=dummy 可以成功编译"
  - "平台检测： meson 识别系统为 harmonyos/aarch64"
  - "linux_mtd/linux_spi programmer 需要 linux 系统， 在 harmonyos 平台上不可用"