software: flow-control
display: "Flow Control"
description: "Flow Control — 使用 Zig 编写的程序员文本编辑器，支持 tree-sitter 语法高亮与 LSP"
category: utility
homepage: "https://github.com/neurocyte/flow"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "依赖 zig/0.15.2 工具链（minimum_zig_version=0.15.2，与 0.16.x 不兼容），通过 tool_requires 拉取"
    - "Zig 在 OHOS 上探测宿主 libc 时会引用系统 OHOS SDK clang 的 sysroot 头文件，stdint.h 依赖 musl bits/alltypes.h 导致编译失败；build() 中清理 CC/CXX/CFLAGS/CPPFLAGS/LDFLAGS/CPATH 等环境变量，让 Zig 使用自带 musl 头完成 21/21 步骤编译"
    - "Zig 生成的宿主可执行文件（build runner、ts_bin_query_gen、uucode_build_tables）与最终 zig-out/bin/flow 需在 OHOS 上签名方可执行；zig/0.15.2 wrapper 自动签名中间产物，最终产物在 package() 中通过 binary-sign-tool 自签名"
    - "构建命令 zig build -Doptimize=ReleaseSafe，产物为静态 ELF bin/flow"
    - "zig cache 隔离：ZIG_GLOBAL_CACHE_DIR / ZIG_LOCAL_CACHE_DIR 指向 build_folder 内，ZIG_OHOS_SIGN_ROOTS 覆盖 global/local/zig-out 三处"
  common_dependencies:
    - zig/0.15.2

versions:
  "0.7.2":
    status: published
    build_date: "2026-08-20"
    conan_ref: "flow-control/0.7.2"
