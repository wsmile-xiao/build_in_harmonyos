# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: flow-control/0.7.2
homepage: "https://github.com/neurocyte/flow"

# 上游测试命令（zig build 体系，无 make check；zig build test 运行单元测试）
upstream_check_command: "zig build test"
upstream_test_in_build: false
upstream_test_command: "zig build test"

# zig build 实际运行的测试（src/test 目录，见 build.zig test_step）
upstream_tests:
  - file: test/tests.zig
    source: flow-0.7.2/test/tests.zig
    description: "主单元测试（buffer、color、tui 等）"
    command: "zig build test"
  - file: src/keybind/tests
    source: flow-0.7.2/src/keybind (keybind_test_run_cmd)
    description: "keybind 模块测试"
    command: "zig build test"

# test_package 中自带的测试（消费者视角验证可执行文件，R34 真实执行 bin/flow）
test_package_tests:
  - file: test.sh
    description: "flow --version / --help / --list-languages 真实执行验证"
    command: "bash test.sh"

# 测试断言总数（近似值，上游含 buffer/color/project_manager/helix 等多套测试）
assertion_count: 200
