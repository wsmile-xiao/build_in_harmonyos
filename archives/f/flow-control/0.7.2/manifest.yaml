version: "0.7.2"
status: published
build_date: "2026-08-20"
conan_ref: "flow-control/0.7.2"
build_system: "custom"

source:
  url: "https://github.com/neurocyte/flow/archive/refs/tags/v0.7.2.tar.gz"
  sha256: "f56313fd00a36ab04ee9a9ddb200aebf195df3882947a698c1d1760d4bbd1d4a"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "zig build -Doptimize=ReleaseSafe --summary all"
  dependencies:
    - "zig/0.15.2"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Zig 0.15.2 minimum_zig_version，0.16.x 不兼容，必须 tool_requires zig/0.15.2"
  - "OHOS 上 Zig 宿主 libc 探测会注入 OHOS SDK sysroot，stdint.h 依赖 musl bits/alltypes.h 失败；清理 CC/CXX/CFLAGS/CPPFLAGS 等让 Zig 使用自带 musl 头可通过 21/21 步骤"
  - "Zig 生成的宿主可执行文件与最终 flow 需签名；前者由 zig wrapper 自动签名，后者在 package() 中通过 binary-sign-tool 自签名"
  - "产物为静态 ELF bin/flow，package_type=application，zig cache 隔离至 build_folder"
