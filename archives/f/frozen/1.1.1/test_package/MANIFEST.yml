# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: frozen/1.1.1
homepage: "https://github.com/serge-sans-paille/frozen"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: tests/（Catch2 单元测试——frozen.tests 目标内含 56 个 TEST_CASE（12 个 test_*.cpp + test_main.cpp 提供 main）+ no_exceptions 编译测试，自带 catch.hpp）
    count: "56"
    description: "上游测试实测（rule 4，分母=全部 56 用例）：结果见 notes.md；frozen.tests 56 个 TEST_CASE + no_exceptions（WILL_FAIL 预期失败编译测试）；tests/ 自带 catch.hpp 无需网络"

test_package_tests:
  - file: test_frozen.py
    description: "R34：头文件存在 + 编译运行使用 frozen 的 smoke（frozen::map constexpr 构造）"
    command: "python3 test_frozen.py <package>"

assertion_count: 2
