# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: frozen/1.2.0
homepage: "https://github.com/serge-sans-paille/frozen"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: tests/（Catch2 单元测试——frozen.tests 目标内含 56 个 TEST_CASE（13 个 test_*.cpp）+ no_exceptions 编译测试，自带 catch.hpp）
    count: "56"
    description: "上游测试实测（rule 4，分母=全部 56 用例）：56 passed / 0 failed / 0 skipped（100%）——frozen.tests 56 个 TEST_CASE 全过 + no_exceptions 通过；tests/ 自带 catch.hpp 无需网络"

test_package_tests:
  - file: test_frozen.py
    description: "R34：头文件存在 + 编译运行使用 frozen 的 smoke（frozen::map constexpr 构造）"
    command: "python3 test_frozen.py <package>"

assertion_count: 2
