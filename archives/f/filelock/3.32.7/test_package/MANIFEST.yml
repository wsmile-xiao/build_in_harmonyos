# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: filelock/3.32.7
homepage: "https://github.com/tox-dev/py-filelock"

upstream_check_command: "python3 -m pytest tests/"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/"

upstream_tests:
  - name: tests/（pytest 套件）
    count: "collected 1510 / passed 1334 / failed 110 / skipped 66"
    description: "依赖补齐后 OHOS 全量重跑（pytest 9.1.1 + pytest-asyncio 1.4.0 +
      pytest-mock 3.16.0 + pytest-timeout 2.4.0 + virtualenv 21.13.0，隔离 venv）。
      110 例残余均为平台差异而非缺依赖，逐族归因：89 例 os.link EPERM（FUSE 拒绝
      linkat，StrictSoftFileLock 硬链接 claim 协议不可用）；16 例 FUSE mode/权限位
      语义（umask/只读断言：显式 umask 0o022 仍产出 0640、只读文件仍可写）；4 例
      os.mkfifo EPERM；1 例 fork 子进程行为差异（子进程 rc=2 且 stderr 为空）。
      证据：upstream-filelock-rerun.log"

test_package_tests:
  - file: test_filelock.py
    description: "消费者测试（R34）：acquire/release 往返、同实例重入、第二把锁
      超时（Timeout）、释放后可再获取——OHOS 设备本地文件系统 tempfile。"
    command: "python3 test_filelock.py <site-packages>"

assertion_count: 8
