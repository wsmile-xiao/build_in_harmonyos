version: "1.0.13"
status: built
build_date: "2026-04-25"

source:
  url: "https://github.com/fribidi/fribidi/releases/download/v1.0.13/fribidi-1.0.13.tar.xz"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "meson setup build --prefix=$HOME/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "meson 构建需要手动安装 meson (pip install --user)"
  - "需要显式设置编译器路径 (CC, CXX, AR 等环境变量)"
  - "meson 在此平台无法创建符号链接，需手动创建"
