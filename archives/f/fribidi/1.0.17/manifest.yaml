name: fribidi
version: "1.0.17"
software: fribidi
status: built
build_date: "2026-10-08"
build_system: autotools

source:
  url: "https://github.com/fribidi/fribidi/releases/download/v1.0.17/fribidi-1.0.17.tar.xz"
  sha256: "6949dcde27d41cebad1fd741fcafc36d55a1020d2d872d4a6eb3914caabbada2"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "./configure --prefix=$DEFAULT_PREFIX"
  dependencies: []

patches_applied:
  - "0001-config.guess.patch: HarmonyOS detection for config.guess (E007, aarch64-unknown-linux-ohos)"
  - "0002-no-help2man-keep-prebuilt-man.patch: 移除 bin/Makefile.in 的 %.1: % help2man man 页重生成规则，保留 tarball 预生成 fribidi.1（1.0.17 新增 dist_man_MANS；OHOS worker 无 help2man，make 死于 Error 127）"

knowledge_gained:
  - "E007: config.guess/config.sub autotools OHOS detection"
  - "E110: HMDFS restricts temp file creation with umask 077, fix with umask 002 in build()"
  - "E165: OHOS shebang fix (/bin/sh -> /system/bin/sh) in build()"
  - "1.0.17 起上游捆绑的 config.sub (2025-07-10) 已原生支持 ohos* OS 与 linux-ohos* kernel-OS 组合，无需再打 config.sub 补丁（1.0.16 时代的 0003 已不适用）"
  - "1.0.17 新增 dist_man_MANS + %.1: % help2man 重生成规则，无 help2man 环境死于 Error 127；tarball 自带预生成 bin/fribidi.1，删除规则即可"

patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: True
    guard: 'pending'
  - file: 0002-no-help2man-keep-prebuilt-man.patch
    type: portability
    platform_only: False
    guard: 'pending'
