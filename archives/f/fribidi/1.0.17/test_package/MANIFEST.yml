# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fribidi/1.0.17
homepage: https://github.com/fribidi/fribidi

# 上游测试命令（automake TESTS 目标，在 conanfile.py build() 内以 make check 集成执行）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check (autotools automake TESTS, on-device aarch64 OHOS)"

# 上游实际运行的测试（automake TESTS 注册 4 个目标）
upstream_tests:
  - file: BidiTest.txt
    source: fribidi-1.0.17/test/unicode-conformance/BidiTest.txt
    description: "Unicode UAX #9 双向算法一致性测试（BidiTest-18.0.0.txt，490852 条断言级数据行，经 BidiTest 驱动程序逐条校验 levels/reorder 组合）"
    command: "make check (BidiTest.txt)"
  - file: BidiCharacterTest.txt
    source: fribidi-1.0.17/test/unicode-conformance/BidiCharacterTest.txt
    description: "Unicode UAX #9 字符级双向一致性测试（BidiCharacterTest-18.0.0.txt，91710 条断言级数据行，经 BidiCharacterTest 驱动程序逐条校验段落方向/嵌入层级/重排序）"
    command: "make check (BidiCharacterTest.txt)"
  - file: run.tests
    source: fribidi-1.0.17/test/run.tests
    description: "字符集回归测试：6 个 input/reference 文件对（test_CapRTL_explicit/implicit/isolate、test_ISO8859-8_hebrew、test_UTF-8_persian、test_UTF-8_reordernsm），经 bin/fribidi --test 渲染比对参考输出"
    command: "make check (run.tests)"
  - file: test-reorder-nsm
    source: fribidi-1.0.17/test/test-reorder-nsm.c
    description: "NSM（不可见标记）重排序单元测试：验证阿拉伯文修饰符（U+064B..U+0652）在 log2vis 输出中前移到基字符之前的算法行为"
    command: "make check (test-reorder-nsm)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_fribidi.c
    description: "消费者测试: 验证 fribidi_version_info 可访问且含 1.0.17 版本串、UTF-8→Unicode 转换（5 字符精确计数）、log2vis 双向算法（RTL 阿拉伯文）、镜像字符查表 U+0028→U+0029（1.0.17 N0/mirroring 修复路径）"
    command: "./test_fribidi"

# 测试断言总数 (实测, rule 4)
# 上游 automake TESTS 注册 4 个测试目标全 PASS（make check # TOTAL: 2 + # TOTAL: 2，
# test/ 与 test/unicode-conformance/ 各汇总一次）；test_package 消费者测试 4 项断言全 PASS
assertion_count: 8
