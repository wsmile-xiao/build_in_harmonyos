# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fast-cdr/2.3.5
homepage: "https://github.com/eProsima/Fast-CDR"

# 上游测试命令 (ctest -N 分析)
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.configure(variables={\"BUILD_TESTING\": \"ON\"}) 构建 test/cdr、test/xcdr 与 cmake.force_standard；ctest --output-on-failure -j4"

# 上游实际运行的测试程序 (BUILD_TESTING=ON, R02 已运行; 详见 notes.md)
upstream_tests:
  - file: test/cdr/SimpleTest.cpp
    source: fast-cdr-2.3.5/test/cdr/SimpleTest.cpp
    description: "上游 CDR 序列化/反序列化基础测试 (GTest)"
    command: "./SimpleTest"
  - file: test/xcdr/basic_types.cpp
    source: fast-cdr-2.3.5/test/xcdr/basic_types.cpp
    description: "上游 XCDR 基础类型测试 (GTest)"
    command: "./xcdr_basic_types"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：FastBuffer+Cdr 序列化/反序列化往返"
    command: "./test_fast-cdr"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3