# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.5"

# 软件名
software: "fast-cdr"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/eProsima/Fast-CDR/archive/refs/tags/v2.3.5.tar.gz"

  # 源码校验和
  sha256: "e0af6cde06c4a43d90fa905c6d15721435520a26f0ba168ed13dfda45d164001"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DBUILD_TESTING=OFF"
  - "-DBUILD_DOCUMENTATION=OFF"
  - "-DBUILD_CHECK_DOCUMENTATION=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "Fast-CDR 2.3.5 为 CMake 构建（非 autotools），OHOS 平台需在 CMakeToolchain 设置 CMAKE_SYSTEM_NAME=Linux"
- "上游测试/文档依赖 GTest/doxygen/wget，CI 网络受限时应设 BUILD_TESTING=OFF 与 BUILD_DOCUMENTATION=OFF，由 test_package 消费者测试覆盖"
- "fastcdr 的 CdrVersion 枚举（含 DDS_CDR）定义于 CdrEncoding.hpp 而非 Cdr 类内，消费者引用需用 eprosima::fastcdr::CdrVersion::DDS_CDR"
- "CMake 生成的 config.h 通过 configure_file 注入 include/fastcdr/config.h，安装规则已含该头文件"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"