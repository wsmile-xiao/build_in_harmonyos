software: ftgl
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.4.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.debian.org/debian/pool/main/f/ftgl/ftgl_2.4.0.orig.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DOPENGL_INCLUDE_DIR=/storage/Users/currentUser/usr/local/include"
    - "-DOPENGL_gl_LIBRARY=/storage/Users/currentUser/usr/local/lib/libGL.a"
    - "-DOPENGL_glu_LIBRARY=/storage/Users/currentUser/usr/local/lib/libGLU.a"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "freetype/26.6.20"
    - "opengl-stub/1.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-cmake-ftlibrary-h-missing.patch"
  - "0002-fix-ftvectoriser-char-unsigned-char.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "FTGL requires desktop OpenGL (not GLES), stub headers/library needed on OpenHarmony"
  - "FTGL CMakeLists.txt references FTLibrary.h which doesn't exist (only FTGL/FTLibrary.h)"
  - "FTVectoriser.cpp has char* vs unsigned char* type mismatch with freetype outline.tags"
  - "CMake >=4.0 requires CMAKE_POLICY_VERSION_MINIMUM for projects with CMAKE_MINIMUM_REQUIRED < 3.5"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/ftgl-2.4.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/ftgl-2.4.0.work
  source_orig_hash: edd77ab0311a1fac
  source_work_hash: 2e65681e1eafbdc3
  generated_at: '2026-05-30T15:00:00'
  patches_count: 2

patch_classification:
  - file: 0001-src-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-src-FTVectoriser.cpp.patch
    type: auto
    platform_only: True
    guard: 'pending'
