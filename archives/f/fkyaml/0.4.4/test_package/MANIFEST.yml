# test_package/MANIFEST.yml — fkyaml 0.4.4 上游测试声明
# 全量枚举台账见 reports/upstream-test-ledger.md

package: fkyaml/0.4.4
homepage: "https://github.com/fktn-k/fkYAML"

# 上游测试命令（ctest 全量执行，非 make check——CMake 项目）
upstream_check_command: "ctest --test-dir build-local -j2"
upstream_test_in_build: false
upstream_test_command: "cmake --build build-local -j4 && ctest --test-dir build-local -j2"

# 上游实际运行的测试程序（doctest 单元测试，全量 372 项实际运行，369 通过）
upstream_tests:
  - file: tests/unit_test/fkYAMLUnitTest
    source: fkyaml-0.4.4/tests/unit_test/
    description: "doctest 单元测试全量（372 项运行，369 通过；3 项 /tmp 只读环境硬阻塞，2 项 char8_t C++20 门控未编译）"
    command: "./fkYAMLUnitTest"

# test_package 自带的测试（消费者视角验证，真实 API 调用）
test_package_tests:
  - file: test_package.cpp
    description: "消费者真实 API 消费：deserialize/ordered-mapping 迭代/serialize/异常路径"
    command: "./test_package"

# 测试断言总数（近似值：上游 doctest 断言 + 消费者断言）
assertion_count: 220