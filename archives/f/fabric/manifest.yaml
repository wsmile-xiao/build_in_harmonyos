# 软件级 manifest — fabric
# 文件位置: archives/f/fabric/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: fabric
display: "Hyperledger Fabric"
description: "Hyperledger Fabric 核心区块链平台（官方 linux-arm64 二进制：peer/orderer/configtxgen 等）"
category: utility
homepage: "https://hyperledger-fabric.readthedocs.io"
license: Apache-2.0

build_system: binary

ohos_adaptation:
  key_points:
    - "fabric 为 Go 项目，CI 无 Go 工具链，采用官方 linux-arm64 二进制打包（非源码编译）"
    - "settings.os 用 in ('Linux','OHOS')（R32），仅 linux-arm64 (os,arch) 打包"
    - "上游 tarball 含 8 个静态 arm64 ELF：peer/orderer/configtxgen/configtxlator/cryptogen/discover/ledgerutil/osnadmin"
  common_dependencies: []

versions:
  "2.5.15":
    status: built
    build_date: 2026-08-28
