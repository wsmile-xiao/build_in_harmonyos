# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: fabric/2.5.15
homepage: "https://hyperledger-fabric.readthedocs.io"

# 上游 fabric v2.5.15 仓库含 724 个 _test.go 单元测试 (bccsp/、core/、gossip/、
# orderer/、peer/、discovery/ 等) + test/integration 集成套件 (需 Docker + 完整
# Fabric 网络)。本构建为二进制打包 (非源码编译)，CI 无 Go 工具链 (go 二进制
# permission-denied)，集成测试需容器 (CI 不可用)。故上游测试不在本构建中运行，
# 已加入 ci/config/no_official_test.txt 白名单 (L1 = skip, detail = whitelisted)。
upstream_check_command: "go test ./...  # (Makefile: make unit-test)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_reason: "Go toolchain unavailable in OHOS CI (go binary permission-denied); integration tests require Docker + full Fabric network"

# 上游测试程序（存在但不在本构建运行 — 724 个 _test.go 单元测试 + test/integration 套件）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test_fabric.sh 验证打包的 peer 二进制存在并可执行 peer version，断言版本输出非空且含 2.5.15"
    command: "conan create (test_package: bash test_fabric.sh <bin_dir>)"
  - file: test_fabric.sh
    description: "真实冒烟测试: 检查 bin/peer 可执行，运行 peer version，断言输出非空且包含 '2.5.15'"
    command: "bash test_fabric.sh <package bin dir>"

assertion_count: 4
