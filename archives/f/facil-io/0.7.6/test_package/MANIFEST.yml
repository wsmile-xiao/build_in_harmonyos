# test_package/MANIFEST.yml — facil-io 0.7.6
# CI L0e requires this file to exist.

package: facil-io/0.7.6
homepage: "https://github.com/boazsegev/facil.io"

# facil.io 0.7.6 ships no automated test runner: tests/ contains standalone
# programs driven manually by `make test` in the upstream makefile flow, and
# the shipped CMakeLists builds only the library (no CTest registration).
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

# No CTest/automated upstream test programs registered in the build system
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Compiles a consumer program against the installed libfacil and runs it: (1) fiobj serialization API assertion (fiobj_str_new/fiobj_obj2json); (2) HTTP round trip — forks a server via http_listen/fio_start on 127.0.0.1:18472 and asserts a 200 response with the handler body; on OHOS HMDFS hosts where the cluster unix socket is forbidden, the HTTP leg is reported SKIP (environment limitation) and the fiobj assertions still gate the result"
    command: "bash test.sh"

# fiobj API + (HTTP round trip when the environment allows unix cluster sockets)
assertion_count: 2
