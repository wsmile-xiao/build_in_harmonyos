# 软件级 manifest
# 文件位置: archives/f/frotz/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: frotz
display: "Frotz"
description: "Z-machine interpreter for Infocom and other Z-machine games"
category: utility
homepage: "https://661.org/proj/if/frotz/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile-based build (not autoconf), requires manual PREFIX and compiler settings"
    - "Requires ncursesw static library with custom CURSES_CFLAGS and CURSES_LDFLAGS"
    - "Need to add stdbool.h header for true/false definitions"
    - "KEY_MOUSE may be missing in static ncursesw builds"
    - "Requires _DEFAULT_SOURCE and _XOPEN_SOURCE=600 for strdup and other functions"
    - "install command not available on OpenHarmony, use manual cp"
  common_dependencies:
    - ncursesw/static

versions:
  "2.54":
    status: published
    build_date: "2026-06-04"
    published_as: frotz