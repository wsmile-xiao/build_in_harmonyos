software: frotz
version: "2.54"
status: published
build_date: "2026-06-04"
compile_date: "2026-06-04"
build_system: makefile

source:
  url: "file:///storage/Users/currentUser/builds/frotz-2.54.tar.xz"
  sha256: ""
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"
    - "SOUND_TYPE=none"
    - "CC=clang"
    - "CFLAGS=-Wall -std=c99 -O3 -g -D_DEFAULT_SOURCE -D_XOPEN_SOURCE=600"
    - "CURSES_CFLAGS=-I/storage/Users/currentUser/usr/local/include -D_XOPEN_SOURCE_EXTENDED"
    - "CURSES_LDFLAGS=-L/storage/Users/currentUser/usr/local/lib -lncursesw"
  dependencies:
    - ncursesw/static
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-curses-ux_input.c.patch"

knowledge_gained:
  - "frotz 使用 Makefile 而非 autoconf，需要手动设置 PREFIX 和编译参数"
  - "ncursesw 静态库需要手动设置 CURSES_CFLAGS 和 CURSES_LDFLAGS"
  - "需要添加 stdbool.h 头文件来解决 true/false 未定义问题"
  - "KEY_MOUSE 在 ncursesw 静态编译时可能缺失，需要手动定义"
  - "需要设置 _DEFAULT_SOURCE 和 _XOPEN_SOURCE=600 来启用 strdup 等函数"