# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: flawfinder/2.0.19
homepage: "https://github.com/david-a-wheeler/flawfinder"

# Upstream test command（test/ 目录 makefile）
upstream_check_command: "make -C test test"

# 上游测试套件（test/ 目录）实际存在且可运行：
#   - 测试样本 14 个：test.c / test2.c / test-boost-system.hpp /
#     test-cpp-digit-separator.c/.cpp / test-diff-005.patch / test-patched.c /
#     no-ending-newline.c 等
#   - 预期结果 7 个：correct-results.csv / .html / .txt / -004 / -005 / -006 / -008
#   - test/makefile 测试目标：test_001 ~ test_010（diff -u correct-results 比对），
#     test:/check: 汇总目标（根 makefile 亦有 test:/check:）
#   - 本地实测：make -f makefile FLAWFINDER=<conan 构建的 flawfinder> PYTHON=python3
#     test_001 → exit=0（text 输出与 correct-results.txt 比对一致）
#   - 注：test_007 依赖 setup.py（需 setuptools 构建环境），其余目标可用
#     conan 包内 flawfinder 直接运行
upstream_test_in_build: true
upstream_test_passed_locally: true

# test_package consumer-side tests
test_package_tests:
  - file: test_flawfinder.sh
    description: "Run flawfinder --version and scan a sample with strcpy for flaw detection"

# Test assertion count
assertion_count: 1
