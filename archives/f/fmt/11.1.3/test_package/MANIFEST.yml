# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: fmt/11.1.3
homepage: "https://github.com/fmtlib/fmt"

# 上游测试命令 (ctest 是 fmt 官方测试入口)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（完整台账见 reports/upstream-test-ledger.md）
upstream_tests:
  - file: format-test
    source: fmt-11.1.3/test/format-test.cc
    description: "fmt 核心格式化测试（133 TEST_CASE，唯一失败 line_buffering 为 OHOS 平台缓冲行为差异，历史 11.2.0-r1 同因）"
    command: "./format-test"
  - file: compile-test
    source: fmt-11.1.3/test/compile-test.cc
    description: "编译期格式化测试（C++20 下 27 个用例全部通过）"
    command: "./compile-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "compiled fmt::fmt 消费者验证（11 组：基础/数字/format_to/sprintf/join/chrono/std/xchar/color/FMT_VERSION/ostream_formatter）"
    command: "./test_probe"

# 测试断言总数 (近似值, 用于质量评估；详见 reports/upstream-test-ledger.md)
assertion_count: 551