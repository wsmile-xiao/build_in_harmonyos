knowledge_gained:
  - "file_test.line_buffering 为 HarmonyOS 平台文件行缓冲语义差异（Expected n=42 got 0），与 11.2.0-r1 同因，接受为平台限制"
  - "OHOS 上 conan CMakeToolchain 须将 CMAKE_SYSTEM_NAME 设为 OHOS（非默认 HarmonyOS），否则 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 为空致产物无 SONAME（8.1.1/12.2.0 同因）"