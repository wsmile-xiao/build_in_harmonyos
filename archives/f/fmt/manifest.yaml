versions:
  "7.1.3":
    status: built
    build_date: "2026-08-24"
  "8.1.1":
    status: built
    build_date: "2026-08-06"
    notes: >-
      首个鸿蒙 PC conan 配方，未打补丁。

      **版本钉在 8.x**：下游 ad-map-access 的 so 依赖是 `libfmt.so.8`，
      而 fmt 9/10/11 删改过 API，换大版本源码未必编得过。

      **cpp_info.includedirs 只声明 `include`，不展开 `include/fmt`。**
      这一条是必须的：`include/fmt/` 下有 `locale.h`，该目录一旦进入 -isystem
      搜索路径，libc++ 的 `<__locale>` 执行 `#include <locale.h>` 时会命中
      `fmt/locale.h` 而不是 musl 的，于是下游任何 include `<sstream>` 的翻译单元
      都报 `use of undeclared identifier 'uselocale'`（spdlog 实撞）。
      消费方本来就写 `#include <fmt/format.h>`，只需要 include 这一层。

      test_package 断言输出字符串本身，共 8 组：基本替换/位置参数/具名参数/
      对齐填充/精度与进制/符号/format_to/FMT_STRING。进制前缀按 **8.x 的实际行为**
      断言 `010` 而非 `0o10`（后者是 fmt 9+ 才改的）——断言要钉在本版本上，
      不能照抄新版文档。
  "12.2.0":
    status: built
    build_date: "2026-08-25"
    source:
      url: "https://github.com/fmtlib/fmt/archive/refs/tags/12.2.0.tar.gz"
      sha256: "8b852bb5aa6e7d8564f9e81394055395dd1d1936d38dfd3a17792a02bebd7af0"
    notes: >-
      上游 12.2.0 正式 release（2026-06-16），0 patch，复用 8.1.1 已验证的
      OHOS cmake 适配（CMAKE_SYSTEM_NAME=OHOS 守卫 / 二进制签名 /
      includedirs 不展开 include/fmt 避免遮蔽 musl locale.h）。

      **无运行时第三方依赖**（src/ 仅用 C/C++ 标准库）；gtest 随 test/ 源码 vendored，
      非 package 运行时依赖。**无 CLI**（library package，R38 commands.json 不触发）。

      上游测试 OHOS 实测：CTest 注册 21（默认配置，非 PEDANTIC/CUDA/MODULE），
      compile 22/22，runtime pass 19 / fail 2（os-test file_test.line_buffering
      行缓冲差异、c-test test_print tmpfile 不可用，均平台/环境差异非库缺陷）。

      test_package 用 Conan 打包后的 fmt::fmt compiled library，10 个 CHECK：
      基础/数字/字符串格式化、format_to、fmt/std.h（std::optional）、
      **fmt::ostream_formatter（自定义 Point 类型经 operator<< 桥接）**、
      FMT_VERSION==120200。预期值均经 OHOS 实证。

      关键 API 确认：fmt/std.h 存在（12.2.0 起 std::byte formatter 移入此文件）；
      fmt::ostream_formatter 存在且实测编译链接运行通过（mitama-cpp-result 依赖）。
