# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fp16/cci.20210320
homepage: "https://github.com/Maratyszcza/FP16"

# 上游测试命令 (ctest 全量运行, 实测 7/7 通过; 另 4 个 psimd 测试目标上游
# CMakeLists 未注册, 已在适配中手动编译运行并通过)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (7 个 ctest 注册目标, 全部通过)
upstream_tests:
  - file: test/ieee-to-fp32-bits.cc
    source: FP16/0a92994d729ff76a58f692d3028ca1b64b145d91
    description: "IEEE half->float bits conversion (10 TEST_CASE)"
    command: "./ieee-to-fp32-bits-test"
  - file: test/ieee-to-fp32-value.cc
    source: FP16/0a92994d729ff76a58f692d3028ca1b64b145d91
    description: "IEEE half->float value conversion (10 TEST_CASE)"
    command: "./ieee-to-fp32-value-test"
  - file: test/ieee-from-fp32-value.cc
    source: FP16/0a92994d729ff76a58f692d3028ca1b64b145d91
    description: "IEEE float->half conversion (13 TEST_CASE; 1 x86 F16C-only excluded)"
    command: "./ieee-from-fp32-value-test"
  - file: test/alt-to-fp32-bits.cc
    source: FP16/0a92994d729ff76a58f692d3028ca1b64b145d91
    description: "Alt half->float bits conversion (7 TEST_CASE)"
    command: "./alt-to-fp32-bits-test"
  - file: test/alt-to-fp32-value.cc
    source: FP16/0a92994d729ff76a58f692d3028ca1b64b145d91
    description: "Alt half->float value conversion (7 TEST_CASE)"
    command: "./alt-to-fp32-value-test"
  - file: test/alt-from-fp32-value.cc
    source: FP16/0a92994d729ff76a58f692d3028ca1b64b145d91
    description: "Alt float->half conversion (13 TEST_CASE)"
    command: "./alt-from-fp32-value-test"
  - file: test/bitcasts.cc
    source: FP16/0a92994d729ff76a58f692d3028ca1b64b145d91
    description: "bitcast helper roundtrip (4 TEST_CASE)"
    command: "./bitcasts-test"

# test_package 中自带的测试 (消费者视角验证, 真实调用 fp16 转换 API)
test_package_tests:
  - file: test.c
    description: "消费者测试: fp16 IEEE/alt 转换 API 已知值与往返一致性"
    command: "./test_fp16"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 86
