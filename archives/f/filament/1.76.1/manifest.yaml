software: filament

# 版本号
version: "1.76.1"

# 编译状态
status: built

# 编译日期
build_date: "2026-09-13"

# 构建系统
build_system: cmake

# 源码信息
source:
  url: "https://github.com/google/filament/archive/refs/tags/v1.76.1.tar.gz"
  sha256: "f65b5b50ef5647a190b51a37fa006985e061bcfdc87c3b9b0ea18cf7b52042aa"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_CXX_STANDARD=20"
    - "-DFILAMENT_LINUX_IS_MOBILE=ON（清除 IS_HOST_PLATFORM，并令 MATC_TARGET=mobile）"
    - "-DFILAMENT_IMPORT_PREBUILT_EXECUTABLES_DIR=host-tools-prebuild（相对源码目录；该变量是与 ${FILAMENT}/${DIR} 拼接的）"
    - "-DFILAMENT_SKIP_SAMPLES=ON"
    - "-DFILAMENT_SKIP_SDL2=ON"
    - "-DFILAMENT_BUILD_TESTING=OFF"
    - "-DFILAMENT_SUPPORTS_VULKAN=ON（上游默认）"
    - "-DFILAMENT_SUPPORTS_OPENGL=ON（上游默认）"
    - "-DFILAMENT_SUPPORTS_METAL=OFF"
    - "-DFILAMENT_SUPPORTS_WEBGPU=OFF"
    - "-DFILAMENT_ENABLE_FGVIEWER=OFF"
    - "-DFILAMENT_ENABLE_MATDBG=OFF"
    - "-DFILAMENT_SUPPORTS_WEBP_TEXTURES=OFF"
    - "-DFILAMENT_SUPPORTS_XCB=OFF / _XLIB=OFF / _WAYLAND=OFF（OHOS 无 X11/Wayland）"
    - "-DUSE_STATIC_LIBCXX=OFF（默认 ON 在非 glibc 的 clang 上会加 -static）"
    - "-DBUILD_SHARED_LIBS=OFF（Filament 自身不读该变量，置 ON 只会破坏内置 spirv-tools）"
  first_pass_options:
    - "-DFILAMENT_LINUX_IS_MOBILE=OFF（宿主段：IS_HOST_PLATFORM 必须为真才构建 tools/）"
    - "-DFILAMENT_IMPORT_PREBUILT_EXECUTABLES_DIR=（宿主段不导入它自己要构建的工具）"
    - "-DFILAMENT_EXPORT_PREBUILT_EXECUTABLES_DIR=host-tools-prebuild"
  dependencies: []
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied:
  - "CMakeLists.txt:197 之前插入 HarmonyOS/OHOS 的 UNIX 判定（幂等就地写入，不是 unified diff；原因见 knowledge_gained 第 1 条）"

# 知识沉淀
knowledge_gained:
  - "CMake 不为未知系统名设置 UNIX：CMAKE_SYSTEM_NAME=HarmonyOS 时 UNIX 未定义，Filament 的 if (UNIX AND NOT APPLE AND NOT ANDROID AND NOT WASM)（CMakeLists.txt:197）令 LINUX=FALSE，configure 直接死在 libs/bluevk/CMakeLists.txt:19 的 FATAL_ERROR；内置 glslang 也会落入 unknown platform 分支丢掉 OSDependent/Unix（glslang/glslang/CMakeLists.txt:36、glslang/CMakeLists.txt:134）。修法：在任何 add_subdirectory 之前 set(UNIX TRUE)，普通变量会被子目录继承"
  - "两段式必须两段都在目标机上跑：本 farm 的验证设备是 aarch64 HarmonyOS PC（uname -m = aarch64），官方 Filament Linux 发行包里的工具是 x86_64，根本无法执行。第一段在本机以 IS_HOST_PLATFORM=TRUE 构建 matc/cmgen/resgen/filamesh/mipgen/uberz/glslminifier 并 export 出 ImportExecutables-Prebuilt.cmake，第二段导入使用"
  - "FILAMENT_IMPORT/EXPORT_PREBUILT_EXECUTABLES_DIR 必须传相对源码目录的路径：CMakeLists.txt:864 用 ${FILAMENT}/${IMPORT_EXECUTABLES_DIR} 拼接，FILAMENT=${CMAKE_CURRENT_SOURCE_DIR}（:343）；传绝对路径会得到 <src>/<abs path>，报 include could not find requested file"
  - "BUILD_SHARED_LIBS=ON 会破坏 Filament 内置的 spirv-tools：Filament 删掉了 ${SPIRV_TOOLS}-shared 目标却留下引用它的 alias（third_party/spirv-tools/source/CMakeLists.txt:343-359），configure 报 add_library cannot create ALIAS target \"SPIRV-Tools\"。Filament 自身所有库都是显式 STATIC（filament/CMakeLists.txt:711、libs/filabridge/CMakeLists.txt:24），本包因此是 static-library"
  - "LINUX=TRUE 之后还必须关掉三处否则会引入桌面假设：FILAMENT_SUPPORTS_XCB/_XLIB/_WAYLAND 默认 ON（会给 X11 加宏），USE_STATIC_LIBCXX 默认 ON 且在非 glibc 的 clang 上追加 -static（:438-449）"
  - "Filament 的库是 ~39 个静态组件归档（filament/backend/filabridge/filaflat/math/utils/...），安装规则分散在各 libs/*/CMakeLists.txt（utils 用 install(FILES ${DIST_HDRS} DESTINATION include/utils)）；Conan 的 cpp_info.libs 只声明主库，消费方需按需链接全部组件"
  - "noop 后端无条件编译（filament/backend/CMakeLists.txt:54-55），因此无需 GPU/窗口即可链接并运行引擎——这是本阶段可验证的边界"
  - "xsimd/flatbuffers 等第三方全部随源码树内置（third_party/ 无 Git submodule、无 FetchContent 下载），构建期零网络"
