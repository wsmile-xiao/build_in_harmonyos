# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: filament/1.76.1
homepage: "https://github.com/google/filament"

# 上游测试命令
upstream_check_command: "ctest --output-on-failure   # 目标 test_filament / test_depth / test_material_parser"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试规模（实测 filament-1.76.1 源码树，已排除 third_party）：
#   - filament/test/*.cpp        : 20 个
#   - libs/**/test*/*.cpp        : 63 个
#   - libs/**/*_test.cpp         : 1 个
#   - tools/**/tests/*.cpp       : 2 个
#   - 框架                       : 自带 GoogleTest（third_party/libgtest）
#   - 启用条件                   : FILAMENT_BUILD_TESTING=ON 且 TNT_DEV（Debug/RelWithDebInfo）
upstream_tests:
  - file: filament/test/
    description: "test_filament（渲染/深度/材质等），仅在 Debug/RelWithDebInfo 且 FILAMENT_BUILD_TESTING=ON 时配置"
    command: "./test_filament"
    count: 20
    executed: false
    not_run_reason: "本包为 Release 交付（测试目标只在 TNT_DEV=Debug/RelWithDebInfo 下配置），且这些用例需要可用的渲染后端；本阶段只有 noop 后端，无法覆盖全套用例（详见 notes.md §8.1）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_filament.cpp
    description: "Consumer test: 在 noop 后端上 Engine::create → Renderer/Scene/View/Camera → 离屏 SwapChain → beginFrame/render/endFrame 完整帧循环 → destroy"
    command: "./test_filament"
    assertions: 14

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
