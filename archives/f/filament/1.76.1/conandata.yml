sources:
  filament:
    url: "https://github.com/google/filament/archive/refs/tags/v1.76.1.tar.gz"
    sha256: "f65b5b50ef5647a190b51a37fa006985e061bcfdc87c3b9b0ea18cf7b52042aa"

patches:
  - patch_file: "patches/0001-build-linux-combine-static-libs.sh.patch"
    patch_description: "OHOS/hmdfs: build/linux/combine-static-libs.sh uses relative scratch directories plus pushd/popd; the process cwd can become unreadable (getcwd ENOTSUP) which aborts the filamat/matc POST_BUILD step.  Switch to absolute paths under $COMBINE_WORK_ROOT and subshell cd."
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-perfetto-skip-system-vm_sockets.patch"
    patch_description: "perfetto: when a configure-time probe shows <linux/vm_sockets.h> cannot be included next to <sys/socket.h> (that sysroot's <linux/socket.h> redefines sockaddr_storage), take perfetto's own UAPI fallback.  Capability-based, no platform macro."
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-use-system-gles-instead-of-bluegl.patch"
    patch_description: "When bluegl is not linked (it is a host-only generated GL loader), take GLES3 from the system headers.  The choice is a CMake-derived capability, not a platform macro."
    patch_type: "portability"
