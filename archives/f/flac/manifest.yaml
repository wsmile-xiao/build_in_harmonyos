software: flac
display: "FLAC"
description: "Free Lossless Audio Codec — lossless audio compression library and tools"
category: system
homepage: "https://xiph.org/flac/"
license: BSD-3-Clause
build_system: autotools/cmake

ohos_adaptation:
  key_points:
    "1.4.3":
      - "需要更新 config.guess/config.sub 支持 OHOS 平台识别"
      - "config.status 的 mktemp 可能在 OHOS 上因权限问题失败，需 hints/post-configure.sh 修复"
      - "Shared libraries 需要 RPATH 修复"
      - "WITH_OGG=OFF（libogg 不可用）"
    "1.5.0":
      - "官方自带完整 CMakeLists.txt，零补丁交叉构建（无需 config.guess/config.sub）"
      - "SDK llvm/bin 缺 llvm-ranlib，需 -DCMAKE_RANLIB 指向 PATH 中的 llvm-ranlib（hnp 别名指向 llvm-ar）"
      - "libogg 依赖经 find cache 变量接线：-DOGG_INCLUDE_DIR/-DOGG_LIBRARY 预置 conan 包路径"
      - "test_libFLAC++ 运行需 LD_LIBRARY_PATH 指向 SDK 的 libc++_shared.so"
  common_dependencies:
    - libogg（1.5.0 起已可用，静态链接）

versions:
  "1.4.3":
    status: built
    build_date: "2026-04-24"
  "1.5.0":
    status: built
    build_date: "2026-09-05"
    build_system: cmake
    dependencies: [libogg]
    notes: "官方 CMake 构建，零补丁；SDK 无 llvm-ranlib 需别名重定向；libogg 经 find cache 变量接线；上游测试 9/9 组全过"
