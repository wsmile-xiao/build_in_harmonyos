version: "1.5.0"
software: flac
status: built
build_date: "2026-09-05"
build_system: cmake

source:
  url: "https://github.com/xiph/flac/archive/refs/tags/1.5.0.tar.gz"
  sha256: "aea54ed186ad07a34750399cb27fc216a2b62d0ffcd6dc2e3064a3518c3146f8"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=ohos.toolchain.cmake"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DWITH_OGG=ON"
    - "-DBUILD_PROGRAMS=ON"
    - "-DBUILD_CXXLIBS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_DOCS=OFF"
    - "-DINSTALL_MANPAGES=OFF"
  dependencies:
    - libogg/1.3.5
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "flac 1.5.0 官方源码自带完整 CMakeLists.txt（cmake>=3.12），比 1.4.3 时代的 autotools 路线更适合 OHOS：无 config.guess/config.sub/mktemp 坑，直接用 ohos.toolchain.cmake 交叉构建即可"
  - "OHOS SDK llvm/bin 下只有 llvm-ar 没有 llvm-ranlib，ohos.toolchain.cmake 却把 CMAKE_RANLIB 指向 <sdk>/llvm/bin/llvm-ranlib：所有静态库(.a)链接报 'Error running link command: no such file or directory' 且不指明缺哪个程序。对策：cmake -DCMAKE_RANLIB=$(which llvm-ranlib)（hnp 布局 /data/service/hnp/bin/llvm-ranlib 是 llvm-ar 的别名，ar 兼容 ranlib 调用）"
  - "上游 cmake/FindOgg.cmake 用 find_path(OGG_INCLUDE_DIR)+find_library(OGG_LIBRARY)；交叉链 FIND_ROOT_PATH_MODE=ONLY 会滤掉 conan 包路径，须预置 -DOGG_INCLUDE_DIR=<pkg>/include -DOGG_LIBRARY=<pkg>/lib/libogg.a（assimp ZLIB 同法）"
  - "test_libFLAC++ 运行需要 libc++_shared.so：NEEDED 未带 rpath，设备上从 /system/lib64 找不到 SDK 版本时用 LD_LIBRARY_PATH=<sdk>/llvm/lib/aarch64-linux-ohos 兜底"
  - "test_cuesheet 的输出文件路径取 strstr(infilename, \"cuesheets/\") 相对路径，必须在含 cuesheets/ 子目录的 CWD 运行（上游 test_grabbag.sh 在 build/test 下跑，先 mkdir cuesheets）"
  - "flac CLI 编码 WAVE_FORMAT_EXTENSIBLE 的 wav 后解码出的 wav 是标准 16 字节 fmt 头，逐字节 cmp 会 FAIL，但 data 段音频数据完全一致且 STREAMINFO md5 自洽——验证无损要用 md5 或 data 段比对，不要整文件 cmp"
