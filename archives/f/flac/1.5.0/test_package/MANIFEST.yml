# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: flac/1.5.0
homepage: "https://xiph.org/flac/"

# 上游测试命令
upstream_check_command: "ctest / make check (test_flac.sh, test_grabbag.sh)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "test_libFLAC / test_libFLAC++ / test_grabbag(cuesheet+picture) / test_seeking / flac CLI roundtrip"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_libFLAC
    source: flac-1.5.0/src/test_libFLAC/main.c
    description: "libFLAC unit tests (bitreader/bitwriter/crc/format/encoders/decoders/metadata_manip/metadata_object)"
    command: "./test_libFLAC"
  - file: test_libFLAC++
    source: flac-1.5.0/src/test_libFLAC++/main.cc
    description: "libFLAC++ C++ binding unit tests (metadata chain, objects)"
    command: "./test_libFLAC++"
  - file: test_cuesheet
    source: flac-1.5.0/src/test_grabbag/cuesheet/main.c
    description: "grabbag cuesheet parser: 6 good cuesheets accepted + 44 bad cuesheets rejected + output diff vs cuesheet.ok"
    command: "./test_cuesheet <cue> 211680000 44100 cdda (batch loop)"
  - file: test_picture
    source: flac-1.5.0/src/test_grabbag/picture/main.c
    description: "grabbag picture metadata parser: output diff vs picture.ok"
    command: "./test_picture <pictures dir>"
  - file: test_seeking
    source: flac-1.5.0/src/test_seeking/main.c
    description: "stream seek correctness: preprogrammed + random seeks"
    command: "./test_seeking file.flac 50 <samples>"
  - file: test_streams
    source: flac-1.5.0/src/test_streams/main.c
    description: "generates deterministic test streams (wav) used by seeking/flac CLI tests"
    command: "./test_streams"
  - file: flac (CLI)
    source: flac-1.5.0/src/flac/main.c
    description: "flac CLI encode/decode round-trip with STREAMINFO md5 self-check (test_flac.sh md5cmp equivalent)"
    command: "flac -f -o x.flac x.wav && flac -d -f -o x2.wav x.flac && flac -f -o x3.flac x2.wav && metaflac --show-md5sum x.flac x3.flac"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer round-trip: FLAC__stream_encoder + FLAC__stream_decoder API, 65536 samples bit-identical lossless verification + OGG support check"
    command: "./test_flac"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 137000
