# 软件级 manifest
software: finalcut
display: "FINAL CUT"
description: "C++ 文本用户界面（TUI）库，提供终端检测、文本绘制及对话框、按钮、列表框等控件"
category: library
homepage: "https://github.com/gansm/finalcut"
license: LGPL-3.0

# 常用构建系统
build_system: autotools

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "autotools 项目，config.guess/config.sub 需要 HarmonyOS 识别补丁（E007）"
    - "终端绘制逻辑由库实现；terminfo/termcap 能力通过 ncurses 提供"
    - "HarmonyOS 终端 ioctl 能力需按实际设备验证；测试只跳过确认为不可用的注入用例"
  common_dependencies:
    - ncurses

versions:
  "0.9.1":
    status: built
    build_date: "2026-10-02"
    conan_ref: "finalcut/0.9.1"
