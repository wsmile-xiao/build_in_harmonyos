# finalcut 0.9.1 — single source of truth for source URL + SHA256 + patches.
# Official GitHub tag archive: https://codeload.github.com/gansm/finalcut/tar.gz/refs/tags/0.9.1
# codeload URLs have no file suffix; set filename so Conan selects the tar.gz extractor.
# sha256 verified 2026-09-27: 6593b3c43ba1de98e4e0e3a563dbf9316fade71ef85c82e6b6f086184ec69a56
#
# Notes:
# - autoreconf-generated config.guess/config.sub did not recognize the
#   HarmonyOS target triplet in the tested HNP environment; conanfile.py applies
#   the idempotent OHOS triplet transform to those generated files at build time.
# - 0001-ftermlinux-isa-guard.patch: clang -Werror unused-private-field fix;
#   the three fields are only used under ISA_SYSCTL_SUPPORT on x86/Sparc Linux,
#   guard the declarations the same way.

sources:
  url: "https://codeload.github.com/gansm/finalcut/tar.gz/refs/tags/0.9.1"
  filename: "finalcut-0.9.1.tar.gz"
  sha256: "6593b3c43ba1de98e4e0e3a563dbf9316fade71ef85c82e6b6f086184ec69a56"

patches:
