test_package_tests:
  - file: test_finalcut.cpp
    description: "Consumer verifies FString length and string conversion through the installed public API"
    command: "./test_finalcut"
  - file: test_ohos_unicode.cpp
    description: "On HarmonyOS/OHOS aarch64, drives a FINAL CUT dialog over a PTY, types CJK text, activates Accept, and verifies application shutdown and UTF-8 preservation"
    command: "./test_ohos_unicode"

assertion_count: 14

upstream_test_exemptions:
  - test: ftermfreebsd_test
    reason: "FreeBSD/DragonFly terminal backend; upstream host condition does not register it for HarmonyOS, which does not provide this backend."
  - test: ftermopenbsd_test
    reason: "OpenBSD terminal backend; upstream host condition does not register it for HarmonyOS, which does not provide this backend."
  - test: "fkeyboard_test: escapeKeyTest, characterwiseInputTest, severalKeysTest, functionKeyTest, metaKeyTest, sequencesTest, mouseTest, utf8Test, unknownKeyTest"
    reason: "These nine upstream cases inject input with TIOCSTI. On the tested HarmonyOS 6.0 aarch64 device, TIOCSTI against a PTY slave returns EACCES; the other four fkeyboard_test cases still run."
