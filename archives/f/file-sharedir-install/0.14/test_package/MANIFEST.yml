# test_package/MANIFEST.yml — file-sharedir-install 0.14
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: file-sharedir-install/0.14
homepage: "https://metacpan.org/pod/File::ShareDir::Install"

# 上游自带 Makefile.PL（ExtUtils::MakeMaker，由 Dist::Zilla 生成），
# 无需像 Module::Build 系那样生成替代构建脚本；上游测试经 make test 运行。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试套件（2026-09-18 实测，hnp perl 5.42.0）：
# - t/ 目录：4 个 .t 测试文件
# - 实测结果：**Files=4, Tests=39, Result: PASS**，无 skip
#
# ⚠️ 必须用 `make test`，不能改用裸 `prove -Ilib t/`：
#   t/10_makefile.t、t/11_dotfile.t、t/12_delete.t 三个文件都以
#   `plan skip_all if not -f 'Makefile'` 开头，且内部会**递归调用 make**
#   校验安装结果。裸 prove 下 Makefile 不存在 → 三个文件静默 skip，
#   只剩 1 个用例却报 "All tests successful"（实测 Files=4, Tests=1）——
#   那是假绿。走 make test 才有 39 个用例真跑。
upstream_tests:
  - file: t/
    source: File-ShareDir-Install-0.14/t/*.t
    description: "上游 perl 测试套件（4 文件 39 用例；hnp perl 5.42.0 实测 Result: PASS，无 skip）——含 install_share/delete_share 的 Makefile 生成与真实 make 安装校验"
    command: "make test"

# test_package 消费者测试（R34 真实 API：加载打包的 File::ShareDir::Install，
# 真实登记共享目录 → 生成 Makefile → 执行 make → 校验 blib 产物）
test_package_tests:
  - file: test_file_sharedir_install.pl
    description: "消费者测试：install_share（dist/module）、非法类型 confess、postamble 注入规则、真实 make 后 blib 内共享文件齐备（含空格文件名复制、隐藏文件默认排除）"
    command: "perl -I<site> test_file_sharedir_install.pl <site>"

# 测试断言总数（实测 13）
assertion_count: 13
