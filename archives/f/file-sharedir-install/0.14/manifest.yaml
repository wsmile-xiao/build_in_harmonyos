# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CPAN 发行版的构建系统要先实地确认：File-ShareDir-Install 由 Dist::Zilla 生成的是 Makefile.PL（ExtUtils::MakeMaker），与 future/metrics-any/test-refcount 的 Module::Build 不同——检查源码根目录有无 Makefile.PL 再决定是否需要生成替代脚本，不要一律套用 MakeMaker 替换 (ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "上游测试以 `plan skip_all if not -f 'Makefile'` 为前提时，必须走 `make test`（Makefile 已生成）而不能用裸 `prove -Ilib t/`：后者会让这些文件静默 skip，用例数骤降却仍报 All tests successful，属假绿——申报前须核对 Tests= 数值（本包实测 prove 为 1、make test 为 39）(ref: DRAFT-perl-makefile-gated-test-skip-all)"
  - "纯 Perl 模块的 site 目录定位：模块位于 <site>/<Module/Path>.pm，层级更深时（如 File/ShareDir/Install.pm）须按模块相对路径**逐级上溯**才是 site 根；返回末级目录会使 PERL5LIB/-I 指向错误层级，test_package 报 missing packaged module (ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "判定 ohpcd 制品是否存在必须用 conan search <pkg>/* -r=ohpcd；conan download 对不存在/未发布的包报误导性的 system acceleration policy not enabled (ref: DRAFT-perl-module-build-makemaker-substitution)"

references:
