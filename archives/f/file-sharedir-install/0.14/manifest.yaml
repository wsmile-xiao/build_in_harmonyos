# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  note: |
    META.json prereqs.runtime.requires 全部为 perl 核心模块
    （Carp / Exporter / File::Spec / IO::Dir / strict / warnings / perl>=5.006），
    OHOS perl 内建，无外部 CPAN 依赖、无 Conan 依赖。
    configure.requires 为 ExtUtils::MakeMaker（perl 核心）——本发行版**自带
    Makefile.PL**，不需要 Module::Build，也无需生成替代构建脚本。
    test.requires（ExtUtils::MakeMaker / File::Path / File::Spec / Test::More）
    均为核心模块，故上游测试可真跑。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Perl 模块无二进制产物，沿用
    perl-uri / metrics-any / test-refcount 先例；不产生 bindirs，故无需
    commands.json，R38 不适用）。
    构建：perl Makefile.PL INSTALLDIRS=site → make → make test →
    make install DESTDIR=<staging>；package() 按登台树原样拷入
    package_folder，并以遍历定位 File/ShareDir/Install.pm 后**上溯两级**得到
    site 目录（安装前缀随 perl 构建而异，实测
    /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0）。
    package_info() 以 runenv_info 注入 PERL5LIB；无 C/C++ 库可链接
    （cpp_info.libs=[]，R26 不适用）。
    解释器固定 /data/service/hnp/bin/perl（5.42.0），与 metrics-any /
    test-refcount 口径一致。

    ⚠️ 上游测试必须以 `make test` 运行，不可用裸 `prove -Ilib t/` 替代：
    t/10_makefile.t、t/11_dotfile.t、t/12_delete.t 均以
    `plan skip_all if not -f 'Makefile'` 开头并会递归调用 make；裸 prove 下
    这三个文件静默 skip，只剩 1 个用例却报 "All tests successful"
    （实测 Files=4, Tests=1），属假绿。经 make test 为 Files=4, Tests=39。

