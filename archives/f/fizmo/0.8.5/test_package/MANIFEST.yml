# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: fizmo/0.8.5
homepage: https://fizmo.spellbreaker.org/

# 上游测试命令 — fizmo 上游无独立测试套件（无 make check 目标）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# fizmo 上游无正式测试框架，仅编译验证
upstream_tests:
  - file: Makefile.am
    source: fizmo-0.8.5/
    description: "fizmo 编译验证 — 确保各前端/库可正常编译"
    command: "make"
    condition: "native / 交叉编译均执行"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "验证 fizmo-ncursesw 二进制存在 + --help 输出检查"
    command: "conan create (test_package _check_binary_exists + --help 验证)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2