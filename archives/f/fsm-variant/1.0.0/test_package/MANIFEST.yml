package: fsm-variant/1.0.0
homepage: "https://github.com/mpusz/fsm-variant"

upstream_check_command: "./connection_fsm && ./tcp_fsm"
upstream_test_in_build: true
upstream_test_command: "./connection_fsm; ./tcp_fsm"

upstream_tests:
  - file: example/connection_fsm/connection_fsm_tests.cpp
    source: fsm-variant-1.0.0/example/connection_fsm/connection_fsm_tests.cpp
    description: "Official connection FSM example exercises three event sequences."
    command: "connection_fsm"
    test_functions: 3
    assertion_failure_macros: 0
  - file: example/tcp_fsm/tcp_fsm_tests.cpp
    source: fsm-variant-1.0.0/example/tcp_fsm/tcp_fsm_tests.cpp
    description: "Official TCP FSM example exercises four open/close and FIN sequences."
    command: "tcp_fsm"
    test_functions: 4
    assertion_failure_macros: 0

test_package_tests:
  - file: sample.cpp
    description: "Consumer verifies initial, connected, and disconnected states through the public dispatch/get_state API."
    command: "./test_fsm"

assertion_count: 3
