category: foundation
homepage: "https://github.com/Naios/function2"
license: "BSL-1.0"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only INTERFACE library，单头文件 include/function2/function2.hpp"
    - "上游 CMake 提供 install target，直接在 CMake 驱动下安装头文件与 CMake config"
    - "上游 tests 依赖 googletest submodule（tarball 不含），配方 BUILD_TESTING=OFF，以 test_package 消费者测试覆盖"
    - "无外部依赖"
  common_dependencies: []

versions:
