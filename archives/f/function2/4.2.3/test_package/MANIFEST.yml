package: function2/4.2.3
homepage: "https://github.com/Naios/function2"

# 上游测试命令（CMake + googletest submodule；tarball 不含 submodule 内容）
upstream_check_command: "cmake -DBUILD_TESTING=ON -B build && cmake --build build && ctest --test-dir build"

# conanfile.py build() 中是否已集成上游测试
# 未集成：function2 header-only，BUILD_TESTING=OFF（上游 tests 依赖 googletest submodule）
# upstream_check_command 仅供手动复现参考，不自动执行
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test/CMakeLists.txt 的 function2_tests 聚合了若干测试源）
upstream_tests:
  - file: test/functionality-test.cpp
    description: "功能测试"
    command: "./function2_tests"
  - file: test/build-test.cpp
    description: "构建自包含测试"
    command: "./function2_tests"
  - file: test/multi-signature-test.cpp
    description: "多签名重载测试"
    command: "./function2_tests"
  - file: test/regressions.cpp
    description: "回归测试"
    command: "./function2_tests"

# test_package 中自带的测试
test_package_tests:
  - file: test.cpp
    description: "消费者测试 — 验证 function2/function2.hpp 包含与 fu2::function 调用"
    command: "./test_function2"