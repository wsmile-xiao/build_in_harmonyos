software: fdclone
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.01j/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.01j"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-06"

# 构建系统类型（顶级字段，供验证脚本使用）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://deb.debian.org/debian/pool/main/f/fdclone/fdclone_3.01j.orig.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
  - "PREFIX=/storage/Users/currentUser/usr/local"
  - "CC=clang"
  - "CFLAGS=-I/storage/Users/currentUser/usr/local/include -fPIC -O2"
  - "LDFLAGS=-L/storage/Users/currentUser/usr/local/lib"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - ncurses/6.4
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-Makefile.in.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "fdclone 使用自定义 Makefile 系统，不需要 configure"
- "HMDFS 不支持硬链接，需将 $(LN) 改为 $(LN) -s"
- "使用 BUILD 变量作为 DESTDIR 的替代"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/fdclone-3.01j.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/fdclone-3.01j.work
  source_orig_hash: d0e1142e6dcda821
  source_work_hash: 678f1e2c662ed0bc
  generated_at: '2026-06-06T15:41:11'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.in.patch
    type: auto
    platform_only: True
    guard: 'pending'
