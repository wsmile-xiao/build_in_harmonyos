# test_package/MANIFEST.yml — file-sharedir 1.118
# CI L0e 强制要求此文件存在（上游测试声明文件）
# 详见: docs/TEST_QUALITY_SPEC.md

package: file-sharedir/1.118
homepage: "https://metacpan.org/pod/File::ShareDir"

# 上游测试命令：上游自带 Makefile.PL（ExtUtils::MakeMaker），故 make test 即可
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试套件（2026-09-20 本机实测，hnp perl 5.42.0）
# - t/ 目录：7 个 .t 测试文件
# - 实测结果：**Files=7, Tests=92, Result: PASS**（零失败）
# - ⚠️ 依赖注入：上游 t/00_prereqs.t 会 `require` META.json 声明的**全部** requires
#   （含 configure/build 段的 File::ShareDir::Install），故 build() 内必须让
#   class-inspector 与 file-sharedir-install 的 perl lib 根进入 @INC。
#   本配方在 build() 内遍历依赖定位并注入 PERL5LIB（依赖只声明 runenv_info，
#   其 PERL5LIB 不会自动进入 build 上下文）。
#   实测对照：只注入 class-inspector（漏 file-sharedir-install）→ t/00_prereqs.t
#   报 `Can't locate File/ShareDir/Install.pm`，1/91 失败；两者都注入 → 全绿。
upstream_tests:
  - file: t/
    source: File-ShareDir-1.118/t/*.t
    description: "上游 perl 测试套件（7 文件 92 用例；hnp perl 5.42.0 实测 Result: PASS，零失败）"
    command: "make test"

# test_package 消费者测试（R34 真实 API：载入打包的 File::ShareDir，真实调用
# dist_dir/dist_file/module_dir/module_file，校验数据文件随包发布，含 3 个负例）
#
# 驱动方式：.pl 不在 CI L0c 认可的测试源扩展名内，故以 test_file_sharedir.py
# 作为 L0c 可见入口驱动 perl 测试源（与 file-sharedir-install 0.14 先例同款）。
test_package_tests:
  - file: test_file_sharedir.pl
    description: >-
      消费者测试（19 断言）：版本、四个导出符号、dist_dir/dist_file
      （含子目录路径与内容非空）、module_dir/module_file、以及 3 个**负例**
      （未知发行版 / 未知发行版返回 undef / 缺失数据文件必须报错，证明非恒真空壳）
    command: "perl -I<site> test_file_sharedir.pl"
  - file: test_file_sharedir.py
    description: >-
      L0c 可见入口：校验打包完整性（File/ShareDir.pm + auto/share 数据目录）后
      以绝对路径 perl 驱动上述 .pl，并校验输出含 ALL OK 标记
    command: "python3 test_file_sharedir.py <site-perl-dir>"

# 测试断言总数（实测：19）
assertion_count: 19

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游 t/ 套件在 build() 内真实运行（make test），实测 Files=7 / Tests=92 /
  Result: PASS，零失败、零跳过。**未豁免任何失败**：make test 退出码非 0 时
  conan create 直接失败，不做静默降级。
