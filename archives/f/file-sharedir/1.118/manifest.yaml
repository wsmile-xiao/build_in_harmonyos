  failed: 0
  skipped: 0
  note: |
    上游测试（R51，2026-09-20 实测，hnp perl 5.42.0）：t/ 目录 **7 个 .t 文件**，
    `make test` 实测 **Files=7, Tests=92, Result: PASS**，**零失败、零跳过**。
    逐文件（prove -v 实测）：00_prereqs(21) / 01_compile / 02_main /
    03_extensions / 04_fail / 05_class / 06_old —— 7/7 全部运行。
    通过率口径 = passed/(passed+failed) = 92/92 = **100%**。
    上游测试已集成进 build()（upstream_test_in_build: true）。
