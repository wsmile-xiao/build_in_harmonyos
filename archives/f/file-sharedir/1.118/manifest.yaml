# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "perl 依赖包通常只声明 runenv_info（无 buildenv_info），其 PERL5LIB 不会进入下游包的 build 上下文；下游若在 build() 内跑依赖该模块的测试，必须遍历依赖包目录定位并显式注入（本包 t/00_prereqs.t 会 require META.json 声明的全部 requires，含 configure/build 段）"
  - "纯 Perl 包若上游自带 Makefile.PL（ExtUtils::MakeMaker）则无需生成替代构建脚本；只有走 Module::Build（Build.PL）时才需用 MakeMaker 生成等价 Makefile.PL（本包与 file-sharedir-install 属前者，metrics-any / future-queue 属后者）(ref: DRAFT-perl-module-build-makemaker-substitution)"
  - "两个 perl 包都声明同一 env 变量（PERL5LIB）时本包应用 prepend_path 而非 define_path：define_path 是覆盖语义，会让依赖的取值丢失"

references:
  - https://metacpan.org/pod/File::ShareDir
  - https://metacpan.org/dist/File-ShareDir
  - https://metacpan.org/pod/File::ShareDir::Install
