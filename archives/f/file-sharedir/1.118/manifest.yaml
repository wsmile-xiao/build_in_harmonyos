version: "1.118"
software: file-sharedir
status: built
build_date: "2026-09-20"
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # CPAN 官方发行版（R39 合规）
  url: "https://cpan.metacpan.org/authors/id/R/RE/REHSACK/File-ShareDir-1.118.tar.gz"
  sha256: "3bb2a20ba35df958dc0a4f2306fc05d903d8b8c4de3c8beefce17739d281c958"
  compression: tar.gz
  archive_root: "File-ShareDir-1.118"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "class-inspector/1.36"
    - "file-sharedir-install/0.14"
  optional: []
  note: |
    META.json prereqs 逐项对齐（实测复核）：
      runtime   requires   Class::Inspector >= 1.12        → ohpcd 已发布 1.36
      configure requires   File::ShareDir::Install 0.13    → ohpcd 已发布 0.14
      build     requires   File::ShareDir::Install 0.13    → 同上
      runtime   requires   Carp / File::Spec / warnings    → perl 核心，hnp perl 自带
      test      requires   File::Path >= 2.08 / Test::More >= 0.90 → hnp perl 自带
      configure recommends File::ShareDir::Install 0.08 / inc::latest 0.500（上游
                           inc/ 目录已自带，无需外部提供）

    ⚠️ File::ShareDir::Install 虽属 configure/build 段，但**必须**在 Conan 中声明
    （不能只靠上游 inc/ 自举）：上游 t/00_prereqs.t 会 `require` META.json 声明的
    **全部** requires，缺少时该测试文件失败（实测 1/91）。已发布到 ohpcd，故按
    R36 正常声明。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Perl 模块无二进制产物；不产生 bindirs，
    故无需 commands.json，R38 不适用）。

    构建：perl Makefile.PL INSTALLDIRS=site → make → make test →
    make install DESTDIR=<staging>；package() 按登台树原样拷入 package_folder，
    并以遍历定位 File/ShareDir.pm 得到 perl lib 根，同时**显式校验**
    auto/share 数据目录随包发布（本包核心产物，缺失则消费方
    dist_dir/module_dir 在运行期才失败）。

    上游**自带 Makefile.PL**（ExtUtils::MakeMaker），并在 inc/ 中捆绑
    File::ShareDir::Install 与 inc::latest 以自举 install_share —— 故无需
    生成替代构建脚本（对比 metrics-any / future-queue 用 Module::Build 需替代）。

    ⚠️ 依赖注入（关键，实测）：两个依赖的 package_info() 只声明 runenv_info、
    未声明 buildenv_info，其 PERL5LIB 不会进入本包 build 上下文 —— 而
    t/00_prereqs.t 需要它们、Makefile.PL 的 install_share 需要
    File::ShareDir::Install。故 build() 内遍历依赖定位各自 perl lib 根并显式
    注入 PERL5LIB。实测对照：只注入 class-inspector（漏
    file-sharedir-install）→ 1/91 失败；两者都注入 → 全绿。

    解释器：固定 /data/service/hnp/bin/perl（5.42.0），与
    file-sharedir-install / metrics-any 先例一致。

