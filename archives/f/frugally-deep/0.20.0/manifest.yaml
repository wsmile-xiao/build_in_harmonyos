# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "frugally-deep 为 header-only CMake 库（INTERFACE 目标 fdeep），配方应使用 package_type=header-library，package() 直接拷贝 include 树，无需编译；构建系统检测器按 URL 误判 autotools 时须手工修正为 cmake"
  - "上游 conanfile.txt 固定 functionalplus/v0.2.24 与 nlohmann_json/3.11.3，但 OHOS 制品仓发布的是 fplus/0.2.28（提供 FunctionalPlus CMake 配置与 FunctionalPlus::fplus 目标）和 nlohmann_json/3.12.0；recipe requirements() 必须使用制品仓已发布版本并保持 CMakeDeps 生成的 find_package 名称与上游 CMakeLists 一致（FunctionalPlus/Eigen3/nlohmann_json）"
  - "fdeep 的 read_model JSON 中 Dense 层必须带 inbound_nodes 节点连接（[{\"args\":[{\"config\":{\"keras_history\":[...]}}]}]），否则模型前向时报 invalid node index；input_layers/output_layers 用 [\"layer\",0,0] 三元组"
  - "fdeep 运行时张量位置读取用 tensor_pos(单参) 匹配 1 维形状，多参位置会抛 Invalid position rank for tensor"
  - "上游测试数据链 generate_test_models.py→convert_model.py 依赖 TensorFlow/Keras 后端，OHOS aarch64 无 TF 轮子（默认源/社区源均 No matching distribution），测试数据无法生成；专项测试改用手工构造最小 Dense 模型 JSON 走公开 API read_model_from_string+predict 完成真实消费验证"