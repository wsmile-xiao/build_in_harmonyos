# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: frameofreference/0.1.2
homepage: "https://github.com/fast-pack/FrameOfReference"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test.cpp
    source: frameofreference-0.1.2/src/test.cpp
    description: "上游单元测试/基准：unit/deepunit/turbounit*/turbodeepunit* 自检 + sampledata.txt 基准"
    command: "./unit sampledata.txt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：pack4_8/unpack4_8 往返 + compress/uncompress 往返一致性"
    command: "./test_frameofreference"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
