# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试三步法）

package: flagpp/3.1.0
homepage: "https://github.com/Curve/flagpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -Dflagpp_tests=ON && cmake --build && ./build/tests/flagpp-tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "./build/tests/flagpp-tests"

# 上游实际运行的测试程序（本机实测通过：Suite basic/wrapped/global all passed, 18 asserts）
upstream_tests:
  - file: tests/basic.cpp
    source: flagpp-3.1.0/tests/basic.cpp
    description: "flagpp 位运算核心断言（18 个 assert），覆盖 & | ^ 及 wrapper 语义"
    command: "./flagpp-tests"

# test_package 中自带的测试 (消费者视角验证, R34: 实际调用被测包 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：实际 include <flagpp/flags.hpp>，定义 scoped enum + flagpp::enabled 特化并执行位运算断言"
    command: "./test_flagpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18