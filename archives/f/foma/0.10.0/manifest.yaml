# foma 0.10.0 缂栬瘧妗ｆ
software: foma
version: "0.10.0"
status: built
build_system: cmake
build_date: 2026-06-16

dependencies:
  required:
    - name: zlib
      version: "1.3.1"
      note: "鍘嬬缉搴撴敮鎸?
    - name: bison
      version: "3.8.2"
      note: "瑙ｆ瀽鍣ㄧ敓鎴?
    - name: flex
      version: "2.6.4"
      note: "璇嶆硶鍒嗘瀽鍣ㄧ敓鎴?
  optional:
    - name: readline
      version: "8.2"
      note: "浜や簰寮忓懡浠よ缂栬緫锛堝彲閫夛紝鏈惎鐢級"

build_config:
  target: aarch64-unknown-linux-ohos
  cmake_options:
    - CMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX
    - CMAKE_BUILD_TYPE=Release
    - NO_READLINE=1
  cflags: "-Wall -Wextra -std=c2x -fPIC -O2"
  env:
    CC: clang

patches_applied:
  - file: inline-source-mods
    purpose: "CMakeLists.txt 鍜?foma.c 婧愮爜淇敼锛坮eadline 鍙€夈€丯O_READLINE 鏉′欢缂栬瘧锛?

compatibility:
  level: high
  issues: []
  notes: |
    - Compiled without readline support (NO_READLINE defined)
    - Core library (libfoma) works without readline
    - foma executable uses fgets() instead of readline()

test_results:
  type: script
  passed: 6
  failed: 0
  note: "All test scripts in tests/ passed successfully"

knowledge_gained:
  - "CMake projects may require custom ZLIB path handling"
  - "readline can be made optional in foma with NO_READLINE macro"

binaries:
  - foma
  - flookup
  - cgflookup
  - libfoma.a
  - libfoma.so

references:
  - https://github.com/mhulden/foma