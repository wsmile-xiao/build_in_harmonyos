# foma 0.10.0 编译档案
software: foma
version: "0.10.0"
status: built
build_system: cmake
compile_date: 2026-06-16

dependencies:
  required:
    - name: zlib
      version: "1.3.1"
      note: "压缩库支持"
    - name: bison
      version: "3.8.2"
      note: "解析器生成"
    - name: flex
      version: "2.6.4"
      note: "词法分析器生成"
  optional:
    - name: readline
      version: "8.2"
      note: "交互式命令行编辑（可选，未启用）"

build_config:
  target: aarch64-unknown-linux-ohos
  cmake_options:
    - CMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX
    - CMAKE_BUILD_TYPE=Release
    - NO_READLINE=1
  cflags: "-Wall -Wextra -std=c2x -fPIC -O2"
  env:
    CC: clang

patches_applied:
  - file: inline-source-mods
    purpose: "CMakeLists.txt 和 foma.c 源码修改（readline 可选、NO_READLINE 条件编译）"

compatibility:
  level: high
  issues: []
  notes: |
    - Compiled without readline support (NO_READLINE defined)
    - Core library (libfoma) works without readline
    - foma executable uses fgets() instead of readline()

test_results:
  type: script
  passed: 6
  failed: 0
  note: "All test scripts in tests/ passed successfully"

knowledge_gained:
  - "CMake projects may require custom ZLIB path handling"
  - "readline can be made optional in foma with NO_READLINE macro"

binaries:
  - foma
  - flookup
  - cgflookup
  - libfoma.a
  - libfoma.so

references:
  - https://github.com/mhulden/foma