software: faudio
build_system: cmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/26.05/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "26.05"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/FNA-XNA/FAudio/archive/refs/tags/26.05.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_C_COMPILER_WORKS=TRUE"
    - "-DCMAKE_C_ABI_COMPILED=TRUE"
    - "-DBUILD_SDL3=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_UTILS=OFF"
    - "-DBUILD_TESTS=OFF"
    - "-DFAUDIO_INSTALL=ON"
    - "-DCMAKE_C_STANDARD=99"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sdl2/2.30.10

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E052: CMake 不识别 HarmonyOS 平台，需设置 CMAKE_SYSTEM_NAME=Linux"
  - "E053: CMake 编译器检测在鸿蒙因权限问题失败，需设置 CMAKE_C_COMPILER_WORKS=TRUE"
  - "FAudio 默认构建 SDL3 后端，需显式 -DBUILD_SDL3=OFF 使用 SDL2"
  - "FAudio 是纯库项目（无可执行文件），G4 门禁中无二进制是预期行为"
