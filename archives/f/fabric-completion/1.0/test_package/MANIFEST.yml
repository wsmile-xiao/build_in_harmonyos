package: fabric-completion/1.0
homepage: "https://github.com/n0740/fabric-completion"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  上游为单文件 bash 补全脚本纯数据发行（fabric-completion.bash +
  README.md），不含任何测试目录或测试目标。本包以内容级消费者探针
  代替：脚本/README 内容锚点逐项断言 + 行数精确计数。
test_package_tests:
  - file: fabric_completion_probe.cpp
    description: >-
      真消费者测试：包内清单（completions 1 文件 + doc 1 文件 + 全树
      2 文件，排除 conan 2 簿记 conaninfo/conanmanifest），脚本内容锚点（shebang/2011 Bakulin 版权/MIT 条款/缓存
      配置/__fab_completion 函数/complete 注册行/fab --shortlist 等），
      README 锚点（Features/Installation/Settings），静态完整性（脚本
      124 行 + README 46 行精确 + 首末行断言 + 无 CR），截断/坏注册行
      注入负向用例。
    command: "fabric_completion_probe <package-root>"
assertion_count: 5
