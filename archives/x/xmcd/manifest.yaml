software: xmcd
display: "xmcd (Motif CD player and CD database tool)"
description: "Motif/X11 CD audio player with CDDB discography support; ships xmcd (player GUI), cda (command-line controller) and gobrowser (CDDB disc browser)"
category: tool
homepage: "http://www.tikan.org/ti/xmcd/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Upstream is a 2006-era Makefile.std/imake project: OHOS has no imake/xmkmf, so the recipe drives the bundled Makefile.std path (`make -f Makefile.std Makefiles` then `make -j1`) with dependency flags expanded from Conan (R33/R49)."
    - "musl gaps fixed via feature macros / build flags instead of platform macros: -DUSE_TERMIOS (no <termio.h>), -DHZ=100 (HZ undefined), -DHAVE_PTHREAD_CANCEL=0 (no pthread_cancel(3) family; self-abort falls back to pthread_exit, cross-thread cancel points degrade to log + no-op with a defined teardown path)."
    - "Dependency stack: motif/2.3.8 + libxt/1.3.1 + libxext/6.4.0.1 with libx11/1.8.13 forced (libxt/motif pin 1.8.13 while libxext pins 6.4.0; the libXmu/1.3.1 combination precedent), plus ncurses/6.6 for cda's terminal UI."
    - "Headless CI: test_package runs the packaged binaries (cda -h, xmcd -h) without a display server and asserts real output; GUI interaction needs a Motif-capable desktop session and is out of scope for L1 tests."
    - "Upstream ships no test suite (no tests/ directory, no check target in Makefile.std); the HarmonyOS-specific consumer test in test_package/ is the verification entry point (N=1)."
  common_dependencies:
    - motif
    - libxt
    - libxext
    - libx11
    - ncurses

versions:
  "3.3.2":
    status: built
    build_date: "2026-10-04"
    path: archives/x/xmcd/3.3.2
