sources:
  "3.3.2":
    url: "https://pkg.freebsd.org/ports-distfiles/xmcd-3.3.2.tar.gz"
    sha256: "66fee7dfde7d99a8c63c08e7f517898ffcb8b564fb957faff7a26538873eae56"

patches:
  "3.3.2":
    - patch_file: "patches/0001-cdda_d-pthr.c.patch"
      strip: 1
      patch_description: "HAVE_PTHREAD_CANCEL feature macro: cancellation points compile against C libraries without pthread_cancel(3)"
      patch_type: "portability"
    - patch_file: "patches/0002-cdda_d-pthr.h.patch"
      strip: 1
      patch_description: "PTHR_SELF_ABORT macro: self-abort path falls back to pthread_exit() when cancellation is unavailable"
      patch_type: "portability"
    - patch_file: "patches/0003-common_d-config.h.patch"
      strip: 1
      patch_description: "Allow USE_TERMIOS to be selected from the build (musl libc has no <termio.h>)"
      patch_type: "portability"
