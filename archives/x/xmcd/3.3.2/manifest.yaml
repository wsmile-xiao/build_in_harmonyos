# 版本级 manifest — xmcd 3.3.2
# 遵循 ARCHIVE-SPEC v2.0

version: "3.3.2"

software: "xmcd"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-10-04"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://pkg.freebsd.org/ports-distfiles/xmcd-3.3.2.tar.gz"
  sha256: "66fee7dfde7d99a8c63c08e7f517898ffcb8b564fb957faff7a26538873eae56"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游无 imake/xmkmf 依赖；使用自带 Makefile.std（make -f Makefile.std Makefiles 后 make）
  system: makefile
  configure_options:
    - "-DUSE_TERMIOS"          # musl 无 <termio.h>
    - "-DHZ=100"               # musl 未定义 HZ（SCSI Generic 超时路径使用）
    - "-DHAVE_PTHREAD_CANCEL=0" # musl 无 pthread_cancel(3) 族
  dependencies:
    - motif/2.3.8
    - libxt/1.3.1
    - libxext/6.4.0.1
    - libx11/1.8.13
    - ncurses/6.6
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cdda_d-pthr.c.patch"
  - "0002-cdda_d-pthr.h.patch"
  - "0003-common_d-config.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS musl libc 不提供 pthread_cancel(3)/pthread_setcancelstate(3)，且 sysroot 的 libpthread.a 为空壳（-lpthread 无法补齐）→ 特性宏间接层 pthread_exit() 收敛自中止路径，跨线程取消点降级为记录+空操作"
  - "OHOS musl 无 <termio.h> 且未定义 HZ → 编译期 -DUSE_TERMIOS / -DHZ=100（HZ 仅 SCSI Generic 超时路径需要）"
  - "xmcd 系 Makefile.std 直编路径（无 imake）：make -f Makefile.std Makefiles 生成各级 Makefile 后再 make；链接需 CDDBLIB=-L../cddb_d -lcddb（make.inc 约定）"
  - "motif/libxt pin libx11/1.8.13 而 libxext pin libx11/6.4.0 → 依赖图需 force libx11/1.8.13（libXmu/1.3.1 组合先例）"

patch_generation:
  method: per-file-difflib
  source_orig: "pristine release tarball snapshot (.orig),sha256 见 conandata.yml"
  source_work: "适配后源码快照 (.work);生成命令 diff -u --label a/<file> --label b/<file> <orig> <work>"
  source_orig_hash: 319145bb73861067
  source_work_hash: 3b74cc9001dacbbb
  generated_at: '2026-10-04T13:53:00'
  patches_count: 3

patch_classification:
