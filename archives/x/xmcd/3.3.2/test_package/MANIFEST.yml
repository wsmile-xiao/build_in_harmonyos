# test_package/MANIFEST.yml — xmcd 3.3.2
# CI L0e requires this file to exist.

package: xmcd/3.3.2
homepage: "https://www.tikan.org/ti/xmcd/"

# 上游测试清点（R51）：xmcd 3.3.2 源码树无 tests/ 目录，
# Makefile.std 仅含 std/sysv/gcc/sysv-gcc/Makefiles/all/install/clean/man 目标，无 check。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer perspective, headless)
test_package_tests:
  - file: test_xmcd_consumer.sh
    description: "cda -h 输出 3.3.2 横幅与用法（CLI 依赖链）；xmcd 无显示时进入显示初始化（Motif/Xt/X11/SM/ICE 依赖链）；两者均断言无 loader error"
    command: "conan test"

# Approximate assertion count
assertion_count: 7
