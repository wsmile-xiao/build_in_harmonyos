software: xvinfo
display: "xvinfo"
description: "Print out X-Video extension adaptor information"
category: x11
homepage: "https://gitlab.freedesktop.org/xorg/app/xvinfo"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需添加 HarmonyOS 识别 (E007)"
    - "configure 中 mktemp 权限修复，优先使用 $TMPDIR"
    - "需手动编译 libXv 1.0.13 (cmd-pkgs 无预编译包)"
  common_dependencies:
    - libXv
    - libX11

versions:
  "1.1.5":
    status: built
    build_date: "2026-06-02"
