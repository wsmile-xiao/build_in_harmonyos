# 版本级 manifest
# 文件位置: archives/x/xdelta/1.1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.1.3"

software: "xdelta"

status: built

build_date: "2026-09-19"

build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/xdelta/xdelta1/1.1.3/xdelta-1.1.3.tar.gz"
  sha256: "f1c9c40afa3101f9cca15ebb91d888d2a1592555e5b66ddd592b0bacff94eddf"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
  dependencies:
    - "glib/2.88.0.1"
    - "zlib/1.3.1.1.1.1"
    - "diffutils/3.12"
  # diffutils/3.12 is a build/test tool (tool_requires in conanfile.py),
  # providing GNU diff for the upstream xdeltatest diff benchmark legs;
  # not a linked library dependency.
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无静态 diff：config.guess/config.sub 的 HarmonyOS 支持由 build() 首行的
# _patch_config_for_ohos() 做行首锚定运行时编辑（幂等）；glib1-era configure
# 的 glib-config 检测由 _write_glib_config_static() 落盘静态 glib-config 文件
# （--cflags/--libs/--version 在真机上从 Conan 已解析 glib 依赖的聚合 cpp_info
# 直接烘焙，零运行时发现；另经 --disable-glibtest 跳过宏自带的编译运行测试），
# generate 经 buildenv 注入 PATH+GLIB_CONFIG，build 内联进手工 configure 命令。
# VPATH fix: top Makefile.am / test/Makefile.am reference build-tree .la files
# via $(top_srcdir); _patch_vpath_for_out_of_tree() rewrites them to
# $(top_builddir) in both Makefile.in and Makefile.am at build() time
# test INCLUDES gains a standalone -I$(top_srcdir) for shipped xdelta.h
# (same method, opposite direction: headers need srcdir, .la need builddir).
# (device has no automake, editing .am alone has no effect).
patches_applied:
  - "patches/0001-glib2-gqueue.patch"
  - "patches/0002-64bit-pointer-cast.patch"
  - "patches/0003-xdmain-static-table.patch"


# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "xdelta 1.1.3 是 xdelta3 的前代（同一作者 jmacd），构建系统为 Autotools，产物为 xdelta CLI + libxdelta + libedsio"
  - "上游唯一测试套件是 test/xdeltatest.c（681 行）+ test/runtest 驱动，未接入 make check，配方在 build() 中显式执行"
  - "Debian 已将该版本从 glib1.2 移植到 glib2.0（pkg-config 查找），本版配方依赖 glib/2.88.0.1 + zlib/1.3.1.1.1.1（与 glib pin 一致；glib2 API 向后兼容）"
  - "xdelta delta 退出码约定：0=无差异，1=发现差异，2=错误；测试脚本必须把 0/1 视为成功"
  - "1999 年版 config.guess 用 echo+exit 风格（无 GUESS 变量），HarmonyOS 分支必须同风格插入；config.sub v1.1 无 android-linux 锚点，需按 KERNEL-OS 切分/OS 白名单/直通三处手工适配（E007）"
