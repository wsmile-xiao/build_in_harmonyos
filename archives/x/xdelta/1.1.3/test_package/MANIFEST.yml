# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xdelta/1.1.3
homepage: "https://sourceforge.net/projects/xdelta/"

# 上游测试套件存在性（经审计上游源码确认存在唯一测试程序）
upstream_tests_exist: true
upstream_test_total: 1
upstream_test_count_method: auto

# 上游测试审计（来源：xdelta-1.1.3 源码树 test/ 目录）
upstream_test_audit:
  source_tarball: "xdelta-1.1.3.tar.gz (https://downloads.sourceforge.net/project/xdelta/xdelta1/1.1.3/xdelta-1.1.3.tar.gz)"
  build_system: "autotools（configure + make；test/Makefile.am 定义 noinst_PROGRAMS=xdeltatest，未注册 TESTS）"
  scanned_for:
    - "test/ 目录"
    - "Makefile.am 中 TESTS 注册"
    - "ctest / gtest / pytest 注册"
  scan_result: "test/ 目录含 test/xdeltatest.c（681 行自测程序，链接 libxdelta + libedsio + zlib + glib）、test/README.test、test/Makefile.am、test/runtest；Makefile.am 仅定义 noinst_PROGRAMS，无 TESTS 注册，无 ctest/gtest/pytest；上游唯一可执行测试即 test/xdeltatest，共计 1 个。"
  reason: "上游存在 1 个测试程序 test/xdeltatest，未接入 make check，故配方在 build() 中显式执行并以真实退出码生成 HMBS_UPSTREAM_TEST_RESULT（discovered=1）。"

# 上游测试命令（conanfile.py build() 中已集成上游测试）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "test/xdeltatest"

# 上游实际运行的测试程序（1 个：test/xdeltatest.c，681 行）
upstream_tests:
  - file: test/xdeltatest.c
    source: xdelta-1.1.3/test/xdeltatest.c
    description: "Upstream self-test program linked against libxdelta + libedsio + zlib + glib; executed explicitly in build() with HMBS_UPSTREAM_TEST_RESULT marker"
    command: "test/xdeltatest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xdelta.sh
    description: "Consumer CLI round-trip: version, delta, patch+byte-compare, info (R34)"
    command: "bash test_xdelta.sh"

# 测试断言总数 (test_xdelta.sh 中 TC1-TC4 共 4 项)
assertion_count: 4
