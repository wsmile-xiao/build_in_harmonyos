# 软件级 manifest
# 文件位置: archives/x/xdelta/manifest.yaml

software: xdelta

display: "xdelta"

description: "Binary delta tool and library (delta/patch/info for binary files)"

category: utility

homepage: "https://sourceforge.net/projects/xdelta/"

license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游唯一测试套件 test/xdeltatest 未接入 make check，需在配方 build() 中显式执行"
    - "xdelta delta 退出码 0=无差异、1=发现差异、2=错误，测试脚本必须区分"
    - "2001 年版 config.sub 可能不识别 aarch64，必要时更新三元组识别补丁"
  common_dependencies:
    - glib
    - zlib

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.1.3":
    status: built
    build_date: "2026-09-19"
