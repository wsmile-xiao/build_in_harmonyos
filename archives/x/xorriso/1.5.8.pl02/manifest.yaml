version: "1.5.8.pl02"
status: published
build_date: "2026-05-28"

source:
  url: "https://www.gnu.org/software/xorriso/xorriso-1.5.8.pl02.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/usr/local"
    - "--disable-dependency-tracking"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-.patch-ai-review.txt.patch"
  - "0002-config.guess.patch"
  - "0003-config.sub.patch"
  - "0004-version.h.patch"

knowledge_gained:
  - "config.guess 和 config.sub 需要添加 HarmonyOS 平台识别支持"
  - "version.h 需要手动创建，因为 autotools 生成失败"
  - "GNU autotools 项目在 HarmonyOS 上需要更新 config.guess 和 config.sub"