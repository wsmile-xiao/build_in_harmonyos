software: xf86-video-ati
display: "xf86-video-ati"
description: "X.Org video driver for ATI/Radeon graphics hardware"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/driver/xf86-video-ati"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Official freedesktop release tarball ships all pre-generated autotools files; only 3 portability patches needed (config.guess/config.sub HarmonyOS triplet, configure HMDFS umask fix)"
    - "--disable-glamor: glamor hard-requires pkg-config 'gbm' (mesa), unavailable on OHOS; EXA/KMS paths unaffected; with glamor off every gbm symbol reference is compiled out (verified: nm -D shows zero gbm symbols in both modules)"
    - "xorg-server SDK is generated in-recipe from the official 21.1.15 tarball (same approach as merged xf86-video-fbdev): the tarball's own configure runs with every DDX disabled to produce the real generated xorg-server.h, plus the meson install_data SDK header set; xorg-server is NOT a conan dependency"
    - "OHOS clang does not read stdin implicitly — a cpp wrapper (clang -E -x c -) is written into the build folder for the xorg-server configure's RAWCPP probes"
    - "conan libdrm package merges component libs into one libdrm.pc; recipe synthesizes libdrm_radeon.pc (and a pciaccess.pc alias) for upstream configure; a metadata-only xfont2.pc stub satisfies the xorg-server configure's unconditional REQUIRED_LIBS entry"
    - "X server SDK headers include <pixman.h>; pixman include path injected into CFLAGS"
    - "Produces loadable .so modules (ati_drv.so, radeon_drv.so) for X server dlopen; nothing is linked against them"
  common_dependencies:
    - libdrm
    - libpciaccess
    - pixman
    - xorgproto

versions:
  "22.0.0":
    status: built
    build_date: "2026-09-17"
    conan_ref: "xf86-video-ati/22.0.0"
