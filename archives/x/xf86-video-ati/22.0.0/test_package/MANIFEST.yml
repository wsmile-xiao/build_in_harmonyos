# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xf86-video-ati/22.0.0
homepage: "https://gitlab.freedesktop.org/xorg/driver/xf86-video-ati"

# 上游测试命令
# 清点证据 (R51): 源码树只有 src/ man/ conf/ 三个目录, Makefile.am 中无
# check/TESTS 目标 (grep -n "^check\|TESTS" Makefile.am src/Makefile.am 无结果),
# 上游 xf86-video-ati 不带独立测试套件 — 驱动模块只能由 X server 加载验证。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# check_module.c 在 ELF 层复现 X server 模块加载器 (loader.c) 的识别流程:
# 校验 AArch64 ELF、导出的 atiModuleData/radeonModuleData 入口符号、以及
# XF86ModuleVersionInfo 的 MODINFOSTRING 标记 / 驱动名 / 版本号 (22.0.0)。
# 另含 gbm 回归守卫: glamor 禁用后驱动不应引用任何未定义 gbm_* 符号
# (全部 gbm 调用点被 USE_GLAMOR 编译掉, 桩头仅满足残留 #include)。
# 模块由 X server dlopen 并从 server 进程解析 xorg-server 符号, OHOS/musl
# 的 dlopen 是急切绑定, 独立进程无法直接 dlopen (实测报 symbol not found)。
test_package_tests:
  - file: check_module.c
    description: "ELF-level validation of both packaged driver modules (loader entry symbol + XF86ModuleVersionInfo + no-undefined-gbm guard)"
    command: "./check_module <module> <symbol> <name> <major> <minor> <patch>"

# 测试断言总数 (per module: ELF头6项 + 符号导出 + 版本信息记录指针 + MODINFOSTRING2项 + 驱动名 + 版本3项 + gbm守卫)
assertion_count: 30
