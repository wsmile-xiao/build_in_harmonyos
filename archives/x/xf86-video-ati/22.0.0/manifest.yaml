software: xf86-video-ati
version: "22.0.0"
status: built
build_system: autotools
build_date: "2026-09-17"

source:
  url: "https://xorg.freedesktop.org/archive/individual/driver/xf86-video-ati-22.0.0.tar.xz"
  sha256: "c8c8bb56d3f6227c97e59c3a3c85a25133584ceb82ab5bc05a902a743ab7bf6d"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-glamor"
    - "--disable-static"
  dependencies:
    - "libdrm/2.4.133"
    - "libpciaccess/0.19"
    - "pixman/0.46.4.3"
    - "xorgproto/2025.1"
    # xorg-server SDK configure inputs (build time only, not packaged)
    - "xtrans/1.6.0"
    - "libxau/1.0.11"
    - "libxkbfile/1.1.3"
    - "libxshmfence/1.3.3"
    - "nettle/3.10.2.1"
  cc: clang
  cxx: clang++

# xorg-server SDK source (build time only): official release tarball, see
# conandata.yml xorg_server entry + conanfile.py _setup_xorg_sdk.
xorg_server_sdk:
  version: "21.1.15"
  source: "https://www.x.org/releases/individual/xserver/xorg-server-21.1.15.tar.xz"
  generation: "in-recipe (tarball configure with all DDX disabled -> real generated xorg-server.h/dix-config.h + meson install_data SDK header set)"
  abi_videodrv: "25.2"

patches_applied:
  - "0001-configure (E011: remove umask 077 from config.status temp-dir creation for HMDFS)"
  - "0002-config.guess (E007: HarmonyOS system identification -> aarch64-unknown-linux-ohos)"
  - "0003-config.sub (E007: accept linux-ohos kernel-OS combination and ohos* OS family)"

knowledge_gained:
  - "Official freedesktop release tarball ships all pre-generated autotools files (configure/Makefile.in/config.guess/config.sub) — the GitLab auto-generated archive does not; using the official tarball removes the need for ~26 'pre-generated file' patches"
  - "config.guess on OHOS: uname -s returns 'HarmonyOS' (kernel 'HongMeng Kernel') — needs an explicit HarmonyOS case branch emitting aarch64-unknown-linux-ohos; the compiler-probe fallback also fails because `umask 077 && mktemp -d` creates an HMDFS dir that is unwritable for its owner (E011)"
  - "config.sub (autoconf 2.71 era, kernel-os split format) needs THREE changes: ohos-linux triplet block, ohos* in the OS family list, linux-ohos* in the kernel-OS validation case — missing the last one yields 'Kernel linux not known to work with OS ohos'"
  - "configure.ac hard-requires pkg-config 'gbm >= 10.6' whenever glamor is enabled (default) — gbm comes from mesa which does not exist on OHOS, so --disable-glamor is mandatory (EXA/KMS paths unaffected). With glamor off every gbm symbol use in the driver is USE_GLAMOR-guarded out; the remaining <gbm.h> include in radeon_dri3.c is satisfied by a documented stub header in the generated sdkdir (no gbm code linked)"
  - "xorg-server is not published to the conan registry (R36 gap), but every DDX driver needs its SDK headers + xorg-server.pc. Solution (same as merged xf86-video-fbdev): generate the SDK in-recipe from the official xorg-server tarball — run the tarball's own autotools configure with ALL DDX disabled (--disable-xorg --disable-xvfb ... --disable-glx --disable-dri), which needs only published deps (pixman, xorgproto protos, xtrans, libxau, libxkbfile, libxshmfence + nettle for --with-sha1), then harvest config.status's generated xorg-server.h and the meson install_data SDK header set"
  - "The autotools xorg-server configure only AC_DEFINEs XORG_VERSION_CURRENT/XSERVER_LIBPCIACCESS/XORGSERVER/XCONFIGFILE/__XSERVERNAME__ inside the XORG-enabled section while meson emits them for the SDK regardless — the recipe completes those 5 defines in the generated xorg-server.h after harvest (values from the pinned tarball)"
  - "OHOS clang does not read stdin implicitly: plain 'clang -E' fails with 'no input files', breaking the xorg-server configure's XORG_PROG_RAWCPP probes (${RAWCPP} < conftest.c). A 'cpp' wrapper script (exec $CC -E -x c - \"the @ args\" — an explicit stdin '-' input plus pass-through args) prepended to PATH satisfies AC_PATH_TOOL(RAWCPP, [cpp]); the wrapper is needed because clang in C mode predefines 'unix' as 1, so configure picks RAWCPPFLAGS=-undef correctly"
  - "xorg-server 21.1.15 configure lists 'xfont2' unconditionally in REQUIRED_LIBS — satisfied by a metadata-only xfont2.pc stub (a DDX driver SDK never uses xfont2; nothing builds or links against it)"
  - "AC_CHECK_LIB-based SHA1 detection needs the library path in LDFLAGS (-L<nettle libdir>); pkg-config env alone does not help raw link tests"
  - "xorg-server SDK headers flatten to sdkdir basenames (meson install_data semantics — 'bus/xf86Pci.h' installs as sdkdir/xf86Pci.h); conditional list appends in meson.build (build_xv -> xf86xv/xvpriv/xvmc + Xext's xvdix/xvmcext, build_xace -> xace/xacestr, build_xinerama -> panoramiX*, build_mitshm -> shmint) must be included for a full SDK"
  - "configure.ac also hard-requires 'pciaccess >= 0.8.0' (conan package libpciaccess/0.19 — pc module name differs, alias synthesized) and 'libdrm_radeon' — conan's libdrm package merges all components into one libdrm.pc, so the recipe synthesizes a libdrm_radeon.pc with the package's real paths"
  - "X server SDK headers (compiler.h) do #include <pixman.h> — pixman's include path is not carried by any pkg-config module the driver queries, injected into CFLAGS explicitly (also carried via xorg-server.pc Requires.private: pixman-1)"
  - "Driver modules export atiModuleData/radeonModuleData (XF86ModuleData -> XF86ModuleVersionInfo with MODINFOSTRING1=0xef23fdc5/MODINFOSTRING2=0x10dc023a); inside a PIC .so the pointer members are R_AARCH64_RELATIVE relocations, so an ELF-level test must resolve them from .rela.dyn"
  - "OHOS/musl dlopen binds eagerly (RTLD_LAZY is effectively ignored, verified on-device): a standalone program cannot dlopen an X driver module — its xorg-server symbols only exist in the server process"
  - "E074: make -j1 to avoid HMDFS jobserver fifo EPERM"

# 上游测试清点 (R51): 源码树只有 src/ man/ conf/, Makefile.am 无 check/TESTS
# 目标 — 上游无独立测试套件; test_package 用 check_module.c 在 ELF 层复现
# X server 模块加载器对驱动模块的识别校验 (入口符号 + 版本信息记录)。
upstream_tests: none

# Dependency status (2026-09-17, all verified via conan download -r=ohpcd).
# Single string per repo precedent; per-dependency details in dependency_notes.
dependency_status: "all conan requirements published; xorg-server has no conan recipe — its SDK is generated in-recipe from the official 21.1.15 tarball (see xorg_server_sdk above), so there is no R36 gap"

dependency_notes:
  xorg-server: "NOT_PUBLISHED as a conan recipe — SDK generated in-recipe from the official 21.1.15 tarball (see xorg_server_sdk above); switching to a conan xorg-server require once published is a drop-in change"
  libdrm: "PUBLISHED as 2.4.133 (2.4.121 never published; requirement bumped to the published version)"
  libpciaccess: "PUBLISHED as 0.19"
  pixman: "PUBLISHED as 0.46.4.3"
  xorgproto: "PUBLISHED as 2025.1"
  xtrans: "PUBLISHED as 1.6.0 (xorg-server SDK configure input, build time only)"
  libxau: "PUBLISHED as 1.0.11 (xorg-server SDK configure input, build time only)"
  libxkbfile: "PUBLISHED as 1.1.3 (xorg-server SDK configure input, build time only)"
  libxshmfence: "PUBLISHED as 1.3.3 (xorg-server SDK configure input, build time only)"
  nettle: "PUBLISHED as 3.10.2.1 (SHA1 provider for the xorg-server SDK configure, build time only)"
