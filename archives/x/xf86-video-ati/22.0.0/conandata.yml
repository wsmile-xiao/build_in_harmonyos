# conandata.yml — xf86-video-ati 22.0.0
# X.Org ATI/Radeon video driver (ati_drv.so + radeon_drv.so loadable modules)
#
# Source: official freedesktop.org release tarball.  It ships the full set of
# pre-generated autotools files (configure, Makefile.in, aclocal.m4,
# config.guess, config.sub, ltmain.sh, ...), so the recipe never needs
# autoconf/automake at build time.  (The previous attempt in PR #6349 used the
# GitLab auto-generated archive, which lacks those files and led to 29
# "pre-generated file" patches, most of which were autoconf temp-file garbage.)

sources:
  url: "https://xorg.freedesktop.org/archive/individual/driver/xf86-video-ati-22.0.0.tar.xz"
  sha256: "c8c8bb56d3f6227c97e59c3a3c85a25133584ceb82ab5bc05a902a743ab7bf6d"

# xorg-server SDK source (build-time only, not packaged): the official
# release tarball of the X server whose SDK headers (xorg-server.h,
# xf86*.h, ... + xorg-server.pc) the driver compiles against.  xorg-server
# is not yet published to the conan registry (R36), so the recipe runs the
# tarball's own configure with every DDX disabled to generate the real SDK
# config headers — see conanfile.py _setup_xorg_sdk.  Same approach as the
# merged xf86-video-fbdev recipe.
xorg_server:
  url: "https://www.x.org/releases/individual/xserver/xorg-server-21.1.15.tar.xz"
  sha256: "841c82901282902725762df03adbbcd68153d4cdfb0d61df0cfd73ad677ae089"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "Remove umask 077 from the config.status temp-dir creation (E011: on HMDFS a 0700 temp dir becomes unwritable for its owner, configure dies while writing config.status)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "HarmonyOS system identification: uname -s returns HarmonyOS, add a case branch emitting aarch64-unknown-linux-ohos (E007)"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "Accept the linux-ohos kernel-OS combination and the ohos-* OS family (E007)"
    patch_type: "portability"
