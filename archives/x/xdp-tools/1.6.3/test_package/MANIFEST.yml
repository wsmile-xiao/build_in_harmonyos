package: xdp-tools/1.6.3
homepage: "https://github.com/xdp-project/xdp-tools"

# 上游测试套件存在性（全树清点，source-scan）
upstream_tests_exist: true
upstream_test_total: 113
upstream_test_count_method: source-scan

upstream_test_audit:
  source_tarball: "xdp-tools-1.6.3.tar.gz (official release asset, sha256 b4c30d10147e71059c118aea17f415fd986b709c4600201f85fef0b6f4c8cb47)"
  build_system: "自定义 shell configure + GNU Make；lib/testing/test_runner.sh 驱动各工具 tests/test-*.sh"
  scanned_for:
    - "全树 8 个 tests/test-*.sh 的 ALL_TESTS（grep '^ALL_TESTS='，含 4 个无 bpftool 时不构建的工具）"
    - "lib/testing/test_runner.sh（通用 runner：EUID=0、unshare -n -m、mount -t bpf）"
    - "xdp-filter/tests/test_basic.py + test_slow.py 的 unittest 方法（def test_）"
  scan_result: "全树注册用例 68 个 / 8 个脚本：lib/libxdp 10 + xdp-filter 11 + xdp-loader 8 + xdp-dump 15 + xdp-bench 13 + xdp-forward 6 + xdp-monitor 1 + xdp-trafficgen 4（bpftool 可用时全部可构建）。xdp-filter/tests/ 另有 unittest 方法（test_basic.py + test_slow.py，实际执行 45 条，含继承自 XDPCase 的方法），不在 ALL_TESTS 注册内。合计 113。"
  reason: "test_runner.sh 的 check_prereq() 要求 EUID=0、unshare -n -m、mount -t bpf /sys/fs/bpf 以及 capinfos/ethtool/ip/ping/sed/tc/tcpdump/timeout/tshark/nft/socat/ndisc6/arping；OHOS 无 BPF syscall（SIGSYS 拦截）且无这些工具，故配方不把 make test 放进 build()（否则 CI 必红）。上游测试改在 x86_64 Linux 原生（WSL2 内核，root）真实执行，见 upstream_execution。"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "bash lib/testing/test_runner.sh <tests/test-*.sh>"

upstream_execution:
  channel: "x86_64 Linux native (WSL2 kernel 6.18.33.2-microsoft-standard-WSL2), root"
  command: "make test; make -C xdp-filter test TESTS='test_python_basic test_python_slow'"
  discovered: 113
  executed: 113
  passed: 107
  failed: 5
  skipped: 1
  pass_rate: "107/113 (94.7%)"
  failures:
    - "xdp-forward test_flowtable: WSL kernel CONFIG_NF_FLOW_TABLE not set"
    - "xdp-bench test_xsk_drop/test_xsk_tx + xdp-trafficgen test_xsk_udp: AF_XDP -u uses MAP_HUGETLB; WSL nr_hugepages capped at 6x2MB"
    - "xdp-dump test_capt_pcap: capture timing flaky (passed on a rerun, 108/113 best)"
  skipped:
    - "lib/libxdp test_xsk_non_privileged: skipped by design when running as root"

