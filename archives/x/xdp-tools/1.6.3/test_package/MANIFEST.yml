# test_package 中自带的测试（消费者视角验证，OHOS 可运行）
test_package_tests:
  - file: test.sh
    description: "断言 3 个产物可执行，并运行不触碰 BPF syscall 的入口：xdp-loader/xdp-filter 的 `help` 与 `load --help`（子命令 CLI 无 --version）、xdpdump 的 --help/--version；共 9 断言，任一失败即 exit 1"
    command: 'bash test.sh <sbin/xdp-loader> <sbin/xdp-filter> <sbin/xdpdump>'

assertion_count: 9
