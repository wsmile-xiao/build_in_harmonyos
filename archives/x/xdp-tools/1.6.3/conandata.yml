# conandata.yml — xdp-tools 1.6.3 (source: xdp-tools official release asset)
# 官方 release 资产由 mkarchive.sh 用 git archive 把 libbpf 子模块一起打包（自包含）。
# R39/PF7：只写官方源；镜像回退由 CI 自动处理，不手写镜像前缀。
sources:
  url: "https://github.com/xdp-project/xdp-tools/releases/download/v1.6.3/xdp-tools-1.6.3.tar.gz"
  sha256: "b4c30d10147e71059c118aea17f415fd986b709c4600201f85fef0b6f4c8cb47"

patches:
  "1.6.3":
    - patch_file: "patches/0001-lib-testing-test-tool.c.patch"
      patch_description: "test-tool.c: OHOS/musl libc <netinet/if_ether.h> defines struct ethhdr unconditionally while the kernel UAPI also defines it; set __UAPI_DEF_ETHHDR=0 (glibc libc-compat equivalent) to keep one definition"
      patch_type: "portability"
    - patch_file: "patches/0002-lib-util-util.c.patch"
      patch_description: "lib/util/util.c uses secure_getenv unguarded; configure reports no support on OHOS/musl, so add the same portable AT_SECURE fallback as lib/libxdp/compat.h"
      patch_type: "portability"
    - patch_file: "patches/0003-xdp-dump-xdpdump.c.patch"
      patch_description: "xdpdump.c: OHOS/bionic <linux/sysinfo.h> (via pcap) defines struct sysinfo without the libc interop guard of <sys/sysinfo.h>; skip the UAPI copy"
      patch_type: "portability"
    - patch_file: "patches/0004-headers-linux-compiler.h.patch"
      patch_description: "vendored linux/compiler.h: include compiler-gcc.h after _TOOLS_LINUX_COMPILER_H_ is set (moved out of compiler_types.h)"
      patch_type: "portability"
    - patch_file: "patches/0005-headers-linux-compiler_types.h.patch"
      patch_description: "do not pull compiler-gcc.h unconditionally: OHOS/bionic sysroot linux/stddef.h includes compiler_types.h, making the tools guard fire"
      patch_type: "portability"
    - patch_file: "patches/0006-headers-linux-if_link.h.patch"
      patch_description: "sockaddr_storage redefinition: linux/socket.h (via linux/netlink.h) vs sys/socket.h; platform-independent self-guard (E119 pattern)"
      patch_type: "portability"
    - patch_file: "patches/0007-headers-xdp-parsing_helpers.h.patch"
      patch_description: "OHOS/bionic UAPI exposes the UDP header as struct __kernel_udphdr and moves struct udphdr to libc-only <netinet/udp.h>; restore the UAPI name for bpf targets"
      patch_type: "portability"
    - patch_file: "patches/0008-lib-libxdp-compat.h.patch"
      patch_description: "secure_getenv fallback must not use musl-internal libc.secure; use getauxval(AT_SECURE)"
      patch_type: "portability"
    - patch_file: "patches/0009-lib-libxdp-tests-test_utils.h.patch"
      patch_description: "tests use secure_getenv too; include compat.h for the portable fallback"
      patch_type: "portability"
    - patch_file: "patches/0010-lib-util-params.h.patch"
      patch_description: "lib/util/params.h: <linux/in.h> pulls sysroot linux/socket.h, whose sockaddr_storage redefines the one from sys/socket.h on OHOS/bionic; include sys/socket.h first and guard _UAPI_LINUX_SOCKET_H + typedef __kernel_sa_family_t (same pattern as libbpf netlink.c)"
      patch_type: "portability"
