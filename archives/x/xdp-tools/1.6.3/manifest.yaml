  - "0008-lib-libxdp-compat.h.patch"
  - "0009-lib-libxdp-tests-test_utils.h.patch"

knowledge_gained:
  - "OHOS/bionic UAPI 把 linux/udp.h 的 struct udphdr 改成 struct __kernel_udphdr，struct udphdr 只在 libc 的 netinet/udp.h；bpf 目标不能引 libc 头，需在 headers/xdp/parsing_helpers.h 用 HAVE_OHOS_BPF 补回"
  - "OHOS libc netinet/if_ether.h 无条件定义 struct ethhdr，与 linux/if_ether.h 冲突：在 TU 顶部置 __UAPI_DEF_ETHHDR=0"
  - "OHOS libc sys/sysinfo.h 与 linux/sysinfo.h 都定义 struct sysinfo：用 _LINUX_SYSINFO_H 跳过 UAPI 版本"
  - "configure 只在 vendored-libbpf 分支探 pcap，走系统 libbpf 时需配方显式注入 libpcap 的 -I/-L"
  - "无 bpftool 时上游只编 xdp-filter/xdp-loader/xdpdump（4 个 skel 工具被上游跳过）"
  - "lib/util/params.h 的 <linux/in.h> 经 sysroot 拉入 linux/socket.h，与 sys/socket.h 的 sockaddr_storage 冲突（真机原生构建触发；-I headers 改不了 sysroot 的 <linux/in.h>）：TU 顶部先 include sys/socket.h 并置 _UAPI_LINUX_SOCKET_H + typedef __kernel_sa_family_t（E119/libbpf netlink.c 同源）"

