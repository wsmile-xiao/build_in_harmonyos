software: xdp-tools
display: "xdp-tools"
description: "XDP/eBPF 用户态命令行工具集（xdp-loader / xdp-filter / xdpdump）"
category: networking
homepage: "https://github.com/xdp-project/xdp-tools"
license: "GPL-2.0-only AND LGPL-2.1-only AND BSD-2-Clause"
build_system: custom

ohos_adaptation:
  key_points:
    - "手写 shell configure + GNU Make；libbpf 探针全部是编译+链接，交叉编译友好（无需 can_run）。"
    - "BPF 对象用 clang -target bpf 编译，XDP 程序经 m4/ld -r --format=binary/llvm-objcopy 内嵌。"
    - "优先系统 libbpf/1.5.1（FORCE_SYSTEM_LIBBPF=1）；libpcap/1.10.6 由配方显式注入 -I/-L。"
    - "无 bpftool 时上游只构建 xdp-filter/xdp-loader/xdpdump 三个工具（上游既定行为）。"
    - "9 个 portability 补丁处理 OHOS UAPI/libc 头差异（ethhdr、sysinfo、__kernel_udphdr、secure_getenv）。"
  common_dependencies:
    - libbpf/1.5.1
    - libpcap/1.10.6

versions:
  "1.6.3":
    status: built
    build_date: "2026-09-25"
    conan_ref: "xdp-tools/1.6.3"
