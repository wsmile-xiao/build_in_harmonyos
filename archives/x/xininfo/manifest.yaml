software: xininfo
display: "xininfo"
description: "X11 多显示器布局信息查询命令行工具（Xrandr + Xinerama）。"
category: utility
homepage: "https://github.com/DaveDavenport/xininfo"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只有裸 Makefile（无 configure/无 autotools），PREFIX/BUILD_DIR 均可用命令行变量覆盖，配方不改上游 Makefile"
    - "上游 make install 不可用：install 规则依赖 md2man-roff 生成 manpage，且设备 PATH 无 install(1) ⇒ 配方内显式 copy 落盘"
    - "依赖 x11/xinerama/xrandr 全部经 pkg-config 解析（Makefile L58-59），.pc 由 conan 依赖包自带的 lib/pkgconfig 提供"
    - "产物 ELF 必须 binary-sign-tool 自签（E077），否则内核拒绝执行"
  common_dependencies:
    - libx11
    - libxrandr
    - libxinerama

versions:
  "0.14.11":
    status: built
    build_date: "2026-09-25"
