software: xininfo
version: "0.14.11"
status: built
build_date: "2026-09-25"
conan_ref: "xininfo/0.14.11"
build_system: makefile

source:
  url: "https://github.com/DaveDavenport/xininfo/archive/refs/tags/0.14.11.tar.gz"
  sha256: "53a9fc4df54d36fd2640c7a65f90c345ed7306e24d3a3a27629b12fb858aed5b"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  make_arguments:
    - "make -j1 all BUILD_DIR=<conan build_folder>/obj PREFIX=<conan package_folder>"
  dependencies:
    - libx11/6.4.0 (ohpcd 已发布，提供 x11.pc)
    - libxrandr/1.5.5 (ohpcd 已发布，提供 xrandr.pc)
    - libxinerama/1.1.6 (ohpcd 已发布，提供 xinerama.pc)
  cc: clang
  cxx: n/a

patches_applied: []

knowledge_gained:
  - "上游 make install 在 OHOS 不可用（md2man-roff 与 install(1) 双缺），配方 package() 显式 copy 落盘"
  - "裸 Makefile 用命令行变量覆盖 BUILD_DIR/PREFIX，即可同时做到「产物不落源码树」与「编译期烧死的 MANPAGE_PATH 指向包内真实安装路径」，不必改上游 Makefile"
  - "依赖 .pc 直接取 conan 依赖包自带的 lib/pkgconfig（libx11/libxrandr/libxinerama 均 buildenv_info.append_path PKG_CONFIG_PATH），PKG_CONFIG_PATH 作用域注入兜底"
  - "E077：产物 ELF 必须 binary-sign-tool 自签（.codesign），签名在 copy 进包前完成 ⇒ 包内字节与签名同源"
