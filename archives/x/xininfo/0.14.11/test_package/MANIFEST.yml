# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xininfo/0.14.11
homepage: "https://github.com/DaveDavenport/xininfo"

# 上游源码审计：0.14.11 官方 GitHub tag archive 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码树 (xininfo-0.14.11, 官方 GitHub tag archive 解包后全树)"
    reason: "全树仅 6 个文件：.gitignore / LICENSE / Makefile / doc/xininfo.1 / doc/xininfo.markdown / source/xininfo.c。无 tests/、test/、t/ 目录，无任何测试源文件（find -type f 计数=6）。"
  - source: "Makefile（唯一构建描述文件，115 行）"
    reason: "目标只有 all(L66) / install(L96) / clean(L98) / indent(L103) / dist(L106)，无 check 目标、无 test 目标、无 TESTS 变量（grep -n TESTS Makefile 无输出）。"
  - source: "上游仓库元数据"
    reason: "GitHub 无 Releases（api /releases/latest -> 404），仅 1 个 tag 0.14.11；仓库无 CI 配置目录（.github/ 不在 tarball 内）。"
  - conclusion: "上游 0.14.11 未提供自动化测试；由 test_package 以消费者视角真实执行打包二进制，做 6 条确定性断言（ELF 架构 / .codesign 签名同源 / -h 帮助路径 / 无 X server 确定性错误路径 / X11 三库链接与符号可用性 / manpage 产物完整性）。"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# 上游无 check/test 目标，无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无官方测试套件；验证手段为 test_package 对打包二进制的真实执行。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xininfo.sh
    description: "真实执行打包的 xininfo 二进制：A1 AArch64 ELF 可加载、A2 产物含 .codesign 自签段(E077)、A3 '-h' 走 help()→execlp(man) 确定性失败路径且 rc=0、A4 无 X server 时命中 XOpenDisplay 失败路径 rc=1 + 'cannot open display!'、A5 libX11/libXrandr/libXinerama 进入 DT_NEEDED 且 XOpenDisplay/XRRGetScreenResources/XineramaIsActive 在该闭包内可解引用、A6 manpage 安装完整"
    command: "bash test_xininfo.sh"

# 测试断言总数 (test_package 消费者断言；上游注册用例数=0)
assertion_count: 6
