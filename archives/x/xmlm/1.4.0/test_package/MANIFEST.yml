# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: xmlm/1.4.0
homepage: "https://erratique.ch/software/xmlm"

# 上游测试注册点（pkg/pkg.ml 的 Pkg.test 条目）
upstream_check_command: "ocaml pkg/pkg.ml build && ocaml pkg/pkg.ml test"
upstream_test_in_build: true
upstream_test_command: "ocamlopt -I src src/xmlm.cmxa test/<t>.ml -o <t>.exe && ./<t>.exe"

# 上游实际运行的测试程序（4 个 Pkg.test 条目；build() 中编译并执行）
upstream_tests:
  - file: test/test.ml
    description: "解码器断言：属性值空白折叠（decoder attribute stripping），成功打印 All tests succeeded."
    command: "ocamlopt -I src src/xmlm.cmxa test/test.ml -o test.exe && ./test.exe"
  - file: test/test_tree.ml
    description: "Xmlm.output_tree 树输出（输出 ol/li 片段，exit 0）"
    command: "ocamlopt -I src src/xmlm.cmxa test/test_tree.ml -o test_tree.exe && ./test_tree.exe"
  - file: test/xhtml.ml
    description: "XHTML 1.1 实体表模块（编译+初始化，exit 0）"
    command: "ocamlopt -I src src/xmlm.cmxa test/xhtml.ml -o xhtml.exe && ./xhtml.exe"
  - file: test/examples.ml
    description: "文档示例（lucy/XML 解析示例代码，编译+初始化，exit 0）"
    command: "ocamlopt -I src src/xmlm.cmxa test/examples.ml -o examples.exe && ./examples.exe"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_xmlm.ml
    description: "消费者程序：xmlm.cma/cmxa 字节码+原生双路径，解码断言、编码转义断言与 encode->decode 往返"
    command: "ocamlc xmlm.cma test_xmlm.ml && ocamlrun; ocamlopt xmlm.cmxa test_xmlm.ml && ./test_xmlm.exe"
  - file: test_ohos_e2e.ml
    description: "鸿蒙特有 e2e：设备文件系统写 XML -> Channel 流式解析 -> 断言 -> 重编码 -> 再解析"
    command: "ocamlopt xmlm.cmxa unix.cmxa test_ohos_e2e.ml && ./test_ohos_e2e.exe"

# 断言总数：test_xmlm.ml 12 项 + test_ohos_e2e.ml 9 项 + xmltrip 冒烟 1 项 = 22
assertion_count: 22

# 上游测试统计（R51）
upstream:
  discovered: 4
  passed: 4
  modified_reason: "无源码修改；registry 无 topkg/ocamlbuild，build() 直接用 ocamlc/ocamlopt 复现上游 topkg 流水线并运行 4 个 Pkg.test 程序，全部 exit 0（test.ml 打印 All tests succeeded.）"

# 鸿蒙特有测试（rule12：至少一个完整消费者用例，真正跑通功能流程的端到端用例）
harmony_specific_test_count: 1
harmony_specific_tests:
  - file: test_package/test_ohos_e2e.ml
    kind: e2e_consumer_case
    label: "鸿蒙特有测试"
    description: >
      端到端消费者用例：在 OHOS 设备文件系统上写入 param 风格 XML 配置
      （product name/version/api、sdk path、含 &amp; 的文本），经 Xmlm
      (`Channel) 流式解析并断言 9 项（属性、实体解码），再 Xmlm.output
      重编码到第二个文件并重新解析验证元素数，最后清理临时文件。
    command: "sh test.sh <lib_dir> <ocaml_lib> <ocaml_bin> <bin_dir> <cc>  # 第 4 段用例"
    executed: true
    result: "ALL OHOS E2E PASSED (assertions=9 failures=0)"
