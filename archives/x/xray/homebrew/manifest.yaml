software: xray
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/homebrew/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "homebrew"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/XTLS/Xray-core/archive/refs/tags/v26.3.27.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: go

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=1 GOOS=linux GOARCH=arm64 GOPROXY=https://goproxy.cn,direct ~/usr/local/go1263/bin/go build -ldflags='-s -w -X github.com/xtls/xray-core/core.build=v26.3.27' -o ~/usr/local/bin/xray ./main/"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 项目版本注入：-X ldflags 只支持 string 类型变量，byte/uint8 不支持，需源码硬编码"
  - "xray 版本由 Version_x/y/z (byte) + build (string) 组成，-X 只可注入 build 变量"
  - "Go 项目 G0 干净构建需跳过 configure 步骤（无 configure 脚本）"
  - "GitHub 下载超时可用 ghfast.top 镜像绕过"
  - "Go 编译需设置 TMPDIR=/data/storage/el2/base/cache (R10)"
