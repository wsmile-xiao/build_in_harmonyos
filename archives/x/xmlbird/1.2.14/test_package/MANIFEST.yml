# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xmlbird/1.2.14
homepage: "https://birdfont.org/xmlbird.php"

# 上游测试命令 (xmlbird 无 autotools make check；上游用 doit test / test.py)
upstream_check_command: "python3 test.py"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test.py 运行 minimal 与 benchmark 两个测试可执行文件)
# 注: minimal/benchmark 的功能断言在 OHOS 上全部通过（Xml encoding passed 等），
#     但进程退出时 glib/gobject 运行时 SIGTRAP（平台限制，见 notes.md），
#     因此 conan build 不集成上游测试，改用 test_package 做消费者功能验证。
upstream_tests:
  - file: tests/minimal.vala
    source: xmlbird-1.2.14/tests/minimal.vala
    description: "XML 解析/校验/编码往返断言（最短测试集）"
    command: "./build/bin/minimal"
  - file: tests/benchmark.vala
    source: xmlbird-1.2.14/tests/benchmark.vala
    description: "XML 解析基准（大文件解析计时）"
    command: "./build/bin/benchmark"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：b_xml_parser parse/validate + tag/attr 遍历 + encode/decode 往返"
    command: "./test_xmlbird"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11