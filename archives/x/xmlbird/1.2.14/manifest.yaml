# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS 平台 glib 包自带代理 libintl.so.8（仅 g_libintl_* 符号）与 python3 依赖的真实 libintl 冲突：conanbuildenv 将 glib lib 放 LD_LIBRARY_PATH 最前导致 python3.12 启动即崩（Error 127），需为 python3/valac 分别建 wrapper 注入正确 LD_LIBRARY_PATH"
- "valac 默认 vapi datadir 为编译期硬编码 /usr/share/vala-0.56/vapi，OHOS 上不存在，需显式 --vapidir 指向 vala 包 share/vala-0.56/vapi"
- "glib-2.0.pc Requires.private libpcre2-8：pcre2 是 glib 传递依赖（skipped binary 无 package_folder），需从 conan 缓存 ~/.conan2/p/pcre2*/p/lib/pkgconfig 注入 PKG_CONFIG_PATH"
- "PkgConfigDeps 生成的修正版 .pc 必须 prepend 到 PKG_CONFIG_PATH 最前，否则 glib 包自带的 prefix=/ .pc 优先命中导致 include 路径错误"

patch_generation:
