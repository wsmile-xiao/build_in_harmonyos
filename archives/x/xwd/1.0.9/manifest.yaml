software: xwd
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.9"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.x.org/releases/individual/app/xwd-1.0.9.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: autotools
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - libxkbfile/1.1.3
  - libX11/1.8.12
  - xorgproto/7.0.31
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub need HarmonyOS platform patches"
  - "config.status mktemp permission issue on HarmonyOS: use pre-created tmp dir instead of mktemp"
  - "libxkbfile dependency needed, build with meson (autotools config.status also has same mktemp issue)"
  - "multiVis.c has unused-but-set-variable warning for 'count' variable"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/xwd-1.0.9.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/xwd-1.0.9.work
  source_orig_hash: bea5b27c87592260
  source_work_hash: 7af4549de4a14c50
  generated_at: '2026-06-02T10:58:22'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: platform_adaptation
    platform_only: True
    guard: 'E007'
  - file: 0002-config.sub.patch
    type: platform_adaptation
    platform_only: True
    guard: 'E007'
