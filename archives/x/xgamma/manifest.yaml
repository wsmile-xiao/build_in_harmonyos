# 软件级 manifest — xgamma
# 遵循 ARCHIVE-SPEC v2.0

software: xgamma
display: "xgamma"
description: "X11 gamma/亮度调节命令行工具（经 XFree86-VidModeExtension 查询或设置屏幕 gamma）"
category: utility
homepage: "https://gitlab.freedesktop.org/xorg/app/xgamma"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "X 客户端命令行工具：依赖全部走 ohpcd 已发布 conan 依赖（libx11/6.4.0 + libxxf86vm/1.1.5 + xorgproto/2025.1），不依赖编译环境预编译 X11 栈（CI worker 栈可能完全没有 libX11）"
    - "config.sub（1.0.8 自带）第 2070/2213 行已原生支持 ohos*/linux-ohos*，而 config.guess 出现 0 次 ohos ⇒ 显式 --host=aarch64-unknown-linux-ohos 绕开探测（同 xev/xeyes）"
    - "PKG_CHECK_MODULES(XGAMMA,[x11 xxf86vm xproto >= 7.0.17]) 走真实 pkg-config：把各依赖 lib/pkgconfig 与 share/pkgconfig（xorgproto 协议 .pc 所在）拼进 PKG_CONFIG_PATH 并作为 configure 命令行变量注入"
    - "build() 首步 _prepend_toolchain_path()（E540）：profile 的 CC/CXX 指向 /data/service/hnp/bin/clang，runner PATH 缺该目录时首个 make 直接 exit 127"
    - "无上游测试套件：test_package 以 9 条早于 XOpenDisplay 的命令行路径 + 只读查询路径无头真实执行；xgamma 会改真机 gamma，故断言设计成任何分支都不触达 XF86VidModeSetGamma"
  common_dependencies:
    - libx11
    - libxxf86vm
    - xorgproto

versions:
  "1.0.8":
    status: built
    build_date: "2026-09-24"
    source_url: "https://xorg.freedesktop.org/pub/individual/app/xgamma-1.0.8.tar.gz"  # 与 conandata 主 URL 同源（/pub/，规避 W3 投毒；见 notes.md）
