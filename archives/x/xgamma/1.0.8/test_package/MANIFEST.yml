# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: xgamma/1.0.8
homepage: "https://gitlab.freedesktop.org/xorg/app/xgamma"

# 上游源码审计（hmbs 硬门禁）：xgamma 1.0.8 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am"
    reason: "仅声明 bin_PROGRAMS = xgamma 与 SUBDIRS = man；无 TESTS / check_PROGRAMS / check-local 自定义规则，make check 无任何用例。"
  - source: "Makefile.in"
    reason: "grep -nE '^[[:space:]]*(check|TESTS)' 仅命中第 824-825 行 'check-am: all-am' 与 'check: check-recursive'——automake 无条件生成的样板规则，展开后不执行任何测试程序；全文无 TESTS 变量赋值。"
  - source: "meson.build"
    reason: "仅 executable('xgamma', [config_h,'xgamma.c'], dependencies: deps) + custom_target('xgamma.man')；无 test() 调用。"
  - source: "configure.ac"
    reason: "仅 AC_CHECK_FUNCS([strtof])、PKG_CHECK_MODULES(XGAMMA,[x11 xxf86vm xproto >= 7.0.17]) 与 AC_CONFIG_FILES；无测试相关宏、无 AC_CONFIG_TESTDIR。"
  - source: "源码树 / xgamma.c"
    reason: "发布包目录仅 man/（Makefile.am/Makefile.in/xgamma.man），无 tests/ 或 test/ 目录，无 *_test 源文件；xgamma.c 行首锚定 grep -cE '^[[:space:]]*assert\\(' = 0，无任何运行时断言型用例。"
  - conclusion: "上游未提供自动化测试套件；由 test_package 真实执行被测二进制（9 条命令行路径，含 gamma 取值域与参数互斥的领域逻辑校验）验证。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_xgamma.sh
    description: "真实执行 xgamma 的 9 条命令行路径并逐条对可观察行为（退出码 + 上游源码逐字错误串）断言。前 8 条全部早于 xgamma.c 第 202 行 XOpenDisplay 返回，无需 X server：(1) -version 与 (2) --version 校验 PACKAGE_STRING 'xgamma 1.0.8' 且退出码 0（第 126-129 行）；(3) -help 校验 usage banner 且退出码 0（第 130-132 行）；(4) 非法选项 -nosuchopt 校验 'unrecognized argument' + 非 0 退出（第 190-193 行）；(5) -gamma 0.05 与 (6) -gamma 99.0 校验 GAMMA_MIN/GAMMA_MAX 取值域拒绝，并断言错误串打印出边界 0.100/10.000（第 144-149 行）；(7) -gamma 与 -rgamma 同给校验互斥串 'cannot set both -gamma and -rgamma'（第 154-155 行）；(8) -gamma 缺值校验 'requires an argument'（第 139-140 行）。第 (9) 条为裸执行的只读查询路径：源码第 245-249 行 else 分支注释 'Not changing gamma, all done' 证明该路径只 XF86VidModeGetGamma 读、永不调用 XF86VidModeSetGamma，本条仅在本机确认无可达 X server（DISPLAY 未设置且 /tmp/.X11-unix/X* 不存在）时执行，断言上游第 203-204 行逐字串 'unable to open display' + 非 0 退出；若存在可达 display 则记 skipped（不猜服务端 VidMode 扩展状态），任何分支都不会改动真机 gamma——安全红线。运行期 xgamma 链接 conan 依赖 libXxf86vm/libX11，其 DT_NEEDED 闭包（libXext/libxcb/libXau/libXdmcp）经 conanrun 环境 LD_LIBRARY_PATH + test_package 从依赖包取实体 .so 绝对路径 LD_PRELOAD 注入（HMBS [stale_runtime_library]）双重保证运行期寻库；脚本以 HMBS 注入 SHELL=/bin/sh 执行（HMBS [shell_getcwd]，POSIX sh 兼容，同 xev/xeyes 已过门禁模式）。"
    command: "$SHELL test_xgamma.sh <package>/bin/xgamma <LD_PRELOAD_libs>"

# 口径：9 条 test_package 用例；20 = 9 处退出码判定 + 11 处输出串逐字判定
# （推导命令见 notes.md「五维测试数字账本」N_consumer 行）
test_package_test_count: 9
upstream_test_count: 0
assertion_count: 20

# 内存占用（手册/05 ⓓ：构建前评估峰值 RSS 并登记 max_rss_mb）
# 工具：$HOME/Desktop/huawei/经验文档/tools/memcap-run.py（同步仓 tools 目录）。
# 订正：本节旧文曾声明「本机构架未提供 memcap-run.py」——不成立，当时只在 worktree
# 的 scripts/ 与 ci/ 下找过，未覆盖同步仓路径。本轮已用该工具真跑 --probe 取实测值。
# 测法：复刻 conan test_package 成功那次的运行期环境（LD_PRELOAD 取 conan-create.log
# 第 160 行 recipe 算出的 6 项 .so 链；同一条链在 w3-local-ci.log 第 425 行亦有输出。
# LD_LIBRARY_PATH 取其 dirname + 包内 bin），先证
# xgamma -version 真跑出 'xgamma 1.0.8' rc=0，再探针：
#   xgamma -version            => MEMCAP[probe] peak=2MB budget=0MB rc=0
#   xgamma -help               => MEMCAP[probe] peak=1MB budget=0MB rc=0
#   xgamma -gamma 0.05         => MEMCAP[probe] peak=2MB budget=0MB rc=1（预期越界拒）
#   全量 9 条断言套件（本窗）  => MEMCAP[probe] peak=9MB budget=0MB rc=0
#                                     且 [summary] discovered=9 passed=9 skipped=0 failed=0
#   全量 9 条断言套件（W4 审计在同一台 B 机复刻同一运行期环境独立复跑，脚本未改）
#                              => MEMCAP[probe] peak=10MB budget=0MB rc=0
#                                     [summary] 与本窗逐项相同（9/9/0/0）
# 两次实测差 1MB 属 --probe 采样间隔抖动 => 登记取观测上界 10，不以单点 9 当硬上界。
# xgamma 不接受任何输入文件 => 输入规模恒 0，--scale 1、不外推。
max_rss_mb: 10
