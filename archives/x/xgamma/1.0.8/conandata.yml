# conandata.yml — xgamma 1.0.8
# 源码：X.Org 官方发布服务器 xorg.freedesktop.org 上的 1.0.8 官方 tarball。
# R39：下面两条 URL 都是 x.org 官方主机上的官方路径，不含任何镜像/代理前缀
#      （R39 禁的是"在官方 URL 前面手工拼一个代理域名"那种写法，本文件没有）。
# 注释刻意不写带 scheme 的地址形态：build_and_test.sh 的 Pre-download 用正则从
# conandata.yml 全文（含注释行）里抓 http/https 串去下载，写进注释会被当成源码
# 地址抓走 —— 既拖慢预下载，又会把本注释原地改写成本地绝对路径。
#
# 为什么把 /pub/ 排在 /archive/ 前面（规避 W3 预下载投毒；取证见 notes.md）：
#   预下载对命中「xorg.freedesktop.org 的 archive 或 releases 路径」这条正则的
#   URL 采取"镜像优先"策略，且成功判据只有 size>100 字节，既不校验 HTTP 状态码
#   也不校验 sha256。其内置的三个 x.org 镜像 URL 模板经实测全部返回 404 页面
#   （uwaterloo 162 字节 / mirrorservice 1796 字节 / ircam 236 字节），于是 404
#   页被当作 tarball 落盘、url 被改写成本地路径，source() 随即抛 sha256 hash
#   failed。/pub/ 是同一官方主机上的等价官方路径、不命中该正则，预下载会直连
#   官方、取到与 sha256 完全一致的 170632 字节真包。
#   两条 URL 实测返回字节完全相同的同一个官方包，互为可达性兜底。
#
# sha256 为官方包真值：curl 与 python（系统 CA、certifi 两套信任库）三方实测一致，
#   170632 字节 gzip；未因任何构建期报错改动过一个字符。

sources:
  url:
    - "https://xorg.freedesktop.org/pub/individual/app/xgamma-1.0.8.tar.gz"
    - "https://xorg.freedesktop.org/archive/individual/app/xgamma-1.0.8.tar.gz"
