# 版本级 manifest — xgamma 1.0.8
# 遵循 ARCHIVE-SPEC v2.0

version: 1.0.8
software: 'xgamma'

# 编译状态: published | built | failed | archived
# PR 阶段尚未由 release 流水线 upload 到制品仓，真实状态为 built
status: built

build_date: '2026-09-24'
build_system: autotools

# 源码信息
source:
  # 主 URL 用 /pub/：同一官方主机上不被 CI 预下载投毒正则命中的等价官方路径，
  # 与 /archive/ 返回字节完全相同的官方包（sha256 见下）。取证见 notes.md。
  url: 'https://xorg.freedesktop.org/pub/individual/app/xgamma-1.0.8.tar.gz'
  urls:
    - 'https://xorg.freedesktop.org/pub/individual/app/xgamma-1.0.8.tar.gz'
    - 'https://xorg.freedesktop.org/archive/individual/app/xgamma-1.0.8.tar.gz'
  sha256: '96ab71ea6a6791538324bb4d2014627816d83178a0ac79335d8c9ef25ce59f1d'
  tar_format: tar.gz

# 构建配置
build:
  system: autotools
  # configure_options 取自 reports/w3-local-ci.log 第 219 行的 configure RUN 行：9 项里 8 项逐字同序，
  # 仅末项 PKG_CONFIG_PATH 为概述而非逐字——日志原文是本机构建期展开的 8 段绝对路径冒号串
  # （6 段 */lib/pkgconfig + 2 段 */share/pkgconfig，内含 conan 依赖包 id），换机即失效故不入档。
  # 顺序与命令行一致（conan AutotoolsToolchain 口径）：--prefix=/ 是暂存根，
  # 实体落包靠 install 期 DESTDIR=<conan package_folder>，见同日志第 333 行
  # 日志原文（第 333 行）为 make install DESTDIR=…/b/xgamm77f7a41f0c33f/p。
  # 日志中 ${prefix} 各项外层的 shell 单引号只为防本地展开，不属于选项值，故未录入。
  configure_options:
    - '--prefix=/'
    - '--bindir=${prefix}/bin'
    - '--sbindir=${prefix}/bin'
    - '--libdir=${prefix}/lib'
    - '--includedir=${prefix}/include'
    - '--oldincludedir=${prefix}/include'
    - '--build=aarch64-unknown-linux-gnu'
    - '--host=aarch64-unknown-linux-ohos'
    - 'PKG_CONFIG_PATH=<conan host 依赖的 lib/pkgconfig + share/pkgconfig 拼接>'
  dependencies:
    - 'libx11/6.4.0'
    - 'libxxf86vm/1.1.5'
    - 'xorgproto/2025.1'
    - 'libxcb/1.16 (run)'
    - 'libxau/1.0.11 (run)'
  cc: clang
  cxx: ''

# 依赖闭包（W0 实证：精确 conan install --build=never 真下载到包，未用通配 list）
dependency_closure:
  - 'libxxf86vm/1.1.5 -> libx11/6.4.0 + libxext/6.4.0 + xorgproto/2025.1'
  - 'libx11/6.4.0 -> libxcb/1.16 + libxau/1.0.11 + libxdmcp/1.1.5 + xtrans/1.6.0'
  - 'run 期 DT_NEEDED: libXxf86vm.so.1 -> libXext.so.6 + libX11.so.6 ; libX11.so.6 -> libxcb.so.1 + libXau.so.6 ; libxcb.so.1 -> libXau.so.6 + libXdmcp.so.6'

# 补丁信息
patches_applied: []

# 资源占用（手册/05 ⓓ；测法见 notes.md「峰值 RSS」一节）
# 同一套件两次独立实测（均 budget=0MB rc=0、[summary] 9/9/0/0）：
#   本窗 memcap-run.py --probe            => MEMCAP[probe] peak=9MB
#   W4 独立审计复刻同一运行期环境重跑交付版脚本 => MEMCAP[probe] peak=10MB
# 差 1MB 属 --probe 采样间隔抖动 => 登记取观测上界 10（不以单点 9 当硬上界）。
# （单条 xgamma 进程 1-2MB；xgamma 无输入文件，输入规模恒 0，故不外推）
max_rss_mb: 10

# 测试账本（五维，详见 test_package/MANIFEST.yml 与 notes.md）
test_ledger:
  # 口径：n_static / n_registered 是**上游**套件数（本包上游确无自动化测试，均为 0，见 w3-local-ci.log:498
  # 的 HMBS_UPSTREAM_TEST_RESULT executed:0）；n_executed / n_passed 记的是**本包实际执行的消费者套件**
  # 9 个用例（同 n_consumer，来源 w3-local-ci.log:496 的 HMBS_TEST_PACKAGE_RESULT discovered:9/passedCount:9）,
  # 不可读成'上游执行了 9 个'。n_assertion=20 为该脚本内 9 处退出码判定 + 11 处输出串判定的静态全量。
  n_static: 0
  n_registered: 0
  n_executed: 9
  n_passed: 9
  n_failed: 0
  n_skipped: 0
  n_consumer: 9
  n_assertion: 20
  uncovered: 'gamma 设置路径（XF86VidModeGetGamma/SetGamma 服务端往返，xgamma.c 第 209-265 行）需真实 X server + XFree86-VidModeExtension >= 2.0；且属真机显示副作用红线，本 test_package 不执行'

# 知识沉淀
knowledge_gained:
  - 'xgamma 仅链接 Xlib + XFree86-VidModeExtension（configure.ac PKG_CHECK_MODULES(XGAMMA,[x11 xxf86vm xproto >= 7.0.17])），无 Xt/Xmu/Xi/SM/ICE，比 xev 更简单：conan 依赖 libx11/6.4.0 + libxxf86vm/1.1.5 + xorgproto/2025.1，无 vendored 库、无 x11include 头树、0 补丁（knowledge_ref: none）'
  - '构建系统选型：上游 tarball 同时带 autoconf 预生成 configure 与 meson.build。选 autotools——预生成 configure 使本机 autoconf/automake 版本无关紧要，显式 --host=aarch64-unknown-linux-ohos 绕开不识别 ohos 的 config.guess（自带 config.sub 第 2070/2213 行已支持 ohos*/linux-ohos*）；全部 X 应用先例（xev/xeyes/xterm/xclip）走 autotools（knowledge_ref: none）'
  - >-
    gamma 工具的安全测试口径：xgamma.c 的参数校验（取值域 GAMMA_MIN/GAMMA_MAX 第 144-149 行、互斥第 154-155 行、缺值第 139-140 行）全部发生在第 202 行 XOpenDisplay 之前，裸参数路径第 245-249 行注释 'Not changing gamma, all done' 只读不写 —— 故可在用户正在用的机器上真跑 9 条断言而**绝不留下被改掉的显示状态**；这比只测 --version 的无头先例覆盖到了包的真正领域逻辑（knowledge_ref: none）
  - '运行期 libXxf86vm.so.1 的 DT_NEEDED 闭包 = libXext.so.6 + libX11.so.6，libX11.so.6 再需要 libxcb.so.1 + libXau.so.6（libxcb → libXau/libXdmcp）；test_package 以 LD_PRELOAD 绝对路径链兜底（HMBS [stale_runtime_library]），conanrun 环境注入 LD_LIBRARY_PATH 双保险（knowledge_ref: E050）'
  - '上游无测试套件：Makefile.am 无 TESTS/check_PROGRAMS（Makefile.in 第 824-825 行 check/check-am 只是 automake 样板）、meson.build 无 test()、源码树无 tests/、xgamma.c 行首锚定 assert( 计数 0，MANIFEST.yml 显式审计 upstream_tests_exist: false（knowledge_ref: none）'
  - 'W3 本地 CI 模拟（ci/conan/build_and_test.sh 的 Pre-download）把 xorg.freedesktop.org 的 /archive/ 与 /releases/ 源按「三镜像优先、官方最后」取包，而三个镜像 URL 模板路径写错、实测对 xgamma 与同族 xeyes 一律 404（uwaterloo 162B / mirrorservice 1796B / ircam 236B），其成功判据只有 size>100 且不校验 HTTP 状态码与 sha256 ⇒ 404 页被当 tarball 投喂，source() 恒抛 sha256 hash failed（Computed 值 340c8464… 就是那张 162 字节 nginx 404 页的哈希，可反查投喂源）。规避=改用同一官方主机上不被该正则命中的等价官方路径 /pub/（与 /archive/ 字节完全相同），sha256 一字未改；只把 url 改成列表形态并不足以规避。（knowledge_ref: E299）'
