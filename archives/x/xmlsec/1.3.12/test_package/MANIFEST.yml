package: xmlsec/1.3.12
homepage: https://github.com/lsh123/xmlsec
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: tests/testKeys.sh
    source: xmlsec1-1.3.12.tar.gz/tests/testKeys.sh
    description: "Upstream key-management scenarios with OpenSSL (make check)"
    command: "make check"
    scenario_count: 32
  - file: tests/testDSig.sh
    source: xmlsec1-1.3.12.tar.gz/tests/testDSig.sh
    description: "Upstream XML signature scenarios with OpenSSL (make check)"
    command: "make check"
    scenario_count: 247
  - file: tests/testEnc.sh
    source: xmlsec1-1.3.12.tar.gz/tests/testEnc.sh
    description: "Upstream XML encryption scenarios with OpenSSL (make check)"
    command: "make check"
    scenario_count: 172
  - file: apps/unit_tests
    source: xmlsec1-1.3.12/apps/unit_tests
    description: "Run the upstream unit-test executable"
    command: "make check-unit-tests"
    scenario_count: 1
test_package_tests:
  - file: test_package.c
    description: "Initialize and shut down the xmlsec core library"
    command: "./test_package"
assertion_count: 2
