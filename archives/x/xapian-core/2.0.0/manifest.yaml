knowledge_gained:
  - "xapian-core 2.0.0 removed the chert backend; glass/honey/inmemory/remote are built and glass/honey need zlib"
  - "OHOS sysroot ships no uuid/uuid.h, so configure selects USE_PROC_FOR_UUID; /proc/sys/kernel/random/uuid is not readable on device, hence the /dev/urandom fallback"
  - "toybox sed accepts the GNU-only address form 0,/re/ without error but deletes every line, which silently produced a 0-byte include/xapian/version.h while configure still exited 0 (knowledge draft E543)"
  - "config.guess does NOT need the __OHOS__ libc probe on HarmonyOS: uname -s is already HarmonyOS and the probe cannot compile dummy.c under HMDFS umask 077 - the case branch alone yields aarch64-unknown-linux-ohos with zero platform macros in patches (PF5 clean)"
  - "honey is read-only in 2.0.0: build it with Database::compact(path, DB_BACKEND_HONEY | DBCOMPACT_NO_RENUMBER) from a glass database, and Xapian::version_string() no longer exists (use the XAPIAN_VERSION macro)"
