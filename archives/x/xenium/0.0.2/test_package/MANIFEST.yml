# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试说明:
#   xenium v0.0.2 的上游测试为 googletest 单测（test/ 下共 22 个 .cpp：顶层 16 个
#   含 main.cpp + test/reclamation/ 6 个回收方案测试文件），由 CMakeLists.txt 的
#   gtest 目标编译为单一可执行文件 ./gtest。上游无 `make check`/ctest 集成；
#   上游 CI (azure-pipelines.yml) 的命令为 `./gtest --gtest_output=xml`。

package: xenium/0.0.2
# 说明：本文件不写 homepage 字段——CI 预下载器会抓取包目录中出现的所有 URL，
# 该值与 sources.url 前缀相同会导致 file:// 重写撞车。

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake .. -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && make gtest && ./gtest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make gtest && ./gtest"

# 上游实际运行的测试程序
upstream_tests:
  - file: gtest (test/ 下共 22 个 .cpp 编译链接)
    source: xenium-0.0.2/test/
    description: "googletest 单测套件：并发数据结构（vyukov/harris_michael/michael_scott/kfifo/chase_deque/seqlock/left_right 等）与回收方案（hazard_pointer/hazard_eras/epoch_based/quiescent/stamp_it/lock_free_ref_count/generic_epoch_based），单次运行 63 个 test case、811 个 test"
    command: "./gtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "真实并发消费者测试：1) vyukov_hash_map<int,int>+generic_epoch_based 并发 emplace/try_get_value/erase（覆盖内存序修复路径）2) harris_michael_list_based_set+hazard_pointer 并发 emplace/contains 3) michael_scott_queue+lock_free_ref_count 生产者-消费者流水线（20000 项总和校验）；任一断言失败退出码非零"
    command: "./test_xenium"

# 测试断言总数 (近似值, 用于质量评估)
# test.cpp 运行时输出 checks=<精确值>（实际运行 263242，连跑 3 轮确定）：
#   vyukov 并发段 4线程×400轮×16键×(1+8+1..2) ≈ 263175；终态 64 + 单线程重插 3
assertion_count: 263242
