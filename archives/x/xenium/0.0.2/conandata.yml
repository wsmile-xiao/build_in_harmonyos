# conandata.yml — xenium 0.0.2
# 上游: github mpoeter/xenium 仓库 (tag v0.0.2)，URL 见下 sources 与 conanfile homepage

sources:
  url: "https://github.com/mpoeter/xenium/archive/refs/tags/v0.0.2.tar.gz"
  sha256: "05da5e15c4bd600ebd3b5e999a138f39fe8b1a322da899555cd66c4996168d0e"

patches:
  - patch_file: "patches/0001-xenium-detail-hardware.hpp.patch"
    patch_description: "aarch64 hardware_pause 使用 ARM yield 指令（对齐上游 main 分支官方实现）"
    patch_type: "portability"
  - patch_file: "patches/0002-xenium-detail-port.hpp.patch"
    patch_description: "port.hpp 增加 XENIUM_ARCH_ARM 架构检测（__aarch64__，对齐上游 main 分支）"
    patch_type: "portability"
  - patch_file: "patches/0003-xenium-impl-vyukov_hash_map.hpp.patch"
    patch_description: "回移上游官方内存序修复（upstream main 1c449ae9，PR #43）：vyukov_hash_map 查找路径 key 采用 acquire-load，插入/extract/erase 路径 key 采用 release-store；修复 aarch64 弱内存序下 parallel_usage 读到过期 value 的问题。另按上游 main b61075bc 补缺失的 #include <cassert>（libc++ 下 standalone 包含必需）"
    patch_type: "bugfix"
    patch_source: "https://github.com/mpoeter/xenium/commit/1c449ae953ce2a440b0d16c5ed1181d2754860ab"
  - patch_file: "patches/0004-xenium-impl-vyukov_hash_map_traits.hpp.patch"
    patch_description: "回移上游官方内存序修复（upstream main 1c449ae9，PR #43）：compare_trivial_key 改为接收已加载的值（加载点移至调用方以施加 acquire 语义），store_item 的 key 存储改用调用方传入的 memory_order"
    patch_type: "bugfix"
    patch_source: "https://github.com/mpoeter/xenium/commit/1c449ae953ce2a440b0d16c5ed1181d2754860ab"
  - patch_file: "patches/0005-xenium-reclamation-generic_epoch_based.hpp.patch"
    patch_description: "generic_epoch_based.hpp 使用 std::array 但未包含 <array>（上游 main 分支已包含该头文件）；libc++ 下 standalone 包含时编译失败"
    patch_type: "portability"
  - patch_file: "patches/0006-xenium-utils.hpp.patch"
    patch_description: "utils.hpp getticks 增加 XENIUM_ARCH_ARM 分支（cntvct_el0 计数器）并包含 detail/port.hpp（对齐上游 main 分支官方实现）；修复 aarch64 上 'Unsupported compiler' 编译错误"
    patch_type: "portability"
