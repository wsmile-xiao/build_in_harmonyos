# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: x86-simd-sort/5.0
homepage: "https://github.com/Intel/x86-simd-sort"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson setup -Dbuild_tests=true builddir && meson test -C builddir"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson.build() 编译 testexe 后直接运行 ./testexe --gtest_color=no"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test-qsort.cpp
    source: x86-simd-sort-5.0/tests/test-qsort.cpp
    description: "GTest typed tests: qsort/argsort/qselect/argselect/partial_qsort/comparator over uint16/int16/float/double/uint32/int32/uint64/int64"
    command: "./testexe"
  - file: tests/test-keyvalue.cpp
    source: x86-simd-sort-5.0/tests/test-keyvalue.cpp
    description: "GTest typed tests: keyvalue_qsort over 36 (key,value) type tuples"
    command: "./testexe"
  - file: tests/test-objqsort.cpp
    source: x86-simd-sort-5.0/tests/test-objqsort.cpp
    description: "GTest typed tests: object_qsort over 6 value types"
    command: "./testexe"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：模拟上层调用库安装导出的公开 API x86simdsort::qsort/argsort 并核对排序可观察结果"
    command: "./test_x86-simd-sort"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 90