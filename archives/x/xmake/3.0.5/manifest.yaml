software: xmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/xmake-io/xmake/releases/download/v3.0.5/xmake-v3.0.5.tar.gz"

  # 源码校验和
  sha256: "b947666281222f79e082283b6f84e68880c499305890f6ab8b03b8bac82456dc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统名称
  build_system: xmake.sh

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--generator=ninja"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - readline

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "xmake.sh configure 在 HMDFS 上生成损坏的构建文件（并发写入导致行交错）"
  - "需要手动创建 harmonyos 版本的 tbox.config.h"
  - "tbox posix/socket.c 不应单独编译，由 platform/socket.c 条件包含引入"
  - "xmake Lua 模块安装路径应为 share/xmake/ 而非 share/xmake/xmake/"
  - "需要链接时使用 --allow-multiple-definition 避免重复符号冲突"