software: xcb-util-wm
# 版本级 manifest 模板
# 文件位置: archives/x/xcb-util-wm/0.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"

# 构建系统
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://xorg.freedesktop.org/archive/individual/lib/xcb-util-wm-0.4.2.tar.xz"

  # 源码校验和
  sha256: "62c34e21d06264687faea7edbf63632c9f04d55e72114aa4a57bb95e4f888a0b"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-shared"
    - "--disable-static"

  dependencies:
    - libxcb/1.17.0
    - xorgproto/2025.1

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "This package ships two independent libraries with different ABIs: libxcb-ewmh (version-info 2:0:0) and libxcb-icccm (version-info 4:0:0), so they must be modelled as separate cpp_info components"
  - "Hard build dependency of Qt6's xcb platform plugin (libqxcb.so), which uses EWMH for window-manager interaction and ICCCM for WM protocols"
  - "The ICCCM size-hints setters operate purely on the caller's xcb_size_hints_t, so their flag bookkeeping is verifiable without an X server connection"
  - "xcb-icccm's set_position/set_size clear both the US_* and P_* flags before setting exactly one, so repeated calls are mutually exclusive rather than additive"
