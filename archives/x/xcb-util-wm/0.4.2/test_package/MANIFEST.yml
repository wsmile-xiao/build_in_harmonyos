package: xcb-util-wm/0.4.2
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxcb-wm"

# The release tarball ships no test programs: there is no tests/ directory and
# `make check` has no TESTS entries, so it is a no-op. The recipe still invokes
# `make check` so the build log carries a trace of the upstream check target.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []
upstream_test_notes: "xcb-util-wm 0.4.2 release tarball contains no upstream test programs; make check has no TESTS to run."

test_package_tests:
  - file: test.c
    description: >-
      Link libxcb-icccm and libxcb-ewmh (both shipped by this package) and
      exercise the ICCCM size-hints setters, which operate purely on the
      caller's xcb_size_hints_t. Asserts the flag bookkeeping and the stored
      values for set_position/set_size (including that US_* and P_* are
      mutually exclusive when the same setter is called twice with different
      user_specified arguments), set_min_size, set_max_size, set_resize_inc,
      set_base_size and set_win_gravity, and that earlier flags survive later
      setter calls. Also touches the EWMH connection struct to prove the ewmh
      component links and its atom table is usable. Runs without an X server.
    command: "ctest --output-on-failure"

assertion_count: 28
