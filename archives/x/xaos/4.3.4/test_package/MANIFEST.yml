# XaoS 4.3.4 upstream and consumer test declaration.
package: xaos/4.3.4
homepage: "https://github.com/xaos-project/XaoS"

# 上游没有注册的自动化测试。详细清点和命令证据见 reports/upstream-tests.md。
upstream_check_command: "ctest --test-dir <build-dir> -N"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_count: 0
upstream_test_pass_count: 0
upstream_test_status: "no_tests"
upstream_test_reason: "官方源码无 tests/ 或 test/ 目录，CMake 无 CTest 注册宏/用例；详细清点见 reports/upstream-tests.md。"
upstream_tests: []
upstream_test_inventory:
  tests_directory_count: 0
  test_directory_count: 0
  ctest_registered_count: 0
  xpf_example_files: 169
  helper_scan:
    command: "cd examples && sh ../tools/nametest.sh"
    files_scanned: 169
    duplicate_basenames: 0
    exit_code: 1
    exit_reason: "grep -v returned 1 because there were no duplicate-name matches; this is a data scan, not an upstream test case."

# test_package 消费者测试：真实执行 OHOS aarch64 XaoS，并检查生成 PNG 内容。
test_package_tests:
  - file: test_xaos.sh
    description: "在 HarmonyOS aarch64 真机运行包内 XaoS，以 Qt offscreen QPA 渲染 Mandelbrot 动画并检查 PNG。"
    command: "test_xaos.sh <package-root>"
    input: "xaos-smoke.xaf"
    operation: "XaoS -render ... -size 160x120 -renderframerate 1"
    output: "frame-000000.png"
    verification: "PNG 解码成功、尺寸为 160x120，且解码后像素值不全相同。"
  - file: verify_png.py
    description: "用 Python 标准库解析 PNG chunk、zlib 数据和 PNG 行过滤器，检查实际渲染图像。"
    command: "python3 verify_png.py <png> 160 120"
  - file: xaos-smoke.xaf
    description: "最小确定性 Mandelbrot 渲染输入。"

# 断言项：输出存在、PNG 签名/结构可读、尺寸匹配、图像像素非均匀。
assertion_count: 4
