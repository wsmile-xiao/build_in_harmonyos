# test_package/MANIFEST.yml
# Upstream test declaration for xvidcore 1.3.7

package: xvidcore/1.3.7
homepage: "https://www.xvid.com"

# xvidcore has no `make check` target in build/generic/
# Examples (xvid_bench, xvid_encraw, xvid_decraw) are in examples/ dir
# but require media input files and are not automated tests.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream does not ship automated tests
upstream_tests: []

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test_xvidcore.c
    description: "Verifies xvidcore library initialization and version check"
    command: "./test_xvidcore"

# Number of test assertions
assertion_count: 3
