# 版本级 manifest — xvidcore 1.3.7
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.3.7"
software: "xvidcore"
status: built
build_date: "2026-09-06"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.xvid.com/downloads/xvidcore-1.3.7.tar.gz"
  sha256: "abbdcbd39555691dd1c9b4d08f0a031376a3b211652c0d8b3b8aa9be1303ce2d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-build-generic-config-sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "config.sub 需要 patch 添加 linux-ohos 支持（maybe_os case + OS 列表）"
  - "config.guess 因 HarmonyOS tmp 目录权限问题无法运行，使用 --build/--host 显式指定三元组"
  - "config.status 生成的 mktemp -d './confXXXXXX' 在 HMDFS 上失败，需替换为预创建的可写目录"
  - "源码结构嵌套：build/generic/ 包含构建文件，../../src/ 包含源码"
  - "xvidcore 无上游自动化测试（make check），examples/ 有手动测试工具"

patch_generation:
  method: manual
  patches_count: 1

patch_classification:
  - file: 0001-build-generic-config-sub.patch
    type: portability
    platform_only: True
    guard: 'n/a'
