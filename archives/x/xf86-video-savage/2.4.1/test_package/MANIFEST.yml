upstream_test_command: "make check"
upstream_test_result: "No test suite (X.Org driver project has no self-test)"
test_type: "module_symbol_verification"
test_description: |
  Verifies that the savage_drv.so driver module is a valid ELF64
  AArch64 shared object and that its dynamic symbol table exports the
  symbols the X server loader requires: savageModuleData (module entry
  point), SAVAGE (DriverRec) and SavageGetBIOSModeTable (VBE code path
  from savage_vbe.c, proving the full driver code is compiled in).
  The module is a loadable X.Org plugin whose server symbols resolve
  at runtime, so the symbol table is inspected directly instead of
  dlopen()-ing without a running X server.
