software: xhook
display: "xhook"
description: "iQIYI PLT/GOT hook library for ELF (pure C) — redirect PLT calls like malloc in selected libraries"
category: instrumentation
homepage: "https://github.com/iqiyi/xhook"
license: "MIT"
build_system: "ndk-build (upstream) / recipe-driven clang"

ohos_adaptation:
  key_points:
    - "HiLog bridge replaces android liblog; LogLevel enum numerically identical to android_LogPriority"
    - "JNI bridge compiled out on OHOS; native C API is the consumer surface"
    - "musl compat: PAGE_MASK via sysconf, explicit signal.h, DT_ANDROID_* tag defines, -D_GNU_SOURCE with -std=c11"
  common_dependencies: []

versions:
  "1.2.0":
    status: built
    build_date: "2026-09-12"
