package: xhook/1.2.0
homepage: "https://github.com/iqiyi/xhook"

upstream_check_command: "ls libtest/jni libbiz/jni (ndk-build demo, no ctest/make test target)"
upstream_test_in_build: false
upstream_test_command: "ndk-build -C ./libxhook/jni && ndk-build -C ./libtest/jni && ndk-build -C ./libbiz/jni (Android demo only)"
upstream_tests: []
upstream_tests_note: >
  xhook 1.2.0 has NO test suite in the build system sense: the tarball ships
  an Android ndk-build demo (libtest = victim lib, libbiz = hook consumer,
  xhookwrapper = Android app) that only builds with the Android NDK and only
  runs inside an Android app process. There is no ctest/make test/check
  target and no assertions anywhere upstream. The demo's functional scenario
  (hook a PLT symbol in a dlopen'ed library and observe the redirect) is
  what the test_package below reproduces natively on OHOS.

test_package_tests:
  - file: hook_target.c
    description: "Victim library mirroring upstream libtest/jni/test.c: background thread calling malloc (PLT) in a loop; the OHOS counterpart of upstream's __android_log_print loop."
    command: "(built as libhooktarget.so, loaded by test_plt_hook)"
  - file: hook_main.c
    description: "Consumer mirroring upstream libbiz/jni/biz.c + xhookwrapper demo: xhook_register + xhook_refresh, asserts hook fires over time (before/after counters) and old_func captures the original malloc GOT value."
    command: "test_plt_hook"

assertion_count: 5
assertions:
  - "dlopen of victim library succeeds"
  - "xhook_register + xhook_refresh return 0"
  - "old_func captures original malloc address (GOT value)"
  - "hook replacement invoked at least once in 3s (before >= 1)"
  - "calls keep flowing (after > before) — PLT hook stays active"
