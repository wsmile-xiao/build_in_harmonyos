test_results:
  type: functional
  total: 2
  passed: 2
  failed: 0
  status: no-upstream-test-suite
  note: >
    Upstream ships no build-system test target (no ctest/make test): only an
    Android ndk-build demo (libtest/libbiz/xhookwrapper) that requires the
    Android NDK and an app process. test_package reproduces the demo's
    functional scenario natively on OHOS: victim lib (hook_target.c) calls
    malloc via PLT in a loop; consumer (hook_main.c) xhook_register's malloc
    in it, refreshes, and asserts the hook fires and old_func captures the
    GOT value. Both demo-equivalent tests pass on the OHOS PC runtime
    (aarch64 musl). Counted as 2 test_package tests (victim-lib scenario
    + consumer assertion run); 5 internal assertions, see
    test_package/MANIFEST.yml.

verification:
  local:
    - "Downloaded v1.2.0 tarball from github.com/iqiyi/xhook, sha256 verified"
    - "W0 dependency check: no external conan dependencies (libc + pthread + system HiLog NDK only)"
    - "All 7 upstream sources compile with OHOS clang -Wall -Wextra -Werror -std=c11 after patch"
    - "PLT hook functionally verified on-device: hook of malloc in dlopen'ed lib fires (before=2 after=4 over 5s), old_func captures original malloc (0x5b541cd72c)"
    - "Full public API surface exercised: xhook_register/xhook_ignore/xhook_refresh(sync+async)/xhook_enable_debug/xhook_enable_sigsegv_protection/xhook_clear all return 0"
    - "libhilog_ndk.z.so loadable at runtime on OHOS PC (dlopen OK); HiLog bridge exercised via xhook_enable_debug"

knowledge_ref: []

ohos_adaptation:
  key_points:
    - "android liblog -> HiLog: __android_log_print bridged to OH_LOG_Print; LogLevel enum values numerically identical to android_LogPriority (3..7)"
    - "JNI bridge (xh_jni.c) compiled out on OHOS - no art/libnativehelper; native consumers use plain C API"
    - "bionic-only DT_ANDROID_REL{,A,SZ,ASZ} elf.h tags locally defined for musl"
    - "PAGE_MASK derived from sysconf(_SC_PAGESIZE) - musl does not expose bionic's userspace PAGE_MASK"
    - "explicit #include <signal.h> for struct sigaction (bionic pthread.h pulls it in indirectly, musl does not)"
    - "-D_GNU_SOURCE needed with -std=c11 for full struct sigaction on musl"
  common_dependencies: []
