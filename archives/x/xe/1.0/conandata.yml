patches:
  - patch_file: "patches/0001-simple-test-platform-neutral-A.patch"
    patch_description: "Upstream test #18 of t/simple.t runs 'xe -A% echo -- % 1 2 3' and expects '-- 1'; OHOS's echo treats '--' as end-of-options and prints only '1'. Use printf (which does not reinterpret '--') so the case keeps its intent (verify -A% splitting and that '--' is part of the command) on any shell/echo."
    patch_type: "portability"
