# test_package/MANIFEST.yml
# xe 1.0.

package: xe/1.0
homepage: https://github.com/leahneukirchen/xe

upstream_tests_exist: true
upstream_test_audit: "t/*.t (6 TAP scripts) driven by prove with the tap3 helper; TAP plans sum to 63 assertions"
upstream_check_command: "prove -v t  (or make check)"
upstream_test_in_build: true
upstream_test_command: "prove -v t"

upstream_tests:
  - name: "errors.t"
    description: "argument/usage error paths (16 TAP assertions)"
  - name: "limits.t"
    description: "argument and buffer limits (2)"
  - name: "percent.t"
    description: "-A/-I percent/pattern handling (13)"
  - name: "regressions.t"
    description: "regression cases (1)"
  - name: "simple.t"
    description: "core behaviour: default/-N/-N0/{}/-I/-0/-a/-A/-f/-s/-j (27)"
  - name: "slow.t"
    description: "slow/IO cases (4)"

test_package_tests:
  - file: test_xe.sh
    description: "runs the installed bin/xe: default per-line, -N2 batching, -N0 single run, {} replacement, -0 NUL input, -n dry run"
    command: "sh test_xe.sh"

test_files:
  - path: "test_package/test_xe.sh"
    test_type: "R34"
    assertion_count: 6

test_package_test_count: 1
consumer_assertion_count: 6
assertion_count: 6
