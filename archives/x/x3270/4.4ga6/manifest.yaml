# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.4ga6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.4ga6"

# 软件名
software: "x3270"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/pmattes/x3270/archive/refs/tags/4.4ga6.tar.gz"

  # 源码校验和
  sha256: "bc2ad83b462902bf6f4a525d8f95577cdbe380e5a61f583782b0e415e13fbdc5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-x3270"
    - "--disable-tcl3270"
    - "--disable-wc3270"
    - "--disable-ws3270"
    - "--disable-wb3270"
    - "--disable-wpr3287"
    - "--disable-wx3270if"
    - "--disable-wplayback"
    - "--disable-wmitm"
    - "--disable-windows-lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ncurses/6.6
    - readline/8.3
    - expat/2.8.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Common-pr3287-configure.patch"
  - "0002-Common-x3270if.c.patch"
  - "0003-b3270-configure.patch"
  - "0004-c3270-configure.patch"
  - "0005-config.guess.patch"
  - "0006-config.sub.patch"
  - "0007-configure.patch"
  - "0008-ibm_hosts-configure.patch"
  - "0009-lib-configure.patch"
  - "0010-lib-w3270-configure.patch"
  - "0011-lib-w32xx-configure.patch"
  - "0012-mitm-configure.patch"
  - "0013-playback-configure.patch"
  - "0014-pr3287-configure.patch"
  - "0015-s3270-configure.patch"
  - "0016-tcl3270-configure.patch"
  - "0017-wb3270-configure.patch"
  - "0018-wc3270-configure.patch"
  - "0019-wmitm-configure.patch"
  - "0020-wpr3287-configure.patch"
  - "0021-ws3270-configure.patch"
  - "0022-wx3270if-configure.patch"
  - "0023-x3270-configure.patch"
  - "0024-x3270if-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需升级并打 OHOS 识别补丁（aarch64-unknown-linux-ohos）"
  - "E011: HMDFS 下 configure 脚本 umask 077→022 修复 config.status 临时目录权限"
  - "OHOS 下 ncurses.h 不间接引入 termios.h，需显式 include"
  - "AutotoolsToolchain 不注入依赖 include 路径，需用 extra_cflags/extra_ldflags 显式注入"
  - "x3270 顶层 Makefile 依赖源码树内相对路径，不支持 out-of-source 构建（layout 强制 in-tree）"
