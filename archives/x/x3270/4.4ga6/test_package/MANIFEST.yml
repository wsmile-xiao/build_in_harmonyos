# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: x3270/4.4ga6
homepage: "https://x3270.miraheze.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "python3 -m unittest discover -s s3270/Test -p 'test*.py'"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 -m unittest discover -s s3270/Test -p 'test*.py' -t ."

# 上游实际运行的测试程序（Python unittest 集成测试套件）
upstream_tests:
  - file: s3270/Test/testSmoke.py
    source: x3270-4.4ga6/s3270/Test/testSmoke.py
    description: "s3270 冒烟测试（NVT/3270/httpd/stdin 连接与协议）"
    command: "python3 -m unittest s3270.Test.testSmoke"
  - file: s3270/Test/testJson.py
    source: x3270-4.4ga6/s3270/Test/testJson.py
    description: "s3270 JSON REST 接口测试"
    command: "python3 -m unittest s3270.Test.testJson"
  - file: b3270/Test/testJson.py
    source: x3270-4.4ga6/b3270/Test/testJson.py
    description: "b3270 后端 JSON 接口测试"
    command: "python3 -m unittest b3270.Test.testJson"
  - file: pr3287/Test/testSmoke.py
    source: x3270-4.4ga6/pr3287/Test/testSmoke.py
    description: "pr3287 打印机仿真冒烟测试"
    command: "python3 -m unittest pr3287.Test.testSmoke"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_smoke.sh
    description: "消费者冒烟测试：对 s3270/c3270/pr3287 执行 --version，断言退出码 0（L0c 测试源文件）"
    command: "conan create 内 test() 阶段由 conanfile.py 调用执行"
  - file: conanfile.py
    description: "消费者测试入口：调用 test_smoke.sh 执行被测包二进制 --version"
    command: "conan create 内 test() 阶段运行"

# 测试断言总数 (近似值, 用于质量评估)
# 口径: 上游 AST 全量统计（各 */Test/ 目录 test*.py 中所有类的 test* 方法，
# 含 tcl3270/Test 5 个；含 s3270/b3270 各 1 个类内重复定义计数）
# 本地实际执行 357 个（tcl3270 组件禁用未运行 5 个；重复定义方法实际仅执行一次）
assertion_count: 364
