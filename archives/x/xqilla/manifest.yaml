# 软件级 manifest — xqilla
software: xqilla
display: "xqilla"
description: "XQuery/XPath 2.0 库与命令行工具（基于 Xerces-C）"
category: library
homepage: "https://xqilla.sourceforge.net/"
license: Apache-2.0

build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 工程，--with-xerces 指向 Conan 依赖包目录，不依赖系统 /usr/local"
    - "CXXFLAGS 固定 -std=c++14（上游使用 register 存储类，C++17 已删除）"
    - "上游无可自动执行的 make check 套件（tests/ 为需外部数据集的手动 runner），test_package 做消费者验证"
    - "OHOS 可执行文件需 binary-sign-tool 签名（主包 bin/xqilla 与测试 helper 均处理）"
  common_dependencies:
    - xerces-c

versions:
  "2.3.4":
    status: built
    build_date: "2026-09-20"
    conan_ref: "xqilla/2.3.4"
