# test_package/MANIFEST.yml — xqilla 2.3.4
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）

package: xqilla/2.3.4
homepage: "https://xqilla.sourceforge.net/"

# 上游测试套件存在性（经官方 tarball 实证审计确认无可自动执行套件）
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

# 上游测试审计（发布包: XQilla-2.3.4.tar.gz, 15439591 bytes,
# sha256 292631791631fe2e7eb9727377335063a48f12611d641d0296697e0c075902eb,
# 验证下载镜像 distfiles.macports.org, 共 3599 个成员）
upstream_test_audit:
  source_tarball: "XQilla-2.3.4.tar.gz (https://distfiles.macports.org/xqilla/XQilla-2.3.4.tar.gz)"
  source_sha256: "292631791631fe2e7eb9727377335063a48f12611d641d0296697e0c075902eb"
  build_system: "autotools (configure.in + Makefile.am, configure + make)"
  scanned_for:
    - "tests/ / test/ 目录"
    - "make check / make test 注册"
    - "ctest / meson test / gtest / pytest 注册"
    - "Makefile.am 中 check/test 目标"
  scan_result: "归档共 3599 项；tests/ 仅含 tests/xmark/xmark.cpp（需外部 benchmark_config_file 参数，手动 benchmark）和 tests/xqts/runner.cpp + tests/xqts/xqts_testsuite/errors.xml片段在内的 wrapper需外部 W3C XQTS 套件下载，不在 tarball 内）；Makefile.am 无 check 目标（唯一 .PHONY: test 无规则体，make -n check 无动作）；无 gtest/pytest/ctest 注册；7 个 noinst_PROGRAMS为示例/runner（xqtsRunner/xmarkRunner/simple-basic/simple-context-item/xqc-basic/xqc-context-item/compile-delayed-module），不是自动化断言套件。"
  reason: "xqilla 2.3.4 上游无可自动执行的测试套件：无 make check 目标、无测试框架注册，tests/ 为需外部数据集的手动 runner。按 no_tests 处理，由 test_package 真实执行被测库 API 与被测二进制验证。conanfile.py build() 内置 Makefile.am check 目标出现即失败的防腐败守卫。"

# 上游测试命令（无自动化套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用被测包）
test_package_tests:
  - file: test.cpp
    description: "真实调用 XQilla simple API：XQilla 构造初始化 Xerces/XQilla、parse X(1 to 100)、createDynamicContext、execute、迭代100 条 Item 并验证 first=1 last=100（上游 simple-basic 示例同源加固）"
    command: "./test_xqilla"
    assertions: 3
  - file: test_xqilla.sh（驱动脚本，4 个端到端用例）
    description: "真实执行已安装的 test_xqilla 与 xqilla 二进制：API 100 行输出校验、xqilla -h usage 非空、查询文件1 to 3 输出含 1/2/3、无参数必失败；计数器跟踪真实执行并输出 HMBS markers"
    command: "sh test_xqilla.sh <package>/bin/xqilla <build>/test_xqilla"
    assertions: 4

harmonyos_specific_tests: []

# 测试断言总数（驱动 4 用例 + test.cpp 3 内部断言）
assertion_count: 7
assertion_count_basis:
  api_output_lines: 1
  api_first_last: 2
  cli_help: 1
  cli_query: 1
  cli_noargs: 1
  driver_cases: 1
