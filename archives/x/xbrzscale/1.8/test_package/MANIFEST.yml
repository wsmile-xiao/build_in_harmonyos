# test_package/MANIFEST.yml — xbrzscale 1.8
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。

package: xbrzscale/1.8
homepage: "https://github.com/atheros/xbrzscale"

# 上游测试套件存在性（经审计官方 commit 归档确认）
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

# 上游测试审计（源码: commit ef36908831c058df7a202c8175d575a1fdfaf156，
# 官方 github.com/atheros/xbrzscale "#11 Updated xbrz to 1.8"）
upstream_test_audit:
  source_tarball: "xbrzscale-ef36908831c058df7a202c8175d575a1fdfaf156.tar.gz (https://github.com/atheros/xbrzscale/archive/ef36908831c058df7a202c8175d575a1fdfaf156.tar.gz)"
  source_sha256: "1927f7e5a07e3590b057a577b6d7610cf90562125ed8567fa06f58ba0698145b"
  build_system: "makefile（手写 Makefile，非 autotools/cmake/meson）"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "tests/ / test/ 目录"
    - "ctest / meson test / make check 注册"
    - "Makefile 中 test/check 目标"
  scan_result: "归档共 12 项：Makefile、Makefile-win、README.md、License.txt、.gitignore、xbrzscale.cpp、libxbrzscale.cpp、libxbrzscale.h、xbrz/xbrz.cpp、xbrz/xbrz.h、xbrz/xbrz_config.h、xbrz/README。无 tests/ 或 test/ 目录；无 gtest/pytest/ctest 注册；Makefile 目标仅 all/clean（模式规则 xbrz/xbrz.o、libxbrzscale.o、xbrzscale.o、libxbrzscale.a、xbrzscale），无 check/test 目标；xbrz/ 为纯算法实现（无测试驱动）。"
  reason: "xbrzscale 1.8 上游无测试套件：无 tests/ 目录、无任何测试框架注册、Makefile 无 check/test 目标。按 no_tests 处理，由 test_package 真实执行被测二进制与被测库 API 验证。"

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用被测包）
test_package_tests:
  - file: test_xbrzscale.sh（驱动脚本，9 个端到端用例）
    description: "真实执行已安装的 xbrzscale 二进制：无参数/非法 scale（1、7）退出码断言、8x8 PNG 夹具生成、2x/3x 文件放大与输出维度回读校验；计数器跟踪真实执行并输出 HMBS markers"
    command: "sh test_xbrzscale.sh <package>/bin/xbrzscale <helper-dir>"
    assertions: 9
  - file: test_lib.cpp（库 API 测试，6 条断言）
    description: "真实调用 libxbrzscale API：createARGBSurface 建 4x4 面、scale(2x/3x/4x) 维度与非零像素断言、surfaceToUint32/uint32toSurface 往返一致性"
    command: "./test_lib"
    assertions: 6
  - file: test_makepng.c / test_checkpng.c（PNG 夹具工具）
    description: "makepng 用 SDL2_image 写 8x8 RGBA 输入；checkpng 用 IMG_Load 回读并断言输出维度（16x16/24x24），两者均为驱动用例的真实执行环节"
    command: "./test_makepng in.png && ./test_checkpng out.png <W> <H>"

harmonyos_specific_tests: []

# 测试断言总数（驱动 9 用例 + test_lib 6 内部断言）
assertion_count: 15
assertion_count_basis:
  cli_validation: 3
  fixture_creation: 2
  file_scaling: 3
  lib_api_driver: 1
  lib_api_internal: 6
