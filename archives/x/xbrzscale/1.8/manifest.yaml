# 版本级 manifest — xbrzscale 1.8
# 文件位置: archives/x/xbrzscale/1.8/manifest.yaml

# 版本号
version: "1.8"

# Conan 引用
conan_ref: "xbrzscale/1.8"

# 软件名
software: "xbrzscale"

# 编译状态
# published | built | failed | archived
# 首轮工作树：配方与测试已完成，真机预检尚未执行，暂标 built；
# HMBS 真机 rule4 全部门禁通过后更新为 published。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "makefile"

# 源码信息
source:
  # 源码下载 URL（官方源 R39：上游 GitHub commit 归档）
  url: "https://github.com/atheros/xbrzscale/archive/ef36908831c058df7a202c8175d575a1fdfaf156.tar.gz"

  # 源码校验和（github/codeload 双 URL 同字节核验）
  sha256: "1927f7e5a07e3590b057a577b6d7610cf90562125ed8567fa06f58ba0698145b"

  # 压缩格式
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # sdl2/sdl2_image 为直接依赖；libpng/libjpeg-turbo/libwebp/zlib 为传递闭包
  # 的 CCI 竞争 pin（preflight 先查 conancenter，裸版本会落到 CCI cmake 工具边；
  # RREV 均为 ohpcd 实测单值，版本不变故 sdl2_image package_id 不变）
  dependencies:
    - sdl2/2.30.10.1
    - sdl2_image/2.6.0.1
    - libpng/1.6.58#d25df07aba0399181f60ee377e83d701
    - libjpeg-turbo/3.2.0#5ed08e7ff848da8fdf6b7bca74354560
    - libwebp/1.6.0#8b273a5128ee70c508671933b61288ec
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "上游 Makefile 硬编码 g++ 且无视 CC/CXX/CFLAGS/LDFLAGS，build() 按原步骤显式编译（同源文件、同 -std=c++17、同 -DNDEBUG、同 ar qc），编译器与 flags 全部来自 Conan conf 与 self.dependencies（R33）"
  - "sdl2_image 选用 libpng 后端的 2.6.0.1，保证工具核心 IMG_Load/IMG_SavePNG 路径，不依赖 STB 回退"
  - "上游无测试套件（no_tests，MANIFEST 审计）；build() 内置 Makefile check/test 目标出现即失败的防腐败守卫"
  - "静态 transitive 链接顺序：SDL2_image 先于 SDL2，SDL2main/SDL2test 不链接（上游自带 main）"
