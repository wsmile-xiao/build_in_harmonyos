# 软件级 manifest — xbrzscale
software: xbrzscale
display: "xbrzscale"
description: "基于 xBRZ 算法的图像放大命令行工具（含 libxbrzscale 静态库）"
category: utility
homepage: "https://github.com/atheros/xbrzscale"
license: GPL-3.0-only

build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 Makefile 工程：build() 按上游步骤显式编译，不依赖系统 g++ 与 sdl2-config"
    - "编译器与链接参数全部来自 Conan conf 与依赖包元数据（R33）"
    - "sdl2_image 必须选用 libpng 后端版本（2.6.0.1），保障 PNG 读写"
    - "上游无测试套件；test_package 做 9 个端到端用例 + 6 条库断言"
    - "OHOS 可执行文件需 binary-sign-tool 签名（主包与测试 helper 均处理）"
  common_dependencies:
    - sdl2
    - sdl2_image

versions:
  "1.8":
    status: built
    build_date: "2026-09-20"
    conan_ref: "xbrzscale/1.8"
