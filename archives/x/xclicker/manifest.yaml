software: xclicker
display: "XClicker"
description: "XClicker — 基于 GTK3 与 X11 XTest/XInput2 的图形化自动点击器"
category: gui
homepage: "https://github.com/robiot/xclicker"
license: GPL-3.0-only
build_system: meson

ohos_adaptation:
  key_points:
    - "上游构建系统为 Meson（根 Makefile 只是 meson+ninja 薄封装），裸 Makefile 不参与构建"
    - "显示栈：gtk/3.24.43（OHOS 侧为 broadway 后端，无原生 X11 显示后端）；点击动作由 libX11/libXi/libXtst 直接与 X 服务器交互"
    - "X11 家族在制品仓按 .so 主版本命名（libx11/6.4.0、libxi/6.1.0、libxtst/6.1.0），libx11/1.8.x 旧 ref 会拉入 6.4.0 造成版本冲突"
    - "gnome.compile_resources 需构建期工具 glib-compile-resources：制品仓 glib 包 bin 未签名，按 gtk/gdk-pixbuf 方案复制+签名并注入 meson [binaries]"
    - "MesonToolchain 的 [binaries] 缺 ar/ranlib，meson 探测 clang 默认 llvm-ar 失败，需注入绝对路径"
    - "上游 src/meson.build 的 executable() 未声明 install:true，meson install 不落地产物，package() 显式拷贝"
    - "上游无自动化测试入口（无 tests/、meson.build 无 test()、Makefile 无 check 目标）"
  common_dependencies:
    - "gtk/3.24.43"
    - "libx11/6.4.0"
    - "libxi/6.1.0"
    - "libxtst/6.1.0"

versions:
  "1.5.1":
    status: built
    build_date: "2026-09-24"
    conan_ref: "xclicker/1.5.1"
