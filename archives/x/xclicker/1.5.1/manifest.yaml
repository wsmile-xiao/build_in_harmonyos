# 版本级 manifest — xclicker 1.5.1
# 遵循 ARCHIVE-SPEC v3.0

version: "1.5.1"
software: "xclicker"
status: built
build_date: "2026-09-24"
conan_ref: "xclicker/1.5.1"
build_system: meson

source:
  url: "https://github.com/robiot/xclicker/archive/refs/tags/v1.5.1.tar.gz"
  sha256: "c044fc29ab818c3ba8b09e71fb7af0acd8722b9766b4a3174c937de62d74125d"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dwrap_mode=nodownload"
    - "-Dwarning_level=2"
  dependencies:
    - "gtk/3.24.43"
    - "libx11/6.4.0"
    - "libxi/6.1.0"
    - "libxtst/6.1.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "X11 家族制品仓按 .so 主版本命名（libX11.so.6.4.0 → libx11/6.4.0）；libxi/1.8.3 与 libxtst/1.2.5 会拉入 libx11/6.4.0，与 libx11/1.8.13 顶层声明冲突，需统一到 6.x 组"
  - "MesonToolchain 的 [binaries] 不含 ar/ranlib，meson 按 clang 默认探测 llvm-ar；conan 构建 env PATH 不含 SDK bin 时 configure 直接崩溃，需显式注入绝对路径 ref: E296"
  - "gnome.compile_resources 依赖 glib-compile-resources：制品仓 glib 包只签名 .so 不签名 bin，需复制+签名+注入 meson [binaries] ref: E527"
  - "上游 meson executable() 无 install:true，meson install 不落 bin，package() 需显式拷贝构建产物 ref: E481"
