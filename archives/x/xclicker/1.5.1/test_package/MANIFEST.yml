# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xclicker/1.5.1
homepage: "https://github.com/robiot/xclicker"

# ── 上游测试清点（R51）──
# xclicker 上游**无自动化测试入口**：
#   - 无 tests/ 目录
#   - meson.build / src/meson.build 无 test() 注册（仅 project/subdir/executable）
#   - 根 Makefile 无 test/check 目标（仅 build/run/version/release/install/
#     uninstall/deb/appimg/clean）
#   - 上游 CI 仅 docker.yml / release.yml（打包发布，无测试 job）
# 因此本包不声明 make check；上游真实入口为 Makefile 的 release 目标（构建）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_inventory:
  tests_dir: false
  meson_test_registrations: 0
  makefile_test_targets: []
  upstream_ci_test_jobs: []
  evidence: "find . -type d -iname '*test*' -> (无); meson.build 仅 project()+subdir('src'); Makefile 目标: build run version release install uninstall deb appimg clean"

upstream_tests: []

# ── test_package 自带的测试（消费者视角 + 鸿蒙特有平台检查）──
test_package_tests:
  - file: test.sh
    description: >-
      鸿蒙特有平台检查 + 真实运行：①ELF magic（od）②ELF machine=AArch64
      ③动态链接器=ld-musl-aarch64.so.1 ④存在 .codesign 签名段 ⑤NEEDED 含
      libgtk-3.so.0/libX11.so.6/libXi.so.6/libXtst.so.6 ⑥执行 `xclicker --help`
      退出 0 且输出用法（加载全部 NEEDED 动态库 → 运行期依赖闭包验证）
    command: "bash test.sh"
  - file: conanfile.py
    description: "断言包内 bin/xclicker 存在（1 断言），并以 conanrun 环境执行 test.sh"
    command: "conan test"

# 断言统计：test.sh 10 个断言（ELF 1 + 平台 3 + NEEDED 4 + 运行 1 = 9 项，
# 其中 readelf 不可用时平台类降级 SKIP）+ conanfile.py 1 个产物存在性断言
assertion_count: 10
