# 版本级 manifest — xeyes 1.3.1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.3.1"
software: "xeyes"

# 编译状态: published | built | failed | archived
# PR 阶段尚未由 release 流水线 upload 到制品仓，真实状态为 built
status: built

build_date: "2026-08-19"
build_system: autotools

# 源码信息
source:
  url: "https://xorg.freedesktop.org/archive/individual/app/xeyes-1.3.1.tar.gz"
  sha256: "d223283270488b1a6b408d0e97bd69a7704cf6a9596c0320035d807e63cdc084"
  tar_format: tar.gz

# 构建配置
build:
  system: autotools
  configure_options:
    - "--x-includes=/storage/Users/currentUser/usr/local/include"
    - "--x-libraries=/storage/Users/currentUser/usr/local/lib"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "PKG_CONFIG_PATH=/storage/Users/currentUser/usr/local/lib/pkgconfig"
    - "--with-present=no"
  dependencies:
    - "X11 预编译开发栈（/storage/Users/currentUser/usr/local）: libXi / libX11 / libXt / libXext / libXmu / xorgproto"
  cc: clang
  cxx: ""

# 补丁信息
patches_applied:
  - "patches/0001-Eyes.c-remove-unused-xlibint-include.patch: 移除 Eyes.c 未使用的 <X11/Xlibint.h>（libX11 私有头，预编译栈不保证提供；全文件 grep 确认无 Xlibint 符号被引用）"

# 知识沉淀
knowledge_gained:
  - "xeyes 1.3.1 自带新版 config.sub 已支持 ohos* / linux-ohos* 三元组（2070/2213 行），无需 config.sub 补丁"
  - "X11 应用复用预编译 X11 开发栈（/storage/Users/currentUser/usr/local，同 xterm/410）：--x-includes/--x-libraries + PKG_CONFIG_PATH + rpath"
  - "xrender/present 可选特性：configure 默认 try 语义会硬性 PKG_CHECK_MODULES，缺 .pc 需 --with-xrender=no / --with-present=no（generate() 按 .pc 探测）"
  - "xeyes -version/-help 在 XtAppInitialize 之前退出，无 X server 可真实执行，用于 test_package 无头验证"
  - "上游无测试套件（Makefile.am 无 check、meson.build 无 test()、无 test/ 目录），按守则显式审计声明 upstream_tests_exist: false"
  - "预编译 X11 栈只有 libXt.so 无 libXt 头文件（xterm/410 只链接从未 include），xeyes 是 Xt widget 应用，需 vendor libXt/libXmu/libXext/libXi/libXfixes/SM/ICE 头到配方 x11include/（30 文件），XEYES_CFLAGS 前置 -I + -DXTSTRINGDEFINES 走字符串字面量分支"
  - "HMBS install shim 只接受单文件两参调用（`[ $# -eq 2 ] || exit 64`），旧式 automake 批量安装（libICE install-iceincludeHEADERS 一次 `$(INSTALL_DATA) $$files dir`）必 Error 64；解法为 cp/mkdir install shim + 重定向生成 Makefile 的 INSTALL 变量（E182/E188，同 adms 2.3.7 / libgsf 1.14.58 / lzop 1.04 / libxcb 1.17.0.1）"
  - "libtool make install 产出的 .so 是符号链接链（libICE.so -> libICE.so.6 -> libICE.so.6.3.0），shutil.copy2 跟随链与源 samefile 抛 SameFileError；物化实体名前须先 os.unlink 掉 symlink 目标（真机实测，本地 Windows 无法复现需 hardlink 等价模拟）"
