# conandata.yml — xeyes 1.3.1
# 源码: X.Org 官方发布归档 (https://xorg.freedesktop.org/releases/individual/app/)
# R39: 官方正式源；sha256 与官方发布公告一致

sources:
  # 主库 xeyes
  xeyes:
    url: "https://xorg.freedesktop.org/archive/individual/app/xeyes-1.3.1.tar.gz"
    sha256: "d223283270488b1a6b408d0e97bd69a7704cf6a9596c0320035d807e63cdc084"
  # 真机预编译 X11 栈缺 libXt/libXi/libXmu（xterm/410 时代的"源码构建"库
  # 在栈重置后消失，当前栈仅剩 libX11/libXext）。按 E277 vendored 依赖
  # 模式，配方内从 X.Org 官方源构建这三个库并随包携带（同 clinfo 内建
  # OpenCL-ICD-Loader 先例）。sha256 均为官方发布公告值。
  libice:
    url: "https://xorg.freedesktop.org/archive/individual/lib/libICE-1.1.1.tar.gz"
    sha256: "04fbd34a11ba08b9df2e3cdb2055c2e3c1c51b3257f683d7fcf42dabcf8e1210"
  libsm:
    url: "https://xorg.freedesktop.org/archive/individual/lib/libSM-1.2.4.tar.gz"
    sha256: "51464ce1abce323d5b6707ceecf8468617106e1a8a98522f8342db06fd024c15"
  # xtrans 是源码分发包（Xtrans.h/Xtrans.c/transport.c 等位于归档根目录，
  # 非 X11/Xtrans/ 子目录）；libICE 的 icetrans.c 直接
  # #include <X11/Xtrans/transport.c>，libSM 的 sm_manager.c 引用
  # Xtrans.h，必须随包提供（仓库 xtrans/1.6.0 配方同款官方源）。
  xtrans:
    url: "https://xorg.freedesktop.org/archive/individual/lib/xtrans-1.6.0.tar.xz"
    sha256: "faafea166bf2451a173d9d593352940ec6404145c5d1da5c213423ce4d359e92"
  libxt:
    url: "https://xorg.freedesktop.org/archive/individual/lib/libXt-1.2.1.tar.gz"
    sha256: "6da1bfa9dd0ed87430a5ce95b129485086394df308998ebe34d98e378e3dfb33"
  libxi:
    url: "https://xorg.freedesktop.org/archive/individual/lib/libXi-1.8.1.tar.gz"
    sha256: "3b5f47c223e4b63d7f7fe758886b8bf665b20a7edb6962c423892fd150e326ea"
  libxmu:
    url: "https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.1.4.tar.gz"
    sha256: "3091d711cdc1d8ea0f545a13b90d1464c3c3ab64778fd121f0d789b277a80289"

patches:
  - patch_file: "patches/0001-Eyes.c-remove-unused-xlibint-include.patch"
    description: "移除 Eyes.c 未使用的 <X11/Xlibint.h>（libX11 私有头，预编译栈不保证提供；全文件 grep 确认无任何 Xlibint 符号被引用）"

