# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: xeyes/1.3.1
homepage: "https://gitlab.freedesktop.org/xorg/app/xeyes"

# 上游源码审计（hmbs 硬门禁）：xeyes 1.3.1 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am"
    reason: "仅声明 bin_PROGRAMS = xeyes 与 SUBDIRS = man；无 TESTS/check_PROGRAMS/check-local 目标，make check 无任何用例。"
  - source: "meson.build"
    reason: "仅 executable() + custom_target(man page)；无 test() 调用。"
  - source: "configure.ac"
    reason: "仅 PKG_CHECK_MODULES(XEYES/XRENDER/PRESENT) 与 AC_CONFIG_FILES；无测试相关宏或 AC_CONFIG_TESTDIR。"
  - source: "源码树"
    reason: "发布包无 tests/、test/ 目录，无 *_test 源文件（Eyes.c/xeyes.c/transform.c 为产品代码，仅含 2 处 assert 运行时检查）。"
  - conclusion: "上游未提供自动化测试套件；由 test_package 真实执行被测二进制（-version/-help）验证。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_xeyes.sh
    description: "真实执行 xeyes -version 校验版本输出（含 'xeyes 1.3.1'）+ xeyes -help 校验退出码 0（无需 X server，R34 实质执行被测包）。第 4 轮真机根因：xeyes 链接的预编译栈 libX11.so.6 运行时 DT_NEEDED 需 libxcb.so.1/libXau.so.6（设备仅有 .a）；主配方增加 libxcb/1.16 + libxau/1.0.11 的 conan run 依赖（ohpcd 已发布 OHOS armv8 binary），test_package 从依赖包取 .so 绝对路径经 LD_PRELOAD 注入测试命令（HMBS [stale_runtime_library] 建议），脚本以 HMBS 注入 SHELL=/bin/sh 执行（HMBS [shell_getcwd]，POSIX sh 兼容，同 xidle 已过门禁模式）"
    command: "$SHELL test_xeyes.sh <package>/bin/xeyes <LD_PRELOAD_libs>"

assertion_count: 2
