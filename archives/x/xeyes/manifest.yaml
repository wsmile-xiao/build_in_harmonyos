software: xeyes
display: "xeyes"
description: "X11 眼球跟踪演示程序（follow the mouse demo，使用 X SHAPE 扩展）"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/app/xeyes"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "X11 演示程序：依赖编译环境预编译 X11 开发栈（/storage/Users/currentUser/usr/local，同 xterm/410）"
    - "config.sub 已原生支持 linux-ohos 三元组（1.3.1 自带新版），无需 config.sub 补丁"
    - "xrender/present 可选特性：按 .pc 探测决定 --with-xrender/--with-present，避免 configure try 语义硬失败"
    - "无上游测试套件：test_package 以 xeyes -version/-help 无头真实执行（无需 X server）"
  common_dependencies: []

versions:
  "1.3.1":
    status: built
    build_date: "2026-08-19"
    source_url: "https://xorg.freedesktop.org/archive/individual/app/xeyes-1.3.1.tar.gz"
