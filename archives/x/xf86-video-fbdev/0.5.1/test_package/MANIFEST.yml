# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xf86-video-fbdev/0.5.1
homepage: "https://gitlab.freedesktop.org/xorg/driver/xf86-video-fbdev"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# xf86-video-fbdev is an X.Org driver module with no standalone test suite.
# The driver is tested by loading it in the X server.
upstream_tests:
  - file: src/fbdev.c
    source: xf86-video-fbdev-0.5.1/src/fbdev.c
    description: "Driver source file (compilation test)"
    command: "make"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "ELF validation test - verifies fbdev_drv.so is a valid AArch64 shared object"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
