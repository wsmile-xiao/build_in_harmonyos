# 软件级 manifest — archives/x/xrefresh/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（人读索引 + 版本索引；CI 不读）

software: xrefresh

display: "xrefresh"

description: "Forces the X server to repaint every window by flashing a full-screen override-redirect window over them"

category: system

homepage: "https://gitlab.freedesktop.org/xorg/app/xrefresh"

license: MIT

build_system: autotools

ohos_adaptation:
  key_points:
    - "上游预生成 configure：只打探测脚本补丁（config.guess + config.sub），不跑 autoreconf（鸿蒙机上 autotools 链常不可用）"
    - "config.guess 需加 *:HarmonyOS:*:* 分支输出 aarch64-unknown-linux-ohos（E007/E160）；该分支顺带短路掉会在 HMDFS 上写不进 dummy.c 的编译器探测路径"
    - "config.sub 必须三处齐补：ohos-linux 映射、OS 白名单 ohos*、kernel-OS 白名单 linux-ohos*（E007/E072/E122）；少第三处会报 'Kernel linux not known to work with OS ohos'"
    - "configure 写进 config.status 的临时目录引导要去掉 umask 077（E136）；实测唯一因果是 umask，改成绝对 $TMPDIR 无效"
    - "同一枚 configure 补丁还有第二个 hunk：把 ac_pwd 的 pwd 探测改成失败时回退环境变量 PWD（HMDFS 拒绝直接 getcwd()，E386）；只讲 umask 会漏掉这半"
    - "禁用 --build/--host 三元组绕过平台探测（R1/E205）：会把 native 构建误判成交叉编译，config.h 生成错"
    - "依赖只到 libX11/xproto：不需要 libXext，也不需要内建任何第三方库（区别于需要未发布 libXmu/xmuu 的 xhost）"
    - "PKG_CHECK_MODULES 走 XREFRESH_CFLAGS/XREFRESH_LIBS 逃逸口，不依赖 CI worker 的 pkg-config；xorgproto 的 xproto.pc 在 share/pkgconfig 而非 lib/pkgconfig"
    - "运行期闭包 libX11.so.6 → libxcb.so.1 → libXau.so.6 + libXdmcp.so.6，且已发布 libxcb.so.1 的 RUNPATH 写死构建机 .conan2 绝对路径 ⇒ 需 conanrun + LD_PRELOAD 双保险"
    - "源码取 xorg.freedesktop.org/archive 域；www.x.org/releases 在本机构建链路上 TLS 直接失败"
  common_dependencies:
    - libx11
    - xorgproto
    - libxcb
    - libxau
    - libxdmcp

versions:
  "1.1.0":
    status: built
    build_date: "2026-09-24"
    conan_ref: "xrefresh/1.1.0"
