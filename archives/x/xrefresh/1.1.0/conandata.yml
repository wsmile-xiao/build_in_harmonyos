# conandata.yml — xrefresh 1.1.0
#
# 源码 URL（R39 官方源）：X.Org 官方发布归档域。
# ★写成「列表」是有意的，不是风格问题：CI 预下载（ci/conan/build_and_test.sh 的
# get_mirrors()）只对**单值** url 做镜像改写，会把 xorg.freedesktop.org 换成了
# mirror.csclub.uwaterloo.ca 一类的镜像优先；同族实测这些镜像对 X app 包全 404，
# 而且预下载不校验 HTTP 状态码，404 页面会被当 tarball 存下 → sha256 必败。
# 列表形态下 get_mirrors() 不改写，全部候选都是官方域，由 conan 自己按序回退。
#
# 主域选型也是实测结论：本机构建链路上
# https://www.x.org/releases/... 会 TLS 失败（SAN 不匹配，curl http_code=000），
# 而 archive 域 200/163767B 可下；www.x.org 仍保留在后面作 fallback（CI 侧网络不同）。
# sha256 由本机真实下载的包算得（不是抄台账）。

sources:
  url:
    - "https://xorg.freedesktop.org/archive/individual/app/xrefresh-1.1.0.tar.gz"
    - "https://xorg.freedesktop.org/releases/individual/app/xrefresh-1.1.0.tar.gz"
    - "https://www.x.org/releases/individual/app/xrefresh-1.1.0.tar.gz"
  sha256: "cbf0d3ed80f03188841a96ceb20e615b40a006e3928be2e179d9d5a0ded639b2"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: 增加 *:HarmonyOS:*:* 分支，输出 aarch64-unknown-linux-ohos（E007/E160；同时让探测在撞 HMDFS 的 dummy.c 之前短路）"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: ohos-linux 映射 + OS 白名单 ohos* + kernel-OS 白名单 linux-ohos*（E007/E072/E122，缺第三处报 Kernel 'linux' not known to work with OS 'ohos'）"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: (1) config.status 的临时目录引导去掉 umask 077（E136；本机四向对照证明 umask 是唯一因果，改走 $TMPDIR 绝对路径并不能修好）；(2) ac_pwd 在 pwd 失败时回退 $PWD（HMDFS 会拒绝直接 getcwd()，E386 家族；同族已合并先例 archives/x/xeyes/1.3.1/conanfile.py）"
    patch_type: "portability"
