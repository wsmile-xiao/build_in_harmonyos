# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md

package: xrefresh/1.1.0
homepage: "https://gitlab.freedesktop.org/xorg/app/xrefresh"

# ── 上游测试清点（R51 三步法的第 1 步，全部在本机实测，不是"台账说没有"）──────
# "上游确无测试"必须附清点证据，故逐条列出取证命令与结论。
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am"
    evidence: "grep -nE '(^|[^a-z])(check|TESTS|check_PROGRAMS|check-local)' Makefile.am"
    reason: "全文只有 SUBDIRS = man、bin_PROGRAMS = xrefresh、xrefresh_SOURCES = xrefresh.c、MAINTAINERCLEANFILES、dist-hook，没有任何 TESTS/check_PROGRAMS/check-local 声明。"
  - source: "man/Makefile.am"
    evidence: "grep -nE 'TESTS|check' man/Makefile.am"
    reason: "空命中；子目录只装 man page。"
  - source: "configure.ac"
    evidence: "读全文"
    reason: "只有 AC_CHECK_FUNCS([strcasecmp]) 与 PKG_CHECK_MODULES(XREFRESH,[x11 xproto>=7.0.25])，无 AC_CONFIG_TESTDIR / 测试相关宏。"
  - source: "make -n check（configure 成功后实跑）"
    evidence: "explore/12-make-n-check.log，rc=0"
    reason: "展开的只有 automake 通用的 check-recursive 骨架（进入 man/ 再回本目录），无任何测试程序、无 am__TESTS。"
  - source: "make check（真跑，非 dry-run）"
    evidence: "explore/13-make-check.log，rc=0"
    reason: "man 子目录报 'Nothing to be done for check'，顶层同样无事可做 ⇒ 注册用例数 = 0。"
  - source: "源码树"
    evidence: "tar 内容清单：COPYING ChangeLog INSTALL Makefile.am Makefile.in README.md aclocal.m4 compile config.guess config.h.in config.sub configure configure.ac depcomp install-sh man missing xrefresh.c"
    reason: "无 tests/、test/ 目录，无 *_test/test_* 源文件；唯一产品源文件 xrefresh.c 无 assert/自测入口。"
  - conclusion: "上游未提供自动化测试套件（discovered=0），实质验证由 test_package 真实执行被测二进制承担（6 条自造断言，声明数 = 本机实测数）。"

# 上游测试命令：留空表示无（声明 0 用例，不谎称跑过 make check）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ── test_package 自带断言（消费者视角，真实执行被测包二进制）─────────────────
test_package_tests:
  - file: test_xrefresh.sh
    description: "6 条断言，全部执行包内 xrefresh 二进制且都落在 XOpenDisplay 之前的代码路径或运行期报错路径：-version rc=0+版本串、-help rc=0+usage、-v 缩写 rc=0、未知参数 rc=1+unrecognized argument、-delay 缺参 rc=1+requires an argument、无 DISPLAY rc=1+unable to open display。第 6 条同时是动态链接/运行期断言（须解析 libX11 的 XOpenDisplay/XDisplayName 才报得出该文案），并证明无头下不挂住（不可达 DISPLAY=:99 实测 rc=1，20s timeout 未触发；本脚本对每条都套 timeout，超时按失败计）。运行期寻库用 conanrun 的 LD_LIBRARY_PATH + 依赖包 .so 绝对路径 LD_PRELOAD 双保险（已发布 libxcb.so.1 的 RUNPATH 写死构建机 .conan2 路径）。"
    command: "$SHELL test_xrefresh.sh <pkg>/bin/xrefresh <LD_PRELOAD_libs>"

assertion_count: 6
