knowledge_ref:
  - E007   # config.guess 不识别 HarmonyOS → cannot guess build type
  - E072   # config.sub 三元组验证缺 ohos
  - E122   # config.sub kernel-OS 白名单缺 linux-ohos*
  - E136   # config.status 临时目录 umask 077 → Permission denied
  - E386   # HMDFS 拒绝直接 getcwd() → configure 的 ac_pwd 判定需回退环境变量 PWD（补丁 0003 第二 hunk）
  - E160   # config.guess HarmonyOS/HongMeng Kernel 分支
  - E205   # 不得用 --build/--host 绕过平台探测
  - E050   # HMDFS 符号链接物化不可靠（LD_PRELOAD 优先取实体 .so）

knowledge_gained:
  - "E136 的因果被四向对照实验收窄：同一目录同一 TMPDIR 下，umask 077 → 目录落成 drwx--S--- 且创建者自己写不进去；umask 022/不给 umask → drwxr-s--x 可写；**umask 077 + 绝对 $TMPDIR 仍然不可写** ⇒ 唯一因果是 umask 077，E136 现文案里'改用绝对 TMPDIR'那半是无效动作。"
  - "config.guess 的 HarmonyOS 分支加在顶层 case 开头即可顺带绕开 HMDFS dummy.c 坑：未打补丁时基线首错不是'猜不出'，而是 ./config.guess[1572]: can't create .../dummy.c: Permission denied，随后才报 cannot guess build type。"
  - "x.org 家族源码 URL 在本机必须用 xorg.freedesktop.org/archive 域：www.x.org/releases 直接 TLS 失败（curl http_code=000）。"
  - "conandata.yml 的 sources.url 写列表可让 CI 预下载 get_mirrors() 不改写域，避开镜像 404 页被当 tarball 存下的 sha256 必败坑。"
  - "已发布的 libxcb.so.1 的 RUNPATH 是构建机 .conan2 绝对路径 ⇒ 换 CONAN_HOME 后运行期必须靠 conanrun LD_LIBRARY_PATH + LD_PRELOAD 兜底。"

