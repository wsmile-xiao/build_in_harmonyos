# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.10.6.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.6.1"

# 软件名
software: "xrdp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  # ⚠ 必须是官方 make-dist **release 资产**：同版本的 git tag archive
  #   （/archive/refs/tags/）不含 libpainter/librfxcodec 的 submodule 内容，
  #   解压后为空目录、构建必败。见 notes.md 问题表 #1 与「路径 B 声明」按 `hit` 引用的既有条目
  #   （`DRAFT-yosys-0.66-tarball-empty-submodule-external-tool-wiring.kv` 的 :9/:19）。
  url: "https://github.com/neutrinolabs/xrdp/releases/download/v0.10.6.1/xrdp-0.10.6.1.tar.gz"

  # 源码校验和（本轮真机实测 sha256sum 核对一致）
  sha256: "2f7beb5a3b2529c8d72dc0df9b8cdca31ab0e0c14d1e3421210f5e6ec0ab3b75"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--disable-pam"
  # 2026-09-25 整改轮：可选重后端改为显式开关并逐个实测（不再交给 configure 静默关闭）
  - "--enable-pixman"
  - "--enable-openh264"
  - "--enable-fdkaac"
  - "--enable-fuse"
  # 以下三条本轮实做后按证据关闭，逐例根因见 notes.md「后端开关逐例结论」
  #   --with-imlib2=yes  实做→tests/xrdp 由 25/25 退到 13/27（USE_IMLIB2 会 #undef
  #                      USE_BUILTIN_LOADER，见 xrdp_bitmap_load.c:37-42）⇒ 撤回
  #   --enable-x264      制品 x264.pc Version=r3223 不满足上游数值下限 x264 >= 0.3.0
  #   --enable-neutrinordp  上游探测名是 FreeRDP 2 的 `freerdp`，本仓只有未发布的 3.26.0
  - "--with-systemdsystemunitdir=no"
  - "--disable-utmp"
  - "--build=aarch64-unknown-linux-gnu"
  - "--host=aarch64-unknown-linux-musl"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - openssl/3.5.8.1
  - check/0.15.2
  - cmocka/2.0.2
  - pixman/0.46.4.3
  - openh264/2.6.0
  - fdk-aac/2.0.3
  - libfuse/3.18.2
  # tool_requires（build 上下文，不进 host package_id）: bash/5.3
  # 本轮 W0：四个新依赖的发布态与 pkg-config 约束逐个实测（对照包 zlib/1.3.1 判绿），
  #   见 notes.md「后端开关逐例结论」表；imlib2/1.9.1 亦已发布（其传递依赖 libpng
  #   在 zlib/1.3.1.1 组合下需 --build=missing 本地构建），随 imlib2 一并撤下。

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-Makefile-in-drop-x11-tools.patch"
- "0002-configure-x11-optional.patch"
- "0003-verify_user-libc-shadow-db-compat.patch"
- "0004-sesrun-libc-getpass-compat.patch"
- "0005-sesman-tools-drop-noinst-tools.patch"
- "0006-sesman-drop-chansrv.patch"
- "0007-tests-xrdp-allow-macro-redefined.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "含 submodule 的包取官方 make-dist release 资产而非 git tag archive（本包 libpainter/librfxcodec）"
- "OHOS 无 X11 栈：顶层 SUBDIRS 里 waitforx 与 genkeymap 都是无条件 X11 消费者，需一并移出构建"
- "musl 无 shadow(5) API 与 getpass：verify_user.c 注入惰性回退；sesrun.c 注入 termios 回退；authtest/xcon 这类 noinst 诊断工具移出构建"
- "E386：profile [buildenv] 把 CONFIG_SHELL/SHELL 钉死 /data/service/hnp/bin/bash，该 bash 在 HMDFS 下 getcwd 间歇挂 → build() 内对聚合 env 脚本做文本替换路由到 tool_requires bash/5.3"
- "HMDFS umask 077 建的 confXXXXXX 临时目录不可写 → 主 configure 与内嵌子 configure 的 umask 改 022"
- "musl 忽略 DT_RUNPATH，且 check/0.15.2 fork 模式硬编 /tmp（只读）→ make check 期注入 LD_LIBRARY_PATH + LD_PRELOAD 路径重定向 shim"
- "CI L1d 是单行正则 self\\.run.*(echo|print|true)：取后台守护进程 PID 的 echo $! 会误判假测试，把命令行组装拆出该行即可"
- "ci/conan/build_and_test.sh 的 shebang 是 #!/usr/bin/zsh 且用 zsh glob 限定符，必须用 zsh 跑而非 bash"
- "本平台 poll(2) 的 nfds 上限实测 449（>=450 一律 ENOMEM）：上游测试把 nfds 直接取 RLIMIT_NOFILE 软限值（本机 32768）时必失败；抬高 rlimit 无效（nfds 随之变大），压低到 <450 才通过但会削弱被测语义 ⇒ 应如实报失败并给最小复现"
- "打开 xrdp 的 imlib2 后端等于关掉它的内建图像加载器：xrdp_bitmap_load.c:37-42 在 USE_IMLIB2 时 #undef USE_BUILTIN_LOADER，全部位图（含 BMP）改走 imlib2；本平台 imlib2 制品把 loader 目录编译成 //lib/imlib2（conan prefix=/ 且无 FHS），默认 err=4 NO_LOADER_FOR_FILE_FORMAT；IMLIB2_LOADER_PATH 指向包内 loaders 后独立复现可读 BMP，但 xrdp 的加载/缩放路径仍失败 ⇒ 判为不可启用"
- "conan 包的 test_package 里裸赋值 LD_LIBRARY_PATH 会覆盖 env="conanbuild"/conanrun 注入的依赖 lib 目录；引入新的共享依赖后必须改成追加式（musl 忽略 DT_RUNPATH）"
- "pkg-config 约束带数值下限时，制品版本串取上游 git tag（如 x264/r3223）会让 PKG_CHECK_MODULES 必失败，报错原文是 'Requested ... but version of ... is r3223' —— 属版本串口径问题，不得写成缺依赖"
- "conan 配方设了 cpp_info.set_property("pkg_config_name", ...) 时会改写 .pc 文件名：libfuse/3.18.2 提供的就是 fuse3.pc，故 xrdp --enable-fuse 可满足；判"有没有某名字的制品"要看 pkg_config_name，不能只看包名目录"

patch_generation:
  # method 说明：0001-0007 为「逐文件 difflib 生成」而非仓库标准 refresh-patch 产物（偏离 R3 口径），
  #   原因是 CI worker 无 autotools、补丁必须直接打在生成物 Makefile.in/configure 上；每条均已对 pristine
  #   树 `patch -p1 --dry-run` rc=0，且新集与原集产出的源码树 `diff -r` 完全一致（见 notes.md 源码修改节）。
  method: per-file-difflib
  # ⚠ 下列 source_*_dir / *_hash / generated_at 描述的是 2026-09-21 那版
  #   两补丁（Makefile.am/configure.ac + autoreconf）的旧探索树，已被本
  #   6 补丁方案取代。`ohc-run.py finish` 的 step[1/10] refresh-patch --auto
  #   会照那两棵旧目录重新生成补丁并删掉磁盘上的 6 个补丁 —— 详见 notes.md
  #   「注意事项」第 1 条，处理完旧目录前不要对本任务跑 finish。
  # ⚠ 09-23 更正：下面两棵旧探索树（2026-09-21 的两补丁 + autoreconf 方案）已从盘上移除，
  #   字段仅作历史留痕。`ohc-run.py finish` 的 step[1/10] refresh-patch --auto 会读这两个路径重生成
  #   补丁；路径不存在时该步报「无法定位源码目录」后跳过（09-23 12:04 实测），6 个补丁不再被覆盖删除。
  #   当前 6 补丁以 `02b9dfa33d` 起的提交为准。
  source_orig_dir: (deleted) /storage/Users/currentUser/builds/xrdp-0.10.6.1.orig
  source_work_dir: (deleted) /storage/Users/currentUser/builds/xrdp-0.10.6.1.work
  source_orig_hash: 7b02a31a6b2b009c
  source_work_hash: 7213b55d0bb0f753
  generated_at: '2026-09-23T12:04:28'
  patches_count: 7

patch_classification:
