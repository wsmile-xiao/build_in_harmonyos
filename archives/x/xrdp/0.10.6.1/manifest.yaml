    type: auto
    platform_only: True
    guard: 'n/a（只改生成物 Makefile.in 的子目录清单，不注入平台宏）'
  - file: 0002-configure-x11-optional.patch
    type: auto
    platform_only: True
    guard: 'n/a（只改生成物 configure 的报错分支，不注入平台宏）'
  - file: 0003-verify_user-libc-shadow-db-compat.patch
    type: auto
    platform_only: True
    guard: 'XRDP_LIBC_LACKS_SHADOW_DB（能力宏：配方对 getspnam(3) 单独做编译+链接探针，失败才定义，非操作系统名宏，符合 R8）'
  - file: 0004-sesrun-libc-getpass-compat.patch
    type: auto
    platform_only: True
    guard: 'XRDP_LIBC_LACKS_GETPASS（同上，getpass(3) 独立探针；回退以符号形式提供，未用 #define 覆盖 libc 名称）'
  - file: 0005-sesman-tools-drop-noinst-tools.patch
