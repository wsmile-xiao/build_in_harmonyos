# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xrdp/0.10.6.1
homepage: "https://github.com/neutrinolabs/xrdp"

# 上游测试命令 (make check; tests/ 下 5 个注册测试目标)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游注册的测试程序（libcheck 套件, 原子用例数按 START_TEST 静态清点）
upstream_tests:
  - file: tests/common
    source: xrdp-0.10.6.1/tests/common/test_common_main.c 等
    description: "common 库单测（test_common, libcheck, 141 个 START_TEST 用例）"
    command: "make check (test_common)"
  - file: tests/libipm
    source: xrdp-0.10.6.1/tests/libipm/test_libipm_main.c 等
    description: "libipm 单测（test_libipm, libcheck, 34 个 START_TEST 用例）"
    command: "make check (test_libipm)"
  - file: tests/libxrdp
    source: xrdp-0.10.6.1/tests/libxrdp/test_libxrdp_main.c 等
    description: "libxrdp 单测（test_libxrdp, libcheck, 13 个 START_TEST 用例）"
    command: "make check (test_libxrdp)"
  - file: tests/xrdp
    source: xrdp-0.10.6.1/tests/xrdp/test_bitmap_load.c, test_xrdp_egfx.c
    description: "位图/EGFX 测试（test_xrdp, 27 个 START_TEST 用例）：25 例经补丁 0007 后编译执行并全通过（kcheck5.log:495-501），另 2 例 test_png_load__blend_ok / test_jpg_load__ok 由 #ifdef USE_IMLIB2 条件注册、imlib2 关闭故不编译，详见 notes.md"
    command: "make check (test_xrdp)"
  - file: tests/memtest
    source: xrdp-0.10.6.1/tests/memtest/memtest.c
    description: "内存回归入口 memtest（1 个注册测试程序）"
    command: "make check (memtest)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_rdp_wire.c
    description: "消费者测试：起包内 xrdp 守护进程 → TCP 127.0.0.1:3389 → 发 X.224 CR TPDU → 断言 RDP 协商响应（含 xrdp-keygen 真实调用）"
    command: "./test_rdp_wire"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 216
