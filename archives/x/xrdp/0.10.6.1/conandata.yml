# conandata.yml — xrdp 0.10.6.1
# 源 = GitHub 官方 release 资产（make dist 制作，内嵌 libpainter/librfxcodec submodule 内容）。
# 注意：git tag archive（codeload）不含 submodule 内容，直接用会得到空目录（E425 系问题的另一解法，见 notes.md）。

sources:
  url:
    - "https://ghfast.top/https://github.com/neutrinolabs/xrdp/releases/download/v0.10.6.1/xrdp-0.10.6.1.tar.gz"
  sha256: "2f7beb5a3b2529c8d72dc0df9b8cdca31ab0e0c14d1e3421210f5e6ec0ab3b75"

patches:
  - patch_file: "patches/0001-Makefile-in-drop-x11-tools.patch"
    patch_description: "直接改生成物 Makefile.in：SUBDIRS/DIST_SUBDIRS 去掉 waitforx 与 genkeymap（OHOS 无 X11 栈，两者是唯一无条件参与构建的 X11 消费者：waitforx.c 与 genkeymap.c 均 include X11/Xlib.h，genkeymap 还链接 -lX11）；不触 .am，避免 autoreconf（CI worker 无 autotools）"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0002-configure-x11-optional.patch"
    patch_description: "直接改生成物 configure：AC_PATH_XTRA 后的 libx11/Xfixes/Xrandr 三处 as_fn_error 改为 no-op（OHOS 无 X11 时 X 变量为空继续），不触 configure.ac"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0003-verify_user-libc-shadow-db-compat.patch"
    patch_description: "当构建期 libc 探测（conanfile._probe_libc_auth_apis：编译+链接 getpass/getspnam）判定 shadow(5) 数据库 API 不可用时，为 verify_user.c 提供惰性回退 getspnam/lckpwdf/ulckpwdf/putpwent/putspent，使其编译并退化为 /etc/passwd 哈希认证；守卫是能力宏 XRDP_LIBC_NEEDS_COMPAT_AUTH，不是操作系统名宏"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0004-sesrun-libc-getpass-compat.patch"
    patch_description: "同一能力宏 XRDP_LIBC_NEEDS_COMPAT_AUTH 下为 sesrun.c 提供 termios 版 getpass(3) 实现（探测判定该 libc 无此符号时才定义），不再用 #define 覆盖 libc 名称"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0005-sesman-tools-drop-noinst-tools.patch"
    patch_description: "sesman/tools 的两个 noinst 诊断工具在 OHOS 上不可构建（xrdp-xcon 无条件 include X11/Xlib.h；xrdp-authtest 调用 musl 不存在的 getpass）：把 noinst_PROGRAMS 置空以移除二者；二者均 noinst（从不安装），不影响 bin_PROGRAMS，也不计入 make check 分母"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0006-sesman-drop-chansrv.patch"
    patch_description: "sesman/chansrv（X 会话通道代理：clipboard/rail/xcommon 等 4 文件硬编 X11/Xlib.h，OHOS 无 X11 栈）：从 sesman SUBDIRS 移除，xrdp-sesman 主程序不受影响"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0007-tests-xrdp-allow-macro-redefined.patch"
    patch_description: "tests/xrdp 套件的 CFLAGS 追加 -Wno-macro-redefined：上游 configure.ac 的 AM_COND_IF([LINUX]) 分支在本机会命中（本机 host_os 实测为 linux-musl：配方显式传 --host=aarch64-unknown-linux-musl 以绕开不认 OHOS 三元组的 config.guess，configure 的 case $host_os in *linux*) 子串匹配因此命中；实测见 config.status 的 host_os 与 config.log:3235，config.log 里 LINUX_TRUE 为空、LINUX_FALSE 为 # ⇒ LINUX 条件为真）⇒ 上游给测试目标打开了 -Werror；而 check.h 的 fail(...) 与 cmocka.h 的 fail() 在 test_xrdp_region.c 同一 TU 内重定义，clang15 的 -Wmacro-redefined 警告被升为致命 ⇒ 该套件编译中断、27 例无法执行。本补丁只对这一个测试目标抑制这一条警告，-Werror 的其余效力全部保留，使 5 个套件都进入 make check 分母"
    patch_type: "portability"
    patch_strip: 1
