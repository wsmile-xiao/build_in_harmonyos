# 版本级 manifest — xmhtml 1.1.10
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.10"

software: "xmhtml"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-10-04"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://pkg.freebsd.org/ports-distfiles/XmHTML-1.1.10.tgz"
  sha256: "379542629958d70a61a49955f44833e215c82500d6bdcc12d4e7252deefe0435"
  tar_format: tgz

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游手写 Makefile（无 configure / Imake / CMake / install 目标）：
  # 交叉编译走上游预留覆盖点 EXTRA_CFLAGS / EXTRA_INCLUDES / LOADLIBES
  system: makefile
  build_target: "lib"
  configure_options:
    - "EXTRA_CFLAGS=-O2 -fPIC -I<src> -I<deps>"   # 依赖头目录（含 include/freetype2）
    - "LOADLIBES=-L<deps> -lXm -lXmu -lXt -lXext -lX11 -lSM -lICE -ljpeg -lpng -lz -lm -lXpm -lXft -lfontconfig"
  dependencies:
    - motif/2.3.8
    - libxmu/1.3.1.1
    - libxt/1.3.1
    - libxext/6.4.0.1
    - libx11/1.8.13
    - xorgproto/2025.1
    - libsm/1.2.6
    - libice/1.1.2
    - libxpm/3.5.17
    - libxft/2.3.9
    - libxrender/0.9.12
    - freetype/2.14.3
    - fontconfig/2.18.3
    - libpng/1.6.58.3
    - libjpeg-turbo/3.2.0
    - zlib/1.3.2
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Xft.h 属于 XmHTML 的公共接口（HAVE_XFT=1 时被 XmHTML.h 链入）且直接 #include <X11/extensions/Xrender.h> → libxrender/libxft/fontconfig/freetype 必须保持直接依赖并 transitive_headers=True，否则消费者只有 .so 无头文件"
  - "freetype 头位于 include/freetype2（ft2build.h 不在 include 根），依赖 cpp_info 未必声明该子目录 → 构建期需补 include/freetype2 与 include/fontconfig"
  - "上游手写 Makefile 无 install 目标：制品由 package() 显式收集（include/XmHTML/*.h + include/common/*.h + libXmHTML.a/.so.1.1.10），并补 libXmHTML.so.1.1 与 libXmHTML.so 软链（HMDFS 不可 ln -sf 覆盖，先删后建）"
  - "零源码补丁即可适配：上游特性宏已把 musl 缺口（rindex/bcopy/bzero/bcmp/sys_errlist）挡在编译路径之外（实测 -Wimplicit-function-declaration 0 条、链接期 0 undefined reference）"
  - "motif/libxt pin libx11/1.8.13 而 libxext pin libx11/6.4.0 → force libx11/1.8.13 + 选用 libxext/6.4.0.1（延续 libXmu/1.3.1 与 xmcd 3.3.2 的组合）"
