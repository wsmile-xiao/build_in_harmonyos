# test_package/MANIFEST.yml — xmhtml 1.1.10
# CI L0e requires this file to exist.

package: xmhtml/1.1.10
homepage: "https://sourceforge.net/projects/xmhtml/"

# 上游测试清点（R51）：XmHTML 1.1.10 源码树无 tests/ 目录；
# 顶层 Makefile 目标为 all/lib/http/examples/tools/contrib/book/depend/clean/distclean，
# 无 check/test 目标 → 上游无测试套件。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer perspective, headless)
test_package_tests:
  - file: test_xmhtml_consumer.c
    description: "消费者程序编译并链接 libXmHTML：XmHTMLGetVersionString()/XmHTMLGetVersion() 返回 1.1.10，xmHTMLWidgetClass 非 NULL（Motif 类注册），运行期无 loader error"
    command: "conan test"
  - file: test_xmhtml_consumer.sh
    description: "运行消费者二进制并按“依赖是否真缺”分类加载失败：本包自身库失败=FAIL；点名的依赖库在运行期库路径（LD_LIBRARY_PATH）中不存在=FAIL（真缺陷）；依赖库存在却被设备加载策略拒绝映射（musl exec 期报 `Error loading shared library <lib>: (needed by …)`，dlopen 期同现象带 Permission denied）=PLATFORM_POLICY_SKIP + 符号级降级验证（libXmHTML.so 须导出 XmHTMLGetVersion / XmHTMLGetVersionString / xmHTMLWidgetClass）"
    command: "bash test_xmhtml_consumer.sh <bindir> <pkg_libdir>"

# Approximate assertion count (版本串 2 + 数值版本 1 + 类符号 1 + 头宏 1 + 构建/运行前置 2 + 脚本分类/降级验证 3)
assertion_count: 10
