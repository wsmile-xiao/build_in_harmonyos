# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: xlsxio/0.2.36
homepage: "https://github.com/brechtsanders/xlsxio"

# 上游**没有**测试套件：全仓无 ctest/add_test 注册、无 test 目标、无 tests/ 目录
# （清点证据：CMakeLists.txt 全文仅 BUILD_TOOLS/BUILD_EXAMPLES 两个可选目标，
# examples/ 下 5 个程序为演示代码非断言测试；grep -r "add_test" 命中 0）。
# 因此"上游测试数量 = 0"，验证由 test_package 的消费者测试承担。
upstream_check_command: "上游无测试套件（0 项），无可运行入口"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_xlsxio.c
    description: >-
      库级消费者测试（写读回环，16 项断言）：版本 API 与头文件常量一致（2 项）→
      xlsxiowrite 写出含表头与字符串/整数单元格的 xlsx（2 项）→
      工作表清单含目标表（1 项）→ 读打开（2 项）→
      逐格读回与期望矩阵比对（6 项）→ 行数恰好 3 行（1 项）→
      类型化读 next_cell_int 读回 42（1 项）→
      负例：非 xlsx 输入被干净拒绝（1 项）；失败即非零退出。
  - file: test_package/test_xlsxio_cli.sh
    description: >-
      CLI 消费者测试（6 项断言）：csv2xlsx → xlsx2csv 回环，断言两步产物文件存在（2 项）
      且回读内容含全部 4 个数据值（hello/42/world/-7），任一缺失即非零退出。
