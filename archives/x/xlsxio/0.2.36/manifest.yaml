# 版本级 manifest —— xlsxio 0.2.36
# 遵循 ARCHIVE-SPEC v2.0

version: "0.2.36"
software: xlsxio

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-18"
build_system: cmake

source:
  url: "https://github.com/brechtsanders/xlsxio/releases/download/0.2.36/xlsxio-0.2.36.tar.xz"
  sha256: "e696998a967f8397df2a34078bf2cea4bdbb7019718e908c4c8d8d687d554192"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "WITH_LIBZIP=ON（选用 libzip 而非 minizip：制品仓已发布 libzip/1.11.4，minizip-ng 未发布）"
    - "BUILD_STATIC/BUILD_SHARED 按 conan shared 选项映射（默认静态交付）"
    - "BUILD_TOOLS=ON（交付 xlsxio_xlsx2csv/xlsxio_csv2xlsx 两个 CLI）/ BUILD_EXAMPLES=OFF / BUILD_DOCUMENTATION=OFF / BUILD_PC_FILES=OFF"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5（上游声明 cmake_minimum_required 2.6，CMake 4.x 已移除 <3.5 兼容，用 CMake 4 官方的兼容变量覆盖）"
    - "LIBZIP_DIR/EXPAT_DIR 指向 conan 依赖包目录（走 CMakeLists 的 NO_DEFAULT_PATH 分支，杜绝拾取系统副本）"
    - "构建环境显式清空 LD_LIBRARY_PATH（部分 CI worker 的 ambient 指向不兼容 libxml2 会破坏 SDK lld——同 libodfgen/libabw 根因）"
  dependencies:
    - "libzip/1.11.4"
    - "expat/2.8.2"
  cc: clang

patches_applied: []

knowledge_gained:
  - "xlsxio 0.2.36 为零补丁 CMake 适配：唯一平台障碍是 cmake_minimum_required(2.6) 被 CMake 4.x 拒绝，用 CMAKE_POLICY_VERSION_MINIMUM=3.5 解决（同仓多个配方的既有惯例）"
  - "上游无测试套件（无 ctest/add_test/tests 目录），examples/ 为演示程序；验证全部由 test_package 消费者测试承担（库级写读回环 + CLI 回环）"
  - "上游 CMakeLists 自带 LIBZIP_DIR/EXPAT_DIR 的 NO_DEFAULT_PATH 查找分支，正好用于把依赖钉到 conan 包目录，规避系统库污染"
