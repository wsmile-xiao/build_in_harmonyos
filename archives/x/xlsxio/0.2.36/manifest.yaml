software: xlsxio
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.2.36/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.36"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# 构建系统（顶层字段，用于门禁检查）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/brechtsanders/xlsxio/archive/refs/tags/0.2.36.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBUILD_STATIC=ON"
    - "-DBUILD_SHARED=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_TOOLS=ON"
    - "-DBUILD_PC_FILES=ON"
    - "-DMINIZIP_DIR=$DEFAULT_PREFIX"
    - "-DEXPAT_DIR=$DEFAULT_PREFIX"
    - "-DZLIB_DIR=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - minizip/1.3.1
    - expat/2.7.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
