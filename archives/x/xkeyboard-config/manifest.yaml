software: xkeyboard-config
name: X Keyboard Configuration
description: XKB keyboard configuration database
category: x11
license: MIT
website: https://www.x.org/

versions:
  - version: "2.42"
    status: published
    compiled_at: 2026-05-30
    notes: |
      - 需要修复 xsltproc 的 LD_LIBRARY_PATH
      - libxslt 和 libxml2 库路径配置
    dependencies:
      - xsltproc
      - libxslt
      - libxml2
    configure_options:
      - meson setup
    provides:
      - XKB rules files
      - XKB symbols files
      - XKB keycodes files