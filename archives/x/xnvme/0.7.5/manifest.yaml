software: xnvme
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.7.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7.5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# 构建系统（顶层字段，供 verify-build 检查）
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/xnvme/xnvme/releases/download/v0.7.5/xnvme-0.7.5.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "-Dwith-spdk=disabled"
    - "-Dwith-liburing=disabled"
    - "-Dwith-libvfn=disabled"
    - "-Dwith-isal=disabled"
    - "-Dwith-libaio=disabled"
    - "-Dbuild_subprojects=false"
    - "-Dcbi_async_posix=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "meson/1.11.1"
    - "ninja/1.13.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 测试结果
# ============================================================

test_results:
  total: 52
  passed: 32
  failed: 20
  failed_reason: "缺少真实 NVMe 硬件设备，compare/copy/scc/ioworker/write_zeroes 测试需要 NVMe 控制器支持"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-meson.build.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "meson host_machine.system() returns 'harmonyos' on OpenHarmony, not 'linux'; need to add 'harmonyos' to supported systems and map is_linux=true (ref: E090)"
  - "musl libc on OpenHarmony lacks POSIX AIO functions (aio_read/aio_write/aio_error/aio_return); disable cbi_async_posix option (ref: E091)"
  - "xnvme uses meson build system with subproject wraps (spdk); disable subprojects that require network download (ref: E092)"

patch_generation:
