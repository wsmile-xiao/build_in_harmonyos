# test_package/MANIFEST.yml
# xxd has no formal upstream test suite (plain Makefile, no `make check`)
package: xxd/9.1.0
homepage: "https://www.vim.org/"

# Upstream has no formal test command
upstream_check_command: "N/A (no test target in Makefile)"
upstream_test_in_build: false
upstream_test_command: "N/A"

# No upstream test programs
upstream_tests: []

# test_package smoke tests (consumer-side verification)
test_package_tests:
  - file: test_xxd.sh
    description: "Smoke test: verifies xxd binary runs and produces correct hex dumps (version, hex dump, -ps, -i, reverse)"
    command: "XXD_BIN=xxd bash test_xxd.sh"

# Approximate assertion count
assertion_count: 6
