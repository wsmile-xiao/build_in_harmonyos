# 本地 manifest
# 路径: archives/x/xxd/9.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ==============================
# 基本信息
# ==============================

# 版本
version: "9.1.0"

# 软件名
software: "xxd"

# 构建系统
build_system: makefile
build_subdir: src/xxd

# 构建状态
# published | built | failed | archived
status: built

# 构建日期（YYYY-MM-DD）
build_date: "2026-08-30"

# ==============================
# 源码部分
# ==============================

source:
  # 源码下载 URL
  url: "https://github.com/vim/vim/archive/refs/tags/v9.1.0.tar.gz"

  # 源码哈希
  sha256: "ddb435f6e386c53799a3025bdc5a3533beac735a0ee596cb27ada97366a1c725"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ==============================
# 构建部分
# ==============================

build:
  # 构建系统名称
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置参数
  configure_options:
    - "CC=clang"
    - "CFLAGS=-fPIC -O2"

  # 依赖（注意: 格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ==============================
# 安装部分
# ==============================

# 已应用的补丁
patches_applied: []

# ==============================
# 知识部分
# ==============================

# 构建期间获得的知识
knowledge_gained:
  - "xxd is nested in vim source tree at src/xxd/, build with make -C src/xxd"
  - "No patches needed for OHOS/aarch64; pure C with standard library only"
  - "Makefile automatically adds -DUNIX define"
  - "ELF signing required on OHOS for binary execution"
