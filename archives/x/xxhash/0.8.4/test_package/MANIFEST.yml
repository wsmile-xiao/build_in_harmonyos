# Official upstream tests run by conanfile.py::build().
package: xxhash/0.8.4
homepage: https://github.com/Cyan4973/xxHash

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - name: sanity vectors
    source: tests/sanity_test.c and tests/sanity_test_vectors.h
    description: "Upstream reference vectors for XXH32, XXH64, XXH3 and XXH128 APIs."
    command: "make -C tests test_sanity (via make check)"
    discovered_cases: 49948
  - name: xxhsum CLI checks
    source: Makefile check target
    description: "Upstream CLI checks for stdin, files, benchmark modes, algorithm variants and invalid variants."
    command: "make check"
    discovered_cases: 10

test_package_tests:
  - file: test.c
    description: "Linked Conan consumer checks for version, known vectors, input sensitivity and streaming APIs."
    command: "./test_probe"
    assertion_count: 13

# Upstream total includes 49,948 sanity vectors plus ten CLI checks.
assertion_count: 49971
