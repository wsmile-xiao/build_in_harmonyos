knowledge_gained:
  - "纯 Makefile 项目 UNAME filter 白名单不含 HarmonyOS 时整个 install 段未定义（No rule to make target 'install'），需在白名单追加 HarmonyOS（知识草稿 E257，区别于 E108 的 install 命令缺失）"
  - "HarmonyOS 缺 GNU install 命令：INSTALL/INSTALL_DATA/INSTALL_DIR 用 cp -p/mkdir -p 替代（E108 合并处理）"
  - "Conan basic_layout 下 source folder 与 build folder 分离，纯 Makefile 项目 make/install 必须加 -C $(self.source_folder)"
  - "conandata.yml 必须用版本键双层结构 sources:{ver:{url,sha256}}，平铺结构会 KeyError"
  - "shared=False 时 test_package 只能静态链接；build/package 按 options.shared 分支裁剪产物"
