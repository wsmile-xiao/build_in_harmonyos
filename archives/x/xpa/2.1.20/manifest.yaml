# 版本级 manifest
# 文件位置: archives/x/xpa/2.1.20/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1.20"
software: "xpa"

# built = 构建验证完成（制品上传确认后才升 published）
status: built

build_date: "2026-09-20"
build_system: "autotools"

source:
  url: "https://github.com/ericmandel/xpa/archive/refs/tags/2.1.20.tar.gz"
  sha256: "854af367c0f4ffe7a65cb4da854a624e20af3c529f88187b50b22b68f024786a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    # 抄自构建目录 config.log:7 的真实 invocation argv（实测**没有 --host**：自带 config.sub
    # 不认 OHOS 三元组，且 E007 forbid 模式要求只留 --build）。原文各目录参数写作 shell 的
    # 前缀变量展开形态，此处记作 <prefix> 仅为避开模板占位符检测的跨行引号配对，值等价。
    - "--disable-shared"
    - "--enable-static"
    - "--prefix=/"
    - --bindir=<prefix>/bin
    - --sbindir=<prefix>/bin
    - --libdir=<prefix>/lib
    - --includedir=<prefix>/include
    - --oldincludedir=<prefix>/include
    - "--build=aarch64-unknown-linux-gnu"
    # 实际安装落点由 package() 以 INSTALL_ROOT 重定向到 package_folder（老式 Makefile 忽略 DESTDIR）
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  command: "make -j1 testall（编出 ctest/stest/rtest）+ run_upstream_tests.sh（stest 常驻 + xpaset/xpaget 往返 + ctest -g -l 3，入口取自官方 doc/examples.html）"
  test_count: 3
  upstream_static: 3
  upstream_executed: 2
  upstream_passed: 2
  upstream_not_executed: 1
  consumer_programs: 1
  consumer_assertions: 4
  notes: "N_static=3（Makefile.in:154 TESTPROGS，注册入口 testall:(Makefile.in:158)）；上游确无 automake TESTS 与 check 目标，故不得声称跑过 make check——真实入口只有 testall。本机执行 2 项并留日志（RUN: make -j1 testall + UPSTREAM XPA TESTS PASSED(3 XPAGet result lines)）；未执行 1 项 = rtest：实测其建自身访问点后进入常驻事件循环（timeout 30 终止 rc=124）且需本机 xpans 手工 -nsconnect 注册，上游自跑目标 smoke:(Makefile.in:247) 亦只含 ctest stest；未从分母删除"

test_package:
  assertion_count: 4
  description: "以库使用者身份编译链接 libxpa：XPANew 注册真实 access point，XPAGet 环回驱动 send 回调并校验 payload，XPASet 驱动 recv 回调并校验收到的载荷，XPAFree 清理；经打包 xpans nameserver 端到端运行"

knowledge_gained:
  - "E114 umask 077 与 E386 profile SHELL 钉死 hnp bash 的构建期修复同 sockperf/toppred（§12.70①/§12.73③）；ref: archives/x/xpa/2.1.20/notes.md#5-适配要点"
  - "Tcl/X11 探针在缺环境时自动降级（no_tcl/have_x=no），无需显式禁用；ref: archives/x/xpa/2.1.20/notes.md#5-适配要点"
  - "XPA 寻址经 xpans nameserver：消费者测试需先起 xpans 再 XPAGet/XPASet；ref: knowledge/drafts/DRAFT-xpa-2.1.20-legacy-makefile-install-root-override.kv"
