name: xpa-test
version: "2.1.20"
description: >
  Consumer test for the packaged libxpa: compiles xpa_consumer.c against
  the installed header/static lib, starts the packaged xpans nameserver,
  then in a fork dual-process shape (server child runs XPANew+XPAPoll,
  parent drives the client calls) registers a real access point, drives
  an XPAGet round trip and an XPASet callback delivery, and asserts
  payload correctness.
assertions:
  - "child XPANew returns a valid access point (non-NULL)"
  - "parent XPAGet resolves the access point via xpans and send_cb payload round-trips"
  - "XPASet delivers to recv_cb and the received payload matches"
  - "XPAFree cleans up; child exits 0 with ALL CONSUMER TESTS PASSED"

upstream_tests:
  # 上游无 automake TESTS、无 check 目标；真实入口只有 testall（Makefile.in:158）
  entry_point: "make -j1 testall（Makefile.in:154 TESTPROGS = ctest stest rtest）"
  declared_static: 3
  registered: 3
  executed: 2
  passed: 2
  not_executed:
    - name: rtest
      reason: "建自身 access point 后进入常驻事件循环（实测 timeout 30 终止 rc=124），且需本机 xpans 手工 -nsconnect 注册；上游自跑目标 smoke:(Makefile.in:247) 亦只含 ctest stest。保留在分母内，未删除"
  evidence: "reports/conan-create.log 内 RUN: make -j1 testall 与 UPSTREAM XPA TESTS PASSED"
