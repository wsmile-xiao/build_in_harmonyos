software: xelb
version: "0.20"
status: built
build_date: "2026-09-20"

source:
  url: "https://github.com/emacs-exwm/xelb/archive/refs/tags/0.20.tar.gz"
  sha256: "7bbf6bdd84767d8f73b8d22421cd0a707669cc2cd4a9b2e85f6c81139e8a9296"
  tar_format: tar.gz

build:
  system: elisp
  configure_options:
    - "emacs -Q --batch -L <compat-lispdir> -L . -f batch-byte-compile <46 library .el files>"
    - "emacs -Q --batch -L <compat-lispdir> -L . -l xcb.el -l xelb.el -l xelb-test.el -f ert-run-tests-batch-and-exit"
  dependencies:
    - "emacs/29.1"
    - "compat/31.0.0.2"
  cc: N/A
  cxx: N/A

patches_applied: []

artifacts:
  lisp:
    - "share/emacs/site-lisp/xelb-0.20/xcb.el"
    - "share/emacs/site-lisp/xelb-0.20/xcb.elc"
    - "share/emacs/site-lisp/xelb-0.20/xelb.el"
    - "share/emacs/site-lisp/xelb-0.20/xelb.elc"
    - "share/emacs/site-lisp/xelb-0.20/xcb-types.el"
    - "share/emacs/site-lisp/xelb-0.20/xcb-xproto.el"
  licenses:
    - "licenses/LICENSE"

validation:
  upstream_tests: "2 ERT tests (xelb-test-binary32, xelb-test-binary64)"
  upstream_test_discovery:
    - "Tag 0.20 tarball holds 47 .el files with no test/ directory and no Makefile check target; the only test module is xelb-test.el with 2 ert-deftest forms."
    - "Both tests are pure float conversion round trips requiring only ert and xcb-types; no X server is needed."
  upstream_substitute_validation: []
  test_package: "sh test_xelb.sh -> emacs -Q --batch -L $XELB_LISPDIR -l test_xelb.el (10 checks)"
  ci_entrypoint: "ci/conan/build_and_test.sh archives/x/xelb/0.20 (profile ci/conan/profiles/ohos-aarch64)"

knowledge_gained:
  - "xelb 0.20 is a 46-file Emacs Lisp package; its Package-Requires (emacs 27.1, compat 29.1/30) are covered by emacs/29.1 and compat/31.0.0.2."
  - "The Makefile regeneration target must not run in the recipe: it deletes the shipped pre-generated bindings and needs xcb-proto XML sources. ELPA installs byte-compile the shipped files directly."
  - "The package is share-only (no bin/lib/include); test_package exercises the Lisp API through XELB_LISPDIR / EMACSLOADPATH."
