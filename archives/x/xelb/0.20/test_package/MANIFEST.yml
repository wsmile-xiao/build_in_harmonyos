package: xelb/0.20
homepage: "https://github.com/emacs-exwm/xelb"

# Upstream ships xelb-test.el with 2 ERT tests (xelb-test-binary32 and
# xelb-test-binary64) covering the binary32/binary64 conversion primitives
# of xcb-types.el. Both are pure computations, no X server is needed.
# Count method "auto": single ERT framework, parsed from the ERT batch
# summary line "Ran N tests, N results as expected".
upstream_tests_exist: true
upstream_test_total: 2
upstream_test_count_method: auto
upstream_test_count_detail: "grep -c '(ert-deftest' xelb-test.el => 2 (xelb-test-binary32, xelb-test-binary64)"
upstream_test_audit: "Audited tag 0.20 tarball (54 entries): 47 .el files, no test/ directory, no Makefile check target; the only test module is xelb-test.el with 2 ert-deftest forms requiring only ert and xcb-types."
upstream_check_command: "emacs -Q --batch -f batch-byte-compile <46 library .el files>"
upstream_test_in_build: true
upstream_test_command: "emacs -Q --batch -L <compat-lispdir> -L . -l xcb.el -l xelb.el -l xelb-test.el -f ert-run-tests-batch-and-exit"
upstream_test_result: "pending"
upstream_test_notes: "Recipe build() byte-compiles the 46 library sources and runs the 2 upstream ERT tests with the packaged emacs/29.1; result marker HMBS_UPSTREAM_TEST_RESULT is emitted from the ERT summary and verified on the HarmonyOS aarch64 preflight."
upstream_tests:
  - file: xelb-test.el
    description: "Upstream ERT suite: binary32/binary64 conversion round trips of xcb-types.el"
    cases: 2

test_package_tests:
  - file: test_xelb.sh
    description: "Consumer validation: checks XELB_LISPDIR, packaged xcb/xelb artifacts, EMACSLOADPATH, then runs the Emacs batch functional test"
    command: "sh test_xelb.sh"
  - file: test_xelb.el
    description: "Requires xcb and xelb from the packaged load path and verifies the features, the four binary conversion primitives, float32/float64 1.0 round trips and xcb-xproto loading"
    command: "emacs -Q --batch -L $XELB_LISPDIR -l test_xelb.el"

assertion_count: 10
