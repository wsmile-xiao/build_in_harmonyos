software: xpar
display: "xpar"
description: "Command-line error-correction and integrity tool for protecting and recovering files"
category: utility
homepage: "https://github.com/iczelia/xpar"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Builds natively for HarmonyOS aarch64 with the upstream NEON and AArch64 assembly implementations enabled."
    - "Disables optional Linux-only io_uring; no third-party Conan dependencies are required."
    - "Runtime validation uses writable HOME/tmp because HarmonyOS /tmp is read-only."
  common_dependencies: []

versions:
  "1.1":
    status: built
    build_date: "2026-09-30"
