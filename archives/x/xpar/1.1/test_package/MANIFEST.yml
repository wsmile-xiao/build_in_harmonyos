package: xpar/1.1
homepage: "https://github.com/iczelia/xpar"

upstream_check_command: "make self-check"
upstream_test_in_build: true
upstream_test_command: "make self-check"
upstream_tests:
  - file: Makefile.am
    source: xpar-1.1/Makefile.am
    description: "Upstream self-check covers joint and sharded encode/decode, parity recovery, integrity and authentication, malformed input rejection, and BLAKE2b modes"
    command: "make self-check"

test_package_tests:
  - file: test.sh
    description: "Run the packaged xpar binary through version, joint round-trip, integrity, systematic recovery, and truncated-archive rejection checks; on HarmonyOS also round-trip Unicode paths in writable user storage"
    command: "sh test.sh <package-bin>/xpar"
  - file: conanfile.py
    description: "Conan test_package invokes test.sh using the binary from the tested package"
    command: "conan create archives/x/xpar/1.1 --profile:host=ohos-aarch64 --profile:build=ohos-aarch64"

assertion_count: 8
