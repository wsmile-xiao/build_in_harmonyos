version: "1.1"
software: xpar
status: built
build_date: "2026-09-30"
build_system: autotools

source:
  url: "https://github.com/iczelia/xpar/releases/download/1.1/xpar-1.1.tar.gz"
  sha256: "65fd88b88a017a89e0e28566f8bf9ae169ff561a174c41a244ff9fa62364b63b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-aarch64"
    - "--disable-liburing"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
knowledge_gained:
  - "xpar 1.1 is a command-line executable; the Conan package exposes bin/xpar and the software commands registry entry."
  - "The native aarch64 build enables upstream NEON/assembly code and disables optional Linux-only io_uring."
  - "HarmonyOS mounts /tmp read-only; the upstream self-check's expected-failure outputs must be redirected into a writable temporary directory."
  - "Buildbot jobs 65615, 65630, and 65690 all failed while config.status wrote subs1.awk. On HMDFS, Autoconf's umask 077 private directory is not writable; the OHOS recipe relaxes it to 022 before configure."
  - "On this HarmonyOS SDK, the CONFIG_SHELL Bash also needs PWD set to the logical build directory because getcwd can be denied inside app storage."
  - "The HarmonyOS consumer test uses writable HOME/tmp and checks a real recovery round-trip with Unicode and spaced paths."

upstream_test_census:
  source: "Official xpar 1.1 source archive, Makefile.am:158-259"
  evidence:
    - "No tests/ directories in the source archive (0)."
    - "No Automake TESTS, check_PROGRAMS, or check-local registrations (0)."
    - "One custom .PHONY self-check target, counted as one aggregate suite because upstream does not register individual shell assertions as cases."
  upstream_suites: 1
  executed: 1
  passed: 1
  pass_rate: "100%"
  command: "make self-check"
  notes: "The target contains multiple encode/decode, integrity, recovery, authentication, malformed-input, and BLAKE2b checks; upstream does not publish a separate assertion total."

patch_generation:
  method: per-file-difflib
  source_orig: "official xpar-1.1 source archive"
  source_work: "temporary modified source copy"
  patches_count: 2
  patch_classification:
    - file: "0001-config.guess.patch"
      type: portability
      platform_only: true
      guard: "config.guess uname -s equals HarmonyOS"
    - file: "0002-config.sub.patch"
      type: portability
      platform_only: true
      guard: "Autoconf canonical OS is OHOS (linux-ohos)"
