# conandata.yml - xcmsdb 1.0.7
# The primary URL is the x.org archive host: www.x.org/releases answers 301 and
# the release host fails TLS from HarmonyOS. The url value is a LIST on purpose
# because the single-value mirror rewriting points xorg URLs at a dead mirror.
sources:
  url:
    - "https://xorg.freedesktop.org/archive/individual/app/xcmsdb-1.0.7.tar.gz"
    - "https://www.x.org/releases/individual/app/xcmsdb-1.0.7.tar.gz"
  sha256: "2de6f66e1a25b7f6cbfb8f86b0e8da3fab454fc53a71b55a7705caf1a9d5677c"

patches:
  - patch_file: "patches/0001-configure-hmdfs-pwd-tmpdir.patch"
    patch_description: "configure: fall back to PWD when pwd (getcwd) fails on HMDFS, and relax the config.status tmp dir from umask 077 to 022"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "config.guess: recognize a HarmonyOS uname and emit aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "config.sub: accept the ohos OS token and the linux-ohos kernel and OS pair"
    patch_type: "portability"
