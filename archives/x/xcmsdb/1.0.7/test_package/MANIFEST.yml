# test_package/MANIFEST.yml
# xcmsdb 1.0.7 上游测试声明
#
# 上游无任何自动化测试：Makefile.am 与 man/Makefile.am 中
# grep -cE "TESTS|check_" 均命中 0 条（实测命令与读数见版本级 notes.md 与
# ~/tmp/uc2/zhuli-10-xcmsdb/pristine/base/Makefile.am），automake 只会生成
# 空的 check 目标，因此上游可执行测试数 = 0，不存在"上游 N 项"的对比基线。
# 本包全部测试均为 test_package 自造的消费者断言，声明数 = 实测执行数。

package: xcmsdb/1.0.7
homepage: "https://gitlab.freedesktop.org/xorg/app/xcmsdb"

# 上游声明的 check 命令（automake 生成，实为空目标）
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序：无
upstream_tests: []

# test_package 自带的消费者断言（在无头环境可稳定复现的真断言）
test_package_tests:
  - file: test.sh
    description: "二进制可在 conanrun 环境解析（依赖闭包可加载）"
    command: "command -v xcmsdb"
  - file: test.sh
    description: "-version 横幅输出含 1.0.7 且退出码 0（30s 超时保护）"
    command: "xcmsdb -version"
  - file: test.sh
    description: "未知参数路径 30s 内返回，不挂死"
    command: "xcmsdb --definitely-not-an-option"
  - file: test.sh
    description: "DISPLAY 置空后 -query（真 X 客户端主路径）必须在 30s 内自行终止，挂死即失败"
    command: "env -u DISPLAY xcmsdb -query"
  - file: test.sh
    description: "readelf -d 解析 ELF NEEDED 项，确认 libX11/libxcb/libXdmcp/libXau 依赖闭包齐全"
    command: "readelf -d $(command -v xcmsdb)"

assertion_count: 5
