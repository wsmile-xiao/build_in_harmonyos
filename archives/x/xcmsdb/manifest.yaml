software: xcmsdb
name: X Color Management System Database client
description: Load, query, list and remove the ICC colour database of an X server
category: x11
license: MIT
website: https://www.x.org/

versions:
  - version: "1.0.7"
    status: built
    compiled_at: 2026-09-24
    notes: |
      - X.Org app 包，2 个 C 源文件 + 1 个手册页，autotools 构建
      - 运行期依赖 libX11（Xcms API）；构建期依赖 util-macros 的 xorg-macros.pc
      - config.guess/config.sub 补丁识别 HarmonyOS 与 ohos 三元组
      - HMDFS 补丁：configure 的 pwd 回退 $PWD、config.status umask 077→022
      - 上游无自动化测试（Makefile.am 内 TESTS/check_ 命中 0），测试全部由
        test_package 自造：5 条无头断言全过
      - 真实写入 X server 的功能路径需 X 会话，本轮未验证
    dependencies:
      - libx11
      - xorgproto
      - util-macros
    provides:
      - xcmsdb
