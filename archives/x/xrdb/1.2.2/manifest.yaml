software: xrdb
version: "1.2.2"
status: published
build_date: "2026-06-13"

source:
  url: "https://www.x.org/archive/individual/app/xrdb-1.2.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-xrdb.c.patch"

knowledge_gained:
  - "E007: config.guess 需要 __OHOS__ LIBC 检测和 HarmonyOS 系统识别"
  - "E072: config.sub 需要 ohos-linux triplet"
  - "E011: configure 的 umask 077 需改为 umask 022 + 临时目录改为 $TMPDIR/（HMDFS setgid 权限兼容）"
