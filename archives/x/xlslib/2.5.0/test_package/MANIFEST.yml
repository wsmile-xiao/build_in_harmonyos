# test_package/MANIFEST.yml
# Upstream test declaration for xlslib 2.5.0.
# The upstream automake TESTS list runs four check programs; each generates
# .xls files and compares their MD5 digests against the expected hashes that
# ship in the release archive (targets/test/*.md5).

package: xlslib/2.5.0
homepage: "https://sourceforge.net/projects/xlslib/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests_exist: true
upstream_test_framework: "automake"
upstream_test_count: 4
upstream_test_audit: "audited the official xlslib-package-2.5.0.zip (URL+sha256 same as conandata.yml): the Autotools targets/test/Makefile.am declares check_PROGRAMS + TESTS with four check programs (testCPP, testC, PR2859188, PR3076678), each dumping generated .xls files into targets/test/ and comparing their MD5 digest against the expected hashes that ship in the release archive (targets/test/*.md5). Each check program maps to one automake TESTS entry (4 total); the C++ programs carry 10 / 3 / 1 sub-assertions and the C test 1, for 15 MD5-based assertions behind the 4 automake entries."

upstream_tests:
  - file: mainCPP.cpp
    source: xlslib/xlslib/targets/test/mainCPP.cpp
    description: "C++ stress/format tests: 10 sub-tests each dumping .xls and checking the MD5 against mainCPP.md5"
    command: "./testCPP"
  - file: mainC.c
    source: xlslib/xlslib/targets/test/mainC.c
    description: "C-interface test: builds testC.xls and checks the MD5 against mainC.md5"
    command: "./testC"
  - file: PR2859188.cpp
    source: xlslib/xlslib/targets/test/PR2859188.cpp
    description: "Regression tests for tracker 2859188: 3 sub-tests checking generated .xls MD5 values"
    command: "./PR2859188"
  - file: PR3076678.cpp
    source: xlslib/xlslib/targets/test/PR3076678.cpp
    description: "Regression test for tracker 3076678: checks generated .xls MD5 value"
    command: "./PR3076678"

test_package_tests:
  - file: test_xlslib.cpp
    description: "Creates a workbook, adds a sheet with label/number/blank cells, dumps test.xls and verifies the non-empty output"
    command: "./test_xlslib"

assertion_count: 4
