sources:
  url: "https://downloads.sourceforge.net/project/xlslib/xlslib-package-2.5.0.zip"
  sha256: "05a5d052ffdd6590755949d80d16a56285561557bc9a5e887e3b8b3fef92a3f3"

patches:
  - patch_file: "patches/0001-config-sub-aarch64.patch"
    patch_description: "Add aarch64 linux/ohos canonical-host cases to the bundled config.sub"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-test-makefile-in-link-fix.patch"
    patch_description: "Link the testC C driver with the C++ runtime and drop -static -lstdc++ from the check programs"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-test-makefile-am-link-fix.patch"
    patch_description: "Keep Makefile.am test link rules consistent with the generated Makefile.in"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-ucs2-internal-musl.patch"
    patch_description: "Map UCS_2_INTERNAL to the native-endian 16-bit musl codec (UCS-2LE/UCS-2BE) on Linux/OHOS; musl iconv does not recognise glibc's UCS-2-INTERNAL"
    patch_type: "portability"
    strip: 1
