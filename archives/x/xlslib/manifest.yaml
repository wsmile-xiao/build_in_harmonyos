software: xlslib
display: "xlslib"
description: "C/C++ library to construct Excel .xls files in code"
category: library
homepage: "https://sourceforge.net/projects/xlslib/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Static-only build (--disable-shared): bundled libtool 2.2.10 emits #!/bin/bash check wrappers that fail on OHOS."
    - "Patch config.sub to accept aarch64-*-linux/ohos canonical hosts."
    - "Fix the test Makefile link rules: drop -static -lstdc++, link testC via the C++ driver."
    - "Touch shipped generated files (configure last) to avoid autoconf/automake regeneration."
  common_dependencies: []

versions:
  "2.5.0":
    status: built
    build_date: "2026-09-18"
