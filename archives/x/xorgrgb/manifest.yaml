# xorgrgb — X.org RGB 颜色数据库工具
#
# 简介
xorgrgb 提供 `showrgb` 命令和 X11 颜色名称与 RGB 值的映射关系，是rgb.txt 数据文件（782 条颜色定义）作为 X11 应用颜色解析的基础。
# 当前版本索引
version: 1.1.1
status: published
date: 2026-06-17
# 编译信息摘要
build_system: autotools
configure_options:
  - "--prefix=$DEFAULT_PREFIX"
  - "--with-rgb-db-type=text"
dependencies:
  - xorgproto/2024.1
  - util-macros/1.20.2
patches: 1 (0001-configure.patch, E011 HMDFS umask 修复)
