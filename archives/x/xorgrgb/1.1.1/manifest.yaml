software: xorgrgb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.1"

# 构建系统类型
build_system: autotools

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.freedesktop.org/xorg/app/rgb/-/archive/rgb-1.1.1/rgb-rgb-1.1.1.tar.gz"

  # 源码校验和
  sha256: "ca7a8643246dabc4176a914661855df9ad2e62cbf18ba5ab948ac617b4d89564"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--with-rgb-db-type=text"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - xorgproto/2024.1
    - util-macros/1.20.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011: HMDFS umask 077 导致 autotools config.status 临时目录不可写，需 sed umask 022"
  - "xorgrgb (xorg/app/rgb) 源码托管在 freedesktop GitLab，非 GitHub"
  - "xproto pkg-config check 在 xorg-macros 生成的 configure 中语法异常（参数交换），但仅提供头文件不影响编译"


patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/xorgrgb-1.1.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/xorgrgb-1.1.1.work
