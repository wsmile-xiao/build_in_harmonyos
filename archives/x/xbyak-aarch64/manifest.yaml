software: xbyak-aarch64
display: "xbyak_aarch64"
description: "C++ JIT assembler emitting AArch64 / NEON / SVE machine code at run time"
category: development
homepage: "https://github.com/fujitsu/xbyak_aarch64"
license: "Apache-2.0"
build_system: makefile

ohos_adaptation:
  key_points:
    - "运行期把 AArch64/NEON/SVE 机器码写入可执行内存并跳转执行; 上游测试用 GNU as -acdnl= 生成参考编码后与 xbyak JIT 编码逐字节 diff"
    - "鸿蒙 PC 自带 GNU as 2.45 支持 -acdnl=; 原生 aarch64 下 EMULATOR 为空, 不需要 qemu"
    - "设备无 g++, 测试脚本硬编码 CXX=g++; 用 PATH 前置 g++ -> clang++ 包装脚本解决, 不改测试脚本"
    - "musl 障碍 1: src/util_impl_linux.h 的 glibc 私有 sysconf(_SC_LEVEL*_CACHE_SIZE) 回退块以 #if defined(...) 保护, 主路径(cacheInfoDict/sysfs)不变"
    - "musl 障碍 2: 测试驱动 8 处 uint jj; 改为等价的 unsigned int (glibc 中 uint 即 unsigned int), 测试逻辑与断言未变"
    - "未删除测试/未放宽断言/未跳过场景; test2/ 的 15 个模式场景因时间成本未跑, 非失败"
  common_dependencies: []

versions:
  "1.1.3":
    status: built
    build_date: "2026-09-29"
    source_url: "https://github.com/fujitsu/xbyak_aarch64/archive/refs/tags/v1.1.3.tar.gz"
