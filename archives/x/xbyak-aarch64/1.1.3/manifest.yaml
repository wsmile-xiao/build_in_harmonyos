software: xbyak-aarch64
version: "1.1.3"
status: built
build_date: "2026-09-29"
build_system: makefile

source:
  url: "https://github.com/fujitsu/xbyak_aarch64/archive/refs/tags/v1.1.3.tar.gz"
  sha256: "dd65de6fb34fb3d4c74a924d739500d6bd53587c7b3db3e6524a794b9492307a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make CXX=clang++"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-ohos-portability.patch"

knowledge_gained:
  - "路径 C 证据：库在运行期把 AArch64/NEON/SVE 机器码写进可执行内存，刷新指令缓存后直接调用；上游 test/test_all.sh 不是字符串比对，而是用 GNU as -acdnl= 生成参考编码、由 xbyak 生成同一批指令并 JIT 编码，再 diff 两者（diff -w x.lst ok.lst）。"
  - "鸿蒙 PC 自带 GNU as 2.45，实测接受 -acdnl= 列表选项并产出测试脚本期望的格式，因此无需 qemu：原生 aarch64 下 setenv-qemu 的 EMULATOR 为空。"
  - "设备无 g++；测试脚本硬编码 CXX=g++。最小的做法是在 PATH 前置一个 g++ -> clang++ 的包装脚本，而不是改测试脚本。"
  - "musl 专属障碍 1：src/util_impl_linux.h 使用 glibc 私有 sysconf 参数 _SC_LEVEL1/2/3_*CACHE_SIZE，musl 未声明导致编译失败。上游注释本身已说明 sysconf 路径“不总是返回正确值”；该回退块仅服务未被 test/test2/sample 使用的 getCacheSize()，故用 #if defined(...) 保护并保留文档化默认值，不改主路径（cacheInfoDict 与 sysfs 遍历）。"
  - "musl 专属障碍 2：测试驱动 8 个 make_nm*.cpp 里的 uint jj; —— uint 是 glibc sys/types.h 的 typedef（等价 unsigned int），musl 无。改为等价的 unsigned int，语义与断言完全不变。"
  - "OHOS sysfs 的 /sys/devices/system/cpu/cpu0/cache/ 存在但 index* 目录为空，故 sysfs 缓存探测在鸿蒙上取不到数据；这不影响测试与库功能。"

verification:
  local_build: "make CXX=clang++ -j1 -> lib/libxbyak_aarch64.a (8.7 MB)"
  upstream_test_suite: "test/test_all.sh (scripts in test/test_all.sh: 8 make_nm* + 3 integrated = 11 scenarios)"
  upstream_test_suite_2: "test2/test_all.sh (15 patterns a b c f e l m n p r s t u w x)"
  abi_check: "test_package/ohos_abi_check.py (AArch64 ELF objects, headers, codegen symbols)"
  consumer_test: "test_package/test_xbyak.cpp - JIT emits add/csel/NEON vadd, executes, checks results and encodings"
