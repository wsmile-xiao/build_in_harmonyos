# test_package/MANIFEST.yml
package: xbyak-aarch64/1.1.3
homepage: "https://github.com/fujitsu/xbyak_aarch64"

# 本包交付静态库 libxbyak_aarch64.a 与头文件目录 xbyak_aarch64/。
# 上游测试不集成进 conanfile.py 的 build()（配方只构建库本体），
# 故 upstream_test_in_build 为 false。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "test/test_all.sh"
    source: "xbyak_aarch64-1.1.3/test/"
    description: >-
      上游 test/ 套件共 11 个场景：nm 系列 8 个（make_nm、make_nm_branch、
      make_nm_fp、make_nm_load_store、make_nm_simd、make_nm_simd_fp_load_store、
      make_nm_sve、make_nm_sve_addr）+ integrated 系列 3 个（mov、mov_imm、
      add_sub_adds_subs_imm）。每个场景把 xbyak 运行期生成的机器码与 GNU as
      参考编码逐行 diff。由上游 CI .github/actions/test_action/entrypoint.sh
      执行 ./test_all.sh -q 驱动。
    command: "cd test && ./test_all.sh -q"
  - file: "test2/test_all.sh"
    source: "xbyak_aarch64-1.1.3/test2/"
    description: >-
      上游 test2/ 指令模式套件共 15 个场景（PTN="a b c f e l m n p r s t u w x"）。
      每个场景执行 ./test.sh test_ptn_cpp/instructions_<PTN>.cpp，把 GNU as 的
      期望编码与 xbyak JIT 实际编码做 diff -y；15 个场景合计 21805 次指令编码
      比较，0 差异。注意：上游 test2/test_all.sh 无 set -e、不检查 $?，其最终
      退出码只等于最后一个场景，故本包以逐场景退出码为主判据。
    command: "cd test2 && ./test_all.sh"

test_package_tests:
  - file: "ohos_abi_check.py"
    description: >-
      产物 ELF/ABI 检查（纯 Python，任意宿主可跑）：ar 归档内含 ELF64 AArch64
      目标文件、公共头文件齐备、编译器实现符号（CodeGenerator / Xbyak）确实在
      归档内、无 Mach-O/PE 泄漏。共 11 项断言。
    command: "python3 ohos_abi_check.py --package <pkg>"
  - file: "test_xbyak.cpp"
    description: >-
      消费者测试（5 项，仅 can_run 时在真机执行）：运行期生成 add w0,w0,w1 并
      ready()+getCode() 后调用返回 42；编码校验为 0x0B010000；生成 cmp+csel 取
      较大值；生成 NEON add v0.4s,v0.4s,v1.4s 得 [11,22,33,44]；生成 mul+lsl
      序列返回 84。
    command: "test_xbyak"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
