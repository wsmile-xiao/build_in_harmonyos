version: "0.999"
software: "xsane"
status: built
build_system: autotools

source:
  url: "https://gitlab.com/sane-project/frontend/xsane/-/archive/0.999/xsane-0.999.tar.gz"
  sha256: "05359707effe1547ff123bb34443a95a4c54bd4888b91a3556c69875b64989b6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-sanetest"
    - "--disable-gtktest"
    - "--disable-nls"
    - "--disable-gimp"
    - "--disable-jpeg"
    - "--disable-png"
    - "--disable-tiff"
    - "--disable-lcms"
  dependencies:
    - "sane-backends/1.2.1"
    - "gtk2/2.24.33"
  build_requirements:
    - "autotools-dev/20240727.1-nmu1"
    - "pkgconf/3.0.5"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Upstream tree is a legacy Autotools snapshot: configure.in + generated configure + Makefile.in files, no test suite."
  - "The release tree does not ship config.guess/config.sub; stage them from autotools-dev before configure."
  - "xsane hard-codes a gtk+-2.0 pkg-config probe; the native gtk2/2.24.33 package provides a real gtk+-2.0.pc, so no alias shim is needed."
  - "GTK 2-only types used by xsane 0.999: GtkObject, GdkGC, GdkPixmap, GtkTooltips, GdkInputCondition, GtkSignalFunc; they resolve against gtk2/2.24.33 headers directly."
  - "Optional JPEG/PNG/TIFF/LCMS/GIMP paths can be disabled, leaving sane-backends and gtk2 as the only runtime requirements."
  - "The previous gtk+-3.0 alias approach is retired: GTK 3 headers dropped the GTK 2 object system, so an alias can only ever pass configure, never compile."
  - "xsane 源码在 --disable-nls 下仍无守卫地引用 bind_textdomain_codeset,OHOS 无 libintl;以 gettext 直通桩(libintl-stub.a)追加到 src/Makefile 的 LIBS 行尾解决——静态库必须位于链接行中目标文件之后,且不可经命令行 LDFLAGS 注入(会盖掉 AutotoolsDeps 的 -L 路径)。"
  - "xsane 自制 Makefile 裸执行 mkinstalldirs(#! /bin/sh shebang),OHOS 按签名强制下 EACCES;统一改写 MKDIR/MKINSTALLDIRS 变量为 /system/bin/sh 显式调用。"
  - "xsane --version 并非在 GTK init 之前退出:无显示环境 exit 1 并报 cannot open display。无头 smoke 以到达 GTK 显示初始化(动态链接链完整加载)为通过信号,版本断言仅在带 X server 的目标上执行(R40)。"
