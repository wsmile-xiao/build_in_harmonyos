# conandata.yml — xa 2.4.1 (xa65)
# 上游源码: 作者官方 GitHub 仓库 tag 归档（官方源, R39）
#   https://github.com/fachat/xa65/archive/refs/tags/xa-2.4.1.tar.gz
# sha256 已用 canonical codeload 归档（github.com/archive 302 的实际目标，
# https://codeload.github.com/fachat/xa65/tar.gz/refs/tags/xa-2.4.1）
# 二次核验一致（字节级相同）。
# 注: 该归档以 xa65-xa-2.4.1/README + xa65-xa-2.4.1/xa/ 布局发布，
#     conanfile.py 的 source() 会把 xa/ 子目录提升为工程根。

sources:
  url: "https://github.com/fachat/xa65/archive/refs/tags/xa-2.4.1.tar.gz"
  sha256: "8fecdb9e64da84eb77d3572e73033bf3d1ca533c7291fb5d0d9735c5440eb67e"

patches:
  - patch_file: "patches/0001-tests-harness.patch"
    patch_description: >-
      Perl 测试驱动可移植性：上游 shebang `#!/usr/bin/perl -s` 在 OHOS 上不可执行
      （系统无 /usr/bin/perl；且内核对 `perl -s` 作为单个参数传给 env(1)，
      toybox env 无法拆分）。改为 `#!/usr/bin/env perl` 并在脚本内复刻 -s 开关解析，
      使既有测试调用方式（`./harness -tests=...`）逐字可用，测试断言零改动。
    patch_type: "portability"
  - patch_file: "patches/0002-tests-hextool.patch"
    patch_description: >-
      同上：tests/hextool shebang 改为 `#!/usr/bin/env perl` 并内建 -s 等价解析，
      使各 test Makefile 中的 `../hextool -cmp=...` 二进制比对调用在 OHOS/CI 上可执行；
      比较语义不变（仍为逐字节 hex 比对）。
    patch_type: "portability"
