# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: xa/2.4.1
homepage: "https://github.com/fachat/xa65"

# 上游测试命令（本仓库上游 Makefile 的 test 目标即调用同一 Perl 驱动）
upstream_check_command: "make test (tests/harness -tests=ALL)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "perl tests/harness -tests=ALL -cc=<ohos-clang> -cflags=\"-O2 -g\" -make=make"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/harness
    source: xa-2.4.1/tests
    description: "上游 Perl 测试驱动：逐目录执行 44 个回归用例（35 个自带 test Makefile 的目录 + 9 个 test.s/预期 o65 二进制比对的目录），覆盖寻址模式、预处理器/宏、段与重定位、o65 链接（ldo65）、重定位（reloc65）、列表输出、错误诊断等；hextool 对产物做逐字节 hex 比对"
    command: "perl tests/harness -tests=ALL"
    upstream_total: 44
    executed: 44
    passed: 44
    blocked: 0
    status: "PASS —— OHOS 设备 44/44 全部通过（n=44，无宿主不兼容用例）；唯一改动为 Perl shebang 可移植性补丁（patches/0001、0002），未修改任何断言或期望产物"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xa.sh
    description: "功能测试：六个二进制 --version、xa 用法与版本、原始汇编逐字节比对、未定义标签诊断与非零退出码、o65 对象生成与 file65 检查、-l 标签表、ldo65 链接、reloc65 重定位、uncpk 归档创建/列表/解包往返、printcbm BASIC 反汇编（12 条断言，真实执行已安装二进制）"
    command: "sh test_xa.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
