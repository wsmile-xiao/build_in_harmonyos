software: xa
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.4.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.floodgap.com/retrotech/xa/dists/xa-2.4.1.tar.gz"

  # 源码校验和
  sha256: "63c12a6a32a8e364f34f049d8b2477f4656021418f08b8d6b462be0ed3be3ac3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "LD=clang"
    - "CFLAGS=-fPIC -O2 -g"
    - "LDFLAGS=-lc"
    - "PREFIX=$DEFAULT_PREFIX"
    - "DESTDIR=$TEST_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "xa Makefile hardcodes CC=gcc/LD=gcc; need to override with CC=clang/LD=clang for OHOS (ref:E090)"
  - "xa Makefile uses DESTDIR as PREFIX (non-standard); need to rename to PREFIX and add proper DESTDIR for staging (ref:E090)"
  - "Test harness uses #!/usr/bin/perl which doesn't exist on HMDFS; test suite partial (ref:E051)"
  - "xa has no configure script, it's a plain Makefile project; need hints/configure dummy script (ref:E090)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/xa-2.4.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/xa-2.4.1.work
  source_orig_hash: 195c943fe484ffc0
  source_work_hash: d41042388c999240
  generated_at: '2026-06-15T10:35:53'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending  #ifdef __OHOS__ (Makefile 项目需 hints/configure dummy script)'
