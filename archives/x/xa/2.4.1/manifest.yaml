# 知识沉淀
knowledge_gained:
  - "OHOS 无 /usr/bin/perl，且内核对 `#!/usr/bin/env perl -s` 把 `perl -s` 作为单个参数传给 env(1)，toybox env 无法拆分——Perl 脚本 shebang 必须改为 `#!/usr/bin/env perl` 并在脚本内自行解析 -s 开关（E037/E049 同类）"
  - "GitHub tag 归档 xa65-xa-2.4.1 为 README + xa/ 两级布局，需在 source() 中提升子目录，否则 make 与补丁目标路径全部错位"
  - "上游 install 目标依赖 install(1)，OHOS/toybox 无此命令——package() 应直接 copy 产物"
  - "上游 44 例 Perl 回归在 OHOS 设备全通过（hextool 逐字节比对），无宿主不兼容用例"

