# 软件级 manifest — xa
software: xa
display: "xa"
description: "6502/R65C02/65816 交叉汇编器及 o65 链接/重定位工具链"
category: utility
homepage: "https://github.com/fachat/xa65"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 ANSI C + POSIX Makefile，零平台补丁即可用 OHOS SDK clang 交叉编译"
    - "零第三方依赖（仅链接系统 libc）"
    - "上游 GitHub tag 归档为 README + xa/ 两级布局，source() 提升 xa/ 为工程根"
    - "上游 44 例 Perl 回归在 OHOS 设备 44/44 通过；仅 2 个测试脚本 shebang 可移植性补丁（脚本内复刻 -s 解析），断言零改动"
    - "上游 install 目标依赖 install(1)（OHOS 无），package() 直接 copy 六个二进制与 6 份 man 手册"
  common_dependencies: []

versions:
  "2.4.1":
    status: built
    build_date: "2026-09-18"
    conan_ref: "xa/2.4.1"
