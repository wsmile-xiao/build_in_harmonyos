software: xcursorgen
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.9"

# 构建系统
build_system: autotools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.freedesktop.org/xorg/app/xcursorgen/-/archive/xcursorgen-1.0.9/xcursorgen-xcursorgen-1.0.9.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "HELP2MAN=/bin/true"
    - "MAKEINFO=/bin/true"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libXcursor/1.2.3
    - libpng/1.6.44
    - xproto/7.0.31

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS上config.status umask 077+SGID导致Permission denied，需将umask 077改为umask 002"
  - "GitLab archive源autautotools项目需要autoreconf -fvi生成configure脚本"
  - "lld链接器需要正确的LD_LIBRARY_PATH顺序（ohos-sdk llvm/lib优先于usr/local/lib）"
