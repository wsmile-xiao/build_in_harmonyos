# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xylib/1.6
homepage: "https://github.com/wojdyr/xylib"

# 上游源码审计：xylib 1.6 官方发布 tarball 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码树 (xylib-1.6 tar.bz2 GitHub release)"
    reason: "无 tests/、test/ 目录；全部源码为 xylib/ 下的格式解析器与 xyconv.cpp 主程序，无测试文件。"
  - source: "Makefile.am"
    reason: "仅有 bin_PROGRAMS=xyconv 与 xylib/Makefile.am 的 lib_LTLIBRARIES=libxy.la 安装规则，无 check/test 目标、无 TESTS 变量、无 check_PROGRAMS。"
  - source: "configure.ac"
    reason: "仅做编译器/头文件/库探测（AC_PROG_CXX、AC_CHECK_HEADER boost/zlib/bzlib、AC_CHECK_LIB）与可选的 wxWidgets 检测，无测试宏。"
  - source: "CMakeLists.txt"
    reason: "仅定义 add_library/add_executable/install 目标，无 enable_testing()、无 add_test()。"
  - conclusion: "上游 1.6 未提供自动化测试；由 test_package 执行消费者视角的真实 C API 校验（版本/格式表/文本数据解析）。"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
# 上游无 check/test 目标，无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无官方测试套件；验证手段为 test_package 对打包库的真实 C API 调用。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_xylib.c"
    description: "消费者测试真实链接 libxy 并调用公共 C API：xylib_get_version() 返回 1.6.x、格式表注册 10+ 格式、xylib_load_file() 解析 sample.txt 文本数据并校验 block/列/行数与数据值"
    command: "./test_xylib"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
