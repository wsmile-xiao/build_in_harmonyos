software: xylib
# 版本级 manifest
# 文件位置: archives/x/xylib/1.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"

# 构建系统 (top-level field for checklist)
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/wojdyr/xylib/releases/download/v1.6/xylib-1.6.tar.bz2"

  # 源码校验和
  sha256: "b641cb33fa01732b8203356e0978384f9551bf415cfbae5989b3a233b3cb0ec7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--without-gui"
    - "--enable-static"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.90.0.4
    - zlib/1.3.1.1
    - bzip2/1.0.8

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-config-umask.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.guess/config.sub 需识别 linux-ohos triplet（aarch64-unknown-linux-ohos）"
  - "configure 需用 bash（CONFIG_SHELL）执行，OHOS /bin/sh 为 mksh"
  - "GUI 依赖 wxWidgets，HarmonyOS 未提供，用 --without-gui 关闭"
  - "zlib/bzip2 为可读压缩源文件的可选依赖；boost 为纯头文件依赖"
