# 软件级 manifest
# 文件位置: archives/x/xylib/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: xylib

# 显示名
display: "Xylib"

# 一句话描述
description: "读取粉末衍射、光谱等实验数据的 x-y 数据的 C++ 库"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/wojdyr/xylib"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "config.guess/config.sub 需识别 linux-ohos triplet（aarch64-unknown-linux-ohos）"
    - "configure 需用 bash（CONFIG_SHELL）执行，OHOS /bin/sh 为 mksh"
    - "GUI（xyconvert）依赖 wxWidgets，HarmonyOS 未提供，用 --without-gui 关闭"
    - "Boost 仅作头文件依赖（spirit/property_tree/cstdint/shared_ptr 等）"
    - "zlib/bzip2 为可读压缩源文件的可选依赖"

  # 跨版本通用依赖
  common_dependencies:
    - boost
    - zlib
    - bzip2

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.6":
    status: built
    build_date: 2026-09-18
