# 版本级 manifest — xev 1.2.7
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.7"
software: "xev"

# 编译状态: published | built | failed | archived
# PR 阶段尚未由 release 流水线 upload 到制品仓，真实状态为 built
status: built

build_date: "2026-09-24"
build_system: autotools

# 源码信息（url 与 conandata.yml 首条官方 URL 一致）
source:
  url: "https://xorg.freedesktop.org/pub/individual/app/xev-1.2.7.tar.gz"
  sha256: "e75e35e225acdfe648a73e75aedabccf47f46bdab6590f43428be97b2876b94e"
  tar_format: tar.gz

# 构建配置
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "XEV_CFLAGS=<conan 依赖 include 目录集合>"
    - "XEV_LIBS=<conan 依赖 lib 目录集合> -lXrandr -lX11"
  dependencies:
    - "libx11/6.4.0"
    - "libxrandr/1.5.5.1"
    - "libxcb/1.16 (run)"
    - "libxau/1.0.11 (run)"
  cc: clang
  cxx: ""

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "xev 仅链接 Xlib + XRandR（configure.ac PKG_CHECK_MODULES(XEV,[xrandr x11 xproto])），无 Xt/Xmu/Xi/SM/ICE，比 xeyes 简单：全部走 ohpcd 已发布 conan 依赖（libx11/6.4.0 + libxrandr/1.5.5.1，后者钉 libxext/6.4.0 libxrender/0.9.12 xorgproto/2025.1），无 vendored 库、无 x11include 头树"
  - "构建系统选型：上游 tarball 同时带 autoconf 2.73 预生成 configure 与 meson.build。选 autotools——预生成 configure 使本机缺 automake/autoconf 无关紧要，显式 --host=aarch64-unknown-linux-ohos 绕开不识别 ohos 的 config.guess（config.sub 已支持 linux-ohos*）；meson 路线需在 OHOS worker 证明 meson+ninja 可用，风险更高，全部 X 应用先例走 autotools"
  - "PKG_CHECK_MODULES 逃逸口 XEV_CFLAGS/XEV_LIBS 预置即跳过 pkg-config（同 xeyes XEYES_CFLAGS），include/lib 目录从 conan host 依赖动态收集（含传递的 xorgproto 协议头 X11/extensions/randr.h）"
  - "xev -version/--version/-help/非法选项四条路径均早于 xev.c 第 1384 行 XOpenDisplay 返回，无 X server 可真实执行；PACKAGE_STRING=\"xev 1.2.7\"（AC_INIT，meson 亦同）"
  - "运行期 libXrandr.so.2 的 DT_NEEDED 闭包 = libX11.so.6+libXext.so.6+libXrender.so.1，libX11.so.6 再需要 libxcb.so.1+libXau.so.6（libxcb→libXau/libXdmcp）；test_package 以 LD_PRELOAD 绝对路径链兜底（HMBS [stale_runtime_library]），conanrun 环境注入 LD_LIBRARY_PATH 双保险"
  - "上游无测试套件：Makefile.am 无 check/TESTS、meson.build 无 test()、源码树无 tests/、xev.c 无 assert()（grep -c=0），MANIFEST.yml 显式审计 upstream_tests_exist: false"
