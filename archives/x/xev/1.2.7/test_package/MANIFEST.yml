# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: xev/1.2.7
homepage: "https://gitlab.freedesktop.org/xorg/app/xev"

# 上游源码审计（hmbs 硬门禁）：xev 1.2.7 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am"
    reason: "仅声明 bin_PROGRAMS = xev 与 SUBDIRS = man；无 TESTS/check_PROGRAMS/check-local 目标，make check 无任何用例。"
  - source: "meson.build"
    reason: "仅 executable('xev', ...) + custom_target(man page)；无 test() 调用。"
  - source: "configure.ac"
    reason: "仅 PKG_CHECK_MODULES(XEV, [xrandr x11 xproto]) 与 AC_CONFIG_FILES；无测试相关宏或 AC_CONFIG_TESTDIR。"
  - source: "源码树 / xev.c"
    reason: "发布包无 tests/、test/ 目录，无 *_test 源文件；xev.c 中 grep -c 'assert(' = 0，无任何运行时断言型用例。"
  - conclusion: "上游未提供自动化测试套件；由 test_package 真实执行被测二进制（-version/--version/-help/非法选项）验证。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_xev.sh
    description: "真实执行 xev 的 4 条早于 XOpenDisplay（xev.c 第 1384 行）的命令行路径：-version 与 --version 校验 PACKAGE_STRING 含 'xev 1.2.7' 且退出码 0；-help 校验 usage banner 且退出码 0；非法选项 -Zz 校验以非 0 退出并打印 usage。全部无需 X server（R34 实质执行被测包）。xev 链接 conan 依赖 libXrandr/libX11，其 DT_NEEDED 闭包（libXext/libXrender/libxcb/libXau/libXdmcp）经 conanrun 环境 LD_LIBRARY_PATH + test_package 从依赖包取实体 .so 绝对路径 LD_PRELOAD 注入（HMBS [stale_runtime_library]）双重保证运行期寻库；脚本以 HMBS 注入 SHELL=/bin/sh 执行（HMBS [shell_getcwd]，POSIX sh 兼容，同 xeyes/xidle 已过门禁模式）。"
    command: "$SHELL test_xev.sh <package>/bin/xev <LD_PRELOAD_libs>"

assertion_count: 4
