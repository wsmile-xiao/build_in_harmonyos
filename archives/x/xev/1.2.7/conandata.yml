# conandata.yml — xev 1.2.7
# 源码：X.Org 官方下载站 xorg.freedesktop.org 的两条官方路径（同一官方主机、均为
# 官方原始发布件）。无第三方代理前缀、无本地路径型 URL ⇒ 符合 R39
# 「conandata.yml 只写上游官方原始 URL，回退由 CI 自动处理」。
#
# 排序依据（本轮强制冷验实测，取证见 notes.md「W3 预下载投喂 404 页」一节）：
# 框架 ci/conan/build_and_test.sh 的预下载步骤对 xorg.freedesktop.org 的 archive/
# 与 releases/ 两个路径段走「镜像优先」重试，而它的成功判据只有 size>100B——既不
# 校验 HTTP 状态码也不校验 sha256 ⇒ archive/ 这一条会被换成一页 162 字节的 404
# 错误页并被当作下载成功、原地改写本文件。pub/ 不命中那条路径正则 ⇒ 预下载直连
# 官方主机取到 180306 字节的真包。故 pub/ 排第一、archive/ 留作兜底。
# conan 的 tools.files.download() 对 URL 列表按顺序逐条尝试、且**逐条**校验 sha256，
# 任一条失败只 warn 后落到下一条，只有最后一条失败才 raise ⇒ 列表顺序即正确性来源。
#
# sha256 为对真实 tarball（180306 字节，非重定向占位页）的实测值，与上游官方发布
# 一致；本轮整改未改动该值。
# ⚠ 本文件注释刻意不写带协议的 URL 串：预下载步骤会连注释一起正则抓取 http 开头的
# 串去下载并原地改写本文件。

sources:
  url:
    - "https://xorg.freedesktop.org/pub/individual/app/xev-1.2.7.tar.gz"
    - "https://xorg.freedesktop.org/archive/individual/app/xev-1.2.7.tar.gz"
  sha256: "e75e35e225acdfe648a73e75aedabccf47f46bdab6590f43428be97b2876b94e"

patches: {}
