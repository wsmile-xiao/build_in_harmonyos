software: xworld
display: "xworld"
description: "X11 globe viewer — real-time Earth observation from the Sun's direction"
category: gfx
homepage: "https://pkg.freebsd.org/local-distfiles/naddy/xworld-2.0.tar.gz"
license: BSD-4-Clause
build_system: custom

ohos_adaptation:
  key_points:
    - "Hand-written Makefile.in (not autoconf) — all variables passed on command line"
    - "compile_world.c needs <stdlib.h>/<unistd.h> for implicit function declarations"
    - "pad.c needs <stdlib.h> for exit()"
    - "X11/Xatom.h lives in xorgproto, not libx11 — must require xorgproto explicitly"
    - "Binary = ELF + appended world.o data segment, mmap self-loading at runtime"
    - "safe-delete shim intercepts rm — use RM=true to bypass"
  common_dependencies: []

versions:
  "2.0":
    status: built
    build_date: "2026-09-23"
