# 官方发布点：tar 包内自带的 xringd-1.20.lsm 记
#   Primary-site:    sunsite.unc.edu /pub/Linux/system/Network/daemons  23k xringd-1.20.tgz
#   Alternate-site:  dolphin.doc.ic.ac.uk /pub/Linux/xringd            （DNS 已不解析）
# 作者主页 www.doc.ic.ac.uk/~ah/ 实测 404（vm-wwwhomes 上个人目录已清）。
# ibiblio.org 就是 Sunsite 档案的现存主机；实测该目录 xringd 相关只有
#   xringd-1.10.{lsm,tgz} / xringd-1.20.{lsm,tgz}，没有免 gzip 的 .tar 变体。
# 下面 sha256 是**官方 tarball 原件**的哈希：curl 连续 3 次采样同值，且与
# Debian 池 xringd_1.20.orig.tar.gz 实测同值（同一文件），另 ftp:// 端亦同值。
#
# ⚠ 该站把这个**已经 gzip 过**的 .tgz 又声明了 `content-encoding: x-gzip`
#   （Apache AddEncoding 误配；www.ibiblio.org / ibiblio.org / http 三种写法实测都带）。
#   conan 的下载通道会按声明透明解压，落地变成 102400 B 的纯 tar
#   （sha256 d72967ed22c6a9d6f7a394e78a1699580398a6a28299d11ee7f88abe2cee370e），
#   于是 sha256 校验必然报红。⇒ 配方 source() 里按既有机理做 urllib 原始字节回退
#   （urllib 不做 Content-Encoding 解码），哈希仍取官方原件这一串，不换镜像、不改哈希凑数。
#   机理先例：knowledge/drafts/DRAFT-conan-downloader-xgzip-content-encoding
sources:
  - url: "https://www.ibiblio.org/pub/linux/system/network/daemons/xringd-1.20.tgz"
    sha256: "3ecfa6fa8b871b6d92168370fdfab1bf48a90ddbf10a738f384def3b07a1b77f"

patches:
  - patch_file: "patches/0001-uartcount-include-fcntl-h.patch"
    patch_description: "uartcount.c 缺 <fcntl.h>：现代 libc 不再由 termios.h 传递引入 O_RDONLY/O_NONBLOCK/O_NOCTTY，原样编译报 use of undeclared identifier"
    patch_type: "portability"
