package: xringd/1.20
homepage: https://www.ibiblio.org/pub/linux/system/network/daemons/

# 上游零测试用例（一手清点：Makefile 目标只有 xringd/install/dist/uartcount/clean，
# 无 check/test 目标；包内亦无任何 test/check 文件）。
upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: null
upstream_tests: []

test_package_tests:
  - file: test_xringd.py
    description: "真跑 bin/xringd 与 bin/uartcount 的命令面：交付物落位与可执行位、产物 ELF/AArch64 校验、-h 与未知选项的 usage 退出码、配置解析真执行（-c ... -n 走 ringsm_parse 的 syntax ok 路径、非法配置报出错行号、缺配置报错），以及串口设备面缺失下的真实失败形态（open ENOENT、非串口节点上 TIOCGICOUNT 被拒）。守护/可阻塞调用一律套 20s timeout，超时按 FAIL 记账。"
    command: "python3 test_xringd.py <package_folder>"

assertion_count: 33
