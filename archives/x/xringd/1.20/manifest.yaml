knowledge_gained:
  - {knowledge: "ibiblio 把已经 gzip 过的 .tgz 又声明 content-encoding: x-gzip：conan 下载通道按声明透明解压，同一 URL 出现 31787B(gzip)/102400B(纯tar) 两种字节形态，sha256 从 3ecfa6fa 变 d72967ed；urllib 不解码故可回退取原始字节保住官方哈希", knowledge_ref: "knowledge/drafts/DRAFT-conan-downloader-xgzip-content-encoding（同根因；该条症状是尺寸<Content-Length 报传输中断，本包是尺寸>声明值⇒校验放行后由 sha256 报红，属第二症状面）"}
  - {knowledge: "上游 Makefile 的 install 目标两行都写成 `-install -o root -g bin ...`：行首 '-' 吞掉非 root 失败 ⇒ 目标执行成功却什么都没装（静默空交付）；且本设备实测没有 install 工具（which install 退出码 1）。⇒ package() 不跑 make install，改显式装配", knowledge_ref: "knowledge/drafts/DRAFT-fusion-1.3.3-cmake-no-install-rule-manual-package（同一后果族：依赖上游 install 会静默打成空包；根因不同，该条是上游无 install 规则）"}
  - {knowledge: "1996 年老 tarball 会把预编译产物连同源码一起打包：xringd-1.20.tgz 内含与 make 目标同名的 xringd/uartcount 两枚 32-bit LSB 386 ELF（/lib/ld-linux.so.1, stripped），是否被 make 判为已最新取决于双方 1997 年 mtime 先后，属不确定行为，一旦跳过即把外来架构二进制当交付物", knowledge_ref: "无（按 knowledge 四面精确短语检索 0 命中对口条目；本包一手实测并在 build() 内构建前显式清除）"}
  - {knowledge: "上游 CFLAGS 里的架构专属旋钮 -m486 在本平台是硬失败：clang-15 交叉与本机两种调用都报 unknown argument: -m486（退出码 1）。用 make 命令行变量覆盖 CFLAGS/LDFLAGS 即可去掉，且 $(DEFS) 由 make 自身展开，不改 Makefile（R6）；同处去掉链接期 -s 以免产物被 strip 后遭 OHOS 内核 MAC 拒 exec", knowledge_ref: "无（m486 与「架构专属」在知识库 0 命中；先例参照 archives/a/abduco/0.6 的 STRIP=true 同坑处置）"}
  - {knowledge: "xringd 运行面要串口 Ring-Indicator：编译期内置 /dev/modem，实跑 open() 直接 ENOENT，且 /dev/ttyS* 与 /dev/ttyUSB* 本机均不存在，/dev 面无串口节点 ⇒ 属平台能力缺失非适配缺陷；交付口径按「编译 + 静态 + 真实失败形态」申报，不宣称功能可用", knowledge_ref: "knowledge/graph/E485（OHOS 无硬件环境下的外设依赖处置，avarice/libusb 先例）"}
  - {knowledge: "上游零测试用例的一手清点依据：Makefile 目标只有 xringd/install/dist/uartcount/clean（无 check/test），包内也无任何 test/check 文件 ⇒ 申报 total=0 而非「上游测试全通过」", knowledge_ref: "knowledge/doc/E259（上游无用例时的如实申报口径）"}
