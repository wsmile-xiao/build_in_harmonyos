# conandata.yml — xfsprogs 7.2.0
# 源码为 kernel.org 官方发布 tarball（sha256 与官方 sha256sums.asc 一致）

sources:
  url: "https://www.kernel.org/pub/linux/utils/fs/xfs/xfsprogs/xfsprogs-7.2.0.tar.xz"
  sha256: "501dfa363cd8e19997a4a1a71f70ded88241b45e9db233e8875c23b80520cc83"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: 识别 HarmonyOS（输出 aarch64-unknown-linux-ohos）"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: 增加 ohos-linux 三元组与 linux-ohos 内核组合"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: 临时目录 umask 077→022（HMDFS 下 0700+setgid 目录不可写）"
    patch_type: "portability"
  - patch_file: "patches/0004-doc-Makefile.patch"
    patch_description: "doc/Makefile: gzip --best→-9（toybox gzip 不支持 --best）"
    patch_type: "portability"
  - patch_file: "patches/0005-include-fsmap_compat.h.patch"
    patch_description: "新增 include/fsmap_compat.h：补齐 OHOS SDK 缺失的 fsmap UAPI inline 函数"
    patch_type: "portability"
  - patch_file: "patches/0006-install-sh.patch"
    patch_description: "install-sh: shebang→/bin/sh；id(1) 缺失时 REAL_UID 回退；CHOWN 判断可移植化"
    patch_type: "portability"
  - patch_file: "patches/0007-io-fsmap.c.patch"
    patch_description: "io/fsmap.c: 改用 fsmap_compat.h"
    patch_type: "portability"
  - patch_file: "patches/0008-io-healthmon.c.patch"
    patch_description: "io/healthmon.c: case 标签后声明上移（clang 15 不支持 C23 语法）"
    patch_type: "portability"
  - patch_file: "patches/0009-mkfs-proto.c.patch"
    patch_description: "mkfs/proto.c: 本地实现 xfs_reallocarray（OHOS libc 无 reallocarray）"
    patch_type: "portability"
  - patch_file: "patches/0010-scrub-spacemap.c.patch"
    patch_description: "scrub/spacemap.c: 改用 fsmap_compat.h"
    patch_type: "portability"
  - patch_file: "patches/0011-spaceman-freesp.c.patch"
    patch_description: "spaceman/freesp.c: 改用 fsmap_compat.h"
    patch_type: "portability"
