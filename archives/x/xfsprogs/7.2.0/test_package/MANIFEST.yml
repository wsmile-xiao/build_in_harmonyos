# test_package/MANIFEST.yml
package: xfsprogs/7.2.0
homepage: "https://xfs.wiki.kernel.org/"

# 上游测试命令（清点证据见 notes.md「上游测试清点（R51）」：
# in-tree 无测试套件，`make -n check` 报 "No rule to make target 'check'"；
# 上游功能测试在独立仓库 xfstests-dev，需要真实块设备，CI 不可行。
# 故 upstream_check_command 留空——上游不存在可执行的 check 目标）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无 in-tree 测试，故为空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: smoke.sh
    description: "R34/R53: 运行打包工具版本探针（mkfs.xfs/xfs_db/xfs_repair/xfs_io/xfs_spaceman -V，rc=0）"
    command: "sh smoke.sh <package>/sbin"
  - file: conanfile.py
    description: "R53: AArch64 ELF 校验（e_machine=0xB7，逐工具断言）"
    command: "conan test (test())"

# 测试断言总数: 5 工具 × 2 项 ELF 断言 + 5 次工具实跑 rc=0 = 15
assertion_count: 15
