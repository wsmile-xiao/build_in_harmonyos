    lines_changed: 2
  - file: 0011-spaceman-freesp.c.patch
    purpose: spaceman/freesp.c 改用 fsmap_compat.h
    lines_changed: 2

compatibility:
  level: low
  issues:
    - "NLS 本地化消息关闭（平台无 msgmerge，制品仓 gettext 包仅 libintl 无工具）"
    - "xfs_scrub 未启用 libicu（上游 probe 可选项，unicode 名称扫描关闭）"
  notes: "全部工具静态链接（readelf -d: NEEDED 仅 libc.so）；未在真机执行真实格式化/修复操作（安全考虑，-V 冒烟为安全子集）"

test_results:
  type: manual
  passed: 12
  failed: 0
  note: |
    R51 上游 in-tree 无测试：`make -n check` → "No rule to make target 'check'"（N=0/N'=0）
    R53 test_package 断言 15：5 工具 AArch64 ELF 校验（e_machine=0xB7）×2 + 5 工具 -V 实跑 rc=0
    探索期冒烟：12/12 工具 -V rc=0（mkfs.xfs/xfs_db/xfs_repair/xfs_io/xfs_copy/xfs_logprint/
    xfs_growfs/xfs_spaceman/xfs_scrub/xfs_quota/xfs_rtcp/xfs_mdrestore）

knowledge_gained:
  - "config.guess 需补 HarmonyOS case（uname -s=HarmonyOS），直接判定 aarch64-unknown-linux-ohos"
  - "HMDFS/SELinux: (umask 077 && mktemp -d) 目录带 setgid 且 0700，owner 无法写入；configure umask 022"
  - "xfsprogs autotools 规则（%.o 与 -MM）不使用 CPPFLAGS，依赖 include 必须注入 CFLAGS/CXXFLAGS"
  - "liburcu/libuuid 制品 .la libdir='//lib' 且 dependency_libs 指向不存在路径，libtool 链接必失败，消费侧需绕过 .la"
  - "configure 时注入 -luuid 会毒化 AC_CHECK_FUNCS(uuid_compare)，导致 builddefs 中 LIBUUID 为空"
  - "OHOS SDK linux/fsmap.h 缺 Linux UAPI 的 fsmap_sizeof/fsmap_advance inline 函数"
  - "OHOS libc 无 reallocarray；clang 15 不支持 case 标签后声明（C23）"
  - "toybox gzip 不支持 --best；install-sh shebang 为 #! /bin/bash 且 id(1)/chown(1) 缺失"
  - "平台无 msgmerge（gettext 仅 libintl），xfsprogs 用 --enable-gettext=no 关闭 NLS"
  - "hnp bash 5.3.0 在 PWD 缺失/陈旧时 getcwd 必失败（configure re-exec 到 CONFIG_SHELL 后报 working directory cannot be determined）；配方尾置 env 脚本将 CONFIG_SHELL/SHELL 重置为 /bin/sh 解决"

