# test_package/MANIFEST.yml — xstr 0.2.1
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。
# 详见 docs/TEST_QUALITY_SPEC.md

package: xstr/0.2.1
homepage: "https://projects.camlcity.org/projects/xstr.html"

# 上游测试套件存在性（经审计官方源码 tar 包确认）
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

# 上游测试审计（源码: xstr-0.2.1.tar.gz，官方 download.camlcity.org）
upstream_test_audit:
  source_tarball: "xstr-0.2.1.tar.gz (https://download.camlcity.org/download/xstr-0.2.1.tar.gz)"
  source_sha256: "796f77589af651d1bb627444fa48c76d887c97d98a58cb95913d86103fb168be"
  build_system: "makefile（纯 Makefile，非 autotools/cmake/meson）"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "tests/ / test/ 目录"
    - "ctest / meson test / make check 注册"
    - "Makefile 中 test/check 目标"
  scan_result: "tarball 共 16 项：3 个模块（xstr_split/xstr_search/xstr_match 各 .ml+.mli）+ Makefile + META + RELEASE + README + LICENSE + speed/（with_str.ml/with_xstr.ml/Makefile）。无 tests/ 或 test/ 目录；无 gtest/pytest 注册；Makefile 目标仅 all/opt/install/uninstall/clean/distclean/release/dist（无 check/test 目标）；speed/ 仅为 xstr 与 Str 的基准性能示例程序（含名为 test_* 的计时函数，但只计时不断言、不是测试用例）；无任何测试断言框架。"
  reason: "xstr 0.2.1 上游无测试套件：无 tests/ 目录、无 gtest/pytest/ctest 注册、Makefile 无 check/test 目标，speed/ 仅为性能基准示例，不含断言。按 no_tests 处理。"

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用库 API）
test_package_tests:
  - file: test_package/run_test.sh（驱动脚本）+ test_package/test.ml（OCaml 断言程序）
    description: "run_test.sh 设好 PATH/OCAMLLIB/CAML_LD_LIBRARY_PATH，用 ocamlc 链接 xstr.cma 编译 test.ml，再用 ocamlrun 运行；test.ml 真实调用 Xstr_search（contains_substring/index_of_substring/rindex_of_substring/indexlist_of_substring/rev_concat）、Xstr_split（split_string）与 Xstr_match（match_string）断言已知结果"
    command: "sh run_test.sh <ocaml-bin> <ocaml-lib> <stublibs> <lib/xstr> test.ml test_probe test_result.txt"
    assertions: 9

harmonyos_specific_tests: []

# 测试断言总数（test.ml：9 条 CHECK 断言）
assertion_count: 9
