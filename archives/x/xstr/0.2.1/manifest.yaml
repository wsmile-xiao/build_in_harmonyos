# 版本级 manifest — xstr 0.2.1
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-version.yaml

version: "0.2.1"
software: "xstr"
status: built
build_date: "2026-09-18"
build_system: "makefile"

source:
  url: "https://download.camlcity.org/download/xstr-0.2.1.tar.gz"
  sha256: "796f77589af651d1bb627444fa48c76d887c97d98a58cb95913d86103fb168be"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - ocaml/4.14.1.1.4
  cc: ocamlc
  cxx: ""

patches_applied:
  - patch: (内置) conanfile.py _apply_source_fixes Python 就地编辑
    description: "修复上游 OCaml>=4.06 不可变 string 引起的一批类型不匹配：xstr_search.rev_concat 与 xstr_match.replace_matched_substrings 把 String.create(bytes) 缓冲返回给 .mli 声明的 string，xstr_match.set_as_string 用 String.make(string) 后 s.[i]<- 原地写（要求 bytes）。分别改 Bytes.make + Bytes.to_string 使 .ml 与 .mli 一致并通过 ocamlc 编译；以 Python 就地编辑实现，不依赖外部 patch 二进制"

knowledge_gained:
  - "xstr 是纯 OCaml 字符串处理库（search/replace/split/match，线程安全），非 C/C++"
  - "构建系统为纯 Makefile：make all 生成字节码 xstr.cma，make opt 生成本机 xstr.cmxa + libxstr.a"
  - "OCaml 工具链（ocamlc/ocamlopt/ocamldep）来自 ocaml/4.14.1.1.4 Conan 依赖包的 bin/，须注入 PATH（R33）"
  - "上游 make install 依赖 ocamlfind（findlib），制品仓未打包；按 README『无 findlib 时手动拷贝』改为把 .cmi/.cma/.cmxa/.a/META 拷入 lib/xstr/"
  - "Makefile include depend 首次构建自动调用 ocamldep 生成依赖文件，需 ocaml bin 在 PATH 中"
  - "ocamlc 默认按编译期嵌入的 --prefix 找 stdlib，Conan 缓存目录不一致时需显式设 OCAMLLIB 指向 ocaml 包 lib/ocaml/（否则报 Unbound module Stdlib）"
  - "上游 xstr 0.2.1 存在源码缺陷：xstr_search.ml 的 rev_concat 用 String.create 构造 bytes 缓冲返回，但 .mli 声明为 string；OCaml>=4.06 string 不可变，编译即报 implementation/interface 不匹配，需补丁将缓冲转回 string"
  - "上游无测试套件：无 tests/ 目录、Makefile 无 check/test 目标，speed/ 仅为基准示例，按 no_tests 显式审计"
