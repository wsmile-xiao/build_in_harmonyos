# 软件级 manifest — xstr
# 遵循 ARCHIVE-SPEC
# 文件位置: archives/x/xstr/manifest.yaml

software: xstr

display: "xstr"

description: "纯 OCaml 的函数式字符串搜索/替换/切分/匹配库（线程安全，Str 子集替代）"

category: library

homepage: "https://projects.camlcity.org/projects/xstr.html"

license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "OCaml 工具链（ocamlc/ocamlopt/ocamldep）来自 ocaml/4.14.1.1.4 Conan 依赖包，须注入 PATH"
    - "纯 Makefile：make all 生成字节码 xstr.cma，make opt 生成本机 xstr.cmxa + libxstr.a"
    - "上游 make install 依赖 ocamlfind，未打包；改为手动拷贝 .cmi/.cma/.cmxa/.a/META 到 lib/xstr/"
    - "上游无测试套件（speed/ 仅为基准示例），按 no_tests 显式审计"
  common_dependencies:
    - ocaml

versions:
  "0.2.1":
    status: built
    build_date: 2026-09-18
