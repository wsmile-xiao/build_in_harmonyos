# test_package/MANIFEST.yml — xmill 0.8
# 上游测试来源声明
# 参考: ARCHIVE-SPEC.md §2 test_package/ 规范 + ci/conan/build_and_test.sh L1 检测逻辑

package: xmill
version: "0.8"

# 上游构建系统与测试入口
upstream:
  build_system: cmake
  # 测试类型: make_check | ctest | meson_test | pytest | none
  # 上游（AT&T Labs XMill，镜像 jungsagacity/xmill）**没有自动化测试套件**：
  #   - 无 *test*/*spec* 文件，无 ctest/BUILD_TESTING/add_test/pytest 注册
  #   - 唯一入口是 CLI 本身：xmill/src/Main.cpp 的 main() + Options.cpp:PrintUsage()
  #   - 随包只携带示例数据：xmill/sprot1_2.xml (12,891,059 B) 与 xmill/sprot1_2.xmi
  test_type: none
  test_command: "xmill <file.xml>   /   xdemill <file.xmi>   # 手工端到端入口，无自动化套件"
  test_directory: "xmill/"
  # 上游示例数据（本任务逐项执行的“上游样例”）
  upstream_samples:
    - "xmill/sprot1_2.xml"   # 12,891,059 B SWISS-PROT XML 样例
    - "xmill/sprot1_2.xmi"   # 34,392 B，上游自带的对应压缩件

# OHOS 平台兼容性
ohos_compatibility:
  status: full
  detail: "自建端到端测试 20/20 通过：上游样例 sprot1_2 压缩结果与上游自带 .xmi 逐字节一致（sha256 f6e1a0ff…），两个 .xmi 解压均可字节级还原原 XML（sha256 b98e10f2…）"
  known_failures: []

# Conan test_package 测试（L1 冒烟，CI 通过 conan create 自动执行）
conan_test:
  type: executable
  description: "调用包内 bin/xmill 与 bin/xdemill 做压缩/解压回环；含 2 项鸿蒙特有断言（AArch64 ELF + musl 加载器、无 libz.so 运行期依赖）"
  test_method: "bash test.sh"
  test_count: 7
