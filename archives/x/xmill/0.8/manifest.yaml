# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "LP64 陷阱：字面量掩码 0xFFFFFFFC 用于指针对齐时在 aarch64 上截断 64 位指针（buf=0x5983e553c0 -> curptr=0x83e553c0），解压器 SIGSEGV；对齐必须用 ~(unsigned long)3  ref: DRAFT-XMILL-08-LP64-LITERAL-POINTER-MASK-TRUNCATION"
  - "MSVC-only 上游（.sln/.vcproj、无构建系统）移植 POSIX 的头文件面四连：extern int errno 链接失败、非 WIN32 分支缺 <stdio.h>、反斜杠 include、C++17 删除 register  ref: DRAFT-XMILL-08-MSC-ONLY-UPSTREAM-POSIX-HEADER-SURFACE"
  - "conanfile.py 的 generate() 必须同时产出 CMakeDeps，否则 find_package 会命中宿主同名库（.harmonybrew 的 ZLIBConfig.cmake）并链进动态 libz.so.1，编译期零报错  ref: DRAFT-XMILL-08-CONANDEPS-MISSING-HOST-LIB-SHADOWING"
  - "编译全绿但 CLI 不可用：镜像把 main() 换成忽略 argv 的硬编码调试驱动；LabelDict::PrintLabel 在压缩器侧解引用 NULL 的解压字典导致 -v 段错误  ref: DRAFT-XMILL-08-UPSTREAM-CLI-DEFECTS-INVISIBLE-TO-BUILD"
  - "conan get() 依据 URL 后缀选择解包器：codeload 直链无 .tar.gz 后缀被当成 zip（BadZipFile）；改用 github.com/<o>/<r>/archive/refs/heads/<b>.tar.gz  ref: DRAFT-XMILL-08-MSC-ONLY-UPSTREAM-POSIX-HEADER-SURFACE"
  - "conan 的 apply_conandata_patches 要求新增文件补丁头部为 '--- /dev/null'，工具生成的 '--- a/<file>' 会被判 source file does not exist  ref: DRAFT-XMILL-08-MSC-ONLY-UPSTREAM-POSIX-HEADER-SURFACE"
  - "HMDFS 只读 /tmp（E002）：测试脚本的工作目录必须落在当前目录或 $HOME/tmp 下  ref: E002"
  - "CMake 不识别 HarmonyOS 目标平台（G0 命中 E092）仅打印警告，本包不依赖平台模块；强行改写 CMAKE_SYSTEM_NAME 反而破坏 Conan settings 一致性  ref: E092"

