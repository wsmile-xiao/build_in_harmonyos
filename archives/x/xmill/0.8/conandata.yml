# conandata.yml — xmill 0.8
#
# 源码：AT&T Labs XMill 的镜像仓库快照
#   upstream: https://github.com/jungsagacity/xmill (branch master, 唯一分支，无 tag)
#   codeload: https://github.com/jungsagacity/xmill/archive/refs/heads/master.tar.gz
# AT&T 官方发布站点（www.research.att.com/sw/tools/xmill/）已下线且存档通道不可达，
# 该镜像为唯一可达上游（源码内含 AT&T 版权头与作者署名）。
# tarball sha256 固定，保证同版本可复现（镜像 master 为移动分支，故必须锁 hash）。
#
# 注意：请求版本号 0.8 无上游证据；该快照源码自述版本为 "XMill 0.7 (30 Nov 99)"
#       （xmill/src/Options.cpp:459）。详见 0.8/notes.md。

sources:
  url: "https://github.com/jungsagacity/xmill/archive/refs/heads/master.tar.gz"
  sha256: "9b9677de8f64a2ecbd345778175db3d8eab4b017460c83f05051e7584bb397a4"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "新增 CMakeLists.txt 构建面（上游只有 MSVC .sln/.vcproj，无 Makefile/CMake/configure），产出 xmill 与 xdemill 两个可执行文件"
    patch_type: "portability"
  - patch_file: "patches/0002-xmill-src-Compress.hpp.patch"
    patch_description: "zlib 头文件改用 <zlib.h>，消费 Conan 的 zlib/1.3.2 而非树内 vendored 副本"
    patch_type: "portability"
  - patch_file: "patches/0003-xmill-src-File.hpp.patch"
    patch_description: "删除手写的 'extern int errno;'（MSVC CRT 有全局 errno 符号），改为 #include <errno.h>；OHOS/musl 的 errno 是宏，链接期 undefined symbol: errno"
    patch_type: "portability"
  - patch_file: "patches/0004-xmill-src-LabelDict.hpp.patch"
    patch_description: "PrintLabel() 在压缩器侧不再解引用 NULL 的解压字典 labeldictlist（否则 xmill -v 段错误），改用压缩字典 LookupCompressLabel()"
    patch_type: "bugfix"
  - patch_file: "patches/0005-xmill-src-MemMan.hpp.patch"
    patch_description: "WordAlignMemBlock() 的 0xFFFFFFFC 是 32 位掩码，在 LP64 上截断指针导致 xdemill 段错误；改为按指针宽度取掩码"
    patch_type: "portability"
  - patch_file: "patches/0006-xmill-src-Output.hpp.patch"
    patch_description: "非 WIN32 分支缺少 <stdio.h>（上游依赖 MSVC 的 <io.h> 间接引入），FILE/stdout/fopen 未声明"
    patch_type: "portability"
  - patch_file: "patches/0007-xmill-src-XMLOutput.hpp.patch"
    patch_description: "移除 C++17 已删除的 register 存储类说明符"
    patch_type: "portability"
  - patch_file: "patches/0008-xmill-src-ZLib.cpp.patch"
    patch_description: "zlib 头文件由 Windows 风格 '..\\zlib\\zlib.h' 改为 <zlib.h>（反斜杠在 POSIX 上不是路径分隔符，直接 fatal error）"
    patch_type: "portability"
  - patch_file: "patches/0009-xmill-src-Main.cpp.patch"
    patch_description: "还原命令行入口：镜像把 main() 改成了忽略 argv、硬编码压缩 sprot1_2.xml 的调试驱动，导致 CLI 不可用；按 Options.cpp 既有的 PrintUsage()/HandleAllOptions() 接口还原，并把 (cond?destfile:\"\") 的三元表达式显式转成 char*"
    patch_type: "bugfix"
