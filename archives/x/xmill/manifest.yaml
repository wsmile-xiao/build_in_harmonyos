# 软件级 manifest — xmill
# 文件位置: archives/x/xmill/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: xmill
display: "XMill (XML compressor)"
description: "XMill - XML 结构化压缩器：按路径表达式把元素/属性/文本分流到独立容器再压缩，附 xmill 压缩与 xdemill 解压两个命令行工具"
category: compress
homepage: "https://github.com/jungsagacity/xmill"
license: "AT&T proprietary (non-commercial research use only)"

build_system: cmake

ohos_adaptation:
  key_points:
    - "上游只有 MSVC 工程（xmill.sln/xmill.vcproj），无任何 Makefile/CMake/configure，需补 CMakeLists.txt 构建面"
    - "镜像的 main() 被改成忽略 argv 的硬编码调试驱动，需按 Options.cpp 既有 PrintUsage()/HandleAllOptions() 还原命令行入口"
    - "LP64 陷阱：WordAlignMemBlock() 用 32 位掩码 0xFFFFFFFC 对齐指针，aarch64 上截断指针导致解压器 SIGSEGV"
    - "errno：手写 extern int errno; 在 musl 上链接失败，需 #include <errno.h>"
    - "Output.hpp 非 WIN32 分支缺 <stdio.h>；XMLOutput.hpp 用了 C++17 已删除的 register"
    - "conanfile.py 的 generate() 必须同时产出 CMakeDeps，否则 find_package(ZLIB) 会命中宿主其它 zlib 并链进动态 libz.so.1"
  common_dependencies:
    - zlib

versions:
  - version: "0.8"
    status: built
    build_date: "2026-10-01"
    conan_reference: "xmill/0.8"
    notes: "首次适配。产出 bin/xmill + bin/xdemill；上游样例 sprot1_2 压缩结果与上游自带 .xmi 逐字节一致，往返字节级还原；自建端到端测试 20/20，test_package 7/7（含 2 项鸿蒙特有用例）"
