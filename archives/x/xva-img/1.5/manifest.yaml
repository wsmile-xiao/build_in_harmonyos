# 版本级 manifest — xva-img 1.5
version: "1.5"
conan_ref: "xva-img/1.5"
software: "xva-img"
status: built
build_date: "2026-10-01"
build_system: cmake

source:
  url: "https://github.com/eriklax/xva-img/archive/refs/tags/1.5.tar.gz"
  sha256: "89667ea86a5ec8cbf670966eea9d758f4571a92004c798d8df3e1aa0eaea9235"
  tar_format: tar.gz

build:
  system: cmake
  configure_options: []
  dependencies:
    - openssl/3.5.8.1
    - xxhash/0.8.4
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-conan-cmake-deps.patch: Conan dependency targets, relocatable search paths, and CMake 4.x minimum version."

knowledge_gained:
  - "上游 CMakeLists 固定使用 /usr/local/include 和 /usr/local/lib；改用 Conan CMakeDeps/CMakeToolchain，并链接 openssl::openssl 与 xxhash::xxhash。Conan OpenSSL 配方以 openssl::openssl 暴露其静态库集合。"
  - "上游声明 CMake 3.0，而真机工具链为 CMake 4.1.2；将最低版本调整到 3.10。"
  - "官方 1.5 归档没有测试目录或测试目标；MANIFEST 记录 no_tests，由消费者测试执行真实 CLI 和磁盘往返。"
  - "HarmonyOS PC 要求可执行 ELF 使用 binary-sign-tool 签名；package() 在安装后去除 SDK 占位 .codesign 并签名 xva-img，test_package 在隔离副本上验证真机运行。"
