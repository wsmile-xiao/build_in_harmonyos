software: xmltoman
build_system: makefile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/xmltoman/xmltoman/xmltoman-0.4.tar.gz/xmltoman-0.4.tar.gz"

  # 源码校验和
  sha256: "948794a316aaecd13add60e17e476beae86644d066cb60171fc6b779f2df14b0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-xmlmantohtml.patch"
  - "0002-xmltoman.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl脚本工具需修复shebang路径：#!/usr/bin/perl改为#!/storage/Users/currentUser/usr/local/bin/perl"
  - "xmltoman为简单Makefile项目（非autotools），无configure脚本，需用make PREFIX=$DEFAULT_PREFIX编译"
  - "xmltoman依赖Perl XML::Parser模块，需预先安装（可通过CPAN安装，依赖expat库）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/xmltoman-0.4.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/xmltoman-0.4.work
  source_orig_hash: f1c535854b51864a
  source_work_hash: e03bb992cebfef1d
  generated_at: '2026-06-11T03:06:21'
  patches_count: 2

patch_classification:
  - file: 0001-xmlmantohtml.patch
    type: platform_adaptation
    platform_only: True
    guard: 'none'
    description: "修复 xmlmantohtml Perl shebang 路径：#!/usr/bin/perl → #!/storage/Users/currentUser/usr/local/bin/perl -w"
  - file: 0002-xmltoman.patch
    type: platform_adaptation
    platform_only: True
    guard: 'none'
    description: "修复 xmltoman Perl shebang 路径：#!/usr/bin/perl -w → #!/storage/Users/currentUser/usr/local/bin/perl -w"
