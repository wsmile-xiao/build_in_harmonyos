# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GitLab archive lacks configure script, needs autoreconf -fvi first"
  - "GitLab archive m4/ directory is empty, missing XCB_UTIL_COMMON macro from xcb-m4 submodule"
  - "HMDFS filesystem: umask 077 creates directories with SGID bit, preventing file creation inside. Fix: replace umask 077 with umask 0 + chmod 700 in config.status"
  - "libtoolize on HMDFS puts auxiliary files in wrong path (../../ instead of .), need to copy ltmain.sh manually"
  - "xcb-util (dependency) needs manual compilation due to same HMDFS issues"
  - "LD_LIBRARY_PATH must include /data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/lib for libxml2.so.16 needed by linker (lld)"
  - "LD_LIBRARY_PATH must include /data/service/hnp/python.org/python_3.12/lib for libintl.so.8 needed by python3"
  - "test executable linking fails due to --no-allow-shlib-undefined from lld, but library itself compiles and installs correctly"
