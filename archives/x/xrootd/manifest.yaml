software: xrootd
display: "XRootD"
description: "高性能容错数据访问框架（客户端库/服务器/工具集，CERN/SLAC）"
category: storage
homepage: "https://xrootd.slac.stanford.edu/"
license: LGPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS musl 缺失 API 适配（pthread_cancel 信号重建/innetgr/getpass/getspnam/POSIX AIO/rindex），共 114 个补丁"
    - "FIFO 与 AF_UNIX 路径套接字被内核禁止：ofsEvents/admin 辅助通道优雅降级"
    - "SONAME flag 注入（E383）与 readline 路径注入；上游仅支持共享库构建"
  common_dependencies:
    - zlib/1.3.1.1
    - openssl/3.5.6.1.2
    - libuuid/2.40.4
    - readline/8.3
    - ncurses/6.6
    - libxml2/2.15.3.1
    - libcurl/8.5.0

versions:
  "5.8.1":
    status: built
    build_date: "2026-09-18"
    conan_ref: "xrootd/5.8.1"
