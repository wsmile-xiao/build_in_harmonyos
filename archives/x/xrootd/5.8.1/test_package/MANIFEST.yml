# test_package/MANIFEST.yml
# Upstream test declaration for xrootd/5.8.1

package: xrootd/5.8.1
homepage: "https://xrootd.slac.stanford.edu/"

# Upstream test command (ctest via ENABLE_TESTS, gtest_discover_tests)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() runs the upstream gtest unit suites via ctest
# (30 tests, non-fatal; see notes.md for measured 30/30 pass on device)
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --timeout 300"

# Upstream gtest unit suites reachable in a single-host build
upstream_tests:
  - suite: XrdCl
    description: "Client unit tests: URL parsing, poller, socket transfer, utils (incl. TaskManager stop path)"
  - suite: XrdOucTests
    description: "XrdOucUtils unit tests (RedactToken, caseInsensitiveFind)"
  - suite: XrdTpcTests
    description: "TPC URL preparation unit tests"
  - suite: XrdPfcTests
    description: "Proxy file cache path parsing unit tests (PathParseToolTest: 2 cases)"
  - suite: XrdHttpTests
    description: "HTTP unit tests: 2 checksumHandler + 11 ReadRange handler cases"
  - suite: XrdSsiTests
    description: "SSI test shared library (no standalone gtest cases)"
  - suite: XRootD/cluster/stress/TPCTests
    description: "Server integration suites - NOT run: require multi-node cluster harness (ENABLE_SERVER_TESTS)"

# test_package self-contained tests (consumer perspective verification)
test_package_tests:
  - file: test_xrootd.cpp
    description: "Exercises XrdCl client API: URL parsing and a local-to-local copy through the XrdCl copy machinery with byte-by-byte content verification"
