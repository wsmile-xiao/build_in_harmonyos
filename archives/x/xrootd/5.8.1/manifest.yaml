# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS musl 无 rindex/innetgr/getpass/getspnam/POSIX AIO/pthread_cancel；上游自带的 MUSL/__APPLE__ 守卫可扩展覆盖 __OHOS__"
  - "RT 信号经 pthread_kill 在 OHOS 返回 0 但永不送达（SIGUSR1/2 可用）；线程取消需用普通信号重建 deferred 语义"
  - "CMake 无 Platform/HarmonyOS 模块导致 SONAME flag 为空，lld 会把相对路径写入 DT_NEEDED（E383 注入 soname flag）"
  - "OHOS 全文件系统禁 mkfifo 和 AF_UNIX 路径套接字（抽象命名空间可用）；xrootd 的 ofsEvents/admin 辅助通道需优雅降级"
  - "xrootd FindReadline.cmake 的 PATH_SUFFIXES lib 与 conan CMAKE_LIBRARY_PATH 冲突，readline 需配方变量注入"
  - "conan gtest 组件目标名为 GTest::gtest/GTest::gtest_main，xrootd 测试用 FindGTest 命名 GTest::GTest/GTest::Main，需 CMAKE_PROJECT_INCLUDE shim 别名"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

