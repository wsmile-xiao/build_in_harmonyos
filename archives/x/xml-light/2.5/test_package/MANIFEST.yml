# 鸿蒙特有测试（rule12：至少一个完整消费者用例 —— 真正跑通功能/流程的端到端用例，
# 而非仅对打包产物做静态断言）。由 test_package/test.sh 在 OHOS worker 上
# 编译为 aarch64-linux-ohos 原生二进制并真实执行。
harmony_specific_test_count: 1
harmony_specific_tests:
  - file: test_package/test_ohos_e2e.ml
    kind: e2e_consumer_case
    label: "鸿蒙特有测试"
    description: >
      端到端消费者用例：在 OHOS worker 真实文件系统上写出 HarmonyOS 风格
      module 配置 XML（bundle/deviceTypes 字段）与对应 DTD 文件，
      Dtd.parse_file + check 从文件解析校验 DTD，XmlParser.parse_file ~dtd
      完成带 DTD 校验的整档解析并断言结构；负向控制（缺必填 bundle 属性
      的配置必须被 DTD 校验拒绝）；随后清理临时文件。
    command: "bash test.sh <lib_dir> <ocaml_lib> <ocaml_bin>  # 第 4 段用例"
    executed: true
    result: "ALL OHOS E2E PASSED (module config validated against DTD on disk)"
