# 版本级 manifest
# 文件位置: archives/x/xml-light/2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5"

# 软件名
software: "xml-light"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-06"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 release 资产，与 opam 仓库 xml-light.2.5 锁定的
  # 资产一致，sha256 交叉核对通过）
  url: "https://github.com/ncannasse/xml-light/releases/download/2.5/xml-light-2.5.tbz"

  # 源码校验和
  sha256: "f58c2b3db70ad1ba080b0d306ae32f82ccbb95dabb92c599cdc467d1e44e003d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表（dune 构建，无 configure 选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ocaml/4.14.1.1.4
    - dune/3.17.0

  # 编译器
  cc: ocamlc
  cxx: ocamlopt

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本次无需修改源码）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（详见 notes.md「发现与知识」小节，已逐条沉淀）
knowledge_gained: []
