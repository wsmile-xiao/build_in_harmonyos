# test_package/MANIFEST.yml for xsct 2.3

package: xsct/2.3
homepage: "https://github.com/faf0/sct"

# xsct 为纯 Makefile 项目，上游无 make check / 自动化测试入口
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 消费者端到端用例
# 设计约束（CI 实证，PR #15143 build #80198）：加载验证不依赖 conan 宿主
# python3 —— HNP python3 受限 linker namespace 会拒绝 dlopen 缓存路径的库
# （EACCES），而 exec 时按 DT_NEEDED 加载不受限；真实加载由 B1/B2 原生执行
# 强制校验（加载器须完整解析闭包才能进入 main()）。
test_package_tests:
  - file: consumer_test.sh
    description: "消费者端到端用例：A) 鸿蒙特有非断言测试（xsct 原生 aarch64 ELF + DT_NEEDED 闭包静态校验）；B) 真实执行 xsct（无 DISPLAY 优雅 EXIT_FAILURE(1) 证明闭包经本机加载器完整加载、不可达 DISPLAY 非信号失败），每步退出码校验"
    command: "sh consumer_test.sh <bindir>"

assertion_count: 12
