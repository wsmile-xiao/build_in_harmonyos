software: xdms
display: "xdms"
description: "Amiga DMS(Disk Masher System)归档解包工具（测试完整性 / 查看信息 / 解包为 .adf 磁盘映像）"
category: utils
homepage: "http://zakalwe.fi/~shd/foss/xdms"
license: Public-Domain
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 configure 是手写 /bin/sh 脚本而非 autoconf，只接受 --prefix= 一个参数（传其它参数直接报错退出），因此不能用 AutotoolsToolchain，需手工调用并从环境变量传入 CC"
    - "C99 plain inline 不发出外部定义：src/cdata.h 对 __GNUC__ 定义 `#define INLINE inline`，u_heavy.c 中 decode_c()/decode_p() 在定义前被调用导致链接失败（undefined reference）。gcc/clang 在 glibc/Linux 上均复现，属现代工具链回归而非 OHOS 特有问题；最小修复为 `static inline`"
    - "单文件依赖：无 configure 依赖、无编译期/运行期第三方依赖，产物仅一个 xdms 可执行文件"
    - "上游无任何测试目标/测试目录（Makefile.in 仅 xdms/clean/install，src/Makefile.in 仅编译规则与 clean），如实申报 upstream_total=0；功能验证置于 test_package（构造真实可解码的 NOCOMP DMS 归档做端到端解包比对）"
  common_dependencies: []

versions:
  "1.3.2":
    status: pending
    build_date: ""
