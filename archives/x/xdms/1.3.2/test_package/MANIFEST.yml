# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xdms/1.3.2
homepage: "http://zakalwe.fi/~shd/foss/xdms"

# 上游测试命令 — 经源码核查：xdms 1.3.2 发布包**没有任何测试目标或测试目录**。
#
#   Makefile.in     目标: xdms / clean / install
#   src/Makefile.in 目标: .c.o / xdms / <各 .o 依赖规则> / clean
#
# 无 test / check 目标；解包后全部 36 个文件中不存在 tests/ test/ testing/
# regression/ 目录；xdms.txt 与 ChangeLog.txt 中的 "test" 仅指工具自带的
# `xdms t`（测试归档完整性）子命令，不是测试套件。
#
# 因此如实申报 upstream_total = 0，绝不用 test_package 冒充上游测试。
upstream_check_command: "none (upstream Makefile has no check/test target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# 上游测试总数（如实申报，见上方源码证据）
upstream_total: 0
upstream_executed: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xdms.sh
    description: >-
      打包产物消费者冒烟 13 项断言：二进制可执行、**测试期生成 DMS fixture 成功**
      （make_sample_dms.py，仓库中无二进制）、无参数用法退出码非 0、
      合法归档 `t` 通过且输出 is ok、`v` 报告 NOCOMP、`u` 真实解包成功、
      输出文件存在、解包尺寸 3000 字节、track CRC 损坏归档被拒、
      非 DMS 文件被拒、解包字节与独立重建的期望数据逐字节一致 (cmp)。
    command: "bash test_xdms.sh <pkg_bin>"

# 测试数据 —— 仓库中**不提交任何二进制样本**，测试期动态生成
test_data: []
test_data_generator: make_sample_dms.py
test_data_notes: >-
  xdms 是**解包器**，上游不提供创建 DMS 文件的 API，因此测试数据由
  `make_sample_dms.py` 在测试期从纯文本描述生成（仅用标准库），
  生成一个含 1 个 NOCOMP(未压缩) 磁道、3000 字节有效载荷的合法 DMS 归档。
  CRC 与校验和按上游 `src/crc_csum.c` 的 CreateCRC(CRC-16/ARC) /
  Calc_CheckSum 重新实现，因此头部 CRC、磁道头 CRC、打包数据 CRC 与解包后
  校验和全部真实有效。
  不提交二进制的原因：二进制内容无法随 GitCode 的 `/pull/<n>.diff` 传递，
  CI 的 `checkout-pr` 步骤执行 `git apply` 时会报
  "missing binary patch data / binary patch does not apply"。
  改用文本生成后，PR diff 中不再出现 `GIT binary patch`。

# 测试断言总数 (近似值, 用于质量评估)
# 13 项断言，见上方 test_package_tests 描述
assertion_count: 13
