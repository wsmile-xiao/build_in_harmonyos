knowledge_gained:
  - "xdms 1.3.2 的 configure 不是 autoconf，而是手写 /bin/sh 脚本：它以 sed 把 {CC} {ARCHFLAGS} {ARCHLIBS} {VERSION} {PREFIX} 替换进 Makefile.in 与 src/Makefile.in；只接受 --prefix= 一个参数，传其它参数会直接报错退出 —— 所以不能用 AutotoolsToolchain（它会注入 --host/--build 等），必须手工调用 configure 并从环境变量传入 CC"
  - "C99 `inline` 不产生外部定义导致链接失败：src/cdata.h 对 __GNUC__ 定义 `#define INLINE inline`，u_heavy.c 中 decode_c()/decode_p() 在定义之前被调用，编译器无法内联从而发出外部引用，最终 undefined reference to `decode_c'/`decode_p'。gcc 与 clang 在 x86-64 glibc 上均可复现 —— 属现代工具链回归（上游 2006 年代码，GCC<5 默认 -std=gnu89 时 plain inline 会发出外部定义），并非 OHOS 特有问题。最小修复：改为 `static inline`"
  - "上游 1.3.2 没有任何测试目标/测试目录（Makefile.in 仅 xdms/clean/install；src/Makefile.in 仅编译规则 + clean），upstream_total = 0 有源码依据；功能验证放在 test_package"
  - "DMS 归档格式可直接构造：56 字节主头（'DMS!' 魔数 + CRC 覆盖 offset 4..49，CRC 存于 54..55 大端）+ 20 字节磁道头（'TR' + CRC 覆盖 0..17，存于 18..19）+ 打包数据。cmode=0(NOCOMP) 时 Unpack_Track 走 memcpy 直通路径，可构造真实可解码归档用于端到端验证"
  - "解包路径只在 number < 80 且 unpklen > 2048 时才写出数据（pfile.c:340），因此功能性 fixture 的磁道载荷必须大于 2048 字节"
