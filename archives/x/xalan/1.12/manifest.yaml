version: "1.12"
software: xalan
status: built
build_date: "2026-09-20"
build_system: cmake

source:
  url: "https://github.com/apache/xalan-c/archive/refs/tags/Xalan-C_1_12_0.tar.gz"
  sha256: "f3d4f23af7f7914259f2f5dbd9cc1450d3ebe0b8c8163fd50fcac4a39c63fccd"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-Dtranscoder=default"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "--target all + ctest (21 entries: 1 Threads + 20 samples)"
  dependencies:
    - xerces-c/3.2.5
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-xercesc-target-compat.patch"
  - "0002-fix-gcc15-encoding-writer.patch"

knowledge_gained:
  - "Xalan 1.12 仅 CMake 构建（Autoconf 已移除），顶层无条件加 TestXSLT/TestXPath/samples/Tests 子目录"
  - "上游 ctest 共 21 条：Tests/Threads 1 条 + samples/ 20 条；conan-center 把四目录 patch 掉，本配方保留并全量运行"
  - "上游 BUILD_SHARED_LIBS 是 CACHE 变量覆盖，必须用 tc.cache_variables 设置"
  - "在仓 xerces-c 导出小写 xerces-c::xerces-c，需 XalanXerces fallback 别名成 XercesC::XercesC"

verification:
  real_device:
    date: "2026-09-20"
    env: "HarmonyOS PC 真机（aarch64 musl，OHOS SDK clang 15，conan 2.30）"
    result: "pending-preflight"
