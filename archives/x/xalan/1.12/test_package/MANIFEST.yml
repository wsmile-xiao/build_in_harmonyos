# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xalan/1.12
homepage: https://apache.github.io/xalan-c

# 上游测试命令 (用于分析)
# 顶层 CMakeLists enable_testing() + add_subdirectory Tests/samples：
# Tests/ 注册 1 个 ctest (Threads)，samples/ 注册 20 个 ctest
# （8 通用 + SerializeNodeSet + 2 SimpleXPathAPI + 4 TraceListen +
# TransformToXercesDOM + UseStylesheetParam + XalanTransform +
# XalanTransformerCallback + SimpleXPathCAPI）；TestXSLT/TestXPath
# 仅构建可执行文件不注册测试。合计 21 个 ctest 条目。
upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: Tests/Threads/ThreadTest.cpp
    source: apache/xalan-c@Xalan-C_1_12_0/Tests/Threads/ThreadTest.cpp
    description: "上游 ctest Threads：多线程 XSLT 转换冒烟"
    command: "ctest -R Threads"
  - file: samples/SimpleTransform/SimpleTransform.cpp
    source: apache/xalan-c@Xalan-C_1_12_0/samples/SimpleTransform/SimpleTransform.cpp
    description: "上游 ctest samples 代表：SimpleTransform 文件转换（共 20 个 sample 用例）"
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "XalanTransformer 真实 XSLT 转换 + 输出断言（返回码/非空/两组文本/外层元素）"
    command: "./test_xalan"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
