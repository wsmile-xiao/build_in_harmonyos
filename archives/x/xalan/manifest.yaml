software: xalan
display: "Apache Xalan-C++"
description: "Apache Xalan-C++ XSLT 1.0 处理库（基于 Xerces-C++）"
category: library
homepage: "https://apache.github.io/xalan-c"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，平台检测走通用 UNIX 标志，HarmonyOS 下无需平台补丁"
    - "transcoder=default（不引入未发布的 ICU），C++ 标准交由工具链"
    - "XercesC 大小写目标双兼容：fallback 别名同时支持本仓与 CCI 的 xerces-c"
    - "默认构建静态库（libxalan-c + libxalanMsg），保留 21 个上游 ctest 全量运行"
  common_dependencies:
    - xerces-c

versions:
  "1.12":
    status: built
    build_date: "2026-09-20"
