# test_package/MANIFEST.yml — xz 5.8.1
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xz/5.8.1
homepage: https://tukaani.org/xz/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试（autotools.make(target="check")）
upstream_test_in_build: true
upstream_test_command: "make check"

# ── 上游测试注册口径（依据 xz-5.8.1/tests/Makefile.am 的 TESTS 变量）────────────
# 上游默认注册 N=19：
#   TESTS 基础 17 = 12 个 C 测试二进制 + test_files.sh + test_suffix.sh
#                   + test_compress_generated_{abc,random,text}
#   COND_MICROLZMA（configure.ac:305 默认 enable_microlzma=yes）+ test_microlzma
#   COND_SCRIPTS（configure.ac:529 默认 enable_scripts=yes）+ test_scripts.sh
# 本适配用 --disable-scripts 关闭 COND_SCRIPTS（OHOS 无 /bin/sh），
# 因此实际注册并运行 18 项，豁免 1 项（test_scripts.sh）。
upstream_tests:
  registered_count: 19
  adapted_registered_count: 18
  exemption:
    - test: test_scripts.sh
      reason: "OHOS 无 /bin/sh 解释器（平台限制），随 --disable-scripts 一并关闭；该用例仅验证 xzdiff/xzgrep 等脚本，不影响 liblzma 与 xz CLI 本体"
  items:
    - file: test_check
      source: xz-5.8.1/tests/test_check.c
      description: "CRC32/CRC64/SHA-256 校验和计算正确性"
    - file: test_hardware
      source: xz-5.8.1/tests/test_hardware.c
      description: "CPU 特性探测（硬件能力识别）"
    - file: test_stream_flags
      source: xz-5.8.1/tests/test_stream_flags.c
      description: ".xz 流头/流尾标志位编解码"
    - file: test_filter_flags
      source: xz-5.8.1/tests/test_filter_flags.c
      description: "块过滤器标志位编解码"
    - file: test_filter_str
      source: xz-5.8.1/tests/test_filter_str.c
      description: "过滤器链字符串解析（--filters 语法）"
    - file: test_block_header
      source: xz-5.8.1/tests/test_block_header.c
      description: "块头编解码与校验"
    - file: test_index
      source: xz-5.8.1/tests/test_index.c
      description: ".xz 索引（Index）编解码与查询"
    - file: test_index_hash
      source: xz-5.8.1/tests/test_index_hash.c
      description: "索引哈希校验"
    - file: test_bcj_exact_size
      source: xz-5.8.1/tests/test_bcj_exact_size.c
      description: "BCJ 过滤器输出长度精确性"
    - file: test_memlimit
      source: xz-5.8.1/tests/test_memlimit.c
      description: "解码内存上限（memlimit）强制逻辑"
    - file: test_lzip_decoder
      source: xz-5.8.1/tests/test_lzip_decoder.c
      description: ".lz（lzip）格式解码"
    - file: test_vli
      source: xz-5.8.1/tests/test_vli.c
      description: "可变长度整数（VLI）编解码"
    - file: test_microlzma
      source: xz-5.8.1/tests/test_microlzma.c
      description: "microLZMA 编解码（COND_MICROLZMA，默认启用）"
    - file: test_files.sh
      source: xz-5.8.1/tests/test_files.sh
      description: "xz/xzdec CLI 文件级往返（多格式/多参数）"
      command: "sh test_files.sh"
    - file: test_suffix.sh
      source: xz-5.8.1/tests/test_suffix.sh
      description: "压缩文件名后缀（.xz/.lzma/.lz）处理"
      command: "sh test_suffix.sh"
    - file: test_compress_generated_abc
      source: xz-5.8.1/tests/test_compress.sh
      description: "生成数据（abc 模式）压缩/解压往返"
      command: "sh test_compress.sh"
    - file: test_compress_generated_random
      source: xz-5.8.1/tests/test_compress.sh
      description: "生成数据（random 模式）压缩/解压往返"
      command: "sh test_compress.sh"
    - file: test_compress_generated_text
      source: xz-5.8.1/tests/test_compress.sh
      description: "生成数据（text 模式）压缩/解压往返"
      command: "sh test_compress.sh"

# ── test_package 自带的消费者视角测试（真实链接 + 真实运行）──────────────────
test_package_tests:
  - file: test_xz.c
    description: "链接 packaged liblzma，lzma_easy_buffer_encode + lzma_stream_buffer_decode 完整往返并经 memcmp 校验"
    command: "./test_xz"
  - file: test_xz.py
    description: "调用 packaged xz CLI 对临时文件做 compress→decompress 往返并逐字节比对"
    command: "python3 test_xz.py <bindir>"

# ── 断言总数（近似值，用于质量评估）────────────────────────────────────────
# 计数方法（可复现）：对 xz-5.8.1/tests/ 下 13 个 test_*.c 统计 assert_*/expect( 调用点
#   grep -cE '(^|[^a-zA-Z_])(assert_[a-z_]+|expect)\(' tests/test_*.c   → 1118
# 加上 test_files.sh(20) + test_suffix.sh(19) 的检查点 → 1157
# 加上 test_package 两个消费者用例的断言点（往返校验 2 个可判定断言） → 1159
assertion_count: 1159
