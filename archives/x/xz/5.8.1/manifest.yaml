# manifest.yaml — xz 5.8.1 版本级编译元数据
software: xz
version: 5.8.1
status: built
build_date: "2026-09-21"
build_system: autotools
source_url: "https://github.com/tukaani-project/xz/releases/download/v5.8.1/xz-5.8.1.tar.gz"
source_sha256: "507825b599356c10dca1cd720c9d0d0c9d5400b9de300af00e4d1ea150795543"
license: "0BSD"
security: >-
  5.8.1 早于 CVE-2026-34743 修复（该修复随 5.8.3 引入）。本适配按平台任务
  #7343 要求适配 5.8.1，未改动上游源码语义；如需含修复的版本请引用 5.8.3。

adaptation:
  patches:
    - file: "patches/0001-build-aux-config.guess.patch"
      reason: >-
        build-aux/config.guess 不识别 HarmonyOS，添加 `*:HarmonyOS:*:*` 分支映射为
        <machine>-unknown-linux-ohos。config.sub 5.8.1 已内置 ohos 三元组
        （实测 grep 命中 `ohos*` / `linux-ohos*`），故无需补丁。
        该补丁已实测可原样套用到 5.8.1 的 config.guess（patch --dry-run 通过，
        行号上下文与 5.8.3 一致）。
  configure_flags:
    - "--disable-scripts"
  cross_build_only:
    - >-
      cross_building 为真时追加 libtool 的 `-all-static`：OHOS SDK 不随附设备端
      动态加载器 ld-musl-aarch64.so.1，动态链接的测试/CLI 产物在本机
      QEMU/binfmt 下无法执行（实测报 Could not open '/lib/ld-musl-aarch64.so.1'，
      make check 18 项全挂）。设备端原生构建（官方 CI aarch64 worker）
      cross_building 为 False，不加此标志，与已发布的 xz/5.8.3 保持一致。
  workarounds:
    - >-
      mktemp wrapper（.hmos_fix/mktemp 直接 exit 1）迫使 autoconf AS_TMPDIR
      走 mkdir 回退路径，绕过 OHOS 上 mktemp -d 造出 drwx--S--- 的权限缺陷
      （E011）。
    - >-
      CONFIG_SHELL 由 profile [buildenv] 提供 /bin/bash，规避设备端
      /data/service/hnp/bin/bash 路径在本机不存在的问题。

test_report:
  upstream_suite: "make check (tests/Makefile.am 的 TESTS 变量)"
  upstream_registered: 19
  adapted_registered: 18
  result: "18/18 PASS (100%) —— 本地实测，QEMU/binfmt 下真实执行"
  exempted: >-
    test_scripts.sh 一项：COND_SCRIPTS 随 --disable-scripts 关闭
    （OHOS 无 /bin/sh 解释器，平台限制）
  consumer_tests: >-
    test_xz.c（liblzma API 压缩/解压往返，memcmp 校验）+ test_xz.py
    （打包的 xz CLI 文件往返）—— 2/2 PASS，本地实测真实执行
  local_command: >-
    bash scripts/ohos/build-xz.sh（内部执行 conan create .  -pr:h=conan-profile-ohos-aarch64.local
    -pr:b=conan-profile-linux-x86_64.local）→ exit 0

notes: >-
  平台任务 #7343（xz 5.8.1，认领人 Zmaomao，分支 feat/xz-5.8.1）。
  配方以 archives/x/xz/5.8.3 为基底并按其同族演进，仅改版本号、源码 URL、
  sha256 与上述 cross_building 静态链接处理；18 项上游测试与 2 项消费者测试
  均在本机真实跑通（QEMU/binfmt 执行 aarch64 产物），非"看起来成功"。
