# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xz/5.6.2
homepage: https://tukaani.org/xz/

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件 (from tests/Makefile.am TESTS)
upstream_tests:
  - name: "test_check"
    source: xz-5.6.2/tests/test_check.c
    description: "CRC32/CRC64/SHA-256 完整性校验测试"
    command: "./test_check"
  - name: "test_hardware"
    source: xz-5.6.2/tests/test_hardware.c
    description: "硬件特性检测测试 (多线程/CPU)"
    command: "./test_hardware"
  - name: "test_stream_flags"
    source: xz-5.6.2/tests/test_stream_flags.c
    description: "Stream Flags 编解码测试"
    command: "./test_stream_flags"
  - name: "test_filter_flags"
    source: xz-5.6.2/tests/test_filter_flags.c
    description: "Filter Flags 编解码测试"
    command: "./test_filter_flags"
  - name: "test_filter_str"
    source: xz-5.6.2/tests/test_filter_str.c
    description: "Filter 字符串解析测试"
    command: "./test_filter_str"
  - name: "test_block_header"
    source: xz-5.6.2/tests/test_block_header.c
    description: "Block Header 编解码测试"
    command: "./test_block_header"
  - name: "test_index"
    source: xz-5.6.2/tests/test_index.c
    description: "Index 编解码测试"
    command: "./test_index"
  - name: "test_index_hash"
    source: xz-5.6.2/tests/test_index_hash.c
    description: "Index Hash 测试"
    command: "./test_index_hash"
  - name: "test_bcj_exact_size"
    source: xz-5.6.2/tests/test_bcj_exact_size.c
    description: "BCJ 过滤器精确大小测试"
    command: "./test_bcj_exact_size"
  - name: "test_memlimit"
    source: xz-5.6.2/tests/test_memlimit.c
    description: "内存限制测试"
    command: "./test_memlimit"
  - name: "test_lzip_decoder"
    source: xz-5.6.2/tests/test_lzip_decoder.c
    description: "LZIP 解码器测试"
    command: "./test_lzip_decoder"
  - name: "test_vli"
    source: xz-5.6.2/tests/test_vli.c
    description: "可变长度整数编解码测试"
    command: "./test_vli"
  - name: "test_files.sh"
    source: xz-5.6.2/tests/test_files.sh
    description: "文件处理脚本测试"
    command: "test_files.sh"
  - name: "test_suffix.sh"
    source: xz-5.6.2/tests/test_suffix.sh
    description: "后缀处理脚本测试"
    command: "test_suffix.sh"
  - name: "test_compress_generated_abc"
    source: xz-5.6.2/tests/test_compress_generated_abc
    description: "生成 ABC 模式数据压缩测试"
    command: "test_compress_generated_abc"
  - name: "test_compress_generated_random"
    source: xz-5.6.2/tests/test_compress_generated_random
    description: "生成随机数据压缩测试"
    command: "test_compress_generated_random"
  - name: "test_compress_generated_text"
    source: xz-5.6.2/tests/test_compress_generated_text
    description: "生成文本数据压缩测试"
    command: "test_compress_generated_text"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xz.c
    description: "xz --version + LZMA compress/decompress 往返验证"
    command: "./test_xz"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 50
