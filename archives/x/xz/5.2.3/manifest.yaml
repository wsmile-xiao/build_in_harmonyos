  - "tukaani.org .tar.xz URL返回403，需使用.tar.gz URL并--tar=tar.gz覆盖"
  - "test_scripts.sh xzdiff fd3操作在HarmonyOS sh中失败，非库功能问题"
  - "clean_verify.py: /bin/sh(musl sh)不兼容autoconf configure，需改用bash"
  - "clean_verify.py: configure_options YAML列表解析regex需匹配缩进格式"

