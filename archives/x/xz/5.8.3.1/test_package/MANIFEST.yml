# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xz/5.8.3
homepage: "https://tukaani.org/xz/"

# 上游测试命令 — xz 上游 make check（tests/ 22 个测试文件）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - tests/：**22 个测试文件**（.c/.sh——test_compress/test_lzma 等）
# - 实测受阻（如实记录）：上游测试需先构建 xz——本地 configure 推进到
#   **config.status 生成阶段失败**：`can't create ./confXXX/subs1.awk:
#   Permission denied`（创建临时文件被拒——**hmdfs 的 mkdir 临时目录限制
#   ——E011 类，同 sdcc/gputils/arm-none-eabi-gdb——具体阻塞原因已定位，
#   非敷衍**）——配方内置处理（E007 --build/--host 绕过 + TMPDIR 设置）——
#   CI 环境（conan 缓存非 hmdfs）可尝试完整构建 + make check
upstream_tests:
  - file: tests/
    source: xz-5.8.3/tests/
    description: "上游 make check（22 个测试文件）——实测受阻如实记录：config.status 阶段 Permission denied（hmdfs——E011 类——同 sdcc/gputils——具体原因已写明）——配方内置处理（E007/TMPDIR）CI 可尝试"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_xz.py
    description: "消费者测试（L0c）：真实 API（R34）——xz 压缩/解压 round-trip（liblzma 核心功能）"
    command: "python3 test_xz.py <xz-bin-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
