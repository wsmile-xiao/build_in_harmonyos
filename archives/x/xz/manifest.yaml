software: xz
display: "XZ Utils"
description: "General-purpose data compression software with high compression ratio"
category: compress
homepage: "https://tukaani.org/xz/"
license: 0BSD
build_system: autotools

ohos_adaptation:
  key_points:
    - "需修补 config.guess 添加 HarmonyOS 检测（config.sub 5.8.1/5.8.3 均已内置 OHOS 支持）"
    - "5.8.1 / 5.8.3 仅需 1 个补丁（config.guess）；5.6.2 需 12 个补丁"
    - "需 --disable-scripts 避免 OHOS 上 test_scripts.sh 失败"
    - "mktemp wrapper 解决 OHOS 权限问题"
    - "交叉编译时程序需用 libtool 的 -all-static 才能真静态（裸 -static 会被 libtool 吞掉），否则本地 QEMU 无法执行上游测试"
    - "5.8.3 包含 CVE-2026-34743 修复；5.8.1 早于该修复"
  common_dependencies: []

