# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xcb-util-keysyms/0.4.1
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxcb-keysyms"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 清点证据：上游 tarball 仅含 keysyms/（keysyms.c + xcb_keysyms.h +
# xcb-keysyms.pc.in），无 tests/ 目录；Makefile.in 中
#   check-am: all-am
#   check: check-recursive
# 为 automake 默认空测试目标，make check 无测试可跑（no-op）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: |
      Link libxcb-keysyms and exercise the keysym classification API
      (xcb_is_keypad_key / xcb_is_function_key / xcb_is_cursor_key /
      xcb_is_modifier_key / xcb_is_private_keypad_key). These helpers
      are pure functions needing no X server connection, so they run
      on the OHOS worker; xcb_key_symbols_alloc requires a live
      connection and is not exercised here.
    command: "./test_xcb-util-keysyms"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6