# 版本级 manifest — xcb-util-keysyms 0.4.1

version: "0.4.1"
software: "xcb-util-keysyms"
status: published
build_date: "2026-09-24"
build_system: autotools

source:
  url: "https://www.x.org/releases/individual/xcb/xcb-util-keysyms-0.4.1.tar.xz"
  sha256: "7c260a5294412aed429df1da2f8afd3bd07b7cba3fec772fba15a613a6d5c638"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-shared"
    - "--disable-static"
  dependencies:
    - libxcb/1.17.0
    - xorgproto/2025.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "xcb-util 系列库的 configure 通过 XCB_UTIL_COMMON m4 宏执行 pkg-config --variable=xcbproto_version xcb，Conan PkgConfigDeps 生成的 xcb.pc 需手动补 xcbproto_version=1.17.0"
  - "libxcb 包的 .la 文件引用绝对路径且依赖链断裂，构建共享库时需删除以避免 libtool 链接错误"
  - "x.org release tarball 自带生成好的 configure，config.guess 不支持 HarmonyOS，需显式 --build/--host triplet"