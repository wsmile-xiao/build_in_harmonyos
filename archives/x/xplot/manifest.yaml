software: xplot
display: XPlot
description: XForms 图形界面下绘制表格数据的命令行工具
category: gfx
homepage: https://sources.debian.org/src/xplot/1.19-9.2/
license: GPL-2.0-or-later
build_system: makefile
ohos_adaptation:
  key_points:
    - "依赖 libforms/1.2.4；该版本将 forms.h 安装在 include/forms.h，配方在私有构建目录提供旧式 X11/forms.h 兼容头。"
    - "HarmonyOS 包装入前使用 binary-sign-tool 自签，并验证 AArch64 与 .codesign 段。"
    - "XPlot 需要 XForms/X11 显示服务器；无 DISPLAY 的 SSH 会话只能验证参数解析与二进制签名，不能证明图形窗口可用。"
  common_dependencies:
    - libforms
versions:
  "1.19":
    status: built
    build_date: "2026-10-02"
