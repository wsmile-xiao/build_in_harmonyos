version: "1.19"
software: xplot
status: built
build_date: "2026-10-02"
build_system: makefile

source:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/x/xplot/xplot_1.19.orig.tar.gz"
  sha256: "aded1c33dc8393c02d95d5fe4b5c7c7c8289a8c3aa74706af1a962b95518277d"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -C src -j1 xplot"
    - "CC from tools.build:compiler_executables"
    - "CFLAGS from Conan settings plus libforms/libx11 dependency include paths"
    - "FORM_LIB points to Conan dependency library directories"
    - "private compat-include/X11/forms.h maps the historic include to libforms/1.2.4 include/forms.h"
  make_options:
    - "-j1"
  dependencies:
    - "libforms/1.2.4"
  cc: clang

patches_applied:
  - "patches/0001-libfli-lib-cbuild.patch"
  - "patches/0002-src-dohelp.c.patch"

knowledge_gained:
  - "The bundled libfli cbuild script resets CC to g++, sources cbuild.def through PATH, and applies .c substitution to absolute paths; the patch preserves Conan's compiler, sources ./cbuild.def, scopes substitution to filenames, keeps dependency include flags, and puts scratch output under TMPDIR. Reference: patches/0001-libfli-lib-cbuild.patch"
  - "xplot 1.19 includes X11/forms.h, while libforms/1.2.4 installs include/forms.h; a build-folder compatibility header resolves the legacy include without changing the upstream source tree. Reference: conanfile.py"
  - "The GUI data parser handles a missing -format value before XForms initialization, so its real executable can be tested with DISPLAY unset. GUI rendering still requires an X server. Reference: test_package/test_xplot.py"

upstream_tests_exist: true
upstream_test_audit: "src/Makefile registers four interactive make tests scenarios: sine stdin, non-tabulated stdin, both input files, and lots-of-sines files. Each opens an XForms window and waits for ENTER. src/test/square is an unregistered fixture."
reason: "The supplied HarmonyOS PC is reachable over SSH but has no DISPLAY or X server; the four upstream window scenarios cannot run there. The Conan test executes the installed binary's parser path before XForms initialization and, on OHOS, verifies HarmonyOS kernel, AArch64 ELF, and .codesign."
