# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在
# R51 上游测试三步法：清点 -> 运行 -> 如实回填

package: xcfa/5.0.2
homepage: "http://www.xcfa.tuxfamily.org/"

# ── 上游测试清点结论（R51 第一步）─────────────────────────────
# 源码包内没有 tests/ 或 test/ 目录；顶层与各子目录 Makefile.am 均无
# TESTS / check_PROGRAMS / check_SCRIPTS / check_LTLIBRARIES 声明；src、
# src_cli、lib 下无 TEST_CASE / BOOST_AUTO_TEST / CU_TEST 等测试宏。
# 清点命令与实测输出见 notes.md 的「上游测试入口核验」一节。
# 结论：上游没有官方自动化测试，upstream_tests 为空列表（已核对，不是占位符）。
upstream_check_command: "make check (上游各子目录均报 Nothing to be done for 'check')"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── test_package 自带测试（消费者视角，均真实执行被测二进制）──
test_package_tests:
  - file: test.sh
    description: "功能测试（上游行为视角，5 条断言）: xcfa --version / --help、xcfa_cli --help 横幅、xcfa_cli --info_files 解析真实 WAV（8000 Hz / 16 bit / 00:00:01）、xcfa_cli 外部程序检查表"
    command: "bash test.sh <pkg>/bin/xcfa <pkg>/bin/xcfa_cli"
    assertions: 5
  - file: test_ohos.sh
    description: "鸿蒙特有测试（14 条断言）: ELF64/AArch64/PIE、.interp=/lib/ld-musl-aarch64.so.1（musl 而非 glibc）、无 RPATH/RUNPATH、NEEDED 无 glibc 专有库且含 Conan GTK3/vte 栈、OHOS ELF 标记（.codesign/.note.ohos.ident）、可加载段内无构建机路径、整文件无本机构建路径、bash 包裹可执行、运行期上报 HarmonyOS/aarch64、GTK/GLib 运行期版本可查、无显示服务时 13=优雅报 cannot open display（rc=1 不挂死不崩溃）、包内产物完备（双二进制 + 6 个 glade + pixmaps/desktop/man）"
    command: "bash test_ohos.sh <pkg>/bin/xcfa <pkg>/bin/xcfa_cli <pkg>"
    assertions: 14

# 测试断言总数 = 功能 5 + 鸿蒙特有 14
assertion_count: 19

# 其中鸿蒙平台特有测试用例数（ELF/ABI、musl/OHOS 标记、平台能力缺口、OHOS shell 约束等）
ohos_specific_assertions: 14
