# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "configure.ac 在 debug/ansi 分支把 CFLAGS 整体赋值 -> conan 注入的 CFLAGS 全部丢失；所有构建期 flag（-fcommon/-I/prefix-map）必须走 CPPFLAGS（ref: E234 AutotoolsToolchain 与工程自身 flag 冲突处理）"
  - "AC_CHECK_LIB 探测（tag_c/asound/curl/vte-2.91）不受 PkgConfigDeps 覆盖，需按 cpp_info 注入 -I/-L（ref: E075 pkg-config/PKG_CONFIG_PATH 陷阱；DRAFT-E2186 autotools-deps-missing-dep-flags）"
  - "静态 libtag.a 还要 -lz 与 -lc++，glib 的代理 libintl 需 -lintl（ref: E234 依赖链接顺序/flag 保留）"
  - "libx11 经 Xlib.h 需要 xorgproto 的 <X11/X.h>；传递依赖在 generate() 中 package_folder 为 None，必须显式声明为直接依赖（ref: E364 依赖 include 路径注入）"
  - "OHOS cairo/1.18.4 关闭了 xlib 后端（无 cairo-xlib.h），xcfa 5 个 poche*.c 的死包含需打补丁移除（ref: E538 依赖 options/后端缺口；E007 平台缺失自包含替换）"
  - "OHOS/musl 的 <stdio.h> 不再间接引入 <sys/types.h>，uint 未定义；显式包含 <sys/types.h> 即可（无需 _GNU_SOURCE）（ref: E113 BSD/SysV 兼容类型缺失；E032 _GNU_SOURCE/musl 头文件）"
  - "GNU 扩展 get_current_dir_name() 在 OHOS libc 缺失 -> 用 getcwd(NULL, 0) 本地实现替代（ref: E386 getcwd/HMDFS 与 musl 运行期约束）"
  - "上游 PRINT 宏内嵌 __FILE__ 会把构建目录绝对路径写进制品 .rodata；-ffile/-fdebug/-fmacro-prefix-map 脱敏（ref: E234 构建期 flag 注入通道同源）"

