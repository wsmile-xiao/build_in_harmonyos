software: xcfa
display: "XCFA"
description: "X Convert File Audio — GTK3 音频文件提取/转换/规范化/打标签工具套件（图形界面 xcfa + 命令行 xcfa_cli）"
category: multimedia
homepage: "http://www.xcfa.tuxfamily.org/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 tarball 自带 configure/Makefile.in，无需 automake/autoconf 自举；2015 年的 config.guess/config.sub 不识别 HarmonyOS，构建期替换为自包含 OHOS-aware 版本（E007）。"
    - "configure.ac 在 debug/ansi 分支整体重写 CFLAGS，conan 注入的 CFLAGS 会被丢弃；-fcommon、依赖 -I 与 -ffile/fdebug/fmacro-prefix-map 一律经 CPPFLAGS 注入。"
    - "AC_CHECK_LIB 探测（tag_c/asound/curl/vte-2.91）不受 PkgConfigDeps 覆盖，需按 cpp_info 注入 -I/-L；静态 libtag.a 另需 -lz/-lc++，glib 代理 libintl 需 -lintl。"
    - "OHOS 制品仓 cairo 关闭 xlib 后端（无 cairo-xlib.h），poche*.c 的死包含以补丁移除；libx11 的 <X11/Xlib.h> 依赖 xorgproto 的 <X11/X.h>，后者需显式声明为直接依赖。"
    - "OHOS/musl 的 <stdio.h> 不再间接引入 <sys/types.h>，glibc 兼容类型 uint 需显式包含；GNU 扩展 get_current_dir_name() 缺失，改用 getcwd(NULL, 0)。"
    - "HMDFS：预置 PWD + configure 的 ac_pwd 回退 + umask 022（E011）；GUI 需显示服务，无显示时优雅退出（rc=1）。"
  common_dependencies:
    - gtk
    - vte
    - taglib
    - alsa-lib
    - curl
    - libx11

versions:
  "5.0.2":
    status: built
    build_date: "2026-09-25"
    conan_ref: "xcfa/5.0.2"
