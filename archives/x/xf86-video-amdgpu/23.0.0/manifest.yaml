package: xf86-video-amdgpu
version: 23.0.0
source: https://gitlab.freedesktop.org/xorg/driver/xf86-video-amdgpu/-/archive/xf86-video-amdgpu-23.0.0/xf86-video-amdgpu-xf86-video-amdgpu-23.0.0.tar.gz
build_system: autotools
compiler: clang 15.0.4 (OHOS SDK)
target_platform: openharmony-aarch64
dependencies:
  - xorg-server >= 21.1.15
  - libdrm >= 2.4.133
  - libdrm_amdgpu >= 2.4.133
  - gbm (stub)
  - xproto >= 7.0.33
  - fontsproto >= 2.1.3
  - xf86driproto >= 2.1.1
  - randrproto >= 1.6.0
  - renderproto >= 0.11.1
  - videoproto >= 2.3.3
  - xextproto >= 7.3.0
install_files:
  - lib/xorg/modules/drivers/amdgpu_drv.so
  - share/man/man4/amdgpu.4
  - share/X11/xorg.conf.d/10-amdgpu.conf
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - --disable-glamor
  - --disable-udev
patches:
  - HMDFS-umask-fix (config.status umask 077 -> 022)
  - pkg.m4-fix (added pkg.m4 to m4/ for PKG_CHECK_EXISTS)
  - stub-headers (gbm.h, GL/gl.h, libgbm_stub.so)
  - xorg-server.h (enabled DPMSExtension, DRI3, DPMSMode constants)