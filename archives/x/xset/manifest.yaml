software: xset
display: "xset"
description: "X11 用户偏好设置命令行工具（bell/LED/keyboard/pointer/font path/screen saver/DPMS）"
category: utility
homepage: "https://gitlab.freedesktop.org/xorg/app/xset"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "X.Org dist tarball 自带预生成 configure ⇒ 不需要 xorg-macros/util-macros/automake 的 tool_requires（同仓库 libx11/libxext 配方）"
    - "必需依赖是 x11 + xext + xproto + **xmuu**（configure.ac:44 的 PKG_CHECK_MODULES(XSET, [xproto >= 7.0.17 xmuu]) 是硬失败形式，xmuu 不可裁剪：xset.c 的 X 错误回调用 XmuPrintDefaultErrorMessage）"
    - "制品仓没有 libxmu（archives/l/libxmu/1.3.1 已合入 main 但制品未发布，先例 chiark-utils/8.0.1 有同等记载）⇒ 按 E277 从 X.Org 官方源只内建 libXmuu（5 个源文件、只依赖 x11）并静态链入，绕开全量 libXmu 的 xt 依赖"
    - "config.guess 认不出 HarmonyOS：OHOS 分支显式 --build/--host=aarch64-unknown-linux-gnu（同 xsel/libxext）"
    - "HMDFS getcwd 不可达 + E114 umask 077：对 xset 与 vendored libXmu 两份 configure 一并改写（同 xsel/1.2.1）"
    - "真机 conan 2.x 的 PKG_CONFIG_PATH 注入不生效：在 build() 作用域注入并 try/finally 恢复（同 xsel/1.2.1）"
    - "fontcache 默认开但 xfontcache 未发布：显式 --without-fontcache 保证 CI 与本地分支一致；xf86misc 上游默认即关"
    - "无上游自动化测试（Makefile.am 无 check/TESTS，源码树无 test 目录，configure.ac 无测试宏）：test_package 以 6 条硬断言真实执行打包二进制——①-version 版本串原样（xset.c:171-173）②无选项走 usage(NULL)（178-180）③usage 文本含 DPMS 小节（1593-1604）④非法 display 优雅失败（182-187）⑤-display 与 -d 缺值命中 usage(fmt)（167-170）⑥usage 文本不含 font cache 段（1605-1612）；实测 6/6（reports/conan-create.log:180、reports/w3-local-ci.log:640）。xset.c:756 的 unknown option 分支需先建立 X 连接，本环境不可达，故未对其作任何断言，已按 not_covered 申报"
  common_dependencies:
    - libx11
    - libxext
    - xorgproto

versions:
  "1.2.5":
    status: built
    build_date: "2026-09-25"
    source_url: "https://xorg.freedesktop.org/archive/individual/app/xset-1.2.5.tar.gz"
