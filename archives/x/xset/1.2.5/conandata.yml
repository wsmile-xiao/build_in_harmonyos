# conandata.yml — xset/1.2.5
#
# R39 官方源：X.Org 官方发布归档 xorg.freedesktop.org/archive/individual/app/
# 实测（2026-09-25，B 机构建主机）：该归档下 xset-1.2.5.tar.gz 直取 HTTP 200；
# 旧址 www.x.org/releases/individual/app/ 的同名文件返回 301（已迁移），故不用旧址。
# sha256 为对官方 URL 直取后 sha256sum 的实测值，两次独立下载一致。
# 本文件只写官方直链标量，不用镜像前缀、不用任何本地路径形态。
#
# ★★ 本文件注释里一律不写带协议的 URL（故上面刻意写成"裸主机名 + 路径"）。
#   原因是实测到的一条自防御规则：ci/conan/build_and_test.sh 的 Pre-download
#   步骤用正则从 conandata.yml **全文**提取 URL（注释行也在提取范围内），下载后
#   再对全文做字符串替换。而 xorg.freedesktop.org 的 archive/releases 路径
#   **确实**在该脚本的 mirror fallback 域名表内（build_and_test.sh:1234-1238）。
#   本包踩到的实况：注释里那个带尾斜杠的目录前缀恰好是下面真实 url 的
#   **前缀子串**，于是真实 url 被替换折成
#   "<hash>_source_<hash>xset-1.2.5.tar.gz" 这种不存在的路径，
#   conan create 在 source() 就抛 FileNotFoundError ⇒ W3 的 L1 红
#   （2026-09-25 02:46 复现并定位，机制与处置见
#   knowledge/drafts/DRAFT-8960-raqm-0.11.0-conandata-comment-url-predl-pollution.md）。
#   自查：awk 扫"以 # 开头且含双斜杠协议分隔符"的行，必须无输出。

sources:
  xset:
    url: "https://xorg.freedesktop.org/archive/individual/app/xset-1.2.5.tar.gz"
    sha256: "2068d1356d80c29ce283f0fff5895667b38f24ea95df363d3dde7b8c8a92fffe"

  # vendored libXmuu 源码（E277 vendored 依赖模式）。
  # 存在理由见 conanfile.py 模块 docstring 与 notes.md：xset 的
  # configure.ac:44 无条件要求 pkg-config 模块 `xmuu`，而 ohpcd 制品仓没有
  # libxmu（`archives/l/libxmu/1.3.1/` 已合入 main 但未发布制品，先例
  # `archives/c/chiark-utils/8.0.1/conanfile.py:46` 有同等记载）。
  # 官方 X.Org dist tarball，sha256 为官方发布公告值，且与
  # `archives/x/xeyes/1.3.1/conandata.yml` 的 libxmu 条目一致。
  # 构建只取其中的 libXmuu（5 个源文件），不构建需要 xt 的全量 libXmu。
  # 该条目同样只写官方直链；注释不含协议 URL 的理由见本文件上方说明。
  libxmu:
    url: "https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.1.4.tar.gz"
    sha256: "3091d711cdc1d8ea0f545a13b90d1464c3c3ab64778fd121f0d789b277a80289"
    upstream_version: "1.1.4"

patches: {}
