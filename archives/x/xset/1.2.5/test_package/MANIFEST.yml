# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xset/1.2.5
homepage: "https://gitlab.freedesktop.org/xorg/app/xset"

# 上游源码审计：xset-1.2.5 官方 dist tarball 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码树 (xset-1.2.5.tar.gz 解包结果)"
    reason: "目录只有 man/ 与源码文件（xset.c 单文件主程序）；无 tests/、test/、t/ 目录，无任何测试源文件。"
  - source: "Makefile.am"
    reason: "SUBDIRS = man；bin_PROGRAMS = xset；xset_SOURCES = xset.c；xset_LDADD = $(XSET_LIBS)。全文 grep 'check'/'TESTS' 零命中，无 check 目标、无 TESTS 变量。"
  - source: "man/Makefile.am"
    reason: "只有 appman_PRE/appman_DATA 的 man page 生成规则（.man.$(APP_MAN_SUFFIX)），与测试无关。"
  - source: "configure.ac"
    reason: "仅 AM_INIT_AUTOMAKE、XORG_DEFAULT_OPTIONS、AC_CHECK_FUNCS([usleep]) 与 4 处 PKG_CHECK_MODULES，无测试相关宏、无 AM_ENABLE_TESTS。"
  - conclusion: "上游 1.2.5 未提供自动化测试；验证手段为 test_package 从消费者视角真实执行打包二进制（6 条硬断言，见下）。"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# 上游无 check/test 目标，无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_xset.sh
    description: "真实执行打包的 xset 二进制，6 条硬断言（每条绑定 xset.c 的一个在无 X server 环境下确实可达的出口）：①-version 输出恰为 'xset 1.2.5' 且 rc=0（xset.c:171-173，XOpenDisplay 之前）；②无选项走 usage(NULL)（xset.c:178-180），断言 rc=0 并命中 'usage:  xset [-display host:dpy] option ...'——rc=0 是上游事实（usage() 尾部 exit(EXIT_SUCCESS)，xset.c:1648），故不拿非 0 退出当判据；③usage 文本含 'Display Power Management Signaling (DPMS)' 小节（#ifdef DPMSExtension，xset.c:1593-1604），正向反证 libxext(SET_XEXT→DPMSExtension) 依赖真实生效；④xset -display qzy-no-such-x-host:99 q 非 0 退出且报 'unable to open display'（xset.c:182-187），证明二进制动态装载成功（libX11.so.6/libXext.so.6 的 DT_NEEDED 全部解析）且真实进入 Xlib 连接路径；⑤xset -display 与 xset -d 缺值都命中 'missing argument to -display' 并接 usage 文本、rc=0（xset.c:167-170 → usage(fmt)），该分支位于 main 第一轮扫参循环、在 182 行 XOpenDisplay 之前 ⇒ 无 X 可达；⑥usage 文本不含 'To control font cache'（#ifdef FONTCACHE，xset.c:1605-1612），反向反证配方的 --without-fontcache 真实传到 configure；③与⑥一正一反，排除 usage 文本被整体裁掉或整体编进这两种假绿。"
    command: "bash test_xset.sh"

# ★ 断言可达性更正（第三棒实测）：上一版本此处曾声明第 5 条为
#   "xset -no-such-option 命中 unknown option -no-such-option（xset.c:756）"，
#   实为**不可达**断言：xset.c:165-177 的第一轮扫参对任意未识别参数只置
#   hasargs=True，随后 182 行无条件 XOpenDisplay；756 行位于 189 行起的第二轮
#   循环，必须先有可用 X 连接。无 X server 时该命令的真实出口是
#   'unable to open display ""'（rc=1）。已在 2026-09-25 换成本文件上方的
#   可达断言⑤，实测日志见 archives/x/xset/1.2.5/reports/conan-create.log。

# 未覆盖功能面（必须与 notes.md 一致，勿删）
# 需要真实 X server 才能执行的功能路径在本环境无法断言：
#   xset q（查询 keyboard/pointer/screen saver/DPMS/font path 全量状态）
#   b [vol pitch dur] / -b（bell）、c [0-100] / -c（click）、led k / -led k（键盘 LED）
#   m1..m5 / mouse accel/threshold、kb（keymap 与 auto repeat delay/rate）
#   fp / +fp / -fp / fp= （字体路径，含 xset.c:1661 的 bad font path 错误分支）
#   dpms [standby suspend off] / +dpms / -dpms / dpms force（DPMS 实际控制）
#   s [timeout cycle] / -s（screen saver）、r（bell pitch 重置）、q（query 快捷）
# 另有三类本环境不可达、故未纳入断言的代码路径：
#   xset.c:756 的 usage("unknown option %s")（需先建立 X 连接，见上方说明）；
#   xset.c:1681/1684 的 XmuPrintDefaultErrorMessage 调用点（X 错误回调内，同上；
#     vendored libXmuu 已静态链入由 readelf 符号表另证，见 notes.md）；
#   xset.c:1569-1576 带 fmt 的 usage 分支已由断言⑤覆盖，但其余同类点
#     （usage("missing fp= argument") 等）均需 X 连接。
# 按条件编译裁掉的路径本次未纳入：xf86misc（上游默认 --without）、
# fontcache（本配方显式 --without-fontcache，其"被裁掉"本身由断言⑥正向证明）。
not_covered: "需真实 X server 的功能面（查询与全部设置类子命令），以及 xset.c:756 unknown option 分支与 X 错误回调中的 XmuPrintDefaultErrorMessage 调用点，见上方清单"

# 测试断言总数（用于质量评估）
assertion_count: 6
