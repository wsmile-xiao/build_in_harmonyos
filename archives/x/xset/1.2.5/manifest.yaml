software: xset
version: "1.2.5"
status: built
build_date: "2026-09-25"
conan_ref: "xset/1.2.5"

source:
  url: "https://xorg.freedesktop.org/archive/individual/app/xset-1.2.5.tar.gz"
  sha256: "2068d1356d80c29ce283f0fff5895667b38f24ea95df363d3dde7b8c8a92fffe"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build/--host=aarch64-unknown-linux-gnu（OHOS：config.guess 认不出 HarmonyOS）"
    - "--without-fontcache（xfontcache 未发布；显式关闭保证 CI 与本地同形）"
    - "PKG_CONFIG_PATH 在 build() 作用域注入：generators 目录（PkgConfigDeps 的 x11/xext/xproto.pc + 自写 xmuu.pc）+ 各依赖 lib/pkgconfig"
  dependencies:
    - libx11/6.4.0 (conan 依赖，ohpcd 已发布 OHOS armv8 binary)
    - libxext/6.4.0 (conan 依赖，ohpcd 已发布 OHOS armv8 binary)
    - xorgproto/2025.1 (conan 依赖，提供 xproto.pc 与 X11/Xproto.h)
    - "libXmuu 1.1.4 (E277 vendored：制品仓无 libxmu，配方从 X.Org 官方源只构建 src/Makefile.am 的 libXmuu 目标（5 个源文件，仅依赖 x11），静态链入)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "xset 的 configure.ac:44 PKG_CHECK_MODULES(XSET, [xproto >= 7.0.17 xmuu]) 是 2 参数硬失败形式：X.Org app 的必需 pkg-config 模块清单必须逐行读 configure.ac，不能按'X 客户端只需要 x11/xext'的先验推断 [ref: 本包新增；E468 是 PKG_CONFIG_PATH 未注入，签名与解法均不同，不可混引]"
  - "「配方已合入 main」不等于「制品仓可取」：libxmu/1.3.1 的 recipe 在 main 里存在、notes 自称依赖已发布，但全新 CONAN_HOME 下 conan download --only-recipe 与故意不存在包报同一句 'system acceleration policy not enabled' [ref: E477 错误文本语义 + archives/c/chiark-utils/8.0.1/conanfile.py:46 同结论记载]"
  - "判依赖发布态的探针纪律：①必须全新 CONAN_HOME（复用缓存时 rc=0 可能只是 'Skip recipe ... already in cache'，根本没联系远端）；②新 CONAN_HOME 必须连 remotes.json/global.conf 一起拷，否则全体报 'Remote ohpcd doesn't exist'＝环境问题被误读成依赖问题；③同轮必带正控制（zlib）与反控制（故意不存在的包），目标报错与反控制逐字相同才可判未发布 [ref: 探针纪律本包新增；E477 仅建议 conan list 复核，未覆盖①②③，且 R35 禁以 conan list 判 binary]"
  - "libXmuu 是可独立构建的最小库：libXmu 的 src/Makefile.am 里 libXmuu_la_SOURCES 只有 5 个文件且 configure.ac 的 PKG_CHECK_MODULES(XMUU, x11) 只依赖 x11 ⇒ `make -C src libXmuu.la` 单独构建即可绕开全量 libXmu 的 xt 依赖（xt 同样无已发布制品），无需把 libICE/libSM/libXt 整条链都内建（对比 xeyes/1.3.1 因为真用 Xt/Xmu/Xi 才必须建全链） [ref: E277 vendored 模式的本包实例]"
  - "X.Org dist tarball 自带预生成 configure ⇒ 不需要 xorg-macros/util-macros/automake 的 tool_requires（同 libx11/6.4.0、libxext/6.4.0）；只有 GitHub tag archive（如 xsel/1.2.1）才必须 autoreconf 自举 [ref: 与 E468 互补——E468 适用面为确需 xorg-macros.pc 的包，dist tarball 不落入]"
  - "HMDFS getcwd 与 E114 umask 077 两处对 configure 的改写要同时应用到 vendored 依赖的 configure（本配方对 xset 与 libXmu 两份 configure 都打） [ref: E114 + xsel/1.2.1 机理在本包的第二处落点]"
  - "conandata.yml 的注释里不得写带协议的 URL：ci/conan/build_and_test.sh 的 Pre-download 用正则从 conandata 全文提取 URL（含注释行）并对全文做字符串替换，注释里的目录前缀若是真实 url 的前缀子串，真实 url 会被折成不存在的拼接路径，conan create 在 source() 即 FileNotFoundError ⇒ W3 的 L1 红 [ref: knowledge/drafts/DRAFT-8960-raqm-0.11.0-conandata-comment-url-predl-pollution.md；同机制另见 DRAFT-8543，同族不同签名见 E333]"
