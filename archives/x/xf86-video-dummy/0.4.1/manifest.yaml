package: xf86-video-dummy
version: 0.4.1
source: https://gitlab.freedesktop.org/xorg/driver/xf86-video-dummy/-/archive/xf86-video-dummy-0.4.1/xf86-video-dummy-xf86-video-dummy-0.4.1.tar.gz
build_system: autotools
compiler: clang 15.0.4 (OHOS SDK)
target_platform: openharmony-aarch64
dependencies:
  - xorg-server >= 21.1.15
  - pixman-1 >= 0.46.4
  - xproto >= 7.0.31
  - randrproto >= 1.6.0
  - renderproto >= 0.11.1
install_files:
  - lib/xorg/modules/drivers/dummy_drv.so
patches:
  - HMDFS-umask-fix (config.status umask 077 -> 022 for HMDFS compatibility)
  - xorg-server.m4 (installed xorg-server.m4 macro file for autoreconf)
  - pciaccess.h (installed pciaccess.h header for compilation)
