software: xf86-video-dummy
package: xf86-video-dummy
version: "0.4.1"
status: built
build_system: autotools

build_date: "2026-08-09"

source:
  url: "https://gitlab.freedesktop.org/xorg/driver/xf86-video-dummy/-/archive/xf86-video-dummy-0.4.1/xf86-video-dummy-xf86-video-dummy-0.4.1.tar.gz"
  sha256: "3f5c9d9904b0e5683edd546d7de2960045dbc9b5e301dabd3abba3c2f1f71bea"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=${prefix}"
  dependencies:
    - "xorgproto/2025.1"
    - "pixman/0.46.4"
  cc: clang
  cxx: clang++

install_files:
  - lib/xorg/modules/drivers/dummy_drv.so

patches_applied: []

knowledge_gained:
  - "xorg-server SDK headers downloaded from x.org releases at build time"
  - "Direct compilation bypasses autotools to avoid automake/libtool CI dependency"
  - "pciaccess.h provided as minimal stub since dummy driver doesn't access PCI"
  - "XORG_VERSION_CURRENT = 12101015 for xorg-server 21.1.15"
