# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e check

package: xf86-video-dummy/0.4.1
homepage: "https://gitlab.freedesktop.org/xorg/driver/xf86-video-dummy"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests (this package has no test suite)
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# Test package tests
test_package_tests:
  - file: test.c
    description: "Verifies dummy_drv.so exists and is loadable via dlopen"
    command: "./test_xf86_video_dummy"

# Assertion count
assertion_count: 3
