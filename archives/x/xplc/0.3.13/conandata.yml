sources:
  url: "https://deb.debian.org/debian/pool/main/x/xplc/xplc_0.3.13.orig.tar.gz"
  sha256: "158a0f44a2eb055522377c275bbd0e7412dd3b8a9b75ec344c0457b3a1a29cbb"

patches:
  - patch_file: "patches/0001-config.guess-harmonyos.patch"
    patch_description: "Emit the ohos triplet for HarmonyOS/HongMeng uname and use umask 022 for the temp dir (2005 config.guess has no HarmonyOS case; HMDFS cannot write umask-0700 dirs)"
    patch_type: "portability"
    sha256: "74178ff52a7d2d95a27a71d10380c24ae2bc9acc454683e049067f43ea8baee6"
  - patch_file: "patches/0002-config.sub-ohos.patch"
    patch_description: "Accept linux-ohos in the maybe_os whitelist, the OS base list and the OS canonicaliser (must precede the -linux* rule or it becomes linux-gnu-ohos)"
    patch_type: "portability"
    sha256: "98d122b9464f27465933a38ac2ce9c9ff12bd8b4dc54c77b941b4b90ef218815"
  - patch_file: "patches/0003-configure-umask-022.patch"
    patch_description: "Use umask 022 for the config.status temp dir (setgid hmdfs makes umask 077 dirs unwritable, so config.h/autoconf.h were never written while rc stayed 0)"
    patch_type: "portability"
    sha256: "7a28975968d2e4b114715f5166d8d1faed7e885d3d4e33bb5ef5450847248275"
