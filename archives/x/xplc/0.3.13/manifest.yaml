# 版本级 manifest
# 文件位置: archives/x/xplc/0.3.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.13"

# 软件名
software: "xplc"

# 编译状态
# published | built | failed | archived
# O5: 合并 + release upload 确认前一律 built
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian pool 与 SourceForge 官方源 sha256 三面全等）
  url: "https://deb.debian.org/debian/pool/main/x/xplc/xplc_0.3.13.orig.tar.gz"

  # 源码校验和
  sha256: "158a0f44a2eb055522377c275bbd0e7412dd3b8a9b75ec344c0457b3a1a29cbb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（recipe generate() 实际注入的 configure 参数）
  configure_options:
    - "INSTALL=/bin/install"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "uuid/2.40.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-config.sub-ohos.patch"
  - "0003-configure-umask-022.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "档案 uuid 的 uuid.pc 报 Cflags: -I${includedir}/uuid，与源码 <uuid/uuid.h> 形态不匹配；必须走 conan cpp_info（AutotoolsDeps 注入 -I<prefix>/include），不得采信 pkg-config --cflags（三路编译实证 A rc=0 / B rc=1 / C rc=0） (knowledge_ref: E2186)"
  - "Autoconf 2.59 的 configure rc=0 不等于成功：umask 077 + mktemp 在 HMDFS 落 drwx--S--- 致 config.h/autoconf.h 写不出而 rc 仍 0；须补 umask 022 并在配方里对 include/autoconf.h + config/config.mk 做存在性核对才进 make (knowledge_ref: E011)"
  - "2005 版 config.guess/config.sub 无 HarmonyOS/ohos 词表：config.guess 在主 case 首位注入 HarmonyOS|HongMeng 分支（在 set_cc_for_build 的 umask-077 临时目录之前 exit，一并消掉权限面），config.sub 三处加 linux-ohos*（-linux-ohos* 分支须排在 -linux* 之前否则被 sed 改写成 linux-gnu-ohos） (knowledge_ref: E160)"
  - "旧 C++ 的 switch(unsigned){case -1:} 在 C++11 起即硬错误，bcp 先例的 gnu++14 降档对此无效（窄化=11 起死 vs 动态异常规格=17 才移除，二者降档有效性相反）；只能 -Wno-c++11-narrowing 保 cppstd=17 (knowledge_ref: E705)"
  - "PATH 不含 /bin 时 configure 探测 install 落空，回退 2000 版 install-sh（第 57 行 while 只解析选项、无多源循环）→ make install rc=0 却 24 头只装 1 个；须 configure_args 注入 INSTALL=/bin/install 并把产物核对从 configure 扩到 install 阶段 (knowledge_ref: E011)"
  - "find 无匹配仍 rc=0 构成第三层假阳性：核产物必须断言计数（头文件 24 为硬下界），不能只用 find ... && echo OK (knowledge_ref: E011)"
  - "unstable（奇数 minor）上游把 -DUNSTABLE 只加进 CFLAGS 而 xplc.pc 不带它，消费者按 pkg-config 编译时头文件展开出 C++11 非法的类内 static bool 成员；package_info 须加 defines=[\"UNSTABLE\"] (knowledge_ref: E705)"
  - "奇数 minor 的 unstable 路径 SONAME=libxplc.so.<ver>-unstable 与 install 装出的 libxplc.so.<ver> 不一致，动态消费者 Error loading shared library（带 LD_LIBRARY_PATH 也失败）；package() 须补 SONAME 同名符号链接 (knowledge_ref: E705)"
  - "conan 注入面两坑：AutotoolsToolchain.cxxflags 是 property（append 静默失效，必须 extra_cxxflags）；tc.extra_env 在本 conan 版本不存在，configure 期环境量须走 configure_args.append(\"VAR=VALUE\") (knowledge_ref: E2186)"
  - "xplc 的 mutate<T>() 会 release 入参（utils.h:198），消费者对同一对象再 release 一次即双重释放/段错误；须对齐上游 test004 范式（getObject → mutate<> → 只释放返回值） (knowledge_ref: E705)"
  - "上游测试入口是 make tests（无 check 目标）：ADD_TEST 注册 12 项 = 源文件 12 = 函数定义 12，静态断言 191（test0*.cpp 182 + test.h 9），运行时实测 0 failed / 230 passed (knowledge_ref: E705)"
