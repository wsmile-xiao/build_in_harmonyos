# test_package/MANIFEST.yml
# 上游官方测试声明 — CI (build_and_test.sh L0e) 强制要求本文件存在。
# 口径: N = 上游测试总数(清点), N' = 本次实际运行数。test_package 断言
# 不进上游分母, 单列于文末 assertion_count (计入 PR「鸿蒙特有测试」行)。

package: xplc/0.3.13
homepage: "https://xplc.sourceforge.net/"

# 上游唯一测试入口 (上游没有 `make check`; 目标名是 tests)
upstream_check_command: "make tests"
upstream_test_in_build: true
upstream_test_command: "make tests"

# 清点口径: tests/testmain.cpp 的 ADD_TEST 注册 12 项 = tests/test0*.cpp 文件 12 个
# = void test0NN() 定义 12 个 (三口径一致, 无条件编译差额)。
# 断言调用点: tests/test0*.cpp 内 ASSERT/VERIFY 182 处 + tests/test.h 辅助类
# 9 处 = 191 处静态; 运行时实际执行 230 条 (test001/test005/test010 等在循环
# 内重复触达), 设备实测 `./testmain: 0 failed, 230 passed`。
upstream_tests:
  - file: test000.cpp
    source: xplc-0.3.13/tests/test000.cpp
    description: "IObject reference counting"
    command: "tests/testmain test000"
    assertions: 2
  - file: test001.cpp
    source: xplc-0.3.13/tests/test001.cpp
    description: "interface lookup through getInterface()"
    command: "tests/testmain test001"
    assertions: 20
  - file: test002.cpp
    source: xplc-0.3.13/tests/test002.cpp
    description: "category manager"
    command: "tests/testmain test002"
    assertions: 13
  - file: test003.cpp
    source: xplc-0.3.13/tests/test003.cpp
    description: "static service handler"
    command: "tests/testmain test003"
    assertions: 6
  - file: test004.cpp
    source: xplc-0.3.13/tests/test004.cpp
    description: "generic component template"
    command: "tests/testmain test004"
    assertions: 11
  - file: test005.cpp
    source: xplc-0.3.13/tests/test005.cpp
    description: "component template, second pass"
    command: "tests/testmain test005"
    assertions: 26
  - file: test006.cpp
    source: xplc-0.3.13/tests/test006.cpp
    description: "weak references"
    command: "tests/testmain test006"
    assertions: 19
  - file: test007.cpp
    source: xplc-0.3.13/tests/test007.cpp
    description: "UUID string conversion (FromString/ToString)"
    command: "tests/testmain test007"
    assertions: 13
  - file: test008.cpp
    source: xplc-0.3.13/tests/test008.cpp
    description: "module ABI and dynamic loading"
    command: "tests/testmain test008"
    assertions: 15
  - file: test009.cpp
    source: xplc-0.3.13/tests/test009.cpp
    description: "object lifetime and factories"
    command: "tests/testmain test009"
    assertions: 11
  - file: test010.cpp
    source: xplc-0.3.13/tests/test010.cpp
    description: "module loader and service wiring"
    command: "tests/testmain test010"
    assertions: 24
  - file: test011.cpp
    source: xplc-0.3.13/tests/test011.cpp
    description: "category iteration"
    command: "tests/testmain test011"
    assertions: 22

# test_package 消费者侧断言 (不进上游分母, 计入 PR「鸿蒙特有测试」行)
test_package_tests:
  - file: test.cpp
    description: "C++ consumer: UUID parse/format round trip, equality operators, XPLC_getServiceManager() and module-loader resolution (dlopen path on OHOS)"
    command: "./test_xplc"
    assertions: 11
  - file: test_uuidgen.sh
    description: "CLI consumer: uuidgen emits a canonical 36-char UUID, is non-constant across runs, and the uuidcdef symlink selects the braced C-def sink"
    command: "./test_uuidgen.sh <bin>/uuidgen"
    assertions: 4

# 上游静态断言调用点 191 (182 in test0*.cpp + 9 in test.h); 运行时实测 230。
# 消费者断言 15 (11 + 4) 单列, 不并入上游分母。
assertion_count: 15
