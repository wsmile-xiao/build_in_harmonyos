software: xvid
display: "xvid"
description: "MPEG-4 video codec library (ISO compliant, high quality)"
category: multimedia
homepage: "https://www.xvid.com/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需替换为2024版以支持 HarmonyOS (E007)"
    - "configure 中 umask 077 需修改为 002 以兼容 HMDFS 文件系统权限"
    - "源码树嵌套结构需手动处理 src 目录和 SRC_DIR 路径调整"
  common_dependencies: []

versions:
  "1.3.7":
    status: built
    build_date: "2026-06-02"
