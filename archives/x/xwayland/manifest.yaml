software: xwayland
name: XWayland
description: X server for Wayland compositor
category: x11
license: MIT
website: https://wayland.freedesktop.org/xwayland.html

versions:
  - version: "24.1"
    status: published
    compiled_at: 2026-05-30
    notes: |
      - XWayland 是独立的 X server，运行在 Wayland 合成器中
      - 使用 xorg-server-21.1.15 源码编译
      - 需要 wayland, wayland-protocols 依赖
    dependencies:
      - wayland
      - wayland-protocols
      - libXfont2
      - pixman
      - libdrm
      - xkeyboard-config
    binaries:
      - Xwayland