software: xwayland
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/24.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "24.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/xserver-xwayland-24.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dxwayland=true"
    - "-Dxorg=false"
    - "-Dxephyr=false"
    - "-Dxnest=false"
    - "-Dxvfb=false"
    - "-Dxwin=false"
    - "-Dxquartz=false"
    - "-Ddocs=false"
    - "-Ddevel-docs=false"
    - "-Dudev=false"
    - "-Dudev_kms=false"
    - "-Dsystemd_notify=false"
    - "-Dsystemd_logind=false"
    - "-Dxdmcp=false"
    - "-Dxdm-auth-1=false"
    - "-Ddri1=false"
    - "-Ddri2=false"
    - "-Ddri3=false"
    - "-Dglamor=false"
    - "-Dglx=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - wayland/1.23.1
    - wayland-protocols/1.38
    - libXfont2/2.0.7
    - xkbcomp/1.4.7
    - libxshmfence/1.3.2
    - libxcvt/0.1.3
    - pixman/0.46.4
    - libdrm/2.4.133
    - nettle/3.10.2
    - xtrans/1.5.0
    - xkbfile/1.1.0
    - libXau/1.0.11

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
