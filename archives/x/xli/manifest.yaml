software: xli
display: "xli (X11 image display/manipulation utility)"
description: "X11 image display/conversion utility (xloadimage fork) with JPEG/PNG support; xli needs an X display, xlito works display-less"
category: tool
homepage: "https://github.com/openSUSE/xli"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Upstream builds with Imake (Imakefile); OHOS SDK has no imake/xmkmf → build via the released Makefile.std (documented upstream alternative) with -I/-L/-l injected from the Conan dependency graph."
    - "OHOS musl libc provides no BSD legacy rindex() (index/bcopy/bzero/bcmp exist) → minimal -Drindex=strrchr; upstream -DSYSV not used (pulls in missing F_FREESP/stropts/poll)."
    - "Makefile.std install target installs xli only → package() also copies xlito and the man pages."
    - "Upstream ships no test suite → test_package runs a consumer test: xlito round-trip conversion plus xli startup smoke."
    - "Upstream project site is offline (HTTP 404) → source is the openSUSE fork snapshot of the 2006-11-10 release, pinned by sha256."
  common_dependencies:
    - libx11
    - libxext
    - libjpeg
    - libpng
    - zlib

versions:
  "1.17.0-20061110":
    status: built
    build_date: "2026-10-04"
    path: archives/x/xli/1.17.0-20061110
