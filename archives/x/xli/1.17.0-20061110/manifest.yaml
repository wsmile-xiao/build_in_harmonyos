# 遵循 ARCHIVE-SPEC v2.0

version: "1.17.0-20061110"
software: "xli"
status: built
build_date: "2026-10-04"
# 上游构建系统是 Imake（无 imake/xmkmf 工具链）→ 使用发行快照自带的 Makefile.std 直编
build_system: makefile

source:
  url: "https://github.com/openSUSE/xli/archive/79edc902e82970411542a0fa7dc38ce1edcae2ec.tar.gz"
  sha256: "60043c23eb3dcbb58ca978fc22c26c3cfb8e33302c1714c52ad880d437e6ea07"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - libx11/6.4.0
    - libxext/6.4.0
    - libjpeg/10
    - libpng/1.6.58
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS SDK 无 imake/xmkmf：Imake 遗产 X11 库优先走发行快照自带的 Makefile.std 直编，Imake 的 -I/-L 解析换成 Conan 依赖注入"
  - "OHOS musl 未提供 BSD 遗留 rindex()（index/bcopy/bzero/bcmp 均存在）：逐函数最小替换 -Drindex=strrchr，禁用上游 -DSYSV 总开关"
  - "Makefile.std 的 install 目标只安装 xli 不安装 xlito：package() 需显式补装"
  - "上游官方站点已下线（HTTP 404），源码取 openSUSE fork 保存的 2006-11-10 原始发行快照（sha256 固定）"
