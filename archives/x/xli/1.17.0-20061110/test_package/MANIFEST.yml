# test_package/MANIFEST.yml — xli 1.17.0-20061110
# CI L0e requires this file to exist.

package: xli/1.17.0-20061110
homepage: "https://github.com/openSUSE/xli"

# 上游测试清点（R51）：xli 1.17.0 源码树无 tests/ 目录，
# Makefile.std 仅有 std/sysv/gcc/sysv-gcc/xli/xlito/install/clean/man 目标，无 check。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer perspective, headless)
test_package_tests:
  - file: test_xli_consumer.sh
    description: "xlito 在真实图片文件上嵌入/读回 xli 选项块；xli -help 交互模式启动验证 X11 依赖链"
    command: "conan test"

# Approximate assertion count
assertion_count: 6
