# Upstream test provenance and consumer behavior coverage for xlinks 2.30.
package: "xlinks/2.30"
homepage: "https://links.twibright.com/"

# Automake supplies a generic check target, but it aliases check-am -> all-am.
upstream_check_command: "make check (generated check-am depends only on all-am; no tests are registered)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: "test_http.py"
    description: "Native HarmonyOS consumer test: executes the installed links binary through device Bash and serves real HTTP responses on 127.0.0.1; verifies text and entity rendering, redirect handling, hidden script/style omission, a 404 body, bounded connection failure, and the conventional --version CLI alias."
    command: "CONFIG_SHELL=/data/service/hnp/bin/bash python3 test_http.py"
    executed_by: "test_package/conanfile.py::test()"

assertion_count: 16
