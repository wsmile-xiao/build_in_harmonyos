version: "2.30"
software: "xlinks"
status: built
build_date: "2026-10-06"
build_system: "autotools"

source:
  url: "https://links.twibright.com/download/links-2.30.tar.gz"
  sha256: "7f0d54f4f7d1f094c25c9cbd657f98bc998311122563b1d757c9aeb1d3423b9e"
  tar_format: "tar.gz"

build:
  system: "autotools"
  target: "aarch64-unknown-linux-ohos"
  configure_options:
    - "--disable-graphics"
    - "--without-x"
    - "--without-brotli"
    - "--with-ssl"
    - "--without-libevent"
    - "--without-gpm"
    - "--without-zstd"
    - "--without-bzip2"
    - "--without-lzma"
    - "--without-lzip"
    - "--without-openmp"
  linker_flags:
    - "-static"
  dependencies:
    - "openssl/3.5.8.1"
    - "zlib/1.3.2.1"
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "patches/0001-accept-double-dash-version.patch"

compatibility:
  level: "high"
  issues: []
  notes: |
    - 仅构建文本终端浏览器；关闭图形支持及 X Window System 驱动。
    - HTTPS 与 zlib 压缩由已发布的 Conan 依赖提供；为满足静态链接要求，不启用 Brotli 压缩。
    - 补丁为传统单连字符 -version 增加 --version 别名，供通用 CLI smoke check 使用。

test_results:
  type: "device"
  passed: 6
  failed: 0
  rate: "6/6 (100%)"
  note: "HarmonyOS 6.0 aarch64 真机 Conan test_package 的 5 项 loopback 行为测试及 --version CLI 兼容测试全部通过；全仓 12 组测试、G0、Conan verify 和 W3 均通过。"

knowledge_gained: []
references:
  - "https://links.twibright.com/"
