# test_package/MANIFEST.yml — xmacro 0.3pre-20000911
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xmacro/0.3pre-20000911
homepage: "https://sourceforge.net/projects/xmacro/"

# 上游无自动化测试套件 (无 make check 目标, 无测试目录);
# 上游提供的是手工宏录制/回放流程, 需真实 X server 与键鼠事件授权。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
# 上游测试数量: 0 (收集到 0, 通过 0 — 上游从未提供自动化测试)
# 降级说明: build() 阶段以三个二进制全部编译链接成功作为上游验证替代;
# XTest 录制/回放功能路径归入真机 X 环境验证, 未在本机伪造通过。

# test_package 自带测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py#test()
    description: "三二进制齐全; xmacroplay -v 版本输出 exit 0; 无参调用 Usage: 且 exit 非 0"
    command: "conan test (5 assertions)"

# 测试断言总数
assertion_count: 5
