# 软件级 manifest
software: xapian
display: "Xapian"
description: "全文检索引擎库及其数据库工具"
category: library
homepage: "https://xapian.org/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Upstream source archive is named xapian-core; Conan package identity is xapian"
    - "The glass and honey backends require zlib"
    - "HarmonyOS may deny /proc/sys/kernel/random/uuid; the port falls back to /dev/urandom"
    - "Autotools config.guess/config.sub need to recognize HarmonyOS linux-ohos"
    - "Use POSIX-compatible configure sed addressing and account for HMDFS file modes"
  common_dependencies:
    - "zlib/1.3.1.1"

versions:
  "2.0.0":
    status: built
    build_date: "2026-09-27"
