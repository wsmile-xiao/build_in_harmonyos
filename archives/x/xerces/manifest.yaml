software: xerces
display: "Apache Xerces-C++"
description: "Apache Xerces-C++ validating XML parser library"
category: library
homepage: "https://xerces.apache.org/xerces-c/"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 平台检测走 UNIX/WIN32/APPLE 通用标志，HarmonyOS 下无需补丁"
    - "三个后端钉到 libc-only：network-accessor=socket / transcoder=gnuiconv / message-loader=inmemory，规避 ICU 与 libcurl"
    - "musl 的 pthread/iconv/socket 全在 libc，静态库无额外系统依赖"
    - "默认构建静态库；上游 ctest 全量运行（ThreadTest 压力项除外，见版本 notes）"
  common_dependencies: []

versions:
  "3.3.0":
    status: built
    build_date: "2026-09-19"
