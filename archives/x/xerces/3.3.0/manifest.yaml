version: "3.3.0"
software: xerces
status: built
build_date: "2026-09-19"
build_system: cmake

source:
  url: "https://archive.apache.org/dist/xerces/c/3/sources/xerces-c-3.3.0.tar.gz"
  sha256: "9555f1d06f82987fbb4658862705515740414fd34b4db6ad2ed76a2dc08d3bde"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-Dnetwork-accessor=socket"
    - "-Dtranscoder=gnuiconv"
    - "-Dmessage-loader=inmemory"
    - "ctest --output-on-failure --no-tests=error -E \"^ThreadTest\" (upstream, 64/64 tests+samples cases minus 16 ThreadTest stress)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "xerces-c CMake 平台检测走 UNIX/WIN32/APPLE 通用标志（无 STREQUAL Linux 分支），CMAKE_SYSTEM_NAME=HarmonyOS 下行为一致，无需补丁"
  - "三个后端显式钉到 libc-only 实现：network-accessor=socket / transcoder=gnuiconv / message-loader=inmemory，规避 ICU 与 libcurl 依赖（R36）"
  - "musl 的 pthread/iconv/socket 全在 libc，静态库无需额外 system_libs"
  - "上游 ctest 共 80 项（tests/ 36 含 Char16Test + samples/ 44）；ThreadTest 16 项（10 线程 x 20 秒压力）用 -E 排除，剩余 64 项全量运行并以 HMBS_UPSTREAM_TEST_RESULT 取证"
  - "samples/ 的 install(TARGETS) 在 OHOS 触发 CMakeRelink 重链接，需中和 samples/cmake_install.cmake，仅交付库与头文件"

verification:
  real_device:
    date: "2026-09-19"
    env: "HarmonyOS PC 真机（aarch64 musl，OHOS SDK clang 15，conan 2.30）"
    result: "pending-preflight"
