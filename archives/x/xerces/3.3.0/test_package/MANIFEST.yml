# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xerces/3.3.0
homepage: https://xerces.apache.org/xerces-c/

# ── 上游测试：已在包构建中真实编译并执行 ────────────────────────────────
# 上游测试位于 tests/ + samples/（tests/CMakeLists.txt + samples/CMakeLists.txt +
# cmake/RunTest.cmake wrapper，对比观测日志与 expected/*.log，时序已归一化）。
# 本配方的 build() 先全量构建（含测试可执行文件），再执行：
#   ctest --output-on-failure --no-tests=error -E "^ThreadTest"
# 证据解析见 conanfile.py _run_upstream_ctest（汇总行主源 + 逐行回退，
# 总数漂移硬断言，HMBS_UPSTREAM_TEST_RESULT 双通道输出并持久化）。
upstream_check_command: "ctest --output-on-failure --no-tests=error -E \"^ThreadTest\""
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error -E \"^ThreadTest\""

# ── 分母（与官方口径一致）────────────────────────────────────────────
# 取数（v3.3.0 tag 源码包内执行）：
#   grep -c add_xerces_test tests/CMakeLists.txt     → 35（+ Char16Test 条件项，
#     编译器支持 char16_t 即注册，OHOS clang 下启用 → tests/ 共 36）
#   grep -c add_xerces_sample_test samples/CMakeLists.txt → 44
# 合计 80。其中 16 项为 ThreadTest 压力用例（ThreadTest + ThreadTest1..15，
# 各 -threads 10 -time 20），用 -E "^ThreadTest" 排除；剩余 64 项
# （tests/ 20 + samples/ 44，其中 tests/ 含 Char16Test）全量运行。
# 排除项在标记 excluded_cases/excluded_count/reason 中如实声明。
upstream_test_total: 80
upstream_test_count_method: ctest_entries

upstream_tests:
  - suite: tests/ 功能（DOM / Range / Traversal / XSerializer / XSValue / InitTerm / MemHandler / DOMTypeInfo / Char16）
    cases: 20
    delivered_config: compiled
    source: "tests/CMakeLists.txt（DOMTest, DOMMemTest, RangeTest, DOMTraversalTest, XSerializerTest+1..5, XSValueTest, InitTermTest+1..3, MemHandlerTest+1..2, DOMTypeInfoTest, Char16Test[char16_t可用时]）"
  - suite: samples/ 回归（SAX/DOM/MemParse/Redirect/StdInParse/PParse/EnumVal/CreateDOMDocument）
    cases: 44
    delivered_config: compiled
    source: "samples/CMakeLists.txt（SAXCount 4, SAXPrint 4, SAX2Count 4, SAX2Print 6, MemParse 2, Redirect 2, DOMCount 4, DOMPrint 6, StdInParse 3, PParse 3, EnumVal 2, SEnumVal 2, CreateDOMDocument 1, SAXPrintLong 1）"
  - suite: ThreadTest stress (excluded, declared)
    cases: 16
    delivered_config: excluded
    source: "tests/CMakeLists.txt (ThreadTest + ThreadTest1..ThreadTest15, each -threads 10 -time 20)"
    note: "吞吐量压力测试，单作业 OHOS worker 上耗时 300 秒以上且对调度时序敏感；tests/ 功能 + samples/ 回归共 64 项已全覆盖。排除项不计入通过率。"

# test_package 中自带的测试 (消费者视角验证；同一 conan create 内执行)
# 实测结果待真机预检回填（首轮仅完成工作树）。
test_package_tests:
  - file: test.cpp
    description: "XercesDOMParser 解析内存 XML + DOM 遍历断言（无错误/文档非空/根元素/根标签/2 个子元素/首个文本内容）"
    command: "./test_xerces"
    result: "待真机预检回填（设计 6 项 CHECK 断言）"

# 测试断言总数 (test_package 自带消费者测试)
# test.cpp: 6 项 CHECK 断言（每断言一行 CHECK PASS/FAIL）
assertion_count: 6
