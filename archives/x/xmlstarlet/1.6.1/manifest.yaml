name: xmlstarlet
version: 1.6.1
category: devops
status: built
build_system: autotools
build_date: 2026-05-15
compiler: clang 15.0.4
platform:
  os: ohos
  arch: aarch64

source:
  url: https://github.com/xmldata/xmlstarlet
  tag: 1.6.1

dependencies:
  runtime:
    - libxml2 >= 2.15.0
    - libxslt >= 1.1.42
  build:
    - clang
    - libxml2-dev
    - libxslt-dev

build_options:
  configure_flags:
    - --prefix=$DEFAULT_PREFIX
  ldflags:
    - "-fuse-ld=bfd -Wl,-rpath,$HOME/usr/local/lib"

verification:
  binary_test: passed
  version_command: xmlstarlet --version
  version_output: "1.6.1"
  functional_test: passed

artifacts:
  binary: ~/usr/local/bin/xmlstarlet
  package: archives/x/xmlstarlet/1.6.1/packaging/xmlstarlet-1.6.1-ohos-aarch64.tar.gz

notes: |
  Compiled with clang + GNU ld (bfd) to avoid lld libxml2 version conflict.
  Fixed config.h include path and usage.c generation.
  All functional tests passed.
