# ============================================================
# 版本级 manifest
# 文件位置: archives/x/xprop/1.2.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# ============================================================

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.8"

# 软件名
software: "xprop"

# 编译状态
# published | built | failed | archived
# 草案轮（未编译）如实记 draft；构建验证轮实编通过后由 finish/close-archive 置 built。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（www.x.org 在设备网络下 TLS 证书主机名不匹配，
  # xorg.freedesktop.org 为同一发布物的官方镜像，xeyes 1.3.1 同款先例）
  url: "https://xorg.freedesktop.org/releases/individual/app/xprop-1.2.8.tar.gz"

  # 源码校验和（真实下载算出，197390 字节）
  sha256: "a8394338c99775160d733d54d73cdcdc5c9c80a0dc8cffd5be1b7c977254b745"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

  # 单文件级直编说明：上游自带已生成 configure，直接 autotools 交叉编译；
  # PKG_CHECK_MODULES(XPROP, [x11 xproto >= 7.0.25]) 以预置 XPROP_CFLAGS/
  # XPROP_LIBS 逃逸（adcli KRB5_CFLAGS/KRB5_LIBS、xeyes XEYES_* 同款先例）
  configure_options:
    - "--x-includes=<libx11 包 include 目录>"
    - "--x-libraries=<libx11 包 lib 目录>"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu（xprop 1.2.8 的 config.sub 实测拒绝 ohos OS，统一 gnu 三元组跳过平台检测，仓库 libx11 配方/xeyes vendored 库同款，交叉工具链由 profile CC/CXX 保证）"
    - "XPROP_CFLAGS=-I<libx11 include> -I<xorgproto include>"
    - "XPROP_LIBS=-L<libx11 lib> -lX11"
    - "产物 E549 binary-sign-tool 自签名（binary-sign-tool sign -selfSign 1，与 xeyes/clinfo 同款）"

  # 编译依赖列表（格式: name/version）
  # 全部为制品仓已发布项；libx11 走 6.4.0 轨（xeyes/xclip/xsel 同款先例；
  # xprop 硬链接集合仅 -lX11，未命中 DRAFT-xbanish-1.8-x11-track-selection
  # 钉轨者表的任何子库，属"未命中任何钉轨者"的平凡路径）
  dependencies:
    - libx11/6.4.0
    - xorgproto/2025.1
    - libxcb/1.16
    - libxau/1.0.11
