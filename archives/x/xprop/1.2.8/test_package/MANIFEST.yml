# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: xprop/1.2.8
homepage: "https://gitlab.freedesktop.org/xorg/app/xprop"

# 上游源码审计（hmbs 硬门禁）：xprop 1.2.8 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am"
    reason: "仅声明 bin_PROGRAMS = xprop 与 SUBDIRS = man；无 TESTS/check_PROGRAMS/check-local 目标，make check 无任何用例。"
  - source: "meson.build"
    reason: "发布包不含 meson.build（xprop 1.2.8 仅 autotools 构建，解包实测 ls 无 meson.build）。"
  - source: "configure.ac"
    reason: "仅 PKG_CHECK_MODULES(XPROP, [x11 xproto >= 7.0.25])（L42）与 AC_CONFIG_FILES；无测试相关宏或 AC_CONFIG_TESTDIR。"
  - source: "源码树"
    reason: "发布包无 tests/、test/ 目录；xprop.c/clientwin.c/dsimple.c/dsfns.c 为产品代码，无 *_test 源文件。"
  - conclusion: "上游未提供自动化测试套件；由 test_package 真实执行被测二进制（-version 与无 X 错误路径）验证。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_xprop.sh
    description: "★实测口径：xprop 非 Xt 程序，main 在解析任何参数（含 -version/-root）前先经 dsimple.c Open_Display 连接 X server——dsimple.c L106 XOpenDisplay 失败后 fprintf 'unable to open display' 并 exit(1)。本平台无 X server，两项断言均真实执行被测二进制并断言上游确定性 no-X 错误路径（rc=1 + 'unable to open display'，全链路：动态链接/签名/进入 main/上游错误处理，R34 实质依赖被测包），不冒充功能级真机验证。断言一 xprop -version；断言二 xprop -root（主查询入口）。运行期按 xeyes 1.3.1 先例：libX11.so.6 的 DT_NEEDED（libxcb.so.1/libXau.so.6，设备栈仅有 .a）由主配方 libxcb/1.16 + libxau/1.0.11 的 conan run 依赖补齐，脚本以依赖序（libXau → libXdmcp → libxcb → libX11）.so 绝对路径 LD_PRELOAD 注入（HMBS [stale_runtime_library]），并以 HMBS 注入 SHELL=/bin/sh 执行（HMBS [shell_getcwd]，POSIX sh 兼容）"
    command: "$SHELL test_xprop.sh <package>/bin/xprop <LD_PRELOAD_libs>"

assertion_count: 2

# 运行时 not_covered（如实记账，不冒充通过）：
not_covered:
  - "查询/修改窗口属性的功能级运行时行为（xprop -root 查询真实窗口树等）需要
     X server，HarmonyOS PC 无 X server。另实测 -version 参数处理位于
     Open_Display 之后（上游结构使然），no-X 环境下无法单独验证版本输出。
     本 PR 的运行时证据只到'产物真实可执行 + 上游确定性 no-X 错误路径'，
     不宣称功能已真机验证。"

# ⓓ 资源预算：单 TU（xprop.c）+ 3 个辅助 TU，交叉工具链编译峰值
# 参照同规模 x.org app（xbanish 单 TU probe=83MB、预算 1000MB），本包
# build_mem_budget_mb 取 1000MB（留交叉工具链余量）。
build_mem_budget_mb: 1000
