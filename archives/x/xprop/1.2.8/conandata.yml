# conandata.yml — xprop 1.2.8
# www.x.org 在设备网络下 TLS 证书主机名不匹配，xorg.freedesktop.org 为
# 同一发布物的官方镜像（xeyes 1.3.1 conandata 同款先例）；该源不含
# github.com 字样，不受 conan_verify.py ghfast.top 镜像注入影响。
sources:
  xprop:
    url: "https://xorg.freedesktop.org/releases/individual/app/xprop-1.2.8.tar.gz"
    sha256: "a8394338c99775160d733d54d73cdcdc5c9c80a0dc8cffd5be1b7c977254b745"

# 补充信息（人工阅读；机器消费仅上面 sources 块）
build_date: "2026-09-24"
build_system: autotools
# 上游 tarball 自带已生成 configure（AM_INIT_AUTOMAKE 展开完毕），无需
# autoreconf；XORG_MACROS_VERSION/XORG_DEFAULT_OPTIONS 仅 autoreconf 时展开。
# configure 逃逸：预置 XPROP_CFLAGS/XPROP_LIBS（adcli KRB5_*、xeyes XEYES_*
# 同款先例）；依赖 libx11/6.4.0 + xorgproto/2025.1 + libxcb/1.16 + libxau/1.0.11
# 全部为制品仓已发布项（preflight_check.sh 实测 OK）。
