knowledge_gained:
  - "xeus 6.0.5 CMakeLists.txt 默认同时构建 shared 和 static library，OHOS 上 shared 有 SONAME 问题，仅构建 static (ref: E430-draft-0638)"
  - "CompilerWarnings.cmake 启用 -Werror 对 clang 15 部分转换警告会致命，通过 XEUS_WARNING_AS_ERROR=OFF 关闭 (ref: E430-draft-64CA)"
  - "find_dependency(nlohmann_json) 在 xeusConfig.cmake.in 中要求精确版本匹配，下游必须使用相同版本 nlohmann_json (ref: E639-draft-6102)"
