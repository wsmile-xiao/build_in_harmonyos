# Test package manifest for xeus 6.0.5

package: xeus/6.0.5
homepage: "https://github.com/jupyter-xeus/xeus"

upstream_tests:
  # xeus 6.0.5 ships a doctest-based test suite in test/
  # 7 test executables registered via CMake:
  #   test_xbase64, test_xbasic_fixed_string, test_xhash,
  #   test_xhelper, test_xin_memory_history_manager, test_xsystem,
  #   test_unit_kernel
  # Built with: cmake -DXEUS_BUILD_TESTS=ON .. && make && ctest
  has_tests: true
  test_framework: doctest
  test_directory: test/
  test_files:
    - test/test_xbase64.cpp
    - test/test_xbasic_fixed_string.cpp
    - test/test_xhash.cpp
    - test/test_xhelper.cpp
    - test/test_xin_memory_history_manager.cpp
    - test/test_xsystem.cpp
    - test/test_unit_kernel.cpp
  test_dependencies:
    - doctest/2.4.11

ohos_consumer_test:
  # Non-assertion-based OHOS consumer test that exercises real API usage
  description: "OHOS consumer test exercising xeus kernel protocol API"
  source: test_ohos_xeus.cpp
  tests:
    - xinterpreter_inheritance
    - execute_request_flow
    - kernel_info_request
    - base64_encode_decode
    - xhash_compute
    - protocol_message_creation

patches: []
