# 软件级 manifest for xeus
# 文件位置: archives/x/xeus/manifest.yaml

software: xeus
display: "xeus"
description: "C++ implementation of the Jupyter Kernel protocol"
category: library
homepage: "https://github.com/jupyter-xeus/xeus"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "nlohmann_json/3.12.0 必须与 xeus 同版本消费（JSON 对象交换兼容性要求）"
    - "libuuid/2.42.2 提供 GUID 生成（GUID_LIBUUID 路径），OHOS 上可用"
    - "静态库构建：shared libs 在 OHOS 上有 SONAME/rpath 问题，默认 shared=False"
    - "CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY 绕过 lld libxml2.so.16 运行时依赖"
    - "CompilerWarnings.cmake 的 -Werror 在 OHOS 上过于严格，通过 CMake 变量禁用"
  common_dependencies:
    - nlohmann_json
    - libuuid

versions:
  "6.0.5":
    status: built
    build_date: "2026-09-29"
    conan_ref: "xeus/6.0.5"
