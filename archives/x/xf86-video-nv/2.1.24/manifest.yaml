package: xf86-video-nv
version: 2.1.24
source: https://gitlab.freedesktop.org/xorg/driver/xf86-video-nv/-/archive/xf86-video-nv-2.1.24/xf86-video-nv-xf86-video-nv-2.1.24.tar.gz
build_system: autotools
compiler: clang 15.0.4 (OHOS SDK)
target_platform: openharmony-aarch64
dependencies:
  - xorg-server >= 21.1.15
  - pixman-1 >= 0.46.4
  - xproto >= 7.0.31
  - randrproto >= 1.6.0
  - renderproto >= 0.11.1
  - xextproto >= 7.0.33
  - pciaccess >= 0.18
install_files:
  - lib/xorg/modules/drivers/nv_drv.so
patches:
  - HMDFS-umask-fix (config.status umask 077 -> 022 for HMDFS compatibility)
  - pkg.m4-fix (removed broken _PKG_CONFIG_VERSION_CHECK macro reference)
  - Makefile-fix (removed -Werror=implicit, added -Dffs=__builtin_ffs)
  - Stub-headers (vbe.h, vbeModes.h, exa.h, xf86int10.h, dgaproc.h, xaa.h, xaalocal.h, xf86RAC.h, xf86Resources.h, compat-api.h for cross-compiling)