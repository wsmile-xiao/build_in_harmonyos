patches_applied:
  - "config.guess: 添加 HarmonyOS 系统识别 (patch-autotools-ohos.pl)"
  - "config.sub: 添加 ohos-linux 三元组和 kernel-os 验证"
  - "configure: 放宽 Xaw 库检测（改为警告而非错误）"
  - "configure: 处理 -Dunix 和 -undef 宏修复"
  - "xtermcfg.h: HAVE_LIB_XAW 定义为 undef（仅 stub）"

knowledge_gained:
  - "xterm 深度依赖 X Toolkit (libXt) + Xmu + Xaw，需完整 X11 开发栈"
  - "On HarmonyOS, config.guess 需 patch-autotools-ohos.pl 打补丁"
  - "libXt 1.3.0 configure 需处理 clang -E 定义 unix 宏问题（-Uunix 标志）"
  - "libXt configure 需要 XT_CFLAGS/XT_LIBS 绕过 pkg-config 链式依赖问题"
  - "/tmp 只读导致 configure 无法运行测试程序（需 $TMPDIR 环境变量）"
  - "libX11.so.6 运行时需 libxcb.so.1（静态版本可用但无 .so）"
  - "交叉编译模式（--build=gnu --host=ohos）可跳过运行时检测，但需静态链接或 LD_LIBRARY_PATH"

notes: |
  编译过程中发现的关键依赖链：
  
  1. libXt (X Toolkit Intrinsics) — 基础 Xt 框架，已从源码编译（libXt-1.3.0）
  2. libXmu (X Misc Utilities) — 为大量工具函数（原子管理、选择处理等）
  3. libXaw (Athena Widgets) — 菜单/工具栏组件，已静态 stub 替代
  4. curses/tinfo — 终端信息数据库（termcap/terminfo）
  5. XKB 扩展 — 键盘处理扩展
  6. libxcb — X11 通信协议层，仅有 .a 无 .so
  
  关键发现：
  - config.guess > config.sub > cross-compile 模式是 OHOS 上 autotools 项目的标准流程
  - 编译 libXt 需绕过 clang -E 的 unix 宏检测（已修复）
  - 运行时需解决 libxcb.so.1 缺失问题（构建 libxcb.so 或静态链接）
  
  知识贡献潜力:
  - E007 (config.guess) + E072 (config.sub kernel-os) 已确认可用
  - 新增知识条目建议: 
    - "libXt on OHOS: clang -E unix 宏处理"
    - "X11 跨编译模式参数设置"
    - "libxcb 共享库缺失问题"

