# test_package/MANIFEST.yml
# xar 1.8.0.498（apple-oss-distributions xar-498）
# 上游没有可自动化运行的测试套件：xar/ 构建体系（手写 Makefile.in +
# configure）无 test/check 目标；xar/test/ 下是人工驱动的 Python 脚本
# （attr.py/checksums.py/compression.py/data.py/heap.py/integrity.py，
# 依赖 xsltproc 处理 TOC 与人工判定），test_tools/xar.tcl 是 Tcl 交互
# 驱动。三者均未接入构建系统、无断言框架与自动通过/失败判定，属上游
# 设计为人工观察用途，不可离线自动运行。按赛事规则说明原因并自补
# 消费者测试。

package: xar/1.8.0.498
homepage: "https://github.com/apple-oss-distributions/xar"

upstream_tests_exist: false
upstream_test_audit: >
  xar-498 tarball 的构建体系无 test/check 目标（Makefile.in 只有
  all/install/uninstall/clean/distclean/relclean）；xar/test/ 下的
  Python 脚本为人工驱动的观察型 harness（依赖 xsltproc 转储 TOC、
  无 PASS/FAIL 断言与自动退出码），test_tools/xar.tcl 为 Tcl 交互
  驱动脚本。均未接入构建、不可离线自动化，上游测试计数为 0 属"上游
  不存在自动化套件"，非"未运行"。自补消费者测试以真实归档管线
  （创建→列表→解出→逐字节比对，含 gzip 压缩堆与 XML TOC 转储）覆盖
  核心功能；配方 build() 阶段另以同样数据集做构建自检。
upstream_test_count: 0
upstream_check_command: "（上游无自动化测试；test/ 与 test_tools/ 为人工驱动观察 harness）"
upstream_test_in_build: true

# test_package 中自带的测试（消费者视角, R34: 真实执行被适配工具）
test_package_tests:
  - file: test_xar.sh
    description: >
      消费者视角: 真实执行包内 xar，6 项断言（--version / -cf 创建
      归档 / -tf 成员列表 / -xf 解出逐字节一致 / --compression=gzip
      roundtrip / --dump-toc XML TOC 含成员与 sha1 校验和元素），全部
      离线确定性
    command: "bash test_xar.sh <package>/bin"

# 断言总数（消费者 6 项）
assertion_count: 6
