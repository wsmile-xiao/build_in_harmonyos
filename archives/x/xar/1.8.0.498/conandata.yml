# conandata.yml — xar 1.8.0.498
# 源码 URL 为上游官方发布渠道（R39）：xar 1.8.0.498 即 apple-oss-distributions
# 的 xar-498 tag（xar 1.8.0 系列修订 498，MacPorts/Homebrew 均以此 tarball 为
# 1.8.0.498 分发源；mackyle/xar 仓库仅发布到 1.6.1，无 1.8.x 版本归档）。
# sha256 已对本机下载的官方 tag tarball 实测核验。构建体系为 xar/ 子目录下的
# 手写 Makefile.in + 预生成 configure（autoconf 2.59，config.guess/sub 2005 版）。

sources:
  url: "https://codeload.github.com/apple-oss-distributions/xar/tar.gz/refs/tags/xar-498"
  sha256: "9cee4f80b96cf592ccc545a4fdd51e4da4a5bd3b4734901637d67b043eff3c75"
  # E276：codeload URL basename（xar-498）无扩展名，get() 会误走 zip 分支
  # 报 BadZipFile → 显式指定 filename（abbtr/accel-config/acedb 先例）
  filename: "xar-1.8.0.498.tar.gz"

patches:
  - patch_file: "patches/0001-openssl-evp-md-ctx-pointer.patch"
    patch_description: "非 Apple 平台（OpenSSL 1.1+/3.x）：EVP_MD_CTX 自 1.1.0 起为不透明类型，栈上声明无法编译 → 改为 EVP_MD_CTX_new/free 句柄式用法（仅 #else 分支，Apple CommonCrypto 路径不变）"
    patch_type: "portability"
    sha256: "2536eb4c5d80ff74991bddd2dcd9b82073941acfd4ea2f8580bc1219f1565ecb"
  # E404'：xar.h 的 Apple/非 Apple 分支不对称——非 Apple 只空定义了
  # API_DEPRECATED，漏了 API_AVAILABLE（xar_get_safe_path 与
  # src/xar_internal.h 三处声明使用），OHOS clang 解析声明尾宏即报
  # "expected function body after function declarator"（真机第 4 轮实测）
  - patch_file: "patches/0002-api-available-nonapple.patch"
    patch_description: "非 Apple 平台补空定义 #define API_AVAILABLE(...)（xar.h.in 非 Apple 分支；src/xar_internal.h include xar.h，单点覆盖全部 4 处声明；实现与调用方均无 Apple 分支，无需改动）"
    patch_type: "portability"
    sha256: "3188d06e76d53d35989179b3f25da3ebeef7638cd6c95e6c3ec325d09d9d58ab"
  # E404''：上游笔误——lib/linuxattr.c:229 调用 safe_dirname，全源码树
  # 无此符号（实际函数为 xar_safe_dirname，util.h:56 声明）；同文件
  # 其余 7 处调用点均带前缀，仅此处漏。代码路径由
  # HAVE_SYS_XATTR_H && HAVE_LSETXATTR && !__APPLE__ 守卫，Apple 上被
  # 掩盖故上游从未发现（真机第 5 轮实测，0002 生效后暴露）
  - patch_file: "patches/0003-linuxattr-safe-dirname.patch"
    patch_description: "上游笔误修复：linuxattr.c:229 safe_dirname(tmp) → xar_safe_dirname(tmp)（返回 malloc'd 字符串，调用点随后 free，语义匹配；单行改动）"
    patch_type: "bugfix"
    sha256: "9f5132f003f214cd6d9fa6edbbe7042639abb5d9d4ba70c1d9a6a038d3c6318a"
  # E404'''：xar_optimal_io_size_at_path（macports-port 分支移植层新代码）
  # 无平台守卫直接用 BSD statfs 语义（f_iosize/f_flags/MNT_LOCAL），
  # musl sysroot 的 sys/mount.h 不提供这些符号（真机第 6 轮实测）。不伪造
  # 宏（musl statfs 布局不保证字段存在），按最小语义改动：非 Apple 直接
  # 用函数自身 fallback 1024*1024（1MiB 本是代码起点，仅是 I/O 尺寸优化，
  # 非功能必需）
  - patch_file: "patches/0004-util-io-size-nonapple.patch"
    patch_description: "xar_optimal_io_size_at_path 的 statfs 探测段以 #ifdef __APPLE__ 守卫；非 Apple 平台直接返回 1MiB fallback（调用点 archive.c/io.c 仅用于读写块大小优化）"
    patch_type: "portability"
    sha256: "89db9edc79858d80744518c19fe1675829326782cae419bf8525d0aed04e3dba"
  # OHOS SDK sysroot（musl）无 fts.h（真机第 7 轮 src/xar.c:39 fatal
  # error；libxar.a 不依赖 fts，仅 CLI 文件树遍历使用）。制品仓无 fts
  # 包（为单工具新增依赖任务过重）→ vendor void-linux/musl-fts
  # （NetBSD fts.c 1.48，BSD 许可证随文件保留）：
  # - fts.c 仅两处机械改动：去 autotools config.h include（全部 HAVE_*
  #   条件回退可移植默认——musl 有 dirfd、dirent 无 d_namelen、MAX 回退
  #   激活）；<fts.h> 改同名本地头；
  # - XAR_SRCS 加 fts.c，xar.c 改 include "fts.h"。
  # glibc 平台本地对象遮蔽 libc 同名符号，musl 平台补齐缺失。
  - patch_file: "patches/0005-fts-vendored.patch"
    patch_description: "vendor musl-fts 便携 fts(3)（OHOS sysroot 无 fts.h；仅 CLI 使用，库不受影响；许可证随文件保留）"
    patch_type: "portability"
    sha256: "14e7538afa0c1854c0a698f669aadf9136026f5f08d4d3c8fd45727ea150af1a"
  - patch_file: "patches/0006-cli-char-int-and-fts-link.patch"
    patch_description: "src/xar.c getopt 接收变量 char→int（aarch64 char 无符号，-1 截断为 255，-c/-x/-t 全部落入 usage/exit(1) 且 clang -O2 将后续逻辑当死代码删除）+ src/Makefile.inc.in 链接规则补 fts.o（0005 引入的 fts.c 只进编译不进链接，macOS 系统 libc 自带 fts 故上游不暴露）：xar/ixar 两条模式规则前置补 @objroot@src/fts.o，且 4 条链接 recipe（RPATH ifeq 两分支）在 $< 后显式追加 @objroot@src/fts.o——GNU make 模式规则 recipe 只取首前置（$<），仅补前置列表不会进入链接命令行（真机第 12 轮证伪）"
    patch_type: "bugfix"
    sha256: "c4bfbae9526c48e84248626672a5922135469fa67fff8a4a618262b1e2794353"
