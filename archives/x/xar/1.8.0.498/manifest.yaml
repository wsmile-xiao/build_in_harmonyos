# 版本级 manifest — xar 1.8.0.498
# 遵循 ARCHIVE-SPEC v2.0

version: "1.8.0.498"
software: "xar"
status: built
build_date: ''
build_system: autotools

source:
  url: "https://codeload.github.com/apple-oss-distributions/xar/tar.gz/refs/tags/xar-498"
  sha256: "9cee4f80b96cf592ccc545a4fdd51e4da4a5bd3b4734901637d67b043eff3c75"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
    - "--disable-shared（静态链 libxar.a，包内 bin/xar 自包含）"
    - "--build=x86_64-linux --host=x86_64-linux（2005 config.guess 不识别 HarmonyOS/aarch64，E007；configure 对 host 仅做 *-*-linux* case 匹配 + 编译期类型探测，别名与本机架构无关；build==host 保持原生模式，config.guess 不运行）"
    - "--with-xml2-config=<recipe 生成的 shim>（libxml2 cmake 包不含 xml2-config 脚本，configure 硬依赖该程序）"
    - "LIBS=-lcrypto（configure.ac 从不检测 openssl，hash.c 非 Apple 分支隐式硬依赖）"
  dependencies:
    - libxml2/2.15.3.1
    - zlib/1.3.1
    - bzip2/1.0.8.2
    - openssl/3.5.8.1
  cc: clang
  upstream_test_command: "（上游无自动化测试：无 test/check 目标，test/ 与 test_tools/ 为人工驱动 Python/Tcl harness；由配方 build() 自检 + test_package 消费者测试补足）"

patches_applied:
  - "patches/0001-openssl-evp-md-ctx-pointer.patch（OpenSSL 1.1+/3.x 的 EVP_MD_CTX 为不透明类型，栈上声明改 EVP_MD_CTX_new/free 句柄式；仅 hash.c 非 Apple 分支）"
  - "patches/0002-api-available-nonapple.patch（xar.h 非 Apple 分支漏定义 API_AVAILABLE，xar_get_safe_path 与 src/xar_internal.h 三处声明编译错 → 补空定义；单点覆盖，实现无需改动）"
  - "patches/0003-linuxattr-safe-dirname.patch（上游笔误：linuxattr.c:229 漏 xar_ 前缀调用不存在的 safe_dirname → 改 xar_safe_dirname；!__APPLE__ 守卫路径 Apple 上从未触发）"
  - "patches/0004-util-io-size-nonapple.patch（xar_optimal_io_size_at_path 无守卫用 BSD statfs 语义 f_iosize/f_flags/MNT_LOCAL，musl 不提供 → statfs 探测段 __APPLE__ 守卫，非 Apple 返回 1MiB fallback；I/O 块大小优化，非功能必需）"
  - "patches/0005-fts-vendored.patch（portability：OHOS sysroot（musl）无 fts.h，仅 CLI src/xar.c 文件树遍历使用 → vendor void-linux/musl-fts（NetBSD fts.c 1.48，BSD 许可证随文件保留）为 src/fts.{h,c}，fts.c 仅去 config.h include + <fts.h> 改本地头两处机械改动，XAR_SRCS 加 fts.c；库本体不受影响）"
  - "patches/0006-cli-char-int-and-fts-link.patch（bugfix：①src/xar.c:913 getopt 接收变量 char→int——aarch64 char 无符号，-1 截断为 (char)-1=255，while 循环守卫恒真，任一操作落入 default usage/exit(1)，clang -O2 还将归档/提取/fts 逻辑当死代码删除（-Wtautological-constant-out-of-range-compare 警告是 smoking gun）；②src/Makefile.inc.in xar/ixar 两条模式规则补 @objroot@src/fts.o 前置，且 4 条链接 recipe（RPATH ifeq 两分支）在 $< 后显式追加 @objroot@src/fts.o——GNU make 模式规则 recipe 只取首前置，仅补前置不进入命令行（真机实证）；0005 的 fts.c 只进编译不进链接，上游 macOS 系统 libc 自带 fts 故不暴露）"

knowledge_gained:
  - "aarch64/ARM64 上 char 无符号（x86 上有符号）：getopt/getc 等返回 int 的接口接收变量若声明为 char，-1/EOF 截断为 255，循环守卫恒真，且 clang -O2 把循环后分支当死代码删除——表象（链接成功、--version 正常、实际操作只打 usage）极具欺骗性，-Wtautological-constant-out-of-range-compare 是鉴别信号（真机第 10 轮 probe7 实测）"
  - "手写 Makefile（非 automake）以 CPPFLAGS := @CPPFLAGS@ 赋值时压过环境变量与 make 期 env 注入，运行期追加宏/头路径必须走 configure 期 CPPFLAGS 烘焙进 @CPPFLAGS@（lib/src 两套编译规则同时覆盖）；模式规则 src/% 只链单对象 src/%.o，向 XAR_SRCS 新增 .c 时必须同步给链接规则补对应 .o 前置（真机第 10 轮 probe4-9 实测）"
  - "xar 1.8.0.498 = apple-oss-distributions xar-498 tag（1.8.0 系列修订 498；源码内部版本串 1.8dev，xar --version 输出 xar 1.8dev）；mackyle/xar 仓库仅到 1.6.1，无 1.8.x 归档"
  - "构建体系在 tarball 的 xar/ 子目录（手写 Makefile.in include lib/src 的 Makefile.inc），configure 为 autoconf 2.59 预生成；config.guess/sub 是 2005 版 —— 与其补丁脚本（gtypist 路线），当 configure 对 host 的用途仅是 *-*-linux* case 匹配且类型探测全为编译期时，可传 config.sub 可 canonicalize 的别名（x86_64-linux 实测通过）+ build==host 绕开 config.guess"
  - "Apple OSS 源码在非 Apple 平台的 openssl 缺口模式：hash.c/archive.h 无条件 include <openssl/evp.h> 而 configure.ac 无任何 openssl 检测（Apple 只走 CommonCrypto）→ 需 require openssl + 命令行 LIBS=-lcrypto 补位；且 EVP_MD_CTX 自 1.1.0 起不透明，栈上声明需补丁改句柄式"
  - "libxml2 包为 cmake 构建不含 xml2-config，而上游 configure 硬依赖该程序 → generate() 写 shim（aspectc/2.5 先例），--with-xml2-config 显式指向"
  - "make install 的 ixar 产物（src/ixar）以 RPATH=<LIBDIR> 链接共享 libxar → 用 --disable-shared 静态链避免包内二进制 RPATH 指向 conan 缓存目录"
  - "in-source autotools 构建在 conan create 下必须显式 cd 进源码目录再跑 configure：conan create 的 source/build 是两个缓存目录，self.run() cwd 是构建根，config.status 会把 Makefile 写到 cwd 导致 make -C 找不到（真机第 2 轮实测）"
  - "Apple OSS 源码的 availability 宏缺口模式：xar.h 的非 Apple 分支只空定义 API_DEPRECATED 漏了 API_AVAILABLE（os/availability.h 为 Apple 专属）——上游头文件在非 Apple 平台的此类分支不对称会在声明解析期报 expected function body after function declarator；补空 #define API_AVAILABLE(...) 即可（真机第 4 轮实测）"
  - "非 Apple 独占代码路径的上游笔误模式：linuxattr.c 等由 HAVE_SYS_XATTR_H && !__APPLE__ 守卫的文件在 Apple 构建中从未编译，笔误（safe_dirname 漏 xar_ 前缀）只有非 Apple 平台才暴露——W0 应对守卫路径源码做符号核对（真机第 5 轮实测）"
  - "BSD statfs 语义（f_iosize/f_flags/MNT_LOCAL）不可移植到 musl：sys/mount.h 存在但不含这些符号，且 musl statfs 布局不保证字段——不可伪造宏模拟，应守卫降级用调用方自身 fallback 常量（真机第 6 轮实测）"
