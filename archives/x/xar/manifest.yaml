software: xar
display: "xar"
description: "Apple eXtensible ARchiver（XML TOC + 压缩堆归档格式，macOS pkg/安装包基础格式，含 libxar 库与 xar CLI）"
category: tool
homepage: "https://github.com/apple-oss-distributions/xar"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "1.8.0.498 = apple-oss-distributions xar-498 tag（源码内部版本串 1.8dev）；构建体系在 tarball 的 xar/ 子目录（手写 Makefile.in + 预生成 configure）"
    - "2005 版 config.guess/sub 不识别 HarmonyOS/aarch64（E007）→ configure 对 host 仅做 *-*-linux* case 匹配 + 编译期类型探测，传 config.sub 可 canonicalize 的别名 --build/--host=x86_64-linux 绕开（build==host 原生模式）"
    - "Apple OSS 的 openssl 缺口模式：hash.c 无条件 include <openssl/evp.h> 而 configure 无检测 → require openssl + LIBS=-lcrypto 补位；EVP_MD_CTX 不透明化补丁（EVP_MD_CTX_new/free）"
    - "libxml2 cmake 包不含 xml2-config 而 configure 硬依赖 → 配方写 shim（aspectc/2.5 先例）；--disable-shared 静态链避免 RPATH 指向缓存目录"
    - "E114 umask 077→022 + §12.38① env -u CONFIG_SHELL + E074 make -j1；CLI 门禁 commands.json（R38）"

versions:
  "1.8.0.498":
    status: prepared
    conan_ref: "xar/1.8.0.498"
