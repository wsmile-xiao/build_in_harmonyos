software: xdg-dbus-proxy
# 版本级 manifest
# 文件位置: archives/x/xdg-dbus-proxy/0.1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.1.7"

status: built

build_system: meson

build_date: "2026-08-27"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/flatpak/xdg-dbus-proxy/releases/download/0.1.7/xdg-dbus-proxy-0.1.7.tar.xz"
  sha256: "3ad3d27ba574e178acb5e4d438ba36ace25e3564f899c36f31c56f82c7adbbe7"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dtests=false"
    - "-Dman=disabled"
  dependencies:
    - glib/2.88.0.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gio-unix-2.0.pc 不在 glib conan 组件中，需要在 generate() 手动从 gio-2.0.pc 创建"
  - "meson.build 使用 cc.get_supported_arguments() 检测编译器警告标志，clang 全部支持"
  - "tests 需要运行中的 D-Bus session daemon，CI 环境无此服务，故禁用 tests"
  - "source 使用 TEMP_FAILURE_RETRY 宏，代码自带 #ifndef 守卫，无需额外处理"
