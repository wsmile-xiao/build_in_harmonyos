# test_package/MANIFEST.yml
# xdg-dbus-proxy 0.1.7 test package manifest
package: xdg-dbus-proxy/0.1.7
homepage: "https://github.com/flatpak/xdg-dbus-proxy"

# Upstream has tests in tests/ directory (meson test)
# but they require a running D-Bus session daemon, which is not
# available in the CI environment.
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test -v --timeout-multiplier=16 --no-suite=failing"

# Upstream test programs
upstream_tests:
  - name: test-proxy
    file: tests/test-proxy.c
    description: "Integration test that starts xdg-dbus-proxy and verifies filtering behavior with a real D-Bus session"
    requires_dbus: true

# test_package smoke tests (consumer-side verification)
test_package_tests:
  - file: conanfile.py
    description: "Smoke test: verifies xdg-dbus-proxy binary is installed and runs --version/--help correctly"
    command: "conan test"

# Approximate assertion count
assertion_count: 3
