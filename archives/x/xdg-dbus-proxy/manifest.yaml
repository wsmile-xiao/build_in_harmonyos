# 软件级 manifest
# 文件位置: archives/x/xdg-dbus-proxy/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: xdg-dbus-proxy
display: "xdg-dbus-proxy (D-Bus filtering proxy)"
description: "Filtering proxy for D-Bus connections, used by Flatpak for application sandboxing"
category: network
homepage: "https://github.com/flatpak/xdg-dbus-proxy"
license: "LGPL-2.1-or-later"

build_system: meson

ohos_adaptation:
  key_points:
    - "gio-unix-2.0.pc not in glib conan components, must create manually in generate()"
    - "Pin ar/as/strip/nm/ranlib by absolute path (CI worker llvm-* naming issue)"
    - "Disable tests (requires running D-Bus session daemon)"
    - "0.1.7 dropped autotools in favor of Meson"
  common_dependencies:
    - glib/2.88.0.1

versions:
  "0.1.7":
    status: built
    build_date: "2026-08-27"
