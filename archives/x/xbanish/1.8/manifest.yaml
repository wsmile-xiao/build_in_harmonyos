# ============================================================
# 版本级 manifest
# 文件位置: archives/x/xbanish/1.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# ============================================================

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8"

# 软件名
software: "xbanish"

# 编译状态
# published | built | failed | archived
# 草案轮（未编译）如实记 draft；构建验证轮实编通过后由 finish/close-archive 置 built。
# 依据: conan-verify G0-G4 全 PASS + W3 .ci-result.json exit_code=0 (step=W3_local_ci)
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jcs/xbanish/archive/refs/tags/v1.8.tar.gz"

  # 源码校验和（真实下载算出，7082 字节）
  sha256: "e753d6a92d17105ad0d374f0349579b7e7bb070d4bebf5ec28ea105cb0c5b507"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表
  configure_options:
    - "单文件直编（绕开上游 Makefile 硬编码的 X11BASE=/usr/X11R6 前缀）"
    - "$CC -O2 -Wall xbanish.c -lX11 -lXfixes -lXi -lXext"
    - "include/lib 路径来自 conan 依赖包（见 dependencies）"
    - "补丁 0001 删除未使用的 #include <X11/Intrinsic.h>"
    - "产物 E549 binary-sign-tool 自签名已执行：签名 ELF 于 OHOS 实跑通过（W3 日志 L311）"

  # 编译依赖列表（格式: name/version）
  # 全部为制品仓已发布项，且同属 libx11/6.4.0 版本线（W0 已实测组图通过）
  dependencies:
    - libx11/6.4.0
    - libxfixes/6.1.0
    - libxi/6.1.0
    - libxext/6.4.0
    - xorgproto/2025.1

  # 编译器
  cc: clang
  cxx: clang++

  # 资源实测（ⓓ 强制项）：memcap-run.py --probe 跑"最小构建"= 打满两片补丁后的
  # 单 TU 编译链接（与配方 build() 同一条命令行），峰值 RSS 83MB / 用时 1.4s。
  # 正式构建按 --mb 1000 --avail-factor 1.2 --slow 上硬预算（相对实测峰值 ~12x 余量）。
  max_rss_mb: 83
  build_mem_budget_mb: 1000

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-drop-unused-intrinsic-include.patch"
  - "patches/0002-replace-xt-false-with-xlib-false.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "X11 消费者包必须整图选边：libXi/* 钉 libx11/6.4.0，libxt/1.3.1 钉 libx11/1.8.13，同图必冲突"
  - "上游 Makefile 的 -lXt 缺失即说明 Intrinsic.h 是死 include，可按 0 Xt 符号证据删除"
