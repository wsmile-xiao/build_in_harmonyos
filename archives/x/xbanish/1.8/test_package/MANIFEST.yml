# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁强制要求存在）

package: xbanish/1.8
homepage: "https://github.com/jcs/xbanish"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试套件（tag v1.8 全树仅 6 文件：.gitignore LICENSE Makefile README.md
# xbanish.1 xbanish.c）。0 命中证据（大小写不敏感，逐口径实测于解包源码根）：
#   find . -type d -iname "test*"                      -> 0
#   find . -iname "*test*"                             -> 0
#   grep -ric "TEST(" / "TEST_F(" / "TEST_P(" .        -> 0 / 0 / 0
#   grep -ric "ASSERT_" / "EXPECT_" .                  -> 0 / 0
#   grep -ric "tcase\|ck_assert\|assert(" .            -> 0
#   find . -type d -iname res                          -> 0
#   find . -iname "*runtest*" ; grep -ric runtest .    -> 0 ; 0
#   find . -type d \( -iname "example*" -o -iname "demo*" \) -> 0
#   grep -nE "^test:|^check:" Makefile                 -> 无匹配（RC=1）
#   Makefile 注册目标：仅 all / install / clean（.PHONY: all install clean）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，逐条可判定）
test_package_tests:
  - file: "(packaged bin/xbanish)"
    description: "ELF NEEDED 同时记录 libX11.so/libXfixes.so/libXi.so/libXext.so（四项 X 依赖确实链上）"
    command: "readelf -d bin/xbanish"
  - file: test_nox.sh
    description: "签名后产物在 OHOS 上真实可执行，且无 X 时走上游确定性错误路径（exit 1 + can't open display）"
    command: "env -u DISPLAY -u XAUTHORITY bin/xbanish"

# 未覆盖项（如实声明，不计入通过）：
#   xbanish 的实际功能（打字隐藏光标 / 移动显示光标 / XInput2 与 XSync 两条事件通路）
#   在 HarmonyOS PC 上不可执行——平台无 X server，无 XInput2/XSync/XFixes 事件源。
not_covered:
  - "运行时行为：隐藏/显示鼠标光标（需 X server，OHOS 无）"
  - "XInput2 与 XSync 事件通路（需对应 X 扩展提供事件源）"

# 测试断言总数（本 test_package 内可判定断言条数）
assertion_count: 6

# ------------------------------------------------------------
# 资源预算（ⓓ 强制项，memcap-run.py 实测）
# ------------------------------------------------------------
# probe 对象 = 最小构建单元：两片补丁打满后的单个 xbanish.c TU，用配方 build()
# 完全相同的命令行编译+链接（$CC -O2 -Wall <dep -I> xbanish.c -o out <dep -L>
# -lX11 -lXfixes -lXi -lXext）。
#   MEMCAP[probe] peak=83MB budget=0MB rc=0 用时1.4s
max_rss_mb: 83
build_mem_budget_mb: 1000
mem_probe_cmd: "python3 经验文档/tools/memcap-run.py --probe -- sh tmp/uc2/xbanish/probe-cc.sh"
# probe 产物 ELF 实测 NEEDED（/data/service/hnp/bin/readelf -d）：
#   libX11.so.6  libXfixes.so.3  libXi.so.6  libXext.so.6  libc.so
# ⇒ 本 test_package 断言 2 的四项 X 依赖在实编产物中逐项坐实。
