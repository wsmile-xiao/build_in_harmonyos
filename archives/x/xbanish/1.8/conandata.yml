# conandata.yml — xbanish 1.8
#
# 官方源（R39）：GitHub tag v1.8 归档，URL 探活于 2026-09-23 实测：
#   curl -fsSIL -o /dev/null -w "%{http_code} %{url_effective}\n" \
#     https://github.com/jcs/xbanish/archive/refs/tags/v1.8.tar.gz
#   -> HTTP=200，Final=https://codeload.github.com/jcs/xbanish/tar.gz/refs/tags/v1.8
#   （另有 HEAD 同 URL -> 200，首页 https://github.com/jcs/xbanish -> 200）
#
# sha256 由真实下载算出，非占位符、非编造：
#   curl -fsSL -o xbanish-1.8.tar.gz https://github.com/jcs/xbanish/archive/refs/tags/v1.8.tar.gz
#   ls -l  -> 7082 字节
#   sha256sum -> e753d6a92d17105ad0d374f0349579b7e7bb070d4bebf5ec28ea105cb0c5b507

sources:
  url: "https://github.com/jcs/xbanish/archive/refs/tags/v1.8.tar.gz"
  sha256: "e753d6a92d17105ad0d374f0349579b7e7bb070d4bebf5ec28ea105cb0c5b507"

patches:
  - patch_file: "patches/0001-drop-unused-intrinsic-include.patch"
    patch_description: "Delete the unused #include <X11/Intrinsic.h>: xbanish.c references 0 Xt symbols and every API it uses is declared in X11/Xlib.h. Intrinsic.h ships only with libXt, whose recipe pins libx11/1.8.13 while both published libXi recipes pin libx11/6.4.0, so keeping it makes one graph impossible."
    patch_type: "portability"
  - patch_file: "patches/0002-replace-xt-false-with-xlib-false.patch"
    patch_description: "After deleting Intrinsic.h the TU still borrowed exactly one Xt-only macro: FALSE at xbanish.c line 532, the XQueryTree return check. Replace it with the Xlib spelling False (both are 0), which X11/X.h already provides, so the file compiles on the libx11/6.4.0 line without libXt. This patch exists only because of 0001: with 0001 alone clang fails with use of undeclared identifier FALSE, as measured by the pre-build compile probe recorded in notes.md."
    patch_type: "portability"
