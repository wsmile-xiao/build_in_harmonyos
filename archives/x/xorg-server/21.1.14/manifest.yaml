# xorg-server 21.1.14 编译清单
software: xorg-server
version: 21.1.14
status: in_progress
build_system: autotools
download_url: https://xorg.freedesktop.org/archive/individual/xserver/xorg-server-21.1.14.tar.xz
tar_format: tar.xz

# 编译时间
build_date: "2026-05-29"

# 描述
description: |
  Xorg Server 是 X Window System 的核心显示服务器，
  提供图形显示、输入设备管理和窗口系统基础设施。

# 依赖（运行时发现）
dependencies:
  required:
    - xorgproto (>= 2024.1)
    - libx11 (>= 1.8.10)
    - libxext (>= 1.3.6)
    - libxcb
    - xcb-util
    - xcb-proto
    - pixman
    - libdrm
    - libGL

# 平台适配要点
platform_notes:
  - "OpenHarmony 无内核 DRM/KMS 支持可能需要特殊处理"
  - "需要禁用不需要的驱动和功能"

# 配置参数（待定）
configure_options: []