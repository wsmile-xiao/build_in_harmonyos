software: xorg-server
name: X.Org Server
description: X Window System display server (Xvfb virtual framebuffer server)
category: x11
license: MIT
website: https://www.x.org/

versions:
  - version: "21.1.15"
    status: published
    compiled_at: 2026-05-30
    notes: |
      - 修改 os/utils.c 使用 TMPDIR 环境变量替代硬编码 /tmp
      - 修改 xkb/ddxLoad.c OutputDirectory 函数支持 TMPDIR
      - 配置选项: -Dlisten_unix=false -Dlisten_tcp=true
      - 禁用 Unix socket 以绕过 /tmp/.X11-unix 只读限制
    dependencies:
      - libXfont2
      - libfontenc
      - libxcvt
      - libxshmfence
      - pixman
      - libdrm
      - xkbcomp
      - xkeyboard-config
    configure_options:
      - -Dxvfb=true
      - -Dxorg=false
      - -Dlisten_unix=false
      - -Dlisten_tcp=true
      - -Dudev=false
      - -Dglx=false
    binaries:
      - Xvfb