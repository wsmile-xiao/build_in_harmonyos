software: x264
display: "x264"
description: "A free software library for encoding video streams into the H.264/MPEG-4 AVC format"
category: gfx
homepage: "https://www.videolan.org/developers/x264.html"
license: GPL-2.0+
build_system: custom

ohos_adaptation:
  key_points:
    - "HarmonyOS platform detection requires patching config.guess/config.sub"
    - "bash shebang needs correction for HarmonyOS environment"
    - "Works with --enable-pic for position-independent code"
    - "上游 configure 为手写脚本（非 autoconf 产物），首行 #!/bin/bash 在 OHOS 不存在，须用 hnp bash 显式执行"
    - "aarch64 分支的汇编器即 clang（AS=\"${AS-${CC}}\"），不需要 nasm/yasm；asm 实测为 yes"
    - "config.guess 不识别 OHOS，显式 --host=aarch64-unknown-linux-gnu 即可（内核接口与 linux 一致、libc 为 musl）"
    - "OHOS 无 coreutils install，但 /bin/install（toybox）支持 -d/-m，上游 install 规则可原样使用"
    - "SHA 归档不含 .git，上游 version.sh 退化使版本串变成 0.<api>.x，需按固定提交回填"
  common_dependencies: []

versions:
  "r3190":
    status: published
    build_date: "2026-05-20"
  "r3223":
    status: built
    build_date: "2026-09-13"
    packaging: conan
    notes: |
      - 源码按 master tip 提交 0480cb05fa188d37ae87e8f4fd8f1aea3711f7ee 的 SHA 归档固定
        （rev-list 计数 3223 ⇒ r3223），避免分支前进导致 sha256 失配
      - 手写 configure + make；--disable-lavf/--disable-ffms/--disable-swscale/--disable-opencl
        保持自包含，无第三方依赖
      - 上游自带可执行测试 tools/checkasm.c 实测全通过：checkasm8 66/66、checkasm10 36/36（合计 102 项）
      - test_package 6 项断言全通过（真实 I420 编码 + 阴性对照）
    provides:
      - bin/x264
      - lib/libx264.so
      - lib/libx264.a
