package: x264/r3223
homepage: "https://www.videolan.org/developers/x264.html"

# 上游自带可执行测试：tools/checkasm.c，经 `make checkasm` 构建为
# checkasm8 / checkasm10 两个可执行文件（8bit / 10bit 汇编路径自检）。
# 实测（本地 OHOS aarch64，见 notes.md）：
#   checkasm8  → 66 项 [OK]，0 项 [FAIL]，末行 "All tests passed Yeah :)"
#   checkasm10 → 36 项 [OK]，0 项 [FAIL]，同上
#   合计 102 项全通过
upstream_test_in_build: true

upstream_tests:
  - name: "tools/checkasm.c（make checkasm → checkasm8）"
    count: "66"
    description: "8bit 汇编内核自检：intra pred / coeff_last / mc / deblock / dct 等；实测 66/66 PASS"
  - name: "tools/checkasm.c（make checkasm → checkasm10）"
    count: "36"
    description: "10bit 汇编内核自检；实测 36/36 PASS"

test_package_tests:
  - file: test.c
    description: >-
      R34 消费者验证：链接打包后的 libx264，走真实编码路径——
      x264_param_default_preset + x264_encoder_open、x264_encoder_headers
      产出 SPS/PPS、x264_encoder_encode 将一帧 I420 编成 NAL 单元并断言
      载荷以 H.264 起始码 00 00 00 01 开头（x264 有帧延迟，需按
      x264_encoder_delayed_frames 冲刷）；另断言 X264_BUILD 与打包库 ABI
      一致（头文件把 x264_encoder_open 粘到 x264_encoder_open_<X264_BUILD>）。
      阴性对照：以不支持的 i_bitdepth=99 打开编码器必须失败，
      以证明上述断言非恒真。
    command: "./test_x264"

assertion_count: 6
