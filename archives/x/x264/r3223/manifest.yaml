# 版本级 manifest
# 文件位置: archives/x/x264/r3223/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（r3223 = 上游提交 0480cb05 在 git 中的 rev-list 计数，见 notes.md）
version: "r3223"

# 软件名
software: "x264"

# 编译状态
# published | built | failed | archived
status: built

build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-13"

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 x264 无发布 tag，规范来源是「按提交归档」；按 master tip 的具体
  # 提交 SHA 固定（不可变、可复现），不用移动的 master 分支
  url: "https://code.videolan.org/videolan/x264/-/archive/0480cb05fa188d37ae87e8f4fd8f1aea3711f7ee/x264-0480cb05fa188d37ae87e8f4fd8f1aea3711f7ee.tar.gz"
  sha256: "d0967a1348c85dfde363bb52610403be898171493100561efa0dd05d5fd1ae50"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # x264 自带手写 configure（非 autoconf 产物）+ make
  system: custom
  configure_options:
    - "--prefix=<conan package folder>"
    - "--bindir/--libdir/--includedir=<package folder 子目录>"
    - "--host=aarch64-unknown-linux-gnu（config.guess 不识别 OHOS）"
    - "--enable-shared"
    - "--enable-static"
    - "--enable-pic"
    - "--disable-opencl"
    - "--disable-avs"
    - "--disable-lavf"
    - "--disable-ffms"
    - "--disable-swscale"
    - "--disable-gpac"
    - "--disable-lsmash"
    - "--disable-bashcompletion"
  dependencies: []
  cc: clang
  cxx: clang++
  extra_env:
    - "CC=clang"
    - "INSTALL=/bin/install（OHOS 无 coreutils install；/bin/install 为 toybox，支持 -d/-m）"
    - "TMPDIR=<build>/_tmp（HMDFS 默认 TMPDIR 不可写）"

patches_applied: []

test_status: passed

test_note: >-
  上游自带可执行测试 tools/checkasm.c（`make checkasm` 产出 checkasm8/checkasm10）
  已实测全通过：checkasm8 66/66、checkasm10 36/36，合计 102 项 0 失败，
  末行 "All tests passed Yeah :)"。消费者测试 test_package/test.c 6 项断言
  全通过（含真实 I420 编码与阴性对照）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "x264 的 configure 首行是 #!/bin/bash，而 OHOS 上 /bin/bash 不存在 —— 必须以 hnp 的 bash 显式执行（直接 ./configure 报 No such file or directory）"
  - "x264 configure 对 AS/AR/STRIP 用 ${VAR-default}（只认未设置，不认已设置但为空）；CI worker 把 AS 导出为空串时 AS=\"${AS-${CC}}\" 取到空值，汇编检查退化为执行 conftest.S 文件，逼出误导性的 no NEON support 报错 —— 必须显式固定 CC/AS/AR/RANLIB/NM/STRIP 绝对路径（R33）"
  - "该 NEON 报错的判别特征：configure 的 stdout 只剩那两行（前面的检查写 stderr），据此可确认死在 as_check 而非其它阶段"
  - "x264 自带 config.guess 不认识 OHOS（传 aarch64-unknown-linux-ohos 报 machine not recognized）；显式给 --host=aarch64-unknown-linux-gnu 即可（内核接口与 linux 一致、libc 为 musl）"
  - "x264 的 aarch64 分支用 AS=\"${AS-${CC}}\"，汇编器就是 clang —— 不需要 nasm/yasm（nasm 仅出现在 x86/x86_64 分支），因此设备缺 nasm/yasm 不影响 asm: yes"
  - "OHOS 无 coreutils install，但 /bin/install 是 toybox 实现，实测支持 `-d` 与 `-m`，故 x264 上游 install 规则可原样使用（只需 INSTALL=/bin/install）"
  - "归档不含 .git 时上游 version.sh 走 fallback（ver=\"x\"），使 X264_VERSION 为空、X264_POINTVER 变成 0.165.x；需按固定提交回填 revision"
  - "x264 有帧延迟：首帧 x264_encoder_encode 可能返回 0 个 NAL，必须按 x264_encoder_delayed_frames() 用 NULL 输入冲刷后才拿到输出"
  - "鸿蒙 PC 要求 .so 与可执行文件都带代码签名；打包末尾统一 objcopy 去旧签名 + binary-sign-tool -selfSign 重签"
