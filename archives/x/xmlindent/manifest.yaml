software: xmlindent
display: "xmlindent"
description: "XML 流重排版工具（读取 XML 并以可配置缩进/换行重新格式化）"
category: utils
homepage: "http://xmlindent.sourceforge.net/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "**无需任何源码修改**：0.2.18 在 aarch64-unknown-linux-ohos + clang 15.0.4 上直接 `make CC=clang` 编译、链接、运行通过，未提交 patch"
    - "flex 仅为构建期工具（从 xmlindent.yy 生成 lex.yy.c，由 indent.c 以 #include 引入）；产物是单一自包含可执行文件，运行期不需要 flex/libfl —— OHOS 上链接在 -Wl,-z,defs -Wl,--no-undefined 下通过且无需 -lfl。因此不声明为 requires()/runtime 依赖"
    - "上游 Makefile 构建链细节：indent.c 只做 touch（迫使 indent.o 重编），链接目标不含 lex.yy.o，因为生成文件被 #include 进 indent.c"
    - "上游无 test/check 目标，但提供 1 组正式回归 fixture（tests/whitespace-in-content.{orig,expected}.xml），可直接执行，即完整上游测试集：upstream_total = 1，已全量执行并通过"
  common_dependencies: []

versions:
  "0.2.18":
    status: pending
    build_date: ""
