# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xmlindent/0.2.18
homepage: "http://xmlindent.sourceforge.net/"

# 上游测试命令 — 经源码核查：
#
#   Makefile 目标: all / xmlindent / .c.o / indent.c / lex.yy.c / install /
#                  uninstall / clean
#   .PHONY: all clean install uninstall
#
# 上游**没有** test / check 目标，也没有测试运行脚本。但上游确实提供了
# **1 组正式回归 fixture**（2020-02-23 提交 "#3 parse: Fix whitespace consumption
# within text nodes" 引入，见 ChangeLog）：
#
#   tests/whitespace-in-content.orig.xml      输入
#   tests/whitespace-in-content.expected.xml  期望输出
#
# 该 fixture 可直接执行（xmlindent 是 stdin/stdout 过滤器：`xmlindent orig`
# 的输出与 expected 逐字节比对），即本版本完整的上游测试集合。
upstream_check_command: "make check (absent upstream); executed via run_upstream_tests.sh"

# conanfile.py build() 方法中是否已集成上游测试
# build() 在编译后调用 run_upstream_tests.sh，因此为 true
upstream_test_in_build: true
upstream_test_command: "sh ./run_upstream_tests.sh"

# 上游实际运行的测试程序：本版本仅有 1 组回归 fixture
upstream_tests:
  - file: tests/whitespace-in-content.orig.xml
    source: "xmlindent-0.2.18/tests/whitespace-in-content.orig.xml"
    description: >-
      文本节点内空白保留回归测试。输入 <bar><foo>1 2 3 4 5</foo></bar>，
      期望输出为 4 空格缩进的三行结果。对应上游提交
      "#3 parse: Fix whitespace consumption within text nodes"（2020-02-23）。
    command: "./xmlindent tests/whitespace-in-content.orig.xml | cmp - tests/whitespace-in-content.expected.xml"

# 上游测试总数（如实申报）
upstream_total: 1
upstream_executed: 1

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xmlindent.sh
    description: >-
      打包产物消费者冒烟 12 项断言：二进制可执行、`-v` 输出 0.2.18 且退出码 0、
      `-h` 输出用法、stdin 过滤输出与期望逐字节一致、文件参数与 stdin 结果一致、
      `-o` 写出文件内容正确、`-i 2` 缩进生效、`-t` 使用制表符缩进、
      `-w` 原地覆盖原文件、未知选项退出码非 0、畸形输入不崩溃且不挂起。
    command: "bash test_xmlindent.sh <pkg_bin>"

# 关于 flex 的说明（重要）
flex_notes:
  role: "build-time only"
  detail: >-
    flex 仅用于在构建期从 xmlindent.yy 生成 lex.yy.c（indent.c 以
    `#include "lex.yy.c"` 引入）。产物是单一自包含可执行文件，运行期与
    打包期都不需要 flex、libfl 或任何其它库依赖 —— 在 OHOS 目标上链接以
    `-Wl,-z,defs -Wl,--no-undefined` 通过且不需要 -lfl。
    因此 **不** 声明为 requires() / runtime 依赖。

# 测试断言总数 (近似值, 用于质量评估)
# test_package 12 项 + 上游 1 项
assertion_count: 13
