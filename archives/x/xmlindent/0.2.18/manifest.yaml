software: xmlindent
version: "0.2.18"
build_system: makefile
status: pending
build_date: ""

source:
  url: "https://github.com/penberg/xmlindent/archive/refs/tags/v0.2.18.tar.gz"
  sha256: "9f9de6f6d759646fbaa229e2a69479e3937ecb5a0908d8700c49b99faa91db97"
  tar_format: tar.gz
  note: >-
    SourceForge 上 0.2.18 的下载路径已失效（404）。改用上游项目自身的 GitHub 仓库
    penberg/xmlindent 的 v0.2.18 标签归档（commit 586f87aca3cb），即该版本发布所对应的
    同一份源码。sha256 于 2026-09-24 校验。

build:
  system: makefile
  cc: clang
  build_tools:
    - "flex (仅构建期用于从 xmlindent.yy 生成 lex.yy.c，非运行期/打包期依赖)"
  dependencies: []

patches_applied: []
ohos_source_changes: none

knowledge_gained:
  - "xmlindent 0.2.18 **无需任何源码修改**即可在 OHOS 上编译、链接与运行：aarch64-unknown-linux-ohos + clang 15.0.4 直接 `make CC=clang` 成功，上游回归 fixture 逐字节通过"
  - "flex 只是构建期工具：用于从 xmlindent.yy 生成 lex.yy.c，而 indent.c 以 `#include \"lex.yy.c\"` 引入该生成文件。产物是单一自包含可执行文件，运行期不需要 flex/libfl。OHOS 上链接在 `-Wl,-z,defs -Wl,--no-undefined` 下通过且**不需要 -lfl**（flex 2.6.4 生成的扫描器不产生外部 yywrap 引用）—— 因此绝不能把 flex 写成 runtime/package 依赖"
  - "上游 Makefile 的构建链有个易被误读的细节：`lex.yy.c: xmlindent.yy` 调 flex 生成；`indent.c: lex.yy.c` 只做 `touch indent.c`（迫使 indent.o 重编，因为 indent.c 通过 #include 把生成文件包含进来）；链接目标只有 buffer.o error.o indent.o main.o，**没有 lex.yy.o**"
  - "上游没有 test/check 目标，但提供了 1 组正式回归 fixture（tests/whitespace-in-content.{orig,expected}.xml，2020-02-23 提交 \"#3 parse: Fix whitespace consumption within text nodes\" 引入），可直接执行（stdin/stdout 过滤器语义），即本版本完整上游测试集：upstream_total = 1，已全量执行并通过"
