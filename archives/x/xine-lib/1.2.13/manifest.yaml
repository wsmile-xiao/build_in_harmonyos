# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "setgid HMDFS 挂载下，umask 077 创建的临时目录不可写（owner 无有效 x 位），config.guess/configure 写 dummy.c 直接 Permission denied；改用 umask 022 即解（E490 同族）。"
  - "OHOS sysroot 既不声明也不导出 pthread_cancel/pthread_testcancel；仅补声明会导致 ld.lld: undefined symbol，必须做行为回退（select 有界超时 + 运行标志轮询）。"
  - "2009 版 config.guess 不识别 uname -s=HarmonyOS，需加 aarch64:HarmonyOS:*:* 分支输出 aarch64-linux-ohos，并让 config.sub 接受 linux-ohos 与 aarch64。"

# ============================================================
# 补丁生成元数据（refresh-patch --auto 写入）
# ============================================================

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/xine-lib-1.2.13.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/xine-lib-1.2.13.work
  source_orig_hash: b3b216186cbcf339
  source_work_hash: 6e492555271a743a
  generated_at: '2026-10-03T14:20:30'
  patches_count: 6

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: "aarch64:HarmonyOS 分支输出 aarch64-linux-ohos + 临时目录 umask 077->022"
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: "接受 aarch64 CPU 与 linux-ohos OS"
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: "config.status 临时目录 umask 077->022"
  - file: 0004-src-input-input_rtp.c.patch
    type: auto
    platform_only: True
    guard: "移除 pthread_cancel/pthread_testcancel，改为运行标志轮询"
  - file: 0005-src-vdr-input_vdr.c.patch
    type: auto
    platform_only: True
    guard: "移除 pthread 取消 API 使用；rpc 线程本就轮询 shutdown 标志"
  - file: 0006-src-xine-engine-broadcaster.c.patch
    type: auto
    platform_only: True
    guard: "pthread_cancel 改为 select() 有界超时 + 运行标志轮询"
