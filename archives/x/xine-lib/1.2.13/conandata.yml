sources:
  url: "https://downloads.sourceforge.net/project/xine/xine-lib/1.2.13/xine-lib-1.2.13.tar.xz"
  sha256: "5f10d6d718a4a51c17ed1b32b031d4f9b80b061e8276535b2be31e5ac4b75e6f"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Recognise aarch64-*-HarmonyOS as aarch64-linux-ohos; create temp dirs with umask 022 (umask 077 dirs are unwritable under the setgid HMDFS mount)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept aarch64 as CPU and linux-ohos as OS in the bundled config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "Create the config.status temp directory with umask 022 instead of 077"
    patch_type: "portability"
  - patch_file: "patches/0004-src-input-input_rtp.c.patch"
    patch_description: "RTP input: stop using pthread_cancel/pthread_testcancel (not provided by the OHOS libc) and poll the plugin running flag instead"
    patch_type: "portability"
  - patch_file: "patches/0005-src-vdr-input_vdr.c.patch"
    patch_description: "VDR input: drop pthread cancel API usage (not provided by the OHOS libc); the rpc thread already polls its shutdown flag"
    patch_type: "portability"
  - patch_file: "patches/0006-src-xine-engine-broadcaster.c.patch"
    patch_description: "Broadcaster: replace pthread_cancel with a bounded select() timeout polling the running flag"
    patch_type: "portability"
