# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xine-lib/1.2.13
homepage: "https://sourceforge.net/projects/xine/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./src/xine-utils/xmltest xmltest-sample.xml"

# ─────────────────────────────────────────────────────────────────────
# 上游测试清点（证据：reports/test-report.md §1/§2、.ohc-logs/upstream-test-entries.log）
#
#   * 自动化测试套件：0 个 —— `make check` 在全部子目录均为
#     "Nothing to be done for 'check'"（25 处）；无 TESTS=/check_PROGRAMS、
#     无 ctest/pytest/cargo/go test 入口。
#
#   * 计数口径（与 reports/test-report.md 完全一致，逐项如下）：
#       上游入口（程序级，清点）  = 7   = 实测程序 3 + 不适用入口 2 + 库内编译单元 2
#                                    （本文件 upstream_tests 恰为 7 个条目）
#       实测程序                  = 3   (xmltest / xine-list / cdda_server)
#       实测用例调用（执行次数）  = 6   (上述程序各调用 2 次，全部 PASS / 0 FAIL / 0 SKIP)
#       不适用入口                = 2   (xine-fontconv / contrib-libdha-test)
#       库内编译单元（无独立入口） = 2   (input_test.c / sound_tester.c)
# ─────────────────────────────────────────────────────────────────────
upstream_tests:
  - file: src/xine-utils/xmlparser.c
    source: xine-lib-1.2.13/src/xine-utils/xmlparser.c
    description: "xmltest (noinst_PROGRAMS, -DXINE_XML_PARSER_TEST): XML lexer/parser round-trip"
    command: "./src/xine-utils/xmltest xmltest-sample.xml"
    cases: 2
    applicable: true
    result: "PASS rc=0（正常 XML 与畸形 XML 各 1 次）"
    log: ".ohc-logs/upstream-sample-xmltest-ok.log, .ohc-logs/upstream-sample-xmltest-bad.log"
  - file: misc/xine-list.c
    source: xine-lib-1.2.13/misc/xine-list.c
    description: "xine-list (bin_PROGRAMS): engine + plugin catalogue smoke run"
    command: "XINE_PLUGIN_PATH=<plugins> ./misc/xine-list-1.2 -a"
    cases: 2
    applicable: true
    result: "PASS rc=0（--help 与 -a 各 1 次；-a 枚举全部支持 MIME/扩展，证明插件加载正常）"
    log: ".ohc-logs/upstream-sample-xinelist-help.log, .ohc-logs/upstream-sample-xinelist-all.log"
  - file: misc/cdda_server.c
    source: xine-lib-1.2.13/misc/cdda_server.c
    description: "cdda_server (EXTRA_PROGRAMS): CDDA/DVD TCP server startup and usage output"
    command: "./misc/cdda_server"
    cases: 2
    applicable: true
    result: "PASS（无参 usage rc=255；带参启动监听被 timeout 终止 rc=124 属预期）"
    log: ".ohc-logs/upstream-sample-cdda.log, .ohc-logs/upstream-sample-cdda2.log"
  - file: misc/xine-fontconv.c
    source: xine-lib-1.2.13/misc/xine-fontconv.c
    description: "xine-fontconv (EXTRA_PROGRAMS): font conversion tool"
    command: "make -C misc xine-fontconv"
    cases: 0
    applicable: false
    reason: "EXTRA_PROGRAMS 默认不构建；硬依赖可选库 freetype2（configure.ac:315，默认 no）→ 'ft2build.h' file not found"
    log: ".ohc-logs/upstream-misc-programs-build.log"
  - file: contrib/libdha/kernelhelper/test.c
    source: xine-lib-1.2.13/contrib/libdha/kernelhelper/test.c
    description: "libdha test (EXTRA_PROGRAMS): x86/X11 DGA helper"
    command: "make -C contrib/libdha test"
    cases: 0
    applicable: false
    reason: "x86/X11 DGA 专用组件，sysdep/pci_linux.c 调用 iopl()（x86 端口 I/O 权限）；aarch64/OHOS 无该接口且 DGA 不适用"
  - file: src/input/input_test.c
    source: xine-lib-1.2.13/src/input/input_test.c
    description: "builtin 输入插件 xineplug_inp_test.la（in_builtins）"
    cases: 0
    applicable: false
    kind: library-unit
    reason: "随 libxine 编译进共享库（builtin 插件），无独立运行入口；由 xine-list 加载验证"
    log: ".ohc-logs/make-3.log"
  - file: src/post/goom/sound_tester.c
    source: xine-lib-1.2.13/src/post/goom/sound_tester.c
    description: "goom post 插件编译单元"
    cases: 0
    applicable: false
    kind: library-unit
    reason: "随 goom 插件编译（sound_tester.lo），无独立运行入口"
    log: ".ohc-logs/make-3.log"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "libxine 公共 API 消费者冒烟测试 + 鸿蒙平台断言（8 条断言，含 2 条鸿蒙特有）"
    command: "./test_xine-lib"
    assertions: 8
    ohos_specific_assertions: 2

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
# 鸿蒙特有用例数（>=1 契约）
ohos_specific_cases: 2
