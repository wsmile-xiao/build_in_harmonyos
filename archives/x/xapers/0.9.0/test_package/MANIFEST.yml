# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xapers/0.9.0
homepage: "https://finestructure.net/xapers"

# 上游测试命令（setuptools 项目，bash 测试套件入口）
upstream_check_command: "./test/xapers-test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "./test/xapers-test"

# 上游实际运行的测试程序 (bash 测试套件, 4 个测试组)
upstream_tests:
  - file: test/xapers-test
    source: xapers-0.9.0/test/xapers-test
    description: "xapers 主测试套件入口 (basic/sources/all/import 4 组)"
    command: "./test/xapers-test"
  - file: test/basic
    source: xapers-0.9.0/test/basic
    description: "基础测试组 (8 个用例)"
    command: "XAPERS_TESTS=basic ./test/xapers-test"
  - file: test/sources
    source: xapers-0.9.0/test/sources
    description: "来源/文献源解析测试组"
    command: "XAPERS_TESTS=sources ./test/xapers-test"
  - file: test/all
    source: xapers-0.9.0/test/all
    description: "命令行综合测试组"
    command: "XAPERS_TESTS=all ./test/xapers-test"
  - file: test/import
    source: xapers-0.9.0/test/import
    description: "导入功能测试组"
    command: "XAPERS_TESTS=import ./test/xapers-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_xapers.py
    description: "验证 xapers 包可导入、CLI --version 正常输出 0.9.0"
    command: "python3 test_xapers.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 83
