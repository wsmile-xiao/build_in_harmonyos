# test_package/MANIFEST.yml
# xbitmaps 1.1.3 - upstream test declaration and consumer-test audit.

package: xbitmaps/1.1.3
homepage: "https://gitlab.freedesktop.org/xorg/data/xbitmaps"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream xbitmaps 1.1.3 is a pure data package: the tarball ships 71
  bitmap data files plus autotools install scaffolding only. There is no
  check/test target, no tests/ directory and no test code of any kind.
upstream_check_command: "n/a (no test target)"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests: []

test_package_tests:
  - file: test_xbitmaps.c
    description: >-
      compiled consumer: #include five installed bitmaps (boxes, target,
      cross_weave, gray, plaid) and assert dimensions plus the X11 packing
      rule ((w+7)/8)*h == sizeof(bits).
    command: "./test_xbitmaps"
  - file: test_bitmaps.sh
    description: >-
      data consumer: scan all 71 installed files under include/X11/bitmaps,
      verify each defines <name>_width/_height and a <name>_bits[] array
      whose byte count matches ((w+7)/8)*h, and the installed count is 71.
    command: "sh test_bitmaps.sh"

test_files:
  - path: "test_package/test_xbitmaps.c"
    test_type: "R34"
    assertion_count: 8
  - path: "test_package/test_bitmaps.sh"
    test_type: "R34"
    assertion_count: 72

test_package_test_count: 2
consumer_assertion_count: 80
upstream_test_cases: 0
assertion_count: 80
