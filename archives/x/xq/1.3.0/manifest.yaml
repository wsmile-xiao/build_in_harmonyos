software: xq
version: "1.3.0"
status: published
build_date: "2026-06-04"

source:
  url: "https://github.com/sibprogrammer/xq/archive/refs/tags/v1.3.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build_system: custom
build:
  system: custom
  configure_options:
    - "CGO_ENABLED=0"
    - "GOPROXY=https://goproxy.cn,direct"
    - "GOOS=linux"
    - "GOARCH=arm64"
  dependencies:
    - "go/1.25.4"
  cc: clang
  cxx: clang++
  build_command: "go build -trimpath -ldflags='-s -w' -o xq ."

patches_applied: []

knowledge_gained:
  - "Go项目编译：CGO_ENABLED=0静态编译，Go工具链从goenv预编译包安装"
  - "Go test框架生成的测试二进制需要ELF签名才能在鸿蒙上运行"