sources:
  url: "https://www.maier-komor.de/xjobs/xjobs-20241010.tgz"
  sha256: "985666fede9346abe034a0074d8ab03f19f518802eaa744dd339c4028e639f38"

patches:
  "20241010":
    - patch_file: "patches/0001-jobctrl.c.patch"
      patch_description: "0001 Return failure for -e child jobs while preserving upstream default exit behavior and honor TMPDIR for captured output"
      patch_type: "portability"
      patch_source: "Local validation of the upstream 20241010 release"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "0002 Allow Autoconf to canonicalize the aarch64 Linux OHOS triplet"
      patch_type: "portability"
      patch_source: "OHOS Clang 15 H1 build profile"
    - patch_file: "patches/0003-xjobs.c.patch"
      patch_description: "0003 Preserve single-character command arguments after --"
      patch_type: "portability"
      patch_source: "Local validation of the upstream 20241010 release"
    - patch_file: "patches/0004-long-version-option.patch"
      patch_description: "0004 Accept the conventional --version option used by the framework staging verifier"
      patch_type: "portability"
      patch_source: "OpenHarmony PC framework main c611f7d61b422eda200fc49481cf0d404e63f10c driver.py Step8 calls --version"
    - patch_file: "patches/0005-configure-mkdir-tempdir.patch"
      patch_description: "0005 Use the secure mkdir fallback for config.status on HMDFS and clean only a directory successfully created by this process"
      patch_type: "portability"
      patch_source: "Current-head CI76967/Worker033 first-write failure; same-worker peer77441 mkdir fallback success; targeted shell collision validation"
    - patch_file: "patches/0006-testdummy-sleep-command.patch"
      patch_description: "0006 Invoke sleep by command name instead of treating command -v alias output as a path, and propagate sleep dependency errors"
      patch_type: "portability"
      patch_source: "Original H1-011 upstream sleep alias failure; fixed helper delay/error validation H1-021 and original ten-task upstream PASS H1-025"
