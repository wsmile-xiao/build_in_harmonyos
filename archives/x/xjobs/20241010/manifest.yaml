knowledge_gained:
  - "The bundled config.sub must recognize linux-ohos for the HarmonyOS aarch64 compiler triplet. (knowledge_ref: notes.md#Source-and-build; graph: E007)"
  - "Upstream parse_args treats any one-character argument as a possible redirection operator unless the following token is inspected first. (knowledge_ref: notes.md#Focused-behavior-corrections; patch: patches/0003-xjobs.c.patch)"
  - "The upstream make test suite uses ten AWK-generated values; testdummy returns 1 for values less than or equal to 4 and 0 for values greater than 4, so preserve actual values and exit code rather than rerolling. (knowledge_ref: notes.md#Upstream-test-census; reports/test-report.md)"
  - "The framework staging verifier calls each executable with --version; preserve xjobs -V and accept --version as an alias so the AArch64 binary passes the real staging check. (knowledge_ref: notes.md#Focused-behavior-corrections; graph: E503)"
