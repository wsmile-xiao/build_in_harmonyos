package: xjobs/20241010
homepage: "https://www.maier-komor.de/xjobs.html"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"
upstream_tests:
  - file: runtest1.sh
    source: "xjobs-20241010.tgz/runtest1.sh"
    description: "Generates ten randomized dummy jobs and runs xjobs with -j8"
    command: "./runtest1.sh"

test_package_tests:
  - file: functional.py
    description: "Checks --version compatibility, task count, concurrency cap, failure status, stdout redirection, spaced job arguments, single-character template arguments, cancellation, and child reaping"
    command: "python3 functional.py <package>/bin/xjobs ./test-results"

assertion_count: 8
