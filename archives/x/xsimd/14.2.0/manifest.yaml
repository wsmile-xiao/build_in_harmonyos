knowledge_gained:
  - "xsimd 14.2.0 是为 Arrow 23/25 新做的：两版要求 >=14.2.0，而制品仓最高只有 13.2.0"
  - "xsimd 是 header-only，但 Arrow 的 CMakeLists 注释写明 'Xsimd is mandatory as its CPU feature detection is the basis for Arrow CpuInfo'，关不掉"
  - "主头是 include/xsimd/xsimd.hpp（不是 xsimd.h）——写测试时按 .h 找会 file not found"
  - "OHOS clang 15 不认函数级 target("arch=armv8-a+sve") 属性，但用 -march=armv8-a+sve 全局开后属性变冗余，可编过"
