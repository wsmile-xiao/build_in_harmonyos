version: "4.2.1"
software: "xraylib"
status: "built"
build_date: "2026-09-16"
build_system: "meson"
conan_ref: "xraylib/4.2.1"

source:
  url: "https://github.com/tschoonj/xraylib/archive/refs/tags/xraylib-4.2.1.tar.gz"
  sha256: "4083f3e4d611767b9aa3dfa0339ab1766ae9e23a8444cc95f429eb3ce81c3316"
  tar_format: "tar.gz"

build:
  system: "meson"
  configure_options:
    - "-Dfortran-bindings=disabled -Dpython-bindings=disabled"
    - "-Ddefault_library=static (shared=True -> shared)"
    - "-Dpython-numpy-bindings=disabled"
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied: []

knowledge_gained:
  - "Meson 路线无需 autoreconf；tool_requires 仅 meson/1.11.0，避开残缺 automake 包"
  - "-Dfortran-bindings=disabled -Dpython-bindings=disabled 关闭全部语言绑定，仅构建核心 C 库 libxrl"
  - "上游 tests/ 27 个 C 测试 + cplusplus/tests 8 个 C++ 测试，meson test 全量运行（计 35）"

homepage: "https://github.com/tschoonj/xraylib"
license: "BSD-3-Clause"

tests:
  upstream:
    command: "meson test -C build --print-errorlogs"
    cases: 35
    note: "tests/ 27 个 C 测试 + cplusplus/tests 8 个 C++ 测试（meson test 自动发现），conanfile build() 全量运行"
  adapted:
    command: "test_package/test_xraylib"
    cases: 7
    note: "消费者视角真实 API 调用（AtomicWeight/ElementDensity/LineEnergy/CS_*）"
