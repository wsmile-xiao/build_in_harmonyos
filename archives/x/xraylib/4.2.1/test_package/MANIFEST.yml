package: xraylib/4.2.1
homepage: "https://github.com/tschoonj/xraylib"
upstream_check_command: "meson test -C build --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"
upstream_tests_exist: true

# Upstream tests/meson.build 27 C programs + cplusplus/tests 8 C++ programs
# (cross-checked with tests/Makefile.am TESTS). Representative entries below;
# full list in notes.md. Recipe build() runs all via `meson test`.
upstream_tests:
  - file: "tests/test-atomicweight.c"
    source: "xraylib-4.2.1/tests/test-atomicweight.c"
    description: "AtomicWeight reference values + invalid-Z error path"
    command: "meson test # test-atomicweight"
  - file: "tests/test-densities.c"
    source: "xraylib-4.2.1/tests/test-densities.c"
    description: "ElementDensity reference values + error paths"
    command: "meson test # test-densities"
  - file: "tests/test-fluor_lines.c"
    source: "xraylib-4.2.1/tests/test-fluor_lines.c"
    description: "LineEnergy IUPAC/Siegbahn values + invalid line handling"
    command: "meson test # test-fluor_lines"
  - file: "tests/test-cross_sections.c"
    source: "xraylib-4.2.1/tests/test-cross_sections.c"
    description: "CS_Total/Photo/Rayl/Compt cross sections"
    command: "meson test # test-cross_sections"
  - file: "tests/test-scattering.c"
    source: "xraylib-4.2.1/tests/test-scattering.c"
    description: "Differential scattering cross sections"
    command: "meson test # test-scattering"
  - file: "tests/test-crystal_diffraction.c"
    source: "xraylib-4.2.1/tests/test-crystal_diffraction.c"
    description: "Crystal diffraction (Bragg) calculations"
    command: "meson test # test-crystal_diffraction"
  - file: "tests/test-version.c"
    source: "xraylib-4.2.1/tests/test-version.c"
    description: "Library version reporting"
    command: "meson test # test-version"

test_package_tests:
  - file: "test_xraylib.c"
    description: "Consumer test calling 7 real APIs (AtomicWeight/ElementDensity/LineEnergy/CS_Total/CS_Photo/FluorYield/EdgeEnergy) with upstream reference values"
    command: "./test_xraylib"

assertion_count: 7
