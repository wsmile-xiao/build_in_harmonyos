# test_package/MANIFEST.yml — xcolmix 1.07
# 上游官方测试声明 + 本包消费者测试声明

package: xcolmix/1.07
homepage: "https://sources.debian.org/src/xcolmix/"

# ── 上游测试套件审计（对 xcolmix_1.07.orig.tar.gz 逐项清点）────────────
upstream_tests_exist: false
upstream_test_audit:
  - source: "src/Makefile"
    reason: "全部目标为 foobar / final / debug / clean / install / dist；没有 check、test 或 check-local 目标，没有 TESTS / check_PROGRAMS 变量。"
  - source: "src/*.c (7 个)"
    reason: "xcolmix.c / callbacks.c / initforms.c / makecolor.c / usage.c / design.c / loadlookupbrowser.c；grep -c 'assert(' 命中 0 次，无任何运行时断言型用例。"
  - source: "src/Makefile OBJ 列表"
    reason: "OBJ = xcolmix.o callbacks.o initforms.o makecolor.o usage.o design.o loadlookupbrowser.o —— 7 个对象全部是 GUI 程序本体，没有测试驱动。"
  - source: "xcolmix.README / ChangeLog"
    reason: "README 只描述如何取源码与安装；ChangeLog 记录 1.07 的改动（许可证、man page、Makefile 与 #include <X11/forms.h>），未提及任何测试设施。"
  - conclusion: "上游 1.07 未提供任何自动化测试框架或用例；证据由 test_package 对打包产物的真实执行与 ELF 契约解析承担。"
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── 本包消费者测试 ───────────────────────────────────────────────────
test_package_tests:
  - file: "test_package/conanfile.py :: test_elf_contract"
    kind: elf-contract
    description: "用 struct 直接解析 <package>/bin/xcolmix 的 ELF64 映像：magic、ELFCLASS64、e_machine==EM_AARCH64(183)、e_type==ET_DYN、PT_INTERP 为绝对路径、DT_NEEDED 含 libforms.so.2 / libX11.so.6 / libc.so、DT_NEEDED 无绝对或 ../ 路径、DT_FLAGS_1 含 DF_1_PIE。libforms.so.2 这一条钉死产物确实是动态绑定到已适配的 XForms 栈，而非内联或空实现。不依赖 readelf/llvm-readelf，交叉构建宿主与真机 worker 行为一致。"
    assertions: 11
  - file: "test_package/test_xcolmix.sh"
    kind: runtime-execution
    description: "真实执行打包的 xcolmix 二进制三条命令行，全部在 main() 内部判定、不需要 X server：(1) `xcolmix alpha beta gamma` 走 argc>2 分支；(2) `xcolmix <不存在路径>` 走 argc==2 + access(R_OK) 拒绝分支；(3) `xcolmix -display 127.0.0.1:99 alpha beta gamma` 把 display 强制到关闭的回环端口，使 fl_initialize() 的 XOpenDisplay 必然失败，从而证明 XForms 代码确实在进程内执行。断言对象是退出码与 src/usage.c 打印的横幅（横幅含 src/version.h 的 V1.07）。刻意不测无参数与合法 rgb 文件两条路径：它们会进入 fl_do_forms() 阻塞或段错误（本地实测 rc=124 / SIGSEGV），不能作为 CI 断言。"
    assertions: 9

assertion_count: 20
assertion_formula: "test_package/conanfile.py::test_elf_contract 11 项 + test_package/test_xcolmix.sh 9 项 = 20 项，全部在 HarmonyOS aarch64 上实测执行通过"

runtime_case_matrix:
  - case: "xcolmix alpha beta gamma"
    expected_exit: 1
    expected_output: "X Color Mixer  V1.07 / Usage: xcolmix"
  - case: "xcolmix <absent-rgb-path>"
    expected_exit: 1
    expected_output: "X Color Mixer  V1.07 / Usage: xcolmix / or: xcolmix [X options] rgb-database-file"
  - case: "xcolmix -display 127.0.0.1:99 alpha beta gamma"
    expected_exit: 1
    expected_output: "In fl_initialize() [flresource.c:...]: xcolmix: Can't open display 127.0.0.1:99"

execution_mode: "installed-package（conan create 的 test 阶段自动执行；CI 门禁 L1a 校验执行痕迹，L1e 移走 bin/ 后必须失败）"