# 版本级 manifest — xcolmix 1.07
# 遵循 ARCHIVE-SPEC v2.0

version: "1.07"
software: "xcolmix"

# 编译状态: published | built | failed | archived
# PR 阶段尚未由 release 流水线 upload 到制品仓，真实状态为 built
status: built

build_date: "2026-10-03"
build_system: make

# 源码信息（与 conandata.yml 一致；上游 1996 年的官方分发点已不可达，取
# Debian 官方镜像的 .orig 归档，其 sha256 由签名 .dsc 声明，见 notes.md §1）
source:
  url: "https://deb.debian.org/debian/pool/main/x/xcolmix/xcolmix_1.07.orig.tar.gz"
  sha256: "1955698b1d9e62d9af8eef8f544e4509025785c49bef914296fa90987780ef17"
  tar_format: tar.gz

# 构建配置
build:
  system: make
  make_target: "final"
  make_options:
    - "-j1"
  make_variables:
    - "XFINCDIR=<libforms include> <libx11 include> <xorgproto include>"
    - "XFLIBDIR=<libforms lib> <libx11 lib>"
  layout: "树内构建（folders.source == folders.build == src）：上游 Makefile 按裸文件名列 OBJ，无 VPATH 规则"
  packaging: "不用 make install（依赖 install -s 与 $(prefix)/man/man1 布局）；package() 显式落 bin/ + share/man/man1/ + licenses/，并对 ELF 做真机签名与权限刷新"
  dependencies:
    - "libforms/1.2.4 (headers+libs+run)"
    - "libx11/6.4.0 (headers+libs+run, force)"
    - "xorgproto/2025.1 (headers)"
    - "libxpm/3.5.17 (run)"
    - "libxcb/1.16 (run)"
    - "libxau/1.0.11 (run)"
    - "libxdmcp/1.1.5 (run)"
  cc: clang

# 补丁信息
patches_applied:
  - "patches/0001-xforms-public-header-include-path.patch"

# 知识沉淀
knowledge_gained:
  - "上游 1.07 是纯手写 Makefile（无 configure/autotools/meson/cmake）：STDCFLAGS=-c -O2 -Wall $(XFINCDIR) 与 STDLFLAGS=-s -L/usr/X11R6/lib 被硬编码在 final 目标的子 make 命令行上，因此 conan 的 CFLAGS/LDFLAGS 到不了编译与链接行。解法不是绕过 final，而是用 Makefile 注释里自己写明的两个旋钮 XFINCDIR/XFLIBDIR 把依赖的 -I/-L 交进去，final 原样执行"
  - "STDLFLAGS 这个拼写错误是上游的：final 用 LFLAGS=$(STDLFLAGS)，因此链接行恒带一个 -L/usr/X11R6/lib（该目录在 OHOS 不存在）。链接器忽略不存在的 -L，无害；不要为此改 Makefile"
  - "libforms/1.2.4 包把构建生成的公共头装成 include/forms.h（没有 include/X11/），而 xcolmix 上游按 X11R6 时代布局写 #include <X11/forms.h>。两条指令的差异用 patches/0001 处理，纯 include 路径适配，无平台宏（R8）。上游 ChangeLog 的 1.07 条目正好记录了改成 <X11/forms.h> 这个动作，说明 include 路径是它的既有敏感点"
  - "xcolmix 的 -lX11 不是可省的：链接行是 $(CC) -o xcolmix.new $(OBJ) $(XFLIBDIR) -lforms -lX11 -lm，libforms 只在 cpp_info.requires 里带 libx11::libx11，不直接给 -lX11 的搜索目录"
  - "xcolmix 的图形路径无法在 CI 断言：fl_initialize() 返回 NULL 后，initforms() 继续跑并段错误（本地实测 SIGSEGV），带合法参数时 fl_do_forms() 直接阻塞（rc=124）。可断言的只有 main() 里在显示窗口之前就判掉的三条命令行分支；其中 -display 指向关闭的回环端口可让 fl_initialize() 的诊断稳定复现，是证明 XForms 代码真的在进程内执行的最强信号"
  - "上游 usage() 把版本号 V1.07 直接编进 stderr 横幅（src/version.h），因此「横幅含 V1.07」既是版本断言也是「产物确实由本包源码构建」的断言；CI L2 的 --version/--help 冒烟对 xcolmix 必然非 0（argc==2 且 access 失败 → usage → exit 1），L2_RESULT=warn 属预期非阻塞"

upstream_tests_exist: false
upstream_test_audit: "对 xcolmix_1.07.orig.tar.gz 清点：src/ 只有 7 个 .c 与 1 个手写 Makefile；Makefile 目标为 foobar/final/debug/clean/install/dist，无 check/test 目标、无 TESTS/check_PROGRAMS 变量；grep -c 'assert(' src/*.c = 0；README 与 ChangeLog 均未提及测试设施。证据由 test_package 的 ELF 契约解析（11 项）+ 打包二进制真实执行（9 项）承担。"
reason: "xcolmix 1.07 ships no test harness (hand-written Makefile, no check target, no framework, assert() count 0). HarmonyOS evidence is carried by the test_package: 11 ELF/dynamic-link assertions parsed from the packaged binary plus 9 real runtime assertions on the three command lines main() rejects before it needs an X server."
