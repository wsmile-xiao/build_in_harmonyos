# conandata.yml — xcolmix 1.07
#
# 源码来源（R39）：上游 1996 年的官方分发点是 ftp.icce.rug.nl 的 /pub/unix/
# xcolmix-X.YY.tar.gz（见 tarball 内 xcolmix.README）。该主机已不可达，本轮实测：
#   curl -sI ftp.icce.rug.nl 的 /pub/unix/xcolmix-1.07.tar.gz  → 无响应
#   curl -sI www.icce.rug.nl/                                 → 无响应
#   invisible-island.net 的 /archives/xcolmix/                → HTTP 404
#   invisible-island.net 的 /datafiles/release/xcolmix.tar.gz → HTTP 404
# （Thomas Dickey 的站点只随 xterm 分发，不托管 xcolmix 的历史归档。）
#
# 因此取 Debian 官方镜像的 orig tarball：Debian 的 .orig 归档按约定就是未经改动的
# 上游原始发布件（quilt 格式的 .debian.tar.xz 才是 Debian 自己的补丁），其
# xcolmix_1.07-10.4.dsc 用 GPG 签名声明的 sha256 与本地实测一致：
#   1955698b1d9e62d9af8eef8f544e4509025785c49bef914296fa90987780ef17  16460  xcolmix_1.07.orig.tar.gz
# 16460 字节 / 21 个成员 / strip_root 后为 xcolmix-1.07/{COPYING,GPL,ChangeLog,
# xcolmix.README,src/}。
#
# ⚠ 本文件注释刻意不写带协议的 URL 串：上面各主机名一律不带协议前缀。CI 预下载步骤
# 用正则扫描全文，会把注释里带协议的串也抓去下载并原地改写本文件，而它的成功判据
# 只有 size>100B——404 错误页只要够大就会被当成"下载成功"替换掉真实 URL。同 xev
# conandata 的注意事项。
sources:
  "1.07":
    url: "https://deb.debian.org/debian/pool/main/x/xcolmix/xcolmix_1.07.orig.tar.gz"
    sha256: "1955698b1d9e62d9af8eef8f544e4509025785c49bef914296fa90987780ef17"

patches:
  - patch_file: "patches/0001-xforms-public-header-include-path.patch"
    patch_description: "Resolve the XForms public header as <forms.h> to match the packaged libforms include layout"
    patch_type: "portability"