# test_package/MANIFEST.yml — xwrited 3 (artifact xwrited/v3)
package: xwrited/v3
homepage: "https://code.guido-berhoerster.org/projects/xwrited/"

# ---- Upstream test audit ---------------------------------------------------
# The xwrited-3 tree was audited file by file; upstream ships no tests:
upstream_tests_exist: false
upstream_test_audit:
  - source: "xwrited-3 source tree (root listing)"
    reason: "No tests/, test/ or t/ directory and no *test*/*check* source file at any level; the tree holds only xwrited.c, xwd-application.[ch], xwd-utmp*.c, Makefile, deps.sed, po/, xwrited.1.xml and README/NEWS."
  - source: "xwrited-3/Makefile (.DEFAULT_TARGET/.PHONY and all targets)"
    reason: "Declares only all/pot/update-po/clean/clobber/dist/install targets plus pattern rules for .mo/.desktop/manpages; there is no check, test or TESTS target, so `make check` is a no-op."
  - source: "Debian source package xwrited 3-2 (debian/rules, .dsc build log)"
    reason: "The distribution build runs only `make all` + `make install`; no test step exists in the packaging either."
  - conclusion: "Upstream 3 provides no automated tests; the adaptation's test_package validates the installed xwrited binary as a runtime consumer check and does not claim upstream coverage."

# rule4 mandatory fields: an audited no_tests package declares total 0.
# Single hand-written Makefile with no test framework to count against.
upstream_test_total: 0
upstream_test_count_method: auto
upstream_test_passed: 0
upstream_test_failed: 0
upstream_test_skipped: 0

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ---- Consumer tests (test_package) -----------------------------------------
# test_package/conanfile.py runs test_xwrited.sh against the packaged
# bin/xwrited, parses its deterministic "RESULT: P passed, F failed" trailer
# into HMBS_TEST_PACKAGE_RESULT, and emits HMBS_UPSTREAM_TEST_RESULT
# (status=no_tests, 0 counts).
test_package_tests:
  - file: test_xwrited.sh
    description: "Consumer smoke test with 6 real assertions against the packaged binary: file presence, aarch64 ELF identity, --version/-V version output with exit 0, --help option documentation with exit 0, and a negative control where a positional argument is rejected with an 'invalid argument' diagnostic and non-zero exit."
    command: "sh test_xwrited.sh <package>/bin/xwrited <workdir>"

test_package_test_count: 6
assertion_count: 6
