version: "3"
software: "xwrited"
# Task-card/archive directory version (CI L0n branch gate matches
# "branch-prefix == package-dir-version" exactly). The Conan artifact is
# xwrited/v3 via set_version(): Conan's ConanName pattern
# ^[a-z0-9_][a-z0-9_+.-]{1,100}$ requires >= 2 chars, so a bare "3" fails at
# export with `ERROR: Invalid package version '3'` (same as cronic/3,
# tweeny/3, gcal/4 precedents). Upstream publishes no dotted form (tarball
# xwrited-3.tar.gz, Makefile VERSION = 3), hence the v-prefix form.
upstream_version: "3"
conan_ref: "xwrited/v3"
status: built
build_date: "2026-10-12"
build_system: "makefile"

source:
  url: "https://code.guido-berhoerster.org/projects/xwrited/downloads/xwrited-3.tar.gz"
  sha256: "07a6634325e81d22ef40a386698a87cc4912bd6d389257adf7fa523b8345bd07"
  tar_format: "tar.gz"

build:
  system: "makefile"
  target: "aarch64-unknown-linux-ohos"
  make_targets:
    - "xwrited"
    - "org.guido-berhoerster.code.xwrited.desktop"
    - "po/de.mo po/en.mo po/id.mo"
  make_variables:
    - "CC=<conan-tools.build:compiler_executables:c,缺失时回退PATH clang>"
    - "PKG_CONFIG=<pkgconf包内绝对路径，本仓pkgconf无pkg-config别名>"
    - "OS_NAME=OHOS"
    - "XCPPFLAGS=-D_XOPEN_SOURCE=600 -D_DEFAULT_SOURCE -DOHOS_NO_UTMPX_DB=1(OHOS时)"
  dependencies:
    - "glib/2.84.0.1"
    # CCI-leaf RREV pin (preflight 2026-10-11): glib's bare libffi/3.4.4
    # resolves to the CCI recipe whose configure fails with
    # "/data/service/hnp/bin/bash: inaccessible or not found" (Error 127);
    # pin the ohpcd-published hardened RREV (libtiger/ayatana-ido precedent).
    - "libffi/3.4.4#ca8b0eb4102edbca48730e504e3afbdc"
  tool_dependencies:
    - "pkgconf/3.0.5"
    - "gettext/0.22.5.1"
  cc: "clang"

patches_applied:
  - "patches/0001-ohos-utmpx-noop.patch"

compatibility:
  level: "high"
  issues:
    - "OHOS无utmp/utmpx登录记账子系统：pty记账入口为刻意no-op（E121/agetty先例），通知主路径不受影响"
  notes: |
    - Hand-written Makefile project; the utmpx backend is forced via
      OS_NAME=OHOS (no libutempter needed on OHOS).
    - OHOS utmpx no-op: OHOS musl libc仅提供<utmpx.h>结构体定义，无
      setutxent/pututxline/endutxent符号且struct utmpx无ut_name成员
      （2026-10-11真机compile失败铁证），补丁将记账入口降级为no-op，
      非OHOS构建保持上游语义（仅附musl用ut_name->ut_user别名）。
    - Man pages are not built (xsltproc would need a remote docbook
      stylesheet at build time); installed artefacts are bin/xwrited,
      the autostart .desktop file and three locale catalogs.

test_results:
  type: "device"
  passed: 0
  failed: 0
  rate: "待真机预检回填"
  note: "首轮工作树未提交，真机 evidence 轮由 HMBS 预检回填实测数字。"

knowledge_gained: []
references:
  - "https://code.guido-berhoerster.org/projects/xwrited/"
