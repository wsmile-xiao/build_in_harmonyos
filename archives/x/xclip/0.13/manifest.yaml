software: xclip
version: "0.13"
status: built
build_date: "2026-06-25"

source:
  url: "https://download.savannah.nongnu.org/releases/xclip/xclip-0.13.tar.gz"
  sha256: "fae64584ceebb1391045c642a112020a5faf713501267fa48457cf0f3035d5cf"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--x-includes=${HOME}/usr/local/include"
    - "--x-libraries=${HOME}/usr/local/lib"
  dependencies:
    - libx11/6.4.0
    - libxext/6.4.0
    - libxau/6.0.0
    - libice/6.3.0
    - libsm/6.0.1
    - libiconv/1.17
    - xorgproto/2024.1
    - libtool/2.4.7
  cc: clang
  cxx: clang++

patches_applied:
  - "xclip.c: 添加 #include <X11/Xresource.h>（兼容新版 libX11）"
  - "Makefile: 链接行添加 -liconv"

knowledge_gained:
  - "xclip 依赖 X11/Xmu/Atoms.h 和 X11/Intrinsic.h，可通过最小 stub 头文件满足配置检测"
  - "xclip 实际未直接调用 XmuClientWindow，stub 实现返回原窗口即可"
  - "新版 libX11 (6.4.0) 将 Xrm 类型移入独立头文件 X11/Xresource.h，旧代码需适配"
  - "libX11 6.4.0 基于 XCB 传输层，运行时需要 libxcb"
