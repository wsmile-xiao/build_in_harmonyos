# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: xclip/0.13.1
homepage: "https://github.com/astrand/xclip"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游提供 xctest 脚本（5 数据量 × 4 selections × 3 模式 = 60 场景）。
# 实测结果：在 cmd-pkgs xorg-server（Xvfb 21.1.15）提供的虚拟 X server 上实际运行，
# 60/60 全部通过（diff 无差异、stderr 空、退出码 0）。运行环境：Xvfb TCP :101 +
# DISPLAY=127.0.0.1:101；依赖链 libpixman/libXfont2/libfontenc/libnettle/libtirpc/
# zlib/xkeyboard-config/xkbcomp/libxkbfile 全部就绪（libxkbfile 从 x.org 官方源编译）。
# 详见 reports/test-report.md §2.5。
upstream_tests:
  - file: xctest
    source: xclip-0.13/xctest
    description: "X11 剪贴板往返测试（Xvfb 实测通过，60/60，见 reports/test-report.md §2.5）"
    command: "./xctest"

# test_package 中自带的测试 (消费者视角验证)
# R34: 实质执行被测包二进制 xclip -version 并校验输出（任何环境可跑的保底测试）；
# 上游 xctest 60 场景已集成进 test_package/conanfile.py test()：
#   有 X server（DISPLAY 或系统 Xvfb）→ 实际运行全部 60 场景并断言 rc=0；
#   无 X server → 平台限制降级说明，不阻塞（与仓库内 xterm 同款处理）。
test_package_tests:
  - file: test.c
    description: "执行 xclip -version 校验版本输出（实质依赖被测包）"
    command: "./test_xclip"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
