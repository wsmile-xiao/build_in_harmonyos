# Upstream and consumer test inventory for xmppc 0.1.0.
package: xmppc/0.1.0
homepage: "https://codeberg.org/Anoxinon_e.V./xmppc"

# The upstream Automake project defines no TESTS, test directory, or check target.
upstream_check_command: "none (upstream Makefile.am defines no check target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# Conan consumer test executes the packaged CLI; OHOS armv8 runs this on HarmonyOS.
test_package_tests:
  - file: conanfile.py
    description: "Consumer runtime test: execute test_cli.py against packaged xmppc; on OHOS require armv8 and check help exit status, usage banner, and option text."
    command: "conan test"

assertion_count: 5
