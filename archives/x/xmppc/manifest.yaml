software: xmppc
display: "xmppc (XMPP command-line client)"
description: "C command-line XMPP client using libstrophe, GLib, and GPGME"
category: network
homepage: "https://codeberg.org/Anoxinon_e.V./xmppc"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Build configure from configure.ac with Conan-provided Automake and Libtool tools."
    - "Set Autotools build and host triplets from Conan settings for Linux and OHOS."
    - "Use umask 022 in the generated OHOS configure script to keep config.status temporary files accessible on HMDFS setgid directories."
    - "The CLI consumer test checks OHOS/armv8 settings and executes xmppc --help on HarmonyOS."
  common_dependencies:
    - glib/2.88.0.1
    - gpgme/1.24.0
    - libstrophe/0.14.0

versions:
  "0.1.0":
    status: built
    build_date: "2026-10-02"
    notes: "Conan recipe, source archive checksum, OHOS HMDFS config.status workaround, and consumer test for the packaged CLI."
