# 软件级 manifest — xfel
# 文件位置: archives/x/xfel/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: xfel
display: "xfel (Tiny FEL tools for Allwinner SOC)"
description: "全志（Allwinner）SoC 的轻量级 FEL 工具：经 USB OTG 进入 FEL 模式，做初始烧录/内存读写/SPI NOR·NAND 访问/ECDSA 签名"
category: utility
homepage: "https://github.com/xboot/xfel"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 把工具链硬编码为 CC := $(CROSS)gcc，OHOS 无 gcc；GNU Make 命令行变量赋值优先于 makefile 内的 :=，故由配方传 CC=<conf 的 clang> 覆盖，无需打补丁"
    - "libusb 由 Conan 提供（无系统 libusb），Makefile 的 pkg-config 探测在 OHOS 上找不到；配方用 INCDIRS/LIBS 直接指向依赖包（-I<libusb>/include/libusb-1.0 / -L... -lusb-1.0），不依赖 pkg-config"
    - "libusb 非系统同名库，保持默认动态链接，运行期搜索路径用 -Wl,-rpath 固定"
    - "main.c 未检查 libusb_init() 返回值：OHOS 受限 /dev/bus 下 libusb_init() 返回 -1（sysfs_get_device_list EACCES），随后 libusb_get_device_list(NULL,...) 空指针解引用 → 所有子命令 SIGSEGV(139)；补丁改为检查返回值后正常退出"
    - "不使用上游 make install（硬编码 /usr/local/bin、/etc/udev/rules.d）；改由配方 copy 到 bin/ 与 share/xfel/"
  common_dependencies:
    - libusb

versions:
  - version: "1.3.5"
    status: built
    build_date: "2026-10-03"
    conan_reference: "xfel/1.3.5"
    notes: "首次适配。产出 bin/xfel；上游无自动化测试（清点证据见 1.3.5/test_package/MANIFEST.yml），已执行 CLI 入口矩阵 27/27（usage 3 通过 / 设备类 24 条退化为 rc=255 且不崩溃）；test_package 9/9（含 5 项鸿蒙特有断言）"
