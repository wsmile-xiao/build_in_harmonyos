# test_package/MANIFEST.yml — xfel 1.3.5
# 上游测试来源声明
# 参考: ARCHIVE-SPEC.md §2 test_package/ 规范 + ci/conan/build_and_test.sh L1 检测逻辑

package: xfel
version: "1.3.5"

# 上游构建系统与测试入口
upstream:
  build_system: makefile
  # 测试类型: make_check | ctest | meson_test | pytest | none
  # 上游（xboot/xfel）**没有自动化测试套件**，清点证据：
  #   - 无 tests/ 或 test/ 目录；无 *test* 命名的文件
  #   - 无 CMakeLists.txt / ctest / CTestTestfile / pytest 注册
  #   - Makefile 中无 check/test 目标（仅 all/install/uninstall/clean）
  #   - 仓库内无 .github/workflows 或其他 CI 配置；无任何 .sh 脚本
  #   - docs/README.md 的 "Build from source" 只演示 `make` / `make install`
  # 唯一真实入口是 CLI 本身（main.c:main() → usage()）。
  test_type: none
  test_command: "xfel [usage | version | hexdump | dump | read32 | write32 | read | write | exec | reset | sid | jtag | ddr | sign | spinor [...] | spinand [...] | extra [...] ]"
  test_directory: "."
  # 上游未提供任何测试样例数据（payloads/ 是目标 SoC 固件，非测试输入）
  upstream_samples: []

# OHOS 平台兼容性
ohos_compatibility:
  status: full
  detail: >-
    产物为 AArch64 OHOS ELF（/lib/ld-musl-aarch64.so.1），可在鸿蒙上真实执行。
    适配修复了 main.c 未检查 libusb_init() 返回值导致的 OHOS 启动即 SIGSEGV(139)；
    修复后 24 条设备类入口全部退化为可预期的 rc=255 + "ERROR:" 输出，不再崩溃。
    无 FEL 硬件时设备功能本身无法验证（USB VID:PID 1f3a:efe8，需真实设备）。
  known_failures: []

# Conan test_package 测试（L1，CI 通过 conan create 自动执行）
conan_test:
  type: executable
  description: "执行已安装的 bin/xfel 并断言真实输出；含 5 项鸿蒙特有断言（AArch64+musl、可在 OHOS 运行、设备入口不崩溃、Conan 管理的 libusb 链接、PIE/RELRO/NX）"
  test_method: "bash test.sh"
  test_count: 9
