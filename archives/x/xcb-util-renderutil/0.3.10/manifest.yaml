# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "hmdfs文件系统强制SGID导致config.status的umask 077创建临时目录失败（drwx--S---权限无法写入），需手动修补config.status移除umask 077"
  - "VPATH构建方式（在独立目录运行configure）可以避免源码目录被污染"
  - "ld.lld依赖libxml2.so.16但系统只有libxml2.so.2，需用-fuse-ld=bfd绕过"
  - "libtool因configure无法执行conftest而将build_libtool_libs设为no，需手动创建.so文件"
  - "所有文件系统noexec导致configure conftest无法执行，需用--host交叉编译绕过"

