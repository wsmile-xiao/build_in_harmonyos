# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: xauth/1.1.4
homepage: "https://gitlab.freedesktop.org/xorg/app/xauth"

# 上游源码审计：xauth 1.1.4 发布包**有**自动化测试，且本配方在 build() 内实跑。
upstream_tests_exist: true
upstream_test_audit:
  - source: "tests/Makefile.am"
    reason: "`TESTS = test_xauth` 一条 automake 用例；`EXTRA_DIST` 同时发布 test_xauth 驱动、setup-sourced 夹具与 5 组场景数据（010-xauth-add-inet / 020-xauth-add-local / 030-xauth-extract / 040-xauth-source / 090-xauth-bad-usage）。"
  - source: "tests/test_xauth"
    reason: "shell 驱动：对 `${srcdir}/*.script` 排序遍历，逐个执行并把 stdout/stderr 与同名 .stdout/.stderr 夹具 `diff`；任一场景有差异即整体 exit 1。"
  - source: "configure.ac"
    reason: "AC_CONFIG_FILES 含 tests/Makefile，确认 tests/ 参与常规构建（非 EXTRA_DIST-only 的非自动目标）。"
  - conclusion: "上游提供可自动执行的回归套件，用例为纯文件操作（只写 XAUTHORITY 文件），不依赖 X server，可在 CI worker 上原样执行。"

upstream_check_command: "make check"
upstream_test_in_build: true
# 主配方 build() 内 `Autotools(self).make(target=\"check\", args=[\"-j1\"])`
upstream_test_command: "make check"

# 上游用例数：automake 层 1 条（test_xauth），该驱动内部遍历 5 个 *.script 场景。
# 两处口径都列出，避免"少报"（rule4 以更宽的口径校验）。
upstream_tests:
  - name: "test_xauth"
    scope: "全部 5 个场景"
    description: "010 add-inet（含 net 名的 add/list/nlist/remove）、020 add-local（本地显示名匹配与 wc/awk 计数）、030 extract+merge（跨文件抽取与合并）、040 source（从命令文件批量读入）、090 bad-usage（8 种非法显示名必须失败且 stderr 匹配）"
    count: 1
    scenarios: 5

test_package_tests:
  - file: "test_xauth.sh"
    description: "真实执行已安装的 bin/xauth 二进制，5 项端到端行为断言：① `-V` 输出恰为 1.1.4 且 exit 0 ② `-f <file> add <display> <proto> <cookie>` exit 0 且授权文件非空（走 libXau 的锁+写全链路）③ `-f <file> list` 原样读回该 display 与 cookie ④ `-f <file> remove` exit 0 ⑤ remove 后 `list` 不再含该记录且仍 exit 0。scratch 目录由 conanfile 传入（OHOS `/tmp` 只读，E002）；libX11.so.6 的 DT_NEEDED（libxcb.so.1/libXau.so.6/libXdmcp.so.6）按依赖序经 LD_PRELOAD 注入绝对路径（HMBS [stale_runtime_library]，同 xeyes）。"
    command: "$SHELL test_xauth.sh <package>/bin/xauth <LD_PRELOAD_libs> <scratch_dir>"

assertion_count: 5
