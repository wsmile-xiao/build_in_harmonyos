# 版本级 manifest — xauth 1.1.4
# 遵循 ARCHIVE-SPEC v2.0

software: xauth
display: "xauth"
version: "1.1.4"
upstream_name: xauth
upstream_version: "1.1.4"
status: built
build_system: autotools
build_date: "2026-09-20"
compile_date: 2026-09-20
target_platform: aarch64-unknown-linux-ohos
conan_ref: "xauth/1.1.4"
source_pr: 11388

source:
  url: "https://xorg.freedesktop.org/archive/individual/app/xauth-1.1.4.tar.xz"
  sha256: "e9318141464ad7b4dc0f8564a580f0d20f977c85a388cc40d5a766206151c690"
  tar_format: tar.xz
  version_mapping: "Conan xauth/1.1.4 与上游 xauth 1.1.4 一一对应；产物为 bin/xauth（application，无共享库）。"

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux --host=aarch64-linux（config.sub 实测不认 linux-ohos；给本机三元组让 configure 走 non-cross 分支，不是伪装交叉编译）"
    - "XAUTH_CFLAGS / XAUTH_LIBS 由 Conan 依赖目录 + 就地编译的 libXmuu 生成（PKG_CHECK_MODULES 的 AC_ARG_VAR 逃生口）"
  environment:
    - "TMPDIR / DATADIR -> <build_folder>/test-scratch（上游测试夹具硬编码 ${DATADIR:-/tmp}，OHOS /tmp 只读，E002）"
  dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0.1"
    - "libxau/[>=1.0.11]（范围而非钉死：libxcb 一侧的 libxau 诉求在 1.0.11/1.0.12 间变过）"
    - "xorgproto/2025.1"
    - "libxcb/1.16（run）"
    - "libxdmcp/1.1.5（run）"
    - "libXmuu：**就地编译**上游 libXmu-1.3.1 tarball 的 src/GetHost.c，见 vendored"
  cc: clang
  cxx: ""

vendored:
  - name: "libXmuu"
    reason: >
      xauth 的 configure 要求 pkg-config 模块 xmuu（PKG_CHECK_MODULES(XAUTH, x11 xau
      xext xmuu xproto)），而 ohpcd 制品仓没有 libxmu/libxmuu 任何版本
      （conan list "libxmu/*" -r ohpcd → Found 0）。xauth 全树只引用 Xmu 的
      一个符号 XmuGetHostname（parsedpy.c:76），它定义在 libXmu 的 src/GetHost.c。
      按 E277 vendored 依赖模式从官方 tarball 取真实源码就地编译成静态 libXmuu.a
      （不伪造符号桩、不手写等价实现），随包静态携带。
    source_url: "https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.3.1.tar.xz"
    source_sha256: "81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4"
    files_compiled: ["src/GetHost.c"]
    headers_used: ["include/X11/Xmu/SysUtil.h"]
    notes: "GetHost.c 的 config.h 引入被 #ifdef HAVE_CONFIG_H 守卫，无需 libXmu 的 configure；非 WIN32 分支不 include 任何私有无。其余 4 个 libXmuu 源文件（ClientWin/CursorName/DefErrMsg/Lower）xauth 一个符号都不用，多编会引入 DefErrMsg.c 对 libX11 私有头 <X11/Xlibint.h> 的依赖。"

patches_applied:
  - file: "patches/0001-tests-ignore-locks-on-ohos.patch"
    type: portability
    platform_only: true
    targets: ["tests/setup-sourced（上游自带测试驱动，非产品源码、非夹具）"]
    description: >
      OHOS 的 HMDFS 不支持硬链接，而 libXau 的 XauLockAuth()（libXau-1.0.12/AuLock.c）
      加锁走 open("<auth>-c", O_CREAT|O_EXCL) + link("<auth>-c","<auth>-l")：link() 在
      HMDFS 上必失败（errno 既非 ENOENT 也非 EEXIST）⇒ 首次调用 LOCK_ERROR，且
      "<auth>-c" 残留 ⇒ 之后每次调用都撞 O_EXCL 的 EEXIST，睡满 10×2s 后 LOCK_TIMEOUT。
      xauth 于是在写授权文件之前就退出，5 个场景的输出全为空 ⇒ 全体 FAIL（CI #62169 实测
      stderr 为 "error/timeout in locking authority file …"，040-source 的 exits 实测 1
      期望 0）。libXau 自带的 pathconf(_PC_LINK_MAX)==1 兜底分支不触发——musl 的
      pathconf 对该项恒返回 _POSIX_LINK_MAX(8)。补丁只给 tests/setup-sourced 里两条
      真实执行的调用行加上游自己的逃生口 -i（xauth(1): "ignore locks on authority
      file"；xauth.c:129 置 ignore_locks，process.c:753 据此跳过整个 XauLockAuth()）；
      `echo "> xauth" "$@"` 那行保持原样，与 .stdout/.stderr 夹具逐字节比对不受影响。


