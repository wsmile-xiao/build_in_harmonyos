# conandata.yml — xauth 1.1.4
# 源码: X.Org 官方发布归档 (https://xorg.freedesktop.org/archive/individual/app/)

sources:
  # 主程序 xauth
  xauth:
    url: "https://xorg.freedesktop.org/archive/individual/app/xauth-1.1.4.tar.xz"
    sha256: "e9318141464ad7b4dc0f8564a580f0d20f977c85a388cc40d5a766206151c690"
  # xauth 的 configure 用
  #   PKG_CHECK_MODULES(XAUTH, x11 xau xext xmuu xproto >= 7.0.17)
  # 声明依赖，其中 xmuu 由 libXmu 的**子库** libXmuu 提供（上游 libXmu 一次
  # 构建产出 libXmu.la + libXmuu.la 两条共享库，xmuu.pc 与 xmu.pc 并列发布）。
  # ohpcd 制品仓没有 libxmu/libxmuu 任何版本（conan list "libxmu/*" -r ohpcd
  # → Found 0），而 xauth 只用到 libXmuu 里的一个符号 XmuGetHostname
  # （parsedpy.c:76），因此按 E277 vendored 依赖模式，从官方 tarball 取出该
  # 子库的真实源码就地编译成静态库随包携带（同 xeyes 内建 libICE/libSM/libXt）。
  # 不伪造符号桩：libXmuu 的源码本体即上游产物，sha256 为官方发布值。
  libxmu:
    url: "https://xorg.freedesktop.org/archive/individual/lib/libXmu-1.3.1.tar.xz"
    sha256: "81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4"

patches:
  # 只改**上游自带的测试驱动脚本**（tests/setup-sourced 里两条真实的 `../xauth`
  # 调用行加 -i），不改任何产品源码，也不改被断言的 echo 行（.stdout/.stderr
  # 夹具逐字节比对必须保持不变）。根因见 notes.md「HMDFS 不支持硬链接」一节。
  - patch_file: "patches/0001-tests-ignore-locks-on-ohos.patch"
    patch_description: "OHOS HMDFS 不支持硬链接，libXau 的 XauLockAuth() 必然失败（error/timeout in locking），xauth 在写授权文件前就退出，5 个场景集体 FAIL；上游自带逃生口 xauth -i（ignore locks on authority file）可绕过，测试驱动里两条真实调用加 -i"
    patch_type: "portability"
