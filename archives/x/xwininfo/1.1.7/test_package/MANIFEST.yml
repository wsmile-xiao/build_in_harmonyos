# Upstream test inventory and HarmonyOS consumer-test declaration.

package: xwininfo/1.1.7
homepage: "https://gitlab.freedesktop.org/xorg/app/xwininfo"

upstream_tests_exist: false
upstream_test_audit:
  - source: "Makefile.am"
    reason: "Only the man subdirectory and xwininfo binary are registered; no TESTS, check_PROGRAMS, or check-local entries exist."
  - source: "meson.build"
    reason: "Defines the executable and generated man page but contains no test() registration."
  - source: "release source tree"
    reason: "No tests/ or test/ directory and no upstream test sources are present."
  - conclusion: "The tagged 1.1.7 source registers 0 upstream test cases. The recipe runs the generated Automake make check target, which has no registered tests."

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (0 registered cases)"
upstream_tests: []

test_package_tests:
  - file: "test_xwininfo.sh"
    description: "Run the packaged HarmonyOS ELF and verify its help output."
    command: "xwininfo --help"
  - file: "test_xwininfo.sh"
    description: "Run the packaged HarmonyOS ELF and verify its exact version output."
    command: "xwininfo --version"
  - file: "test_xwininfo.sh"
    description: "Run the read-only -root query with DISPLAY unset; validate either the returned root-window report or the upstream open-display / empty-display-parse diagnostic."
    command: "xwininfo -root"

assertion_count: 3

not_covered:
  - "Detailed window-tree, property, and shape reports require an X server; this test only performs the root query if the HarmonyOS device provides a reachable display."
