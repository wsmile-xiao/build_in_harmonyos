software: xf86-video-r128
version: "6.13.0"
status: built
build_date: "2026-09-17"
build_system: autotools

source:
  url: "https://xorg.freedesktop.org/archive/individual/driver/xf86-video-r128-6.13.0.tar.gz"
  sha256: "0cc8fb5be66bb503343b3fd3866e23e6f322d14901f9d5d7f375029f906dc178"
  tar_format: tar.gz

build:
  system: autotools
  configure_options: "--disable-dri --disable-exa"
  dependencies:
    - "xorgproto/2025.1"
    - "pixman/0.46.4.3"
    - "libpciaccess/0.19"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-src-r128_driver.c.patch"

knowledge_gained:
  - "E007: config.guess/config.sub 需要添加 HarmonyOS 平台检测"
  - "E046: HMDFS 上 umask 077 + mktemp 创建的目录不可写"
  - "OHOS xf86int10.h 是 stub，需 #ifdef __OHOS__ 守卫跳过 Int10 BIOS 读取"
  - "OHOS xorg-server 不支持 DRI 和 EXA，必须用 --disable-dri --disable-exa"
  - "xorg-server 无 conan 包（仅 cmd-pkg Xvfb 二进制），驱动编译所需 SDK 头从官方源码包提取并合成 xorg-server.pc/生成头（扁平 sdkdir 布局）"
  - "tarfile.open 必须用 mode='r:*'：x.org 发布 .tar.xz，r:gz 会报 not a gzip file（CI 卡点根因）"
  - "PkgConfigDeps 生成的文件名取 conan 包名（libpciaccess.pc），上游 configure 探测 pciaccess.pc，需在 generators 目录补别名"

conan_recipe:
  status: built
  dependencies_available: complete
