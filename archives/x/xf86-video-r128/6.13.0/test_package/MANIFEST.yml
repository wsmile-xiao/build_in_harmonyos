# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: xf86-video-r128/6.13.0
homepage: "https://xorg.freedesktop.org/"

# 上游测试命令
upstream_check_command: "make check"

# X.Org driver projects do not include a test suite
# (make check: "Nothing to be done for 'check'")
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无 — X driver 项目无自测)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Verify r128_drv.so exists, is ELF64 ET_DYN and exports r128ModuleData"
    command: "bash test.sh <package_root>"

# 测试断言总数 (found module / valid ELF64 ET_DYN / module entry point)
assertion_count: 3
