software: xf86-video-r128
display: "ATI Rage 128 Xorg Video Driver"
description: "Xorg video driver for ATI Rage 128 (R128) series GPUs"
category: gfx
homepage: "https://xorg.freedesktop.org/"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "OHOS 不支持 DRI/EXA，必须 --disable-dri --disable-exa"
    - "xf86int10.h 是 stub，不定义 BIOSseg/xf86int10Addr"
    - "HMDFS umask 077 + mktemp 创建临时目录不可写"
    - "config.guess/config.sub 需要添加 HarmonyOS 平台检测"

versions:
