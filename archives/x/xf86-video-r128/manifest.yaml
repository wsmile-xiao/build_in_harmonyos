    - "HMDFS umask 077 + mktemp 创建临时目录不可写"
    - "config.guess/config.sub 需要添加 HarmonyOS 平台检测"
    - "xorg-server 无 conan 包，SDK 头从官方源码包提取（扁平 sdkdir）+ 合成 xorg-server.pc"

