# 本地 manifest
# 路径: archives/x/xfpt/1.00/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ==============================
# 基本信息
# ==============================

# 版本
version: "1.00"

# 软件名
software: "xfpt"

# 构建系统
build_system: autotools
build_subdir: ""

# 构建状态
# published | built | failed | archived
status: built

# 构建日期（YYYY-MM-DD）
build_date: "2026-09-11"

# ==============================
# 源码部分
# ==============================

source:
  # 源码下载 URL（官方 tag 归档；上游 release 页无 asset）
  url: "https://github.com/PhilipHazel/xfpt/archive/refs/tags/xfpt-1.00.tar.gz"

  # 源码哈希
  sha256: "64cb7ada103ad42849a91f98df1aaa02573dc0784eb2d325f25cba07bc065ff4"

  # 压缩格式
  tar_format: tar.gz

# ==============================
# 构建部分
# ==============================

build:
  # 构建系统名称
  system: autotools

  # 配置参数
  configure_options:
    - "CC=clang (from tools.build:compiler_executables)"
    - "CFLAGS=-O2 -fPIC"

  # 依赖（xfpt 1.00 纯 C，无外部依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ==============================
# 安装部分
# ==============================

# 已应用的补丁
patches_applied: []

# ==============================
# 知识部分
# ==============================

# 构建期间获得的知识
knowledge_gained:
  - "xfpt 1.00 is pure C with zero external dependencies (PCRE was dropped before 1.00)"
  - "Upstream configure has no AC_CANONICAL_HOST: do not pass --host, pass CC/CFLAGS instead"
  - "make install has no DESTDIR support; configure with --prefix=<stage> then make install"
  - "Upstream test harness (testing/runtest) is Perl-based; requires perl on the build host"
