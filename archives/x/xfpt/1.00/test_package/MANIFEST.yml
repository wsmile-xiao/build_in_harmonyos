# test_package/MANIFEST.yml
# xfpt upstream ships a Perl-based test harness (testing/runtest):
# 9 input cases in testing/infiles with expected outputs in testing/outfiles,
# plus a command-line flag check against testing/outfiles/cmd.err.
package: xfpt/1.00
homepage: "https://github.com/PhilipHazel/xfpt"

# Upstream test command (requires perl; verified on OHOS device in W5: 7/7 pass)
upstream_check_command: "cd testing && perl runtest"
upstream_test_in_build: true  # build() runs runtest when perl is present (OHOS device: 7/7 pass)
upstream_test_command: "cd testing && perl runtest"

# Upstream test cases (testing/infiles): 01 02 02.inc 03 04 05 06
# + 2 .inc include files; harness also checks command-line flags vs cmd.err
upstream_tests:
  - file: testing/runtest
    description: "Perl harness: converts testing/infiles/* and diffs against testing/outfiles/*; also checks command-line flags stderr against outfiles/cmd.err"

# test_package smoke tests (consumer-side verification)
test_package_tests:
  - file: test_xfpt.sh
    description: "Smoke test: binary present, --version, -help usage, missing-input error path, DocBook conversion using packaged share data via -S, two-input rejection"
    command: 'XFPT_BIN=xfpt XFPT_SHARE=<pkg>/share/xfpt bash test_xfpt.sh'

# Approximate assertion count
assertion_count: 8
