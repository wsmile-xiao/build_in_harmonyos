# 软件级 manifest
# 文件位置: archives/x/xfpt/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: xfpt
display: "xfpt (plain text to XML processor)"
description: "Converts marked-up UTF-8 plain text into XML, typically DocBook"
category: doc
homepage: "https://github.com/PhilipHazel/xfpt"
license: "GPL-2.0-only"

build_system: autotools

ohos_adaptation:
  key_points:
    - "Pure C, no external dependencies (libc only); PCRE dependency dropped upstream before 1.00"
    - "Upstream configure has no AC_CANONICAL_HOST: never pass --host, pass CC/CFLAGS as assignments"
    - "make install lacks DESTDIR support: configure --prefix=<staging> then make install"
    - "Invoke configure via 'sh ./configure' to avoid exec-permission issues on HMDFS (E087)"
    - "Upstream test harness testing/runtest requires perl; skip with note when absent"
    - "ELF signing required on OHOS for binary execution"
  common_dependencies: []

versions:
  "1.00":
    status: built
    build_date: "2026-09-11"
