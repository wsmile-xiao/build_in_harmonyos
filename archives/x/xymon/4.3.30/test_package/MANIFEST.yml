# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求此文件存在）
#
# 清点结论（xymon 4.3.30 上游源码包，见 conandata.yml 的 source 归档）：
#   * 无 tests/ 或 test/ 目录（`tar tzf xymon-4.3.30.tar.gz | grep -E '/tests?/'` 命中 0 条）
#   * 无 check: / test: 单元测试目标（对全部 Makefile 逐一扫描 `^test[a-z0-9._-]*:`）
#   * 唯一的 test 类目标是 build/Makefile.test-*，它们是 configure 阶段的
#     特性探测（编译+链接+运行一个小程序），不是测试套件：
#       build/test-pcre.c / test-ssl.c / test-ssl2.c / test-ssl3.c / test-rrd.c
#       test-ldap.c / test-lber.c / test-cares.c / test-lfs.c / test-shutdown.c
#       test-clockgettime-librt.c / test-pathmax.c / test-rpcenth.c ...
#   * lib/test-endianness.c 同样是构建期探测（编译后立即执行），非单元测试。
#   结论：上游确无单元测试套件，本文件附清点证据。

package: xymon/4.3.30
homepage: "https://xymon.sourceforge.net/"

# 上游测试命令（若上游存在单元测试套件则填 `make check`；本包确无）
upstream_check_command: ""

# conanfile.py 的 build() 是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的“测试”程序 —— 全部为 configure 构建期特性探测，非测试套件
upstream_tests:
  - file: build/test-pcre.c
    source: xymon-4.3.30/build/test-pcre.c
    description: "configure 探测：libpcre 编译+链接可行性（非单元测试）"
    command: "make -f build/Makefile.test-pcre test-link"
  - file: build/test-ssl.c
    source: xymon-4.3.30/build/test-ssl.c
    description: "configure 探测：OpenSSL 编译+链接可行性（非单元测试）"
    command: "make -f build/Makefile.test-ssl test-link"
  - file: build/test-rrd.c
    source: xymon-4.3.30/build/test-rrd.c
    description: "configure 探测：rrdtool 编译+链接可行性（非单元测试）"
    command: "make -f build/Makefile.test-rrd test-link"
  - file: lib/test-endianness.c
    source: xymon-4.3.30/lib/test-endianness.c
    description: "构建期探测：编译并运行以判定主机字节序；交叉编译下不可运行，已在配方中固定为小端"
    command: "./lib/test-endianness"

# test_package 自带的消费者测试（调用已安装二进制，消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "消费者测试：在 conanrun 环境下运行已安装的 xymon/bbcmd/xymondigest（含 OHOS 端到端运行验证），并核查顶层 bin/、client/bin/、server/bin/ 三个二进制树（xymond_rrd、clientupdate）均在包内"
    command: "bash test.sh"

# 测试断言总数（本包消费者测试未使用 assert()，全部为显式比较 + 退出码）
assertion_count: 0
