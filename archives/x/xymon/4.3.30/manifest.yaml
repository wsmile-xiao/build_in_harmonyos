# 版本级 manifest — xymon 4.3.30 (HarmonyOS PC 适配)
# 文件位置: archives/x/xymon/4.3.30/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "4.3.30"
software: xymon
status: built
build_date: "2026-10-11"
build_system: custom
conan_ref: "xymon/4.3.30"

source:
  url: "https://sourceforge.net/projects/xymon/files/Xymon/4.3.30/xymon-4.3.30.tar.gz"
  sha256: "8ed51771c8e1e15df96725072c61a21286ab0e6105a0e1edac956225201bf5f5"
  tar_format: tar.gz

build:
  # xymon 自带 configure.server（非 autoconf）驱动 build/Makefile.* 的 make 构建
  system: custom
  configure_options:
    - "--server"
    - "--fping xymonping"
    - "--pcreinclude <pcre>/include --pcrelib <pcre>/lib"
    - "--sslinclude <openssl>/include --ssllib <openssl>/lib"
    - "--caresinclude <c-ares>/include --careslib <c-ares>/lib"
    - "--ldapinclude <openldap>/include --ldaplib <openldap>/lib"
    - "--rrdinclude <rrdtool>/include --rrdlib <rrdtool>/lib"
  dependencies:
    - "zlib/1.3.1.1"
    - "pcre/8.45"
    - "libtirpc/1.3.7"
    - "openssl/3.5.8.1"
    - "c-ares/1.34.6"
    - "openldap/2.6.7"
    - "rrdtool/1.9.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "xymon 的 configure 是交互式 shell 脚本（configure.server），非 autoconf；用 stdin 重定向喂入默认答案即可非交互完成配置"
  - "OHOS 不支持 shebang 直接执行，build/*.sh 与 configure/configure.server 必须显式用 bash 调用，并删掉首行 #!/bin/sh"
  - "xymon 用 `uname -s` 选择 build/Makefile.<平台>；OHOS 下须把平台判定钉死为 build/Makefile.Linux"
  - "OHOS libc 无 getrpcbyname()，xymonnet.c 通过 #ifdef OHOS 宏替换为本地 return NULL 的桩实现"
  - "libtirpc 的头文件位于 <tirpc/rpc/rpc.h>，需为 xymonnet 追加 -I<libtirpc>/include/tirpc"
  - "build/Makefile 的 merge-lines/merge-sects/setup-newfiles/renamevars/renametasks 是编译出的 ELF 辅助工具（all: $(TOOLS)），make install 会直接调用；删除其编译规则会导致安装失败"
  - "build/Makefile.Linux 在未定义 PKGBUILD 时会设置 RPATH = -Wl,--rpath,（rpath 为空）——空 rpath 会把紧随其后的目标文件当成 rpath 参数吞掉，造成链接期 undefined symbol；须在 include build/Makefile.rules 之前注入 PKGBUILD=yes 与 RPATH=/RPATHOPT="
  - "交叉编译场景下 lfs.sh / lib/test-endianness.c / build/test-*.c 这类“编译后立刻运行”的探测程序无法执行，须跳过并把结论（大端/小端、PATH_MAX、SHUT_* 等）直接写入 include/config.h 和 lib/Makefile"
  - "rrdtool 1.9 的 rrd_graph() 已改为 8 参数 API，必须定义 RRDTOOL12，否则 web/showgraph.c 报 too few arguments"
  - "上游 tarball 内 31 个符号链接全部集中在 xymond/webfiles/*_footer；HMDFS 上符号链接创建不可靠，提取时须物化为普通文件"
  - "Conan 缓存位于 HMDFS（FUSE）时，构建进程树内**无法解析符号链接**：os.path.isfile('libfoo.so') 对 libfoo.so -> libfoo.so.X.Y.Z 返回 False，ld.lld 随即报 'unable to find library -lfoo' 而库其实存在；openldap/rrdtool 是动态库（其余依赖为静态 .a），须在链接前把依赖 lib 目录**不经过符号链接**地物化——只复制版本号真实文件，并由其自行合成 libfoo.so 别名，再 -L 该目录"
