software: 4ti2
display: "4ti2"
description: "A software package for algebraic, geometric and combinatorial problems on linear spaces"
category: science
homepage: "https://4ti2.de/"
license: GPL-2.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - "OHOS: config.guess cannot recognize OHOS, need --build/--host=aarch64-unknown-linux-musl"
    - "OHOS: config.status uses mktemp -d with umask 077 creating setgid dirs without group-execute. Patch to use mkdir."
    - "OHOS: test scripts have #!/bin/bash, bash at /data/service/hnp/bin/bash. Patch test/*.in templates BEFORE configure (configure generates the runnable scripts)."
    - "OHOS: CONFIG_SHELL=/data/service/hnp/bin/bash for configure"
    - "Depends on GMP (C++ interface) and GLPK from conan"
versions:
  "1.6.10":
    status: built
    build_date: "2026-09-17"
    packaging: conan
    notes: "conan recipe (os=OHOS arch=armv8), deps glpk/5.0 + gmp/6.3.0; autotools build; fixes config.status mktemp + /bin/bash shebang"
    dependencies:
      - glpk/5.0
      - gmp/6.3.0
