version: "1.6.10"
software: "4ti2"
status: built
build_date: "2026-09-17"
build_system: "autotools"
source:
  url: "https://github.com/4ti2/4ti2/releases/download/Release_1_6_10/4ti2-1.6.10.tar.gz"
  sha256: "f7c191beb14246b643e4fd5b18b53d9966693b9e6d3a569441a0e3ca14b1a86b"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--with-gmp=<gmp_pkg>"
    - "--with-glpk=<glpk_pkg>"
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"
  dependencies:
    - glpk/5.0
    - gmp/6.3.0
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "OHOS: config.guess cannot recognize OHOS, pass --build/--host=aarch64-unknown-linux-musl"
  - "OHOS: config.status mktemp -d with umask 077 creates setgid dirs without group-execute. Patch to use mkdir."
  - "OHOS: test scripts use #!/bin/bash but bash is at /data/service/hnp/bin/bash. Patch test/*.in templates BEFORE configure (configure generates the runnable scripts)."
  - "OHOS: CONFIG_SHELL must be set to /data/service/hnp/bin/bash"
