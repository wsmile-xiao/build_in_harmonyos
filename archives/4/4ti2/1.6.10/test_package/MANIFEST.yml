package: 4ti2/1.6.10
homepage: "https://4ti2.de/"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check -k (OHOS real device, 2026-09-17)"
upstream_tests:
  - file: test/qsolve/api/qsolve_main.cpp
    source: 4ti2-1.6.10/test/qsolve/api/qsolve_main.cpp
    description: "qsolve C API reference test (INT_64, verifies 4x3 qhom matrix)"
    result: "PASS (exit 0, run directly; automake check-TESTS blocked by unrelated gmpxx compile error)"
  - file: test/qsolve/api/rays_main.cpp
    source: 4ti2-1.6.10/test/qsolve/api/rays_main.cpp
    description: "rays C API test"
    result: "PASS (exit 0, run directly)"
  - file: test/qsolve/api/circuits_main.cpp
    source: 4ti2-1.6.10/test/qsolve/api/circuits_main.cpp
    description: "circuits C API test"
    result: "PASS (exit 0, run directly)"
  - file: test/zsolve/api/test_zsolve_api.cpp
    source: 4ti2-1.6.10/test/zsolve/api/test_zsolve_api.cpp
    description: "zsolve C API test (automake TESTS)"
    result: "PASS (1/1, automake summary)"
  - file: test/check.template.in
    source: 4ti2-1.6.10/test/check.template.in
    description: "Main CLI test driver (configure generates check.template); 185 .chk cases expanded to 235 tool invocations across 16 tool dirs"
    result: "231/235 passed (98.3%); 4 failed: walk -p arb {344,cuww1,grin,prob20} — conan gmp/6.3.0 ships C API only (no gmpxx.h), so the 4ti2gmp arbitrary-precision executable is not built; error: Unable to find 4ti2 executable '4ti2gmp'"
  - file: test/qsolve/api/test_input_conversion_gmp.cpp
    source: 4ti2-1.6.10/test/qsolve/api/test_input_conversion_gmp.cpp
    description: "GMP input conversion API tests (2 programs)"
    result: "NOT BUILT — requires gmpxx.h which conan gmp/6.3.0 does not ship (same root cause as walk -p arb failures)"
test_package_tests:
  - file: test.c
    description: "qsolve C API test mirroring upstream test/qsolve/api/qsolve_main.cpp: builds mat/rel/sign matrices, computes, verifies 4x3 qhom matrix (rows/cols/12 entries)"
    command: "./test_probe"
  - file: conanfile.py
    description: "Compiles test.c against installed 4ti2 headers + static libs, runs test_probe, then executes packaged gensymm CLI binary"
    command: "gensymm 3 3 3 1 333"
assertion_count: 21
# 计数口径：test.c 全部 return 1 失败分支（8 个前置 API/NULL 检查 + rows/cols
# 维度 + 12 个矩阵元素比较 = 20）+ gensymm CLI 执行 1 = 21
