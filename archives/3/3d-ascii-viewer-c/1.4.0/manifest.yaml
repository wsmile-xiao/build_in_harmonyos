# 版本级 manifest — 3d-ascii-viewer-c 1.4.0

version: "1.4.0"

software: "3d-ascii-viewer-c"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期
build_date: "2026-09-24"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag v1.4.0）
  url: "https://github.com/autopawn/3d-ascii-viewer-c/archive/refs/tags/v1.4.0.tar.gz"

  # 源码校验和（与 conandata.yml 一致）
  sha256: "c390cbd4c80f6a7c5bdd9cab02174aaa8d63c0eeb18134deb8ed85463395d81c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：原始 Makefile（非 autotools，无 configure 脚本）
  system: makefile

  # 配置选项列表
  configure_options: []
  # 无 configure；直接 make，覆盖 CC/CFLAGS/LDFLAGS

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ncurses/6.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "原始 Makefile 项目（CC := gcc 硬编码）需在 build() 中以 make CC=<conan conf 编译器> 覆盖，R33 禁止裸 shell 变量"
  - "上游链接 -lncurses 但制品仓 ncurses/6.4 只提供 libncursesw.a，链接需改 -lncursesw（头文件仍为 ncurses.h）"
  - "CLI 运行需 TERM/TERMINFO 环境（ncurses initscr 探测屏幕尺寸），--snap 单帧渲染为非交互验证入口"