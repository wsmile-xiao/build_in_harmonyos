# test_package/MANIFEST.yml — 3d-ascii-viewer-c 1.4.0
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）

package: 3d-ascii-viewer-c/1.4.0
homepage: "https://github.com/autopawn/3d-ascii-viewer-c"

# 上游测试命令（上游为原始 Makefile 项目，无 configure/ctest/meson 测试注册）
upstream_check_command: "make"   # 上游仅提供 make 编译，无 make check / ctest -N 测试入口

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：上游无独立测试用例，只有样例模型数据（models/）供运行验证
upstream_tests: []

# test_package 中自带的测试（消费者视角验证 CLI；L0c 测试源文件）
test_package_tests:
  - file: smoke_test.sh
    description: "L0c 测试源：真实调用 CLI 公开行为并断言——--snap 渲染 fox.obj 输出非空帧(rc=0)；--help 输出含 Usage 与 --snap 说明"
    command: "sh smoke_test.sh <exe> <model/fox.obj>"
    executed_by: "test_package/conanfile.py test() 通过 self.run 执行（L0d）"

# 测试断言总数（上游无断言；test_package 2 项断言）
assertion_count: 2
