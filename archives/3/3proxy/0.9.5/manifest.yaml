# 版本级 manifest - 3proxy 0.9.5
version: "0.9.5"
software: "3proxy"
status: built
build_date: "2026-10-08"
build_system: "makefile"

source:
  url: "https://codeload.github.com/3proxy/3proxy/tar.gz/refs/tags/0.9.5"
  sha256: "6f6da51d9bba93231e12acd707bb6cf86a1ab9491dc6dd0c79750cb3641541a3"
