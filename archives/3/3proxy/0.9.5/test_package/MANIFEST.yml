# test_package/MANIFEST.yml
# 3proxy 0.9.5 上游测试声明
# 上游 Makefile 家族（Makefile.Linux/FreeBSD/Solaris/unix/win/msvc/watcom 等 18 个变体）
# 没有 check / test 目标，也没有独立 tests/ 目录；上游仓库不含 .github CI。
# 因此这里如实登记为空，消费者侧验证放在 test_package_tests（2 条断言）。

package: 3proxy/0.9.5
homepage: "https://3proxy.org/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "消费者测试：调用已安装 3proxy 二进制，① 校验 -h 用法横幅含 3proxy-0.9.5；② 非特权端口起 HTTP 代理并真实建立 TCP 连接"
    command: "bash test.sh"

assertion_count: 2
