software: libmbim-tools
display: "libmbim-tools"
description: "libmbim 项目的 MBIM 命令行工具 (mbimcli / mbim-proxy / mbim-network)"
category: network
homepage: "https://www.freedesktop.org/wiki/Software/ModemManager/"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "same-source tools-only 包：libmbim 源码树同时构建库与工具，本包只交付 bin/ 工具（package_type=application），丢弃 lib/include/share/libexec"
    - "meson 构建；静态链入 libmbim-glib（-Ddefault_library=static）；meson 经 tool_requires(meson/1.11.0) 提供"
    - "禁用 bash_completion / introspection / man / gtk_doc / fuzzer（缺对应可选依赖）"
    - "E091: OHOS UAPI linux/socket.h 与 musl sys/socket.h 的 sockaddr_storage 冲突，用重命名宏守卫（无平台宏）"
    - "OHOS 未签名 ELF 无法执行：package() 内 binary-sign-tool 自签名 bin/ 下所有 ELF"
    - "依赖 glib 提供 glib-2.0/gio-2.0/gio-unix-2.0/gobject-2.0"
  common_dependencies:
    - glib/2.84.0.1

versions:
  "1.34.0":
    status: built
    build_date: "2026-09-24"
