knowledge_gained:
  - "libmbim-tools = libmbim 1.34.0 源码树的命令行工具（mbimcli/mbim-proxy/mbim-network）：same-source tools-only 包，package_type=application，静态链入 libmbim-glib 并丢弃 lib/include，软件级 commands.json 声明（R38）（ref: E424）"
  - "OHOS UAPI <linux/socket.h>（经 <linux/netlink.h>）与 libc <sys/socket.h> 均定义 struct sockaddr_storage 冲突；在包含内核头期间用重命名宏把 UAPI 结构体改名，包含后 #undef（不含平台宏，通用）（ref: E091）"
  - "OHOS 拒绝执行未签名 ELF（Operation not permitted / exit 126）：package() 内用 binary-sign-tool sign -selfSign 1 签名 bin/ 下所有 ELF，并校验 .codesign section 数=1（ref: E077）"
  - "worker PATH 无 meson：用 tool_requires(meson/1.11.0) 提供；并把 llvm-ar/llvm-ranlib/pkg-config 注入 MesonToolchain 生成的 conan_meson_native.ini [binaries]（ref: E296）"
  - "Conan PkgConfigDeps 不生成依赖包内的额外 .pc（glib 的 gio-unix-2.0.pc，配方未声明该组件）：须把依赖 lib/pkgconfig 加入 meson machine file 的 pkg_config_path 与 PKG_CONFIG_PATH，dependency('gio-unix-2.0') 才解析（ref: E429）"
  - "test_package 中 OHOS /system/bin/sh(mksh) 不能 exec ELF：须经 CONFIG_SHELL/bash 包裹执行被测二进制（mbimcli/mbim-proxy）（ref: E325）"

