# conandata.yml — libmbim-tools 1.34.0
#
# libmbim-tools is not an independent upstream project: this package delivers
# the command-line tools (mbimcli / mbim-proxy / mbim-network) built from the
# official libmbim 1.34.0 source tree (freedesktop GitLab, R39 official source).
#   upstream: gitlab.freedesktop.org mobile-broadband/libmbim
#   tag:      1.34.0 (released 2026-01-03), top-level dir libmbim-1.34.0/
#
# The tools are the same sources used by the libmbim-glib library package; the
# library/headers are dropped at packaging time (same-source tools-only package,
# cf. libimobiledevice-progs 1.4.0).

sources:
  url: "https://gitlab.freedesktop.org/mobile-broadband/libmbim/-/archive/1.34.0/libmbim-1.34.0.tar.gz"
  sha256: "55bb88df358f8a36b6e01e63877500d7c6420f5907d2d3101812b4912eabe08f"

patches:
  - patch_file: "patches/0001-src-libmbim-glib-mbim-helpers-netlink.c.patch"
    patch_description: "E091: rename the Linux UAPI struct sockaddr_storage while <linux/netlink.h> is processed so it no longer clashes with the C library <sys/socket.h> definition"
    patch_type: "portability"
  - patch_file: "patches/0002-src-libmbim-glib-mbim-net-port-manager-wdm.c.patch"
    patch_description: "E091: same sockaddr_storage UAPI/C-library guard for the WDM net port manager"
    patch_type: "portability"
  - patch_file: "patches/0003-src-libmbim-glib-mbim-net-port-manager-wwan.c.patch"
    patch_description: "E091: same sockaddr_storage UAPI/C-library guard for the WWAN net port manager"
    patch_type: "portability"
  - patch_file: "patches/0004-src-libmbim-glib-mbim-net-port-manager.c.patch"
    patch_description: "E091: same sockaddr_storage UAPI/C-library guard for the generic net port manager"
    patch_type: "portability"
