# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点（R51 三步法，1.34.0 官方 release tarball 实核）：
#   meson 注册的测试单元共 9 个：
#     src/libmbim-glib/test/meson.build: uuid, cid, message, fragment,
#       message-fuzzer-samples, message-parser, message-builder, proxy-helpers
#       （8 个；message-fuzzer 由 -Dfuzzer=true 时才注册，本包 fuzzer=false）
#     src/mbimcli/tests/meson.build: quectel（1 个）
#   build() 内以 meson.test() 实际执行，9/9 通过后再进入 test_package。

package: libmbim-tools/1.34.0
homepage: "https://www.freedesktop.org/wiki/Software/ModemManager/"

# 上游测试命令（meson test --list 口径）
upstream_check_command: "meson test"

# conanfile.py build() 中已集成上游测试（meson.test()）
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序（meson 注册的 9 个测试单元）
upstream_tests:
  - file: src/libmbim-glib/test/test-uuid.c
    source: libmbim-1.34.0/src/libmbim-glib/test/test-uuid.c
    description: "MBIM UUID 编解码单元测试（meson 测试名 uuid）"
    command: "meson test uuid"
  - file: src/libmbim-glib/test/test-cid.c
    source: libmbim-1.34.0/src/libmbim-glib/test/test-cid.c
    description: "MBIM CID 映射单元测试（meson 测试名 cid）"
    command: "meson test cid"
  - file: src/libmbim-glib/test/test-message.c
    source: libmbim-1.34.0/src/libmbim-glib/test/test-message.c
    description: "MBIM 消息基础单元测试（meson 测试名 message）"
    command: "meson test message"
  - file: src/libmbim-glib/test/test-fragment.c
    source: libmbim-1.34.0/src/libmbim-glib/test/test-fragment.c
    description: "MBIM 分片/重组单元测试（meson 测试名 fragment）"
    command: "meson test fragment"
  - file: src/libmbim-glib/test/test-message-fuzzer-samples.c
    source: libmbim-1.34.0/src/libmbim-glib/test/test-message-fuzzer-samples.c
    description: "MBIM 消息解析 fuzz 语料回归（meson 测试名 message-fuzzer-samples）"
    command: "meson test message-fuzzer-samples"
  - file: src/libmbim-glib/test/test-message-parser.c
    source: libmbim-1.34.0/src/libmbim-glib/test/test-message-parser.c
    description: "MBIM 消息解析器单元测试（meson 测试名 message-parser）"
    command: "meson test message-parser"
  - file: src/libmbim-glib/test/test-message-builder.c
    source: libmbim-1.34.0/src/libmbim-glib/test/test-message-builder.c
    description: "MBIM 消息构造器单元测试（meson 测试名 message-builder）"
    command: "meson test message-builder"
  - file: src/libmbim-glib/test/test-proxy-helpers.c
    source: libmbim-1.34.0/src/libmbim-glib/test/test-proxy-helpers.c
    description: "MBIM proxy 辅助逻辑单元测试（meson 测试名 proxy-helpers）"
    command: "meson test proxy-helpers"
  - file: src/mbimcli/tests/test-quectel.c
    source: libmbim-1.34.0/src/mbimcli/tests/test-quectel.c
    description: "mbimcli Quectel 插件单元测试（meson 测试名 quectel）"
    command: "meson test quectel"

# test_package 中自带的消费者测试（鸿蒙特有测试）
test_package_tests:
  - file: test.sh
    description: "完整消费者用例（device-free 端到端功能流）：mbimcli --printable 解码一条完整 MBIM_OPEN 报文并断言报文头/类型/内容字段（Header:/0x00000001/max control transfer = 4096），另含负向校验（非法报文被拒）；冒烟：mbimcli --version、mbim-proxy --version 输出含 1.34.0，mbimcli --help 输出 usage（conanrun env，经 bash 包裹）"
    command: "bash test.sh (conanrun env)"

# 断言计数
upstream_assertion_count: 9
# 计数口径：上游 meson 测试单元 9 个（见上方 upstream_tests）
consumer_assertion_count: 7
# 计数口径：test_package/test.sh 消费者断言 7 处 ——
#   mbimcli --version 1 + mbim-proxy --version 1 + mbimcli --help 1
#   + mbimcli --printable 报文解码 3 处字段断言 + 非法报文否定 1
assertion_count: 16
# 合计 = 上游 9 + 鸿蒙特有测试 7
