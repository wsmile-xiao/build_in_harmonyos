software: libshrinkwrap
display: "shrinkwrap (libshrinkwrap)"
description: "Header-only C++11 std::streambuf wrappers for xz, gzip, zstd and BGZF compressed streams with seeking and format auto-detection"
category: compress
homepage: "https://github.com/jonathonl/shrinkwrap"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only：无编译产物，package_id 与平台无关"
    - "上游裸 find_library 依赖经 CMAKE_LIBRARY_PATH 注入 Conan 依赖包目录"
    - "上游 install(EXPORT) 烧录绝对路径，消费接口改由 cpp_info/CMakeDeps 提供"
  common_dependencies:
    - xz
    - zlib
    - zstd

versions:
  "1.2.0":
    status: built            # 本机前置 + 真机 shadow CI 通过（2026-09-27）
    build_date: "2026-09-27"
    format: conan
    note: "header-library 配方；零补丁；上游 11 个 ctest 用例真机 11/11 通过，消费者测试 23/23"
