package: libshrinkwrap
version: "1.2.0"
software: libshrinkwrap
homepage: "https://github.com/jonathonl/shrinkwrap"
license: MIT
status: built
build_system: cmake
build_date: "2026-09-27"

source:
  url: "https://github.com/jonathonl/shrinkwrap/archive/refs/tags/v1.2.0.tar.gz"
  sha256: "aa15583079c3dfccb118cf36fae9bc6353920b99d0204a9e349dad027b531286"
  tar_format: tar.gz
  notes: >
    上游 tag 为 v1.2.0（带 v 前缀），解出目录 shrinkwrap-1.2.0，配方用
    strip_root=True 拉平。SHA256 由本机下载实测复核。

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies:
    - "xz/5.8.3.2"
    - "zlib/1.3.2.1"
    - "zstd/1.5.7.1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libshrinkwrap（上游仓库名 shrinkwrap）1.2.0 是 header-only C++11 库：全部实现位于 include/shrinkwrap/*.hpp，CMake 侧为 INTERFACE target，add_library(shrinkwrap INTERFACE)。无编译产物，package_id 清空（self.info.clear()）。"
  - "Conan 2 强制校验：package_type='library' 必须声明 shared 选项，否则 conan create 直接报 'Package type is library, but no shared option declared'。header-only 库应使用 package_type='header-library'（ref: E283 shared 选项契约；仓库先例 7bitdi/ableton-link/ace-link）。真机 r2 实测命中。"
  - "上游 CMakeLists 用裸 find_library(lzma/z/zstd) 找系统库，而 Conan 依赖装在各自包目录。配方不改上游文件，在 generate() 把三个依赖的 cpp_info.libdirs 注入 CMAKE_LIBRARY_PATH，find_library 原样命中。"
  - "上游测试 TU 直接 #include <lzma.h>/<zlib.h>/<zstd.h>，但上游假设依赖经 cget 装入系统工具链路径、未给测试目标任何依赖 include 路径。把三个依赖包的 cpp_info.includedirs 经 CMakeToolchain extra_cxxflags 以 -I 注入即可，不改上游文件。真机 r2 实测 lzma.h not found → r3 通过。"
  - "上游 install(EXPORT) 会把构建机上 find_library 的绝对路径烧进 share/shrinkwrap/shrinkwrap-config.cmake，消费端不可复用。package() 只装头文件 + LICENSE，等价消费接口由 cpp_info（cmake_file_name=shrinkwrap, target=shrinkwrap::shrinkwrap）+ CMakeDeps 提供。"
  - "上游 cmake_minimum_required(VERSION 3.2)：CMake >= 4 直接拒绝。配方钉 CMAKE_POLICY_VERSION_MINIMUM=3.5（ref: DRAFT-lazperf vendored-gtest 同款先例；旧 CMake 忽略该变量，无害）。"
  - "上游测试可执行文件 shrinkwrap-test 把 scratch 文件写在进程 cwd（CTestTestfile.cmake 所在的 binary dir 根，位于 $HOME 下、可写），无 /var/tmp 依赖，E002 家族在此包不触发，无需补丁。"
  - "zstd::ibuf 的 seekoff 只支持 (0, cur)（即 tellg 返回当前块压缩偏移），不支持 (0, beg) 等方向定位；绝对定位必须走 seekg(pos) → seekpos（压缩块边界语义）。xz::ibuf 借 lzma index 支持 seekoff(beg/end) 任意未压缩定位；bgzf::ibuf 虚拟偏移 = (块压缩偏移<<16)|块内未压缩偏移，tellg/seekg 与缓冲无关。消费者测试按各自语义设计断言，不越界（真机实测：xz 两类 seek 通过、zstd seekg(0) 通过、bgzf 虚拟偏移精确断言通过）。"
  - "上游头文件使用 std::uint8_t/std::uint64_t 但不 include <cstdint>：libc++（OHOS）经 <array>/<vector>/<iostream> 传递引入所以能编译；libstdc++（g++ 13）直接失败（'uint8_t' is not a member of 'std'）。OHOS 适配不需要补丁；libstdc++ 环境验证用 g++ -include cstdint 绕过；根治可上游（5 个头文件各加 #include <cstdint>）。详见 knowledge/drafts/DRAFT-libshrinkwrap-1.2.0-headers-rely-on-transitive-cstdint-libcxx。"
  - "真机环境坑（ref: DRAFT-ohos-job-hmdfs-git-shim-exec-denied-use-hnp-bin）：隔离 job env.sh 把 $HOME/ohpc-ci-shadow/python-user/bin 放 PATH 首位，其 git shim 在 /storage（HMDFS）上无执行权，build_and_test.sh 的 G0e git ls-files 报 'permission denied: git'；job 本地 env.sh 把 /data/service/hnp/bin（非 HMDFS，git 2.45.2）前置即解。"
  - "generic shrinkwrap::istream 按首字节魔数探测：\\x1F→bgzf::ibuf（同时兼容普通 gzip，上游 generic-iter 即以此读 .gz）、\\xFD→xz、\\x28→zstd、其余→stdio filebuf。上游不支持拼接 xz 流（README 明示）。"

patch_generation:
  method: none
  patches_count: 0

upstream_tests:
  command: "ctest --output-on-failure"
  registrations: 11
  test_count: 33
  executed: 11
  not_executed: 0
  notes: >
    rule4 口径：ctest -N 注册 11 个用例（stdio-iter/stdio-seek、xz-seek/xz-iter、
    gz-iter、bgzf-seek/bgzf-iter、zstd-iter/zstd-seek、generic-iter/generic-seek），
    每个用例内部按 2048/512/1024 三种块大小链式执行 3 条子链，计 33 条。
    真机 OHOS aarch64 shadow CI（2026-09-27）：100% tests passed, 0 failed
    out of 11。另本机 Docker x86_64 ubuntu 24.04（g++ 13，libstdc++ 需
    -include cstdint 绕过上游缺失 include）原生亦 11/11。

test_package:
  assertion_count: 23
  description: >
    消费者测试 test_libshrinkwrap.cpp（C++11，链接 shrinkwrap::shrinkwrap）：
    五类格式 write→close→read 往返、stdio/xz token 级 seek、zstd seekg(0)
    全量重读、BGZF 多块虚拟偏移精确断言、generic istream 四种魔数探测；
    scratch 经 $TMPDIR→$HOME→cwd 解析（E002 家族语义验证）。

ci:
  profile: ci/conan/profiles/ohos-aarch64
  package_type: header-library
  shared_default: N/A
  shadow_ci: "pass (2026-09-27, L0/L1/L4 pass, L2 skip no bin/, L5 warn header-only 无 bin/lib 产物属预期)"
