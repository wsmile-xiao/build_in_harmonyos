# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法: 解压上游源码包 → cmake -DBUILD_TESTS=ON 配置 → ctest -N
#           （上游 src/test.cpp 每个子命令内部按 2048/512/1024 三种块大小链式执行）

package: libshrinkwrap/1.2.0
homepage: "https://github.com/jonathonl/shrinkwrap"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试（单测试程序 src/test.cpp，11 个 ctest 注册用例）
upstream_tests:
  - file: src/test.cpp
    source: shrinkwrap-1.2.0.tar.gz/src/test.cpp
    description: >
      11 个 ctest 注册用例：stdio-iter/stdio-seek、xz-seek/xz-iter、gz-iter、
      bgzf-seek/bgzf-iter、zstd-iter/zstd-seek、generic-iter/generic-seek；
      每个用例内部按 2048/512/1024 三种块大小链式执行 3 条子链（共 33 条），
      seek 链每条含 128 次随机定位读校验。scratch 文件写在进程 cwd（可写目录）。
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证, R34: 真实 include 并调用库 API)
test_package_tests:
  - file: test_libshrinkwrap.cpp
    description: >
      消费者视角 23 条断言：stdio/gz/xz/zstd/bgzf 写读往返（write→close→read），
      stdio/xz 的 token 级 seek（xz 含 seekg(-4, end)），zstd seekg(0) 全量重读
      （其 seekpos 为压缩块边界语义，深度 seek 语义由上游 zstd-seek 覆盖），
      BGZF 多块（每 100 token flush）虚拟偏移 tellg/seekg 精确断言，
      generic istream 对 gz/xz/zstd/bgzf 四种魔数的格式探测。
      scratch 路径按 $TMPDIR → $TMP → $TEMP → $HOME → cwd 解析（E002 家族，
      不写死 /var/tmp 或 /tmp）。
    command: "./test_libshrinkwrap"

# 鸿蒙特有测试条数 (rule12)
ohos_specific_tests: 1
ohos_specific_description: >
  scratch 目录解析：断言测试文件经 $TMPDIR（退回 $HOME、cwd）写入并可读回，
  不依赖 /var/tmp 或 /tmp——OHOS 根文件系统只读时上游把 scratch 写在
  Conan build 目录（$HOME 下）仍然成立，消费者测试再显式验证该语义。

# 测试数量口径（与 notes.md、PR 描述保持一致）
upstream_registered_test_count: 11
upstream_case_count: 33
test_package_assertion_count: 23
assertion_count: 56
