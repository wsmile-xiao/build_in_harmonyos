# 软件级 manifest.yaml - LDC（LLVM D Compiler）

name: ldc
description: LDC — LLVM D Compiler，D 语言的 LLVM 后端编译器工具链（含 druntime/Phobos 运行时）
website: https://dlang.org/
repository: https://github.com/ldc-developers/ldc
license: BSD-3-Clause AND BSL-1.0
category: compiler

# 版本索引
versions:
  1.42.0:
    status: built
    date: 2026-09-13
    description: >-
      D 语言编译器工具链（ldc2/ldmd2 + druntime + Phobos），AArch64，真机原生构建。
      基于 DMD 前端 v2.112.1 与 LLVM，依赖本仓 llvm 包。
    dependencies:
      - llvm/20.1.0
    # 自举引导编译器（非交付产物，仅构建期参与）
    bootstrap:
      url: "https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc2-1.42.0-alpine-aarch64.tar.xz"
      sha256: "5194dd0b1be75a13cb382736717a945f4bc8d42ae94faf8bd50fbc94d4bd32f7"
    notes: >-
      自举构建：设备/NDK 不带 D 编译器，须以构建期引导工具（上游预编译 ldc2）启动。
      OHOS 适配含两处运行时补丁（SIGRTMIN 不可达 → 改用 SIGUSR1/2；musl 缺
      pthread cancellation 家族 → 采用上游 no-op 分支），详见版本级 manifest 与 notes.md。
