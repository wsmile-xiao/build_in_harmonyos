sources:
  url: "https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc-1.42.0-src.tar.gz"
  sha256: "9bb0f628f869f7fc7b53c381a79742d29c17552c6f1a56b0a02aa289e65a0e3b"

# LDC 是自举编译器：其前端（dmd/ 下 109 个 .d 文件）必须由 D 编译器编译，
# 而设备与 NDK 均不提供任何 D 编译器（实测 ldc2/ldmd2/dmd/gdc/rdmd/dub 全无，
# 且 D 无法从 C/C++ 侧自举——LLVM 不含 D 前端）。故本包在构建期引入上游
# 预编译 ldc2 作「引导编译器」（bootstrap tool）。
#
# 变体选择：alpine(musl) 而非 linux(glibc)。OHOS 的 libc 是 musl 变体，
# alpine 变体同族；实测该二进制可在设备上运行（ldc2 --version 成功，
# 且能编译并运行使用了 std.stdio/std.algorithm/std.range 的 D 程序）。
#
# ⚠️ 该二进制不是交付产物，仅参与构建；且 OHOS 要求 ELF 代码签名，
#    使用前须经 binary-sign-tool 自签（否则 exec 报 Permission denied, rc=126）。
bootstrap:
  url: "https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc2-1.42.0-alpine-aarch64.tar.xz"
  sha256: "5194dd0b1be75a13cb382736717a945f4bc8d42ae94faf8bd50fbc94d4bd32f7"

# 本包 LDC_BUILD_RUNTIME=ON：连同 druntime/Phobos 一起构建，使 ldc2 开箱即可
# 编译并运行 D 程序（test_package 需真实执行，见 R34）。
patches:
  - patch_file: "patches/0001-ohos-thread-gc-signals.patch"
    patch_description: >-
      OHOS 线程层两处适配：① SIGRTMIN(35) 无法送达信号处理函数（实测自投递与跨线程
      投递均不触发，而 SIGRTMIN+1=36 与 SIGUSR1/2 正常），druntime 的 GC
      thread_suspendAll() 会因此永久阻塞；改用 SIGUSR1/SIGUSR2（同上游 OpenBSD
      分支既有做法）。② OHOS musl 不提供 pthread cancellation 家族
      (pthread_setcancelstate/setcanceltype/testcancel/cancel)，而 druntime
      core.thread.osthread 引用它导致链接失败；补 no-op 回退实现。
    patch_type: "portability"
