package: ldc/1.42.0
upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - file: test_ldc.sh
    description: >-
      R34 反空壳：真实编译并**实际运行**一个使用 druntime + Phobos 的 D 程序。
      ① ldc2 --version 自报版本（含所基于的 DMD 前端与 LLVM 版本）；
      ② ldc2 编译 hello.d（用到 std.stdio/std.algorithm/std.range/std.format/std.conv，
         即同时覆盖 druntime 与 Phobos）；
      ③ 对产物做 OHOS 代码签名（不签名会被内核拒绝 exec，报 Permission denied/rc=126）；
      ④ 真实执行二进制并断言 stdout 四行内容——证明排序、map、格式化、类型转换
         结果全部正确，而非仅"编译通过"。
      测试驱动为 shell 脚本（test_package/ 下须有 .sh/.c/.cpp/.py 类测试源文件，
      D 源码 hello.d 不在 CI 静态门禁的识别范围内），由 conanfile.py 的 test()
      经 self.run 调用。
    command: "sh test_ldc.sh <pkg>/bin/ldc2 test_package/"
assertion_count: 4
# 上游测试说明：LDC 自带 lit 测试套件（tests/ 下 codegen/semantic/linking 等 15 类），
# 以及 druntime/Phobos 的 unittest；但它们不是随 release tarball 的 `make check` 形态，
# 且需先由本包自身编译出运行时才能运行——本 test_package 只覆盖"编译器可用 + 运行时可用"
# 这条最小但真实的链路。上游测试的实测结果见 notes.md。
upstream_test_note: >-
  LDC 无 tarball 内可直接运行的测试套件入口；其 lit 测试与 druntime/Phobos unittest
  需要先有可用的 D 编译器才能跑，属"自举后"验证，不适合放在 test_package 内。
