software: ldc
version: "1.42.0"
build_system: cmake
status: built
source:
  url: "https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc-1.42.0-src.tar.gz"
  sha256: "9bb0f628f869f7fc7b53c381a79742d29c17552c6f1a56b0a02aa289e65a0e3b"
# 自举引导编译器（非交付产物，仅参与构建）：D 无法从 C/C++ 侧自举，
# 而设备/NDK 不带任何 D 编译器。选用 alpine(musl) 变体，与 OHOS 的 musl 同族。
bootstrap:
  url: "https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc2-1.42.0-alpine-aarch64.tar.xz"
  sha256: "5194dd0b1be75a13cb382736717a945f4bc8d42ae94faf8bd50fbc94d4bd32f7"
dependencies:
  - llvm/20.1.0
knowledge_gained:
  - "★ OHOS 无法把 SIGRTMIN(35) 送达信号处理函数：自投递与跨线程投递均不触发，而 SIGRTMIN+1(36)/37..40/SIGUSR1(10)/SIGUSR2(12) 正常，信号 32/33/34 的 sigaction 直接返回 EINVAL(22)。druntime 的 GC thread_suspendAll() 恰用 pthread_kill(t, SIGRTMIN) 停线程供扫描 → 永久阻塞 → 运行时死锁（多线程程序挂死、unittest 超时）。修复：改用 SIGUSR1/SIGUSR2，与上游为 OpenBSD 提供的分支同构"
  - "★ D 语言无法从 C/C++ 侧自举：LLVM 不含 D 前端，故自举 LDC 必须引入上游预编译 ldc2 作构建期引导工具；且 OHOS 要求该 ELF 先经 binary-sign-tool 自签，否则 exec 报 Permission denied(rc=126)"
  - "OHOS musl 不导出 pthread cancellation 家族（libc 1595 个导出符号中无 pthread_setcancelstate/setcanceltype/testcancel/cancel），而 druntime core.thread.osthread 引用它；D 侧 PTHREAD_CANCEL_DISABLE 为普通声明致 __traits(compiles) 恒真，故须直接采用上游同函数的 no-op 分支"
  - "LDC 1.42.0 在 OHOS 上不定义 OHOS 版本标识（实测仅 linux/Posix/CRuntime_Musl），故 druntime 补丁不能用 version(OHOS) 做条件编译"
  - "设备 uname=HarmonyOS：cmake 无 Platform/HarmonyOS.cmake、LLVM 的 config.guess 亦不识别，须 stub 覆盖（同 llvm/flang-ohos recipe 做法）"
  - "OHOS 上 /tmp 只读，cmake 与编译器需显式 TMPDIR 指向可写目录"
  - "上游 ldc-build-runtime 为动态链接，在 OHOS 缺 libgcc_s.so.1/_Unwind_* 而无法运行；本配方改用 LDC 自身 CMake 的 LDC_BUILD_RUNTIME=ON 内建运行时，绕开该工具"
