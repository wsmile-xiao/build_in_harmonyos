# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsais/2.10.4
homepage: "https://github.com/IlyaGrebnov/libsais"

# 上游 2.10.4 CMakeLists.txt 不定义 test target，仅构建库目标 libsais
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证真实 libsais 算法 API)
test_package_tests:
  - file: test.c
    description: "验证 libsais 算法 API: suffix array (libsais)、context 复用 (libsais_ctx)、BWT (libsais_bwt)、版本常量 — 以 'banana' 为输入校验输出"
    command: "./test_libsais"

# Consumer test 实际执行 25 个原子功能检查
assertion_count: 25
