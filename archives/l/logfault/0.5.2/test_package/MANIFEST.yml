# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: logfault/0.5.2
homepage: "https://github.com/jgaa/logfault"

# 上游测试命令（上游 CMake: cmake -DLOGFAULT_BUILD_TESTS=ON && cmake --build && ctest；
# 根 CMakeLists.txt require GTest，tests/ 下 2 个可执行各编一次）
upstream_check_command: "ctest --output-on-failure -V (配方 build() 内，上游 CMake 同口径)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "配方 build(): cmake.configure(LOGFAULT_BUILD_TESTS=ON) + cmake.build() + ctest --output-on-failure -V（G2/W3 每轮真跑）"

# 上游实际运行的测试程序（上游唯一测试面：gtest；同一源 default_to_clog.cpp
# 由 tests/CMakeLists.txt 驱动编译两次——裸变体与 LOGFAULT_USE_TID_AS_NAME=1 变体）
upstream_tests:
  - file: tests/default_to_clog.cpp
    source: logfault-0.5.2/tests/default_to_clog.cpp
    description: "gtest Logfault suite：5 条无条件 TEST + linux 门控 HelloTid。default_to_clog 注册 5 例、default_to_clog_with_tid 注册 6 例（__linux__ 在 OHOS 成立）合计 11 例；源码宏位 7（5 无条件 + linux/win32 双门控 HelloTid 各 1）"
    command: "ctest -V（default_to_clog + default_to_clog_with_tid）"
  - file: tests/general_tests.cpp
    source: logfault-0.5.2/tests/general_tests.cpp
    description: "上游手工开发用例（无 gtest 断言、未被 tests/CMakeLists.txt 引用，不参与构建与计数）"
    command: "未构建（上游事实，非本适配引入）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_logfault.cpp
    description: "消费者测试：六级日志与级别名、流式参数、LFLOG_IFALL_*、级别过滤参数不求值、ProxyHandler msg_/level_ 字段、Handler 级别门限、SetLevel/GetLoglevel/IsRelevant/ClearHandlers；18 条运行期 check 逐条打印读数，另有 1 条编译期 static_assert（枚举序）"
    command: "./test_logfault"

# 测试断言总数（上游 11 例 N=候选数法最大；消费者 test_package 另计 18 条，不进上游分母）
assertion_count: 11
