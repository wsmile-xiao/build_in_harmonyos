# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: logfault/0.8.5
homepage: "https://github.com/jgaa/logfault"

# 上游测试命令 (CMake + GTest)
upstream_check_command: "cmake -DLOGFAULT_BUILD_TESTS=ON && make && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（R02 补齐：全部 12 个入口逐项登记，含不可运行/未注册）
upstream_tests:
  - file: tests/cxx11/logfault_cxx11_tests.cpp
    source: logfault-0.8.5/tests/cxx11/logfault_cxx11_tests.cpp
    description: "C++11 日志级别与输出验证（GTest 2 例）；不可运行：gtest 1.17.0 要求 C++17（gtest-port.h #error），第三方依赖阻塞"
    command: "./logfault_cxx11_tests"
  - file: tests/cxx14/logfault_cxx14_tests.cpp
    source: logfault-0.8.5/tests/cxx14/logfault_cxx14_tests.cpp
    description: "C++14 日志级别与输出验证（GTest 2 例）；不可运行：gtest 1.17.0 要求 C++17，第三方依赖阻塞"
    command: "./logfault_cxx14_tests"
  - file: tests/cxx17/logfault_cxx17_tests.cpp
    source: logfault-0.8.5/tests/cxx17/logfault_cxx17_tests.cpp
    description: "C++17 日志级别与输出验证（GTest 2 例）；可运行且已运行：2/2 PASSED"
    command: "./logfault_cxx17_tests"
  - file: tests/cxx20/logfault_cxx20_tests.cpp
    source: logfault-0.8.5/tests/cxx20/logfault_cxx20_tests.cpp
    description: "C++20 日志级别与输出验证（GTest 2 例）；可运行且已运行：2/2 PASSED"
    command: "./logfault_cxx20_tests"
  - file: tests/cxx23/logfault_cxx23_tests.cpp
    source: logfault-0.8.5/tests/cxx23/logfault_cxx23_tests.cpp
    description: "C++23 日志级别与输出验证（GTest 2 例）；可运行且已运行：2/2 PASSED"
    command: "./logfault_cxx23_tests"
  - file: tests/default_to_clog.cpp
    source: logfault-0.8.5/tests/default_to_clog.cpp
    description: "默认输出到 clog 的日志行为（GTest 6 例）；可运行且已运行：6/6 PASSED"
    command: "./default_to_clog"
  - file: tests/json_escape_tests.cpp
    source: logfault-0.8.5/tests/json_escape_tests.cpp
    description: "JSON 转义模板验证（GTest 8 例）；可运行且已运行：8/8 PASSED"
    command: "./json_escape_tests"
  - file: tests/json_tests.cpp
    source: logfault-0.8.5/tests/json_tests.cpp
    description: "Boost::json 集成（GTest）；不可运行：缓存 boost 无 libboost_json 编译库（ld.lld undefined symbol），第三方依赖阻塞"
    command: "./json_tests"
  - file: tests/systemd_tests.cpp
    source: logfault-0.8.5/tests/systemd_tests.cpp
    description: "systemd handler 字段输出（GTest 2 例）；可运行且已运行：1/2 PASSED，DoActualLoggingWithSystemd 因 OHOS 无 libsystemd.so.0 失败（平台基础设施）"
    command: "./systemd_tests"
  - file: tests/general_tests.cpp
    source: logfault-0.8.5/tests/general_tests.cpp
    description: "开发/辅助源文件；未注册进 tests/CMakeLists.txt，不计入正式测试"
    command: "N/A（上游未注册）"
  - file: tests/os_log_tests.cpp
    source: logfault-0.8.5/tests/os_log_tests.cpp
    description: "Apple os_log（仅 Darwin 注册）；OHOS 不可运行：os/log.h not found（平台非 Darwin）"
    command: "N/A（仅 Darwin）"
  - file: tests/CMakeLists.txt
    source: logfault-0.8.5/tests/CMakeLists.txt
    description: "上游测试注册清单（GTest+Boost 依赖声明），逐入口核验见 tests/upstream-tests-ledger-r03.md"
    command: "N/A（构建脚本）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实调用 logfault StreamHandler/LFLOG_INFO API"
    command: "./test_logfault"

# 鸿蒙特有测试（赛事 Review 规则 12，R02 新增）
harmonyos_specific_tests:
  - file: tests/harmonyos/harmonyos_consumer_e2e.cpp
    description: "鸿蒙特有完整消费者端到端测试：创建 handler→设置级别→产生日志→断言输出，含可失败开关（--fail-cap 返回非 0）"
    command: "./harmonyos_consumer_e2e"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 25