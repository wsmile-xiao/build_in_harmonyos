# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libkeepalive/0.3
homepage: "http://libkeepalive.sourceforge.net/"

# 上游构建入口: 纯 GNU Make。上游 *没有* 自动化测试目标——顶层 Makefile 只有
# `default`(构建 src/ 与 test/) 与 `clean`，不存在 make test / make check，
# 也没有 ctest / meson test 注册项。上游的测试程序只能人工驱动。
upstream_check_command: "make (no test/check target is defined upstream)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际提供的测试程序（人工运行，未注册到任何测试运行器）
upstream_tests:
  - file: test/test.c
    source: libkeepalive-0.3/test/test.c
    description: >-
      Opens an AF_INET TCP socket and prints SO_KEEPALIVE, TCP_KEEPCNT,
      TCP_KEEPIDLE and TCP_KEEPINTVL. It must be run twice by hand: without
      LD_PRELOAD (SO_KEEPALIVE is OFF) and with LD_PRELOAD=<libkeepalive.so>
      (SO_KEEPALIVE is ON and the KEEPCNT/KEEPIDLE/KEEPINTVL values are
      applied). Built by `make -C test`.
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >-
      Consumer program asserting the keepalive state of a freshly created TCP
      socket; driven four times (no preload / preload / preload+tuning /
      preload+KEEPALIVE=off).
    command: "./test_libkeepalive"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
