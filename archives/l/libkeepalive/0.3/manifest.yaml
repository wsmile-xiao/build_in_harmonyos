# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3"

# 软件名
software: "libkeepalive"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-14"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/libkeepalive/libkeepalive/0.3/libkeepalive-0.3.tar.gz"

  # 源码校验和
  sha256: "fb577b132a49d289ff3cd0c2a670ddc50028c6dbecfb164958ac031376a82dd2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
# 每条必须带 knowledge_ref（关联知识图谱条目，草稿或正式），否则 W5 判为 unreferenced
knowledge_gained:
  - "OHOS 链接器给 ELF 注入 .codesign 代码签名块；任何 strip 变体（-s/--strip-debug/--strip-unneeded/-S）都会让签名失配，加载器此后静默忽略该库的 LD_PRELOAD 拦截（socket() 不再被 hook，且无任何报错）。（knowledge_ref: E429）"
  - "规避方式：配方不执行上游 Makefile 末尾的 strip -s（只构建 src/）；若打包流程必须 strip，则 strip 后必须重新自签名。（knowledge_ref: E429 / E077）"
  - "libkeepalive 的 socket() 拦截在 OHOS musl 上确实可用：dlsym(RTLD_NEXT, \"socket\") 可解析，SO_KEEPALIVE / TCP_KEEPCNT / TCP_KEEPIDLE / TCP_KEEPINTVL 均受支持，KEEPALIVE=off 开关生效；注意与 E502（CI worker 拒绝用户目录 .so 的 dlopen/LD_PRELOAD）的区别：签名有效时本机 LD_PRELOAD 可正常工作。（knowledge_ref: E502）"
  - "strip 后可用 llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1 恢复拦截能力（实测复验通过）。（knowledge_ref: E077）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
