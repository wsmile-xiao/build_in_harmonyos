software: libdetourtilecache
version: "1.6.0"
status: built
build_date: "2026-09-21"
build_system: cmake
format: conan
license: Zlib
homepage: "https://github.com/recastnavigation/recastnavigation"
source:
  url: "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v1.6.0.tar.gz"
  sha256: "d48ca0121962fa0639502c0f56c4e3ae72f98e55d88727225444f500775c0074"

options:
  shared: false
  fPIC: true
  RECASTNAVIGATION_DEMO: false
  RECASTNAVIGATION_EXAMPLES: false
  RECASTNAVIGATION_TESTS: true
  RECASTNAVIGATION_DT_POLYREF64: false
  RECASTNAVIGATION_DT_VIRTUAL_QUERYFILTER: false
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

dependencies:
  - "libdetour/1.6.0"

patches_applied: []

tests:
  upstream:
    command: "ctest --output-on-failure; Tests --reporter compact"
    ctest_entries: 1
    framework: Catch2
    test_cases_non_ohos: 30
    test_cases_ohos_aarch64: 43
    assertions: 804
    passed_non_ohos: 30
    passed_ohos_aarch64: 43
    failed: 0
  conan_consumer:
    command: "conan create archives/l/libdetourtilecache/1.6.0 -pr:a=default"
    non_ohos_checks: 2
    non_ohos_passed: 2
    ohos_specific_checks: 1
  harmonyos_pc_vm:
    transport: hdc
    architecture: x86_64
    checks: 3
    passed: 3
    includes: "真实 API 生命周期、障碍物引用生命周期、HarmonyOS TMPDIR 可写性"
    note: "由于远端未提供 x86_64 OHOS 的 libdetour 二进制，该项使用同一 DevEco OHOS 工具链直接构建的 x86_64 consumer 进行 VM 冒烟；不是 Conan x86_64 包测试"
  harmonyos_aarch64_device:
    transport: ssh
    architecture: aarch64
    conan_create: true
    upstream_test_cases: 43
    upstream_assertions: 804
    checks: 3
    passed: 3
    includes: "原生 Conan 包构建、真实 API 生命周期、障碍物引用生命周期、HarmonyOS TMPDIR 可写性"

limitations:
  - "远端目前没有 x86_64 OHOS 的 libdetour/1.6.0 预编译包，因此 x86_64 虚拟机验证使用直接 OHOS 工具链 consumer；原生 aarch64 Conan 验证已在设备上完成"
