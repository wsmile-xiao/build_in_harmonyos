package: libdetourtilecache/1.6.0
homepage: "https://github.com/recastnavigation/recastnavigation"

upstream_check_command: "ctest --output-on-failure"
upstream_tests_exist: true
upstream_test_framework: "catch2"
upstream_test_audit: "The official v1.6.0 Tests target is enabled by the main recipe and is checked with ctest --output-on-failure."

test_package_tests:
  - file: test_detour_tile_cache.cpp
    description: "calls the real DetourTileCache allocation, initialization, obstacle, reference, and removal APIs"
    command: "./libdetourtilecache_test"
  - file: test_detour_tile_cache.cpp
    description: "HarmonyOS-only writable TMPDIR check; skipped on non-OHOS hosts and executed on HarmonyOS"
    command: "./libdetourtilecache_test"

assertion_count:
  non_ohos: 2
  ohos: 3
