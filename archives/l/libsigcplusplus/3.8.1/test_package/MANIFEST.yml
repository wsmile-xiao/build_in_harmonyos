package: libsigcplusplus/3.8.1
homepage: "https://github.com/libsigcplusplus/libsigcplusplus"

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"

upstream_tests:
  - file: tests/test_*.cc
    source: libsigc++-3.8.1/tests/test_*.cc
    description: "42 upstream unit tests (test_accum_iter ... test_weak_raw_ptr) registered in tests/meson.build and run via meson.test() in build(); each links sigc-3.0 and exercises one subsystem (bind/compose/connection/disconnect/exception_catch/hide/limit_reference/mem_fun/ptr_fun/retype/rvalue_ref/scoped_connection/signal/slot/trackable/tuple_*/visit_each/weak_raw_ptr)"
    command: "meson test"

test_package_tests:
  - file: test_package.cpp
    description: "Consumer test exercising signal connect/emit, default last-value collector, connection::disconnect, scoped_connection lifetime, trackable auto-disconnect, ptr_fun, mem_fun with state, bind, exception_catch adaptor, and empty-signal value-init (10 checks)"
    command: "./test_libsigcplusplus"
    assertions: 10

assertion_count: 10
