# test_package/MANIFEST.yml
# 上游官方测试声明文件
# ledmon 0.97 上游测试：仅 test/exercise_ledctl.py（175 行独立 python 脚本），
# 未注册进 automake（SUBDIRS 不含 test/，无 TESTS/check_PROGRAMS），
# 且硬编码 /usr/sbin/ledctl、需 root + 真实 SES enclosure 硬件 —— 无构建期测试入口。

package: ledmon/0.97
homepage: "https://github.com/intel/ledmon"

# 上游无 automake check 入口（`make -n check` 仅递归默认规则，无注册用例）
upstream_check_command: "make -n check  # 无 TESTS/check_PROGRAMS 注册项"

# conanfile.py build() 方法中是否已集成上游测试（无可集成入口，见 upstream_tests 说明）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试程序（静态清点 N_static=1；执行状态见下）
upstream_tests:
  - file: test/exercise_ledctl.py
    source: ledmon-0.97/test/exercise_ledctl.py
    description: "ledctl 端到端脚本 — 需 root、真实 SES enclosure 背板与 /usr/sbin/ledctl 安装路径；OHOS 设备无 root 无 SAS 背板，三重环境性不可执行（逐项原因见 notes.md 五维账本）"
    command: "python3 test/exercise_ledctl.py"
    executed: false
    skip_reason: "requires root (device has no root) + SES enclosure hardware + hardcoded /usr/sbin/ledctl install path"

# test_package 中自带的测试（消费者视角，真实执行已签名打包二进制并断言退出码/输出）
test_package_tests:
  - file: test_ledmon.sh
    description: "5 项行为断言 — ledctl --version/--help、ledmon --version/--help（证 libudev/libpci/sgutils2/librt 符号闭合与可加载执行）、非 root 特权命令拒止（'Only root can run this application.' 逐字）"
    command: "sh test_ledmon.sh <pkg>/bin/ledctl <pkg>/bin/ledmon"
    # 汇总行为三值：CONSUMER-RESULT pass=N fail=N skip=N；整机判定按 fail==0。
    # C5 需要非 root 才能验证拒止路径，若执行环境为 root 则该条记 skip（不冒充 pass）。
    expected_result: "CONSUMER-RESULT pass=5 fail=0 skip=0"

# 上游测试断言总数（静态注册原子用例：0 —— 脚本内断言依赖硬件，不可达）
# 粒度说明：N_static 按"上游测试脚本文件"计=1；automake 注册=0；脚本内 2 个 python
# 测试函数（test_non_slot_set_path、test_slot_state_walk）因需 root+SES 背板不可达，故本行记 0。
assertion_count: 0

# 资源预算：memcap-run.py --probe 实测（2026-09-24，设备 ~/tmp/uc2/hw-5/scripts/probe.sh）
# MEMCAP[probe] peak=4MB rc=0 用时0.2s（整条消费者链：sh + ledctl x3 + ledmon x2）；
# 预算取实测峰值 16 倍余量，CI worker 上同一 test_package 行为一致。
max_rss_mb: 64
