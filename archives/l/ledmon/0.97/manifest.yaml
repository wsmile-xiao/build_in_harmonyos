# 版本级 manifest — ARCHIVE-SPEC v2.0
# 文件位置: archives/l/ledmon/0.97/manifest.yaml

version: "0.97"
software: "ledmon"

# published | built | failed | archived
status: built
build_date: "2026-09-24"
build_system: "autotools"

source:
  url: "https://github.com/intel/ledmon/archive/refs/tags/v0.97.tar.gz"
  sha256: "40ee7e462b78c77468cc2ef356a06c5b6db44747d596dc11532f7b6f378d2d4b"
  tar_format: tar.gz
  # tag 有 `0.97` 与 `v0.97` 两种形态，取 v0.97（SCT 实测 GET 200, 99216B）

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "ac_cv_prog_PROG_gcc=yes"          # AX_CHECK_PROG([gcc]) 交叉下探不到 gcc 这个名字
    - "ac_cv_func_malloc_0_nonnull=yes"  # AC_FUNC_MALLOC 交叉下会改写成不存在的 rpl_malloc
  dependencies:
    - eudev/3.2.14      # PKG_CHECK_MODULES libudev
    - libsgutils/1.46   # AC_CHECK_LIB sgutils2 + scsi/sg_*.h
    - pciutils/3.13.0   # PKG_CHECK_MODULES libpci
  tool_dependencies:
    - automake/1.18     # tag tarball 无 configure/Makefile.in → autoreconf -fi
    - pkgconf/3.0.5     # 提供 pkg.m4（ACLOCAL_PATH）与 pkgconf 可执行文件
  cc: clang
  cxx: clang++
  package_type: application
  artifacts:
    - bin/ledmon    # 上游装到 sbin，本配方移到 bin（R38 工具类 + commands.json）
    - bin/ledctl

patches_applied:
  - "0001-ses-h-use-linux-types.patch"
  - "0002-drop-doc-subdir.patch"
  - "0003-am-cflags-use-top-srcdir.patch"
  - "0004-utils-h-include-sys-types.patch"
  - "0005-ibpi2value-sentinel-explicit-value.patch"
  - "0006-onexit-compat-for-musl.patch"

tests:
  # 上游测试静态清点：test/exercise_ledctl.py（175 行独立脚本，硬编码
  # /usr/sbin/ledctl，需 root + SES enclosure 硬件），未注册进 automake
  # SUBDIRS/TESTS —— 构建系统注册数 0，无法在 build() 内 make check。
  # 粒度口径：upstream_static_count 按"测试脚本文件"计=1；该脚本内含 2 个 python
  # 测试函数（test_non_slot_set_path/test_slot_state_walk），因需 root+SES 背板不可达，
  # 故 registered=0、executed=0，可执行原子用例数记 0（见 test_package/MANIFEST.yml）。
  upstream_tests: []
  upstream_static_count: 1        # exercise_ledctl.py（逐项跳过原因见 notes.md 五维账本）
  registered_count: 0
  executed_count: 0
  skipped_count: 1
  consumer_count: 5               # test_package/test_ledmon.sh C1–C5
  consumer_passed: 5              # 设备非 root 实测；root 环境下 C5 记 skip 不冒充 pass
  # 交付等级（R40）：ledmon/ledctl 属"外设/硬件 + 系统底层"类，本机无 root 无 SAS SES/SGPIO
  # 背板 ⇒ 守护循环与 SES 命令下发面未执行，需人工确认适配完整性；详见 notes.md 已知限制 3/4。
  # 设备 memcap-run.py --probe 实测：整条消费者链峰值 4MB（rc=0, 0.2s），预算取 16 倍余量
  max_rss_mb: 64

knowledge_gained:
  - "M10(/dev/shm 只写虚拟目录)：ledmon amd_sgpio.c 在 shm_open 文件上 flock → EACCES(13) 实测（数据面全通、唯锁被摘）；且上游不查 flock 返回值 ⇒ 静默互斥失效——'只用文件不碰目录'不等于免疫 M10（本 PR 携带 DRAFT-ledmon-0.97-dev-shm-write-only-virtual-dir） (ref: notes.md#发现与知识 1)"
  - "OHOS sysroot 无 asm/types.h（aarch64 上 __u8/__u32 由 linux/types.h 承载）→ ses.h 换 include（0001 补丁） (ref: notes.md#发现与知识 2)"
  - "conan pciutils 包无 pkg_config_name → PkgConfigDeps 生成 pciutils.pc，而 configure 探测模块名是 libpci → generate() 别名 libpci.pc (ref: notes.md#发现与知识 3)"
  - "GitHub tag tarball 无 configure/Makefile.in → autoreconf -fi + tool_requires(automake, pkgconf)；E011 的 umask 077 修补必须在自举之后（自举会重新生成 configure） (ref: notes.md#发现与知识 4)"
  - "doc/ 子目录依赖 pod2man（CI worker 无 perl 保证）→ 0002 补丁从 SUBDIRS 去掉；man 页为文档产物不影响功能面 (ref: notes.md#发现与知识 5)"
  - "/var/tmp 在 OHOS 整机不存在（mkdir errno=2），smp.c 的 mknod 路径不可达 —— 据此证伪'CAP_MKNOD'候选机制 (ref: notes.md#发现与知识 6)"
  - "OHOS XPM：产物 bin/ledmon、bin/ledctl 为动态链接 ELF（libudev/libpci/sgutils2/librt），package() 内 binary-sign-tool 自签后方可 exec；musl 加载器忽略 DT_RUNPATH，运行期靠 LD_LIBRARY_PATH 注入 (ref: notes.md#发现与知识 7)"
