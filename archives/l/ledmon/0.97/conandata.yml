sources:
  url: "https://github.com/intel/ledmon/archive/refs/tags/v0.97.tar.gz"
  sha256: "40ee7e462b78c77468cc2ef356a06c5b6db44747d596dc11532f7b6f378d2d4b"

patches:
  - patch_file: "patches/0001-ses-h-use-linux-types.patch"
    patch_description: "ses.h: asm/types.h 不在 OHOS sysroot，改用 linux/types.h 提供 __u8/__u32"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-drop-doc-subdir.patch"
    patch_description: "顶层 SUBDIRS 去掉 doc/（man 页生成依赖 pod2man，CI worker 无 perl 保证）"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-am-cflags-use-top-srcdir.patch"
    patch_description: "AM_CFLAGS 的 -I../config 改成 -I$(top_srcdir)/config：conan 走 out-of-source 构建，相对路径找不到手写的 config/config.h"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-utils-h-include-sys-types.patch"
    patch_description: "src/utils.h 补 #include <sys/types.h>：OHOS musl 仅在 sys/types.h/unistd.h 声明 ssize_t，原文件无该包含链，导致 error: unknown type name 'ssize_t'"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0005-ibpi2value-sentinel-explicit-value.patch"
    patch_description: "dellssd/vmdssd/amd_ipmi/npem 四张 ibpi2value 表的 IBPI_PATTERN_UNKNOWN 哨兵补显式 .value=0：clang 下 -Werror=missing-field-initializers 对省略尾字段报错，gcc 不报"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0006-onexit-compat-for-musl.patch"
    patch_description: "on_exit(3) 是 glibc/BSD 专有接口，OHOS musl 无该符号（sysroot 全量 grep 零命中）=> ledmon/ledctl 链接期 undefined symbol；用 atexit + 记录表补兼容实现（保留 handler 参数与 LIFO 顺序，状态参数恒 0 已列为已知限制）"
    patch_type: "portability"
    strip: 1
