software: libnexstar
display: "libnexstar"
description: "C library for controlling NexStar-compatible telescope mounts"
category: hardware
homepage: "https://sourceforge.net/projects/libnexstar/"
license: GPL-3.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "Accept the aarch64-linux-ohos triplet in the bundled GNU configuration scripts"
    - "Use source-local header lookup so clean VPATH builds succeed"
    - "Direct config.status generated files to a recipe-created writable work directory on HMDFS"
  common_dependencies: []

versions:
  "0.15":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libnexstar/0.15"
