package: libnexstar/0.15
homepage: "https://sourceforge.net/projects/libnexstar/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\")"

upstream_tests:
  - file: "testcode/celtest.c"
    source: "libnexstar-0.15/testcode/celtest.c"
    description: "Serial command transport and alignment response scenario"
    command: "ctest -R upstream_celtest"
  - file: "testcode/nexstarctl.c"
    source: "libnexstar-0.15/testcode/nexstarctl.c"
    description: "Orientation, model-name, and protocol-version scenarios"
    command: "ctest -R upstream_nexstarctl$"
  - file: "testcode/nexstarctl2.c"
    source: "libnexstar-0.15/testcode/nexstarctl2.c"
    description: "Tracking mode query, update, and parameter validation"
    command: "ctest -R upstream_nexstarctl2"
  - file: "examples/get_rade1.c"
    source: "libnexstar-0.15/examples/get_rade1.c"
    description: "Precise telescope-coordinate protocol decoding"
    command: "ctest -R upstream_get_rade1"
  - file: "examples/get_rade2.c"
    source: "libnexstar-0.15/examples/get_rade2.c"
    description: "Angle/hour parsing, formatting, and DMS conversion"
    command: "ctest -R upstream_get_rade2"
  - file: "examples/push_buttons.c"
    source: "libnexstar-0.15/examples/push_buttons.c"
    description: "Multi-axis fixed-rate slew protocol sequence"
    command: "ctest -R upstream_push_buttons"
  - file: "examples/push_left.c"
    source: "libnexstar-0.15/examples/push_left.c"
    description: "Single-axis negative slew and stop sequence"
    command: "ctest -R upstream_push_left"

test_package_tests:
  - file: "libnexstar_tests.c"
    description: "Seven automated public-API scenarios corresponding to all shipped upstream test/example programs"
    command: "ctest -R upstream_"
  - file: "ohos_platform_test.c"
    description: "HarmonyOS-specific AArch64 ABI and public coordinate API verification"
    command: "ctest -R harmonyos_aarch64_api"

assertion_count: 58
