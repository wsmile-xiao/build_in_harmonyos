# 版本级 manifest — limonp 1.0.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.2"
software: limonp

status: built
build_date: "2026-09-20"
build_system: cmake

source:
  url: "https://github.com/yanyiwu/limonp/archive/refs/tags/v1.0.2.tar.gz"
  sha256: "0d98bd9c87bd82bcfc234107908969e7416145d8b5e996e43c5d2513c419b2c0"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
  - "ENABLE_UNIT_TESTS=ON（上游自定义 option，默认 ON，门控 enable_testing() + add_subdirectory(test)）"
  - "header-only（package_type=header-library，add_library(limonp INTERFACE)）"
  - "CMAKE_CXX_STANDARD=17（上游仅在未定义时回落 11；profile 的 cppstd=17 先生效）"
  dependencies:
  - "gtest/1.17.0.1 (test_requires，仅测试)"
  cc: clang

patches_applied:
- "0001-CMakeLists.txt-testdata-working-directory.patch: 两个 ADD_TEST 补 WORKING_DIRECTORY ${PROJECT_SOURCE_DIR}/test，COMMAND 换成 $<TARGET_FILE:...> —— 上游的相对 fixture 路径 \"../test/testdata/...\" 只在 build 目录是源码根直接子目录时成立"
- "0002-test-unittest-CMakeLists.txt-conan-gtest.patch: 用 find_package(GTest REQUIRED) + GTest::gtest 替换 configure 期 FetchContent git clone googletest（CI worker 不可联网）；test.run 自带 main，故不链 gtest_main"

knowledge_gained:
- "上游 unit test 的 fixture 是相对路径 \"../test/testdata/...\" 且 ctest 用例的 COMMAND 也是相对路径 + 默认 WORKING_DIRECTORY（= build 目录）：只有当 build 目录恰好是源码根的直接子目录时才解析得到。上游 CI 用 `cmake -B <ws>/build` 天然满足，Conan 的 build 目录却在本地缓存里、与 source 目录互为兄弟 → 4 个用例因 fixture 打不开而失败。判定信号：`grep -n '\\.\\./' test/**/*.cpp` 与 `grep -n 'ADD_TEST' CMakeLists.txt` 同时命中相对路径"
- "CMake 的 ADD_TEST 里 COMMAND 写死相对路径时，改 WORKING_DIRECTORY 会连带把可执行文件也找错（相对 COMMAND 是相对 WORKING_DIRECTORY 解析的）；必须同时把 COMMAND 改成 $<TARGET_FILE:target> 才能既定位二进制又控制 cwd"
- "上游用 FetchContent 在 configure 期 git clone googletest（GIT_TAG release-1.12.1）并把裸 target 名 `gtest` 传给 target_link_libraries；换成 Conan 的 gtest 时要一并换成 CMakeDeps 声明的 GTest::gtest"
- "测试自带 gtest_main.cpp（定义了 main）时只能链 GTest::gtest —— 链 GTest::gtest_main 会 duplicate symbol main"
- "ctest 把整个 gtest 二进制当成 1 个用例：只解析 ctest 汇总行（2/2）无法发现 gtest 用例集缩水，必须用 `ctest -V` 把测试输出带回来再解析 gtest 自己的 '[  PASSED  ] N tests.'（--output-on-failure 会把通过用例的输出吃掉）"
- "limonp 的 GBK<->Unicode 不是查表映射而是**字节对打包**（TwocharToUint16），不依赖平台的 locale / iconv；真正与平台相关的是 `char` 的默认有符号性：aarch64-linux（含 OHOS）的 char 是 unsigned、x86-linux 是 signed，GBK 字节 0xD6 在 x86 的 signed char 里是 -42 —— `uint16_t(high) & 0x00ff`（先转无符号再掩码）是两端都得到 0xD6D0 的原因"
- "rule4 用例计数三档口径实测：上游**默认分支 master** 朴素扫描 = 27（声明值必须 >= 它）、钉版 tag 朴素扫描 = 26、实际注册并执行 = 25。未执行 2 逐类归因：TCastFloat.cpp 有 TEST 但从未被写进 ADD_EXECUTABLE(test.run ...)（+1），master 的 TLocalVector.cpp 新增 TEST(LocalVector, NonTrivialValue)（+1）。master 与 v1.0.2 之间 test/unittest/ 的唯一差异文件就是 TLocalVector.cpp（还顺带把 capacity() 断言从 LOCAL_VECTOR_BUFFER_SIZE 改成 0u/ASSERT_GE）"
