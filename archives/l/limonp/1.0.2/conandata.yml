sources:
  "1.0.2":
    url: "https://github.com/yanyiwu/limonp/archive/refs/tags/v1.0.2.tar.gz"
    sha256: "0d98bd9c87bd82bcfc234107908969e7416145d8b5e996e43c5d2513c419b2c0"
patches:
  "1.0.2":
    - patch_file: "patches/0001-CMakeLists.txt-testdata-working-directory.patch"
      patch_description: "上游两个 ADD_TEST 用相对路径 COMMAND + 默认 WORKING_DIRECTORY（build 目录），而 TConfig.cpp / TStdExtension.cpp / TStringUtil.cpp 用相对路径 \"../test/testdata/...\" 打开 fixture —— 只有 build 目录恰好是源码根的直接子目录时才解析得到。给出显式 WORKING_DIRECTORY ${PROJECT_SOURCE_DIR}/test 并把 COMMAND 换成 $<TARGET_FILE:...>，让任何 out-of-tree 构建目录都能跑（Conan 的 build 目录与 source 目录是兄弟节点，不打这个补丁会有 4 个用例因 fixture 打不开而失败）"
      patch_type: "portability"
    - patch_file: "patches/0002-test-unittest-CMakeLists.txt-conan-gtest.patch"
      patch_description: "上游 test/unittest/CMakeLists.txt 用 FetchContent_Declare(googletest GIT_REPOSITORY https://github.com/google/googletest.git GIT_TAG release-1.12.1) + FetchContent_MakeAvailable 在 configure 期 git clone googletest（CI worker 不可联网），且链接的是 FetchContent 提供的裸 target 名 gtest。换成 find_package(GTest REQUIRED) + GTest::gtest（Conan gtest/1.17.0.1 由 CMakeDeps 生成 GTestConfig.cmake）。test.run 自带 main（test/unittest/gtest_main.cpp），故不链 GTest::gtest_main"
      patch_type: "conan"
