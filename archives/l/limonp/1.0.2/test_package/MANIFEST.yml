# test_package/MANIFEST.yml — limonp 1.0.2
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: limonp/1.0.2
homepage: "https://github.com/yanyiwu/limonp"

# 上游测试命令。上游 .github/workflows/cmake.yml：
#   cmake -B ${{github.workspace}}/build -DBUILD_TESTING=ON ...
#   cmake --build ${{github.workspace}}/build
#   working-directory: ${{github.workspace}}/build ; ctest -C ... --output-on-failure --verbose
# 上游在顶层 CMakeLists.txt 注册 2 个 ctest 用例（./test/demo 与 ./test/test.run）。
upstream_check_command: "ctest -V"

# conanfile.py build() 中是否已集成上游测试（层1）
upstream_test_in_build: true
upstream_test_command: "build() 内 ctest -V 全量实跑上游套件（2 个 ctest 用例，其中 test.run 内含 25 个 gtest 用例）"

upstream_tests:
  - file: "test/unittest/{TArgvContext,TClosure,TColorPrint,TConfig,TLocalVector,TLogging,TStdExtension,TStringUtil}.cpp"
    source: "limonp-1.0.2/test/unittest/*.cpp"
    description: "上游 test.run 的全部 TU（外加提供 main 的 gtest_main.cpp）。逐文件 TEST 宏：TArgvContext 1 / TClosure 2 / TColorPrint 1 / TConfig 1 / TLocalVector 2 / TLogging 1 / TStdExtension 5 / TStringUtil 12 = 25；TCastFloat.cpp 另有 1 个但 **未被 ADD_EXECUTABLE(test.run ...) 收录**，因此不注册也不执行。三个用 fixture 的 TU（TConfig / TStdExtension / TStringUtil）通过相对路径 \"../test/testdata/...\" 打开文件，patch 0001 给 ADD_TEST 补了 WORKING_DIRECTORY ${PROJECT_SOURCE_DIR}/test。"
    command: "ctest -V"
  - file: "test/demo.cpp"
    source: "limonp-1.0.2/test/demo.cpp"
    description: "上游注册的另一个 ctest 用例（ADD_TEST(NAME ./test/demo ...)），是一个没有断言的示例程序，只验证链接与运行不崩。"
    command: "ctest -V"

# 上游 test.run 里注册并实跑的 gtest TEST 宏数（本包 build() 内 ctest -V 实跑并解析 gtest 汇总行）
# rule4 口径差：评审的"上游实测 N"是朴素扫描且扫**默认分支 master** = 27；
# 钉版 v1.0.2 朴素扫描 = 26；实际注册并执行 = 25。
#   未执行 2 = 1（TCastFloat.cpp 有 TEST 但从未被 ADD_EXECUTABLE(test.run ...) 收录）
#            + 1（master 的 TLocalVector.cpp 新增 TEST(LocalVector, NonTrivialValue)）
# 声明 N 必须取 27（≥ master 朴素扫描值），不能拿 25 去声明（会触发"少报"）。
upstream_test_count: 25
upstream_test_count_master_naive_scan: 27
upstream_test_count_tag_naive_scan: 26

# 消费者测试断言组数
assertion_count: 6
