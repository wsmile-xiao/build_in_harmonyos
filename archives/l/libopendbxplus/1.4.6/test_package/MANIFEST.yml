package: libopendbxplus/1.4.6
homepage: "https://linuxnetworks.de/doc/index.php/OpenDBX"

upstream_check_command: "odbxtest / odbxplustest against the sqlite3 backend; output compared to test/ref/sqlite3.ref"
upstream_test_in_build: true
upstream_test_command: "odbxtest -b ../backends/sqlite3/.libs/libsqlite3backend.so -h . -d odbx.sq3; odbxplustest -b ../backends/sqlite3/.libs/libsqlite3backend.so -h . -d odbx.sq3"

upstream_tests:
  - name: odbxtest
    command: "odbxtest -b <sqlite3 backend .so> -h . -d odbx.sq3"
    expected: "exit 0; output matches test/ref/sqlite3.ref (125 lines)"
  - name: odbxplustest
    command: "odbxplustest -b <sqlite3 backend .so> -h . -d odbx.sq3"
    expected: "exit 0; output matches test/ref/sqlite3.ref (125 lines)"

test_package_tests:
  - file: test.cpp
    description: "Load packaged sqlite3 backend plugin, run DDL/DML/SELECT through the OpenDBX C++ API, verify 2 rows and field values"
    command: "./opendbxplus_test <backend_plugin_path> ."

assertion_count: 5
