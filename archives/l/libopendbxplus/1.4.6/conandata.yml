# conandata.yml — libopendbxplus 1.4.6 (upstream project: OpenDBX, opendbx-1.4.6)
#
# Source: official upstream tarball hosted on the project site linuxnetworks.de
# (same URL recorded by Homebrew homebrew-core opendbx formula and Debian
# upstream metadata). SHA-256 cross-verified against the Homebrew record:
#   2246a03812c7d90f10194ad01c2213a7646e383000a800277c6fb8d2bf81497c
#
# Note: linuxnetworks.de intermittently refuses connections (observed during
# adaptation; the project site is effectively unmaintained). A byte-identical
# authoritative mirror of the same pristine upstream release (Debian pool orig
# tarball via JAIST public mirror, same SHA-256 verified byte-for-byte) is
# listed as mirror_urls fallback so CI can fetch the source reliably.

sources:
  url: "https://linuxnetworks.de/opendbx/download/opendbx-1.4.6.tar.gz"
  sha256: "2246a03812c7d90f10194ad01c2213a7646e383000a800277c6fb8d2bf81497c"
  mirror_urls:
    - "https://ftp.jaist.ac.jp/pub/Linux/debian/pool/main/libo/libopendbx/libopendbx_1.4.6.orig.tar.gz"
  mirror_sha256: "2246a03812c7d90f10194ad01c2213a7646e383000a800277c6fb8d2bf81497c"

patches:
  - patch_file: "patches/0001-config-sub-aarch64.patch"
    patch_description: "Accept aarch64 host triples (aarch64-*-linux*, aarch64-*-ohos*) in the bundled 2010 config.sub"
    patch_type: "portability"
