# conandata.yml — libamrwb 11.0.0.0
#
# 双源结构（与 FreeBSD audio/libamrwb port 同构）：
#   [0] amrwb-11.0.0.0.tar.bz2 — penguin.cz/~utx/amr 构建封装包
#       （configure + 4 个可移植性补丁 + prepare_sources.sh 接口变换脚本）
#   [1] 26204-b00.zip — 3GPP TS 26.204 v11.0.0 AMR-WB 浮点 ANSI-C 参考实现源码
#       （构建时由 Makefile 解包并自动应用补丁，不参与打包分发）
#
# 上游官方站 www.penguin.cz/~utx/amr 已不可达（http only + 长期超时），
# 借助 FreeBSD ports 基础设施镜像（distcache + 中科大）获取 wrapper 包。
#
# sha256 三重交叉验证（2026-09-23，与 FreeBSD audio/libamrwb/distinfo 权威记录一致）：
#   - FreeBSD ports audio/libamrwb distinfo（cgit.freebsd.org 实测读取）：
#       amrwb-11.0.0.0.tar.bz2 = 5caf59b14480b0cd2a7babb8be472c4af39ff4c7c95f1278116557049a4dd5dc (240170 B)
#       26204-b00.zip           = c885c44483fd4502d354ec9656f2cdc0469050015052f8f3ecc1d5e08c869fec (385394 B)
#   - 本机 tarball 与已下载 3GPP zip 的 sha256 实测一致（见 notes.md）。
#
# 3GPP 源 URL 说明（libamrnb 同源实测，见 archives/l/libamrnb/11.0.0.0）：
#   www.3gpp.org 前置 WAF 按 User-Agent 过滤：curl/wget UA（CI 预下载所用）得到
#   ~35KB HTML 拦截页（HTTP 200，CI 预下载 size>100 判定会误存为"成功"）；Conan
#   自带 UA（Conan/2.x ...）实测可正常下载真实文件。因此第二个 URL 使用大写
#   scheme/host（RFC 3986 大小写不敏感，requests 正常处理），使其避开 CI 预下载
#   的小写正则抽取，由 conan 原生下载；小写官方 URL 保留在首位满足 R39 官方源
#   要求，即便被预下载 WAF 页污染，conan 校验失败后自动回落下一 URL。

