# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libamrwb/11.0.0.0
homepage: "http://www.penguin.cz/~utx/amr"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清点（R51，2026-09-23 核验，实跑 make check 输出 "Nothing to be done for 'check'"）：
# - 构建封装包 amrwb-11.0.0.0.tar.bz2 无 tests/ 目录、无 check 目标
#   （Makefile.am 全量核阅：仅 libamrwb.la + 4 个 bin_PROGRAMS，无 TESTS/check_PROGRAMS）。
# - 3GPP 26204-b00.zip 内层 26204-b00_ANSI_C_source_code.zip 共 18 个 c-code 文件，
#   全部为 *.c|*.h + makefile.gcc + readme.txt，无测试向量、无测试程序。
# 上游确无自动化测试，证据：上述两包文件清点 + `make check` 实跑日志
# （make: Nothing to be done for 'check'，exit 0）；FreeBSD audio/libamrwb port
# 亦未定义 do-test（仅构建库与工具）。
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "消费者测试 - 9 种 AMR-WB 模式编码（RFC 3267 存储格式精确字节数断言）+ DTX/SID + mode 8 多帧编解码往返（解码器收敛后正弦保真度断言）"
    command: "./test_libamrwb"
  - file: conanfile.py
    description: "amrwb-encoder CLI 冒烟 - 16kHz 正弦 PCM 编码为 AMR-WB 流并校验 #!AMR-WB 魔数"
    command: "amrwb-encoder 8 in.pcm out.amr"

assertion_count: 22
