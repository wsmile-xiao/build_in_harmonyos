software: libamrwb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/11.0.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "11.0.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"

# 构建系统类型 (top-level)
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（主源：FreeBSD ports 基础设施镜像；上游官方站已下线，
  # 详见 conandata.yml 交叉验证说明）
  url: "https://mirrors.ustc.edu.cn/freebsd-ports/distfiles/libamrwb/amrwb-11.0.0.0.tar.bz2"
  # 附加源码：3GPP TS 26.204 v11.0.0 参考实现（构建期解包，不分发）
  #   https://ftp.3gpp.org/Specs/archive/26_series/26.204/26204-b00.zip
  #   sha256: c885c44483fd4502d354ec9656f2cdc0469050015052f8f3ecc1d5e08c869fec

  # 源码校验和
  sha256: "5caf59b14480b0cd2a7babb8be472c4af39ff4c7c95f1278116557049a4dd5dc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    # OHOS 交叉：2012 版 config.guess/config.sub 不识别 aarch64-linux-ohos，
    # 使用 generic linux-gnu triplet（libamrnb/celt/a52dec 先例）
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # libamrwb 纯 C 实现，零 conan 依赖；仅链接系统 libm

  # 编译器
  cc: clang
  cxx: clang++

  # 构建期宿主工具依赖（非 conan 包）
  host_tools:
    - bash
    - unzip   # 解包 3GPP zip（configure 强制探测）
    - patch   # prepare_sources.sh 应用 4 个上游可移植性补丁
    - sed
    - tr

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
#   0001: 去除 configure 临时目录创建的 umask 077（E011/E114，HMDFS setgid 下
#   config.status 在 subs1.awk 处 Permission denied；上游 4 个 3GPP 代码补丁
#   由 prepare_sources.sh 构建期自动应用）
patches_applied:
  - "0001-configure-hmdfs-umask.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "本机 /usr/bin/patch 为 toybox：prepare_sources.sh 对 3GPP 源码做 tr -d '\\r\\000' 后 toybox patch 可正常应用 4 个上游补丁（实测 exit 0、typedef.h 生效）；但 toybox patch 对『无上下文行的最小 hunk』会静默 no-op（打印 patching X 却 exit 0 不改文件）——本配方 configure 补丁改由 conan patch_ng 应用（CI 同机制），规避 toybox 差异"
  - "patch_ng 对 git 格式补丁（--- a/configure）:a/ b/ 前缀被自动剥离后再剥 strip 层数，git 格式补丁必须用 strip=0（conan 默认），strip=1 会把 a/configure 剥成空路径导致 'source/target file does not exist'；写补丁时 hunk 头行数必须与实际 body 行数一致，否则 patch_ng 报 'patch stream is incomplete'（本包初版补丁因缺 hunk 尾部空上下文行被拒）"

patch_generation:
  method: refresh-patch --auto
  patches_count: 1

patch_classification:
  - file: 0001-configure-hmdfs-umask.patch
    type: platform
    platform_only: true
    guard: 'none'
