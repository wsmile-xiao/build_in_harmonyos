software: libopennet
display: "libopennet"
version: "0.9.9"
status: validated
build_system: autotools
build_date: 2026-09-17
target_platform: aarch64-unknown-linux-ohos

source:
  url: "https://www.rkeene.org/files/oss/libopennet/libopennet-0.9.9.tar.gz"
  sha256: "d1350abe17ac507ffb50d360c5bf8290e97c6843f569a1d740f9c1d369200096"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies: []  # zero external deps: pure libc + POSIX/BSD sockets
  cc: clang
  cxx: clang++

patches_applied:
  - patch_file: "patches/0001-fix-fseek_net-self-recursion-and-uninit-length.patch"
    description: "upstream bug 1: fseek_net() calls itself instead of fseeko_net() -> infinite recursion; upstream bug 2: off_t length in fopen_net() left uninitialized, open_net_internal() never writes *length for local files -> flength_net() returns stack garbage"
  - patch_file: "patches/0002-configure-drop-umask-077-for-HMDFS-mktemp.patch"
    description: "E114: configure wraps confstat mktemp/mkdir in 'umask 077'; on HMDFS (setgid-forced dirs) the resulting 0700 temp dir is unwritable by the build user and config.status fails with 'can't create ./confstatXXX/...'"

upstream_tests: 0
upstream_test_notes: "Upstream has no formal test suite. 'make test' compiles test.c, which is a no-assertion demo that prints a given file's contents through the library (bare run dereferences argv[1] unchecked and crashes); it is run offline as a smoke test in build(), not counted as a formal test."

test_package:
  test_count: 4  # static/shared not double-counted; one binary covers all four scenarios
  tests:
    - file: test_package/test.c
      description: "1) local-file stdio API (fopen/fgets/fseek/ftell/fread/fclose_net) covering both patch-0001 regressions; 2) fd API (open/read_net + lseek_net stub assert); 3) OHOS AF_UNIX abstract-namespace socket via read_net (E461); 4) offline network API fopen_net(http://127.0.0.1:<port>) against a forked local HTTP server"

validation:
  local:
    - "python3 -m py_compile on conanfile.py and test_package/conanfile.py passed"
    - "conan create with OHOS host+build profile: static (default) full pipeline passed"
    - "conan create with OHOS host+build profile and shared=True: full pipeline passed"
    - "test_package ran on the OHOS build executor in both modes: all 4 consumer tests PASS, exit-code judged, no skip/timeout/fake pass"
    - "readelf ELF checks in test(): ELF64 + AArch64, NEEDED libopennet.so.0 for shared consumers / absent for static, RPATH/RUNPATH inspected"
    - "official source tarball sha256 verified: d1350abe17ac507ffb50d360c5bf8290e97c6843f569a1d740f9c1d369200096"
  remote: []  # single-package CI / PR pipeline not yet run
  pending:
    - "PR validation pipeline"
    - "remote upload"

knowledge_gained:
  - "Upstream 0.9.9 ships a 2004-era autoconf 2.59 configure with handwritten Makefile.in (no automake/libtool); in-source build required because the '%_shr.o: %.c' pattern rule has no VPATH support."
  - "Upstream Makefile always builds BOTH libopennet.a and libopennet.so; the conan 'shared' option only selects what the consumer links against and what gets packaged (so.0.9.9 real file + so.0/so symlinks mirroring upstream install)."
  - "Upstream SHOBJLDFLAGS carries no -soname; inject -Wl,-soname,libopennet.so.0 via LDFLAGS (E274) or the unversioned SONAME breaks the versioned symlink layout."
  - "Upstream test.c is a demo, not a test suite: no assertions, no exit-code semantics, bare argv[1] dereference crashes."
  - "Knowledge reused (path A, no new DRAFT): E007, E114, E232, E074, E274, E461, E298."
