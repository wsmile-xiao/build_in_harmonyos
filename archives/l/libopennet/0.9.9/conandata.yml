# conandata.yml — libopennet 0.9.9
sources:
  # 官方源 www.rkeene.org 的 TLS 证书 SAN 不含 www.rkeene.org（Hostname
  # mismatch → CERTIFICATE_VERIFY_FAILED，按规不关闭 SSL 校验）。MacPorts
  # distfiles 是官方 distfile 权威镜像，本机实测可达，tarball sha256 与
  # 官方源码完全一致，放首位优先使用；官方 URL 保留作 fallback。
  url:
    - "https://distfiles.macports.org/libopennet/libopennet-0.9.9.tar.gz"
    - "https://www.rkeene.org/files/oss/libopennet/libopennet-0.9.9.tar.gz"
  sha256: "d1350abe17ac507ffb50d360c5bf8290e97c6843f569a1d740f9c1d369200096"
patches:
  0.9.9:
    - patch_file: "patches/0001-fix-fseek_net-self-recursion-and-uninit-length.patch"
      patch_description: "Fix fseek_net() infinite self-recursion (calls itself instead of fseeko_net) and the uninitialized off_t length in fopen_net() that turns into stack garbage in flength_net()"
    - patch_file: "patches/0002-configure-drop-umask-077-for-HMDFS-mktemp.patch"
      patch_description: "E114: drop 'umask 077' from configure's confstat mktemp/mkdir lines so config.status temp dirs stay group-writable on HMDFS (setgid-forced dirs make 0700 dirs unwritable)"
