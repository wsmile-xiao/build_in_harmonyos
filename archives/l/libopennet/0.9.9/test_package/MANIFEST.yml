package: libopennet/0.9.9
homepage: "https://www.rkeene.org/oss/libopennet/"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_tests: []
upstream_test_notes: "Upstream test.c is a no-assertion demo (prints a given file's contents, bare run crashes on unchecked argv[1]); it has no exit-code semantics and is NOT a formal test suite. The recipe compiles and runs it offline in build() as a smoke test only (explicit argv[1], statically linked against the fresh libopennet.a)."

test_package_tests:
  - file: test.c
    description: "Local-file stdio API: fopen_net/fgets_net/fseek_net/ftell_net/fread_net/fclose_net against a written fixture — covers both patch-0001 regressions (fseek_net self-recursion; uninitialized length -> flength_net)."
    command: "libopennet-test <fixture> <sockname> <port>"
  - file: test.c
    description: "FD API: open_net/read_net/close on the fixture; asserts the real upstream lseek_net behavior (unconditional -1 stub) so a future upstream fix flips this test loudly."
    command: "libopennet-test <fixture> <sockname> <port>"
  - file: test.c
    description: "OHOS-specific (E461): AF_UNIX abstract-namespace socket served by a forked child, read through read_net() — HMDFS refuses file-socket bind (EPERM), /tmp is read-only erofs, /dev/shm EACCES, so the abstract namespace is the only OHOS-local form."
    command: "libopennet-test <fixture> <sockname> <port>"
  - file: test.c
    description: "Offline network API: fopen_net(\"http://127.0.0.1:39441/...\") against a forked local HTTP server child — loopback only, PASS never depends on public internet access."
    command: "libopennet-test <fixture> <sockname> <port>"

ohos_elf_checks:
  - "ELF64 + AArch64 machine type (readelf -h, assertion in test())"
  - "shared consumer: NEEDED contains libopennet.so.0 (by-SONAME); static consumer: NEEDED has no libopennet entry (readelf -d)"
  - "RPATH/RUNPATH inspected (readelf -d); shared by-soname NEEDED is resolved via conanrun LD_LIBRARY_PATH"

assertion_count: 35  # 23 die() + 11 FATAL/exit(1) checks + 1 argc guard in test.c
test_modes: "static and shared both run the same 4 tests via one binary; not double-counted (4 tests total)"
