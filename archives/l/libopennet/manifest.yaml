software: libopennet
display: "libopennet"
description: "stdio-like C library for transparently opening local files and http:// URLs"
category: network
homepage: "https://www.rkeene.org/oss/libopennet/"
license: "LGPL-2.1-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "Builds the official 0.9.9 tarball with its 2004-era configure + handwritten Makefile.in (in-source build, no VPATH in the %_shr.o rule)"
    - "Two required source patches: upstream fseek_net self-recursion + uninitialized length fix, and the HMDFS umask-077 configure fix (E114)"
    - "Injects -Wl,-soname,libopennet.so.0 (E274) and mirrors the upstream versioned symlink layout in the shared package"
    - "Knowledge reuse only (path A): E007, E114, E232, E074, E274, E461, E298 — no new DRAFT entries"
  common_dependencies: []  # pure libc + POSIX/BSD sockets, zero external dependencies

versions:
  "0.9.9":
    status: validated
    build_date: "2026-09-17"
    conan_ref: "libopennet/0.9.9"
    note: "static + shared conan create and 4 consumer tests PASS on the OHOS build executor; PR validation pipeline and remote upload pending"
