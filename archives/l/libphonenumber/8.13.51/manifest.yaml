version: "8.13.51"
software: "libphonenumber"
status: built
build_date: "2026-09-14"
build_system: cmake

source:
  url: "https://github.com/google/libphonenumber/archive/refs/tags/v8.13.51.tar.gz"
  sha256: "c96da523824546a91b4bd6753a54f2ab7f4979d87729407170b58066e245f5bc"
  tar_format: tar.gz

build:
  system: direct-cc (no CMake configure; validated clang++ compiles upstream sources and archives, critnib precedent)
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_GEOCODER=ON"
    - "-DREGENERATE_METADATA=OFF"
    - "-DUSE_BOOST=OFF"
    - "-DUSE_STDMUTEX=ON"
    - "-DUSE_ICU_REGEXP=ON"
    - "-DUSE_ALTERNATE_FORMATS=ON"
  dependencies:
    - abseil-cpp/20260107.1
    - protobuf/33.6
    - icu4c/78
    - googletest/1.12.1
    - zlib/1.3.1.2 (override: repo-exclusive makefile recipe, avoids foreign CMake revision shadowing zlib/1.3.1)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "C++ 构建入口在子目录 cpp/，conanfile 用 cmake.configure(build_script_folder=<source>/cpp)"
  - "REGENERATE_METADATA 必须 OFF，真机无 Java/Maven 构建元数据 jar，直接用源码树预生成文件"
  - "USE_BOOST=OFF + USE_STDMUTEX=ON 可砍掉整条 Boost 依赖链"
  - "上游无 FetchContent 网络回退依赖：absl 经 find_package(absl) 由 conan 的 abseil-cpp 提供"
  - "protobuf:with_zlib 恢复默认 True（周期5）：with_zlib=False 产生唯一包 ID，迫使预检源码构建；已发布 grpc/1.70.0 与已构建 brpc/1.17.0 均用默认 True，对齐已证图以复用二进制"
  - "E092 自身加固（周期5，brpc 同源）：OHOS 目标时 CMAKE_SYSTEM_NAME=Linux，绕开 CMake 4.4.3 缺 Platform/HarmonyOS 导致的本包 project() 编译器识别失败；工具链 clang/sysroot 不变"
  - "zlib 排他版本锁定（周期6）：zlib/1.3.1 被外部 CMake 配方 revision 遮蔽（其 build() 第 81 行 cmake.configure），override 到仓内独有 R37 版本 1.3.1.2（Makefile 构建、无 CMake 墙，9 月 8 日 make check 全过），强制走 ohpcd 仓内配方"
  - "本包 configure 执行层加固（周期7）：_export_writable_tmpdir 把可写根目录写入真实进程环境（不只 save_sh）；cmake.configure 追加 -DCMAKE_SYSTEM_NAME=Linux 覆盖工具链模板 CACHE 语义边界"
  - "策略周期4回退到 protobuf/33.6：周期3的 3.17.3 降级复跑指纹完全一致（自身 project() 编译器识别失败），证明失败与 protobuf 版本无关；33.6 为 OHOS 适配版且是已发布 grpc/1.70.0 在官方 CI 完整构建过的版本，3.17.3 的 2021 年配方另有 cmake_minimum_required(3.1.3) 与 CMake 4.4.3 的 E103 兼容风险"
  - "上游测试为单体 gtest 二进制 libphonenumber_test，解析 [PASSED]/[FAILED] 行输出机器证据"
