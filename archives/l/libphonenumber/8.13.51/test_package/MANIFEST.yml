package: libphonenumber/8.13.51
homepage: "https://github.com/google/libphonenumber"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "./libphonenumber_test"

upstream_tests:
  - file: test/phonenumbers/phonenumberutil_test.cc
    source: libphonenumber-8.13.51/cpp/test/phonenumbers/phonenumberutil_test.cc
    description: "Core PhoneNumberUtil parse/format/validate suite"
    command: "./libphonenumber_test --gtest_filter=PhoneNumberUtil*"
  - file: test/phonenumbers/shortnumberinfo_test.cc
    source: libphonenumber-8.13.51/cpp/test/phonenumbers/shortnumberinfo_test.cc
    description: "Short number info suite"
    command: "./libphonenumber_test --gtest_filter=ShortNumberInfo*"
  - file: test/phonenumbers/phonenumbermatcher_test.cc
    source: libphonenumber-8.13.51/cpp/test/phonenumbers/phonenumbermatcher_test.cc
    description: "Phone number matcher suite (ICU regexp)"
    command: "./libphonenumber_test --gtest_filter=PhoneNumberMatcher*"
  - file: test/phonenumbers/geocoding/phonenumber_offline_geocoder_test.cc
    source: libphonenumber-8.13.51/cpp/test/phonenumbers/geocoding/phonenumber_offline_geocoder_test.cc
    description: "Offline geocoder suite"
    command: "./libphonenumber_test --gtest_filter=*Geocoder*"

test_package_tests:
  - file: test.cpp
    description: "Parse, validate and E164-format a US number via the installed C++ API"
    command: "./test_libphonenumber"

assertion_count: 3
