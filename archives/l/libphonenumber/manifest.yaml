software: libphonenumber
display: "libphonenumber"
description: "Google 维护的国际电话号码解析、格式化与校验库（C++）"
category: library
homepage: "https://github.com/google/libphonenumber"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "C++ 构建入口在源码子目录 cpp/"
    - "REGENERATE_METADATA=OFF：使用预生成元数据，无需 Java"
    - "USE_BOOST=OFF + USE_STDMUTEX=ON：砍掉 Boost 依赖链"
    - "依赖 protobuf（protoc）、icu4c、abseil-cpp、googletest"
  common_dependencies:
    - abseil-cpp
    - protobuf
    - icu4c
    - googletest

versions:
  - version: "8.13.51"
    status: built
    build_date: "2026-09-14"
    notes: 首轮适配，未提交工作树，待真机预检回填实测数字
