package: libsoci/4.0.3
homepage: "https://github.com/SOCI/soci"

# 上游官方测试在 recipe 的 build() 里跑（CI 的 host/build profile 同为 ohos-aarch64
# → 原生构建 → 真跑；交叉构建时由 cross_building() 自动跳过）
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: test-sqlite3.cpp
    source: soci-4.0.3/tests/sqlite3/test-sqlite3.cpp
    description: "SQLite3 后端 65 个 catch 用例 / 1715 条断言（rowid、blob、date/time、transaction、procedure、type_conversion、connection_pool 等）"
    command: "ctest -R soci_sqlite3_test --output-on-failure"
  - file: test-empty.cpp
    source: soci-4.0.3/tests/empty/test-empty.cpp
    description: "empty 后端（零依赖）骨架用例，验证 SOCI 通用链路"
    command: "ctest -R soci_empty_test --output-on-failure"

test_package_tests:
  - file: test_libsoci.cpp
    description: "完整消费者用例（rule12）：SQLite3 后端 + 内存库 → 预编译语句 use 绑定写 1000 行 → 聚合 count/sum/avg → rowset/row 迭代与列元数据 → NULL 指示器 → 事务回滚/提交 → 参数化查询 → 非法 SQL 抛 soci_error → sqlite_api 版本与 sqlite_master 系统表，14 步可核对结果"
    command: "./test_libsoci"
  - file: test_layout.py
    description: "适配自检（M=13）：soci_core/soci_sqlite3/soci_empty 三个库、公开头文件、CMake 集成、许可、未夹带测试程序、soci-config.h 的 C++11 声明"
    command: "python3 test_layout.py <package_folder>"

assertion_count: 14
