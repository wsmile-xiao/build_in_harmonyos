patches:
  "4.0.3":
    - patch_file: "patches/0001-catch-urng-unsigned-result-type.patch"
      patch_description: >-
        Catch v1.9.6 (tests/catch.hpp) 的 RandomNumberGenerator::result_type 是
        有符号的 std::ptrdiff_t；OHOS 的 libc++ 会静态断言拒绝有符号 result_type 的
        URNG（LLVM D120630），导致 build() 里编译 tests/empty 与 tests/sqlite3 目标失败。
        改为 unsigned int（与 min()=0/max()=1000000 一致），不改变洗牌语义。
      patch_type: "portability"
