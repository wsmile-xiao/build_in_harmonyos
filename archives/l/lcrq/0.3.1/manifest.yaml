# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.1"

# 软件名
software: "lcrq"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://git.sr.ht/~librecast/lcrq/archive/v0.3.1.tar.gz"

  # 源码校验和
  sha256: "c98e4f51586a05639962217e6ef79bc4197cd983a2af609863eb0839b24bf70d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--srcdir=.  # in-source 构建；跳过 configure 对 srcdir 的 fork 依赖探测（CI fork OOM 会产生 'cannot find sources'）"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（仅登记已入库的正式图谱条目）
knowledge_gained:
  - "E007: config.guess 2022 版无法识别 HarmonyOS，patch-autotools-ohos.pl 打补丁后 config.sub 仍拒绝 linux+ohos 内核组合，需额外在 kernel-os 校验表加 linux-ohos* (ref: E007)"
  - "E129/E114: configure 内嵌的 config.status 用 `umask 077 && mktemp -d \"./confXXXXXX\"` 建临时目录，HMDFS 强制 setgid 后该目录（drwx--S---）在 CI worker 上不可写 → `subs1.awk: Permission denied` + `could not setup config files machinery`；修复 umask 077→022 (ref: E129, E114)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

# submission.py:_scan_knowledge_ref() 只读**顶层** knowledge_ref（356 个既有包在用），
# knowledge_gained 逐项内的 (ref: ...) 标签不进 PR 正文的「使用知识库」字段。
knowledge_ref:
  - "E007"
  - "E129"
  - "E114"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/cache/builds/lcrq-0.3.1.orig
  source_work_dir: /data/storage/el2/base/cache/builds/lcrq-0.3.1.work
  source_orig_hash: 8c2af860a0dd4d34
  source_work_hash: 611eaba47acb5ec4
  generated_at: '2026-09-19T23:07:44'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
