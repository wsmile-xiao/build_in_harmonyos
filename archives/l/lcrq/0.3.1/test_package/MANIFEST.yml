# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lcrq/0.3.1
homepage: "https://librecast.net/lcrq.html"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test/*.c 编译为 *.test，2026-09-19 OHOS 本机实测）
# 命令: PATH=/system/bin:$PATH LD_LIBRARY_PATH=<src>/src make test → 19 tests run
# 结果: 18 OK / 0 FAIL / 1 SKIP（0000-0024 需 x86 SSSE3，arm64 正确跳过）
# 日志: archives/l/lcrq/0.3.1/reports/04-make-test.log + 05-upstream-testlog.txt
# 修复后复验（E129 umask + --srcdir=.，2026-09-19 22:52）：同样 19 run / 18 OK / 0 FAIL / 1 SKIP
# 日志: reports/04b-make-test-umask-fix.log + 05b-upstream-testlog-umask-fix.txt
upstream_tests:
  - file: test/0000-0000.c
    source: lcrq-0.3.1/test/0000-0000.c
    description: "4.3 Calculate & verify encoding parameters"
    command: "./0000-0000.test"
  - file: test/0000-0001.c
    source: lcrq-0.3.1/test/0000-0001.c
    description: "3.3 FEC Object Transmission Information (OTI)"
    command: "./0000-0001.test"
  - file: test/0000-0002.c
    source: lcrq-0.3.1/test/0000-0002.c
    description: "5.3.5.1 Random Number Generator"
    command: "./0000-0002.test"
  - file: test/0000-0003.c
    source: lcrq-0.3.1/test/0000-0003.c
    description: "5.3.5.2 Degree Generator"
    command: "./0000-0003.test"
  - file: test/0000-0005.c
    source: lcrq-0.3.1/test/0000-0005.c
    description: "5.3.5.4 Tuple Generator"
    command: "./0000-0005.test"
  - file: test/0000-0010.c
    source: lcrq-0.3.1/test/0000-0010.c
    description: "5.3.3.3 check LDPC codes"
    command: "./0000-0010.test"
  - file: test/0000-0011.c
    source: lcrq-0.3.1/test/0000-0011.c
    description: "5.3.3.3 check HDPC codes"
    command: "./0000-0011.test"
  - file: test/0000-0019.c
    source: lcrq-0.3.1/test/0000-0019.c
    description: "5.3.3.4 Intermediate Symbol Generation + 5.3.4 Encoding"
    command: "./0000-0019.test"
  - file: test/0000-0020.c
    source: lcrq-0.3.1/test/0000-0020.c
    description: "5.4.2.2 RFC Decoder"
    command: "./0000-0020.test"
  - file: test/0000-0021.c
    source: lcrq-0.3.1/test/0000-0021.c
    description: "Decoding Schedule replay"
    command: "./0000-0021.test"
  - file: test/0000-0022.c
    source: lcrq-0.3.1/test/0000-0022.c
    description: "Intermediate Symbol + Original Symbol Regeneration"
    command: "./0000-0022.test"
  - file: test/0000-0023.c
    source: lcrq-0.3.1/test/0000-0023.c
    description: "PID/SBN/ESI bitshifting macros"
    command: "./0000-0023.test"
  - file: test/0000-0024.c
    source: lcrq-0.3.1/test/0000-0024.c
    description: "(skipped) Galois Field 256 SIMD (SSSE3) multiplication — requires x86 SSSE3, correctly skipped on aarch64"
    command: "./0000-0024.test"
  - file: test/0000-0025.c
    source: lcrq-0.3.1/test/0000-0025.c
    description: "F = 0"
    command: "./0000-0025.test"
  - file: test/0001-0000.c
    source: lcrq-0.3.1/test/0001-0000.c
    description: "Matrix Multiply (GF256)"
    command: "./0001-0000.test"
  - file: test/0001-0001.c
    source: lcrq-0.3.1/test/0001-0001.c
    description: "Matrix Inverse"
    command: "./0001-0001.test"
  - file: test/0001-0002.c
    source: lcrq-0.3.1/test/0001-0002.c
    description: "Matrix Submatrix"
    command: "./0001-0002.test"
  - file: test/0001-0003.c
    source: lcrq-0.3.1/test/0001-0003.c
    description: "Matrix LU Decompose + Inverse"
    command: "./0001-0003.test"
  - file: test/0001-0004.c
    source: lcrq-0.3.1/test/0001-0004.c
    description: "Matrix LU Solve"
    command: "./0001-0004.test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: rq_init/rq_F/rq_T/rq_oti/rq_encode/rq_symbol/rq_decode 编码-解码回环校验"
    command: "./test_lcrq"
  - file: test_ohos.c
    description: "鸿蒙特有测试: OHOS musl 加载器(/lib/ld-musl-aarch64.so.1) + uname.machine=aarch64 + LP64 断言，并独立参数(F=4096/T=32)执行 rq_init/rq_encode/rq_symbol/rq_decode 回环"
    command: "./test_lcrq_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 35
