software: lcrq
display: "lcrq"
description: "RaptorQ (RFC6330) 前向纠错库：系统化编解码、OTI 导出/反解、q 任务队列（Librecast Project）"
category: library
homepage: "https://librecast.net/lcrq.html"
license: "GPL-2.0-only OR GPL-3.0-only"
build_system: autotools

ohos_adaptation:
  key_points:
    - "librecast 0.11.2 的硬链接依赖（无条件 LIBS += -llcrq），按一库一分支先行适配"
    - "纯 C 无外部依赖；aarch64 走上游 NEON 实现（matrix_neon.o + gf256_simd.o）"
    - "仅共享库 liblcrq.so（SONAME liblcrq.so.0.0）；Makefile 非 VPATH 感知需 in-tree 构建"
    - "config.guess/sub 需 HarmonyOS 三元组补丁；install 裁剪 doc/man；ln -sf 改 cp -f"
    - "20 个上游测试为纯算法，真机可全量运行"
  common_dependencies: []

versions:
  "0.4.1":
    status: pending
    build_date: "2026-09-20"
    license: "GPL-2.0-only OR GPL-3.0-only"
    source: "https://codeberg.org/librecast/lcrq/archive/v0.4.1.tar.gz"
