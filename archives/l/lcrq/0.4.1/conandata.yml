# conandata.yml — lcrq 0.4.1
# 上游未发布独立 release tarball（Codeberg/GitHub 均无 release assets），
# 源码取自官方 Codeberg 仓库 v0.4.1 tag 自动归档（权威官方源，符合 R39）。
sources:
  url: "https://git.sr.ht/~librecast/lcrq/archive/v0.4.1.tar.gz"
  sha256: "86cedb67161063988deb3ebf306cf3738b8bc499e00adf8877a6ab0c0433dbc7"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess 增加 HarmonyOS 系统识别分支（aarch64-unknown-linux-ohos）"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub 增加 ohos-linux 三元组与 ohos* OS 类型"
    patch_type: "portability"
  - patch_file: "patches/0003-Makefile.in-drop-doc-from-install.patch"
    patch_description: "顶层 install 去掉 doc 前置与 doc 子构建：man 页安装使用裸 install 且对 OHOS 无意义（对齐 librecast/libfec 先例）"
    patch_type: "portability"
  - patch_file: "patches/0004-src-Makefile.in-symlink-free-soname.patch"
    patch_description: "src/Makefile.in soname 别名（liblcrq.so.0.0/.so.0/.so）由 ln -sf 改为 cp -f，规避真机符号链接受限（避坑指南 #15）"
    patch_type: "portability"
  - patch_file: "patches/0005-test-Makefile.in-maketest-ln-to-cp.patch"
    patch_description: "test/Makefile.in maketest 的 lastlog 日志别名由 ln -sf 改为 cp -f（HMDFS 符号链接受限）"
    patch_type: "portability"
  - patch_file: "patches/0006-Makefile.in-test-all-to-maketest.patch"
    patch_description: "顶层 test 转发由 test/all 改为 maketest：tar 归档中 test/all 为符号链接目录，HMDFS 解包时被跳过成空目录，原路径会 0 用例空转"
    patch_type: "portability"
  - patch_file: "patches/0007-configure-configstatus-tmp-umask.patch"
    patch_description: "configure 及其内嵌 config.status 模板的临时目录 umask 077→002：HMDFS 上 700 目录对构建进程不可读（libfec E046 先例）"
    patch_type: "portability"
