# test_package/MANIFEST.yml — lcrq 0.4.1
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lcrq/0.4.1
homepage: "https://librecast.net/lcrq.html"

# 上游测试命令：顶层 make test → test/ 目录 20 个独立可执行用例（maketest runner）
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际测试程序（test/????-????.c 共 20 个；0000-* = RaptorQ 编解码/参数/系统；
# 0001-* = q 队列。纯算法，无网络依赖。列出代表用例，全量清单见源码 test/ 目录。）
upstream_tests:
  - file: 0000-0000.c
    source: lcrq/test/0000-0000.c
    description: "RaptorQ 基础编解码往返"
    command: "make -C test test/all（runner 统一运行）"
  - file: 0000-0001.c
    source: lcrq/test/0000-0001.c
    description: "RaptorQ 参数域测试"
    command: "make -C test test/all"
  - file: 0000-0010.c
    source: lcrq/test/0000-0010.c
    description: "RaptorQ symbol/块映射测试"
    command: "make -C test test/all"
  - file: 0001-0000.c
    source: lcrq/test/0001-0000.c
    description: "q 队列创建/销毁"
    command: "make -C test test/all"
  - file: 0001-0004.c
    source: lcrq/test/0001-0004.c
    description: "q 队列收发路径"
    command: "make -C test test/all"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：rq_init/rq_oti 生命周期 + OTI F/T 反解往返 + rq_F/rq_T/rq_Z/rq_N/rq_K 参数查询 API"
    command: "./test_lcrq"

# 测试断言总数（近似值, grep test_assert/test_expect 族统计）
assertion_count: 146
