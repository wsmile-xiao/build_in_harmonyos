# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfreefare/0.4.0
homepage: "https://github.com/nfc-tools/libfreefare"

# 上游测试命令
# libfreefare 0.4.0 单测基于 Cutter 框架（AC_CHECK_CUTTER，要求 >= 1.1.7）。
# 本环境无 Cutter：configure 探测不到 -> WITH_CUTTER=no -> test/Makefile 不构建
# 任何 cutter 用例，make check 的 TESTS 目标为空（0 用例）。
# 即使装上 Cutter，test/ 下 fixture 仍依赖物理 NFC 读卡器。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游单测程序（test/*.la，运行需 Cutter + 物理 NFC 设备，双重硬阻塞）
upstream_tests:
  - file: test_mad.c
    source: libfreefare-0.4.0/test/test_mad.c
    description: "MAD (Mifare Application Directory) 测试（Cutter+设备硬阻塞）"
    command: "./test_mad"
  - file: test_mifare_application.c
    source: libfreefare-0.4.0/test/test_mifare_application.c
    description: "MIFARE Application 测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_application"
  - file: test_mifare_classic.c
    source: libfreefare-0.4.0/test/test_mifare_classic.c
    description: "MIFARE Classic 测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_classic"
  - file: test_mifare_classic_create_trailer_block.c
    source: libfreefare-0.4.0/test/test_mifare_classic_create_trailer_block.c
    description: "Classic 尾块构造测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_classic_create_trailer_block"
  - file: test_mifare_classic_sector_boundaries.c
    source: libfreefare-0.4.0/test/test_mifare_classic_sector_boundaries.c
    description: "Classic 扇区边界测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_classic_sector_boundaries"
  - file: test_mifare_desfire.c
    source: libfreefare-0.4.0/test/test_mifare_desfire.c
    description: "DESFire 测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_desfire"
  - file: test_mifare_desfire_aes.c
    source: libfreefare-0.4.0/test/test_mifare_desfire_aes.c
    description: "DESFire AES 测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_desfire_aes"
  - file: test_mifare_desfire_aid.c
    source: libfreefare-0.4.0/test/test_mifare_desfire_aid.c
    description: "DESFire AID 测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_desfire_aid"
  - file: test_mifare_desfire_des.c
    source: libfreefare-0.4.0/test/test_mifare_desfire_des.c
    description: "DESFire DES 测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_desfire_des"
  - file: test_mifare_desfire_ev1.c
    source: libfreefare-0.4.0/test/test_mifare_desfire_ev1.c
    description: "DESFire EV1 测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_desfire_ev1"
  - file: test_mifare_desfire_key.c
    source: libfreefare-0.4.0/test/test_mifare_desfire_key.c
    description: "DESFire Key 测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_desfire_key"
  - file: test_mifare_ultralight.c
    source: libfreefare-0.4.0/test/test_mifare_ultralight.c
    description: "MIFARE Ultralight 测试（Cutter+设备硬阻塞）"
    command: "./test_mifare_ultralight"
  - file: test_tlv.c
    source: libfreefare-0.4.0/test/test_tlv.c
    description: "TLV 编解码测试（Cutter+设备硬阻塞）"
    command: "./test_tlv"

# test_package 中自带的测试（消费者视角，无设备可运行）
test_package_tests:
  - file: test.c
    description: "消费者测试：Classic 扇区几何/AID/DES·AES key/MAD/TLV 往返纯计算断言"
    command: "./test_libfreefare"

# 测试断言总数 (近似值)
assertion_count: 11
