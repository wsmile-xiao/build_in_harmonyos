knowledge_gained:
  - "letta-code 为 npm 预构建 Node.js CLI：上游用 bun 打包出单文件 letta.js，无本地编译步骤，配方直接打包 libexec + bin launcher（+ 一个构建期编译的启动 trampoline）"
  - "letta.js 内静态 bare import 仅 ws 未打平，需 vendor ws 8.19.0（sha256 7fb02dae000a91ccd9d2ae51cda3672ab6c1685ecd26e07c668996ce52e25609）；node-pty/sharp 走动态 require 降级，不 vendor"
  - "launcher 的 unset LD_LIBRARY_PATH 在 /system/bin/sh 下并未把变量从交给子进程的环境里摘掉（实测 unset 后真实 JS 仍崩）；LD_LIBRARY_PATH= 置空同样致命；只有 env -u 才是真剥离——必须解析一个支持 -u 的 env，否则显式失败，不能静默继承污染"
  - "仅 env -u 真剥离并不足以让 node 在本机启动：V8 的 CodeRange 虚拟内存预留会失败并以非 ENOMEM errno 命中 Check failed: 12 == (*__errno_location())（Signal 5 / exit 133）；node 直连系统 shell 必崩，先经用户文件系统上的可执行文件再 exec node（或关闭 ASLR）即正常"
  - "node --version 不初始化 V8，污染环境下也『正常』——不可作为验证手段（假绿）；一切验证都必须跑真实 JS"
  - "build() 冒烟必须跑真 launcher 且复现消费端调用深度（多一层 /bin/sh -c）+ 继承污染环境，否则用 Python 直起 node 会得到假绿，无法拦截剥离失效类回归"
  - "--jitless 下 WASM 不可用（yoga-layout 为 ink UI 启动必需）→ 必须保持 JIT，不能以 --jitless 规避平台崩溃"
  - "上游 553 个 *.test.* 测试文件（bun:test）= 541 *.test.ts + 12 *.test.tsx；按运行口径拆为白名单 24 目录 433 + src/channels 82 + src 根级 31，另有 19 个 isolated 与 2 个非 src；src/integration-tests（8 个文件）被 API 门控排除；测试源码不随 npm 发布物分发"
  - "声明上游测试/接口面数量时必须多口径穷举并取最大口径（全库文件数 > 运行器白名单范围 > 单目录），否则会命中 rule4『少报』：本次初版只按运行器目录口径表述、且 test_package 只查 6 个命令（11 条断言），被判『上游实测 N=29 > 声明 N=8』；修订为接口面全覆盖（53 条断言）+ 清点多口径穷举"
  - "bun 有官方 musl aarch64 变体 @oven/bun-linux-aarch64-musl（实测 1.4.2，sha1 1f2116082cc8d58d76de3536a2b0b6d73a413521，INTERP=/lib/ld-musl-aarch64.so.1）——『上游 bun 是 glibc 链接、OHOS 是 musl 所以跑不了』是不充分且已被推翻的旧结论"
  - "OHOS 真机 /storage（tmpfs，挂载参数 hmmac=use_task）实测：execve 对非本会话产出的二进制一律 EACCES(13)，而同目录本机编译产物（静态/动态 ET_EXEC、ET_DYN PIE，18KB–70MB）与自写脚本可执行；干净 inode 原地覆盖 / 硬链接 / --strip-all / 去 note 均无法绕过；memfd+execveat(AT_EMPTY_PATH)→ENOENT、execve(/proc/self/fd/N)→EACCES；本机 72MB 非 ELF 文件→ENOEXEC(8)（可区分『被 exec 策略拒』与『内容非法』）；可写目录仅 /storage，trusted.* setxattr→EPERM → 任何外部产出的运行时（bun 的两个官方变体、glibc loader）在本环境都不可运行"
  - "package() 不得打包与 source 目录同级的 conan 构建产物（build 目录 / conaninfo.txt / conan*.sh）——必须显式排除，否则构建缓存入产物"

