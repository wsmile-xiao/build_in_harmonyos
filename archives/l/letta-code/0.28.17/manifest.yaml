  files_run: 546               # runner 白名单实际执行文件数（24 目录 433 + src/channels 82 + src 根级 31）
  cases_run: 4818
  cases_passed: 4777
  cases_failed: 14
  cases_pass_rate: "99.15%"
  hang_files: 0
  run_date: "2026-09-28"
  source_commit: "c9a66725b0cdc8386d2496cb373f08ca642feda0"
  host_validation: pass_node_bun_test_shim_real_run
  unrunnable_reason: >-
    背景（已解决，不再阻塞）：本机 OHOS musl aarch64 上 execve 对"非本会话产出"的二进制一律 EACCES(13)——
    官方 @oven/bun-linux-aarch64-musl@1.4.2（sha1 1f2116082cc8d58d76de3536a2b0b6d73a413521，72.6MB）、
    glibc 变体（99.9MB）、Debian libc6 的 ld-linux-aarch64.so.1(203KB)、/system/bin/sh 副本(306KB) 全部 EACCES；
    而同目录本机 clang 编译的 18KB–70MB 产物与自写脚本均可执行，stat 与 listxattr 完全一致。
    已排除的干扰因素：干净 inode 原地覆盖、硬链接、--strip-all、去 note、memfd+execveat、trusted.* setxattr 均无效；
    可写目录仅 /storage（tmpfs，hmmac=use_task）。故 bun 在本机不可启动。
    解决：不依赖 bun 二进制，用 node（>=22.19，系统运行时）+ ESM loader 模拟 bun:test 真实执行全部白名单测试——
    2026-09-28 实测 546 文件 / 4818 用例 / 4777 通过 / 14 失败 / 99.15% / 0 HANG。
    14 个失败用例全部为沙箱环境差异（无 /bin/bash、无 PTY、ICU 时区、websocket 5s 超时等），
    技术原因明细见 upstream-tests/README.md「失败用例技术原因」表。

