package: letta-code/0.28.17
homepage: "https://github.com/letta-ai/letta-code"

upstream_check_command: "bun run scripts/run-unit-tests.cjs"
upstream_test_in_build: false
upstream_test_command: "bun run scripts/run-unit-tests.cjs"

# ── 上游测试（R51 三步法）声明 ────────────────────────────────────────────────
# 执行体：bun 运行时本身（bun:test），上游 package.json 的 packageManager = bun@1.3.0；
# 驱动脚本 scripts/run-unit-tests.cjs（24 个目录白名单，src/integration-tests 因 API 门控排除）。
# 未集成进 build()：npm 发布物只含构建产物、不含 src/ 测试源码，需另取上游 tag 源码才能得到测试。
# 目标平台实测（OHOS musl aarch64 真机，HongMeng Kernel 1.12.0）：本机 execve 对"非本会话产出"的
# 二进制一律 EACCES(13) —— 官方 @oven/bun-linux-aarch64-musl@1.4.2（sha1
# 1f2116082cc8d58d76de3536a2b0b6d73a413521，72.6MB，INTERP=/lib/ld-musl-aarch64.so.1）与 glibc 变体、
# Debian libc6 的 ld-linux-aarch64.so.1、/system/bin/sh 副本全部被拒；而同目录本机 clang 编译产物
# （静态/动态 ET_EXEC、ET_DYN PIE，18KB–70MB）与自写脚本可执行（stat/listxattr 逐字段一致）。
# → 上游 bun:test 在目标平台 0 运行：cases_run = 0、cases_passed = 0，不虚报通过率。
# 对照矩阵与逐条排除实验见 notes.md「上游测试清点与验证」；manifest.yaml 的
# upstream_tests.host_validation / unrunnable_reason 记录同一结论。
# 补跑方式：在允许执行下载产物的 glibc/musl 主机上 `bun run scripts/run-unit-tests.cjs`
# （源码取自 commit c9a66725b0cdc8386d2496cb373f08ca642feda0）。

upstream_tests:
  - file: "src/**/*.test.*"
    source: "letta-code-0.28.17/src/"
    description: >-
      Upstream Bun unit tests discovered by scripts/run-unit-tests.cjs, counted exhaustively at file
      level on the upstream tag v0.28.17 (commit c9a6672) so the declared number is >= every counting
      method: 553 *.test.* under src/ (541 *.test.ts + 12 *.test.tsx); by runner scope 433 in the 24
      allow-listed dirs + 82 in src/channels + 31 at the src/ root (the runner walks those three sets);
      src/integration-tests (8 files, API-gated) is excluded by the upstream runner itself; 19 files are
      driven in their own process via scripts/isolated-unit-tests.json; 2 further *.test.* live outside
      src/. The published npm tarball ships the runner but not src/, so upstream tests are not re-run
      during the build and no executed count is claimed (cases_run = 0).
    command: "bun run scripts/run-unit-tests.cjs"

test_package_tests:
  - file: test.sh
    description: >-
      Executes the packaged letta CLI for real and checks the complete documented CLI surface read from
      the real --help output, section by section (not from a copied string): 3 section headers
      (USAGE/OPTIONS/SUBCOMMANDS), all 21 USAGE command lines, all 27 SUBCOMMANDS entries, plus the
      exact --version banner. Surface counted from the help template of the delivered bundle:
      usage_lines: 21, subcommands: 27.
    command: "/system/bin/sh test.sh"

# 11 -> 53 (2026-09-27, rule4 复核修订)：初版 test.sh 只查 6 个命令/9 处片段，被 rule4 判「少报」
# (上游实测接口面 29+ > 声明 8)；现按上游 --help 的可验证接口面全覆盖，且断言数自检。
assertion_count: 53
