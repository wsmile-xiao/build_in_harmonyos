software: libxext
display: "X.Org X Extension Library"
description: "X11 miscellaneous extensions library"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxext"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Uses the release Autotools files without source patches"
    - "Uses only the direct libx11 and xorgproto Conan dependencies"
    - "Preserves the upstream libXext.so.6 ABI and extension headers"
  common_dependencies:
    - libx11
    - xorgproto

versions:
  "1.7.0":
    status: published
    build_date: "2026-05-20"
    upstream_identity: invalid
    supersession_eligible: false
    note: "Legacy publication fact only; the ref used a moving master snapshot and is not an X.Org stable release"
  "1.3.7":
    status: built
    build_date: "2026-08-20"
    conan_ref: "libxext/1.3.7"
    note: "Highest stable upstream release; formal publication remains pending"
