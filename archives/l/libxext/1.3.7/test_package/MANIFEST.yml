package: "libxext/1.3.7"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxext"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The release Makefile.am files declare no TESTS, check_PROGRAMS,
  check-local, or custom test target.

test_package_tests:
  - id: "sync-value-contract"
    source: "sync_value_contract.c"
    command: "libxext_sync_value_contract"
    description: >-
      Exercise all 16 display-independent public XSync 64-bit value APIs with
      exact signed, comparison, arithmetic, overflow, and boundary oracles.
  - id: "extension-registry-contract"
    source: "registry_contract.c"
    command: "libxext_registry_contract"
    description: >-
      Allocate and destroy an extension registry and round-trip the public
      extension error-handler registration API without a Display.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 23
