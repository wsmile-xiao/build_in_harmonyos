package: liquidsfz/0.4.1
homepage: https://github.com/swesterfeld/liquidsfz
upstream_tests_exist: true
upstream_test_in_build: true
upstream_check_command: make check -j1
upstream_test_audit:
  upstream_test_source_files: 12
  executed_functional_cases: 20
  synthesis_groups: 10
  sfz_parser_inputs: 10
  declared_automake_entries: 2
  selected_automake_entries: 2
  reason: "Both registered upstream tests exercise SFZ parsing and sample synthesis without JACK, LV2, or FFTW."
upstream_tests:
  - file: tests/testsynth.cc
    source: tests/Makefile.am
    description: "10 executed non-FFTW synthesis groups; parameter loops are not counted separately"
    count: 10
  - file: tests/testsfzreader.cc
    source: tests/Makefile.am
    description: "10 begin_test/end_test parser inputs, each checked against expected output"
    count: 10
test_package_tests:
  - file: src/test_liquidsfz.cpp
    description: "Generate a WAV, load it through SFZ, render a note and verify nonzero audio"
    count: 1
  - file: src/test_liquidsfz_ohos.cpp
    type: ohos_specific
    platforms: [OHOS]
    description: "Signed HarmonyOS aarch64 execution; HMDFS mkdtemp group-access workaround; UTF-8/spaced SFZ path and relative WAV sample; finite nonzero stereo rendering"
    count: 1
ohos_specific_tests:
  count: 1
  executable: test_liquidsfz_ohos
  check_command: "conan test test_package liquidsfz/0.4.1@ohpcd/stable -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
  note: "Same case as the ohos_specific test_package entry above; do not count it twice."
assertion_count: 11
assertion_count_note: "3 generic consumer failure checks and 8 OHOS-specific failure checks; functional-case totals remain 1 generic + 1 OHOS-specific."

# Inventory is separate from the functional-case count above.
upstream_test_source_inventory:
  automatic: [tests/testsynth.cc, tests/testsfzreader.cc]
  manual_diagnostics: [tests/testcurve.cc, tests/testenvelope.cc, tests/testxf.cc, tests/testfilter.cc, tests/testhydrogen.cc, tests/testliquid.cc, tests/testmidnam.cc, tests/testperf.cc]
  optional_fftw: [tests/testupsample.cc]
  scipy_code_generator: [tests/gen-upsample.py]
unexecuted_scope:
  manual_diagnostics: "Not registered in Automake TESTS; manual tools require parameters, input fixtures or interpretation of generated diagnostic output. testcurve has deduplication assertions but was not executed in this verification."
  optional_fftw: "--without-fftw sets HAVE_FFTW=0: testupsample is not built; testsynth tiny_loop, wav_loop, pitch, width and FFT-only assertions are not executed."
  scipy_code_generator: "SciPy FIR coefficient generator, not a PASS/FAIL test; not executed."
