# 版本级 manifest — luacxx 4.0.0
# 遵循 ARCHIVE-SPEC v2.0

version: "4.0.0"
software: luacxx
status: built
build_date: "2026-09-28"
build_system: cmake

source:
  url: "https://github.com/dafrito/luacxx/archive/refs/tags/v4.0.0.tar.gz"
  sha256: "80b838f5d0309ed6dee79f62b9fa0040eb2f11f59fb43bf20a4ee9d42f559c38"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_CXX_STANDARD=20"
    - "-DLUACXX_BUILD_TESTS=ON"
  dependencies:
    - lua/5.4.8
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-include-luacxx-convert-callable.hpp.patch"
  - "0003-tests-luacxx_without_conversions.cpp.patch"
  - "0004-tests-main.cpp.patch"

knowledge_gained:
  - "Boost.Test 在 OHOS 需用 header-only 入口（boost 制品缺 unit_test_framework 库）"
  - "C++ 异常无法穿过无 unwind tables 的纯 C Lua 边界时，在闭包入口 try/catch 并转 lua_error"
  - "lua conan 包缺 lua.hpp，需生成 extern C 包装头"