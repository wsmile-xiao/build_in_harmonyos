      patch_description: "Convert lua::error thrown inside std::function closures to a Lua error via lua_error so exceptions can cross the C Lua boundary on OHOS."
      patch_type: "portability"
    - patch_file: "patches/0003-tests-luacxx_without_conversions.cpp.patch"
      patch_description: "Use the header-only Boost.Test entry point (boost/test/included/unit_test.hpp)."
      patch_type: "portability"
    - patch_file: "patches/0004-tests-main.cpp.patch"
      patch_description: "Use the header-only Boost.Test entry point (boost/test/included/unit_test.hpp)."
