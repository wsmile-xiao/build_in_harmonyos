# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: luacxx/4.0.0
homepage: "https://github.com/dafrito/luacxx"

# 上游测试命令 (cmake 构建 + ctest)
upstream_check_command: "cmake --build . -j1 && ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./luacxx_test_main && ./luacxx_test_without_conversion"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/main.cpp
    source: luacxx-4.0.0/tests/main.cpp
    description: "Core luacxx API tests (33 Boost.Test cases: push/get, call, error handling, userdata, enums, algorithms)"
    command: "./luacxx_test_main"
  - file: tests/luacxx_without_conversions.cpp
    source: luacxx-4.0.0/tests/luacxx_without_conversions.cpp
    description: "LUACXX_AUTO_METATABLE mode without conversions (1 Boost.Test case)"
    command: "./luacxx_test_without_conversion"
  - file: tests/ohos_specific_test.cpp
    source: luacxx-4.0.0/tests/ohos_specific_test.cpp
    description: "HarmonyOS-specific validation test (round trip on aarch64 OHOS)"
    command: "./ohos_specific_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.cpp
    description: "消费者用例：仅通过公开头/API 使用 luacxx（Lua state、值转换、C++ 函数注册、Lua 往返调用、表访问）"
    command: "./test_luacxx"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40