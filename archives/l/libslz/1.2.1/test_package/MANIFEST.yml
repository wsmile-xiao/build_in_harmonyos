# test_package/MANIFEST.yml — libslz/1.2.1
# CI L0e 要求该文件存在（声明上游测试来源与消费者测试）

package: libslz/1.2.1
homepage: "https://github.com/wtarreau/libslz"

# ── 上游测试：v1.2.1 无任何可运行测试入口 ──────────────────────────
# 清点证据（R51，取候选数法最大值）：
#   ① 框架注册数：上游 Makefile 无 test/check 目标（grep -E '^(test|check)' 0 命中）
#   ② 源码宏数：src/ 与 tools/ 内无测试宏/断言注册（grep 测试宏 0 命中）
#   ③ tests/ 目录 3 个文件均为数据夹具（daniels.html / index.html / noncomp.bin），非用例
#   ④ 上游 HEAD（master）新增 tests/*.c|*.sh 测试程序，但 Makefile 同样无构建注册，且不在 v1.2.1 内
# → N = 0（可运行测试入口 0 个），差额逐项归因如上；详见 notes.md §上游测试清点
upstream_check_command: "无（上游 v1.2.1 未提供测试入口）"
upstream_test_in_build: false
upstream_test_command: "n/a"
upstream_tests: []

# ── 适配后（补全）测试 ─────────────────────────────────────────────
test_package_tests:
  - file: test_package/test.c
    description: "libslz C API 消费者断言：三格式 slz_init/slz_encode/slz_finish、gzip 封套（magic/ISIZE/CRC32 trailer）、zlib 封套（CMF/FLG/Adler32 trailer）、CRC32/Adler32 标准测试向量、level 0 压缩路径、产物落盘（21 条）"
    command: "conan create（test_package 编译并运行 test_slz <build_folder>）"
  - file: test_package/roundtrip.py
    description: "独立解码器 round-trip：python 标准库 zlib 解码 libslz C API 与已打包 zenc 二进制共 9 份输出并逐字节比对原始输入，另对 gzip 位流跑已打包 zdec dump 校验（10 条）"
    command: "python3 roundtrip.py <build_folder>"
  - file: test_package/check_asserts.py
    description: "断言汇总把关：ASSERT_TOTAL 必须为 31 且 fail=0，否则 test() 失败"
    command: "python3 check_asserts.py <build_folder>/c-assert.log <build_folder>/py-assert.log"

assertion_count: 31
