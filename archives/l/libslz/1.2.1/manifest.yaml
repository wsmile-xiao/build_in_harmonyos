# 版本级 manifest — libslz 1.2.1
# 遵循 ARCHIVE-SPEC v3.0（knowledge/ARCHIVE-SPEC.md §2.2）

version: "1.2.1"
software: libslz

# 编译状态：published | built | failed | archived
# O5：只有合并后 release upload 已确认才 published，本任务按 built 上报
status: built
build_date: "2026-09-25"
conan_ref: "libslz/1.2.1"
build_system: makefile

source:
  url: "https://github.com/wtarreau/libslz/archive/v1.2.1.tar.gz"
  sha256: "c1fa88556e97541a550e59fd1f0fc8f6b4c02444b14c13eb553c9827123122c5"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'make -j1 CC=<clang> AR=<llvm-ar> CFLAGS="-O3 -fomit-frame-pointer -Wall -g" static tools'
    - 'make -j1 CC=<clang> AR=<llvm-ar> CFLAGS="-O3 -fomit-frame-pointer -Wall -g" shared   # 仅 shared=True'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "裸 Makefile（无 configure）配方：编译器从 tools.build:compiler_executables 整体取 dict 再索引，make 在 cwd=self.source_folder 执行，CC/AR 在命令行覆盖上游硬编码的 gcc/ar — knowledge_ref: E392"
  - "不走 make install：上游 install-tools 目标执行 $(STRIP) zenc，HarmonyOS strip 破坏 .codesign 报 EPERM，package() 直接 copy 产物 — knowledge_ref: knowledge/drafts/DRAFT-ohos-elf-skip-strip-codesign.kv"
  - "slz_adler32_by1/by4 是裸累加器不做初值归一化，Adler-32 断言必须传初值 1（传 0 得 091501DD 而非 091E01DE），与 CRC32 初值 0 的约定相反 — knowledge_ref: knowledge/drafts/DRAFT-E735-libslz-adler32-init-value.kv"
  - "上游 v1.2.1 零测试入口（Makefile 无 test/check、tests/ 仅 3 数据夹具）：按候选数法取最大值声明 N=0 并逐项归因，用 test_package + 上游夹具 round-trip 承担替代验证 — knowledge_ref: knowledge/drafts/DRAFT-cute_files-1.0.0-upstream-zero-test-ohos-validation.kv"
