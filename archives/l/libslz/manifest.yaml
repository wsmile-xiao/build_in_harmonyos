# 软件级 manifest — libslz
# 遵循 ARCHIVE-SPEC v3.0（knowledge/ARCHIVE-SPEC.md §2.1）

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: libslz

# 显示名
display: "libslz (SLZ — StateLess Zip)"

# 一句话描述
description: "无状态流式压缩库：以 28 字节/流的内存开销产出 zlib/gzip/deflate 兼容数据流"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: compress

# 官网 URL
homepage: "https://github.com/wtarreau/libslz"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游是裸 Makefile（无 configure）：CC 默认 $(CROSS_COMPILE)gcc，设备/CI 无 gcc，必须在 make 命令行显式传 CC/AR（R33：从 tools.build:compiler_executables 取，不读环境变量）"
    - "上游 Makefile 的 PLATFORM 由 `$(CC) -dumpmachine` 推导，clang 下得到 linux → 产出 libslz.so.1 + 软链接 libslz.so"
    - "不要走 `make install`：install-tools 目标会对 zenc 执行 $(STRIP)，HarmonyOS 下 strip 会使 .codesign 失效报 EPERM（先例 integrit/E703）；package() 直接 copy 产物"
    - "上游 v1.2.1 无任何测试入口：Makefile 无 test/check 目标、tests/ 仅 3 个数据夹具（非用例）；功能验证靠 test_package 消费者断言 + 上游夹具 round-trip 回归"
  common_dependencies: []

# ============================================================
# 版本索引（所有已归档版本，含状态）
# ============================================================

versions:
  "1.2.1":
    status: built             # published | built | failed | archived
    build_date: "2026-09-25"
    conan_ref: "libslz/1.2.1"
