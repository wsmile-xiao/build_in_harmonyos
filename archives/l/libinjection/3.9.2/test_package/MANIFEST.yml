# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libinjection/3.9.2
homepage: "https://github.com/client9/libinjection"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (src/Makefile check 目标)
upstream_tests:
  - file: test-unit.sh
    source: libinjection-3.9.2/src/test-unit.sh
    description: "单元测试：SQLi/XSS 指纹与解析器单元断言"
    command: "make check (test-driver.sh test-unit.sh)"
  - file: test-samples-sqli-negative.sh
    source: libinjection-3.9.2/src/test-samples-sqli-negative.sh
    description: "SQLi 负样本回归：正常输入不得误报"
    command: "make check (test-driver.sh test-samples-sqli-negative.sh)"
  - file: test-samples-sqli-positive.sh
    source: libinjection-3.9.2/src/test-samples-sqli-positive.sh
    description: "SQLi 正样本回归：注入样本必须检出"
    command: "make check (test-driver.sh test-samples-sqli-positive.sh)"
  - file: test-samples-xss-positive.sh
    source: libinjection-3.9.2/src/test-samples-xss-positive.sh
    description: "XSS 正样本回归：XSS 样本必须检出"
    command: "make check (test-driver.sh test-samples-xss-positive.sh)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 libinjection_is_sqli 验证 SQLi 检出、正常输入放行与版本 API"
    command: "./test_libinjection"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
