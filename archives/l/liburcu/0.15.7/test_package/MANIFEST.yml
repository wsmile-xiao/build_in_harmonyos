# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: liburcu/0.15.7
homepage: "https://lttng.org/urcu/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（make check 运行 TAP 测试套件）
upstream_tests:
  - file: tests/unit/test_urcu
    source: liburcu-0.15.7/tests/unit/test_urcu.c
    description: "unit: 基础 urcu API 单元测试"
    command: "./tests/unit/test_urcu"
  - file: tests/regression/rcutorture_urcu
    source: liburcu-0.15.7/tests/regression/rcutorture.c
    description: "regression: rcutorture 压力回归测试"
    command: "./tests/regression/rcutorture_urcu"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 rcu_read_lock/rcu_dereference/synchronize_rcu 验证库可用"
    command: "./test_liburcu"

# 测试断言总数 (近似值)
assertion_count: 3

# 0.15.7 实测（2026-09-23）：tests/unit make check TOTAL 636 / PASS 632 /
# SKIP 4 / FAIL 0 / ERROR 0（cxx 变体需 LD_LIBRARY_PATH=/system/lib64 提供
# 系统 libc++_shared.so；SKIP 4 为 Linux 特有 /proc 读取）——与 0.15.6 同口径
upstream_unit_check_result: "636 total, 632 PASS, 4 SKIP, 0 FAIL, 0 ERROR"
