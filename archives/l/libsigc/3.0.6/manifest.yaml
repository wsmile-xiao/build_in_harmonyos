software: libsigc
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/3.0.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.6"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GNOME 官方发行源）
  url: "https://download.gnome.org/sources/libsigc++/3.0/libsigc++-3.0.6.tar.xz"

  # 源码校验和（与 conandata.yml 一致，GNOME 官方 tarball 实测）
  sha256: "b70edcf4611651c54a426e109b17196e1fa17da090592a5000e2d134c03ac5ce"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Ddefault_library=shared"
    - "-Dmaintainer-mode=false"
    - "-Dbuild-documentation=false"
    - "-Dvalidation=false"
    - "-Dbuild-pdf=false"
    - "-Dbuild-examples=false"
    - "-Dbenchmark=false"
    - "-Dwrap_mode=nodownload"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libsigc++ 3.x 的 sigc::signal/sigc::slot 使用函数类型模板语法（signal<int(int)> / slot<int()>），2.x 的 signal<int,int>/slot<int> 形态仅有前向声明无定义，消费者需按 3.x 语法适配"
