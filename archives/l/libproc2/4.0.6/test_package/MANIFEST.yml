# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清单来源: procps-ng 4.0.6 官方发布包顶层 Makefile.am/Makefile.in
#   `TESTS = ...`（8 个测试二进制），`make check` 实际执行。
# OHOS 实测: 8 总 / 7 PASS / 1 FAIL / 0 SKIP（test_version 的
#   procps_linux_version() 子用例为环境性失败，详见版本目录 notes.md）。
# DejaGnu 套件（testsuite/，50 个 .test）因本机/CI 无 runtest 而由上游
#   自身逻辑打印 WARNING 跳过（testsuite/Makefile.in:555-562）。

package: libproc2/4.0.6
homepage: "https://gitlab.com/procps-ng/procps"

# 上游测试命令（make -n check 分析用）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check（try/except：OHOS 环境 test_version 的 procps_linux_version() 子用例已知环境性失败，不阻塞构建）"

# 上游实际运行的测试程序（8 个，make check 的 TESTS 列表）
upstream_tests:
  - file: library/tests/test_escape.c
    source: procps-ng-4.0.6/library/tests/test_escape.c
    description: "转义序列处理（procps_data_escape/unescape）"
    command: "./library/tests/test_escape"
  - file: library/tests/test_pids.c
    source: procps-ng-4.0.6/library/tests/test_pids.c
    description: "pids API（procps_pids_new/get/unref、PIDS_VAL）"
    command: "./library/tests/test_pids"
  - file: library/tests/test_uptime.c
    source: procps-ng-4.0.6/library/tests/test_uptime.c
    description: "uptime/loadavg API（procps_uptime/procps_loadavg）"
    command: "./library/tests/test_uptime"
  - file: library/tests/test_sysinfo.c
    source: procps-ng-4.0.6/library/tests/test_sysinfo.c
    description: "sysinfo API（procps_sysinfo）"
    command: "./library/tests/test_sysinfo"
  - file: library/tests/test_version.c
    source: procps-ng-4.0.6/library/tests/test_version.c
    description: "版本 API（LINUX_VERSION 宏 / procps_linux_version；OHOS 上后者因 HongMeng 内核版本串非标准 + /proc/version 不可读而环境性失败）"
    command: "./library/tests/test_version"
  - file: library/tests/test_namespace.c
    source: procps-ng-4.0.6/library/tests/test_namespace.c
    description: "namespace API（procps_ns_*）"
    command: "./library/tests/test_namespace"
  - file: src/tests/test_fileutils.c
    source: procps-ng-4.0.6/src/tests/test_fileutils.c
    description: "文件工具（read_file/read_fd 等）"
    command: "./src/tests/test_fileutils"
  - file: src/tests/test_strtod_nol.c
    source: procps-ng-4.0.6/src/tests/test_strtod_nol.c
    description: "strtod_nol 数值解析"
    command: "./src/tests/test_strtod_nol"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libproc2.c
    description: "链接打包的 libproc2，通过 <libproc2/...> 调用真实 C API：procps_uptime / procps_loadavg / procps_pids_new+get+unref（PIDS_VAL(PIDS_ID_PID, s_int, stack)），断言 rc==0、uptime>0、PID 计数>0"
    command: "./test_libproc2"

# 测试断言总数（近似值，用于质量评估）
# test_libproc2.c: uptime(rc==0, up>0, idle>0)=3 + loadavg(rc==0, av1>=0)=2
#                + pids(new==0, pid>0, unref==0, seen>0)=4
assertion_count: 9
