version: "4.0.6"
software: "libproc2"
status: built
build_date: "2026-09-15"
build_system: "autotools"

source:
  url: "https://downloads.sourceforge.net/project/procps-ng/Production/procps-ng-4.0.6.tar.xz"
  sha256: "67bea6fbc3a42a535a0230c9e891e5ddfb4d9d39422d46565a2990d1ace15216"
  tar_format: tar.xz
  # libproc2 是 procps-ng 的库组件（上游无独立 libproc2 项目）

build:
  system: autotools
  configure_options:
    - "--disable-nls"
    - "--disable-numa"
    - "--without-systemd"
    - "--with-ncurses"
    - "--enable-static"
    - "--disable-shared"
    # 仅 OHOS：<utmpx.h> 存在但 utmpx 函数未声明/未导出，强制走 <utmp.h> 分支（E121）
    - "ac_cv_header_utmpx_h=no"
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile.am.patch"
  - "0002-Makefile.in.patch"
  - "0003-config.guess.patch"
  - "0004-configure.patch"

validation:
  conan_verify: "PASS (G0-G4，报告 reports/conan-verify-report.md)"
  conan_create_exit_code: 0
  package_id: "044971e9092dd6608b4c967bac722a276b7cc911"
  test_package: "PASS — procps_uptime/procps_loadavg/procps_pids_new+get+unref，输出 'libproc2 4.0.6 C API: all checks passed'"
  upstream_tests: "make check: TOTAL 8 / PASS 7 / FAIL 1 (test_version 环境性) / SKIP 0"
  artifacts: "lib/libproc2.a, include/libproc2/*.h x8, lib/pkgconfig/libproc2.pc, licenses/COPYING.LIB"

knowledge_gained:
  - "E007: 4.0.6 只需补 config.guess（HarmonyOS case）；其 config.sub 已原生认识 linux-ohos（见草稿 E479-draft-293E）"
  - "E011/E114: configure/config.status 的 (umask 077 && mktemp -d ./confXXXXXX) 在 HMDFS 上产生不可写目录（chmod 无效，E046）"
  - "E121 替代写法（草稿 E429-draft-D3C5）: OHOS 下用 configure 缓存变量 ac_cv_header_utmpx_h=no 取代 __OHOS__ 源码补丁，无平台宏"
  - "E534: musl 无 strverscmp：local/strverscmp.c 需补入 libproc2 源列表（Makefile.am + Makefile.in）"
  - "环境限制: make check 的 test_version/procps_linux_version() 因 HongMeng Kernel 版本串非标准且 /proc/version 不可读而失败，禁改断言"
  - "CI L4 假阳性: 补丁上下文含 NetBSD 注释 'targets' 会被 gets\\b 命中；HarmonyOS 分支插到 case 末尾即规避"

