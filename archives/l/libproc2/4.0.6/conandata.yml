# conandata.yml — libproc2 4.0.6
#
# libproc2 没有独立的上游项目：它是 procps-ng 提供的库组件（源码树 library/）。
# 因此唯一上游来源是官方发布包 procps-ng-4.0.6.tar.xz。
# R39: 源 URL 为官方 SourceForge 发布直链（裸路径，保留 .tar.xz 后缀以便
#      Conan 选择正确的解压器；/download 后缀页会被按 zip 处理）。
# sha256 与 SourceForge 官方文件元数据（files/Production/ 列表 API）逐字一致。

sources:
