software: libcreg
display: "libcreg"
description: "Library to access the Windows 9x/ME Registry File (CREG) format"
category: data
homepage: "https://github.com/libyal/libcreg"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "发布包自带本地 libyal 组件和生成好的 Autotools 文件，配方在 build() 早期校验闭包，不调用 synclibs.sh。"
    - "发布包自带的 config.guess 不识别 HarmonyOS，OHOS 构建显式传入 --build/--host=aarch64-unknown-linux-ohos。"
    - "发布包自带的 config.sub 尚未收录 OHOS；构建前只补充 ohos* OS 和 linux-ohos* kernel-OS 校验，不改变其他平台行为。"
    - "HMDFS 下 Autoconf 的 umask 077 临时目录不可用；构建期统一为 umask 022，并通过 CONFIG_SHELL 解释 configure 和测试 runner。"
    - "libtool check_PROGRAMS 产物是 wrapper，真实 ELF 位于 .libs；OHOS 构建期只适配测试执行路径，不改变上游断言。"
  common_dependencies: []

versions:
  "20240419":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libcreg/20240419"
