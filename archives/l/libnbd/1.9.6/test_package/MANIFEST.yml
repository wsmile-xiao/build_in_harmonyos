# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libnbd/1.9.6
homepage: "https://github.com/libguestfs/libnbd"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/ 目录, 无条件分支; 其余依赖 nbdkit/gnutls)
upstream_tests:
  - file: tests/compile-header-only.c
    source: libnbd-1.9.6/tests/compile-header-only.c
    description: "公开头文件单独编译可用性"
    command: "./tests/compile-header-only"
  - file: tests/compile-c.c
    source: libnbd-1.9.6/tests/compile-c.c
    description: "C 编译 + 链接 libnbd"
    command: "./tests/compile-c"
  - file: tests/compile-iso-c99.c
    source: libnbd-1.9.6/tests/compile-iso-c99.c
    description: "ISO C99 严格模式编译"
    command: "./tests/compile-iso-c99"
  - file: tests/close-null.c
    source: libnbd-1.9.6/tests/close-null.c
    description: "空句柄安全关闭"
    command: "./tests/close-null"
  - file: tests/debug.c
    source: libnbd-1.9.6/tests/debug.c
    description: "调试回调"
    command: "./tests/debug"
  - file: tests/debug-environment.c
    source: libnbd-1.9.6/tests/debug-environment.c
    description: "LIBNBD_DEBUG 环境变量"
    command: "./tests/debug-environment"
  - file: tests/get-version.c
    source: libnbd-1.9.6/tests/get-version.c
    description: "版本查询"
    command: "./tests/get-version"
  - file: tests/export-name.c
    source: libnbd-1.9.6/tests/export-name.c
    description: "导出名设置"
    command: "./tests/export-name"
  - file: tests/private-data.c
    source: libnbd-1.9.6/tests/private-data.c
    description: "私有数据指针"
    command: "./tests/private-data"
  - file: tests/compile-cxx.cpp
    source: libnbd-1.9.6/tests/compile-cxx.cpp
    description: "C++ 编译 + 链接"
    command: "./tests/compile-cxx"
  - file: tests/dlopen.c
    source: libnbd-1.9.6/tests/dlopen.c
    description: "dlopen 动态加载 (静态构建下 SKIP, 需 libnbd.so.0)"
    command: "./tests/dlopen"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 版本 + 句柄生命周期 + 连接错误路径"
    command: "./test_libnbd"
  - file: ohos_spec_test.c
    description: "鸿蒙专项测试: 公开 API 真实调用 (create/close/get_version/connect 错误路径)"
    command: "./ohos_spec_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
