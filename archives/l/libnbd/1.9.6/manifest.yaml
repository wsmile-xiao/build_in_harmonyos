  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-vsock-header-guard.patch"

knowledge_gained:
  - "git tag tarball 不含 OCaml 生成器输出（lib/api.c、lib/states*.c、include/nbd.h），需 tool_requires ocaml 并在构建时运行生成器"
  - "ocaml 包字节码工具（ocamlrun/ocamldoc）shebang 指向构建期缓存路径，移入本地缓存后失效，需 OCAMLLIB/CAML_LD_LIBRARY_PATH/OCAMLDOC=no 修正"
  - "HAVE_OCAMLC 依赖 enable_ocaml=yes，禁用 --disable-ocaml 会同时禁用生成器，须保留"
  - "OHOS 定义 AF_VSOCK 但无 struct sockaddr_vm 头，需把 vsock 分支改为依赖 HAVE_LINUX_VM_SOCKETS_H/HAVE_SYS_VSOCK_H"

