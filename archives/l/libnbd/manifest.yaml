software: libnbd
display: "NBD client library in userspace"
description: "libnbd is a client library for accessing Network Block Device (NBD) servers"
category: storage
homepage: "https://github.com/libguestfs/libnbd"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "OCaml generator (lib/api.c, lib/states*.c, include/nbd.h) runs at build time via ocaml tool_requires"
    - "vsock code path guarded by configure-detected header macros (AF_VSOCK defined but no struct sockaddr_vm on OHOS)"
    - "All optional features disabled (gnutls/libxml2/fuse/python/golang/bash-completion) for a minimal core"
  common_dependencies: []

versions:
  "1.9.6":
    status: built
    build_date: "2026-09-16"
    upstream_identity: valid
    supersession_eligible: false
    note: "First OHOS adaptation; minimal core build with OCaml generator"