software: libspctag
display: "libspctag"
description: "C library for reading and writing ID666 metadata in SNES SPC files"
category: library
homepage: "https://sourceforge.net/projects/libspctag/"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use CMAKE_SYSTEM_NAME=OHOS so CMake loads the SDK Platform/OHOS module and emits the expected shared-library SONAME."
    - "Use CMAKE_POLICY_VERSION_MINIMUM=3.5 as a cache variable because CMake 4.x rejects the upstream CMake 2.6 policy floor."
    - "Move public global definitions out of spctag.h and return defined status values so both shared and static consumers link reliably with modern Clang."
  common_dependencies: []

versions:
  "0.2":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libspctag/0.2"
