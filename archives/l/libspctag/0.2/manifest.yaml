version: "0.2"
software: libspctag
status: built
build_date: "2026-09-18"
conan_ref: "libspctag/0.2"
build_system: cmake

source:
  url: "https://downloads.sourceforge.net/project/libspctag/libspctag-0.2.tar.gz"
  sha256: "a7c6865282c0ba3e119dc28fffaf80dc409f49d042fae38b7670e51bb1baaa57"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=OHOS"
    - "-DBUILD_SHARED_LIBS=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-CMakeLists.txt.patch"
  - "0002-src-spctag.c.patch"
  - "0003-src-spctag.h.patch"

knowledge_gained:
  - "CMake 4.x needs CMAKE_POLICY_VERSION_MINIMUM=3.5 as a cache variable before the upstream cmake_minimum_required(VERSION 2.6) call."
  - "CMAKE_SYSTEM_NAME=OHOS selects the SDK Platform/OHOS module and preserves shared-library SONAME handling."
  - "The upstream public header defines global storage; declarations must be extern and definitions moved into spctag.c for reliable static linking with modern Clang."
