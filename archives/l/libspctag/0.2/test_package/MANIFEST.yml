# test_package/MANIFEST.yml — libspctag/0.2
# 上游官方测试声明文件（CI L0e 强制要求）

package: libspctag/0.2
homepage: "https://sourceforge.net/projects/libspctag/"

# 上游无 CTest 注册项；test/test.c 是源码包中唯一的官方测试样例。
upstream_check_command: "compile and run test/test.c with a valid SPC fixture"
upstream_test_in_build: true
upstream_test_command: "./libspctag_upstream_test upstream-test.spc"

upstream_tests:
  - file: test/test.c
    source: libspctag-0.2/test/test.c
    description: "上游唯一官方样例：读取、修改、保存并恢复文本 ID666 的全部公开字段值"
    command: "./libspctag_upstream_test upstream-test.spc"

test_package_tests:
  - file: test_libspctag.c
    description: "消费者测试：文本和二进制 ID666 标签初始化、全部字段修改、保存及重新打开往返（48 条断言）"
    command: "./test_libspctag"
  - file: test_ohos.c
    description: "HarmonyOS 专项：验证 __OHOS__/aarch64 目标、TMPDIR 可写性和二进制 ID666 真机持久化（8 条断言）"
    command: "./test_libspctag_ohos"

assertion_count: 56
