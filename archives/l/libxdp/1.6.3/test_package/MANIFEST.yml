package: libxdp/1.6.3
homepage: "https://github.com/xdp-project/xdp-tools"
upstream_check_command: "make -C lib/libxdp test"
upstream_test_in_build: false
upstream_test_command: ""
# R51 清点口径（注册用例 + 存量源）：
#   test-libxdp.sh ALL_TESTS = 10 个注册用例（test_link_so / test_link_a / test_old_dispatcher /
#     test_xdp_devbound / test_xdp_frags / test_xsk_prog_refcnt_bpffs / test_xsk_prog_refcnt_legacy /
#     test_xsk_non_privileged / test_link_detach / test_xsk_umem_flags）
#   lib/libxdp/tests/ 存量测试源 = 12 个 .c（8 用户态程序 + 3 BPF 程序 + 1 辅助）
#   未执行：10 个用例均需真实 XDP 网卡 + 内核 BPF syscall；OHOS 无 BPF syscall（N=12 / N'=0 / executed=0）
upstream_tests:
  - file: test_xsk_refcnt.c
    source: xdp-tools-1.6.3/lib/libxdp/tests/test_xsk_refcnt.c
    description: "AF_XDP umem refcount 用例"
    command: "./test_xsk_refcnt"
  - file: test_xdp_frags.c
    source: xdp-tools-1.6.3/lib/libxdp/tests/test_xdp_frags.c
    description: "XDP frags 支持用例"
    command: "./test_xdp_frags"
  - file: test_link_detach.c
    source: xdp-tools-1.6.3/lib/libxdp/tests/test_link_detach.c
    description: "bpf_link 分离用例"
    command: "./test_link_detach"
  - file: test_xsk_umem_flags.c
    source: xdp-tools-1.6.3/lib/libxdp/tests/test_xsk_umem_flags.c
    description: "AF_XDP umem flag 用例"
    command: "./test_xsk_umem_flags"
  - file: test_xdp_devbound.c
    source: xdp-tools-1.6.3/lib/libxdp/tests/test_xdp_devbound.c
    description: "XDP dev-bound 用例"
    command: "./test_xdp_devbound"
  - file: check_kern_compat.c
    source: xdp-tools-1.6.3/lib/libxdp/tests/check_kern_compat.c
    description: "内核/工具兼容性静态用例"
    command: "./check_kern_compat"
  - file: test_dispatcher_versions.c
    source: xdp-tools-1.6.3/lib/libxdp/tests/test_dispatcher_versions.c
    description: "dispatcher 版本切换用例"
    command: "./test_dispatcher_versions"
test_package_tests:
  - file: test.c
    description: "消费者 L1：libxdp_strerror / libxdp_set_print / xdp_program__open_file(missing)"
    command: "./test_libxdp"
assertion_count: 3
