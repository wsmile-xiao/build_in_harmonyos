software: libblkid
version: "2.42.2"
status: built
build_date: "2026-09-18"
build_system: autotools
issue: "#8131"

source:
  url: "https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
  sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
  tar_format: tar.xz

build:
  system: autotools
  options:
    - "--build=<derived from Conan settings_build.arch>"
    - "--host=<derived from Conan settings.arch>"
    - "--disable-all-programs"
    - "--enable-libblkid"
    - "--disable-libuuid"
    - "--disable-libmount"
    - "--disable-libsmartcols"
    - "--disable-libfdisk"
    - "--without-python"
    - "--without-systemd"
    - "--without-udev"
    - "--disable-makeinstall-chown"
    - "--disable-makeinstall-setuid"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang

patches_applied:
  - "0001-config-guess-ohos-detection.patch"

knowledge_gained:
  - "util-linux single sub-library mode (--disable-all-programs + --enable-<lib>) works for libblkid the same way it does for libuuid (uuid/2.40.1)."
  - "libblkid has no external library dependencies (blkid.pc.in has no Requires:); only the internal libcommon is linked."
  - "util-linux 2.42.2 config/config.sub already recognizes ohos*/linux-ohos*-; config.guess needs a HarmonyOS detection patch."
  - "BUILD_LIBBLKID_TESTS requires --enable-static; the 12 check_PROGRAMS are registered in libblkid/src/Makemodule.am."
  - "configure E011 umask fix (077->022) + writable TMPDIR + explicit AWK are all required for the OHOS build host."

upstream_tests:
  registered_check_programs: 12
  run_locally: "see notes.md and PR body for per-program results"

test_package:
  type: cmake
  assertions: 8
