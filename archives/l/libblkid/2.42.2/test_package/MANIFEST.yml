package: libblkid/2.42.2
homepage: "https://www.kernel.org/pub/linux/utils/util-linux/"

upstream_check_command: "make -C . test_blkid_cache test_blkid_config test_blkid_dev test_blkid_devname test_blkid_devno test_blkid_evaluate test_blkid_read test_blkid_resolve test_blkid_save test_blkid_tag test_blkid_verify test_blkid_fuzz_sample"
upstream_test_in_build: true
upstream_test_command: "./test_blkid_fuzz_sample <img>"
upstream_tests:
  - file: libblkid/src/cache.c
    description: "Create/flush a blkid cache from a cache file and probe devices (TEST_PROGRAM main)."
  - file: libblkid/src/config.c
    description: "Read and dump the blkid library config (/etc/blkid.conf evaluation order, cache file)."
  - file: libblkid/src/dev.c
    description: "Iterate all devices in a cache (optional tag search) via blkid_dev_iterate API."
  - file: libblkid/src/devname.c
    description: "Probe all (and removable) devices through blkid_probe_all / blkid_probe_all_removable."
  - file: libblkid/src/devno.c
    description: "Resolve a devno (or major/minor) to a device name and its whole-disk device."
  - file: libblkid/src/evaluate.c
    description: "Evaluate a TAG=VALUE spec (or /dev/disk symlink spec) to a device name."
  - file: libblkid/src/read.c
    description: "Parse an existing blkid cache file (blkid_get_cache round trip)."
  - file: libblkid/src/resolve.c
    description: "Resolve which device holds a given token (blkid_get_tag_value / blkid_get_devname)."
  - file: libblkid/src/save.c
    description: "Load a cache from /dev/null, probe and save it to a file (blkid_flush_cache)."
  - file: libblkid/src/tag.c
    description: "Iterate tags of a device and check tag membership (blkid_tag_iterate API)."
  - file: libblkid/src/verify.c
    description: "Probe a single device and print TYPE/LABEL/UUID (blkid_get_dev)."
  - file: libblkid/src/fuzz.c
    description: "Standalone libFuzzer-sample harness: probe a file image (no real device needed)."

test_package_tests:
  - file: test_blkid.c
    description: "Offline API smoke test: version, udev-safe encoding, TAG=VALUE parsing, /dev/null cache round-trip."
    command: "cmake --build <builddir> && <builddir>/test_blkid_api"

assertion_count: 8
