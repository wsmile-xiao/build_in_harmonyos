software: libsbml
display: "libsbml"
description: "Library for reading, writing and manipulating SBML (Systems Biology Markup Language)"
category: science
homepage: "https://sbml.org/software/libsbml"
license: LGPL-2.1-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建, libxml2 后端, 无源码补丁"
    - "显式传入依赖库路径以适配上游自定义 Find 模块"
    - "上游 ctest + libcheck 套件在构建期完整运行"
  common_dependencies:
    - libxml2
    - zlib
    - bzip2

versions:
  "5.20.5":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libsbml/5.20.5"
    note: "首次适配 HarmonyOS PC, 待真机预检确认"
