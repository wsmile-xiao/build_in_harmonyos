version: "5.20.5"
software: libsbml
status: built
build_date: "2026-09-19"
conan_ref: "libsbml/5.20.5"
build_system: cmake

source:
  url: "https://github.com/sbmlteam/libsbml/archive/refs/tags/v5.20.5.tar.gz"
  sha256: "21c88c753a4a031f157a033de3810488b86f003e684c6ca7aa3d6e26e7e0acfc"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DWITH_SWIG=OFF"
    - "-DWITH_LIBXML=ON"
    - "-DWITH_EXPAT=OFF"
    - "-DWITH_XERCES=OFF"
    - "-DWITH_ZLIB=ON"
    - "-DWITH_BZIP2=ON"
    - "-DWITH_CHECK=ON"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_STABLE_PACKAGES=ON"
  dependencies:
    - libxml2/2.15.3
    - zlib/1.3.1
    - bzip2/1.0.8
  test_dependencies:
    - check/0.15.2
  cc: clang
  cxx: clang++
