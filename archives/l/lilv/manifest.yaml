software: lilv
display: "Lilv"
description: "LV2 plugin host library - a C library for loading and using LV2 audio plugins"
category: audio
homepage: "https://drobilla.net/software/lilv"
license: ISC
build_system: meson

ohos_adaptation:
  key_points:
    - "使用 meson 构建系统编译"
    - "依赖链: lv2, serd, sord, sratom, zix"
    - "ELF 签名必需（鸿蒙系统要求）"
    - "Python 绑定测试因 ELF 签名时机问题可能失败，不影响核心功能"
  common_dependencies:
    - lv2/1.18.11
    - serd/0.32.9
    - sord/0.16.22
    - sratom/0.6.22
    - zix/0.8.1

versions:
  "0.26.5-git":
    status: published
    build_date: "2026-05-25"
    source_url: "https://gitlab.com/lv2/lilv.git"
    packaging: "packaging/"  # 预编译包目录存在