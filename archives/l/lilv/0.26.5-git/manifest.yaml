version: "0.26.5-git"
status: published
build_date: "2026-05-25"

packaging:
  directory: "packaging/"  # 目录存在即为打包标记
  tarball: "lilv-0.26.5-git-ohos-aarch64.tar.gz"  # 存放于本地，不上传 git
  size: "228KB"
  distribution: "cmd-pkgs releases"

source:
  url: "https://gitlab.com/lv2/lilv.git"
  git_commit: "5318c9e"
  tar_format: git

build:
  system: meson
  configure_options:
    - "--prefix=$HOME/usr/local"
  dependencies:
    - lv2/1.18.11-git
    - serd/0.32.9-git
    - sord/0.16.22-git
    - sratom/0.6.22-git
    - zix/0.8.1-git
  cc: clang
  cxx: clang++

test_results:
  total: 33
  passed: 32
  failed: 1
  pass_rate: 97%
  failed_tests:
    - "bindings - lilv:python (OSError: ELF 签名时机问题)"

artifacts:
  shared_library:
    - "liblilv-0.so.0.26.5"
    - "liblilv-0.so.0"
    - "liblilv-0.so"
  executables:
    - "lv2info"
    - "lv2ls"
  pkg_config: "lilv-0.pc"
  headers:
    - "lilv-0/lilv/lilv.h"
    - "lilv-0/lilv/lilvmm.hpp"

knowledge_gained:
  - "meson 构建系统在鸿蒙平台正常工作"
  - "依赖链必须按顺序编译：zix/serd/lv2 → sord → sratom → lilv"
  - "ELF 签名对测试执行有影响，需要在签名后再执行测试"