# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdynamic/2.3.0
homepage: "https://github.com/fredrikwidlund/libdynamic"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/segment.c
    source: libdynamic-2.3.0/test/segment.c
    description: "segment 单元测试 (cmocka)"
    command: "./test/segment"
  - file: test/utility.c
    source: libdynamic-2.3.0/test/utility.c
    description: "utility 单元测试 (cmocka)"
    command: "./test/utility"
  - file: test/hash.c
    source: libdynamic-2.3.0/test/hash.c
    description: "hash 单元测试 (cmocka)"
    command: "./test/hash"
  - file: test/buffer.c
    source: libdynamic-2.3.0/test/buffer.c
    description: "buffer 单元测试 (cmocka)"
    command: "./test/buffer"
  - file: test/list.c
    source: libdynamic-2.3.0/test/list.c
    description: "list 单元测试 (cmocka)"
    command: "./test/list"
  - file: test/vector.c
    source: libdynamic-2.3.0/test/vector.c
    description: "vector 单元测试 (cmocka)"
    command: "./test/vector"
  - file: test/string.c
    source: libdynamic-2.3.0/test/string.c
    description: "string 单元测试 (cmocka)"
    command: "./test/string"
  - file: test/maps.c
    source: libdynamic-2.3.0/test/maps.c
    description: "maps 单元测试 (cmocka)"
    command: "./test/maps"
  - file: test/mapi.c
    source: libdynamic-2.3.0/test/mapi.c
    description: "mapi 单元测试 (cmocka)"
    command: "./test/mapi"
  - file: test/map.c
    source: libdynamic-2.3.0/test/map.c
    description: "map 单元测试 (cmocka)"
    command: "./test/map"
  - file: test/pool.c
    source: libdynamic-2.3.0/test/pool.c
    description: "pool 单元测试 (cmocka)"
    command: "./test/pool"
  - file: test/core.c
    source: libdynamic-2.3.0/test/core.c
    description: "core 单元测试 (cmocka)"
    command: "./test/core"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: list 构造/插入/查找/析构"
    command: "./test_libdynamic"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
