version: "0.19.0"
software: libhttpserver
build_system: autotools
status: built
build_date: "2026-09-20"

source:
  url: "https://github.com/etr/libhttpserver/archive/refs/tags/0.19.0.tar.gz"
  sha256: "b108769ed68d72c58961c517ab16c3a64e4efdc4c45687723bb45bb9e04c5193"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=x86_64-unknown-linux-gnu"
    - "--host=aarch64-linux-ohos"
    - "--disable-examples"
    - "--disable-doc"
  dependencies:
    - libmicrohttpd
  tool_dependencies:
    - automake/1.18
    - libtool/2.5.4
  cc: clang (ohos-sdk)

patches_applied:
  - "0001-configure.ac-ohos-link.patch: host_os=linux-ohos 分支去掉 AM_LDFLAGS=-lstdc++（OHOS 工具链 libc++，同 freebsd 分支处理）"

knowledge_gained:
  - "指定 tag 2.0.0 是 C++20 + std::pmr（arena 分配器贯穿核心 36 处），OHOS libc++ 15004 无标准 <memory_resource> 头（只有 experimental/）→ 2.0.0 env_unsupported；0.19.0 是 C++17 无 pmr，交叉编译干净通过"
  - "release tarball 无 configure：build() 需 autoreconf -fi + tool_requires automake/libtool（abiword-plugin 先例）"
  - "交叉 AC_CHECK_HEADER/AC_CHECK_LIB 预置 ac_cv_* 缓存变量（env）+ CPPFLAGS/LDFLAGS 指 conan 包"
  - "E011 umask 077 → 022 patch configure（HMDFS），CI 上幂等无害"
