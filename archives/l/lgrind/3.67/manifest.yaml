# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "makefile-only 工程在 conan 配方中以 self.run(make ...) 构建，CC 取自 tools.build:compiler_executables（R33）"
  - "clang 15 默认 -fno-common：上游 tentative definition 重复符号需改为 extern 声明，禁用 -fcommon（lld 对混合类型 common 符号报 R_AARCH64 对齐错误）"
  - "retest 等上游测试工具可能落后于库代码契约（re_strncmp 函数指针），复用时须核对全局初始化"
  - "命令行工具依赖的数据文件（lgrindef）必须随包入 resdir，编译期 DEFSFILE 指向包内路径使默认解析可用"

