# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；口径见 ../notes.md 上游测试申报节）
#
# 上游（CTAN lgrind 3.67，1999 年代码）无 make check / ctest / pytest 入口。
# 可执行上游测试入口：source/retest.c（regexp 交互测试器）与 example/ 黄金样例链，
# 已在本机 OHOS aarch64 实测（13 通过 / 0 失败 / 1 跳过 -d!），日志见任务 reports/。

package: lgrind/3.67
homepage: "https://ctan.org/pkg/lgrind"

# 上游无 check 目标（Makefile 仅 all/install/clean/distribution）
upstream_check_command: "none — no upstream check target (verified: grep Makefile targets)"

# 上游测试是否集成进 conanfile.py build()：否，retest 为交互式工具，
# 由适配流程实测并单独汇报（R51），不阻塞 conan create
upstream_test_in_build: false
upstream_test_command: "source/retest (interactive, pty-driven); example/ golden-chain generation"

# 上游实际运行的测试程序（本机实测记录）
upstream_tests:
  - file: source/retest.c
    source: lgrind/source/retest.c
    description: "regexp convexp/expmatch 语义测试（4 用例：字面量/组+交替/交替/字面量星号），pty 驱动"
    command: "source/retest (interactive: expr+string pairs, '#' terminates group)"
  - file: example/egcprog.c
    source: lgrind/example/egcprog.c
    description: "黄金样例链：lgrind -i -v subst 生成 .lg，断言 \\File/\\Proc/逐行覆盖"
    command: "lgrind -i -v subst egcprog.c > egcprog.lg"
  - file: example/egmasm.asm
    source: lgrind/example/egmasm.asm
    description: "-lmasm 强制语言分发测试"
    command: "lgrind -i -lmasm egmasm.asm > egmasm.lg"
  - file: source/v2lg.c
    source: lgrind/source/v2lg.c
    description: "verbatim→%[] 转换器冒烟测试"
    command: "v2lg < sample-with-verbatim"

# test_package 中自带的测试（消费者视角验证，鸿蒙新增用例）
test_package_tests:
  - file: sample_consumer.c
    description: "消费者可行性：运行打包 lgrind 二进制 + 包内 lgrindef，断言 LaTeX 包络与 \\Proc{main}"
    command: "lgrind -d <res>/lgrindef sample_consumer.c（经 test_package/conanfile.py self.run 执行）"

# 测试断言总数（retest 4 组 + example 5 项 + v2lg 1 项 + test_package 4 项标记断言）
assertion_count: 14
