package: libldap/2.6.13
homepage: "https://www.openldap.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1 -k (best-effort; slapd-tester needs slapd)"

# rule4: official upstream registration total (not runnable subset).
# OpenLDAP 2.6.13 ships 90 slapd-tester scripts
# (tests/scripts/test000-rootdse ~ test088-syncprov-glue-rwm, incl.
# test081-totp.py); counted via `ls tests/scripts/test* | wc -l` == 90.
# tests/run bails with "Could not locate slapd(8)" when slapd is absent.
upstream_tests_exist: true
upstream_test_total: 90
upstream_test_count_method: autotools_tests
upstream_test_audit: "Upstream tests exist: 90 slapd-tester integration scripts under tests/scripts (test000-rootdse ~ test088-syncprov-glue-rwm incl. test081-totp.py), entry tests/run requires ../servers/slapd/slapd. This recipe uses --disable-slapd (client libs only), so the 90 tests cannot run in the Conan sandbox; build() runs `make check -j1 -k` best-effort and emits real counts with gaps."

# Upstream audit: OpenLDAP 2.6.13 ships 90 slapd-tester integration tests
# (tests/scripts/test000-rootdse ~ test088-syncprov-glue-rwm, incl.
# test081-totp.py). tests/run bails with "Could not locate slapd(8)"
# when slapd is absent. This client-libraries recipe uses --disable-slapd
# (only libldap/liblber ship), so the 90 integration tests cannot run in
# the Conan sandbox; build() attempts `make check -k` best-effort and
# always emits HMBS_UPSTREAM_TEST_RESULT with real counts.
upstream_tests:
  - file: tests/run
    source: openldap-2.6.13/tests/run
    description: "OpenLDAP upstream slapd-tester integration entry (90 scripts test000-rootdse ~ test088-syncprov-glue-rwm incl. test081-totp.py; needs slapd server, not runnable in client-only sandbox)"
    command: "cd tests && make check"
    runnable_in_sandbox: false
    reason: "recipe --disable-slapd ships no slapd; tests/run exits when slapd is missing; needs ports/fork restricted in sandbox"

test_package_tests:
  - file: test.c
    description: "Consumer 6 offline groups: ldap_create+API_INFO+url_parse+str2dn+err2string+lber BER encode (no network, no slapd; links libldap/liblber)"
    command: "./test_libldap"

assertion_count: 22
