software: libtommath
version: 1.3.0
description: "C library for number theoretic multiple-precision integers"
url: https://github.com/libtom/libtommath/releases/download/v1.3.0/ltm-1.3.0.tar.xz
build_system: makefile
category: math
dependencies: []
configure_options:
  - "--prefix=$DEFAULT_PREFIX"
compile_commands:
  - "make -j$(nproc)"
  - "make install DESTDIR=$TEST_PREFIX"
test_command: "make test"
install_command: "make install DESTDIR=$TEST_PREFIX"
binaries:
  - libtommath.a
libraries:
  - libtommath.a
headers:
  - tommath.h
  - tommath_class.h
  - tommath_private.h
  - tommath_cutoffs.h
  - tommath_superclass.h
knowledge_gained: []
notes: |
  libtommath is a portable, ISO C compliant multiple-precision integer library.
  It uses simple Makefile build system with optional CMake support.
  No external dependencies required.