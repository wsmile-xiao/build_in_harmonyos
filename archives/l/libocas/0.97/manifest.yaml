knowledge_gained:
  - "Upstream CFLAGS carries x86-only -msse; must drop it for OHOS aarch64."
  - "Upstream Makefile hard-codes CC := gcc; make CC overridable (CC ?= gcc) and pass CC from Conan conf (R33)."
  - "Conan patcher matches hunks by exact line numbers without fuzz: Makefile edits done programmatically in build() string replacement, not via .patch (avoids 'source file is different' drift failures)."
  - "No mex on OHOS: make all builds libocas.so plus svmocas/msvmocas/linclassif only."
  - "Upstream ships no automated C tests (only Matlab .m scripts); test_package covers C API plus CLI flow."

