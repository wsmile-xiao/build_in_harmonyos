package: libocas/0.97
homepage: "https://cmp.felk.cvut.cz/~xfrancv/ocas/html/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests_exist: false
upstream_test_framework: "none"
upstream_test_total: 0
upstream_test_count_method: "auto"
upstream_test_audit: "Audited libocas 0.97 source tree (libocas_v097.zip): Makefile defines only all/svmocas/msvmocas/linclassif/libocas.so/clean targets, no check/test target and no tests/ directory; only Matlab verification scripts (libocas_test.m, svmocas_bool_test.m) require Matlab mex and cannot run as C tests. Debian orig tarball file list confirms no C test harness."
upstream_tests: []

test_package_tests:
  - file: test_ocas.c
    description: "C API consumer test: LIBOCAS_INDEX macro plus real libqp_splx_solver simplex QP solve (6 checks)"
    command: "./test_ocas (built and run by test_package/conanfile.py test())"
  - file: CLI flow (svmocas/linclassif)
    description: "End-to-end CLI flow: train tiny SVM-light data with packaged svmocas, generate predictions with linclassif -o, verify non-empty model/predictions plus 4/4 label agreement (-e only as non-gating diagnostic)"
    command: "svmocas tiny_train.light tiny.model && linclassif -o tiny.pred tiny_train.light tiny.model"
assertion_count: 10
