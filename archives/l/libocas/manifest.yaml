software: libocas
display: "libocas"
description: "Library implementing the Optimized Cutting Plane Algorithm (OCAS) solver for training linear SVM classifiers"
category: science
homepage: "https://cmp.felk.cvut.cz/~xfrancv/ocas/html/"
license: GPL-3.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Drop x86-only -msse from CFLAGS for OHOS aarch64"
    - "Make CC overridable (CC ?= gcc) and pass clang from Conan conf (R33)"
    - "No mex on OHOS: build libocas.so plus svmocas/msvmocas/linclassif"
  common_dependencies: []

versions:
  "0.97":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libocas/0.97"
