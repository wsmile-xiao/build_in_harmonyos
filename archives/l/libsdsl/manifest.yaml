software: libsdsl
display: "SDSL Succinct Data Structure Library"
description: "Succinct data structures library (bitvectors, int-vectors, wavelet trees, CSA/CST)"
category: data
homepage: "https://github.com/simongog/sdsl-lite"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，产物为 libsdsl + libdivsufsort/libdivsufsort64，头文件位于 include/sdsl"
    - "官方 release tarball 不含 external 子模块，需单独获取 libdivsufsort 与 googletest"
    - "上游测试为 24 个 gtest 程序（162 个 TEST/TEST_F），其中 10 个离线可跑，14 个需在线语料"
    - "aarch64 无 SSE4.2，BUILTIN_POPCNT 保持关闭，使用通用 popcount 实现"
  common_dependencies: []

versions:
  "2.1.1":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libsdsl/2.1.1"
