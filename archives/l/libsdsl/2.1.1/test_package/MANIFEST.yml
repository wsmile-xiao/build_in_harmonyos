# test_package/MANIFEST.yml — libsdsl 2.1.1
# Upstream and consumer test declaration required by CI L0e.

package: libsdsl/2.1.1
homepage: "https://github.com/simongog/sdsl-lite"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "sdsl-lite v2.1.1 (official GitHub release, SHA-256 verified)"
  build_system: "CMake (top-level CMakeLists.txt + test/CMakeLists.txt, gtest vendored)"
  test_definition: >
    Upstream ships 24 gtest programs under test/ (162 TEST/TEST_F in total).
    10 suites are offline (bits/coder/int_vector/int_vector_buffer/
    int_vector_mapper/inv_perm_support/nn_dict_dynamic/sd_vector/
    sorted_int_stack/sorted_stack_support); the other 14 require
    Pizza&Chili corpora downloads (faust/zarathustra/moby) and are not run
    on the device. The recipe builds and runs the 10 offline suites in
    build() and emits HMBS_UPSTREAM_TEST_RESULT with the real gtest counts.
  dependency: >
    Official release tarball leaves external/ submodules empty; the recipe
    vendors libdivsufsort 2.0.1 and googletest 1.14.0 releases into
    external/libdivsufsort and external/googletest before configuring.

upstream_check_command: "ctest -N in test/ build tree (24 gtest programs)"
upstream_test_in_build: true
upstream_test_command: "build 10 offline gtest binaries and run each, parse [PASSED]/[FAILED] counts"

upstream_tests:
  - file: test/bits_test.cpp
    description: "bit_vector/bit ops (offline)"
    command: "./bits_test"
  - file: test/coder_test.cpp
    description: "coder elias/delta/fibonacci (offline)"
    command: "./coder_test"
  - file: test/int_vector_buffer_test.cpp
    description: "int_vector_buffer file-backed vector (offline)"
    command: "./int_vector_buffer_test"
  - file: test/int_vector_mapper_test.cpp
    description: "int_vector_mapper (offline)"
    command: "./int_vector_mapper_test"
  - file: test/int_vector_test.cpp
    description: "int_vector core (offline)"
    command: "./int_vector_test"
  - file: test/inv_perm_support_test.cpp
    description: "inverse permutation support (offline)"
    command: "./inv_perm_support_test"
  - file: test/nn_dict_dynamic_test.cpp
    description: "nearest-neighbour dictionary (offline)"
    command: "./nn_dict_dynamic_test"
  - file: test/sd_vector_test.cpp
    description: "sd_vector compressed bitvector (offline)"
    command: "./sd_vector_test"
  - file: test/sorted_int_stack_test.cpp
    description: "sorted int stack (offline)"
    command: "./sorted_int_stack_test"
  - file: test/sorted_stack_support_test.cpp
    description: "sorted stack support (offline)"
    command: "./sorted_stack_support_test"

# Consumer-perspective checks: bit_vector store, rank_support_v, select_support_mcl,
# int_vector roundtrip, sd_vector view (each CHECK exits 1 on failure).
test_package_tests:
  - file: test_sdsl.cpp
    description: "Consumer links sdsl/divsufsort/divsufsort64: bit_vector, rank, select, int_vector, sd_vector (6 checks)"
    command: "ctest --output-on-failure -R test_sdsl"

assertion_count: 6
