# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: lrcalc/1.2
homepage: "https://sites.math.rutgers.edu/~asbuch/lrcalc/"

# 上游测试命令 (make check / ctest -N / meson test --list 分析用)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: testsuite
    source: lrcalc-1.2/testsuite
    description: "Makefile.am 的 TESTS 入口：8 项 shell 检查（lrcoef/skew/skew -r/mult/mult -f/mult -q/coprod/schubmult），逐字节比对 CLI 输出；OHOS 上原样运行 8/8 通过"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "C 消费者：链接 liblrcalc，通过导出 API（v_new_init/lrcoef）断言 3 个 Littlewood-Richardson 系数"
    command: "./test_lrcalc"
  - file: test_lrcalc.sh
    description: "CLI 功能：运行打包的 lrcalc/schubmult，比对 4 个上游 README 示例的精确输出"
    command: "sh test_lrcalc.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
