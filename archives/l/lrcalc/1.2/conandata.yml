sources:
  url: "https://sites.math.rutgers.edu/~asbuch/lrcalc/lrcalc-1.2.tar.gz"
  sha256: "792dd538a0d19698be2c5b8c138730bbb4820e8a44e03b001ae14bd5f1d7040b"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognize uname -s=HarmonyOS and report aarch64-unknown-linux-ohos (native build type detection)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept the linux-ohos OS token so the linux-ohos triplets canonicalize (POSIX fix, no platform macro)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: create temp directories with umask 022 instead of 077 so HMDFS setgid directories stay writable at config.status time"
    patch_type: "portability"
