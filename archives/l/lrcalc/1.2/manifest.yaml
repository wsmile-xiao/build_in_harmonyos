knowledge_gained:
  - "lrcalc 1.2 自带 2012 年 config.guess/config.sub，不识别 ohos：config.guess 增补 HarmonyOS 分支输出 aarch64-unknown-linux-ohos；config.sub 补 3 处模式（maybe_os 列表 / -ohos* / -linux-ohos*）——native 构建（build==host）时 AutotoolsToolchain 不传三元组，configure 必然走 config.guess（ref: E007）"
  - "configure 用 umask 077 创建临时目录，HMDFS setgid 语义下目录不可写，config.status 在 subs1.awk 处 Permission denied；放宽为 022（ref: E011, E129）"
  - "profile buildenv 注入的 harmonybrew bash 作为 SHELL 会被 configure 写进 Makefile，令 libtool/config.status 崩坏；configure 命令行强制 CONFIG_SHELL/SHELL=/bin/sh 修复（ref: E386）"

