software: lrcalc
display: "lrcalc"
description: "Littlewood-Richardson 系数计算器：对称函数 C 库（liblrcalc）与 lrcalc、schubmult 命令行程序"
category: library
homepage: "https://sites.math.rutgers.edu/~asbuch/lrcalc/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub（2012）不识别 HarmonyOS/ohos：补丁增补识别，native 构建必须走 config.guess（E007）"
    - "configure 的 umask 077 临时目录在 HMDFS setgid 语义下不可写，config.status 失败（E011/E129）：补丁放宽为 022"
    - "profile 注入的 harmonybrew bash 作为 SHELL 会破坏 libtool/config.status（E386 同族）：configure 强制 CONFIG_SHELL/SHELL=/bin/sh"
    - "make -j1 规避 HMDFS 对 jobserver FIFO 的限制"
  common_dependencies: []

versions:
  "1.2":
    status: built
    build_date: "2026-09-18"
    conan_ref: "lrcalc/1.2"
