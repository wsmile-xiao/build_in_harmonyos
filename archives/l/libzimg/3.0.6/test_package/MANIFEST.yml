package: libzimg/3.0.6
homepage: https://github.com/sekrit-twc/zimg

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"
upstream_tests:
  - suite: unit_test
    framework: gtest 1.14.0 (built from official source by configure.ac cmake step)
    cases: 122
    notes: "96 generic + 26 aarch64 NEON cases (ARM backend selected by --host=aarch64-linux); run via make check during conan build()"
upstream_test_notes: "Upstream gtest suite fully executed in build(); musl-libm reference lib ships in the tarball and is linked by unit_test for exact FP reference."

test_package_tests:
  - file: test.cpp
    description: "C API version/API checks, resize filter graph build + tmp size, and OHOS NEON depth conversion end-to-end run"
    command: "./test_libzimg"

assertion_count: 12
