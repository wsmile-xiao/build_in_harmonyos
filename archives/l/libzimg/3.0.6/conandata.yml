  # googletest: upstream test/extra/googletest is an empty submodule in the
  # release tarball; Makefile.am hardcodes the in-tree path
  # (test/extra/googletest/build/lib/libgtest.a + include dir). Ship the
  # official gtest 1.14.0 source so `make check` reproduces the upstream
  # unit-test suite exactly as configure.ac drives it (cmake sub-build).
  # v1.14.0 is the last gtest that builds as C++14, matching zimg's
  # CXXSTD=c++14 default (1.15+ requires C++17).
  - url:
      - "https://gh-proxy.com/https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz"
      - "https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz"
    sha256: "8ad598c73ad796e0d8280b082cebd82a630d73e73cd3c70057938a6501bba5d7"

