software: libzimg
version: 3.0.6
status: built
build_system: autotools
source:
  url: https://github.com/sekrit-twc/zimg/archive/refs/tags/release-3.0.6.tar.gz
  sha256: be89390f13a5c9b2388ce0f44a5e89364a20c1c57ce46d382b1fcc3967057577
  googletest_url: https://github.com/google/googletest/archive/refs/tags/v1.14.0.tar.gz
  googletest_sha256: 8ad598c73ad796e0d8280b082cebd82a630d73e73cd3c70057938a6501bba5d7
dependencies: []
build_dependencies:
  - automake/1.18 (tool_requires, registry)
  - libtool/2.5.4.1 (tool_requires, registry)
configure_options:
  - --build=aarch64-linux --host=aarch64-linux (device-native, selects ARM backend)
  - --enable-unit-test (upstream gtest suite, 122 cases)
  - STL_LIBS=-lc++ (OHOS libc++ runtime for zimg.pc Libs.private)
  - --enable-shared / --disable-static (default) or inverse for static
artifacts:
  headers:
    - include/zimg.h
    - include/zimg++.hpp
  libraries:
    - lib/libzimg.so.2.0.0 (shared, OHOS code-signed)
    - lib/libzimg.a (static when shared=False)
  pkg_config:
    - lib/pkgconfig/zimg.pc
upstream_tests:
  framework: gtest 1.14.0
  total_cases: 122
  passed: 122
  failed: 0
  notes: >
    make check runs test/unit_test: 96 generic + 26 aarch64 NEON cases.
    The googletest submodule slot is filled from the official v1.14.0
    tarball (last C++14-compatible gtest; 1.15+ requires C++17 while
    zimg builds with CXXSTD=c++14) and is built by the upstream
    configure.ac cmake step, keeping the upstream build shape intact.
notes: |
  Platform task #13534 (branch feat/libzimg-3.0.6, claimer calbee21).
  The previously merged archives/z/zimg/3.0.6 recipe bypassed autotools
  (direct clang++ build) because the CI image lacked autoreconf; that
  package is published as zimg/3.0.6. This recipe bootstraps the real
  autotools chain from registry tool_requires and runs the upstream test
  suite. CI L0n requires the branch to equal <pkg>-<version>, hence the
  libzimg package name; the registry holds no libzimg/3.0.6 yet.
