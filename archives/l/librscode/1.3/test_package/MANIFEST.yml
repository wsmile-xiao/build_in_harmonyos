# test_package/MANIFEST.yml
# Upstream test declaration (CI L0e requires this file)

package: librscode/1.3
homepage: "http://rscode.sourceforge.net"

# Upstream test suite existence (audited from source tarball)
upstream_tests_exist: false

# Upstream test audit (source: rscode-1.3.tgz, sha256 0d79ee8b9a975e4c7ee542e64f96e65c106e40b97b711fc683b3c725f8f9a5fe)
upstream_test_audit:
  source_tarball: "rscode-1.3.tgz"
  source_sha256: "0d79ee8b9a975e4c7ee542e64f96e65c106e40b97b711fc683b3c725f8f9a5fe"
  top_level_files:
    - rs.c            # library source, no TEST()/TEST_F/def test_
    - galois.c        # library source
    - berlekamp.c     # library source
    - crcgen.c        # library source
    - ecc.h           # public header
    - example.c       # demo only: nondeterministic rand/time, always exit 0, not a test suite
    - Makefile        # minimal build file, no check/test target
  scanned_for:
    - "TEST() / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile TESTS / check_PROGRAMS / check/test target"
    - "tests/ / test/ / spec/ / t/ directory"
    - "make check / ctest / meson test target"
    - "CMakeLists.txt / configure / meson.build test setup"
  scan_result: "0 matches - upstream ships only 4 C sources + ecc.h + example.c demo + minimal Makefile, no test code or test directory"
  make_check_output: "no check/test target in upstream Makefile"
  reason: "librscode 1.3 (RSCODE) is a tiny ANSI C Reed-Solomon library with no test suite; only example.c demo exists (uses rand/time, always exit 0, asserts nothing)"

# Upstream check command (not applicable, no suite)
upstream_check_command: ""

# Whether build() integrates upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream programs actually run (upstream_tests_exist: false, see audit above)
# No upstream suite; preflight emits HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0

# test_package self-contained tests (consumer perspective)
test_package_tests:
  - file: test_rscode.c
    description: "consumer link+run: initialize_ecc, encode/decode round-trip, single-error and single-erasure correction, crc_ccitt determinism, galois identities"
    command: "./test_rscode"
  - file: conanfile.py
    description: "Conan test() entry, runs test_rscode and emits HMBS_TEST_PACKAGE_RESULT + HMBS_UPSTREAM_TEST_RESULT markers"
    command: "conan test test_package"

# Approximate assertion count for quality assessment
assertion_count: 10
