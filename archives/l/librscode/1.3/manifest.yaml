software: librscode
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-14"

# 构建系统类型（顶层字段，供验证脚本使用）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/rscode/rscode/1.3/rscode-1.3.tgz"

  # 源码校验和
  sha256: "0d79ee8b9a975e4c7ee542e64f96e65c106e40b97b711fc683b3c725f8f9a5fe"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 Makefile 硬编码 gcc/ar，无法向其注入 OHOS 工具链；改为在 Conan 配方中直接编译 rs.c/galois.c/berlekamp.c/crcgen.c 四个上游源文件"
  - "_resolve_cc/_resolve_ar 从 tools.build:compiler_executables 读取 OHOS 工具链，含可执行性校验与 PATH 回退"
  - "静态产物 libecc.a；共享产物 libecc.so 需设置相对 SONAME"
  - "validate() 限制仅 Linux/OHOS 平台构建"
  - "上游 rscode 1.3 无测试框架（仅 example.c 演示程序），以 test_package/test_rscode.c 消费者视角补全 12 个断言"
