# 版本级 manifest — liblsl 1.18.0.b2

# 版本号
version: "1.18.0.b2"

# 软件名
software: "liblsl"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方 tag archive；tag 形如 v1.18.0.bN）
  url: "https://github.com/sccn/liblsl/archive/refs/tags/v1.18.0.b2.tar.gz"

  # 源码校验和
  sha256: "a68367cabc35f7842daa2decb264e00b6821e56f343de598ba6b3ba6ec75dffd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（经 conanfile.py CMakeToolchain 注入）
  configure_options:
    - "-DLSL_VERSION_OVERRIDE=1.18.0.b2"
    - "-Dlslgitrevision=v1.18.0.b2"
    - "-Dlslgitbranch=conan"
    - "-DLSL_BUILD_STATIC=OFF"
    - "-DLSL_INSTALL=ON"
    - "-DLSL_UNIXFOLDERS=ON"
    - "-DLSL_UNITTESTS=OFF"          # 默认关闭；上游测试单独一轮 with_tests=True 跑
    - "-DLSL_TESTS_PREFER_SYSTEM_CATCH2=OFF"
    - "-DLSL_TOOLS=OFF"
    - "-DFETCHCONTENT_SOURCE_DIR_PUGIXML=<source_folder>/_vendor/pugixml"
    - "-DFETCHCONTENT_SOURCE_DIR_CATCH2=<source_folder>/_vendor/Catch2"
    - "-DFETCHCONTENT_FULLY_DISCONNECTED=ON"
    - "-DCMAKE_USER_MAKE_RULES_OVERRIDE_C=<generators>/ohos-cmake-rules.cmake"
    - "-DCMAKE_USER_MAKE_RULES_OVERRIDE_CXX=<generators>/ohos-cmake-rules.cmake"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"

  # 编译依赖列表（格式: name/version）
  # 无外部二进制依赖：lslboost 随源码包内嵌；pugixml/Catch2 由本配方在 source()
  # 里以同版本 tarball 下载后交给上游 FetchContent（configure 期不联网）。
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本版本无需改动上游源码）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.1.2 没有 Platform/HarmonyOS.cmake（只有不被该 system name 命中的 Platform/OHOS.cmake）：conan 把 os=OHOS 映射成 CMAKE_SYSTEM_NAME=HarmonyOS 后，平台模块回落 generic，CMAKE_SHARED_LIBRARY_SONAME_*_FLAG / *_RUNTIME_*_FLAG / CMAKE_SHARED_LIBRARY_RPATH_ORIGIN_TOKEN / CMAKE_EXECUTABLE_RUNTIME_*_FLAG 全为空 ⇒ 产物无 SONAME 且完全写不进 RUNPATH（bin/ 下的工具在裸环境找不到 ../lib 的 .so）。用 CMAKE_USER_MAKE_RULES_OVERRIDE_{C,CXX} 注入规则文件补齐（先例 curl/8.15.0.1）"  # knowledge_ref: E631
  - "conan 的 tc.cache_variables 只写进 CMakePresets/命令行，不进 conan_toolchain.cmake：任何平台修正若只在 cache_variables 里，手工 `-DCMAKE_TOOLCHAIN_FILE=...` configure 就会静默丢失（退回无 SONAME/无 RPATH）。平台修正一律用 tc.variables 写进工具链文件本身"  # knowledge_ref: E631
  - "cmake --install 对 ELF 做 RPATH_CHANGE 改写会破坏 OHOS 代码签名：改写后的可执行文件 exec 报 `Operation not permitted`（EACCES/rc=126，不是 not found）。用 CMAKE_BUILD_WITH_INSTALL_RPATH=ON 让构建产物直接带最终 RPATH，install 前后逐文件 sha256 一致即证"  # knowledge_ref: E631
  - "上游 FetchContent(GIT_REPOSITORY ...) 在 configure 期 git clone，worker 不保证有 git/网络：配方在 source() 用 get() 下载同版本 tarball 并写 FETCHCONTENT_SOURCE_DIR_<NAME>（+FETCHCONTENT_FULLY_DISCONNECTED=ON），版本与上游 pin 的 GIT_TAG 严格一致，CI 的 conandata 预下载/镜像回退也能覆盖到"  # knowledge_ref: E631
  - "GitHub tag tarball 不含 .git：依赖 git describe 定版本的上游（liblsl 的 ProjectVersion.cmake）会退化成内置 fallback 1.17.7。上游自带 LSL_VERSION_OVERRIDE 覆盖入口，用它把 PROJECT_VERSION/LSL_VERSION_FULL 钉到包版本；同时显式给 lslgitrevision/lslgitbranch，否则 lsl_library_info() 是 `git:/branch:/`"  # knowledge_ref: E631
  - "本包需要 -lpthread：CMake 的 FindThreads 在 OHOS 上最终命中 `Looking for pthread_create in pthread - found`（musl 的 libc 提供符号但工具链仍接受 -lpthread）；cpp_info 里不要声明 system_libs=['pthread','dl','m']，sysroot 里没有对应 .so 文件"  # knowledge_ref: notes.md OHOS 适配记录
  - "上游只在 testing/CMakeLists.txt 里 enable_testing() ⇒ CTestTestfile.cmake 只生成在 <build>/testing/ 下：在 <build> 跑 `ctest` 会打印 `No tests were found!!!` 且 **rc=0**（零用例假绿）。本配方改为 `ctest --test-dir <build>/testing --no-tests=error`"  # knowledge_ref: DRAFT-box2d-2.4.1-ctest-empty-suite-false-pass
  - "N 清点必须同时用「源码 TEST_CASE 宏数」与「框架注册数（Catch2 --list-tests 汇总行）」两种候选法取最大值：本包宏数 66 少报 12（4 个 TEMPLATE_TEST_CASE 展开成 17 个用例 = +13；上游 testing/CMakeLists.txt 把 loguruthreadnames.cpp 拼到不存在的 LSL_INTERNAL_SRCS 变量上导致其 1 个用例任何平台都不注册 = −1），真实 N=78"  # knowledge_ref: E631
  - "liblsl 系测试共用同一段监听端口带（ports.BasePort 默认 16572）：并发跑两个 liblsl 测试进程会互相抢占端口，而 ports.AllowRandomPorts 默认 true → 抢不到的 outlet 静默改用随机端口，resolve_over_tcp 用例的 TCP 探测目标固定在 BasePort..BasePort+PortRange-1 因而打空，REQUIRE(found.size()==1) 报 0==1。判据：ctest 必须串行；并发时 Python bind 16572-16575 得 EADDRINUSE(errno 98)，停并发后同一序列连续 3/3 全绿"  # knowledge_ref: notes.md 上游测试串行要求
