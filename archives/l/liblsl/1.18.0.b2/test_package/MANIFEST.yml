# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liblsl/1.18.0.b2
homepage: "https://github.com/sccn/liblsl"

# 上游测试命令（ctest -N / ctest 列表来自 testing/CMakeLists.txt 的 add_test）
# 上游用 CMake + Catch2 3.4.0：每个 add_test 是一个测试可执行文件，
# 可执行文件内部再用 Catch2 展开成多个 test case。
# 注意 ①：上游只在 testing/CMakeLists.txt 里 enable_testing()，CTestTestfile.cmake
#          只生成在 build/testing/ 下 —— 在 <build> 跑 ctest 会打印
#          "No tests were found!!!" 且 rc=0（零用例假绿），故必须带 /testing 子目录
#          并加 --no-tests=error；② 必须串行（不加 -j）：7 个测试可执行文件共用
#          16572+ 端口带，并发会互相抢占端口造成假失败。
upstream_check_command: "cmake -S . -B build -DLSL_UNITTESTS=ON -DLSL_BENCHMARKS=ON && ctest --test-dir build/testing --output-on-failure --no-tests=error"

# conanfile.py build() 中是否已集成上游测试（仅 -o liblsl/*:with_tests=True 时）
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <build_folder>/testing --output-on-failure --no-tests=error"

# 上游用例总数 N —— 与 PR 正文 / manifest.yaml / notes.md / reports/test-report.md
# **同源同单位**：Catch2 框架注册用例数（test case），不是源码 TEST_CASE 宏数（66）、
# 也不是断言数（3765912，另一单位只披露不并入）。
upstream_test_count: 78

# 上游实际运行的测试可执行文件（测试框架 = Catch2 3.4.0；括号内为该可执行文件的
# 框架注册用例数，取数命令：`<exe> --list-tests | tail -1`）
upstream_tests:
  - name: lsl_test_exported
    description: "公开 API 测试：DataType/discovery/move/streaminfo/sync_outlet/time + bench_{bounce,common,pushpull}（38 个注册用例）"
  - name: lsl_test_internal
    description: "内部实现测试：inireader/network/stringfuncs/streaminfo/samples/postproc/serialization_v100/sync_endian/tcpserver/sendbuffer + bench_{sleep,timesync}（35 个注册用例；上游 testing/CMakeLists.txt 的 LSL_INTERNAL_SRCS 变量名笔误使 loguruthreadnames.cpp 不参与编译，其 1 个用例任何平台都不注册）"
  - name: lsl_test_runtime_config
    description: "运行时 api_config 单例测试（1 个注册用例）"
  - name: lsl_test_resolve_bad_interface
    description: "坏网卡解析测试（1 个注册用例）"
  - name: lsl_test_resolve_query_port
    description: "查询端口解析测试（1 个注册用例）"
  - name: lsl_test_resolve_machine
    description: "本机解析测试（1 个注册用例）"
  - name: lsl_test_resolve_over_tcp
    description: "TCP 解析测试（1 个注册用例）"

# test_package 中自带的测试（消费者视角验证，单独计数，不并入上游 N）
test_package_tests:
  - file: test_c.c
    description: "C API 消费者测试：库标识 / streaminfo + XML 往返 / 本机回环 outlet→inlet 真实传样本"
    command: "./test_liblsl_c"
  - file: test_cpp.cpp
    description: "C++ API 消费者测试：lsl_cpp.h RAII 包装 + 模板 push/pull 真实传样本"
    command: "./test_liblsl_cpp"
  - file: conanfile.py
    description: "裸环境 smoke：env -u LD_LIBRARY_PATH 直接跑包内 bin/lslver（验证 RUNPATH）"
    command: "env -u LD_LIBRARY_PATH <pkg>/bin/lslver --version"

# test_package 断言总数（由两个测试程序自打印的 ASSERTIONS 行复算：C 25 + C++ 16）
assertion_count: 41
