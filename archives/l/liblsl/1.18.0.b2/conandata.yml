# conandata.yml — liblsl 1.18.0.b2
# 单一事实源：源码 URL + sha256 + 构建期依赖源码 + 补丁清单
#
# 上游 tag 为 `v1.18.0.b2`（sccn/liblsl 的预发布 tag 形如 v1.18.0.bN），
# GitHub tag archive 即官方发布源（R39）。

sources:
  url: "https://github.com/sccn/liblsl/archive/refs/tags/v1.18.0.b2.tar.gz"
  sha256: "a68367cabc35f7842daa2decb264e00b6821e56f343de598ba6b3ba6ec75dffd"

# ── 构建期依赖（上游用 CMake FetchContent(GIT_REPOSITORY ...) 在 configure 阶段
# git clone；worker 的 configure 期不保证有 git/网络，故在此登记同一版本的
# tarball，由 conanfile.py 的 source() 用 get() 下载后经
# FETCHCONTENT_SOURCE_DIR_<NAME> 交给 FetchContent —— 版本与上游 CMakeLists.txt
# 里 pin 的 GIT_TAG 严格一致（pugixml v1.15 / Catch2 v3.4.0）。
pugixml:
  url: "https://github.com/zeux/pugixml/archive/refs/tags/v1.15.tar.gz"
  sha256: "b39647064d9e28297a34278bfb897092bf33b7c487906ddfc094c9e8868bddcb"

catch2:
  url: "https://github.com/catchorg/Catch2/archive/refs/tags/v3.4.0.tar.gz"
  sha256: "122928b814b75717316c71af69bd2b43387643ba076a6ec16e7882bfb2dfacbb"

# 无源码补丁：本版本上游代码在 OHOS/clang15 上无需修改即可编译，
# 平台差异全部在 conanfile.py 的 generate() 里以 CMake 变量解决
# （SONAME/RUNPATH 规则、版本号覆盖、FetchContent 源目录）。
# 保留空的 patches 表：export_conandata_patches()/apply_conandata_patches()
# 两个落点保持可用，后续若有补丁直接追加到本表即可。
patches:
  "1.18.0.b2": []
