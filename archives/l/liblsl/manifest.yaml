# 软件级 manifest — liblsl

software: liblsl
display: "liblsl (Lab Streaming Layer)"
description: "跨设备、时间同步的实时数据流传输库（LSL 协议）的 C/C++ 参考实现"
category: library
homepage: "https://github.com/sccn/liblsl"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 4.1.2 无 Platform/HarmonyOS.cmake：需用 CMAKE_USER_MAKE_RULES_OVERRIDE_{C,CXX} 补齐 SONAME/RUNPATH 链接标志（否则无 SONAME、写不进 RUNPATH）"
    - "cmake --install 改写 RUNPATH 会破坏 OHOS ELF 代码签名：需 CMAKE_BUILD_WITH_INSTALL_RPATH=ON"
    - "上游 pugixml/Catch2 走 FetchContent git clone：改为 conan get() 下载同版本 tarball + FETCHCONTENT_SOURCE_DIR_*"
    - "tag tarball 无 .git：用上游 LSL_VERSION_OVERRIDE 固定版本号，避免退化成内置 fallback"
  common_dependencies: []

versions:
  "1.18.0.b2":
    status: built
    build_date: "2026-09-20"
