# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libmpeg3/1.8.dfsg
homepage: "http://heroinewarrior.com/libmpeg3.php"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check (上游 Makefile 无 check 目标，返回 No rule to make target 'check')"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "鸿蒙特有消费者测试：在 OHOS/aarch64 下链接 libmpeg3 并调用版本与 CPU 配置 API"
    command: "./test_libmpeg3"

assertion_count: 5
