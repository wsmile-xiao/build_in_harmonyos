version: "1.10.6"
software: "libnma-gtk4"
status: built
build_date: "2026-09-23"
conan_ref: "libnma-gtk4/1.10.6"
build_system: "meson"
source:
  url: "https://download.gnome.org/sources/libnma/1.10/libnma-1.10.6.tar.xz"
  sha256: "53a6fb2b190ad37c5986caed3e98bede7c3c602399ee4f93c8fc054303d76dab"
  tar_format: tar.xz
build:
  system: meson
  configure_options:
    - "-Dlibnma_gtk3=false"
    - "-Dlibnma_gtk4=true"
    - "-Dgcr=false"
    - "-Diso_codes=false"
    - "-Dmobile_broadband_provider_info=false"
    - "-Dld_gc=false"
    - "-Dgtk_doc=false"
    - "-Dintrospection=false"
    - "-Dvapi=false"
  dependencies:
    - gtk4/4.22.4
    - libnm/1.58.0
    - glib/2.84.0.1.1
  cc: clang
  cxx: clang++
patches_applied:
  - "patches/0001-meson-add-libnma_gtk3-option.patch"
knowledge_gained:
  - "上游 meson 无条件探测 gtk+-3.0 且始终构建 gtk3 主库——补丁新增 libnma_gtk3 选项（默认 true），false 时共享基础设施（utils-libnm/gir_sources/tests）改用 gtk4 头编译（源码 GTK_CHECK_VERSION(4,0,0) 双兼容分支），gtk3 全链出图，pango 双版本冲突从根上消除"
  - "GNOME 官方 release tarball 自带 src/libnma-gtk4/ 下 17 个预转换 Gtk4 .ui 文件（Makefile.am EXTRA_DIST），meson 走 dist 分支免去构建期 gtk4-builder-tool 3to4 在线转换（GitHub tag archive 缺该目录会走 generator 转换，依赖可执行的 gtk4-builder-tool——OHOS 需签名，官方 dist tarball 从根上绕开）"
  - "glib 包内真实 pc 目录需追加进 meson native file 的 pkg_config_path（libnm 1.58.0 模式）：上游 meson.build:176 硬依赖 gmodule-export-2.0，其 Requires 链 gmodule-no-export-2.0 只有 glib 包内 pc 提供，PkgConfigDeps 不产出"
  - "glib 系 pc 工具变量注入用 shell wrapper（wrapper 内 export LD_LIBRARY_PATH=glib包lib）而非裸路径：glib-compile-resources 等 ELF 工具无 RPATH，ninja custom command 环境下直接执行报 Error loading shared library libgio-2.0.so.0——meson 1.12 通过 gio-2.0.pc 的 glib_compile_resources 变量定位该工具"
  - "meson test 的 conanbuildenv 包装会把 gettext 工具包 lib 目录排进 LD_LIBRARY_PATH 前部：gettext 的 libintl.so.8 只导出 libintl_*（无 g_ 前缀），先加载遮蔽 glib vendor 的 libintl（g_libintl_* 版本），libgtk-4 等一整链加载期 Error relocating g_libintl_*——用 subprocess 直跑 meson test --no-rebuild + os.environ 精拼 LD_LIBRARY_PATH（runtime-lib 物化目录最前，含 glib vendor libintl 全家真拷贝）绕开"
  - "test_package 消费者测试必须用 pkg-config/meson 拼法（gtk4 test_package 同款）：CMakeDeps 会把传递依赖 targets 全展开，graphene→glib2/2.88.0 的静态库（libglib-2.0.a/libgobject-2.0.a）与 glib/2.84.0.1.1 动态库同时排进链接行——静态 glib 2.88 符号进二进制+运行时加载动态 glib 2.84 → GType 双状态 abort（g_type_register_static assertion failed）"
upstream_tests:
  framework: "meson test"
  registered_cases: 1
  detail:
    "src/utils/test-utils": 1
  consumer_test:
    name: "test_libnma_gtk4"
    assertions: 9
    runs_on_ohos: true
  local_run_evidence: "meson test -v --no-rebuild 实跑：test-utils 35 项 TAP 断言全 ok（/ap_hash/* 等），HMBS_UPSTREAM_TEST_RESULT={passed:1,failed:0}；test_package 二进制实跑 OK: QR pipeline verified"
