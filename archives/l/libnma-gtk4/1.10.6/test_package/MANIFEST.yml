# test_package/MANIFEST.yml - libnma-gtk4 1.10.6
# 遵循 ARCHIVE-SPEC v2.0；数字全部来自实测日志，无占位符

package: "libnma-gtk4/1.10.6"
homepage: "https://gitlab.gnome.org/GNOME/libnma"

# ============================================================
# 上游测试套件申报（R51）
# ============================================================
# 上游 meson.build 注册 test() 共 1 例（src/utils/meson.build:37
# test(test_unit, exe)，test-utils——utils.c 纯函数单测，链接
# utils-libnm 静态库，依赖 gtk+libnm）。src/tests 下 8 个示例
# executable()（bar-code/cert-chooser/mobile-wizard/run-vpn/
# vpn-password-dialog/wifi-dialog/wifi-dialog-secrets/ws）与 gtk4
# 启用后追加的 8 个 -gtk4 示例 executable() 均不注册 test()，
# 属构建级验证（meson build 编译通过即覆盖）。
#
# test-utils 在 conan create 的 build 阶段经 meson.test() 真跑，
# 结果解析自 meson-logs/testlog.txt（HMBS_UPSTREAM_TEST_RESULT
# 标记输出，libnm 1.58.0 同款口径）。
upstream_test_summary:
  framework: "meson test"
  registered_cases: 1
  detail:
    "src/utils/test-utils": 1   # utils.c pure-function unit test (link: utils-libnm static lib)
  consumer_test:
    name: "test_libnma_gtk4"
    assertions: 9               # version macros (3), GType registration (2), QR encode sizes (4)
    runs_on_ohos: true

status: pass
