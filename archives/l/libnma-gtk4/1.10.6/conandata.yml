sources:
  # 上游官方 release 站（本机实测 200 OK）。GNOME 镜像同步滞后：
  # USTC/TUNA/BFSU/SJTU 均无 1.10.6（404），NJU 已同步。
  # CI 自动镜像 fallback 会追加可达镜像（R39 官方源纪律）。
  url:
    - "https://download.gnome.org/sources/libnma/1.10/libnma-1.10.6.tar.xz"
    - "https://mirror.nju.edu.cn/gnome/sources/libnma/1.10/libnma-1.10.6.tar.xz"
  sha256: "53a6fb2b190ad37c5986caed3e98bede7c3c602399ee4f93c8fc054303d76dab"

patches:
  - patch_file: "patches/0001-meson-add-libnma_gtk3-option.patch"
    patch_description: >-
      Add a libnma_gtk3 meson option (default true). Upstream
      unconditionally probes gtk+-3.0 and always builds the gtk3 main
      library next to the optional gtk4 variant. This gtk4-variant split
      package only ships the gtk4 output: with libnma_gtk3=false the
      gtk+-3.0 probe is skipped and the shared infrastructure
      (utils-libnm, gir_sources, tests) compiles against the gtk4
      headers instead — the sources are gtk3/gtk4 dual-compatible
      (GTK_CHECK_VERSION(4,0,0) branches in utils.c and every src/*.c
      consumer). Keeps the dependency graph on the single gtk4 stack
      (pango 1.56 line); no gtk3 binary/stack is pulled in. Default
      true keeps the upstream build unchanged.
    patch_type: "portability"
