version: "0.20.8.1"

# published | built | failed | archived
# R29: conan_verify 通过后才可标记 published；本地 create 通过先标 built
# R37: 上游 0.20.8 + 修复后缀 .1（配方守卫修复版，源码仍为上游 0.20.8 归档）
status: built

build_date: "2026-09-02"
build_system: autotools

source:
  # R37: 工程版本 0.20.8.1，source 仍为上游 0.20.8 官方归档（同 sha256）
  url: "https://download.gnome.org/sources/libgee/0.20/libgee-0.20.8.tar.xz"
  sha256: "189815ac143d89867193b0c52b7dc31f3aa108a15f04d6b5dca2b6adfad0b0ee"
  tar_format: tar.xz

build:
  system: autotools
  configure_options: []
  # glib/2.84.0 为制品仓依赖；configure 用 PKG_CHECK_MODULES 检查
  # glib-2.0/gobject-2.0/gio-2.0 >= 2.36（pkg-config 注入）。
  # R37: 保持 glib/2.84.0 pin 不变（最小修复；消费方 graph 版本冲突由
  # granite 顶层 force 统一处理，本包升 pin 反而引入 zlib/1.3.1.1 改全图）
  dependencies:
    - "glib/2.84.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-umask.patch"

knowledge_gained:
  - "同版本修复(2026-09-10, 版本保持 0.20.8.1): lld 15.0.4 对 DT_NEEDED 闭包不可定位的输入 DSO 静默跳过 --no-allow-shlib-undefined 检查（检查执行与否取决于闭包能否经默认搜索路径解析），g_libintl_* 唯一供给者 glib 包 lib/libintl.so.8 不在依赖闭包/链接行上 → tests 链接跨 worker 不确定（严格检查被执行时报 undefined；闭包残缺时链成功但运行失败）；修法：generate() 第一依赖循环内、tc.environment() 快照之前（快照后追加 extra_ldflags 被静默丢弃，fixA2/fixA2b 实证）注入 -Wl,-rpath-link 与受 isfile 守卫的 lib/libintl.so 显式输入；6 组隔离 conan create 全 PASS，产物 DT_NEEDED 与现网成功产物一致零回归"
  - "R37: 上游 0.20.8 published as 0.20.8.1 —— generate() 两个、build() 一个依赖循环加 package_folder=None 守卫（消费方 graph 中 SHARED 库的 STATIC 子依赖被标记 Skipped binaries：package_folder=None；SHARED×STATIC+中间节点 Cache 图形态，granite ci-run2/3 实证），未守卫循环即 TypeError 崩溃；全新全链源码构建不触发，守卫在该图形态下为必要防御"
  - "libgee 是 GObject 集合库（Vala 编写），Autotools 构建，官方 tarball 自带预生成的 .c 与 vala stamp，无需 valac"
  - "VALA_CHECK 通过 checkfile（.stamp）存在与否决定是否启用 vala 模式，tarball 自带 stamp → enable_vala=no"
  - "GOBJECT_INTROSPECTION_CHECK 默认 auto，OHOS 无 gobject-introspection 时自动降级不报错"
  - "config.guess/sub 需加 HarmonyOS → aarch64-unknown-linux-ohos 支持（同 vala 配方补丁）"
  - "make check 使用 gtester（glib 提供），需把 glib 包 bin 加入 PATH、lib 加入 LD_LIBRARY_PATH"
  - "libgee 头文件安装在 include/gee-0.8（geeincludedir），pkg-config 名 gee-0.8"

