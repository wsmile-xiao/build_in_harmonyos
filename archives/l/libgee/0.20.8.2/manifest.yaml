knowledge_gained:
  - "libgee 是 GObject 集合库（Vala 编写），Autotools 构建，官方 tarball 自带预生成的 .c 与 vala stamp，无需 valac"
  - "VALA_CHECK 通过 checkfile（.stamp）存在与否决定是否启用 vala 模式，tarball 自带 stamp → enable_vala=no"
  - "GOBJECT_INTROSPECTION_CHECK 默认 auto，OHOS 无 gobject-introspection 时自动降级不报错"
  - "config.guess/sub 需加 HarmonyOS → aarch64-unknown-linux-ohos 支持（同 vala 配方补丁）"
  - "make check 使用 gtester（glib 提供），需把 glib 包 bin 加入 PATH、lib 加入 LD_LIBRARY_PATH"
  - "libgee 头文件安装在 include/gee-0.8（geeincludedir），pkg-config 名 gee-0.8"

