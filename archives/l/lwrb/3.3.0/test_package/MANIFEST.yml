# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lwrb/3.3.0
homepage: "https://github.com/MaJerle/lwrb"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游测试项目: lwrb/test/CMakeLists.txt (project lwrb-testing), Unity 框架
upstream_check_command: "cd lwrb/test && cmake -S . -B build && cmake --build build && ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake -S <src>/lwrb/test -B <build>/upstream-test && cmake --build <build>/upstream-test && ./lwrb_test && ./lwrb_test_ex"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.c
    source: lwrb-3.3.0/lwrb/test/test.c
    description: "Unity 单元测试 - 核心环形缓冲 API（lwrb_init/write/read/get_full），5 个 RUN_TEST 用例，16 条断言"
    command: "./lwrb_test"
  - file: test/test_ex.c
    source: lwrb-3.3.0/lwrb/test/test_ex.c
    description: "Unity 单元测试 - 扩展 API（lwrb_ex_copy/lwrb_ex_overwrite），10 个 TEST_CASE 用例，106 条断言；由补丁 0002 纳入 lwrb_test_ex 目标"
    command: "./lwrb_test_ex"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅通过已安装公开头文件 lwrb/lwrb.h 使用 lwrb_init/write/read/get_full 完成环形缓冲写入-读出往返并校验内容"
    command: "./test_lwrb"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 123