# conandata.yml — lwrb 3.3.0
# 官方来源：https://github.com/MaJerle/lwrb（tag v3.3.0）
# GitHub 源码归档不含 submodule 内容；Unity/sanitizers-cmake 测试框架单独获取。
# 仅登记官方原始 URL；镜像 fallback 由 CI 构建脚本（build_and_test.sh）自动注入。

sources:
  url: "https://github.com/MaJerle/lwrb/archive/refs/tags/v3.3.0.tar.gz"
  sha256: "93450baf218b41724c4ae448330d41b8d981a2822b82be0443a4cb2a38a3d287"

# 上游测试依赖（lwrb/test/CMakeLists.txt 通过 third_party/Unity 路径引用，
# 而 GitHub 归档中该 submodule 为空）：获取 Unity 2.7.0 发布包补齐。
unity:
  url: "https://github.com/ThrowTheSwitch/Unity/archive/refs/tags/v2.7.0.tar.gz"
  sha256: "e84eb301ca7967831e68b1728f911e87fa2d345d8ddb64f897bc2f2ee24a321c"

# 上游测试构建还需要 sanitizers-cmake（lwrb/test 的 find_package(Sanitizers)
# 与 add_sanitizers() 依赖它），同样在归档中为空 submodule。
# 注：仓库无任何 release tag（v0.1.0 归档 404），故用官方 master 分支归档。
sanitizers_cmake:
  url: "https://github.com/arsenm/sanitizers-cmake/archive/refs/heads/master.tar.gz"
  sha256: "8d40d50f148cb9625df30de30afcb34db9bc2bbccb9267760f9866ca95bfd3dd"

patches:
  - patch_file: "patches/0001-CMakeLists-dev-option.patch"
    patch_description: "Add LWRB_BUILD_DEV option so the Conan recipe can build the libraries without the dev-only demo executable and its PUBLIC WIN32/_DEBUG/CONSOLE/LWRB_DEV definitions leaking to consumers"
    patch_type: "portability"
  - patch_file: "patches/0002-test-ex-target.patch"
    patch_description: "Wire the standalone upstream test_ex.c (10 Unity cases, guarded by TEST) into the test project as lwrb_test_ex so the full upstream suite is instantiated and run"
    patch_type: "portability"
  - patch_file: "patches/0003-test-ex-api-port.patch"
    patch_description: "Port stale upstream test_ex.c to the lwrb 3.3.0 public API: struct fields r/w renamed to r_ptr/w_ptr, lwrb_copy() renamed to lwrb_move()"
    patch_type: "portability"
  - patch_file: "patches/0004-lwrb-test-ex-runner.patch"
    patch_description: "Add a main() runner for lwrb_test_ex (upstream test_ex.c defines Unity cases only, never wired into a build target, so it has no entry point)"
    patch_type: "portability"