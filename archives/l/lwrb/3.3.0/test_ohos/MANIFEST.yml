# test_ohos/MANIFEST.yml
# lwrb 3.3.0 HarmonyOS PC 专项验证声明
# 与上游 Unity 测试、test_package 消费者分别计数，不重复充数

package: lwrb/3.3.0
kind: ohos_specific

# 运行入口
command: "python3 run_ohos_test.py <conan_package_folder>"

# 检查项
checks:
  - id: T1
    name: "aarch64 ELF64 验证"
    detail: "消费者可执行文件为 ELF64 AArch64，可在 OHOS PC 执行"
  - id: T2
    name: "无 glibc/ld-linux 依赖"
    detail: "OHOS musl 运行时，无 GLIBC_/ld-linux 依赖"
  - id: T3
    name: "无宿主绝对路径泄漏"
    detail: "产物不包含 /storage、/opt、/Users、currentUser 等构建机路径"
  - id: T4
    name: "真实环形缓冲往返校验"
    detail: "仅用公开头文件与公开 API（init/write/read/peek/free/full/线性块+advance）完成写入-读出往返、满/空状态机与数据校验，输出 LWRB_OHOS_OK"

# 消费者源
consumer_source: "lwrb_consumer.c"

# 调用的公开 API
public_api:
  - lwrb_init
  - lwrb_is_ready
  - lwrb_write
  - lwrb_read
  - lwrb_get_free
  - lwrb_get_full
  - lwrb_reset
  - lwrb_get_linear_block_write_address
  - lwrb_get_linear_block_write_length
  - lwrb_advance
