software: libyder
display: "Yder"
description: "Logging library for C applications (console, file, syslog, callback; journald disabled on OHOS)"
homepage: "https://github.com/babelouest/yder/"
license: "LGPL-2.1-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Pure C99 logging library; runtime deps = libc + orcania (hard dependency)"
    - "journald (systemd sd_journal_print) does not exist on OHOS: build with WITH_JOURNALD=OFF (sets Y_DISABLE_JOURNALD in yder-cfg.h)"
    - "syslog mode works on OHOS (libc exports openlog/syslog/closelog)"
    - "/tmp is read-only on HarmonyOS PC (E002): upstream /tmp/test.log file-mode fixture routed through $TMPDIR via portability patch"
    - "Conan CMakeDeps exports Orcania_VERSION_STRING (camel case); upstream checks ORCANIA_VERSION_STRING — patch accepts both"
    - "find_package(Check) forced MODULE so the bundled FindCheck.cmake runs under CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON"
    - "Test suite (check/0.15.2, ohpcd) runs the 15 upstream check cases inside conan create"
  common_dependencies:
    - libc
    - orcania

versions:
  "1.4.20":
    status: built
    build_date: "2026-09-16"
    notes: "Initial OHOS aarch64 adaptation. 15/15 upstream check cases pass inside conan create. Portability patch only (CMake wiring + TMPDIR test fixture); upstream assertions untouched."
