version: "1.4.20"
software: libyder
status: built
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://github.com/babelouest/yder/archive/refs/tags/v1.4.20.tar.gz"
  sha256: "c1a7f2281514d0d0bba912b6b70f371d8c127ccfd644b8c438c9301a0fd4c5f2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - BUILD_SHARED=OFF
    - BUILD_STATIC=ON
    - WITH_JOURNALD=OFF
    - BUILD_YDER_TESTING=ON
    - BUILD_YDER_DOCUMENTATION=OFF
    - BUILD_RPM=OFF
    - INSTALL_HEADER=ON
  dependencies:
    - name: orcania
      version: 2.3.3
      role: requires  # hard runtime dependency (o_malloc/o_strdup/split_string)
    - name: check
      version: 0.15.2
      role: test_requires  # build/run upstream CTest suite only; not a consumer dep

patches_applied:
  - patch_file: "patches/0001-ohos-portability.patch"
    patch_type: portability
    description: "CMake: accept CMakeDeps camel-case Orcania_VERSION_STRING; force find_package(Check MODULE); make Subunit optional (self-contained ohpcd libcheck, same as orcania 2.3.3); link Orcania::Orcania-static when exported. test: resolve the log fixture through POSIX $TMPDIR when set (fallback /tmp/test.log, no platform ifdefs per R8); FILE-mode case additionally verifies written log content. Upstream assertion expected results untouched."

knowledge_gained:
  - "libyder 1.4.20 is a C99 logging library; runtime deps = libc + orcania (hard dependency, o_malloc/o_strdup/split_string used throughout src/yder.c). Test-build stage depends on check/0.15.2 (ohpcd)."
  - "Upstream v1.4.20 test suite = 1 CTest executable (yder_test) with 15 START_TEST cases (Check framework, EXCLUDE_FROM_ALL); all 15 pass on OHOS aarch64 inside conan create."
  - "WITH_JOURNALD=OFF is the correct OHOS configuration: no systemd journals on OHOS. yder-cfg.h gets Y_DISABLE_JOURNALD and the journald init test then expects the upstream-defined failure path (return 0)."
  - "OHOS libc exports syslog/openlog/closelog symbols, so Y_LOG_MODE_SYSLOG works out of the box; /tmp is read-only (E002), so the upstream /tmp/test.log file-mode fixture is routed through $TMPDIR via a portability patch that keeps the Y_LOG_MODE_FILE semantics (fopen append + close) untouched."
  - "Conan CMakeDeps exports Orcania_VERSION_STRING (camel case) while upstream yder checks ORCANIA_VERSION_STRING — the version gate would FATAL_ERROR with an empty version despite find_package succeeding; the portability patch accepts both spellings (the gate is still enforced by OrcaniaConfigVersion.cmake)."
  - "find_package(Check) must be forced MODULE: the conan toolchain sets CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON, which would resolve it to the CMakeDeps check-config.cmake (Check_FOUND/Check::check) and silently skip upstream's bundled FindCheck.cmake (CHECK_FOUND/Check::Check), dropping the CTest tree — same class of issue handled in orcania 2.3.3 by not passing CMAKE_PREFIX_PATH."
