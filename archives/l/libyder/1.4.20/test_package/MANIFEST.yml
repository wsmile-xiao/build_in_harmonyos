# test_package/MANIFEST.yml - libyder 1.4.20
# CI L0e requires this file to exist. Upstream test declaration (rule 4:
# no fabricated pass rates — every number below is backed by the conan create
# build log which builds + runs the unmodified upstream check suite).

package: libyder/1.4.20
homepage: "https://github.com/babelouest/yder/"

# Upstream v1.4.20 exposes a CTest suite via BUILD_YDER_TESTING=ON
# (Check framework, test/yder_test.c with 15 START_TEST cases registered into
# a single yder_test executable). The recipe's conanfile.py build() enables it
# and runs ctest against the unmodified upstream tests.
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

# The official upstream check suite. One executable (yder_test), 15 cases:
# init_console / init_file / init_syslog / init_journald / init_error_file /
# init_multiple_error / init_multiple_ok / init_close_multiple / callback /
# level_debug / level_info / level_warning / level_error / date_format /
# newline_split. All 15 pass on OHOS aarch64 inside conan create
# ("100%: Checks: 15, Failures: 0, Errors: 0"); journald mode is
# Y_DISABLE_JOURNALD by the WITH_JOURNALD=OFF option (systemd journals do not
# exist on OHOS), and the case's expectation (y_init_logs == 0 for journald
# mode) is the upstream-defined behaviour for that configuration.
upstream_tests:
  - file: test/yder_test.c
    source: yder-1.4.20/test/yder_test.c
    description: "full upstream check suite: 15 START_TEST cases in one CTest executable (console/file/syslog/journald/callback modes, level filtering, date format, newline split)"
    command: "./yder_test"

# test_package tests (consumer perspective: link Yder::Yder-static and
# exercise the public API on OHOS aarch64) — HarmonyOS-added validation.
test_package_tests:
  - file: test_yder.c
    description: "Compile + link consumer that runs console init/close, file-mode logging into $TMPDIR (OHOS /tmp is read-only), callback mode with level filtering (DEBUG dropped at WARNING, WARNING/ERROR delivered), y_set_date_format accept/reject, y_set_split_message_newline 3-line split; asserts the binary runs and prints PASS"
    command: "./test_yder"

# HarmonyOS-added consumer assertions (5 API check groups in a single run:
# console init/close, file mode, callback level filtering x2, date format
# accept+reject, newline split). The 15 upstream check cases are tracked
# separately in upstream_tests above.
assertion_count: 5
