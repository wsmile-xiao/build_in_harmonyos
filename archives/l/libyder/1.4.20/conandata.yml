patches:
  "1.4.20":
    - patch_file: "patches/0001-ohos-portability.patch"
      patch_description: "OHOS portability: (1) accept Orcania_VERSION_STRING (CMakeDeps camel-case export) in the version gate; (2) force find_package(Check MODULE) so yder's bundled FindCheck.cmake runs under CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON; (3) make the Subunit hard-requirement optional (ohpcd libcheck is self-contained, same relaxation as orcania 2.3.3); (4) link Orcania::Orcania-static when that is the exported target; (5) resolve the log file fixture through POSIX $TMPDIR when set, falling back to /tmp/test.log unchanged on regular Linux (OHOS /tmp is read-only) — no platform ifdefs, pure POSIX getenv; the FILE-mode test additionally verifies the written log content. Upstream test assertions keep their expected results."
      patch_type: portability
