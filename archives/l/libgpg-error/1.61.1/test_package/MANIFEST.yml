package: libgpg-error/1.61.1
# 上游测试**已实测**（2026-09-27，本任务真实执行 make check）：
#   configure（不加 --disable-tests）+ make + make check
#   → 15 项 = tests/Makefile.am 的 TESTS 14 项 + src/Makefile 的
#     gpg-error-config-test.sh 1 项；14 通过、t-argparse 1 项失败（93.3%）。
#   失败项 t-argparse 的根因是**测试环境限制**（进程 UID 20020101 不在
#   /etc/passwd，getpwuid() 返回 NULL），非库缺陷 —— 详见 upstream_tests.detail。
#
# 复现（与本配方 build() 相同的适配手段）：
#   configure **不加 --disable-tests**（配方默认关闭以缩短出包时间）
#   make && make check
#   另需：configure 内 umask 077→022（HMDFS 上 confXXXXXX 创建会 Permission denied）、
#   TMPDIR 指向可写目录、关闭 config.h 的 USE_POSIX_THREADS_WEAK（musl 误判）
upstream_check_command: "configure（不加 --disable-tests）&& make && make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游测试：tests/Makefile.am 的 TESTS（14 项）+ src/Makefile 的 gpg-error-config-test.sh（1 项）
upstream_tests:
  - name: gpg-error-config-test.sh
    result: "PASS（独立于 tests/ 14 项）"
  - name: t-version
    result: "PASS"
  - name: t-strerror
    result: "PASS"
  - name: t-syserror
    result: "PASS"
  - name: t-lock
    result: "PASS"
  - name: t-printf
    result: "PASS"
  - name: t-poll
    result: "PASS"
  - name: t-b64
    result: "PASS"
  - name: t-argparse
    result: "FAIL（环境限制，非库缺陷）"
    detail: >-
      崩溃点：src/sysutils.c 的 _gpgrt_getusername()（:683）在
      :715 调用 getpwuid(getuid()) 取当前用户名；getpwuid() 返回 NULL →
      src/argparse.c:693 assure_username() 报
      "error getting current user's name: System error w/o errno" 并返回
      ARGPARSE_PERMISSION_ERROR，tests/etc/t-argparse.conf 的
      ${_user} 展开（:11/:18/:57/:78）期望输出与实际不一致。
      崩溃原因：进程 UID 20020101 不在 /etc/passwd（pwd.getpwuid(20020101)
      → KeyError；getent passwd 20020101 无结果），/etc/passwd 为
      root 属主 0644 只读（os.access W_OK=False），无免密 sudo
      （sudo -n true exit 1），且 _gpgrt_getusername() 非 W32 分支**无
      环境变量回退**（不读 $USER/$LOGNAME，仅有 getpwuid 一路）。
      已确认为测试宿主 passwd 数据库缺失的环境限制，非库缺陷；无
      可修复路径（passwd 不可写、无 sudo、代码无 env 回退）。
  - name: t-logging
    result: "PASS"
  - name: t-stringutils
    result: "PASS"
  - name: t-malloc
    result: "PASS"
  - name: t-spawn
    result: "PASS"
  - name: t-strlist
    result: "PASS"
  - name: t-name-value
    result: "PASS"

test_package_tests:
  - file: test.c
    description: >-
      鸿蒙特有测试：dlopen 真实加载 libgpg-error.so，dlsym 解析并**实际调用**
      gpg_strerror(GPG_ERR_NO_ERROR)（期望 "Success"）、
      gpg_strsource(GPG_ERR_SOURCE_ANY)、gpg_error_check_version(NULL)
      （gpgrt/gpg-error 版本 API）——R34 反空壳，证明库在 OHOS 上
      dlopen/dlsym/API 调用全链路可用。
    command: "./test_probe"

# 断言总数：上游 15（14 TESTS + config-test）+ test_package 1
assertion_count: 16
upstream_test_note: "14/15 通过（93.3%）；t-argparse 因宿主 UID 不在 /etc/passwd 而失败（环境限制，非库缺陷），与 1.61 基线结论一致"
