software: libgpg-error
# 版本级 manifest — archives/l/libgpg-error/1.61.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# R37 迭代说明：1.61.1 为 1.61 的适配版本迭代（上游源码仍为 1.61 官方 tarball），
# 适配方案与 1.61（main 已合入并发布 ohpcd）完全一致，仅版本号后缀区分。

# ============================================================
# 必须字段
# ============================================================

version: "1.61.1"

# 编译状态
status: built

build_system: autotools

build_date: "2026-09-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 URL（R39：单一官方 URL，无手写镜像前缀）
  # 1.61.1 无独立上游 tarball，指向 1.61 官方源（R37）
  url: "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.61.tar.bz2"
  sha256: "7a85413f2bc354f4f8aa832b718af122e48965e9e0eb9012ee659c13c6385c93"
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"
    - "--disable-nls"
    - "--disable-doc"
    - "--disable-tests"
    - "--disable-static"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

# ============================================================
# 测试信息
# ============================================================

test_status: built

test_note: "上游测试**已实测**（2026-09-27，本任务真实执行 make check）：共 **15 项 = tests/Makefile.am 的 TESTS 14 项 + src/Makefile 的 gpg-error-config-test.sh 1 项**，**14 通过、1 失败（93.3%）**。逐项：PASS = gpg-error-config-test.sh / t-version / t-strerror / t-syserror / t-lock / t-printf / t-poll / t-b64 / t-logging / t-stringutils / t-malloc / t-spawn / t-strlist / t-name-value（14 项）；FAIL = **t-argparse**（1 项）。t-argparse 失败根因**已复核定位，属测试环境限制而非库缺陷**：崩溃点 src/sysutils.c 的 _gpgrt_getusername()（:683）在 :715 调 getpwuid(getuid()) 取当前用户名，而进程 UID 20020101 不在 /etc/passwd（pwd.getpwuid(20020101) → KeyError；getent passwd 20020101 无结果）→ getpwuid() 返回 NULL → src/argparse.c:693 报 'error getting current user's name: System error w/o errno' 并返回 ARGPARSE_PERMISSION_ERROR，tests/etc/t-argparse.conf 的 ${_user} 展开（:11/:18/:57/:78）期望输出不一致。已确认**不可修复**：/etc/passwd 为 root 属主 0644 只读（os.access W_OK=False）、无免密 sudo（sudo -n true exit 1）、_gpgrt_getusername() 非 W32 分支**无环境变量回退**（不读 $USER/$LOGNAME，仅 getpwuid 一路）。复现命令：configure **不加 --disable-tests**（配方默认关闭以缩短出包时间），make && make check；另需 configure 内 umask 077→022（HMDFS 上 confXXXXXX 创建会 Permission denied）、TMPDIR 指向可写目录、关闭 config.h 的 USE_POSIX_THREADS_WEAK（musl 误判）。test_package：鸿蒙特有测试 dlopen 真实加载 libgpg-error.so 并 dlsym 实际调用 gpg_strerror(GPG_ERR_NO_ERROR)='Success' / gpg_strsource(GPG_ERR_SOURCE_ANY)='Unspecified source' / gpg_error_check_version()='1.61'（R34 反空壳），实测 PASS。"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libgpg-error 是 gnupg 链基座（gnupg / libassuan / libksba / npth / pinentry 均依赖）"
  - "OHOS 上须显式指定 --build/--host=aarch64-unknown-linux-musl：设备 HMDFS 上 config.guess 的 mktemp 探针写 dummy.c 报 Permission denied（'unable to guess system type'）→ configure 中止；build==host 使其为原生模式，libgpg-error 据此按设备真实 musl 尺寸生成 lock-obj（而非误用 glibc 预置头）——后者会导致后续 gnupg 链运行期 pthread 锁尺寸不匹配"
  - "TMPDIR 须指向可写目录（conan build 目录）：设备默认 TMPDIR 在 HMDFS 上写临时文件失败"
  - "configure 的 umask 077 在 HMDFS 上会导致临时文件权限问题，需改为 022"
  - "musl 下 gnulib threadlib.m4 的 gl_pthread_in_glibc 只认 glibc，会把 musl 误判为需 -lpthread 并定义 USE_POSIX_THREADS_WEAK；musl 的 pthread 在 libc 内，该 weak 引用不声明 pthread_cancel → 编译报 use of undeclared identifier 'pthread_cancel'。去掉 config.h 的 WEAK 定义即可（回退 use_pthread_p()=(1)）"
  - "1.61 自带 config.guess/config.sub 的 HarmonyOS patch（本 PR 保留），与显式 --build/--host 方案构成双重保障"
  - "上游 make check 共 15 项（tests/ 14 TESTS + src/ gpg-error-config-test.sh），t-argparse 因宿主 UID 不在 /etc/passwd 失败（getpwuid 返回 NULL，代码无 env 回退）——测试环境限制，非库缺陷（R51 实测口径）"
