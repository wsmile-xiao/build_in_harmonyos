software: libgpg-error
# 版本级 manifest — archives/l/libgpg-error/1.61/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.61"

# 编译状态
status: built

build_system: autotools

build_date: "2026-09-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 URL（R39：单一官方 URL，无手写镜像前缀）
  url: "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.61.tar.bz2"
  sha256: "7a85413f2bc354f4f8aa832b718af122e48965e9e0eb9012ee659c13c6385c93"
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"
    - "--disable-nls"
    - "--disable-doc"
    - "--disable-tests"
    - "--disable-static"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

# ============================================================
# 测试信息
# ============================================================

test_status: passed

test_note: "上游测试**已实测**（2026-09-11）：tests/ 的 **14 个 TESTS 中 13 通过**（92.9%）——另有 gpg-error-config-test.sh 独立 PASS。逐项：PASS = t-version / t-strerror / t-syserror / t-lock / t-printf / t-poll / t-b64 / t-logging / t-stringutils / t-malloc / t-spawn / t-strlist / t-name-value（13 个）；FAIL = **t-argparse**（1 个）。t-argparse 失败根因**已定位，属测试环境限制而非库缺陷**：src/sysutils.c 用 `getpwuid(getuid())` 取当前用户名（:665/:715），而本进程 UID **20020085 不在 /etc/passwd**（`getent passwd 20020085` 为空）→ 报 `error getting current user's name: System error w/o errno`，致解析 ${_user}/${user} 的期望输出不一致。复现命令：configure **不加 --disable-tests**（配方默认关闭以缩短出包时间），`make && make check`；另需 configure 内 umask 077→022（HMDFS 上 `can't create ./confXXXXXX/... : Permission denied`）。test_package：dlopen 真实加载 libgpg-error.so 并 dlsym('gpg_strerror') 解析真实导出符号（R34 反空壳），实测 PASS。1.61 为 1.55 的同族版本升级，接口无变化。"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libgpg-error 是 gnupg 链基座（gnupg / libassuan / libksba / npth / pinentry 均依赖）"
  - "OHOS 上须显式指定 --build/--host=aarch64-unknown-linux-musl：设备 HMDFS 上 config.guess 的 mktemp 探针写 dummy.c 报 Permission denied（'unable to guess system type'）→ configure 中止；build==host 使其为原生模式，libgpg-error 据此按设备真实 musl 尺寸生成 lock-obj（而非误用 glibc 预置头）——后者会导致后续 gnupg 链运行期 pthread 锁尺寸不匹配"
  - "TMPDIR 须指向可写目录（conan build 目录）：设备默认 TMPDIR 在 HMDFS 上写临时文件失败"
  - "configure 的 umask 077 在 HMDFS 上会导致临时文件权限问题，需改为 022"
  - "musl 下 gnulib threadlib.m4 的 gl_pthread_in_glibc 只认 glibc，会把 musl 误判为需 -lpthread 并定义 USE_POSIX_THREADS_WEAK；musl 的 pthread 在 libc 内，该 weak 引用不声明 pthread_cancel → 编译报 use of undeclared identifier 'pthread_cancel'。去掉 config.h 的 WEAK 定义即可（回退 use_pthread_p()=(1)）"
  - "1.61 自带 config.guess/config.sub 的 HarmonyOS patch（本 PR 保留），与显式 --build/--host 方案构成双重保障"
