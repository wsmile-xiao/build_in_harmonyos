package: libgpg-error/1.61
# 上游测试**已实测**（2026-09-11）：14 个 TESTS 中 13 通过（92.9%），
# 另有 gpg-error-config-test.sh 独立 PASS。唯一失败 t-argparse 的根因是
# **测试环境限制**（UID 不在 /etc/passwd），非库缺陷 —— 详见 upstream_tests。
#
# 复现：
#   configure **不加 --disable-tests**（配方默认关闭以缩短出包时间）
#   make && make check
#   另需 configure 内 umask 077→022（HMDFS 上 confXXXXXX 创建会 Permission denied）
upstream_check_command: "configure（不加 --disable-tests）&& make && make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游测试：tests/Makefile.am 的 TESTS（14 项）+ 独立的 gpg-error-config-test.sh
upstream_tests:
  - name: t-version
    result: "PASS"
  - name: t-strerror
    result: "PASS"
  - name: t-syserror
    result: "PASS"
  - name: t-lock
    result: "PASS"
  - name: t-printf
    result: "PASS"
  - name: t-poll
    result: "PASS"
  - name: t-b64
    result: "PASS"
  - name: t-logging
    result: "PASS"
  - name: t-stringutils
    result: "PASS"
  - name: t-malloc
    result: "PASS"
  - name: t-spawn
    result: "PASS"
  - name: t-strlist
    result: "PASS"
  - name: t-name-value
    result: "PASS"
  - name: t-argparse
    result: "FAIL（环境限制，非库缺陷）"
    detail: >-
      src/sysutils.c 用 getpwuid(getuid()) 取当前用户名（:665 / :715）；
      本进程 UID 20020085 不在 /etc/passwd（getent passwd 20020085 为空）
      → 报 "error getting current user's name: System error w/o errno"
      → 解析 ${_user}/${user} 的期望输出不一致。
      与 1.55 及任何 libgpg-error 版本无关，属测试宿主的 passwd 数据库缺失。
  - name: gpg-error-config-test.sh
    result: "PASS（独立于 14 个 TESTS）"

test_package_tests:
  - file: test.c
    description: "dlopen 真实加载 libgpg-error.so 并 dlsym('gpg_strerror') 解析真实导出符号（R34 反空壳）"
    command: "./test_probe"

# 断言总数：上游 15（14 TESTS + config-test）+ test_package 1
assertion_count: 16
upstream_test_note: "13/14 TESTS 通过（92.9%）；t-argparse 因宿主 UID 不在 /etc/passwd 而失败（环境限制，非库缺陷）"
