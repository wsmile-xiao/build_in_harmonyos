# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lepton-eda/1.9.18
homepage: "https://github.com/lepton-eda/lepton-eda"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游测试套件为各子目录的 make check（liblepton/scheme 单测、
# utils/netlist 回归等），已在鸿蒙 PC 目标机构建树内真实全量执行：
# 507 个测试文件、2814 条结果 = PASS 2655 / FAIL 156 / XFAIL 3（上游预期失败），
# 156 项失败均为平台环境限制（依赖包内容缺口/HMDFS 语义/OHOS Guile 语义差异），
# 已逐条归因，未修改上游任何测试文件（详见版本级 notes.md「上游测试真实执行」专节）。
upstream_tests:
  - file: liblepton/tests
    source: lepton-eda-1.9.18/liblepton
    description: "上游 C 单元测试（make check 聚合，17/17 PASS）"
    command: "make check"
  - file: liblepton/scheme/unit-tests
    source: lepton-eda-1.9.18/liblepton
    description: "上游 Scheme 单元测试（srfi-64，1619/1641 PASS）"
    command: "make check"
  - file: tests
    source: lepton-eda-1.9.18/tests
    description: "顶层集成/功能测试（11 个 .test 驱动，含 netlist/symcheck golden 回归）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_lepton.sh
    description: "端到端冒烟: lepton-cli --version / lepton-symcheck 符号检查 / lepton-netlist spice-sdb 网表生成并断言 Q1 器件存在"
    command: "./test_lepton.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
