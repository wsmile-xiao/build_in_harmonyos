  "1.9.18":
    - patch_file: "patches/0001-Makefile.in.patch"
      patch_type: portability
      patch_description: "Omit the docs/ subdir (texinfo toolchain unavailable on OHOS)"
    - patch_file: "patches/0002-build-tools-config.guess.patch"
      patch_type: portability
      patch_description: "config.guess: recognize the aarch64-unknown-linux-ohos tuple"
    - patch_file: "patches/0003-build-tools-config.sub.patch"
      patch_type: portability
      patch_description: "config.sub: accept the aarch64-unknown-linux-ohos tuple"
    - patch_file: "patches/0004-liblepton-scheme-lepton-config.scm.patch"
      patch_type: portability
      patch_description: "Disable config-change callbacks (Guile libffi closures broken on OHOS)"
