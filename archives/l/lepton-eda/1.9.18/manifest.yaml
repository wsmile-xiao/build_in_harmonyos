# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS dlopen 只接受以 .so 结尾或无扩展名的库名，拒绝 .so.N 版本后缀（报 file not found）；lepton 的 FFI 需用 LIBLEPTON/LIBLEPTONGUI 环境变量指向无版本号 .so"
- "发布的 guile/2.2.7.x 二进制包缺少 libguile.h 汇总头，recipe 随包导出（同 libctl 先例）"
- "Guile libffi closures 不可用，config-change 回调必须禁用（patch 恒返 #f，仅影响配置变更通知）"
- "configure 以绝对路径调用可避免 automake install_sh 相对路径解析失败"
- "安装的 lepton-* 均为 Guile sh 脚本，package() 阶段重写为 ${GUILE:-guile} + scheme 树相对脚本位置重定位；C 侧数据目录经 XDG_DATA_DIRS runenv 定位"
- "USE_LDCONFIG 是 configure 的 precious 变量，可提供 fake ldconfig 生成 m4.scm 中的 GTK soname"
- "全量 make check 不可行（每个测试进程启动 Guile VM 3-64s），以 test_package 端到端冒烟（cli/symcheck/netlist）替代"

