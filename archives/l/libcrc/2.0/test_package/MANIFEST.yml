# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcrc/2.0
homepage: "https://github.com/lammertb/libcrc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make all && ./testall"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/testall.c
    source: libcrc-2.0/test/testall.c
    description: "testall 主程序：调用 test_crc() 与 test_checksum_NMEA() 两个测试函数"
    command: "./testall"
  - file: test/testcrc.c
    source: libcrc-2.0/test/testcrc.c
    description: "test_crc()：4 组输入向量 × 10 种 CRC 算法 = 40 项断言"
    command: "（由 testall 调用）"
  - file: test/testnmea.c
    source: libcrc-2.0/test/testnmea.c
    description: "test_checksum_NMEA()：2 组 NMEA 报文校验和断言"
    command: "（由 testall 调用）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：仅经公开头文件 checksum.h + 静态库调用 10 个 CRC/NMEA 公开 API，对上游已知向量断言"
    command: "./test_libcrc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 42