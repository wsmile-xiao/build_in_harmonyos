# 软件级 manifest — linpac
# 遵循 ARCHIVE-SPEC v2.0

software: linpac
display: "LinPac"
description: "AX.25 分组无线电终端：curses 客户端 + LinPac 应用协议辅助程序 + 插件 API 库"
category: network
homepage: "http://linpac.sourceforge.net/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "build-aux/config.guess（2009 版）不认识 HarmonyOS，需补 aarch64-unknown-linux-ohos 分支"
    - "build-aux/config.sub 会把 -linux-ohos 改写成 -linux-gnu，需加入内核-OS 白名单"
    - "ncurses 依赖包只提供静态 libncursesw.a，configure 必须检查 -lncursesw 而非 -lncurses/-ltermcap"
    - "E114: configure 中 config.status 临时目录需 077→022（HMDFS 强制 setgid，077 目录属主也不可写）"
    - "OHOS 无 AX.25 listen/axlisten 伴生程序，configure 硬报错降级为警告"
    - "OHOS sysroot 的 <linux/ax25.h> 不可直接使用：linux/socket.h 与 sys/socket.h 重复定义 sockaddr_storage，且缺 SIOCPROTOPRIVATE；由 src/compat/linux/ax25.h 兼容层前置（-I）解决"
    - "Conan ncurses 以 NCURSES_OPAQUE 构建，WINDOW 内部字段需改用 getmaxx()/getmaxy()/clearok() 公共 API"
    - "OHOS 无 /var/lock，锁文件回落到 $LINPAC_LOCKDIR/$XDG_RUNTIME_DIR/$TMPDIR"
    - "内部插件库（liblinpac/libaxmail）静态链接，避免 libtool RUNPATH 写入 Conan 包内绝对路径"
  common_dependencies:
    - ncurses

versions:
  "0.28":
    status: built
    build_date: "2026-09-28"
    notes: "conan-verify G0-G4 全通过；6 个补丁（config.guess/config.sub/configure/mail_screen.cc/linux-ax25 兼容层/linpac.cc）"
