# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "config.guess（2009 版）需补 HarmonyOS 分支且必须 echo+exit：原脚本各 case 分支只赋 GUESS，缺 exit 会继续走到需要编译 dummy.c 的兜底逻辑（ref: E007）"
  - "config.sub 需把 linux-ohos 加入 maybe_os 列表与内核-OS 白名单，否则 -linux* 分支会把它改写成 linux-gnu（ref: E072 / E122）"
  - "OHOS sysroot 的 <linux/ax25.h> 引用 asm-generic 的 SIOCPROTOPRIVATE 但该宏在 sysroot 中不存在（linux/socket.h 被裁剪掉 asm/socket.h 包含）——头文件存在但 API 缺失（ref: E091 / E119）"
  - "实施方式：不改动上游各 #include <linux/ax25.h>，而是用 -I 前置 src/compat/linux/ax25.h 兼容层（预置 _UAPI_LINUX_SOCKET_H + __kernel_sa_family_t + SIOCPROTOPRIVATE 后 #include_next），一次性覆盖全部 TU（ref: E091 / E119）"
  - "Conan ncurses 包以 NCURSES_OPAQUE=1 生成头文件，源码中 WINDOW 内部字段（_maxx/_maxy/_clear）编译失败，需换 getmaxx()/getmaxy()/clearok() 公共 API（ref: E14002-draft-7C36）"
  - "OHOS 无 /var/lock（整个 /var 目录不存在），FHS 硬编码锁文件路径的程序需回落到 $XDG_RUNTIME_DIR/$TMPDIR（ref: E14003-draft-66BA）"
  - "E114/E129：configure 里 config.status 临时目录的 umask 077 必须改 022，否则 HMDFS 上目录不可写（ref: E114 / E129）"
  - "E293：旧 C++ 代码的 register（与动态异常规范）在 profile 的 cppstd=17 下由警告升级为 hard error，处方是 extra_cxxflags 追加 -Wno-error=register 而不改源码（ref: E293）"
  - "源码包自带 configure 且镜像缺少 automake-1.11/libtoolize（autoreconf 不可用，missing 只会打警告），因此对 configure 的适配只能直接落在预生成脚本上（ref: E041 / E071）"
  - "生成补丁的 sources 若含孤立 CRLF 空行，refresh-patch 的 difflib 文本模式归一化 newline 而 patch 工具不归一化，改动落在 CR 行 ±10 行上下文内会使 dry-run 失败——此类文件应改用 -I 兼容层（ref: E091 / E119）"

