# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 清点方法: 解压上游源码包 linpac-0.28.tar.gz，检查所有 Makefile.am：
#   grep -rn "TESTS|check_PROGRAMS|check-local" --include=Makefile.am .
#   → 0 命中；工程内无 tests/ 目录，`make check` 为空操作（见下方证据）

package: linpac/0.28
homepage: "http://linpac.sourceforge.net/"

# 上游测试命令 (Autotools 惯例入口) —— 上游未定义任何 TESTS/check 目标
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游无自动化测试，build() 仍执行 `make -k check` 作为入口核验（输出留存
# 于 build 目录 upstream-make-check.log），但无任何用例可统计
upstream_test_in_build: false
upstream_test_command: "make -k check   # 输出: Nothing to be done for 'check'（无 TESTS 目标）"

# 上游实际运行的测试程序：无
#   证据 1: 全树 grep 'TESTS|check_PROGRAMS|check-local' --include=Makefile.am → 0 命中
#   证据 2: find . -type d -iname '*test*' → 0 命中
#   证据 3: src/applications/testapp.c 存在，但它是 LinPac 应用协议的人工演示
#           程序（连接运行中的 linpac 主机显示事件），非自动化测试，也未注册到
#           任何 check 目标
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 含鸿蒙特有断言)
test_package_tests:
  - file: test.sh
    description: "端到端: 安装的 linpac 终端启动并输出 0.28 版本横幅; 锁文件落在可写运行目录(OHOS 无 /var/lock); LINPAC_LOCKDIR 覆盖生效; 辅助程序齐全"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
