  sha256: "a0ecc59b0aae2df01558a6950532c711a782a099277b439a51d270003092f44f"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-rbgen（rbgen 是 Python 2 时代的生成器脚本，Python 3 下 TabError；上游对其缺失有 fallback，库与其余示例不受影响）"
    - "--disable-shared --enable-static（options.shared 默认 False）"
  dependencies: []

patches_applied:
  - "patches/0001-config.guess.patch"
  - "patches/0002-config.sub.patch"
  - "patches/0003-configure.patch"
  - "patches/0004-Makefile-toolchain-cflags.patch"

knowledge_gained:
  - "libredblack 的 config.guess 是 2001-09-04 版，只有 arm*:Linux:*:*，而 shell 通配 arm* **匹配不到 aarch64**（aarch64 以 aac 开头）——老 config.guess 对 aarch64 的缺口与 HarmonyOS 缺口是两个独立问题，必须分别补"
  - "老式 config.sub 的解析分两段：先由 maybe_os=`sed 's/^\\(.*\\)-\\([^-]*-[^-]*\\)$/\\2/'` 取末两段，只有落在 nto-qnx*/linux-gnu*/storm-chaos*/os2-emx*/windows32-* 这个特殊列表里才会把基本机器名截短。linux-ohos 不在其中，于是 aarch64-unknown-linux-ohos 被拆成 machine=aarch64-unknown-linux + os=-ohos，而 machine 校验里 *-*-* 直接判不识别。**只在后面的 OS 白名单加 -ohos* 是没用的**，必须同时补 maybe_os 的特殊分支"
  - "上游 Makefile.am 写死 CFLAGS=-Wall，会覆盖 Conan toolchain 导出的全部 CFLAGS——实测编译行只剩 -Wall，-O2 与 -fPIC 全部丢失（shared 构建会因此出问题）。修法是 Makefile.in 用 @CFLAGS@ -Wall、Makefile.am 改用 AM_CFLAGS=-Wall；tarball 自带 Makefile.in 且不跑 autoreconf，所以两份都要改"
  - "libredblack 以 --without-rbgen 配置即可绕开 Python 2 时代的生成器脚本；上游 Makefile 对其缺失有显式 fallback（'Create a dummy example4.c in case rbgen isn't present'）"
  - "Makefile.am 的 noinst_PROGRAMS 即使被 AM_CONDITIONAL 包住也要看仔细：example4 本身是**无条件**的，只有 .rb.c 后缀规则在 if USE_RBGEN 里"

patch_generation:
