# conandata.yml — libredblack 1.3
# Source: the project's own SourceForge release area (its homepage points there).
# sha256 computed from the downloaded tarball (209564 bytes).
# NOTE: downloads.sourceforge.net is a rotating CDN; the additional mirror hosts
# are SourceForge's own, offered so Conan's downloader can fall back per URL.

sources:
  url:
    - "https://downloads.sourceforge.net/project/libredblack/libredblack/1.3/libredblack-1.3.tar.gz"
    - "https://master.dl.sourceforge.net/project/libredblack/libredblack/1.3/libredblack-1.3.tar.gz"
    - "https://netcologne.dl.sourceforge.net/project/libredblack/libredblack/1.3/libredblack-1.3.tar.gz"
  sha256: "a0ecc59b0aae2df01558a6950532c711a782a099277b439a51d270003092f44f"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: >-
      config.guess: add the *:HarmonyOS:*:* uname case (the shipped script is the
      2001-09-04 release, which knows no HarmonyOS) and an aarch64:Linux:*:* case
      — the 2001 script only has arm*:Linux:*:*, and that pattern does NOT match
      the string "aarch64"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: >-
      config.sub: accept the linux-ohos kernel-os combination.  Two places are
      needed: the KERNEL-OS special case next to linux-gnu* (without it
      "aarch64-unknown-linux-ohos" is split as machine "aarch64-unknown-linux"
      plus os "-ohos" and rejected), and the basic-OS whitelist
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: >-
      configure: create its private temporary directories with umask 022 instead
      of 077 — on the OHOS HMDFS the 077 permissions leave those directories
      unusable (4 occurrences: the sed and config.status blocks)
    patch_type: "portability"
  - patch_file: "patches/0004-Makefile-toolchain-cflags.patch"
    patch_description: >-
      Makefile.in / Makefile.am: stop clobbering CFLAGS.  Upstream sets
      "CFLAGS=-Wall" verbatim, which overrides everything the Conan toolchain
      exports — the compile line came out as plain "-Wall" with no -O2 and no
      -fPIC (which would break the shared build).  Makefile.in now uses
      "@CFLAGS@ -Wall" and Makefile.am uses the automake-idiomatic AM_CFLAGS,
      so the toolchain flags survive and upstream's -Wall is kept
    patch_type: "portability"
