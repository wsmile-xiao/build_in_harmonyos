# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（libredblack 1.3，源码实测）：
#
#   upstream_test_targets = 0
#   upstream_test_files   = 0
#   upstream_case_total   = 0
#
# 依据（可逐条核对）：
#   - Makefile.am 里既没有 TESTS 也没有 check_PROGRAMS / check-local / check-am；
#   - 仓库内没有 tests/ 或 test/ 目录；
#   - `example.c / example1.c / example2.c / example3.c / example4.rb` 是
#     **演示程序**（noinst_PROGRAMS，构建但不安装、不运行），它们不含断言、
#     没有期望输出比对，也不是自动化测试入口。
# 是**确认的 0**，不是 UNKNOWN。

package: libredblack/1.3
homepage: "http://libredblack.sourceforge.net/"

upstream_tests_exist: false
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: src/test_libredblack.c
    description: >-
      C99 消费者链接 libredblack.a，按 200 个键**降序**插入（红黑树的最坏输入），
      再做 13 项断言：rbinit 成功；rbfind 命中返回调用方自己的数据指针、
      未命中返回 NULL；rbmin/rbmax 分别是 1/200；RB_LUFIRST + RB_LUNEXT 遍历
      必须恰好走完 200 个键且严格升序；RB_LUGREAT(100)=101、RB_LULESS(100)=99；
      rbwalk 恰好访问 200 个节点且升序；rbdelete 后该键查不到、最小值变为 2、
      删除不存在的键返回 NULL（R34 真实 API 调用）
    command: "./test_libredblack"

assertion_count: 13
