# test_package/MANIFEST.yml — upstream test declaration (CI gate L0e)
# See docs/TEST_QUALITY_SPEC.md.
#
# lucy ships no `check` target; README.FIRST §Testing defines the official
# procedure instead, and it is implemented by check/upstream-regression.sh,
# which conanfile.build() runs after `make`, so a plain `conan create` executes
# the upstream suite (TEST_QUALITY_SPEC layer 1).

package: lucy/1.20
homepage: "https://lucy.sourceforge.net"

# Upstream Makefile targets: all | lucy | beep | clean — there is no check/test
# target.  The official test procedure is README.FIRST §Testing:
#   lucy -v PUC19 PUC19splice atie.seq atie.qul atie.2nd -debug lucy.info
#   diff lucy.debug lucy.info
upstream_check_command: "(none — upstream has no make check; see README.FIRST §Testing)"

# conanfile.py build() runs the upstream suite right after the build
upstream_test_in_build: true
upstream_test_command: "sh check/upstream-regression.sh <source_folder>"

# Tests actually executed inside conan create (build phase)
upstream_tests:
  - name: upstream-golden-abi
    file: lucy.debug
    source: lucy1.20.tar.gz/lucy.debug
    description: >-
      README.FIRST §Testing step 1 — golden cleave report over upstream's own
      ABI fixture (atie.seq/atie.qul/atie.2nd, 1582 records, 1387 surviving
      sequences), compared record by record with check/golden-compare.py.
    command: "./lucy -v PUC19 PUC19splice atie.seq atie.qul atie.2nd -debug lucy.info"
    expected: >-
      1567/1582 records byte-identical to lucy.debug. The remaining 15 records
      differ only in CLZ/CLB/CLR/CLV and only for reads whose 2nd-sequence entry
      contains an ambiguous base: abi.c resolves those with libc random(), whose
      generator differs between glibc and OHOS musl. README.FIRST FAQ #6
      documents this platform effect and states the non-ambiguous records are
      platform independent, which is exactly the invariant enforced here.
  - name: upstream-threaded-parse
    file: lucy.c
    source: lucy1.20.tar.gz/lucy.c
    description: >-
      README.FIRST §Testing step 1 (multi-CPU note) — the same run with
      `-x CPU_count` must produce the same output as the single-thread run.
      Exercises the OHOS musl pthread path (upstream links -lpthread).
    command: "./lucy -x 4 -v PUC19 PUC19splice atie.seq atie.qul atie.2nd -debug lucy_mt.info -output lucy_mt.seq lucy_mt.qul"
    expected: "lucy_mt.info / lucy_mt.seq / lucy_mt.qul byte-identical to the single-thread artefacts"

# Tests shipped with test_package (consumer view, TEST_QUALITY_SPEC layer 2)
test_package_tests:
  - file: consumer_case.sh
    description: >-
      鸿蒙特有测试 / consumer case. The *installed* lucy is consumed end to end
      on OHOS: it quality-trims and vector-trims a real 6-read phred dataset
      (608-651 bp, extracted from upstream's atie fixture) using the upstream
      vector/splice fixtures, and the resulting coordinate report is fed to
      upstream's own zapping.awk (README.FIRST FAQ #1) to materialise the
      trimmed FASTA. Deliberately a real execution rather than an assertion
      suite: every step's exit status is the result, and the produced artefacts
      (trimmed.info/seq/qul, clean.seq) are inventoried at the end.
    command: "bash consumer_case.sh"
    fixtures:
      - data/reads.seq   # 6 reads, 3954 B (real data from upstream atie.seq)
      - data/reads.qul   # matching phred qualities, 11760 B
      - data/PUC19       # upstream vector fixture, 2815 B
      - data/PUC19splice # upstream splice fixture, 916 B
      - data/zapping.awk # upstream downstream trimmer, 441 B

# Comparisons that must hold (1582 record-level golden comparisons in
# upstream-golden-abi + 3 byte-equivalence comparisons in upstream-threaded-parse).
assertion_count: 1585
