# 版本级 manifest — lucy 1.20
# 文件位置: archives/l/lucy/1.20/manifest.yaml
# 交叉校验用元数据（CI 只读 conanfile.py + conandata.yml）
# 遵循 ARCHIVE-SPEC v3.0

version: "1.20"
software: "lucy"
status: published
build_date: "2026-09-28"
build_system: "makefile"

# 层 1（上游套件，build() 内）+ 层 2（test_package 消费者用例）合计
test_passed: 3
test_failed: 0

# ============================================================
# 源码信息（与 conandata.yml 保持一致，以 conandata.yml 为准）
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/lucy/lucy/lucy%201.20/lucy1.20.tar.gz"
  sha256: "e06313f6d60b1b1429aad6c86c02df22edc6337613fafa5db0a09a09c7a35af3"
  tar_format: tar.gz
  # 上游 tar 包解出目录名为 lucy-1.20p（与版本号不同），conanfile.source() 用 strip_root=True 拉平
  upstream_dir: "lucy-1.20p"

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options: []
  build_command: "make -j1 CC=<tools.build:compiler_executables:c>"
  upstream_test_command: "sh check/upstream-regression.sh <source_folder>"
  dependencies: []
  cc: clang
  cxx: clang++
  notes:
    - "上游 Makefile 硬编码 CC = cc；OHOS sysroot 只有 clang，故由 Conan toolchain conf 注入 CC（R33）"
    - "LIBS = -lpthread 由 OHOS musl libc 提供；多线程等价性由上游测试用例覆盖"

# ============================================================
# 补丁信息
# ============================================================

# 1.20 源码在 clang 15 下零修改编译通过，无需补丁
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lucy 的 -debug 默认文件名就是随包发布的黄金基准 lucy.debug；裸写 -debug 会覆盖基准文件，使后续比对变成自比对（README.FIRST 特意改用 -debug lucy.info）(ref: E544-draft-8E50)"
  - "abi.c 用 libc random() 解析歧义碱基，glibc 与 OHOS musl 的 random() 序列不同；黄金文件比对必须用机制化容差（无歧义碱基记录逐字节相等），不能裸 diff (ref: E544-draft-8E50)"
  - "上游 tar 包解出目录名为 lucy-1.20p（非 lucy-1.20），get(strip_root=True) 可拉平 (ref: conandata.yml sources.url 实测)"

# ============================================================
# 测试结果
# ============================================================

test_results:
  profile: "ohos-aarch64"
  upstream_framework: "README.FIRST §Testing golden-file procedure（上游无 make check，由 check/upstream-regression.sh 实现，conanfile.build() 内执行）"
  upstream_total: 2
  upstream_passed: 2
  upstream_failed: 0
  upstream_skipped: 0
  test_package_total: 1
  test_package_passed: 1
  test_package_failed: 0
  note: >-
    upstream-golden-abi 比对 1582 条记录：1567 条与 lucy.debug 逐字节一致，15 条仅
    CLZ/CLB/CLR/CLV 不同且全部落在含歧义碱基的读段内（abi.c 用 libc random()，
    glibc 与 OHOS musl 序列不同；上游 README.FIRST FAQ #6 已记录该平台效应），
    CLN 全一致 → 无硬失败。upstream-threaded-parse 用 -x 4 复跑，与单线程三个
    输出文件逐字节一致。test_package 的鸿蒙消费者用例用已安装的 lucy 跑
    质量+载体修剪并由上游 zapping.awk 物化 FASTA（6 读段 → 5 存活）。

verified:
  target: "HarmonyOS PC (OpenHarmony) aarch64"
  compiler: "OHOS Clang 15.0.4 (SDK 26.0.0.18)"
  conan: "2.29.1"
  date: "2026-09-28"
