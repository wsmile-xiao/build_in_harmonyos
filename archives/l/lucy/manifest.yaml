# 软件级 manifest — lucy
# 文件位置: archives/l/lucy/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: lucy

display: "Lucy"

description: "DNA 序列质量修剪与载体去除工具：为测序装配准备原始读段（质量评估、置信度修正、载体修剪与载体移除）"

category: utility

homepage: "https://lucy.sourceforge.net"

license: Artistic-1.0

# ============================================================
# 构建信息
# ============================================================

build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游 Makefile 硬编码 CC = cc，OHOS sysroot 只有 clang，需由 Conan toolchain conf 注入 CC"
    - "上游无 configure / install / check 目标，二进制与 man page 由配方手动落盘"
    - "上游官方测试是 README.FIRST §Testing 的黄金文件流程（无 make check），已在 build() 中以 check/upstream-regression.sh 集成"
    - "abi.c 依赖 libc random()，glibc 与 musl 序列不同，黄金文件比对需机制化容差（见 check/golden-compare.py）"
    - "lucy 的 -debug 默认文件名即黄金文件 lucy.debug，裸用 -debug 会覆盖基准"

  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.20":
    status: published
    build_date: "2026-09-28"
    conan_ref: "lucy/1.20"
