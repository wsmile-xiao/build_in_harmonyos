software: lcdf-typetools
version: "2.110"
status: built
build_date: "2026-08-27"
build_system: autotools

source:
  url: "https://www.lcdf.org/type/lcdf-typetools-2.110.tar.gz"
  sha256: "517f9ee879208679d3224a14d5e6eb20598fc648d5c3562708083d003088a934"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-kpathsea"
  dependencies: []
  cc: clang
  cxx: clang++
  env_requirements:
    - "TMPDIR=${TMPDIR:-/tmp}"

patches_applied:
  - "0001-hmdfs-tmpdir-fix.patch"

knowledge_gained:
  - "HMDFS 文件系统上 autotools config.status 使用 mktemp -d ./confXXXXXX 创建临时目录失败（Permission denied），需改用 mkdir -p ${TMPDIR:-/tmp}/cstmp$$"
  - "patch 修改 configure 脚本中写入 config.status 的 heredoc 部分，使生成的 config.status 使用 TMPDIR 而非当前目录"
  - "otftotfm 需要 kpathsea，其他工具可独立工作（--without-kpathsea 禁用）"
  - "Conan 2 test_package 中使用 self.dependencies['name'].package_folder 而非 deps_cpp_info（已废弃）"
