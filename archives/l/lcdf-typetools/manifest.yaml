software: lcdf-typetools
display: "LCDF Typetools"
description: "Command-line tools for manipulating PostScript Type 1, Multiple Master, OpenType and TrueType fonts"
category: doc
homepage: "https://www.lcdf.org/type/"
license: GPL
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 脚本中 mktemp -d ./confXXXXXX 在 HMDFS 上失败，patch 改用 mkdir -p ${TMPDIR:-/tmp}/cstmp$$"
    - "使用 --without-kpathsea 禁用 TeX 支持（otftotfm 功能受限，其他工具正常）"
    - "Conan 配方 type=application，11 个可执行文件，commands.json 已声明"
  common_dependencies: []

versions:
  "2.110":
    status: published
    build_date: "2026-08-27"