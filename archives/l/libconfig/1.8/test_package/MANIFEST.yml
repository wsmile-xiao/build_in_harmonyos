# Upstream and consumer test declaration for CI L0e.
package: libconfig/1.8
homepage: "https://github.com/hyperrealm/libconfig"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_in_test_package: true
upstream_test_command: "compile vendored upstream tests/tests.c and tinytest/tinytest.c against installed libconfig.a, then run from upstream/tests/ (make check in build() is not used: the automake check target also runs examples 1-4, which read example.cfg via a relative path and fail under VPATH builds)"
upstream_test_count: 16
upstream_test_status: verified
upstream_source_archive: "https://github.com/hyperrealm/libconfig/archive/refs/tags/v1.8.tar.gz"
upstream_source_archive_sha256: "22e13253e652ec583ba0dd5b474bd9c7bd85dc724f2deb0d76a6299c421358ef"
upstream_tests_vendored_byte_for_byte: true

upstream_tests:
  - file: upstream/tests/tests.c
    source: libconfig-1.8/tests/tests.c
    description: "Unmodified tinytest suite with 16 cases"
    command: "libconfig_upstream_tests with CWD set to upstream/tests/"
  - file: upstream/tinytest/tinytest.c
    source: libconfig-1.8/tinytest/tinytest.c
    description: "Unmodified tinytest runner linked into libconfig_upstream_tests"
    command: "linked into libconfig_upstream_tests"

upstream_test_cases:
  - ParsingAndFormatting
  - ParseInvalidFiles
  - ParseInvalidStrings
  - BigInt1
  - BigInt2
  - BigInt3
  - BigInt4
  - BigInt5
  - BigInt6
  - BigInt7
  - RemoveSetting
  - EscapedStrings
  - OverrideSetting
  - SettingLookups
  - ReadStream
  - BinaryAndHex

test_package_tests:
  - file: CMakeLists.txt
    description: "CMake consumer using find_package(libconfig) and libconfig::libconfig"
    command: "ctest --output-on-failure"
    assertion_count: 1
  - file: test.sh
    description: "Post-install compile, link, and run against package include/ and libconfig.a"
    command: "bash test.sh PACKAGE_FOLDER WORK_DIR"
    assertion_count: 9

assertion_count: 26
test_status: verified
