software: libconfig
version: "1.8"
status: built
build_date: "2026-10-08"
build_system: autotools

source:
  url: "https://github.com/hyperrealm/libconfig/archive/refs/tags/v1.8.tar.gz"
  tar_format: tar.gz
  sha256: "22e13253e652ec583ba0dd5b474bd9c7bd85dc724f2deb0d76a6299c421358ef"
  note: "v1.8 GitHub release ships no tarball asset; the git tag archive is the canonical source"

build:
  system: autotools
  bootstrap: "autoreconf -f in build() (tag archive ships no configure; -f without -i preserves the E007-patched aux-build/config.guess|config.sub)"
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-doc"
    - "--disable-examples"
  dependencies: []
  cc: clang
  cxx: clang++
  make_args: "-j1 (E074: HMDFS jobserver fifo EPERM)"

patches_applied:
  - "0001-aux-build-config.guess.patch"
  - "0002-aux-build-config.sub.patch"

runtime_fixes:
  - "E114/E011: drop 'umask 077' from the autoreconf-generated configure (HMDFS setgid temp dir)"

patch_classification:
  - file: 0001-aux-build-config.guess.patch
    type: portability
    platform_only: true
    guard: none
  - file: 0002-aux-build-config.sub.patch
    type: portability
    platform_only: true
    guard: none

knowledge_gained:
  - "E007: config.guess/config.sub HarmonyOS detection (regenerated against the 2024-01-01 scripts shipped in the v1.8 tag archive)"
  - "E114/E011: HMDFS umask 077 workaround applied to the generated configure at build time"
  - "tag-archive bootstrap: use autoreconf -f, not -fi, so automake does not clobber the patched config.guess/config.sub"

test_summary:
  upstream_tests: 16
  upstream_passed: 16
  consumer_assertions: 10
  upstream_tests_execution: "test_package vendored rerun against installed libconfig.a (make check not used: examples 1-4 read example.cfg via relative path and fail under VPATH)"
