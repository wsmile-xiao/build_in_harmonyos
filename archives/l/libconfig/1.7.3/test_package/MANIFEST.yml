# Upstream and consumer test declaration for CI L0e.
package: libconfig/1.7.3
homepage: "https://github.com/hyperrealm/libconfig"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_in_test_package: true
upstream_test_command: "compile vendored upstream tests/tests.c and tinytest/tinytest.c against installed libconfig.a, then run from upstream/tests/"
upstream_test_count: 13
upstream_test_status: verified
upstream_source_archive: "https://github.com/hyperrealm/libconfig/releases/download/v1.7.3/libconfig-1.7.3.tar.gz"
upstream_source_archive_sha256: "545166d6cac037744381d1e9cc5a5405094e7bfad16a411699bcff40bbb31ee7"
upstream_tests_vendored_byte_for_byte: true

upstream_tests:
  - file: upstream/tests/tests.c
    source: libconfig-1.7.3/tests/tests.c
    description: "Unmodified tinytest suite with 13 cases"
    command: "libconfig_upstream_tests with CWD set to upstream/tests/"
  - file: upstream/tinytest/tinytest.c
    source: libconfig-1.7.3/tinytest/tinytest.c
    description: "Unmodified tinytest runner linked into libconfig_upstream_tests"
    command: "linked into libconfig_upstream_tests"

upstream_test_cases:
  - ParsingAndFormatting
  - ParseInvalidFiles
  - ParseInvalidStrings
  - BigInt1
  - BigInt2
  - BigInt3
  - BigInt4
  - BigInt5
  - BigInt6
  - BigInt7
  - RemoveSetting
  - EscapedStrings
  - OverrideSetting

test_package_tests:
  - file: CMakeLists.txt
    description: "CMake consumer using find_package(libconfig) and libconfig::libconfig"
    command: "ctest --output-on-failure"
    assertion_count: 1
  - file: test.sh
    description: "Post-install compile, link, and run against package include/ and libconfig.a"
    command: "bash test.sh PACKAGE_FOLDER WORK_DIR"
    assertion_count: 9

assertion_count: 23
test_status: verified
