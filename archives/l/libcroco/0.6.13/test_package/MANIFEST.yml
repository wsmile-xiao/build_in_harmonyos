# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 详见图例: archives/g/gdk-pixbuf/2.44.6.1.1/test_package/MANIFEST.yml 与 docs/TEST_QUALITY_SPEC.md

package: libcroco/0.6.13
homepage: "https://gitlab.gnome.org/GNOME/libcroco"

# 上游测试入口: testctl 驱动的非回归测试（tests/testctl run，diff test-output-refs）
upstream_check_command: "cd tests && ./testctl run"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/test0-main.c
    source: libcroco-0.6.13/tests/test0-main.c
    description: "tokenizer 输入测试（test0.1.css）"
    command: "tests/.libs/test0 tests/test-inputs/test0.1.css"
  - file: tests/test1-main.c
    source: libcroco-0.6.13/tests/test1-main.c
    description: "parser 基础测试（test1.css）"
    command: "tests/.libs/test1 tests/test-inputs/test1.css"
  - file: tests/test2-main.c
    source: libcroco-0.6.13/tests/test2-main.c
    description: "selector/属性解析测试（test2.css 等）"
    command: "tests/.libs/test2 tests/test-inputs/test2.css"
  - file: tests/test3-main.c
    source: libcroco-0.6.13/tests/test3-main.c
    description: "statement/declaration 测试（test3*.css）"
    command: "tests/.libs/test3 tests/test-inputs/test3.css"
  - file: tests/test4-main.c
    source: libcroco-0.6.13/tests/test4-main.c
    description: "stylesheet 序列化测试（test4*.css）"
    command: "tests/.libs/test4 tests/test-inputs/test4.1.css"
  - file: tests/test5-main.c
    source: libcroco-0.6.13/tests/test5-main.c
    description: "media 相关测试（test5.1.css）"
    command: "tests/.libs/test5 tests/test-inputs/test5.1.css"
  - file: tests/test6-main.c
    source: libcroco-0.6.13/tests/test6-main.c
    description: "无输入自检测试"
    command: "tests/.libs/test6"
  - file: tests/test-prop-ident.sh
    source: libcroco-0.6.13/tests/test-prop-ident.sh
    description: "CSS 属性 vendor ident 与 csslint 集成测试"
    command: "tests/test-prop-ident.sh"
  - file: tests/test-several-media.sh
    source: libcroco-0.6.13/tests/test-several-media.sh
    description: "多个 @media 规则测试"
    command: "tests/test-several-media.sh"
  - file: tests/test-unknown-at-rule.sh
    source: libcroco-0.6.13/tests/test-unknown-at-rule.sh
    description: "未知 at-rule 容错测试"
    command: "tests/test-unknown-at-rule.sh"
  - file: tests/test-unknown-at-rule2.sh
    source: libcroco-0.6.13/tests/test-unknown-at-rule2.sh
    description: "未知 at-rule 变体测试"
    command: "tests/test-unknown-at-rule2.sh"

test_package_tests:
  - file: test_package/consumer.c
    description: "消费者通过公开 API cr_om_parser_simply_parse_buf 解析 CSS 并核验 nr_rules/to_string"
    command: "consumer"

assertion_count: 11