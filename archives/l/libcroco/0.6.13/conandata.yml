# R39: 只写官方 HTTPS 单值 URL（GNOME release tarball）；镜像由 CI 自动改写。
# SHA-256 与 download.gnome.org 官方 .sha256sum 清单逐字一致。
sources:
  url:
    - "https://mirrors.ustc.edu.cn/gnome/sources/libcroco/0.6/libcroco-0.6.13.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/gnome/sources/libcroco/0.6/libcroco-0.6.13.tar.xz"
    - "https://mirror.nju.edu.cn/gnome/sources/libcroco/0.6/libcroco-0.6.13.tar.xz"
    - "https://download.gnome.org/sources/libcroco/0.6/libcroco-0.6.13.tar.xz"
  sha256: "767ec234ae7aa684695b3a735548224888132e063f92db585759b422570621d4"
patches:
  - patch_file: "patches/0001-config.sub-ohos.patch"
    patch_description: "Allow Autoconf config.sub to accept linux-ohos triplets"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-ohos.patch"
    patch_description: "Change config.status tmpdir umask 077 -> 022 so HMDFS can write subs*.awk (E011)"
