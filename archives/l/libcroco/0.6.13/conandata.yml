  - patch_file: "patches/0003-refresh-test-refs.patch"
    patch_description: "Refresh stale upstream test reference outputs (test2.1/test2.2/test4.1) to match post-fix 0.6.13 behavior (Bug 381040 float format, Bug 314831/394294 escape); references frozen 2003-2004, proven stale by gitlab API timestamps"
    patch_type: "test-references"