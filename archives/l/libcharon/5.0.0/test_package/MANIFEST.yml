# test_package/MANIFEST.yml — libcharon 5.0.0
# Upstream and consumer test declaration required by CI L0e.

package: libcharon/5.0.0
homepage: "https://github.com/Ultimaker/libCharon"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "5.0.0.tar.gz (official GitHub tag tarball, SHA-256 verified)"
  source_sha256: "7b58b921c6fd78329badc83de4b9987c058d048b6a450313be23756415372fbf"
  build_system: "custom (pure Python; CMakeLists only installs Charon/ and registers ctest pytest-main)"
  test_definition: >
    pytest.ini declares testpaths=tests, python_files=Test*.py. tests/
    holds tests/filetypes/TestGCodeFile.py (12 unittest methods),
    tests/filetypes/TestGCodeFormat.py (2 plain test functions) and
    tests/filetypes/TestOpenPackagingConvention.py (12 defs expanding to
    23 cases via @pytest.mark.parametrize: listPathsEmpty 1 +
    getWriteStream 5 + forbidOnRels 1 + cycleSetDataGetData 3 +
    aliases_replacement 2 + cycleStreamWriteRead 3 +
    cycleSetMetadataGetMetadata 3 + toByteArray 1 + toByteArrayStream 1 +
    addContentType 1 + addRelation 1 + getMetadataSize 1);
    counting unit is the pytest collected item, i.e. each parametrized
    case counts separately (upstream_test_count_method python_def,
    expanded total 37 = 12 + 2 + 23).
    tests/filetypes/resources/ ships real non-empty fixtures
    (um3.gcode, um3.gcode.gz, hello.opc, empty.opc). Charon/Client/test_glib.py
    and test_qt.py are lowercase helper scripts, NOT collected by pytest
    (python_files=Test*.py), so they contribute 0 cases.
  dependency: "pytest only (test runner, pip private install in build()); Charon runtime is stdlib-only"
  portability_changes: []
  examples_note: >
    No upstream test is modified; the suite runs unmodified in build().
    Falsifiability: fixture non-empty checks + --collect-only cross-check
    (37) precede the run; exit-0-alone is never treated as proof.

upstream_check_command: "python -m pytest tests/ -q --no-header -p no:cacheprovider --tb=short"
upstream_test_in_build: true
upstream_test_command: "python -m pytest tests/ -q --no-header -p no:cacheprovider --tb=short"

# Counting unit: one pytest collected item (each @pytest.mark.parametrize
# case counts separately; --collect-only -q is the take-number command).
# On the 5.0.0 tag tree:
#   TestGCodeFile 12 + TestGCodeFormat 2 + TestOpenPackagingConvention 23 = 37
upstream_tests:
  - test_name: "TestGCodeFile (12 tests)"
    source: "tests/filetypes/TestGCodeFile.py"
    kind: unit
  - test_name: "TestGCodeFormat (2 tests)"
    source: "tests/filetypes/TestGCodeFormat.py"
    kind: unit
  - test_name: "TestOpenPackagingConvention (23 tests from 12 defs)"
    source: "tests/filetypes/TestOpenPackagingConvention.py"
    kind: unit

upstream_test_total: 37
upstream_test_count_method: python_def

# Consumer-perspective checks exercise the packaged API the way downstream
# Cura plugins use it: G-code header parsing, G-code openStream/getStream,
# OPC write-read-metadata roundtrip, VirtualFile facade, error paths
# (InvalidHeader/ReadOnly/WriteOnly) and UFP alias resolution. Each CHECK
# prints CHECK-OK on success and aborts non-zero on failure.
test_package_tests:
  - file: test_charon.py
    scenario: "consumer-api"
    description: >
      Run 6 consumer checks against the conan-installed Charon package:
      gcode_header, gcode_openstream, opc_roundtrip, virtualfile_facade,
      exceptions, ufp_aliases.
    command: "python3 test_charon.py"
    assertions: 14

assertion_count: 14
