# 版本级 manifest — libcharon 5.0.0
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "5.0.0"

# 软件名
software: libcharon

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub tag tarball — 含上游 tests/ 与 fixtures）
  url: "https://github.com/Ultimaker/libCharon/archive/refs/tags/5.0.0.tar.gz"

  # 源码校验和（sha256，下载实测）
  sha256: "7b58b921c6fd78329badc83de4b9987c058d048b6a450313be23756415372fbf"

  # tarball 格式
  tar_format: tar.gz

# ============================================================
# 构建信息
# ============================================================

build:
  system: custom
  # 配方 build()：
  #   1. python3 -m pytest tests/（上游官方全量套件 37 用例真实执行，L1c）
  #      - 口径：pytest.ini（testpaths=tests, python_files=Test*.py），
  #        TestGCodeFile 12 + TestGCodeFormat 2 + TestOpenPackagingConvention 23
  #        （12 个 def 经 parametrize 展开为 23；26 个 def 共展开为 37）
  #      - 计数源：pytest -q 汇总行单行解析 + --collect-only 交叉核对 37
  #      - 证伪：fixtures（um3.gcode/um3.gcode.gz/hello.opc/empty.opc）非空检查
  #   2. 纯 Python 包：Charon/ 目录整体复制到 lib/python3.12/site-packages/
  configure_options: []
  dependencies: []
  # 运行时说明：Charon 为 100% 纯 Python（仅用 stdlib：zipfile/json/xml/
  # typing），无第三方运行时依赖；pytest 仅为测试执行器，走 pip 私有安装。
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 零源码修改：纯 Python 包，OHOS aarch64 原生可用，无需任何适配改动。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libcharon 5.0.0 实为 Ultimaker/libCharon（3D 打印文件元数据/流库），非 strongSwan 的 charon；Debian 源包 libcharon 5.0.0-5 与 FreeBSD net/libcharon 均指向该上游"
  - "纯 Python 包跑上游测试必须用 GitHub tag tarball（含 tests/ 与 fixtures 资源文件）"
  - "pytest 汇总行是唯一计数源（passed/failed/skipped/error），--collect-only 交叉核对总数；fixture 非空检查防空跑"
  - "Charon 运行时仅依赖 stdlib，无需 numpy 式的私有依赖桥接；pytest 为纯 Python 包，pip --target 私有安装即可"
