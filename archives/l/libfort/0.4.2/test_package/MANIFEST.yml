# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfort/0.4.2
homepage: "https://github.com/seleznevae/libfort"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (adapt 阶段实测台账)
# 实测环境: OHOS aarch64 (clang 15), ctest 驱动, bash 包裹执行 ELF
# 日志: worktree 内 .atomcode/logs/libfort_test*.log
upstream_tests:
  - file: tests/main_test.c
    source: libfort-0.4.2/tests/main_test.c
    description: "libfort C API 单元测试 (main_test.c + bb_tests/*.c + tests.c)"
    command: "./tests/libfort_test"
    classification: "runnable-and-run"
    result: "15/15 PASSED"
  - file: tests/main_test.c (dev)
    source: libfort-0.4.2/tests/main_test.c
    description: "libfort C API dev 测试 (含 wb_tests 内部符号测试)"
    command: "./tests/libfort_test_dev"
    classification: "runnable-and-run"
    result: "15/15 PASSED"
  - file: tests/main_test_cpp.cpp
    source: libfort-0.4.2/tests/main_test_cpp.cpp
    description: "libfort C++ API 单元测试 (bb_tests_cpp/*.cpp)"
    command: "./tests/libfort_test_cpp"
    classification: "runnable-and-run"
    result: "9/9 PASSED"

# test_package 中自带的测试 (消费者视角验证 / OHOS 特定测试)
test_package_tests:
  - file: test.c
    description: "OHOS 特定测试：ft_create_table / ft_write_ln / ft_to_string 真实 API 冒烟，验证 libfort 在 OHOS aarch64 上实际行为"
    command: "./test_libfort"
    classification: "runnable-and-run"
    result: "PASSED (conan create test_package 内验证)"

# 测试断言总数 (实测统计)
assertion_count: 39