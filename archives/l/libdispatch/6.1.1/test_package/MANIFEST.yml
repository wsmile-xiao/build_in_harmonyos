package: libdispatch/6.1.1
homepage: "https://github.com/apple/swift-corelibs-libdispatch"

upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ctest 执行 tests/ 下全部用例)
# 本机验证: 22/22 tests passed
upstream_tests:
  - file: tests/dispatch_apply.c
    source: libdispatch-6.1.1/tests/dispatch_apply.c
    description: "dispatch_apply 并行迭代测试"
    command: "./dispatch_apply"
  - file: tests/dispatch_api.c
    source: libdispatch-6.1.1/tests/dispatch_api.c
    description: "dispatch API 基础功能测试"
    command: "./dispatch_api"
  - file: tests/dispatch_after.c
    source: libdispatch-6.1.1/tests/dispatch_after.c
    description: "dispatch_after 延迟执行测试"
    command: "./dispatch_after"
  - file: tests/dispatch_timer.c
    source: libdispatch-6.1.1/tests/dispatch_timer.c
    description: "dispatch timer 定时器测试"
    command: "./dispatch_timer"
  - file: tests/dispatch_sema.c
    source: libdispatch-6.1.1/tests/dispatch_sema.c
    description: "信号量测试"
    command: "./dispatch_sema"
  - file: tests/dispatch_data.c
    source: libdispatch-6.1.1/tests/dispatch_data.c
    description: "dispatch_data 数据对象测试"
    command: "./dispatch_data"
  - file: tests/dispatch_io_pipe.c
    source: libdispatch-6.1.1/tests/dispatch_io_pipe.c
    description: "dispatch I/O 管道测试"
    command: "./dispatch_io_pipe"
  - file: tests/dispatch_select.c
    source: libdispatch-6.1.1/tests/dispatch_select.c
    description: "dispatch select 事件循环测试"
    command: "./dispatch_select"
  - file: tests/dispatch_c99.c
    source: libdispatch-6.1.1/tests/dispatch_c99.c
    description: "C99 blocks 语法测试"
    command: "./dispatch_c99"
  - file: tests/dispatch_plusplus.cpp
    source: libdispatch-6.1.1/tests/dispatch_plusplus.cpp
    description: "C++ blocks 语法测试"
    command: "./dispatch_plusplus"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 真实调用 dispatch_queue_create/dispatch_apply/dispatch_once/dispatch_time API，失败返回非 0"
    command: "./test_libdispatch"

# 测试断言总数 (近似值)
# 上游 22 个测试全通过; test_package 含 4 个独立断言
assertion_count: 26