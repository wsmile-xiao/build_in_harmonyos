software: libdispatch
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.10.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# 构建系统类型（verify-build 必需字段）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/apple/swift-corelibs-libdispatch/archive/refs/tags/swift-5.10.1-RELEASE.tar.gz"

  # 源码校验和
  sha256: "affa3544b0fdb60f8f175bc0d2846177436d5848ef8ca73e3e560d23986f38b3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DENABLE_SWIFT=OFF"
    - "-DENABLE_DTRACE=OFF"
    - "-DENABLE_INTERNAL_PTHREAD_WORKQUEUES=ON"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_C_FLAGS=-D__OHOS__"
    - "-DCMAKE_CXX_FLAGS=-D__OHOS__"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-shims-getprogname.h.patch"
  - "0002-tests-dispatch_test.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony musl libc 不提供 getprogname() 和 program_invocation_name，但提供 __progname（与 Android 类似）"
  - "musl libc 的 sys/poll.h 是 redirect warning，需改用 poll.h"
  - "CMake 项目 G0 clean-verify 需手动验证（脚本仅支持 autotools configure）"
  - "libdispatch 需要 -fblocks（clang Blocks 特性）和 -D__OHOS__ 编译标志"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libdispatch-5.10.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libdispatch-5.10.1.work
  source_orig_hash: 09fe72663c44cc2d
  source_work_hash: 8e69eed65b9f0197
  generated_at: '2026-06-02T19:41:38'
  patches_count: 2

patch_classification:
