package: lightgbm/4.6.0
homepage: https://github.com/microsoft/LightGBM

upstream_check_command: ctest -N
upstream_test_in_build: false
upstream_test_command: not run in cross-build recipe

upstream_tests:
  - file: tests/cpp_tests/
    source: LightGBM-4.6.0/tests/cpp_tests/
    description: Upstream C++ test suite. It requires the full upstream test build and runtime datasets; it is documented here and left for a follow-up full-test issue rather than hidden.
    command: ctest

test_package_tests:
  - file: test_lightgbm_api.c
    description: Consumer API smoke test compiles and links against LightGBM C API, creates a tiny in-memory DatasetHandle with LGBM_DatasetCreateFromMat, and frees it with LGBM_DatasetFree when execution is available.
    command: test_lightgbm_api
  - file: conanfile.py
    description: Runtime smoke test also runs packaged lightgbm CLI help when executable is runnable.
    command: lightgbm --help || test $? -eq 255

assertion_count: 4
