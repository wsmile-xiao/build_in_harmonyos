package: lightgbm/4.6.0
homepage: https://github.com/microsoft/LightGBM

upstream_check_command: ctest -N
upstream_test_in_build: true
upstream_test_command: BUILD_CPP_TEST=ON during conan create; runtime ctest is not claimed in cross-build CI

upstream_tests:
  - file: tests/cpp_tests/
    source: LightGBM-4.6.0/tests/cpp_tests/
    description: Upstream C++ test suite is enabled with BUILD_CPP_TEST=ON so the OpenHarmony PC cross build compiles the upstream test targets. Full runtime ctest execution is not claimed in this base PR because it depends on the target runtime and upstream test data availability.
    command: cmake --build . with BUILD_CPP_TEST=ON

test_package_tests:
  - file: test_lightgbm_api.c
    description: Consumer API smoke test compiles and links against LightGBM C API, creates a tiny in-memory DatasetHandle with LGBM_DatasetCreateFromMat, and frees it with LGBM_DatasetFree when execution is available.
    command: test_lightgbm_api
  - file: conanfile.py
    description: Runtime smoke test also runs packaged lightgbm CLI help when executable is runnable.
    command: lightgbm --help with explicit acceptance of exit codes 0 or 255

assertion_count: 13
runtime_pass_count: 0
runtime_pass_note: 11 upstream C++ test files are enabled for cross-compile validation; runtime pass count is not claimed until CI/OpenDesk execution completes.
