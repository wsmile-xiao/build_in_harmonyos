package: lightgbm/4.6.0
homepage: https://github.com/microsoft/LightGBM

upstream_check_command: ctest -N
upstream_test_in_build: false
upstream_test_command: not run in cross-build recipe

upstream_tests:
  - file: tests/cpp_tests/
    source: LightGBM-4.6.0/tests/cpp_tests/
    description: Upstream C++ test suite.
    command: ctest

test_package_tests:
  - file: conanfile.py
    description: Consumer smoke test runs packaged lightgbm CLI help when executable is runnable.
    command: lightgbm --help || test $? -eq 255

assertion_count: 1
