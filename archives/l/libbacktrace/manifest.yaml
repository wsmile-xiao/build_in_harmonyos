# 版本级 manifest 软件级索引 — libbacktrace
# 文件位置: archives/l/libbacktrace/manifest.yaml

software: libbacktrace
display: "libbacktrace"
description: "C library producing symbolic backtraces for ELF/Mach-O/XCOFF/PE-COFF programs"
category: sys
homepage: "https://github.com/ianlancetaylor/libbacktrace"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需补 aarch64-unknown-linux-ohos 识别"
    - "configure 私有临时目录 umask 077 在 HMDFS 上不可写（E129），改 022"
    - "测试二进制需 -fno-optimize-sibling-calls -fno-omit-frame-pointer 保留栈帧（clang 忽略 noclone）"
    - "objcopy 派生测试产物需 remove-section .codesign + binary-sign-tool selfSign + chmod（E077）"
  common_dependencies:
    - zlib

versions:
  "20240505":
    status: published
    build_date: "2026-09-02"
