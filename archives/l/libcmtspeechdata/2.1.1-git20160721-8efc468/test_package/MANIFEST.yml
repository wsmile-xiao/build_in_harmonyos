package: libcmtspeechdata/2.1.1-git20160721-8efc468
homepage: "https://sources.debian.org/src/libcmtspeechdata/2.1.1%2Bgit20160721~8efc468-2/"
build_system: autotools

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

upstream_tests:
  - file: test_ring.c
    source: libcmtspeechdata-2.1.1+git20160721~8efc468/test_ring.c
    description: "Run the upstream ring buffer test program"
    command: "./test_ring"
  - file: test_cmtspeech_msgs.c
    source: libcmtspeechdata-2.1.1+git20160721~8efc468/test_cmtspeech_msgs.c
    description: "Run the upstream CMT speech message test program"
    command: "./test_cmtspeech_msgs"

test_package_tests:
  - file: test.c
    description: "Exercise the installed reset-connection request encoder and verify its message fields and byte layout"
    command: "./test_libcmtspeechdata"

assertion_count: 3
