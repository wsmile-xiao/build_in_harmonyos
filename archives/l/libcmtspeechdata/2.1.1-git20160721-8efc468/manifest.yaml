version: "2.1.1-git20160721-8efc468"
status: built
build_date: "2026-09-26"

source:
  url: "https://archive.debian.org/debian-archive/debian/pool/main/libc/libcmtspeechdata/libcmtspeechdata_2.1.1+git20160721~8efc468.orig.tar.gz"
  sha256: "4f01aeba95fbe2c87193e41fd3eb414f0599c00b0a021411a514d797fc7acb05"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-backend=nokiamodem"
    - "--disable-docs"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - dbus/1.14.10
    - pulseaudio/17.0.1
    - check/0.15.2
  build_tools:
    - autoconf/2.72
    - automake/1.18
    - libtool/2.5.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-tests-write-check-report-in-build-dir.patch"

knowledge_gained:
  - "Autotools on OHOS uses an explicit GNU build/host triple when config.guess cannot classify HarmonyOS (existing E160 pattern)."
  - "Autoconf's generated config.status needs umask 022 for HMDFS temporary directories (existing E011 pattern)."
  - "libcheck tests need TEMP set to a writable task build directory because musl P_tmpdir resolves to read-only /tmp before TMPDIR (existing E571 pattern)."
  - "The bundled D-Bus utility also uses PulseAudio headers and static libraries; dbus/1.14.10 has no dbus-1.pc, so the recipe passes Conan package paths to configure."
