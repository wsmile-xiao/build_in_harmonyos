# 软件级 manifest — lfanew
# 文件位置: archives/l/lfanew/manifest.yaml
# 字段规范: knowledge/ARCHIVE-SPEC.md §4.1

software: lfanew
display: "lfanew"
description: "为 MS-DOS MZ 存根添加 .e_lfanew，并对 PE 程序做 stubify/unstubify；附带 C 可移植库 libfanew"
category: development
homepage: "https://gitlab.com/tkchia/lfanew"
license: MPL-2.0 AND BSD-3-Clause
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  notes:
    - "随源码分发的 2016 年 config.sub 不认 ohos 三元组；configure 无运行期探测，用 --host=aarch64-unknown-linux-musl"
    - "a/direntdup.c 使用 NAME_MAX 却未 include <limits.h>，OHOS musl 的 <dirent.h> 不传递包含（E721 草稿）"
    - "上游默认 make 目标会构建 DOS 模拟器（需 MinGW/7z/upx），只构建 install 所需目标"
  dependencies: []

# 版本索引
versions:
  "0-20230825":
    status: published
    build_date: "2026-09-26"
    conan_ref: "lfanew/0-20230825"

latest: "0-20230825"
