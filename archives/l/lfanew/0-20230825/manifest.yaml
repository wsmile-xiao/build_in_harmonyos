# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0-20230825/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0-20230825"

# 软件名
software: "lfanew"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.com/tkchia/lfanew/-/archive/20230825/lfanew-20230825.tar.gz"

  # 源码校验和
  sha256: "ae3353378b892d37e5840429afe0908e61a2054efa619b0bd01d945440fb7423"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--host=aarch64-unknown-linux-musl"
    - "--build=aarch64-unknown-linux-musl (settings_build.os == OHOS)"
    - "LDFLAGS=-static"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-a-direntdup.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS musl <dirent.h> 不传递 <limits.h>，NAME_MAX 需显式 include（E721 草稿）"
  - "2016 版 config.sub 不认 ohos 三元组，无运行期探测时用 --host=aarch64-unknown-linux-musl"
  - "2016 版 config.guess 在 HarmonyOS 原生构建机上 cannot guess build type，需同时 --build=aarch64-unknown-linux-musl"
  - "configure 的 umask 077 临时目录在 HMDFS 上不可写（E129），build() 中改为 umask 022"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /root/tmp/builds/lfanew-0-20230825.orig
  source_work_dir: /root/tmp/builds/lfanew-0-20230825.work
  source_orig_hash: 50d6e91b4cd11ba2
  source_work_hash: bd5861cd877a5003
  generated_at: '2026-09-26T12:28:33'
  patches_count: 1

patch_classification:
  - file: 0001-a-direntdup.c.patch
    type: portability
    platform_only: False
    guard: 'none (unconditional #include <limits.h>, correct on all POSIX)'
