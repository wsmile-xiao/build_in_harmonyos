# test_package/MANIFEST.yml — upstream test declaration (R51)

package: lfanew/0-20230825
homepage: "https://gitlab.com/tkchia/lfanew"

# 上游测试框架：GNU autotest。tests/testsuite 需由 autom4te 从 tests/*.at 生成
# （源码包不含生成好的 testsuite），`make check` = `tests/testsuite -C tests`。
# 清点：6 个 .at 文件（testsuite.at 为入口、local.at 为宏库），共 8 个 AT_SETUP。
upstream_check_command: "make check  # 需 autom4te 生成 tests/testsuite"
upstream_test_count: 8

# 上游用例依赖 nasm、dos2unix、MS-DOS 运行器(emu2/86sim/msdos)、MinGW 交叉编译器、
# wine，均为 x86 DOS/Windows 生态工具，OHOS 与 CI 上不存在，故未集成进 build()。
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/metacheck.at
    source: lfanew-20230825/tests/metacheck.at
    description: "4 个测试环境自检（dos2unix / nasm / MS-DOS 运行器 / Windows 运行器），不测本包代码"
    command: "tests/testsuite -C tests 1-4"
    status: "not_run: 所需工具在 OHOS/CI 上不存在"
  - file: tests/lfanew.at
    source: lfanew-20230825/tests/lfanew.at
    description: "2 个 CLI 用例：默认模式加 .e_lfanew；-U/-S 解壳与加壳（nasm 汇编 MZ、DOS/wine 运行结果比对）"
    command: "tests/testsuite -C tests 5-6"
    status: "not_run: 需 nasm + DOS 运行器 + MinGW + wine；同等语义由 test_package [2][3][4] 覆盖"
  - file: tests/dirent.h.at
    source: lfanew-20230825/tests/dirent.h.at
    description: "scandir 兼容实现（上游在平台已有 scandir 时 AT_SKIP；OHOS musl 有 scandir）"
    command: "clang -static -I<pkg>/include scandir.c <pkg>/lib/libfanew.a && qemu-aarch64 ./a.exe"
    status: "手工复现：编译 + qemu-aarch64 运行通过（rc=0）"
  - file: tests/io.h.at
    source: lfanew-20230825/tests/io.h.at
    description: "_binmode(1) 不返回 -1（上游只编译不运行）"
    command: "clang -static -I<pkg>/include binmode.c <pkg>/lib/libfanew.a && qemu-aarch64 ./a.exe"
    status: "手工复现：编译 + qemu-aarch64 运行通过（rc=0）"

# test_package 鸿蒙特有消费者测试：test_lfanew.c（5 个用例、39 项断言），
# 通过 Conan 消费本包的 libfanew.a + 头文件编译，再驱动本包安装的 lfanew CLI。
test_package_tests:
  - file: test_lfanew.c
    description: "[1] <nexgen/mzendian.h> hle*/leh* 小端存取与 mz_hdr_t 布局（9 项断言）"
    command: "test_lfanew <pkg>/bin/lfanew <workdir>"
  - file: test_lfanew.c
    description: "[2] 默认模式：消费者用 mz_hdr_t 构造带 2 条重定位的旧式 MZ，lfanew -o 后逐字段解析输出（e_lfarlc/e_cparhdr/e_lfanew/重定位/映像/填充），并验证对已含 e_lfanew 的 MZ 拒绝且不残留输出（15 项断言）"
    command: "lfanew -o new.exe old.exe"
  - file: test_lfanew.c
    description: "[3] -S 加壳 / -U 解壳往返：fat.exe = 存根 + 载荷、e_lfanew 指向载荷魔数、解壳后载荷逐字节一致（8 项断言）"
    command: "lfanew -S -o fat.exe payload.bin new.exe; lfanew -U -o back.bin fat.exe"
  - file: test_lfanew.c
    description: "[4] 拒绝路径：LE 载荷加壳、非 MZ 输入均退出码 2 且清理输出文件（5 项断言）"
    command: "lfanew -S ... le.bin ...; lfanew -o x.exe payload.bin"
  - file: test_lfanew.c
    description: "[5] 经 <lfanew/dirent.h> 调 scandir（OHOS libc 实现）扫描工作目录，再用本包 libfanew.a 的 _direntdup 复制每个条目（覆盖补丁 0001 的 NAME_MAX 路径，2 项断言）"
    command: "test_lfanew <pkg>/bin/lfanew <workdir>"

# 消费者与交付的 lfanew 均为静态 AArch64 ELF：AArch64 runner 直接运行，
# x86_64 runner 经 qemu-aarch64 运行（E544）；两者都没有则测试失败。
assertion_count: 39
