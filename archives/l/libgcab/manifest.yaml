software: libgcab
# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（字母顺序）
name: libgcab

# 软件分类
# library | tool | application
category: library

# 简短描述（一句话）
description: "用于创建和读取 Microsoft Cabinet (.cab) 文件的库"

# ============================================================
# 项目信息
# ============================================================

# 上游项目信息
upstream:
  # 项目主页
  homepage: "https://wiki.gnome.org/msitools"

  # 源码仓库
  repository: "https://gitlab.gnome.org/GNOME/gcab"

  # 许可证（SPDX 格式）
  license: "LGPL-2.1-or-later"

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "1.6"
    status: published
    build_date: "2026-06-05"
    notes: "发布成功 - 静态链接版本，避免 gio 类型系统冲突，功能测试全部通过"

# ============================================================
# 依赖关系
# ============================================================

# 运行时依赖
runtime_dependencies:
  - name: glib
    version: ">=2.88.0"
  - name: zlib
    version: ">=1.3.1"

# 构建时依赖
build_dependencies:
  - name: meson
    version: ">=1.11.1"
  - name: ninja
    version: ">=1.13.1"

# ============================================================
# 功能特性
# ============================================================

# 主要功能
features:
  - "创建 Cabinet 归档文件"
  - "读取 Cabinet 归档文件"
  - "支持压缩和解压缩"
  - "提供命令行工具 gcab"

# 支持的平台
platforms:
  - "aarch64-ohos"

# 提供的组件
components:
  - type: library
    name: libgcab-1.0
    files:
      - "libgcab-1.0.so.0.3.0"
  - type: executable
    name: gcab
    files:
      - "gcab"