software: libgcab
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/libgcab/libgcab-1.6.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Ddocs=false"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "鸿蒙平台 glib 编译为静态库（.a），而非动态库（.so）"
  - "共享库内嵌 gio 静态库会导致 GObject 类型系统冲突"
  - "解决方案：将依赖 gio 的库也编译为静态库"
  - "G_IS_FILE 检查失败是静态链接 gio 时的常见问题"
  - "修复方法：修改 meson.build，将 shared_library 改为 static_library"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

# 补丁生成信息
patch_generation:
  method: none
  note: "无补丁文件 - 仅使用 meson 配置选项，无源码修改（R6合规）"��免 gio 类型系统冲突（鸿蒙平台 glib 为静态库）"thod: none
  note: "无补丁文件 - 仅使用 meson 配置选项，无源码修改（R6合规）"