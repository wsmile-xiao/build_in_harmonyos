  sha256: "3a0b13815f582c661d2388ffcabc2f1ea82f471783c400f765f2ec6c81065f6a"

patches:
  - patch_file: "patches/0001-bootstrap-autotools.patch"
    patch_description: "Vendor autotools bootstrap artifacts (configure/aclocal.m4/config.h.in/Makefile.in/.auto). CI workers have no automake/aclocal, so autoreconf in build() cannot run there; the upstream release tarball ships no generated configure. Stored in-repo as base64 text (patches/0001-bootstrap-autotools.patch.b64) and decoded by the recipe before applying, because oversized plain-text diffs break the GitCode .diff endpoint (AI review / CI checkout)."
    patch_type: "portability"
