package: libdca/0.0.7
homepage: "https://www.videolan.org/developers/libdca.html"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: regression
    command: "test/regression"
    expected: "skip when the external dts stream fixtures are unavailable"
  - name: compile
    command: "test/compile"
    expected: "skip when the external source archive fixture is unavailable"

test_package_tests:
  - file: test.c
    description: "Initialize/free libdca and reject two malformed DTS headers"
    command: "./libdca_test"

assertion_count: 3
