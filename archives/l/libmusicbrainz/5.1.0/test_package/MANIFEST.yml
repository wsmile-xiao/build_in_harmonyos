# test_package/MANIFEST.yml — libmusicbrainz 5.1.0 适配验证清单
#
# 上游测试来源声明：
#   - build_system: CMake（无 enable_testing，tests/ 含 ctest.c/mbtest.cc 手工程序）
#   - 上游无 CI 自动化测试套件（examples/ 需联网 MusicBrainz 服务）
#   - 本适配以消费者用例为准：Mb5 C API 构造/链接 roundtrip
#
# test_package 消费者用例（新增）：
#   test_musicbrainz.c — MB5_VERSION_MAJOR 版本断言 + Mb5Metadata/Mb5WebService
#                         构造销毁生命周期（无需网络）
package: libmusicbrainz/5.1.0
homepage: https://musicbrainz.org/doc/libmusicbrainz

upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - name: mb5-api-construct
    command: "./test_musicbrainz"
    assertions:
      - "头文件可包含 + 版本常量正确（MB5_VERSION_MAJOR==5）"
      - "Mb5Metadata 构造成功"
      - "Mb5WebService 构造成功"
      - "句柄释放生命周期完整"
