software: libmusicbrainz
version: "5.1.0"
build_system: cmake
status: built
build_date: "2026-09-11"

source:
  url: "https://github.com/metabrainz/libmusicbrainz/archive/refs/tags/release-5.1.0.tar.gz"
  sha256: "c3254bd5dbd3194d612d34a841ef6d28d8b843c5a1dca769c67a0e9d5d2c8d29"
  tar_format: tar.gz

dependencies:
  - "neon/0.34.0"
  - "libxml2/2.15.3.1"

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS 由 shared 选项决定"
  cc: clang

patches_applied:
  - "0001-xmlGetLastError-const.patch"
  - "0002-remove-glob-dependency.patch"

knowledge_gained:
  - "libmusicbrainz 5.1.0 为 CMake 构建，依赖 neon + libxml2（registry 已发布）"
  - "上游 FindLibXml2.cmake 用 FIND_LIBRARY 只搜系统路径，需 generate() 注入 CMAKE_INCLUDE_PATH/LIBRARY_PATH（libxml2 include 布局 include/libxml2/）"
  - "make-c-interface 构建期工具运行期需加载 libxml2.so，build() 注入 LD_LIBRARY_PATH"
  - "xmlParser.cc 需兼容 libxml2 2.15.x（xmlGetLastError 返回 const xmlError*）"
  - "src/CMakeLists.txt 移除 *.inc 字面通配符依赖（make 不展开报 No rule to make target）"
  - "C API（mb5_c.h）无 new 构造仅 clone/delete，消费者用例用 C++ API（MusicBrainz5::CMetadata）"

package_contract:
  libraries: ["musicbrainz5"]
  pkg_config: []
  headers: ["musicbrainz5/MusicBrainz5.h"]

test_results:
  type: consumer
  total: 4
  passed: 4
  failed: 0
  note: "上游无离线自动化测试套件；test_package 消费者 4 断言（CMetadata 构造/getter roundtrip）"
