# 版本级 manifest —— libwps 0.4.11
# 遵循 ARCHIVE-SPEC v2.0

version: "0.4.11"
software: libwps

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-30"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/libwps/libwps/libwps-0.4.11/libwps-0.4.11.tar.bz2"
  sha256: "48e2fd81758a785914ab415279027ffbaaa76da39db6bff477f76e580d3eaf85"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--build=arm-unknown-linux-gnu --host=aarch64-unknown-linux-gnu（本 dist 的 config.sub 是 2013-10-01 版：认 aarch64 但**不认 musl**，故 aarch64-…-musl 被拒；四段名带 unknown 厂商可原样通过，且保持 build≠host 交叉模式）"
    - "--prefix=/（配合 DESTDIR 使 include/ 与 lib/ 直落包根）"
    - "--enable-static --disable-shared（R26 系统同名库默认静态）"
    - "--disable-dependency-tracking"
    - "--without-docs（doxygen 文档不进包）"
    - "REVENGE_CFLAGS / REVENGE_LIBS / REVENGE_GENERATORS_CFLAGS / REVENGE_GENERATORS_LIBS / REVENGE_STREAM_CFLAGS / REVENGE_STREAM_LIBS：上游三处 PKG_CHECK_MODULES（librevenge + 工具所需的 generators/stream），设备无 pkg-config，故显式导出这些变量（PKG_CHECK_MODULES 在变量非空时短路）"
    - "依赖库以「只含 .a 的干净 -L 目录」引用：librevenge 包内的 .la 记录了它自己的安装前缀（//lib），直接 -L 到包目录会触发 libtool 的 'library was moved / cannot find the library //lib/librevenge-0.0.la'"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash（autoconf 2.69 的 exec 7<&0 需要；automake 的 all-recursive 也需要 POSIX 词分割）"
    - "configure 的 umask 077→022 改写（hmdfs 按组判通行）；autotools 辅助脚本统一 chmod +x（E490）；TMPDIR 指向构建目录内 .tmp"
    - "CC/CXX 从 profile 的 tools.build:compiler_executables 显式导出（conan 的 toolchain env 脚本不会被裸 subprocess source）"
  dependencies:
    - librevenge/0.0.5
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libwps 0.4.11 与同族 libwpd 0.10.3 的依赖面差异：configure.ac 只有三处 PKG_CHECK_MODULES（REVENGE/REVENGE_GENERATORS/REVENGE_STREAM），**没有** boost 头检查（libwpd 的 AC_CHECK_HEADERS([boost/spirit/include/qi.hpp]) 在 libwps 中不存在），也无需 libwpd/libwpg——三者是并列的兄弟库而非依赖链。配方因此比 libwpd 少一个 tool_requires"
  - "URL 形态实证：SourceForge 项目的官方直链为 https://downloads.sourceforge.net/project/<proj>/<proj>/<ver>/<file>（与 libwpd 一致）；真实文件路径与 sha256 可用 https://sourceforge.net/projects/<proj>/best_release.json 一次拿到（含 md5/sha256/字节数），无需网页抓取"
  - "config.sub 2013-10-01 与 2012-02-10（libwpd）行为一致：认 aarch64 不认 musl，四段名 aarch64-unknown-linux-gnu 通过，交叉模式保持"
  - " Works v2 魔数正例可程序化构造：WPSHeader::constructHeader 对非 OLE 流读前 6 字节，byte0<6 且 byte1=0xFE 即判 Works v2（WPS_TEXT/WPS_MSWORKS），WPS4Parser::checkHeader 再要求 checkFilePosition(0x100)（文件≥0x100 字节）并复读同样两个条件——{0x02,0xFE}+510 零字节的 0x200 字节流即可让 isFileFormatSupported 返回 WPS_CONFIDENCE_EXCELLENT"
  - "上游 0.4.11 交付形态：静态库 libwps-0.4.a、头 include/libwps-0.4/libwps/{libwps.h,WPSDocument.h}、六个转换工具 bin/{wps2text,wps2html,wps2raw,wks2csv,wks2raw,wks2text}、pkg-config 文件 libwps-0.4.pc；libwps-zip 是 make zip 辅助脚本不安装"
