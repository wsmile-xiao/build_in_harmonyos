# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libwps/0.4.11
homepage: "https://sourceforge.net/projects/libwps/"

# 上游**没有**测试套件：顶层与各 src/ 子目录的 Makefile.am 均无 TESTS /
# check_PROGRAMS 声明（grep -rn "TESTS\|check_PROGRAMS" --include="Makefile.am"
# 无任何命中），tarball 内无 test 目录、无 *test* 命名源文件（src/ 下只有
# lib、conv、fuzz 三个子目录），也不分发任何 Microsoft Works 样例文档。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libwps.cpp
    description: >-
      消费者功能测试（库级）：自实现一个最小 librevenge::RVNGInputStream
      （同时也验证"消费者可把自己的流类型喂给 libwps"），对 WPSDocument 的
      公开入口做真实调用——格式识别 isFileFormatSupported 的负例
      （nullptr/空流/纯文本/Works 魔数被破坏）与**正例**（手工构造的合法
      Microsoft Works v2 头：byte0<6 且 byte1=0xFE、文件长度≥0x100——
      WPSHeader::constructHeader 与 WPS4Parser::checkHeader 检查的全部内容，
      必须返回 WPS_CONFIDENCE_EXCELLENT 且 kind/creator 出参为
      WPS_TEXT/WPS_MSWORKS）、长度门负例（同一魔数但 <0x100 字节必须被拒）、
      边界值正例（byte0=0x00）、以及非 Works 输入下 parse 的失败契约与
      null 接口入参的 WPS_UNKNOWN_ERROR 契约。共 10 项断言，失败即非零退出。
    command: "./test_libwps"
  - file: test_package/test_libwps_cli.sh
    description: >-
      消费者功能测试（CLI 级）：对包内安装的 wps2text 真实调用——不存在的
      输入文件必须以非零码失败；纯文本（非 Works 文档）必须被非零码干净拒绝；
      仅含结构性合法 Works v2 头（魔数 + 510 字节零填充 = 0x200 字节，即
      C++ 测试正例的同一构造）的输入则只要求**不崩溃、不以信号终止**
      （上游对全零体的解析结果未作规定，故只记录实际退出码与输出字节数，
      不作断言）。据此证明转换工具链接成功、librevenge 生成器/流依赖解析
      正确、错误路径干净。共 5 项断言。
    command: "sh test_libwps_cli.sh <pkg>/bin/wps2text"

# 说明：上游不分发 Microsoft Works 样例文档，故"正例解析整篇文档"无法在
# 本测试中完成——格式识别侧已用程序化构造的合法 Works v2 头做了正向断言
# （含 kind/creator 出参与长度门校验），工具侧则验证了干净失败契约。
# 测试断言总数（近似值，用于质量评估）：库级 10 项 + CLI 级 5 项
assertion_count: 15
