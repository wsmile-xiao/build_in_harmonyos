# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lxc-templates-legacy/3.0.4
homepage: "https://linuxcontainers.org/lxc/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# lxc-templates-legacy is a script-only project with no compiled test suite
# The upstream "make check" runs no tests (empty check target)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verify 20+ template scripts and 30+ config files are installed"
    command: "conan test test_package lxc-templates-legacy/3.0.4"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
