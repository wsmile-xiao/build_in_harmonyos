software: luassert
# 版本级 manifest
# 文件位置: archives/l/luassert/1.9.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9.0"

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# 构建系统类型（验证脚本必需字段）
build_system: lua-builtin

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://luarocks.org/luassert-1.9.0-1.src.rock"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: lua-builtin

  # 配置选项列表
  configure_options: []

  # 编译依赖列表
  dependencies:
    - say/1.4.1

  # 编译器（纯 Lua 库不需要）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lua-luassert 是纯 Lua 库，无需 C 编译"
  - "依赖 say 库，需先安装"
  - "使用 LuaRocks .rock 文件获取源码（GitHub 连接失败时的备用方案）"
  - "OpenHarmony 平台 Lua 编译时路径为绝对路径 /usr/local，需要使用 LUA_PATH 环境变量或重新编译 Lua"