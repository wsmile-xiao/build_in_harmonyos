# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.0.0/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: "lwext4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 GitHub tag v1.0.0)
  url: "https://github.com/gkostka/lwext4/archive/refs/tags/v1.0.0.tar.gz"

  # 源码 SHA-256 校验和
  sha256: "0991d092e46adb4f11898f47776816a9ac65aeb4e5175f477ba73301e82eb14a"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DLIB_ONLY=TRUE"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained: []