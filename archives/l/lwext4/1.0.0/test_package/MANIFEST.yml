# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lwext4/1.0.0
homepage: "https://github.com/gkostka/lwext4"

# 上游测试命令 (make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make generic && cd build_generic && make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (fs_test.mk，需要 ext_images.7z 解压的镜像)
upstream_tests:
  - file: fs_test/lwext4_client.c
    source: lwext4-1.0.0/fs_test/lwext4_client.c
    description: "lwext4 客户端（fs_test.mk t0-t26 通过 client 向 server 发命令执行）"
    command: "build_generic/fs_test/lwext4-client -c \"mount bdev /\""
  - file: fs_test/lwext4_server.c
    source: lwext4-1.0.0/fs_test/lwext4_server.c
    description: "lwext4 服务器（接收客户端命令）"
    command: "build_generic/fs_test/lwext4-server"
  - file: fs_test/lwext4_mkfs.c
    source: lwext4-1.0.0/fs_test/lwext4_mkfs.c
    description: "mkfs 工具（在镜像上创建 ext4 文件系统）"
    command: "build_generic/fs_test/lwext4-mkfs"
  - file: fs_test/lwext4_generic.c
    source: lwext4-1.0.0/fs_test/lwext4_generic.c
    description: "generic 全流程自测（挂载/目录/文件读写）"
    command: "build_generic/fs_test/lwext4-generic"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 RAM 块设备全流程测试（mkfs/mount/fopen/fwrite/fread/fclose/umount）"
    command: "./test_lwext4"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12