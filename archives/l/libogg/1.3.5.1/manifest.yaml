version: "1.3.5.1"
software: "libogg"
status: published
build_date: "2026-09-27"
build_system: "direct-cc"

# R37: the published 1.3.5 recipe is immutable, so the reworked recipe ships
# as X.Y.Z.N while still building the same unmodified upstream tarball.
upstream_version: "1.3.5"
upstream_tag: "v1.3.5"
upstream_repo: "https://github.com/xiph/ogg"

source:
  url: "https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz"
  sha256: "0eb4b4b9420a0f51db142ba3f9c64b333f826532dc0f48c6410ae51f4799b664"
  tar_format: tar.gz

build:
  # Not `cmake`: the recipe invokes the validated profile compiler directly
  # and skips every CMake configure/probe step (see notes.md for rationale).
  system: direct-cc
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

# SONAME is resolved at build time from configure.ac (LIB_CURRENT=8,
# LIB_REVISION=5, LIB_AGE=8 -> SOVERSION 0), never hard-coded.
library_versioning:
  lib_current: 8
  lib_revision: 5
  lib_age: 8
  soversion: "0"
  lib_version: "0.8.5"

patches_applied: []

tests:
  upstream_independent_total: 2
  integration_independent_total: 1
  target_passed: 3
  target_status: "pass (2 upstream + 1 integration, counted once across modes)"
  shared_static_counted_once: true
  upstream_result: "passed (executed: 2, passed: 2, failed: 0)"
  integration_result: "passed (executed: 1, passed: 1, failed: 0)"

validation:
  official_source_hash: "pass (sha256 matches the libogg-1.3.5 release tarball reused by the published 1.3.5 archive)"
  upstream_audit: "pass (CMakeLists.txt registers test_bitwise + test_framing under if(BUILD_TESTING); src/Makefile.am declares the same two check_PROGRAMS; no tests/ directory exists)"
  conan_verify: "pass (G0-G4 + L2/L4/L5)"

knowledge_reused:
  - "ref: E103 (bump-cmake-minimum-version) — upstream declares cmake_minimum_required(VERSION 2.8.12), which current cmake rejects outright; evaluated and superseded by the direct-cc route instead of patching the requirement"
  - "ref: E002 (set-env-var) — /tmp is read-only on this platform, so the recipe redirects TMPDIR/TMP/TEMP to a writable cache dir before invoking any compiler child process"
  - "ref: E346 (make SHELL=/bin/sh sandbox denial) — same class of shell/toolchain denial during CMake try_compile; one more reason to bypass CMake probes entirely"
  - "ref: critnib/1.1 recipe precedent — validated direct compiler invocation without CMakeToolchain for a small C library on OHOS"

knowledge_gained:
  - "ref: libogg/1.3.6.2 recipe — the direct-cc route already validated on this package transfers unchanged to 1.3.5; only the source tarball format (.tar.gz vs .tar.xz), checksum and configure.ac SOVERSION differ"
  - "ref: notes.md 选型依据 — a historical archive claiming cmake 配置成功 was recorded under an older cmake; re-verified under cmake 4.1.2 it no longer configures, which is why the published version was bumped rather than edited"
  - "ref: notes.md 问题表 3-6 — host-environment artifacts (bulk-delete guard, PATH shim picking slocal bin conan, zsh TMPPREFIX heredoc failures, git dubious-ownership) block local conan/W3 runs; none are recipe defects and none exist in CI"
