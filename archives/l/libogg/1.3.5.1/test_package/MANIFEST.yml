package: "libogg/1.3.5.1"

upstream_tests_exist: true

upstream_test_audit:
  source_tarball: "libogg-1.3.5.tar.gz"
  source_sha256: "0eb4b4b9420a0f51db142ba3f9c64b333f826532dc0f48c6410ae51f4799b664"
  upstream_tag: "v1.3.5"
  upstream_repo: "https://github.com/xiph/ogg"
  scanned_for:
    - "add_test (CMake)"
    - "enable_testing / include(CTest)"
    - "tests/ directory"
  scan_result: "CMakeLists.txt under if(BUILD_TESTING) registers exactly 2 add_test entries: test_bitwise (src/bitwise.c + _V_SELFTEST) and test_framing (src/framing.c + _V_SELFTEST); src/Makefile.am also declares check_PROGRAMS test_bitwise/test_framing; no tests/ directory exists"
  reason: "upstream 1.3.5 ships 2 official selftest programs; a plain ctest run finds zero entries because BUILD_TESTING is off by default, so the recipe compiles and executes both binaries directly (E249)"

upstream_tests:
  - id: "test-bitwise"
    source: "src/bitwise.c"
    command: "./test_bitwise"
  - id: "test-framing"
    source: "src/framing.c"
    command: "./test_framing"

test_package_tests:
  - id: "installed-package-round-trip"
    source: "test_package.c"
    command: "./libogg_consumer"

test_counting:
