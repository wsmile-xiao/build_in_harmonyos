package: "libogg/1.3.6.2"

upstream_tests_exist: true

upstream_test_audit:
  source_tarball: "libogg-1.3.6.tar.xz"
  source_sha256: "5c8253428e181840cd20d41f3ca16557a9cc04bad4a3d04cce84808677fa1061"
  upstream_tag: "v1.3.6"
  upstream_repo: "https://github.com/xiph/ogg"
  scanned_for:
    - "add_test (CMake)"
    - "enable_testing / include(CTest)"
    - "tests/ directory"
  scan_result: "CMakeLists.txt under if(BUILD_TESTING) registers exactly 2 add_test entries: test_bitwise (src/bitwise.c + _V_SELFTEST) and test_framing (src/framing.c + _V_SELFTEST); no enable_testing()/include(CTest), no tests/ directory"
  reason: "upstream 1.3.6 ships 2 official selftest programs; a plain ctest run finds zero entries, so the recipe executes both built binaries directly (E249)"

upstream_tests:
  - id: "test-bitwise"
    source: "src/bitwise.c"
    command: "./test_bitwise"
  - id: "test-framing"
    source: "src/framing.c"
    command: "./test_framing"

test_package_tests:
  - id: "installed-package-round-trip"
    source: "test_package.c"
    command: "./libogg_consumer"

test_counting:
  upstream_independent_total: 2
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

execution:
  status: "pending HMBS real-machine preflight"
  target: "OpenHarmony PC (HarmonyOS aarch64)"
