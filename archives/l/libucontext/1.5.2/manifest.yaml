# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libucontext 1.5.2 Makefile 改用 prefix/libdir 变量体系（默认 /usr），安装时需传 prefix= 空值 + DESTDIR，与 1.2 的 LIBDIR 变量不兼容"
  - "OHOS musl libc 不导出 getcontext/setcontext，需依赖 libucontext 提供（accel-ppp 等软件的必要依赖）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
