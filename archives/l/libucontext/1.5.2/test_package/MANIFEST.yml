# test_package/MANIFEST.yml — libucontext 1.5.2 上游测试声明

package: libucontext/1.5.2
homepage: "https://github.com/kaniini/libucontext"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: test_libucontext
    description: "getcontext/makecontext/swapcontext/setcontext roundtrip with argument passing"
    source: test_libucontext.c
    command: "./test_libucontext"
  - name: test_libucontext_bare_posixabi
    description: "bare kernel-ABI context switching (EXPORT_UNPREFIXED)"
    source: test_libucontext_posix.c
    command: "./test_libucontext_bare_posixabi"
  - name: test_libucontext_posix
    description: "POSIX signal-aware context switching"
    source: test_libucontext_posix.c
    command: "./test_libucontext_posix"

test_package_tests:
  - file: test.c
    description: "消费者测试：直接复用上游 test_libucontext.c（公开领域），完整校验 makecontext/swapcontext 参数传递与 getcontext/setcontext 往返"
    command: "./test_libucontext"

assertion_count: 44
