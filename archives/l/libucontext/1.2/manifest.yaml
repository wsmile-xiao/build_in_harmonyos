knowledge_gained:
  - "libucontext 1.2 的 aarch64 getcontext 会把 context 指针保存为恢复后的返回值；需回移 1.5.2 的寄存器保存顺序修复，保证初次返回和 setcontext 恢复后都返回 0"
  - "1.2 Makefile 安装目录使用 LIBDIR/INCLUDEDIR/PKGCONFIGDIR，并要求 DESTDIR 末尾保留斜杠"
  - "1.2 Makefile 不安装 libucontext_posix.so 链接名；shared 包需在打包阶段补齐指向 SONAME 的符号链接"
  - "OHOS 专项门禁通过系统 ucontext.h 和未加前缀的 POSIX API 验证 libc 缺失接口由 libucontext_posix 补齐"
  - "OHOS CI 构建时需从实际 clang 推导 SDK llvm/lib，并仅在编译链接阶段前置到 LD_LIBRARY_PATH，确保 lld 加载 ABI 匹配的 libxml2.so.16"

