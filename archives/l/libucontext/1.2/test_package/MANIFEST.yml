# test_package/MANIFEST.yml — libucontext 1.2 upstream and OHOS tests

package: libucontext/1.2
homepage: "https://github.com/kaniini/libucontext"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: test_libucontext
    description: "getcontext/makecontext/swapcontext/setcontext roundtrip with ten-argument transfer"
    source: test_libucontext.c
    command: "./test_libucontext"
  - name: test_libucontext_bare_posixabi
    description: "bare kernel-ABI context switching with unprefixed symbols"
    source: test_libucontext_posix.c
    command: "./test_libucontext_bare_posixabi"
  - name: test_libucontext_posix
    description: "POSIX signal-aware context switching"
    source: test_libucontext_posix.c
    command: "./test_libucontext_posix"

test_package_tests:
  - file: test.c
    description: "Consumer replay of the upstream public-domain context-switch and ten-argument scenario, with checked API results"
    command: "./test_libucontext"
  - file: test_ohos_ucontext.c
    description: "OHOS-only unprefixed ucontext fallback: execution, signal-mask restoration, ten-argument transfer, and AArch64 stack alignment"
    command: "./test_ohos_ucontext"

assertion_count: 48
