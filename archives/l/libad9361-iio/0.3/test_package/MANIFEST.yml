# test_package MANIFEST - libad9361-iio 0.3
test_program: test_libad9361
language: c

upstream_tests:
  static_total: 5
  cases:
    - name: FilterDesignerTest
      kind: software
      executed: true
    - name: GenerateRatesTest
      kind: software
      executed: true
    - name: FilterDesignerHardwareTest
      kind: hardware
      executed: false
      reason: "需要通过 libiio 连接真实 AD9361/FMComms5 板卡，OHOS PC 无此硬件"
    - name: FMComms5SyncTest
      kind: hardware
      executed: false
      reason: "需要两台 FMComms5 板卡的相位同步硬件环境"
    - name: AutoRateTest
      kind: hardware
      executed: false
      reason: "auto_rate_test_hw.c 直接操作真实 AD9361 设备"

consumer_test:
  build: CMakeDeps/CMakeToolchain, find_package(libad9361-iio), link libad9361-iio::libad9361-iio
  api: ad9361_calculate_rf_clock_chain（纯计算，无需硬件）
  assertions:
    - "25MHz 基带时钟链计算返回 0"
    - "ADC/DAC 速率（链首）不低于基带速率"
    - "6 级时钟链逐级单调非增（RX 与 TX 两条）"
  exit_code_semantics: 任一断言失败返回 1，conan test() 非零即失败
