software: libad9361-iio
display: "libad9361-iio"
description: "AD9361 transceiver helper library (device-independent filter/clock-chain algorithms)"
category: libs
homepage: "https://github.com/analogdevicesinc/libad9361-iio"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "cmake_minimum_required 2.8.12 过老，构建期提升至 3.15（Conan 工具链要求）"
    - "上游以裸 find_library(iio)/find_path(iio.h) 找依赖，经 CMake 变量显式注入 libiio 包路径"
    - "5 项 CTest 中 3 项为硬件测试（需真实 AD9361/FMComms5 板卡），OHOS PC 无硬件逐项跳过"
  common_dependencies:
    - libiio

versions:
  "0.3":
    status: built
    build_date: "2026-09-17"
