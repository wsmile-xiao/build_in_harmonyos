software: lomiri-schemas
display: "lomiri-schemas"
description: "Lomiri 声明式数据包：GSettings schema + AccountsService D-Bus 接口 + polkit 策略"
category: desktop
homepage: "https://gitlab.com/ubports/development/core/lomiri-schemas"
license: LGPL-2.1-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 CMake 数据包（LANGUAGES NONE），无编译单元，无交叉编译障碍"
    - "补丁 0001：intltool-merge --xml-style 硬依赖 Perl XML::Parser（OHOS 无），改用 configure_file COPYONLY 渲染 gschema"
    - "GSettings CMake 模块取自 cmake-extras/1.9，需自行补 CMAKE_PREFIX_PATH"
    - "gettext 走 tool_requires，并前置进 CMAKE_PROGRAM_PATH 避开 SDK 坏条目"
    - "补写 gio-2.0.pc 的 glib_compile_schemas 变量，避免 CTest 校验命令为空"
    - "GSETTINGS_LOCALINSTALL=ON 让 schema 落本包而非只读的 glib 依赖 prefix"
    - "显式下发 CMAKE_INSTALL_PREFIX，绕开上游 /usr 兜底分支"
  common_dependencies:
    - glib/2.88.3
    - cmake-extras/1.9
    - gettext/0.22.5.1

versions:
  "0.1.11":
    status: built
    build_date: "2026-09-12"
