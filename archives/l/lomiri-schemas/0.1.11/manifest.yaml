# 版本级 manifest — lomiri-schemas 0.1.11
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.11"
software: "lomiri-schemas"

# 编译状态
status: built

build_date: "2026-09-12"

# 构建系统（必填顶层字段）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gitlab.com/ubports/development/core/lomiri-schemas/-/archive/0.1.11/lomiri-schemas-0.1.11.tar.gz"
  sha256: "67887b820690db7714cc24c9cf32b4ecc96c6eb56910b6210923d222a2a15927"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DGSETTINGS_LOCALINSTALL=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - cmake-extras/1.9
    - gettext/0.22.5.1
    - glib/2.88.3

  # 纯数据包：上游 project(... LANGUAGES NONE)，无 C/C++ 编译单元
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - name: "0001-ohos-render-gschema-without-intltool.patch"
    description: >
      intltool-merge --xml-style 需要 Perl 的 XML::Parser 模块，OHOS 设备上不存在，
      导致 6 个 *.gschema.xml.in 全部渲染失败。这些 gschema 输入无 gettext 标记、
      上游亦无 po/ 目录，--no-translations 渲染与原文逐字节等价，改用
      configure_file(... COPYONLY) 并去掉 find_package(Intltool REQUIRED)。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "intltool-merge --xml-style 硬依赖 Perl 的 XML::Parser（readXml() 里 require）；OHOS 设备的 perl 没有该模块，且 --no-translations 并不绕过解析分支，gschema 渲染必然失败"
  - "判断能否用拷贝替代 intltool-merge：若 *.gschema.xml.in 不含 _ 前缀元素/translatable=\"yes\" 且上游无 po/，--xml-style --no-translations 的输出与原文逐字节等价"
  - "lomiri-schemas 是 project(... LANGUAGES NONE) 的纯数据包：build 动作只有 schema 渲染 + add_schema() 注册 CTest 校验"
  - "Conan 的 conan_cmakedeps_paths.cmake 只写 <pkg>_DIR 不写 CMAKE_PREFIX_PATH；find_package(GSettings) 这类装在 share/cmake/<Module>/ 的 config 包必须自行 PREPEND CMAKE_PREFIX_PATH"
  - "CMakeToolchain 仅在 conan_cmakedeps_paths.cmake 不存在时自带 CMAKE_PREFIX_PATH/CMAKE_PROGRAM_PATH——两个分支互斥"
  - "PkgConfigDeps 只按 cpp_info 生成 .pc，不含上游自定义变量（glib_compile_schemas 缺失会让 GSettingsConfig.cmake 的 add_test 丢命令）"
  - "GSettingsConfig.cmake 默认把 schema 装进 glib 依赖 prefix（只读），GSETTINGS_LOCALINSTALL=ON 才落本包"
  - "上游 CMAKE_INSTALL_PREFIX_INITIALIZED_TO_DEFAULT 兜底会把 prefix 改 /usr；显式下发 cache 变量可绕过"
  - "构建期工具（gettext 的 msgfmt/msgmerge）在 OHOS 上须经 CMAKE_PROGRAM_PATH 钉死 Conan 侧 bin，避开 SDK 内 shebang 坏条目"
