# conandata.yml — lomiri-schemas 0.1.11
# 上游：UBports / Lomiri 官方 GitLab 发行 tarball
sources:
  url: "https://gitlab.com/ubports/development/core/lomiri-schemas/-/archive/0.1.11/lomiri-schemas-0.1.11.tar.gz"
  sha256: "67887b820690db7714cc24c9cf32b4ecc96c6eb56910b6210923d222a2a15927"

patches:
  - patch_file: "patches/0001-ohos-render-gschema-without-intltool.patch"
    patch_description: >
      OHOS: intltool-merge --xml-style 依赖 Perl 的 XML::Parser 模块，OHOS 设备上不存在，
      6 个 *.gschema.xml.in 全部渲染失败（"You must have XML::Parser installed"）。
      这些 gschema 输入不含 gettext 标记、上游也无 po/ 目录，--no-translations 渲染
      与原文逐字节等价，故改用 configure_file(... COPYONLY)，并去掉
      find_package(Intltool REQUIRED)。
    patch_type: "portability"
