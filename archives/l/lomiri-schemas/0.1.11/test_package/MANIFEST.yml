# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: lomiri-schemas/0.1.11
homepage: "https://gitlab.com/ubports/development/core/lomiri-schemas"

# 上游测试情况：lomiri-schemas 无测试套件——无 tests/ 目录、无 enable_testing()/
# CTest 集成、无 .github/workflows（CI 走 debian/Jenkinsfile 的
# ubports-build-tools 只做打包）。全仓 grep add_test|enable_testing|gtest|
# check_PROGRAMS|TESTS=|pytest 零命中。schema 的 CTest 校验项（validate-*）由
# **cmake-extras** 的 GSettings 模块在 configure 期 add_test() 注册，不在上游
# 仓库里，故按裸上游口径计 0。
upstream_test_in_build: false
upstream_check_command: ""
upstream_tests: []

# test_package 消费者断言（R34 真实产物 + 鸿蒙特有功能实跑，OHOS 目标执行）
test_package_tests:
  - file: test_lomiri_schemas.py
    description: >
      48 项断言：6 个 GSettings schema 文件齐全、良构 XML、15 个 <schema id> 全部就位；
      glib 包的 glib-compile-schemas --strict --dry-run 对 schema 目录做真实编译校验；
      lomiri-schemas.pc 的 Version/Requires/prefix 重定位；6 个 AccountsService
      D-Bus 接口 XML + accountsservice/interfaces 入口；polkit policy 与 rules。
    command: "python3 test_lomiri_schemas.py <pkg> <glib-pkg>"

# 断言总数：48
assertion_count: 48
