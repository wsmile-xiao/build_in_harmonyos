software: libproxy
name: libproxy
version: 0.5.12
status: published
build_system: meson
source_url: https://github.com/libproxy/libproxy.git
source_type: git
configure_options:
  - -Dcurl=false
  - -Ddocs=false
  - -Dtests=false
  - -Dconfig-gnome=false
  - -Dconfig-kde=false
  - -Dconfig-xdp=false
  - -Dpacrunner-duktape=false
  - -Dvapi=false
  - -Dintrospection=false
  - -Drelease=true
dependencies:
  - glib-2.0 >= 2.71.3
  - gio-2.0 >= 2.71.3
build_date: "2026-05-22"
compiler: clang 15.0.4
build_duration: ~30 minutes
artifacts:
  - libproxy.so.0.5.12
  - libpxbackend-1.0.so
  - proxy
issues:
  - musl dynamic linker does not support RUNPATH
  - patchelf permission denied when modifying ELF RPATH
  - proxy tool cannot load libproxy.so at runtime
platform_notes: |
  Library files are compiled successfully but the proxy tool has runtime loading issues
  due to musl linker limitations with RUNPATH support. The library can be used by
  linking applications directly with LD_PRELOAD or LD_LIBRARY_PATH workaround.