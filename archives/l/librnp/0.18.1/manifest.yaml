# 版本级 manifest
# 文件位置: archives/l/librnp/0.18.1/manifest.yaml

version: "0.18.1"
software: "librnp"
status: built
build_date: "2026-09-16"
build_system: "cmake"

source:
  url: "https://github.com/rnpgp/rnp/releases/download/v0.18.1/rnp-v0.18.1.tar.gz"
  sha256: "423c8e32e1e591462f759adf8441b1c44bca96d9f5daff13b82e81a79f18ecfd"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DDOWNLOAD_GTEST=OFF"
    - "-DCRYPTO_BACKEND=botan"
    - "-DSYSTEM_LIBSEXPP=OFF"
    - "-DENABLE_DOC=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies:
    - botan2/2.19.5
    - json-c/0.18
    - zlib/1.3.1
    - bzip2/1.0.8
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "RNP Botan 后端可用 BOTAN_ROOT_DIR 直接对接 botan2 制品包，无需补丁"
  - "cli_tests 依赖 GnuPG，在 OHOS 上用 GPG_EXECUTABLE 守卫跳过，仅跑 gtest rnp_tests"
