software: librnp
display: "librnp"
description: "High performance C++ OpenPGP library used by Mozilla Thunderbird"
category: crypto
homepage: "https://www.rnpgp.org/"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Botan 后端对接 botan2 制品包（BOTAN_ROOT_DIR），无需补丁"
    - "cli_tests 需 GnuPG，OHOS 上自动跳过，仅跑 gtest rnp_tests"
  common_dependencies:
    - botan2
    - json-c
    - zlib
    - bzip2

versions:
  "0.18.1":
    status: built
    build_date: "2026-09-16"
    conan_ref: "librnp/0.18.1"
