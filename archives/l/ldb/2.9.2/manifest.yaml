software: ldb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.9.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.9.2"

# 构建系统
build_system: waf

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.samba.org/pub/ldb/ldb-2.9.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: waf

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--disable-python"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "lmdb/system"
    - "libiconv/prebuilt"
    - "openldap/system"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lib-replace-replace.h.patch"
  - "0002-lib-replace-wscript.patch"
  - "0003-third_party-cmocka-cmocka.h.patch"
  - "0004-wscript.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Samba waf构建系统的replace库(replace.h)使用宏将标准C函数替换为私有rep_*符号，在HarmonyOS上导致链接失败"
  - "HAVE_SECURE_MKSTEMP检测在HarmonyOS上失败(E046 SELinux/umask: mkstemp返回660而非0600)"
  - "HAVE_BSD_STRTOLL在HarmonyOS上被定义但实际Linux/musl的strtoull行为正确，不需要rep_strtoull替换"
  - "ldb的replace库默认private_library=True，所有rep_*符号为local，外部工具无法链接"
patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/ldb-2.9.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/ldb-2.9.2.work
  source_orig_hash: 8d0381eb64acfc76
  source_work_hash: d338aac9402aa1ef
  generated_at: '2026-06-09T10:29:48'
  patches_count: 4

patch_classification:
  - file: 0001-lib-replace-replace.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-lib-replace-wscript.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-third_party-cmocka-cmocka.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-wscript.patch
    type: auto
    platform_only: True
    guard: 'pending'
