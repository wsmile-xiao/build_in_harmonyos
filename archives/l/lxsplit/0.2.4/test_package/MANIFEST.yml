# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lxsplit/0.2.4
homepage: "https://lxsplit.sourceforge.net/"

# lxsplit has no upstream test suite (no make check/test target in Makefile)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: N/A
    source: N/A
    description: "lxsplit Makefile has no test/check target"
    command: "N/A"

test_package_tests:
  - file: test_lxsplit.sh
    description: "Functional round-trip: split a file, join the pieces, cmp against original (return code + content + sha256)"
    command: "bash test_lxsplit.sh"

assertion_count: 6
