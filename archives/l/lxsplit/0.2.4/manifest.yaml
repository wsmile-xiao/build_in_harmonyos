software: lxsplit
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-26"

# 构建系统
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/lxsplit/lxsplit/0.2.4/lxsplit-0.2.4.tar.gz"

  # 源码校验和
  sha256: "858fa939803b2eba97ccc5ec57011c4f4b613ff299abbdc51e2f921016845056"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零补丁：上游 Makefile 在 OHOS clang 下直接可用）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "lxsplit 0.2.4 是简单 GNU Makefile 项目（非 autotools），无 configure 脚本，直接 make 编译"
- "上游 Makefile 构建 mkuoff_t 并在编译期运行以生成 uoff_t.h；其注释称不适合交叉编译，但 OHOS 构建 profile 与 host arch 一致（aarch64），helper 原生运行，无需 patch 或跨运行规避"
- "Makefile 已内置 LFS 支持（-D_LARGEFILE_SOURCE -D_LARGEFILE64_SOURCE -D_FILE_OFFSET_BITS=64），通过 USE_LARGEFILE=yes 开启"
- "零补丁：上游 Makefile 接受 CC= 覆盖，CFLAGS ?= -O2 且追加 -Wall -W -DNO_DEBUG，OHOS clang 直接可用"
- "许可证为 GPL-2.0-or-later（COPYING 为 GPLv2 文本，源码头注释 'version 2 of the License, or (at your option) any later version'）"
- "lxsplit 是 CLI 工具（split/join），产物为单个 bin/lxsplit，不应封装为 library"
- "上游无 make check/test 目标（demo/cli 类软件），功能测试在 test_package 中通过 split→join→cmp 端到端验证"
- "split 输出文件名为 <basename>.001/.002...，join 输入需 .001 结尾，输出为去掉扩展名的原名"
