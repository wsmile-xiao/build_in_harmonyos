# lxsplit 软件级 manifest
software: lxsplit
display: "lxSplit"
description: "lxSplit 是命令行文件分割/合并工具，可将大文件按指定大小分割成多个片段（无压缩），并能合并恢复，与 HJSplit 完全兼容"
homepage: "https://lxsplit.sourceforge.net/"
license: GPL-2.0-or-later
repository: https://lxsplit.sourceforge.net/
category: cli
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "简单 GNU Makefile（非 autotools），无 configure 脚本，直接 make 编译"
    - "Makefile 接受 CC= 覆盖，OHOS clang 直接可用，零补丁"
    - "上游 Makefile 构建 mkuoff_t 并在编译期运行以生成 uoff_t.h；OHOS build=host=aarch64，helper 原生运行，无交叉编译问题"
    - "Makefile 已内置 LFS 支持（-D_FILE_OFFSET_BITS=64），支持 >4GB 文件"
    - "CLI 工具，产物为 bin/lxsplit，不应封装为 library"
    - "上游无 make check 目标，功能测试依赖 test_package 的 split→join→cmp 端到端验证"
  common_dependencies: []

# 版本索引
versions:
  "0.2.4":
    status: built
    build_date: "2026-08-26"
