# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.18.1.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.18.1.11"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/stevenhoneyman/l3afpad/tar.gz/refs/tags/v0.8.18.1.11"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GitHub git archive 不含 configure 的 autotools 项目：设备自带 automake 不可用（1.17 驱动配 1.16 share 目录，报 Can't locate Automake/Config.pm），且 /usr/local/bin 排在 PATH 前面会遮蔽 tool_requires —— 必须把 automake/libtool/intltool 作为 tool_requires 并用 env='conanbuild' 运行 autoreconf（该环境导出 ACLOCAL/AUTOMAKE/LIBTOOLIZE/_lt_pkgdatadir）"
  - "intltoolize 硬编码 prefix=/（只有 MINGW32 才从 $0 推导），autoreconf 按裸名调用时必然去 //share/intltool 找数据并失败（cannot copy '//share/intltool/Makefile.in.in'）——任何 PATH wrapper/绝对路径 exec 都无效，唯一解法是复制脚本并把 prefix=/ 改写成 intltool 包路径"
  - "autoconf 2.72 只报 'possibly undefined macro' 警告不算宏缺失：真正生效的办法是 autoreconf -fi -I<依赖的 aclocal 目录>（intltool.m4/glib-gettext.m4），并同时把宏暂存到源码树 m4/ 双保险"
  - "intltool 的 configure 硬检查 GNU gettext 工具（msgfmt/msgmerge/xgettext），需 tool_requires('gettext')；glib 的 gi18n.h 把 gettext() 映射到 g_libintl_* 别名，只有 glib 包内 libintl.a 导出，其 .pc 不列 -lintl —— 必须补 -lintl，但不能放进 configure 的 LIBS（会让 AC_PROG_CC conftest 链接失败报 C compiler cannot create executables），应在 make 阶段以 LIBS=\"...\" 传入且整体加引号（不加引号 make 会把 -L<dir> 当选项报 usage）"
  - "l3afpad 的 parse_args 用 gtk_get_option_group(TRUE) 建 GOptionContext，解析选项时就会打开显示——连 --version 也需要显示（设备实跑输出 'l3afpad: Cannot open display:' 退出 255）；消费者测试因此只能断言 aarch64 ELF + 整个 GTK3 闭包可解析 + 停在显示初始化（不得出现 Error loading shared library/symbol not found）"
  - "conan 按 URL 后缀判断解压方式：codeload.github.com/.../tar.gz/refs/tags/vX 这类无 .tar.gz 结尾的 URL 会被当 zip 解压（BadZipFile），改用 github.com/<owner>/<repo>/archive/refs/tags/vX.tar.gz"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
