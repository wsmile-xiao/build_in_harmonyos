# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: l3afpad/0.8.18.1.11
homepage: "https://github.com/stevenhoneyman/l3afpad"

# 上游测试命令：上游无自动化测试套件（无 tests/、无 make check 目标）
upstream_check_command: "make check (no-op: 上游未提供测试)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "none"

# 上游实际运行的测试程序
upstream_tests: []

# 豁免声明 (TEST_QUALITY_SPEC.md 3.3 / 平台限制)
exemptions:
  - rule: "upstream_has_no_test_suite"
    reason: "l3afpad 上游仓库无 tests/ 目录、无 make check 目标、无自动化测试脚本——功能覆盖改由 test_package 的消费者测试提供"
  - rule: "gui_requires_display"
    reason: "l3afpad 是 GTK+3 图形编辑器，沙箱无显示栈；消费者测试验证到 GTK 初始化前的确定性路径（版本输出、aarch64 ELF、选项解析），并断言失败模式为显示缺失而非库缺失"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "① `l3afpad --version` 打印 L3afpad <版本>（证明 GTK+3/glib 动态链在运行期解析成功）；② 读取 ELF 头断言 64 位 aarch64（e_machine=0xB7，非宿主产物）；③ 传入 --tab-width/--jump 验证 GOption 选项解析路径不报库缺失"
    command: "conan create . (test_package)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
