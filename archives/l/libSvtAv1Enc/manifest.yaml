software: libSvtAv1Enc
display: "SVT-AV1 Encoder"
description: "Scalable Video Technology for AV1 (SVT-AV1) - high-performance AV1 video encoder"
category: gfx              # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://gitlab.com/AOMediaCodec/SVT-AV1"
license: BSD-3-Clause
build_system: cmake        # 常用构建系统（可被版本级覆盖）

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "需要补丁：pthread_setaffinity_np 在鸿蒙平台不支持"
    - "CMake 构建，支持 ARM NEON SIMD 优化"
    - "包含命令行编码器 SvtAv1EncApp"
    - "自包含编译，无外部依赖"
  common_dependencies: []   # 无外部依赖

  known_issues:
    - "pthread_setaffinity_np 不可用，需在 svt_threads.h 中添加 __OHOS__ 检查"
    - "访问 GitHub 可能需要 GitLab 镜像作为备选"
    - "⚠️ 严重问题：SvtAv1EncApp 可能依赖构建目录路径，需验证"

# 版本索引（所有已归档版本，含状态）
versions:
  "3.1.2":
    status: published         # published | built | failed | archived
    build_date: "2026-05-29"
    repack_date: "2026-05-30"
    fix_date: "2026-05-30"
    published_as: libSvtAv1Enc    # 在 cmd-pkgs 中发布的软件名