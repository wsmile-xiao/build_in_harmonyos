software: libuemf
display: "libUEMF"
description: "Portable C99 library to read, write and print EMF, EMF+ and WMF metafiles"
category: library
homepage: "https://github.com/mathog/libUEMF"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "cmake_minimum_required 为 3.0，CMake 4.x 直接拒绝配置，须升至 3.5（E103）"
    - "CMakeLists 硬编码 SET(CMAKE_INSTALL_PREFIX ..)，普通变量遮蔽 Conan 传入的打包前缀，须删除该行让命令行 -D 生效"
    - "add_library(uemf SHARED) 硬编码共享库，改为跟随 BUILD_SHARED_LIBS 以受 Conan shared 选项控制"
    - "上游 testit.sh 依赖 drm_tools 的 extract/execinput（OHOS 不提供），16 项参考比对在配方 build() 内等价复现"
  common_dependencies: []

versions:
  "0.2.8":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libuemf/0.2.8"
