# conandata.yml — libuemf 0.2.8
# 官方源: https://github.com/mathog/libUEMF (作者 David Mathog, v0.2.8 tag)

sources:
  url: "https://github.com/mathog/libUEMF/archive/refs/tags/v0.2.8.tar.gz"
  sha256: "63a599d93fd0be2db83a2c13a4af4c597b85db59d9db20becb2e4f769a2bf4dc"

patches:
  - patch_file: "patches/0001-cmake-minimum-required-3.5.patch"
    patch_description: "Bump cmake_minimum_required 3.0 -> 3.5 so CMake 4.x can configure the project (E103)"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-honor-build-shared-libs.patch"
    patch_description: "Let add_library(uemf) follow BUILD_SHARED_LIBS so the Conan shared option controls the linkage"
    patch_type: "portability"
  - patch_file: "patches/0003-cmake-install-prefix.patch"
    patch_description: "Drop the hardwired SET(CMAKE_INSTALL_PREFIX ..) so the Conan package folder install prefix applies"
    patch_type: "portability"
  - patch_file: "patches/0004-cmake-shared-soname.patch"
    patch_description: "Pass -Wl,-soname,libuemf.so explicitly: the OHOS CMake platform (HarmonyOS) ignores VERSION/SOVERSION, leaving no DT_SONAME (L5a)"
    patch_type: "portability"
