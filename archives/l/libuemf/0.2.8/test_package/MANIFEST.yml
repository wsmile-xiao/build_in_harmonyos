# test_package/MANIFEST.yml — libuemf/0.2.8 上游测试声明
package: libuemf/0.2.8
homepage: "https://github.com/mathog/libUEMF"

# 上游测试命令: testit.sh 需要 drm_tools 的 extract/execinput（OHOS 不提供），
# 因此 conanfile.py build() 按同一比对逻辑直接驱动 5 个生成程序并
# 与 16 份 *_ref* 参考比对（等价复现，非逐字运行）：二进制 cmp 12 项；
# 文本 4 项在字节级 cmp 后允许符号扩展归一化（aarch64 char 无符号，
# 打印 0x80 为 `80`，x86 生成的参考为 `FFFFFF80`，属打印伪差）。
upstream_check_command: "./testit.sh"
upstream_test_in_build: true
upstream_test_command: "testbed_emf/testbed_wmf/testbed_pmf/test_mapmodes_emf 重新生成 + reademf/readwmf 转储，cmp（二进制）/归一化 cmp（文本）对照 16 份参考"

# 上游实际运行的测试程序（source 为上游 tarball 内路径）
upstream_tests:
  - file: testbed_emf.c
    source: libUEMF-0.2.8/testbed_emf.c
    description: "生成 test_libuemf.emf（模式 0）与 test_libuemf30.emf（模式 4），对应 2 组二进制比对 + 2 组 reademf 文本比对"
    command: "./testbed_emf 0 ; ./testbed_emf 4 ; ./reademf ..."
  - file: testbed_wmf.c
    source: libUEMF-0.2.8/testbed_wmf.c
    description: "生成 test_libuemf.wmf，对应 1 组二进制比对 + 1 组 readwmf 文本比对"
    command: "./testbed_wmf 0 ; ./readwmf ..."
  - file: testbed_pmf.c
    source: libUEMF-0.2.8/testbed_pmf.c
    description: "生成 EMF+ 测试文件 test_libuemf_p.emf，对应 1 组二进制比对 + 1 组 reademf 文本比对"
    command: "./testbed_pmf 0 ; ./reademf ..."
  - file: test_mapmodes_emf.c
    source: libUEMF-0.2.8/test_mapmodes_emf.c
    description: "按 8 种映射模式生成 test_mm_*.emf，对应 8 组二进制比对"
    command: "./test_mapmodes_emf -vX 2000 -vY 1000"
  - file: reademf.c
    source: libUEMF-0.2.8/reademf.c
    description: "EMF 逐记录文本转储，与 test_libuemf_ref*_emf.txt / test_libuemf_p_ref_emf.txt 比对"
    command: "./reademf <file>"

# test_package 自带的消费者测试
test_package_tests:
  - file: test_libuemf_api.c
    description: "公共 API 往返：emf_start/U_EMRHEADER_set/U_EMRSETMAPMODE_set/createbrushindirect_set/selectobject_set/U_EMRRECTANGLE_set/U_EMREOF_set/emf_finish 生成，emf_readdata 读回，逐记录断言签名/记录数/映射模式/矩形边界/EOF；另核对 U_emr_names"
    command: "./test_libuemf"

# test_libuemf_api.c 断言数（W3 实测执行 20 项：18 个静态 CHECK + 2 个循环内条件断言）
assertion_count: 20
