name: loudmouth
description: 轻量易用的 Jabber/XMPP 异步客户端库（GLib 之上），用于 XMPP 消息收发与 stanza 解析
category: library
homepage: "https://mcabber.com"
license: LGPL-2.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 默认 --with-ssl=gnutls 缺依赖即报错，OHOS 配方 pin --with-ssl=no / --with-idn=no / --with-asyncns=no"
    - "OHOS 下按 E129/E011 处理 config.status 的 umask 077 问题"
  common_dependencies:
    - glib

versions:
  - version: "1.5.4"
    status: built
    date: "2026-09-24"
