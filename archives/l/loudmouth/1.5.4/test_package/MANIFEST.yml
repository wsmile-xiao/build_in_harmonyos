# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: loudmouth/1.5.4
homepage: "https://mcabber.com"

# ── 上游测试：在 build() 中真实编译并执行 ────────────────────────────────
# 上游测试套件在 tests/（Autotools，GLib g_test 框架驱动）：
#   tests/Makefile.am 注册两个测试程序 test-parser、test-data-objects，
#   每个程序 g_test_init/g_test_add_func 注册 2 个 g_test 用例。
# 上游 command 由 build/Makefile.am.test 的 `test` 目标经 gtester 驱动
# （make check -> check-local -> test -> gtester --verbose test-parser test-data-objects）。
# 本配方在 build() 内直接执行这两个 GLib 测试二进制（同断言、同数据），
# 现值解析其逐用例输出并输出 HMBS_UPSTREAM_TEST_RESULT 标记。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "test-parser test-data-objects  # build() 内直接执行（每个 2 个 g_test 用例）"

# ── 分母（与审方数法一致）────────────────────────────────────────────
# 审方以「上游注册用例总数」为分母。取数来源（loudmouth-1.5.4 源码包内）：
#   tests/test-parser.c:        g_test_add_func("/parser/valid_suite")，
#                               g_test_add_func("/parser/invalid/suite")   -> 2
#   tests/test-data-objects.c:  g_test_add_func("/data_objects/auth_paramters")，
#                               g_test_add_func("/data_objects/connect_parameters") -> 2
# 合计 4 个 GLib g_test 用例（gtest_macros 口径）。
# tests 目录无其他注册用例；loudmouth/test-dns.c 是 noinst_PROGRAMS 辅助程序，
# 未接入 make check / TEST_PROGS，不计入注册测试总数。
upstream_tests_exist: true
upstream_test_total: 4
upstream_test_count_method: gtest_macros
upstream_test_audit: "tests/Makefile.am 注册 test-parser、test-data-objects 两个程序；test-parser.c 注册 /parser/valid_suite、/parser/invalid/suite；test-data-objects.c 注册 /data_objects/auth_paramters、/data_objects/connect_parameters；共 4 个 g_test 用例。loudmouth/Makefile.am 的 test-dns 为 noinst 辅助程序，不属注册测试。测试数据 fixtures 位于 tests/parser-tests/{valid-1,valid-2,should-be-valid-3,invalid-1}.xml。"

upstream_tests:
  - name: test-parser
    cases: 2
    source: "tests/test-parser.c + tests/parser-tests/{valid-1,valid-2,should-be-valid-3,invalid-1}.xml"
    description: "XMPP stanza 解析器：valid 套件与 invalid 套件"
    command: "./test-parser"
  - name: test-data-objects
    cases: 2
    source: "tests/test-data-objects.c + ../loudmouth/lm-data-objects.c"
    description: "认证参数与连接参数数据对象构造/访问器"
    command: "./test-data-objects"

# test_package 自带的消费者测试（真实调用 loudmouth-1 API）
test_package_tests:
  - file: test.c
    description: "连接对象构造/状态查询、XMPP message 节点构造与 XML 序列化（8 项断言）"
    command: "./test_loudmouth"
    result: "待真机预检回填"

# test_package 自带测试断言总数
# test.c: 8 处 check() 断言（内部含对前一对象的空值守卫）。
assertion_count: 8
