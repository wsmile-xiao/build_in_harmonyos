# test_package/MANIFEST.yml — libnewuoa 0.1.2
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求）

package: libnewuoa/0.1.2
homepage: "https://github.com/elsid/newuoa-cpp"

# 上游测试命令：上游 CMakeLists.txt 未定义任何测试目标（无 enable_testing/add_test，
# 无 test/ 目录），N_static=0，无 make check / ctest 可言。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试数为 0（如实申报），无集成对象；消费者测试由 test_package 承担。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无自动化测试，如实留空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_newuoa.c
    description: "消费者测试：以 newuoa C 接口最小化严格凸二次函数 f(x)=(x0-3)^2+(x1+1)^2+7，断言目标值收敛到 7 且极小点收敛到 (3,-1)；真实编译、链接 libnewuoa 并断言输出"
    command: "./test_newuoa"

# 测试断言总数（消费者测试 3 个断言：f 收敛、x[0]、x[1]）
assertion_count: 3
