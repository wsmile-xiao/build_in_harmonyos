# test_package/MANIFEST.yml — lbzip2 2.5
# CI L0e requires this file to exist.

package: lbzip2/2.5
homepage: "https://github.com/kjn/lbzip2"

# 上游测试命令 (make check, 通过 tests/Makefile TESTS 注册 20 个 .bz2 用例)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序 (Tester 脚本逐一喂给 minbzcat/timeout, 输出与 .diff 比对)
upstream_tests:
  - file: 32767.bz2
    source: tests/32767.bz2
    description: "bzip2 stream with 32767-bit block (max block size)"
    command: "make check"
  - file: ch255.bz2
    source: tests/ch255.bz2
    description: "character 255 edge-case stream"
    command: "make check"
  - file: codelen20.bz2
    source: tests/codelen20.bz2
    description: "code length 20 edge-case stream"
    command: "make check"
  - file: concat.bz2
    source: tests/concat.bz2
    description: "concatenated bzip2 streams"
    command: "make check"
  - file: crc1.bz2
    source: tests/crc1.bz2
    description: "CRC error stream 1"
    command: "make check"
  - file: crc2.bz2
    source: tests/crc2.bz2
    description: "CRC error stream 2"
    command: "make check"
  - file: cve.bz2
    source: tests/cve.bz2
    description: "CVE regression stream"
    command: "make check"
  - file: cve2.bz2
    source: tests/cve2.bz2
    description: "CVE regression stream 2"
    command: "make check"
  - file: empty.bz2
    source: tests/empty.bz2
    description: "empty stream"
    command: "make check"
  - file: fib.bz2
    source: tests/fib.bz2
    description: "fibonacci data stream"
    command: "make check"
  - file: gap.bz2
    source: tests/gap.bz2
    description: "gap pattern stream"
    command: "make check"
  - file: incomp-1.bz2
    source: tests/incomp-1.bz2
    description: "incomplete stream 1"
    command: "make check"
  - file: incomp-2.bz2
    source: tests/incomp-2.bz2
    description: "incomplete stream 2"
    command: "make check"
  - file: load0.bz2
    source: tests/load0.bz2
    description: "load0 edge-case stream"
    command: "make check"
  - file: overrun.bz2
    source: tests/overrun.bz2
    description: "buffer overrun regression stream"
    command: "make check"
  - file: overrun2.bz2
    source: tests/overrun2.bz2
    description: "buffer overrun regression stream 2"
    command: "make check"
  - file: rand.bz2
    source: tests/rand.bz2
    description: "random data stream"
    command: "make check"
  - file: repet.bz2
    source: tests/repet.bz2
    description: "repetitive data stream"
    command: "make check"
  - file: trash.bz2
    source: tests/trash.bz2
    description: "trash data stream"
    command: "make check"
  - file: void.bz2
    source: tests/void.bz2
    description: "void stream"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证, R34/L0c)
test_package_tests:
  - file: test.sh
    description: "真实消费者测试: 用已装 lbzip2/lbunzip2 对 ~1MiB 模式数据做 压缩→解压→cmp 字节级比对, 任一行为错误(压缩/解压失败或输出不一致)即真实失败"
    command: "bash test.sh (conan create 内 test() 调用)"

# 上游断言总数 (make check 20 用例全部 PASS, 每个用例含解压+CRC/输出比对断言)
assertion_count: 20