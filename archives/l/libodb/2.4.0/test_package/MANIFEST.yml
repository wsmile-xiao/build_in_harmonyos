package: libodb/2.4.0
homepage: "https://www.codesynthesis.com/products/odb/"

upstream_check_command: "none available"
upstream_test_in_build: false
upstream_test_command: "none (the libodb 2.4.0 tarball ships no test suite; see upstream_tests below)"
upstream_tests: []

# NO_UPSTREAM_TESTS discovery record (R51 three-step check):
#
# 1. Official entry point: the libodb-2.4.0 release tarball (sha256
#    bfb9c398a6fdec675e33b320a1f80bdf74d8fbb700073bf17062f5b3ae1a2d5c,
#    verified against the local download) contains no tests/ directory.
#    Directory enumeration of the extracted tree (BUILD_SRC_DIR):
#    top level = GPLv2 INSTALL LICENSE Makefile.am Makefile.in NEWS README
#    aclocal.m4 bootstrap config/ configure configure.ac libodb-vc*.sln
#    libodb.pc.in m4/ odb/ version — no test directory anywhere in the tree
#    (`find . -type d -name '*test*'` → 0 hits; `find . -name '*test*'` →
#    0 hits). Top-level Makefile.am: `SUBDIRS = odb`, `dist_doc_DATA`,
#    `EXTRA_DIST`, `pkgconfig_DATA` only — no check target. odb/Makefile.am
#    defines only lib_LTLIBRARIES/header lists — no check target. The only
#    recursive automake targets are all/install/dvi/pdf/ps/info/dist/
#    clean/uninstall (no `check:` implementation, so `make check` is a
#    no-op that recurses into a Makefile without a check rule).
#    Verified by reading Makefile.am and odb/Makefile.am of the tarball.
# 2. Build switch / dependency feasibility: the real upstream test suite is
#    the separate odb-tests-2.4.0 package. Running it requires (a) the odb
#    compiler (odb) to generate persistence code from .hxx definitions — a
#    GCC-plugin-based host compiler not ported to OHOS and not buildable in
#    this repo's CI sandbox — and (b) a live database server per profile.
#    Both prerequisites are unavailable in the device CI sandbox; there is
#    no build knob in the libodb build system that produces a substitute
#    test. (`make check` in the tarball tree: "No rule to make target
#    'check'" from odb/Makefile — nothing to run.)
# 3. Alternative chosen: test_libodb.cxx in this test_package compiles a
#    C++ consumer against the packaged odb headers and libodb library and
#    calls the real API: the ODB/LIBODB version contract macros, the
#    intrusive odb::details::shared_ptr reference counting through the
#    exported odb::details::shared_base symbols (copy increments, scope
#    exit decrements, _ref_count() observation), and the polymorphic
#    odb::exception hierarchy (odb::null_pointer what() + clone() — both
#    exported libodb symbols; the clone preserves the dynamic type and
#    message). This proves the library is linkable, loadable and
#    functional — the maximal evidence obtainable without an odb compiler
#    and a database server.

test_package_tests:
  - file: test_libodb.cxx
    description: "C++ consumer test: ODB/LIBODB version contract macros, odb::details::shared_ptr refcount copy/release cycle via exported shared_base symbols, polymorphic odb::null_pointer exception what() + clone() round-trip"
    command: "./test_libodb"

assertion_count: 4
