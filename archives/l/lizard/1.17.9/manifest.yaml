software: lizard
# 版本级 manifest
# 文件位置: archives/l/lizard/1.17.9/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.17.9"

# 编译状态
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://files.pythonhosted.org/packages/45/16/dbe57aa29fa48eb76ae0b4d25a041cf6e2e2323afda72497429c31a18211/lizard-1.17.9.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: python-setuptools
  configure_options:
    - "python3 setup.py install --prefix=$DEFAULT_PREFIX --old-and-unmanageable"
  dependencies: []
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Python setuptools 包用 --root= 等效 DESTDIR，--prefix= 指定运行时路径"
  - "zip egg 无法被系统 Python 搜索到，需用 --old-and-unmanageable 生成扁平结构"
  - "lizard 入口脚本依赖 importlib.metadata.distribution()，需替换为直接 import 的 wrapper"
  - "wrapper 脚本需 sys.path.insert 添加 site-packages 路径"
  - "测试需从项目根目录运行 `unittest discover -t .` 才能解析相对导入"
