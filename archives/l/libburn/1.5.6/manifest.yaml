knowledge_gained:
  - "config.guess (2014版) 不识别 HarmonyOS，需替换为含 ohos 支持的新版本"
  - "HMDFS 文件系统不支持 chmod，configure 中 umask 077 导致 Permission denied，需移除 umask 077 (E046)"
  - "libburn 无 make check 测试套件，需通过 cdrskin --version 和 API 调用验证功能"
  - "libtool 生成的 wrapper 脚本(cdrskin/cdrskin)和 doxygen 配置(doc/doxygen.conf)不应作为补丁(R6)"

