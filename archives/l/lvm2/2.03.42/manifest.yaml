# 知识沉淀
# ============================================================

knowledge_gained:
  - "lvm2 不用 libtool: libdm 恒产 .so, bcache.c 无条件 #include <libaio.h>, 全量构建必须提供 libaio (configure.ac 对缺失仅 WARN 并降级 device-mapper-only)"
  - "configure 的 libaio.h 探测走 AC_CHECK_HEADERS→CPPFLAGS; AIO_CFLAGS/AIO_LIBS 是 AC_ARG_VAR, 编译期用"
  - "OHOS 内核 io_setup/io_submit 正常但 io_getevents() 触发 SIGSEGV (探针实测), 上游 unit 测试中 22 项 AIO 完成等待类用例因此失败"
  - "上游 shell 测试套件 (454 项) 官方要求 root + dm-crypt 内核, OHOS 设备不满足, 环境性不可执行"
  - "pkg-config 名为 devmapper 而非 lvm2 (libdm/libdevmapper.pc.in: Name: devmapper), 下游 cryptsetup 按 devmapper 探测"

