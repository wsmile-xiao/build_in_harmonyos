# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# lvm2 2.03.42 测试体系（发行包 test/ 目录）:
#   - test/unit/  : CMocka 单元测试，test/unit/unit-test 二进制，
#                   `unit-test list` 枚举 156 个叶子用例；
#                   官方 make 目标 run-unit-test（TESTING: root not needed）。
#   - test/shell/ : 454 项 shell 集成测试，TESTING 明文要求 root + dm-crypt
#                   内核环境（/dev/mapper、loop 设备）；OHOS 设备以非 root
#                   运行且无 dm 内核模块 → 环境性不可执行，0 项运行。
#
# 本地实测（2026-09-16，见 reports/test-report.md）:
#   unit-test 156/156 项全部执行: 134 通过 / 22 失败 / 0 跳过；
#   22 项失败全部为 bcache 异步 AIO 完成等待类（io-engine 4 项 +
#   utils/async 18 项），根因 = OHOS 内核 io_getevents() 触发 SIGSEGV
#   （最小探针: io_setup/io_submit 正常，io_getevents 必崩），
#   属平台内核限制，非 lvm2 代码缺陷。

package: lvm2/2.03.42
homepage: "https://sourceware.org/lvm2/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/unit/unit-test
    source: LVM2.2.03.42/test/unit/（bcache_t.c bitset_t.c config_t.c dmhash_t.c dmlist_t.c dmstatus_t.c 等单元源文件）
    description: "CMocka 单元测试（libdm/base/daemon/metadata，156 用例）"
    command: "LD_LIBRARY_PATH=<build>/libdm/ioctl ./test/unit/unit-test run"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 libdevmapper 调 dm_get_library_version()"
    command: "./test_lvm2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 156
