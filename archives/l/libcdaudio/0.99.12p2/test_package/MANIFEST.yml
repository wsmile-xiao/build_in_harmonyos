# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libcdaudio/0.99.12p2
homepage: "https://libcdaudio.sourceforge.net/"

# 上游**没有**测试套件：所有 Makefile.am（顶层与 src/）均无 TESTS /
# check_PROGRAMS / noinst_PROGRAMS 声明，tarball 内也没有 *test* 命名的源文件，
# 没有 configure 期注册的测试（2026-09-14 对 0.99.12p2 tarball 实测）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libcdaudio.c
    description: >-
      消费者功能测试：对安装后的 libcdaudio 真实调用其与硬件无关的核心逻辑——
      版本上报（cdaudio_getversion 与头文件宏逐位一致、cd_version 写出包名、
      短缓冲区 snprintf 不溢出）、LBA/frame 换算（150 frame 前导区语义与
      下界钳制）、MSF/frame 换算（75 frame/秒，含 01:02:03 == 4653 与
      00:02:00/00:02:01 的严格边界）、多地址 cd_lba_to_msf/cd_msf_to_lba
      往返一致性、以及无 CD 设备时的错误路径（缺失设备节点返回负值；
      可打开但非 CD 的节点 /dev/null 绝不能被报告为可用的 CD 接口——本平台上
      cd_init_device 在挂载表探测阶段即拒绝它）。
      共 20 项断言，失败即非零退出。
    command: "./test_libcdaudio"

# 测试断言总数（近似值，用于质量评估）：test_package 20 项
assertion_count: 20
