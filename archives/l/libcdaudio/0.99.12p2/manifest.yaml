# 版本级 manifest —— libcdaudio 0.99.12p2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.99.12p2"
software: libcdaudio

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-14"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/libcdaudio/libcdaudio/0.99.12p2/libcdaudio-0.99.12p2.tar.gz"
  sha256: "5fdaf9af5ac4f75c0215d000b82b128fd054a582f81cc4f039a1e7fe69335ebb"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=arm-unknown-linux-gnu --host=aarch64-unknown-linux-gnu（本 dist 的 config.sub 是 2005-04-25 版：`aarch64` 这一 cpu 名 2012 年才加入，直接给 aarch64-… 会被 `machine \\`aarch64-unknown-linux' not recognized` 拒绝；四段名带 `unknown` 厂商可原样通过，故 host 用 aarch64-unknown-linux-gnu、build 只需被接受且与之不同。本代码库不按 build_cpu 分支）"
    - "--prefix=/（配合 DESTDIR 使 include/ 与 lib/ 直落包根）"
    - "--enable-static --disable-shared（R26 系统同名库默认静态）"
    - "--disable-dependency-tracking"
    - "configure 的 umask 077→022 改写（hmdfs 按组判通行，2700 临时目录不可穿越，chmod 在 hmdfs 上无效）"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash（平台 profile 自带；autoconf 2.59 无 exec 7<&0，但 automake 的 all-recursive 依赖 POSIX 词分割，zsh 不做该分割）"
    - "autotools 辅助脚本统一 chmod +x（E490）；TMPDIR 指向构建目录内 .tmp（/tmp 只读）"
  dependencies: []
  cc: clang
  cxx: clang++
  options:
    - "shared=False"
    - "线程支持保持上游默认（--enable-threads 为 guessed，探测 pthread_create 失败时会自动降级为不启用，不构成能力降级）"

patches_applied: []

knowledge_gained:
  - "2005 年前后的 autotools dist，其 config.sub 不认识 aarch64（2012 年才加入），也不认识 musl（2011 年才加入）：给 --build/--host 传 aarch64-unknown-linux-musl 会被 `Invalid configuration ... machine \\`aarch64-unknown-linux' not recognized` 直接拒绝。可行做法是用四段名 + `unknown` 厂商（该版本 config.sub 对不认识的 cpu 在带 unknown 厂商时原样放行），例如 --host=aarch64-unknown-linux-gnu 配一个被接受且不同的 --build=arm-unknown-linux-gnu，从而保留交叉模式（configure 不执行它编译出的程序）。前提是代码库不按 build_cpu 分支——libcdaudio 的 configure.ac 只按 host_os 分支 beos/irix/solaris"
  - "conan 的 AutotoolsToolchain 把 CC/CXX 写进 conanautotoolstoolchain.sh，而该脚本只被 conan 自己的 Autotools() 助手 source：配方用裸 subprocess 跑 configure 时必须自己从 profile 的 tools.build:compiler_executables 导出 CC/CXX。否则 autoconf 退到 PATH 里的裸 clang——设备 PATH 含 /data/service/hnp/bin 所以恰好正确，CI worker 的 PATH 不含，命中的 clang 无 OHOS sysroot，报 configure: error: C compiler cannot create executables。这条差异只在 CI 暴露，设备侧自测永远看不到"
  - "老 autotools 包是否能用 zsh 作构建 shell 要看它的 configure 由哪版 autoconf 生成：autoconf 2.59 不含 exec 7<&0（libcdaudio 实测 0 处），因此 toybox sh 也未必不可；但 automake 生成的 all-recursive 用 for subdir in $list 依赖 POSIX 词分割，zsh 会把整串 SUBDIRS 当一个目录名——所以构建 shell 一律取平台 profile 声明的 hnp bash，两种要求都满足"
  - "上游无测试套件的库，test_package 要挑出真正与硬件无关的核心逻辑来验证：libcdaudio 的可用面是版本上报、LBA/MSF/frame 换算（75 frame/秒、150 frame 前导区）与设备错误路径（缺失节点返回负值；可打开但非 CD 的 /dev/null 绝不能被当成可用 CD 接口）。断言应描述**性质**而非某个平台的实现路径——最初按'/dev/null 能 open 所以会拿到描述符'写的断言在设备上失败，因为该平台在挂载表探测阶段就拒绝了它，而两种行为都是正确的"
