# 版本级 manifest — libpskc 2.6.14
# 遵循 ARCHIVE-SPEC v3.0

version: "2.6.14"

software: libpskc

status: built

build_date: "2026-09-16"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.savannah.nongnu.org/releases/oath-toolkit/oath-toolkit-2.6.14.tar.gz"
  sha256: "8b1da365759f1249be57a82aec6e107f7b57dc77d813f96dc0aaf81624f28971"
  compression: tar.gz
  archive_root: "oath-toolkit-2.6.14"
  note: >-
    libpskc 是 OATH Toolkit 发行版内的 libpskc/ 子目录，自带预生成 configure
    （Autoconf 2.72，build-aux 为 2024 世代），故按独立 autotools 项目构建，
    无需 autoreconf。

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "libxml2/2.15.3.1（configure.ac: PKG_CHECK_MODULES(XML2, libxml-2.0,, AC_MSG_ERROR) 默认必需）"
  optional:
    - "xmlsec1（configure.ac: PKG_CHECK_MODULES(XMLSEC, xmlsec1..., [xmlsec=yes], [xmlsec=no]) 缺失即降级；ohpcd 未发布，本适配走该路径，见 notes.md）"

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - "shared=True（默认）"
    - "--disable-gtk-doc / --disable-gtk-doc-html（文档不在交付范围）"
    - "--disable-gcc-warnings"
    - 'make SUBDIRS="gl schemas include ." -j1（裁掉 examples/tests/gtk-doc/man）'
    - "R9：make -j1（并行 make 触发 HMDFS jobserver fifo EPERM，见 E074）"
  notes: >-
    不用 --build/--host 硬编码（本仓铁律），改 patch libpskc/build-aux/config.guess|config.sub
    让其自行识别 OHOS；另把 libpskc/configure 内 umask 077 放宽为 022（HMDFS 拒绝向
    700 临时目录写入，cracklib/pwquality 同款陷阱）。CONFIG_SHELL 指向真实 bash。

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-libpskc-build-aux-config-guess-sub-ohos.patch（portability，2024 世代格式；仓内 scripts/patch-autotools-ohos.pl 对该世代命中 5/5）"

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: >-
    纯 C（autotools）。唯一硬依赖 libxml2 已发布到 ohpcd 且其
    pkg_config_name="libxml-2.0" 与 configure 查找名一致，无缺口。
    xmlsec1 缺失导致签名相关入口（pskc_sign_x509 / pskc_verify_x509crt）
    变为返回错误的桩——属上游受支持的降级配置，已在 notes.md 与消费者测试中显式标注。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 6
  failed: 0
  note: |
    上游 make check（libpskc/tests，6 个 C 测试程序）：**# TOTAL: 6 / # PASS: 6 /
    # SKIP: 0 / # FAIL: 0 / # ERROR: 0**。逐项：PASS tst_basic、tst_errors、
    tst_accessors、tst_setters、tst_validate、tst_invalidread。
    适配后：test_package R34 以 C 程序链接打包的头与库，覆盖
    pskc_check_version 五支、pskc_global_init/pskc_init、
    pskc_parse_from_memory 解析真实 KeyContainer（version=1.0 / id=KCID-1）、
    pskc_output(XML) 回写往返（length=459）、畸形输入拒收（rc=-3）、
    资源释放；并实测 pkg-config 契约（--modversion=2.6.14、--libs 含 -lpskc）。
    刻意不覆盖 pskc_sign_x509/pskc_verify_x509crt——需 xmlsec1（ohpcd 未发布），
    该降级属上游受支持配置，已在 notes.md 显式标注（见 knowledge_gained 第 2 条）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - >-
    libpskc 是 oath-toolkit 的子目录工程，自带预生成 configure 与 build-aux，
    可按独立 autotools 项目就地构建（无需先构建顶层）
  - >-
    libpskc 的 configure 会因 xmlsec1 缺失而**降级**（xmlsec=no / USE_XMLSEC 未定义），
    签名入口变桩——属上游受支持配置，不是适配缺陷，但必须在测试与文档中显式标注
  - >-
    仓内 scripts/patch-autotools-ohos.pl 对 2024 世代 config.guess 命中 5/5
    （对比 pwquality 2018 世代的 1/5）——先验世代再决定用手工补丁还是脚本

references:
  - https://oath-toolkit.codeberg.page/
