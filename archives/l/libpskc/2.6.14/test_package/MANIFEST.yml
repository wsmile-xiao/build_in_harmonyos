# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libpskc/2.6.14
homepage: "https://oath-toolkit.codeberg.page/"

# 上游测试命令 — libpskc/tests 的 make check（6 个 C 测试程序）
upstream_check_command: "make check SUBDIRS=tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check SUBDIRS=tests -j1（输出捕获到 make-check.log）"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - libpskc/tests/ 下 6 个 C 测试：tst_accessors / tst_basic / tst_errors /
#   tst_invalidread / tst_setters / tst_validate
# - 由 tests/Makefile.am 的 TESTS = $(ctests) 驱动
# - 测试需 XML_CATALOG_FILES=$(top_builddir)/schemas/catalog-pskc.xml（由
#   schemas/ 生成，故构建时保留 schemas 子目录）
upstream_tests:
  - file: libpskc/tests/
    source: oath-toolkit-2.6.14/libpskc/tests/
    description: "上游 libpskc 测试套件（6 个 C 测试程序：accessors/basic/errors/invalidread/setters/validate）"
    command: "make check SUBDIRS=tests -j1"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libpskc.py
    description: >-
      消费者测试：真实 API（R34）——用 C 编译器链接**打包的** pskc/pskc.h 与
      libpskc.so 编译并运行一个 C 程序：① pskc_check_version 三支分支
      （PSKC_VERSION / NULL / "999.999" / "0" / "UNKNOWN"）；
      ② pskc_global_init + pskc_init；③ **pskc_parse_from_memory 解析真实 PSKC
      KeyContainer**（XML 取自上游 tests/tst_accessors.c 的形状），并校验
      pskc_get_version == "1.0"、pskc_get_id == "KCID-1"、pskc_get_keypackage(0) 非空；
      ④ pskc_output(XML) **回写序列化**并校验含 KeyContainer（真实往返）；
      ⑤ 畸形 XML 必须被拒（rc != PSKC_OK）；⑥ pskc_done/pskc_global_done 释放。
      另实测 pkg-config 契约（--modversion=2.6.14、--libs 含 -lpskc）。
      刻意**不覆盖** pskc_sign_x509/pskc_verify_x509crt——需 xmlsec1（ohpcd 未发布），
      该降级属上游受支持配置，已在 notes.md 显式标注。
    command: "python3 test_libpskc.py <pkg_dir> <libxml2_libdir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 20
