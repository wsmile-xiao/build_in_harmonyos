# conandata.yml — libpskc 2.6.14（OATH Toolkit 的 libpskc 组件）
# 源码来自上游官方发布站（download.savannah.nongnu.org，R39 合规）

sources:
  url: "https://download.savannah.nongnu.org/releases/oath-toolkit/oath-toolkit-2.6.14.tar.gz"
  sha256: "8b1da365759f1249be57a82aec6e107f7b57dc77d813f96dc0aaf81624f28971"

patches:
  # libpskc 自带 build-aux/config.guess|config.sub（2024 世代），需补 HarmonyOS
  # 识别。本仓 scripts/patch-autotools-ohos.pl 对该世代**命中 5/5**（与 pwquality
  # 2018 世代的 1/5 形成对比），故补丁即由该脚本生成后固化。
  # 目的：让 configure 自行识别 aarch64-unknown-linux-ohos，从而**不必**用
  # --build/--host 硬编码（本仓铁律）。
  - patch_file: "patches/0001-libpskc-build-aux-config-guess-sub-ohos.patch"
    patch_description: >-
      libpskc/build-aux/config.guess|config.sub 增加 HarmonyOS/linux-ohos 识别
      （2024 世代格式）；并裁剪 libpskc/Makefile.in 的 SUBDIRS 为
      "gl schemas include ."（去掉 examples/tests/gtk-doc/man：文档与示例非交付
      范围；裁剪放在补丁层而非 make 命令行，否则 SUBDIRS 会经 MAKEFLAGS 泄漏到
      gl/ 的递归子 make 而报 "cd: gl: No such file or directory"）
    patch_type: "portability"
