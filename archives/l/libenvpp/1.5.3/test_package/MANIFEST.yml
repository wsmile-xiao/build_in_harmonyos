# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libenvpp/1.5.3
homepage: "https://github.com/ph3at/libenvpp"

# 上游构建系统为 CMake；测试由 Catch2 驱动（LIBENVPP_TESTS=ON 时构建 libenvpp_tests）
upstream_check_command: "cmake --build build && ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/libenvpp_test.cpp
    source: libenvpp-1.5.3/test/libenvpp_test.cpp
    description: "核心 API 单元测试（env 解析/校验/前缀）"
    command: "./libenvpp_tests"
  - file: test/libenvpp_parser_test.cpp
    source: libenvpp-1.5.3/test/libenvpp_parser_test.cpp
    description: "内置类型解析器单元测试"
    command: "./libenvpp_tests"
  - file: test/libenvpp_environment_test.cpp
    source: libenvpp-1.5.3/test/libenvpp_environment_test.cpp
    description: "环境变量读取/注入测试"
    command: "./libenvpp_tests"
  - file: test/libenvpp_testing_test.cpp
    source: libenvpp-1.5.3/test/libenvpp_testing_test.cpp
    description: "测试工具集单元测试"
    command: "./libenvpp_tests"
  - file: test/levenshtein_test.cpp
    source: libenvpp-1.5.3/test/levenshtein_test.cpp
    description: "编辑距离算法单元测试"
    command: "./libenvpp_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：注册并解析验证两个环境变量"
    command: "./test_libenvpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 756