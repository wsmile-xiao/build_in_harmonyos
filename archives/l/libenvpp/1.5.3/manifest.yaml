# 知识沉淀
# ============================================================

knowledge_gained:
  - "aarch64 上 char 默认为 unsigned，触发 libenvpp construct_from_string 的 unsigned 复校验分支，导致 char 解析误抛异常；补丁排除 char/signed char/unsigned char 类型"
  - "libenvpp 发布 tarball 中子模块 external/fmt、external/Catch2 为空占位，需以 Conan 依赖提供 fmt 并开启 LIBENVPP_USE_SYSTEM_DEPS"
  - "OHOS CMakeToolchain 将 CMAKE_RANLIB 指向 SDK 中不存在的 llvm-ranlib（SDK 仅提供 llvm-ar），需显式指定 -DCMAKE_RANLIB"

