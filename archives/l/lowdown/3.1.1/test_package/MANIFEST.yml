# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: lowdown/3.1.1
homepage: "https://kristaps.bsd.lv/lowdown/"

upstream_check_command: "bmake regress"

upstream_test_in_build: true
upstream_test_command: "bmake regress"

upstream_tests:
  - file: regress/
    source: lowdown-3.1.1.tar.gz/regress/
    description: "上游官方回归测试套件（1 个 suite，`bmake regress` 单一入口）"
    command: "bmake regress"
    suite_count: 1
    internal_diff_count: 73
    diff_formats:
      - html
      - fodt
      - latex
      - ms
      - man
      - mdoc
      - gemini
    diff_method: "golden-output diff（Markdown 输入 → 7 种输出格式 → 与 expected golden 文件比对）"
    note: "约 73 次 diff 是内部比对次数，不是 73 个独立 testcase；正式测试套件数为 1。"

test_package_tests:
  - file: test_lowdown.c
    description: "C API: include <lowdown.h> + link packaged liblowdown + Markdown→HTML 转换验证（lowdown_buf 调用）"
    command: "./test_lowdown"
    assertion: "stdout 包含内容为 Hello from lowdown 的 <h1> 标题，允许标签带可选属性"

  - file: conanfile.py (test() method)
    description: "CLI smoke: 管道 Markdown 到 packaged lowdown 二进制，断言 HTML 输出含 <h1>"
    command: "printf '%s' '# Hello from lowdown CLI' | lowdown | grep -q 'Hello from lowdown CLI</h1>'"
    assertion: "HTML 输出包含预期 <h1> 标题"

assertion_count: 2
