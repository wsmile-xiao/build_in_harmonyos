# 版本级 manifest — lowdown/3.1.1
# 遵循 ARCHIVE-SPEC v2.0

version: "3.1.1"
software: lowdown

status: built
build_date: "2026-08-27"
build_system: makefile

source:
  url: "https://kristaps.bsd.lv/lowdown/snapshots/lowdown-3.1.1.tar.gz"
  sha256: "59b2cf35bf32fe602c92f33ae917a71e0b2ea76a67bbe48fbae901a8efc6fef3"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "./configure PREFIX=... （BSD configure，非 autotools）"
  dependencies:
    - bmake/20200710
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 Makefile 是 BSD make 格式（.ifdef 条件），GNU make 报 'missing separator'，必须 tool_requires bmake"
  - "configure 脚本自带跨平台探测，OHOS clang 无需任何 patch 即可生成 config.h"
  - "LIBVER=4，liblowdown 同时产 .a 与 .so（HAVE_SHAREDLIB 探测系统 dlfcn）"
  - "lowdown-diff 默认用硬链接创建，overlay/容器文件系统会失败，需 cp 代替"
  - "regress 测试套件覆盖 7 种输出格式，共 74 个 diff 比对，在 OHOS 上全部通过"
