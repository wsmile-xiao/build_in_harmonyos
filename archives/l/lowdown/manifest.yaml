# 软件级 manifest — lowdown
# 遵循 ARCHIVE-SPEC v2.0

software: lowdown

display: "lowdown"

description: "Markdown 处理库与 CLI 工具（liblowdown + lowdown）"

category: library

homepage: "https://kristaps.bsd.lv/lowdown/"

license: ISC

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游使用 BSD Makefile（.ifdef/.for），GNU make 无法解析，须 tool_requires bmake"
    - "configure 脚本探测系统特性生成 config.h + Makefile.configure"
    - "产物：liblowdown.a/liblowdown.so + lowdown CLI + lowdown-diff（硬链接）"
    - "本机文件系统禁止硬链接，lowdown-diff 用 cp 代替 ln"
    - "零 patch：configure + bmake 原生支持 OHOS clang 交叉编译"
  common_dependencies:
    - bmake

versions:
  "3.1.1":
    status: built
    build_date: 2026-08-27
