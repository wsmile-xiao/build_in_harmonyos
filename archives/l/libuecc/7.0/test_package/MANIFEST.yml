# test_package/MANIFEST.yml — libuecc/7
# Upstream test inventory was inspected against the actual source tarball
# (sha256 b94aef08eab5359d0facaa7ead2ce81b193eef0c61379d9835213ebc0a46257a):
#   * `find . -iname '*test*' -type f`            -> 0 hits
#   * `find . -type d -name 'test*'`              -> 0 hits
#   * `grep enable_testing|add_test|ctest CMakeLists.txt src/CMakeLists.txt` -> 0 hits
#   * No `BUILD_TEST` / `ENABLE_TEST` option flag
# libuecc v7 ships as a library only; no automated tests are provided upstream.

package: libuecc/7
homepage: "https://github.com/neocturne/libuecc"

# No upstream check / test command exists. Kept as documentation only.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream supplies zero automated tests for this release.
upstream_tests: []

# Adapter-side (Conan test_package) consumer test that proves the produced
# shared/static library actually links and exercises libuecc's public API.
test_package_tests:
  - file: test_libuecc.c
    description: "libuecc 鸿蒙PC消费者测试：链接 libuecc、调用 ecc_25519_work、计算点乘并验证 Ed25519 base point"
    command: "./test_libuecc"

# Adapter-side assertion count for the new consumer test.
assertion_count: 4