# 版本级 manifest
# 文件位置: archives/{letter}/{name}/7.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（Conan 2.x 要求 MAJOR.MINOR；上游 v7 在此归一化为 7.0）
version: "7.0"

# 软件名
software: "libuecc"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-26"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/neocturne/libuecc/releases/download/v7/libuecc-7.tar.xz"

  # 源码校验和（已下载到本地 $TMPDIR/builds/libuecc-7.tar.xz 实测通过）
  sha256: "b94aef08eab5359d0facaa7ead2ce81b193eef0c61379d9835213ebc0a46257a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=OHOS"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_C_COMPILER_TARGET=aarch64-unknown-linux-ohos"
    - "-DCMAKE_CXX_COMPILER_TARGET=aarch64-unknown-linux-ohos"
    - "-DCMAKE_BUILD_TYPE=Release"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libuecc v7 使用纯 CMake（cmake_minimum_required VERSION 2.6），无第三方依赖"
  - "CMake 4.x 拒绝 2.6 policy；recipe 必须在 CMakeToolchain.cache_variables 里设置 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "上游 install 路径为 include/libuecc-7/libuecc/ecc.h；recipe 必须将 cpp_info.includedirs 设为 ['include/libuecc-7'] 才能用 `#include <libuecc/ecc.h>`"
  - "ecc.h 注释里说 sanitize_secret sets bit255/clears bit256，实际 src/ec25519_gf.c:242 行为是：清 bit255(0x80 of byte31)、set bit254(0x40 of byte31)、清 bottom 3 bits"
  - "CMakeDeps 对 cpp_info.libs=['uecc'] 生成的 IMPORTED 目标名是 libuecc::libuecc（取自 name），不是 libuecc::uecc"
  - "Conan 2.x 拒绝纯数字版本；上游 v7 须以 semver '7.0' 声明，目录采用 7.0 以满足 L0m 门禁（版本目录必须与 conanfile version 一致）"