# conandata.yml — lziprecover 1.26
#
# Two upstream sources are declared here:
#  - lziprecover: the package itself (data recovery tool for .lz files)
#  - lzip:        build-time helper required by the official testsuite
#                 (testsuite/check.sh calls it via LZIP_NAME). lzip is not
#                 published to the OHOS registry, so we build it from source.
#
# Both are official GNU/Savannah releases from the lzip family by
# Antonio Diaz Diaz. URLs use the Savannah download mirror (globally
# reachable, no auth). SHA256 verified against local downloads.

sources:
  lziprecover:
    url: "https://download-mirror.savannah.gnu.org/releases/lzip/lziprecover/lziprecover-1.26.tar.gz"
    sha256: "e234005a756d5649f41686116d3e548736d4a77e5a5ec37b943ca6650787801d"
  lzip:
    url: "https://download-mirror.savannah.gnu.org/releases/lzip/lzip-1.25.tar.gz"
    sha256: "09418a6d8fb83f5113f5bd856e09703df5d37bae0308c668d0f346e3d3f0a56f"

