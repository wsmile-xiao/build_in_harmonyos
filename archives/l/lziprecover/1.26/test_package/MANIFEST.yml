# test_package/MANIFEST.yml
# lziprecover 1.26 — real file-level functional test
#
# Fixtures are committed as **text-only Base64** (.b64) so the PR .diff
# carries no binary data — safe for GitCode checkout-pr / git apply. The
# binary .lz files exist only transiently: at test time conanfile.py decodes
# the .b64 into a fresh tempfile.mkdtemp() dir using only the Python
# standard library (base64, tempfile, shutil, pathlib) and removes it in a
# finally block. The source tree is never written to.
#
# Committed test source (declared so the CI L0c gate counts it):
#   test.c  — real C byte-for-byte file-comparison helper. Compiled in
#             build() with the OHOS C compiler from
#             tools.build:compiler_executables (never a bare shell var, R33)
#             and invoked in test() for the -cd and -B content checks. Not a
#             stub: compares length + content, exits non-zero on mismatch.
#
# Committed fixtures:
#   fixture.txt         — plaintext reference (8 lines, 440 bytes)
#   fixture.txt.lz.b64  — base64 of lzip-compressed fixture.txt (95-byte .lz)
#   damaged.lz.b64      — base64 of fixture.txt.lz with byte at offset 40
#                         flipped to 0xFF, for the -B/--byte-repair path
#
# Tests exercised by conanfile.py::test() (still 4 — test.c enhances 3 & 4):
#   1. --version smoke (sanity only)
#   2. -t integrity check on a valid .lz file
#   3. -cd decompress a valid .lz file, compare output byte-for-byte
#      (compiled test helper + sha256)
#   4. -B byte-repair a damaged .lz file, then -cd decompress and compare
#      (compiled test helper + sha256)
#
# All four tests must pass (exit 0 + helper PASS + sha256 assertions) for
# the package to ship.

package: lziprecover
version: "1.26"
test_type: functional

test_sources:
  - name: test.c
    language: c
    role: "byte-for-byte file-comparison helper (compiled in build(), run in test())"
    compiled_by: "OHOS C compiler from tools.build:compiler_executables (R33)"
    compiled_to: "build_folder/cmp_files"

fixtures:
  - name: fixture.txt
    size: 440
    sha256: "2bbb7ebbfaa1c819358dcf2c32d2366777bd327aee2705e33fed3731114c576d"
    format: text
  - name: fixture.txt.lz.b64
    size: 128
    sha256: "dcff874ccb444a5a47d84e784fea7e29009cc4dee0fcdac6a218ebabc05cf9ec"
    format: base64
    decodes_to: "fixture.txt.lz (95 bytes, sha256 matches the value above)"
  - name: damaged.lz.b64
    size: 128
    sha256: "dd8bc1a2f50ccd98a74071d985f8a243fea3fedfee771849b44b169d1a8ada1d"
    format: base64
    decodes_to: "damaged.lz (95 bytes, byte at offset 40 = 0xFF)"
    note: "byte at offset 40 flipped to 0xFF for -B/--byte-repair recovery test"

decode:
  method: "base64.b64decode (Python stdlib)"
  target: "tempfile.mkdtemp() dir"
  cleanup: "shutil.rmtree(workdir) in finally"

tests:
  - id: version
    command: "--version"
    expect: "lziprecover 1.26"
  - id: integrity
    command: "-t fixture.txt.lz"
    expect_exit: 0
  - id: decompress
    command: "-cd fixture.txt.lz > out.txt"
    content_check: "cmp_files fixture.txt out.txt (byte-for-byte)"
    assert_sha256: "2bbb7ebbfaa1c819358dcf2c32d2366777bd327aee2705e33fed3731114c576d"
  - id: byte_repair
    command: "-B -o repaired.lz damaged.lz"
    expect_exit: 0
    then_decompress_content_check: "cmp_files fixture.txt repaired.txt (byte-for-byte)"
    then_decompress_sha256: "2bbb7ebbfaa1c819358dcf2c32d2366777bd327aee2705e33fed3731114c576d"
