# 软件级 manifest — lcalc
# 遵循 ARCHIVE-SPEC v2.0

software: lcalc
display: "lcalc"
description: "L 函数计算库与命令行工具 — 零点、特殊值、Riemann zeta 与一般 L 函数"
category: math
homepage: "https://gitlab.com/sagemath/lcalc"
license: GPL-2.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "configure 里 `AC_PATH_PROG(GENGETOPT, gengetopt)` 是硬性要求，且 2.1.1 的 tarball **不带预生成的 cmdline.c** → 顺手新做了 `gengetopt/2.23`"
    - "gengetopt **不能用 `tool_requires`**：那会走构建上下文（default profile，不是 ohos-native），conan 会按另一套设置把它重建一遍并挂掉 → 改普通 `requires` + 手动把它的 bindir 塞进 PATH"
  common_dependencies:
    - pari
    - gengetopt

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "2.1.1"
    status: built
    build_date: "2026-08-17"
    notes: "首个鸿蒙 PC conan 配方；真机 conan create + test_package 断言全过"
