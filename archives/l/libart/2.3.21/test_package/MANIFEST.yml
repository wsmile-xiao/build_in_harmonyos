package: libart/2.3.21
homepage: "https://gitlab.gnome.org/GNOME/libart_lgpl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libart 无 make check 目标；tests: 目标构建 noinst 测试程序
upstream_check_command: "make tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make tests && ./testart <subcmd> && ./testuta"

# 上游实际运行的测试程序
upstream_tests:
  - file: testart.c
    source: libart_lgpl-2.3.21/testart.c
    description: "noinst 测试程序，5 个子命令：testpat（随机星形+渐变测试图案）、gradient（渐变渲染）、dist（距离测试）、dash（虚线，输出合法 PostScript）、intersect（相交器测试）。全部写 stdout，无文件依赖"
    command: "./testart testpat | gradient | dist | dash | intersect"
  - file: testuta.c
    source: libart_lgpl-2.3.21/testuta.c
    description: "noinst 测试程序，UTA（微调平铺数组）测试：randstar 生成随机星形 vpath，art_uta_from_vpath 转换，art_rect_list_from_uta 矩形列表化，输出 PostScript 至 stdout"
    command: "./testuta [seed]"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: 验证导出版本常量(2.3.21)、affine 恒等/平移/求逆/旋转往返、vpath->SVP 转换(2 段)"
    command: "./test_libart"
  - file: test_ohos.c
    description: "HarmonyOS-specific test: 验证 __OHOS__、AArch64 目标架构及 64 位指针环境"
    command: "./libart_ohos_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
