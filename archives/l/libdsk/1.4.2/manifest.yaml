# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: 旧版 config.guess 无法识别 HarmonyOS，需替换为 automake-1.17 版本 ref:E007-draft-AC72"
  - "E012: HMDFS SGID+umask077 创建2700权限目录被拒绝，需移除 umask077 改临时目录为 $TMPDIR ref:E012-draft-8E5A"
  - "E008: major()/minor() 从 sys/types.h 移至 sys/sysmacros.h，需条件性添加 #include ref:E008-draft-1732"
  - "E013: autoreconf 需要 AUTHORS/NEWS 文件存在，可创建空 stub 文件 ref:E013-draft-361E"
  - "E014: doc/ 依赖 lyx 生成文档，OHOS 无 lyx，需 touch libdsk.txt 跳过 ref:E014-draft-8208"
  - "E015: autotools 项目 configure 后需手动修补 config.status（运行时修改） ref:E015-draft-1D55"

