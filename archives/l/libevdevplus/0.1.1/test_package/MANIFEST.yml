# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libevdevplus/0.1.1
homepage: "https://github.com/YukiWorkshop/libevdevPlus"

# 上游无独立测试套件：CMakeLists.txt 全文无 enable_testing()/add_test()，
# 也无 ctest/make check 目标。唯一的测试性文件是 test.cpp —— 它是一个手工演示
# 程序（Usage: <event device>），链接 lib 后进入 while(true) 读取真实
# /dev/input/eventX；上游不安装它、不注册为测试，构建机也不具备可读的事件设备
# （设备上 /dev/input 存在但 Permission denied）。因此上游 N=0，如实声明为 0。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无自动化测试程序（test.cpp 为需真实外设的手工 demo，未纳入计数）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，与上游用例分栏统计)
test_package_tests:
  - file: test_libevdevplus.cpp
    description: "libevdevplus API 消费者测试: InputEvent 构造/拷贝、EventDeviceID getter、EventDevice::IsValidDevice 对非事件设备 fd 的真实 ioctl 判定、库导出 Table_* 键盘映射表按值核对"
    command: "./test_libevdevplus"

# 测试断言总数 (test_libevdevplus.cpp 内 CHECK 宏计数)
assertion_count: 23
