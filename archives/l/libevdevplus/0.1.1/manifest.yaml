version: "0.1.1"
software: libevdevplus
build_system: cmake
status: built
build_date: "2026-09-15"
conan_ref: "libevdevplus/0.1.1"

source:
  url: "https://github.com/YukiWorkshop/libevdevPlus/archive/refs/tags/v0.1.1.tar.gz"
  tar_format: tar.gz
  sha256: "c941b6b45f784c1e6c6f316f59256fabd604ac392db405cf7fd99de2686aaab0"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  # 每条登记其知识图谱引用（knowledge_ref:）；无图谱条目者不进本清单——
  # 包级事实（如"上游无自动化测试套件、test.cpp 为需真实 /dev/input 的手工 demo"）
  # 写在 notes.md「上游测试与消费者测试分账」节与 test_package/MANIFEST.yml 里。
  - "上游 cmake_minimum_required(VERSION 3.0) 在 CMake 4.x 下是 hard error；该策略检查位于 CMakeLists 首行、早于 conan_toolchain 加载 故 tc.variables/tc.cache_variables 不可达 只能走 cmake.configure(variables=...)（knowledge_ref: E187 add-cmake-flag，错误签名逐字命中）"
  - "OHOS SDK sysroot 自带 linux/uinput.h（同目录含 input.h / input-event-codes.h）故 C++ evdev 封装库无需 UAPI 软链补丁（knowledge_ref: DRAFT-libevdev-1.13.7-meson-harmonyos-uapi-header-probe——同族 UAPI 头探针；注意该条针对 Meson 的 host_machine.system() 路径拼装，CMake 直连 include 不受影响）"
  - "上游无条件同时构建 SHARED 与 STATIC 两个目标且忽略 BUILD_SHARED_LIBS；options.shared 只能靠 package() 只保留所选变体来落地（knowledge_ref: E288 CMake 双库目标收敛为单一可选产物；本包按 R8 选择零补丁的 packaging 级落地，理由见 conanfile.py 文档串与 notes.md 问题 2）"
