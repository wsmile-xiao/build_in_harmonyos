# 软件级 manifest — libevdevplus
# 位置: archives/l/libevdevplus/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（人读索引/交叉校验，CI 不依赖）

software: libevdevplus
display: "libevdevPlus"
description: "Easy-to-use C++ event device (evdev) library"
category: library
homepage: "https://github.com/YukiWorkshop/libevdevPlus"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "源码唯一的内核头依赖 linux/uinput.h 由 OHOS SDK sysroot 提供（同目录另有 input.h / input-event-codes.h），无需补丁或软链"
    - "上游 CMakeLists.txt 无条件同时构建并安装 SHARED(evdevPlus) 与 STATIC(evdevPlus_Static) 两个目标且忽略 BUILD_SHARED_LIBS；配方在 package() 按 options.shared 只保留所选变体"
    - "上游无自动化测试套件（无 enable_testing/add_test），test.cpp 为需真实 /dev/input 的手工 demo；功能验证由 test_package 消费者测试承担"
  common_dependencies: []

versions:
  "0.1.1":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libevdevplus/0.1.1"
