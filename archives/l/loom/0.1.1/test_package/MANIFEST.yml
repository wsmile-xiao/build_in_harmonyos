# test_package/MANIFEST.yml
package: loom/0.1.1
homepage: "https://github.com/silentbicycle/loom"

upstream_check_command: "make CC=clang ci"
upstream_test_in_build: true
upstream_test_command: "make CC=clang test"

# Each RUN_TEST/RUN_TESTp registration is one executable test instance.
upstream_tests:
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_init_and_free"
    parameters: "default"
    command: "./test_loom"
    status: passed
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_init_and_free_and_join"
    parameters: "count=1"
    command: "./test_loom"
    status: passed
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_init_and_free_and_join"
    parameters: "count=8"
    command: "./test_loom"
    status: passed
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_run_tasks"
    parameters: "threads=1,tasks=1"
    command: "./test_loom"
    status: passed
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_run_tasks"
    parameters: "threads=1,tasks=8"
    command: "./test_loom"
    status: passed
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_run_tasks"
    parameters: "threads=8,tasks=64"
    command: "./test_loom"
    status: passed
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_run_tasks"
    parameters: "threads=8,tasks=1024"
    command: "./test_loom"
    status: passed
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_run_tasks"
    parameters: "threads=0,tasks=1024"
    command: "./test_loom"
    status: passed
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_not_busywait_when_idle"
    parameters: "default; NO_SLOW_TESTS unset"
    command: "./test_loom"
    status: passed
  - file: test_loom.c
    source: loom-0.1.1/test_loom.c
    description: "loom_should_run_cleanup_tasks_if_cancelled"
    parameters: "default"
    command: "./test_loom"
    status: passed

# 5 TEST functions expand to 10 instances. With NO_SLOW_TESTS=1, the idle
# instance is skipped with evidence and must not be counted as passed.
benchmark_tests:
  - file: benchmarks.c
    source: loom-0.1.1/benchmarks.c
    description: "no-op/pi/wakeup/multiprod benchmark entry"
    command: "./benchmarks -v -v"
    status: passed

test_package_tests:
  - file: test_loom.c
    description: "Consumer calls loom_init/enqueue/get_stats/shutdown/free; four tasks complete and backlog reaches zero"
    command: "./test_loom"
    status: passed
