# 版本级 manifest — lxqt-menu-data 2.4.0
# 遵循 ARCHIVE-SPEC v2.0

version: "2.4.0"
software: "lxqt-menu-data"
status: built
build_date: "2026-08-22"
build_system: cmake

source:
  url: "https://github.com/lxqt/lxqt-menu-data/releases/download/2.4.0/lxqt-menu-data-2.4.0.tar.xz"
  sha256: "3487e47562dc19e63358a50c81e51cd0cf1a020397943cadd8db35daeb4866cc"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
  - "DCMAKE_INSTALL_PREFIX=/usr/local"
  dependencies: []
  # 纯数据包：无编译依赖（lxqt2-build-tools 仅用于 CMake 模块，USE_YAML 模式不需要 Qt6）

patches_applied: []

knowledge_gained:
  - "lxqt-menu-data 是纯数据包（.menu + desktop-directories + translations YAML），无 C/C++ 编译产物。"
  - "CMake 配置依赖 lxqt2-build-tools 的 LXQtTranslate 模块，其无条件 find_package(Qt6 LinguistTools)；但 translations 用 USE_YAML 模式，实际不调用 Qt6 工具。纯数据包直接在 conanfile.py 中复制数据文件打包，完全绕过 CMake。"
  - "package_type 不能用 'data'（OHOS 版 conan 不支持），用 'build-scripts' 表示数据/脚本类包。"
  - "test_package 验证数据完整性：5 个 .menu 文件 + 25 个 desktop-directories。"