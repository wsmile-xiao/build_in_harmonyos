# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lxqt-menu-data/2.4.0
homepage: "https://github.com/lxqt/lxqt-menu-data"

# 上游测试命令
# lxqt-menu-data 是纯数据包（.menu + desktop-directories + translations YAML），
# 无测试目标：CMakeLists.txt 无 enable_testing()，源码树无 test 目录
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无测试程序（纯数据包）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证数据文件完整性)
test_package_tests:
  - file: test.c
    description: "验证数据包内容（menus + desktop-directories 文件存在）"
    command: "./test_lxqt-menu-data"

# 测试断言总数
# test_package/conanfile.py test() 检查 5 个 menu 文件 + desktop-directories 数量
# test.c 运行二进制验证
assertion_count: 7