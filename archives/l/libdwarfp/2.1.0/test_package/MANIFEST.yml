# test_package/MANIFEST.yml
# libdwarfp 2.1.0 test declaration file

package: libdwarfp/2.1.0
homepage: https://www.prevanders.net/dwarf.html

# Upstream test command (libdwarf 2.1.0 CMake build: enable testing via
# DO_TESTING — upstream has NO BUILD_TESTING option — then run ctest)
upstream_check_command: "cmake -DDO_TESTING=ON .. && cmake --build . && ctest"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: true
# In-build run: the self-contained unit test subset. The three
# selfdwarfdump* regression tests drive the dwarfdump binary via
# python3; dwarfdump is not built for this package (BUILD_DWARFDUMP=OFF).
# The full 26-test suite (incl. selfdwarfdump* and the
# BUILD_DWARFEXAMPLE-gated tests) was verified passing natively on the
# OHOS aarch64 device — see notes.md.
upstream_test_command: "ctest --test-dir <build> --output-on-failure -E selfdwarfdump"

# Upstream test programs
# libdwarf/libdwarfp upstream CMake test suite: uses DO_TESTING=ON,
# ~20 self-contained C unit tests (selfteststring, selftestextrastring,
# selfleb, selftied, selftestnames, ...) + dwarfdump regression diffs.
upstream_tests:
  - file: test/
    source: libdwarf-2.1.0/test/
    description: "libdwarf official test suite (shared with the libdwarfp producer) — self-contained unit subset via ctest"
    command: "cmake -DDO_TESTING=ON .. && cmake --build . && ctest --output-on-failure"

test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(libdwarfp) + target_link_libraries — verify library can be found and linked"
    command: "cmake -S . -B build"
  - file: test_package/conanfile.py
    description: "dwarf_producer_init + dwarf_new_die_a + dwarf_add_AT_name_a + dwarf_transform_to_disk_form_a + dwarf_get_section_bytes_a + dwarf_producer_finish_a — verify producer API is callable end to end"
    command: "conan test"

assertion_count: 11
