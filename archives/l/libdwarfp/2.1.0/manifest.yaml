software: libdwarfp
version: 2.1.0
status: success
build_system: cmake
build_system_note: "CMake — libdwarfp target is gated behind BUILD_DWARFGEN=TRUE, so the whole libdwarf producer+consumer project is built; the package ships the producer library plus the consumer library needed for its static link closure"
created_at: 2026-09-14
completed_at: 2026-09-14
knowledge_gained:
  - "libdwarfp 2.1.0 is built by the same CMake project as libdwarf; the dwarfp target only exists when BUILD_DWARFGEN=TRUE (top-level CMakeLists.txt gates add_subdirectory(src/lib/libdwarfp))"
  - "Upstream testing entry point is -DDO_TESTING=ON + ctest; there is no BUILD_TESTING option in libdwarf 2.1.0"
  - "Static libdwarfp.a keeps 135 undefined references (llvm-nm -u): 2 cross-archive public APIs (dwarf_encode_leb128/dwarf_encode_signed_leb128, libdwarf.h:9667/9671) + 7 cross-archive internal dwarfstring_* symbols (borrowed dwarf_string.c compiled into both archives) + 2 intra-archive cross-object symbols (dwarf_add_AT_reference_c/dwarf_force_dnames, defined inside libdwarfp.a itself); libdwarfp cannot be built standalone, so the package ships both archives and cpp_info.libs = [dwarfp, dwarf] (same shape as the libdwarf recipe with_dwarfgen=True path)"
  - "libdwarf/2.1.0 was NOT available from the ohpcd registry (only 0.11.1); CI R36/L0i probes every requires() with conan download --only-recipe and hard-fails unpublished dependencies, so the package ships both archives instead of declaring a requires()"
  - "Static builds define LIBDWARF_STATIC=1; upstream try_run checks need HAVE_UNUSED_ATTRIBUTE_EXITCODE=0 only when cross-compiling"
  - "Producer Dwarf_Error objects use a producer-private struct layout: passing them to consumer calls like dwarf_errmsg() is undefined behavior (verified segfault); libdwarfp.h also does not actually include libdwarf.h despite its comment"
  - "zlib/zstd are consumer-side optional decompression dependencies; libdwarfp source has zero references, so this package does not require them"
patches_applied: []
configure_options:
  - cmake -DBUILD_NON_SHARED=ON -DBUILD_SHARED=OFF -DBUILD_DWARFGEN=ON -DBUILD_DWARFDUMP=OFF -DBUILD_DWARFEXAMPLE=OFF -DDO_TESTING=ON
build_commands:
  - cmake --build . -j2
  - ctest --test-dir <build> --output-on-failure -E selfdwarfdump
install_commands:
  - cmake --install . (then strip bin/, lib/cmake, lib/pkgconfig, share/ — tools and packaging metadata only)
staging_dir: ~/tmp/test-install-libdwarfp-2.1.0
build_dir: ~/tmp/libdwarfp-build
build_log: logs/build.log
source_url: https://github.com/davea42/libdwarf-code/releases/download/v2.1.0/libdwarf-2.1.0.tar.xz
artifacts:
  - lib/libdwarfp.a
  - lib/libdwarf.a
  - include/libdwarfp.h
  - include/libdwarf.h
  - include/dwarf.h
test_status: success
test_note: "test_package builds and links libdwarfp(+libdwarf), runs a real producer flow: dwarf_producer_init -> new_die -> AT_name -> transform_to_disk_form -> get_section_bytes (validates DWARF5 CU header) -> producer_finish, plus the unknown-ISA error path"
