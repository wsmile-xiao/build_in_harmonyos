software: log4c
display: "log4c"
description: "C logging library following the log4j pattern (categories, appenders, layouts)"
category: logging
homepage: "https://log4c.sourceforge.io/"
license: LGPL-2.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools：config.sub 不认 aarch64-linux-ohos → configure 覆盖 --host/--build 为 gnu 三元组(原生 build==host)"
    - "uname-shim 修 config.guess(设备 uname=HarmonyOS)"
    - "configure 内 umask 077 → 022（HMDFS 上 config.status 临时文件权限问题，同 lame 3.100）"
    - "--enable-test 打开 tests/ 子目录，make check 跑上游官方测试（L1）"

versions:
  "1.2.4":
    status: built
    build_date: "2026-08-31"
    packaging: conan
    notes: |
      上游最后正式版（2013-10）。纯 library package（无 CLI），不需要 commands.json。
      expat 默认关闭（1.2.4 上游默认 --without-expat），用内置 yacc/lex 解析 log4crc，无 conan 依赖。
    provides:
      - liblog4c.so.3
