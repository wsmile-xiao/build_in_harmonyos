version: "3.0.0"
status: built
build_date: "2026-10-12"
conan_ref: "libgrapheme/3.0.0"

source:
  url: "https://dl.suckless.org/libgrapheme/libgrapheme-3.0.0.tar.gz"
  sha256: "32585af73dda62fbcc0fed14f199aa1bc988ad01dad0bfbd06cf175d9cf3d68c"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "./configure (suckless uname preset, HarmonyOS mapped via 0001-configure.patch)"
    - "make -j1 CC=<conan-conf> AR=<conan-conf> RANLIB=<conan-conf> BUILD_CC=<conan-conf>"
    - "make test: 8 upstream test programs, X/Y summary fractions aggregated"
    - "make install PREFIX=<package> LDCONFIG= (empty, OHOS has no ldconfig)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.patch"

knowledge_gained:
  - "suckless configure has no --prefix flag; conan packages via make install PREFIX=<package>"
  - "upstream test/bidirectional always returns 0; failures only visible in X/Y summary fractions"
  - "upstream suite total is 884674 assertions (884508 conformance + 166 unit), see test_package/MANIFEST.yml"
