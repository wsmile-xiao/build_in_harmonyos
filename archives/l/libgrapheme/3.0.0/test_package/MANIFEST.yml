# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libgrapheme/3.0.0
homepage: "https://libs.suckless.org/libgrapheme/"

# ── 上游测试：已在包构建中真实编译并执行 ────────────────────────────────
# 上游构建为 suckless 风格 Makefile + configure，无 ctest/gtest/pytest。
# `make test`（与 `make check` 同义）编译并运行 test/ 下 8 个测试程序，
# 每个程序把 Unicode 官方测试数据与内置单元断言逐条执行，打印确定性
# 汇总行 `./test/<name>: X/Y conformance|unit tests passed.`。
# 本配方的 build() 逐个运行这 8 个程序并聚合 X/Y 分数（见 conanfile.py
# _run_upstream_suite），退出码不作为计数依据（test/bidirectional 恒
# return 0，必须读分数行才能发现失败）。
upstream_check_command: "make test   # build() 内逐个运行 8 个 test/ 程序并聚合 X/Y 分数"
upstream_test_in_build: true
upstream_test_command: "\"<source_folder>/test/<bidirectional|case|character|line|sentence|utf8-decode|utf8-encode|word>\" × 8"
upstream_tests_exist: true

# ── 分母（与官方口径一致）─────────────────────────────────────────────
# 口径 auto（单一且可解析的框架：上游 make-test  harness 的 X/Y 汇总行）。
# 总数 = 各程序打印分数的分母之和，由发布包源码静态复刻生成器解析逻辑得出：
# conformance（data/*.txt 经 gen/* 工具转数组，LEN 即用例数）：
#   test/bidirectional: 861948（= BidiTest.txt 各记录 modelen 之和 770241
#     + BidiCharacterTest.txt 记录数 91707，逐 mode 计）
#   test/character: 766（data/GraphemeBreakTest.txt 有效行）
#   test/line: 19338（data/LineBreakTest.txt 有效行）
#   test/sentence: 512（data/SentenceBreakTest.txt 有效行）
#   test/word: 1944（data/WordBreakTest.txt 有效行）
#   conformance 小计：884508
# unit（test/*.c 静态断言数组元素数）：
#   test/case: 85（is_lowercase 11 + is_uppercase 11 + is_titlecase 15
#     + to_lowercase 14 + to_uppercase 14 + to_titlecase 20）
#   test/character + test/line + test/sentence + test/word: 12 × 4 = 48
#   test/utf8-decode: 27，test/utf8-encode: 6
#   unit 小计：166
# 合计 884674。配方 build() 在真机用实际分数分母交叉校验（漂移即判失败，
# 不凑数），真机实测数以预检日志的 HMBS_UPSTREAM_TEST_RESULT 为准。
upstream_test_total: 884674
upstream_test_count_method: auto

upstream_tests:
  - suite: bidirectional
    cases: 861948
    delivered_config: compiled
    source: "test/bidirectional.c + data/BidiTest.txt + data/BidiCharacterTest.txt"
  - suite: case
    cases: 85
    delivered_config: compiled
    source: "test/case.c (unit only, no conformance data)"
  - suite: character
    cases: 778
    delivered_config: compiled
    source: "test/character.c (766 conformance + 12 unit) + data/GraphemeBreakTest.txt"
  - suite: line
    cases: 19350
    delivered_config: compiled
    source: "test/line.c (19338 conformance + 12 unit) + data/LineBreakTest.txt"
  - suite: sentence
    cases: 524
    delivered_config: compiled
    source: "test/sentence.c (512 conformance + 12 unit) + data/SentenceBreakTest.txt"
  - suite: utf8-decode
    cases: 27
    delivered_config: compiled
    source: "test/utf8-decode.c (unit only, no conformance data)"
  - suite: utf8-encode
    cases: 6
    delivered_config: compiled
    source: "test/utf8-encode.c (unit only, no conformance data)"
  - suite: word
    cases: 1956
    delivered_config: compiled
    source: "test/word.c (1944 conformance + 12 unit) + data/WordBreakTest.txt"

# 上游测试依赖：无（测试程序仅链接静态库 + 标准 C 库；benchmark 才需要
# libutf8proc，本配方不构建 benchmark）。不存在 missing_dependency。
dependencies_notes:
  - "无外部依赖：库、代码生成器与全部 8 个测试程序仅需 C99 编译器。"
  - "data/*.txt 与 gen/*  fixtures 随发布包附带，构建期无需联网下载。"
  - "benchmark/ 目录需要第三方 libutf8proc，本配方不构建不安装。"

# test_package 中自带的测试 (消费者视角验证；同一 conan create 内执行)
# 实测结果待真机预检回填（首轮仅完成工作树）。
test_package_tests:
  - file: test_consumer.c
    description: "C API 消费者: UTF-8 编解码/字素簇/单词分割/大小写转换与判定共 6 项 CHECK-OK 断言"
    command: "./test_consumer"
    result: "待真机预检回填（设计 6 项 CHECK-OK 断言）"

# 测试断言总数 (test_package 自带消费者测试)
# test_consumer.c: 6 项 CHECK-OK
assertion_count: 6
