software: libmatemixer
display: "libmatemixer"
description: "MATE desktop audio mixer library - provides abstraction for volume control"
category: system
homepage: "https://mate-desktop.org"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "E007: config.guess 需补丁支持 HarmonyOS"
    - "E011: HMDFS umask 077 导致临时文件无法创建，需改为 022"
    - "config.sub 需手动添加 linux-ohos kernel-OS 组合"
    - "glib 需要 PKG_CONFIG_PATH 正确设置"
    - "libintl 需使用 proxy-libintl 版本"
  common_dependencies:
    - glib-2.0
    - gobject-2.0
    - gmodule-2.0

versions:
  "1.28.0":
    status: built
    build_date: "2026-06-02"