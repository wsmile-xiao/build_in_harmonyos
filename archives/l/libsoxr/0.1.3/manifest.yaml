issues_and_solutions:
  - issue: "CMake version compatibility"
    description: "cmake_minimum_required(VERSION 3.1) incompatible with modern CMake (3.10+)"
    impact: "Configuration failed with CMake error"
    root_cause: "libsoxr 0.1.3 uses outdated CMake minimum version"
    solution: "Use CMAKE_POLICY_VERSION_MINIMUM=3.5 parameter to override version check"
    patch_required: false
    preserve_source_integrity: true
    decision_reason: "Keep source code intact for archive integrity, use build parameters for compatibility"
    
  - issue: "Unknown platform (HarmonyOS)"
    description: "CMake does not recognize HarmonyOS system, generates warnings"
    impact: "Warning messages only, no functional impact"
    root_cause: "HarmonyOS not in CMake's platform database"
    solution: "Ignore warnings, build completes successfully with default settings"
    patch_required: false
    compatibility: "Clang compiler and standard toolchain work correctly"
    
  - issue: "SIMD detection failure"
    description: "SIMD32/SIMD64 flags not available on ARM64 platform"
    impact: "Uses pure C implementation, performance slightly lower"
    root_cause: "libsoxr 0.1.3 only supports x86 SIMD (SSE), not ARM NEON"
    solution: "Accept pure C implementation, functionality complete"
    patch_required: false
    performance_note: "ARM platforms could benefit from NEON optimization (future enhancement)"
    
  - issue: "lsr-bindings test failure"
    description: "Relative library path resolution failed in CTest environment"
    impact: "Test fails but library works correctly after installation"
    root_cause: "Test programs use relative path ../src/libsoxr-lsr.so"
    solution: "Set LD_LIBRARY_PATH for runtime or use installed library"
    patch_required: false
    workaround: "LD_LIBRARY_PATH=/path/to/build/src:$LD_LIBRARY_PATH"
    verification: "Manual test confirms libsamplerate API compatibility"
    
