# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 软件名
software: "libco"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源 R39）
  url: "https://github.com/Tencent/libco/archive/refs/tags/v1.0.tar.gz"

  # 源码校验和
  sha256: "c81d3e5b72206d73f7045393e0c454831a3379744d4f9d02d8505fa38141b873"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 构建目标与变量注入（无 configure 步骤）
  configure_options:
  - "make -j1 colib CC=<conf:compiler_executables.c> CXX=<conf:compiler_executables.cpp>"

  # 编译依赖列表（格式: name/version）— libco 自包含，无第三方依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（R3: 探索阶段改源码记 notes；finish 时 refresh-patch --auto 固化）
patches_applied:
- "patches/0001-co_hook_sys_call.cpp.patch: musl libc compatibility"
- "patches/0002-coctx.cpp.patch: aarch64 context creation"
- "patches/0003-coctx.h.patch: aarch64 context layout"
- "patches/0004-coctx_swap.S.patch: aarch64 context switching"
- "patches/0005-example_echosvr.cpp.patch: qualify socket bind"
- "patches/0006-example_poll.cpp.patch: qualify socket bind"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "aarch64 协程上下文：coctx.h regs 扩为 24 槽，swap 汇编按 x86_64 原版语义存/取 regs 数组（BL 不压栈返回地址，resume 地址与 real sp 必须显式存槽 12/13）" # knowledge_ref: knowledge/drafts/E543-draft-A7F3.md
- "musl libc 无 NETDB_INTERNAL（glibc 专用），h_errno 分支需按 __OHOS__/musl 裁剪" # knowledge_ref: knowledge/drafts/E544-draft-A7F3.md
- "musl 无 rdtsc/rdtscp 交叉引用的 __vdso_clock_gettime 兜底，时钟改用 clock_gettime(CLOCK_MONOTONIC)" # knowledge_ref: knowledge/drafts/E544-draft-A7F3.md
- "example 的 socket bind 与 std::bind 二义性（co_routine.cpp using namespace std），需显式 ::bind" # knowledge_ref: archives/l/libco/1.0/notes.md

patch_generation:
  method: refresh-patch --auto
  source_orig_dir: builds/libco-1.0.orig
  source_work_dir: builds/libco-1.0.work
  patches_count: 6
  generated_at: '2026-09-02'

patch_classification:
  - file: 0001-co_hook_sys_call.cpp.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-coctx.cpp.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-coctx.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-coctx_swap.S.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0005-example_echosvr.cpp.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0006-example_poll.cpp.patch
    type: auto
    platform_only: True
    guard: 'pending'
