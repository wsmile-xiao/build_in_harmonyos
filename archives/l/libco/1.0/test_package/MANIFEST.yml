# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# libco v1.0 上游无 make check / ctest 测试套件；
# 上游"测试用例"即仓库自带的 8 个 example 演示程序，
# 已在本地 aarch64 (OHOS musl) 环境全部实际执行验证 (见 notes.md)。

package: libco/1.0
homepage: "https://github.com/Tencent/libco"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""   # 上游 Makefile 无 check/test 目标

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (example 即上游测试)
upstream_tests:
  - file: example_closure.cpp
    source: libco-1.0/example_closure.cpp
    description: "协程闭包+睡眠hook测试：协程内 poll 睡眠，验证 hook 层 co_sleep"
    command: "./example_closure (exit 0)"
  - file: example_cond.cpp
    source: libco-1.0/example_cond.cpp
    description: "协程条件变量测试：3 生产者/2 消费者 co_cond_alloc/signal/wait"
    command: "./example_cond (exit 0)"
  - file: example_copystack.cpp
    source: libco-1.0/example_copystack.cpp
    description: "共享栈模式测试：co_enable_copystack + 10 万次协程切换"
    command: "./example_copystack (exit 0)"
  - file: example_specific.cpp
    source: libco-1.0/example_specific.cpp
    description: "协程私有变量测试：co_setspecific/co_getspecific 往返"
    command: "./example_specific (exit 0)"
  - file: example_thread.cpp
    source: libco-1.0/example_thread.cpp
    description: "多线程压测：4 线程 × 5 万次 co_create/co_yield/co_release"
    command: "./example_thread (exit 0)"
  - file: example_poll.cpp
    source: libco-1.0/example_poll.cpp
    description: "poll hook 测试：协程内对 127.0.0.1 端口 poll 超时返回"
    command: "./example_poll 127.0.0.1 <port> (exit 0)"
  - file: example_echosvr.cpp
    source: libco-1.0/example_echosvr.cpp
    description: "回显服务端：N 协程 accept/recv/send (与 echocli 对测)"
    command: "./example_echosvr 127.0.0.1 <port> <cnt> <size> (对测)"
  - file: example_echocli.cpp
    source: libco-1.0/example_echocli.cpp
    description: "回显客户端：N 协程并发连接收发 (与 echosvr 对测)"
    command: "./example_echocli 127.0.0.1 <port> <cnt> <size> (对测)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：co_create/co_resume/co_yield_ct 真实协程切换断言"
    command: "./test_libco"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
