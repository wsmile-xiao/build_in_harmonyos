# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libmowgli-2/2.1.3
homepage: "https://github.com/atheme/libmowgli-2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libmowgli-2 2.1.3 上游未提供测试套件：make check 无目标（No rule to make target 'check'），源码包无 test/ 目录
upstream_tests:

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 mowgli_string_create/append/append_char、mowgli_strlcpy、mowgli_alloc/free 并断言结果"
    command: "./test_libmowgli-2"

# 鸿蒙特有测试（独立入口，验证 OHOS 平台适配路径）
# 补丁 0002 使 OHOS（缺 _SC_LEVEL1_DCACHE_LINESIZE）时 mowgli_cacheline_bootstrap() 回退 cacheline_size=64；
# 本测试调用公开 API mowgli_cacheline_size()（构造器已触发 bootstrap），断言返回非零且为 64 的倍数。
harmonyos_specific_tests:
  - file: test_ohos_cacheline.c
    description: "鸿蒙特有：验证 patch 0002 cacheline 回退路径，mowgli_cacheline_size() 返回合理缓存行大小"
    command: "./test_ohos_cacheline"

# 测试断言总数 (近似值, 用于质量评估)
# 消费者测试为 4 组断言（string 内容/pos、strlcpy 返回值与内容、alloc/free 非空）；鸿蒙特有测试 2 组断言（非零、64 倍数）
assertion_count: 6
