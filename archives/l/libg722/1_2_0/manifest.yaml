package: libg722
version: "1_2_0"
status: built
build_system: cmake
homepage: https://github.com/sippy/libg722
license: Unlicense

source:
  url: https://github.com/sippy/libg722/archive/refs/tags/v_1_2_0.tar.gz
  sha256: 80b061446b1a014c27eff5659a2bcee4f584e44054b17a1cb3c8840da72513b6
  tar_format: tar.gz

build:
  system: cmake
  command: "cmake -DENABLE_SHARED_LIB=ON -DENABLE_STATIC_LIB=ON && cmake --build . && ctest --output-on-failure"
  dependencies: []

patches_applied: []

tests:
  upstream:
    command: "ctest --output-on-failure"
    cases: 2
    passed: 2
    note: "Upstream CTest suite (TestDynamic/TestStatic) runs scripts/do-test.sh against test_data/ fixtures; numbers confirmed on HarmonyOS aarch64 preflight, CI result prevails."
  test_package:
    command: "test_g722"
    cases: 9
    passed: 9
    note: "Consumer test encodes/decodes PCM via the packaged libg722 (9 CHECK-OK lines); numbers confirmed on HarmonyOS aarch64 preflight, CI result prevails."

platform:
  target_architecture: OHOS/armv8
  limitations: []
