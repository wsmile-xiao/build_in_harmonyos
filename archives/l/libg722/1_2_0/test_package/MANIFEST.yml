package: libg722/1_2_0
homepage: "https://github.com/sippy/libg722"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: test.c
    source: libg722/test.c
    description: "Upstream TestDynamic: decode/encode round-trips via scripts/do-test.sh against test_data/ fixtures"
    command: "ctest -R TestDynamic"
  - file: test.c
    source: libg722/test.c
    description: "Upstream TestStatic: same fixture round-trips linked against the static library"
    command: "ctest -R TestStatic"

test_package_tests:
  - file: test_g722.c
    description: "Consumer round-trip: encoder/decoder lifecycle, 64k encode/decode lengths, all three bit rates (64/56/48k), 8kHz narrowband mode"
    command: "./test_g722"

assertion_count: 9
