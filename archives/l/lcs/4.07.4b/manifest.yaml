version: "4.07.4b"
software: lcs
status: built
build_date: "2026-09-17"
build_system: autotools

source:
  # No official tarball exists for this revision (latest SF file release
  # is 4.06); the tree is pinned per-file to SourceForge SVN r738 via
  # the official !svn/bc/738 DAV URLs — see conandata.yml (188 files).
  scm: "svn-r738"
  tar_format: none

build:
  system: autotools
  bootstrap: "autoreconf -fvi"
  configure_options:
    - "--prefix=<package_folder>  # 见 patches/knowledge 说明：OHOS conan 交叉构建默认 --prefix=/ 会把 datadir=//share 编进 INSTALL_DATA_DIR 宏"
    - "--build=aarch64-linux-ohos  # automake/1.18 的 config.guess（2024-07-27）不识别 HarmonyOS，非交叉构建须显式传 build triplet"
  dependencies:
    - ncurses/6.5
  build_tools:
    - "automake/1.18  # CI 不保证系统 aclocal；VirtualBuildEnv 使 aclocal/automake 进入构建 PATH"
  cc: clang
  cxx: clang++
  extra_flags:
    - "-Wno-narrowing"
    - "-D_LIBCPP_ENABLE_CXX17_REMOVED_BINDERS"

patches_applied:
  - "patches/0001-accept-flat-ncursesw-layout.patch"

knowledge_gained:
  - "Conan ncurses 平铺布局（include/ncurses.h 即宽字符头、仅 libncursesw.a）下，上游 configure.ac 的 ncursesw/ncurses.h 子目录探测 + AC_CHECK_LIB(ncurses) 双双失败；需在探测处接受平铺头并直接探测 libncursesw"
  - "不能用 AutotoolsDeps：其 LIBS=-lncursesw 让 AC_SEARCH_LIBS(initscr) 判为 'none required'，USE_NCURSES/USE_NCURSES_W 均不定义 → includes.h #error；改为仅 AutotoolsToolchain + 手动 -I/-L，探测自然得出 -lncursesw"
  - "AutotoolsToolchain 不注入依赖搜索路径（那是 AutotoolsDeps 职责），需手动把依赖 includedirs/libdirs 加进 extra_cxxflags/extra_ldflags"
  - "OHOS conan 交叉构建默认 --prefix=/：对普通库无碍（文件按 DESTDIR 落位），但会把 $(datadir)=//share 编译期固化进 INSTALL_DATA_DIR 类宏；必须在 configure 显式传 --prefix=<pkg>，同时 install 传 DESTDIR= 防双重前缀"
  - "cursesgraphics.h 以 chtype 宏（ACS_BULLET 等 unsigned int）初始化 int 数组成员，C++11 起为硬错误；-Wno-narrowing 恢复 C++03 语义"
  - "shop.cpp 用 std::mem_fun/not1（C++17 已移除）；libc++ 官方逃生舱 _LIBCPP_ENABLE_CXX17_REMOVED_BINDERS 可恢复，无需改源码"
  - "运行数据闭环：src/Makefile.am 以 -DINSTALL_DATA_DIR=\\\"$(datadir)\\\" 注入，顶层 dist_art_DATA 装到 $(datadir)/lcs/art/，prefix 正确时 make install 直接闭环（38 文件）"
  - "PTY 测试三要素：TIOCSWINSZ 设 80x25（否则标题屏不渲染）、等标题画面出现后再发 ESC、子进程退出后 os.read 抛 EIO 时以 waitpid 取真实退出码"
  - "test_package 引用 ncurses 必须显式 self.requires()：间接依赖的 package_folder 为 None，terminfo 路径取不到"
  - "CI 不保证系统 aclocal（autoreconf 报 Can't exec aclocal）：tool_requires automake/1.18 + VirtualBuildEnv 提供确定性 Autotools 构建环境；configure.ac 无 libtool 宏（Makefile.am 仅 bin_PROGRAMS）故不需要 libtool"
  - "非交叉构建（build/host 同 profile）时 AutotoolsToolchain 不传 --build，configure 无条件探测 build type；automake 1.18 的 config.guess（2024-07-27）不识别 uname -s=HarmonyOS 报 cannot guess build type；用 _get_gnu_triplet(settings_build) 显式追加 --build=aarch64-linux-ohos（stock config.sub 本就接受），无需 patch config.guess"
