# 版本级 manifest — libportaudiocxx 19.7.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "19.7.0"

# 软件名
software: libportaudiocxx

# 编译状态
# published | built | failed
# 说明：积分赛路径 A 适配包；OHOS 二进制由远端 shadow CI/门禁构建并验证，
# 本机无 OHOS 工具链，配方已通过本地 configure/编译验证。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-14"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # libportaudiocxx = PortAudio 官方 tarball 的 bindings/cpp 子目录（PortAudioCpp）
  # 上游判定依据：waterlan 独立站已失效；Alpine/Debian/Fedora 的 libportaudiocxx
  # 发行包（Origin: PortAudio）全部来自此官方 tarball 的 bindings/cpp。
  url: "https://files.portaudio.com/archives/pa_stable_v190700_20210406.tgz"

  # 官方 SHA-256（实测匹配）
  sha256: "47efbf42c77c19a05d22e627d42873e991ec0c1357219c0d74ce6a2948cb2def"

  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
  dependencies:
    - portaudio/19.7.0
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-bindings-cpp-Makefile.in.patch"
  - "0002-bindings-cpp-configure.patch"
  - "0003-bindings-cpp-lib-Makefile.in.patch"
  - "0004-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libportaudiocxx 无独立上游源码树：上游 = PortAudio 官方 tarball 的 bindings/cpp（PortAudioCpp），版本跟随 portaudio 19.7.0"
  - "bindings/cpp 的 configure 通过 $srcdir/../.. 引用 PortAudio 源码树根 aux 文件（config.sub/install-sh/ltmain.sh），独立打包必须保留完整源码树并在子目录 VPATH 构建"
  - "独立打包时 bindings/cpp 默认链接源码树内 libportaudio.la（不适用于独立构建），需 patch LIBADD + DEPENDENCIES 指向 conan 依赖 portaudio/19.7.0"
  - "OHOS 下 configure 不能直接执行（HMDFS shebang 限制），须用 /system/bin/sh 显式调用；config.status 临时目录 umask 077→022"
  - "config.sub 需识别 aarch64-linux-ohos 三元组（OHOS 补丁同 portaudio 0001）"
  - "本机无 libtoolize / autoconf 2.73 与包要求 2.69 不兼容，无法 autoreconf，补丁打在生成文件层（configure/Makefile.in/config.sub），PR 已说明"
