# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libportaudiocxx/19.7.0
homepage: "https://www.portaudio.com/"

# bindings/cpp（PortAudioCpp）上游不附带独立测试程序：
# - `make check` 无测试目标（SUBDIRS 仅 lib/include，见 0001 补丁说明）
# - 上游验证方式为 example/devs.cxx、example/sine.cxx 等示例程序（noinst，不安装）
# 因此本包采用消费者视角测试（test_package）覆盖核心 API 生命周期。
upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_portaudiocxx.cxx
    description: "Exercise PortAudioCpp System lifecycle, version, enumeration, iterator, exception path and sample-size API without audio hardware; on OHOS asserts no-backend behavior (host_apis==0, devices==0, null device usable)"
    command: "./test_portaudiocxx"

# 测试断言总数 (跨平台基础断言 6；OHOS 平台特有断言 1，编译期 __OHOS__ 守卫)
assertion_count: 6
