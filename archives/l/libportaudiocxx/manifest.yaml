# 软件级 manifest — libportaudiocxx

software: libportaudiocxx
display: "PortAudioCpp (libportaudiocxx)"
description: "Native C++ binding of the PortAudio V19 cross-platform audio API"
category: library
homepage: "https://www.portaudio.com/"
license: MIT

build_system: autotools

ohos_adaptation:
  key_points:
    - "C++ 绑定（bindings/cpp）独立构建，链接已适配的 portaudio/19.7.0 包"
    - "上游 Makefile.in 假定在 PortAudio 源码树内构建，需将 LIBADD 改为 -lportaudio 并清空 automake DEPENDENCIES"
    - "示例程序（devs/sine）依赖真实音频设备，构建时排除"
    - "OHOS 的 portaudio 包禁用全部音频后端，hostApiCount()==0 / deviceCount()==0 是平台特有行为"
  common_dependencies:
    - portaudio

versions:
  "19.7.0":
    status: built
    build_date: 2026-09-14
