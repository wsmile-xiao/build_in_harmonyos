version: "2.0.2"
software: libcmph
status: built
build_date: "2026-08-25"
conan_ref: "libcmph/2.0.2"
w0_status: passed
w3_status: passed

source:
  url: "https://downloads.sourceforge.net/project/cmph/v2.0.2/cmph-2.0.2.tar.gz"
  sha256: "365f1e8056400d460f1ee7bfafdbf37d5ee6c78e8f4723bf4b3c081c89733f1e"
  tar_format: tar.gz

build:
  system: autotools
  # GNU release tarball — pre-generated configure, NO autoreconf, NO host
  # automake/autoconf/libtool dependency. Deterministic, CI-clean.
  autoreconf: false
  tool_requires: []
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-dependency-tracking"
    - "--disable-silent-rules"
    - "--disable-cxxmph"
    - "--disable-check"
  dependencies:
    required: []
    optional: []
  cc: clang
  cxx: clang++

# No source patches. The only adaptation is a build-time edit of the
# *generated* configure/config.status to drop `umask 077` (E114). This
# touches generated files only and is recorded here for traceability.
patches_applied: []

test_results:
  type: official
  # 5 upstream make-check programs + 1 consumer test = 6 test cases.
  total: 6
  passed: 6
  failed: 0
  upstream:
    command: "make -j1 check"
    programs:
      - graph_tests
      - select_tests
      - compressed_seq_tests
      - compressed_rank_tests
      - cmph_benchmark_test
    passed: 5
  consumer:
    - perfect_hash_contract
    passed: 1
  assertions: 127

knowledge_ref:
  - E114
  - E074

cli:
  installed: true
  binary: cmph
  version_flag: "-V"
  help_flag: "-h"
  version_output: "0.8"
