package: "libcmph/2.0.2"
homepage: "https://cmph.sourceforge.net/"

# Upstream official test suite.
# tests/Makefile.am declares:
#   TESTS = $(check_PROGRAMS)
#   check_PROGRAMS = graph_tests select_tests compressed_seq_tests
#                    compressed_rank_tests cmph_benchmark_test
#   noinst_PROGRAMS = packed_mphf_tests mphf_tests   (not in TESTS, excluded)
# Each check_PROGRAMS is a standalone program that returns 0 on pass / 1 on
# fail; `make check` runs all five. They are libcheck-free (the optional
# --enable-check unit tests need libcheck and are disabled).
upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests:
  - id: "graph_tests"
    source: "tests/graph_tests.c"
    command: "graph_tests"
    description: >-
      Build/clear/destroy random and cyclic graphs, verify graph_is_cyclic
      detection and the neighbors iterator (GRAPH_NO_NEIGHBOR sentinel).
  - id: "select_tests"
    source: "tests/select_tests.c"
    command: "select_tests"
    description: >-
      Generate a select structure, dump/load round-trip, pack, and query the
      packed form over a 4-element key vector.
  - id: "compressed_seq_tests"
    source: "tests/compressed_seq_tests.c"
    command: "compressed_seq_tests"
    description: >-
      Generate/dump/load/pack/query a compressed sequence over a 20-element
      key vector including a large-value outlier (1077).
  - id: "compressed_rank_tests"
    source: "tests/compressed_rank_tests.c"
    command: "compressed_rank_tests"
    description: >-
      Generate/dump/load/pack/query a compressed rank structure over a
      12-element zero-index vector (20 positions, 12 zeros).
  - id: "cmph_benchmark_test"
    source: "tests/cmph_benchmark_test.c"
    command: "cmph_benchmark_test"
    description: >-
      Benchmark harness self-test: registers bm_sleep and bm_increment and
      runs the benchmark driver to confirm the framework links and executes.

# CLI examples shipped in examples/ — noinst_PROGRAMS, NOT part of make check.
# Counted separately so the official-test number is not inflated.
cli_examples:
  - source: "examples/vector_adapter_ex1.c"
    description: "Vector-adapter usage example (not a registered test)."
  - source: "examples/file_adapter_ex2.c"
    description: "File-adapter usage example (not a registered test)."
  - source: "examples/struct_vector_adapter_ex3.c"
    description: "Struct-vector-adapter usage example (not a registered test)."
  - source: "examples/small_set_ex4.c"
    description: "Small-set usage example (not a registered test)."

# Consumer (test_package) tests.
test_package_tests:
  - id: "perfect-hash-contract"
    source: "perfect_hash_contract.c"
    command: "perfect_hash_contract"
    description: >-
      Link libcmph, build a minimal perfect hash over a fixed 20-key set
      (CMPH_CHD), and verify perfect/injective (P1), minimal (P2),
      stable (P3), packed-form equivalence (P4), and dump/load
      round-trip (P5).

test_counting:
  upstream_independent_total: 5
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

# 5 upstream make-check programs + 1 consumer test = 6 test cases.
# assertion_count = CHECK() calls in perfect_hash_contract.c:
#   7 scalar asserts + 6 per-key loops × 20 keys = 127.
test_case_count: 6
assertion_count: 127
