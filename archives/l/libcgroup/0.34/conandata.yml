sources:
  url: "https://github.com/libcgroup/libcgroup/archive/refs/tags/v0.34.tar.gz"
  sha256: "121ae518b42c73bec9d4442ca915ed40b08dccd10509ea32fa900e3c32b9a78a"

patches:
  - patch_file: "patches/0001-ohos-musl-compat.patch"
    patch_description: >
      musl/HarmonyOS compatibility: define glibc sys/cdefs.h
      __BEGIN_DECLS/__END_DECLS locally, guard linux/socket.h
      sockaddr_storage redefinition pulled in by linux/cn_proc.h,
      linux/connector.h and linux/netlink.h, and use sys/un.h instead
      of linux/un.h for sockaddr_un.
    patch_type: "portability"
  - patch_file: "patches/0002-config-guess-ohos.patch"
    patch_description: >
      Re-anchor config.guess/config.sub for HarmonyOS: __OHOS__ libc
      detection, HarmonyOS uname branch emitting the
      aarch64-unknown-linux-ohos triplet, and the ohos-linux entry in
      config.sub (E007 knowledge: patch the scripts, never pass
      --build/--host which would force cross-build mode).
    patch_type: "portability"
  - patch_file: "patches/0003-test-scripts-env-shebang.patch"
    patch_description: >
      Test driver scripts use #!/bin/bash which does not exist on
      HarmonyOS (/bin -> /system/bin has no bash); switch to
      #!/usr/bin/env bash so the make check test driver can execute
      them with the PATH-provided bash.
    patch_type: "portability"
  - patch_file: "patches/0004-test-controller-probe-ohos.patch"
    patch_description: >
      tests: is_subsystem_enabled() reads /proc/cgroups which HarmonyOS
      does not expose; fall back to probing the OHOS controller mount
      points (/dev/cpuctl for cpu, /dev/memcg for memory) so the test
      binaries can still determine the enabled controllers and TestSet01
      (fs not mounted) executes for real.
    patch_type: "portability"
  - patch_file: "patches/0005-test-driver-ohos-run.patch"
    patch_description: >
      tests driver: keep TestSet01 running on HarmonyOS instead of the
      whole-script SKIP exit when /proc/cgroups is missing or the user
      is not root (SKIP_TEST=77 semantics applied only to the mounted
      sets); break the umount loop when system-owned cgroup mounts
      cannot be unmounted; make get_ctl_num return instead of falling
      through with empty controllers.
    patch_type: "portability"
