package: libcgroup/0.34
homepage: "https://github.com/libcgroup/libcgroup"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "cd tests && bash runlibcgrouptest.sh"
upstream_tests:
  - file: "tests/runlibcgrouptest.sh"
    source: "libcgroup-0.34/tests/runlibcgrouptest.sh"
    description: >
      Upstream test driver: requires /proc/cgroups, root privileges and
      the ability to mount/umount a cgroup v1 filesystem with cpu and
      memory controllers at a test-controlled mountpoint.  Drives the
      libcgrouptest01 binary through three mount scenarios (not mounted,
      single mount, multi mount) covering 38 API invocations.
    command: "cd tests && bash runlibcgrouptest.sh"
  - file: "tests/libcgrouptest01.c"
    source: "libcgroup-0.34/tests/libcgrouptest01.c"
    description: >
      38 test_cgroup_* invocations (init x3, attach_task x9,
      create_cgroup x8, delete_cgroup x7, modify_cgroup x7,
      get_cgroup x2, compare_cgroup x1, add_free_controller x1) gated
      behind /proc/cgroups + cpu/memory controllers + root.
    command: "./tests/libcgrouptest01 <fs_mounted> ..."
  - file: "tests/libcg_ba.cpp"
    source: "libcgroup-0.34/tests/libcg_ba.cpp"
    description: >
      C++ binding smoke (basic API from C++): calls cgroup_init and
      reports the not-mounted error path.  Ran successfully on the
      HarmonyOS PC builder (expected cgroup-not-mounted message).
    command: "./tests/libcg_ba"
test_package_tests:
  - file: "main.c"
    description: >
      OHOS-specific consumer smoke: exercises the in-memory cgroup API
      (cgroup_new_cgroup/cgroup_add_controller/cgroup_get_cgroup_name/
      cgroup_free) which must succeed without any cgroup filesystem,
      plus the cgroup_init() error path which must return a defined
      error code on OHOS (cgroup v1 mounted at non-standard paths,
      no /proc/cgroups).
    command: "./libcgroup_smoke"
assertion_count: 3
