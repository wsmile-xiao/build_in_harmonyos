version: "0.34"
software: "libcgroup"
status: "built"
build_date: "2026-09-15"
build_system: "autotools"

source:
  url: "https://github.com/libcgroup/libcgroup/archive/refs/tags/v0.34.tar.gz"
  sha256: "121ae518b42c73bec9d4442ca915ed40b08dccd10509ea32fa900e3c32b9a78a"
  tar_format: "tar.gz"
  upstream_tag: "v0.34 (commit e9c63e95a65a17952b4d8ae922d5981e394a6ac3)"

build:
  system: "autotools"
  bootstrap: "autoreconf -fi (release tarball ships only configure.in)"
  configure_options:
    - "--disable-pam"
    - "--enable-tools"
    - "--enable-daemon"
  dependencies:
    - "musl-fts/1.2.7"
  tool_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"
    - "bison/3.8.2"
    - "flex/2.6.4"
    - "m4/1.4.19"
  cc: "clang"
  cxx: "clang++"
  make_flags: "-j1 (E074: HMDFS jobserver fifo EPERM)"

patches_applied:
  - "0001-ohos-musl-compat.patch"
  - "0002-config-guess-ohos.patch"
  - "0003-test-scripts-env-shebang.patch"
  - "0004-test-controller-probe-ohos.patch"
  - "0005-test-driver-ohos-run.patch"
knowledge_gained:
  - "E007: config.guess/config.sub re-anchored for HarmonyOS (__OHOS__ libc detection + HarmonyOS uname branch)."
  - "E114: umask 077 dropped from generated configure/config.status (HMDFS drwx--S--- temp dirs)."
  - "musl loader quirk: LD_LIBRARY_PATH entries under /data/storage/el1/bundle (another process's sandbox) fail the WHOLE library search; sanitize before configure."
  - "in-tree build required: 2008-era Makefile.am uses relative libcgroup.map and $(top_srcdir)/src/.libs LDADD, no VPATH support."

homepage: "https://github.com/libcgroup/libcgroup"
license: "LGPL-2.1-or-later"

tests:
  upstream:
    command: "make check (tests/runlibcgrouptest.sh)"
    cases: 40
    executed: 12
    passed: 11
    failed: 1
    skipped: 28
    note: >
      40 = 38 test_cgroup_* invocations (7 in TestSet01 + 13 in TestSet02
      + 17 in TestSet03, per tests/libcgrouptest01.c) + libcg_ba.cpp +
      pathtest.sh.  Real execution on HarmonyOS PC: TestSet01 (fs not
      mounted) runs fully - 10 TEST assertions (9 PASS + 1 FAIL: TEST 1
      cgroup_init expects ECGROUPNOTMOUNTED 50001, the library returns
      ECGOTHER 50016 because it hard-fails on the missing /proc/cgroups
      file); libcg_ba executes and reports the expected not-mounted
      error path; proctest (process table) passes.  TestSet02/03 (30
      test_cgroup_* calls) are skipped per-set: they require root mount
      control over a cgroup v1 filesystem with cpu+memory controllers
      and /proc/cgroups; pathtest.sh reads /proc/cgroups directly.
  adapted:
    command: "test_package/libcgroup_smoke"
    cases: 3
    passed: 3
    note: >
      OHOS-specific consumer smoke: in-memory cgroup API
      (new/add_controller/add_value_string/get_value_string/free)
      round-trip, cgroup_init() defined error path (50016 =
      ECGROUPNOTMOUNTED-on-OHOS semantics), package linkage via CMakeDeps.
