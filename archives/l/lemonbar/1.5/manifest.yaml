# 版本级 manifest — lemonbar 1.5
# 文件位置: archives/l/lemonbar/1.5/manifest.yaml

# 版本号
version: "1.5"

# Conan 引用
conan_ref: "lemonbar/1.5"

# 软件名
software: "lemonbar"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "makefile"

# 源码信息
source:
  # 源码下载 URL（官方源 R39：LemonBoy/bar tag 归档）
  url: "https://github.com/LemonBoy/bar/archive/refs/tags/v1.5.tar.gz"

  # 源码校验和
  sha256: "bc8defe0ce6e4c1b16fd6ba3080a08e4502d6cf9d09440186044eae6b2d7460d"

  # 压缩格式
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（make 命令行变量，非 configure 开关）
  configure_options:
    - "VERSION=1.5（命令行赋值覆盖 Makefile 的 git-describe 回退值 1.4）"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libxcb/1.17.0.1"
    - "libxau/1.0.12"
    - "libxdmcp/1.1.5"

  # 编译器
  cc: clang
  cxx: clang++

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "tag 归档内无 .git：Makefile 形如 `GIT_DESC=$(shell test -d .git && git describe --always)` 的条件赋值必然失配，VERSION 静默退回硬编码默认值——本包 v1.5 的产物会自报 1.4（上游从未随 tag 上调该常量）"
  - "向 Makefile 工程注入编译/链接参数必须走环境变量：命令行 `make CFLAGS=...` 会覆盖 Makefile 里 `CFLAGS += ` 的上游默认值（-Wall -std=c99 -Os -DVERSION -D_GNU_SOURCE 全部丢失），环境变量才会被 `+=` 追加"
  - "上游 .github/workflows/check.yml 正是 `CFLAGS='-DWITH_XINERAMA=1' make` 这种命令行写法，因此那条流水线里 -DVERSION 同样被吞掉，VERSION 变成未定义标识符——上游自己也没意识到"
  - "Makefile 无条件链接 -lxcb-xinerama、README 也宣称支持 Xinerama，但整个仓库从不在 Makefile 中定义 WITH_XINERAMA：`make` 的默认产物里 xinerama 代码路径与 randr<1.5 的回退分支都被编译掉，那条链接是无用依赖；要启用只能由打包方从命令行传 -DWITH_XINERAMA=1（上游 CI 的做法）。本包保持默认以与上游 `make` 产物一致"
  - "lemonbar 的 main() 把 xconn() 放在 getopt() 之前，xconn() 在 xcb_connect() 失败时直接 exit(EXIT_FAILURE)：`-h`/版本输出在无 X server 的环境里不可达，CI 上唯一可观测的行为就是这条失败路径"
  - "该失败路径本身是有用的链接完整性探针：能打印 Couldn't connect to X 就说明 libxcb + xcb-randr + libXau + libXdmcp 全部经 $ORIGIN rpath 解析成功（否则 OHOS 加载器会先报 cannot open shared object）"
  - "OHOS musl 加载器忽略 LD_LIBRARY_PATH：应用类包的运行期 .so 必须随二进制装入 bin/ 并以 $ORIGIN 为 rpath（-Wl,--disable-new-dtags -Wl,-rpath,'$ORIGIN'），xeyes/myman 同款做法"
