# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: lemonbar/1.5
homepage: "https://github.com/LemonBoy/bar"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "（无）上游 tarball 未提供任何测试目标或测试目标脚本"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "（无）"

# 上游实际运行的测试程序：无
# 审计证据（对 v1.5 tag 归档逐项核对，非推测）：
#   1. 源码归档共 7 个文件：.gitignore / LICENSE / Makefile / README.pod /
#      lemonbar.c / utils.c / utils.h —— 无 test/ 目录，无 *_test.c，
#      无 test*.sh，无任何测试数据文件。
#   2. Makefile 的全部 target：all / doc / debug / clean / install /
#      uninstall / .c.o 后缀规则 / .PHONY —— **没有** check、test、tests
#      或任何运行测试的 target（`make -n check` 无规则可执行）。
#   3. 无 configure.ac/Makefile.am（非 autotools）、无 meson.build、
#      无 CMakeLists.txt、无 ctest/gtest/TAP 依赖。
#   4. .github/workflows/check.yml 是纯构建流水线（apt 装 libxcb-*-dev
#      → make → `./lemonbar -h || exit 0`），末行以 `|| exit 0` 无条件成功，
#      不构成可复现的测试断言。
# 结论：上游测试数 = 0（真实计数，非“未运行/未成功”）。因此本 PR 的通过率
# 口径以 test_package 实测断言为准，不虚报也不隐瞒上游无测试这一事实。
upstream_tests: []

# 宿主环境不兼容用例：无（因为没有上游测试）
host_incompatible_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_lemonbar.sh
    description: |
      对已安装的 lemonbar 二进制做 8 条真实断言。 lemonbar 的 main() 在 getopt()
      之前就调用 xconn()，xconn() 在 xcb_connect() 失败时以 EXIT_FAILURE 退出，
      因此「无 X server 时的失败路径」是 CI 上唯一可达且可观测的行为——而这
      恰好能证明整条动态链接链（libxcb + xcb-randr + xcb-xinerama + libXau +
      libXdmcp）经由打包进 bin/ 的 $ORIGIN rpath 全部解析成功（否则 OHOS 加载器
      会先报 cannot open shared object，根本到不了 xcb_connect）。
      断言：
        1. lemonbar 已安装到 PATH 且可执行
        2. 无 DISPLAY 时退出码为 1（EXIT_FAILURE），而非 127/126 等加载器错误
        3. stderr 出现上游原文 "Couldn't connect to X"
        4. 失败路径不向 stdout 写任何内容
        5. DISPLAY=:99（无人监听）降级行为与无 DISPLAY 一致
        6. -h 同样只得到 X 连接错误 —— 记录「帮助/版本输出在无 X 时不可达」
           这一上游行为（xconn() 先于 getopt()），未来上游若调整顺序可被发现
        7. stderr 无任何动态加载器错误（cannot open shared object /
           library not found / error while loading）——证明依赖链解析成功
        8. 运行期共享库确实随二进制一起安装（$ORIGIN rpath 生效的前提）
    command: "sh test_lemonbar.sh"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 8
