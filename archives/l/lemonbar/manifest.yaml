# 软件级 manifest — lemonbar
software: lemonbar
display: "lemonbar"
description: "基于 xcb 的轻量 X11 状态栏：从 stdin 读取小型标记语言并渲染成一条 X11 dock/面板，支持 UTF-8 与 RandR 多显示器"
category: x11
homepage: "https://github.com/LemonBoy/bar"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游纯 POSIX Makefile（lemonbar.c + utils.c），零补丁即可用 OHOS SDK clang 交叉编译"
    - "X 协议绑定走已发布的 conan 包 libxcb/1.17.0.1（OHOS armv8 binary）；链接核心 xcb 与 xcb-randr / xcb-xinerama 扩展组件"
    - "依赖的 -I/-L 通过环境变量 CFLAGS/LDFLAGS 注入而非 make 命令行变量：Makefile 用的是 `CFLAGS += ` 追加语义，命令行赋值会把上游默认的 -Wall -std=c99 -Os -DVERSION -D_GNU_SOURCE 一起吞掉"
    - "tag 归档没有 .git，Makefile 的 `git describe` 条件赋值静默失配，产物会自报硬编码的 1.4（上游从未随 tag 上调）；构建期以命令行 VERSION=1.5 覆盖修正"
    - "二进制以 $ORIGIN rpath 链接，运行期共享库（libxcb + 扩展 + libXau + libXdmcp）随二进制装入 bin/：OHOS musl 加载器忽略 LD_LIBRARY_PATH 且 CI worker 无系统 libxcb"
    - "上游 Makefile 从不定义 WITH_XINERAMA（README 却宣称支持 Xinerama，且无条件链接 -lxcb-xinerama）；本包保持与上游默认 `make` 一致的编译面，不改动该特性开关"
  common_dependencies:
    - "libxcb/1.17.0.1"
    - "libxau/1.0.11"
    - "libxdmcp/1.1.5"

versions:
  "1.5":
    status: built
    build_date: "2026-09-21"
    conan_ref: "lemonbar/1.5"
