knowledge_gained:
  - "conan's built-in patchng parser applies conandata patches strictly in listed order and does not tolerate line-number drift: a patch touching a file modified by an earlier patch MUST be generated against the tree state with all preceding patches already applied (sequential git apply then git diff), otherwise it fails with 'source file is different' even though hunks are well-formed."
  - "OHOS SDK libc++ (clang 15, -std=c++20) lacks std::jthread/stop_token and the std::ranges algorithm set; clang 15 also does not support P0960 parenthesized aggregate initialization, so aggregate initializers must use braces — which then turns implicit long->pid_t narrowing into a hard error (-Wc++11-narrowing), fixed with static_cast."
  - "kconfig/6.26.0 is published with KCONFIG_USE_QML=OFF: KF6ConfigQml and the KConfigPropertyMap class do not exist. libksysguard's SensorFaceController depends on KConfigPropertyMap, so an in-tree QQmlPropertyMap-based compatibility implementation (faces/KConfigPropertyMapCompat.{h,cpp}) supplies the used API subset: construction from a KConfigLoader, initial population from loader items, updateValue write-back. The controller's connect to valueChanged binds QQmlPropertyMap's (key,value) signal against a single-argument slot, which Qt allows."
  - "The published kconfig/6.26.0 libKF6ConfigGui.so records its libKF6ConfigCore.so dependency as the relative NEEDED path '../../bin/libKF6ConfigCore.so' although Core ships in the same lib/. Loaders resolve NEEDED entries containing a slash against the process CWD; ctest runs each test with the CWD of the registering CMakeLists (build tree autotests/), so the recipe materializes a symlink at <build>/bin/libKF6ConfigCore.so before running ctest. Downstream packagers of any KConfigGui consumer must reproduce this (or fix the kconfig package)."
  - "find_package(Libdrm) in libksysguard's gpu plugin resolves through the kwin FindLibdrm.cmake module bundled with qtbase (lib/cmake/Qt6/3rdparty/kwin/), which defines the upstream Libdrm::Libdrm imported target; pointing CMAKE_PREFIX_PATH at conan's libdrm package is sufficient, no CMakeDeps/target renaming needed."
  - "libksysguard's processcore target sets OUTPUT_NAME processcore (lowercase): the package ships libprocesscore.so while the other four libraries are libKSysGuard{Formatter,SystemStats,Sensors,SensorFaces}.so; cpp_info.libs must list 'processcore' exactly."
  - "The Qt6 umbrella Qt6Config.cmake only accepts component configs under its own prefix: with qtbase and qtdeclarative published as separate conan packages, find_package(Qt6 COMPONENTS Qml) fails ('Expected Config file at <qtbase>/Qt6Qml/Qt6QmlConfig.cmake does NOT exist'). Consumers must find_package(Qt6Qml) directly against the qtdeclarative package folder."
  - "Upstream CMakeLists.txt:101-102 sets CMAKE_CXX_STANDARD 20 as a normal variable, overriding the conan toolchain cache's CMAKE_CXX_STANDARD 17; the build compiles with -std=c++20 -stdlib=libc++."
