# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lua-stdlib-debug/41.2.1
homepage: "https://github.com/lua-stdlib/lua-stdlib"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: specs/debug_spec.yaml
    source: lua-stdlib-debug-41.2.1/specs/debug_spec.yaml
    description: "Debug module spec tests"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Load std.debug module and verify it returns a table"
    command: "lua -e \"require('std.debug')\""

# 测试断言总数 (近似值)
assertion_count: 5
