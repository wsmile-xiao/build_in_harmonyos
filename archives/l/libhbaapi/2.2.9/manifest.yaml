# 版本级 manifest — archives/l/libhbaapi/2.2.9/manifest.yaml

version: "2.2.9"
software: libhbaapi
status: built
build_date: "2026-09-18"
build_system: autotools
conan_ref: "libhbaapi/2.2.9"

source:
  url: "https://deb.debian.org/debian/pool/main/libh/libhbaapi/libhbaapi_2.2.9.orig.tar.gz"
  sha256: "6f8c3613410f48ea1065410d3a2bc69c4b2ec93a5c15e8764c13ec8fd8d01b36"
  tar_format: tar.gz

build:
  system: autotools
  build_command: "autoreconf --install --force && ./configure --build=aarch64-unknown-linux-gnu --host=aarch64-linux-ohos && make -j1"
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-linux-ohos"
  dependencies: []
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "none (upstream demo hbaapitest, not wired into the Makefile)"
  upstream_discovered: 1
  upstream_passed: 0
  upstream_failed: 0
  upstream_note: "demo exits 1 by design: /etc/hba.conf is read-only on OHOS and no FC adapter exists; it printed 'HBA API Library version is 2'"
  test_package_passed: 6
  test_package_failed: 0
  test_package_assertions: 6
  execution: "conan create rc=0；上游 demo 执行留证 + 消费者断言 6 项"

test_passed: 6
test_failed: 0

patches_applied:
  - "0001-configure-ac-drop-Werror.patch（configure.ac 的 automake -Werror）"
  - "（程序化）autoreconf 生成的 configure 中 umask 077 → 022（E011）"

knowledge_gained:
  - "只带 autotools 源码（无 configure/Makefile.in/aclocal.m4）的老工程需先 autoreconf --install；autoconf/automake/libtool 从环境取（把它们作为 tool_requires 会连带 Conan perl，其 XS 模块与跑 autoreconf 的 perl 冲突：Cwd.so 无法 relocate）"
  - "autoreconf 生成的 configure 同样含 umask 077 + mktemp（E011）：HMDFS setgid 下 config.status 报 'could not setup config files machinery' → 在 autoreconf 后程序化放宽为 022（icoutils 先例）"
  - "configure 仍会因 config.guess 在 HMDFS 上失败（E007）→ 显式传 --build/--host"
  - "上游 configure.ac 钉死 -Wall -Werror，现代 autoconf 的 AC_PROG_LIBTOOL 弃用告警会被当错误 → 打补丁只保留 -Wall"
  - "上游 hbaapi.h 使用 struct tm 但未 include <time.h>：消费者必须先包含 <time.h>（否则 'field has incomplete type struct tm'）"
  - "上游 demo hbaapitest 在无 /etc/hba.conf（硬编码路径、OHOS 只读）与无 FC 适配器时按设计 exit 1；执行并留证（其中 'HBA API Library version is 2' 证明库可用）"
