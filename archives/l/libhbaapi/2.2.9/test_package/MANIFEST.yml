# test_package/MANIFEST.yml
# libhbaapi 2.2.9.
#
# Upstream ships no test suite.  The tarball contains the SNIA sample
# application hbaapitest.c and a sample vendor library hbasample.c; neither is
# built by the Makefile.  The recipe compiles hbaapitest against the built
# library and runs it on the device as upstream evidence (its main() returns
# void, so it exits 0 and reports zero adapters when no vendor library is
# configured).  Consumer coverage is provided by a CMake program over the
# installed package.

package: libhbaapi/2.2.9
homepage: https://github.com/open-fcoe/libhbaapi

upstream_tests_exist: true
upstream_test_audit: "no tests/ directory and no check target; hbaapitest.c is the SNIA sample application (demo, main returns void) and is not built by Makefile.am"
upstream_check_command: "n/a (no make check)"
upstream_test_in_build: true
upstream_test_command: "<cc> -I<src> -o hbaapitest hbaapitest.c -L<build>/.libs -lHBAAPI -ldl && hbaapitest"

upstream_tests:
  - name: hbaapitest
    command: "hbaapitest"
    expected: "pass (exit 0; reports the API version and zero adapters without a vendor library)"

test_package_tests:
  - file: test_hbaapi.c
    description: "HBA_GetVersion matches HBA_LIBVERSION, HBA_LoadLibrary/HBA_FreeLibrary lifecycle, zero adapters without a vendor library, adapter 0 lookup rejected, refresh keeps the count"
    command: "./libhbaapi_consumer"

test_files:
  - path: "test_package/test_hbaapi.c"
    test_type: "R34"
    assertion_count: 6

test_package_test_count: 1
consumer_assertion_count: 6
assertion_count: 6
