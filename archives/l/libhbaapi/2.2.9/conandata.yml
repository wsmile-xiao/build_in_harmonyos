patches:
  - patch_file: "patches/0001-configure-ac-drop-Werror.patch"
    patch_description: "The 2011 configure.ac enables automake -Werror, which turns deprecation warnings from modern autoconf/automake (AC_PROG_LIBTOOL, AM_RUN_LOG quotes) into hard errors during autoreconf -fi. Keep -Wall, drop -Werror."
    patch_type: "portability"
