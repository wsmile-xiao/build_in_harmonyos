# 软件级 manifest — archives/l/libhbaapi/manifest.yaml

software: libhbaapi
display: "libhbaapi"
description: "SNIA HBA API 通用封装库（运行时转发到厂商库）"
category: library
homepage: "https://github.com/open-fcoe/libhbaapi"
license: SNIA-Public-License-1.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游无生成的 configure：build() 先 autoreconf --install --force"
    - "autoconf/automake/libtool 不作为 tool_requires（Conan perl 的 XS 模块与 autoreconf 解释器冲突，Cwd.so 无法 relocate）"
    - "补丁去掉 configure.ac 的 automake -Werror（AC_PROG_LIBTOOL 弃用告警）"
    - "E011：autoreconf 生成的 configure 里 umask 077 在 HMDFS 下不可写 → 程序化放宽为 022（icoutils 先例）"
    - "E007：显式 --build/--host 避开 config.guess"
    - "上游 hbaapi.h 未包含 <time.h>（消费者需先包含）；运行期 /etc/hba.conf 硬编码只读路径"
    - "上游 demo hbaapitest 执行留证：打印 HBA API Library version is 2，随后因只读 /etc/hba.conf 与零适配器按设计 exit 1"
  common_dependencies: []

versions:
  "2.2.9":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libhbaapi/2.2.9"
