sources:
  "1.2.0.0":
    url: "https://gitee.com/openkylin/libkylin-ai-system-private/repository/archive/debian%2F1.2.0.0.tar.gz"
    sha256: "695d1fa8c572d549cea27eb1e48929c220ba74528141ec49ff3e50be48976513"

patches:
  "1.2.0.0":
    - patch_file: "patches/0001-ai-proto-install-prefix.patch"
      description: "ai-proto 顶层 CMakeLists：install(DIRECTORY protocols/usr/ DESTINATION /usr) 绝对路径写 /usr 越权，改为 DESTINATION ${CMAKE_INSTALL_PREFIX}"
    - patch_file: "patches/0002-gdbus-functions-paths.patch"
      description: "KylinAiProtoFunctions.cmake：硬编码 /usr/bin/gdbus-codegen 与 /usr/share/kylin-ai/protocols/gdbus/ 改为 ${KYLAI_GDBUS_CODEGEN} / ${KYLAI_GDBUS_PROTOCOL_DIR} 变量"
    - patch_file: "patches/0003-grpc-generate-paths.patch"
      description: "KylinAiProtoGenerate.cmake：硬编码 /usr/share/kylin-ai/protocols/grpc/ 改为 ${KYLAI_GRPC_PROTOCOL_DIR} 变量"
