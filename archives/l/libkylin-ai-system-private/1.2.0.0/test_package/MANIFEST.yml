# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源: 无（上游仓库无 tests/ 目录，仅 header-only 接口 + 协议定义）
# 上游 debian/1.2.0.0 tag 无任何测试程序/测试框架，如实声明 0。

package: libkylin-ai-system-private/1.2.0.0
homepage: "https://gitee.com/openkylin/libkylin-ai-system-private"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# OHOS CI app-uid 限制说明：test() 的 python3 经 AppSpawn 以 app uid 运行
# （如 20020101），构建树属主是构建 uid（如 20001006）；HMDFS 按目录继承
# 属主并裁剪 other 权限位（755→750），跨 app 代码映射（execve/mmap
# PROT_EXEC）被拒，无法运行 build() 编译出的 test_ai_engine 二进制（与
# libkysdk-coreai-speech 探针 dlopen EACCES 同根因）；普通 read() 跨 app 可过。
# 因此：1) build()（构建 uid）编译链接 test_ai_engine，验证 header-only API
# 可真实 include 并链接（R34 消费者冒烟在构建阶段完成）；2) test() 用 python
# 读校验（跨 app 可读）：头文件关键 API 声明 + 编译产物存在 + 协议文件存在。
test_package_tests:
  - file: test_ai_engine.cpp
    description: "消费者冒烟测试源码：include <kylin-ai/ai-engine/aiengine.h> 派生 AbstractAiEngine 并断言 API 行为（C++17 编译 + 链接 KylinAiEngine::KylinAiEngine）；由 build() 在构建 uid 下编译链接验证"
    command: "cmake --build（build() 编译 test_ai_engine，链接成功即通过）"
  - file: test_kylin_ai_system_private.py
    description: "读校验（app uid 下跨 app 可读）：头文件关键 API 声明（AbstractAiEngine/engineName/AiEngineBaseResult）+ 编译产物存在（test_ai_engine / test_proto_gen，后者为宏生成 glue 链路产物）+ 协议文件存在（gdbus XML + grpc proto）"
    command: "python3 test_kylin_ai_system_private.py <package_folder> <test_build_folder>"
  - file: conanfile.py
    description: "test() 直接 self.run(python3 读校验脚本)（L0d 要求）；build() 编译 test_ai_engine + test_proto_gen 并经 cmake.test() 执行 ctest"
  - file: test_proto_gen.cpp
    description: "消费者编译测试（审查 P2）：实际调用 kylin_ai_generate_gdbus_proto_code 宏生成 glue 并链接，验证 KYLAI_GDBUS_CODEGEN/KYLAI_GDBUS_PROTOCOL_DIR 变量注入与 gdbus-codegen 依赖真实生效"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 0 可运行（无测试）；新增消费者冒烟 2 入口（4 个头文件 API 断言 + 2 编译产物 + 2 个协议文件检查）
assertion_count: 8
