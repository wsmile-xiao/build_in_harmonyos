# test_package/MANIFEST.yml
# libextractor 1.17 upstream + consumer test declaration
# CI build_and_test.sh L0e requires this file.

package: libextractor/1.17
homepage: "https://www.gnu.org/software/libextractor/"

# Upstream test command (src/main Makefile.am: check_PROGRAMS + TESTS)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream total per official counting unit: every TESTS entry automake
# registers for this OHOS configuration (src/main/Makefile.am 7 tests +
# src/plugins/Makefile.am check_PROGRAMS enabled subset incl. zlib/bz2
# gated ones; optionals needing absent third-party libs or a C++ compiler
# are compiled out by configure and never registered, like tests behind a
# CMake OFF option). Preflight 2026-09-20 make-check evidence: 52/52 pass.
upstream_test_total: 52
upstream_test_count_method: autotools_tests

# Upstream tests actually executed in conanfile.py build(): the 7 named
# src/main tests below plus the src/plugins suite (45 tests, same
# `make check`: 52 total minus src/main 7, per preflight marker).
upstream_tests:
  - file: src/main/test_trivial
    source: libextractor-1.17/src/main/test_trivial.c
    description: "Plugin defaults loading (3x add_defaults/remove_all)"
    command: "./test_trivial"
  - file: src/main/test_plugin_loading
    source: libextractor-1.17/src/main/test_plugin_loading.c
    description: "Dynamic plugin load/unload (add/remove test plugin)"
    command: "./test_plugin_loading"
  - file: src/main/test_plugin_load_multi
    source: libextractor-1.17/src/main/test_plugin_load_multi.c
    description: "Multi plugin load sequence"
    command: "./test_plugin_load_multi"
  - file: src/main/test_ipc
    source: libextractor-1.17/src/main/test_ipc.c
    description: "Extractor IPC via test/test2 plugins (Hello/Goodbye)"
    command: "./test_ipc"
  - file: src/main/test_file
    source: libextractor-1.17/src/main/test_file.c
    description: "File-IO extraction path via test plugin"
    command: "./test_file"
  - file: src/main/test_gzip
    source: libextractor-1.17/src/main/test_gzip.c
    description: "Gzip container extraction (requires zlib)"
    command: "./test_gzip"
  - file: src/main/test_bzip2
    source: libextractor-1.17/src/main/test_bzip2.c
    description: "Bzip2 container extraction (requires bzip2)"
    command: "./test_bzip2"

# Consumer tests shipped in test_package/
test_package_tests:
  - file: test.c
    description: "Consumer checks: plugin defaults, metatype strings, version macro, extract config (4 assertions)"
    command: "./test_libextractor"

# 52 upstream (7 src/main + 45 src/plugins, preflight 2026-09-20
# make-check evidence) + 4 consumer assertions in test.c.
assertion_count: 56
