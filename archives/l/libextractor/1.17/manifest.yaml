# 版本级 manifest
# 文件位置: archives/l/libextractor/1.17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.17"
software: "libextractor"
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/libextractor/libextractor-1.17.tar.gz"
  sha256: "215c7d8dc10e0d7644509da2b47a6fa1ba5ebad8ce02904864e54abfb4c3059a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-dependency-tracking"
    - "--disable-nls"
    - "--disable-glib"
    - "--without-ffmpeg"
    - "--enable-shared"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - zlib/1.3.1
    - bzip2/1.0.8
    - libtool/2.5.4.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libextractor 上游测试为 src/main 共 7 项（test_trivial/plugin_loading/load_multi/ipc/file/gzip/bzip2），zlib+bzip2 为 required 依赖时全部启用"
  - "NLS 与 glib 显式关闭，避免 OHOS 缺 gettext/glib 时的不确定探测；其余可选插件依赖缺失时 configure 自动降级"
  - "插件为 libtool 可加载模块，默认 shared=True，否则 test_plugin_loading 类用例无法加载 .so 插件"
