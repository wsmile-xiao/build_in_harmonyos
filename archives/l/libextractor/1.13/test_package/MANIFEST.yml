    command: "./test_deb"
  - file: src/plugins/test_ole2.c
    source: libextractor-1.13/src/plugins/test_ole2.c
    description: "OLE2 复合文档（上游 TEST_GSF=test_ole2，libgsf/1.14.58.1 解锁，本轮 PASS）"
    command: "./test_ole2"
  - file: src/plugins/test_ogg.c
    source: libextractor-1.13/src/plugins/test_ogg.c
    description: "Ogg 容器（TEST_OGG，libvorbis/1.3.7 + libogg/1.3.6.2 解锁，本轮 PASS）"
    command: "./test_ogg"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 编译链接 libextractor，调用 EXTRACTOR_plugin_add_defaults/EXTRACTOR_plugin_add/EXTRACTOR_extract 从内嵌 man page 提取 title、修改日期与手册标题，按结果决定退出码（9 处 FAIL 判定分支，两种插件执行策略各跑一遍）"
    command: "./test_libextractor"

# 测试断言总数 (消费者测试内的断言数)
assertion_count: 9
