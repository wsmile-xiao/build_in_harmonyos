# test_package/MANIFEST.yml
# 上游官方测试声明文件（libextractor 1.13 / GNU autotools）
#
# 上游测试注册入口：
#   src/main/Makefile.am     TESTS = $(check_PROGRAMS)
#                            = test_trivial test_plugin_loading test_plugin_load_multi
#                              test_ipc test_file $(TEST_ZLIB) $(TEST_BZIP2)      -> 5 + 2 条件
#   src/plugins/Makefile.am  TESTS = $(fuzz_tests) $(check_PROGRAMS)
#                            = 16 无条件 test_* + 16 条件 $(TEST_XXX) 项
#                              + fuzz_default.sh（仅 HAVE_ZZUF 时注册）           -> 32 + 1 条件
# 静态全量（条件项全部成立）= 7 + 32 + 1 = 40；本次构建实际注册并可执行 = 30
# （src/main 7 + src/plugins 23，PASS 名单原文 reports/w3-local-ci.log:1166-1172 与
#  :1317-1347），其余 10 项因上游 HAVE_* 探测未过而未构建（逐项 configure 原因见
# notes.md 五维账本第 ①–④ 类与 PR 正文"未执行测试"章节）：
#   行为类 rpm flac ／ 缺陷类 exiv2 ／ 待查类 gstreamer
#   依赖类 test_thumbnailgtk(gtk,卡 HAVE_MAGIC) test_mime(卡 HAVE_MAGIC)
#          test_html(卡 HAVE_TIDY) test_midi(无 libsmf) test_mpeg(无 libmpeg2)
#          + fuzz_default.sh(卡 HAVE_ZZUF,无 zzuf)

package: libextractor/1.13
homepage: "https://www.libextractor.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C src check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C src check -j2 SHELL=/bin/sh"

# 上游实际运行的测试程序（src/main 7 项）
upstream_tests:
  - file: src/main/test_trivial.c
    source: libextractor-1.13/src/main/test_trivial.c
    description: "库句柄与插件表最小可用性自检"
    command: "./test_trivial"
  - file: src/main/test_plugin_loading.c
    source: libextractor-1.13/src/main/test_plugin_loading.c
    description: "单个插件 dlopen 加载与卸载"
    command: "./test_plugin_loading"
  - file: src/main/test_plugin_load_multi.c
    source: libextractor-1.13/src/main/test_plugin_load_multi.c
    description: "多插件链式加载"
    command: "./test_plugin_load_multi"
  - file: src/main/test_ipc.c
    source: libextractor-1.13/src/main/test_ipc.c
    description: "out-of-process 插件子进程 IPC 通道"
    command: "./test_ipc"
  - file: src/main/test_file.c
    source: libextractor-1.13/src/main/test_file.c
    description: "按文件名提取（file 插件）"
    command: "./test_file"
  - file: src/main/test_gzip.c
    source: libextractor-1.13/src/main/test_gzip.c
    description: "zlib 可用时解压透传提取（HAVE_ZLIB）"
    command: "./test_gzip"
  - file: src/main/test_bzip2.c
    source: libextractor-1.13/src/main/test_bzip2.c
    description: "bzip2 可用时解压透传提取（HAVE_BZ2）"
    command: "./test_bzip2"

# 上游实际运行的测试程序（src/plugins 23 项）
  - file: src/plugins/test_dvi.c
    source: libextractor-1.13/src/plugins/test_dvi.c
