software: libxinerama
version: "1.1.5"
description: "X11 Xinerama extension client library"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxinerama"
license: MIT
build_system: autotools

dependencies:
  - libx11/6.4.0
  - libxext/6.4.0
  - xorgproto/2025.1

adaptation_path: path-a
knowledge_base: E340,E341

validation:
  test_type: installed-package
  test_cases: 2
  test_assertions: 11
  notes: |
    libXinerama 1.1.5 采用 cmd-pkgs 同轨依赖（libx11/6.4.0 + libxext/6.4.0 +
    xorgproto/2025.1），复用 CI 已验证的 OHOS autotools 工具链模式。
    configure 的 xextproto/xineramaproto 为头文件级依赖（xorgproto 提供），
    链接依赖仅 -lX11 -lXext。soname 1:0:0 → libXinerama.so.1.0.0。
    knowledge_gained:
      - X11 家族客户端库头文件级依赖用 transitive_headers 消费（知识 E340，与跨轨桩方案 E338 互补）
      - 无 X server 的消费者测试：强类型活重定位 + ABI 布局固定（知识 E341）
