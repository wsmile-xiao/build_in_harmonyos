software: libtiff
version: "4.7.0"
status: built
build_date: "2026-09-05"
build_system: cmake

source:
  url: "https://download.osgeo.org/libtiff/tiff-4.7.0.tar.gz"
  sha256: "67160e3457365ab96c5b3286a0903aa6e78bdc44c4bc737d2e486bcecb6ba976"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "OHOS_ARCH=arm64-v8a"
    - "CMAKE_INSTALL_LIBDIR=lib"
    - "BUILD_SHARED_LIBS=ON"
    - "zlib=ON"
    - "libdeflate=ON"
    - "jpeg=ON"
    - "zstd=ON"
    - "webp=ON"
    - "lerc=ON"
    - "jbig=ON"
    - "lzma=ON"
    - "tiff-tools=OFF"
    - "tiff-tests=OFF"
    - "tiff-docs=OFF"
    - "tiff-contrib=OFF"
    - "tiff-opengl=OFF"
    - "cxx=OFF"

dependencies:
  - "zlib/1.3.1.1"
  - "libdeflate/1.25"
  - "libjpeg-turbo/3.2.0"
  - "zstd/1.5.7"
  - "libwebp/1.6.0"
  - "lerc/4.1.1"
  - "jbigkit/2.1"
  - "xz/5.6.2"

products:
  libs:
    - libtiff.so.6.1.0
    - libtiff.so.6
    - libtiff.so
  tools: []

knowledge_gained:
  - "libtiff 4.7.0 CMake 构建选项与 4.7.2 几乎一致，但 C++ 库开关名是 cxx（4.7.2 才改名 tiff-cxx）"
  - "照搬 4.7.2 配方的 -Dtiff-cxx=OFF 在 4.7.0 静默失效 → libtiffxx.so 被误构建，须用 -Dcxx=OFF"
  - "os=OHOS 下 conan CMakeToolchain 映射的 CMAKE_SYSTEM_NAME cmake 不认（ML-0035）：自发现 ohos.toolchain.cmake + 裸 cmake 绕开"
  - "交叉链 FIND_ROOT_PATH_MODE=ONLY 覆盖命令行 -D 路径 → 预设 FindXxx 模块的 find 缓存变量（ZLIB_INCLUDE_DIR 等 8 组）绕过搜索"
  - "本机 LD_LIBRARY_PATH 第三段带前导空格 → /system/lib64 段失效 → lerc 的 libc++_shared.so 解析失败；test_package generate() 显式 prepend /system/lib64"
  - "WEBP 编解码要求 3(RGB)/4(RGBA) 波段；roundtrip 像素比对须 TIFFTAG_WEBP_LOSSLESS=1（默认有损 q=75）"
  - "ohos.toolchain 64 位默认 CMAKE_INSTALL_LIBDIR=lib64，须显式改回 lib"
  - ".so 产物需 llvm-objcopy 剥旧 .codesign + binary-sign-tool -selfSign 1 重签"
