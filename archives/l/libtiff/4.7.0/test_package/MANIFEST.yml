# test_package/MANIFEST.yml
# 上游官方测试声明文件（libtiff 4.7.0）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libtiff/4.7.0
homepage: "https://libtiff.gitlab.io/libtiff/"

# 上游测试命令（C 测试程序子集已在 conanfile build() 内实跑：17/17 PASSED）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake -B build-ohos-tests -S . -Dtiff-tests=ON ... && ctest --output-on-failure"

# 上游实际运行的测试程序（实测 17/17 PASSED，2026-09-05，OHOS aarch64 真机）
upstream_tests:
  - file: test/test_signed_tags.c
    source: libtiff-4.7.0/test/test_signed_tags.c
    description: "有符号 tag 读写（ctest 实跑 PASSED）"
    command: "./test_signed_tags"
  - file: test/ascii_tag.c
    source: libtiff-4.7.0/test/ascii_tag.c
    description: "ASCII tag 读写（ctest 实跑 PASSED）"
    command: "./ascii_tag"
  - file: test/long_tag.c
    source: libtiff-4.7.0/test/long_tag.c
    description: "LONG tag 读写（ctest 实跑 PASSED）"
    command: "./long_tag"
  - file: test/short_tag.c
    source: libtiff-4.7.0/test/short_tag.c
    description: "SHORT tag 读写（ctest 实跑 PASSED）"
    command: "./short_tag"
  - file: test/strip_rw.c
    source: libtiff-4.7.0/test/strip_rw.c
    description: "条带读写（ctest 实跑 PASSED）"
    command: "./strip_rw"
  - file: test/rewrite_tag.c
    source: libtiff-4.7.0/test/rewrite_tag.c
    description: "tag 重写（ctest 实跑 PASSED）"
    command: "./rewrite"
  - file: test/raw_decode.c
    source: libtiff-4.7.0/test/raw_decode.c
    description: "JPEG 原始数据解码（ctest 实跑 PASSED，JPEG 后端开启）"
