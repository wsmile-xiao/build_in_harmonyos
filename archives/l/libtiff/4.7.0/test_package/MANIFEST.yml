  - file: test/custom_dir.c
    source: libtiff-4.7.0/test/custom_dir.c
    description: "自定义目录（ctest 实跑 PASSED）"
    command: "./custom_dir"
  - file: test/custom_dir_EXIF_231.c
    source: libtiff-4.7.0/test/custom_dir_EXIF_231.c
    description: "EXIF 自定义目录（ctest 实跑 PASSED）"
    command: "./custom_dir_EXIF_231"
  - file: test/defer_strile_loading.c
    source: libtiff-4.7.0/test/defer_strile_loading.c
    description: "延迟条带加载（ctest 实跑 PASSED）"
    command: "./defer_strile_loading"
  - file: test/defer_strile_writing.c
    source: libtiff-4.7.0/test/defer_strile_writing.c
    description: "延迟条带写入（ctest 实跑 PASSED）"
    command: "./defer_strile_writing"
  - file: test/test_directory.c
    source: libtiff-4.7.0/test/test_directory.c
    description: "目录遍历（ctest 实跑 PASSED）"
    command: "./test_directory"
  - file: test/test_IFD_enlargement.c
    source: libtiff-4.7.0/test/test_IFD_enlargement.c
    description: "IFD 扩容（ctest 实跑 PASSED）"
    command: "./test_IFD_enlargement"
  - file: test/testtypes.c
    source: libtiff-4.7.0/test/testtypes.c
    description: "类型检查（ctest 实跑 PASSED）"
    command: "./testtypes"
  - file: test/test_open_options.c
    source: libtiff-4.7.0/test/test_open_options.c
    description: "打开选项（ctest 实跑 PASSED）"
    command: "./test_open_options"
  - file: test/test_append_to_strip.c
    source: libtiff-4.7.0/test/test_append_to_strip.c
