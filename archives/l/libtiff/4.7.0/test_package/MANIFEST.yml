  - file: test/test_ifd_loop_detection.c
    source: libtiff-4.7.0/test/test_ifd_loop_detection.c
    description: "IFD 循环检测（ctest 实跑 PASSED）"
    command: "./test_ifd_loop_detection"

# test_package 中自带的测试（消费者视角验证：每编解码器写读回环断言）
test_package_tests:
  - file: test.c
    description: "8 编解码器写读回环（NONE/PACKBITS/DEFLATE/ADOBE_DEFLATE/LZMA/ZSTD/LERC/WEBP）+ tag 校验 + 像素比对"
    command: "./test_libtiff"

# 测试断言总数（近似值）：上游 17 程序 + 8 codecs × (写成功 + 读成功 + tag 校验 + 像素比对) ≈ 45+
assertion_count: 45
