software: libtut
version: 0.0.20070706
tests:
  - test: test_libtut
    assertion_count: 10
    description: "框架语义验证（驱动断言口径）：tut::reporter 运行整套件并正确标记 1 个故意失败；自定义 callback 精确核对跨 TU 两组的 ok/fail/ex 计数；<tut/tut.hpp> 与根壳 <tut.h> 两种包含路径；覆盖 ensure/ensure_not/ensure_equals/ensure_distance/fail/tut::failure 异常层级"
  - test: test_consumer
    assertion_count: 22
    description: "消费者用例：用 TUT 驱动真实业务模块——定容环形缓冲 + 滑动均值（6 个 TUT 用例内含 14 个 ensure 级断言：FIFO 覆盖、size 封顶、滑动均值、空访问 out_of_range、零容量 invalid_argument、join/clear）+ 8 项驱动断言（reporter all_ok、两组注册与精确计数），全绿退出码 0"
  - test: test_ohos
    assertion_count: 12
    description: "鸿蒙特有测试（OHOS 工具链 #ifdef __OHOS__ 编译守护）：3 个 TUT 用例 5 个 ensure 级断言——__OHOS__ 宏契约、uname machine 与编译期 __aarch64__ 一致、musl sysconf（NPROCESSORS_CONF/PAGESIZE）、HarmonyOS 内核 utsname（sysname=='HarmonyOS'）；+7 项驱动断言——OHOS 上组注册且 3/3 ok、tut_restartable.hpp journal.tut/log.tut 在 OHOS 文件系统持久化与重放（两轮 3/3）；非 OHOS 宿主断言组被正确编译排除（0 组）"
