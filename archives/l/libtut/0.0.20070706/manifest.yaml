  target: aarch64-unknown-linux-ohos
  configure_options: []
  cflags: ""
  env:
    CXX: clang++

patches_applied: []

compatibility:
  level: high
  issues: []
  notes: |
    - header-only 库（tut/tut.hpp + tut_reporter.hpp + tut_restartable.hpp，
      根目录另带 3 个向后兼容 .h 壳文件），零外部依赖
    - C++98 时代代码，仅用 std 核心组件（iostream/map/vector/string/
      sstream/typeinfo）；无 register/auto_ptr/绑定器等过时构造，
      唯一旧式语法是 throw() 动态异常规范（C++17 前合法，
      clang/gcc 仅 -Wdeprecated 提示，MSVC 194 接受）
    - SEH 相关代码在 TUT_USE_SEH 宏之后，仅 Windows 显式开启才编译，
      OHOS/Linux 不受影响
    - 安装布局镜像 Debian libtut-dev：include/tut/*.hpp + 根级
      tut.h/tut_reporter.h/tut_restartable.h 壳
    - 上游站 tut.dozen.ru / sourceforge 项目已消亡，Debian pool 为
      该版本 tarball 的权威分发点（md5 与 packages.debian.org 一致）

test_results:
  type: upstream-suite-on-device
  passed: 63
  failed: 0
  note: "真机（10.62.178.77，OHOS 6.0 / clang-15 / armv8 / libc++）conan create 通过 + test_libtut 10/10 + test_consumer 22 断言 + test_ohos 鸿蒙特有 12 断言（3 用例 + restartable journal 两轮重放）全过（gnu17）；上游 selftest 63/63 全绿，须以 -std=gnu++98 编译（见 knowledge_gained 析构函数条目）；非 OHOS 宿主（MSVC 194）test_ohos 走编译排除路径（0 组）全过"

knowledge_gained:
  - "libtut = TUT (Template Unit Tests)，纯头文件 C++ 单元测试框架，package_type=header-library，无任何依赖"
  - "2007 年代码但可移植性极好：MSVC 194 与 OHOS clang 15（gnu17/libc++）均直接编译，无需 patch"
  - "TUT 核心架构是跨编译单元测试组自注册：每个组在自己 TU 里 static 实例化 test_group<Data> 并注册进 main TU 定义的 tut::runner 单例（test_runner_singleton）"
  - "2007 版 ensure_distance(msg,actual,expected,distance) 区间为开区间：expected-distance >= actual 或 expected+distance <= actual 即失败，actual 必须严格落在 (expected-distance, expected+distance) 内；后期 TUT 版本改为闭区间，消费者迁移时注意"
  - "上游 selftest 必须用 -std=gnu++98 编译：teardown_ex 组故意从析构函数抛异常，C++11 起析构函数隐式 noexcept，gnu17 下 libc++abi 直接 terminate（Signal 6）；这是标准语义变更而非库缺陷，交付头文件在现代标准下正常（test_package gnu17 10/10 证明）"
  - "上游源 tarball 内无 LICENSE 文件，许可证文本在 Debian 打包的 debian/copyright（BSD-2-Clause，两条款）"
  - "selftest 的 include 根是源码根目录（-I$src）：测试文件用 <tut/tut.hpp> 角括号形式，不是 -I src/tut；实测注册用例 63 个（静态数 object::test 特化会高估）"

references:
  - https://packages.debian.org/sid/source/libtut
  - https://sourceforge.net/projects/tut-framework/
