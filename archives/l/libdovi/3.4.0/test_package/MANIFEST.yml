# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libdovi/3.4.0
homepage: "https://github.com/quietvoid/dovi_tool/tree/main/dolby_vision"

# 上游测试命令 (Rust cargo test, 在 dolby_vision/ 子目录执行)
upstream_check_command: "cargo test --release --locked --all-features"
upstream_test_in_build: true
upstream_test_command: "cargo test --release --locked --all-features"

# dolby_vision 3.4.0 上游测试: Rust 单元测试散布在 src/ 各模块
# (rpu/, st2094_10/, xml/, av1/, c_structs/, utils.rs)。
# 确切用例数由真机 `cargo test` 输出的 "test result:" 行解析，
# 以 HMBS_UPSTREAM_TEST_RESULT 标记为准。
upstream_tests:
  - file: src/rpu/mod.rs
    source: dovi_tool-libdovi-3.4.0/dolby_vision/src/rpu
    description: "RPU 解析/编码/转换单元测试 (cargo test)"
    command: "cargo test --release --locked --all-features"
  - file: src/st2094_10/mod.rs
    source: dovi_tool-libdovi-3.4.0/dolby_vision/src/st2094_10
    description: "ST2094-10 元数据单元测试 (cargo test)"
    command: "cargo test --release --locked --all-features"
  - file: src/xml/mod.rs
    source: dovi_tool-libdovi-3.4.0/dolby_vision/src/xml
    description: "Dolby Vision XML 解析单元测试 (cargo test, xml 特性)"
    command: "cargo test --release --locked --all-features"
  - file: src/av1/mod.rs
    source: dovi_tool-libdovi-3.4.0/dolby_vision/src/av1
    description: "AV1 OBU 元数据单元测试 (cargo test)"
    command: "cargo test --release --locked --all-features"

# test_package 中自带的测试 (消费者视角验证, R34: 真实调用 libdovi C-API)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 dovi_parse_rpu/dovi_write_rpu/dovi_convert_rpu_with_mode 等 C-API（5 项 CHECK-OK 断言）"
    command: "./test_libdovi"

# 测试断言总数 (test_package 5 + 上游 cargo test 以真机实测为准)
assertion_count: 5
