# Used only when the OHOS runner image does not provide cargo/rustc.
# Reuses the Harmonybrew bottles proven by herdr/0.8.2 on the same runner.
rust_toolchain:
  - name: rust
    url: "https://harmonybrew.atomgit.com/bottles/rust-1.98.1.arm64_ohos.bottle.tar.gz"
    sha256: "6ce5959eab2c3f9d9ff4ef246fb69c3c54b6dfe7ded52f5d56ead5306464ac3b"
  - name: openssl3
    url: "https://harmonybrew.atomgit.com/bottles/openssl%403-3.6.4.arm64_ohos.bottle.tar.gz"
    sha256: "e1be73c6c68e29c33ff43761045e43e23e7c369f0fb1a24f40e226ec5cb28f98"
  - name: zlib
    url: "https://harmonybrew.atomgit.com/bottles/zlib-ng-compat-2.3.3_1.arm64_ohos.bottle.tar.gz"
    sha256: "1c17a31f8104701bce6b471af8dbbd14bb67d16a504eec087018feb05493a430"
    optional: true
  - name: ca-certificates
    url: "https://harmonybrew.atomgit.com/bottles/ca-certificates-2026-08-13_1.arm64_ohos.bottle.tar.gz"
    sha256: "18f92236b0a9ff908958345b93ac31dfac7ec8e6870525d319d90b3fb96efee3"
    optional: true

# Prebuilt cargo-c (musl static) to avoid `cargo install cargo-c` source
# compile on the true machine (SSH drop during Compiling gix-filter).
# Official upstream binaries from lu-zero/cargo-c GitHub releases.
cargo_c:
  version: "0.10.0"
  aarch64:
    url: "https://github.com/lu-zero/cargo-c/releases/download/v0.10.0/cargo-c-aarch64-unknown-linux-musl.tar.gz"
    sha256: "de43e750d09eb91694e23c8dd70c9f060ac9dbee835a33607331e3c468546dda"
  x86_64:
    url: "https://github.com/lu-zero/cargo-c/releases/download/v0.10.0/cargo-c-x86_64-unknown-linux-musl.tar.gz"
    sha256: "ee95a24bd62b94de6b0ab073e3a504a58030a14e6d0386446dc7370cb7056f9e"
