software: libdovi
version: '3.4.0'
status: built
build_date: '2026-09-18'
build_system: custom

source:
  url: 'https://github.com/quietvoid/dovi_tool/archive/refs/tags/libdovi-3.4.0.tar.gz'
  sha256: '8eac4d1c3134f53e8eb216db6450307a737425844113e480d1e9713c142a9fa2'
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - 'cargo cbuild --release --locked --all-features --library-type=staticlib --prefix=/'
    - 'cargo cinstall --release --locked --all-features --prefix=/ --destdir=<package_folder>'
    - 'cargo test --release --locked --all-features'
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - 'libdovi 是 Rust crate dolby_vision 的 C-API 形态，必须用 cargo-c 构建；真机缺 cargo-c 时用 cargo install cargo-c --locked 自动补齐'
  - '源码归档根目录含 dolby_vision/ 与 assets/，构建与测试必须在 dolby_vision/ 子目录执行'
  - 'cargo-c 产物：include/libdovi/rpu_parser.h、lib/libdovi.a(.so)、lib/pkgconfig/dovi.pc，cpp_info.libs 为 dovi'
  - 'OHOS Rust target 为 aarch64-unknown-linux-ohos，linker 取 Conan tools.build:compiler_executables 的 clang'
