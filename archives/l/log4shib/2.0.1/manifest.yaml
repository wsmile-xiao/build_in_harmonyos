software: log4shib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://shibboleth.net/downloads/log4shib/2.0.1/log4shib-2.0.1.tar.gz"

  # 源码校验和
  sha256: "aad37f3929bd3d4c16f09831ff109c20ae8c7cb8b577917e3becb12f873f26df"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

build_system: autotools

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: autotools项目的config.guess/config.sub需替换为支持HarmonyOS的新版本(automake-1.16), 输出三元组aarch64-unknown-linux-ohos"
  - "HMDFS文件系统限制: umask 077时mktemp -d创建的临时目录权限为drwx--S---, 即使owner也不能写入; 解决: 将configure中umask 077改为umask 007"
  - "log4shib是纯库软件(无bin/可执行文件), 安全弹窗验证(R7)不适用"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/log4shib-2.0.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/log4shib-2.0.1.work
  source_orig_hash: 88663ff586f2b4ad
  source_work_hash: dffb115b8549a8c5
  generated_at: '2026-06-11T14:29:36'
  patches_count: 3

patch_classification:
  - file: 0001-config-config.guess.patch
    type: auto
    platform_only: True
    guard: 'not_needed'
  - file: 0002-config-config.sub.patch
    type: auto
    platform_only: True
    guard: 'not_needed'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'not_needed'
