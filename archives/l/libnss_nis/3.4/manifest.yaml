# 版本级 manifest — libnss_nis 3.4
# HarmonyOS PC (aarch64 / musl / clang 15) 适配

version: "3.4"
software: "libnss_nis"
status: published
build_date: "2026-09-23"
build_system: autotools

source:
  url: "https://github.com/thkukuk/libnss_nis/releases/download/v3.4/libnss_nis-3.4.tar.xz"
  sha256: "ee237a957c5f07d8bc3cf245f56537697cc4e1d7d1bfe4a814e48f825764b6ee"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu"
    - "--disable-dependency-tracking"
    - "--prefix=/"
  dependencies:
    - libnsl/2.0.1
    - libtirpc/1.3.7
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-glibc-compat-headers.patch"

knowledge_gained:
  - "libnss_nis 是 glibc NSS 模块，OHOS/musl 缺 <nss.h>/<aliases.h>/<rpc/netdb.h>，需最小兼容头"
  - "musl 导出 mempcpy() 但无 glibc 内部名 __mempcpy，需宏映射"
  - "NSS 模块无公共头文件，package_info 必须清空 includedirs 避免 CMakeDeps 引用不存在路径"
