# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libnss_nis/3.4
homepage: "https://github.com/thkukuk/libnss_nis"

# 上游测试命令 (make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cd src && make check"

# 上游实际运行的测试程序（完整枚举：仅 1 个）
# 上游 src/Makefile.am: check_PROGRAMS = nss_loader-test; TESTS = $(check_PROGRAMS)
upstream_tests:
  - file: nss_loader-test.c
    source: libnss_nis-3.4/src/nss_loader-test.c
    description: >
      NSS 模块冒烟测试：dlopen(".libs/libnss_nis.so.2", RTLD_NOW) 并
      dlsym("_nss_nis_getpwnam_r")，验证模块可加载且符号表完整。
      不需要 NIS 服务器（实际调用位于 #if 0 内）。
    command: "./nss_loader-test"
    result: "PASS (1/1, OHOS aarch64 实测)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >
      消费者验证：模拟业务层 NSS 使用者，dlopen(libnss_nis.so.2) +
      dlsym(_nss_nis_getpwnam_r) 并实际调用该公开 API。OHOS 无 NIS
      域配置，预期返回 NSS_STATUS_UNAVAIL，验证符号可解析且入口可执行。
    command: "./test_libnss_nis"

# 测试断言总数
assertion_count: 3
