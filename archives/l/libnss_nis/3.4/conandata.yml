# conandata.yml — libnss_nis 3.4
# 官方源: https://github.com/thkukuk/libnss_nis/releases/download/v3.4/libnss_nis-3.4.tar.xz
# sha256 与下载产物实测一致（2026-09-23 本地校验）

sources:
  url:
    - "https://gh-proxy.com/https://github.com/thkukuk/libnss_nis/releases/download/v3.4/libnss_nis-3.4.tar.xz"
    - "https://github.com/thkukuk/libnss_nis/releases/download/v3.4/libnss_nis-3.4.tar.xz"
  sha256: "ee237a957c5f07d8bc3cf245f56537697cc4e1d7d1bfe4a814e48f825764b6ee"

patches:
  - patch_file: "patches/0001-ohos-glibc-compat-headers.patch"
    patch_description: >
      OHOS/musl 没有 glibc 专有的 <nss.h>/<aliases.h>/<rpc/netdb.h>。
      该补丁在 src/ 下新增三个最小兼容头（AM_CPPFLAGS 的 -I$(srcdir) 使
      #include <nss.h> 等解析到树内兼容头）：
      - src/nss.h: enum nss_status + NSS_STATUS_* 常量；gethostbyname4_r
        NSS 接口需要的 NETDB_INTERNAL/NETDB_SUCCESS 与
        struct gaih_addrtuple（布局对齐 glibc inet/getaddrinfo.h）；
        并把 glibc 内部名 __mempcpy 映射到 musl 导出的 mempcpy()。
      - src/aliases.h: struct aliasent（glibc inet/aliases.h 布局）。
      - src/rpc/netdb.h: libnss_nis 的 rpc 模块只用到 struct rpcent（由
        libtirpc 的 <rpc/rpcent.h> 提供），该头仅转发包含 rpcent.h。
      不修改任何 .c 文件，行为与 glibc 平台一致。
    patch_type: "portability"
