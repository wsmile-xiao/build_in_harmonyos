version: "1.1.1"
software: libhpptools
status: published
build_date: "2026-09-18"
build_system: none  # header-only C++11 library; package() copies include/ only

source:
  url: "https://github.com/mateidavid/hpptools/archive/refs/tags/1.1.1.tar.gz"
  sha256: "f3b72cb2aff126f6f0c681816f2830d46e40ab2ffe2772d6c00bf2e35e2771d6"
  tar_format: tar.gz

build:
  system: custom  # header-only: no upstream build system; package = copy headers
  configure_options: []
  dependencies:
    - name: zlib
      version: 1.3.1.2
      role: requires  # zstr.hpp wraps zlib (transitive_headers + transitive_libs)
  compiler: clang

patches_applied: []

knowledge_gained:
  - "header-only 库（无构建族变体 A）用 v12.21 conanfile-headeronly 模板：package_id info.clear() 单一 id，package() 只拷 include/，cpp_info.bindirs/libdirs 置空"
  - "上游 9 用例 Catch 测试（examples/test-alg.cpp + 自带 catch.hpp）原样进 test_package 在 OHOS aarch64 真实编译执行（R51 三步法：清点+运行+回填）"
