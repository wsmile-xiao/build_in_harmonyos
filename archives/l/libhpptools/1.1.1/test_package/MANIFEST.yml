# test_package/MANIFEST.yml — libhpptools 1.1.1
# CI L0e requires this file to exist. Upstream test declaration (rule 4:
# no fabricated pass rates — every number below is backed by the conan create
# build log which compiles and runs both test_package binaries on OHOS
# aarch64).

package: libhpptools/1.1.1
homepage: "https://github.com/mateidavid/hpptools"

# Upstream tests (R51 three-step: inventory -> actually run -> report back):
# tag 1.1.1 ships an automated Catch 1.x suite for alg.hpp only.
# examples/test-alg.cpp declares 9 TEST_CASE cases; the file and its bundled
# catch.hpp are copied verbatim into test_package and executed unmodified.
upstream_check_command: "./test_alg (Catch 1.x, CATCH_CONFIG_MAIN)"
upstream_test_in_build: false  # header-only package: no build() step
upstream_test_command: "./test_alg"

upstream_tests:
  - file: test_alg.cpp
    source: hpptools-1.1.1/examples/test-alg.cpp (verbatim) + catch.hpp (verbatim)
    description: "alg.hpp suite: min_of/max_of/minmax_of/mean_stdv_of/equal_of/for_each_advance/for_each_it/for_each_it_advance/os_join (9 TEST_CASE, 100+ CHECK assertions)"
    command: "./test_alg"

# test_package tests (consumer perspective: compile+run against the packaged
# headers on OHOS aarch64) — HarmonyOS-added validation.
test_package_tests:
  - file: test_consumer.cpp
    description: "Consumer smoke test for the headers the upstream suite does not exercise: zstr (gzip roundtrip + multi-member stream), strict_fstream (write/read), logger (level filtering + facility map), logsum (p7_FLogsum + logsumset), logdiff, tpool (100 jobs / 4 threads), pfor (1000 items / 4 threads); returns non-zero on any failed check"
    command: "./test_consumer"

# HarmonyOS-added consumer assertions only (12 CHECK assertions in a single
# binary run). The 9 upstream TEST_CASE cases are tracked separately in
# upstream_tests above.
assertion_count: 12
