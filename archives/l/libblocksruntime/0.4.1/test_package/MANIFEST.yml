# test_package/MANIFEST.yml
package: libblocksruntime/0.4.1
homepage: https://github.com/mackyle/blocksruntime

upstream_tests_exist: true
upstream_test_audit: "发行版源码包含 autotools 测试：Makefile.am 中 check_PROGRAMS=blockrt-test、TESTS=blockrt-test，源文件 test/main.c（1 项：__block 计数器 + Block_copy/Block_release）"
upstream_check_command: "make check（上游 autotools；本配方直接编译，见 notes.md 说明）"
upstream_test_in_build: false
upstream_test_command: "ctest -R test_upstream（同一 test/main.c，作为消费者程序运行）"

# test_package 中自带的测试
test_package_tests:
  - file: test_upstream.c
    description: "上游 0.4.1 自带测试（verbatim）：__block 计数器 Block_copy 3 次调用得 3"
    command: "ctest -R test_upstream"
  - file: test_blocks_c.c
    description: "独立 C 消费者：stack/malloc/global block 类别、retain/release 生命周期、__block byref 共享、块作参数/嵌套/数组/结构体捕获、NULL 处理、_Block_dump"
    command: "ctest -R test_blocks_c"
  - file: test_blocks_cpp.cpp
    description: "C++ 消费者（不自行传 -fblocks，验证运行库传播语言开关）：std::string/自定义拷贝构造对象捕获、__block、块参数/返回块/嵌套"
    command: "ctest -R test_blocks_cpp"

test_package_test_count: 3
upstream_test_count: 1
consumer_assertion_count: 32
assertion_count: 32
