knowledge_gained:
  - "Blocks 是「编译期语言开关(-fblocks) + 链接期独立运行库」两半：OHOS clang 有前者无后者，错误只在链接期出现，只补一端都不通（2x2 矩阵实测）"
  - "独立 BlocksRuntime（compiler-rt）提供 libBlocksRuntime.a + Block.h/Block_private.h；消费者以 -fblocks 编译并链接 -lBlocksRuntime；由包通过 cpp_info.cflags/cxxflags 传播 -fblocks 可消除半配置"
  - "0.4.1 的 _Block_copy 不重标 isa（堆块判据是 BLOCK_NEEDS_FREE+refcount）；无捕获块是 global block，Block_copy 原样返回"
  - "现代 clang 不置 legacy BLOCK_HAS_DESCRIPTOR，0.4.1 的 _Block_dump 会 exit(1)；上游 hasdescriptor.c 的“同尺寸”假设属 legacy 预期（实测 36 vs 40）"
  - "0.4.1 无上游 git tag：版本身份来自发行版 orig tarball（AC_INIT 0.4.1），runtime.c/data.c 与 mackyle master 不同"
  - "上游 autotools（2013 config.guess/sub）不识别 HarmonyOS（E007），HMDFS 上 make 的 jobserver FIFO 受限（E074）；两源文件直接编译更确定"
  - "诊断陷阱：独立 clang（无链接器驱动）链接报 posix_spawn failed，与缺库无关；需用 profile 指向的 SDK clang"
