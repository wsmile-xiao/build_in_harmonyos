software: libblocksruntime
display: "BlocksRuntime"
description: "clang -fblocks 语言扩展所需的 Blocks 运行库（LLVM compiler-rt 的 BlocksRuntime 部分）"
category: library
homepage: "https://github.com/mackyle/blocksruntime"
license: MIT OR UIUC
build_system: custom

ohos_adaptation:
  key_points:
    - "OHOS clang 支持 -fblocks 语法，但工具链/SDK 不提供 Blocks 运行库，也不安装 Block.h"
    - "仅含 -fblocks 代码的目标在链接期因 _Block_copy/_Block_release/_Block_object_assign/_Block_object_dispose/_NSConcrete*Block 未定义而失败"
    - "本包安装 lib/libBlocksRuntime.a 与 include/Block.h、include/Block_private.h，CMake 目标 BlocksRuntime::BlocksRuntime"
    - "运行库通过 cpp_info.cflags/cxxflags 传播 -fblocks：消费者链接运行库即自动获得语言开关"
    - "上游 autotools 构建在 OHOS 上有配置/工具链问题（见 notes.md），因仅两个源文件，直接编译更可靠"
  common_dependencies: []

versions:
  "0.4.1":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libblocksruntime/0.4.1"
