# 补丁说明：
# 0001-0006: autoreconf 自动生成的文件更新（支持 Lua 5.4 + HMDFS umask 修复）
# 0007: 修改 configure.ac 支持 Lua 5.4（AX_PROG_LUA([5.1], [5.5])）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Lua stdlib 默认只支持 Lua 5.1-5.3，需要修改 configure.ac 支持 Lua 5.4"
  - "HMDFS 文件系统 SELinux 限制导致 configure umask 077 失败，需改为 umask 022"
  - "纯 Lua 库无二进制文件，只有 .lua 模块文件安装到 share/lua/5.4/"
  - "需要设置 LUA_PATH 环境变量才能正确加载模块"

