# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: liblerc/4.2.0
homepage: "https://github.com/Esri/lerc"

# 上游测试命令
upstream_check_command: "none"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/LercTest/main.cpp
    source: lerc-4.2.0/src/LercTest/main.cpp
    description: "上游仅包含示例程序，无正式测试框架"
    command: "none"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "LERC C API 编解码集成测试：测试 lerc_computeCompressedSize、lerc_encode、lerc_decode 完整流程"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
