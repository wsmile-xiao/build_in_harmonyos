# 版本级 manifest — libsgp4 1.0
# 遵循 ARCHIVE-SPEC（manifest 字段规范见 knowledge/ARCHIVE-SPEC.md §4.2）

version: "1.0"
software: "libsgp4"
conan_ref: "libsgp4/1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/dnwrnr/sgp4/archive/refs/tags/v1.0.tar.gz"
  sha256: "34cdcce25adbe25234b5113b06537bec9d6e6c2a74f70919c9d71710dc3773f4"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "CMAKE_BUILD_TYPE=Release（profile ohos-aarch64 默认）"
    - "options.fPIC=True → conan CMakeToolchain 自动注入 CMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "package_type=static-library，交付 libsgp4.a（与 CCI 同版本配方默认 shared=False 的产物一致）"
    - "build() 全量构建上游目标并连跑两次 runtest 验证驱动（33 个 TLE 用例）"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 runtest/runtest.cc 的 main() 固定 return 1（返回值写死），且仓库不带期望输出夹具：上游测试判据改为「结构 + 步进窗口 + 物理量级 + 双跑确定性」，并额外用独立实现 python-sgp4 2.27（Vallado 参考代码，WGS72）做逐行差分"
  - "上游 install() 只导出 shared 目标 sgp4s，而 CCI 同版本默认交付静态库：本配方不打补丁，在 package() 显式 staging 静态库与头文件（源码树与 v1.0 逐字节一致）"
