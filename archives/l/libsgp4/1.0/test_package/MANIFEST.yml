# libsgp4/1.0 测试清单（CI L0e 门禁）
package: libsgp4/1.0
homepage: "https://github.com/dnwrnr/sgp4"

# 上游测试入口：runtest/ 验证驱动 + SGP4-VER.TLE（上游没有 ctest/make check）
upstream_check_command: "./runtest/runtest"
upstream_test_in_build: true
upstream_test_command: "conanfile.py build() → _run_upstream_verification()（连跑两次并逐行校验）"

upstream_tests:
  - file: runtest/runtest.cc
    source: sgp4-1.0/runtest/runtest.cc
    description: "SGP4-VER.TLE 验证套件：33 个 TLE 用例，逐用例输出 tsince 与 TEME 位置/速度"
    command: "./runtest/runtest"
    result: "33/33 用例执行完成（26 个走到末步，7 个按上游设计触发错误分支后由 stderr 报错终止，错误行与用例 1:1 对应）；两次运行输出字节一致；rc=1（上游 runtest main() 固定 return 1，属上游写死，见 notes.md）"
  - file: SGP4-VER.TLE
    source: sgp4-1.0/SGP4-VER.TLE
    description: "上游验证夹具（33 组 TLE + 每组 start/end/inc 步进参数），由 CMake file(COPY) 带进构建目录"
    command: "n/a（数据文件）"
    result: "N=33 用例清点口径：源码宏数 0 / 框架注册数 0 / 测试驱动 1 个 / 夹具用例 33 → 候选最大值 33"

test_package_tests:
  - file: test.cpp
    description: "消费者测试（鸿蒙特有）：TLE 解析 4 项、SGP4 传播对独立参考实现（python-sgp4 2.27）差分 4 项、错误信号 1 项、look-angle 1 项"
    command: "./test_probe"
    result: "10/10 断言通过（OHOS aarch64 真机）"
assertion_count: 10
max_rss_mb: 512
