package: libbpp-seq-omics/2.4.1
homepage: "https://github.com/BioPP/bpp-seq-omics"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - {file: test/test_fastq.cpp, source: bpp-seq-omics-2.4.1/test/test_fastq.cpp, description: "FASTQ 格式读写", command: "ctest -R test_fastq"}
  - {file: test/test_gff.cpp,    source: bpp-seq-omics-2.4.1/test/test_gff.cpp,    description: "GFF 格式读写",  command: "ctest -R test_gff"}

test_package_tests:
  - file: test_bpp_seq_omics.cpp
    description: "3 项断言：MafStatisticsResult 默认构造 / setValue 写入 / hasValue 查询 / getAvailableTags 列表（真实调用被测包 API）"
    command: "./test_bpp_seq_omics（经 ctest -R test_bpp_seq_omics）"

assertion_count: 3
