software: libbpp-seq-omics
version: "2.4.1"
upstream_version: "2.4.1"
status: built
build_date: "2026-09-21"
build_system: cmake
conan_ref: "libbpp-seq-omics/2.4.1"

source:
  url: "https://github.com/BioPP/bpp-seq-omics/archive/refs/tags/v2.4.1.tar.gz"
  sha256: "200da925b42065998d825f0b2a37e26b00a865883c85bc332beb3a94cae1e08b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-Dbpp-seq_DIR=<libbpp-seq 包内>/lib/cmake/bpp-seq"
  dependencies:
    - libbpp-seq/2.4.1
  cc: clang
  cxx: clang++
  package_type: library

patches_applied:
  - "patches/0001-ohos-test-link-static.patch (testing: ctest binaries link bpp-seq-omics-static for the OHOS loader)"

knowledge_gained:
  - "Bio++ 家族通用配方模式（同 libbpp-phyl / libbpp-raa）：cmake_minimum_required 2.8.11 需 CMAKE_POLICY_VERSION_MINIMUM=3.5；上游 set(CMAKE_CXX_FLAGS) 覆盖 --target 需 CMAKE_<LANG>_COMPILER_TARGET 注入（E543）；libbpp-seq 包 CMake 导出引用已裁剪 .so 需构建内 shim；测试可执行文件改链静态归档"
