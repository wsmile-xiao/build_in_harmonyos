software: libcamera
display: "libcamera"
description: "A complex camera support library and API for camera pipelines."
category: multimedia
homepage: "https://libcamera.org/"
license: "LGPL-2.1-or-later"
build_system: meson

ohos_adaptation:
  key_points:
    - "Builds the shared camera and camera-base libraries with the OHOS arm64 LLVM toolchain."
    - "Uses feature-detected OHOS portability paths for memfd, process waiting, temporary files, and YAML diagnostics."
    - "Signs runnable OHOS ELF test and IPA artifacts with binary-sign-tool."
    - "The minimal profile enables the uvcvideo and vimc pipeline handlers; physical camera discovery was not available in the validation environment."
  common_dependencies:
    - "libyaml/0.2.5"
    - "openssl/3.5.6"

versions:
  "0.7.2":
    status: built
    build_date: "2026-09-29"
    conan_ref: "libcamera/0.7.2"
