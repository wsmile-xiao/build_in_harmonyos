knowledge_gained:
  - "OHOS memfd_create can return an fd whose fstat fails with errno 13; only unsealed temporary allocations use an unlinked TMPDIR file fallback."
  - "The configured clone3 namespace probe returned -31 on this OHOS target, so capability detection selected posix_spawn and waitpid while retaining pidfd notification where available; no platform identity macro is used."
  - "Temporary-file tests must honor TMPDIR because /tmp is not writable on the validation device."
  - "libcamera's Meson yaml-0.1 and libcrypto probes require pkg-config compatibility shims for the published Conan dependencies."
  - "OHOS test and IPA ELF files must be signed with binary-sign-tool and verified to contain exactly one .codesign section before execution."
  - "The test package exports its packaged IPA module/proxy directories through LIBCAMERA_IPA_MODULE_PATH and LIBCAMERA_IPA_PROXY_PATH."

