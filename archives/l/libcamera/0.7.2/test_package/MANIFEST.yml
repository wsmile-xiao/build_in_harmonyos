# One installed-package test is counted as one independent integration flow;
# assertions inside that executable are not inflated into separate test cases.
test_package_tests:
  - file: "test.cpp"
    description: "Installed public C++ API consumer: runtime-path receipt, version, NV12 pixel format, CameraManager lifecycle, and missing-camera lookup"
    command: "./test_libcamera"
    execution_status: "1/1 PASS"
    runtime_environment: "Conan run environment points LIBCAMERA_IPA_MODULE_PATH and LIBCAMERA_IPA_PROXY_PATH at the packaged IPA/proxy directories; the executable asserts both variables are present and prints their resolved paths."
    assertions:
      - "LIBCAMERA_IPA_MODULE_PATH and LIBCAMERA_IPA_PROXY_PATH are present in the consumer environment"
      - "CameraManager::version() contains 0.7.2"
      - "PixelFormat::fromString/toString round-trip NV12"
      - "CameraManager start/stop succeeds"
      - "Missing camera lookup returns no camera"

assertion_count: 5

test_counting:
