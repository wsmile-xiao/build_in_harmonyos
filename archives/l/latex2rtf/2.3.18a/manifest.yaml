software: latex2rtf
version: "2.3.18a"
status: published
build_system: makefile
build_date: "2026-06-12"

source:
  url: "https://deb.debian.org/debian/pool/main/l/latex2rtf/latex2rtf_2.3.18a.orig.tar.gz"
  sha256: "338ba2e83360f41ded96a0ceb132db9beaaf15018b36101be2bae8bb239017d9"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=clang"
    - "PREFIX=$DEFAULT_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "latex2rtf 为纯 Makefile 项目，无 configure 脚本，直接 make CC=clang PREFIX=$DEFAULT_PREFIX 编译"
  - "latex2rtf 不支持 --version 参数，功能验证需传入 .tex 文件进行转换测试"
  - "verify-build 的 install-prefix 需指向 TEST_PREFIX/DEFAULT_PREFIX 而非 TEST_PREFIX"