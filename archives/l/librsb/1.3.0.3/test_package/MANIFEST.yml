# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librsb/1.3.0.3
homepage: "https://librsb.sourceforge.net/"

# 上游测试套件存在性 (经审计源码 tar 包确认, 见下方 upstream_tests)
upstream_tests_exist: true

# 上游测试命令
# 顶层 `make check` 在上游是 `make qtests` 的别名 (见上游 NEWS.TXT), 为
# rsbench -Q 30 蛮力套件 + librsbpp/rsbtest `--max 30` 循环, 在单槽位真机
# 预检中超时掉线 (2026-09-21: `Connection closed`, 零标记)。门禁套件为
# examples/Makefile.am 的 `tests` 目标, 在主配方 build() 内执行。
upstream_check_command: "make -C examples tests"
upstream_test_in_build: true
upstream_test_command: "make -C examples tests"

# 上游实际运行的测试程序 (无 Fortran 配置下共 9 步, 源码包 librsb-1.3.0.3.tar.gz,
# 真机实测 HMBS_UPSTREAM_TEST_RESULT discovered=9/executed=9/passed=9):
# examples/Makefile.am `tests` 目标依次执行 bench.sh、各示例二进制、
# ./autotune pd.mtx。无 Fortran 编译器时 configure 关闭 BLAS 接口
# (Will not build the BLAS interface), hello-spblas/io-spblas 不构建,
# 实际组成为 6 个 C 示例 + 1 个 C++ 示例 + bench.sh + autotune = 9 步。
# 下方 spblas 两条目为上游文件备查, 本配置不执行。
upstream_tests:
  - file: examples/bench.sh
    source: librsb-1.3.0.3/examples/bench.sh
    description: "rsbench 基准 + --compare-competitors 正确性对照 (性能记录往返)"
    command: "bash bench.sh (经由 make -C examples tests)"
  - file: examples/hello.c
    source: librsb-1.3.0.3/examples/hello.c
    description: "Hello-RSB: 建矩阵 + SpMV + 结果校验"
    command: "./hello (经由 make -C examples tests)"
  - file: examples/snippets.c
    source: librsb-1.3.0.3/examples/snippets.c
    description: "API 片段冒烟 (矩阵装配/运算)"
    command: "./snippets (经由 make -C examples tests)"
  - file: examples/transpose.c
    source: librsb-1.3.0.3/examples/transpose.c
    description: "转置运算示例"
    command: "./transpose (经由 make -C examples tests)"
  - file: examples/power.c
    source: librsb-1.3.0.3/examples/power.c
    description: "幂迭代示例"
    command: "./power (经由 make -C examples tests)"
  - file: examples/autotune.c
    source: librsb-1.3.0.3/examples/autotune.c
    description: "自动调优示例 (二进制自检)"
    command: "./autotune (经由 make -C examples tests)"
  - file: examples/backsolve.c
    source: librsb-1.3.0.3/examples/backsolve.c
    description: "三角回代示例"
    command: "./backsolve (经由 make -C examples tests)"
  - file: examples/cplusplus.cpp
    source: librsb-1.3.0.3/examples/cplusplus.cpp
    description: "C++ 接口示例"
    command: "./cplusplus (经由 make -C examples tests)"
  - file: examples/hello-spblas.c
    source: librsb-1.3.0.3/examples/hello-spblas.c
    description: "Sparse-BLAS 接口示例 (本配置未构建, 见头部说明)"
    command: "./hello-spblas (经由 make -C examples tests)"
  - file: examples/io-spblas.c
    source: librsb-1.3.0.3/examples/io-spblas.c
    description: "Sparse-BLAS I/O 示例 (本配置未构建, 见头部说明)"
    command: "./io-spblas (经由 make -C examples tests)"
  - file: examples/autotune.c (on-matrix)
    source: librsb-1.3.0.3/pd.mtx
    description: "autotune 在真实 pd.mtx 矩阵上的端到端运行"
    command: "./autotune pd.mtx (经由 make -C examples tests)"

# 未接入的上游测试 (如实声明, 见 PR 补充说明):
# - rsb_gtests.cpp: 221 个 TEST 用例, 需系统 GTest (gtest/gtest.h + -lgtest_main
#   -lgtest)。OHOS 真机与制品仓均无 GTest, 且 noinst 程序本就不在 make check
#   执行路径上, 故未运行。
# - rsbtest/rsblib/librsbpp: 独立实验性 tar 包, 默认不随主包构建。
# - 顶层 `make check` (= `make qtests`, 见上游 NEWS.TXT): rsbench -Q 30 蛮力
#   + librsbpp/rsbtest `--max 30` 循环, 在单槽位真机预检中超时并掉线
#   (2026-09-21 `Connection closed`, 上游标记 0/0/0), 故未纳入本次门禁;
#   门禁套件为上方的 examples `tests` 9 步。


# 上游测试总数声明 (rule4 硬门禁: 非负整数, 不能按 0 处理; 口径与官方 examples/Makefile.am tests 目标一致)
# 计数单位: examples tests 目标的执行步 = 9 个 noinst 示例二进制 + bench.sh + ./autotune pd.mtx = 11 步
# 取数命令: grep -A30 "tests:" examples/Makefile.am (9 二进制名 + bench.sh + autotune pd.mtx)
# 源码级互验: grep -c noinst_PROGRAMS examples/Makefile.am 与 tests 目标依赖一致; configure 无 Fortran 时 HAVE_FC=false / Will not build the BLAS interface
upstream_test_total: 11
upstream_test_count_method: autotools_tests
upstream_test_audit: "Audited librsb-1.3.0.3.tar.gz sha256:f9d343f9e24bceb1d6f76c3db0617ad326eb246891b51424f3931a8f3965bf5f. examples/Makefile.am tests target = 9 example binaries (hello/snippets/transpose/power/autotune/backsolve/cplusplus/hello-spblas/io-spblas) + bench.sh + ./autotune pd.mtx = 11 steps; no-Fortran config disables BLAS interface (HAVE_FC=false, Will not build the BLAS interface) so hello-spblas/io-spblas not built, gated run 9/9 with 2 ohos_feature gaps. rsb_gtests.cpp 221 TEST are noinst (AC_CHECK_HEADERS gtest/gtest.h + AC_CHECK_LIB gtest_main) not in make check/tests path; rsbtest/rsblib/librsbpp external default-off; top-level make check = make qtests brute-force (rsbench -Q 30 + rsbtest --max 30 loops, NEWS.TXT) excluded after 2026-09-21 single-slot Connection closed with zero markers."

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test_librsb.c
    description: "消费者数值测试: init/COO 建矩阵/SpMV(含转置与 beta 累加, 逐元校验)/free/exit, 共 6 个 CHECK-OK 断言"
    command: "./test_librsb"
  - file: conanfile.py
    description: "Conan test() 入口, 编译运行 test_librsb 并输出 HMBS 机器证据标记 (test_package discovered=6; 上游 9 步标记由主配方 build() 输出)"
    command: "conan test test_package"

# 测试断言总数 (test_librsb.c 的 6 个 CHECK-OK, 与 HMBS_TEST_PACKAGE_RESULT discovered=6 一致)
assertion_count: 6
