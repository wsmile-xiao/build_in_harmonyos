# 软件级 manifest
# 文件位置: archives/l/librsb/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: librsb
display: "librsb"
description: "Shared-memory parallel Sparse BLAS library for the Recursive Sparse Blocks format"
category: library
homepage: "https://librsb.sourceforge.net/"
license: LGPL-3.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "无 Fortran 编译器时 configure 自动降级 (HAVE_FC=false), Fortran 接口与示例自动跳过"
    - "config.guess 无法识别 HarmonyOS, 需显式 --build=aarch64-unknown-linux-gnu"
    - "make check 上游为空目标, 真实可运行套件是 examples/ 的 tests 目标"
    - "rsb_gtests.cpp 需系统 GTest, OHOS 环境无法运行"
  common_dependencies:
    - zlib

versions:
  "1.3.0.3":
    status: built
    build_date: "2026-09-19"
