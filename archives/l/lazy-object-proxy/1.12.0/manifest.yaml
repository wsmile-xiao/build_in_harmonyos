# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "python/3.12.9"
  optional: []
  note: |
    · python/3.12.9 —— Python.h + libpython3.12.so（链接期必需：musl 不从主
      可执行文件导出 Python 符号，cffi 2.1.1 已实测该结论）。
    · 运行期无外部依赖（pyproject.toml: dependencies = []）。

    **package_type=library 的原因**：conan 禁止 python-require 依赖带类型的库
    （python/3.12.9 传递带入 static-library 的 libffi），故声明 library +
    shared 选项（与 psutil 7.2.2 / cffi 2.1.1 一致）。

    构建期 setuptools/setuptools_scm（pyproject build-backend 要求 >=80/>=8）
    未发布到 ohpcd，按 PF4 不写成 tool_requires，改为构建期从平台 pip 镜像
    引导（cffi/pillow 先例）。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    上游为 src 布局（src/lazy_object_proxy 纯 Python 层 + cext.c C 扩展，
    setup.py 对 src/**/*.c glob 出 cext 扩展）。build() 走
    `setup.py build_ext --inplace`（与仓内 psutil/cffi 同款），显式注入
    CFLAGS（Python.h）与 LDFLAGS（-lpython3.12 -fuse-ld=bfd），产物
    `cext.cpython-312-aarch64-linux-ohos.so` 落
    `<source_folder>/src/lazy_object_proxy/`（distutils 的 --inplace 依
    `package_dir={"": "src"}` 拷到 cwd 下的包目录）。

    **必须签名**：OHOS 要求 dlopen 的 .so 带 .codesign 段，否则
    `ImportError: ... Permission denied`。build 期与 package 期各签一次
    （conan 的 copy() 会使既有签名失效）。

