# test_package/MANIFEST.yml — lazy-object-proxy 1.12.0（Python 版）
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lazy-object-proxy/1.12.0
homepage: "https://github.com/ionelmc/python-lazy-object-proxy"

# 上游测试命令 — pytest（tests/ 目录 + src doctest）
upstream_check_command: "python3 -m pytest tests src -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest -q --no-header -p no:cacheprovider --basetemp=<build>/pytest-basetemp"

# 上游实际运行的测试程序：
# - tests/test_lazy_object_proxy.py（conftest 参数化 slots/cext/simple ×
#   subclassed/normal，核心功能 100+ 用例）
# - tests/test_async_py3.py（异步代理行为）
# - src doctest（--doctest-modules，含 README.rst 的 --doctest-glob）
# 运行结果以 conan create 实跑日志为准（pytest-report.log 落 build 目录）。
