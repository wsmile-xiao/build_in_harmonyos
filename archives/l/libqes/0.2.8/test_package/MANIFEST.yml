package: libqes/0.2.8
homepage: https://github.com/kdmurray91/libqes

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests_exist: true
upstream_test_total: 3
upstream_test_count_method: ctest_entries
# Count basis (official, test/CMakeLists.txt): 3 CTest entries =
# run_test_libqes (tinytest, aggregates test/*.c suites) +
# run_log_demo + run_bench_libqes. Matches ctest -N discovered=3
# on HarmonyOS aarch64 preflight (3/3 passed).

upstream_tests:
  - file: test/test.c
    source: libqes-0.2.8/test/test.c
    description: "tinytest main entry driving all test_*.c suites"
    command: "ctest -R run_test_libqes"
  - file: test/test_seq.c
    source: libqes-0.2.8/test/test_seq.c
    description: "qes_seq create/ok/fill/truncate suites"
    command: "ctest -R run_test_libqes"
  - file: test/test_seqfile.c
    source: libqes-0.2.8/test/test_seqfile.c
    description: "seqfile fasta/fastq parse/write suites"
    command: "ctest -R run_test_libqes"
  - file: test/test_sequtil.c
    source: libqes-0.2.8/test/test_sequtil.c
    description: "sequtil suites"
    command: "ctest -R run_test_libqes"
  - file: test/test_file.c
    source: libqes-0.2.8/test/test_file.c
    description: "qes_file readline suites"
    command: "ctest -R run_test_libqes"
  - file: test/test_match.c
    source: libqes-0.2.8/test/test_match.c
    description: "qes_match suites"
    command: "ctest -R run_test_libqes"
  - file: test/test_util.c
    source: libqes-0.2.8/test/test_util.c
    description: "qes_util suites"
    command: "ctest -R run_test_libqes"
  - file: test/test_log.c
    source: libqes-0.2.8/test/test_log.c
    description: "qes_log suites"
    command: "ctest -R run_log_demo"
  - file: test/benchmarks.c
    source: libqes-0.2.8/test/benchmarks.c
    description: "benchmark harness over 5 parse functions"
    command: "ctest -R run_bench_libqes"

test_package_tests:
  - file: test.c
    description: "qes_seq create/fill/ok/truncate/destroy consumer chain"
    command: "./test_libqes"

assertion_count: 8
