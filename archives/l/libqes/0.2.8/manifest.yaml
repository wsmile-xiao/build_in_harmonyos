  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DNO_OPENMP=True"
    - "-DNO_ZLIB=False"
  cc: clang

patches_applied: ["patches/readonly-tmp-bench.patch"]

