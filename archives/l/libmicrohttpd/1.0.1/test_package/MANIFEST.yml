# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libmicrohttpd/1.0.1
homepage: "https://www.gnu.org/software/libmicrohttpd/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (src/microhttpd 45 项 + src/testcurl 113 项, 全量 158 注册项)
upstream_tests:
  - file: test_mhd_version.c
    source: libmicrohttpd-1.0.1/src/microhttpd/test_mhd_version.c
    description: "MHD_get_version sanity check"
    command: "./test_mhd_version"
  - file: test_daemon.c
    source: libmicrohttpd-1.0.1/src/microhttpd/test_daemon.c
    description: "daemon lifecycle (start/stop/bind port)"
    command: "./test_daemon"
  - file: test_str.c
    source: libmicrohttpd-1.0.1/src/microhttpd/test_str.c
    description: "string utilities (base64/hex/pct/quote/token), 10 variants"
    command: "./test_str_base64"
  - file: test_get.c
    source: libmicrohttpd-1.0.1/src/testcurl/test_get.c
    description: "HTTP GET over real socket via libcurl"
    command: "./test_get"
  - file: test_post.c
    source: libmicrohttpd-1.0.1/src/testcurl/test_post.c
    description: "HTTP POST via libcurl"
    command: "./test_post"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: MHD_start_daemon + MHD_get_version + bind port"
    command: "./test_libmicrohttpd"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 158
