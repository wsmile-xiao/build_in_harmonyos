# 版本级 manifest — libmicrohttpd 1.0.1
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.1"

# 软件名
software: libmicrohttpd

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GNU 官方源）
  url: "https://ftp.gnu.org/gnu/libmicrohttpd/libmicrohttpd-1.0.1.tar.gz"

  # 源码校验和（与 conandata.yml 一致）
  sha256: "a89e09fc9b4de34dde19f4fcb4faaa1ce10299b9908db1132bbfa1de47882b94"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-doc"

  # 编译依赖列表（格式: name/version；核心库无强制外部依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autotools 在无 texinfo/makeinfo 环境构建文档失败 (Error 127)，configure --disable-doc 规避（DRAFT-libmicrohttpd-1.0.1-texinfo-missing-disable-doc）"
  - "config.guess/config.sub 2022 版不识别 HarmonyOS：补丁增加 HarmonyOS→linux-ohos 分支与 ohos-linux 映射（E007/E072）"
  - "HMDFS umask 077 临时目录不可写：configure/config.guess umask 077→022（E011）"

patch_generation:
  method: per-file-difflib
  patches_count: 3

patch_classification:
  - file: 0001-build-aux-config.guess.patch
    type: auto
    platform_only: True
    guard: reviewed
  - file: 0002-build-aux-config.sub.patch
    type: auto
    platform_only: True
    guard: reviewed
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: reviewed
