# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) mandates this file

package: libido3/13.10.0
homepage: "https://launchpad.net/ido"

# Upstream test command: automake hook. NOTE — upstream carries NO runnable
# test cases: tests/Makefile.am line 6-7 define `check_PROGRAMS = ` and
# `TESTS = ` as EMPTY (upstream comment lines 4 and 32-34: "xorg-gtest isn't
# buildable https://bugs.launchpad.net/ubuntu/+source/xorg-gtest/+bug/1388892";
# the gtest-menuitems program is commented out of both variables because it
# links -lX11 -lXi and drives a real X display). Alpine's ido package likewise
# ships options="!check".
upstream_check_command: "make check -j1 (automake hook; executes zero cases by upstream design)"

# Whether conanfile.py build() integrates upstream tests: the check hook is
# executed, but there are no upstream cases to run (NO_UPSTREAM_TESTS, with
# discovery evidence recorded in archives/l/libido3/13.10.0/notes.md).
upstream_test_in_build: false
upstream_test_command: "make check -j1 (zero upstream cases; HMBS_UPSTREAM_TEST_RESULT status=no_upstream_tests)"

# Upstream test programs: none runnable (empty TESTS/check_PROGRAMS).
# Source audit 2026-09-26 (ido_13.10.0+22.10.20221007.orig.tar.gz):
#   tests/Makefile.am:6  -> check_PROGRAMS =
#   tests/Makefile.am:7  -> TESTS =
#   tests/gtest-menuitems.cpp exists but is not referenced by any build
#   variable (its 4 TEST_F need X11/Xi + a display; not an OHOS-verifiable
#   surface).
upstream_tests: []

# test_package bundled tests (consumer perspective, real OHOS execution)
test_package_tests:
  - file: test.c
    description: "Consumer test: check1 ido_init callable; check2 OHOS adaptation point — ido_menu_item_factory_get_type absent (dlsym) proving --disable-ubuntu-private-api is in effect; check3 IdoTimeline instantiation (mkenums type registration, headless); check4 IdoSwitchMenuItem + check5 IdoEntryMenuItem widget construction under gtk_init on the headless broadway backend"
    command: "./test_libido3"

# Total test assertions (5 consumer checks; 0 upstream cases by upstream design)
assertion_count: 5
