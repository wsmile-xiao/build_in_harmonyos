# Version-level manifest — libido3 13.10.0
# Follows ARCHIVE-SPEC v2.0

# ============================================================
# Required fields
# ============================================================

# Version
version: "13.10.0"

# Software name
software: libido3

# Build status
# published | built | failed | archived
# (pending preflight confirmation; backend updates after real-device gates pass)
status: built

# Build date (YYYY-MM-DD)
build_date: "2026-09-26"
build_system: autotools

# ============================================================
# Source info
# ============================================================

source:
  # Source download URL (official Ubuntu archive pool, R39).
  # Version mapping: no bare 13.10.0 tarball exists upstream (13.10.0 is the
  # calendar-verse bzr-snapshot series); the official mapping is the Ubuntu
  # current-series 0ubuntu4 orig tarball, sha256 verified against the
  # official .dsc Checksums-Sha256 (Scout-A, 2026-09-26).
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/i/ido/ido_13.10.0+22.10.20221007.orig.tar.gz"

  # Source checksum (official tarball)
  sha256: "660b4feae9a6c8c7ba76251c3636c53c539cc2c287f9272fe2ec81d97a96c241"

  # Archive format
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# Build configuration
# ============================================================

build:
  # Build system type
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # Configure option list
  configure_options:
    - "--disable-static"
    - "--enable-shared"
    - "--disable-ubuntu-private-api"
    - "--disable-introspection"
    - "--disable-gtk-doc"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"

  # Build dependency list (format: name/version) — same proven closure as the
  # published ayatana-ido/0.10.4-v2 recipe (same upstream family; RREV pins
  # keep the gtk/3.24.43 graph on the ohpcd published binaries and eliminate
  # CCI tool edges; see ayatana-ido conanfile for per-pin rationale).
  dependencies:
    - glib/2.84.0.1
    - gtk/3.24.43
    - pixman/0.46.4#09f648ede446f6abf85a98da455c7562
    - fontconfig/2.18.1.1
    - freetype/2.14.3#7e95a2b2401fd12dcbdd2bf748f56b19
    - zlib/1.3.1.1
    - libpng/1.6.58#d25df07aba0399181f60ee377e83d701
    - expat/2.8.2.1
    - libepoxy/1.5.10#92f7e70c459ed2e6a96cd82549e82391
    - libffi/3.4.4#ca8b0eb4102edbca48730e504e3afbdc
    - libjpeg-turbo/3.2.0#5ed08e7ff848da8fdf6b7bca74354560
    - cairo/1.18.4#3894814f2279392f808090c9f3d8f200
    - libtiff/4.7.2#f386d7b671befab127228dbcfc6fe1bf
    - libdeflate/1.25#2346ca4f797e19d8d553b6f698dd8982
    - zstd/1.5.7#83364ff4f4ab63fae26fbfb89f89fefe
    - libwebp/1.6.0#8b273a5128ee70c508671933b61288ec
    - lerc/4.1.1#9c8297567326e560407157395590b2f8
    - jbigkit/2.1#872f3b26b5921c9156cb3aa4675b20c5
    - xz/5.6.2#66ce4bbd966830b5a11768474be4b259

  # Build tools (source bootstrap: the orig tarball ships no generated
  # configure/Makefile.in; autoconf 2.72 comes from the worker toolchain PATH)
  tool_dependencies:
    - pkgconf/3.0.5
    - automake/1.18
    - libtool/2.5.4

  # Compiler
  cc: clang
  cxx: clang++

# ============================================================
# Patch info
# ============================================================

# Applied patch list
patches_applied:
  - "patches/0001-add-ubuntu-private-api-switch.patch"
  - "patches/0002-stub-external-m4-macros.patch"

# ============================================================
# Knowledge gained
# ============================================================

# Lessons learned while building
knowledge_gained:
  - "Orig tarball ships no generated build system and autogen.sh needs gnome-common: in-recipe bootstrap aclocal -> autoconf -> autoheader -> ltmain.sh -> automake --add-missing via self.run(env=conanbuild) (abiword-plugin-docbook precedent; the autoreconf chain hits the HMDFS autoconf.m4f conflict)"
  - "src/idomenuitemfactory.c hard-includes <gtk/ubuntu-private.h>: patch adds a --disable-ubuntu-private-api switch (Alpine ubuntu-private.patch precedent, adapted to the 22.10 tarball) and the recipe builds with it disabled; ido_init() then compiles as a no-op and the IdoMenuItemFactory extension point is absent"
  - "Three external m4 macros (GOBJECT_INTROSPECTION_CHECK/CHECK_XORG_GTEST/GTK_DOC_CHECK) are absent from the tarball: m4_ifdef-guarded stubs keep --disable-introspection/--disable-gtk-doc valid and define HAVE_INTROSPECTION=false for automake"
  - "E179: introspection disabled (g-ir-scanner cannot run target binaries); upstream tests are empty by design (tests/Makefile.am TESTS/check_PROGRAMS empty, LP#1388892) -> NO_UPSTREAM_TESTS with evidence; make check still runs and emits an honest zero-case HMBS_UPSTREAM_TEST_RESULT"
  - "Explicit link closure: all dep libdirs get -L/-Wl,-rpath/-Wl,-rpath-link and glib lib/libintl.so is appended as an absolute input before the toolchain env snapshot (build-chain-pitfalls lld rules)"
  - "libido3-0.1.so.0 must hold real file content (HMDFS symlinks unreliable at runtime): package() copies the libtool real file onto the SONAME name and self-signs installed ELFs with binary-sign-tool (glib/ayatana-ido precedent)"
