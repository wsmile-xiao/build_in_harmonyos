# conandata.yml — libido3 13.10.0
#
# Identity/mapping: upstream is Ubuntu Ayatana "ido" (Indicator Display
# Objects), library artifact libido3-0.1. No bare 13.10.0 tarball exists —
# 13.10.0 is the calendar-verse bzr-snapshot series (13.10.0+YY.MM.DD).
# Official mapping (Scout-A, 2026-09-26): Ubuntu current-series 0ubuntu4
# orig tarball; sha256 verified against the official .dsc Checksums-Sha256.
# The recipe version string is 13.10.0 (configure.ac's internal 13.10.1 is
# an upstream m4 leftover, not the release identity).

sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/i/ido/ido_13.10.0+22.10.20221007.orig.tar.gz"
  filename: "ido-13.10.0+22.10.20221007.orig.tar.gz"
  sha256: "660b4feae9a6c8c7ba76251c3636c53c539cc2c287f9272fe2ec81d97a96c241"

patches:
  "13.10.0":
    - patch_file: "patches/0001-add-ubuntu-private-api-switch.patch"
      patch_type: "portability"
      patch_description: "Add an --enable-ubuntu-private-api switch (default yes) guarding the only <gtk/ubuntu-private.h> consumer (src/idomenuitemfactory.c, src/libido.c, src/Makefile.am); this port builds with it disabled because vanilla GTK3 does not ship that header"
    - patch_file: "patches/0002-stub-external-m4-macros.patch"
      patch_type: "portability"
      patch_description: "Stub GOBJECT_INTROSPECTION_CHECK / CHECK_XORG_GTEST / GTK_DOC_CHECK with m4_ifdef-guarded no-ops: the three macros live in external m4 files not shipped in this tarball; introspection, xorg-gtest and gtk-doc are all disabled for this port"
