# conandata.yml — libfastjson 1.2609.0
# R39: official source URL only — CI adds mirror fallback automatically
# Official release tarball (ships configure/config.guess/config.sub/Makefile.in,
# same distribution channel as libfastjson 1.2304.0 precedent).

sources:
  url: "https://github.com/rsyslog/libfastjson/releases/download/v1.2609.0/libfastjson-1.2609.0.tar.gz"
  sha256: "7cd6f78c1c07f4140f6976a9a0e0048bcaa7292329c6ac2c0e070383d83d8edd"

# Patches:
# - 0001/0002: minimal OHOS platform-recognition increments for config.guess
#   (2022-01-09 base) and config.sub shipped in the official release tarball.
# - 0003: runtime feature detection for test_dump_buffered — skip file-write
#   path when tmpfile() is unavailable (HarmonyOS /tmp is read-only); the
#   in-memory buffered output checks still run. POSIX-compatible approach
#   per R8 (no platform macro in patch).
patches:
  "1.2609.0":
    - patch_file: "patches/0001-config.guess.patch"
    - patch_file: "patches/0002-config.sub.patch"
    - patch_file: "patches/0003-tests-test_dump_buffered-ohos-tmpfile.patch"
