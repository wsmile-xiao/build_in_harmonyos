software: libfastjson
version: "1.2609.0"
build_system: autotools
status: published
build_date: "2026-09-10"

source:
  url: "https://github.com/rsyslog/libfastjson/releases/download/v1.2609.0/libfastjson-1.2609.0.tar.gz"
  sha256: "7cd6f78c1c07f4140f6976a9a0e0048bcaa7292329c6ac2c0e070383d83d8edd"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$PACKAGE_PREFIX"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

# 平台适配补丁:
# - 0001: config.guess 加 HarmonyOS triplet 识别（release tarball 内为 2022-01-09 旧版，
#   实测报 "unable to guess system type"）
# - 0002: config.sub 加 ohos*/linux-ohos* 接受（三处最小增量）
# - 0003: test_dump_buffered 文件写入段运行时 feature detection（tmpfile() 不可用时跳过，OHOS /tmp 只读）
patches_applied:
  - 0001-config.guess.patch
  - 0002-config.sub.patch
  - 0003-tests-test_dump_buffered-ohos-tmpfile.patch

knowledge_gained:
  - E046 HMDFS umask 077 config.status workaround（沿 libestr 先例）
  - E002 /tmp 只读平台限制影响 C 库 tmpfile()（afdko 同款豁免模式）

test_results:
  make_check: PASS
  total: 22
  pass: 22
  skip: 0
  fail: 0
  note: "上游 tests/Makefile.am 注册 22 目标（21 .test + chk_version）；test_dump_buffered 的 file-write 段为 OHOS 平台限制豁免（in-memory 段仍跑）"

package_contents:
  - lib/libfastjson.a
  - lib/libfastjson.la
  - lib/pkgconfig/libfastjson.pc
  - include/libfastjson/*.h (7 files)
