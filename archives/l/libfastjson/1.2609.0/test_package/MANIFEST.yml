# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfastjson/1.2609.0
homepage: "https://github.com/rsyslog/libfastjson"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试 (make check, 22 注册目标)
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\")"

# 上游实际运行的测试程序 (tests/Makefile.am TESTS 注册, 共 22 项目标)
upstream_tests:
  - test: ucs_copyright_char.test
    description: "Unicode copyright char handling"
  - test: test_float.test
    description: "Float parsing/formatting"
  - test: test_dump_buffered.test
    description: "Buffered dump output"
  - test: test_json_util.test
    description: "File/JSON util functions"
  - test: test_array_api.test
    description: "Array API operations"
  - test: test_fuzz_parser.test
    description: "Fuzz corpus parser replay"
  - test: test_fuzz_serializer.test
    description: "Fuzz corpus serializer replay"
  - test: test1.test
    description: "Basic parse (incl. test1Formatted plain/pretty/spaced variants)"
  - test: test2.test
    description: "Parse case 2 (incl. test2Formatted variants)"
  - test: test4.test
    description: "Parse case 4"
  - test: testReplaceExisting.test
    description: "Replace existing object member"
  - test: test_parse_int64.test
    description: "int64 parse"
  - test: test_cast.test
    description: "Type cast helpers"
  - test: test_parse.test
    description: "Tokener incremental parse"
  - test: test_locale.test
    description: "Locale-dependent number formatting"
  - test: test_charcase.test
    description: "Case sensitivity"
  - test: test_printbuf.test
    description: "Print buffer"
  - test: test_obj_iter-del.test
    description: "Object iterator delete"
  - test: test_object_object_add_ex.test
    description: "object_object_add_ex (incl. Formatted variants)"
  - test: test_many_subobj.test
    description: "Many sub-objects"
  - test: test_obj_obj_get_ex-null.test
    description: "object_get_ex with null"
  - test: chk_version
    description: "Library version consistency check (separate TESTS entry)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "libfastjson consumer round-trip: fjson_tokener_parse, typed accessors (string/int/double/bool), fjson_object_to_json_string re-parse, programmatic object serialize + re-parse"
    command: "./test_libfastjson"

# 测试断言总数 (近似值, 用于质量评估)
# test.c: 4 fields x (get_ex + type check + value check) + round-trip 2x + programmatic 3 + version
assertion_count: 18
