# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmnl/1.0.5
homepage: "https://www.netfilter.org/projects/libmnl/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 说明: libmnl 上游没有可执行测试套件（无 TESTS/runtest）。
# `make check` = check-recursive，实际效果是编译并链接 examples/ 下
# 全部 check_PROGRAMS（genl 2 + kobject 1 + netfilter 6 + rtnl 11
# 共 20 个示例程序，全部链接 libmnl.la；计数实证：
# CI round-05 日志 check 阶段 20 条 CCLD 行），编译+链接通过即上游
# 验证路径；示例执行需要内核 Netlink 数据/CAP_NET_ADMIN，不属于
# make check 的执行范围。
upstream_tests:
  - file: examples/rtnl/rtnl-link-dump.c
    source: libmnl-1.0.5/examples/rtnl/rtnl-link-dump.c
    description: "check_PROGRAMS: compiled+linked against libmnl.la by make check (not executed — upstream has no TESTS runner)"
    command: "make check (compile+link only)"
  - file: examples/genl/genl-family-get.c
    source: libmnl-1.0.5/examples/genl/genl-family-get.c
    description: "check_PROGRAMS: compiled+linked against libmnl.la by make check"
    command: "make check (compile+link only)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test: netlink msg/attr round-trip + mnl_socket_open/bind/get_portid/close"
    command: "./test_libmnl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
