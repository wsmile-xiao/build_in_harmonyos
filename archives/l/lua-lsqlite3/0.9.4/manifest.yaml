software: lua-lsqlite3
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# 构建系统类型（验证脚本必需字段）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/builds/lua-lsqlite3-0.9.4.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 手动创建 Makefile.ohos 编译

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.4.7
    - sqlite3/3.49.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lua-lsqlite3 原始 Makefile 依赖 luarocks，需要手动创建编译脚本"
  - "官方 Savannah URL 返回 404，需要使用 GitHub API URL 下载源码"
  - "OpenHarmony Lua 不支持动态加载模块（缺少 libdl），需要创建静态库"
  - "用户需要将静态库链接到自定义 Lua 解释器才能使用"
  - "lsqlite3 有两个版本：lsqlite3（链接外部 sqlite3）和 lsqlite3complete（内嵌 sqlite3）"
