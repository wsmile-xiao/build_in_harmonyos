# 软件级 manifest
# 文件位置: archives/l/lua-lsqlite3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: lua-lsqlite3
display: "Lua SQLite3 Binding"
description: "Lua 的 SQLite3 数据库绑定，提供完整的 SQLite3 功能访问"
category: lua-library
homepage: "https://github.com/slanska/lsqlite3"
license: MIT

# ============================================================
# 构建信息
# ============================================================

build_system: custom

# ============================================================
# OHOS 适配知识
# ============================================================

ohos_adaptation:
  key_points:
    - "原始 Makefile 依赖 luarocks，需要手动创建 Makefile.ohos"
    - "OpenHarmony Lua 不支持动态加载模块（缺少 libdl）"
    - "需要创建静态库 liblsqlite3complete.a 用于链接"
  common_dependencies:
    - lua
    - sqlite3

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.9.4":
    status: built
    build_date: "2026-06-15"