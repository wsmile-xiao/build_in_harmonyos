software: libtinycbor
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/v7.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "v7.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"

# 构建系统类型（顶层字段，供 checklist 校验）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/intel/tinycbor/archive/refs/tags/v7.0.tar.gz"

  # 源码校验和
  sha256: "8b1b76001b9f987677f2ea7aa814fba1f810ff6cbbffa62ea3bac612c55b1a56"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯CMake项目，无外部依赖，编译简单"
  - "make check需要Qt6测试框架（OHOS未安装），设BUILD_TESTING=OFF跳过"
  - "产物包含静态库libtinycbor.a和cbordump工具"
  - "库链接libm（浮点支持），package_info需声明system_libs"
