# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libtinycbor/v7.0
homepage: "https://github.com/intel/tinycbor"

# 上游测试命令 (需要 Qt6 测试框架，OHOS CI 不可用)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (Qt-based, 跳过)
upstream_tests:
  - file: tests/encoder/tst_encoder.cpp
    source: libtinycbor-v7.0/tests/encoder/tst_encoder.cpp
    description: "CBOR encoder Qt test (requires Qt6, skipped on OHOS)"
    command: "tst_encoder"
  - file: tests/parser/tst_parser.cpp
    source: libtinycbor-v7.0/tests/parser/tst_parser.cpp
    description: "CBOR parser Qt test (requires Qt6, skipped on OHOS)"
    command: "tst_parser"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 编码整数42并解码验证"
    command: "./test_libtinycbor"

# 测试断言总数 (近似值)
assertion_count: 5
