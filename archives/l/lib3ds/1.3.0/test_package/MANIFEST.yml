# test_package/MANIFEST.yml
# Upstream official test declaration file.
# CI build_and_test.sh (L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: lib3ds/1.3.0
homepage: "https://lib3ds.sourceforge.net/"

# ---- Upstream test situation ----
# lib3ds 1.3.0 ships NO formal test suite:
#   - no `TESTS` / `check_PROGRAMS` registration in any Makefile.am
#   - no test/ directory; the only extra source is examples/3dsplay.c,
#     an OpenGL+GLUT viewer demo that is NOT in SUBDIRS (never built)
#     and is not a test. It is excluded from the upstream `make` graph.
# Upstream `make check` therefore runs only automake's default
# (no-op) check target. Consumer validation is carried by test_package/.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ---- Consumer-side test (test_package/) ----
# test.c builds Lib3dsFile / material / mesh / node objects in memory
# (no .3ds file on disk required for the construction path, no GUI),
# then round-trips through lib3ds_file_save/lib3ds_file_load and re-checks
# the reloaded scene. Every CHECK prints a PASS line and is tallied at
# the end as "CHECK passed: N".
test_package_tests:
  - file: test.c
    description: >
      In-memory exercise of the core 3DS API: file lifecycle, material
      create/insert/lookup, mesh point/face lists + bounding box, vector
      math, node create/insert/remove, and a save->load round-trip.
    command: "./test_lib3ds"

# 35 numbered CHECK assertions in test.c.
assertion_count: 35
