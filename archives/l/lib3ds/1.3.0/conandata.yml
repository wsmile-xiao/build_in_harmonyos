# conandata.yml — lib3ds 1.3.0
# Official upstream: Google Code archive (lib3ds project's original host).
# SourceForge project for lib3ds no longer serves the 1.3.0 zip (404);
# the Google Code archive mirrors the canonical lib3ds-1.3.0.zip release.
# SHA256 matches FreeBSD graphics/lib3ds distinfo (official cross-distro record).
#
# 0 patches: OHOS adaptation is done entirely at build time in conanfile.py
# (restore exec bits on the .zip-distributed autotools scripts, replace the
# 2006 `umask 077` with `umask 022`, and install a uname shim that reports
# Linux so the shipped config.guess/config.sub accept the target). Same
# strategy as lame/3.100.

sources:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/lib3ds/lib3ds-1.3.0.zip"
