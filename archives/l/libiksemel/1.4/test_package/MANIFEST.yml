package: libiksemel/1.4
homepage: "https://github.com/meduketto/iksemel"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tst-ikstack.c
    source: iksemel-1.4/test/tst-ikstack.c
    description: "Upstream object stack allocation test"
    command: "./tst-ikstack"
  - file: tst-iks.c
    source: iksemel-1.4/test/tst-iks.c
    description: "Upstream DOM construction and serialization test"
    command: "./tst-iks"
  - file: tst-sax.c
    source: iksemel-1.4/test/tst-sax.c
    description: "Upstream SAX event parsing test"
    command: "./tst-sax"
  - file: tst-dom.c
    source: iksemel-1.4/test/tst-dom.c
    description: "Upstream DOM document parsing test"
    command: "./tst-dom"
  - file: tst-sha.c
    source: iksemel-1.4/test/tst-sha.c
    description: "Upstream SHA-1 digest test"
    command: "./tst-sha"
  - file: tst-md5.c
    source: iksemel-1.4/test/tst-md5.c
    description: "Upstream MD5 digest test"
    command: "./tst-md5"
  - file: tst-filter.c
    source: iksemel-1.4/test/tst-filter.c
    description: "Upstream packet filter rule test"
    command: "./tst-filter"
  - file: tst-jid.c
    source: iksemel-1.4/test/tst-jid.c
    description: "Upstream Jabber ID parsing test"
    command: "./tst-jid"

test_package_tests:
  - file: test.c
    description: "Consumer smoke test covering stack, DOM, SAX, SHA, MD5, base64 and JID"
    command: "test_libiksemel"

assertion_count: 12
