software: libiksemel
version: "1.4"
status: built
build_date: "2026-09-18"
build_system: "autotools"

source:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/iksemel/iksemel-1.4.tar.gz"
  sha256: "458c1b8fb3349076a6cecf26c29db1d561315d84e16bfcfba419f327f502e244"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--without-openssl"
    - "--without-gnutls"
    - "--disable-python"
    - "--disable-shared"
    - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-sub-ohos-aarch64.patch"
  - "0002-configure-umask-022.patch"

knowledge_gained:
  - "iksemel 1.4 是 ANSI C 编写的 XML/Jabber 流解析库，无外部运行时依赖（TLS 与 Python 绑定已显式关闭）"
  - "上游 test/ 目录提供 8 个 make check 测试程序，覆盖 ikstack、DOM、SAX、SHA、MD5、filter 与 JID"
  - "TLS 支持需要 OpenSSL 或 GnuTLS，OHOS 适配关闭后纯解析与 DOM/SAX 功能不受影响"
