software: libiksemel
display: "libiksemel"
description: "Portable XML and Jabber/XMPP stream library in ANSI C"
category: network
homepage: "https://github.com/meduketto/iksemel"
license: "LGPL-2.1-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "关闭 OpenSSL/GnuTLS 与 Python 绑定，保持零外部依赖"
    - "config.sub 识别 aarch64-unknown-linux-ohos 三元组"
    - "configure 临时目录使用 umask 022 适配 HMDFS"
  common_dependencies: []

versions:
  "1.4":
    status: built
    build_date: "2026-09-18"
