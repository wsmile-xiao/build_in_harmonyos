software: latino
display: "Latino"
description: "Interpreter and library for Latino, a programming language with Spanish-syntax keywords built on a bytecode VM"
category: language-runtime
homepage: "https://lenguaje-latino.org/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "E092: 上游所有 install 规则在 if(UNIX) 内，CMake 无 HarmonyOS 平台模块；CMAKE_SYSTEM_NAME 映射 Linux（OHOS clang 定义 __linux__，语义等价）"
    - "musl 空壳 libintl.h + bison YY_→dgettext 序言：补丁把 #ifdef __linux 收紧为 #if defined(__linux) && defined(__GLIBC__)（新通用根因，见 knowledge/DRAFT-latino-1.4.4-musl-empty-libintl-bison-dgettext）"
    - "上游裸 link_libraries(readline)：Conan readline 经 CPATH/LIBRARY_PATH 注入，ncursesw 经 CMAKE_C_STANDARD_LIBRARIES 追加（保持归档顺序）"
    - "公共头 latcompat.h 传染 readline 头：requires 声明 transitive_headers=True + 显式组件传播"
    - "上游静态库含 main()（全平台缺陷）：package() 剥离 latino.o 并回填 filename/parse_silent 全局 stub"
  common_dependencies:
    - readline

versions:
  "1.4.4":
    status: built
    build_date: "2026-09-15"
    conan_ref: "latino/1.4.4"
