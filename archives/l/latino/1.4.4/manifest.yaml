software: latino
version: "1.4.4"
status: built
build_system: cmake
build_date: "2026-09-15"

source:
  # Superproject tarball (GitHub v1.4.4 tag). The GitHub release tarball
  # omits the latino-core submodule; it is restored from the commit pinned
  # by the superproject's .gitmodules (see conandata.yml sources[1]).
  url: "https://github.com/lenguaje-latino/latino/archive/refs/tags/v1.4.4.tar.gz"
  sha256: "ceee73da2992b7e0a9508464941e15197cf28eb2a79b89a3f40c1d18a86a7e01"
  tar_format: tar.gz
  submodule:
    url: "https://github.com/lenguaje-latino/latino-core/archive/3a6ecd46e30352c73ccc97988466e1b25d5baad9.tar.gz"
    sha256: "28d590a3208dceca53e1ef8aab5c05f439f55c8dac1e0c02c6cea09ac163d138"
    restore_path: "latino-core/"

build:
  system: cmake
  generator: Ninja
  dependencies:
    - readline/8.3 (conan, static)  # bare link_libraries(readline) upstream
    - ncurses/6.6 (conan, static, transitive via readline)
  cc: clang
  cxx: clang++
  options:
    - "shared (default True; False packages liblatino.a)"

patches_applied:
  - file: "patches/0001-musl-no-dgettext-in-bison-prologue.patch"
    reason: >
      musl's libintl.h is a stub without dgettext; the bison-generated
      prologue maps YY_ to dgettext under #ifdef __linux (OHOS clang
      defines __linux). Guarded with defined(__GLIBC__) so bison's
      identity fallback applies. See
      knowledge/DRAFT-latino-1.4.4-musl-empty-libintl-bison-dgettext.*

upstream_tests:
  framework: ctest
  total: 1
  executed: 1
  passed: 1
  failed: 0
  skipped: 0
  detail: >
    Upstream registers a single ctest `coverage` (latino
    ejemplos/coverage.lat). Executed in recipe build() with the
    cross-compiled binary running on the OHOS host; exit 0. 64 example
    scripts exist in ejemplos/ (coverage.lat is the one wired to ctest);
    the interpreter is additionally exercised by the consumer
    test_script.lat with 10 exact-output assertions.

consumer_tests:
  library_embedding: >
    latino_embed_test.c links latino::latino and drives the full public
    embed chain latC_crear_mv -> latA_analizar_arch -> latC_analizar ->
    latC_llamar_funcion -> latA_destruir -> latC_destruir_mv on
    embed_script.lat (small, deterministic, strictly bounded loops, no
    recursion); asserts exit 0, the script's computed output line by line
    (6 lines, EMBED_TEST_OK last, printed only after every internal
    check passed), under a subprocess timeout guarding against the known
    upstream VM hang.
  cli_execution: >
    bin/latino runs test_script.lat covering variables, arithmetic,
    strings, lists, dictionaries, functions, si/sino, elegir, mientras,
    desde, list/dic stdlib and imprimirf; output asserted line by line
    (10 checks).
  cli_version: "bin/latino --version prints 'Latino 1.4.4'"

ohos_adaptation:
  key_points:
    - "E092: CMake has no HarmonyOS platform module, if(UNIX) fails and every install rule is dropped; CMAKE_SYSTEM_NAME mapped to Linux (ableton-link precedent)"
    - "musl empty libintl.h + bison YY_ -> dgettext prologue: compile-time implicit declaration, patched with defined(__GLIBC__) guard"
    - "Upstream links a bare -lreadline without find_package; Conan readline injected via CPATH/LIBRARY_PATH, ncurses via CMAKE_C_STANDARD_LIBRARIES (appended after -lreadline, keeps archive order)"
    - "Static packaging: upstream SRC_LIB includes latino.c (defines main()) making the stock static library unusable for embedding; package() strips latino.o and adds a stub with the two public globals (filename, parse_silent) it also defines"
    - "Public latcompat.h includes readline headers under __linux__: declared transitive_headers=True on the requires, so consumers get readline's include dirs through latino::latino"
  known_upstream_bugs:
    - "binary recursion in one expression (f(n-1)+f(n-2)) never returns (VM stack bug, reproduced with upstream ejemplos/11-fibonacci.lat)"
    - "one previously observed desde-loop/function-call pattern can hang the upstream VM; this is not universal, and the desde-loop patterns covered by test_package/embed_script.lat pass"

knowledge_gained:
  - "musl 空壳 libintl.h + bison YY_→dgettext 序言是新的通用 OHOS 根因（DRAFT-latino-1.4.4-musl-empty-libintl-bison-dgettext），区别于 E015(链接期-lintl)/E027(configure NLS)/E531(musl 缺 glibc 符号)"
  - "上游静态库含 main() 是全平台缺陷：剥离对象 + 全局变量 stub 是最小修复"

artifacts:
  shared: ["bin/latino", "lib/liblatino.so"]
  static: ["bin/latino", "lib/liblatino.a"]
