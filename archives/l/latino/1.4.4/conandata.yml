sources:
  - url: "https://github.com/lenguaje-latino/latino/archive/refs/tags/v1.4.4.tar.gz"
    sha256: "ceee73dac20332b6b27789c31c906e2adf56d90f3194904d0ed204d9e0e484a1"
  # GitHub release tarballs do not include submodule content; latino-core is
  # pinned by the upstream superproject to commit 3a6ecd4 (see .gitmodules /
  # gitlink of v1.4.4) and must be fetched separately, then laid out at
  # <source>/latino-core so the root CMakeLists can add_subdirectory it.
  - url: "https://github.com/lenguaje-latino/latino-core/archive/3a6ecd46e30352c73ccc97988466e1b25d5baad9.tar.gz"
    sha256: "28d590a3208dceca53e1ef8aab5c05f439f55c8dac1e0c02c6cea09ac163d138"
patches:
  # musl libintl.h is a stub (no dgettext declaration); the bison-generated
  # prologue maps YY_ to dgettext under #ifdef __linux. Guard with
  # glibc only, so musl uses bison's identity fallback YY_(Msgid) Msgid.
  - patch_file: "patches/0001-musl-no-dgettext-in-bison-prologue.patch"
    patch_type: "portability"
    patch_description: "Skip dgettext mapping of bison YY_ messages on OHOS/musl (empty libintl.h)"
