# test_package/MANIFEST.yml
package: latino
version: 1.4.4
description: >
  Consumer tests for latino/1.4.4 on OHOS. Runs on the OHOS host itself
  (ohos-aarch64), exercising both consumption modes:
    1. library embedding via the public C API (latC_crear_mv,
       latA_analizar_arch, latC_analizar, latC_llamar_funcion,
       latC_destruir_mv — the same chain used by the interpreter main())
       on a small, bounded, recursion-free script whose computed output
       is asserted line by line (6 lines, EMBED_TEST_OK last, under a
       subprocess timeout);
    2. the packaged `latino` CLI running a .lat program that covers
       variables, arithmetic, strings, lists, dictionaries, functions,
       si/sino, elegir, mientras, desde, list/dic standard libraries and
       imprimirf formatting, with output asserted line by line;
    3. `latino --version` output.

  Two upstream VM defects (present in v1.4.4 on real hardware, out of
  adaptation scope) are deliberately avoided by the test script:
    - binary recursion within one expression never returns;
    - one previously observed desde-loop/function-call pattern can hang the VM; the patterns exercised by embed_script.lat pass.
  Sequential and iterative forms are exercised instead.

  Upstream's official test (ctest target `coverage`: latino
  ejemplos/coverage.lat) is executed during recipe build(); results are
  reported via the HMBS_UPSTREAM_TEST_RESULT line in the build log and
  asserted here (discovered=1 executed=1 passed=1).
upstream_tests:
  framework: ctest
  total: 1
  executed: 1
  passed: 1
  failed: 0
  skipped: 0
  notes: >
    Upstream registers a single ctest `coverage` that runs the interpreter
    on ejemplos/coverage.lat (64 non-interactive example scripts exist;
    coverage.lat is the one wired into ctest). Executed in build() with the
    cross-compiled binary running on the OHOS host; exit code 0. The
    interpreter-level language features are additionally covered by the
    consumer test_script.lat with exact-output assertions.
consumer_tests:
  library_embedding: latino_embed_test (CMake consumer, links latino::latino)
  cli_execution: latino test_script.lat (exact-output assertion)
  cli_version: latino --version
ohos_specific:
  runs_on_ohos_host: true
  toolchain: clang 15 (aarch64-linux-ohos, musl)
  system_dependencies: none beyond libc/libm/libdl (readline+ncurses static
    from Conan; linenoise bundled upstream)
