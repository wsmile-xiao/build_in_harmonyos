package: libfshfs
version: "20260130"
homepage: "https://github.com/libyal/libfshfs"
license: LGPL-3.0-or-later
status: built
build_system: autotools
build_date: "2026-09-19"
conan_ref: "libfshfs/20260130"

source:
  url: "https://deb.debian.org/debian/pool/main/libf/libfshfs/libfshfs_20260130.orig.tar.gz"
  sha256: "1d82c19fdbabd2442b37423e847e9a235e402436c1d2444b6920ab1f11912ef6"
  tar_format: tar.gz
  upstream_release_url: "https://github.com/libyal/libfshfs/releases/download/20260130/libfshfs-experimental-20260130.tar.gz"
  upstream_release_url_status: "HTTP 404 (probed 2026-09-19; the GitHub releases API currently lists only 20260802 and 20260826)"
  upstream_commit: "dd100d2ae96b12fe07d7082e94c5ed29319d280e"
  upstream_commit_date: "2026-01-30T18:28:06Z"
  release_artifact: >-
    Debian orig tarball mirror.  Provenance verified twice: (1) the Debian source
    package manifest libfshfs_20260130-1.dsc (Debian Security Tools,
    https://deb.debian.org/debian/pool/main/libf/libfshfs/libfshfs_20260130-1.dsc)
    lists sha256 1d82c19fdbabd2442b37423e847e9a235e402436c1d2444b6920ab1f11912ef6 and
    size 1986111 for libfshfs_20260130.orig.tar.gz, matching the downloaded file
    byte-for-byte; (2) five key files extracted from the tarball (configure.ac,
    Makefile.am, libfshfs/Makefile.am, include/libfshfs.h.in, tests/Makefile.am)
    are identical to the raw files of upstream commit dd100d2a
    (configure.ac reports AC_INIT([libfshfs], [20260130])).  The upstream GitHub
    release asset for 20260130 is no longer published, so no whole-archive
    comparison against an upstream tarball was possible.

build:
  system: autotools
  configure_options:
    - "--disable-python"
    - "--with-libfuse=no"
    - "--enable-static-executables=no"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies: []
  system_libraries:
    - "z (HFS+ decmpfs deflate support; auto-detected by configure.ac from the OHOS SDK sysroot, declared as cpp_info.system_libs)"
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfdatetime
    - libfguid
    - libfmos
    - libhmac
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

patches_applied: []

knowledge_gained:
  # 每条行尾引用最接近的既有条目（写法遵循容器层口径：# knowledge_ref: E### / DRAFT-*）。
  - "发布包自带 config.guess (2024-07-27) 不识别 HarmonyOS（uname -s = HarmonyOS），必须显式传 --build/--host=aarch64-unknown-linux-ohos；自带 config.sub 接受该三元组。"  # knowledge_ref: E007
  - "HMDFS 下 Autoconf 的 umask 077 临时目录不可用；构建期把 configure 里的 umask 077 改成 022，全程 umask 022。"  # knowledge_ref: E011
  - "HMDFS 禁止直接执行源码树脚本；用 CONFIG_SHELL 解释 configure，并给 make check 传 LOG_COMPILER。"  # knowledge_ref: E087
  - "libfshfs 发布包是自包含闭包：16 个本地 libyal 组件 + 生成好的 configure/aclocal.m4/config.guess/config.sub/Makefile.in 全在 tarball 内；配方在 build() 早期校验闭包，缺失即报错，不调用 synclibs.sh。"  # knowledge_ref: E277
  - "libtool 的 check_PROGRAMS 是包装脚本、真实 ELF 在 .libs/：构建期给 tests/test_runner.sh 加 .libs 解析并注入 LD_LIBRARY_PATH（只改测试运行方式，不改上游用例语义）。"  # knowledge_ref: E228
  - "上游 release archive 不含 input/ 夹具：test_fshfsinfo.sh 按上游规则 SKIP（exit 77）；test_library.sh 的 support/volume 在无 input/ 时以无参数模式真实执行并通过。"  # knowledge_ref: E535
  - "N 按 tests/Makefile.am 的 check_PROGRAMS 清点（本版本与上游当前 HEAD 同为 36）；上游 tests/test_tools.sh 两个 runner 列表为空，4 个已注册 tools 程序未被 make check 派发，需用上游 run_test_with_arguments harness 补跑后计入程序级合计。"  # knowledge_ref: E589
  - "包内 HFS+ decmpfs 支持由 configure.ac 自动探测 OHOS SDK sysroot 的 libz.so（SONAME 无版本号）并产生 DT_NEEDED libz.so；配方以 cpp_info.system_libs 显式声明 z。"  # knowledge_ref: E221
  - "上游 release 资产名不能从版本号推断（同族 libfsntfs 用 -experimental-、libvhdi 用 -alpha-），且 libfshfs 的 20260130 资产已下线；设备网络不可达时用 Debian orig 镜像 + 固定 sha256 + 上游 commit 关键文件逐字节核验。"  # knowledge_ref: E335
  - "包内 fshfsinfo/fshfsmount 可执行文件随库安装，但 package_type=library 且 cpp_info 未声明 bindirs，CI L0k 按库类型处理，不新增 commands.json。"  # knowledge_ref: E424
  - "R47 语言预检对本发布包给出 mixed → env_unsupported 是误判：根目录 pyproject.toml 只含 [build-system] requires=setuptools/wheel，属可选 pyfshfs Python 绑定模块的打包清单，不代表主体语言（283 个 .c、3 个 .cpp 全在 ossfuzz/、3 个 .py 为绑定构建脚本与绑定测试辅助）；人工复核留证后继续适配。"  # knowledge_ref: DRAFT-libuninameslist-langpreflight-setuptools-binding-misdetect

tests:
  upstream:
    command: "make check (+ 4 registered tools programs dispatched through the same upstream tests/test_runner.sh harness)"
    counting_unit: "上游 tests/*.c 源文件口径（审方实测口径）"
    declared_n: 39
    source_file_total: 39
    unit_programs: 32
    tools_programs: 4
    program_total: 36
    helper_sources_not_programs: 3
    executed: 36
    passed: 36
    failed: 0
    skipped: 0
    not_run: 0
    registration_count_upstream_head: 36
    runner_cases: 3
    runner_passed: 1
    runner_skipped: 2
    note: >-
      声明 N = 39（上游 tests/*.c 源文件口径，与外部审查实测一致）：其中 36 项为
      tests/Makefile.am 的 check_PROGRAMS 注册测试程序（本版本与上游当前 HEAD 的
      注册数一致，差额 0），已真实执行 36/36 PASS；另 3 项 fshfs_test_functions.c /
      fshfs_test_getopt.c / fshfs_test_memory.c 是各程序 _SOURCES 的共同编译成员
      （Makefile.am:93/125 等引用行），不含独立用例（`grep check_PROGRAMS` 三者均
      无命中），故只计入源文件口径、不计入程序执行数。
      test_library.sh 派发 32 项全部 PASS（tests/test_library.sh.log 有 32 个
      " (PASS)" 行、0 个 " (FAIL)"）；tests/test_tools.sh 在 20260130 把
      TOOLS_TESTS 与 TOOLS_TESTS_WITH_INPUT 都写成空串，4 个已注册的
      fshfs_test_tools_* 程序只被构建、未被派发，配方用上游
      run_test_with_arguments 补跑并全部 PASS；test_fshfsinfo.sh 因发布包不含
      tests/input 按上游规则 exit 77 跳过。automake 汇总（单位是 runner 脚本）：
      TOTAL 3 / PASS 1 / SKIP 2 / FAIL 0 / ERROR 0。test_python_module.sh 仅在
      configure --enable-python 时进入 TESTS，本配方 --disable-python，未参与构建。
  adapted:
    command: "Conan test_package"
    cases: 24
    passed: 24
    pass_rate: "24/24 (100%)"
    breakdown:
      generic_consumer_assertions: 14
      harmony_specific_assertions: 10
    note: >-
      通用消费者断言覆盖版本串、读访问标志、LIBFSHFS_OPEN_READ 一致性、
      codepage 默认值/往返/错误路径、HFS+ 与 HFS 签名正例、非 HFS 反例、
      缺失文件错误路径、volume 初始化/打开失败/释放；鸿蒙专项断言覆盖
      __OHOS__ 与版本宏编译期守卫（2 个）、版本串、可写且非 /tmp 的 TMPDIR、
      临时文件名构造与 mkstemp、读写往返、清理，以及设备上合成 1536 字节
      HFS+ 夹具（偏移 1024 处 "H+"）的正向签名识别。

blockers: []

path_b:
  status: requested
  type: reusable_knowledge
  candidate: "knowledge/drafts/E589-draft-libfshfs-check-programs-runner-dispatch"
  claimed_entry: "E589"
  evidence: "knowledge/drafts/E589-draft-libfshfs-check-programs-runner-dispatch.md"
  novelty: >-
    Automake 的 make check 只计入 TESTS runner，而 N 的清点单位是
    check_PROGRAMS 注册数：当上游 runner 的内部列表为空时，已注册程序会被
    构建但不被派发（automake 只记 runner SKIP），出现 3 / 32 / 36 三个都
    "正确"却互不相同的数字。条目给出清点、取数位置（tests/<runner>.log 而非
    test-suite.log）、用上游 harness 补跑与分栏申报的完整口径。
  differs_from:
    - "DRAFT-10251-libnfc-tools-1.8.0-autotools-test-framework-guard 处理 configure 守卫把测试目标整体排除（TOTAL: 0，根本没构建），本条是已构建、已注册但未被 runner 派发。"
    - "DRAFT-no-upstream-tests-drive-real-interface 处理上游确无测试套件的情形，本条上游有 36 个注册程序。"
    - "DRAFT-libfsntfs-release-archive-closure 处理发布包闭包与镜像回退，本条只主张注册数 ↔ 派发数的计数与补跑口径。"

