knowledge_gained:
  - "OHOS libc open_memstream 在 fclose 前必须显式 fflush，否则缓冲不终化（空输出）——凡经 open_memstream 序列化的库函数（to_json/typestring/docstring）都要 fflush"
  - "OHOS libc 无 GNU program_invocation_short_name 符号，CLI 需自声明定义并从 argv[0] 播种"

