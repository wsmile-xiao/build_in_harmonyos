# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libvarlink/24.0.1
homepage: "https://github.com/varlink/libvarlink"

# 上游测试命令 (meson test --list 分析, 326 项注册)
upstream_check_command: "meson test --list"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (8 C/脚本测试 + 318 JSON 数据用例, 双口径见 reports/test-report.md)
upstream_tests:
  - file: lib/test-array.c
    source: libvarlink-24.0.1/lib/test-array.c
    description: "JSON 数组 API 测试"
    command: "./test-array"
  - file: lib/test-avl.c
    source: libvarlink-24.0.1/lib/test-avl.c
    description: "AVL 树测试 (链接 libm)"
    command: "./test-avl"
  - file: lib/test-error.c
    source: libvarlink-24.0.1/lib/test-error.c
    description: "错误码测试"
    command: "./test-error"
  - file: lib/test-interface.c
    source: libvarlink-24.0.1/lib/test-interface.c
    description: "接口解析/docstring 测试 (fflush 补丁后通过)"
    command: "./test-interface"
  - file: lib/test-type.c
    source: libvarlink-24.0.1/lib/test-type.c
    description: "类型系统 typestring 测试 (fflush 补丁后通过)"
    command: "./test-type"
  - file: lib/test-server-client.c
    source: libvarlink-24.0.1/lib/test-server-client.c
    description: "unix socket 服务端/客户端端到端测试 (fflush 补丁后通过)"
    command: "./test-server-client"
  - file: lib/test-json.c
    source: libvarlink-24.0.1/lib/test-json.c
    description: "JSON 解析器数据驱动测试 (103 y_ + 215 n_ JSON 用例; fflush 补丁后 y_ 103/103 通过)"
    command: "./test-json <tests-json/y_*.json|n_*.json>"
  - file: lib/test-symbols.sh
    source: libvarlink-24.0.1/lib/test-symbols.sh
    description: "导出符号对照 libvarlink.sym 测试"
    command: "./test-symbols.sh"
  - file: lib/test-object.c
    source: libvarlink-24.0.1/lib/test-object.c
    description: "对象序列化测试 — 因设备无 de_DE.UTF-8 locale 数据未通过(平台阻塞, 恢复条件: 安装 locale 数据)"
    command: "./test-object"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: varlink object API 构造/序列化/反序列化往返, 验证公开 API 可用"
    command: "./test_libvarlink"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 326
