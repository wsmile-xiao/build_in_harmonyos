# test_package/MANIFEST.yml
# 上游官方测试声明文件 — libspecbleach 0.4.1
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 测试清单来源: 官方 v0.4.1 tag 源码 tests/ 目录 + CMakeLists.txt
#   add_specbleach_test 注册的 CTest 入口 (ctest -N 实测 41 项，39 项于配方内运行，
#   另 2 项 test_audio_file_regression / test_integration_realworld_quality 需
#   libsndfile，配方内未实例化；本机含 libsndfile/1.2.2 时全量 41/41 通过)

package: libspecbleach/0.4.1
homepage: "https://github.com/lucianodato/libspecbleach"

# 上游测试命令 (ctest -N 实测: 41 项注册)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试 (ctest 全量运行)
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j 1"

# 上游实际运行的测试程序 (CMake 注册名 → 源文件)
upstream_tests:
  - file: tests/test_utils.c
    source: libspecbleach-0.4.1/tests/test_utils.c
    description: "共享工具函数单测"
    command: "./test_utils"
  - file: tests/test_integration.c
    source: libspecbleach-0.4.1/tests/test_integration.c
    description: "整体集成流程单测"
