# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.1"

# 软件名
software: "libspecbleach"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lucianodato/libspecbleach"

  # 源码校验和
  sha256: "76ae2cbf43397dc7f4f646a28d75a83ab3786211fb2daf8167dcf97de58568bd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "conan 预编译依赖包 .pc 内嵌构建机缓存绝对路径(.cache/conan2/p/b/...)失效，sed 修复副本 + PKG_CONFIG_PATH 重定向可恢复被跳过的上游测试入口 (DRAFT-libspecbleach-0.4.1-conan-prebuild-pc-stale-cache-path)"
- "W3 junk_check full 整仓扫描命中其他库基线状态文件时，git rm --cached 隔离→复跑→git add -f 恢复，SHA-256 前后一致 (复用 DRAFT-fastnoiselite)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
