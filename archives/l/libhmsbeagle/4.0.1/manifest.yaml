version: "4.0.1"
software: "libhmsbeagle"
status: "built"
build_date: "2026-09-18"
build_system: "cmake"

source:
  url: "https://github.com/beagle-dev/beagle-lib/archive/refs/tags/v4.0.1.tar.gz"
  sha256: "9d258cd9bedd86d7c28b91587acd1132f4e01d4f095c657ad4dc93bd83d4f120"
  tar_format: "tar.gz"

build:
  system: "cmake"
  configure_options:
    - "-DBUILD_CUDA=OFF"
    - "-DBUILD_OPENCL=OFF"
    - "-DBUILD_JNI=OFF"
    - "-DBUILD_SSE=OFF"
    - "-DBEAGLE_OPTIMIZE_FOR_NATIVE_ARCH=OFF"
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied: []

knowledge_gained:
  - "BEAGLE_OPTIMIZE_FOR_NATIVE_ARCH defaults true and injects -march=native; must be disabled on OHOS for portable aarch64 builds."
  - "Upstream add_library SHARED hardcodes shared; patch to bare add_library so BUILD_SHARED_LIBS is respected."
  - "OHOS has no CUDA/OpenCL/JDK and no x86 SSE intrinsics; CPU-only build (BUILD_CUDA/OFF OPENCL/OFF JNI/OFF SSE/OFF)."

homepage: "https://github.com/beagle-dev/beagle-lib"
license: "MIT"

tests:
  upstream:
    command: "ctest --output-on-failure"
    cases: 1
    passed: 0
    note: "Upstream ctest registers hmctest (examples/CMakeLists.txt add_test hmctest); awaiting HarmonyOS aarch64 preflight evidence."
  adapted:
    command: "test_package/test_libhmsbeagle"
    cases: 3
    passed: 0
    pass_rate: "pending preflight"
