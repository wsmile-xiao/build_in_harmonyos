package: libhmsbeagle/4.0.1
homepage: "https://github.com/beagle-dev/beagle-lib"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests_exist: true
upstream_test_framework: "ctest"
upstream_test_count: 1
upstream_test_total: 1
upstream_test_count_method: "ctest_entries"
upstream_test_audit: "audited beagle-lib v4.0.1 source tree: examples/CMakeLists.txt registers exactly 1 ctest case via add_test(hmctest hmctest) (hmctest.cpp builds a small 3-taxon likelihood model on the CPU plugin and verifies the log-likelihood numerically); examples/synthetictest is a helper executable not registered as a ctest case; tests/run_tests.sh is a shell-driven benchmark/comparison script requiring BEAST/R datasets, not wired into ctest, hence excluded from the pass-rate denominator. OHOS adaptation (2026-09-19): examples/hmctest/hmctest.cpp hardcodes 'bool useSSE = true' requiring BEAGLE_FLAG_VECTOR_SSE, but the recipe builds CPU-only (BUILD_SSE=OFF, only VECTOR_NONE plugin) and BeagleCPUSSEPlugin::check_sse2() returns false on aarch64 GNU, so instance creation always fails on ARM64; source() flips that one line to 'useSSE = false' so the same 3-taxon model runs on the shipped CPU (VECTOR_NONE) path with no assertions removed."
upstream_tests:
  - file: examples/hmctest/hmctest.cpp
    source: beagle-lib-4.0.1/examples/hmctest/hmctest.cpp
    description: "Upstream ctest hmctest: builds small 3-taxon likelihood model on CPU and verifies log-likelihood"
    command: "./hmctest"
test_package_tests:
  - file: test.c
    description: "Consumer smoke: beagleGetVersion/beagleGetCitation/beagleGetResourceList 3 checks (CHECK-OK counted)"
    command: "./test_libhmsbeagle"
assertion_count: 3
