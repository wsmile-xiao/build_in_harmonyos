software: libhmsbeagle
display: "libhmsbeagle"
description: "High-performance library for evaluating phylogenetic likelihoods of sequence evolution (BEAGLE)"
category: data
homepage: "https://github.com/beagle-dev/beagle-lib"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CPU-only build on OHOS aarch64: BUILD_CUDA/OFF OPENCL/OFF JNI/OFF SSE/OFF"
    - "Disable BEAGLE_OPTIMIZE_FOR_NATIVE_ARCH to avoid -march=native"
    - "Headers install to include/libhmsbeagle-1; consumers include <libhmsbeagle/beagle.h>"
  common_dependencies: []

versions:
  "4.0.1":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libhmsbeagle/4.0.1"
