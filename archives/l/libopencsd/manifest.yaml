software: libopencsd
display: "OpenCSD"
description: "ARM CoreSight trace decode library (OpenCSD) — decodes ARM CoreSight trace streams (ETMv3/ETMv4/ETE/PTM/STM) into generic trace elements, with a stable C API"
category: system
homepage: "https://github.com/Linaro/OpenCSD"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "自定义 Makefile 构建（decoder/build/linux/makefile + unix_common/makefile.common），无 configure；编译器经 make 变量 MASTER_CC/MASTER_CXX/MASTER_LINKER/MASTER_LIB 注入（R33，取值自 Conan conf tools.build:compiler_executables）"
    - "OHOS 上测试可执行文件需 HNP binary-sign-tool 签名后方可 exec（HarmonyOS 内核要求 ELF 带 .codesign 段）；.so 库无需签名即可作为 DT_NEEDED 在 exec 时加载（CI worker 对用户目录 .so 的 dlopen 存在平台限制，见 E502）"
    - "上游测试为 3 个 bash 脚本声明的 61 个命令行测试场景，无正式测试框架；本地/CI 用驱动器逐场景执行并检查 rc"
    - "macOS 本地验证用 -install_name 且去掉 -Wl,-z,defs（ld64 不支持 -soname/-z）；OHOS/CI 保持上游链接参数（lld 支持）"
  common_dependencies: []

versions:
  "1.5.5":
    status: built
    build_date: "2026-09-17"
    packaging: conan
    notes: |
      首次适配。纯 C++11/POSIX 库，无外部依赖；仅需注入 OHOS 工具链与测试签名。
      上游测试 61 场景全部运行通过；鸿蒙特有测试 1 项（OHOS ELF/SONAME/dlopen 校验）。
    provides:
      - libopencsd.so.1
      - libopencsd_c_api.so.1
