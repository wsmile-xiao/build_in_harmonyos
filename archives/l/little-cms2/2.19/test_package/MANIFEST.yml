# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（little-cms2 2.19，源码实测）：
#
#   upstream_test_targets = 1
#       testbed/Makefile.am:10  check_PROGRAMS = testcms
#       → 唯一的上游测试程序
#
#   upstream_test_files    = 3
#       testbed/Makefile.am:19  testcms_SOURCES = testcms2.c testplugin.c zoo_icc.c testcms2.h
#       → 3 个源文件（testcms2.c 是 9928 行的主测试体；testplugin.c 提供插件实现；
#         zoo_icc.c 只在 Windows 分支被调用）+ 1 个头文件
#       注：testbed/ 下另有 testthread.cpp / alpha_test.c / meson.build，
#       但它们不在 testcms 的 SOURCES 里，不计入上游测试文件数。
#
#   upstream_case_total    = 163   （**可靠枚举**，非 UNKNOWN）
#       依据：testbed/testcms2.c 的 main() 注册块中形如
#           Check("用例名", Fn);
#       的调用共 163 处（`grep -cE '^\s*Check\("'`，已扣除注释行与函数定义行）。
#       testcms 的 Check() 实现：成功时不打印内容，失败时打印 "FAIL!" 并自增
#       TotalFail；main() 以 TotalFail 作为退出码。故"退出码 0" == 全部通过。
#
#   ⚠️ 默认执行 157 条：其中 6 条（Exhaustive 1D/3D 插值扫描）在
#       `if (Exhaustive)` 运行时开关之后，而该开关只由 `./testcms --exhaustive`
#       打开（testcms2.c:9651）。**因此本配方在 build() 里显式传 --exhaustive**，
#       覆盖全部 163 条 —— 不把 157 冒充成总数，也不把注册数 163 当作已执行数。
#
#   ⚠️ out-of-source 陷阱：上游 `check:` 规则会先
#       `cp $(top_srcdir)/testbed/*.ic? $(top_builddir)/testbed`
#       （testbed/Makefile.am:33）。直接跑 ./testcms 会跳过这一步，
#       于是停在第一条读 profile 的用例并报 "File 'crayons.icc' not found"。
#       本配方显式补做了同样的拷入。

package: little-cms2/2.19
homepage: "https://github.com/mm2/Little-CMS"

upstream_check_command: "make check   # testbed 里的 check: 规则执行 ./testcms"
upstream_test_in_build: true
upstream_test_command: "./testcms --exhaustive   # 163 条全量"

upstream_tests:
  - file: testbed/testcms2.c
    source: "testbed/Makefile.am:19（testcms_SOURCES）+ testcms2.c main() 的 163 处 Check(\"…\") 注册"
    description: "唯一的上游测试程序 testcms：163 条 Check 用例覆盖 profile 读写、颜色空间转换、插件体系、多语言标签、内存调试等；build() 内以 --exhaustive 运行全部 163 条"
    command: "./testcms --exhaustive"

test_package_tests:
  - file: src/test_lcms2.c
    description: "C99 消费者链接安装后的 liblcms2，做真实色彩管理往返：断言 cmsGetEncodedCMMversion()==LCMS_VERSION==2190、cmsCreate_sRGBProfile()/cmsCreateLab4Profile() 成功、RGB→Lab 变换可建，并验证白点映射到 L*≈100 / a*≈b*≈0、黑点 L*≈0（R34 真实 API 调用）"
    command: "./test_lcms2"
  - file: test_package/conanfile.py
    description: "另有 CLI 冒烟：linkicc/transicc/psicc 由上游 install 规则装入 bin/（软件级 commands.json 声明）"
    command: "（安装产物）"

assertion_count: 11
