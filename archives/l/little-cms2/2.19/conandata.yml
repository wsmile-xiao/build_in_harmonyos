# conandata.yml — little-cms2 2.19
# Source: official upstream repository (tag lcms2.19).
# sha256 computed from the downloaded tarball.

sources:
  url: "https://github.com/mm2/Little-CMS/archive/refs/tags/lcms2.19.tar.gz"
  sha256: "6acc3eb5fac194acc85331194133ad1d4a60419dad16b3bc225a7d27380a5b3a"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognise the aarch64-unknown-linux-ohos triple (the shipped script is the 2018-02-24 release, which knows neither __OHOS__ nor uname -s == HarmonyOS); also guards the <features.h> probe so it is not reached on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept ohos-linux / linux-ohos as a valid cpu-os-kernel combination"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: create the private config.status temp dir with umask 022 instead of 077 — on the OHOS HMDFS the 077 permissions leave that directory unusable for the rest of the run"
    patch_type: "portability"
