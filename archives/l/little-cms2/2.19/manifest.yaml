version: "2.19"
software: little-cms2
status: built
build_date: "2026-09-21"
build_system: autotools

source:
  url: "https://github.com/mm2/Little-CMS/archive/refs/tags/lcms2.19.tar.gz"
  sha256: "6acc3eb5fac194acc85331194133ad1d4a60419dad16b3bc225a7d27380a5b3a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared --enable-static（options.shared 默认 False）"
    - "--without-jpeg --without-tiff：跳过依赖 libjpeg/libtiff 的 jpgicc/tificc 工具"
    - "--without-zlib：不依赖 zlib（ICC profile 压缩特性关闭）"
  dependencies: []

patches_applied:
  - "patches/0001-config.guess.patch"
  - "patches/0002-config.sub.patch"
  - "patches/0003-configure.patch"

knowledge_gained:
  - "Conan 的 Autotools.configure() 是**从 build 目录**调用 \"<source>/configure\"，因此 Makefile 生成在 build 目录（out-of-source），紧接的 autotools.make()/install()（默认也在 build 目录）才能找到它。这与『上游只有 makefile、没有 configure』的项目正好相反——那种项目必须用 self.run(\"make\", cwd=self.source_folder)"
  - "little-cms2 的 testbed 在 out-of-source 构建下必须先执行上游 check: 规则里的 cp $(top_srcdir)/testbed/*.ic? $(top_builddir)/testbed；直接跑 ./testcms 会卡在第一条读 profile 的用例并报 \"File 'crayons.icc' not found\"，只跑完 88/163 后退出码 1"
  - "testcms 的 163 条用例里有 6 条（Exhaustive 1D/3D 插值扫描）位于 if (Exhaustive) 运行时开关后，默认只跑 157 条；./testcms --exhaustive 才覆盖全量。用例总数以源码注册数为准（163），执行数由日志实测回填"
  - "little-cms2 2.19 的 config.guess 是 2018-02-24 版：Linux|GNU 分支的 dummy.c 只有 uclibc/dietlibc/gnu 三个分支、无条件 include <features.h>，且没有 *:HarmonyOS:*:* 的 uname 分支。补丁要把 __OHOS__ 探测放在 <features.h> 之前并用 #else 包住原有分支"
  - "testbed 的 testcms 以 -static 全静态链接（testcms_LDFLAGS = -static，因为要用未导出的库内部符号）。已实测 OHOS SDK sysroot 里存在 aarch64-linux-ohos/libc.a，因此 -static 在 OHOS 上可用，无需改上游 Makefile"
  - "cmsGetEncodedCMMversion() 在 2.19 返回 2190，与头文件宏 LCMS_VERSION 一致，是 test_package 最省事的版本断言点"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /tmp/prep/lc/a
  source_work_dir: /tmp/prep/lc/b
  generated_at: '2026-09-21T18:55:00'
  patches_count: 3

patch_classification:
