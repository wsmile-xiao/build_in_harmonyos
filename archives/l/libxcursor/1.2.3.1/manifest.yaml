knowledge_gained:
  - "libXcursor's configure runs PKG_CHECK_MODULES(XCURSOR, xrender >= 0.8.2 xfixes x11 fixesproto); xrenderproto/fixesproto are headers-only from xorgproto/2025.1, and libXcursor_la_LIBADD = $(XCURSOR_LIBS) links -lXrender -lXfixes -lX11."
  - "OHOS autoconf works-check trap (critical): OHOS workers' clang cannot *run* the conftest binary.  Native configure (--build == --host) tries to execute conftest and fails 'C compiler cannot create executables'; running configure with --host=aarch64-linux-ohos (config.guess reports aarch64-unknown-linux-ohos, so build != host) enters cross_compiling=yes where conftest is only LINKED, not run, and passes.  Proven in a single CI batch where libxrender passed in cross mode while libxcursor failed in native mode on the same worker."
  - "config.guess/config.sub patches are MANDATORY (ported from libxrender/0.9.12): unpatched config.guess does not recognize HarmonyOS and falls through to the generic Linux probe that COMPILES a dummy.c under TMPDIR, which the OHOS worker sandbox blocks ('can't create .../dummy.c: Permission denied' -> 'cannot guess build type').  Patch 0002 inserts a HarmonyOS branch (uname -s == HarmonyOS -> echo aarch64-unknown-linux-ohos; exit) before the NetBSD case so no dummy.c is needed; patch 0001 adds ohos* to the valid-OS list and linux-ohos* to the kernel-os check.  Hunks were adapted to libxcursor's config.guess/config.sub versions (2022-01-09 / 2022-01-03)."
  - "Dependency track trap: libxrender/0.9.12 pins libx11/1.8.13 in its recipe while libxfixes/6.1.0 and libxext/6.4.0 pin libx11/6.4.0.  The consumer must force libx11/6.4.0 so libxfixes/libxext hit their published binaries; libxrender/0.9.12 then rebuilds against 6.4.0 (its relocatable-libtool-metadata linker view supports it).  Forcing 1.8.13 instead is fatal: libX11.la on the 1.8.13 track references libxcb.la, and libxcb/1.16 ships no .la, so the transitive libxext/6.4.0 source rebuild fails libtool with \"is not a valid libtool archive\"."
  - "-version-number 1:0:2 -> libXcursor.so.1 / libXcursor.so.1.0.2; XCURSOR_LIB_VERSION = 1*10000 + 2*100 + 3 = 10203."
  - "libXcursor.so.1 exports 61 non-macro Xcursor* functions from X11/Xcursor/Xcursor.h; XcursorTrue/XcursorFalse are #defines (not linkable symbols)."
  - "XcursorImage is 7 CARD32 fields (version/size/width/height/xhot/yhot/delay) + a trailing XcursorPixel* pointer; the pointer is 8-byte aligned on LP64 so offsetof(pixels)=32 (sizeof=40 on aarch64) and only 4-byte aligned on ILP32 (offsetof=28, sizeof=36), which is why the ABI check asserts offsetof(pixels) >= 28 and pins the total size via the alignment-independent relation sizeof == offsetof(pixels) + sizeof(XcursorPixel*)."
  - "XcursorCursors is { Display *dpy; int ref; int ncursor; Cursor *cursors; } — cursors is the last member and is pointer-aligned, so sizeof(XcursorCursors) == offsetof(cursors) + sizeof(Cursor*) holds on both ILP32 (16) and LP64 (24) with no trailing padding."
