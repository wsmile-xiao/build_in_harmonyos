package: libsvm
version: "3.37.1.1"

upstream:
  build_system: makefile
  test_type: none
  test_command: "svm-scale heart_scale; svm-train heart_scale; svm-predict <test-data> <model> <output>"
  test_directory: "."
  detail: "上游无 make check/ctest 等自动化套件；README 提供 heart_scale 缩放、训练和预测示例流程。"

ohos_compatibility:
  status: full
  detail: "保留上游 README 命令行示例边界，并增加共享库消费者 API 验证。"
  verified_features:
    - "svm-scale 数据缩放"
    - "svm-train 线性核训练"
    - "svm-predict 模型预测"
    - "C++ API 参数校验、训练、预测、模型保存与加载"

conan_test:
  type: integration
  description: "2 个真实消费者测试：README 命令行端到端流程与 C++ API 模型生命周期。"
  test_method: "conan create 自动编译并执行 test_libsvm，随后运行 svm-scale/svm-train/svm-predict。"
