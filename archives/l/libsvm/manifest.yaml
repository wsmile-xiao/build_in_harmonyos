software: libsvm
display: "libsvm"
description: "支持向量机（SVM）库——分类/回归/单类分类，C/C++ 共享库 + svm-train/svm-predict/svm-scale 命令行工具"
category: library
homepage: "https://www.csie.ntu.edu.tw/~cjlin/libsvm/"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 默认 g++——配方显式 CXX=clang++（HarmonyOS 平台无 g++）"
    - "无 install 目标——package() 手动复制 bin/lib/include（模式 B）"
    - "命令行工具无 --version 参数——版本以 svm.h LIBSVM_VERSION=337 确认"
    - "上游无官方测试入口（无 make check/ctest）——test_package 冒烟 + 鸿蒙特有 4 用例（线性核训练预测/模型保存加载往返/RBF 决策函数/版本断言）"
  common_dependencies: []

versions:
  "3.37":
    status: built
    build_date: "2026-06-10"
    conan_ref: "libsvm/3.37"
  "3.37.1":
