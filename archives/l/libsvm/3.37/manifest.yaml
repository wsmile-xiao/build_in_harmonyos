software: libsvm
version: "3.37"
status: published
compile_date: "2026-06-10"
build_system: makefile

source:
  url: "https://www.csie.ntu.edu.tw/~cjlin/libsvm/libsvm-3.37.tar.gz"
  sha256: "1fa553edc776be3d62fab4607b96ffa505093ea6e3e759a4c7f96294ff75e29a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CXX=clang++"
    - "CFLAGS=-Wall -Wconversion -O3 -fPIC"
    - "make all lib"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

products:
  binaries:
    - name: svm-train
      size: 88576
      description: "SVM training tool"
    - name: svm-predict
      size: 84480
      description: "SVM prediction tool"
    - name: svm-scale
      size: 31104
      description: "SVM data scaling tool"
  libraries:
    - name: libsvm.so.4
      size: 84416
      soname: "libsvm.so.4"
      description: "SVM core algorithm shared library"
  headers:
    - name: svm.h
      size: 3454
      description: "SVM library public header file"

package:
  name: "libsvm-3.37-ohos-aarch64.tar.gz"
  size: 450136
  contents:
    - "bin/svm-train"
    - "bin/svm-predict"
    - "bin/svm-scale"
    - "lib/libsvm.so.4"
    - "lib/libsvm.so"
    - "include/svm.h"

knowledge_gained:
  - "libsvm uses simple Makefile, no configure/autotools, no install target"
  - "Need manual install to DESTDIR: mkdir + cp svm-train/svm-predict/svm-scale + cp svm.h + cp libsvm.so.4"
  - "CXX=g++ needs override to CXX=clang++ on HarmonyOS platform"
  - "make all builds executables, make lib builds shared library libsvm.so.4"
  - "libsvm tools have no --version flag, version confirmed via svm.h LIBSVM_VERSION=337"
  - "Shared library depends only on libc++_shared.so and libc.so"
