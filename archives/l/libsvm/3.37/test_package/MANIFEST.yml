# test_package/MANIFEST.yml — libsvm 3.37
# 上游官方测试来源声明
# CI L1 门禁通过此文件确定上游测试类型和执行方式
# 参考: ARCHIVE-SPEC.md §2 test_package/ 规范 + ci/conan/build_and_test.sh L1 检测逻辑

package: libsvm
version: "3.37"

# 上游构建系统（CI 据此选择测试执行方式）
upstream:
  build_system: makefile
  # 测试类型: make_check | ctest | meson_test | pytest | none
  # libsvm 无 make check / ctest 入口，仅提供 svm-train/svm-predict/svm-scale 工具
  test_type: none
  # 上游官方测试命令
  test_command: "make all lib"
  # 测试工作目录（相对于源码根目录）
  test_directory: "."

# OHOS 平台兼容性
ohos_compatibility:
  # full | partial | none | unknown
  status: full
  detail: "svm-train/svm-predict/svm-scale 全部功能正常，libsvm.so.4 共享库加载正常"
  verified_features:
    - "svm-train heart_scale 训练（162次迭代收敛，nSV=132）"
    - "svm-predict 预测（准确率 86.67%）"
    - "svm-scale 数据缩放（270行输出正常）"
    - "线性核/多项式核训练均成功"
    - "libsvm.so.4 共享库 SONAME 正确，依赖仅 libc++_shared.so + libc.so"

# Conan test_package 测试（L1 最小冒烟测试，CI 通过 conan create 自动执行）
conan_test:
  type: api_check
  description: "调用 svm_check_parameter() 验证 libsvm 库 API 可用性"
  test_method: "svm_check_parameter(&prob, &param) 返回 NULL 表示参数校验通过"

# 鸿蒙特有测试（新增，针对 HarmonyOS 平台特性）
ohos_specific_test:
  file: test_libsvm_ohos.cpp
  cases: 4
  description:
    - "LIBSVM_VERSION==337 版本断言（HarmonyOS 工具链头文件身份）"
    - "C_SVC+LINEAR 训练 + svm_predict 2D 线性可分数据集 40/40 全对"
    - "svm_save_model/svm_load_model 真文件往返，预测一致性 40/40"
    - "C_SVC+RBF 训练 + svm_predict_values 决策函数有限且标签正确"
  test_method: "真实调用被测库 API（训练/预测/文件 IO/决策函数），非 mock"
