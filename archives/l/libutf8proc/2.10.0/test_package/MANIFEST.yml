# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libutf8proc/2.10.0
homepage: "https://github.com/JuliaStrings/utf8proc"

# 上游测试命令（Makefile 提供 check 目标）
upstream_check_command: "make check  # 需要 test data (NormalizationTest.txt 等)，CI 无网络拉取"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test/ 目录）
upstream_tests:
  - file: normtest.c
    source: utf8proc-2.10.0/test/normtest.c
    description: "Unicode 规范化测试（需要 NormalizationTest.txt 数据文件）"
    command: "./normtest"
  - file: graphemetest.c
    source: utf8proc-2.10.0/test/graphemetest.c
    description: "字素簇边界测试（需要 GraphemeBreakTest.txt 数据文件）"
    command: "./graphemetest"
  - file: charwidth.c
    source: utf8proc-2.10.0/test/charwidth.c
    description: "字符宽度测试"
    command: "./charwidth"
