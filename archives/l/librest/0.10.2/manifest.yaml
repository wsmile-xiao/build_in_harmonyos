software: librest
version: "0.10.2"
status: built
build_date: "2026-09-17"
build_system: meson

source:
  url: "https://download.gnome.org/sources/librest/0.10/librest-0.10.2.tar.xz"
  sha256: "7b6cb912bb3a22cfa7dcf005925dcb62883024db0c09099486e7d6851185c9b8"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Ddefault_library=shared"
    - "-Dwrap_mode=nofallback"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Dexamples=false"
    - "-Dgtk_doc=false"
    - "-Dsoup2=false"
    - "-Dtests=true"
  dependencies:
    - "glib2/2.88.0"
    - "glib/2.84.0.1.1"
    - "libsoup3/3.6.5-r3"
    - "json-glib/1.10.6"
    - "libxml2/2.15.3"
    - "pcre2/10.45"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Cross-built OHOS/aarch64 Meson tests require an independent native host harness; exit 77 or Exec format error is not a pass."
  - "Network-backed upstream tests need a task-private deterministic fixture when the public endpoint times out; fixture evidence remains host-only and outside the target payload."
  - "Conan override requirements do not create direct PkgConfigDeps metadata; a directly consumed, version-forced dependency needs force=True and a rebuilt provider revision."
  - "An override GLib provider cannot satisfy component direct metadata; keep the actual glib2 direct provider and component for GLib/GObject symbols, add the real pcre2 generator closure, and bind the final Conan run to the recipe hash."

knowledge_ref:
  - "E605"
  - "E6339"
