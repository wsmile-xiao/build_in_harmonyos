software: libjxl-tools
display: "libjxl-tools"
description: "JPEG XL 参考实现命令行工具：cjxl（编码）、djxl（解码）、jxlinfo（容器信息）"
category: image
homepage: "https://github.com/libjxl/libjxl"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建；HarmonyOS PC (arm64) 原生编译，CMAKE_SYSTEM_NAME 覆盖为 Linux（同 highway 配方做法）"
    - "发布 tarball 不含 git 子模块：skcms（内置色彩管理，JPEGXL_ENABLE_SKCMS=ON）在 source() 阶段按上游锁定 commit 下载到 third_party/skcms"
    - "依赖已发布：brotli/1.2.0（动态）+ highway/1.3.0.2（静态）+ libpng/1.6.58（动态，传递 zlib/1.3.1.1）；lcms2 未发布，通过 skcms 规避"
    - "PNG 为【必需】依赖（libjxl extras 无条件 find_package(PNG)）；generate() 注入 PNG_PNG_INCLUDE_DIR/PNG_LIBRARY/ZLIB_INCLUDE_DIR/ZLIB_LIBRARY 把 CMake FindPNG/FindZLIB 钉到 Conan 包，避免偶合宿主 /usr/local"
    - "brotli、libpng16 共享库随包安装到 lib/；ohpcd zlib 纯静态，另由 libz.a 合成 libz.so 随包分发；烘焙 $ORIGIN/../lib RPATH，包自包含（env -i 可运行）"
    - "内建 libjxl 静态链接（BUILD_SHARED_LIBS=OFF），JPEGXL_STATIC 保持 OFF（避免 -static 强制动态 brotli 静态化）；工具二进制与随包 .so 需 binary-sign-tool 签名"
    - "其余可选编解码（JPEG/GIF/WebP/OpenEXR/jpegli）禁用，PPM/PFM/PNG 编解码可用"
  common_dependencies:
    - brotli/1.2.0
    - highway/1.3.0.2
    - libpng/1.6.58
    - zlib/1.3.1.1

versions:
  "0.11.2":
    status: built
    build_date: "2026-09-25"
    release_date: "2026-02-10"
    url: "https://github.com/libjxl/libjxl/archive/refs/tags/v0.11.2.tar.gz"
