# 版本级 manifest
# libjxl-tools 0.11.2 (JPEG XL command-line tools: cjxl / djxl / jxlinfo)

version: "0.11.2"
software: "libjxl-tools"
status: built
build_date: "2026-09-25"
build_system: cmake

source:
  url: "https://github.com/libjxl/libjxl/archive/refs/tags/v0.11.2.tar.gz"
  sha256: "ab38928f7f6248e2a98cc184956021acb927b16a0dee71b4d260dc040a4320ea"
  tar_format: tar.gz
  bundled_tarballs:
    # libjxl release tarball 不携带 git 子模块，skcms 在 source() 阶段按上游
    # 锁定 commit 单独下载到 third_party/skcms（JPEGXL_ENABLE_SKCMS=ON）。
    - name: skcms
      url: "https://github.com/google/skcms/archive/b2e692629c1fb19342517d7fb61f1cf83d075492.tar.gz"
      sha256: "96e274f403135c19ad4e7f9272f03a64c0aa5615591b087457e7fd0a5f14af23"

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DJPEGXL_STATIC=OFF"
    - "-DJPEGXL_ENABLE_TOOLS=ON"
    - "-DJPEGXL_ENABLE_SKCMS=ON"
    - "-DJPEGXL_FORCE_SYSTEM_BROTLI=ON"
    - "-DJPEGXL_FORCE_SYSTEM_HWY=ON"
    - "-DJPEGXL_FORCE_SYSTEM_GTEST=ON"
    - "-DJPEGXL_ENABLE_JPEGLI=OFF"
    - "-DJPEGXL_ENABLE_OPENEXR=OFF"
    - "-DJPEGXL_ENABLE_SJPEG=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux (OHOS clang target aarch64-unknown-linux-ohos)"
    - "-DCMAKE_INSTALL_RPATH=$ORIGIN/../lib"
    # PNG 为必需依赖（libjxl extras 无条件 find_package(PNG)）；以下缓存变量把
    # Conan 的 libpng/zlib 包路径喂给 CMake 模块 FindPNG/FindZLIB，避免偶合宿主的
    # /storage/Users/currentUser/usr/local libpng/libz。
    - "-DPNG_PNG_INCLUDE_DIR=<conan libpng>/include"
    - "-DPNG_LIBRARY=<conan libpng>/lib/libpng16.so"
    - "-DZLIB_INCLUDE_DIR=<conan zlib>/include"
    - "-DZLIB_LIBRARY=<conan zlib>/lib/libz.a"
  dependencies:
    - brotli/1.2.0
    - highway/1.3.0.2
    - libpng/1.6.58
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libjxl release tarball 不含 git submodule：skcms 必须单独下载到 third_party/skcms（JPEGXL_ENABLE_SKCMS=ON），否则只能依赖未发布的 lcms2"
  - "JPEGXL_STATIC=ON 会向 EXE_LINKER_FLAGS 追加 -static，强制所有传递依赖静态链接；brotli 配方仅产 .so，改用 BUILD_SHARED_LIBS=OFF 静态库内建 libjxl + 保留动态 brotli"
  - "libjxl 的 extras 编解码在 JPEGXL_BUNDLE_LIBPNG=OFF 时【无条件】find_package(PNG) 并编入 APNG 编解码——PNG 是【必需】依赖而非可选；未声明时 CMake 模块 FindPNG 会从宿主 /usr/local 偶合 libpng/libz，导致 DT_NEEDED 含宿主的 libpng16.so.16/libz.so 且包不自包含"
  - "CMake 模块 FindPNG 先 find_package(ZLIB) 再读 PNG_PNG_INCLUDE_DIR+PNG_LIBRARY（FindZLIB 读 ZLIB_INCLUDE_DIR+ZLIB_LIBRARY）；用 Conan CMakeToolchain cache_variables 注入这 4 个变量即可把 PNG/ZLIB 钉到 Conan 包"
  - "ohpcd 的 zlib 包为纯静态（仅 libz.a）：cjxl/djxl 静态链入；但 Conan libpng16.so.16 携带 NEEDED libz.so，OHOS 默认搜索路径无 libz.so，需从 libz.a 用 clang -shared 合成 SONAME=libz.so 的共享库随包分发"
  - "brotli/libpng 共享库随包安装到 lib/ 并设 CMAKE_INSTALL_RPATH=$ORIGIN/../lib，工具自包含可运行（env -i 下可跑），无需 LD_LIBRARY_PATH"
  - "OHOS clang 交叉编译下 libjxl 的 CMake 平台探测需 CMAKE_SYSTEM_NAME=Linux + CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY（同 highway 配方既有做法）"
  - "Conan 2 对纯传递依赖不填充 consumer recipe 的 package_folder（取到 None）；需要在 generate() 中访问依赖 package_folder 时应将其提升为直接 requires"
  - "上游 gtest 测试套件需在独立构建目录开启 BUILD_TESTING=ON + JPEGXL_FORCE_SYSTEM_GTEST=ON（gtest/1.17.0）单独构建；发布 tarball 缺失 testdata 子模块会导致依赖测试数据的用例失败"
