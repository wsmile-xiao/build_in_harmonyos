# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# libjxl 0.11.2 上游测试：CMake + GoogleTest 测试套件，位于 lib/**/*_test.cc，
# 通过顶层 CMakeLists.txt 的 BUILD_TESTING（ctest）注册。测试通过
# JPEGXL_FORCE_SYSTEM_GTEST 使用已安装的 gtest/1.15.2 包（制品仓已发布）。
# 由于本配方产出的是命令行工具包（cjxl/djxl/jxlinfo），上游测试在独立的
# 临时构建目录中单独启用 BUILD_TESTING=ON 运行，见 notes.md / reports/upstream-tests.md。

package: libjxl-tools/0.11.2
homepage: "https://github.com/libjxl/libjxl"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (GoogleTest 单元测试，由 ctest 注册)
upstream_tests:
  - file: lib/jxl/*_test.cc
    source: libjxl-0.11.2/lib/jxl/
    description: "libjxl 核心编解码 GoogleTest 单元测试 (dec/enc/容器/色彩管理)"
    command: "ctest --test-dir build --output-on-failure"

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test_tools.sh
    description: "消费者测试 — 运行已安装的 cjxl/djxl/jxlinfo 完成 PPM->JXL->PPM 真实往返"
    command: "cjxl in.ppm out.jxl && djxl out.jxl out.ppm && jxlinfo out.jxl"
  - file: conanfile.py
    description: "空环境自包含断言 (env={}) — 验证 $ORIGIN/../lib RPATH 是唯一共享依赖解析途径"
    command: "python3 _assert_clean_env_roundtrip()"

# 上游测试用例总数 (gtest 定义用例，61 个二进制共 4778 个，见 reports/upstream-tests.md)
assertion_count: 4778
