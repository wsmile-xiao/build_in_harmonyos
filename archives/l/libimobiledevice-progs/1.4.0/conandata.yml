# conandata.yml — libimobiledevice-progs 1.4.0
# Source: GitHub release tarball (official, ships pre-generated configure).
# Upstream repo builds the library AND the command-line tools from the same
# source tree; this package delivers the tools (idevice_id/ideviceinfo/...).
# CI auto-adds mirror fallbacks for GitHub URLs (R39).

sources:
  url:
    - "https://github.com/libimobiledevice/libimobiledevice/releases/download/1.4.0/libimobiledevice-1.4.0.tar.bz2"
  sha256: "23cc0077e221c7d991bd0eb02150a0d49199bcca1ddf059edccee9ffd914939d"

patches:
  "1.4.0":
    - patch_file: "patches/0001-compat-libplist-2.3.0-backport-dict-uint-helpers.patch"
      patch_type: "portability"
      strip: 1
      patch_description: "libplist 2.6.0 的 plist_dict_get_uint/plist_dict_copy_uint 与 PLIST_OPT_NONE 在 libplist 2.3.0 下缺失（afcclient/idevicebackup2/idevicecrashreport/ideviceimagemounter 链接 undefined symbol / 编译 undeclared identifier）：逐字 backport 上游实现为 static inline（tools/plist_dict_compat.h），受 -DLIBPLIST_LT_2_6=1 门控，libplist >= 2.6.0 时不编译"
