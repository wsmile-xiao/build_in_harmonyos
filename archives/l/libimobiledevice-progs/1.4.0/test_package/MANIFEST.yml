# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libimobiledevice-progs/1.4.0
homepage: "https://github.com/libimobiledevice/libimobiledevice"

# 上游测试声明：libimobiledevice 1.4.0 无测试套件。
# 依据（1.4.0 官方 release tarball 实核）：
#   - 顶层 Makefile.am SUBDIRS = 3rd_party common src include $(CYTHON_SUB) tools docs
#     （无 tests 目录）；源码树不存在 tests/；
#   - 无 Makefile check 目标注册的测试（automake 自带 check 只递归 SUBDIRS）；
#   - .github/workflows 仅构建（无 ctest/make check 步骤）。
# 因此上游用例数 N = 0，本包验证 = 交付工具的 smoke（鸿蒙特有，分栏统计）。
upstream_check_command: "none (upstream ships no test suite; verified against the 1.4.0 release tarball)"
upstream_test_in_build: false
upstream_test_command: "none"

upstream_tests: []

# test_package 中自带的测试（消费者视角验证，鸿蒙特有 smoke）
test_package_tests:
  - file: test.sh
    description: "在目标机执行打包出的工具：idevice_id/ideviceinfo/idevicepair --version 必须输出 1.4.0；ideviceinfo --help 必须输出 usage（均为无设备安全子命令）"
    command: "bash test.sh (conanrun env)"

# 测试断言总数
assertion_count: 4
# 计数口径：test.sh 中 4 处判定（3 个工具的 --version 输出含 1.4.0、
# ideviceinfo --help 输出含 usage），与 manifest.yaml 的
# test_package_assertions 一致
