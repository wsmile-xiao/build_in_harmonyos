knowledge_gained:
  - "grpc_authorization_provider target 将完整 C 核心（含 TLS/secure 源面，302 源文件）编进单 archive——re2/openssl 是真链接依赖，与 unsecure 件（仅配置期需要）不同"
  - "授权模块公开 API：grpcpp/security/authorization_policy_provider.h（C++ StaticDataAuthorizationPolicyProvider 工厂）+ grpc/grpc_security.h（C 核心）"
  - "上游 7 个授权测试程序直链 grpc_authorization_provider（152 TEST 宏）：matchers/cel_engine/evaluate_args/audit_logging/auth_engine/policy_provider/rbac_translator"
  - "pinned gtest(52eb8108) Linux 分支 CapturedStream 硬编码 /tmp（Android 分支才读 TMPDIR）——OHOS 只读 /tmp 下 stdout 捕获类测试全灭，需 0007 补丁桥接"
  - "grpc 测试程序读 repo 相对路径测试数据（test_policies/*.json），执行 cwd 必须是源码根"
  - "conan Environment 定义的 TMPDIR 不透传测试进程的孙进程——直注 os.environ 才可靠"

