# test_package/MANIFEST.yml
# 上游测试声明文件（CI build_and_test.sh L0e 要求本文件存在）

package: libmsym/0.2.3
homepage: "https://github.com/mcodev31/libmsym"

# 上游测试命令：v0.2.3 上游没有任何测试入口
# 依据：tag v0.2.3（commit 5b7aa16e）源码树只有 src/ 与 examples/，顶层
# CMakeLists.txt 无 enable_testing()/CTest/add_test，仓库无 test/ 目录
upstream_check_command: ""

# conanfile.py build() 中是否集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序：无
upstream_tests: []

# test_package 消费者测试（鸿蒙 PC 侧新增，不计入上游分母）
test_package_tests:
  - file: test_libmsym.c
    description: "消费者测试：链接交付的 libmsym，对 H2O/NH3/CH4/C6H6 标准几何断言点群类型、群阶、各类对称操作数、特征标表维数、等价集"
    command: "./test_libmsym"

# test_libmsym.c 内 CHECK() 断言计数（4 个分子 × 23 项）
assertion_count: 92
