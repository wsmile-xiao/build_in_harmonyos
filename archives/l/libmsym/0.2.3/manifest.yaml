knowledge_gained:
  # 每条行内必须带 knowledge_ref 引用（check-knowledge-gap 判 unreferenced）
  - "CMake 4.x 已移除 cmake_minimum_required(<3.5) 兼容：上游 2.8.11 必须在 configure 命令行注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（写进 CMakeToolchain 文件对首行策略检查不可达）"  # knowledge_ref: E187
  - "CMake 目标平台识别由 Conan CMakeToolchain（os=OHOS）处理：G0 命中的 E092「CMake 不认识 HarmonyOS」对已有工具链的配方不适用，仅作提示（本轮 G2 实证 PASS）"  # knowledge_ref: E092
  - "OHOS 无 CMake Platform/HarmonyOS.cmake → CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 为空，shared 产物缺 DT_SONAME；配方在 os==OHOS 时显式补 CMAKE_PLATFORM_NO_VERSIONED_SONAME + -Wl,-soname,（实测 SONAME libmsym.so）"  # knowledge_ref: E383
