# 软件级 manifest（ARCHIVE-SPEC v3.0 §2.1/§4.1）
# 文件位置: archives/l/libmsym/manifest.yaml

software: libmsym
display: "libmsym"
description: "分子点群对称性 C 库（点群判定、对称化、等价元素、子群、特征标表、SALC 生成）"
category: library
homepage: "https://github.com/mcodev31/libmsym"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 4.x：上游 cmake_minimum_required(VERSION 2.8.11) 须在 configure 命令行注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（写进 CMakeToolchain 文件不可达，见 E187）"
    - "OHOS 无 CMake Platform 模块：shared 变体须显式设 CMAKE_PLATFORM_NO_VERSIONED_SONAME + CMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,，否则 .so 无 DT_SONAME（见 E383）"
    - "纯库包（安装面只有 lib/、include/libmsym/ 与上游 CMake config，无 bin/），不需要 commands.json"
    - "无外部依赖，仅链系统 libm（cpp_info.system_libs=[\"m\"]，与上游 target_link_libraries(msym m) 对齐）"
  common_dependencies: []

versions:
  "0.2.3":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libmsym/0.2.3"
