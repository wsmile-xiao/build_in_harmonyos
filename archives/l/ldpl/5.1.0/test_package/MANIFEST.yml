# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ldpl/5.1.0
homepage: "https://www.ldpl-lang.org/"

# ── 上游测试清点（LDPL-5.1.0 tag，逐字节核对，不是猜测）────────────────
# 取数命令（本地对官方归档执行）:
#   curl -L https://codeload.github.com/Lartu/ldpl/tar.gz/refs/tags/LDPL-5.1.0
#   tar tzf ldpl-5.1.0.tar.gz | wc -l                     -> 84
#   tar tzf ldpl-5.1.0.tar.gz | grep -cE '/(tests?|test)/' -> 0
#   tar tzf ldpl-5.1.0.tar.gz | grep -E '(^|/)(Makefile|makefile|CMakeLists.txt)$'
#       -> ldpl-LDPL-5.1.0/makefile
#          ldpl-LDPL-5.1.0/src/CMakeLists.txt
#          ldpl-LDPL-5.1.0/docs/... (无测试目录)
# 结论：该 tag 的归档里只有 makefile（all/man/clean/install/uninstall 五个目标，
# 没有 check/test 目标）与 src/CMakeLists.txt（只有一个 add_executable(ldpl)）。
# LDPL 仓库现在的 tests/{expressions,features,structures} 目录是 5.1.0 之后引入的，
# 不在本版本坐标内；按 §2.2「禁止用 master/main 顶替版本号」不拿它充当 5.1.0 的用例。
# 所以上游用例数 = 0/0，本 PR 走「上游无测试 → 必须新增鸿蒙特有用例」这条路径。
upstream_check_command: "无：LDPL-5.1.0 归档不含测试套件，makefile 也没有 check/test 目标"
upstream_test_in_build: false
upstream_tests: []

# ── test_package 自带的消费者测试（本 PR 的真实执行证据）──────────────
test_package_tests:
  - file: test_ldpl.sh
    description: "端到端消费者测试（26 项断言）：用安装后的 ldpl 真跑「.ldpl → C++ → ELF 可执行文件」
      全链路。覆盖 -v/-h 版本与代号、未知选项、-r 生成码（断言 #include 用的是运行期注入的
      LDPL_LIB_LOCATION 而不是编译期烧死的路径）、DATA/PROCEDURE、STORE、IN _ SOLVE _、
      number map 取下标、SUB-PROCEDURE/CALL/RETURN、ACCEPT 读标准输入、-o= 指定产物名、
      语法错误必须非 0 退出并报 LDPL Error、把 lib/ldpl 复制到别处后仍能构建（重定位反证）、
      产物 ELF magic 校验"
    command: "LDPL_CXX=<SDK clang++> sh test_ldpl.sh <installed ldpl> <samples dir>"

assertion_count: 26
