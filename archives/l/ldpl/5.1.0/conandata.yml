# conandata.yml — ldpl 5.1.0
#
# 版本坐标：任务给的 5.1.0 = 上游 tag LDPL-5.1.0（"Groovy Gualicho"），
# Homebrew formula ldpl 的 stable 版本同为 5.1.0，其 urls.stable.checksum 与
# 下面 sha256 逐字节一致，可交叉验证。
#
# codeload 排在第一个：真机上 github.com 常被墙（conan create 拉源码 ConnectTimeout），
# 官方 codeload.github.com 可达。两个 URL 都是 GitHub 官方归档生成器、同一字节流。

sources:
  url:
    - "https://codeload.github.com/Lartu/ldpl/tar.gz/refs/tags/LDPL-5.1.0"
    - "https://github.com/Lartu/ldpl/archive/refs/tags/LDPL-5.1.0.tar.gz"
  sha256: "f61c0a8a3405965a7ee168da3ecf754b600de5a1c89208ae437ffba8658b2701"

patches:
  - patch_file: "patches/0001-runtime-lib-location-and-cxx-override.patch"
    patch_description: >-
      把 ldpl 运行期使用的 ldpl_lib 目录与 C++ 前端名从「编译期烧死的常量」降级为
      「默认值」：优先读环境变量 LDPL_LIB_LOCATION / LDPL_CXX。不改算法、不引入
      任何平台条件编译宏。
    patch_type: "portability"
