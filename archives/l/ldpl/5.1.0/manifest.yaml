# 版本级 manifest
# 文件位置: archives/{letter}/{name}/{version}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "5.1.0"
software: "ldpl"

# published | built | failed | archived
status: built
build_date: "2026-10-03"
build_system: "custom"

source:
  url: "https://codeload.github.com/Lartu/ldpl/tar.gz/refs/tags/LDPL-5.1.0"
  sha256: "f61c0a8a3405965a7ee168da3ecf754b600de5a1c89208ae437ffba8658b2701"
  tar_format: tar.gz
  # 版本坐标：任务给的 5.1.0 就是上游 tag LDPL-5.1.0（代号 "Groovy Gualicho"），
  # Homebrew formula ldpl 的 stable 亦为 5.1.0 且 checksum 与上面一致。
  upstream_release_used: "LDPL-5.1.0"

build:
  # cmake | autotools | makefile | meson | custom
  # 上游 makefile 的 all 目标只有一行 clang++ 命令，但它无条件附加
  # -static-libgcc -static-libstdc++（OHOS SDK 只有 libc++，没有可静态链的
  # libstdc++ 归档），还会把产物 mv 到 make 的当前目录；因此 build() 直接执行
  # 该行命令的等价形式，不经过 make。
  system: custom
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-runtime-lib-location-and-cxx-override.patch"

knowledge_gained:
  - "上游 5.1.0 归档内无任何测试用例（84 个条目、tests/ 目录 0 命中，makefile 无 check/test 目标），LDPL 现在的 tests/ 是该 tag 之后引入的 → 走「上游 0/0 + 必须新增鸿蒙特有用例」路径，26 项端到端断言"
  - "LDPL 是转译器：运行期要 (a) 找 ldpl_lib.cpp/BigInt.hpp，(b) system() 调一个 C++ 前端。上游把两者都写死（-DLDPLLIBLOCATION 常量 + 字面量 \"c++\"）"
  - "真机 OHOS 上 PATH 里只有 clang++，没有 c++/g++/cc 任何别名（command -v 三个全 MISSING）→ 上游文档明确写着「必须把某个 C++ 编译器映射成 PATH 上的 c++」，这是本平台的硬缺口"
  - "把 self.package_folder 编进二进制 = 制品仓下载的包在消费机上必然指向不存在的构建机路径（同 wx-config 烧死 ~/.cache 的老坑）→ 补丁把编译期常量降级为默认值，运行期优先读 LDPL_LIB_LOCATION / LDPL_CXX，再由 runenv_info.define_path 注入真实安装目录"
  - "codeload URL 末段是 tag 名、无 .tar.gz 后缀 → get() 必须显式 filename=，否则按 zip 解包抛 BadZipFile"
  - "生成的编译命令带 -static-libstdc++ 会失败；上游自带 -n/--non-static 开关（STATIC_BUILDS 在 OHOS 上成立），消费者测试先探测 -h 是否列出 non-static 再决定是否加 -n"
  - "ldpl_lib.cpp 用到 std::thread，链接需 -f=-pthread（LDPL 的 -f= 直通 C++ 前端）"
  - "LDPL 语法大小写无关：tokenizer 把非字符串 token 统一大写，因此 docs 里的小写样例与 makefile 里的大写写法都成立；CRLF 与 LF 都发 \"\\n\"（不产生 \\r），断言可以按纯 LF 精确比对"
