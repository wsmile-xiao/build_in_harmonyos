# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.5"
software: "libagg"
status: built
build_date: "2026-09-11"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方站点 www.antigrain.com 已失效（DNS 不再解析）。
  # BLFS 镜像承载字节一致的 tarball（md5 0229a488bc47be10a2fee6cf0b2febd6，
  # 与 BLFS book 及 Fedora agg-2.5 src.rpm 交叉核对）。
  url: "https://ftp.osuosl.org/pub/blfs/conglomeration/agg/agg-2.5.tar.gz"
  sha256: "ab1edc54cc32ba51a62ff120d501eecd55fceeedf869b9354e7e13812289911f"
  tar_format: tar.gz
  official_url_history:
    - "https://www.antigrain.com/agg-2.5.tar.gz (defunct — DNS no longer resolves)"

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--disable-examples"
    - "--disable-ctrl"
    - "--disable-platform"
    - "--disable-freetype"
    - "--disable-gpc"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  optional_layers:
    freetype: "disabled (需要 pkg-config + freetype2)"
    sdl: "disabled (需要 AM_PATH_SDL m4 宏)"
    x11: "disabled (需要 X11 开发库)"
    gpc: "disabled (通用多边形裁剪，独立可选库)"
    font_win32_tt: "disabled (Win32 API)"
  cc: clang
  cxx: clang++

# 静态/共享均支持；R26 默认静态。
# 共享构建: libtool -version-info 2:4:0 → libagg.so.2.0.4, SONAME libagg.so.2

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure.ac.patch"
  - "0002-const-profile-fix.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E165 shebang-fix: OHOS 无 /bin/bash，需 patch shebang（沿用 agg 2.7 方案）"
  - "HMDFS 700-perm tmpdir: config.status 的 mktemp -d 创建 700 子目录，HMDFS 拒写，需 patch configure 改 umask 022（沿用 agg 2.7 方案）"
  - "dfsg 前身: 2.5 tarball 同样仅含 configure.in，需本地 autoreconf 生成 preconf/"
  - "AGG 2.5 renderer_outline_aa 非常量 profile() 重载自 C++11 起非法（const 指针绑非 const 引用），现代 clang 硬错误——所有主流发行版均携带等效补丁（Debian/Fedora/BLFS）"
  - "agg 2.5 头文件使用已废弃 register 关键字，C++17 消费者需 -Wno-register"
  - "BGRA 像素格式内存布局: B 在 offset 0、R 在 offset 2——渲染测试断言必须按 order_bgra 索引，与 rgba8(r,g,b,a) 逻辑序相反"

patch_generation:
  method: per-file-difflib
  source_orig_dir: .tmp-agg-verify/agg-2.5 (pristine tarball)
  source_work_dir: .tmp-agg-preconf/agg-2.5-work (patched)
  generated_at: '2026-09-11T11:20:00'
  patches_count: 2

patch_classification:
  - file: 0001-configure.ac.patch
    type: source-edit
    platform_only: true
    guard: 'none'
    description: "移除 SDL/FT2 autodetection（AM_PATH_SDL/PKG_CHECK_MODULES，OHOS 不可用）+ 删除 automake 1.16 已移除的 AC_ISC_POSIX/AM_C_PROTOTYPES 废弃宏"
  - file: 0002-const-profile-fix.patch
    type: source-edit
    platform_only: false
    guard: 'none'
    description: "删除 renderer_outline_aa 非常量 profile() 重载（const 指针返回非 const 引用，C++11 起非法）——发行版通用补丁，非 OHOS 特有"
