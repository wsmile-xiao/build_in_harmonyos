# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libagg/2.5
homepage: "https://sourceforge.net/projects/agg/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# agg 2.5 tarball 无任何测试目标: Makefile.am 无 check target、无 tests/ 目录、
# examples/ 为交互式 GUI 演示（需 X11/SDL），不能作为自动化测试运行。
# configure 的 --disable-examples 已排除。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游正式测试数 = 0（无测试框架、无 check target、无单测源文件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "渲染管线实质测试：矩形填充、抗锯齿线段(conv_stroke)、抗锯齿三角形覆盖、50% alpha混合、退化/越界/1x1边界输入（像素缓冲程序化断言，17 项）"
    command: "./test_libagg"
  - file: test_ohos.sh
    description: "鸿蒙特有检查：ELF64 AArch64、musl libc.so、SONAME=libagg.so.2、NEEDED无glibc/libstdc++泄漏、.codesign段、RPATH无主机绝对路径（静态构建时检查test二进制与.a归档）"
    command: "bash test_ohos.sh"

# 测试断言总数 (近似值, 用于质量评估)
# test.cpp: 17 个 check() (含4组渲染+1组边界)
# test_ohos.sh: 10 项共享/4 项静态检查
assertion_count: 27
