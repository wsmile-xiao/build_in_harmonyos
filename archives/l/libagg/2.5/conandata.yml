sources:
  # 官方站点 www.antigrain.com 已失效（DNS 不解析）。
  # BLFS 镜像承载字节一致的原版 tarball（md5 0229a488bc47be10a2fee6cf0b2febd6，
  # 与 BLFS book 及 Fedora agg-2.5 src.rpm 交叉核对通过）。
  # 注意: 本配方 conanfile.py 将 url/sha256 硬编码于 source()（沿用 agg 2.7.0.r145
  # 模式），以规避 CI build_and_test.sh "Pre-download" 阶段 BUILD_DIR 未定义崩溃；
  # 本文件仅作元数据登记。
  url: "https://ftp.osuosl.org/pub/blfs/conglomeration/agg/agg-2.5.tar.gz"
  sha256: "ab1edc54cc32ba51a62ff120d501eecd55fceeedf869b9354e7e13812289911f"
