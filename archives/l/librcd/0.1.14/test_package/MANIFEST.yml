# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librcd/0.1.14
homepage: "http://rusxmms.sourceforge.net/"

# ── 上游自动化测试清点：N = 0（候选数法最大值，逐项归因见下） ──────────────
# 候选 1（框架注册数 / autotools TESTS 变量）：0。四个 Makefile.am（顶层、src、
#   examples、statgen）全文无 TESTS / TESTS_ENVIRONMENT / check_PROGRAMS 变量；
#   顶层 Makefile.am 只有 `SUBDIRS = src`，`src/Makefile.am` 只声明
#   lib_LTLIBRARIES = librcd.la 与 include_HEADERS = librcd.h。
#   实测 `make -n check` 在 src/ 下不产生任何测试程序编译或执行（见
#   reports/test-report.md 第二节逐字输出）。
# 候选 2（非标准 make 目标）：2 个 —— examples/Makefile.am 的 `test:` 与
#   statgen/Makefile.am 的 `tests:`。两者都**不**挂在 `make check` 下、
#   examples/ 与 statgen/ **不在** SUBDIRS（默认构建不进入），且目标体内
#   0 条断言：`test:` 只是 `cat input.txt | ./example`（example 打印判定结果、
#   恒返回 0）；`tests:` 只是用 gcc 手工编译 test/debug 两个工具，依赖
#   statgen/doit 的 dos2unix + iconv + ru_RU.KOI8-R locale 与 dragons.txt 语料
#   （仓库未安装这些工具，属人工工具链，不是自动化套件）。故不计入 N。
# 候选 3（测试源文件数）：2 个 —— examples/example.c（演示程序，无断言）与
#   statgen/test.c（统计工具，无断言、需真实语料文件）。两者都不是测试用例。
# 结论：上游可自动化、带断言的测试数 **N = 0**；如实申报，不以消费者测试充数。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游无自动化测试程序（examples/ 与 statgen/ 的演示/工具程序未纳入计数）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，与上游用例分栏统计)
test_package_tests:
  - file: test_librcd.c
    description: "librcd API 消费者测试: rcdGetRussianCharset() 对 CP1251/KOI8-R/CP866/UTF-8 四种编码的同一段俄文（30/65/6 字节三组文本）与 ISO-8859-1 拉丁文的判定，覆盖 len=0 与 len=N 两条入参路径、返回码值域、幂等性与公开枚举取值"
    command: "./test_librcd"

# 测试断言总数（test_librcd.c 内 CHECK 调用点计数，与运行期 checks= 一致）
assertion_count: 34
