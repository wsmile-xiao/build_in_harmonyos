version: "0.1.14"
software: librcd
build_system: autotools
status: built
build_date: "2026-09-15"
conan_ref: "librcd/0.1.14"

source:
  url: "https://deb.debian.org/debian/pool/main/libr/librcd/librcd_0.1.14.orig.tar.bz2"
  tar_format: tar.bz2
  sha256: "261db28bc864fd4b2d3ba88403b2e421944281e323c1e39c0e61f5160c16b664"

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    # OHOS 上还要把生成链钉在同一个 Toybox shell 上（命令行前缀赋值，不是 configure 开关）：
    # CONFIG_SHELL=/system/bin/sh SHELL=/system/bin/sh /system/bin/sh <srcdir>/configure
    - "CONFIG_SHELL=/system/bin/sh SHELL=/system/bin/sh (shell pinning; see notes.md 问题 5)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.sub-aarch64-ohos.patch"
  - "0002-config.guess-harmonyos.patch"
  - "0003-configure-config-status-umask.patch"
  - "0004-configure-read-version-from-srcdir.patch"

knowledge_gained:
  # 每条登记其知识图谱引用（knowledge_ref:）；无图谱条目者不进本清单——
  # 包级事实（"非 UTF-8 数据表 + clang 保留原始字节需实证"、"VPATH 下 cat VERSION
  # 使 -version-info 退化为 0:0:0"）写在 notes.md 与 test_package/MANIFEST.yml 里。
  - "上游 config.guess（2005-03-24）不认识 uname -s 报出的 HarmonyOS：configure 报 'unable to guess system type'（knowledge_ref: E160 config-guess-harmonyos-patch；同族 E007 patch-autotools-script）"
  - "上游 config.sub（同年代）不认识 aarch64 机器名与 linux-ohos OS：直接给 triplet 会报 Invalid configuration 'aarch64-linux-ohos'（knowledge_ref: E122 add-linux-ohos-to-validation；同族 E007）"
  - "autoconf 2.68 的 config.status 用 (umask 077 && mktemp -d ./confXXXXXX) 建临时目录，HMDFS 落盘为 drwx--S--- 2700 且属主被映射成共享属主，创建者自己随后也写不进去（实测 touch Permission denied）；改 umask 022 后同一目录 2751 可写（knowledge_ref: E011 edit-umask-in-configure；同族 E136、DRAFT-6507）"
  - "profile buildenv 的 CONFIG_SHELL=bash 与 configure 实际执行者 Toybox /bin/sh 不一致时，autoconf 在 Toybox 下选中的 ECHO='print -r --' 会在 bash 里失效，libtool 生成时引号转义整段丢失、产出的 libtool 成为非法 sh（syntax error near unexpected token '}'）；用命令行前缀 CONFIG_SHELL/SHELL=/system/bin/sh 重跑 configure 即回正（knowledge_ref: DRAFT-E551-ohos-conan-configshell-bash-libtool-escaping）"
