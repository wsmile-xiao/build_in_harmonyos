# conandata.yml — librcd 0.1.14
# CI 的唯一源码/补丁输入；conanfile.py 通过 self.conan_data 读取。
#
# 源码（R39）：上游官网 rusxmms.sourceforge.net / 发布机 dside.dyndns.org 均已下线
# （实测 http://dside.dyndns.org/files/rusxmms/librcd-0.1.14.tar.bz2 无任何响应），
# 故使用 Debian 源码包的 pristine 上游归档（本仓库大量配方同用 deb.debian.org 的
# pool 源，例如 archives/a/a52dec/0.7.4、archives/a/aalib/1.4p5、archives/a/abook/0.6.1；
# Debian 该包 Source: librcd / Version: 0.1.14-1 / Format: 3.0 (quilt)，
# 无 dfsg 重打包，orig 即上游原包）。sha256 与 Debian librcd_0.1.14-1.dsc 的
# Checksums-Sha256 逐字一致（308041 字节，bzip2 块 900k，tar 顶层目录 librcd-0.1.14/）。
#
# 四个补丁都是**老的 autotools 生成物在 VPATH + OHOS 沙箱下的可移植性修复**，
# 不含平台宏、不改上游 C 源码逻辑（详见版本级 notes.md）：
#   0001/0002 上游 configure/config.sub/config.guess 生成于 2005-2008 年，
#             不认识 aarch64，也不认识 uname -s 报出的 HarmonyOS；
#   0003      autoconf 2.68 的 config.status 用 `umask 077` 建临时目录，
#             在 HMDFS 上落盘为 2700/属主被映射，同一进程写不进去；
#   0004      上游 configure 用 `cat VERSION`（相对当前目录）取版本号，
#             VPATH 构建（conan/Autotools 固定形态）下取不到，使
#             libtool -version-info 退化为 0:0:0。
sources:
  url: "https://deb.debian.org/debian/pool/main/libr/librcd/librcd_0.1.14.orig.tar.bz2"
  sha256: "261db28bc864fd4b2d3ba88403b2e421944281e323c1e39c0e61f5160c16b664"

patches:
  - patch_file: "patches/0001-config.sub-aarch64-ohos.patch"
    patch_description: "Accept aarch64 and linux-ohos triplets in the bundled (2005) config.sub"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess-harmonyos.patch"
    patch_description: "Report aarch64-unknown-linux-gnu on HarmonyOS/aarch64 instead of failing to guess the build type"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-config-status-umask.patch"
    patch_description: "Let config.status create its temporary directory with umask 022 (HMDFS + SGID makes a 0700 dir unwritable by its own creator)"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-read-version-from-srcdir.patch"
    patch_description: "Read VERSION from $srcdir so -version-info/librcd.pc keep 0.1.14 under a VPATH build"
    patch_type: "portability"
