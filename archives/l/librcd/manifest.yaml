# 软件级 manifest — librcd
# 位置: archives/l/librcd/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（人读索引/交叉校验，CI 不依赖）

software: librcd
display: "LibRCD"
description: "Charset detection library for Russian text (CP1251 / KOI8-R / UTF-8 / CP866 / ISO-8859-1)"
category: library
homepage: "http://rusxmms.sourceforge.net/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 configure/config.sub/config.guess 生成于 2005-2008 年，既不认识 aarch64 也不认识 uname -s 报出的 HarmonyOS；四个补丁里 0001/0002 是这两个脚本的可移植性修复（新增 aarch64 机器、linux-ohos OS，并让 config.guess 直接回 aarch64-unknown-linux-gnu）"
    - "autoconf 2.68 的 config.status 用 umask 077 建临时目录，HMDFS 上落盘为 2700/属主被映射，创建者随后也写不进去；0003 改 umask 022"
    - "上游 configure 用 cat VERSION（相对当前目录）取版本号，conan/Autotools 固定做 VPATH 构建时会取空，使 libtool -version-info 退化成 0:0:0；0004 改为 cat \"$srcdir/VERSION\"，恢复 1:14:1（librcd.so.0.1.14，soname 不变）"
    - "profile buildenv 的 CONFIG_SHELL=bash 会让 Toybox /bin/sh 下生成的 config.status/libtool 在 bash 里执行，libtool 引号转义整段丢失（syntax error near unexpected token '}'）；build() 用 CONFIG_SHELL/SHELL=/system/bin/sh 前缀重跑 configure，把整条生成链钉在同一个 shell 上（不改上游文件）"
    - "src/russian_table.h 是按 KOI8-R/CP866 原始字节书写的数据表（非 UTF-8），clang 会发 -Winvalid-source-encoding 警告（clang 汇总行 14205 warnings generated，约 1.42 万条）但保留原始字节；检测正确性由 test_package 的 34 项断言在五种编码上实证"
    - "上游无自动化测试套件（make check 是空实现，实测 Nothing to be done for 'check'），N = 0，功能验证由 test_package 消费者测试承担"
  common_dependencies: []

versions:
  "0.1.14":
    status: built
    build_date: "2026-09-15"
    conan_ref: "librcd/0.1.14"
