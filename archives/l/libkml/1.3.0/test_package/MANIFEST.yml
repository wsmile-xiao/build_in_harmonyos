# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: libkml/1.3.0
homepage: "https://github.com/libkml/libkml"

# 上游测试命令 (cmake BUILD_TESTING=ON 生成 ctest 套件)
upstream_check_command: "cmake -DBUILD_TESTING=ON && ctest"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""
# 上游测试在本地适配门禁中独立构建执行: 130 个 gtest 二进制
# (22 base + 12 convenience + 51 dom + 32 engine + 4 regionator + 9 xsd),
# 125 通过 / 5 失败(均为文件系统写入类用例, OHOS /tmp 只读平台限制, 见 notes.md)。

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/kml/base/version_test.cc
    source: libkml-1.3.0/tests/kml/base/version_test.cc
    description: "kmlbase Version API unit test (gtest)"
    command: "./test_version"
  - file: tests/kml/dom/kml22_test.cc
    source: libkml-1.3.0/tests/kml/dom/kml22_test.cc
    description: "kmldom KML 2.2 element unit test (gtest)"
    command: "./test_kml22"
  - file: tests/kml/engine/kml_file_test.cc
    source: libkml-1.3.0/tests/kml/engine/kml_file_test.cc
    description: "kmlengine KmlFile unit test (gtest)"
    command: "./test_kml_file"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libkml.cpp
    description: "消费者测试: kmlbase::Version + KmlFile 真实解析 KML"
    command: "./test_libkml"

# 测试断言总数 (近似值)
assertion_count: 6