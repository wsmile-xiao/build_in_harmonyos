# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源: libkyai-data-management-client/test/（GTest units-test，
# test.cpp + test.h，13 个 TEST_F 集成测试）。rule4 修复（0005 补丁 +
# build() 集成 + mock 服务）：真实构建 units-test 并运行全部 13 例、
# 逐例记录结果并断言。
#
# OHOS CI 无 kylin-ai-runtime 的 data-management gdbus 服务进程
# （unix:abstract=/tmp/.kylin-ai-business-unix/<euid>/DataManagement.sock）：
# 本配方随包提供 gdbus mock 服务端（mock/mock_datamanagement_server.c，
# 按 vendored 协议 datamanagementservice.xml 实现 com.kylin.AiBusiness.
# DataManagement 接口，返回确定性数据；_build_mock_server() 编译、
# _run_upstream_tests() 启动/等待/运行/终止）。被测代码（客户端 session/
# proxy/解析层 + 13 个 TEST_F 断言）为上游原样，13/13 PASS（rule4 实测
# 0/13 → 13/13）。is_feature_supported 用例经 0007 补丁适配：上游
# is_subsystem_plugin_installed() 的 dpkg 检查为 Debian 专属（OHOS 无
# /usr/bin/dpkg），补丁后 dpkg 不存在时视为已安装（架构支持仍经 uname 校验）。
# 逐例结果随 build 日志输出（[ RUN ]/[ OK ]/[ FAILED ] + PASS/FAIL 汇总）。
# ai-config/ai-assistant 的 tests//test/ 子目录在上游发行源码
# （orig.tar.gz 1.1.0.1）中不存在（ENABLE_TEST 默认 OFF，未随包发布）。

package: libkysdk-ai-private/1.1.0.1
homepage: "https://gitee.com/openkylin/libkysdk-ai-private"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "build() 内 _run_upstream_tests()：ENABLE_TEST=ON 构建 units-test 后，先启动 mock 服务（mock/mock_datamanagement_server.c，unix:abstract DataManagement.sock），再真实运行 units-test，逐例解析 gtest [RUN]/[OK]/[FAILED] 输出并汇总 PASS/FAIL"

# 上游实际运行的测试程序（真实构建 + 真实运行 + 断言通过，实测 N=13）
upstream_tests:
  - name: units-test (GTest, libkyai-data-management-client)
    location: libkyai-data-management-client/test/ (test.cpp + test.h + CMakeLists.txt, 13 个 TEST_F, DataManagementTest fixture)
    count: 13
    runnable: true
    note: "build() 真实构建并运行全部 13 例，mock 服务提供 DataManagement gdbus 接口（确定性数据），13/13 PASS（实测 N=13 = 声明 N=13，不少报）。TEST_F 清单：delete_files / add_text_files / get_all_fileinfos / get_tags_of_files / get_all_tags / search_similar_tags / search_files_about_tags / is_file_relevant_to_tags / is_file_relevant_to_description / extract_search_conditions / get_summarys_of_files / get_feature_status / is_feature_supported（is_feature_supported 经 0007 补丁适配 dpkg 检查）"

# test_package 中自带的测试 (消费者视角验证)
# OHOS CI 平台限制说明：test() 阶段的 python3 子进程经 AppSpawn 以 app uid
# （如 20020101）运行，而包内 .so 属主是构建 uid（如 20001006）。HMDFS 按
# 目录继承属主并裁剪 other 权限位（755→750）：跨 app 代码映射（dlopen 的
# mmap PROT_EXEC）被拒；app 私有目录（/data/storage/el2/base/cache）属主=
# 探针但 /data 数据分区禁止代码映射（noexec）→ dlopen 同样 EACCES；普通
# read() 跨 app 可过（复制成功）。
# 探针策略：1) 遍历候选可写目录（TMPDIR/el2 cache/dev/shm/tmp/cwd 等），
# 逐个复制 3 个主库+依赖库 → chown-to-self + chmod 补权限位 → dlopen，命中
# 对代码映射放行的目录即完整验证（依赖解析+代码映射）；2) 全部失败（平台
# 彻底禁止跨 app/数据分区代码映射）时回退 ELF 读取校验（跨 app 可读，验证
# 安装产物是有效 ET_DYN 共享对象），如实报告 dlopen 被平台权限模型阻止；
# 3) 头文件存在检查（3 个头文件：osassistant/modelconfig/datamanagement）。
test_package_tests:
  - file: test_kylin_ai_private.py
    description: "消费者冒烟测试：遍历可写临时目录复制 libkyai-config.so/libkyai-assistant.so/libkyai-data-management-client.so 及依赖库（chown-to-self + chmod 0755）后 ctypes.dlopen 副本验证依赖/符号可解析；无代码映射放行目录时回退 ELF 读取校验（跨 app 可读）+ 头文件存在检查"
    command: "python3 test_kylin_ai_private.py <package_folder>"
  - file: conanfile.py
    description: "test() 调用 test_kylin_ai_private.py（L0c 测试源入口，self.run + conanrun env）"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 13 个 TEST_F 真实运行并断言通过（13/13 PASS，mock 服务提供接口）；
# 新增消费者冒烟 1 入口（3 个 .so 加载/读取校验 + 3 个头文件检查）
assertion_count: 20
