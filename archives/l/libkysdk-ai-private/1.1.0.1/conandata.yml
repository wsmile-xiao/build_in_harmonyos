# conandata.yml — libkysdk-ai-private 1.1.0.1
# Kylin AI 私有 SDK（麒麟 AI 子系统私有客户端库：ai-config / ai-assistant /
# ai-data-management-client 三个共享库）。
#
# 源码来源：openKylin 官方打包源 Ubuntu pool orig.tar.gz 1.1.0.1
# （gitee.com/openkylin/libkysdk-ai-private 默认分支仅 README 空壳，无
# 1.1.0.1 tag 归档；Ubuntu/Debian 打包源为 openKylin 官方发布渠道）。
#
# 私有依赖（OHOS 制品仓无配方，L0i 要求 requires() 依赖已发布，故不能声明
# requires，改为本配方内 vendor 构建，装入 staging 前缀供主构建使用）：
#   - 协议源：openkylin/libkylin-ai-system-private debian/1.2.0.1-1 内嵌的
#     ai-proto（KylinAiProtoConfig.cmake + KylinAiProtoFunctions.cmake 宏 +
#     协议 XML）。注意：独立 kylin-ai-proto 仓库的 XML（configservice/
#     assistantservice）旧于 libkysdk-ai-private 1.1.0.1 源码期望（缺
#     getFreeTrialModels / set_current_nlp_model / prompts 的 session 参数等
#     gdbus 方法），1.2.0.1 的 ai-proto 才与源码匹配（Ubuntu 打包即依赖
#     libkylin-ai-system-private 提供协议）。

sources:
  ai-private:
    url: "http://archive.ubuntu.com/ubuntu/pool/universe/libk/libkysdk-ai-private/libkysdk-ai-private_1.1.0.1.orig.tar.gz"
    sha256: "16b8ad96f279fc456c2f85bde392b5e819886920ffda3103c070cb6d84881a9e"
  kylin-ai-system:
    url: "https://gitee.com/openkylin/libkylin-ai-system-private/repository/archive/debian%2F1.2.0.1-1.tar.gz"
    sha256: "9252749b0112bbfb621ddb6c6e018417e7b1c052315cc36d004affc4f4ff1cc0"

patches:
  "1.1.0.1":
    - patch_file: "patches/0001-cmakelists-jsoncpp-gio-usr-install.patch"
      description: "三个子 CMakeLists：jsoncpp 改走 Conan CMakeDeps CONFIG 目标（JsonCpp::JsonCpp）；pkg_check_modules(GIO) 后补 link_directories(${GIO_LIBRARY_DIRS})（-L 不传给 lld 则 -lgio-2.0 等找不到）；install(DIRECTORY usr/ / FILES ...) 绝对路径写 /usr 越权，改为 DESTINATION ${CMAKE_INSTALL_PREFIX}"
    - patch_file: "patches/0002-jsoncpp-include-prefix.patch"
      description: "ai-config/configserviceproxy.cpp、ai-assistant/assistantserviceproxy.cpp/osassistant.cpp：jsoncpp 头文件在 include/json/（制品仓 jsoncpp 包布局），#include <jsoncpp/json/json.h|value.h> 改为 <json/json.h|value.h>"
    - patch_file: "patches/0003-kylin-ai-proto-functions-paths.patch"
      base_path: "vendor/kylin-ai-proto"
      description: "KylinAiProto gdbus 生成宏：硬编码 /usr/bin/gdbus-codegen 与 /usr/share/kylin-ai/protocols/gdbus/ 改为 ${KYLAI_GDBUS_CODEGEN} / ${KYLAI_GDBUS_PROTOCOL_DIR} 变量"
    - patch_file: "patches/0004-kylin-ai-proto-install-prefix.patch"
      base_path: "vendor/kylin-ai-proto"
      description: "kylin-ai-proto 顶层 CMakeLists：install(DIRECTORY protocols/usr/ DESTINATION /usr) 绝对路径写 /usr 越权，改为 DESTINATION ${CMAKE_INSTALL_PREFIX}"
    - patch_file: "patches/0005-tests-gtest-conan-targets.patch"
      description: "真实执行上游 13 个 GTest 用例（rule4 实测 0/13 → 13/13 运行）：1) libkyai-data-management-client/CMakeLists.txt 移除 unset(ENABLE_TEST CACHE) 阻断（上游用该 hack 强制 ENABLE_TEST=OFF，外部 -D 被清空，补丁后 -DENABLE_TEST=ON 生效即可 add_subdirectory(test) 构建 units-test）；2) test/CMakeLists.txt 的 find_package(GTest)/GTest::GTest/GTest::Main 改为 Conan CMakeDeps 生成的 find_package(gtest CONFIG REQUIRED)/gtest::gtest/${GTEST_MAIN_LIBRARY}（OHOS 制品仓 gtest 配方只导出 gtest::gtest 目标，gtest_main 经 INSTALL_GTEST 安装为 libgtest_main.a，路径由配方 generate() 注入 GTEST_MAIN_LIBRARY 变量）"
    - patch_file: "patches/0006-test-dir-guards.patch"
      description: "ENABLE_TEST=ON 经 toolchain 全局注入后，ai-config/ai-assistant 的 if(ENABLE_TEST) add_subdirectory(tests|test) 因源码包不含对应测试目录而 CMake 报错（add_subdirectory given source 'tests'/'test' which is not an existing directory，CI #60897 实测）。修复：守卫改为 if(ENABLE_TEST AND IS_DIRECTORY \"${CMAKE_CURRENT_SOURCE_DIR}/tests|test\")，目录不存在则跳过；libkyai-data-management-client 的 test/ 目录真实存在，不受影响（该补丁仅影响 ai-config/ai-assistant）"
    - patch_file: "patches/0007-tests-feature-supported-dpkg.patch"
      description: "is_feature_supported() 用例适配（13 例中的 is_feature_supported）：is_subsystem_plugin_installed() 的 `dpkg -s kylin-ai-subsystem-plugin` 检查是 Debian 专属（/usr/bin/dpkg），OHOS 无 dpkg → 恒 false → EXPECT_TRUE(data_management_is_feature_supported()) 必失败。修复：/usr/bin/dpkg 不存在时视为已安装（架构支持仍由调用方 data_management_is_feature_supported() 经 uname 校验），使该用例在 OHOS 真实执行通过"
