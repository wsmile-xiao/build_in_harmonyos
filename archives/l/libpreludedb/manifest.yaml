software: libpreludedb
display: "libpreludedb"
description: "Prelude SIEM IDMEF database abstraction layer (SQL backends as dlopen plugins)"
category: security
homepage: "https://github.com/Prelude-SIEM/libpreludedb"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 GitHub tag 归档不含 autoreconf 产物，配方在 build() 里按 autogen.sh 思路自举（libtoolize --automake + aclocal -I m4 -I libmissing/m4 + autoconf + autoheader + automake --add-missing --copy）；与 libprelude 不同，本树 configure.ac 没有 LT_CONFIG_LTDL_DIR，用的是递归 libtool 模式，libtoolize 不需要（也不能）带 --ltdl"
    - "上游 AM_PATH_LIBPRELUDE(5.2.0) 只认 libprelude-config 脚本并用 AC_TRY_RUN 运行探测程序；ohpcd 的 libprelude 制品按 R38 只交付库（bin/libprelude-config 已剔除）→ 配方在 generate() 生成最小 libprelude-config 兼容层，并用 Environment.append_path() 注入 PATH/LD_LIBRARY_PATH（append() 的默认分隔符是空格，会让探测程序起不来，configure 误判依赖缺失）"
    - "libprelude 必须声明 transitive_headers=True/transitive_libs=True：libpreludedb 公开头文件直接 #include <libprelude/...>，而 Conan 对非直接依赖默认 headers=False/libs=False，CMakeDeps 会清空传递依赖的 INCLUDE_DIRS/LIBS，消费端报 'libprelude/idmef.h' file not found"
    - "E007 给生成的 config.guess 注入 HarmonyOS 分支（不用 --build/--host 伪造三元组）；E011 放宽 configure 的 umask 077；in-tree 布局规避 -I$(srcdir)/include 引用生成头 preludedb-version.h 的 VPATH 失败"
    - "上游测试入口只有随树发布的 vendored gnulib 自检 libmissing/tests（44 项），必须在 tests 目录内 make check（-C 会让 libtool wrapper 的 getcwd 在 HMDFS 上失败）；本次 44/44 通过"
    - "纯库交付：剔除 bin/preludedb-admin（Perl 运维脚本）与 bin/libpreludedb-config（已被 pkg-config 取代）、share/man 与全部 .la；SQL 后端插件由 AX_LIB_* 探测决定（本次未探测到），语言绑定与 gtk-doc 显式关闭"
  common_dependencies:
    - libprelude

versions:
  "5.2.0":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libpreludedb/5.2.0"