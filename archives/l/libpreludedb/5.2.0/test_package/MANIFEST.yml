# 实跑汇总（conan create build() 内，日志 logs/12-conan-create-3.log）
upstream_test_result:
  total: 44
  pass: 44
  skip: 0
  fail: 0
  error: 0
  testsuite_summary: "Testsuite summary for libpreludedb 5.2.0 | # TOTAL: 44 | # PASS: 44 | # SKIP: 0 | # XFAIL: 0 | # FAIL: 0 | # ERROR: 0"

# test_package 自带的消费者测试（L1）
test_package_tests:
  - file: test.c
    description: "消费者视角：CMakeDeps 生成的 libpreludedb::libpreludedb 目标编译链接，实调 preludedb_check_version（含拒绝过高版本）、preludedb_selected_path_new_string（真实走 lex/yacc 解析器）、libprelude 的 idmef_message_* API"
    command: "./test_libpreludedb"

# 上游测试断言静态清点：libmissing/tests/*.c 中 ASSERT ( 共 230 处（50 个 .c 源文件）；
# 另有本 test_package 的 9 条 CHECK
assertion_count: 239
