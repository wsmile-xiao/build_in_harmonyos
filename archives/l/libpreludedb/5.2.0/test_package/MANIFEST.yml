# test_package/MANIFEST.yml — libpreludedb 5.2.0 上游测试声明（CI L0e）
#
# 清点方式：
#   1) 解压上游 GitHub tag 归档（5.2.0）
#   2) 顶层 `SUBDIRS = m4 libmissing src plugins bindings docs`（Makefile.am）
#      → 本包**没有**自己的 tests/ 目录（已核验：ls tests → No such file）
#   3) upstream 唯一的 deterministic 测试入口是随树发布的 vendored gnulib 自检
#      `libmissing/tests/Makefile.am`（automake parallel-tests，TESTS 共 44 项）
# 实跑记录见同目录 notes.md 与 reports/。

package: libpreludedb/5.2.0
homepage: "https://github.com/Prelude-SIEM/libpreludedb"

# 上游测试命令（autotools parallel-tests）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# 必须 cd 进 libmissing/tests 执行：从父目录 `make -C libmissing/tests check` 会让
# libtool wrapper 的 getcwd 解析失败（HMDFS），44 项会全部假失败（同 libprelude/5.2.0
# 的结论）。用例数、断言数均未改动（R51 不减不跳）。
upstream_test_command: "cd libmissing/tests && make check"

# 上游实际运行的测试程序（libmissing/tests/Makefile.am 的 TESTS，共 44 项）
upstream_tests:
  - name: test-alloca-opt
    file: libmissing/tests/test-alloca-opt.c
    description: "alloca 可用性与边界（gnulib alloca-opt）"
  - name: test-errno
    file: libmissing/tests/test-errno.c
    description: "errno 语义（gnulib errno）"
