version: "5.2.0"
software: "libpreludedb"
status: built
build_date: "2026-09-19"
conan_ref: "libpreludedb/5.2.0"
build_system: "autotools"

source:
  # 原官网域名（prelude-labs.org / www.prelude-siem.org）已劫持失效、官方 tarball 404，
  # 改用 Prelude-SIEM 官方 GitHub 组织的 tag 归档（PR 正文同步说明）
  url: "https://github.com/Prelude-SIEM/libpreludedb/archive/refs/tags/5.2.0.tar.gz"
  sha256: "fdbfb75f3ae02e016f05881dabb6c2d588b1ae9896624cb46594e765f8b4b261"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-maintainer-mode"
    - "--disable-gtk-doc"
    - "--disable-easy-bindings"
    - "--without-swig"
    - "--without-python2"
    - "--without-python3"
  dependencies:
    - "libprelude/5.2.0"
  tools:
    - "automake/1.18"
    - "libtool/2.5.4"
    - "flex/bison (宿主 HNP: AC_PROG_LEX / AC_PROG_YACC)"
    - "autoconf/2.72 (宿主 HNP)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 m4/libprelude.m4 的 AM_PATH_LIBPRELUDE 只认 libprelude-config 脚本（AC_PATH_PROG + AC_TRY_RUN 运行探测程序）；ohpcd 的 libprelude 制品按 R38 只交付库、bin/libprelude-config 已被剔除 → 消费方必须在 generate() 里生成等价兼容层 [knowledge_ref: reference: notes.md 问题 #1]"
  - "Conan 的 Environment.append() 默认分隔符是空格：用它追加 PATH/LD_LIBRARY_PATH 会拼出 '<旧值> <dir1> <dir2>'，动态链接器与 shell 都不认，AC_TRY_RUN 探测程序直接起不来（误判依赖缺失）；必须用 append_path()（os.pathsep） [knowledge_ref: reference: notes.md 问题 #1]"
  - "公开头文件 #include 依赖头时，必须 self.requires(dep, transitive_headers=True, transitive_libs=True)：Conan 对非直接依赖默认 headers=False/libs=False，CMakeDeps 会把传递依赖的 INCLUDE_DIRS/LIBS 清空（cmakedeps target_data.py），消费端报 'libprelude/idmef.h' file not found [knowledge_ref: reference: notes.md 问题 #2；仓库 461 个配方同一约定]"
  - "config.guess 注入 HarmonyOS 分支（E007，禁用 --build/--host 伪造三元组）；configure 的 umask 077 放宽为 022（E011，HMDFS 下 0700 临时目录不可写） [knowledge_ref: E007；E011]"
  - "上游 src/Makefile.am 以 -I$(srcdir)/include 引用生成头 preludedb-version.h（nodist_include_HEADERS）→ VPATH 构建必失败，配方固定 in-tree 布局（source == build） [knowledge_ref: reference: notes.md 编译步骤]"
  - "上游测试入口是随树发布的 vendored gnulib 自检 libmissing/tests（44 项），必须 cd 进该目录 make check（从父目录 -C 会让 libtool wrapper 的 getcwd 解析在 HMDFS 上失败） [knowledge_ref: reference: notes.md 验证结果]"
  - "preludedb_init() 依赖编译期常量 FORMAT_PLUGIN_DIR（prefix=/ → /lib/libpreludedb/plugins/formats），只有部署到设备根才存在；test_package 不应调用它 [knowledge_ref: reference: notes.md 注意事项]"

statistics:
  source_files: 332
  test_package_checks: 9
  upstream_tests: 44
  upstream_tests_pass: 44
