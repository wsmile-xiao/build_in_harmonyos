package: lastz/1.04.52
homepage: "https://github.com/lastz/lastz"

upstream_check_command: "make test && make base_tests && make -C src base_test_nib1"
upstream_test_in_build: true
upstream_test_command: "make test && make base_tests && make -C src base_test_nib1"
upstream_tests:
  - name: "LASTZ upstream regression suite"
    source: "upstream src/Makefile"
    description: "LASTZ upstream regression suite with 25 unique regression test targets"
    command: "make test && make base_tests && make -C src base_test_nib1"

test_package_tests:
  - file: test_lastz.c
    description: "消费者测试：编译并运行独立 C 测试程序，调用最终 Conan package 中的 lastz 执行 FASTA 序列比对，并验证输出"
    command: "conan test_package"

assertion_count: 5
