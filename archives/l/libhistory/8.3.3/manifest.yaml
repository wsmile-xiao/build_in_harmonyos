software: libhistory
version: "8.3.3"
status: built
build_system: autotools
build_date: "2026-09-19"

source:
  url: "https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz"
  sha256: "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "readline83-001.patch"
  - "readline83-002.patch"
  - "readline83-003.patch"
  - "0001-config.guess.patch"

knowledge_gained:
  - "libhistory 与 readline 同源同版发布，8.3.3 = readline-8.3 + 官方补丁 readline83-001..003"
  - "history 库不使用 termcap/ncurses，构建无需 curses 依赖"
  - "系统同名库族 (R26)：静态编译 + -fPIC，避免污染 /lib /lib64"
