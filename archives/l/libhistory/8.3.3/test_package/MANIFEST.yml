test_file: test_history.c
test_type: explicit
assertion_count: 9
description: |
  Tests libhistory (GNU History library) API only; the readline line-editing
  library is not linked:
  1. HS_HISTORY_VERSION >= 0x0803 (history.h version macro check)
  2. using_history + fresh state (history_length == 0)
  3. add_history x2 + history_get(history_base) round trip ("first command")
  4. history_length == 2 after insertions
  5. history_search("second", 1) substring match (direction 1 = forward)
  6. history_set_pos(0) + next_history traversal to 2nd entry ("second command")
  7. remove_history(0) + free_history_entry, history_length == 1 afterwards
  8. history_total_bytes() > 0 for remaining entry
  9. clear_history cleanup (history_length returns to 0)
