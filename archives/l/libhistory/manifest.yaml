# 软件级 manifest
# 遵循 ARCHIVE-SPEC v2.0

software: libhistory
display: "GNU History Library"
description: "Standalone command line history management library from GNU readline"
category: system
homepage: "https://tiswww.cwru.edu/php/chet/readline/rltop.html"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "与 readline 同源同版：8.3.3 = readline-8.3 + 官方补丁 readline83-001/002/003"
    - "必须设置 CFLAGS='-fPIC -O2'，否则静态库链接到共享库会报错"
    - "需要 config.guess 补丁添加 HarmonyOS 检测（config.sub 已原生支持 linux-ohos）"
    - "history 库不使用 termcap/ncurses，构建无需 curses 依赖"
    - "系统同名库 (R26)，必须静态编译避免污染 /lib /lib64"
  common_dependencies: []

versions:
  "8.3.3":
    status: built
    build_date: "2026-09-19"
