version: "1.7.0"
status: published
build_date: "2026-05-20"

source:
  url: "https://gitlab.freedesktop.org/xorg/lib/libxext/-/archive/master/libxext-master.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: manual
  configure_options:
    - "-fPIC"
  dependencies:
    - x11/1.8.7
    - xcb/1.16
    - xorgproto/2024.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "autotools configure 在 HarmonyOS 上受限，需手动编译"
  - "需要完整的 X11 依赖链（8层）"
  - "编译选项必须使用 -fPIC"
