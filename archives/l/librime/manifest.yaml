# 软件级 manifest — librime
# 文件位置: archives/l/librime/manifest.yaml

software: librime
display: "Rime Input Method Engine"
description: "Rime 输入法核心引擎（C++ 库），提供拼音/仓颉等输入法 schema 的调度、词典与配置引擎"
category: library
homepage: "https://rime.im"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "必须共享构建（BUILD_SHARED_LIBS=ON），否则上游根 CMakeLists 不添加 tools/ 与 test/"
    - "OHOS 下需设 LINUX=ON 以走 Unix/Boost-regex 分支并正确链接 boost_regex"
    - "依赖定位靠自定义 Find*.cmake（find_path/find_library），需把依赖 include/lib 目录注入 CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH"
  common_dependencies:
    - boost
    - glog
    - yaml-cpp
    - leveldb
    - marisa
    - opencc
    - gtest

versions:
  "1.17.0":
    status: built
    build_date: "2026-09-25"
    conan_ref: "librime/1.17.0"
