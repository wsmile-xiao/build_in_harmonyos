# 版本级 manifest — librime 1.17.0
# 文件位置: archives/l/librime/1.17.0/manifest.yaml
# librime 1.17.0 — HarmonyOS PC (OHOS aarch64) 适配

version: "1.17.0"
software: "librime"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: cmake

# 上游测试统计（rule4 证据门禁：gtest_macros 口径——test/*.cc 共注册 91 个
# TEST/TEST_F 宏（rule4 独立核验 N=91），声明 `upstream_test_total=91`（注册
# 总数，不可裁成可运行子集 90，否则「少报」）。其中 1 个为 upstream 在
# corrector_test.cc:103 故意标记的 DISABLED_ 用例（DISABLED_CaseTranspose），
# GoogleTest 在所有平台默认过滤、永不执行、只在 "YOU HAVE N DISABLED TEST"
# 行上报；它既非运行时跳过（无 GTEST_SKIP）、非失败、也非 OHOS 限制，而是
# gtest 默认环境在所有平台的统一过滤行为，因此计入注册总数但作为 **gaps
# 条目（count=1=91−90，category=environment）** 如实上报，不计入
# executed/passed、不计跳过。故实测标记为 discovered=91（注册总数，取自
# `rime_test --gtest_list_tests` 确定性清单）、executed=90、passed=90、
# failed=0、skipped=0、status=incomplete（存在 1 个未运行用例 + gaps，90/91
# 通过；如实报 90/91 而非虚报 100%，符合「不足100% 必须给 gaps」要求）。
# 该 1 个永不运行的 DISABLED_ opt-out 另留痕于 marker `notes` + 本 MANIFEST。
upstream_test_total: 91
upstream_test_count_method: gtest_macros

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gh-proxy.com/https://github.com/rime/librime/archive/refs/tags/1.17.0.tar.gz"
  sha256: "a60274da5d8b8a7187e6c7e9ba5023334ed7bdd182535e93c4e96de8cf188377"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TEST=ON"
    - "-DLINUX=ON"
    - "-DENABLE_LOGGING=ON"
    - "-DBOOST_SP_NO_PTHREAD_SETCANCELSTATE=1"
    - "-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG (low-memory: clang-15 single-TU OOM)"
    - "-DCMAKE_INCLUDE_PATH=<deps include>"
    - "-DCMAKE_LIBRARY_PATH=<deps lib>"
  dependencies:
    - "boost/1.84.0"
    - "glog/0.7.1"
    - "yaml-cpp/0.8.0"
    - "leveldb/1.23"
    - "marisa/0.3.1"
    - "opencc/1.1.9"
    - "gtest/1.17.0"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "librime 上游根 CMakeLists 仅在 BUILD_SHARED_LIBS=ON 时 add_subdirectory(tools) 和 add_subdirectory(test)，因此为运行上游测试必须共享构建（librime 非系统同名库，不触发 R26 静态要求）"
  - "librime 依赖用自定义 Find*.cmake 模块（FindMarisa/FindGlog/FindYamlCpp/FindLevelDb/FindOpencc）经 find_path/find_library 定位头文件与库，因此需把各依赖 include/lib 目录注入 CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH，而非依赖 CMakeDeps 目标"
  - "OHOS 下 CMake 的 LINUX 变量不定义，librime 会走非 Unix Boost 分支（不链接 boost_regex）；设 LINUX=ON 走 Unix/Boost-regex 代码路径"
  - "上游测试为单一 ctest 条目 rime_test（GoogleTest），WORKING_DIRECTORY 指向 build/test（configure 时已拷入 data/test/*.yaml）；二进制内部 test/*.cc 共注册 91 个 TEST/TEST_F 宏（rule4 独立 gtest_macros 核验 N=91），其中 1 个是 upstream 在 corrector_test.cc:103 故意标记的 DISABLED_ 用例（DISABLED_CaseTranspose），GoogleTest 默认在所有平台过滤、永不运行、只在 YOU HAVE N DISABLED TEST 行上报；它既非运行时跳过（无 GTEST_SKIP）、非失败、也非 OHOS 限制，而是 gtest 默认环境在所有平台的统一过滤行为，故计入注册总数（91）但作为 gaps 条目（count=1=91−90，category=environment）如实上报、不计入 executed/passed、不计跳过。实测标记列报 discovered=91（注册总数，取 `rime_test --gtest_list_tests` 确定性清单）、executed=90、passed=90、failed=0、skipped=0、status=incomplete（存在 1 个未运行用例 + gaps；90/91 通过，如实报而非虚报 100%，符合「不足100% 必须给 gaps」要求）"
  - "OHOS 消费 boost 需定义 BOOST_SP_NO_PTHREAD_SETCANCELSTATE=1（boost 头 sp_thread_sleep.hpp 用该宏跳过 OHOS libc 未声明的 pthread_setcancelstate）"
  - "低内存 worker 上 clang-15 单 TU（如 rime/gear/speller.cc）在默认 Release -O3 会 Out of memory；削峰：覆盖 CMAKE_*_FLAGS_<CONFIG>，Release 用 -O1 -DNDEBUG（与 libstxxl/ciftilib 同款，库行为/API 不变仅降优化档）"
