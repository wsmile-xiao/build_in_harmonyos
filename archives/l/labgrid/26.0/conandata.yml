sources:
  # CI 修复（PR #10780 首轮 CI）：files.pythonhosted.org 在 CI Worker 网络
  # ConnectTimeout（本地可达，CI 受限）。照 astlib/0.13.2 已合入先例改为
  # 有序 URL 列表：国内 PyPI 镜像优先、官方 URL 最后回退。镜像提供与官方
  # 完全相同的归档（四镜像逐一实测 sha256 == 官方），sha256 不变——
  # Conan get() 逐个尝试直到 sha256 命中。
  url:
    - "https://mirrors.aliyun.com/pypi/packages/58/23/e8b3e879003973999b70d56f238f80777dfa3c45450241de749c52657bc3/labgrid-26.0.tar.gz"
    - "https://mirrors.huaweicloud.com/repository/pypi/packages/58/23/e8b3e879003973999b70d56f238f80777dfa3c45450241de749c52657bc3/labgrid-26.0.tar.gz"
    - "https://mirrors.cloud.tencent.com/pypi/packages/58/23/e8b3e879003973999b70d56f238f80777dfa3c45450241de749c52657bc3/labgrid-26.0.tar.gz"
    - "https://pypi.tuna.tsinghua.edu.cn/packages/58/23/e8b3e879003973999b70d56f238f80777dfa3c45450241de749c52657bc3/labgrid-26.0.tar.gz"
    - "https://files.pythonhosted.org/packages/58/23/e8b3e879003973999b70d56f238f80777dfa3c45450241de749c52657bc3/labgrid-26.0.tar.gz"
  sha256: "686695d3fa8c0ac0c9a6e6b42f9c8e9e92a9363c9d4945718e5fc21e431bd3d8"

patches:
  - patch_file: "patches/0001-tests-conftest-optional-psutil.patch"
    patch_description: >-
      Make psutil optional in tests/conftest.py: on OHOS CI the hnp python3
      cannot dlopen C-extension .so files placed under /storage (Permission
      denied), and pytest >= 9 importorskip() only catches ModuleNotFoundError,
      so an installed-but-unloadable psutil would abort the whole test session.
    patch_type: "portability"
  - patch_file: "patches/0002-labgrid-pytestplugin-optional-usererror.patch"
    patch_description: >-
      Make the pytestplugin importable without gRPC: labgrid/pytestplugin/
      fixtures.py imports labgrid.remote.client.UserError at module level and
      remote.client imports grpc unguarded, so on OHOS CI (where the worker's
      interpreter cannot dlopen C-extension .so files under /storage) the
      whole plugin fails to load and the upstream tests that spawn
      `pytest --lg-env ...` subprocesses abort. Degrade to a local stand-in
      exception class; the gRPC-transport-dependent tests are excluded
      separately by the recipe's import probes.
    patch_type: "portability"
