  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # cmake | autotools | makefile | meson | custom
  # 纯 Python（setuptools / PEP 517），无本地编译，故为 custom
  system: custom

  # 配方 build() 流程（全部离线可复现，package() 不联网）：
  #   1. pip install --platform ohos_aarch64 --only-binary=:all:
  #      → 14 条运行期依赖定版闭包装入 build/deps/
  #   2. pip install 构建工具（setuptools/wheel/setuptools_scm）
  #      + 上游测试依赖（psutil/pytest-mock/pytest-benchmark/
  #        py-netgear-plus/pytest-timeout）→ build/testdeps/
  #   3. pip install --no-deps --no-build-isolation 安装 labgrid 本体
  #      → build/staging/（labgrid + dist-info + 6 个控制台脚本）
  #   4. python3 -m pytest tests -v …（上游全量套件真实执行）
  configure_options: []

  # 编译依赖（Conan 侧）：无。R36 口径 —— 14 条运行期依赖中仅
  # attrs/pyyaml/xmodem 在 ohpcd 可消费，其余 11 条未发布，故
  # requirements() 留空，改由 pip vendor 进包内 deps/（advocate/awscli 先例）。
  dependencies: []

  # 运行期 Python 依赖（vendor 进包内 deps/，不随 Conan requires 声明）
  #   attrs 26.1.0, exceptiongroup 1.3.1, grpcio 1.84.0,
  #   grpcio-reflection 1.84.0, protobuf 7.35.1, jinja2 3.1.6,
  #   pexpect 4.9.0, pyserial-labgrid 3.5.0.2, pytest 9.1.1,
  #   pyudev 0.24.4, pyusb 1.3.1, PyYAML 6.0.3, requests 2.34.2,
  #   xmodem 0.5.0
  python: "3.12"

  # 无 C/C++ 编译（纯 Python 包）
  cc: "n/a"
  cxx: "n/a"

