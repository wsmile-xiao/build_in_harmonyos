# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（PyPI 官方 sdist，含上游 tests/，用于 build() 中真实跑
  # 上游 pytest；GitHub tag tarball 亦可，此处取与 requirements 版本一致的
  # PyPI 归档）
  url: "https://files.pythonhosted.org/packages/58/23/e8b3e879003973999b70d56f238f80777dfa3c45450241de749c52657bc3/labgrid-26.0.tar.gz"

  # 源码校验和（sha256）
