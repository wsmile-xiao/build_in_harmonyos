# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "R36 机械口径只探测配方 self.requires/tool_requires：labgrid 的 14 条运行期依赖中 ohpcd 仅命中 3 条（attrs 26.1.0 / pyyaml 6.0.2 / xmodem 0.4.7.1），其余 11 条未发布——把未发布依赖写进 requires() 会直接硬阻塞构建，须走 pip vendor 路线"
  - "OHOS 无 libudev.so 是 udev 系 resource 的硬平台限制：pyudev 动态加载失败抛 ImportError: No library named udev，对应上游 4 个用例必然失败；正确做法是逐条登记为平台限制并如实计 failed，而不是 skip/xfail 掩盖"
  - "pytest tmpdir 夹具会校验 basetemp 属主 == 解释器 uid：构建目录内新建的目录属主是 buildbot uid（20401006），而进程 uid 是 20420178，因此必须把 TMPDIR 指向本进程 uid 所有的临时根（OHOS 上为应用 cache 目录的直接子目录，属主按父目录继承），否则全部 tmpdir 用例报 OSError（实测 98 errors）"
  - "pytest 子进程的 rootdir 由其参数路径上溯决定：嵌套 pytest（--lg-env 调用方）的 config/test 文件若落在 basetemp 下而 basetemp 又落在源码树内，子进程会命中源码 pyproject.toml 的 addopts=-p no:labgrid，插件被禁、--lg-env 不识别、打印 rootdir 行后立即退出（pexpect EOF）。显式 --basetemp 跳过 uid 归属校验（pytest 9.1.1 tmpdir.py getbasetemp 实证），因此 basetemp 可恒传且必须放在源码树之外"
  - "/storage（HMDFS/FUSE 型挂载）可写但拒绝 AF_UNIX socket bind（一律 EPERM，三处可写目录探针证实），el2 应用 cache 下 bind 可用：依赖 AF_UNIX 的代码（如 labgrid qemudriver）的临时根须做 bind 能力探测（可写+可 bind 两级），仅可写的根只够 basetemp/TMPDIR 用"
  - "沙箱解释器不解析裸程序名（subprocess/os.exec 层面）：绝对路径可 exec、bare name 抛 FileNotFoundError、/bin/sh -c 正常（PATH 解析发生在 shell 内）。上游测试与 labgrid 本体都是 POSIX 写法，故以 sitecustomize.py 形式注入 shutil.which 预解析，覆盖外层与所有子解释器"
  - "本平台只有 python3 没有裸名 python：pexpect 的 which() 预检会让数十个用例直接 ExceptionPexpect；用一个 /bin/sh 一行的 python 包装脚本置于 PATH 首位即可覆盖全部调用点，无需改上游"
  - "宿主 CLI 注入的解释器钩子会污染构建子进程：desktop CLI 通过 PYTHONPATH 注入 sitecustomize.py（内含 safe-delete 批量删除守卫，经 Node IPC broker 判定），pip 在 bdist_wheel 后清理临时目录时被判 CONFIRM_REQUIRED 而失败。配方侧对策是继承父进程 sys.path 时剔除含 sitecustomize.py 的目录（钩子属宿主策略，不是构建输入）；同族先例 archives/l/libmspub-tools/0.1.4 的 _sanitize_path()"
  - "同名异构不可替代：grpcio(PyPI) ≠ ohpcd grpc/1.70.0(C++)；protobuf(PyPI 发行版) ≠ ohpcd protobuf/33.6.1(C++)；pyserial-labgrid ≠ ohpcd pyserial/3.5（labgrid 自带 fork）"
  - "C 扩展包（grpcio/protobuf/PyYAML）在内网镜像只提供 cp312-cp312-ohos_aarch64 标签 wheel，必须 --platform ohos_aarch64 --only-binary=:all:，否则 pip 回退编译 sdist 并因 platform ohos is not supported 失败"
