# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: labgrid/26.0
homepage: "https://github.com/labgrid-project/labgrid"

# 上游测试入口：labgrid 无 make check / ctest / meson test，测试套件就是
# 源码包内的 tests/（58 个模块，pytest 驱动，含 tests/conftest.py 提供的
# target/env 夹具）。入口即 conanfile.py build() 中真实执行的那条命令。
upstream_check_command: "python3 -m pytest tests"
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest tests -v --tb=short --no-header -p no:cacheprovider --continue-on-collection-errors --timeout 300 --timeout-method=signal"

upstream_tests:
  - name: "tests/（上游 pytest 全量套件，OHOS aarch64 真机执行）"
    count: 474
    description: >-
      build() 中对 sdist 解包后的原始 tests/ 真实执行（未修改上游源码）。
      结果：414 passed / 4 failed / 60 skipped / 0 errors（478 discovered，
      其中 4 个模块因 pytest.importorskip 在收集期跳过：
      test_docker(docker)、test_onewire(onewire)、test_pyvisa(pyvisa)、
      test_tasmota(paho.mqtt.client)；test_protocol.py 与 conftest.py 为
      辅助模块，不含用例）。60 个 skip = 56 个用例级（22 个上游
      localsshmanager opt-in 标记、11 个 sshusername opt-in 标记、10 个缺
      user+mount+network namespace 能力、openocd 3、sigrok-cli 4、graphviz 1、
      minimalmodbus 1、pysnmp/kasa/vxi11 4）+ 4 个模块级收集期 importorskip。
      4 个 failed 全部为同一平台根因：HarmonyOS
      不提供 libudev.so（/system/lib64、/system/lib、/usr/lib、/vendor 均无），
      pyudev 抛 ImportError: No library named udev；已在 conanfile.py 的
      PLATFORM_LIMITED_TESTS 中逐条登记，不 skip / 不 xfail、如实计为 failed。
      log: reports/conan-create.log（构建日志中前缀 [labgrid upstream]）
  - name: "构建/测试期环境适配（3 项，均在 recipe 侧，上游零改动）"
    count: "N/A"
    description: >-
      1) TMPDIR/TMP/TEMP 指向本进程 uid 所有的临时根（pytest tmpdir 夹具校验
      basetemp 属主，构建目录内新建目录属主为 buildbot uid，必然不通过）；
      2) PATH 前置 <testdeps>/bin 与 testshim/（套件会以裸名 pytest / python
      二次拉起运行器，本平台只有 python3）；3) sitecustomize 形式的
      exec-PATH 仿真（沙箱解释器不解析裸程序名：绝对路径可 exec、bare name 抛
      FileNotFoundError、/bin/sh -c 正常）。

test_package_tests:
  - file: test_labgrid_consumer.py
    description: >-
      7 项消费者检查：包元数据/版本、vendored 运行期闭包导入（含 grpcio/
      protobuf/PyYAML 的 C 扩展）、labgrid 子系统导入、labgrid 自有 YAML
      loader/dumper 往返、Environment(config).get_target() 构造 Target、
      6 个控制台脚本存在且 shebang 为 #!/usr/bin/env python3 且 --help 退出 0、
      以及新增的鸿蒙消费者用例（CHECK 6）。
    command: "python3 test_labgrid_consumer.py <package_folder>"
  - file: test_harmonyos_consumer.py（新增，由 CHECK 6 生成并交给包自带 pytest 执行）
    description: >-
      **新增的 HarmonyOS 消费者用例**：下游视角的一个 pytest 运行，通过
      --lg-env 指定 labgrid 配置，验证交付包的 pytest11 -> labgrid.pytestplugin
      入口点被加载、env 夹具可用、env.get_target('main') 返回 Target、
      labgrid.__version__ 正确、以及 labgrid.util.yaml.load 解析的是包内实现。
      上游单元测试全部跑源码树，不覆盖"安装后的包 + 插件入口"这一消费者路径，
      故本用例为本次适配新增（2 passed）。子进程显式传
      PYTHONPATH=<site-packages>:<deps>，确保解析的是交付产物而非宿主环境。
    command: "python3 -m pytest <tmp>/test_harmonyos_consumer.py -v --lg-env <tmp>/lg_env.yaml"

assertion_count: 783
# 783 = 上游 tests/ 中 assert 语句数（grep -c '^\s*assert\b'），
# 不含 test_package 的 7 项消费者检查与新增鸿蒙用例的 5 个 assert。
