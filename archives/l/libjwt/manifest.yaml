software: libjwt
display: libJWT
description: "JSON Web Token (JWT) 库，支持 JWS 签名/校验与 JWK/JWKS"
category: crypto
homepage: https://libjwt.io
license: MPL-2.0
build_system: cmake
ohos_adaptation:
  key_points:
    - "上游用 pkg_check_modules() 定位依赖，配方需 PkgConfigDeps（仅 CMakeDeps 不够）"
    - "libcheck 的临时目录优先级为 TEMP > P_tmpdir > TMPDIR，OHOS /tmp 只读故必须设 TEMP"
    - "上游 add_test() 硬编码 /bin/bash，OHOS 无此路径 → 不使用 ctest，按等价语义直接跑测试二进制"
    - "零补丁适配：上游源码无需修改"
  common_dependencies:
    - "jansson"
    - "openssl"
versions:
  3.3.3:
    status: built
    build_date: '2026-09-15'
