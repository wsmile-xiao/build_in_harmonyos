# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 数据来源：本机 OHOS aarch64 实测（2026-09-15）。逐套件日志位于本机
# reports/upstream_tests/（本地证据路径，被 .gitignore 忽略、不随 PR 入库）；
# 入库的逐套件计数证据见本文件下方 upstream_tests 清单与 notes.md「上游测试结果」一节。
#   - 测试框架: libcheck（check/0.15.2）
#   - 注册方式: 上游 CMakeLists.txt 的 jwt_add_test()/add_test()，
#     WITH_TESTS=ON 且 pkg-config 找到 check>=0.9.10 时注册

package: libjwt/3.3.3
homepage: "https://github.com/benmcollins/libjwt"

# 上游测试入口（CMake/CTest 工程；无 autotools 的 make check）
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# OHOS 上 ctest 不可用：上游 add_test() 把解释器硬编码为 /bin/bash，而 OHOS 根文件
# 系统只有 /bin/sh（bash 位于 /data/service/hnp/bin/bash，非 FHS 路径）。
# 因此 build() 按 add_test() 的等价语义直接执行测试二进制：
upstream_test_command: "export TEST=<suite>; . tests/test-env.sh; exec tests/<suite>"

# 上游实际运行的测试程序（11 个 libcheck 套件，实测 147 个 check 用例全部通过）
upstream_tests:
  - file: tests/jwt_crypto.c
    source: libjwt-3.3.3/tests/jwt_crypto.c
    description: "加密后端能力与算法可用性（1 check）"
    command: "./tests/jwt_crypto"
  - file: tests/jwt_jwks.c
    source: libjwt-3.3.3/tests/jwt_jwks.c
    description: "JWKS 载入与 JWK 提取（5 checks）"
    command: "./tests/jwt_jwks"
  - file: tests/jwt_jwks_errors.c
    source: libjwt-3.3.3/tests/jwt_jwks_errors.c
    description: "非法 JWKS/JWK 的错误处理（4 checks）"
    command: "./tests/jwt_jwks_errors"
  - file: tests/jwt_ec.c
    source: libjwt-3.3.3/tests/jwt_ec.c
    description: "ECDSA/EdDSA（ES256/384/512、Ed25519、Ed448）签发与校验（4 checks）"
    command: "./tests/jwt_ec"
  - file: tests/jwt_rsa.c
    source: libjwt-3.3.3/tests/jwt_rsa.c
    description: "RSA（RS/PS 系列）签发与校验（8 checks）"
    command: "./tests/jwt_rsa"
  - file: tests/jwt_hs.c
    source: libjwt-3.3.3/tests/jwt_hs.c
    description: "HMAC（HS256/384/512）签发与校验（4 checks）"
    command: "./tests/jwt_hs"
  - file: tests/jwt_builder.c
    source: libjwt-3.3.3/tests/jwt_builder.c
    description: "builder 的 header/claim 设置与取值（18 checks）"
    command: "./tests/jwt_builder"
  - file: tests/jwt_checker.c
    source: libjwt-3.3.3/tests/jwt_checker.c
    description: "checker 的校验策略与回调（30 checks）"
    command: "./tests/jwt_checker"
  - file: tests/jwt_flipflop.c
    source: libjwt-3.3.3/tests/jwt_flipflop.c
    description: "加密后端选择与切换（22 checks）"
    command: "./tests/jwt_flipflop"
  - file: tests/jwt_claims.c
    source: libjwt-3.3.3/tests/jwt_claims.c
    description: "标准 claim 语义（exp/nbf/iss/aud 等，5 checks）"
    command: "./tests/jwt_claims"
  - file: tests/jwt_security.c
    source: libjwt-3.3.3/tests/jwt_security.c
    description: "算法混淆/签名篡改等安全回归（46 checks）"
    command: "./tests/jwt_security"

# 未注册到构建的套件（如实申报，非配方裁剪）
upstream_tests_not_registered:
  - file: tests/jwt-cli.bats
    description: "命令行工具端到端用例（9 个 bats @test）"
    reason: >-
      镜像内无 bats；上游 CMakeLists 用 find_program(bats) 探测，探测不到即不注册
      该测试（上游自身的优雅降级行为）。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者冒烟：JWKS 载入 → 取 JWK → HS256 签发 → 校验通过 → 篡改后校验失败（12 checks）"
    command: "./test_libjwt"
  - file: test_ohos.c
    description: >-
      鸿蒙（OHOS）平台特有测试（9 checks）：dlopen("libjwt.so") 验证加载器按
      裸 SONAME 解析（OHOS musl 无法经版本化软链解析，E505）；解析 ELF .dynamic
      段验证 DT_SONAME == "libjwt.so"（L5a 修复运行时证据）与 DT_NEEDED 含
      libjansson.so、不含 libcrypto/libssl（OpenSSL 静态链入）；/bin/sh 可执行
      （上游 add_test 硬编码 /bin/bash 的等价驱动解释器）
    command: "./test_ohos"

# 测试断言总数（上游 11 套件 147 + test_package 21：test.c 12 + test_ohos 9）
assertion_count: 147
