software: libsbp
# 版本级 manifest
# 文件位置: archives/l/libsbp/6.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "6.5.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/swift-nav/libsbp/archive/refs/tags/v6.5.1.tar.gz"
  sha256: "827e8d7559abb6a98adb7cb7d2c350cdacb7d7352c6b1461056d1630b82632c0"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-Dlibsbp_ENABLE_TESTS=ON"
    - "-Dlibsbp_ENABLE_DOCS=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DAUTORUN_TESTS=OFF"

  # 编译依赖列表（格式: name/version）—— 零 conan 依赖
  # 上游 submodule 由 conandata.yml submodules 段精确下载补齐
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-enable-tests-when-cross-compiling.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 tag tarball 不含 git submodule（c/cmake/common 为 swift-nav/cmake 框架、c/third_party/googletest 为测试框架），source() 按 v6.5.1 锚定的 submodule commit（swift-nav/cmake@d5558e3、googletest@b796f7d）精确下载补齐（E150 manual-download 模式）"
  - "swift_create_project_options 在 CMAKE_CROSSCOMPILING 时无条件禁用全部测试目标；上游框架自带 SKIP_CROSS_COMPILING_CHECK 逃生口，patch 一行即可在交叉工具链下构建 gtest 测试套"
  - "swift_add_test 不注册 ctest（只建 do-* custom target），上游测试通过直接运行 gtest 二进制执行；build-all-tests 聚合目标是构建全部测试的正确入口"
  - "OHOS 直跑上游测试：musl ld.so 需 LD_LIBRARY_PATH=/system/lib64 解析 libc++_shared.so（测试二进制链接 libc++_shared.so）；三个套件 12485 断言全过（439 个 DISABLED_SlowWrite 上游默认跳过）"
  - "sbp_message_send/sbp_process 帧级往返可在消费者测试中零桩验证（CRC + preamble + sender_id 逐字节断言）"
