# test_package/MANIFEST.yml — libsbp 6.5.1

package: libsbp/6.5.1
homepage: "https://github.com/swift-nav/libsbp"

# 上游测试命令（c/ 构建：test-libsbp / test-libsbp-cpp / test-libsbp-string，
# swift cmake 框架 swift_add_test 注册 do-* 目标而非 ctest）
upstream_check_command: "cmake -S c -B build -Dlibsbp_ENABLE_TESTS=ON && cmake --build build --target build-all-tests"

# conanfile.py build() 中已集成上游测试：
# - patch 0001（SKIP_CROSS_COMPILING_CHECK）使交叉编译下测试目标可用
# - vendored googletest 由 source() 按 v6.5.1 锚定 commit 下载补齐（E150）
# - build() 构建 build-all-tests 后直接运行三个 gtest 二进制
# - OHOS 运行时：LD_LIBRARY_PATH=/system/lib64 解析 libc++_shared.so
upstream_test_in_build: true
upstream_test_command: "test-libsbp && test/cpp/test-libsbp-cpp && test/string/test-libsbp-string"

# 上游注册的 gtest 测试目标（--gtest_list_tests 实测）：
#   test-libsbp        249（手写 edc/sbp/bitfield/utils + 240 auto_check roundtrip）
#   test-libsbp-cpp  12629（cpp traits/auto_check + structs）
#   test-libsbp-string   46（string 容器四类）
# 合计 N=12924；其中 439 个为上游标记 DISABLED_（SlowWrite 压力测试），
# 默认不执行，实跑 12485 个断言全过（2026-09-16 OHOS aarch64 clang15 实测）
upstream_tests:
  - file: c/test/*.cc（test_edc/test_sbp/test_bitfield_macros/test_utils + 240 auto_check_*.cc）
    source: libsbp-6.5.1/c/test/
    description: "C API 单测 + 240 个自动生成消息 roundtrip 测试（test-libsbp 套，249 用例）"
    command: "./test-libsbp"
  - file: c/test/cpp/*.cc + c/test/cpp/auto_check_*.cc
    source: libsbp-6.5.1/c/test/cpp/
    description: "C++ traits 单测 + 自动生成 C++ 结构测试（test-libsbp-cpp 套，12629 用例，其中 439 DISABLED_SlowWrite 上游默认跳过）"
    command: "./test-libsbp-cpp"
  - file: c/test/string/*.cc
    source: libsbp-6.5.1/c/test/string/
    description: "string 容器测试（unterminated/multipart/null_terminated/double_null_terminated，test-libsbp-string 套，46 用例）"
    command: "./test-libsbp-string"

# test_package 中自带的测试
test_package_tests:
  - file: test_libsbp.c
    description: "消费者测试 — crc16_ccitt 已知向量+累进、heartbeat 消息编解码往返、sbp_message_send 完整帧构造逐字节校验 + sbp_process 状态机还原"
    command: "./test_libsbp"

# 测试断言总数（assert 计数：crc16 2 + encode/decode 5 + frame 8 = 15）
assertion_count: 15
