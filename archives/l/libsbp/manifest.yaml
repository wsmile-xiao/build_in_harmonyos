# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: libsbp
display: "libsbp"
description: "Swift Navigation Binary Protocol (SBP) 客户端库：SBP 二进制协议消息定义（34 模块生成 C 源）、CRC16 校验、帧编解码核心与 string 容器"
category: foundation
homepage: "https://github.com/swift-nav/libsbp"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "零依赖纯 C 库（C11）；CMake 构建根在 c/ 子目录（仓库根含 rust/python/java 等多语言绑定）"
    - "上游 tag tarball 不含 git submodule（c/cmake/common 框架 + c/third_party/googletest），source() 按 tag 锚定 commit 精确下载补齐（E150）"
    - "swift_create_project_options 在 CMAKE_CROSSCOMPILING 时强制禁用测试，patch 加上游自带 SKIP_CROSS_COMPILING_CHECK 逃生口"
    - "swift_add_test 不注册 ctest（只建 do-* target），上游测试直跑 gtest 二进制；build-all-tests 为聚合构建目标"
    - "OHOS 运行测试需 LD_LIBRARY_PATH=/system/lib64（测试二进制链接 libc++_shared.so）"

  common_dependencies: []

versions:
  "6.5.1":
    status: built
    build_date: "2026-09-16"
    notes: "首次适配：submodule 补齐 + SKIP_CROSS_COMPILING_CHECK patch，上游 3 套 gtest 测试 12485/12924 全过（439 上游 DISABLED_SlowWrite 默认跳过）"
