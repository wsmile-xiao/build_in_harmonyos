package: libtracecmd/3.4.0
homepage: "https://git.kernel.org/pub/scm/utils/trace-cmd/trace-cmd.git"

# 上游官方测试：trace-cmd 只有一个测试套件 utest/（CUnit），`make test` 构建出
# trace-utest 再运行它。配方在 build() 里同样先 make test 构建，再按 tracefs 权限
# 决定要不要执行；跑不了就把原因写进日志（不静默通过、也不改判为通过）。
upstream_test_in_build: true
upstream_test_command: "make test && ./utest/trace-utest"

upstream_tests:
  - file: utest/traceevent-utest.c
    source: bundled/libtraceevent-1.9.0/utest/traceevent-utest.c（构建期输入，整体静态链入本包）
    framework: CUnit
    declared: 12
    executed: 12
    result: "tests 12/12 passed, 0 failed；asserts 41/41"
    count_command: "grep -cE '^[[:space:]]*CU_add_test' utest/traceevent-utest.c   # 12"
    run_command: "src/bundled/libtraceevent/utest/trace-utest -s"
    note: >-
      libtraceevent 1.9.0 是 libtracecmd 的硬依赖（include/trace-cmd/trace-cmd.h 直接
      包含它的 event-parse.h；trace-cmd 的 Makefile 要求 pkg-config libtraceevent >= 1.9，
      meson.build 写 >= 1.9.0）。制品仓未发布它，按 R36 只能作为构建期输入下载，
      并用 --whole-archive 整体链入 libtracecmd.so（真机实测该 .so 导出 587 个
      tep_*/tracefs_*/tracecmd_*/kbuffer_* 符号），所以它的目标文件确实活在交付的
      libtracecmd.so / libtracecmd.a 里——这个套件是本包所发布代码的真实测试。
      12 项里 11 项是纯内存的 kbuffer / 事件格式解析（dynamic string、cpumask 边界、
      sizeof() 长短），第 12 项 read BTF 由上游自己在缺
      /sys/kernel/btf/vmlinux 的内核上短路（日志打印 [KERNEL DOES NOT HAVE BTF]）。

  - file: utest/tracecmd-utest.c
    source: trace-cmd-v3.4/utest/tracecmd-utest.c
    framework: CUnit
    declared: 8
    assertions: 61
    executed: 0
    status: built-not-run
    count_command: "grep -cE '^[[:space:]]*CU_add_test' utest/tracecmd-utest.c   # 8"
    reason: >-
      8 项用例（Simple record and report / Create a histogram / Test convert from v7
      to v6 / Use libraries to read file / ... incremental / ... backwards / Test max
      length / Simple reset）全部经 run_trace() 起 ../tracecmd/trace-cmd 子进程去操作
      tracefs：record -e sched、sqlhist、reset -k kprobe、
      tracefs_instance_file_write(NULL, "kprobe_events"/"uprobe_events", ...)、
      tracefs_eprobe_alloc()。缺的是系统能力，不是依赖：真机 /sys/kernel/tracing 挂着
      tracefs(rw) 但目录是 root:root 0755，tracing_on / trace / kprobe_events /
      uprobe_events / dynamic_events / available_tracers 对构建用户
      uid=20020085(currentUser) 全部 r=N w=N；/proc/self/status 的
      CapEff=000000000000002a 不含 CAP_SYS_ADMIN；sudo -n true 回
      "open /dev/tty for write failed"（无免密提权），设备上也没有 setpriv/runuser/su。
      另外 3 项"读文件"用例的前置 __trace_test__.dat 由 record 产生，上游不提供离线
      fixture，把二进制 trace 文件塞进仓库也不是可复核的做法。因此配方构建该套件
      （证明在本平台可编译可链接）并在 tracefs 不可写时打印跳过原因，见
      conanfile.py 的 _tracefs_usable() / _run_trace_cmd_suite()；同一条代码路径在有
      权限的环境里会真的跑这 8 项。

  - file: utest/tracefs-utest.c
    source: bundled/libtracefs-1.8.3/utest/tracefs-utest.c（构建期输入，整体静态链入本包）
    framework: CUnit
    declared: 37
    executed: 0
    status: not-built
    count_command: "grep -cE '^[[:space:]]*CU_add_test' utest/tracefs-utest.c   # 37"
    reason: >-
      同样是 tracefs 写权限问题，而且这套件几乎逐项 tracefs_instance_create() 并写
      enable / events / kprobe 文件，在本环境整体不可运行；构建一个跑不动的套件不算
      测试证据，所以配方不去构建它。libtracefs 中可离线运行的部分改由消费者测试覆盖
      （tracefs_list_add/size/free、tracefs_get_tracing_file、
      tracefs_instance_exists，见 test.c）。

test_package_tests:
  - file: test.c
    description: >-
      消费者测试：只链接 libtracecmd（不显式 -ltraceevent / -ltracefs），覆盖
      tracecmd_open / tracecmd_open_head 对缺失文件与非 trace 文件的失败路径、
      随包静态链入的 tep_* 句柄引用计数 / long_size / page_size / comm 映射 /
      flag / strerror 行为、以及 tracefs_list_* 与 tracefs_get_tracing_file /
      tracefs_event_systems / tracefs_instance_exists 的离线行为
    command: "./libtracecmd_consumer_test"
    result: "checks 26, passed 26, failed 0"

assertion_count: 41
