# 版本级 manifest —— libtracecmd 3.4.0
# 遵循 ARCHIVE-SPEC v2.0

version: "3.4.0"
software: libtracecmd

status: built
build_date: "2026-09-28"
build_system: custom

# ⚠️ 交付的是 trace-cmd 仓库里的库（lib/trace-cmd → libtracecmd.so.1.5.5），不是
#    trace-cmd 命令行程序：CLI 是 GPL-2.0，只在构建目录里用来跑上游测试，不进包。
# ⚠️ 构建期输入：libtraceevent 1.9.0 / libtracefs 1.8.3 未发布到制品仓（R36），
#    以 --whole-archive 静态链入本库，公共头随包交付，包内只有一个库名。
build:
  system: custom-kbuild-make
  delivers:
    - lib/libtracecmd.so.1.5.5
    - lib/libtracecmd.so.1
    - lib/libtracecmd.so
    - lib/libtracecmd.a
    - lib/pkgconfig/libtracecmd.pc
    - include/trace-cmd/trace-cmd.h
    - include/event-parse.h
    - include/event-utils.h
    - include/kbuffer.h
    - include/trace-seq.h
    - include/tracefs.h
    - licenses/COPYING.LIB
    - licenses/LGPL-2.1
  bundled_inputs:
    libtraceevent: "1.9.0（upstream maintainer GitHub mirror, tag commit 13701b5532e0）"
    libtracefs: "1.8.3（upstream maintainer GitHub mirror, tag commit 6fad6a14ba0d）"
    reason: >-
      制品仓 keyword=libtrace 命中 0 条，写进 requires 会撞 L0i/R36；trace-cmd.h 直接
      包含 event-parse.h，pkg-config 下限是 libtraceevent>=1.9 / libtracefs>=1.8，无法
      回避。做法与已合入发布的 archives/c/chezdav/3.0、archives/a/augustus-game/4.0.0
      同一路线。
    link_form: "--whole-archive 进 .so；静态形态把三个归档并成一个 libtracecmd.a（46 个 .o）"
    verification: "真机 llvm-nm -D 计得 587 个导出 tep_*/tracefs_*/tracecmd_*/kbuffer_* 符号，DT_NEEDED 仅 libc.so"
  degraded_capabilities:
    zstd_compression: disabled
    vsock_transport: disabled
    python_bindings: disabled
    udis86_disassembler: disabled
    reason: >-
      zstd 在真机上只命中 harmonybrew /opt/zstd（非制品仓、非系统库，链进去会把消费者
      绑到构建机路径）；vsock 因 OHOS SDK 的 <linux/vm_sockets.h> 带入旧 <linux/socket.h>
      与 <sys/socket.h> 的 sockaddr_storage 重定义而无法编译；swig 缺失使 python 绑定
      上游本身也跳过；环境无 udis86。压缩段读写的 zlib 后端保留（requires zlib/1.3.1.1）。
  upstream_tests:
    framework: CUnit
    command: "make test && ./utest/trace-utest"
    in_build: true
    libtracecmd_suite:
      declared: 8
      executed: 0
      reason: "8 项逐项要写 tracefs（record/sqlhist/kprobe/uprobe/eprobe/reset）；真机 tracefs 为 root:root 0755，构建用户无 CAP_SYS_ADMIN 也无免密 sudo。配方仍构建该套件，按权限决定是否执行。"
    libtraceevent_suite:
      declared: 12
      executed: 12
      result: "12/12 通过，asserts 41/41"
      note: "该库整体静态链入本包，其上游套件即本包所发布代码的测试"
    libtracefs_suite:
      declared: 37
      executed: 0
      note: "逐项需要可写 tracefs，本环境整体不可运行，故不构建跑不动的套件；其离线部分由消费者测试覆盖"
  make_options:
    - "CC/AR/RANLIB/CFLAGS/EXTRA_CFLAGS/LDFLAGS 以环境变量前缀传入（命令行同名变量会经 MAKEFLAGS 覆盖子 make，丢掉顶层 override CFLAGS += 的 -I）"
    - "TEST_LIBTRACEEVENT=y / TEST_LIBTRACEFS=y + LIBTRACEEVENT_CFLAGS/_LDLAGS + LIBTRACEFS_CFLAGS/_LDLAGS：构建期输入不在 pkg-config 搜索路径里，直接给判定与 flag"
    - "ZLIB_INSTALLED=1 ZLIB_LDLAGS=-lz；NO_LIBZSTD=1；NO_PYTHON=1；NO_VSOCK=1；libtracefs 侧另给 VSOCK_DEFINED=0"
    - "CUNIT_INSTALLED=1（上游用裸 -lcunit 探测，装了 conan 包也探不到）"
    - "make -j8 目标：libtraceevent.a → libtracefs.a → test(libtraceevent) → libtracecmd.a + libtracecmd.so（仅此一次开 --whole-archive）→ trace-cmd → test(utest)"
    - "tool-shims/ 目录把 nm/objcopy/… 转发到 llvm-* 同名工具并前置 PATH"
    - "TMPDIR 类问题：make jobserver mkfifo 在 HOME 下 Operation not permitted，只告警不影响产物"
  dependencies:
    - zlib/1.3.1.1
  build_requirements:
    - cunit/2.1-3（test_requires，上游 CUnit 套件用，不进消费者依赖图）
  cc: clang
  cxx: 未使用（纯 C 工程）

patches_applied:
  - patches/0001-libtraceevent-btf-uapi-compat-and-qsort-r.patch
  - patches/0002-trace-timesync-pin-threads-without-glibc-np-affinity.patch

knowledge_gained:
  - "kbuild 风格 Makefile（trace-cmd / libtraceevent / libtracefs 同一套）里，把 CFLAGS 放到 make 命令行会让所有子 make 丢掉顶层 `override CFLAGS += $(INCLUDES)` 追加的 -I：命令行变量经 MAKEFLAGS 传播并保持 command-line 优先级，而顶层对 CFLAGS 的修改只体现在导出给子 make 的环境里。表现就是子目录里 `fatal error: 'xxx.h' file not found`。正确做法是 CFLAGS/EXTRA_CFLAGS 都走环境变量（libtraceevent 是 `CFLAGS := $(EXTRA_CFLAGS)`，压根不认环境里的 CFLAGS）"
  - "把未发布的库作为构建期输入整体链入时，`-Wl,--whole-archive` 只能用在生成 .so 那一次链接上：trace-cmd 自己的 CLI/utest 链接行里同时有 `$(LIBTRACECMD_STATIC)` 和 `-ltracecmd`，整体归档会把同一批目标文件装两遍，报一片 `ld.lld: error: duplicate symbol: tracecmd_*`。收尾的 `--no-whole-archive` 没有独立变量可挂，只能追加在 LIBS 里最后一个静态库的 flag 后面"
  - "OHOS 工具链只提供 `llvm-*` 前缀的 binutils 名字，而 libtraceevent 用裸 `nm`/`objcopy` 生成并落地它的符号本地化归档（redefine_local）；`ar`/`ranlib` 同样只在 profile [buildenv] 里有映射。真机 `command -v ar` 为空"
  - "上游用 `test-build`/`try-cc` 这类链接探测来决定要不要定义 HAVE_*（memfd_create、udis86、blk_flush、ptrace、audit…）。遇到 glibc 扩展缺失（这里是 `pthread_{get,set}affinity_np`）时，沿用它自己的探测位加一个 `HAVE_PTHREAD_AFFINITY_NP` 比按 `__GLIBC__` 判断可靠——musl 系也会定义兼容宏"
  - "tracefs.h / trace-cmd.h 的原型里用了 `cpu_set_t`，OHOS 与 glibc 都把它藏在 `__USE_GNU` 之后；上游三个 .pc 模板的 Cflags 都没有 -D_GNU_SOURCE，所以消费者（test_package）会报 `unknown type name 'cpu_set_t'`。配方在 cpp_info.defines 与随包 .pc 的 Cflags 里各补一份"
