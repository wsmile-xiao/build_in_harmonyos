sources:
  # CI worker cannot reach git.kernel.org, so use the upstream maintainer's
  # GitHub mirror at the commit referenced by tag trace-cmd-v3.4.
  url: "https://github.com/rostedt/trace-cmd/archive/3ce20923b3efa60d417da7acc8a327615fbd1419.tar.gz"
  sha256: "5e53c4fe38826c54207f94ba7b2ecaca87ab59af6286ec0ec379611b22d6a3cb"

# libtracecmd 的公共头 trace-cmd.h 直接暴露 libtraceevent/libtracefs 的接口，
# 二者是该库的硬依赖（pkg-config 要求 >= 1.9 / >= 1.8）。制品仓里没有
# libtraceevent/libtracefs（GET /api/registry?keyword=libtrace 为 0 条），按 R36
# 不能写进 requires，所以作为构建期输入下载并静态链入，随包交付其公共头。
bundled_sources:
  libtraceevent:
    # Commit pointed to by tag libtraceevent-1.9.0.
    url: "https://github.com/rostedt/libtraceevent/archive/13701b5532e0c3295bf5670361692b0d0044228d.tar.gz"
    sha256: "9ea838192731bd29ee10664531b7c4797bbb751123ca130e73588edbd58c61d5"
    version: "1.9.0"
    header_dir: "include/traceevent"
    public_headers:
      - event-parse.h
      - event-utils.h
      - kbuffer.h
      - trace-seq.h
  libtracefs:
    # Commit pointed to by tag libtracefs-1.8.3.
    url: "https://github.com/rostedt/libtracefs/archive/6fad6a14ba0d4c4b437d9e4eed7098d4bb07b4fc.tar.gz"
    sha256: "e8b81f964dde4aed0b0eee852dc67a765d411133b2c216c35d6b94e7e09bd76c"
    version: "1.8.3"
    header_dir: "include"
    public_headers:
      - tracefs.h

# 作用于主源码树（trace-cmd v3.4）；patches 目录下的 0001 面向构建期输入，
# 在 bundled_patches 里单独声明、单独应用。
patches:
  - patch_file: "patches/0002-trace-timesync-pin-threads-without-glibc-np-affinity.patch"
    patch_description: >-
      Probe for glibc's pthread_getaffinity_np()/pthread_setaffinity_np() next to
      the existing memfd_create probe and route the five trace-timesync call sites
      through helpers, so libtracecmd.so has no undefined affinity symbols on the
      OHOS libc (which only ships sched_getaffinity/sched_setaffinity).
    patch_type: "portability"

bundled_patches:
  libtraceevent:
    - patch_file: "patches/0001-libtraceevent-btf-uapi-compat-and-qsort-r.patch"
      patch_description: >-
        Build trace-btf.c against the OHOS SDK's pre-5.2 <linux/btf.h> (guarded
        fallback definitions for BTF_KIND_FLOAT/DECL_TAG/TYPE_TAG/ENUM64 plus the
        two structs) and replace the glibc-only qsort_r(3) with a thread-local
        comparator context.
      patch_type: "portability"
      # 配方用这两个字段做幂等判定（补丁引入的符号在打过的树里才存在）。
      probe_target: "src/trace-btf.c"
      probe_symbol: "tep_qsort_funcs"
