package: libunwind/1.6.2
homepage: "https://www.nongnu.org/libunwind/"

upstream_check_command: "make check -j1"
upstream_test_in_build: false
upstream_test_command: "conan create . -c user.libunwind:run_upstream_tests=True"
upstream_tests:
  - file: tests/Makefile.am
    source: libunwind-1.6.2/tests/Makefile.am
    description: "Autotools check suite for local and generic unwinding; ptrace/coredump optional groups are disabled in the OHOS recipe"
    command: "make check -j1"

test_package_tests:
  - file: test_libunwind.c
    description: "Builds and runs a consumer that captures a local context, initializes a cursor, reads IP/SP registers, and steps through stack frames"
    command: "./libunwind_consumer"

assertion_count: 6
