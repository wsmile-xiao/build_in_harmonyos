software: libhoel
display: "Hoel"
description: "C Database abstraction library with json based language (sqlite3 backend on OHOS; MariaDB/PostgreSQL backends unavailable on the registry)"
homepage: "https://github.com/babelouest/hoel/"
license: "LGPL-2.1-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "Database abstraction C library; runtime deps = orcania + libyder + jansson + sqlite3 (all from ohpcd, W0 verified)"
    - "MariaDB/PostgreSQL client libraries absent from ohpcd: backends trimmed (WITH_MARIADB=OFF/WITH_PGSQL=OFF), sqlite3 backend provides full coverage"
    - "Bundled find-modules (FindJansson/FindCheck) + CMake's FindSQLite3 forced to MODULE mode under CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON; conan package paths seeded (JANSSON_INCLUDE_DIR/JANSSON_LIBRARY, SQLITE3_INCLUDE_DIR/SQLITE3_LIBRARY, CHECK_INCLUDE_DIR/CHECK_LIBRARY)"
    - "BUILD_STATIC=ON: the conan CMakeDeps package exports only the *-static targets, so the unconditionally built shared target must link them too or the compile loses the include dirs (upstream else-branch bare names resolve to nothing)"
    - "/tmp is read-only on HarmonyOS PC (E002): upstream /tmp/test.db sqlite fixture routed through $TMPDIR via portability patch"
    - "No sqlite3 CLI on OHOS: test fixture seeded from upstream test/test.sqlite3.sql through python's sqlite3 module"
    - "Test suite (check/0.15.2, ohpcd) runs the 21 upstream check cases (core 12 + multi 9) inside conan create"
  common_dependencies:
    - orcania
    - libyder
    - jansson
    - sqlite3

versions:
  "1.4.29":
    status: built
    build_date: "2026-09-19"
    notes: "Initial OHOS aarch64 adaptation. 21/21 upstream check cases (core+multi, sqlite3 backend) pass inside conan create. Portability patch only (CMake wiring + TMPDIR test fixture); upstream assertions untouched."
