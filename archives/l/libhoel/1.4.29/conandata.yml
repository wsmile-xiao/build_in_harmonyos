patches:
  "1.4.29":
    - patch_file: "patches/0001-ohos-portability.patch"
      patch_description: "OHOS portability: (1) force MODULE-mode find_package for Jansson/SQLite3/Check so hoel's bundled find-modules stay in charge under CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON (conan CMakeDeps config-mode targets would otherwise bypass the upstream gates); (2) degrade the MariaDB/PostgreSQL REQUIRED lookups to backend OFF (client libs unavailable on the OHOS PC conan registry); (3) accept the camel-case Orcania/Yder VERSION_STRING that Conan CMakeDeps exports in the upstream version gates; (4) relax the Subunit hard requirement for the test tree (ohpcd libcheck is self-contained, same relaxation as orcania 2.3.3 / libyder 1.4.20) and link the tests against the actual library target under BUILD_STATIC; (5) resolve the /tmp/test.db test fixture through POSIX $TMPDIR when set, falling back to /tmp/test.db unchanged on regular Linux (OHOS /tmp is read-only) — no platform ifdefs, pure POSIX getenv. Upstream test assertions keep their expected results."
      patch_type: portability
