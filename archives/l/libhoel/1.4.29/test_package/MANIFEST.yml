# test_package/MANIFEST.yml - libhoel 1.4.29
# CI L0e requires this file to exist. Upstream test declaration (rule 4:
# no fabricated pass rates — every number below is backed by the conan create
# build log which builds + runs the unmodified upstream check suite).

package: libhoel/1.4.29
homepage: "https://github.com/babelouest/hoel/"

# Upstream v1.4.29 exposes a CTest suite via BUILD_HOEL_TESTING=ON
# (Check framework, test/core.c with 12 START_TEST cases and test/multi.c
# with 9 START_TEST cases, registered into the core and multi executables).
# The recipe's conanfile.py build() enables it and runs ctest against the
# unmodified upstream tests.
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

# The official upstream check suites (sqlite3 backend). core: 12 cases —
# hoel_init / escape_string / escape_string_with_quotes / insert / update /
# delete / json_insert / json_update / json_delete / json_select /
# json_escape / json_generate_where_clause. multi: 9 cases — escape_string /
# escape_string_with_quotes / insert / update / delete / json_insert /
# json_update / json_delete / json_select. All 21 pass on OHOS aarch64
# inside conan create ("100% tests passed, 0 tests failed out of 2"; the
# /tmp/test.db sqlite fixture is resolved through $TMPDIR on OHOS where
# /tmp is read-only, and is seeded from the unmodified upstream
# test/test.sqlite3.sql schema).
upstream_tests:
  - file: test/core.c
    source: hoel-1.4.29/test/core.c
    description: "upstream core check suite: 12 START_TEST cases in the core CTest executable (connect/close, string escaping, insert/update/delete, json-based query language, where-clause builder)"
    command: "./core"
  - file: test/multi.c
    source: hoel-1.4.29/test/multi.c
    description: "upstream multi-backend check suite (sqlite3 backend selected upstream): 9 START_TEST cases in the multi CTest executable (escape, insert/update/delete, json query round trips)"
    command: "./multi"

# test_package tests (consumer perspective: link Hoel::Hoel-static and
# exercise the public API on OHOS aarch64) — HarmonyOS-added validation.
test_package_tests:
  - file: src/test_hoel.c
    description: "Compile + link consumer that opens a sqlite database through hoel, creates the fixture table via h_execute_query_sqlite, runs a json INSERT (h_insert) + SELECT (h_select) round trip asserting the value round-trips, then a json DELETE (h_delete) asserting the table is empty; asserts the binary runs and prints all checks passed"
    command: "./test_hoel"

# HarmonyOS-added consumer assertions (4 API check groups in a single run:
# connect + schema bootstrap, json insert, json select round trip with value
# verification, json delete + emptiness verification). The 21 upstream check
# cases are tracked separately in upstream_tests above.
assertion_count: 4
