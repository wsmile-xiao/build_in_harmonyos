# 版本级 manifest
# 文件位置: archives/l/libhoel/1.4.29/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4.29"
software: "libhoel"
status: published
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://github.com/babelouest/hoel/archive/refs/tags/v1.4.29.tar.gz"
  sha256: "4b70f8646538fc24095e80043ef26010fccc7e7956212d4522b41e3a20186166"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_STATIC=ON"
    - "-DWITH_SQLITE3=ON"
    - "-DWITH_MARIADB=OFF"
    - "-DWITH_PGSQL=OFF"
    - "-DBUILD_HOEL_TESTING=ON"
  dependencies:
    - orcania/2.3.3
    - libyder/1.4.20
    - jansson/2.14
    - sqlite3/3.53.4
  test_dependencies:
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-ohos-portability.patch

knowledge_gained:
  - "hoel 1.4.29 上游 core+multi 两个 CTest 程序（12+9=21 check 用例）在 OHOS aarch64 全部通过（sqlite3 后端）"
  - "hoel bundled FindJansson/FindCheck 需 MODULE 模式 + conan 包路径种子（JANSSON_INCLUDE_DIR/JANSSON_LIBRARY），CMakeDeps 的 lowercase jansson::jansson target 与上游 Jansson::Jansson 大小写不匹配"
  - "CMake 内置 FindSQLite3.cmake 走 MODULE 模式时接受 SQLITE3_INCLUDE_DIR/SQLITE3_LIBRARY 种子，conan sqlite3/3.53.4 静态库可注入"
  - "OHOS 无 sqlite3 CLI：测试 fixture /tmp/test.db 用 python sqlite3 模块从上游 test/test.sqlite3.sql 建（与上游 CI 等价）"
  - "MariaDB/PostgreSQL 后端裁剪：WITH_MARIADB=OFF/WITH_PGSQL=OFF（ohpcd 制品仓无对应客户端库），sqlite3 后端全覆盖"
