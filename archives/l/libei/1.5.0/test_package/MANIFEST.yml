# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libei/1.5.0
homepage: "https://gitlab.freedesktop.org/libinput/libei"

# 上游测试命令：meson test（unit-tests + eierpecken + python 协议套件）
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试套件（meson test 8 个注册目标，177 个展开用例）
upstream_tests:
  - file: test/unit-tests.c
    description: "utils 公共库单元测试（unit-tests-utils，35 用例）"
    command: "meson test unit-tests-utils"
  - file: test/unit-tests.c
    description: "libei 客户端单元测试（unit-tests-ei，10 用例）"
    command: "meson test unit-tests-ei"
  - file: test/unit-tests.c
    description: "libeis 服务端单元测试（unit-tests-eis，7 用例）"
    command: "meson test unit-tests-eis"
  - file: test/test-ei.c
    description: "ei↔eis 集成测试 eierpecken（84/85 用例，socket_overflow 受 OHOS 缓冲区语义影响豁免）"
    command: "meson test eierpecken"
  - file: proto/protocol.dtd
    description: "协议 XML DTD 校验（dtdcheck，1 用例）"
    command: "meson test dtdcheck"
  - file: test/test_protocol.py
    description: "EI 协议 wire-format 集成测试（protocol-test，31 用例，需 pytest+structlog）"
    command: "meson test protocol-test"
  - file: test/test_scanner.py
    description: "ei-scanner 协议生成器测试（scanner-pytest，8 用例，需 pytest）"
    command: "meson test scanner-pytest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_package.c
    description: "C 消费者程序链接 libei.so/libeis.so 并调用公共 API（ei_new_sender/ei_is_sender/ei_get_user_data/ei_ref/ei_unref + eis_new/eis_unref，7 个断言）"
    command: "conan test"
  - file: conanfile.py
    description: "CMakeDeps find_package + cmake.test 驱动（2 个断言）"
    command: "conan test"

# 测试断言总数：上游 meson test 177 用例（实测 176 过 + 1 平台豁免）+
# test_package 消费者测试 9 断言
assertion_count: 186
