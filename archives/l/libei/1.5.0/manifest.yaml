software: libei
version: "1.5.0"
description: "Emulated Input 输入仿真协议库（libei 客户端 + libeis 服务端）"
license: MIT
category: input
build_system: meson
status: built
build_date: "2026-09-15"
homepage: "https://gitlab.freedesktop.org/libinput/libei"
source_url: "https://gitlab.freedesktop.org/libinput/libei/-/archive/1.5.0/libei-1.5.0.tar.gz"

ohos_adaptation:
  key_points:
    - "liboeffis 裁剪：依赖 sd-bus（libsystemd/libelogind/basu）OHOS 无，-Dliboeffis=disabled"
    - "tests=auto：CI worker 无 pytest/structlog 时自动降级仅 C 测试（munit vendor 进 subprojects）"
    - "tmpfile() 可移植性修复：musl tmpfile 硬编码只读 /tmp 恒 EACCES，munit.c 与 src/util-io.c 测试段改用 $TMPDIR 唯一文件（P_tmpdir 兜底，立即 unlink，纯 POSIX 无平台宏）"
    - "ninja 探测修复：/data/service/hnp/bin/ninja 依赖 /system/lib64/libc++_shared.so，默认 LD_LIBRARY_PATH 含带空格脏路径项导致 meson 探测失败——build env 前置干净 /system/lib64"
    - "上游测试实测：176/177 通过（eierpecken socket_overflow 受 OHOS Unix socket 缓冲区语义影响豁免）"

common_dependencies:
  - name: libxkbcommon
    version: ">=1.6.0"
    required: false
    note: "仅 tools（ei-demo-client）可选依赖，核心库不需要"
  - name: libevdev
    version: ">=1.13.3"
    required: false
    note: "仅 tools（eis-demo-server --uinput / ei-debug-events）可选依赖，核心库不需要"

upstream_tests:
  framework: "meson test + munit + pytest"
  total_cases: 177
  passed_cases: 176
  exempted_cases: 1
