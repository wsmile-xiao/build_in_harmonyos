package: liblapacke/0.3.30
upstream_test_in_build: true
upstream_tests:
  - file: "utest/（openblas_utest + openblas_utest_ext）"
    command: "build() 默认折入：make -C utest all CROSS=0，静态链接本构建 libopenblas 归档就地执行；utest 127/127 OK + utest_ext 1522/1522 OK（0 failed, 0 skipped，RESULTS 行在 conan create 构建日志）"
  - file: "lapack-netlib/LAPACKE/example/example_DGESV_colmajor.c"
    command: "build() 内编译+链接本构建产物 libopenblas 后在设备上真实执行（上游入口 make lapacke_example 以 $(FC) 链接执行；此轻量默认路径仅把链接器换成设备 CC，编译对象/头文件/被链库保持上游语义）"
  - file: "lapack-netlib/LAPACKE/example/example_DGESV_rowmajor.c"
    command: "同上（设备真实执行，stdout 输出于 conan create 构建日志）"
  - file: "lapack-netlib/LAPACKE/example/example_DGELS_colmajor.c"
    command: "同上（设备真实执行，stdout 输出于 conan create 构建日志）"
  - file: "lapack-netlib/LAPACKE/example/example_DGELS_rowmajor.c"
    command: "同上（设备真实执行，stdout 输出于 conan create 构建日志）"
  - file: "test/（BLAS blat1/2/3 × s/d/c/z）+ ctest/（CBLAS 包装）+ lapack-test（EIG 4 + LIN 10 + INSTALL 7 + lapack_testing.py -r -b TESTING）"
    command: "可选目标 RUN_UPSTREAM_TESTS=1（默认关，时长 2-3h 不进 CI 门禁）：make -C test all / make -C ctest all / make lapack-test，flang 驱动经 symlink overlay 资源目录补齐目标级链接件（crt/builtins/libunwind/libc），CROSS=0 解除就地执行门；真实执行证据见 run 报告所引日志（blat 24 次执行 92 PASS 块 0 fail；ctest 全过含 error-exits；lapack-test 判定通过，xlintstc 单族即 ≈4.7 CPU·h）"
upstream_tests_note: >
  上游测试已从 NOT_RUN 升级为真实执行：utest（上游 make tests 的 C 侧，1649 项断言）
  默认折入 build() 就地执行；Fortran 主体（test/ blat、ctest/ CBLAS、lapack-test 的
  EIG/LIN/INSTALL 与 lapack_testing.py 判定）经 RUN_UPSTREAM_TESTS=1 开启，真实执行
  通过（flang 驱动链接可执行文件由 overlay 资源目录补齐 crt/builtins/libunwind，
  不改上游源码逻辑；CROSS=1 系 c_check/f_check 探测记录，上游 ifneq(CROSS,1) 会
  静默跳过就地执行，测试步骤以 CROSS=0 覆盖）。唯一保留的偏差：LAPACKE example
  4 个演示的链接器仍为设备 CC（历史实现，轻量默认路径）；数值正确性另由
  test_package 的 7 项断言把关。
test_package_tests:
  - file: test.c
    description: "直接链接 libopenblas 并做真实数值计算（#include <lapacke.h>，链接期即核验 LAPACKE_* 符号真实导出）：LAPACKE_ilaver 版本一致性（内嵌 LAPACK 3.12.0）、dgesv colmajor/rowmajor 解线性方程组、dpotrf Cholesky、dgels 最小二乘、dgeev 非对称特征值+特征向量残差、dpotrf 负例（非正定 info=2），逐项校验计算结果而非仅解析符号"
    command: "./test_probe"
assertion_count: 7
