sources:
  "0.3.30":
    url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.30/OpenBLAS-0.3.30.tar.gz"
    sha256: "27342cff518646afb4c2b976d809102e368957974c250a25ccc965e53063c95d"
patches:
  "0.3.30":
    - patch_file: "patches/0001-ohos-flangnew-shared-link.patch"
      patch_description: "OHOS：exports/Makefile 的 FLANGNEW 共享库分支改用 $(CC) 链接并追加 $(FEXTRALIB)(flang 运行时)。原用 $(FC)=flang 当链接器会塞入不可用的 host 运行时导致链接失败。0.3.30 的 exports/Makefile:200 存在同一 FLANG/FLANGNEW 分支（同 openblas 0.3.33/0.3.34 先例），内容逐字复用。"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-musl-affinity.patch"
      patch_description: "musl 可移植性：blas_server.c 的 openblas_setaffinity/getaffinity 原实现调用 glibc 专有的 pthread_setaffinity_np/pthread_getaffinity_np（musl libc.so 不导出，NO_AFFINITY 不影响这两个 OS_LINUX 函数），改用 glibc/musl 共有的 sched_setaffinity/sched_getaffinity 适配：调用线程槽位（active_threads-1，上游 pthread_self() 特例）走 sched_*(0,...)，工作线程槽位 0..N-2 在 blas_thread_server 启动处以 syscall(SYS_gettid) 记录内核 TID 后按 TID 调用（glibc pthread_setaffinity_np 内部同语义）。不引入平台条件编译宏，两 API 符号集保持导出。"
      patch_type: "portability"
