software: liblapacke
version: "0.3.30"
build_system: makefile
status: built
source:
  url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.30/OpenBLAS-0.3.30.tar.gz"
  sha256: "27342cff518646afb4c2b976d809102e368957974c250a25ccc965e53063c95d"
knowledge_gained:
  - "liblapacke 无独立上游发布：0.3.x 版本号跟随 OpenMathLib/OpenBLAS，0.3.30 内嵌 LAPACK 3.12.0 与 LAPACKE C 接口，license BSD-3-Clause"
  - "NOFORTRAN 路线产不出 LAPACKE：Makefile.system NOFORTRAN=1 → C_LAPACK=1 → NO_LAPACKE=1；必须 tool_requires flang-ohos/20.1.0 全量 Fortran 构建（同 openblas 0.3.34）"
  - "0.3.30 两处 OHOS 补丁：exports/Makefile FLANG 分支 CC 链接+FEXTRALIB（0.3.30 在第 200 行，同 0.3.34 逐字复用）、blas_server.c musl affinity 本 run 重写为 sched_setaffinity/sched_getaffinity+syscall(SYS_gettid) 零平台宏适配（0.3.34 为 __OHOS__ 守卫版，两版本不同）——patch --dry-run 干净应用"
  - "flang-ohos 链接 Fortran 可执行文件：驱动自动补 FortranRuntime/Decimal 且不需要 libFortranMain（OHOS flang 程序对象自带 main+_QQmain 双符号）；缺的只是 crt/builtins/libunwind/libc 搜索——SDK 实体按 flang-20 期望文件名做 symlink overlay 资源目录 + LDFLAGS=-resource-dir 注入即可，不改上游源码（--sysroot 选项不被该驱动接受）"
  - "上游 Makefile 以 ifneq(CROSS,1) 静默跳过全部就地测试执行：c_check/f_check 在该构建链记录 CROSS=1；构建机=目标机时测试步骤命令行 CROSS=0 覆盖即真实执行（这是此前 lapack/3.12.1 等误判『无法执行』的真正根因之一）"
  - "上游测试真实执行（设备真机）：utest 127+1522 全 OK（默认折入 build()）；RUN_UPSTREAM_TESTS=1 时 test/ blat 12 程序×2 线程模式 92 PASS 块、ctest/ 全过、lapack-test（EIG+LIN+INSTALL+lapack_testing.py -r）通过但 COMPLEX/COMPLEX16 LIN 单族需数十分钟（xlintstc ≈ 4.7 CPU·h），全集 2-3h，不进 45min CI 门禁"
  - "test_package 必须 #include <lapacke.h> 并调用 LAPACKE_dgesv 等高层 C 接口做数值断言，防止『头文件在但 libopenblas 内 LAPACKE_* 接口不在』复发"
