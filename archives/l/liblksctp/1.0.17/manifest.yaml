version: '1.0.17'
status: built
software: liblksctp
build_date: '2026-10-03'
build_system: autotools

source:
  url: 'https://downloads.sourceforge.net/project/lksctp/lksctp-tools/lksctp-tools-1.0.17.tar.gz'
  sha256: '1aeb204cdb2befc94d9eb3037d1609c9d1d2cd5379d6dd2c0a8ca9b10533aa15'
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - '--enable-tests'
  dependencies: []
  cc: clang

patches_applied:
  - '0001-bin-config.guess.patch'
  - '0002-bin-config.sub.patch'
  - '0003-configure-umask-022.patch'

knowledge_gained:
  - 'E007：lksctp-tools 随包 bin/config.guess 是 2015 旧版，HarmonyOS 上 uname -s=HarmonyOS → cannot guess build type；须同时打 config.guess(HarmonyOS 分支)+config.sub(linux-ohos) 补丁，并在 generate() 显式传 --build=aarch64-unknown-linux-gnu / --host=aarch64-unknown-linux-ohos'
  - 'HMFS：configure 的安全临时目录 (umask 077 && mktemp -d ./confXXXXXX) 在 HMFS 上写 subs*.awk 被拒（could not setup config files machinery）；TMPDIR 重定向无效，须 configure 全文 umask 077→umask 022（先例 a52dec 0.7.4 0002-configure-umask-022.patch）'
  - 'lksctp-tools 的 src/func_tests 是 noinst_PROGRAMS 且上游未注册 TESTS=，make check 静默零执行；真正驱动是自定义目标 v4test/v6test，用例均为内核实时用例'
  - 'libsctp 的公开 API sctp_getaddrlen(family)（addrs.c:135）是纯用户态逻辑，不依赖内核 SCTP/socket，可作消费者确定性断言；库不依赖内核 SCTP 即可编译、安装、被链接'
  - 'R8/musl：func_tests 同时包含 <sys/socket.h> 与内核 uapi 头 <linux/socket.h>（rtoinfo.c 另含 <linux/in.h>/<linux/in6.h>）；musl 上 uapi 头重定义 struct sockaddr_storage/sockaddr_in/in6_addr → redefinition 编译失败。规则禁平台宏补丁，改用配方层 shim/linux/{socket,in,in6}.h（#ifndef __GLIBC__ 走用户态头，glibc 走 #include_next）+ exports + generate() 的 -I <recipe_folder>/shim 前置 shadow（先例 kbd/2.9.0）'
  - 'E077：libsctp.so / libwithsctp.so 与 bin 工具在 install 后须 llvm-objcopy 剥旧签名段 + binary-sign-tool 自签，否则 OHOS dlopen/执行报错'
