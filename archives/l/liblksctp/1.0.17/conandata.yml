# conandata.yml — liblksctp 1.0.17 (lksctp-tools)
# 上游: https://github.com/sctplab/lksctp-tools （发布 tarball 由 SourceForge 承载）

sources:
  liblksctp:
    url: "https://downloads.sourceforge.net/project/lksctp/lksctp-tools/lksctp-tools-1.0.17.tar.gz"
    sha256: "1aeb204cdb2befc94d9eb3037d1609c9d1d2cd5379d6dd2c0a8ca9b10533aa15"

patches:
  # autotools 随包 build-aux（本仓库名 bin/，由 configure.ac 的
  # AC_CONFIG_AUX_DIR(bin) 指定）里的 config.guess 是 2015 年的旧版，
  # 在 HarmonyOS 上 `uname -s` = "HarmonyOS" → "cannot guess build type"。
  # 两个补丁按 E007（平台三元组识别）给 config.guess 增加 HarmonyOS 分支、
  # 给 config.sub 增加 linux-ohos 支持，使 configure 能识别 aarch64-unknown-linux-ohos。
  # 只改 autotools 辅助脚本，不改任何产品源码。
  - patch_file: "patches/0001-bin-config.guess.patch"
    patch_description: "config.guess 增加 HarmonyOS 分支，输出 <machine>-unknown-linux-ohos（E007）"
    patch_type: "portability"
  - patch_file: "patches/0002-bin-config.sub.patch"
    patch_description: "config.sub 的 KERNEL-OS 列表加入 linux-ohos*，接受 aarch64-unknown-linux-ohos 三元组（E007）"
    patch_type: "portability"
  # HMFS（鸿蒙文件系统）上 config.status 的 `(umask 077 && mktemp -d ./confXXXXXX)`
  # 会在 cwd 建 0700 临时目录，随后往里写 subs*.awk 被拒（Permission denied →
  # "could not setup config files machinery"）。TMPDIR 重定向无效（目录名硬编码
  # ./confXXXXXX，且子 shell 显式 umask 077 不受 ambient umask 影响）。全文
  # umask 077 → umask 022（autoconf 里该串只出现在安全临时目录惯用法；生成的
  # config.status 从 here-doc 继承同文本，一次替换同步修复）。先例：a52dec 0.7.4。
  - patch_file: "patches/0003-configure-umask-022.patch"
    patch_description: "configure 临时目录 umask 077 → 022，规避 HMFS 上 config.status 写 subs*.awk 被拒"
    patch_type: "portability"
