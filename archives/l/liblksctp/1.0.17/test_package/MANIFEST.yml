# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: liblksctp/1.0.17
homepage: https://github.com/sctplab/lksctp-tools

# 上游测试情况：src/func_tests 的 v4/v6 用例是 noinst_PROGRAMS，上游未注册 TESTS=，
# `make check` 静默零执行；其真正驱动为自定义目标 v4test/v6test，且均为**内核实时**
# 用例（需 socket(AF_INET, SOCK_STREAM, IPPROTO_SCTP) 起真实关联）。本配方
# --enable-tests 全量编译这些用例，并在 build() 内用上游 checksctp 探针判定内核
# SCTP 是否可用：可用则逐条实跑 v4 用例，不可用则逐条标记「资源未执行」。
upstream_test_in_build: true
upstream_tests:
  - dir: src/func_tests
    driver: "make v4test / v6test"
    count: 41
    kind: live-kernel
    note: "src/func_tests 共 41 条内核实时用例：PASSING_KERN_TESTS 32 条(v4) + PASSING_V6_KERN_TESTS 9 条(v6，同一批源以 V6FLAGS 重编)；需内核 SCTP 支持"

# test_package 自带测试（消费者视角：头闭包编译 + 链接 libsctp + 运行期调用公开 API）
test_package_tests:
  - file: test.c
    description: "链接 -lsctp 并调用公开 API sctp_getaddrlen(AF_INET/AF_INET6/AF_UNSPEC) 校验返回值（纯用户态，确定性）"
    command: "./test_probe"

assertion_count: 3
