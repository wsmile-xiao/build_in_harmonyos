software: libtwin
display: "libtwin"
description: "Small software-rendered window system and pixmap library"
category: gfx
homepage: "https://git.kernel.org/pub/scm/linux/kernel/git/geoff/libtwin.git"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Supply explicit aarch64 build/host triplets for the old config.guess."
    - "Use libpng 1.6 APIs and link all enabled image dependencies into libtwin."
    - "Disable non-applicable X11, framebuffer, Linux input and TTF backends on OHOS."
  common_dependencies:
    - libpng
    - libjpeg-turbo
    - zlib

