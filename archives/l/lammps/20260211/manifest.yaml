version: "20260211"
software: lammps
status: built
build_date: "2026-09-24"
build_system: cmake
language: C++17 (clang, libc++)

source:
  url: "https://codeload.github.com/lammps/lammps/tar.gz/refs/tags/patch_11Feb2026"
  filename: "lammps-patch_11Feb2026.tar.gz"
  sha256: "b9ba0e368ee5af93f038b913e09a02b777a365ac6aea141842ded9b98b1efa8e"
  upstream_tag: patch_11Feb2026
  size_bytes: 159775060
  tar_format: tar.gz

build:
  system: cmake
  # The release tarball has NO CMakeLists.txt at the source root; the project
  # root is cmake/CMakeLists.txt, hence build_script_folder="cmake" while the
  # build directory stays at the source root (out-of-source is enforced by
  # cmake/Modules/PreventInSourceBuilds.cmake).
  cmake_source_subfolder: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DBUILD_MPI=OFF"
    - "-DBUILD_OMP=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TOOLS=OFF"
    - "-DBUILD_LAMMPS_GUI=OFF"
    - "-DWITH_SWIG=OFF"
    - "-DLAMMPS_INSTALL_RPATH=OFF"
    - "-DDOWNLOAD_POTENTIALS=OFF"
    - "-DUSE_INTERNAL_LINALG=ON"
    - "-DPKG_<X>=OFF for 29 packages that need an external library or a download"
  dependencies: []
  cc: clang
  cxx: clang++
  parallel_level: 1
  make_program: make

patches_applied: []

artifacts:
  - bin/lmp

tests:
  # R51 three-number declaration. Registered counts were measured with a
  # python walk over the extracted tar (toybox ls/readdir is unreliable on
  # HMDFS), pattern: add_test( | create_test_sandbox( | lammps_add_test(.
  # 2026-09-25 correction (audit r3 + raw grep re-run): whole_tree counts
  # add_test( lines over all 85 CMakeLists.txt files = 127 (unittest tree 106
  # + vendored lib/kokkos/** 21); the earlier os.walk helper undercounted
  # kokkos (reported 118/12) and its readings are retired.
  upstream_registered_calls_whole_tree: 127
  upstream_registered_calls_unittest_tree: 106
  upstream_cmake_files_total: 85
  upstream_gtest_enabled: false
  upstream_gtest_reason: "unittest/CMakeLists.txt downloads googletest at configure time (GTEST_URL + ExternalCMakeProject) and needs the Python/Fortran style trees; see notes.md"
  upstream_inputs_run_in_this_build: 5
  upstream_inputs_passed: 5
  upstream_inputs_detail:
    - "bench/in.lj verbatim: 100 MD steps, log.lammps has Total wall time and the step-100 thermo row"
    - "lmp -h: usage text contains -in"
    - "lmp -version: rejected by upstream (src/lammps.cpp:490) -> asserted as an argument-validation probe with rc=1"
    - "lammps --help: package-named K0 wrapper (bin/lammps) delegates to lmp -h, rc=0, upstream banner intact"
    - "lammps --version: package-named K0 wrapper prints lammps 20260211 (patch_11Feb2026), rc=0"
  test_package_assertions: 16
  test_package_result: "TOTAL=6 PASS=6 FAIL=0 SKIP=0 (control.cpp + in.lj + -h + -version + lammps --help + lammps --version)"

knowledge_gained:
  - "LAMMPS release tarballs keep the CMake project in cmake/ (no root CMakeLists.txt): CMakeToolchain/CMake.configure must use build_script_folder=cmake and keep the build dir at the source root."
  - "LAMMPS needs no MPI to build serially: BUILD_MPI=OFF resolves via cmake/CMakeLists.txt to an internal mpi_stubs target, so no openmpi dependency is pulled in."
  - "DOWNLOAD_POTENTIALS defaults to ON in this release and downloads from download.lammps.org at build time; it must be turned off for a hermetic CI build."

verify:
  conan_create: passed
  conan_verify: passed
  finish: passed (status built; driver FINISH_RC=2 was caused only by framework
    step5b YAML-scalar false positive and step8 gen_summary exception - see
    notes.md "收尾时间线与订正")
  device: HarmonyOS PC (B host), clang/clang++ from /data/service/hnp/bin
