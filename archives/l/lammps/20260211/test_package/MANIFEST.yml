schema_version: 1
package: lammps
version: "20260211"
homepage: https://www.lammps.org
upstream_test_in_build: false
upstream_tests:
  - file: bench/in.lj
    description: upstream 3d Lennard-Jones melt benchmark, 100 steps (input shipped verbatim as test_package/in.lj); re-confirms the version banner and Total wall time
    command: timeout 600 lmp -in in.lj -log log.lammps -screen none
  - file: (lmp CLI)
    description: command line help surface plus the upstream version banner
    command: timeout 60 lmp -h
  - file: (lmp CLI)
    description: upstream argument validation, -version is not an option of this build (src/lammps.cpp:490), exit code must be 1
    command: sh version_probe.sh lmp (asserts rc=1 and the upstream diagnostic)
  - file: (lammps wrapper CLI)
    description: K0 (2026-09-25) package-named wrapper entry, must answer --help/--version with rc=0 (upstream lmp only accepts single-dash -h)
    command: timeout 60 lammps --help && timeout 60 lammps --version
test_package_tests:
  - file: control.cpp
    description: toolchain self-proof, compiled with the same C++ compiler the recipe used
    command: timeout 300 <cxx> -o control control.cpp && timeout 30 ./control
  - file: in.lj
    description: real MD run, asserts Total wall time and the step-100 thermo row in log.lammps
    command: lmp -in in.lj
  - file: version_probe.sh
    description: expected-failure probe, the packaged binary must reject -version with exit code 1 and print upstream's argument-validation diagnostic; rc=124 (hang) is reported as an unexpected exit code, never as a pass
    command: sh version_probe.sh <lmp>
# Counting rule: sites that raise ConanException in test_package/conanfile.py
# (14 in test() + 2 in the _read helper; +3 K0 wrapper probes).  Stated so
# the number is checkable.
assertion_count: 16
build_files:
  - conanfile.py
  - control.cpp
  - in.lj
  - test.sh
  - version_probe.sh
outputs:
  - log.lammps
  - control.out
  - help.out
  - version.out
require_nonempty: true
