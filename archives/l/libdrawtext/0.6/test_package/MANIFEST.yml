# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libdrawtext/0.6
homepage: "https://github.com/jtsiomb/libdrawtext"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libdrawtext v0.6 无 tests/ 目录、无 check/test make 目标、无测试框架注册
# （R51 三步清点：0 目录 + 0 目标 + 0 注册，见 notes.md）
upstream_tests: []

# test_package 测试统计：
#   - 消费者测试：1（直接链接集成测试）
#   - 鸿蒙特有测试：1（test_ohos.sh，独立统计）
#   - dlopen/dlsym 符号探测：补充检查，不单独计数
# 内部多个断言不冒充独立测试用例。
#
# 消费者测试（test_consumer，1 用例）：直接链接安装后的 libdrawtext，
# 从包 include 目录用 #include <drawtext.h>，编译 -I<package>/include
# -L<package>/lib -ldrawtext，直接调用完整公开 API 链（dtx_open_font →
# dtx_target_raster → dtx_use_font → dtx_prepare_range → dtx_position/
# dtx_string → dtx_string_width/height → dtx_get_font_glyphmap →
# dtx_get_glyphmap_width/height → dtx_get_glyphmap_image → dtx_close_font）
# 渲染系统 TTF 字体（ASCII + UTF-8 CJK U+4E2D）并断言：非零像素 ≥ 500、
# 清零重渲染、字符串度量、glyphmap 墨水像素、dtx_get_glyphmap_image 与
# dtx_get_glyphmap_pixels 返回一致（补丁 0001 别名等价）、资源释放。
#
# 公共 API 修复说明（patches/0001-glyphmap-image-export.patch）：
#   - drawtext.h 声明 dtx_get_glyphmap_image 但库从未导出该符号
#   - 消费者直接调用 dtx_get_glyphmap_image：修复前链接失败
#     （undefined reference），修复后编译、链接、运行全部通过
#
# 鸿蒙特有测试（test_ohos.sh，1 用例，独立执行独立统计）：
#   1. 包内安装产物 lib/libdrawtext.so.0 存在（非源码/构建目录）
#   2. readelf -h：ELF64 + AArch64（ohos-aarch64 包归属）
#   3. readelf -d：SONAME == libdrawtext.so.0
#   4. readelf -d：NEEDED 含 libfreetype.so.6
#   5. readelf -d：NEEDED 不含 libGL/libGLU/GLEW/GLUT/libEGL/libOSMesa
#   6. readelf -SW：.codesign 段存在（OHOS 签名，E212；缺签名非零退出）
#   7. 运行直接链接的软件 raster 消费者：NO_OPENGL 模式下真实字体加载 +
#      软件光栅化 + 非零像素（证明禁用桌面 GL 后核心渲染能力可用）
test_package_tests:
  - file: conanfile.py
    description: >-
      消费者集成测试（1 用例）：直接链接安装后的 libdrawtext 调用完整
      公开 API 链渲染并断言可观察结果（含 dtx_get_glyphmap_image 修复
      验证）；附 dlopen + 14 符号 dlsym 补充检查（不计数）
    command: "conan create -tf=test_package"
  - file: test_ohos.sh
    description: >-
      鸿蒙特有测试（1 用例，独立统计）：包内 so 的 ELF64/AArch64 架构、
      SONAME、NEEDED(freetype/无桌面 GL)、.codesign 段检查 + NO_OPENGL
      软件光栅化消费者真实运行
    command: "sh ./test_ohos.sh <pkg> ./test_consumer"

# 测试断言总数 (近似值, 用于质量评估)
# consumer 7 + ohos 7 + probe 14(dlsym) = 28
assertion_count: 28
