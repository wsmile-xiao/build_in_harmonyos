# 版本级 manifest
package: libdrawtext
software: libdrawtext
version: '0.6'
status: built
build_date: '2026-09-08'
upstream: https://github.com/jtsiomb/libdrawtext
upstream_license: LGPL-3.0-or-later
archive_url: https://github.com/jtsiomb/libdrawtext/archive/refs/tags/v0.6.tar.gz
archive_sha256: 714d94473622d756bfe7d70ad6340db3de7cc48f4f356a060e3cb48900c6da01
license_file: COPYING.LESSER
homepage: https://github.com/jtsiomb/libdrawtext
description: >
  Simple library for anti-aliased text rendering in OpenGL, with a
  software rasterizer backend (dtx_target_raster) and FreeType font
  loading. Packaged for OHOS with the GL backend compiled out
  (-DNO_OPENGL) and freetype linked from the Conan dependency.

build_system: make      # custom sh configure -> Makefile.in -> make
languages: c
library_type: shared
soname: libdrawtext.so.0
build_tools:
  - make
  - clang
  - llvm-ar

conan:
  settings: [os, arch, compiler, build_type]
  options: {shared: true, fPIC: true}
  default_options: {shared: 'true', fPIC: 'true'}
  requires: [freetype/2.14.3]
  system_libs: [pthread]

profiles:
  ohos-aarch64: ci/conan/profiles/ohos-aarch64

os_whitelist: [OHOS]
min_compiler: clang 15
pkg_config_name: libdrawtext

# 消费者测试 1/1（test_package）+ 鸿蒙特有测试 1/1（test_ohos.sh）
test_passed: 2
test_failed: 0

upstream_tests:
  tests_dirs: 0
  test_targets: []
  test_framework: none
  note: >
    上游 v0.6 无 tests/ 目录、无 test/check make 目标、无任何测试框架
    注册（examples/ 为演示程序、tools/font2glyphmap 为 CLI 工具，均非
    测试套件）。按 W2/R51 规则如实清点为 0；实质测试以 test_package
    补全（真实 TTF 渲染 + 像素断言，见 test_package/test.c）。

patches_applied:
  - file: patches/0001-glyphmap-image-export.patch
    type: bugfix
    description: >
      Public-header/exported-symbol contract fix: drawtext.h declares
      dtx_get_glyphmap_image but the library only ever exported
      dtx_get_glyphmap_pixels (font.c, same signature/ownership — a
      borrowed pointer into the glyphmap). The patch adds a forwarding
      alias so the header's promise links, and declares
      dtx_get_glyphmap_pixels in the public header (reverse drift),
      making the header↔library symbol contract hold both ways.
      Not OHOS-specific: any downstream consumer calling the declared
      API fails to link.
adaptation_notes: >
  OHOS 无桌面 libGL/libGLU；上游 drawgl.c 自带 #ifndef NO_OPENGL 官方
  stub 分支，故以 -DNO_OPENGL 编译掉 GL 后端，公共 API 保持完整，
  raster 软件光栅化与 FreeType 字体链路全功能可用。

knowledge_gained:
  - "公共头文件声明集与 ELF 导出符号集可双向漂移：声明未导出（dtx_get_glyphmap_image）与导出未声明（dtx_get_glyphmap_pixels）并存；消费者级 nm -D ↔ 头声明双向审计 + 源码级等价性判定 + 最小转发别名补丁修复 — knowledge_ref: knowledge/drafts/E566-draft-header-export-symbol-contract-drift.kv"
