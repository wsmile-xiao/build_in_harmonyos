# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: linenoise-ng/v1.0.0
homepage: "https://github.com/arangodb/linenoise-ng"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# linenoise-ng v1.0.0 官方 tarball 无独立测试框架/无 ctest 注册；
# 唯一测试源 tst/example.c 是 VT100 交互式样例（需真实 TTY），
# 归类为样例而非独立用例，不计入上游测试总数。
upstream_tests:
  - file: example.c
    source: linenoise-ng-1.0.0/tst/example.c
    description: "VT100 交互式样例（非独立测试用例，需真实 TTY；headless 下无输入即退出）"
    command: "./example"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 冒烟测试 + 0002 收缩回归：linenoiseHistorySetMaxLen / Add / 去重拒绝 / 未满收缩到 2 -> Save(断言仅非空行) / Load 回读（回退 0002 补丁则该测试 Signal 11 失败）"
    command: "./test_linenoise-ng"

# 鸿蒙专项测试（随本 PR 交付于 test_package/ohos_test.c，接入 ctest 目标 ohos_test）
# 复现命令：conan create 后在 test_package build 目录运行 ctest -R ohos_test
#       或：clang++ -std=c++11 -I<包 include 目录> ohos_test.c <liblinenoise.a> + 运行
ohos_specific_tests:
  - file: test_package/ohos_test.c
    description: "非交互公开 API 测试（15 断言）：history 增删/去重/收缩/持久化 round-trip，含 v1.0.0 setmaxlen 收缩 NULL 解引用回归"
    command: "./test_package/ohos_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
