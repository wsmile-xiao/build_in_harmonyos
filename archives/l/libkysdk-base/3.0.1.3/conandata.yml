# conandata.yml — libkysdk-base 3.0.1.3
#
# 源码来源说明（R39）：
#   上游官方仓库 = https://gitee.com/openkylin/libkysdk-base（Kylin Team 维护），
#   对应的打包分支 tag `debian/3.0.1.3-1`，其指向的不可变 commit 见下。
#   采用 git 源而非归档 URL 的两个原因：
#     ① gitee 的 `repository/archive` 端点在非 curl UA 下返回 HTML 下载页
#        （conan 客户端实测 content-type=text/html，sha256 必然失配），归档不可用；
#     ② gitee 生成的归档不保证逐字节可复现（与 ncnn 配方同因），
#        锁 commit 更可靠。
#   本仓库其余配方（archives/n/ncnn、archives/n/nymphcast）已使用同形态 git 源。
#   键名用 url（conan G1 契约要求 sources.url 显式声明取源地址，
#   同时与 Git.clone(url=...) 的参数名一致）；值为官方 git 仓库地址。
sources:
  url: "https://gitee.com/openkylin/libkysdk-base.git"
  tag: "debian/3.0.1.3-1"
  commit: "ae4ef581caacbc3b51501e9f78765eeb795819a1"

# 补丁分三类：
#   A. 可重定位/安装路径（0001/0002/0004）：上游把 /usr/include、/usr/bin、/etc
#      写成绝对路径，cmake --install 会直写宿主系统目录。
#   B. conan 依赖接入（0002/0004）：pkg-config 取头/库、libsystemd 能力探测。
#   C. glibc↔musl 差异与上游代码缺陷（0003/0005-0011）：OHOS 用 musl，
#      无 glibc 内部类型/宏、无 pthread 取消 API。
patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "顶层 CMakeLists.txt: CMAKE_INSTALL_HEADER_DIR 由绝对路径 /usr/include/kysdk/kysdk-base 改为 ${CMAKE_INSTALL_INCLUDEDIR}/kysdk/kysdk-base（绝对路径无法重定位）"
    patch_type: "portability"
  - patch_file: "patches/0002-src-conf2-CMakeLists.txt.patch"
    patch_description: "src/conf2/CMakeLists.txt: sqlite3 由裸 -lsqlite3 改为 pkg_check_modules(SQLITE3) 提供头/库（api/*.c 直接 include <sqlite3.h>）；补 link_directories(${GLIB_LIBRARY_DIRS}/${YAML_CPP_LIBRARY_DIRS})——pkg_check_modules 的 -L 目录在 *_LIBRARY_DIRS，缺失导致 ld.lld unable to find -lglib-2.0/-lyaml-cpp；CLI 安装目录 /usr/bin 改为 ${CMAKE_INSTALL_BINDIR}"
    patch_type: "portability"
  - patch_file: "patches/0003-src-diagnostics-nlohmann-detail-input-input_adapters.hpp.patch"
    patch_description: "src/diagnostics/nlohmann/.../input_adapters.hpp: 上游 vendored nlohmann/json 被改坏——`size_t length = sb.length;` 取成员函数而非调用结果（clang 报 non-static member function must be called），恢复上游实现 std::strlen(ptr)"
    patch_type: "bugfix"
  - patch_file: "patches/0004-src-log-CMakeLists.txt.patch"
    patch_description: "src/log/CMakeLists.txt: libsystemd 由硬链接改为能力探测（check_include_file systemd/sd-journal.h）——OHOS 无 systemd 运行时、制品仓 systemd/261 亦无本图配置二进制；kylog-rotate-default 安装目录 /etc/... 改为 prefix 相对路径"
    patch_type: "portability"
  - patch_file: "patches/0005-src-log-format.c.patch"
    patch_description: "src/log/format.c: __glibc_likely(x) 3 处改为 (x)——glibc 内部宏，musl(OHOS) 不存在"
    patch_type: "portability"
  - patch_file: "patches/0006-src-log-klog_dump.c.patch"
    patch_description: "src/log/klog_dump.c: `isdigit(p)` 传指针改为 `isdigit((unsigned char)*p)`（上游缺陷；glibc 下仅告警，musl 下 isdigit 是宏直接编译失败），并修正 p 的 const 限定"
    patch_type: "bugfix"
  - patch_file: "patches/0007-src-log-klog_mqueue.c.patch"
    patch_description: "src/log/klog_mqueue.c: 异步刷新线程改用协作式退出标志（musl 无 pthread_cancel/testcancel/setcancelstate）；__glibc_unlikely(x) 改为 (x)"
    patch_type: "portability"
  - patch_file: "patches/0008-src-log-write.c.patch"
    patch_description: "src/log/write.c: sd_journal_send 调用改由 KYLOG_HAVE_SD_JOURNAL（CMake 能力探测宏）守护，探测不通过时回退 POSIX syslog(3)，避免未解析符号与日志静默丢弃"
    patch_type: "portability"
  - patch_file: "patches/0009-src-timer-libkytimer.c.patch"
    patch_description: "src/timer/libkytimer.c: 定时器核心线程改用协作式退出（musl 无 pthread_cancel/testcancel/setcancelstate）；epoll_wait 由 -1 改为 200ms 超时以周期性观察退出标志；destroy 改为置标志 + pthread_join"
    patch_type: "portability"
  - patch_file: "patches/0010-src-utils-kyutils.c.patch"
    patch_description: "src/utils/kyutils.c: 删除依赖 glibc 内部类型/宏的 typedef 块（__uintN_t/__intmax_t/__WORDSIZE/__PRI64_PREFIX/PRIu64 重定义）——定长整型与 PRIu64 由 <stdint.h>/<inttypes.h> 提供"
    patch_type: "portability"
  - patch_file: "patches/0011-src-utils-kyutils.h.patch"
    patch_description: "src/utils/kyutils.h: `#include <bits/types.h>`（glibc 内部头）改为 `#include <sys/types.h>`——musl sysroot 无 bits/types.h"
    patch_type: "portability"
