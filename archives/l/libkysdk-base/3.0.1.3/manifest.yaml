build:
  system: cmake
  configure_options:
    - "CMAKE_SYSTEM_NAME=Linux (E092：CMake 无 HarmonyOS platform 模块)"
    - "BUILD_SHARED_LIBS=ON (上游各模块固定 add_library(... SHARED ...))"
    - "Qt6_DIR/Qt6Sql_DIR -> qtbase-sql-dbus/6.11.1（ohpcd 的 qtbase 关闭 FEATURE_sql）"
  cmake_version: "4.1.2"
  dependencies:
    - "glib/2.84.0.1"
    - "gtk/3.24.43"
    - "dbus/1.14.10"
    - "sqlite3/3.53.4"
    - "openssl/3.5.6.1"
    - "yaml-cpp/0.9.0"
    - "qtbase-sql-dbus/6.11.1"
    - "expat/2.8.2.1 (override；统一 dbus→2.8.2 与 fontconfig→2.8.2.1)"
  removed_dependencies:
    - "systemd/261（已移除：全库唯一用法 write.c:sd_journal_send()，改为能力探测 + syslog(3) 回退；OHOS 无 journald，且 ohpcd 该包与本图 zlib 版本冲突且无可消费二进制）"
  pkgconfig_shims:
    - "gio-unix-2.0.pc（glib 配方无该组件）"
    - "dbus-1.pc（dbus 未设 pkg_config_name）"
    - "openssl.pc（openssl 仅导出组件级 .pc）"
  cc: clang
  cxx: clang++

