# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试入口共两个（本文件如实申报两者）：
#   入口一：CMake 内建测试目标（各模块 CMakeLists 里的 add_executable，
#           随 conan create 的 cmake.build() 一起编译）——已实际执行，12/12 通过
#   入口二：qmake + gtest/gmock 套件 src/tests/*.pro（上游 auto-test.sh 驱动）
#           ——已实际执行：7 个套件 / 84 个用例中，6 个套件可构建运行
#           （3 个套件用例全通过、1 个部分通过、2 个运行期缺环境数据中止），
#           另 1 个 kyutils-gtest 因上游用例引用不存在的 strisletter() 无法编译。
#           逐项结果见 reports/test-report.md
#
# 用例口径（全仓统一，勿改）：上游声明用例总数 = CMake 内建 12 + gtest 84 = 96；
#   其中「有完整结果」的 42 例（CMake 12/12 + gtest 30/30）全部通过；
#   剩余 54 例未完成，原因均为本环境缺桌面数据/服务，或上游用例自身缺陷。

package: libkysdk-base/3.0.1.3
homepage: "https://gitee.com/openkylin/libkysdk-base"

# 上游测试命令
upstream_check_command: "cmake --build <builddir>（内建测试目标）+ qmake src/tests && make（gtest 套件）"

# conanfile.py build() 是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 入口一：CMake 内建测试目标（12 个，全部实测 rc=0）
upstream_tests:
  - file: src/utils/sample/kyutils_sample.c
    source: libkysdk-base-3.0.1.3/src/utils/sample/kyutils_sample.c
    description: "kyutils 容量进制转换（目标名 test-utils）"
    command: "./test-utils"
  - file: src/utils/data-structure/linklist/skip_linklist/test/delete_test.c
    source: libkysdk-base-3.0.1.3/src/utils/data-structure/linklist/skip_linklist/test/delete_test.c
    description: "跳表删除与顺序一致性（目标名 test-delete，含 20s 随机 sleep）"
    command: "./test-delete"
  - file: src/utils/data-structure/linklist/skip_linklist/test/insert_test.c
    source: libkysdk-base-3.0.1.3/src/utils/data-structure/linklist/skip_linklist/test/insert_test.c
    description: "跳表插入与层级打印（目标名 test-insert，上游 sleep(1)×100 约 100s）"
    command: "./test-insert"
  - file: src/utils/data-structure/linklist/skip_linklist/test/search_test.c
    source: libkysdk-base-3.0.1.3/src/utils/data-structure/linklist/skip_linklist/test/search_test.c
    description: "跳表查找（目标名 test-search）"
    command: "./test-search"
  - file: src/timer/test/test-kytimer.c
    source: libkysdk-base-3.0.1.3/src/timer/test/test-kytimer.c
    description: "定时器注册/回调/停止（目标名 test-kytimer）"
    command: "./test-kytimer"
  - file: src/log/test/test-log.c
    source: libkysdk-base-3.0.1.3/src/log/test/test-log.c
    description: "日志写入（目标名 kylog-testlog）"
    command: "./kylog-testlog"
  - file: src/log/test/test-setdir.c
    source: libkysdk-base-3.0.1.3/src/log/test/test-setdir.c
    description: "日志目录设置（目标名 kylog-testsetdir）"
    command: "./kylog-testsetdir"
  - file: src/log/test/test-autowrap.c
    source: libkysdk-base-3.0.1.3/src/log/test/test-autowrap.c
    description: "日志自动换行（目标名 kylog-testautowrap）"
    command: "./kylog-testautowrap"
  - file: src/log/test/test-pressure.c
    source: libkysdk-base-3.0.1.3/src/log/test/test-pressure.c
    description: "日志压力（目标名 kylog-testpressure）"
    command: "./kylog-testpressure"
  - file: src/gsettings/test/test-gsetting.c
    source: libkysdk-base-3.0.1.3/src/gsettings/test/test-gsetting.c
    description: "GSettings 读写（目标名 test-kygsetting；无 schema 数据时 GLib 打 CRITICAL 但返回 0）"
    command: "./test-kygsetting"
  - file: src/conf2/test/kyconf2-test.c
    source: libkysdk-base-3.0.1.3/src/conf2/test/kyconf2-test.c
    description: "conf2 配置读写（目标名 kyconf2-test）"
    command: "./kyconf2-test"
  - file: src/config/test/test_structlist.c
    source: libkysdk-base-3.0.1.3/src/config/test/test_structlist.c
    description: "kyconf 结构化配置读取（目标名 kyconf-test-struct，需 cwd 含 struct.conf）"
    command: "./kyconf-test-struct"

# 入口二：qmake + gtest/gmock 套件（src/tests/*.pro）
gtest_suites:
  - file: src/tests/kyskiplist-gtest/kyskiplist-gtest.cpp
    description: "跳表 GTest（3 用例，全部通过）"
    command: "./kyskiplist-gtest"
  - file: src/tests/kyconfig-gtest/kyconfig-gtest.cpp
    description: "kyconf GTest（8 用例，全部通过；需 cwd=<build> 以解析相对 fixture 路径 ../src/tests/kyconfig-gtest/struct.conf）"
    command: "./kyconfig-gtest"
  - file: src/tests/kytimer-gtest/kytimer-gtest.cpp
    description: "定时器 GTest（1 用例，通过）"
    command: "./kytimer-gtest"
  - file: src/tests/kygsettings-gtest/kygsettings-gtest.cpp
    description: "GSettings GTest（23 用例，18 通过 / 5 失败——需 Kylin 桌面 GSettings schema，本环境无 schema 数据）"
    command: "./kygsettings-gtest"
  - file: src/tests/kylog-gtest/kylog-gtest.cpp
    description: "日志 GTest（首个用例 kdk_logger_init 断言失败 rc=134——需可写 /var/log 与 /etc/kysdk 配置）"
    command: "./kylog-gtest"
  - file: src/tests/kyconf2-gtest/kyconf2-gtest.cpp
    description: "conf2 GTest（无输出超时——依赖 D-Bus/conf2 服务端）"
    command: "./kyconf2-gtest"
  - file: src/tests/kyutils-gtest/kyutils-gtest.cpp
    description: "kyutils GTest（无法编译：用例调用 strisletter()，上游实现里函数名为 strisalpha()，属上游用例缺陷）"
    command: "./kyutils-gtest"

# test_package 中自带的消费者测试
test_package_tests:
  - file: test_kysdk.c
    description: "消费者测试：链接 libkysdk-base 并调用 kysdk_create_skiplist/kysdk_skiplist_insert/search/delete（kydatastruct）与 kdkVolumeBaseNumericalConvert（kyutils），共 10 条断言（9 条 CHECK + 1 条 kysdk_destroy_skiplist 返回打印），conan create 阶段实测 10/10 通过"
    command: "./test_libkysdk-base"

# 测试断言总数（近似值，用于质量评估）
# 口径：上游声明用例 96（CMake 内建 12 个测试目标 + gtest 7 套件 84 个 TEST/TEST_F 用例）
#       + test_package 10 条断言
assertion_count: 106
