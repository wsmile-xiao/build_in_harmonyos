# 版本级 manifest
# 文件位置: archives/l/lxml/6.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.1.1"

# 软件名
software: "lxml"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"
build_system: "setuptools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lxml/lxml/archive/refs/tags/lxml-6.1.1.tar.gz"

  # 源码校验和
  sha256: "624d1f5a50862c1bd5280f6997898c5a334e26d3a58bc2bbfec1efd8f98135fa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "python3 setup.py build_ext --inplace"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libxml2/2.15.3"
    - "libxslt/1.1.45"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lxml is a Python C extension, built with setup.py build_ext --inplace (not autotools)"
  - "Dependencies: libxml2/2.15.3, libxslt/1.1.45 (with transitive dep libgcrypt/1.11.0)"
  - "LD_LIBRARY_PATH must include libgcrypt path for libexslt.so runtime dependency"
  - "Source layout: src/lxml/ (not top-level lxml/)"
