# test_package/MANIFEST.yml
# Upstream test declaration — required by CI (build_and_test.sh L0e)
# See: docs/TEST_QUALITY_SPEC.md

package: lxml/6.1.1
homepage: "https://lxml.de"

# Upstream test command (lxml uses pytest: python3 test.py)
upstream_check_command: "python3 test.py"

# conanfile.py build() method integration status
upstream_test_in_build: false
upstream_test_command: "python3 test.py"

# Upstream test files (from lxml source: test.py + src/lxml/tests/)
upstream_tests:
  - file: test.py
    source: lxml-6.1.1/test.py
    description: "lxml official test suite (pytest-based)"
    command: "python3 test.py"

# test_package consumer-side tests (verify import + API calls)
test_package_tests:
  - file: test_lxml.py
    description: "Consumer test: import lxml.etree, parse XML, XPath, XSLT"
    command: "python3 test_lxml.py"

# Approximate assertion count
assertion_count: 10
