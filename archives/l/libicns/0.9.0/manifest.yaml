# 版本级 manifest — libicns 0.9.0
# 文件位置: archives/l/libicns/0.9.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.0"

# 软件名
software: "libicns"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub archive，固定 commit）
  url: "https://github.com/kornelski/libicns/archive/1137b6f67eed87fe7a31c7de5325686422bc4568.tar.gz"

  # 源码校验和
  sha256: "99922a929a975daea5fdcec616b3224114f73df551971b200bd928e73cf25f22"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libpng/1.6.58"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 说明: 0.9.0 源码不含生成式 autotools 文件，配方在 build() 内
# bootstrap 后对生成文件（config.guess/config.sub/configure）做契约式
# 改写（HarmonyOS 三元组 + umask 022），无静态 patches/ 补丁文件。
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "现代 2023-08-22 config.guess/config.sub 的 HarmonyOS 适配锚点（config.guess 插 *:HarmonyOS:*:* case；config.sub kernel-OS 列表加 linux-ohos*、OS accept 列表加 ohos*）——E007/E072 的 perl 工具锚点不适用且 E072 第 1 处修改在新版已不需要"
  - "config.guess 自身 3 处 umask 077 临时目录在 HMDFS 不可写（E011 的 config.guess 变体），须改 umask 022"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
