# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libicns/0.8.1
homepage: "https://sourceforge.net/projects/icns/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libicns 0.8.1 的 Makefile.am 中没有 TESTS / check_PROGRAMS,
# samples/ 目录只有 3 个数据文件 (test1.icns test2.rsrc test3.bin),
# 没有任何测试断言代码 → 上游零测试 (upstream_zero_evidence)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 全链路公开 API (create/set/get/decode/export/import/file round-trip)"
    command: "./test_libicns"
  - file: test_ohos_libicns.c
    description: "鸿蒙特有测试: dlopen 安装库 + TMPDIR 文件往返 + HMDFS 权限"
    command: "./test_ohos_libicns"
    ohos_specific: true

# 测试断言总数 (近似值, 用于质量评估)
# 口径: 每个测试程序为 1 个独立入口 (上游 0/0, 消费者 1/1, 鸿蒙特有 1/1);
# 内部断言只作检查点, 不计入用例数:
#   test.c = 32 (26 CHECK + 6 fail 检查点)
#   test_ohos_libicns.c = 16 (13 CHECK + 3 fail 检查点)
assertion_count: 48
