software: libicns
display: "Apple ICNS icon format library"
description: "Library and tools for reading, writing, and converting Apple ICNS icon files"
category: gfx
homepage: "https://sourceforge.net/projects/icns/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Recognizes the native aarch64-unknown-linux-ohos triplet in the bundled 2012-era GNU config scripts"
    - "Uses the published libpng/1.6.58.2 Conan package as the only hard dependency"
    - "Preserves the upstream libicns.so.1 ABI (SONAME) and installs the icns2png/icontainer2icns/png2icns CLI tools"
  common_dependencies:
    - libpng

versions:
  "0.8.1":
    status: built
    build_date: "2026-09-08"
    conan_ref: "libicns/0.8.1"
  "0.9.0":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libicns/0.9.0"
