# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: lwtools/4.25
homepage: "https://www.lwtools.ca/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test (perl test/runtests -> test/tests/opcodes6809.pl)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "perl test/runtests"

# 上游实际运行的测试程序
upstream_tests:
  - file: opcodes6809.pl
    source: lwtools-4.25/test/tests/opcodes6809.pl
    description: "上游唯一官方测试套件：test/runtests（perl）逐个执行 test/tests 下的脚本并汇总 PASS/FAIL；4.25 仅有 opcodes6809.pl 一例，它把 6809/6309 全部已记载指令逐条送入 ./lwasm/lwasm --raw 并与内置期望字节比对，共 272 条断言。OHOS aarch64 构建机上 272/272 全通过（0 skipped / 0 unknown / 0 failed），配方在 build() 中解析 Total 行，非全通过即中止构建"
    command: "perl test/runtests"

# 宿主环境不兼容用例（本包无：上游套件全部通过，未白名单容忍任何失败）
host_incompatible_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_lwtools.sh
    description: "功能测试：6 个程序的 --version 横幅 + lwobjdump 安装检查、lwasm --raw 14 字节机器码逐字节比对、lwasm --obj、lwlink --raw 输出字节、lwobjdump 反汇编回读段名与机器码、lwlink -m 映射文件、lwar create/list/extract 往返（成员逐字节 cmp）、非法指令非零退出、缺失输入报错、lwcc-cpp 直接预处理（补丁回归）、lwcc -E 驱动调用、lib/lwcc/bin 下驱动组件可执行（20 条断言，每条都真实执行已安装二进制；每条断言在所有分支上恰好计数一次，跳过不会伪装成通过）"
    command: "sh test_lwtools.sh <bin> <basedir>"

# 测试断言总数 (近似值, 用于质量评估)
# 说明：此处为 test_package 消费者侧断言数（20）；上游官方套件另有 272 条
# opcode 断言，在 build() 阶段执行并把逐字输出写入构建日志，见 conanfile.py
# 与 reports/test-report.md。
assertion_count: 20
