# 知识沉淀
knowledge_gained:
  - "lwcc/cpp-main.c 只创建了 5 个全局字符串链表中的 4 个，process_file() 对未初始化的 sysmacrolist 调 lw_stringlist_reset(NULL) 直接写空指针 → lwcc-cpp 处理任意输入必然 SIGSEGV；上游测试只覆盖 lwasm，故 4.25 带病发布"
  - "HMDFS 不上报可执行位：lwcc 驱动 find_file() 的 access(X_OK) 判定失败，靠上游 PATH 兜底 + execvp 才能跑通；因此 package_info() 必须用 runenv_info 导出 bin/ 到 PATH"
  - "上游 make install 依赖 install(1)，CI worker/设备 PATH 不保证存在（设备无 install(1)）→ package() 直接 copy 产物并 chmod 755"
  - "上游 Makefile 的 CFLAGS 用 ?= 赋值且 AR/RANLIB 独立可覆盖：make -j1 CC= AR= RANLIB= PREFIX=<package_folder> all 即可完成构建，无需注入平台宏（R8）"
  - "PREFIX 同时决定 lwcc 驱动编译期烘焙的 BASEDIR（LWCC_LIBDIR=$(PREFIX)/lib/lwcc/$(PACKAGE_VERSION)，而 PACKAGE_VERSION 在上游 Makefile 未定义）；把 PREFIX 指向 package_folder 并在 package() 复制 lib/lwcc/bin 组件即可对齐"
  - "上游唯一测试 test/runtests 由 perl 驱动（test/tests/opcodes6809.pl，272 条 opcode 断言），OHOS aarch64 构建环境 272/272 通过；toybox fmt 无 -1 选项导致每例打印一行 usage 噪声，但不影响 PASS/FAIL 统计"
  - "lwcc-cc（C 后端）上游本身不完整：最小函数也只产出仅含 LWOBJ16 段的 9 字节对象且 -S 输出为空，因此测试只声明预处理能力，不宣称 C 编译能力"

