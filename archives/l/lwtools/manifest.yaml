# 软件级 manifest — lwtools
software: lwtools
display: "lwtools"
description: "Motorola 6809 / Hitachi 6309 交叉开发工具链（汇编器、链接器、目标文件转储、归档器、C 编译器驱动）"
category: toolchain
homepage: "https://www.lwtools.ca/"
license: GPL-3.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 POSIX Makefile（无 configure/CMake），OHOS SDK clang 一次编译通过，零平台宏注入"
    - "零第三方依赖：仅 ISO C + POSIX，只链接系统 libc（W0 依赖检查：requires 为空；动态依赖由设备侧 llvm-readelf 即时实测，未随包存档）"
    - "修复上游缺陷 1 处：lwcc/cpp-main.c 漏建 sysmacrolist 全局链表，导致 lwcc-cpp 处理任何输入都在 lw_stringlist_reset(NULL) 段错误；上游测试只覆盖 lwasm 故未暴露"
    - "上游 make install/install-all 依赖 install(1) 且设备无该命令，package() 改为直接 copy 产物并 chmod 755（bin/ 7 个程序 + lib/lwcc/bin/ 2 个驱动组件）"
    - "lwcc 驱动用 access(X_OK) 判定组件可执行性，HMDFS 不上报可执行位，故 package_info() 同时用 runenv_info 导出 bin/ 到 PATH 兜底"
    - "上游唯一测试 test/runtests（perl 驱动）的 272 条 6809/6309 opcode 断言在 OHOS aarch64 构建机 272/272 全通过，无需白名单容忍"
    - "C 代码生成能力本包未作验证（上游自标实验性，且 lwcc/README.txt 声明编译器与预处理器的直接接口刻意未定义）；测试只断言预处理链路，不宣称 lwcc 能把 C 编译为可用目标文件"
  common_dependencies: []

versions:
  "4.25":
    status: built
    build_date: "2026-09-19"
    conan_ref: "lwtools/4.25"
