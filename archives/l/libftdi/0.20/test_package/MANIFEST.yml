# test_package/MANIFEST.yml
# libftdi 0.20.
#
# Upstream ships no `make check`. The examples/ directory builds real programs
# (bin_PROGRAMS); examples/find_all is executed natively on the aarch64 device
# from the recipe build(). It enumerates FTDI bridges and prints
# "Number of FTDI devices found: <n>", exiting 0 when none is attached.
# Consumer coverage is provided by a CMake consumer program compiled against
# the installed package.

package: libftdi/0.20
homepage: https://www.intra2net.com/en/developer/libftdi/

upstream_tests_exist: true
upstream_test_audit: "no tests/ directory and no check target in Makefile.am; examples/*.c are demo programs built as bin_PROGRAMS (they need real FTDI hardware, so only find_all is run)"
upstream_check_command: "n/a (no make check)"
upstream_test_in_build: true
upstream_test_command: "examples/find_all"

upstream_tests:
  - name: find_all
    command: "examples/find_all"
    expected: "pass (exit 0; reports 0 FTDI devices when no hardware is attached)"

test_package_tests:
  - file: test.c
    description: "context lifecycle (ftdi_new/ftdi_init/get_error_string); device enumeration with ftdi_usb_find_all; clean failure of ftdi_usb_open without hardware; error-string reporting; ftdi_list_free clears the list"
    command: "./libftdi_consumer"

test_files:
  - path: "test_package/test.c"
    test_type: "R34"
    assertion_count: 8

test_package_test_count: 1
consumer_assertion_count: 8
assertion_count: 8
