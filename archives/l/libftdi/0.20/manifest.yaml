# 版本级 manifest — archives/l/libftdi/0.20/manifest.yaml

version: "0.20"
software: libftdi
status: built
build_date: "2026-09-18"
build_system: cmake
conan_ref: "libftdi/0.20"

source:
  url: "https://deb.debian.org/debian/pool/main/libf/libftdi/libftdi_0.20.orig.tar.gz"
  sha256: "3176d5b5986438f33f5208e690a8bfe90941be501cc0a72118ce3d338d4b838e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DDOCUMENTATION=OFF"
    - "-DFTDIPP=OFF"
    - "-DPYTHON_BINDINGS=OFF"
    - "-DEXAMPLES=ON"
    - "-DLIBUSB_INCLUDE_DIR=<libusb-compat>/include"
    - "-DLIBUSB_LIBRARIES=<libusb-compat>/lib/libusb.a;<libusb>/lib/libusb-1.0.so"
  dependencies:
    - "libusb-compat/0.1.7"
  cc: clang
  cxx: clang++

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "none (upstream example find_all, no make check)"
  upstream_passed: 1
  upstream_failed: 0
  test_package_passed: 8
  test_package_failed: 0
  test_package_assertions: 8
  execution: "conan create rc=0; 上游 examples/find_all 1 次（真机，0 设备）+ 消费者断言 8 项"

test_passed: 8
test_failed: 0

patches_applied:
  - "none (the upstream CMake build avoids the autotools pitfalls documented in the knowledge draft)"

knowledge_gained:
  - "（autotools 路径调研结论）configure 硬依赖 libusb-config，制品仓 libusb-compat/0.1.7 不提供：需最小等价 shim，并提供带主机前缀的名字 aarch64-linux-ohos-libusb-config（交叉模式 AC_CHECK_TOOL 查前缀名）"
  - "（autotools 路径调研结论）native 模式 configure 运行 conftest 失败（LIBS 里的 -lusb/-lusb-1.0 使 conftest 动态依赖 libusb-1.0.so.0，configure 阶段不在加载路径）"
  - "ftdi.h 公开 #include <usb.h> → libusb-compat 必须 transitive_headers=True/transitive_libs=True 并在 cpp_info.requires 声明"
  - "（通用）E011（HMDFS 上 umask 077 临时目录不可写）与 E007（config.sub/config.guess 不识别/不可用）在本库的 autotools 路径同样适用"
  - "上游无 make check；examples/find_all 在无 FTDI 硬件时打印 0 并 exit 0（ftdi_usb_find_all 返回 0 不算错误），可作真机上游证据"
  - "libusb/libusb-compat 包内 .la/.pc 记录发布机或 /lib 路径（--prefix=/ + DESTDIR 同源失真）：autotools 需删除依赖 .la，CMake 需用显式 LIBUSB_* 缓存变量而非 pkg-config"
  - "（autotools 路径调研结论）libtool 2.2.6 在本环境写死 ksh 的 ECHO=\"print -r --\"（bash 下 print: command not found），且 old_archive_cmds 丢转义导致空归档名；CMake 路径可完全绕开"
