sources:
  url: "https://deb.debian.org/debian/pool/main/libf/libftdi/libftdi_0.20.orig.tar.gz"
  sha256: "3176d5b5986438f33f5208e690a8bfe90941be501cc0a72118ce3d338d4b838e"

patches:
  - patch_file: "patches/0002-cmake-lib-suffix.patch"
    patch_description: "The upstream top level CMakeLists forces LIB_SUFFIX=64 on 64 bit targets, installing into lib64/ and pkgconfig/lib64/; Conan cpp_info uses lib/, so pin the suffix to empty."
    patch_type: "portability"
  - patch_file: "patches/0001-examples-include-directories.patch"
    patch_description: "examples/CMakeLists.txt calls include() with directories (a thinko from 2011); modern CMake rejects it with 'include could not find requested file'. Use include_directories() so the example programs (upstream evidence) still build."
    patch_type: "portability"
