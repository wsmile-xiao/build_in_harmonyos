# 软件级 manifest — archives/l/libftdi/manifest.yaml

software: libftdi
display: "libftdi"
description: "通过 libusb 0.1 API 访问 FTDI USB 转接芯片的驱动库"
category: library
homepage: "https://www.intra2net.com/en/developer/libftdi/"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 硬依赖 libusb-config，而 libusb-compat/0.1.7 制品包不提供该脚本 → 构建期写入最小等价 shim 并加入 PATH"
    - "AC_CHECK_TOOL 在交叉模式查找 <host>-libusb-config → --build/--host 取同值（native 模式），同时避免 config.guess（E007）"
    - "E011：autoconf 2.63 umask 077 临时目录在 HMDFS(setgid) 下不可写 → umask 022"
    - "ftdi.h 公开包含 <usb.h> → libusb-compat 以 transitive_headers/transitive_libs 传播"
    - "Conan --prefix=/ + DESTDIR 导致 libftdi.pc 前缀失真 → package() 重写"
    - "上游无 make check；examples/find_all 无硬件时 exit 0，可作真机上游证据"
  common_dependencies:
    - libusb-compat

versions:
  "0.20":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libftdi/0.20"
