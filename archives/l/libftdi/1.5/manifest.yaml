software: libftdi
version: "1.5"
status: built
build_date: "2026-09-17"
build_system: cmake
conan_ref: "libftdi/1.5"

source:
  url: "https://www.intra2net.com/en/developer/libftdi/download/libftdi1-1.5.tar.bz2"
  sha256: "7c7091e9c86196148bd41177b4590dccb1510bfe6cea5bf7407ff194482eb049"
  tar_format: tar.bz2

build:
  system: cmake

  # recipe 通过 CMakeToolchain 注入；STATICLIBS/DONT_BUILD_SHARED 随
  # shared 选项切换库类型；其余全部关闭可选子工程
  configure_options:
    - "-DDOCUMENTATION=OFF"
    - "-DEXAMPLES=OFF"
    - "-DBUILD_TESTS=OFF"
    - "-DFTDI_EEPROM=OFF"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_Boost=TRUE"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_Confuse=TRUE"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_Doxygen=TRUE"
    - "-DSTATICLIBS=<not shared>"
    - "-DDONT_BUILD_SHARED=<not shared>"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  dependencies:
    - "libusb/1.0.27 (ohpcd, 已含 OHOS 内核补丁)"

  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-harmonyos-libdir.patch"

patch_classification:
  - file: 0001-cmake-harmonyos-libdir.patch
    type: manual
    platform_only: True
    guard: 'CMAKE_SYSTEM_NAME STREQUAL "HarmonyOS" (libdir hunk) / DONT_BUILD_SHARED (library-type hunk)'

# 上游测试与 consumer 测试边界（完整分类见 test_package/MANIFEST.yml）
functional_testing:
  date: "2026-09-17"
  result: "pass"
  tests_passed: 9   # ELF audit + version(2) + error_string + baud vectors(8 chip types) + NULL-path(5)，以 CHECK 计数见 test_ftdi.c
  tests_failed: 0
  tests_skipped: 0
  upstream_offline_reused:
    - "test/baudrate.cpp 官方向量 284 条（TYPE_AM 24 + BM/2232C/R/230X 各 28 + 2232H/4232H/232H 各 29），经 convert_baudrate_UT_export 全部通过"
  upstream_hardware_blocked:
    - "test/basic.cpp (ftdi_new → libusb_init，OHOS PC 沙箱无 USB 子系统)"
    - "test/baudrate.cpp 原始 fixture（同上）；且上游 test/ 需 Boost unit_test_framework（REQUIRED），离线环境无法配置"
  notes: >
    shared 与 static 两种包均通过 conan create 全流程（构建 + consumer
    测试 + OHOS ELF 审计）。硬件依赖项如实归类，未伪造通过。

platform_notes:
  - "CMake 无 Platform/HarmonyOS 模块：UNIX 变量未定义 → libdir 空 → configure_package_config_file 失败（patch 修复）"
  - "CMake 无 HarmonyOS 平台模块导致 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 未设置 → .so 无 DT_SONAME；toolchain 显式注入 -Wl,-soname,"
  - "上游 src/CMakeLists.txt 硬编码 add_library(ftdi1 SHARED)：static-only 需 DONT_BUILD_SHARED 开关（patch 新增）"
  - "FindUSB1.cmake 消费经典模块变量 LIBUSB_INCLUDE_DIR/LIBUSB_LIBRARIES：CMakeDeps 用 cmake_extra_variables 提供同名变量"
  - "ftdi_eeprom 工具链依赖 libconfuse（仓库 3.3 recipe 无可用包）→ 关闭 FTDI_EEPROM，仅构建核心库"
  - "OHOS PC 沙箱：libusb_init(NULL) = -1 LIBUSB_ERROR_IO；ftdi_new/ftdi_init 及一切真实 USB 操作不可离线运行"

knowledge_gained:
  - id: E532
    description: "if(${UNIX}) 不识别 HarmonyOS → libdir 空 → configure_package_config_file 失败；修复与 E532 一致（OR CMAKE_SYSTEM_NAME STREQUAL \"HarmonyOS\"），本次为 libftdi 载体实证"
  - id: DRAFT-libharu-2.3.0-missing-dt-soname
    description: "CMake 无 Platform/HarmonyOS 模块 → CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 未定义 → .so 无 DT_SONAME；toolchain 注入 -Wl,-soname,（同 libharu 方案，libftdi 侧 set_target_properties 已有 SOVERSION，仅需注入 flag）"
  - description: "上游硬编码 add_library(ftdi1 SHARED) 且 STATICLIBS 只追加额外 static 目标：DONT_BUILD_SHARED 开关实现 static-only 构建（库特定构建细节，非平台根因，不单独立条）"
