patches:
  "1.5":
    - patch_file: "patches/0001-cmake-harmonyos-libdir.patch"
      patch_description: "Two HarmonyOS/CMake portability fixes: (1) set libdir when CMAKE_SYSTEM_NAME is HarmonyOS — CMake has no Platform/HarmonyOS module so the UNIX variable is undefined, leaving libdir/LIBFTDI_LIBRARY_DIRS empty and breaking configure_package_config_file; (2) make the main ftdi1 target type switchable (upstream hardcodes SHARED) so a static-only Conan build produces libftdi1.a instead of always building both variants"
      patch_type: "portability"
