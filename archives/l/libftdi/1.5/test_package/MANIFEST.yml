# Upstream and consumer test declaration for CI L0e.
package: libftdi/1.5

upstream_tests:
  # Inventory of upstream test/ (R51 three-step accounting).
  # - test/basic.cpp   — BOOST_AUTO_TEST_CASE "test_new": calls ftdi_new() →
  #   ftdi_init() → libusb_init(NULL). On OHOS PC there is no USB subsystem
  #   access (no /dev/bus/*), libusb_init returns -1 LIBUSB_ERROR_IO, so the
  #   upstream fixture cannot pass offline. Category: hardware-environment.
  # - test/baudrate.cpp — BOOST_FIXTURE_TEST_CASE with ftdi_new() fixture (same
  #   libusb_init blocker), but the checked computation itself,
  #   ftdi_convert_baudrate(), is a pure function. Its 22 official test
  #   vectors (1000000/921600/... baud, AM chip type) are reused verbatim in
  #   test_package as the offline pass criteria. Category: offline (reused
  #   vectors), hardware (original fixture).
  # Upstream tests also require find_package(Boost unit_test_framework
  #   REQUIRED) at configure time — test/CMakeLists.txt fails to configure
  #   without it, so ctest cannot run even for the pure-function test.
  offline_runnable: false
  hardware_dependent:
    - "test/basic.cpp (ftdi_new → libusb_init: no USB subsystem in OHOS PC sandbox)"
    - "test/baudrate.cpp original fixture (ftdi_new → libusb_init)"
  offline_reused:
    - "test/baudrate.cpp: 22 official baudrate vectors → test_package/test_ftdi.c"

consumer_tests:
  # What test_package/ actually runs (all offline, no USB device required).
  - "test_package/test_ftdi.c: links -lftdi1 and exercises offline-safe APIs"
  - "official 22-vector baudrate table via ftdi_convert_baudrate (stack-allocated ftdi_context, no libusb_init)"
  - "ftdi_get_library_version() returns 1.5.0"
  - "ftdi_get_error_string(NULL) returns non-NULL message"
  - "ftdi_set_interface(NULL,...)/fti error paths return negative error codes"
  - "OHOS-specific: ELF64 AArch64 check, dependency closure (ldd), RPATH/RUNPATH audit via readelf"

ohos_note: |
  OHOS PC sandbox has no USB subsystem access: libusb_init(NULL) returns -1
  (LIBUSB_ERROR_IO). All tests that would transitively call it are classified
  as hardware-environment dependent and are NOT reported as passing. The
  offline API surface (pure computation, version/error/descriptor paths,
  stack-allocated context without usb_ctx) is exercised instead.
