# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libapparmor/5.0.0
homepage: "https://gitlab.com/apparmor/apparmor"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（make check 实测 6 测试：5 PASS / 1 FAIL）
upstream_tests:
  - file: src/tst_aalogmisc.c
    source: apparmor-5.0.0/libraries/libapparmor/src/tst_aalogmisc.c
    description: "aalogparse 协议解析测试（OHOS sed 不支持 \\L 小写转义，tcp 映射为 LTCP 而非 tcp，1 FAIL 平台限制）"
    command: "./src/tst_aalogmisc"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 aa_splitcon 验证库可链接可运行"
    command: "./test_libapparmor"

# 测试断言总数 (近似值)
assertion_count: 3
