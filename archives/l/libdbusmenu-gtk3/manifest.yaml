software: libdbusmenu-gtk3
display: "libdbusmenu-gtk3"
description: "D-Bus menu specification — GLib menu model and GTK3 bindings"
category: library
homepage: "https://launchpad.net/libdbusmenu"
license: LGPL-2.1-or-later OR LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "libdbusmenu-glib 16.04.0 uses GDBus (gio); no dbus-glib dependency"
    - "upstream tests driven by dbus-test-runner (Launchpad toolchain, unported); session-bus tests run under dbus-run-session via a shim"
    - "gtk test subset requires X display (unavailable on OHOS, broadway backend) — platform difference documented per path B"
    - "intltool/perl configure checks downgraded to warnings; NLS not built"
versions:
  16.04.0:
    status: draft
