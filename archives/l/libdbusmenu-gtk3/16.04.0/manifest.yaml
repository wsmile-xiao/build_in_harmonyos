software: libdbusmenu-gtk3
version: "16.04.0"
status: built
build_date: "2026-09-30"

source:
  url: "https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz"
  sha256: "b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a"
  tar_format: tar.gz

build:
  system: autotools
  package_type: library
  configure_options:
    - "--with-gtk=3"
    - "--disable-dumper"
    - "--disable-gtk-doc"
    - "--disable-introspection"
  dependencies:
    - "glib/2.84.0.1"
    - "gtk/3.24.43"
    - "json-glib/1.10.6"
  optional_features_disabled:
    - "dbusmenudumper tool (needs gtk2 + x11, both unavailable on OHOS)"
    - "gobject-introspection (g-ir-scanner not in OHOS toolchain)"
    - "gtk-doc"
    - "NLS/po (intltool not published in artifact registry; configure checks downgraded to warnings)"
  test_strategy: "glib test subset (8 wrappers) run under dbus-run-session via dbus-test-runner shim; gtk test subset (5 wrappers) requires X display — platform difference documented in notes.md"
  hmdfs_workaround: "configure/config.status temp directories redirected to build-local TMPDIR"
  test_runtime_path: "native make check prepends build .libs and Conan dependency lib directories to LD_LIBRARY_PATH"

patches_applied:
  - "0001-config.guess-ohos.patch"
  - "0002-config.sub-ohos.patch"
  - "0003-configure-skip-intltool-po.patch"
  - "0004-tests-shell-portability.patch"
  - "0005-upstream-child-find-loop-fix.patch"

validation:
  local:
    - "Downloaded official release tarball from Launchpad and verified sha256."
    - "Confirmed Autotools release tarball includes generated configure."
    - "Confirmed required deps via configure.ac: glib-2.0/gio-2.0 >= 2.35.4, gtk+-3.0 >= 2.91 (with-gtk=3), json-glib-1.0 >= 0.13.4 (tests), gio-unix-2.0 >= 2.24 (part of glib)."
    - "Confirmed dumper (gtk2+x11), introspection, gtk-doc, valgrind-gated test-json are all optional and disabled."
    - "Confirmed 16.04.0 libdbusmenu-glib uses GDBus (gio.h), not dbus-glib."
    - "All 5 patches validated with patch_ng (fuzz=False) against the pristine tarball."
    - "Dedup checks: no libdbusmenu* in upstream archives/ (both git ls-tree and local scan); ohpcd artifact-registry same-version check requires login (conan remote auth) — deferred to device verification."
  device:
    - "OHOS aarch64 conan create RC=0; glib test subset 8/8 PASS via dbus-run-session shim (dbus/1.14.10.2 tool pkg, anonymous-TCP session config); gtk subset 5 cannot run (no X display, broadway backend) - platform difference, see notes.md."
    - "Consumer test_package 14/14 assertions PASS (conan create test() RC=0, conan test RC=0)."
    - "finish (W3 local CI) PASS 100% (1/1 package); .ci-result.json written by tool."
