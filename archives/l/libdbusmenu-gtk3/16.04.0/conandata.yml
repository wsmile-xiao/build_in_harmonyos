sources:
  url: "https://launchpad.net/libdbusmenu/16.04/16.04.0/+download/libdbusmenu-16.04.0.tar.gz"
  sha256: "b9cc4a2acd74509435892823607d966d424bd9ad5d0b00938f27240a1bfa878a"

patches:
  - patch_file: "patches/0001-config.guess-ohos.patch"
    patch_description: "Teach the 2015-vintage bundled config.guess to emit aarch64-unknown-linux-ohos on HarmonyOS."
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-ohos.patch"
    patch_description: "Accept linux-ohos in the maybe_os split list and the OS validation list of the bundled config.sub."
    patch_type: "portability"
  - patch_file: "patches/0003-configure-skip-intltool-po.patch"
    patch_description: "Downgrade the intltool-update, perl and XML::Parser configure failures to warnings and drop po/ from SUBDIRS / config files; intltool is not published in the artifact registry and NLS is out of scope."
    patch_type: "portability"
  - patch_file: "patches/0004-tests-shell-portability.patch"
    patch_description: "Run generated test wrappers through $(SHELL) (direct shebang execution is denied on OHOS), rewrite wrapper shebangs to /system/bin/sh, and drop -Werror from the test CFLAGS (2016-era sources warn on glib 2.84 deprecated APIs)."
    patch_type: "portability"

  - patch_file: "patches/0005-upstream-child-find-loop-fix.patch"
    patch_description: "Fix an inverted loop condition in dbusmenu_menuitem_child_find (upstream bug: the function always returned NULL for any non-empty child list)."
    patch_type: "bugfix"
