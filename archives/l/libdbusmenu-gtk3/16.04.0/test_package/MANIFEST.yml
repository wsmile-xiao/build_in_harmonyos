package: libdbusmenu-gtk3/16.04.0
homepage: "https://launchpad.net/libdbusmenu"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check TESTS='<glib subset>' under dbus-run-session (dbus-test-runner not ported; gtk tests need X display, see notes.md)"

test_package_tests:
  - file: test_libdbusmenu.c
    description: "Builds a menu tree via the public dbusmenu-glib API, sets/gets properties, walks children/parents, finds items by id; 14 assertions, no session bus required."
    command: "conan test"

assertion_count: 14
