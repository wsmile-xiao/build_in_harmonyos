# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libopus/1.6.1
homepage: "https://opus-codec.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试（test_opus_* 5 个 CMake ctest + meson 独有的 test_opus_projection）
# 由上游测试铁律在本地完整执行并留证据（见 notes.md 测试台账），不在
# test_package 内重复集成（test_package 只做消费者视角验证）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（CMake ∪ Meson 注册并集，DRED 条件项默认 OFF 未注册）
upstream_tests:
  - file: "tests/test_opus_api.c"
    source: opus-1.6.1.tar.gz/tests/test_opus_api.c
    description: "Opus API unit test (ctest: test_opus_api)"
    command: "ctest -R test_opus_api"
  - file: "tests/test_opus_decode.c"
    source: opus-1.6.1.tar.gz/tests/test_opus_decode.c
    description: "Opus decoder test (ctest: test_opus_decode)"
    command: "ctest -R test_opus_decode"
  - file: "tests/test_opus_encode.c"
    source: opus-1.6.1.tar.gz/tests/test_opus_encode.c
    description: "Opus encoder test incl. regressions (ctest: test_opus_encode)"
    command: "ctest -R test_opus_encode"
  - file: "tests/test_opus_padding.c"
    source: opus-1.6.1.tar.gz/tests/test_opus_padding.c
    description: "Opus padding test (ctest: test_opus_padding)"
    command: "ctest -R test_opus_padding"
  - file: "tests/test_opus_extensions.c"
    source: opus-1.6.1.tar.gz/tests/test_opus_extensions.c
    description: "Opus extensions test (ctest: test_opus_extensions)"
    command: "ctest -R test_opus_extensions"
  - file: "tests/test_opus_projection.c"
    source: opus-1.6.1.tar.gz/tests/test_opus_projection.c
    description: "Opus projection test (meson-only registration, needs celt/silk/dnn private symbols, manual compile)"
    command: "clang tests/test_opus_projection.c -o test_opus_projection -Iinclude -Icelt -Isilk -Idnn -I. libopus.a -lm"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer dlopen probe: libopus.so symbol resolution + real API call"
    command: "./test_probe"
  - file: test_ohos_roundtrip.c
    description: "HarmonyOS 专项: 48kHz stereo sine PCM encode/decode real roundtrip linked against libopus.so"
    command: "./test_roundtrip"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
