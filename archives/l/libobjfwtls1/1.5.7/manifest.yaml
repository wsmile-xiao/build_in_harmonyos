# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "与 libobjfwhid1/1.5.7 同源同树：同一 objfw-1.5.7.tar.gz，一次构建产出 libobjfw/libobjfwrt/libobjfwtls，本包聚焦 TLS 库"
  - "E007: GNU config.guess 无 __OHOS__/HarmonyOS 检测分支，需补丁输出 aarch64-unknown-linux-ohos"
  - "E122/E268: 新版 config.sub 的 kernel-OS 校验表未含 linux-ohos，需手动追加，否则报 Kernel 'linux' not known to work with OS 'ohos'"
  - "E011: HMDFS 上 configure 的 umask 077 临时目录对当前进程不可写，configure 内 umask 077→022 修复"
  - "ObjFW TLS 后端三选一（openssl/gnutls/mbedtls）；OHOS 可用的是 OpenSSL：openssl/3.5.8.1 已发布，--with-tls=openssl 显式指定，失败即大声报错而非静默无 TLS"
  - "configure 的 OpenSSL 探测只用裸 -lssl/-lcrypto（无 pkg-config），靠 AutotoolsDeps 把 conan 包的 -I/-L 注入"
  - "ObjFW 是 Objective-C 库：消费者必须用 ObjFW 运行时 flags（-fconstant-string-class=OFConstantString、-Xclang -fobjc-runtime=objfw-1.5、-fblocks）"
  - "上游 tests/ 88 个 *Tests.m 无一引用 TLS/X509：TLS 开关不改变上游用例集合；make check 纯离线（HTTP 用例走本地 127.0.0.1 服务器）"
