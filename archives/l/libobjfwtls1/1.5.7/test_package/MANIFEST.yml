# test_package/MANIFEST.yml
# 上游官方测试声明文件 (R51 上游测试三步法)

package: libobjfwtls1/1.5.7
homepage: "https://objfw.nil.im/"

# 上游存在测试（tests/ 目录 88 个 *Tests.m，见 upstream_test_audit）。
upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "objfw-1.5.7.tar.gz（官方源 https://objfw.nil.im/downloads/objfw-1.5.7.tar.gz，sha256 已独立下载验证）"
  source_sha256: "e637c32731dc07396b812c4019f34d1417a3f7aa39d450b7f27c9bcdc23b3e12"
  build_system: "Autotools（in-source 构建，顶层 make check 驱动）"
  test_definition: >
    上游测试框架为 ObjFW 自研 OFTests 框架：tests/ 目录 88 个 *Tests.m
    用例文件编译进单一 tests 二进制，顶层 `make check -j1` 驱动执行。
    计数单位为 OFTests 汇总行 `N tests succeeded, M failed, K skipped`
    中的用例数（单一框架、单行汇总、可解析）。88 个用例文件无一引用
    TLS/X509，TLS 开关不改变上游用例集合；HTTP 客户端用例只打本地
    127.0.0.1 回环服务器，纯离线可运行，无在线数据集依赖。
  dependency: "无外部测试依赖（自研框架，不依赖 GTest/pytest/在线数据）"
  portability_changes: []

# 上游测试命令 (Autotools make check)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试 (make check -j1, 见 conanfile.py)。
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序 (ObjFW 自研 OFTests 框架, 单一 tests 二进制)
# 源码 tests/ 目录共 88 个 *Tests.m 用例文件, 编译进一个 tests 二进制;
# HTTP 客户端用例使用本地 127.0.0.1 回环服务器, 纯离线可运行。
# 通过数/跳过数以真机预检实测为准 (同树 --without-tls 的姐妹包实测为
# 1238 通过 / 0 失败 / 4 跳过, 本包启用 TLS 后以真机为准)。
upstream_tests:
  - file: "tests/tests"
    source: "objfw-1.5.7/tests"
    description: "ObjFW 自研测试框架二进制, 覆盖全部 OF* 单元测试"
    command: "./tests/tests"

# 计数口径：单一 OFTests 框架汇总行（auto）；取数命令为解析
# hmbs_make_check.log 中的 `N tests succeeded, M failed, K skipped`。
# 总数 1242 为同源同树（同一 tarball、同一 tests/ 目录）在真机的实测
# 套件规模（姐妹包 libobjfwhid1/1.5.7：1238 通过 / 0 失败 / 4 跳过），
# 本包 88 个用例文件与姐妹包完全相同（无一引用 TLS/X509），总数一致；
# 本包各分类实测数（passed/failed/skipped）以本轮真机预检日志为准回填。
upstream_test_total: 1242
upstream_test_count_method: auto

# 平台差异豁免声明 (TEST_QUALITY_SPEC.md 3.3: 个别用例因平台限制无法通过时声明豁免)
# 同树姐妹包真机预检实测 make check -j1: 发现 1242 / 通过 1238 / 失败 0 / 跳过 4,
# 与本包同口径预期 (UNIX stream/datagram/sequenced socket 在不支持处跳过 + hardlink);
# 4 跳过均为上游测试自带的平台能力检查分支, 无测试删除, 完整套件仍在真机执行。
# HMBS 平台能力: HMBS_CAP_HARDLINK=0 / HMBS_CAP_CHMOD=0 (HMDFS 不支持硬链接),
# socket 节点在 HMDFS 临时目录同样受限; conanfile 已做最小环境适配
# (短 tmp + 优先链路可写目录, 详见 conanfile.py _probe_tmp_capability),
# 剩余跳过属内核/文件系统能力缺失, 非配方缺陷。
# 本包实测跳过项以真机预检日志为准回填，此处为同树依据先行声明口径。
upstream_test_exemptions:
  - test: "OFTests UNIX socket 跳过 (3 项: stream/datagram/sequenced)"
    reason: "上游测试在 AF_UNIX 不可用处主动跳过 (EAFNOSUPPORT/EPERM 分支); 真机 HMDFS 临时目录不支持 socket 节点, 属平台能力缺失, 非回归"
  - test: "OFTests hardlink 跳过 (1 项)"
    reason: "HMBS 上报 HMBS_CAP_HARDLINK=0, HMDFS 用户目录不支持硬链接; 上游测试按平台能力跳过该分支, 其余文件系统断言仍执行, 非回归"

# test_package 中自带的测试 (消费者视角验证, 真实调用 ObjFWTLS API)
test_package_tests:
  - file: "test_tls.m"
    scenario: "consumer-api"
    description: "消费者测试: 调用 +[OFX509Certificate supportsPEMFiles] 证明 OpenSSL 后端已编入, 非法 PEM 内容必须被真实解析器拒绝(抛异常或返回空链, 仅当作有效证书接受才失败, 纯离线)"
    command: "./test_libobjfwtls1"
    assertions: 3
  - file: "test_runtime.c"
    scenario: "consumer-api"
    description: "消费者测试: C 语言验证 libobjfwrt 运行时链接与类注册"
    command: "./test_runtime"
    assertions: 4

# 测试断言总数 (消费者测试 3 + 4 = 7; 上游套件规模见 upstream_test_total)
assertion_count: 7
