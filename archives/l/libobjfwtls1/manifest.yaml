# 软件级 manifest — libobjfwtls1
# 遵循 ARCHIVE-SPEC v2.0

software: libobjfwtls1
display: "ObjFWTLS"
description: "ObjFW TLS support library (Objective-C, OpenSSL backend)"
category: network
homepage: "https://objfw.nil.im/"
license: LGPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "与 libobjfwhid1 同源同树：同一 objfw 源码树一次构建产出全部 ObjFW 库"
    - "TLS 后端显式选 OpenSSL（--with-tls=openssl），依赖已发布的 openssl 包"
    - "in-source 构建（folders.build = .），make -j1（HMDFS jobserver 限制）"
    - "消费者需 ObjFW 运行时 flags（-fconstant-string-class=OFConstantString、-Xclang -fobjc-runtime=objfw-1.5）"
  common_dependencies:
    - openssl

versions:
  "1.5.7":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libobjfwtls1/1.5.7"
