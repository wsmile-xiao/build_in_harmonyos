software: libcsys
display: "Libcsys (CuboCore)"
description: "Qt6 library that reports live system resource information (CPU, memory, disks, network, storage, battery, power)"
category: library
homepage: "https://gitlab.com/cubocore/libcsys"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "Requires qtbase-sql-dbus/6.11.1 (Qt6Core/Qt6DBus/Qt6Network); plain qtbase/6.11.1 is built with FEATURE_dbus=OFF and cannot satisfy find_package(Qt6DBus REQUIRED)"
    - "qtbase-sql-dbus is packaged with cmake_find_mode=none, so generate() writes conan_cmakedeps_paths.cmake by hand to inject its lib/cmake into CMAKE_PREFIX_PATH"
    - "CMake ships no Platform/HarmonyOS module: the CMAKE_SHARED_LIBRARY_SONAME_*_FLAG variables are set explicitly so the package keeps the libcsys.so -> libcsys.so.5 -> libcsys.so.5.0.0 chain with a real DT_SONAME"
    - "patch 0001 fixes three upstream defects that crash or misbehave on OHOS (InfoManager::update() OOB read when /proc/cpuinfo has no cpu MHz, Power destructor takeFirst() on an empty provider list, SystemInfo::getHostname() misusing the gethostname() return value)"
    - "Battery/Power/Storage D-Bus backends (UPower/UDisks2/logind) do not exist on OHOS and are verified to degrade gracefully instead of crashing"
  common_dependencies:
    - qtbase-sql-dbus/6.11.1

versions:
  "5.0.0":
    status: built
    build_date: 2026-09-14
