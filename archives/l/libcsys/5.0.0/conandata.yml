# conandata.yml — libcsys 5.0.0
# Official upstream source (CuboCore GitLab release archive, R39 compliant).
# sha256 verified against the downloaded libcsys-v5.0.0.tar.gz (28945 bytes).

sources:
  url: "https://gitlab.com/cubocore/libcsys/-/archive/v5.0.0/libcsys-v5.0.0.tar.gz"
  sha256: "8ba5ddcdcf6162a0db229f2b95312784a30760f09e919960fedb5fd9fe7f9cb9"

patches:
  "5.0.0":
    - patch_file: "patches/0001-fix-runtime-crashes.patch"
      patch_description: "Fix three upstream runtime defects exposed on HarmonyOS: InfoManager::update() OOB read of the empty CPU-frequency list, Power destructor takeFirst() on an empty provider list, and SystemInfo::getHostname() using the gethostname() 0 return value as a string length."
      patch_type: "bugfix"
    - patch_file: "patches/0002-fix-networkinfo-oob.patch"
      patch_description: "Fix NetworkInfo::getIOBytes() undefined behaviour: three unconditional QStringList::removeFirst() calls crash when /proc/net/dev is unreadable or holds fewer rows, and unguarded QList::at(1)/at(9) index short rows out of range. Also stops discarding the first interface row."
      patch_type: "bugfix"
