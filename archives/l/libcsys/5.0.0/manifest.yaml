source:
  url: "https://gitlab.com/cubocore/libcsys/-/archive/v5.0.0/libcsys-v5.0.0.tar.gz"
  sha256: "8ba5ddcdcf6162a0db229f2b95312784a30760f09e919960fedb5fd9fe7f9cb9"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname,"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
    - "-DBUILD_SHARED_LIBS=ON"
  dependencies:
    - qtbase-sql-dbus/6.11.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-runtime-crashes.patch"
  - "0002-fix-networkinfo-oob.patch"

tests:
  upstream_independent_total: 0
  integration_independent_total: 36
  harmony_specific_total: 5
  target_passed: 41
  target_status: "pass"
  test_package_assertions: 41
  test_package_failures: 0
  test_package_exit_code: 0

knowledge_gained:
  - "qtbase/6.11.1 has FEATURE_dbus=OFF; libcsys must depend on qtbase-sql-dbus/6.11.1 to get Qt6DBus (knowledge_ref: DRAFT-9001)"
  - "qtbase-sql-dbus uses cmake_find_mode=none, so conan_cmakedeps_paths.cmake must be written by hand to expose its lib/cmake on CMAKE_PREFIX_PATH (knowledge_ref: DRAFT-9001)"
  - "CMake has no Platform/HarmonyOS module: without CMAKE_SHARED_LIBRARY_SONAME_*_FLAG the shared library gets no DT_SONAME and no versioned symlink chain (CI L5a failure) (knowledge_ref: DRAFT-9001)"
  - "OHOS /proc/cpuinfo has no 'cpu MHz' field, so CpuInfo::getCPUFrequencies() is empty; InfoManager::update() indexed that list unchecked and crashed (fixed by patch 0001) (knowledge_ref: DRAFT-9001)"
  - "Power::~Power() used 'while (providers.empty())' instead of '!providers.empty()' and crashed on any system without a logind/ConsoleKit D-Bus provider (fixed by patch 0001) (knowledge_ref: DRAFT-9001)"
  - "gethostname() returns 0 on success, not the name length; SystemInfo::getHostname() used it as a length and always returned an empty string (fixed by patch 0001) (knowledge_ref: DRAFT-9001)"
  - "OHOS ships no UPower/UDisks2/logind services, so BatteryManager/StorageManager/Power must be tested for graceful degradation only (knowledge_ref: DRAFT-9001)"
  - "NetworkInfo::getIOBytes() had two unchecked UB paths (three unconditional QStringList::removeFirst() calls and unguarded QList::at(1)/at(9)); they crash whenever /proc/net/dev is unreadable or a row is short, which is environment-dependent across CI workers — a local pass does not prove a remote pass (knowledge_ref: DRAFT-9001)"
