# test_package/MANIFEST.yml
# Upstream and consumer test declaration for libcsys/5.0.0.
#
# Upstream (https://gitlab.com/cubocore/libcsys v5.0.0) ships NO test suite:
# its CMakeLists.txt registers no CTest test, meson.build registers no test(),
# the repository has no tests/ directory, and the only CI stage that is named
# "test" runs an uncrustify source-style check - not a functional test.
# The inventory commands and their output are recorded below so the zero count
# is auditable rather than assumed.

package: libcsys/5.0.0
homepage: "https://gitlab.com/cubocore/libcsys"

# Upstream test command (used for ctest -N / pytest / meson test --list analysis)
upstream_check_command: "ctest -N (no CTest configured) / meson test --list (no test() in meson.build)"

upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure  # runs 0 tests, exit 0 (executed in build() for L1c evidence)"

# Upstream registers ZERO test cases.  The field is kept for the schema but is
# intentionally empty; the audited evidence lives in upstream_tests_inventory.
upstream_tests: []

upstream_tests_inventory:
  summary: "0 upstream test cases (0 CTest tests, 0 meson test targets, no tests/ directory)"
  commands:
    - cmd: 'grep -rn "enable_testing\|add_test\|test(" CMakeLists.txt meson.build'
      result: "no matches (empty output)"
    - cmd: 'find . -iname "*test*"'
      result: "no matches (empty output)"
    - cmd: 'cat .gitlab-ci.yml'
      result: "stages: build + test; build_amd64 runs 'mkdir build && cmake .. && make'; the 'test' stage is 'uncrustify' (style check only, no test execution)"
  counting:
    upstream_independent_total: 0
    upstream_passed: 0
    upstream_failed: 0

# Consumer-side tests shipped in this test_package.  They call the real public
# libcsys API (FileUtil, CpuInfo, MemoryInfo, SystemInfo, NetworkInfo, DiskInfo,
# InfoManager, BatteryManager, Power, StorageManager) and are counted at runtime.
test_package_tests:
  - file: test_package/test_libcsys.cpp
    description: "Installed-package consumer exercising the csys/*.h API: file IO round-trip, CPU core/percent/frequency consistency, memory totals, SystemInfo getters, network and disk IO pairs, InfoManager update, and graceful D-Bus degradation for Battery/Power/Storage."
    command: "conan create builds and runs test_libcsys (test_package/conanfile.py test() -> self.run)"

execution:
  status: "pass"
  target: "HarmonyOS/OHOS 6.0 aarch64"
  upstream_passed: 0
  integration_passed: 36
  harmony_specific_passed: 5
  upstream_exit_code: 0

assertion_count: 41
