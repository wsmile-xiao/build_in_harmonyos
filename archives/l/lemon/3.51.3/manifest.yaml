software: lemon
build_system: manual

# ============================================================
# 必须字段
# ============================================================

version: "3.51.3"
status: published
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://sqlite.org/2026/sqlite-src-3510300.zip"
  sha256: "f8a67a1f5b5cae7c6d42f0994ca7bf1a4a5858868c82adc9fc1340bed5eb8cd2"
  tar_format: zip
  note: "lemon.c和lempar.c位于SQLite源码包的tool/目录"

# ============================================================
# 构建配置
# ============================================================

build:
  system: manual
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  build_command: "cc -o lemon tool/lemon.c -O2"

# ============================================================
# 安装文件
# ============================================================

install_files:
  - "bin/lemon"
  - "bin/lempar.c"
  - "share/lemon/lempar.c"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - E999: "ZIP格式源码包的clean-verify兼容性 + lemon默认模板路径查找"
  - "lemon是SQLite源码包中的单文件工具，无标准构建系统，需手动cc编译"
  - "lempar.c需放在lemon二进制同目录下，lemon默认在自身目录查找模板文件"
  - "lemon无--version选项，使用-x输版本号"