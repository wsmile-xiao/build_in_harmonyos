package: libiodbc2/3.52.16
homepage: "https://www.iodbc.org/"

# Upstream test inventory (R51).
# Verified against the v3.52.16 source tree:
#   * no tests/ directory
#   * no TESTS / check_PROGRAMS declarations in any Makefile.am
#   * `make -n check` in every subdirectory: "Nothing to be done for 'check'"
# => upstream ships no automated test suite for this version.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# The only executable "tests" upstream ships are the interactive sample
# programs samples/iodbctest and samples/iodbctestw; they require a real DSN
# plus a running database, so they cannot be automated here.  The sources are
# inventoried below for traceability only.
upstream_tests:
  - file: samples/iodbctest.c
    source: samples/iodbctest.c
    description: "Interactive ODBC sample (needs a live DSN; not automatable)"
    command: "./iodbctest \"DSN=...\""

test_package_tests:
  - file: test.c
    description: "Consumer test driving the ODBC driver-manager API (env/DBC handle lifecycle, env attribute round-trip, diagnostics, SQLDrivers)"
    command: "./test_libiodbc2"

assertion_count: 8
