version: "3.52.16"
software: "libiodbc2"
status: built
build_date: "2026-09-14"
build_system: "autotools"

source:
  url: "https://github.com/openlink/iODBC/archive/refs/tags/v3.52.16.tar.gz"
  sha256: "a0cf0375b462f98c0081c2ceae5ef78276003e57cdf1eb86bd04508fb62a0660"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-gui"
    - "--disable-libodbc"
    - "--enable-shared"
    - "--disable-static"
  dependencies: []
  build_tools:
    - "automake/1.18"
    - "libtool/2.5.4"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "源码不携带 configure，需 autoreconf -fi -I admin 引导；CI 沙箱只有 autoconf 套件，automake/libtool 必须走 tool_requires"
  - "config.guess 无法识别 HarmonyOS（uname -s=HarmonyOS），需显式传 --build/--host=aarch64-unknown-linux-ohos；不可用 linux-gnu（会走 GNU 路径漏掉 OHOS 头文件）"
  - "GitHub 自动 tarball 的 config.guess/sub 支持 ohos triplet；SourceForge 3.52.16 发布包的 config.sub 不接受 ohos（需打补丁），故选 GitHub 源"
  - "E074: make 并行触发 HMDFS jobserver fifo EPERM（make: jobserver mkfifo: Operation not permitted），必须 -j1"
  - "E114: config.status 用 umask 077 建临时目录在 HMDFS 上不可写，需从生成的 configure 中删除 umask 077"
  - "iODBC 安装 libodbc.a/libodbc.so 作为 unixODBC 兼容别名（符号链接），本配方保留"
  - "上游无测试套件（无 tests/、无 TESTS/check_PROGRAMS，make check 为空）"
