# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcerfcpp/3.3
homepage: "https://jugit.fz-juelich.de/mlz/libcerf"

# 上游测试命令 (ctest 注册的 9 个 _cpp 测试 + 9 个 _c 测试；本包只构建 C++ 库，故执行 9 个 _cpp 测试)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (testcpp/CMakeLists.txt 将 test/*.c 编译为 C++ 再链接 libcerfcpp)
upstream_tests:
  - file: test/cerftest.c
    source: libcerf-v3.3.tar.gz/test/cerftest.c
    description: "复误差函数 cerf/cerfc/erfi/cerfcx 上游回归测试 (C++ 构建)"
    command: "./testcpp/cerftest_cpp"
  - file: test/dawsontest.c
    source: libcerf-v3.3.tar.gz/test/dawsontest.c
    description: "Dawson 积分上游回归测试 (C++ 构建)"
    command: "./testcpp/dawsontest_cpp"
  - file: test/erfcxtest.c
    source: libcerf-v3.3.tar.gz/test/erfcxtest.c
    description: "erfcx 上游回归测试 (C++ 构建)"
    command: "./testcpp/erfcxtest_cpp"
  - file: test/imwofxtest.c
    source: libcerf-v3.3.tar.gz/test/imwofxtest.c
    description: "im_w_of_x 上游回归测试 (C++ 构建)"
    command: "./testcpp/imwofxtest_cpp"
  - file: test/realtest.c
    source: libcerf-v3.3.tar.gz/test/realtest.c
    description: "实数特例上游回归测试 (C++ 构建)"
    command: "./testcpp/realtest_cpp"
  - file: test/statusquotest.c
    source: libcerf-v3.3.tar.gz/test/statusquotest.c
    description: "状态商上游回归测试 (C++ 构建)"
    command: "./testcpp/statusquotest_cpp"
  - file: test/voigttest.c
    source: libcerf-v3.3.tar.gz/test/voigttest.c
    description: "Voigt 函数上游回归测试 (C++ 构建)"
    command: "./testcpp/voigttest_cpp"
  - file: test/widthtest.c
    source: libcerf-v3.3.tar.gz/test/widthtest.c
    description: "Voigt 半高宽上游回归测试 (C++ 构建)"
    command: "./testcpp/widthtest_cpp"
  - file: test/wofztest.c
    source: libcerf-v3.3.tar.gz/test/wofztest.c
    description: "Faddeeva w_of_z 上游回归测试 (C++ 构建)"
    command: "./testcpp/wofztest_cpp"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_cerfcpp.cpp
    description: "消费者冒烟测试: w_of_z/cerf/cerfc/dawson/voigt/im_w_of_x 共 6 项真实 API 断言"
    command: "./test_cerfcpp"

# 测试断言总数 (消费者 6 CHECK-OK + 上游 9 ctest)
assertion_count: 15

# 测试接入说明 (HMBS 机器证据):
# - build() 末尾 _run_upstream_tests() 真机执行 `ctest --output-on-failure`，
#   逐行回显输出并解析 ctest 汇总行 (N% tests passed, M tests failed out of K)
#   得到真实计数，持久化为 build_folder/hmbs_upstream.json，随后立即输出
#   HMBS_UPSTREAM_TEST_RESULT=<同一 JSON> (status 非 passed 时抛异常)。
# - package() 把 hmbs_upstream.json 复制进包内 res/。
# - test_package test() 先经 ctest 运行消费者测试，再直接执行 ./test_cerfcpp
#   统计 CHECK-OK 行数并输出 HMBS_TEST_PACKAGE_RESULT，随后读取
#   <package>/res/hmbs_upstream.json 复发 HMBS_UPSTREAM_TEST_RESULT
#   (包缓存命中时 build() 不重跑，仅 test_package 每轮必跑，保证标记每轮出现)。
# - 计数全部来自真机测试框架输出，不写死、不估算；文件缺失或 status 非
#   passed 均抛 ConanException 显式失败，不静默通过。
