software: libcerfcpp
display: "libcerfcpp"
description: "Self-contained complex error function library (C++ interface)"
category: library
homepage: "https://jugit.fz-juelich.de/mlz/libcerf"
license: MIT
build_system: cmake
ohos_adaptation:
  key_points:
    - "Only the C++ library (CERF_CPP=ON, CERF_C=OFF) is built"
    - "CLI tools and man pages disabled (LIB_RUN=OFF, LIB_MAN=OFF)"
    - "Upstream ctest suite runs in build() via ctest --output-on-failure"
  common_dependencies: []
versions:
  "3.3":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libcerfcpp/3.3"
    note: "C++ interface of libcerf 3.3; C library not packaged"
