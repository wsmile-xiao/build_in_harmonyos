package: libpurple/2.14.14
homepage: "https://pidgin.im/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: check_libpurple
    source: libpurple/tests/check_libpurple.c, test_cipher.c, test_util.c, test_xmlnode.c
    description: "Pidgin libpurple core Check suite (72 START_TEST cases; protocol-specific Jabber tests are omitted because protocol modules are disabled)"
    command: "make check"

test_package_tests:
  - file: test_libpurple.c
    description: "Consumer calls purple_core_get_version and checks the packaged library version"
    command: "test_libpurple"

assertion_count: 73
