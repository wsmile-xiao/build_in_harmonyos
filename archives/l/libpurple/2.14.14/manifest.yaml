version: "2.14.14"
status: built
build_date: "2026-09-26"
source:
  url: "https://downloads.sourceforge.net/project/pidgin/Pidgin/2.14.14/pidgin-2.14.14.tar.bz2"
  tar_format: tar.bz2
build:
  system: autotools
  configure_options:
    - --disable-gtkui
    - --disable-consoleui
    - --disable-plugins
    - --with-dynamic-prpls=
    - --disable-vv
    - --disable-gstreamer
    - --disable-meanwhile
    - --disable-avahi
    - --disable-nss
    - --disable-gnutls
    - --disable-dbus
    - --disable-idn
    - --disable-cyrus-sasl
    - --disable-tcl
    - --disable-tk
    - --disable-perl
    - --disable-mono
    - --disable-nls
    - --disable-shared
  dependencies:
    - glib/2.84.0
    - libxml2/2.15.3
    - check/0.15.2 (private build/test dependency)
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-configure-hmdfs-umask.patch"
  - "0002-libpurple-core-only.patch"
  - "0003-core-tests-without-protocol-modules.patch"
patch_classification:
  - file: 0001-configure-hmdfs-umask.patch
    type: portability
    platform_only: true
    guard: none
  - file: 0002-libpurple-core-only.patch
    type: portability
    platform_only: true
    guard: none
  - file: 0003-core-tests-without-protocol-modules.patch
    type: portability
    platform_only: true
    guard: "test-only core suite for the protocol-free build"
knowledge_gained: []
