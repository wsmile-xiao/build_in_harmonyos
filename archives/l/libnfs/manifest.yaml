software: libnfs
name: libnfs
category: library
description: NFS client library for accessing NFS shares over a network
homepage: "https://github.com/sahlberg/libnfs"
repository: https://github.com/sahlberg/libnfs
license:
  - LGPL-2.1
  - BSD
  - GPL-3

versions:
  - version: "6.0.2"
    status: published
    build_date: "2026-05-20"
    build_system: cmake
  - version: "5.0.3"
    status: built
    build_date: "2026-09-18"
    build_system: cmake
    notes: |
      库 + 自带 CLI（nfs-ls/nfs-cat/nfs-cp/nfs-stat）。CLI 声明见软件级
      commands.json（R38）。按仓库惯例静态构建（CMake 把 HarmonyOS 视为
      未知平台，共享库不注入 SONAME）。上游 50 项 shell 测试依赖
      sudo exportfs 内核 NFS 服务，鸿蒙 PC 不可运行（平台限制）。

preferred_build_system: cmake

build_dependencies: []
runtime_dependencies:
  - libc
