# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnfs/5.0.3
homepage: "https://github.com/sahlberg/libnfs"

# 上游测试命令
# tests/CMakeLists.txt 通过 file(GLOB test_*.sh) 注册 50 个 CTest 用例，
# 全部由 tests/functions.sh:start_share() 调用 `sudo exportfs` 启动内核
# NFS 导出（tests/README 亦说明 "need sudo access to run exportfs"）。
upstream_check_command: "ctest  (tests/CMakeLists.txt registers 50 cases)"

# conanfile.py build() 中未集成上游测试（需要 NFS server + sudo，CI 不具备）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试清单（R51 三步法：清点 → 实跑 → 如实回填）
# 清点：tests/ 下 test_*.sh 共 50 个（另有 3 个 .disabled 不注册）。
# 实跑：ENABLE_TESTS=ON 构建成功后 `ctest --timeout 15` → 50/50 FAILED，
#       根因统一为环境缺失（非库缺陷）：
#         "open /dev/tty for write failed"（sudo 无法提权）
#         "Failed to mount nfs share : nfs_service failed"
#       设备实测无 exportfs 二进制、无 /proc/fs/nfsd（内核态 NFS 服务缺失）。
upstream_tests:
  - file: tests/test_0100_ls_basic.sh
    source: libnfs-5.0.3/tests/test_0100_ls_basic.sh
    description: "nfs-ls 基本列目录（start_share 需 sudo exportfs → 平台不可运行）"
    command: "ctest -R test_0100_ls_basic"
  - file: tests/test_0200_stat.sh
    source: libnfs-5.0.3/tests/test_0200_stat.sh
    description: "prog_stat 远程 stat（同上，需内核 NFS 导出）"
    command: "ctest -R test_0200_stat"
  - file: tests/test_0290_read.sh
    source: libnfs-5.0.3/tests/test_0290_read.sh
    description: "远程读文件（同上，需内核 NFS 导出）"
    command: "ctest -R test_0290_read"
  # … 其余 47 个用例同构，均为 exportfs 依赖，平台限制无法运行。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：nfs_init_context / nfs_parse_url_full / nfs_destroy_url / nfs_destroy_context 并断言 URL server/path/file 字段"
    command: "./test_libnfs"
  - file: conanfile.py
    description: "CLI smoke：nfs-ls/nfs-cat/nfs-cp/nfs-stat 无参运行须打印 Usage:（证明静态二进制可加载执行）"
    command: "nfs-ls; nfs-cat; nfs-cp; nfs-stat"

# 测试断言总数 (近似值)
# test.c: init != NULL + parse != NULL + server + path + file + destroy = 6
# CLI: 4 个二进制各 1 条 usage 断言 = 4
assertion_count: 10
