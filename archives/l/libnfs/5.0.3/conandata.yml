# conandata.yml — libnfs 5.0.3
# Source: official GitHub tag tarball (R39: official source only).
# sha256 verified stable across repeated downloads from the official URL.

sources:
  url: "https://github.com/sahlberg/libnfs/archive/refs/tags/libnfs-5.0.3.tar.gz"
  sha256: "d945cb4f4c8f82ee1f3640893a168810f794a28e1010bb007ec5add345e9df3e"

patches:
  - patch_file: "patches/0001-cmake-ConfigureChecks.cmake.patch"
    patch_description: "Detect <sys/uio.h> (autotools has AC_CHECK_HEADERS([sys/uio.h]), CMake build lacked it) — avoids implicit writev() declaration"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-config.h.cmake.patch"
    patch_description: "Emit HAVE_SYS_UIO_H in the generated config.h"
    patch_type: "portability"
  - patch_file: "patches/0003-utils-CMakeLists.txt.patch"
    patch_description: "Install the CLI tools with install(TARGETS ... RUNTIME DESTINATION) instead of install(FILES ...) so they keep the executable bit and get correct install semantics"
    patch_type: "portability"
