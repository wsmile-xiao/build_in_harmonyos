knowledge_gained:
  - "CMake 将 HarmonyOS 视为未知平台，不注入 -Wl,-soname，构建共享库会得到无 SONAME 的 libnfs.so（NEEDED 退化为相对路径 ../lib/libnfs.so）；按仓库惯例改为静态库（BUILD_SHARED_LIBS=OFF）规避"
  - "上游 utils/CMakeLists.txt 用 install(FILES ...) 安装 CLI，安装后丢失可执行位且不修正 RPATH；改为 install(TARGETS ... RUNTIME DESTINATION) 后 CLI 可执行"
  - "上游 CMake 构建缺少 sys/uio.h 检查（autotools 的 AC_CHECK_HEADERS 有），导致 writev 隐式声明；补 check_include_file 后告警消除"
  - "libnfs.h 依赖调用方先包含 <sys/time.h>（struct timeval 前置声明），否则消费者编译报 incomplete type"
  - "上游测试套件（tests/*.sh，50 项）依赖 sudo exportfs 启动内核 NFS 服务器；鸿蒙 PC 无 exportfs / /proc/fs/nfsd，无法运行（平台限制，非库缺陷）"

