sources:
  url: "https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz"
  sha256: "6653ef5910f17954861fe72332e68b03ca6e4d9c7160eb3a8de5a5a913bfab43"

patches:
  - patch_file: "patches/0001-CMakeLists-modern-minimum-and-drafts-guard.patch"
    patch_description: >-
      Raise cmake_minimum_required to 3.5...3.27 (CMake 4.x drops <3.5
      compatibility, command line CMAKE_POLICY_VERSION_MINIMUM alone still
      leaves the deprecated project() ordering), and guard the
      ZMQ_HAVE_BUSY_POLL test registration behind an existing source file
      check so ENABLE_DRAFTS builds cannot reference the missing
      test_busy_poll.cpp on OHOS.
    patch_type: "portability"
