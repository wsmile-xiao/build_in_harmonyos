package: libzmq/4.3.5
homepage: "https://zeromq.org"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -E <ohos_excluded> (run from <build_folder>)"

upstream_tests:
  - file: tests/CMakeLists.txt
    source: zeromq-4.3.5/tests/CMakeLists.txt
    description: "Registers 93 test executables on OHOS (base list + NOT WIN32 additions + IPC transports + Linux abstract ipc + fork), each mapped to a ctest entry."
    command: "ctest"
  - file: unittests/CMakeLists.txt
    source: zeromq-4.3.5/unittests/CMakeLists.txt
    description: "Registers 7 unit test executables (ypipe, poller, mtrie, ip_resolver, udp_address, radix_tree, curve_encoding)."
    command: "ctest"
  - file: tests/test_pair_tcp.cpp
    source: zeromq-4.3.5/tests/test_pair_tcp.cpp
    description: "Representative transport test exercising the kernel TCP stack through zmq sockets."
    command: "ctest -R test_pair_tcp"
  - file: tests/test_reqrep_tcp.cpp
    source: zeromq-4.3.5/tests/test_reqrep_tcp.cpp
    description: "REQ/REP request-reply pattern over TCP loopback."
    command: "ctest -R test_reqrep_tcp"

test_package_tests:
  - file: test_libzmq.c
    description: "HarmonyOS-specific consumer test: musl errno integration (zmq_strerror/EAGAIN), inproc roundtrip, TCP loopback REQ/REP with RCVTIMEO, PUB/SUB topic filtering, and pthread I/O-thread integration."
    command: "./test_package"

assertion_count: 100

harmonyos_validation:
  status: pending
  command: 'CI_PACKAGES="archives/l/libzmq/4.3.5" zsh ci/conan/build_and_test.sh'
