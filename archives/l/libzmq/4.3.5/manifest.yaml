software: "libzmq"
version: "4.3.5"
status: built
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz"
  sha256: "6653ef5910f17954861fe72332e68b03ca6e4d9c7160eb3a8de5a5a913bfab43"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED=ON"
    - "-DBUILD_STATIC=OFF"
    - "-DENABLE_DRAFTS=OFF"
    - "-DENABLE_CURVE=OFF"
    - "-DWITH_LIBSODIUM=OFF"
    - "-DWITH_OPENPGM=OFF"
    - "-DWITH_NORM=OFF"
    - "-DWITH_VMCI=OFF"
    - "-DENABLE_WS=OFF"
    - "-DWITH_DOC=OFF"
    - "-DZMQ_BUILD_TESTS=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists-modern-minimum-and-drafts-guard.patch"

test:
  upstream_tests_registered_static: 100
  upstream_tests_registered_shared: 89
  upstream_tests_passed_static: 96
  upstream_tests_passed_shared: 89
  upstream_tests_excluded_selinux_ipc: 4
  test_package: "HarmonyOS consumer test（musl errno/inproc/tcp loopback/pubsub/pthread 五组）"

knowledge_gained:
  - "CMake 4.x 需将 libzmq 4.3.5 三处 cmake_minimum_required(2.8.x) 升至 3.5...3.27"
  - "OHOS musl 定义 SO_BUSY_POLL 使 ZMQ_HAVE_BUSY_POLL=1，但 release tarball 缺 test_busy_poll.cpp，DRAFTS=ON 时需源文件存在性守卫"
  - "OHOS SELinux 拒绝 CI 沙箱内 AF_UNIX bind（EPERM），IPC 类测试需豁免"
  - "musl ldso 遇 /data/storage/el1/bundle/libs 巨型目录中断 LD_LIBRARY_PATH 后续搜索（test_package 坑）→ DRAFT-13536"
  - "上游 unittests 仅 BUILD_STATIC=ON 注册：static=100 测试 / shared=89 测试（口径差异非删减）"
