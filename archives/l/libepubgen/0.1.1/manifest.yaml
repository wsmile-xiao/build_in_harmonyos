  - "0002-config.sub.patch"

knowledge_gained:
  - "HMDFS 上 umask 077 && mktemp -d 创建权限 2700 目录，owner 也无法写入；需手动修改 config.status 移除 umask 077"
  - "config.guess/config.sub 需替换为支持 aarch64-linux-ohos 的版本"
  - "E053: 鸿蒙不提供 cc1plus，必须显式 CXX=clang++"

platform_notes:
  - "configure 生成 config.status 后，需手动修改第 855 行: 将 `umask 077 && mktemp` 改为 `mktemp`(移除 umask 077)，否则 config.status 无法创建临时文件（HMDFS 权限限制）"
  - "此修改不是源码补丁，是 configure 后的手动调整（R6: 不对生成文件做补丁）"
