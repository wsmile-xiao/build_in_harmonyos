# 软件级 manifest — looktxt
software: looktxt
display: "looktxt"
description: "把任意自由格式文本中的数值区域导出为 Matlab/IDL/Scilab/Octave/XML/YAML/HTML/Raw 等科研数据格式"
category: utility
homepage: "https://gitlab.com/soleil-data-treatment/soleil-software-projects/looktxt"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 ANSI C + 单文件 POSIX Makefile，零第三方依赖（仅链接系统 libc）"
    - "1 个可移植性补丁：OHOS 目标 aarch64-unknown-linux-ohos 的 plain char 默认无符号，`char c` 无法表达 EOF，file_scan() 的文本扫描主循环在文件结尾失去出口（未打补丁时上游 examples/Al.lau 用例 timeout 25 → rc=124，任意有限预算同样不返回）；改为 `int c`（getc 的标准返回值域），单行、无平台宏"
    - "以 `NEXUS_NAPI=` 屏蔽上游 Makefile 对宿主 /usr/include/napi.h 的 $(shell) 探测，保证跨机器可复现（nexus 未发布，NeXus/HDF5 导出关闭）"
    - "上游 make test（1 次 --version + 5 个 examples 干跑）在 build() 中完整执行并强校验 'Test OK'，6/6 通过，用例零修改"
    - "上游 install 目标依赖 install(1)（OHOS 无），package() 直接 copy 二进制 + LICENSE + README"
  common_dependencies: []

versions:
  "1.4.1":
    status: built
    build_date: "2026-09-19"
    conan_ref: "looktxt/1.4.1"
