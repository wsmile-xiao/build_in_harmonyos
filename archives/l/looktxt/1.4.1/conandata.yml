# conandata.yml — looktxt 1.4.1
# 上游官方源码：Soleil 数据处 GitLab 项目的 tag 归档（官方源, R39）。
# 本文件注释中**不得出现 sources.url 的前缀型 URL**：CI 预下载阶段会把文件中找到的
# 每个 URL 逐个改写为本地缓存路径，前缀型 URL 先被替换会拼出不存在的路径
# （症状：source() 抛 NotADirectoryError）。项目主页见软件级 README.md。
# sha256 为本 URL 下载实测值（conan 拉取时校验通过）。Debian 官方镜像的源码包描述文件
# looktxt_1.4.1-3.dsc 的 Checksums-Sha256 段对 looktxt_1.4.1.orig.tar.gz 记录同一哈希
# （a586e12a8706cd3e49e8ce836593720f3824e84cb8fd8d3f22f40987b778aac8，344832 字节），
# 且该 .dsc 的 Homepage 即本条 URL 所属项目 ⇒ 两条独立来源指向同一份字节内容。
# 凭据链接不在本文件内（门禁的预下载步骤会把本文件中**任何位置**的 http(s) 文本当作下载源），
# 完整 .dsc URL 与摘录见 notes.md 问题表 #13 与软件级 README.md。
#
# 补丁文件名由 `refresh-patch --auto`（R3，finish Step 1）按“序号-变更文件路径”规则
# 生成，因此是 0001-looktxt.c.patch；其内容与手工命名时逐字节一致（diff 为空）。

sources:
  url: "https://gitlab.com/soleil-data-treatment/soleil-software-projects/looktxt/-/archive/v1.4.1/looktxt-v1.4.1.tar.gz"
  sha256: "a586e12a8706cd3e49e8ce836593720f3824e84cb8fd8d3f22f40987b778aac8"

patches:
  - patch_file: "patches/0001-looktxt.c.patch"
    patch_description: "0001 looktxt.c file_scan widen EOF receiver char to int (plain char is unsigned on aarch64 OHOS so EOF becomes 255 and the source scanner loop never terminates)"
    patch_type: "portability"
