# 知识沉淀
knowledge_gained:
  - "OHOS clang 目标 aarch64-unknown-linux-ohos 上 plain char 默认无符号（实测 CHAR_MIN=0、预定义 __CHAR_UNSIGNED__）：用 `char c` 承接 getc() 再与 EOF 比较的状态机在 EOF 处永不退出 → 死循环。looktxt 1.4.1 的 file_scan() 扫描主循环（looktxt.c L2382 声明 / L2419 读取 / L2422+L2692 判 EOF）正中此坑，未打补丁时上游 `make test` 在 examples/Al.lau 上无限挂起（timeout 25 → rc=124，100% CPU）；单行 `int c` 修正后 6/6 通过（与 Debian fix_infinite_loop.patch 语义等价；未取该补丁原文，不作逐字断言）。同机对照：未打补丁 + `-fsigned-char` 也能跑完，说明病因确为 char 符号性；`--fast` 不能规避（扫描阶段必走 file_scan()） knowledge_ref: DRAFT-8543-plain-char-eof-sentinel-infinite-loop"
  - "上游 Makefile 用 `NEXUS_NAPI = $(shell [ -f /usr/include/napi.h ] && echo -DUSE_NEXUS -lNeXus || echo \"\")` 探测宿主头文件 → 构建不可复现（宿主有 napi.h 就链接 NeXus）。make 命令行变量优先级高于 ifeq 内的普通赋值，故 `make NEXUS_NAPI=` 可稳定关闭该可选后端（ohpcd 未发布 nexus，W0） knowledge_ref: notes.md#遇到的问题与解决方案-2"
  - "上游 Makefile 使用 `${CC}`：配方必须从 Conan conf 取编译器（R33），否则 CI worker 上 CC 为空退化为 `cc` knowledge_ref: notes.md#遇到的问题与解决方案-3"
  - "looktxt 的进程退出码是『已处理文件数』而非错误指示：无输入/不可读输入 → rc=0，两个输入 → rc=2，覆盖保护失败也 → rc=1。消费者测试必须按实测语义断言，不能用『非零即失败』判断 knowledge_ref: notes.md#遇到的问题与解决方案-5"
  - "上游 `make install` 依赖 install(1)（OHOS/toybox 无此命令），package() 直接 copy bin/looktxt + LICENSE + README.md knowledge_ref: notes.md#遇到的问题与解决方案-4"
  - "不加 --fast 的慢路径存在既有数值缺陷（2×3 矩阵首行被写成 `1 1 2`），用未打补丁的源码（`-fsigned-char` 构建）同样逐字复现 → 非本次适配引入，位置在上游 data_get_double()（L2056–L2154）的 `/* slower method: fread+sscanf */` 分支（L2108 起，与 file_scan() 的 EOF 死循环是两个独立缺陷）；数值保真断言统一走文档推荐的 --fast 路径，缺陷在本笔记与本地 reports/test-report.md（不随 PR 分发）中如实披露 knowledge_ref: notes.md#遇到的问题与解决方案-6"
  - "refresh-patch --auto（finish Step 1）每次都按『序号-变更文件路径』重命名补丁并回填 manifest 的 patch_generation/patch_classification（默认 type: auto、platform_only: True、guard: pending）。conandata.yml 的 patch_file 必须使用工具生成的名字，否则重跑 finish 会改名使 export_conandata_patches 抛『Patch file does not exist』；分类需 finish 之后人工回填且不再重跑 finish（同类先例见 is_utf8/1.4.1 notes 问题表 P3） knowledge_ref: DRAFT-8543-refresh-patch-rename-conandata-desync"
  - "CI/W3 门禁的预下载步骤会把 conandata.yml 中**任意位置**（含注释）的 http(s) URL 逐个 str.replace 成 file:// 缓存路径；注释里的 URL 若是 sources.url 的前缀，真实 URL 会被切成不存在的路径，source() 抛 NotADirectoryError，而 conan-verify 走官方 HTTPS 因此全绿。conandata.yml 只允许一处 URL（sources.url），主页/来源核验信息放 README/manifest/notes，并清理已污染的 .build-cache/predl_cache 条目 knowledge_ref: DRAFT-8543-conandata-comment-url-predl-rewrite"
  - "交付文档里的『根因位置』必须由源码事实反查，不能凭函数名直觉：本包早期把 EOF 死循环写成 data_get_double()（它只是 README 里 fast/slow 两条数值路径的所在，L2056–L2154 且不含任何 getc/EOF），真实位置是 file_scan()（L2336–L2700）。W4 独立审计代理重新下载官方归档并 grep 函数边界后判为 P1（文档与源码矛盾）。教训：写『某函数导致某症状』时同时记下符号级证据（行号 + 该函数内确实存在触发语句），并保留一组可复现的对照实验，使文档可被独立复核 knowledge_ref: notes.md#遇到的问题与解决方案-10"
  - "能力清单以交付二进制的实际宣传/行为为准，不要拿源码注释当事实：本包文档先写『6 种格式』、改正时又照抄 looktxt.c L70 的文件头注释写成『7 种、格式表共 7 项』，两者都与事实不符——`NUMFORMATS` 为 13（L474），`Global_Formats`（L487–L646）在默认构建（无 USE_MAT/USE_MEX/USE_NEXUS）下有 8 个非 NULL Name，`print_usage()`（L2317–L2320）逐项打印它们，故 `--help` 宣传 8 种，实测 8/8 可用（多出的是 L600 的 YAML）。W4 第三轮据此判 P1。正确做法：跑一次 `<bin> --help` 抄其输出，再逐格式做一次最小导出，而不是数注释或数表项 knowledge_ref: notes.md#遇到的问题与解决方案-13"

