# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: looktxt/1.4.1
homepage: "https://gitlab.com/soleil-data-treatment/soleil-software-projects/looktxt"

# 上游测试命令（上游 Makefile 唯一回归入口，无 check 目标）
upstream_check_command: "make test"

# conanfile.py build() 是否已集成上游测试：是（失败即中止构建）
upstream_test_in_build: true
upstream_test_command: "timeout -k 5 600 make -j1 CC=<ohos-clang> NEXUS_NAPI= test"

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile:test
    source: looktxt-v1.4.1/Makefile
    description: >-
      上游唯一回归目标，逐字为 `./looktxt --version` + `./looktxt --verbose --test
      examples/*` + `@echo Test OK`。--test 为干跑模式：对 examples/ 下 5 个真实观测数据
      文件（Al.lau 68 KB、He4_liq_1_coh.sqw 428 KB、Monitor_GV_1330447143_list.L_x_y_z
      358 KB、Na2Ca3Al2F14.cfl 685 B、socket.off 57 KB）执行数值域扫描与数据集聚类，
      并逐条输出 VERBOSE 分类结果；全部通过后打印上游自身的 "Test OK" 标记。
      配方在 build() 中捕获该目标日志，要求退出码 0 且存在 "Test OK" 标记，否则硬失败。
    command: "timeout -k 5 600 make -j1 CC=<ohos-clang> NEXUS_NAPI= test"
    upstream_total: 6
    executed: 6
    passed: 6
    blocked: 0
    status: >-
      PASS —— OHOS 设备 6/6（1 次 --version + 5 个 examples 文件 --test），
      上游 "Test OK" 标记出现，退出码 0。唯一源码补丁（char→int 的 EOF 修正）正是该
      套件的前提：未打补丁的二进制在 examples/Al.lau 上无限挂起（timeout 25 → rc=124，
      任意有限超时预算下同样不返回），补丁后同一命令 rc=0。上游断言与用例零修改。

# R51 上游测试清点证据（适配前申报）
upstream_test_inventory:
  tests_directory: false
  makefile_am_tests: false
  makefile_am_check_programs: false
  configure_test_options: 0
  make_check_cases: 0
  evidence:
    - "解压树共 5 项：LICENSE、Makefile、README.md、examples/（5 个数据文件）、looktxt.c；无 tests/、test/、t/ 目录"
    - "上游无 configure/autotools（纯 POSIX Makefile，单文件 looktxt.c 4513 行），故无 --enable-test* 开关"
    - "Makefile 无 check 目标：`grep -nE '^[a-zA-Z_.-]+:' Makefile` 只有 all/install/clean/distclean/uninstall/test 六个伪目标（.PHONY 同列这六个），没有名为 looktxt 的目标——可执行文件由隐式规则 `%: %.c` 产出（因此 CFLAGS/EXTRA_CFLAGS 不参与该编译行）"
    - "上游回归入口为 make test（共 6 项检查：1 次 --version + 5 个 examples 文件的 --test 干跑），本配方在 build() 中真实执行并强校验 'Test OK'"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_looktxt.sh
    description: >-
      15 条断言，真实执行已安装二进制：PATH 上存在 looktxt；--version 退出码 0 且打印
      "1.4.1 (23 Mar 2022)"；--help 退出码 0 且宣传 --test；无输入时告警
      "No file to process" 且退出码 0；不可读输入报 "can not be accessed"（退出码为
      已处理文件数，故为 0）；两个输入 → 退出码 2 且两份产物落地；Matlab 导出保真
      （x=1 2 3 / y=4 5 6 + End of file 尾标记）；默认格式为 Matlab 且文件名点号转下划线
      （t1.txt → t1_txt.m）；Raw 导出头行含 "generated by looktxt.c 1.4.1"；XML 导出含
      <Source> 元素；-o 指定输出名生效（out.m + function out=out()）；-b 二进制数据块
      200 个 double 恰为 1600 字节；重复写入触发覆盖保护、-F 后正常改写且无
      "Invalid Target"；--test 干跑退出码 0、打印 classify 结果且不产生任何输出文件
    command: "sh test_looktxt.sh"

# 测试断言总数（= test_looktxt.sh 的 [PASS]/[FAIL] 行数）
assertion_count: 15
