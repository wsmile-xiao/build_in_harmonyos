knowledge_gained:
  - "libcangjie 1.4.0 上游 Meson 构建，运行时依赖仅 sqlite3（sqlite/3.53.3）。"
  - "meson dependency('sqlite3') 需要 sqlite3.pc：sqlite 包经 PkgConfigDeps 生成 sqlite.pc，需在 generators 目录别名为 sqlite3.pc。"
  - "上游测试套为 tests/ 下 4 个二进制（test_libcangjie/test_cangjie/test_cangjiechar/test_cangjiecharlist），meson test 注册 4 项，需先构建 cangjie.db（custom_target）再运行 Test Cangjie。"
  - "cangjie_new 支持 CANGJIE_DB 环境变量覆盖数据库路径，test_package 据此指向包内 share/libcangjie/cangjie.db。"
  - "共享库 libcangjie.so.3.1.0 符号链接别名链（HMDFS 软链不稳）：物化为实体拷贝（rm -f && cp）。"
