package: libcangjie/1.4.0.really.1.4.0
homepage: "https://gitlab.freedesktop.org/cangjie/libcangjie"

upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C build --no-rebuild --print-errorlogs"

upstream_tests:
  - file: tests/test_libcangjie.c
    source: libcangjie-v1.4.0/tests/test_libcangjie.c
    description: "公共版本 API 测试（约 9 个 assert）"
    command: "./test_libcangjie"
  - file: tests/test_cangjie.c
    source: libcangjie-v1.4.0/tests/test_cangjie.c
    description: "核心 Cangjie 句柄与数据库查询测试（约 170 个 assert，需 CANGJIE_DB）"
    command: "./test_cangjie --verbose"
  - file: tests/test_cangjiechar.c
    source: libcangjie-v1.4.0/tests/test_cangjiechar.c
    description: "字符对象创建与字段测试（约 11 个 assert）"
    command: "./test_cangjiechar"
  - file: tests/test_cangjiecharlist.c
    source: libcangjie-v1.4.0/tests/test_cangjiecharlist.c
    description: "字符链表追加与前插测试（约 15 个 assert）"
    command: "./test_cangjiecharlist"

test_package_tests:
  - file: test_cangjie.c
    description: "消费者视角验证：版本/字符/链表/建句柄/真实查库（6 项 CHECK-OK，需 CANGJIE_DB 指向包内 cangjie.db）"
    command: "./test_libcangjie"

assertion_count: 211
