# 版本级 manifest — libnpy 1.0.1
# 文件位置: archives/l/libnpy/1.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "1.0.1"
software: libnpy
status: built
build_date: "2026-09-25"
build_system: meson
conan_ref: "libnpy/1.0.1"

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/llohse/libnpy/archive/refs/tags/v1.0.1.tar.gz"
  sha256: "43452a4db1e8c1df606c64376ea1e32789124051d7640e7e4e8518ab4f0fba44"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型
  system: meson
  # header-only：无 configure/meson 配置选项（根 meson.build 仅 declare_dependency，
  # 无构建目标、无 install 规则——package() 直接拷贝 include/npy.hpp）
  configure_options: []
  # 零运行依赖；上游 tests/ 的 catch2 走 meson subproject wrap（构建期、非 conan 依赖），
  # 测试数据生成用的 numpy 走沙箱 HOME pip（均不进 conan 配方依赖）
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息（0 补丁——纯配方适配，未改上游任何文件）
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀（路径 B 草稿三件）
# ============================================================
knowledge_gained:
  - "meson dependency() 解析顺序是先 pkg-config/cmake 系统查、未命中才回退 subproject wrap 下载（catch2 实测：found: NO → 下载 GitHub tarball + wrapdb patch 成功）；--wrap-mode=nodownload 会让回退变成硬错误，conan 化依赖须先让系统查命中"  # knowledge_ref: E730
  - "Catch2 项目的 TEST_CASE 计数陷阱：源码 grep 含块注释会比框架注册数多（libnpy 实测 16 vs 15，差额=上游 /* bool not supported */ 注释块），声明 N 取源码宏最大候选并逐项归因，断言口径另列不混用"  # knowledge_ref: E732
  - "上游测试数据生成依赖 numpy 而设备 python 无 numpy：沙箱 HOME 下 pip install --user numpy 装到任务私有 site-packages（PyPI 已发 ohos_aarch64 原生 wheel，实测 numpy 2.5.3），不污染全局环境"  # knowledge_ref: E733
