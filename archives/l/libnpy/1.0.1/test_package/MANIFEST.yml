# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnpy/1.0.1
homepage: "https://github.com/llohse/libnpy"

# 上游测试命令 (tests/ 为独立 meson 工程，按上游 README 原样运行)
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 方法中是否已集成上游测试
# （否——上游测试原生运行：SKILL Step 2，证据 reports/test-report.md）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test-read.cpp
    source: libnpy-1.0.1/tests/test-read.cpp
    description: "Catch2 单元测试：TEST_CASE 源码宏 16（注册 15 + 上游块注释 1 归因 NOT_RUN）；断言源码 93（注释块 6）、实跑 87 全 PASS"
    command: "./builddir/test-read"
  - file: test-write.cpp
    source: libnpy-1.0.1/tests/test-write.cpp
    description: "写入冒烟：main() 写 6 个 .npy 后 rc=0（0 case / 0 断言，随 meson test 一并运行）"
    command: "./builddir/test-write"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者往返验证 8 项具名检查（C/F 序往返、magic、descr、标量、空数组）"
    command: "./test_libnpy"

# 测试断言总数 (近似值, 用于质量评估)：上游实跑 87 + 消费者 8 = 95
assertion_count: 95
