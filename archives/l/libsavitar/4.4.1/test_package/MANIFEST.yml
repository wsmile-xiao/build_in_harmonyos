# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsavitar/4.4.1
homepage: "https://github.com/Ultimaker/libSavitar"

# 上游测试命令 (ctest -N 实际输出)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机实测通过）
upstream_tests:
  - file: tests/ThreeMFParserTest.cpp
    source: libSavitar-4.4.1/tests/ThreeMFParserTest.cpp
    description: "3MF 解析器测试：parse / sceneToString / decimalSeparatorTest，3 个用例全过"
    command: "./ThreeMFParserTest"
  - file: tests/MeshDataTest.cpp
    source: libSavitar-4.4.1/tests/MeshDataTest.cpp
    description: "网格数据测试：toXmlNode / fromXmlNode，2 个用例全过"
    command: "./MeshDataTest"

# test_package 中自带的测试 (消费者视角验证，真实调用 Savitar API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：ThreeMFParser::parse 最小 3MF 模型并 sceneToString 序列化闭环"
    command: "./test_libsavitar"
  - file: harmonyos_specific_test.cpp
    description: "鸿蒙特有测试：LP64/aarch64 平台确认 + 3MF 解析/单元元数据/网格数据/序列化往返，8 断言实际运行 ALL PASS"
    command: "./harmonyos_specific_test"

# 测试断言总数 (上游 5 用例 + 消费者 2 断言 + 鸿蒙特有 8 断言)
assertion_count: 15