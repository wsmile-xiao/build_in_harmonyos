# test_package/MANIFEST.yml — libsigsegv 2.14
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsigsegv/2.14
homepage: "https://ftp.gnu.org/gnu/libsigsegv/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（tests/ 目录，make check 实测 5/5 PASS）
upstream_tests:
  - file: tests/test-catch-segv1.c
    source: libsigsegv-2.14/tests/test-catch-segv1.c
    description: "SIGSEGV 处理器被调用且故障地址正确（mprotect 恢复写权限）"
    command: "./test-catch-segv1"
  - file: tests/test-catch-segv2.c
    source: libsigsegv-2.14/tests/test-catch-segv2.c
    description: "SIGSEGV 恢复（handler 返回 0 时进程终止路径）"
    command: "./test-catch-segv2"
  - file: tests/test-segv-dispatcher1.c
    source: libsigsegv-2.14/tests/test-segv-dispatcher1.c
    description: "sigsegv_dispatcher 多区域故障分发（sigsegv_init/register/dispatch）"
    command: "./test-segv-dispatcher1"
  - file: tests/test-catch-stackoverflow1.c
    source: libsigsegv-2.14/tests/test-catch-stackoverflow1.c
    description: "栈溢出捕获与恢复（sigaltstack + longjmp 连续两轮）"
    command: "./test-catch-stackoverflow1"
  - file: tests/test-catch-stackoverflow2.c
    source: libsigsegv-2.14/tests/test-catch-stackoverflow2.c
    description: "栈溢出与普通 SIGSEGV 的区分检测"
    command: "./test-catch-stackoverflow2"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：sigsegv_install_handler 捕获空指针 SIGSEGV；stackoverflow_install_handler 捕获无限递归栈溢出（setrlimit 1MB 参照上游）；libsigsegv_version 校验"
    command: "./test_libsigsegv"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 5 测试 + test_package 3 断言（SIGSEGV 捕获 / 栈溢出捕获 / 版本校验）
assertion_count: 8
