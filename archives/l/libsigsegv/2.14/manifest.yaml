# ============================================================
# 知识沉淀（路径 B 素材：信号处理/栈溢出类 musl+HMDFS 差异）
# ============================================================
knowledge_gained:
  - "E007 标准适配：GNU config.guess(2021) 不识别 HarmonyOS，patch-autotools-ohos.pl 打补丁后输出 aarch64-unknown-linux-ohos；但该脚本 §2.3 有缺陷——config.sub 的 kernel-OS 校验列表(linux-musl*|linux-uclibc*)缺 linux-ohos*，因第一步注入的 basic_os=linux-ohos 被误判 already present，需手动补 ' | linux-ohos*'"
  - "HMDFS mktemp 陷阱（同 libffi 3.5.2 0002）：用户存储区(~ 即 /storage/Users，目录 setgid 2771)上 `umask 077 && mktemp -d` 生成 2700 权限目录，后续写入 Permission denied；configure 生成的 config.status 在写 subs1.awk 时崩 'could not setup config files machinery'。修复：configure 内嵌 config.status 模板的 tmp 目录段按 $host_os 分支 umask（linux-ohos* 用 022）。注意 configure 中该段位于 cat >>$CONFIG_STATUS <<_ACEOF quoted heredoc 内，补丁 configure 一处即同时修复主流程与 config.status"
  - "libsigsegv 2.14 configure 检测结论（OHOS musl aarch64）：fault handler=fault-linux-arm.h；sigaltstack/stack_t 工作正常；siglongjmp+sigaltstack 可逃逸；setcontext 不存在（musl 无，'can be left through longjmp and setcontext: no' 属预期，不影响功能）；'supports catching stack overflow: yes'"
  - "上游 make check 5/5 全过：test-catch-segv1/segv2/segv-dispatcher1/catch-stackoverflow1/catch-stackoverflow2。平台报告行 'libsigsegv: aarch64-unknown-linux-ohos | yes | yes | 2.14'"
  - "OHOS musl 栈溢出测试要点：无限递归触发栈溢出前必须 setrlimit(RLIMIT_STACK, 1MB)（上游测试同款做法），否则故障地址距栈区过远无法识别为栈溢出，恢复直接段错误；备用栈按上游 altstack-util.h 留 8KB crumple zone 并 32 字节对齐"
  - "libsigsegv 2.14 API：sigsegv_leave_handler 是 4 参 continuation 版（LIBSIGSEGV_VERSION 0x020E >= 0x0206），旧文档 0 参写法会编译失败；stackoverflow_install_handler 需 (handler, extra_stack, extra_stack_size) 三参"
  - "conanfile 注意：cpp_info.libs=['sigsegv']（-lsigsegv，libtool 产物 libsigsegv.a）；refresh-patch 将 configure 识别为生成文件不自动出补丁（头部 'Generated by' marker），configure 级修改需手动 diff -u 生成补丁（libffi 3.5.2 先例）"
  - "init-build 的 .orig/.work 用硬链接（copy_function=os.link），直接改 .work 源文件会同步污染 .orig 基线导致补丁 diff 为空；修改后必须从 tarball 恢复 .orig 对应文件"

