# 软件级 manifest（跨版本共享；遵循 ARCHIVE-SPEC v2.0）
software: lisgd
display: "lisgd"
description: "suckless 风格的 libinput 合成手势守护进程：读取 libinput 触摸事件、识别 1-4 指合成滑动手势（LR/RL/UD/DU 及对角线）并执行绑定命令，支持 X11 与 Wayland 双显示后端"
category: tool
homepage: "https://git.sr.ht/~mil/lisgd"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "裸 Makefile 烧死系统路径与编译器（CC=cc、PREFIX=/usr、X11INC=/usr/X11R6/include、X11LIB=/usr/X11R6/lib）⇒ conan build() 以 make 命令行变量覆盖（CC/CFLAGS/X11INC/X11LIB/LDFLAGS）注入依赖路径，零补丁"
    - "覆盖的是**路径变量**：上游 CPPFLAGS/LIBS 用 `+=` 内联引用 X11INC/X11LIB，覆盖它们即让 -DWITH_X11/-I 与 -L/-lX11 自动落位；⛔ 不可覆盖 CPPFLAGS/LIBS 聚合变量（会吞掉 += 追加，双后端静默缺失）"
    - "依赖 libinput/1.26.2、libx11/1.8.13、wayland/1.24.0 及其传递依赖（eudev/libevdev/mtdev/xorgproto/libxau/libxcb…）全部来自 ohpcd 制品仓，已实测 --build=never rc=0"
    - "libinput.h 需要 <libudev.h>（eudev，传递依赖）⇒ 编译路径必须按 self.dependencies.host 传递聚合"
    - "上游 install 目标使用 mkdir -p/cp/chmod（toybox 可用），直接以 PREFIX=package_folder 安装，落 bin/ 与 share/man/man1/"
    - "上游无测试套件（7 文件无 tests/、Makefile 无 check/test 目标，N_static=0）；消费者测试以 4 组断言补位（含清空显示变量后的确定性诊断与运行期动态加载零错误）"

  common_dependencies:
    - "libinput/1.26.2"
    - "libx11/1.8.13"
    - "wayland/1.24.0"

versions:
  "0.3.7":
    status: built
    build_date: 2026-10-03
