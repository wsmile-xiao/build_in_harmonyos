# conandata.yml — lisgd 0.3.7
#
# 上游归属与源的选择（框架 PF7 / R39 例外登记，须随 PR 说明）
#
# 【真上游 · 仓库主页】https://git.sr.ht/~mil/lisgd
#   （HTTP 200；Debian 签名 lisgd_0.3.7-1.dsc 的 Homepage 字段即此。）
#   lisgd 是 **suckless 风格**，但**并不托管在 suckless.org**：
#     git.suckless.org/lisgd/                 → 404（根索引 200、仓库列表无 lisgd）
#     dl.suckless.org/tools/lisgd-0.3.7.*     → 404（该主机无此条目）
#   ⛔ 这两个 404 只说明"这两台主机不托管本项目"，**推不出"上游不发布归档"**。
#      （W4 P1-2 更正：上一版把 5 个 404 写成"上游不发布 0.3.7 官方 tarball ⇒ Debian
#        pool 是唯一可得的原版分发件"，属结论超出证据范围，已删除。）
#
# 【官方归档确实存在】https://git.sr.ht/~mil/lisgd/refs 对 0.3.7 直接给出归档：
#     /~mil/lisgd/archive/dcdb22f7efd0db797c11055fbaa8dafd89c3d520.tar.gz
#     实测 HTTP 200、9277 B、sha256=f4fa03bf4777f7ebbf2ee4a7ddc9ea9637082c1c027d21a68e3576450b9e338e
#     顶层目录 lisgd-dcdb22f7efd0db797c11055fbaa8dafd89c3d520/、7 个文件（含 .gitignore）
#
# 【本 PR 实际采用的源】Debian pool 的 pristine 上游原包（.orig = 未打 Debian 补丁的原始 tarball）
#     sha256=4aa53e7a12de61019e0a08bd191297ac747706bdb8392c4cab8f6826a16c1e27
#     8664 B、顶层目录 lisgd-0.3.7/、7 个文件（同样含 .gitignore）
#   与 sr.ht 官方归档**逐文件哈希完全一致**（本机解包后 7/7 文件 sha256 相同）
#   ⇒ 同一上游代码的两种分发形态，差异只在顶层目录名、压缩格式与字节数。
#
#   仍选用 Debian .orig 的理由（均为可核事实）：
#     (a) 第三方交叉验证：Debian 签名 lisgd_0.3.7-1.dsc 的 Checksums-Sha256 记
#         `4aa53e7a…a16c1e27 8664 lisgd_0.3.7.orig.tar.xz`，与本文件 sha256 逐字一致；
#         且 .orig 与 .debian.tar.xz 分离 ⇒ pristine upstream 认证；
#     (b) 同仓先例充分：磁盘上 479 份 conandata.yml 使用 deb.debian.org
#         （含本包自身，即已合入 478 份）；
#     (c) 属框架 PF7 的规则内例外，逃生口文案原文见
#         scripts/ohc/preflight.py:424
#         「确属官方托管例外须 PR 说明并 --no-preflight 跳过」。
#
#   ⚠ 为何不换源：sr.ht 归档顶层目录是 lisgd-dcdb22f7…/ 而非 lisgd-0.3.7/，换源会同时
#     改 sha256 与顶层目录名 ⇒ 牵动 conanfile 的解包逻辑、须重跑 W3、并作废本轮 W4 审计，
#     收益不抵代价（裁决口径：不换源、只更正理由与宿主）。
#
#   ⚠ 本文件注释控制 URL 数量：ci 的 pre-download 会把 conandata 里出现的任何 URL
#     当作候选源抓取（W3 实测 "found 4 source URL(s)"，其中 3 条为 0KB 无效抓取）。

