# 版本级 manifest
# 文件位置: archives/l/lisgd/0.3.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.3.7"
software: "lisgd"

# published | built | failed | archived
status: built

build_date: "2026-10-03"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://deb.debian.org/debian/pool/main/l/lisgd/lisgd_0.3.7.orig.tar.xz"
  sha256: "4aa53e7a12de61019e0a08bd191297ac747706bdb8392c4cab8f6826a16c1e27"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  configure_options: []
  # 裸 Makefile 无 configure；适配变量以 make 命令行覆盖注入（零补丁）：
  #   make CC=<conf 工具链> CFLAGS='-O2 <全部依赖 -I>' \
  #        X11INC=<libx11/include> X11LIB=<libx11/lib> \
  #        LDFLAGS='<全部依赖 -L>' -j1
  #   make install <同一组变量> PREFIX=<package_folder> -j1
  # ⛔ 不可覆盖 CPPFLAGS / LIBS —— 上游用 `+=` 内联引用 X11INC/X11LIB，
  #    命令行覆盖聚合变量会把 -DWITH_X11/-I${X11INC}/-lX11/-lwayland-client 吞掉。

  dependencies:
    - libinput/1.26.2
    - libx11/1.8.13
    - wayland/1.24.0
    - xorgproto/2025.1   # X11/Xlib.h → X11/X.h 的直接头依赖；HEADER 型传递依赖会被 conan 标 Skip，须显式声明

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试账本（五维）
# ============================================================

tests:
  upstream_static: 0        # 上游无测试套件（7 文件无 tests/、Makefile 无 check/test 目标）
  upstream_registered: 0    # 构建系统无可执行测试目标
  upstream_executed: 0      # N_static=0 ⇒ 无上游用例可执行
  consumer_tests: 1         # test_package/test.sh（内含 4 组断言）
  consumer_assertions: 4
  unexecuted_reasons: []    # 无未执行项（上游本就无测试）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "suckless 裸 Makefile 烧死 CC=cc 与 X11INC/X11LIB=/usr/X11R6/*：make 命令行覆盖**路径变量**（而非聚合变量）即可注入 Conan 依赖目录，零补丁；本包 CPPFLAGS/LIBS 以 `+=` 内联引用这两个路径变量，故覆盖它们即让追加自动落位 (knowledge_ref: DRAFT-lisgd-0.3.7-suckless-baked-paths-makevar-override)"
  - "⛔ 边界：覆盖 CPPFLAGS/LIBS 会吞掉 `+=` 追加的 -DWITH_X11/-I${X11INC}/-lX11/-lwayland-client，双后端静默缺失（探针 P4/P5 反证）；上游自带 ifndef WITHOUT_X11/WITHOUT_WAYLAND 开关可用于退纯 Wayland 后端 (knowledge_ref: DRAFT-lisgd-0.3.7-suckless-baked-paths-makevar-override)"
  - "libinput.h 第 35 行 include <libudev.h> ⇒ eudev 头文件是编译期硬前提，仅聚合 direct requires 的路径不够，必须走 self.dependencies.host 传递聚合 (knowledge_ref: DRAFT-lisgd-0.3.7-suckless-baked-paths-makevar-override safety_boundary 6)"
  - "OHOS 上 lisgd 无输入设备/显示环境：/dev/input 无节点且 Permission denied、DISPLAY/WAYLAND_DISPLAY 均空 ⇒ 运行期只能验到参数层与显示探测层诊断；消费者测试清空显示变量使断言与运行机环境无关 (ref: notes.md 运行期能力边界)"

knowledge_ref:
  - "DRAFT-lisgd-0.3.7-suckless-baked-paths-makevar-override"
