# test_package/MANIFEST.yml
# 上游官方测试声明文件（lisgd 0.3.7）
#
# 上游测试清点（R51，2026-10-03 B 机对 lisgd_0.3.7.orig.tar.xz 实测）：
# - tarball 共 7 个文件：.gitignore / LICENSE / Makefile / README.md /
#   config.def.h / lisgd.1 / lisgd.c —— 无 tests/ 目录、无 *test* 源文件；
# - Makefile 目标仅 all / options / .c.o / config.h / lisgd / install / clean，
#   无 check、无 test 目标（实测 `make -n check` 与 `make -n test` 均报
#   `No rule to make target`）；
# - 全包检索 "test" 仅命中 lisgd.c:390 的一条行为注释
#   （// All fingers up - check if within millisecond limit…），非测试框架注册。
# ⇒ N_static=0（上游无测试），按规则以消费者测试补位（见 test.sh）。

package: lisgd/0.3.7
homepage: "https://git.sr.ht/~mil/lisgd"

# 上游无 check/test 目标（实测 make check 报 "No rule to make target 'check'"）
upstream_check_command: ""

# 上游无测试 ⇒ build() 不集成上游测试（upstream_tests 为空是清点结论，非缺漏）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（N_static=0）
upstream_tests: []

# test_package 中自带的测试（消费者视角，真实执行打包产物 lisgd 并断言行为）
test_package_tests:
  - file: test.sh
    description: "PATH 可解析；未知选项走 usage 分支 exit 1；-h 缺值走 die() exit 1；清空显示变量后无参数运行给出确定诊断 exit 1 且全程无动态加载错误（验证 conan 依赖注入在运行期生效）"
    command: "sh test.sh"

# 测试断言总数（test.sh 内 4 组）
assertion_count: 4
