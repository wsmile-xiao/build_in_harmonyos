software: libdrm

version: "2.4.133"

# 扁平字段（框架自检清单读取）：构建系统
build_system: meson

# published | built | failed | archived
status: published

build_date: "2026-09-05"

source:
  url: "https://dri.freedesktop.org/libdrm/libdrm-2.4.133.tar.xz"
  sha256: "fc68f9d0ba2ea63c9432a299e14fea09fad7a8a66e8039fcd7802ca59f77b4f5"
  tar_format: tar.xz

build:
  # meson 构建系统
  system: meson
  build_system: meson

  configure_options:
    - "-Dbuildtype=release"
    - "-Dprefix=/storage/Users/currentUser/usr/local"  # 探索期 staging prefix，配方内由 Conan 管理

  # 编译依赖列表（格式: name/version）；libdrm 2.4.133 无强制外部依赖
  dependencies: []

  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-symbols-check.py.patch

knowledge_gained:
  - "OHOS 上 platform.system() 返回 HarmonyOS 而非 Linux，上游 symbols-check 的平台判定漏掉该分支导致 _init/_fini 等运行库符号被误报（与 mesa 24.3.4 同根因，E 参照其 0001 补丁口径）"
  - "本环境 /tmp 只读（E002），meson/clang 临时文件需用 $HOME/tmp 或工作区目录"
  - "automake 的 shebang perl 链接悬空 + Automake::Config 缺失只影响 autotools 工程；meson 工程无需 automake，可忽略该环境告警"
  - "conan tools.meson 的 Meson 类无 compile() 方法，正确 API 为 build()"

# 本次适配目的：为 mesa GLX/EGL 变体（f3d 全量测试链）提供 libdrm 依赖（R36 拓扑序首包）
purpose: >
  libdrm 是 mesa 开启 GLX/EGL 后端的强制依赖，当前制品仓无 libdrm 配方，
  按 R36 先适配发布 libdrm，再回到 mesa GLX 变体，最后回归 f3d 3.5.0 全量上游测试。

