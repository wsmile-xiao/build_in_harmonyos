# test_package/MANIFEST.yml
# 上游官方测试声明文件（实测填写，基于 meson test --list 与 testlog.txt）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdrm/2.4.133
homepage: "https://dri.freedesktop.org/"

# 上游测试命令（meson 工程，无 make check）
# 注意：symbols-check 的导出符号白名单比对只对共享库有意义（静态库向 nm
# 暴露全部内部符号）；conanfile.py build() 在共享配置下运行完整上游测试，
# 静态配置仅用于打包（R26 默认静态）。
upstream_check_command: "meson test -C build"

# conanfile.py build() 方法中已集成上游测试（meson.test()，共享配置构建树）
upstream_test_in_build: true
upstream_test_command: "meson test -C build"

# 上游实际运行的测试程序（meson test --list 全量 10 项，未删减）
upstream_tests:
  - file: symbols-check.py
    source: libdrm-2.4.133/symbols-check.py
    description: "core 库导出符号与 core-symbols.txt 白名单比对（212 项，含 HarmonyOS 平台修复）"
    command: "meson test -C build libdrm:core-symbols-check"
  - file: symbols-check.py
    source: libdrm-2.4.133/symbols-check.py
    description: "nouveau 库符号白名单比对（43 项）"
    command: "meson test -C build libdrm:nouveau-symbols-check"
  - file: symbols-check.py
    source: libdrm-2.4.133/symbols-check.py
    description: "radeon 库符号白名单比对（44 项）"
    command: "meson test -C build libdrm:radeon-symbols-check"
  - file: symbols-check.py
    source: libdrm-2.4.133/symbols-check.py
    description: "amdgpu 库符号白名单比对（92 项）"
    command: "meson test -C build libdrm:amdgpu-symbols-check"
  - file: symbols-check.py
    source: libdrm-2.4.133/symbols-check.py
    description: "freedreno 库符号白名单比对（45 项）"
    command: "meson test -C build libdrm:freedreno-symbols-check"
  - file: symbols-check.py
    source: libdrm-2.4.133/symbols-check.py
    description: "etnaviv 库符号白名单比对（36 项）"
    command: "meson test -C build libdrm:etnaviv-symbols-check"
  - file: tests/threaded.c
    source: libdrm-2.4.133/tests/threaded.c
    description: "多线程 drmGetVersion/drmFreeVersion 竞态安全"
    command: "meson test -C build libdrm:threaded"
  - file: tests/hash.c
    source: libdrm-2.4.133/tests/hash.c
    description: "util_hash_table 增删查与并发正确性"
    command: "meson test -C build libdrm:hash"
  - file: tests/drmsl.c
    source: libdrm-2.4.133/tests/drmsl.c
    description: "drmSL 有序链表操作"
    command: "meson test -C build libdrm:drmsl"
  - file: tests/drmdevice.c
    source: libdrm-2.4.133/tests/drmdevice.c
    description: "drmGetDevices2 设备枚举（无 DRM 设备时按上游逻辑环境跳过）"
    command: "meson test -C build libdrm:drmdevice"

# test_package 中自带的测试（消费者视角验证，真实调用 libdrm API 错误路径）
test_package_tests:
  - file: test.c
    description: "消费者测试：xf86drm 符号解析 + 非 DRM fd 的 drmGetVersion/drmGetCap 错误契约 + drmFreeVersion(NULL) 安全性（6 项 CHECK 断言）"
    command: "./test_libdrm"

# 测试断言总数：6 组 symbols-check 白名单比对（core 212/nouveau 43/radeon 44/
# amdgpu 92/freedreno 45/etnaviv 36 = 472 项符号）+ 消费者测试 6 项 CHECK 断言
assertion_count: 478
