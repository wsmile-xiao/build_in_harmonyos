# 版本级 manifest —— libcaca 0.99.beta20
# 遵循 ARCHIVE-SPEC v2.0

version: "0.99.beta20"
software: libcaca

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-14"
build_system: autotools

source:
  # 上游 release asset（dist tarball，带预生成的 configure）；非 archive/refs/tags 自动包
  url: "https://github.com/cacalabs/libcaca/releases/download/v0.99.beta20/libcaca-0.99.beta20.tar.gz"
  sha256: "8ad74babc63bf665b0b2378d95b4da65b7493c11bd9f3ac600517085b0c4acf2"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-gnu（显式三元组：本 dist 的 .auto/config.sub 是 2018-02-22 版，不认 ohos/harmonyos；交叉模式保留，config.guess 不执行）"
    - "--prefix=/（配合 DESTDIR 使 include/ 与 lib/ 直落包根）"
    - "--enable-static --disable-shared（R26 系统同名库默认静态）"
    - "--enable-ncurses（终端后端；ncurses/6.4 已发布，头为 include/ncurses.h，库为 libncursesw/libpanelw/libmenuw/libformw）"
    - "--disable-slang --disable-x11 --disable-gl --disable-cocoa --disable-conio --disable-win32 --disable-vga --disable-kernel --disable-network --disable-imlib2（目标系统不同或本平台无已发布依赖）"
    - "--disable-java --disable-python --disable-ruby --disable-csharp（绑定子包超出本仓 C/C++ 适配范围）"
    - "--disable-doc --disable-zzuf"
    - "--enable-cppunit（启用上游 caca/t 的 cppunit 单元套件，配合 cppunit/1.15.1 的 tool_requires）"
    - "依赖路径显式注入 CPPFLAGS/LDFLAGS/LIBS（ncurses + zlib）：conan 生成的 conanautotoolsdeps.sh 不会被裸 subprocess source，configure 因此在设备上探测不到 ncurses"
    - "CPPUNIT_CFLAGS/CPPUNIT_LIBS 显式注入：设备无 pkg-config，且 configure 优先取该环境变量以跳过 PKG_CHECK_MODULES 的 pkg-config 调用"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash（平台 profile 自带的构建 shell）：autoconf 的 exec 7<&0 需要支持多位数 fd 重定向的 shell；且 automake 的 `for subdir in $list` 依赖未加引号变量的 IFS 词分割，zsh 不做该分割会直接把整个 SUBDIRS 当一个目录名"
    - "configure 的 umask 077→022 改写（hmdfs 按组判通行，2700 临时目录不可穿越，chmod 在 hmdfs 上无效）"
    - "TMPDIR 指向构建目录内 .tmp（/tmp 只读）；init-scratch 权限：configure/install-sh/missing/depcomp/ltmain.sh 统一 chmod +x（E490）"
  dependencies:
    - ncurses/6.4
    - zlib/1.3.1
    - cppunit/1.15.1（tool_requires，仅构建期上游单测用）
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-common-image-declare-caca_alloc2d.patch"
  - "0002-examples-conio-static-move.patch"

knowledge_gained:
  - "zsh 不对未加引号的参数展开做 IFS 词分割：automake 生成的 all-recursive 用 `for subdir in $list` 遍历 SUBDIRS，zsh 下整串被当成一个目录名（'zsh:cd: no such file or directory: kernel caca src examples tools ...'）。autotools 树必须以 POSIX 词分割的 shell 跑 make —— 平台 profile 声明的 /data/service/hnp/bin/bash 同时满足 exec 7<&0 与词分割两个要求"
  - "conan 的 AutotoolsToolchain/AutotoolsDeps 生成的 env 脚本（conanautotools*.sh）只被 conan 自己的 Autotools() 助手 source；配方用裸 subprocess 跑 configure 时 conan 不把 build env 应用进 os.environ，依赖的 CPPFLAGS/LDFLAGS/LIBS 必须由配方显式重建（config.log 实证：CPPFLAGS 只剩设备环境里的 -I<prefix>/include，四个 ncurses 头探测全失败）"
  - "设备无 pkg-config：PKG_CHECK_MODULES 的检查在 `$CPPUNIT_CFLAGS` 非空时短路，所以显式导出 CPPUNIT_CFLAGS/CPPUNIT_LIBS 即可让 --enable-cppunit 的检查通过、不必引入 pkgconf"
  - "设备上有两个 agent_worker.sh 同时轮询同一 mailbox，同一 job 会被并发执行两次；两个 conan create 并发导出同一 recipe 时，后者的导出会覆盖前者的缓存目录，表现为 'Cannot load recipe ... conanfile.py not found' 与下载后文件消失。任务脚本需自带 mkdir 互斥锁；缓存被登记而目录缺失时先 conan remove 该包再重跑"
  - "R47 lang-preflight 会把带绑定子目录的 autotools 项目判成绑定语言：libcaca 的 dist 里 python/setup.py 只是可选 SWIG 绑定的打包文件，工具按 'manifest > 构建系统 > 源码统计' 优先命中了它，报 detected_language=python。按 AGENTS.md §1.2'混编项目按主体语言判'，本体是 C（92 个 .c + autotools 顶层 configure），且配方已 --disable-python/ruby/java/csharp，交付物只有 C/C++ 库"
  - "上游示例 examples/conio.c 定义了文件作用域数组 `int move[X_BOARD]`，与 ncurses 为宏函数生成的真实符号 `move`（lib_gen.o 里）撞名：启用 ncurses 后端后示例链接报 duplicate symbol。示例内部状态表应加 static"
  - "C99 起的隐式函数声明按 int 处理返回值：libcaca 的 src/common-image.c 调用返回指针的 _caca_alloc2d() 却不包含声明它的 caca_internals.h，64 位目标上指针被截断（上游在 GCC 上只是 warning，clang 15 的 -Wint-conversion 直接是 error）。这是上游真实缺陷，补声明即可"
  - "libcaca 的 zlib 支持由 AC_CHECK_HEADERS(zlib.h) + AC_CHECK_LIB(z, gzopen) 自动探测且无法关闭：若设备自身 prefix 下有 zlib.h 而配方未声明 zlib 依赖，静态 libcaca.a 会带上无人能解析的 -lz 引用（test_package 链接报 undefined symbol: gzgets/gzopen）。zlib 必须作为 requires 声明并因此向消费者传播"
