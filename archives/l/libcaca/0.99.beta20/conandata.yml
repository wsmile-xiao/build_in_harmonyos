# conandata.yml — libcaca 0.99.beta20
# 官方源：上游仓库 cacalabs/libcaca 自己的 release asset（GitHub API 实证：非 fork、
# 未归档、tag v0.99.beta20、release asset 名 libcaca-0.99.beta20.tar.gz）。
# 必须用 release asset 而非 archive/refs/tags 的自动压缩包：只有 dist tarball 带
# autotools 生成物（预生成的 configure），而 OHOS 设备没有 automake/autoconf/
# libtoolize，无法 autoreconf。
# sha256 实测自该官方 tarball（本机 shasum -a 256，与设备侧实拉逐字节一致）
sources:
  url: https://github.com/cacalabs/libcaca/releases/download/v0.99.beta20/libcaca-0.99.beta20.tar.gz
  sha256: 8ad74babc63bf665b0b2378d95b4da65b7493c11bd9f3ac600517085b0c4acf2

patches:
  # src/common-image.c（cacaview/img2txt 共用的图像读取代码）调用 `_caca_alloc2d()`，
  # 但只包含了 "caca.h" 与 "common-image.h"，**没有**包含声明它的 caca/caca_internals.h
  # （第 263 行 `extern void *_caca_alloc2d(size_t, size_t, size_t);`）。
  # 这是上游的真实缺陷，不只是编译器严格性问题：C99 起的隐式函数声明按 int 处理返回值，
  # 而 `_caca_alloc2d` 返回的是指针——在 64 位目标上指针被截断为 32 位后再赋给
  # `im->pixels`（char*），属未定义行为。上游在 GCC 上只是 warning，clang 15 起
  # int→pointer 转换是硬错误（`-Wint-conversion`），因此在 OHOS/clang 15 上编译中断。
  # 修法是补上声明（AM_CPPFLAGS 已含 -I$(top_srcdir)/caca，无需改构建文件）；
  # 除声明外不含任何行为改动。
  "0.99.beta20":
    - patch_file: "patches/0001-src-common-image-declare-caca_alloc2d.patch"
      patch_description: "Include caca_internals.h in src/common-image.c so the _caca_alloc2d() call is a proper declaration instead of an implicit int-returning one (truncates the pointer on 64-bit targets; hard error under clang 15)"
      patch_type: "portability"
    # examples/conio.c（示例程序 conio 自己的 TU）在文件作用域定义了一张名为 `move`
    # 的全局数据表：`int move[X_BOARD] = {3, 4, 2, 5, 1, 6, 0, 7};`，名字与 ncurses 的
    # `move()` 冲突——ncurses 为宏实现的光标函数生成真实符号（lib_gen.o 内即有 `move`），
    # 本配方启用了 ncurses 后端，示例程序因此链接到两份 `move`：
    #   ld.lld: error: duplicate symbol: move
    #   >>> defined at conio.c:76  conio.o:(move)
    #   >>> defined at lib_gen.c    lib_gen.o:(.text+0x488) in archive libncursesw.a
    # 该数组是本示例内部的状态表（`grep -rn '\bmove\b' examples/*.c` 实证除 conio.c
    # 自身外无任何引用），补 `static` 把符号可见性收窄到本 TU，语义等价，
    # 不改变示例行为。
    - patch_file: "patches/0002-examples-conio-static-move.patch"
      patch_description: "Make examples/conio.c's file-scope `move` table static: it is an example-local helper whose name collides with ncurses's move() symbol, causing a duplicate-symbol link error"
      patch_type: "portability"
