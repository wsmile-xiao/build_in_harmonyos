# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libcaca/0.99.beta20
homepage: "https://github.com/cacalabs/libcaca"

# 上游测试入口：顶层 `make check` 递归到 caca/t（caca/Makefile.am: SUBDIRS = . t）
upstream_check_command: "make check"

# conanfile.py build() 中已集成上游测试（OHOS 分支 _build_ohos 内执行 make check）
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序（来源：caca/t/Makefile.am 的 TESTS 变量）
upstream_tests:
  - file: caca/t/simple.c
    source: libcaca-0.99.beta20.tar.gz
    description: "C 程序：真实调用 libcaca API 的冒烟测试，链接 ../libcaca.la"
    command: "./simple"
  - file: caca/t/check-copyright
    source: libcaca-0.99.beta20.tar.gz
    description: "shell 检查：每个源文件都带版权头"
    command: "./check-copyright"
  - file: caca/t/check-source
    source: libcaca-0.99.beta20.tar.gz
    description: "shell 检查：源文件卫生（无 CRLF/制表符缩进等）"
    command: "./check-source"
  - file: caca/t/check-win32
    source: libcaca-0.99.beta20.tar.gz
    description: "shell 检查：Win32 构建文件与源文件列表保持一致"
    command: "./check-win32"
  - file: caca/t/caca-test.cpp
    source: libcaca-0.99.beta20.tar.gz
    description: >-
      cppunit 单元测试入口（随 canvas.cpp/dirty.cpp/driver.cpp/export.cpp
      编入，共 12 个 CPPUNIT_TEST 用例）。由 --enable-cppunit + cppunit/1.15.1
      test_requires 启用；TESTS 中登记为 caca-test。
    command: "./caca-test"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libcaca.c
    description: >-
      消费者功能测试：对安装后的 libcaca 真实调用版本查询、画布几何、
      字符/属性往返、dirty 矩形计数、导出编码器列表、caca 原生导出/导入
      编解码往返、RGBA 位图 dithering 渲染，共 18 项断言，失败即非零退出
    command: "./test_libcaca"

# 测试断言总数（近似值，用于质量评估）：上游 cppunit 12 个用例 + 上游 3 个
# shell 检查 + 上游 simple 程序 + test_package 18 项断言
assertion_count: 33
