package: lensfun-tools/0.3.4
homepage: "https://lensfun.github.io/"

# Upstream suite (counted on the unpacked v0.3.4 source):
#   14 test case functions in 7 glib programs = 8 CTest registrations
#   (Database, Modifier, Modifier_color, Modifier_subpix,
#    Modifier_coord_scale, Modifier_coord_distortion, Modifier_coord_geometry,
#    Database_integrity)
# They drive the lensfun LIBRARY API, not the apps/ tools this package ships.
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests_total: 14
upstream_tests_run: 0
upstream_tests:
  - file: "tests/test_database.cpp"
    source: "lensfun-0.3.4/tests/test_database.cpp"
    description: "test_DB_lens_search, test_DB_cam_search — lfDatabase camera/lens lookups (library API)"
    command: "test_database"
  - file: "tests/test_modifier.cpp"
    source: "lensfun-0.3.4/tests/test_modifier.cpp"
    description: "test_mod_projection_center, test_mod_projection_borders — lfModifier projection (library API)"
    command: "test_modifier"
  - file: "tests/test_modifier_color.cpp"
    source: "lensfun-0.3.4/tests/test_modifier_color.cpp"
    description: "test_mod_color, test_mod_color_parallel — lfModifier colour model (library API)"
    command: "test_modifier_color"
  - file: "tests/test_modifier_coord_distortion.cpp"
    source: "lensfun-0.3.4/tests/test_modifier_coord_distortion.cpp"
    description: "test_mod_coord_distortion, test_mod_coord_distortion_parallel (library API)"
    command: "test_modifier_coord_distortion"
  - file: "tests/test_modifier_coord_geometry.cpp"
    source: "lensfun-0.3.4/tests/test_modifier_coord_geometry.cpp"
    description: "test_mod_coord_geometry, test_mod_coord_geometry_parallel (library API)"
    command: "test_modifier_coord_geometry"
  - file: "tests/test_modifier_coord_scale.cpp"
    source: "lensfun-0.3.4/tests/test_modifier_coord_scale.cpp"
    description: "test_mod_coord_scale, test_mod_coord_scale_parallel (library API)"
    command: "test_modifier_coord_scale"
  - file: "tests/test_modifier_subpix.cpp"
    source: "lensfun-0.3.4/tests/test_modifier_subpix.cpp"
    description: "test_mod_subpix, test_mod_subpix_parallel (library API)"
    command: "test_modifier_subpix"

upstream_test_evidence: "14/14 rows NOT_RUN, technical cause (not a PASS): tests/ is gated by upstream OPTION(BUILD_TESTS ... OFF) and the recipe sets BUILD_TESTS=False because this package delivers only the apps/ tools plus the lens database (package() drops include/lib); apps/ carries no add_test target and no test source, so the tools subpackage has no upstream test entry point. Only test_database/Database_integrity touch the database data this package does ship, and that surface is covered by test_package assertions 4-5 (packaged share/lensfun/version_1 loads and answers a camera/lens query)."

test_package_tests:
  - file: test.sh
    description: "Run the packaged lenstool (--version, --help), lensfun-add-adapter --help (python3 + packaged lensfun module via PYTHONPATH), and a camera/lens lookup that loads the packaged lens database (asserts the LF_NO_DATABASE error is absent)"
    command: "./test.sh"

assertion_count: 5
