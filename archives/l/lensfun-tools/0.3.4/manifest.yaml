version: "0.3.4"
software: lensfun-tools
status: built
build_date: "2026-09-20"
build_system: cmake

source:
  url: "https://github.com/lensfun/lensfun/archive/refs/tags/v0.3.4.tar.gz"
  sha256: "dafb39c08ef24a0e2abd00d05d7341b1bf1f0c38bfcd5a4c69cf5f0ecb6db112"
  tar_format: tar.gz

build:
  system: cmake
  outputs:
    - "bin/lenstool"
    - "bin/lensfun-update-data"
    - "bin/lensfun-add-adapter"
    - "bin/g-lensfun-update-data"
    - "share/lensfun/version_1 (lens database)"
    - "share/lensfun/python/lensfun (helper python module)"
  dependencies: ["glib2/2.88.0.1", "libpng/1.6.39"]

tests:
  upstream_tests: 14
  upstream_test_unit: "test case functions (tests/ holds 7 glib programs / 8 CTest registrations; counted as the 14 test_* case functions they contain)"
  upstream_test_names:
    - "test_database: test_DB_lens_search, test_DB_cam_search"
    - "test_modifier: test_mod_projection_center, test_mod_projection_borders"
    - "test_modifier_color: test_mod_color, test_mod_color_parallel"
    - "test_modifier_coord_distortion: test_mod_coord_distortion, test_mod_coord_distortion_parallel"
    - "test_modifier_coord_geometry: test_mod_coord_geometry, test_mod_coord_geometry_parallel"
    - "test_modifier_coord_scale: test_mod_coord_scale, test_mod_coord_scale_parallel"
    - "test_modifier_subpix: test_mod_subpix, test_mod_subpix_parallel"
  upstream_test_run: 0
  upstream_test_pass_rate: "0/14 executed — NOT_RUN with technical cause (see upstream_test_reason); not counted as PASS"
  upstream_test_reason: "Upstream tests/ drives the lensfun library API (lfFixture/lfModifier/lfDatabase), not the apps/ tools this package ships; BUILD_TESTS is OFF by upstream default and explicitly disabled by the recipe, and apps/ carries no add_test target and no test source, so the tools subpackage has no upstream test entry point. Only test_database/Database_integrity touch the lens database data this package does ship, and that surface is covered by test_package assertions 4-5."
  added_consumer_scenarios: 3
  added_consumer_assertions: 5
