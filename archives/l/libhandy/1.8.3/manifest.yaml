software: libhandy
version: "1.8.3"

status: built

build_date: "2026-09-03"
conan_ref: "libhandy/1.8.3"

source:
  url: "https://download.gnome.org/sources/libhandy/1.8/libhandy-1.8.3.tar.xz"
  sha256: "05b497229073ff557f10b326e074c5066f8743a302d4820ab97bcb5cd2dab087"
  tar_format: tar.xz

build:
  system: meson

  configure_options:
    - "-Dwrap_mode=nodownload"
    - "-Dintrospection=disabled"
    - "-Dvapi=false"
    - "-Dglade_catalog=disabled"
    - "-Dgtk_doc=false"
    - "-Dtests=true"
    - "-Dexamples=false"

  dependencies:
    - "glib/2.84.0.1"
    - "gtk/3.24.43"
    - "fribidi/1.0.16"

  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libhandy 为 evince 48.4 的硬依赖（meson.build hdy_dep 无 required 开关）"
  - "glib-mkenums 是 python 脚本，OHOS worker 的 SDK lld 缺 libxml2.so.16，须用零编译 sh 包装器启动而非链接 ELF"
  - "fribidi 头文件在 include/fribidi/ 子目录，须修正 PkgConfigDeps 生成的 fribidi.pc Cflags"
  - "OHOS Meson 构建缺失共享库 SONAME/链接名别名，需复制生成 libhandy-1.so.0 与 libhandy-1.so"
