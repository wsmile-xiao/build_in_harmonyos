package: libhandy/1.8.3
homepage: "https://gitlab.gnome.org/GNOME/libhandy"

upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test"

upstream_tests:
  - file: tests/meson.build
    source: libhandy-1.8.3/tests/meson.build
    description: "30 Meson test executables covering widgets (action-row, avatar, carousel, deck, flap, leaflet, etc.), style-manager, swipe-group, tab-view, value-object, view-switcher, window"
    command: "meson test"

test_package_tests:
  - file: test.c
    description: "Consumer check: includes handy.h, prints version, calls hdy_init()"
    command: "./test_libhandy"

assertion_count: 3
