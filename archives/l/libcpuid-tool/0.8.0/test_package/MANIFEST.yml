# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libcpuid-tool/0.8.0
homepage: "https://github.com/anrieff/libcpuid"

# 上游测试命令：tests/run_tests.py 回放套件（--load 喂 raw dump，宿主 CPU 无关）
upstream_check_command: "python3 tests/run_tests.py <cpuid_tool> tests/ (cmake targets test-fast/test-old wrap the same suite)"
upstream_test_in_build: false
upstream_test_command: "python3 tests/run_tests.py <cpuid_tool> tests/ (subprocess-only driver on OHOS: device python 3.12.9 os.popen is broken, see notes.md)"

# 上游实际运行的测试（489 个 .test/.test.xz 文件，每文件一个用例；
# 逐文件结果见 PR 说明与任务证据 upstream-suite-run.log）
upstream_tests:
  - file: tests/run_tests.py
    source: libcpuid-0.8.0/tests
    description: "回放套件驱动：解析每文件 raw-dump 输入与期望输出分段，按 --load 重放并与 --outfile 逐行比较（x86 34 字段/ARM 12 字段两套字段表）"
    result: "489/489 files OK, 0 failed (OHOS aarch64 真机, 补丁已应用)"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "在目标机执行打包出的 cpuid_tool：--version 必须输出 0.8.0；--report 必须产出非空 CPU 报告"
    command: "bash test.sh (conanrun env)"

# 测试断言总数
assertion_count: 2
# 计数口径：test.sh 中两处判定（--version 输出含 0.8.0、--report 非空），与
# 0.8.0/manifest.yaml 的 test_package_assertions 一致
