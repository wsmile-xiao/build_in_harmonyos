sources:
  "0.8.0":
    url: "https://github.com/anrieff/libcpuid/archive/refs/tags/v0.8.0.tar.gz"
    sha256: "a5fe37d79bda121cbdf385ae3f6fa621da6a3102aa609400a718a4b8b82ed8aa"
patches:
  "0.8.0":
    - patch_file: "patches/0001-cpuid_main-raw-data-zeroing.patch"
      patch_type: bugfix
      strip: 1
      patch_description: "Zero the raw data struct in cpuid_get_raw_data() so ARM raw reads cannot inherit stale bytes and misdetect the architecture"
    - patch_file: "patches/0002-recog_arm-core-counts.patch"
      patch_type: bugfix
      strip: 1
      patch_description: "Fill num_cores/num_logical_cpus/total_logical_cpus in cpuid_identify_arm() from OS APIs, which upstream leaves unset on ARM"
    - patch_file: "patches/0003-rdtsc-arm-clock-detection.patch"
      patch_type: bugfix
      strip: 1
      patch_description: "Extend cpu_clock_by_os() with ARM BogoMIPS and sysfs cpufreq fallbacks so the OS clock report also works without x86 cpu MHz lines"
