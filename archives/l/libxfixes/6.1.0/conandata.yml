# 版本语义说明：Conan 包版本 6.1.0 采用 soname ABI 版本（libXfixes.so.6.1.0），
# 与同仓 libxext/6.4.0（upstream 1.3.6）的约定一致；上游源码版本为 6.0.1。
sources:
  "6.1.0":
    # Conan historical package version 6.1.0 maps to the libXfixes.so.6 soname ABI (upstream 6.0.1).
    # The matching upstream source release is libXfixes 6.0.1.
    upstream_version: "6.0.1"
    # 换源：releases 路径在 CI worker 连接超时（ConnectTimeoutError）；
    # archive 路径与同仓 libx11/6.4.0 先例一致（该路径 CI 已验证可达）。
    url: "https://xorg.freedesktop.org/archive/individual/lib/libXfixes-6.0.1.tar.xz"
    sha256: "b695f93cd2499421ab02d22744458e650ccc88c1d4c8130d60200213abc02d58"

patches: {}
