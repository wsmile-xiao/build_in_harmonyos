package: libxfixes/6.0.1
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxfixes"

# 上游测试现状（实测，未美化）：
#   libXfixes 6.0.1 的 Makefile.am 只有 `SUBDIRS = src man`，src/Makefile.am 与
#   man/Makefile.am 均没有声明 check_PROGRAMS / TESTS / XORG_ENABLE_UNIT_TESTS，
#   因此 `make check` 输出 "Nothing to be done for 'check'" —— 上游 0 个测试用例。
#   配方仍执行 `make check`（不跳过入口），实测 rc=0、0 PASS / 0 FAIL / 0 SKIP。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []          # 上游未提供任何测试用例（实测）
upstream_test_count: 0

test_package_tests:
  - file: test.c
    description: |
      链接 libXfixes 并驱动 XFIXES 客户端 API：
      1) 头文件版本契约 XFIXES_MAJOR/MINOR/REVISION + XFIXES_VERSION 计算；
      2) 线协议常量 X_XFixesQueryVersion / XFixesNumberEvents /
         XFixesNumberErrors / XFixesSetSelectionOwnerNotifyMask /
         XFixesDisplayCursorNotifyMask；
      3) 33 个 libXfixes 导出符号取地址（真实链接被测包，缺符号即链接失败）；
      4) XFixesVersion() 运行期返回值与头文件宏一致；
      5) XFixesCursorImage / XFixesSelectionNotifyEvent 结构体字段读写；
      6) 有 X server 时额外调用 XFixesQueryExtension + XFixesQueryVersion，
         无 server 时按 Xlib 契约断言 XOpenDisplay 返回 NULL（鸿蒙沙箱常态）。
    command: "test_libxfixes"

assertion_count: 12         # 6 组断言 + 33 个符号非空检查中的循环断言
