package: "libxfixes/6.0.2"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxfixes"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The release Makefile.am files declare no TESTS, check_PROGRAMS,
  check-local, or custom test target, and meson.build has no test() call.

test_package_tests:
  - id: "public-api-surface"
    source: "api_surface.c"
    command: "libxfixes_api_surface"
    description: >-
      Force a live typed relocation for every one of the 37 public functions,
      then call the display-independent XFixesVersion API.
  - id: "version-and-abi-contract"
    source: "version_contract.c"
    command: "libxfixes_version_contract"
    description: >-
      Validate the public protocol/version constants and public ABI types,
      then require the runtime version value to match the installed headers.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 56
