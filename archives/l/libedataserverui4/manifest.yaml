software: libedataserverui4
display: "libedataserverui4"
description: "Evolution-Data-Server 的 GTK4 UI 便捷库（libedataserverui4-1.0，含 EDS 私有共享库 libcamel/libecal/libedataserver/libedbus-private）"
category: core
homepage: "https://gitlab.gnome.org/GNOME/evolution-data-server"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "libedataserverui4 不是独立源码包：源码 = 官方 evolution-data-server release tarball 的 src/libedataserverui（CMake target edataserverui4）"
    - "同来源树的内部库 camel/ecal/edataserver/edbus-private 未在 ohpcd 单独发布，故整树构建并随本包一起打包"
    - "只出 GTK4 形态（ENABLE_GTK4=ON / ENABLE_GTK=OFF）；WebKitGTK/libgweather/libcanberra 未发布故关闭"
    - "libsoup3 必须 3.6.5-r3：r1/r2 静态内嵌 glib2 的 GObject 并与 gtk4 共享 glib 冲突（cannot register existing type 'gchar'）"
    - "libical3/3.0.20 提供 libical-glib（ohpcd 的 libical/4.0.1 关闭 GLIB 绑定）；其共享库 SONAME 为相对路径，故改用其静态归档"
    - "CMake 缺 Platform/HarmonyOS 模块导致共享库无 SONAME，配方显式注入 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG"
    - "两个上游可移植性补丁：camel-debug.c 标签后声明（clang 报错）、CAMEL 链接时 sqlite3 需先于 nss（避开 nss 内裁剪版 libsqlite3.so）"
  common_dependencies:
    - "glib"
    - "gtk4"
    - "libsoup3"
    - "libical3"
    - "nss"
    - "libsecret"

versions:
  "3.60.2":
    status: built
    build_date: "2026-10-09"
