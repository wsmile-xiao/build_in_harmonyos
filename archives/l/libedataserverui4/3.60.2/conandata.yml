# libedataserverui4 is not a standalone source package: it is the GTK4 UI
# convenience library (CMake target `edataserverui4`) shipped inside the
# evolution-data-server source tree. There is no separate tarball upstream,
# so this recipe consumes the official evolution-data-server release.
sources:
  url:
    - "https://mirrors.ustc.edu.cn/gnome/sources/evolution-data-server/3.60/evolution-data-server-3.60.2.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/gnome/sources/evolution-data-server/3.60/evolution-data-server-3.60.2.tar.xz"
    - "https://mirror.nju.edu.cn/gnome/sources/evolution-data-server/3.60/evolution-data-server-3.60.2.tar.xz"
    - "https://download.gnome.org/sources/evolution-data-server/3.60/evolution-data-server-3.60.2.tar.xz"
  sha256: "2084dbdac396371b365d504c1ff45866ba8dca2f1252e5da1d3d9c33abdc1286"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Prefer the real sqlite3 over the NSS bundled stub: the nss package ships a libsqlite3.so that does not export sqlite3_vfs_find/sqlite3_vfs_register/sqlite3_release_memory while the standalone sqlite3 is a static archive; pkg-config emits -L in module order, so sqlite3 has to be listed before nss or camel-db.c fails to link."
    patch_type: "portability"
  - patch_file: "patches/0002-src-camel-camel-debug.c.patch"
    patch_description: "Move the declarations of backtrace_matches() above the try_next_frame label: a label followed by a declaration is not valid C (clang: 'expected expression'), GCC only accepted it as an extension."
    patch_type: "portability"
