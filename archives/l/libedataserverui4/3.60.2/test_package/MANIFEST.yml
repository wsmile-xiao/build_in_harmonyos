# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# libedataserverui4 3.60.2 = evolution-data-server 源码树中的 GTK4 UI 便捷库
# (CMake target edataserverui4, 输出 libedataserverui4-1.0.so)。

package: libedataserverui4/3.60.2
homepage: "https://gitlab.gnome.org/GNOME/evolution-data-server"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --output-on-failure  (-DENABLE_TESTS=ON)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: >-
  conan create . -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=missing
  （build() 末尾以 ENABLE_TESTS=ON 编译并用 ctest 执行上游测试套件；
    完整输出落在 <build_folder>/Testing/Temporary/LastTest.log）

# 上游测试清点 (2026-10-11 实测)
#   测试框架: GLib g_test
#   ctest 测试程序数: 101（add_installable_test() + build_only_installable_test()
#                          在各自 CMakeLists 的 foreach 中展开后的可执行数量）
#   g_test 注册用例数: 506 = tests/ 453 + src/ 53
#     tests/ 8 个子目录: libecal 113 / libedata-book 91 / libebook 86 /
#                        libebook-contacts 83 / libedata-cal 60 / libedataserver 14 /
#                        test-server-utils 4 / book-migration 2
#     src/ 内嵌测试（camel 等）: 53
#   （口径说明: ctest -N 显示的是"测试程序数"101；每个程序内部注册多个用例，
#     静态注册合计 506，数据驱动展开后单次运行执行 1000+ 个 TAP 用例）
#
# 实测执行结果 (2026-10-11, HarmonyOS PC aarch64, conan create 内实跑):
#   101/101 个测试程序全部真实执行（0 跳过），100 通过 / 1 失败 → 通过率 99.0%
#   失败 1 项: test-book-client-photo-is-uri
#     具体技术原因: 地址簿后端在把内嵌照片转写为文件时被 HMDFS/SELinux 拒绝 ——
#     "e-book-backend-file-WARNING ...: Error transforming contact ...:
#      Permission denied"，随后
#     "Failed to modify contact with cross referenced photo: Cannot modify
#      contacts: Permission denied"。这是平台文件系统权限限制（E046），
#     不是库的功能缺陷；同一后端在 test-book-cache-* 等 20 余个用例中均正常。
#
# 运行该套件所需的平台适配（配方已实现，见 conanfile.py 的
# _run_upstream_tests() / DBUS_WRAPPER / FAKEPW_C）:
#   1. 上游测试是服务端集成测试：GLib 的 GTestDBus 会拉起私有 D-Bus 会话总线，
#      再由 evolution-*-factory 三个 D-Bus 服务驱动库的进程外 API。
#   2. HarmonyOS PC 的 /tmp 为只读文件系统，且 unix socket 只能建在
#      /data/storage/el2/base/cache 下，而 GTestDBus 在它写出的总线配置里硬编码
#      "<listen>unix:tmpdir=/tmp</listen>" → 配方用一个 dbus-daemon 包装脚本改写
#      该行后再 exec 真正的 dbus-daemon（经 G_TEST_DBUS_DAEMON 注入）。
#   3. 平台没有构建 uid 的 passwd 记录，dbus-daemon/GLib 会
#      "getpwuid_r(): failed due to unknown user id" 而中止 → 配方编译一个
#      极小的 getpwuid 垫片，经 LD_PRELOAD 提供合成条目。
upstream_tests:
  - file: tests/CMakeLists.txt
    source: evolution-data-server-3.60.2/tests/CMakeLists.txt
    description: "定义 add_installable_test()/build_only_installable_test() 宏"
    result: "PASS — 以 -DENABLE_TESTS=ON 构建并在 build() 中经 ctest 执行"
  - file: tests/test-server-utils
    source: evolution-data-server-3.60.2/tests/test-server-utils
    description: "共享测试夹具 etestserverutils：启动私有 D-Bus 会话与 EDS D-Bus 服务"
    result: "PASS — 夹具在本平台启动成功（dbus-daemon shim + getpwuid 垫片）"
  - file: tests/libedataserver
    source: evolution-data-server-3.60.2/tests/libedataserver
    description: "libedataserver 测试（libedataserver-test / e-collator-test 等，14 个 g_test 用例）"
    result: "PASS"
  - file: tests/libecal
    source: evolution-data-server-3.60.2/tests/libecal
    description: "libecal 集成测试（113 个 g_test 用例）"
    result: "PASS"
  - file: tests/libedata-book
    source: evolution-data-server-3.60.2/tests/libedata-book
    description: "libedata-book 后端集成测试（91 个 g_test 用例）"
    result: "PASS"
  - file: tests/libedata-cal
    source: evolution-data-server-3.60.2/tests/libedata-cal
    description: "libedata-cal 后端集成测试（60 个 g_test 用例）"
    result: "PASS"
  - file: tests/libebook
    source: evolution-data-server-3.60.2/tests/libebook
    description: "libebook 集成测试（86 个 g_test 用例；其中 photo-is-uri 见下）"
    result: "PARTIAL — 仅 test-book-client-photo-is-uri 失败（HMDFS 权限，见上）"
  - file: tests/libebook-contacts
    source: evolution-data-server-3.60.2/tests/libebook-contacts
    description: "libebook-contacts 测试（83 个 g_test 用例）"
    result: "PASS"
  - file: tests/book-migration
    source: evolution-data-server-3.60.2/tests/book-migration
    description: "地址簿迁移测试（2 个 g_test 用例，build-only 目标）"
    result: "PASS"
  - file: src/ (camel 等内嵌 g_test 测试)
    source: evolution-data-server-3.60.2/src
    description: "src/ 内嵌 GLib g_test 测试（53 个用例，随构建注册到 ctest）"
    result: "PASS"

# test_package 中自带的测试 (消费者视角验证, 真实调用被测库 API)
test_package_tests:
  - file: src/test_libedataserverui4.c
    description: >-
      链接 libedataserverui4-1.0.so（经 pkg-config libedataserverui4-1.0）并真实调用
      公开 API：8 个公开类的 GType 注册（ECredentialsPrompter /
      ECredentialsPrompterImpl / ECredentialsPrompterImplPassword /
      ECellRendererColor / ECertificateWidget / ERemindersWidget /
      EWebDAVDiscoverDialog / EWebDAVDiscoverContent，校验 GObject 基类与
      GtkWidget/GtkCellRenderer 基类），再实例化 ECellRendererColor 并用
      E_IS_CELL_RENDERER_COLOR()/GTK_IS_CELL_RENDERER() 校验后 g_object_unref()
    command: "./test_libedataserverui4"
  - file: CMakeLists.txt
    description: >-
      pkg_check_modules(libedataserverui4-1.0) 消费并断言生成的 .pc 版本号与产物
      一致（EDS_UI_VERSION == 3.60.2）
    command: "cmake --build ..."
  - file: conanfile.py
    description: >-
      消费者侧 PkgConfigDeps + CMake 构建, 再用 conanrun 环境变量在目标机
      (HarmonyOS PC aarch64) 执行测试程序
    command: "conan create . -pr:h=ohos-aarch64 -pr:b=ohos-aarch64"

# test_package 断言数（9 个 GType 注册校验 + 3 个实例校验 + 1 个成功出口）
assertion_count: 13
