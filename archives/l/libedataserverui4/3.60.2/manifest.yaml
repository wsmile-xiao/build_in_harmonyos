patches_applied:
  - "0001-CMakeLists.txt.patch: CAMEL 的 pkg_check_modules 内 sqlite3 提前到 nss 之前——nss 包内自带的 libsqlite3.so 是裁剪导出的 stub（无 sqlite3_vfs_find/vfs_register/release_memory），会按 -L 顺序遮蔽独立 sqlite3 静态库，导致 camel-db.c 链接失败"
  - "0002-src-camel-camel-debug.c.patch: backtrace_matches() 中标签 try_next_frame 后紧跟声明，C99/C11 非法（clang: expected expression），把声明上移到标签之前"

knowledge_gained:
  - "libedataserverui4 不是独立源码包：它是 evolution-data-server 源码树 src/libedataserverui 的 GTK4 UI 便捷库（CMake target edataserverui4，产物 libedataserverui4-1.0.so），只能取官方 evolution-data-server release tarball"
  - "gtk4/4.22.4 的 override 把全图 glib 钉在 2.84.0.1.1；配方里若再用普通（非 override）require 声明 glib，会与 pango 的 glib/2.84.0.1 冲突（Conflict originates from pango/1.56.4）"
  - "libsoup3 必须用 3.6.5-r3：r1/r2 的 libsoup-3.0.so 把 glib2/2.88.0 的 GObject 静态内嵌并导出符号，与 gtk4 链的共享 glib 同进程加载即双重类型系统（cannot register existing type 'gchar', SIGABRT）"
  - "ohpcd 的 libical/4.0.1 关闭 LIBICAL_GLIB，无 libical-glib.pc/头文件；libecal 需要 GObject 绑定，只能用 libical3/3.0.20（ICAL_GLIB=ON）"
  - "libical3/3.0.20 的共享库 SONAME 是相对路径 './libical-glib.so'，OHOS loader 按 CWD 解析，消费者 DT_NEEDED 变成 './libical-glib.so' 必然加载失败；改为链接其静态归档"
  - "CMake 无 Platform/HarmonyOS 模块（System is unknown to cmake），Linux 平台变量缺失 → 共享库没有 SONAME，消费者 NEEDED 记录构建树相对路径；需显式注入 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG"
  - "ICU 是静态 C++ 构建：C-only 链接需要 -lc++（undefined symbol: __cxa_begin_catch / std::terminate）"
  - "glib 的 proxy-libintl 提供 g_libintl_* 包装：glib .pc 未列 -lintl，需补，否则 -Wl,--no-undefined 链接失败"
  - "nss 包 shared=False 时 cpp_info 给的是静态 coreconf 名（-lnss 等），不含 NSS API；必须换成 libnss3.so 系共享名"
  - "GLibTools.cmake 的 glib-compile-schemas 在非 CMAKE_CROSSCOMPILING 分支走 pkg_check_variable(gio-2.0 glib_compile_schemas)，conan 生成的 gio-2.0.pc 无该变量 → 需注入"
  - "conan glib/mkenums 等 Python 脚本可运行，但 glib 包内 ELF 工具未签名（OHOS loader 拒绝执行）；hnp 的 gdbus-codegen/glib-mkenums 是 /usr/bin/python3|perl shebang 的坏脚本，glib-compile-resources 缺 libffi.so.8"

