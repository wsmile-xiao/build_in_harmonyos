software: libntfs-3g
display: "libntfs-3g"
description: "NTFS-3G safe read/write driver library (libntfs-3g) and ntfsprogs command-line tools"
category: filesystem
homepage: "https://github.com/tuxera/ntfs-3g"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 git tarball 不含预生成 configure，需 autogen 自举（autoconf/autoheader + tool_requires automake/libtool）"
    - "configure.ac 引用 AM_PATH_LIBGCRYPT / PKG_CHECK_MODULES 外部宏，libgcrypt.m4/pkg.m4 随配方导出并注入 ACLOCAL_PATH"
    - "E052/E114: HMDFS 上 configure 的 `umask 077 && mktemp ./confXXXXXX` 临时目录不可写，移除 umask 077 前缀 + TMPDIR 注入"
    - "fuse 默认 internal（内嵌 libfuse-lite），crypto/uuid 可选缺失自动降级"
    - "ELF 产物统一重签名（鸿蒙要求）"
  common_dependencies: []

versions:
  "2026.7.7":
    status: built
    build_date: "2026-09-15"