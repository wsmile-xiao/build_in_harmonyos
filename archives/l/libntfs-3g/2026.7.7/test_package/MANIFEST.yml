# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 libntfs-3g 2026.7.7 无自带测试（R51 清点证据：
#   1) make check 实测全部子目录 "Nothing to be done";
#   2) 8 个 Makefile.am 均无 TESTS/check_PROGRAMS/check-local 注册;
#   3) GitHub 递归仓库树 test/check/torture/selftest 路径匹配数 0;
#   4) .gitignore 与 configure.ac 无测试钩子)
# 本 test_package 为 OHOS 适配自研的 L1 验证。

package: libntfs-3g/2026.7.7
homepage: "https://github.com/tuxera/ntfs-3g"

# 上游官方测试：无
upstream_official_tests: []
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 适配补全测试（自研，非上游）：test_package 的 L1 消费者验证
adapted_tests:
  - file: test.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：链接 libntfs-3g，调用 ntfs_malloc/ntfs_calloc/ntfs_free 分配、清零、释放堆内存并读写校验，验证库核心内存管理路径与头文件可用"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：ntfs_malloc 分配 1024 字节非空并读写校验、ntfs_free 正常释放、ntfs_calloc 分配成功且清零"
    command: "./test_libntfs-3g"

# 测试断言总数：(4 项自研断言，全部为真实可失败断言：
# 1) ntfs_malloc(1024) 返回非 NULL（失败即 exit 1）；
# 2) memset 写入后首尾字节读回一致（内存可写可读，失败即 exit 1）；
# 3) ntfs_free 正常释放不崩溃（崩溃即失败）；
# 4) ntfs_calloc(64) 分配成功且 64 字节全部清零（任一字节非零即 exit 1）)
assertion_count: 4