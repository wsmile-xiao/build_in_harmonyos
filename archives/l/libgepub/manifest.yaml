software: libgepub
display: "libgepub"
description: "GObject-based library for handling EPUB documents (GNOME)"
category: doc
homepage: "https://gitlab.gnome.org/GNOME/libgepub"
license: LGPL-2.1-or-later
build_system: meson
ohos_adaptation:
  key_points:
    - "Meson build with widget=false: drops the WebKit2GTK GepubWidget and the GTK interactive demo, keeping the headless GepubDoc/GepubArchive/GepubTextChunk core"
    - "introspection=disabled: no gobject-introspection scanner on OHOS"
    - "Shares glib/2.84.0.1.1 with the libsoup3 chain to avoid dual GObject type systems"
  common_dependencies:
    - glib/2.84.0.1.1
    - libsoup3/3.6.5-r3
    - libxml2/2.15.3.1
    - libarchive/3.8.7
versions:
  "0.7.3":
    status: built
    build_date: "2026-09-19"
