package: libgepub/0.7.3
homepage: "https://gitlab.gnome.org/GNOME/libgepub"

upstream_tests_exist: true
upstream_test_audit:
  - source: "libgepub-0.7.3.tar.xz top-level meson.build"
    reason: "subdir('tests') is guarded by if get_option('widget'); this recipe builds with -Dwidget=false so the GTK demo subdir is never configured and meson registers zero test() targets."
  - source: "libgepub-0.7.3.tar.xz tests/meson.build"
    reason: "Builds only executable('test-gepub', ...) with zero test() calls (upstream commit 'test-gepub is not considered an unattended test anymore'); 'meson test' discovers 0 cases."
  - source: "libgepub-0.7.3.tar.xz tests/test-gepub.c main()"
    reason: "main() runs 7 TEST() cases (test_open/read/root_file/doc_name/doc_resources/doc_spine/doc_toc) exercising only GepubArchive/GepubDoc, wrapped in a gtk_init + gepub_widget_new (WebKit) + gtk_main display harness that cannot run on OHOS."
  - source: "libgepub-0.7.3.tar.xz tests/test-gepub.c helpers"
    reason: "The 7 test_* bodies + find_xhtml/pk use only glib/libgepub (list_files, read_entry, root_file, metadata, resources, spine, toc); GTK calls live only in update_text/button_pressed/widget/window code, which the headless port excludes."
  - conclusion: "Upstream 0.7.3 has 7 runnable TEST() cases hidden inside a display harness. Adaptation ports exactly those 7 bodies to test_package/upstream_headless.c (PTEST->printf, plus PASS/FAIL assertions so failures exit 1) and runs them headlessly against an offline synthetic EPUB; meson test() count stays 0 by upstream design."

upstream_check_command: "meson test -C builddir"
upstream_test_in_build: false
upstream_test_command: "./upstream_headless book.epub (headless port of tests/test-gepub.c 7 TESTs)"
upstream_tests:
  - file: tests/test-gepub.c
    source: libgepub-0.7.3.tar.xz/tests/test-gepub.c::test_open
    description: "Upstream TEST test_open: archive enumeration over the EPUB"
    command: "./upstream_headless book.epub"
  - file: tests/test-gepub.c
    source: libgepub-0.7.3.tar.xz/tests/test-gepub.c::test_read
    description: "Upstream TEST test_read: find xhtml resource + read_entry contains fixture paragraph"
    command: "./upstream_headless book.epub"
  - file: tests/test-gepub.c
    source: libgepub-0.7.3.tar.xz/tests/test-gepub.c::test_root_file
    description: "Upstream TEST test_root_file: rootfile resolves to content.opf"
    command: "./upstream_headless book.epub"
  - file: tests/test-gepub.c
    source: libgepub-0.7.3.tar.xz/tests/test-gepub.c::test_doc_name
    description: "Upstream TEST test_doc_name: doc metadata title/author"
    command: "./upstream_headless book.epub"
  - file: tests/test-gepub.c
    source: libgepub-0.7.3.tar.xz/tests/test-gepub.c::test_doc_resources
    description: "Upstream TEST test_doc_resources: resource hash + ncx bytes"
    command: "./upstream_headless book.epub"
  - file: tests/test-gepub.c
    source: libgepub-0.7.3.tar.xz/tests/test-gepub.c::test_doc_spine
    description: "Upstream TEST test_doc_spine: spine walk yields >=1 chapter id"
    command: "./upstream_headless book.epub"
  - file: tests/test-gepub.c
    source: libgepub-0.7.3.tar.xz/tests/test-gepub.c::test_doc_toc
    description: "Upstream TEST test_doc_toc: TOC navpoint label + uri-to-chapter mapping"
    command: "./upstream_headless book.epub"

test_package_tests:
  - file: test.c
    description: "Headless consumer test over real API: GepubTextChunk create/type/text roundtrip (A+B), GepubArchive enumeration + rootfile on a synthetic EPUB (C), GepubDoc metadata + chapters (D), text extraction (E), TOC + spine mapping (F)"
    command: "./test_libgepub book.epub"
  - file: upstream_headless.c
    description: "Headless port of the 7 upstream TEST() cases (same GepubArchive/GepubDoc paths, GTK/webkit harness excluded, PASS/FAIL assertions added)"
    command: "./upstream_headless book.epub"
  - file: make_book.py
    description: "Offline fixture generator (stdlib zipfile only): standard EPUB2 with container.xml, content.opf, one chapter and one NCX navPoint"
    command: "python3 make_book.py book.epub"

assertion_count: 23
assertion_count_basis:
  test_package_consumer: 16
  upstream_headless_port: 7
  text_chunk_core: 3
  text_chunk_variants: 3
  archive: 2
  doc_metadata: 4
  doc_text: 2
  doc_toc: 2
