# libgepub 0.7.3 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "0.7.3"

software: libgepub

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GNOME 源）
  url: "https://download.gnome.org/sources/libgepub/0.7/libgepub-0.7.3.tar.xz"

  # 源码校验和（download.gnome.org 官方 .sha256sum）
  sha256: "5a56695aa8a9132d67c0792a40f252ce0a48d9d032b4e1a8a6ce98af14fd5e1b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dwidget=false"
    - "-Dintrospection=false"
    - "-Ddefault_library=shared"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0.1.1
    - libsoup3/3.6.5-r3
    - libxml2/2.15.3.1
    - libarchive/3.8.7

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无源码补丁（headless 核心无需 OHOS 特有修改）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libgepub 0.7.3 上游 tests/test-gepub.c 有 7 个 TEST()（test_open/read/root_file/doc_name/doc_resources/doc_spine/doc_toc），仅用 GepubArchive/GepubDoc；外层 gtk/webkit/display harness 无法上 OHOS，meson test() 注册为 0 是上游设计（'not considered an unattended test'），按无头移植口径执行 7/7"
  - "必须与 libsoup3 链共用 glib/2.84.0.1.1 shared：双 GObject 类型系统会导致 cannot register existing type SIGABRT（libsoup3 r3 同款教训）"
  - "meson install 会改写 .so 的 DT_RUNPATH 使 OHOS .codesign 校验失败（dlopen Permission denied），package() 用构建树原始链接产物覆盖（libsoup3 同款修复）"
  - "gepub.h 用尖括号包含 <config.h>，消费者需要 -I include/libgepub-0.7；package_info 显式声明该 includedir"
