software: librist
version: "0.2.18"
status: prepared
build_date: "2026-09-16"
build_system: meson
homepage: "https://code.videolan.org/rist/librist"
license: BSD-2-Clause

source:
  url: "https://code.videolan.org/rist/librist/-/archive/v0.2.18/librist-v0.2.18.tar.gz"
  sha256: "9a2d16dcdb9fb067b7ba4259a3976ff6f8df9a62dbec7f32f19a0b60ec0c114a"
  tar_format: tar.gz
  note: "官方 videolan archive。sha256 取自 Homebrew homebrew-core Formula/lib/librist.rb（同文件 VLC contrib 记录 SHA512 f561e48b…，算法不同指向同一归档），CI 下载后以 conandata 校验为准。"

build:
  system: meson
  configure_options:
    - "-Ddefault_library=shared"
    - "-Dbuiltin_cjson=true"
    - "-Dbuiltin_mbedtls=true"
    - "-Duse_mbedtls=true"
    - "-Duse_gnutls=false"
    - "-Dbuilt_tools=false"
    - "-Duse_tun=false"
    - "-Dfallback_builtin=true"
    - "-Dstatic_analyze=false"
    - "-Dtest=true"
  dependencies: []
  test_dependencies:
    - "cmocka/2.0.2 (test_requires，仅 srp_unit 单元测试)"
  cc: clang

patches_applied: []

upstream_tests:
  status: pending
  framework: "meson-test"
  expected_cases: 27
  command: "meson test -C <build_folder> --print-errorlogs"
  note: "test/rist/meson.build 注册约 26 项 test_send_receive 收发测试（simple 单播 3＋组播 3，main profile NPD/收发/加密/SRP 约 20，含 8 项 should_fail 反向用例）＋ test/rist/unit/meson.build 注册 1 项 srp_unit（需 cmocka）。确切数字以真机预检 meson test 实测为准，PR 正文回填实测值。"

adapted_tests:
  status: prepared
  cases: 2
  command: "clang test_sender.c -lrist && ./test_librist_sender ; clang test_receiver.c -lrist && ./test_librist_receiver"
  note: "消费者视角验证库可链接可用：sender 生命周期（版本＋创建销毁）、receiver 生命周期（创建＋URL 解析＋释放）。"
