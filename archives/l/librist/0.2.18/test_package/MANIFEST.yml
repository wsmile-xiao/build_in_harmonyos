package: librist/0.2.18
homepage: "https://code.videolan.org/rist/librist"

# 上游测试审计
# librist 0.2.18 官方发布包（sources.url 的 videolan archive tarball）
# 含完整 test/ 目录：test/meson.build 注册 test_send_receive 收发测试
# （simple profile 单播 3 项 + 组播 3 项；main profile NPD/收发/加密/
# SRP 约 20 项），test/rist/unit/meson.build 注册 srp_unit 单元测试
# （需 cmocka + mbedtls SRP 支持）。配方以 -Dtest=true 开启上游测试，
# build() 内 `meson test -C <build_folder> --print-errorlogs` 完整执行，
# 组播用例在受限沙箱若失败将在真机预检如实上报（参考 Gentoo ebuild
# 以 --no-suite multicast 规避 network-sandbox 的先例，需真机证据定夺）。
upstream_tests_exist: true

upstream_check_command: "meson test --list"
upstream_test_in_build: true
upstream_test_command: "meson test -C <build_folder> --print-errorlogs"

upstream_tests:
  - file: test/rist/meson.build
    source: "librist-v0.2.18/test/rist/meson.build"
    description: "test_send_receive 收发测试：simple profile 单播 3 项（0/10%/25% 丢包）"
    command: "meson test"
  - file: test/rist/meson.build
    source: "librist-v0.2.18/test/rist/meson.build"
    description: "test_send_receive 收发测试：simple profile 组播 3 项（仅非 darwin 平台注册）"
    command: "meson test"
  - file: test/rist/meson.build
    source: "librist-v0.2.18/test/rist/meson.build"
    description: "test_send_receive 收发测试：main profile NPD/主备收发/加密/SRP 约 20 项（含 8 项 should_fail 反向用例）"
    command: "meson test"
  - file: test/rist/unit/meson.build
    source: "librist-v0.2.18/test/rist/unit/meson.build"
    description: "srp_unit 单元测试：cmocka 断言 SRP 加解密向量（需 cmocka + have_srp，缺失时上游自动跳过注册）"
    command: "meson test"

test_package_tests:
  - file: test_sender.c
    description: "编译链接 -lrist，调用 librist_version/api_version、rist_logging_set、rist_sender_create/destroy 验证 sender 生命周期"
    command: 'clang test_sender.c -lrist -o test_librist_sender && ./test_librist_sender'
  - file: test_receiver.c
    description: "编译链接 -lrist，调用 rist_receiver_create、rist_parse_address2、rist_peer_config_free2/destroy 验证 receiver 与 URL 解析"
    command: 'clang test_receiver.c -lrist -o test_librist_receiver && ./test_librist_receiver'

assertion_count: 2
