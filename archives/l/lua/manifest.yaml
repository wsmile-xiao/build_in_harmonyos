software: lua
display: "Lua"
description: "A powerful, efficient, lightweight, embeddable scripting language"
category: language
homepage: "https://www.lua.org"
license: MIT
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "鸿蒙系统默认使用 clang，需要指定 CC=clang"
    - "Lua Makefile 不支持标准 DESTDIR 模式，需使用 INSTALL_TOP"
    - "使用 linux-readline 平台以获得交互式命令行编辑"
  common_dependencies:
    - readline

# 版本索引
versions:
  "5.4.8":
    status: built
    build_date: "2026-05-26"
  "5.5.0":
    status: built
    build_date: "2026-05-26"
