software: lua
version: 5.3.6
status: built
build_system: custom
configure_options: []
build_options:
  - make generic
compiler: clang
dependencies: []
install_prefix: /storage/Users/currentUser/usr/local
binaries:
  - lua
  - luac
libraries:
  - liblua.a
headers:
  - lua.h
  - luaconf.h
  - lualib.h
  - lauxlib.h
  - lua.hpp
url: http://www.lua.org/ftp/lua-5.3.6.tar.gz
tarball_checksum: ""
notes: |
  Lua 使用自定义 Makefile，不使用 autotools。
  由于系统缺少 gcc 和 readline 库，使用 clang 编译器和 generic 平台。
  系统缺少 install 命令，手动复制文件完成安装。
  创建了 lua.pc 文件用于 pkg-config 支持。