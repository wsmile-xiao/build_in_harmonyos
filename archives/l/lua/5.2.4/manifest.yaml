software: lua
version: 5.2.4
category: interpreter
description: Lua is a powerful, efficient, lightweight, embeddable scripting language.

status: built
build_system: makefile

source:
  url: https://www.lua.org/ftp/lua-5.2.4.tar.gz
  mirror: https://mirrors.huaweicloud.com/lua/ftp/lua-5.2.4.tar.gz
  checksum: null

build:
  system: makefile
  platform: linux
  compiler: clang
  options:
    - CC=clang
    - MYCFLAGS=-I/storage/Users/currentUser/usr/local/include
    - MYLDFLAGS=-L/storage/Users/currentUser/usr/local/lib

dependencies:
  build:
    - readline
  runtime:
    - readline

patches:
  - 0001-Makefile-DESTDIR-and-cp-support.patch

install:
  prefix: /storage/Users/currentUser/usr/local
  binaries:
    - lua
    - luac
  libraries:
    - liblua.a
  headers:
    - lua.h
    - luaconf.h
    - lualib.h
    - lauxlib.h
    - lua.hpp

verification:
  lua_version: "Lua 5.2.4"
  lua_test: "Hello from Lua 5.2.4"
  luac_test: passed

quality_gates:
  G1_binary_integrity: passed
  G2_functionality: passed
  G3_portability: passed
  G4_archive_integrity: passed

notes: []