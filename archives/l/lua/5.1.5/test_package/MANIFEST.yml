package: "lua/5.1.5"
homepage: "https://www.lua.org/"

# 发行包顶层 make test 只执行 test/hello.lua。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - source: "lua-5.1.5.tar.gz/test/"
    description: "发行包内 19 个构建正确性脚本与示例；含 readonly.lua 预期错误用例"
    command: "使用新构建的 lua 逐项执行 test/*.lua，并为需要输入的脚本提供固定夹具"
    test_groups: 19
  - source: "https://www.lua.org/tests/lua5.1-tests.tar.gz"
    sha256: "49e4ca6561f82ea605908c5041ab5fad66ed9930fa0686675bd51b02767f18ad"
    description: "Lua 5.1 官方独立完整套件；all.lua 调用 22 个直接测试组"
    command: "LUA_PATH='./?.lua;;' LUA_INIT=\"package.path = '?;'..package.path\" lua all.lua"
    test_groups: 22
    dynamic_modules:
      - "libs/lib1.so"
      - "libs/lib11.so"
      - "libs/lib2.so"
      - "libs/lib21.so"
    dynamic_module_result: "四个模块均由目标机 clang 构建、签名并通过 require 动态加载"

# TEST_QUALITY_SPEC §3.3 允许对确实无法修复的平台限制逐项声明豁免。
# 原始上游测试文件没有修改；诊断续跑仅从标准输入生成临时驱动，用于验证其余测试组。
platform_exemptions:
  - test: "big.lua:11"
    assertion: "连接 129 个 32 MiB 字符串时应触发 overflow"
    reason: "测试总量为 4328521728 字节，只超过 32 位 MAX_SIZET；目标机 size_t 为 64 位且有 32 GiB 内存，连接按 Lua 5.1.5 的原生边界检查成功"
    evidence: "目标机诊断输出 ARCH_BITS=64 与 CONCAT_OK bytes=4328521728 GiB=4.03125"
    category: "architecture-exempt"
  - test: "files.lua:245"
    assertion: "行缓冲普通文件写入换行后，无显式 fflush 即应被另一 FILE 流立即读到"
    reason: "HarmonyOS libc 对普通文件的行缓冲可见时机与该测试假设不同；显式关闭或刷新后数据正确，文件读写其余断言全部通过"
    evidence: "仅排除此断言与 big.lua:11 后，原始完整套件的其余 20 个测试组到达 final OK"
    category: "platform-exempt"

upstream_expected_skips:
  - test: "pt_BR locale decimal-point subtest"
    reason: "目标机未安装 pt_BR locale；上游脚本检测后自行报告 tests not performed"
    category: "upstream-conditional-skip"
  - test: "testC opcode/API/yield-hook checks in release mode"
    reason: "上游发布模式未编入可选 ltests.c/ltests.h；脚本按设计跳过，另有 debug-internal 诊断结果"
    category: "upstream-conditional-skip"

# 内部模式需要将 ltests.c/ltests.h 编入调试解释器，属于上游可选白盒测试，
# 不计入发布构建的通过率。该模式在额外排除 code.lua:21 的编译器字节码
# 形状假设后到达 final OK；生产解释器与静态库不受该断言影响。
optional_internal_diagnostics:
  command: "使用 -DLUA_USER_H=\"ltests.h\" 构建调试解释器后运行 all.lua"
  result: "其余内部 API、GC、协程、分配器、数学、排序和 I/O 检查完成"
  additional_exemption:
    test: "code.lua:21"
    reason: "调试白盒用例预期 nil 局部变量只生成 RETURN，目标编译器生成 LOADNIL 后 RETURN"

test_package_tests:
  - file: "test_lua51.c"
    description: "链接打包后的 liblua.a，验证 VM、表达式、版本、package、require、关闭状态、TMPDIR 下 os.tmpname 与匿名 io.tmpfile"
    command: "./test_lua51"

assertion_count: 8

verification:
  release_examples_total: 19
  release_examples_passed: 19
  official_suite_groups_total: 22
  official_suite_groups_passed: 20
  platform_exemptions: 2
  consumer_assertions_total: 8
  consumer_assertions_passed: 8
  aggregate_total: 49
  aggregate_passed: 47
  effective_total: 47
  effective_pass_rate: "47/47 = 100%"
  raw_pass_rate: "47/49 = 95.9%"
  upstream_tests_modified: false
  unclassified_failures: 0
