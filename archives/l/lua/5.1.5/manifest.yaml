software: lua
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 构建系统类型（顶层字段，G4门禁要求）
build_system: makefile

# 版本号
version: "5.1.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.lua.org/ftp/lua-5.1.5.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "posix"
    - "CC=clang"
    - "MYCFLAGS=-DLUA_USE_POSIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Lua使用Makefile构建系统，无configure步骤"
  - "使用posix平台和CC=clang编译"
  - "打包脚本在处理lib/lua目录时出错"