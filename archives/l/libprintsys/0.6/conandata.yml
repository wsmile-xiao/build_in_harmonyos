# conandata.yml — libprintsys 0.6
#
# 源码来源说明（R39/PF7 例外，须在 PR 中留痕）：
#   上游项目 lpr/gnulpr 的 SourceForge 文件区已无可用发布物，实测：
#     https://downloads.sourceforge.net/project/lpr/libprintsys/0.6/libprintsys-0.6.tar.gz  -> HTTP 404
#     https://downloads.sourceforge.net/project/lpr/libprintsys/libprintsys-0.6.tar.gz      -> HTTP 404
#     https://sourceforge.net/projects/lpr/files/libprintsys/latest/download                -> HTTP 404
#     https://deb.debian.org/debian/pool/main/l/libprintsys/...                             -> HTTP 404
#   故采用该源码包自身 debian/control 的 Vcs-Git 字段所声明的官方仓库
#   （salsa.debian.org/debian/libprintsys）的 GitLab archive 端点，属官方托管源，
#   非第三方镜像/CDN。仓库内已含上游完整源码（configure.in/src/*）与 debian 打包元数据。
#   注：仓库为 3.0 (quilt) 的 unpatched 布局，debian/patches/debian.patch 未施加于工作树，
#   本配方不依赖该补丁（见 conanfile.py 中 glib 探测的处理方式）。
#
# 可重现性：archive 端点按分支名取时会随上游移动，故固定到 salsa master 的
# 不可变 commit 30e4dff49c2241cf29c913c38e200dd1b757c238
# （https://salsa.debian.org/api/v4/projects/101481/repository/commits/master 实测返回该 id，
#   且 Debian tracker 记录的 "1 new commit since last upload" 亦为同一 commit）。

sources:
  url: "https://salsa.debian.org/debian/libprintsys/-/archive/30e4dff49c2241cf29c913c38e200dd1b757c238/libprintsys-30e4dff49c2241cf29c913c38e200dd1b757c238.tar.gz"
  sha256: "b5730b0f1fbb8a3508ed07f5e868281f22b5dc51441cfcfac98b20417eb5e12d"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "0001 config.guess replaced with GNU Config 2023-08-22 plus HarmonyOS detection (SKILL E007 patch-autotools-ohos.pl)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "0002 config.sub replaced with GNU Config 2023-08-22 plus ohos triplet and linux-ohos kernel-os validation entry (SKILL E007+E122)"
    patch_type: "portability"
  - patch_file: "patches/0003-ltconfig.patch"
    patch_description: "0003 ltconfig (libtool 1.3.3) match linux-ohos in the Linux ELF branch; its host_os normalisation case runs before host_os is assigned so host_os stays linux-ohos, leaving dynamic_linker unset and can_build_shared=no (only .a produced)"
    patch_type: "portability"
