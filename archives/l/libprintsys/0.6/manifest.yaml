# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libtool 1.3.3 的 ltconfig 把 'Transform linux* to *-*-linux-gnu*' 的 case 写在 host_os 赋值之前，规范化永不生效，host_os 保持 linux-ohos 匹配不到 OS 分支 → dynamic_linker 未设 → can_build_shared=no，只产出 .a"
- "ltconfig 的 archive_cmds 用 $deplibs，会把 conan 路径下的 -lglib-2.0/-ltdb 归入 old_deplibs 而不交给 linker → .so 只有 libc.so 的 DT_NEEDED，同一 libtool 链接的可执行文件却有完整 NEEDED"
- "修 .so 缺 DT_NEEDED 无效的三条路线：shim 输出加 -Wl,--no-as-needed（能进 GLIB_LIBS/LDFLAGS/LIBS 但 NEEDED 不变）、给 src/Makefile.in 补 libprintsys_la_LIBADD、cpp_info.sharedlinkflags/exelinkflags 传 --allow-shlib-undefined（CMakeDeps 不传导）；有效方案是 package() 内用 libprintsys.a + --whole-archive + --no-as-needed 重建 .so"
- "上游 src/Makefile.am 把两侧都限定为 glib（INCLUDES=$(GLIB_CFLAGS)、LDFLAGS=$(GLIB_LIBS)），从外部传 LDFLAGS 会被静默丢弃，故依赖 flags 必须借道 glib-config 的输出注入"
- "autoconf 2.13 生成的 configure 不接受 KEY=VALUE 形式的参数（会报 invalid host type），环境变量必须用 env 前缀/conan env script 传入"
- "printcap 条目最后一行不能以反斜杠结尾，否则解析器会把下一条粘到当前条目（写测试样例时踩到）"
- "junk_check 默认 incremental 模式（git diff origin/main...HEAD）；分支上没有任何 commit 时 diff 为空会回退 full 整仓扫描，从而被他人存量误提交文件阻塞 —— 先精确提交本包文件即可走增量"

