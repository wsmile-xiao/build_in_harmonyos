# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  # E007 禁止 --host/--build：会让 AC_RUN_IFELSE 探测全部跳过并生成错误 config.h
  configure_options:
  - "--prefix=<conan package_folder>（由 AutotoolsToolchain 注入）"
  - "--enable-static（仅作为重建 .so 的输入，打包后即删除）"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "glib/2.88.3"
  - "tdb/1.4.15"
  - "pkgconf/3.0.6 (tool_requires)"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

