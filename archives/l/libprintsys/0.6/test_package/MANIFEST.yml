# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求 / R51 上游测试三步法）

package: libprintsys/0.6
homepage: "https://lpr.sourceforge.net/"

# ── 上游测试清点（证据，非推测） ────────────────────────────────────────
# 命令与实测输出（在探索编译后的源码树内执行）：
#   $ make -n check
#     Making check in src
#     make[1]: Entering directory '.../src'
#     make[1]: Nothing to be done for 'check'.
#   $ grep -n '^check-am:' Makefile src/Makefile
#     Makefile:296:check-am: all-am          ← 仅依赖构建，不挂任何测试程序
#     src/Makefile:319:check-am: all-am
# 另有：仓库无 tests/ 目录、无 CMakeLists.txt / CTestConfig.cmake、
#       无 ctest/pytest 注册项（顶层 Makefile.am 只有 SUBDIRS=src）。
upstream_check_command: "make check"

# 结论：**上游确无自动化测试**（check 为 automake 空模板 target）。
# 上游唯一具备测试性质的产物是 src/Makefile.am 中 noinst_PROGRAMS=pcaptest，
# 它被编译但不被 check 运行，且只做 lps_init() -> printcap_write(sys,1) -> lps_end()
# 的无断言演示（在 OHOS 上实测 rc=0，会打印一份新建 printcap 头部注释）。
# 因此本包不谎称"已运行上游测试"，改由 test_package 从消费者视角做实质断言。
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ── test_package 自带的消费者测试 ─────────────────────────────────────
test_package_tests:
  - file: test.c
    description: >-
      消费者端到端测试：写入样例 /etc/printcap 语料（2 台打印机、首台含 3 个别名）
      后，依次调用 lps_init → printcap_init → printcap_get_printer_list →
      printcap_get_printer（主名与别名两次）→ lps_pair_lookup → lps_num_pairs →
      lps_end（其内部已代管 printcap_end），校验打印机数量、别名解析指向同一对象、
      sd 队列目录字段值、布尔标志 sh 存在、capability 对数 >= 3。
      断言失败即返回非 0，make install/conan create 无法通过。
    command: "./test_printcap"

# 测试断言总数（test.c 中 check() 调用数）
assertion_count: 10
