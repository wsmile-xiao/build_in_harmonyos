software: leg
display: "leg"
description: "Recursive-descent parser generators for C (peg/leg by Ian Piumarta)"
category: build-tool
homepage: "https://www.piumarta.com/software/peg/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游是 peg 项目：同 tarball 产出 peg 与 leg 两个可执行文件；包名 leg 与 Debian/Homebrew 的别名惯例一致"
    - "纯 Makefile，无 configure/autotools/CMake；CC 通过 tools.build:compiler_executables 注入"
    - "make 必须 -j1（OHOS jobserver fifo 不可用）"
    - "make check（自举一致性 2 项）与 make test（examples 端到端 11 项）都在 conan create 内真机执行"
    - "零源码补丁：纯 C + POSIX 标准库，无平台特定分支"
  common_dependencies: []

versions:
  "0.1.18":
    status: built
    build_date: "2026-09-16"
    notes: "首次适配。上游 check 2/2 与 examples 11/11 作为构建断言执行；test_package 另加 11 条消费者断言。"
