# test_package/MANIFEST.yml — leg 0.1.18
# CI L0e 要求此文件存在。下面每个数字都对应 conanfile.py build() 中真实执行的
# 上游 target，无估算、无凑数（规则 4：不得虚构通过率）。

package: leg/0.1.18
homepage: "https://www.piumarta.com/software/peg/"

# 上游是裸 Makefile 项目，没有 configure/ctest。两个 target 都在 build() 中
# 真实执行：check = 自举一致性，test = examples 端到端回归。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check && make test"

# ── 上游 test target 运行的真实用例（共 11 个，逐条列名）────────────────────
# examples/Makefile: EXAMPLES = test rule accept wc dc dcv calc basic localpeg
#                               localleg erract
# 每个用例 = 生成 C → 编译 → 喂输入 → 与 .ref 参考输出 diff。
upstream_tests:
  - name: "make check (bootstrap consistency)"
    source: "peg-0.1.18/Makefile"
    description: "check-peg + check-leg：用刚构建的 peg/leg 重新生成 src/peg.peg-c 与 src/leg.c，与发行包内预生成文件逐字节 diff"
    command: "make check"
    case_count: 2
  - name: "examples/test"
    source: "peg-0.1.18/examples/test.peg"
    description: "PEG：有序选择 + 语义动作，输出比对 test.ref"
    command: "make test"
  - name: "examples/rule"
    source: "peg-0.1.18/examples/rule.peg"
    description: "PEG：子规则引用，输出比对 rule.ref"
    command: "make test"
  - name: "examples/accept"
    source: "peg-0.1.18/examples/accept.peg"
    description: "PEG：&{YYACCEPT} 提前接受，输出比对 accept.ref"
    command: "make test"
  - name: "examples/dc"
    source: "peg-0.1.18/examples/dc.peg"
    description: "PEG：逆波兰计算器，输出比对 dc.ref"
    command: "make test"
  - name: "examples/dcv"
    source: "peg-0.1.18/examples/dcv.peg"
    description: "PEG：dc 的变体实现，输出比对 dcv.ref"
    command: "make test"
  - name: "examples/localpeg"
    source: "peg-0.1.18/examples/localpeg.c"
    description: "PEG：手写 localpeg.c 配合生成的解析器，输出比对 localpeg.ref"
    command: "make test"
  - name: "examples/wc"
    source: "peg-0.1.18/examples/wc.leg"
    description: "LEG：词/行/字符统计，输出比对 wc.ref"
    command: "make test"
  - name: "examples/calc"
    source: "peg-0.1.18/examples/calc.leg"
    description: "LEG：四则运算计算器，输出比对 calc.ref"
    command: "make test"
  - name: "examples/basic"
    source: "peg-0.1.18/examples/basic.leg"
    description: "LEG：BASIC 方言解释器，输出比对 basic.ref"
    command: "make test"
  - name: "examples/localleg"
    source: "peg-0.1.18/examples/localleg.leg"
    description: "LEG：YY_CTX_LOCAL/YY_CTX_MEMBERS 本地上下文，输出比对 localleg.ref"
    command: "make test"
  - name: "examples/erract"
    source: "peg-0.1.18/examples/erract.leg"
    description: "LEG：错误动作路径，输出比对 erract.ref"
    command: "make test"

# ── test_package 自带用例（消费者视角，HarmonyOS 增量验证）───────────────
test_package_tests:
  - file: test.sh
    description: "只使用已安装的 bin/peg 与 bin/leg：校验两个命令存在且版本号正确；分别用 PEG 文法与 LEG 文法各生成一份 C 源码，断言生成物含 yyparse / 语义动作体 / yytext 捕获 / %% 之后的用户代码"
    command: "bash test.sh"

# 上述 test.sh 内的独立断言数（11 条 grep/test 断言 + 2 条 command -v 由
# version 检查覆盖）。上游的 13 项（2 check + 11 examples）分开计数，不并入此处。
assertion_count: 11

# 计数口径：上游 13（2 自举一致性 + 11 examples 端到端）不因重复运行而累加。
upstream_independent_total: 13
