version: "0.1.18"
software: leg
status: built
build_date: "2026-09-16"
build_system: makefile

source:
  url: "https://www.piumarta.com/software/peg/peg-0.1.18.tar.gz"
  sha256: "20193bdd673fc7487a38937e297fff08aa73751b633a086ac28c3b34890f9084"
  tar_format: tar.gz
  # 备源（逐字节相同，sha256 一致）：
  #   https://deb.debian.org/debian/pool/main/p/peg/peg_0.1.18.orig.tar.gz

build:
  system: makefile
  configure_options: []
  # 裸 Makefile 项目：无 configure；CC 由 tools.build:compiler_executables 注入。
  # 命令等价于：make CC=<ohos clang> -j1 && make CC=<ohos clang> check && make CC=<ohos clang> test
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []
# 上游源码零修改：纯 C + POSIX 标准库（stdio/stdlib/string/assert/unistd/libgen），
# 无平台特定代码、无 endian 假设、无 Windows 专有 API。

knowledge_gained:
  - "上游 'leg' 就是 Ian Piumarta 的 peg 项目：同一个 peg-<ver>.tar.gz 产出 peg 与 leg 两个可执行文件，0.1.18 是 peg 的版本号（src/version.h: PEG_MINOR/PEG_LEVEL）。不存在独立的 leg tarball。"
  - "同类工具包已先有 peg/0.1.19 合入（archives/p/peg）。leg/0.1.18 与之同源不同版本，不构成 L0j 版本冲突（registry 中 leg/* 为空）。"
  - "0.1.18 的预生成文件与源码自洽：make check 的两条自举 diff（peg.peg-c、leg.c）无差异，可作为构建断言。peg/0.1.19 则相反（预生成文件未随版本更新），那里只能 ignore_errors 如实记录。"
  - "examples/Makefile 与顶层 Makefile 都用 $(CC)，可按命令行覆盖；裸 make 的 install target 内硬编码 strip 且用非标准 ROOT/PREFIX，配方改用 copy() 直接取 bin/ 与 man/。"
  - "OHOS 下 make 必须 -j1：jobserver fifo 无法创建（Operation not permitted），仅非并行模式被容忍。"
