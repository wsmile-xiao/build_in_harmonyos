# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libgeohash/0.0-git2469d3c9cc
homepage: "https://github.com/simplegeo/libgeohash"

# 上游测试命令 (make 目标)
upstream_check_command: "make test"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: geohash_test.c
    source: libgeohash-2469d3c9cc94040abd669d5b8c90767b58126b09/geohash_test.c
    description: "上游唯一测试程序：encode/decode/neighbors/dimensions 断言（1 个 main 入口，含坐标/哈希/邻居断言）"
    command: "./a.out"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开 API encode/decode/neighbors/dimensions 验证并断言（含高精度邻居修复路径）"
    command: "./test_libgeohash"
  - file: ohos_specific_test.c
    description: "HarmonyOS 专项测试：OHOS 平台端到端往返一致性/坐标边界/非法精度回退/高精度邻居完整性/dimensions 单调性（与消费者测试分别计数）"
    command: "./ohos_specific_test"

# 测试断言总数
assertion_count: 17
