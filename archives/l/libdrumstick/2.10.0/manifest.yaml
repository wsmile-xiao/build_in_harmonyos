# 版本级 manifest — libdrumstick 2.10.0

version: "2.10.0"
software: libdrumstick
status: built
build_date: "2026-09-17"
build_system: cmake

source:
  url: "https://github.com/pedrolcl/drumstick/archive/refs/tags/RELEASE_2_10_0.tar.gz"
  sha256: "49d93aa8242289c5d155679029e77eaf5f9168e95cf75145bd8ed47aab147635"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=OHOS"
    - "-DBUILD_ALSA=OFF"
    - "-DUSE_SONIVOX=OFF"
    - "-DUSE_PULSEAUDIO=OFF"
    - "-DUSE_PIPEWIRE=OFF"
    - "-DUSE_FLUIDSYNTH=ON"
    - "-DUSE_NETWORK=ON"
    - "-DBUILD_DOCS=OFF"
    - "-DBUILD_TESTING=ON"
  dependencies:
    - qtbase/6.11.1
    - qt5compat/6.11.1
    - qttools/6.11.1
    - fluidsynth/2.5.7
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 平台识别：OHOS conan toolchain 将系统映射为 HarmonyOS，而 CMake 4.1 只有 Platform/OHOS.cmake（include Linux）。不设置 CMAKE_SYSTEM_NAME 会报 'System is unknown to cmake'，导致共享库不生成 SONAME、RT 插件 DT_NEEDED 写成相对路径 ../../../lib/...，运行时插件加载失败（rtTest 报 There aren't input backends）。显式 -DCMAKE_SYSTEM_NAME=OHOS 后库生成 SONAME，插件 DT_NEEDED 用 SONAME，上游 5 项测试全部通过。"
  - "fluidsynth 包发布的 fluidsynth.pc 的 prefix 指向已清理的 build 目录，需要在 build 私有 prefix 下重写 prefix 并经 PKG_CONFIG_PATH 注入（R49）。"
  - "Qt6 组件路径注入：qtbase 使用 cmake_find_mode=none，下游 CMake 需显式设置 CMAKE_PREFIX_PATH 指向 qtbase/qt5compat/qttools 包目录，并显式给出 Qt6Core5Compat_DIR 与 Qt6LinguistTools_DIR。"
