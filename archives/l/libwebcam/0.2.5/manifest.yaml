software: libwebcam
version: "0.2.5"
status: built
build_system: cmake
conan_ref: "libwebcam/0.2.5"

source:
  url: "https://deb.debian.org/debian/pool/main/libw/libwebcam/libwebcam_0.2.5.orig.tar.gz"
  sha256: "3ca5199c7b8398b655a7c38e3ad4191bb053b1486503287f20d30d141bda9d41"
  tar_format: tar.gz

build:
  system: cmake

configure_options: "CMAKE_POLICY_VERSION_MINIMUM=3.5 BUILD_SHARED_LIBS=ON"

dependencies:
  - "libxml2/2.15.3.1"

platform_notes:
  - "CMake minimum 2.6; set CMAKE_POLICY_VERSION_MINIMUM=3.5 for CMake 4.x compatibility"
  - "Replaced pkg_check_modules(libxml-2.0) with Conan-injected LIBXML2_INCLUDE_DIRS/LIBRARIES cache variables"
  - "Upstream builds both shared and static with same output name; patched to conditional on BUILD_SHARED_LIBS"
  - "Skipped try_compile for V4L2_CTRL_TYPE_STRING; OHOS kernel headers have modern V4L2"
  - "No automated upstream tests; libwebcam/test.c requires physical UVC camera"
  - "uvcdynctrl CLI tool built alongside library; requires camera hardware for actual use"
