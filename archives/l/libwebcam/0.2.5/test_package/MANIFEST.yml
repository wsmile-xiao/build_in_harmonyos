package: libwebcam/0.2.5
homepage: "https://sourceforge.net/projects/libwebcam/"

upstream_check_command: "none (no automated test framework)"
upstream_test_in_build: false
upstream_test_command: "none"

upstream_tests_exist: false
upstream_test_audit: |
  libwebcam 0.2.5 has no automated test framework: CMakeLists.txt has no
  enable_testing/add_test/ctest, no gtest, no 'make check' target.
  libwebcam/test.c is a hardware integration demo requiring a physical UVC
  camera (/dev/video0); it is not registered as a build target.
  Discovered: 0 automated test cases.

test_package_tests:
  - file: test_libwebcam.c
    description: "Verify c_get_error_text() returns correct strings for C_SUCCESS, C_INVALID_ARG, C_NOT_IMPLEMENTED, and c_cleanup() is safe to call without hardware (no camera needed)"
    command: "./test_libwebcam"
  - file: uvcdynctrl
    description: "Verify the uvcdynctrl CLI binary is installed (consumer test via absolute path)"
    command: "uvcdynctrl --help"

assertion_count: 4
