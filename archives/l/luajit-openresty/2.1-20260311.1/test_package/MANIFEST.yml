package: luajit-openresty/2.1-20260311.1
homepage: "https://github.com/openresty/luajit2"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.lua
    source: luajit-openresty-2.1-20260311.1/test/test.lua
    description: "LuaJIT 自带功能测试（需要 Perl Test::Base，鸿蒙不可用）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "验证 LuaJIT 库链接、Lua 执行、jit.version 确认是 LuaJIT 而非标准 Lua、FFI C 函数调用"
    command: "./test_luajit"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
