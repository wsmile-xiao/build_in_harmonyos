software: luajit-openresty
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1-20260311.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1-20260311.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"

# 构建系统类型 (top-level for self-check)
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/openresty/luajit2/archive/refs/tags/v2.1-20260311.1.tar.gz"

  # 源码校验和
  sha256: "f569cebc66544bc9da29ac0ac661488fd8fa2d111389d00d4a50064e64ad1a2a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-Makefile-DEFAULT_CC-clang.patch"
  - "0002-src-lib_os.c-tmpdir.patch"
  - "0003-src-lj_alloc.c-disable-mremap-ohos.patch"
  - "0004-src-lj_trace.c-tmpdir.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "LuaJIT Makefile 默认 DEFAULT_CC=gcc，OHOS 需改为 clang"
  - "OHOS /tmp 只读，LuaJIT os_tmpname/perf map 需改用 TMPDIR 环境变量"
  - "OHOS bionic 不支持 mremap，需在 lj_alloc.c 禁用 LJ_ALLOC_MREMAP"
  - "LuaJIT 无外部依赖，自包含构建"
