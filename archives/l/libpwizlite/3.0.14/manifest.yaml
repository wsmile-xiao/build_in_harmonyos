version: "3.0.14"
status: built
build_date: "2026-09-22"

source:
  url: "https://forgemia.inra.fr/pappso/libpwizlite/-/archive/upstream/3.0.14/libpwizlite-upstream-3.0.14.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  cc: clang

patches_applied:
  - "0001-cmake-harmonyos-unix-toolchain-include.patch"
  - "0002-cpack-license-optional.patch"
  - "0003-boost-target-and-static-only.patch"
  - "0004-boost-1.84-minimum.patch"

knowledge_gained:
  - "制品仓 boost 全线（1.84/1.85/1.90/1.91）只带 filesystem/iostreams/program_options/regex 编译库；pwiz 的 SpectrumWorkerThreads 需 libboost_thread/chrono 编译符号——vendor boostorg/thread+chrono（tag boost-1.84.0，与 boost/1.84.0 头版本严格匹配）编译后以 llvm-ar 解包并入 libpwizlite.a"
  - "llvm-ar 不能把 .a 直接并入 .a（当普通成员存）；必须先 x 解出 .o/.cpp.obj 再 rcs 并入；CMake 对象后缀是 .cpp.obj 不是 .o"
  - "boost/1.91.0 制品二进制砍掉 logic/math/multi_index/numeric/ublas/spirit/interprocess/locale 头模块；boost/1.84.0 头全但要求上游 find_package 版本下限从 1.88 放宽到 1.84"
  - "OHOS musl 无 pthread_setcancelstate——boost 提供 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 豁免宏（boost/1.85.0 配方 R8 注释同款）"
  - "CMAKE_SYSTEM_NAME=HarmonyOS 下 UNIX 变量未定义（同 libodsstream patch0003）；CPack 的 CPACK_RESOURCE_FILE_LICENSE 指向不存在的 debian/copyright 会硬失败（tag tarball 不带 debian/）"
  - "pwiz mzML 识别链：xml_root_element 必须精确匹配 indexedmzML/mzML（大小写敏感）；mzML 1.1 用 cvList 非 cvLabel；spectrumList 必须在 run 内"
