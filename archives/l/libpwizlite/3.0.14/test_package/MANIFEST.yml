# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libpwizlite/3.0.14
homepage: https://forgemia.inra.fr/pappso/libpwizlite

# 上游测试命令 (用于 make -n check 分析)
# 上游完全没有测试框架：源码树无 tests/ 目录、无 add_test/enable_testing、
# 无 check 目标；CMakeLists 仅有 CPACK_SOURCE_IGNORE_FILES 里的 "/tests/" 忽略项
# （打包时排除用，非测试注册）。N=0 如实申报。
upstream_check_command: "ctest -N  # → No tests were found（上游无测试注册）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A（上游无测试框架，N=0）"

# make check 实际运行的测试程序
# 无——上游未注册任何测试目标
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, N=0 的兜底)
test_package_tests:
  - file: test_pwizlite.cpp
    description: "mzML 解析消费者测试：MSDataFile 打开最小 mzML（indexedmzML 根/cvList/run/spectrumList 结构）、spectrum list 访问、spectrum(0) 惰性加载、id/index 往返，8 项断言"
    command: "./test_pwizlite"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
