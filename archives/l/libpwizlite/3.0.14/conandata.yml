# conandata.yml — libpwizlite 3.0.14

sources:
  "3.0.14":
    url: "https://forgemia.inra.fr/pappso/libpwizlite/-/archive/upstream/3.0.14/libpwizlite-upstream-3.0.14.tar.gz"
    sha256: "74c57dd532275d301480697fbdfe7120b072c56ba60ac388e5f27d3591fdac06"

patches:
  "3.0.14":
    - patch_file: "patches/0001-cmake-harmonyos-unix-toolchain-include.patch"
      patch_description: "CMAKE_SYSTEM_NAME=HarmonyOS has no Platform/HarmonyOS.cmake in CMake 4.1, so the UNIX variable is never defined and upstream's elseif(UNIX AND NOT APPLE) platform branch is skipped - unix-toolchain.cmake (ZLIB/Boost find_package) never runs. Match SYSTEM_UNAME_S=HarmonyOS too."
      patch_type: "portability"
    - patch_file: "patches/0002-cpack-license-optional.patch"
      patch_description: "CPACK_RESOURCE_FILE_LICENSE points to debian/copyright which is not shipped in the upstream tag tarball; make it conditional (CPack hard-fails otherwise)."
      patch_type: "portability"
    - patch_file: "patches/0003-boost-target-and-static-only.patch"
      patch_description: "Two src/CMakeLists.txt adaptations: (1) link the conan CMakeDeps Boost::boost interface target instead of per-component module-mode Boost:: targets; (2) guard the pwizlite-shared SHARED target behind BUILD_SHARED_LIBS (registry zlib/1.3.1 is non-PIC, cannot link into a shared lib on aarch64). Static-only default."
      patch_type: "portability"
    - patch_file: "patches/0004-boost-1.84-minimum.patch"
      patch_description: "Upstream requires Boost >= 1.88; the conan registry boost/1.84.0 binary provides the full header set AND the compiled iostreams/filesystem archives pwiz needs (1.90/1.91 binaries lack them) — relax the minimum to 1.84."
      patch_type: "portability"
