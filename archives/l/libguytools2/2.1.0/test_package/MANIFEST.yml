# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libguytools2/2.1.0
homepage: "https://sourceforge.net/projects/libguytools/"

# ── 上游测试清点（R51 第一步；证据见 2.1.0/notes.md「上游测试」） ───────────
# 上游发布包 tools-2.1.0.tar.gz 内**无任何测试**：
#   - 无 tests/ 目录、无 test_*.cpp、无独立测试程序（5 个 .cpp 内 grep 'int main(' 零命中）
#   - tools.pro / toolsstatic.pro / trunk.pro 无 check/test 目标（grep 零命中）
#   - Debian 官方打包（sources.debian.org libguytools2 2.1.0-1 的 debian/rules）
#     只有 build/install/binary-*，亦无测试目标
# 因此没有可执行的上游测试：上游测试入口留空，改为提供消费者功能测试（见下）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试程序：无
upstream_tests: []

# 消费者功能测试 —— conan test_package（CI L1），由 conan create 编译并真实执行。
# 上游无测试可跑，故以"真实输入 → 真实结果"的功能测试覆盖全部 6 个公开模块，
# 而非常量/返回值断言：真实配置文件解析、日志文件落盘读回、真实 SIGHUP/SIGTERM
# 往返、uname()/ioctl 真实查询，失败则 conan create 退出码非 0。
test_package_tests:
  - file: test_libguytools2.cpp
    source: test_libguytools2.cpp
    description: >
      ToolError（注册表生命周期/消息查表/errno 翻译/日志内容 + 0001 补丁回归）、
      t_Log（日志文件落盘读回、Debug/Info/Error 路由与标签、版本串、单例语义、
      open/close 标记）、ToolSysInfo（uname() 与真实 uname(2) 逐字段交叉校验、
      AddrStr/AddrVal 交叉校验）、ToolCfg（STRING/INTEGER/DOUBLE/PRESENCE/SET/HMS
      真实解析、命令行优先于配置文件、模板生成、10 类错误路径的错误码+日志+
      目标变量未被写入）、ToolSignal（守护线程真实投递 SIGHUP/SIGTERM，
      handler 与日志回调均在守护线程）、HarmonyOS 平台身份/TMPDIR/OHOS 落盘/
      net/if.h ioctl 路径 MAC 枚举。
    command: "./test_libguytools2"

# 检查项总数 —— 实测执行值（conan create 输出 "checks: 127 passed: 127 failed: 0"）。
# 源码中 109 处 Check() 调用点，其中 2 处在 10 个错误用例的循环内展开为 20 项。
assertion_count: 127
