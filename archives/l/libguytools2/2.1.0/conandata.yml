# conandata.yml — libguytools2 2.1.0
#
# Upstream ships the library as "tools-2.1.0.tar.gz" inside the libguytools
# SourceForge project (the package keeps the historical libguytools2 name).
# sha256 verified against the published SourceForge release metadata
# (best_release.json) and by re-downloading the tarball.
sources:
  url: "https://downloads.sourceforge.net/project/libguytools/libguytools/LatestSource/tools-2.1.0.tar.gz"
  sha256: "79562f8e8db0296da0f7ff612fd9db41ad454560cc32a307a24d15fda74f1d56"

patches:
  - patch_file: "patches/0001-toolerror.cpp.patch"
    patch_type: "bugfix"
    patch_description: >
      ToolErrorGetMessage() reported success (NO_ERROR) even when the requested
      code was not registered, silently returning a NULL message. Module Init()
      functions use TOOL_CHK(ToolErrorRegisterError(...)) to detect failures, so
      the swallowed error hid broken registrations and a NULL ppMsg argument
      dereferenced a null pointer. Return TOOL_ERROR_ENTRY_NOT_FOUND and make
      ppMsg optional.
  - patch_file: "patches/0002-tools.pro.patch"
    patch_type: "portability"
    patch_description: >
      tools.pro installs nothing, and Qt >= 5.15 derives the shared-library
      major version from QT_VERSION, which would produce the bogus SONAME
      libguytools.so.5. Set VERSION explicitly (-> libguytools.so.2) and add
      install rules for the library and the public headers so the library can
      be packaged and consumed.
  - patch_file: "patches/0003-toolsysinfo.cpp.patch"
    patch_type: "portability"
    patch_description: >
      toolsysinfo.cpp includes <linux/if.h>, which on the OHOS sysroot pulls in
      linux/socket.h and redefines struct sockaddr_storage already provided by
      sys/socket.h ("redefinition of 'sockaddr_storage'"). The file only needs
      struct ifreq/ifconf and the SIOCGIF*/IFF_* constants, all of which the
      portable <net/if.h> provides, so switch to the portable header instead of
      guarding the clash with a platform macro (knowledge E091/E119).
