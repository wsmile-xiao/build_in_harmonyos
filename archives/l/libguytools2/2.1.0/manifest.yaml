knowledge_gained:
  - "上游只提供 qmake .pro（无 CMake/autotools），且 tools.pro include 的 libguytools_version.pro.inc 不在发布包内 —— 配方在 build() 内生成该文件，不要用 create_version_file.sh（依赖 Debian 的 debian/changelog 路径）"
  - "linux/if.h 在 OHOS sysroot 会经 linux/socket.h 重定义 sockaddr_storage（知识 E091/E119）；toolsysinfo.cpp 只需 struct ifreq/ifconf 与 SIOCGIF*/IFF_*，改用可移植的 net/if.h 即可，无需平台宏守卫"
  - "Qt >= 5.15 的 qmake 用 QT_VERSION 推导共享库主版本，会产出 SONAME libguytools.so.5；必须显式 VERSION = $$VERSION 才能得到 libguytools.so.2"
  - "qt5-qtbase 包内 mkspecs/modules/*.pri 记录的是已消失的构建目录绝对路径（且与本图 package hash 不一致），qmake 报 Unknown module(s) in QT: core；需复制 .pri 到 build 目录并把路径改写为 package 目录后经 QMAKEMODULES 暴露"
  - "ToolErrorGetMessage() 原始实现无论错误码是否注册都返回 NO_ERROR，使 TOOL_CHK(ToolErrorRegisterError(...)) 的失败检测失效，且 ppMsg 为空指针时解引用崩溃"
  - "ToolCfg：SECTION/ENDSECTION 语法（非 [section]）、字符串值必须单引号、PRESENCE 参数不写 =、命令行选项不带 - 前缀且必须是参数表中的关键字、ToolCfgInit() 会重置 argc/argv 与 pUserLogFn（须先 Init 再 UseAdjustedCommandLine/SetLogFn）"
  - "上游发布包不含任何测试（无 tests/、无 test_*.cpp、无 main()、tools.pro 无 check/test 目标，Debian debian/rules 亦无测试目标）→ 以 test_package 消费者功能测试替代断言测试：真实配置文件解析、日志落盘读回、真实 SIGHUP/SIGTERM 往返、uname()/ioctl 交叉校验，由 conan create 编译执行（实测 127 项检查全过，失败即构建失败）"
  - "鸿蒙特有行为已固化为功能测试校验：uname 三重身份（HarmonyOS / HongMeng 内核 / aarch64）、平台 TMPDIR 契约（已导出且指向 /storage/ 用户存储）、t_Log 经 fopen64/musl 在 OHOS 用户存储落盘、net/if.h ioctl 路径 MAC 枚举返回 12 位十六进制"

