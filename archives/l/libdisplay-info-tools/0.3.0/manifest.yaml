# 版本级 manifest — libdisplay-info-tools 0.3.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3.0"
software: libdisplay-info-tools

# 编译状态: published | built | failed | archived
# built: conan-verify 通过 (G0-G4 全绿, 含 conan create + test_package), 尚未上传制品仓
status: built

# 编译日期 (YYYY-MM-DD)
build_date: "2026-09-16"
build_system: meson

# ============================================================
# 源码信息
# ============================================================
source:
  # 与 archives/l/libdisplay-info/0.3.0 同源 (R39: 上游官方地址)
  url: "https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.3.0/libdisplay-info-0.3.0.tar.gz"
  sha256: "2b467e3336aec63819d6aca28d7310d3dc7415b2b3a3c3a5aec9d3727053c078"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: meson
  project_options:
    - "-Ddefault_library=static"   # 工具自包含, 不与 libdisplay-info 包争 .so
    - "-Dwrap_mode=nodownload"
  # 构建期数据依赖 (非 conan 包)
  build_dependencies:
    - hwdata/0.366  # 只取 pnp.ids 这一个数据文件，hwdata 没有 conan 配方，随本配方携带
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-cli-version-flag.patch"
  - "0002-meson-hwdata-ids.patch"
  - "0003-gen-search-table-malformed-lines.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "libdisplay-info 0.3.0 完全没有 meson_options.txt：根 meson.build 无条件 subdir('di-edid-decode') 与 subdir('test')，CLI 没有任何命令行开关可切；发行拆分包只能接受“整个构建图都得编”或自行引入选项"
  - "di-edid-decode 的 CLI 契约不满足打包冒烟测试：getopt_long 短选项串是 \"h\"，-h 与未知选项两条路径都 return -1（退出码 255），--version 未定义，--help 也非 0 退出；平台 L2（先 --version 再回退 --help）必然 FAIL，需补丁补 --version 并让 --help 退出 0"
  - "上游 library() 带 link_args: ['-Wl,--version-script,...']；meson 对 static_library 忽略 link_args，因此 -Ddefault_library=static 不需要额外处理版本脚本"
  - "构建期 tool/gen-search-table.py 由 meson custom_target 调用生成 pnp-id-table.c，依赖 hwdata 的 pnp.ids。hwdata 是纯数据包、没有 conan recipe，上游 meson 在 dependency('hwdata') 找不到时会回退到硬编码的 /usr/share/hwdata/pnp.ids（OHOS 设备上不存在），所以这条回退必须由补丁改写成随配方携带的 data/pnp.ids"
  - "hwdata 的 pnp.ids 里存在只有 PNP ID 没有厂商名的行（例如单行的 MV），上游 gen-search-table.py 无条件 line.split(maxsplit=1) 解包成 (id, name) 会抛 ValueError: not enough values to unpack，custom_target 失败、整个构建中断"
  - "pnp.ids 必须随配方打包（export_sources() 导出 data/pnp.ids，source() 落进源码树），不能在 build() 里联网下载：raw.githubusercontent.com 不可达时整条 conan create 会一直卡到任务超时（最后报 curl: (28) timeout），这正是本配方早期设备验证失败的根因"
  - "Conan 2.30 会把 export_sources 直接铺进源码树（export_sources_folder == source_folder）：此时从导出目录往源码树 copy 同一个文件会抛 copy() 'src' and 'dst' arguments must have different values，staging 逻辑必须先判断目标已存在并比较 normpath 再决定是否 copy"
  - "meson.install() 会把静态库/头文件/pkg-config 一并铺进 package_folder，拆分包必须在 package() 里 rmdir include/ lib/ share/ 才能保证同一文件只有一个属主"