# test_package/MANIFEST.yml
# libdisplay-info-tools ships the upstream di-edid-decode driver only; the
# upstream meson test suite (test/meson.build: di-edid-print + 32 decode/print
# cases driven by ./edid-decode-check.sh) belongs to the library and is
# covered by the libdisplay-info archive.
package: libdisplay-info-tools/0.3.0
homepage: "https://gitlab.freedesktop.org/emersion/libdisplay-info"

upstream_check_command: "meson test -C build"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# R34: the test_package must actually invoke the tested binary.
test_package_tests:
  - file: test.sh
    description: >-
      端到端: 校验 --version/--help 的退出码契约（补丁 0001 的回归守卫），
      解码内嵌的官方 EDID 夹具 test/data/acer-p1276.edid 并断言
      "EDID conformity: PASS" 与 CTA 扩展块被解析，最后以空输入作反例
    command: "bash test.sh"

assertion_count: 5