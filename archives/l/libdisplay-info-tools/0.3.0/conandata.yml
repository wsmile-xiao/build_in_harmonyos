# conandata.yml — libdisplay-info-tools 0.3.0
# 上游: https://gitlab.freedesktop.org/emersion/libdisplay-info
# 与 archives/l/libdisplay-info/0.3.0 同一份源码 tarball（sha256 已复核一致）。
sources:
  url: "https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.3.0/libdisplay-info-0.3.0.tar.gz"
  sha256: "2b467e3336aec63819d6aca28d7310d3dc7415b2b3a3c3a5aec9d3727053c078"

patches:
  - patch_file: "patches/0001-cli-version-flag.patch"
    patch_description: >-
      为 di-edid-decode 增加 -V/--version（版本号由 meson.project_version()
      编译期内联），并让 -h/--help 以 0 退出；上游只认 -h 且 -h 与未知选项
      两条路径都 return -1，--version/--help 均不可能返回 0，
      平台 L2 冒烟测试必然判失败
    patch_type: "portability"
  - patch_file: "patches/0002-meson-hwdata-ids.patch"
    patch_description: >-
      hwdata 没有 conan 配方，设备上也没有 hwdata 的 pkg-config 文件，
      上游 meson.build 的 dependency('hwdata') 必然 not found，于是回退到
      写死的 /usr/share/hwdata/pnp.ids —— OHOS 设备上不存在该路径，
      meson setup 直接报 "File /usr/share/hwdata/pnp.ids does not exist"。
      改为回退到随配方发布的 data/pnp.ids（export_sources()/source() 落到源码树）
    patch_type: "portability"
  - patch_file: "patches/0003-gen-search-table-malformed-lines.patch"
    patch_description: >-
      tool/gen-search-table.py 把 pnp.ids 的每一行都解包成 (id, 厂商名)，
      但 hwdata 的 pnp.ids 里存在只有 ID 没有名称的行（如单行的 "MV"），
      一解包就抛 ValueError: not enough values to unpack (expected 2, got 1)，
      整个 custom_target 失败、构建中断。改为与"非法 PNP ID"同样地跳过并告警
    patch_type: "bugfix"