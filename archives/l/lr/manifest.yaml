# 软件级 manifest — lr
software: lr
display: "lr"
description: "递归列出文件的命令行工具（融合 ls(1)/find(1)/stat(1)/du(1) 能力，支持 C 风格过滤表达式与自定义格式）"
category: utility
homepage: "https://github.com/leahneukirchen/lr"
license: MIT

build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C（lr.c）+ 纯 POSIX Makefile，零补丁即可用 OHOS SDK clang（aarch64-linux-ohos）交叉编译"
    - "零第三方依赖（仅链接系统 libc）"
    - "不使用 fts(3)，自带 opendir/readdir 遍历，因此不依赖 musl 是否提供 fts.h"
    - "`__linux__` 分支（sys/xattr.h 的 listxattr/llistxattr、mntent 的 fstype）在 OHOS 上正常编译并工作：`-l`/`%x` 输出 `@` xattr 标记，`%Y` 报告文件系统类型 hmdfs"
    - "上游 Makefile 的 PREFIX 写死系统前缀且 install 目标依赖 install(1)，配方 package() 直接 copy 产物到包目录（bin/lr、share/man/man1/lr.1、share/zsh/site-functions/_lr）"
    - "上游无任何测试用例（Makefile 只有 all/clean/install/FRC），适配补全 43 条行为回归断言"
  common_dependencies: []

versions:
  "1.5.1":
    status: built
    build_date: "2026-09-19"
    conan_ref: "lr/1.5.1"
