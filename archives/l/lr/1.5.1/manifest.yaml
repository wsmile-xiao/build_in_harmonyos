# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "零补丁适配：上游单文件 lr.c + POSIX Makefile 不经修改即可用 OHOS SDK clang 15（aarch64-linux-ohos）交叉编译，产物为 PIE ELF64"
  - "lr 不使用 fts(3)，自带 opendir/readdir 遍历，因此不受 musl 对 fts.h 支持不全的影响——这是它在 OHOS 上零改动可用的关键"
  - "`#ifdef __linux__` 分支在 OHOS 上被编译且真实可用：sys/xattr.h 的 listxattr/llistxattr 让 -l 与 %x 输出 @ 标记（HMDFS 报告存在 user.* xattr），mntent 的 scan_filesystems 让 %Y 返回 hmdfs"
  - "上游 Makefile 的 PREFIX 写死系统前缀且 install 目标依赖 install(1)（CI worker PATH 无保证）：package() 改为直接 copy bin/lr、share/man/man1/lr.1、share/zsh/site-functions/_lr，全程不触碰共享系统前缀（R49）"
  - "lr 1.5.1 没有 --version/--help 长选项（getopt 串为 01ABC:DFGHLQPST:UWXde:f:lho:st:x（含字符 l，即 -l 长格式，不接参数）），未知选项以 rc=2 打印 Usage 到 stderr；CI L2 冒烟的 --version 探测不可用，改由 test_package 断言该退出码语义"
  - "编写回归用例的两个真实陷阱：lr 的字符串字面量不支持反斜杠转义（文法中字符串只允许双写引号转义），正则里写两个反斜杠会退化成匹配一个字面反斜杠从而静默不匹配，应直接写 log$ ；-f 格式串若不含换行会把全部记录压成一行"
  - "conandata.yml 的注释里不要写额外 URL：CI 的镜像重写/预下载步骤会抓取文件内所有 http(s) 字面量并把地址回写成本地缓存路径，若注释地址是 sources.url 的字符串前缀就会污染真实源地址（本包实测导致 conan create 报 NotADirectoryError）"
  - "回归套件自身也有陷阱：断言执行期间会在 fixture 目录留下临时文件（如捕获 stderr 的 e1.err），因此与 find/wc 对照的条目数必须在断言当场重新统计，不能在 fixture 建立时预算"
  - "断言的期望值不能取自被验命令自身的输出（自我循环即恒真）：-lh 的人类可读值改由 wc -c + awk 反算；%Y 必须排除纯数字，因为上游 fstype() 查不到挂载表时会回退打印设备号，只判'非空'在上游实现下恒真"
