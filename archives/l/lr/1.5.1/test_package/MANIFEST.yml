# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: lr/1.5.1
homepage: "https://github.com/leahneukirchen/lr"

# 上游测试命令：上游不存在测试命令。Makefile 的全部目标是 all / clean / install / FRC，
# 既没有 test 也没有 check；tarball 内亦无任何测试源文件或 tests/ 目录（清点证据见下）。
# 本字段留空，说明写在下方注释与 upstream_test_inventory_evidence 中。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# R51 上游测试清点证据（立项时逐项核对，非"没环境"式推断）
upstream_test_inventory_evidence:
  - "tarball 清单（tar tzf lr-1.5.1.tar.gz）共 14 个条目 = 12 个普通文件 + 2 个目录项（lr-1.5.1/ 与 lr-1.5.1/contrib/）：LICENSE、Makefile、NEWS.md、README.md、_lr、contrib/lr.el、contrib/lr.vim、contrib/lrls、contrib/lrocate、lr.1、lr.c、lr.png —— 无 tests/ 目录、无测试源文件"
  - "构建系统清点（grep '^[a-zA-Z_.-]*:' Makefile）目标为 all、clean、install、FRC，无 test/check/runtests"
  - "文件名清点（解压目录内 find . -iname '*test*'）命中 0 个文件"
  - "无测试框架可枚举：不存在 CMakeLists.txt / meson.build / configure.ac，ctest/meson/pytest 注册数均为 0"
  - "上游 README 的 Installation 一节仅给出 make all / make install，未提供任何测试入口"

# 上游实际运行的测试程序
upstream_tests: []

# 宿主环境不兼容用例（本包无上游用例，故为空）
host_incompatible_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_lr.sh
    description: >-
      适配补全的行为回归套件（上游无测试）。在一次性 fixture 目录（4 层深度、含空格文件名、
      点文件、3×1024 字节文件、悬空符号链接）上真实执行安装后的 lr 二进制，逐条断言：
      递归遍历与默认名称排序；遍历控制 -d/-1/-A/-U/-W/-B/-D/-s/-L/-0；过滤表达式 -t 的
      type/size/mode/depth 属性与 = == ~~ =~ === 运算符及 name = "x" ? prune : print
      三元动作；-e 名称正则；输出格式 -F/-Q/-P/-l/-h 与 %s %d %i %n %m %Y %t 说明符；
      排序串 -os/-oS；-0 的 NUL 分隔语义；NO_COLOR 与 -GG 的颜色开关；参数 - 从标准输入
      读文件名；退出码语义（1=顶层路径无法 stat、2=用法错误且 Usage 走 stderr、stdout 为空）；
      以及包内 man 手册与 zsh 补全的交付物完整性。凡涉及大小、权限、文件系统类型的期望值都在
      运行时由 wc -c / find / awk 从文件系统独立反查，并配有负向对照（mode = 000 不得命中、
      %Y 不得退化为纯数字设备号），不写死平台常量。
      未纳入断言的上游能力（仅人工抽查或未验证）：-X OSC 8 超链接、-S stat 风格输出、-H、-x
      的跨文件系统边界、-C [COLOR:]PATH 自定义着色、@file 参数、-TA/-TC/-TM 时间戳选择、
      以及 %y %l %R %e %C* 等说明符。
    command: "LR_PACKAGE_FOLDER=<conan package folder> sh test_lr.sh"

# 测试断言总数（与 test_lr.sh 的 1..43 计划、A01..A43 标号严格一致）
assertion_count: 43
