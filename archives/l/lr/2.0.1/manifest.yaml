# 版本级 manifest
# 文件位置: archives/l/lr/2.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.1"

# 软件名
software: "lr"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/leahneukirchen/lr/tar.gz/refs/tags/v2.0.1"

  # 源码校验和
  sha256: "c7c4a57169e1396f17a09b05b19456945c8bb5e55001c5a870b083c0b4a23cd8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lr.c 的 __linux__ 分支（mntent/getmntent 挂载表支持）在 OHOS 上可直接编译，零补丁"
  - "Makefile install 目标需要 coreutils install 命令（OHOS 无，E098/E108），打包改用 Conan copy()（endlessh 先例）"
  - "codeload URL 末段 tag 名无扩展名时 get() 须显式传 filename=*.tar.gz（endlessh 先例）"
  - "mksh 下多位位置参数必须 ${17} 花括号引用，$17 会被解析为 ${1}7（test 脚本踩坑）"
