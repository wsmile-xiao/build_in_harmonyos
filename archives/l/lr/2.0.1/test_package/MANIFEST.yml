# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# lr 2.0.1 上游无任何测试套件：
#   - Makefile 仅有 all/clean/install/FRC 目标，无 test/check target
#   - tarball 与 GitHub 全量树（14 个文件）均无测试文件
#   - 无 CI/CD（.github/workflows 不存在）
# 因此适配后补全了二进制级功能测试 + OHOS 专项 ELF/ABI 测试。

package: lr/2.0.1
homepage: "https://github.com/leahneukirchen/lr"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -n"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无测试程序，此处为空
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 上游无测试套件，以下为适配后补全的测试（断言值均来自本机真实执行基线）
test_package_tests:
  - file: test_package/test_lr.sh
    description: "lr -1 depth limit: exactly 4 depth-1 entries, no deeper descent"
    command: "./test_lr.sh (test 1: -1 depth limit)"

  - file: test_package/test_lr.sh
    description: "lr -0 NUL-separated output: 6 entries, 6 NUL bytes"
    command: "./test_lr.sh (test 2: -0 NUL output)"

  - file: test_package/test_lr.sh
    description: "lr -F type indicators: dirs '/', regular files bare, symlinks '@'"
    command: "./test_lr.sh (test 3: -F indicators)"

  - file: test_package/test_lr.sh
    description: "lr -t 'type == d' directory filter: 4 dirs, no files"
    command: "./test_lr.sh (test 4: type filter)"

  - file: test_package/test_lr.sh
    description: "lr -t 'name ==' exact name filter finds file"
    command: "./test_lr.sh (test 5: exact name filter)"

  - file: test_package/test_lr.sh
    description: "lr -t 'name ~~' glob name filter finds file"
    command: "./test_lr.sh (test 6: glob name filter)"

  - file: test_package/test_lr.sh
    description: "lr -e POSIX ERE filter matches basename"
    command: "./test_lr.sh (test 7: ERE filter)"

  - file: test_package/test_lr.sh
    description: "lr -f '%f %s' custom format prints 'x.txt 6'"
    command: "./test_lr.sh (test 8: custom format)"

  - file: test_package/test_lr.sh
    description: "lr - stdin mode echoes path read from stdin"
    command: "./test_lr.sh (test 9: stdin mode)"

  - file: test_package/test_lr.sh
    description: "lr -d lists only the root argument itself"
    command: "./test_lr.sh (test 10: -d no descent)"

  - file: test_package/test_lr.sh
    description: "lr -l long output starts with '-' and shows file name"
    command: "./test_lr.sh (test 11: -l long format)"

  - file: test_package/test_lr.sh
    description: "lr -Z invalid option: exit 2, error on stderr, empty stdout"
    command: "./test_lr.sh (test 12: invalid option)"

  - file: test_package/test_lr.sh
    description: "lr on nonexistent path: exit 1, lstat error on stderr, empty stdout"
    command: "./test_lr.sh (test 13: nonexistent path)"

  - file: test_package/test_lr.sh
    description: "OHOS 专项: ELF magic/ELFCLASS64/LE/ET_DYN(PIE)/EM_AARCH64 头部解析 + 唯一 NEEDED=libc.so + musl aarch64 解释器 + 无 RPATH/RUNPATH"
    command: "./test_lr.sh (test 14: OHOS-specific ELF/ABI/deps/RPATH)"

# 测试断言总数 (近似值, 用于质量评估)
# 14 个测试组共 36 个断言点（含 OHOS 专项 9 个）
assertion_count: 36
