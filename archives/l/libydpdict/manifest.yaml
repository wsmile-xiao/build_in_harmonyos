# 软件级 manifest —— 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-software.yaml

software: libydpdict

display: "libydpdict"

description: "ydpdict 词典支持库（SLOWNIK 词典读取 + windows-1250/音标转 UTF-8）"

# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

homepage: "https://toxygen.net/ydpdict/"

license: LGPL-2.1

build_system: autotools

ohos_adaptation:
  key_points:
    - "上游发布包 ltmain.sh 与其 aclocal.m4 声明的 libtool 版本错配（2.2.6b vs 2.4）→ 配方 source() 用 GNU libtool 2.4 官方包内 ltmain.sh 覆盖残缺件（知识草稿 E543）"
    - "profile [buildenv] 的 SHELL/CONFIG_SHELL 优先级高于配方环境 → build() 以命令前缀 SHELL=/bin/sh CONFIG_SHELL=/bin/sh 调用 configure，整链（configure→config.status→libtool→Makefile）统一到 /bin/sh"
    - "VPATH 构建下生成的 include/ydpdict.h 位于构建目录 → configure 时 CPPFLAGS 补构建目录 include"
    - "config.guess/config.sub 需补 HarmonyOS 分支（E007，patches/ 内两个 portability 补丁）"
    - "本包为系统同名库，按 R26 默认静态（shared=False）"
  common_dependencies: []

versions:
  "1.0.4":
    status: built
    build_date: "2026-09-25"
    conan_ref: "libydpdict/1.0.4"
