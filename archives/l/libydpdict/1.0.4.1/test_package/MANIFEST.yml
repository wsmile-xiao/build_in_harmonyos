# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: libydpdict/1.0.4.1
homepage: "https://github.com/wojtekka/libydpdict"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 misc/Makefile.am: check_PROGRAMS = ydpstress ydptest ydpxml gentable
# （无 TESTS 变量：make check 只构建这些程序、不自动运行任何用例）
upstream_check_command: "make -C misc check"

# conanfile.py build() 方法中已集成上游测试：
#   1) make -C misc check 构建 4 个 check_PROGRAMS；
#   2) 逐个真实执行（ydpstress/ydptest/ydpxml 用按上游 misc/mkdict.py 格式合成
#      的词典语料——上游商业词典数据不可分发；gentable 无数据依赖）。
upstream_test_in_build: true
upstream_test_command: "make -C misc check && misc/ydpstress && misc/ydptest && misc/ydpxml && misc/gentable"

# ── 上游测试清点结论（R51 三步法第一步，2026-09-29 修正）──
# 清点证据（对官方 tarball 全量扫描，sha256 见 conandata.yml，成员数 40）：
#   1. 包内无 tests/ test/ tcase/ 目录（无独立测试树）；
#   2. src/Makefile.am、include/Makefile.am 无 TESTS/check_PROGRAMS；
#      **misc/Makefile.am 第 1 行有 check_PROGRAMS = ydpstress ydptest ydpxml
#      gentable**（此前清点误报"均无 check_PROGRAMS"，本版按 grep 实测修正）；
#   3. 上游无 TESTS 变量 → make check 仅构建 4 个测试/校验程序，不自动运行。
# 因此上游测试基数 N=4（check 程序口径），conanfile build() 已全部真实执行。
# （测试程序源码与判定逻辑零改动；上游 ydptest_SOURCES=ydpstress.c，
#   两程序同源、独立二进制，按 2 例申报。）
upstream_tests:
  - file: misc/ydpstress.c
    source: libydpdict-1.0.4/misc/ydpstress.c
    description: "上游压力/遍历测试：对 4 本词典全部词条执行 ydpdict_read_rtf + ydpdict_read_xhtml"
    command: "./misc/ydpstress"
  - file: misc/ydpstress.c
    source: libydpdict-1.0.4/misc/ydpstress.c
    description: "check_PROGRAMS 中的 ydptest（上游 ydptest_SOURCES=ydpstress.c，同一测试负载独立二进制）"
    command: "./misc/ydptest"
  - file: misc/ydpxml.c
    source: libydpdict-1.0.4/misc/ydpxml.c
    description: "XHTML 渲染校验：全词条 read_xhtml 输出可解析性检查（libxml2 为可选校验器，交叉/CI 环境确定性关闭，渲染负载照常执行）"
    command: "./misc/ydpxml"
  - file: misc/gentable.c
    source: libydpdict-1.0.4/misc/gentable.c
    description: "iconv windows-1250→utf-8 转换表生成器（验证目标 libc iconv 可用，无数据依赖）"
    command: "./misc/gentable"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用真实 API：版本宏、windows-1250/音标/上标 → UTF-8 转换结果、NULL 句柄边界、缺失词典文件 open 失败路径（非线性堆砌的实质断言）"
    command: "./test_libydpdict"
  - file: test_ydpdict_e2e.c
    description: "鸿蒙特有端到端消费者用例（rule12）：按上游 mkdict.py 二进制格式生成真实 dict999.dat/idx 文件对，走 open → get_count → find_word → get_word（含 windows-1250 高位字节→UTF-8 转换验证）→ read_rtf（释义正文）→ close 完整生命周期，非纯断言"
    command: "./test_ydpdict_e2e"

# 测试断言总数 (实测, 用于质量评估)
assertion_count: 9

# 鸿蒙特有端到端消费者用例断言数（test_ydpdict_e2e.c 中的 check() 调用数，实测 14/14）
e2e_assertion_count: 14

# 鸿蒙特有测试：完整消费者用例（rule12 —— 非纯断言，真实走通功能/流程）
harmony_specific_tests:
  - file: test_ydpdict_e2e.c
    kind: consumer-e2e
    command: "./test_ydpdict_e2e"
    executed_by: "test_package/conanfile.py test()"
