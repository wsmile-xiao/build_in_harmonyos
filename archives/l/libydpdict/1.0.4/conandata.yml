# conandata.yml — libydpdict 1.0.4

sources:
  url: "https://github.com/wojtekka/libydpdict/releases/download/1.0.4/libydpdict-1.0.4.tar.gz"
  sha256: "37dcbc12def981a20728bdcb6a5ff1eef8931f29a0f16852f0b2201ff8563528"

# 上游发布包自带的 ltmain.sh 来自 libtool 2.2.6b（Debian 重打包），而其 aclocal.m4
# 声明的是 libtool 2.4（package_revision=1.3293）。据此生成的 libtool 缺少
# func_dirname / func_basename / func_stripname / func_opt_split 等 9 个内建函数，
# 链接期报 "func_opt_split: inaccessible or not found" / "Version mismatch error"
# （知识条目草稿 knowledge/drafts/E543-draft-A443.kv）。
# 这里额外取 GNU libtool 2.4 官方发行包内与 aclocal.m4 版本精确匹配的 ltmain.sh，
# 在 source() 中覆盖上游残缺文件；官方包本身不参与编译。
libtool_source:
  url: "https://ftpmirror.gnu.org/libtool/libtool-2.4.tar.gz"
  sha256: "13df57ab63a94e196c5d6e95d64e53262834fe780d5e82c28f177f9f71ddf62e"

patches:
  "1.0.4":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "config.guess: 补充 HarmonyOS 分支，识别 aarch64-unknown-linux-ohos (E007)"
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "config.sub: 接受 linux-ohos 三元组与 aarch64 CPU (E007)"
      patch_type: "portability"
