# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: libydpdict/1.0.4
homepage: "https://toxygen.net/ydpdict/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# ── 上游测试清点结论：libydpdict 1.0.4 发布包不含任何测试 ──
# 清点证据（对官方 tarball 全量扫描，sha256 见 conandata.yml）：
#   1. 包内 40 个成员无 tests/ test/ tcase/ 目录，无 *test* 源文件；
#   2. Makefile.am、src/Makefile.am、include/Makefile.am、pkgconfig/Makefile.am、
#      misc/Makefile.am 均无 TESTS / check_PROGRAMS / check: 目标（make -n check
#      无可执行内容）；
#   3. 包内无 CI 配置（无 .github/、无 .travis.yml），上游仓库亦无自动化测试。
# 因此无法运行上游测试用例；覆盖率由 test_package 的消费者测试承担。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用真实 API：版本宏、windows-1250/音标/上标 → UTF-8 转换结果、NULL 句柄边界、缺失词典文件 open 失败路径（非线性堆砌的实质断言）"
    command: "./test_libydpdict"
  - file: test_ydpdict_e2e.c
    description: "鸿蒙特有端到端消费者用例（rule12）：按上游 mkdict.py 二进制格式生成真实 dict999.dat/idx 文件对，走 open → get_count → find_word → get_word（含 windows-1250 高位字节→UTF-8 转换验证）→ close 完整生命周期，非纯断言"
    command: "./test_ydpdict_e2e"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9

# 鸿蒙特有端到端消费者用例断言数（test_ydpdict_e2e.c 中的 check() 调用数，实测 14/14）
e2e_assertion_count: 14

# 鸿蒙特有测试：完整消费者用例（rule12 —— 非纯断言，真实走通功能/流程）
harmony_specific_tests:
  - file: test_ydpdict_e2e.c
    kind: consumer-e2e
    command: "./test_ydpdict_e2e"
    executed_by: "test_package/conanfile.py test()"
