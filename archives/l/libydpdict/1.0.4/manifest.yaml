# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 ltmain.sh(libtool 2.2.6b/Debian 重打包, package_revision=1.3017) 与 aclocal.m4(libtool 2.4, 1.3293) 版本错配：configure 生成的 libtool 缺 func_dirname/func_basename/func_stripname/func_opt_split/func_append 等 9 个内建函数，--mode=link 只产出 .la 不产出 .so 且报 func_*: inaccessible or not found。解法=source() 用 GNU libtool 2.4 官方包内 ltmain.sh 覆盖上游残缺件（草稿 knowledge/drafts/E543-draft-A443.kv）"
  - "同上问题的 libtool 自检报错原文: libtool: Version mismatch error. This is libtool 2.2.6b Debian-2.2.6b-2ubuntu1, but the definition of this LT_INIT comes from libtool 2.4."
  - "profile [buildenv] 导出的 SHELL/CONFIG_SHELL(hnp bash) 优先级高于配方环境：configure 由 /bin/sh(本平台=MIRBSD KSH) 启动并测得 ECHO='print -r --'，而 config.status 由 bash 执行 -> 'print: command not found'(x27) -> 'config.status: error: could not setup config files machinery'。解法=build() 以命令前缀 SHELL=/bin/sh CONFIG_SHELL=/bin/sh 调用 configure（POSIX 前缀赋值优先于环境导出），整条链统一到 /bin/sh"
  - "VPATH(源码外)构建：ydpdict.h 由 ydpdict.h.in 生成到 top_builddir/include，上游 AM_CPPFLAGS 只含 top_srcdir/include -> src/ydpdict.c:29 报 'ydpdict.h' file not found。解法=configure 时 CPPFLAGS 补 -I$PWD/include，随 config.status 进入生成的 Makefile"
  - "config.guess/config.sub 缺 HarmonyOS 分支（E007）：config.guess 报 unable to guess system type、config.sub 报 Invalid configuration 'aarch64-linux-ohos'。上游脚本较旧，E007 脚本自动匹配失败，按 aalib 先例手工补丁（config.guess 补 *:HarmonyOS:*:* 分支，config.sub 补 nto-qnx|linux-gnu|linux-ohos 与 aarch64 列表），两脚本输出 aarch64-unknown-linux-ohos"
  - "本机环境限制（不进配方）：config.status 用 (umask 077 && mktemp -d ./confXXXXXX) 建临时目录，本机 FUSE 挂载按 mode 组位授权（进程 uid 与目录 owner 不同），0700 目录不可写 -> subs1.awk: Permission denied。本机以 ~/usr/local/bin/mktemp 垫片(umask 002)规避；CI worker 不受限"

