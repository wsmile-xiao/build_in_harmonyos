software: libestr
# 版本级 manifest - ARCHIVE-SPEC v2.0

version: "0.1.11"
status: published
build_date: "2026-09-05"
compile_date: "2026-09-05"

source:
  url: "https://github.com/rsyslog/libestr/archive/refs/tags/v0.1.11.tar.gz"
  sha256: "46b53b80f875fd82981d927a45f0c9df9d17ee1d0e29efab76aaa9cd54a46bb4"
  tar_format: tar.gz

build_system: autotools
configure_options: []
dependencies: []
tool_requires:
  - "automake/1.18"
  - "libtool/2.5.4"
cc: clang
cxx: clang++

bootstrap_command: "autoreconf -fiv"

# R6: 只改源文件不改生成文件——conandata.yml 不声明任何补丁
# （autoreconf -fiv 重新生成 config.guess/config.sub，系统 automake 自带 OHOS 支持）
patches_applied: []

knowledge_gained:
  - "GitHub tarball 不含 configure，需 autoreconf -fiv bootstrap"
  - "tool_requires automake/1.18 + libtool/2.5.4 注入：CI clean 环境无系统 automake/libtool 时必须声明（PR #4774 红根因）"
  - "系统 automake 安装 OHOS-aware 的 config.guess/config.sub，无需补丁"
  - "OHOS 交叉编译用 --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos 避免 config.guess 依赖"
  - "install-sh~ 触发 automake BUG.am 虚警，需删除"
