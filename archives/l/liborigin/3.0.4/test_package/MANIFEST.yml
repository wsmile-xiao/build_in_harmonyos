# test_package/MANIFEST.yml
# 上游与消费者测试声明（CI 脚本 build_and_test.sh L0e 强制要求此文件存在）

package: liborigin/3.0.4
homepage: "https://github.com/gerlachs/liborigin"

# 上游测试入口：tests/run-example-import-tests.sh
# 注意：夹具由上游 compile 脚本的 -DGENERATE_CODE_FOR_LOG=1 构建设定生成
# （开启日志时 opj2dat 才打印 "Project has N windows." 与工程树）。
upstream_check_command: "cd tests && OPJ2DAT=../build/opj2dat bash run-example-import-tests.sh（日志构建）"
upstream_test_in_build: false
upstream_test_command: >
  原生探索阶段在设备实跑（见 notes.md「上游测试清点」）。
  conan create 只构建库与 CLI，不在构建内运行上游脚本。

upstream_tests:
  - name: "run-example-import-tests.sh（4 个 .opj 样例）"
    source: "tests/examples/*.opj + *.out.orig + *.1.dat.orig"
    description: >
      对每个样例运行 opj2dat：stdout 与 .out.orig 全量 diff（OUTPUT），
      生成的 .1.dat 与 .1.dat.orig 全量 diff（DATA，crash.opj 上游无参考文件）。
    command: "OPJ2DAT=<build>/opj2dat bash run-example-import-tests.sh"
    expected: "4 个样例 OUTPUT PASS + 3 个样例 DATA PASS，退出码 0"

# 统计口径：单位 = 上游样例（.opj 文件）。每个样例含 1 项 OUTPUT 比对，
# 其中 3 个样例另有 1 项 DATA 比对（合计 7 项比对、全部通过）。
test_statistics:
  total: 4
  passed: 4
  failed: 0
  skipped: 0
  not_run: 0
  unit: "上游样例用例（.opj）"
  environment: >
    设备原生（aarch64 OHOS，clang 15.0.4，GENERATE_CODE_FOR_LOG=1 构建，
    与应用 patches/0001-0005 后的源码树比对）
  evidence: "task-data/liborigin-3.0.4/logs/*-upstream-exact3、*-worktree-fixture-fix-and-tests"

test_package_tests:
  - file: test_package/test_liborigin.cpp
    description: >
      消费者经 find_package(liborigin) 链接安装后的 liborigin::liborigin，
      读取夹具（上游样例 tests/examples/data+graph-7.0.opj 的 base64 文本
      fixtures/data+graph-7.0.opj.b64，构建时解码并校验 SHA-256）：
      校验版本 API（3 项）、解析与项目结构计数（9 项）、工作簿/列元数据（6 项）、
      前 4 行数据值与参考一致、其余行为 _ONAN 缺测标记、dataset(0) 视图一致，共 22 项断言。
    command: "conan create（test_package 构建后运行 test_liborigin <fixture>）"
    expected: "TEST_PACKAGE_OK (22 checks)；exit 0"
    status: "OHOS 原生执行通过（静态与 shared flavor 各一轮，见 notes.md）"

assertion_count: 22
