sources:
  "3.0.4":
    # 官方源：GitHub gerlachs/liborigin（上游唯一开发仓库）3.0.4 标签归档。
    # savannah nongnu 项目页已无发布文件（下载路径 302 到镜像后 404）。
    url:
      - "https://github.com/gerlachs/liborigin/archive/refs/tags/3.0.4.tar.gz"
    sha256: "4e8a3d4fe298a9a4264f86b060a6dbd248dd8fe7c28b81bb88e739c1be8c78e1"

patches:
  "3.0.4":
    # ---- 公共 API 链接修复（OriginFile.cpp）----
    # OriginFile.h:65 声明 liboriginVersionBugfix()，实现却命名为
    # liboriginVersionPatch()（无任何调用者）。按头文件声明的公共 API 调用时
    # 链接失败（本任务 test_package 实测 ld.lld: undefined symbol:
    # liboriginVersionBugfix()）。补丁把定义改名为头文件声明的名字，
    # 返回值不变（LIBORIGIN_VERSION_PATCH）；上游 master 仍存在该不一致。
    - patch_file: "patches/0001-OriginFile.cpp.patch"
      patch_description: "liboriginVersionPatch() 改名为头文件声明的 liboriginVersionBugfix()，消除公共 API 未定义符号"
      patch_type: "bugfix"
    # ---- 上游回归脚手架参考输出同步（仅测试参考文件，不进构建产物）----
    # 3.0.4 标签内的 tests/examples/*.out.orig 仍打印 "opj2dat 3.0.3"，
    # 上游脚本 run-example-import-tests.sh 对整份 stdout 做 diff，
    # 版本横幅不更新则必然失败。上游 master 随后自行修复了同一问题
    # （提交 2ab0436 "tests: fix version in reference output"，2026-07-28），
    # 本补丁与之一致，逐文件仅改第 1 行。
    # PR 正文"上游测试用例修改说明"逐条申报。
    - patch_file: "patches/0002-tests-examples-2folder-with-graphs.opj.out.orig.patch"
      patch_description: "2folder-with-graphs.opj 参考输出横幅 3.0.3 → 3.0.4（同上游 2ab0436）"
      patch_type: "test_fix"
    - patch_file: "patches/0003-tests-examples-crash.opj.out.orig.patch"
      patch_description: "crash.opj 参考输出横幅 3.0.3 → 3.0.4（同上游 2ab0436）"
      patch_type: "test_fix"
    - patch_file: "patches/0004-tests-examples-data+graph-7.0.opj.out.orig.patch"
      patch_description: "data+graph-7.0.opj 参考输出横幅 3.0.3 → 3.0.4（同上游 2ab0436）"
      patch_type: "test_fix"
    - patch_file: "patches/0005-tests-examples-reciprocal-scale-x.opj.out.orig.patch"
      patch_description: "reciprocal-scale-x.opj 参考输出横幅 3.0.3 → 3.0.4（同上游 2ab0436）"
      patch_type: "test_fix"
