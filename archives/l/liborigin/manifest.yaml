{
  "software": "liborigin",
  "display": "liborigin",
  "description": "读取 OriginLab 项目文件（.opj）的 C++ 库，并附 opj2dat 数据导出命令行工具",
  "category": "library",
  "homepage": "https://github.com/gerlachs/liborigin",
  "license": GPL-3.0-or-later,
  "build_system": cmake,

  "ohos_adaptation": {
    "key_points": [
      "os=OHOS 时 Conan 默认 CMAKE_SYSTEM_NAME=HarmonyOS，但 SDK CMake 只有 Modules/Platform/OHOS.cmake（内容为 include(Platform/Linux)）；名字对不上时平台变量留空，CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 为空导致共享库无 DT_SONAME、无版本软链。配方显式设 cmake_system_name=OHOS，设备实测 SONAME=liborigin.so.3 且 liborigin.so.3 → liborigin.so.3.0.4 软链齐全",
      "上游 CMakeLists 默认同时构建静态与动态库（两个目标同名安装）；配方按 Conan shared 选项映射为二选一，保证 package_id 与实际产物一致",
      "OHOS 上 ELF 必须携带有效 .codesign；安装阶段 CMake 清掉可执行文件的构建期 RUNPATH 会使原签名失效（共享版 bin/opj2dat 实测 rc=126 Operation not permitted），package() 中重新自签名",
      "上游 OriginFile.h 声明 liboriginVersionBugfix() 但实现命名 liboriginVersionPatch()，公共 API 链接失败（上游 master 仍未修）；配方 patch 0001 改名对齐头文件声明",
      "上游 tests/examples/*.out.orig 参考输出在 3.0.4 标签内仍印 3.0.3 版本横幅（上游 master 提交 2ab0436 已自行修复）；配方补丁 0002-0005 同步该 4 行，使上游回归脚本可全绿"
    ],
    "common_dependencies": []
  },

  "versions": {
    "3.0.4": {
      "status": built,
      "build_date": "2026-09-17",
      "conan_ref": "liborigin/3.0.4"
    }
  }
}
