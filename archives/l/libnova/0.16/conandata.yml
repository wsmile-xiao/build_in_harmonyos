sources:
  url: "https://deb.debian.org/debian/pool/main/libn/libnova/libnova_0.16.orig.tar.xz"
  sha256: "5dea5b29cba777ab8de4fd30cdfdbc1728fe1b3c573902270c1106bad55439a2"
patches:
  # NB: the version key MUST stay quoted: unquoted 0.16 parses as a YAML
  # float, conan looks it up with the string "0.16", the lookup silently
  # returns nothing and every patch is skipped without any warning.
  "0.16":
    - patch_file: "patches/0001-respect-user-cflags.patch"
      patch_description: "Respect user CFLAGS (conan toolchain flags) instead of hardcoding -Wall/-O3; drop the hardcoded -O3 from src/Makefile.am"
      patch_type: "portability"
    - patch_file: "patches/0002-add-tarball-version.patch"
      patch_description: "Add .tarball-version so git-version-gen reports 0.16 instead of deriving a version from host git state"
      patch_type: "portability"
