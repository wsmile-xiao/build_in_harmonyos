package: libnova/0.16
homepage: "https://libnova.sourceforge.net/"

upstream_check_command: "make lntest -C lntest && cd lntest && ./lntest"
upstream_test_in_build: true
upstream_test_command: "cd lntest && ./lntest"

upstream_tests:
  - name: lntest
    command: "lntest/lntest"
    expected: >-
      340 assertions, 316 pass, 24 fail - all 24 failures verified
      platform-independent (identical values on a second OHOS SDK
      clang 15 / musl sysroot native build on the same aarch64 host);
      only 5 carry independent evidence that the expectation itself
      is wrong (nutation 3, fixed upstream by 7b60adc to the values
      this build computes; Pollux transform 2); the remaining 19
      (solar 3, comets 9, RST 7) are recorded as failures without
      independent recomputation. Recipe parses the [PASSED]/[FAILED]
      output and fails the build on any deviation from 316/24/340.

test_package_tests:
  - file: test.c
    description: >-
      39 checks of the public astronomy API against Meeus (Astronomical
      Algorithms, 2nd ed.) and upstream lntest reference vectors: Julian
      day, angle conversions, sidereal time, nutation, solar, lunar,
      planetary and rise/set/transit computations, with per-algorithm
      numeric tolerances.
    command: "./test_package"
  - file: test_ohos.sh
    description: >-
      OHOS-specific package check (11 fail-closed checkpoints): tool
      availability, packaged library presence, ELF64/little-endian/
      AArch64 identity (REL members for the static archive, DYN for the
      shared library), DT_SONAME == libnova-0.16.so.0 matching the
      installed filename, DT_NEEDED within the musl allowlist (libc.so,
      libm.so, libnova-0.16.so.0) with no GLIBC_* symbols, no
      RPATH/RUNPATH, no build-machine absolute paths in library/headers/
      executable, musl PT_INTERP on the test executable, .codesign
      section via llvm-objcopy + binary-sign-tool self-signing, and a
      signed real-astronomy run on the device (ohos_check.c: JD anchor
      2451545.0 @ 1e-9 d, J2000.0 mean obliquity 23.43929111 deg @
      1e-6, GMST 18.697374558 h @ 1e-6).
    command: "bash test_ohos.sh <package_folder> <ohos_check> <readelf> <llvm-objcopy> <binary-sign-tool>"

assertion_count: 39
