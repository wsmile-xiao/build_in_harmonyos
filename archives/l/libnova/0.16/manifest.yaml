package: libnova
version: "0.16"
homepage: "https://libnova.sourceforge.net/"
license: LGPL-2.0-or-later
status: built
build_system: autotools
build_date: "2026-09-10"

source:
  url: "https://deb.debian.org/debian/pool/main/libn/libnova/libnova_0.16.orig.tar.xz"
  sha256: "5dea5b29cba777ab8de4fd30cdfdbc1728fe1b3c573902270c1106bad55439a2"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"
  cc: clang

patches_applied:
  - "0001-respect-user-cflags.patch"
  - "0002-add-tarball-version.patch"

upstream_tests:
  command: "make lntest -C lntest && cd lntest && ./lntest"
  test_count: 0
  notes: >-
    Upstream registers ZERO formal `make check` test cases: no TESTS or
    check_PROGRAMS primary exists in any Makefile.am. lntest is a
    noinst_PROGRAMS diagnostic program (340 internal checks) never wired
    into the automake check target, so it is built and run explicitly by
    the recipe and its textual [PASSED]/[FAILED] output parsed fail-closed
    (316 passed / 24 failed required exactly).

test_package:
  assertion_count: 39
  description: "39 checks of the public astronomy API against Meeus (Astronomical Algorithms, 2nd ed.) and upstream lntest reference vectors with per-algorithm tolerances; plus test_ohos.sh, 11 fail-closed OHOS package checkpoints (ELF/SONAME/NEEDED/glibc/RPATH/absolute-path/codesign + signed on-device astronomy run)."

knowledge_gained:
  - "Upstream 0.16 has no downloadable release tarball any more (SourceForge files area gone); the Debian orig tarball is byte-identical to the v0.16 git tag (diff -r empty) and is used instead."
  - "The tarball ships no configure/Makefile.in and no config.guess/config.sub: autoreconf recipe with tool_requires automake/1.18 + libtool/2.5.4; automake's config.guess (2024-07-27) cannot identify the HarmonyOS host (uname -s = HarmonyOS), so --build/--host=aarch64-unknown-linux-ohos must be passed explicitly (same as adcli/0.9.2, a52dec/0.7.4)."
  - "configure.ac unconditionally sets CFLAGS=-Wall and src/Makefile.am hardcodes -Wall -O3; patched to respect conan toolchain flags (same cause as Gentoo libnova-0.16.0-cflags.patch)."
  - "AC_INIT derives the version via git-version-gen reading .tarball-version; without the file the packaged version becomes UNKNOWN (patch adds it)."
  - "src/Makefile.am uses -release 0.16 -version-info 0: shared library installs as libnova-0.16.so.0.0.0 with SONAME libnova-0.16.so.0 and NO unversioned libnova.so dev symlink; the recipe creates the symlink so -lnova consumers work (pkg-config name libnova)."
  - "Only dependency is system libm (AC_CHECK_LIB(m,...)); no long double / *l math functions in the sources - double precision throughout."
  - "lntest is noinst_PROGRAMS only - upstream make check runs nothing; the harness main() returns 0 unconditionally, so failures must be detected by parsing [PASSED]/[FAILED] text, not the exit code."
  - "24 of 340 lntest expectations fail identically on every toolchain/platform audited (platform-independent, NOT OHOS regressions); only 5 carry independent evidence of stale expectations (3 nutation fixed upstream by commit 7b60adc, 2 Pollux contradicted by an epoch-correct Meeus 22.2 reduction); the other 19 are reported honestly as failures."
