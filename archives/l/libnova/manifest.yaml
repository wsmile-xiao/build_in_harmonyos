software: libnova
display_name: libnova - 天文动力学计算库
category: scientific

description: |
  libnova 是一个天文动力学计算库，用于天体位置计算、轨道预测等。
  提供 Julian Day 计算、行星位置、卫星轨道等功能。
  是 INDI 协议天文仪器软件的关键依赖。

license: LGPL-2.1
homepage: https://github.com/JohannesBuchner/libnova

