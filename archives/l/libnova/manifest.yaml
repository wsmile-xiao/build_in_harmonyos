software: libnova
display: "libnova"
description: "C 语言天体力学与天文计算库：儒略日、坐标转换、岁差章动、太阳系天体位置与物理星历"
category: math
homepage: "https://libnova.sourceforge.net/"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 0.16 已无官方发布 tarball（SourceForge files 区下线，仅剩 v0.16 git tag）；Debian orig tarball 与该 tag 逐文件一致（diff -r 为空），SHA256 固定于 conandata.yml"
    - "tarball 无 configure/Makefile.in/config.guess/config.sub：autoreconf 型配方（tool_requires automake/1.18 + libtool/2.5.4）；automake 的 config.guess（2024-07-27）识别不了 HarmonyOS 宿主（uname -s = HarmonyOS，实测退出 1），必须显式传 --build/--host=aarch64-unknown-linux-ohos（同 adcli/0.9.2、a52dec/0.7.4）"
    - "上游以 -release 0.16 控制产物名：共享库为 libnova-0.16.so.0.0.0（SONAME libnova-0.16.so.0），无 libnova.so 开发符号链接，配方在 package() 补建供 -lnova 消费方使用"
    - "lntest 仅为 noinst_PROGRAMS：上游 make check 正式注册测试数为 0；harness main() 无条件 return 0，失败必须靠解析 [PASSED]/[FAILED] 文本而非退出码"
  common_dependencies: []

versions:
  "0.16":
    status: built
    build_date: "2026-09-10"
    conan_ref: "libnova/0.16"
