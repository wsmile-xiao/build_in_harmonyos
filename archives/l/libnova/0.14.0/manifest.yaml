software: libnova
# 版本级 manifest.yaml
# 文件位置: archives/l/libnova/0.14.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.14.0"
status: published
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/JohannesBuchner/libnova"
  sha256: ""
  tar_format: tar.gz
  origin: JohannesBuchner-libnova-0ae301a

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure-umask-077-fix.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E011: HMDFS 文件系统 umask 077 权限问题，需在 configure 前修改为 umask 022"
  - "libnova 使用 autotools 构建系统，源码来自 Johannes Buchner fork"
  - "编译警告不影响功能（lunar.c 未使用变量）"

# ============================================================
# 质量门禁
# ============================================================

quality_gates:
  G0_compilation_success: true
  G1_basic_installation: true
  G2_library_files_present: true
  G3_header_files_present: true
  G4_elf_signature: partial

# ============================================================
# 安装产物
# ============================================================

install_artifacts:
  shared_library:
    - lib/libnova-0.14.so.0.0.0
    - lib/libnova.so
    - lib/libnova-0.14.so.0
  static_library:
    - lib/libnova.a
  headers:
    - include/libnova/*.h (32 files)