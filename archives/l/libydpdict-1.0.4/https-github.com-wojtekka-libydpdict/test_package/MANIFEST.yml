package: libydpdict-1.0.4/https-github.com-wojtekka-libydpdict
homepage: "https://github.com/wojtekka/libydpdict"
upstream_check_command: "make check && make -C misc check"
upstream_test_in_build: true
upstream_test_command: "make check && make -C misc check; YDPDICT_TEST_DIR=upstream-fixtures misc/ydpstress; YDPDICT_TEST_DIR=upstream-fixtures misc/ydptest; YDPDICT_TEST_DIR=upstream-fixtures misc/ydpxml; misc/gentable"
# misc/Makefile.am declares four check_PROGRAMS, but no Automake TESTS.
# The three dictionary readers use synthetic fixtures; commercial data is absent.
upstream_tests:
  - ydpstress
  - ydptest
  - ydpxml
  - gentable
test_package_tests:
  - file: test.c
    description: "Real conversion APIs and invalid input boundaries"
    command: "./test_libydpdict"
  - file: test_ydpdict_e2e.c
    description: "Write dictionary files, open, search, read definitions and close"
    command: "./test_ydpdict_e2e"
  - file: test_harmony_storage.c
    description: "HarmonyOS kernel and user storage: Unicode paths, installation rename, lookup, reopen and cleanup"
    command: "./test_harmony_storage"
assertion_count: 9
e2e_assertion_count: 13
harmony_specific_tests:
  - file: test_harmony_storage.c
    kind: consumer-e2e
    command: "./test_harmony_storage"
    executed_by: "test_package/conanfile.py test() on OHOS"
