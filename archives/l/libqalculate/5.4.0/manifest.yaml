knowledge_gained:
  - "libqalculate 所有版本均不支持 CMake 构建"
  - "TMPDIR 必须设置为 ~/tmp 绕过 HMDFS SELinux 问题"
  - "config.guess/config.sub 需更新以支持 OHOS 三元组"
  - "libxml2 是必需依赖，不可禁用"
  - "libcurl 和 ICU 是可选依赖，可通过 configure 选项禁用"
  - "必须链接 clang_rt.builtins.a 以解决 __extenddftf2/__getf2 符号缺失问题"

