software: libqalculate
display: "libqalculate"
description: "Library for precise calculations, unit conversion and other functionality"
category: math
homepage: "https://qalculate.github.io/"
license: GPL-2.0

ohos_adaptation:
  key_points:
    - "构建系统：autotools（自带 configure，无需 autoreconf）"
    - "config.guess 需添加 HarmonyOS 检测分支（aarch64-HarmonyOS -> aarch64-unknown-linux-gnu）"
    - "configure 需跳过 intltool XML::Parser 检查（OHOS 无该 perl 模块）；data/*.xml.in 用 intltool-merge shim（perl 去 _ 翻译标记）替代"
    - "configure 需移除 umask 077 临时目录创建（HMDFS 兼容）"
    - "pthread_cancel/setcancelstate/setcanceltype 在 OHOS musl 不可用，用 HAVE_PTHREAD_* 宏守卫（feature-detection 判定）"
    - "构建期 C++ 工具需显式注入 LD_LIBRARY_PATH 含 SDK libc++（conanbuild 沙箱不自动提供）"
  common_dependencies:
    - gmp
    - mpfr
    - libxml2
    - readline

versions:
  "5.4.0":
    status: published
    build_date: "2026-05-26"
  "5.8.2-r0":
    status: built
    build_date: "2026-09-02"
