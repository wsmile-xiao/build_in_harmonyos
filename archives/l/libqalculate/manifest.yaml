software: libqalculate
display: "libqalculate"
description: "Library for precise calculations, unit conversion and other functionality"
category: math
homepage: "https://qalculate.github.io/"
license: GPL-2.0

ohos_adaptation:
  key_points:
    - "不支持 CMake 构建，仅支持 autotools"
    - "需要修改 configure shebang 为 /usr/bin/env bash（toybox sh 不支持 autotools）"
    - "XML::Parser XS 模块因 HMDFS dlopen 限制无法加载，需用 cp 替代 intltool-merge"
    - "umask 077 导致临时目录不可写，需改为 umask 022"
    - "pthread_cancel 函数不支持，需条件编译跳过"
  common_dependencies:
    - gmp
    - mpfr
    - libxml2

versions:
  "5.4.0":
    status: published
    build_date: "2026-05-26"