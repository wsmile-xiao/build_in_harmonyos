# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Autotools 依赖注入不用 AutotoolsDeps/VirtualRunEnv：-l 污染 configure 早期 conftest 运行（$?=127），LD_LIBRARY_PATH 会劫持 lld 的 SDK libxml2（SONAME 冲突）"
  - "构建期 C++ 工具（fixpo 等）依赖 libc++_shared.so，conanbuild 沙箱不自动提供，build() 内 os.environ 显式注入 SDK llvm/lib + /system/lib64"
  - "conan 包 .la 的 libdir='//lib' 需跨包映射修复（mpfr.la 引用 gmp.la 要解析到 gmp 包真实路径）"
  - "test_package 需显式 requires 传递依赖（libqalculate 头文件直接 include gmp.h 等），否则 CMakeDeps 不生成配置、include 路径丢失"
  - "pthread_cancel feature-detection 必须加 -Werror=implicit-function-declaration，否则 C 隐式声明导致误判可用"

