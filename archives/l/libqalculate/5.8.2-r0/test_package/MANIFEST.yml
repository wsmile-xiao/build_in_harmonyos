# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libqalculate/5.8.2-r0
homepage: "https://qalculate.github.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试（上游 test 在探索阶段
# make check 已全量通过 1/1，见 notes.md；配方 build() 未内嵌 make check）
upstream_test_in_build: false
upstream_test_command: "make check（探索阶段执行，1/1 PASS）"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/unittest.cc
    source: libqalculate-5.8.2/src/unittest.cc
    description: "上游单元测试（1+2*6 等算术表达式计算验证）"
    command: "./src/unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：创建 Calculator 实例并执行 1+2*6 验证库可链接可用"
    command: "./test_libqalculate"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1