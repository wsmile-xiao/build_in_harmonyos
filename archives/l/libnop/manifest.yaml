# 软件级 manifest — archives/l/libnop/manifest.yaml

software: libnop
display: "libnop"
description: "Native Object Protocols：头文件式 C++ 序列化 / RPC 框架"
category: library
homepage: "https://github.com/google/libnop"
license: Apache-2.0
build_system: header-only

ohos_adaptation:
  key_points:
    - "纯头文件、无依赖：header-library + no_copy_source + package_id().clear()；62 个头文件按 include/nop/** 安装"
    - "copy() 必须用 package_folder 绝对 dst（相对 dst 会导致空包）"
    - "上游 GoogleTest 套件（315 用例）在真机运行：test_requires gtest/gmock，靠 GTEST_INCLUDE/GTEST_LIB 变量注入上游 Makefile"
    - "必须覆盖上游 HOST_CXXFLAGS=-std=c++14 为 -std=c++17（gtest 1.17 要求），并去掉 -Werror"
    - "test_requires 的包目录用 self.dependencies[name] 获取（不在 .build 集合）"
    - "版本 `0.0-git20211103.35e800d` 是 Debian `0.0~git20211103.35e800d` 的 Conan 形式"
  common_dependencies: []

versions:
  "0.0-git20211103.35e800d":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libnop/0.0-git20211103.35e800d"
