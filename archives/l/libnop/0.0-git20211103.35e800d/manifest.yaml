knowledge_gained:
  - "上游自带 GoogleTest/GoogleMock 套件可以在 OHOS 上原样跑通：test_requires(\"gtest/1.17.0\")+gmock 后，用 self.dependencies[\"gtest\"]（而非 self.dependencies.build[...]）取包目录"
  - "Makefile 型上游测试套件用变量注入即可对接 Conan 包：GTEST_INCLUDE/GTEST_LIB 传 -I/-L 列表，-j1；运行期用 LD_LIBRARY_PATH 指向 gtest/gmock 的 lib 目录"
  - "gtest 1.17 要求 C++17，而上游 Makefile 写死 HOST_CXXFLAGS=-std=c++14 → 必须覆盖为 -std=c++17（否则 #error C++ versions less than C++17 are not supported）"
  - "上游 -Werror 与第三方 gtest 头文件在 clang 下不兼容：保留 -Wextra、去掉 -Werror（并在文档说明）"
  - "纯头文件库：package_type=header-library + no_copy_source + package_id().clear()，copy 必须用 package_folder 绝对路径；62 个头文件按 include/nop/** 层级安装"
