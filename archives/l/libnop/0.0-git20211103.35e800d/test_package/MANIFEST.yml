# test_package/MANIFEST.yml
# libnop 0.0-git20211103.35e800d.
#
# Upstream ships a GoogleTest/GoogleMock suite under test/ (20 files) plus the
# examples.  The recipe build() builds that suite against Conan's
# gtest/gmock test_requires and executes it on the device, failing the build if
# any case fails; consumer coverage is provided by a CMake program over the
# installed headers.

package: libnop/0.0-git20211103.35e800d
homepage: https://github.com/google/libnop

upstream_tests_exist: true
upstream_test_audit: "test/*.cpp GoogleTest suite (20 files, gtest+gmock); built by the upstream Makefile when gtest is found"\nupstream_test_count: 315\nupstream_tests_passed: 315\nupstream_tests_failed: 0
upstream_check_command: "make (builds out/test) && out/test"
upstream_test_in_build: true
upstream_test_command: "LD_LIBRARY_PATH=<gtest+gmock> out/test"

test_package_tests:
  - file: test_libnop.cpp
    description: "includes the installed headers and round-trips int/std::string/std::vector/annotated struct/Optional through Serializer+Deserializer, checks deterministic non-empty output and clean failure on truncated input"
    command: "./libnop_consumer"

test_files:
  - path: "test_package/test_libnop.cpp"
    test_type: "R34"
    assertion_count: 8

test_package_test_count: 1
consumer_assertion_count: 8
assertion_count: 8
