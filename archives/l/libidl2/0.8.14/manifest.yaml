# 版本级 manifest
# 文件位置: archives/l/libidl2/0.8.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.14"

# 软件名
software: "libidl2"

# 编译状态
# published | built | failed | archived
# 本地 macOS 原生验证通过；OHOS 真机/CI 验证后由 finish 更新为 published
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/libIDL/0.8/libIDL-0.8.14.tar.bz2"

  # 源码校验和
  sha256: "c5d24d8c096546353fbc7cedf208392d5a02afe9d56ebcc1cccb258d7c4d2220"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--enable-static"
  - "--disable-shared"
  - "--host=aarch64-linux-ohos"
  - "--build=aarch64-linux-ohos"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - glib/2.84.0.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-config.sub-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libIDL 0.8.14 的 config.sub（2008 版）不识别 aarch64-linux-ohos triplet，需补丁添加 linux-ohos OS 族、aarch64 CPU 与 -linux-ohos 后缀；OHOS 构建时显式传 --host/--build ref: E072"
- "configure.in 硬性要求 flex（AM_PROG_LEX）与 yacc（AC_PROG_YACC）重新生成 lexer.c/parser.c；CI 无系统 flex/bison，OHOS 构建用 tool_requires flex/2.6.4 + bison/3.8.2 ref: E543"
- "上游测试仅 tstidl 一个测试程序（noinst_PROGRAMS，无 make check 目标）；消费者验证在 test_package 中通过 IDL_parse_filename 实质调用库 API ref: E543"
- "libIDL-config-2 为过时 config 脚本（已被 pkg-config 取代），打包时删除避免触发 commands.json 判定 ref: E424"
