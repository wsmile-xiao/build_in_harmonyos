  url:
    - "https://mirrors.ustc.edu.cn/gnome/sources/libIDL/0.8/libIDL-0.8.14.tar.bz2"
    - "https://mirrors.tuna.tsinghua.edu.cn/gnome/sources/libIDL/0.8/libIDL-0.8.14.tar.bz2"
