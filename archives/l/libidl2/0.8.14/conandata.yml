  sha256: "c5d24d8c096546353fbc7cedf208392d5a02afe9d56ebcc1cccb258d7c4d2220"

patches:
  - patch_file: "patches/0001-config.sub-ohos.patch"
    patch_description: "Allow Autoconf config.sub to validate aarch64-linux-ohos triplets (adds linux-ohos OS family, aarch64 CPU, -linux-ohos suffix)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-cross-compile-guint64.patch"
    patch_description: "configure: take libIDL_cv_long_long_format=ll instead of aborting when cross compiling (guint64 printf/scanf format probe is an AC_TRY_RUN)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask-022.patch"
    patch_description: "Use umask 022 for the config.status tmp dir (HMDFS always sets the setgid bit on new dirs; umask 077 yields drwx--S--- which blocks even the owner, so config.status fails with 'subs1.awk: Permission denied / could not setup config files machinery')"
    patch_type: "portability"
