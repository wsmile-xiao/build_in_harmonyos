# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 计数口径（统一口径，贯穿 MANIFEST / notes / 测试日志 / PR 表格）：
#   - 上游用例数按"测试程序数"计：上游仅 tstidl 一个测试程序
#     （Makefile.am noinst_PROGRAMS，无 make check/TESTS 目标），
#     本地 macOS 实际运行验证通过 1/1。
#   - 适配后用例数按"测试程序数"计：test_package 消费者测试 1 个
#     （test.c，实质调用 IDL_parse_filename / IDL_tree_walk_in_order /
#     IDL_tree_to_IDL）；其中同一 test.c 在 OHOS worker 上由 OHOS 工具链
#     编译、链接 OHOS glib 并运行，构成鸿蒙特有测试 N=1（rule12）。

package: libidl2/0.8.14
homepage: "https://gitlab.gnome.org/Archive/libidl"

# 上游无 make check 目标（Makefile.am 无 TESTS/check_PROGRAMS），
# 唯一测试程序为 tstidl（tstidl.c，noinst_PROGRAMS）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（按测试程序数计数，共 1）
upstream_tests:
  - file: tstidl.c
    source: libidl2-0.8.14/tstidl.c
    description: "libIDL IDL 解析测试程序（解析 IDL 文件并输出 repo id/常量/标识符/树还原）"
    command: "./tstidl <file>

# test_package 中自带的测试 (消费者视角验证；OHOS 上运行即鸿蒙特有测试)
test_package_tests:
  - file: test.c
    description: "消费者测试：IDL_parse_filename 解析 IDL 定义、遍历接口节点、IDL_tree_to_IDL 还原；OHOS 构建时验证 __OHOS__ 平台宏与 OHOS 平台消费"
    command: "./test_libidl2"

# 测试断言总数（test.c 关键检查项：parse 成功 / 接口节点存在 / tree 还原输出 / __OHOS__ 宏）
assertion_count: 4
