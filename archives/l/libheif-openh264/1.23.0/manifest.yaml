software: libheif-openh264
# 版本级 manifest — 文件位置: archives/l/libheif-openh264/1.23.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "1.23.0"
conan_ref: "libheif-openh264/1.23.0"

# published | built | failed | archived
# O5：只有 release upload 已确认才可标 published，此前一律 built。
status: built

build_date: "2026-09-20"

# 构建系统类型（verify-build 要求的顶层字段）
# 注：init-build 的自动探测把它记成 autotools，实际是 CMake（顶层 CMakeLists.txt +
# CMakePresets.json，无 configure.ac/Makefile.am）——以人工核对为准。
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 父 tarball（本包是其中树内子模块：CMake 目标 heif-openh264dec）
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # cmake 选项（与 conanfile.py generate() 一致；由 CMakeToolchain 下发的 -D 变量）
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"                  # 插件 dlopen 语义要求宿主为共享库
    - "-DENABLE_PLUGIN_LOADING=ON"              # 交付面必要条件：插件模块形态
    - "-DWITH_OpenH264_DECODER=ON"              # 交付面：OpenH264（AVC）解码后端
    - "-DWITH_OpenH264_DECODER_PLUGIN=ON"       # 交付面：以独立插件模块构建
                                                #   （→ libheif/libheif-openh264dec.so）
    - "-DWITH_LIBDE265=OFF"
    - "-DWITH_X265=OFF"
    - "-DWITH_X264=OFF"
    - "-DWITH_AOM_DECODER=OFF"
    - "-DWITH_AOM_ENCODER=OFF"
    - "-DWITH_DAV1D=OFF"
    - "-DWITH_KVAZAAR=OFF"
    - "-DWITH_UVG266=OFF"
    - "-DWITH_VVDEC=OFF"
    - "-DWITH_VVENC=OFF"
    - "-DWITH_FFMPEG_DECODER=OFF"
    - "-DWITH_RAV1E=OFF"
    - "-DWITH_SvtEnc=OFF"
    - "-DWITH_JPEG_DECODER=OFF"
    - "-DWITH_JPEG_ENCODER=OFF"
    - "-DWITH_OpenJPEG_DECODER=OFF"
    - "-DWITH_OpenJPEG_ENCODER=OFF"
    - "-DWITH_OPENJPH_ENCODER=OFF"
    - "-DWITH_LIBSHARPYUV=OFF"
    - "-DWITH_UNCOMPRESSED_CODEC=OFF"
    - "-DWITH_WEBCODECS=OFF"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_GDK_PIXBUF=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_DOCUMENTATION=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DOpenH264_INCLUDE_DIR=<openh264 包的 include 绝对路径>"  # generate() 从 Conan 依赖解析
    - "-DOpenH264_LIBRARY=<openh264 包的 lib/libopenh264.so 绝对路径>"  # 同上

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openh264/2.6.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libheif 1.23.0 的编解码后端是可独立装载的 CMake MODULE 插件：树内目标 heif-<name> → 产物 libheif-<name>.so，装在 <libdir>/libheif/；插件名带 dec/enc 后缀（openh264dec / j2kdec / aomdec），与仓库包名 libheif-<codec> 不同名，判定交付面必须看上游目标名"  # knowledge_ref: E619
  - "插件交付面的开关是三件套，缺一即退化成「后端静态编入宿主」：ENABLE_PLUGIN_LOADING + WITH_<CODEC> + WITH_<CODEC>_PLUGIN。libheif/plugins/CMakeLists.txt 的 plugin_compilation() 一个宏里同时含动态分支（add_library MODULE）与静态分支（target_sources(heif ...)），产物形态完全不同"  # knowledge_ref: E619
  - "libheif 插件模块无法脱离宿主：动态分支里有 target_link_libraries(heif-<name> PRIVATE ... heif)，插件 DT_NEEDED 宿主 libheif.so，且必须由宿主 heif_init() 扫插件目录 dlopen 才能注册后端。仓库既有 libheif/1.22.2 是 ENABLE_PLUGIN_LOADING=OFF 的 codec-free 核心，装不了插件，不能当子包依赖"  # knowledge_ref: E619
  - "libheif 的默认插件目录被编译期钉死：heif_version.h.in 的 LIBHEIF_PLUGIN_DIRECTORY=\"@PLUGIN_DIRECTORY@\"（= 构建时 CMAKE_INSTALL_FULL_LIBDIR/libheif 的绝对路径），跨 Conan 缓存/跨机不可移植。必须用 package_info() 的 runenv_info 导出 LIBHEIF_PLUGIN_PATH（libheif/init.cc:62 只在环境变量为空时才回退到编译期默认值；heif_library.h 注释里的复数 PATHS 是过期文档）"  # knowledge_ref: E619
  - "上游 cmake/modules/FindOpenH264.cmake 是 MODULE 模式（libfind_pkg_check_modules(openh264) + 无 HINTS 的 find_path(NAMES wels/codec_api.h)/find_library(NAMES libopenh264 openh264)），不认 CMakeDeps 生成的 openh264-config.cmake；在 Conan 里要用 cache 变量 OpenH264_INCLUDE_DIR/OpenH264_LIBRARY 直接钉住依赖路径，否则可能命中设备系统库或依赖 pkg-config 是否可用"  # knowledge_ref: E619
  - "子包（父 tarball 内子模块）的上游 N 必须按父 tarball 全量注册面清点并取用例/注册类最大值：libheif 1.23.0 的 Catch2 TEST_CASE = 217，而 CTest add_test 只有 39（全开关上限）、测试源文件 41 —— 只按 ctest 口径申报会被判少报（rule4）"  # knowledge_ref: E619
  - "鸿蒙 PC 上被 dlopen 的插件 .so 与宿主 .so 都要重签：上游 install(TARGETS ... LIBRARY DESTINATION ...) 与 conan 复制都会破坏链接器自签，package() 里必须用 /data/service/hnp/bin/{llvm-objcopy,binary-sign-tool} 对 lib/**/*.so* 重签，否则运行期 dlopen 报 Permission denied"  # knowledge_ref: E619
