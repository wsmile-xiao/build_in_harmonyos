# conandata.yml — libheif-openh264 1.23.0
#
# 源码 = 上游 libheif 1.23.0 官方 tag 归档（R39：官方源）。
# 本包是**同一 tarball 内的子模块**：OpenH264（H.264/AVC）解码后端插件，
# 源文件在树内 libheif/plugins/decoder_openh264.{cc,h}，
# 由 CMakeLists.txt:200 的 plugin_option(OpenH264_DECODER ...) 与
# libheif/plugins/CMakeLists.txt 的 plugin_compilation(openh264dec …) 生成
# CMake 目标 heif-openh264dec → 产物 libheif-openh264dec.so。
# 版本号取父 tarball 版本（同批先例：libheif-libde265 1.23.0 ← libheif 1.23.0）。
#
# sha256 为设备实测值：与本批同族任务的 tarball 离线种子逐字节一致
# （$HOME/tmp/libheif-libde265-1.23.0/upstream/libheif-1.23.0.tar.gz，
#  本地 sha256sum 计算 + init-build 离线种子复算）。

sources:
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"

# 无补丁：本包不需要平台适配补丁。
#   * OpenH264 的 OHOS 平台问题（meson system=harmonyos 白名单、llvm-ar 注入、
#     XPM 代码签名）已在依赖 openh264/2.6.0 内解决，复用即继承；
#   * FindOpenH264.cmake 的探测路径由配方 generate() 用 cache 变量直接钉住，
#     不改上游源码；
#   * 后端开关全部由 CMakeToolchain 下发（R33），不改上游 CMakeLists。
patches: {}
