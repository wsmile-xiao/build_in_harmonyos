# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libheif-openh264/1.23.0
homepage: "https://github.com/strukturag/libheif"

# 上游测试命令（父 tarball libheif 1.23.0 的 CTest 入口；本包构建未启用 BUILD_TESTING）
upstream_check_command: "ctest   # 需 -DBUILD_TESTING=ON，本包交付面不含上游测试目标"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游用例清点（rule4）：主 N 取「用例/注册类」候选口径的最大值，全部口径带单位
upstream_test_counts:
  unit: 217
  integration: 0
  other: 0
  total: 217
  basis: >-
    父 tarball（libheif 1.23.0，sha256 50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a）
    全量注册面。候选口径逐项读数（取数命令见 notes.md「上游测试清点」）：
    a) Catch2 TEST_CASE 注册数 = 217（tests/*.cc 39 个文件含用例，取数
       grep -rho 'TEST_CASE' tests/*.cc | wc -l）——用例/注册类最大值，即主 N；
       TEST_CASE_METHOD = 0、SCENARIO = 0、SCENARIO_METHOD = 0（另三种 Catch2 注册宏，本树未用）；
    b) CTest add_test 注册数（全开关上限）= 39（tests/CMakeLists.txt 的 add_libheif_test 38 处
       + add_heifio_test 1 处，多处受 WITH_REDUCED_VISIBILITY/ENABLE_EXPERIMENTAL_FEATURES/
       WITH_UNCOMPRESSED_CODEC/WITH_OPENJPH_ENCODER/WITH_OpenJPEG_ENCODER 条件门控，故 39 是上限）；
    c) 测试可执行目标（同 b，全开关上限）= 39；(d) 测试源文件 = 41 个 .cc
       （含 main.cc / test_utils.cc / catch_amalgamated.cpp 三个不含用例的文件）；
    e) 断言宏（REQUIRE*/CHECK*/CHECKED_*）= 4016（REQUIRE( 3994 + CHECK( 18 + REQUIRE_FALSE( 4）
       —— 属**另一单位**，只披露、不并入 N。
    另有 GENERATE( 站点 43 处、SECTION( 站点 5 处（Catch2 运行期再展开），属运行期展开倍数，
    不构成新的注册单位。
  in_surface_scope: "libheif/plugins/decoder_openh264.cc（上游目标 heif-openh264dec → libheif-openh264dec.so）"
  in_surface_executed: 0
  not_run: 217
  harmony_specific: 14

# 上游实际运行的测试程序（本包交付面内没有上游测试目标）
upstream_tests:
  - file: N/A
    source: libheif-1.23.0/tests
    description: >-
      本包交付面是上游树内的 OpenH264 解码后端插件（CMake 目标 heif-openh264dec），
      上游 tests/ 下的 39 个测试目标不被 install()、不属交付面；上游把 BUILD_TESTING 默认置 ON，
      但启用它会额外要求 heifio 的 TIFF/JPEG/PNG/WEBP 探测与 x265/aom/openjpeg 等
      本包未适配、未发布的编码/解码后端（R36），且会为凑数而放开与交付面无关的构建开关，
      因此本包按 BUILD_TESTING=OFF 构建，217 项上游用例全部按 NOT_RUN 记账，
      逐项归因见 notes.md「上游测试清点」。
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(libheif REQUIRED) + find_package(openh264 REQUIRED) + 链接 libheif::libheif / openh264::openh264（CMakeDeps 生成）"
    command: "cmake --configure"
  - file: test_package/test_libheif_openh264.cpp
    description: >-
      14 项显式检查（check() 调用数，程序自报 checks_total）：宿主版本指纹（1.23.0）、heif_init、插件搜索目录来自
      LIBHEIF_PLUGIN_PATH、heif_have_decoder_for_format(AVC)==1（证明交付的
      libheif-openh264dec.so 被宿主装载并注册）、heif_load_plugins 直载交付目录并
      解析出 decoder 类型 plugin_info、HEVC/AV1 解码器与 AVC 编码器反证、
      openh264 H.264 编码→解码回环（320x240 I420 进出）、context 生命周期、heif_deinit
    command: "./test_libheif_openh264"

# 测试断言总数 (test_libheif_openh264.cpp 中 check() 调用数, 用于质量评估)
assertion_count: 14
