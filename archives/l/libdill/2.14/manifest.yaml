version: "2.14"
software: libdill
upstream:
  homepage: "https://sustrik.github.io/libdill/"
  repo: "https://github.com/sustrik/libdill"
  tag: "2.14"
  source_url: "https://github.com/sustrik/libdill/archive/refs/tags/2.14.tar.gz"
  sha256: "ebba0e5b433ec123b74a57d49b89dfa673aa258e03e6a452959e556b4c4529b9"
  license: "MPL-2.0"
build:
  system: autotools
  bootstrap: autoreconf
  tool_requires:
    - "m4/1.4.19"
    - "autoconf/2.72"
    - "automake/1.18"
    - "libtool/2.5.4"
    - "pkgconf/3.0.5"
  triplet: aarch64-unknown-linux-ohos
  patches:
    - "0001-hardcode-package-version-2.14.patch"
    - "0002-skip-man-subdir.patch"
  configure_options:
    - "--disable-silent-rules"
  system_libs:
    - pthread
  headers:
    - libdill.h
    - libdillimpl.h
  library: libdill
upstream_tests:
  check_programs: 29
  passed: 28
  failed: 1
  failed_test: tests/ipc
  failure_cause: "bind(AF_UNIX path) returns EPERM under HMDFS MAC sandbox (hmmac=use_task); abstract-namespace AF_UNIX and all tcp/udp/thread/signal tests pass — environment restriction, not libdill defect"
  perf_benchmarks: 7
  tutorial_programs: 14
  example_programs: 2
test_package:
  features: ["coroutine", "channel (chmake/chsend/chrecv/chdone)", "now/msleep clock API", "bidirectional echo"]
  network: false
  external_services: false
  random_ports: false
  expected_output: "All checks passed"
