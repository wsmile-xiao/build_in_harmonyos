software: libetonyek-tools
display: "libetonyek command-line converters"
description: "Apple iWork (Keynote/Pages/Numbers) command-line conversion tools built from the libetonyek release"
category: utility
homepage: "https://wiki.documentfoundation.org/Development/libetonyek"
license: LGPL-2.1-or-later OR MPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Packages only bin/ (the nine src/conv/ programs); the library itself is libetonyek/<version>"
    - "Library built in-tree so make check exercises exactly the code the converters link"
    - "liblangtag disabled: publishing-pipeline gap recorded by archives/l/libetonyek/0.1.13; only language tags of text spans are lost"
    - "Upstream cppunit suite (core/detection/streams) runs in build() via make check; a failure fails the package"
  common_dependencies:
    - librevenge/0.0.5
    - libxml2/2.15.3.1
    - zlib/1.3.1

versions:
  "0.1.12":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libetonyek-tools/0.1.12"
