# test_package/MANIFEST.yml — libetonyek-tools 0.1.12
# 上游官方测试声明文件（CI L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md

package: libetonyek-tools/0.1.12
homepage: "https://wiki.documentfoundation.org/Development/libetonyek"

# 上游测试命令：--enable-tests（默认 yes）构建 src/test/，其 Makefile.am 同时写
#   tests = core detection streams
#   check_PROGRAMS = $(tests)
#   TESTS = $(tests)
# 所以 `make check` 会真的跑这三套 cppunit 程序。
upstream_check_command: "make check"

# conanfile.py 的 build() 是否已集成上游测试：是（make -j1 → make -j1 check，
# 测试失败即整包构建失败，不用 --disable-tests 换取打包成功）
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序与用例数（鸿蒙 aarch64 真机实测）
upstream_tests:
  - file: src/test/core
    description: "cppunit 聚合套件：IWA 二进制格式（字段/消息/reader/tokenizer/formula/path/shape/style/transform…）与 libetonyek 工具函数"
    sources: IWAFieldTest.cpp IWAMessageTest.cpp IWAReaderTest.cpp IWORKChainedTokenizerTest.cpp IWORKFormulaTest.cpp IWORKPathTest.cpp IWORKPropertyMapTest.cpp IWORKShapeTest.cpp IWORKStyleTest.cpp IWORKStyleStackTest.cpp IWORKTokenizerBaseTest.cpp IWORKTransformationTest.cpp LibetonyekUtilsTest.cpp
    command: "./core"
    cases: 48
  - file: src/test/detection
    description: "EtonyekDocument::detect 格式识别（对 src/test/data 里的 iWork 语料判类型）"
    sources: EtonyekDocumentTest.cpp
    command: "./detection"
    cases: 4
  - file: src/test/streams
    description: "IWA snappy 流与子目录流读取"
    sources: IWASnappyStreamTest.cpp IWORKSubDirStreamTest.cpp
    command: "./streams"
    cases: 6

# 用例数口径（两条命令都可复跑）
# 1) 声明口径（最大口径，含不参与编译的文件）：
#    grep -rhoE '\bCPPUNIT_TEST(_CASE|_TEMPLATE|_TEMPLATE_ADVANCED)?[[:space:]]*\(' src/test | wc -l
#    → 60
# 2) 真机实跑口径：48 + 4 + 6 = 58
#    差异的 2 个用例全部在 src/test/IWORKLanguageManagerTest.cpp，该文件由
#    src/test/Makefile.am 的 `if WITH_LIBLANGTAG … core_SOURCES +=` 控制；本包按
#    §3.6 走可退化移植传 --without-liblangtag（原因见 0.1.12/notes.md：
#    liblangtag 有档案但未发布到制品仓），因此这 2 个用例不参与编译。
declared_case_count: 60
executed_case_count: 58

# 上游测试结果汇总（真机 conan create，鸿蒙 aarch64，2026-09-20）
# Testsuite summary for libetonyek 0.1.12
# # TOTAL: 3   # PASS: 3   # SKIP: 0   # XFAIL: 0   # FAIL: 0   # ERROR: 0
# （TOTAL=3 是 automake 登记的测试程序数；三套程序内部用例合计 58，全部通过）

# test_package 自带的消费者测试（装包后只用 bin/，不链库不带头文件）
test_package_tests:
  - file: test_package/test_tools.sh
    description: "9 个转换器逐个断言：存在且可执行、ELF64/EM_AARCH64、--version 报 0.1.12、--help/无参数走 printUsage、缺文件与垃圾输入的错误路径"
    command: "bash test_tools.sh <pkg>/bin"
  - file: test_package/test_tools.sh
    description: "格式探测器分流交叉断言：合成的 Numbers XML 必须被 numbers2* 送进 Numbers 处理（报 Parsing failed / CSV Generation failed），而被 pages2*/key2* 报 Unsupported file format —— 两组诊断文本不同，断言非恒真"
    command: "bash test_tools.sh <pkg>/bin"
  - file: test_package/test_tools.sh
    description: "退出码语义区分：--version=0、--help=255(printUsage 的 -1)、转换失败=1，三者互不相同"
    command: "bash test_tools.sh <pkg>/bin"

assertion_count: 67

# 破坏性反向验证（CI L1e / R34，本会话已自行实测）
# 移走包内 bin/ 后重跑 conan test → 第一条断言即失败：
#   [FAIL] bin 目录不存在: .../p/bin
#   TOTAL=1 PASS=0 FAIL=1，NEG_EXIT=1；还原 bin/ 后 TOTAL=67 PASS=67 FAIL=0
negative_validation: "bin/ removed -> conan test exits non-zero at the first assertion"
