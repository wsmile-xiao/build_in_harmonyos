# 版本级 manifest —— libetonyek-tools 0.1.12
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.12"
software: libetonyek-tools

status: built
build_date: "2026-09-20"
build_system: autotools

# ⚠️ 可退化移植（§3.6）：关闭了 liblangtag（详见 build.language_support）
build:
  system: autotools
  language_support:
    liblangtag: disabled
    reason: >-
      沿用 archives/l/libetonyek/0.1.13 的同一结论：archives/l/liblangtag/0.6.4/ 写着
      status: published，但制品仓 `conan list "liblangtag/*" -r=ohpcd` 查不到 →
      属"有档案无发布"的发布流水线缺口（不是缺任务），按 §3.7 上报、本包按 §3.6
      走可退化移植。
    retained:
      - "9 个 iWork 命令行转换器全部构建并安装：key2raw / numbers2raw / pages2raw / key2text / numbers2text / pages2text / numbers2csv / pages2html / key2xhtml"
      - "上游 cppunit 套件 core / detection / streams 三套在 build() 内以 make -j1 check 真跑"
      - "解析→导出全链路（IWA 分片读取、样式/表格/图形/文本解析、librevenge text/spreadsheet/presentation 生成器）"
    removed:
      - "文本段的语言标注：转换输出的 span 不再带 liblangtag 推断的语言标签"
    user_visible_impact: >-
      仅影响解析结果里的语言元数据；文本/表格/幻灯片的转换内容本身不受影响。
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-gnu（build != host 保持交叉模式）"
    - "--prefix=/；--enable-static --disable-shared（转换器把 libetonyek 静态嵌进二进制，本包不对外提供库与头）"
    - "--with-tools：src/conv/{raw,text,csv,html,svg} 的 9 个 bin_PROGRAMS，即本包交付物；package() 若发现没装上会直接 raise"
    - "--enable-tests：构建 src/test/ 的 core/detection/streams，build() 内 make -j1 check 真跑（硬门禁）"
    - "--without-liblangtag：见上 language_support"
    - "--with-mdds=3.0：制品仓 mdds 3.2.1 的头在 include/mdds-3.0，上游默认 2.1"
    - "--without-docs（要 doxygen）；--disable-fuzzers；--disable-dependency-tracking"
    - "CXXFLAGS=-std=c++17：mdds 3.0 头用 std::bool_constant，而项目的 AX_CXX_COMPILE_STDCXX_11 在 clang 15 默认 gnu++14 时不加任何 -std"
    - "REVENGE / REVENGE_GENERATORS / REVENGE_STREAM / XML / ZLIB / MDDS / CPPUNIT 七组 PKG_CHECK_MODULES 变量的 CFLAGS 与 LIBS 两半逐个导出且都非空"
    - "AR=llvm-ar / RANLIB / NM / STRIP / LD=ld.lld 显式导出：交叉三元组下 autoconf 找 aarch64-...-ar/-ld，真机与 CI 都没有该名字，且真机 PATH 无 ar/ld"
    - "SHELL/CONFIG_SHELL 依候选解析（/data/service/hnp/bin/bash → ~/.harmonybrew/bin/bash → bash → /usr/bin/zsh）；umask 077→022；辅助脚本补 +x（E490）；TMPDIR 指向构建目录内 .tmp；CC/CXX 从 profile conf 显式导出"
  dependencies:
    - librevenge/0.0.5
    - libxml2/2.15.3.1
    - zlib/1.3.1
  build_requirements:
    - boost/1.90.0.3（tool_requires，私有头；src/conv 里的 BOOST_FILESYSTEM_LIB 未被 AC_SUBST，展开为空，不需要 boost 库）
    - glm/1.0.3（tool_requires，configure.ac 硬检查）
    - mdds/3.2.1（tool_requires，私有头）
    - cppunit/1.15.1（tool_requires，上游测试套件）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "交叉三元组（build != host）会让 autoconf 用 <host>-ar / <host>-ld 这类带前缀的名字去探测工具，OHOS 设备与 CI worker 都没有这些名字：真机 PATH 里既无 ar 也无 ld，只有 harmonybrew 的 llvm-ar 和 <sdk>/native/llvm/bin/ld.lld。AR 探测退化成 `false` 时 automake 报 “could not determine false interface”，LD 找不到时报 “no acceptable ld found in $PATH”。修法是在构建环境里按“PATH → 编译器同目录”显式导出 AR/RANLIB/NM/STRIP/LD。"
  - "profile [env] 段里已经写了 AR=llvm-ar/RANLIB=llvm-ranlib，但只有走 conan 自己的 runner（self.run / Autotools()，会 source conanbuild.sh）才拿得到；用裸 subprocess 驱动 configure 的配方必须自己导出。"
  - "范本里 “/data/service/hnp/bin/bash” 是 CI worker 才有的路径，真机上按它解析会落到 /usr/bin/zsh；跨设备/CI 的 shell 候选要同时带 ~/.harmonybrew/bin/bash。"
  - "libetonyek 的 9 个转换器由 AC_ARG_WITH([tools]) 控制，且它没有默认值、判定写成 test \"x$with_tools\" != xno → 默认就是构建。所以同库的 libetonyek/<版本> 配方其实也编译了它们；拆成 tools 包时交付物边界要在 package() 里显式收紧（只装 bin/）。"
  - "src/conv/*/Makefile.am 引用 $(BOOST_FILESYSTEM_LIB)/$(BOOST_SYSTEM_LIB) 并不需要 boost 库：configure.ac 只探测 boost 头、没有 AC_SUBST 这两个变量（grep -c BOOST_FILESYSTEM_LIB configure = 0），占位符被替换为空；tools 源码也没用到 boost::filesystem。看到 Makefile.am 里有变量不等于有依赖。"
