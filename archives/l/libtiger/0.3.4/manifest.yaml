version: "0.3.4"
software: libtiger
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/libtiger/libtiger-0.3.4.tar.gz"
  sha256: "7342b255fb476d75b08dd4c56d5ce580f39b1c71c42e99fb7af9d999725d4166"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-doc"
    - "--disable-shared"
    - "--enable-static"
  dependencies:
    - "libkate/0.4.3"
    - "cairo/1.18.4"
    - "pango/1.50.14.1.1"
    # CCI-leaf RREV pin (preflight 2026-09-18): glib's bare libffi/3.4.4
    # resolves to the CCI recipe whose configure fails with
    # "/data/service/hnp/bin/bash: inaccessible or not found" (Error 127);
    # pin the ohpcd-published hardened RREV (ayatana-ido precedent).
    - "libffi/3.4.4#ca8b0eb4102edbca48730e504e3afbdc"
  cc: clang

patches_applied:
  - file: "patches/0001-misc-autotools-config-sub.patch"
    purpose: "Recognize the aarch64 CPU and the linux-ohos target"

portability_notes:
  - "OHOS Autotools builds patch configure's embedded config.status template to use umask 022 and TMPDIR-backed confXXXXXX directories on HMDFS."
  - "Upstream ships no unit/integration tests; `make check` runs 3 check-local lint groups only."

tests:
  upstream_check_local_groups: 3
  upstream_unit_tests: 0
  added_consumer_scenarios: 2
  added_consumer_assertions: 17

knowledge_gained:
  - "2013-era config.sub knows neither aarch64 nor linux-ohos: needs CPU, KERNEL-OS, OS-list and -linux* guard hunks."
  - "Official Xiph release downloads currently 404; Google Code Archive hosts the byte-identical tarball."
