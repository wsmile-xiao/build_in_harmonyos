# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtiger/0.3.4
homepage: "https://wiki.xiph.org/OggKate"

# 上游测试审计（源码：libtiger-0.3.4.tar.gz，sha256 见 conandata.yml）
# 2026-09-18 实拉归档逐项验证：
# - 无 tests/、test/、spec/ 目录，无 *_test.c、test_*.py、*check*.c 测试源；
# - 顶层 Makefile.am 无 TESTS/check_PROGRAMS，仅有 check-local（3 组源码规范 grep）；
# - configure.ac 未注册任何测试框架（无 gtest/ctest/pytest，无 enable_testing/add_test）；
# - examples/src/simple.c 仅为读取 stdin Ogg 流的演示程序，非测试。
# 结论：上游无单元/集成测试框架；`make check` 触发的 3 组 check-local 即上游全部
# 可执行检查（符号命名空间、内存分配封装、调试打印残留），conanfile.py build() 中
# 完整运行（upstream_test_in_build: true）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  counting_basis: "Makefile.am check-local 3 groups, no unit/integration framework"
  check_local_groups:
    - "Checking Tiger namespace (nm symbol prefix tiger_/kate_)"
    - "Checking memory allocation routines (tiger_malloc wrappers only)"
    - "Checking forgotten debug traces (no stray printf)"
  check_local_group_count: 3
  total_executable_checks: 3

test_package_tests:
  - file: test_tiger.c
    scenario: normal
    description: "Version queries plus full renderer lifecycle: create, clear color, cairo buffer binding, dirty check, render with output verification, destroy"
    command: "./test_tiger"
  - file: test_tiger.c
    scenario: fault-injection
    description: "NULL arguments to create/destroy/render/set_buffer must return TIGER_E_INVALID_PARAMETER"
    command: "./test_tiger --null-args"

assertion_count: 17
