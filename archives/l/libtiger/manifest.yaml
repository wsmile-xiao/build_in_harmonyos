# 软件级 manifest
# 文件位置: archives/l/libtiger/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: libtiger
display: "libtiger"
description: "Rendering library for Ogg Kate streams using Pango and Cairo"
category: graphics
homepage: "https://wiki.xiph.org/OggKate"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2013-era config.sub patched to recognize aarch64 and linux-ohos"
    - "Uses only the direct libkate, cairo and pango Conan dependencies"
    - "Upstream ships no unit tests; make check runs 3 check-local lint groups"
  common_dependencies:
    - libkate
    - cairo
    - pango

versions:
  "0.3.4":
    status: built
    build_date: "2026-09-18"
