software: lrexlib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.9.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.9.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（必须字段）
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://github.com/rrthomas/lrexlib/archive/refs/tags/rel-2-9-1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "-DVERSION=\"2.9.1\""
    - "-shared -fPIC"
    - "-I$DEFAULT_PREFIX/include"
    - "-L$DEFAULT_PREFIX/lib"

  # 模块类型（Lua 扩展模块）
  module_type: lua_extension
  lua_module: rex_posix.so
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"