# test_package/MANIFEST.yml — launchctl-completion 2.0 上游测试声明
#
# 上游测试体系：不存在。v2.0 tarball（sha256 990499494562cedf361482c5bf9f89
# b3a8b6a8aee92fda4e1eadaacb96688ecd）仅含 LICENSE（MIT）与
# launchctl-completion.sh（713 行 bash 补全脚本）两个文件：
# 无 tests/ 目录、无 Makefile / 任何测试 runner、无 CI 配置
# （.github//.gitlab-ci.yml 均无）。判定为 not_applicable / NO_UPSTREAM_TESTS
# （零测试上游，非"有测试而跳过"），完整证据链见同目录
# EXCLUDED-TESTS.md 与 UPSTREAM-TESTS-EVIDENCE.json（机读）。

package: launchctl-completion/2.0
homepage: "https://github.com/CamJN/launchctl-completion"
upstream_tag: "v2.0"
upstream_commit: "9dd7a322db986105507f04b86c87d62e7a797584"

upstream_check_command: "n/a — upstream ships no test suite of any kind (NO_UPSTREAM_TESTS)"
upstream_test_in_build: false
upstream_test_command: "test_package: launchctl_completion_test.sh（零测试上游的适配点静态冒烟，lazycontainer 先例范式）"

# 上游实际运行的测试：无（discovered=0，机读复核见 UPSTREAM-TESTS-EVIDENCE.json）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，全部断言对准适配点、
# 不依赖 launchctl 本体或任何外部命令、不写 /tmp）
test_package_tests:
  - file: launchctl_completion_test.sh
    description: >
      静态冒烟 9 组共 10 条断言：①测试用 bash >= 5.3（compgen -V 硬性下限，端到端钉死
      requires("bash/5.3") 契约）；②bash -n 语法门禁；③source 后
      complete -p launchctl 输出逐字等于 complete -F _launchctl2 launchctl
      （复刻 Homebrew formula 的 test 块）；④_launchctl2 以 function 身份在册；
      ⑤静态一级子命令补全恰好 44 项且含 bootstrap/bootout/kickstart/list/help/
      version（COMP_CWORD=1 路径纯 builtin compgen，先于脚本内 log() 与一切
      外部命令返回，故不触发 launchctl/dscl 等 OHOS 缺失数据源、不写 /tmp）；
      ⑥安装布局 share/bash-completion/completions/launchctl（Homebrew 同款改名
      放置）；⑦安装文件 SHA256 与上游逐字节一致（E241 固定输出精确比对，
      17df5430…49f0b）；⑧licenses/LICENSE SHA256 与上游一致（898275fb…e7e5b）；
      ⑨NO_UPSTREAM_TESTS 机读证据文件在场且含门禁标记（其中⑤含数量与成员两条断言）。
    command: "bash launchctl_completion_test.sh"

# 断言总数（近似值，用于质量评估；9 组 10 条）
assertion_count: 10

# NOT_RUN 说明：不适用。上游零测试（status=not_applicable，而非 skipped——
# skipped 语义是"有测试但被跳过"）。功能面证据由上述 9 组适配点冒烟承担。
