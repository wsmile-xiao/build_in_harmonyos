software: launchctl-completion
display: "launchctl-completion"
description: "macOS launchctl(8) 的 bash 补全脚本数据包（上游仅一个 713 行补全脚本 + MIT LICENSE；bash-completion 框架 source 型数据文件）"
category: development
homepage: "https://github.com/CamJN/launchctl-completion"
license: MIT
build_system: bash-scripts

ohos_adaptation:
  key_points:
    - "E241 data-package-pattern：conanfile.py 无 settings 属性（等价 None，数据包不依赖编译器/架构；字面 settings = None 会触发 CI L0p 四轴检查，故整行省略）、不设 package_type（无可执行产物——被补全的 launchctl 命令本身不在包内，R38 commands.json 门禁不适用）、无构建步骤"
    - "数据包忠实原则：上游内容逐字节打包不改（build() 做文件集合 + SHA256 机读复核），安装即移植——Homebrew 同款改名放置 share/bash-completion/completions/launchctl（bash-completion 标准查找路径）；许可证按 Conan 惯例另存 licenses/LICENSE"
    - "脚本硬依赖 bash>=5.3（compgen -V 为 bash 5.3 新增选项，65 处；local -n 命名引用需 4.3+）：requires bash/5.3（ohpcd 已发布 armv8 静态二进制）；补全文件由用户 bash source 而非 exec，脚本 shebang #!/usr/local/bin/bash 天然无效（知识 E037/E049 族），无需也不应修改"
    - "功能面诚实披露（运行期限制，非打包缺陷）：launchctl 本体在 OHOS 不存在，complete -F 注册仅在手敲 launchctl <TAB> 时触发；动态数据源（launchctl list、dscl、/Library/Launch*）缺失对应分支补全为空集；脚本第 97/102/107 行 launchctl list 无 stderr 守卫，相关场景有 command-not-found 噪声一行——按忠实原则不修改上游"
    - "上游零测试（NO_UPSTREAM_TESTS）：v2.0 tarball 仅 LICENSE + launchctl-completion.sh 两文件，无 tests/、无 Makefile、无 CI 配置；证据链见 test_package/EXCLUDED-TESTS.md + UPSTREAM-TESTS-EVIDENCE.json（机读），功能面由 9 组 10 条适配点静态冒烟承担（test_package/launchctl_completion_test.sh）"
  common_dependencies:
    - bash 5.3

versions:
  "2.0":
    status: built
    build_date: "2026-09-28"
    source_url: "https://github.com/CamJN/launchctl-completion/archive/refs/tags/v2.0.tar.gz"
    source_sha256: "990499494562cedf361482c5bf9f89b3a8b6a8aee92fda4e1eadaacb96688ecd"
