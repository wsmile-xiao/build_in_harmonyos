# 软件级 manifest — archives/l/libmoe/manifest.yaml

software: libmoe
display: "libmoe"
description: "多字节字符编码处理库（含 mbconv 调试工具）"
category: library
homepage: "http://pub.ks-and-ks.ne.jp/prog/libmoe/"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游裸 Makefile 硬编码 gcc 与 /usr/local：改用 Conan clang + llvm-ar/ranlib，并把 INCDIR/LIBADIR/LIBSODIR/BINDIR/LIBEXECDIR/MANDIR 改写到包目录"
    - "2000 年代 C 的 GNU89 extern inline 语义需 -fgnu89-inline（现代 clang 默认 gnu17 会报 C99 inline 错误）"
    - "make 参数需引号：CF 多词、CPP 带 -E"
    - "头文件由 *.mk_btri.h 经 C 预处理器喂给自举工具 mk_btri 生成"
    - "CLI 工具：软件级 commands.json（R38/L0k）；上游 test.pl 无断言 → R51 报 not_applicable，harness 承担验证"
  common_dependencies: []

versions:
  "1.5.8":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libmoe/1.5.8"
