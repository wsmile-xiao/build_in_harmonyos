# test_package/MANIFEST.yml
# libmoe 1.5.8.
#
# Upstream ships `test.pl`, a Perl script that loads mbcesdefs.pl and prints the
# CES boundary constants (it asserts nothing and is not wired into the
# Makefile), so the upstream step of R51 reports not-applicable.  The harness
# performs the verification: installed layout (lib/headers/man) plus
# deterministic mbconv conversions on stdin.

package: libmoe/1.5.8
homepage: http://pub.ks-and-ks.ne.jp/prog/libmoe/

upstream_tests_exist: false
upstream_test_audit: "test.pl prints CES boundary constants only (no assertions); Makefile has no check/test target"
upstream_check_command: "n/a (no check target)"
upstream_test_in_build: false
upstream_test_command: "n/a (manual test.pl prints constants)"

test_package_tests:
  - file: test_libmoe.py
    description: "installed layout (bin/mbconv, lib/libmoe.a, include/moe/mb.h, man page) + mbconv CLI on deterministic inputs: ASCII and UTF-8 pass-through, -c ASCII conversion, -t file output, explicit - stdin, -h usage"
    command: "python3 test_libmoe.py <package folder> <workdir> <result json>"

test_files:
  - path: "test_package/test_libmoe.py"
    test_type: "R34/R51(补全)"
    assertion_count: 10

test_package_test_count: 1
consumer_assertion_count: 10
assertion_count: 10
