knowledge_gained:
  - "2000 年代 C 工程用 GNU89 的 `extern inline` 语义，现代 clang 默认 gnu17 直接报 'redefinition of a extern inline function is not supported in C99 mode' → 加 -fgnu89-inline（比整体 -std=gnu89 更小改动）"
  - "上游 Makefile 的 CC/CPP/LD/AR/RANLIB/CF 都要覆盖；CF 与带参数的 CPP（'<clang> -E'）在 make 命令行必须加引号，否则被解析成多个目标（'No rule to make target pic'）"
  - "上游把安装路径写死在 /usr/local：用 make 变量 INCDIR/LIBADIR/LIBSODIR/BINDIR/LIBEXECDIR/MANDIR 全部改写到包目录"
  - "CLI 工具需软件级 commands.json（R38/L0k）；上游 test.pl 无断言 → R51 报 not_applicable，验证由 harness 承担（安装布局 + deterministic mbconv 转换：ASCII/UTF-8 透传、-c ASCII、-t 文件、'-' 输入、-h 用法）"
