# conandata.yml — librecast 0.8.0
#
# 官方源：git.sr.ht（上游 Codeberg 为主仓，sr.ht 为官方同源镜像；
# 与同族已发布包 lcrq/0.3.1 使用同一发布入口，R39 合规）。
# 实测：codeberg 与 sr.ht 两个入口解包后内容完全一致，仅打包层不同。

sources:
  url: "https://git.sr.ht/~librecast/librecast/archive/v0.8.0.tar.gz"
  sha256: "3c1f0fd35d147e0197789d2af34ed80f1bd2f5782438f15386ccf8c777e5ba12"

patches:
  # ── OHOS 平台适配（E007 config.guess/config.sub）────────────────────
  - patch_file: "patches/0001-Makefile.in.patch"
    patch_description: "OHOS: uname -s 返回 HarmonyOS，归一为 Linux 以选中 if_linux.o（提供 lc_tuntap_create）及 Linux SONAME 规则"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "OHOS: config.guess 增加 HarmonyOS 系统识别分支（E007）"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "OHOS: config.sub 接受 linux-ohos 三元组并补 kernel-os 校验表（E007）"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.patch"
    patch_description: "OHOS: configure 的 config.status 临时目录 umask 077→022（E129/E114，HMDFS setgid 挂载下组无搜索位导致写失败）"
    patch_type: "portability"
  - patch_file: "patches/0007-libs-libmld-config.guess.patch"
    patch_description: "OHOS: 内嵌 libmld 的 config.guess 增加 HarmonyOS 识别（E007）"
    patch_type: "portability"
  - patch_file: "patches/0008-libs-libmld-config.sub.patch"
    patch_description: "OHOS: 内嵌 libmld 的 config.sub 接受 linux-ohos 并补 kernel-os 校验表（E007）"
    patch_type: "portability"
  - patch_file: "patches/0009-libs-libmld-configure.patch"
    patch_description: "OHOS: 内嵌 libmld 的 configure 临时目录 umask 077→022（E129/E114）"
    patch_type: "portability"

  # ── 上游缺陷修复（文件未自带 FILE 声明）────────────────────────────
  - patch_file: "patches/0005-include-librecast-net.h.patch"
    patch_description: "上游缺陷: net.h 使用 FILE 却未包含 <stdio.h>；Release 构建设 -DNDEBUG 时 lcrq.h 也不再间接引入，导致 unknown type name 'FILE'"
    patch_type: "portability"
  - patch_file: "patches/0014-src-librecast_pvt.h.patch"
    patch_description: "上游缺陷: librecast_pvt.h 的 struct lc_ctx_t 声明 FILE *stream，补 <stdio.h>（同 net.h，Release 下无间接引入）"
    patch_type: "portability"

  # ── OHOS 平台适配（E127 pthread_cancel 协作式替代）──────────────────
  - patch_file: "patches/0006-include-librecast-q.h.patch"
    patch_description: "OHOS: 声明 q_pool_destroy_q()，用停止哨兵替代 pthread_cancel()（E127）"
    patch_type: "portability"
  - patch_file: "patches/0016-src-q.c.patch"
    patch_description: "OHOS: q_job_seek() 识别停止哨兵、新增 q_pool_destroy_q()、q_pool_destroy() 在 musl 下退化为空实现（E127）"
    patch_type: "portability"
  - patch_file: "patches/0010-libs-libmld-src-job.c.patch"
    patch_description: "OHOS: job_seek() 识别停止哨兵、job_queue_destroy() 投递哨兵并 join 替代 pthread_cancel()（E127）"
    patch_type: "portability"
  - patch_file: "patches/0013-src-librecast.c.patch"
    patch_description: "OHOS: NACK 线程与监听线程改停止标志 + shutdown() 协作退出（E127）"
    patch_type: "portability"
  - patch_file: "patches/0017-src-sync.c.patch"
    patch_description: "OHOS: share_send_thread() 识别停止哨兵、lc_unshare() 改用 q_pool_destroy_q()（E127）"
    patch_type: "portability"
  - patch_file: "patches/0015-src-mtree.c.patch"
    patch_description: "OHOS: mtree 线程池销毁改用 q_pool_destroy_q()（E127）"
    patch_type: "portability"
  - patch_file: "patches/0012-libs-libmld-src-mld_pvt.h.patch"
    patch_description: "OHOS: mld_t 增加 stop 标志与 netlink_fd 字段（E127 协作式关闭）"
    patch_type: "portability"

  # ── OHOS 平台适配（E091 / RFC 3542 / 结构体初始化）─────────────────
  - patch_file: "patches/0011-libs-libmld-src-mld.c.patch"
    patch_description: "OHOS: E091 sockaddr_storage 守卫、msghdr 指定初始化、E127 监听线程协作退出，并内联 RFC 3542 inet6_opt_* 实现（musl 未实现该 API，缺失会导致产物无法 dlopen）"
    patch_type: "portability"
