# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: lc_ctx_new/lc_ctx_free 生命周期、hash_generic/hash_init/hash_update/hash_final/hash_bin2hex、mdex_init/mdex_put/mdex_get/mdex_del/mdex_free（覆盖 E127 线程关闭与 RFC 3542 兼容层路径）"
    command: "./test_librecast"

# 测试断言总数（test_package 实测执行的检查点数量）
assertion_count: 19
