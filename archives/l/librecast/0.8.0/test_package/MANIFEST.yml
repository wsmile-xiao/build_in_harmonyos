# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librecast/0.8.0
homepage: "https://librecast.net/librecast.html"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# ─────────────────────────────────────────────────────────────────────
# 上游测试清点（R51 三步法）
#
# 入口: `make test`（顶层 Makefile → test/Makefile，TESTRUNNER=maketest）
#   - 顶层 test/*.c        80 个用例源文件
#   - test/{all,enc,mdex,mtree,sync,zzz}/  子目录以符号链接复用同名用例（111 个链接）
#   - 内嵌 libs/libmld/test/*.c  11 个用例（由 make test 递归调用）
#
# OHOS 实测（2026-09-24，aarch64-linux-ohos，clang 15.0.4）：
#   全量 make test 无法跑完，原因是平台能力缺口而非编译缺陷：
#   31/80 顶层用例依赖 POSIX 线程取消语义（pthread_cancel +
#   PTHREAD_CANCEL_ASYNCHRONOUS），musl 不实现（设备 libc 虽有 pthread_cancel
#   符号但调用返回 ENOSYS=38，pthread_setcanceltype 完全缺失）。库内生产代码已
#   改为协作式关闭（E127），但用例本身要求"真异步取消"（主线程须中断阻塞在
#   sem_wait() 的线程），协作式无法替代 ⇒ 这 31 项在本平台不可运行。
#
#   可运行子集实测（排除上述 31 项，逐用例 45s 超时）：
#     38 OK / 7 WARN / 4 FAIL(rc=134) / 31 SKIP / 0 HANG
#   日志: archives/l/librecast/0.8.0/reports/upstream-test-subset.log
#   脚本: reports/run_upstream_subset.sh
#
#   4 项 rc=134 属 falloc ENOMEM 注入用例的既有平台行为：与本次适配前的基线
#   一致（同一日志口径下亦为 134），非本次改动引入的回归。
#
#   内嵌 libmld 套件实测: 10 tests run / 8 OK / 2 WARN / 0 FAIL
#     （0000-0003 mld_add_iface、0000-0006 mld_query_msg 因缺 CAP_NET_RAW
#      能力而降级为 WARN，与上游设计一致）
#   日志: reports/upstream-test-libmld.log
# ─────────────────────────────────────────────────────────────────────

upstream_tests:
  - file: test/0000-0000.c
    source: librecast-0.8.0/test/0000-0000.c
    description: "lc_ctx_new() / lc_ctx_free()（falloc ENOMEM 注入；rc=134 为既有平台行为）"
    command: "./0000-0000.test"
  - file: test/0000-0003.c
    source: librecast-0.8.0/test/0000-0003.c
    description: "lc_msg_init()"
    command: "./0000-0003.test"
  - file: test/0000-0005.c
