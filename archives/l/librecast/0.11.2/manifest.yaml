# ============================================================
# 知识沉淀
# ============================================================

# 分析阶段获得的知识（真机构建后补充）
knowledge_gained:
  - "librecast 0.11.2 对 lcrq 为硬链接依赖：src/Makefile.in 无条件 LIBS += -llcrq，configure 探测失败也无法完成链接（INSTALL.md 自称 optional 已过时）→ 必须先适配 lcrq"
  - "上游仅构建共享库 librecast.so（SONAME librecast.so.0.6，ABIVERS 0.6），无静态目标 → shared 选项仅 True"
  - "上游 Makefile 非 VPATH 感知（src/Makefile.in 的 -I../include），conan 必须用 basic_layout(build_folder='.') 强制 in-tree 构建"
  - "主目录与 libs/libmld（AC_CONFIG_SUBDIRS 子目录）各有一份 config.guess/config.sub，均需 HarmonyOS 三元组补丁（复用 scripts/patch-autotools-ohos.pl）"
  - "顶层 install: all doc 会先装 man 页且用裸 install 命令（OHOS 无 coreutils install，libfec 先例）→ 补丁去掉 doc 前置"
  - "构建/安装多处 ln -sf 生成 soname 别名 → cp -f 替代（真机文件系统符号链接受限，避坑指南 #15）"
  - "测试框架自带优雅降级：test_require_net() 无组播时 TEST_WARN(1)（runner 只记 ret>=2 为 FAIL）；test_cap_require() 非 root 提前退出(0)；全量 make test 在真机可执行但需关注时长（126+11 用例）"
  - "源码归档含符号链接（test/all/*.test → ../），conan get() 在真机 Linux 下解包正常；Windows 本机解包会丢符号链接（仅影响本机分析）"
  - "未使用 sem_open/mq_open/shm_open 等 bionic 弱支撑 API，信号量均为未命名 sem_init"

patch_generation:
