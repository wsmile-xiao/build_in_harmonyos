# test_package/MANIFEST.yml — librecast 0.11.2
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librecast/0.11.2
homepage: "https://librecast.net/librecast.html"

# 上游测试命令：顶层 make test = 构建 src/libs，然后运行 test/all（126 个用例）
# 与 libs/libmld（11 个用例）。blake3 的 test 目标为上游空目标（no-op）。
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游测试全集：test/????-????.c 共 126 个独立可执行用例 + libs/libmld/test 共 11 个。
# 命名规则：NNNN-NNNN.c，每个 .c 编译为同名 .test 由 maketest runner 逐个运行。
# 这里列出各类别的代表用例；全量清单见源码 test/ 与 libs/libmld/test/ 目录。
# 平台行为说明（重要）：
# - 网络类用例通过 test_require_net() 检测组播路由/IPv6，不满足时以 TEST_WARN(1) 退出
#   —— runner 只把 ret>=2 记为 FAIL，WARN 为优雅跳过（真机无组播路由时预期大量 WARN）。
# - 需要 CAP_NET_ADMIN 的用例调用 test_cap_require()，非 root 运行时提前退出(0)。
# - 真机（OHOS）预期：纯 API 用例 PASS + 网络/权限类用例 WARN 跳过；如出现实际 FAIL，
#   按 TEST_QUALITY_SPEC 在 PR 中记录豁免/裁剪原因。
upstream_tests:
  - file: 0000-0000.c
    source: librecast/test/0000-0000.c
    description: "核心冒烟：lc_ctx 生命周期（test_init/断言框架）"
    command: "make -C test test/all（runner 统一运行）"
  - file: 0000-0002.c
    source: librecast/test/0000-0002.c
    description: "核心 API 子集（0000 前缀 = 库基础）"
    command: "make -C test test/all"
  - file: 0000-0022.c
    source: librecast/test/0000-0022.c
    description: "核心 API 子集"
    command: "make -C test test/all"
  - file: 0004-0000.c
    source: librecast/test/0004-0000.c
    description: "key/加密路径（libsodium）用例族代表"
    command: "make -C test test/all"
  - file: 0002-0000.c
    source: librecast/test/0002-0000.c
    description: "mtree 哈希树（blake3 路径）用例族代表"
    command: "make -C test test/all"
  - file: 0001-0000.c
    source: librecast/test/0001-0000.c
    description: "q 队列/线程池用例族代表"
    command: "make -C test test/all"
  - file: 0000-0000.c
    source: librecast/libs/libmld/test/0000-0000.c
    description: "libmld（vendored MLDv2 库）用例族代表，共 11 个"
    command: "make -C libs test"

# 超时/裁剪预案（真机验证阶段按需启用，结果如实记录在 PR）：
# 全量 make test 超时或出现平台性 FAIL 时，改用纯 API 子集：
#   make -C test maketest TEST_PROGS="0000-0000.test 0000-0002.test 0000-0003.test ..."
# （TEST_PROGS 由 make -C test 传入，maketest 逐个编译运行）

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：lc_ctx/lc_channel 生命周期 + hermetic lc_socketpair（无组播依赖）"
    command: "./test_librecast"

# 测试断言总数（近似值，grep test_assert/test_expect 族统计）：
#   librecast 126 用例 ≈ 1300 断言；libmld 11 用例 ≈ 133 断言
assertion_count: 1433
