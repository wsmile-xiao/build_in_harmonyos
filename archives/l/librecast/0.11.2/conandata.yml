# conandata.yml — librecast 0.11.2
# 上游未发布独立 release tarball（librecast.net/release/ 404、Codeberg/GitHub 均无 release assets），
# 源码取自官方 Codeberg 仓库 v0.11.2 tag 自动归档（权威官方源，符合 R39）。
# 归档 sha256 经两次独立下载交叉验证一致（Gitea 归档对同一 commit 确定性生成）。
sources:
  url: "https://git.sr.ht/~librecast/librecast/archive/v0.11.2.tar.gz"
  sha256: "a158d65279091888a887a080976ea7fbb13451efca1fb1748fa255f4e69e50d8"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess 增加 HarmonyOS 系统识别分支（aarch64-unknown-linux-ohos）"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub 增加 ohos-linux 三元组与 ohos* OS 类型"
    patch_type: "portability"
  - patch_file: "patches/0003-Makefile.in-drop-doc-from-install.patch"
    patch_description: "顶层 install 去掉 doc 前置：OHOS 无 coreutils install 命令，man 页安装不可用（libfec 先例）；Conan 包亦无需 man 页"
    patch_type: "portability"
  - patch_file: "patches/0004-src-Makefile.in-symlink-free-soname.patch"
    patch_description: "src/Makefile.in soname 别名（librecast.so.0.6/.so.0/.so）由 ln -sf 改为 cp -f，规避真机符号链接受限（避坑指南 #15）"
    patch_type: "portability"
  - patch_file: "patches/0005-libmld-src-Makefile.in-symlink-free-soname.patch"
    patch_description: "libs/libmld/src/Makefile.in 同上，soname 别名 symlink-free"
    patch_type: "portability"
  - patch_file: "patches/0006-libmld-config.guess.patch"
    patch_description: "libs/libmld 子目录 config.guess（AC_CONFIG_SUBDIRS 独立副本）增加 HarmonyOS 识别"
    patch_type: "portability"
  - patch_file: "patches/0007-libmld-config.sub.patch"
    patch_description: "libs/libmld 子目录 config.sub 增加 ohos-linux 三元组"
    patch_type: "portability"
  - patch_file: "patches/0008-Makefile.in-test-all-to-maketest.patch"
    patch_description: "顶层 test 转发由 test/all 改为 maketest：tar 归档中 test/all 为符号链接目录，HMDFS 解包时被跳过成空目录，原路径会 0 用例空转"
    patch_type: "portability"
  - patch_file: "patches/0009-test-Makefile.in-maketest-ln-to-cp.patch"
    patch_description: "test/Makefile.in maketest 的 lastlog 日志别名由 ln -sf 改为 cp -f（HMDFS 符号链接受限）"
    patch_type: "portability"
  - patch_file: "patches/0010-libmld-Makefile.in-test-all-to-maketest.patch"
    patch_description: "libs/libmld/Makefile.in 同 0008：test 转发改为 maketest"
    patch_type: "portability"
  - patch_file: "patches/0011-libmld-test-Makefile.in-maketest-ln-to-cp.patch"
    patch_description: "libs/libmld/test/Makefile.in 同 0009：ln -sf 改 cp -f"
    patch_type: "portability"
  - patch_file: "patches/0012-configure-configstatus-tmp-umask.patch"
    patch_description: "configure 及其内嵌 config.status 模板的临时目录 umask 077→002：HMDFS 上 700 目录对构建进程不可读（libfec E046 先例）"
    patch_type: "portability"
  - patch_file: "patches/0013-libmld-configure-configstatus-tmp-umask.patch"
    patch_description: "libs/libmld/configure 同 0012：config.status 临时目录 umask 077→002"
    patch_type: "portability"
  - patch_file: "patches/0014-libmld-mld.c-ohos-compat.patch"
    patch_description: "mld.c OHOS 兼容：E091 sockaddr_storage 宏守卫（linux/netlink 族头与 musl sys/socket.h 冲突，accel-ppp 先例）、msghdr 改显式字段赋值（musl msg_iovlen 为 int）、inet6_opt_* 函数声明守卫"
    patch_type: "portability"
  - patch_file: "patches/0015-libmld-inet6_opt.c-rfc3542-compat.patch"
    patch_description: "新增 RFC 3542 inet6_opt_init/append/finish/set_val 实现：OHOS musl 无该 API（头文件与 libc 符号均缺失，实测链接 undefined）；语义遵循 RFC 3542 §10.4/Appendix B，实现风格参照 musl（MIT）"
    patch_type: "portability"
  - patch_file: "patches/0016-libmld-src-Makefile.in-inet6-opt-obj.patch"
    patch_description: "libmld/src/Makefile.in OBJECTS 追加 inet6_opt.o（挂入 0015 新增源文件）"
    patch_type: "portability"
  - patch_file: "patches/0017-librecast.c-ohos-compat.patch"
    patch_description: "librecast.c OHOS 兼容：E091 sockaddr_storage 宏守卫（linux/netlink 与 musl sys/socket.h 冲突）、msghdr 改显式字段赋值（musl msg_iovlen 为 int）"
    patch_type: "portability"
  - patch_file: "patches/0018-Makefile.in-drop-netcheck-from-test.patch"
    patch_description: "顶层 test 前置去掉 netcheck：ifconfig 在真机读 /proc/net/dev 无权限（纯信息性诊断目标，与测试无关）"
    patch_type: "portability"
  - patch_file: "patches/0019-librecast.c-pthread-cancel-musl.patch"
    patch_description: "OHOS musl 无线程取消（E127）：nack 线程与 socket 监听线程改为 close(fd) 解阻塞后 join；listen 线程 EBADF 退出；q 线程池销毁前先停（见 0020）"
    patch_type: "portability"
  - patch_file: "patches/0020a-q.h-q-pool-stop.patch"
    patch_description: "q.h 声明 q_pool_stop()（毒丸停机，musl 无 pthread_cancel）"
    patch_type: "portability"
  - patch_file: "patches/0020b-q.c-poison-pill.patch"
    patch_description: "q.c：q_job_seek() 识别 NULL 毒丸 job 退出；新增 q_pool_stop() 每工作线程推一枚毒丸后 join"
    patch_type: "portability"
  - patch_file: "patches/0021-mtree.c-q-pool-stop.patch"
    patch_description: "mtree.c 哈希子树线程池销毁前调用 q_pool_stop()"
    patch_type: "portability"
  - patch_file: "patches/0022a-libmld-job.h-stop-flag.patch"
    patch_description: "libmld job.h：job_queue_s 增加 stop 标志（毒丸停机，musl 无 pthread_cancel）"
    patch_type: "portability"
  - patch_file: "patches/0022b-libmld-job.c-poison-pill.patch"
    patch_description: "libmld job.c：NULL 毒丸 job 置 stop 标志、cleanup_pop 之后再 break（保持 push/pop 宏对配对）；job_queue_destroy() 销毁前推 NULL job 唤醒各线程"
    patch_type: "portability"
  - patch_file: "patches/0023a-src-Makefile.in-ohos-compat-obj.patch"
    patch_description: "src/Makefile.in OBJECTS 追加 ohos_compat.o"
    patch_type: "portability"
  - patch_file: "patches/0023b-ohos_compat.c-pthread-cancel-stubs.patch"
    patch_description: "新增 src/ohos_compat.c：pthread_cancel/setcancelstate/testcancel 无操作 stub（OHOS musl 无符号，E127；退出语义由 0019-0022 的毒丸/close 机制实现）"
    patch_type: "portability"
  - patch_file: "patches/0024-Makefile.in-test-drop-libs-forward.patch"
    patch_description: "顶层 test 目标去掉 libs 转发：libmld 测试由配方单独驱动（其 11 个用例需组播/root，在本平台以空 TEST_PROGS 优雅跳过；也避免主库 TEST_PROGS 白名单误传入 libmld 造成无规则目标错误）"
    patch_type: "portability"
  - patch_file: "patches/0025-src-Makefile.in-harmonyos-if-linux.patch"
    patch_description: "OSNAME 判断：HarmonyOS 的 uname -s 非 Linux，落入 else 分支漏编 if_linux.o（lc_tuntap_create 等符号缺失）——将 HarmonyOS 并入 Linux 分支（内核/libc 接口兼容）"
    patch_type: "portability"
