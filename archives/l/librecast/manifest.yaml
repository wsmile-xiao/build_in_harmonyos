software: librecast
display: "librecast"
description: "IPv6 组播核心库：组播信道/套接字抽象、RaptorQ FEC（lcrq）、MLDv2 监听发现（vendored libmld）、BLAKE3 哈希与 mtree/MDEX 同步原语"
category: library
homepage: "https://librecast.net/librecast.html"
license: "GPL-2.0-only OR GPL-3.0-only"
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游未发布独立 release tarball，源码取官方 Codeberg v0.11.2 tag 归档（sha256 两次下载交叉验证）"
    - "lcrq 为硬链接依赖（src/Makefile.in 无条件 LIBS += -llcrq），需先行单独适配"
    - "Makefile 非 VPATH 感知，必须 in-tree 构建（basic_layout build_folder='.'）"
    - "上游仅产出共享库 librecast.so（SONAME librecast.so.0.6），无静态目标"
    - "顶层与 libs/libmld 两份 config.guess/sub 均补 HarmonyOS 三元组识别"
    - "install 裁剪 doc/man 页（OHOS 无 coreutils install）；soname 别名 ln -sf 改 cp -f"
    - "测试框架自带 WARN 优雅跳过（无组播路由/非 root），全量 make test 真机可执行"
  common_dependencies:
    - "lcrq/0.4.1"
    - "libsodium/1.0.22"

versions:
  "0.11.2":
    status: pending
    build_date: "2026-09-19"
    license: "GPL-2.0-only OR GPL-3.0-only"
    source: "https://codeberg.org/librecast/librecast/archive/v0.11.2.tar.gz"
