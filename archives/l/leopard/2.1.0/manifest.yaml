# 版本级 manifest
# 文件位置: archives/l/leopard/2.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.0"

# 软件名
software: "leopard"

# 编译状态
# published | built | failed | archived
# O5：只有合并后 release upload 已确认才 published，本阶段为 built
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 tag 归档，tag 无 v 前缀）
  url: "https://github.com/hosseinmoein/Leopard/archive/refs/tags/2.1.0.tar.gz"

  # 源码校验和（与 conan-center-index recipes/leopard/all/conandata.yml 逐字一致）
  sha256: "26b57fdea4cd94ddbc34a478e978632637cde2fc263bdf2d6bdfd3e9ddd0b1d5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DHMTHRP_TESTING=ON"
    - "-DCMAKE_CXX_FLAGS_RELEASE=-O3"

  # 编译依赖列表（格式: name/version）
  # 零第三方 Conan 依赖：上游只 find_package(Threads)，双源实证见 notes.md
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cmake-repair-header-only-target-and-leopard-include-dir.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（按 §3.8 官方机制：engine 已命中既有条目 E259，零草稿）
knowledge_gained: []

# ============================================================
# 测试结果（R51 三步法清点与实测，取数命令见 test_package/MANIFEST.yml）
# ============================================================

test_results:
  type: "official-and-consumer"
  # 统计单位 = 程序内命名测试函数；ctest 注册口径 7、assert 断言点 22 单列
  upstream_total: 16
  upstream_passed: 16
  upstream_failed: 0
  upstream_skipped: 0
  upstream_not_run: 0
  ctest_registered: 7
  assertion_sites: 22
  consumer_tests: 10
  consumer_passed: 10
  consumer_assertions: 10
  skipped: 0
