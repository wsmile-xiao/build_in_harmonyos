package: "leopard/2.1.0"
upstream:
  repository: "https://github.com/hosseinmoein/Leopard"
  tag: "2.1.0"
  source_test_dir: "test"
  source_test_files: 7
  # 统计单位：程序内命名测试函数（named sub-test case）
  source_test_count: 16
  # ctest 注册口径（test/CMakeLists.txt 的 add_test 条数）= 7 个测试程序
  ctest_runner_count: 7
  ctest_execution_count: 7
  # assert() 断言点：assertion 口径，单列不与用例数混用
  assertion_sites: 22
  skipped_count: 0
  command: "ctest --test-dir <build> --output-on-failure"
consumer:
  source_file: "test_package/test_leopard.cpp"
  test_count: 10
  assertion_count: 10
  command: "conan create . -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
notes:
  - "上游 7 个 add_test 条目各对应一个独立测试程序，7 个程序内共 16 个命名子测试函数（thrpool_tester 7、par_sort_tester 4、其余 5 个程序各 1）；N 取候选数法最大值 16，ctest 注册口径 7 作为子口径一并申报。"
  - "assert() 断言点 22 处属 assertion 口径，按 §3.5 不与用例数混用；par_map_reduce 无 assert 断言，其判据为退出码（程序内 map/reduce 结果打印）。"
  - "测试仅在断言生效（未定义 NDEBUG）时有意义：Release 默认 -DNDEBUG 会把断言编译成空，par_sort_tester.cc 的有序性 for 循环唯一自增在 assert 内，NDEBUG 下退化为死循环；配方已把 CMAKE_CXX_FLAGS_RELEASE 钉回 -O3。"
  - "消费者 10 项断言全部由 test_package/test_leopard.cpp 真实执行（CHECKS=10 FAILURES=0）。"
