# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游清点口径（libyal 家族，本版本测试框架已迁 autotest）：
# tests/Makefile.am 的 check_AUTOTESTS（3 个套件）+ check_PROGRAMS（21 个 C 测试
# 程序）两个注册面。autotest 套件在构建期由 autom4te 从 *.at 生成，check-local
# 驱动执行：test_library 驱动 18 个程序（16 无输入 + handle/support 在
# test_inputs_libvmdk.at 为空时不注册带输入用例，程序本身仍由无输入 AT_CHECK
# 覆盖——实测 library 套件 16 项 ok；handle/support 属 WITH_INPUT 形态，input/
# 夹具缺失时不展开用例），test_manpages 3 项（MANPAGE_LINTER=no 按上游规则
# skip），test_tools 3 项 ok。
# 发布用 alpha 资产不含 tests/input/ 夹具（tar tzf | grep -c '/tests/input/' = 0）。

package: libvmdk/20260714
homepage: https://github.com/libyal/libvmdk

# 上游测试入口（在 build() 内执行，见 conanfile.py 与 notes.md）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check（autotest：autom4te 由 hnp 工具链提供）"

# 上游注册的可执行测试单元（口径：tests/Makefile.am 的 check_AUTOTESTS + check_PROGRAMS 两个注册面）
upstream_tests:
  - name: "test_library（autotest 套件）"
    source: tests/test_library.at
    description: "库测试套件：RUN_TEST_BINARIES 展开 16 个无输入 C 测试程序用例（bit_stream compression deflate descriptor_file error extent_descriptor extent_file extent_table extent_values grain_data grain_group grain_table huffman_tree io_handle notify system_string）+ RUN_TEST_BINARIES_WITH_INPUT 的 handle/support（test_inputs_libvmdk.at 为空时不展开）。实测 16 项全部 ok"
    command: "./tests/test_library"
  - name: "test_manpages（autotest 套件）"
    source: tests/test_manpages.at
    description: "手册页 lint 套件：libvmdk.3 / vmdkinfo.1 / vmdkmount.1 三项；MANPAGE_LINTER=no（上游 configure 默认未配置 linter）按 AT_SKIP_IF 规则 skip"
    command: "./tests/test_manpages"
  - name: "test_tools（autotest 套件）"
    source: tests/test_tools.at
    description: "工具函数测试套件：tools_info_handle / tools_output / tools_signal 3 个 C 测试程序用例（RUN_TEST_VMDKTOOL 的端到端项依赖 test_inputs_vmdkinfo.at，input/ 夹具缺失时不展开）。实测 3 项全部 ok"
    command: "./tests/test_tools"
  - name: "check_PROGRAMS (21)"
    source: tests/Makefile.am
    description: "21 个 C 测试程序（bit_stream compression deflate descriptor_file error extent_descriptor extent_file extent_table extent_values grain_data grain_group grain_table handle huffman_tree io_handle notify support system_string tools_info_handle tools_output tools_signal）——autotest 套件构建并驱动（check-local 依赖套件脚本，套件再运行二进制）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libvmdk.c
    description: "通用消费者断言：版本串（上游 20260714，非 Conan ref）、access flags、codepage 正常/错误/UTF-8 路径、VMDK 签名探测正反错三路、合成 monolithicFlat VMDK 打开→extent 打开→media size→disk type→CID/parentCID→全量读回→跨扇区读→seek/offset→EOF 读 0→错误路径→生命周期（41 项断言）"
    command: "./test_libvmdk"
  - file: test_ohos.c
    description: "鸿蒙专项消费者测试：__OHOS__ 编译目标、TMPDIR 语义（设置/非 /tmp/可写）、在 TMPDIR 下合成 monolithicFlat VMDK 并读回全链路（含跨扇区边界读、尾部 64 字节读、open 前置 set_max_open_handles、signal_abort、错误回溯打印）（31 项断言）"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  # 计数口径：本列表逐项给出**互不重叠**的消费者测试程序与断言数，
  # assertion_count = test_libvmdk.c 的 41 项 + test_ohos.c 的 31 项 = 72。
  - name: "ohos-consumer-tests"
    description: "test_ohos.c（鸿蒙专项消费者测试）：__OHOS__ 编译目标、TMPDIR 语义、在 TMPDIR 下合成 monolithicFlat VMDK 并读回全链路（含跨扇区边界读与尾部读）"
    command: "./test_ohos"
    assertions: 31
    platform: OHOS
  - name: "generic-consumer-tests"
    description: "test_libvmdk.c（通用消费者断言）：版本串、codepage 路径、签名探测三路、monolithicFlat 全链路读回、EOF 语义、生命周期（该程序在 OHOS 上同样编译运行，但断言内容不依赖平台特性）"
    command: "./test_libvmdk"
    assertions: 41
  - name: "installed-cli-load"
    description: "安装后的 bin/vmdkinfo -V 必须能加载共享库并输出版本串（含 20260714）（运行/加载验证，在 test() 内执行；是运行检查，不计断言数）"
    command: "vmdkinfo -V"
    assertions: 0
    platform: OHOS

assertion_count: 72
