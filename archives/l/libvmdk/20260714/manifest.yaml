software: libvmdk
version: "20260714"
status: built
build_date: "2026-10-09"
difficulty: "B"
adaptation_path: "路径 A（基础适配）"

source:
  # 上游 GitHub（libyal/libvmdk）实测（2026-10-09）：git ls-remote 有 refs/tags/20260714
  # （commit 396e1873a030ac535bf919f6707d5be57613ae08）；release 资产三通道 HEAD 探测
  # libvmdk-alpha-20260714.tar.gz=200（采用）、experimental=404、裸名=404。
  # Debian 池最高仅 20240510，无 20260714 同源通道可对拍。
  # 任务卡给定的 codeload git tarball 不含 configure 产物也不含 13 个 libyal 子库
  # （synclibs.sh 构建期 git clone 未注册 vendored 依赖，违反本仓规范），且 CI worker
  # PATH 无 automake（bootstrap 不可行）；release alpha 资产为上游发布流水线
  # synclibs+autogen 后的自包含快照，与同仓 20240510 先例同通道，故采用。
  url: "https://github.com/libyal/libvmdk/releases/download/20260714/libvmdk-alpha-20260714.tar.gz"
  sha256: "8f429818aac09bd0457e6f550d39e705787856f7523d7b3c82caa8ee759678b1"
  tar_format: tar.gz
  upstream_repo: "https://github.com/libyal/libvmdk"
  upstream_tag: "https://github.com/libyal/libvmdk/releases/tag/20260714"
  release_artifact: "upstream release asset present (libvmdk-alpha-20260714.tar.gz, HTTP 200); self-contained (configure + 13 bundled libyal components)"

build:
  system: autotools
  # 单行 flow 列表：clean_verify 的 G0 原生探测按行解析该字段，
  # 块列表形态会被截成裸 `-` 传给 configure（"unrecognized option: '-'"）
  configure_options: ["--enable-shared", "--disable-static", "--disable-python", "--enable-static-executables=no", "--build=aarch64-unknown-linux-gnu", "--host=aarch64-unknown-linux-gnu"]
  # 唯一外部 Conan 依赖；ohpcd 制品仓已发布 ohos-aarch64 二进制
  dependencies:
    - zlib/1.3.2
  # 发行 tarball 内嵌的 libyal 支持组件（standalone 树内构建，非 Conan 依赖）
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfvalue
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 平台适配全部内联在 conanfile.py build()，不新增 patches/ 文件，也不改上游任何 C/H 源文件
# 与测试脚本；唯一例外是 OHOS 构建期（在 Conan 缓存副本上）把随包 configure 内 2 处
# `umask 077` 改为 `022`（HMDFS 必需，E011）——详见 notes.md。
patches_applied: []

knowledge_gained:
  - "libyal 2026 系（20260714）测试框架已迁 autotest：tests/*.at 构建期经 autom4te 生成 test_library/test_manpages/test_tools 套件脚本，check-local 驱动；OHOS hnp 工具链自带 autom4te（autoconf 2.72），make 前把 /data/service/hnp/bin 前置进 PATH 即可在设备与 CI worker 上真跑（原生轮 19 执行通过 + 3 manpages skip）"  # knowledge_ref: 同批 libewf 同素材（主对话合并申报）
  - "libyal 2025-07-10 vintage config.guess 在 HarmonyOS 设备上 uname -s=HarmonyOS 触发 'unable to guess system type' 硬失败；config.sub 虽已接受 linux-ohos 别名，仍需显式 --build/--host=aarch64-unknown-linux-gnu 绕过 guess 环节"  # knowledge_ref: E007/DRAFT-E591 三元组年代先例延续
  - "codeload git tarball 与 GitHub release 资产的本质差异：前者是裸源码快照（无 configure 产物、无 synclibs 拉取的 vendored 子库），后者是上游发布流水线 synclibs+autogen 后的自包含快照；libyal 系适配应一律走 release 资产通道（同仓 20240510 先例），任务卡给 codeload URL 时需探测三通道资产名（alpha/experimental/裸名）"
  - "m4/zlib.m4 20260622（20260714 随包）DIR 分支成功态仍为 zlib 而终闸多判 != zlib；沿 20240510 的 DRAFT-E724 结论：zlib 只走 AutotoolsDeps 自动探测，不加 --with-zlib=<DIR>"

tests:
  upstream:
    command: "make check"
    registration: "tests/Makefile.am: check_AUTOTESTS + check_PROGRAMS"
    cases: 24
    passed: 19
    skipped: 5
    failed: 0
    not_run: 0
    note: "原生轮实测（native-check.log）：test_library 16 ok（无输入程序全量执行；handle/support 属 WITH_INPUT 形态，input/ 夹具缺失不展开用例）+ test_manpages 3 skipped（MANPAGE_LINTER=no 上游默认）+ test_tools 3 ok（tools_info_handle/output/signal）+ check_PROGRAMS 21 个全部构建（18 个由套件执行、handle/support 由套件外的 make check 阶段构建）。autotest 用例口径：19 执行通过 + 5 上游规则 skip（3 manpages + 2 WITH_INPUT 不展开）= 24 注册项；manpages 3 项是套件注册项，skip 归因上游 AT_SKIP_IF(MANPAGE_LINTER)。conan create 干净轮读数见 reports"
  adapted:
    command: "conan create（W3）内 test_package"
    cases: 2
    passed: 2
    pass_rate: "2/2 (100%)"
    assertions: 72
    breakdown:
      generic_consumer_assertions: 41
      harmony_specific_assertions: 31
    note: "test_libvmdk.c 41 项通用断言；test_ohos.c 31 项鸿蒙专项断言（TMPDIR 下合成 monolithicFlat VMDK 并读回全链路，含跨扇区边界读与尾部读）；另在 test() 内以安装后的 bin/vmdkinfo -V 做 CLI 加载验证"

blockers: []
