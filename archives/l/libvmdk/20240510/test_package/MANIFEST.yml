# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游清点口径（libyal 家族，同 libsmraw/20240506、libvsgpt/0-20240504 先例）：
# automake 的 TESTS（shell 入口脚本）+ check_PROGRAMS（C 测试程序）两个注册面，
# 本版本共 3 + 21 = 24 项。
# 发布用 orig tarball 不含 tests/input/ 夹具（tar tzf | grep -c '/tests/input/' = 0），
# test_vmdkinfo.sh 按上游规则 exit 77 → automake SKIP。

package: libvmdk/20240510
homepage: https://github.com/libyal/libvmdk

# 上游测试入口（在 build() 内执行，见 conanfile.py 与 notes.md）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check LOG_COMPILER=<bash>"

# 上游注册的可执行测试单元（口径：automake 的 TESTS + check_PROGRAMS 两个注册面）
upstream_tests:
  - name: "test_library.sh"
    source: tests/test_library.sh
    description: "库测试入口：驱动 LIBRARY_TESTS 16 个 C 测试程序（bit_stream compression deflate descriptor_file error extent_descriptor extent_file extent_table extent_values grain_data grain_group grain_table huffman_tree io_handle notify system_string，均无输入）+ LIBRARY_TESTS_WITH_INPUT 的 handle/support 在 input/ 缺失时按脚本尾部 else 分支退化为无输入运行（不是跳过），共 18 个程序真实执行"
    command: "./tests/test_library.sh"
  - name: "test_tools.sh"
    source: tests/test_tools.sh
    description: "工具函数测试入口：驱动 info_handle / output / signal 3 个 C 测试程序（TOOLS_TESTS_WITH_INPUT 为空，不需要夹具）"
    command: "./tests/test_tools.sh"
  - name: "test_vmdkinfo.sh"
    source: tests/test_vmdkinfo.sh
    description: "vmdkinfo 工具级端到端入口：顶层 `if ! test -d input` 闸，发布包不含 tests/input/ 夹具，按上游规则 exit 77 → automake SKIP"
    command: "./tests/test_vmdkinfo.sh"
  - name: "check_PROGRAMS (21)"
    source: tests/Makefile.am
    description: "21 个 C 测试程序（bit_stream compression deflate descriptor_file error extent_descriptor extent_file extent_table extent_values grain_data grain_group grain_table handle huffman_tree io_handle notify support system_string tools_info_handle tools_output tools_signal）——18 个由 test_library.sh 驱动、3 个由 test_tools.sh 驱动，21/21 真实执行"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libvmdk.c
    description: "通用消费者断言：版本串（上游 20240510，非 Conan ref）、access flags、codepage 正常/错误/UTF-8 路径、VMDK 签名探测正反错三路、合成 monolithicFlat VMDK 打开→extent 打开→media size→disk type→CID/parentCID→全量读回→跨扇区读→seek/offset→EOF 读 0→错误路径→生命周期（41 项断言）"
    command: "./test_libvmdk"
  - file: test_ohos.c
    description: "鸿蒙专项消费者测试：__OHOS__ 编译目标、TMPDIR 语义（设置/非 /tmp/可写）、在 TMPDIR 下合成 monolithicFlat VMDK 并读回全链路（含跨扇区边界读、尾部 64 字节读、open 前置 set_max_open_handles、signal_abort、错误回溯打印）（31 项断言）"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  # 计数口径：本列表逐项给出**互不重叠**的消费者测试程序与断言数，
  # assertion_count = test_libvmdk.c 的 41 项 + test_ohos.c 的 31 项 = 72。
  - name: "ohos-consumer-tests"
    description: "test_ohos.c（鸿蒙专项消费者测试）：__OHOS__ 编译目标、TMPDIR 语义、在 TMPDIR 下合成 monolithicFlat VMDK 并读回全链路（含跨扇区边界读与尾部读）"
    command: "./test_ohos"
    assertions: 31
    platform: OHOS
  - name: "generic-consumer-tests"
    description: "test_libvmdk.c（通用消费者断言）：版本串、codepage 路径、签名探测三路、monolithicFlat 全链路读回、EOF 语义、生命周期（该程序在 OHOS 上同样编译运行，但断言内容不依赖平台特性）"
    command: "./test_libvmdk"
    assertions: 41
  - name: "installed-cli-load"
    description: "安装后的 bin/vmdkinfo -V 必须能加载共享库并输出版本串（含 20240510）（运行/加载验证，在 test() 内执行；是运行检查，不计断言数）"
    command: "vmdkinfo -V"
    assertions: 0
    platform: OHOS

assertion_count: 72
