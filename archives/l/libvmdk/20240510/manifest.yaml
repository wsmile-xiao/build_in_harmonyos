software: libvmdk
version: "20240510"
status: built
build_date: "2026-09-25"
difficulty: "B"
adaptation_path: "路径 A（基础适配）"

source:
  # 上游 GitHub（libyal/libvmdk）实测（2026-09-25）：git ls-remote 有 refs/tags/20240510
  # （commit 34890e3d1cb34b06502ec789fbea764d38817207）；release 资产三通道 HEAD 探测
  # libvmdk-alpha-20240510.tar.gz=200（采用）、experimental=404、裸名=404；上游资产与
  # Debian pristine orig tarball cmp 逐字节一致，sha256 与 PGP 签名的 libvmdk_20240510-2.dsc
  # 的 Checksums-Sha256 逐字一致（三方同源，溯源见 conandata.yml 头注与 notes.md）。
  url: "https://github.com/libyal/libvmdk/releases/download/20240510/libvmdk-alpha-20240510.tar.gz"
  sha256: "985966c252cb9cf252e594830f0889f7b74250604b1d5705c799b120e66b9b9c"
  tar_format: tar.gz
  upstream_repo: "https://github.com/libyal/libvmdk"
  upstream_tag: "https://github.com/libyal/libvmdk/releases/tag/20240510"
  release_artifact: "upstream release asset present (libvmdk-alpha-20240510.tar.gz, HTTP 200); byte-identical to Debian pristine orig tarball"

build:
  system: autotools
  # 单行 flow 列表：clean_verify 的 G0 原生探测按行解析该字段，
  # 块列表形态会被截成裸 `-` 传给 configure（"unrecognized option: '-'"）
  configure_options: ["--enable-shared", "--disable-static", "--disable-python", "--enable-static-executables=no", "--build=aarch64-unknown-linux-gnu", "--host=aarch64-unknown-linux-gnu"]
  # 唯一外部 Conan 依赖；W0 实证 conan install --build=never rc=0（w0-deps.txt）
  dependencies:
    - zlib/1.3.2
  # 发行 tarball 内嵌的 libyal 支持组件（standalone 树内构建，非 Conan 依赖）
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfvalue
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 平台适配全部内联在 conanfile.py build()，不新增 patches/ 文件，也不改上游任何 C/H 源文件
# 与测试脚本；唯一例外是 OHOS 构建期（在 Conan 缓存副本上）把随包 configure 内 2 处
# `umask 077` 改为 `022`（HMDFS 必需，E011）——详见 notes.md。
patches_applied: []

knowledge_gained:
  - "HMDFS 上 autotools configure 的 umask 077 会生成连创建者都无法写入的 0700 临时目录；OHOS 构建期把源码树 configure 内 2 处 umask 077 改为 022 并全程 umask 022 即通过"  # knowledge_ref: E011
  - "libyal 同族 config.sub 对 linux-ohos 的接受度随发行版年代变化；libvmdk 20240510 与 libsmraw 20240506、libvsgpt 0-20240504 同为 2023-06-23 vintage，OHOS 下显式 aarch64-unknown-linux-gnu 三元组"  # knowledge_ref: DRAFT-E591-libvsgpt-gpt-consumer-test-and-triplet-vintage
  - "libyal 家族多为零外部依赖（支持组件内嵌），但用 zlib 的成员（libvmdk：libvmdk_compression/deflate/grain_data 调 uncompress）必须外部 requires zlib 并经 AutotoolsDeps 注入 CPPFLAGS/LDFLAGS 走自动探测；**不要加 --with-zlib=<DIR>**——共享 m4/zlib.m4(20240314) DIR 分支成功态置 zlib 而终闸判 != yes（yes 无赋值点）必然 configure 失败，round-1 G2 实测 unable to find supported zlib in directory；采信以链接产物面为准（接线 NEEDED 仅 libc、裸路径 NEEDED 含 libz.so，A/B 实测）"  # knowledge_ref: DRAFT-E724-libyal-zlib-external-dependency-wiring
  - "libvmdk 消费者测试合成 monolithicFlat 夹具三则：createType 必须用规范 camelCase monolithicFlat（带空格形态 disk_type 留 UNDEFINED → extent 表报 unsupported disk type）；open 后必须显式 open_extent_data_files 否则读报 missing extent data file IO pool；set_maximum_number_of_open_handles 只能在 open 前调用（pool 已建时恒 -1 且污染 pool 使后续 close 也失败）"  # knowledge_ref: DRAFT-E726-libvmdk-monolithicflat-fixture-and-setmax-pool-quirks
  - "libyal 上游 N 按 automake 两个注册面清点（TESTS shell 入口 + check_PROGRAMS C 程序）；libvmdk 20240510 为 TESTS 3 + check_PROGRAMS 21 = 24，其中 test_vmdkinfo.sh 依赖 tests/input/ 夹具（发布包不含）exit 77 SKIP，test_library.sh 的 WITH_INPUT 项在 input/ 缺失时按脚本尾部 else 分支退化为无输入运行（非跳过）；上游 HEAD 已迁 autotest（check_AUTOTESTS 3 项）注册面项数持平 24"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api

