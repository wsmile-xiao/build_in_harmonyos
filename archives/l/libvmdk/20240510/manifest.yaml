    cases: 2
    passed: 2
    pass_rate: "2/2 (100%)"
    assertions: 72
    breakdown:
      generic_consumer_assertions: 41
      harmony_specific_assertions: 31
    note: "test_libvmdk.c 41 项通用断言；test_ohos.c 31 项鸿蒙专项断言（TMPDIR 下合成 monolithicFlat VMDK 并读回全链路，含跨扇区边界读与尾部读）；另在 test() 内以安装后的 bin/vmdkinfo -V 做 CLI 加载验证。两程序对原生构建树先行实跑 41/41、31/31 全 PASS，conan 干净轮复跑一致"

