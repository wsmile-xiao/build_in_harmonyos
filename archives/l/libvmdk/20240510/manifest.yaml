    note: "原生轮与 conan create 干净轮同读数：runner 级 TOTAL 3 / PASS 2 / SKIP 1 / FAIL 0（test_vmdkinfo.sh 依赖发布包不含的 tests/input/ 夹具，按上游规则 exit 77 SKIP）；其内部驱动的 21 个 check_PROGRAMS 全部真实执行且通过（test_library.sh 18 个含 WITH_INPUT 项无输入退化运行 + test_tools.sh 3 个，tests/*.log 的 Testing:…(PASS) 逐条在案）。程序口径 21/21 PASS。证据：$TASK_DIR/native-build.log 与采信轮 evidence 副本 conan-create.log"
  adapted:
