# 软件级 manifest — libvmdk
# 结构遵循 ARCHIVE-SPEC v3.0（软件级元数据 + 版本索引，人读，CI 不依赖）

software: libvmdk
display: "libvmdk"
description: "Library to access the VMware Virtual Disk (VMDK) format"
category: data
homepage: "https://github.com/libyal/libvmdk"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 C libyal 库：13 个 libyal 组件（libbfio/libcdata/libcerror/libcfile/libclocale/libcnotify/libcpath/libcsplit/libcthreads/libfcache/libfdata/libfvalue/libuna，另含顶层 common/ 共享支撑代码）以 standalone 形式内嵌在发布包内；唯一外部 Conan 依赖 zlib/1.3.2（压缩 grain 解压），AutotoolsDeps 单通道接线（共享 m4 的 --with-zlib=DIR 分支永败，不使用）"
    - "随包 configure 有 2 处 umask 077，在 HMDFS 上会生成连创建者都无法写入的 0700 临时目录（E011）；构建期改为 umask 022 并全程保持"
    - "本版本随包 config.sub 为 2023-06-23 vintage（同 libvsgpt/libsmraw 世代），不识别 linux-ohos，OHOS 下显式使用 --build/--host=aarch64-unknown-linux-gnu"
    - "源码树内脚本不能直接执行，configure 经 CONFIG_SHELL（/data/service/hnp/bin/bash）启动，make check 经 LOG_COMPILER 用同一解释器"
    - "上游 make check 的 3 个 shell 入口 + 21 个 C 测试程序在 build() 内真实执行（发布包不含 tests/input/ 夹具，test_vmdkinfo.sh 按上游规则 exit 77 SKIP；test_library.sh 的 handle/support 在无 input 时退化为无输入运行）"
    - "消费者测试在 TMPDIR 下自行合成 monolithicFlat VMDK 夹具（规范 camelCase createType + 显式 open_extent_data_files），覆盖 41+31=72 项断言"
  common_dependencies:
    - zlib

versions:
  "20240510":
    status: built
    build_date: "2026-09-25"
    conan_ref: "libvmdk/20240510"
