platform: HarmonyOS PC
test_count: 1
command: 'python harmony_tests/signed_loader.py "{package_root}" "{llvm_readelf}" "{signed_native_loader}"'
parameter_binding: 'Documentation placeholders only. test_package/conanfile.py:test() supplies dependencies["libwebp"].package_folder, actual shutil.which("llvm-readelf"), and the built/signed bin/harmony_native_loader; never execute placeholders literally.'
tests:
  - name: signed_aarch64_codec_namespace
    source: harmony_signed_loader.py
    description: Actual HarmonyOS AArch64 .codesign, basename DT_NEEDED and SONAME, exact installed WebP/SharpYUV mapping and lossless RGBA semantic roundtrip
    run: harmony_tests/signed_loader.py
    skip_allowed: false
