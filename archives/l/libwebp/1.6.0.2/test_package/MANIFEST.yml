package: libwebp/1.6.0.2
homepage: https://github.com/webmproject/libwebp
upstream_test_in_build: true
upstream_check_command: python run_original_tests.py source upstream-build
upstream_test_command: python run_original_tests.py source upstream-build
upstream_tests:
  - file: tests/fuzzer/CMakeLists.txt
    source: official libwebp 1.6.0 plus its exact pinned FuzzTest source dependencies
    description: All 12 original fuzzer programs and default original ANTLR CTest cases; actual XML IDs, RC and zero skips required
    command: python run_original_tests.py source upstream-build
test_package_tests:
  - file: consumer.c
    description: Actual lossless RGBA, lossy RGBA, mux/demux metadata and invalid bitstream API behavior
    command: ./bin/consumer
  - file: harmony_tests/signed_loader.py
    description: HarmonyOS AArch64 signed DSO acceptance, path-free NEEDED, installed SONAME and actual exact package codec namespace with lossless semantic call
    command: python harmony_tests/signed_loader.py exact-package-root llvm-readelf
harmony_test_count: 1
assertion_count: 19
assertion_inventory_scope: static CHECK call sites; runtime loop executions are not additional test cases
