software: libwebp
version: "1.6.0.1"
build_system: cmake
status: published
build_date: "2026-09-27"
source:
  url: "https://mirrors.ustc.edu.cn/debian/pool/main/libw/libwebp/libwebp_1.6.0.orig.tar.gz"
  sha256: "e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564"
knowledge_gained:
  - "WebPGet{Decoder,Encoder}Version 返回三字节打包发行版号 (MAJOR<<16)|(MINOR<<8)|REV（1.6.0→0x010600），与 ABI 版本（WEBP_DECODER_ABI_VERSION=0x0210）是两套数，勿混"
  - "VP8L 无损编码器对 alpha=0 像素做 alpha cleanup（透明像素 RGB 改写成左邻预测值以利压缩，WebPConfig.exact=0 默认）→ 无损测试图案 alpha 必须避 0"
  - "WebPEncodeRGBA q=100 仍是有损 VP8（高频内容 RGB 偏差可达 130+），近无损断言只能用于平滑渐变（实测 ≤2）"
revision_history:
  - version: "1.6.0.1"
    date: "2026-09-27"
    reason: "R37 递增适配（1.6.0 已入官方 main + 制品仓，libtiff 的 WebP codec 依赖）；真机验证通过"
    changes:
      - "test_package 升级为功能 roundtrip 探针 11 断言（版本打包号/近无损/有损容差/VP8L 逐字节/容器解析正反例）"
      - "真机 conan-verify（2026-09-27，华为 PC，Conan 2.29.1）G0-G4/L2/L4/L5 全绿，探针 11/11 ALL GREEN，判定 published"
      - "双向交叉验证：本机 PIL(libwebp 独立构建) 编码 VP8L 参照流 → 设备解码逐字节精确；设备编码流 → 本机解码逐字节精确"
