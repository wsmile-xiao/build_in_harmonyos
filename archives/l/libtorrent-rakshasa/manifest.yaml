software: libtorrent-rakshasa
display: "libtorrent-rakshasa"
description: "BitTorrent library with rtorrent focus"
category: network
homepage: "https://github.com/rakshasa/libtorrent"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 autoreconf 生成 configure 脚本 (tool_requires automake/libtool/m4)"
    - "需要 pkg.m4 补丁添加到 scripts 目录 (patches/0001-scripts-pkg.m4.patch)"
    - "依赖 curl, openssl, zlib (运行时); cppunit (测试)"
    - "OHOS 需要 explicit triplet --build/--host=aarch64-unknown-linux-ohos"
    - "OHOS 需要 --disable-execinfo"
    - "OHOS configure conftest 需要签名包装器"
    - "基于 0.16.17 已验证配方适配, C++17 替代 C++20"
  common_dependencies:
    - curl/8.15.0
    - openssl/3.5.6.1
    - zlib/1.3.1.1

versions:
  "0.16.12":
    status: built
    build_date: "2026-08-30"