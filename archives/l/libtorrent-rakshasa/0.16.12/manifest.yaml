software: libtorrent-rakshasa
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.16.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.16.12"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/rakshasa/libtorrent/releases/download/v0.16.12/libtorrent-0.16.12.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--with-openssl"
    - "--with-zlib"
    - "--with-libcurl"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/1.1.1w
    - zlib/1.3.1
    - libcurl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-scripts-pkg.m4.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "需要 autoreconf 生成 configure 脚本"
  - "需要手动复制 pkg.m4 到 scripts 目录"
  - "SSL证书下载失败时使用 curl -k 手动下载"