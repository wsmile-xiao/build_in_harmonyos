software: libtorrent-rakshasa
# Version-level manifest
# File location: archives/{letter}/{name}/0.16.12/manifest.yaml
# Follows ARCHIVE-SPEC v2.0

# ============================================================
# Required fields
# ============================================================

# Version number
version: "0.16.12"

# Build status
# published | built | failed | archived
status: published

# Build date (YYYY-MM-DD)
build_date: "2026-08-30"

# ============================================================
# Source information
# ============================================================

source:
  # Source download URL
  url: "https://github.com/rakshasa/libtorrent/archive/refs/tags/v0.16.12.tar.gz"

  # Source checksum
  sha256: "1ecbb5d7802e18e807d3c2f58499e5c189ef81badb2c6c6ebb2399d49c08f5c1"

  # Compression format
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# Build configuration
# ============================================================

build:
  # Build system type
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # Configuration options
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--with-openssl"
    - "--with-zlib"
    - "--with-libcurl"

  # Build dependencies (format: name/version)
  dependencies:
    - curl/8.15.0
    - openssl/3.5.6.1
    - zlib/1.3.1.1
    - cppunit/1.15.1

  # Build-time tool dependencies
  build_dependencies:
    - automake/1.18
    - libtool/2.5.4
    - m4/1.4.19

  # Compiler
  cc: clang
  cxx: clang++

  # C++ standard
  cppstd: "17"

# ============================================================
# Patch information
# ============================================================

# Applied patches
patches_applied:
  - "0001-scripts-pkg.m4.patch"

# ============================================================
# Knowledge
# ============================================================

# Knowledge gained during compilation
knowledge_gained:
  - "Requires autoreconf to generate configure script (GitHub tag archives lack pre-generated configure)"
  - "Requires pkg.m4 macro file in scripts/ directory for PKG_CHECK_MODULES support"
  - "OHOS requires explicit --build/--host triplet (aarch64-unknown-linux-ohos)"
  - "OHOS requires --disable-execinfo (execinfo not consistently exposed)"
  - "OHOS configure conftest executables must be signed with binary-sign-tool"
  - "OHOS HMDFS requires umask 022 instead of 077 in configure"
  - "OHOS HMDFS rejects libtool wrapper shebang; use TESTS_ENVIRONMENT override"
  - "Based on proven 0.16.17 conan recipe, adapted for C++17"
