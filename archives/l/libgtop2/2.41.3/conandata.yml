# conandata.yml — libgtop2 2.41.3
#
# 官方源码（R39：官方正式发布目录，非镜像/非 fork）：
#   https://download.gnome.org/sources/libgtop/2.41/libgtop-2.41.3.tar.xz
#   sha256 为官方 tarball 实测值，与上游 tag 2.41.3（commit 526a5169…）一致。
# 注：CI（或本地跑 build_and_test.sh）会在构建期自动追加镜像 fallback；
#     那种写回属于本地构建痕迹，提交前必须还原为下方"仅官方源"形态。
sources:
  url: "https://download.gnome.org/sources/libgtop/2.41/libgtop-2.41.3.tar.xz"
  sha256: "775676df958e2ea2452f7568f28b2ea581063d312773dd5c0b7624c1b9b2da8c"

patches:
  # HarmonyOS/OHOS 平台三元组：上游 tarball 自带的 config.guess(2023-06-23) /
  # config.sub 不含 ohos 支持，configure 在 "checking build system type" 阶段即中断
  # （knowledge E007 + E072）。
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: >-
      config.guess: 识别 uname -s=HarmonyOS，输出 aarch64-unknown-linux-ohos
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: >-
      config.sub: 接受 ohos 作为合法 OS，并放行 linux-ohos 内核组合
    patch_type: "portability"
  # HMDFS 权限：autoconf 2.70+ 的 config.status 模板用
  # `(umask 077 && mktemp -d "./confXXXXXX")` 建临时目录；HMDFS 上 umask 077
  # 产出的目录当前进程不可写，config.status 报
  #   "config.status: line 846: ./confXXXXXX/subs1.awk: Permission denied"
  # （knowledge E011）。改 umask 077 → 022。
  - patch_file: "patches/0003-configure.patch"
    patch_description: >-
      configure(config.status 模板): umask 077 → 022，规避 HMDFS 上 confXXXXXX 不可写
    patch_type: "portability"
