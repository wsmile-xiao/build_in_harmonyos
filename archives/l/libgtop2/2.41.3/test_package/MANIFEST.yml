# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
#
# 上游测试入口清点（实测命令与输出见选型/适配阶段日志）：
#   find . -type d -iname '*test*'                        -> 无输出（无 tests/ 目录）
#   grep -rn 'check_PROGRAMS|^TESTS' --include=Makefile.am -> 无匹配，rc=1
#   grep -n 'noinst_PROGRAMS' examples/Makefile.am         -> 20 个样例程序
# 结论：libgtop2 2.41.3 上游【无自动化测试套件】，唯一可运行入口是 examples/ 的
# 20 个样例（--with-examples 默认 yes，noinst_PROGRAMS 不安装）。
# 因此上游测试统计来自 examples/ 样例的真实运行（见下方 upstream_tests）。

package: libgtop2/2.41.3
homepage: "https://gitlab.gnome.org/GNOME/libgtop"

# 上游测试命令（用于 make -n check / ctest -N 分析）
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试：否（上游无 test suite，`make check` 无内容；
# 样例为交互式演示程序，netload/procmap 等需参数，不适合作为 CI 阻塞项）。
# 上游样例的实测统计见 upstream_tests 与 notes.md。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（examples/，20 个；逐项真实执行结果）
# 运行方式：构建树内 LD_LIBRARY_PATH=<build>/lib/.libs ./<样例>；结果为 19 PASS / 1 FAIL
upstream_tests:
  - file: examples/first.c
    source: libgtop-2.41.3/examples/first.c
    description: "打印全部 glibtop 采集项（PASS）"
    command: "./first"
  - file: examples/second.c
    source: libgtop-2.41.3/examples/second.c
    description: "按 pid 逐项查询进程信息（PASS）"
    command: "./second"
  - file: examples/pprint.c
    source: libgtop-2.41.3/examples/pprint.c
    description: "pretty-print sysinfo/cpuinfo（PASS）"
    command: "./pprint"
  - file: examples/procargs.c
    source: libgtop-2.41.3/examples/procargs.c
    description: "读取 argv/cmdline（PASS）"
    command: "./procargs"
  - file: examples/df.c
    source: libgtop-2.41.3/examples/df.c
    description: "挂载点容量表（PASS；platform: /etc/mtab 不存在，走 mountlist 回退）"
    command: "./df"
  - file: examples/netlist.c
    source: libgtop-2.41.3/examples/netlist.c
    description: "网络设备列表（PASS）"
    command: "./netlist"
  - file: examples/mountlist.c
    source: libgtop-2.41.3/examples/mountlist.c
    description: "挂载点列表（PASS）"
    command: "./mountlist"
  - file: examples/procmap.c
    source: libgtop-2.41.3/examples/procmap.c
    description: "进程内存映射表 smaps（PASS）"
    command: "./procmap"
  - file: examples/netload.c
    source: libgtop-2.41.3/examples/netload.c
    description: "单网卡负载（PASS；需参数，实测 ./netload wlan0 与 ./netload lo）"
    command: "./netload wlan0"
  - file: examples/sysdeps.c
    source: libgtop-2.41.3/examples/sysdeps.c
    description: "打印 sysdeps 特性位图（PASS）"
    command: "./sysdeps"
  - file: examples/timings.c
    source: libgtop-2.41.3/examples/timings.c
    description: "各采集项耗时基准（PASS；运行约 60s，需 >15s 超时）"
    command: "./timings"
  - file: examples/openfiles.c
    source: libgtop-2.41.3/examples/openfiles.c
    description: "进程打开文件列表（PASS）"
    command: "./openfiles"
  - file: examples/smp.c
    source: libgtop-2.41.3/examples/smp.c
    description: "每 CPU ticks 表（PASS）"
    command: "./smp"
  - file: examples/proclist.c
    source: libgtop-2.41.3/examples/proclist.c
    description: "进程列表 + 时间/CPU（PASS）"
    command: "./proclist"
  - file: examples/free.c
    source: libgtop-2.41.3/examples/free.c
    description: "内存/交换区（PASS）"
    command: "./free"
  - file: examples/wd.c
    source: libgtop-2.41.3/examples/wd.c
    description: "进程工作目录（PASS）"
    command: "./wd"
  - file: examples/affinity.c
    source: libgtop-2.41.3/examples/affinity.c
    description: "CPU 亲和性（PASS）"
    command: "./affinity"
  - file: examples/disk.c
    source: libgtop-2.41.3/examples/disk.c
    description: >-
      "磁盘 I/O 统计（FAIL：glibtop_get_disk 读 /proc/diskstats 返回 EACCES——
       OHOS 上 /proc/diskstats -> /sys/block/diskstats 仅 root 可读，libgtop 本需
       setuid 辅助进程；平台限制，非适配缺陷）"
    command: "./disk"
  - file: examples/diskio.c
    source: libgtop-2.41.3/examples/diskio.c
    description: "磁盘 I/O（容忍不可读盘，PASS）"
    command: "./diskio"
  - file: examples/sysinfo.c
    source: libgtop-2.41.3/examples/sysinfo.c
    description: "CPU 型号/核数（PASS）"
    command: "./sysinfo"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：通用 API 断言（cpu/mem/uptime/sysinfo）"
    command: "./test_libgtop2_api"
  - file: test_ohos.c
    description: "鸿蒙特有用例：/proc/stat 每 CPU ticks、/proc 进程表可枚举、sysinfo ncpu>=1"
    command: "./test_libgtop2_ohos"

# 测试断言总数（近似值，用于质量评估）
#   test.c 4 条断言 + test_ohos.c 3 条断言 = 7
#   上游 examples 20 个样例按退出码统计：19 通过 / 1 平台受限失败
assertion_count: 7
