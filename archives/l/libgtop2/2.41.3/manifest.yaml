  upstream_examples_skipped: 0
  upstream_failed_reason_disk: >-
    examples/disk 调用 glibtop_get_disk() 读 /proc/diskstats，
    OHOS 上 /proc/diskstats -> /sys/block/diskstats 仅 root 可读，非 root 返回 EACCES
