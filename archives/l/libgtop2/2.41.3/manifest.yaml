knowledge_gained:
  - "autoconf 2.70+ 生成的 configure/config.status 用 `umask 077 && mktemp -d \"./confXXXXXX\"` 建临时目录；HMDFS 上 umask 077 产出的目录当前进程不可写，config.status 直接报 `./confXXXXXX/subs1.awk: Permission denied`。改 umask 077 → 022 即可。(knowledge_ref: E011)"
  - "补丁（或任何写入）刷新 configure 的 mtime 后，doc/stamp-vti（依 $(top_srcdir)/configure）被判过期 → 触发 version.texi/libgtop2.info 的 texinfo 链。OHOS 无 makeinfo，构建/安装失败；且 doc/mdate-sh 解析失败时 `set` 无参数会把整份环境变量转储写进 version.texi（实测 103 B → 6094 B）。修法：打补丁前记录 configure 的 mtime，打完后 os.utime 还原，让上游随包发布的 doc/libgtop2.info 直接复用。"
  - "libgtop2 源码经 glib 的 <glib/gi18n-lib.h>（无条件 #include <libintl.h>）使用 ngettext()，而 OHOS SDK sysroot 的 libintl.h 是空壳（无 ngettext 声明）→ clang 报 `incompatible integer to pointer conversion passing 'int' to parameter of type 'const char *'`。让 proxy-libintl 成为直接依赖后，Conan PkgConfigDeps 会在生成的 glib-2.0.pc 里补 `Requires: intl`，proxy-libintl 的 libintl.h 随 pkg-config 的 Cflags 进入编译行即修复（g_libintl_* 符号已静态链接进 libglib-2.0.so，无需额外链接参数）。"

knowledge_ref:
  - "E007 (config.guess 无法识别 HarmonyOS 系统)"
  - "E072 (config.sub 不接受 ohos 三元组)"
  - "E011 (HMDFS umask 077 临时目录不可写)"
  - "E212 (OHOS 上 gobject-introspection 不可用)"

