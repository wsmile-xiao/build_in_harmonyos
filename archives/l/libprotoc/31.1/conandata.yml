patches:
  - patch_file: "patches/0001-use-local-googletest-source.patch"
    patch_description: "Build pinned Googletest locally, use host protoc dependencies for generated sources, and resolve protobuf test plugins from runnable relative paths"
    patch_type: "portability"
  - patch_file: "patches/0002-googletest-honor-tmpdir.patch"
    base_path: "googletest/googletest"
    patch_description: "Make the pinned Googletest honor TEST_TMPDIR/TMPDIR instead of the hardcoded /tmp, which is not writable on HarmonyOS"
    patch_type: "portability"
