package: libprotoc/31.1
homepage: "https://github.com/protocolbuffers/protobuf"

upstream_check_command: "ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"
upstream_test_reason: "libprotoc has no standalone upstream repository; it is the libprotoc CMake target of Protocol Buffers, so the upstream protobuf CTest suite is executed as the authoritative check. The recipe runs all four registered CTest entries whenever Conan can execute target binaries on HarmonyOS PC. The additional HarmonyOS-specific test below does not replace these statistics."
upstream_tests:
  - file: cmake/tests.cmake
    source: protobuf-31.1/cmake/tests.cmake
    description: "Registers lite-test, full-test, lazily-build-dependencies-test and upb-test; 2786 gtest macro occurrences counted across 108 test source/header files. full-test covers the compiler (command_line_interface, descriptor, generator) suites that back libprotoc."
    command: "ctest --output-on-failure --no-tests=error"

test_package_tests:
  - file: test_libprotoc.cpp
    description: "Consumes protobuf::libprotoc directly: descriptor parsing (messages, fields, enums, proto3 semantics), descriptor pool lookups, repeated-import stability, missing-file diagnostics, and FileDescriptorProto text-format round trips."
    command: "ctest --output-on-failure --no-tests=error"
  - file: test_ohos_runtime.cpp
    description: "HarmonyOS-specific: verifies libprotoc imports schemas, builds a queryable descriptor pool, reports missing-file diagnostics through the musl errno/strerror path, and round-trips descriptor protos on the OHOS runtime."
    command: "ctest --output-on-failure --no-tests=error"
  - file: CMakeLists.txt
    description: "Registers the five libprotoc API modes plus the HarmonyOS runtime case as CTest entries."
    command: "ctest --output-on-failure --no-tests=error"

assertion_count: 46
