syntax = "proto3";

package libprotoc.test;

// Schema used by the consumer test to drive the packaged libprotoc compiler
// library through its public Importer/Descriptor API.
message DeviceInfo {
  string name = 1;
  string platform = 2;
  uint32 api_level = 3;
  repeated string capabilities = 4;
}

enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_PHONE = 1;
  DEVICE_KIND_PC = 2;
}

message DeviceList {
  repeated DeviceInfo devices = 1;
  DeviceKind kind = 2;
}
