software: libprotoc
version: "31.1"
status: built
build_date: "2026-09-22"
build_system: cmake
source:
  url: "https://github.com/protocolbuffers/protobuf/releases/download/v31.1/protobuf-31.1.tar.gz"
  sha256: "12bfd76d27b9ac3d65c00966901609e020481b9474ef75c7ff4601ac06fa0b82"
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - "-Dprotobuf_BUILD_TESTS=ON"
    - "-Dprotobuf_BUILD_CONFORMANCE=OFF"
    - "-Dprotobuf_BUILD_EXAMPLES=OFF"
    - "-Dprotobuf_BUILD_SHARED_LIBS=OFF"
    - "-Dprotobuf_BUILD_PROTOBUF_BINARIES=ON"
    - "-Dprotobuf_BUILD_PROTOC_BINARIES=ON"
    - "-Dprotobuf_BUILD_LIBPROTOC=ON"
    - "-Dprotobuf_BUILD_LIBUPB=ON"
    - "-Dprotobuf_LOCAL_DEPENDENCIES_ONLY=ON"
    - "-Dprotobuf_WITH_ZLIB=ON"
  dependencies:
    - abseil-cpp/20260107.1
    - zlib/1.3.1
  cc: clang
  cxx: clang++
patches_applied:
  - "patches/0001-use-local-googletest-source.patch"
  - "patches/0002-googletest-honor-tmpdir.patch"
knowledge_gained:
  - "libprotoc has no standalone upstream repository; it is the libprotoc CMake target of Protocol Buffers (cmake/libprotoc.cmake), so the package builds from the official protobuf release tarball."
  - "libprotoc links libprotobuf PRIVATE and libupb + 33 absl targets PUBLIC, so the runtime libraries and headers must ship in the same package (libprotoc.a alone reports ~1300 undefined symbols)."
  - "protobuf 31.1 ships no vendored googletest; the pinned Googletest source is fetched separately and wired in via protobuf_GTEST_SOURCE_DIR, so the Googletest-only patch is applied in source() with base_path=googletest/googletest."
  - "Upstream requires a runnable protoc whenever tests are enabled (CMakeLists.txt find_program(protobuf_PROTOC_EXE protoc REQUIRED)), so protoc is built as test scaffolding and stripped again in package()."
  - "Stripping the protoc tool targets also requires removing protobuf::protoc / protobuf::protoc-gen-* from protobuf-targets.cmake and protobuf-targets-release.cmake, otherwise find_package(Protobuf CONFIG) fails on the missing binaries."
  - "Googletest hardcodes /tmp for captured-stream temp files; HarmonyOS user shells have no writable /tmp, so googletest must fall back to testing::TempDir() and honor TEST_TMPDIR."
