software: lua-mimetypes

# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-27"

# 构建系统类型（顶层字段，用于 verify_build.py）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lunarmodules/lua-mimetypes/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和
  sha256: "f387475765ff3bcc7abf0f8ad67654bbb8d745569a70623b478f11bebfa585e5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Pure Lua library: no C/C++ compilation needed, just copy .lua file to share/lua/5.4/"
  - "Conan recipe follows lua-struct pattern: no_copy_source, package_id clear, LUA_PATH in runenv_info"
  - "Test uses C program embedding Lua interpreter, sets package.path from LUA_PATH env"
