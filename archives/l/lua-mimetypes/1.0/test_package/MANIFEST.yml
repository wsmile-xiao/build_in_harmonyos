test_package:
  type: consumer
  language: c
  requires:
    - lua-mimetypes/1.0
    - lua/5.4.8.1
  entrypoint: test_mimetypes.c
  checks:
    - require mimetypes module through LUA_PATH
    - verify module version string
    - guess MIME types by file extension (.doc, .mp3, .png, .eml, .txt, .lua, .mpg)
    - guess MIME types by special filenames (README, Makefile)
    - return nil for unknown extensions/filenames
    - extension detection edge cases (bare name, compound extension)
    - copy() creates independent database for custom MIME types
