software: libcddb
# 版本级 manifest — 精简版（2 patches, 从 4 缩减）
# 遵循 ARCHIVE-SPEC v2.0

version: "1.3.2"
status: published
build_date: "2026-06-01"
build_system: autotools

source:
  url: "http://downloads.sourceforge.net/project/libcddb/libcddb/1.3.2/libcddb-1.3.2.tar.bz2"
  sha256: "35ce0ee1741ea38def304ddfe84a958901413aa829698357f0bee5bb8f0a223b"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  dependencies:
    - "libiconv/2.6.1"
  cc: clang
  cxx: clang++

# 精简版补丁（4→2）
# 删除的补丁及理由：
# - 0001-tests-settings.sh: configure 从 settings.sh.in 自动生成，违反 R6
# - 0004-include-cddb-version.h: configure 从 version.h.in 自动生成，违反 R6
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

knowledge_gained:
  - "config.guess/config.sub 需更新以识别 aarch64-unknown-linux-ohos（唯一必要平台适配补丁）"
  - "libcddb 依赖 libiconv，需通过预编译包安装"
  - "make check 网络相关测试在离线环境必然失败，属于预期行为"
  - "cddb_log.h 上游 header guard 拼写错误: CDDB_LOH_H vs CDDB_LOG_H"
  - "version.h 和 settings.sh 是 configure 生成的文件，不应作为补丁提交（R6 铁律）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libcddb-1.3.2.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libcddb-1.3.2.work
  generated_at: '2026-06-01T18:03'
  patches_count: 2

patch_classification:
  - file: 0001-config.guess.patch
    type: platform
    platform_only: true
    guard: 'none'
    reason: "更新 2008→2023 版，识别 aarch64-unknown-linux-ohos"
  - file: 0002-config.sub.patch
    type: platform
    platform_only: true
    guard: 'none'
    reason: "更新 2008→2023 版，识别 aarch64-unknown-linux-ohos"
