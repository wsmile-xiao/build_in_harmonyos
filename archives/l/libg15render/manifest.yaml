software: libg15render
display: "libg15render"
description: "Rendering library and font conversion utility for Logitech G15 LCD displays"
category: gfx
homepage: "https://sourceforge.net/projects/g15tools/"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "Build the legacy C sources directly with the compiler selected by the Conan profile"
    - "Use the published FreeType package instead of the obsolete freetype-config probe"
    - "Allow packaged bitmap fonts to be located through LIBG15RENDER_FONT_DIR"
  common_dependencies:
    - freetype

versions:
  "1.3.0-svn316":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libg15render/1.3.0-svn316"
