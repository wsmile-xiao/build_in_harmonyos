package: libg15render/1.3.0-svn316
homepage: "https://sourceforge.net/projects/g15tools/"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "none"

# Upstream SVN r316 contains four C sources, Makefile.am/configure.in, fonts,
# documentation and Debian metadata. It has no tests/ directory, no test or
# check source files, no TESTS assignment and no check/test build target.
# `rg` finds only the generic INSTALL instruction mentioning `make check`.
upstream_tests: []

test_package_tests:
  - file: "test_libg15render.c"
    description: "15 API cases covering canvas state, pixels, drawing primitives, bitmap/XBM rendering, packaged font loading, bitmap text, FreeType and WBMP failure paths"
    command: "./test_libg15render <package-font-root>"
    assertion_count: 15
  - file: "test_libg15render_ohos.c"
    description: "HarmonyOS-specific AArch64 and 64-bit ABI checks plus an edge-pixel API operation on the native target"
    command: "./test_libg15render_ohos"
    assertion_count: 3
  - file: "conanfile.py"
    description: "Run the packaged g15fontconvert command with --help and --version and require successful exits"
    command: "<package>/bin/g15fontconvert --help; <package>/bin/g15fontconvert --version"
    assertion_count: 2

harmonyos_specific_tests:
  - file: "test_libg15render_ohos.c"
    description: "Require compiler-defined __OHOS__ and __aarch64__, verify the 64-bit ABI and execute a boundary pixel operation"
    command: "./test_libg15render_ohos"
    assertion_count: 3

assertion_count: 20
