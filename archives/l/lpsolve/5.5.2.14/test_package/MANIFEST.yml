package: lpsolve/5.5.2.14
homepage: "https://github.com/lp-solve/lp_solve"

upstream_tests_exist: true
upstream_test_audit:
  - source: "lp_solve tag 5.5.2.14, extra/UnitTest/UnitTest.c main()"
    reason: "main() invokes 48 test entries: UnitTest1..UnitTest46 plus UnitTest1presolve/UnitTest2presolve; counted by void UnitTest*( definitions and main() call sites (both 48)."
  - source: "lp_solve_5.5.2.14_source.tar.gz (conandata sources URL)"
    reason: "Release source tarball excludes extra/, xli/ and bfp extras (see release_process/build-targz-source.sh --exclude=extra); the suite is therefore vendored from the same tag into upstream_tests/ instead of the tarball."
  - source: "GitHub contents API for extra/UnitTest at tag 5.5.2.14 and main"
    reason: "44 entries; UnitTest1presolve.lp is absent on both, so UnitTest1presolve/UnitTest2presolve cannot run on any platform (assert would abort). Runner prints SKIP lines for exactly these 2; runnable subset is 46."
  - source: "extra/UnitTest/UnitTest.c read_LP call vs shipped name"
    reason: "Code reads UnitTest42.lp but the tag ships Unittest42.lp; recipe copies it to the capital-T name on the build copy before running (case-sensitive filesystems)."
  - conclusion: "Upstream total is 48; 46 run in the recipe build, 2 skip for the missing upstream data file with gaps evidence."

upstream_check_command: "extra/UnitTest/ccc equivalent: compile UnitTest.c with the library sources and run ./upstream_test"
upstream_test_in_build: true
upstream_test_command: "./upstream_test"
upstream_tests:
