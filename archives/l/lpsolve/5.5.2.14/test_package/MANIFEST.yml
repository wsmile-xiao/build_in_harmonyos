test_package_tests:
  - file: test_lpsolve.c
    description: "Build and solve a two-variable linear program through the public C API; verify optimum and variables"
    command: "./test_lpsolve"
  - file: test_lpsolve.c
    description: "Fault injection requires read_LP to reject an intentionally missing model file"
    command: "./test_lpsolve --fault-missing-model"
  - file: conanfile.py
    description: "Run the packaged lp_solve command and verify its help path"
    command: "lp_solve -h"

assertion_count: 10
