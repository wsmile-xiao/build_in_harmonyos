software: libevtx
display: "libevtx — Windows XML Event Log Library"
description: "访问 Windows XML 事件日志（EVTX）格式的 C 库，含 evtxinfo/evtxexport 终端工具"
category: forensics
homepage: "https://github.com/libyal/libevtx"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GNU config.guess 不识别 HarmonyOS，需内联添加 HarmonyOS 检测分支（E007）"
    - "config.sub 需添加 ohos-linux/ohos* OS 模式支持（E007）"
    - "HMDFS 下 umask 077 导致临时目录不可写，替换为 umask 022（E011）"
    - "关闭 Python 绑定与 NLS，零外部依赖，捆绑 libc* 内部库随包编译"
  common_dependencies: []

versions:
  "20251118":
    status: building
    build_date: "2026-09-15"
    source_url: "https://github.com/libyal/libevtx/releases/download/20251118/libevtx-alpha-20251118.tar.gz"
