# test_package/MANIFEST.yml — libevtx 20251118
package: libevtx/20251118
homepage: "https://github.com/libyal/libevtx"

# Upstream ships an automake test suite executed via `make check`.
upstream_tests_exist: true
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/test_library.sh
    source: libevtx-alpha-20251118/tests/test_library.sh
    description: "Library unit tests: 18 evtx_test_* binaries (chunk, file, record, template_definition, tools handles)"
    command: "make check"
  - file: tests/test_tools.sh
    source: libevtx-alpha-20251118/tests/test_tools.sh
    description: "Tools unit tests: evtxtools helper binaries exercised via test_tools.sh"
    command: "make check"
  - file: tests/test_evtxinfo.sh
    source: libevtx-alpha-20251118/tests/test_evtxinfo.sh
    description: "evtxinfo end-to-end test on bundled test images"
    command: "make check"
  - file: tests/test_evtxexport.sh
    source: libevtx-alpha-20251118/tests/test_evtxexport.sh
    description: "evtxexport end-to-end test on bundled test images"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Consumer test: get_version, access_flags, file_initialize, check_file_signature rejects non-EVTX, file_free"
    command: "./test_libevtx"

assertion_count: 5
