# 软件级 manifest — archives/l/librtmp/manifest.yaml
software: librtmp
display: "libRTMP"
description: "rtmpdump 工具集的 RTMP 客户端库(RTMP/RTMPE/RTMPS/RTMPT 流媒体协议)"
category: network
homepage: "https://rtmpdump.mplayerhq.hu/"
license: LGPL-2.1-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建,无 configure;CC/AR/SHARED 须以 make 命令行变量传入"
    - "OpenSSL 1.1+/3.x 兼容补丁:HMAC_CTX_new/free 与 DH 访问器(见 0001-openssl-1.1-3.x-compat.patch)"
    - "仅打包库,不含 rtmpdump 等命令行工具,无需 commands.json"
  common_dependencies:
    - openssl
    - zlib

versions:
  "2.4_git20190330":
    status: built
    build_date: "2026-09-19"
