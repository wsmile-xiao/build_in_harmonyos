# 版本级 manifest — archives/l/librtmp/2.4_git20190330/manifest.yaml
version: "2.4_git20190330"
software: "librtmp"
status: built
build_date: "2026-09-19"
build_system: "makefile"

source:
  url: "https://github.com/mstorsjo/rtmpdump/archive/c5f04a58fc2aeea6296ca7c44ee4734c18401aa3.tar.gz"
  sha256: "e6f1b4f024a7711801b7f2d57728158f5acfc97f3281219cf957ad6c51c1e93a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CRYPTO=OPENSSL (上游默认)"
    - "SHARED=no (默认静态; shared=yes 时产 librtmp.so.1)"
    - "XCFLAGS/XLDFLAGS 注入依赖 include/lib 与 fPIC"
  dependencies:
    - openssl/3.5.6
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-openssl-1.1-3.x-compat.patch"

knowledge_gained:
  - "上游 2019 快照的 HMAC_CTX_init/cleanup 与栈上 HMAC_CTX 在 OpenSSL 1.1+ 已移除,DH 结构体成员不透明,须按 OPENSSL_VERSION_NUMBER 分支用 HMAC_CTX_new/free 与 DH_get0_pqg/DH_get0_key/DH_set0_pqg/DH_set_length 重写"
  - "上游 Makefile 显式赋值 CC/AR/SHARED,会覆盖环境变量;必须以 make 命令行变量传入,依赖参数走预留的 XCFLAGS/XLDFLAGS 通道"
  - "git.ffmpeg.org cgit snapshot 端点对非浏览器客户端返回反爬 HTML,CI 不可用;采用 mstorsjo/rtmpdump 权威镜像的 GitHub commit 归档"
  - "上游无任何测试目标(tests/check 均无),测试计数按 0/0 披露;消费者测试 34 处断言实调公开 API"
