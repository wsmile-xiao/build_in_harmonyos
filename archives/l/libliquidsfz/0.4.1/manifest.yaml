version: "0.4.1"
status: built
build_date: "2026-09-14"
conan_ref: "libliquidsfz/0.4.1"

source:
  url: "https://github.com/swesterfeld/liquidsfz/releases/download/0.4.1/liquidsfz-0.4.1.tar.bz2"
  sha256: "b086b371f28fce0d8e882b0b5b9abb71b2124875cf743f4d527bbcb8a4e13f02"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--disable-shared --enable-static"
    - "--without-jack"
    - "--without-lv2"
  dependencies:
    - libsndfile/1.2.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-sub-ohos.patch"

knowledge_gained:
  - "The bundled 2018 config scripts are old-style (no GUESS= variable); the E564 double anchor makes config.guess emit aarch64-unknown-linux-ohos and config.sub accept linux-ohos"
  - "configure/make/check/install under SHELL/CONFIG_SHELL=/system/bin/sh avoids the HNP bash libtool quoting corruption (E551) and HMDFS getcwd failures"
  - "configure carries exactly two umask 077 sites; both rewritten to umask 022 before configure runs (E011 HMDFS temporaries)"
  - "The published libsndfile sndfile.pc bakes a foreign absolute prefix; PKG_CONFIG_PATH must point at the PkgConfigDeps-generated sndfile.pc"
  - "Upstream make check (testsynth + testsfzreader) is fully offline and passes on the HarmonyOS device without executable signing"

test_results:
  type: authoritative_ci_harmonyos_aarch64
  total: 2
  passed: 2
  failed: 0
  reason: "Upstream make check PASS 2/2 (testsynth, testsfzreader) on device plus Conan test_package render round-trip; L0/L1/L4/L5 status in ci-metadata.json"
