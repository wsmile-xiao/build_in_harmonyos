package: liquidsfz/0.4.1
homepage: https://github.com/swesterfeld/liquidsfz

upstream_tests_exist: true
upstream_test_in_build: true
upstream_check_command: >-
  make check (automake test harness; tests/Makefile.am TESTS = testsynth
  testsfzreader, run by the recipe build() on the OHOS device)
upstream_test_audit:
  declared_automake_tests: 2
  selected_automake_tests: 2
  reason: >-
    Both upstream TESTS entries are deterministic and fully offline: testsynth
    generates its own wav/sfz fixtures with libsndfile and asserts rendered
    sine content; testsfzreader parses SFZ in memory. The remaining test
    programs (testliquid testperf testxf testenvelope testcurve testhydrogen
    testmidnam testfilter) are check_PROGRAMS built but intentionally absent
    from upstream TESTS; testupsample only builds with --with-fftw (disabled).
upstream_tests:
  - file: "tests/testsynth.cc"
    source: "liquidsfz-0.4.1 tests/Makefile.am"
    description: "Generate wav fixture, render via Synth, sine-detection assertions."
    count: 1
  - file: "tests/testsfzreader.cc"
    source: "liquidsfz-0.4.1 tests/Makefile.am"
    description: "In-memory SFZ parser assertions."
    count: 1

test_package_tests:
  - file: test_liquidsfz.cc
    description: "Link the installed static library (which pulls libsndfile transitively), render note 60 from a hand-written PCM16 wav + generated SFZ fixture, assert non-silent bounded output and Synth accessors."
    count: 1

assertion_count: 3
