software: libliquidsfz
display: "LiquidSFZ"
description: "SFZ v1 sampler library rendering sample-based instruments through libsndfile"
category: data
homepage: "https://github.com/swesterfeld/liquidsfz"
license: MPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游默认仅静态库（AC_DISABLE_SHARED + pic-only），OHOS 沿用静态形态"
    - "捆绑 2018 旧式 config.guess/sub 需 E564 双锚点补丁识别 HarmonyOS/linux-ohos"
    - "configure/make 全程 /system/bin/sh + umask 022 + TMPDIR 构建目录（E547/E551/E011）"
    - "必须 --without-jack --without-lv2（无 jackd 运行时与 X11 栈）"
  common_dependencies:
    - libsndfile

versions:
  "0.4.1":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libliquidsfz/0.4.1"
