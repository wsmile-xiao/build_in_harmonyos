# 版本级 manifest —— libe-book-tools 0.1.3
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.3"
software: libe-book-tools

status: built
build_date: "2026-09-20"
build_system: autotools

# ⚠️ 拆分说明：本包只交付三个命令行转换器（ebook2raw / ebook2text /
#    ebook2html），库本体属另一条平台任务 libe-book 0.1.4（其配方以
#    --without-tools 明确让位）。因此包内只有 bin/ 与 licenses/，没有
#    lib/ 与 include/——同一份 libe-book-0.1.a 以两个制品名交付会让同时
#    依赖两者的消费者拿到重复符号。
# ⚠️ 可退化移植（§3.6）：关闭 liblangtag，语言标注不可得，边界见
#    build.language_support。
build:
  system: autotools
  delivers:
    - bin/ebook2raw
    - bin/ebook2text
    - bin/ebook2html
  language_support:
    liblangtag: disabled
    reason: >-
      与 libe-book 0.1.4 同一判据：archives/l/liblangtag/0.6.4/manifest.yaml
      写着 status: published，但制品仓实测无 liblangtag 发布（发布流水线缺
      口，不是缺任务）。为与库本体保持同一构建形态，工具包同样
      --without-liblangtag；否则同一份源码在两个包里编出行为不同的解析器。
    retained:
      - "全部电子书格式识别与解析（PalmDoc/Plucker/PeanutPress/zTXT/TealDoc/FictionBook 2/EPUB/OPF/HTML/BBeB 等）"
      - "三种导出：文档模型转储（raw）、纯文本（text）、XHTML（html）"
      - "上游单元测试套件（src/test 的 cppunit 程序，make check 硬门禁）"
    removed:
      - "文本段的语言标注（与库本体同一退化边界，不影响转换器输出内容）"
  tools_split:
    tools_built: true
    reason: >-
      --with-tools：本包存在的理由。它同时打开 configure 的 need_stream 与
      need_generators，因此必须比库本体多导出 REVENGE_GENERATORS_CFLAGS/_LIBS
      一组变量；pkg.m4 对两半分别判空（任一半为空就落回 $PKG_CONFIG 调用），
      而真机与 worker 都不该指望 pkg-config 能解析已发布 .pc 里的 //lib
      libdir——该探测失败是 as_fn_error 硬报错（本 dist 的 configure 生成码
      实测，见 knowledge_gained），配方不会拿到一个「成功但没有 bin/」的包。
  upstream_tests:
    framework: cppunit
    command: "make -j1 check"
    in_build: true
    declared_in_tarball: 22
    compiled_with_this_config: 14
  configure_options:
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu：本 dist 的 config.sub/config.guess 是 2013 版，实测拒绝 musl 与 ohos 形态（machine `aarch64-unknown-linux' not recognized），只认 GNU 形态；与已合入的 archives/l/libmspub-tools/0.1.4 同一选择。libe-book 0.1.4 用的 musl 三元组不可照抄——它那份 dist 的 aux 脚本更新，确实认 musl"
    - "--prefix=/；--enable-static --disable-shared（R26）；--disable-dependency-tracking"
    - "--with-tools：构建 src/conv/{raw,text,html} 三个转换器（本包交付物）"
    - "--enable-tests：构建 src/test/ 的 cppunit 程序，配方在 build() 内以 make check 执行（硬门禁）"
    - "--without-liblangtag：§3.6 可退化移植，与库本体保持一致"
    - "--without-docs"
    - "CXXFLAGS=-std=c++17：与 profile cppstd=17 一致"
    - "REVENGE / REVENGE_STREAM / REVENGE_GENERATORS / XML / ZLIB / ICU / CPPUNIT 共 7 组 PKG_CHECK_MODULES 变量逐个导出，每组 CFLAGS 与 LIBS 两半都必须非空"
    - "librevenge 经「只放 .a 的干净 -L 目录」（其 .la 记录 //lib 会让 libtool 报 moved）；libxml2 共享库直连包目录并 bake -Wl,-rpath；icu4c 静态库链接行带 -lc++"
    - "gperf 经 tool_requires 并前置 PATH（AC_PATH_PROG 硬检查 + src/lib BUILT_SOURCES 用 gperf 编 6 张 .gperf token 表）"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash；umask 077→022 改写（configure 恰 2 处）；辅助脚本 chmod +x（E490）；TMPDIR 指向构建目录内 .tmp；CC/CXX 从 profile conf 显式导出（R33）；LD_LIBRARY_PATH 显式置空防 CI worker 环境污染"
  dependencies:
    - librevenge/0.0.5
    - libxml2/2.15.3.1
    - zlib/1.3.1
    - icu4c/77
  build_requirements:
    - boost/1.90.0.3（tool_requires，私有头）
    - cppunit/1.15.1（tool_requires，上游测试套件用）
    - gperf/3.3（tool_requires，AC_PATH_PROG 硬检查 + .gperf 生成）
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-src-EBOOKCharsetConverter-icu-true-false.patch

knowledge_gained:
  - "ICU 新版不再提供 legacy 的 TRUE/FALSE 常量：0.1.3 的 src/lib/EBOOKCharsetConverter.cpp:127 用 `ucnv_convertEx(..., TRUE, TRUE, &status)`，对 icu4c/77 编译报 \"use of undeclared identifier 'TRUE'\"（全树 src/ 与 inc/ 里 `\\b(TRUE|FALSE)\\b` 仅此 1 处，0.1.4 是 0 处）。上游 0.1.3→0.1.4 之间改的正是这一行（两份文件其余逐字节相同），所以正确修法是把那一行改成 C++ 的 true/false，而不是 #define TRUE 1 这类发明"
  - "真机上 `ld`/`ar`/`nm` 都不在 PATH（实测 command -v 全 NONE，只有 <sdk>/native/llvm/bin 下的 ld.lld/llvm-ar/llvm-nm/…），而 profile [buildenv] 里的 AR=llvm-ar / LD=ld.lld 映射只经 conan 的 conanbuild 脚本生效——裸 subprocess 跑 configure 的配方必须自己导出，否则 libtool 把 AR 退化成 false 报 `could not determine false interface`（E012/E528），补上 AR 后下一个是 `no acceptable ld found in $PATH`。这两个探测在 cross 与 native 模式下都会跑，所以换三元组躲不掉"
  - "库/工具拆分成两个 conan 包时，工具包必须自己再跑一遍上游 make check：转换器的 LDADD 用的是本树 src/lib/libe-book-0.1.la（不是制品仓里的库包），库没编好就出不了工具，测试也是同一条链路上的证据；两个包各自 --without/--with-tools 会各自编一遍 src/lib，这是拆分的固有代价"
  - "AC_ARG_WITH([tools]) 只决定要不要探测，不会在探测失败时静默降级：本 dist 的 configure 生成码里 PKG_CHECK_MODULES([REVENGE_GENERATORS],[librevenge-generators-0.0]) 失败走 as_fn_error（\"Package requirements (librevenge-generators-0.0) were not met\"，或 pkg-config 缺失时 \"The pkg-config script could not be found or is too old\"），构建直接停在手 configure 那一步，不会出「成功但没 bin/」的包。因此工具包相对库包多一处必须预置的变量对，而 pkg.m4 是 CFLAGS 与 LIBS 两半分别判空、分别决定要不要调 pkg-config —— 只给一半照样会去调"
  - "PKG_CHECK_MODULES 的预置变量必须 CFLAGS 与 LIBS 两半都非空（只给 LIBS 会落到 pkg-config 分支），且 generators 这一组的 LIBS 仍要重复 -lrevenge-0.0：librevenge-generators 的符号依赖 revenge 本体，静态 .a 没有传递闭包"
  - "只交付可执行文件的包（package_type=application）在 package() 里按白名单裁掉 lib/include/share，比在 configure 里禁用安装目标更可控：autotools 没有「只装 bin_PROGRAMS」的通用目标，而 src/conv 的 install 又依赖 src/lib 的 .la 存在"
  - "消费者测试里判「真的解析了文档而不是把字节回显出来」最省事的反向断言：text 输出里不得出现源文件的 XML 起始标签。它同时挡住两类假绿——恒定回显、以及解析器只做了 passthrough"
