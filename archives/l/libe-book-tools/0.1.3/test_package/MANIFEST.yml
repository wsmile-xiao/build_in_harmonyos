# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与机械检查 G1 强制要求）
package: libe-book-tools/0.1.3
homepage: "https://sourceforge.net/p/libebook/"

# 上游自带测试套件：src/test/ 把一个 cppunit 程序 `test` 同时登记进
# check_PROGRAMS 与 TESTS，由 `make check` 执行；--enable-tests 是上游默认。
# 配方在 build() 里以 make -j1 check 作为硬门禁真跑（失败即出不了包）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check（配方 build() 内执行）"

# 用例数口径（诚实的「声明 ≥ 实测」）：
#   dist 包里 src/test/*.cpp 的 CPPUNIT_TEST 宏总数 = 22
#     取数: for f in libe-book-0.1.3/src/test/*Test.cpp; do grep -cE '^[[:space:]]*CPPUNIT_TEST[[:space:]]*\(' $f; done
#   其中真正参与本次编译的 TU = 14
#     EBOOKBitStreamTest 9 + EBOOKMemoryStreamTest 2 + PDBLZ77StreamTest 1 + SoftBookLZSSStreamTest 2
#   被上游自身条件编译排除的 8 个：
#     EBOOKLanguageManagerTest 2 —— 需 liblangtag（--without-liblangtag，制品仓无该发布）
#     XMLCollectorTest 4 + XMLTreeWalkerTest 2 —— 需 --enable-experimental（libcss/hubbub/mspack，未启用）
#   test.cpp 是运行器（0 用例）。实际跑出的条数以构建日志里 cppunit 自报的
#   "OK (N tests)" 为准，见 notes.md 的真机取证段。
upstream_test_counts:
  declared_in_tarball: 22
  compiled_with_this_config: 14
  excluded_by_conditions: 8

upstream_tests:
  - file: src/test/test（cppunit 聚合程序）
    source: libe-book-0.1.3.tar.xz
    description: >-
      上游单元测试：位流（EBOOKBitStream）、内存流（EBOOKMemoryStream）、
      PDB LZ77 解压流（PDBLZ77Stream）、SoftBook LZSS 解压流
      （SoftBookLZSSStream）四个 TU，由 test.cpp 经 cppunit
      TestFactoryRegistry 聚合运行。
    command: "./test"

# test_package 自带的消费者测试（鸿蒙特有测试行，rule12）
test_package_tests:
  - file: test_package/test_libe_book_tools.sh
    description: >-
      命令行交付物的端到端断言：bin/ 结构与三个转换器的可执行位；本包只交付
      可执行文件（断言包内没有 lib/ 与 include/，把 W2 拆分本身变成可检查的
      事实）；ELF 身份（magic + e_machine=EM_AARCH64，由 od 读字节，不依赖设备
      上是否装 readelf）；--version 退出码 0 且自报 "ebook2text 0.1.3"；正向
      语料就地生成 FictionBook 2，跑满三条导出链路并断言各自的真实形态——
      text 含正文且不得回显 <FictionBook 标签、raw 转储含 openParagraph /
      setDocumentMetaData / insertText(text: …)、html 含 <html> 与
      meta author/subject；--info 断言 dc:subject 与 meta:initial-creator 两条
      元数据且输出分支与正文不同；负向对照用一段非文档字节要求三个工具都退出码
      1 且报 "has not been recognized"；另按实测把 0.1.3 的已知边界固化成断言
      （最小 XHTML 语料被识别但 parse 返回非 OK → rc=1 且 stderr 无
      "not recognized"，上游 0.1.4 才修好这条链路），再加未知选项与无参数两条
      usage 非零退出。脚本自行打印 TOTAL/PASS/FAIL，任一条失败即非零退出。
    command: "sh test_libe_book_tools.sh <bin> <work> <pkg>"

# 覆盖边界（如实声明）：liblangtag 的语言标注与 --enable-experimental 的
# libcss/hubbub/mspack 格式路径上游默认关闭、本包未启用，对应 8 个用例不参与
# 本次 make check；转换器的图形界面类格式（CHM/BBeB 容器）未构造样本语料，
# 正向覆盖限于 FB2 与 XHTML 两种 XML 系格式。
assertion_count: 46
