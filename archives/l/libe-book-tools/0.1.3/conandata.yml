# conandata.yml — libe-book-tools 0.1.3
# Official Document Liberation release tarball, hosted in the project's own
# dist directory. A dist tarball is mandatory here (not a source-control
# archive): the OHOS device has no autoconf/automake/libtoolize, so only this
# tarball's pre-generated configure can drive the build.
# sha256 measured twice: on this host (sha256sum over the 416268-byte download
# that answered HTTP 200) and on the HarmonyOS device by the recipe's own
# _fetch() check. The same retrieval reproduces libe-book 0.1.4's recorded
# sha256 in archives/l/libe-book/0.1.4/conandata.yml, which is what makes this
# coordinate trustworthy.

sources:
  url: "https://dev-www.libreoffice.org/src/libe-book-0.1.3.tar.xz"
  sha256: "7e8d8ff34f27831aca3bc6f9cc532c2f90d2057c778963b884ff3d1e34dfe1f9"

patches:
  - patch_file: "patches/0001-src-EBOOKCharsetConverter-icu-true-false.patch"
    patch_description: >-
      ucnv_convertEx 的 TRUE/FALSE 实参改为 C++ 的 true/false：ICU 不再提供
      legacy 的 TRUE/FALSE 常量，0.1.3 这一行对 icu4c/77 编译报
      "use of undeclared identifier 'TRUE'"。上游在 0.1.3→0.1.4 之间改的正是
      这一行（两个文件其余逐字节相同），故补丁照抄上游改法而非发明宏 shim。
    patch_type: "portability"
