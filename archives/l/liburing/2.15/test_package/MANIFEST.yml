# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liburing/2.15
homepage: "https://github.com/axboe/liburing"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# liburing build() only builds the 'src' target, not tests/examples
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# liburing has extensive tests in test/ directory but they depend on
# glibc-specific headers (error.h) not available on HarmonyOS.
# The core library builds fine; tests are skipped on OHOS.
upstream_tests:
  - file: test/
    source: liburing-2.15/test/
    description: "Upstream io_uring test programs (require glibc error.h, skipped on OHOS)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
# R34: test_package.c calls io_uring_queue_init() — a real liburing API function
test_package_tests:
  - file: test_package.c
    description: "Consumer test: calls io_uring_queue_init() to verify library linkage"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
