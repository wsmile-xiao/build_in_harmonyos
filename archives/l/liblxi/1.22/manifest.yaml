# manifest.yaml — liblxi 1.22（ARCHIVE-SPEC v2.0）

version: "1.22"
software: "liblxi"
status: built
build_date: "2026-09-18"
build_system: meson

source:
  url: "https://github.com/lxi-tools/liblxi/archive/refs/tags/v1.22.tar.gz"
  sha256: "d33ca3990513223880ec238eb2e5aa1cc93aff51c470ef0db9df3e0c332493d5"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Ddefault_library=static"
  dependencies:
    - libtirpc/1.3.7
    - libxml2/2.15.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-meson-library.patch"
  - "0002-ohos-pthread-cancel-signal-exit.patch"

knowledge_gained:
  - "musl 无 pthread_cancel（E085）：E513 guarded-signal-thread-exit 模式（weak 探测 + SIGRTMIN handler pthread_exit）可在库内保住 join 语义，无平台宏"
  - "上游 meson 硬编码 shared_library 时 default_library 无效，改为 library() 使配方 shared 选项真实生效"
  - "meson install 复制产物保留链接期 .codesign 段（llvm-readelf -S 实测），无需 E077 重签"
