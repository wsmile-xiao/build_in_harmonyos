software: liblxi
build_system: meson

# ============================================================
# 必须字段
# ============================================================

version: "1.22"
status: published
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/lxi-tools/liblxi/archive/refs/tags/v1.22.tar.gz"
  sha256: "d33ca3990513223880ec238eb2e5aa1cc93aff51c470ef0db9df3e0c332493d5"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "meson setup builddir --prefix=$DEFAULT_PREFIX"
  dependencies:
    - libxml2/2.15.3
    - libtirpc/1.3.3
  optional_deps:
    - avahi-client (不可用, required:false, mDNS发现禁用)
  cc: clang
  cxx: clang++
  compiler_version: "clang 15.0.4"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 产物信息
# ============================================================

artifacts:
  shared_library: liblxi.so.1.0.0 (39232 bytes, ELF64 LSB arm64)
  header: lxi.h (2707 bytes)
  pkgconfig: liblxi.pc
  man_pages: 7 (lxi_connect.3 等)
  precompiled_package: liblxi-1.22-ohos-aarch64.tar.gz (1.5MB)

# ============================================================
# 编译警告 (4条, 非致命)
# ============================================================

warnings:
  - "vxi11core_clnt.c:161 pragma diagnostic pop无匹配push — 无影响"
  - "vxi11.c:121,213 pthread_cancel未声明 — musl不支持 (E051)"
  - "vxi11.c:406 xmlRecoverMemory已弃用 — 仅警告"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "LD_LIBRARY_PATH必须将SDK llvm/lib放在~/usr/local/lib之前, 否则lld链接器因加载不兼容的libxml2而崩溃 — ref: E080"
  - "avahi-client不可用导致mDNS发现功能禁用, VXI-11发现仍可用 — ref: platform"
  - "pthread_cancel在musl上未实现, vxi11.c仅编译警告, 运行时如触发会失败 — ref: E051"

# ============================================================
# 真实功能验证 (7项全部PASS)
# ============================================================

functional_test_results:
  - test: "lxi_init() 初始化" → result: "✅ PASS, 返回0"
  - test: "lxi_discover() 设备发现" → result: "✅ PASS, 返回0"
  - test: "lxi_connect() 连接无效地址" → result: "✅ PASS, 返回-1"
  - test: "lxi_send() 发送无效句柄" → result: "✅ PASS, 返回-1"
  - test: "lxi_receive() 接收无效句柄" → result: "✅ PASS, 返回-1"
  - test: "lxi_disconnect() 断开无效句柄" → result: "✅ PASS, 返回0"
  - test: "符号完整性 (7个API+常量+枚举)" → result: "✅ PASS, 全部可链接"