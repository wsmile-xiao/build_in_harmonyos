# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: liblxi/1.22
homepage: "https://github.com/lxi-tools/liblxi"

# 上游测试清点（R51 三步法，2026-09-18，tag v1.22）：
# meson.build 仅 subdir('src')/subdir('man')，无 test/meson.build，
# 无任何 meson test 注册入口 → `meson test --list` 为空，注册测试数 = 0。
# test/ 目录存在 4 个未注册示例程序（search.c / search-mdns.c / scpi.c /
# receive-image-data.c），均需局域网内真实 LXI 仪器（mDNS 发现或 SCPI
# 会话对某 IP 的仪器收发）；设备与 CI 均无仪器，逐项无法运行，原因
# 逐条记录于 notes.md"未执行测试"节与 PR 正文"上游测试用例修改说明"。
upstream_check_command: "meson test --list（无注册测试，清单为空）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（注册测试 = 0，故为空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：本地回环模拟 RAW 仪器，经 lxi_init/lxi_connect/lxi_send/lxi_receive/lxi_disconnect 全链路行为断言"
    command: "./test_liblxi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
