# conandata.yml — liblxi 1.22
# 官方源（GitHub releases tag v1.22）；sha256 取自下载件实测。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/lxi-tools/liblxi/archive/refs/tags/v1.22.tar.gz"
    - "https://github.com/lxi-tools/liblxi/archive/refs/tags/v1.22.tar.gz"
  sha256: "d33ca3990513223880ec238eb2e5aa1cc93aff51c470ef0db9df3e0c332493d5"

# 0001-ohos-meson-library.patch：上游 src/meson.build 硬编码 shared_library()，
# meson 的 default_library 选项对其无效；改为 library() 使配方 shared 选项
# （默认 static，R26 交付口径）真实生效。
# 0002-ohos-pthread-cancel-signal-exit.patch：musl（OHOS）无 pthread_cancel
# （E085），static 交付后消费者链接报 undefined symbol；按 E513
# guarded-signal-thread-exit 用 weak 探测 + SIGRTMIN handler pthread_exit
# 保住 join 语义（glibc 上仍走真 cancel）。
patches:
  - patch_file: "patches/0001-ohos-meson-library.patch"
    patch_type: "portability"
    patch_description: "meson.build: shared_library → library，使 default_library（配方 shared 选项）生效"
  - patch_file: "patches/0002-ohos-pthread-cancel-signal-exit.patch"
    patch_type: "portability"
    patch_description: "vxi11.c: musl 无 pthread_cancel，weak 探测 + 实时信号线程退出保 join 语义（E513）"
