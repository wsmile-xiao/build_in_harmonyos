software: libosip
# 版本级 manifest
# 文件位置: archives/l/libosip/5.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.3.2"

# 编译状态
status: published

# 编译日期
build_date: "2026-09-10"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.gnu.org/gnu/osip/libosip2-5.3.2.tar.gz"
  sha256: "16186f6f5540936b62c3aaca6e8409e1af25cd22abc3882b393be215f49d3b00"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--enable-test"
    - "--enable-pthread"
    - "--enable-shared"
    - "--disable-static"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# E007: tarball 内置 config.guess (2014-03-23) / config.sub (2014-09-11)
# 不识别 HarmonyOS（uname -s=HarmonyOS 时 guess 失败、sub 拒绝
# aarch64-unknown-linux-ohos）；补丁教会两脚本 linux-ohos，配方再显式传
# --build/--host=aarch64-unknown-linux-ohos。E011 umask 与 libtool
# RUNPATH 清除仍在 conanfile.py 的 _patch_source_tree()/_drop_libtool_
# rpath() 中完成
patches_applied:
  - file: patches/0001-config-guess-config-sub-ohos.patch
    description: >
      config.guess: aarch64:HarmonyOS:*:* → aarch64-unknown-linux-ohos；
      config.sub: 增加 -linux-ohos* OS 模式
    sha256: 4c9d8d7b3eda8a5196ed6a8e07523eaae4b7983b476a605edb8b82e27d75e67b

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libosip2 5.3.2 tarball 内置 config.guess/config.sub 为 2014 版，不识别 aarch64-unknown-linux-ohos (E007)；HarmonyOS 下 uname -s=HarmonyOS 旧版 guess 直接失败，须补丁教会两脚本 linux-ohos 并显式传 --build/--host 真实三元组，不能依赖复制主机 automake 版本（原生 automake 1.16 同样不认识 HarmonyOS，worker 也未必有该 share 目录）(knowledge_ref: E007)"
  - "HMDFS 文件系统下 configure/config.status 的 umask 077 会导致 'could not setup config files machinery' (E011)，需改为 umask 022 (knowledge_ref: E011)"
  - "OHOS 无 /usr/bin/install，configure 回退到 tarball 内 1991 版 install-sh（仅支持单文件安装，批量调用时多余文件静默丢弃且 rc=0）；automake am__base_list 批量调用下 make install 每批只装第 1 个文件，须替换为主机 automake-1.16 版 install-sh 并在 package() 后断言产物数量 (knowledge_ref: DRAFT-E574)"
  - "libtool 在安装的 .so 中写入绝对 RUNPATH；无 patchelf 时可在 configure 后将生成 libtool 脚本的 hardcode_libdir_flag_spec 置空，链接产物即无 DT_RUNPATH 且保留 SONAME/NEEDED (knowledge_ref: DRAFT-E575)"
  - "hmfs 上 Makefile 相对路径执行 ./$(top_srcdir)/.../tst 报 inaccessible；测试须用绝对路径经 sh 调用 (knowledge_ref: notes.md 测试节)"
  - "OHOS clang 链接 .so 时自动加 .codesign 段；打包后需 objcopy --remove-section .codesign 后用 binary-sign-tool -selfSign 重签（同 libxml2/2.15.3 做法） (knowledge_ref: archives/x/libxml2/2.15.3 notes.md)"
  - "上游测试默认关闭：configure --enable-test 才构建；tst 脚本驱动 torture_test 跑 161 个 res/ 文件（99 sip* + 23 sip-malformed* = 122 用例，普通+clone 两模式），另有 10 个 noinst 单项程序（turls.c 构建为 turl）需手动带 res/ 参数运行 (knowledge_ref: notes.md 测试节)"
  - "包名 libosip 与上游 tarball 名 libosip2 不同：一个包产出两个库 libosip2 + libosipparser2，SONAME 均为 *.so.15（-version-info 15:1:0），cpp_info.libs 应为 ['osip2', 'osipparser2'] (knowledge_ref: notes.md 构建节)"
  - "oSIP API 陷阱（包级使用契约，非通用适配知识）：osip_message_parse 前必须 parser_init()；set_method/set_version/set_reason_phrase 不拷贝字符串须传 osip_strdup 堆串；osip_body_t.body 按 Content-Length 截断非 NUL 终止；从 request 造 response 须先清 sip_method (knowledge_ref: notes.md 包级使用契约节)"

knowledge_ref:
  - "knowledge/drafts/DRAFT-E574-libosip-installsh-single-file-batch-loss.kv"
  - "knowledge/drafts/DRAFT-E575-libosip-libtool-hardcode-empty-no-runpath.kv"
