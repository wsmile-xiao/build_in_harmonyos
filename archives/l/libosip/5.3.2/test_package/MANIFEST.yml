# test_package/MANIFEST.yml
package: libosip/5.3.2
test-type: functional
needs-device: false
description: |
  Consumer tests for GNU oSIP 5.3.2 (osip2 + osipparser2):
  SIP message parsing (full INVITE with SDP), generation and round-trip,
  URI parsing/serialization, header accessors (To/From/CallID/CSeq/Via/
  Contact/Max-Forwards), body and SDP handling, malformed-input rejection,
  and osip2 transaction-layer init. On OHOS additionally verifies the
  packaged artifacts: AArch64 ELF, musl libc NEEDED, SONAME
  libosip2.so.15 / libosipparser2.so.15, .codesign section, no RPATH.
entry: conan test . --build=libosip
