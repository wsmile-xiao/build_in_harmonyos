knowledge_gained:
  - "OHOS 动态加载器拒载未正确签名的共享库：meson install 落地后的 libgexiv2.so.2.14.6 用 ctypes.CDLL()/dlopen 直接报 'Permission denied'（同一文件、同一目录，仅 .codesign 不同）。用 binary-sign-tool sign -selfSign 1 原地签名后即可加载；构建目录内的同一库因带 RUNPATH 而恰好可加载，掩盖了问题。 (knowledge_ref: gdk-pixbuf/2.44.6 package() 同款)"
  - "meson 项目若使用 gnome.mkenums，Conan PkgConfigDeps 生成的 glib-2.0.pc 缺少 glib 的自定义变量（glib_mkenums / glib_genmarshal），meson 直接报 'Could not get pkg-config variable and no default provided for <PkgConfigDependency glib-2.0>'。修法：把变量按包内绝对路径补进 generators 目录的 glib-2.0.pc（gupnp-av/0.14.5、atk/2.38.0.1.1 同款）。 (knowledge_ref: 已有先例，无需新增条目)"
  - "gexiv2 提供 g-ir-scanner 的唯一包是 gobject-introspection/1.78.1.1，其 force=True 依赖（zlib/1.3.1.1.1.1 + libffi/3.5.2）会改写 glib/2.84.0.1 与 python/3.12.9 的 package_id，而这两个 package_id 在 ohpcd 制品仓没有已发布二进制（conan install --build=never 报 Missing；conan download <ref>:<pkgid> 报 error:not found）→ introspection 特性在本环境不可用，属 R36 依赖阻塞而非配方缺陷。"
  - "glib/2.88.x 要求 zlib/1.3.2 / 1.3.1，与 exiv2/0.28.7 钉死的 zlib/1.3.1.1 冲突（ERROR: Version conflict）；glib/2.84.0.1 与 exiv2 共享 zlib/1.3.1.1，是本库可用的 glib 版本。"

knowledge_ref:
  - "DRAFT-E5xx-ohos-unsigned-shared-lib-permission-denied（OHOS 拒载未签名共享库；随本 PR 以【知识库扩展】提交）"
