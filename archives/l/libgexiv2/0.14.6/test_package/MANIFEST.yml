# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# libgexiv2 0.14.6 上游测试由 Meson 注册（`test/meson.build`），共 3 个入口：
#   1. regression        → test/gexiv2-regression.c（glib g_test，TAP 输出，16 个子用例）
#   2. python3-gexiv2    → test/python/gexiv2.py（unittest，3 例）
#   3. python3-metadata  → test/python/test_metadata.py（unittest，57 例）
# 入口 2/3 需要 GExiv2 的 GIR/typelib（即 meson introspection=true + g-ir-scanner），
# 而提供 g-ir-scanner 的 gobject-introspection/1.78.1.1 其强制版本闭包
# （glib/2.84.0.1、python/3.12.9 在 force=True 的 zlib/1.3.1.1.1.1 + libffi/3.5.2 下）
# 在 ohpcd 制品仓没有已发布二进制（R36 阻塞，证据见 notes.md / reports/test-report.md），
# 故本次只执行 entry 1。入口 1 在配方 build() 的 meson.test() 中真机运行（OHOS 原生）。

package: libgexiv2/0.14.6
homepage: https://gitlab.gnome.org/GNOME/gexiv2

# 上游测试命令（Meson 工程；如需列出用例：meson test --list）
upstream_check_command: "meson test -v -C <build_folder>"

# conanfile.py build() 中已集成上游测试（OHOS 真机运行）
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <build_folder>"

# 上游测试入口（完整统计与被阻塞清单见 reports/test-report.md）
upstream_tests:
  - file: test/gexiv2-regression.c
    source: gexiv2-0.14.6.tar.xz/test/gexiv2-regression.c
    description: "上游 C 回归套件（glib g_test / TAP，16 个子用例，含 0.14.6 issue #87 修复回归）"
    command: "meson test -v regression"
  - file: test/python/gexiv2.py
    source: gexiv2-0.14.6.tar.xz/test/python/gexiv2.py
    description: "上游 Python unittest（3 例）——需 GIR/typelib；被 R36 依赖阻塞未执行"
    command: "meson test python3-gexiv2"
  - file: test/python/test_metadata.py
    source: gexiv2-0.14.6.tar.xz/test/python/test_metadata.py
    description: "上游 Python unittest（57 例）——需 GIR/typelib；被 R36 依赖阻塞未执行"
    command: "meson test python3-metadata"

# test_package 自带测试（消费者视角）
test_package_tests:
  - file: test.c
    description: "版本三元组 + GExiv2Metadata 真实 JPEG 元数据读写往返 + OHOS dlopen 运行时解析"
    command: "./test_gexiv2"

# 本次实际执行的断言/用例数：上游 regression 16 个 TAP 子用例 + test_package 13 项检查
assertion_count: 29
