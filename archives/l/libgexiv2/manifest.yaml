# 软件级 manifest
# 文件位置: archives/l/libgexiv2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: libgexiv2
display: "gexiv2"
description: "GObject-based wrapper around the Exiv2 library (metadata reader/writer)"
category: library
homepage: "https://gitlab.gnome.org/GNOME/gexiv2"
license: GPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "C++ meson 库（gexiv2/ 下 10 个 .cpp，C++17），对外是 C ABI + GObject；上游只直接依赖 exiv2(>=0.26) 与 gobject-2.0/gio-2.0(>=2.46.0)"
    - "安装后的共享库必须用 binary-sign-tool 签名，否则 OHOS 动态加载器拒载（dlopen 报 Permission denied）"
    - "soname 链接（libgexiv2.so.2 / libgexiv2.so）在 OHOS 上改为真实文件副本"
    - "gnome.mkenums 需要 glib-2.0.pc 的 glib_mkenums 变量，Conan PkgConfigDeps 不生成该变量，配方内补齐"
    - "introspection/vapi/python3/tools 全部关闭：提供 g-ir-scanner 的 gobject-introspection/1.78.1.1 依赖闭包在 ohpcd 缺二进制（R36），上游 2 个 python3 测试入口因此无法执行"
    - "glib 必须用 2.84.0.1（与 exiv2 共享 zlib/1.3.1.1）；glib/2.88.x 会与 exiv2 钉死的 zlib 版本冲突"
  common_dependencies:
    - exiv2
    - glib

versions:
  "0.14.6":
    status: built
    build_date: "2026-09-21"
    conan_ref: "libgexiv2/0.14.6@ohpcd/stable"
