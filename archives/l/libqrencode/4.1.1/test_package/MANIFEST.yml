# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 ctest -N 查看测试列表
#   3. 把实际运行的测试记录到下方
#
# 上游 tests/CMakeLists.txt 门控结构（v4.1.1 实测）:
#   - 无条件注册: test_bitstream / test_estimatebit / test_split（仅依赖库本体）
#   - if(TARGET ICONV::ICONV) 门控 9 项: test_qrinput/test_qrspec/test_mqrspec/
#     test_qrencode/test_split_urls/test_monkey + 条件 3 项 test_mask/test_mmask/test_rs
#     （依赖 decoder，而 decoder 依赖 Iconv）
#   本配方移除 find_package(Iconv)（库本体不使用 Iconv），故 Iconv 门控 9 项不注册；
#   移除 find_package(PNG)（仅 qrencode 工具需要，WITH_TOOLS=OFF）。
#   2026-09-18 OHOS aarch64 实测: ctest 注册 3 项，3/3 通过（100%）。

package: libqrencode/4.1.1
homepage: "https://github.com/fukuchi/libqrencode"

# 上游测试命令 (用于清点测试列表)
upstream_check_command: "cmake -S . -B build -DWITH_TESTS=ON -DWITH_TOOLS=OFF && ctest --test-dir build -N"

# conanfile.py build() 方法中已集成上游测试 (WITH_TESTS=True + cmake.test())
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

# 上游实际运行的测试程序（conan create 构建期由 cmake.test() 执行）
upstream_tests:
  - file: tests/test_bitstream.c
    source: libqrencode-4.1.1/tests/test_bitstream.c
    description: "Bitstream construction/append/size tests (31 asserts)"
    command: "ctest --test-dir build -R ^test_bitstream$"
  - file: tests/test_estimatebit.c
    source: libqrencode-4.1.1/tests/test_estimatebit.c
    description: "Bit size estimation tests (2 asserts)"
    command: "ctest --test-dir build -R ^test_estimatebit$"
  - file: tests/test_split.c
    source: libqrencode-4.1.1/tests/test_split.c
    description: "Input string splitting tests (8 asserts)"
    command: "ctest --test-dir build -R ^test_split$"

# 未注册的上游测试及原因（Iconv 门控，配方禁用 Iconv）
# upstream_tests_excluded:
#   test_qrinput/test_qrspec/test_mqrspec/test_qrencode/test_split_urls/test_monkey/
#   test_mask/test_mmask/test_rs — 依赖 ICONV::ICONV（decoder），库本体不使用 Iconv

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "Consumer test: QRcode_encodeString encodes a string and verifies 21x21 QR output"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估): 41 upstream + 2 consumer
assertion_count: 43
