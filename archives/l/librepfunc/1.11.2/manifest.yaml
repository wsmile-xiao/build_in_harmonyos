# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.11.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11.2"

# 软件名
software: "librepfunc"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/wirbel-at-vdr-portal/librepfunc/archive/refs/tags/1.11.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "raw makefile 的 install 目标用小写 prefix ?= /usr 变量，Conan 配方必须传小写 prefix=（空值直落包根），大写 PREFIX= 不生效导致库文件装入 DESTDIR/usr/lib，CMakeDeps 报 'Library not found in package'（草稿 DRAFT-librepfunc-1.11.2-raw-makefile-lowercase-prefix-install，路径 B）"
  - "raw makefile 配方需 self.folders.build='.'（basic_layout 默认 build 子目录中无 Makefile）——E392 等价命中"
  - "test_package 源文件扩展名须与工程语言声明一致（CXX-only 工程用 .cpp），否则 Cannot determine link language——已有草稿等价命中"
