# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librepfunc/1.11.2
homepage: "https://github.com/wirbel-at-vdr-portal/librepfunc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 Makefile 无 check/test 目标（已核查 Makefile 全部目标：clean/install/
# install-static/uninstall/dist/cppcheck/printvars/dll），无测试套件。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试，清点证据：源码包 67 文件、无 tests 目录、
# Makefile 无 check 目标）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 repfunc.h 的 UpperCase/IntToStr/IntToHex/Trim 并断言结果"
    command: "./test_librepfunc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4