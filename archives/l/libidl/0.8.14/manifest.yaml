knowledge_gained:
  - "libIDL 0.8.14 tarball 只带 parser.y/lexer.l（无生成的 parser.c/lexer.c），构建期必须 bison+flex；OHOS 制品仓已发布 flex/2.6.4.2、bison/3.8.2，用 tool_requires 即可，无需宿主机安装；注意 flex/2.6.4 的包不含 bin/，须用 2.6.4.2"
  - "bison 工具包另有两处环境依赖：数据目录 /=前缀（BISON_PKGDATADIR）与硬编码 m4 路径 /data/service/hnp/bin/m4（须用 M4 覆盖）
  - "bison 工具包的数据目录同样是 `/=前缀` 失真（bison: /share/bison/m4sugar/m4sugar.m4: cannot open），需注入 BISON_PKGDATADIR=<包>/share/bison；该错误默认被上游 YFLAGS 的 2>/dev/null 吞掉，排查时要手动跑 bison"
  - "libIDL configure 含 AC_RUN_IFELSE（guint64 printf/scanf 格式），`--build` 与 `--host` 必须取同值，否则报 'cannot run test program while cross compiling'；显式传三元组同时避免运行 config.guess（实测现代 config.guess 在 HMDFS 上无法创建临时文件而失败）"
  - "configure 用 PKG_CHECK_MODULES 找 glib-2.0：需 PkgConfigDeps 生成 glib-2.0.pc（glib/2.84.0 已在制品仓）"
  - "autoconf 2.63 的 umask 077 临时目录在 HMDFS(setgid) 下不可写 → umask 022（E011）"
  - "config.sub/guess 过旧（无法识别 aarch64/HarmonyOS，且 config.guess 在 HMDFS 上无法创建临时文件）：用 17 行最小补丁 + 显式 --build/--host；避免携带上千行脚本（AI 检视会因变更过大跳过）"
  - "消费者测试用 IDL_parse_filename_with_input + 自定义输入回调，完全不依赖外部 cpp；上游 tstidl 走默认 IDL_parse_filename（configure 探测到 SDK clang -E），两种入口都可用"
  - "Conan 以 --prefix=/ + DESTDIR 安装，libIDL-2.0.pc 的 prefix 会失真，需在 package() 重写；头文件在 include/libIDL-2.0/libIDL/"
  - "依赖包（glib/pcre2/libffi）的 .la 同样记录 libdir=/lib，libtool 链接时报 not a valid libtool archive；构建前删除依赖 .la 即可（bookloupe 先例）"
  - "Conan 2 默认不向消费者传播依赖；IDL.h 公开包含 <glib.h>，必须 self.requires(glib, transitive_headers=True, transitive_libs=True) 并在 cpp_info.requires 声明，否则消费者找不到 glib.h"
  - "上游 0.8.14 在畸形 IDL 的语法错误恢复路径会段错误（上游缺陷）；负向测试改用不可读输入回调验证错误返回"
