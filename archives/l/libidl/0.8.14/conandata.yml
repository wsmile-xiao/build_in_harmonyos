patches:
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "Teach the bundled config.sub the aarch64/HarmonyOS triplets: it predates aarch64, so configure aborts with 'machine aarch64 not recognized'. Compact early-exit form, same as archives/a/a52dec."
    patch_type: "portability"
  - patch_file: "patches/0001-configure-umask-022.patch"
    patch_description: "config.status creates its temp dir with 'umask 077 && mktemp -d'; HarmonyOS HMDFS is setgid mounted, so the 0700 directory is not writable and configure aborts with 'cannot create ./confXXXXXX: Permission denied'. Relax to umask 022 (E011)."
    patch_type: "portability"
