# test_package/MANIFEST.yml
# libidl 0.8.14.
#
# Upstream ships no `make check`. The tarball contains the `tstidl` demo
# program (noinst_PROGRAMS), which is built by the stock Makefile and executed
# natively on the aarch64 device from the recipe build(). It uses the default
# IDL_parse_filename path; configure detects the C preprocessor as the OHOS SDK
# `clang -E`, which exists on the device even though the bare names cpp/cc do
# not. The consumer test instead uses IDL_parse_filename_with_input, which does
# not spawn an external preprocessor at all.
# Consumer coverage is provided by a CMake consumer program compiled against
# the installed package.

package: libidl/0.8.14
homepage: https://download.gnome.org/sources/libIDL/

upstream_tests_exist: true
upstream_test_audit: "no tests/ directory and no check target in Makefile.am; tstidl.c is a standalone demo (noinst_PROGRAMS) that parses an IDL file and dumps the tree"
upstream_check_command: "n/a (no make check)"
upstream_test_in_build: true
upstream_test_command: "./tstidl sample.idl (built with -DTEST_INPUT_CB)"

upstream_tests:
  - name: tstidl
    command: "./tstidl sample.idl"
    expected: "pass (exit 0; prints repository IDs, identifiers and the re-serialised IDL)"

test_package_tests:
  - file: test.c
    description: "version query; parse a valid IDL buffer with IDL_parse_filename_with_input (no external cpp); walk the tree and count module/interface/attribute/operation nodes; re-serialise with IDL_tree_to_IDL_string; report an unreadable input as an error (upstream 0.8.14 crashes in its syntax-error recovery path, so the negative case uses a refusing input callback)"
    command: "./libidl_consumer"

test_files:
  - path: "test_package/test.c"
    test_type: "R34"
    assertion_count: 14

test_package_test_count: 1
consumer_assertion_count: 14
assertion_count: 14
