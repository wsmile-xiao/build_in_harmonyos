# 软件级 manifest — archives/l/libidl/manifest.yaml

software: libidl
display: "libidl"
description: "CORBA IDL 解析库（GLib 基础，bison/flex 语法分析器，含 XPIDL 扩展）"
category: library
homepage: "https://download.gnome.org/sources/libIDL/"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 tarball 无生成的 parser.c/lexer.c → 构建期 tool_requires bison/flex（ohpcd 制品仓）"
    - "glib 依赖经 PkgConfigDeps 生成 glib-2.0.pc（Conan glib/2.84.0）"
    - "E007：替换过旧的 config.sub/config.guess，显式 --build/--host"
    - "E011：autoconf 2.63 umask 077 临时目录在 HMDFS(setgid) 下不可写 → umask 022"
    - "设备无 cpp/cc：默认 IDL_parse_filename 会 fork 预处理器，改用随库提供的输入回调 API 与上游 -DTEST_INPUT_CB 钩子"
    - "Conan --prefix=/ + DESTDIR 导致 .pc 前缀失真 → package() 重写"
  common_dependencies:
    - glib

versions:
  "0.8.14":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libidl/0.8.14"
