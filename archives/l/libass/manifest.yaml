software: libass
display: "libass"
description: "便携式 ASS/SSA 字幕渲染库（mpv 字幕渲染依赖）"
category: multimedia
homepage: "https://github.com/libass/libass"
license: ISC
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建，上游默认 static，Conan 包显式 -Ddefault_library=shared"
    - "字体提供者：OHOS 无 DirectWrite/CoreText，选 Fontconfig（fontconfig/2.18.3 已发布）"
    - "libunibreak 未发布，-Dlibunibreak=disabled 裁剪"
    - "依赖 freetype/fribidi/harfbuzz/fontconfig，均已在 ohpcd 制品仓发布"
  common_dependencies:
    - freetype/2.14.3
    - fribidi/1.0.16
    - harfbuzz/14.2.0
    - fontconfig/2.18.1.1

versions:
  "0.17.5":
    status: built
    build_date: "2026-08-25"
    source_url: "https://github.com/libass/libass/archive/refs/tags/0.17.5.tar.gz"
