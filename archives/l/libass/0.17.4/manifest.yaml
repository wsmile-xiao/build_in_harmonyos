software: libass
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.17.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.17.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libass/libass/releases/download/0.17.4/libass-0.17.4.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--enable-static"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "freetype/26.6.20"
    - "fribidi/1.0.13"
    - "harfbuzz/14.2.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-umask.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS系统识别需要修改config.guess，添加__OHOS__检测和HarmonyOS case分支"
  - "config.sub需要添加ohos-linux triplet支持"
  - "HMDFS文件系统umask权限需要从077改为022以避免权限问题"