# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libass/0.17.5
homepage: https://github.com/libass/libass

# 上游测试命令
upstream_check_command: "meson test -C build"

# libass 上游自带测试（checkasm/compare/fuzz）依赖额外工具链，
# 本配方裁剪 libunibreak 等，CI 超时内不编译上游测试。
upstream_test_in_build: false
upstream_test_command: ""

upstream_test_changes: []

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "Link libass::ass, init library/renderer, parse in-memory ASS track and render a frame (3 assertions)"
    command: "./test_libass"

assertion_count: 3
