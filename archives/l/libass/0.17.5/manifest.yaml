# 版本级 manifest
# 文件位置: archives/l/libass/0.17.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.17.5"
software: libass

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39: 仅官方源，镜像 fallback 由 CI 自动添加）
  url: "https://github.com/libass/libass/archive/refs/tags/0.17.5.tar.gz"

  # 源码校验和
  sha256: "fa286fc9ee1ba3b932703a3df7b8474d01dc8abe29ec69b6fa68781dc4bf7acc"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "meson setup -Ddefault_library=shared -Dlibunibreak=disabled -Dcoretext=disabled -Ddirectwrite=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - freetype/2.14.3
    - fribidi/1.0.16
    - harfbuzz/14.2.0
    - fontconfig/2.18.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libass 上游 meson 默认 default_library=static，Conan 包需显式 -Ddefault_library=shared（mpv 以共享库链接）"
  - "libass 强制要求至少一个字体提供者（DirectWrite/CoreText/Fontconfig），OHOS 选 Fontconfig（制品仓已发布 fontconfig/2.18.3，依赖 expat/libxml2 自动传递）"
  - "libunibreak 未发布到 ohpcd，-Dlibunibreak=disabled 裁剪（仅影响 U+2011 类换行字符，字幕渲染主流程不受影响）"
  - "本机 conan 包的 .pc 文件 prefix 写死为 /，本地直连编译需修正 prefix 为实际包路径；CI 中 conan 依赖机制不受影响"
