# 版本级 manifest — libnfs-tools 5.0.3

version: "5.0.3"
software: libnfs-tools

# 编译状态
status: published

build_date: "2026-09-20"
build_system: custom

source:
  url: "https://github.com/sahlberg/libnfs/archive/refs/tags/libnfs-5.0.3.tar.gz"
  sha256: "d945cb4f4c8f82ee1f3640893a168810f794a28e1010bb007ec5add345e9df3e"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "（主管裁定：libnfs-tools/5.0.3 = libnfs 5.0.3 官方 tarball 的 utils/ 工具集，CMake 自定义构建仅编译四工具）"
  dependencies:
    - libnfs/5.0.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libnfs-tools 无独立上游仓库；其四工具（nfs-ls/nfs-cat/nfs-cp/nfs-stat）位于 libnfs 官方 tarball 的 utils/ 目录"
  - "utils 工具编译需 -I<libnfs include 根>（供 <nfsc/...> 角括号头）与 -I<include>/nfsc（供引号头 libnfs.h）双路径"
  - "需 -DHAVE_UNISTD_H -DHAVE_POLL_H（上游 autotools config.h 特性宏，自定义 CMake 构建不跑 configure 时需显式定义）"
