# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libnfs-tools/5.0.3
homepage: "https://github.com/sahlberg/libnfs"

# 上游测试清点（R51 三步法，如实申报）
# libnfs-tools 无独立上游仓库：四工具（nfs-ls/nfs-cat/nfs-cp/nfs-stat）
# 为 libnfs 官方 tarball（tag libnfs-5.0.3）utils/ 目录的工具集。
# 清点依据（libnfs-5.0.3 官方 tarball 全量）：
#   a) utils/ 工具集自身：仅 4 个源文件（nfs-cat.c/nfs-cp.c/nfs-ls.c/nfs-stat.c）
#      + 构建文件（Makefile.am / CMakeLists.txt），无任何测试脚本/目标
#      （无 test*.sh、无 ctest 注册、utils/CMakeLists.txt 无 enable_testing）→ utils/ 自身 N=0
#   b) tarball 根级 tests/ 目录：50 个 test_*.sh（另 3 个 .disabled）+ 30 个 prog_*.c
#      辅助程序 + functions.sh —— 属 libnfs 库本体功能测试（需 NFS 服务器挂载，
#      测库 API 数据面），与本包 utils/ 工具产物无对应 → tarball 全量 N=50
# 申报口径：上游 N=50（tarball tests/ 全量，属 libnfs 库本体）；本包 N'=0（utils/ 工具
# 自身无测试可跑，库本体测试需 NFS 服务器且与本 CLI 包无关，故不在本包运行——
# 库测试情况由依赖包 libnfs/5.0.3 按其申报口径记录）。
upstream_check_command: "（utils/ 工具集无测试套件；tarball tests/ 50 项属 libnfs 库本体，需 NFS server）"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 → 留空并以上述清点说明为准）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "CLI 实跑：nfs-ls/nfs-cat/nfs-cp/nfs-stat 无参运行须打印 Usage:（证明产物可加载执行，R34）"
    command: "./nfs-ls; ./nfs-cat; ./nfs-cp; ./nfs-stat"
  - file: ohos_specific_test.py
    description: "R53 鸿蒙特有 7 断言/工具×4=28（pure-python ELF 解析，无 readelf 依赖）：ELF64 class / e_machine=AArch64(183) / PT_INTERP=ld-musl-aarch64 / .codesign 段 / 无 RPATH·RUNPATH / libnfs 静态链接（DT_NEEDED 无 libnfs.so）+ usage 实跑"
    command: "python3 ohos_specific_test.py <bindir>"

# 测试断言总数
assertion_count: 28
