# test_package/MANIFEST.yml — libtbox 1.8.1
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）。
# 详见 docs/TEST_QUALITY_SPEC.md

package: libtbox/1.8.1
homepage: "https://github.com/tboox/tbox"

# 上游测试套件存在性（经审计源码 tar 包确认）
upstream_tests_exist: false

# 上游测试审计（源码: v1.8.1.tar.gz，GitHub tag 归档，1227 个条目）
upstream_test_audit:
  source_tarball: "v1.8.1.tar.gz (https://github.com/tboox/tbox/archive/refs/tags/v1.8.1.tar.gz)"
  source_sha256: "48284c1f1f6e4e74ce1b4d2447c3141fdfdd3a20ef1cb30fc2f1021149227fdb"
  build_system: "custom (xmake.sh script-only configure 生成纯 Makefile，无需 xmake 二进制)"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "tests/ / test/ 目录"
    - "ctest / meson test / make check 注册"
    - "xmake.lua add_tests / test 代码"
  scan_result: "0 matches — tarball 无 tests/ 或 test/ 目录；xmake.lua（含 src/xmake.lua、src/tbox/xmake.lua、src/demo/xmake.lua）无 add_tests；生成 Makefile 目标仅 all/clean/install/run 系，无 check/test 目标；src/demo/* 均为功能演示示例，src/demo/other/test.c 为空 stub（直接 return 0）；.github/workflows/* 仅各平台构建步骤"
  reason: "tbox 1.8.1 上游无测试套件：无 tests/ 目录、无 gtest/pytest/ctest 注册、无 check/test 目标，demo 仅为示例程序"

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/test_libtbox.c
    description: "真实调用 tb_init/tb_exit、tb_crc32_make（IEEE 已知答案）与 tb_vector 插入/长度/内容"
    command: "./test_libtbox"
    assertions: 8

harmonyos_specific_tests: []

# 测试断言总数（test_libtbox.c：8 条 CHECK 断言）
assertion_count: 8
