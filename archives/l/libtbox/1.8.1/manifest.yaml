# 版本级 manifest — libtbox 1.8.1
# 遵循 ARCHIVE-SPEC v2.0 / knowledge/ARCHIVE-SPEC.md §4.2

version: "1.8.1"
software: libtbox

# 编译状态：published | built | failed | archived
# 首轮仅完成未提交工作树，真机预检通过前保持 built。
status: built

build_date: "2026-09-14"
build_system: custom
conan_ref: "libtbox/1.8.1"

source:
  url: "https://github.com/tboox/tbox/archive/refs/tags/v1.8.1.tar.gz"
  sha256: "48284c1f1f6e4e74ce1b4d2447c3141fdfdd3a20ef1cb30fc2f1021149227fdb"
  tar_format: tar.gz

compiler: clang 15
platform: OpenHarmony aarch64
default_options:
  shared: false
  fPIC: true

# 上游无测试套件（见 test_package/MANIFEST.yml 审计与 notes.md）：
# tarball 无 tests/ 目录、无 gtest/pytest/ctest 注册，xmake.sh 生成的
# Makefile 无 check/test 目标，src/demo/* 仅为示例程序。
# test_package 自建真实调用 libtbox API 的消费者验证程序。
upstream_tests_exist: false

products:
  - name: tbox
    type: static-library
    file: lib/libtbox.a

headers:
  - include/tbox/tbox.h
  - include/tbox/container/vector.h
  - include/tbox/hash/crc32.h
  - include/tbox/prefix/version.h

pkg_config: lib/pkgconfig/tbox.pc

dependencies:
  - name: pthread
    relation: system
  - name: dl
    relation: system
  - name: m
    relation: system
  - name: c
    relation: system

patches_applied: []

knowledge_gained:
  - "tbox 1.8.1 自带 script-only configure（xmake.sh 引擎），生成纯 Makefile，真机/CI 均无需 xmake 二进制"
  - "--toolchain=envs 让 xmake.sh 从环境变量取 CC/CXX（值由 Conan conf 格式化传入，R33 合规）"
  - "xmake.sh 不认识 ohos plat，用 --plat=linux（OHOS 用户态与 Linux ABI 兼容的纯 C 库路径）"
  - "--demo=n 关示例、--small=n 开全模块，可选三方包（zlib/sqlite/mysql/openssl/pcre）全部关闭保 hermetic"
  - "生成 Makefile 支持 DESTDIR + PREFIX 变量安装（_gmake_add_switches），PREFIX=/ 时直装包根"
  - "上游无测试套件：test_package 自建 tb_init/CRC32 已知答案/vector 真实调用验证"
