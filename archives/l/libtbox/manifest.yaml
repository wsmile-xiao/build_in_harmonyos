software: libtbox
display: "libtbox"
description: "A glib-like cross-platform C library (stream, coroutine, container, hash, xml, charset)"
category: system
homepage: "https://github.com/tboox/tbox"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "自带 script-only configure（xmake.sh 引擎），生成纯 Makefile，真机/CI 均无需 xmake 二进制"
    - "--toolchain=envs 从环境变量取 CC/CXX（值由 Conan conf 格式化传入，R33 合规）"
    - "xmake.sh 不认识 ohos plat，用 --plat=linux（纯 C 库走 posix/epoll 路径）"
    - "编译器路径从 Conan conf 获取（R33），CONFIG_SHELL 从 profile [buildenv] 获取（R5）"
    - "上游无测试套件，test_package 自建真实 API 调用验证"
  common_dependencies: []

versions:
  "1.8.1":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libtbox/1.8.1"
