# test_package/MANIFEST.yml
# 上游测试声明文件

package: luaposix/36.3
homepage: https://github.com/luaposix/luaposix
upstream_check_command: lua -e "require('posix'); require('posix.signal')"
upstream_test_in_build: false

test_package_tests:
  - file: test.sh
    description: "验证 posix 模块及 C 制品 posix.signal 可被 Lua 加载"
    command: "bash test.sh"

assertion_count: 2
