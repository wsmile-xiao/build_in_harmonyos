sources:
  # netlib 是 f2c/libf2c 的唯一上游（Debian 的 libf2c2 源码包即由这个 zip 打包：
  # 其 debian/copyright 的 Source 字段与 libf2c2_20240504-1.dsc 的 Homepage 都指向
  # https://netlib.org/f2c/）。上游只发布无版本号的文件，20240504 是 Debian 打包
  # 该快照时使用的上游版本号，因此这里把 zip 的 sha256 固定下来：本 sha256 与
  # Debian libf2c2_20240504.orig.tar.xz 解包后的 184 个文件逐字节一致（见 notes.md）。
  url: "https://netlib.org/f2c/libf2c.zip"
  sha256: "cc84253b47b5c036aa1d529332a6c218a39ff71c76974296262b03776f822695"

patches:
  - patch_file: "patches/0001-uninit-guard-fpu-control-on-glibc.patch"
    patch_description: "Only take the fpu_control.h path when the C library is glibc, so the musl-based OHOS sysroot builds uninit.c"
    patch_type: "portability"
  - patch_file: "patches/0002-main-weak-entry-points.patch"
    patch_description: "Give main and MAIN__ weak definitions so the shared library exports no undefined main-program symbol"
    patch_type: "portability"
