# test_package/MANIFEST.yml
# 上游官方测试声明 (CI 门禁 L0e 要求此文件存在)

package: libf2c2/20240504
homepage: "https://netlib.org/f2c/"

# libf2c.zip 内自带的唯一测试入口是 makefile.u 的 check 目标：
#   make -f makefile.u check
# 它把 182 个源文件与随包文件的 xsum 校验和与 xsum0.out 比对（传输完整性检查；
# 该列表不含生成物 fio.h 与基线自身 xsum0.out），
# 但需要 xsum 工具，而 xsum.c 属于独立的 f2c 编译器源码包（netlib 的
# src.tgz），不在本压缩包内，因此这里不能执行；同一份内容已经由
# conandata.yml 的 sha256 固定，等价于完整性强校验。
# 本包不含可直接运行的上游功能测试程序，消费者验证全部由 test_package/ 承担。
upstream_check_command: "make -f makefile.u check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序：本压缩包内没有（见上）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_main.c
    description: >-
      C 消费者：通过已安装的 f2c.h 调用库的真实 ABI（内在函数 d_prod/pow_dd/
      d_lg10/i_nint/d_sign、字符串运行时 s_cmp/s_copy/i_indx、-trapuv 辅助
      _uninit_f2c，以及 f_open/s_wsle/do_lio/e_wsle/f_clos/s_rsle/e_rsle
      组成的列表定向文件往返读写）
    command: "./test_main"
  - file: test_startup.c
    description: >-
      f2c 转译程序形态的消费者：自身不定义 main()，只定义 MAIN__()，入口点、
      f_init() 运行时就绪与 atexit(f_exit) 刷新全部来自库内 main.c
    command: "./test_startup"

# 测试断言总数 (test_main 27 项 + test_startup 1 项退出状态判定；
# 计数单位与 reports/test-report.md 一致)
assertion_count: 28
