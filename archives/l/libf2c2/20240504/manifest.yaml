version: "20240504"
software: "libf2c2"
status: built
build_date: "2026-09-18"
conan_ref: "libf2c2/20240504"
build_system: makefile

source:
  # netlib 官方发布的 f2c 运行时压缩包（无版本号，见 notes.md 的版本溯源）
  url: "https://netlib.org/f2c/libf2c.zip"
  sha256: "cc84253b47b5c036aa1d529332a6c218a39ff71c76974296262b03776f822695"
  tar_format: zip

build:
  system: makefile
  configure_options:
    - "make -f makefile.u libf2c.a"
    - "CC=clang"
    - "CFLAGS=-O2 -fPIC -DNON_UNIX_STDIO"
    - "-Wl,-soname,libf2c.so.2"
  dependencies: []
  cc: clang
  cxx: ""

patches_applied:
  - "0001-uninit-guard-fpu-control-on-glibc.patch"
  - "0002-main-weak-entry-points.patch"

knowledge_gained:
  - "fpu_control.h 是 glibc 头文件；OHOS 的 musl sysroot 没有它，但 OHOS clang 仍定义 __linux__，所以 `#ifdef __linux__` 保护会误入 glibc 分支，需收窄为 defined(__linux__) && defined(__GLIBC__)"
  - "共享库中 main.o 引用但未定义 MAIN__ 时，lld 默认的 --no-allow-shlib-undefined 会拒绝任何链接该 .so 的程序；把 main/MAIN__ 声明为 weak 并给 MAIN__ 一个 weak 别名即可（Debian #826253）"
  - "同上游版本的 Debian 包 libf2c2 在 orig tarball 之外还叠加了 debian/patches（C.LAPACK 的 i_ceiling.c/i_len_trim.c、weak MAIN__ 等），导出符号数 283 与本包的 281 差异全部来自那些下游补丁"
