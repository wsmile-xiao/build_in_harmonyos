software: libf2c2
display: "libf2c (f2c run-time library)"
description: "Fortran run-time library for C code produced by the f2c translator"
category: library
homepage: "https://netlib.org/f2c/"
license: "AT&T"
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只发布无版本号的 libf2c.zip 与自带的 makefile.u，没有 configure/CMake/meson 层，直接驱动 makefile.u 即可"
    - "f2c.h 必须按上游 README 对 LP64 目标做 sed 's/long int /int /' 调整，否则 Fortran INTEGER 会变成 8 字节"
    - "uninit.c 在 __linux__ 下 include glibc 专有的 fpu_control.h；OHOS 用 musl 且 clang 仍定义 __linux__，判据需收窄为 defined(__linux__) && defined(__GLIBC__)"
    - "库内含 main.c 且 MAIN__ 由转译程序提供，共享库会留下未定义 MAIN__；lld 默认 --no-allow-shlib-undefined 会拒绝链接，需把 main/MAIN__ 设为 weak（Debian #826253）"
    - "arith.h 由 arithchk.c 现场编译执行生成，要求构建机与目标机同架构（本仓库 profile 为原生 OHOS/aarch64）"
  common_dependencies: []

versions:
  "20240504":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libf2c2/20240504"
