# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtomfloat/0.02
homepage: "https://github.com/libtom/libtomfloat"

# 上游测试清点（R51）：libtomfloat 0.02 的 makefile 仅含
# default(libtomfloat.a)/ex1/mandvi/manual/install/clean/zipup 目标，
# 无 check/test 目标；demos/ex1.c 为打印演示程序（无断言、无退出码判定），
# 上游不提供自动化测试套件，故静态用例总数为 0。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无自动化测试，仅演示程序）
upstream_tests:
  - file: demos/ex1.c
    source: libtomfloat-0.02/demos/ex1.c
    description: "演示程序：打印四则/超越函数计算结果（非断言测试，不判定退出码）"
    command: "make ex1 && ./ex1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：以库使用者身份调用 mpf_add/sub/mul/div/sqrt/invsqrt/inv/cmp_d 公开 API，9 项断言决定退出码。迭代近似结果（div/invsqrt/inv）以 2^-30 绝对容差判定（实测残差 <= 2^-98）；mpf_sqrt 因上游牛顿迭代对完全平方输入不收敛（实测 sqrt(4) 残差 = 2.0），不做数值断言、仅要求调用返回 MP_OKAY，已在 notes.md 记录测量证据"
    command: "./test_libtomfloat"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
