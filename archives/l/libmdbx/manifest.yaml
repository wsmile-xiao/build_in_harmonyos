software: libmdbx
display: "libmdbx"
description: "Embedded transactional key-value database engine"
category: db
homepage: "https://github.com/erthink/libmdbx"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the upstream CMake build with tools, man pages, and bundled tests disabled for the library package"
    - "Keep both the C and C++ APIs available to Conan consumers"
    - "Map the OHOS Conan setting to CMake's OHOS platform module and install libraries under lib"
  common_dependencies: []

versions:
  "0.14.3":
    status: built
