# test_package/MANIFEST.yml
# 适配测试声明文件
package: libmdbx/0.14.3
homepage: "https://github.com/erthink/libmdbx"

# v0.14.3 的精简发布归档不包含完整 upstream tests 目录，但上游
# examples/CMakeLists.txt 注册了两个可运行的 CTest API 示例。
upstream_check_command: "ctest --test-dir <native-build> --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <native-build> --output-on-failure"
upstream_tests:
  - file: examples/example-mdbx.c
    description: "上游 C API example，通过 CTest 注册为 c_api；原生构建阶段运行"
    command: "ctest --test-dir <native-build> --output-on-failure -R '^c_api$'"
  - file: examples/example-mdbx.c++
    description: "上游现代 C++ API example，通过 CTest 注册为 c++_api；原生构建阶段运行"
    command: "ctest --test-dir <native-build> --output-on-failure -R '^c\\+\\+_api$'"

# test_package 从消费者视角分别覆盖 C API 和 C++ API。
test_package_tests:
  - file: test.c
    description: "C consumer: create/open environment, configure portable geometry, write/read/delete a key, and remove database files (21 assertions)"
    command: "./test_libmdbx_c"
  - file: test.cpp
    description: "C++ consumer: create/open a named map, insert/read a value, handle a missing key, and clean up (8 assertions)"
    command: "./test_libmdbx_cpp"
  - file: test_ohos.c
    description: "HarmonyOS consumer: open and close a database through the HMDFS-compatible allocation fallback (5 assertions, OHOS only)"
    command: "./test_libmdbx_ohos"

assertion_count: 34
