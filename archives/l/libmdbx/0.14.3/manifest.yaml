software: libmdbx
version: "0.14.3"
build_system: cmake
status: built

source:
  url: "https://github.com/erthink/libmdbx/archive/refs/tags/v0.14.3.tar.gz"
  sha256: "a31118cfbe95ca73595b0ace5aba750e6dc40a3d34bb31ec89fb46b37b890816"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DMDBX_BUILD_SHARED_LIBRARY=ON"
    - "-DMDBX_BUILD_CXX=ON"
    - "-DMDBX_BUILD_TOOLS=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DMDBX_ENABLE_TESTS=OFF"
    - "-DMDBX_USE_FALLOCATE=OFF"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies: []

patches_applied:
  - "patches/0001-ohos-skip-linux-kernel-version-gate.patch"
  - "patches/0002-ohos-preserve-working-lseek-offset.patch"
