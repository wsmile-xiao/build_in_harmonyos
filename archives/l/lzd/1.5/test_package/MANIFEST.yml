# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lzd/1.5
homepage: "https://www.nongnu.org/lzip/lzd.html"

# 上游测试清点（R51 第 1 步，2026-09-20 源码包实测）：
#   testsuite/check.sh（真实上游测试）：解压 fox.lz 及 9 个变体
#   （fox_bcrc/crc0/das46/de20/mes81/nz/s11/v2 + em.lz 多成员）并与
#   test.txt 明文比对。配方 build() 内 make check 全量运行（L1c）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check（conanfile build() 内）"

upstream_tests:
  - file: testsuite/check.sh
    source: lzd 1.5
    description: "上游官方测试套件：fox*.lz 十个变体 + em.lz 解压比对"
    command: "make check"

test_package_tests:
  - file: test.sh
    description: "消费者测试: fox.lz 已知明文解压 + em.lz 多成员 + 垃圾输入负例"
    command: "sh test.sh <lzd> <fixtures>"

assertion_count: 3
