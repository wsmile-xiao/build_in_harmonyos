# test_package/MANIFEST.yml
# 上游官方测试声明文件 (R51 口径)
package: libcjson/1.7.18
homepage: "https://github.com/DaveGamble/cJSON"

# 上游测试命令 (ctest -N 列出)
upstream_check_command: "ctest"

# test_package 中自带 L1 消费者测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (22 项 = 21 unity 测试 + 1 顶层 cJSON_test 自测程序)
upstream_tests:
  - file: test.c
    source: cjson-1.7.18/test.c
    description: "Top-level cJSON_test self-test program (unity harness)"
    command: "./cJSON_test"
  - file: tests/parse_examples.c
    source: cjson-1.7.18/tests/parse_examples.c
    description: "Parse real-world JSON examples"
    command: "./parse_examples"
  - file: tests/parse_number.c
    source: cjson-1.7.18/tests/parse_number.c
    description: "Parse number boundary values"
    command: "./parse_number"
  - file: tests/parse_hex4.c
    source: cjson-1.7.18/tests/parse_hex4.c
    description: "Parse \\uXXXX hex escapes"
    command: "./parse_hex4"
  - file: tests/parse_string.c
    source: cjson-1.7.18/tests/parse_string.c
    description: "Parse string escapes"
    command: "./parse_string"
  - file: tests/parse_array.c
    source: cjson-1.7.18/tests/parse_array.c
    description: "Parse arrays"
    command: "./parse_array"
  - file: tests/parse_object.c
    source: cjson-1.7.18/tests/parse_object.c
    description: "Parse objects"
    command: "./parse_object"
  - file: tests/parse_value.c
    source: cjson-1.7.18/tests/parse_value.c
    description: "Parse mixed values"
    command: "./parse_value"
  - file: tests/print_string.c
    source: cjson-1.7.18/tests/print_string.c
    description: "Print strings"
    command: "./print_string"
  - file: tests/print_number.c
    source: cjson-1.7.18/tests/print_number.c
    description: "Print numbers"
    command: "./print_number"
  - file: tests/print_array.c
    source: cjson-1.7.18/tests/print_array.c
    description: "Print arrays"
    command: "./print_array"
  - file: tests/print_object.c
    source: cjson-1.7.18/tests/print_object.c
    description: "Print objects"
    command: "./print_object"
  - file: tests/print_value.c
    source: cjson-1.7.18/tests/print_value.c
    description: "Print mixed values"
    command: "./print_value"
  - file: tests/misc_tests.c
    source: cjson-1.7.18/tests/misc_tests.c
    description: "Misc API behaviour"
    command: "./misc_tests"
  - file: tests/parse_with_opts.c
    source: cjson-1.7.18/tests/parse_with_opts.c
    description: "Parse with options"
    command: "./parse_with_opts"
  - file: tests/compare_tests.c
    source: cjson-1.7.18/tests/compare_tests.c
    description: "cJSON_Compare"
    command: "./compare_tests"
  - file: tests/cjson_add.c
    source: cjson-1.7.18/tests/cjson_add.c
    description: "Add item helpers"
    command: "./cjson_add"
  - file: tests/readme_examples.c
    source: cjson-1.7.18/tests/readme_examples.c
    description: "README usage examples"
    command: "./readme_examples"
  - file: tests/minify_tests.c
    source: cjson-1.7.18/tests/minify_tests.c
    description: "Minify/format"
    command: "./minify_tests"
  - file: tests/json_patch_tests.c
    source: cjson-1.7.18/tests/json_patch_tests.c
    description: "JSON patch (utils)"
    command: "./json_patch_tests"
  - file: tests/old_utils_tests.c
    source: cjson-1.7.18/tests/old_utils_tests.c
    description: "Legacy utils API"
    command: "./old_utils_tests"
  - file: tests/misc_utils_tests.c
    source: cjson-1.7.18/tests/misc_utils_tests.c
    description: "Utils misc API"
    command: "./misc_utils_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libcjson.c
    description: "Consumer test: parse/query/print/reparse via cJSON API"
    command: "./test_libcjson"

# 测试断言总数 (近似值, unity 测试断言合计)
assertion_count: 400