# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcsptr/2.0.4
homepage: "https://github.com/Snaipe/libcsptr"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (check/ 子目录, 依赖可选的 Check 框架; 未安装时 ctest 无注册用例)
upstream_tests:
  - file: check/test/scalar.c
    source: libcsptr-2.0.4/check/test/scalar.c
    description: "标量指针创建/析构/meta 断言 (需 Check 框架)"
    command: "./check/test/scalar"
  - file: check/test/array.c
    source: libcsptr-2.0.4/check/test/array.c
    description: "数组指针断言 (需 Check 框架)"
    command: "./check/test/array"
  - file: check/test/shared.c
    source: libcsptr-2.0.4/check/test/shared.c
    description: "共享指针断言 (需 Check 框架)"
    command: "./check/test/shared"
  - file: check/test/misc.c
    source: libcsptr-2.0.4/check/test/misc.c
    description: "杂项断言 (需 Check 框架)"
    command: "./check/test/misc"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: unique_ptr/smalloc 分配+值校验+sfree 释放"
    command: "./test_libcsptr"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8