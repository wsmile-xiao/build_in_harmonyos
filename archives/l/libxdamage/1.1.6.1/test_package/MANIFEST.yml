package: libxdamage/1.1.6.1
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxdamage"

# 上游测试现状（实测，未美化）：
#   libXdamage 1.1.6 的 Makefile.am 只有 `SUBDIRS = src`，src/Makefile.am 没有
#   声明 check_PROGRAMS / TESTS / XORG_ENABLE_UNIT_TESTS，因此 `make check`
#   输出 "Nothing to be done for 'check'" —— 上游 0 个测试用例。
#   配方仍执行 `make check`（不跳过入口），实测 rc=0、0 PASS / 0 FAIL / 0 SKIP。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []          # 上游未提供任何测试用例（实测）
upstream_test_count: 0

test_package_tests:
  - file: test.c
    description: |
      链接 libXdamage 并驱动 DAMAGE 客户端 API：
      1) 线协议常量 X_DamageQueryVersion/X_DamageCreate/X_DamageDestroy/
         X_DamageSubtract/X_DamageAdd/XDamageNumberRequests、
         XDamageReport* 级别、XDamageNotify/XDamageNumberEvents/
         BadDamage/XDamageNumberErrors；
      2) 头文件契约 XDAMAGE_1_1_INTERFACE 与 Damage == XID；
      3) 6 个 libXdamage 导出符号取地址（真实链接被测包，缺符号即链接失败）；
      4) XDamageNotifyEvent 结构体字段读写（含 XRectangle area/geometry）；
      5) XserverRegion（来自 Xfixes.h）可用于 XDamageSubtract/XDamageAdd，
         同时强制链接 libXfixes；
      6) 有 X server 时额外调用 XDamageQueryExtension + XDamageQueryVersion +
         XDamageCreate + XDamageDestroy，无 server 时按 Xlib 契约断言
         XOpenDisplay 返回 NULL（鸿蒙沙箱常态）。
    command: "test_libxdamage"

assertion_count: 12         # 6 组断言 + 6 个符号非空检查中的循环断言
