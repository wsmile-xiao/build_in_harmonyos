software: libxdamage
version: "1.1.6"
description: "X11 Damage extension client library"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxdamage"
license: MIT
build_system: autotools

dependencies:
  - libx11/6.4.0
  - libxext/6.4.0
  - libxfixes/6.1.0
  - xorgproto/2025.1

adaptation_path: path-a
knowledge_base: E340,E341

validation:
  test_type: installed-package
  test_cases: 2
  test_assertions: 9
  notes: |
    libXdamage 1.1.6 采用 cmd-pkgs 同轨依赖（libx11/6.4.0 + libxext/6.4.0 +
    libxfixes/6.1.0 + xorgproto/2025.1），复用 CI 已验证的 OHOS autotools
    工具链模式。configure 的 damageproto/fixesproto/xextproto/xproto 为
    头文件级依赖（xorgproto 提供），链接依赖为 -lXfixes -lX11
    （Xdamage.h include Xfixes.h，XDamageSubtract/Add 用 XserverRegion）。
    soname 1:1:0 → libXdamage.so.1.1.0。
    knowledge_gained:
      - X11 家族客户端库头文件级依赖用 transitive_headers 消费（知识 E340）
      - 无 X server 的消费者测试：强类型活重定位 + ABI 布局固定（知识 E341）
      - "OHOS autoconf works-check 陷阱：configure 以本机模式（--build == --host）运行时，works-check 会尝试执行 conftest 二进制，被 OHOS 沙箱拦截报 'C compiler cannot create executables'（worker 相关，非确定性）。必须以 --host=aarch64-linux-ohos 且 build ≠ host 进入交叉模式，works-check 仅链接不运行即通过。libxdamage 1.1.6 之前 7 次 CI 全部在 configure 期失败，改成 ohos 交叉 triplet 后通过。"
      - "config.guess/config.sub 补丁（来自 libxrender/0.9.12 移植）：上游 config.sub（2021-08-14）不认识 ohos OS，必须在合法 OS 列表加 ohos*、kernel-os 校验加 linux-ohos*；config.guess（2021-06-03）不认识 HarmonyOS，fall through 编译 dummy.c 被沙箱拦截（'can't create .../dummy.c: Permission denied'），需在 NetBSD 分支前插入 HarmonyOS 分支直接 echo aarch64-unknown-linux-ohos。补丁按本包 config.guess/sub 版本 hunk 适配。"
