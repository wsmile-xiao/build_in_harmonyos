package: libinstpatch/1.1.6
homepage: "https://github.com/swami/libinstpatch"

upstream_check_command: "ls tests/*.c"
upstream_tests_exist: true
upstream_test_audit: >
  libinstpatch 1.1.6 (tag v1.1.6, swami/libinstpatch) ships no CTest
  registry: CMakeLists.txt has no enable_testing/add_test anywhere, and
  its azure-pipelines.yml only compiles (make) without running tests.
  tests/ contains two standalone C harnesses which are wired into NO
  build target upstream. Of the two: sample_test.c (484 sample-format
  conversion combinations against a triangle waveform) compiles and runs
  clean; sample_list_test.c references IPATCH_SAMPLE_LIST_CHAN_LEFT/
  RIGHT macros that were never defined in ANY upstream commit (verified
  via git grep across the full history — the macros do not exist in any
  commit since the file was added in f618c11 "Bump to 1.1.2", 2020-01-19,
  i.e. a dead harness that upstream has never compiled either). The
  recipe compiles and runs sample_test.c for real under framework
  direct-cc (N=1 per package/module boundary: the only compilable
  upstream harness); sample_list_test.c is reported skipped with the
  upstream-defect reason, and the three Python GObject-introspection
  tests (Test.py/SF2.py/Converter.py/SampleTransform.py) are out of
  scope for a C cross-build (introspection disabled upstream by default).

upstream_test_in_build: true
upstream_test_command: "direct-cc: tests/sample_test.c compiled against the built static library and executed (484 format combinations)"

upstream_tests:
  - file: tests/sample_test.c
    source: libinstpatch/tests/sample_test.c
    description: "Sample audio format conversion test (484 format combinations, triangle waveform round trip)"
    command: "./sample_test"
    run: true
  - file: tests/sample_list_test.c
    source: libinstpatch/tests/sample_list_test.c
    description: "Sample edit list operations test — DEAD upstream harness: references IPATCH_SAMPLE_LIST_CHAN_* macros never defined in any upstream commit (never compiled by upstream since f618c11)"
    command: "./sample_list_test"
    run: false
    skip_reason: "references IPATCH_SAMPLE_LIST_CHAN_LEFT/RIGHT macros that were never defined in any upstream commit (git grep across full history confirms); upstream itself has never compiled this file"

test_package_tests:
  - file: test_libinstpatch.c
    description: "Consumer API test: ipatch_init, IPATCH_VERSION, ipatch_sample_transform_new+alloc_size+free, ipatch_sf2_gen_get_prop_name static table query, ipatch_gerror_message"
    command: "./test_libinstpatch"

upstream_test_case_count: 1
assertion_count: 4
