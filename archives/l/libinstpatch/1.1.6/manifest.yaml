software: libinstpatch
version: "1.1.6"
status: built
build_date: "2026-09-23"
build_system: direct-cc
conan_ref: "libinstpatch/1.1.6"

source:
  url: "https://codeload.github.com/swami/libinstpatch/tar.gz/refs/tags/v1.1.6"
  sha256: "8e9861b04ede275d712242664dab6ffa9166c7940fea3b017638681d25e10299"
  tar_format: tar.gz

build:
  system: direct-cc
  configure_options:
    - "no CMake configure: instpatch_SOURCES 直调 profile clang 编译（OHOS CMake ID 探针红，miniupnpc 2.3.11 先例）"
    - "config.h/version.h/libinstpatch.h 手工复刻 configure_file 模板"
    - "builtin_enums.[ch]/marshals.[ch] 用 glib 包内 glib-mkenums/glib-genmarshal 真实生成（与上游 custom command 同参）"
    - "静态 libinstpatch-1.0.a 默认（shared=True 时另产 .so，SOVERSION 2）"
    - "-fPIC on，LOCALEDIR 编译期指向 /usr/share/locale（ENABLE_NLS 不定义，i18n.h 走 fallback）"
  dependencies:
    required:
      - glib/2.84.0.1
      - libsndfile/1.2.2
    optional: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libinstpatch 1.1.6 上游 REQUIRED 依赖实测：pkg_check_modules gobject-2.0/glib-2.0/gthread-2.0（>=2.12）+ sndfile（>=1.0.0）——与任务卡预判一致，glib 走制品仓 2.84.0.1，libsndfile 走制品仓 1.2.2"
  - "上游无 CTest 注册（全仓无 enable_testing/add_test；azure-pipelines 只编译不跑测试）；tests/ 两个 C harness 未挂构建目标——sample_test 真跑 N=1；sample_list_test 是上游死测试（IPATCH_SAMPLE_LIST_CHAN_* 宏从未在任何上游 commit 定义过，f618c11 起上游自己也从未编译过），如实豁免；Python gi 测试需 INTROSPECTION_ENABLED 产物超范围"
  - "glib conan 包 bin/ 自带 glib-mkenums/glib-genmarshal（python 脚本），direct-cc 路线用 sys.executable 直跑生成 builtin_enums/marshals——绕开 CMake 但保留上游生成链；注意 glib-genmarshal 必须显式传 .list 文件参数（不传则读 stdin，输出重定向拿到空体）；glib-mkenums 的 headers 位置参数必须在模板参数之后逐个传入"
  - "LOCALEDIR 宏需在编译期定义（上游 add_definitions -DLOCALEDIR=...），ENABLE_NLS 上游从不定义 → i18n.h 纯 fallback，无 libintl 硬依赖"
  - "头文件安装前缀 include/libinstpatch-2/libinstpatch（INSTPATCH_INSTALL_TARGET=libinstpatch-${LIB_VERSION_CURRENT}=libinstpatch-2），公共头以 <libinstpatch/xxx.h> 形式包含"
  - "version.h 双引用形态：.c 文件用 #include \"version.h\"（二进制目录），伞头用 <libinstpatch/version.h>（构建根）——生成时 gen/ 与 gen/libinstpatch/ 双拷贝，-I 两个都加"
