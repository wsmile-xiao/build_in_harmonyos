# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libinstpatch/1.1.7
homepage: "https://github.com/swami/libinstpatch"

# 上游测试命令: 上游 1.1.7 为 CMake 构建，未将 tests/ 接入构建
# （无 enable_testing/add_subdirectory(tests)），测试需手动编译运行
upstream_check_command: "cmake --build build && tests 手动编译"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（R03：5 入口全量处置，2 真实通过 + 3 符号级技术原因单列）
upstream_tests:
  - file: tests/sample_test.c
    source: libinstpatch-1.1.7/tests/sample_test.c
    description: "音频格式转换矩阵测试（484 种组合）"
    command: "clang --target=aarch64-linux-ohos sample_test.c -linstpatch-1.0 ..."
    result: "All 484 sample format conversions PASSED (exit 0)"
  - file: tests/sample_list_test.c
    source: libinstpatch-1.1.7/tests/sample_list_test.c
    description: "sample list / 虚拟存储测试：v1.1.7 API 漂移（原始 13 error），经 tests-compat/ipatch_compat.h 兼容层真实通过"
    command: "clang sample_list_test.c -include tests-compat/ipatch_compat.h -linstpatch-1.0 ..."
    result: "Sample list and virtual sample store test passed (exit 0)"
  - file: tests/Converter.py
    source: libinstpatch-1.1.7/tests/Converter.py
    description: "Python GI 转换器测试：真实运行 exit 1（Test.parseArgs args.verbose None）"
    command: "python3 Converter.py"
    result: "not_passed_symbolic_reason"
  - file: tests/SF2.py
    source: libinstpatch-1.1.7/tests/SF2.py
    description: "Python GI SoundFont 生成测试：真实运行 exit 1（typelib 未导出 Ipatch 枚举 SampleWidth + 无 python2）"
    command: "python3 SF2.py"
    result: "not_passed_symbolic_reason"
  - file: tests/SampleTransform.py
    source: libinstpatch-1.1.7/tests/SampleTransform.py
    description: "Python GI 采样变换测试（无 __main__，顶层即执行）：真实运行 exit 1（同 SF2.py）"
    command: "python3 SampleTransform.py"
    result: "not_passed_symbolic_reason"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：验证 ipatch_version 返回 1.1.7 且 mime type 正确"
    command: "./test_libinstpatch"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
