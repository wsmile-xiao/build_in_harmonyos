# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.7"
software: "libinstpatch"
status: built
build_date: "2026-09-23"
build_system: "cmake"

source:
  url: "https://github.com/swami/libinstpatch/archive/refs/tags/v1.1.7.tar.gz"
  sha256: "b388ab6f843559fc2da94837c37dfd4cf5973cf7cc2a0ce3cb33260b81377e9f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DGTKDOC_ENABLED=OFF"
    - "-DINTROSPECTION_ENABLED=OFF"
  dependencies:
    - glib/2.88.3.1
    - libsndfile/1.2.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 1.1.7 为 CMake 构建（无 autotools），init-build 误判为 autotools，需以 CMake 流程适配"
  - "glib 已发布包的 CMakeDeps 消费端组件 include 目录为空，test_package 需用 PkgConfigDeps + pkg_check_modules 获取 glib 头文件路径（同 E348/DRAFT-conan2-cmakedeps-transitive-include-strip 族）"
  - "conan 制品 .pc 的 prefix=/ 硬编码，探索期需重写 prefix/libdir/includedir 到实际缓存目录（E355）"
