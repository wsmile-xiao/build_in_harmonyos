software: libvsgpt
display: "libvsgpt"
description: "Library to access the GUID Partition Table (GPT) volume system"
category: system
homepage: "https://github.com/libyal/libvsgpt"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 C libyal 库：13 个 libyal 组件（libbfio/libcdata/libcerror/libcfile/libclocale/libcnotify/libcpath/libcsplit/libcthreads/libfcache/libfdata/libfguid/libuna）以 standalone 形式内嵌在发布包内，无外部 Conan 依赖"
    - "随包 configure 有 2 处 umask 077，在 HMDFS 上会生成连创建者都无法写入的 0700 临时目录（E011）；构建期改为 umask 022 并全程保持"
    - "本版本 config.sub 不识别 linux-ohos（Invalid configuration ... OS 'ohos' not recognized），OHOS 下显式使用 --build/--host=aarch64-unknown-linux-gnu"
    - "源码树内脚本不能直接执行，configure 经 CONFIG_SHELL（/data/service/hnp/bin/bash）启动，make check 经 LOG_COMPILER 用同一解释器"
    - "上游 make check 的三个 shell 入口 + 20 个 C 测试程序在 build() 内真实执行（发布包不含 tests/input/ 夹具，test_vsgptinfo.sh 按上游规则 SKIP）"
  common_dependencies: []

versions:
  "0-20240504":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libvsgpt/0-20240504"
