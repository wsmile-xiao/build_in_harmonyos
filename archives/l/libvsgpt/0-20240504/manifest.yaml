source:
  # 上游 GitHub（libyal/libvsgpt）实测（2026-09-20）只有 20260731/20260911 两个 tag，
  # 本版本 tag 与 release 资产均不存在；使用权威发行版归档的 pristine orig tarball，
  # sha256 与 PGP 签名的 libvsgpt_0~20240504-2.dsc 逐字一致。
  url: "https://deb.debian.org/debian/pool/main/libv/libvsgpt/libvsgpt_0~20240504.orig.tar.gz"
  sha256: "60e8239d29c7f1a43282a96d86e82e147c3b87a4aa343db73be2870c465c6ac9"
