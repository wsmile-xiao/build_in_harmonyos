  release_artifact: "upstream release asset absent (404); Debian pristine orig tarball used"

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--disable-python"
    - "--enable-static-executables=no"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfguid
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 平台适配全部内联在 conanfile.py build()，不新增 patches/ 文件，也不改上游任何 C/H 源文件
# 与测试脚本；唯一例外是 OHOS 构建期（在 Conan 缓存副本上）把随包 configure 内 2 处
# `umask 077` 改为 `022`（HMDFS 必需，E011）——详见 notes.md「R6 声明」。
patches_applied: []

knowledge_gained:
  - "HMDFS 上 autotools configure 的 umask 077 会生成连创建者都无法写入的 0700 临时目录；OHOS 构建期把源码树 configure 内 2 处 umask 077 改为 022 并全程 umask 022 即通过（设备实测：未改时 config.guess 直接报 can't create .../dummy.c: Permission denied）"  # knowledge_ref: E011
  - "libyal 同族 config.sub 对 linux-ohos 的接受度随发行版年代翻转：libvsgpt 0-20240504 的 config.sub（timestamp 2023-06-23）实测 Invalid configuration 'aarch64-unknown-linux-ohos': OS 'ohos' not recognized，而同族 libfsfat 0-20260208 的 config.sub（timestamp 2024-05-27）原生接受 linux-ohos；三元组必须先实测再写配方，本包用 aarch64-unknown-linux-gnu"  # knowledge_ref: DRAFT-E591-libvsgpt-gpt-consumer-test-and-triplet-vintage
  - "用 cp -r 复制 autotools 源码树做原生探索会丢 mtime，使 Makefile.in 被判过期并触发维护者模式重建，报出与真实原因无关的 automake-1.16: inaccessible or not found（设备实际是 automake 1.19）；cp -a/tar 解包/conan get() 均保留 mtime，配方侧不受影响"  # knowledge_ref: DRAFT-E591-libvsgpt-gpt-consumer-test-and-triplet-vintage
  - "libvsgpt 公开 API 有三处反直觉约定：libvsgpt_volume_get_partition_by_identifier()/has_partition_with_identifier() 的第二个参数是 uint32_t entry_index 而不是 GUID；libvsgpt_partition_get_offset() 返回分区内当前读偏移（初值 0），卷内字节偏移要用 libvsgpt_partition_get_volume_offset()；libvsgpt_volume_close() 成功返回 0 且 libvsgpt_get_version() 返回上游版本串 20240504（不是 Conan 版本 0-20240504）"  # knowledge_ref: DRAFT-E591-libvsgpt-gpt-consumer-test-and-triplet-vintage
  - "合成合法 GPT 镜像做消费者测试的最小口径（设备实测可被 libvsgpt 完整读回）：LBA0 保护性 MBR、LBA1 主头、LBA2..33 的 128×128B entries、镜像末尾 32 扇区备 entries + 最后 1 扇区备头；主备头的 header/backup LBA 互为镜像且 area start/end、disk GUID、entries 数/大小/CRC 必须一致；头 CRC-32 是对前 92 字节（校验和字段置 0）的标准 reflected CRC-32；空 entries 不计入 number_of_partitions"  # knowledge_ref: DRAFT-E591-libvsgpt-gpt-consumer-test-and-triplet-vintage
  - "libyal 的 tests/test_runner.sh 用 file -b 输出里是否含字面量 'POSIX shell script' 判断 libtool 包装脚本；OHOS 的 file 输出形如 '/bin/sh script'，判定失效但测试仍全绿——本包逐项核验后确认不需要改写 test_runner.sh"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api
  - "libyal 上游 N 必须按 automake 两个注册面分别清点并披露：tests/Makefile.am 的 TESTS（3 个 shell 入口）+ check_PROGRAMS（20 个 C 测试程序）= 23；发布用 orig tarball 不含 tests/input/ 夹具时 test_vsgptinfo.sh 按上游规则 SKIP（TOTAL 3 / PASS 2 / SKIP 1 / FAIL 0），test_library.sh 的 LIBRARY_TESTS_WITH_INPUT 在 input/ 缺失时退化为无输入运行（support、volume 仍真实执行）"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api
  - "lang-preflight 对「纯 C 库 + 绑定模块打包元数据在源码根」的 libyal 形态判 mixed→env_unsupported 属假阳性（本批家族第 4 次独立复现）：根目录 pyproject.toml/setup.cfg/setup.py 只是 pyvsgpt 绑定打包元数据，主体 201 个 .c 占 97%，构建入口是 configure/Makefile.am"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api

