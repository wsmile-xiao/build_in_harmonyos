package: libvsgpt/0-20240504
homepage: https://github.com/libyal/libvsgpt

# 上游测试入口（在 build() 内执行，见 conanfile.py 与 notes.md）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游注册的可执行测试单元（口径：automake 的 TESTS + check_PROGRAMS 两个注册面）
upstream_tests:
  - name: "test_library.sh"
    source: tests/test_library.sh
    description: "库测试入口：驱动 17 个 C 测试程序（boot_record checksum chs_address error io_handle mbr_partition_entry mbr_partition_type notify partition partition_entry partition_table_header partition_type_identifier partition_values section_values sector_data support volume）；LIBRARY_TESTS_WITH_INPUT 的 support/volume 在无 input/ 时按上游逻辑退化为无输入运行"
    command: "./tests/test_library.sh"
  - name: "test_tools.sh"
    source: tests/test_tools.sh
    description: "工具函数测试入口：驱动 info_handle / output / signal 3 个 C 测试程序"
    command: "./tests/test_tools.sh"
  - name: "test_vsgptinfo.sh"
    source: tests/test_vsgptinfo.sh
    description: "vsgptinfo 元数据输出测试入口：依赖 tests/input/ 夹具；发布用 orig tarball 不含该目录，按上游规则 SKIP（exit 77）"
    command: "./tests/test_vsgptinfo.sh"
  - name: "check_PROGRAMS (20)"
    source: tests/Makefile.am
    description: "20 个 C 测试程序（boot_record checksum chs_address error io_handle mbr_partition_entry mbr_partition_type notify partition partition_entry partition_table_header partition_type_identifier partition_values section_values sector_data support tools_info_handle tools_output tools_signal volume）"
    command: "make check"

test_package_tests:
  - file: test_libvsgpt.c
    description: "通用消费者断言：版本串（上游 20240504，非 Conan 0-20240504）、访问标志、codepage 正常/错误路径、check_volume_signature 的 0/-1 路径、volume 生命周期（16 项断言）"
    command: "./test_libvsgpt"
  - file: test_ohos.c
    description: "鸿蒙专项消费者测试：__OHOS__ 编译目标、TMPDIR 语义（存在/非 /tmp/可写）、在 TMPDIR 下合成合法 GPT 镜像并读回（签名→打开→512B 扇区→分区数→磁盘 GUID→entry index 查询→卷内偏移/分区大小→分区 GUID 与类型 GUID→读回 marker→当前偏移推进→关闭释放→清理）（28 项断言）"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  # 计数口径：本列表逐项给出**互不重叠**的消费者测试程序与断言数，
  # assertion_count = test_libvsgpt.c 的 16 项 + test_ohos.c 的 28 项 = 44。
  - name: "ohos-consumer-tests"
    description: "test_ohos.c（鸿蒙专项消费者测试）：__OHOS__ 编译目标、TMPDIR 语义（存在/非 /tmp/可写）、在 TMPDIR 下合成合法 GPT 磁盘镜像（保护性 MBR + 主/备 GPT 头 + 主/备 128×128B entries，CRC-32 全部正确）并用已安装库读回全链路"
    command: "./test_ohos"
    assertions: 28
    platform: OHOS
  - name: "generic-consumer-tests"
    description: "test_libvsgpt.c（通用消费者断言）：版本串、访问标志、codepage 正常/错误路径、check_volume_signature 的 0/-1 路径、volume 生命周期（该程序在 OHOS 上同样编译运行，但断言内容不依赖平台特性）"
    command: "./test_libvsgpt"
    assertions: 16
  - name: "installed-cli-load"
    description: "安装后的 bin/vsgptinfo -V 必须能加载共享库并输出版本串（含 20240504）（运行/加载验证，在 test() 内执行；是运行检查，不计断言数）"
    command: "vsgptinfo -V"
    assertions: 0
    platform: OHOS

assertion_count: 44
