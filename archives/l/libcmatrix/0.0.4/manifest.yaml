software: libcmatrix
# 版本级 manifest
# 文件位置: archives/l/libcmatrix/0.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.0.4"

# 构建系统类型
build_system: meson

# 编译状态
status: published

# 编译日期
build_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.savannah.nongnu.org/releases/libcmatrix/libcmatrix-0.0.4.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson

  configure_options:
    - "-Dbuild-examples=false"
    - "-Dbuild-tests=false"
    - "-Dintrospection=disabled"
    - "-Ddefault_library=static"

  dependencies:
    - glib/2.88.0
    - gio/2.88.0
    - olm/3.2.16
    - libsoup-3.0/3.4.4
    - json-glib-1.0/1.10.0
    - libgcrypt/1.11.0
    - libsecret-1/0.21.7
    - sqlite3/3.49.1
    - libpsl/0.21.5
    - libnghttp2/1.69.0
    - brotli/1.2.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 预编译包修复记录
# ============================================================

packaging_fixes:
  phase1:
    - "绝对路径 NEEDED → patchelf --replace-needed × 2 (brotli/nghttp2)"
    - "libz.so → libz.so.1 (patchelf --replace-needed)"
    - "RUNPATH → patchelf --set-rpath '$ORIGIN:$ORIGIN/external'"
    - "Strip → llvm-strip --strip-unneeded"
    - ".codesign → 保留原始签名"
    - "pkg-config prefix → /usr/local"
    - "外部依赖缺失 → 补齐 10 个"
  phase2:
    - "libffi.so → libffi.so.8 + 软链接 (SONAME/filename一致)"
    - "brotli/nghttp2 → patchelf --set-soname × 3 (添加SONAME)"
    - "libz.so.1 → llvm-strip + llvm-objcopy --remove-section .gnu_debuglink"
    - "libc++_shared.so → 不打包(无.codesign)，回退/system/lib64"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - E080: "glib 静态库缺少 g_libintl_* 符号，需创建 glibintl-shim 桥接库"
  - "libcmatrix 使用 meson 构建系统（非 autotools），需 PKG_CONFIG_PATH 设置才能找到依赖"
  - "json-glib 预编译包版本 (1.6.6) 不满足 >=1.8.0 要求，需从源码编译 1.10.0"
  - "libsoup-3.0 无预编译包，需从源码编译 3.4.4"
  - "olm 共享库缺少 libolm.so 软链接，需手动创建 soname 链接"
  - "预编译包的 .so 无 SONAME entry（brotli/nghttp2）需要 patchelf --set-soname 补充"
  - "libffi 预编译包文件名与 SONAME 不一致，需重命名+软链接"
  - "系统 libc++_shared.so 无 .codesign section，打包进 external/ 会导致 RUNPATH 加载失败，应回退 /system/lib64"