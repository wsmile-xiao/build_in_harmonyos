software: libebml
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/builds/libebml-1.4.5.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmake_minimum_required 版本过低会导致 CMake 配置失败，鸿蒙系统建议使用 VERSION 3.5 或更高"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual  # official | manual | skipped
  total: 7
  passed: 7
  failed: 0
  note: |
    libebml 无官方测试套件，采用自定义功能验证测试:
    - 测试 1: 版本信息验证 ✅
    - 测试 2: EBML Head 元素创建 ✅
    - 测试 3: EbmlId 类功能 ✅
    - 测试 4: CodedSizeLength 函数 ✅
    - 测试 5: pkg-config 配置 ✅
    - 测试 6: CMake 配置验证 ✅
    - 测试 7: 静态库完整性 ✅

    测试程序: test_ebml.cpp
    编译命令: clang++ -std=c++14 -DEBML_STATIC_DEFINE -lebml

# ============================================================
# 验证信息
# ============================================================

verification:
  pkg_config: verified  # pkg-config --modversion 成功
  cmake_config: verified  # CMake 配置文件完整
  static_library: verified  # llvm-ar/llvm-nm 检查通过
  functional_test: verified  # 功能测试程序运行成功

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libebml-1.4.5.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libebml-1.4.5.work
  source_orig_hash: ef2725378759648a
  source_work_hash: 0f8c0e5b18d6af60
  generated_at: '2026-05-20T22:22:21'
  patches_count: 1

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'
