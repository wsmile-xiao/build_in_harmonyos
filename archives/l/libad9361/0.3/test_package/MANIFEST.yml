# test_package/MANIFEST.yml
# libad9361 0.3.

package: libad9361/0.3
homepage: https://github.com/analogdevicesinc/libad9361-iio

upstream_tests_exist: true
upstream_test_audit: "test/CMakeLists.txt registers 5 executables: FilterDesignerTest, GenerateRatesTest are pure computation; FilterDesignerHardwareTest, AutoRateTest, FMComms5SyncTest need a real AD936x over libiio"
upstream_check_command: "ctest -N (=> 5); run FilterDesignerTest/GenerateRatesTest without hardware"
upstream_test_in_build: true
upstream_test_command: "./test/FilterDesignerTest && ./test/GenerateRatesTest"

upstream_tests:
  - name: "FilterDesignerTest"
    path: "test/filter_designer_test.c"
    description: "compares designed FIR taps against bundled rateRX/rateTX *.taps references"
  - name: "GenerateRatesTest"
    path: "test/gen_rates_test.c"
    description: "compares ad9361_calculate_rf_clock_chain against a reference for every rate from 5.2 to 61.44 MSPS"
  - name: "FilterDesignerHardwareTest / AutoRateTest / FMComms5SyncTest"
    path: "test/*_hw.c, test/fmcomms5_sync_test.c"
    description: "require a real AD936x device through libiio"

test_package_tests:
  - file: test_libad9361.c
    description: "RF clock chain result/range/monotonicity/over-rate rejection, filter design parameter derivation, FIR tap generation"
    command: "./libad9361_consumer"

test_files:
  - path: "test_package/test_libad9361.c"
    test_type: "R34"
    assertion_count: 11

test_package_test_count: 1
consumer_assertion_count: 11
assertion_count: 11
