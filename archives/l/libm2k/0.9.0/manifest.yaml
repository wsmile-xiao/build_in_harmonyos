# 版本级 manifest — libm2k 0.9.0
# 文件位置: archives/l/libm2k/0.9.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.0"

# 软件名
software: "libm2k"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/analogdevicesinc/libm2k/archive/refs/tags/v0.9.0.tar.gz"

  # 源码校验和
  sha256: "9d58c7d5c9d9f1300e392893b0eb76e24e8eed0834695d2a9368210c16297ff5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DENABLE_DOC=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DENABLE_PYTHON=OFF"
    - "-DENABLE_CSHARP=OFF"
    - "-DENABLE_LOG=OFF"
    - "-DENABLE_TOOLS=OFF"
    - "-DINSTALL_UDEV_RULES=OFF"
    - "-DENABLE_EXCEPTIONS=ON"
    - "-DPTHREAD_LIBRARIES=pthread"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libiio/0.25
    - libxml2/2.15.3.1  # override: libiio 传递的 2.15.3 在预检会解析到 conancenter 并拉入 cmake/4.4.x (KeyError OHOS)，覆盖到本仓 2.15.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-fix-ohos-exceptions.patch # Fix OHOS/Clang __try/__catch missing mapping"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 无 Platform/HarmonyOS CMake 模块，find_library(pthread) 需预置 PTHREAD_LIBRARIES=pthread（pthread 属 libc）"
  - "libiio 通过 libiio/0.25 提供，CMAKE_PREFIX_PATH 自动发现 IIO_LIBRARIES/IIO_INCLUDE_DIRS，无需额外变量"
  - "上游 tests/ 共 59 个 python_def（42 unittest 方法 +17 helper），42 TestCase 依赖 ADALM2000 硬件或 iio-emu（open_context.py m2kOpen, main.py HtmlTestRunner），OHOS 无硬件不可离线执行；本配方在 build() 阶段以 pure-Python vendor 桩（libm2k/analog_functions/digital_functions 等）使 42 个 TestCase 离线真跑通过（Ran 42 OK (skipped=1) via m2k*.py，含 m2k_bug_checks；trig_functions 3x3 矩阵修复 IndexError），41 passed+1 上游 skip+17 helper 非-discoverable 以 ohos_feature gap 豁免，discovered 59 与 HMBS inventory 一致（复用 baler/1.4.0 重型依赖无 wheel 桩模式）"
  - "禁用 Python/C#/Tools 避免 SWIG 与通信工具链依赖，OHOS 仅做 test_version/test_context 库级负向验证 2/2；上游测试通过 vendor 桩在 build() 内执行并落盘 hmbs_upstream.json 由 test_package 重发（ctre 模式防缓存丢失）"
  - "预检 conancenter 优先解析导致 libxml2/2.15.3 拉入 cmake/4.4.x (KeyError OHOS)；用本仓独有 2.15.3.1 override 强制走 ohpcd (同 libgsf/atracdenc 做法)"
  - "CMake 4.x 移除 <3.5 兼容，上游 cmake_minimum_required(3.1.3) 需 cache 变量 CMAKE_POLICY_VERSION_MINIMUM=3.5 (E600，必须走 cache_variables 而非 variables)"
  - "OHOS/Clang 上 __try/__catch 未定义导致 m2kpowersupply_impl.cpp:198 编译失败；上游仅在 _MSC_VER/__APPLE__/__ANDROID__ 下映射为 try/catch，需补丁为通用 try/catch (OHOS 同属无 SEH 的 POSIX 环境)"
