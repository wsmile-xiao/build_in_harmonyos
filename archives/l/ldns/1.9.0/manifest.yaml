software: ldns
# 版本级 manifest
version: "1.9.0"
status: published
build_date: "2026-08-10"
build_system: autotools

source:
  url: "https://www.nlnetlabs.nl/downloads/ldns/ldns-1.9.0.tar.gz"
  sha256: "abaeed2858fbea84a4eb9833e19e7d23380cc0f3d9b6548b962be42276ffdcb3"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-examples"
    - "--with-drill"
  dependencies:
    - "openssl/3.5.6"
  cc: clang

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

knowledge_gained:
  - "config.status临时目录问题：HarmonyOS上mktemp -d + umask 077创建的目录无法写入文件"
  - "解决方案：在build()中用replace_in_file修复configure脚本的临时目录创建逻辑"
  - "OpenSSL依赖版本：制品仓中openssl/3.0不存在，使用openssl/3.5.6"

compiled_tools:
  - name: "libldns"
    status: "success"
    static: "libldns.a"
    dynamic: "libldns.so.3.6.0"
  - name: "drill"
    status: "success"
  - name: "ldns-config"
    status: "success"
