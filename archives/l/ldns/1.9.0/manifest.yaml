software: ldns
# 版本级 manifest
version: "1.9.0"
status: built
build_date: "2026-05-28"

source:
  url: "https://www.nlnetlabs.nl/downloads/ldns/ldns-1.9.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--with-examples"
    - "--with-drill"
    - "--with-ssl=$DEFAULT_PREFIX"
  dependencies:
    - "openssl/3.0"
  cc: gcc

patches_applied:
  - "0001-harmonyos-platform-support.patch"

knowledge_gained:
  - "config.status工具链问题：HarmonyOS上config.status无法创建临时文件"
  - "手动编译方案：绕过autotools直接编译源文件"

compiled_tools:
  - name: "libldns"
    status: "success"
    static: "libldns.a (621KB)"
    dynamic: "libldns.so.1.9.0 (412KB)"
  - name: "ldns-drill"
    status: "success"
    size: "354KB"