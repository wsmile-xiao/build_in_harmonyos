# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: ldns/1.9.0
homepage: "https://www.nlnetlabs.nl/projects/ldns/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ldns does not have a standard `make check` target
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verifies ldns library linkage and API: ldns_rr_list_new, ldns_pkt_new, ldns_version"
    command: "./test_ldns"

# 测试断言总数
assertion_count: 4
