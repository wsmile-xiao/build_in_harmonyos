# 版本级 manifest 模板
# 文件位置: archives/l/lpac/2.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.0"

# 软件名
software: "lpac"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/estkme-group/lpac/tarball/c2fcf5e4b21c712d54e35a11da2ad9ad134fb821"

  # 源码校验和
  sha256: "c4074119edf3d7375d2abb0ef09ad68c0e6aa820abf65672dcf52e0d6ae6bc6c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DLPAC_WITH_APDU_PCSC=ON"
    - "-DLPAC_WITH_APDU_AT=ON"
    - "-DLPAC_WITH_APDU_QMI=OFF"
    - "-DLPAC_WITH_APDU_QMI_QRTR=OFF"
    - "-DLPAC_WITH_APDU_MBIM=OFF"
    - "-DLPAC_WITH_APDU_GBINDER=OFF"
    - "-DLPAC_WITH_HTTP_CURL=ON"
    - "-DLPAC_DYNAMIC_DRIVERS=OFF"
    - "-DLPAC_DYNAMIC_LIBEUICC=OFF"
    - "-DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - curl/8.15.0
    - pcsc-lite/2.4.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
