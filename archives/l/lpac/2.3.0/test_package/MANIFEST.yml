# test_package/MANIFEST.yml
# 上游官方测试声明文件 — lpac 2.3.0（CMake 工程）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试注册入口**实测 0 命中**（B 机 worktree 全树 grep）：
#   grep -rn "enable_testing|add_test|CTest" --include=CMakeLists.txt --include=*.cmake → 无命中
#   顶层与各子目录均无 tests/ 目录、无 ctest 配置
# ⇒ N_static = 0（不是"没跑"，是上游确实没有自动化测试）；不得声称跑过不存在的 ctest。

package: lpac/2.3.0
homepage: "https://github.com/estkme-group/lpac"

# 上游没有任何测试入口；保留字面量供机器解析。
upstream_check_command: "ctest"

# 上游不存在测试 ⇒ build() 中不执行上游测试；本包 build() 只做编译与安装。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，执行被测二进制 lpac）
test_package_tests:
  - file: test.sh
    description: "消费者测试 —— 执行被测二进制 lpac 三组场景：①默认 APDU 后端（本包 LPAC_WITH_APDU_PCSC=ON；OHOS PC 无 PCSC 上下文 ⇒ 确定性非零退出 + SCardEstablishContext/APDU driver init failed 诊断，同时是平台能力面披露）；②LPAC_APDU=stdio 显式后端（无参数 ⇒ 走 applet 入口打印 Usage 并回显程序名）；③未知子命令（回显 Unknown command）。全部按退出码与输出内容断言，非空壳、非只打印。"
    command: "sh test.sh <package_folder>/bin/lpac"

# 测试断言总数（由 test.sh 自身计数并在末尾打印 ASSERTION TOTAL=…；
# 与 PR 正文 / notes.md 同源，改断言必须同步改这里）—— 实测 9/9 全过
assertion_count: 9
