software: libpq
# 版本级 manifest 模板
# 遵循 ARCHIVE-SPEC v2.0

version: "16"
status: published
build_date: "2026-05-27"

source:
  url: "https://ftp.postgresql.org/pub/source/v16.2/postgresql-16.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--without-readline"
    - "--without-zlib"
    - "--without-icu"
    - "--disable-nls"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "VPATH构建避免HMDFS权限问题"
  - "sed -i 's/umask 077/umask 022/g' configure"

build_system: autotools