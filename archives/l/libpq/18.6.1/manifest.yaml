# manifest.yaml — libpq 18.6.1 版本级元数据
# 18.6 的打包修订（R37 后缀）：同一份 postgresql-18.6.tar.gz，补 bin/pg_config 与客户端头闭包

software: libpq
version: "18.6.1"
status: built
build_date: "2026-09-22"

build_system: autotools
upstream_url: "https://git.postgresql.org/gitweb/?p=postgresql.git"
source_url: "https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.gz"
sha256: "983ee554ec53dbeb9b70797bef9fcf4e67e117e7e48ca1463cc80b3ff8e8ff3f"

description: "PostgreSQL client library (libpq frontend C API) with pg_config"
license: PostgreSQL

dependencies: []

provides:
  - bin/pg_config
  - lib/libpq.so
  - lib/libpq.so.5
  - lib/libpq.so.5.18
  - lib/libpq.a
  - lib/pkgconfig/libpq.pc
  - include/libpq-fe.h
  - include/libpq-events.h
  - include/postgres_ext.h
  - include/pg_config.h
  - include/pg_config_os.h
  - include/pg_config_manual.h
  - include/libpq/libpq-fs.h
  - include/postgresql/internal/{c.h,port.h,postgres_fe.h,libpq-int.h,fe-auth-sasl.h,pqexpbuffer.h,libpq/pqcomm.h,libpq/protocol.h}

conan:
  user: ohpcd
  channel: stable

notes: |
  - 18.6 的修订版：配方沿用 18.6（零补丁、in-source configure + make -C src/interfaces/libpq），
    libpq.so.5.18 / libpq.a 与制品仓 libpq/18.6 逐字节相同（真机 sha256 55ebca84… / a6a51959…）
  - 新增 bin/pg_config（make -C src/bin/pg_config）：psycopg2 / psycopg-c / asterisk 等消费方
    构建期先跑 pg_config 定位 libpq，18.6 缺它导致 `pg_config executable not found`
  - 新增客户端头闭包（对齐 src/include/Makefile install 前两段 = Debian libpq-dev）：
    pg_config.h / pg_config_os.h / pg_config_manual.h / libpq/libpq-fs.h + internal 5 个头
  - pg_config 按自身 bin/ 位置重定位 --prefix=/ 的编译期路径，conan cache 与 usr_local
    deployer 摊平前缀下均答出正确 --includedir/--libdir（真机实测）
  - 真机 772 端到端：psycopg2 2.9.12 与 psycopg-c 3.3.6 均从 sdist 编出 ohos_aarch64 wheel
    并 import 成功（compiled/runtime libpq 均 180006）
  - 18.6 不动、其 10 个下游 requires 不改：ABI 相同，无需重发；新消费方用 18.6.1
