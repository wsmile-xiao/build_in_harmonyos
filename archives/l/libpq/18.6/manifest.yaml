# manifest.yaml — libpq 18.6 版本级元数据
# 平台任务 6334（开源鸿蒙PC专项积分赛-依赖），Conan 配方从零适配

software: libpq
version: "18.6"
status: built
build_date: "2026-09-05"

build_system: autotools
upstream_url: "https://git.postgresql.org/gitweb/?p=postgresql.git"
source_url: "https://ftp.postgresql.org/pub/source/v18.6/postgresql-18.6.tar.gz"
sha256: "983ee554ec53dbeb9b70797bef9fcf4e67e117e7e48ca1463cc80b3ff8e8ff3f"

description: "PostgreSQL client library (libpq frontend C API)"
license: PostgreSQL

dependencies: []

provides:
  - libpq.so
  - libpq.so.5
  - libpq.so.5.18
  - libpq.a

conan:
  user: ohpcd
  channel: stable

notes: |
  - 从零写 Conan 配方（archives/l/libpq/16 与 18.1 为旧 v2.0 无 conanfile 格式）
  - PG18 源码包无预生成 parser/catalog 头 → tool_requires bison/3.8.2 + flex/2.6.4 + perl/5.42.2
  - 零补丁：显式 --build=$(clang -dumpmachine)，umask 077→022 程序化放松，TMPDIR 指 build 目录
  - in-source configure + make -C src/interfaces/libpq（自动 submake src/port+src/common）
  - 手动补装 src/include/postgres_ext.h（libpq-fe.h 依赖，18.x 已删 pg_config_ext.h）
  - libpq.so.5.18 为 SO_MAJOR_VERSION=5 / SO_MINOR_VERSION=MAJORVERSION=18
  - psycopg-c 3.3 按 libpq 18 编译场景的依赖（需 PQfullProtocolVersion）
