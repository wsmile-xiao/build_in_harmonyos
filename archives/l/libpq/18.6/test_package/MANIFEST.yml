# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libpq/18.6
homepage: "https://www.postgresql.org/"

# 上游官方测试命令：libpq 目录 make check（Perl TAP，经 prove 驱动）
# 需要 PostgreSQL 服务端测试基座 (PostgreSQL::Test::Utils/Cluster + IPC::Run)，
# 且 configure 需 --enable-tap-tests；OHOS 构建沙箱无此 Perl 模块/测试基座，
# 亦无可用 PostgreSQL 服务端。
upstream_check_command: "make -C src/interfaces/libpq check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（均需 TAP 基座/服务端，构建机不可运行）
upstream_tests:
  - file: src/interfaces/libpq/t/001_uri.pl
    description: "URI 连接串解析回归（需 PostgreSQL::Test::Utils + libpq_uri_regress 客户端）"
    command: "prove t/001_uri.pl"
  - file: src/interfaces/libpq/t/002_api.pl
    description: "libpq API 客户端测试（需可连服务端）"
    command: "prove t/002_api.pl"
  - file: src/interfaces/libpq/t/003_load_balance_host_list.pl
    description: "host 负载均衡列表测试（需 PostgreSQL::Test::Cluster）"
    command: "prove t/003_load_balance_host_list.pl"
  - file: src/interfaces/libpq/t/004_load_balance_dns.pl
    description: "DNS 负载均衡测试（需 PostgreSQL::Test::Cluster）"
    command: "prove t/004_load_balance_dns.pl"
  - file: src/interfaces/libpq/t/005_negotiate_encryption.pl
    description: "加密协商测试（需 PostgreSQL::Test::Cluster + TLS）"
    command: "prove t/005_negotiate_encryption.pl"
  - file: src/interfaces/libpq/t/006_service.pl
    description: "pg_service.conf 服务名解析测试（需 PostgreSQL::Test::Cluster）"
    command: "prove t/006_service.pl"

# test_package 自带测试（消费者视角，C 复现上游 URI 解析 + 版本契约 + 失败路径）
test_package_tests:
  - file: test.c
    description: "链接真实 libpq：PQlibVersion()==180006 版本契约；PQconninfoParse 解析 URI 断言 user/password/host/port/dbname/sslmode 字段（对齐 t/001_uri.pl）；PQconnectdb 连 127.0.0.1:1 干净返回 CONNECTION_BAD"
    command: "./test_probe"

# 测试断言总数（11 个 CHECK）
assertion_count: 11
