# 版本级 manifest — libinsane 1.0.10
# 文件位置: archives/l/libinsane/1.0.10/manifest.yaml（ARCHIVE-SPEC v3.0）

version: "1.0.10"
software: "libinsane"

# published | built | failed | archived
status: built

build_date: "2026-09-28"
build_system: meson

source:
  url: "https://gitlab.gnome.org/World/OpenPaperwork/libinsane/-/archive/1.0.10/libinsane-1.0.10.tar.gz"
  sha256: "a9b8daaef03eb3bc4a8e638131e506ff3c2f99f715170da572e7f5ce7ba76467"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    # MesonToolchain 经 conanfile.generate() 注入（此处为可读留痕，实际由 tc 生成 machine file）
    - "-Dwrap_mode=nodownload"
    - "-Ddefault_library=shared"
    # 子项目开关（MesonToolchain.subproject_options，见 conanfile.py generate()）
    - "libinsane-gobject:-Dintrospection=false"
    - "libinsane-gobject:-Dgtk_doc=false"
  dependencies:
    - "sane-backends/1.2.1"      # 硬依赖：subprojects/libinsane/src/meson.build 非 Windows 恒 resolve
    - "glib/2.84.0.2"            # libinsane-gobject 需 gobject-2.0；钉 2.84.0.2 才与 sane-backends 同图（2.88.x 拉 zlib/1.3.2 撞图）
    - "cunit/2.1.3"              # 上游整套 CUnit 测试的门，visible=false（build/test 期私有）
  cc: clang
  cxx: clang++

tool_requires:
  - "meson/1.11.0"
  - "ninja/1.12.1"
  - "pkgconf/3.0.5"

patches_applied:
  - "0001-libinsane-gobject-meson_options.txt.patch"
  - "0002-libinsane-gobject-src-meson.build.patch"
  - "0003-libinsane-gobject-doc-meson.build.patch"

knowledge_gained:
  - "E135"   # knowledge_ref: E135 — OHOS 动态链接器要求 .so 必须签名，签名失效的库即使路径/LD_LIBRARY_PATH 正确也会被拒加载；本包在 package() 末尾 _sign_shared_libs()（remove-section → selfSign → chmod），glib/2.84.0.2 同款，四臂对照与 B 判定=create（Issue #3549）见 notes「遇到的问题与解决方案」与「路径 B 声明」两节

testing:
  consumer_test: test_package/test_libinsane.c
  consumer_assertions: 14              # == assertions: 14 passed, 0 failed ==（reports/conan-create.log:270）
  consumer_static_asserts: 12          # _Static_assert 编译期 ABI 钉死，不计入运行期断言（实测 12 条，第 6 行注释不计）
  upstream_test_in_build: false        # build() 不调 meson.test()；原因见 test_package/MANIFEST.yml 与 notes「验证结果」节
  upstream_test_command: "meson test -C build-release"
  upstream_total: 24
  upstream_ok: 22
  upstream_fail: 1                     # tests_sane：Suite init Failed to get test device 0x60000003（能力面）
  upstream_timeout: 1                  # tests_workaround_dedicated_process：用例 passed 但进程不退出，30s SIGTERM
  evidence: reports/upstream-meson-test.log

w3:
  ci_result_exit_code: 0
  verify_verdict: PASS
  # .ci-result.json 由 finish 每次重写、内含时间戳 ⇒ **仓内不落字面三元组**（否则仓内旧档 vs
  # 实物新档会变成「两套读数」）。判据式：
  #   integrity_hash = sha256(f"{timestamp}:libinsane:1.0.10:0")[:16]
  #   log_sha256     = sha256sum reports/w3-local-ci.log
  # 三个真实读数（timestamp / integrity_hash / log_sha256）**以 .ci-result.json 实物为准**，
  # 字面值只写进 PR 正文（正文是唯一能承载最终值又不移动 HEAD 的位置）。
