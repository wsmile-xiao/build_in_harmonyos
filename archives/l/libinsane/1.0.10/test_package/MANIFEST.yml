test_package_tests:
  - file: test_libinsane.c
    description: "Consumer test: links libinsane.so and libinsane_gobject.so through
      CMake, pins 12 public ABI/layout facts with _Static_assert (compile-time, not counted in assertion_count), runs the exported
      pure-logic API (lis_compare on BOOL/INTEGER/DOUBLE/STRING, lis_getenv defaults,
      lis_free on a heap string, lis_get_version) and asserts the real failure form of
      the SANE device surface on a scanner-less host (get_device must return an
      lis_error, and the vtable must be populated)"
    command: "./test_libinsane"

assertion_count: 14   # 只数运行期断言：test_libinsane.c 实测 `== assertions: 14 passed, 0 failed ==`（reports/conan-create.log:270）；另有 12 处 _Static_assert 属编译期 ABI 钉死，不计入（实测：第 29/31/33/35/37/39/41/43/45/48/52/54 行；第 6 行是注释、不计）

# ── 上游测试真跑读数（2026-09-28，W3 之外单独跑；日志留本机 reports/upstream-meson-test.log、
#     按 .gitignore:96 不入 PR，关键读数逐条内嵌于下、不依赖日志随包）
#    命令：meson test -C build-release --print-errorlogs
upstream_test_readings:
  total: 24
  ok: 22
  fail: 1
  timeout: 1
  fail_detail: "tests_sane — stdout: `WARNING - Suite initialization failed for 'Sane'.`
    （suites 1/0 ran/1 failed；tests 8/0 ran）；stderr 第一条真实错误：
    `Tests init: Failed to get test device: 0x60000003, The device is offline. Make sure
    the device is powered on and connected to the PC.` ⇒ 能力面：scanner-less host 拿不到
    SANE 测试设备，不是本包代码缺陷；消费者侧已按真实失败形态断言（get_device 必须返 lis_error）。"
  timeout_detail: "tests_workaround_dedicated_process — `Test: tests_dedicated_process_scan()
    ...passed` 之后进程不退出，30.06s 被 meson `killed by signal 15 SIGTERM` ⇒ 用例本身通过，
    挂在进程收尾（fork/管道未关一类），属上游用例在本机的收尾问题，如实申报、不删用例。"
  command: "meson test -C build-release --print-errorlogs"
  log: reports/upstream-meson-test.log
