# 上游测试**不在 build() 里跑**：conanfile.build() 只做 configure+build（无 meson.test() 调用），
# 本窗 2026-09-28 在 W3 之外单独真跑过一轮 `meson test -C build-release --print-errorlogs`，
# 读数见本文件末段与 reports/upstream-meson-test.log。接成红门会让 conan create 恒红：
#   Ok 22 / Fail 1（tests_sane）/ Timeout 1（tests_workaround_dedicated_process）
# 而规则禁止 `|| true`、吞退出码、缩分母 ⇒ 按真实形态申报、不接进 build()。
upstream_test_in_build: false
upstream_test_command: "meson test"
upstream_test_registration: "subprojects/libinsane/tests/meson.build registers a suite per
  name in LIBINSANE_TESTS + LIBINSANE_VALGRIND_TESTS, and only when
  dependency('cunit') resolves; otherwise it prints 'Cunit not found. TESTS DISABLED'."

upstream_tests:
  - file: tests_sane.c
    source: subprojects/libinsane/tests/tests_sane.c
    description: "SANE backend suite: lis_api_sane() init plus get_device() on the
      upstream virtual device test:0 (registered when host and build systems match)"
    command: "meson test tests_sane"
  - file: tests_twain.c
    source: subprojects/libinsane/tests/tests_twain.c
    description: "TWAIN backend suite (registered on the cross/Windows branch of
      LIBINSANE_TESTS; the TWAIN implementation itself is only compiled for Windows)"
    command: "meson test tests_twain"
  - file: tests_wia_ll.c
    source: subprojects/libinsane/tests/tests_wia_ll.c
    description: "WIA low-level backend suite (same cross/Windows registration branch
      as tests_twain)"
    command: "meson test tests_wia_ll"
  - file: tests_multiplexer.c
