sources:
  url: "https://gitlab.gnome.org/World/OpenPaperwork/libinsane/-/archive/1.0.10/libinsane-1.0.10.tar.gz"
  sha256: "a9b8daaef03eb3bc4a8e638131e506ff3c2f99f715170da572e7f5ce7ba76467"
patches:
  - patch_file: "patches/0001-libinsane-gobject-meson_options.txt.patch"
    patch_description: "libinsane-gobject: add 'introspection' and 'gtk_doc' options (both off by default), which upstream lacks"
    patch_type: "portability"
  - patch_file: "patches/0002-libinsane-gobject-src-meson.build.patch"
    patch_description: "libinsane-gobject/src: gate gnome.generate_gir()/generate_vapi() on the introspection option"
    patch_type: "portability"
  - patch_file: "patches/0003-libinsane-gobject-doc-meson.build.patch"
    patch_description: "libinsane-gobject/doc: gate gnome.gtkdoc() on the gtk_doc option (no gtk-doc toolchain here)"
    patch_type: "portability"
