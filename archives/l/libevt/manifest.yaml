software: libevt
display: "libevt — Windows Event Log (EVT) Library"
description: "用于访问 Windows 事件日志 (EVT) 格式的 C 库，含 evtinfo/evtexport 终端工具"
category: forensics
homepage: "https://github.com/libyal/libevt"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GNU config.guess 不识别 HarmonyOS，需显式 --build/--host=aarch64-unknown-linux-gnu 绕过平台猜测 (E007)"
    - "HMDFS 文件系统 umask 077 导致 configure 临时目录权限拒绝，构建期替换为 umask 022 (E011)"
    - "发布包为 libyal 自包含形态，内嵌 20 个本地支撑库，无外部 Conan 依赖"
    - "上游 GitHub release 资产已被 libyal 清理（仅保留最新 2 个 tag），使用 Debian archive orig tarball 镜像"
    - "libtool wrapper 无法在 OHOS 直接执行，test_runner.sh 需 .libs/ ELF 调度适配"
  common_dependencies: []

versions:
  "20240421":
    status: built
    build_date: "2026-09-18"
    source_url: "https://deb.debian.org/debian/pool/main/libe/libevt/libevt_20240421.orig.tar.gz"
    conan_reference: "libevt/20240421"
