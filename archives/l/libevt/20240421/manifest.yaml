software: libevt
version: "20240421"
status: built
build_date: "2026-09-18"
difficulty: "B"
adaptation_path: "路径 A（基础适配）"

source:
  url: "https://deb.debian.org/debian/pool/main/libe/libevt/libevt_20240421.orig.tar.gz"
  sha256: "984837219de4155b2fbe5817dea6ce737e39f36457e89511371b3cad0ab18606"
  tar_format: tar.gz
  upstream_release_url: "https://github.com/libyal/libevt/releases/download/20240421/libevt-experimental-20240421.tar.gz"
  release_artifact: "Debian orig tarball mirror; upstream GitHub release asset pruned (only tags 20260523/20260705 remain)"

build:
  system: autotools
  configure_options:
    - "--disable-python"
    - "--enable-static-executables=no"
    - "--enable-shared"
    - "--disable-static"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcdirectory
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libexe
    - libfcache
    - libfdata
    - libfdatetime
    - libfguid
    - libfvalue
    - libfwnt
    - libfwevt
    - libregf
    - libuna
    - libwrc
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

test:
  upstream: "make check"
  test_package: "test_libevt + test_ohos"
