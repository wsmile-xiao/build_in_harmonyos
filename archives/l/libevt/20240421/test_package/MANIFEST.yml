package: libevt/20240421
homepage: https://github.com/libyal/libevt

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: "libevt library tests"
    source: tests/test_library.sh
    description: "Upstream shell runner for the library and its 11 C test programs"
    command: "./tests/test_library.sh"
  - name: "evttools tests"
    source: tests/test_tools.sh
    description: "Upstream evttools (evtinfo/evtexport) tool tests, 8 C test programs"
    command: "./tests/test_tools.sh"
  - name: "evtinfo end-to-end tests"
    source: tests/test_evtinfo.sh
    description: "evtinfo end-to-end tests; requires tests/input/ sample data not shipped in the release tarball (SKIP exit 77)"
    command: "./tests/test_evtinfo.sh"
  - name: "evtexport end-to-end tests"
    source: tests/test_evtexport.sh
    description: "evtexport end-to-end tests; requires tests/input/ sample data not shipped in the release tarball (SKIP exit 77)"
    command: "./tests/test_evtexport.sh"

test_package_tests:
  - file: test_libevt.c
    description: "Consumer API version, flags, codepage, error and file lifecycle checks"
    command: "./test_libevt"
  - file: test_ohos.c
    description: "OHOS-specific consumer test: compile-time OHOS target check, writable TMPDIR, HMDFS file lifecycle and signature-check API"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "ohos-hmdfs-file-lifecycle-and-signature-check"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、TMPDIR 非 /tmp、HMDFS 临时文件读写清理以及 libevt_check_file_signature 对非 EVT 文件返回 0"
    command: "./test_ohos"
    assertions: 10
    platform: OHOS
