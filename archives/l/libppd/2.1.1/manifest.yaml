software: libppd
# 版本级 manifest 模板
# 文件位置: archives/l/libppd/2.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-23"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 release，CI mirror fallback 覆盖 github.com）
  url: "https://github.com/OpenPrinting/libppd/archive/refs/tags/2.1.1.tar.gz"

  # 源码校验和
  sha256: "6f728cce3fb5eb862dec63859a9b258ae04684bb63345c7aaf47100826ea1ee6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-cups-config=cups-config"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "cups/2.4.19"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libppd 是 OpenPrinting 的 PPD 文件处理库，CUPS 3.x 时代 PPD API 抽离"
  - "configure.ac 优先检测 cups3（pkg-config），失败 fallback 到 cups-config（CUPS 2.x）"
  - "仓库里是 cups 2.4.19，走 cups-config fallback 路径，需 --with-cups-config=cups-config"
  - "Apache-2.0 许可证，构建系统标准 autotools"
