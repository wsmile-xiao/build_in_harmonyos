# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libppd/2.1.1
homepage: "https://github.com/OpenPrinting/libppd"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libppd 使用 autotools，有 `make check` 目标
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: ppd/testppd.c
    description: "libppd 自带测试程序 (check_PROGRAMS = testppd, TESTS = testppd)，覆盖 PPD 文件打开/解析、属性查找、选项标记、冲突检测/解析、PostScript 生成、本地化、错误处理"
  - file: ppd/test.ppd
    description: "testppd 测试数据 PPD 文件"
  - file: ppd/test2.ppd
    description: "testppd 测试数据 PPD 文件（约束/冲突测试）"
  - file: ppd/testdriver.c
    description: "驱动测试 (EXTRA_DIST，非 TESTS)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_libppd.c
    description: "链接 libppd，调用 PPD 公共 API 解析最小 PPD 文件，覆盖上游 testppd.c 核心测试项: ppdOpenFile 打开 PPD、ppdFindAttr 查找 Manufacturer 属性、ppdMarkDefaults 标记默认选项、ppdIsMarked 检查默认选项标记、ppdPageSize 获取 Letter 页面尺寸、ppdConflicts 获取冲突数（默认 0）、ppdEmitString 生成 PostScript 代码、ppdLastError/ppdErrorString 错误处理、ppdClose 关闭 PPD"
    command: "cmake --build build && ./build/test_libppd"

# 测试断言总数 (近似值, 用于质量评估)
# 9 项断言，对应上游 testppd.c 9 个核心公共 API 测试项
assertion_count: 9

# 上游测试项覆盖情况
upstream_test_coverage:
  covered:
    - "ppdOpenFile（上游 testppd.c \"ppdOpenFile(\\\"ppd/test.ppd\\\")\"）"
    - "ppdFindAttr（上游 testppd.c \"ppdFindAttr(ppd, \\\"cupsSingleBlock\\\", spec)\"）"
    - "ppdMarkDefaults（上游 testppd.c \"ppdMarkDefaults\"）"
    - "ppdIsMarked（上游 testppd.c \"ppdIsMarked(ppd, \\\"PageSize\\\", \\\"Letter\\\")\"）"
    - "ppdPageSize（上游 testppd.c \"ppdPageSize(ppd, \\\"Letter\\\")\"）"
    - "ppdConflicts（上游 testppd.c \"ppdConflicts(ppd)\"）"
    - "ppdEmitString（上游 testppd.c \"ppdEmitString(ppd, PPD_ORDER_ANY, 0.0)\"）"
    - "ppdLastError / ppdErrorString（上游 testppd.c \"ppdLastError(&line)\"）"
    - "ppdClose（上游 testppd.c \"ppdClose(ppd)\"）"
  not_covered:
    - "ppdResolveConflicts（上游 testppd.c 冲突解析，需要构造冲突的 PPD 文件 test2.ppd）"
    - "ppdLocalizeMarkerName（上游 testppd.c 本地化标记名，需要多语言 PPD 文件）"
    - "ppdEmit / ppdEmitFd / ppdEmitJCL（上游 testppd.c PostScript 输出到文件/fd/JCL）"
    - "ppdMarkOption（上游 testppd.c 标记非默认选项，需要冲突场景）"
    - "ppdFindChoice / ppdFindMarkedChoice / ppdFindOption（上游 testppd.c 选项查找辅助函数）"
