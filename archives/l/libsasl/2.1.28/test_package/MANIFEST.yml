package: libsasl/2.1.28
homepage: "https://www.cyrusimap.org/sasl/"

upstream_test_in_build: true
upstream_test_command: "utils/testsuite -s 1 -r 0 (sasl-testsuite functional phases on disposable lmdb/sasldb tree; installed tree stays db_none; -a all-corruption fuzz omitted after 2 deterministic failures, documented)"
upstream_check_command: "make -j1 testsuite && ./testsuite -s 1 -r 0"

upstream_tests:
  - file: utils/testsuite.c
    source: cyrus-sasl-2.1.28/utils/testsuite.c
    description: "Upstream SASL testsuite harness, built via make testsuite and run as utils/testsuite -s 1 -r 0 (functional phases) with seeded ./sasldb (ken/1234) on disposable lmdb tree; -a fuzz omitted, see notes"
    command: "./testsuite -s 1 -r 0"
  - file: saslauthd/testsaslauthd.c
    description: "saslauthd daemon integration test (not run: recipe configures --without-saslauthd)"
  - file: sample/client.c
    description: "Sample SASL client (not built: recipe configures --disable-sample)"
  - file: sample/server.c
    description: "Sample SASL server (not built: recipe configures --disable-sample)"
  - file: saslauthd/testsaslauthd.c
    description: "saslauthd daemon integration test (not run: recipe configures --without-saslauthd)"
  - file: sample/client.c
    description: "Sample SASL client (not built: recipe configures --disable-sample)"
  - file: sample/server.c
    description: "Sample SASL server (not built: recipe configures --disable-sample)"

test_package_tests:
  - file: test_libsasl.c
    description: "Consumer test: version query, client init, connection creation"
    command: "./test_libsasl"

assertion_count: 4
