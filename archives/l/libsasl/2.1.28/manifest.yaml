software: libsasl
version: "2.1.28"
status: built
build_system: autotools
source:
  url: "https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz"
  sha256: "7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c"
build:
  options:
    - "--disable-shared"
    - "--enable-static"
    - "--with-staticsasl"
    - "--with-dblib=none"
    - "--without external auth backends"
libs:
  - sasl2
requires: []
patches_applied:
  - "0001-configure-ohos-tempdir.patch"
  - "0002-lib-Makefile.in-copy-linksrcs.patch"
  - "0003-testsuite-use-int-for-getopt.patch"
test_package:
  type: cmake-consumer
  checks: 4
adaptation_paths:
  - A
notes:
  - "Packages core libsasl2 from the Cyrus SASL 2.1.28 source; disables service/back-end closures such as saslauthd, PAM, LDAP, SQL, Kerberos/GSSAPI, DB, OpenSSL, and DES."
  - "Upstream testsuite (utils/testsuite) is built and run as utils/.libs/testsuite -a during build(); saslauthd/sample trees stay disabled and are documented, not executed."
