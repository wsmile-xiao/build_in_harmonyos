# Version manifest — layer-shell-qt 6.5.4
version: "6.5.4"
software: "layer-shell-qt"
status: built
build_system: cmake

source:
  url: "https://download.kde.org/stable/plasma/6.5.4/layer-shell-qt-6.5.4.tar.xz"
  sha256: "bb95db253ffcd29e08191656b6a5449f8a8800c38256873e2529749b55eaa80a"
  tar_format: tar.xz
scanner_source:
  url: "https://gitlab.freedesktop.org/wayland/wayland/-/archive/1.22.0/wayland-1.22.0.tar.gz"
  sha256: "bbca9c906a8fb8992409ebf51812f19e2a784b2c169d4b784cdd753b4bb448ef"
  purpose: "Build a static host wayland-scanner because dynamic Conan-cache tools are blocked by HMDFS"
scanner_dependency_source:
  url: "https://codeload.github.com/libexpat/libexpat/tar.gz/refs/tags/R_2_8_2"
  sha256: "ca9d7c05560653cb977bfaa1ac54f717919cc0c68f6798b42fe55347c0b0ad52"
  purpose: "Build the scanner's expat parser statically rather than load its shared Conan dependency"
  source_mirror: "GitHub codeload tag archive used after the official release download timed out"

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "CMAKE_SHARED_LINKER_FLAGS=-Wl,--disable-new-dtags"
    - "LAYER_SHELL_QT_BUILD_QML=OFF"
    - "QT_BUILD_TESTS=ON"
  dependencies:
    - "ecm/6.20.0"
    - "qtbase/6.11.1.2"
    - "qtwayland/6.11.1"
    - "wayland/1.22.0"
    - "libxkbcommon/1.6.0"
    - "wayland-protocols/1.36.1 (build)"

patches_applied:
  - "0001-optional-qml-module.patch"
  - "0002-test-without-qml-module.patch"
  - "0003-qtwayland-core-protocol-header-order.patch"

knowledge_gained:
  - "QtWayland private client headers come from qtwayland, not qtbase."
  - "QtWayland's generated private core protocol header shares an include guard with the Wayland client header; include its declarations first so wl_fixes is visible."
  - "The packaged wayland-scanner is dynamic-linked and cannot load its Conan-cache libraries on HMDFS; build a checksum-pinned static copy for CMake code generation."
  - "Build the scanner's expat parser from the same checksum-pinned source so the helper has no Conan-cache shared-library runtime dependency."
  - "The QML plugin is independently selectable in upstream CMake; the C++ interface and protocol plugin build without it."
  - "The upstream GUI smoke program can run with Qt offscreen QPA, but this does not validate a compositor protocol exchange."
  - "The GUI smoke invocation supplies Conan host library paths explicitly because the device's shell does not inherit CMakeDeps runtime paths from the recipe environment context."
  - "Shared-library link flags preserve DT_RPATH so the OHOS loader resolves transitive QtWayland and Wayland dependencies from Conan package folders."
  - "The consumer executable uses the same DT_RPATH setting so the device loader inherits its Conan dependency search paths."
