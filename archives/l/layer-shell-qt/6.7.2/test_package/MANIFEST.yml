# test_package/MANIFEST.yml
# Upstream and consumer test declaration for layer-shell-qt/6.7.2.

package: layer-shell-qt/6.7.2
homepage: https://invent.kde.org/plasma/layer-shell-qt

upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/
    source: layer-shell-qt-6.7.2/tests/
    description: "upstream shell integration tests (require a running Wayland compositor; not run on OHOS)"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer links LayerShellQt library, includes public headers, verifies version header"
    command: "conan create (test_package builds and runs test_layershellqt)"

assertion_count: 1
