# 版本级 manifest — layer-shell-qt 6.7.2
# 遵循 ARCHIVE-SPEC v2.0
version: "6.7.2"
software: "layer-shell-qt"
status: published
build_date: "2026-09-24"
build_system: "cmake"

source:
  url: "https://download.kde.org/stable/plasma/6.7.2/layer-shell-qt-6.7.2.tar.xz"
  sha256: "392cd82742f109452f874d14f5d391a823c7b021bdc2446c0f474b3d1e77b129"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DBUILD_QCH=OFF"
    - "-DCMAKE_CXX_STANDARD=20"
  dependencies:
    - "qtwayland/6.11.1"
    - "qtdeclarative/6.11.1"
    - "wayland/1.22.0"
    - "wayland-protocols/1.36"
    - "libxkbcommon/1.6.0"
    - "qtbase/6.11.1.2"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-xkbcommon-direct-link.patch"
  - "0002-wayland-protocol-include-order.patch"

knowledge_gained:
  - "wayland-protocols 包内 wayland-protocols.pc 硬编码构建机旧 conan 缓存路径（.cache/conan2/p/b/...），ECM FindWaylandProtocols.cmake 经 pkg-config 读取 pkgdatadir 指向失效路径，make 期 'No rule to make target .../staging/xdg-activation/xdg-activation-v1.xml'；修复：generate() 重写 .pc（prefix=真实 package_folder）并 PKG_CONFIG_PATH 前置注入（E537 同类 relocatable 修复）"
  - "Qt 6.11.1 QtWaylandClient 私有头声明 wl_fixes 协议接口，而 wayland/1.22.0 协议头无此接口且两者 include guard 同名（WAYLAND_CLIENT_PROTOCOL_H）；layer-shell-qt 的 qwaylandlayersurface_p.h 先 include <wayland-client.h> 导致 Qt 协议头被 guard 跳过，wl_fixes 未声明编译失败；修复：patch 0002 先 include <QtWaylandClient/private/wayland-wayland-client-protocol.h> 再 include <wayland-client.h>"
  - "layer-shell-qt 产物为 libLayerShellQtInterface.so（CMake target LayerShellQt::Interface，非 LayerShellQt::LayerShellQt），test_package 与 cpp_info.libs 必须用 Interface 名称"
