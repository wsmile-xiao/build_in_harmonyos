adaptation_paths:
  - A

knowledge_gained:
  - "Highway 1.3.0 的 hwy_test 是同一 tarball 内的独立库目标（hwy/tests/test_util.cc + 三个头文件），其 install(TARGETS hwy_test) 与 libhwy-test.pc 都被 if(HWY_ENABLE_TESTS) 门控：交付该子库必须 HWY_ENABLE_TESTS=ON，不是为凑数字放开开关" # knowledge_ref: E599
  - "HWY_TEST_STANDALONE=ON 时上游自带 GTest 兼容运行器支持 --gtest_list_tests；CTest 的 gtest_discover_tests 用例数 = 注册点数 × 运行时支持目标数（OHOS aarch64 实测 T=2），故 N 不能只按 add_test 字面量或源文件数申报" # knowledge_ref: E599
  - "裁剪构建目标（cmake.build(target=[...])）时必须覆盖 install(TARGETS) 全集，否则 cmake --install 对未构建产物报 file INSTALL cannot find；hwy 既是 install 目标也是 hwy_test 的 PUBLIC 依赖" # knowledge_ref: E599
