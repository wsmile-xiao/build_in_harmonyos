# 版本级 manifest — libhwy_test 1.3.0
# 遵循 ARCHIVE-SPEC v3.0

version: "1.3.0"
software: libhwy_test
conan_ref: "libhwy_test/1.3.0"

# published | built | failed | archived
status: built

build_date: "2026-09-20"
build_system: cmake

source:
  url: "https://github.com/google/highway/archive/refs/tags/1.3.0.tar.gz"
  sha256: "07b3c1ba2c1096878a85a31a5b9b3757427af963b1141ca904db2f9f4afe0bc2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "HWY_ENABLE_TESTS=ON（交付面必需：install(TARGETS hwy_test) 与 libhwy-test.pc 都在 if(HWY_ENABLE_TESTS) 内）"
    - "BUILD_TESTING=ON"
    - "HWY_ENABLE_CONTRIB=OFF（contrib 子库不属本包交付面）"
    - "HWY_ENABLE_EXAMPLES=OFF"
    - "HWY_ENABLE_INSTALL=ON"
    - "HWY_FORCE_STATIC_LIBS=ON"
    - "HWY_TEST_STANDALONE=ON（上游自带运行器，不下载 googletest）"
    - "HWY_WARNINGS_ARE_ERRORS=OFF"
    - "CMAKE_INSTALL_LIBDIR=lib"
  dependencies: []
  cc: clang (from profile conf tools.build:compiler_executables)
  cxx: clang++ (from profile conf tools.build:compiler_executables)

patches_applied: []

# 交付面 = 同一 tarball 内的 hwy_test 子库 + 其 PUBLIC 依赖 hwy 核心库
libs:
  - hwy_test
  - hwy

requires: []

