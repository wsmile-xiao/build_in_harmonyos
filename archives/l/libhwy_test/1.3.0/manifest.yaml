  total: 835
  basis: "用例/注册口径最大值（全树上界，最保守）= 393 个 HWY_EXPORT_AND_TEST_P 出现点 × OHOS aarch64 实测目标展开数 T=2 + 49 个 TEST( 出现点 = 835；其中**注册面**（CMakeLists HWY_TEST_FILES）口径为 388×2+48 = 824，另 11 项来自 4 个非注册面文件（hwy/tests/hwy_gtest.h 宏定义 3 处、hwy/contrib/sort/bench_parallel.cc、g3doc/impl_details.md、仅 Bazel 注册的 hwy/abort_header_only_test.cc），逐项归因见 notes.md。同单位候选：注册点 436、测试目标 84、测试源文件 84/60；断言 851 属另一单位仅披露"
