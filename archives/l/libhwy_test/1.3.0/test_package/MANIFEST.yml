# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libhwy_test/1.3.0
homepage: "https://github.com/google/highway"

# 上游测试命令（交付面内用例：上游唯一直接测试 test_util 库自身的用例）
upstream_check_command: "<build>/tests/test_util_test   # HWY_TEST_STANDALONE=1"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "<build>/tests/test_util_test   # 先 --gtest_list_tests 取发现数，再实跑取执行数"

# 上游用例清点（rule4）：主 N 取「用例/注册类」候选口径最大值，全部口径带单位
upstream_test_counts:
  unit: 835
  integration: 0
  other: 0
  total: 835
  basis: "父 tarball 全树上界口径（最保守）：393 个 HWY_EXPORT_AND_TEST_P 出现点 × OHOS aarch64 实测目标展开数 T=2 + 49 个 TEST( 出现点 = 835。其中**注册面**（CMakeLists HWY_TEST_FILES）口径 = 388×2+48 = 824；另 11 项来自 4 个非注册面文件（hwy_gtest.h 宏定义、bench_parallel.cc、g3doc/impl_details.md、仅 Bazel 注册的 abort_header_only_test.cc）。同单位候选：注册点 436、测试目标 84、测试源文件 84/60；断言 851 属另一单位，仅披露不并入 N。同 tarball 兄弟包 archives/l/libhwy/1.3.0 按 ctest -N 申报 801（下界印证）。"
  in_surface_scope: "hwy/tests/test_util_test.cc"
  in_surface_executed: 4
  not_run: 831
  harmony_specific: 15

# 上游实际运行的测试程序（本包交付面内）
upstream_tests:
  - file: hwy/tests/test_util_test.cc
    source: highway-1.3.0/hwy/tests/test_util_test.cc
    description: "上游对 test_util（本包交付库）自身的单元测试：TypeName 命名、随机源、断言工具；经 HWY_TEST_STANDALONE=1 自带运行器执行，发现 4 项、执行 4 项、通过 4 项"
    command: "<build>/tests/test_util_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(hwy REQUIRED CONFIG) + target_link_libraries hwy::hwy_test（经 CMakeDeps 生成）"
    command: "cmake --configure"
  - file: test_package/test_libhwy_test.cpp
    description: "交付的 test_util.h / test_util-inl.h / hwy_gtest.h 公共 API：版本指纹、SupportedTargets、RandomState 确定性、TypeName、RandomFiniteValue、Set/Store、ForAllTypes/ForPartialVectors 枚举面、--gtest_filter 解析（15 项显式 Check）"
    command: "./test_libhwy_test"

# 测试断言总数 (test_libhwy_test.cpp 中 Check() 调用数, 用于质量评估)
assertion_count: 15
