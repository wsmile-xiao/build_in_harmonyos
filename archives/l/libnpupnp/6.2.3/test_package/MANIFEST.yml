# test_package/MANIFEST.yml for libnpupnp 6.2.3
# Upstream and consumer test declaration required by CI L0e.

package: libnpupnp/6.2.3
homepage: "https://framagit.org/medoc92/npupnp"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "libnpupnp-6.2.3.tar.gz"
  source_sha256: "563d2a9e4afe603717343dc4667c0b89c6a017008ac6b52262da17a1e4f6bb96"
  build_system: "Meson"
  test_definition: "test/meson.build registers four executables with meson test(), built with -Dtestmains=true"
  test_command: "meson test -C <build-folder> --print-errorlogs"

upstream_check_command: "meson test -C <build-folder> --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test -C <build-folder> --print-errorlogs"

upstream_tests:
  - test_name: "version and init"
    target: "test_init"
    source: "test/test_init.cpp"
    total: 1
  - test_name: "URL resolution"
    target: "test_url"
    source: "test/test_url.cpp"
    total: 1
  - test_name: "interface listing"
    target: "test_netif"
    source: "test/test_netif.cpp"
    total: 1
  - test_name: "device description parsing"
    target: "test_description"
    source: "test/test_description.cpp"
    total: 1

upstream_test_total: 4
upstream_test_passed: 4
upstream_test_failed: 0

# Consumer checks mirror the upstream programs using only installed public
# headers: 4 version checks (test_init), 10 UpnpResolveURL2 cases
# (test_url, RFC 3986 normal/abnormal examples plus error paths) and
# 4 UpnpInit/UpnpFinish checks (test_init). Each CHECK fails the binary.
test_package_tests:
  - file: test_npupnp.cpp
    scenario: "consumer-api"
    description: "Build and run a Conan consumer that verifies the version string, resolves 10 URLs (including invalid-param/invalid-URL errors) and initializes/finishes the library."
    command: "./test_npupnp"
    assertions: 18

assertion_count: 18
