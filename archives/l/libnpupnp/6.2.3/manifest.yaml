# libnpupnp 6.2.3 manifest (ARCHIVE-SPEC v2.0)
# File: archives/l/libnpupnp/6.2.3/manifest.yaml

version: "6.2.3"
software: "libnpupnp"
status: built
build_date: "2026-09-16"
build_system: meson

source:
  url: "https://www.lesbonscomptes.com/upmpdcli/downloads/libnpupnp-6.2.3.tar.gz"
  sha256: "563d2a9e4afe603717343dc4667c0b89c6a017008ac6b52262da17a1e4f6bb96"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Ddefault_library=shared"
    - "-Dexpat=disabled"
    - "-Dtestmains=true"
  dependencies:
    - "curl/8.15.0"
    - "libmicrohttpd/1.0.1"
    - "meson/1.11.0 (tool_requires)"
    - "pkgconf/3.0.5 (tool_requires)"
  cc: clang
  cxx: clang++
  compiler: clang
  parallelism: 1

patches_applied: []

knowledge_gained:
  - "libnpupnp (npupnp) builds with Meson as C++17; expat is an optional feature kept disabled to avoid an extra dependency"
  - "Upstream tests are four programs under test/, enabled with -Dtestmains=true and run via meson test"
  - "Public headers install to include/npupnp; recipe exposes both include and include/npupnp"
