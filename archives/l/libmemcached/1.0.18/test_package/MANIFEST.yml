# test_package/MANIFEST.yml
# Upstream test declaration file (CI L0e requires this file to exist)
# See docs/TEST_QUALITY_SPEC.md

package: "libmemcached/1.0.18"
homepage: "https://libmemcached.org/"

# Upstream suite is driven by the bundled libtest harness (make check),
# which spawns a real memcached server process and runs the functional
# tests in tests/. A memcached server is not available in the CI sandbox,
# so the upstream suite is not executed there.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/failure.cc
    source: libmemcached-1.0.18/tests
    description: "libtest functional suite: memcached_failure mode behaviors"
    condition: "requires a running memcached server (not available in CI)"
  - file: tests/hashkit_functions.cc
    source: libmemcached-1.0.18/tests
    description: "libtest functional suite: hashkit hashing function outputs"
    condition: "requires a running memcached server (not available in CI)"
  - file: tests/cycle.cc
    source: libmemcached-1.0.18/tests
    description: "libtest functional suite: full set/get/delete cycle against a live server"
    condition: "requires a running memcached server (not available in CI)"

# test_package consumer tests (installed-package verification)
test_package_tests:
  - file: test_package.cpp
    description: "Installed-package consumer smoke test: memcached_create, memcached_server_add, memcached_strerror, memcached_free, and LIBMEMCACHED_VERSION_STRING output"
    command: "conan create (test_package)"

assertion_count: 2
