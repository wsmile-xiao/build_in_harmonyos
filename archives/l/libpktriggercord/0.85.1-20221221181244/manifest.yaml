# 版本级 manifest — libpktriggercord 0.85.1-20221221181244
# 遵循 ARCHIVE-SPEC v2.0/v3.0

version: "0.85.1-20221221181244"
software: "libpktriggercord"

# built = conan-verify 通过但未 upload（发布需另行确认）
status: built
build_date: "2026-09-17"
build_system: "makefile"

source:
  url: "https://github.com/asalamon74/pktriggercord/archive/c1177a4881f363455255866f6f6d8149574e4b35.tar.gz"
  sha256: "3347fdd480666df97753b6da935e8550a00177bc1dbe05a5bcc0ab36220ec51b"
  tar_format: tar.gz
  # 上游无 0.85.1 release 产物（pktriggercord.spec 的 Source URL 实测 404），
  # 使用官方仓库 commit-pinned archive；Makefile:22 VERSION=0.85.01 == 0.85.1

build:
  system: makefile
  # 上游无 configure；等效的 make 命令行变量（见 conanfile.py:_make_vars）
  configure_options:
    - "make cli CFLAGS=\"-O3 -g -Wall -fPIC -Isrc/external/js0n\" LDFLAGS=\"-lm\" PREFIX=<package_folder> -j1"
  # 依赖闭包为空：产物 NEEDED 仅 libc.so
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 Makefile 用 `CFLAGS ?=`：环境里任何 CFLAGS 会整条顶掉默认值并丢掉 `-I$(JSONDIR)`，表现为 `pslr_model.c: fatal error: 'js0n.h' file not found`。必须用 make 命令行变量显式补齐 include 目录（命令行优先于环境）"
  - "同一 `?=` 机制也会吞掉 `LDFLAGS ?= -lm`，需在命令行显式传 LDFLAGS"
  - "conan 2 的 conan.tools.files.copy() 无 root 参数（conan 1 语义），包公共头需逐个显式复制或用不带 ** 的模式匹配顶层"
  - "R47 lang-preflight 的 gradle/maven manifest 判定使用全树文件名集合，而 CMake/meson 使用顶层集合；含 android/ 子工程的 C 库会被误判 mixed → 需按真实适配范围复跑并在 notes 留痕"
  - "init-build 的 copytree 回退路径在 HMDFS 上会因自指符号链接（android/jni/src -> ../..）触发 Symbolic link loop；用 cp -a 预置 .work 再 --no-download 续跑"
  - "pktriggercord-cli 除 --version/--help 外的命令默认 --timeout=0，无相机会永久阻塞，不能作为 CI 测试入口"
