package: libpktriggercord/0.85.1-20221221181244
homepage: "https://github.com/asalamon74/pktriggercord"

# R51 上游测试清点：命令与退出码见本文件 upstream_test_audit 字段；
# 逐项用例结果与 HMBS 标记见 notes.md『验证结果』小节（真实日志由 W3/conan create 产出）。
#   $ find . \( -iname "*test*" -o -iname "*check*" \) -not -path "./win_dlls/*"   -> 无匹配
#   $ grep -niE "^[a-z_-]*(test|check)[a-z_-]*:" Makefile                          -> grep_exit=1（无匹配）
#   $ ls -R | grep -ic 'test'                                                      -> 0
# 上游没有 tests/ 目录、没有 test/check 目标、没有 ctest/pytest 注册（无 configure.ac /
# CMakeLists.txt / meson.build，构建系统为裸 Makefile）。
upstream_tests_exist: false
upstream_check_command: "make -n check  # Makefile 无 check/test 目标（grep_exit=1）"
upstream_test_audit: >
  pktriggercord c1177a48 (Makefile VERSION=0.85.01) 不含任何自动化测试：
  23 个 make 目标里无 test/check（`grep -niE "^[a-z_-]*(test|check)[a-z_-]*:" Makefile`
  退出码 1），无 tests/ 目录，无 CTest/pytest 注册。上游 CI（.travis.yml script 段）
  唯一的功能验证入口是 `./pktriggercord-cli --version`（其后再 wine 跑同一命令），
  其余步骤为 astyle 格式检查与 Windows/Android 打包。配方在 build() 中真实执行该
  CLI 冒烟入口（--version 断言版本号串、--help 断言 Usage 文本），交叉构建时按
  can_run 跳过并上报 skipped。`--status` 等其余 CLI 命令需要真实 Pentax 相机，
  且上游默认 --timeout=0 会永久阻塞（本地实测挂起 350s 后需 kill），不作为测试入口。
upstream_test_in_build: true
upstream_test_command: "make cli && ./pktriggercord-cli --version && ./pktriggercord-cli --help"

upstream_tests:
  - file: .travis.yml
    source: pktriggercord-c1177a48/.travis.yml
    description: "上游唯一功能入口：CLI 版本冒烟（script: ./pktriggercord-cli --version）"
    command: "./pktriggercord-cli --version"

test_package_tests:
  - file: test_libpktriggercord.c
    description: >
      消费者链接并调用打包库的 13 项断言：verbosity 状态机、color space 枚举→字符串、
      drive mode 字符串→枚举、af11 点位展开、exiftool 镜头表命中/未命中、
      user file format 表与越界 NULL、pslr_copyright、pslr_write_log。
      被测程序把逐项与汇总写入 result 文件，test_package/conanfile.py 解析实测计数
      （discovered/passed/failed 不来自硬编码常量），passed!=discovered 时抛 ConanException。
    command: "./test_libpktriggercord <result-file>"

upstream_test_case_count: 2
# test_package 消费侧断言数（EXPECT 计数，运行时由 result 文件解析核验；
# 上游功能入口用例数见上一行，两者不合并计数）
assertion_count: 13
