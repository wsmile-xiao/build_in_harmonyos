# 软件级 manifest — libpktriggercord
# 遵循 ARCHIVE-SPEC v2.0

software: libpktriggercord
display: "libpktriggercord"
description: "Pentax 单反相机遥控（tethering）库 pslr —— pkTriggerCord 的库本体，SCSI-generic 传输"
category: hardware
homepage: "https://pktriggercord.melda.info"
license: LGPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游为裸 Makefile 且不提供任何库产物目标：配方复用 make cli 产出的 -fPIC 目标文件自行 -shared/llvm-ar 生成 libpktriggercord.{so,a}"
    - "Makefile 用 `CFLAGS ?=`，环境中的 CFLAGS 会整条顶掉默认值并丢掉内嵌 js0n 的 `-Isrc/$(JSONDIR)`（真实报错 'js0n.h' file not found）→ 必须用 make 命令行变量补齐"
    - "GUI 目标 pktriggercord 需要 GTK+ 2（pkg-config gtk+-2.0，制品仓无 gtk2），本包范围限定为库故排除；CLI 仅作为上游测试入口在 build() 内执行，不进交付物"
    - "依赖闭包为空：产物 llvm-readelf -d 显示 NEEDED 仅 libc.so；js0n 为树内 vendored，libm 由 sysroot 提供"
    - "USB/相机传输沿用 pslr_scsi_linux.c（ioctl SG_IO + /dev/sg*），OHOS sysroot 提供 <scsi/sg.h>；无真机时不得调用 --status 类命令（默认 timeout=0 永久阻塞）"
  common_dependencies: []

versions:
  "0.85.1-20221221181244":
    status: built
    build_date: "2026-09-17"
