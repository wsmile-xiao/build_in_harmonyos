# 软件级 manifest
# 文件位置: archives/l/libfreehand/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: libfreehand
category: document
description: Library for parsing and converting Macromedia/Adobe FreeHand (.fh) drawing files

# 软件主页
homepage: https://wiki.documentfoundation.org/DLP/Libraries/libfreehand

# 许可证
license: MPL-2.0

# 版本索引
versions:
  - version: "0.1.1"
    status: published
    build_date: "2026-06-25"
    build_system: autotools
    dependencies:
      - librevenge/0.0.5
    patches_count: 17
    functional_test: PASS
    notes: |
      首次编译。修复 6 个编译问题（平台适配 + C++ 编译错误）。
      功能测试通过：3 个命令行工具 (fh2raw/fh2svg/fh2text) 正常运行，
      库 API 链接验证通过，pkg-config 集成完整。
      G0 干净构建验证因 /bin/sh (toybox) 平台限制失败，bash 手动验证通过。

# 当前推荐版本
current_version: "0.1.1"

# 平台支持
platforms:
  - ohos-aarch64

# 功能特性
features:
  - "解析 FreeHand AGD 格式文件 (FreeHand 5+)"
  - "解析 FreeHand FH3 格式文件 (FreeHand 3.x)"
  - "转换为 Raw 格式 (fh2raw)"
  - "转换为 SVG 格式 (fh2svg)"
  - "转换为 Text 格式 (fh2text)"
  - "提供 C++ API (FreeHandDocument::isSupported/parse)"
  - "pkg-config 集成 (libfreehand-0.1.pc)"
