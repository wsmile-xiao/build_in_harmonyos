sources:
  url: "https://cgm.cs.mcgill.ca/~avis/C/lrslib/archive/lrslib-073.tar.gz"
  sha256: "c49a4ebd856183473d1d5a62785fcdfe1057d5d671d4b96f3a1250eb1afe4e83"

patches:
  - patch_file: "patches/0001-runtime-and-cli-conventions.patch"
    patch_description: >-
      Make the two mkstemp() templates honour $TMPDIR instead of hardcoding
      /tmp, answer --version/--help on lrs and lrsnash, exit instead of
      segfaulting when lrs_setup() fails, and give the installed executables a
      relocatable $ORIGIN/../lib RUNPATH.
    patch_type: "portability"
