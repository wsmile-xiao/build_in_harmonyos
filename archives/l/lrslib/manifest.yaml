software: lrslib
display: "lrslib"
description: "多面体顶点/面枚举工具集 — 精确有理数算术的 reverse search（lrs/redund/minrep/fel/lrsnash + liblrs.so）"
category: math
homepage: "https://cgm.cs.mcgill.ca/~avis/C/lrs.html"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游把手写 makefile 的 mkstemp 模板写成字面量 /tmp/lrs_{restart,stdin}XXXXXX；平台沙箱 /tmp 只读 ⇒ 溢出重启整条丢失、且随后解引用 NULL 崩溃（rc=139）。补丁改为 $TMPDIR 优先、/tmp 兜底。"
    - "上游 install 把工具放 bin/、库放 lib/，但两条可执行文件链接规则没有 RUNPATH 挂钩 ⇒ 装完只能靠 LD_LIBRARY_PATH。补丁加 RUNPATHFLAGS ?= -Wl,-rpath,'$$ORIGIN/../lib'。"
    - "上游 lrs/lrsnash 把每个参数当输入文件名，--version/--help 退出码非 0 ⇒ L2 对全部 5 个可执行文件判红。补丁补上这两个查询（rc=0）。"
    - "lrslib.h 经 ARITH 选中后端后 #include \"gmp.h\" ⇒ 必须 requires(\"gmp/6.3.0\", transitive_headers=True)，否则只有消费者编译红。"
    - "上游 install 规则依赖 install -t，平台没有 install 命令 ⇒ package() 用 copy()/os.symlink() 复刻布局。"
  common_dependencies:
    - gmp/6.3.0

versions:
  "0.73":
    status: built
    build_date: "2026-09-20"
    notes: >-
      上游 release 7.3（lrslib.h 的 VERSION = "v.7.3_2024.5.30"）。手写 makefile，
      只有 all-shared 目标（共享库 + lrs/lrsnash）。上游回归面是数据驱动的
      ine/test/*.ine（30 个输入问题），已在 build() 内全部真实运行。
