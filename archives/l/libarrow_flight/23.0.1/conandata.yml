sources:
  "23.0.1":
    url: "https://archive.apache.org/dist/arrow/arrow-23.0.1/apache-arrow-23.0.1.tar.gz"
    sha256: "bd09adb4feac11fe49d1604f296618866702be610c86e2d513b561d877de6b18"
patches:
  "23.0.1":
    - patch_file: "patches/skip_gtest_cxx_standard_check.patch"
      patch_description: "Skip GTestAlt C++ standard check (try_compile fails in OHOS cross-compile)"
      patch_type: "portability"
    - patch_file: "patches/fix_thirdparty_toolchain.patch"
      patch_description: "Fix ThirdpartyToolchain: create Boost::disable_autolinking target and replace $<TARGET_FILE:GTest::gtest> with -lgtest in pkg-config"
      patch_type: "portability"
    - patch_file: "patches/skip_filesystem_example.patch"
      patch_description: "Use STATIC instead of MODULE for arrow_filesystem_example (avoids -fPIC requirement on CI pre-built static deps)"
      patch_type: "portability"
    - patch_file: "patches/preload_openssl_config_for_grpc.patch"
      patch_description: "Preload Conan openssl-config.cmake (openssl::openssl target) before gRPC resolution - registry gRPCTargets.cmake references that target"
      patch_type: "portability"
    - patch_file: "patches/fix_flight_sql_sqlite_include.patch"
      patch_description: "Propagate SQLite3_INCLUDE_DIRS to Flight SQL test targets (registry SQLite3 lives outside default header search path)"
      patch_type: "portability"
