# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libcpucycles/20260625
homepage: "https://cpucycles.cr.yp.to"

# 上游测试命令：libcpucycles 无正式测试套件
# （无 test/ tests/ 目录，无 make check/test 目标，无 CI，README 无测试说明；
#   command/cpucycles-info 是信息工具不是测试；try-*.c 是 configure 的
#   compile-only 探测（不运行 target 二进制），不计入正式测试）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 libcpucycles 公开 API)
test_package_tests:
  - file: test.c
    description: "消费者测试: version/implementation/persecond/counter 单调性/一致性"
    command: "./test_cpucycles"

# 测试断言总数：
#   1 version                       6 counter-monotonic
#   2 implementation-nonnull        7 persecond-stable
#   3 implementation-stable         8 persecond-plausible
#   4 implementation-known          9 tracesetup-noop-after-init
#   5 counter-increases            10 persecond-positive
# （跨 nanosleep 的 persecond-consistency/after>=maxv 已删除：per-core
#   计数器迁核跳变不在 API 保证内，见 notes.md 2.1）
assertion_count: 10
