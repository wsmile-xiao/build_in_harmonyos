# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 configure 是 python3 脚本，全部探测为 compile-only（try-*.c 只编译不运行），交叉编译安全，无需任何 patch"
  - "后端选择 100% 在运行时由 cpucycles_init() 完成（sigsetjmp 捕获 SIGILL/SEGV 逐后端实测），构建期无需也不能探测硬件能力"
  - "OHOS 实机选择 arm64-pmc 后端（MRS PMCCNTR_EL0 用户态可访问），精度 1-2 cycles；perf_event_open 被内核禁用（arm64-perfpmc/default-perfevent SKIP）"
  - "上游 scripts-build/install 在 OHOS hmfs 上失败：tempfile.TemporaryDirectory(dir=lib) 创建于 setgid 目录（umask 077 + setgid → mode 0700 属主 20001006）→ copy2 PermissionError，改从 build/arm64/package/ 直接收集（install 无编译动作，语义等价）"
