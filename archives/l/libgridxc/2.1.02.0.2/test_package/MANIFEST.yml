package: "libgridxc/2.1.02.0.2"
homepage: "https://gitlab.com/siesta-project/libraries/libgridxc"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests_exist: true

upstream_tests:
  - id: "libgridxc_test1"
    source: "Testers/test1.f90"
    command: "ctest -R libgridxc_test1"
    description: "LDA/GGA analytic versus finite-difference consistency across 18 functionals"
  - id: "libgridxc_test2"
    source: "Testers/test2.F90"
    command: "ctest -R libgridxc_test2"
    description: "Radial grid exchange-correlation reference comparison"
  - id: "libgridxc_test3"
    source: "Testers/test3.F90"
    command: "ctest -R libgridxc_test3"
    description: "Periodic cell exchange-correlation path without MPI"
  - id: "libgridxc_test4"
    source: "Testers/test4.F90"
    command: "ctest -R libgridxc_test4"
    description: "Periodic cell extended reference path without MPI"
  - id: "libgridxc_test6"
    source: "Testers/test6.f90"
    command: "ctest -R libgridxc_test6"
    description: "Additional grid utility coverage registered by CMake"
  - id: "libgridxc_test_libxc"
    source: "Testers/test_libxc.F90"
    command: "ctest -R libgridxc_test_libxc"
    description: "libxc interface comparison (registered only when WITH_LIBXC=ON; recipe keeps upstream default OFF, not executed in this configuration)"
  - id: "libgridxc_test_libxc2"
    source: "Testers/test_libxc2.F90"
    command: "ctest -R libgridxc_test_libxc2"
    description: "libxc interface extended path (registered only when WITH_LIBXC=ON; recipe keeps upstream default OFF, not executed in this configuration)"
  - id: "libgridxc_test_match"
    source: "Testers/test_match.F90"
    command: "ctest -R libgridxc_test_match"
    description: "libxc reference matching (registered only when WITH_LIBXC=ON; recipe keeps upstream default OFF, not executed in this configuration)"
  - id: "libgridxc_test_hse06"
    source: "Testers/test_hse06.F90"
    command: "ctest -R libgridxc_test_hse06"
    description: "HSE06 via libxc (registered only when WITH_LIBXC=ON; recipe keeps upstream default OFF, not executed in this configuration)"

test_package_tests:
  - id: "lda-contract"
    source: "lda_contract.f90"
    command: "sh test.sh <bindir> (runs lda_contract, asserts GRIDXC_TEST lda_contract PASS)"
    description: "Init plus LDA/PZ set/get round-trip and single-point ldaxc negativity check"
  - id: "gga-contract"
    source: "gga_contract.f90"
    command: "sh test.sh <bindir> (runs gga_contract, asserts GRIDXC_TEST gga_contract PASS)"
    description: "Init plus GGA/PBE set and single-point ggaxc finite negative-energy check"

test_counting:
  upstream_independent_total: 9
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 15
upstream_test_total: 9
upstream_test_count_method: "ctest_entries"
