  issue: "pending assignment (no libgav1 issue reference found)"
  branch: "feat/libgav1-0.20.0"
  source_mirror_note: "PR CI runs #50298, #52414, #53532 and #59757 failed inside source() because chromium.googlesource.com is unreachable from the build network (git clone: connect timeout at port 443). Upstream publishes no byte-stable archive, so the recipe now fetches Debian's orig tarball of upstream v0.20.0 (SHA-256 published in the PGP-signed libgav1_0.20.0-2.dsc) with two CN mirrors as fallback. The archive tree was verified byte-identical to upstream v0.20.0 (tag object 6c03275c -> commit c05bf9be, 387 files, 0 differences); see reports/source-verification.md."
  review_decoder_init: "v0.20.0 src/gav1/decoder.h declares 'StatusCode Init(const DecoderSettings* settings);', so test_package keeps decoder.Init(&settings)."
  mirror_source_device_run: "Re-validated on the OHOS device after the source switch: run currentUser-0.20.0-libgav1-0.20.0-097f5d5f38-conan-20260926-181022-54835 downloaded the Debian archive (conan: 'Sources correctly downloaded from https://deb.debian.org/debian/pool/main/libg/libgav1/libgav1_0.20.0.orig.tar.xz'), built lib/libgav1.a plus 7 include/gav1 headers, compiled and ran test_package, and reported L0=pass, L1=pass, L2=skip (no bin/), L4=pass, L5=pass, R34 negative test pass, exit-code=0. The pre-download pre-cache step was unavailable in that runner (no curl for the CI subprocess), so the run exercised the same path as the PR CI worker: conan downloads directly from the reachable mirror."
  neon_processor_note: "On HarmonyOS CMake resolved CMAKE_SYSTEM_PROCESSOR to the literal string 'unknown', so upstream's cmake/libgav1_cpu_detection.cmake (it matches '^arm|^aarch64') never enabled NEON: the library was built with LIBGAV1_ENABLE_NEON=0 and the tests/libgav1_tests.cmake target common_neon_test was not registered, giving 57 instead of 58 applicable tests. generate() now fills the toolchain generic_system block for OHOS (cmake_system_name=OHOS, cmake_system_processor=aarch64), the same workaround libmatio/libaec/libnghttp2 use in this repository. Verified on device: CMakeSystem.cmake reports CMAKE_SYSTEM_PROCESSOR 'aarch64', the build defines LIBGAV1_ENABLE_NEON=1, compiles 25 NEON objects (previously 0), registers common_neon_test as test #4, and the upstream suite passes 58/58 (100%, 43.11 s)."
