# Source declaration for libgav1 0.20.0.
#
# Upstream publishes no byte-stable archive (Gitiles .tar.gz output is not
# reproducible), and chromium.googlesource.com is unreachable from the build
# network, so an official Git checkout cannot produce this package in CI:
# PR CI runs #50298, #52414, #53532 and #59757 all failed inside source() with
# "Failed to connect to chromium.googlesource.com port 443".
#
# The primary source is therefore Debian's upstream orig tarball for 0.20.0.
# It carries the upstream v0.20.0 tree byte-for-byte and its SHA-256 is
# published in the PGP-signed libgav1_0.20.0-2.dsc. The two mirror_urls are
# independent mirrors of the same Debian archive and serve identical bytes.
# Evidence: reports/source-verification.md.
#
# Upstream provenance of the tree inside the tarball (informational, not
# fetched; kept without a URL scheme so the CI pre-download step does not try
# to curl the unreachable upstream host):
#   repo   chromium.googlesource.com/codecs/libgav1.git
#   tag    v0.20.0
#   commit c05bf9be660cf170d7c26bd06bb42b3322180e58
sources:
  url: "https://deb.debian.org/debian/pool/main/libg/libgav1/libgav1_0.20.0.orig.tar.xz"
  sha256: "953f98a5147f556f358ef986601fda7804cfaaa634302aa9b842fea889aa7e6c"
  mirror_urls:
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/libg/libgav1/libgav1_0.20.0.orig.tar.xz"
    - "https://mirrors.aliyun.com/debian/pool/main/libg/libgav1/libgav1_0.20.0.orig.tar.xz"
