software: libomptarget
display: "libomptarget - LLVM OpenMP Offloading Target Runtime"
description: "libomptarget is the OpenMP offloading target runtime library from the LLVM openmp project. It provides the host-side runtime (libomptarget.so) and target plugins (e.g. aarch64 generic-ELF64) used by clang-generated target regions."
category: library
homepage: "https://openmp.llvm.org"
license: Apache-2.0 WITH LLVM-exception
build_system: cmake

ohos_adaptation:
  key_points:
    - "Built standalone (OPENMP_STANDALONE_BUILD=ON) from the official openmp-18.1.8.src.tar.xz"
    - "Consumes the published llvm/20.1.0 package for find_package(LLVM) (no llvm/18.1.8 published; sources verified compatible)"
    - "Injects Platform/HarmonyOS.cmake so CMake recognises the HarmonyOS system and emits shared-library SONAMEs"
    - "aarch64 generic-ELF64 offloading plugin built via dlopened-libffi path (no system libffi needed)"
    - "Disables DeviceRTL (GPU bitcode) which requires clang -fopenmp-targets and an offload-capable GPU"
    - "libomp runtime bundled with VERSION/SOVERSION so consumers link libomp.so.5 by SONAME"
  common_dependencies:
    - llvm

versions:
  "18.1.8":
    status: published
    build_date: "2026-09-17"
    conan_ref: "libomptarget/18.1.8"
    note: "HarmonyOS PC aarch64 adaptation; depends on llvm/20.1.0 (18.1.8 not published, verified compatible)"
