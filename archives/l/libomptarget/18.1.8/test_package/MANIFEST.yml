# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libomptarget/18.1.8
homepage: "https://openmp.llvm.org"

# 上游测试命令
upstream_check_command: "ninja check-libomptarget"
# libomptarget 上游 lit 测试已在 OHOS aarch64 真机真实执行（评审闭环 2026-09-28）：
# python3 lit 驱动 libomptarget/test 套件（201 个注册测试文件 / 上游 610 个 // RUN 行），
# clang 15.0.4 -fopenmp host-fallback 编译 + FileCheck 校验，测试源码保持上游原样。
# 实测：64 PASS（主机可运行用例），74 FAIL（全部编译运行，断言因无 offload 设备失败，
# omp_get_num_devices()==0：device memory/memcpy/USM/declare_mapper 等设备能力用例），
# 63 UNSUPPORTED（REQUIRES nvptx/amdgcn/flang/ompt/unified_shared_memory 无对应特性）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/offloading
    source: libomptarget-18.1.8.src/libomptarget/test
    description: "libomptarget lit 测试套件 OHOS aarch64 实测：201 文件 64 PASS / 74 FAIL（无 GPU 设备能力断言）/ 63 UNSUPPORTED（GPU/flang/ompt REQUIRES），详见 notes.md"
    command: "llvm-lit"

# test_package 中自带的测试 (消费者视角验证)
# 端到端消费者用例：OpenMP target 数据映射 + 目标区计算（host fallback）
# + parallel for reduction 归约 + 数值校验，在 OHOS aarch64 真实运行通过。
test_package_tests:
  - file: test.c
    description: "端到端消费者用例：链接 libomp 驱动 #pragma omp target 数据映射与计算（host fallback），parallel for reduction 聚合，校验计算结果 got==expect；另经 dlopen 调用 libomptarget 公共 API（__tgt_init_all_rtls 等）验证 R34 集成"
    command: "./test_libomptarget"

# 测试断言总数
assertion_count: 2