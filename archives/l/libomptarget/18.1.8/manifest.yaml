# 版本级 manifest — libomptarget 18.1.8

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "18.1.8"

# 软件名
software: libomptarget

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
# cmake | autotools | makefile | meson | custom
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/openmp-18.1.8.src.tar.xz"

  # 源码校验和（官方 tarball 本地实算）
  sha256: "60ed57245e73894e4a2a89b15889f367bd906abfe6d3f92e1718223d4b496150"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=HarmonyOS"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DOPENMP_STANDALONE_BUILD=ON"
    - "-DOPENMP_ENABLE_LIBOMPTARGET=ON"
    - "-DLIBOMPTARGET_BUILD_DEVICERTL_BCLIB=FALSE"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - llvm/20.1.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-runtime-src-kmp.h.patch"
  - "0003-runtime-src-CMakeLists.txt.patch"
  - "0004-plugins-aarch64-CMakeLists.txt.patch"
  - "0005-JIT.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.1.2 无 Platform/HarmonyOS 模块，需注入 include(Platform/Linux) 的 HarmonyOS.cmake 到 CMAKE_MODULE_PATH，否则 SONAME 缺失导致 DT_NEEDED 用构建树相对路径"
  - "libomp standalone 构建需显式 VERSION/SOVERSION，否则消费者链接到构建树相对路径"
  - "plugins-nextgen 各插件按 CMAKE_SYSTEM_NAME 匹配平台，HarmonyOS 需扩展匹配正则"
  - "libomptarget 18.1.8 源码兼容 LLVM 20.1.0 头文件/库（仅 JIT.cpp 需 API 适配）"
