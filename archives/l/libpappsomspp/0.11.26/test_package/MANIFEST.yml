# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libpappsomspp/0.11.26
homepage: https://forgemia.inra.fr/pappso/pappsomspp

# 上游测试命令 (用于 make -n check 分析)
# 上游用 CTest + Catch2：cmake -DMAKE_TESTS=1 后 make test / ctest
upstream_check_command: "ctest --output-on-failure  # 需要 -DMAKE_TESTS=1 配置"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

# 上游 add_test 注册的测试程序
# catch2-only-tests：41 个测试源文件编成单二进制（60 TEST_CASE / 1484 断言实跑全过，
# 含 patch 0004 平台容差后的 51/46 两段守卫链）
# catch2-only-memory：2 个内存测试源文件（上游独立 add_executable，未 add_test 注册，
# 不计入 N；tims 测试需 analysis.tdf Bruker 数据文件，上游 tarball 未携带）
upstream_tests:
  - file: tests/catch-only-tests-main.cpp + 40 个 test_*.cpp
    source: pappsomspp-upstream-0.11.26.tar.gz/tests/
    description: "Catch2 主测试二进制（41 源文件合编）：60 TEST_CASE / 1484 断言，本机 OHOS aarch64 实跑 All tests passed"
    command: "ctest --output-on-failure  # 1 个 ctest 条目驱动 60 TEST_CASE"
  - file: tests/memory/test_tandemwrapperrun.cpp + test_timsdata_reader_memory.cpp
    source: pappsomspp-upstream-0.11.26.tar.gz/tests/memory/
    description: "内存泄漏检查二进制（上游未注册 add_test，不参与 N 口径；tims 测试需 analysis.tdf Bruker 专有数据，tarball 不带）"
    command: "./catch2-only-memory  # 环境缺 .tdf 数据，不适用"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pappsomspp.cpp
    description: "core 公共 API 消费者测试：氨基酸质量（上游 LA 参考值）/肽段参考值（上游 test_peptide.cpp 同款）/MzRange 包含排除"
    command: "./test_pappsomspp"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 Catch2 实跑：60 TEST_CASE / 1484 assertions（100% 通过，含 0004 平台容差）
# test_package：8 check() 断言
assertion_count: 1492
