# conandata.yml — l2tpns 2.5.0
#
# Canonical upstream: https://code.ffdn.org/l2tpns/l2tpns (git), version
# 2.5.0 = commit 372e5c0d29de77f5958fd55b81801f58e9eb52e0.
#
# Archive pinning note (implement-policy: official URL first, documented
# fallback): the official cgit archive URL
#   https://code.ffdn.org/l2tpns/l2tpns/archive/372e5c0d29de77f5958fd55b81801f58e9eb52e0.tar.gz
# is unreachable from the porting networks — the investigation network saw
# 3x60s connect timeouts (2026-09, Scout) and the OHOS device itself timed
# out after 20s (curl(28), 2026-09-23). The pinned archive is therefore the
# Debian pool `orig` tarball, which is the UNMODIFIED upstream `git archive`
# for the commit above: the tarball top-level directory is
# l2tpns-2.5.0-372e5c0d29de77f5958fd55b81801f58e9eb52e0 (no repacking) and
# the sha256 below matches the one published in the Debian .dsc for this
# version. SHA256 verified by download on the OHOS device on 2026-09-23.
# Only the working URL is listed; CI appends mirror fallback automatically
# (R39), and no gh-proxy/manual mirror prefix is used (PF7).

sources:
  url:
    - "https://deb.debian.org/debian/pool/main/l/l2tpns/l2tpns_2.5.0.orig.tar.gz"
  sha256: "6b022b2e36642e676b16f8f2cccff3c199acb307e56bca09cb6e9c6fb0964e18"

patches:
  - patch_file: "patches/0001-Makefile-ohos-build.patch"
    patch_description: "Makefile: append $(EXTRA_CFLAGS) to CFLAGS (recipe escape hatch) and define -DHAVE_EPOLL directly (upstream probes `uname -r | perl`, fragile on perl-less build hosts)"
    patch_type: "portability"
  - patch_file: "patches/0002-fcntl-include.patch"
    patch_description: "cli.c/cluster.c: include <fcntl.h> for F_GETFL/F_SETFL/O_NONBLOCK/O_DIRECTORY — glibc leaks these through <sys/file.h>, musl does not"
    patch_type: "portability"
  - patch_file: "patches/0003-msghdr-designated-init.patch"
    patch_description: "l2tpns.c: use designated initializers for struct msghdr — OHOS musl declares `int msg_iovlen` plus an int pad member on 64-bit, so the upstream positional initializer feeds NULL to the pad member"
    patch_type: "portability"
  - patch_file: "patches/0004-ohos_compat.h.patch"
    patch_description: "add ohos_compat.h (force-included via EXTRA_CFLAGS=-include): pre-define _UAPI_LINUX_SOCKET_H/_LINUX_SYSINFO_H/__UAPI_DEF_ETHHDR so sanitized uapi headers skip blocks duplicating musl types, and provide __kernel_sa_family_t + __packed (E119 family, cf. batctl)"
    patch_type: "portability"
