# l2tpns/2.5.0 test_package 上游测试声明
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在

package: l2tpns/2.5.0
homepage: "https://code.ffdn.org/l2tpns/l2tpns"

# 上游测试审计（结论：上游无测试套件，按 no_tests 处理）：
# 1) 根 Makefile（2.5.0，commit 372e5c0d29de77f5958fd55b81801f58e9eb52e0）：
#    目标仅 all/programs/plugins/doc/clean/depend/install/dist，无 check/test
#    目标；`all` 只递归 docs/（pandoc 缺失时为空 no-op）。
# 2) .gitlab-ci.yml：唯一构建阶段步骤为 `bash scripts/ci-test.sh`（另有
#    GitLab 模板 SAST/Secret-Detection，非本项目测试）。
# 3) scripts/ci-test.sh：apt 安装依赖后 `make install`（需 root、写系统路径）
#    再跑 `/usr/sbin/l2tpns -v || true`（注意 `|| true`），然后从
#    /var/log/l2tpns（syslog）grep 版本号与 git tag 比对 —— 该断言需要真实
#    启动守护进程：root + /dev/net/tun + 内核 L2TP 支持，OHOS PC（HongMeng
#    内核）在真机实测中不可用：/proc/net/protocols 无 l2tp 条目、
#    /proc/net/genetlink 不存在，故降级为 test_l2tpns.c 对二进制内嵌
#    "L2TPNS version 2.5.0" 的静态扫描，语义一致（同一 VERSION 宏）。
# 4) test/：bounce.c、generateload.c、radius.c、ping-sweep —— 负载模拟工具，
#    有独立 test/Makefile，但根 Makefile 从不递归该目录；且需要真实 LNS/LAC
#    拓扑与对端流量才可运行，不是自动化测试套件。
# 因此 HMBS_UPSTREAM_TEST_RESULT 取 status=no_tests（test_package test() 每轮
# 复发；包缓存命中时主配方 build() 不执行，靠 test_package 保证标记必现）。
upstream_tests_exist: false
upstream_test_audit: "审计 l2tpns 2.5.0 上游：1) 根 Makefile 无 check/test 目标，all 仅递归 docs（pandoc 缺失时 no-op）；2) .gitlab-ci.yml 仅运行 scripts/ci-test.sh；3) ci-test.sh 为 make install + l2tpns -v 守护进程启动版探测（需 root/TUN/内核 L2TP；真机实测：/proc/net/protocols 无 l2tp 条目、/proc/net/genetlink 不存在，TUN/PPP 叠加权限与节点可达性限制）+ syslog 版本比对；4) test/ 为独立负载模拟工具（bounce/generateload/radius/ping-sweep），根构建从不递归且需真实 LNS/LAC 拓扑。上游确实无测试套件。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_l2tpns.c
    description: "OHOS 产物断言（本轮强制新增用例，不复用上游用例）：bin/l2tpns 内嵌 VERSION 2.5.0（上游 ci-test.sh 版本断言的静态降级）；引用 epoll API（-DHAVE_EPOLL 补丁分支真实生效）；无 libdl.so 依赖（musl 下 l2tpns.LIBS 去 -ldl 生效）；lib/l2tpns 下 8 个插件均为 ELF 共享对象（ET_DYN）；bin/nsctl 为 ELF 可执行。TAP 输出，失败即非零退出。"
    command: "test_l2tpns <package_folder>"
  - file: conanfile.py (test())
    description: "OHOS 执行门禁：`l2tpns --version` 经 getopt 非法选项路径打印 usage 并以 0 退出（在任何守护进程初始化之前），证明二进制在 OHOS 真机可加载可执行——不需要 root/TUN/内核 L2TP（运行期降级：不真启守护进程）；另以 informational 方式记录 nsctl --version 退出码（需活动控制端点，预期非零，不断言）。"
    command: "l2tpns --version"

assertion_count: 6
