# 版本级 manifest — l2tpns 2.5.0
# 文件位置: archives/l/l2tpns/2.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-version.yaml

version: "2.5.0"

software: "l2tpns"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-09-23"
build_system: "makefile"

source:
  url: "https://deb.debian.org/debian/pool/main/l/l2tpns/l2tpns_2.5.0.orig.tar.gz"
  sha256: "6b022b2e36642e676b16f8f2cccff3c199acb307e56bca09cb6e9c6fb0964e18"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "l2tpns.LIBS 覆盖为 libcli.a 绝对路径（显式静态链接闭包；同时去掉 musl 自带 dlopen 的 -ldl）"
    - "EXTRA_CFLAGS=-include ohos_compat.h（uapi/musl 头冲突 shim，E119 家族）"
    - "INCLUDES 追加 libcli 头目录（命令行覆盖，保留 DEFINES）"
    - "CC 取自 Conan tools.build:compiler_executables（R33，带 PATH 回退）"
    - "-j1（R9：鸿蒙 SELinux 禁止用户进程创建 FIFO，GNU make 的 jobserver 依赖 FIFO 传递并行令牌，并行 make 会卡死或报错，统一串行构建）"
  dependencies:
    - "libcli/1.10.7（静态，-lcli：守护进程 CLI；插件 dlopen 仅依赖 libc）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Makefile-ohos-build.patch（EXTRA_CFLAGS 钩子 + 直接 -DHAVE_EPOLL，替换 uname|perl 探测）"
  - "0002-fcntl-include.patch（cli.c/cluster.c 补 <fcntl.h>，musl 不经 sys/file.h 透传）"
  - "0003-msghdr-designated-init.patch（struct msghdr 指定初始化器，OHOS musl int msg_iovlen+pad 布局）"
  - "0004-ohos_compat.h.patch（uapi/musl 类型冲突 shim：_UAPI_LINUX_SOCKET_H/_LINUX_SYSINFO_H/__UAPI_DEF_ETHHDR + __kernel_sa_family_t/__packed）"

knowledge_gained:
  - "l2tpns 上游无测试套件：根 Makefile 无 check/test；上游 CI 仅 scripts/ci-test.sh（make install + 守护进程启动版本探测）；test/ 为需真实 LNS/LAC 拓扑的负载模拟工具，根构建从不递归"
  - "make install 硬编码 install -o root -g root、gzip man、mknod /dev/net/tun —— 绝不执行，逐产物 copy 交付（E108）"
  - "l2tpns -v 是调试标志而非版本打印：进程会继续守护进程初始化；安全探测走非法选项 usage 路径（l2tpns --version → exit 0，init 之前返回）"
  - "OHOS musl struct msghdr 为 int msg_iovlen + int pad（64 位），glibc 风格位置初始化器会整体错位；指定初始化器可移植"
  - "OHOS SDK 净化版 uapi 头与 musl 头三类重复（sysinfo/socket/ethhdr），guard 名各不相同（_LINUX_SYSINFO_H 无 UAPI 前缀；ethhdr 走 __UAPI_DEF_ETHHDR 开关）；if_pppox.h 使用未定义的 __packed"
