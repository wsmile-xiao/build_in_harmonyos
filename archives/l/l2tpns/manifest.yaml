software: l2tpns
display: "l2tpns"
description: "高性能 L2TP 网络服务器（LNS）：l2tpns 守护进程、nsctl 控制工具与 8 个 CLI 插件"
category: application
homepage: "https://code.ffdn.org/l2tpns/l2tpns"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "原生 Makefile 工程；CC/INCLUDES/LDFLAGS/l2tpns.LIBS/EXTRA_CFLAGS 全部经 make 命令行注入，不改源码构建逻辑"
    - "libcli 静态链接（显式 .a 绝对路径），产物 DT_NEEDED 仅 libc.so，无 rpath；l2tpns.LIBS 去 -ldl（musl 自带 dlopen）"
    - "ohos_compat.h 解决 SDK 净化版 uapi 头与 musl 头三类类型重复（E119 家族）+ if_pppox.h 未定义的 __packed"
    - "cli.c/cluster.c 补 <fcntl.h>（glibc 透传、musl 不透传）；struct msghdr 改指定初始化器（musl int msg_iovlen+pad 布局）"
    - "绝不执行 make install（install -o root -g root、gzip、mknod，E108）；逐产物 copy 交付 l2tpns/nsctl/8 插件"
    - "上游无测试套件；test_package 新增 OHOS 产物断言（VERSION/epoll/无 libdl/插件 ELF）+ usage 路径执行门禁（不真启守护进程；真机实测无 L2TP 内核接口，TUN 节点可达性受限）"
  common_dependencies:
    - "libcli/1.10.7"

versions:
  "2.5.0":
    status: built
    build_date: "2026-09-23"
    source_url: "https://deb.debian.org/debian/pool/main/l/l2tpns/l2tpns_2.5.0.orig.tar.gz"
