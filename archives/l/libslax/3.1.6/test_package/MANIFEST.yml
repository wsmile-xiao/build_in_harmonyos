package: libslax/3.1.6
homepage: "https://github.com/Juniper/libslax"

upstream_check_command: "make -C tests/core tests"
upstream_test_in_build: false
upstream_test_command: "make -C tests/core tests"

upstream_tests:
  - name: "core"
    source: "release tests/core/*.slax"
    description: "libslax upstream core regression suite; 80 cases executed on HarmonyOS"
    command: "make -C tests/core tests"

test_package_tests:
  - file: test.c
    description: "消费者测试：编译、链接并运行 libslax 公共 API 探针"
    command: "conan test (compile/link test_package + run)"

assertion_count: 82
