sources:
  url:
    - "https://gh-proxy.com/https://github.com/Juniper/libslax/releases/download/3.1.6/libslax-3.1.6.tar.gz"
    - "https://github.com/Juniper/libslax/releases/download/3.1.6/libslax-3.1.6.tar.gz"
  filename: "libslax-3.1.6.tar.gz"
  sha256: "e876068b343c54c40872fdb3c06749dd9cc4826f43fe4bd8247743070d51d9fb"

patches:
  - patch_file: "patches/0001-config-guess-harmonyos.patch"
    patch_description: "Recognize HarmonyOS as linux-ohos in GNU config.guess/config.sub"
  - patch_file: "patches/0002-preserve-linker-flags.patch"
    patch_description: "Preserve externally supplied linker flags on Linux and HarmonyOS"
  - patch_file: "patches/0003-harmonyos-portability.patch"
    patch_description: "Add HarmonyOS fallbacks for getpass and resolver state"
  - patch_file: "patches/0004-glob-portability.patch"
    patch_description: "Guard optional glob extensions unavailable on HarmonyOS"
  - patch_file: "patches/0005-libxml2-node-stack-compat.patch"
    patch_description: "Provide local node stack helpers for libxml2 2.15 hidden internals"
  - patch_file: "patches/0006-relocatable-metadata.patch"
    patch_description: "Make slax-config and libslax pkg-config metadata relocatable"
  - patch_file: "patches/0007-portable-long-long-format.patch"
    patch_description: "Use portable long long printf format for numeric sequences"
  - patch_file: "patches/0008-portable-hex-format.patch"
    patch_description: "Use portable unsigned long long hexadecimal printf format"
  - patch_file: "patches/0009-self-contained-public-header.patch"
    patch_description: "Use forward-declared libxml2 structure types in the public header"
