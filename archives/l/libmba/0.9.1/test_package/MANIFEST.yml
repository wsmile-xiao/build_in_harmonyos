# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmba/0.9.1
homepage: "https://www.ioplex.com/~miallen/libmba/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libmba 无 check 目标；上游测试套件位于 tcase/，由 tmba 驱动
upstream_check_command: "make -C tcase && ./tcase/tmba"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本地实测 2026-09-07）
# 实测结果：23 个套件 pass，4 个套件（SvsemCounter/SharedAdts/SvcondProdCons/OpenCre）
# 因平台 seccomp 拦截 SysV 信号量系统调用（semget → SIGSYS）无法运行（E051 类平台限制），
# 非当前库源码缺陷；详见 notes.md 与 reports/test-report.md
upstream_tests:
  - file: tcase/tmba
    source: libmba-0.9.1/tcase
    description: "上游测试驱动（23/27 套件通过：linkedlist/hashmap/csv/cfg/pool/varray/stack/path/suba/text/diff/bitset/msgno/eval/hexdump 等；4 个 SysV 信号量相关套件被平台 SIGSYS 拦截）"
    command: "./tcase/tmba"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：linkedlist/varray/csv 真实 API 调用"
    command: "./test_libmba"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
