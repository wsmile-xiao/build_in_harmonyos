# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsir/2.2.6
homepage: "https://github.com/aremmell/libsir"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -j1 SHELL=/bin/sh all && LD_LIBRARY_PATH=./build/lib ./build/bin/sirtests && LD_LIBRARY_PATH=./build/lib ./build/bin/sirtests --perf && LD_LIBRARY_PATH=./build/lib ./build/bin/sirtests++"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (R02 普查：sirtests 注册 37 条（默认运行 36 + performance 1），sirtests++ 8 条；去重合计 45 条，全部实际运行通过)
upstream_tests:
  - file: tests/tests.c
    source: libsir-2.2.6/tests/tests.c
    description: "libsir C 测试套装 (sirtests, 注册 37 条: 默认运行 36 + performance --perf 1, 全部 PASS)"
    command: "./build/bin/sirtests"
  - file: tests/tests++.cc
    source: libsir-2.2.6/tests/tests++.cc
    description: "libsir C++ 测试套装 (sirtests++, 8 条: init-cleanup-raii/manual/error-handling/exception-handling/format-std/boost/fmt/std-iostream, 全部 PASS)"
    command: "./build/bin/sirtests++"

# test_package 中自带的测试 (消费者视角验证, R34: 实质调用库 API)
test_package_tests:
  - file: test.c
    description: "消费者测试: sir_makeinit/sir_init/sir_isinitialized/sir_getversionstring/sir_debug/sir_notice/sir_cleanup"
    command: "./test_libsir"

# 测试断言总数 (上游 45 条实际运行入口 + 消费者测试 7 个 API 断言路径)
assertion_count: 52