software: luasql
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/keplerproject/luasql/archive/refs/tags/v2.3.5.tar.gz"

  # 源码校验和
  sha256: "dc337d01e28f1d579a452e784939671727214df69d35809dfbc893ae096b444d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - lua/5.4.7
  # - sqlite3/?

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.patch"
# 例如:
# - "0001-config-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony 上 Lua 扩展模块需要显式链接 Lua 库（-llua），不能依赖主程序导出符号"
  - "LuaSQL 使用 Makefile 系统，不支持 configure 脚本和 DESTDIR"
  - "需要手动修改 config 文件适配环境（PREFIX, LUA_SYS_VER, 路径等）"
  - "LuaSQL 的 Makefile 不支持 DESTDIR，需要手动安装到 staging 目录"
  - "/tmp 在 OpenHarmony 上可能是只读的，数据库文件应使用 $HOME/tmp"
# 例如:
# - "LuaSQL 使用 Makefile，不支持 DESTDIR"
# - "需要手动修改 config 文件适配环境"

