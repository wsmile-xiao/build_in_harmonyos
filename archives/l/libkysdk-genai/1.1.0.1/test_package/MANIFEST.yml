# test_package/MANIFEST.yml
# 上游官方测试声明文件 — libkysdk-genai/1.1.0.1

package: libkysdk-genai/1.1.0.1
homepage: "https://gitee.com/openkylin/libkysdk-genai-nlp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -DENABLE_TEST=ON && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# R51 三步法清点证据（tag upstream/1.1.0.1，commit 47f0725acc1c038e9062989b3b260a09f7d2cc42）：
#   1. tests/ 目录含 CMakeLists.txt + testGenAiNlp.cpp（451 行）
#   2. 测试函数清点：test01_Chat / test02_ChatHistoryMessages /
#      test03_ClearChatMessage / test04_SetModelConfig / test05_SetChatSystemPrompt /
#      test06_GenerateContent / test07_ChatSystemPromptId_SUMMARY /
#      test08_ChatSystemPromptId_TEXT_EXPANSION /
#      test09_ChatSystemPromptId_TRANSLATE_CHINESE_TO_ENGLISH / test10_BigTest，
#      共 10 个测试函数（test10_BigTest 内部重复调用 test10_Chat 20 次，
#      统计口径：函数级 10 个；若按 test10_Chat 单次调用计为 20 次则合计 29 个执行点）。
#   3. 所有用例均为交互式程序：g_main_loop_run + std::getchar() 等待键盘输入，
#      且依赖真实 AI 云服务认证（百度 ERNIE / 讯飞 Spark，setBaiduAuthens /
#      setXunfeiAuthens 中认证串为空）。OHOS CI 无 AI 云服务 + 无键盘输入，
#      上游用例可运行数 0（具体技术原因见 notes.md 申报表）。
upstream_tests:
  - file: testGenAiNlp.cpp
    source: libkysdk-genai-1.1.0.1/tests/testGenAiNlp.cpp
    description: "交互式 NLP 对话测试（10 个测试函数；依赖真实 AI 云服务认证 + 键盘输入，OHOS CI 无法运行）"
    command: "./testGenAiNlpApi"

# test_package 中自带的测试 (消费者视角验证)
# rule12 要求鸿蒙特有测试 ≥ 1：本 test_package 为不依赖云服务/AI 运行时进程的
# 可运行实质测试（对象生命周期 / init_session 无服务错误路径 / result 空指针
# 默认值 / 枚举值，16 断言，conan create 内嵌 ctest 实测 16/16 通过）。
test_package_tests:
  - file: test.cpp
    type: 鸿蒙特有测试
    count: 16
    passed: 16
    description: "消费者实质测试: 链接 KysdkGenAiNlp::KysdkGenAiNlp, 16 断言（建/毁对象、genai_text_init_session 无 AI 服务器返回 AISDK_RUNTIME_ERROR、chat_result_get_* 空指针默认值、PromptId/ModelDeployType/错误码枚举值）"
    command: "./test_libkysdk-genai"

# 测试计数（上游 N=10 函数级；适配后可运行仅鸿蒙特有测试 16 断言）
test_counting:
  upstream_independent_total: 10
  integration_independent_total: 0
  harmony_specific_total: 16

# 测试断言总数 (近似值)
assertion_count: 16
