# conandata.yml — libkysdk-genai 1.1.0.1
# 麒麟 AI 生成式 AI NLP 客户端库（上游仓库项目名 libkysdk-genai-nlp）。
#
# 源码来源：openKylin 官方源 gitee.com/openkylin/libkysdk-genai-nlp，tag
# upstream/1.1.0.1（R39 合规官方源，commit 47f0725acc1c038e9062989b3b260a09f7d2cc42）。
# gitee 的 /repository/archive/ 归档端点对 conan 下载器返回 HTML 反爬页（sha256 每次
# 不同无法固定），故 source() 改用 Git clone 官方源 + --branch + --depth 1，commit 固定。
#
# 私有依赖 KylinAiProto（OHOS 制品仓无配方，L0i 限制不能 requires，配方内 vendor）：
#   - 协议源：openkylin/libkylin-ai-system-private debian/1.2.0.1-1 内嵌的 ai-proto
#     （KylinAiProtoConfig.cmake + KylinAiProtoFunctions.cmake 宏 + 协议 XML，
#     含 gennlpservice.xml）。独立 kylin-ai-proto 仓库的 XML 可能旧于
#     libkysdk-genai 1.1.0.1 源码期望，1.2.0.1 的 ai-proto 与源码匹配
#     （libkysdk-ai-private 同源验证）。

sources:
  url: "https://gitee.com/openkylin/libkysdk-genai-nlp.git"
  tag: "upstream/1.1.0.1"
  commit: "47f0725acc1c038e9062989b3b260a09f7d2cc42"
  kylin-ai-system:
    url: "https://gitee.com/openkylin/libkylin-ai-system-private/repository/archive/debian%2F1.2.0.1-1.tar.gz"
    sha256: "9252749b0112bbfb621ddb6c6e018417e7b1c052315cc36d004affc4f4ff1cc0"

patches:
  "1.1.0.1":
    - patch_file: "patches/0001-jsoncpp-include-prefix.patch"
      description: "src/_chatmessage.cpp、src/_chatmodelconfig.cpp：jsoncpp 头文件在 include/json/（制品仓 jsoncpp 包布局），#include <jsoncpp/json/value.h> 与 \"jsoncpp/json/json.h\" 改为 <json/value.h> / \"json/json.h\""
    - patch_file: "patches/0002-cmakelists-jsoncpp-gio-usr-soname.patch"
      description: "主 CMakeLists.txt：find_package(jsoncpp) → find_package(JsonCpp CONFIG REQUIRED)（制品仓 jsoncpp 只导出 JsonCpp::JsonCpp 目标）；target_link_libraries jsoncpp → JsonCpp::JsonCpp；pkg_check_modules(GIO/JSON) 后补 link_directories(${GIO_LIBRARY_DIRS} ${JSON_LIBRARY_DIRS})（-L 不传给 lld 则 -lgio-2.0/-ljson-glib-1.0 找不到）；补 include_directories(${AI_COMMON_INCLUDE_DIRS}/kylin-ai)（上游依赖系统 /usr/include/kylin-ai 前缀）；install(DIRECTORY usr/ DESTINATION /usr) 越权写系统根 → DESTINATION .（配合 conan package() --prefix 落到包内 share/pkgconfig）；注入 -Wl,-soname,libkysdk-genai-nlp.so（CMake 无 HarmonyOS 平台模块，VERSION/SOVERSION 不生成 SONAME）"
    - patch_file: "patches/0003-kylin-ai-proto-functions-paths.patch"
      base_path: "vendor/kylin-ai-proto"
      description: "KylinAiProto gdbus 生成宏：硬编码 /usr/share/kylin-ai/protocols/gdbus/ 与 /usr/bin/gdbus-codegen 改为 ${KYLAI_GDBUS_PROTOCOL_DIR} / ${KYLAI_GDBUS_CODEGEN} 变量"
    - patch_file: "patches/0004-kylin-ai-proto-install-prefix.patch"
      base_path: "vendor/kylin-ai-proto"
      description: "kylin-ai-proto 顶层 CMakeLists：install(DIRECTORY protocols/usr/ DESTINATION /usr) 绝对路径写 /usr 越权，改为 DESTINATION ${CMAKE_INSTALL_PREFIX}"
    - patch_file: "patches/0005-genai-headers-common-include-prefix.patch"
      description: "5 个公开头文件（chat/chatmessage/config/error/result.h）的 #include <common/...> 改为 <kylin-ai/common/...>：上游依赖系统 /usr/include/kylin-ai 前缀，Conan 的 kysdk-ai-common 包只暴露 include/kylin-ai 子目录（-I<pkg>/include），全路径写法使下游消费者经 transitive_headers 传播的头文件路径即可编译"
