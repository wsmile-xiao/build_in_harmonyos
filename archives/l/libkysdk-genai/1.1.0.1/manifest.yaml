# 版本级 manifest — libkysdk-genai 1.1.0.1
# 麒麟 AI 生成式 AI NLP 客户端库（上游仓库项目名 libkysdk-genai-nlp）

version: "1.1.0.1"
software: "libkysdk-genai"

# 编译状态（conan-verify 通过 = published；本次未 upload，如实标 built）
status: built
build_date: "2026-09-28"
build_system: cmake

source:
  url: "https://gitee.com/openkylin/libkysdk-genai-nlp.git"
  tag: "upstream/1.1.0.1"
  commit: "47f0725acc1c038e9062989b3b260a09f7d2cc42"
  # gitee 归档端点对 conan 下载器返回 HTML 反爬页（sha256 每次不同无法固定），
  # 故 source() 用 git clone 官方源 + 固定 commit（同 kysdk-ai-common）。
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options: []
  dependencies:
    - kysdk-ai-common/1.1.0.1
    - libkysdk-ai-private/1.1.0.1
    - glib/2.88.0.1
    - jsoncpp/1.9.8
    - json-glib/1.10.6
    - openssl/3.5.8.1
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied:
  - "0001-jsoncpp-include-prefix.patch"
  - "0002-cmakelists-jsoncpp-gio-usr-soname.patch"
  - "0003-kylin-ai-proto-functions-paths.patch"
  - "0004-kylin-ai-proto-install-prefix.patch"
  - "0005-genai-headers-common-include-prefix.patch"

knowledge_gained:
  - "KylinAiProto gdbus 生成宏的硬编码 /usr/share/kylin-ai/protocols/gdbus 与 /usr/bin/gdbus-codegen 需变量化（KYLAI_GDBUS_PROTOCOL_DIR / KYLAI_GDBUS_CODEGEN），vendor 到 staging 后经 CMakeToolchain 注入"
  - "json-glib/1.10.6 配方 pin glib/2.84.0.1，与 libkysdk-ai-private 的 glib/2.88.0.1 冲突 → requirements 内 glib/2.88.0.1 override=True，json-glib 按 --build=missing 重编一次"
  - "CMake configure 期读取 ambient LDFLAGS 注入 CMAKE_*_LINKER_FLAGS，会把 $DEFAULT_PREFIX/lib 的共享 glib 误链进产物；build() 显式清空 LDFLAGS 保证只链 Conan 依赖"
  - "install(DIRECTORY usr/ DESTINATION /usr) 越权 → 改 DESTINATION .（相对前缀），配合 conan package() --prefix 落到包内 share/pkgconfig"
  - "CMake 无 HarmonyOS 平台模块，VERSION/SOVERSION 不生成 -Wl,-soname，需显式 target_link_options 注入 SONAME"
  - "OHOS 动态链接器要求签名 ELF：SDK lld 产物自带 .codesign 段，签名前 objcopy 移除再 binary-sign-tool 自签"

patch_generation:
  method: manual-git-diff
  patches_count: 5
