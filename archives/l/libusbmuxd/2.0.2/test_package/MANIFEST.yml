# test_package/MANIFEST.yml
# libusbmuxd 2.0.2 upstream test declaration

package: libusbmuxd/2.0.2
homepage: "https://github.com/libimobiledevice/libusbmuxd"

# Upstream test command (make check needs real iOS device / usbmuxd daemon)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/test.c
    description: "Call usbmuxd_get_device_list() — verify libusbmuxd links and API symbols resolve (no daemon/device on OHOS returns error/empty, link OK)"
    command: "./test_libusbmuxd"

# Test assertion count
assertion_count: 1
