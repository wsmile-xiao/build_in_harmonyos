software: libusbmuxd
display: "libusbmuxd"
description: "A library to communicate with iOS devices via USB"
category: system
homepage: "https://libimobiledevice.org/"
license: LGPL-2.1+
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools requires removing umask 077 from config.status"
    - "libusbmuxd 2.x depends on libimobiledevice-glue (1.x does not)"
    - "pkg-config name is libusbmuxd-2.0"
  common_dependencies:
    - libplist
    - libimobiledevice-glue

versions:
  "2.1.0":
    status: published
    build_date: "2026-05-20"