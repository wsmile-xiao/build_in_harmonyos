package: libdvbcsa/1.1.0
homepage: "https://www.videolan.org/developers/libdvbcsa.html"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (test/Makefile.am TESTS = 4 programs)"
upstream_tests:
  - file: "test/testbsops.c"
    source: "libdvbcsa 1.1.0 release"
    description: "Bitslice primitive operations"
    command: "make check: testbsops"
  - file: "test/testdec.c"
    source: "libdvbcsa 1.1.0 release"
    description: "CSA packet decryption"
    command: "make check: testdec"
  - file: "test/testenc.c"
    source: "libdvbcsa 1.1.0 release"
    description: "CSA packet encryption"
    command: "make check: testenc"
  - file: "test/testbitslice.c"
    source: "libdvbcsa 1.1.0 release"
    description: "Bitslice implementation"
    command: "make check: testbitslice"
test_package_tests:
  - file: "test_libdvbcsa.c"
    description: "Installed header/library encrypt and decrypt a 184-byte payload"
    command: "./test_libdvbcsa"
assertion_count: 3
