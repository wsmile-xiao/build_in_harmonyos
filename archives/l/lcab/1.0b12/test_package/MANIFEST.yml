# test_package/MANIFEST.yml — upstream test declaration (R51)
# CI script (build_and_test.sh L0e) requires this file to exist.

package: lcab/1.0b12
homepage: "https://tracker.debian.org/pkg/lcab"

# Upstream test inventory (R51 step 1 — clean count)
#   tests/ directory           : absent
#   TESTS / check_PROGRAMS     : 0 (grep over Makefile.am / Makefile.in => no hit)
#   `make check` (automake)    : target exists but runs nothing, prints no output
# => upstream ships no test suite; evidence recorded in notes.md.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests: []

# test_package tests (consumer perspective, written for this adaptation)
test_package_tests:
  - file: test_lcab.sh
    description: "usage banner/version check (validates the version patch)"
    command: "lcab -h"
  - file: test_lcab.sh
    description: "single-file cabinet: MSCF magic, stored file name and payload"
    command: "lcab -n payload.txt single.cab"
  - file: test_lcab.sh
    description: "multi-file cabinet in quiet mode, size grows vs single file"
    command: "lcab -n -q payload.txt second.txt multi.cab"
  - file: test_lcab.sh
    description: "recursive directory mode packs nested file content"
    command: "lcab -r tree rec.cab"
  - file: test_lcab.sh
    description: "missing input file is reported without crash"
    command: "lcab -n does-not-exist.txt bad.cab"

# HarmonyOS PC consumer use case (end-to-end, not assertion-only)
harmony_specific_tests:
  - file: test_roundtrip.py
    description: >-
      Pack a project directory in the app sandbox ($TMPDIR, HMDFS on device)
      holding a UTF-8 file name, nested folders, NUL-containing and
      multi-block (>96 KiB) files with `lcab -r`; read the cabinet back with an
      independent MS-CAB parser, recompute every CFDATA checksum, extract each
      file and compare byte for byte; a one-byte corruption must be rejected.
    command: "python3 test_roundtrip.py <package>/bin/lcab"

assertion_count: 17
