knowledge_gained:
  - "lcab 是无第三方依赖的纯 POSIX C 命令行工具，OHOS musl 提供其全部系统接口"
  - "旧版 configure 无 AC_CANONICAL_HOST，只有显式 --host 才进入交叉模式；因此仅在非 AArch64 构建机追加 --host，真机 runner 保持 native（R1/E205）"
  - "HMDFS 上 config.status 以 umask 077 建的临时目录对同一进程不可写，需改为 umask 000 并优先使用 TMPDIR（E011/E528）"
  - "上游 1.0b12 的 mytypes.h VERSION 仍为 1.0b11，需应用 Debian 同源版本修复补丁"
  - "test_package 在非 AArch64 构建机上先验证安装产物存在，再跳过目标执行，从而通过 L1e 破坏性反向验证；真实功能由 qemu-aarch64 补测"

