software: lmfit
description: "C library for Levenberg-Marquardt minimization and least-squares curve fitting"
license: "BSD-2-Clause"
# 文件位置: archives/{letter}/{name}/10.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "10.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# 构建系统类型（verify-build 检查字段）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://jugit.fz-juelich.de/mlz/lmfit/-/archive/v10.0/lmfit-v10.0.tar.bz2"

  # 源码校验和
  sha256: "232658736984365ad71ac76adf94d125ee0df1f570a6c69ce3a34f892be14150"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_CXX_COMPILER=clang++"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DLIB_MAN=OFF"
    - "-DPEDANTIC=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 构建目录模式
  build_dir: "_build"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lmfit实际使用cmake构建系统，init-build的_guess_build_system启发式从URL推断为autotools（URL不含cmake关键词），需手动修正manifest.yaml的build_system字段"
  - "cmake项目推荐out-of-source build方式（mkdir _build && cd _build && cmake ..），避免污染源码目录"
  - "LIB_MAN=OFF跳过man页面生成，HarmonyOS平台缺少man工具链"
  - "PEDANTIC=OFF跳过-pedantic -Wall冗余警告，HarmonyOS平台可能触发额外警告"
  - "lmfit共享库仅依赖libc.so，是最轻量级依赖的库之一"
  - "lmfit的控制结构体类型名为lm_control_struct（不是lm_control_type）"
  - "cmake在HarmonyOS上输出'System is unknown'提示但不影响编译结果"
  - "jugit.fz-juelich.de SSL证书不被HarmonyOS信任，需手动curl下载源码包"