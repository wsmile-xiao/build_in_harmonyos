software: libapogee3
display: "libapogee3"
description: "Apogee Instruments Gen2/Gen3 CCD camera driver library (INDI ecosystem)"
category: system
homepage: "https://www.apogeeinstruments.com/"
license: MPL-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "Build the shared libapogee library; no CMake config export is installed,
      so the consumer links through the Conan-generated libapogee3::libapogee3 target"
    - "Replace find_package(INDI REQUIRED) with a generated indimacros.h stub —
      the library only consumes two INDI macros and never links INDI, which would
      otherwise drag in Qt5/boost"
    - "Add the missing include_directories(${USB1_INCLUDE_DIRS}); the source
      includes <libusb-1.0/libusb.h>, which only resolves via the libusb package
      include root under cross-compilation"
    - "Raise cmake_minimum_required to 3.15 for CMake 4.x and drop the
      SOVERSION symlink layout for a relocatable unversioned SONAME (HMDFS)"
  common_dependencies:
    - "libusb/1.0.27"
    - "curl/8.15.0"

versions:
  "3.2+20221221183454":
    status: built
    build_date: "2026-09-17"
