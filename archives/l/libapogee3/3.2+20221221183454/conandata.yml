sources:
  url: "https://deb.debian.org/debian/pool/main/liba/libapogee3/libapogee3_3.2+20221221183454.orig.tar.gz"
  sha256: "339d15bcedc5c458a4a8c7a01b1e6c63d7bebb89600e453ed6215fb8136102d2"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "OHOS 安装路径可写化: CONF_DIR /etc → ${CMAKE_INSTALL_PREFIX}/etc, udev rules /lib/udev/rules.d → ${CMAKE_INSTALL_PREFIX}/lib/udev/rules.d（OHOS /etc 与 /lib 只读, 交叉 install 会失败）"
    patch_type: "portability"
  - patch_file: "patches/0002-CMakeLists-ohos.patch"
    patch_description: "OHOS 编译适配: cmake_minimum_required 3.0→3.15（CMake 4.x 移除 <3.5 兼容）; 停用 find_package(INDI REQUIRED)（本库仅用 indimacros.h 两宏从不链 INDI, 由 recipe 经 INDI_INCLUDE_DIR 提供 stub 头, 避免 Qt5/boost 依赖）; 补 include_directories(${USB1_INCLUDE_DIRS})（上游漏写, Debian 靠 /usr/include 默认路径碰巧命中, 交叉环境必须有）; 去掉 VERSION/SOVERSION（HMDFS 拒 SOVERSION 符号链接布局, recipe 改出无版本号可重定位 SONAME）"
    patch_type: "portability"
