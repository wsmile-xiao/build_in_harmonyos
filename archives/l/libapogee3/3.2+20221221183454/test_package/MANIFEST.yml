# Upstream and consumer test declaration for CI L0e.
package: libapogee3/3.2+20221221183454
homepage: https://www.apogeeinstruments.com/

# Upstream ships no test suite: the source tree has no tests/ directory and
# CMakeLists.txt declares no test target (verified against the Debian
# orig.tar.gz). The library is a hardware camera driver whose functional tests
# require a live USB/Ethernet Apogee camera, which CI cannot provide. The
# package is therefore whitelisted in ci/config/no_official_test.txt and its L1
# official-test check is skipped; the consumer test below still links and runs
# the real installed library.

upstream_check_command: none
upstream_test_in_build: false

test_package_tests:
  - file: test_apogee.cpp
    description: >
      Pure-function consumer test of the CamModel namespace: platform lookup
      by string and camera ID, firmware-revision classification (Alta/Gen2
      bounds), camera-ID masking, and the no-op firmware revision. No hardware,
      USB, network, or config file required.
    command: "./test_apogee"

assertion_count: 24
