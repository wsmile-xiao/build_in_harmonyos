# 版本级 manifest — libnetfilter_log 1.0.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.2"
software: "libnetfilter_log"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.netfilter.org/pub/libnetfilter_log/libnetfilter_log-1.0.2.tar.bz2"
  sha256: "e3f408575614d849e4726b45e90c7ebb0e6744b04859555a9ce6ec40744ffeea"
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos（绕过 config.guess）"
    - "--enable-static --disable-shared（R26 默认静态）"
    - "CONFIG_SHELL/SHELL 内联路由 /bin/sh（E386，见 notes）"
  dependencies:
    - "libmnl/1.0.5"
    - "libnfnetlink/1.0.2"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0002-config-sub-ohos.patch"
  - "0003-include-order-libnfnetlink-first.patch"

patch_classification:
  - file: 0002-config-sub-ohos.patch
    type: manual
    platform_only: True
    guard: 'pending'
  - file: 0003-include-order-libnfnetlink-first.patch
    type: manual
    platform_only: True
    guard: 'pending'

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS sysroot 的 bionic 式 uapi 头（linux/socket.h、linux/netfilter/nfnetlink.h）与 musl 侧定义重复：以 CPPFLAGS -D 预定义其守卫宏抑制内核版，并对被抑制头唯一的类型依赖用 -D 别名补齐（E091/E119 macro-guard-skip-header 的 CPPFLAGS 应用形态）"
  - "依赖包自带兼容头（如 libnfnetlink 的 linux_nfnetlink.h，无守卫）与 sysroot uapi 头冲突时：抑制 sysroot 版 + 调整本包 TU 的包含顺序让兼容头先定义（patches/0003）"
  - "OHOS 平台策略对非特权进程拒绝 NETLINK_NETFILTER 协议套接字（EACCES）：依赖该协议的库其运行时深路径在设备侧不可达，消费者测试按能力探测式设计并逐项留证"
  - "上游无测试套件：如实申报 N_static=0，消费者测试以合成 nfnetlink 报文驱动 nflog_handle_packet 解析路径补足行为验证"
