# 软件级 manifest — lndir
# 遵循 ARCHIVE-SPEC v2.0

software: lndir
display: "lndir"
description: "X.Org 工具：为另一目录树创建符号链接影子目录（shadow link tree）"
category: utility
homepage: "https://gitlab.freedesktop.org/xorg/util/lndir"
license: MIT-open-group
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "单文件 C 程序（lndir.c），仅 X11/Xos.h + X11/Xfuncproto.h 头依赖，无库链接"
    - "上游发布 tarball 已带预生成 configure/Makefile.in，无需 autoreconf"
    - "configure 用 PKG_CHECK_MODULES(XPROTO, xproto >= 7.0.17)，XPROTO_LIBS 为空（仅头）"
    - "依赖 xorgproto 提供 xproto.pc 与 X11/ 头文件，通过 PKG_CONFIG_PATH 注入"
    - "上游无任何测试套件（无 TESTS/check_PROGRAMS/check-local），automake check 为空操作"
    - "产物为单个可执行 lndir（bin_PROGRAMS），需 commands.json 声明（R38）"
  common_dependencies:
    - xorgproto/2025.1

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.0.5":
    status: built
    build_date: "2026-08-30"
    conan_adapt_date: "2026-08-30"
    conan_ref: "lndir/1.0.5"
    note: "X.Org 官方稳定版本；上游无测试套件，test_package 自建目录树验证符号链接"
