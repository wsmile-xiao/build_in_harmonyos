package: "lndir/1.0.5"
homepage: "https://gitlab.freedesktop.org/xorg/util/lndir"

# ── Upstream tests (make check) ────────────────────────────────────────
# lndir 1.0.5 ships NO test suite. Evidence:
#   - Makefile.am declares only `bin_PROGRAMS = lndir`; there is no
#     TESTS, no check_PROGRAMS, no check-local target.
#   - configure.ac has no AC_CONFIG_TESTDIR / AM_TESTS / DejaGnu.
#   - The automake-generated `check` target in Makefile.in is the default
#     no-op: `check-am: all-am` then `check: check-am`.
#   - No test/, tests/, or t/ source directory exists in the release tarball.
#   - The X.Org lndir repo has no CI test workflow (only the autotools build).
upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The release Makefile.am declares only `bin_PROGRAMS = lndir`; there is no
  TESTS, no check_PROGRAMS, no check-local target, and no test source
  directory. The automake-generated `check` target is the default no-op
  (`check-am: all-am`). configure.ac defines no AC_CONFIG_TESTDIR.

# ── test_package tests (functional, run the packaged binary) ────────────
test_package_tests:
  - id: "shadow-tree-symlinks"
    source: "lndir_tree_test.sh"
    command: "lndir"
    description: >-
      Build a small source directory tree (regular files, subdirectories,
      revision-control dirs, a backup file), run the packaged lndir binary
      to create a shadow tree, and assert that regular files became symlinks
      pointing at the source, subdirectories are real directories,
      revision-control dirs and backup files are skipped, the symlink content
      resolves to the source bytes, the -silent/-ignorelinks/-withrevinfo
      flags are accepted, and lndir refuses identical from/to directories.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 1
assertion_count: 14
