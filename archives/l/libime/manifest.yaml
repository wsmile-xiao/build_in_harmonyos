software: libime
display: "LibIME"
description: "Input Method Engine library for Fcitx5"
category: system
homepage: "https://github.com/fcitx/libime"
license: LGPL-2.1+
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "C++20 ranges/views 在 OpenHarmony libc++ 不支持，需替换为传统 C++"
    - "CMAKE_LIBRARY_OUTPUT_DIRECTORY 设置会导致 cmake 使用相对路径处理依赖"
    - "需要 patchelf 修复跨库依赖路径"
    - "需要 ELF 签名才能执行共享库"
  common_dependencies:
    - ECM
    - Fcitx5Utils
    - Boost
    - libzstd

# 版本索引
versions:
  "1.1.12":
    status: published
    build_date: "2026-06-08"