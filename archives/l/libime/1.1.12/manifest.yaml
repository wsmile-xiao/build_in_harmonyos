software: libime
# 版本级 manifest - libime 1.1.12
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.1.12"
status: published  # RPATH 已修复，ELF 已签名
build_date: "2026-06-08"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "file:///storage/Users/currentUser/tmp/libime-1.1.12.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_PREFIX_PATH=$DEFAULT_PREFIX"
    - "-DCMAKE_INSTALL_RPATH=$DEFAULT_PREFIX/lib"
    - "-DENABLE_TEST=OFF"
    - "-DENABLE_DOC=OFF"
    - "-DENABLE_DATA=OFF"
    - "-DENABLE_TOOLS=OFF"
  dependencies:
    - ECM/6.26.0
    - Fcitx5Utils/5.1.13
    - Boost/1.87.0
    - libzstd/1.5.6
    - libuv/1.48.0
  cc: clang
  cxx: clang++

# RPATH 修复说明（2026-06-08 第二次编译）
rpath_fix:
  method: "patchelf"
  steps:
    - "编译后复制 libIME*.so 到临时目录"
    - "patchelf --replace-needed ../../../lib/libIMECore.so libIMECore.so libIMEPinyin.so"
    - "patchelf --replace-needed ../../../lib/libIMECore.so libIMECore.so libIMETable.so"
    - "patchelf --set-rpath $DEFAULT_PREFIX/lib libIME*.so"
  result:
    needed: "libIMECore.so"  # 修复前: ../../../lib/libIMECore.so
    runpath: "$DEFAULT_PREFIX/lib"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-src-libime-core-decoder.cpp.patch"
  - "0002-src-libime-core-historybigram.cpp.patch"
  - "0003-src-libime-core-lattice.h.patch"
  - "0004-src-libime-pinyin-pinyinencoder.cpp.patch"
  - "0005-src-libime-pinyin-shuangpinprofile.cpp.patch"
  - "0006-src-libime-table-autophrasedict.cpp.patch"
  - "0007-src-libime-table-tablebaseddictionary.cpp.patch"
  - "0008-src-libime-table-tabledecoder.cpp.patch"
  - "0009-cmakelists-output-directory.patch"  # 新增: 修复输出目录结构

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "C++20 ranges/views 在 OpenHarmony libc++ 不支持，需替换为传统 C++"
  - "CMAKE_LIBRARY_OUTPUT_DIRECTORY 设置会导致 cmake 使用相对路径处理依赖"
  - "修复方案: 所有库输出到同一目录 + patchelf 替换依赖路径"
  - "鸿蒙系统要求 ELF 签名才能执行共享库（安全机制）"

# ============================================================
# 测试结果（2026-06-08 RPATH 修复后）
# ============================================================

test_results:
  rpath_fix:
    before: "NEEDED: ../../../lib/libIMECore.so"
    after: "NEEDED: libIMECore.so + RUNPATH: $DEFAULT_PREFIX/lib"
    status: FIXED
  library_loading:
    without_elf_signature: FAIL  # Permission denied (鸿蒙安全机制)
    note: "需要 ELF 签名才能实际运行"

# ============================================================
# 部署要求
# ============================================================

deployment_requirements:
  - "必须进行 ELF 签名才能在鸿蒙平台执行"
  - "签名工具: /data/service/hnp/bin/signelf (如可用)"
  - "或通过 cmd-pkgs 公共安装脚本自动签名"

recommendations:
  - "打包时需包含签名流程"
  - "建议通过 fcitx5 输入法框架部署（框架会处理签名）"
  - "预编译包应使用 ohc-run.py sign-elf 命令签名"