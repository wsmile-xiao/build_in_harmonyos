knowledge_gained:
  - "CMake FindCURL/捆绑 FindGpgme 在 OHOS 不可靠：统一改走 pkg-config（PKG_CHECK_MODULES）"
  - "OHOS 无 /bin/bash，上游 run_tests.sh 需改 /bin/sh；且其覆盖式 export LD_LIBRARY_PATH 会丢掉 conan 依赖库目录，须改为前插"
  - "构建期不可把 prefix lib 加入 LD_LIBRARY_PATH：SDK lld 链接器会误加载新版 libxml2 导致 Error relocating 崩溃；该路径仅在运行测试时注入"
  - "cmd-pkgs 的 glib 包只带静态库；依赖 glib 的动态库配方应使用 ohpcd 制品仓的 conan glib 包"

