# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librepo/1.20.0
homepage: "https://github.com/rpm-software-management/librepo"

# 上游测试命令 (CMake 工程: ENABLE_TESTING + ADD_TEST(test_main run_tests.sh))
upstream_check_command: "ctest (等价于上游 make test)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test() (ctest -> tests/run_tests.sh -> tests/test_main <test_data>)"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_main (CMake target, check 框架)
    source: librepo-1.20.0/tests/
    description: "上游 check 测试套件：checksum/downloader/gpg/handle/lrmirrorlist/metalink/mirrorlist/package_downloader/repoconf/repomd/repo_zck/url_substitution/util/version 共 15 个 suite"
    command: "ctest -> tests/run_tests.sh <librepo tests/test_data/>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：版本宏、LrHandle/LrResult 生命周期、LRO_URLS/LRI_URLS 往返、校验和类型映射、lr_checksum_fd(SHA256) 真实摘要计算"
    command: "./test_librepo"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
