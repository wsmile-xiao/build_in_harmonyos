# conandata.yml — librepo 1.20.0
# 源码来自上游官方 GitHub 仓库 tag 归档（rpm-software-management/librepo，tag 1.20.0）。
# 上游 releases 不发布源码 tarball 资产（.../releases/download/1.20.0/*.tar.gz -> 404），
# 故使用官方仓库 tag 归档地址（GitHub 官方托管，符合 R39/PF7）。

sources:
  url:
    - "https://github.com/rpm-software-management/librepo/archive/refs/tags/1.20.0.tar.gz"
  sha256: "c21dd3caefe97ea58bc865f92095a9d2db2ec8aab49d0c714d4742094db930b6"

patches:
  "1.20.0":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "OHOS: CURL/GPGME 依赖改走 pkg-config；补齐 GPGME/ZCHUNKLIB/LIBCHECK 头文件路径与 LINK_DIRECTORIES"
      patch_type: "portability"
    - patch_file: "patches/0002-librepo-CMakeLists.txt.patch"
      patch_description: "OHOS: 链接变量 ${CURL_LIBRARY} -> ${CURL_LIBRARIES}（与 pkg-config 检测结果配套）"
      patch_type: "portability"
    - patch_file: "patches/0003-tests-CMakeLists.txt.patch"
      patch_description: "OHOS: 测试链接 tmpfile 兼容实现并导出符号（ENABLE_EXPORTS，供共享版 libcheck interpose）"
      patch_type: "portability"
    - patch_file: "patches/0004-tests-ohos_tmpfile_compat.c.patch"
      patch_description: "OHOS: 新增 tmpfile() 兼容实现（musl 固定 /tmp 不可写，honour $TMPDIR），供 check 框架使用"
      patch_type: "portability"
    - patch_file: "patches/0005-tests-run_tests.sh.in.patch"
      patch_description: "OHOS: /bin/bash 不存在 -> /bin/sh；测试脚本改为前插 LD_LIBRARY_PATH 而非覆盖"
      patch_type: "portability"
    - patch_file: "patches/0006-tests-test_main.c.patch"
      patch_description: "OHOS: 测试临时目录 /tmp 不可写 -> 优先 $TMPDIR；支持 LIBREPO_SKIP_GPG_TESTS 跳过 gpg 引擎依赖测试"
      patch_type: "portability"
    - patch_file: "patches/0007-tests-test_repoconf.c.patch"
      patch_description: "OHOS: test_write_repoconf 硬编码 /tmp 不可写 -> 使用 $TMPDIR"
      patch_type: "portability"
