# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librepo/1.18.0
homepage: "https://github.com/rpm-software-management/librepo"

# 上游测试入口：tests/test_main（libcheck 单进程 runner，ctest 经 run_tests.sh 包装）
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "./tests/test_main tests/test_data/"

# 上游用例口径：tests/test_*.c 的 START_TEST 宏计数 = 55（取数命令：
#   grep -c START_TEST tests/test_*.c | awk -F: '{s+=$2} END {print s}'
# ）。其中 test_downloader 的 6 例仅在 -d（需要真实互联网连接）时注册；
# test_repo_zck 的 1 例上游编译但未注册进 runner（test_main.c 无
# srunner_add_suite）；无网络默认执行 12 个 suite 共 48 例。
upstream_tests:
  - file: tests/test_main.c
    source: librepo-1.18.0/tests/test_main.c
    description: "libcheck runner：注册 checksum/gpg/handle/lrmirrorlist/metalink/mirrorlist/package_downloader/repoconf/repomd/url_substitution/util/version 12 个 suite（48 例），downloader suite 仅 -d 时注册"
    command: "./tests/test_main tests/test_data/"
  - file: tests/test_data/
    source: librepo-1.18.0/tests/test_data/
    description: "metalink/mirrorlist/repo_yum_* 本地 fixture 与 GPG 公钥/签名样本"
    command: "./tests/test_main tests/test_data/"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.c
    description: "消费者功能测试：链接安装后的 librepo.so，本地解析 metalink3 fixture（上游 metalink_good_01 同格式裁剪版）并断言 filename/timestamp/size/hash/url 共 15 项 + 版本宏 2 项"
    command: "clang test_consumer.c -lrepo ... && ./test_consumer metalink_fixture.xml"
  - file: conanfile.py
    description: "test() 以 conanbuild 环境编译、conanrun 环境运行，真实执行被测包"
    command: "conan test test_package librepo/1.18.0"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17
