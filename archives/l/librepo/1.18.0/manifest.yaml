package: librepo
version: 1.18.0
category: library
license: LGPL-2.1-or-later
homepage: https://github.com/rpm-software-management/librepo

upstream:
  url: "https://codeload.github.com/rpm-software-management/librepo/tar.gz/refs/tags/1.18.0"
  sha256: "c6f531df6d148d29d192f25383c13cbe0cfcbba4c8046513f0d660bbfcb9ab1b"
  tag: "1.18.0"

build:
  system: cmake
  options:
    ENABLE_TESTS: "ON"
    ENABLE_DOCS: "OFF"
    ENABLE_EXAMPLES: "OFF"
    ENABLE_PYTHON: "OFF"
    ENABLE_SELINUX: "OFF"
    USE_GPGME: "ON"
    WITH_ZCHUNK: "ON"

tests:
  upstream_framework: libcheck
  upstream_start_test_total: 55
  default_executed: 48
  passed: 45
  gpg_skipped_reason: "OHOS 无 gpg OpenPGP 运行引擎（gpgme: Invalid crypto engine；gnupg 依赖链无预编译二进制）"
  downloader_skipped_reason: "6 例需 -d（真实互联网连接）"
  repo_zck_note: "1 例上游编译但未注册进 runner"
  consumer: "test_package 17/17（metalink 本地解析 + 版本宏）"

adaptation:
  patches:
    - "0001-ohos-build-adjustments.patch"
  knowledge_drafts:
    - "DRAFT-ohos-pkgconfig-consumption-gap-include-library-dirs"   # 路径 B，issue #3861
