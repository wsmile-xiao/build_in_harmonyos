software: librepo
display: "librepo (rpm-md repository downloader)"
description: "Library providing libcURL-like API to download rpm-md repositories with GPG verification and zchunk support"
category: network
homepage: "https://github.com/rpm-software-management/librepo"
license: LGPL-2.1
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 原生构建；依赖统一改走 pkg-config（补丁改写 FindCURL/FindGpgme）"
    - "OHOS 无 /bin/bash：run_tests.sh 补丁改 /bin/sh 并前插 LD_LIBRARY_PATH"
    - "构建期禁注入 prefix lib 到 LD_LIBRARY_PATH（否则 SDK lld 误加载新 libxml2 崩溃）"
    - "gpgme/zchunk 走 ohpcd 制品仓 conan 包；关闭 SELinux/Python/文档/examples"
  common_dependencies:
    - glib
    - libxml2
    - curl
    - openssl
    - gpgme
    - zchunk
    - check

versions:
  "1.20.0":
    status: published
    build_date: "2026-09-29"
