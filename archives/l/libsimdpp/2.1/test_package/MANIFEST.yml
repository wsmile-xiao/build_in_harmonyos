# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
# 见 docs/TEST_QUALITY_SPEC.md

package: libsimdpp/2.1
homepage: "https://github.com/p12tic/libsimdpp"

# 上游测试命令（ctest 注册了 16 个 add_test，make check 汇总）
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test/ 子目录，需 -std=c++11 编译）
upstream_tests:
  - file: test/main_dispatcher.cc
    source: libsimdpp-2.1/test/main_dispatcher.cc
    description: "调度/分派功能测试（test_dispatcher）"
    command: "./test_dispatcher"
  - file: test/main_expr.cc
    source: libsimdpp-2.1/test/main_expr.cc
    description: "表达式层指令测试（test_expr）"
    command: "./test_expr"
  - file: test/main_insn.cc
    source: libsimdpp-2.1/test/main_insn.cc
    description: "指令层测试（test_insn）"
    command: "./test_insn"

# test_package 自带的消费者测试（使用被测包 API）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：make_int/add/store 向量运算并核对结果"
    command: "./test_libsimdpp"

# 测试断言总数（test_package 内 4 个 lane 断言；上游 ctest 16 项）
assertion_count: 4