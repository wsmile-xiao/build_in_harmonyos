sources:
  url:
    - "https://mirrors.ustc.edu.cn/gnome/sources/libwnck/43/libwnck-43.3.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/gnome/sources/libwnck/43/libwnck-43.3.tar.xz"
    - "https://mirror.nju.edu.cn/gnome/sources/libwnck/43/libwnck-43.3.tar.xz"
    - "https://download.gnome.org/sources/libwnck/43/libwnck-43.3.tar.xz"
  sha256: "6af8ac41a8f067ade1d3caaed254a83423b5f61ad3f7a460fcacbac2e192bdf7"

patches:
  - patch_file: "patches/0001-libwnck-libwnck-3.map.patch"
    patch_description: "Export compatibility bridge entry points through the existing version script"
    patch_type: "portability"
  - patch_file: "patches/0002-libwnck-meson.build.patch"
    patch_description: "Compile the standalone X11 bridge only when the portability option is enabled"
    patch_type: "portability"
  - patch_file: "patches/0003-libwnck-x11-compat-cairo-xlib.h.patch"
    patch_description: "Add the Cairo-Xlib compatibility declarations used by the standalone X11 bridge"
    patch_type: "portability"
  - patch_file: "patches/0004-libwnck-x11-compat-gdk-gdkx.h.patch"
    patch_description: "Add GDK-X11 compatibility declarations for GTK builds without the X11 backend"
    patch_type: "portability"
  - patch_file: "patches/0005-libwnck-x11-compat-wnck-x11-compat.c.patch"
    patch_description: "Implement X11 event delivery and pixmap integration directly on Xlib and Cairo image surfaces"
    patch_type: "portability"
  - patch_file: "patches/0006-meson.build.patch"
    patch_description: "Skip Cairo-Xlib-XRender detection when the standalone bridge is selected"
    patch_type: "portability"
  - patch_file: "patches/0007-meson_options.txt.patch"
    patch_description: "Add an opt-in Meson switch for the non-X11 GDK compatibility bridge"
    patch_type: "portability"
