# 软件级 manifest
# 文件位置: archives/l/libint/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-software.yaml

software: libint

display: "Libint (1.x / Libint1)"

description: "A library for the evaluation of molecular integrals of two-body operators over Gaussian functions (Libint1 series)"

# 基础科学计算库
category: foundation

homepage: "https://github.com/evaleev/libint"

license: LGPL-3.0-or-later

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "Libint1（1.x）与 libint2 是不同代码库：release tag（如 release-1-2-1）是源码树，不含预生成积分核，构建期由 libint_compiler（纯 C 生成器）生成库源码——需走 CMake（Psi4 移植）路径，该路径不需要 perl/autotools（只在 configure.ac 的 autotools 路径需要 objectdir.pl）"
    - "上游 CMake 用 ExternalProject 并把 install DESTINATION 固化为绝对路径，须在 generate() 显式设 CMAKE_INSTALL_PREFIX 到自包含 staging 前缀，package() 里 cmake --install . 后拷入 package_folder（conan 默认 --prefix 覆盖不了绝对 DESTINATION）"
    - "ENABLE_XHOST 默认 ON 会加 -march=native，需 OFF 保证可复现"
    - "产静态库 libint.a / libderiv.a（输出名 int / deriv），cpp_info.libs 写 int；libint.a 的 extern \"C\" 入口纯 C 可链接，无需 -static-libstdc++/libm"
    - "上游 CMake project(VERSION 1.2.0) 与 tag 1.2.1 不一致（源码 quirk），不影响 Conan 包版本"
    - "libint1 上游无自动化测试套件（源码树仅生成器+库源码+文档），按 no_tests 口径上报"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.1":
    status: built
    build_date: "2026-09-25"
    packaging: conan
    notes: "conan 配方（os=OHOS arch=armv8 clang 15）；CMake（Psi4）路径 ExternalProject 构建 libint.a/libderiv.a；无上游测试（上游无测试套件，no_tests）；test_package 1 个 C 消费者入口 10 断言全过"

latest_version: "1.2.1"
