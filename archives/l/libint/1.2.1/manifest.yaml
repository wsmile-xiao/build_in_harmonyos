version: "1.2.1"
software: "libint"
status: built
build_date: "2026-09-25"
build_system: "cmake"

source:
  url: "https://github.com/evaleev/libint/archive/refs/tags/release-1-2-1.tar.gz"
  tar_format: tar.gz
  sha256: "fe5900c98d6adfeadb69cecee9895548ef69b5464f9c2cfb85bd315cf349f3a4"

build:
  # CMake（Psi4 移植路径）：外部项目链 libint_compiler → libint_library →
  # libderiv_compiler → libderiv_library，构建期由 libint_compiler 生成积分核源码。
  # 不用 autotools 路径（需 perl + objectdir.pl，OHOS 不稳）。
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DMAX_AM_ERI=4"
    - "-DENABLE_XHOST=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-bump-cmake-min-version-for-cmake4.patch"
    description: "CMake 4.x compat: bump cmake_minimum_required 3.0->3.5 in 5 CMakeLists (top-level + 4 subprojects)"
    type: portability

knowledge_gained:
  - "libint 1.x（Libint1）与 libint2 不同：release-1-2-1 tag 是源码树，不含预生成积分核；CMake 路径通过 ExternalProject 先编译并运行 libint_compiler（纯 C 生成器）再生成库源码——不需要 perl/autotools（那只在 configure.ac 路径需要 objectdir.pl）"
  - "上游 CMake 把 DESTINATION ${CMAKE_INSTALL_PREFIX} 固化进绝对路径（ExternalProject 阶段装到 ${build}/stage${prefix}），conan 的 cmake.install() 默认 --prefix 无法覆盖；故 generate() 显式设 CMAKE_INSTALL_PREFIX=${build_folder}/_install，package() 里 cmake --install . 后整体拷入 package_folder"
  - "ENABLE_XHOST 默认 ON 会加 -march=native，去平台相关优化（OFF）保证可复现"
  - "上游静静态库输出名 int（libint.a）与 deriv（libderiv.a）≠ 包名；cpp_info.libs 写 int；libint.a 的 extern \"C\" 入口纯 C 可链接，无需 -static-libstdc++/libm"
  - "上游 CMake project(Libint VERSION 1.2.0) 与 tag 1.2.1 版本号不一致（源码自带 quirk），不影响 Conan 包版本（1.2.1）；Consumers 用 find_package(Libint) 时 conan CMakeDeps 生成 1.2.1 的 config"
  - "leaf 积分核分发表 build_eri 只填了 (is|is) 起的分块（索引 1,2,3…），[0][0][0][0] (ss|ss) 是 NULL；消费者测试抽查真实非空内核（00|p0/pp|pp/ff|ff）"
  - "libint 1.2.1 上游无任何自动化测试套件（发布包 92 个文件全部为生成器+库源码+构建/文档，无 tests/ 目录、无 test/check 源文件、无 check/test 目标、CMake 无 enable_testing/add_test），按 no_tests 口径输出 HMBS 标记"

# ── 测试信息（no_tests 口径）──
tests:
  upstream_tests_exist: false
  upstream_tests_total: 0
  upstream_test_count_method: manual_audit
  upstream_tests_note: >
    审计官方 release-1-2-1 归档（== Debian libint_1.2.1.orig.tar.gz）：92 个文件全为
    生成器（src/bin）+ 库源码（src/lib）+ 构建/文档，无 tests/ 目录、无 *test*/*check*
    源文件、Makefile 无 check/test 目标、configure.ac 无 TESTS/check_PROGRAMS 接线、
    CMakeLists.txt 无 enable_testing()/include(CTest)/add_test()、仓库无 CI 测试配置。
    status=no_tests，discovered/executed=0。
  added_consumer_entries: 1
  added_consumer_entries_note: >
    test_package 新增 1 个消费者入口：test_libint（C），真实调用 libint.a 公开 C API
    （storage 查询 / init_libint_base kernel 分发表 / init-free 生命周期 / 非法 max_am
    反向证伪），10 条断言，ctest 注册 1 个用例。
  added_consumer_passed: 1
  consumer_test: "test_package 经 ctest 驱动真实执行（discovered=1，passed=1）"

# 无独立打包产物：制品由 CI release 流水线的 conan upload 生成
