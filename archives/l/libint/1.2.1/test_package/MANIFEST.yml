# test_package/MANIFEST.yml — libint 1.2.1 上游测试声明
# CI 脚本 (build_and_test.sh L0e) / hmbs rule4 强制要求此文件存在

package: libint/1.2.1
homepage: "https://github.com/evaleev/libint"

# ─── 上游测试套件存在性 ────────────────────────────────────────────────
# 经审计官方源码归档（GitHub tag release-1-2-1 == Debian libint_1.2.1.orig.tar.gz，
# 同一 sha256）确认：libint 1.2.1 **没有任何自动化测试**。
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

# 上游测试审计（源码: release-1-2-1.tar.gz，顶层 libint-release-1-2-1/）
upstream_test_audit:
  source_tarball: "https://github.com/evaleev/libint/archive/refs/tags/release-1-2-1.tar.gz (与 Debian/Ubuntu libint_1.2.1.orig.tar.gz 逐字节一致，sha256 fe5900c98d6adfeadb69cecee9895548ef69b5464f9c2cfb85bd315cf349f3a4)"
  build_systems: "双构建入口：autotools（configure.ac + 手写 Makefile，无 automake TESTS 体系）与 CMake（Psi4 移植，src/CMakeLists.txt + ExternalProject）"
  scanned_for:
    - "tests/ / test/ 目录及 *test*/*check* 源文件"
    - "Makefile / Makefile.library / MakeRules* 中的 check/test 目标"
    - "configure.ac 中的 TESTS/check_PROGRAMS/TESTS_ENVIRONMENT 接线（仅 AC_CHECK_PROGS 编译器探测，无测试注册）"
    - "CMakeLists.txt 中的 enable_testing()/include(CTest)/add_test()/BUILD_TESTING"
    - "gtest / catch2 / cppunit / pytest / CTest 任意测试框架引用"
    - "上游仓库 CI（.github/workflows 等）测试配置"
  scan_result: "发布包共 92 个文件（含 .hgtags；实现 + 生成器 + 构建/文档），全部是生成器 + 库源码 + 构建/文档：无 tests/ 或 test/ 目录，无任何 *test*/*check* 源文件；顶层 Makefile 仅定义 default/doc/install/uninstall/clean/oclean/distclean/targetclean/realclean（无 check/test 目标）；configure.ac 只有 AC_CHECK_PROGS(CXX/AR/PERL) 与 AC_MSG_CHECKING 编译器特性探测，无测试输出文件；CMake 路径（CMakeLists.txt/src/CMakeLists.txt）无 enable_testing()/include(CTest)/add_test()；仓库无 .github/workflows 或等价 CI 测试配置。"
  reason: "libint 1.2.1（Libint1 系列）上游源码树未提供任何自动化测试套件；按 no_tests 口径如实上报（upstream_test_total=0），功能正确性由 test_package 对安装产物做实质消费者 API 验证覆盖。"

# 上游测试命令（无测试套件，不适用）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的消费者测试（真实调用库 API）
test_package_tests:
  - file: test_libint.c
    description: "消费者：仅用公开头 <libint/libint.h> 与公开 C API 真实调用安装出的 libint.a——libint_storage_required 内存查询、init_libint_base 填充 build_eri kernel 分发表（抽查 00|p0/pp|pp/ff|ff 非空）、init_libint/free_libint 完整生命周期（分配/释放 int_stack、PrimQuartet）、非法 max_am>=LIBINT_MAX_AM 必须失败（反向证伪）；10 条断言，任一失败非零退出"
    command: "ctest --output-on-failure（ctest 注册 1 个用例 libint_consumer：./test_libint）"
    count: 10

# test_package 断言合计（= PR 模板「鸿蒙特有/新增测试用例」）
assertion_count: 10
