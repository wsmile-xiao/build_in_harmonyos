# conandata.yml — libint 1.2.1（Libint1 系列）
# 源码：上游官方 GitHub tag `release-1-2-1` 的源码归档 tarball。
#   URL：https://github.com/evaleev/libint/releases/tag/release-1-2-1
#   该 tag 归档与 Debian/Ubuntu 发行版桂枝的 `libint_1.2.1.orig.tar.gz`
#   逐字节一致（顶层目录 libint-release-1-2-1，同一 sha256），即官方 1.2.1 发布源。
# GPL-3.0 仅用于生成器（src/bin/*compiler）；生成的库是 LGPL-3.0。
#
# 注意：该 tag 是 **Libint1 源码树**（含 configure.ac/Makefile/CMakeLists.txt），
#   不含预生成积分核；构建时由 CMake 的 ExternalProject 先编译并运行
#   libint_compiler 生成库源码再构建（见 conanfile.py）。
# 镜像回退由 CI 在构建期自动注入（build_and_test.sh 预下载改写），
# conandata 只保留上游官方源（R39 / PF7 源 URL 闸）。
sources:
  url: "https://github.com/evaleev/libint/archive/refs/tags/release-1-2-1.tar.gz"
  sha256: "fe5900c98d6adfeadb69cecee9895548ef69b5464f9c2cfb85bd315cf349f3a4"

patches:
  - patch_file: "patches/0001-bump-cmake-min-version-for-cmake4.patch"
    patch_description: "Bump cmake_minimum_required from 3.0 to 3.5 (5 CMakeLists) for CMake 4.x compatibility"
    patch_type: "portability"
