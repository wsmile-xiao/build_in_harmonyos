# libint 2.13.1 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "2.13.1"

# 软件名
software: "libint"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 release 预生成库 tarball，v2.13.1 tag）
  url: "https://github.com/evaleev/libint/releases/download/v2.13.1/libint-2.13.1.tgz"

  # 源码校验和
  sha256: "029e1347774bbf740e8ef9118d736413b52c023b85a5f76b61ce6fbf1ab8e43b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DLIBINT2_ENABLE_FORTRAN=OFF"
  - "-DLIBINT2_ENABLE_MPFR=OFF"
  - "-DLIBINT2_ENABLE_PYTHON=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "eigen/3.4.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libint 属'编译器+预生成库'双态架构：GitHub tag 源码包需先构建 libint 编译器再 export，应改用官方 release 预生成库 tarball（libint-2.13.1.tgz）"
- "libint2 2.13 Engine 为非模板类，构造参数为 (operator, max_nprim, max_l)；C++11 API 依赖 header-only Eigen3"
