# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试三步法）
# 实测于 aarch64-linux-ohos (clang 15.0.4)：ctest 13/13 全部通过

package: libint/2.13.1
homepage: "https://github.com/evaleev/libint"

# 上游测试命令 (CMake/CTest 项目)
upstream_check_command: "ctest --test-dir build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（ctest 13 项，全部通过）
upstream_tests:
  - file: tests/unit/test-core.cc
    source: libint-2.13.1/tests/unit/test-core.cc
    description: "unit_tests-libint2 单元测试（含 1-body 积分、core ints、精度、shell 排序等）"
    command: "ctest -R 'libint2/unit'"
  - file: tests/unit/test-1body.cc
    source: libint-2.13.1/tests/unit/test-1body.cc
    description: "单电子积分单元测试"
    command: "ctest -R 'libint2/unit'"
  - file: tests/unit/test-core-ints.cc
    source: libint-2.13.1/tests/unit/test-core-ints.cc
    description: "多电子（ERI）核心积分单元测试"
    command: "ctest -R 'libint2/unit'"
  - file: tests/unit/test-precision.cc
    source: libint-2.13.1/tests/unit/test-precision.cc
    description: "积分精度测试"
    command: "ctest -R 'libint2/unit'"
  - file: tests/eri_test.cc
    source: libint-2.13.1/tests/eri_test.cc
    description: "ERI 数值测试（run0-run4 与参考值对比）"
    command: "ctest -R 'libint2/eritest'"
  - file: tests/hf.cc
    source: libint-2.13.1/tests/hf.cc
    description: "H2 极小基 Hartree-Fock 自洽场测试（build + run）"
    command: "ctest -R 'libint2/hf'"
  - file: tests/hf.cc
    source: libint-2.13.1/tests/hf.cc
    description: "H2 极小基 HF++ 测试（build + run）"
    command: "ctest -R 'libint2/hf\\+\\+'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者验证：构造两个归一化 1s Shell，用 libint2::Engine 计算重叠积分并断言 ≈ 1.0（R34 实质调用被测包 API）"
    command: "./test_libint"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 200
