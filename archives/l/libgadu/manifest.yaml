software: libgadu
display: "libgadu"
description: "Client-side library for the Gadu-Gadu protocol (C, LGPL-2.1)"
category: network
homepage: "https://libgadu.github.io/"
license: LGPL-2.1-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "TLS/protobuf-hub/pthread-resolver are optional; --without-gnutls --without-protobuf --without-pthread keeps zero-deps offline port (OHOS lld leaves pthread_setcancelstate/pthread_cancel unresolved otherwise)"
    - "2017-era config.guess does not know HarmonyOS; pin --build=aarch64-unknown-linux-gnu to skip guessing"
  common_dependencies: []

versions:
  "1.12.2":
    status: published
    build_date: "2026-09-15"
    conan_ref: "libgadu/1.12.2"
