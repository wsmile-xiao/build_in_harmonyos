package: libgadu/1.12.2
homepage: "https://libgadu.github.io/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream automake suite (test/automatic/Makefile.am):
#   TESTS = connect convert endian1 hash message1 message2 packet protocol resolver
upstream_tests:
  - file: test/automatic/connect.c
    source: libgadu-1.12.2/test/automatic/connect.c
    description: "Network/TLS connect test (needs glibc+gnutls+pthread; SKIP without gnutls)"
    command: "./connect"
  - file: test/automatic/convert.c
    source: libgadu-1.12.2/test/automatic/convert.c
    description: "UTF-8/CP1250 encoding conversion tests (gg_encoding_convert)"
    command: "./convert"
  - file: test/automatic/endian1.c
    source: libgadu-1.12.2/test/automatic/endian1.c
    description: "Endian conversion tests"
    command: "./endian1"
  - file: test/automatic/hash.c
    source: libgadu-1.12.2/test/automatic/hash.c
    description: "Hash function tests"
    command: "./hash"
  - file: test/automatic/message1.c
    source: libgadu-1.12.2/test/automatic/message1.c
    description: "Message formatting tests"
    command: "./message1"
  - file: test/automatic/message2.c
    source: libgadu-1.12.2/test/automatic/message2.c
    description: "HTML/richtext message tests (libxml2 branch optional)"
    command: "./message2"
  - file: test/automatic/packet.c
    source: libgadu-1.12.2/test/automatic/packet.c
    description: "Protocol packet tests"
    command: "./packet"
  - file: test/automatic/protocol.c
    source: libgadu-1.12.2/test/automatic/protocol.c
    description: "Scripted protocol tests (needs perl to generate script.c; SKIP otherwise)"
    command: "./protocol"
  - file: test/automatic/resolver.c
    source: libgadu-1.12.2/test/automatic/resolver.c
    description: "Resolver tests"
    command: "./resolver"

test_package_tests:
  - file: test.c
    description: "消费者测试：gg_libgadu_version + gg_fix32/fix16 回环 + gg_crc32 确定性（离线，R34）"
    command: "./test_libgadu"

assertion_count: 4
upstream_test_count: 9
