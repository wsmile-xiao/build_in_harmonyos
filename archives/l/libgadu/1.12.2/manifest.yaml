software: libgadu
version: "1.12.2"
status: published
build_date: "2026-09-15"
conan_ref: "libgadu/1.12.2"
build_system: autotools

source:
  url: "https://github.com/wojtekka/libgadu/releases/download/1.12.2/libgadu-1.12.2.tar.gz"
  sha256: "28e70fb3d56ed01c01eb3a4c099cc84315d2255869ecf08e9af32c41d4cbbf5d"
  tar_format: tar.gz

build:
  system: autotools
  build_system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--without-gnutls"
    - "--without-protobuf"
    - "--without-pthread"
    - "--build=aarch64-unknown-linux-gnu"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "2017-era config.guess does not know HarmonyOS; pin --build=aarch64-unknown-linux-gnu to skip guessing (bash 5.3 precedent)"
  - "TLS/protobuf-hub are optional; --without-gnutls --without-protobuf keeps zero-deps offline port while core codec/message/hash tests run"
  - "2017 tentative definitions in test/manual need -fcommon (clang-15 defaults -fno-common, else duplicate symbol on config_* globals)"
