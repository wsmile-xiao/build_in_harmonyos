# test_package/MANIFEST.yml — libcompface 1.5.2
# The upstream archive has no formal test directory, registered test target,
# or make check target; the consumer test below supplies the functional checks.

package: libcompface/1.5.2
homepage: "https://github.com/SvitloLinux-pkgs/compface"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "Link libcompface, exercise API compression/decompression, and verify compface/uncompface CLI and XBM round-trips"
    command: "./test_libcompface <compface-path> <uncompface-path>"

assertion_count: 13
