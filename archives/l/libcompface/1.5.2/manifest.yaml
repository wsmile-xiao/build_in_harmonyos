version: "1.5.2"
software: "libcompface"
status: "built"
build_date: "2026-09-17"
build_system: "autotools"

source:
  url: "https://github.com/SvitloLinux-pkgs/compface/archive/1.5.2.tar.gz"
  sha256: "36c142990e423cc275147745b60b6174e501c967783d3059185a1d234fc42d32"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-Makefile.in.patch"
  - "0002-compface_private.h.patch"
  - "0003-configure.patch"
  - "0004-uncompface.c.patch"
knowledge_gained:
  - "The SvitloLinux-pkgs GitHub repository is a vanilla source mirror; its 1.5.2 branch preserves the upstream source files." # knowledge_ref: archives/l/libcompface/1.5.2/notes.md
  - "HMDFS makes the generated config.status umask 077 temporary directory unwritable; 0003-configure.patch replaces it with umask 022." # knowledge_ref: archives/l/libcompface/1.5.2/notes.md
  - "The upstream archive is static-only and also installs compface/uncompface command-line tools." # knowledge_ref: archives/l/libcompface/1.5.2/notes.md
  - "The upstream Makefile omitted compface.o from libcompface.a; the bugfix patches export both public APIs and unify legacy shared state." # knowledge_ref: archives/l/libcompface/1.5.2/notes.md
  - "The combined static library needs -fcommon for the upstream tentative global definitions." # knowledge_ref: archives/l/libcompface/1.5.2/notes.md
  - "The upstream archive has no formal test directory, registered test suite, or make check target." # knowledge_ref: archives/l/libcompface/1.5.2/notes.md

patch_classification:
  - file: "0001-Makefile.in.patch"
    type: "bugfix"
    platform_only: False
    guard: "none"
    description: "Include compface.o, honor DESTDIR, and let the OHOS recipe disable signature-invalidating stripping."
  - file: "0002-compface_private.h.patch"
    type: "bugfix"
    platform_only: False
    guard: "none"
    description: "Make shared legacy state definitions single-owner in the combined library."
  - file: "0003-configure.patch"
    type: "portability"
    platform_only: False
    guard: "none"
    description: "Use writable umask 022 for Autoconf temporary directories."
  - file: "0004-uncompface.c.patch"
    type: "bugfix"
    platform_only: False
    guard: "none"
    description: "Use external shared-state declarations in uncompface.o."
