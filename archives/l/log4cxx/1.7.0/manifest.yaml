# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_TESTING=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "expat/2.7.5 (vendored)"
    - "apr/1.7.4 (vendored)"
    - "apr-util/1.6.1 (vendored)"

  # 编译器
