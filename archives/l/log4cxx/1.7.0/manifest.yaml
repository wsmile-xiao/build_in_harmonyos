# 版本级 manifest — log4cxx 1.7.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.7.0"

# 软件名
software: "log4cxx"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-14"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
