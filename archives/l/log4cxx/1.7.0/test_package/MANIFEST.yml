# test_package/MANIFEST.yml
# 上游官方测试声明文件 — log4cxx 1.7.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 统计口径: 上游 CTest 条目 (src/test/cpp/CMakeLists.txt 注册 add_test)，
# 口径 ctest_entries；总数 64 为 88c629a 实测 ctest -N 注册数
# (63 通过 / 1 error：streamtestcase 全量套件 SEGFAULT，单用例均通过)，
# 非可运行子集。conanfile.py build() 末尾以 ctest --output-on-failure
# 真实运行，计数唯一来源为 Testing/Temporary/LastTest.log。

package: log4cxx/1.7.0
homepage: "https://logging.apache.org/log4cxx/"

upstream_test_total: 64
upstream_test_count_method: ctest_entries

upstream_tests_exist: true

upstream_test_audit:
  source_tarball: "apache-log4cxx-1.7.0.tar.gz"
  source_sha256: "b943ff170393e4ce381ab4c4914396127bf4d44fb8bd1f0e5ef8453f3c4d364c"
  upstream_tag: "1.7.0"
  upstream_repo: "https://logging.apache.org/log4cxx/"
  scanned_for:
    - "add_test (CMake)"
    - "enable_testing / include(CTest)"
    - "src/test/cpp directory"
  scan_result: "src/test/cpp/CMakeLists.txt registers CTest entries; ctest -N reports 64 entries (prior 88c629a实测)"
  reason: "upstream 1.7.0 ships a full CTest suite; recipe runs it in build() via ctest --output-on-failure"

# 上游测试命令: CTest 入口 (src/test/cpp/CMakeLists.txt 注册 add_test)
upstream_check_command: "ctest --test-dir <build> -N"

# conanfile.py build() 末尾真实执行上游测试并解析 LastTest.log
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (CTest 注册的测试可执行，代表性条目)
upstream_tests:
  - file: src/test/cpp/loggertestcase.cpp
    source: log4cxx-1.7.0/src/test/cpp/loggertestcase.cpp
    description: "Logger 基本功能测试 (CTest: loggertestcase)"
    command: "./loggertestcase -v"
  - file: src/test/cpp/loggertestcase.cpp
    source: log4cxx-1.7.0/src/test/cpp/loggertestcase.cpp
    description: "Logger 阈值测试 (CTest: loggerthresholdtests)"
    command: "./loggerthresholdtests -v"
  - file: src/test/cpp/leveltestcase.cpp
    source: log4cxx-1.7.0/src/test/cpp/leveltestcase.cpp
    description: "Level 等级测试 (CTest: leveltestcase)"
    command: "./leveltestcase -v"
  - file: src/test/cpp/ndctestcase.cpp
    source: log4cxx-1.7.0/src/test/cpp/ndctestcase.cpp
    description: "NDC 测试 (CTest: ndctestcase)"
    command: "./ndctestcase -v"
  - file: src/test/cpp/mdctestcase.cpp
    source: log4cxx-1.7.0/src/test/cpp/mdctestcase.cpp
    description: "MDC 测试 (CTest: mdctestcase)"
    command: "./mdctestcase -v"
  - file: src/test/cpp/hierarchytest.cpp
    source: log4cxx-1.7.0/src/test/cpp/hierarchytest.cpp
    description: "Logger 层级测试 (CTest: hierarchytest)"
    command: "./hierarchytest -v"
  - file: src/test/cpp/patternlayouttest.cpp
    source: log4cxx-1.7.0/src/test/cpp/patternlayouttest.cpp
    description: "PatternLayout 测试 (CTest: patternlayouttest)"
    command: "./patternlayouttest -v"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 使用 BasicConfigurator + Logger 写日志并断言"
    command: "./test_log4cxx"

test_counting:
  upstream_independent_total: 64
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

# 测试断言总数 (由实际运行日志统计)
assertion_count: 2
