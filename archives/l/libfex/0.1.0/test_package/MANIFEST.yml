# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libfex/0.1.0
homepage: "https://github.com/hbirth/libfex"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 结论：libfex 上游无任何独立测试（无 tests/ 目录、无测试框架、
# 无 ctest/make check 注册）。已完整枚举源码树：仅 examples/passthrough.cpp
# 示例（非测试用例）。全量枚举台账见 reports/test-ledger.md。
upstream_check_command: "make check"
upstream_check_result: "no-upstream-tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    source: libfex-0.1.0/test_package/test.cpp
    description: "消费者用例：继承 fex::Filesystem 实现纯虚回调，验证 lookup_root/lookupx/statx 返回值、默认实现返回 function_not_supported 错误路径、init/forget 空实现可执行、SessionOptions 默认字段"
    command: "./test_libfex"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 10
