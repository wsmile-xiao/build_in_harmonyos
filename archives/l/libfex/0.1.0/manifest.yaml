# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.1.0/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.0"

# 软件名
software: "libfex"

# 编译状态
# published | built | failed | archived
# R02：本地 W3/CI 模拟已通过但未执行制品仓 upload，按规则标 built
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R02 固定到 commit 259f1ddc 归档，见 r02-source-determination.md）
  url: "https://github.com/hbirth/libfex/archive/259f1ddc40e8a1e5bc97a096589500b3624a3a2e.tar.gz"

  # 源码校验和
  sha256: "89df810670ce36375359d8dfafcbef9d5004212a6c6299a384796bff09b5bfc1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  # 注：OHOS clang-15 下由上游 CMakeLists set(CMAKE_CXX_STANDARD 23) 自动
  # 映射为 -std=c++2b（CMake 的 CMAKE_CXX_STANDARD 只接受数值标准，写 "2b"
  # 会在 project() ABI try_compile 报 "CXX2b"），此处不再显式传参数。
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "liburing/2.15"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（与 conandata.yml 一致，共 7 个）
patches_applied:
- "0001-CMakeLists.txt.patch"
- "0002-examples-passthrough.cpp.patch"
- "0003-include-fex-expected_compat.hpp.patch"
- "0004-include-fex-filesystem.hpp.patch"
- "0005-include-fex-session.hpp.patch"
- "0006-src-session.cpp.patch"
