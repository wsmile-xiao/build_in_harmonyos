# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS libc++15 缺 <expected>（C++23 std::expected）：vendored fex/expected_compat.hpp polyfill（MIT）并在 5 处 include 改指"
- "上游 CMakeLists 要求 C++23；clang-15 需用 -std=c++2b（c++23 字面量非法），配方显式传 CMAKE_CXX_STANDARD=2b"
- "libfex 依赖 liburing>=2.5：用 Conan 包 liburing/2.15（pkg-config 名 liburing），需注入 pkgconfig 路径"

