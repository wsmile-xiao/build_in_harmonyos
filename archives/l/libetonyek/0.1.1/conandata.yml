# conandata.yml — libetonyek 0.1.1
# 官方源：LibreOffice/Document Liberation 项目自己的发布目录 dev-www.libreoffice.org
# （libetonyek 项目主页 https://wiki.documentfoundation.org/Development/libetonyek，
#   上游仓库 gitlab.libreoffice.org/libetonyek，tag 命名 libetonyek-0.1.1）
# 必须用 dist tarball（带预生成的 configure）：OHOS 设备无 automake/libtoolize，
# GitHub tag 归档不含 autotools 生成物、无法 autoreconf
# sha256 实测自该官方 tarball（本机 sha256sum）
sources:
  url: https://dev-www.libreoffice.org/src/libetonyek/libetonyek-0.1.1.tar.xz
  sha256: 9c6a5a0f15ae6cc6e2dfb2272b664dedda7918ed46f3756f9f29a72589d8c83e
patches:
  # DRAFT-E564：2012-12-29 旧式 config.guess/config.sub 不识别 HarmonyOS/ohos，
  # 且 patch-autotools-ohos.pl 的锚点全部取自 2016+ 新式脚本（旧式静默失败）。
  # 手工重锚：config.guess 在 aarch64:Linux case 前插入 aarch64:HarmonyOS 分支；
  # config.sub 两处锚点（maybe_os kernel-libc 分支行 + basic os 列表行尾）加
  # linux-ohos*。本机实测：config.guess → aarch64-unknown-linux-ohos，
  # config.sub 原样接受，musl 老路径不受影响。
  "0.1.1":
    - patch_file: patches/0001-config-guess-sub-ohos-reanchor.patch
      patch_description: Re-anchor 2012-era config.guess/config.sub for HarmonyOS (aarch64-unknown-linux-ohos), old-style script anchors per DRAFT-E564
      patch_type: portability
