# 版本级 manifest —— libetonyek 0.1.1
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.1"
software: libetonyek

status: built
build_date: "2026-09-19"
build_system: autotools

# 0.1.1 是 2013 年首个稳定版：pre-IWA 的 KEY*/PAG*/NUM* 家族（老 XML 格式解析），
# 依赖面比 0.1.13 小得多——无 mdds/glm/liblangtag（这些是后来版本引入的）。
build:
  system: autotools
  language_support: {}
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-ohos（dist 的 config.sub 是 2012-12-29 旧式，经 0001 补丁重锚后原生接受 linux-ohos 三元组）"
    - "--prefix=/；--enable-static --disable-shared（R26）；--disable-dependency-tracking"
    - "--enable-tests：构建 src/test/ 的 cppunit 聚合 `test`（九个 KEY* 套件），配方在 build() 内以 make check 执行（硬门禁）"
    - "--without-docs（文档需 doxygen，非库本体）"
    - "REVENGE / REVENGE_GENERATORS / REVENGE_STREAM / XML / ZLIB / CPPUNIT 全部 6 组 PKG_CHECK_MODULES 变量逐个导出，且**每组 CFLAGS 与 LIBS 两半都必须非空**（任一半为空会落到 pkg-config 分支，而构建环境里存在 pkg-config，会硬报错）"
    - "BOOST_CFLAGS / CPPFLAGS 注入私有头路径（spirit classic 等 boost 头仅 TU 内部使用）；librevenge 经「只放 .a 的干净 -L 目录」；libxml2/zlib 直接用各自包目录"
    - "构建期 LD_LIBRARY_PATH 显式置空（防 CI worker 环境变量污染 lld——lld 自身链接 libxml2，musl 加载器先查 LD 再查 rpath，不兼容的 libxml2.so.16 会让每次链接重定位失败）"
    - "构建期 -Wl,-rpath 烘焙进测试程序链接行（make check 运行期找共享 libxml2 用，不用 LD_LIBRARY_PATH）"
    - "gperf 3.1（hnp 工具链自带）：Token .inc 文件不在 dist tarball 里，构建时从 .gperf 现场生成（src/lib/Makefile.am 规则）"

# 版本源信息
sources:
  upstream_url: "https://gitlab.libreoffice.org/libetonyek/libetonyek"
  upstream_tag: "libetonyek-0.1.1"
  dist_tarball: "https://dev-www.libreoffice.org/src/libetonyek/libetonyek-0.1.1.tar.xz"
  sha256: "9c6a5a0f15ae6cc6e2dfb2272b664dedda7918ed46f3756f9f29a72589d8c83e"

# 依赖（0.1.1 精简面）
dependencies:
  runtime:
    - librevenge/0.0.5
    - libxml2/2.15.3.1
    - zlib/1.3.1
  build_only:
    - boost/1.90.0.3（头文件：spirit classic / any / function / lexical_cast / optional / scoped_ptr / shared_ptr / unordered_map）
    - cppunit/1.15.1（--enable-tests）
  tools:
    - gperf 3.1（hnp 工具链自带，生成 Token .inc）

patches:
  - file: patches/0001-config-guess-sub-ohos-reanchor.patch
    type: portability
    reason: >-
      dist 携带的 config.guess/config.sub 是 2012-12-29 旧式（无 GUESS= 变量风格），
      不识别 HarmonyOS/ohos 三元组；patch-autotools-ohos.pl 的锚点全部取自 2016+
      新式脚本（对旧式静默失败，DRAFT-E564）。手工重锚三处：config.guess 插入
      aarch64:HarmonyOS 分支、config.sub 的 maybe_os 分支行与 basic os 列表行各加
      linux-ohos*。本机实测 config.guess → aarch64-unknown-linux-ohos。

notes: >-
  libxml2 2.15.3 兼容性试探（任务预案点）：0.1.1 全部 libxml2 使用面仅
  xmlReaderForIO + xmlTextReader* 稳定 API（2.6 起 ABI 冻结），无需补丁。
  C++ 标准无需干预：0.1.1 的 configure.ac 无 AX_CXX_COMPILE_STDCXX 宏，SDK
  clang 默认 gnu++14 全量编译通过（0.1.13 需 -std=c++17 是 mdds 3.0 头的要求，
  0.1.1 无 mdds）。
