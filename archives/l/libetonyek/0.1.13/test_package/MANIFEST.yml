# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libetonyek/0.1.13
homepage: "https://wiki.documentfoundation.org/Development/libetonyek"

# 上游**自带**测试套件：src/test/ 下 `tests = core detection streams`，
# 三者同时登记在 check_PROGRAMS 与 TESTS 中，由 `make check` 执行；
# 其中 core 是 cppunit 聚合程序（IWA/IWORK 系列测试 TU）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check（配方 build() 内执行；--enable-tests 打开 TESTS 条件）"

upstream_tests:
  - file: src/test/core（cppunit 聚合）
    source: libetonyek-0.1.13.tar.xz
    description: >-
      核心解析测试：程序名 core，聚合 IWAFieldTest/IWAMessageTest/IWAReaderTest/
      IWORKChainedTokenizerTest/IWORKFormulaTest/IWORKPathTest/IWORKPropertyMapTest/
      IWORKShapeTest/IWORKStyleTest/IWORKStyleStackTest 等 cppunit TU
    command: "./core"
  - file: src/test/detection
    source: libetonyek-0.1.13.tar.xz
    description: "格式识别测试"
    command: "./detection"
  - file: src/test/streams
    source: libetonyek-0.1.13.tar.xz
    description: "结构化流（OLE/ZIP 包装）测试"
    command: "./streams"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libetonyek.cpp
    description: >-
      消费者功能测试：自实现最小 librevenge::RVNGInputStream（同时验证消费者可把自己
      的流类型喂给 libetonyek），断言公开枚举面（CONFIDENCE_NONE / RESULT_OK /
      TYPE_UNKNOWN 均为 0 值）、识别入口 isSupported 对不可用输入的契约（null / 空流 /
      纯文本 / 仅 ZIP 局部头），以及**被拒流不得被分类**（类型输出必须停留在
      TYPE_UNKNOWN），并验证 parse() 对不支持输入返回失败。共 9 项断言，
      失败即非零退出。
    command: "./test_libetonyek"

# 覆盖边界（如实声明）：iWork 文档是 ZIP 容器（Index/*.iwa 等部件），上游既不提供
# 样例文档也不提供内存构造器，故**正向解析**由上游 src/test/ 的 core/detection/streams
# 覆盖（本配方已在 build() 中以 make check 作硬门禁执行），test_package 只断言消费者
# 侧可验证的契约面。
# 测试断言总数（近似值，用于质量评估）：上游 3 个测试程序 + test_package 9 项断言
assertion_count: 12
