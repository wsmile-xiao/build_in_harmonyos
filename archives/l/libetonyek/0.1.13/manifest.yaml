# 版本级 manifest —— libetonyek 0.1.13
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.13"
software: libetonyek

status: built
build_date: "2026-09-14"
build_system: autotools

# ⚠️ 可退化移植（§3.6）：关闭了 liblangtag（详见 build.language_support）
build:
  system: autotools
  language_support:
    liblangtag: disabled
    reason: >-
      liblangtag 在本平台不可得：archives/l/liblangtag/0.6.4/manifest.yaml 写着
      status: published，但设备实测 `conan list "liblangtag/*" -r=ohpcd` → Found 0，
      平台 registry 全量翻页也查不到 → 按 AGENTS.md §3.7 属"有档案无发布"（发布流水线
      缺口，不是缺任务）。已按 §3.7 走上报，主库按 §3.6 走可退化移植。
    retained:
      - "iWork（Keynote/Pages/Numbers）文档解析全链路：IWA 分片读取、样式/表格/图形/文本解析、导出到 librevenge 的 text/spreadsheet/presentation 接口"
      - "格式识别（core/detection/streams 三套上游测试全部通过）"
      - "命令转换工具（--with-tools 默认开启，随包安装）"
    removed:
      - "文本段的语言标注（language tagging）：解析出的 span 不再带 liblangtag 推断的语言标签"
    user_visible_impact: >-
      仅影响解析结果中的语言元数据字段；文档内容、样式与几何不受影响。消费者若依赖
      该字段需知悉其缺失。
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-gnu（本 dist 的 config.sub 是 2022-01-03 版，aarch64 与 musl 都认）"
    - "--prefix=/；--enable-static --disable-shared（R26）；--disable-dependency-tracking"
    - "--enable-tests：构建 src/test/ 的 core/detection/streams，配方在 build() 内以 make check 执行（硬门禁）"
    - "--without-liblangtag：§3.6 可退化移植，边界见上"
    - "--with-mdds=3.0：制品仓发布的是 mdds 3.2.1（头在 include/mdds-3.0），上游默认是 2.1"
    - "--without-docs"
    - "CXXFLAGS=-std=c++17：mdds 3.0 的头使用 C++17 的 std::bool_constant，而项目用 AX_CXX_COMPILE_STDCXX_11——该宏在编译器默认已满足 C++11 时不加任何 -std（SDK clang 15 默认 gnu++14），导致 mdds 头编译失败"
    - "REVENGE / REVENGE_GENERATORS / REVENGE_STREAM / XML / ZLIB / MDDS / CPPUNIT 全部 7 组 PKG_CHECK_MODULES 变量逐个导出，且**每组 CFLAGS 与 LIBS 两半都必须非空**（任一半为空会落到 pkg-config 分支，而构建环境里存在 pkg-config，会硬报错）"
    - "BOOST_CFLAGS / GLM_CFLAGS / CPPFLAGS 注入私有头路径；librevenge 经「只放 .a 的干净 -L 目录」；libxml2/zlib 直接用各自包目录"
    - "构建期 LD_LIBRARY_PATH 注入依赖 lib 目录（上游测试程序需要共享的 libxml2）"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash；umask 077→022 改写；辅助脚本 chmod +x（E490）；TMPDIR 指向构建目录内 .tmp；CC/CXX 从 profile conf 显式导出"
  dependencies:
    - librevenge/0.0.5
    - libxml2/2.15.3.1
    - zlib/1.3.1
  build_requirements:
    - boost/1.90.0.3（tool_requires，私有头）
    - glm/1.0.3（tool_requires，私有头；configure.ac 对其为硬检查）
    - mdds/3.2.1（tool_requires，私有头）
    - cppunit/1.15.1（tool_requires，上游测试套件用）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PKG_CHECK_MODULES 的 CFLAGS 与 LIBS **两半各自独立短路**：只导出 *_CFLAGS 而 *_LIBS 留空，那一半就会去调 pkg-config。设备构建环境里确实存在 pkg-config，于是 configure 以 as_fn_error 硬失败（'Package requirements (mdds-3.0) were not met'）。每个检查的变量对必须两半都非空——头文件库可给一个无害的 -L 路径"
  - "mdds 3.x 的头要求 C++17（std::bool_constant），而 C++11 项目的 AX_CXX_COMPILE_STDCXX_11 在编译器默认已满足 C++11 时**不会添加任何 -std 标志**（SDK clang 15 默认 gnu++14）→ mdds 头编译失败。显式导出 CXXFLAGS=-std=c++17 即可（与 profile 的 cppstd=17 一致）"
  - "库名/依赖族谱要以 configure.ac 实证为准：libetonyek 除 librevenge/libxml2/zlib 外还**必需 glm 与 mdds**，且 mdds 是硬检查（PKG_CHECK_MODULES 无 fallback 动作）"
  - "上游有测试套件时优先跑它而不是自造：libetonyek 的 src/test/ 把 core/detection/streams 同时登记在 check_PROGRAMS 与 TESTS 上，make check 直接可用（--enable-tests + cppunit）"
  - "重载函数传 nullptr 会有歧义：libetonyek 的 EtonyekDocument::parse 按三种 librevenge 生成器接口重载，消费者测试必须显式 static_cast 到目标接口类型"
