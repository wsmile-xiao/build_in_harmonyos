# libindi 软件级 manifest.yaml
# 文件位置: archives/l/libindi/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: libindi
display_name: libindi - INDI 协议天文仪器库
category: astronomical

description: |
  libindi 是 INDI (Instrument Neutral Distributed Interface) 协议的实现，
  用于天文仪器的控制和通信。提供 indiserver 服务器和 libindiclient 客户端库。

license: GPL-2.0+
homepage: https://indilib.org/

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.5.1-r1":
    status: published
    build_date: "2026-06-08"
    patches: 2
    notes: |
      - CMake UNIX 变量问题已修复 (E012)
      - select.h 头文件缺失已修复
      - libnova 依赖已解决

# ============================================================
# 依赖关系
# ============================================================

dependencies:
  runtime:
    - libnova/0.14.0 (REQUIRED)
    - cfitsio/4.6.4
    - zlib/1.3.1
    - libev/4.33
  build:
    - cmake

# ============================================================
# 知识沉淀索引
# ============================================================

knowledge_entries:
  - E011 (HMDFS 权限问题，通过 libnova 间接影响)
  - E012 (CMake UNIX 变量识别问题)