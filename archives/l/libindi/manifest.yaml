software: libindi
display: "INDI (Instrument Neutral Distributed Interface)"
description: "天文仪器控制协议和库，支持望远镜、相机、聚焦器等设备的网络化控制"
category: astronomy
homepage: "https://indilib.org"
license: LGPL-2.1+
build_system: cmake

ohos_adaptation:
  key_points:
    - "使用 CMake 构建系统，需设置 CMAKE_SYSTEM_NAME=Linux（E092）"
    - "stime syscall 不可用，需替换为 clock_settime()"
    - "mremap syscall 不支持，需使用 munmap+mmap 兼容路径"
    - "需要链接 c++ 和 c++abi 库"
  common_dependencies:
    - cfitsio
    - nova
    - libusb1
    - curl
    - gsl
    - jpeg
    - zlib

versions:
  "2.2.2":
    status: built
    build_date: "2026-06-04"
    source_url: "https://github.com/indilib/indi/archive/refs/tags/v2.2.2.tar.gz"