# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# R51 申报 (libindi v2.2.2 上游测试, 2026-09-21 实测):
#   - libs/ 下 tests 目录数: 0
#   - CTest 注册数: 10 项单元测试 (test/, gtest) + 5 个集成测试可执行 (integs/, gtest_discover_tests)
#     - test/core:        test_base64, test_property_class, test_rotator_limits,
#                          test_libnova_nutation, test_libastro
#     - test/celestrondriver: test-celestrondriver
#     - test/drivers:     test_ccd_simulator
#     - test/scopesim_helper: test_scopesim_helper
#     - test/alignment:   test-alignment, test-alignment-plugins (需 erfa, 条件编译)
#     - test/lx200drivers: test-lx200drivers — 上游已注释禁用 (test/CMakeLists.txt)
#   - integs/: XmlAwaiterTest, TestIndiserverSingleDriver, TestClientQueries,
#              TestIndiSetProp, TestIndiClient (gtest_discover_tests, 需真机驱动)

package: libindi/2.2.2.1
homepage: "https://indilib.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --test-dir <build> --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/core/test_base64.cpp
    source: libindi-2.2.2.1/test/core/test_base64.cpp
    description: "base64 编解码单元测试 (gtest, 链接 indiclient)"
    command: "ctest -R test_base64"
  - file: test/core/test_property_class.cpp
    source: libindi-2.2.2.1/test/core/test_property_class.cpp
    description: "INDI 属性类单元测试 (gtest, 链接 indiclient)"
    command: "ctest -R test_property_class"
  - file: test/core/test_libnova_nutation.cpp
    source: libindi-2.2.2.1/test/core/test_libnova_nutation.cpp
    description: "libnova 章动计算单元测试 (gtest, 链接 indidriver)"
    command: "ctest -R test_libnova_nutation"
  - file: test/core/test_libastro.cpp
    source: libindi-2.2.2.1/test/core/test_libastro.cpp
    description: "天文计算单元测试 (gtest, 链接 indidriver)"
    command: "ctest -R test_libastro"
  - file: test/celestrondriver/test_celestrondriver.cpp
    source: libindi-2.2.2.1/test/celestrondriver/test_celestrondriver.cpp
    description: "Celestron 驱动单元测试 (gtest)"
    command: "ctest -R test-celestrondriver"
  - file: test/drivers/test_ccd_simulator.cpp
    source: libindi-2.2.2.1/test/drivers/test_ccd_simulator.cpp
    description: "CCD 模拟器驱动单元测试 (gtest)"
    command: "ctest -R test_ccd_simulator"
  - file: test/scopesim_helper/test_scopesim_helper.cpp
    source: libindi-2.2.2.1/test/scopesim_helper/test_scopesim_helper.cpp
    description: "望远镜模拟器辅助单元测试 (gtest)"
    command: "ctest -R test_scopesim_helper"
  - file: test/alignment/test_alignment.cpp
    source: libindi-2.2.2.1/test/alignment/test_alignment.cpp
    description: "极轴对齐单元测试 (gtest)"
    command: "ctest -R test-alignment"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 libindi 核心 base64 C API (to64frombits/from64tobits) 并校验往返一致性"
    command: "./test_libindi"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
