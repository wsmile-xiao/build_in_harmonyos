# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libisofs/1.5.6
homepage: "http://libburnia-project.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 tarball 无 test/ 目录；Makefile.am 中单元测试被上游注释禁用 (ticket 147)，
# make check 无注册目标 (Nothing to be done for 'check')。故无上游测试可声明。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：iso_lib_version/iso_init/iso_finish 实际调用 libisofs API"
    command: "./test_libisofs"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
