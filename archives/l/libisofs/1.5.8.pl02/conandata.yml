  sha256: "10bd584d8f00d8091e814902b9f0a3e209f16e938f510fc23ba05f3fa469db5a"

patches:
  - patch_file: "patches/0001-config.sub.patch"
    patch_description: "Accept linux-ohos triples in the bundled config.sub (config.guess on an OHOS PC reports aarch64-unknown-linux-ohos, which upstream config.sub rejects)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.patch"
    patch_description: "Create the config.status tmp dir with umask 002 instead of 077 (HMDFS setgid build dirs make umask 077 dirs group-unwritable and break configure re-runs)"
    patch_type: "portability"
