# 版本级 manifest — libisofs 1.5.8.pl02
# 文件位置: archives/l/libisofs/1.5.8.pl02/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-version.yaml

version: "1.5.8.pl02"

software: "libisofs"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-09-17"
build_system: "autotools"

source:
  url: "https://files.libburnia-project.org/releases/libisofs-1.5.8.pl02.tar.gz"
  sha256: "10bd584d8f00d8091e814902b9f0a3e209f16e938f510fc23ba05f3fa469db5a"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "configure + make -j1（AutotoolsToolchain，CC/AR 取自 Conan tools.build:compiler_executables）"
    - "OHOS 交叉：--build/--host=aarch64-unknown-linux-gnu（a52dec 范式，绕过 E160 config.guess 不识 HarmonyOS；0001 补丁另放行 linux-ohos triple）"
    - "可选依赖（zlib/libacl/xattr/libjte/lfa-flags/projid）保持 configure 探测默认，缺失降级，不强制启用也不显式禁用"
    - "static 变体默认（shared=False, fPIC=True）；shared 变体经 libtool -version-info 产 libisofs.so.6（SONAME 实测）"
  dependencies:
    - "zlib/1.3.1.1（configure 探测 OHOS sysroot zlib.h+libz 成功，ZLIB_DEF 设置，zisofs/gzip 过滤器编入库，为真实链接依赖）"
    - "xattr（XATTR_DEF/LFA_DEF/PROJID_DEF 探测启用，系统头文件，无需 Conan 依赖）；ACL/JTE 未探测到，降级"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-config.sub.patch — config.sub 接受 linux-ohos triple（OHOS config.guess 报 aarch64-unknown-linux-ohos，上游 config.sub 拒绝；E007）"
  - "patches/0002-configure.patch — configure 生成 config.status 临时目录的 umask 077→002（HMDFS setgid 构建目录下 077 目录组不可写，重跑 configure 失败；E011/E129）"

knowledge_gained:
  - "上游 1.5.8 无活跃自动化测试：Makefile.am 的 check_PROGRAMS unit-test 段整段被注释（ts A90428 ticket 147），tarball 无 test/ 目录；demo/demo 为无断言演示程序"
  - "API 陷阱：iso_read_opts_new() 默认 noaaip=1（fs_image.c:7363），import 前须显式 iso_read_opts_set_no_aaip(ropts, 0)，否则读回丢 AAIP xattr；写端 iso_write_opts_set_aaip(1) 只影响写入方向"
  - "非标准 Autotools 布局：libisofs/ 子目录无自己的 Makefile.am，库/头文件/pc 文件全部由顶层 Makefile.am 定义（libisofs/libisofs.la、libinclude_HEADERS 装到 include/libisofs/）"
  - "可选依赖探测：zlib（zisofs/gzip 过滤器）、libacl/xattr（AAIP 系统适配器）、libjte（Jigdo 模板）、lfa-flags、projid 均为 configure 探测、缺失降级，无必需第三方依赖（THREAD_LIBS 为 -lpthread）"
  - "OHOS 上 __linux__ 已定义，aaip_0_2.c 自动选用 aaip-os-linux.c（Linux xattr 系统适配器）；musl tm_gmtoff/timezone 均存在，时间处理路径无移植问题"
  - "struct burn_source 完整定义需在 include 前定义 LIBISOFS_WITHOUT_LIBBURN（上游 demo/demo.c 同款做法）；burn_source_free 未导出，释放用 burn_src->free_data(burn_src)+free(burn_src)"
  - "iso_memory_stream_new 接管 buf 所有权并 free()，须传 malloc 缓冲（不能传静态数组）；xattr 数组释放用 iso_node_get_attrs flag bit15 重调（无独立 *_free 函数）"
