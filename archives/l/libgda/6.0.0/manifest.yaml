software: libgda
version: 6.0.0
status: built
build_system: meson
compiled_date: 2025-05-21

dependencies:
  required:
    - glib-2.0 >= 2.38
    - libxml-2.0
    - sqlite3 >= 3.22
    - iso-codes
  build:
    - meson >= 0.49
    - valac
    - intltool-merge
    - glib-genmarshal
    - glib-mkenums

configure_options:
  - -Dui=false
  - -Dexperimental=false
  - -Dtools=false
  - -Ddoc=false
  - -Dexamples=false
  - -Djson=false
  - -Dlibsoup=false
  - -Dlibsecret=false

products:
  library:
    - libgda-6.0.so.6 (15.7MB)
  pkgconfig:
    - libgda-6.0.pc
  headers:
    - libgda-6.0/libgda/
  providers:
    - libgda-sqlite-6.0.so

quality_gates:
  G1_binary完整性: PASS
  G2_pkgconfig: PASS
  G3_headers: PASS
  G4_providers: PASS
