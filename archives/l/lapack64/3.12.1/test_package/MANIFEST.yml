package: lapack64/3.12.1
upstream_test_in_build: false
upstream_tests:
  - suite: "LAPACK 上游测试套件 64 位模式（testing/LIN + testing/EIG + MATGEN，14 驱动 × 74 次运行（消耗 47 个输入文件；上游 .in 清单共 67 个，bak/bal/dmd 等 20 个不在默认全量内））"
    description: "上游 make 路径真机（os=OHOS armv8）全量编译运行：14 个测试驱动（xlintst{s,d,c,z} + xlintstds/xlintstzc + xlintstrf{s,d,c,z} + xeigtst{s,d,c,z}）共 74 次运行、消耗 47 个不同输入文件（上游 testing/*.in 清单 67 个，bak/bal/dmd 等 20 个不在默认全量内），ILP64 模式（-fdefault-integer-8）下真实数值校验。结果与统计口径见 notes.md 与 reports/lapack64-upstream-testing-log.md（真机探索运行，非 conan create 内执行）"
test_package_tests:
  - file: test.c
    description: "直接链接 liblapack64+libblas64+FortranRuntime 做真实数值计算：dgemm_（矩阵乘）与 dgesv_（线性方程组求解），int64 整数参数，逐项对照手算值校验而非仅解析符号"
    command: "./test_probe"
assertion_count: 2
