# 软件级 manifest — libtk-img
# 遵循 ARCHIVE-SPEC v2.0

software: libtk-img
display: "Img (TkImg) — Tcl/Tk 图像格式扩展"
description: "为 Tcl/Tk 提供 BMP/GIF/ICO/JPEG/PCX/PIXMAP/PNG/PPM/PS/SGI/SUN/TGA/TIFF/WINDOW/XBM/XPM/DTED/RAW/FLIR 等图像格式读写能力的 Tcl 扩展（PDF 经 ps 处理器 + Ghostscript）"
category: gfx
homepage: "https://sourceforge.net/projects/tkimg/"
license: BSD-2-Clause

build_system: autotools

ohos_adaptation:
  key_points:
    - "uname shim：uname -s 在 OHOS 返回 HarmonyOS，内嵌 compat/libtiff、compat/libjpeg 的 config.guess 不识别 → tif_config.h/tiffconf.h/jconfig.h 不生成；须前置 shim 报 Linux/6.6/aarch64"
    - "TEA 构建需 tcl_cv_sys_version=Linux-6.6 + ac_cv_prog_cc_works=yes 才能得到正确 SHLIB_LD"
    - "umask 077 → 022（E011，HMDFS 拒绝 0600 临时目录）"
    - "tkConfig.sh 发行内容含 -L//lib -ltkstub 与字面量 ${TCL_ROOT} → 须改写 Makefile 指向 conan tcl/tk 包 lib/"
    - "TEA_PATH_X 找不到 X11 时退化为裸 -lX11 → window/xpm 处理器补 -L<libx11包>/lib"
    - "只用 AutotoolsToolchain（AutotoolsDeps 会把 LIBS=-ltcl9tk9.0 注入 conftest 导致 cannot run C compiled programs）"
    - "window/window.c 直接 include X11/Xproto.h（libx11 与 tk 包都没有）→ 依赖 header-library xorgproto 并把其 include 加入 CPPFLAGS"
    - "顶层 Makefile all: 递归（for sub in $(SUBDIRS); do cd $sub && make all; done）在本平台实测可用 —— 前提是 configure 已完整跑完、子目录 Makefile 齐备；随后 make install-libraries 做 collate（合并 pkgIndex.tcl）"
  common_dependencies:
    - tcl
    - tk
    - libx11
    - xorgproto

versions:
  "2.1.1":
    status: built
    build_date: 2026-10-08
