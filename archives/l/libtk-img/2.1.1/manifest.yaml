# 版本级 manifest — libtk-img (Img / TkImg) 2.1.1
# 遵循 ARCHIVE-SPEC v2.0（字段沿用仓库近期形态）

software: libtk-img
version: "2.1.1"
status: built
build_date: "2026-10-08"
build_system: autotools
conan_ref: "libtk-img/2.1.1"
issue: "not-tracked"
difficulty: "B"

source:
  url: "https://downloads.sourceforge.net/project/tkimg/tkimg/2.1/tkimg%202.1.1/Img-2.1.1.tar.gz"
  sha256: "0e41efa886c470ca0c38663e66640eb6d89e9e5f746724535ac224e2509ae34f"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-tcl=<tcl包>/lib"
    - "--with-tk=<tk包>/lib"
    - "tcl_cv_sys_version=Linux-6.6"
    - "ac_cv_prog_cc_works=yes"
  cc: clang
  cxx: clang++
  extra_steps:
    - "所有 configure 的 umask 077 → 022（E011，HMDFS 拒绝 0600 临时目录）"
    - "uname shim + compat/**/config.guess 桩化为 aarch64-unknown-linux-gnu"
    - "47 个 Makefile 修补：-L${TCL_ROOT}/lib、-L//lib、-lX11、CPPFLAGS += -I<xorgproto>/include"
    - "make install-libraries INSTALL_ROOT=<build>/_stage（collate + 合并 pkgIndex.tcl）"

dependencies:
  required:
    - tk/9.0.3.2
    - libx11/1.8.13
    - xorgproto/2025.1
  transitive:
    - tcl/9.0.3.2
    - libxcb/1.17.0
    - libxau/1.0.11
    - libxdmcp/1.1.5
    - xtrans/1.4.0
    - xcb-proto/1.17.0
  bundled_in_source:
    - zlib (compat/)
    - libpng (compat/)
    - libtiff (compat/)
    - libjpeg (compat/)

patches_applied:
  - "0001-ohos-consumer-test.patch"

artifacts:
  runtime_dir: "lib/Img2.1.1"
  libraries:
    - lib/Img2.1.1/libtcl9tkimg2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgbmp2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgdted2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgflir2.1.1.so
    - lib/Img2.1.1/libtcl9tkimggif2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgico2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgjpeg2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgpcx2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgpixmap2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgpng2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgppm2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgps2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgraw2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgsgi2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgsun2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgtga2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgtiff2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgwindow2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgxbm2.1.1.so
    - lib/Img2.1.1/libtcl9tkimgxpm2.1.1.so
    - lib/Img2.1.1/libtcl9zlibtcl1.3.2.so
    - lib/Img2.1.1/libtcl9pngtcl1.6.55.so
    - lib/Img2.1.1/libtcl9tifftcl4.7.1.so
    - lib/Img2.1.1/libtcl9jpegtcl10.0.0.so
  pkg_index: "lib/Img2.1.1/pkgIndex.tcl"
  config_scripts:
    - lib/tkimgConfig.sh
    - lib/jpegtclConfig.sh
    - lib/pngtclConfig.sh
    - lib/tifftclConfig.sh
    - lib/zlibtclConfig.sh
  headers:
    - include/tkimg.h
    - include/tkimgDecls.h
  main_package: "Img 2.1.1（包 ifneeded 由 img::base 的 pkgIndex 提供，加载 14 个处理器）"

validation:
  upstream_tests: "tests/all.tcl（tcltest；等价上游 `make tcltests` = `cd tests && tclsh all.tcl`）"
  upstream_tests_result: "Total 315 / Passed 297 / Skipped 18 / Failed 0（20 个测试文件）"
  upstream_tests_skip_reason: "18 例受 Ghostscript 约束（pdf-* 9 + ps-* 9），OHOS 宿主无 ghostscript"
  added_ohos_tests: "tests/ohos.test — 25 例鸿蒙消费者可行性用例（dlopen 全部处理器 + BMP 往返）"
  test_package: "test_package/run_test.sh → test_consumer.tcl —— tclsh9.0 真实加载 Img 并做 16x8 BMP 写盘/读回逐像素比对（31 项断言，failures=0）"
  ohos_device: "passed on the OHOS device runner（conan create 全链路）"
  log: "reports/test-report.md / reports/conan-verify-report.md"

knowledge_gained:
  - "Img/TkImg 的 TEA 顶层 Makefile 的 all:/collate 递归用 here=`pwd`，在本平台实测可用——早期失败的真因是 configure 未跑完、子目录 Makefile 未生成（ref: build() 实测对比）"
  - "AutotoolsDeps 会把依赖的 LIBS（-ltcl9tk9.0 …）注入每个 conftest 链接，OHOS 宿主上直接导致 configure: cannot run C compiled programs；本项目必须只用 AutotoolsToolchain（ref: conanfile.py generate() 注释与实测）"
  - "tk 包发行的 tkConfig.sh 带 -L//lib、-I//include 与 ${TCL_ROOT} 字面量，任何 TEA 消费方都会报 unable to find library -ltclstub/-ltkstub，必须改写生成的 Makefile（ref: 问题表 #4）"
  - "OHOS 上 uname -s 返回 HarmonyOS 会让内嵌 compat/libtiff、compat/libjpeg 的 config.guess 失败（cannot guess build type）；除 uname shim 外还需把 compat/**/config.guess 桩化，因为 conanbuild.sh 前置的 PATH 可能盖住 shim（ref: 问题表 #2）"
  - "window/window.c 直接 include X11/Xproto.h，该头既不在 libx11 包也不在 tk 包，只有 header-library xorgproto 提供（ref: 问题表 #6）"
  - "处理器经 tkConfig.sh 的 SHLIB_LD_LIBS 链接 libX11.so.6，运行期还需 libxcb.so.1；只把 libx11 的 lib/ 放进 LD_LIBRARY_PATH 会在 dlopen 阶段报 Error loading shared library libxcb.so.1（ref: 问题表 #7）"
  - "宿主默认 PATH 上没有 tclsh，上游 Makefile 的 tcltests 目标（裸 tclsh）在 CI 会 127；改用 tcl 包内 bin/tclsh9.0 绝对路径执行同一入口 tests/all.tcl（ref: notes.md 注意事项）"
  - "OHOS 上解释器退出路径可能被 Tk 拆除拖住，重定向到文件时 stdio 是块缓冲会丢结果；上游测试须用无缓冲包装器 + timeout 包裹（ref: _UNBUFFERED_RUNNER）"
  - "包的产物布局是 lib/Img2.1.1/ 下 24 个 .so + 合并 pkgIndex.tcl，Img 是 dlopen 形态扩展、不导出可链接 libs（ref: manifest.artifacts）"
