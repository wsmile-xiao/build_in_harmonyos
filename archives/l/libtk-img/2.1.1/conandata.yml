# conandata.yml — libtk-img (Img / TkImg) 2.1.1
#
# 源码：SourceForge 官方工程 tkimg 的 2.1.1 发行包。
# 注意必须用 downloads.sourceforge.net 直链：/download 形式会返回 HTML 重定向页，
# conan 的 get() 会报 BadZipFile / 校验失败。
sources:
  url: "https://downloads.sourceforge.net/project/tkimg/tkimg/2.1/tkimg%202.1.1/Img-2.1.1.tar.gz"
  sha256: "0e41efa886c470ca0c38663e66640eb6d89e9e5f746724535ac224e2509ae34f"

patches:
  "2.1.1":
    - patch_file: "patches/0001-ohos-consumer-test.patch"
      patch_description: >-
        OHOS 适配：向上游测试套件新增鸿蒙消费者可行性用例 tests/ohos.test。
        验证 Img 主包与全部 20 个格式处理器在 HarmonyOS 上可被消费者
        （tclsh9.0）真实 dlopen 加载，并完成一次 BMP 写盘→读回的逐像素往返。
        由 tests/all.tcl 的 tcltest 框架自动收集（无源码行为改动）。
      patch_type: "portability"
