package: libtk-img/2.1.1

# ── 层 1：上游官方测试（docs/TEST_QUALITY_SPEC §3.1，在 conanfile.py build() 末尾执行）
upstream_test_in_build: true
upstream_tests:
  - name: "tests/all.tcl（tcltest 框架；等价于上游 Makefile 的 `make tcltests` = `cd tests && tclsh all.tcl`）"
    command: "cd <build>/tests && <tcl包>/bin/tclsh9.0 <build>/_unbuffered_all_tcl.tcl <build>/tests/all.tcl"
    result: "pass"
    total: 315
    passed: 297
    failed: 0
    skipped: 18
    test_files: 20
    skip_reason: "18 例受 Ghostscript 约束（上游 constraints.tcl: haveGs 探测 gs/gswin64c/gswin32c，OHOS 宿主无 ghostscript）：pdf-* 9 例 + ps-* 9 例；与平台适配无关"
    log: "<build_folder>/upstream-tests.log（conan create 构建期生成）"
    note: >-
      上游测试入口自 v2.1.1 起为 TEA tcltest 套件（无 `make check`；Makefile 的
      `test:` 目标依赖 all/tcltests/visualtests/dpitests）。这里执行 `tcltests`
      对应的同一入口 tests/all.tcl。visualtests 需要真实显示设备、dpitests 需要
      X 屏幕 DPI，均非本平台可自动化项，故不纳入。

# ── 适配新增的鸿蒙测试用例（由 patches/0001-ohos-consumer-test.patch 提供）
added_upstream_tests:
  - file: "tests/ohos.test"
    tests: 25
    result: "pass (25/25)"
    description: >-
      鸿蒙消费者可行性用例：package require Img（2.1.1）、info sharedlibextension=.so、
      tcl_platform 断言、逐个 dlopen 19 个格式处理器、BMP 写盘→读回逐像素一致。
      由 tests/all.tcl 自动收集。

# ── 层 2：test_package（消费者视角）
test_package_tests:
  - runner: run_test.sh
    file: test_consumer.tcl
    description: >-
      R34 消费者可用性：用 tcl/9.0.3.2 包自带 tclsh9.0 真实启动，仅经
      pkgIndex.tcl → load → package require 使用本包；断言主包版本、
      .so 后缀、64 位字长、20 个处理器 + 4 个 compat 包装可 dlopen，
      并完成真实图像往返（16x8 生成→BMP 写盘→读回→逐像素比较）。
    command: "/bin/sh run_test.sh <tcl包>/bin/tclsh9.0 test_consumer.tcl <Img 运行时目录>"
    env: "conanfile.py test() 内联 LD_LIBRARY_PATH（tcl/tk/libx11/libxcb/libxau/libxdmcp 的 lib/）与 TCLLIBPATH（<pkg>/lib/Img2.1.1 + tcl lib + tk lib）"
    assertions: 31
assertion_count: 31
