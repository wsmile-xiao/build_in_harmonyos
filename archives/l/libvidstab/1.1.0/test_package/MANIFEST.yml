# test_package/MANIFEST.yml — libvidstab 1.1.0
# what this test_package exercises (must be real API, not version-only)
checks:
  - "VSFrameInfo vsFrameInfoInit (frame metadata creation)"
  - "VSMotionDetectConfig vsMotionDetectConfigInit (motion-detect config)"
  - "VSTransformations vsTransformationsInit (transformations container init)"
  - "vsFrameInfoCleanup / vsMotionDetectionCleanup / vsTransformationsCleanup (destructors)"
  - "addTransforms (combine two transforms, assert near-zero for inverse pair)"
  - "nullTransform / getRBRepr (transform identity + repr helpers)"
  - "full lifecycle on a synthesized 2-frame buffer — links & calls vid.stab core"
