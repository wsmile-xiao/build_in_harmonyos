version: "1.1.0"
software: libvidstab
package: libvidstab
status: built
build_date: "2026-09-18"
build_system: cmake
upstream:
  url: "https://github.com/georgmartius/vid.stab"
  tag: "v1.1.0"
  source: "https://github.com/georgmartius/vid.stab/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "14d2a053e56edad4f397be0cb3ef8eb1ec3150404ce99a426c4eb641861dc0bb"
  license: "LGPL-2.1-or-later (library, src/); GPL-2.0 (transcode CLI / tests)"
  build: cmake
build:
  cmakelists: CMakeLists.txt
  generators: ["CMakeToolchain", "CMakeDeps"]
  variables:
    SSE2_FOUND: "FALSE"   # 1.1.0 FindSSE is /proc/cpuinfo/ELSE-based; HarmonyOS system name hits ELSE branch that sets it true -> -msse2 on aarch64. Pre-seed cache to FALSE.
    CMAKE_POLICY_VERSION_MINIMUM: "3.5"   # cmake_minimum_required(2.6) vs CMake >= 4
    USE_OMP: "OFF"     # OHOS aarch64 has no usable libgomp/libomp runtime
ohos:
  target: { os: OHOS, arch: armv8 }
  notes: |
    1.1.0 (unlike 1.1.2) uses the OLD /proc/cpuinfo-based FindSSE.cmake:
    for CMAKE_SYSTEM_NAME=HarmonyOS its final ELSE branch sets
    SSE2_FOUND=TRUE, which would add -msse2 -DUSE_SSE2 and break the
    aarch64 build (1.1.0 has no sse2neon.h).  The recipe pre-seeds the
    SSE2_FOUND cache variable to FALSE (a non-FORCE set() cannot overwrite
    an existing cache entry), so every x86 intrinsic block in
    motiondetect_opt.c stays under #ifdef USE_SSE2 (portable C path).
    No portability patch required.
    The top-level CMakeLists.txt of 1.1.0 only builds the vidstab library
    (no transcode/ — so no VIDSTAB_NO_TRANSCODE needed, and no FFmpeg
    anywhere in the library build).
    Upstream unittest: 11/11 unit tests (1566 checks) run natively in
    build(); NOTE 1.1.0's unittest_summary() returns units_failed==0,
    i.e. exit code 1 means ALL PASSED (inverted vs 1.1.2).
