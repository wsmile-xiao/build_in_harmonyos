version: "1.1.2"
package: libvidstab
upstream:
  url: "https://github.com/georgmartius/vid.stab"
  tag: "v1.1.2"
  source: "https://github.com/georgmartius/vid.stab/archive/refs/tags/v1.1.2.tar.gz"
  sha256: "96db34d48a9e3aa13736a48744b56dfb76731ac9bb5193c716de8534c9fd709d"
  license: "LGPL-2.1-or-later (library, src/); GPL-2.0 (transcode CLI / tests)"
  build: cmake
build:
  cmakelists: CMakeLists.txt
  generators: ["CMakeToolchain", "CMakeDeps"]
  variables:
    USE_SSE2: "OFF"   # upstream FindSSE.cmake already yields OFF on AArch64; explicit
    USE_OMP: "OFF"     # OHOS aarch64 has no usable libgomp/libomp runtime
    VIDSTAB_NO_TRANSCODE: "ON"   # transcode CLI links FFmpeg; out of scope for the lib
ohos:
  target: { os: OHOS, arch: armv8 }
  notes: |
    Upstream arch detection (CMakeModules/FindSSE.cmake) correctly rejects
    SSE/SSE2/AVX on AArch64 (try_compile(TestSSE2.c) fails: xmmintrin.h is
    x86-only), so no -msse/-mavx flags reach armv8.  Source guards every
    x86 intrinsic block under #ifdef USE_SSE2 and ships sse2neon.h for the
    NEON path.  No portability patch required.
