software: libde265
version: "1.0.18"
status: success
build_system: cmake
compile_date: 2026-04-20
homepage: https://github.com/strukturag/libde265
license: LGPL-3.0-or-later
description: Open h.265/HEVC video codec implementation - H.265视频解码库

# 源码信息
source_url: https://github.com/strukturag/libde265/releases/download/v1.0.18/libde265-1.0.18.tar.gz
source_format: tar.gz
source_download_method: git clone（SSL证书绕过）

# 构建参数
build_config:
  target: aarch64-unknown-linux-ohos
  cmake_generator: Unix Makefiles
  cmake_build_type: Release
  cmake_install_prefix: /storage/Users/currentUser/tmp/libde265-build/install
  compiler_c: clang
  compiler_cxx: clang++
  compiler_version: "15.0.4"
  libc: musl libc
  cxx_stdlib: libc++
  
configure_options:
  - CMAKE_BUILD_TYPE=Release
  - CMAKE_INSTALL_PREFIX=/storage/Users/currentUser/tmp/libde265-build/install
  - CMAKE_C_COMPILER=clang
  - CMAKE_CXX_COMPILER=clang++

# 构建环境
build_env:
  CC: clang
  CXX: clang++
  TMPDIR: /storage/Users/currentUser/tmp
  LD_LIBRARY_PATH: /storage/Users/currentUser/tmp/libde265-build/install/lib

# 补丁信息
patches_applied:
  - name: 0001-arm64-platform.patch
    file: CMakeLists.txt
    description: "ARM64平台禁用ARM32汇编代码优化"
    category: platform_compatibility
    kb_ref: "ARM64-ASM-001"
    type: platform_only
    guard: "#ifdef HAVE_ARM64"
  - name: 0002-libcpp-link.patch
    file: dec265/CMakeLists.txt
    description: "libc++标准库显式链接修复"
    category: linker_fix
    kb_ref: "LIBCPP-LINK-001"
    type: build_fix
    guard: "if(HAVE_LIBCPP)"

# 生成产物
artifacts:
  libraries:
    - name: libde265.so
      size: 678KB
      type: shared_library
      path: lib/libde265.so
      rpath_issue: 需LD_LIBRARY_PATH
  headers:
    - name: de265.h
      size: 18KB
      type: header
      path: include/libde265/de265.h
    - name: de265-version.h
      size: 1KB
      type: header
      path: include/libde265/de265-version.h
  executables:
    - name: dec265
      size: 43KB
      type: executable
      path: bin/dec265
      note: 需设置LD_LIBRARY_PATH运行
  configs:
    - name: libde265.pc
      type: pkgconfig
      path: lib/pkgconfig/libde265.pc
    - name: libde265-config.cmake
      type: cmake_config
      path: lib/cmake/libde265/libde265-config.cmake

# 测试结果
test_result:
  type: custom_c_program
  passed: 15
  failed: 0
  total: 15
  success_rate: 100.0%
  test_date: 2026-04-20 16:35
  test_program: /storage/Users/currentUser/tmp/test_libde265
  test_report: reports/test-report.md
  test_coverage:
    - "版本信息查询 (version string, version number)"
    - "解码器生命周期 (new, free)"
    - "错误处理 (error text, isOK)"
    - "日志配置 (disable_logging, set_verbosity)"
    - "多线程 (start_worker_threads)"
    - "数据流处理 (push_data, flush_data)"
    - "解码执行 (decode)"

# 遇到的问题和解决方案
known_issues:
  - id: SSL-CERT-001
    description: "源码下载SSL证书验证失败"
    severity: minor
    solution: "使用git clone替代wget绕过SSL验证"
    status: resolved
  - id: ARM64-ASM-001
    description: "ARM32汇编代码不兼容ARM64平台"
    severity: critical
    solution: "修改CMakeLists.txt禁用ARM汇编优化"
    status: resolved
    kb_ref: E07x
  - id: LIBCPP-LINK-001
    description: "dec265工具libc++符号链接失败"
    severity: critical
    solution: "显式链接c++标准库"
    status: resolved
  - id: HMDFS-FIFO-001
    description: "HMDFS不允许创建fifo，影响make jobserver"
    severity: minor
    solution: "make自动降级单进程模式"
    status: resolved
    note: 不影响编译结果
  - id: RPATH-001
    description: "dec265 RPATH设置不正确"
    severity: minor
    solution: "patchelf修复失败（平台限制），使用LD_LIBRARY_PATH"
    status: workaround

# 知识库贡献
knowledge_gained:
  - topic: arm64-asm-compatibility
    pattern: "ARM32汇编代码(#ifdef __arm__)在ARM64平台编译失败"
    solution: "添加HAVE_ARM64检测，在ARM64平台禁用ARM汇编"
    applicability: "所有包含ARM汇编的cmake项目"
    kb_ref: ARM64-ASM-001
  - topic: libcpp-link
    pattern: "cmake项目使用libc++时工具链接失败"
    solution: "检测HAVE_LIBCPP并显式链接c++标准库"
    applicability: "所有cmake + libc++项目"
    kb_ref: LIBCPP-LINK-001
  - topic: hmdfs-fifo
    pattern: "HMDFS文件系统不支持fifo"
    solution: "make自动降级，不影响结果"
    applicability: "HMDFS环境所有make构建"

