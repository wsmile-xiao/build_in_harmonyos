# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdroplet/2.0
homepage: "https://github.com/scality/Droplet"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# 上游 v2.0 源码无真实测试用例：tests/ 目录仅含空 Makefile.am（SUBDIRS=）
# 与 README，未注册任何测试程序/断言（已清点：tests/ 无 .c 源文件、
# Makefile.am 无 check_PROGRAMS/TESTS 目标）。conanfile.py build() 不集成
# 上游测试（upstream_test_in_build=false）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（清点结果：无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：dpl_init/dpl_free 生命周期、dpl_status_str、dpl_method/dpl_method_str、dpl_canned_acl/dpl_canned_acl_str、dpl_size_str 共 4 组断言"
    command: "./test_libdroplet"

# 测试断言总数 (4 组 / 9 个 CHECK 断言, 用于质量评估)
assertion_count: 9