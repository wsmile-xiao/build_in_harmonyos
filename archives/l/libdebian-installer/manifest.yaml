# 软件级 manifest — libdebian-installer
# 遵循 ARCHIVE-SPEC v3.0

# 软件名称（小写，与目录名一致）
software: libdebian-installer

# 显示名
display: "libdebian-installer"

# 一句话描述
description: "libdebian-installer — Debian 安装器基础库（C/autotools，无外部依赖）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://salsa.debian.org/installer-team/libdebian-installer"

# 开源许可证（SPDX 标识）
license: GPL-2.0

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "无现成 configure（只有 configure.ac）——autoreconf 生成；环境 automake-1.17 缺 Config.pm 需 PERL5LIB 指向 automake-1.16"
    - "configure.ac 的 AC_INIT 用 m4_esyscmd(dpkg-parsechangelog) 取版本——环境无 dpkg 需硬编码版本号"
    - "PKG_CHECK_MODULES([CHECK]) 宏（系统无 pkg.m4）——测试框架非必需，注释该行"
    - "config.status mktemp 沙箱限制——TMPDIR 指可写目录 + ac_tmp 替换（同 dpkg，见 SKILL autotools-config-status-mktemp-sandbox）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.121":
    status: built
    build_date: "2026-08-27"
    conan_ref: "libdebian-installer/0.121"
    note: "Conan 配方适配（autotools——config.status mktemp 技能辅助验证库）"
