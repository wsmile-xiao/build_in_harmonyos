# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - category: L1
    content: "无现成 configure 的库需 autoreconf 生成——环境 automake-1.17 缺 Automake/Config.pm，需 PERL5LIB 指向 automake-1.16；autoconf 用 AUTOCONF 环境变量指向有效路径"
    reason: "libdebian-installer autoreconf 实测"
  - category: L1
    content: "configure.ac 的 AC_INIT 用 m4_esyscmd(dpkg-parsechangelog) 取版本——交叉环境无 dpkg 命令，需硬编码版本号"
    reason: "'AC_INIT should be called' 实测"
  - category: L1
    content: "config.status mktemp 沙箱限制（/tmp 只读 + $HOME/.ci_logs 不可写）——SKILL 步骤 2：configure 执行前替换 mktemp 模板 + TMPDIR 指可写目录"
    reason: "同 dpkg——SKILL autotools-config-status-mktemp-sandbox 辅助验证库"
  - category: L1
    content: "上游 check 测试套件（8 用例）build() 集成实测：8/8 = 100% 通过——DATADIR 必须用绝对路径（相对路径读 Packages 失败段错误——测试脚手架问题非代码缺陷）"
    reason: "rule 4 实测回填（Checks: 8, Failures: 0, Errors: 0）"
