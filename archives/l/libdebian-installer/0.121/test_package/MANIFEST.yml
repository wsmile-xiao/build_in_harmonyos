# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdebian-installer/0.121
homepage: "https://salsa.debian.org/installer-team/libdebian-installer"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true

upstream_tests:
  - name: test/（main.c/test_exec.c/test_hash.c/test_system_packages.c——check 框架 8 用例）
    count: "8"
    description: "上游 check 测试套件实测（rule 4）：build() 编译并运行——8/8 = 100% 通过（Checks: 8, Failures: 0, Errors: 0）"

test_package_tests:
  - file: test_libdebian_installer.py
    description: "R34：静态库存在（lib/*.a）"
    command: "python3 test_libdebian_installer.py <package>"

assertion_count: 1
