package: libxdg
version: "1.2.3"
homepage: "https://github.com/devnev/libxdg-basedir"
license: MIT
status: built
build_system: autotools
build_date: "2026-09-19"

source:
  url: "https://github.com/devnev/libxdg-basedir/archive/refs/tags/libxdg-basedir-1.2.3.tar.gz"
  sha256: "ff30c60161f7043df4dcc6e7cdea8e064e382aa06c73dcc3d1885c7d2c77451d"
  notes: "上游 release tag 名为 libxdg-basedir-1.2.3（无 v 前缀），GitHub archive 解出目录 libxdg-basedir-libxdg-basedir-1.2.3，配方用 strip_root=True 拉平。"

build:
  system: autotools
  bootstrap: "autoreconf -fi（tarball 不含 configure/Makefile.in，故 tool_requires automake/1.18 + libtool/2.5.4）"
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  make_args: ["-j1"]
  dependencies: []
  tool_requires:
    - "automake/1.18"
    - "libtool/2.5.4"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-tests-query-harness-vpath-absolute-top-srcdir.patch"

knowledge_gained:
  - "ref: E007. tarball 无 configure/config.guess，autoreconf -fi 后 build() 内联等价 patch-autotools-ohos.pl 的四处修改（config.guess 加 __OHOS__ → LIBC=ohos 分支与 *:HarmonyOS:* 分支；config.sub 加 ohos-linux) 基本机、ohos* OS 项、linux-ohos* 内核项），对象是生成文件故不落 patches/"
  - "ref: E114/E011. HMDFS 强制目录 setgid，configure 内 `umask 077 && mktemp -d` 产生的临时目录连属主都不可写，config.status 因 Permission denied 失败；build() 运行时 _drop_umask_077() 把生成 configure 里的 umask 077 全替换为 022"
  - "ref: E074. 鸿蒙 SELinux 拒绝 make jobserver FIFO，configure/make/make check 全部 -j1"
  - "新条目（草稿 DRAFT-libxdg-1.2.3-vpath-absolute-top-srcdir-test-paths）：上游 tests/querycf.2、querydf.2 用 `pwd` 拼期望路径，只在 ${top_srcdir} 为相对路径时成立；Conan 一律以绝对路径调用 configure（VPATH out-of-tree），该 2 个用例必失败（29/31）。改用 `cd ... && pwd -P` 解析后 31/31。与 E434（in-tree 构建反而失败，须 VPATH）方向相反，互为补充"
  - "TMPDIR：OHOS /tmp 只读，autom4te 不满足于 cwd 相对的 `mktemp -d ./confXXXXXX`，generate()/build() 先跑 _prepare_build_env() 把 TMPDIR 指向 build_folder/tmp（accel-config/4.1.9 同款）"
  - "测试 ELF 在 build 树内执行，无需签名；安装的静态库由 CI 的 readelf NX/PIE/RELRO 检查覆盖"
  - "autoreconf 的 bootstrap 工具来自 tool_requires：CI 干净 PATH 只有 SDK 的 autoconf/2.72 与 m4，缺 aclocal/automake/libtoolize；automake/1.18 与 libtool/2.5.4 由 conanbuild buildenv 自动贡献 PATH/ACLOCAL_PATH。不声明 autoconf/m4（会拉入 OHOS 版 perl 与 SDK perl 冲突，accel-config 踩过）。libxdg 的 pkg.m4 不需要外部来源：上游 m4/ 目录自带（AC_CONFIG_MACRO_DIR([m4]) + ACLOCAL_AMFLAGS = -I m4）"

patch_generation:
  method: manual
  patches_count: 1

patch_classification:
  - file: 0001-tests-query-harness-vpath-absolute-top-srcdir.patch
    type: portability
    platform_only: false
    guard: 'none'
    upstreamable: true
    note: "纯 VPATH/out-of-tree 构建修复，与 HarmonyOS 无关，可直接向上游提交（P005）。仅改 tests/ 下 2 个 shell 用例，不触碰被安装的库代码。"

upstream_tests:
  command: "make check"
  test_count: 31
  executed: 31
  skipped: 0
  notes: "tests/Makefile.am: TESTS = testdump + QUERYTESTS(30) = 31；CI 上 automake parallel-tests 全部 PASS，test-suite.log 位于 <build>/tests/test-suite.log，配方从该日志（而非估算）回填 # TOTAL/# PASS/# FAIL。上游默认分支 master 的 tests/ 与 tag libxdg-basedir-1.2.3 逐字节相同（git diff 无输出），故 rule4 的 N 取 31 无少报。check_PROGRAMS 另含 testfind/testquery（非 TESTS 成员，make check 只编译不执行）。"

test_package:
  assertion_count: 51
  description: "消费者测试 test_libxdg.c（C99，CMake 链接 libxdg::libxdg + Threads::Threads），6 组共 51 条断言，失败时按组返回可区分退出码 2..7。group5 为鸿蒙特有：LP64 ABI（sizeof(mode_t)==4 / off_t==8 / long==void*）、(mode_t)-1 不符号扩展、HMDFS 上 xdgMakePath 嵌套建目录后 stat/access 复核；group6 为鸿蒙线程特有：4 个线程各持独立 xdgHandle 做 200 轮 FNV-1a 校验和，必须与单线程基准逐位相同。运行期由 test_package/conanfile.py 注入 TMPDIR（OHOS /tmp 只读）。"

ci:
  profile: ci/conan/profiles/ohos-aarch64
  package_type: library
  shared_default: false
