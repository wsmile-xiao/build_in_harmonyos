# 上游仓库 devnev/libxdg-basedir 的 release tag 名就是 `libxdg-basedir-1.2.3`
# （没有 `v` 前缀的简写 tag），因此 GitHub archive 解出目录
# `libxdg-basedir-libxdg-basedir-1.2.3`；配方用 strip_root=True 拉平。

sources:
  "1.2.3":
    url: "https://github.com/devnev/libxdg-basedir/archive/refs/tags/libxdg-basedir-1.2.3.tar.gz"
    sha256: "ff30c60161f7043df4dcc6e7cdea8e064e382aa06c73dcc3d1885c7d2c77451d"

patches:
  "1.2.3":
    - patch_file: "patches/0001-tests-query-harness-vpath-absolute-top-srcdir.patch"
      patch_description: >-
        tests/querycf.2 与 tests/querydf.2 用 `pwd` 拼 `${top_srcdir}` 造期望
        路径，仅在 ${top_srcdir} 为相对路径时成立；绝对路径配置（Conan 这种
        out-of-tree 构建）下 2/31 用例必失败。改用 `cd ... && pwd -P` 解析。
      patch_type: "portability"
      patch_source: "local"
