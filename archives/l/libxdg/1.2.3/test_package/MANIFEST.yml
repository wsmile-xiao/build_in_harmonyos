# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libxdg.c
    description: "消费者测试：6 组共 51 条断言。①头文件/ABI/公开符号链接；②$XDG_* 环境变量契约（含空变量视为未设）；③规范回退路径；④TMPDIR 下真实文件系统发现；⑤鸿蒙 ABI(LP64/mode_t) + HMDFS mkdir/stat/access 行为；⑥4 线程各自 xdgHandle 的并发一致性（FNV-1a 校验和与单线程基准逐位相同）"
    command: "./test_libxdg"

# 测试断言总数 (近似值)
assertion_count: 51
