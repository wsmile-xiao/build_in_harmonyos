# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# rule4 口径说明：本仓库的"上游全集 N"取上游默认分支 master 的 tests/Makefile.am。
# libxdg 的测试集在 tag libxdg-basedir-1.2.3 与 master 之间逐字节相同（已用
# `git diff libxdg-basedir-1.2.3 master -- tests/` 核验，无差异），因此 N=31 同时
# 成立：TESTS = testdump + QUERYTESTS(30) = 31。全部 31 个用例在 CI 上由
# conanfile.py build() 内的 `make -j1 check` 真实执行，未执行 0 个。

package: libxdg/1.2.3
homepage: "https://github.com/devnev/libxdg-basedir"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (tests/Makefile.am: TESTS = testdump ${QUERYTESTS})
upstream_tests:
  - file: tests/testdump.c
    source: libxdg-basedir-1.2.3/tests/testdump.c
    description: "查询函数转储冒烟：把 xdg{Config,Data}{Directories,Find} 等查询结果打印出来，与进程退出码 0 一同断言"
    command: "./tests/testdump"
  - file: tests/query-harness.sh
    source: libxdg-basedir-1.2.3/tests/query-harness.sh
    description: "QUERYTESTS 公共驱动程序：跑 ./tests/testquery <arguments>，要求 stdout 与用例里的 $expected 逐字节相等且退出码为 0。被下面 30 个 query*.N 用例 source"
    command: "./tests/query-harness.sh"
  - file: tests/querycd.1
    source: libxdg-basedir-1.2.3/tests/querycd.1
    description: "XDG_CONFIG_DIRS 查询：querycd 组 1/5"
    command: "./tests/querycd.1"
