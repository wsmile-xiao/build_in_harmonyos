software: libfixbuf
display: "libfixbuf"
description: "CERT NetSA implementation of the IPFIX protocol"
category: net
homepage: "https://tools.netsa.cert.org/fixbuf2/index.html"
license: LGPL-3.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 识别 OHOS (aarch64-linux-ohos)"
    - "configure 临时目录改用任务 TMPDIR (HMDFS 可写)"
    - "仅依赖 glib2, 关闭 TLS/SCTP/Spread/tools 保持纯库"
  common_dependencies:
    - glib2

versions:
  "2.4.1":
    status: built
    build_date: "2026-09-18"
