version: "2.3.3"
software: libgd2
status: built
build_date: "2026-09-19"
conan_ref: "libgd2/2.3.3"

source:
  url: "https://github.com/libgd/libgd/releases/download/gd-2.3.3/libgd-2.3.3.tar.gz"
  sha256: "dd3f1f0bb016edcc0b2d082e8229c822ad1d02223511997c80461481759b1ed2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF (default; static libgd.a)"
    - "BUILD_STATIC_LIBS=ON (default)"
    - "BUILD_TEST=ON (always; ctest runs on runnable hosts)"
    - "ENABLE_PNG/JPEG/TIFF/WebP/AVIF/HEIF/XPM/FREETYPE/FONTCONFIG/RAQM/LIQ/ICONV/CPP/GD_FORMATS=OFF"
    - "CMAKE_INSTALL_LIBDIR=lib"
  dependencies: []

patches_applied: []

knowledge_gained:
  - "libgd 2.3.3 release archive ships 3 stale test refs: missing tests/gdmatrix dir (breaks configure) plus missing bug00320.c/bug00415.c (break the test build); commenting out only those 3 list lines repairs ctest discovery"
  - "Static-only builds create gd_static (OUTPUT_NAME gd) while gdTest links ${GD_LIB}; redirecting GD_LIB to GD_LIB_STATIC keeps a real CMake dependency edge"
  - "With all codec/font stacks OFF, 79 unconditional ctest cases compile against the core static lib; 138 entries need optional codecs and 16 examples are non-ctest samples"
  - "OHOS-adapted Conan maps CMAKE_SYSTEM_NAME automatically (per ci/conan/profiles/ohos-aarch64); no manual override in the recipe"
