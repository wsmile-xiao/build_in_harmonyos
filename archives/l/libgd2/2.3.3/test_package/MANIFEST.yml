# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libgd2/2.3.3
homepage: "https://libgd.github.io/"

# 上游测试命令 (tests/ 目录 79 个无条件 ctest 用例，编解码栈全关闭配置下可编译运行)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (tests/*/CMakeLists.txt 经 ADD_GD_TESTS 宏注册为 test_<目录>_<用例>)
upstream_tests:
  - directory: tests
    source: libgd-2.3.3.tar.gz/tests/
    description: "上游 CMake 测试套件：79 个无条件 ctest 用例（核心图像 API / 内置 GIF/GD2/WBMP/BMP/TGA/XBM 格式），conanfile build() 在真机执行"
    command: "ctest --output-on-failure"
  - directory: examples
    source: libgd-2.3.3.tar.gz/examples/
    description: "上游 16 个示例程序（非 ctest 用例，部分需要已关闭的编解码栈；首轮未构建未运行，如实披露）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libgd2.c
    description: "消费者冒烟测试：版本宏、真彩创建、填充与像素回读、内置字体、GIF 编码魔数、GIF 解码回环，共 6 项 CHECK-OK 断言"
    command: "./test_libgd2"

# 测试断言总数 (消费者 6 CHECK-OK + 上游 79 ctest)
assertion_count: 85

# 测试接入说明 (HMBS 机器证据):
# - build() 末尾 _run_upstream_ctest() 真机执行 `ctest --output-on-failure`，
#   逐行解析 Test #N 结果行计数（Passed/Failed/Skipped），与 ctest 汇总行交叉核对，
#   发现数低于 10 直接抛错；随后立即输出 HMBS_UPSTREAM_TEST_RESULT=<真实 JSON>
#   （failed>0 或 ctest 非零退出时先输出标记再抛异常）。
# - 同一 JSON 持久化为 build_folder/hmbs_upstream.json，package() 复制进包内 res/。
# - test_package test() 运行消费者测试统计 CHECK-OK 行数并输出
#   HMBS_TEST_PACKAGE_RESULT，随后读取 <package>/res/hmbs_upstream.json 复发
#   HMBS_UPSTREAM_TEST_RESULT（包缓存命中时 build() 不重跑，仅 test_package
#   每轮必跑，保证标记每轮出现；文件缺失或 status 非 passed 均抛 ConanException）。
# - 计数全部来自真机测试框架输出，不写死、不估算。
