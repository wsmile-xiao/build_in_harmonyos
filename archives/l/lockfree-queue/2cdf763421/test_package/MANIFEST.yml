# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lockfree-queue/2cdf763421
homepage: "https://github.com/supermartian/lockfree-queue"

# 上游测试命令
upstream_check_command: "make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: lockfree-queue-2cdf763421/test.c
    description: "上游多线程生产者/消费者压测（4 producer x 1 consumer, 1e7 次入队出队）"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：init_queue/queue_add/queue_get 100 项往返验证"
    command: "./test_lockfree-queue"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100
