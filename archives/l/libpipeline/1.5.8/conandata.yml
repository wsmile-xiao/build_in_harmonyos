# sha256 computed from the downloaded tarball.

sources:
  url:
    - "https://deb.debian.org/debian/pool/main/libp/libpipeline/libpipeline_1.5.8.orig.tar.gz"
    - "https://libpipeline.nongnu.org/libpipeline-1.5.8.tar.gz"
  sha256: "1b1203ca152ccd63983c3f2112f7fe6fa5afd453218ede5153d1b31e11bb8405"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: "config.guess: recognise the aarch64-unknown-linux-ohos triple (__OHOS__ and *:HarmonyOS:*:*)"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: "config.sub: accept ohos-linux / linux-ohos as valid cpu-os-kernel combinations"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: create the temp dir with umask 022 instead of 077 — on the OHOS HMDFS the 077 permissions break config.status (E011)"
    patch_type: "portability"
