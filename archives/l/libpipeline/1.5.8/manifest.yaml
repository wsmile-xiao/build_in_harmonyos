software: libpipeline
version: "1.5.8"
status: success
build_system: autotools
compile_date: "2026-03-23"

dependencies:
  required: []
  optional: [libgio]

build_config:
  target: aarch64-unknown-linux-ohos
  install_prefix: $HOME/usr/local
  cflags: "-fPIC -O2"
  configure_options:
    - --prefix=$HOME/usr/local

patches_applied:
  - file: 0001-config.guess-add-HarmonyOS-detection.patch
    purpose: config.guess 添加 __OHOS__ LIBC 检测和 HarmonyOS case，返回 aarch64-unknown-linux-ohos
    lines_changed: 8
  - file: 0002-config.sub-add-linux-ohos-support.patch
    purpose: config.sub 添加 ohos-linux 匹配、OS 允许列表 ohos*、kernel-os 验证 linux-ohos*
    lines_changed: 7

compatibility:
  level: high
  issues: []
  notes: man-db 的核心依赖

test_results:
  type: indirect
  note: 通过 man-db 成功链接验证功能正常

knowledge_gained:
  - 标准的 autotools 项目编译流程
  - .so 软链接需用 cp 替代 ln -s

maintainer: OpenHarmony Community
tags: [libpipeline, man-db-dependency, pipeline, library]
