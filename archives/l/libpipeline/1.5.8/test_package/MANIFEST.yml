# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libpipeline/1.5.8
homepage: "https://libpipeline.nongnu.org/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试（未运行，如实申报）
# 实测规模（libpipeline-1.5.8 源码树 tests/ 目录）：
#   - 框架：Automake TESTS（check_PROGRAMS + shell 包装脚本）
#   - 测试文件：见 tests/ 目录（test-pipeline 等）
#   - 本次执行：未运行（见 notes.md §4）
upstream_tests:
  - file: tests/
    description: "Automake `make check` 套件（tests/test-* 程序）"
    command: "make check"
    executed: false
    not_run_reason: "本配方的目标是最小可用构建（需求方要的是 dh-exec 的依赖），上游套件未在本次 conan create 中运行；如需执行可按 notes.md §4 的步骤单独跑 make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libpipeline.c
    description: "Consumer test: pipeline_new / pipeline_command_args(echo,tr) / pipeline_start / pipeline_readline / pipeline_wait_all / pipeline_free —— 验证 `echo hello | tr a-z A-Z` 得到 HELLO"
    command: "./test_libpipeline"
    assertions: 4

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
