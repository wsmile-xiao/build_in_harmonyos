package: leaflet-markercluster/1.5.3-dfsg
homepage: "https://github.com/Leaflet/Leaflet.markercluster"

upstream_test_command: null
upstream_test_in_build: false
upstream_tests:
  - "spec/suites/*.js — 34 个 karma/jasmine 浏览器端 spec 文件，共 184 个 it() 用例（审查员脚本实测口径；本地 grep it()=180 + xit=1，以审查员实测 184 为准）"
external_integration_note: "上游 184 个 it() 用例是浏览器端 karma 测试（真实 DOM + Leaflet 渲染），目标环境无浏览器 → 不执行；验证由资产完整性断言 + 完整消费者端到端用例承担：dist 4 件套存在性 + JS/CSS 内容锚点 + 安装产物与 npm dist 的 sha256 逐字节一致（纯字符串比对哈希列，不依赖 diff/进程替换）+ 消费者 E2E（node + 最小 DOM 桩 + 真实 Leaflet 1.9.4 运行时，走完建图→加 100 标记→聚合→放大解散→移除全流程，14 个验证节点）。node 检查：OHOS 自带 node v24 但 V8 JIT 直接 SIGTRAP，须 --jitless（知识库 E400 恢复条件），且以探针自检为启用门槛（自检不过则 SKIP）。"

test_package_tests:
  - file: test.sh
    description: "17 条断言：dist 4 件套存在性（4）、JS 工厂挂载点/版本横幅锚点（3）、CSS 类锚点（4）、sourcemap（2）、MIT 许可证与 README（2）、安装产物 sha256 与 npm dist 逐字节一致（1）、node --jitless --check 语法校验（1，探针自检启用）。"
    command: "conan create archives/l/leaflet-markercluster/1.5.3-dfsg --build=missing"
  - file: test_package/consumer/cluster_flow.js
    description: "完整消费者端到端用例（rule12）：node --jitless + 最小 DOM 桩 + 真实 Leaflet 1.9.4 运行时，14 个验证节点——模块加载挂载、建图、聚合组挂图、批量加 100 标记、z0 聚成 1 簇（childCount=100）、z15 解散（100 标记各自可见）、removeLayer、整组摘除。全部走公共 API，整体跑通功能/流程。"
    command: "node --jitless test_package/consumer/cluster_flow.js <pkg>/share/leaflet-markercluster/leaflet.markercluster.js（由 test.sh 调用）"

assertion_count: 17
consumer_e2e_cases: 1
