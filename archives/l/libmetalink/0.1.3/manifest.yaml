# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E007: 旧版 config.guess/config.sub 无法识别 HarmonyOS，需替换为 automake-1.17 新版（识别为 aarch64-unknown-linux-ohos）"
  - "HMDFS setgid 目录下 config.status 的 umask 077 会剥夺组写权限，需修改 configure 中 umask 为 002"
  - "manifest.yaml 中 configure_options: [] 会被解析为字符串 '[]' 传给 configure，应改为 configure_options: 避免此问题"
  - "R6: config.status 是生成文件（由 configure 生成），修改它生成的补丁在 G0 干净构建时无效，应修改 configure 本身"

