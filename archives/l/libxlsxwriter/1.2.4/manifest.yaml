version: "1.2.4"
status: built
build_date: "2026-09-22"

source:
  url: "https://github.com/jmcnamara/libxlsxwriter/archive/refs/tags/v1.2.4.tar.gz"
  sha256: "e0db59fc248a5ffa465a05ea83a9d466d4bca0e53ab42771515d4ebb467a41c1"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_EXAMPLES=OFF / BUILD_FUZZERS=OFF / USE_SYSTEM_MINIZIP=OFF（vendored minizip ioapi+zip 静态编入）/ USE_STANDARD_TMPFILE=OFF（vendored tmpfileplus）/ USE_NO_MD5=OFF（vendored md5）/ IOAPI_NO_64=OFF"
    - "CMAKE_INSTALL_LIBDIR=lib（ohos.toolchain 64 位默认 lib64 须改回）"
  dependencies: ["zlib/1.3.1.1"]
  cc: clang
  cxx: clang++

patches_applied: []

test:
  upstream:
    unit: "451 CTEST cases（test/unit 159 个 test*.c 聚合进 xlsxwriter_unit 单二进制）— build() 阶段 bash 包装实跑"
    functional: "793 个 C 可执行 + 799 pytest 函数（84 文件）golden 比对（747 个 xlsx_files 金标）— 本机实跑（见 notes）"
  consumer: "test_package：xlsx 写出后 zlib inflate 解容器五部件校验"

knowledge_gained:
  - "上游 1.2.x tag 命名 v1.2.4（RELEASE_1.2.4 是 1.1.x 时代命名，任务书写的 RELEASE_1.2.4 实为 v1.2.4，404 实证）"
  - "minizip 依赖形态：vendored ioapi.c+zip.c 默认静态编入库（USE_SYSTEM_MINIZIP=OFF 默认）——无需系统 minizip 依赖，只有 zlib 是外部依赖"
  - "find_package(ZLIB) 为 MODULE 模式（FindZLIB.cmake）：须预置 ZLIB_INCLUDE_DIR/ZLIB_LIBRARY 缓存变量（conan zlib 真实路径）绕交叉链 FIND_ROOT_PATH=ONLY"
