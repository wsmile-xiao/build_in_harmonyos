# test_package for libxlsxwriter/1.2.4
name: libxlsxwriter
version: 1.2.4
test_type: consumer_smoke
description: >
  写一个小 workbook（字符串/数字/公式+粗体格式）后用 zlib 原生 inflate
  直接解析 .xlsx 容器（xlsx 即 zip）：校验 [Content_Types].xml、
  workbook.xml、sharedStrings.xml（含写入字符串）、sheet1.xml（含数字与
  <f> 公式元素）、styles.xml 五个核心部件——覆盖库的完整写出路径
  （vendored minizip + conan zlib 容器层、SST、worksheet XML、样式）。
files:
  - conanfile.py
  - test.c
build: clang -std=gnu99
