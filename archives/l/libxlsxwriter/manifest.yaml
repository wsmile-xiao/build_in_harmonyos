software: libxlsxwriter
display: "libxlsxwriter"
description: "C library for creating Excel XLSX files"
category: data
homepage: "https://libxlsxwriter.github.io/"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯静态库，无可执行二进制文件"
    - "minizip/tmpfileplus/md5 vendored 静态编入（USE_SYSTEM_MINIZIP=OFF 默认），zlib 为唯一外部依赖"
    - "find_package(ZLIB) 为 MODULE 模式：配方预置 ZLIB_INCLUDE_DIR/ZLIB_LIBRARY 缓存变量注入 conan zlib 真实路径"
    - "OHOS toolchain --gc-sections 会回收 ctest.h .ctest 测试注册段：unit 测试需 -DCMAKE_EXE_LINKER_FLAGS=-Wl,--no-gc-sections"
    - "functional 测试 exe 为 OHOS ELF：bash shim 替换后 python3 -m pytest 驱动金标比对"
  common_dependencies:
    - zlib

versions:
  "1.2.4":
    status: built
    build_date: "2026-09-22"