test_type: conan-test-package
upstream_tests:
  total: 24
  source: >
    libvips 8.18.4 registers 24 upstream tests: 11 Meson tests
    (test/meson.build: cli, formats, seq, stall, threading, keep shell
    scripts plus token, connections, descriptors, webpsave_timeout,
    gifsave_timeout C programs) and 13 Python pytest modules in
    test-suite/ (arithmetic, colour, connection, conversion, convolution,
    create, draw, foreign, histogram, iofuncs, morphology, mosaicing,
    resample). Count reported in full (no shrinking).
  runnable_on_package: 6
  not_runnable: 18
  not_runnable_reason: >
    13 pytest modules need a Python interpreter plus the test-suite/images
    git submodule absent from the release tarball; the shell tests formats,
    stall and keep need loaders/savers that are disabled here and image
    fixtures; webpsave_timeout and gifsave_timeout need webp/gif save
    support disabled in this package.
  vendored:
    - "upstream/test_descriptors.c (byte-for-byte from test/test_descriptors.c)"
    - "upstream/test_connections.c (byte-for-byte from test/test_connections.c; runs over the pngload_source path)"
    - "upstream/test_token.c (byte-for-byte from test/test_token.c)"
    - "upstream/test_token.sh (byte-for-byte from test/test_token.sh)"
    - "upstream/test_cli.sh (self-sufficient; thumbnail output jpg->png since jpeg save is disabled)"
    - "upstream/test_seq.sh (self-sufficient)"
    - "upstream/test_threading.sh (self-sufficient; bc removed)"
adapted_tests:
  total: 12
  source: "test_package/test_vips.c (6 checks) + 6 vendored upstream tests run on the package (descriptors/connections/token/cli/seq/threading)"
  cases:
    - "libvips runtime reports version 8.18"
    - "vips_black produces a 64x64 image"
    - "vips_avg(black) is zero"
    - "vips_add(black, black) is zero"
    - "vips_pngsave_buffer produces data (libpng save path)"
    - "PNG decode round-trip is 8x8 (libpng load path)"
    - "vendored upstream test_descriptors.c: file descriptors closed on minimise/read/unref (returns 0 pass / 77 skip / 1 fail)"
    - "vendored upstream test_connections.c: load via VipsSourceCustom + save via VipsTargetCustom (pngload_source path)"
    - "vendored upstream test_token.sh -> test_token.c: seven vips__token_get checks"
    - "vendored upstream test_cli.sh: affine/interpolate round-trip, thumbnail geometry + stdin/stdout pipes, --vips-max-coord"
    - "vendored upstream test_seq.sh: replicate big PNG, vipsthumbnail/shrink/reduce make no temp files in readonly TMPDIR"
    - "vendored upstream test_threading.sh: im_benchmarkn concurrency/tile variance, VIPS_MAX_THREADS threadset limit"
