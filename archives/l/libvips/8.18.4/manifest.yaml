software: libvips
version: "8.18.4"
status: built
build_system: meson
conan_ref: "libvips/8.18.4"

source:
  url: "https://github.com/libvips/libvips/releases/download/v8.18.4/libvips-8.18.4.tar.xz"
  sha256: "2677bad6c422617fd1172d359c16af34e736965d042c214203a87187d26ff037"

build:
  package_type: library
  default_variant: static
  target: aarch64-linux-ohos
  jobs: 1
  wrap_mode: nofallback
  options:
    - "deprecated=true"
    - "examples=false"
    - "cplusplus=false"
    - "docs=false"
    - "cpp-docs=false"
    - "modules=disabled"
    - "introspection=disabled"
    - "vapi=false"
    - "archive=disabled"
    - "cfitsio=disabled"
    - "cgif=disabled"
    - "exif=enabled"
    - "fftw=disabled"
    - "fontconfig=disabled"
    - "heif=disabled"
    - "highway=disabled"
    - "imagequant=disabled"
    - "jpeg=disabled"
    - "jpeg-xl=disabled"
    - "lcms=enabled"
    - "magick=disabled"
    - "matio=disabled"
    - "nifti=disabled"
    - "nsgif=true"
    - "openexr=disabled"
    - "openjpeg=disabled"
    - "openslide=disabled"
    - "orc=enabled"
    - "pangocairo=disabled"
    - "pdfium=disabled"
    - "png=enabled"
    - "poppler=disabled"
    - "ppm=true"
    - "analyze=true"
    - "radiance=true"
    - "rsvg=disabled"
    - "spng=disabled"
    - "tiff=disabled"
    - "uhdr=disabled"
    - "webp=disabled"
    - "zlib=enabled"

dependencies:
  - "glib/2.88.3"
  - "expat/2.8.2.1"
  - "zlib/1.3.2"
  - "lcms2/2.19"
  - "libpng/1.6.58.2"
  - "libexif/0.6.26.1"
  - "orc/0.4.42"

libs:
  - vips

requires:
  - "glib/2.88.3"
  - "expat/2.8.2.1"
  - "zlib/1.3.2"
  - "lcms2/2.19"
  - "libpng/1.6.58.2"
  - "libexif/0.6.26.1"
  - "orc/0.4.42"

test_package:
  type: cmake-consumer
  checks: 6

adaptation_paths:
  - A

notes:
  - "Packages the core vips image-processing library for OHOS AArch64 with exif/lcms/orc/png/zlib/nsgif/ppm/analyze/radiance loaders enabled; all other optional loaders (jpeg/webp/tiff/heif/fftw/rsvg/magick/...) are disabled and subdir('test')/subdir('fuzz') are removed from the Meson build so the cross build stays hermetic."
