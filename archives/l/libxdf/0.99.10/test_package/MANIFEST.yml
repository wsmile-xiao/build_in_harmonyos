# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libxdf/0.99.10
homepage: "https://github.com/Yida-Lin/libxdf"

# 上游（Yida-Lin/libxdf v0.99.10）未提供自动化测试：
# CMakeLists.txt 无 enable_testing()/add_test()，仓库无 test/ 目录，
# xdf.pro 仅定义库目标。静态用例数 N_static = 0。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test.cpp
    description: "构造最小合法 XDF 文件，经公开 API Xdf::load_xdf 解析，断言流元数据/通道描述/采样值/时间戳；并断言缺失文件返回 1、magic 错误返回 -1"
    command: "./test_libxdf"

assertion_count: 17
