# 版本级 manifest — libsolace 0.4.1
# 文件位置: archives/l/libsolace/0.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 是 CI 唯一构建输入，本文件为交叉校验元数据）

# ============================================================
# 必须字段
# ============================================================

version: "0.4.1"
software: "libsolace"

# 编译状态: published | built | failed | archived
# 本任务为 built（conan-verify 通过但未向制品仓 upload——AGENTS §1 O5）
status: built

build_date: "2026-09-29"
build_system: cmake

# ============================================================
# 源码信息（与 conandata.yml 同源）
# ============================================================

source:
  # 上游 tag 归档 **zip**（URL 形态逐字取自 conan-center-index 的 libsolace conandata）
  url: "https://github.com/abbyssoul/libsolace/archive/v0.4.1.zip"
  # sha256 三路取证（三路独立下载逐字节同值，285762 字节）+ CCI 记录值四面一致：
  #   归档 URL 下载 / 同 URL 重复下载 / codeload 归档端点 / conan-center-index conandata
  sha256: "56d91ff180223322e0a93d62eb9f3974555f085d8e4e6e8435708d2bed0dfa0e"
  # 压缩格式
  tar_format: zip

  # tag 与 tag 提交（git ls-remote --tags 实证：40 个 tag 全量命中）
  tag: "v0.4.1"
  tag_commit: "8de7b9032f5ae75fe37810a22500b2514e33471c"   # annotated tag 剥离后提交

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # 配方 generate() 注入的 CMake 缓存变量
  configure_options:
    - "-DPKG_CONFIG=False"
    - "-DCMAKE_PROJECT_INCLUDE=<generators>/libsolace-upstream-includes.cmake"

  # 交付依赖（requirements）：0 —— 双源实证（上游 conanfile.txt [requires] 段为空
  # + conan-center-index 配方无 requirements()），ci/scripts/preflight_check.sh 实测
  # 「无依赖需要检查」rc=0；无 SSL/压缩/数据库等可选开关需要禁用。
  dependencies: []

  # 构建期测试依赖（build_requirements 的 test_requires，不传播给消费者）
  test_dependencies:
    - "gtest/1.17.0"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 1 个补丁：上游根 CMakeLists 里 Conan 1 遗留的两行
# （include(conanbuildinfo.cmake) + conan_basic_setup()）—— Conan 2 不再生成该文件，
# include() 直接 FATAL。补丁内容与 conan-center-index 同包配方 _patch_sources() 的
# replace_in_file 逐字相同；这两行提供的两条全局语义（gtest 头 include 路径、CONAN_LIBS）
# 由配方 generate() 写的 CMAKE_PROJECT_INCLUDE 注入文件等价补回。
# 上游 test/ 源文件与其余各级 CMakeLists 一字未改。
patches_applied:
  - "0001-drop-conan1-bootstrap.patch"

patch_classification:
  - file: 0001-drop-conan1-bootstrap.patch
    type: portability
    platform_only: False
    guard: 'none'

# ============================================================
# 测试统计（TOTAL = PASS + FAIL + SKIP + NOT_RUN）
# ============================================================

test_results:
  type: upstream_and_consumer
  upstream_framework: gtest
  upstream_binary: "test_solace（test/CMakeLists.txt add_test 注册；build() 内沙箱 HOME 实跑）"
  upstream_check_command: "grep -rhoE '^[[:space:]]*TEST(_F|_P)?[[:space:]]*\\(' test --include='*.cpp' | wc -l  # 源码宏 raw=345"

  # 候选口径（§3.5 四口径不混用；N = max(源码宏, 框架注册)）
  upstream_source_macro_raw: 345      # 不解析注释 = 审方克隆后 grep 的值
  upstream_source_macro_compiled: 333 # 块注释剔除后 = 实际编译面
  upstream_registered: 333            # gtest 运行期 [ RUN ] 行 / --gtest_list_tests
  upstream_assertion_sites: 2093      # 断言位点 raw（去注释 1953）——不同单位，不参与 N

  upstream_tests: 345                 # N = max(345, 333)
  upstream_executed: 333
  upstream_passed: 333
  upstream_failed: 0
  upstream_skipped: 0
  upstream_not_run: 12                # 全部位于上游 /* */ 块注释内，任何构建都不编译

  consumer_tests: 40                  # test_package 显式检查（不进上游分母）
  consumer_passed: 40
  consumer_failed: 0

  total: 385                          # 上游 345 + 鸿蒙特有 40
  passed: 373                         # 333 + 40
  failed: 0
  skipped: 0
  not_run: 12
  status: passed
  note: "上游 345 = 333 PASS + 12 NOT_RUN（块注释内不可编译，逐文件归因见 test_package/MANIFEST.yml）；消费者 40/40 全过"

# ============================================================
# 知识沉淀
# ============================================================

# 零草稿：G2/verify 全绿、run_engine 未触发（AGENTS §3.8 官方机制：未踩到需沉淀的
# 新坑即零草稿为正常终态；本文件不写行尾 knowledge_ref）
knowledge_gained: []
