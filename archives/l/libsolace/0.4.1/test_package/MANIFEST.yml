# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsolace/0.4.1
homepage: "https://github.com/abbyssoul/libsolace"

# 上游测试入口盘点命令（四种口径分列，N 取候选数法最大值、差额逐项归因）
#   ① 源码宏 raw（不解析注释 = 审方克隆后 grep 的值）= 345
upstream_check_command: >-
  grep -rhoE '^[[:space:]]*TEST(_F|_P)?[[:space:]]*\(' test --include='*.cpp' | wc -l;
  # ①′去注释后源码宏（块注释剔除，= 实际编译面）= 333 —— 逐文件读数见下方 upstream_test_sources；
  # ② 框架注册数 = 333（两条等价命令）：
  "<build>/test/test_solace" --gtest_list_tests | grep -c '^  ';
  grep -c '^\[ RUN      \]' <conan-create.log>;
  # ③ 断言位点 raw = 2093（去注释后 1953）—— 不同单位、单列不参与 N：
  grep -rhoE '\b(EXPECT|ASSERT)_[A-Z_]+\(' test --include='*.cpp' | wc -l

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: >-
  build() 内 `cmake.build(target="test_solace")` 构建（上游 add_subdirectory(test EXCLUDE_FROM_ALL)
  使测试目标不在默认 all 里），随后在沙箱 HOME 下真跑可执行文件，解析
  "[==========] N tests from M test suites ran." 与 "[  PASSED  ] N tests." 汇总行；
  反假绿硬断言：registered>0 且 passed==registered 且 registered<=源码宏 raw，任一不符即构建失败。

# ── N 的候选口径（§3.5 四口径不混用；N = max(源码宏, 框架注册) = 345）────────
#   ① 源码宏 raw（不解析注释，审方 grep 同形）= 345
#   ①′源码宏（块注释剔除后，= 实际可编译）   = 333
#   ② 框架注册数（gtest 运行期 [ RUN ] 行）  = 333
#   ③ assertion 位点 raw / 去注释 = 2093 / 1953 —— 不同单位，**单列不参与 N**
#   ④ 消费者断言 = 40（鸿蒙特有测试行，不进上游分母）
#   N = max(345, 333) = 345；差额 12 = 345−333，全部位于上游 /* */ 块注释内，
#   任何构建都不编译 ⇒ 申报 TOTAL = PASS 333 + FAIL 0 + SKIP 0 + NOT_RUN 12 = 345。
#   断言口径差额 2093−1953 = 140，同源于这 12 个被注释掉的用例体。

# 上游实际运行的测试程序（单一 GoogleTest 可执行，add_test 注册）
upstream_tests:
  - file: test/test_solace
    source: libsolace-0.4.1/test/CMakeLists.txt
    description: >-
      上游唯一测试程序：add_executable(test_solace EXCLUDE_FROM_ALL) + add_test(NAME test_solace)。
      由 30 个翻译单元组成（29 个含用例声明 + main_gtest.cpp 入口），29 个 GoogleTest 套件、
      333 个注册用例（源码宏 raw 345，差 12 处在块注释内）；build() 内实跑 333/333 全过。
    command: "<build>/test/test_solace"

# 逐文件源码宏清点（候选口径①；raw 含块注释内声明，去注释后 = 实际编译面）
upstream_test_sources:
  - {file: test/test_array.cpp,        source_macros_raw: 21, compiled: 19, note: "差 2 处在块注释内"}
  - {file: test/test_arrayView.cpp,    source_macros_raw: 29, compiled: 22, note: "差 7 处在块注释内"}
  - {file: test/test_atom.cpp,         source_macros_raw: 3,  compiled: 3}
  - {file: test/test_base16.cpp,       source_macros_raw: 11, compiled: 11}
  - {file: test/test_base64.cpp,       source_macros_raw: 10, compiled: 10}
  - {file: test/test_byteReader.cpp,   source_macros_raw: 10, compiled: 10}
  - {file: test/test_byteWriter.cpp,   source_macros_raw: 5,  compiled: 5}
  - {file: test/test_char.cpp,         source_macros_raw: 3,  compiled: 3}
  - {file: test/test_dialstring.cpp,   source_macros_raw: 8,  compiled: 8}
  - {file: test/test_dictionary.cpp,   source_macros_raw: 13, compiled: 13}
  - {file: test/test_env.cpp,          source_macros_raw: 7,  compiled: 7}
  - {file: test/test_error.cpp,        source_macros_raw: 1,  compiled: 1}
  - {file: test/test_memoryManager.cpp,source_macros_raw: 6,  compiled: 6}
  - {file: test/test_memoryResource.cpp, source_macros_raw: 1, compiled: 1}
  - {file: test/test_memoryView.cpp,   source_macros_raw: 12, compiled: 12}
  - {file: test/test_optional.cpp,     source_macros_raw: 26, compiled: 25, note: "差 1 处在块注释内"}
  - {file: test/test_path.cpp,         source_macros_raw: 24, compiled: 24}
  - {file: test/test_result.cpp,       source_macros_raw: 31, compiled: 31}
  - {file: test/test_string.cpp,       source_macros_raw: 24, compiled: 22, note: "差 2 处在块注释内"}
  - {file: test/test_stringBuilder.cpp,source_macros_raw: 3,  compiled: 3}
  - {file: test/test_stringView.cpp,   source_macros_raw: 20, compiled: 20}
  - {file: test/test_uuid.cpp,         source_macros_raw: 11, compiled: 11}
  - {file: test/test_variableSpan.cpp, source_macros_raw: 4,  compiled: 4}
  - {file: test/test_vector.cpp,       source_macros_raw: 21, compiled: 21}
  - {file: test/test_version.cpp,      source_macros_raw: 7,  compiled: 7}
  - {file: test/hashing/test_md5.cpp,      source_macros_raw: 8,  compiled: 8}
  - {file: test/hashing/test_murmur3.cpp,  source_macros_raw: 15, compiled: 15}
  - {file: test/hashing/test_sha1.cpp,     source_macros_raw: 6,  compiled: 6}
  - {file: test/hashing/test_sha256.cpp,   source_macros_raw: 5,  compiled: 5}
  # test/main_gtest.cpp 与 test/mockTypes.cpp 含 0 处用例声明（入口 / 测试夹具）
  # test/ci/teamcity_{gtest,cppunit,messages}.cpp 为 TeamCity 上报监听器，0 处声明；
  #   teamcity_cppunit.cpp 需 cppunit 头，上游未把它列入构建，本适配同样不编译。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libsolace.cpp
    description: >-
      消费者断言链 40 项（13 组）：从**已安装包头** <solace/…> 经导入目标
      libsolace::libsolace 实调 —— 链接面 getBuildVersion(2) + Version 比较(4) +
      Version::parse 正/负(5) + String 构造与相等(3) + makeStringJoin(2) +
      Base64 RFC4648 向量(3) + Base16 RFC4648 向量(3) + Path 组件语义(4) +
      Array 系统堆分配(2) + UUID 约束常量(2) + Optional 有/无(3) +
      MemoryView 视图(2) + 进程环境 set/get/unset 真实往返(5) = 40。
      显式计数、任一失败进程非零退出（不依赖 assert/NDEBUG）。
    command: "./test_libsolace"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
