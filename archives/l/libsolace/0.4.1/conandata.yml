# conandata.yml — libsolace 0.4.1
#
# 正式源 URL 只写在下方 sources.url 这一处（CI 预下载器对全文件做无边界 URL 抓取，
# 注释里重复写 URL 会被整串替换并连带改写真源前缀，故本文件注释不含任何 URL）。
#
# 源形态：GitHub tag 归档 **zip**（zip 源，URL 形态逐字取自 conan-center-index 的
# libsolace conandata）。sha256 三路取证（三路独立下载逐字节同值，285762 字节）：
#   路 1 = 归档 URL 下载
#   路 2 = 同 URL 独立重复下载
#   路 3 = codeload 归档端点（zip/标签名）
#   参照 = conan-center-index conandata 记录值
#   结果 = 56d91ff180223322e0a93d62eb9f3974555f085d8e4e6e8435708d2bed0dfa0e 四面一致。
#
# tag 形态：v0.4.1（带 v 前缀），git ls-remote --tags 实证（40 个 tag 全量命中），
#   annotated tag 剥离后提交 8de7b9032f5ae75fe37810a22500b2514e33471c；
#   tag 树与 zip 解包 160 文件逐字节比对仅 debian/copyright 一处（symlink 表示差异，
#   不在 CMake 构建面）。详见 $TASK_DIR/w0-evidence.md。

sources:
  "0.4.1":
    url: "https://github.com/abbyssoul/libsolace/archive/v0.4.1.zip"
    sha256: "56d91ff180223322e0a93d62eb9f3974555f085d8e4e6e8435708d2bed0dfa0e"

# 本包唯一补丁：移除根 CMakeLists 里 Conan 1 遗留的两行
# （include conanbuildinfo.cmake + conan_basic_setup()）。Conan 2 不再生成该文件，
# include() 会直接 FATAL；这两行提供的两条全局语义（gtest 头 include 路径、CONAN_LIBS）
# 由配方 generate() 写的 CMAKE_PROJECT_INCLUDE 注入文件等价补回，上游其余文件零改动。
# 补丁内容与 conan-center-index 同包配方 _patch_sources() 的 replace_in_file 逐字相同。
# strip: 1 对应补丁头 a/CMakeLists.txt 的单层目录前缀。
patches:
  - patch_file: "patches/0001-drop-conan1-bootstrap.patch"
    strip: 1
    patch_description: "Drop the Conan 1 conanbuildinfo.cmake include and conan_basic_setup() call"
    patch_type: "portability"
