software: lensfun
# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3.4"
status: built
build_date: "2026-05-21"

source:
  url: "https://api.github.com/repos/lensfun/lensfun/tarball/v0.3.4"
  sha256: ""
  tar_format: tar.gz

build:
  # 构建系统类型
  build_system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_TESTS=OFF"
    - "-DBUILD_LENSTOOL=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - "glib2/2.80.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 需要添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 以兼容旧版 CMakeLists.txt"
  - "依赖 glib2，需要设置 PKG_CONFIG_PATH"