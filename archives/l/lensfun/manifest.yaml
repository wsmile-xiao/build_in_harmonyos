software: lensfun
display: "Lensfun"
description: "开源镜头校正库，提供相机和镜头数据库，用于图像畸变、色差、暗角校正"
category: graphics
homepage: "https://lensfun.github.io/"
license: LGPL-3.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 需要添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 以兼容旧版 CMakeLists.txt"
    - "依赖 glib2 >= 2.26，需要设置 PKG_CONFIG_PATH"
    - "编译为动态库 liblensfun.so"
  common_dependencies:
    - "glib2/2.80.0"

versions:
  "0.3.4":
    status: built
    build_date: "2026-05-21"
    source_url: "https://api.github.com/repos/lensfun/lensfun/tarball/v0.3.4"