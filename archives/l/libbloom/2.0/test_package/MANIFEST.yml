# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libbloom/2.0
homepage: https://github.com/jvirkki/libbloom

# 上游测试命令 (make test 构建并运行两个测试程序)
upstream_check_command: "make test"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# make test 实际运行的测试程序（源码包 misc/test/ 目录）
upstream_tests:
  - file: basic.c
    source: libbloom-2.0/misc/test/basic.c
    description: "静态库基础测试（init/add/check 断言，链接 libbloom.a）"
    command: "./build/test-basic"
  - file: test.c
    source: libbloom-2.0/misc/test/test.c
    description: "共享库完整测试（basic + 6 组 add_random 碰撞率验证，链接 libbloom.so）"
    command: "./build/test-libbloom"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bloom.c
    description: "消费者 round-trip：basic（init/add/check）+ save/load（500 元素持久化）+ merge（400 元素合并）"
    command: "ctest --output-on-failure"

# 测试断言总数 (近似值: basic 约 6 + save_load 约 502 + merge 约 402)
assertion_count: 910
