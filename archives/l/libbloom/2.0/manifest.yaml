version: "2.0"
software: "libbloom"
status: built
build_date: "2026-09-14"
build_system: "makefile"

source:
  url: "https://github.com/jvirkki/libbloom/archive/refs/tags/v2.0.tar.gz"
  sha256: "59965451ef033b0e060c9d7e472ead06af1ac61beddde11fe3ed4f5f4587bda6"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -j1 (R9)"
    - "make test (上游官方测试，test-basic + test-libbloom)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefile-posix-pwd.patch"

knowledge_gained:
  - "上游 Makefile 无 install 目标，package() 手动拷贝 bloom.h 与 build/ 产物"
  - "TOP := $(shell /bin/pwd) 在 OHOS 上不可用，改用 POSIX pwd（无平台宏）"
  - "编译器/归档工具从 Conan conf 获取 (R33)，CONFIG_SHELL 兜底 /data/service/hnp/bin/bash"
  - "上游 make test 运行两个测试程序，对应 HMBS_UPSTREAM marker discovered=2"
