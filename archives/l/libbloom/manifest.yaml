software: libbloom
display: "libbloom"
description: "A simple and small bloom filter implementation in plain C"
category: data
homepage: "https://github.com/jvirkki/libbloom"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 项目，无 configure，直接 make 构建，产物为 build/libbloom.a 与 build/libbloom.so（含 soname 符号链接）"
    - "上游无 install 目标，package() 手动拷贝 bloom.h 与构建产物"
    - "仅依赖系统数学库 libm，无第三方 Conan 依赖"
    - "上游测试为 make test（test-basic 静态库测试 + test-libbloom 共享库测试），在 build() 中完整执行"
  common_dependencies: []

versions:
  "2.0":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libbloom/2.0"
