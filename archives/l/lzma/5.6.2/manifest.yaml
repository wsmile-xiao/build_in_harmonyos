software: lzma
version: "5.6.2"
status: success
build_system: autotools
category: utility
description: XZ Utils - LZMA compression utilities

patches_applied:
  - file: 0001-add-harmonyos-support.patch
    purpose: "添加 HarmonyOS 支持"
    lines_changed: null

compatibility:
  level: high
  issues: []
  notes: "编译安装成功，xz/lzma 命令及库文件均可用"

test_results:
  type: build
  passed: 1
  failed: 0
  note: "autotools 编译通过，make check 未单独执行"

dependencies:
  required:
    - clang
    - make
  optional: []

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: clang 15.0.4

build:
  source: https://github.com/tukaani-project/xz/releases/download/v5.6.2/xz-5.6.2.tar.xz
  system: autotools
  dependencies:
    - clang
    - make
  
  configure_flags:
    - --prefix=${HOME}/usr/local
  
  patches:
    - 0001-add-harmonyos-support.patch

features:
  xz: yes
  lzma: yes
  lzma_info: yes
  threads: yes

install:
  binaries:
    - $HOME/usr/local/bin/xz
    - $HOME/usr/local/bin/lzma
    - $HOME/usr/local/bin/xzcat
    - $HOME/usr/local/bin/lzcat
    - $HOME/usr/local/bin/unxz
    - $HOME/usr/local/bin/unlzma
  libraries:
    - $HOME/usr/local/lib/liblzma.so
    - $HOME/usr/local/lib/liblzma.a

build_date: 2026-03-22