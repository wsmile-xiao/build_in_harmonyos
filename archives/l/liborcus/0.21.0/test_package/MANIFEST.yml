# test_package/MANIFEST.yml — liborcus 0.21.0
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liborcus/0.21.0
homepage: "https://gitlab.com/orcus/orcus"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: true

# 上游测试审计 (源码: liborcus-0.21.0.tar.xz,
# sha256 1c6e473d6b8a63d61d0e6874a1762d6f0e0e78338d763e48ac93126ecde19b37)
upstream_test_audit:
  source_tarball: "liborcus-0.21.0.tar.xz"
  source_sha256: "1c6e473d6b8a63d61d0e6874a1762d6f0e0e78338d763e48ac93126ecde19b37"
  total_members: 1857
  scanned_for:
    - "automake TESTS / check_PROGRAMS 目标 (全部 Makefile.am)"
    - "条件守卫 (WITH_TOOLS / BUILD_SPREADSHEET_MODEL / BUILD_PYTHON / 各 filter)"
    - "tests/ / test/ / src/test/ 目录与测试数据"
  scan_result: "39 个 automake TESTS 在本适配 flags 下运行：src/ 3 个无条件测试
    (enum-stream-test/orcus-xml-test/orcus-env-dump)；src/parser/ 22 个无条件单元测试；
    src/liborcus/ 14 个 filter 门控单元测试 (xlsx/xls-xml/ods 开，gnumeric 关)。
    另有 16 个被特性开关排除（见 conanfile.py EXCLUDED_UPSTREAM_TESTS 及下方）。
    src/ 的 9 个 filter 回归测试与 spreadsheet/python 测试需 libixion-0.20
    （制品仓无 ixion 包）及 tools/python 支持。"
  reason: "上游测试以 automake TESTS 形式存在，conanfile.py build() 中如实运行
    `make check` 并解析汇总输出为机器证据；test_package 另做消费者视角验证"

# 上游测试命令 (autotools 标准目标)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (39 个，全部由 make check 执行)
upstream_tests:
  - file: src/enum_stream_test.cpp
    source: liborcus-0.21.0/src/enum_stream_test.cpp
    description: "无条件：枚举流测试"
    command: "./enum-stream-test"
  - file: src/orcus_xml_test.cpp
    source: liborcus-0.21.0/src/orcus_xml_test.cpp
    description: "无条件：XML 导入测试（用 test/ 下样例数据）"
    command: "./orcus-xml-test"
  - file: src/orcus_env_dump.cpp
    source: liborcus-0.21.0/src/orcus_env_dump.cpp
    description: "无条件：环境转储自检"
    command: "./orcus-env-dump"
  - file: src/parser/*_test.cpp
    source: liborcus-0.21.0/src/parser/
    description: "无条件：22 个 parser 单元测试（base64/css/csv/json/numeric/parser-base/parser-global/sax-ns/sax/sax-token/stream/string-pool/threaded-json/threaded-sax-token/types/utf8/xml-namespace/xml-validation/xml-writer/yaml/zip-archive）"
    command: "make check -C src/parser"
  - file: src/liborcus/*_test.cpp
    source: liborcus-0.21.0/src/liborcus/
    description: "filter 门控：14 个 core 单元测试（xlsx-sheet-context/odf-helper/css-document-tree/json-document-tree/json-path/yaml-document-tree/xml-map-tree/common/dom-tree/json-structure-tree/json-map-tree/xml-structure-tree/xpath-parser/xls-filter-utils）"
    command: "make check -C src/liborcus"

# 特性开关排除的上游测试 (16 个，记 excluded，不计为通过；原因见 conanfile.py)
excluded_upstream_tests:
  - "orcus-csv-test, orcus-detect-test, orcus-xml-mapped-test, orcus-json-mapped-test, orcus-ods-test, orcus-ods-import-test, orcus-xlsx-test, orcus-xls-xml-test, orcus-gnumeric-test（需 tools + spreadsheet-model，即 libixion-0.20）"
  - "gnumeric-cell-context-test, gnumeric-sheet-context-test（需 gnumeric filter，即 libboost_iostreams）"
  - "auto-filter-test（需 spreadsheet-model，即 libixion-0.20）"
  - "test_xlsx.py, test_ods.py, test_xls_xml.py, test_gnumeric.py（需 python + spreadsheet-model）"

# test_package 中自带的测试 (消费者视角验证)
# R34: 实质调用被测包的 API（CSV/JSON/SAX 解析、string_pool、base64）
test_package_tests:
  - file: test_orcus.cpp
    description: "消费者功能测试：CSV 解析（5 断言：行数/单元数/首尾单元值/引号单元）、string_pool（3 断言：新建/复用/总数）、base64（2 断言：已知向量/编解码往返）、JSON 解析（4 断言：对象/数组/键/数值）、SAX 解析（1 断言：起止元素计数）。共 15 项断言，逐项打印 ORCUS-CHECK 证据行，失败即非零退出"
    command: "./test_orcus"
  - file: conanfile.py
    description: "Conan test() 入口：构建并运行 test_orcus，计数 ORCUS-CHECK ok 行输出 HMBS_TEST_PACKAGE_RESULT 标记，并从包内 res/ 重放 HMBS_UPSTREAM_TEST_RESULT 标记"
    command: "conan test test_package"

# 测试断言总数 (test_orcus.cpp 的 15 个真实断言，与 HMBS_TEST_PACKAGE_RESULT discovered=15 一致)
assertion_count: 15
