# 版本级 manifest —— liborcus 0.21.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.21.0"
software: liborcus

status: built
build_date: "2026-09-17"
build_system: autotools

source:
  url: "https://mirrors.aliyun.com/debian/pool/main/libo/liborcus/liborcus_0.21.0.orig.tar.xz"
  sha256: "1c6e473d6b8a63d61d0e6874a1762d6f0e0e78338d763e48ac93126ecde19b37"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=arm-unknown-linux-gnu --host=aarch64-unknown-linux-gnu（本 dist 的 config.sub 是 2022-01-03 版：认 aarch64 但不认 ohos，故 ohos 三元组被拒；四段名带 unknown 厂商可原样通过，且保持 build≠host 交叉模式）"
    - "--prefix=/（配合 DESTDIR 使 include/ 与 lib/ 直落包根）"
    - "--libdir=/lib --includedir=/include（prefix=/ 时 libdir 展开为 //lib，DESTDIR 路径出现双斜杠 .../p//lib/...，本轮 libtool chmod 报 ENOENT；钉死单斜杠绝对路径）"
    - "--enable-static --disable-shared（默认静态；非系统同名库，模板默认）"
    - "--disable-dependency-tracking"
    - "--disable-spreadsheet-model（需 libixion-0.20>=0.20.0，制品仓无 ixion 包；同时关掉 src/ 回归测试与 spreadsheet-model 库）"
    - "--disable-python（python 绑定超出基础适配范围）"
    - "--without-tools --without-benchmark（CLI 工具链 spreadsheet-model；benchmark 非验证内容）"
    - "--without-gnumeric-filter（gnumeric 的 BOOST_IOSTREAMS 检查要链接 libboost_iostreams，制品仓的 boost 均未编译该库；其余 ODS/XLSX/XLS-XML filter 保持默认开启）"
    - "--with-boost=<boost 包目录>（boost.m4 用 BOOST_ROOT/--with-boost 找头文件；boost 1.90.0 对本构建是纯头文件依赖）"
    - "ZLIB_CFLAGS / ZLIB_LIBS：上游 PKG_CHECK_MODULES([ZLIB],[zlib])，设备无 pkg-config，故显式导出（变量非空时短路）"
    - "MDDS_CFLAGS / MDDS_LIBS：上游 PKG_CHECK_MODULES([MDDS],[mdds-3.0>=3.0.0])；mdds 是 header-only 且其 mdds.pc.in 本就没有 Libs 行，故 MDDS_LIBS 取空白值（语义为空，与上游元数据一致）"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash（autoconf 2.71 的 exec 7<&0 需要；automake 的 all-recursive 也需要 POSIX 词分割）"
    - "configure 的 umask 077→022 改写（hmdfs 按组判通行）；autotools 辅助脚本统一 chmod +x；TMPDIR 复用任务注入值，不存在时回退到构建目录内 .tmp"
    - "CC/CXX 从 profile 的 tools.build:compiler_executables 显式导出（conan 的 toolchain env 脚本不会被裸 subprocess source）"
  dependencies:
    - mdds/3.2.1
    - boost/1.90.0
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PKG_CHECK_MODULES 在对应 <PREFIX>_CFLAGS 非空时短路、根本不调用 pkg-config：设备无 pkg-config 时这是唯一通路（libwpd 0.10.3 已验证三组变量对；本配方用 ZLIB/MDDS 两组）"
  - "mdds-3.0 的 pkg-config 名是版本化的（mdds-3.0>=3.0.0），但 mdds 包并不安装 .pc 文件（上游 misc/CMakeLists 只构建杂项程序，不安装 misc/mdds.pc.in）；header-only 库的 Libs 本就为空，故用环境变量对复现上游元数据"
  - "boost.m4 的 BOOST_SYSTEM 在 boost>=1.70 时只做头文件检查（header-only since 1.70），无链接测试：header-only 的 boost/1.90.0 足够"
  - "src/ 的全部回归测试挂在 WITH_TOOLS + BUILD_SPREADSHEET_MODEL 下（各 filter 的 TESTS += 嵌在条件内），--without-tools/--disable-spreadsheet-model 后 src/ 只剩 3 个无条件测试（enum-stream-test/orcus-xml-test/orcus-env-dump）"
  - "src/liborcus/ 的 14 个单元测试只受 filter 开关控制（xlsx/xls-xml/ods 开；gnumeric 关，故其 2 个 cell/sheet context 测试被排除），与 spreadsheet-model 无关；src/parser/ 的 22 个单元测试完全无条件"
  - "kohei.us 的 liborcus-0.21.0.tar.xz 实测是 0.12.0 旧包（内容与路径名不符），不可做镜像；Debian pool 的 .orig.tar.xz 与 GitLab release tar.xz 字节一致（sha256 相同），可做首选镜像"
