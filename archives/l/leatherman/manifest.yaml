# 软件级 manifest
# 文件位置: archives/l/leatherman/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: leatherman

# 显示名
display: "Puppet Leatherman"

# 一句话描述
description: "Collection of C++ and CMake utility libraries (Puppet Labs)"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/puppetlabs/leatherman"

# 开源许可证（SPDX 标识）
license: Apache-2.0

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "CMake 构建，静态库为主（上游默认 LEATHERMAN_SHARED=FALSE）"
    - "Boost 各组件来自制品仓 boost1.84 系列包，配方内生成 BoostConfig.cmake 垫片统一提供，避免多包 cmake_file_name 碰撞"
    - "libcurl 来自制品仓 curl 包，配方内生成 CURLConfig.cmake 垫片提供标准变量"
    - "Catch 1.10.0 与 rapidjson 1.0.2 随上游源码自带（vendor/），离线可用"
    - "gettext 缺失时上游自动降级（GETTEXT_ENABLED=OFF），无需补丁"
    - "ENABLE_CXX_WERROR=OFF：clang 15 下 C++11 老代码告警不应当成错误"
  common_dependencies:
    - boost1.84
    - curl

# 版本索引
versions:
  "1.12.1":
    status: built
    build_date: "2026-09-24"
