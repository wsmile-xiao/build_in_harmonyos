# test_package/MANIFEST.yml — leatherman 1.12.1
package: leatherman/1.12.1
homepage: "https://github.com/puppetlabs/leatherman"

# 上游测试命令（上游 tests/CMakeLists.txt：单测二进制 leatherman_test，
# ctest 注册名 "leatherman tests"；Catch v1 汇总行是唯一计数源）
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试盘点：37 个测试源文件编译进单个 Catch 二进制；
# TEST_CASE 53 + SCENARIO 48 = 101 个 Catch 用例（源码宏级审计）。
# ctest 只注册 1 个聚合条目，功能粒度以 Catch 汇总为准。
upstream_tests:
  - file: util/tests/strings_test.cc
    source: leatherman-1.12.1/util/tests/strings_test.cc
    description: "字符串工具（3 TEST_CASE）"
    command: "ctest -R \"leatherman tests\""
  - file: util/tests/uri.cc
    source: leatherman-1.12.1/util/tests/uri.cc
    description: "URI 解析/打印（2 TEST_CASE，含 query 前导问号语义）"
    command: "ctest -R \"leatherman tests\""
  - file: json_container/tests/json_container_test.cc
    source: leatherman-1.12.1/json_container/tests/json_container_test.cc
    description: "JSON 容器读写（13 TEST_CASE/SCENARIO）"
    command: "ctest -R \"leatherman tests\""
  - file: logging/tests/logging_stream.cc
    source: leatherman-1.12.1/logging/tests/logging_stream.cc
    description: "日志流（12 SCENARIO）"
    command: "ctest -R \"leatherman tests\""
  - file: ruby/tests/api-test.cc
    source: leatherman-1.12.1/ruby/tests/api-test.cc
    description: "ruby 动态绑定（9 SCENARIO，运行时 dlopen，无需 ruby 开发包）"
    command: "ctest -R \"leatherman tests\""

# test_package 中自带的测试（消费者视角验证安装包）
test_package_tests:
  - file: test_leatherman.cpp
    description: "消费者测试：locale 翻译/格式化、URI 解析、JSON 读写、文件读写、环境变量、日志落盘六类断言"
    command: "./test_leatherman"

# 上游测试总数（Catch 用例级口径；ctest 注册恒为 1 个聚合条目，见 upstream_test_audit）
upstream_test_total: 101
upstream_test_count_method: "auto"
upstream_test_audit: >-
  源码级审计：37 个 tests/*.cc 编译进单个 leatherman_test 二进制，
  grep 统计 TEST_CASE(53) + SCENARIO(48) = 101；tests/CMakeLists.txt 中
  add_test(NAME "leatherman tests" ...) 仅注册 1 个 ctest 条目。
  方法 auto：单一 Catch 框架聚合，功能计数以 Catch 汇总行
  "All tests passed (A assertions in M test cases)" 为准。

test_counting:
  upstream_independent_total: 101
  integration_independent_total: 6
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 6
assertion_count: 18
