# 版本级 manifest
# 文件位置: archives/l/leatherman/1.12.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.12.1"

# 软件名
software: "leatherman"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "cmake"
conan_ref: "leatherman/1.12.1"

# 源码信息
source:
  # 源码下载 URL
  url: "https://github.com/puppetlabs/leatherman/archive/refs/tags/1.12.1.tar.gz"

  # 源码校验和
  sha256: "4713368b76986f7b3218f85da1333c0ebcc4aa2625e39af0374c7b97fe57f6cd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DLEATHERMAN_SHARED=FALSE"
    - "-DLEATHERMAN_ENABLE_TESTING=ON"
    - "-DLEATHERMAN_INSTALL=ON"
    - "-DENABLE_CXX_WERROR=OFF"
    - "-DBOOST_STATIC=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.91.0.1.3
    - curl/8.15.0

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied: []

# 编译中学到的知识
knowledge_gained:
  - "多包同名 cmake_file_name 碰撞时，用自生成 <Pkg>Config.cmake 垫片统一对外提供，比逐包改名更稳"
  - "Catch 聚合二进制的上游套件：ctest 注册数恒为 1，功能用例数以 Catch 汇总行 M test cases 为准"
  - "R6：boost1.84-* 全系手动构建配方共用绝对编译器路径缺陷时，拆分包之间互换无效；垫片的头/库扫描不应依赖任一单个拆分包，须保留 CCI 伞包回退"
