# libiec61850 test_package — 上游测试声明
# CI 的 build_and_test.sh L0e 强制要求本文件存在；内容为真实清点结果。

package: libiec61850/1.6.1
homepage: "https://libiec61850.com/libiec61850"

# 上游测试入口：CMake 项目无 make check；ctest 注册数为 0（唯一的 add_test 位于
# pyiec61850/CMakeLists.txt，被 BUILD_PYTHON_BINDINGS=OFF 默认关闭）。
upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "cmake --build <build>   # 构建 libiec61850/hal 库 + examples 全部可配置示例目标"

# 上游测试面：examples/ 目录（上游无 tests/、test/ 目录）。
# 48 个示例源目录 / 51 处 add_executable 声明（3 处为 IF(WIN32) 与 ELSE 分支同名重复声明，
# 去重后 48 个示例目标）；本配置（无 mbedtls/sqlite/winpcap 组件）下可配置 39 个，全部构建+链接成功。
upstream_tests:
  - file: "examples/"
    source: "libiec61850-1.6.1/examples/"
    description: "上游唯一测试面：48 个 IEC 61850 示例程序（server/client/GOOSE/SV/mms_utility），构建期由 cmake.build() 编译并链接，作为上游用例的编译+链接验证；其中 39 个在本配置下构建成功，9 个按上游自身门控关闭（详见 notes.md 与 PR 正文归因）"
    command: "ctest -N   # Total Tests: 0（上游未注册 ctest 用例）；实际执行面为 cmake --build"

test_package_tests:
  - file: "test_libiec61850.c"
    description: "鸿蒙特有测试：消费者视角链接已安装的 libiec61850.a + libhal.a，真实调用 MmsValue/LinkedList/IedModel/Hal API 并逐条断言返回值（11 条断言）"
    command: "./test_libiec61850   # conan create 的 test 阶段经 self.run() 执行，退出码 0 且 assertions=11 failed=0"

# 消费者断言总数（test_package/test_libiec61850.c 的 CHECK 计数，实测 11 全通过）
assertion_count: 11
