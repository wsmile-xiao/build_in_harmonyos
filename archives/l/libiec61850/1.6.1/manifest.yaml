# 版本级 manifest — libiec61850 1.6.1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.6.1"
software: "libiec61850"
status: built
build_date: "2026-09-26"
build_system: cmake

source:
  url: "https://github.com/mz-automation/libiec61850/archive/refs/tags/v1.6.1.tar.gz"
  sha256: "64113483eea8aec4f18cef9f8bb3c872585b2c67566824c4373db257bcc7bf8e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBUILD_EXAMPLES=ON"
    - "-DBUILD_PYTHON_BINDINGS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-hal-ethernet-use-net-if-headers.patch"

knowledge_gained:
  - "设备 uname -s = HarmonyOS，CMake 无对应 platform module（E092）：hal/src 大量 IF(UNIX) 分支不成立会导致 add_library 报 No SOURCES given to target，必须显式置 CMAKE_SYSTEM_NAME=Linux。"
  - "OpenHarmony SDK 的 <linux/if_arp.h> 会 include <linux/netdevice.h> → <linux/if.h> → <linux/socket.h>，与 <sys/socket.h> 的 struct sockaddr_storage 重定义（E119/E091 同族）；本包改用 POSIX 头 <net/if_arp.h> + <net/if.h> 规避，既提供 ARPHRD_ETHER 又补齐 struct ifreq/IFNAMSIZ/IFF_*，且不引入被 PF5 禁止的 __OHOS__ 条件宏。"
  - "官方 tag 发布 tarball 中 third_party/{mbedtls,sqlite,winpcap} 只有 README（组件内容不随归档），上游据此自动关闭 TLS、R-GOOSE/R-SMV、sntp/tls 示例与 sqlite-log 驱动，属上游自身门控，不构成外部依赖。"
  - "上游无 tests/ 目录且 ctest 注册数为 0（唯一 add_test 位于 pyiec61850，默认 BUILD_PYTHON_BINDINGS=OFF），真实测试面是 examples/ 的 48 个示例程序，清点按 add_executable 去重后 48 计（51 处声明含 3 处 IF(WIN32)/ELSE 同名双分支）。"
  - "libiec61850 的 LinkedList_destroy() 会对每个元素 data 调 free()（等价 destroyDeep(self, Memory_free)）：消费者若放入非堆指针必须改用 LinkedList_destroyStatic()，否则退出期 segfault。"
