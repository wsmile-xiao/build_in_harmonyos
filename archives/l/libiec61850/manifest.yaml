# 软件级 manifest — libiec61850
# 遵循 ARCHIVE-SPEC v2.0

software: libiec61850
display: "libiec61850"
description: "IEC 61850 protocol stack (MMS/GOOSE/Sampled Values) with client and server"
category: network
homepage: "https://libiec61850.com/libiec61850"
license: LGPL-3.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 需显式 CMAKE_SYSTEM_NAME=Linux：设备 uname=HarmonyOS，CMake 无对应 platform module（E092），否则 IF(UNIX) 分支失效导致 add_library 无源文件"
    - "补丁 0001 把以太网 HAL 的 <linux/if_arp.h> 换成 POSIX 的 <net/if_arp.h> + <net/if.h>，规避 OHOS SDK linux/socket.h 与 sys/socket.h 的 sockaddr_storage 重定义（E119/E091 同族，且避免 PF5 禁止的 __OHOS__ 宏）"
    - "上游无 tests/ 目录、ctest 注册数为 0，测试面是 examples/ 的 48 个示例程序；test_package 提供 11 条鸿蒙消费者断言"
    - "libiec61850.a 不含 HAL 对象，消费者必须同时链接 hal（package_info 已声明）"
  common_dependencies: []

versions:
  "1.6.1":
    status: built
    build_date: "2026-09-26"
