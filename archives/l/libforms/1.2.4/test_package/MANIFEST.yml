software: libforms
version: "1.2.4"
test_type: installed-package
executables:
  - name: libforms_api_surface
    purpose: forces a live typed relocation for the 32 exported libforms/libflimage entry points the headers declare
  - name: libforms_abi_contract
    purpose: pins the FL_PUP_ENTRY layout, FL_COLOR width and FL_VERSION/FL_REVISION macros and asserts the measured no-X-server failure form
cases: 2
assertions: 10
assertion_formula: "8 static sites (1 sizeof + 4 offsetof + 1 type width + 2 version macros) + 2 runtime CHECK sites = 10; evaluated on this platform = 9, the 10th sits in the display != NULL branch that must not be taken"
relocation_probes: 32
relocation_probe_formula: "22 libforms.so.2 symbols + 10 libflimage.so.2 symbols = 32"
upstream_tests: 0
upstream_tests_evidence: "grep -rn '^TESTS|check_PROGRAMS|am__TESTS' --include=Makefile.in over the release tarball returns 0 hits"
