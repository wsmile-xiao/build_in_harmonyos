# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.4"

software: libforms

# published | built | failed | archived
# R29: 本地 create 通过前标 built，不伪造 published
status: built

build_date: "2026-09-28"
build_system: autotools

source:
  url: "https://download.savannah.nongnu.org/releases/xforms/xforms-1.2.4.tar.gz"
  sha256: "78cc6b07071bbeaa1f906e0a22d5e9980e48f8913577bc082d661afe5cb75696"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--srcdir=<source_folder>（树内构建 source=build，见 notes.md 问题 2）"
    - "--host=aarch64-linux-ohos"
    - "--enable-shared"
    - "--disable-static"
    - "--disable-gl"
    - "--disable-demos"
    - "--disable-docs"
    - "--x-includes=<libx11 include>"
    - "--x-libraries=<libx11 lib>"
    - "X_PRE_LIBS="
    - "X_EXTRA_LIBS="
    - "LDFLAGS=-L<linker-view>"
  make_options:
    - "-j2"
  dependencies:
    - "libjpeg/10"
    - "libx11/6.4.0"
    - "libxpm/3.5.17"
    - "xorgproto/2025.1"
  cc: clang

patches_applied:
  - patches/0001-config.guess.patch
  - patches/0002-config.sub.patch

knowledge_gained:
  - "clang 15 / lld 不再合并 common symbols：fdesign/sp_spinner.c 与 sp_twheel.c 各自非 static 定义 FL_OBJECT *curobj，旧代码仅靠 pre-Clang-10 隐式 -fcommon 语义链接；extra_cflags 加 -fcommon 是按上游书写方言构建的最小修复（E491，实测先离线探针复现 ld.lld duplicate symbol 再验证修复）"
  - "生成的 forms.h 由 stamp-forms 用 sed 拼接 AAA.h+34 个头（CLEANFILES=nodist），quoted include \"../include/forms.h\" 在 out-of-tree 构建下按源码树解析必然 file not found ⇒ 改树内构建（source=build=.）+ configure 后先 make -C lib/include forms.h 预生成并断言非空"
  - "AC_PATH_XTRA 不走 pkg-config 也不吃继承的 CPPFLAGS/LDFLAGS，必须 --x-includes/--x-libraries 直指 libx11 包目录，并显式 X_PRE_LIBS= / X_EXTRA_LIBS= 清空宿主残留探测"
  - "交叉 autotools 的 libtool .la 在 DESTDIR install 后引用绝对构建路径：recipe 先建 linker-view 再重写 .la（libdir= 指向 view、dependency_libs 归一为 -l 前缀），使 fdesign/fd2ps 链接与后续消费者 -lforms 均可解析"
  - "上游无任何自动化测试（TESTS=0），消费者证据按 E530 双可执行 test_package 承载：api_surface 用 __typeof__(&name) 强制类型化活重定位（32 探针），abi_contract 钉死结构布局/版本宏并断言无 X 平台 XOpenDisplay(NULL) 失败"
  - "nm 导出 ≠ 头文件声明：api_surface 草稿按 nm 选符号时 9/32 失效（7 个未导出、2 个头文件未声明），test_package 符号必须过「已声明 ∧ 已导出」双重交叉校验（__typeof__ 在编译期即拦截）"

upstream_tests_exist: false
upstream_test_audit: "Audited xforms-1.2.4 source archive: configure.ac / 20 个 Makefile.am 清点 TESTS=0、无 check 目标、无 gtest/pytest/criterion 绑定；demos/ 94 个 .c 为交互演示程序而非测试（无断言、需 X server）。"
reason: "libforms 1.2.4 ships no upstream test harness (TESTS=0, no check target, no framework bindings). HarmonyOS consumer evidence is carried by the E530 two-executable test_package (api_surface probes=32 link-time relocations; abi_contract static=8 runtime=2, asserting the measured no-X-server behaviour)."
