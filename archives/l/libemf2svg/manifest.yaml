software: libemf2svg
display: "libemf2svg"
description: "Microsoft EMF to SVG conversion library"
category: gfx
homepage: "https://github.com/kakwa/libemf2svg"
license: GPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "Library-only build (LONLY=ON): demo tool needs glibc argp, absent on OHOS"
    - "Uses vendored libuemf sources, no extra system dependency"
    - "Bridges upstream find_package names (PNG/Freetype/Fontconfig/LibXml2) via CMakeDeps properties"
  common_dependencies:
    - libpng
    - freetype
    - fontconfig
    - libxml2

versions:
  "1.8.1":
    status: built
    build_date: "2026-09-15"
