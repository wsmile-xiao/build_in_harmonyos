package: libemf2svg/1.8.1
homepage: "https://github.com/kakwa/libemf2svg"

# 上游测试命令: shell 套件, 无 ctest/make-check 目标
# tests/resources/check_correctness.sh 经 emf2svg-conv 转换 186 个
# tests/resources/emf/*.emf 并用 xmllint 校验; tests/test.c 为
# cmake -DUNITTEST=ON 才构建的 argv 驱动转换 harness
upstream_check_command: "tests/resources/check_correctness.sh -n (requires emf2svg-conv + xmllint)"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成: 完整 shell 套件在 OHOS 跑不全(conv 工具需 glibc argp,
# 且缺 xmllint/valgrind); test_upstream 直调同一 emf2svg() 入口
upstream_test_in_build: false
upstream_test_command: "test_upstream (upstream emf2svg() conversion path)"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/resources/check_correctness.sh
    source: libemf2svg-1.8.1/tests/resources/check_correctness.sh
    description: "upstream shell suite: convert 186 tests/resources/emf/*.emf fixtures via emf2svg-conv and validate SVG with xmllint (+valgrind unless -n)"
    command: "tests/resources/check_correctness.sh -n"
  - file: tests/test.c
    source: libemf2svg-1.8.1/tests/test.c
    description: "upstream UNITTEST harness (cmake -DUNITTEST=ON): convert argv EMF files through emf2svg(), needs conv-capable build"
    command: "./emf2svg-test tests/resources/emf/*.emf"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_consumer.c
    description: "consumer test: convert hand-crafted minimal EMF, check svg tags, is_emfplus query, namespace + resize options (9 assertions)"
    command: "./test_consumer"
  - file: test_upstream.c
    description: "upstream-path test: well-formed convert, variant-bounds convert with output-variance check, truncated-input reject (3 cases)"
    command: "./test_upstream"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
