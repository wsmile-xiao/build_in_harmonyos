# 版本级 manifest — libemf2svg 1.8.1
# 由真机预检实测结果填写（CMake 构建，待 evidence 轮回填）

version: "1.8.1"
software: "libemf2svg"
status: built
build_date: "2026-09-15"
build_system: "cmake"

source:
  url: "https://github.com/kakwa/libemf2svg/archive/refs/tags/1.8.1.tar.gz"
  sha256: "5a4b0051a2e8a7f999ecc1bb3451032833dc4c4f1e4bc6d938e4d5b4bec19c10"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DLONLY=ON"
    - "-DUSE_SYSTEM_LIBUEMF=OFF"
  dependencies:
    - libpng/1.6.58.2
    - freetype/2.14.3
    - fontconfig/2.18.1.1
    - libxml2/2.15.3.1
  cc: clang
  cxx: clang++

patches_applied: []  # SHARED硬编码改为build()内replace_in_file，无补丁文件

knowledge_gained:
  - "LONLY=ON 只构建库：emf2svg-conv 演示工具需要 glibc argp，OHOS musl 无 argp.h，Findargp 会 FATAL_ERROR"
  - "USE_SYSTEM_LIBUEMF=OFF 使用 vendored libuemf 源码，无需额外系统依赖"
  - "上游 add_library(emf2svg SHARED) 写死共享库；build()内replace_in_file去掉显式 SHARED 行，让 BUILD_SHARED_LIBS 接管 shared 选项（无补丁文件）"
  - "上游 find_package 名与本仓库 Conan 导出名不一致（PNG/Freetype/Fontconfig/LibXml2），用 CMakeDeps set_property 桥接（msdfgen/leptonica 同法）；cmake_file_name 只 set 同名大小写前缀变量，上游用的 FREETYPE_/FONTCONFIG_/LIBXML2_ 全大写变量需 additional_variables_prefixes 补齐"
  - "上游无 ctest/make-check 目标；测试实体为 tests/resources/check_correctness.sh（186 个 EMF + xmllint/valgrind）与 UNITTEST 小 harness"
  - "产物库名为 libemf2svg，头文件 emf2svg.h；上游已设 VERSION/SOVERSION，OHOS 侧补 SONAME 链接标志"
