# 版本级 manifest
# 文件位置: archives/l/libdetourcrowd/1.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.6.0"
software: libdetourcrowd
status: built
build_date: "2026-09-21"
build_system: cmake

source:
  url: "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v1.6.0.tar.gz"
  sha256: "d48ca0121962fa0639502c0f56c4e3ae72f98e55d88727225444f500775c0074"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DRECASTNAVIGATION_DEMO=OFF"
    - "-DRECASTNAVIGATION_EXAMPLES=OFF"
    - "-DRECASTNAVIGATION_TESTS=ON"
    - "-DRECASTNAVIGATION_DT_POLYREF64=OFF"
    - "-DRECASTNAVIGATION_DT_VIRTUAL_QUERYFILTER=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-tests-use-nullptr-under-cxx17.patch"
    reason: "Make the upstream C++17 test comparison portable by replacing NULL with nullptr."

knowledge_gained:
  - "libdetourcrowd is packaged from the official recastnavigation v1.6.0 archive and has no external Conan dependencies."
  - "The build compiles the complete upstream test target, then packages only DetourCrowd and its Detour dependency with the matching public headers."
  - "The upstream suite reported 43/43 passed on HarmonyOS x86_64: 30 functional cases and 13 benchmark cases."
  - "The HarmonyOS consumer test is compiled with __OHOS__, performs a TMPDIR file roundtrip, and initializes a dtCrowd on the hdc-connected VM."
  - "The DevEco toolchain defaults to arm64; OHOS_ARCH and all C/C++/ASM compiler targets are explicitly derived from the Conan architecture."
