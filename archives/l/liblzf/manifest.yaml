software: liblzf
display: "liblzf"
description: "极速 LZF 数据压缩库（liblzf）及 lzf(1) 压缩命令行工具"
category: compress
homepage: "http://software.schmorp.de/pkg/liblzf.html"
license: BSD-2-Clause OR GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 C 无依赖，预生成 configure，无需 autoreconf"
    - "只产出静态 liblzf.a（无 .so），无系统库污染风险"
    - "手写 Makefile 不认 DESTDIR，package() 用 prefix 显式覆盖安装"
    - "附带 bin/lzf 命令行工具，按 tool 声明 commands.json"
    - "上游无测试套件，HMBS_UPSTREAM_TEST_RESULT 按 no_tests 口径输出"

versions:
  "3.6":
    status: built
    build_date: "2026-09-21"
