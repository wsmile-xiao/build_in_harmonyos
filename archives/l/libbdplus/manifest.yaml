software: libbdplus
display: "libbdplus"
description: "VideoLAN research library implementing the BD+ System Specifications for Blu-ray"
category: library
homepage: "https://www.videolan.org/developers/libbdplus.html"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 只认 libgcrypt-config/gpg-error-config 脚本探针，用 build 内 wrapper 回答"
    - "自带 config.guess（2018 版）无 ohos 识别，用相等 --build/--host 走 E007 fallback"
    - "libaacs 仅是 noinst 示例的可选依赖，用 --without-libaacs"
    - "上游无自动化测试套件，按 no_tests 口径申报"
  common_dependencies:
    - libgcrypt
    - libgpg-error

versions:
  "0.2.0":
    status: built
    build_date: "2026-09-16"
