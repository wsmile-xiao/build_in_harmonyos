# 版本级 manifest
# 文件位置: archives/l/libbdplus/0.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.0"

# 软件名
software: "libbdplus"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（VideoLAN 官方发布页）
  url: "https://download.videolan.org/pub/videolan/libbdplus/0.2.0/libbdplus-0.2.0.tar.bz2"

  # 源码校验和（已用本地下载核对，与官方 mirrorlist 一致）
  sha256: "b93eea3eaef33d6e9155d2c34b068c505493aa5a4936e63274f4342ab0f40a58"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/"
    - "--libdir=/lib"
    - "--includedir=/include"
    - "--build=x86_64-pc-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-dependency-tracking"
    - "--without-libaacs"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libgcrypt/1.11.0
    - libgpg-error/1.55

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "configure 只认 libgcrypt-config/gpg-error-config 脚本探针（AC_PATH_PROG 硬失败），Conan 包无此脚本时用 build 内 wrapper 回答 --cflags/--libs（gpgme config-overrides 同构）"
  - "真机 configure 首个编译运行探针无法执行时，用 build != host 进真交叉模式（前提：已审计零 AC_RUN/TRY_RUN 探针），只跳过 run 测试其余编译链接探针照常"
  - "libtool 链 .la 时报 was moved / is not a valid libtool archive，用 E236 私有 la-free 目录：只拷贝依赖 .so/.a 普通文件并改 -L 指向，不动 Conan 缓存；且必须删掉 AutotoolsDeps 的缓存 -L 注入（否则 automake 把它排在 wrapper LIBS 之前，libtool 仍先命中毒 .la，ezstream 五轮诊断结论），build 另行 scrub 含 .la 的 -L 兜底"
  - "libaacs 仅是 noinst 示例 bdplus_test 的可选依赖（--without-libaacs），不进安装产物"
  - "上游无自动化测试套件（Makefile.am 无 TESTS/check_PROGRAMS），按 no_tests 口径申报"
