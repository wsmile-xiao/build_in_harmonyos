# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libbdplus/0.2.0
homepage: "https://www.videolan.org/developers/libbdplus.html"

# 上游测试套件存在性 (经审计上游源码确认：无自动化测试框架)
upstream_tests_exist: false

# 上游测试审计 (源码: libbdplus-0.2.0.tar.bz2,
# sha256 b93eea3eaef33d6e9155d2c34b068c505493aa5a4936e63274f4342ab0f40a58)
upstream_test_audit:
  source_tarball: "libbdplus-0.2.0.tar.bz2"
  source_sha256: "b93eea3eaef33d6e9155d2c34b068c505493aa5a4936e63274f4342ab0f40a58"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "check_PROGRAMS / TESTS (automake make check)"
    - "meson test wiring"
  scan_result: "0 matches — 顶层 Makefile.am 仅定义 lib_LTLIBRARIES 与 noinst_PROGRAMS，无 TESTS/check_PROGRAMS；87 个文件全清单中无 tests/ 目录、无 *test*.sh、无 pytest/meson 残留；configure.ac 无测试接线"
  manual_programs_only:
    - "src/examples/bdplus_test.c — 需真实 BD 碟片路径 + 卷 ID + 播放器密钥的手动程序（另可选链 libaacs），非自动化断言套件"
    - "src/examples/convtab_dump.c — 转换表导出工具，无断言"
  reason: "libbdplus 0.2.0 上游发布包不含任何自动化测试套件"

# 上游测试命令 (无自动化套件，故 check 命令不适用)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bdplus.c
    description: "消费者测试：运行期版本 0.2.0 + 宏/运行期版本一致 + NULL 句柄守卫 + 错误路径 bdplus_init 返回 NULL"
    command: "./test_bdplus"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
