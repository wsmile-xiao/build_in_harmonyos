# 软件级 manifest — libaudiomask
# 遵循 ARCHIVE-SPEC v3.0

software: libaudiomask
display: "libaudiomask"
description: "同时性音频掩蔽阈值估计库（psychoacoustics，mp3 压缩理论基础）"
category: library
homepage: "https://salsa.debian.org/debian/libaudiomask"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Debian libaudiomask 1.0 纯 Makefile 项目，无 configure 脚本"
    - "仅依赖 fftw/3.3.11（已发布）；mffm-fftw/1.7 未发布，按单 PR 单库约束做配方内静态 vendor 自闭环"
    - "不调用上游 Makefile（硬编码 g++/install(1)），配方直驱 clang++ 编译 + conan copy() 收集产物"
    - "上游无 check/test 目标；4 个 *Example（make ex）为唯一可执行验证，build() 内全量运行"
    - "零补丁"
  common_dependencies:
    - fftw/3.3.11

versions:
  "1.0":
    status: built
    build_date: 2026-09-24
    conan_ref: "libaudiomask/1.0"
