# 版本级 manifest — libaudiomask/1.0
# 遵循 ARCHIVE-SPEC v3.0

version: "1.0"
software: libaudiomask

status: built
build_date: "2026-09-24"
build_system: makefile
conan_ref: "libaudiomask/1.0"

source:
  url: "https://deb.debian.org/debian/pool/main/liba/libaudiomask/libaudiomask_1.0.orig.tar.gz"
  sha256: "a84ff2473b6265acdf4ca887c3ae823840d2cf68efee018d9e9dd1afd5f6e6eb"
  tar_format: tar.gz
  vendor_mffm_fftw:
    url: "https://deb.debian.org/debian/pool/main/m/mffm-fftw/mffm-fftw_1.7.orig.tar.gz"
    sha256: "5c7be71270812f468d270481f8959643bd374736c3bf18a7b9d2dccb9690aad0"
    reason: "mffm-fftw/1.7 未发布到 ohpcd 制品仓（真机 conan graph 报 Unable to find in remotes）；按单 PR 单库约束在配方内静态自闭环"

build:
  system: makefile
  configure_options:
    - "无 configure 脚本；配方直驱 clang++ 编译 4 个库单元并链接"
    - "clang++ -O2 -fPIC -std=c++17 -I<src> -I<fftw> -I<vendor-mffm-fftw>（含 mffm/ 别名目录）"
    - "先静态编译 vendored mffm-fftw 4 个单元（build_folder/vendor-objs），其对象同时链入 libaudiomask.so.1.0 与 libaudiomask.a"
    - "链接 libaudiomask.so.1.0（soname libaudiomask.so.1）+ libaudiomask.a（恒产出，供示例确定性链接）"
    - "头文件扁平安装：5 个库头进 include/，vendored mffm 4 头进 include/mffm/（AudioMasker.H 经 <mffm/realFFT.H> 强依赖，消费者 -Iinclude 即可解析）"
    - "2 个可构建上游示例全部编译并在 build() 内真实运行（AudioMaskerExample=make ex 注册项，depukfbExample=自包含）；另 2 个 *Example 需 GTFB/GCFB（orig 包、mffm-fftw 1.7、Build-Depends 三处皆无，Debian 亦不构建），审计为非测试文档文件不计数"
  dependencies:
    - fftw/3.3.11
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Debian libaudiomask 1.0（2010）与 flatmax/gtkiostream src/AudioMask 同源；MooreSpread.H 完全一致，可互为 API 旁证"
  - "Debian Build-Depends mffm-fftw-dev + libfftw3-dev；mffm-fftw/1.7 未发布到 ohpcd，真机 graph 失败，故官方 orig 包做 vendor 静态自闭环，仅保留 fftw/3.3.11 为 Conan 依赖"
  - "上游无 check/test 目标、无 tests/ 目录；make ex 仅注册 AudioMaskerExample（Makefile 第 37 行 + debian/rules 默认构建 + changelog 1.0-2 佐证），depukfbExample 自包含可运行，二者计为上游测试（总数 2）；AudioMaskExample/MooreSpreadExample 需 GTFB/GCFB（三处皆无、Debian 从未构建），系非测试文档文件"
  - "上游 Makefile 硬编码 g++/install(1)，OHOS 下改由配方直驱编译 + conan copy() 收集产物"
  - "AudioMask::exciteTerhardt 在 gtkiostream 头与示例之间存在 2/3 参不一致，test_package 只用稳定的 MooreSpread/DepUKFB/AudioMasker(double*,int) API"
