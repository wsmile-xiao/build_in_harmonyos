# test_package/MANIFEST.yml — libaudiomask/1.0 上游测试声明 + 消费者测试登记
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: libaudiomask/1.0
homepage: "https://salsa.debian.org/debian/libaudiomask"

# ── 上游测试审计（2026-09-25 基于官方发布包 + debian 打包元数据复核）──
# 1) 发布包：Debian 官方池 libaudiomask_1.0.orig.tar.gz（3712901 字节，
#    md5 2a515d7cd6d39fb9407ef527d3c76c11，
#    sha256 a84ff2473b6265acdf4ca887c3ae823840d2cf68efee018d9e9dd1afd5f6e6eb，
#    本轮经 Kali 官方镜像复核：同尺寸同包，141 个成员）。
# 2) 源码根文件清单：AudioMask.H/.cc、AudioMasker.H/.cc、MooreSpread.H/.cc、
#    depukfb.H/.cc、fastDepukfb.H、Makefile、audio.44100.txt、
#    API-libaudiomask/、latex/、debian/；无 tests/、test/ 目录。
# 3) 构建系统：纯 Makefile，无 configure；Makefile 无 check/test/regress 目标。
#    `ex` 目标全文仅一行（Makefile 第 37 行）：
#      $(CC) -L/home/flatmax/lib -lfftw3 -lfft $(OBJ) -o AudioMaskerExample AudioMaskerExample.cc
#    即上游注册的可执行验证只有 AudioMaskerExample；debian/rules 走默认
#    `all: libs ex`，Debian 官方构建亦只编译该示例。changelog 1.0-2 佐证：
#    "Fixed the makefile so that 'make ex' now compiles" +
#    "Added the example input audio.44100.txt file"。
# 4) depukfbExample.cc 仅依赖 depukfb.H/fastDepukfb.H（自包含），可构建可运行，
#    计入上游验证。
# 5) AudioMaskExample.cc / MooreSpreadExample.cc 不是可执行测试，不计数：
#    二者分别 `#include "../fft/realFFT.H"` 且实际使用 GCFB/GTFB 滤波器组
#    （USEGCFB、GCFB gcfb / GTFB gtfb、gtfb.prev()->cf 等）；而 GTFB/GCFB 头
#    既不在 orig 包内，也不在 mffm-fftw 1.7 包内（该包仅
#    realFFT/realFFTData/complexFFT/real2DFFT，47 个成员已逐项核对），
#    更不在 debian/control 声明的 Build-Depends
#    （libfftw3-dev、mffm-fftw-dev）中；Debian 官方构建从未编译二者。
#    在任何满足声明依赖的环境下二者都不可构建，故按"非测试文档文件"排除，
#    非"可运行子集替代总数"。
# 6) 口径 auto：单一可解析框架（示例二进制退出码 0=通过），数字来自真机
#    build_folder/upstream_tests.log 回解析（每示例一行 RESULT），非 stdout 数数。
upstream_tests_exist: true
upstream_test_audit: "复核 Debian libaudiomask_1.0.orig.tar.gz（sha256 a84ff247…6e6eb，141 成员）：无 tests/ 目录、无 check/test 目标；Makefile ex 目标仅注册 AudioMaskerExample（debian/rules 默认构建佐证，changelog 1.0-2 点名 make ex + audio.44100.txt）；depukfbExample 自包含可运行；AudioMaskExample/MooreSpreadExample 需 GTFB/GCFB（orig 包、mffm-fftw 1.7、Build-Depends 三处皆无，Debian 从未构建），系非测试文档文件不计数。上游总数 2，口径 auto。"

upstream_check_command: "build + run 2 *Example binaries (make ex equivalent + self-contained depukfbExample)"
upstream_test_in_build: true
upstream_test_command: "run AudioMaskerExample/depukfbExample in source root"

upstream_tests:
  - file: AudioMaskerExample.cc
    source: libaudiomask_1.0.orig.tar.gz/AudioMaskerExample.cc
    description: "上游注册验证：make ex 唯一目标，AudioMasker 时域信号掩蔽阈值演示（输入 audio.44100.txt 由 Debian 1.0-2 随包提供）"
    command: "./AudioMaskerExample"
  - file: depukfbExample.cc
    source: libaudiomask_1.0.orig.tar.gz/depukfbExample.cc
    description: "上游自包含示例：DepUKFB/FastDepUKFB roex 滤波器组演示，无外部依赖"
    command: "./depukfbExample"

# Counting unit: one upstream example binary (exit 0 = pass). Single parseable
# framework, so upstream_test_count_method is auto. Expected true-machine
# evidence: discovered=2, executed=2, passed=2, failed=0, skipped=0.
upstream_test_total: 2
upstream_test_count_method: auto
upstream_test_passed: 2
upstream_test_failed: 0
upstream_test_skipped: 0

test_package_tests:
  - file: test_libaudiomask.cpp
    description: "消费者测试：真实链接 packaged libaudiomask，覆盖 DepUKFB/MooreSpread/AudioMasker 共 11 个 CHECK（R34 反空壳：移走 include/lib 必失败；AudioMasker 用公开 pfb/mask 指针断言，bankCount 为私有成员无 getBankCount）"
    command: "./test_libaudiomask"
    assertion_count: 11

assertion_count: 11
