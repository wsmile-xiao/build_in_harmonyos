sources:
  # NOTE (2026-09-25 真机证据): deb.debian.org 在真机曾连续超时
  # (HTTPSConnectionPool Read timed out)，而 ftp.debian.org 同轮成功；
  # 2026-09-24 预检更在 source() 下载中 SSH 中断
  # (Calling source() 后 Connection closed by remote host)。
  # Debian 池不在 ci/conan/build_and_test.sh 的自动镜像映射内，
  # 故手工前置国内 Debian 官方镜像（同池同文件，sha256 不变；
  # 复用该脚本已维护的 aliyun/tuna/ustc 三源），官方原 URL 留作最终回退。
  libaudiomask:
    url:
      - "https://mirrors.aliyun.com/debian/pool/main/liba/libaudiomask/libaudiomask_1.0.orig.tar.gz"
      - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/liba/libaudiomask/libaudiomask_1.0.orig.tar.gz"
      - "https://mirrors.ustc.edu.cn/debian/pool/main/liba/libaudiomask/libaudiomask_1.0.orig.tar.gz"
      - "https://ftp.debian.org/debian/pool/main/liba/libaudiomask/libaudiomask_1.0.orig.tar.gz"
      - "https://deb.debian.org/debian/pool/main/liba/libaudiomask/libaudiomask_1.0.orig.tar.gz"
    sha256: "a84ff2473b6265acdf4ca887c3ae823840d2cf68efee018d9e9dd1afd5f6e6eb"
  mffm_fftw:
    url:
      - "https://mirrors.aliyun.com/debian/pool/main/m/mffm-fftw/mffm-fftw_1.7.orig.tar.gz"
      - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/m/mffm-fftw/mffm-fftw_1.7.orig.tar.gz"
      - "https://mirrors.ustc.edu.cn/debian/pool/main/m/mffm-fftw/mffm-fftw_1.7.orig.tar.gz"
      - "https://ftp.debian.org/debian/pool/main/m/mffm-fftw/mffm-fftw_1.7.orig.tar.gz"
      - "https://deb.debian.org/debian/pool/main/m/mffm-fftw/mffm-fftw_1.7.orig.tar.gz"
    sha256: "5c7be71270812f468d270481f8959643bd374736c3bf18a7b9d2dccb9690aad0"
