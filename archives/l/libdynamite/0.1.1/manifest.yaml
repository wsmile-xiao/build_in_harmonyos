# 版本级 manifest —— libdynamite 0.1.1
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.1"
software: libdynamite

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-18"
build_system: cmake

source:
  url: "https://github.com/twogood/dynamite/archive/ccf573ad71cebbfe72f9fe2bead6b2954bb161c0.tar.gz"
  sha256: "e182395fd193e4591a9177cbf51aefc01d8bbc32b326ca233deed4311fd1a287"
  tar_format: tar.gz
  version_note: "上游仓库无 tag/release；0.1.1 为官方提交 ccf573ad71cebbfe72f9fe2bead6b2954bb161c0 的树状态（2008-05-06 提交「Upped the version number」，其 VERSION 文件内容为 0.1.1）"

build:
  system: cmake
  configure_options:
    - "配方自带 CMakeLists.txt：上游仓库只带 configure.ac.in + bootstrap（需 automake/libtoolize，平台皆缺）；生成的 autotools 输出有数万行，对三个 C 文件而言既臃肿又会超出评审工具的行数上限，故以配方内 CMake 构建同一批产物（上游源码未改动）"
    - "BUILD_SHARED_LIBS 按 Conan shared 选项映射；产物：libdynamite.a + dynamite/queen_extract 两个命令行工具"
    - "构建环境显式清空 LD_LIBRARY_PATH（部分 CI worker 的 ambient 指向不兼容 libxml2 会破坏 SDK lld——同 libodfgen/libabw 根因）"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "老 autotools 工程（2008 代）只发 configure.ac.in + bootstrap 脚本时：在完整 autotools 主机上生成构建系统并作为补丁随配方交付，是本平台（无 automake/libtoolize）唯一可行路径"
  - "libdynamite 的位流为 LSB-first（dynamite_read_bit 取 byte&1 后右移）；自建测试流时位打包顺序必须与读取端一致"
