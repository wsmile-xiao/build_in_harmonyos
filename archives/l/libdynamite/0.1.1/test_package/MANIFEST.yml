# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libdynamite/0.1.1
homepage: "https://github.com/twogood/dynamite"

# 上游**没有**测试套件：仓库只有 lib/（库本体）与 src/（dynamite、
# queen_extract 两个命令行工具），无 tests/ 目录、无 check 目标、
# 无 *test* 源文件（2026-09-17 对 ccf573ad 提交树实测）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libdynamite.c
    description: >-
      消费者功能测试（6 项断言，全部走公共 API dynamite_explode）：测试自建
      PKWARE implode 流（原始表示头 + 字面量令牌 + 长度 519 的流结束令牌），
      在字典位 4/5/6 三种头部下解码均须逐字节等于源文本；另三项负例——
      编码字面量表示（头字节 1）报 DYNAMITE_NOT_IMPLEMENTED、未知表示
      （头字节 2）与非法字典位（头字节 7）报 DYNAMITE_BAD_FORMAT。
      失败即非零退出。
