# test_package/MANIFEST.yml — libregf 20240421
package: libregf/20240421
homepage: "https://github.com/libyal/libregf"

# Upstream ships an automake test suite executed via `make check`.
upstream_tests_exist: true
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/test_library.sh
    source: libregf-alpha-20240421/tests/test_library.sh
    description: "Library unit tests: 28 regf_test_* binaries (checksum, data blocks, file, hive bins, key, value, notify, tools handles)"
    command: "make check"
  - file: tests/test_tools.sh
    source: libregf-alpha-20240421/tests/test_tools.sh
    description: "Tools unit tests: regftools helper binaries exercised via test_tools.sh"
    command: "make check"
  - file: tests/test_regfinfo.sh
    source: libregf-alpha-20240421/tests/test_regfinfo.sh
    description: "regfinfo end-to-end test on bundled test images"
    command: "make check"
  - file: tests/test_regfexport.sh
    source: libregf-alpha-20240421/tests/test_regfexport.sh
    description: "regfexport end-to-end test on bundled test images"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Consumer test: get_version, access_flags, file_initialize, check_file_signature rejects non-REGF, file_free"
    command: "./test_libregf"

assertion_count: 5
