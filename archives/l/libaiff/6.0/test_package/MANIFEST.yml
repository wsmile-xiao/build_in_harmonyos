# 上游测试审计（源码：mtszb/libaiff tag v6.0，
# tarball https://github.com/mtszb/libaiff/archive/refs/tags/v6.0.tar.gz，
# sha256 9d90765b2b90942f928698c02ae1b7caf3037847dbe20a100469998f93e61ffd）
upstream_test_audit:
  source_tarball: "v6.0.tar.gz"
  source_sha256: "9d90765b2b90942f928698c02ae1b7caf3037847dbe20a100469998f93e61ffd"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "check_PROGRAMS / TESTS (automake make check)"
    - "meson test wiring"
    - "tests/ or test/ directory"
  scan_result: "0 matches — v6.0 全树 27 个文件（15 个 .c/.h 源码 + configure.ac/Makefile.am/m4），无 tests/ 或 test/ 目录；Makefile.am 仅声明 lib_LTLIBRARIES（含 libaiff.la），无 TESTS/check_PROGRAMS/check-local；configure.ac 无测试框架探测"
  manual_programs_only: []
  reason: "mtszb/libaiff v6.0 上游发布包不含任何自动化测试套件"

# 上游测试命令（无自动化套件，故 check 命令不适用）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libaiff_roundtrip.c
    description: "核心读写回环：写 8 帧 32 位采样后读回比对，校验音频格式与 Seek 重读"
    command: "./test_libaiff_roundtrip"
  - file: test_libaiff_metadata.c
    description: "元数据与错误路径：NAME/AUTH/COPY 属性回环、instrument 查询可调用性、缺失文件返回 NULL"
    command: "./test_libaiff_metadata"

# 测试断言总数（CHECK-OK 行数：回环 7 + 元数据 5）
assertion_count: 12
