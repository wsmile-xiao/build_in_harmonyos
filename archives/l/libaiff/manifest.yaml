software: libaiff
display: "LibAiff"
description: "C library for transparent read/write of AIFF/AIFF-C audio files"
category: library
homepage: "https://github.com/mtszb/libaiff"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Upstream 6.0 has no pre-generated configure; run autoreconf -fi with automake/autoconf/libtool tool_requires"
    - "Replace umask 077 with umask 022 in generated configure for HMDFS compatibility"
    - "Explicit --build/--host=aarch64-unknown-linux-ohos since config.guess cannot identify HarmonyOS"
    - "No upstream test suite; test_package covers sample round-trip and metadata APIs"
  common_dependencies: []

versions:
  "6.0":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libaiff/6.0"
