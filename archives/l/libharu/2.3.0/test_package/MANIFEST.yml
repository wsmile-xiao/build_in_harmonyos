# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libharu/2.3.0
homepage: "https://github.com/libharu/libharu"

# 上游测试命令 — libharu 无 CTest/`make check` 测试目标
# (prescan 报告 has_tests=false)；上游验证靠 demo/ 示例程序生成 PDF。
upstream_check_command: "make check (N/A, upstream has no check target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（代表例演示程序，生成 PDF 并验证非空）
upstream_tests:
  - file: demo/text_demo.c
    source: libharu-2.3.0/demo/text_demo.c
    description: "文本渲染示例，生成 text_demo.pdf (20658 字节)"
    command: "./text_demo"
  - file: demo/text_demo2.c
    source: libharu-2.3.0/demo/text_demo2.c
    description: "文本排版示例，生成 text_demo2.pdf (15496 字节)"
    command: "./text_demo2"
  - file: demo/line_demo.c
    source: libharu-2.3.0/demo/line_demo.c
    description: "线条绘制示例，生成 line_demo.pdf"
    command: "./line_demo"
  - file: demo/arc_demo.c
    source: libharu-2.3.0/demo/arc_demo.c
    description: "圆弧绘制示例，生成 arc_demo.pdf"
    command: "./arc_demo"
  - file: demo/font_demo.c
    source: libharu-2.3.0/demo/font_demo.c
    description: "字体渲染示例，生成 font_demo.pdf"
    command: "./font_demo"
  - file: demo/grid_sheet.c
    source: libharu-2.3.0/demo/grid_sheet.c
    description: "网格纸示例，生成 grid_sheet.pdf"
    command: "./grid_sheet"
  - file: demo/ext_gstate_demo.c
    source: libharu-2.3.0/demo/ext_gstate_demo.c
    description: "扩展图形状态示例，生成 ext_gstate_demo.pdf"
    command: "./ext_gstate_demo"
  - file: demo/link_annotation.c
    source: libharu-2.3.0/demo/link_annotation.c
    description: "链接注解示例，生成 link_annotation.pdf"
    command: "./link_annotation"
  - file: demo/outline_demo.c
    source: libharu-2.3.0/demo/outline_demo.c
    description: "书签大纲示例，生成 outline_demo.pdf"
    command: "./outline_demo"
  - file: demo/text_annotation.c
    source: libharu-2.3.0/demo/text_annotation.c
    description: "文本注解示例，生成 text_annotation.pdf"
    command: "./text_annotation"

# test_package 中自带的测试 (消费者视角验证, 实际调用 libharu API)
test_package_tests:
  - file: test.c
    description: "消费者测试：HPDF_New/AddPage/BeginText/SaveToFile 生成 PDF 并校验非空"
    command: "./test_libharu"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10