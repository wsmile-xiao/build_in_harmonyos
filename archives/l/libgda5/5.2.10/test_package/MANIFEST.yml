# test_package/MANIFEST.yml
# 上游官方测试声明文件 — libgda5 5.2.10

package: libgda5/5.2.10
homepage: "https://gitlab.gnome.org/GNOME/libgda"

# 上游测试命令（automake 测试树）
upstream_check_command: "make -C tests check"
upstream_test_in_build: false

# 上游实际运行的测试程序（tests/ 树，共 38 个）
# 说明：automake 的并行测试 harness 在本平台（HMDFS getcwd 限制）无法工作，
# 因此本机以「直接执行同一批测试二进制」的方式运行，命令与逐项结果见 notes.md。
upstream_tests:
  - file: tests/test-ddl-creator
    description: "DDL 创建器（gda_ddl_creator）测试"
  - file: tests/test-bin-converter
    description: "二进制值转换测试"
  - file: tests/test-sql-identifier
    description: "SQL 标识符处理测试"
  - file: tests/test-identifiers-quotes
    description: "标识符引号测试"
  - file: tests/test-sql-builder
    description: "SQL 构建器测试"
  - file: tests/test-connection-string-split
    description: "连接字符串解析测试"
  - file: tests/test-input-parsers
    description: "输入解析器测试"
  - file: tests/test-quark-list
    description: "GdaQuarkList 测试"
  - file: tests/test-sql-renderer
    description: "SQL 渲染测试"
  - file: tests/data-models/check_*
    description: "数据模型测试（9 个：import/virtual/data-proxy/model-copy/pmodel/empty-rs/model-errors/vcnc/pivot）"
  - file: tests/meta-store/check_meta_store_*
    description: "元数据存储测试（memory/sqlite 通过；postgresql/mysql 需要有服务端，跳过）"
  - file: tests/multi-threading/check_*
    description: "多线程测试（5 个：mutex/parser/cnc-lock/threaded-cnc/wrapper）"
  - file: tests/parser/check_*
    description: "SQL 解析器测试（6 个：parser/validation/normalization/dml-comp/script/rewrite-for-default）"
  - file: tests/providers/check_sqlite
    description: "SQLite provider 端到端测试（建库/元数据/游标/查询/清理）"
  - file: tests/value-holders/check_*
    description: "值/持有者测试（3 个：holder/set/statement）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/test_libgda.c
    description: "消费者功能测试：provider 发现 + 内存 SQLite 连接 + DDL/DML/DQL 往返 + 数据模型取值"
    command: "./test_libgda"
  - file: test_package/test_ohos.c
    description: "HarmonyOS 专项测试：__OHOS__ 平台守卫 + provider 插件 dlopen(RTLD_NOW) + 中文 UTF-8 往返 + HMDFS 文件型数据库重开校验"
    command: "./test_ohos"

assertion_count: 45
