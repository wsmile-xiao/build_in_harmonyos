software: libgda5
version: 5.2.10
status: built
build_system: autotools
compiled_date: 2026-09-21

dependencies:
  required:
    - glib >= 2.32 (shared; glib-2.0/gobject-2.0/gthread-2.0/gmodule-no-export-2.0/gio-2.0)
    - libxml-2.0
    - libxslt (libgda-xslt / libgda-report)
    - iso-codes (可选数据)
  build:
    - pkg-config (pkgconf)
    - intltool >= 0.40.6
    - gettext (msgmerge/msgfmt, OHOS SDK gettext.org)
    - glib 的 glib-mkenums / glib-genmarshal
  removed:
    - sqlite3 (改用 libgda 自带内嵌 sqlite，见 notes.md)

configure_options:
  - --build=aarch64-linux
  - --host=aarch64-linux
  - --disable-system-sqlite
  - --without-libsecret
  - --without-libsoup
  - --without-bdb
  - --without-oracle
  - --without-ldap
  - --without-firebird
  - --without-mdb
  - --without-java
  - --without-gnome-keyring
  - --without-ui
  - --disable-gdaui-gi
  - --disable-crypto
  - --disable-tools
  - --disable-gtk-doc
  - --disable-dependency-tracking
  - --disable-vala

products:
  library:
    - libgda-5.0.so.4 (libgda-5.0.so.4.1.1)
    - libgda-report-5.0.so.4
    - libgda-xslt-5.0.so.4
    - lib/libgda-5.0/providers/libgda-sqlite.so
  pkgconfig:
    - libgda-5.0.pc
    - libgda-report-5.0.pc
    - libgda-xslt-5.0.pc
  headers:
    - include/libgda-5.0/libgda/*.h
    - include/libgda-5.0/libgda.h

