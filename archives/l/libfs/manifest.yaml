software: libfs
display: "X.Org Font Server Protocol Client Library"
description: "X11 client library for the Font Server protocol and the libFS.so.6 ABI"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/lib/libfs"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Recognizes the native aarch64-linux-ohos Autotools triplet"
    - "Uses released xorgproto and xtrans Conan packages"
    - "Preserves the upstream libFS.so.6 ABI and FSlib.h public headers"
  common_dependencies:
    - xorgproto
    - xtrans

versions:
  "1.0.10":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libfs/1.0.10"
