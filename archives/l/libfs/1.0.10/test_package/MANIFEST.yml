package: "libfs/1.0.10"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libfs"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
# make check only BUILDS test/FSGetErrorText (noinst_PROGRAMS, no TESTS);
# the recipe executes the built binary right after it:
upstream_test_command: "FONTSERVER=127.0.0.1:<port> ./test/FSGetErrorText"

upstream_tests:
  - file: test/FSGetErrorText.c
    source: libFS-1.0.10/test/
    description: >-
      FSGetErrorText: completes the FSOpenServer() handshake, then looks
      up the error strings for the 13 named FS protocol error codes
      (FSSuccess through FSBadImplementation) and 3 out-of-range values
      (12, 256, 0xffff); every lookup returns a non-NULL string and the
      program exits 0.
    command: "FONTSERVER=127.0.0.1:<port> ./test/FSGetErrorText"
    note: >-
      test/Makefile.am declares FSGetErrorText under noinst_PROGRAMS
      with no TESTS entries, so the Automake check target only builds
      the binary; the recipe executes it right after make check. OHOS
      ships no xfs font server, so the recipe spawns an in-process
      loopback peer that completes the FSOpenServer handshake
      (fsConnSetup with status=AuthSuccess, then fsConnSetupAccept with
      a 32-bit aligned vendor string); the error-string lookups are
      local table reads through the server handle. The upstream test
      sources are used unmodified.

test_package_tests:
  - id: "public-api-contract"
    source: "api_contract.c"
    command: "libfs_api_contract"
    description: >-
      Exercise the installed library through the public FSlib.h API
      without a font server: FSServerName precedence (explicit server
      wins, FONTSERVER fallback, NULL when unset), a 256-byte FSMalloc
      byte-pattern round-trip released with FSFree, the NULL contracts
      of FSFree and the FSFreeFontNames/FSFreeCatalogues/
      FSFreeExtensionList destructors, and the documented NULL failure
      return of FSOpenServer for a missing server, an unknown
      transport, and an unreachable FONTSERVER endpoint.
  - id: "ohos-target-artifact-contract"
    source: "conanfile.py"
    command: "readelf -h/-d/--dyn-syms/-SW (recipe-side checks in test())"
    description: >-
      HarmonyOS-specific artifact checks: the installed shared libFS.so
      is ELF64 AArch64 DYN with SONAME libFS.so.6, bare DT_NEEDED
      sonames including the musl libc, no DT_RPATH/DT_RUNPATH, and
      exported FSOpenServer, FSServerName, FSMalloc, FSFree symbols;
      the consumer binary is ELF64 AArch64, dynamically linked against
      libFS.so.6 in shared mode, and carries exactly one .codesign
      section after binary-sign-tool signing. In static mode libFS.a
      members are verified to be ELF64 AArch64 objects that define the
      same entry points.

# upstream 1 (FSGetErrorText, executed by the recipe after make check)
# + new integration 1 (public-api-contract)
# + HarmonyOS-specific 1 (ohos-target-artifact-contract) = 3 in total
test_counting:
  upstream_independent_total: 1
  integration_independent_total: 1
  harmonyos_specific_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 3
# 31 internal checks of the two test_package flows; the upstream
# FSGetErrorText adds 16 error-string lookups owned by the upstream test.
assertion_count: 31
