software: lua-pgmoon
display: "Pgmoon"
description: "PostgreSQL client library for Lua/OpenResty"
category: db
homepage: "https://github.com/Kong/pgmoon"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Lua 实现，无需编译 C 代码"
    - "支持 OpenResty cosocket API 和普通 LuaSocket"
    - "支持多种 PostgreSQL 认证方式"
  common_dependencies:
    - lua >= 5.1
    - lpeg

versions:
  "2.3.4.0":
    status: built
    build_date: "2026-06-12"
