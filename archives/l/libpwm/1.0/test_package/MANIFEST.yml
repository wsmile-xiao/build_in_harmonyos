# test_package/MANIFEST.yml
# libpwm 1.0-rc2.

package: libpwm/1.0
homepage: https://git.kernel.org/pub/scm/linux/kernel/git/ukleinek/libpwm.git

upstream_tests_exist: false
upstream_test_audit: "no tests/ directory and no make check; the tarball ships three example programs (pwmround, pwmset, pwmtestperf) which need a real PWM chip"
upstream_check_command: "n/a"
upstream_test_in_build: true
upstream_test_command: "./pwmround; ./pwmset; ./pwmtestperf (run by build(), output logged)"

upstream_tests:
  - name: pwmround
    command: "./pwmround"
    expected: "runs and reports the missing PWM chip (no hardware in the sandbox)"
  - name: pwmset
    command: "./pwmset"
    expected: "runs and reports the missing PWM chip"
  - name: pwmtestperf
    command: "./pwmtestperf"
    expected: "runs and reports the missing PWM chip"

test_package_tests:
  - file: test_libpwm.c
    description: "pwm_chip_open_by_number() returns NULL (and sets errno) for chip 0, a non-existent chip and an out of range number in an environment without PWM devices"
    command: "./libpwm_consumer"

test_files:
  - path: "test_package/test_libpwm.c"
    test_type: "R34"
    assertion_count: 4

test_package_test_count: 1
consumer_assertion_count: 4
assertion_count: 4
