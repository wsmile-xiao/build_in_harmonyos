patches:
  - patch_file: "patches/0001-config-sub-ohos.patch"
    patch_description: "The bundled config.sub (GNU config 2023-01-21) does not know OHOS: add ohos* to the basic system types and linux-ohos* to the kernel-OS validation table (same two hunk approach as archives/a/acl; without it configure rejects aarch64-unknown-linux-ohos with \"OS ohos not recognized\")."
    patch_type: "portability"
