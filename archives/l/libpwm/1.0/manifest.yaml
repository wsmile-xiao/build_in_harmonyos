software: libpwm
version: "1.0"
status: built
build_date: "2026-09-19"
build_system: autotools
conan_ref: "libpwm/1.0"

source:
  url: "https://deb.debian.org/debian/pool/main/libp/libpwm/libpwm_1.0~rc2.orig.tar.xz"
  sha256: "22fd71162c89d671b16c59624bc4829fe20dc17cb782c4992e639facf1384827"
  tar_format: tar.xz

build:
  system: autotools
  build_command: "./configure --build=aarch64-unknown-linux-ohos --host=aarch64-unknown-linux-ohos && make -j1"
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies: []
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "none（上游只有 pwmround/pwmset/pwmtestperf 三个示例程序）"
  upstream_discovered: 3
  upstream_passed: 0
  upstream_failed: 0
  upstream_note: "沙箱无 PWM 芯片：三个程序均执行并报告找不到芯片（环境限制，如实申报）"
  test_package_passed: 4
  test_package_failed: 0
  test_package_assertions: 4
  execution: "conan create rc=0 + 上游示例程序执行留证 + 消费者 4 条断言"

test_passed: 4
test_failed: 0

patches_applied: []

knowledge_gained:
  - "与 libirman 同型：tarball 自带 configure(autoconf 2.72)/Makefile.in，直接 configure+make，避开 autoreconf 与 automake perl 依赖"
  - "E011：预生成 configure 同样含 umask 077 && mktemp -d，HMDFS 下 config.status 无法使用自建临时目录 → 就地放开为 022"
  - "E007：显式 --build/--host 避免 config.guess 在 HMDFS 上探测"
  - "libpwm 的公共 API 不做 NULL 检查（pwm_chip_close/num_pwms 直接解引用句柄）：消费者测试只能覆盖打开失败路径，硬件路径由上游示例程序执行留证"
