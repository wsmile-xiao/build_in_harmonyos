package: "libdsme/0.67.0"
homepage: "https://github.com/sailfishos/libdsme"

upstream_check_command: "make -j1 (builds tests/ut_libdsme; the hand-written Makefile has no check target)"
upstream_test_in_build: true
upstream_test_command: "TEMP=<build>/tmp ./tests/ut_libdsme -o <build>/ut_libdsme.xml"

upstream_tests:
  - file: tests/ut_libdsme.c
    source: libdsme-0.67.0/tests/
    description: >-
      Two Check cases: test_message (dsmemsg_new/dsmemsg_id/dsmemsg_size/
      dsmemsg_extra_size/dsmemsg_line_size contract) and test_send_receive
      (dsmesock_connect + dsmesock_broadcast + dsmesock_receive +
      dsmesock_send_with_extra round trip with a STATE_REQ_DENIED_IND reply
      carrying the extra "a-reason" payload, against a forked mock daemon).
    command: "TEMP=<build>/tmp ./tests/ut_libdsme -o <build>/ut_libdsme.xml"
    note: >-
      The hand-written Makefile builds tests/ut_libdsme as part of the
      default target but never executes it, so the recipe runs the built
      binary right after make. The mock daemon binds the abstract socket
      "@ut_libdsme" (OHOS denies file system unix sockets: HMDFS bind()
      returns EPERM and /tmp is read-only), and Check's temporary
      communication files are redirected via TEMP/TMP/TMPDIR (Check probes
      TEMP before P_tmpdir, which musl defines as /tmp). Test logic and
      assertions are unchanged from upstream.

test_package_tests:
  - id: "consumer-abstract-socket-round-trip"
    source: "test.c"
    command: "libdsme_consumer"
    description: >-
      Uses the installed public API only: the alarm-limit constant, message
      allocation and name lookups (known and unknown ids), a negative
      control (dsmesock_connect to a nonexistent abstract endpoint returns
      NULL), a two-way AF_UNIX abstract-socket round trip through
      dsmesock_connect + dsmesock_init + dsmesock_send_with_extra +
      dsmesock_receive with extra-payload and STATE_REQ_DENIED_IND state
      assertions, and dsmesock_getucred on the accepted connection.
  - id: "ohos-target-artifact-contract"
    source: "conanfile.py"
    command: "readelf -h/-d/--dyn-syms (recipe-side checks in test())"
    description: >-
      HarmonyOS-specific artifact checks on all three installed libraries:
      ELF64 AArch64 DYN, exact upstream SONAME, bare DT_NEEDED sonames
      including the musl libc, no DT_RPATH/DT_RUNPATH, GLib linked into
      libdsme.so.0, and the exported dsmesock/dsmemsg/dsme entry points.

test_counting:
  upstream_independent_total: 2
  integration_independent_total: 1
  harmonyos_specific_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 4
# 35 executable CHECK sites in test.c (the 36th textual match is the
# CHECK macro definition itself) + 9 artifact-contract _require call sites
# in test_package/conanfile.py; the recipe check sites are re-executed
# inside loops over the three libraries, their DT_NEEDED entries and the
# twelve exported symbols.
assertion_count: 44
