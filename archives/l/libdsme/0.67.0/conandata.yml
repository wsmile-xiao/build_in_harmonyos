# conandata.yml — libdsme 0.67.0
# Source of truth for the source tarball and the adaptation patches.

sources:
  url: "https://github.com/sailfishos/libdsme/archive/refs/tags/0.67.0.tar.gz"
  sha256: "58908591d652f6505cebeb126664950cf9337d70a963b2f03cd6e80e91578e46"

patches:
  - patch_file: "patches/0001-protocol.c.patch"
    patch_description: >-
      Accept abstract AF_UNIX socket names ('@' prefix) in dsmesock_connect();
      OHOS denies file system unix sockets (HMDFS bind() returns EPERM and
      /tmp is read-only), so abstract names are the only usable AF_UNIX
      transport in OHOS sandboxes. Regular path names keep the previous
      behavior.
    patch_type: "portability"
  - patch_file: "patches/0002-tests-ut_libdsme.c.patch"
    patch_description: >-
      Upstream test adaptation: the mock daemon binds the abstract socket
      "@ut_libdsme" instead of /tmp/ut_libdsme.sock, file operations are
      skipped for abstract names, and the default result XML path honors
      TMPDIR (musl /tmp is read-only). Test logic and assertions unchanged.
    patch_type: "portability"
