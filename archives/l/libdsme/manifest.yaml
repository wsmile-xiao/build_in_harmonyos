software: libdsme
display: "DSME socket IPC client library"
description: "DSME (Device State Management Entity) dsmesock client protocol, message helpers and D-Bus interface definition modules"
category: system
homepage: "https://github.com/sailfishos/libdsme"
license: LGPL-2.1-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "Abstract AF_UNIX socket names ('@' prefix) in dsmesock_connect(); HMDFS denies file system unix sockets and /tmp is read-only"
    - "Upstream Check suite executed by the recipe (the Makefile only builds it); temp files redirected via TEMP/TMP/TMPDIR"
    - "Relocatable pkg-config metadata and upstream SONAME layout preserved"
  common_dependencies:
    - glib

versions:
  "0.67.0":
    status: built
    build_date: "2026-09-21"
    conan_ref: "libdsme/0.67.0"
