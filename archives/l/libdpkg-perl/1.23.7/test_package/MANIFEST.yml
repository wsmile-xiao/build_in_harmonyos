# test_package/MANIFEST.yml — libdpkg-perl 1.23.7
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: libdpkg-perl/1.23.7
homepage: "https://manpages.debian.org/libdpkg-perl"

# 上游测试套件：dpkg 源码树 scripts/t/（libdpkg-perl 的 Perl 单元测试，prove 运行）
upstream_check_command: "prove -l scripts/t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: scripts/t/
    source: dpkg-1.23.7/scripts/t/*.t
    description: "50 文件 / 12353 测试：本地实测 12341/12353（99.9%），12 失败为环境阻塞（rule 5.2 如实记录）"
    command: "prove -l scripts/t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Dpkg::Version + version_compare）
test_package_tests:
  - file: test_libdpkg_perl.py
    description: "Loads packaged Dpkg::Version via perl -I<lib> and calls version_compare('1.2.3','1.2.3') (real API)"
    command: "python3 test_libdpkg_perl.py"

# 断言总数：1（版本比较校验）
assertion_count: 1
