# 版本级 manifest — libdpkg-perl 1.23.7
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.23.7"

# 软件名
software: libdpkg-perl

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-31"
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian snapshot 镜像，dpkg 源码树含 scripts/ = libdpkg-perl）
  url: "https://snapshot.debian.org/archive/debian/20260831T000000Z/pool/main/d/dpkg/dpkg_1.23.7.tar.xz"

  # 源码校验和（sha256，实测）
  sha256: "60fe2be72e5f0a4bb0ac7baff3b1697ebc5cfaac1885f66649521571a97440ad"

  # 压缩格式
  compression: tar.xz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "dpkg-1.23.7"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  notes: "仅 dpkg + Perl 核心（libfile-fcntllock-perl 为 Recommends 非必需，不在 Depends）"

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "package_type=application（python-require 型 conan create 静默跳过构建——dataproperty/pytablewriter 先例）；纯 Perl，package() 拷 scripts/Dpkg.pm + Dpkg/（92 个 .pm）到 perl site-lib"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "纯 Perl 模块集（Dpkg::* 92 个 .pm），无编译、仅 Perl 核心依赖"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 12341
  failed: 12
  note: |
    上游测试：dpkg 源码树 scripts/t/（libdpkg-perl 的 Perl 单元测试），
    本地实测 **50 文件 / 12353 测试：12341 通过 / 12 失败（99.9%）**。
    需设 DPKG_DATADIR=data + DPKG_ORIGINS_DIR=scripts/t/origins 才能
    加载数据表。12 个显式失败多为环境阻塞（缺 dpkg C 二进制 / Ubuntu
    vendor 数据 / patch -t 行为等，rule 5.2 如实记录），非库缺陷。
    适配后：test_package R34 真实 perl 加载 Dpkg::Version 并 version_compare
    校验（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libdpkg-perl 是 dpkg 源码树 scripts/ 的 Perl 模块集（Dpkg::* 92 个 .pm），Debian 独立打包（Architecture: all）——源码取自 dpkg 源码包（snapshot.debian.org 下载）"

references:
  - https://manpages.debian.org/libdpkg-perl
  - https://sources.debian.org/src/dpkg/
