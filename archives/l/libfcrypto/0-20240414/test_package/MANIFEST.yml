# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
# 上游测试入口来自 release archive 的 tests/Makefile.am：
# check_PROGRAMS 注册 6 个 C 测试程序；TESTS 注册 test_library.sh
# （test_python_module.sh 仅在 HAVE_PYTHON_TESTS 时加入，本配方
# --disable-python，故不在分母；test_manpage.sh 只在 check_SCRIPTS，
# 不被 make check 执行）。

package: libfcrypto/0-20240414
homepage: https://github.com/libyal/libfcrypto

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check LOG_COMPILER=\"$CONFIG_SHELL\""

upstream_tests:
  - name: "blowfish context tests"
    file: fcrypto_test_blowfish_context.c
    source: tests/fcrypto_test_blowfish_context.c
    description: "Blowfish context 生命周期/密钥/CBC 加解密单元测试"
    command: "./tests/test_runner.sh fcrypto_test_blowfish_context"
  - name: "des3 context tests"
    file: fcrypto_test_des3_context.c
    source: tests/fcrypto_test_des3_context.c
    description: "3DES 上下文生命周期/密钥/CBC·ECB 加解密单元测试"
    command: "./tests/test_runner.sh fcrypto_test_des3_context"
  - name: "rc4 context tests"
    file: fcrypto_test_rc4_context.c
    source: tests/fcrypto_test_rc4_context.c
    description: "RC4 上下文生命周期/密钥/流加解密单元测试"
    command: "./tests/test_runner.sh fcrypto_test_rc4_context"
  - name: "serpent context tests"
    file: fcrypto_test_serpent_context.c
    source: tests/fcrypto_test_serpent_context.c
    description: "Serpent 上下文生命周期/密钥/CBC·ECB 加解密单元测试"
    command: "./tests/test_runner.sh fcrypto_test_serpent_context"
  - name: "error tests"
    file: fcrypto_test_error.c
    source: tests/fcrypto_test_error.c
    description: "libcerror 错误对象创建/复制/打印/释放单元测试"
    command: "./tests/test_runner.sh fcrypto_test_error"
  - name: "support tests"
    file: fcrypto_test_support.c
    source: tests/fcrypto_test_support.c
    description: "库支持函数（get_version 等）单元测试"
    command: "./tests/test_runner.sh fcrypto_test_support"

test_package_tests:
  - file: test_libfcrypto.c
    description: "通用消费者断言：版本查询、RC4 上下文生命周期、48 位密钥公开测试向量（Secret/Attack at dawn）、第二上下文加解密回环、NULL 上下文错误路径与 error 释放"
    command: "./test_libfcrypto"
  - file: test_ohos.c
    description: "鸿蒙特有消费者测试：__OHOS__ 编译目标、打包共享库在 OHOS 上的真实计算（RC4 向量）、可写 TMPDIR（宿主 /tmp 可写时才用 /tmp，无可用目录时按 SKIP 记录不计通过）、临时文件建写读删生命周期（RC4 向量同 48 位密钥）"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "ohos-target-rc4-and-tmp-file-lifecycle"
    description: "在 OHOS 上确认 __OHOS__ 编译目标、打包共享库加载并正确计算 RC4 测试向量、临时目录可用性与临时文件建/写/读/删生命周期"
    command: "./test_ohos"
    assertions: 7
    platform: OHOS

assertion_count: 22
