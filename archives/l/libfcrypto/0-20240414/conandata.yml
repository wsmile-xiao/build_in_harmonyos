# conandata.yml for libfcrypto 0-20240414
# Single source of truth for source URL + SHA256 + patches.
# Upstream tag 20240414 (release asset libfcrypto-alpha-20240414.tar.gz);
# the platform task version "0-20240414" follows the libyal soname-0
# date-version convention (Debian carries the same release as
# libfcrypto_0~20240414).
# Pinned source: the Debian orig tarball, which is byte-identical to the
# official GitHub release asset (same 629026-byte archive, same SHA-256,
# same libfcrypto-20240414 root directory; verified on 2026-09-18). The
# GitHub release asset URL is recorded as upstream_release_url in
# manifest.yaml; the direct github.com download timed out intermittently
# on the build host, so the byte-identical Debian mirror is pinned here.

sources:
  url: "https://deb.debian.org/debian/pool/main/libf/libfcrypto/libfcrypto_0~20240414.orig.tar.gz"
  sha256: "43ea521ca1fd0dab11d23731f070fa5b2856b38f896550fd592ae341c6831f0d"

patches:
  - patch_file: "patches/0001-config-config.guess.patch"
    patch_description: "Recognize the HarmonyOS host in config.guess so a bare ./configure can determine the build type"
    patch_type: "portability"
