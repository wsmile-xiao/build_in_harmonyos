software: libfcrypto
display: "libfcrypto"
description: "Library for cryptographic primitives (Blowfish, DES3, RC4, Serpent) from the libyal project"
category: crypto
homepage: "https://github.com/libyal/libfcrypto"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "发布包自包含：本地 libcerror 组件与生成好的 configure/aclocal.m4/config.guess/config.sub/Makefile.in 都在 tarball 内，配方拒绝执行 synclibs.sh。"
    - "自带 config.guess/config.sub (2023-06-23) 既不识别 HarmonyOS 主机也不认识 ohos 三元组：构建期显式传 --build/--host=aarch64-unknown-linux-gnu，并以 patches/ 补丁让 config.guess 识别 HarmonyOS，使干净构建门禁的裸 ./configure 也能通过。"
    - "HMDFS 下 Autoconf 的 umask 077 临时目录不可用：构建期把 configure 里的 umask 077 改成 022，并以 CONFIG_SHELL 显式解释 configure 与 make check 的 runner 脚本。"
    - "libtool 测试目标是包装脚本，真实 ELF 在 .libs/：OHOS 构建期给 test_runner.sh 打运行期适配（不改上游测试用例语义）并注入 libfcrypto/.libs 的 LD_LIBRARY_PATH。"
    - "纯库包（无命令行工具），不需要 commands.json；Python 绑定显式关闭（--disable-python）。"
  common_dependencies: []

versions:
  "0-20240414":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libfcrypto/0-20240414"
