# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libpcrecpp/8.45
homepage: "https://www.pcre.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（pcre-8.45 源码树自带的 pcrecpp 测试）
upstream_tests:
  - file: pcrecpp_unittest.cc
    source: pcre-8.45/pcrecpp_unittest.cc
    description: "libpcrecpp C++ wrapper unit tests (compile/match/capture/options)"
    command: "./pcrecpp_unittest"
  - file: pcre_scanner_unittest.cc
    source: pcre-8.45/pcre_scanner_unittest.cc
    description: "pcrecpp Scanner unit tests"
    command: "./pcre_scanner_unittest"
  - file: pcre_stringpiece_unittest.cc
    source: pcre-8.45/pcre_stringpiece_unittest.cc
    description: "libpcrecpp StringPiece unit tests"
    command: "./pcre_stringpiece_unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 pcrecpp::RE FullMatch/PartialMatch/FindAndConsume/error/options API"
    command: "./test_pcrecpp"
  - file: test_ohos.cpp
    description: "鸿蒙特有测试：验证 __OHOS__ 宏 + pcrecpp::RE 完整工作 + StringPiece + RE_Options（rule12）"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11