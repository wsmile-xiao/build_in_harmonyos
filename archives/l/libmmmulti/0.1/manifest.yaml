version: "0.1"
status: published
build_date: "2026-09-15"

source:
  git_url: "https://salsa.debian.org/med-team/libmmmulti.git"
  git_commit: "275b129e829e297c5e635144c7f30ae5d6b9d879"

build:
  system: header-only
  configure_options: []
  dependencies:
    - atomic_queue/1.9.2
  cc: clang
  cxx: clang++

patches_applied:
  - description: "Fix madvise pointer: buffer → buffer->data (upstream bug, segfault on OHOS)"
    files:
      - src/mmmultimap.hpp
      - src/mmmultiset.hpp
      - src/mmiitree.hpp
  - description: "Fix mmap failure detection: !ptr → ptr == MAP_FAILED"
    files:
      - src/mmmultimap.hpp
      - src/mmmultiset.hpp
      - src/mmiitree.hpp
  - description: "Fix atomic_queue include path: atomic_queue.h → atomic_queue/atomic_queue.h"
    files:
      - src/mmmultimap.hpp
      - src/mmmultiset.hpp
      - src/mmiitree.hpp
  - description: "Replace ips4o::parallel::sort with std::sort (ips4o not available)"
    files:
      - src/mmmultimap.hpp
      - src/mmmultiset.hpp
      - src/mmiitree.hpp
  - description: "Remove unused sdsl include from mmmultiset.hpp"
    files:
      - src/mmmultiset.hpp
  - description: "Add missing <fstream> include (OHOS libc++ doesn't transitively include it)"
    files:
      - src/mmmultimap.hpp
      - src/mmmultiset.hpp
      - src/mmiitree.hpp
  - description: "Fix sort() missing open_mmap_buffer return value check"
    files:
      - src/mmmultiset.hpp
      - src/mmiitree.hpp
  - description: "Fix close_reader() munmap length: count → count * sizeof(Type)"
    files:
      - src/mmiitree.hpp
  - description: "Fix iterator/const_iterator operator= missing return *this"
    files:
      - src/mmiitree.hpp
  - description: "Fix for_each_entry_count calling nonexistent for_each_value → for_each_entry"
    files:
      - src/mmiitree.hpp
  - description: "Add Interval::operator== for for_each_entry_count"
    files:
      - src/mmiitree.hpp
  - description: "Fix record_count() fd leak: close fd on all paths"
    files:
      - src/mmiitree.hpp
  - description: "Fix index_core() returning -1 (uint64_t) for empty array → return 0"
    files:
      - src/mmiitree.hpp
  - description: "Fix load() magic string read: std::string → char[11], 9 → 10 bytes"
    files:
      - src/mmmultimap.hpp
  - description: "Fix save() magic string length: written += 9 → written += 10"
    files:
      - src/mmmultimap.hpp

knowledge_gained:
  - "header-only 库 (3 个 .hpp 文件), 无需编译产物"
  - "mmmultimap.hpp 依赖 sdsl-lite (静态库), 本配方不包含, 测试仅覆盖 mmmultiset + mmiitree"
  - "mmmultiset.hpp 和 mmiitree.hpp 不依赖 sdsl, 仅需 ips4o + atomic_queue"
  - "atomic_queue 1.9.2 已有 conan 包, 通过 requires 引入"
  - "上游使用 C++14 标准, 需要 pthread"
  - "namespace 为 mmmulti, 主要类: mmmulti::map, mmmulti::set, mmmulti::iitree"
  - "上游无测试, test_package 自写消费者测试覆盖 set + iitree API"
  - "上游 madvise(buffer,...) 传错指针, OHOS 上 segfault"
  - "上游 mmap 失败检测用 !ptr 而非 MAP_FAILED, 未定义行为"
  - "上游 close_reader() munmap 长度用记录数而非字节数"
  - "上游 iterator operator= 缺少 return *this (UB)"
  - "上游 record_count() 打开 fd 后未关闭 (泄漏)"
  - "上游 load() 用 std::string 读魔数 (UB), 改为 char 数组"
