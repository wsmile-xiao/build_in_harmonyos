knowledge_gained:
  - "官方 1.0.10 发布包没有生成 configure，Conan build 阶段需使用宿主 autoreconf 生成后再由 OHOS profile 交叉编译"
  - "automake/1.18 的 config.guess 不识别 HarmonyOS uname；autoreconf 后补入 aarch64-unknown-linux-ohos 原生识别，禁止以 --build/--host 绕过"
  - "libkylin-chkname 依赖 libintl，gettext/0.22.5.1 作为目标运行时依赖；msgfmt/autopoint 使用构建机已有工具"
  - "libintl 仅通过目标级 -lintl 与 Libtool -no-undefined 链接，确保生成 DT_NEEDED，同时避免全局 LIBS 污染 AC_PROG_CC 的原生运行探针"
  - "E011：HarmonyOS HMDFS 的 UID 映射会使 Autoconf 以 umask 077 创建的 config.status 临时目录不可写；autoreconf 后仅对 OHOS 构建改为 umask 022"
  - "Worker 默认 PATH 不含 gettext.org 工具目录；显式使用与 autopoint 同源的宿主 msgmerge 生成翻译目录的中间 PO 文件"
  - "Worker 共享前缀可能提供 GLib proxy libintl.h；Conan gettext 的 include/lib 必须同时前置，避免 g_libintl_* 头库 ABI 错配"
  - "gettext 以 application 类型发布而不传播库名；本包消费者元数据仅补充直接 ABI 依赖 intl，兼容共享与静态链接"
  - "上游没有测试入口，消费者测试补全公开 API、全部错误码分支、安装后数据访问与 HarmonyOS AArch64 目标验证"
