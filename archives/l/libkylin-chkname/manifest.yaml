software: libkylin-chkname
display: "libkylin-chkname"
description: "openKylin 用户名与用户组名合法性检查库"
category: system
homepage: "https://gitee.com/openkylin/libkylin-chkname"
license: MulanPSL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "为上游 Autotools 工程固定 build-aux 与 m4 目录，避免辅助文件落入源码树外"
    - "保留名表与本地化目录支持运行环境覆盖，使 Conan 安装前缀内的资源可被加载"
    - "上游无测试套件；test_package 补全 20 个 C++ 消费者测试，其中 1 个为 HarmonyOS AArch64 专项测试"
  common_dependencies:
    - gettext/0.22.5.1

versions:
  "1.0.10":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libkylin-chkname/1.0.10"
    source_url: "https://gitee.com/openkylin/libkylin-chkname/releases/download/debian/1.0.10-1/libkylin-chkname_1.0.10.orig.tar.gz"
