software: libfolia
display: "libfolia"
description: "FoLiA (Format for Linguistic Annotation) - 语言学标注格式 XML 处理库"
category: doc
homepage: "https://proycon.github.io/folia/"
license: GPL-3.0
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "需要 autoreconf -fi 生成 configure 脚本"
    - "E011 HMDFS umask 077 权限问题：需 sed -i 's/umask 077/umask 022/g' configure"
  common_dependencies:
    - ticcutils
    - libxml2
    - icu
  runtime_dependencies:
    - libomp

# 版本索引（所有已归档版本，含状态）
versions:
  "2.21":
    status: published
    build_date: "2026-06-05"
    published_as: libfolia