software: libfolia
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.21/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.21"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/libfolia/libfolia-2.21.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型（顶层字段）
# cmake | autotools | makefile | meson | custom
build_system: autotools

build:
  # 构建系统类型（保留兼容性）
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 是否需要 autoreconf
  need_autoreconf: true

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ticcutils/0.34
    - libxml2/2.9.4
    - icu/77

  # 运行时依赖列表（需用户安装）
  runtime_dependencies:
    - libomp/15.0.4

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无源码补丁：所有修改为运行时操作（autoreconf + sed umask）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011 HMDFS umask 077 权限问题：所有 autotools 项目在 HMDFS 上需修改 configure 中 umask"
  - "需要 autoreconf 的项目：原始 tarball 无 configure，需 autoreconf -fi 生成"
  - "运行时依赖：folialint 使用 OpenMP，需安装 libomp 预编译包"

# ============================================================
# 构建流程说明
# ============================================================

# 本项目需要 autoreconf，无源码补丁
build_process:
  # 是否需要 autoreconf
  need_autoreconf: true
  # 运行时修改（不固化为补丁）
  runtime_modifications:
    - "autoreconf -fi（生成 configure、config.guess、config.sub）"
    - "sed -i 's/umask 077/umask 022/g' configure（E011 解决方案）"