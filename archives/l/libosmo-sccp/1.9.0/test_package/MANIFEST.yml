# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libosmo-sccp/1.9.0
homepage: "https://osmocom.org/projects/libosmo-sccp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序（tests/testsuite.at 注册的 5 组，全通过）
upstream_tests:
  - file: tests/m2ua/m2ua_test.c
    source: libosmo-sccp-1.9.0/tests/m2ua/m2ua_test.c
    description: "M2UA 协议编解码回归测试"
    command: "./tests/m2ua/m2ua_test"
  - file: tests/mtp/mtp_parse_test.c
    source: libosmo-sccp-1.9.0/tests/mtp/mtp_parse_test.c
    description: "MTP3 消息解析测试"
    command: "./tests/mtp/mtp_parse_test"
  - file: tests/sccp/sccp_test.c
    source: libosmo-sccp-1.9.0/tests/sccp/sccp_test.c
    description: "SCCP 协议栈单元测试"
    command: "./tests/sccp/sccp_test"
  - file: tests/xua/xua_test.c
    source: libosmo-sccp-1.9.0/tests/xua/xua_test.c
    description: "xUA 消息编解码测试（M3UA/SUA 消息）"
    command: "./tests/xua/xua_test"
  - file: tests/ss7/ss7_test.c
    source: libosmo-sccp-1.9.0/tests/ss7/ss7_test.c
    description: "SS7 实例/AS/ASP FSM 回归测试"
    command: "./tests/ss7/ss7_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sccp.c
    description: "消费者测试：SS7 实例/ASP/AS 对象创建、配置、销毁全链"
    command: "./test_sccp_probe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 60
