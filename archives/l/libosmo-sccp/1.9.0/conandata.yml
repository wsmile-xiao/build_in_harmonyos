# conandata.yml — libosmo-sccp 1.9.0
# 上游官方发布包（osmocom 官方发布站点）

sources:
  url: "https://downloads.osmocom.org/releases/libosmo-sccp/libosmo-sccp-1.9.0.tar.bz2"
  sha256: "b6c219e57c79bda9eb0edb7eae64ba01b952126ecb48b6a6667e4fce21f977a9"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS host triplet; drop umask 077 for the temporary directory (HMDFS does not support it)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept the linux-ohos kernel/OS pair so configure can canonicalize the target triple"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: drop umask 077 around the config.status temporary directory (HMDFS limitation)"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.ac.patch"
    patch_description: "configure.ac: add --disable-libsctp option; demote the hard sctp_recvmsg failure to a warning so the build proceeds without SCTP support (platform has no libsctp / kernel SCTP)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-osmo_ss7.c.patch"
    patch_description: "osmo_ss7.c: guard SCTP header includes with HAVE_LIBSCTP; provide single-address fallbacks for the osmo_sock_multiaddr_* helpers that libosmocore(--disable-libsctp) does not export"
    patch_type: "portability"
  - patch_file: "patches/0006-src-osmo_ss7_asp.c.patch"
    patch_description: "osmo_ss7_asp.c: guard SCTP-only code paths (netinet/netif sctp includes, peer/primary address setsockopt helpers, SCTP notification logging, notification dispatch and apply-primary call sites) with HAVE_LIBSCTP"
    patch_type: "portability"
  - patch_file: "patches/0007-src-osmo_ss7_asp_peer.c.patch"
    patch_description: "osmo_ss7_asp_peer.c: guard the netinet/sctp.h include with HAVE_LIBSCTP"
    patch_type: "portability"
  - patch_file: "patches/0008-src-osmo_ss7_vty.c.patch"
    patch_description: "osmo_ss7_vty.c: define _GNU_SOURCE (netinet/tcp.h only exposes struct tcp_info under _GNU_SOURCE on this libc); guard the SCTP primary-address apply call sites and their local variables with HAVE_LIBSCTP"
    patch_type: "portability"
  - patch_file: "patches/0009-src-osmo_ss7_xua_srv.c.patch"
    patch_description: "osmo_ss7_xua_srv.c: guard SCTP header includes and the ss7_asp_apply_*_primary_address call site with HAVE_LIBSCTP"
    patch_type: "portability"
