knowledge_gained:
  - "libosmo-sccp 上游 configure.ac 无 --disable-libsctp 开关（与 netif 不同），需补丁新增并把 AC_SEARCH_LIBS 硬失败降级为警告"
  - "libosmocore(--disable-libsctp) 不导出 osmo_sock_multiaddr_* 系列；下游需按 !HAVE_LIBSCTP 提供单地址回退（osmo_sock_get_ip_and_port）"
  - "OHOS netinet/tcp.h 的 struct tcp_info 在 _GNU_SOURCE 下才定义，依赖它的源文件需先 define _GNU_SOURCE"
  - "libosmo-sccp 的 SCTP 耦合比 netif 深：netinet/sctp.h include、SCTP 通知/主地址簇函数需按 HAVE_LIBSCTP 逐处守卫"

