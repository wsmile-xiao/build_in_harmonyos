package: "libsz/1.1.6"
homepage: "https://github.com/Deutsches-Klimarechenzentrum/libaec"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_tests:
  - "check_code_options"
  - "check_buffer_sizes"
  - "check_seeking"
  - "check_long_fs"
  - "check_szcomp"
  - "check_rsi_block_access"
  - "sampledata.sh"
upstream_zero_evidence: ""

test_package_tests:
  - id: "sz-roundtrip"
    source: "test_sz_roundtrip.c"
    command: "test_sz_roundtrip"
    description: >-
      使用 SZ_BufftoBuffCompress/SZ_BufftoBuffDecompress 对合成低熵 8 位样本做压缩回环，
      断言压缩成功、输出更小、解压成功、长度一致、字节一致。
  - id: "aec-roundtrip"
    source: "test_aec_roundtrip.c"
    command: "test_aec_roundtrip"
    description: >-
      使用 aec_encode/aec_decode 对合成相关 8 位有符号样本做编解码回环，
      断言初始化与编解码成功、有输出、回环前缀与输入一致。

test_counting:
  upstream_independent_total: 7
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 10
