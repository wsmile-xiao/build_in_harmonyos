  cc: clang
  cxx: clang++

# 测试结果（上游 94 项注册：91 项执行全过、3 项上游 ENABLE_IF 条件跳过）
test_results:
  type: official
  total: 94
  passed: 91
  failed: 0
  skipped: 3

# 补丁信息
patches_applied:
  - "0001-use-mkstemp-in-tmpfile.patch"

# 知识沉淀
knowledge_gained:
  - "libosmium 功能头文件无条件 include 外部头（zlib/bzlib/lz4/expat/protozero）：header-only 包也必须以 requires 传播五个依赖"
