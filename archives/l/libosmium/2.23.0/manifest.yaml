# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: "cmake"

# 源码信息
source:
  url: "https://github.com/osmcode/libosmium/archive/refs/tags/v2.23.0.tar.gz"
  sha256: "2e7a4ab34a80843490a1d673811d600e5445e6d39a0cfc42609d0861eba24669"
  tar_format: tar.gz

# 构建配置
build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON（经配方内驱动逐 TU 编译运行）"
    - "-DBUILD_DATA_TESTS=OFF（上游 tarball 默认）"
    - "-DBUILD_EXAMPLES=OFF（非测试目标）"
  dependencies:
    - protozero/1.8.2
    - zlib/1.3.1
    - bzip2/1.0.8
    - lz4/1.10.0
