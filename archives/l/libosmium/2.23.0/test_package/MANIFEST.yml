# test_package/MANIFEST.yml - libosmium 2.23.0
# 上游官方测试声明 + 消费者测试账本

package: libosmium/2.23.0
homepage: "https://osmcode.org/libosmium/"

# 上游测试命令（BUILD_TESTING=ON 时由 test/CMakeLists.txt 注册 94 个测试）
upstream_check_command: "ctest (BUILD_TESTING)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "run_upstream_tests.sh（逐 TU 编译 91 个测试可执行文件并逐个运行，逐用例退出码 0（Catch fail-only 语义））"

# 上游实际运行的测试程序（按组分列；完整 94 项清单见 conanfile.py UPSTREAM_TESTS）
upstream_tests:
  - file: test/t/area
    source: libosmium-2.23.0/test/t/area
    description: "area 组 3 项：test_area_id test_assembler test_node_ref_segment"
    command: "./area_test_*"
  - file: test/t/osm
    source: libosmium-2.23.0/test/t/osm
    description: "osm 组 15 项全部执行：test_area test_box test_changeset test_crc test_entity_bits test_location test_location_extra test_metadata test_node test_node_ref test_object_comparisons test_relation test_timestamp test_types_from_string test_way"
    command: "./osm_test_*"
  - file: test/t/memory
    source: libosmium-2.23.0/test/t/memory
    description: "memory 组 6 项"
    command: "./memory_test_*"
  - file: test/t/builder
    source: libosmium-2.23.0/test/t/builder
    description: "builder 组 2 项"
    command: "./builder_test_*"
  - file: test/t/geom
    source: libosmium-2.23.0/test/t/geom
    description: "geom 组 12 项中执行 9 项；test_geos test_ogr test_ogr_wkb 因上游 ENABLE_IF 依赖 GEOS/GDAL（制品仓无）跳过"
    command: "./geom_test_*"
  - file: test/t/handler
    source: libosmium-2.23.0/test/t/handler
    description: "handler 组 3 项"
    command: "./handler_test_*"
  - file: test/t/index
    source: libosmium-2.23.0/test/t/index
    description: "index 组 8 项"
    command: "./index_test_*"
  - file: test/t/io
    source: libosmium-2.23.0/test/t/io
    description: "io 组 19 项全部执行（含 zlib/bzip2/expat/protozero 路径）"
    command: "./io_test_*"
  - file: test/t/relations
    source: libosmium-2.23.0/test/t/relations
    description: "relations 组 4 项全部执行"
    command: "./relations_test_*"
  - file: test/t/storage
    source: libosmium-2.23.0/test/t/storage
    description: "storage 组 1 项"
    command: "./storage_test_*"
  - file: test/t/tags
    source: libosmium-2.23.0/test/t/tags
    description: "tags 组 5 项"
    command: "./tags_test_*"
  - file: test/t/thread
    source: libosmium-2.23.0/test/t/thread
    description: "thread 组 3 项"
    command: "./thread_test_*"
  - file: test/t/util
    source: libosmium-2.23.0/test/t/util
    description: "util 组 13 项"
    command: "./util_test_*"
  - file: test/catch/catch.hpp
    source: libosmium-2.23.0/test/catch/catch.hpp
    description: "测试框架为上游内置 Catch v2.13.10（test_main.cpp 定义 CATCH_CONFIG_MAIN），无需外部测试依赖"
    command: "（内置）"
  - file: test/data-tests
    source: libosmium-2.23.0/test/data-tests
    description: "数据测试组：上游 BUILD_DATA_TESTS 在 tarball 默认 OFF（dev_build 探测关闭），按上游默认配置不构建不执行"
    command: "skipped: upstream default OFF"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：osmium::Node（NodeBuilder 构建）id/version/timestamp/location/user 真实 API 断言 + LIBOSMIUM_VERSION_STRING 版本契约，共 8 处 CHECK"
    command: "./test_libosmium"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 8

# 机器可读消费者账本
consumer_tests: 1
consumer_passed: 1
consumer_assertions: 8

# 上游测试账本（静态注册口 vs 实际执行）
upstream_static_total: 94
upstream_executed: 91
upstream_passed: 91
upstream_failed: 0
upstream_skipped: 3
