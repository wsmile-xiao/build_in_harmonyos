knowledge_gained:
  - "OHOS clang cfg 注入 -Wl,--code-sign 会使 Meson -Werror 编译探针失败，需在配方 OHOS 分支加 -Qunused-arguments 对冲（仅限无法控制的工具链注入场景）"
  - "上游发布包 untracked/ 已含生成头文件，maintainer-mode 必须关闭以免 m4/mm-common 依赖"
  - "命名映射：Conan 包 libsigc-2 ↔ 上游 libsigc++ 2.0（pkg-config 名 sigc++-2.0、库文件 libsigc-2.0.so）"
  - "libtool_soversion=[0,0,0] → 产物 libsigc-2.0.so.0.0.0，SONAME libsigc-2.0.so.0，导出 96 个 Itanium ABI 符号"

