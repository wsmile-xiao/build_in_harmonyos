# test_ohos/MANIFEST.yml — HarmonyOS PC 专项验证
package: libsigc-2/2.12.2
homepage: https://github.com/libsigcplusplus/libsigcplusplus

# OpenHarmony PC 平台专项测试（独立于 test_package 的库 API 验证）
# 运行: conan test archives/l/libsigc-2/2.12.2/test_ohos libsigc-2/2.12.2 \
#       -pr:h ci/conan/profiles/ohos-aarch64 -pr:b ci/conan/profiles/ohos-aarch64
test_ohos_tests:
  - file: test_ohos.sh
    description: |
      鸿蒙交付验证 (bash + set -euo pipefail, 独立临时目录经
      trap EXIT/INT/TERM 清理, 失败/超时/中断均不残留、不写包目录):
      H1 ELF64 Little-Endian AArch64 (库与消费者两个产物逐个
      readelf 验证, readelf 失败时该检查 fail closed);
      H2 动态段 SONAME libsigc-2.0.so.0、SONAME/linker 别名已物化、
      无宿主 RPATH/RUNPATH; H3 NEEDED 闭包 (消费者→SONAME, 库无
      绝对路径依赖、无 vendored libc++); H4 消费者 ELF 请求
      musl-aarch64 动态加载器; H5 .codesign 段 (库与消费者);
      H6 二进制无宿主路径 (strings 扫描); H7 真实 signal/slot 运行
      (test_ohos.cpp 对最终包链接, 20 条断言, 退出码 0 判定)
    command: "conan test archives/l/libsigc-2/2.12.2/test_ohos libsigc-2/2.12.2 -pr:h ci/conan/profiles/ohos-aarch64 -pr:b ci/conan/profiles/ohos-aarch64"
    count: 14

assertion_count: 14
