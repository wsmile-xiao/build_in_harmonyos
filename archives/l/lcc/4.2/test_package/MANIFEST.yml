# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lcc/4.2
homepage: "https://github.com/drh/lcc"

# 上游测试命令（lcc 4.2 自带 makefile 的 test 目标，无 ctest/pytest）
upstream_check_command: "make BUILDDIR=<bld> TARGET=x86/linux test"

# conanfile.py build() 中未集成上游测试（lcc 测试需驱动目录 gcc/cpp 包装，已在 notes.md 记录手工执行）
upstream_test_in_build: false
upstream_test_command: "make BUILDDIR=$BUILDDIR TARGET=x86/linux test"

# 上游实际运行的测试（18 用例，15 项与上游 x86/linux .sbk 逐字节一致；
# limits 为 OHOS aarch64 char 默认 unsigned 的平台语义差异，paranoia/yacc 因 include <stdio.h>
# 落入 OHOS sysroot 头超出 2002 解析器能力——均非本库编译缺陷）
upstream_tests:
  - file: tst/8q.c
    source: lcc-4_2/tst/8q.c
    description: "N-queens 后端代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/array.c
    source: lcc-4_2/tst/array.c
    description: "数组初始化代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/cf.c
    source: lcc-4_2/tst/cf.c
    description: "控制流代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/cq.c
    source: lcc-4_2/tst/cq.c
    description: "C 品质测试（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/cvt.c
    source: lcc-4_2/tst/cvt.c
    description: "类型转换代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/fields.c
    source: lcc-4_2/tst/fields.c
    description: "位域代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/front.c
    source: lcc-4_2/tst/front.c
    description: "前端代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/incr.c
    source: lcc-4_2/tst/incr.c
    description: "自增自减代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/init.c
    source: lcc-4_2/tst/init.c
    description: "初始化表达式代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/sort.c
    source: lcc-4_2/tst/sort.c
    description: "排序程序代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/spill.c
    source: lcc-4_2/tst/spill.c
    description: "寄存器溢出代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/stdarg.c
    source: lcc-4_2/tst/stdarg.c
    description: "可变参数代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/struct.c
    source: lcc-4_2/tst/struct.c
    description: "结构体代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/switch.c
    source: lcc-4_2/tst/switch.c
    description: "switch 代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/wf1.c
    source: lcc-4_2/tst/wf1.c
    description: "代码生成回归（.s 与上游 .sbk 一致）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/limits.c
    source: lcc-4_2/tst/limits.c
    description: "limits 常量代码生成（CHAR_MAX 平台语义差异：OHOS aarch64 char 默认 unsigned 255/0 vs 上游 i386 127/-128，非缺陷）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/paranoia.c
    source: lcc-4_2/tst/paranoia.c
    description: "浮点 paranoia 测试（include <stdio.h> 落入 OHOS sysroot 头，2002 解析器不识别 restrict/va_list，环境相关）"
    command: "make BUILDDIR=… TARGET=x86/linux test"
  - file: tst/yacc.c
    source: lcc-4_2/tst/yacc.c
    description: "yacc 生成器代码（include <stdio.h> 落入 OHOS sysroot 头，环境相关，同 paranoia）"
    command: "make BUILDDIR=… TARGET=x86/linux test"

# test_package 中自带的测试（消费者视角验证：lcc -S 实际生成汇编）
test_package_tests:
  - file: test.c
    description: "消费者测试：lcc -S 编译最小 C 源，验证生成非空 x86 汇编（R34 实质依赖被测包）"
    command: "lcc -Wo-lccdir=<pkg>/lib/lcc -S -o test.s test.c && grep -q 'main' test.s"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
