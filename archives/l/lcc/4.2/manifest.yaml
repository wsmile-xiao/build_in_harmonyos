# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.2"

# 软件名
software: "lcc"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/drh/lcc/archive/refs/tags/v4_2.tar.gz"

  # 源码校验和
  sha256: "3941d7abbf767881c80efa34ce4b676066468f5f9bbb8d7fcae290a875b7160a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lcc 4.2 自定义 makefile 构建（无 configure）：make BUILDDIR=… CC=clang HOSTFILE=etc/linux.c all"
  - "驱动 etc/linux.c 硬编码 $BUILDDIR/gcc/cpp 预处理器，OHOS 无 gcc，用 clang-cpp 包装替代并翻译 cpp [opts] <src> [<out.i>] 调用形式"
  - "make test 需 TARGET=x86/linux（run.sh 从目标路径倒数第 3/2 段解析 target/os）"
  - "limits 测试差异为 OHOS aarch64 char 默认 unsigned 的平台语义（E419 等价命中）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
