# test_package/MANIFEST.yml
package: libzzip/0.13.80

# test_package 的本质
nature: real-world-usage
# 说明: 调用最终安装包的公开 API (zzip_dir_open / zzip_dir_read / zzip_file_open /
# zzip_read / zzip_dir_find / zzip_*_close), 真实读取 ZIP 数据并逐字节精确比较。

# 使用的入口点
entrypoints:
  - zzip_dir_open
  - zzip_dir_read
  - zzip_dir_stat
  - zzip_file_open
  - zzip_file_close
  - zzip_read
  - zzip_dir_close
  - ZZIP_DIR / ZZIP_FILE / ZZIP_DIRENT / ZZIP_STAT 类型

# fixture 说明
fixtures:
  - name: test.zip
    origin: generated
    description: >
      测试程序内程序化构造的最小合法 ZIP (store 无压缩): 3 个 entry
      (hello.txt / data/second.bin 含 NUL 字节的二进制名 / third.md),
      local file header + 中央目录 + EOCD 全手工拼装, 每个字节可审计。
      CRC32 由测试内自带表驱动实现计算 (与 zlib/zip 兼容)。
  - name: ref.zip
    origin: generated
    description: >
      独立构造的第二个归档 (单 entry r1.txt), 与主 fixture 不同 entry 集,
      交叉验证读取路径。纯 C 文件 API 写入, 不经 shell。
  - name: bad.zip / empty.zip
    origin: generated
    description: 非法数据与空文件, 用于负向场景。

# 场景覆盖
scenarios:
  - open-archive: "zzip_dir_open 打开 zip"
  - find-entry: "zzip_dir_stat 查找 entry + st_size 校验"
  - read-entry: "zzip_file_open + zzip_read 读内容"
  - exact-compare: "读取内容与写入内容逐字节 memcmp 精确一致"
  - multi-entry: "3 entry 遍历 + 逐个读取验证"
  - missing-entry: "zzip_file_open 不存在 entry → NULL"
  - invalid-input: "非法 zip 数据 → zzip_dir_open NULL"
  - empty-input: "空文件 → zzip_dir_open NULL"
  - missing-file: "路径不存在 → zzip_dir_open NULL"

# 结果判定
verdict:
  pass: "全部 CHECK 通过, 程序 exit 0, stdout 末行 RESULT: PASS"
  fail: "任一 CHECK 失败, exit 1, RESULT: FAIL"
