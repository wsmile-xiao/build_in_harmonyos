version: "0.13.80"
software: libzzip
build_system: cmake
status: built
build_date: "2026-09-01"

source:
  url: "https://github.com/gdraheim/zziplib/archive/refs/tags/v0.13.80.tar.gz"
  sha256: "21f40d111c0f7a398cfee3b0a30b20c5d92124b08ea4290055fbfe7bdd53a22c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=<package_folder>"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"   # OHOS 无 CMake Platform 模块, 显式注入 SONAME flag
    - "-DZZIPDOCS=OFF"
    - "-DZZIPSDL=OFF"
    - "-DZZIPBINS=ON"
    - "-DZZIPTEST=ON"
    - "-DZZIPWRAP=ON"
  build_targets: "libzzip libzzipfseeko libzzipmmapped libzzipwrap + 13 bins 工具（--target 精确构建, 避开 test/sfx ALL 目标）"
  dependencies:
    - zlib
  cc: clang 15 (ohos-sdk)

patches_applied: []
knowledge_gained:
  - "软件名 libzzip 即 zziplib (gdraheim/zziplib)，上游唯一项目"
  - "License: MPL-1.1 (core) OR LGPL-2.1-or-later (可选授权)，仓库 COPYING.MPL / COPYING.LIB"
  - "4 个库目标: libzzip-0.so (core), libzzipfseeko-0.so, libzzipmmapped-0.so, libzzipwrap-0.so"
  - "官方测试 test/zziptests.py 是 python unittest (230 项)，需宿主 zip/unzip 工具"
  - "SONAME: OHOS 无 CMake Platform 模块 → CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 为空,
     上游已设 SOVERSION 13 但链接器收不到 flag → .so 无 DT_SONAME。
     configure 期注入 -DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname, 修复（零 patch）,
     同 libharu E298。注入后 bins 的 DT_NEEDED 从 ../zzip/libzzip-0.so 变为 libzzip-0.so.13"
  - "注入 SONAME 后全量 cmake --build 会在 test/sfx ALL 目标处中断（zzipsetstub 无
     LD_LIBRARY_PATH 找不到 libzzip-0.so.13 → 127）→ 改用 --target 精确构建 4 库 + 13 bins"
  - "zziptests.py 的 -b 必须传相对路径 ../bins: 用例 20595/65485/65486 执行
     'cd tmp.x && ../{exe}', 绝对路径拼成 '..//abs' → 127"
  - "test_81000 (SFX 自解压) 在 OHOS 上必失败: 内核拒绝 exec 非 ELF magic 开头的文件
     (zip stub 前缀 + ELF 尾部拼接)——环境限制非库 bug。fnmatch 无补集, 按 def test_
     枚举生成 229 个精确 pattern 排除"
  - "--downloads=OFF 跳过 134 项联网 CVE zip 测试（CI 无外网）"
  - "测试运行须 LD_LIBRARY_PATH=<build>/test/zzip（复制版本化 .so + 补软链）"
