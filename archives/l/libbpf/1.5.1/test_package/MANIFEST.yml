# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试申报）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libbpf/1.5.1
homepage: "https://github.com/libbpf/libbpf"

# 上游测试命令（官方 v1.5.1 源码无独立测试入口）
upstream_check_command: "make check"   # src/Makefile 实际无 check 目标（grep 计数 0）

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：官方发布源码无独立上游测试用例
# 顶层 tests/ 目录不存在（tarball 计数 0）、src/Makefile 无 test/check/selftest 目标、
# 无 CMake/Meson 测试注册、无 test_*.c 测试源文件
# fuzz/bpf-object-fuzzer.c 为 libFuzzer harness；ci/vmtest 引用内核树 selftests（需 BPF syscall+VM）
# => source_declared_total = 0，configured_executable_total = 0
# test_package/test.c 为本地 L1 测试（实际调用被测包公开 API），非上游测试
upstream_tests: []
