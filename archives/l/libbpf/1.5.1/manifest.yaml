# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.1"

# 软件名
software: libbpf

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libbpf/libbpf/archive/refs/tags/v1.5.1.tar.gz"

  # 源码校验和
  sha256: "e5ff89750e48ab5ecdfc02a759aa0dacd1e7980e98e16bdb4bfa8ff0b3b4b98f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "BUILD_STATIC_ONLY=y"
    - "NO_PKG_CONFIG=1"
    # libbpf 自定义 src/Makefile：无 configure 脚本，两个 Makefile 变量即全部配置

  # 编译依赖列表（格式: name/version）
  dependencies:
    - elfutils/0.195
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-netlink.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libbpf 使用 src/Makefile 自定义构建系统，需用 BUILD_STATIC_ONLY=y NO_PKG_CONFIG=1 编译（无 configure 脚本，ohc-run G0 configure 步骤会失败属预期非阻塞）"
  - "linux/socket.h 与 sys/socket.h 在部分 libc（含 OHOS SDK）上同时定义 sockaddr_storage 导致 netlink.c 重定义冲突，用平台无关自守卫（#if !defined(_UAPI_LINUX_SOCKET_H) + typedef __kernel_sa_family_t）先 include sys/socket.h 并跳过 linux/socket.h"
  - "libbpf 依赖 libelf（由 elfutils/0.195 提供）与 zlib/1.3.1.1，依赖 -I/-L/-l 必须经环境变量 CPPFLAGS/LDFLAGS/LIBS 喂给自定义 Makefile"
  - "make install 的 install(1) 在 OHOS 不存在，需 PATH 注入 busybox install 包装"
  - "OHOS 无 BPF syscall（seccomp 拦截 SIGSYS），libbpf 仅 ELF 解析/BTF 等非 syscall 功能可用"

patch_generation:
