# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libbpf/1.4.5
homepage: "https://github.com/libbpf/libbpf"

# 上游测试命令: libbpf 官方发布源码无独立测试套件
# （顶层无 tests/ 目录；src/Makefile 无 test/check 目标；fuzz/ 为 libFuzzer
#   框架入口；上游真实测试位于内核 tree 的 selftests/bpf，需 BPF syscall）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 官方发布源码 source_declared_total = 0
# 详细清点见 archives/l/libbpf/1.4.5/reports/test-enumeration.md
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, R34/PF3 实质调用)
test_package_tests:
  - file: test.c
    description: "消费者测试：libbpf_version_string / libbpf_strerror / btf__new_empty / btf__add_int 实质调用"
    command: "./test_libbpf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
