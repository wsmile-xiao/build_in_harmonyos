# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "BUILD_STATIC_ONLY=y"
    - "NO_PKG_CONFIG=1"

  # 编译依赖列表（格式: name/version）
