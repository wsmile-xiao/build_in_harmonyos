knowledge_gained:
  - "libbpf 使用 src/Makefile 自定义构建系统，需用 BUILD_STATIC_ONLY=y NO_PKG_CONFIG=1 编译"
  - "OHOS SDK linux/socket.h 与 sys/socket.h 有 sockaddr_storage 重定义冲突，需 #ifdef __OHOS__ 守卫"
  - "clang 不支持 GCC 的 __attribute__((alias))，elfutils 的 strong_alias 需替换为空宏"
  - "elfutils autotools 构建在 HMDFS 上不稳定（config.status mktemp 失败），手动编译更可靠"
  - "鸿蒙平台不具备 BPF syscall 支持，libbpf 仅可用于 ELF 解析等非 BPF 功能"

