software: libbpf
display: "libbpf"
description: "Linux BPF subsystem user-space interaction library (ELF parsing available on OHOS)"
category: system
homepage: "https://github.com/libbpf/libbpf"
license: (LGPL-2.1 OR BSD-2-Clause)
build_system: makefile

ohos_adaptation:
  key_points:
    - "HarmonyOS lacks BPF syscall support; libbpf can only be used for ELF parsing"
    - "OHOS SDK has sockaddr_storage redefinition conflict between linux/socket.h and sys/socket.h"
    - "Must compile with BUILD_STATIC_ONLY=y NO_PKG_CONFIG=1"
  common_dependencies:
    - libelf
    - zlib

versions:
  "1.6.2":
    status: built
    build_date: "2026-06-02"