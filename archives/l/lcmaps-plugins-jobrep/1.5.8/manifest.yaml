version: "1.5.8"
software: lcmaps-plugins-jobrep
status: built
build_date: "2026-09-26"
build_system: autotools

source:
  url: "https://software.nikhef.nl/security/lcmaps-plugins-jobrep/lcmaps-plugins-jobrep-1.5.8.tar.gz"
  sha256: "a565bc88f12cf8f8cf3bf32889bdff7daa3f5e24885c17a3f21b86fc3a59d57e"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-shared --disable-static（options.shared 默认 True）"
    - "CPPFLAGS/LDFLAGS 仅注入 -I/-L（不使用 AutotoolsDeps，见 knowledge_gained E467 条）"
  dependencies:
    - lcmaps/1.6.7
    - unixodbc/2.3.12
    - openssl/3.5.6
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-config-guess-ohos.patch"
  - "patches/0002-config-sub-ohos.patch"
  - "patches/0003-configure-umask.patch"

knowledge_gained:
  - "E467 复现与处置：Conan 的 AutotoolsDeps 会把整条依赖闭包写进全局 LIBS 环境变量；autoconf 最早的 AC_PROG_CC「whether we are cross compiling」探测会沿用该 LIBS 去链接 conftest，于是本应只跑空 main() 的探测变成要加载 -lodbc/-llcmaps_without_gsi/-lcrypto 全链，而 conftest 无 rpath 指向 Conan 缓存 → 加载失败 → configure 在 'checking whether we are cross compiling' 处 rc=77 报 'cannot run C compiled programs'。修法（同 archives/c/cyrus-sasl-gs2/2.1.28 先例）：不用 AutotoolsDeps，改为只注入 -I/-L（经 configure_args 以 VAR=value 形式传 CPPFLAGS/LDFLAGS），让早期探测保持空链接，后续 AC_CHECK_LIB/头文件检查仍能命中"
  - "本插件 configure.ac 的全部依赖检查都是「头文件编译」或「显式 AC_CHECK_LIB」两类，两者都会在测试链接行自带所需库，因此 -I/-L-only 注入已充分，无需完整 LIBS 闭包"
  - "AC_LCMAPS_INTERFACE([basic]) 的查找顺序是：先直接编译探测 <lcmaps/lcmaps_basic.h>（该头引用 lcmaps_version.h 的 LCMAPS_API_*_VERSION 宏并做版本比对），失败才回退 PKG_CHECK_MODULES 找 lcmaps-basic-interface.pc。因此真正起决定作用的是头文件可被找到（-I），而不是 .pc 是否在 PKG_CONFIG_PATH 中"
  - "插件上游 Makefile.am 故意注释掉 liblcmaps_jobrep_la_LIBADD：.so 内 lcmaps_* 与 OpenSSL 符号保持未定义，由宿主 LCMAPS 进程提供。因此消费者测试必须显式链接 lcmaps/unixodbc/openssl 才能解析符号——这也正是 R34『实质调用』的验证方式"
  - "utils/Makefile.am 用 sbin_SCRIPTS 安装 jobrep-admin（Conan 将 sbindir 映射到 bin/）。该脚本只是 mysql 客户端的一层包装（建/删/列 jobrepository 库表），而 mysql 既非本包依赖也不在 OHOS 上，故按仓库惯例在 package() 中删除 bin/ 并声明空 bindirs，避免发布一个无法运行的命令（同 unixodbc/libiodbc2/canl-c 先例）"
  - "test_package 中传 argc 必须与实参数组长度一致：plugin_initialize 的 for 循环上界是 argc，少传会让尾部参数（如 --username）扫不到，导致 jr_db_user 为 NULL 而返回 LCMAPS_MOD_FAIL（实测踩中过一次，属测试自身缺陷而非插件问题）"
  - "本插件与 lcmaps 本体共用同一组 config.guess/config.sub/umask 适配（E007/E011），补丁内容同构，可互为参考"

patch_generation:
  method: unified-diff-against-pristine
  source_orig_dir: "$TMPDIR/lcmaps-jobrep-recon/jpristine"
  source_work_dir: "$TMPDIR/lcmaps-jobrep-recon/jpatched"
  patches_count: 3

test_results:
  type: consumer
  total: 10
  passed: 10
  failed: 0
  skipped: 0
  pass_rate: "10/10 (100%)"
  note: "本地 conan create（ohos-aarch64 profile）实测 Package created + test_package 10/10 断言通过，exit 0；无上游自动化测试（见 test_package/MANIFEST.yml 清点证据）"
