# test_package/MANIFEST.yml
# 测试声明文件（CI 门禁 L0e 强制要求存在，assertion_count 不得为 0）
#
# ── R51 上游测试清点（第一步：清点）────────────────────────────────────
# lcmaps-plugins-jobrep 1.5.8 上游**无自动化测试套件**。清点证据：
#   1) `grep -rn "TESTS *=" --include="*.am"` 对全部 5 个 Makefile.am
#      （顶层 / src / src/jobrep / utils / doc）→ 命中 0 处；
#      `check_PROGRAMS` 同样命中 0 处。
#   2) 源码树中不存在 tests/ 或 test/ 目录。
#   3) 无自定义 check-local / check-am 规则；`make check` 因此为空操作
#      （automake 在无 TESTS 时为 no-op）。
#   4) src/jobrep/jobrep_test.c 是手工驱动程序，**仅出现在
#      src/jobrep/Makefile.am 的 `EXTRA_DIST`（源码分发列表）中**，不在任何
#      `_SOURCES`、`check_PROGRAMS` 或 `TESTS` 内 —— 故不被任何目标编译、
#      `make check` 也不运行。
#      该文件自身也不具备自动化测试特征：main() 内硬编码用户名与
#      job_request 字面量，需要 USE_VOMS_TEST_PROXY 的 GSI 代理凭证
#      （gssapi.h / globus_gss_assist.h）以及可用的数据库连接，且无断言框架、
#      无期望输出比对、无退出码语义。
#   结论：按 R51「上游确无测试须附清点证据」申报，不使用空跑 make check
#   制造假执行痕迹（R52 点名的欺骗行为）。
#
# ── 适配补全测试（自研）────────────────────────────────────────────────
# 上游无测试，故本次适配补全消费者测试（test_package/test_jobrep.c）：
# 链接 liblcmaps_jobrep 并真实调用插件入口点，覆盖参数解析、前置校验与
# 参数表回填逻辑。

package: lcmaps-plugins-jobrep/1.5.8
homepage: "https://wiki.nikhef.nl/grid/LCMAPS"

# 上游官方测试：无
upstream_official_tests: []
upstream_test_count: 0
upstream_test_census_evidence: >-
  grep -rn "TESTS *=" --include="*.am" 命中 0 处；check_PROGRAMS 命中 0 处；
  无 tests/ 目录；无自定义 check-local/check-am 规则。src/jobrep/jobrep_test.c
  仅出现在 src/jobrep/Makefile.am 的 EXTRA_DIST（源码分发列表）中，不在任何
  _SOURCES / check_PROGRAMS / TESTS 内，故不被任何目标编译、make check 也不
  运行；该文件本身硬编码测试凭证且依赖 GSI 代理与数据库连接，无断言框架与
  期望输出比对，属手工驱动程序而非自动化测试。

# 构建阶段执行的测试命令：上游无测试，build() 中不调用 make check
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 适配补全测试（自研，非上游）：10 个断言，见 test_package_tests
adapted_tests:
  - file: test_package/test_jobrep.c
    origin: ohos-adaptation (self-authored)
    description: >-
      上游无自动化测试，本次补全消费者测试：链接 liblcmaps_jobrep，真实调用
      plugin_initialize / plugin_introspect / plugin_terminate 三个入口点并逐项
      断言返回值与参数表内容。

# test_package 自带的测试（消费者视角验证，适配自研）
test_package_tests:
  - file: test_jobrep.c
    origin: ohos-adaptation (self-authored)
    description: >-
      消费者测试：include <lcmaps/lcmaps_plugin_prototypes.h> 等，链接
      liblcmaps_jobrep（插件安装于 lib/lcmaps/），真实调用：
      ① plugin_initialize 拒绝未知参数（LCMAPS_MOD_FAIL）
      ② plugin_initialize 缺少 --dsn 时失败（LCMAPS_MOD_FAIL）
      ③ plugin_initialize 接受 --dsn/--username（LCMAPS_MOD_SUCCESS）
      ④ plugin_initialize 识别 --test 开关
      ⑤ plugin_introspect 返回 LCMAPS_MOD_SUCCESS 且 argc==3
      ⑥ 参数表首项为 user_dn、第三项为 job_request
      ⑦ plugin_terminate 返回 LCMAPS_MOD_SUCCESS
      说明：不调用 plugin_run/plugin_verify —— 二者需要可用的 ODBC 数据源与
      X.509 凭证链，属环境依赖，不纳入离线消费者测试。
    command: "./test_jobrep"

# 测试断言总数（test_jobrep.c 中 check() 调用数：10 项）
assertion_count: 10
