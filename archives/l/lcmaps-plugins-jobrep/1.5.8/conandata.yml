# conandata.yml — lcmaps-plugins-jobrep 1.5.8
# 源码 = Nikhef 官方发布目录（该库唯一上游发布点，R39 合规）
#   https://software.nikhef.nl/security/lcmaps-plugins-jobrep/
# sha256 取自官方同名 .sha256 清单，并与本地实算逐字比对一致。
#
# 依赖：lcmaps（basic interface 头文件与库）+ unixODBC + OpenSSL(libcrypto)。
# 注意 lcmaps 本体必须先发布到制品仓（R36）；本仓库中 lcmaps 1.6.7 为配套
# 适配产物。

sources:
  "1.5.8":
    url: "https://software.nikhef.nl/security/lcmaps-plugins-jobrep/lcmaps-plugins-jobrep-1.5.8.tar.gz"
    sha256: "a565bc88f12cf8f8cf3bf32889bdff7daa3f5e24885c17a3f21b86fc3a59d57e"

patches:
  "1.5.8":
    # 0001/0002：config.guess / config.sub 增加 HarmonyOS(ohos) 识别。
    # 本机 uname -s 返回 "HarmonyOS"，2023-06-23 版 config.guess 无该分支，
    # configure 在 "checking build system type" 阶段即失败（知识库 E007）。
    # 采用 POSIX 兼容的标准 config 脚本扩展方式，未引入 __OHOS__ 平台宏（R8/PF5）。
    - patch_file: "patches/0001-config-guess-ohos.patch"
      patch_description: "Add HarmonyOS system identification to config.guess"
      patch_type: "portability"
    - patch_file: "patches/0002-config-sub-ohos.patch"
      patch_description: "Add ohos-linux triplet and linux-ohos kernel-OS pair to config.sub"
      patch_type: "portability"
    # 0003：configure 生成 config.status 时用 umask 077 建临时目录，在 OHOS
    # HMDFS 上因 UID 映射 + setgid 导致该目录对自身不可写，报
    # "config.status: cannot create subs1.awk: Permission denied"（知识库 E011）。
    # 改为 umask 022，先例见 archives/a/aaphoto/0.45 与 archives/l/lcmaps/1.6.7。
    - patch_file: "patches/0003-configure-umask.patch"
      patch_description: "Use umask 022 for config.status temp-dir creation (HMDFS setgid makes 0700 dirs unwritable)"
      patch_type: "portability"
