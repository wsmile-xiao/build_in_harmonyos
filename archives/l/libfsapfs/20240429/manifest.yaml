    command: "make check"
    counting_unit: "tests/Makefile.am 注册的 C 测试程序（check_PROGRAMS）"
    unit_programs: 61
    declared_n_head_lower_bound: 63
    executed: 59
    passed: 59
    failed: 0
    skipped: 0
    not_run: 4
    runner_cases: 4
    runner_passed: 2
    runner_skipped: 2
    note: >-
      取数口径：声明 N 取候选数法最大值 = 上游当前 HEAD（2026-09-20 现场取数）的 63 个
      check_PROGRAMS；被审版本 20240429 自带 61 个，其中上游 runner 驱动的 59 个
      （test_library.sh 52 + test_tools.sh 7）本次全部编译并真实执行、全部通过。
      NOT_RUN 4 项逐条归因：① fsapfs_test_file_entry / fsapfs_test_key_bag_value 为
      20240429 之后上游新增，被审版本源码树内不存在；② fsapfs_test_data_block_vector /
      fsapfs_test_volume_superblock 虽在本版本注册，但上游不把它们列入任何 runner，
      配方不改动上游测试执行面故不执行——两者的设备独立探针读数已逐字记在
      notes.md（前者 rc=1，失败于上游用例自身与实现不同步：用例传 NULL data_handle，
      实现按 invalid data handle 拒绝；后者 rc=0）。TOTAL 63 = PASS 59 + FAIL 0 + SKIP 0
      + NOT_RUN 4。
      runner 面（另一计数单位，不并入 N）：automake 汇总 # TOTAL: 4 / PASS: 2 / SKIP: 2 / FAIL: 0，
      test_fsapfsinfo.sh 与 test_fsapfsinfo_bodyfile.sh 因 release archive 不含 tests/input/
      按上游规则 SKIP（exit 77）。
  adapted:
    command: "Conan test_package"
    cases: 15
    passed: 15
    pass_rate: "15/15 (100%)"
    breakdown:
      generic_consumer_assertions: 10
      harmony_specific_assertions: 5
    note: >-
      test_libfsapfs.c 10 项：版本串 20240429、读访问标志、get_codepage 正常/错误路径、
      set_codepage、check_container_signature(NULL) 与 check_volume_signature(NULL) 错误路径、
      container_initialize/container_free；test_ohos.c 5 项：__OHOS__ 编译目标、TMPDIR 非 /tmp、
      临时路径构造、临时文件写读往返比对、清理后 access+errno=ENOENT。

