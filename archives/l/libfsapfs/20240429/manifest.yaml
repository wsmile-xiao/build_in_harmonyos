    gzip -t 通过。

build:
  system: autotools
  configure_options:
    - "--disable-python"
    - "--with-libfuse=no"
    - "--enable-static-executables=no"
    - "--enable-shared"
    - "--disable-static"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcaes
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfdatetime
    - libfguid
    - libfmos
    - libhmac
    - libuna
  optional_features:
    deflate: zlib
    aes_ecb: local
    aes_xts: local
    md5: local
    sha256: local
    fuse: "no"
    note: >-
      自动探测结果（configure 摘要逐字见 notes.md）：zlib 来自 OHOS NDK sysroot，
      libcrypto 不存在但 AES/MD5/SHA256 由内嵌 libcaes/libhmac 提供（摘要显示 local），
      故未照抄同族先例的 --with-openssl=no。
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 平台适配全部内联在 conanfile.py 的 generate()/build()（平台三元组、umask、CONFIG_SHELL/
# LOG_COMPILER、沙箱 HOME）；测试驱动方式未做任何改动（上游 make check 原样驱动），
# 不修改任何上游 C 源文件与测试文件，故本列表为空。
patches_applied: []

knowledge_gained:
  # 每条行尾引用最接近的条目（写法遵循容器层口径：# knowledge_ref: <条目/新草稿号>）。
  - "libyal 的 configure 把 zlib/libcrypto 做成可选自动探测项：`checking for zlib >= 1.2.5... no` 只是 pkg-config 没有 .pc，真正的结论是随后的 `checking for zlib.h... yes` / `checking for uncompress in -lz... yes`；zlib 命中 OHOS NDK sysroot，设备与 CI 同一 SDK，读数可迁移。"  # knowledge_ref: DRAFT-E590-libyal-optional-dep-autodetect-ohos
  - "缺 libcrypto ≠ 缺加密：AES-ECB/AES-XTS/MD5/SHA256 在摘要里是 local（内嵌 libcaes/libhmac 提供），照抄 libfvde/libbde 的 --with-openssl=no 会无证据地改变能力集合。"  # knowledge_ref: DRAFT-E590-libyal-optional-dep-autodetect-ohos
  - "AX_ZLIB_CHECK_LIB / AX_LIBCRYPTO_CHECK_LIB 的第一行按 shared 分支无条件置 no：--disable-shared 的静态构建会静默失去压缩/加密能力且 configure 不报错（本包 shared=True 不受影响）。"  # knowledge_ref: DRAFT-E590-libyal-optional-dep-autodetect-ohos
  - "发布包自带 config.guess/config.sub（2024）不识别 HarmonyOS，且 config.sub 无 ohos 分支（`grep -c ohos` = 0、`./config.sub aarch64-unknown-linux-ohos` rc=1）→ 回落 aarch64-unknown-linux-gnu，且 --build 与 --host 取同一三元组时 configure 打印 cross compiling... no，AC_RUN_IFELSE 正常执行。"  # knowledge_ref: E007
  - "同族不同版本的 config.sub 能力不同（libvhdi 20251119 接受 linux-ohos，libfsapfs 20240429 与 libfsxfs 20240501 不接受）——三元组必须现场用 ./config.sub <triplet> 取证，不能按族照抄。"  # knowledge_ref: DRAFT-E587-libyal-ohos-triplet-variance
  - "HMDFS 下 Autoconf 的 umask 077 临时目录不可用；构建期把 configure 里的 umask 077 改成 022，全程 umask 022。"  # knowledge_ref: E011
  - "HMDFS 禁止直接执行源码树脚本；用 CONFIG_SHELL 解释 configure，并给 make check 传 LOG_COMPILER=/data/service/hnp/bin/bash（设备无 /bin/bash）。"  # knowledge_ref: E087
  - "libfsapfs 发布包是自包含闭包：17 个本地 libyal 组件 + 生成好的 configure/aclocal.m4/config.guess/config.sub/Makefile.in 全在 tarball 内；配方在 build() 早期校验闭包，缺失即报错，不调用 synclibs.sh。"  # knowledge_ref: E277
  - "设备上 `file` 是 toybox（`file -b <libtool 包装脚本>` 输出 `/bin/sh script`），因此 2024 版 test_runner.sh 的 `find_binary_executable` 判据（grep \"POSIX shell script\"）在本机不成立、helper 原样返回；而包装脚本本身可以直接执行——两件事叠加的结论是：本包**不需要**测试运行方式补丁，上游 make check 原样可用。"  # knowledge_ref: E228
  - "tests/Makefile.am 注册的 check_PROGRAMS 里可能有程序不被任何上游 runner 驱动（本包 61 项中有 fsapfs_test_data_block_vector / fsapfs_test_volume_superblock）；这类项按 NOT_RUN 申报并给出独立探针读数，不要为了凑执行数直跑——本包实测其中一个在该版本下必然失败（上游用例自身与实现不同步）。"  # knowledge_ref: E328
  - "上游 release archive 不含 tests/input/：test_fsapfsinfo.sh 与 test_fsapfsinfo_bodyfile.sh 按上游自身规则 SKIP（exit 77，'Test input directory not found.'）。"  # knowledge_ref: E370

tests:
