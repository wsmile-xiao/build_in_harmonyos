  sha256: "665f70705e69ce90c87e0f9c185d47002e242b79b0a37ae52751cdfa8363a538"
  tar_format: tar.gz
  upstream_release_url: "https://github.com/libyal/libfsapfs/releases/download/20240429/libfsapfs-experimental-20240429.tar.gz"
  upstream_tag: "20240429"
  upstream_commit: null
  release_artifact: >-
    上游官方 release 资产 libfsapfs-experimental-20240429.tar.gz（HTTP 200，
    2171864 字节，顶层目录 libfsapfs-20240429/）。与同批部分同族包不同，libfsapfs 的
    refs/tags/20240429 与 release 资产都仍在，故无需回落发行版镜像（R39 官方源头口径）。
    三面互证：① 官方 release 资产下载件 sha256
    665f70705e69ce90c87e0f9c185d47002e242b79b0a37ae52751cdfa8363a538；
    ② Debian PGP 签名 libfsapfs_20240429-1.dsc 的 Checksums-Sha256 声明同一哈希与字节数；
