package: libfsapfs/20240429
homepage: https://github.com/libyal/libfsapfs

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: "libfsapfs library tests"
    source: tests/test_library.sh
    description: "Upstream shell runner for the 50 argument-only library test programs plus the 2 input-driven ones (container, support)"
    command: "./tests/test_library.sh"
  - name: "fsapfstools tests"
    source: tests/test_tools.sh
    description: "Upstream fsapfstools helper tests: bodyfile, digest_hash, info_handle, mount_path_string, output, path_string, signal"
    command: "./tests/test_tools.sh"
  - name: "fsapfsinfo tests"
    source: tests/test_fsapfsinfo.sh
    description: "fsapfsinfo metadata output checks; skips (exit 77) because the release archive ships no tests/input directory"
    command: "./tests/test_fsapfsinfo.sh"
  - name: "fsapfsinfo bodyfile tests"
    source: tests/test_fsapfsinfo_bodyfile.sh
    description: "fsapfsinfo bodyfile callback checks; skips (exit 77) because the release archive ships no tests/input directory"
    command: "./tests/test_fsapfsinfo_bodyfile.sh"
  - name: "fsapfs_test_data_block_vector"
    source: tests/fsapfs_test_data_block_vector.c
    description: >-
      本版本注册的 check_PROGRAMS，但上游不把它列入任何 runner → NOT_RUN
      （配方不执行它，以保持上游的测试执行面不变）。设备独立探针实测该程序失败，
      根因是上游用例自身与实现不同步（用例传 NULL data_handle 期望返回 1，
      实现按 invalid data handle 返回 -1），读数见 notes.md。
    probe_command: "./tests/.libs/fsapfs_test_data_block_vector"
  - name: "fsapfs_test_volume_superblock"
    source: tests/fsapfs_test_volume_superblock.c
    description: >-
      本版本注册的 check_PROGRAMS，但上游不把它列入任何 runner → NOT_RUN
      （配方不执行它；与上一项同一口径，不做「只挑通过的那个跑」）。
      设备独立探针读数 rc=0（通过，但不计入执行数），见 notes.md。
    probe_command: "./tests/.libs/fsapfs_test_volume_superblock"

not_run_upstream_tests:
  - name: "fsapfs_test_file_entry"
    reason: "上游 20240429 之后新增的注册项，被审版本源码树内不存在（NOT_RUN）"
  - name: "fsapfs_test_key_bag_value"
    reason: "上游 20240429 之后新增的注册项，被审版本源码树内不存在（NOT_RUN）"
  - name: "fsapfs_test_data_block_vector"
    reason: "本版本注册但上游不列入任何 runner；配方不改动上游测试执行面故不执行（NOT_RUN）"
  - name: "fsapfs_test_volume_superblock"
    reason: "本版本注册但上游不列入任何 runner；配方不改动上游测试执行面故不执行（NOT_RUN）"

test_package_tests:
  - file: test_libfsapfs.c
    description: "Consumer API version, access flags, codepage, signature error paths, and container lifecycle checks"
    command: "./test_libfsapfs"
  - file: test_ohos.c
    description: "OHOS-specific consumer test: compile-time OHOS target check and writable TMPDIR file lifecycle"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "ohos-tmpdir-file-lifecycle"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、TMPDIR 非 /tmp、临时文件读写和清理"
    command: "./test_ohos"
    assertions: 5
    platform: OHOS

assertion_count: 15
