software: libheif-aom
# 版本级 manifest — 文件位置: archives/l/libheif-aom/1.23.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "1.23.0"
conan_ref: "libheif-aom/1.23.0"

# published | built | failed | archived
# O5：只有 release upload 已确认才可标 published，此前一律 built。
status: built

build_date: "2026-09-20"

# 构建系统类型（顶层字段；init-build 对全新包会误探测成 autotools，此处人工核对为 cmake：
# 上游 libheif 1.23.0 的构建入口是 CMakeLists.txt / CMakePresets.json，
# 内树 aom（libaom 3.9.1）同样是 CMake 工程。）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 父 tarball（本包是其中树内子模块：CMake MODULE 目标 heif-aomdec / heif-aomenc）
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"
  tar_format: tar.gz

  # 内树自包含的第二个源（**不是** Conan 依赖；本仓与 ohpcd 都没有 aom 配方，
  # archives/a/aom/3.9.1 是无 conanfile.py 的 v2.0 元数据孤儿）：
  # 官方 libaom 3.9.1 release 归档，用配方 build() 先编静态 libaom.a 再编宿主与插件。
  # sha256 双端点互证：GCS release 归档 与 官方 googlesource tag 归档
  # (https://aomedia.googlesource.com/aom/+archive/refs/tags/v3.9.1.tar.gz)
  # 逐文件内容比对，1353 个文件 per-file sha256 全等（聚合 31a4baa2…628d2ce5）。
  vendored_source:
    url: "https://storage.googleapis.com/aom-releases/libaom-3.9.1.tar.gz"
    sha256: "dba99fc1c28aaade28dda59821166b2fa91c06162d1bc99fde0ddaad7cecc50e"
    tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # cmake 选项（与 conanfile.py generate() 一致；由 CMakeToolchain 下发的 -D 变量）
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"                # 插件 dlopen 语义要求宿主为共享库
    - "-DCMAKE_SYSTEM_NAME=Linux"             # 设备只有 Platform/OHOS.cmake，缺此宿主无 SONAME → 插件 DT_NEEDED 变相对路径 ../libheif.so
    - "-DENABLE_PLUGIN_LOADING=ON"            # 交付面必要条件：插件模块形态
    - "-DWITH_AOM_DECODER=ON"                 # 交付面：AV1 解码后端
    - "-DWITH_AOM_ENCODER=ON"                 # 交付面：AV1 编码后端
    - "-DWITH_AOM_DECODER_PLUGIN=ON"          # aom 的 *_PLUGIN 默认 OFF，必须显式打开
    - "-DWITH_AOM_ENCODER_PLUGIN=ON"          #   （→ libheif-aomdec.so / libheif-aomenc.so）
    - "-DWITH_LIBDE265=OFF"
    - "-DWITH_X265=OFF"
    - "-DWITH_X264=OFF"
    - "-DWITH_DAV1D=OFF"
    - "-DWITH_KVAZAAR=OFF"
    - "-DWITH_UVG266=OFF"
    - "-DWITH_VVDEC=OFF"
    - "-DWITH_VVENC=OFF"
    - "-DWITH_FFMPEG_DECODER=OFF"
    - "-DWITH_OpenH264_DECODER=OFF"
    - "-DWITH_RAV1E=OFF"
    - "-DWITH_SvtEnc=OFF"
    - "-DWITH_JPEG_DECODER=OFF"
    - "-DWITH_JPEG_ENCODER=OFF"
    - "-DWITH_OpenJPEG_DECODER=OFF"
    - "-DWITH_OpenJPEG_ENCODER=OFF"
    - "-DWITH_OPENJPH_ENCODER=OFF"
    - "-DWITH_LIBSHARPYUV=OFF"
    - "-DWITH_UNCOMPRESSED_CODEC=OFF"
    - "-DWITH_WEBCODECS=OFF"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_GDK_PIXBUF=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_DOCUMENTATION=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"   # 安装期不得改写 RUNPATH（改写会破坏 OHOS ELF 代码签名 → 装出来的插件 dlopen Permission denied）
    - "-DCMAKE_INSTALL_RPATH="                # 不烘绝对路径；运行期由 conanrun 的 LD_LIBRARY_PATH 提供
    - "-D_LIBCPP_ENABLE_EXPERIMENTAL"          # OHOS libc++ 15 隐藏 std::ranges::all_of/find，box.cc 需要
    - "-DAOM_INCLUDE_DIR=<build_folder>/aom-prefix/include"   # 内树 libaom 头文件（FindAOM 的 MODULE 模式探测输入）
    - "-DAOM_LIBRARY=<build_folder>/aom-prefix/lib/libaom.a"  # 内树 libaom 静态库（同上）
    - "-DAOM_TARGET_CPU=generic"               # 内树 libaom：关 ARM 汇编
    - "-DCONFIG_PIC=1"                         # 内树 libaom：静态库需 PIC 才能链进 MODULE

  # 编译依赖列表（格式: name/version）
  # 空 —— aom 无 Conan 配方，按 handbrake/1.11.2 先例内树自包含构建（R36：没有需要
  # 事先发布的依赖）；宿主 libheif 同源同包自包含交付；其余后端全部显式 OFF。
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 上游测试用例（rule4 / R51）
# ============================================================

upstream_tests:
  command: "ctest   # 需 -DBUILD_TESTING=ON；本包交付面不含上游测试目标（BUILD_TESTING=OFF）"
  # 主 N = 父 tarball 全量注册面里「用例/注册类」候选口径的最大值 = Catch2 TEST_CASE 注册数
  test_count: 217
  unit: 217
  integration: 0
  other: 0
  not_run: 217
  run: 0
  basis: >-
    父 tarball（libheif 1.23.0，sha256 50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a）
    全量注册面，候选口径逐项读数（取数命令见 notes.md「上游测试清点」）：
    a) Catch2 TEST_CASE 注册数 = 217（tests/*.cc，grep -rho 'TEST_CASE' tests/*.cc | wc -l）——
       用例/注册类最大值，即主 N；TEST_CASE_METHOD/SCENARIO/SCENARIO_METHOD 均为 0；
    b) CTest add_test 注册数（全开关上限）= 39（tests/CMakeLists.txt 的 add_libheif_test/
       add_heifio_test 调用点，含 WITH_REDUCED_VISIBILITY/ENABLE_EXPERIMENTAL_FEATURES/
       WITH_UNCOMPRESSED_CODEC/WITH_OPENJPH_ENCODER/WITH_OpenJPEG_ENCODER/ZLIB_FOUND 全开）；
    c) 测试可执行目标（全开关上限）= 39（与 b 一一对应）；
    d) 测试源文件 = 41 个 .cc（含 main.cc/test_utils.cc 两个无 TEST_CASE 的公共文件）；
    e) 断言 REQUIRE( = 3994、CHECK( = 18、REQUIRE_FALSE/CHECK_FALSE( = 4，合计 4016 ——
       属**另一单位**，只披露、不并入 N；另有 GENERATE( 43 处（运行期再展开）、SECTION( 5 处。
  notes: >-
    本包交付面 = 上游树内 aom 编解码后端插件（CMake 目标 heif-aomdec/heif-aomenc），
    上游 tests/ 的 39 个测试目标不被 install()、不属交付面；启用 BUILD_TESTING=ON 会额外
    要求 heifio 与 TIFF/JPEG/PNG/WEBP 探测以及本包未适配/未发布的后端（R36），
    故按 BUILD_TESTING=OFF 构建，217 项上游用例全部以 NOT_RUN 记账并逐项归因（见 notes.md）。

test_package:
  # 鸿蒙侧消费者用例（检查点数，由 test_package/test_libheif_aom.c 自报 checks_total）
  assertion_count: 25
  # 适配后合计（与 PR 正文「适配后测试用例统计」表同源同单位）= 上游 217 + 鸿蒙特有 25
  adapted_total: 242
  description: >-
    find_package(libheif) + 链接交付的宿主；宿主版本指纹 1.23.0；heif_init 后
    LIBHEIF_PLUGIN_PATH 指向 <pkg>/lib/libheif；heif_have_decoder_for_format(AV1)==1
    与 heif_have_encoder_for_format(AV1)==1（两个插件模块都被 dlopen 并注册）；
    HEVC 解码/编码后端反证为 0；再用交付的 aomenc 插件把合成 YCbCr 4:2:0 图编码到内存、
    用 aomdec 插件读回解码，校验尺寸与逐点像素误差（有损 q=90 往返）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  # knowledge_ref: E622
  - "OHOS 上 `cmake --install` 会**破坏交付物**：CMake 默认（BUILD_WITH_INSTALL_RPATH=OFF）在安装期就地改写构建树 RUNPATH，而设备 clang launcher 在链接期写入的 `.note.ohos.ident` 代码签名覆盖整个文件——改写后签名失效，加载器拒绝映射，插件 dlopen 报的是 **Permission denied**（不是 not found），宿主因无需改写而幸免（易误判"交付物没问题"）。判据：安装前后 sha256 是否一致 + `readelf -d` 的 RUNPATH 条数；修法：`tc.variables['CMAKE_BUILD_WITH_INSTALL_RPATH']=True` + `tc.variables['CMAKE_INSTALL_RPATH']=''`。命中范围：只有链接了**同一构建树内另一个 target** 的目标才会带构建树 RPATH 并被改写（libheif 插件 `PRIVATE … heif` 正是此形态，7 个同族子包全中）"
  # knowledge_ref: E622
  - "libheif 1.19+ 的编解码后端由 plugin_option(<X>, display, defaultEnabled, defaultPlugin) 生成 WITH_<X> 与 WITH_<X>_PLUGIN 两个开关，**每个后端的默认值不同**：LIBDE265/X265/X264/OpenH264/AOM_DECODER/AOM_ENCODER 默认 ON+OFF（启用即静态编入宿主），DAV1D/SvtEnc/RAV1E/OpenJPEG/OPENJPH_ENCODER 默认 OFF+ON（启用即独立插件）。做插件子包必须两个开关一起打开：只开 WITH_<X>_PLUGIN=ON 时上层 if (WITH_<X>) find_package() 不执行，目标根本不生成，配置/构建/安装全绿而包里没有插件（假绿）"
  # knowledge_ref: E622
  - "aom 后端在上游是**两个** MODULE 目标：heif-aomdec（decoder_aom.cc → libheif-aomdec.so）与 heif-aomenc（encoder_aom.cc → libheif-aomenc.so），且 AOM_DECODER_FOUND/AOM_ENCODER_FOUND 会被 WITH_AOM_* 反写，编码器还要过 FindAOM.cmake 的 check_symbol_exists(AOM_USAGE_GOOD_QUALITY)；构建时必须显式点名两个目标（--target heif heif-aomdec heif-aomenc），否则探测失败也不会让构建失败，只会安静地少产物"
  # knowledge_ref: E622
  - "OHOS 上 CMAKE_SYSTEM_NAME 缺省会让共享库**没有 SONAME**（uname -s 是 HarmonyOS，而 SDK 的 CMake 只有 Platform/OHOS.cmake、没有 Platform/HarmonyOS.cmake，CMake 落到未知平台回退）。后果是插件 MODULE 的 DT_NEEDED 被写成含斜杠的相对路径（实测 '../libheif.so'），该条目按 CWD 解析，安装后 heif_init() 直接 dlopen 失败。修法：tc.cache_variables['CMAKE_SYSTEM_NAME']='Linux'（走 Platform/Linux.cmake，宿主得 SONAME libheif.so.1，插件 DT_NEEDED 变无斜杠），仓库 693 个配方同口径"
  # knowledge_ref: E622
  - "codec 本体没有 Conan 配方时（aom/svt-av1），唯一能出真产物的路线是内树自包含：conandata.yml 用第二个顶层 key 放官方 codec 源（两个 url/sha256 必须同一次下载配对——同一 tag 的 GitHub archive 与 releases/download 是不同制品），build() 先用同一份 conan_toolchain.cmake 编静态 codec（PIC + AOM_TARGET_CPU=generic）进 build_folder 私有 prefix，再用 cache 变量钉住 MODULE 模式 finder（FindAOM 的 AOM_INCLUDE_DIR/AOM_LIBRARY）；requirements() 留空（R36 先例 archives/h/handbrake/1.11.2）。判定必须三步齐做：内树 find + conan install/download 双探针 + 包目录是不是无 conanfile.py 的元数据孤儿（archives/a/aom/3.9.1）"
  # knowledge_ref: E622
  - "宿主 libheif 1.23.0 在 OHOS libc++ 15（_LIBCPP_VERSION 15004）上会因未定义 _LIBCPP_ENABLE_EXPERIMENTAL 而隐藏 std::ranges::all_of/find，libheif/box.cc 编译硬失败（3 errors）；修法是 tc.preprocessor_definitions['_LIBCPP_ENABLE_EXPERIMENTAL']=None，不改上游源码、不需要 -lc++experimental（先例 libpqxx/8.0.1、ladybug/0.18.2）。注意粗粒度特性宏 __cpp_lib_ranges 仍为 201811L（宏说有≠实现有），必须以真编译器探针为准"
  # knowledge_ref: E622
  - "子包的上游 N 按父 tarball 完整注册面取「用例/注册类」最大值：libheif 1.23.0 的 Catch2 TEST_CASE = 217（主 N）＞ CTest add_test 39 = 测试目标 39 ＞ 测试源文件 41 中的可运行项；断言 4016 属另一单位只披露不并入。只按 ctest 口径申报会被判 rule4 少报"
