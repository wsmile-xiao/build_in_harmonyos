# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libheif-aom/1.23.0
homepage: "https://github.com/strukturag/libheif"

# 上游测试命令（父 tarball libheif 1.23.0 的 CTest 入口；本包构建未启用 BUILD_TESTING）
upstream_check_command: "ctest   # 需 -DBUILD_TESTING=ON，本包交付面不含上游测试目标"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游用例清点（rule4）：主 N 取「用例/注册类」候选口径的最大值，全部口径带单位
upstream_test_counts:
  unit: 217
  integration: 0
  other: 0
  total: 217
  basis: >-
    父 tarball（libheif 1.23.0，sha256 50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a）
    全量注册面。候选口径逐项读数：a) Catch2 TEST_CASE 注册数 = 217（tests/*.cc，
    取数 grep -rho 'TEST_CASE' tests/*.cc | wc -l —— 用例/注册类最大值，即主 N；
    TEST_CASE_METHOD/SCENARIO/SCENARIO_METHOD 各 0）；
    b) CTest add_test 注册数（全开关上限）= 39（tests/CMakeLists.txt 的 add_libheif_test/
    add_heifio_test 调用点）；c) 测试可执行目标（全开关上限）= 39（与 b 一一对应）；
    d) 测试源文件 = 41 个 .cc（含 main.cc/test_utils.cc 两个无 TEST_CASE 的公共文件）；
    e) 断言 REQUIRE( = 3994、CHECK( = 18、REQUIRE_FALSE/CHECK_FALSE( = 4，合计 4016 ——
    属**另一单位**，只披露、不并入 N。另有 GENERATE( 43 处（Catch2 运行期再展开）、SECTION( 5 处。
  in_surface_scope: "libheif/plugins/{decoder,encoder}_aom.cc（上游目标 heif-aomdec / heif-aomenc → libheif-aomdec.so / libheif-aomenc.so）"
  in_surface_executed: 0
  not_run: 217
  harmony_specific: 25

# 上游实际运行的测试程序（本包交付面内没有上游测试目标）
upstream_tests:
  - file: N/A
    source: libheif-1.23.0/tests
    description: >-
      本包交付面是上游树内的 aom（AV1）编解码后端插件（CMake 目标 heif-aomdec/heif-aomenc），
      上游 tests/ 下的 39 个测试目标不被 install()、不属交付面；上游把 BUILD_TESTING 默认置 ON，
      但启用它会额外要求 heifio 的 TIFF/JPEG/PNG/WEBP 探测与 x265/libde265/openjpeg 等
      本包未适配、未发布的解码/编码后端（R36），因此本包按 BUILD_TESTING=OFF 构建，
      217 项上游用例全部按 NOT_RUN 记账，逐项归因见 notes.md「上游测试清点」。
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(libheif REQUIRED) + target_link_libraries libheif::libheif（经 CMakeDeps 生成）"
    command: "cmake --configure"
  - file: test_package/test_libheif_aom.c
    description: >-
      25 项显式检查：宿主版本指纹（1.23.0）、heif_init、插件搜索目录来自
      LIBHEIF_PLUGIN_PATH、heif_have_decoder_for_format(AV1)==1 与
      heif_have_encoder_for_format(AV1)==1（证明交付的 libheif-aomdec.so 与
      libheif-aomenc.so 都被宿主装载并注册）、HEVC 解码/编码后端反证、
      端到端 AV1 编码（合成 YCbCr 4:2:0 图 → 内存 → 读回）与解码尺寸/像素容差校验、
      context/image 生命周期、heif_deinit
    command: "./test_libheif_aom"

# 测试断言总数 (test_libheif_aom.c 中 check() 调用数, 用于质量评估)
assertion_count: 25

# 适配后合计（与 PR 正文「适配后测试用例统计」表同源同单位）= 上游 217 + 鸿蒙特有 25
adapted_total: 242
