# conandata.yml — libheif-aom 1.23.0
#
# 主源 = 上游 libheif 1.23.0 官方 tag 归档（R39：官方源）。
# 本包是**同一 tarball 内的子模块**：aom（AV1）编解码后端插件，
# 源文件在树内 libheif/plugins/{decoder,encoder}_aom.{cc,h}，
# 由 libheif/plugins/CMakeLists.txt 的 plugin_compilation(aomdec/aomenc …) 生成
# CMake MODULE 目标 heif-aomdec / heif-aomenc → libheif-aomdec.so / libheif-aomenc.so。
# 版本号取父 tarball 版本（同族先例：libhwy_test 1.3.0 ← highway 1.3.0）。
#
# aom 本体 = 内树自包含构建的第二源（不是 Conan 依赖）：
#   libheif 树内**没有** aom 源码副本（只有 cmake/modules/FindAOM.cmake 与两个
#   plugins/*.cc），而 aom 在仓库与 ohpcd 制品仓都没有 Conan 配方——
#   archives/a/aom/3.9.1 只有 manifest.yaml/notes.md/patch（ARCHIVE-SPEC v2.0 元数据孤儿，
#   来源是 cmd-pkgs 的 tarball 渠道），`conan install --requires=aom/3.9.1 --build=never`
#   与 `conan download --only-recipe aom/3.9.1` 均失败。
#   因此按已合并先例 handbrake/1.11.2 的口径（"All 33 contribs (…, aom, svt-av1, …) are
#   built in-tree … so there are no Conan package dependencies (R36: nothing to publish
#   beforehand)"）走内树构建：本配方自己下官方 libaom 源码、先编静态 libaom.a，
#   再用 cache 变量把 FindAOM.cmake 的探测结果钉死。requirements() 为空。
#
# 两个 sha256 都是本任务设备实测下载后 sha256sum 计算值（非抄录）：
#   * libheif 1.23.0：与同族 libheif-libde265 / libheif-openjpeg 任务目录里的副本
#     三方独立比对一致（50ea4fbd…）；
#   * libaom 3.9.1：官方 GCS release 归档与官方 googlesource tag 归档
#     （https://aomedia.googlesource.com/aom/+archive/refs/tags/v3.9.1.tar.gz）
#     逐文件内容比对，1353 个文件的 per-file sha256 全等
#     （聚合 sha256 31a4baa21259e61643259973f83cf7fef018069b68fe3fc5fccdc514628d2ce5），
#     两个独立官方端点互证。

sources:
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"

aom:
  url: "https://storage.googleapis.com/aom-releases/libaom-3.9.1.tar.gz"
  sha256: "dba99fc1c28aaade28dda59821166b2fa91c06162d1bc99fde0ddaad7cecc50e"

# 无补丁：宿主 libheif 与内树 aom 都用**未修改的官方源码**构建。
#   * 宿主 libheif 的 OHOS 编译问题（libc++ 15 隐藏 std::ranges::all_of/find →
#     libheif/box.cc 编译失败）由配方 generate() 的编译期宏
#     _LIBCPP_ENABLE_EXPERIMENTAL 解决，不改源码（先例：archives/l/libpqxx/8.0.1、
#     archives/l/ladybug/0.18.2）；
#   * aom 侧用上游自己的 CMake 选项 AOM_TARGET_CPU=generic 关掉汇编，
#     无需平台补丁（同 archives/a/aom/3.9.1/notes.md 的设备实测结论）。
patches: []
