package: lest/1.37.0
homepage: "https://github.com/martinmoene/lest"

upstream_check_command: "ctest -L unittest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest -L unittest --output-on-failure"

upstream_tests:
  - file: test/test_lest.cpp
    source: lest-1.37.0/test/test_lest.cpp
    description: "Lest core tests across C++98, C++11, C++14 and C++17."
    command: "test_lest-cpp11 and standard variants"
    test_functions: 9
    assertion_failure_macros: 0
  - file: test/test_lest_basic.cpp
    source: lest-1.37.0/test/test_lest_basic.cpp
    description: "Basic assertion API test compiled in the C++11 variant."
    command: "test_lest_basic-cpp11"
    test_functions: 1
    assertion_failure_macros: 0
  - file: test/test_lest_decompose.cpp
    source: lest-1.37.0/test/test_lest_decompose.cpp
    description: "Expression decomposition API test compiled in the C++11 variant."
    command: "test_lest_decompose-cpp11"
    test_functions: 1
    assertion_failure_macros: 0
  - file: test/test_lest_cpp03.cpp
    source: lest-1.37.0/test/test_lest_cpp03.cpp
    description: "C++03-compatible syntax test compiled across supported standards."
    command: "test_lest_cpp03_*"
    test_functions: 4
    assertion_failure_macros: 0

test_package_tests:
  - file: test.cpp
    description: "Consumer calls lest::run with two real CASE/EXPECT tests."
    command: "./test_lest"

assertion_count: 2
