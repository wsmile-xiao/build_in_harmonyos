# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "1.82.0"
software: libgpr
status: built
build_system: cmake
build_date: "2026-09-30"

source:
  url: "https://github.com/grpc/grpc/archive/refs/tags/v1.82.0.tar.gz"
  sha256: "d6851f59b9c4edb3218d2659a3abf1138e5bb4d2871c9e89c9330ed71756ed0b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DgRPC_ABSL_PROVIDER=package"
    - "-DgRPC_CARES_PROVIDER=package"
    - "-DgRPC_PROTOBUF_PROVIDER=package"
    - "-DgRPC_RE2_PROVIDER=package"
    - "-DgRPC_SSL_PROVIDER=package"
    - "-DgRPC_ZLIB_PROVIDER=package"
    - "-DgRPC_BUILD_CODEGEN=OFF"
    - "-DgRPC_BUILD_TESTS=ON"
    - "-DgRPC_INSTALL=OFF"
    - "-DGPR_NO_PTHREAD_CANCEL=1"
    - "cmake --build --target gpr"
  dependencies:
    - "abseil-cpp/20260107.1  (runtime: gpr links 22 absl components)"
    - "protobuf/33.6          (configuration-time find_package only)"
    - "c-ares/1.34.6          (configuration-time find_package only)"
    - "re2/2024-04-01         (configuration-time find_package only)"
    - "openssl/3.5.6          (configuration-time find_package only)"
    - "zlib/1.3.1             (configuration-time find_package only)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-thd-pthread-cancel.patch"
  - "0002-abseil-cpp-cmake-alias.patch"
  - "0003-cares-cmake-target.patch"
  - "0004-ssl-cmake-target.patch"
  - "0005-tmpfile-tmpdir.patch"
  - "0006-zlib-cmake-target.patch"

knowledge_gained:
  - "grpc 1.82 的 gpr 目标只运行期依赖 abseil（22 个 absl 组件）；protobuf/c-ares/re2/openssl/zlib 仅为顶层 find_package 的配置期依赖，gpr 不取任何符号——拆分件可只声明 abseil 为运行期依赖。"
  - "gpr 的源码位置在 grpc 1.82 已从 src/core/lib/gpr/ 迁到 src/core/util/（config/ + util/），按旧路径找会 404；公开头仍是 include/grpc/impl/codegen/ + include/grpc/support/。"
  - "gpr 自己的上游单测（time_test/host_port_test/mpscq_test/string_test/sync_test...）链的是测试专用 grpc_test_util，会把完整 grpc 核心拉进来——拆分件只能跑链接闭包为 gpr+absl+gtest 的那批测试。"
  - "grpc 模块拆分件范式（承 libgrpc_unsecure）：gRPC_INSTALL=OFF + cmake --build --target 收敛闭包 + 手动 copy 产物；gRPC release tarball 的 third_party 子模块为空需按 pin commit 填充。"

module_split:
  upstream_project: grpc
  upstream_version: 1.82.0
  upstream_pr: "!6943 (grpc 1.70.0 主件) / libgrpc_unsecure 1.82.0 同批"
  split_targets:
    - gpr