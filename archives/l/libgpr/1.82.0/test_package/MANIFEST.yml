# test_package for libgpr 1.82.0
name: test_package
version: "1.0"
description: Consumer smoke test linking libgpr (gpr time/alloc/string/sync/cpu APIs)
test_targets:
  - test_package

upstream_tests_exist: true
upstream_test_total: 5267
upstream_test_count_method: "grpc 全仓 gtest TEST 宏静态计数（与同版本 libgrpc_unsecure/1.82.0 的申报口径一致）"
upstream_check_command: "cmake --build --target <gpr tests> && <each test binary>"
upstream_test_in_build: true
upstream_test_command: "conan create（build() 内 _run_upstream_tests 构建并执行）"

upstream_execution:
  channel: "aarch64 OHOS deliverable built by this recipe, executed via qemu-binfmt in the adaptation workdir"
