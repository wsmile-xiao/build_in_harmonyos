  programs: 15
  test_cases_run: 57
  test_cases_passed: 57
  test_cases_failed: 0
  pass_rate: "100% (57/57)"
  declared_total: 5267
  executed_scope: "gpr 模块相关：链接闭包为 gpr + absl + gtest 的全部上游单测"
  not_run_reason: "test/core/util 下其余 gpr 单测（time_test / host_port_test / mpscq_test / string_test / sync_test / time_util_test 等）的链接闭包含测试专用 grpc_test_util，会把完整 grpc 核心拉进来；该 helper 是 libgrpc_unsecure 拆分包的产物，不属于本包，故未在本包内构建。gRPC_BUILD_TESTS=ON 在全量构建时需要全部测试子模块，本包已按 grpc v1.82.0 的 pin commit 填充。"
  test_only_patches: []
  upstream_source_patches_note: "本包对上游源码应用 6 个 OHOS 可移植性补丁（0001 pthread_cancel / 0002-0004,0006 CMakeDeps 目标名桥接 / 0005 TMPDIR），未修改任何上游测试用例。"
  evidence: "tasks/libgpr-1.82.0-2026-09-30/logs/001-upstream-tests.log（逐程序 gtest 计数）"

upstream_tests:
  - file: test/core/util/
    source: "grpc-1.82.0.tar.gz: test/"
    description: "gpr 模块相关上游 gtest 程序（15 个：avl / common_closures / down_cast / endpoint_config / experiments / experiments_tag / memory_usage / notification / single_set_ptr / slice_string_helpers / status_flag / stream_quota / time / timer_list / useful）"
    command: "cmake --build --target <t> && ./<t>"