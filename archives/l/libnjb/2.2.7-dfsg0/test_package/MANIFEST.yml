# test_package/MANIFEST.yml
# libnjb 2.2.7-dfsg0 (upstream 2.2.7, Debian repack).

package: libnjb/2.2.7-dfsg0
homepage: https://libnjb.sourceforge.net/

upstream_tests_exist: false
upstream_test_audit: "no tests/ directory and no make check; the tarball ships examples/ that need a real Nomad Jukebox over libusb"
upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_libnjb.c
    description: "in-memory songid API: allocation, empty iterator, string frames, add/find by label, reset, second frame, destroy; plus the debug/unicode setters"
    command: "./libnjb_consumer"

test_files:
  - path: "test_package/test_libnjb.c"
    test_type: "R34"
    assertion_count: 10

test_package_test_count: 1
consumer_assertion_count: 10
assertion_count: 10
