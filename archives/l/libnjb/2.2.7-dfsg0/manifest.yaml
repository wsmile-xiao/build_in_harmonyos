software: libnjb
version: "2.2.7-dfsg0"
status: built
build_date: "2026-09-19"
build_system: autotools
conan_ref: "libnjb/2.2.7-dfsg0"

source:
  url: "https://deb.debian.org/debian/pool/main/libn/libnjb/libnjb_2.2.7~dfsg0.orig.tar.bz2"
  sha256: "84d4bd9fdb152b8dae9bccdf1dd89d8576b167ad7f5ff11ad966b7beea01a043"
  tar_format: tar.bz2

build:
  system: autotools
  build_command: "./configure --build=aarch64-unknown-linux-ohos --host=aarch64-unknown-linux-ohos --disable-cursesplay --disable-samples ac_cv_lib_usb_usb_control_msg=yes ac_cv_header_usb_h=yes ac_cv_func_malloc_0_nonnull=yes ac_cv_func_memcmp_working=yes ac_cv_func_lstat_dereferences_slashed_symlink=yes ac_cv_func_stat_empty_string_bug=no cross_compiling=yes && make -j1"
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-cursesplay"
    - "--disable-samples"
  dependencies:
    - "libusb-compat/0.1.7"
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "none（上游只有需要真实播放器的 examples/）"
  upstream_discovered: 0
  upstream_passed: 0
  upstream_failed: 0
  upstream_note: "无上游测试；硬件路径不可用"
  test_package_passed: 10
  test_package_failed: 0
  test_package_assertions: 10
  execution: "conan create rc=0 + 消费者 10 条断言（内存中的 songid API）"

test_passed: 10
test_failed: 0

patches_applied:
  - "0001-config-sub-ohos.patch（config.sub 补 linux-ohos*）"

knowledge_gained:
  - "libnjb 用的是 libusb 0.1 API（<usb.h>）→ Conan 侧依赖 libusb-compat/0.1.7（制品仓已发布）"
  - "自带 configure 的老 autotools 工程仍是 configure+make；config.sub 不认 OHOS 时按 aalib/libirman 的最小补丁补 linux-ohos*"
  - "老库的消费者测试要挑纯内存 API：libnjb 的 NJB_Songid_*（New/Addframe/Findframe/Reset/Destroy）无需播放器即可确定性验证，而 NJB_* 硬件接口无法在沙箱执行"
  - "configure 的可选依赖（curses/zlib）通过 --disable-cursesplay/--disable-samples 显式关掉，保证构建确定性"
  - "设备 /bin/sh 的 print 内建会让 libtool 2.4 选 ECHO='print -r --'，进而生成引号不闭合的 libtool（line ~350 语法错）；把 configure 的该赋值改为 printf 分支即可"
  - "AutotoolsToolchain 不注入依赖 -I/-L，需另加 AutotoolsDeps；依赖标志会使 configure 的运行探测失败，故传 cross_compiling=yes；AC_FUNC_* 交叉下判坏会引入未实现的 rpl_malloc 等，需用 ac_cv_func_* 覆盖"
  - "Conan 2 不把传递依赖的 cpp_info 交给下游消费者：若头文件 include 了依赖的头（libnjb.h→<usb.h>），需在 package_info 显式并入依赖的 include 绝对路径"
