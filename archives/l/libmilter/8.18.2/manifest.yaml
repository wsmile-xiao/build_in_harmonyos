# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "8.18.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# 构建系统类型（兼容字段）
build_system: sendmail-devtools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
