  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: sendmail-devtools

  # 配置选项列表（sendmail Build system 无 configure）
  configure_options: none

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-devtools-OS-HarmonyOS.patch"
  - "0002-libsm-strerror-musl-compat.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "sendmail 使用 Build 系统（非 autotools），平台配置通过 devtools/OS/{平台} 定义"
  - "musl libc 缺少 sys_errlist/sys_nerr，需要修改 strerror.c 使用标准 strerror() 函数"
  - "HarmonyOS 平台配置基于 Linux，但需添加 HASSTRERROR 和 ERRLIST_PREDEFINED 宏"
  - "静态库 libmilter.a 无需 ELF 签名（仅动态库和可执行文件需要）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/libmilter-8.18.2.orig
