package: libmilter/8.18.2
homepage: "https://www.proofpoint.com/us/sendmail-open-source/"

upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_test_note: >-
  libmilter has no standalone upstream test suite: in the sendmail source
  tree, libmilter/ ships only library sources (main.c engine.c listener.c
  worker.c handler.c comm.c smfi.c signal.c sm_gethost.c monitor.c) and
  docs plus an example.c sample filter; there is no test/ directory or
  make-check target for it (the tree-level `make check` covers sendmail
  itself, not libmilter). test_package therefore provides the API smoke
  validation: smfi_version/smfi_register/smfi_setconn/smfi_opensocket
  (real AF_UNIX bind+listen), per R28/R34 conventions.

test_package_tests:
  - file: test_milter.c
    description: "Call smfi_version, setters, smfi_register, smfi_setconn and smfi_opensocket (real unix socket bind+listen; socket dir probed at runtime among sandbox candidates, EPERM-only dirs degrade to SKIP per platform limitation)"
    command: "./test_milter"

assertion_count: 7
