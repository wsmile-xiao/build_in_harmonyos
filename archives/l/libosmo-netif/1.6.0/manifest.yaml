software: libosmo-netif
version: "1.6.0"
status: built
build_date: "2026-09-19"

source:
  url: "https://downloads.osmocom.org/releases/libosmo-netif/libosmo-netif-1.6.0.tar.bz2"
  sha256: "60ff389b388c2fbcbaca31fad97fdceb7c99032ca5a1b4f365ffcb54f5cd1eed"
  tar_format: tar.bz2

build:
  system: autotools
  build_system: autotools
  configure_options:
    - "--disable-libsctp"
    - "--disable-doxygen"
  dependencies:
    - libosmocore/1.11.0
  cc: clang 15.0.4

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-include-osmocom-netif-sctp.h.patch"
  - "0005-src-stream_srv.c.patch"
  - "0006-src-stream_cli.c.patch"

knowledge_gained:
  - "上游 --disable-libsctp 路径在 stream_srv.c 侧守卫缺失（cli 侧有），需补 HAVE_LIBSCTP 守卫回退单地址 API"
  - "sctp.h 前向声明 SCTP enum 参数类型：gcc 容忍 clang 拒绝，无 SCTP 平台须守卫"
