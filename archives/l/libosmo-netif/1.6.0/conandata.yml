# conandata.yml — libosmo-netif 1.6.0

sources:
  # 镜像列表形态：官方源第一+镜像第二，conan 2 原生按序多源尝试——
  # CI Pre-download 段 curl 缺失回退 conan 下载器后仍有回退能力（见 #3135）
  url:
    - "https://downloads.osmocom.org/releases/libosmo-netif/libosmo-netif-1.6.0.tar.bz2"
    - "https://mirrors.nju.edu.cn/osmocom/releases/libosmo-netif/libosmo-netif-1.6.0.tar.bz2"
  sha256: "60ff389b388c2fbcbaca31fad97fdceb7c99032ca5a1b4f365ffcb54f5cd1eed"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS host triplet; drop umask 077 for the temporary directory (HMDFS does not support it)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept the linux-ohos kernel/OS pair so configure can canonicalize the target triple"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: drop umask 077 around the config.status temporary directory (HMDFS limitation)"
    patch_type: "portability"
  - patch_file: "patches/0004-include-osmocom-netif-sctp.h.patch"
    patch_description: "sctp.h: guard the SCTP enum forward declarations with HAVE_LIBSCTP (clang rejects incomplete enum parameter types that gcc only warns about)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-stream_srv.c.patch"
    patch_description: "stream_srv.c: guard the SCTP io-ops branch and multiaddr socket-name calls with HAVE_LIBSCTP, falling back to single-address APIs (mirrors the existing upstream guards in stream_cli.c)"
    patch_type: "portability"
  - patch_file: "patches/0006-src-stream_cli.c.patch"
    patch_description: "stream_cli.c: guard the multiaddr sockname call with HAVE_LIBSCTP, falling back to osmo_sock_get_name_buf"
    patch_type: "portability"
