software: libxklavier
display: "libxklavier"
description: "XKB 键盘配置库，为 X11 键盘布局管理提供 API"
category: x11
homepage: "https://gitlab.freedesktop.org/archived/libxklavier"
license: LGPL-2.1+
build_system: autotools

ohos_adaptation:
  key_points:
    - "XKB 后端依赖 libxkbfile（制品仓未发布，配方内内嵌构建并静态链接进 libxklavier.so）"
    - "libxi 为可选依赖（XInput 设备发现），制品仓未发布，通过 configure 自动回退裁剪"
    - "gobject-introspection / vala 为可选依赖，--disable-introspection / --disable-vala 裁剪"
    - "iso-codes 为数据包（仅 pkg-config 元数据），配方内生成最小 iso-codes.pc 满足 configure"
    - "configure 需 --build/--host=aarch64-unknown-linux-gnu，并处理 OHOS shebang/umask"
  common_dependencies:
    - libx11
    - glib
    - libxml2
    - gettext
    - libxkbfile

versions:
  "5.4":
    status: built
    build_date: "2026-08-26"
    conan_ref: "libxklavier/5.4"
