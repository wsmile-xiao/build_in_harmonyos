software: libxklavier
version: "5.4"
status: published
build_date: "2026-08-27"
conan_ref: "libxklavier/5.4"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/libx/libxklavier/libxklavier_5.4.orig.tar.xz"
  sha256: "a30b302f3490e6423d21844dae4411a38e9c9d4f5196df571bc8276a03a53e63"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-introspection"
    - "--disable-vala"
    - "--disable-gtk-doc"
    - "--with-xkb-base=/usr/share/X11/xkb"
  dependencies:
    - "libx11/1.8.13"
    - "glib/2.88.0.1"
    - "libxml2/2.15.3.1"
    - "gettext/0.22.5.1 (tool_requires: msgfmt/autopoint)"
    - "libxkbfile/1.1.3 (配方内内嵌静态构建，非 conan require)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "XKB 后端硬依赖 libxkbfile（XkbRF_* 规则解析），缺失时 xkl_xkb_init 返回 -1，XKB 后端不初始化"
  - "libxkbfile 未发布且系统未提供 → 配方内内嵌构建（静态 libxkbfile.a）并经 CFLAGS/LDFLAGS/PKG_CONFIG_PATH 引用，同时把 .a 装进包内供静态消费者链接"
  - "libxklavier release tarball 缺 configure → 用 conan 工具链（autoconf/automake/libtool/gettext/pkgconf tool_requires）autoreconf -fi 自举；宿主 automake 损坏不可用"
  - "autoreconf 需要 GOBJECT_INTROSPECTION_CHECK/VAPIGEN_CHECK/GTK_DOC_CHECK 宏与 doc/gtk-doc.make → 配方内写 m4 stub（定义 --disable-introspection/--disable-vala/--disable-gtk-doc 选项）+ 空 gtk-doc.make"
  - "libxkbfile configure 需要 kbproto.pc（已并入 xorgproto 未单独发布）→ 生成指向 xorgproto include 的薄 .pc；libxklavier configure 需要 iso-codes.pc → 生成最小 .pc"
  - "libxi 可选：configure PKG_CHECK_MODULES 自动回退 have_xinput=no，可裁剪"
  - "gobject-introspection/vala 可选：--disable-introspection/--disable-vala 裁剪"
  - "OHOS 下 configure 需 umask 077→022、bash shebang 替换、--build/--host=aarch64-unknown-linux-gnu"
  - "上游 make check（test_config/test_monitor）需要 X server，OHOS 无 X → 用 test_package 调 xkl_engine_get_type/xkl_engine_get_instance(NULL) 等无 X 依赖 API 验证"
