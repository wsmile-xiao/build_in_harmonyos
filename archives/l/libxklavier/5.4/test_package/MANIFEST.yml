# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游 libxklavier 5.4 自带测试（tests/Makefile.am 的 check_PROGRAMS）：
#   make check 会构建并运行 test_config / test_monitor；两者都需要
#   XOpenDisplay（X server），OHOS 无 X，运行时必然 "Could not open display"
#   退出，故 conanfile.py 不在 build() 里跑 make check，改用 test_package
#   直接调用库 API 做等价消费者验证（无 X 依赖的路径）。

package: libxklavier/5.4
homepage: "https://gitlab.freedesktop.org/archived/libxklavier"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_config.c
    source: libxklavier-5.4/tests/test_config.c
    description: "配置读写/列表/搜索测试；需要 X server (XOpenDisplay)，OHOS 无 X 无法运行"
    command: "./test_config -al"
  - file: tests/test_monitor.c
    source: libxklavier-5.4/tests/test_monitor.c
    description: "键盘状态监控测试；需要 X server (XOpenDisplay)，OHOS 无 X 无法运行"
    command: "./test_monitor"
  - file: tests/test_gi.py
    source: libxklavier-5.4/tests/test_gi.py
    description: "GObject-Introspection Python 测试；introspection 已裁剪(--disable-introspection)，不适用"
    command: "python3 test_gi.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 xkl_engine_get_type/xkl_engine_get_instance/xkl_config_item_new/xkl_config_item_set_name/xkl_config_rec_new/xkl_set_debug_level API"
    command: "./test_libxklavier"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
