# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 约定：下面所有 ctest 命令的 cwd 都是 CMake 构建目录（conanfile.py 的 build()
# 在该目录内调用，等价于 ctest --test-dir <build folder>）。

package: libproperties/1.1.2
homepage: https://github.com/tinyhubs/libproperties

# 上游测试命令 (上游 CMakeLists 用 file(GLOB test/*.properties) 注册用例，
# 仓库里没有 ctest/Makefile 之外的测试入口)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# N 的候选数法清点（四类口径不混用；采用框架注册数，逐项归因差额）
test_count_candidates:
  source_macro_count:
    value: 0
    command: "grep -nE 'TEST_CASE|ADD_TEST|BOOST_AUTO_TEST|catch2|gtest' <src>/*.c <src>/CMakeLists.txt"
    note: "上游不使用任何测试框架宏，唯一注册入口是 CMakeLists.txt 里的 add_test()"
  framework_registered_count:
    value: 2
    command: "ctest -N"
    note: "本 PR 采用值，输出 Total Tests: 2。add_test() 由 file(GLOB test/*.properties) 逐文件注册，test/ 下恰有 1.properties、2.properties 两个文件"
  assertion_count:
    value: 11
    command: "grep -cE '^\\s*ASSERT\\(' <src>/properties_test.c"
    note: "断言口径，不同计量单位不混入用例表：11 条全部是上述 2 个注册用例内部的运行时断言，随用例全量执行并通过；库侧 properties.c 另有 6 条仅在内部不变量被破坏时才触发的 ASSERT（11 与 6 叠加会使本口径自身不唯一，故不能作 N）"
  consumer_assertion_count:
    value: 5
    command: "本 test_package 的断言（test_api.c 3 条 + test_soname.c 2 条）"
    note: "消费者口径，单列于「鸿蒙特有测试」行，不进上游分母"
  adopted_n: 2

# 上游实际运行的测试程序（框架注册数 = 2，由 add_test() 按 test/*.properties 逐文件注册；
# 两个用例共用执行器 properties_test.c，解析结果与 *.j.expect 逐行比对）
upstream_tests:
  - file: test/1.properties
    source: libproperties-1.1.2.zip/test/1.properties
    description: "ctest 注册用例 1.properties：注释/空白剥离/转义字符/折行等 32 行期望输出"
    command: "ctest -R '^1.properties$' --output-on-failure"
  - file: test/2.properties
    source: libproperties-1.1.2.zip/test/2.properties
    description: "ctest 注册用例 2.properties：只有 value 没有 key 的空 key 场景（期望 []=[hh2]）"
    command: "ctest -R '^2.properties$' --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_api.c
    description: "消费者测试：链接安装后的 libproperties，用 properties_source_string_read 解析并断言 3 条 entry 与 greeting 值"
    command: "./test_libproperties_api"
  - file: test_soname.c
    description: "鸿蒙特有测试：dlopen 裸名 libproperties.so.1 断言 DT_SONAME 与版本化文件名（缺 SONAME flag 时该文件不存在）"
    command: "./test_libproperties_soname"

# 测试断言总数 (近似值, 用于质量评估) —— 本值只统计 test_package 消费者断言(3+2)。
# 上游 properties_test.c 另有 11 条运行时 ASSERT，属不同口径，见 notes.md 计数表。
assertion_count: 5
