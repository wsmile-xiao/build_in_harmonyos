# 版本级 manifest
# 文件位置: archives/l/libproperties/1.1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.2"

# 软件名
software: "libproperties"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tinyhubs/libproperties/archive/1.1.2.zip"

  # 源码校验和
  sha256: "9ee3903648f8de6c9e2d71fd778721844cc9881dcc2afe2c66cdb2d1cb86b39a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  # 与 conanfile.py generate() 注入的 CMakeToolchain 变量一一对应
  # （CMAKE_BUILD_TYPE 由 profile 提供，不在这里重复）
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DLIBPROPERTIES_TEST=ON"
    - "-DLIBPROPERTIES_INSTALL=ON"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMAKE_SYSTEM_NAME=HarmonyOS 无平台模块：CMAKE_BUILD_RPATH 静默无效，构建树内 ctest 加载共享库失败（Error loading shared library），测试命令注入 LD_LIBRARY_PATH 并同时补 SONAME flag" # knowledge_ref: DRAFT-E736-harmonyos-cmake-missing-platform-rpath-ctest-ld-library-path
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
