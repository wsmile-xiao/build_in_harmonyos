# 软件级 manifest — libproperties
# 遵循 ARCHIVE-SPEC v3.0

software: libproperties
display: "libproperties"
description: "纯 C 的 .properties 属性文件解析库（流式回调解析，零外部依赖）"
category: data
homepage: "https://github.com/tinyhubs/libproperties"
license: "Apache-2.0"
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "CMAKE_SYSTEM_NAME=HarmonyOS 无 Platform 模块 → 必须在 generate() 注入 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,，否则缺 DT_SONAME 且 CMake 不生成版本化文件名（W3 L5a 拦截）"
    - "同一平台模块缺失使 rpath 旗标未定义 → CMAKE_BUILD_RPATH 静默 no-op（readelf 的 RPATH/RUNPATH 计数恒为 0），构建树内 ctest 报 Error loading shared library；build() 跑测试前把构建目录前置进 LD_LIBRARY_PATH（作用域仅限该测试命令）"
    - "test_package 必须用 self.run(<绝对路径二进制>, env=conanrun) 直跑；cmake.test() 会被 W3 L0d 判 stub_test_method"
    - "上游测试由 file(GLOB test/*.properties) 逐文件 add_test 注册，N=2；断言数 11 属另一口径，不混入用例表"
    - '上游 install(EXPORT) 的 ${PROJECTNAME} 未定义，配置文件落在 lib/cmake/ 而非 lib/cmake/libproperties/，CMake 搜索面仍可命中，不改上游文件'
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.1.2":
    status: built
    build_date: "2026-09-25"
