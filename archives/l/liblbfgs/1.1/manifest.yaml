knowledge:
  - "The true liblbfgs 1.1 archive is https://www.chokkan.org/software/dist/liblbfgs-1.1.tar.gz and extracts without a top-level directory."
  - "liblbfgs 1.1 ships raw C sources only, so the recipe generates a small CMake project instead of invoking autotools."
  - "The upstream 1.1 sample source is compile-only in this adaptation because it has a known NULL gradient-buffer bug after optimization."
