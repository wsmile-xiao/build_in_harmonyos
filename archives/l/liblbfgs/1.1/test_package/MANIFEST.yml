package: liblbfgs/1.1
homepage: "https://www.chokkan.org/software/liblbfgs/"
upstream_check_command: "ctest -R test_liblbfgs_build"
upstream_test_in_build: true
upstream_test_command: "ctest -R test_liblbfgs_build"
upstream_tests:
  - file: src/main.c
    source: liblbfgs-1.1/src/main.c
    description: "Upstream sample is compiled but not executed because liblbfgs 1.1 sample calls evaluate() with a NULL gradient buffer after optimization."
    command: "cmake --build . --target liblbfgs_sample"
  - file: test_liblbfgs_build.c
    source: generated by recipe
    description: "Build-time smoke test for the raw liblbfgs 1.1 C API and optimizer convergence."
    command: "ctest -R test_liblbfgs_build"
test_package_tests:
  - file: test.c
    description: "Consumer C smoke test covering parameter initialization, callback execution, lbfgs() convergence, and result accuracy with the 1.1 API."
    command: "test_liblbfgs"
assertion_count: 8
