package: liblbfgs/1.10
homepage: "https://github.com/chokkan/liblbfgs"
# 上游 v1.10 没有自带测试套件：Makefile.am 仅为 SUBDIRS = lib sample，无 make check / check 目标。
# 因此上游测试为 0；功能验证由 test_package 的消费者测试（main.c 真实调用 lbfgs()）完成。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
test_package_tests:
  - file: main.c
    description: "Consumer test: calls lbfgs() to minimize a convex function and verifies L-BFGS converges (LBFGS_SUCCESS)"
    command: "./liblbfgs_smoke"
assertion_count: 1
