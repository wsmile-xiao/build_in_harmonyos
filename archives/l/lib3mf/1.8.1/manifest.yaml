version: "1.8.1"
software: lib3mf
build_system: cmake
status: built
build_date: "2026-09-14"

source:
  url: "https://github.com/3MFConsortium/lib3mf/archive/refs/tags/v1.8.1.tar.gz"
  sha256: "207dd142c9ca86a4fb1a4b2baadbdf579f35e03f9b8bf5c02dae027da5ae9d17"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DUSE_INCLUDED_ZLIB=OFF"
    - "-DUSE_INCLUDED_LIBZIP=OFF"
    - "-DLIB3MF_TESTS=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
  dependencies:
    - libzip/1.11.4
    - zlib/1.3.1.1
  cc: clang (ohos-sdk)

patches_applied:
  - "0001-cmake-modern-and-external-deps.patch"
  - "0002-uuid-ossp-bridge.patch"
  - "0003-system-include-paths.patch"
  - "0004-libzip19-source-callback-compat.patch"

knowledge_gained:
  - "上游 USE_INCLUDED_*=OFF 无外部依赖链接逻辑，需 patch CMakeLists 加 find_package+target_link_libraries"
  - "lib3mf 1.8.1 的 zip source 回调用老式 zip_source_make_command_bitmap，对 libzip>=1.9 的 zip_open_from_source 报 ZIP_ER_OPNOTSUPP(28)，须改用官方 ZIP_SOURCE_SUPPORTS_SEEKABLE 宏 + 未知命令返回 0"
  - "ossp-uuid 1.6.2 运行时 PRNG/MD5 引擎破坏堆内存（V4 路径），lib3mf 改为内置 /dev/urandom RFC4122 v4 生成"
  - "ohos.toolchain.cmake 交叉编译需显式 CMAKE_RANLIB 指向 SDK 外的 llvm-ranlib（SDK llvm/bin 无 ranlib）"
  - "test() 本机运行 OHOS 二进制需显式 LD_LIBRARY_PATH=/system/lib64 提供 libc++_shared.so"
