# conandata.yml — lib3mf 1.8.1

sources:
  url:
    - "https://gh-proxy.com/https://github.com/3MFConsortium/lib3mf/archive/refs/tags/v1.8.1.tar.gz"
    - "https://github.com/3MFConsortium/lib3mf/archive/refs/tags/v1.8.1.tar.gz"
  sha256: "207dd142c9ca86a4fb1a4b2baadbdf579f35e03f9b8bf5c02dae027da5ae9d17"

patches:
  - patch_file: patches/0001-cmake-modern-and-external-deps.patch
    patch_description: "Modernize CMake (min 3.5, drop CMP0054 OLD); add external zlib/libzip find_package+link when USE_INCLUDED_*=OFF; skip libuuid lookup on OHOS (UUID is self-contained)"
    patch_type: "portability"
  - patch_file: patches/0002-uuid-ossp-bridge.patch
    patch_description: "Replace util-linux uuid API with self-contained RFC 4122 v4 generation from /dev/urandom under __OHOS__ (ossp-uuid 1.6.2 PRNG/MD5 engine corrupts the heap at runtime)"
    patch_type: "portability"
  - patch_file: patches/0003-system-include-paths.patch
    patch_description: "Replace bundled Libraries/libzip/zip.h and Libraries/zlib/zlib.h includes with system <zip.h>/<zlib.h>"
    patch_type: "portability"
  - patch_file: patches/0004-libzip19-source-callback-compat.patch
    patch_description: "Fix zip source callback for libzip >= 1.9: return official ZIP_SOURCE_SUPPORTS_SEEKABLE mask and 0 for unhandled commands (old hand-rolled bitmap triggers ZIP_ER_OPNOTSUPP/zip_err=28 on zip_open_from_source)"
    patch_type: "portability"
