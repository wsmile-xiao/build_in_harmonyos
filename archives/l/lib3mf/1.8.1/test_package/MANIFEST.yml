# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lib3mf/1.8.1
homepage: https://github.com/3MFConsortium/lib3mf

# 上游测试：UnitTests/C_Interface (Test_CInterface) + UnitTests/CPP (UnitTestsCPP)
# 两个 add_test 注册目标，依赖 googletest 子模块（release tarball 不含内容，需补齐）
# 交叉编译环境无法在 CI 运行 aarch64 二进制，本地探索已验证两个测试目标完整编译链接
upstream_test_in_build: true
upstream_tests:
  - file: UnitTests/C_Interface/CMakeLists.txt
    description: "Test_CInterface: C 接口测试套件（AllTests/Attachments/BeamLattice/Production/ProgressCallback/ReaderStrictMode/Extensions/OPC_Issues/ReadWrite/Slice/Textures/Thumbnails 12 个源文件）"
    command: "./Test_CInterface"
  - file: UnitTests/CPP/CMakeLists.txt
    description: "UnitTestsCPP: 内部类测试套件（AllTests/Geometry/Mesh/MeshFormat_STL/Model/ModelFactory/ZIP 7 个源文件）"
    command: "./UnitTestsCPP"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "真实 3MF 模型往返：建模型→addvertex/addtriangle→addbuilditem→写 3MF 文件→读回→顶点/三角形数校验（覆盖 uuid/zip/zlib/xml 四层依赖）"
    command: "./test_probe"
assertion_count: 18
