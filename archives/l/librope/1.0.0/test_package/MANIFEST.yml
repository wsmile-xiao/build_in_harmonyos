# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: librope/1.0.0
homepage: "https://github.com/josephg/librope"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# librope 的 Makefile 没有 check 目标，测试入口是 `make tests` 后运行 ./tests
upstream_check_command: "make tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "./tests"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/tests.c
    source: librope-1.0.0/test/tests.c
    description: "rope 核心功能测试（insert/delete/round-trip）+ 随机化模糊测试，wchar 测试默认禁用"
    command: "./tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：insert + delete + create_cstr 回读校验"
    command: "./test_librope"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100