version: "1.5.10.1.1"
software: "libepoxy"
status: built
build_date: "2026-09-23"
conan_ref: "libepoxy/1.5.10.1.1"
build_system: "meson"
source:
  url: "https://github.com/anholt/libepoxy/archive/refs/tags/1.5.10.tar.gz"
  tar_format: tar.gz
build:
  system: meson
  configure_options:
    - "-Dglx=yes"
    - "-Degl=yes"
    - "-Dx11=true"
    - "-Dtests=true"
  dependencies:
    - xorgproto/2025.1
    - libx11/6.4.0
    - mesa/24.3.4.1.1
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-python3-gen-dispatch.patch"
knowledge_gained:
  - "1.5.10.1.1：在 1.5.10.1（glx=yes）基础上启用 EGL（egl=yes），生成 epoxy/egl.h + egl 分发表，epoxy.pc 声明 epoxy_has_egl=1，供 gtk4 重配后编译期 HAVE_EGL 定义、gsk GL 走 mesa 24.3.4.1.1 EGL/GLES2 surfaceless 客户端栈收复主体用例"
  - "EGL 头文件（EGL/eglplatform.h 等）由 mesa/24.3.4.1.1 提供（transitive_headers）；mesa 的 egl.pc/glesv1_cm.pc/glesv2.pc 复制到生成目录并修正 prefix（glu 9.0.3 osmesa.pc 同款）"
  - "1.5.10.1（对照）：egl=no，仅 GLX + x11（gtk X11 后端用），epoxy.pc 无 epoxy_has_egl 声明"
