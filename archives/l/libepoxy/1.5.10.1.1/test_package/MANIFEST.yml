# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: libepoxy/1.5.10.1.1
homepage: https://github.com/anholt/libepoxy

# 上游测试情况：1.5.10.1.1 启用 egl=yes + tests=true，上游 meson test 套件
# 已实例化（egl_* 用例），实际运行结论见版本 notes.md 双口径台账
upstream_test_in_build: true
upstream_tests:
  - suite: "meson test"
    description: "test/meson.build 全量声明：header_guards / misc_defines / khronos_typedefs / gl_version / egl_has_extension_nocontext / egl_epoxy_api / egl_gles1_without_glx / egl_gles2_without_glx / egl_gl / glx_*（OHOS 无窗口系统下 egl_common.c XOpenDisplay skip=77 属上游原生 skip）"

# test_package 自带测试（消费者视角：扩展字符串解析 + 头闭包编译；OHOS 无 GL 库，
# epoxy_gl_version() 会 dlopen 失败 abort，故用纯字符串函数 epoxy_extension_in_string 断言）
test_package_tests:
  - file: test_epoxy.c
    description: "编译 #include <epoxy/gl.h> + epoxy_extension_in_string() 扩展存在/不存在双向断言"
    command: "./epoxy-test"

assertion_count: 2
