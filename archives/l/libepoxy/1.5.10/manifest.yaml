software: libepoxy
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.10"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-04-30"

# 预编译包信息
package:
  name: libepoxy-1.5.10-ohos-aarch64.tar.gz
  size: 2447241
  sha256: "pending"
  arch: aarch64

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/anholt/libepoxy/archive/refs/tags/1.5.10.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dglx=no"
    - "-Degl=no"
    - "-Dx11=false"
    - "-Dtests=false"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 文件系统不支持直接执行 Python 脚本（shebang 权限问题），需要使用 python3 显式调用"
  - "meson 构建的 build.ninja 文件中的脚本命令需要修改为 python3 <script> 形式"
  - "OpenHarmony 上没有 OpenGL/EGL 库，需要禁用 GLX/EGL/X11 支持: -Dglx=no -Degl=no -Dx11=false"
  - "HMDFS 不支持 ln -sf 覆盖，需要使用 rm -f && ln -s 模式"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"


