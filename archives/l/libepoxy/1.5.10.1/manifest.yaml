version: "1.5.10.1"
software: "libepoxy"
status: built
build_date: "2026-09-08"
conan_ref: "libepoxy/1.5.10.1"
build_system: "meson"
source:
  url: "https://github.com/anholt/libepoxy/archive/refs/tags/1.5.10.tar.gz"
  tar_format: tar.gz
build:
  system: meson
  configure_options:
    - "-Dglx=yes"
    - "-Degl=no"
    - "-Dx11=true"
    - "-Dtests=false"
  dependencies:
    - xorgproto/2025.1
    - libx11/6.4.0
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-python3-gen-dispatch.patch"
knowledge_gained:
  - "1.5.10.1：在 1.5.10 基础上启用 GLX + x11（生成 epoxy/glx.h），供 gtk X11 后端（gdkglcontext-x11.h include <epoxy/glx.h>）使用（R37 版本后缀）"
  - "制品仓 1.5.10 在 OHOS 下 glx=no/x11=false，无 epoxy/glx.h；本版本为 gtk X11 适配所需"
