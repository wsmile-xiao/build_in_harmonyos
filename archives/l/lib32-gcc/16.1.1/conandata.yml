# lib32-gcc 16.1.1 — Conan sources
#
# Package version is 16.1.1 (the task/recipe name cannot be changed), but the
# real upstream source is GCC 16.1.0: upstream never published a 16.1.1 release
# tarball (only 16.1.0 and 16.2.0 exist on gcc.gnu.org). See notes.md for the
# rationale. The SHA256 below is computed locally from the official
# gcc-16.1.0.tar.xz and matches the upstream sha512.sum entry.
sources:
  "16.1.1":
    gcc:
      # Official, versioned release archive URL. The tarball is GCC 16.1.0 even
      # though the package version is 16.1.1.
      #
      # Ordered URL list (one sha256 below; every entry byte-identical): the OHOS
      # CI worker runs with restricted egress and gcc.gnu.org is NOT in the CI
      # mirror-rewrite table (ci/conan/build_and_test.sh get_mirrors only covers
      # ftp.gnu.org / ftpmirror.gnu.org / github / gnome / kernel.org / xorg), so
      # a lone gcc.gnu.org URL is attempted exactly once and fails: PR #10643
      # build #59560 died with "Could not download GCC source from
      # https://gcc.gnu.org/...: <urlopen error timed out>".  Conan's download()
      # walks this list on failure: CN GNU mirrors first (fast, already proven
      # reachable by the earlier lib32-gcc builds), then the Sourceware mirror
      # documented as worker-reachable by the merged gcc-snapshot/20260705
      # recipe, then the official host last.  All entries were sha256-verified
      # byte-identical on 2026-09-24.
      url:
        - "https://mirrors.tuna.tsinghua.edu.cn/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz"
        - "https://mirrors.ustc.edu.cn/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz"
        - "https://mirrors.aliyun.com/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz"
        - "https://ftp.mirrorservice.org/sites/sourceware.org/pub/gcc/releases/gcc-16.1.0/gcc-16.1.0.tar.xz"
        - "https://gcc.gnu.org/pub/gcc/releases/gcc-16.1.0/gcc-16.1.0.tar.xz"
      sha256: "50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79"
    # In-tree bundled prerequisites, exactly the versions selected by GCC 16.1.0's
    # contrib/download_prerequisites (gmp 6.3.0, mpfr 4.2.2, mpc 1.3.1). isl and
    # gettext are NOT listed: isl is disabled via --without-isl and gettext is not
    # needed because --disable-nls.
    # gmp/mpfr/mpc: the GCC infrastructure copies of these releases are also
    # published on the GNU mirror network (gmp/gmp-6.3.0.tar.bz2 etc.) and on the
    # Sourceware mirror, all byte-identical to the sha256 below, so the bundled
    # prerequisites stay fetchable when gcc.gnu.org is unreachable.
    gmp:
      url:
        - "https://mirrors.tuna.tsinghua.edu.cn/gnu/gmp/gmp-6.3.0.tar.bz2"
        - "https://mirrors.ustc.edu.cn/gnu/gmp/gmp-6.3.0.tar.bz2"
        - "https://mirrors.aliyun.com/gnu/gmp/gmp-6.3.0.tar.bz2"
        - "https://ftp.mirrorservice.org/sites/sourceware.org/pub/gcc/infrastructure/gmp-6.3.0.tar.bz2"
        - "https://gcc.gnu.org/pub/gcc/infrastructure/gmp-6.3.0.tar.bz2"
      sha256: "ac28211a7cfb609bae2e2c8d6058d66c8fe96434f740cf6fe2e47b000d1c20cb"
    mpfr:
      url:
        - "https://mirrors.tuna.tsinghua.edu.cn/gnu/mpfr/mpfr-4.2.2.tar.bz2"
        - "https://mirrors.ustc.edu.cn/gnu/mpfr/mpfr-4.2.2.tar.bz2"
        - "https://mirrors.aliyun.com/gnu/mpfr/mpfr-4.2.2.tar.bz2"
        - "https://ftp.mirrorservice.org/sites/sourceware.org/pub/gcc/infrastructure/mpfr-4.2.2.tar.bz2"
        - "https://gcc.gnu.org/pub/gcc/infrastructure/mpfr-4.2.2.tar.bz2"
      sha256: "9ad62c7dc910303cd384ff8f1f4767a655124980bb6d8650fe62c815a231bb7b"
    mpc:
      url:
        - "https://mirrors.tuna.tsinghua.edu.cn/gnu/mpc/mpc-1.3.1.tar.gz"
        - "https://mirrors.ustc.edu.cn/gnu/mpc/mpc-1.3.1.tar.gz"
        - "https://mirrors.aliyun.com/gnu/mpc/mpc-1.3.1.tar.gz"
        - "https://ftp.mirrorservice.org/sites/sourceware.org/pub/gcc/infrastructure/mpc-1.3.1.tar.gz"
        - "https://gcc.gnu.org/pub/gcc/infrastructure/mpc-1.3.1.tar.gz"
      sha256: "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"
    # Recipe-built GNU ARM assembler source (OHOS only; see _build_target_gas
    # in conanfile.py and notes.md §9).  The device binutils has no ARM
    # backend and the OHOS spawn rules forbid the SDK clang from serving as
    # xgcc's target assembler, so the recipe compiles its own
    # arm-unknown-linux-ohos gas.  Same tarball/sha256 as the ohpcd
    # binutils/2.46.0 recipe.  URL list: GNU official mirror network in the
    # same order as the merged ohpcd binutils/2.46.0 conandata.yml (TUNA ->
    # USTC -> Aliyun -> ftp.gnu.org), with the primary sourceware.org site
    # appended last: CI run #50178 hit "Connection broken: IncompleteRead"
    # at 93% of the sourceware.org download, so the fast CN GNU mirrors go
    # first and Conan's download() walks the list on failure; every URL
    # serves the byte-identical tarball (single sha256 below).
    binutils:
      url:
        - "https://mirrors.tuna.tsinghua.edu.cn/gnu/binutils/binutils-2.46.0.tar.gz"
        - "https://mirrors.ustc.edu.cn/gnu/binutils/binutils-2.46.0.tar.gz"
        - "https://mirrors.aliyun.com/gnu/binutils/binutils-2.46.0.tar.gz"
        - "https://ftp.gnu.org/gnu/binutils/binutils-2.46.0.tar.gz"
        - "https://sourceware.org/pub/binutils/releases/binutils-2.46.0.tar.gz"
      sha256: "8608fe44ab7de645f6ad0a898313b75338842490d609adb85c9fb2827c376af2"
