software: lib32-gcc
task_library: "lib32-gcc@16.1.1"
conan_ref: "lib32-gcc/16.1.1"
version: "16.1.1"
status: built
build_date: "2026-09-17"
build_system: autotools-custom
difficulty: "C-candidate"
adaptation_path: "Path A native toolchain packaging plus Path B knowledge-extension and Path C complex-toolchain candidates"
source_language: "C/C++"

source:
  # NOTE: package version is 16.1.1 (task/recipe name, cannot be changed), but the
  # real upstream release is GCC 16.1.0. gcc.gnu.org never published a 16.1.1
  # tarball (only 16.1.0 and 16.2.0 exist). See notes.md for the rationale.
  url: "https://gcc.gnu.org/pub/gcc/releases/gcc-16.1.0/gcc-16.1.0.tar.xz"
  sha256: "50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79"
  tar_format: tar.xz

build:
  system: autotools-custom
  configure_options:
    - "--enable-languages=c"
    - "--disable-bootstrap"
    - "--disable-multilib"
    - "--disable-lto"
    - "--disable-decimal-float on OHOS"
    - "--disable-threads on OHOS (OHOS libc omits pthread_cancel; C frontend + static libgcc only)"
    - "--disable-assembly on OHOS (build image lacks m4; bundled GMP uses generic C)"
    - "--enable-host-pie on OHOS"
    - "--without-isl"
    - "--with-sysroot=<ohos-sdk-sysroot>"
  dependencies:
    - "bundled gmp/6.3.0"
    - "bundled mpfr/4.2.2"
    - "bundled mpc/1.3.1"
    - "build tool flex/2.6.4 for gengtype-lex.cc generation"
  cc: clang
  cxx: clang++

source_transforms:
  - "Map linux-ohos to GCC's musl target configuration (arm-linux-ohos treated as a musl-derived OHOS target)"
  - "Inject config.sub compatibility for arm-linux-ohos / arm-unknown-linux-ohos twin so config.sub canonicalizes to arm-unknown-linux-ohos"
  - "Whitelist arm*-*-linux-ohos* in gcc/config.gcc's 'Unsupported targets list' (upstream blacklists arm*-*-linux* and only releases eabi ARM targets; our triplet has no 'eabi' substring)"
  - "Append ohos.h to the ARM Linux EABI tm_file (arm/linux-eabi.h) in gcc/config.gcc so the 32-bit ARM target picks up __OHOS__ builtins inline"
  - "Replace Autoconf umask 077 with umask 022 for HMDFS"
  - "Apply source transforms before Conan copies the source tree to avoid immediate HMDFS rewrite/execute failures"
  - "Run the large source-tree transform in a short-lived Python process so its memory and HMDFS state are released before configure"
  - "Use gcc_build_env.sh instead of Conan's reserved conanbuild.sh name to prevent recursive self-sourcing and SIGSEGV"
  - "Run configure, make and install through an explicit shell with an unlimited stack because HarmonyOS shells otherwise crash on GCC's generated scripts"
  - "Override CI's LLVM IR assembler with the device's real GNU as and ld for GCC HOST (aarch64) objects"
  - "Drive TARGET (arm-linux-ohos) assembly in the libgcc build with a recipe-built RUNPATH-free GNU ARM gas because the device GNU binutils has no ARM backend and the OHOS spawn rules forbid SDK clang as the target assembler; AS_FOR_TARGET points at the gas compiled from the binutils-2.46.0 source in conandata.yml (_build_target_gas), LD_FOR_TARGET at the device GNU ld (armelf_linux_eabi); the same recipe-built gas ships as the packaged bin/as"
  - "Relax signing temporary directories from 0700 to 0775 for HMDFS compatibility"
  - "Use a bounded four-way GNU Make pipe jobserver on OHOS because HMDFS does not support the default FIFO jobserver reliably"
  - "Disable decimal floating-point runtime on the minimal OHOS C/libgcc target and remove inherited debug flags from target libgcc compilation"
  - "Keep GCC host generators as PIE on OHOS to avoid LLD AArch64 copy-relocation alignment failures"
  - "Derive GCC's sysroot from the resolved OHOS SDK Clang path or the HNP SDK layout so fixincludes can find native headers"
  - "Add -B<sysroot>/usr/lib/arm-linux-ohos/ and -L<sysroot>/usr/lib/arm-linux-ohos to the cross-compiler driver so xgcc finds the 32-bit startfiles"
  - "Strip Clang availability attributes (GCC 16.1.0 cannot parse __availability__(...)) via -D__availability__(...)= on the host CFLAGS"

knowledge_gained:
  - "lib32-gcc = an aarch64-hosted cross-compiler that EMITS 32-bit ARM code (arm-linux-ohos); the OHOS PC SDK ships a full arm-linux-ohos sysroot (crt1.o/crti.o/crtn.o/libc.a/libm.a)"
  - "Upstream GCC 16.1.0 has NO arm/linux.h; the ARM Linux EABI case references arm/linux-eabi.h (config.gcc:1506), so the OHOS header must be injected after arm/linux-eabi.h, not arm/linux.h"
  - "Device GNU binutils 2.45 has an AArch64 backend but NO ARM backend; the recipe builds its own RUNPATH-free GNU ARM gas from the binutils-2.46.0 source declared in conandata.yml (_build_target_gas, installed as xgcc's target-tools/as during the build and as bin/as in the package), and collect2 resolves the device GNU ld (armelf_linux_eabi emulation) from the system partition. The OHOS spawn rules forbid build-tree ELFs from execve'ing shell scripts or RUNPATH-bearing SDK tools, so a clang-based target assembler is not viable (PR CI #49850)"
  - "GCC 16.1.0 official release directory publishes only sha512.sum (no sha256 sidecar); the recipe consumes the computed SHA256 and the official SHA512 was verified byte-for-byte"
  - "GCC 16.1.0 download_prerequisites selects gmp 6.3.0, mpfr 4.2.2, mpc 1.3.1 (isl 0.24 / gettext 0.22 are disabled via --without-isl / --disable-nls)"
  - "GCC host generators and output programs require HarmonyOS ELF signing"
  - "CONFIG_SHELL alone does not replace the initial interpreter or raise its stack limit; invoke the resolved shell explicitly after ulimit -s unlimited"
  - "On this device, Conan generate() must default to /data/service/hnp/bin/clang and /data/service/hnp/bin/clang++ because bare clang is not on PATH"
  - "Conan tool_requires does not guarantee flex reaches PATH inside this recipe; generate() must inject the flex bin dir and FLEX variable explicitly"
  - "Cross-compiler torture tests cannot execute ARM binaries on the aarch64 host; the recipe verifies compile+link feasibility via llvm-readelf -h (ELF validation) instead of running. The upstream count must still be declared as the FULL inventory of the suite the recipe drives (gcc.c-torture/execute = 1685 sources), with the executed subset (100) reported separately -- declaring only the executed subset is judged as under-reporting (review rule 4)"

verification:
  local_static_checks: pass
  note: "Source transforms verified against the real GCC 16.1.0 tree: config.gcc musl/ohos cases and arm/linux-eabi.h ohos.h injection match; config.sub triplet injection confirmed; gcc-16.1.0.tar.xz SHA512 matches the official sha512.sum byte-for-byte and xz -t passes. conandata.yml/sha256, manifest.yaml, notes.md and the test_package consumer end-to-end flow (preprocess -> compile TU-A/TU-B -> assemble -> link -> inspect ARM32/OHOS artifacts) are written. The full conan create completed on the real device (run ci12, exit 0, torture subset 100/100 compile+link) and was re-validated by a clean-rebuild conan-verify (G0-G4 all PASS); finish W3 local CI passed (L0/L1/L2) and wrote .ci-result.json."

# ============================================================
# 测试统计（口径：上游 N 取全家底，N' 取本轮实际执行数，见 notes.md §18）
# ============================================================
tests:
  upstream_suite: "gcc/testsuite/gcc.c-torture/execute (the suite this recipe drives)"
  upstream_tests: 1685
  upstream_test_inventory_command: "find gcc/testsuite/gcc.c-torture/execute -name '*.c' | wc -l  ->  1685"
  upstream_tests_executed: 100
  upstream_test_execution_scope: "50 sources x {-O0, -O2 -fno-strict-aliasing} = 100 compile+link cases"
  upstream_test_pass_rate: "100/100 (100%)"
  upstream_test_reduction_reason: "1585 of the 1685 upstream torture sources were not executed. Concrete technical reasons: (1) the target artifact is a 32-bit ARM (arm-linux-ohos) binary and the build host is aarch64, so no torture program can be executed -- the executed 100 use the documented compile+link+ELF-validation口径; (2) the full DejaGNU torture driver has not been ported to an OHOS runner (the recipe drives the suite with its own bounded runner, reading each source's dg-additional-options); (3) the package-level CI build window (default 3600s; a 7200s entry has been split out to the infrastructure channel documented in notes.md §17/§18) is already dominated by the in-recipe GNU ARM gas build (~25min) plus all-gcc + all-target-libgcc; sweeping all 1685 sources (3370 compile+link cases) cannot fit. The 1585 unexecuted sources are declared as not executed; no pass is claimed for them."
  added_consumer_scenarios: 2
  added_consumer_assertions: 31
  harmonyos_specific_tests: 2
  harmonyos_specific_tests_description: "Consumer case 1 = the complete end-to-end flow driven by the installed package: preprocess (__OHOS__ visible via gcc/config/ohos.h) -> compile translation unit A -> compile translation unit B -> assemble with the packaged GNU ARM gas -> link with the device GNU ld -> inspect the produced ARM32/OHOS artifacts (ELF32/ARM, Type REL/EXEC, .ARM.attributes, non-zero entry point, cross-TU symbol resolution of main/consumer_compute/consumer_target_abi). Consumer case 2 = the target ABI program compiled with -DEXPECT_OHOS=1, where __OHOS__ missing or a non-32-bit ABI fails the compile itself."
  test_results:
    type: functional (cross-toolchain consumer end-to-end flow)
    total: 2
    passed: 2
    failed: 0
    skipped: 0
    status: passed
  result: "passed (test_package 消费者端到端流程 31 项断言 + 上游 torture 子集 100/100 compile+link；conan create ci12 与 conan-verify 干净重建双次通过)"

path_b_candidate:
  classification: "candidate; final B-class decision is subject to review"
  rationale: "The package is a self-hosting C/C++ cross-toolchain (aarch64 host -> arm-linux-ohos) with bundled GMP/MPFR/MPC, generated GCC host-tool chain, OHOS ELF signing, HMDFS shell/temporary-directory constraints, an isolated flex tool requirement, ARM Clang target wrappers, and a consumer test that cross-compiles and validates an OHOS ARM ELF."
  evidence_scope:
    - "source URL, language, checksum, and bundled prerequisite versions are recorded"
    - "source(), configure, build, package, and test_package boundaries are documented"
    - "independent flex/2.6.4 dependency boundary is documented and reused"
    - "fresh-build failure signatures and corrective transforms are recorded in the GCC-specific knowledge drafts"
  knowledge_drafts:
    - "knowledge/drafts/DRAFT-lib32-gcc-16.1.1-ohos-arm-cross-toolchain.md"
    - "knowledge/drafts/DRAFT-lib32-gcc-16.1.1-ohos-arm-cross-toolchain.kv"

path_c_candidate:
  classification: "candidate; final C-class decision is subject to review"
  qualifying_criteria:
    - criterion: 3
      evidence: "GCC contains target-specific assembler integration and a generated host-tool architecture; the OHOS build must coordinate GNU as/ld (host aarch64), ARM Clang/LLD (target arm), AArch64 PIE linking, generated ELF signing, target sysroot, and compiler -B search order."
    - criterion: 4
      evidence: "The package combines bundled GMP/MPFR/MPC, the independent flex/2.6.4 generator dependency, m4 and multiple GCC generator/runtime components; a full GCC cross-compiler build is a long-running high-cost verification (Path C budget)."
  difficulty_evidence:
    ci_rounds: "8 platform CI rounds (6 failed / 2 passed; documented failing runs #49850, #50178, #50179, #50342, final passing runs #50379 and #50506 after the merge-conflict rebase) plus 10 local full-device iterations (ci3-ci12)"
    dead_end_categories: 7
    dead_ends:
      - "upstream config.gcc 'Unsupported targets list' blacklist rejects arm-unknown-linux-ohos before the musl/ohos case (notes.md section 5)"
      - "structural target-assembler gap: device binutils 2.45 is AArch64-only and xgcc resolves 'as' via the -B search order, so libgcc configure dies at the object-file suffix probe (notes.md sections 5/13)"
      - "HMOS spawn-control tri-laws: untrusted-chain shebang spawn = EACCES, RUNPATH ELF = silent exit 1, user-area symlink execve = EACCES, patchelf = EPERM (notes.md section 9)"
      - "HMDFS symlink open() interception for untrusted processes (libgcc soft-fp Permission denied, notes.md section 10)"
      - "collect2 name-x-prefix double search hijacked by the in-tree collect-ld shebang wrapper, compounded by the self-built ld lacking armelf_linux_eabi emulation (notes.md sections 11/12)"
      - "CI infrastructure trio: binutils source download broken at 93% (IncompleteRead), HMDFS umask 0700 temp dir unwritable, conan source() settings prohibition (notes.md sections 13-15)"
      - "3600s build clock exhausted by the ~25min in-recipe gas build; resolved through the package-level 7200s timeout channel. The entry itself is an infrastructure change (ci/config/build_timeouts.txt) and is therefore NOT part of this software PR — see notes.md section 18 for the split and the exact diff requested via a separate infrastructure PR."
  boundary:
    - "The C candidate claim is based on complex assembler/toolchain architecture and verification cost, not on closed-source binaries or a private compiler toolchain."
    - "The recipe deliberately limits the supported product to the C frontend, non-bootstrap, non-LTO, non-multilib configuration; this limitation is recorded rather than presented as full GCC matrix coverage."
