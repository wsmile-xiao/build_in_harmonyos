# 版本级 manifest — libiio 0.25
# 文件位置: archives/l/libiio/0.25/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.25"

# 软件名
software: "libiio"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/analogdevicesinc/libiio/archive/refs/tags/v0.25.tar.gz"

  # 源码校验和
  sha256: "21972599a3c143ab1f98002ad2b3f28f4aff927fde5f677478311cd4e517730c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（后端裁剪策略详见 notes.md）
  configure_options:
    - "-DWITH_NETWORK_BACKEND=OFF"
    - "-DWITH_IIOD=OFF"
    - "-DWITH_USB_BACKEND=OFF"
    - "-DWITH_SERIAL_BACKEND=OFF"
    - "-DWITH_XML_BACKEND=ON"
    - "-DWITH_ZSTD=OFF"
    - "-DWITH_TESTS=ON"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_DOC=OFF"
    - "-DWITH_MAN=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libxml2/2.15.3

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零 patch：HarmonyOS 下 local/iiod 后端被上游 IF(MATCHES "Linux") 块天然挡掉）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMAKE_SYSTEM_NAME=HarmonyOS 不匹配上游 MATCHES \"Linux\" → local/iiod 后端 option 不定义，整块跳过，零 patch 实现后端裁剪"
  - "OHOS SDK lld 依赖 libxml2.so.16 (E120/E132)：GNU ld (-fuse-ld=/data/service/hnp/bin/ld) + add_rpath_link 规避"
  - "上游无 install(EXPORT)，test_package 需用 PkgConfigDeps 消费 libiio.pc"
