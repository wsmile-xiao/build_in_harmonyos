# test_package/MANIFEST.yml — libiio 0.25
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libiio/0.25
homepage: "https://github.com/analogdevicesinc/libiio"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build build --target help (libiio 上游 CMake 无 ctest 测试目标; 工具程序在 tests/)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cmake --build . && ctest -N (上游未注册 CTest 用例; 工具程序为交互式 CLI, 需真实 IIO 设备)"

# 上游实际运行的测试程序
# libiio 0.25 上游 tests/ 目录构建 6 个工具程序 (iio_info/iio_attr/iio_genxml/
# iio_readdev/iio_reg/iio_writedev), 无 CTest 注册用例。所有工具都要求一个
# 可用的 IIO context (真实 /sys/bus/iio 设备或运行中的 iiod), OHOS PC 无
# IIO 子系统 (/sys/bus/iio 不存在), 无法提供。本地已执行 iio_info/iio_genxml
# 等二进制验证链接+加载+运行时 graceful 失败路径, 详见 notes.md。
upstream_tests:
  - file: tests/iio_info.c
    source: libiio-0.25.tar.gz/tests/iio_info.c
    description: "列出指定 context 的 IIO 设备树; 需真实 IIO 设备或 iiod"
    command: "./iio_info [uri]"
  - file: tests/iio_genxml.c
    source: libiio-0.25.tar.gz/tests/iio_genxml.c
    description: "从设备生成 XML 描述; 需真实 IIO 设备"
    command: "./iio_genxml [uri]"
  - file: tests/iio_attr.c
    source: libiio-0.25.tar.gz/tests/iio_attr.c
    description: "读写设备属性; 需真实 IIO 设备"
    command: "./iio_attr -d <dev> <attr>"
  - file: tests/iio_readdev.c
    source: libiio-0.25.tar.gz/tests/iio_readdev.c
    description: "从设备读缓冲数据; 需真实 IIO 设备"
    command: "./iio_readdev <dev>"
  - file: tests/iio_reg.c
    source: libiio-0.25.tar.gz/tests/iio_reg.c
    description: "读写设备寄存器; 需真实 IIO 设备"
    command: "./iio_reg <dev> <reg>"
  - file: tests/iio_writedev.c
    source: libiio-0.25.tar.gz/tests/iio_writedev.c
    description: "向设备写缓冲数据; 需真实 IIO 设备"
    command: "./iio_writedev <dev>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_iio.c
    description: "真实调用 iio_library_get_version/iio_create_xml_context_mem/设备枚举 API, 内存 XML context 全链路断言 (R34)"
    command: "ctest --output-on-failure (test_iio)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
