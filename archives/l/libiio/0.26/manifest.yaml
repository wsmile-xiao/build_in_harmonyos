software: libiio
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.26/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.26"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-04-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/analogdevicesinc/libiio/archive/refs/tags/v0.26.tar.gz"

  # 源码校验和
  sha256: "fb445fb860ef1248759f45d4273a4eff360534480ec87af64c6b8db3b99be7e5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DWITH_TESTS=OFF"
    - "-DWITH_USB_BACKEND=OFF"
    - "-DWITH_XML_BACKEND=OFF"
    - "-DWITH_SERIAL_BACKEND=OFF"
    - "-DWITH_NETWORK_BACKEND=OFF"
    - "-DWITH_LOCAL_BACKEND=OFF"
    - "-DWITH_IIOD=OFF"
    - "-DWITH_MAN=OFF"
    - "-DWITH_DOC=OFF"
    - "-DINSTALL_UDEV_RULE=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
