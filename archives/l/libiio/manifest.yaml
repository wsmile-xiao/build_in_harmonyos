# 软件级 manifest — libiio
# 文件位置: archives/l/libiio/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: libiio
display: "libiio"
description: "Analog Devices Linux Industrial I/O (IIO) 子系统接口库及命令行工具"

category: library

homepage: "https://github.com/analogdevicesinc/libiio"
license: LGPL-2.1-or-later

build_system: cmake

ohos_adaptation:
  key_points:
    - "CMAKE_SYSTEM_NAME=HarmonyOS 下 WITH_LOCAL_BACKEND/WITH_IIOD option 在 IF(MATCHES \"Linux\") 块内不定义, local 后端整块自动跳过, 无需 patch"
    - "禁用 NETWORK/IIOD/USB/SERIAL/ZSTD 后端绕开 avahi/libusb/libaio/zstd 依赖, XML 后端保留 (libxml2)"
    - "pthread 在 OHOS 属 libc 内建 (sysroot 有 libpthread.a stub), find_library 可正常解析"
    - "OHOS SDK lld 依赖 libxml2.so.16 (E120/E132), 用 GNU ld + add_rpath_link 规避"
  common_dependencies:
    - libxml2

versions:
  "0.25":
    status: built
    build_date: 2026-09-05
