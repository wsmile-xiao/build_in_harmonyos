version: "2.1.12-stable"
status: built
build_date: "2026-04-21"

source:
  url: "https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DEVENT__DISABLE_OPENSSL=ON"
    - "-DCMAKE_C_FLAGS=-fPIC -O2"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

knowledge_gained:
  - "libevent测试套件在HarmonyOS上部分失败(simpleclose/evbuffer相关)，核心功能可用"
  - "推荐使用CMake构建，避免autotools configure的临时目录权限问题"
  - "config.guess需更新以识别HarmonyOS"
  - "OpenSSL支持可选，系统缺少开发文件时可禁用"
