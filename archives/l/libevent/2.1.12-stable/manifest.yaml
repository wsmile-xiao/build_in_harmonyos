software: libevent
version: 2.1.12-stable
status: success
build_system: cmake
created_at: 2026-04-21
configure_options:
  - -DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local
  - -DCMAKE_BUILD_TYPE=Release
  - -DEVENT__DISABLE_OPENSSL=ON
  - -DCMAKE_C_FLAGS=-fPIC -O2
  - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
patches_applied:
  - 0001-config.guess.patch
  - 0002-config.sub.patch
build_log: logs/build.log
source_url: https://github.com/libevent/libevent/releases/download/release-2.1.12-stable/libevent-2.1.12-stable.tar.gz

knowledge_gained:
  - type: platform_limitation
    category: L1
    content: libevent 测试套件在 HarmonyOS 上部分失败：simpleclose 相关测试（epoll 事件通知机制差异）、evbuffer/add_file 相关测试（mmap 限制）、文件描述符耗尽（EMFILE）
    impact: 核心功能可用，事件循环正常工作
  - type: build_system_choice
    category: L2
    content: libevent 支持 CMake 和 autotools，在 HarmonyOS 上推荐使用 CMake 构建，避免 autotools configure 的临时目录权限问题
  - type: config_guess_update
    category: L1
    content: libevent 2.1.12-stable 的 build-aux/config.guess (2020-01-01) 无法识别 HarmonyOS，需更新为支持 HarmonyOS 的版本（如 pcre-8.45 的 config.guess）
    files_modified:
      - build-aux/config.guess
      - build-aux/config.sub
  - type: optional_dependency
    category: L2
    content: OpenSSL 支持可选，系统预装 OpenSSL 缺少开发文件，可用 --disable-openssl（autotools）或 -DEVENT__DISABLE_OPENSSL=ON（CMake）禁用
