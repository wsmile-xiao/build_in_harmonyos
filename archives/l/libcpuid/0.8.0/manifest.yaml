software: libcpuid
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/anrieff/libcpuid/archive/refs/tags/v0.8.0.tar.gz"

  # 源码校验和
  sha256: "a5fe37d79bda121cbdf385ae3f6fa621da6a3102aa609400a718a4b8b82ed8aa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0003-libcpuid-cpuid_main.c.patch"
  - "0004-libcpuid-recog_arm.c.patch"
  - "0005-libcpuid-rdtsc.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "cmake不识别OHOS为UNIX/Linux，需手动添加_GNU_SOURCE和HAVE_GETAUXVAL条件"
  - "使用-DCMAKE_SYSTEM_NAME=Linux让cmake正确处理版本化.so和RPATH"
  - "HarmonyOS musl libc需要_GNU_SOURCE才能暴露cpu_set_t/sched_getaffinity等API"
  - "libcpuid在ARM64上可通过getauxval/HWCAP_CPUID检测CPU信息"
  - "cpuid_get_raw_data()未清零结构体导致ARM架构误判，需添加raw_data_t_constructor"
  - "cpuid_identify_arm()不设置num_cores/num_logical_cpus，需添加cpuid_get_total_cpus()调用"
  - "cpu_clock_by_os()仅查找x86的cpu MHz字段，需添加ARM BogoMIPS和sysfs cpufreq检测"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libcpuid-0.8.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libcpuid-0.8.0.work
