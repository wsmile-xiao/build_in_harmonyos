software: libcpuid
category: system
description: "A small C library for x86/ARM CPU detection and feature identification"
homepage: "https://github.com/anrieff/libcpuid"
license: BSD-2-Clause

versions:
  "0.8.0":
    status: published
    build_date: "2026-06-01"
    build_system: cmake
    patches_count: 3
    notes:
      - "3 functional patches required: ARM detection fixes (raw_data_t_constructor, num_cores/num_logical_cpus, sysfs+BogoMIPS clock)"
      - "No build-system patches needed: -DCMAKE_SYSTEM_NAME=Linux satisfies getauxval/_GNU_SOURCE conditions automatically"
      - "Recommended API on ARM: cpu_identify_all() + cpuid_get_all_raw_data()"
      - "Do NOT use LIBCPUID_DISABLE_DEPRECATED in client code (ABI mismatch with library)"
      - "Must use -DCMAKE_SYSTEM_NAME=Linux for proper .so versioning"
      - "ARM limitations: brand_str/code_name/technology='unknown', cache sizes return -1/0"
