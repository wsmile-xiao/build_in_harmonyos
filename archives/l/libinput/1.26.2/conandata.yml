sources:
  "1.26.2":
    # gitlab.freedesktop.org 官方 archive（与 accountsservice/libevdev 同源策略）
    url: "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.26.2/libinput-1.26.2.tar.gz"
    sha256: "5c1c4150f217fea1db2d1fd88e2607b2f1928cfde65c34da65a9f24dcfd69464"
    tar_format: tar.gz
patches:
  "1.26.2":
    - patch_file: "patches/0001-ohos-libc-portability.patch"
      patch_type: "portability"
      patch_description: >-
        OHOS 的 musl libc 缺失两处 glibc/BSD 遗留接口，均为**语义等价替换**
        （无平台 ifdef，同一份代码在 glibc 上同样成立）：
        ① `rindex()` 是 strrchr() 的 BSD 别名，musl 不提供 →
           改为 POSIX 的 `strrchr()`（src/util-strings.c:249）；
        ② `program_invocation_short_name` 是 glibc 扩展，musl 不提供 →
           别名到 musl 提供的 BSD `__progname`（语义一致，均为不含路径的
           程序名），并在文件内自行 extern（该符号不在任何标准头里声明）。
           使用点：tools/libinput-record.c、tools/ptraccel-debug.c。
      patch_source: "https://gitlab.freedesktop.org/libinput/libinput"
