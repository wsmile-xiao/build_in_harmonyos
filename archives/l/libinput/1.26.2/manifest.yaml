# 版本级 manifest — libinput 1.26.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.26.2"
software: libinput

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-09-24"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # gitlab.freedesktop.org 官方 archive（与 accountsservice / libevdev 同源策略）
  url: "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.26.2/libinput-1.26.2.tar.gz"
  upstream_url: "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.26.2/libinput-1.26.2.tar.gz"
  # 实测下载 sha256
  sha256: "5c1c4150f217fea1db2d1fd88e2607b2f1928cfde65c34da65a9f24dcfd69464"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson

  configure_options:
    - "-Ddefault_library=shared"
    - "-Dlibwacom=false"
    - "-Ddebug-gui=false"
    - "-Dtests=false"
    - "-Dinstall-tests=false"
    - "-Ddocumentation=false"
    # 必须显式指定：Conan 的 MesonToolchain 默认把 libexecdir 设成 bindir
    # （conan/tools/meson/toolchain.py:358），会让上游的「主命令 bin/libinput
    # （文件）」与「子工具 libexec/libinput/（目录）」撞车，install 报
    # "Destination ... already exists and is not a file"。
    - "-Dlibexecdir=libexec"

  # 编译依赖（格式: name/version）
  dependencies:
    - libevdev/1.13.7
    - mtdev/1.1.7
    # 提供 libudev（配方内 pkg_config_name=libudev）。
    # 注意该包 package_type=application，Conan 会默认其 headers/libs=False
    # 并丢弃 cpp_info，故本配方在 requires() 上显式声明
    # headers=True, libs=True, transitive_headers=True, transitive_libs=True。
    - eudev/3.2.14

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-ohos-libc-portability.patch"
  # 两处语义等价替换（无平台 ifdef，glibc 上同样成立）：
  #   ① rindex()（BSD 别名）→ strrchr()（POSIX），src/util-strings.c:249
  #   ② program_invocation_short_name（glibc 扩展）→ musl 的 __progname，
  #      tools/libinput-record.c 与 tools/ptraccel-debug.c

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ohpcd 无独立 libudev 包；eudev/3.2.14 的配方声明 pkg_config_name=libudev，可直接满足 meson 的 dependency('libudev')——不必自写 stub（main 上 1.26.0 的失败正是自写 stub 所致）"
  - "eudev 的 package_type=application 会让 Conan 把该依赖的 traits 默认成 headers=False/libs=False 并丢弃其 cpp_info（requires.py:217-221）；在 requires() 上显式声明 headers=True, libs=True 即可覆盖（set_if_none 语义）"
  - "libinput.h 公开头直接 #include <libudev.h>，故 libudev 提供者必须 transitive_headers=True"
  - "Conan 的 MesonToolchain 把 libexecdir 硬编码成 bindir（toolchain.py:358）；上游若同时安装 bin/<同名>（文件）与 libexec/<同名>/（目录）就会撞车，须显式 -Dlibexecdir=libexec"
  - "meson install 会原地改写 ELF 的 RUNPATH（等长 XXX 覆盖），使链接期嵌入的 .codesign 签名失效；加载器以空原因报 'Error loading shared library'。修法：package() 内对所有 ELF 递归重新签名（llvm-objcopy --remove-section .codesign + binary-sign-tool sign）"
  - "libwacom 未发布 ohpcd，须 -Dlibwacom=false；上游对此有 no-op fallback（meson.build:161-166）"
  - "上游 litest 测试套件硬依赖 /dev/uinput 创建虚拟设备，本环境 EACCES 不可访问，故 -Dtests=false 并如实申报未运行"
