software: libinput
name: libinput
description: Input device handling library for Wayland compositors and X.Org
category: input
license: MIT
website: https://gitlab.freedesktop.org/libinput/libinput

versions:
  - version: "1.26.0"
    status: published
    build_date: "2026-05-30"
    notes: |
      - 成功编译 libinput 1.26.0
      - 创建了 libudev stub（libudev.so.0, libudev.h）
      - 修复了 OpenHarmony 平台兼容性问题
    source:
      url: "https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.26.0/libinput-1.26.0.tar.gz"
      tar_format: tar.gz
    build:
      system: meson
      dependencies:
        - libevdev/1.13.3
        - mtdev/1.1.7
        - libudev/stub
    patches_applied:
      - "util-strings.c: rindex → strrchr"
      - "ptraccel-debug.c: program_invocation_short_name → hardcoded"
      - "libinput-record.c: program_invocation_short_name → hardcoded"
    provides:
      - libinput.so.10 (1.2M)
      - libinput tools (debug-events, list-devices, record, etc.)