# 版本级 manifest — lite (lite-xl) 2.1.8
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1.8"
software: "lite"

# 编译状态：published | built | failed | archived
# W3 已在真实环境通过 conan create（全量从源码构建 + test_package 实质运行 lite-xl 二进制），
# 但未走 CI release 流水线 upload，按 R29 标 built（verify 通过未 upload），待 finish/CI 提升。
status: built

# 编译日期（YYYY-MM-DD）——真实 conan create 验证通过日
build_date: "2026-08-17"
build_system: meson

# W3 真实验证记录（2026-08-17，本机 /data/service/hnp/bin 工具链）
verify:
  # 命令：cd archives/l/lite/2.1.8 && export PATH=/data/service/hnp/bin:$PATH && \
  #   conan create . -pr:h=ohos-aarch64 -pr:b=ohos-aarch64 --build=missing
  conan_create: passed
  conan_create_exit: 0
  test_package: passed   # 真实运行 bin/lite-xl（SDL dummy + $LITE_USERDIR/init.lua），stdout 出现 LITE_XL_TEST_OK，退出码 0
  main_build: "从源码全量编译（14 个编译目标 + 链接 src/lite-xl）+ meson install（bin/lite-xl + share/lite-xl）"
  archiver_fix: "test_package/conanfile.py generate() 补 _inject_meson_archiver（llvm-ar/ranlib 全路径注入 native file），否则 test_package meson configure 报 Unknown linker llvm-ar/ar"
  elf_signed: true   # .codesign 段已写入（binary-sign-tool）

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（R39 官方源）
  url: "https://github.com/lite-xl/lite-xl/archive/refs/tags/v2.1.8.tar.gz"

  # 源码校验和 —— 已实测：对官方 GitHub tarball 计算 sha256，与本地
  # builds/lite-2.1.8.tar.gz 及 .orig/.tarball-sha256 记录一致。
  sha256: "fcaffb946bc60583369cb040d533a4ac18075a6d474d49a2a5ff4bf87e2e9a10"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: meson

  configure_options:
    - "-Dwrap_mode=nodownload"
    - "-Duse_system_lua=true"
    - "-Ddefault_library=static"
    - "-Dc_std=gnu11"

  # 编译依赖列表（格式: name/version）—— 与 conanfile.py requirements() 一致
  dependencies:
    - "sdl3/3.4.8"        # src/meson.build 硬编码 dependency('sdl3', static: true)，无 sdl2 回退
    - "freetype/2.14.3"   # pkg-config 名 freetype2
    - "lua/5.4.8"         # pkg-config 名 lua-5.4 + lua5.4/lua 别名（use_system_lua=true 遍历）
    - "pcre2/10.45.1"     # pkg-config 名 libpcre2-8
    # agg 不是依赖：已核实 subprojects/ 仅 freetype2.wrap/lua.wrap/pcre2.wrap，无 agg 引用

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []
# 无需补丁：全部依赖经 pkg-config/conan 提供，wrap_mode=nodownload。

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "lite-xl 2.1.8 用 Meson 构建，产物为 bin/lite-xl 可执行文件 + share/lite-xl 数据（R38：需 software 级 commands.json）"
  - "src/meson.build 硬编码 sdl_dep = dependency('sdl3', static: true)，**无 SDL2 回退**；subprojects/ 仅 freetype2.wrap/lua.wrap/pcre2.wrap，**无 agg**（旧配方 sdl2 + agg 假设已纠正）"
  - "sdl3/3.4.8 conan 配方由协作者并行补全（archives/s/sdl3/3.4.8/ 有 OHOS 适配归档：status built、G0-G4 pass、4 个 OHOS 补丁）；本配方 requires 已指向 sdl3/3.4.8，若配方未就绪需 W0 复核"
  - "Lua 走 use_system_lua=true（源码 meson_options 选项，默认 false→wrap 需下载）：遍历 lua5.4/lua-5.4/lua，conan lua/5.4.8 的 .pc 名为 lua-5.4，generate() 补 lua5.4.pc/lua.pc 别名覆盖全部探测名"
  - "OHOS Meson 需注入 ar/ranlib 全路径到 conan_meson_native.ini（沿用 dav1d/fontconfig 模式）"
  - "应用包可执行文件需 binary-sign-tool 签名（OHOS XPM，dav1d 实证）"
  - "test_package 真实测试方式：lite-xl 2.1.8 无 --command 参数、core.log 不写 stdout，改为构造 $LITE_USERDIR/init.lua（print 标记 + os.exit(0)）驱动真实启动链路"
