# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求此文件存在）
package: lite/2.1.8
homepage: "https://lite-xl.com/"

# lite-xl 是 GUI 文本编辑器，上游无 conan 可运行的测试套件
# （meson 无 check 目标可离线跑；真实功能验证由 test_package 完成）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: N/A
    source: N/A
    description: "lite-xl 是 GUI 编辑器（Meson application），上游无独立离线测试套件"
    command: "N/A"

# test_package 自带测试（消费者视角：实质运行 lite-xl 二进制）
# 方式：构造临时 $LITE_USERDIR/init.lua（打印标记 + os.exit(0)），
# 经 lite-xl 真实启动链路（SDL 初始化 → 内嵌 Lua VM 启动 → core.init →
# load_user_directory → dofile init.lua）执行，断言退出码 0 且 stdout 含标记。
test_package_tests:
  - file: test_litexl.c
    description: "实质测试：无头(SDL dummy)运行 lite-xl 二进制，经 $LITE_USERDIR/init.lua 让内嵌 Lua 打印 'LITE_XL_TEST_OK' 并 os.exit(0)，断言退出码 0 且 stdout 含标记"
    command: "./test_litexl"

assertion_count: 2
