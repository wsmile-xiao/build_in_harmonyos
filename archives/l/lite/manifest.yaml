# lite 软件级 manifest（Lite XL 轻量文本编辑器）
# 遵循 ARCHIVE-SPEC v2.0

software: lite
display: "Lite XL"
description: "Lite XL 是一个用 Lua + C 编写的轻量、快速、开源的文本编辑器（上游项目 lite-xl 2.1.8）"
homepage: "https://lite-xl.com/"
license: MIT
repository: https://github.com/lite-xl/lite-xl
category: utility
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Meson 构建；wrap_mode=nodownload，依赖全走 conan（R36），禁止 meson 网络下载子项目"
    - "src/meson.build 硬编码 SDL3（dependency('sdl3', static: true)，无 sdl2 回退）；sdl3/3.4.8 依赖协作者 conan 配方（archives/s/sdl3/3.4.8/ 有 OHOS 适配归档：4 个 OHOS 补丁，SDL_PLATFORM_OHOS/取消 SDL_PLATFORM_LINUX、禁用 pthread_setcanceltype、禁用 SDL_TRAY/SDL_Gtk_Quit）"
    - "Lua 走 use_system_lua=true（遍历 lua5.4/lua-5.4/lua），需补 pkg-config 别名；agg 不是依赖（subprojects 无 agg.wrap）"
    - "OHOS Meson 需注入 ar/ranlib 全路径到 conan_meson_native.ini（dav1d/fontconfig 实证）"
    - "应用包可执行文件需 binary-sign-tool 签名（OHOS XPM），R38 需 commands.json"
  common_dependencies:
    - sdl3
    - freetype
    - lua
    - pcre2

# 版本索引
versions:
  "2.1.8":
    status: built
    build_date: "2026-08-17"
    notes: "配方已修正（sdl3/3.4.8 + use_system_lua + 移除 agg）；W3 conan create 已在真实环境通过（全量源码构建 + test_package 实质运行 lite-xl，输出 LITE_XL_TEST_OK）；W0 依赖发布检查：freetype/lua/pcre2 在 ohpcd remote 已发布，sdl3 本地缓存 recipe+built binary 算就绪"
