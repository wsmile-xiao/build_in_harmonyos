# conandata.yml — libcork 0.9.0
# 官方源: https://github.com/dcreager/libcork (MIT, RedJack LLC)

sources:
  url: "https://github.com/dcreager/libcork/archive/refs/tags/0.9.0.tar.gz"
  sha256: "8799597267e6e831b4bfa026d59e890331e836e9b1570ab001451bedc3134371"

patches:
  - patch_file: "patches/0001-version.sh.patch"
    patch_description: "version.sh: shebang 改 /usr/bin/env bash + 引号修复；无 .git 时正确回退 RELEASE-VERSION"
    patch_type: "portability"
  - patch_file: "patches/0002-CMakeLists-tests-option.patch"
    patch_description: "CMakeLists.txt: 新增 CORK_BUILD_TESTS 选项（默认 ON），OHOS 包构建可关闭上游 check 测试"
    patch_type: "portability"
  - patch_file: "patches/0003-src-CMakeLists-shared-libs.patch"
    patch_description: "src/CMakeLists.txt: libcork 库类型改由 BUILD_SHARED_LIBS 控制（遵守 R26/Conan shared 语义）"
    patch_type: "portability"
  - patch_file: "patches/0004-ip-address-overflow.patch"
    patch_description: "ip-address.c: cork_ipv6_init 尾部 hextet 写入缺少越界检查（9 组输入写穿 8 元素缓冲区）→ 增加 hextets_seen>=8 解析错误门限，修复上游段错误缺陷"
    patch_type: "bugfix"
  - patch_file: "patches/0005-CMakeLists-min-version.patch"
    patch_description: "CMakeLists.txt: cmake_minimum_required 2.6→3.5（CMake>=3.5 移除旧兼容，与 CMake 4.1.2 兼容，配合 CORK 构建）"
    patch_type: "portability"