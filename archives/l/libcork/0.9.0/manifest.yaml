# 版本级 manifest — libcork 0.9.0

# ============================================================
# 必须字段
# ============================================================

version: "0.9.0"
software: "libcork"
status: built
build_date: "2026-09-02"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/dcreager/libcork/archive/refs/tags/0.9.0.tar.gz"
  sha256: "8799597267e6e831b4bfa026d59e890331e836e9b1570ab001451bedc3134371"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCORK_BUILD_TESTS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-version.sh.patch"
  - "0002-CMakeLists-tests-option.patch"
  - "0003-src-CMakeLists-shared-libs.patch"
  - "0004-ip-address-overflow.patch"
  - "0005-CMakeLists-min-version.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libcork 为 CMake 构建，非 autotools；conan-init 需按 CMake 改写配方"
  - "version.sh 在无 .git 源码包中 git describe 失败，需写 RELEASE-VERSION 回退 + 修正 shebang"
  - "上游 cmake_minimum_required(2.6) 与 CMake>=3.5 冲突，需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "上游测试依赖 check 框架，OHOS 包构建默认关闭 (CORK_BUILD_TESTS=OFF)，测试单独枚举运行"