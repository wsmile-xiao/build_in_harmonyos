# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制)

package: libcork/0.9.0
homepage: "https://github.com/dcreager/libcork"

# 上游测试命令 (分析测试列表用)
upstream_check_command: "ctest -N"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序 (依赖 check 框架, 由 CORK_BUILD_TESTS=ON 构建)
upstream_tests:
  - file: tests/test-array.c
    source: libcork-0.9.0/tests/test-array.c
    description: "cork_array 数据结构单元测试"
    command: "./shared-test-array"
  - file: tests/test-buffer.c
    source: libcork-0.9.0/tests/test-buffer.c
    description: "cork_buffer 动态缓冲单元测试"
    command: "./shared-test-buffer"
  - file: tests/test-core.c
    source: libcork-0.9.0/tests/test-core.c
    description: "core 模块 (allocator/error/timestamp) 单元测试"
    command: "./shared-test-core"
  - file: tests/test-dllist.c
    source: libcork-0.9.0/tests/test-dllist.c
    description: "cork_dllist 双向链表单元测试"
    command: "./shared-test-dllist"
  - file: tests/test-gc.c
    source: libcork-0.9.0/tests/test-gc.c
    description: "垃圾回收器单元测试"
    command: "./shared-test-gc"
  - file: tests/test-hash-table.c
    source: libcork-0.9.0/tests/test-hash-table.c
    description: "cork_hash_table 哈希表单元测试"
    command: "./shared-test-hash-table"
  - file: tests/test-managed-buffer.c
    source: libcork-0.9.0/tests/test-managed-buffer.c
    description: "托管缓冲区单元测试"
    command: "./shared-test-managed-buffer"
  - file: tests/test-mempool.c
    source: libcork-0.9.0/tests/test-mempool.c
    description: "cork_mempool 内存池单元测试"
    command: "./shared-test-mempool"
  - file: tests/test-ring-buffer.c
    source: libcork-0.9.0/tests/test-ring-buffer.c
    description: "环形缓冲区单元测试"
    command: "./shared-test-ring-buffer"
  - file: tests/test-slice.c
    source: libcork-0.9.0/tests/test-slice.c
    description: "slice 模块单元测试"
    command: "./shared-test-slice"
  - file: tests/test-subprocess.c
    source: libcork-0.9.0/tests/test-subprocess.c
    description: "子进程管理单元测试"
    command: "./shared-test-subprocess"
  - file: tests/test-threads.c
    source: libcork-0.9.0/tests/test-threads.c
    description: "线程 descriptor 单元测试"
    command: "./shared-test-threads"

# test_package 自带测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 真实调用 cork_hash_buffer / cork_buffer API"
    command: "./test_libcork"

# 测试断言总数 (近似, 用于质量评估; 上游 check 断言无法静态统计)
assertion_count: 24