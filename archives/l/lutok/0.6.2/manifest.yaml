version: "0.6.2"
software: "lutok"
status: built
build_date: "2026-09-17"
build_system: "autotools"

source:
  url: "https://github.com/jmmv/lutok/releases/download/lutok-0.6.2/lutok-0.6.2.tar.gz"
  sha256: "1ef51f3741d28e27b09dfaee61ab432966cff56f50940eca1cbacffc11baa2ad"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu"
    - "--enable-atf --with-doxygen=no"
    - "--enable-shared --disable-static"
  dependencies:
    - "lua/5.4.8"
    - "atf/0.23 (test_requires)"
  cc: clang
  cxx: clang++

patches_applied: []

# 本 PR 使用/新增的知识（路径 A 环节引用既有条目；路径 B 新增草稿见 knowledge_gained 与 PR 正文）
knowledge_ref:
  - "E580-draft-9C4A（本 PR 新增：ATF/kyua 测试栈无 kyua 全量执行协议）"
  - "E007 / E160（config.guess 不识别 HarmonyOS 的既有处置）"
  - "E011 / E129（HMDFS mktemp -d 与 config.status 临时目录）"
  - "E522（transitive .la / dependency_libs 不可迁移；引用）"
  - "E480（公开头依赖须 transitive_headers；引用）"

knowledge_gained:
  - "config.guess 2018-08-29 不识别 HarmonyOS（uname -s=HarmonyOS）：显式 --build/--host=aarch64-unknown-linux-gnu 绕过，无需补丁（knowledge_ref: E007, E160）"
  - "kyua 未适配时 ATF 测试栈的无 kyua 全量执行协议：prog -l 枚举（TP 格式 ident）+ 单用例位置参数逐条执行（退出码 0=通过）+ atf-sh 环境装配 + 用例数强对账；同时实测纠正预研将 -r 误读为『运行全部』（实为结果文件参数）（knowledge_ref: E580-draft-9C4A）"
  - "atf/0.23 制品不可迁移三件套：.pc 为 prefix=/、.la 的 dependency_libs 指向 //lib、编译期 ATF_SHELL 为 CI-worker 私有路径；处置=自写包装 .pc + .a 私有 link 目录绕开坏 .la + 运行期 ATF_* 覆盖（knowledge_ref: E522, DRAFT-ccfits-2.7-stale-pc-prefix-regen）"
  - "lua 制品只安装 *.h 而缺 lua.hpp（C++ 便利头）：生成标准四行包装头并随包安装；Lua 多命名 pkg-config 探测链 lua-5.4/lua5.4/lua 在制品仓首次命中（knowledge_ref: E580-draft-9C4A 附属小节）"
  - "Conan 2.29 tools.graph:skip_binaries 会把 shared 库的 static 依赖在消费者图标记 Skip；公开头暴露依赖须声明 transitive_headers/transitive_libs，否则 CMakeDeps/PkgConfigDeps 不透传（knowledge_ref: E480, DRAFT-conan-shared-pkgconfig-requires-drop）"
  - "HMDFS 上 toybox mktemp -d（umask 077）建出的目录不可写，config.status 报 could not setup config files machinery：mkdir 版 mktemp shim 前置 PATH（knowledge_ref: E011, E129）"
