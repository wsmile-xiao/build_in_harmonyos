# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁要求）
#
# 上游测试清点证据（R51）：release tarball 根目录含 6 个 atf-c++ 测试程序
# （ATF_ADD_TEST_CASE 合计 97 个用例：c_gate 2 / debug 2 / exceptions 4 /
# operations 19 / stack_cleaner 4 / state 66）与 examples_test.sh（atf-sh，
# 4 个用例）；Kyuafile 注册 7 个测试程序。测试默认不构建，需 --enable-atf。
# kyua 在 OHOS 不可用，改用 ATF 测试程序接口全量执行：
# `prog -l` 枚举（TP 格式 ident）+ `prog <case>` 单用例运行（exit 0 = pass）。

package: lutok/0.6.2
homepage: "https://github.com/jmmv/lutok"

# 上游测试命令（automake check 目标；需 kyua，OHOS 上以 ATF 接口替代执行）
upstream_check_command: "make check"

# conanfile.py build() 已集成上游测试（conan create 即逐用例执行）
upstream_test_in_build: true
upstream_test_command: "sh run_atf_suites.sh <log> c_gate_test debug_test exceptions_test operations_test stack_cleaner_test state_test examples_test"

upstream_tests:
  - file: "c_gate_test.cpp"
    source: "lutok-0.6.2/c_gate_test.cpp"
    description: "Lua C API gate 与 connect：2 个用例"
    command: "./c_gate_test <case>"
  - file: "debug_test.cpp"
    source: "lutok-0.6.2/debug_test.cpp"
    description: "调试辅助（get_info/get_stack）：2 个用例"
    command: "./debug_test <case>"
  - file: "exceptions_test.cpp"
    source: "lutok-0.6.2/exceptions_test.cpp"
    description: "异常层次（error/api_error/file_not_found_error）：4 个用例"
    command: "./exceptions_test <case>"
  - file: "operations_test.cpp"
    source: "lutok-0.6.2/operations_test.cpp"
    description: "create_module/do_file/do_string/eval：19 个用例"
    command: "./operations_test <case>"
  - file: "stack_cleaner_test.cpp"
    source: "lutok-0.6.2/stack_cleaner_test.cpp"
    description: "RAII 栈清理：4 个用例"
    command: "./stack_cleaner_test <case>"
  - file: "state_test.cpp"
    source: "lutok-0.6.2/state_test.cpp"
    description: "Lua state 包装全 API：66 个用例"
    command: "./state_test <case>"
  - file: "examples_test.sh"
    source: "lutok-0.6.2/examples_test.sh"
    description: "atf-sh：编译并运行 4 个上游示例（bindings/hello/interpreter/raii）"
    command: "examples_test <case>"

test_package_tests:
  - file: test_lutok.cpp
    description: "消费者测试：do_string 求值、native 函数绑定、stack_cleaner、失败脚本异常、state_c_gate 裸 lua_State，共 6 处行为断言"
    command: "./test_lutok"

# 测试断言总数（消费者程序 1 个，6 处行为断言）
assertion_count: 6
