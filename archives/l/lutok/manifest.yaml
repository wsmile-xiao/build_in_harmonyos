software: lutok
display: "Lutok"
description: "Lightweight C++ API for Lua (RAII wrapper over the Lua C API)"
category: library
homepage: "https://github.com/jmmv/lutok"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "官方 release 附件为 make dist 产物、自带 configure（无需 autoreconf）；config.guess 2018 版不识别 HarmonyOS，显式 --build/--host=aarch64-unknown-linux-gnu"
    - "Lua 发现链为 pkg-config lua-5.4/lua5.4/lua 三级；lua/5.4.8 声明 pkg_config_name=lua-5.4，PkgConfigDeps 首次命中"
    - "上游测试 --enable-atf + kyua 缺失：以 ATF 程序接口 prog -l 枚举 + prog <case> 逐用例执行（97 个 atf-c++ 用例 + 4 个 atf-sh 示例用例全通过）"
    - "atf/0.23 制品以 prefix=/ 构建（坏 .pc/.la、编译期 ATF_SHELL=/data/service/hnp/bin/bash）：配方自写 .pc、用 .a 拷贝目录绕开 .la、运行示例套件前修正 ATF_* 环境"
    - "lua 制品缺 lua.hpp（C++ 包装头）：配方生成标准四行头用于构建并随包安装到 include/"
    - "HMDFS 上 toybox mktemp -d（umask 077）目录不可写导致 config.status 失败：mkdir 版 mktemp shim 前置 PATH"
    - "kyua 未适配时 ATF 测试栈的无 kyua 全量执行协议（本 PR 新增知识草稿 E580-draft-9C4A）：prog -l 枚举 + 单用例位置参数逐条执行 + atf-sh 环境装配 + 用例数强对账"
  common_dependencies:
    - "lua"

versions:
  "0.6.2":
    status: built
    build_date: "2026-09-17"
    conan_ref: "lutok/0.6.2"
