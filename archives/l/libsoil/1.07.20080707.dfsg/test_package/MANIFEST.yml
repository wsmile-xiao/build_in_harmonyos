# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsoil/1.07.20080707.dfsg
homepage: "https://www.lonesock.net/soil.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 makefile 无 test/check 目标（见下）
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# R51 清点结论：
#  1. src/test_SOIL.cpp — Windows-only GUI 程序，无法在 OHOS/Linux 编译运行：
#     包含 #include <windows.h>/<shellapi.h>/<gl/gl.h>、WINAPI WinMain、
#     CreateWindowEx/HWND 等 Win32 API，鸿蒙(基于 Linux 内核)不存在这些 API。
#  2. projects/makefile/makefile — 无 test/check 目标（仅 all/clean/install/uninstall）。
#  因此上游测试不可移植运行，补全为 test_package 实质功能测试（R34）。
upstream_tests:
  - file: "src/test_SOIL.cpp (上游)"
    source: "libsoil-1.07.20080707.dfsg/src/test_SOIL.cpp"
    description: "Windows-only GUI 测试（WinMain/CreateWindowEx/HWND），OHOS/Linux 无 Win32 API，不可移植编译运行"
    command: "N/A"
  - file: "makefile test 目标 (上游)"
    source: "libsoil-1.07.20080707.dfsg/projects/makefile/makefile"
    description: "上游 makefile 无 test/check 目标（仅 all/clean/install/uninstall）"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "实质功能测试：SOIL_load_image 解码 bmp/png/tga/dds 四格式（尺寸/通道数/关键像素）+ SOIL_save_image 往返 + SOIL_last_result；test() 内另有鸿蒙平台断言（aarch64 ELF/无 GLIBC/已签名）"
    command: "./test_libsoil"
  - file: make_images.py
    description: "测试图片确定性生成器：四张测试图为二进制文件、不随仓库提交（新增二进制会使 CI checkout-pr 的 git apply 报 missing binary patch data，CI #60156），由 CMakeLists.txt 在构建期调用本脚本生成（python3，CI 环境自带）"
    command: "cmake 构建期自动调用"

# 测试断言总数 (test.c 内 expect() 实际计数 21，conan create 实测 21/21)
assertion_count: 21
