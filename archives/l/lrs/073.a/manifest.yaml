software: lrs
version: "073.a"
conan_ref: "lrs/073.a"
status: built
build_date: "2026-09-26"
build_system: makefile

source:
  url: "https://cgm.cs.mcgill.ca/~avis/C/lrslib/archive/lrslib-073a.tar.gz"
  sha256: "7fb16ad5c2b7380ef8deaecbfaf53599eef074fd225012aa431b76ee0bded6a6"
  tar_format: tar.gz
  upstream_release_url: "https://cgm.cs.mcgill.ca/~avis/C/lrs.html"
  notes: >-
    上游官方发布页（McGill 大学 David Avis 课题组）的 archive 目录，非镜像、非重打包。
    解包顶层目录 lrslib-073a/。073a 是 7.3 的 bug-fix 版（README：2025.10.10
    "Minor patch to fix errors when compiling with gcc 15"），相对 073 仅改 README
    与 lrslib.c（signal 处理函数原型补 int 形参）；lrslib.h:3 的 VERSION 仍为
    "v.7.3_2024.5.30"。平台任务名为 `lrs` `073.a`（分支 feat/lrs-073.a），
    故本包 Conan 名为 lrs（上游项目名 lrslib）。

build:
  system: makefile
  configure_options: []
  make_target: "all-shared"
  make_variables:
    - "CC=<tools.build:compiler_executables:c>"
    - "CFLAGS=-O3 -Wall -I<src>/lrsarith-011/ -I<gmp>/include -L<gmp>/lib"
    - "INCLUDEDIR=<gmp>/include"
    - "LIBDIR=<gmp>/lib"
    - "SHLIBFLAGS=-L<gmp>/lib"
  dependencies:
    - gmp/6.3.0
  cc: clang
  cxx: clang++
  outputs:
    - "lib/liblrs.so.1.0.0 (SONAME liblrs.so.1；同时含 64bit / 128bit / GMP 三套算术后端)"
    - "lib/liblrs.so.1, lib/liblrs.so (符号链接)"
    - "bin/lrs (H<->V 转换 / 面枚举 / 体积)"
    - "bin/lrsnash (双人博弈 Nash 均衡)"
    - "bin/redund, bin/minrep, bin/fel (lrs 的 argv[0] 别名符号链接)"
    - "include/lrslib/{lrslib.h,lrsdriver.h,lrsrestart.h,lrsgmp.h,lrslong.h,lrsmp.h}"

patches_applied:
  - "0001-lrs.c.patch"
  - "0002-lrslib.c.patch"
  - "0003-lrsnash.c.patch"
  - "0004-makefile.patch"

tests:
  upstream:
    command: "build() 内逐个 ine/test/*.ine 运行 ./lrs-shared（LD_LIBRARY_PATH=构建树，TMPDIR=构建目录内可写目录）"
    counting_unit: "上游测试输入问题（ine/test/*.ine，每个文件一次完整 lrs 运行）"
    declared_n: 30
    candidate_counts:
      - "ine/test/*.ine = 30  <= 采用：目录名即 test，被审版本自带的回归输入面"
      - "ine/test-072/*.ine = 7  不采用：7.2 版回归集（属上一版本），抽测 4 例各 180s 均未跑完"
      - "ine/test-062/*.ine = 9  不采用：6.2 版回归集（属上上版本）"
      - "ine/test-062/normaliz/*.in(10) + porta/*(10) = 20  不采用：第三方工具格式，lrs 不可运行"
      - "ext/test/*.ext = 12  不采用：期望输出/对照产物，不是可运行用例"
      - "ine/redund/*(23) + ext/redund/*(19) + ine/project/*(36) = 78  不采用：示例数据集，不在 test 目录下"
      - "ine/**/*.ine(112) + ext/**/*.ext(33) = 145  不采用：示例数据集全量，不是测试注册面"
    executed: 30
    passed: 30
    failed: 0
    skipped: 0
    not_run: 0
    assertions: 32
    pass_rate: "30/30 (100%)"
    independent_oracles:
      - "ext/test/cube.ext 声明的 8 行 == lrs 对 cube.ine 报的 vertices=8"
      - "ext/test/tsp5.ext 声明的 12 行 == lrs 对 tsp5.ine 报的 vertices=12"
    note: >-
      上游没有测试框架：makefile 里 grep -nE '^(check|test|all|default):' 只命中
      'default: lrs lrsgmp'，也没有 CTest/Meson/pytest 注册面；回归面是数据驱动的，
      ine/test/ 下每个 .ine 就是一道完整枚举问题。逐例判据：退出码 0 + 该例有
      *Totals: 行（cp4/ep/inf/left/right 五例属转换/无解模式，天然无 Totals 行，已在配方
      里显式登记并逐例在设备上核对）；cube/tsp5 额外与上游参考输出的行数比对（另一单位，
      独立 oracle）。自动 oracle 共 32 条 = 30 例运行判据 + 2 条参考输出行数比对。
  adapted:
    command: "Conan test_package"
    cases: 15
    passed: 15
    pass_rate: "15/15 (100%)"
    breakdown:
      generic_consumer_assertions: 3
      harmony_specific_assertions: 12
    note: >-
      test_lrslib.c 3 项（消费者 API：lrs_init + lrs_alloc_dat/lrs_alloc_dic/lrs_set_row/
      lrs_getfirstbasis/lrs_getsolution/lrs_getnextbasis，超立方体 dim=2/3/4 顶点数必须
      4/8/16）；鸿蒙特有 12 项：bin/lrs、bin/lrsnash、bin/redund、bin/minrep、bin/fel 在
      **裸环境（不 source conanrun）** 下 --version/--help 退出码 0（6 条；这是唯一能证明
      $ORIGIN/../lib RUNPATH 正确、而不是被 LD_LIBRARY_PATH 兜住的判据），
      lrs/lrsnash --version 的版本串必须为 'lrslib 7.3a'（2 条，验证本包 CLI 补丁），
      bin/lrs cube.ine 在裸环境下报 vertices=8（1 条），以及 redund/minrep/fel 三个
      argv[0] 别名各自跑真实计算并命中模式标志（3 条；--version 在 argv[0] 分派之前返回，
      证明不了分派）。

blockers: []

knowledge_gained:
  - "手写 makefile 的包在 OHOS 上有三类确定性陷阱：字面量 /tmp 的 mkstemp 模板（失败后还解引用 NULL 崩成 rc=139）、交付可执行文件缺 $ORIGIN RUNPATH（conanrun 下假绿、L2 裸 PATH 冒烟才暴露 rc=127）、CLI 不认 --version/--help（L2 对 bin/ 下每个文件判红）。"  # knowledge_ref: knowledge/drafts/E625-draft-LRSL
  - "公开头链包含依赖头时必须 requires(..., transitive_headers=True)：lrslib.h -> ARITH(\"lrsgmp.h\") -> <gmp.h>，漏掉的表现是本包全绿、只有消费者编译红。"  # knowledge_ref: knowledge/drafts/E625-draft-LRSL
  - "平台没有 install 命令，上游依赖 install -t 的 install 规则必然失败；上游 install 布局由配方用 copy()/os.symlink() 复刻（含 argv[0] 别名符号链接）。"  # knowledge_ref: knowledge/drafts/E625-draft-LRSL
  - "上游 makefile 的链接行不给 -L 挂钩时，依赖库目录只能走 CFLAGS 传（${SHLIB} 规则连 -L${LIBDIR} 都没有，要用 SHLIBFLAGS）。"  # knowledge_ref: knowledge/drafts/E625-draft-LRSL
  - "lrslib 073a 相对 073 只改了 README（版本号 7.3a + gcc 15 修复说明）与 lrslib.c（signal 处理函数 timecheck/checkpoint/die_gracefully 补 int 形参，gcc 15 需要原型一致）；对 clang 15 无行为差异，上版补丁 4 个 hunk 全部原样适用，只需把补丁新增的 --version 横幅更新为 7.3a。"  # knowledge_ref: knowledge/drafts/E625-draft-LRSL

