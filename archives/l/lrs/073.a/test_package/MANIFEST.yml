package: lrs/073.a
homepage: "https://cgm.cs.mcgill.ca/~avis/C/lrs.html"

# 上游测试命令。上游 makefile 没有任何 check/test 目标（实测
# `grep -nE '^(check|test|all|default):' makefile` 只命中 `default: lrs lrsgmp`），
# 也没有 CTest/Meson/pytest 注册面；上游自带的回归面是数据驱动的：
# ine/test/ 下每个 .ine 文件就是一道完整的枚举问题，配一个 lrs 运行。
upstream_check_command: "无 make check/test 目标；回归面 = 逐用例运行 <src>/ine/test/*.ine"
upstream_test_in_build: true
upstream_test_command: "build() 内逐个 ine/test/*.ine 运行 ./lrs-shared（LD_LIBRARY_PATH=构建树，TMPDIR=构建目录内可写目录）"

# 上游实际运行的测试程序（每个文件一次 lrs 运行）
upstream_tests:
  - file: ine/test/*.ine
    source: lrslib-073a.tar.gz
    description: "上游回归输入问题，共 30 个；每个文件一次完整 lrs 枚举运行，要求退出码 0 且该例输出含自己的 *Totals: 行（cp4/ep/inf/left/right 五例属转换/无解模式，天然无该行，已在配方 _UPSTREAM_NO_TOTALS 显式登记并逐例在设备上核对）；cube/tsp5 另与 ext/test 参考输出的行数比对"
    command: "./lrs-shared ine/test/<case>.ine"
  - file: ext/test/cube.ext
    source: lrslib-073a.tar.gz
    description: "cube.ine 的上游参考输出，begin 后声明 8 行（独立 oracle）"
    command: "对照 ext/test/cube.ext 声明的顶点数"
  - file: ext/test/tsp5.ext
    source: lrslib-073a.tar.gz
    description: "tsp5.ine 的上游参考输出，begin 后声明 12 行（独立 oracle）"
    command: "对照 ext/test/tsp5.ext 声明的顶点数"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_lrslib.c
    description: "消费者 API 断言：lrs_init + lrs_alloc_dat/lrs_alloc_dic/lrs_set_row/lrs_getfirstbasis/lrs_getsolution/lrs_getnextbasis，超立方体 dim=2/3/4 顶点数必须为 4/8/16（共 3 条，conanrun 与裸环境各跑一次）"
    command: "./test_lrslib"
  - file: lrs --version / --help、lrsnash --version、redund/minrep/fel --version
    description: "已安装的 bin/ 下 5 个可执行文件在裸环境（不带 conanrun/LD_LIBRARY_PATH）下响应查询且退出码 0（6 条；这是唯一能证明 $ORIGIN/../lib RUNPATH 正确、而不是被 LD_LIBRARY_PATH 兜住的判据）"
    command: "<pkg>/bin/<tool> --version|--help"
  - file: lrs --version / lrsnash --version（版本串）
    description: "版本横幅由本包 CLI 补丁新增：lrs 与 lrsnash 的 --version 输出必须含 'lrslib 7.3a'（2 条）"
    command: "<pkg>/bin/<tool> --version | grep -q 'lrslib 7.3a'"
  - file: cube.ine
    description: "已安装的 bin/lrs 在裸环境（不带 conanrun/LD_LIBRARY_PATH）跑上游 cube.ine，必须报 vertices=8"
    command: "<pkg>/bin/lrs cube.ine | grep -q 'vertices=8'"
  - file: cube.ine
    description: "argv[0] 别名必须真正分派到各自模式（--version 在分派之前返回，证明不了分派）：redund 必须输出 'checking for redundant rows only'、minrep 必须输出 'minimum representation'、fel 必须输出 'no project/eliminate option found'"
    command: "<pkg>/bin/{redund,minrep,fel} cube.ine | grep -q '<模式标志>'"

# 测试断言总数 (近似值, 用于质量评估)
# = 32 上游判据（30 个 ine 运行 + 2 个 ext/test 参考行数比对）+ 15 消费者断言
#   （3 C API + 6 裸环境工具查询 + 2 版本串 + 1 真实计算 + 3 argv[0] 分派）
assertion_count: 47
