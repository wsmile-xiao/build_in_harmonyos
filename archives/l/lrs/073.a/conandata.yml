sources:
  url: "https://cgm.cs.mcgill.ca/~avis/C/lrslib/archive/lrslib-073a.tar.gz"
  sha256: "7fb16ad5c2b7380ef8deaecbfaf53599eef074fd225012aa431b76ee0bded6a6"

patches:
  - patch_file: "patches/0001-lrs.c.patch"
    patch_description: >-
      Answer --version/--help on the lrs front end (upstream treats every
      argument as an input file name) and exit(1) instead of running the
      cleanup path with NULL data when lrs_setup() fails on an unrecoverable
      input.
    patch_type: "portability"
  - patch_file: "patches/0002-lrslib.c.patch"
    patch_description: >-
      Honour $TMPDIR (falling back to /tmp) for the two mkstemp() templates -
      the stdin staging file and the 64/128 bit overflow restart file - since
      the platform sandbox may expose /tmp read-only.
    patch_type: "portability"
  - patch_file: "patches/0003-lrsnash.c.patch"
    patch_description: >-
      Answer --version on the lrsnash front end.
    patch_type: "portability"
  - patch_file: "patches/0004-makefile.patch"
    patch_description: >-
      Give the two shared-linked executables a relocatable $ORIGIN/../lib
      RUNPATH so the installed bin/ tools find lib/liblrs.so.1 without
      LD_LIBRARY_PATH.
    patch_type: "portability"
