# 软件级 manifest — lakai
# 遵循 ARCHIVE-SPEC v3.0

software: lakai
display: "lakai"
description: "AKAI 采样器 SCSI 传输工具集（liblakai 静态库 + lakbak/lakres/lakclear CLI）"
category: library
homepage: "https://sourceforge.net/projects/lakai/"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 GNU Makefile 项目，无 configure/autotools/cmake；aarch64 clang 原生 make，零源码补丁"
    - "无第三方依赖，仅用 libc 与 sysroot 自带 scsi/sg.h、scsi/scsi.h"
    - "不调用上游 make install（OHOS 无 install(1)），package() 用 conan copy() 收集产物"
    - "保留上游静态库产物 liblakai.a（不构建 shared library）"
    - "上游无测试套件（0 用例），归档自研 tests/test_lakai.c 并补 check 目标，由 build() 内 make check 执行"
  common_dependencies: []

versions:
  "0.1":
    status: built
    build_date: 2026-09-14
    conan_ref: "lakai/0.1"
