# test_package/MANIFEST.yml — 上游测试声明 + 自研补全测试登记（R51 三步法）
package: lakai/0.1
homepage: "https://sourceforge.net/projects/lakai/"

# ── 1) 上游测试清点（清点命令 + 结论）────────────────────────────────────
# 清点命令（在解压后的上游源码树内执行）：
#   grep -nE '^(check|test|regress)[^:]*:' Makefile    # 无输出
#   make -n check                                      # "No rule to make target 'check'"
#   ls -d tests test 2>/dev/null                       # 两个目录都不存在
#   find . -type f \( -name '*.c' -o -name '*.h' \)    # 仅 5 个源文件
# 结论：上游 Makefile 只有 all/progs/lakclear/lakbak/lakres/$(LIB)/lakai.o/
#       install/uninstall/clean 目标，没有 check/test/regress；源码树没有
#       tests/ 目录；全树仅 lakai.c / lakai.h / lakbak.c / lakres.c /
#       lakclear.c 五个源文件，不含任何测试代码 —— 上游官方测试套件为 0 项。
#       （完整清点证据见 0.1/notes.md 第一节）
upstream_official_tests: []

# 说明：下面的 check 目标并非上游原有，而是本归档 patches/0001 新增的，
# 用于运行【自研】测试套件；它执行的不是上游官方测试。
upstream_check_command: "make check"   # 目标由 patches/0001-add-make-check-target.patch 新增（上游无此目标）
upstream_test_in_build: true           # build() 内执行 make check（跑的是自研补全测试）
upstream_test_command: "make check"

upstream_tests: []                      # 上游官方用例 0 个（清点依据见上）

# ── 2) 自研补全测试（层 1，conanfile.py build() 内由 make check 编译并运行）──
adapted_tests:
  - file: tests/test_lakai.c
    origin: ohos-adaptation (self-authored; upstream ships no tests)
    description: >-
      自研上游级测试：ASCII<->Akai 字符映射往返与边界、lakai_init/open/close
      契约、已发布头文件常量契约、三个 CLI 可执行性（usage 输出 + 不存在设备的
      错误码）。经 patches/0001 新增的 check 目标编译并运行，链接 liblakai.a。
    command: "make check"
    coverage:
      - "lakai_asciitoakai：'0'-'9'/'A'-'Z'/'a'-'z'/'#'/'+'/'-'/'.' 映射边界"
      - "lakai_asciitoakai：不可转换字符（空格/!/@///\\t）回退为 '+'（38）"
      - "lakai_akaitoascii：反向映射边界（含 10/41/255 等空洞码 -> 空格）"
      - "ASCII->Akai->ASCII 往返一致性（40 个可往返字符逐字符断言）"
      - "小写 'a'-'z' 经 Akai 编码折叠为大写 'A'-'Z'（记录上游行为）"
      - "len 语义：len=0 不改写目标缓冲；部分长度仅转换前 len 字节"
      - "lakai_init() 幂等；lakai_open(不存在设备) 返回失败；lakai_close(未打开句柄) 返回 -1"
      - "已发布头文件常量契约（S2000_*、LAKAI_MODE_*）"
      - "lakbak/lakres/lakclear：无参数打印 Usage 且退出码非 0；指定不存在设备不崩溃且返回可识别错误码 5"
    assertion_count: 100

# ── 3) test_package（层 2，消费者视角，CI L1e 反向验证依赖）─────────────
test_package_tests:
  - file: test_lakai_package.c
    origin: ohos-adaptation (self-authored)
    description: >-
      #include <lakai.h> + 链接 packaged liblakai：ASCII<->Akai 往返、映射边界、
      lakai_init/open/close 契约。移动 include/ 或 lib/ 后编译/链接必失败。
    command: "./test_lakai_package"
    assertion: "assertions=10 failures=0（退出码 0）"
    assertion_count: 10
  - file: conanfile.py (test() method)
    origin: ohos-adaptation (self-authored)
    description: >-
      CLI smoke：运行 packaged bin/lakclear，断言无参数输出 "Usage:"、
      不存在设备输出 "Open failed"。移动 bin/ 后命令不可执行 → 必失败。
    command: "bin/lakclear 2>&1 | grep -q 'Usage:' ; bin/lakclear /nonexistent 2>&1 | grep -q 'Open failed'"
    assertion: "两处 grep 均命中（管道退出码 0）"

assertion_count: 110
