# 版本级 manifest — lakai/0.1
# 遵循 ARCHIVE-SPEC v3.0

version: "0.1"
software: lakai

status: built
build_date: "2026-09-14"
build_system: makefile
conan_ref: "lakai/0.1"

source:
  url: "https://downloads.sourceforge.net/project/lakai/lakai/0.1/lakai-0.1.tar.gz"
  sha256: "a1b5f7eff7f02f87cab93fcdb566c2b1e120bf37dcbf65a5c060f3f6cdd91453"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -j1 CC=<clang 绝对路径> AR=<ar> RANLIB=<ranlib>（纯 GNU Makefile，无 configure 脚本）"
    - "make check：运行自研补全测试 tests/test_lakai.c（check 目标由 patches/0001 新增）"
    - "不编译 shared library，仅保留上游静态库 liblakai.a"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-add-make-check-target.patch"

knowledge_gained:
  - "上游是纯 GNU Makefile（无 configure/autotools/cmake），aarch64 clang 原生 make 即可，零源码补丁"
  - "Makefile 的 ar/ranlib 调用为裸命令（未用 $(AR)/$(RANLIB) 变量），依赖构建机 PATH 上有 ar/ranlib"
  - "本机无 install(1)，上游 make install 不可用；配方改用 conan copy() 收集 bin/lib/include 产物"
  - "上游 0 测试用例（Makefile 无 check/test/regress 目标，无 tests/ 目录），已自研补全 tests/test_lakai.c"
  - "为让自研测试随构建执行并获得 CI L1c 的 make check 日志痕迹，用 patches/0001 仅【新增】check 目标，不改任何上游构建规则"
  - "lakai.h 中 LAKAI_DEVTYPE_* 与 lakai_identifydevice 等位于 #if 0 块内（未启用），自研测试不依赖这些符号"
  - "字符映射存在有损性：小写 a-z 与 A-Z 共用同一 Akai 码，往返后折叠为大写；不可转换字符在 ascii->akai 方向映射为 '+'"
