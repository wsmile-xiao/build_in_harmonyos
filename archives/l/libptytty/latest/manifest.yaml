software: libptytty
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/latest/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "latest"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/yusiwen/libptytty/archive/refs/heads/master.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DUTMP_SUPPORT=OFF"
    - "-DWTMP_SUPPORT=OFF"
    - "-DLASTLOG_SUPPORT=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无外部依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "鸿蒙系统缺少 utmpx API (setutxent/getutxid/pututxline/endutxent)"
  - "必须禁用 UTMP/WTMP/LASTLOG 支持才能编译成功"
  - "C 程序链接 C++ 库需要链接 C++ 标准库（-lc++ 或 -lstdc++）"
  - "建议编译为静态库，避免 ELF 签名问题"

# ============================================================
# 平台限制
# ============================================================

platform_limitations:
  - "不支持 utmp/wtmp/lastlog 功能（系统 API 缺失）"
  - "c-sample 示例程序无法编译（链接问题）"