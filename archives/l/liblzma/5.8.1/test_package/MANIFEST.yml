# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liblzma/5.8.1
homepage: "https://tukaani.org/xz/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_check
    source: xz-5.8.1/tests/test_check.c
    description: "CRC32/CRC64/SHA-256 check tests"
    command: "./tests/test_check"
  - file: tests/test_hardware
    source: xz-5.8.1/tests/test_hardware.c
    description: "Hardware detection tests"
    command: "./tests/test_hardware"
  - file: tests/test_stream_flags
    source: xz-5.8.1/tests/test_stream_flags.c
    description: "Stream flags tests"
    command: "./tests/test_stream_flags"
  - file: tests/test_filter_flags
    source: xz-5.8.1/tests/test_filter_flags.c
    description: "Filter flags tests"
    command: "./tests/test_filter_flags"
  - file: tests/test_filter_str
    source: xz-5.8.1/tests/test_filter_str.c
    description: "Filter string tests"
    command: "./tests/test_filter_str"
  - file: tests/test_block_header
    source: xz-5.8.1/tests/test_block_header.c
    description: "Block header tests"
    command: "./tests/test_block_header"
  - file: tests/test_index
    source: xz-5.8.1/tests/test_index.c
    description: "Index tests"
    command: "./tests/test_index"
  - file: tests/test_index_hash
    source: xz-5.8.1/tests/test_index_hash.c
    description: "Index hash tests"
    command: "./tests/test_index_hash"
  - file: tests/test_bcj_exact_size
    source: xz-5.8.1/tests/test_bcj_exact_size.c
    description: "BCJ exact size tests"
    command: "./tests/test_bcj_exact_size"
  - file: tests/test_memlimit
    source: xz-5.8.1/tests/test_memlimit.c
    description: "Memory limit tests"
    command: "./tests/test_memlimit"
  - file: tests/test_lzip_decoder
    source: xz-5.8.1/tests/test_lzip_decoder.c
    description: "LZIP decoder tests"
    command: "./tests/test_lzip_decoder"
  - file: tests/test_vli
    source: xz-5.8.1/tests/test_vli.c
    description: "Variable-length integer tests"
    command: "./tests/test_vli"
  - file: tests/test_microlzma
    source: xz-5.8.1/tests/test_microlzma.c
    description: "MicroLZMA tests"
    command: "./tests/test_microlzma"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "LZMA2 compress + decompress round-trip test"
    command: "./test_liblzma"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
