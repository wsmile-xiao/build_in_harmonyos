package: lapacke/3.12.1
upstream_test_in_build: true
upstream_tests:
  - file: "LAPACKE/example/example_DGESV_colmajor.c"
    command: "build() 内编译+链接本构建产物 liblapacke.a（依赖 lapack/3.12.1 静态库闭合 Fortran 符号）后在设备上真实执行；上游入口 example/Makefile `all` 目标以 $(FC) 链接并 ./$@ 就地执行，此轻量默认路径仅把链接器换成设备 CC，编译对象/头文件/被链库保持上游语义（同 liblapacke 0.3.30 先例）"
  - file: "LAPACKE/example/example_DGESV_rowmajor.c"
    command: "同上（设备真实执行，stdout 输出于 conan create 构建日志）"
  - file: "LAPACKE/example/example_DGELS_colmajor.c"
    command: "同上（设备真实执行，stdout 输出于 conan create 构建日志）"
  - file: "LAPACKE/example/example_DGELS_rowmajor.c"
    command: "同上（设备真实执行，stdout 输出于 conan create 构建日志）"
upstream_tests_note: >
  上游 LAPACKE 的可执行测试资产即 example/Makefile `all` 目标的 4 个演示程序
  （N=4，全部真实执行 4/4）。example/ 下另有 *_64 变体 4 个（ILP64 口径，属平台
  lapacke64 任务域）与 example_user.c（文档示例代码，不在上游 all 目标），均不在
  本包执行范围。上游 Fortran 测试套（TESTING/ 的 EIG/LIN 等）测的是 LAPACK/BLAS
  本体，属依赖包 lapack/3.12.1 的验证域，不属于 LAPACKE C 接口层。无 SKIP 项。
test_package_tests:
  - file: test.c
    description: "直接链接 liblapacke.a + lapack/3.12.1 静态库并做真实数值计算（#include <lapacke.h>，链接期即核验 LAPACKE_* 接口真实存在、Fortran 符号真实闭合）：LAPACKE_ilaver 版本锚定（v3.12.1 tag 版本字符串未随发布更新，实测 3.12.0）、dgesv colmajor/rowmajor 解线性方程组、dpotrf+dpotrs Cholesky 分解与三角求解、dgels 最小二乘、dsyev 对称特征值分解（含特征向量残差）、dgetrf 奇异负例（info=2）、dpotrf 非正定负例（info=2），逐项校验计算结果而非仅解析符号"
    command: "./test_probe"
assertion_count: 8
