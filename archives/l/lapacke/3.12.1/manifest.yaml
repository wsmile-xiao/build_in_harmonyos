software: lapacke
version: "3.12.1"
build_system: custom
status: built
source:
  url: "https://github.com/Reference-LAPACK/lapack/archive/refs/tags/v3.12.1.tar.gz"
  sha256: "2ca6407a001a474d4d4d35f3a61550156050c48016d949f0da0529c0aa052422"
knowledge_gained:
  - "独立 LAPACKE 包以 netlib lapack 同版源码树交付：lapacke/3.12.1 requires lapack/3.12.1（同 tarball 同版本口径，sha256 2ca6407a…），只编译纯 C 的 LAPACKE/src(2522)+utils(156)，Fortran 本体与 flang 运行时（libFortranRuntime/libFortranDecimal）由依赖包静态闭合"
  - "上游 CMake BUILD_LAPACKE=ON 在本平台产不出 LAPACKE：该入口触发 FortranCInterface_VERIFY 链接验证，flang-ohos 精简运行集无法完成（lapack/3.12.1 先例因此只交付 liblapack/libblas）；绕开 Fortran 构建面直接编译 LAPACKE 纯 C 源是产出独立 liblapacke 的可行路线"
  - "lapacke_mangling.h 由 include/lapacke_mangling_with_flags.h.in 复制生成（实测 3.12.1 tarball 模板不含占位符，默认分支即命名修饰 lcname##_，即 ADD_），与无后缀 reference LAPACK 的 Fortran 符号一致；不能直接拷源码树（该头不在 include/ 内）"
  - "lapacke.h #include \"lapack.h\" 与 \"lapacke_64.h\"：交付头文件集必须为 lapacke.h/lapack.h/lapacke_64.h/lapacke_config.h/lapacke_utils.h + 生成的 lapacke_mangling.h 六件，缺 lapack.h 时消费者连 #include <lapacke.h> 都编不过"
  - "纯静态交付（static-library），不做 shared：LAPACKE 包装层引用的部分 extras 例程（*gbsvxx/*gbrfsx 精化族、*geqpf、*lagge/*latms 等 matgen 辅助族）在 reference liblapack.a 中不存在（上游默认构建面即如此），自包含 .so 被消费者 lld --no-allow-shlib-undefined 拒绝（本机实测）；静态归档按需拉取对象不受该缺口影响"
  - "上游测试资产：LAPACKE/example `all` 目标 4 个演示（DGESV/DGELS × colmajor/rowmajor），本配方 build() 内以设备 CC 链接（上游入口 $(FC)，链接器一处偏差，同 liblapacke 0.3.30 先例）并设备实跑 4/4；*_64 变体属 ILP64 口径（lapacke64 任务域）"
  - "上游 lapacke_example_aux.c 存在 LAPACK_IFMT 格式告警（int64_t vs int），上游自身问题不影响数值结果，不修改上游源码"
  - "上游发布怪癖：v3.12.1 官方 tarball 的 INSTALL/ilaver.f 与 CMakeLists.txt 版本字符串均停留在 3.12.0，LAPACKE_ilaver 实测返回 (3,12,0)；test_package 版本断言按源码树真实行为锚定为 3.12.0（源码 sha256 即官方 v3.12.1 release 资产）"
