software: libosmscout
display: "libosmscout"
description: "OpenStreetMap 离线矢量地图渲染、路径规划与 POI 检索库（C++17）"
category: gfx
homepage: "https://github.com/Framstag/libosmscout"
license: LGPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 CMake 的全部可选依赖都用 find_package(<Dep> QUIET) 探测并静默降级，因此只要补上 libxml2 就能在无 Qt / libagg / cairo / Pango / Marisa 的 OHOS 主机上得到 core + map + map-svg + import + gpx + client 的完整可交付组件集。"
    - "libxml2/2.15.3.1 是唯一外部依赖：它打开导入库的 OSM XML 读入器（PreprocessOSM）与 GPX XML 读入器；没有它，导入库只能读 PBF（需 protobuf）或 .poly。"
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON 让 cmake/features.cmake 里的 find_package(LibXml2 QUIET) 命中 Conan 生成的 LibXml2::LibXml2，而不是宿主 CMake 模块。"
    - "OpenMP 必须连探测一起关掉：OSMSCOUT_BUILD_WITH_OPENMP=OFF 无效，因为 OHOS clang SDK 自带 libomp，上游 find_package(OpenMP QUIET) 会成功，而 libosmscout-import 只按 target 存在就无条件链接 OpenMP::OpenMP_CXX，导致 import 库被 -fopenmp 编译、消费者链接时 __kmpc_* 未定义；须补 CMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON。TBB/HAVE_STD_EXECUTION 探测为负，导入流水线单线程运行。"
    - "原生（build==host==OHOS）cmake 配置会打印 “System is unknown to cmake, create: Platform/HarmonyOS”，但只是缺少 Platform/HarmonyOS.cmake 的告警，配置/编译/运行均正常，无需覆盖 CMAKE_SYSTEM_NAME 也无需绕开 conan_toolchain。"
    - "上游测试宏把测试可执行文件装到 share/osmscout/tests、基准程序装到 share/osmscout/demos，package() 里必须删除，否则纯库包里会混入未签名的 OHOS 可执行文件。"
    - "Conan 2 的 conan create 不调用主配方 test()，上游 69 个 ctest 用例必须在 build() 末尾执行才算有效证据。"
  common_dependencies:
    - libxml2/2.15.3.1

versions:
  "2024.06.02.1":
    status: built
    build_date: "2026-09-29"
    notes: "CMake 构建；上游 69 个 CTest 用例全部执行通过（69/69）；消费者端到端用例 30/30（几何/数字编解码、GPX 解析、OSM XML 导入建库、数据库打开、样式表编译、切片检索与 SVG 渲染）。"
