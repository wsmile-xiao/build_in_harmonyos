package: libosmscout/2024.06.02.1
homepage: "https://github.com/Framstag/libosmscout"

# ── 上游测试声明 ────────────────────────────────────────────────
# 上游 Tests/CMakeLists.txt 注册 69 个 CTest 用例（`ctest -N` 实测，
# 其中 TextLookupTest 因缺 Marisa 在 configure 阶段即不注册），全部在
# HarmonyOS aarch64 执行：ctest "100% tests passed, 0 tests failed out of 69"。
#   ~30 Tests/src/*.cpp 单元测试（几何/字符串/号码编解码/异步/工作队列/…）
#    7 CheckStyleSheet-<sheet>.oss（OSTAndOSSCheck：map.ost + 7 个 .oss 交叉校验）
#   14 PerformanceTest-{none,noop}-<sheet>.oss（无后端绘制性能基准）
#   若干数据库级集成测试（LocationLookupTest / MultiDBRouting /
#   ReaderScannerPerformance / CoordinateEncoding / ThreadedDatabase /
#   WaterIndex / MapRotate / FileScannerWriter 等，均基于 Tests/data/testregion
#   预置地图库；LocationLookupTest 尤其会自己驱动完整导入流水线建库）
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --timeout 900 -j4"

upstream_tests:
  - file: Tests/src/*.cpp
    source: libosmscout-2024.06.02.1/Tests/CMakeLists.txt
    description: "上游单元测试："
    command: "ctest --output-on-failure"
  - file: Tests/src/OSTAndOSSCheck.cpp
    source: libosmscout-2024.06.02.1/Tests/src/OSTAndOSSCheck.cpp
    description: "样式表一致性：map.ost 类型配置与 7 个 .oss 样式表（boundaries/cycle/motorways/public-transport/railways/standard/winter-sports）逐一交叉校验，注册为 7 个 CheckStyleSheet-* 用例"
    command: "ctest -R '^CheckStyleSheet-'"
  - file: Tests/src/PerformanceTest.cpp
    source: libosmscout-2024.06.02.1/Tests/src/PerformanceTest.cpp
    description: "绘制流水线基准：无操作绘制器 + 7 个样式表 × {none,noop} 共 14 个用例，实际跑通样式解析与标签布局"
    command: "ctest -R '^PerformanceTest-'"
  - file: Tests/src/LocationServiceTest.cpp
    source: libosmscout-2024.06.02.1/Tests/src/LocationServiceTest.cpp
    description: "数据库级集成测试：自行驱动 Importer 把 Tests/data/LocationTest.olt 导入成地图库，再用 Database + LocationService 做行政区/邮编/街道/门牌检索（LocationLookupTest）"
    command: "ctest -R LocationLookupTest"
  - file: Tests/data/testregion
    source: libosmscout-2024.06.02.1/Tests/data/testregion
    description: "预置地图库夹具，供 MultiDBRouting / ReaderScannerPerformance / CoordinateEncoding / ThreadedDatabase / WaterIndex 等数据库级用例读取"
    command: "ctest --output-on-failure"

# ── 消费者视角测试（test_package/，R34） ─────────────────────────
test_package_tests:
  - file: test_libosmscout.cpp
    description: "消费者 39 项断言，覆盖交付的全部 6 个库：① 核心几何/数字编解码；② GPX XML 经 libxml2 解析出 1 条轨迹 3 个轨迹点、长度落在 300..800 m；③ 内联 OSM XML 经 libxml2 + 导入流水线建成真实地图库（含 router）；④ Database::Open + 类型配置（highway_primary/building）+ 客户端 MapDirectory 目录校验；⑤ 编译包内 standard.oss 样式表且零错误；⑥ MapService 切片检索（4 个切片）+ MapData 取到节点/道路 + MapPainterSVG 渲染出 SVG 文档"
    command: "test_libosmscout"
  - file: conanfile.py
    description: "conanrun 环境驱动 ctest 与消费者二进制；generate() 把依赖共享库实体化到 realdep_libs（OHOS 加载器拒载符号链接）"
    command: "conan test test_package"

