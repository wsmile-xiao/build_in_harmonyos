software: libosmscout
version: "2024.06.02.1"
status: built
build_date: "2026-09-29"
build_system: cmake

source:
  url: "https://github.com/Framstag/libosmscout/releases/download/v2024.06.02.1/libosmscout-2024.06.02.1.tar.xz"
  sha256: "6dc4929e24fac27b4a24683599ec46b0faedd77251729a11bd098f670fcaec7e"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON"
    - "-DOSMSCOUT_BUILD_IMPORT=ON"
    - "-DOSMSCOUT_BUILD_GPX=ON"
    - "-DOSMSCOUT_BUILD_CLIENT=ON"
    - "-DOSMSCOUT_BUILD_TESTS=ON"
    - "-DOSMSCOUT_BUILD_MAP_SVG=ON"
    - "-DOSMSCOUT_BUILD_MAP_AGG=OFF"
    - "-DOSMSCOUT_BUILD_MAP_CAIRO=OFF"
    - "-DOSMSCOUT_BUILD_MAP_OPENGL=OFF"
    - "-DOSMSCOUT_BUILD_MAP_QT=OFF"
    - "-DOSMSCOUT_BUILD_CLIENT_QT=OFF"
    - "-DOSMSCOUT_BUILD_DEMOS=OFF"
    - "-DOSMSCOUT_BUILD_TOOL_IMPORT=OFF"
    - "-DOSMSCOUT_BUILD_TOOL_DUMPDATA=OFF"
    - "-DOSMSCOUT_BUILD_TOOL_PUBLICTRANSPORTMAP=OFF"
    - "-DOSMSCOUT_BUILD_TOOL_OSMSCOUT2=OFF"
    - "-DOSMSCOUT_BUILD_TOOL_OSMSCOUTOPENGL=OFF"
    - "-DOSMSCOUT_BUILD_TOOL_STYLEEDITOR=OFF"
    - "-DOSMSCOUT_BUILD_DOC_API=OFF"
    - "-DOSMSCOUT_BUILD_WEBPAGE=OFF"
    - "-DOSMSCOUT_BUILD_EXTERN_MATLAB=OFF"
    - "-DOSMSCOUT_BUILD_WITH_OPENMP=OFF"
  dependencies:
    - libxml2/2.15.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 CMake 的全部可选依赖都用 find_package(<Dep> QUIET) 探测并静默降级，因此在无 Qt / libagg / cairo / Pango / Marisa 的 OHOS 主机上只需补 libxml2 就能拿到 core + map + map-svg + import + gpx + client 的完整可交付组件集 (ref: libosmscout-2024.06.02.1-optional-deps)"
  - "libxml2 缺席时导入库只能读 PBF（需 protobuf）或 .poly；补 libxml2/2.15.3.1 后 PreprocessOSM（OSM XML）与 libosmscout-gpx 的 GPX 读入器同时被打开 (ref: libosmscout-2024.06.02.1-libxml2-enables-xml-readers)"
  - "CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON 是让 cmake/features.cmake 的 find_package(LibXml2 QUIET) 命中 Conan 生成配置（LibXml2::LibXml2）的关键，否则内置 FindLibXml2 模块会去宿主 sysroot 找 (ref: libosmscout-2024.06.02.1-prefer-config-libxml2)"
  - "原生（build==host==OHOS）cmake 配置会刷出 “System is unknown to cmake, create: Platform/HarmonyOS”，实测仅是缺少 Platform/HarmonyOS.cmake 的告警，配置/编译/运行全部正常，无需覆盖 CMAKE_SYSTEM_NAME、也无需绕开 conan_toolchain (ref: E550 / ML-0035)"
  - "OSMSCOUT_BUILD_WITH_OPENMP=OFF 还不够：OHOS clang SDK 自带 libomp，find_package(OpenMP QUIET) 会成功，而 libosmscout-import 只按 target 是否存在就无条件 target_link_libraries(... OpenMP::OpenMP_CXX)，于是 import 库被 -fopenmp 编译，消费者链接时 __kmpc_* 全部未定义；必须同时 CMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON 才能真正关掉。HAVE_STD_EXECUTION（TBB）探测为负，导入流水线单线程才是可复现配置 (ref: libosmscout-2024.06.02.1-disable-openmp-lookup)"
  - "上游 osmscout_test_project 宏把测试可执行文件装到 share/osmscout/tests、基准程序装到 share/osmscout/demos，必须在 package() 里删除：纯库包里混入未签名 OHOS 可执行文件既不可用、又会触发软件级 commands.json 要求 (ref: libosmscout-2024.06.02.1-prune-test-binaries)"
  - "Conan 2 的 conan create 不调用主配方 test()，上游 69 个 ctest 用例必须在 build() 末尾执行才能成为有效证据 (ref: pitfalls-checklist #32)"
  - "libxml2 制品把共享库装成 libxml2.so -> libxml2.so.16 -> libxml2.so.16.1.3 的符号链接链，OHOS 存储侧动态加载器拒载符号链接（报 “Error loading shared library libxml2.so.16” 且 errno 为空），把同一文件 cp -L 成实体文件即正常；test_package 的 generate() 必须把依赖 .so 实体化到 realdep_libs 并前置 LD_LIBRARY_PATH (ref: pitfalls-checklist #29)"

verification:
  local_preflight: clean-source-configure-build-cmake-ohos-clang15
  official_test: "ctest 69/69 passed"
  official_ci: pending
