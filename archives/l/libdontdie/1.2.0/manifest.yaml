# 版本级 manifest 模板
# 文件位置: archives/l/libdontdie/1.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 软件名
software: "libdontdie"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/flonatel/libdontdie/archive/refs/tags/1.2.0.tar.gz"

  # 源码校验和
  sha256: "f9ac36d2ad5bccbb7b0691f18ba51d048a3d52536424dd3c3cc6ebf5bf90998e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 Makefile 用 '=' 硬编码 CC=gcc，环境变量 CC 无效，必须在 make 命令行传 CC=<ohos-clang>"
  - "无头驱动上游交互式测试程序会因 stdout 管道全缓冲死锁，改以非交互 perf 程序做上游测试执行"
  - "OHOS musl 无 TCP_KEEPALIVE 选项宏，上游源码实际使用 TCP_KEEPIDLE/TCP_KEEPINTVL/TCP_KEEPCNT"
  - "LD_PRELOAD 型拦截库的消费者测试：test() 中以绝对路径注入 LD_PRELOAD（musl 忽略 DT_RUNPATH），断言 socket() 行为"
