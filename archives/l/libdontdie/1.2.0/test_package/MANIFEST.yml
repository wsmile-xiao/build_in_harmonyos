# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libdontdie/1.2.0
homepage: "https://github.com/flonatel/libdontdie"

# 上游测试清点（R51）：libdontdie 1.2.0 的 Makefile 仅含
# all(libdontdie.so + soname symlink)/testapps/clean 目标，无 check/test
# 目标，无任何标准测试框架（无 make check/ctest/dejagnu），静态注册用例
# 总数为 0。上游随附 3 个手工驱动测试程序与 1 个 Java 示例（见下）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make CC=<ohos-clang> -j1 && <clang> -Wall -O3 -o test/Cperformance/perf test/Cperformance/perf.c && DD_TCP_KEEPALIVE_TIME=4 DD_TCP_KEEPALIVE_INTVL=5 DD_TCP_KEEPALIVE_PROBES=6 LD_PRELOAD=./libdontdie.so ./test/Cperformance/perf 1000"

# 上游测试程序清单（3 个 C 程序 + 1 个 Java 示例）
upstream_tests:
  - file: test/Cperformance/perf.c
    source: libdontdie-1.2.0/test/Cperformance/perf.c
    description: "非交互性能/行为程序：循环 socket()+close() N 次，任一 socket 失败即退出码 1；在 LD_PRELOAD=libdontdie.so 下真实运行 1000 次作为上游测试执行（退出码 0 即通过）"
    command: "DD_TCP_KEEPALIVE_TIME=4 LD_PRELOAD=./libdontdie.so ./test/Cperformance/perf 1000"
  - file: test/Cblackbox/tcp_server.c
    source: libdontdie-1.2.0/test/Cblackbox/tcp_server.c
    description: "交互式黑盒 echo 服务器：从 stdin 逐字符读命令（o=开端口/a=accept/r=读/w=写），设计为人手驱动；stdout 接管道时为全缓冲且无刷新点，无头自动化会死锁——已编译验证，执行跳过（交互式程序，无法无头驱动）"
    command: "已编译（build() 中 <clang> -Wall）；执行跳过：交互式 stdin 驱动 + 管道全缓冲，上游无 runner"
  - file: test/Cblackbox/tcp_client.c
    source: libdontdie-1.2.0/test/Cblackbox/tcp_client.c
    description: "交互式黑盒 echo 客户端（与 tcp_server 配对，c=连接/w=写/r=读/l=关）；同上编译验证、执行跳过。其覆盖场景（TCP 连接上 socket() 被拦截设置 keepalive）由消费者测试以可断言方式等价覆盖"
    command: "已编译（build() 中 <clang> -Wall）；执行跳过：交互式 stdin 驱动 + 管道全缓冲，上游无 runner"
  - file: test/java/EchoClient.java
    source: libdontdie-1.2.0/test/java/EchoClient.java
    description: "Java echo 示例（上游 README 的 JVM 演示）；OHOS 设备无 JVM/javac 工具链，执行跳过（平台能力缺失，与适配无关）"
    command: "跳过：平台无 JVM/javac"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: dd_consumer.c
    description: "消费者测试：以库使用者身份编译独立 C 程序，运行时 LD_PRELOAD 真实加载打包产物 libdontdie.so（绝对路径），调用 libc socket() 创建 TCP 套接字，断言 ①SO_KEEPALIVE 已被库置 1、②TCP_KEEPIDLE 等于 DD_TCP_KEEPALIVE_TIME=7（上游将 TIME 参数映射到 TCP_KEEPIDLE，见 src/libdontdie.c），3 项断言决定退出码"
    command: 'LD_PRELOAD=<package_folder>/lib/libdontdie.so DD_TCP_KEEPALIVE_TIME=7 ./dd_consumer'

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
