# test_package/MANIFEST.yml
# libimobiledevice 1.3.0 upstream test declaration

package: libimobiledevice/1.3.0
homepage: "https://github.com/libimobiledevice/libimobiledevice"

# Upstream test command (make check needs real iOS device / usbmuxd daemon)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/test.c
    description: "Call idevice_get_device_list() — verify libimobiledevice links and API symbols resolve (no daemon/device on OHOS returns error/empty, link OK)"
    command: "./test_libimobiledevice"

# Test assertion count
assertion_count: 1
