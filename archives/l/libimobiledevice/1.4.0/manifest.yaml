version: "1.4.0"
software: "libimobiledevice"
status: built
build_date: "2026-10-08"
build_system: "autotools"

source:
  url: "https://github.com/libimobiledevice/libimobiledevice/releases/download/1.4.0/libimobiledevice-1.4.0.tar.bz2"
  sha256: "23cc0077e221c7d991bd0eb02150a0d49199bcca1ddf059edccee9ffd914939d"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--enable-static --disable-shared"
    - "--without-cython"
  dependencies:
    - libplist/2.3.0
    - libusbmuxd/2.0.2
    - libimobiledevice-glue/1.3.0
    - libtatsu/1.0.5
    - openssl/1.1.1w
  cc: clang

patches_applied:
  - "0001-compat-libplist-2.3.0-backport-dict-uint-helpers.patch: tools 的 4 个文件用到 libplist 2.6.0 才有的 plist_dict_get_uint/plist_dict_copy_uint/PLIST_OPT_NONE，逐字 backport libplist 2.6.0 实现为 static inline（LGPL-2.1+，与已合入的 libtatsu/1.0.5 0001 同族同法）"

knowledge_gained:
  - "1.4.0 相比 1.3.0 的结构变化：common/utils 移入 libimobiledevice-glue（1.3.0 的 enum plist_format_t 补丁不再需要）、新增 libtatsu 硬依赖、SSL 探测改为默认 openssl（PKG_CHECK openssl>=0.9.8，无需 --enable-openssl）"
  - "1.4.0 的 tools 用到 libplist 2.6.0 的 plist_dict_get_uint/plist_dict_copy_uint/PLIST_OPT_NONE 而 configure.ac 只要求 >= 2.3.0（上游自身不一致，libtatsu 1.0.5 踩过同族坑）→ 按其已合入配方同法 backport，libplist 固定 2.3.0"
  - "全部 OHOS 构建坑复用 1.3.0/glue/libtatsu 已进图谱的条目：E114 mktemp 包装、E011 umask 077→022、config.guess --build 三元组、依赖 .la 改名、make -j1 —— 纯路径 A，无新坑"
  - "CMakeDeps 对「声明了 cpp_info.libs 的聚合 target」不传播依赖的 usage requirements（DEPS_TARGET 只挂 per-lib target）→ 消费者显式 require+link 全部静态闭包"
  - "上游无测试套件（无 tests/、无 check 程序）；消费者走 API 链接/错误路径断言（idevice_get_device_list/idevice_new 假 UDID/idevice_set_debug_level）"

test_results:
  type: "none"
  upstream:
    total: 0
    passed: 0
    failed: 0
    note: "上游无测试套件；功能级测试需真实 iOS 设备 + usbmuxd 守护（OHOS 无）"
  consumer:
    total: 3
    passed: 3
