# test_package/MANIFEST.yml
# libimobiledevice 1.4.0 - upstream test declaration and consumer-test audit.

package: libimobiledevice/1.4.0
homepage: "https://github.com/libimobiledevice/libimobiledevice"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream libimobiledevice 1.4.0 ships no test suite: the release tarball
  has no tests/ directory, Makefile.am has no check/TESTS programs, and no
  CI test entry. `make check` only runs the empty automake default target.
  Functional testing upstream-style requires a real iOS device attached
  through usbmuxd, which does not exist on OHOS.
upstream_check_command: "make check (empty automake default)"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests: []

test_package_tests:
  - file: test.c
    description: >-
      links libimobiledevice-1.0.a with all transitive deps (libusbmuxd,
      libplist, libimobiledevice-glue, libtatsu, openssl, libcurl) and
      calls the public API: idevice_get_device_list()/idevice_device_list_free
      (documented error path without a usbmuxd daemon), idevice_new() with a
      bogus UDID must fail cleanly, idevice_set_debug_level() callable.
    command: "./test_libimobiledevice"

test_files:
  - path: "test_package/test.c"
    test_type: "R34"
    assertion_count: 3

test_package_test_count: 1
consumer_assertion_count: 3
upstream_test_cases: 0
assertion_count: 3
