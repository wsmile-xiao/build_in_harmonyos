# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lsquic/4.9.4
homepage: "https://github.com/litespeedtech/lsquic"

upstream_check_command: "ctest"
upstream_test_in_build: false   # 上游测试需 Debug 构建 + 本机执行环境（CI Release 离线不构建）
upstream_test_command: "cmake -DCMAKE_BUILD_TYPE=Debug -DLSQUIC_TESTS=ON -DLSQUIC_ASAN=OFF -DLSQUIC_BIN=OFF -DLSQUIC_LIBSSL=OPENSSL .. && cmake --build . -- -j1 && ctest -j4"

upstream_tests:
  - file: tests/CMakeLists.txt
    source: lsquic-4.9.4/tests/CMakeLists.txt
    description: "上游 CTest 注册 82 个测试（63 FOREACH 列表项 + 19 显式注册，含 h3_framing 9 子用例与 stream 4 变体）"
    command: "ctest"

test_package_tests:
  - file: test_package/src/test_package.c
    description: "消费者测试 - 引擎全生命周期真跑（global_init → engine 创建即注册 OSSL_DISPATCH QUIC TLS 桥 + retry AEAD shim 初始化 → destroy → cleanup），验证 OpenSSL 桥接层在 OHOS aarch64 可用"
    command: "./test_package"

assertion_count: 84
