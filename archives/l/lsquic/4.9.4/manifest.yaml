# 版本级 manifest
# 文件位置: archives/l/lsquic/4.9.4/manifest.yaml
version: "4.9.4"
software: lsquic
status: built
build_date: "2026-09-17"
build_system: cmake

source:
  url: "https://github.com/litespeedtech/lsquic/archive/refs/tags/v4.9.4.tar.gz"
  sha256: "5e3271189cd6bda987982d6f2c73bd307f3f73b2c8bb06ae847eaf0be379b3cd"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "LSQUIC_LIBSSL=OPENSSL"
    - "LSQUIC_BIN=OFF"
    - "LSQUIC_TESTS=OFF"
  dependencies:
    - openssl/3.5.6
    - zlib/1.3.1
  cc: clang 15
  cxx: clang++ 15

patches_applied:
  - "0001-openssl-tls-backend-port.patch: port BoringSSL push-model QUIC TLS API to OpenSSL 3.5+ pull model"

knowledge_gained:
  - "lsquic 4.9.4 源码仅实现 BoringSSL QUIC TLS API（SSL_provide_quic_data/SSL_set_quic_method/EVP_AEAD 系），CMakeLists 的 OpenSSL 检测分支（SSL_set_quic_tls_cbs）源码层未迁移"
  - "OpenSSL 3.5+ 的第三方 QUIC TLS API 是拉模式 OSSL_DISPATCH 六回调（crypto_send/recv_rcd/release_rcd/yield_secret/got_transport_params/alert），需要推拉翻转桥接（参考 ngtcp2 crypto/ossl）"
  - "BoringSSL EVP_AEAD 家族可在 OpenSSL EVP_CIPHER 上重实现；GCM 支持 8-16 字节可变 nonce 与 8-16 字节可变 tag（gQUIC STK 用 12 字节 tag、test_dec 用 16 字节 nonce）"
  - "鸿蒙 musl open_memstream 存在 fclose 前未 fflush 时丢数据缺陷（独立复现：fprintf 后直接 fclose，buffer 为空；fflush 后正常）——影响上游 hcsi_reader 测试"
  - "GitHub release tarball 不含 ls-qpack/lshpack 两个必需 submodule，conanfile source() 需按上游 tag 绑定的 commit 追加官方源"
