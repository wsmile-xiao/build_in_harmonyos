software: libxcb
version: "1.17.0"
status: built
build_date: "2026-08-05"
conan_ref: "libxcb/1.17.0"
build_system: autotools
recipe_revision: "743324d2a2de2fb19f392d4e4b9095a5"

source:
  url: "https://xorg.freedesktop.org/archive/individual/lib/libxcb-1.17.0.tar.xz"
  sha256: "599ebf9996710fea71622e6e184f3a8ad5b43d0e5fa8c4e407123c88a59a6d55"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-selinuxtest"
    - "--disable-docs"
    - "--without-xmlto"
    - "--without-fop"
    - "--without-xsltproc"
    - "--enable-shared"
    - "--disable-static"
  dependencies:
    - "xcb-proto/1.17.0"
    - "libxau/1.0.11"
    - "libxdmcp/1.1.5"
    - "xorgproto/2025.1"
    - "xtrans/1.4.0"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS 下 configure 需 umask 077→022（E002/HMDFS）及 bash shebang 替换"
  - "config.guess 无法识别 HarmonyOS 时，需补充 --build/--host=aarch64-unknown-linux-gnu"
  - "Conan 生成的 xcb-proto.pc 缺少 xcbincludedir/pythondir，需在 generate() 中补回并设置 PYTHONPATH"
  - "上游 make check 中 check_all 依赖 libcheck；未发布时 HAVE_CHECK=no，仅跑 check-pc-requires"
  - "xtrans 以 transitive_headers 引入，向下游 libX11/libXt/libXmu 透传 Xtrans 头"
  - "test_package 在 ohos.toolchain.cmake 下需将 CMAKE_FIND_ROOT_PATH_MODE_PACKAGE 改为 BOTH"
