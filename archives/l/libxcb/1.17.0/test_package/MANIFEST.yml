package: libxcb/1.17.0
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxcb"

# Upstream ships:
#   1. Root-level pkg-config round-trip test: `check-pc-requires`
#      (declared in top-level Makefile.am as `TESTS=check-pc-requires`).
#      A shell script that verifies every `#include <X11/XCB-*.h>` in
#      libxcb's public headers is listed in the corresponding
#      `xcb-*.pc.in`'s `Requires.private:` field. **Runs without an X
#      server** — pure shell + grep, dependency-graph static check.
#      PASS confirmed in our log.
#   2. tests/ subdir: `check_all` (gated by HAVE_CHECK = libcheck >= 0.9.6)
#      with 7 START_TEST cases (parse_display_unix/ip/ipv4/ipv6/decnet/
#      negative + popcount). **Exempt** on this worker: check/0.15.2 is
#      in archives/c/ but not yet published to ohpcd/stable, so
#      PKG_CHECK_MODULES([check]) fails and HAVE_CHECK=no. Per
#      TEST_QUALITY_SPEC §3.3 (平台限制), we declare exemption.
#      When check/0.15.2 is published, uncomment
#      `self.tool_requires("check/0.15.2")` in conanfile.py and the
#      7 cases will compile + run automatically.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "./check-pc-requires"
upstream_tests:
  - name: "check-pc-requires"
    file: "check-pc-requires"
    description: "Shell + grep + sed: walks src/*.h, extracts `#include` directives, and asserts each included xcb-*.h is listed in the corresponding xcb-*.pc.in's `Requires.private:` field. Returns 0 on full coverage. **PASS confirmed on OHOS aarch64.**"
    source_dir: "."
    expected_assertions: 1   # exit 0 / non-zero
  - name: "check_all (HAVE_CHECK gated — EXEMPT)"
    file: "tests/check_all.c + tests/check_public.c + tests/check_suites.h"
    description: "libcheck-driven unit test binary. 7 START_TEST cases: parse_display_unix / ip / ipv4 / ipv6 / decnet / negative + popcount. Exempt on this worker because libcheck/0.15.2 is not yet published to ohpcd/stable; tests/ subdir emits 0 check_PROGRAMS, `make check` is a no-op there."
    source_dir: "tests"
    expected_assertions: 7
    exempt: true
    exempt_reason: "libcheck/0.15.2 in archives/c/check/ but not yet published to ohpcd/stable. PKG_CHECK_MODULES([check]) fails → HAVE_CHECK=no → no test binary built. Will be lifted automatically once check/0.15.2 is built and published."

test_package_tests:
  - file: test.c
    description: |
      Link libxcb and exercise the connection-lifecycle API: xcb_connect to
      a non-listening display, verify xcb_connection_has_error reports an
      error, then xcb_disconnect and confirm it tolerates a NULL handle;
      also touch X_PROTOCOL/X_PROTOCOL_REVISION/X_TCP_PORT constants and
      xcb_parse_display(NULL, NULL).
    command: "test_libxcb"
    # CMakeLists.txt sets CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH to bypass
    # the OHOS toolchain's ONLY restriction and let find_package(libxcb)
    # resolve the conan-generated libxcb-config.cmake under
    # build/.../generators/. See test_package/CMakeLists.txt for context.

assertion_count: 6
