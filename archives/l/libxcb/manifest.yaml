software: libxcb
display: "libxcb"
description: "X C Bindings library"
category: gfx
homepage: "https://xcb.freedesktop.org/"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "OHOS 下 configure 需 umask 022 与 bash shebang 替换（E002）"
    - "依赖 xcb-proto、libxau、libxdmcp、xorgproto、xtrans；构建期用 c_client.py 生成协议代码"
    - "Conan 生成的 xcb-proto.pc 需补 xcbincludedir/pythondir"
    - "xtrans 以 transitive_headers 引入，向下游 libX11/libXt/libXmu 透传 Xtrans 头"
    - "test_package 在 ohos.toolchain.cmake 下需将 CMAKE_FIND_ROOT_PATH_MODE_PACKAGE 改为 BOTH"

versions:
  "1.17.0":
    status: built
    build_date: "2026-08-05"
    conan_ref: "libxcb/1.17.0"
    recipe_revision: "743324d2a2de2fb19f392d4e4b9095a5"
    dependencies:
      - "xcb-proto/1.17.0"
      - "libxau/1.0.11"
      - "libxdmcp/1.1.5"
      - "xorgproto/2025.1"
      - "xtrans/1.4.0"
    test_smoke: "libxcb api smoke ok (6/6 assertions)"
