software: lsusb-laniksj
display: "lsusb-laniksj"
description: "lsusb command for macOS — pure Bash script clone of Linux lsusb"
category: system
homepage: "https://laniksj.github.io/lsusb/"
license: MIT
build_system: none

ohos_adaptation:
  key_points:
    - "Pure Bash script (445 lines): no build system, no libusb dependency, no USB/Linux C APIs — script-only packaging"
    - "macOS probes (system_profiler/sw_vers/ioreg) degrade gracefully on OHOS: empty device list with exit 0, matching Linux lsusb semantics without devices"
    - "Requires real Bash (shopt extglob); /system/bin/sh (mksh) cannot run it — bash resolved via BASH env/PATH/hnp fallback chain"
  common_dependencies: []

versions:
  "1.1.9":
    status: built
    build_date: "2026-09-20"
    conan_ref: "lsusb-laniksj/1.1.9"
