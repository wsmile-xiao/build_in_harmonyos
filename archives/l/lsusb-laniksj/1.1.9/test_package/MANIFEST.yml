package: lsusb-laniksj/1.1.9
homepage: "https://github.com/LanikSJ/lsusb"

upstream_check_command: ""
upstream_test_in_build: true
upstream_test_command: "Upstream has no formal test suite (0 tests); its CI (.github/workflows/lsusb-test.yml) runs a single `./lsusb` on macos-latest — that exact command is executed for real in conanfile build() and again here"

upstream_tests: 0

test_package_tests:
  - file: test_lsusb.py
    description: "Consumer test: package layout (script/executable/shebang/man/license/README), HarmonyOS invariants (script-only ⇒ no ELF NEEDED deps / no host RPATH/RUNPATH, interpreter is AArch64 ELF64, bash >= 4), upstream CI smoke executed for real, and a 10-case CLI behavior matrix (default/-V/-h/-s/-d x2/-t/-v/-p/invalid)"
    command: "python3 test_lsusb.py <package_folder>"

assertion_count: 24
