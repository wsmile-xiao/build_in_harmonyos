# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libjpeg6b/6b2
homepage: "https://www.ijg.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（Makefile.am check-local）
upstream_tests:
  - file: Makefile.am
    source: jpeg-6b2/Makefile.am
    description: "check-local: djpeg 解码 testorig.jpg（ppm + bmp 256 色）、cjpeg 编码 testimg.ppm（基线 + 渐进）、jpegtran 转换 testprog.jpg，共 6 条逐字节 cmp 断言"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 jpeg_stdio_dest/jpeg_stdio_src（jpeg-6b 无 mem API）完成 RGB 图像文件编码-解码往返，校验输出大小、SOI 标记、几何尺寸与像素误差"
    command: "./test_libjpeg6b"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
