version: "6b2"
status: built
build_date: "2026-09-15"
conan_ref: "libjpeg6b/6b2"

source:
  url: "https://deb.debian.org/debian/pool/main/libj/libjpeg6b/libjpeg6b_6b2.orig.tar.gz"
  sha256: "6d2be0db82dda2e50c908b72aa22ed8cf42cc5aa5ae5f2b081498be6ef16eabc"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch - HarmonyOS 平台识别（E007，guess/sub 双补丁之一）"
  - "0002-config.sub.patch - aarch64 与 linux-ohos 三元组识别（E007，guess/sub 双补丁之二）"
  - "0003-configure-umask.patch - HMDFS umask 限制修复（E011）"

knowledge_gained:
  - "6b2 的 config.guess 与 config.sub 均为 2009-11-20 版：guess 无 HarmonyOS 分支；sub 的 maybe_os 列表不认识 linux-ohos、CPU 列表不认识 aarch64，双补丁缺一不可（E007）。补丁后 config.sub 对 aarch64-unknown-linux-ohos 的规范化结果与 2024-05-27 版一致"
  - "E011: configure（autoconf 2.65 生成，13700/13705 行）用 umask 077 创建临时目录，HMDFS 下 config.status 无法写入，改为 umask 022"
  - "SONAME libjpeg.so.62 与 libjpeg-turbo 的 classic ABI 冲突（R26），仅构建静态库 libjpeg.a"
  - "jmorecfg.h typedef int boolean：消费方不得再 include stdbool.h，否则类型冲突；test_package 特意不包含 stdbool.h"
  - "jpeg-6b 无 jpeg_mem_src/jpeg_mem_dest（jpeg-8 才加入），test_package 使用 jpeg_stdio_dest/jpeg_stdio_src 临时文件往返"
  - "上游 make check = check-local：djpeg/cjpeg/jpegtran 共 6 条编解码 + 逐字节 cmp 断言，已集成到 build()"
  - "make 必须全程 -j1：HMDFS 不支持 make jobserver 的 mkfifo（Operation not permitted）；且上游 install 规则的 install-data-local 与 install-includeHEADERS 并发竞态创建 $(includedir)，install-sh 对竞态 EEXIST 直接报错（并行 make install 失败，串行通过）"
