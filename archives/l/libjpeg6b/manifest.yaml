software: libjpeg6b
display: "libjpeg6b"
description: "IJG jpeg-6b 参考实现的 JPEG 图像编解码库（Debian 维护谱系，含 CVE-2013-6629/6630 修复）"
category: gfx
homepage: "https://www.ijg.org/"
license: IJG
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 与 config.sub 均需补丁（2009-11-20 版：无 HarmonyOS 分支、不认识 aarch64/linux-ohos）"
    - "configure 的 umask 077 需改为 022，规避 HMDFS 临时目录权限限制"
    - "SONAME libjpeg.so.62 与 libjpeg-turbo 冲突，仅构建静态库（R26）"
    - "头文件与 libjpeg 包同名，消费方二选一，不可同时链接"
    - "jmorecfg.h typedef int boolean，消费方勿 include stdbool.h"
  common_dependencies: []

versions:
  "6b2":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libjpeg6b/6b2"
