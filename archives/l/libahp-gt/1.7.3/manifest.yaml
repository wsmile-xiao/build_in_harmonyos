software: libahp-gt
version: "1.7.3"
status: built
build_date: "2026-09-19"
build_system: cmake
conan_ref: "libahp-gt/1.7.3"

source:
  url: "https://deb.debian.org/debian/pool/main/liba/libahp-gt/libahp-gt_1.7.3.orig.tar.gz"
  sha256: "c068767b8e93c8cf0a509b3d1361134f09286509634bfae447dfd3526f165019"
  tar_format: tar.gz

build:
  system: cmake
  build_command: "cmake -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_C_FLAGS=-Wno-error=return-type && cmake --build"
  dependencies: []
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "none（上游无测试；库通过串口驱动硬件控制器）"
  upstream_discovered: 0
  upstream_passed: 0
  upstream_failed: 0
  upstream_note: "上游无测试套件：getter/setter 多由 ahp_gt_is_detected() 守卫，无硬件时为空操作"
  test_package_passed: 10
  test_package_failed: 0
  test_package_assertions: 10
  execution: "conan create rc=0 + 消费者 10 条断言（均为无硬件时定义良好的 API）"

test_passed: 10
test_failed: 0

patches_applied: []

knowledge_gained:
  - "clang 15 起 C 语言的 -Wreturn-type 默认是错误（gcc 只是警告）：上游 ahp_gt.c 有几十处非 void 函数里裸 return;，用 -Wno-error=return-type 降级为警告即可，无需改动上游几十行代码"
  - "cmake_minimum_required(2.6) 的旧工程在新 CMake（3.27+）下直接报错 → 注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（libftdi 同法）"
  - "CMakeLists 里 execute_process(doxygen ...) 在无 doxygen 时会打印错误但不会中断配置；生成头 ahp_gt.h 来自 ahp_gt.h.cmake，安装到 include/ahp/"
  - "版本宏是 0x${MAJOR}${MINOR}${RELEASE} 的十进制拼接，1.7.3 => 0x173（不是 0x010703）；消费者断言据此校准"
  - "无硬件的库：只断言未受 is_detected() 守卫的 API（debug level、app name、axes limit、get_fd==-1、is_connected==0），避免把上游的守卫式 no-op 当成失败"
