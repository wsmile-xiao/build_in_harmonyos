# test_package/MANIFEST.yml
# libahp-gt 1.7.3.
#
# Upstream ships no test suite: the library drives an AHP GT stepper controller
# over a serial port (or UDP), which cannot be exercised without hardware.  The
# consumer program pins the deterministic parts of the public API instead.

package: libahp-gt/1.7.3
homepage: https://github.com/iliaplatone/libahp-gt

upstream_tests_exist: false
upstream_test_audit: "no tests/ directory, no check target: the project is a single C file (ahp_gt.c) plus a CMake generated header"
upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_ahp_gt.c
    description: "version constant 1.7.3, debug level / app name / observer location / time offset / controller address round trips, disconnected state, failed connect to a missing port, RA-Dec <-> Alt-Az conversion and round trip"
    command: "./libahp_gt_consumer"

test_files:
  - path: "test_package/test_ahp_gt.c"
    test_type: "R34"
    assertion_count: 10

test_package_test_count: 1
consumer_assertion_count: 10
assertion_count: 10
