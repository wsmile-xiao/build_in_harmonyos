    description: "消费者功能测试: 真实调用 libbde 公共 API (版本查询/访问标志/代码页往返/通知开关/卷对象创建释放, 8 项断言)"
    command: "ctest --output-on-failure (运行 test_libbde)"

# 测试断言总数 (test_package 8 项断言; 上游 24 个 bde_test_* 单元由 build() 直接执行, 3 驱动中的 test_bdeinfo.sh 需外部固件故恒 SKIP)
