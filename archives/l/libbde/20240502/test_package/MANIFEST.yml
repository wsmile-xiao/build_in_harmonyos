# test_package/MANIFEST.yml — libbde 20240502
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libbde/20240502
homepage: "https://github.com/libyal/libbde"

# 上游测试命令: tests/Makefile.am 注册的 automake 测试套件
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试, 并输出 HMBS_UPSTREAM_TEST_RESULT
upstream_test_in_build: true
upstream_test_command: "make check TESTS= build + direct run of 24 bde_test_* binaries (no input fixtures in release tarball; native make check only when tests/input present)"

# 上游测试套件审计结论:
# tests/Makefile.am (tag 20240502) 定义 24 个 check_PROGRAMS (bde_test_* C 单元程序)
# 与 3 个 TESTS shell 驱动 (test_library.sh / test_tools.sh / test_bdeinfo.sh),
# 合计 27 个测试单元, 全部经 `make check` 在真机完整执行。
# test_python_module.sh 仅在 HAVE_PYTHON_TESTS 启用时才加入 TESTS,
# 默认构建不启用, 故不计入发现数。
upstream_tests_exist: true
upstream_test_audit:
  - path: "tests/Makefile.am (check_PROGRAMS)"
    finding: "定义 24 个 bde_test_* C 单元测试程序 (aes_ccm_encrypted_key / encryption_context / error / external_key / io_handle / key / key_protector / metadata / metadata_block_header / metadata_entry / metadata_header / notify / password / password_keep / sector_data / sector_data_vector / stretch_key / support / tools_info_handle / tools_output / tools_signal / volume / volume_header / volume_master_key), 每个直连 ../libbde/libbde.la 做白盒验证"
  - path: "tests/Makefile.am (TESTS)"
    finding: "默认注册 3 个 shell 驱动: test_library.sh / test_tools.sh / test_bdeinfo.sh; test_python_module.sh 仅 HAVE_PYTHON_TESTS 条件分支才注册, 默认构建不启用"
  - path: "tests/test_library.sh"
    finding: "按顺序执行全部 bde_test_* 二进制并汇总结果, 为 `make check` 的主入口之一"
  - path: "tests/test_tools.sh / tests/test_bdeinfo.sh"
    finding: "test_tools.sh 覆盖 bdetools 通用输出/信号处理; test_bdeinfo.sh 为 bdeinfo 终端端到端驱动, 无 input/ 固件时按上游设计 exit 77 SKIP (CI #48211 实测 2 PASS + 1 SKIP)"
  - path: "tests/Makefile.am (EXTRA_DIST)"
    finding: "EXTRA_DIST 仅含 check_SCRIPTS, 不含 tests/data; 发布包 tests/input 目录天然缺失, 故 test_bdeinfo.sh 在 release tarball 下恒为 SKIP, 非 OHOS 缺组件; build() 在此常规情形下经 make check TESTS= 构建后直接执行全部 24 个 bde_test_* 二进制 (与 test_library.sh/test_tools.sh 无输入模式的断言相同, 零 SKIP), 仅当检测到非空 tests/input 时才跑原生 3 驱动 make check"
  - path: "tests/data"
    finding: "上游 Git 仓有 tests/data 固件目录, 但 release tarball 的 EXTRA_DIST 未将其打包 (CI 实测无 tests/input), 端到端固件需外部提供; 无固件时 24 个单元二进制仍可完整执行"

upstream_tests:
