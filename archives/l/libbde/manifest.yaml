software: libbde
display: "libbde — BitLocker Drive Encryption Library"
description: "访问 BitLocker 驱动器加密 (BDE) 卷格式的 C 库, 含 bdeinfo/bdemount 终端工具"
category: forensics
homepage: "https://github.com/libyal/libbde"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GNU config.guess 不识别 HarmonyOS, 需内联添加 HarmonyOS 检测分支 (E007, 与同门 libesedb 相同)"
    - "config.sub 需添加 ohos-linux/ohos* OS 模式支持 (E007)"
    - "HMDFS 文件系统 umask 077 导致 config.status 权限拒绝, 需替换为 umask 022 (E011)"
    - "bindtextdomain 在独立 libintl 中, 需链接 gettext 0.26 的 -lintl (E053)"
    - "静态构建: --enable-static --disable-shared; 无外部 Conan 依赖"
  common_dependencies: []

versions:
  "20240502":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libbde/20240502"
