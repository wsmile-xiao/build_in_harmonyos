software: libkexiv2
display: "KExiv2"
description: "KDE 对 Exiv2 的封装库——以 Qt/QImage 友好的接口读写图片 EXIF/IPTC/XMP 元数据"
category: graphics
homepage: "https://invent.kde.org/graphics/libkexiv2"
license: BSD-3-Clause AND GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "无源码补丁：26.04.0 源码原样构建，仅调整 Conan 侧依赖注入"
    - "不使用 CMakeDeps：qtbase 为 cmake_find_mode=none，exiv2 使用包内上游 exiv2Config.cmake（正是它定义项目要链接的 Exiv2::exiv2lib）"
    - "CMAKE_FIND_PACKAGE_PREFER_CONFIG 刻意不设置：置 ON 会让 exiv2 静态闭包 $<LINK_ONLY:EXPAT::EXPAT> 解析失败（conan 的 expat-config.cmake 只导出 expat::expat）"
    - "OHOS 加载器不能通过软链接加载共享库（E018/E511）：依赖的 soname 别名被复制实体化到私有 runtime-libs/ 并前置 LD_LIBRARY_PATH"
    - "上游 tests/ 无自动化测试（ctest 注册 0，7 个演示程序），build() 中 7/7 真实执行"
  common_dependencies:
    - "qtbase/6.11.1"
    - "exiv2/0.28.7"
    - "ecm/6.26.0"

versions:
  "26.04.0":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libkexiv2/26.04.0"
