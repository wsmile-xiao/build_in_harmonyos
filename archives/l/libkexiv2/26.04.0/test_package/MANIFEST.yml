# test_package/MANIFEST.yml
# Upstream and consumer test declaration for libkexiv2/26.04.0.

package: libkexiv2/26.04.0
homepage: https://invent.kde.org/graphics/libkexiv2

upstream_check_command: "ctest --test-dir <build_folder> -N"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> -N (0 registered tests); then, from <build_folder>/bin: erasetag <sample.jpg>, loadfromba <sample.jpg>, printtagslist, readimagewritexmpsidecar <sample.jpg>, setiptcpreview <sample.jpg>, setxmpface add <sample.jpg>, usexmpsidecar <sample.jpg>"

upstream_tests:
  - file: tests/
    source: libkexiv2-26.04.0/tests/
    description: "libkexiv2 upstream tests/ directory holds 7 demo programs (erasetag, loadfromba, printtagslist, readimagewritexmpsidecar, setiptcpreview, setxmpface, usexmpsidecar) and its CMakeLists.txt only declares add_executable() targets. Upstream ships NO automated test: there is no add_test(), no enable_testing() call driven by the project and no assertion framework anywhere in the tree, so the CTest registry is empty."
    command: "ctest --test-dir <build_folder> -N  # reports 0 registered tests; the 7 demo binaries are then executed by build()"
    condition: "run in the Conan build with BUILD_TESTING=ON; all 7 binaries are executed against an 8x8 JPEG fixture that the recipe writes (upstream ships no fixture); per-tool exit codes are recorded in <build_folder>/upstream_test_result.json"

test_package_tests:
  - file: test_package/test_package.cpp
    description: "Consumer test: writes a JPEG fixture with Qt and drives the KExiv2 API - version()/Exiv2Version(), supportXmp(), supportMetadataWritting(image/jpeg), canWriteExif(), the StdExif/Makernote/IPTC registries, an EXIF write+applyChanges+reload round trip (Exif.Image.Artist, Exif.Image.ImageDescription), the date/time convenience round trip (setImageDateTime/getImageDateTime) and an XMP write+reload round trip (Xmp.xmp.Label), plus EXIF tag removal reflected after reload."
    command: "conan create (test_package builds and runs test_package)"

assertion_count: 24
