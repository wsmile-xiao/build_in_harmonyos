knowledge_gained:
  - "The HarmonyOS loader refuses to load a shared library that is reached through a symlink: libQt6Core.so.6 -> libQt6Core.so.6.11.1 from the qtbase package fails with 'Error loading shared library libQt6Core.so.6' while a copy of the same bytes loads fine. Both the configure step (ECM's ecm_query_qt runs qtpaths) and the upstream demo programs need the aliases materialised as regular files in a private runtime-libs directory prepended to LD_LIBRARY_PATH. knowledge_ref: E018, E511 (materialize-versioned-so-aliases)."
  - "libkexiv2's src/CMakeLists.txt links the exiv2 CMake config target Exiv2::exiv2lib, whose static closure is spelled $<LINK_ONLY:EXPAT::EXPAT> / $<LINK_ONLY:ZLIB::ZLIB>: CMAKE_FIND_PACKAGE_PREFER_CONFIG must stay unset so the nested find_dependency(EXPAT) resolves through CMake's module-mode FindEXPAT (which creates EXPAT::EXPAT); with CONFIG preferred it picks up the conan expat-config.cmake (only expat::expat) and generate fails with 'The link interface of target Exiv2::exiv2lib contains: EXPAT::EXPAT but the target was not found'. ECM_MODULE_PATH needs no injection because the ecm package's own ECMConfig.cmake sets it. knowledge_ref: E543-draft-B188."
  - "With the ECM/CMake combination in use ecm_setup_version() generates libkexiv2_version.h with 5.1.0 but does not publish KEXIV2_VERSION/KEXIV2_SOVERSION to the calling scope, so the project's own set_target_properties(VERSION/SOVERSION) sets neither; together with the missing Platform/HarmonyOS CMake module (CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG empty) the library is produced without DT_SONAME and fails the CI L5a gate. Providing KEXIV2_VERSION/KEXIV2_SOVERSION through the toolchain (loaded before project(), visible in src/) plus the -Wl,-soname, flags restores it. knowledge_ref: DRAFT-libharu-2.3.0-missing-dt-soname."
  - "CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE (Android platform precedent) yields an unversioned SONAME: the package ships a single libKExiv2Qt6.so with DT_SONAME=libKExiv2Qt6.so and no symlink chain, which satisfies L5a and avoids the loader's symlink limitation in one step. The demo programs then record the plain DT_NEEDED 'libKExiv2Qt6.so', so KDE's single-dir <build>/bin (library next to the executables, no RPATH) must be on LD_LIBRARY_PATH. knowledge_ref: DRAFT-libharu-2.3.0-missing-dt-soname."


