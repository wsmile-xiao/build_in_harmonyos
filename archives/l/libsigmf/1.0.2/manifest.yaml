# 版本级 manifest - libsigmf 1.0.2
# 文件位置: archives/l/libsigmf/1.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0.2"
software: "libsigmf"
status: built
build_date: "2026-09-17"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/deepsig/libsigmf/archive/refs/tags/v1.0.2.tar.gz"
  sha256: "dafa185c46e7295dac122a12a7b13763f67abdec7b707c3711060ccb4cfd78b2"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DUSE_SYSTEM_JSON=ON"
    - "-DUSE_SYSTEM_FLATBUFFERS=ON"
    - "-DENABLE_EXAMPLES=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - nlohmann_json/3.12.0
    - flatbuffers/25.12.19
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only + package_id 恒定（self.info.clear()），无 shared/fPIC 选项"
  - "发布 tarball 不含 submodule 内容（external/* 为空目录），必须 -DUSE_SYSTEM_JSON=ON -DUSE_SYSTEM_FLATBUFFERS=ON 走 Conan 依赖"
  - "flatc 由 flatbuffers 依赖的 bindir 提供，build() 内把依赖 bindirs 前置到 PATH"
  - "顶层 CMakeLists 未调 enable_testing，ctest 仅清点；2 个 add_test 示例二进制在 build() 内直接运行"
