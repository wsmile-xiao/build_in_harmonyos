# test_package/MANIFEST.yml - libsigmf 1.0.2
# 上游官方测试声明 + 消费者测试账本

package: libsigmf/1.0.2
homepage: "https://github.com/deepsig/libsigmf"

# 上游存在测试（examples/CMakeLists.txt 注册 2 个 add_test；README 声明
# "Formal test code is still a WIP, examples provide some code coverage"），
# 必须在真机接入执行，不可用 no_tests 替代。
upstream_tests_exist: true

# 上游测试命令（worker stock CMake 无法完成 HarmonyOS 编译器探测，
# 故不用 cmake 构建：build() 内以 profile clang++ -std=c++17 直接编译
# 两个已注册示例源码（含 Conan flatc 按上游 flags 再生成的头文件），
# 不定义 NDEBUG 使 assert 精确比对保持生效，再直接运行二进制）
upstream_check_command: "direct-compile examples with profile clang++"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "compile examples/example_record_with_variadic_dataclass.cpp + examples/example_record_with_multiple_namespaces.cpp with profile clang++ and execute both binaries"

# 上游实际运行的测试程序
upstream_tests:
  - file: examples/example_record_with_variadic_dataclass.cpp
    source: libsigmf-1.0.2/examples/example_record_with_variadic_dataclass.cpp
    description: "上游 add_test simple_variadic_sigmf_to_json：单 core 命名空间建记录并比对精确 JSON 输出"
    command: "./example_record_with_variadic_dataclass"
  - file: examples/example_record_with_multiple_namespaces.cpp
    source: libsigmf-1.0.2/examples/example_record_with_multiple_namespaces.cpp
    description: "上游 add_test simple_variadic_2ns_sigmf_to_json：core+antenna+signal 多命名空间建记录并比对精确 JSON 输出"
    command: "./example_record_with_multiple_namespaces"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libsigmf.cpp
    description: "消费者测试：core+antenna 建记录、JSON 序列化键检查、from_json 回环，共 6 处显式运行时检查（不用 assert，Release/NDEBUG 下依然有效）"
    command: "./test_libsigmf"

# 测试断言总数（test_package 6 处显式检查）
assertion_count: 6

# 机器可读消费者账本
consumer_tests: 1
consumer_passed: 1
consumer_assertions: 6

# 上游测试账本（add_test 注册 2 项，build() 内全部直接运行）
upstream_static_total: 2
upstream_executed: 2
upstream_passed: 2
upstream_failed: 0
upstream_skipped: 0
