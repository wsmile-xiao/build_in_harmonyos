software: libsigmf
display: "libsigmf"
description: "Header-only C++ library for working with SigMF metadata"
category: data
homepage: "https://github.com/deepsig/libsigmf"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only，无需编译库二进制；package_id 恒定"
    - "发布包不含 submodule，用 Conan 制品仓的 nlohmann_json + flatbuffers（USE_SYSTEM_*=ON）"
    - "flatc 由 flatbuffers 依赖提供，2 个上游示例测试在 build() 内直接运行"
  common_dependencies:
    - nlohmann_json
    - flatbuffers

versions:
  "1.0.2":
    status: built
    build_date: "2026-09-17"
