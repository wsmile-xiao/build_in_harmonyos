# 软件级 manifest — libkysdk-applications
# 文件位置: archives/l/libkysdk-applications/manifest.yaml
software: libkysdk-applications
display: "libkysdk-applications (openKylin kdk application SDK)"
description: >
  openKylin application-level SDK: the kdk:: Qt extension widget set
  (qtwidgets) plus the alm / ukenv / widgetutils helper libraries.
category: library
homepage: "https://gitee.com/openkylin/libkysdk-applications"
license: LGPL-3.0
build_system: qmake

ohos_adaptation:
  key_points:
    - "两代 Qt 适配并存：3.0.1.2 是 Qt5 构建（qt5-qtbase/5.15.2.2），3.0.1.2.1 是 Qt6 构建（qtbase-sql-dbus/6.11.1）。二者 ABI 不兼容，下游 Qt6 消费者必须用 3.0.1.2.1。"
    - "裁剪三个 OHOS 不可得依赖链的模块：kysdk-waylandhelper / kysdk-kabase / kysdk-appconf2。"
    - "kysdk-qtwidgets 去掉 X11/xcb/KWindowEffects/gsettings-qt6/waylandhelper（xatom-helper 与 SVG 渲染 stub）。"
    - "QGSettings 只允许出现在私有 .cpp：公共头（kswitchbutton.h / themeController.h）改为前向声明，否则消费者会与真实的 gsettings-qt 头冲突（class QGSettings 重定义）。"
    - "安装布局必须同时提供 include 与 include/kysdk/applications 两个 -I，才能同时满足 #include <kwidget.h> 与 #include <kysdk/applications/kwidget.h>。"
    - "不执行 make install（上游 target.path 指向 $$[QT_INSTALL_LIBS] 与 /usr/include），由 package() 从构建树 staging，保证可重定位。"
  common_dependencies:
    - qtbase-sql-dbus

versions:
  "3.0.1.2.1":
    status: built
    build_date: "2026-10-01"
    conan_ref: "libkysdk-applications/3.0.1.2.1"
    note: "Qt6 build (qtbase-sql-dbus/6.11.1); unblocks kylin-nm-plugin/4.0.0.1"
  "3.0.1.2":
    status: published
    build_date: "2026-09-26"
    conan_ref: "libkysdk-applications/3.0.1.2"
    note: "Qt5 build (qt5-qtbase/5.15.2.2); kept for the Qt5 consumers, untouched"
