# test_package 中自带的测试 (消费者视角验证)
# 与上游测试的关系: test_package 的 build() 直接编译运行上述 4 个可构建
# 上游测试目标（qmake + qt5-qtbase），test() 探针断言 QTest 日志
# "Totals: N passed, 0 failed"（真实执行，非静态检查）。
# 消费者 dlopen 实测在 build() 阶段用 C 辅助程序 dlopen_check.c（普通 exec
# 二进制，编译后运行）以构建 uid（产物属主 20001006）上下文严格执行（任一
# dlopen 失败即 build 失败，无 ELF 魔数回退，R9/R34）：python3 经 AppSpawn
# 恒为 app uid（20020101/20020102，连 build() 阶段亦然 #49701 实证），HMDFS
# 缓存产物属主 20001006、mode 750（other 位被裁），跨 uid 读取恒 EACCES 且
# chown/chmod（含属主上下文 #49714 实证）均静默无效——test() 无法 dlopen，
# 仅做存在性/头文件检查。
test_package_tests:
  - file: conanfile.py
    description: "build()：get() 上游 3.0.1.2 源码 → 应用 0002/0005 补丁 → qmake 编译运行 test-alm/test-qtwidget/test-ukenv/test-widgetutils（82 用例）→ QTest 日志 → 消费者 dlopen 实测（dlopen_check.c C 辅助程序，构建 uid 属主上下文，严格无回退）；test()：探针做存在性/头文件检查 + 断言 4 份日志全部通过（test() 为只读 app uid，跨 uid dlopen 恒 EACCES，见上）"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 249 用例中 82 可真实执行（4 目标）；167 随被裁模块申报不可运行
assertion_count: 82
