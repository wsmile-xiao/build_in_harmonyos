#    选择器会阻塞等待交互，且该调用无断言价值）
# 2. tests/test-ukenv/ukenvtest.cpp — 移除 gsettingmonitorTest（依赖 QGSettings/
#    gsettings-qt6，随 kysdk-ukenv 的 gsettingmonitor 模块整体裁剪）
  - name: test-ukenv (QTest, QTEST_APPLESS_MAIN, kysdk-ukenv)
    location: tests/test-ukenv/ukenvtest.cpp
    count: 2
    runnable: true
    note: "上游 3 用例，gsettingmonitorTest 依赖 QGSettings（gsettings-qt6 不可得）随模块裁剪；usermanualTest/currencyTest 真实执行"
  - name: test-widgetutils (QTest, QTEST_APPLESS_MAIN, kysdk-widgetutils)
    location: tests/test-widgetutils/widgetutilstest.cpp
    count: 1
    runnable: true
    note: "test_package build() qmake 编译运行，QTest 日志断言"
  - name: test-appconf2 (QTest, kysdk-appconf2)
    location: tests/test-appconf2/appconftest.cpp
    count: 1
    runnable: false
    note: "kysdk-appconf2 依赖 kysdk-config（KSettings）制品仓不可得，模块裁剪"
  - name: test-kabase (QTest, kysdk-kabase)
    location: tests/test-kabase/kabasetest.cpp
    count: 15
    runnable: false
