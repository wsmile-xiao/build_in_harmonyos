sources:
  "3.0.1.2":
    url: "https://deb.debian.org/debian/pool/main/libk/libkysdk-applications/libkysdk-applications_3.0.1.2.orig.tar.xz"
    sha256: "57ea0648ed4f6e3f7d29db75ff3363e7ff958e48b4047bda5e5aa4d519ab1777"
    tar_format: tar.xz

patches:
  "3.0.1.2":
    - patch_file: "patches/0001-cut-waylandhelper-kabase.patch"
      patch_type: "portability"
      patch_description: "裁剪 kysdk-waylandhelper/kysdk-kabase/kysdk-appconf2 模块（依赖 wayland-client/xcb/X11/KF6WindowSystem/kysdk-config 等 OHOS 不可得依赖链）"
      strip: 1
    - patch_file: "patches/0002-qtwidgets-cut-x11-waylandhelper.patch"
      patch_type: "portability"
      patch_description: "kysdk-qtwidgets 裁剪 X11/xcb/KWindowEffects/gsettings-qt6/waylandhelper 依赖（xatom-helper stub 空实现 + blur/UKUI 装饰调用去除）"
      strip: 1
    - patch_file: "patches/0003-alm-drop-kf6.patch"
      patch_type: "portability"
      patch_description: "kysdk-alm 移除 KF6WindowSystem PKGCONFIG 依赖"
      strip: 1
    - patch_file: "patches/0004-ukenv-widgetutils-drop-gsettings.patch"
      patch_type: "portability"
      patch_description: "kysdk-ukenv 裁剪 gsettingmonitor（QGSettings 依赖）、kysdk-widgetutils 去除 gsettings-qt6 并 stub QGSettings 合成器探测"
      strip: 1
    - patch_file: "patches/0005-tests-drop-unavailable-deps.patch"
      patch_type: "portability"
      patch_description: "tests/ 测试目标裁剪 KWindowSystem/-lgcov/-lX11/gsettings-qt6/x11/KF6WindowSystem 与 waylandhelper 引用，ukenvtest 移除 gsettingmonitor 用例"
      strip: 1
