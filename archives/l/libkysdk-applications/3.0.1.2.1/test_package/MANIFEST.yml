# test_package/MANIFEST.yml — libkysdk-applications 3.0.1.2.1 (Qt6 build)
#
# CI (ci/conan/build_and_test.sh L0e) requires this file to exist.
#
# This revision is a Qt6 re-target whose purpose is to satisfy the downstream
# contract of the Qt6 applet kylin-nm-plugin/4.0.0.1 (pkg-config module
# `kysdk-applications`, the kdk:: widget headers and libkysdk-qtwidgets).
# The L1 test below is therefore a *consumer* program that links the installed
# package and really uses those widgets — it is not the upstream QTest suite.

package: libkysdk-applications/3.0.1.2.1
homepage: "https://gitee.com/openkylin/libkysdk-applications"

# ── upstream test inventory (R51 declaration, counted from the source tree) ──
# upstream_test_counts: tests/ holds 7 QTest targets; counts are the number of
# `private slots:` test methods declared in each test .cpp.
upstream_test_inventory:
  total_targets: 7
  total_slots: 122
  targets:
    - name: tests/test-alm
      slots: 3
      buildable_with_qt6: true
      status: "measured: built + ran, FIVE passes (3 slots + initTestCase/cleanupTestCase), 0 failed, rc=0"
    - name: tests/test-qtwidget
      slots: 76
      buildable_with_qt6: true
      status: "measured: built + ran under QT_QPA_PLATFORM=offscreen; 2 passes then the run blocks (rc=124 after a 90 s cap) because GUI cases open modal dialogs (QFileDialog/QMessageBox exec) with no real dialog service headless"
    - name: tests/test-widgetutils
      slots: 1
      buildable_with_qt6: false
      status: "qmake aborts: `CONFIG += testcase` reaches mkspecs/features/qt_functions.prf:254 where QMAKE_HOST.os (=HarmonyOS in the qtbase-sql-dbus Qt 6 build) is not in the recognised OS list -> 'Project ERROR: Operating system not supported.'"
    - name: tests/test-ukenv
      slots: 3
      buildable_with_qt6: false
      status: "same qmake `testcase`/QMAKE_HOST.os limitation as test-widgetutils"
    - name: tests/test-appconf2
      slots: 1
      buildable_with_qt6: false
      status: "module kysdk-appconf2 is cut on OHOS (needs kysdk-config/KSettings, not available) -> test cut with the module"
    - name: tests/test-kabase
      slots: 15
      buildable_with_qt6: false
      status: "module kysdk-kabase is cut on OHOS (systemd/kylog/kyconf/gsettings-qt6/x11/KF6WindowSystem chain unavailable)"
    - name: tests/test-wayland
      slots: 23
      buildable_with_qt6: false
      status: "module kysdk-waylandhelper is cut on OHOS (wayland-client/server, xcb, KWaylandClient unavailable)"

# Was the upstream suite wired into this recipe's `build()`?  No — the Qt6
# `testcase` mkspec gap above would make 2 of the 4 buildable targets fail at
# configure time.  The measurements are recorded (and reproduced in
# reports/upstream-tests.md); the CI-visible L1 test is the consumer probe.
upstream_test_in_build: false
upstream_test_command: ""

# ── the L1 test shipped by this archive ────────────────────────────────────
# conanfile.py build():
#   * `pkg-config --cflags/--libs kysdk-applications` on the INSTALLED package
#     and asserts the two -I flags of the contract are emitted;
#   * compiles probe.cpp with exactly those flags (plus the Qt 6 include dirs);
#   * runs the probe, which dlopen(RTLD_NOW)s all four shipped .so and really
#     constructs kdk::KSwitchButton / KBorderlessButton / KTabBar /
#     KPasswordEdit / KDialog / KWidget.
# conanfile.py test():
#   * runs the very same probe binary again against the installed artifacts, and
#   * re-checks the install layout (.so names, the six contract headers, and the
#     -I flags inside kysdk-applications.pc).
test_package_tests:
  - file: probe.cpp
    description: >
      real consumer program: dlopen(RTLD_NOW) libkysdk-qtwidgets/alm/ukenv/widgetutils,
      then constructs and exercises the kdk:: widget classes through BOTH header
      spellings (<kwidget.h>/<kpasswordedit.h> and <kysdk/applications/kdialog.h>)
  - file: conanfile.py
    description: >
      build(): pkg-config contract assertion + compile + run the probe;
      test(): run the probe again + install-layout assertions

# approximate assertion count of the shipped L1 test (R34 real checks)
assertion_count: 12
