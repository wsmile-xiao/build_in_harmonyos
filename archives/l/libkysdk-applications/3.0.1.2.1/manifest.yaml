# 版本级 manifest — libkysdk-applications 3.0.1.2.1 (Qt6 build, HarmonyOS PC)
version: "3.0.1.2.1"
software: "libkysdk-applications"
status: built
build_date: "2026-10-10"
build_system: qmake

source:
  url: "https://deb.debian.org/debian/pool/main/libk/libkysdk-applications/libkysdk-applications_3.0.1.2.orig.tar.xz"
  sha256: "57ea0648ed4f6e3f7d29db75ff3363e7ff958e48b4047bda5e5aa4d519ab1777"
  tar_format: tar.xz

build:
  system: qmake
  configure_options:
    - "qmake6 kysdk-application.pro -spec harmonyos-clang"
    - "make -jN   (shadow build; no `make install`, package() stages the tree)"
    - "KYSDK_QTSVG_INCLUDE / KYSDK_QTSVG_LIBDIR / KYSDK_GSETTINGS_INCLUDE / KYSDK_GSETTINGS_LIBDIR exported by conanfile.build()"
  dependencies:
    - qtbase-sql-dbus/6.11.1   # Qt6 Core/Gui/Widgets/Network/DBus/Sql
    - qtsvg/6.11.1             # Qt6Svg  (SVG icon rendering, restored)
    - gsettings-qt/1.1.1       # Qt6 QGSettings bindings (restored)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-0072-*.patch (see conandata.yml)"
  note: >-
    72 patches, regenerated with `ohc-run.py refresh-patch --auto` against
    orig_dir = pristine upstream 3.0.1.2 tarball and work_dir = the final adapted
    tree; the set reproduces the work tree byte-for-byte (verified by applying
    every patch in order to a fresh copy of the tarball).  Every direct
    dependency appears in cpp_info.requires.
  kept_cuts:
    - "kysdk-appconf2 / kysdk-waylandhelper / kysdk-kabase modules"
    - "X11 / xcb / KWindowEffects / UKUI-decoration / waylandhelper calls inside kysdk-qtwidgets (xatom-helper reduced to API-preserving no-ops)"
    - "KF6WindowSystem inside kysdk-alm (KX11Extras -> QWidget::activateWindow)"
    - "the matching tests/ target dependencies"
  restored_qt6_capabilities:
    - "QWidget::setAccessibleName/setAccessibleDescription + KCustomTabBar accessible-name API"
    - "Qt6Svg icon rendering in kcustomdateedit.cpp / klunardateedit.cpp"
    - "Qt6Sql uksc.db lookup in kuninstalldialog.cpp"
    - "QPalette::Accent in themeController.cpp"
    - "QGSettings (gsettings-qt/1.1.1): 49 private .cpp, kysdk-ukenv gsettingmonitor, kysdk-widgetutils compositor probe"

knowledge_gained:
  - "Qt6 QWidget::enterEvent takes QEnterEvent*, not QEvent* — a Qt5-era 'enterEvent(QEvent*) override' fails with 'non-virtual member function marked override hides virtual member function'.  [knowledge_ref: notes.md#findings-1]"
  - "Qt6 QLabel::pixmap() returns a QPixmap by value (Qt5 returned const QPixmap*), so 'QWidget::pixmap() ? ... ->isNull()' patterns must be rewritten by value.  [knowledge_ref: notes.md#findings-2]"
  - "Do NOT carry a Qt5-era reduction into a Qt6 build: QWidget::setAccessibleName/setAccessibleDescription, QPalette::Accent (Qt6.2), Qt6Svg, Qt6Sql and QGSettings all exist on the OHOS Qt6 stack and must be restored, not stubbed.  A stub is only acceptable where the dependency is genuinely unavailable, and then the real reason must be stated.  [knowledge_ref: notes.md#findings-3]"
  - "Qt6Svg ships in its OWN Conan package (qtsvg/6.11.1): `QT += svg` cannot be used because the module .pri resolves its include base against the qtbase prefix; the qtsvg include/lib prefix must be injected explicitly (env var consumed by the .pro).  The Qt6Core/Gui .pc files shipped inside qtbase-sql-dbus also carry a stale absolute prefix, so pkg-config is not usable for the Qt6 modules.  [knowledge_ref: notes.md#findings-4]"
  - "qtsvg/6.11.1 (=> plain qtbase/6.11.1) and qtbase-sql-dbus/6.11.1 coexist in the same graph — the pattern the sibling recipes kirigami/6.18.0 and kshisen/26.04.0 use; every direct dependency must appear in the consumer's cpp_info.requires ('gsettings-qt::gsettings-qt'), else conan create fails in package_info().  [knowledge_ref: notes.md#findings-5]"
  - "gsettings-qt/1.1.1 (Qt6) installs qgsettings.h + the `QGSettings` forwarding header under <prefix>/include/<arch>/qt6/QGSettings, so consumers write `#include <QGSettings>`.  The public headers of kysdk-qtwidgets keep QGSettings out (include dropped / forward declaration) so that consumers never need gsettings-qt.  [knowledge_ref: notes.md#findings-6]"
  - "Qt6 on OHOS: QMAKE_HOST.os == 'HarmonyOS', which mkspecs/features/qt_functions.prf does not recognise for the LD_LIBRARY_PATH branch — any .pro with `CONFIG += testcase` aborts with 'Project ERROR: Operating system not supported.'.  [knowledge_ref: notes.md#findings-7]"

patch_generation:
  method: per-file-difflib
  tool: "ohc-run.py refresh-patch --auto"
  source_orig: "pristine upstream 3.0.1.2 tarball (sha256 57ea0648…)"
  generated_at: '2026-10-10T21:47:00'
  patches_count: 72

patch_classification:
  - file: "0001-0072-*.patch"
    type: portability
    platform_only: true
    guard: none
    note: >-
      No patch injects or guards on a platform macro.  Each patch is a cut of a
      genuinely-unavailable OHOS dependency chain, a Qt6 API/ABI port, a
      build-system adaptation, or the restoration of a Qt6 capability.
