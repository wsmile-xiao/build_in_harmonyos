software: libleidenalg
display: "Leiden Community Detection Library"
description: "C++ library of the Leiden algorithm for community detection in networks"
category: library
homepage: "https://github.com/vtraag/libleidenalg"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，依赖 igraph 1.x（igraph/1.0.0 已在仓内）"
    - "上游无测试套件，按 no_tests 路径申报并由 test_package 做真实管线验证"
    - "公开头安装于 include/libleidenalg，消费者需链接 libleidenalg::libleidenalg 与 igraph::igraph"
  common_dependencies:
    - igraph

versions:
  "0.13.0":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libleidenalg/0.13.0"
