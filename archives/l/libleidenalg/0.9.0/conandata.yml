sources:
  url:
    - "https://gh-proxy.com/https://github.com/vtraag/libleidenalg/archive/refs/tags/v0.9.0.tar.gz"
    - "https://github.com/vtraag/libleidenalg/archive/refs/tags/v0.9.0.tar.gz"
  sha256: "ab54651234e4c3b89727b5e6a7b4a8285430ed8326c59d95d45adbb5836268aa"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Drop the igraph 0.10 version floor in find_package so the in-repo igraph/1.0.0 (major 1) is accepted by CMakeDeps' same-major version check; 0.9.0 compiles against igraph 1.x API unchanged"
    patch_type: "portability"
  - patch_file: "patches/0002-include-CMakeLists.txt.patch"
    patch_description: "Add the missing LinearResolutionParameterVertexPartition.h to the installed FILE_SET headers so consumers can resolve angle-bracket sibling includes from the public headers (upstream 0.9.0 shipped 11 headers but installed 10)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-GraphHelper.cpp.patch"
    patch_description: "Adapt igraph_incident/igraph_neighbors calls to igraph 1.x signatures (IGRAPH_LOOPS_TWICE + multiple=true), preserving the 0.9.0 loop multiplicity semantics"
    patch_type: "portability"
