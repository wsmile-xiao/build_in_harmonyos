# test_package/MANIFEST.yml
package: libleidenalg/0.13.0
homepage: "https://github.com/vtraag/libleidenalg"

# 上游源码审计（hmbs 硬门禁）：0.13.0 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "GitHub contents API ref=0.13.0 (root)"
    reason: "根目录仅含 CHANGELOG/CMakeLists.txt/CMakePresets.json/example/include/src 等；无 tests/、test/、testing/ 目录，无 CTestTestfile、pytest.ini、tox.ini、Makefile check 目标。"
  - source: "CMakeLists.txt"
    reason: "67 行：仅 project/find_package(igraph)/add_subdirectory(src,include)/install/export；无 enable_testing()、add_test()、BUILD_TESTING、add_subdirectory(tests)。"
  - source: "src/CMakeLists.txt"
    reason: "仅 add_library(libleidenalg ... 11 个 .cpp) + generate_export_header + install；无测试目标。"
  - source: "include/CMakeLists.txt"
    reason: "仅 target_sources(FILE_SET headers) 列 11 个公开头；无测试目标。"
  - source: "example/"
    reason: "仅 example.cpp + CMakeLists.txt 单个演示程序；README 明确说明该目录不包含在 release 源码包中，仅 GitHub 仓库可见，不属于自动化测试套件。"
  - conclusion: "上游未提供自动化测试套件；由 test_package 执行消费者视角的真实 Leiden 管线验证（Zachary 图 + CPM/Modularity + Optimiser，共 6 个断言）。"
upstream_test_audit_text: "Audited upstream 0.13.0 tag tarball file list and CMake entry points on 2026-09-14: no tests/ or test/ directory, no add_test/enable_testing/BUILD_TESTING/TESTS/check_PROGRAMS anywhere; only example/example.cpp demo exists and README states it is excluded from the release source package."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_leidenalg.cpp
    description: "Zachary 空手道俱乐部图经真实 Leiden 管线：Graph 点边数、CPM 分区合法性与质量不回退、Modularity 分区合法性与质量不回退（6 个断言）"
    command: "./test_leidenalg"

assertion_count: 6
