software: libngf-qt
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"

# 构建系统
build_system: qmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/nemomobile/libngf-qt/archive/refs/tags/0.3.1.tar.gz"

  # 源码校验和
  sha256: "320ef5bbba4b9b43ffacc3c07ccc6ec1b11b102cace86b5894bdbce277e93481"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统详情
  build_system: qmake

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "qt5-qtbase/5.15.2.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-conditional-quick-module.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
