package: libunistring/1.0
homepage: "https://www.gnu.org/software/libunistring/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - name: "libunistring make check suite"
    source: "libunistring-1.0/tests"
    description: "Upstream tests directory contains 574 test-*.c files and 60 test-*.sh files; full make check is not run in this CI"

test_package_tests:
  - file: test.c
    description: "Consumer smoke test for u8_strlen and u8_check"
    command: "./test_libunistring"

assertion_count: 2
