software: libunistring
version: "1.0"
status: built
build_date: "2026-07-25"

source:
  url: "https://ftp.gnu.org/gnu/libunistring/libunistring-1.0.tar.xz"
  sha256: "5bab55b49f75d77ed26b257997e919b693f29fd4a1bc22e0e6e024c246c72741"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--disable-rpath"
    - "--disable-dependency-tracking"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0002-build-aux-config.guess.patch"
  - "patches/0003-build-aux-config.sub.patch"

knowledge_gained:
  - "OHOS configure requires config.guess/config.sub recognition for linux-ohos."
  - "Configure socklen_t probing is stabilized with gl_cv_socklen_t_equiv=int in config.cache."
  - "HMDFS /tmp restrictions are avoided by using the runner-provided TMPDIR."
  - "Existing symbol-list patch is not applied because lib/libunistring.sym-t1 is not present in the 1.0 upstream tarball."
