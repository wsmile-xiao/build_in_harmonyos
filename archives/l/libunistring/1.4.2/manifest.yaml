software: libunistring
# 版本级 manifest 模板
# 文件位置: archives/l/libunistring/1.4.2/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "1.4.2"
status: published
build_date: "2026-05-26"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/gnu/libunistring/libunistring-1.4.2.tar.xz"
  sha256: ""
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

knowledge_gained:
  - "E007: config.guess/config.sub 需要添加 HarmonyOS 平台识别"
  - "E011: HMDFS umask 077 导致临时脚本权限 000，需要修改 configure"
