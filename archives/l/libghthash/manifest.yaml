# 软件级 manifest — libghthash
# 遵循 ARCHIVE-SPEC v2.0

software: libghthash
display: "libghthash"
description: "通用、可扩展的 C 哈希表库（Simon Kågström）— 支持任意 key/value、可插拔哈希函数与访问顺序启发式"
category: library
homepage: "https://github.com/SimonKagstrom/libghthash"
license: LGPL-2.0-or-later
build_system: custom

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C 库，无外部依赖，仅依赖标准 C 头文件"
    - "上游 0.6.2 附带旧式 autotools（AM_INIT_AUTOMAKE/AM_PROG_LIBTOOL 已弃用），CI automake 1.17 缺 Automake::Config.pm 无法 autoreconf"
    - "Conan 配方绕过 autotools，直接用 OHOS clang 编译 hash_table.c + hash_functions.c"
    - "公共头 ght_hash_table.h 由 ght_hash_table.h.in 做 @INT32_T@→int 替换生成（aarch64 上 int 为 4 字节，与 configure 检测一致）"
    - "hash_table.c 中 #include \"config.h\" 被 #ifdef HAVE_CONFIG_H 包裹，未定义 HAVE_CONFIG_H 时不包含，故无需生成 config.h"
    - "产物为静态库 libghthash.a，package_info.libs = [ghthash]"
    - "上游无正式自动化测试（无 test/tests 目录、无 make check 目标）；examples/ 下 6 个示例程序作补充验证"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.6.2":
    status: built
    build_date: "2026-08-24"
