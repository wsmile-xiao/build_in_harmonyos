# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcds/2.3.3
homepage: "https://github.com/khizmax/libcds"

# 上游测试命令 (conanfile.py build() 中已集成, direct-cc  harness):
# 真机 CMake(4.4.3)缺可用 OHOS/HarmonyOS 平台模块, 配置层在
# CMakeLists:12 project() 的编译器识别处失败 (cthreadpool/critnib
# 同指纹先例), 故不用 ctest 驱动, 改为构建时解析
# test/unit/*/CMakeLists.txt 还原上游二进制并逐个运行。
upstream_check_command: "cxx + gtest per test/unit/*/CMakeLists.txt source lists"
upstream_test_in_build: true
upstream_test_command: "unit-binary compile-and-run sequence in conanfile.py build()"
# 上游测试布局 (v2.3.3, test/ 目录):
# - test/unit: 13 个子目录 gtest 二进制 (deque/intrusive-list/list/map/misc/
#   pqueue/queue/intrusive-set/set/striped-map/striped-set/stack/tree),
#   依赖 GTest + Boost (test_requires 本仓库 OHOS 适配版 gtest/1.17.0.1 与
#   CMake 构建的 boost/1.90.0.2, 仅测试期);
#   库头 flat_combining Boost 硬依赖 (wait_strategy.h 死引用 +
#   kernel.h boost::thread_specific_ptr) 已由 conanfile.py build() 内
#   C++11 TLS 补丁消除 (消费方仍零 Boost), 单元源码硬含的
#   <boost/container/...> (如 deque/fcdeque.cpp) 由 Boost 测试依赖提供。
# - test/stress: 长耗时压测二进制 (freelist/map/pqueue/queue/set/stack),
#   在 conanfile.py 中直接不构建 (单核真机无法在
#   构建预算内完成, 详见 notes.md), 如实披露, 不计入通过率。
upstream_tests:
  - file: test/unit
    source: libcds-2.3.3/test/unit
    description: "上游单元测试套件 (gtest, 13 个子目录二进制, 与上游 CMakeLists 源码列表一致)"
    command: "unit-bins/<name> (逐个运行, 按 gtest summary 汇总)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: HP GC 生命周期 + TreiberStack LIFO + MSQueue FIFO"
    command: "./test_libcds"

# 测试断言总数 (消费者 3 个 CHECK, 上游以真机实测为准)
assertion_count: 3
