software: libcds
version: "2.3.3"
status: built
build_date: "2026-09-14"
build_system: cmake

source:
  url: "https://github.com/khizmax/libcds/archive/v2.3.3.tar.gz"
  sha256: "f090380ecd6b63a3c2b2f0bdb27260de2ccb22486ef7f47cc1175b70c6e4e388"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DWITH_TESTS=ON"
    - "-DENABLE_UNIT_TEST=ON"
    - "-DENABLE_STRESS_TEST=OFF"
    - "-DWITH_BOOST_ATOMIC=OFF"
    - "-DWITH_ASAN=OFF"
    - "-DWITH_TSAN=OFF"
    - "-DWITH_TESTS_COVERAGE=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libcds 库本体仅依赖 C++ 标准库与系统线程, Boost 只是上游测试的可选非 REQUIRED 依赖, 真机不引入以避开 Boost 源码构建链"
  - "上游 test/CMakeLists 使用 FindGTest 模块变量拼写, 需在 generate() 预填 GTEST_INCLUDE_DIRS/GTEST_LIBRARIES 真实路径"
  - "上游 cmake_minimum_required(3.0.2) 在新 CMake 上需 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容垫片"
  - "test/stress 为长耗时压测, 单核真机预算内无法完成, 以 ENABLE_STRESS_TEST=OFF 关闭并如实披露"
