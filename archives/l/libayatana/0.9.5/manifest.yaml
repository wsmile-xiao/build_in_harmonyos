patches_applied: []
# 本次无源码补丁：三处适配问题（gio-unix-2.0.pc 组件未导出、
# EXE 链接 -lintl、cpp_info.requires 隐式组件引用）均在
# conanfile.py 配方层解决，未修改上游源码。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PkgConfigDeps 只生成依赖包配方声明的组件 .pc；上游 pkg_check_modules 探测 glib 未导出组件（gio-unix-2.0）时，从包内 lib/pkgconfig/ 复制原始 .pc 并重写 prefix 到 generators 目录" ref: DRAFT-libayatana-glib-pkgconfigdeps-unexported-component
  - "可执行文件链接 g_libintl_ngettext undefined（--no-allow-shlib-undefined）：PkgConfigDeps 生成的 glib-2.0.pc 缺 -lintl，EXE linker flags 追加 -lintl 解决（glib 包内 libintl.so 已导出该符号）" ref: DRAFT-libayatana-exe-link-g-libintl-lintl
  - "cpp_info.requires 引用无显式 components 的依赖包（如 ayatana-ido）须用「包名::包名」隐式组件，不可写 CMake 目标名或裸包名" ref: DRAFT-libayatana-cpp-info-requires-implicit-component