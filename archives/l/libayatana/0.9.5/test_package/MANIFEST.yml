# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libayatana/0.9.5
homepage: "https://github.com/AyatanaIndicators/libayatana-indicator"

# 上游测试命令 (上游为 CMake + CTest；ENABLE_TESTS=ON 时注册 10 个 add_test)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest -N (ENABLE_TESTS=ON 构建 10 个测试二进制；真实运行见 notes.md R51)"

# 上游实际运行的测试程序
# R51 三步法: 测试工具依赖 dbus-test-runner(=dbustest 已发布)/dbus-daemon(已发布)/
# gtester(系统已存在) 均已注入 tool_requires 并真实运行，10/10 运行失败说明:
#   - 7 个 dbus 类: OHOS 沙箱无法建立 D-Bus 会话总线 (Signal 11, 实测;
#     dbustest 包 test_package 同证 "无运行中的 D-Bus 会话")
#   - 3 个 GUI 类: OHOS 无 X11/Xvfb 显示服务 (run-xvfb.sh 无法启动 X)
upstream_tests:
  - file: tests/service-manager-connect-tester
    source: tests/CMakeLists.txt
    description: "service-manager 连接测试 (dbus-test-runner)，OHOS 无 D-Bus 会话→运行失败(平台限制)"
    command: "./tests/service-manager-connect-tester"
  - file: tests/service-manager-no-connect-tester
    source: tests/CMakeLists.txt
    description: "service-manager 不连接测试 (dbus-test-runner)，OHOS 无 D-Bus 会话→运行失败(平台限制)"
    command: "./tests/service-manager-no-connect-tester"
  - file: tests/service-manager-connect-nostart-tester
    source: tests/CMakeLists.txt
    description: "service-manager nostart 连接测试 (dbus-test-runner)，OHOS 无 D-Bus 会话→运行失败(平台限制)"
    command: "./tests/service-manager-connect-nostart-tester"
  - file: tests/service-shutdown-timeout-tester
    source: tests/CMakeLists.txt
    description: "service 关闭超时测试 (dbus-test-runner)，OHOS 无 D-Bus 会话→运行失败(平台限制)"
    command: "./tests/service-shutdown-timeout-tester"
  - file: tests/service-version-tester
    source: tests/CMakeLists.txt
    description: "service 版本协商测试 (dbus-test-runner)，OHOS 无 D-Bus 会话→运行失败(平台限制)"
    command: "./tests/service-version-tester"
  - file: tests/service-version-multiwatch-tester
    source: tests/CMakeLists.txt
    description: "service 多进程 watch 测试 (dbus-test-runner)，OHOS 无 D-Bus 会话→运行失败(平台限制)"
    command: "./tests/service-version-multiwatch-tester"
  - file: tests/test-desktop-shortcuts-tester
    source: tests/CMakeLists.txt
    description: "桌面快捷方式测试 (gtester+Xvfb)，OHOS 无 X11/Xvfb→运行失败(平台限制)"
    command: "./tests/test-desktop-shortcuts-tester"
  - file: tests/test-css-provider-leak-tester
    source: tests/CMakeLists.txt
    description: "CSS provider 泄漏测试 (gtester+Xvfb)，OHOS 无 X11/Xvfb→运行失败(平台限制)"
    command: "./tests/test-css-provider-leak-tester"
  - file: tests/loader-tester
    source: tests/CMakeLists.txt
    description: "loader 测试 (gtester+Xvfb)，OHOS 无 X11/Xvfb→运行失败(平台限制)"
    command: "./tests/loader-tester"
  - file: tests/test-indicator-ng-tester
    source: tests/CMakeLists.txt
    description: "indicator-ng 测试 (dbus-test-runner)，OHOS 无 D-Bus 会话→运行失败(平台限制)"
    command: "./tests/test-indicator-ng-tester"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 libayatana-indicator3，验证 indicator_object GType 类型系统注册（indicator_object_get_type 返回 GObject 子类）"
    command: "./test_libayatana"

# 测试断言总数 (test.c 中显式断言数 + 隐含退出码检查)
assertion_count: 3