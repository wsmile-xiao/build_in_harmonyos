software: lynx
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.9.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.9.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（从阿里云Debian镜像下载）
  url: "https://mirrors.aliyun.com/debian/pool/main/l/lynx/lynx_2.9.2.orig.tar.bz2"

  # 源码校验和
  sha256: ""

  # 厩缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-screen=ncursesw"
    - "--with-ssl=no"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ncurses/6.4"

  # 编译器
  cc: gcc
  cxx: g++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-harmonyos-platform-support.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS平台识别：修改config.guess添加aarch64:HarmonyOS:*判断"
  - "TMPDIR问题：config.status默认使用/tmp，需要修改为$HOME/tmp以避免权限问题"