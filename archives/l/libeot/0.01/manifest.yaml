# ============================================================
# Knowledge
# ============================================================

knowledge_gained:
  - "上游 v0.01 只发布 autotools 骨架（configure.ac/Makefile.am，无生成 configure）；构建 profile PATH（hnp 工具链）有 autoconf 2.72/m4/perl 但无 automake/libtoolize，无法 autoreconf 自举——按上游 Makefile.am 的 13 个源文件与 release 旗标（-O2 --std=c99 -DDECOMPRESS_ON）直接编译即可复现"
  - "libeot 0.01 的 EOT v1 头解析以库实现为准：解析器读 CheckSumAdjustment 时不推进扫描器、随后从字段起点跳过 22 字节（含其自身与 18 字节保留域），名字段位于偏移 82/86/90/94，v1 头实际长度 96 字节（fontDataOffset==96）"
  - "flags=0（无 MTX 压缩、无 XOR 加密）时 writeFontBuffer 将字体数据按字节原样返回，不触发 SFNT/MTX 解析路径；消费者测试据此以未压缩 EOT 夹具验证元数据解析与字节级转换"
