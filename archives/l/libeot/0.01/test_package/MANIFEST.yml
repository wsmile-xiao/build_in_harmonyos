# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: libeot/0.01
homepage: "https://github.com/umanwizard/libeot"

# Upstream ships no test suite at tag v0.01: the tree has no tests/ directory
# and Makefile.am defines no TESTS/check target (evidence in notes.md).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: main.c
    description: "Consumer program: 23 assertions over EOT v1 metadata parsing, uncompressed EOT->TTF byte-identical conversion, UTF-16 family-name parsing and truncated/corrupt negative paths"
    command: "./libeot_test"
  - file: "test_package/conanfile.py test()"
    description: "Packaged eot2ttf tool roundtrip: fixture.eot -> roundtrip.ttf compared byte-wise against expected.ttf"
    command: "eot2ttf fixture.eot roundtrip.ttf"

assertion_count: 24
