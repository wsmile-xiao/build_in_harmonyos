# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
# 依据: docs/TEST_QUALITY_SPEC.md + R51 三步法（上游测试清点证据见 notes.md）
package: libg15/1.3.0-svn324
homepage: "https://salsa.debian.org/debian/libg15"

# 上游测试命令（用于 make -n check 分析）：
#   Makefile.am 未定义 TESTS/check_PROGRAMS，`make check` 展开为空 no-op。
upstream_check_command: "make check"

# conanfile.py build() 是否集成上游测试：
#   libg15 上游无任何测试套件，build() 不执行 make check（R51：附清点证据）。
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（无 — 上游不提供任何测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34 实质调 API）
test_package_tests:
  - file: test_libg15.c
    description: "Link + initLibG15() 初始化返回码验证（无 G15 硬件时须返回 G15_ERROR_OPENING_USB_DEVICE）；LIBG15_VERSION 编译期常量"
    command: "./test_libg15"

# 测试断言总数（近似值）
assertion_count: 2
