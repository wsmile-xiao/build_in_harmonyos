package: libscrc/1.8.1
homepage: "https://github.com/hex-in/libscrc"

upstream_check_command: "python3 -m unittest libscrc.test.modbus libscrc.test.hacker libscrc.test.crcx libscrc.test.crc8 libscrc.test.crc16 libscrc.test.crc24 libscrc.test.crc32 libscrc.test.crc64 libscrc.test.canx"
upstream_test_in_build: true
upstream_test_command: "python3 -m unittest libscrc.test.modbus libscrc.test.hacker libscrc.test.crcx libscrc.test.crc8 libscrc.test.crc16 libscrc.test.crc24 libscrc.test.crc32 libscrc.test.crc64 libscrc.test.canx"

upstream_tests:
  - file: libscrc/test/modbus.py
    description: "Upstream Modbus RTU and ASCII CRC tests"
    command: "python3 -m libscrc.test.modbus"
  - file: libscrc/test/hacker.py
    description: "Upstream parameterized CRC algorithm tests"
    command: "python3 -m libscrc.test.hacker"
  - file: libscrc/test/crcx.py
    description: "Upstream CRCx tests"
    command: "python3 -m libscrc.test.crcx"
  - file: libscrc/test/crc8.py
    description: "Upstream CRC8 tests"
    command: "python3 -m libscrc.test.crc8"
  - file: libscrc/test/crc16.py
    description: "Upstream CRC16 tests"
    command: "python3 -m libscrc.test.crc16"
  - file: libscrc/test/crc24.py
    description: "Upstream CRC24 tests"
    command: "python3 -m libscrc.test.crc24"
  - file: libscrc/test/crc32.py
    description: "Upstream CRC32 tests"
    command: "python3 -m libscrc.test.crc32"
  - file: libscrc/test/crc64.py
    description: "Upstream CRC64 tests"
    command: "python3 -m libscrc.test.crc64"
  - file: libscrc/test/canx.py
    description: "Upstream CAN CRC tests"
    command: "python3 -m libscrc.test.canx"

test_package_tests:
  - file: test_consumer.py
    description: "Consumer verifies CRC vectors where native loading is allowed; HNP workers report E212/E502 runtime tests NOT RUN and perform ELF checks"
    command: "python3 test_consumer.py <package_folder>"

assertion_count: 24
