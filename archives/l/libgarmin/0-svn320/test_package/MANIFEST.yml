# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libgarmin/0-svn320
homepage: "https://libgarmin.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libgarmin 上游（SVN 快照 / Debian 源码包）不含任何自动化测试套件，
# 因此上游测试清单为空 —— 适配后由 test_package 补全消费者级冒烟测试。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，计入「鸿蒙特有测试」)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 libgarmin API（gar_init/gar_free），验证静态库在 OHOS aarch64 上可链接并可初始化/释放"
    command: "./test_libgarmin"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
