# 知识沉淀
# ============================================================
knowledge_gained:
  - "上游仅发布 SVN 快照（Debian 重打包 orig），无预生成 configure；OHOS 构建环境无 automake，故用最小 config.h + clang 直接编译静态库，不依赖 autoreconf"
  - "源码不使用任何 HAVE_* 宏；struct gpoint/gpoly 的 source/slen 成员由 #ifdef DEBUG 守卫，需 -DDEBUG（上游 configure 默认开启）"
  - "个别文件靠传递性 include 获得 NULL，OHOS sysroot 下不成立，用 -include config.h 全局补标准头"
