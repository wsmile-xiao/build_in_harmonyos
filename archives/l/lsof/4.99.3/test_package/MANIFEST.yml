    command: "./lib/dialects/linux/tests/case-20-ux-socket-endpoint-unaccepted.bash"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: tests/case-13-classic.bash
    source: lsof-4.99.3/tests/case-13-classic.bash
    type: integration
    command: "bash tests/case-13-classic.bash <lsof> <report> (EXTRA_DIST 独立包装；/tmp→TMPDIR 运行副本；FAIL=级联包装，平台归因)"
    result: FAIL
  - file: tests/case-14-classic-opt.bash
    source: lsof-4.99.3/tests/case-14-classic-opt.bash
    type: integration
    command: "bash tests/case-14-classic-opt.bash <lsof> <report> (EXTRA_DIST 独立包装；/tmp→TMPDIR 运行副本；FAIL=级联包装，平台归因)"
    result: FAIL
  - file: lib/dialects/linux/tests/case-00-linux-hello.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-00-linux-hello.bash
    type: integration
    command: "make -C lib/dialects/linux/tests (FAIL=mq_fork 链接 undefined mq_open/mq_unlink，E430)"
    result: FAIL
  - file: tests/LTbasic2.c
    source: lsof-4.99.3/tests/LTbasic2.c
    type: unit
    command: "tests/LTbasic2 (liblsof API 测试，正确测试 CFLAGS 重编后 rc=0)"
    result: PASS
  - file: tests/LTbasic.c
    source: lsof-4.99.3/tests/LTbasic.c
    type: unit
    command: "tests/LTbasic"
    result: PASS
  - file: tests/LTbigf.c
    source: lsof-4.99.3/tests/LTbigf.c
    type: unit
    command: "tests/LTbigf"
    result: PASS
  - file: tests/LTdnlc.c
    source: lsof-4.99.3/tests/LTdnlc.c
    type: unit
    command: "tests/LTdnlc"
    result: PASS
  - file: tests/LTlock.c
    source: lsof-4.99.3/tests/LTlock.c
    type: unit
    command: "tests/LTlock (受限域 lsof 无法 stat() 测试文件)"
    result: FAIL
  - file: tests/LTnfs.c
    source: lsof-4.99.3/tests/LTnfs.c
    type: unit
    command: "tests/LTnfs (受限域 lsof 无法 stat() 测试文件)"
    result: FAIL
  - file: tests/LTnlink.c
    source: lsof-4.99.3/tests/LTnlink.c
    type: unit
    command: "tests/LTnlink"
    result: PASS
  - file: tests/LTsock.c
    source: lsof-4.99.3/tests/LTsock.c
    type: unit
    command: "tests/LTsock (/proc/net/tcp* 受限域 Permission denied)"
    result: FAIL
  - file: tests/LTszoff.c
    source: lsof-4.99.3/tests/LTszoff.c
    type: unit
    command: "tests/LTszoff"
    result: PASS
  - file: tests/LTunix.c
    source: lsof-4.99.3/tests/LTunix.c
    type: unit
    command: "tests/LTunix (bind() EPERM)"
    result: FAIL
  - file: test.sh
    description: "消费者测试：运行打包出的 lsof -v / -p $$ / -d 0 并断言输出"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40

# 上游测试统计（全集 40 项口径，勘误后）
upstream_test_total: 40
upstream_test_executed: 38
upstream_test_excluded: 2
upstream_test_pass: 18
upstream_test_skip: 5
upstream_test_fail: 15
upstream_test_fail_note: "15 个 FAIL 均为平台级归因（E429/E430/E002/unshare/受限域权限），非移植缺陷；详见 notes.md 与 reports/test-report.md §7"
