  - file: lib/dialects/linux/tests/case-20-mmap.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-20-mmap.bash
    description: "mmap 内存映射文件偏移（依赖 unshare → 平台失败）"
    command: "./lib/dialects/linux/tests/case-20-mmap.bash"
  - file: lib/dialects/linux/tests/case-20-mqueue-endpoint.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-20-mqueue-endpoint.bash
    description: "POSIX mqueue +E 端点（OHOS 无 mqueue，由无 RPC 配置排除）"
    command: "./lib/dialects/linux/tests/case-20-mqueue-endpoint.bash"
  - file: lib/dialects/linux/tests/case-20-open-flags-cx.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-20-open-flags-cx.bash
    description: "O_CREAT|O_EXCL 打开标志列（/tmp 只读 → 平台失败）"
