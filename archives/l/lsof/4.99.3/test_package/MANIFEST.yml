    command: "./lib/dialects/linux/tests/case-20-pty-endpoint.bash"
  - file: lib/dialects/linux/tests/case-20-ux-socket-endpoint.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-20-ux-socket-endpoint.bash
    description: "unix socket +E 端点配对（nc 不支持 unix socket → SKIP 77）"
