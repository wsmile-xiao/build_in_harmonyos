  - file: lib/dialects/linux/tests/case-20-open-flags-path.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-20-open-flags-path.bash
    description: "O_PATH 打开标志列（/tmp 只读 → 平台失败）"
    command: "./lib/dialects/linux/tests/case-20-open-flags-path.bash"
