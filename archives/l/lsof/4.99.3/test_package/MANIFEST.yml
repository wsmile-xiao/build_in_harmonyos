# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lsof/4.99.3
homepage: "https://github.com/lsof-org/lsof"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 make check 通过环境变量排除 OHOS 缺失能力后全量执行（见 MANIFEST 下方说明）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试全集 40 项（30 个 case-*.bash + 10 个 LT*.c；common.bash/util-open-flags.bash/LTlib.c 为辅助库不计入）
# 执行 38 + 排除 2（mqueue，E430）；结果 PASS 18 / SKIP 5 / FAIL 15，FAIL 均平台归因（勘误详见 notes.md / reports/test-report.md §7）
upstream_tests:
  - file: tests/case-00-hello.bash
    source: lsof-4.99.3/tests/case-00-hello.bash
    description: "冒烟：lsof 可执行"
    command: "./tests/case-00-hello.bash"
  - file: tests/case-01-version.bash
    source: lsof-4.99.3/tests/case-01-version.bash
    description: "版本号与 -v 输出一致"
    command: "./tests/case-01-version.bash"
  - file: tests/case-20-exit-status.bash
    source: lsof-4.99.3/tests/case-20-exit-status.bash
    description: "进程存在/不存在时的退出码"
    command: "./tests/case-20-exit-status.bash"
  - file: tests/case-20-fd-only-inclusion.bash
    source: lsof-4.99.3/tests/case-20-fd-only-inclusion.bash
    description: "-d fd 过滤只包含指定 fd"
    command: "./tests/case-20-fd-only-inclusion.bash"
  - file: tests/case-20-handle-missing-files.bash
    source: lsof-4.99.3/tests/case-20-handle-missing-files.bash
    description: "已删除但仍打开的文件处理"
    command: "./tests/case-20-handle-missing-files.bash"
  - file: tests/case-20-offset-field.bash
    source: lsof-4.99.3/tests/case-20-offset-field.bash
    description: "OFFSET/OFFSETTX 列显示文件偏移（FIFO/regular/匿名页）"
    command: "./tests/case-20-offset-field.bash"
  - file: tests/case-20-repeat-count.bash
    source: lsof-4.99.3/tests/case-20-repeat-count.bash
    description: "-r 循环模式的重复输出计数"
    command: "./tests/case-20-repeat-count.bash"
  - file: tests/case-21-exit-Q-status.bash
    source: lsof-4.99.3/tests/case-21-exit-Q-status.bash
    description: "-Q 选项对退出码的影响"
    command: "./tests/case-21-exit-Q-status.bash"
  - file: tests/case-22-empty-process-name.bash
    source: lsof-4.99.3/tests/case-22-empty-process-name.bash
    description: "空进程名（改写 argv[0]）处理"
    command: "./tests/case-22-empty-process-name.bash"
  - file: lib/dialects/linux/tests/case-10-mqueue.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-10-mqueue.bash
    description: "POSIX mqueue 命名显示（OHOS 无 mqueue，由无 RPC 配置排除）"
    command: "./lib/dialects/linux/tests/case-10-mqueue.bash"
  - file: lib/dialects/linux/tests/case-10-ux-socket-state.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-10-ux-socket-state.bash
    description: "unix socket 状态列（nc 不支持 unix socket → SKIP 77）"
    command: "./lib/dialects/linux/tests/case-10-ux-socket-state.bash"
  - file: lib/dialects/linux/tests/case-20-epoll.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-20-epoll.bash
