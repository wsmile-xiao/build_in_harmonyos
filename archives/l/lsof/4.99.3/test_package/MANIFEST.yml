    command: "./lib/dialects/linux/tests/case-20-epoll.bash"
  - file: lib/dialects/linux/tests/case-20-eventfd-endpoint.bash
    source: lsof-4.99.3/lib/dialects/linux/tests/case-20-eventfd-endpoint.bash
