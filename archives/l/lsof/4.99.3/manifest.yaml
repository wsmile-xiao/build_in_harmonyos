knowledge_gained:
  - "鸿蒙内核对未实现 syscall (close_range=436) 直接 SIGSYS (exit 159)，E051 同类；closefrom_shim 需走慢速 close() 循环"
  - "HarmonyOS 安全策略拒绝 open('/') (EACCES)，lsof OffType 探测文件需改用 /proc，否则 [eventpoll:] 空、OFFSET 列缺失"
  - "uname -r 返回 'HongMeng Kernel 1.13.0' 带空格，LSOF_VSTR=$(uname -r) 破坏 C 字符串引号，需取末字段"
  - "HMDFS 上 mktemp -d 创建的目录权限位异常 (drwx--S---) 拒绝写入，mktemp 场景需 mkdir 回退 (E060 同类)"
  - "OHOS 内核对 pipe/pty fd 的 fdinfo flags 上报 O_RDWR(02u)，lsof +E 端点方向断言 (3r/4w) 无法匹配 — 平台级缺口"

