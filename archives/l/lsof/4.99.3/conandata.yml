# conandata.yml — lsof 4.99.3
# Source: official upstream release tarball (R39)

sources:
  url: "https://github.com/lsof-org/lsof/releases/download/4.99.3/lsof-4.99.3.tar.gz"
  sha256: "86428a8881b0d1147a52058e853c775b83d794f0da685d549b2bfd07063ed1cd"

patches:
  - patch_file: "patches/0001-configure-ohos-vstr-mktemp.patch"
    patch_description: "Keep last field of uname -r for LSOF_VSTR (HongMeng output has spaces); fall back from mktemp to mkdir for config temp dirs (HMDFS mode bits)"
    patch_type: "portability"
  - patch_file: "patches/0002-config-guess-ohos-mktemp.patch"
    patch_description: "config.guess temp dir creation: mktemp-created dirs reject writes on HMDFS, use mkdir"
    patch_type: "portability"
  - patch_file: "patches/0003-misc-c-avoid-close_range-syscall.patch"
    patch_description: "Skip SYS_close_range on __OHOS__: HarmonyOS kernel terminates the process with SIGSYS (unimplemented syscall 436); use the slow close() loop. Exception to the no-platform-macro rule: syscall availability cannot be probed portably at compile time (probe itself crashes), see PR notes"
    patch_type: "portability"
  - patch_file: "patches/0004-dlsof-h-sockaddr-storage-fix.patch"
    patch_description: "Rename kernel-side sockaddr_storage while including linux/netlink.h to avoid redefinition conflict with sys/socket.h on the OHOS sysroot (accel-ppp pattern)"
    patch_type: "portability"
  - patch_file: "patches/0005-dproc-c-lstat-proc-probe.patch"
    patch_description: "OffType probe file: open('/') is denied by HarmonyOS security policy (EACCES), use /proc which lsof requires anyway; fixes empty [eventpoll:] lists and missing OFFSET/OFFSETTX columns"
    patch_type: "portability"
