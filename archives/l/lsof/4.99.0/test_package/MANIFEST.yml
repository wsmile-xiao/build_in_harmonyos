# test_package/MANIFEST.yml
# lsof has no formal upstream test suite (custom Configure + Makefile)
package: lsof/4.99.0
homepage: "https://github.com/lsof-org/lsof"

# Upstream has no formal test command
upstream_check_command: "N/A (no test target in Makefile)"
upstream_test_in_build: false
upstream_test_command: "N/A"

# No upstream test programs
upstream_tests: []

# test_package smoke tests (consumer-side verification)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verifies lsof binary exists, is valid ELF, and can execute with -v flag"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 4