software: lsof
version: 4.99.0
status: partial
build_system: autotools
created_at: 2026-04-25
knowledge_gained:
  - OHOS platform has /bin/bash missing, use /data/service/hnp/bin/bash
  - sockaddr_storage redefinition conflict between sys/socket.h and linux/socket.h on OHOS
  - lsof requires LINUX_CONF_CC=clang and LSOF_INCLUDE pointing to OHOS sysroot
  - Platform limitation: /proc filesystem access restricted on OHOS
patches_applied:
  - 0001-Mksrc-shebang.patch
  - 0002-dlsof.h-ohos-fix.patch
configure_options:
  - ./Configure -n linux
  - LINUX_CONF_CC=clang
  - LSOF_INCLUDE=/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/include
build_log: logs/build.log
source_url: https://api.github.com/repos/lsof-org/lsof/tarball/4.99.0
platform_notes: |
  lsof compiles successfully on OHOS but has platform limitations:
  - /proc filesystem access is restricted, preventing normal operation
  - binary-sign-tool fails with "is not trust command" for unsigned binaries
  - Binary can execute but produces no output when querying processes
