software: libtracefs
display: "libtracefs"
description: "Linux trace filesystem library"
category: system
homepage: "https://git.kernel.org/pub/scm/libs/libtrace/libtracefs.git/"
license: LGPL-2.1/GPL-2.0
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "纯Makefile项目，无configure脚本"
    - "依赖libtraceevent"
    - "需补丁解决OHOS SDK vsock头文件冲突"
  common_dependencies:
    - libtraceevent
  known_issues:
    - "OHOS SDK linux/vm_sockets.h和sys/socket.h结构体重复定义"

# 版本索引
versions:
  "1.8.3":
    status: built
    build_date: "2026-06-12"