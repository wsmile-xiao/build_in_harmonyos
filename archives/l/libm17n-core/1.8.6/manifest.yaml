software: libm17n-core
version: "1.8.6"
build_system: autotools
status: built
source:
  url: "https://download.savannah.gnu.org/releases/m17n/m17n-lib-1.8.6.tar.gz"
  sha256: "7129fe3b7ad500f88b8af8605ef07b96c87a75ec986a695fffc0a409f44a7c86"
knowledge_gained:
  - "libxml2 制品包的 bin/xml2-config 硬编码 prefix=/usr/local，m17n-lib 会把它当 libxml2 探测依据 → HAVE_XML2 未定义、库被静默降级编译；须绕过该脚本并注入制品包真实 include/lib 路径（预置 HAVE_XML2_CONFIG=no + CPPFLAGS/LDFLAGS）"
  - "交叉编译时 AC_FUNC_MALLOC/AC_FUNC_REALLOC 的运行时测试无法执行，默认判定 malloc 损坏 → config.h 出现 #define malloc rpl_malloc，而 libm17n 未提供替代实现，编译报 incompatible integer to pointer conversion；须预置 ac_cv_func_*_0_nonnull=yes"
  - "m17n-lib 1.8.6 的 --disable-gui 实际无效（AC_ARG_ENABLE 只填 enable_gui，configure.ac 判断的是 with_gui），GUI 层源码无法关闭，只能在 package() 中剔除产物"
  - "OHOS sysroot 的 libintl.h 是空壳且无 libintl 提供者；m17n-lib 的 gettext 调用全部在 #if ENABLE_NLS 内，--disable-nls 即可让 libm17n-core.so 完全不依赖 libintl（规避设备 libintl.so.8.proxy 的 g_libintl_* 改名问题）"
  - "OHOS worker 上 uname -s 返回 HarmonyOS，2024-07-27 版 GNU config.guess 无该分支 → 回退到在 mktemp 目录编译并执行 dummy.c，被 worker 存储拒绝（dummy.c: Permission denied）→ configure 报 cannot guess build type；补 config.guess 的 HarmonyOS 分支输出 <machine>-unknown-linux-ohos 即可（本包 config.sub 2024-05-27 已接受该三元组）"
  - "configure/config.status 用 (umask 077 && mktemp -d ./confXXXXXX) 建辅助目录，HMDFS 存储上 0700 目录致生成脚本不可用（./confXXXXXX/subs1.awk: Permission denied → could not setup config files machinery）；改为 umask 022 即可（libthai 先例，E011/E533）"
patches:
  - file: patches/0001-config.guess-harmonyos.patch
    purpose: "config.guess 增加 HarmonyOS/HongMeng 分支，输出 <machine>-unknown-linux-ohos，避免 dummy.c 探测被 OHOS worker 存储拒绝"
    type: manual
    platform_only: true
  - file: patches/0002-configure-umask-hmdfs.patch
    purpose: "configure 的辅助临时目录由 umask 077 改为 022，规避 HMDFS 上 0700 目录导致 confXXXXXX/subs1.awk Permission denied"
    type: manual
    platform_only: true

