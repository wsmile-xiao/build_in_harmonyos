# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
#
# 上游 m17n-lib 1.8.6 不随源码发布自动化测试：configure.ac / Makefile.am 与
# src/Makefile.am 中均无 TESTS / check_PROGRAMS / check-local 目标，
# `make check` 只做进入各子目录的空运行。因此上游用例数为 0，
# 适配后用 test_package/test.c 从消费者视角补全核心 API 验证。

package: libm17n-core/1.8.6
homepage: "https://www.nongnu.org/m17n/"

# 上游测试命令（用于 `make -n check` 分析；上游无测试目标，命令为空运行）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "核心 API 消费者验证：MSymbol 符号表/属性、MPlist 属性列表、MCharTable 字符表默认值与范围、MText 增删改查与文本属性范围（含 U+4E2D 非 ASCII 字符往返）"
    command: "./test_probe"
assertion_count: 56
