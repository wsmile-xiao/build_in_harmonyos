sources:
  "1.8.6":
    url: "https://download.savannah.gnu.org/releases/m17n/m17n-lib-1.8.6.tar.gz"
    sha256: "7129fe3b7ad500f88b8af8605ef07b96c87a75ec986a695fffc0a409f44a7c86"
patches:
  "1.8.6":
    - patch_file: "patches/0001-config.guess-harmonyos.patch"
      patch_description: "config.guess: recognize HarmonyOS (uname -s) and emit <machine>-unknown-linux-ohos; without it configure falls back to a dummy.c probe that the OHOS worker storage rejects"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-configure-umask-hmdfs.patch"
      patch_description: "configure/config.status: create the ./confXXXXXX helper directory with umask 022 instead of 077 — on the OHOS worker's HMDFS storage the 0700 directory makes the generated helper scripts unusable (subs1.awk: Permission denied)"
      patch_type: "portability"
      strip: 1
