software: libemf
display: "libEMF"
description: "Library for generating Enhanced Metafiles (EMF) on POSIX systems"
category: library
homepage: "https://sourceforge.net/projects/libemf/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "uname -s 在 OHOS 上返回 HarmonyOS，2022 版 config.guess 无法识别，必须加 HarmonyOS 分支（E007）"
    - "config.sub 需要 ohos 三元组的三处修改：basic_os 映射、OS 白名单、kernel-OS 白名单（E072；缺第三处报 Kernel 'linux' not known to work with OS 'ohos'）"
    - "configure 用 umask 077 创建 config.status 临时目录，HMDFS 强制 setgid 导致该目录不可写，需改 umask 022（E011/E129）"
    - "make 必须单线程（-j1）：HMDFS 上无法创建 GNU make jobserver FIFO（E074）"
  common_dependencies: []

versions:
  "1.0.14":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libemf/1.0.14"
