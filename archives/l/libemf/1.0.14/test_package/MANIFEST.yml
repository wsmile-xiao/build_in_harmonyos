# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libemf/1.0.14
homepage: "https://sourceforge.net/projects/libemf/"

# 上游测试命令 (tests/Makefile.am: TESTS = docheck1.sh docheck2.sh docheck3.sh)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（6 个 = TESTS 注册的 3 个 + check_PROGRAMS 中
# 未被上游注册、由本配方显式运行的 3 个；前三个先运行对应 check 程序生成
# EMF，再用 cmp -l 与 tests/emfs/ 中的金样文件逐字节比较）
upstream_tests:
  - file: tests/docheck1.sh
    source: libemf-1.0.14/tests/docheck1.sh
    description: "运行 ./check1 绘制图元，生成的 check1.emf 与 tests/emfs/check1.emf 逐字节一致（61 条记录，2216 字节）"
    command: "./check1 && cmp -l emfs/check1.emf check1.emf"
  - file: tests/docheck2.sh
    source: libemf-1.0.14/tests/docheck2.sh
    description: "运行 ./check2 通过 PlayEnhMetaFile 回放 check1.emf，生成的 check2.emf 与 tests/emfs/check1.emf 逐字节一致"
    command: "./check2 && cmp -l emfs/check1.emf check2.emf"
  - file: tests/docheck3.sh
    source: libemf-1.0.14/tests/docheck3.sh
    description: "运行 ./check3 回放并做视口/窗口变换，生成的 check3.emf 与 tests/emfs/check3.emf 逐字节一致"
    command: "./check3 && cmp -l emfs/check3.emf check3.emf"
  - file: tests/check4.c
    source: libemf-1.0.14/tests/check4.c
    description: "上游 check_PROGRAMS 中未注册为 TESTS 的程序：渲染 Unicode 字体样本并写出 check4.emf（配方在 make check 后显式运行，rc=0）"
    command: "./check4"
  - file: tests/example1.c
    source: libemf-1.0.14/tests/example1.c
    description: "上游未注册的示例程序：绘制图元并写出 example1.emf（配方显式运行，rc=0）"
    command: "./example1"
  - file: tests/example2.c
    source: libemf-1.0.14/tests/example2.c
    description: "上游未注册的回放程序：读取命令行传入的 example1.emf 再写出 example2.emf（配方显式运行，rc=0）"
    command: "./example2 example1.emf"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_libemf_api.c
    description: "C API 消费者：CreateEnhMetaFile 绘制图元并落盘，校验 ENHMETAHEADER（签名/版本/nBytes/nRecords/rclFrame/rclBounds），GetEnhMetaFile 回读并用 PlayEnhMetaFile 回放到第二个元文件，缺失文件返回 0；共 45 项断言"
    command: "./test_libemf_api <build>/consumer.emf"
  - file: test_package/conanfile.py
    description: "运行包内 bin/printemf 读取上一步生成的 EMF（rc=0），并对缺失文件断言非零退出（rc=1）"
    command: "printemf <build>/consumer.emf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 45
