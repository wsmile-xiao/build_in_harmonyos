knowledge_gained:
  - "uname -s 在 OHOS 上返回 HarmonyOS：2022 版 config.guess 直接报 unable to guess system type，需加 *:HarmonyOS:*:* 分支映射到 ${MACHINE}-unknown-linux-ohos（E007）"
  - "config.sub 的 ohos 支持需要三处修改（basic_os 映射 / OS 白名单 / kernel-OS 白名单），缺第三处会用 Kernel 'linux' not known to work with OS 'ohos' 拒绝合法三元组（E072）"
  - "patch-autotools-ohos.pl 的第三处修改存在误判：它用 linux-ohos 字符串存在性判断，在第一处插入 basic_os=linux-ohos 后即跳过 kernel-OS 白名单，需要人工补齐（本次已补）"
  - "configure 的 config.status 临时目录用 umask 077：HMDFS 强制 setgid，0700 目录连创建者也不可写，configure 在 creating ./config.status 后失败；改 umask 022（含 config.status 内两处）后通过（E011/E129）"
  - "HMDFS 上 config.guess 的 mktemp 探测目录同样不可写，但补丁后走 uname 分支不再依赖该探测"
  - "make -j2 在本机可用，但配方按仓库惯例使用 -j1（E074 jobserver FIFO 风险）"
  - "printemf 读取元文件不依赖 ENABLE_EDITING；默认配置下它只校验文件可读（rc=0）或报错（rc=1），打印内容需 --enable-editing"

