software: libadwaita
version: "1.7.12"
status: published
build_system: meson
build_date: "2026-09-28"

source:
  url: "https://gitlab.gnome.org/GNOME/libadwaita/-/archive/1.7.12/libadwaita-1.7.12.tar.gz"
  sha256: "96a67f465c7759d7261caac733b4cda643e4e256fd40537df7c3ce2533423287"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dintrospection=disabled"
    - "-Dvapi=false"
    - "-Dgtk_doc=false"
    - "-Dexamples=false"
    - "-Dtests=true"
  dependencies:
    - gtk4/4.22.4 # transitive headers/libs for adw public headers
    - glib/2.84.0.1.1 # fixed hard constraint (shared=True; override unifies graph)
    - appstream/1.2.0 # hard dependency (AdwAboutDialog reads AppStream metadata)
    - pango/1.56.4 # override: gtk4 chain requires >= 1.56
    - zstd/1.5.7.1 # override: appstream chain pulls 1.5.7.1
    - fribidi/1.0.16
    - zlib/1.3.1.1
    - fontconfig/2.18.1.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libadwaita 1.7.x 硬依赖 appstream（AdwAboutDialog 读 AppStream 元数据），glib_min>=2.80/gtk_min>=4.17.5"
  - "appstream 链 libxmlb 组件 requires 引用 glib::gobject 旧名，而 glib/2.84.0.1.1 组件键为 gobject-2.0 带后缀 → 需为 glib 依赖 cpp_info 注入无后缀组件别名（appstream 配方同款）"
  - "glib 包自带 proxy-libintl（g_libintl_* 前缀符号，E142），conan PkgConfigDeps 生成的 glib-2.0.pc 缺 -lintl → 链接时 g_libintl_* 未定义，需在配方 generate() 给 glib-2.0.pc 追加 -lintl"
  - "glib/2.84.0.1.1 的 bin 工具需 re-sign（.codesign 陈旧，OHOS XPM exec 拒绝）+ LD_LIBRARY_PATH 前置 glib lib（无 RPATH）才能运行（gtk4 同款）"
