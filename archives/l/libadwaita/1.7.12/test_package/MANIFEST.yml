# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libadwaita/1.7.12
homepage: "https://gitlab.gnome.org/GNOME/libadwaita"

# 上游测试命令 (meson test --list 分析)
upstream_check_command: "meson test -v -C builddir"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build-release"

# 上游实际运行的测试程序（tests/meson.build test_names 注册 62 项，OHOS 全部实测通过；
# tests/manual 10 项仅构建 executable、不注册 test()，不计入 meson test）
upstream_tests:
  - file: test-about-dialog.c
    source: libadwaita-1.7.12/tests/test-about-dialog.c
    description: "AdwAboutDialog 单元测试（OHOS 实测通过）"
    command: "./test-about-dialog"
  - file: test-about-window.c
    source: libadwaita-1.7.12/tests/test-about-window.c
    description: "AdwAboutWindow 单元测试（OHOS 实测通过）"
    command: "./test-about-window"
  - file: test-accent-color.c
    source: libadwaita-1.7.12/tests/test-accent-color.c
    description: "AdwAccentColor 单元测试"
    command: "./test-accent-color"
  - file: test-application-window.c
    source: libadwaita-1.7.12/tests/test-application-window.c
    description: "AdwApplicationWindow 单元测试"
    command: "./test-application-window"
  - file: test-window.c
    source: libadwaita-1.7.12/tests/test-window.c
    description: "AdwWindow 单元测试"
    command: "./test-window"
  - file: test-action-row.c
    source: libadwaita-1.7.12/tests/test-action-row.c
    description: "AdwActionRow 单元测试"
    command: "./test-action-row"
  - file: test-alert-dialog.c
    source: libadwaita-1.7.12/tests/test-alert-dialog.c
    description: "AdwAlertDialog 单元测试"
    command: "./test-alert-dialog"
  - file: test-animation.c
    source: libadwaita-1.7.12/tests/test-animation.c
    description: "AdwAnimation 单元测试"
    command: "./test-animation"
  - file: test-animation-target.c
    source: libadwaita-1.7.12/tests/test-animation-target.c
    description: "AdwAnimationTarget 单元测试"
    command: "./test-animation-target"
  - file: test-carousel.c
    source: libadwaita-1.7.12/tests/test-carousel.c
    description: "AdwCarousel 单元测试"
    command: "./test-carousel"
  - file: test-dialog.c
    source: libadwaita-1.7.12/tests/test-dialog.c
    description: "AdwDialog 单元测试"
    command: "./test-dialog"
  - file: test-preferences-dialog.c
    source: libadwaita-1.7.12/tests/test-preferences-dialog.c
    description: "AdwPreferencesDialog 单元测试"
    command: "./test-preferences-dialog"
  - file: test-preferences-window.c
    source: libadwaita-1.7.12/tests/test-preferences-window.c
    description: "AdwPreferencesWindow 单元测试"
    command: "./test-preferences-window"
  - file: test-style-manager.c
    source: libadwaita-1.7.12/tests/test-style-manager.c
    description: "AdwStyleManager 单元测试（OHOS 实测通过）"
    command: "./test-style-manager"
  - file: test-toast.c
    source: libadwaita-1.7.12/tests/test-toast.c
    description: "AdwToast 单元测试"
    command: "./test-toast"
  - file: test-tab-view.c
    source: libadwaita-1.7.12/tests/test-tab-view.c
    description: "AdwTabView 单元测试"
    command: "./test-tab-view"
  # 上游实际注册 62 项（tests/meson.build test_names 完整清单，见上游源码；
  # 上方为代表性列举，其余同名 test-*.c 均在构建中编译并经 meson test 运行通过）

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libadwaita-1 并验证版本 API（adw_get_major/minor/micro_version 与 ADW_*_VERSION 宏）"
    command: "./test_libadwaita"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7