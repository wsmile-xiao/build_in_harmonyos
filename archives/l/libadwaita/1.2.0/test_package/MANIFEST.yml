# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libadwaita/1.2.0
homepage: "https://gitlab.gnome.org/GNOME/libadwaita"

# 上游测试命令 (meson test --list 分析)
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (见 tests/meson.build test_names，完整台账见 notes.md)
upstream_tests:
  - file: tests/test-about-window.c
    source: libadwaita-1.2.0/tests/test-about-window.c
    description: "AboutWindow 控件上游单元测试"
    command: "./test-about-window"
  - file: tests/test-action-row.c
    source: libadwaita-1.2.0/tests/test-action-row.c
    description: "ActionRow 控件上游单元测试"
    command: "./test-action-row"
  - file: tests/test-animation.c
    source: libadwaita-1.2.0/tests/test-animation.c
    description: "动画框架上游单元测试"
    command: "./test-animation"
  - file: tests/test-carousel.c
    source: libadwaita-1.2.0/tests/test-carousel.c
    description: "Carousel 控件上游单元测试"
    command: "./test-carousel"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证 — 链接 libadwaita-1 并调用公开版本 API（adw_get_*_version）断言 1.2.0"
    command: "./test_libadwaita"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
