# 版本级 manifest — libadwaita 1.2.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.0"
software: "libadwaita"
status: built
build_date: "2026-09-15"
build_system: meson

source:
  url: "https://gitlab.gnome.org/GNOME/libadwaita/-/archive/1.2.0/libadwaita-1.2.0.tar.gz"
  sha256: "ab0030434af58ae0a01e6979acc56f7e88cc43ca5a2bbd53da9a3b7707403687"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dintrospection=disabled"
    - "-Dvapi=false"
    - "-Dgtk_doc=false"
    - "-Dexamples=false"
    - "-Dtests=true"
  dependencies:
    - gtk4/4.22.4
    - glib/2.84.0.1.1
    - fribidi/1.0.16
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libadwaita (GTK4 Adwaita 控件库) 在 OHOS 交叉编译需跟随 gtk4 的 Broadway-only 后端约束，禁用 introspection/vapi/gtk_doc/examples，仅保留 tests"
  - "PkgConfigDeps 需为 Meson 提供 gtk4/glib-2.0/gio-2.0/fribidi 的 .pc；glib 必须对齐 gtk4 图内固定的 glib/2.84.0.1.1 shared=True，并传递 zlib/1.3.1.1、fontconfig/2.18.1.1 override 避免版本冲突"
