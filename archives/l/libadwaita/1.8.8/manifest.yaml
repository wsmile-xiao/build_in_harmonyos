# 版本级 manifest — libadwaita 1.8.8
# 遵循 ARCHIVE-SPEC v2.0

version: "1.8.8"
software: "libadwaita"
status: built
build_date: "2026-09-28"
build_system: meson

source:
  url: "https://download.gnome.org/sources/libadwaita/1.8/libadwaita-1.8.8.tar.xz"
  sha256: "9e64939959a071cb660090c0e1b380c51ca29e3cfb57f3f23ea42a9922eb6f41"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dintrospection=disabled"
    - "-Dvapi=false"
    - "-Ddocumentation=false"
    - "-Dexamples=false"
    - "-Dtests=true"
  dependencies:
    - gtk4/4.22.4
    - glib/2.84.0.1.1
    - fribidi/1.0.16
    - appstream/1.2.0
    - sassc/3.6.2 (build-time tool)
  cc: clang
  cxx: clang++

patches_applied:
  - 0001-tests-ignore-deprecations.h.patch

knowledge_gained:
  - "libadwaita (GTK4 Adwaita 控件库) 在 OHOS 交叉编译需跟随 gtk4 的 Broadway-only 后端约束，禁用 introspection/vapi/documentation/examples，仅保留 tests"
  - "PkgConfigDeps 需为 Meson 提供 gtk4/glib-2.0/gio-2.0/fribidi/appstream 的 .pc；glib 必须对齐 gtk4 图内固定的 glib/2.84.0.1.1 shared=True，并传递 zlib/1.3.1.1、fontconfig/2.18.1.1 override 避免版本冲突"
  - "1.8.x 新增 required 依赖 appstream（无 required:false，带 subproject fallback）——必须让 PkgConfigDeps 产出 appstream.pc，否则 meson 触发 subproject 全源码 clone 离线必败"
  - "1.8 起 gtk_doc meson 选项 deprecated，改用 documentation"

