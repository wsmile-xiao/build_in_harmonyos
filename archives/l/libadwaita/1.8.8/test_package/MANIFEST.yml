# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libadwaita/1.8.8
homepage: "https://gitlab.gnome.org/GNOME/libadwaita"

# 上游测试命令 (meson test --list 分析)
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (见 tests/meson.build test_names，共 63 个，
# 完整双口径台账见 notes.md)
upstream_tests:
  - file: tests/test-easing.c
    source: libadwaita-1.8.8/tests/test-easing.c
    description: "easing 动画数学函数上游单元测试"
    command: "./test-easing"
  - file: tests/test-accent-color.c
    source: libadwaita-1.8.8/tests/test-accent-color.c
    description: "accent color 转换上游单元测试"
    command: "./test-accent-color"
  - file: tests/test-animation.c
    source: libadwaita-1.8.8/tests/test-animation.c
    description: "动画框架上游单元测试"
    command: "./test-animation"
  - file: tests/test-toast.c
    source: libadwaita-1.8.8/tests/test-toast.c
    description: "Toast 控件上游单元测试"
    command: "./test-toast"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证 — 链接 libadwaita-1，不调用 adw_init（OHOS 无显示服务器），执行无显示功能探针 124 checks：版本/初始化态(7) + easing 上游 1:1 移植 70 条 + 扩展 7 条 + accent-color 上游公共 API 1:1 移植 35 条 + spring 物理参数(5)"
    command: "./test_libadwaita"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 124
