software: libjxl
category: image
description: JPEG XL image format reference implementation
homepage: https://github.com/libjxl/libjxl
build_system: cmake
dependencies:
  required:
    - cmake
    - pkg-config
    - brotli
  optional:
    - giflib
    - jpeg
    - openexr
    - png
    - webp
provides:
  tools:
    - cjxl
    - djxl
    - jxlinfo
  libraries:
    - libjxl
    - libjxl_threads
versions:
  0.11.2:
    status: pending
    release_date: 2026-02-10
    url: https://github.com/libjxl/libjxl/archive/refs/tags/v0.11.2.tar.gz