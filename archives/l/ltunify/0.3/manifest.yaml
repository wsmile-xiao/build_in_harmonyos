# 版本级 manifest - ltunify 0.3（ARCHIVE-SPEC v2.0）

version: "0.3"
software: "ltunify"
status: built
build_date: "2026-09-25"
build_system: "makefile"

source:
  url: "https://deb.debian.org/debian/pool/main/l/ltunify/ltunify_0.3.orig.tar.gz"
  sha256: "c98a5e4450bc4344d2646009ea30bee3036a4a64b3a95e4c45509567ebf5e4f1"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=<conan tools.build:compiler_executables:c>"
    - "PACKAGE_VERSION=0.3"
    - "-j1"
  dependencies: []
  cc: clang
  cxx: ""

patches_applied: []

install_files:
  - path: bin/ltunify
    type: executable
    description: "Logitech Unifying 接收器配对/查询主程序"
  - path: bin/read-dev-usbmon
    type: executable
    description: "/dev/usbmonX 抓包解析调试工具"
  - path: res/udev/rules.d/42-logitech-unify-permissions.rules
    type: data
    description: "非 root 访问接收器的 udev 规则（由集成方自行安装到系统 udev 目录）"

test_results:
  official_suite: "NONE (上游无测试体系：Makefile 无 check/test 目标，tar 内 15 个源文件（含 .gitignore）零测试文件)"
  test_package: "PASS (7/7 断言，见 test_package/test.sh)"
  hardware_io: "SKIP (无 Logitech Unifying 接收器硬件且 /dev/hidraw* 不可打开)"

knowledge_gained:
  - "上游裸 Makefile 未赋值 CC ⇒ $(CC) 落到 GNU make 内置默认 cc，OHOS 无该别名"
  - "上游 install 目标把 install 命令写成字面量、无 INSTALL 变量可覆写，且构建环境 PATH 不含 /bin ⇒ make/sh 查找不到 install（/bin/install 实际存在，系 toybox 0.8.12）⇒ 只能绕开 make install"
  - "Makefile ifeq 少 $ 使 PACKAGE_VERSION 恒走 else 分支 ⇒ tarball 构建出空版本串"
