# test_package/MANIFEST.yml
# 上游官方测试声明（CI build_and_test.sh L0e 要求此文件存在）

package: ltunify/0.3
homepage: "https://lekensteyn.nl/logitech-unifying.html"

# 上游测试命令：上游 Makefile（1173 字节 / 44 行）的目标实测为 all(22) /
# read-dev-usbmon(24) / ltunify(26) / clean(30) / install-home(33) /
# install(37) / install-udevrule(40) / uninstall(43) 共 8 枚，
# 没有 check/test 目标，也没有测试目录。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试程序：无。
# 清点证据（计数用 python，不用 shell 通配 —— `*` 不匹配 .gitignore 会少算一枚）：
#   $ python3 -c "import tarfile;t=tarfile.open('ltunify_0.3.orig.tar.gz');
#                 print(sum(1 for m in t.getmembers() if m.isfile()))"            -> 15
#   $ python3 -c "import os;print(sum(len(fs) for _,_,fs in os.walk('ltunify-0.3')))"  -> 15
#   $ grep -rniE "check|TESTS|add_test" Makefile  -> 0 命中
#   $ ls tests test check 2>/dev/null    -> 无此类目录
# 全部 15 个文件：Makefile NEWS README.txt hidpp20.c hidraw.c keyboard.txt
#   ltunify.c notes.txt read-dev-usbmon.c registers.txt shell
#   udev/42-logitech-unify-permissions.rules usbmon-setperms usbmon.awk .gitignore
#   （tar 内另有 2 枚目录 member：ltunify-0.3/、ltunify-0.3/udev/，不计入文件数）
upstream_tests: []

# test_package 自带的消费者视角断言
test_package_tests:
  - file: test.sh
    description: "runenv 导出 + --version 版本串 + --help 三条子命令 + read-dev-usbmon usage 拒绝"
    command: "bash test.sh"

# 断言总数（test.sh 实际计数：2 + 1 + 3 + 1）
assertion_count: 7
