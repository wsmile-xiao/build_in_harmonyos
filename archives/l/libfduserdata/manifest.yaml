# 软件级 manifest
software: libfduserdata
display: "libfduserdata"
description: "将用户自定义数据与文件描述符关联的线程安全哈希表小库"
category: library
homepage: "https://github.com/rd235/libfduserdata"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游为 rd235/libfduserdata 官方仓库，0.1.2 为官方 tag，无外部运行时依赖"
    - "上游无任何测试，按 no_tests 路径审计后由 test_package 消费者测试覆盖"
    - "HarmonyOS libc 内含 pthread API，无独立 libpthread，配方与补丁按 CMAKE_SYSTEM_NAME 跳过链接"
    - "man/ 需要 pandoc，在 HarmonyOS 上跳过该子目录（POSIX 兼容方式，无平台宏）"
    - "上游硬编码 SHARED，补丁使其跟随 BUILD_SHARED_LIBS，默认静态"
    - "纯库项目，只安装 lib 与头文件，不声明 commands.json（R38）"
  common_dependencies: []

versions:
  "0.1.2":
    status: built
    build_date: "2026-09-15"
