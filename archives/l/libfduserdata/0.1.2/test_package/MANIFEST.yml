# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfduserdata/0.1.2
homepage: "https://github.com/rd235/libfduserdata"

# 上游源码审计：0.1.2 tag archive 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码树 (libfduserdata-0.1.2 GitHub tag archive)"
    reason: "无 tests/、test/、unittests/ 目录；仅 fduserdata.c/fduserdata.h（库本体）、CMakeLists.txt、fduserdata.pc.in、Uninstall.cmake、man/ 文档页、README.md、COPYING；无 *test*.c/cpp/py/sh 测试源。fduserdata.c 尾部 #if 0 内有一段手工演示 main，默认不编译、未注册为测试。"
  - source: "CMakeLists.txt"
    reason: "全文无 enable_testing、add_test、add_subdirectory(tests)；仅定义 fduserdata 库目标、fduserdata.pc、man/ 子目录与 uninstall 目标。"
  - source: "man/CMakeLists.txt"
    reason: "仅用 pandoc 生成安装 man 页，无测试目标。"
  - source: "README.md"
    reason: "编译说明仅为 mkdir build && cd build && cmake .. && make && sudo make install，未提及任何测试命令。"
  - conclusion: "上游 0.1.2 未提供自动化测试；由 test_package 执行消费者视角的库 API 验证（create/new/get/put/del/destroy_cb，TAP 14 检查）。"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 check/test 目标，无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无官方测试套件；验证手段为 test_package 对打包库的真实调用。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 验证：fduserdata_create/destroy 建表销表、new/put/get 查询归还、哈希碰撞共存（顺序 get/check/put，避免同时持有两把互斥锁）、del 删除后查询为空、destroy_cb 回调计数释放（TAP 14 检查，全部实质调用库 API）"
    command: "test_libfduserdata"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
