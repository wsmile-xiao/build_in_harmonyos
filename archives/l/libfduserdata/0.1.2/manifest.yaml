software: libfduserdata
version: "0.1.2"
status: built
build_date: "2026-09-15"

source:
  url: "https://github.com/rd235/libfduserdata/archive/refs/tags/0.1.2.tar.gz"
  sha256: "a81c262fbdb3c9ccdc7f1bef637a344febc0c719b132d6537cd8c88ce4b8f583"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF (default; ON when shared=True)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-ohos-portability.patch"

knowledge_gained:
  - "上游 0.1.2 无任何测试（无 enable_testing/add_test，无 tests/ 目录），按 no_tests 路径审计接入"
  - "HarmonyOS libc 内含 pthread API，无独立 libpthread，库与消费者的 pthread 链接均需按系统名跳过"
  - "man/ 需要 pandoc，在 HarmonyOS 上跳过该子目录"
  - "上游硬编码 SHARED 且只安装 LIBRARY 产物，补丁使其跟随 BUILD_SHARED_LIBS 并补齐 ARCHIVE 安装"
