# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lazr.delegates/2.1.1
homepage: "https://launchpad.net/lazr.delegates"

# 上游测试命令 (纯 Python 包无 make check/ctest，等价命令为 unittest)
upstream_check_command: "PYTHONPATH=src python3 -m unittest discover -s src/lazr/delegates/tests -p 'test_*.py'"

# conanfile.py build() 中未集成上游测试（纯 Python 无编译，测试在 test_package 外单独运行）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (src/lazr/delegates/tests/)
upstream_tests:
  - file: test_api.py
    source: lazr_delegates-2.1.1/src/lazr/delegates/tests/test_api.py
    description: "TestAPI.test_no_interfaces — delegate_to 无接口参数须抛 TypeError"
    command: "PYTHONPATH=src python3 -m unittest src.lazr.delegates.tests.test_api"
  - file: test_passthrough.py
    source: lazr_delegates-2.1.1/src/lazr/delegates/tests/test_passthrough.py
    description: "TestPassthrough — test_get/test_set/test_no_delete/test_adaptation (4 用例)"
    command: "PYTHONPATH=src python3 -m unittest src.lazr.delegates.tests.test_passthrough"
  - file: test_docs.py
    source: lazr_delegates-2.1.1/src/lazr/delegates/tests/test_docs.py
    description: "doctests — docs/index.rst / NEWS.rst / CONTRIBUTING.rst (3 用例)"
    command: "PYTHONPATH=src python3 -m unittest src.lazr.delegates.tests.test_docs"

# test_package 中自带的测试 (消费者视角验证，真实调用 delegate_to + Passthrough)
test_package_tests:
  - file: test_lazr_delegates.py
    description: "消费者测试——真实 import lazr.delegates，使用 delegate_to 装饰器定义委托类并调用委托方法，验证 Passthrough 描述符"
    command: "python3 test_lazr_delegates.py <site-packages>"

# 测试断言总数 (上游 8 用例 + test_package 内嵌断言)
assertion_count: 19
