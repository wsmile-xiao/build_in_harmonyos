package: libminc/2.5.0
upstream_test_in_build: true
upstream_tests: ctest（testdir/ 注册的用例，随配方 build() 的 cmake.test() 在设备真跑；注册数与结果见 reports/test-report.md）
test_package_tests:
  - file: test.c
    description: "MINC2（HDF5 底层）3D 卷写读逐元素对账 + H5Fis_hdf5 底层指纹；MINC1（netcdf 底层）卷写读对账 + ncinq 结构断言"
    command: "./test_probe ."
assertion_count: 28
# 取数口径：CHECK 宏实际执行次数（真跑一轮）= MINC2 链路 12
# （维度创建 3 + create/image/写/close/H5Fis/读open/读/close/逐元素对账 9）
# + MINC1 链路 16（micreate + 维度定义 3 + stdvar/endef/varid/varput/close +
# ncopen/ncinq×2 + miopen/varid/varget/逐元素对账）。
