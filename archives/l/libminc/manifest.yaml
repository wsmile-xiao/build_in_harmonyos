    status: built
    build_date: "2026-09-21"
    notes: >-
      新包（upstream/main 无 libminc 目录，--allow-unpublished 首次适配）。
      MINC1+MINC2 全功能（LIBMINC_MINC1_SUPPORT=ON，netcdf/4.9.3 + hdf5/1.14.6 均已在架）；
      ezminc C++ 封装层与 NIfTI 支持（上游走 ExternalProject 构建期拉取）未启用，见 notes.md。
