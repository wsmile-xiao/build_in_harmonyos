package: "libubi/2.3.1-3"

upstream_tests_exist: false

upstream_test_audit:
  source_tarball: "mtd-utils-2.3.1.tar.bz2"
  source_sha256: "03d9dc58ad10ea3549d9528f6b17a44d8944e18e96c0f31474f9f977078b83dc"
  upstream_tag: "mtd-utils-2.3.1"
  upstream_repo: "https://git.infradead.org/mtd-utils.git"
  scanned_for:
    - "make check (autotools)"
    - "tests/ directory"
    - "ctest / enable_testing"
  scan_result: "mtd-utils upstream test suite is gated behind --with-tests/--enable-unit-tests; the recipe configures with --without-tests --disable-unit-tests, so no upstream test binary is built. libubi/libmtd are declared noinst_LIBRARIES (make install ships no library), so the recipe builds + merges the static archives directly and validates via an installed-package consumer instead of the upstream suite."
  reason: "upstream suite disabled by design; the recipe ships a consumer-side end-to-end test (test_package.c) that exercises the real public UBI API and asserts the documented device-less behaviour."

upstream_tests: []

test_package_tests:
  - id: "installed-package-consumer"
    source: "test_package.c"
    command: "./libubi_consumer"

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

execution:
  status: "pending HMBS real-machine preflight"
  target: "OpenHarmony PC (HarmonyOS aarch64)"
