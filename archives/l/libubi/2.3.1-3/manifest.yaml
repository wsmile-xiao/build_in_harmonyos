# 版本级 manifest — libubi 2.3.1-3
# 遵循 ARCHIVE-SPEC v2.0
# 文件位置: archives/l/libubi/2.3.1-3/manifest.yaml

version: "2.3.1-3"
software: "libubi"
# built = conan-verify (G0-G4 + L2/L4/L5) 通过、尚未 upload
status: built
build_date: "2026-09-29"
build_system: "direct-cc"

# libubi 是 mtd-utils 2.3.1 内的 UBI 开发库；Debian/Ubuntu 源包
# `mtd-utils 2.3.1-3` 编出 `libubi-dev` 二进制包，其产物正是本配方打包内容。
upstream_version: "2.3.1"
upstream_tag: "mtd-utils-2.3.1"
upstream_repo: "https://git.infradead.org/mtd-utils.git"

source:
  url: "https://infraroot.at/pub/mtd/mtd-utils-2.3.1.tar.bz2"
  sha256: "03d9dc58ad10ea3549d9528f6b17a44d8944e18e96c0f31474f9f977078b83dc"
  tar_format: tar.bz2

build:
  # 不是 autotools：配方直接调用校验过的 profile 编译器，./configure 仅用来
  # 生成 include/config.h（详见 notes.md 选型依据）。
  system: direct-cc
  configure_options:
    - "--without-zlib"
    - "--with-lzo=no"
    - "--with-zstd=no"
    - "--with-selinux=no"
    - "--without-crypto"
    - "--without-ubifs"
    - "--without-jffs"
    - "--without-xattr"
    - "--without-tests"
    - "--disable-unit-tests"
    - "--without-lsmtd"
    - "--disable-ubihealthd"
    - "RM=/system/bin/rm"
    - "SHELL=/system/bin/sh"
    - "MKDIR_P=/system/bin/mkdir -p"
  dependencies: []
  cc: clang
  cxx: clang++

# 静态库优先（R4/R26 倾向静态，上游 libubi 为 noinst_LIBRARIES 不产出 .so，
# 无 SONAME 要求）。
library_versioning:
  kind: static-only
  soversion: "n/a"
  note: "upstream marks libubi/libmtd/etc as noinst_LIBRARIES; Debian libubi-dev ships a static lib. No shared object, no SONAME gate applies."

patches_applied: []

# 本包只产出静态库，未运行上游 autotools 测试套件；test_package 为
# 1 个端到端消费者流程（4 个 CHECK 断言，单次执行、单次通过计）。
tests:
  upstream_independent_total: 0
  integration_independent_total: 1
  target_passed: 1
  target_status: "pass (1 integration consumer flow: libubi_open device-less behaviour + request-struct API + safe close(NULL), 4 CHECK stages counted once)"
  shared_static_counted_once: true
  upstream_result: "n/a (upstream test suite disabled via --without-tests)"
  integration_result: "passed (executed: 1, passed: 1, failed: 0, 4 CHECK assertions)"

validation:
  official_source_hash: "pass (sha256 matches the mtd-utils-2.3.1 release tarball)"
  upstream_audit: "pass (libubi/libmtd/libubigen/libscan/libiniparser are declared noinst_LIBRARIES; make install ships no library — so we build + merge the .a directly and skip install)"
  conan_verify: "pass (G0-G4 + L2/L4/L5)"

knowledge_reused:
  - "ref: libogg/1.3.5.1 recipe — validated direct-cc route on OHOS (bypass CMake/autotools probes, invoke profile clang, archive with llvm-ar)"
  - "ref: E002 (set-env-var) — /tmp is read-only on this platform, redirect TMPDIR/TMP/TEMP to a writable cache dir before any compiler child process"
  - "ref: E346 (make SHELL=/bin/sh sandbox denial) — OHOS safe-bin shim uses a #!/bin/bash shebang that does not exist; drive ./configure/make with PATH=/system/bin first and explicit RM/SHELL/MKDIR_P overrides"

knowledge_gained:
  - "ref: libubi/2.3.1-3 notes.md 选型依据 — autotools ./configure must be run once purely to emit include/config.h (sources carry -include config.h; lib/execinfo.c branches on HAVE_EXECINFO_H); the actual compile uses the validated clang, not a full autotools build"
  - "ref: libubi/2.3.1-3 notes.md 合并 — top-level Makefile is non-recursive; the six archives are built as libmtd.a/libmissing.a/libubi.a/libubigen.a/libscan.a/libiniparser.a (NOT lib/libmtd.a), then merged into one self-contained libubi.a"
  - "ref: libubi/2.3.1-3 notes.md 签名 — OHOS requires a .codesign section to run an ELF; the test_package consumer is signed with binary-sign-tool and the .codesign count is asserted to be exactly 1"
