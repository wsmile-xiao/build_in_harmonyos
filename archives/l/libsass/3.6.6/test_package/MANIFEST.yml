package: libsass/3.6.6
homepage: "https://github.com/sass/libsass"

upstream_check_command: "make -C test test"
upstream_test_in_build: true
upstream_test_command: "make -C test test"

upstream_tests:
  - file: test/test_shared_ptr.cpp
    description: "Shared pointer ownership and destruction checks"
    command: "make -C test test_shared_ptr"
  - file: test/test_util_string.cpp
    description: "Utility string escaping and formatting checks"
    command: "make -C test test_util_string"

test_package_tests:
  - file: test_package/consumer.cpp
    description: "Consumer compiles and invokes the installed LibSass data-context API"
    command: "libsass_consumer"

assertion_count: 8
