software: libtlsrpt
display: "libtlsrpt"
description: "Low-level C library implementing TLSRPT (RFC 8460) datagram generation for MTAs"
category: library
homepage: "https://github.com/sys4/libtlsrpt"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "无依赖 Autotools 库，release 包自带 configure，直接 configure+make"
    - "上游无测试套件，test_package 自建消费者测试覆盖版本/错误码/全生命周期"
    - "纯 C 库，非系统同名库，默认静态构建"
  common_dependencies: []

versions:
  "0.5.1":
    status: built
    build_date: "2026-09-18"
    source_url: "https://github.com/sys4/libtlsrpt/releases/download/v0.5.1/libtlsrpt-0.5.1.tar.gz"
