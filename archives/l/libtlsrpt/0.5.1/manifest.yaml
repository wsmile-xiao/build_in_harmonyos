software: libtlsrpt
# 版本级 manifest
# 文件位置: archives/l/libtlsrpt/0.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sys4/libtlsrpt/releases/download/v0.5.1/libtlsrpt-0.5.1.tar.gz"

  # 源码校验和
  sha256: "e5570db13c15d74ae467b00fb1aa40ddd24b22f3281069e712d60b7a2bf7b31d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--prefix=/"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libtlsrpt 为无依赖 Autotools 库（configure+make），release 包自带 configure"
  - "上游无测试套件：Makefile.am 无 TESTS/check 目标，仅 demo.c 手动演示程序"
