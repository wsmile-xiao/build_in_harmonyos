# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtlsrpt/0.5.1
homepage: "https://github.com/sys4/libtlsrpt"

# 上游测试套件存在性 (经审计上游 tag v0.5.1 确认无测试)
upstream_tests_exist: false

# 上游无测试审计 (源码: libtlsrpt-0.5.1.tar.gz,
# sha256 e5570db13c15d74ae467b00fb1aa40ddd24b22f3281069e712d60b7a2bf7b31d)
upstream_test_audit:
  source_tarball: "libtlsrpt-0.5.1.tar.gz"
  source_sha256: "e5570db13c15d74ae467b00fb1aa40ddd24b22f3281069e712d60b7a2bf7b31d"
  tag: "v0.5.1"
  top_level_files:
    - Makefile.am        # 仅定义 lib_LTLIBRARIES/include_HEADERS/pkgconfig，无 TESTS/check 目标
    - configure.ac       # 仅 AC_INIT/AC_PROG_CC/LT_INIT/AC_CONFIG_FILES，无测试宏
    - libtlsrpt.c        # 库实现，无 TEST/TEST_F/def test_ 测试代码
    - tlsrpt.h           # 公共 API 头文件
    - tlsrpt_version.h.in # 版本头模板
    - demo.c             # 手动演示程序 (main 直接跑 testrun，无断言 harness)
    - man/               # 仅 man 手册页，无测试
    - doc/               # 仅 API 文档与示例文本，无测试
    - packaging/         # 仅打包文件 (AUR)，无测试
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest / meson test 目标"
    - "find 全树 -name '*test*'"
  scan_result: "全树 find -name '*test*' 仅命中 demo.c 演示程序；Makefile.am 无 TESTS/check_PROGRAMS；configure.ac 无测试宏；无 tests/ 目录、无 gtest/pytest/ctest 注册"
  make_check_output: "无 make check 测试目标（Makefile.am 未定义）；demo.c 为手动演示程序，需 collectd 套接字配合，无断言、无 harness、无退出码判定"
  reason: "libtlsrpt 0.5.1 为无测试套件的上游：唯一可执行示例 demo.c 是手动演示程序（直接发送 datagram 给 collectd，无断言统计），不构成自动化测试。test_package 自建消费者测试覆盖版本查询、错误码辅助函数与投递请求/策略全生命周期"

# 上游测试命令 (上游无测试套件，故无)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test.c
    description: "消费者测试：tlsrpt_version 版本查询 + version_check 兼容性判断 + strerror/errno 错误码辅助函数 + open/init_delivery_request/init_policy/add_policy_string/add_mx_host_pattern/add_failure/finish_policy/finish_delivery_request/close 全生命周期 (R34)"
    command: "./test_libtlsrpt"

# 测试断言总数 (test.c 的 3 个真实断言分组，与 HMBS_TEST_PACKAGE_RESULT discovered=3 一致)
# 1. 版本查询 + 兼容性判断 (version 字符串比对 + version_check 接受/拒绝)
# 2. 错误码辅助函数 (strerror 非空 + is_internal 识别 + errno 提取)
# 3. 投递请求/策略全生命周期 (open→init_dr→init_policy→add 字符串/pattern/failure→finish_policy→finish_dr→close)
assertion_count: 3
