# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libopenrazer/0.4.0
homepage: "https://github.com/z3ntu/libopenrazer"

# 上游测试命令 (meson test --list 清点结果)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（清点：上游 meson.build 无 test() 注册，测试用例数为 0）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libopenrazer.cpp
    description: "消费者冒烟测试：效果枚举表、元类型注册、Manager 构造、isDaemonRunning、DBusException name/message"
    command: "./test_libopenrazer"

# 测试断言总数（test_libopenrazer.cpp 内 CHECK 宏实际调用数）
assertion_count: 7
