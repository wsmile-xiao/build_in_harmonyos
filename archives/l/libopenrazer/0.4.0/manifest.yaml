knowledge_gained:
  - "meson 的 qt6 模块通过 qmake6 定位 Qt6（QT6_QMAKE 环境变量），moc/rcc/uic 位于 qtbase 包的 bin/ 与 libexec/，需注入 PATH 与 LD_LIBRARY_PATH"
  - "qtbase 包内自带 Qt6*.pc 的 prefix 指向构建机 .cache 路径，meson 经 pkg-config 消费会失效；必须显式设置 QT6_QMAKE 让 meson 走 qmake 定位"
  - "上游 translations 子目录依赖 lrelease（qt6linguisttools），qtbase 不提供，翻译文件仅影响界面本地化、不影响库核心功能，可 patch 跳过"

