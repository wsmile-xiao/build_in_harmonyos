# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtnt/1.2.6
homepage: "https://math.nist.gov/tnt/"

# 上游测试命令：上游无测试套件。
# R51 清点证据（2026-09-16 本机实测解包 tnt_126.zip）：
#   - 压缩包仅含 21 个 .h 头文件（tnt.h 聚合头 + 20 个组件头），
#     无 tests/ 目录、无构建系统文件、无测试驱动；
#   - NIST 官网 download.html 仅提供源码 zip 与文档 zip（tnt120doc.zip），
#     examples.html 为示例代码片段页，无可执行测试套件；
#   - 上游 1.2.6 为最终版（2005 年前后），此后无新发布。
upstream_check_command: "N/A — upstream ships 21 headers only, no test suite (inventory evidence in notes.md)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A — 上游无测试套件可集成"

# 上游实际执行的测试：无（0 个测试文件，清点见上）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libtnt.cpp
    description: "TNT 消费者冒烟：版本宏断言、Array1D 逐元素算术/copy 深拷贝/T* 衰减、Array2D matmult 数值断言、Array3D 三重下标、Fortran_Array2D 1-based 索引、Vector(deprecated) 双口径索引/newsize、math_utils hypot、Sparse_Matrix_CompRow CSR 视图（经 0001 补丁修复）、Stopwatch 状态机——9 组 32 项断言全过则退出码 0（Stopwatch 用 start/stop/resume，running() 上游未定义）"
    command: "./test_libtnt"
  - file: test_consumer.cpp
    description: "消费者用例（真实数值应用场景）：①两态马尔可夫链稳态分布——行向量幂迭代 v←v·P（matmult，PageRank 式用法）200 次收敛至解析稳态 (2/3,1/3)，含维度/归一性/Stopwatch 计时断言；②组合评分加权平均——Array1D 同形状逐元素乘 + T* 衰减求和 = 93.0——共 6 项断言"
    command: "./test_consumer"
  - file: test_ohos.cpp
    description: "鸿蒙特有测试：①Stopwatch 时钟路径——OHOS musl libc 的 clock()/CLOCKS_PER_SEC 实测（busy loop 计时 >0 且量级合理）；②真机堆上 2MB 跨页大数组（512×512 double）分配/逐页写入/精确整数和校验；③aarch64 FPU 浮点语义——非可精确表示小数（0.1）matmult 64 次乘加误差 <1e-12——共 6 项断言"
    command: "./test_ohos"

# 自有断言合计（自定义 CHECK 宏，-DNDEBUG 下不被剔除）
assertion_count: 44

# 真机实测结果（2026-09-16）
upstream_result:
  date: "2026-09-16"
  device: "OHOS 真机 10.62.178.77 (HongMeng Kernel 1.12.0 aarch64), conan 2.29.1（与 CI 同版本）, clang 15, armv8/libc++/17/Release, CI profile"
  passed: 44
  total: 44
  failures: "无。上游 zip 无随包测试（清点证据见 notes.md），本表为 test_package 断言结果（test_libtnt 32 + test_consumer 6 + test_ohos 6）"
