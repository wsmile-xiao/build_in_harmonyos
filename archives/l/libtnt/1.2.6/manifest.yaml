knowledge_gained:
  - "libtnt = Debian 打包名，上游实体为 NIST TNT（Template Numerical Toolkit），1.2.6 为官方最终版"
  - "官方 tnt_126.zip 为扁平结构：21 个 tnt*.h 位于压缩包根，无顶层目录/构建系统/独立 LICENSE（NIST 公共领域声明内嵌每个头文件）"
  - "header-library 形态：参照 compile-time-regular 3.11.0（package_type=header-library + auto_header_only_mode + no_copy_source）"
  - "上游无测试套件 → R51 如实申报 0 测试，消费者验证由 test_package 44 项运行期断言承担（组件冒烟 32 + 消费者用例 6 + 鸿蒙特有 6）"
  - "上游硬缺陷：tnt.h 在 clang 下 include 即编译失败——Sparse_Matrix_CompRow 构造函数以 const 指针初始化 Array1D 成员，而 clang 对非依赖 Array1D<int> 成员初始化做解析期急切检查（GCC 延迟到实例化，上游从未暴露）；0001 补丁去 const 修复（i_refvec(T*) 本为别名视图语义，与类文档一致）"
  - "Array2D/Array3D 无 operator()（元素访问为双/三重下标 A[i][j]/t[i][j][k]，operator[](int) 返回 T*/T** 行指针）；仅 Fortran_Array1D/2D/3D 提供 1-based operator()"
  - "DEV1（frp）无 /data/service/hnp/bin/clang++，CI profile 仅 DEV2/CI worker 可用；DEV2 hnp/bin 工具链齐全且 conan 2.29.1 与 CI 同版本"

