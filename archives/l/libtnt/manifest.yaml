software: libtnt
display: "libtnt (NIST TNT)"
description: "NIST Template Numerical Toolkit：C++ 科学计算数值模板库（多维数组/Fortran 风格数组/CSR 稀疏视图），header-only，Debian 打包名 libtnt"
category: library
homepage: "https://math.nist.gov/tnt/"
license: NIST-PD
build_system: header-only

ohos_adaptation:
  key_points:
    - "官方 tnt_126.zip 为扁平分发包：21 个 tnt*.h 位于压缩包根，无构建系统/无测试/无独立 LICENSE（NIST 公共领域声明内嵌每个头文件，package() 从 tnt.h 逐字提取落盘）"
    - "必须 strip_root=False：Conan 2 zip 剥根用 os.path.commonprefix 把 21 个 tnt*.h 的公共前缀 'tnt' 误判为根目录 → IndexError（知识草稿 E429）"
    - "上游硬缺陷：tnt.h 在 clang 下 include 即编译失败（Sparse_Matrix_CompRow 构造函数以 const 指针初始化非依赖类型 Array1D<int> 成员，clang 解析期急切检查；GCC 延迟故上游从未暴露）——补丁 0001 去 const 修复（知识草稿 E430）"
    - "上游悬空声明（声明未定义，链接期才炸，不可调用）：Stopwatch::running()、Sparse_Matrix_CompRow 的 copy ctor 与 operator="
    - "API 语义要点：Array2D/3D 无 operator()（双/三重下标，仅 Fortran 系 1-based operator()）；operator* 为逐元素乘非矩阵乘，形状不匹配返回空数组（矩阵乘用 matmult）"
    - "header-library 形态（package_type=header-library + auto_header_only_mode），零依赖零编译，clang15/libc++/17 真机实测通过"
  common_dependencies: []

versions:
  "1.2.6":
    status: built
    build_date: "2026-09-16"
