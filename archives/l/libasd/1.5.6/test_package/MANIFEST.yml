package: libasd/1.5.6
homepage: "https://github.com/ToruNiina/libasd"

upstream_check_command: "cmake -S . -B build"
upstream_test_in_build: false
upstream_test_command: "not run: upstream CMake unconditionally adds the omitted pybind11 submodule"

upstream_tests:
  - file: test/test_header_enums.cpp
    source: libasd-1.5.6/test/test_header_enums.cpp
    description: "Boost.Test C++ header test exists upstream but the release CMake configure fails first when extlib/pybind11 is absent."
    command: "cmake -S . -B build -DLIBASD_BUILD_TESTS=ON"
    static_test_sources: 6
    runtime_passed: 0
    runtime_failed: 0
    blocked_by: "missing extlib/pybind11 release submodule"

test_package_tests:
  - file: test.cpp
    description: "Consumer includes the public root header and validates to_voltage for bipolar and unipolar ranges."
    command: "ctest --test-dir . --output-on-failure"
    assertions: 2

assertion_count: 2
