software: libmlocale
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sailfishos/libmlocale/archive/refs/tags/0.8.3.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DCMAKE_PREFIX_PATH=$HOME/usr/local"
    - "-DENABLE_ICU=OFF"
    - "-DENABLE_TESTS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "qt/5.15.2"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cmake-qt5-support.patch"
  - "0002-src-cmake-qt5-support.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Qt5 支持：修改 CMakeLists.txt 以支持 Qt5（fallback from Qt6）"
  - "Qt mkspecs 缺失：需要创建 mkspecs/linux-clang 目录和配置文件"
  - "QtXml 头文件缺失：需要从 Qt 源码复制 src/xml/dom 和 src/xml 目录"
  - "Qt 工具签名：moc/rcc 需要签名才能运行"
  - "Qt5Xml cmake 配置缺失：需要手动创建 Qt5XmlConfig.cmake"