# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# 上游测试核验：libao-1.2.2.tar.gz 内没有任何自动化测试框架
# （configure.ac / 各 Makefile.am 无 check_PROGRAMS / TESTS，`make check`
#  无目标可执行；上游仅有 src/ao_*.c 的示例程序且无断言）。故上游自动化
# 测试数 = 0，L1 由 test_package 的消费者测试承担。
#
# 适配后由 consumer 测试覆盖：libao 公共 API（ao_initialize /
# ao_driver_info_list / ao_driver_id / ao_driver_info / ao_open_live /
# ao_close / ao_shutdown）+ pulse 插件 dlopen 加载 + 产物 ELF 契约。
#
# 插件目录：libao 在 configure 时把 AO_PLUGIN_PATH 写成 /lib/ao/plugins-4，
# 而 OHOS 上 /lib 是只读的 /system/lib，Conan 缓存里的包无法把插件摆到那里。
# patches/0001 允许用同名环境变量覆盖该目录（仅绝对路径），test.sh 的两次运行
# 都把它指向被测包的 <pkg>/lib/ao/plugins-4。

package: libao-pulse/1.2.2
homepage: "https://xiph.org/ao/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "none"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无自动化测试，保持空列表）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: libao_pulse_consumer.c
    description: "链接已发布包的 ao::ao，驱动公共 <ao/ao.h> API：ao_driver_info_list 返回已加载驱动、pulse 插件被 dlopen 并注册（ao_driver_id(\"pulse\")）、ao_driver_info 元数据（short_name/name）、oss 驱动缺失、未知驱动被拒、ao_open_live 拒绝无效驱动 id（-1 -> NULL），以及 ao_open_live(pulse) 的三分支判定（无驱动必无设备 / 有驱动无服务端时驱动须为 AO_TYPE_LIVE / 有服务端时 ao_play 须接受缓冲区）"
    command: "./libao_pulse_consumer"
  - file: test.sh
    description: "安装布局（lib/libao.so.4、lib/ao/plugins-4/libpulse.so、lib/pkgconfig/ao.pc）+ readelf 契约（AArch64、SONAME libao.so.4、OHOS .codesign 段、插件 DT_NEEDED libpulse-simple.so.0 / libpulse.so.0）+ 两次运行（AO_PLUGIN_PATH 指向包内插件目录；先用制品仓自己的 pulseaudio，再换成已签名平台 PulseAudio 客户端库）。readelf 探针经 readelf_out() 包装（内部 || true）与 CORE=$(... || true)，缺失产物时由 check_contains 报 FAIL 而不是被 set -e 静默中止"
    command: "bash test.sh <consumer> <package_folder>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 20   # test.sh 12 项 + consumer 8 项（真机实测 12 passed / 0 failed、8/8 passed）