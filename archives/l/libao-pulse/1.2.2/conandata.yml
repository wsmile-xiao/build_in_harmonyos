sources:
  "1.2.2":
    url: "https://gitlab.xiph.org/xiph/libao/-/archive/1.2.2/libao-1.2.2.tar.gz"
    sha256: "df8a6d0e238feeccb26a783e778716fb41a801536fe7b6fce068e313c0e2bf4d"
patches:
  - patch_file: "patches/0001-ao-plugin-path-env-override.patch"
    patch_description: "Let the AO_PLUGIN_PATH environment variable redirect the driver-plugin directory that configure bakes into libao.so, so a staged install (Conan cache: <pkg>/lib/ao/plugins-4) can dlopen libpulse.so even though the compiled-in path is /lib/ao/plugins-4; only an absolute path is honored, so unset, empty or relative values keep upstream behaviour"
    patch_type: "portability"
