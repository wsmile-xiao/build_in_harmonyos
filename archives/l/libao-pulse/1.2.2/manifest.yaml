software: libao-pulse
display: "libao + PulseAudio plugin"
version: "1.2.2"
upstream_name: libao
upstream_version: "1.2.2"
status: built
build_system: autotools
build_date: 2026-09-26
compile_date: 2026-09-26
target_platform: aarch64-unknown-linux-ohos
issue: "开源鸿蒙PC专项积分赛"

source:
  url: "https://gitlab.xiph.org/xiph/libao/-/archive/1.2.2/libao-1.2.2.tar.gz"
  sha256: "df8a6d0e238feeccb26a783e778716fb41a801536fe7b6fce068e313c0e2bf4d"
  tar_format: tar.gz
  version_mapping: "Conan libao-pulse/1.2.2 maps to upstream libao 1.2.2 (libtool -version-info 4:1:1 -> libao.so.4) plus the PulseAudio driver plugin ao/plugins-4/libpulse.so."

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-pulse"
    - "--disable-esd"
    - "--disable-arts"
    - "--disable-nas"
    - "--disable-alsa"
    - "LIBS="
    - "ac_cv_header_sys_soundcard_h=no"
    - "ac_cv_header_machine_soundcard_h=no"
  dependencies:
    - pulseaudio/17.0.1
  build_requires:
    - automake/1.18
    - libtool/2.5.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ao-plugin-path-env-override.patch (src/audio_out.c: the driver-plugin directory may be redirected through the AO_PLUGIN_PATH environment variable; only an absolute path is honored, so unset, empty or relative values keep the configure-time path)"

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml and test_package/MANIFEST.yml"
    - "official source sha256 verified (gitlab.xiph.org archive)"
    - "real-device conan create is fully green: CREATE_RC=0, libao-pulse test_package 12 passed / 0 failed"
    - "configure summary proves the package is the pulse flavour: PULSE live output: yes, OSS live output: no, all other drivers no"
    - "installed package contains exactly libao.so.4.1.1 (+ symlinks), lib/ao/plugins-4/libpulse.so, include/ao/*.h and lib/pkgconfig/ao.pc"
    - "consumer drives the public <ao/ao.h> API: 7/7 checks - ao_driver_info_list, pulse driver registered via dlopen, pulse metadata, oss absent, unknown id rejected, ao_open_live without a server returns NULL"
    - "readelf contract: AArch64, SONAME libao.so.4, .codesign present on both artifacts, plugin DT_NEEDED = libpulse-simple.so.0 + libpulse.so.0 + libc.so"
  remote:
    - "pending GitCode CI build_and_test.sh run on PR"
  pending:
    - "PR validation / GitCode CI / REL upload"

knowledge_gained:
  - "libao resolves its PulseAudio driver with PKG_CHECK_MODULES(PULSE, [libpulse-simple >= 0.9]). The published pulseaudio/17.0.1 package ships lib/pkgconfig/libpulse-simple.pc, but the .pc records prefix=/ (the recipe installs into a staging prefix), so PKG_CONFIG_PATH alone yields -I/include and -L/lib. Setting PKG_CONFIG_PATH=<pkg>/lib/pkgconfig together with PKG_CONFIG_SYSROOT_DIR=<pkg> re-roots the flags onto the package folder and the check reports 'checking for libpulse-simple >= 0.9 ... yes'. Without them configure silently printed 'PULSE live output: no' and src/plugins/pulse was built empty, which surfaced only as a missing plugin in the test."
  - "AutotoolsDeps aggregates every dependency library into LIBS and configure links LIBS into every probe program. The published PulseAudio libraries carry no .codesign section and the OHOS loader refuses to map such an object, so the 'is the C compiler working?' probe aborted with 'Error loading shared library libpulse.so.0'. Passing the cache-variable-style argument LIBS= (an autoconf precious variable) empties LIBS for all probes while PULSE_CFLAGS/PULSE_LIBS still reach src/plugins/pulse/Makefile, so nothing links the artifact libraries during configure."
  - "libao bakes AO_PLUGIN_PATH in at configure time and configure --prefix=/ makes it /lib/ao/plugins-4. That is correct for a system install but unreachable from the Conan cache, and on OHOS /lib is a read-only symlink to /system/lib, so a package-level test can never create it. patches/0001 lets the environment redirect the directory; the compiled-in default is unchanged when the variable is unset."
  - "OSS is not an AC_ARG_ENABLE driver: configure.ac enables it from the mere presence of <sys/soundcard.h> (which the OHOS sysroot ships even though no /dev/dsp exists), so liboss.so was being packaged next to libpulse.so. Seeding the autoconf cache with ac_cv_header_sys_soundcard_h=no (and _machine_) removes it without touching upstream sources."
  - "The release tarball is a git archive with configure.ac/Makefile.am but no configure, so build() runs autoreconf -fi with automake/1.18 + libtool/2.5.4 as tool_requires; config.guess cannot identify HarmonyOS and --build/--host must be passed explicitly as aarch64-unknown-linux-ohos. The freshly generated configure is rewritten to drop umask 077, which under HMDFS produces a drwx--S--- directory its own owner cannot write (E114)."
  - "The AO_PLUGIN_PATH override also has a runtime payoff beyond the test: a consumer that links the cache package can set AO_PLUGIN_PATH=<pkg>/lib/ao/plugins-4 instead of installing into the root filesystem."
