# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfltk/1.3.11
homepage: "https://www.fltk.org/"

# 上游测试命令：FLTK_BUILD_TEST=ON 构建 test/ 目录 demo 程序
#（上游无单元测试框架，test/ 为演示程序集合，构建即验证编译链接；
#  沙箱无 X display，demo 无法运行，记录构建通过率）
upstream_check_command: "cmake --build . --target test"
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序（demo 程序集合，构建期验证编译链接）
upstream_tests:
  - file: test/hello.cxx
    description: "FLTK 最小 hello demo（编译链接验证）"
    command: "cmake --build . --target hello"
  - file: test/clock.cxx
    description: "FLTK clock demo（编译链接验证）"
    command: "cmake --build . --target clock"
  - file: test/adjuster.cxx
    description: "FLTK adjuster demo（编译链接验证）"
    command: "cmake --build . --target adjuster"
  - file: test/browser.cxx
    description: "FLTK browser demo（编译链接验证）"
    command: "cmake --build . --target browser"
  - file: test/buttons.cxx
    description: "FLTK buttons demo（编译链接验证）"
    command: "cmake --build . --target buttons"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_fltk.sh
    description: "真实消费验证：①产物存在（FL/Fl.H/libfltk/fltk-config，3 断言）②用 \$CC 编译链接创建 Fl_Window 的消费者程序（1 断言；沙箱无 X display 不 show/run）"
    command: "bash test_fltk.sh <pkg_dir>"
  - file: conanfile.py
    description: "验证 include/FL/Fl.H 存在（1 断言）"
    command: "conan test"

# 测试断言总数：上游 demo 构建验证（5 个代表程序全过），
# test_package 编译链接类断言 5 个（含 1 个运行断言，沙箱隔离时 SKIP 不计失败）
assertion_count: 10
