software: libfltk
display: "FLTK"
description: "FLTK (Fast Light Toolkit) — cross-platform C++ GUI toolkit（X11 后端）"
category: gui
homepage: "https://www.fltk.org/"
license: LGPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "X11 后端必需 libx11（依赖 libx11/1.8.13，main 上已有适配）"
    - "可选 X 扩展库（Xinerama/Xfixes/Xcursor/Xft/Xrender/GL）全关闭，依赖链短"
    - "JPEG/PNG/ZLIB 用内置实现（FLTK_USE_SYSTEM_*=OFF），无外部图像依赖"
    - "上游 test/ 为 demo 程序集合（FLTK_BUILD_TEST=ON 构建即验证编译链接，沙箱无 X display 无法运行）"
  common_dependencies:
    - "libx11/1.8.13"
