# 版本级 manifest
# 文件位置: archives/l/lambda-align2/2.0.1/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "2.0.1"
software: lambda-align2
status: built
build_date: "2026-09-29"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/seqan/lambda/archive/refs/tags/lambda-v2.0.1.tar.gz"
  sha256: "35abec91722309421884a8e300fc1d3ee011a1b56eb0d0bb024e585a5b617daa"
  tar_format: tar.gz
  # 上游 .gitmodules 把 include/seqan 声明为 seqan/seqan 子模块，但 tag 归档不含子模块内容
  # （官方 Debian/Ubuntu 打包用 libseqan2-dev 顶替）。此处内嵌官方 seqan-library 2.4.0
  # （header-only，含 share/cmake/seqan/seqan-config.cmake），按上游预期布局放到 include/seqan/。
  extra_sources:
    - name: "seqan-library-2.4.0 (SeqAn 2.x header-only 依赖，内嵌)"
      url: "https://github.com/seqan/seqan/releases/download/seqan-v2.4.0/seqan-library-2.4.0.tar.xz"
      sha256: "dd97b1514ab83acb7d7be911b157979e188e8ca72cc61c430c1e0fd03bcd41a5"
      tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DLAMBDA_LEGACY_PATHS=1"          # 兼容 1.x 后缀数组索引（--db-index-type sa）
    - "-DSeqAn_DIR=<src>/include/seqan/share/cmake/seqan"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_TOOLCHAIN_FILE=<OHOS SDK>/native/build/cmake/ohos.toolchain.cmake"
  dependencies:
    - zlib/1.3.1
    - bzip2/1.0.8
  cc: clang
  cxx: clang++
  # 上游 Release 默认值（保持与 x86_64 参考构建一致，便于逐字节比对期望值）
  upstream_defaults:
    - "LAMBDA_NATIVE_BUILD=OFF（上游默认 ON，会追加 -march=native，交叉编译不可用）"
    - "LAMBDA_FASTBUILD=OFF / LAMBDA_MMAPPED_DB=OFF / LAMBDA_MULTIOPT_BUILD=OFF"
    - "LAMBDA_STATIC_BUILD=OFF / LAMBDA_LINGAPS_OPT=OFF / LAMBDA_LONG_PROTEIN_SUBJ_SEQS=OFF"
    - "LAMBDA_COMPILE_THREADS=1（不加 -flto）"
    - "OpenMP 关闭：-DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=TRUE；OHOS SDK 的 libomp.so 不在设备镜像/本地 musl 运行根（实测 __kmpc_* 重定位失败），且 x86_64 参考构建同样未检测到 OpenMP"
    - "LAMBDA_LEGACY_PATHS=1 经 CMAKE_PROJECT_TOP_LEVEL_INCLUDES 注入为编译宏（上游 CMake 无对应 option）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "patches/0001-cmake-manpages-use-cross-emulator.patch"
    description: "src/CMakeLists.txt 的 5 条 man 页 add_custom_command 改为经 ${CMAKE_CROSSCOMPILING_EMULATOR} $<TARGET_FILE:lambda2> 执行；交叉构建可生成 man 页，原生构建行为不变"
    type: portability
    reason: "上游 man 页生成命令直接调用 lambda2，交叉构建时无法执行目标二进制"
  - file: "patches/0002-seqan-musl-posix-aio-shims.patch"
    description: "内嵌的 SeqAn 2.4.0 在 musl（OHOS）上缺少 POSIX AIO 入口；在 seqan/system/file_async.h 提供编译期 shim（运行时 ENOSYS）"
    type: portability
    reason: "OHOS musl 的 <aio.h> 只有 aiocb/AIO_* 常量，SeqAn 2.4.0 无条件调用 aio_read/aio_write/aio_suspend/aio_error/aio_return/aio_cancel"
  - file: "patches/0003-seqan-glibc-only-thread-affinity.patch"
    description: "SeqAn 的 setCpuAffinity 使用 glibc 专有 pthread_setaffinity_np；限定为 __GLIBC__ 平台"
    type: portability
    reason: "musl 无 pthread_setaffinity_np，非 glibc 平台沿用原有 return false 分支"

# ============================================================
# 测试口径（详见 notes.md 与 PR 描述）
# ============================================================

tests:
  upstream_suite: "tests/（上游 1.x 遗留套件，tests/CMakeLists.txt 定义 80 例）"
  upstream_case_count: 80          # 5 PROG x 2 DI x (1 mkindex + 7 search 格式)
  executed_in_build: 73
  passed_in_build: 73
  skipped: 7                       # test_search_blastn_sa_*：上游 2.x legacy SA 检索路径 SIGSEGV（x86_64 参考构建同样复现）
  reference_build: "x86_64 Linux, clang 15, Release, LAMBDA_LEGACY_PATHS=1（expected.md5 钉死来源）"
  repeatability: "宿主参考构建连续 5 轮全矩阵 73/73（365 例次）"
  consumer_e2e: "test_package/test.sh：蛋白 m8/m9/sam/m9.gz/bam(+sam.bz2) + 核苷酸 m8，10 项断言"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lambda-align2 2.0.1 的 tests/ 目录与 v1.9.5 逐字节相同（1.x 遗留），调用已不存在的 lambda/lambda_indexer 1.x CLI，并用 1.x 平铺索引（db.fasta.<alph>.sa.sa/binseg_*）md5 做期望值；2.x 索引是 *.lambda 目录（index.lf.*/index.sa.*/option:*），结构上不可能命中 —— 上游由此在顶层注释掉 add_subdirectory(tests)，Debian 打包同样禁用"
  - "2.x 的 detectSeqFileAlphabet() 用 CharString 读入 FASTA，保留序列行内空白；真正建索引的强类型读入会跳过空白。因此含空格的 FASTA 在 mkindexp（翻译）路径会被误判为 illegal characters，而在 mkindexn（BLASTN）路径正常 —— 归一化序列行空白可绕开，且对索引内容零影响（逐文件 md5 一致）"
  - "2.x 的 legacy 后缀数组检索路径（-DLAMBDA_LEGACY_PATHS=1）在 BLASTN 下 SIGSEGV：_searchSingleIndex<GlobalDataHolder<Dna5, IndexSa<void>, BlastTabular, (BlastProgram)0>>，x86_64 参考构建同样复现；BLASTP/BLASTX/TBLASTN/TBLASTX 的 sa 检索正常"
  - "2.x 的 BLASTN FM 检索存在约 1% 的非确定性：同一二进制/同一索引/单线程（-t 1）偶尔输出更多命中（16188 -> 51943 行，正常结果为异常结果的子集），属上游缺陷；同一命令重复 100 次中 1 次出现"
  - "SeqAn 2.x 是 header-only 依赖，上游以 git 子模块提供；tag 归档不含子模块内容，须内嵌官方 seqan-library 发行版并把 -DSeqAn_DIR 指向其 share/cmake/seqan"
  - "OHOS musl 的 <aio.h> 只有 aiocb/AIO_* 常量、没有 POSIX AIO 入口函数，SeqAn 2.4.0 在 file_async.h 中无条件调用 aio_read/aio_write/aio_suspend/aio_error/aio_return/aio_cancel，导致任何包含该头文件的翻译单元编译失败；需编译期 shim"
  - "OHOS musl 的 stdio.h 里 stdout 被定义为宏（#define stdout (stdout)），使 SEQAN_OMP_PRAGMA(critical(stdout)) 经宏参数展开变成 omp critical((stdout)) 而报 'expected identifier specifying the name of the omp critical directive'；上游其余 SEQAN_OMP_PRAGMA 用的都是非宏标识符"
  - "OHOS SDK 自带 libomp.so，CMake 会自动启用 -fopenmp=libomp，但该运行库不在设备镜像与本地 musl 运行根中，运行时报 __kmpc_* 符号无法重定位；x86_64 参考构建本身未检测到 OpenMP"
  - "OHOS 交叉链下 ohos.toolchain.cmake 以普通 set() 把 CMAKE_FIND_ROOT_PATH_MODE_* 设成 ONLY，命令行 -D 压不住；需用 CMAKE_PROJECT_TOP_LEVEL_INCLUDES 前置脚本放开，并预设 ZLIB_*/BZIP2_* 缓存变量指向 conan 依赖真实路径"
