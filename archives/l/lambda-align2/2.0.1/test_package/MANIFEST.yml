# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: lambda-align2/2.0.1
homepage: "https://github.com/seqan/lambda"

# 上游测试套件：tests/CMakeLists.txt 定义的 80 例 ctest 矩阵
#   5 PROG (blastn blastp blastx tblastn tblastx) x 2 DI (sa fm) x (1 MKINDEX + 7 检索输出格式) = 80
# 注意：上游 2.x 顶层已注释掉 add_subdirectory(tests)（tests/ 内容与 v1.9.5 逐字节相同，是 1.x 遗留），
# 本配方在 build() 内以 tests_adapt/ 适配驱动真实执行该矩阵（CLI 由 1.x 改为 2.x，期望值重新钉死）。
upstream_check_command: "ctest（上游 tests/ 定义 80 例；本配方经 tests_adapt/run_matrix.sh 逐例执行）"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "sh tests_adapt/run_matrix.sh <SRCDIR> <BINDIR> [emulator]"

upstream_tests:
  - name: "上游 tests 矩阵：建索引用例 test_mkindex_${PROG}_${DI}"
    source: "upstream tests/CMakeLists.txt + tests/maintests.sh（MKINDEX 模式）"
    description: "5 PROG x 2 DI = 10 例；解压上游 tests/db_*.fasta.gz 后用 2.x 命令建索引，索引内相对路径+md5 排序清单摘要与参考构建钉死值逐字节比对"
    command: "lambda2 mkindex{p,n} -d db.fasta -i db.fasta.lambda --db-index-type {sa,fm} -t 1"
  - name: "上游 tests 矩阵：检索用例 test_search_${PROG}_${DI}_${FF}"
    source: "upstream tests/CMakeLists.txt + tests/maintests.sh（SEARCH 模式）"
    description: "5 PROG x 2 DI x 7 输出格式 (m0 m8 m9 sam bam m9.gz sam.bz2) = 70 例；复用上面索引检索上游 tests/queries_*.fasta.gz，输出内容与参考构建钉死值逐字节比对（压缩格式比对解压后规范内容），并校验 BLAST 程序标签/命中数/字段数/魔数"
    command: "lambda2 search{p,n} -q queries.fasta -i db.fasta.lambda -t 1 --version-to-outputfile off -o output_{PROG}_{DI}.{FF}"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "消费者端到端用例：lambda2 mkindexp/searchp 蛋白链路（m8 命中表 + m9 程序标签 + sam 记录 + m9.gz 解压回环 + bam BGZF 魔数 + sam.bz2 解压回环）与 mkindexn/searchn 核苷酸链路，校验真实命中记录"
    command: "conan test_package"

# 鸿蒙特有测试数（规则 12 口径：PC 平台特有 / 鸿蒙适配特有）
# test_package/test.sh 消费者端到端用例在 OHOS 实机 conan create 内执行（1 用例，10 项断言）
harmony_specific_test_count: 1

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
