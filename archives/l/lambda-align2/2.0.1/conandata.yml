# lambda-align2 2.0.1（上游 tag: lambda-v2.0.1，seqan/lambda）
sources:
  url:
    - "https://github.com/seqan/lambda/archive/refs/tags/lambda-v2.0.1.tar.gz"
    - "https://ghfast.top/https://github.com/seqan/lambda/archive/refs/tags/lambda-v2.0.1.tar.gz"
    - "https://ghproxy.net/https://github.com/seqan/lambda/archive/refs/tags/lambda-v2.0.1.tar.gz"
  sha256: "35abec91722309421884a8e300fc1d3ee011a1b56eb0d0bb024e585a5b617daa"

# 上游 .gitmodules 声明 include/seqan 为 seqan/seqan 子模块，但 tag 归档不含子模块内容，
# 官方 Debian/Ubuntu 打包用 libseqan2-dev 顶替。此处内嵌官方 seqan-library 2.4.0
# （header-only + share/cmake/seqan/seqan-config.cmake），按上游预期布局放到 include/seqan/。
seqan:
  url:
    - "https://github.com/seqan/seqan/releases/download/seqan-v2.4.0/seqan-library-2.4.0.tar.xz"
    - "https://ghfast.top/https://github.com/seqan/seqan/releases/download/seqan-v2.4.0/seqan-library-2.4.0.tar.xz"
  sha256: "dd97b1514ab83acb7d7be911b157979e188e8ca72cc61c430c1e0fd03bcd41a5"

patches:
  - patch_file: "patches/0001-cmake-manpages-use-cross-emulator.patch"
    patch_description: "man page 生成命令经 CMAKE_CROSSCOMPILING_EMULATOR 执行 lambda2，交叉构建可生成 man 页（原生命令行为不变）"
    patch_type: "portability"
  # 以下 0002/0003 作用于内嵌的 SeqAn 2.4.0 头文件树（include/seqan/ 前缀），
  # 均为 OHOS/musl 平台可移植性修复；原生 glibc 构建行为不变（详见 notes.md 第 4 节）。
  - patch_file: "patches/0002-seqan-musl-posix-aio-shims.patch"
    patch_description: "OHOS musl 的 <aio.h> 只提供 aiocb/AIO_* 常量、没有 POSIX AIO 入口函数，SeqAn 2.4.0 无条件调用导致编译失败；补编译期 shim（运行时返回 ENOSYS，不使用异步 IO 的路径不受影响）"
    patch_type: "portability"
    base_path: "include/seqan"
  - patch_file: "patches/0003-seqan-glibc-only-thread-affinity.patch"
    patch_description: "SeqAn 的 setCpuAffinity 依赖 glibc 专有的 pthread_setaffinity_np，musl 无此符号；限定为 __GLIBC__ 平台，其它平台保持原有的 return false 分支"
    patch_type: "portability"
    base_path: "include/seqan"
  - patch_file: "patches/0004-mkindex-alphreduction-uninitialized.patch"
    patch_description: "LambdaIndexerOptions::alphReduction 未初始化：该值只由 mkindexp 的 --alphabet-reduction 选项赋值，mkindexn（核苷酸建索引）路径下取未定义值，使 mkindex.hpp 的 translated_seqs 转储条件随平台/编译器变化（OHOS aarch64 与 x86_64 参考构建结果不同）。显式默认 0 后行为确定"
    patch_type: "bugfix"
  - patch_file: "patches/0005-cmake-minimum-version-3.5.patch"
    patch_description: "cmake_minimum_required 由 3.0.0 提升到 3.5：CMake 4.x 已移除对 <3.5 的兼容（报 Compatibility with CMake < 3.5 has been removed），CI worker 使用的 CMake 因此在配置阶段直接失败"
    patch_type: "portability"
