# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libdxfrw/0.5.12
homepage: "https://github.com/LibreCAD/libdxfrw"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 清点结果（R51）：libdxfrw 0.5.12 上游无测试套件——
#   Makefile.am 无 TESTS 声明；源码树无 tests/ 目录；make check 输出 "Nothing to be done"
#   （上游仅有 d2p/dwg2dxf 等示例工具源码，未作为测试注册）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "dxfRW 读写回环测试：write 产出非空 DXF；read 解析最小 HEADER 段并触发 addHeader 回调"
    command: "./test_libdxfrw"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
