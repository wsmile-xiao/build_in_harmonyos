build_system: make

source:
  url: "https://github.com/JuliaLinearAlgebra/libblastrampoline/archive/refs/tags/v5.15.0.tar.gz"
  sha256: "69e0be57ebf037c1997c35edf03565614cd3c6863a695d01348a21bf1f482e74"
  tar_format: tar.gz

build:
  system: make
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "musl libc 没有 RTLD_DEEPBIND，libblastrampoline 自动走 deepbindless 路径 (LBT_BUILDFLAGS_DEEPBINDLESS)"
  - "HarmonyOS uname 返回 'HarmonyOS' 而非 'Linux'，上游 Make.inc 走通用 Unix 分支，无需打补丁"
  - "OHOS musl 将 dlopen/dlsym 合并入 libc.so，链接时无需 -ldl"
  - "aarch64 trampoline 汇编经 x17 索引 + br x16 跳转，clang 隐式生成 .note.GNU-stack，GNU_STACK 为 RW (NX)"
  - "deepbindless 模式下 LP64 + 空后缀 ILP64 后端组合会被 lbt_forward 拒绝（符号名冲突）；LP64 + 64_ 后缀 ILP64 可共存"
  - "lbt_get_forward() 对未知符号返回 (void*)-1 哨兵而非 NULL"
  - "接口自动探测：isamax_(n=0xffffffff00000003) LP64 读低32位=3 返回2；ILP64 读64位为负返回0"
  - "f2c 探测：sdot_(0.5,0.5) 必须返回 0.25；复数返回风格探测：zdotc_/cdotc_ 零长度返回 0+0i"

license: "MIT"
homepage: "https://github.com/JuliaLinearAlgebra/libblastrampoline"
description: "Dynamic BLAS/LAPACK interposition layer with dlopen-based backend forwarding"

upstream_tests:
  status: passed
  method: "all 8 upstream C tests built and run on HarmonyOS/aarch64 against real openblas/0.3.34 (LP64) + controlled ILP64 fake backend"
  c_tests:
    - file: dgemm_test
      result: pass
    - file: isamax_test
      result: pass
    - file: sdot_test
      result: pass
    - file: cdotc_test
      result: pass
    - file: dgemmt_test
      result: pass
    - file: dpstrf_test
      result: pass
    - file: sgesv_test
      result: pass
    - file: inconsolable_test
      result: pass
  julia_tests:
    status: skipped
    reason: "test/runtests.jl requires a Julia runtime, out of scope for a C library Conan package"

ci_validation:
  conan_create: "pass (ohos-aarch64 profile, native HarmonyOS/aarch64 build)"
  test_package: "pass (41/41 consumer assertions + 13/13 OHOS platform invariants)"
  scoped_ci: "pass (L0/L1 incl. L1e sabotage re-test/L4/L5; KC/JC junk+knowledge checks pass)"
  symbol_check: "pass (upstream exported_funcs.inc 5146/5146 exported, 0 missing; extras are upstream's 64_ ILP64 variants + internal symbols, matching pristine upstream build)"
  absolute_path_scan: "pass (recipe files: 0 host paths; packaged ELF: paths only inside DWARF debug info, same as upstream default -g and other repo packages)"
  diff_check: "pass (15 files, layout per ARCHIVE-SPEC: manifest/conandata/conanfile + test_package with MANIFEST.yml)"

knowledge_dedup: |
  No new knowledge draft: adaptation hit no OHOS-specific root cause (zero
  patches; upstream Make.inc natively builds the deepbindless codepath on
  musl/OHOS). Existing knowledge base has no RTLD_DEEPBIND/deepbindless or
  BLAS-related entries; the only trampoline draft (libffcall) covers a
  different topic (executable memory pages). Platform semantics discovered
  during audit are recorded in knowledge_gained above for future reference.
