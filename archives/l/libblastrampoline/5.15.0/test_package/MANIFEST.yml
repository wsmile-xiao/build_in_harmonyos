# test_package/MANIFEST.yml
name: libblastrampoline-test
package: libblastrampoline/5.15.0
type: functional

sources:
  - file: test_consumer.c
    role: consumer test binary; asserts symbol forwarding, backend
        switching, interface autodetection (LP64 / ILP64 / suffix),
        error paths and deepbindless conflict semantics against
        controlled fake backends
  - file: fakeblas_lp64.c
    role: controlled LP64 BLAS backend (suffix "", 32-bit ints);
        deterministic results for exact assertions
  - file: fakeblas_ilp64.c
    role: controlled ILP64 BLAS backend (suffix "64_", 64-bit ints);
        allows testing both dgemm_ and dgemm_64_ forwarding
  - file: fakeblas_ilp64_nosuffix.c
    role: controlled ILP64 backend with LP64-style names (suffix "");
        must be REFUSED alongside an LP64 backend on deepbindless
        (musl/OHOS) systems — conflict detection probe
  - file: test_ohos.sh
    role: OHOS platform invariants — AArch64 ELF, SONAME
        libblastrampoline.so.5, single NEEDED libc.so (musl),
        key symbol exports, .codesign section, standalone dlopen
  - file: CMakeLists.txt
    role: build script (three MODULE backends + consumer test)
  - file: conanfile.py
    role: conan test_package driver (CMake + ctest + test_ohos.sh on OHOS)

coverage:
  - lbt_get_config / LBT_BUILDFLAGS_DEEPBINDLESS / lbt_get_use_deepbind
  - lbt_forward(backend, clear, verbose, error_msg) incl. clear=0 stacking
  - interface autodetection via isamax_ probe (LP64 vs ILP64)
  - suffix autodetection ("", "64_")
  - dgemm_/dgemm_64_/daxpy_/daxpy_64_/sdot_ trampoline forwarding
  - backend switching (clear=1) and result change
  - lbt_get_forward unknown-symbol sentinel (void*)-1
  - deepbindless conflict: LP64 + unsuffixed ILP64 refused both orders
  - error path: lbt_forward("/nonexistent/...") returns 0

upstream_tests:
  status: not-applicable-here
  note: upstream C tests (test/dgemm_test etc.) were run manually during
    adaptation against real openblas/0.3.34 + controlled ILP64 backend;
    see ../manifest.yaml. Julia test suite requires a Julia runtime.

passes:
  - name: consumer
    command: ctest
    expected: 41 PASS assertions, 0 failures
  - name: ohos
    command: bash test_ohos.sh
    expected: all OHOS platform invariant checks PASS
