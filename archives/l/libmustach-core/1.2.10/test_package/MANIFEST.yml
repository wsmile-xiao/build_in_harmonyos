# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmustach-core/1.2.10
homepage: "https://gitlab.com/jobol/mustach"

# 上游测试套件存在性 (经审计源码包确认, 见下方 upstream_test_audit)
upstream_tests_exist: true

# 上游测试审计 (源码: mustach-1.2.10.tar.bz2,
# sha256 7e7e97e3f72e33080ad55f5119369e13f9f467b8fe34258a00cad05b0fec1c19)
upstream_test_audit:
  source_tarball: "mustach-1.2.10.tar.bz2"
  source_sha256: "7e7e97e3f72e33080ad55f5119369e13f9f467b8fe34258a00cad05b0fec1c19"
  top_level_files:
    - Makefile           # test/basic-tests/spec-tests 目标; basic-tests 依赖 mustach 工具二进制
    - dotest.sh          # 单用例驱动: 运行 mustach 工具, diff resu.ref, 可选 valgrind
    - test1..test8/      # 8 个工具级用例目录, 各含 json + must 模板 + resu.ref
    - test-specs/        # test-specs.c + 三后端 .ref, 输入来自 git clone 的 mustache/spec
    - meson.build        # meson test() 同样只注册工具有关的 test1..test8 与 specs
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "make check / ctest 目标"
    - "tests/ 目录与 *test*.c 独立测试源"
  scan_result: "无 gtest/pytest/ctest; 无 make check 目标; 8 个 testN/Makefile 的 test 目标均调用 ../dotest.sh, 依赖上层构建出的 mustach 工具二进制"
  make_check_output: "无 make check 目标; 最接近的是 make basic-tests (test1..test8, 需 mustach 工具) 与 make spec-tests (需-backend 工具 + git clone mustache/spec @ v1.4.1)"
  reason: "test1..test8 全部通过 mustach CLI 工具执行 (dotest.sh, diff -w resu.ref)。build() 内离线 vendor cJSON 1.7.19 (MIT, vendor_cjson/cJSON.c/h) 编译 mustach 工具 (TOOL=MUSTACH_TOOL_CJSON)，test1..test5/test7/test8 直跑 mustach 工具，test6 用 cJSON 移植的 test-custom-write-cjson.c 跑相同 fixture 与相同 dotest 断言 (json -U must -l must -x must)；spec-tests 需联网 git clone mustache/spec @ v1.4.1，未在 build() 执行，见补充说明"

# 上游测试命令 (build() 内真实执行)
upstream_check_command: "make basic-tests (cJSON tool, test6 via cJSON port)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make basic-tests (cJSON tool, test6 via cJSON port)"

# 上游实际的测试程序 (存在但受后端/网络约束, 本轮未在真机执行)
upstream_tests:
  - file: test1/Makefile
    source: mustach-1.2.10/test1/Makefile
    description: "工具级用例 test1: dotest.sh json must (含扩展语法与转义对照)"
    command: "make basic-tests"
  - file: test2/Makefile
    source: mustach-1.2.10/test2/Makefile
    description: "工具级用例 test2: dotest.sh json must"
    command: "make basic-tests"
  - file: test3/Makefile
    source: mustach-1.2.10/test3/Makefile
    description: "工具级用例 test3: dotest.sh json must"
    command: "make basic-tests"
  - file: test4/Makefile
    source: mustach-1.2.10/test4/Makefile
    description: "工具级用例 test4: dotest.sh json must"
    command: "make basic-tests"
  - file: test5/Makefile
    source: mustach-1.2.10/test5/Makefile
    description: "工具级用例 test5: 含 must2/must3 partial 模板"
    command: "make basic-tests"
  - file: test6/Makefile
    source: mustach-1.2.10/test6/Makefile
    description: "工具级用例 test6: cJSON 移植的 test-custom-write-cjson 跑相同 fixture (json -U must -l must -x must, diff resu.ref)"
    command: "make basic-tests (cJSON tool, test6 via cJSON port)"
  - file: test7/Makefile
    source: mustach-1.2.10/test7/Makefile
    description: "工具级用例 test7: dotest.sh json base.mustache"
    command: "make basic-tests"
  - file: test8/Makefile
    source: mustach-1.2.10/test8/Makefile
    description: "工具级用例 test8: dotest.sh json must"
    command: "make basic-tests"
  - file: test-specs/test-specs.c
    source: mustach-1.2.10/test-specs/test-specs.c
    description: "mustache/spec 官方 spec 套件 (三后端, 需 git clone spec @ v1.4.1)"
    command: "make spec-tests"

# test_package 中自带的测试 (消费者视角验证)
# R34: 均实质调用被测包 API (mustach_mem / mustach_wrap_mem)
test_package_tests:
  - file: test_core.c
    description: "合并单一二进制 (render + wrap 两套件): mustach_file 渲染 (变量插值/HTML转义/section/反转section/列表迭代 + 4 类错误路径) 与 mustach_wrap_file 渲染 (转义插值 + 三花括号原文输出), 两个 sentinel"
    command: "test_core"

# 测试断言总数 (render 套件 7 项 + wrap 套件 5 项)
assertion_count: 12
