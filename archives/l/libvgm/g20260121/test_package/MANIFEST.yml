# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: libvgm/g20260121
homepage: "https://github.com/ValleyBell/libvgm"

# 上游测试命令 — 经源码核查：全仓库无 add_test/ctest 集成；CMakeLists.txt 的
# BUILD_TESTS=ON 仅构建 audiotest/emutest/audemutest/vgmtest 四个开发用交互
# 程序（写 out.raw / 需交互 / 需外部 VGM 数据），无自动判定；上游仓库的 GHA
# CI 也只做 configure+build（-DBUILD_TESTS=ON 仅编译）不运行断言。
upstream_check_command: "none (upstream has no ctest target; BUILD_TESTS programs are interactive dev tools)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# 上游测试程序流程移植说明：
# emutest.c 的 SN76496 直渲染流程与 vgm2wav.cpp 的 PlayerA 加载-播放流程
# 已移植进 test.cpp 作为消费者级断言（上游零改动，仅移植思路）。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "逐 API 断言：vgm-emu SN76496 直渲染（SndEmu_Start/GetDeviceFunc/Update 非静音/Stop，6 项）+ vgm-player PlayerA 播放自生成最小 VGM 1.50（引擎注册/输出设置/FileLoader/DataLoader_Load/LoadFile/VGMPlayer 自动选择/Start/总时长/渲染帧数/非静音/Stop，11 项）"
    command: "./test_libvgm"
  - file: consumer_vgm_to_wav.cpp
    description: "消费者用例：下游 VGM→WAV 音乐转换器——zlib gzwrite 生成 .vgz 压缩夹具（3 项）→ vgm-utils FileLoader gzip 魔数检测透明解压（2 项）→ PlayerA/VGMPlayer/emu 整段渲染且帧数与 VGM total ticks 一致（5 项）→ Stop 清理（1 项）→ 写标准 RIFF/WAVE 后回读逐字段校验（RIFF/WAVE/fmt/data 布局、PCM 2ch 44100Hz 16bit、chunk 尺寸一致、数据完整、非静音等，9 项）"
    command: "./consumer_vgm_to_wav"

# 测试断言总数 (近似值, 用于质量评估)
# test.cpp：17 个 CHECK（emu 6 + player 11）
# consumer_vgm_to_wav.cpp：20 个 CHECK（zlib 3 + loader 2 + player 5 + stop 1 + WAV 9）
# 真机实测：37/37 全过（2026-09-19，10.62.178.77，ohos-aarch64 clang 15.0.4）
assertion_count: 37
