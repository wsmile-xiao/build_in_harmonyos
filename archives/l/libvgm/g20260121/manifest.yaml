name: libvgm
version: g20260121
description: "Video Game Music playback library (modular VGMPlay rewrite): VGM/S98/DRO/GYM players + sound chip emulation cores"
homepage: "https://github.com/ValleyBell/libvgm"
license: "NOASSERTION"
build_system: "CMake"
cpp_standard: "C++14"

status: "pre-adaptation"

source:
  url: "https://github.com/ValleyBell/libvgm/archive/57585ea7a53f56bcf5a56071068c6ef9154ca299.tar.gz"
  sha256: "7a5677921eaf4c0d3cef07c8b6b6da2cbf2d5da90e54d7d65fd955a409189954"

dependencies:
  conan:
    - zlib/1.3.2
  system:
    - pthread
    - m
    - iconv (musl libc 内建)

features_disabled:
  - USE_SANITIZERS (OHOS 不注入 -fsanitize)
  - BUILD_TESTS (交互式开发工具)
  - BUILD_PLAYER / BUILD_VGM2WAV (CLI 不随库分发)
  - AUDIODRV_ALSA / AUDIODRV_PULSE / AUDIODRV_LIBAO / AUDIODRV_OSS / AUDIODRV_SADA (OHOS 无对应开发包，仅保留 AUDIODRV_WAVEWRITE)

platform:
  os: [Linux, OHOS]
  arch: [aarch64]

notes: |
  - 版本 g20260121 = master commit 57585ea（2026-01-21 当天最后一次提交），上游无 release tag
  - 产物为 4 个静态库：vgm-utils / vgm-audio / vgm-emu / vgm-player，头文件安装于 include/vgm/
  - 上游无 LICENSE 文件：组件混合许可（33 个 MAME BSD-3-Clause 核心、Nuked* LGPL/GPL、Gens YM2612 GPL 等）
  - 已知限制：musl iconv 不支持 CP932，S98 播放器标签转换在运行时优雅降级（标签原样保留），VGM 主格式不受影响
  - 上游无 ctest 测试目标；消费者级验证见 test_package（PlayerA 渲染最小 VGM 断言非静音）
