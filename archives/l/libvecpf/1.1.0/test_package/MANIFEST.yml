# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libvecpf/1.1.0
homepage: "https://github.com/libvecpf/libvecpf"

# 上游测试命令（autotools：TESTS = $(check_PROGRAMS)，由 make check 驱动）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test_vecpf.c
    source: libvecpf-1.1.0/test_vecpf.c
    description: >-
      上游自带测试套件（1621 行）。经 configure + make check 真实构建并执行；
      OHOS/musl 下 HAVE_INT128_T 与 __VSX__ 均未定义（两者由上游 configure
      的特征探测决定，在非 PowerPC 平台上本就不成立），因此上游自身排除了
      int128 与 double 两组，其余 8 组全部实际执行。
    command: "make -j1 check"
    status: "通过 1340/1340"

test_package_tests:
  - file: test_vecpf.c
    description: >-
      消费者测试 - 仅通过已安装的 <vecpf.h> 与共享库调用对外公开 API
      （vecpf_sprintf / vecpf_asprintf / vecpf_fprintf），逐项比对
      手工推算的期望输出；另含大字段宽度（%1100vlu）不截断、20 万次调用
      不增长 RSS（内存泄漏回归）、4 线程并发一致性（线程安全回归）三项检查。
    command: "./test_vecpf"
  - file: test_vecpf_cxx.cpp
    description: >-
      C++ 消费者测试 - 本库是 C 库，公开头文件必须带 extern "C"，否则 C++ 编译器会
      改编符号名导致链接失败（ld.lld: undefined symbol: vecpf_sprintf(char*, ...)）。
      本用例专门守护这一点。
    command: "./test_vecpf_cxx"

# 测试断言总数
# 上游测试 1340/1340；test_package 14/14 + C++ 消费者 2/2；test_ohos 平台专项 T1-T5 = 5
# 合计 1340 + 14 + 2 + 5 = 1361
assertion_count: 1361
