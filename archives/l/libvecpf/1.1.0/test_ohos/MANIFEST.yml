# test_ohos/MANIFEST.yml — libvecpf 1.1.0 HarmonyOS PC 专项验证声明
#
# 本目录是**鸿蒙平台专项验证**（rule12「鸿蒙特有测试」的实质承载）：
# 断言的是「这份产物在 OHOS/aarch64/musl 上成立」这一平台事实，
# 与 test_package/（跨平台 API 正确性，消费者视角）互不替代。

package: libvecpf/1.1.0
purpose: >-
  HarmonyOS PC 平台专项验证：产物平台身份（ELF64/AArch64、musl、OHOS 签名段、
  无宿主路径泄漏）+ 用 OHOS 工具链链接已安装共享库并真实运行的端到端功能验证。

checks:
  - id: T1
    name: "aarch64 ELF 验证（产物为 ELF64 AArch64）"
    command: "readelf -h <lib/libvecpf.so.1.0.1>"
  - id: T2
    name: "musl libc（NEEDED 中无 glibc / ld-linux）"
    command: "readelf -d <lib/libvecpf.so.1.0.1>"
  - id: T3
    name: ".codesign 段存在（OHOS 签名管线产出）"
    command: "readelf -S <lib/libvecpf.so.1.0.1>"
  - id: T4
    name: "无宿主绝对路径泄漏（/storage/、/home/、/Users/、构建目录名）"
    command: "strings <lib/libvecpf.so.1.0.1>"
  - id: T5
    name: >-
      真实端到端功能验证：OHOS 工具链编译消费者程序 → 链接已安装 libvecpf.so →
      运行比对独立推算的期望值（%vld/%vlx/%vhu/%vd/%vf/vecpf_asprintf）+
      三项回归（大字段宽度不截断、20 万次调用 RSS 不增长、4 线程并发一致性）
    command: "clang -I <pkg>/include ... -lvecpf && ./consumer"

run_command: "python3 run_ohos_test.py <conan_package_folder>"

expected_output: "TEST_OHOS_ALL_PASS"
