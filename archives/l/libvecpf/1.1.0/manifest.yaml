  # 本机生成路径不入仓（原值泄漏构建者本地工作目录）；orig/work 为
  # 「上游 pristine 解包目录 / 打完 0001 后的工作副本」两个临时目录。
  generated_at: '2026-09-27T22:20:00'
  patches_count: 2
  files_changed: 10
  files_added: 1
  # 0001: 7 改 + 1 增（vecpf-ohos-compat.h）
  # 0002: 4 改（configure / config.guess / Makefile.in / ltmain.sh），
  #       按「pristine + 0001」为 orig 侧生成，确保与 0001 串行应用时零 offset、无 .rej

patch_classification:
  - file: 0001-ohos-musl-printf-hook-compat-layer.patch
    type: manual
    platform_only: true
  - file: 0002-ohos-build-tmpdir-umask.patch
    type: manual
    platform_only: true
    guard: '__GLIBC__'
