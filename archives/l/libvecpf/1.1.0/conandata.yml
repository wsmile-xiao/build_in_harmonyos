# conandata.yml - libvecpf 1.1.0
# 文件位置: archives/l/libvecpf/1.1.0/conandata.yml
# 本文件是源码下载元数据的唯一真相源，conanfile.py 通过
# self.conan_data["sources"] / self.conan_data["patches"] 读取。
#
# 源码来源（R39）：上游官方 tag v1.1.0 归档（GitHub 托管，官方正式源）。
# 上游仓库 github.com/libvecpf/libvecpf 的 v1.1.0 tag（commit ebef480d）即本版本
# 原始发布物；GitHub archive tarball 与 Debian pool 的 .orig.tar.gz 逐字节相同
# （均 386781 字节，sha256 33ed7c13...19e7），故 sha256 不变。

sources:
  url: "https://github.com/Libvecpf/libvecpf/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "33ed7c13af882ea38ab7fa32e72f1e17e611378e74aadfad9c1301ed9a0019e7"

patches:
  - patch_file: "patches/0001-ohos-musl-printf-hook-compat-layer.patch"
    patch_description: >-
      OHOS (aarch64 / musl) portability.
      (1) AltiVec: <altivec.h> is included unconditionally and the PowerPC-only
      `vector` keyword is used, although the library uses no AltiVec intrinsics
      at all (`vec_*` names are libvecpf's own functions).  Drop the header and
      switch to the portable __attribute__((vector_size(16))) extension, which
      has the identical 16-byte layout.
      (2) printf hook: libvecpf plugs into the C library through glibc's private
      <printf.h> API (register_printf_type/_modifier/_specifier), which has no
      musl counterpart.  Add the in-tree compatibility layer
      vecpf-ohos-compat.h (registry + front-end dispatcher + output sink) and
      expose the same formatting through explicit entry points
      (vecpf_printf / vecpf_fprintf / vecpf_sprintf / vecpf_asprintf).
      (3) Build: turn the fatal "requires a GLIBC printf.h header" check into a
      warning, confine -maltivec to PowerPC targets, and drop the absent
      ChangeLog.md from dist_doc_DATA (it is generated from git history, which
      the release tarball does not contain).
      (4) Test harness: map the bare `vector` keyword onto the portable vector
      extension, and route only the calls that render the vector under test
      (16 sites, `sprintf (actual_output, ...)`) through a VECPF_TEST_FMT macro
      which resolves to the library's entry points off glibc.  The 18 sites in
      gen_cmp_str() that build the *expected* values still call the host libc,
      so the comparison keeps an independent oracle.  Format strings, expected
      values and assertions are untouched.
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-build-tmpdir-umask.patch"
    patch_description: >-
      OHOS (hmfs / shared-home) build-system temp-directory umask.
      autoconf's config.status creates the scratch directory that holds its
      generated awk scripts with

          { tmp=`(umask 077 && mktemp -d "./confXXXXXX") 2>/dev/null` && ...; } ||
          { tmp=./conf$$-$RANDOM; (umask 077 && mkdir "$tmp"); }

      i.e. mode 0700.  On the OHOS shared volume (hmfs, mounted with acl +
      hmmac) a directory created that way also inherits the setgid bit of its
      parent, so it ends up as drwx--S--- (2700): the group permission bits are
      cleared.  The build process is not recognised as the recorded owner of
      the files it creates on that volume, and relies on the group grant to
      write; the very next statement, `echo 'BEGIN {' >"$ac_tmp/subs1.awk"`,
      therefore dies with EACCES:

          ./config.status: line 871: ./confXXXXXX/subs1.awk: Permission denied
          config.status: error: could not setup config files machinery

      The same applies to the other temp directories the build system creates
      for itself: config.guess (used by configure for the build triple),
      Makefile.in's distcheck DESTDIR scratch dir, and ltmain.sh's libtool
      temp dir.  Relax the umask from 077/0077 to 002/0002 throughout.  The
      directories are still freshly made with a random suffix and removed
      afterwards; only the permission mask changes, so concurrent-build safety
      is unchanged.  Nothing in the produced library is affected - this is
      purely a build-time scratch-directory permission fix.
    patch_type: "portability"
