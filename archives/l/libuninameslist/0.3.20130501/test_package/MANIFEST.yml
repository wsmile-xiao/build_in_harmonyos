package: "libuninameslist/0.3.20130501"
homepage: "https://github.com/fontforge/libuninameslist"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  Makefile.am (libuninameslist 0.3.20130501 tag archive) declares no TESTS,
  check_PROGRAMS, check-LTLIBRARIES, check-local, or custom test target;
  `make check` prints "Nothing to be done for 'check'" — the automake
  default zero-test audit target.  The optional buildnameslist program
  (EXTRA_PROGRAMS) is a data-table regeneration helper (buildnameslist.c)
  that needs NamesList.txt downloaded at build time; it is not registered
  in TESTS and never part of the check target.  Consumer-level validation
  lives in test_package/.

test_package_tests:
  - id: "consumer-contract"
    source: "consumer_tests.c"
    command: "consumer_tests"
    description: >-
      Exercises the installed library through its whole public API:
      uniNamesList_NamesListVersion banner (Unicode 6.2 stamp),
      uniNamesList_name lookups across ASCII / Latin-1 / Greek and the
      CJK-radical range, table-accurate NULL behaviour for the ranges
      NamesList.txt 6.2 leaves un-named (CJK Unified Ideographs,
      Private Use Area), uniNamesList_annot cross-reference checks, and
      out-of-range code-point stability (NULL or empty, never garbage).

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

# Runtime assertion accounting (consumer_tests.c, verified by source audit):
#   16 numbered CHECKs:
#     version banner   2 (non-NULL; carries "6.2")
#     ASCII names      3 (0x29 / 0x41 / 0x30)
#     Latin-1 names    1 (0xE9)
#     Greek names      1 (0x3BB official spelling "LAMDA")
#     annotations      4 (0x3BB non-NULL + lambda xref; 0xFF non-NULL +
#                        latin xref)
#     CJK/PUA          3 (0x2E80 radical named; 0x4E2D ideograph NULL;
#                        0xE000 PUA NULL — table-accurate boundary)
#     out-of-range     2 (0x110000, 0xFFFFFFFF NULL-or-empty)
test_case_count: 1
assertion_count: 16
