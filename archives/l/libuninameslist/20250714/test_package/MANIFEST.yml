# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libuninameslist/20250714
homepage: "https://github.com/fontforge/libuninameslist"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (autotools 并行测试，tests/Makefile.am)
upstream_tests:
  - file: tests/call-test0.c
    source: libuninameslist-20250714/tests/call-test0.c
    description: "Query unicode name/annot/block API for a range of code points (subtest 0)"
    command: "./call-test0"
  - file: tests/call-test1.c
    source: libuninameslist-20250714/tests/call-test1.c
    description: "Query unicode name/annot/block API for a range of code points (subtest 1)"
    command: "./call-test1"
  - file: tests/call-test2.c
    source: libuninameslist-20250714/tests/call-test2.c
    description: "Query unicode name/annot/block API for a range of code points (subtest 2)"
    command: "./call-test2"
  - file: tests/call-test6.c
    source: libuninameslist-20250714/tests/call-test6.c
    description: "Query unicode name/annot/block API for a range of code points (subtest 6)"
    command: "./call-test6"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 libuninameslist 公开 C API 验证名称/版本/块查询"
    command: "./test_libuninameslist"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17