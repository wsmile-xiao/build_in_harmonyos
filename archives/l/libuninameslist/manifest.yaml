software: libuninameslist
display: "libuninameslist (Unicode NamesList data)"
description: "Unicode 字符名与注释查询库（NamesList.txt 数据表，fontforge 生态）"
category: library
homepage: "https://github.com/fontforge/libuninameslist"
license: Unicode-TOU
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 git tag 归档不含生成的 configure，构建时需 autoreconf -f -i 引导（E443：autotools 闭包经 tool_requires automake/1.18 + libtool/2.5.4 补齐）"
    - "2013 年版 config.guess/config.sub 不识别 *-linux-ohos（E007/E514），配方显式 --build/--host=aarch64-unknown-linux-ohos 钉死三元组，探测不运行"
    - "Makefile.am 零测试注册：make check 为 automake 默认零测试审计目标（Nothing to be done），消费者验证在 test_package/（14 CHECK）"
    - "纯 C 零第三方依赖（nameslist.c 静态数据表+二分查找，仅 libc）；非系统同名库，默认动态由 Conan 管理依赖链"
    - "HMDFS 适配：configure 的 umask 077 改写（E114）+ make -j1（E074 jobserver fifo EPERM）"
    - "可选法语注释库 --enable-oldfrenchlib 未启用（上游默认关闭，主库即 fontforge 消费对象）"
  common_dependencies: []

versions:
  "0.3.20130501":
    status: built
    build_date: "2026-09-15"
    recommended: true
