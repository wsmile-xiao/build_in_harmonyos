software: libamrnb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/11.0.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "11.0.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"

# 构建系统类型 (top-level)
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（主源：FreeBSD ports 基础设施镜像；上游官方站已下线，
  # 详见 conandata.yml 三重校验说明）
  url: "https://mirrors.ustc.edu.cn/freebsd-ports/distfiles/libamrnb/amrnb-11.0.0.0.tar.bz2"
  # 附加源码：3GPP TS 26.104 v11.0.0 参考实现（构建期解包，不分发）
  #   https://ftp.3gpp.org/Specs/archive/26_series/26.104/26104-b00.zip
  #   sha256: 23df8b24b0f009783027b8eef5fa8225ec71f859f2704bdb06829f09018cc8f1

  # 源码校验和
  sha256: "3890004b665278b963ecaae2dc1321dcee29c53ea9d91aaf18d9286105e0f1e1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    # OHOS 交叉：2012 版 config.guess/config.sub 不识别 aarch64-linux-ohos，
    # 使用 generic linux-gnu triplet（celt/a52dec 先例）
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # libamrnb 纯 C 实现，零 conan 依赖；仅链接系统 libm

  # 编译器
  cc: clang
  cxx: clang++

  # 构建期宿主工具依赖（非 conan 包）
  host_tools:
    - bash
    - unzip   # 解包 3GPP zip（configure 强制探测）
    - patch   # prepare_sources.sh 应用 3 个上游可移植性补丁
    - sed
    - tr

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
#   0001: 去除 configure 临时目录创建的 umask 077（E011/E114，HMDFS setgid 下
#   config.status 在 subs1.awk 处 Permission denied；上游 3 个 3GPP 代码补丁
#   由 prepare_sources.sh 构建期自动应用）
patches_applied:
  - "0001-configure-hmdfs-umask.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "3gpp.org WAF 按 UA 过滤：curl/wget UA 得 35KB HTML 拦截页（HTTP 200），Conan UA 可正常下载；CI 预下载 size>100 误判会污染 conandata URL，conan 校验失败自动回落列表下一 URL"
  - "gama 坏文件名（\r\r）合入 origin/main 后 Windows 无法建新 worktree/快进，需基于合入前 commit + sparse-checkout 排除"
