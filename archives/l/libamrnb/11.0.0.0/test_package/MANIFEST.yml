# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libamrnb/11.0.0.0
homepage: "http://www.penguin.cz/~utx/amr"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清点（R51，2026-09-18 核验）：
# - 构建封装包 amrnb-11.0.0.0.tar.bz2 无 tests/ 目录、无 check 目标
#   （Makefile.am 全量核阅：仅 libamrnb.la + 10 个 bin_PROGRAMS，无 TESTS/check）。
# - 3GPP 26104-b00.zip 内层 26104-b00_ANSI_C_source_code.zip 共 18 个文件，
#   全部为 c-code/*.c|*.h + makefile.gcc/makefile.win32 + readme.txt，
#   无测试向量、无测试程序。
# 上游确无自动化测试，证据：上述两包文件清点；FreeBSD audio/libamrnb port
# 亦未定义 do-test（仅构建库与工具）。
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "消费者测试 - 8 种 AMR-NB 模式编码（GP3 存储格式精确字节数断言）+ DTX/SID + MR122 多帧编解码往返（解码器收敛后正弦保真度断言）"
    command: "./test_libamrnb"
  - file: conanfile.py
    description: "amrnb-encoder CLI 冒烟 - 正弦 PCM 编码为 AMR 流并校验 #!AMR 魔数"
    command: "amrnb-encoder MR122 in.pcm out.amr"

assertion_count: 19
