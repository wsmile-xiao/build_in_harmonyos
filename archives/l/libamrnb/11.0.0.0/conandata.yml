# conandata.yml — libamrnb 11.0.0.0
#
# 双源结构（与 FreeBSD audio/libamrnb port 同构）：
#   [0] amrnb-11.0.0.0.tar.bz2 — penguin.cz/~utx/amr 构建封装包
#       （configure + 3 个可移植性补丁 + prepare_sources.sh 接口变换脚本）
#   [1] 26104-b00.zip — 3GPP TS 26.104 v11.0.0 AMR-NB 浮点 ANSI-C 参考实现源码
#       （构建时由 Makefile 解包并自动应用补丁，不参与打包分发）
#
# 上游官方站 www.penguin.cz/~utx/amr 已不可达（http only + 长期超时），
# 借助 FreeBSD ports 基础设施镜像（distcache + 中科大）获取 wrapper 包。
#
# sha256 三重交叉验证（2026-09-18）：
#   - FreeBSD ports audio/libamrnb distinfo（官方权威校验记录）：
#       amrnb-11.0.0.0.tar.bz2 = 3890004b665278b963ecaae2dc1321dcee29c53ea9d91aaf18d9286105e0f1e1
#       26104-b00.zip           = 23df8b24b0f009783027b8eef5fa8225ec71f859f2704bdb06829f09018cc8f1
#   - RPM Fusion amrnb sources 文件 md5：
#       amrnb-11.0.0.0.tar.bz2 = 673ab645f61d1c830b6429a5ba76bb1f
#       26104-b00.zip           = b88fd1ca1fd23e24be1cc70f3227b3e1
#   - 本机从 3GPP 官方源（浏览器 UA 直下）+ distcache + USTC 三处下载实测一致。
#
# 3GPP 源 URL 说明（重要）：
#   www.3gpp.org 前置 WAF 按 User-Agent 过滤：curl/wget UA（CI 预下载所用）得到
#   ~35KB HTML 拦截页（HTTP 200，CI 预下载 size>100 判定会误存为"成功"）；Conan
#   自带 UA（Conan/2.x ...）实测可正常下载真实文件。因此第二个 URL 使用大写
#   scheme/host（RFC 3986 大小写不敏感，requests 正常处理），使其避开 CI 预下载
#   的小写正则抽取，由 conan 原生下载；小写官方 URL 保留在首位满足 R39 官方源
#   要求，即便被预下载 WAF 页污染，conan 校验失败后自动回落下一 URL。

