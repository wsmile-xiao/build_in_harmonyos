software: libxtst
display: "X.Org XTEST Extension Library"
description: "Client library for the X TEST extension (XTest fake input and X Record)"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/lib/libXtst"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Uses the release Autotools files without source patches"
    - "Consumes the published libx11/libxext/libxi/libxfixes/libxau/xorgproto Conan packages"
    - "Preserves the upstream libXtst.so.6 ABI and XTest/XRecord public headers"
  common_dependencies:
    - libx11
    - libxext
    - libxi
    - libxfixes
    - libxau
    - xorgproto

versions:
  "1.2.5":
    status: built
    build_date: "2026-09-03"
    conan_ref: "libxtst/1.2.5"
    note: "Upstream-version tracking policy; local W3 conan create passed (libXtst.so.6.1.0), test_package symbol/API verification OK"
  "6.1.0":
    status: built
    build_date: "2026-08-14"
    conan_ref: "libxtst/6.1.0"
    note: "Historical ABI version scheme mapping libXtst 1.2.4 to libXtst.so.6.1.0"
