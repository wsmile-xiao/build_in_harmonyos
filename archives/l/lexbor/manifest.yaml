software: lexbor
display: "Lexbor"
description: "Open source HTML Renderer library - fast, lightweight HTML/CSS parser"
category: data              # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "http://lexbor.com"
license: Apache-2.0
build_system: cmake         # 常用构建系统（可被版本级覆盖）

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 C 库，无外部依赖"
    - "CMake 构建，无需补丁"
    - "支持动态库和静态库"
    - "无命令行工具（纯库项目）"
  common_dependencies: []   # 无依赖

  known_issues:
    - "访问 GitHub 需处理 SSL 证书验证（建议用本地文件或 curl -k 下载）"
    - "项目无 make check 目标（库项目特性）"

# 版本索引（所有已归档版本，含状态）
versions:
  "2.6.0":
    status: published         # published | built | failed | archived
    build_date: "2026-05-29"
    published_date: "2026-05-30"
    published_as: lexbor      # 在 cmd-pkgs 中发布的软件名