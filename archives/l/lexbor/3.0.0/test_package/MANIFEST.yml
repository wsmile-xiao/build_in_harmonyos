# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lexbor/3.0.0
homepage: "https://lexbor.com"

# lexbor 是 C 库项目：无 make check 目标，测试由 CMake LEXBOR_BUILD_TESTS=ON 构建，
# 通过 ctest 注册（源树 test/ 目录，见 test/CMakeLists.txt）。
upstream_check_command: "cmake -DLEXBOR_BUILD_TESTS=ON .. && make && ctest"

# conanfile.py build() 方法中是否已集成上游测试（配方内关闭，独立于本声明）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（ctest 注册 134 项，全部通过）
# 代表性程序如下，完整清单见 build/test/lexbor/**/CTestTestfile.cmake
upstream_tests:
  - file: test/lexbor/html/tokenizer/errors
    source: lexbor-3.0.0/test/lexbor/html/tokenizer/errors.c
    description: "HTML tokenizer 错误处理测试"
    command: "./errors"
  - file: test/lexbor/url/parser
    source: lexbor-3.0.0/test/lexbor/url/parser.c
    description: "URL 解析测试（45 项数据驱动）"
    command: "./parser <test/files/lexbor/url>"

# test_package 中自带的测试 (消费者视角验证，R34 实质调用被测库 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：lxb_html_document 解析 + lxb_dom_element_by_id 查询"
    command: "./test_lexbor"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8800