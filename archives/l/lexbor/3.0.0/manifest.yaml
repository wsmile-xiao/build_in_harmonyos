# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.0"

# 软件名
software: "lexbor"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lexbor/lexbor/archive/refs/tags/v3.0.0.tar.gz"

  # 源码校验和
  sha256: "eafaa79ef9871f0bbb1978eda8677d184f7ecdcaa203d7cd25b3f86e32c014c2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lexbor 纯 C 库、无外部依赖、CMake 构建，开箱即编译（无 make check，测试走 ctest）"
  - "上游 CMake 以相对路径链接测试库（libunit.so/liblexbor.so），本平台 musl 加载器按 CWD 解析相对 DT_NEEDED：测试需从各二进制目录运行并为相对路径补符号链接"
  - "make -j2 在 HMDFS 上 jobserver mkfifo 受限，需 -j1；patchelf 改写二进制在 HMDFS 上 Operation not permitted，用符号链接替代"
  - "lexbor DOM body 元素 API 为 lxb_html_document_body_element()（公开头文件），不是 lxb_dom_document_body()（未声明）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
