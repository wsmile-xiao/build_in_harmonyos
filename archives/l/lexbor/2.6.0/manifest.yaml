software: lexbor
# 版本级 manifest
# 文件位置: archives/l/lexbor/2.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.6.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# 发布日期
published_date: "2026-05-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（原始 GitHub 地址）
  url: "https://github.com/lexbor/lexbor/archive/refs/tags/v2.6.0.tar.gz"

  # 源码校验和（待补充）
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（lexbor 无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lexbor 纯 C 库，无外部依赖"
  - "CMake 构建，开箱即编译"
  - "支持动态库和静态库"
  - "无 make check 目标（库项目特性）"
  - "访问 GitHub 需处理 SSL 证书验证"

# ============================================================
# 测试验证
# ============================================================

# 功能测试验证
test_verified: true
test_date: "2026-05-30"

# 质量门禁结果
quality_gates:
  G1_binary_integrity: PASS
  G2_functional: PASS      # 无命令行工具属库项目正常现象
  G3_portability: PASS     # 仅依赖 libc.so
  G4_archive_integrity: PASS

# 上库建议
publish_recommendation: "可上库"