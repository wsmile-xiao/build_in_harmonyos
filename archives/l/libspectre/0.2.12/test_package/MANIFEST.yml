package: libspectre/0.2.12
homepage: "https://libspectre.freedesktop.org/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1（设备已执行，输出 Nothing to be done for 'check'；上游未注册 TESTS，用例数为 0）"
upstream_tests: []
upstream_test_programs:
  - file: test/spectre-test.c
    source: "https://libspectre.freedesktop.org/releases/libspectre-0.2.12.tar.gz"
    description: "Ghostscript 渲染示例程序，构建时依赖 Cairo"
    command: "./spectre-test <PostScript 文件> <输出目录>"
  - file: test/parser-test.c
    source: "https://libspectre.freedesktop.org/releases/libspectre-0.2.12.tar.gz"
    description: "PostScript 结构解析示例程序"
    command: "./parser-test <PostScript 文件> <输出目录>"
  - file: test/fuzz_main.c
    source: "https://libspectre.freedesktop.org/releases/libspectre-0.2.12.tar.gz"
    description: "解析器模糊测试入口"
    command: "./fuzz-test"

test_package_tests:
  - file: test_package/test_package.c
    description: "HarmonyOS PC 安装消费者验证 PostScript 载入、页数/尺寸元数据和 libgs 渲染。设备结果 HARMONYOS_TESTS=4/4"
    command: "./libspectre_consumer"

assertion_count: 4
