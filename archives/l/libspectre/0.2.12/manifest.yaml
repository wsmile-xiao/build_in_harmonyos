version: "0.2.12"
software: "libspectre"
status: device_pass
build_date: "2026-10-04"
build_system: autotools

source:
  url: "https://libspectre.freedesktop.org/releases/libspectre-0.2.12.tar.gz"
  sha256: "55a7517cd3572bd2565df0cf450944a04d5273b279ebb369a895391957f0f960"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-musl"
    - "--disable-test"
  dependencies:
    - "ghostscript/10.07.1.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-configure-umask.patch"
  - "patches/0002-out-of-tree-include.patch"

knowledge_gained:
  - "libspectre 通过 libgs API 渲染 PostScript，编译探测与最终消费者都必须传递 Ghostscript 头文件、库目录和 -lgs。"
  - "上游随附的旧 config.guess 在 HarmonyOS /bin/sh 下解析失败；显式传入经过 config.sub 验证的 build 三元组可跳过该脚本。"
