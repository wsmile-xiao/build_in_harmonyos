# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "luabind 0.9.1 的 object.hpp 使用 boost::operator== 限定调用比较 iterator_facade；Boost 1.90 将其改为 boost::iterators 命名空间模板，限定调用失效，须改为 ADL 非限定 x op y"
  - "luabind format_signature.hpp 在 namespace luabind 前向声明 object/argument/table，与 object.hpp 的 adl 命名空间 + using 声明冲突（C++11），须将前向声明放入 adl 命名空间"
  - "luabind detail/has_get_pointer.hpp 使用 boost::mpl::bool_ 但缺 <boost/mpl/bool.hpp> 头（Boost 1.90 不再传递包含），须显式包含"
  - "luabind 0.9.1 面向 Lua 5.1 API（lua_open/luaL_openlibs），需搭配 lua/5.1.5；Boost 头文件依赖需 BOOST_BIND_GLOBAL_PLACEHOLDERS"

