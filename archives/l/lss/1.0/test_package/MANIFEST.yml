# test_package/MANIFEST.yml
package: lss/1.0
homepage: "https://chromium.googlesource.com/linux-syscall-support"

upstream_check_command: "cd tests && make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/fallocate.c
    source: lss-1.0/tests/fallocate.c
    description: "Test fallocate syscall wrapper"
    command: "./fallocate"
  - file: tests/sigaction.c
    source: lss-1.0/tests/sigaction.c
    description: "Test sigaction syscall wrapper"
    command: "./sigaction"
  - file: tests/sigtimedwait.c
    source: lss-1.0/tests/sigtimedwait.c
    description: "Test sigtimedwait syscall wrapper"
    command: "./sigtimedwait"
  - file: tests/unlink.c
    source: lss-1.0/tests/unlink.c
    description: "Test unlink syscall wrapper"
    command: "./unlink"

test_package_tests:
  - file: test.c
    description: "Consumer test: includes linux_syscall_support.h, calls sys_getpid() and sys_close()"
    command: "./test_lss"

assertion_count: 2
