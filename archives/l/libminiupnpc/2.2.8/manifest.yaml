software: miniupnpc
version: "2.2.8"
status: built
build_date: "2026-09-23"
build_system: direct-cc
conan_ref: "miniupnpc/2.2.8"

source:
  url: "https://codeload.github.com/miniupnp/miniupnp/tar.gz/refs/tags/miniupnpc_2_2_8"
  sha256: "3d0d49f761f09c1321ceb663d1b008825361d7bd242640c60ae467e82642502a"
  tar_format: tar.gz

build:
  system: direct-cc
  configure_options:
    - "no CMake configure: 14 pure-C TUs compiled straight with profile clang (CMake ID probe red on OHOS, 2.3.11 precedent)"
    - "UPNPC static default (shared optional via options.shared)"
    - "upstream 7 harnesses built from CMakeLists.txt source lists and run for real"
    - "-fPIC on"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "2.2.8 tag 名为 miniupnpc_2_2_8（客户端线 tag，区别于 daemon 线 miniupnpd_2_3_11）——git ls-remote 确认，project VERSION 2.2.8 与包版本一致，无需 notes 里的版本错位说明"
  - "miniupnpc 同时支持 Makefile 与 CMake，2.2.8 与 2.3.x 的 MINIUPNPC_SOURCES/测试注册完全同构（7 项 CTest）"
  - "direct-cc 路线复用自 2.3.11：CMake project() 在 OHOS CI 上 'C compiler identification is unknown'（HarmonyOS 映射与 Linux 覆写两路线均红），改直调 profile clang 编译 14 个纯 C TU"
  - "testupnpreplyparse.c 的 FILE * f 未初始化 UB 在 2.2.8 同样存在（同 2.3.11），配方内零初始化修复仅动测试壳，7 用例数不变"
  - "消费者测试调用 upnpDiscover() 与 MINIUPNPC_VERSION，验证 socket 与解析链路"
