package: miniupnpc/2.2.8
homepage: "https://miniupnp.tuxfamily.org/"

upstream_check_command: "ctest -N"
upstream_tests_exist: true
upstream_test_audit: >
  miniupnpc 2.2.8 ships 7 ctest cases registered in miniupnpc/CMakeLists.txt
  (UPNPC_BUILD_TESTS block): validateminixml (minixmlvalid binary),
  validateminiwget (testminiwget.sh + minihttptestserver with TESTSERVER/
  TESTMINIWGET env), validateupnpreplyparse (testupnpreplyparse.sh iterating
  testreplyparse/*.xml), validateportlistingparse, validateigddescparse1/2
  (testdesc XML fixtures new_LiveBox_desc / linksys_WAG200G_desc),
  validateaddr_is_reserved. Verified against upstream tag miniupnpc_2_2_8
  (project VERSION 2.2.8, MINIUPNPC_API_VERSION 18 — same 7-case registry as
  the 2.3.x line). The recipe executes the same 7 harnesses via direct
  compiler invocation (no CMake configure probe, proven route from the
  repo's own 2.3.11 adaptation) and reports them under framework direct-cc.

upstream_test_in_build: true
upstream_test_command: "direct-cc: minixmlvalid + sh testminiwget.sh + sh testupnpreplyparse.sh + testportlistingparse + testigddescparse x2 + testaddr_is_reserved (same sources/cases as ctest)"

upstream_tests:
  - file: src/minixmlvalid.c
    source: miniupnpc/src/minixmlvalid.c
    description: "XML parser validation test"
    command: "./minixmlvalid"
  - file: testminiwget.sh
    source: miniupnpc/testminiwget.sh
    description: "HTTP wget functionality test (local minihttptestserver + cmp)"
    command: "sh ./testminiwget.sh"
  - file: testupnpreplyparse.sh
    source: miniupnpc/testupnpreplyparse.sh
    description: "UPnP reply parsing test"
    command: "sh ./testupnpreplyparse.sh"
  - file: src/testportlistingparse.c
    source: miniupnpc/src/testportlistingparse.c
    description: "Port listing parser test"
    command: "./testportlistingparse"
  - file: src/testigddescparse.c
    source: miniupnpc/src/testigddescparse.c
    description: "IGD description parser test (2 data sets)"
    command: "./testigddescparse"
  - file: src/testaddr_is_reserved.c
    source: miniupnpc/src/testaddr_is_reserved.c
    description: "Address reservation test"
    command: "./testaddr_is_reserved"

test_package_tests:
  - file: test_miniupnpc.c
    description: "Consumer API test: checks MINIUPNPC_VERSION non-empty and calls upnpDiscover()"
    command: "./test_miniupnpc"

upstream_test_case_count: 7
assertion_count: 2
