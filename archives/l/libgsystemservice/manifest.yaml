software: libgsystemservice
display: "libgsystemservice"
description: "Common components for building D-Bus system services (GssService / GssPeerManager / GssConfigFile)"
category: system
homepage: "https://gitlab.gnome.org/pwithnall/libgsystemservice"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 项目，零补丁：上游源码在 OHOS 上原样可编译，三处平台耦合全在配方侧"
    - "上游私有依赖 dependency('libsystemd') / dependency('polkit-gobject-1') 与 PkgConfigDeps 按包名生成的 systemd.pc / polkit.pc 对不上；配方把依赖包内自带的真实 .pc 复制进 generators_folder 并把 prefix= 从 / 改写成实际包目录（同 accountsservice/26.27.3 套路）"
    - "glib 在 OHOS 上与 proxy-libintl 同构建但 package_info 未声明 intl，消费者会 undefined reference 到 g_libintl_*；配方就地增补生成的 glib .pc 并加 c_link_args"
    - "MesonToolchain 生成的 conan_meson_native.ini 在 OHOS worker 上缺 [binaries] 的 ar/ranlib/pkg-config，配方按 conf 与已知 SDK 路径补注入"
    - "build() 内全量执行上游 meson test（3 个测试程序 / 13 个用例），并回读 meson-logs/testlog.txt 汇总块硬断言，不吃退出码"
    - "peer-manager 需要私有 session bus（AF_UNIX bind + dbus-daemon），OHOS 沙箱与已发布 dbus 包都不支持；该程序仍被构建并执行，失败按「数量 + 身份」硬核对后如实声明（不删、不 SKIP）"
    - "依赖 glib/2.84.0.1 + systemd/261 + polkit/127，tool_requires meson/1.11.0"

common_dependencies:
  - glib
  - systemd
  - polkit

versions:
  "0.3.0":
    status: built
    build_date: "2026-09-20"
