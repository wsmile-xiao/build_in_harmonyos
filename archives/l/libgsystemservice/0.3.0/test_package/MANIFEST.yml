# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# libgsystemservice 是 meson 项目，上游测试在 libgsystemservice/tests/meson.build
# 里注册为 3 个 test() 程序（test_programs 列表），已在配方 build() 中随
# `meson test` 全量执行，并回读 meson-logs/testlog.txt 汇总块硬断言
# （不吃退出码；SKIP 与「用例根本没注册」同样会让退出码为 0）。
# 上游默认分支 main 与本次钉版 tag 0.3.0 的 libgsystemservice/tests/ 内容一致
# （GitLab API 逐文件比对）：同为 3 个测试程序、13 个 g_test_add 用例，无版本差。

package: libgsystemservice/0.3.0
homepage: "https://gitlab.gnome.org/pwithnall/libgsystemservice"

# 上游测试命令（已在 build() 中集成执行）
upstream_check_command: "meson test -C <builddir>"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的全部测试程序（libgsystemservice/tests/meson.build 的
# test_programs 列表，3 个）
upstream_tests:
  - file: libgsystemservice/tests/config-file.c
    source: libgsystemservice-0.3.0.tar.gz/libgsystemservice/tests/config-file.c
    description: "GssConfigFile：多文件路径列表加载 / 按 key 回退 / resource 默认值 / 不可读 / 非法文件 / 不存在 / 组去重排序（9 个用例）"
    command: "meson test config-file"
  - file: libgsystemservice/tests/peer-manager.c
    source: libgsystemservice-0.3.0.tar.gz/libgsystemservice/tests/peer-manager.c
    description: "GssPeerManager：私有 session bus 上与自身连接的 peer 凭据查询（2 个用例；夹具用 g_test_dbus_up() 拉起私有 dbus-daemon，OHOS 沙箱不允许 AF_UNIX bind，见下方说明）"
    command: "meson test peer-manager"
  - file: libgsystemservice/tests/service.c
    source: libgsystemservice-0.3.0.tar.gz/libgsystemservice/tests/service.c
    description: "GssService：构造（service-id/translation-domain/parameter-string 属性）+ 错误码到进程退出码的映射（2 个用例）"
    command: "meson test service"

# 上游用例总数（g_test_add 注册数）
# 上游默认分支 main 与 tag 0.3.0 一致：13（config-file 9 + peer-manager 2 + service 2）
upstream_test_case_count: 13

# 平台上无法执行的用例（如实声明，不删除、不跳过、不计入通过）
upstream_unrunnable_on_platform:
  - program: peer-manager
    reason: >-
      config-file 之外的 peer-manager 夹具调用 g_test_dbus_up()，需要一个私有
      dbus-daemon 在 AF_UNIX socket 上监听。OHOS 沙箱拒绝 AF_UNIX bind
      （Operation not permitted，见 archives/d/dbus/1.14.10.2/manifest.yaml），
      且已发布的 dbus 包只含客户端库、不含 dbus-daemon 二进制。
      该程序仍然被构建并被执行（不是 SKIP），其失败在配方里被显式
      「允许但必须核对失败原因」——只有命中已知的「无 session bus」失败标记时
      才放行，否则抛异常。

# test_package 中自带的测试 (消费者视角验证，见 notes.md)
test_package_tests:
  - file: test.c
    description: >-
      libgsystemservice 真实 API 冒烟（不需要 bus）：GObject 类型注册
      （final class / derivable class / interface）+ 两个 error domain 与
      gss_service_error_to_exit_status 映射 + GssConfigFile 的路径列表优先于
      resource 默认值（含 strv / boolean / string / uint 取值、越界校验反向
      对照、非法文件解析错误反向对照、组去重排序）+ 继承 GssService 的
      derivable class 并做属性往返与未运行态检查
    command: "./test_libgsystemservice"

# 测试断言总数 (近似值, 用于质量评估；test.c 内 CHECK(...) 调用点数，
# 其中 check_error_domains() 里那条在 for 循环中每个错误码各执行一次)
assertion_count: 47
