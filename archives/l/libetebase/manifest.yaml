software: libetebase
display: "Etebase C Library"
description: "C client library for the Etebase end-to-end encrypted backend"
category: crypto
homepage: "https://github.com/etesync/libetebase"
license: BSD-3-Clause
build_system: custom

ohos_adaptation:
  key_points:
    - "Rust cdylib via cargo: needs rust-toolchain/1.97.1 tool_requires, no rustup bootstrap"
    - "Toolchain binaries must be self-signed before the OHOS loader executes them"
    - "System libsodium and OpenSSL come from the registry for the Rust -sys crates"
    - "3 of 12 upstream c_tests run offline; 9 need a live Etebase server (declared skipped)"
  common_dependencies:
    - libsodium
    - openssl

versions:
  "0.5.8":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libetebase/0.5.8"
    note: "First adaptation; recipe complete, pending HMBS device preflight evidence"
