version: "0.5.8"
software: "libetebase"
status: built
build_date: "2026-09-16"
build_system: "custom"

source:
  url: "https://github.com/etesync/libetebase/archive/refs/tags/v0.5.8.tar.gz"
  sha256: "4f2623a6e194aa3df69307d13ad00c42ec853a1af02ca329e35cd829ff472145"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "cargo build --release --target aarch64-unknown-linux-ohos"
    - "tool_requires rust-toolchain/1.97.1 (no rustup bootstrap)"
    - "crates via rsproxy.cn sparse mirror"
  dependencies:
    - openssl/3.5.6.1.1
    - rust-toolchain/1.97.1
  vendored:
    - libsodium-1.0.20 (official release tarball, static, no requires edge)
  cc: clang
  cxx: clang++

patches_applied: []

tests:
  upstream:
    build_command: "cargo check --target aarch64-unknown-linux-ohos"
    run_command: "upstream_tests (real c_tests/tests.c, all 12 vs local stub 127.0.0.1:8033, no ASan)"
    total: 12
    passed: 12
    skipped: 0
    target: "HarmonyOS aarch64 (pending HMBS preflight evidence)"
  consumer:
    command: "./test_libetebase"
    assertions: 33
    passed: 33
    target: "HarmonyOS aarch64 (pending HMBS preflight evidence)"

limitations:
  - "9 upstream c_tests need a live Etebase server; served locally by etebase_stub_server.py (127.0.0.1:8033, stdlib-only, seeded test_user/test_user2)"
  - "c_tests are built without -fsanitize=address: no ASan runtime for the OHOS target"

knowledge_gained:
  - "Rust cdylib (crate-type=cdylib) builds libetebase.so via cargo; cbindgen build-dependency writes target/etebase.h relative to the crate root regardless of --target"
  - "build.rs sets -soname libetebase.so.0, so the package must also ship libetebase.so.0 (DT_NEEDED resolution)"
  - "Upstream link name is etebase (etebase.pc: Libs: -letebase)"
  - "sodiumoxide-sys/openssl-sys find system libs via SODIUM_*/OPENSSL_* env + PKG_CONFIG_ALLOW_CROSS=1 while cross-compiling"
  - "rust-toolchain binaries need binary-sign-tool self-signing before OHOS executes them (EACCES otherwise)"
