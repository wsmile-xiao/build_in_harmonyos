package: libncurses/6.6_p20260516
homepage: "https://invisible-island.net/ncurses/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 SHELL=/bin/sh; verify test/programs targets 86/86; make -j1 SHELL=/bin/sh check"

upstream_tests:
  - file: "test/programs"
    source: "ncurses-6.6/test/programs"
    description: "86 upstream terminal test program entrypoints; every target must build during make check"
    command: "make -j1; verify all 86 test/programs targets exist"
  - file: "test/Makefile.in + */Makefile.in"
    source: "ncurses-6.6/test, include, ncurses, panel, menu, form, c++"
    description: "make check compiles 57 public/private headers independently, so every installed header is self-contained"
    command: "make -j1 check"
  - file: "ncurses/link_test.c"
    source: "generated by ncurses-6.6/ncurses/base/MKlib_gen.sh"
    description: "link_test references every implemented public entry point and must link against libncurses.a"
    command: "make -j1 check"

test_package_tests:
  - file: "src/test_curses_module.c"
    description: "Conan CMake config target: version, tputs callback, packaged terminfo, window update and 8-bit chtype cell round trip"
    command: "test_curses_module <output> <input>"
  - file: "src/test_ncurses_components.c"
    description: "Conan CMake config target plus panel, menu and form lifecycle APIs"
    command: "test_ncurses_components <output> <input>"
  - file: "src/test_ohos_platform.c"
    description: "HarmonyOS platform contract: runs on HarmonyOS, no shared curses/tinfo object mapped into the process, packaged terminfo database and narrow window update"
    command: "test_ohos_platform <output> <input>"
  - file: "src/test_curses_module.c"
    description: "Upstream CMake FindCurses module contract pinned to the Conan package"
    command: "test_find_curses_module <output> <input>"
  - file: "src/test_metadata.c"
    description: "Relocatable ncurses6-config consumer linked only to the packaged static archive"
    command: "ncurses6-config --cflags/--libs; compile, trace and run test_metadata_config"
  - file: "src/test_metadata.c"
    description: "Relocatable form pkg-config consumer referencing new_field and linked only to packaged static archives"
    command: "isolated pkg-config form --cflags/--static --libs; compile, trace and run"
  - file: "src/test_metadata.c"
    description: "Relocatable menu pkg-config consumer referencing new_item and linked only to packaged static archives"
    command: "isolated pkg-config menu --cflags/--static --libs; compile, trace and run"
  - file: "src/test_metadata_cpp.cpp"
    description: "Relocatable ncurses++ C++ pkg-config consumer emitting NCursesWindow constructor and destructor references"
    command: "isolated pkg-config ncurses++ --cflags/--static --libs; compile with clang++, trace and run"
  - file: "src/test_metadata.c"
    description: "Relocatable ncurses pkg-config consumer linked only to the packaged static archive"
    command: "isolated pkg-config ncurses --cflags/--static --libs; compile, trace and run"
  - file: "src/test_metadata.c"
    description: "Relocatable panel pkg-config consumer referencing new_panel and linked only to packaged static archives"
    command: "isolated pkg-config panel --cflags/--static --libs; compile, trace and run"
  - file: "conanfile.py"
    description: "HarmonyOS package contract: no shared objects are shipped, all five static archives are present, the consumer binary is AArch64 and needs no shared curses library"
    command: "readelf -h/-d on the config-script consumer plus a package tree scan"

assertion_count: 43
