software: libncurses
display: "libncurses"
description: "Narrow-character ncurses terminal libraries (8-bit charsets) plus the terminfo toolchain"
category: system
homepage: "https://invisible-island.net/ncurses/"
license: X11
build_system: autotools

ohos_adaptation:
  key_points:
    - "静态构建（--without-shared/--disable-shared）：共享 ncurses 库会劫持系统 libncurses.so.6/libtinfo.so.6，导致 zsh 等终端程序崩溃"
    - "显式 --disable-widec 构建窄字符 ABI：ncurses ABI 6 默认启用 widec，不写 --enable-widec 并不等于窄字符；产物为 libncurses.a 系列、ncurses6-config、ncurses/form/menu/panel/ncurses++.pc"
    - "必须使用 --enable-overwrite 让头文件安装到顶层 include/ 而非 include/ncurses/"
    - "上游 config.guess 不识别 HarmonyOS，需 0004 补丁返回 aarch64-unknown-linux-ohos"
    - "HMDFS 上 config.status/headers.sh 需要显式 shell 与可写 TMPDIR（0001/0003 补丁 + ac_cv_func_setfsuid=no）"
  common_dependencies: []

versions:
  "6.6_p20260516":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libncurses/6.6_p20260516"
