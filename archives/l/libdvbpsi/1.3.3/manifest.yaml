# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS setgid 目录继承导致 umask 077 的 mktemp -d 创建的临时目录权限不足（owner 与当前 UID 不一致），需改 umask 007 — ref: E011"
  - "2017 版 config.guess 使用 echo/exit 输出模式，不支持 GUESS= 变量语法（perl 补丁脚本生成的 GUESS= 方案需手动修正） — ref: E007"
  - "config.sub 需 4 处修改才能支持 linux-ohos 三元组：kernel-os 白名单、ohos-linux 映射、OS 白名单、linux-ohos 例外（防止被 linux→linux-gnu 转换吞没） — ref: E072"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

