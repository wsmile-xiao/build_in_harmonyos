software: libaudclient
display: libaudclient
description: Audacious 音乐播放器的 D-Bus 远程控制客户端库（audctrl API + audclient.pc），供第三方前端/插件驱动运行中的 Audacious
category: multimedia
license: BSD-2-Clause
homepage: https://www.audacious-media-player.org/
repository: https://github.com/audacious-media-player/libaudclient
build_system: autotools

ohos_adaptation:
  key_points:
    - "audacious 自研 buildsys.mk（非 automake）：发布 tarball 自带预生成 configure 与 dbus-client-bindings.h，无需 autoreconf"
    - "config.guess/config.sub 需 E007 OHOS 识别（HarmonyOS uname 与 linux-ohos 三元组）"
    - "静态依赖以 E236 la-free 目录 + DBUS_LIBS/GLIB_LIBS 预置变量链接；Makefile 的 LIBS 追加顺序需补丁交换（消费者先于依赖）"
    - "configure 硬性要求 dbus-binding-tool 存在（AC_PATH_PROG），从 dbus-glib 包 bin/ 预置绝对路径"
    - "上游无自动化测试套件（buildsys 无 check 目标），由 test_package 做链接期 ABI + dlopen + 全量导出符号验证"
  common_dependencies:
    - glib/2.88.0
    - dbus/1.14.10
    - dbus-glib/0.114

versions:
  "3.5-rc2":
    status: built
    build_date: "2026-09-02"
    patches: 3
    conan_ref: "libaudclient/3.5-rc2"
