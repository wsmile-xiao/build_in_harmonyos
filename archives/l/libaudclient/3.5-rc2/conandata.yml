# conandata.yml — libaudclient 3.5-rc2
# Source: official Audacious distfiles host (R39), sha256 verified locally 2026-09-02.

sources:
  url: "https://distfiles.audacious-media-player.org/libaudclient-3.5-rc2.tar.bz2"
  sha256: "57b59936adee309308bebe6d37709ea7e833e53529164cca0720a337c17f175a"

patches:
  - patch_file: "patches/0001-config-guess-ohos.patch"
    patch_description: "Recognize HarmonyOS in config.guess: emit aarch64-unknown-linux-ohos (E007 autotools OHOS patch set)"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "Accept linux-ohos kernel-OS combination in config.sub (E007 + manual one-liner)"
    patch_type: "portability"
  - patch_file: "patches/0003-makefile-link-order.patch"
    patch_description: "Swap LIBS append order to DBUS_LIBS before GLIB_LIBS: GNU ld resolves archives left-to-right, so dbus-glib (consumer) must precede static glib archives it pulls symbols from"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-umask-hmdfs.patch"
    patch_description: "configure tmp-dir creation umask 077 -> 022: HMDFS denies writes inside 077-created directories, config.status fails with 'can't create ./confXXXXXX/subs1.awk: Permission denied' (libcsv/3.0.3 patch 0002 and dbus-glib/0.114 patch precedent)"
    patch_type: "portability"
