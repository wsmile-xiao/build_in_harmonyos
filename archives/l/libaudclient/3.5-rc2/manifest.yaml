# manifest.yaml — libaudclient 3.5-rc2（版本级）
# 遵循 ARCHIVE-SPEC v3.0

version: "3.5-rc2"

# 编译状态：published | built | failed | archived
status: built

build_date: "2026-09-02"

conan_ref: "libaudclient/3.5-rc2"

source:
  url: "https://distfiles.audacious-media-player.org/libaudclient-3.5-rc2.tar.bz2"
  sha256: "57b59936adee309308bebe6d37709ea7e833e53529164cca0720a337c17f175a"
  tar_format: tar.bz2

build:
  system: autotools
  # audacious 自研 buildsys.mk（非 automake）：发布 tarball 自带预生成
  # configure 与 dbus-client-bindings.h，无需 autoreconf；无额外选项
  configure_options: []
  dependencies:
    - dbus-glib/0.114
    - dbus/1.14.10
    - glib/2.88.0
    - expat/2.8.2
    - pcre2/10.45
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-ohos.patch"
  - "0002-config-sub-ohos.patch"
  - "0003-makefile-link-order.patch"
  - "0004-configure-umask-hmdfs.patch"

upstream_tests:
  exist: false
  test_count: 0
  audit: "Audited buildsys.mk.in (audacious custom buildsys, no check target at all), all four Makefiles (no TESTS/check_PROGRAMS/check-local), configure.ac (no test macros) and the tree (no tests/ directory). See test_package/MANIFEST.yml; audit grep runs in recipe build()."

knowledge_gained:
  - "audacious buildsys.mk 的链接规则把 ${LIBS} 置于目标对象之后由 GNU ld 单遍左到右解析：上游 src/libaudclient/Makefile 以 GLIB_LIBS 先、DBUS_LIBS 后追加，静态 glib 归档在 libdbus-glib-1.a 之前无法闭合其 g_* 引用；补丁 0003 交换为 DBUS_LIBS 先、GLIB_LIBS 后（消费者先于依赖）"
  - "pkg.m4 预置变量判定是 test -n \"$VAR\"：空串不算预置，会掉进 pkg-config 查询并中止 configure；本包 configure 有独立的 glib-2.0 >= 2.28 模块检查（经 acinclude.m4 引入），GLIB_CFLAGS/GLIB_LIBS/DBUS_CFLAGS/DBUS_LIBS 四者都必须非空"
  - "发布 tarball 自带预生成 configure 与 src/audacious/dbus-client-bindings.h，无需 autotools 工具链；all→depend→pre-depend 每轮 make 都会进入 src/audacious，但其重建规则的 DBUS_BINDINGS_SOURCES 从未被 AC_SUBST（前置为空），头文件存在即永不重建；DBUS_BINDING_TOOL 预置只为通过 configure 的 AC_PATH_PROG 存在性门禁"
  - "上游 audctrl.h 声明的 audacious_set_session_uri / audacious_get_session_uri / audacious_set_session_type 在 3.5-rc2 的 audctrl.c 中没有实现（仅声明）；导出面测试清单必须按实现侧 71 个 EXPORT 符号为准"
  - "glib/dbus/dbus-glib OHOS 制品均 static-only：libaudclient.so 以 E236 la-free 目录内联整条静态链（DT_NEEDED 仅 libexpat.so）；消费者再直接调用 glib API 会形成双 GType 运行时（dbus-glib 0.114 E257 同类风险）"
  - "autoconf 2.69 生成的 configure 在 CONFIG_SHELL 已设置时于启动段无条件 exec $CONFIG_SHELL 重执行自身（139-154 行）；CI profile 把 CONFIG_SHELL 指向 hnp bash 5.3，其启动 getcwd 在 HMDFS 上对继承的过期 PWD 报错风暴，configure 随即 'working directory cannot be determined' 中止。配方内 unset CONFIG_SHELL 后调用 configure 即可绕过，toybox /bin/sh 不受影响（dbus-glib 0.114 为 autoconf 2.71 生成，无该重执行块，未触发）"
  - "绕过 CONFIG_SHELL 时必须 unset 而不是置空：configure 前导 SHELL=${CONFIG_SHELL-/bin/sh} 对'空但已设置'不回退，空 SHELL 被 AC_SUBST 进 buildsys.mk 后 GNU make 直接 exec '-c' 报 'make: -c: No such file or directory'；且 audacious buildsys.mk 无 VPATH 支持，Conan 必须 in-source 构建（folders.source == folders.build），否则 make 在 build 目录找不到 Makefile"
  - "Conan 2 transform_downstream（conan 2.29.1 requires.py:289）：package_type=shared-library 的包对其 STATIC 依赖向下游强制 headers=False, libs=False，节点被标记 Skipped binaries，PkgConfigDeps 据此把该依赖从生成的 .pc Requires: 链静默丢弃，消费者编译报 'glib.h' file not found（从 conan 源码 requires.py/dependencies.py/pkgconfigdeps.py 定位）。修复：self.requires('glib/2.88.0', transitive_headers=True) 使 headers 传播存活而 libs 保持 False（静态链已内嵌 .so，符合嵌入语义）；另外 cpp_info.requires 只能引用 recipe 的直接依赖，传递组件引用会被 'not a direct requirement of the recipe' 拒绝"
