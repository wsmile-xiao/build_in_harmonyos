# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: libaudclient/3.5-rc2
homepage: "https://www.audacious-media-player.org/"

# 上游源码审计（hmbs 硬门禁）：3.5-rc2 官方发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "buildsys.mk.in"
    reason: "audacious 自研 buildsys（非 automake）整体未定义 check 目标；build()/install()/clean() 之外无任何测试挂钩。"
  - source: "Makefile / src/*/Makefile"
    reason: "顶层与 src/、src/audacious/、src/libaudclient/ 四个 Makefile 均无 TESTS/check_PROGRAMS/check-local 声明。"
  - source: "configure.ac"
    reason: "仅 AC_PROG_CC/AC_CHECK_HEADERS/PKG_CHECK_MODULES/AC_PATH_PROG(dbus-binding-tool)；无 AC_CONFIG_TESTDIR 或测试宏。"
  - source: "源码树"
    reason: "发布包无 tests/、test/ 目录；src/libaudclient/ 仅 audctrl.c/audctrl.h；src/audacious/ 仅有 objects.xml 与预生成的 dbus-client-bindings.h。"
  - conclusion: "上游未提供自动化测试套件；由 test_package 执行消费者视角的链接期 ABI + dlopen + 全量导出符号运行时验证。审计 grep 已在配方 build() 内对真实源码树执行（conan create 日志可见）。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# Consumer-side tests executed by conan create (L1)
test_package_tests:
  - file: test_audclient.c
    description: "链接 libaudclient：9 个跨版本代际 API 函数地址经真实 audctrl.h 头文件解析（链接期 ABI）；dlopen 上游 soname libaudclient.so.2（GNU 分支 -Wl,-soname=${SHARED_LIB}.${LIB_MAJOR}）；dlsym 全部 71 个 EXPORT 导出符号（-fvisibility=hidden + EXPORT 可见性）；dladdr 断言符号确属 libaudclient"
    command: "./test_audclient"
  - file: conanfile.py
    description: "pkg-config 消费路径：PkgConfigDeps 生成 audclient.pc 及依赖链 .pc，pkg-config --cflags --libs audclient 携带完整传递 Cflags（glib E216 类 CMakeDeps 缺口规避，dbus-glib/0.114 先例）"
    command: "cc $(pkg-config --cflags --libs audclient) test_audclient.c"

# 执行时断言计数：1×dlopen + 71×dlsym + 9×链接期地址 + 1×dladdr = 82
assertion_count: 82

# 已知限制（如实记录）：
# - OHOS 无 D-Bus session bus（dbus 包不含 dbus-daemon，设备亦无），且无运行中的
#   Audacious 播放器；audctrl 每个 API 入口都立即发送 D-Bus 消息，无法离线调用。
#   因此本包可执行验证的最大范围为加载 + 全量导出面；方法调用路径（dbus_g_proxy_call）
#   属平台环境限制，无法在设备上执行，非跳过。
# - 上游 audctrl.h 声明了 audacious_set_session_uri / audacious_get_session_uri /
#   audacious_set_session_type，但 3.5-rc2 的 audctrl.c 未实现（仅声明），
#   消费者若引用会在链接期失败——上游不一致，本测试清单按实现侧 71 符号为准。
