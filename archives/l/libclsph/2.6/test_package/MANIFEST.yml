# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libclsph/2.6
homepage: "https://github.com/libclsph/libclsph"

# 上游无任何测试注册（源码为纯 CMake 工程，无 enable_testing/add_test、
# 无 tests/ 目录、无 GTest/Catch 用例）。枚举证据见 reports/upstream-test-ledger.md
upstream_check_command: "true"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无独立用例；示例已另行编译运行，见台账）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: consumer_clsph.cpp
    source: test_package/consumer_clsph.cpp
    description: "消费者验证：仅用安装后公开头文件/API 编译链接运行（scene::load、
                  load_settings 可观察结果，initial_volume=1.60274 校验）"
    command: "./consumer_clsph"
  - file: ohos_sph_test.cpp
    source: test_package/ohos_sph_test.cpp
    description: "HarmonyOS 专项测试：OHOS OpenCL 栈端到端（ICD 平台枚举、打包
                  SPH 内核编译、有界内核执行结果校验），oclgrind 软件后端"
    command: "./ohos_sph_test"
