# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  configure_options:
    - "-DBUILD_EXAMPLES=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DUSE_LOCAL_CL_HPP=1"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ocl-icd/2.3.5

  # 测试专用依赖（软件 OpenCL 后端，运行时测试平台提供方）
  test_dependencies:
    - oclgrind/26.03.1

  # 编译器
  cc: clang
  cxx: clang++

