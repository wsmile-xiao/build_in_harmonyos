# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方，无 tag/release，取 master 快照 4cdf18fb）
  url: "https://github.com/libclsph/libclsph/archive/refs/heads/master.tar.gz"

  # 源码校验和
  sha256: "1fab7ef6fcb61d7fc18d35c6200893a1e895ef9303fbec17639ae43a5c54cddb"

