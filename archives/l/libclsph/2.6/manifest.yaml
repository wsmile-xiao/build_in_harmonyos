  - "patches/0002-cl-hpp-enqueue-fill-buffer.patch"
  - "patches/0003-collisions-kernel-float-literal.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游无 tag/release 的休眠仓库：以官方 master 快照固定 sha256 作为唯一可审计引用"
  - "OHOS PC 无 GPU OpenCL：ocl-icd（ICD loader）+ Khronos 官方 CL 头 + 软件后端（oclgrind）构成可验证的 OpenCL 计算栈"
  - "上游内嵌 2015 版 cl.hpp 缺 enqueueFillBuffer（OpenCL 1.2），且调用形态为 'pattern 按值+省略 offset'，需模板重载适配"
  - "上游内核 double 字面量 x float3（collisions.cl 0.001）在严格 OpenCL 实现报秩错误，改 0.001f"
  - "上游 CMake 最低版本 2.6 与 CMake>=4 不兼容，需 3.5 起"

