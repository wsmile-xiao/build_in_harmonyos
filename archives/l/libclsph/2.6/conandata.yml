# conandata.yml — libclsph 2.6
# 官方来源: https://github.com/libclsph/libclsph (master 快照, 无 tag/release)
# 上游引用: git 4cdf18fba05a64826484b0db238b604c90a2e894 (pushed 2016-03-19)

sources:
  url:
    - "https://gh-proxy.com/https://github.com/libclsph/libclsph/archive/refs/heads/master.tar.gz"
    - "https://github.com/libclsph/libclsph/archive/refs/heads/master.tar.gz"
  sha256: "1fab7ef6fcb61d7fc18d35c6200893a1e895ef9303fbec17639ae43a5c54cddb"

# Khronos OpenCL C 头文件（官方托管）— OHOS 无系统 CL 头，由配方提供
# 供 libclsph 的 util/cl.hpp（内嵌 C++ 绑定）编译所需: CL/cl.h, cl_platform.h,
# cl_ext.h, cl_d3d10.h, opencl.h 等
cl_headers:
  url:
    - "https://gh-proxy.com/https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/tags/v2023.12.14.tar.gz"
    - "https://github.com/KhronosGroup/OpenCL-Headers/archive/refs/tags/v2023.12.14.tar.gz"
  sha256: "407d5e109a70ec1b6cd3380ce357c21e3d3651a91caae6d0d8e1719c69a1791d"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    description: "cmake_minimum_required 2.6 -> 3.5 (CMake >= 4 已移除 <3.5 兼容)"
  - patch_file: "patches/0003-util-cl.hpp.patch"
    description: "内嵌 OpenCL C++ 绑定 cl.hpp 补 enqueueFillBuffer (OpenCL 1.2 API) 及
                  'pattern 按值' 模板重载，匹配上游 sph_simulation.cpp 调用形态"
  - patch_file: "patches/0002-libclsph-kernels-collisions.cl.patch"
    description: "collisions.cl 0.001 -> 0.001f (严格 OpenCL 实现下 double 字面量 x float3 秩错误)"
