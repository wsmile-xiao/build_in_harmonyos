# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libdisorder/0.0.2-git20130809.8062ee1
homepage: "https://github.com/locasto/libdisorder"

upstream_tests_exist: true
upstream_test_audit: |
  已审计官方提交 8062ee1514f939c9013da234f1c37ef06fa66a80 的全部文件。
  唯一上游测试源是 code/test/test.c；code/src/Makefile 的 test 目标
  只负责编译并执行该程序。程序不间断读取 /dev/urandom，每轮
  计算 16384 字节熵值且无终止条件。配方未修改测试源，真实运行后
  校验 3 个连续轮次的全部字段及数值范围，再有界终止该持续程序。
  按可执行测试程序数统计，上游实测数为 1，必须 1/1 通过。

upstream_check_command: "make -C code/src test"
upstream_test_in_build: true
upstream_test_command: "code/test/test.c (validate 3 iterations, then terminate)"
upstream_test_count: 1

upstream_tests:
  - file: code/test/test.c
    source: "libdisorder-8062ee1514f939c9013da234f1c37ef06fa66a80/code/test/test.c"
    description: "官方持续 /dev/urandom 熵测试；连续校验 3 轮完整输出后终止"
    command: "./libdisorder_upstream_test"

test_package_tests:
  - file: test_api.c
    description: "库消费者 API 与 5 组确定性熵分布验证（19 项检查）"
    command: "./test_api"
  - file: ropy (packaged executable)
    description: "用 aabb 固定文件校验命令行输出的 5 个统计字段（6 项检查）"
    command: "ropy <fixture>"
  - file: test_ohos.c
    description: "HarmonyOS 专有：__OHOS__/AArch64 ABI 及 /dev/urandom 熵计算（8 项检查）"
    command: "./test_ohos"

assertion_count: 33

