# 软件级 manifest
# 文件位置: archives/l/libtorrent-rasterbar/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: libtorrent-rasterbar

# 显示名
display: "libtorrent-rasterbar"

# 一句话描述
description: "高效的 BitTorrent 协议实现库，支持 DHT、uTP、PEX 等特性"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://libtorrent.org/"

# 开源许可证（SPDX 标识）
license: BSD-3-Clause

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "E085: musl pthread API缺失，需创建兼容层（pthread_setcancelstate等函数）"
    - "E091: OHOS sockaddr_storage重定义冲突，需使用__linux_sockaddr_storage替代"
    - "依赖 boost 和 openssl，需先安装预编译包"

  # 跨版本通用依赖
  common_dependencies:
    - boost
    - openssl

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.0.9":
    status: built
    build_date: 2026-05-26