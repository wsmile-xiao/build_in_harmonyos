# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liblqr/0.4.2
homepage: "http://liblqr.wikidot.com"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: liblqr-1-0.4.2.tar.bz2, sha256 173a822efd207d72cda7d7f4e951c5000f31b10209366ff7f0f5972f7f9ff137)
upstream_test_audit:
  source_tarball: "liblqr-1-0.4.2.tar.bz2"
  source_sha256: "173a822efd207d72cda7d7f4e951c5000f31b10209366ff7f0f5972f7f9ff137"
  source_url: "http://liblqr.wdfiles.com/local--files/en:download-page/liblqr-1-0.4.2.tar.bz2"
  file_count: 93
  top_level_files:
    - Makefile.am         # SUBDIRS = lqr man; 无 TESTS / check_PROGRAMS / check-local
    - configure.ac        # 仅 PKG_CHECK_MODULES(glib-2.0) + Win32 判断; 无测试宏
    - lqr/Makefile.am     # 仅 liblqr-1.la 库目标 + 头文件安装; 无 TESTS/check_PROGRAMS
    - lqr/lqr.h           # 聚合头文件 (glib.h + 各 _pub.h)
    - examples/Makefile   # 需外部分发 pngwriter 的手写演示 Makefile, 非测试
    - man/Makefile.am     # man 页安装
    - docs/               # docbook 手册源码, 非测试
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest 目标"
    - "find 全树 -iname '*test*' (大小写不敏感)"
  scan_result: "0 matches — 全树无 tests/ 目录; -iname '*test*' 零命中; Makefile.am 无 TESTS/check_PROGRAMS; configure.ac 无测试宏"
  make_check_output: "make -n check 展开为空 (automake 默认空目标) — make check 执行 0 用例退出 0"
  reason: "liblqr 0.4.2 为 seam-carving 算法库, 官方源码包不含任何测试套件: 无 tests/ 目录、无测试源文件、无 TESTS/check_PROGRAMS 目标、configure.ac 无测试宏; examples/ 为依赖外部 pngwriter 的演示程序而非测试。功能验证由 test_package 真实调用 lqr API (new/dims/init/resize) 完成"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包 API
test_package_tests:
  - file: test.c
    description: "消费者测试: 8x8 RGB 内存图像上真实调用 lqr_carver_new/dims/init/resize/destroy 共 4 个 CHECK-OK 断言"
    command: "test_liblqr"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 ctest 并输出 HMBS 机器证据标记 (test_package discovered=4/passedCount=4 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test.c 的 4 个 CHECK-OK, 与 HMBS_TEST_PACKAGE_RESULT discovered=4 一致)
assertion_count: 4
