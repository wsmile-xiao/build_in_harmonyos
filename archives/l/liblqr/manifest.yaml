software: liblqr
display: "Liquid Rescale seam-carving library"
description: "Easy to use C/C++ seam carving library for non-uniform image resizing"
category: library
homepage: "http://liblqr.wikidot.com"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建, 单一 glib-2.0 运行时依赖"
    - "默认静态库, 头文件位于 include/lqr-1, pkg-config 名 lqr-1"
    - "glib 经 pkg-config 消费，与上游 lqr-1.pc（Requires: glib-2.0）一致"
    - "上游 0.4.2 无测试套件, 由 test_package 真实 API 调用验证"
    - "上游 0.4.3 同样无测试套件，make check 为 automake 空目标，配方真实执行证明"
    - "上游 v0.4.3 无 release 资产，源码用 archive/refs/tags/v0.4.3.tar.gz"
    - "configure 内嵌 umask 077 与 HMDFS setgid 目录冲突（E114），0003 补丁移除"
  common_dependencies:
    - glib

versions:
  "0.4.2":
    status: built
    build_date: "2026-09-16"
    source_url: "http://liblqr.wdfiles.com/local--files/en:download-page/liblqr-1-0.4.2.tar.bz2"
  "0.4.3":
    status: built
    build_date: "2026-09-17"
    source_url: "https://github.com/carlobaldassi/liblqr/archive/refs/tags/v0.4.3.tar.gz"
