# liblqr/0.4.3 test_package 上游测试声明
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: liblqr/0.4.3
homepage: "https://liblqr.wikidot.com/"

# 上游测试审计（结论：无测试套件，make check 为 automake 默认空目标）：
# 1) 顶层 Makefile.am：SUBDIRS = lqr man，无 TESTS、无 tests/ 目录、无 check 用例。
# 2) lqr/Makefile.am：仅 liblqr_1_la_SOURCES 库源码与头文件安装声明，无测试目标。
# 3) man/Makefile.am：仅 man 页（88 个，--enable-install-man 条件安装），无测试。
# 4) configure.ac：无 AC_CONFIG_TESTDIR、无对任何测试宏的引用。
# 5) 全树无 TEST(/TEST_F（gtest）、def test_（pytest）、ctest、TAP 输出。
# 依据 aalib 1.4p5 先例（同为"定义 check 目标但无测试用例"），配方仍真实执行
# make check 以证明其为空操作通过，而非假设。
upstream_tests_exist: false
upstream_test_audit: "审计 liblqr 0.4.3 上游（GitHub tag 归档 v0.4.3.tar.gz，sha256 64b0c4ac76d39cca79501b3f53544af3fc5f72b536ac0f28d2928319bfab6def）：1) 顶层 Makefile.am SUBDIRS=lqr man，无 TESTS/check 用例；2) lqr/man 子目录仅库源码与 man 页安装，无测试目标；3) configure.ac 无测试宏；4) 无 gtest/pytest/ctest/TAP。上游无测试套件，make check 为 automake 默认空目标，配方真实执行以证明。"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: "Makefile.am"
    source: "liblqr-0.4.3/Makefile.am"
    description: "Upstream automake default check target; the source archive defines no standalone test cases."
    command: "make check"

test_package_tests:
  - file: test_lqr_package.c
    description: "消费者冒烟测试：lqr_carver_new/init/get_channels/resize/get_width/get_height/scan 像素不变量/destroy，8x4→6x4 确定性 seam carving（8 个 CHECK，R34 反空壳：全部经真实 liblqr API，失败即非零退出）"
    command: "./test_lqr_package"

assertion_count: 8
