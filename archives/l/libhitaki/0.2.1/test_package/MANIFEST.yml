# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libhitaki/0.2.1
homepage: "https://github.com/alsa-project/libhitaki"

# 上游测试命令：meson test（16 项注册于 tests/meson.build）
upstream_check_command: "meson test -C build"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（Python GI 脚本；详情台账见 notes.md：
# 17 个独立上游用例，OHOS 侧需 GI/PyGObject 运行环境 + 真实 firewire
# 设备，当前平台不可运行——平台环境限制，非配方缺陷）
upstream_tests:
  - file: hitaki-enum
    source: libhitaki-0.2.1/tests/hitaki-enum
    description: "Hitaki 枚举类型完整性检查（GI typelib）"
    command: "python3 tests/hitaki-enum"
  - file: snd-unit
    source: libhitaki-0.2.1/tests/snd-unit
    description: "HitakiSndUnit 对象接口检查（GI typelib）"
    command: "python3 tests/snd-unit"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：实例化 HitakiSndUnit 并读取公开属性"
    command: "./test_libhitaki"
  - file: test_ohos.c
    description: "HarmonyOS 专项测试：无 GIR typelib 环境下公开符号导出与 GObject 类型系统回归"
    command: "./test_libhitaki_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6