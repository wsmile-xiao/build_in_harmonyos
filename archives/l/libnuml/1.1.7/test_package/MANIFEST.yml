# test_package/MANIFEST.yml for libnuml 1.1.7
# Upstream audit (v1.1.7 tag): no test suite exists, so there is nothing to
# wire into build(). Counts below are real declarations, not estimates.

package: libnuml/1.1.7
homepage: "https://github.com/NuML/NuML"

# Upstream test suite existence (audited v1.1.7 tag: no automated suite).
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: ctest_entries

# Structured no_tests audit: tarball identity + scanned locations +
# scan result + measured check output + reason. ctest_entries is the
# counting method (upstream calls bare enable_testing() with zero add_test
# registrations); the Total Tests: 0 line from `ctest -N` in build-numl
# is the single deterministic source, already proven on the preflight
# worker and re-emitted every round via res/hmbs_upstream.json.
upstream_test_audit:
  source_tarball: "v1.1.7.tar.gz (https://github.com/NuML/NuML/archive/refs/tags/v1.1.7.tar.gz)"
  source_sha256: "820d854355d80a3fe6dbe6c5428c45d42542541213cf0c3b3aee705f8ba1399f"
  scanned_for:
    - "tests/ / test/ directory"
    - "add_test() / enable_testing (ctest)"
    - "WITH_CHECK test target wiring"
    - "check_PROGRAMS / TESTS (automake make check)"
  scan_result: "libnuml/ holds only CMakeLists.txt, src/, examples/, docs/, CMakeModules/, submodules/; no tests/ or test/ directory; no add_test() anywhere (only bare enable_testing()); WITH_CHECK defaults OFF with no test target wired; examples/ are c++/java/python samples built only with WITH_EXAMPLES=ON, not a test suite; preflight ctest -N in build-numl reports Total Tests: 0"
  reason: "upstream libnuml 1.1.7 ships no test suite (no tests/ dir, no add_test; ctest -N Total Tests: 0); nothing to integrate into build(), evidence marker status no_tests with 0 counts"

# No upstream check command applies (no suite); build() still proves the
# zero count with `ctest -N` and persists it for test_package re-emission.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_numl.cpp
    description: "consumer roundtrip: create L1V1 doc, ontology terms, result component, write/read back, verify counts (7 checks)"
    command: "./test_numl"

assertion_count: 7
