# version manifest for libnuml 1.1.7
# follows templates/manifest-version.yaml (ARCHIVE-SPEC v2.0)

version: "1.1.7"
software: "libnuml"

status: built
build_date: "2026-09-20"
build_system: "cmake"

source:
  url: "https://github.com/NuML/NuML/archive/refs/tags/v1.1.7.tar.gz"
  sha256: "820d854355d80a3fe6dbe6c5428c45d42542541213cf0c3b3aee705f8ba1399f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DWITH_SWIG=OFF"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_CHECK=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang
  cxx: clang++

# Vendored (single-PR, R36): libSBML/expat are not published in the registry,
# so the recipe builds their official release sources statically into a
# private prefix (same pattern as the merged libcombine/0.2.20 and
# libsedml/2.0.33 recipes). Not registry dependencies; shipped as sources.
vendored:
  - "libsbml/5.21.0 (private static helper, headers + libsbml-static.a shipped)"
  - "expat/2.7.1 (private static helper for libSBML XML parser, libexpat.a shipped)"

patches_applied: []

knowledge_gained:
  - "libNUML hard-requires libSBML XML layer; single-PR vendoring follows libcombine/libsedml precedent"
  - "upstream cmake_minimum_required floor needs CMAKE_POLICY_VERSION_MINIMUM=3.5 on modern CMake"
