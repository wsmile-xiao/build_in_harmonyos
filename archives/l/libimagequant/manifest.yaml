software: libimagequant
display: "libimagequant"
description: "Palette quantization library for high-quality PNG optimization (pngquant core; 4.x Rust core with C API)"
category: gfx
homepage: "https://pngquant.org/lib/"
license: "GPL-3.0-or-later"
build_system: cargo

ohos_adaptation:
  key_points:
    - "4.x 上游为纯 Rust 实现（imagequant lib + imagequant-sys C FFI staticlib），C API libimagequant.h 不变"
    - "工具链 tool_requires: rust-toolchain/1.97.1（制品仓）+ openssl/3.5.6.1.1（cargo 运行时 libssl relink 源）"
    - "OHOS HMDFS 执行限制：cargo/rustc/librustc_driver/libc++_shared 需 binary-sign-tool 签名私有拷贝"
    - "交叉目标 aarch64-unknown-linux-ohos，链接器用 profile 的 clang"
    - "Cargo registry 走 rsproxy.cn sparse 镜像"
  common_dependencies:
    - "rust-toolchain/1.97.1"
    - "openssl/3.5.6.1.1"

versions:
  "2.18.0":
    status: published
    build_date: "2026-05-22"
  "4.4.1":
    status: built
    build_date: "2026-09-10"
