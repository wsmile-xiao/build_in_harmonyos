software: libimagequant
version: "4.4.1"
status: built
build_date: "2026-09-10"
build_system: cargo

source:
  url: "https://github.com/ImageOptim/libimagequant/archive/refs/tags/4.4.1.tar.gz"
  sha256: "2464a3e922b5a220b633d674062b82f0670114f8f3dd30d1935a621c95965f1b"
  tar_format: tar.gz

build:
  system: cargo
  configure_options:
    - "cargo build --release -p imagequant-sys"
    - "OHOS target: aarch64-unknown-linux-ohos"
    - "tool_requires: rust-toolchain/1.97.1 + openssl/3.5.6.1.1（cargo 运行时）"
  dependencies:
    - "rust-toolchain/1.97.1"
    - "openssl/3.5.6.1.1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libimagequant 4.x 上游已迁移为纯 Rust 实现（workspace: imagequant lib + imagequant-sys C FFI staticlib），tarball 无 CMakeLists.txt（任务情报中 CMake+LIQ_NATIVE 为 2.x 纯 C 时代信息）；C API libimagequant.h 保持不变，pngquant/GIMP 消费形态不受影响。"
  - "交叉编译命令：cargo build --release -p imagequant-sys --target aarch64-unknown-linux-ohos，产物 target/<triple>/release/libimagequant_sys.a（23.6MB，LTO 未裁剪属正常）。"
  - "rust-toolchain/1.97.1 的 cargo/rustc/librustc_driver.so 在 OHOS HMDFS 上需 binary-sign-tool 签名私有拷贝才可执行（cbindgen 0.28.0 先例）；cargo 运行时依赖 libssl/libcrypto（OPENSSL_3.0.0 符号），系统 libssl 过旧，须从 openssl conan 包静态归档 relink 私有 .so。"
  - "上游 4.4.1 tarball 不含 Cargo.lock（tag 归档未提交），cargo build/test 不能加 --locked。"
  - "上游测试 cargo test --release --workspace --tests 实测 21 项全过（lib 16 + ffi 4 + c_test 1；c_test 内部串跑 test.c 的 5 个 C 断言函数）；c_test 的 build.rs 用 cc crate 编 C 代码，需暴露 clang 为 cc/gcc。"
  - "Cargo registry 用 rsproxy.cn sparse 镜像（crates.io 直连超时），CA 证书 certifi.where()。"
