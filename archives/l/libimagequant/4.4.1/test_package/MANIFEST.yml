# test_package/MANIFEST.yml — libimagequant 4.4.1
package: libimagequant/4.4.1
homepage: "https://github.com/ImageOptim/libimagequant"

# 上游测试为 Rust cargo test（workspace：imagequant lib 单元 + imagequant-sys
# ffi 单元 + c_test C 集成），在 test_package 阶段真实执行并采集 HMBS 标记。
upstream_check_command: "cargo test --workspace"
upstream_test_in_build: false
upstream_test_command: "cargo test --release --workspace --tests --no-fail-fast"

# 上游测试程序（cargo test 实测，rust-toolchain/1.97.1 aarch64-OHOS 全过：
#   imagequant lib 单元 16 项（attr::counters/attr::getset/copy_img/histogram/
#     pal::diff_test/pal::pal_test/poke_it/r_callback_test/remap::background_to_nop/
#     remap::send/rows::send/set_importance_map/sizes/takes_rgba/test_fixed_colors/thread）
# + imagequant-sys ffi 单元 4 项（c_callback_test_c/link_every_symbol/
#     links_and_runs/ownership_bitflags）
# + c_test 集成 1 项（test.c 的 run_liq_tests 串跑 5 个 C 断言函数：
#     test_fixed_colors/test_fixed_colors_order/test_abort/test_histogram/
#     test_zero_histogram）
# = 21 项，0 失败）
upstream_tests:
  - file: src
    source: libimagequant-4.4.1/src
    description: "imagequant Rust 核心单元测试（实测 16 通过）"
    command: "cargo test --release --workspace --tests"
  - file: imagequant-sys/src
    source: libimagequant-4.4.1/imagequant-sys/src
    description: "imagequant-sys C FFI 单元测试（实测 4 通过）"
    command: "cargo test --release --workspace --tests"
  - file: imagequant-sys/c_test
    source: libimagequant-4.4.1/imagequant-sys/c_test
    description: "c_test C 集成测试（1 项 #[test] 内串跑 test.c 的 5 个断言函数）"
    command: "cargo test --release --workspace --tests"

# test_package 自带的消费者测试（R34 实质调用被测库 API：pngquant 同款
# roundtrip——liq_attr_create/liq_image_create_rgba/liq_quantize_image/
# liq_write_remapped_image 全链路 + 调色板与索引范围断言）
test_package_tests:
  - file: test_consumer.c
    description: "消费者 roundtrip：量化核心 API 全链路断言（7 组断言）"
    command: "clang test_consumer.c -limagequant && ./test_consumer"

# 测试断言总数（上游 21 + 消费者 roundtrip 1 个测试程序）
assertion_count: 22
