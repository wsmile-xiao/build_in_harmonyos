test_results:
  type: conan_create_ohos_aarch64
  upstream: "passed: BUILD_TESTING=ON ran the full upstream CTest set, 48/48 passed; no registered upstream tests were omitted"
  test_package: "passed: LibIcal CMake consumer linked ical and icalvcard, ran CTest 1/1, and directly verified iCalendar/vCard generation"
  full_reference: "libical/4.0.1#c3550e38c733b3e318a242004f1aea9d:01d92cf349a0dd98ff915f4bd99a04430171517f#d1e40e9a4fd6831e4cf98ecab1b45a0f"
knowledge_gained:
- "\u7F3A\u5C11 glib\uFF0C\u7981\u7528 GLIB \u7ED1\u5B9A"
- "KCalendarCore consumes libical through find_package(LibIcal), so this package now installs and verifies the upstream LibIcal CMake config."
- "ICU and BerkeleyDB discovery are disabled for the Akonadi calendar dependency chain; the required iCalendar and vCard C libraries do not need those optional integrations."
- "Built-in timezone data is enabled because the OHOS package profile does not provide the system zoneinfo tree required by libical's timezone tests."
- "OHOS CMake does not provide usable shared-library SONAME/RPATH defaults for this package, so the recipe supplies OHOS linker rules and keeps libical runtime dependencies resolvable by downstream consumers."
- "Generated shared libraries are signed after installation, and copied consumer-test ELF files are re-signed before execution so loader validation sees the final bytes."
