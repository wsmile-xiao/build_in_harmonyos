  sha256: 7c1d8b780ce305a8823e5824ec4d7eb05d85ae8f808836b495aa37b0c3d08337
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
  - -DLIBICAL_CXX_BINDINGS=OFF
  - -DLIBICAL_JAVA_BINDINGS=OFF
