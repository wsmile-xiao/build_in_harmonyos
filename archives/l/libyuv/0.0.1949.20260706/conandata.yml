# identical 600397-byte archive.  The extracted payload is identical to the
# validated snapshot (191 files, per-file SHA256 equal).
#
# `filename` is required because the GitLab API archive URL does not end in a
# filename; conan's get() cannot deduce one from the `sha` query parameter.
