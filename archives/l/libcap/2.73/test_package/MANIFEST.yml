package: libcap/2.73
homepage: "https://sites.google.com/site/fullycapable/"
upstream_check_command: "make -j1 test GOLANG=no PAM_CAP=no SHARED=no"
upstream_test_in_build: true
upstream_test_command: "make -j1 test GOLANG=no PAM_CAP=no SHARED=no"
upstream_tests:
  - file: cap_test.c
    source: libcap-2.73/libcap/cap_test.c
    description: "验证 capability 位、标志、分配释放、launcher 和 prctl 边界"
    command: "./cap_test"
  - file: psx_test.c
    source: libcap-2.73/tests/psx_test.c
    description: "验证 libpsx 多线程及 fork 后的 POSIX syscall 语义"
    command: "./psx_test"
  - file: libcap_psx_test.c
    source: libcap-2.73/tests/libcap_psx_test.c
    description: "验证 libcap 与 libpsx 联合使用"
    command: "./libcap_psx_test"
privileged_test_target: "make sudotest"
privileged_tests:
  - command: "sudo ./uns_test"
    status: "not_run"
    reason: "需要 root user namespace 和 capability 权限"
  - command: "sudo ./libcap_launch_test"
    status: "not_run"
    reason: "需要 root、chroot 与静态 libc"
  - command: "sudo ./libcap_psx_launch_test"
    status: "not_run"
    reason: "需要 root、chroot、静态 libc 与 pthread capability 传播"
  - command: "sudo ./exploit && sudo ./noexploit"
    status: "not_run"
    reason: "需要 root capability 切换并验证预期成功/失败对照"
  - command: "sudo ./quicktest.sh"
    status: "not_run"
    reason: "需要 root 文件 capability、chroot 和系统管理工具"
test_package_tests:
  - file: test.c
    description: "消费者调用文本 API、libpsx sensitivity API，并实测 cap_get_bound/prctl 与 cap_get_proc/capget"
    command: "./test_libcap"
assertion_count: 5
