version: "2.69"
status: built
build_date: "2026-04-25"

source:
  url: "https://mirrors.edge.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.69.tar.xz"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "GOLANG=no"
    - "PAM_CAP=no"
    - "SHARED=yes"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-Make.Rules-clang.patch"
  - "0002-bash-path.patch"

knowledge_gained:
  - "libcap使用自定义Makefile系统，不是autotools"
  - "需要修改Make.Rules将gcc改为clang"
  - "需要修改脚本shebang从/bin/bash到/data/service/hnp/bin/bash"
  - "HMDFS符号链接复制有权限问题，需用文件副本替代"
