software: libcap
version: 2.69
status: partial
build_system: makefile
created_at: 2026-04-25
knowledge_gained:
  - libcap 使用自定义 Makefile 系统，不是 autotools
  - 需要修改 Make.Rules 将 gcc 改为 clang
  - 需要修改脚本 shebang 从 /bin/bash 到 /data/service/hnp/bin/bash
  - HMDFS 符号链接复制有权限问题，需用文件副本替代
  - 编译参数: prefix=$DEFAULT_PREFIX GOLANG=no PAM_CAP=no SHARED=yes
patches_applied:
  - 0001-Make.Rules-clang.patch
  - 0002-bash-path.patch
build_log: logs/build.log
source_url: https://mirrors.edge.kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-2.69.tar.xz
configure_options:
  - GOLANG=no
  - PAM_CAP=no
  - SHARED=yes
issues:
  - psx_test 测试失败（共享库路径问题）
  - RPATH 需要通过 install.sh 设置
notes:
  - libcap 的 DESTDIR 安装路径不正确，需手动调整目录结构
