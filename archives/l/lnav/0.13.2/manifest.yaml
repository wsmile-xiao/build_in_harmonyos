upstream_tests:
  command: "make check"
  test_count: 55
  notes: "计数口径 = 全树 Makefile.am 的 TESTS 注册数（与 automake 各套件 Testsuite summary 的 TOTAL 同单位）：test/ 47（46 项无条件 + HAVE_LIBCURL 条件追加 test_curl.sh，本包链 conan curl 恒真）+ src/ 子套件 8（src/base 1、src/formats/logfmt 1、src/tailer 1、src/pcrepp 1、src/yajlpp 4）= 55。同一次 make check 打出 6 个 Testsuite summary（1+1+1+4+1+47）逐字聚合为 TOTAL=55 PASS=49 FAIL=6（reports/conan-create.log / logs/*.log 实测），6 项 FAIL 全部位于 test/ 主套件（原因逐条见 notes.md 白名单段），src/ 8 子套件 8/8 PASS。上游 main HEAD（2026-09-08）同口径 59（test/ 50+1 + src/ 8）作下界核对，差额 4 项（pretty_printer.tests、test_breakpoints.sh、test_spectro.sh、test_tui.sh 移出 DISABLED_TESTS）逐项归因为 v0.13.2 发版后上游新增。test_curl.sh（SFTP_TEST_URL 守卫）与 test_regex101.sh（TEST_REGEX101 守卫）未设置对应环境变量时脚本 exit 0，驱动计 PASS 属空跑项，如实分栏披露。cargo 条件项 test_prql.sh 不注册（OHOS 无 cargo，上游 HAVE_CARGO 假路径，PRQL 支持随之裁剪）。配方内 EXPECTED_TEST_TOTAL=47 仅为 test/ 主套件的门禁子断言，非 N 声明值。"

knowledge_gained:
  - "autotools make-dist 发行物（自带 configure/Makefile.in）在无 automake 的 OHOS worker 上，make 会在 configure.ac/configure/Makefile.in 时间戳倒挂时试图重跑 aclocal/automake 而失败；build() 内用 touch -t 分钟级时间戳按 configure.ac→*.m4→aclocal.m4→configure→config.h.in→Makefile.in 依赖序归一即可根治，免 automake tool_requires" # knowledge_ref: E663
  - "发行物 configure 的 AS_TMPDIR 临时目录（umask 077 + ac_tmp=$tmp）在 HMDFS 上被子进程写新目录拦截；对生成物 configure 做 ac_tmp 指向构建目录预建目录 + umask 000 + 退出 trap 不删目录即可，与 scrub/aj 家族同款" # knowledge_ref: E114
  - "curl 走 LIBCURL_CHECK_CONFIG 时经 AC_PATH_PROG 找 curl-config 脚本，必须显式 --with-libcurl=<conan 包目录>（AX_CHECK_PCRE2 默认只搜系统目录同理需 --with-pcre2=<包目录>）；纯 AC_CHECK_LIB/AC_SEARCH_LIBS 类依赖由 AutotoolsDeps 的 CPPFLAGS/LDFLAGS/LIBS 覆盖无需额外开关" # knowledge_ref: E664
  - "application 消费者的 conan 运行闭包会把 DT_NEEDED 的传递共享库落进 Skipped binaries（不进 self.dependencies.host、VirtualRunEnv 不生成 libdir），musl 无系统库兜底即报 symbol not found；test_package 显式 requires 运行期 .so 直依赖 + 按 package_folder 枚举注入 LD_LIBRARY_PATH 可根治" # knowledge_ref: E669

test_package:
  assertion_count: 6
  description: "真跑包内 bin/lnav：A1 lnav -V 自报 lnav 0.13.2；A2 syslog 格式识别+all_logs SQL 计数=3（pcre2+sqlite3）；A3 gzip 透明解压同计数（zlib）；A4 bzip2 透明解压同计数（bzip2）；A5 纯文本格式探测负路径（lnav_file lines=2 且 format IS NULL=1 行；lnav 0.13.2 对不匹配格式的文件只加载不建消息，all_logs 恒 0 为设计行为）；A6 SQL 标量表达式 40+2=42（sqlite3 活性）。"
