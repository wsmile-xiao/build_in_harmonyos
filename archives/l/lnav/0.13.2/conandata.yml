sources:
  url: "https://github.com/tstack/lnav/releases/download/v0.13.2/lnav-0.13.2.tar.gz"
  sha256: "2b40158e36aafce780075e05419924faf8dd99d1c0d4ae25a15b00bc944f4d60"

patches:
  - patch_file: "patches/0001-notcurses-pthread-cancel-musl.patch"
    patch_description: "musl/OpenHarmony 无 pthread_cancel（链接期 undefined symbol，知识条目 E085 同族）：vendored notcurses 的 cancel_and_join()（internal.h）与 ncsubproc_destroy()（fd.c）的 pthread_cancel 调用以 __GLIBC__ 探针守卫（libc 探针，非平台宏）。musl 路径靠上游自身注释认可的语义收尾——SIGKILL 子进程后管道写端关闭，读线程在 read() 上自然 EOF 退出，随后的 pthread_join 收尸；glibc 路径行为逐字节不变"
    patch_type: "portability"
  - patch_file: "patches/0002-date-tz-slim-footer.patch"
    patch_description: "vendored date 库（2016-2019 vintage）不识别 zic 2020b 起默认的 slim TZif：转场表止于最后一条规则变更（如 America/Los_Angeles 止于 2007-03-11），其后的循环行为由文件尾的 POSIX TZ 串承载，而旧实现把最后转场的类型永久外推 → 2007 年后全部日期错报（冬季报 -0700/PDT，timezone() SQL 函数与 demux 时间戳归一化错值）。补丁解析 TZif v2 尾部 POSIX 规则（Mm.w.d/Jn/n 形式 + w/s/u 时间语义），按年合成具体转场（上限 2400 年，升序保证半球规则）， FAT 文件行为不变；上游 HowardHinnant/date 3.0.5 亦无此支持，故为本地移植"
    patch_type: "portability"
  - patch_file: "patches/0003-tmpfile-tmpdir-aware.patch"
    patch_description: "OHOS 的 /tmp 为只读挂载（tmpfile(3) 在 musl 硬编码 /tmp，不读 TMPDIR）→ log_format 的 ELFO 值改写器创建临时文件失败后，attr_line 的后置断言触发 abort（SIGABRT，test_json_format 实测崩溃）。新增 lnav::filesystem::open_unlinked_temp_file()：复用上游 open_temp_file()（mkstemp）在 lnav workdir（$TMPDIR/lnav-user-*-work）下创建并立即 unlink（保持 tmpfile 语义），log_format/cmds.io/sysclip 三处 std::tmpfile() 调用统一替换；glibc 下行为等价"
    patch_type: "portability"
