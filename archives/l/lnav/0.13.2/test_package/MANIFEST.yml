# test_package/MANIFEST.yml — lnav 0.13.2
package: lnav/0.13.2
homepage: "https://github.com/tstack/lnav"

# 上游测试命令（test/Makefile.am 注册 TESTS：46 项无条件 + HAVE_LIBCURL 条件
# test_curl.sh，共 47 项；由配方 build() 内 make check -j1 集成运行，见
# conanfile.py _run_make_check）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序（test/ 目录 47 个注册入口；compiled 的 drive_* /
# document.sections 等为辅助程序不计入注册数）
upstream_tests:
  - file: test/Makefile.am
    source: lnav-0.13.2/test/Makefile.am
    description: "N=47 清点权威来源：TESTS 注册数口径（46 无条件 + HAVE_LIBCURL 条件 test_curl.sh）"
    command: "grep -E '^TESTS' test/Makefile.am"
  - file: test/test_logfile.sh
    source: lnav-0.13.2/test/test_logfile.sh
    description: "归档管理器/w3c/ANSI 输入等文件行为族（含 HMDFS 权限位受限项，见 notes.md）"
    command: "make check（TESTS=test_logfile.sh）"
  - file: test/test_sql_time_func.sh
    source: lnav-0.13.2/test/test_sql_time_func.sh
    description: "timezone() SQL 函数（slim TZif footer 展开补丁的验证面）"
    command: "make check（TESTS=test_sql_time_func.sh）"

# test_package 中自带的测试（消费者视角验证，真跑包内 bin/lnav）
test_package_tests:
  - file: test.sh
    description: "A1 lnav -V 自报 lnav 0.13.2；A2 syslog 识别+all_logs 计数=3；A3 gzip 透明解压；A4 bzip2 透明解压；A5 纯文本格式探测负路径（lnav_file lines=2 且 format IS NULL=1 行）；A6 SQL 标量表达式 40+2=42"
    command: "sh test.sh（经 conanrun env）"

# 测试断言总数（test.sh 内 A1-A6 共 6 项断言）
assertion_count: 6
