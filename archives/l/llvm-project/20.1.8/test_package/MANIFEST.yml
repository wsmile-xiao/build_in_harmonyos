# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 ci/conan/build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md / references/iron-rules.md R51

package: llvm-project/20.1.8
homepage: https://llvm.org

# 上游测试命令（llvm-project 开发者全量构建语境下）
upstream_check_command: "ninja check-llvm check-clang（lit 套件）"
upstream_test_in_build: false

# ── 上游测试总数 N（清点口径，候选数法取最大值 + 差额逐项归因，R51 / E328）────────────
# 口径 = 「lit 框架可发现的测试文件数」（框架注册口径），只统计本包实际启用的两个 project：
#   llvm/test（LLVM_ENABLE_PROJECTS 未启用 clang 之外的 project，故不含 mlir/flang/lld/… 的套件）
#   clang/test
# 清点命令（在解压后的源码根执行；.gitignore/CMakeLists/README/LICENSE 与 Inputs/ 目录按
# lit 的 config.excludes 规则排除）：
#   python3 - <<'EOF'
#   import os
#   S="."; llvm_sfx={".ll",".c",".test",".txt",".s",".mir",".yaml",".spv"}
#   clang_sfx={".c",".cpp",".i",".cppm",".m",".mm",".cu",".cuh",".hip",".hlsl",".ll",".cl",
#              ".clcpp",".s",".S",".modulemap",".test",".rs",".ifs",".rc"}
#   ex={"Inputs","CMakeLists.txt","README.txt","LICENSE.txt"}
#   ...  # 详见 notes.md「上游测试清点」小节（含全部 lit.local.cfg 追加后缀的并集）
#   EOF
upstream_test_count:
  method: "lit 框架可发现测试文件数（后缀集 ∪ 全部 lit.local.cfg 追加后缀；按 config.excludes 排除 Inputs 等）"
  llvm_test: 55394
  clang_test: 20847
  total_N: 76241
  # 候选数法最大值（含非测试辅助文件的全文件数上限）及其归因差额：
  max_candidate_N: 77006
  max_candidate_breakdown: "llvm/test 56044 + clang/test 20962（排除 Inputs 目录后的一切文件）"
  delta_attribution: "765 = 非测试辅助文件（.gitignore/.py 工具脚本/README 等无 RUN 行的文件），非 lit 用例"
  note: "N 取候选数法最大值 77006；上表 76241 为 lit 框架注册口径的分项，两者差额 765 已逐项归因（R51/E328：四口径不得混用）"
upstream_test_run:
  N_prime: 15013
  detail: >-
    手工有界子集实跑（非 CI，真实构建树出来的 bin/llvm-lit，-j4）：llvm/test/{Assembler,Bitcode,
    Verifier,Transforms/InstSimplify} 1351 项 + llvm/test/{MC/{AArch64,ARM,X86},CodeGen/{AArch64,
    ARM,X86}} 13662 项。合计 Passed 14738 / Failed 8 / Unsupported 248 / XFAIL 19（通过率 98.17%）。
    8 项 FAIL 全为「对 2>&1 合并流做逐行相邻匹配」的 CHECK-NEXT/CHECK 错位（输出流缓冲与交错差异，
    与 archives/c/clang/22.1.8/notes.md 登记的「输出缓冲」同类非适配失败）；无编码/目标/链接层失败。
    相对声明 N=77006，NOT_RUN = 61993（其余 lit 用例，按下方豁免五条原因整体申报）。
  ci_result: "L1 = pass（test_package 真实执行，见 build_and_test.sh L1a–L1d）"
  evidence: "$TASK_DIR/lit-run.log、$TASK_DIR/lit-run2.log、$TASK_DIR/lit-summary.md（仓库外）"

# TEST_QUALITY_SPEC §3.3 / R51 平台限制豁免（非「偷懒未测」）
# 本包是可分发的 AArch64+ARM+X86 工具链/开发面瘦身配方，不是 llvm-project 全量开发者构建。
upstream_test_exemption: >-
  (1) 运行时版本错配：本包 LLVM/clang 为 20.1.8，而运行资源（clang_rt crt/builtins、libunwind、
  libc++abi）按 clang/20.1.8 先例从设备 OHOS SDK 动态发现并捆绑（SDK 侧为 15.x）。上游 lit
  （Driver/CodeGen/Sema 等）假定「被测 clang」与同树 compiler-rt/libcxx 版本一致，强行启用会产生
  与 OHOS 适配无关的系统性失败。
  (2) 未构建 runtimes 工程：配方只 -DLLVM_ENABLE_PROJECTS=clang，不编 compiler-rt/libcxx/libunwind；
  check-clang/check-llvm 依赖同次构建产出的资源目录与 runtime，OHOS 侧改由 SDK sysroot 提供。
  (3) libc/平台语义差：大量 llvm/test、clang/test 用例假定 glibc（locale、特定 pthread/posix_spawn、
  dl_iterate_phdr、/proc 布局等），OHOS 为 musl 系 libc，符号/语义缺失或行为不同，无法用少量
  #ifdef 覆盖数万条 lit 输入；设备 /tmp 只读亦会让部分用例的临时文件重定向静默失败。
  (4) CI 墙钟与内存：本包比 clang/22.1.8（10800s 窗口）多两个后端（ARM+X86），干净构建更长；
  check-llvm/check-clang 在 aarch64 上通常再需数小时，叠加后超过本包 CI 窗口 14400s。
  (5) lit 基础设施：全量套件还需 googletest 目标、Python lit 插件及部分 External 网络用例，
  Worker 镜像与权限不满足。
  因此保持 LLVM_INCLUDE_TESTS=OFF；以 test_package 对交付的开发面做真实编译+链接+运行验证（R34）。

exempted_tests:
  - file: llvm/test/**
    name: check-llvm (lit)
    reason: >-
      大量 glibc/Linux-procfs 假设与 OHOS musl + HMDFS 相异；全量套件叠加构建后超过 CI 14400s 窗口。
    evidence: >-
      设备实测干净构建（AArch64;ARM;X86 + clang）耗时与 CI 窗口对比见 notes.md「验证记录」。
  - file: clang/test/**
    name: check-clang (lit)
    reason: >-
      依赖与 clang 20.1.8 同树的 compiler-rt/libcxx；本包按 clang/20.1.8 先例捆绑 SDK clang_rt
      （动态发现的 15.x）与 OHOS musl sysroot，lit 资源路径与期望不符。
    evidence: >-
      LLVM lit 设计假定 monorepo 开发者构建；见 clang/www/hacking.html 与 LLVM_INCLUDE_TESTS 文档。
  - file: llvm/unittests/** clang/unittests/**
    name: llvm/clang unit tests (gtest)
    reason: >-
      需要 LLVM_INCLUDE_TESTS=ON 且把 gtest 目标纳入 all，与 lit 同一套 runtime/resource-dir 假设，
      且在设备上有 OOM 风险。
    evidence: >-
      配方已用 LLVM_PARALLEL_LINK_JOBS=4 + cmake --build -j6 限制并发以防 OOM。

# 上游测试套件（本配方不在 build() 中执行；见豁免）
upstream_tests: []

# test_package 中自带的测试（CI 内真实执行，R34 反空壳）
test_package_tests:
  - file: CMakeLists.txt + clang_devface_probe.cpp
    description: >-
      find_package(LLVM) + find_package(Clang) + find_library(clangFrontend/clangBasic/clangEdit/
      clangLex/clangSupport/clangASTMatchers HINTS ${LLVM_LIBRARY_DIRS})（ispc 原判据），
      链接 6 个 clang 组件静态库 + libLLVM.so 并真实运行探针
    command: "cmake --build && ./clang_devface_probe"
  - file: conanfile.py
    description: "llvm-config --version/--libdir/--includedir/--libfiles aarch64 arm x86（ispc FindLLVM.cmake 入口）"
    command: "<pkg>/bin/llvm-config --version …"
  - file: conanfile.py
    description: "llvm-config --targets-built 断言同时含 AArch64/ARM/X86（ispc LLVM_SUPPORTS_ARM 与 X86_ENABLED 判据）"
    command: "<pkg>/bin/llvm-config --targets-built"
  - file: filecheck_pattern.txt + filecheck_input.txt
    description: "包内 FileCheck 真实执行一次 CHECK 匹配"
    command: "<pkg>/bin/FileCheck --input-file=filecheck_input.txt filecheck_pattern.txt"

test_package_result: "7/7 passed (100%) — 本机 `conan test` rc=0（CMake 开发面探针 6 项断言 + 真实运行 1 项 + llvm-config 4 次执行 + targets-built 断言 + FileCheck 1 次执行）"
assertion_count: 7
