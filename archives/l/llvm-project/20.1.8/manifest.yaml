knowledge_gained:
  - "LLVM+Clang 单包交付：lib/cmake/llvm 与 lib/cmake/clang 同时挂 builddirs + cmake_find_mode=none，下游一次 find_package(LLVM)/find_package(Clang) 拿全开发面"
  - "ispc 1.28.2 硬需求 LLVM_TARGETS_TO_BUILD 同时含 AArch64 与 ARM（--targets-built 判定 LLVM_SUPPORTS_ARM），AArch64-only 会在 aarch64 宿主上触发 no-targets FATAL_ERROR"
  - "ispc lit 套件 167 用例 REQUIRES: X86_ENABLED 且 X86_ENABLED=ON 时需 clang --target=x86_64-unknown-unknown 生成 dispatch/builtins，故后端须含 X86"
  - "真机原生 LLVM/clang 构建仍需 config.guess stub + Platform/HarmonyOS.cmake 垫片，且不设 CMAKE_SYSTEM_NAME"
