software: libpst
display: "libpst"
description: "Library for reading Microsoft Outlook PST files (Personal Storage Table)"
category: data
homepage: "http://www.five-ten-sg.com/libpst/"
license: GPL-2.0
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "⚠️ 必须使用 cmake 构建（autotools 在 HMDFS 上因 SELinux 权限限制无法创建临时文件）"
    - "需要自定义 CMakeLists.txt（原项目使用 autotools）"
    - "XGetopt.h 需要添加条件判断避免与系统 getopt 冲突"
    - "缺少 libgsf 依赖时只能构建简单工具（lspst, getidblock, dumpblocks）"
  common_dependencies:
    - zlib

# 版本索引（由 finalize-archive 自动更新）
versions:
  - version: "0.6.76"
    status: built
    build_date: "2026-05-25"
    notes: "首次编译，使用 cmake 替代 autotools 成功绕过 HMDFS SELinux 限制"