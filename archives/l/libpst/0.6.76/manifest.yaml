# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DZLIB_LIBRARY=/storage/Users/currentUser/usr/local/lib/libz.a"
    - "-DZLIB_INCLUDE_DIR=/storage/Users/currentUser/usr/local/include"
    - "-DENABLE_STATIC_TOOLS=ON"
    - "-DENABLE_SHARED=OFF"
    - "-DENABLE_PYTHON=OFF"
    - "-DENABLE_DII=OFF"
    - "-DENABLE_MSG_UTILS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

