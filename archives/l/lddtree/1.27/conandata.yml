# conandata.yml — lddtree 1.27
# Official upstream source (ncopa/lddtree, GitHub release tag v1.27 — R39 compliant).
# sha256 verified against the downloaded lddtree-1.27.tar.gz (2178596 bytes).

sources:
  # The .tar.gz suffix is REQUIRED: codeload URLs such as
  # /tar.gz/refs/tags/v1.27 end in the bare tag name, and Conan's get()
  # then fails with "BadZipFile: File is not a zip file" (verified locally).
  # NOTE: keep this a single official mirror-free URL. The CI pre-download step
  # rewrites it into a gh-proxy.com-prefixed list for its own run; that state
  # must never be committed (PF7 rejects mirror hosts).
  url: "https://github.com/ncopa/lddtree/archive/refs/tags/v1.27.tar.gz"
  sha256: "f24b1965f5b353ad93fb2844edcb5ac7c41a7d19faec67694810fa03314ce649"

patches:
  "1.27":
    - patch_file: "patches/0001-portable-option-parsing.patch"
      patch_description: >-
        Replace the external GNU getopt(1) option parser with an equivalent
        POSIX-shell implementation. Upstream lddtree.sh shells out to
        `getopt -o ahlR:Vx -l all,help,list,no-auto-root,root:,version,debug`,
        which is absent from the HarmonyOS PC environment (busybox/toybox has no
        getopt and util-linux is not published to the registry), so every
        invocation failed before doing any work. Option syntax and observable
        behaviour (usage to stdout with exit 0 on -h/--help, usage to stderr with
        exit 1 on unknown/missing operands, bundled short options, --opt=value)
        are preserved.
      patch_type: "portability"
    - patch_file: "patches/0002-self-contained-test-runner.patch"
      patch_description: >-
        Make `make check` run the upstream test suite without kyua/atf-sh.
        Upstream drives tests/lddtree_test through the ATF + kyua framework
        (generating Kyuafile/Kyuafile via make); neither kyua nor atf-sh exists
        on HarmonyOS PC. The patch keeps the `check` target and adds
        tools/atf-sh-mini, a 133-line POSIX-sh ATF compatibility layer
        (atf_get_srcdir / atf_test_case / atf_add_test_case / atf_check /
        atf_fail / atf_skip) so tests/lddtree_test and tests/test_env.sh run
        byte-identically to upstream. All 13 upstream cases execute; no
        assertion is weakened, removed or skipped.
      patch_type: "portability"
