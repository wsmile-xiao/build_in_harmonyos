# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lddtree/1.27
homepage: "https://github.com/ncopa/lddtree"

# 上游测试收集命令（tests/ 下 1 个 ATF 测试程序，注册 13 个用例）
upstream_check_command: "grep -c '^lddtree_.*_body()' tests/lddtree_test"

# conanfile.py build() 方法中已集成并真实运行上游测试套件（R51）
upstream_test_in_build: true
# 上游以 kyua + atf-sh 驱动 `make check`；本平台二者皆无，
# patches/0002 保留 check 目标并新增 tools/atf-sh-mini（自带 ATF 兼容层），
# 用例本体与断言未改动。
upstream_test_command: "make check"

# 上游实际运行的测试程序（单个 ATF 程序，13 个用例）
upstream_tests:
  - file: tests/lddtree_test
    source: lddtree-1.27/tests/lddtree_test
    description: >-
      上游唯一的测试程序（ATF 风格 POSIX sh），注册 13 个用例：
      usage / version / sh / sh_list / sh_all / sh_debug /
      sh_missing_scanelf / root / no_auto_root / no_auto_root_list /
      ldso_conf / ld_musl_path_conf / rpath_origin_lib
    command: "make check   # → tools/atf-sh-mini tests/lddtree_test"

# 上游测试用例修改声明 (R51 / 诚实申报)：
#  未改动。tests/lddtree_test 与 tests/test_env.sh 保持上游原文逐字节一致
#  （sha256 见下），断言、用例名、期望值、用例数量全部未变。
#  patches/0002 只替换"测试驱动方式"（kyua+atf-sh → 自带 atf-sh-mini）并
#  新增断言级计数；每个 atf_check 的 ATF 语义、match:/not-match: 判定与
#  -s exit:N 均按上游原样执行，无跳过、无豁免、无削弱。
upstream_test_modifications: []

# 上游测试文件完整性佐证（与上游 v1.27 tarball 一致）
upstream_test_file_sha256:
  tests/lddtree_test: "19b97aad014553792c6e357a3d32e971456cc14af6ff47bd51dbdba5d0fc848e"
  tests/test_env.sh: "72eb4e3a267a8726c256e54252a1eb7c1fbbff5ec9fcd937c606bccd9da3ef8a"

# 构建期工具依赖（上游测试由 make 驱动，CI worker 的 PATH 无 make）
build_tool_requires:
  - bmake/20200710        # 提供 make，驱动 `make check`

# 运行时依赖（lddtree 需要 ELF 解析后端；本平台无 scanelf）
runtime_requires:
  - binutils/2.46.0       # 提供 objdump + readelf（runenv PATH 注入）

# 实测结果（隔离 PATH：无 getopt、有 readelf/objdump；make 来自 bmake 工具包）
#   $ make check
#   lddtree_usage PASS ... lddtree_rpath_origin_lib PASS   （13 行全 PASS）
#   13 tests, 13 passed, 0 failed, 0 skipped
#   ASSERTIONS: total=21 failures=0
#   退出码 0
upstream_test_result:
  total: 13
  passed: 13
  failed: 0
  skipped: 0
  pass_rate: "13/13 (100%)"
  assertions_total: 21
  assertions_failed: 0
  exit_code: 0
  # 破坏性反向验证（R34/L1e 同口径）：故意破坏被断言的行为
  # （interpreter 输出改为固定 BOGUS）后重跑 → 8 例断言失败、退出码 2，
  # 证明用例与计数非空转。
  negative_control:
    assertions_total: 21
    assertions_failed: 8
    exit_code: 2

# test_package 中自带的测试 (消费者视角验证，真实执行打包产物)
test_package_tests:
  - file: test_lddtree.py
    description: >-
      消费者测试 — 对打包安装后的 bin/lddtree.sh 真实发起子进程调用：
      版本/用法/非法选项/无参数/依赖树/扁平输出/--all/--debug/符号链接与
      --root 解析/缺失文件与目录入参诊断/缺后端时的错误路径。
    command: "test_lddtree.py <pkg>/bin/lddtree.sh"

# 测试断言总数 (与 test_lddtree.py 末尾机器可读汇总行 ASSERTIONS: total=<N> 一致)
assertion_count: 38
