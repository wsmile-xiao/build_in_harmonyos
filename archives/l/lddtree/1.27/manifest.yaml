knowledge_gained:
  - "Upstream lddtree.sh depends on the external GNU getopt(1); toybox/busybox has no getopt and util-linux is not published to the registry, so the option parser must be replaced with a POSIX-shell implementation (patch 0001)."
  - "A self-contained POSIX-sh ATF layer (tools/atf-sh-mini) lets an upstream ATF/kyua suite run unmodified where kyua and atf-sh do not exist — the test files stay byte-identical to upstream (patch 0002)."
  - "The registry bmake requires -r: sys.mk ships under share/mk which bmake does not search by default ('no system rules (sys.mk)'); -r is portable to GNU make."
  - "conandata.yml source URLs that end in a bare git tag make Conan's get() treat the tarball as a zip (BadZipFile) — the URL must end in .tar.gz."
  - "The CI script's build_and_test.sh rewrites conandata.yml URLs into a gh-proxy.com-prefixed list for its own pre-download step; that mutated state fails PF7 if committed, so the official single URL must be restored before pushing."
  - "CI gate L4 greps patches for (strcpy|sprintf|gets|strcat)\\b without a leading word boundary, so the ordinary English word 'gets' in a patch comment is reported as a 'dangerous function' — a benign false positive."
