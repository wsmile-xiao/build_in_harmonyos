software: lddtree
display: "lddtree"
description: "POSIX-shell ELF dependency tree viewer (lddtree.sh) with a binutils objdump/readelf backend"
category: utility
homepage: "https://github.com/ncopa/lddtree"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Runtime backend: lddtree shells out to scanelf (pax-utils) or objdump+readelf (binutils). No OHOS package publishes scanelf, so binutils/2.46.0 is declared as a genuine runtime requirement; its runenv_info puts objdump/readelf on PATH."
    - "patch 0001 replaces upstream's external GNU getopt(1) call with an equivalent POSIX-shell parser — toybox/busybox provides no getopt and util-linux is not in the registry, so upstream aborted every invocation before doing any work."
    - "patch 0002 keeps the `check` target and adds tools/atf-sh-mini, a self-contained POSIX-sh ATF layer, so the unmodified upstream suite (tests/lddtree_test, 13 cases) runs without kyua/atf-sh. The upstream test files are byte-identical to upstream."
    - "The registry bmake needs `-r` (no built-in rules): its sys.mk lives under share/mk, which bmake does not search by default, so a bare invocation fails with 'no system rules (sys.mk)'. -r is also accepted by GNU make."
    - "Source URL must carry the .tar.gz suffix: codeload URLs ending in the bare tag (…/tar.gz/refs/tags/v1.27) make Conan's get() try to unzip a gzip stream (BadZipFile)."
    - "There is no compilation step; /tmp is read-only so the test runner sets TMPDIR into the build folder."
  common_dependencies:
    - binutils/2.46.0

versions:
  "1.27":
    status: built
    build_date: 2026-09-15
    conan_ref: lddtree/1.27
