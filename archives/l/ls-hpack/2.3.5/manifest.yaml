version: "2.3.5"
status: verified
build_date: "2026-09-01"

source:
  url: "https://github.com/litespeedtech/ls-hpack/archive/refs/tags/v2.3.5.tar.gz"
  tar_format: tar.gz

  sha256: "430a1a36029e0ae1c81eaa0b2356920f1e65fde1cdd722351c671ebe513b7a96"
build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

patches_applied: []

knowledge_gained:
  - "上游 CMakeLists 无 install() 规则，package() 需手动收集头文件与静态库"
  - "CMAKE_MINIMUM_REQUIRED(2.8) 过老，新 CMake 需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "非 Release 构建自动启用 ENABLE_TESTING + ASan（-fsanitize=address），本机 OHOS musl/clang15 下 ASan 可用"
  - "xxhash 通过 LSHPACK_XXH=ON 内置（deps/xxhash），无需外部依赖"
  - "bin/ CLI 工具仅在 CMAKE_SYSTEM_NAME=Linux 时构建，OHOS 下纯库包"
software: ls-hpack
build_system: cmake
