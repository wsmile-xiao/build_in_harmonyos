software: libeatmydata
display: "LibEatMyData"
description: "LD_PRELOAD library that disables fsync and related sync calls for faster disk operations during testing"
category: system
homepage: "https://www.flamingspork.com/projects/libeatmydata"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "pthread_testcancel is unavailable on OHOS/musl - needs #ifdef __OHOS__ guards"
    - "pthread_cancel is unavailable on OHOS/musl - tst-cancel4 test must be skipped"
    - "LD_PRELOAD mechanism works on OHOS (verified: fsync/fdatasync/msync/syncfs/open O_SYNC/O_DSYNC stripping all functional)"
    - "config.status temp directory creation fails on HMDFS - needs bootstrap.sh to use $TMPDIR"
    - "tst-key4 fails on musl due to PTHREAD_KEYS_MAX=128 vs glibc 1024+ (platform limit, not library bug)"
    - "GitHub tarball lacks configure script - needs libtoolize + autoreconf bootstrap"
  common_dependencies: []

versions:
  "131":
    status: published
    build_date: "2026-06-03"