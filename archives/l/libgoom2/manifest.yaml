software: libgoom2
display: "libgoom2"
description: "Goom 音频可视化效果库（XMMS goom 插件的 2004 重写版），把音频采样流渲染为动画视觉效果"
category: library
homepage: "https://sourceforge.net/projects/goom/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2004 年 config.guess/config.sub 不识别 HarmonyOS 也不认识 aarch64，补丁补齐 HarmonyOS 分支与 linux-ohos 白名单（E007/E072），不伪造 --build/--host"
    - "HMDFS 上 configure 的 umask 077 mktemp 临时目录不可写且静默失败，补丁放宽为 022（E011）"
    - "OHOS 适配版 conan 不映射 tools.build:compiler_executables，配方显式注入 CC/CXX/AR/RANLIB"
    - "共享库构建（上游 AM_DISABLE_STATIC）；XMMS 插件与 SDL 演示程序需要 XMMS2/SDL/GTK，随上游 configure 自动关闭"
  common_dependencies: []

versions:
  "2k4":
    status: built
    build_date: "2026-09-18"
