version: "2k4"
software: "libgoom2"
status: built
build_date: "2026-09-18"
build_system: "autotools"

source:
  url: "https://downloads.sourceforge.net/project/goom/goom2k4/0/goom-2k4-0-src.tar.gz"
  sha256: "d993c904c05faba87fd7f159291fa1cb7aadcff2edd28454d8e967880a8a0c85"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--prefix=<package_folder>"
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-config-guess-harmonyos-ohos.patch"
  - "0002-config-sub-linux-ohos.patch"
  - "0003-configure-umask-022-for-hmdfs-temp-dirs.patch"

knowledge_gained:
  - "2004 年的 config.guess/config.sub 既不识别 HarmonyOS 也不认识 aarch64：config.guess 报 'unable to guess system type'（走 LD/编译器探测回退还会撞上 HMDFS 目录不可写），config.sub 连 aarch64-unknown-linux-ohos 与 aarch64-linux-ohos 两种形态都拒绝；按 E007/E072 补 3 个锚点（config.guess 的 HarmonyOS 分支、config.sub 的 maybe_os 列表与 OS 白名单、CPU 列表的 aarch64/arm64）后 config.sub(config.guess) 原样往返，无需伪造 --build/--host"
  - "HMDFS 上 configure 的 `umask 077 && mktemp -d` 临时目录创建后对当前进程不可写，config.status 报 can't create ./confstat*/out: Permission denied 且 configure 仍退出 0（Makefile 根本没生成、make 才报 'no makefile found'）；补丁放宽为 umask 022 后 Makefile 正常生成"
  - "OHOS 适配版 conan 的 AutotoolsToolchain 不把 tools.build:compiler_executables 映射为 CC/CXX，autotools 配方需 _compiler_env() 显式注入（adplay/1.9、jack/1.9.22、tslib/1.22 先例）"
  - "本仓 make 的 'jobserver mkfifo: Operation not permitted' 是噪声（make 自动退化为 pipe jobserver），不是权限损坏"
