sources:
  url: "https://downloads.sourceforge.net/project/goom/goom2k4/0/goom-2k4-0-src.tar.gz"
  sha256: "d993c904c05faba87fd7f159291fa1cb7aadcff2edd28454d8e967880a8a0c85"

patches:
  - patch_file: "patches/0001-config-guess-harmonyos-ohos.patch"
    patch_description: "Recognise HarmonyOS in the bundled 2004 config.guess and print aarch64-unknown-linux-ohos instead of failing with 'unable to guess system type'"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-linux-ohos.patch"
    patch_description: "Accept the linux-ohos kernel/OS pair and the aarch64/arm64 CPU names in the bundled config.sub so config.sub(config.guess) round-trips to aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask-022-for-hmdfs-temp-dirs.patch"
    patch_description: "Relax configure's umask 077 mktemp/mkdir temp directories to 022 so config.status can create the Makefiles on HMDFS"
    patch_type: "portability"
