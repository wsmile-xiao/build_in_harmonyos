# test_package/MANIFEST.yml — libgoom2 2k4
# CI L0e requires this file to exist.

package: libgoom2/2k4
homepage: "https://sourceforge.net/projects/goom/"

# Upstream ships NO automated test suite. Inventory of the original tarball
# (goom-2k4-0-src.tar.gz, sha256 d993c904...c85):
#   * `grep -rn "TESTS\|check_PROGRAMS" --include="Makefile.am" --include="configure.in" .`
#     has zero hits in the whole tree, so automake's `make check` target is a
#     structural no-op (observed: "Nothing to be done for 'check'" in every
#     subdirectory).
#   * test/testapp.c is a 17-line manual demo that calls goom_init/goom_update
#     in a loop; there is no test/Makefile.am, so it is neither built nor run
#     by any target.
#   * the diagnostics under tools/ (gfont.c, minicompress.c) are code
#     generators for the build, not test programs.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# No automated upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_libgoom2_consumer.c
    description: "Consumer links -lgoom2 and drives the public API: goom_init(320,240) returns a live instance (resolution applied, screen.size consistent, >=1 visual FX registered), 64 synthetic audio frames each return a framebuffer (64/64), the framebuffer is painted (non-zero FNV-1a hash) and animates (>=2 distinct frame hashes), the sound analysis reports a volume in (0,1], goom_set_resolution(640,480) takes effect and rendering continues at 16/16 frames with a different frame than the 320x240 pass, and goom_close returns without crashing."
    command: "./test_libgoom2_consumer"

# Assertion count: instance created, resolution applied, screen.size, FX registered,
# 64/64 frames, first frame painted, animation live, volume in range,
# resolution change applied, 16/16 frames after resize, resized frame differs, close
assertion_count: 12
