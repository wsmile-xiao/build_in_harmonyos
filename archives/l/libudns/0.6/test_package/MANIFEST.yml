# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libudns/0.6
homepage: "https://www.corpit.ru/mjt/udns.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libudns 0.6 官方 tarball 无独立测试: 无 tests/ 目录、无测试框架、
# 无 make check 目标 (make check → No rule)。dnsget/rblcheck/ex-rdns
# 是 CLI 工具/示例而非测试用例, source_declared_total=0。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libudns.c
    description: "消费者测试: 真实调用 libudns 公开 API (dns_pton/dns_ntop/dns_ptodn/类型表/dns_init), 离线确定性"
    command: "./test_libudns"
  - file: test_libudns_ohos.c
    description: "鸿蒙专项测试: dns_init->dns_submit_a4->dns_ioevent 事件循环真实解析 example.com A 记录"
    command: "./test_libudns_ohos example.com"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10