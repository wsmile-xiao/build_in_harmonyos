# 版本级 manifest
# 文件位置: archives/l/libopenraw-pixbuf-loader/0.3.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "0.3.7"
software: "libopenraw-pixbuf-loader"
status: built
build_date: "2026-09-27"
build_system: custom        # 模块：单文件 clang 编译（复刻 gnome/Makefile.am）
                            # 另：整树 autotools 构建以真实运行上游 9 个注册用例（R51）

source:
  url: "https://libopenraw.freedesktop.org/download/libopenraw-0.3.7.tar.bz2"
  mirrors:
    # Worker 网络受限修复（PR #12724 / build #61765）：官方站在 Worker 上
    # connect timeout，conandata.yml 已把可达镜像排到官方 URL 之前。
    # 此处登记同一份 tar.bz2 的镜像地址（字节一致，sha256 不变）。
    - "https://mirrors.tuna.tsinghua.edu.cn/macports/distfiles/libopenraw/0.3.7_1/libopenraw-0.3.7.tar.bz2"
    - "https://mirrors.nju.edu.cn/macports/distfiles/libopenraw/0.3.7_1/libopenraw-0.3.7.tar.bz2"
    - "https://mirrors.aliyun.com/macports/distfiles/libopenraw/0.3.7_1/libopenraw-0.3.7.tar.bz2"
    - "https://distfiles.macports.org/libopenraw/0.3.7_1/libopenraw-0.3.7.tar.bz2"
  sha256: "5515b2610361ef34580b6b976635119f6dedb4f0a79d54662fa5fe6186a45ed5"
  tar_format: tar.bz2

build:
  system: custom            # 模块：单文件 clang；另构建整树以运行上游测试
  configure_options: ["--disable-gnome"]
  dependencies:
    - "libopenraw/0.1.2"     # published version (R36); 0.3.7 exists but is not on ohpcd yet
    - "gdk-pixbuf/2.44.6"
    - "zlib/1.3.1.1"         # override: boost(1.3.1) vs glib(1.3.1.1)
  build_requires:            # 构建上游整树（跑 9 个注册用例）所需
    - "rust-toolchain/1.97.1"
    - "openssl/3.5.6.1.1"
    - "zlib/1.3.2"
    - "boost/1.84.0"
    - "libjpeg-turbo/3.2.0"
    - "libxml2/2.15.3"
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  command: "make check-TESTS"
  discovered: 9              # N（整树 automake TESTS：lib/ 1 + test/ 6 + testsuite/ 2）
  executed: 9                # N′
  passed: 9
  failed: 0
  pass_rate: "9/9 (100%)"
  note: >-
    testsuite 为数据驱动用例，47 条断言依赖真实相机 RAW 样本（上游经 libcurl
    bootstrap 下载）；本环境 HAVE_CURL=no，输出 "File not found, skipping." 后
    以 0 退出被记为 PASS，不构成真实断言覆盖。其余 8 项为自包含真实断言。

knowledge_gained:
  - "libopenraw-pixbuf-loader 是 libopenraw 源码树内的单文件 gdk-pixbuf 加载器模块（gnome/pixbuf-loader.c -> libopenraw_pixbuf.so），无独立 tarball"
  - "构建策略双轨：模块本身单文件 clang 编译复刻 gnome/Makefile.am；另 configure/make 整树以真实运行上游 9 个注册用例（R51）——整树需要 cargo/rustc，用 rust-toolchain tool_requires + ELF 签名 + cargo 运行库静态重链接"
  - "R51 清点口径是【源码树注册的测试总数】而非子目录：本包曾误按 gnome/ 无测试申报 N=0，实为整树 TESTS=9（PR #12724 @Septest 指出）"
  - "boost/libjpeg-turbo/libxml2 作为整树构建输入须用 tool_requires：声明为可见 requires 会被 Conan package_info() 拒绝（未被 cpp_info.requires 引用）"
  - "OHOS 下模块必须 binary-sign-tool -selfSign 签名后才能被 gdk-pixbuf dlopen；测试可执行文件同样需签名才能 execve"
  - "R36：libopenraw 仅 0.1.2 已发布；0.3.7 本地缓存可构但未 upload，故 requires 0.1.2（pixbuf-loader.c 所用 API 在 0.1.2 头文件中全部存在）"
