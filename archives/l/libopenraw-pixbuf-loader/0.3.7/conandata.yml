# conandata.yml — libopenraw-pixbuf-loader 0.3.7
#
# Upstream does not publish a standalone tarball for the gdk-pixbuf loader:
# it lives inside the libopenraw source tree (gnome/pixbuf-loader.c).  The
# source is therefore the official libopenraw 0.3.7 release tarball.
#
# URL 列表形态（#3135 修法）：CI Worker 网络受限——官方站
# libopenraw.freedesktop.org 在 Worker 上 connect timeout（PR #12724 /
# build #61765 实测），且 Worker 无 curl（Pre-download 段实为 no-op），
# 因此镜像回退只能依赖 conan 下载器按序尝试：可达镜像必须排在官方 URL 之前。
#
# 下列镜像承载的是与官方发布包【逐字节一致】的同一份 tar.bz2
# （sha256 5515b2610361ef34580b6b976635119f6dedb4f0a79d54662fa5fe6186a45ed5，
#  2026-09-26 五站实测全部一致），故 sha256 校验值保持不变。
# 域名均为仓内已合入配方验证过的可达源：tuna/aliyun 见 autoconf 2.72、
# abr2gbr 1.0.2（镜像在前）；nju 见 libosmo-netif 1.6.0；
# distfiles.macports.org 见 xqilla 2.3.4、liblqr 0.4.2、ncview 2.1.11
# （ncview 同属 "Worker 源码下载超时" 修复，同样保持 sha256 不变）。
# 官方 URL 保留在末位，作为权威来源与出处（R39）。

sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/macports/distfiles/libopenraw/0.3.7_1/libopenraw-0.3.7.tar.bz2"
    - "https://mirrors.nju.edu.cn/macports/distfiles/libopenraw/0.3.7_1/libopenraw-0.3.7.tar.bz2"
    - "https://mirrors.aliyun.com/macports/distfiles/libopenraw/0.3.7_1/libopenraw-0.3.7.tar.bz2"
    - "https://distfiles.macports.org/libopenraw/0.3.7_1/libopenraw-0.3.7.tar.bz2"
    - "https://libopenraw.freedesktop.org/download/libopenraw-0.3.7.tar.bz2"
  sha256: "5515b2610361ef34580b6b976635119f6dedb4f0a79d54662fa5fe6186a45ed5"

patches: []
