# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libopenraw-pixbuf-loader/0.3.7
homepage: "https://libopenraw.freedesktop.org/"

# 上游测试命令 (用于 `make check` / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 2026-09-27 修正：本包源码 = libopenraw 0.3.7 整树 tarball，build() 现
# 真实配置并构建整棵树，再以 `make check-TESTS` 逐目录运行注册用例。
upstream_test_in_build: true
upstream_test_command: "make check-TESTS"

# 上游实际运行的测试程序
# 清点结论 (见 notes.md「上游测试清点与实测」节, R51): N = 9
#   - 全树 automake TESTS 注册 9 项：lib/ 1 + test/ 6 + testsuite/ 2。
#   - gnome/（加载器所在目录）自身无 TESTS/check_PROGRAMS；demo/ 是
#     noinst_PROGRAMS 演示程序（非测试）。
#   - 此前申报 N=0 系误将"gnome/ 无测试"当作"整树无测试"，已修正。
upstream_tests:
  - file: lib/Makefile.am
    name: teststream
    description: "io/stream 单元测试（自包含真实断言）"
    result: PASS
  - file: testsuite/Makefile.am
    name: test_xmlhandler
    description: "XML handler 单元测试（自包含真实断言）"
    result: PASS
  - file: testsuite/Makefile.am
    name: testsuite
    description: >-
      数据驱动用例，47 条断言全部依赖真实相机 RAW 样本（上游经 libcurl
      bootstrap 下载）。本环境 HAVE_CURL=no，全部输出 "File not found,
      skipping." 后以 0 退出，automake 记为 PASS —— 不构成真实断言覆盖。
    result: PASS
  - file: test/Makefile.am
    name: fileio
    description: "IO 单元测试（自包含真实断言）"
    result: PASS
  - file: test/Makefile.am
    name: testoption
    description: "option 解析单元测试（自包含真实断言）"
    result: PASS
  - file: test/Makefile.am
    name: ljpegtest
    description: "Lossless JPEG 解码单元测试（自包含真实断言）"
    result: PASS
  - file: test/Makefile.am
    name: testunpack
    description: "unpack 单元测试（自包含真实断言）"
    result: PASS
  - file: test/Makefile.am
    name: extensions
    description: "RAW 扩展名表单元测试（自包含真实断言）"
    result: PASS
  - file: test/Makefile.am
    name: testbititerator
    description: "bit iterator 单元测试（自包含真实断言）"
    result: PASS

# 实测通过率（R51 步骤 3，实测值非占位符）
upstream_test_summary:
  discovered: 9        # N
  executed: 9          # N′
  passed: 9
  failed: 0
  skipped: 0
  pass_rate: "9/9 (100%)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >-
      dlopen libopenraw_pixbuf.so, dlsym fill_info/fill_vtable, assert format
      name == "Digital camera RAW" with 10 RAW extensions (cr2/dng/...), and
      assert the incremental-load vtable entry points are wired; includes two
      negative controls (missing module path, bogus dlsym symbol)
    command: "./test_openraw_pixbuf_loader"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
