software: libopenraw-pixbuf-loader
display: "libopenraw-pixbuf-loader"
description: "gdk-pixbuf RAW loader module (libopenraw_pixbuf.so) from the libopenraw source tree — adds camera RAW format support to gdk-pixbuf"
category: graphics
homepage: "https://libopenraw.freedesktop.org/"
license: LGPL-3.0-or-later
build_system: custom
ohos_adaptation:
  key_points:
    - "上游无独立 tarball：模块源码在 libopenraw 源码树的 gnome/pixbuf-loader.c，源码取官方 libopenraw 发布包"
    - "整树 autotools 不可用（configure.ac 硬要求 cargo/rustc 构建 lib/mp4，且会重本体）；改为单文件 clang 编译，精确复刻 gnome/Makefile.am 规则"
    - "OHOS 下模块须 binary-sign-tool -selfSign 签名后才能被 gdk-pixbuf dlopen"
    - "模块安装到 lib/gdk-pixbuf-2.0/loaders/（上游 GDK_PIXBUF_DIR）"
  common_dependencies:
    - libopenraw
    - gdk-pixbuf
versions:
  "0.3.7":
    status: built
    build_date: "2026-09-25"
    conan_ref: "libopenraw-pixbuf-loader/0.3.7"
