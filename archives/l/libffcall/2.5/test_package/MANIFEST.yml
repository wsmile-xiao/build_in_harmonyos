# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libffcall/2.5
homepage: "https://www.gnu.org/software/libffcall/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testcases.c
    source: libffcall-2.5/testcases.c
    description: "通用测试用例（avcall/callback 参数传递与返回值断言）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 ffcall_get_version() 验证链接与版本 API"
    command: "./test_libffcall"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
