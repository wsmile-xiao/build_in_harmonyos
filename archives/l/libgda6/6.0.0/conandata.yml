# conandata.yml — libgda6 6.0.0
sources:
  url:
    - "https://download.gnome.org/sources/libgda/6.0/libgda-6.0.0.tar.xz"
    # GNOME official mirror (mirror.nju.edu.cn is in the GNOME mirror
    # list and in the CI pre-download mirror chain); fallback for
    # restricted networks. Same tarball, same sha256.
    - "https://mirror.nju.edu.cn/gnome/sources/libgda/6.0/libgda-6.0.0.tar.xz"
  sha256: "995f4b420e666da5c8bac9faf55e7aedbe3789c525d634720a53be3ccf27a670"
patches:
  - patch_file: "patches/0001-ohos-meson-skip-i18n-tools.patch"
    patch_description: "Skip i18n.gettext and i18n.merge_file (msgfmt/xgettext unavailable on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0004-ohos-binreloc-prefix-option.patch"
    patch_description: "Add ohos_prefix meson option so binreloc bakes the real install prefix (conan installs with --prefix=/ plus DESTDIR)"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-sqlite-direct-link.patch"
    patch_description: "Link sqlite3 API routines directly (conan sqlite3 is static-only, dlopen path cannot work)"
    patch_type: "portability"
