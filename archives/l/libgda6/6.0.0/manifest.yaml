version: "6.0.0"
software: "libgda6"
status: "published"
build_date: "2026-09-24"
build_system: "meson"

source:
  url: "https://download.gnome.org/sources/libgda/6.0/libgda-6.0.0.tar.xz"
  sha256: "995f4b420e666da5c8bac9faf55e7aedbe3789c525d634720a53be3ccf27a670"
  tar_format: "tar.xz"

build:
  system: "meson"
  configure_options:
    - "-Dui=false"
    - "-Dhelp=false"
    - "-Djson=false"
    - "-Dsqlcipher=false"
    - "-Dlibsoup=false"
    - "-Dprefix=<package_folder> (binreloc ohos_prefix, see patch 0004)"
  dependencies:
    - "glib/2.88.3.1"
    - "libxml2/2.15.3.1"
    - "sqlite3/3.53.4"
    - "iso-codes/4.20.1"
  tools:
    - "vala/0.56.19"
    - "intltool/0.51.0"
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-ohos-meson-skip-i18n-tools.patch"
  - "0002-ohos-sqlite-direct-link.patch"
  - "0004-ohos-binreloc-prefix-option.patch"

knowledge_gained:
  - "OHOS bionic posix_spawnp 不做 PATH 搜索，meson 探测 valac 需在 [binaries] 钉绝对路径"
  - "conan valac 运行期前缀丢失（Package 'posix' not found），需 XDG_DATA_DIRS wrapper"
  - "gettext 与 glib 各带 libintl.so.8，soname 冲突；移除 gettext 工具链依赖并 patch 掉 i18n 工具"
  - "glib 2.88 的 gi18n.h 无条件 include libintl.h，需空实现 shim"
  - "conan sqlite3 仅静态库，libgda 运行期 dlopen('libsqlite3') 失败，改为直链 sqlite3 符号（patch 0002）"
  - "conan Meson 助手硬编码 --prefix=/，libgda binreloc 烘焙前缀错误导致 provider 运行期找不到，patch 0004 增加 ohos_prefix 选项"
  - "hnp glib 工具与 conan glib soname 冲突，需在 meson [binaries] 钉 conan glib 工具"
