# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libgda6/6.0.0
homepage: "https://gitlab.gnome.org/GNOME/libgda"

# 上游测试命令: meson 项目, tests/meson.build 注册 13 个 test() 目标
upstream_check_command: "meson test -C <builddir>"

# conanfile.py build() 方法中已集成上游测试 (meson.test())
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试 (tests/meson.build 的 13 个 test() 注册)
upstream_tests:
  - file: raw-ddl-creator.c
    source: libgda-6.0.0/tests/raw-ddl-creator.c
    description: "Raw DDL creator unit test"
    command: "meson test RawDdlCreator"
  - file: ddl-modifiable-sqlite.c
    source: libgda-6.0.0/tests/ddl-modifiable-sqlite.c
    description: "DDL modifiable SQLite data model test"
    command: "meson test DdlModifiableSqlite"
  - file: bin-converter.c
    source: libgda-6.0.0/tests/bin-converter.c
    description: "Binary converter test"
    command: "meson test BinConverter"
  - file: sql-identifier.c
    source: libgda-6.0.0/tests/sql-identifier.c
    description: "SQL identifier handling test"
    command: "meson test SqlIdentifier"
  - file: identifiers-quote.c
    source: libgda-6.0.0/tests/identifiers-quote.c
    description: "Identifier quoting test"
    command: "meson test IdentifiersQuotes"
  - file: sql-builder.c
    source: libgda-6.0.0/tests/sql-builder.c
    description: "SQL builder test"
    command: "meson test SqlBuilder"
  - file: connection-string-split.c
    source: libgda-6.0.0/tests/connection-string-split.c
    description: "Connection string split test"
    command: "meson test ConnectionStringSplit"
  - file: input-parsers.c
    source: libgda-6.0.0/tests/input-parsers.c
    description: "Input parsers test"
    command: "meson test InputParsers"
  - file: quark-list.c
    source: libgda-6.0.0/tests/quark-list.c
    description: "Quark list test"
    command: "meson test QuarkList"
  - file: sql-renderer.c
    source: libgda-6.0.0/tests/sql-renderer.c
    description: "SQL renderer test"
    command: "meson test SqlRenderer"
  - file: data-models/
    source: libgda-6.0.0/tests/data-models/
    description: "Data model tests (check_{dnd,model,pmodel} 等)"
    command: "meson test (data-models 子目录注册 10 项)"
  - file: value-holders/
    source: libgda-6.0.0/tests/value-holders/
    description: "Value holder tests (check_handler_* 等)"
    command: "meson test (value-holders 子目录注册项)"
  - file: db/
    source: libgda-6.0.0/tests/db/
    description: "数据库结构相关测试"
    command: "meson test (db 子目录注册项)"
  - file: meta-store/
    source: libgda-6.0.0/tests/meta-store/
    description: "Meta store 测试"
    command: "meson test (meta-store 子目录注册项)"
  - file: parser/
    source: libgda-6.0.0/tests/parser/
    description: "SQL parser 测试"
    command: "meson test (parser 子目录注册项)"
  - file: providers/
    source: libgda-6.0.0/tests/providers/
    description: "SQLite provider 功能测试 (check_sqlite 等)"
    command: "meson test (providers 子目录注册项)"
  - file: multi-threading/
    source: libgda-6.0.0/tests/multi-threading/
    description: "Multi-threading provider test"
    command: "meson test (multi-threading 子目录注册项)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pkg.c
    description: "调用 gda_init() 并验证内置 SQLite provider 注册 (API 冒烟测试)"
    command: "./test_pkg"
