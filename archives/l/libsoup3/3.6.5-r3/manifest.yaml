# libsoup3 3.6.5-r3 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "3.6.5-r3"

software: libsoup3

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GNOME 源）
  url: "https://download.gnome.org/sources/libsoup/3.6/libsoup-3.6.5.tar.xz"

  # 源码校验和
  sha256: "6891765aac3e949017945c3eaebd8cc8216df772456dc9f460976fbdb7ada234"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dtests=false"
    - "-Dinstalled_tests=false"
    - "-Ddoc_tests=false"
    - "-Dvapi=disabled"
    - "-Dintrospection=disabled"
    - "-Ddocs=disabled"
    - "-Dgssapi=disabled"
    - "-Dntlm=disabled"
    - "-Dbrotli=disabled"
    - "-Dsysprof=disabled"
    - "-Dfuzzing=disabled"
    - "-Dautobahn=disabled"
    - "-Dpkcs11_tests=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0.1.1
    - libpsl/0.21.5.1
    - libnghttp2/1.70.0
    - sqlite3/3.49.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无源码补丁（libsoup 3.6.5 无 OHOS 特有修改）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libsoup3 必须链接共享 glib/2.84.0.1.1（NEEDED 含 libgobject-2.0.so.0）：r2 静态内嵌 gobject 与 gtk4 共享 glib 双副本导致 cannot register existing type 'gchar' SIGABRT（libshumate 16 测试 0/16）"
  - "libsoup meson 探测 gmodule-no-export-2.0/gio-unix-2.0：PkgConfigDeps 只生成 glib-2.0/gobject-2.0/gio-2.0/gmodule-2.0/gthread-2.0.pc，需把 glib 包内 lib/pkgconfig 复制并修 prefix 进 pc-fix 目录"
  - "conan 2.29 移除 meson_layout，必须手动 layout(): folders.build='builddir'、folders.generators='builddir/generators'"
  - "conan 2.29 的 Meson 助手只有 configure/build/install/test，无 compile()，build() 用 meson.build()"
  - "CMakeDeps 命名坑：pkg_config_name 只影响 PkgConfigDeps，须显式 set_property('cmake_file_name','libsoup-3.0')+('cmake_target_name','libsoup-3.0')"
  - "工具链坑：AR=llvm-ar 等环境变量是坏的（PATH 无 llvm-ar），generate() 里 os.environ.pop + shutil.which 定位真实工具"
