# conandata.yml — libsoup3 3.6.5-r3
# 官方 GNOME 源为首选（任务固定上游 URL），NJU 镜像为 CI 网络受限时的兜底；
# 不包含 file://、缓存路径或执行端绝对路径。

sources:
  url:
    - "https://download.gnome.org/sources/libsoup/3.6/libsoup-3.6.5.tar.xz"
    - "https://mirror.nju.edu.cn/gnome/sources/libsoup/3.6/libsoup-3.6.5.tar.xz"
  sha256: "6891765aac3e949017945c3eaebd8cc8216df772456dc9f460976fbdb7ada234"

patches:
  "3.6.5-r3":
    - patch_file: "patches/0001-hsts-g_uri_get_port-null-guard.patch"
      description: >
        R11 hsts/hsts-db 测试迁移补丁：上游 tests/hsts-test.c 与 tests/hsts-db-test.c
        的 rewrite_message_uri() 对 g_uri_get_port(https_uri) 无条件调用，OHOS 无
        glib-networking（GDummyTlsBackend supports_tls=0）时 tls_available=FALSE、
        https_uri 保持 NULL，glib 2.84 断言 'uri != NULL' → SIGTRAP exit 133。
        按 glib 2.84 语义调用前判空守卫（不得传入 NULL），保持测试语义不变；
        补丁后 -Dtests=true 实跑 28 项，SIGTRAP 消除（详见 notes.md 与 reports/）。
