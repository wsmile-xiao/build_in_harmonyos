# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# libsoup3 3.6.5 上游测试基于 meson（libsoup/tests），build() 中 tests 选项
# 默认禁用（CI 门禁跑 test_package L1）；上游测试在本机 build 目录以
# -Dtests=true 单独配置实测，结果记录于 ../notes.md 与 ../reports/test-report.md
# （R11 补丁后 33 项注册：28 OK / 3 FAIL / 2 SKIP，28/33=84.8%；hsts 28 项
# 判空守卫后不再 SIGTRAP，纯逻辑项通过，https 依赖项因无 GIO TLS 后端阻塞）。

package: libsoup3/3.6.5-r3
homepage: https://gitlab.gnome.org/GNOME/libsoup

# 上游测试命令（tests 选项已在 conanfile.py generate() 中禁用，需另行配置）
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 中未集成上游测试
upstream_test_in_build: false
upstream_test_command: "meson test"

# 代表性上游测试（完整列表见 notes.md）
upstream_tests:
  - file: libsoup/tests/soup-uri.c
    source: libsoup-3.6.5.tar.xz/libsoup/tests/soup-uri.c
    description: "libsoup3 SoupURI 解析/序列化测试"
    command: "meson test soup-uri"
  - file: libsoup/tests/session.c
    source: libsoup-3.6.5.tar.xz/libsoup/tests/session.c
    description: "libsoup3 SoupSession 基础行为测试"
    command: "meson test session"

# test_package 自带测试（消费者视角，真实 API）
test_package_tests:
  - file: test.c
    description: "libsoup3 真实 API 冒烟：soup_message_new + soup_session_new + GUri host 解析 (libsoup3 已移除 libsoup2 的 SoupURI/soup_uri_new)"
    command: "./test_libsoup3"

# 断言数：host 匹配断言 + session 非空断言 + unref 不崩溃
assertion_count: 3
