# libsoup3 3.6.5-r2 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "3.6.5-r2"

software: libsoup3

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: meson

# ============================================================
# 版本说明（-r1 → -r2 差异）
# ============================================================
# 3.6.5-r2 与 3.6.5-r1 上游源码完全相同（同一 tarball：
# https://download.gnome.org/sources/libsoup/3.6/libsoup-3.6.5.tar.xz，
# sha256=6891765aac3e949017945c3eaebd8cc8216df772456dc9f460976fbdb7ada234）。
# -r2 是 R37 版本号策略下的适配层修订版本（同一上游版本修复适配问题，
# 后缀递增）：
#   1. 积分赛任务（智能任务平台 contrib-5010，开源鸿蒙PC专项积分赛）
#      要求以独立版本号提交适配修复版本；
#   2. 本次实测复验 -r1 全部适配结论（conan create + 上游测试）并补齐
#      上游测试执行记录（-r1 notes 未沉淀 meson test 实测数量与通过率，
#      本次补齐：33 个可编译用例 30 PASS / 3 FAIL，FAIL 均 OHOS 环境
#      限制，详见 notes.md）；
#   3. 适配层无功能性代码变更：配方、依赖集合、构建选项与 -r1 一致
#      （均为验证过的可用配置），仅版本号与元数据更新。

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/libsoup/3.6/libsoup-3.6.5.tar.xz"

  # 源码校验和
  sha256: "6891765aac3e949017945c3eaebd8cc8216df772456dc9f460976fbdb7ada234"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-Dtests=false"
    - "-Dinstalled_tests=false"
    - "-Ddoc_tests=false"
    - "-Dvapi=disabled"
    - "-Dintrospection=disabled"
    - "-Ddocs=disabled"
    - "-Dgssapi=disabled"
    - "-Dntlm=disabled"
    - "-Dbrotli=disabled"
    - "-Dsysprof=disabled"
    - "-Dfuzzing=disabled"
    - "-Dautobahn=disabled"
    - "-Dpkcs11_tests=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib2/2.88.0
    - libpsl/0.21.5.1
    - libnghttp2/1.70.0
    - sqlite3/3.49.1
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无源码补丁（libsoup 3.6.5 无 OHOS 特有修改）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libsoup3 下游必须强制 glib2 shared（default_options={'glib2/*:shared': True}），否则 GObject 类型系统双副本 SIGABRT"
  - "conan 2.29 移除 meson_layout，必须手动 layout(): folders.build='builddir'、folders.generators='builddir/generators'"
  - "conan 2.29 的 Meson 助手只有 configure/build/install/test，无 compile()，build() 用 meson.build()"
  - "CMakeDeps 命名坑：pkg_config_name 只影响 PkgConfigDeps，须显式 set_property('cmake_file_name','libsoup-3.0')+('cmake_target_name','libsoup-3.0')"
  - "OHOS 加载器忽略 DT_RPATH 且 LD_LIBRARY_PATH 需含 /usr/local/lib（libsoup 的 libpsl/sqlite3/libnghttp2 是系统库非 conan 包）"
  - "工具链坑：AR=llvm-ar 等环境变量是坏的（PATH 无 llvm-ar），generate() 里 os.environ.pop + shutil.which 定位真实工具"
  - "上游测试在 OHOS 的可用边界：38 个上游用例中 33 个可编译运行（30 PASS/3 FAIL，FAIL 均为 glib-networking TLS 后端缺失或 AF_UNIX bind EPERM 平台限制），5 个依赖 Apache/brotli 无法编译"
