software: libsoup3
display: "libsoup3"
description: "HTTP client/server library for GNOME (libsoup 3.x)"
category: network
homepage: "https://gitlab.gnome.org/GNOME/libsoup"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "conan 2.29 无 meson_layout：手动 layout() folders.build='builddir'、folders.generators='builddir/generators'"
    - "下游必须强制 glib2/*:shared=True（GObject 类型系统双副本 SIGABRT），共享 glib2 重建约 20-40 分钟"
    - "禁止 strip 共享库与禁止 meson install 清理 DT_RUNPATH（OHOS loader 校验 .codesign 哈希）"
    - "运行时需 LD_LIBRARY_PATH 含 /usr/local/lib（libpsl/sqlite3/libnghttp2 系统库）"
  common_dependencies:
    - glib2/2.88.0
    - libpsl/0.21.5.1
    - libnghttp2/1.70.0
    - sqlite3/3.49.1

versions:
  "3.6.5-r1":
    packaging: conan
    status: built
    build_date: "2026-08-15"
    notes: >-
      首个真实 conan 配方（原归档是模板占位符：meson_layout 已移除、requirements 空）。
      meson 构建，PkgConfigDeps + 手动 layout；glib2 强制 shared + zlib/1.3.1.1（PIC）override；
      工具链 AR/AS/STRIP/NM/RANLIB 环境变量修复；package_info 显式 cmake_file_name/cmake_target_name
      = libsoup-3.0。上游 38 测试中 33 个可编译实机运行 30 PASS / 3 FAIL（TLS 后端缺失 ×2、
      AF_UNIX bind EPERM ×1，均 OHOS 平台限制）。已在制品仓发布（revision
      4e1dd2af1214a9943a87a13ab70dce56），CI 构建 #28966 通过。
  "3.6.5-r2":
    packaging: conan
    status: built
    build_date: "2026-09-02"
    notes: >-
      适配修订版本（R37 后缀递增），完整复制自 3.6.5-r1。上游源码完全相同（同一
      libsoup-3.6.5.tar.xz，sha256=6891765aac3e949017945c3eaebd8cc8216df772456dc9f460976fbdb7ada234），
      -r1 → -r2 差异仅在适配层：版本号更新 + 元数据重写 + 补齐上游测试实测记录
      （33 可编译用例 30 PASS / 3 FAIL，通过率 90.9%，FAIL 均 OHOS 平台限制；
      5 个豁免用例有 meson 条件分支论证）。配方/依赖集合/构建选项沿用 -r1
      验证配置，无功能性变更。积分赛任务 contrib-5010。
