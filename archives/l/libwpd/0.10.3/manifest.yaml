# 版本级 manifest —— libwpd 0.10.3
# 遵循 ARCHIVE-SPEC v2.0

version: "0.10.3"
software: libwpd

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-14"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/libwpd/libwpd/libwpd-0.10.3/libwpd-0.10.3.tar.xz"
  sha256: "2465b0b662fdc5d4e3bebcdc9a79027713fb629ca2bff04a3c9251fdec42dd09"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=arm-unknown-linux-gnu --host=aarch64-unknown-linux-gnu（本 dist 的 config.sub 是 2012-02-10 版：认 aarch64 但**不认 musl**，故 aarch64-…-musl 被拒；四段名带 unknown 厂商可原样通过，且保持 build≠host 交叉模式）"
    - "--prefix=/（配合 DESTDIR 使 include/ 与 lib/ 直落包根）"
    - "--enable-static --disable-shared（R26 系统同名库默认静态）"
    - "--disable-dependency-tracking"
    - "REVENGE_CFLAGS / REVENGE_LIBS / REVENGE_GENERATORS_CFLAGS / REVENGE_GENERATORS_LIBS / REVENGE_STREAM_CFLAGS / REVENGE_STREAM_LIBS：上游三处 PKG_CHECK_MODULES（librevenge + 工具所需的 generators/stream），设备无 pkg-config，故显式导出这些变量（PKG_CHECK_MODULES 在变量非空时短路）"
    - "依赖库以「只含 .a 的干净 -L 目录」引用：librevenge 包内的 .la 记录了它自己的安装前缀（//lib），直接 -L 到包目录会触发 libtool 的 'library was moved / cannot find the library //lib/librevenge-0.0.la'"
    - "BOOST_CFLAGS + CPPFLAGS 注入 boost 头路径：libwpd 的 src/lib/libwpd_internal.cpp 使用 boost/spirit，configure.ac 以 CPPFLAGS=\"${BOOST_CFLAGS} ${CPPFLAGS}\" 做头检查，缺失即 AC_MSG_ERROR"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash（autoconf 2.69 的 exec 7<&0 需要；automake 的 all-recursive 也需要 POSIX 词分割）"
    - "configure 的 umask 077→022 改写（hmdfs 按组判通行）；autotools 辅助脚本统一 chmod +x（E490）；TMPDIR 指向构建目录内 .tmp"
    - "CC/CXX 从 profile 的 tools.build:compiler_executables 显式导出（conan 的 toolchain env 脚本不会被裸 subprocess source）"
  dependencies:
    - librevenge/0.0.5
    - zlib/1.3.1
    - boost/1.90.0.3（tool_requires：仅 libwpd 自身的 TU 需要 boost 头，公共头与链接接口都不含 boost）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libtool 的 .la 文件记录了自己的安装前缀，跨包复用时必然失配：librevenge 用 --prefix=/ + DESTDIR 打包，其 .la 里 libdir='//lib'，libwpd 链接时 libtool 报 'library .../librevenge-0.0.la was moved' 继而 'cannot find the library //lib/librevenge-0.0.la'。把 -L 指向一个**只放 .a、不放 .la** 的目录即可让 libtool 走普通 -L/-l 路径；直接给 .a 绝对路径虽能绕过 .la，却会被 libtool 当作输入成员嵌进产物（'archive member ... is neither ET_REL nor LLVM bitcode'），与消费者另链的同一库冲突"
  - "上游用私有头文件依赖时不要写成 requires：libwpd 的 src/lib/libwpd_internal.cpp 需要 boost/spirit，但公共头与链接接口都不含 boost；此时应 tool_requires（构建期上下文），否则 conan 的 package_info 校验会直接报 'The direct dependency X is not used by any cpp_info.components.requires'"
  - "PKG_CHECK_MODULES 的检查在对应 <PREFIX>_CFLAGS 非空时短路、根本不调用 pkg-config：设备无 pkg-config 时这是唯一通路，且三处检查（librevenge / librevenge-generators / librevenge-stream）需要分别导出各自的变量对，只设其中一组不够"
  - "libwpd 的公开符号都在 libwpd 命名空间内（libwpd::WPDocument、libwpd::WPD_CONFIDENCE_EXCELLENT 等）：消费者测试必须加限定名，否则 clang 会给出 'use of undeclared identifier ... did you mean libwpd::...' 的一整片报错"
  - "上游不提供样例文档时，格式识别仍可做**正向**断言：手工构造合法 WPX 头（offset 1 起 'WPC'、offset 8 产品类型、offset 9 文件类型 0x0a、offset 10 主版本 0x00/0x02）即可让 WPDocument::isFileFormatSupported 返回 WPD_CONFIDENCE_EXCELLENT，比只测负例有价值得多"
  - "对上游未规定的行为不要写死断言：wpd2text 处理「合法头 + 零字节体」时输出 1 字节文本是合理实现选择，断言'必须无输出'会误判；CLI 测试只应断言契约（非零码/不崩溃/不产出内容不可控）并把实测值记入日志"
