# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libwpd/0.10.3
homepage: "https://libwpd.sourceforge.net/"

# 上游**没有**测试套件：顶层与各 src/ 子目录的 Makefile.am 均无 TESTS /
# check_PROGRAMS 声明，tarball 内无 src/test 目录、无 *test* 命名源文件
# （src/ 下只有 lib、conv、fuzz 三个子目录），也不分发任何 WordPerfect 样例文档。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libwpd.cpp
    description: >-
      消费者功能测试（库级）：自实现一个最小 librevenge::RVNGInputStream
      （同时也验证"消费者可把自己的流类型喂给 libwpd"），对 WPDocument 的公开
      入口做真实调用——格式识别 isFileFormatSupported 的负例（null/空流/纯文本/
      WPC 魔数但未知文件类型/未知主版本）与**正例**（手工构造的合法 WPX 头：
      offset 1 起 "WPC"、offset 9 文件类型 0x0a、offset 10 主版本 0x00(WP5)/0x02(WP6+)
      必须返回 WPD_CONFIDENCE_EXCELLENT）、以及非 WordPerfect 输入下 parse 与
      verifyPassword 的失败契约（分别不得返回 WPD_OK / WPD_PASSWORD_MATCH_OK）。
      共 9 项断言，失败即非零退出。
    command: "./test_libwpd"
  - file: test_package/test_libwpd_cli.sh
    description: >-
      消费者功能测试（CLI 级）：对包内安装的 wpd2text 真实调用——不存在的输入
      文件必须以非零码失败；纯文本（非 WordPerfect 文档）必须被非零码拒绝；
      仅含结构性合法 WPX 头（后接零字节）的输入则只要求**不崩溃、不以信号终止**
      （上游对这类内容的行为未作规定，故只记录实际退出码与输出字节数，不作断言）。
      据此证明转换工具链接成功、librevenge 生成器依赖解析正确、错误路径干净。
      共 5 项断言。
    command: "sh test_libwpd_cli.sh <pkg>/bin/wpd2text"

# 说明：上游不分发 WordPerfect 样例文档，故"正例解析整篇文档"无法在本测试中完成——
# 格式识别侧已用程序化构造的合法头部做了正向断言，工具侧则验证了干净失败契约。
# 测试断言总数（近似值，用于质量评估）：库级 9 项 + CLI 级 5 项
assertion_count: 14
