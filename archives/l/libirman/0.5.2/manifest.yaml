# 版本级 manifest — archives/l/libirman/0.5.2/manifest.yaml

version: "0.5.2"
software: libirman
status: built
build_date: "2026-09-18"
build_system: autotools
conan_ref: "libirman/0.5.2"

source:
  url: "https://deb.debian.org/debian/pool/main/libi/libirman/libirman_0.5.2.orig.tar.gz"
  sha256: "3608506e03ad4668be9bce67d983ad9d3ddcc8d301ebcdd3168d3acd786b1df8"
  tar_format: tar.gz

build:
  system: autotools
  build_command: "./configure --build=aarch64-unknown-linux-ohos --host=aarch64-unknown-linux-ohos --with-plugin=no --enable-swtest && make -j1"
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--with-plugin=no"
    - "--disable-rpath"
    - "--enable-swtest"
  dependencies: []
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "upstream test_name_sw/test_func_sw with the --enable-swtest stdin software backend"
  upstream_discovered: 2
  upstream_passed: 2
  upstream_failed: 0
  upstream_note: "the Irman hardware is discontinued and no serial receiver exists in the sandbox; --enable-swtest replaces the low-level I/O (irfunc.c #ifdef IR_SOFTWARE_TEST) and the two programs decode the same fixed code from stdin"
  test_package_passed: 18
  test_package_failed: 0
  test_package_assertions: 18
  execution: "conan create rc=0 + 上游软件后端 2/2 + 消费者断言 18 条"

test_passed: 18
test_failed: 0

patches_applied: []

knowledge_gained:
  - "tarball 自带 configure（autoconf 2.69）与 Makefile.in：不需要 autoreconf/aclocal/automake，也就完全避开了 automake 包 perl shebang 指向 /data/service/hnp/bin/perl 的坑（见 archives/l/libhbaapi）"
  - "E011：预生成的 configure 同样含 `umask 077 && mktemp -d`，HMDFS setgid 下 config.status 无法使用自己的临时目录（could not setup config files machinery）→ 就地放开为 022（icoutils 先例）"
  - "E007：config.guess 不能在 HMDFS 建临时文件且不认识 HarmonyOS → 显式 --build/--host"
  - "上游 --enable-swtest 用 stdin 软件后端替换底层串口 I/O（irfunc.c #ifdef IR_SOFTWARE_TEST，提示 'please enter 12 hex digits'）：无需 IR 硬件即可端到端验证 rc 文件→哈希表→解码链路，是设备上最有价值的确定性上游证据"
  - "configure 的 AC_PROG_LIBTOOL/AM_CONFIG_HEADER 是过时宏，但只要不跑 autoreconf 就只是 configure 内部的历史代码，无影响"
  - "LIRC 插件在无 lirc-driver 时自动关闭，但仍需显式 --with-plugin=no 以确保确定性"
