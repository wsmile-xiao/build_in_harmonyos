# test_package/MANIFEST.yml
# libirman 0.5.2.
#
# Upstream ships no unit-test framework.  It ships three interactive tools
# (test_io, test_func, test_name) plus, with --enable-swtest, hardware-free
# variants whose low-level serial I/O is replaced by a stdin driven software
# backend (irfunc.c, #ifdef IR_SOFTWARE_TEST).  The recipe builds with
# --enable-swtest and runs test_name_sw/test_func_sw from build() as upstream
# evidence; consumer coverage over the installed package is provided by a CMake
# program that exercises the rc-file parser, the code <-> text conversion, the
# command registry and the error strings.

package: libirman/0.5.2
homepage: https://sourceforge.net/projects/libirman/

upstream_tests_exist: true
upstream_test_audit: "no tests/ directory and no make check; test_io/test_func/test_name are interactive tools, and --enable-swtest builds libirman_sw plus test_name_sw/test_func_sw whose ir_read_code() reads 12 hex digits from stdin instead of the serial port"
upstream_check_command: "n/a (no make check)"
upstream_test_in_build: true
upstream_test_command: "printf '010203040506\\n' | HOME=<tmp-with-.irmanrc> ./test_name_sw /dev/null; printf '010203040506\\n' | HOME=<tmp> ./test_func_sw /dev/null"

upstream_tests:
  - name: test_name_sw
    command: "test_name_sw /dev/null (stdin: 010203040506)"
    expected: "pass; prints rx `POWER' for the binding in the generated rc file"
  - name: test_func_sw
    command: "test_func_sw /dev/null (stdin: 010203040506)"
    expected: "pass; prints rx `010203040506' from the decoded 6 byte code"

test_package_tests:
  - file: test_irman.c
    description: "rc-file parsing (bind/alias), ir_valid_code, ir_text_to_code/ir_code_to_text round trip, ir_name_to_text/ir_text_to_name, command registry (register/duplicate/bad number/remove), ir_default_portname, error strings, IR_EDISABLED guards"
    command: "./libirman_consumer"

test_files:
  - path: "test_package/test_irman.c"
    test_type: "R34"
    assertion_count: 24

test_package_test_count: 1
consumer_assertion_count: 24
assertion_count: 24
