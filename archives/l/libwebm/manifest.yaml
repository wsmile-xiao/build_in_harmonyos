software: libwebm
display: "libwebm"
description: "WebM container muxer/parser library by the WebM project"
category: multimedia
homepage: "https://github.com/webmproject/libwebm"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Build the webm shared library (mkvmuxer + mkvparser + common + webm_parser) with CMake"
    - "Provide DT_SONAME via toolchain flags since upstream sets no SOVERSION (E330/E383)"
    - "Compile the googletest-based upstream tests in a separate static tree with a pinned googletest"
  common_dependencies: []

