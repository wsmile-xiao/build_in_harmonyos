sources:
  url: "https://download.netsurf-browser.org/libs/releases/libdom-0.4.2-src.tar.gz"
  sha256: "d05e45af16547014c2b0a3aecf3670fa13d419f505b3f5fc7ac8a1491fc30f3c"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "Replace NetSurf NSSHARED build system with a standalone Makefile (remove -Werror for clang 15 compatibility; build hubbub + libxml2 bindings into libdom.a)"
    patch_type: "portability"
  - patch_file: "patches/0002-libxml-xmlparser-guard.patch"
    patch_description: "Guard xml_parser_start_element_ns against unlinked parent nodes: when libxml2 expands an internal entity (DOCTYPE internal subset) it synthesises startElementNs callbacks whose parent lives in the transient entity tree (_private == NULL), which used to crash dom_node_append_child(NULL,...) in xml_parser_add_text_node/add_element_node. Skip DOM mirroring when parent->_private == NULL (fixes 233 AFL SVG crashes in libsvgtiny 0.1.8 regression suite)."
    patch_type: "bugfix"
