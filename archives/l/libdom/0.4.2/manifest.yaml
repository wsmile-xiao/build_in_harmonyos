knowledge_gained:
  - "NetSurf 组件库（libparserutils/libwapcaplet/libhubbub/libdom）均需 standalone Makefile 替换 NSSHARED"
  - "libdom XML binding 无 expat 时用 libxml2（WITH_LIBXML_BINDING），libsvgtiny 依赖的 dom_xml_parser_* API 由 libxml_xmlparser.c 提供"
  - "libdom 的 dom_node_append_child 等 API 要求 result 参数非 NULL（NULL 会段错误）"
  - "libdom XML binding 崩溃修复：libxml2 解析含 DOCTYPE 内部实体子集的 SVG 时展开实体内容，触发 startElementNs 回调时父节点位于瞬态实体树（_private==NULL），传 NULL 进 dom_node_append_child 崩溃（node.h 附近）；在 xml_parser_start_element_ns 守卫 parent->_private==NULL 跳过 DOM 镜像即修复（0002 补丁，libsvgtiny 0.1.8 AFL 233 崩溃用例清零）"
