software: libpciaccess
display: "libpciaccess"
description: "Generic PCI access library"
category: system
homepage: "https://gitlab.freedesktop.org/xorg/lib/libpciaccess"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "Treats HarmonyOS as Linux for the Meson sysfs backend source selection"
    - "Uses the published zlib/1.3.1 Conan dependency"
    - "Runs the complete upstream Meson test command and one consumer test"
  common_dependencies:
    - zlib

versions:
  "0.17":
    status: archived
    build_date: "2026-04-27"
  "0.19":
    status: built
    build_date: "2026-09-09"
    conan_ref: "libpciaccess/0.19"
