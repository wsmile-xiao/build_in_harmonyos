version: "0.17"
status: built
build_date: "2026-04-27"

source:
  url: "https://xorg.freedesktop.org/releases/individual/lib/libpciaccess-0.17.tar.gz"
  tar_format: tar.gz

build:
  system: meson
  configure_options: []
  dependencies: []

products:
  - lib/libpciaccess.so.0.11.1
  - bin/scanpci
  - include/pciaccess.h

packaging:
  release: libpciaccess-0.17-ohos-aarch64.tar.gz
  debug: libpciaccess-0.17-ohos-aarch64-debug.tar.gz

notes:
  - libpciaccess 在鸿蒙上无需源码补丁即可编译
  - 使用 meson 构建系统，prefix 设为 ~/usr/local
  - scanpci 工具需要修复 RPATH ($ORIGIN/../lib)
  - ELF 签名工具暂不可用，需用户自行处理
