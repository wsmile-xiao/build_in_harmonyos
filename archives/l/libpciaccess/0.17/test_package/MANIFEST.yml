# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libpciaccess/0.17
homepage: "https://gitlab.freedesktop.org/xorg/lib/libpciaccess"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test -C build --print-errorlogs"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"

# Census of the official 0.17 tarball (libpciaccess-0.17.tar.xz):
# - test-like directories: 0
# - Meson test() registrations across meson.build files: 0
# - observed command output: "No tests defined."
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.c"
    description: "Consumer validates pci_get_strings (zlib-backed pci.ids lookup); when PCI sysfs access is available it also initializes, iterates devices and cleans up"
    command: "./test_libpciaccess"
  - file: "harmonyos_platform.c"
    description: "HarmonyOS-specific consumer test validates wildcard lookup and the platform PCI access error contract"
    command: "./test_libpciaccess_harmonyos"

# test.c: pci_get_strings, accepted init result contract, non-NULL iterator.
# harmonyos_platform.c: wildcard lookup and HarmonyOS restricted-access contract.
assertion_count: 6
harmonyos_specific_tests: 1
