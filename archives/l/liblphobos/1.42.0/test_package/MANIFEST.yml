package: liblphobos/1.42.0
upstream_test_in_build: true
upstream_tests:
  - entry: "runtime/phobos/Makefile 的 unittest 目标（posix.mak 已废弃并转发；官方逐模块形态：DMD -unittest -version=StdUnittest -main -run <module>.d）"
    ohos_execution: "用 ldc 包的 ldc2 复刻官方逐模块命令，全量 176 模块逐个执行（详见 notes.md 上游测试节与 .workbuddy/tmp/liblphobos-1.42.0/ 日志，日志不入库）"
test_package_tests:
  - file: test_liblphobos.sh
    description: >-
      R34 反空壳 + 鸿蒙消费者用例（本任务要求的新增用例）：真实编译并实际运行一个
      链接 liblphobos 共享库的 D 程序。① ldc2 --version；② ldc2 -conf= 完全脱离
      编译器默认配置，import 与库全部指向 liblphobos 包
      （-I<pkg>/include/d -L-L<pkg>/lib -defaultlib=phobos2-ldc-shared,druntime-ldc-shared），
      即对**本包交付物**的真实消费而非 ldc 包自带静态库；③ 产物 OHOS 代码签名
      （不签名 exec 报 Permission denied/rc=126）；④ 实际运行并 7 项逐行断言
      （排序/map/格式化/转换/JSON/字符串/时钟，覆盖 std.algorithm/std.range/
      std.format/std.conv/std.json/std.string/std.datetime）；⑤ 确认运行时经
      LD_LIBRARY_PATH 实际加载本包 libphobos2-ldc-shared.so.112。
      测试驱动为 shell 脚本（test_package/ 下须有 .sh/.c/.cpp/.py 类测试源文件，
      D 源码 hello_phobos.d 不在 CI 静态门禁识别范围内），由 conanfile.py 的
      test() 经 self.run 调用。
    command: "sh test_liblphobos.sh <ldc_pkg>/bin/ldc2 <liblphobos_pkg> test_package/"
assertion_count: 7
# 上游测试说明：Phobos 的 unittest 需要先有可用的 D 编译器与构建好的运行时
# （"自举后"验证），不随 tarball 提供 make check 形态的可执行入口；本 test_package
# 覆盖"共享库可用 + 消费者可编译可运行"链路。上游 unittest 全量实测见 notes.md。
upstream_test_note: >-
  上游测试入口为 runtime/phobos/Makefile 的 unittest 目标（test_runner 批量编译 +
  逐模块运行）；本包构建产物 + ldc 工具包就绪后已实测执行，结果与逐模块日志见 notes.md。
