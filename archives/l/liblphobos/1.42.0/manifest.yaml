software: liblphobos
version: "1.42.0"
build_date: "2026-09-17"
build_system: cmake
status: built
source:
  url: "https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc-1.42.0-src.tar.gz"
  sha256: "9bb0f628f869f7fc7b53c381a79742d29c17552c6f1a56b0a02aa289e65a0e3b"
# 本包 = LDC 1.42.0 发行源码中的 D 语言运行时库（runtime/phobos + runtime/druntime）：
# Phobos 标准库 libphobos2-ldc-shared.so.112 + 伴生运行时 druntime
# libdruntime-ldc-shared.so.112（DMD 前端 2.112.1）。与 ldc/1.42.0 工具包
# （bin/ldc2 等，包内 lib/ 仅静态库）互补，共享库内容零重叠。
dependencies:
  - ldc/1.42.0   # tool_requires：D 编译器（构建期，2026-09-17 已发布 ohpcd）
knowledge_gained:
  - "★ D 语言运行时的独立库包构建路径：上游 ldc-build-runtime 工具在 OHOS 动态链接不可运行（缺 libgcc_s.so.1/_Unwind_*，ldc 任务实测），本配方复刻其 runCMake() 官方参数直接驱动 runtime/CMakeLists.txt（cmake -S runtime -DLDC_EXE_FULL=... -DDMDFE_MINOR_VERSION=112 -DDMDFE_PATCH_VERSION=1 -DTARGET_SYSTEM=\"Linux;UNIX;musl\" -DBUILD_SHARED_LIBS=ON）——绕开工具可执行文件但完整保留上游官方构建文件与参数（ref: archives/l/ldc/1.42.0/notes.md）"
  - "★ ldc2 与 DMD 方言差异两处：DMD 的 -version=X 在 ldc2 报 'does not allow a value'（LDC 语法为 -d-version=X，与上游 runtime CMake 的 PHOBOS2_EXTRA_UNITTEST_FLAGS 一致）；官方基础 DFLAGS（-w -de -preview=dip1000 -preview=dtorfields -preview=fieldwise）不可省——缺 dip1000 时 std/algorithm 等模块 @safe 借用检查直接编译失败（ref: archives/l/ldc/1.42.0/notes.md）"
  - "★ 共享库版 druntime 的 glibc 符号残留：core/internal/elf/dl 引用 program_invocation_name（glibc 特有，musl 无）。静态库场景该成员不被拉入故 ldc 包无恙；共享库则整体打入 dl.o，未定义符号致消费者链接必报 --no-allow-shlib-undefined。处置：pthread_cancel_shim.c 编为 PIC 对象经 runtime CMake 的 LD_FLAGS 链进 .so（program_invocation(_short)_name 空串定义，与 ldc 引导期适配同构）（ref: E085, archives/l/ldc/1.42.0/shim/pthread_cancel_shim.c）"
  - "ldc 包（application 工具包）lib/ 仅静态库（libphobos2-ldc.a 等），本包交付共享库（BUILD_SHARED_LIBS=ON 上游自动产出 release+debug 两套 .so 三段 SONAME），二者互补零冲突；软链须实体化交付（OHOS musl 不加载 SONAME 为软链的库）（ref: E316, E492, E505）"
  - "ldc2 spawn C 编译器驱动时 stdout/stderr 接无人消费的管道致链接诊断写失败（status 1）；设备无 cc。test_package/上游测试一律 --gcc=clang_passthrough（重定向 fd 后 execv 真 clang++，ldc 包先例）（ref: archives/l/ldc/1.42.0/notes.md）"
  - "OHOS 不投递 SIGRTMIN(35)（druntime GC thread_suspendAll 死锁）与 musl 缺 pthread cancellation 家族——继承 ldc/1.42.0 的 0001-ohos-thread-gc-signals.patch（本包构建同一 druntime 源码，补丁必须同套用）（ref: E085, archives/l/ldc/1.42.0/patches/0001-ohos-thread-gc-signals.patch）"
