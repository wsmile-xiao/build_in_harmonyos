sources:
  # 官方 GitHub release URL（R39：conandata.yml 只写官方原始 URL；镜像 fallback
  # 由 CI 的 get_mirrors 机制自动生成，不手写镜像前缀、不指向个人仓库）。
  url: "https://github.com/ldc-developers/ldc/releases/download/v1.42.0/ldc-1.42.0-src.tar.gz"
  sha256: "9bb0f628f869f7fc7b53c381a79742d29c17552c6f1a56b0a02aa289e65a0e3b"

# 本包 = LDC 1.42.0 的 D 语言运行时库（Phobos 标准库 + druntime），源码宿主即
# LDC 发行源码包（runtime/phobos + runtime/druntime 子树）。sha256 与上游
# ldc-developers 发布的 ldc-1.42.0-src.tar.gz 一致（已实测比对）。
#
# 构建方式：直接驱动上游 runtime/CMakeLists.txt（cmake -S runtime），参数逐项
# 复刻上游 runtime/ldc-build-runtime.d.in 的 runCMake()（LDC_EXE_FULL /
# LDMD_EXE_FULL / DMDFE_MINOR_VERSION=112 / DMDFE_PATCH_VERSION=1）。
# 为什么不直接调用上游 ldc-build-runtime 工具：该工具为动态链接，在 OHOS 上
# 缺 libgcc_s.so.1/_Unwind_* 无法运行（ldc/1.42.0 配方实测，见其 manifest.yaml
# knowledge_gained）——绕开工具可执行文件，但完整保留上游官方构建文件与参数。
#
# TARGET_SYSTEM 显式给 Linux;UNIX;musl（OHOS libc 为 musl 变体），绕开
# uname=HarmonyOS 导致的 AUTO 探测不确定性；BUILD_SHARED_LIBS=ON 交付共享库
# （libphobos2-ldc-shared.so.112 / libdruntime-ldc-shared.so.112，与上游发行版
# 打包形态一致）。
patches:
  - patch_file: "patches/0001-ohos-thread-gc-signals.patch"
    patch_description: >-
      OHOS 线程层两处适配（作用于 runtime/druntime——Phobos 的伴生运行时，同包构建）：
      ① SIGRTMIN(35) 无法送达信号处理函数（实测自投递与跨线程投递均不触发，
      SIGRTMIN+1=36 与 SIGUSR1/2 正常），druntime 的 GC thread_suspendAll() 会
      永久阻塞；改用 SIGUSR1/SIGUSR2（同上游 OpenBSD 分支既有做法）。
      ② OHOS musl 不提供 pthread cancellation 家族
      (pthread_setcancelstate/setcanceltype/testcancel/cancel)，druntime
      core.thread.osthread 引用导致链接失败；补 no-op 回退实现。
    patch_type: "portability"
