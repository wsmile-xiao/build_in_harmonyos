# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libspeexdsp/1.2.1
homepage: "https://speex.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 autotools 无 TESTS 注册（make check 无目标），5 个测试程序为
# noinst_PROGRAMS 示例（BUILD_EXAMPLES 默认开）——由上游测试铁律本地
# 编译实测并留证据（见 notes.md 测试台账），test_package 只做消费者验证。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（libspeexdsp/Makefile.am BUILD_EXAMPLES 块）
upstream_tests:
  - file: "libspeexdsp/testdenoise.c"
    source: speexdsp-1.2.1.tar.gz/libspeexdsp/testdenoise.c
    description: "Preprocessor denoise/AGC/dereverb example program (stdin PCM loop)"
    command: "./testdenoise < /dev/null"
  - file: "libspeexdsp/testecho.c"
    source: speexdsp-1.2.1.tar.gz/libspeexdsp/testecho.c
    description: "Acoustic echo canceller (AEC/MDF) example program (3-arg file based)"
    command: "./testecho ref.sw mic.sw out.sw"
  - file: "libspeexdsp/testjitter.c"
    source: speexdsp-1.2.1.tar.gz/libspeexdsp/testjitter.c
    description: "Jitter buffer self-contained test (fill/frozen-sender resync asserts)"
    command: "./testjitter"
  - file: "libspeexdsp/testresample.c"
    source: speexdsp-1.2.1.tar.gz/libspeexdsp/testresample.c
    description: "Resampler example program (stdin PCM, multiple rate switches)"
    command: "./testresample < /dev/null"
  - file: "libspeexdsp/testresample2.c"
    source: speexdsp-1.2.1.tar.gz/libspeexdsp/testresample2.c
    description: "Resampler2 float-path example program (self-contained sine loop, bounded exit)"
    command: "./testresample2"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test: speexdsp resampler API real call (init→process_int→destroy)"
    command: "./test_speexdsp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
