# test_package/MANIFEST.yml
# libpog 0.5.3.

package: libpog/0.5.3
homepage: https://github.com/metthal/pog

upstream_tests_exist: true
upstream_test_audit: "tests/*.cpp define 132 GoogleTest TEST/TEST_F macros and build the pog_tests executable with the bundled tests/googletest"
upstream_check_command: "grep -cE '^\\s*TEST(_F)?\\s*\\(' tests/*.cpp | awk -F: '{s+=$2} END {print s}'  (=> 132)"
upstream_test_in_build: true
upstream_test_command: "./tests/pog_tests"

upstream_tests:
  - name: "pog_tests (GoogleTest)"
    path: "tests/*.cpp"
    description: "automaton, filter_view, grammar, item, parser, parsing_table, precedence, rule, rule_builder, state, symbol, token, tokenizer, token_builder, utils"

test_package_tests:
  - file: test_libpog.cpp
    description: "Symbol index/name/kind/precedence round trips, plus RE2 FullMatch and fmt::format through the propagated dependencies"
    command: "./libpog_consumer"

test_files:
  - path: "test_package/test_libpog.cpp"
    test_type: "R34"
    assertion_count: 9

test_package_test_count: 1
consumer_assertion_count: 9
assertion_count: 9
