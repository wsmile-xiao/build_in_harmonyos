software: libpog
version: "0.5.3"
status: built
build_date: "2026-09-20"
build_system: cmake (header-only INTERFACE + tests)
conan_ref: "libpog/0.5.3"

source:
  url: "https://deb.debian.org/debian/pool/main/libp/libpog/libpog_0.5.3.orig.tar.gz"
  sha256: "5ce40883594f0c911f776403937594122dd4e0d1c3ab6a702469aa8bf233fbdd"
  tar_format: tar.gz

build:
  system: cmake
  build_command: "cmake -DPOG_TESTS=ON -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON && cmake --build && ./tests/pog_tests"
  dependencies:
    - "re2/2024-04-01"
    - "fmt/8.1.1"
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "GoogleTest（随包 tests/googletest），tests/*.cpp 共 132 个 TEST/TEST_F"
  upstream_discovered: 132
  upstream_passed: 132
  upstream_failed: 0
  upstream_note: "build() 在真机运行 pog_tests。上游 CMakeLists 的 project VERSION 写作 0.5.2（历史笔误），包版本以 tarball/任务 0.5.3 为准"
  test_package_passed: 9
  test_package_failed: 0
  test_package_assertions: 9
  execution: "conan create rc=0 + 上游 132/132 + 消费者 9 条断言"

test_passed: 141
test_failed: 0

patches_applied: []

knowledge_gained:
  - "libpog 本体是 header-only（INTERFACE 目标），但依赖 RE2（tokenizer）与 fmt（报告），并非纯头文件"
  - "上游自带 cmake/Findre2.cmake、cmake/fmt/Findfmt.cmake（module 模式），会在 CMAKE_MODULE_PATH 中优先命中 → 用 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON 强制走 Conan 的 re2/fmt config 包"
  - "制品仓已有 re2/2024-04-01（其又依赖 abseil-cpp）与 fmt/8.1.1，可直接作为 Conan 依赖，避免上游 deps/ 里基于 ExternalProject 的 bundled 构建"
  - "header-only 包通过 cpp_info.requires 传播 re2::re2/fmt::fmt，消费者只链接 pog::pog 即可解析 <re2/re2.h> 与 <fmt/...>"
  - "上游 project VERSION 与实际 tarball 版本不一致（0.5.2 vs 0.5.3），仅影响其自带的 pog-config-version.cmake，不影响 Conan 包版本"
