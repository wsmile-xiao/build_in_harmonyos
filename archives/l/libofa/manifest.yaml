software: libofa
display: "libofa"
description: "Open Fingerprint Architecture library: generates acoustic fingerprints for music identification"
category: library
homepage: "https://code.google.com/archive/p/musicip-libofa/"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "2005 世代 config.guess/config.sub 需 early-exit 补丁识别 linux-ohos 三元组"
    - "configure 的 umask 077 需改 022（HMDFS 兼容）"
    - "examples 需适配现代 curl（移除 curl/types.h）"
  common_dependencies:
    - expat
    - curl
    - fftw

versions:
  "0.9.3":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libofa/0.9.3"
