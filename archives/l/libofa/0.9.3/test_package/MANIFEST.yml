# test_package/MANIFEST.yml — libofa 0.9.3 verification manifest
#
# Upstream ships no test suite: the 0.9.3 tarball has no tests/ or test/
# directory, no TESTS assignment in any Makefile.am, and no gtest/pytest/
# ctest registration. examples/ holds noinst MusicDNS demo clients (they need
# a network service and a client id), not a test suite. Functional coverage
# comes from the installed-package consumer test below, which calls the real
# public API. The no_tests evidence marker is emitted by test_package every
# run (cache-hit safe); build() does not run `make check`
# (upstream_test_in_build: false), mirroring the merged bwm/0.6.3 no_tests
# precedent.

package: libofa/0.9.3
software: libofa
version: "0.9.3"
homepage: "https://code.google.com/archive/p/musicip-libofa/"

# Upstream test-suite existence (audited against the official source tarball)
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: autotools_tests

# Upstream test audit (source: libofa-0.9.3.tar.gz, google-code-archive)
# 0.9.3 tarball (sha256 02164661..., 69 entries) item-by-item verdict: no
# tests/ or test/ directory; all 7 Makefile.am files carry no TESTS /
# check_PROGRAMS / check-local; configure.in registers no test framework;
# no gtest/pytest/ctest entry; examples/Makefile.am only declares
# noinst_PROGRAMS (MusicDNS network demo clients, not a suite). Mirrors the
# merged bwm/0.6.3 + wraplinux/1.7 structured-audit shape so the hmbs
# lister can machine-parse the no_tests coverage.
upstream_test_audit:
  source_tarball: "libofa-0.9.3.tar.gz (https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/musicip-libofa/libofa-0.9.3.tar.gz)"
  source_sha256: "0216466153e92058c5202dea03390ddc7601d916b983f71ce4f4d034405590a0"
  source_origin: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/musicip-libofa/libofa-0.9.3.tar.gz (google-code-archive mirror of musicip-libofa, also used by nixpkgs and Debian)"
  build_system: "autotools (configure.in + Makefile.am; generated configure present)"
  top_level_files:
    - file: "Makefile.am"
      role: "automake entry, SUBDIRS lib/examples/include"
      test_targets: "none (no TESTS/check_PROGRAMS/check-local)"
      is_test: false
    - file: "configure.in"
      role: "autoconf input, expat/curl/fftw3 feature probes only"
      test_targets: "none (no enable_testing/add_test, no gtest/ctest/pytest registration)"
      is_test: false
    - file: "lib/Makefile.am"
      role: "library sources (8 core .cpp + JAMA/ + AFLIB/)"
      test_targets: "none (no TESTS/check_PROGRAMS/check-local)"
      is_test: false
    - file: "examples/Makefile.am"
      role: "only noinst_PROGRAMS = example (MusicDNS network demo clients)"
      test_targets: "none (no TESTS/check_PROGRAMS/check-local; demos need a network service and a client id)"
      is_test: false
    - file: "include/ofa1/ofa.h"
      role: "public C API header (ofa_get_version/ofa_create_print)"
      test_targets: "none (no TEST()/TEST_F()/def test_ wrapper, no standalone test entry)"
      is_test: false
    - file: "aclocal.m4/configure/COPYING"
      role: "autotools macro library / generated configure / license text"
      test_targets: "none"
      is_test: false
  scanned_for:
    - "tests/ / test/ directory"
    - "Makefile.am TESTS / check_PROGRAMS / check-local"
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "configure.in enable_testing / add_test"
    - "ctest / meson test / pytest entry"
  scan_result: "0 matches — 0.9.3 tarball 69 entries checked item by item: no tests/ or test/ directory; all 7 Makefile.am files carry no TESTS assignment (autotools_tests count 0); no gtest/pytest/ctest registration; examples/ only holds noinst MusicDNS demo clients (example.cpp/protocol.cpp/uselame.cpp/wavefile.cpp, with getMetadata network calls needing a client id), not a test suite."
  make_check_output: "automake default no-op (no Makefile.am defines TESTS, check target has zero cases to run); build() does not call make check (upstream_test_in_build: false), evidence is given by the test_package no_tests marker (mirrors bwm/0.6.3 precedent)"
  reason: "libofa 0.9.3 upstream has no test suite: no tests/ directory, no TESTS in any Makefile.am, no test framework registration; examples are network demo programs only."

# Upstream test command (no suite, so not applicable).
# Merged osmctools/0.9 + sipcalc/1.1.6 + bwm/0.6.3 + wraplinux/1.7 precedent:
# libraries with upstream_tests_exist:false keep upstream_check_command:""
# (the lister treats a non-empty value as upstream-has-tests and forces
# discovery, which rejects no_tests/0).
upstream_check_command: ""

# Whether conanfile.py build() integrates upstream tests.
# false: upstream genuinely has no suite, build() does not run make check;
# upstream evidence is produced by test_package in the test phase (mirrors
# the bwm/0.6.3 + wraplinux/1.7 no_tests precedent).
upstream_test_in_build: false
upstream_test_command: ""

# Tests actually run upstream (upstream_tests_exist: false, see audit above)
upstream_tests: []

test_type: installed-package
test_package_tests:
  - file: test_libofa.c
    name: test_libofa
    description: "Consumer contract against the packaged headers and library: ofa_get_version reports 0.9.3; ofa_create_print on 15 s of synthetic 440 Hz PCM returns a non-trivial base64 fingerprint deterministically across calls"
    command: "./test_libofa"

executables:
  - name: test_libofa
    purpose: "installed-package API verification (link and run against the packaged libofa)"

cases: 1
assertions: 6
upstream_cases: 0
upstream_assertions: 0
