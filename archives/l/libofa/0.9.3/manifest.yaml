software: libofa
version: "0.9.3"
conan_ref: "libofa/0.9.3"
status: built
build_date: "2026-09-20"
build_system: autotools

source:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/musicip-libofa/libofa-0.9.3.tar.gz"
  sha256: "0216466153e92058c5202dea03390ddc7601d916b983f71ce4f4d034405590a0"
  tar_format: tar.gz
  upstream_note: "Upstream project archived on Google Code (musicip-libofa); pristine 0.9.3 tarball served by the google-code-archive mirror used by nixpkgs and Debian"

build:
  system: autotools
  configure_options:
    - "--disable-shared --enable-static (Conan shared option default; shared=True flips them)"
  dependencies:
    - expat/2.8.2.1
    - curl/8.15.0
    - fftw/3.3.10.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess-harmonyos-triplet.patch"
  - "0002-config.sub-ohos-triplet.patch"
  - "0003-configure-umask-022-hmdfs.patch"
  - "0004-examples-modern-curl-unistd.patch"

upstream_tests:
  command: ""
  test_count: 0
  notes: "Upstream 0.9.3 ships no test suite: no tests/ directory and no TESTS assignment in any Makefile.am (autotools_tests count 0). build() does not run make check (upstream_test_in_build false, bwm/0.6.3 precedent); the no_tests evidence marker is emitted by test_package every run."

test_package:
  assertion_count: 6
  description: "Consumer program linked against the installed package: ofa_get_version reports 0.9.3 (3 checks); ofa_create_print on 15 s of synthetic 440 Hz PCM returns a non-trivial base64 fingerprint (2 checks: non-null, content) deterministically across calls (1 check)."

knowledge_gained:
  - "2005-04-22 世代的 config.guess 无 aarch64 分支且不识别 HarmonyOS/OHOS 的 uname；config.sub 把 -linux-ohos 改写成 -linux-gnu-ohos，因此必须用 early-exit 写法（config.guess 直接 echo 三元组、config.sub 直接 echo $1），与 libbrahe 的 0001/0002 同族"
  - "2005 版 configure 的 config.status 段同样是 umask 077（confstat 模板名），HMDFS 下需改 022，与 libbrahe 的 0003 同族"
  - "examples/protocol.cpp 的 #include <curl/types.h> 在 curl 8.x 已删除（Debian 07 同款修复），不修则示例链接失败；wavefile/uselame 缺 unistd.h（Debian 08 同款）"
  - "examples 全部是 noinst_PROGRAMS，make install 不产生 bin/，本包保持纯 library 类型，无需 commands.json"
  - "上游 libofa.pc 的 Requires: fftw3 与 Libs: -lofa -lexpat -lm 正确（非 libbrahe 式笔误），保留 pkgconfig 目录"
