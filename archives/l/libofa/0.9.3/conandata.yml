sources:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/musicip-libofa/libofa-0.9.3.tar.gz"
  sha256: "0216466153e92058c5202dea03390ddc7601d916b983f71ce4f4d034405590a0"

patches:
  - patch_file: "patches/0001-config.guess-harmonyos-triplet.patch"
    patch_description: "Teach the bundled config.guess (2005-04-22) to report aarch64-unknown-linux-ohos on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-ohos-triplet.patch"
    patch_description: "Accept *-linux-ohos triplets in the bundled config.sub (2005-04-22) via early exit"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask-022-hmdfs.patch"
    patch_description: "Use umask 022 for the config.status temp dir; HMDFS uid mapping makes 0700 dirs unwritable"
    patch_type: "portability"
  - patch_file: "patches/0004-examples-modern-curl-unistd.patch"
    patch_description: "Drop removed curl/types.h include and add missing unistd.h in examples (Debian 07 and 08)"
    patch_type: "portability"
