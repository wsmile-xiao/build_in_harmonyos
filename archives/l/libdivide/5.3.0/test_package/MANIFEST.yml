# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libdivide/5.3.0
homepage: "https://github.com/ridiculousfish/libdivide"

# 上游测试命令 (用于 make -n check / ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 包本身无需编译，但 build() 会构建并运行上游 correctness 测试
upstream_test_in_build: true
upstream_test_command: "tester && test_c99"

# ── 上游独立测试源文件 (4 个) ──
# 注意: "测试源文件数量" ≠ "内部断言数量"
upstream_test_sources:
  - file: test/tester.cpp
    type: cpp
    description: "C++ scalar + vector correctness 测试主程序"
  - file: test/test_c99.c
    type: c99
    description: "C99 scalar correctness 测试程序"
  - file: test/DivideTest.h
    type: header
    description: "tester.cpp 的测试逻辑头文件 (模板化除法校验)"
  - file: fast_div_generator.h
    type: header
    description: "constant_fast_div 生成器头 (test_c99.c 依赖)"

# ── 上游测试程序/目标 (CMake add_executable, 5 个) ──
upstream_tests:
  - file: test/tester.cpp
    source: libdivide/test/tester.cpp
    target: tester
    description: "C++ scalar + vector correctness 测试 (ctest 注册)"
    command: "./tester"
    type: correctness
    executed: true
    result: pass
  - file: test/test_c99.c
    source: libdivide/test/test_c99.c
    target: test_c99
    description: "C99 scalar correctness 测试 (ctest 注册)"
    command: "./test_c99"
    type: correctness
    executed: true
    result: pass
  - file: test/tester.cpp  # benchmark_branchfree 复用 DivideTest.h
    source: libdivide/test/tester.cpp
    target: benchmark_branchfree
    description: "branchfree 性能基准 (仅 Release, ctest 注册, 非正确性测试)"
    command: "./benchmark_branchfree"
    type: benchmark
    executed: false
    result: skip
    skip_reason: "性能基准非正确性测试, 不计入上游 correctness 验证"
  - file: test/tester.cpp
    source: libdivide/test/tester.cpp
    target: benchmark
    description: "性能基准 (未注册 ctest, 非正确性测试)"
    command: "./benchmark"
    type: benchmark
    executed: false
    result: skip
    skip_reason: "性能基准非正确性测试, 不计入上游 correctness 验证"
  - file: fast_div_generator.h
    source: libdivide/fast_div_generator.h
    target: fast_div_generator
    description: "constant_fast_div 代码生成器 (未注册 ctest, 非正确性测试)"
    command: "./fast_div_generator"
    type: tool
    executed: false
    result: skip
    skip_reason: "代码生成工具非正确性测试, 不计入上游 correctness 验证"

# ── 上游测试执行统计 ──
# 独立测试源文件: 4 (2 编译单元 + 2 头文件依赖)
# 测试程序/目标:  5 (CMake add_executable)
# correctness 测试: 2 (tester + test_c99)
# 实际执行:       2 (均在 conanfile.py build() 中构建+运行)
# 通过:           2
# 失败:           0
# 跳过:           3 (benchmark x2 + fast_div_generator, 非正确性测试)
upstream_execution:
  test_sources: 4
  test_targets: 5
  correctness_targets: 2
  executed: 2
  passed: 2
  failed: 0
  skipped: 3

# SIMD / 平台适配说明 (OpenHarmony aarch64)
# - NEON: 上游 CMake 用 check_cxx_source_compiles 自动检测 (非 try_run),
#   aarch64 工具链暴露 <arm_neon.h> + __ARM_NEON 时自动启用 LIBDIVIDE_NEON 路径
# - SSE2/AVX2/AVX512: 上游用 check_cxx_source_runs, 在 aarch64 上无法执行
#   x86 指令, 自动禁用 — 无需人为跳过或修改
# - tester 运行输出 "SIMD ISAs: none" = 走 scalar + NEON (如启用) 路径
simd_adaptation:
  target_arch: "aarch64"
  neon: "auto-detected (check_cxx_source_compiles, cross-compile safe)"
  sse2_avx2_avx512: "auto-disabled (check_cxx_source_runs fails on aarch64, x86-only)"
  manual_modification: "none"

# test_package 中自带的测试 (消费者视角验证)
# 仅测试最基础、跨平台的 scalar divider API，不强制 SSE/AVX/AVX512
test_package_tests:
  - file: test.cpp
    description: "消费者测试: scalar divider 构造 + 整数除法结果校验 (u32/s64/branchfree + operator/ + recover + 版本号)"
    command: "./test_libdivide"

# 测试断言总数 (test_package, 近似值, 用于质量评估)
# u32: 1001, s64: 11, branchfree: 901, operator/: 401, recover: 1, version: 3
assertion_count: 2318

# 是否修改上游测试: 否
upstream_test_modified: false
