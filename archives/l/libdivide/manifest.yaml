software: libdivide
display: "libdivide"
description: "libdivide — header-only C/C++ 库，将昂贵的整数除法优化为乘法+移位序列"
category: math
homepage: "https://github.com/ridiculousfish/libdivide"
license: "BSL-1.0 OR Zlib"
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only 库，仅需复制 libdivide.h 到 include/，无需编译任何 .so/.a"
    - "CMake 配方中 package_type=header-library，package() 直接 copy 头文件"
    - "上游自动检测 ARM NEON (AArch64)，交叉编译时用 check_cxx_source_compiles 而非 try_run"
    - "test_package 只测试最基础 scalar API（divider 构造 + 整数除法），不强制 SSE/AVX/AVX512"
  common_dependencies: []

versions:
  "5.3.0":
    status: built
    build_date: "2026-08-24"
    conan_recipe: true
