sources:
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.0/llvm-project-22.1.0.src.tar.xz"
  sha256: "25d2e2adc4356d758405dd885fcfd6447bce82a90eb78b6b87ce0934bd077173"
patches:
  - patch_file: "patches/0001-lldb-CMakeLists.txt.patch"
    patch_description: "unittest 顶层门控：尊重显式 LLDB_INCLUDE_UNITTESTS（CI 传 OFF，17.0.0 语义），无 llvm_gtest 目标时静默 OFF 回退（不再 FATAL）"
  - patch_file: "patches/0002-lldb-cmake-modules-LLDBConfig.cmake.patch"
    patch_description: "平台分支：CMAKE_SYSTEM_NAME MATCHES 追加 HarmonyOS（LLDBConfig，lldb-server 可用性判定）"
  - patch_file: "patches/0003-lldb-cmake-modules-LLDBGenerateConfig.cmake.patch"
    patch_description: "平台分支：CMAKE_SYSTEM_NAME MATCHES 追加 HarmonyOS（LLDBGenerateConfig）"
  - patch_file: "patches/0004-lldb-cmake-modules-LLDBStandalone.cmake.patch"
    patch_description: "standalone gtest 接线：set(LLVM_HAS_GTEST ON) + 归档顶层 vendored third-party/unittest（LLVM-patched googletest，monorepo CI 同源机制）源树优先解析、包内 LLVM_THIRD_PARTY_DIR 回退，构建合并 llvm_gtest/llvm_gtest_main 目标（含 printable raw_ostream 流式桥）；无 conan googletest 依赖"
  - patch_file: "patches/0005-lldb-source-Host-CMakeLists.txt.patch"
    patch_description: "平台分支：CMAKE_SYSTEM_NAME MATCHES 追加 HarmonyOS（Host）"
  - patch_file: "patches/0006-lldb-source-Initialization-CMakeLists.txt.patch"
    patch_description: "平台分支：CMAKE_SYSTEM_NAME MATCHES 追加 HarmonyOS（Initialization）"
  - patch_file: "patches/0007-lldb-source-Plugins-Process-CMakeLists.txt.patch"
    patch_description: "平台分支：CMAKE_SYSTEM_NAME MATCHES 追加 HarmonyOS（Plugins/Process）"
  - patch_file: "patches/0008-lldb-tools-lldb-server-CMakeLists.txt.patch"
    patch_description: "平台分支：CMAKE_SYSTEM_NAME MATCHES 追加 HarmonyOS（lldb-server）"
