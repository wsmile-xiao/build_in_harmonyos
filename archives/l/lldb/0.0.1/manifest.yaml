# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表（standalone lldb 子项目构建，-S lldb；完整清单见 conanfile.py generate()）
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_INSTALL_LIBDIR=lib"
  - "-DClang_DIR=<clang 包>/lib/cmake/clang"
  - "-DLLVM_MAIN_SRC_DIR=<source>/llvm"
  - "-DCMAKE_MODULE_PATH=<build>/_cmake_modules（Platform/HarmonyOS.cmake shim）+ <source>/llvm/cmake/modules（monorepo 源树 find 模块）"
  - "-DLLVM_TARGETS_TO_BUILD=AArch64"
  - "-DLLVM_ENABLE_PROJECTS="
  - "-DLLVM_ENABLE_ASSERTIONS=OFF"
  - "-DLLDB_INCLUDE_UNITTESTS=OFF（上游 3481 测试本地构建树实测，R51/test-report.md；unittest 目标 EXCLUDE_FROM_ALL 本就不在 conan create 范围）"
  - "-DLLDB_ENABLE_PYTHON=OFF"
  - "-DLLDB_ENABLE_SWIG=OFF"
  - "-DLLDB_ENABLE_LUA=OFF"
  - "-DLLVM_PARALLEL_LINK_JOBS=2"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - llvm/22.1.0
  - clang/22.1.8
  - libedit/20240808
  # 无 conan googletest 依赖：unittests gtest 取自 22.1.0 归档顶层内置的
  # vendored third-party/unittest（LLVM 补丁版 googletest），0004 补丁接线

  # 编译器（profile conf tools.build:compiler_executables 注入 hnp clang 15）
  cc: clang
  cxx: clang++

