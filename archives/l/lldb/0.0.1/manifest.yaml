# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "有效 LLVM 版本由 clang 包 ClangConfig.cmake `find_package(LLVM 22.1.8 EXACT)` 钳制：最终链接确定性 = clang 捆绑 LLVM 22.1.8；llvm/22.1.0 包作 find 候选 + 工具兜底，无需 pin（EXACT 自动拒 22.1.0）"
- "CMake pkgRedirects 固化首次 find_package 命中（内存态、不回写缓存）+ 网络 FS 间歇 stat 假阴性 → find:9 命中 llvm 包/clang 包抽签，两者皆可，有效版本由 EXACT 定"
- "llvm-project 22.1.0 .src 归档**顶层含 vendored third-party/unittest**（LLVM 补丁版 googletest）：wrapper LLVM_HAS_GTEST 模式构建合并 llvm_gtest（gtest-all.cc+gmock-all.cc）与 llvm_gtest_main 目标，gtest 自带 llvm_gtest::printable raw_ostream 流式桥接——unittests 的 gtest 来源，无需 conan googletest 依赖；vendored 树按源树优先解析（LLVM_MAIN_SRC_DIR 父目录），包内 LLVM_THIRD_PARTY_DIR 指向构建机、对 standalone 静默 no-op。初始『归档不含 third-party』前提为误判（llvm/third-party 确无，顶层 third-party 存在）"
- "llvm_gtest 目标必须在 LLVMTestingSupport add_subdirectory 之前定义（其 target_link_libraries 按名字引用 llvm_gtest，未解析名退化为裸 -lllvm_gtest 链接失败）；wrapper 合并目标同时满足 add_unittest 与 unittest main 的名引用"
- "平台适配：6 平台分支（CMAKE_SYSTEM_NAME MATCHES 追加 HarmonyOS）+ 构建期 Platform/HarmonyOS.cmake shim（复用 Platform/Linux）；config.guess stub 不需要（host 三元组来自预编译包 LLVMConfig）"
- "libedit/20240808 确定性注入：FindLibEdit.cmake find 模块（monorepo 源树模块路径）find_path/find_library 尊重预置缓存值（LibEdit_INCLUDE_DIRS/LIBRARIES）——G2 首败根因：网络 FS stat 间歇假阴性致模块搜索落空 → config 回退命中 CMakeDeps libedit-config → 目标名 libedit::libedit ≠ LibEdit::LibEdit → 链接报错"
- "conan libedit 配方 SYSTEM_LIBS 声明 tinfo（libedit 自身构建期依赖）→ CMakeDeps 注入 libedit::libedit 目标 INTERFACE_LINK_LIBRARIES → 消费方链接行出现裸 -ltinfo，CI 干净环境 sysroot 无 libtinfo → liblldb.so 链接失败（G2_5 实测）；libedit.so NEEDED libtinfo.so.6 属运行期依赖由动态链接器解析（设备 /usr/lib 实测存在），消费方链接期无需 -ltinfo → generate() 后处理 libedit-*-data.cmake 清除该声明"
- "RangeVector value_type 实验：裸 googletest 1.17 gmock ElementsAreMatcher 要求 T::value_type（gmock-matchers.h:3947，V5 期单TU编译失败）；vendored gmock（ContainerMatcherBase 架构）实测无 value_type 可编译（RangeMapTest/RangeTest 单TU -fsyntax-only 双 rc=0）→ RangeMap.h typedef 补丁不采纳，补丁集定版 8 个"

