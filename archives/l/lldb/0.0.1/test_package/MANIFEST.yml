# test_package/MANIFEST.yml
# 上游官方测试声明文件（LLDB 0.0.1 / LLVM 22.1.0 standalone）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lldb/0.0.1
homepage: "https://lldb.llvm.org/"

# 上游测试命令：LLDB 测试体系为 lit（check-lldb）+ GTest 单元测试
upstream_check_command: "ninja check-lldb"
upstream_test_in_build: true
upstream_test_command: "cmake.build(target=check-lldb)"

# 上游实际运行的测试程序（双口径台账：archives/l/lldb/0.0.1/notes.md）
upstream_tests:
  - file: "lldb/test"
    source: "llvm-project-22.1.0/lldb/test"
    description: "上游 lit 回归套件（Shell/API/python 等；实测 sharding 展开 33638 用例：shell 708 + api 1342 + unit 31588（09-30 独立实测）；api 1342 例在本无 python 构建下 100% unsupported）"
    command: "check-lldb"
  - file: "lldb/unittests"
    source: "llvm-project-22.1.0/lldb/unittests"
    description: "上游 GTest 单元测试（40 测试二进制：37 批量 + 3 沙箱受限逐用例隔离；实测 31387 用例 = 批量 31292 + 隔离 95）"
    command: "LLDBUnitTests / 各 *Tests 二进制"

# test_package 中自带的测试（消费者视角验证，实际调用被测包公开 API）
test_package_tests:
  - file: test_consumer.cpp
    description: "消费者测试：经公开 SB API 创建 SBDebugger/SBTarget，读模块符号并按名设断点（测试目标 -g 带调试信息；目标无符号时回退 section 尺寸校验）（无 ptrace，CI 安全）"
    command: "./test_lldb_consumer"

# 测试用例总数（实测执行口径 = lit 33638 + gtest 31387；
# 适配前静态清点 3481 = lit 1768 文件 + gtest 1713 注册，sharding 展开后为实测口径；
# 通过/归因明细见 reports/test-report.md 与 notes.md 台账）
assertion_count: 65025
