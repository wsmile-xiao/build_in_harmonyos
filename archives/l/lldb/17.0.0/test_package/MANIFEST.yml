# test_package/MANIFEST.yml
# 上游官方测试声明文件（LLDB 17.0.0）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lldb/17.0.0
homepage: "https://lldb.llvm.org/"

# 上游测试命令：LLDB 测试体系为 lit（check-lldb）+ GTest 单元测试
upstream_check_command: "ninja check-lldb"
upstream_test_in_build: true
upstream_test_command: "cmake.build(target=check-lldb)"

# 上游实际运行的测试程序（详见本任务双口径台账 lldb-17.0.0.test-ledger.md）
upstream_tests:
  - file: "lldb/test/Shell"
    source: "llvm-project-llvmorg-17.0.0/lldb/test/Shell"
    description: "上游 lit Shell 回归套件（293 个源码用例，liti 展开 506 项）"
    command: "check-lldb"
  - file: "lldb/unittests"
    source: "llvm-project-llvmorg-17.0.0/lldb/unittests"
    description: "上游 GTest 单元测试（16 个可执行目标，1219 用例实例化）"
    command: "LLDBUnitTests / 各 *Tests 二进制"
  - file: "lldb/test/API"
    source: "llvm-project-llvmorg-17.0.0/lldb/test/API"
    description: "上游 dotest API 套件（1124 个 Test*.py；本配方 LLDB_ENABLE_PYTHON=OFF 未实例化）"
    command: "dotest.py"

# test_package 中自带的测试（消费者视角验证，实际调用被测包公开 API）
test_package_tests:
  - file: test_consumer.cpp
    description: "消费者测试：经公开 SB API 创建 SBDebugger/SBTarget 并读取模块符号"
    command: "./test_lldb_consumer"

# 测试断言总数（实测：GTest 759 通过 + Shell lit 179 通过 + Unit lit 1045 通过；
# 剩余失败均为宿主机沙箱权限阻塞，详见双口径台账）
assertion_count: 1983