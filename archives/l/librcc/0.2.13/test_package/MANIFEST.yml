package: librcc/0.2.13
homepage: "https://github.com/RusXMMS/librcc"

upstream_check_command: "cat input-russian.txt | ./example2 && cat input-russian.txt | ./example2 ru (examples/Makefile.am test/test-russian)"
upstream_tests_exist: true
upstream_test_audit: "Audited librcc-0.2.13 tarball: root Makefile.am SUBDIRS=src engines external ui (no TESTS/check_PROGRAMS there), but examples/Makefile.am defines real test targets test (cat input-russian.txt | ./example2) and test-russian (cat input-russian.txt | ./example2 ru) with fixture examples/input-russian.txt (91 bytes, mixed encodings + ASCII lines). Hence 2 upstream test entries, executed in build() by compiling examples/example2.c and running both pipes."
upstream_test_in_build: true
upstream_test_command: "cat input-russian.txt | ./example2 && cat input-russian.txt | ./example2 ru (examples/Makefile.am test/test-russian)"

upstream_tests:
  - name: "examples test (default autodetect)"
    command: "cat input-russian.txt | ./example2"
    source: "examples/Makefile.am test target"
  - name: "examples test-russian (explicit ru)"
    command: "cat input-russian.txt | ./example2 ru"
    source: "examples/Makefile.am test-russian target"

test_package_tests:
  - file: test.c
    description: "Consumer test: rccInit, rccInitDefaultContext with input/output classes, rccGetCurrentLanguageName + rccRecode ASCII passthrough"
    command: "./test_librcc"

assertion_count: 3
