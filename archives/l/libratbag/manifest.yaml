software: libratbag
display: "libratbag"
description: "Logitech 及第三方游戏鼠标/键盘的配置库：libratbag 定义设备配置文件格式并驱动硬件，liblur 访问 Logitech Unifying Receiver，ratbagd 把两者暴露成 D-Bus 服务"
category: system
homepage: "https://github.com/libratbag/libratbag"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "上游 swig 生成的 Python 绑定（ratbag-command + pyratbag）需要 swig 与 libpython，OHOS 上两者都没有；补丁把 swig 块与 libpython 查找都收到新的 -Dpython-bindings=false 开关后面（同 graphviz --disable-swig 先例），不改任何 C 源码"
    - "上游 systemd 是可选依赖（-Dsystemd=false 时不生成 ratbagd 的 systemd unit），OHOS 上不以 systemd 为 init，关闭它不会少装任何库"
    - "上游 liblur 硬编码 shared_library()，因此本包 shared=False 不可用，配方 validate() 里直接拒绝而非静默产出坏包"
    - "上游私有依赖 dependency('libudev') 由 eudev/3.2.14 提供（systemd/261 只装 libsystemd，不含 libudev），PkgConfigDeps 的 pkg_config_name 正好是 libudev"
    - "glib 在 OHOS 上与 proxy-libintl 同构建但 package_info 未声明 intl，消费者会 undefined reference 到 g_libintl_*；配方就地增补生成的 glib .pc 并加 c_link_args"
    - "MesonToolchain 生成的 conan_meson_native.ini 在 OHOS worker 上缺 [binaries] 的 ar/ranlib/pkg-config，配方按 conf 与已知 SDK 路径补注入"
    - "build() 内全量执行上游 meson test（10 个测试程序 / 35 个 check 用例），并回读 meson-logs/testlog.txt 汇总块硬断言，不吃退出码"
    - "ratbagctl-test 需要私有 D-Bus + ratbagd、python-black-check/python-ruff-check 需要 pip 安装的 black/ruff，三者在本平台必然失败；它们仍被构建并执行，失败按「数量 + 身份」硬核对后如实声明（不删、不 SKIP）"
    - "依赖 glib/2.84.0.1 + eudev/3.2.14 + libevdev/1.13.7 + json-glib/1.10.6 + libunistring/1.0，tool_requires meson/1.11.0、test_requires check/0.15.2"

common_dependencies:
  - glib
  - eudev
  - libevdev
  - json-glib
  - libunistring

versions:
  "0.18":
    status: built
    build_date: "2026-09-20"
