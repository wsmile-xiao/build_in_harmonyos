# R39: 只写官方 GitHub URL（镜像由 CI 自动添加）。
# 须用单值 url：列表格式会跳过 build_and_test.sh 的 mirror rewrite。
# 上游 releases 页只有自动生成的 Source code 归档，没有手工上传的
# libratbag-0.18.tar.gz 资产（/releases/download/v0.18/... 实测 404），
# 因此用 tag archive URL，解出目录 libratbag-0.18/，配方 strip_root=True 拉平。
sources:
  url: "https://github.com/libratbag/libratbag/archive/refs/tags/v0.18.tar.gz"
  sha256: "8a7f8bf00c21ef5ad534e2804ed537f2fc6521a3932dd822c438e561a85a1bcd"

patches:
  - patch_file: "patches/0001-meson-make-python-bindings-optional.patch"
    patch_description: "把 swig 生成的 Python 绑定（需要 swig + libpython）改成可选（-Dpython-bindings=false），OHOS 上没有 swig 与 libpython"
    patch_type: "portability"
# 注：musl 无 glibc 的 program_invocation_short_name 一事**不再走补丁**——
# 旧 0002 在 5 个源文件里插 #ifdef __OHOS__ 平台条件块，违反
# .gitcode/review-memory.md R8（patches/ 默认不得引入平台宏）。
# 现改为配方层 feature detection：shim/progname_shim.h 用 #ifndef __GLIBC__
# 把该标识符别名到 musl 的 __progname，由 generate() 以 -include 强制注入，
# 上游源码零改动（与 kbd/2.9.0 同一做法）。
