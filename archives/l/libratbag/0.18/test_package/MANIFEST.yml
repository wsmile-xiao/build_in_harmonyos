# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# libratbag 是 meson 项目，测试全部在顶层 meson.build 里用 test() 注册：
#   - 3 个纯 Python 数据校验脚本（无条件注册）
#   - 4 个 C/check 程序（在 if enable_tests 块内，配方开 -Dtests=true 后注册）
#   - ratbagctl-test（Python + D-Bus）与 3 个 Python 代码风格检查
# 这 10 个程序已在配方 build() 中随 `meson test` 全量执行，并回读
# meson-logs/testlog.txt 的汇总块做硬断言（不吃退出码——SKIP 与「用例根本
# 没注册」同样会让退出码为 0）。
# 上游默认分支 master 与本次钉版 tag v0.18 的 test/ 逐文件一致：4 个 C 文件
# 的 tcase_add_test 计数同为 35，测试程序同为 10 个，无版本差。

package: libratbag/0.18
homepage: "https://github.com/libratbag/libratbag"

# 上游测试命令（已在 build() 中集成执行）
upstream_check_command: "meson test -C <builddir>"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的全部测试程序（10 个）
upstream_tests:
  # ── 无条件注册（顶层 test()） ──────────────────────────────────────────
  - file: test/data-parse-test.py
    source: libratbag-0.18.tar.gz/test/data-parse-test.py
    description: "遍历 data/ 下全部 .device 文件，用 ratbagd 的解析器校验它们能被正确解析（纯 Python，无需硬件/总线）"
    command: "meson test data-parse-test"
  - file: test/duplicate-check.py
    source: libratbag-0.18.tar.gz/test/duplicate-check.py
    description: "检查 data/ 下设备的 VendorId/ProductId 组合没有重复（纯 Python）"
    command: "meson test duplicate-test"
  - file: test/receiver-check.py
    source: libratbag-0.18.tar.gz/test/receiver-check.py
    description: "校验 liblur 里登记的 Unifying Receiver VID/PID 与 data/ 下 receiver 定义一致（纯 Python）"
    command: "meson test receiver-id-test"
  # ── if enable_tests 块内（-Dtests=true） ──────────────────────────────
  - file: test/test-context.c
    source: libratbag-0.18.tar.gz/test/test-context.c
    description: "ratbag 上下文/设备枚举与 ratbag_device_new_from_hidraw 的构造-析构路径（check 框架，6 个用例；用内存内的 ratbag_test_device，不需要真实硬件）"
    command: "meson test test-context"
  - file: test/test-device.c
    source: libratbag-0.18.tar.gz/test/test-device.c
    description: "ratbag 设备对象的主用例集（check 框架，23 个用例；驱动匹配、profile/分辨率/按键/led 读写与序列化，全部走内存内的 ratbag_test_device 夹具）"
    command: "meson test test-device"
  - file: test/test-util.c
    source: libratbag-0.18.tar.gz/test/test-util.c
    description: "libratbag-util 的纯函数用例（check 框架，2 个用例）"
    command: "meson test test-util"
  - file: test/test-iconv-helper.c
    source: libratbag-0.18.tar.gz/test/test-iconv-helper.c
    description: "图标/字符串转换辅助函数的编码转换用例（check 框架，4 个用例）"
    command: "meson test test-iconv-helper"
  # ── 需要 D-Bus / Python 工具链 ───────────────────────────────────────
  - file: test/ratbagctl-test.py
    source: libratbag-0.18.tar.gz/test/ratbagctl-test.py
    description: "ratbagctl CLI 的端到端测试：需要拉起 ratbagd 并连上系统总线（OHOS 沙箱不允许 AF_UNIX bind，见下方说明）"
    command: "meson test ratbagctl-test"
  - file: test/python-black-check.sh
    source: libratbag-0.18.tar.gz/test/python-black-check.sh
    description: "对仓库内 Python 源码跑 black --check（需要 pip 装好的 black，OHOS worker 上无 pip 网络访问）"
    command: "meson test python-black-check"
  - file: test/python-ruff-check.sh
    source: libratbag-0.18.tar.gz/test/python-ruff-check.sh
    description: "对仓库内 Python 源码跑 ruff（需要 pip 装好的 ruff，OHOS worker 上无 pip 网络访问）"
    command: "meson test python-ruff-check"

# 上游用例总数
# 上游默认分支 master 与 tag v0.18 一致：C/check 用例 35 个
# （test-context 6 + test-device 23 + test-util 2 + test-iconv-helper 4）；
# 另有 3 个 Python 数据校验脚本、1 个 D-Bus 端到端脚本、2 个代码风格检查脚本。
upstream_test_case_count: 35

# 平台上无法执行的用例（如实声明，不删除、不跳过、不计入通过）
upstream_unrunnable_on_platform:
  - program: ratbagctl-test
    reason: >-
      ratbagctl-test 先启动 ratbagd，再通过系统 D-Bus 与它通信。OHOS 沙箱拒绝
      AF_UNIX bind（Operation not permitted，见 archives/d/dbus/1.14.10.2/
      manifest.yaml），且已发布的 dbus 包只含客户端库、不含 dbus-daemon。
      该程序仍然被构建并被执行（不是 SKIP），其失败在配方里被显式
      「允许但必须核对失败原因」——只有命中已知的「无法连接总线」失败标记时
      才放行，否则抛异常。
  - program: python-black-check
    reason: >-
      需要 pip 安装的 black。OHOS worker 上没有 pip 可用的网络访问，也没有
      black/ruff 二进制；上游把这两个检查作为 test() 注册，因此它们会以
      「找不到解释器/命令」失败而不是 SKIP。配方按已知失败标记核对后如实声明。
  - program: python-ruff-check
    reason: >-
      同 python-black-check：需要 pip 安装的 ruff，OHOS worker 上没有。

# test_package 中自带的测试 (消费者视角验证，见 notes.md)
test_package_tests:
  - file: test_lur.c
    description: >-
      liblur 的真实 API 冒烟（不需要硬件）：enum lur_device_type 的数值 ABI
      与上游头文件逐一对照；lur_is_receiver() 对两款 Unifying Receiver PID
      (0xc52b/0xc532) 判真、对同厂非接收器 PID 与他厂 PID 判假；
      lur_receiver_new_from_hidraw() 的错误契约——负 fd 与「合法但非 hidraw」
      的 fd（/dev/null）都返回文档规定的 -EINVAL，且出参保持未被修改
    command: "./test_lur"

# 测试断言总数 (近似值, 用于质量评估；test_lur.c 内 CHECK(...) 调用点的
# 静态计数为 21，其中 check_non_hidraw_fd_rejected() 在 /dev/null 打不开时
# 会少执行 2 条)
assertion_count: 21
