# conandata.yml — liboeffis 1.6.0 (libei 1.6.0 第三子组件)
# 上游官方源: https://gitlab.freedesktop.org/libinput/libei

sources:
  url: "https://gitlab.freedesktop.org/libinput/libei/-/archive/1.6.0/libei-1.6.0.tar.gz"
  sha256: "81b4b967f0e5938492434a04f7ea2e6c6d96d3e6c44700bc691821f82281e602"

patches:
  - patch_file: "patches/0001-test-tmpfile-portable.patch"
    patch_description: "test: replace tmpfile() with a portable $TMPDIR fallback in the test helpers (musl tmpfile() hardcodes the read-only /tmp and ignores $TMPDIR)"
    patch_type: "portability"
  - patch_file: "patches/0002-vendor-munit-subproject.patch"
    patch_description: "test: vendor the munit subproject (subprojects/munit.wrap is wrap-git with revision=head, unreachable from the offline CI worker) with install:false so the test-only library never leaks into the delivered package"
    patch_type: "portability"
