package: liboeffis
version: "1.6.0"
type: library
description: "XDG RemoteDesktop portal DBus helper library (liboeffis) - test manifest"

build:
  system: meson
  command: |
    meson setup builddir -Dliboeffis=enabled -Dlibei=disabled -Dlibeis=disabled -Dsd-bus-provider=libsystemd -Dtests=auto -Ddocumentation=[]
    ninja -C builddir
    meson test -C builddir
    meson install -C builddir

tests:
  - name: consumer_api_test
    type: executable
    description: "C consumer test linking liboeffis.so, exercising oeffis_new/ref/unref lifecycle and failed-connect error path"
