software: liboeffis
version: "1.6.0"
description: "XDG RemoteDesktop portal DBus 助手库（liboeffis，freedesktop libei 项目的第三子组件）"
license: MIT
category: input
build_system: meson
status: built
build_date: "2026-09-30"
homepage: "https://gitlab.freedesktop.org/libinput/libei"
source_url: "https://gitlab.freedesktop.org/libinput/libei/-/archive/1.6.0/libei-1.6.0.tar.gz"

ohos_adaptation:
  key_points:
    - "只交付 liboeffis.so：-Dliboeffis=enabled -Dlibei=disabled -Dlibeis=disabled（libei 与 libeis 属各自任务面，见 archives/l/libei/1.5.0 与 archives/l/libeis/1.6.0）"
    - "sd-bus 由 systemd 261.1 提供（ohpcd 已发布），显式 -Dsd-bus-provider=libsystemd"
    - "tests=auto 原生降级：1.6.0 的 test/meson.build 用 required: get_option('tests') 门控 python 探测（oeffis-pytest 需 pytest+dbusmock+structlog），feature=auto 即跳过 python 套件，无需源码补丁"
    - "补丁 0001（测试面）：musl tmpfile() 硬编码只读 /tmp → $TMPDIR 唯一文件 + 立即 unlink；hunk 按 1.6.0 行号重基"
    - "补丁 0002（测试面）：subprojects/munit.wrap 是 wrap-git(revision=head)，CI 离线不可拉取 → vendor munit 三文件并强制 install:false"
    - "配方侧修正：注入 ar 前先确认 toolchain 文件是否已声明同键；否则会把 profile 的正确值覆盖成不存在的绝对路径"
    - "消费者测试：oeffis_new/ref/unref + get_eis_fd(-1/ENODEV) + failed-connect DISCONNECTED 路径 + error_message"
    - "meson install 的 depfixer 会重写 ELF RUNPATH（抹掉 $ORIGIN/../systemd-libs 并填占位字节），重写产物在 OHOS 上 dlopen 报 Permission denied；package() 用构建目录产物覆盖安装产物"
    - "musl 解析 DT_NEEDED 不跟随符号链接：systemd 的 libsystemd.so.0 与 liboeffis 别名需摊平为实体文件"
  max_rss_mb: 400

common_dependencies:
  - name: systemd
    version: "261.1"
    required: true
    note: "sd-bus provider (libsystemd)，ohpcd 已发布"

upstream_tests:
  framework: "meson test + munit（+ pytest/dbusmock，本配置不注册）"
  static_cases: 39
  registered_cases: 39
  executed_cases: 39
  passed_cases: 39
  skipped_cases: 0
  note: "unit-tests-utils 36/36、unit-tests-oeffis 2/2（test_init_unref + test_failed_connect）、dtdcheck 1/1；oeffis-pytest 需 python dbusmock，tests=auto 下不注册"

consumer_tests:
  executed_assertions: 9
  failed: 0
  gated_assertions: 0
  note: "test_package/src/test_package.c 共 9 处 CHECK() 断言：new/ref/unref 生命周期与引用计数、get_fd、get_eis_fd(-1/ENODEV)、failed-connect 的 DISCONNECTED 事件、error_message 非空；断言失败即非零退出，构成 conan create 真实门禁"

patches_applied:
  - "0001-test-tmpfile-portable.patch"
  - "0002-vendor-munit-subproject.patch"

knowledge_gained:
  - "liboeffis 是 libei 项目的第三子组件（portal helper），通过 DBus 与 XDG RemoteDesktop portal 通信获取 EIS socket fd"
  - "systemd 261.1 在 ohpcd 已发布，提供 sd-bus（libsystemd），使 liboeffis 在 OHOS 上可构建"
  - "meson install 的 RUNPATH 重写产物在 OHOS musl 下不可加载，交付共享库应以构建目录产物为准"
  - "OHOS 上 LD_LIBRARY_PATH 生效；判定共享库加载失败时应先用 dlopen 取 errno 定位，不要凭现象下 SELinux 结论"
