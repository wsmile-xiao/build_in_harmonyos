# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libbig_int/2.6
homepage: "https://github.com/mlafeldt/libbig_int"

# 上游确无测试（官方 tag 源码全量枚举无 test/bench/sample/example/fixture，
# CMakeLists 无 enable_testing/add_test；完整清点证据见本轮上游测试台账）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >-
      消费者验证：调用 big_int_create/from_int/to_int/add/mul/div/to_str/from_str/gcd
      公开 API，覆盖 12345+6789=18134、12345*6789=83810205、整除、十进制串往返、
      gcd(1071,462)=21 共 10 组断言
    command: "./test_libbig_int"

# 测试断言总数
assertion_count: 10