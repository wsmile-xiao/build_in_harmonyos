  - "big_int_add/mul 结果长度不会自动 clear_zeros，消费者导出前需调用 big_int_clear_zeros 规范化，否则 to_int 判溢出返回 1"
  - "上游无任何测试（无 test/bench/sample/example/fixture，CMake 无 enable_testing/add_test），source_declared_total=0"

