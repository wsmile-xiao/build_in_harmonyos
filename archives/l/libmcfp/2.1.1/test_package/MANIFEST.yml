# test_package/MANIFEST.yml — libmcfp 2.1.1

package: libmcfp/2.1.1
homepage: "https://github.com/mhekkel/libmcfp"

# 上游测试命令（已在 conan build() 内自动执行，见 conanfile.py _run_upstream_tests()）
# test/unit-test.cpp + test/lib-test.cpp 需 Catch2：上游用 CPMFindPackage 从
# github.com 下载，本配方改由 ohpcd catch2/3.8.1 提供（find_package(Catch2)
# 优先，CPM 仍作兜底）；上游仅当 BUILD_TESTING AND PROJECT_IS_TOP_LEVEL 才
# add_subdirectory(test)，conan 构建即为 top-level，故置 BUILD_TESTING=ON。
# 2.1.1 还需要 fast_float/8.0.1：OHOS libc++ 无浮点 std::from_chars，
# 上游 try_compile(STD_CHARCONV_COMPILING) 失败后 CPM 拉取 fast_float 8.0.2，
# 本配方补丁 0001 改为 find_package(fast_float) 优先。
upstream_check_command: "cmake -DBUILD_TESTING=ON -B build && cmake --build build && ctest --test-dir build"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际存在的测试程序（已在 conan build() 中运行 — 真机实测结果）
upstream_tests:
  - file: test/unit-test.cpp
    source: libmcfp-2.1.1/test/unit-test.cpp
    description: "mcfp 单元测试（Catch2，35 个 TEST_CASE：t_1..t_14、file_1..file_4、non-compiling、casting-1、usage-1、sections-1、single-hyphen、word_wrapper_*、flag-*、config-*、cli-empty-value、path-option、get-optional-unset、single-hyphen-operand）"
    command: "./unit-test-app --data-dir <test-src-dir>"
    run_status: PASS
    reason: ""
  - file: test/lib-test.cpp
    source: libmcfp-2.1.1/test/lib-test.cpp
    description: "mcfp 库测试（Catch2，2 个 TEST_CASE：suffixed-options、suffixed-options-2）"
    command: "./lib-test-app --data-dir <test-src-dir>"
    run_status: PASS
    reason: ""
  - file: test/test-main.cpp
    source: libmcfp-2.1.1/test/test-main.cpp
    description: "Catch2 运行器（CATCH_CONFIG_RUNNER，框架文件，非独立用例）"
    command: ""
    run_status: NOT_RUN
    reason: "框架运行器，非独立 TEST_CASE"
  - file: test/unit-test-gaps.cpp
    source: libmcfp-2.1.1/test/unit-test-gaps.cpp
    description: "占位源码（无 TEST_CASE，未加入 CMake 注册清单）"
    command: ""
    run_status: NOT_RUN
    reason: "未实例化：不含 TEST_CASE 且未被 test/CMakeLists.txt 引用"
  - file: examples/example.cpp
    source: libmcfp-2.1.1/examples/example.cpp
    description: "上游示例程序（非测试用例）"
    command: "./example"
    run_status: NOT_RUN
    reason: "样例非独立用例，不计入上游用例数"

# test_package 自带的测试
test_package_tests:
  - file: test.cpp
    description: "消费者冒烟 — 编译链接 libmcfp::libmcfp，真实 parse CLI：-n 7 --text hello -i a -i b → num=7/text=hello/items=2"
    command: "./test_libmcfp"

assertion_count: 5
