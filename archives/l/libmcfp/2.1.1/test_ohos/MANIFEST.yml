# test_ohos/MANIFEST.yml — libmcfp 2.1.1 HarmonyOS PC 专项验证
# 四项独立鸿蒙检查（run_ohos_test.sh，任一失败非零退出）：
#   T1_aarch64_archive  libmcfp.a 归档成员为 ELF64 AArch64（readelf -h）
#   T2_no_host_paths    无宿主绝对路径（/storage /home /Users）泄漏
#   T3_fast_float_run   真机编译 + 运行：浮点选项解析走 OHOS 特有的
#                       fast_float 路径（OHOS libc++ 无浮点 std::from_chars），
#                       -d 3.14159 解析并打印，验证 USE_FAST_FLOAT 适配
#   T4_ff_symbol        库内存在 ff_charconv 符号（charconv-fast_float.cpp
#                       已编译进 libmcfp.a，验证 OHOS 浮点适配确实生效）
checks:
  - id: T1_aarch64_archive
    desc: libmcfp.a archive members are ELF64 AArch64 (readelf -h)
  - id: T2_no_host_paths
    desc: no absolute host paths leaked into the installed library
  - id: T3_fast_float_run
    desc: compile + run a real OHOS program parsing float via the fast_float path
  - id: T4_ff_symbol
    desc: ff_charconv symbols present in libmcfp.a (charconv-fast_float compiled in)
assertion_count: 4
test_language: cpp
test_framework: bare
framework_flavor: bare