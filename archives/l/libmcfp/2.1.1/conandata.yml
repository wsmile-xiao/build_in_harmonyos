# conandata.yml — libmcfp 2.1.1
# sha256 verified 2026-09-28 against the upstream GitHub release tarball.

sources:
  url: "https://github.com/mhekkel/libmcfp/archive/refs/tags/v2.1.1.tar.gz"
  sha256: "2edf570b25772a14395b7efc8c354e012b0b2c45d1cb00471cf2a5cad796fd45"

patches:
  - patch_file: "patches/0001-CMakeLists-preinstalled-fastfloat-first.patch"
    patch_description: >-
      Top-level CMakeLists.txt runs try_compile(STD_CHARCONV_COMPILING) and,
      when the toolchain lacks floating-point std::from_chars (true on the
      OHOS libc++, where the float/double overloads are deleted), fetches
      fast_float 8.0.2 from github.com at configure time via CPMFindPackage --
      a network download inside build().  Try find_package(fast_float CONFIG)
      first (resolves the ohpcd fast_float/8.0.1 package) and keep CPM only as
      a fallback; also reference the package's actual target
      fast_float::fast_float instead of the CPM-era FastFloat::fast_float.
    patch_type: "portability"
  - patch_file: "patches/0002-test-cmakelists-use-preinstalled-catch2.patch"
    patch_description: >-
      test/CMakeLists.txt runs CPMFindPackage("gh:catchorg/Catch2@3.4.0"),
      which downloads Catch2 from github.com at configure time -- a network
      fetch inside build(), and it shadows the Catch2 the artifact repo already
      provides.  Try find_package(Catch2 CONFIG QUIET) first and keep CPM only
      as a fallback, so the Conan catch2 package is used when one is available.
    patch_type: "portability"
  - patch_file: "patches/0003-src-text-std-reverse.patch"
    patch_description: >-
      src/text.cpp word_wrapper::wrap_line uses std::ranges::reverse (a C++23
      ranges algorithm that landed in libc++ 16); the OHOS clang 15 libc++
      lacks it, so the upstream library fails to compile ("no type named
      'reverse' in namespace 'std::ranges'").  Use the C++17 std::reverse
      range-pair form instead; std::reverse is fully available on OHOS.
    patch_type: "portability"
