# 版本级 manifest — libmcfp 2.1.1

version: "2.1.1"
software: "libmcfp"
status: built
build_date: "2026-09-28"
build_system: "cmake"

source:
  url: "https://github.com/mhekkel/libmcfp/archive/refs/tags/v2.1.1.tar.gz"
  sha256: "2edf570b25772a14395b7efc8c354e012b0b2c45d1cb00471cf2a5cad796fd45"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_DOCUMENTATION=OFF"
    - "-DMCFP_BUILD_CXX_MODULE=OFF"
  dependencies:
    - fast_float/8.0.1
    - catch2/3.8.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists-preinstalled-fastfloat-first.patch"
  - "0002-test-cmakelists-use-preinstalled-catch2.patch"
  - "0003-src-text-std-reverse.patch"

knowledge_gained:
  - "2.1.1 起不再是 header-only：src/*.cpp 编译真实库（libmcfp.a），CMake >= 3.28，C++23"
  - "OHOS libc++ 缺浮点 std::from_chars（float/double 重载被 delete）→ 上游 try_compile 失败后 CPM 拉取 fast_float 8.0.2（禁网）→ find_package(fast_float) 优先补丁 + fast_float/8.0.1 依赖"
  - "上游测试 37 个 Catch2 TEST_CASE（unit-test.cpp 35 + lib-test.cpp 2），Catch2 3.4.0 由 CPM 拉取 → find_package(Catch2) 优先补丁 + catch2/3.8.1 依赖"
  - "可选 C++20 module 库（MCFP_BUILD_CXX_MODULE）在 clang 15 上实验性，置 OFF"
  - "OHOS 下 CMakeToolchain 置 CMAKE_SYSTEM_NAME=Linux（Linux-like 目标，同 fast_float/mcfp 1.4.2 技法）"