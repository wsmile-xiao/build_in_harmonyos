# 版本级 manifest
# 文件位置: archives/l/libmcfp/1.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.2"

# 软件名
software: "libmcfp"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mhekkel/libmcfp/archive/refs/tags/v1.4.2.tar.gz"

  # 源码校验和
  sha256: "dcdf3e81601081b2a9e2f2e1bb1ee2a8545190358d5d9bec9158ad70f5ca355e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_TESTING=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Header-only INTERFACE library, no compilation needed, only header installation"
  - "CMake BUILD_TESTING=OFF required to avoid CPM fetching Catch2 from GitHub"
  - "Library requires C++20 (target_compile_features mcfp INTERFACE cxx_std_20)"
  - "No external dependencies in v1.4.2"
