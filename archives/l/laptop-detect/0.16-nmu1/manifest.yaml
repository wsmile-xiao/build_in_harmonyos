knowledge_gained:
  - "laptop-detect 是 Debian-native POSIX sh 脚本包（arch=all，无编译）：Debian 构建=sed 替换 laptop-detect.in 的 @VERSION@ 生成最终脚本（debian/rules override_dh_auto_configure），配方 build() 复刻该替换并以锚点计数（必须恰好一处）防漂移"
  - "版本口径：平台任务卡写 0.16-nmu1、Debian 发行写 0.16+nmu1（+/- 归一化）；conan 版本取任务卡口径 0.16-nmu1，sed 替换出的版本串随包内脚本信息性展示"
  - "0.16+nmu1 是 Reproducible Builds 团队 NMU，changelog 明示'无源码变更上传'（仅为 dpkg>1.19 重构建），内容与 0.16 同源"
  - "探测链矩阵（脚本顺序）：/proc/pmu（Mac）→ dmidecode chassis-type（可选依赖，缺失即跳过）→ /sys/devices/virtual/dmi/id/chassis_type（8/9/10/11=便携/笔记本/记事本/手持）→ /sys/class/power_supply type=Battery 且 scope≠Device → /proc/acpi/battery（旧接口）→ /proc/apm；全部未命中 exit 1"
  - "许可证为 BSD-3-Clause（全文在 debian/copyright 内）；上游为 Debian-native 包无独立 LICENSE 文件，配方把 debian/copyright 原样分发到 licenses/"
  - "OHOS 硬件探测暴露矩阵（真机 2026-09-26 实测）：/proc pmu/acpi/apm 传统节点全缺失、/sys/devices/virtual/dmi/id 整个目录缺失（chassis_type 不可用）、dmidecode 不可用；**/sys/class/power_supply 目录存在但 EACCES 不可读**——'存在但不可读'是 OHOS sysfs 的典型形态，探测脚本必须给 ls/cat 加 2>/dev/null 守卫，否则 stderr 泄漏 Permission denied 且无法降级"
  - "真机首验抓出上游遗漏：laptop-detect.in 唯一无守卫的探测行 ls /sys/class/power_supply 在 OHOS 泄漏 Permission denied（其余探测均带 2>/dev/null）→ 0001 补丁补齐守卫，GNU/Linux 行为零差异；真机判定 rc=1（无电池线索，与设备形态一致）"
upstream_test_pass_rate: "N/A（上游无测试套件：发行归档仅 README/debian/laptop-detect.in/manpage，全树 0 测试文件）"
