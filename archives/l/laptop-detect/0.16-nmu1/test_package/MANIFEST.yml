# test_package/MANIFEST.yml
# 上游官方测试声明文件
# laptop-detect 0.16+nmu1 上游测试：0 个——发行归档仅 README、debian/、
# laptop-detect.in、laptop-detect.1，全树无任何测试文件（无 tests/ 目录、
# 无 autopkgtest 目录、无 *.t 等，逐文件清点实测）。Debian 上游为
# Debian-native 包，无独立测试套件。

package: laptop-detect/0.16-nmu1
homepage: "https://gitlab.com/debiants/laptop-detect"

# 上游测试命令（无）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，调用已安装脚本）
test_package_tests:
  - file: test_laptop_detect.sh
    description: "消费者测试 — 以 sh 调用已安装脚本验证选项语义（exit 2 族）、判定语义（exit 0/1 + 一致诊断）、调试模式与安装布局"
    command: "sh test_laptop_detect.sh <bin_dir>"

# 消费者探针断言总数
assertion_count: 25
