software: libplist-util
version: "2.7.0"
status: built
build_date: "2026-09-18"
conan_adapt_date: "2026-09-18"
compile_date: "2026-09-18"
build_system: autotools

source:
  url: "https://github.com/libimobiledevice/libplist/releases/download/2.7.0/libplist-2.7.0.tar.bz2"
  sha256: "7ac42301e896b1ebe3c654634780c82baa7cb70df8554e683ff89f7c2643eb8b"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--without-cython"
    - "--with-tools"
    - "--with-tests"
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-gnu (OHOS only)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libplist 2.7.0 is the official source release containing plistutil; no independent libplist-util source release exists."
  - "The Autotools source builds plistutil together with its internal libplist objects, so static linking is required when the split package publishes only the executable."
  - "HarmonyOS config.guess needs --build=aarch64-unknown-linux-gnu."
  - "Autoconf config.status needs a private mktemp wrapper on HarmonyOS HMDFS."
  - "The upstream test suite contains 41 scripts and 7 helper programs."
