software: libplist-util
display: "libplist plistutil 工具"
description: "在多种 Apple Property List 格式之间转换文件的命令行工具"
category: utility
homepage: "https://github.com/libimobiledevice/libplist"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "使用 --build=aarch64-unknown-linux-gnu 绕过 HarmonyOS config.guess 识别缺口。"
    - "使用私有 mktemp 包装器让 Autoconf 在 HMDFS 上走 mkdir 回退路径。"
    - "采用静态内部链接，工具包不发布 libplist 库和头文件。"
  common_dependencies: []

versions:
  "2.7.0":
    status: built
    build_date: "2026-09-18"
