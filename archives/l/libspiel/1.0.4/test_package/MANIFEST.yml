package: libspiel/1.0.4
homepage: "https://github.com/project-spiel/libspiel"
upstream_check_command: "meson test --list -C build-release"
upstream_test_in_build: true
upstream_test_command: "meson test --verbose -C build-release"
# Census of the SHA256-verified SPIEL_1_0_4 source: 29 Python test_* methods
# in seven normally registered TAP files + three C executables + one schema
# validation = 33 base cases (11 Meson targets). D-Bus >= 1.14.4 adds the
# conditional test_provider.py with two cases (35 cases / 12 Meson targets).
# On HarmonyOS PC, only the schema case ran: 1/1 passed, 1/33 base coverage.
upstream_tests:
  - file: libspiel/org.monotonous.libspiel.gschema.xml
    description: "Upstream strict GSettings schema validation; ran on HarmonyOS PC"
    command: "meson test -C build-release 'Validate schema file'"
  - file: tests/test-simple-speak.c
    description: "Upstream D-Bus speech test; socket bind is denied by HarmonyOS PC"
    command: "meson test -C build-release test-simple-speak"
  - file: tests/test-simultaneous-init.c
    description: "Upstream D-Bus initialization test; socket bind is denied by HarmonyOS PC"
    command: "meson test -C build-release test-simultaneous-init"
  - file: tests/test-registry.c
    description: "Upstream D-Bus provider registry test; socket bind is denied by HarmonyOS PC"
    command: "meson test -C build-release test-registry"
  - file: tests/test_audio.py
    description: "Four Python GI/TAP cases; unavailable GI, tap and dasbus modules"
    command: "meson test -C build-release test_audio.py"
  - file: tests/test_errors.py
    description: "Two Python GI/TAP cases; unavailable GI, tap and dasbus modules"
    command: "meson test -C build-release test_errors.py"
  - file: tests/test_settings.py
    description: "One Python GI/TAP case; unavailable GI, tap and dasbus modules"
    command: "meson test -C build-release test_settings.py"
  - file: tests/test_speak.py
    description: "Eight Python GI/TAP cases; unavailable GI, tap and dasbus modules"
    command: "meson test -C build-release test_speak.py"
  - file: tests/test_types.py
    description: "Three Python GI/TAP cases; unavailable GI, tap and dasbus modules"
    command: "meson test -C build-release test_types.py"
  - file: tests/test_voice_selection.py
    description: "Six Python GI/TAP cases; unavailable GI, tap and dasbus modules"
    command: "meson test -C build-release test_voice_selection.py"
  - file: tests/test_voices.py
    description: "Five Python GI/TAP cases; unavailable GI, tap and dasbus modules"
    command: "meson test -C build-release test_voices.py"
  - file: tests/test_provider.py
    description: "Two conditional Python GI/TAP cases only when D-Bus >= 1.14.4; not part of the base 33"
    command: "meson test -C build-release test_provider.py"
test_package_tests:
  - file: consumer.c
    description: "Ten independent tests of the installed public C API and linked OHOS ELF"
    command: "meson test -C build-release"
assertion_count: 29
