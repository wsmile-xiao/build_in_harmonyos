version: "1.0.4"
software: libspiel
status: built
build_date: "2026-10-09"
build_system: meson
source:
  url: "https://codeload.github.com/project-spiel/libspiel/tar.gz/refs/tags/SPIEL_1_0_4"
  sha256: "6060024bd640c1d94d3860731e15a7171aa440b3a52d3bebf83d23088096eb75"
  tar_format: tar.gz
build:
  system: meson
  configure_options:
    - "-Dintrospection=false"
    - "-Ddocs=false"
    - "-Dtests=true"
    - "-Dutils=false"
    - "-Ddefault_library=static"
    - "--wrap-mode=nofallback"
  dependencies:
    - libspeechprovider/1.0.3
    - glib/2.84.0.1
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3
  cc: clang
  cxx: clang++
patches_applied:
  - "Support Meson default_library and build a static archive without rewriting generated Ninja files."
  - "Make upstream GIR optional because the published speech provider lacks a typelib."
  - "Install headers referenced by the public spiel.h umbrella header."
  - "Fix malformed version placeholders in the installed public header."
knowledge_gained:
  - "OHOS rejects shared ELF files modified during Meson install; static libspiel preserves the public C API without that install-time rewrite."
  - "This HarmonyOS PC environment denies Unix-domain socket bind, so D-Bus session integration tests cannot execute."
