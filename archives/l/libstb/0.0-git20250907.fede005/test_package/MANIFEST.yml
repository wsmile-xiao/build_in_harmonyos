package: libstb/0.0-git20250907.fede005
homepage: "https://github.com/nothings/stb"

upstream_check_command: "ls tests/*.c tests/*.cpp"
upstream_test_in_build: false
upstream_test_command: "clang -I<src> ... tests/test_sprintf.c（逐套件编译，见 notes.md）"

upstream_tests:
  - file: tests/test_sprintf.c
    source: stb/tests/test_sprintf.c
    description: "stb_sprintf 与 libc 逐用例比对套件（-DTEST_SPRINTF -DSTB_SPRINTF_IMPLEMENTATION）"
    command: "./test_sprintf"
  - file: tests/test_png_paeth.c
    source: stb/tests/test_png_paeth.c
    description: "PNG Paeth 滤波器穷举一致性（2^24 组合，参考实现 vs 优化实现）"
    command: "./test_png_paeth"
  - file: tests/test_ds.c
    source: stb/tests/test_ds.c
    description: "stb_ds 单元+churn 压力套件（-O2 -std=c++17 -DDS_TEST，C++ 模式编译——上游 STBDS_ADDRESSOF 在 clang C 模式 array key 路径自认 broken，同 stb_ds/0.67 包先例；-O0 下该套件必 SIGSEGV 为工具链优化级问题，见知识草稿 stbds-test-ds-o0-segv）"
    command: "./test_ds"
  - file: tests/test_c_compilation.c
    source: stb/tests/test_c_compilation.c
    description: "全集合 C 模式编译烟雾测试（12+ 头文件 implementation 宏全定义；附独立驱动 main 调 quicktest，上游文件零修改）"
    command: "./test_c_compilation"
  - file: tests/test_easyfont.c
    source: stb/tests/test_easyfont.c
    description: "stb_easy_font 编译覆盖（上游即为 API 调用桩，附独立驱动 main 调 ef_dummy，上游文件零修改）"
    command: "./test_easyfont"
  - file: tests/image_test.c
    source: stb/tests/image_test.c
    description: "stb_image PNG 套件（PngSuite 77 文件全编码类型）——同一 commit fede005 已由 stb_image/2.30 包在真机全量跑过并通过（77/77），本 PR 引用其结果作同源佐证，不重复跑"
    command: "./image_test pngsuite/*.png"

test_package_tests:
  - file: test_libstb.c
    description: "消费者测试 1：PNG 内存编码→无损解码逐字节往返（stb_image_write+stb_image）、stb_ds 数组/int 哈希表/字符串哈希表、stb_sprintf 三类格式化、stb_rect_pack 装箱边界与不重叠断言、stb_divide 三种取整商——同一 TU 6 个 STB_*_IMPLEMENTATION 宏"
    command: "./test_libstb"
  - file: consumer_image_pipeline.c
    description: "消费者测试 2（终端用户管线）：四象限纯色图生成→stbi_write_png_to_mem 编码→stbi_load_from_memory 无损解码→stbir_resize_uint8_linear 2x 放大（resize2 新宏）→象限内部采样颜色校验"
    command: "./consumer_image_pipeline"

assertion_count: 21
