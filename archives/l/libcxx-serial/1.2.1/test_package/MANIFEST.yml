# test_package/MANIFEST.yml — libcxx-serial 1.2.1
#
# 上游测试清点（R51）：`tar tzf serial-1.2.1.tar.gz` 列出 tests/：
#   - tests/unix_serial_tests.cc        gtest 套件（上游经 catkin_add_gtest 挂接）
#   - tests/unit/unix_timer_tests.cc    gtest 套件
#   - tests/proof_of_concepts/{mdc2250.cc,tokenizer.cc,python_serial_test.py}
#     mdc2250.cc 官方 1.2.1 包内为不可编译的 11 字节残缺存根；tokenizer.cc 为
#     与库无关的 boost 字符串示例；python_serial_test.py 需 pyserial+真实串口
# 上游无独立 ctest/pytest 入口（CMakeLists 经 CATKIN_ENABLE_TESTING + catkin_add_gtest）。
# 两个 gtest 套件已于 2026-09-19 在设备真机实跑，记录见 notes.md 与 reports/。

package: libcxx-serial/1.2.1
homepage: "https://github.com/wjwwood/serial"

upstream_check_command: "catkin_add_gtest (upstream tests/CMakeLists.txt, catkin-only; no standalone ctest entry)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/unix_serial_tests.cc
    source: serial-1.2.1/tests/unix_serial_tests.cc
    description: "4 gtest cases (readWorks/writeWorks/timeoutWorks/partialRead) over an openpty loopback pair"
    command: "./serial-upstream-test"
  - file: tests/unit/unix_timer_tests.cc
    source: serial-1.2.1/tests/unit/unix_timer_tests.cc
    description: "2 gtest cases for MillisecondTimer (short_intervals/overlapping_long_intervals)"
    command: "./timer-upstream-test"

test_package_tests:
  - file: test_package.cpp
    description: "consumer smoke: link packaged library, serial::list_ports() enumeration + public API enums"
    command: "./test_package"

# 断言总数（近似）：上游 gtest EXPECT/ASSERT 共 12（serial 9 + timer 3），
# 消费者 test_package.cpp 6 项（list_ports 不抛异常 + 5 组枚举值校验），合计 18。
assertion_count: 18
