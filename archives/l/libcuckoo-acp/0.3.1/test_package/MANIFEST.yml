# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcuckoo-acp/0.3.1
homepage: "https://github.com/efficient/libcuckoo"

# 上游测试枚举命令（BUILD_TESTS=ON 后 ctest -N 注册 10 项）
upstream_check_command: "ctest -N (10 个 add_test 注册项)"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（CTest 口径 10 项，全部在交付配置下编译执行）
# 分母构成（与官方同版本 add_test 注册一致，口径 ctest_entries）：
#   tests/unit-tests/CMakeLists.txt: add_test(unit_tests) -> 1
#   tests/stress-tests/CMakeLists.txt: stress_checked + stress_unchecked -> 2
#   tests/universal-benchmark/CMakeLists.txt: pure_read/pure_insert/
#     pure_erase/pure_update/pure_upsert/insert_expansion/
#     read_insert_expansion -> 7
upstream_test_total: 10
upstream_test_count_method: ctest_entries
upstream_tests:
  - file: tests/unit-tests/test_runner.cc
    source: libcuckoo-0.3.1/tests/unit-tests/test_runner.cc
    description: "Catch 单测可执行文件 unit_tests（11 个 test_*.cc 编入同一二进制）"
    command: "ctest -R unit_tests"
  - file: tests/stress-tests/stress_checked.cc
    source: libcuckoo-0.3.1/tests/stress-tests/stress_checked.cc
    description: "并发正确性压力测试 stress_checked（默认 2^25 键/16 线程/10 秒）"
    command: "ctest -R stress_checked"
  - file: tests/stress-tests/stress_unchecked.cc
    source: libcuckoo-0.3.1/tests/stress-tests/stress_unchecked.cc
    description: "并发性能压力测试 stress_unchecked"
    command: "ctest -R stress_unchecked"
  - file: tests/universal-benchmark/universal_benchmark.cc
    source: libcuckoo-0.3.1/tests/universal-benchmark/universal_benchmark.cc
    description: "通用基准 pure_read/pure_insert/pure_erase/pure_update/pure_upsert/insert_expansion/read_insert_expansion（7 个 ctest 项）"
    command: "ctest -R 'pure_|_expansion'"

# test_package 中自带的测试 (消费者视角验证；同一 conan create 内执行)
# 实测结果待真机预检回填（首轮仅完成工作树）。
test_package_tests:
  - file: test_libcuckoo_acp.cpp
    description: "消费者测试：insert/find/erase/update/upsert/locked_table/clear/异常 find 共 10 项真实 API 检查"
    command: "./test_libcuckoo_acp"
    result: "待真机预检回填（设计 10 项 LIBCUCKOO_ACP_CHECK 断言）"

# 测试断言总数 (test_package 自带消费者测试)
# test_libcuckoo_acp.cpp: 10 项 LIBCUCKOO_ACP_CHECK
assertion_count: 10
