# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试实际清点: GNU Libtool 2.6.0 Autotest testsuite（185 个测试组）
# 详见 notes.md「测试申报表」。CI 环境不跑上游 testsuite（需完整 automake/
# autom4te 工具链），conan create 仅做编译验证 + test_package 消费者冒烟。

package: libltdl/2.6.0
homepage: "https://www.gnu.org/software/libtool/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 否: libltdl 上游 testsuite 需要 automake/autom4te 完整工具链 + 平台专属
# 编译器（F77/FC/GCJ/OBJC…），CI 无；已在本地设备全量执行并记录（见 notes.md）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本机设备实测，2026-09-22，tests/testsuite.log）
upstream_tests:
  - file: tests/testsuite
    source: libltdl-2.6.0/tests/testsuite
    description: "GNU Libtool 2.6.0 Autotest 全量测试（185 组）: 151 run = 80 ok + 71 failed(5 expected), 34 skipped；66 非预期失败全因本机 autom4te 缺失"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证, R34: 实质调用 ltdl API)
test_package_tests:
  - file: test.c
    description: "调用 lt_dlinit/lt_dlopen(NULL)/lt_dlsym(printf)/lt_dlclose/lt_dlexit 真实走 dlopen 链路"
    command: "./test_libltdl"

# 测试断言总数 (近似值, 用于质量评估): 5 个 API 调用点 + 各返回值校验
assertion_count: 8
