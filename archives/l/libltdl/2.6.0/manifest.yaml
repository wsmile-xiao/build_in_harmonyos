# libltdl 2.6.0 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0
# libltdl = GNU libtool 2.6.0（2026-01 alpha）源码树中的运行时动态加载库；
# 本配方打包 libltdl 库 + 头文件（不含 libtoolize/libtool 工具，见 notes.md）。

version: "2.6.0"

software: libltdl

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GNU alpha 官方源，R39；libtool 2.6.0 为 2026-01 alpha 发布）
  url: "https://alpha.gnu.org/gnu/libtool/libtool-2.6.0.tar.xz"

  # 源码校验和（本地 sha256sum 实测）
  sha256: "69e6d28ae880fda08e0dc080ef2e38077ea2765a0d84e1afcfcfe1e605c911ac"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表（显式三元组跳 config.guess 对 HarmonyOS 的探测，
  # 与历史 libtool 2.5.4.1 同法；--disable-shared 由配方按 R26 注入）
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"

  # 编译依赖列表（无外部 conan 依赖，dlopen 由系统 libc 提供，W0 已核验）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁：发布 tarball 自带 configure，无需自举；R8 无平台宏改动。
# 适配修复（E011 umask、三元组、MAKEINFO）全部在 conanfile.py 构建阶段完成。
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libtool 2.6.0 alpha 发布 tarball 来自 alpha.gnu.org（R39 合法），自带 configure 无需 autoreconf"
  - "libltdl 从 libtool 整树 configure/make/install 产出，安装到 include/ltdl.h + include/libltdl/*.h + lib/libltdl.*"
  - "libltdl.la dependency_libs 为空：系统 libc 已含 dlopen，无需 -ldl"
  - "上游 testsuite 的 66 个非预期失败全部根因于本机 autom4te 缺失（aclocal 引用未替换的 @am_AUTOM4TE@ 退出 127），非 libltdl 缺陷；CI 环境不跑上游 testsuite（见 notes.md 申报表）"
  - "R26 系统同名库：默认 shared=False 静态打包，避免同名动态库污染系统路径"
  - "E011 HMDFS：configure 里 config.status 用 umask 077 建临时目录不可写（UID 映射），构建期把 umask 077 放宽为 002"
  - "设备/CI 无 texinfo：make install 需带 MAKEINFO=true 跳过 doc/libtool.info"
