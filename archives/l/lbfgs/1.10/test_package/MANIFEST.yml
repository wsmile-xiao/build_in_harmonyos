# test_package MANIFEST — lbfgs 1.10
software: lbfgs
version: "1.10"
test_type: consumer_assertion

# 上游官方测试：无测试套件（无 tests/ 目录、无 make check 目标）。
# 上游 automake 唯一接入的可执行验证程序为 sample/sample.c
#（sample/Makefile.am noinst_PROGRAMS=sample）：100 维 Rosenbrock
# 优化实跑至收敛（status=LBFGS_SUCCESS=0），仅打印不断言。
# sample.cpp 为 EXTRA_DIST（C++ 绑定示例），未接入 automake 构建。
# 层1 已在 conanfile build() 内编译并实跑 sample.c（sample.cpp 附带编译）。
upstream_check_command: "sh autogen.sh && ./configure && make && (cd sample && ./sample)"
upstream_check_count: 1

# test_package 测试：test_lbfgs.c 实体消费者断言（4 组 12 条）：
#   1) lbfgs_malloc/lbfgs_parameter_init API（3 条）
#   2) 100 维 Rosenbrock 收敛断言（LBFGS_SUCCESS + fx<1e-10 + 解向量，4 条）
#   3) OWL-QN L1 正则软阈值解 (0.5, 1.5)（3 条）
#   4) 鸿蒙特有：入参错误路径（n<=0 / epsilon<0）返回负错误码（2 条）
test_package_tests:
  - "分配/参数初始化 API 断言（3 条）"
  - "Rosenbrock 100 维收敛断言（4 条，与上游 sample 同问题）"
  - "OWL-QN L1 正则路径断言（3 条）"
  - "鸿蒙特有：参数错误路径断言（2 条）"
assertion_count: 12
fixture_count: 0
fixture_origin: "无 fixtures"
