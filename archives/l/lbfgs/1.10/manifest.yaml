# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "git tag 无预生成 configure（仅 autogen.sh + configure.in，AC_PREREQ 2.59 上古 autotools），沙箱无 autoconf/automake/libtool → 单源直编（lib/lbfgs.c 为唯一编译单元）"
  - "lbfgs.c:64-66 的 #include <config.h> 有 HAVE_CONFIG_H 守护 → 直编不定义该宏即无需手工合成 config.h（与 ctemplate 无条件包含不同）"
  - "SSE 优化头经编译期宏探测 `#if defined(USE_SSE) && defined(__SSE2__)`：aarch64 无 __SSE__ → 自动落 arithmetic_ansi.h 纯 ANSI 路径，无需裁剪源码"
  - "configure.in AC_CHECK_LIB(m, fabs) → 静态库消费者须 -lm（package_info system_libs）"
  - "上游 automake 唯一接入的测试程序是 sample/sample.c（noinst_PROGRAMS，100 维 Rosenbrock 实跑收敛）；sample.cpp 仅 EXTRA_DIST 未接入构建"

