software: lua-sqlite
display: "LuaSQL"
description: "SQLite3 driver for LuaSQL — database connectivity for Lua"
category: library
homepage: "https://lunarmodules.github.io/luasql/"
license: MIT
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "LuaSQL 编译为 .so 共享库，由 Lua 运行时通过 require('luasql.sqlite3') 加载"
    - "编译时需要 Lua headers 和 sqlite3 库（通过 Conan 依赖管理）"
    - "Lua 符号在运行时由宿主解释器解析，不链接 -llua"
    - "sqlite3 静态链接进 .so"
    - "无需补丁，所有路径通过 make 变量传递"
    - ".so 安装到 lib/luasql/ 目录以匹配 Lua require 路径"
  common_dependencies:
    - lua
    - sqlite3

# 版本索引
versions:
  "2.6.0":
    status: published
    build_date: "2026-08-07"
