# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libquvi-scripts/0.9.20131130
homepage: "https://repo.or.cz/libquvi-scripts.git"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libquvi-scripts 是纯 Lua 脚本包，上游测试需要 libquvi 库支持
# 测试在 tests/ 目录下，需要 --with-tests 选项和 libquvi 依赖
upstream_tests:
  - file: "tests/lib/env.c"
    source: "libquvi-scripts-0.9.20131130/tests/lib/env.c"
    description: "测试环境初始化 (需要 libquvi)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "conanfile.py"
    description: "验证安装的 Lua 脚本文件存在性和版本信息"
    command: "conan test test_package libquvi-scripts/0.9.20131130"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
