software: libplacebo
display: "libplacebo"
description: "Video rendering and color processing library"
category: gfx               # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://code.videolan.org/videolan/libplacebo"
license: LGPL-2.1-or-later
build_system: meson               # 常用构建系统（可被版本级覆盖）

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Git submodule fast_float 需手动补充"
    - "禁用 OpenGL/Vulkan/D3D11（缺少 loader 或不适用）"
    - "编译为有限功能版本（CPU 端视频处理）"
  common_dependencies:
    - meson
    - ninja

# 版本索引（所有已归档版本，含状态）
versions:
  "7.349.0":
    status: built             # published | built | failed | archived
    build_date: "2026-05-21"