software: libplacebo
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.349.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.349.0"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（验证脚本要求）
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/libplacebo-v7.349.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--buildtype=release"
    - "-Dopengl=disabled"
    - "-Dvulkan=disabled"
    - "-Dd3d11=disabled"
    - "-Dglslang=disabled"
    - "-Dshaderc=disabled"
    - "-Ddemos=false"
    - "-Dtests=false"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# Hints 配置
# ============================================================

# git submodule 补充脚本
# 背景: tar.gz 包不包含 fast_float submodule
hints:
  post_download: "hints/post-download.sh"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libplacebo tar.gz 不包含 git submodules（fast_float），需用 hints/post-download.sh 补充"
  - "Meson 构建系统，禁用图形 API (OpenGL/Vulkan/D3D11) 可在鸿蒙上编译"
  - "fast_float 目录结构必须是 3rdparty/fast_float/include/fast_float/*.h"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
