# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: librubberband/4.0.0
homepage: "https://breakfastquay.com/rubberband/"

# Upstream test command
upstream_check_command: "meson test"

# Upstream tests are integrated in conanfile.py build() via meson test
upstream_test_in_build: true
upstream_test_command: "meson test"

# Upstream test programs (from meson.build test() registrations —
# src/test/*.cpp compiled into a single `tests` boost unit-test binary,
# registered as 8 meson test targets)
upstream_tests:
  - file: src/test/TestAllocators.cpp
    source: rubberband-4.0.0/src/test/TestAllocators.cpp
    description: "Allocator unit tests"
    command: "meson test Allocators"
  - file: src/test/TestFFT.cpp
    source: rubberband-4.0.0/src/test/TestFFT.cpp
    description: "FFT implementation unit tests"
    command: "meson test FFT"
  - file: src/test/TestResampler.cpp
    source: rubberband-4.0.0/src/test/TestResampler.cpp
    description: "Resampler unit tests"
    command: "meson test Resampler"
  - file: src/test/TestVectorOps.cpp
    source: rubberband-4.0.0/src/test/TestVectorOps.cpp
    description: "Vector operations unit tests"
    command: "meson test VectorOps"
  - file: src/test/TestVectorOpsComplex.cpp
    source: rubberband-4.0.0/src/test/TestVectorOpsComplex.cpp
    description: "Complex vector operations unit tests"
    command: "meson test VectorOpsComplex"
  - file: src/test/TestSignalBits.cpp
    source: rubberband-4.0.0/src/test/TestSignalBits.cpp
    description: "Signal helpers unit tests"
    command: "meson test SignalBits"
  - file: src/test/TestStretchCalculator.cpp
    source: rubberband-4.0.0/src/test/TestStretchCalculator.cpp
    description: "Stretch calculator unit tests"
    command: "meson test StretchCalculator"
  - file: src/test/TestStretcher.cpp
    source: rubberband-4.0.0/src/test/TestStretcher.cpp
    description: "Stretcher integration unit tests"
    command: "meson test Stretcher"

# Test sources linked into the tests binary but not registered as
# separate meson test() targets upstream:
#   src/test/TestLiveShifter.cpp   (R3 live shifter; no test() entry)
#   src/test/TestBinClassifier.cpp (bin classifier; no test() entry)

# Consumer-side tests in test_package
test_package_tests:
  - file: test_package.c
    description: "Consumer test: version check, real-time C API stretch of 1 kHz sine at 1.5x, output length + energy sanity"
    command: "./test_librubberband"

# Approximate assertion count (boost test assertions across 8 suites)
assertion_count: 8
