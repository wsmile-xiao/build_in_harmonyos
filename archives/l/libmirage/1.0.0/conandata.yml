# conandata.yml — libmirage 1.0.0
# Source: official SourceForge CDEmu project files (flat layout),
# sha256 verified on device 2026-09-04.

sources:
  url: "https://downloads.sourceforge.net/project/cdemu/libmirage/libmirage-1.0.0.tar.bz2"
  sha256: "3d1dbd6c7894a94e98292cc07350fea1111249a955d044603d96f4a364ee6f8b"

patches:
  - patch_file: "patches/0001-config-guess.patch"
    patch_description: "Recognize HarmonyOS: emit aarch64-unknown-linux-ohos with echo+exit (E007 autotools OHOS patch set, 2007-era config.guess form)"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub.patch"
    patch_description: "Accept linux-ohos kernel-OS combination in config.sub whitelist (E007 + libdaemon 0.14 same-era form)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: create private tmp dirs with umask 022; HMDFS rejects self-writes under umask 077"
    patch_type: "portability"
  - patch_file: "patches/0005-parsers-pure-parser.patch"
    patch_description: "parsers (image-ccd/cue/toc): replace deprecated %pure_parser with %define api.pure true; bison 3.8.2 must generate the reentrant skeleton so the generated parser passes yyscanner to the %reentrant flex lexer"
    patch_type: "portability"
