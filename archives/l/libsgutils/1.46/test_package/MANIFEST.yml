# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsgutils/1.46
homepage: "https://github.com/hreinecke/sg3_utils"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (testing/ 目录 17 个独立可执行用例，详见 reports/upstream-test-ledger.md)
upstream_tests:
  - file: testing/sg_sense_test.c
    source: libsgutils-1.46/testing/sg_sense_test.c
    description: "sense 数据解码头解析自测（无硬件依赖）"
    command: "./sg_sense_test"
  - file: testing/tst_sg_lib.c
    source: libsgutils-1.46/testing/tst_sg_lib.c
    description: "sg_lib 公开函数自测（无硬件依赖）"
    command: "./tst_sg_lib --sense --unaligned --printf --exit"
  - file: testing/sgs_dd.c
    source: libsgutils-1.46/testing/sgs_dd.c
    description: "sg 版 dd 工具文件模式复制验证"
    command: "./sgs_dd if=<input.dat> of=<output.dat> bs=512 count=4"
  - file: testing/sg_queue_tst.c
    source: libsgutils-1.46/testing/sg_queue_tst.c
    description: "sg 队列测试（需 /dev/sg* 硬件，构建机无）"
    command: "./sg_queue_tst <sg_device>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者用例：仅经公开头文件 scsi/sg_lib.h 调用 sg_lib_version/sg_get_category_sense_str/hex2str 并断言"
    command: "./test_libsgutils"
  - file: ohos_test.c
    description: "鸿蒙专项测试：OHOS 平台 sense 解码正确性（sg_scsi_normalize_sense/sg_err_category_sense/sg_get_sense_str）"
    command: "./test_libsgutils_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
