# test_package/MANIFEST.yml — libpackagekit 1.3.6
# 上游官方测试声明文件（R51 三歩法：清点 → 运行 → 如实回填）

package: libpackagekit/1.3.6
homepage: "https://github.com/PackageKit/PackageKit"

# 上游测试命令（meson test）
upstream_check_command: "meson test -C build --print-errorlogs"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C {build_folder} --print-errorlogs (ignore_errors=True)"

# 上游实际运行的测试程序（清点：tests/meson.build 注册 3 个）
upstream_tests:
  - file: tests/pk-test-library.c
    source: PackageKit-1.3.6/tests/pk-test-library.c
    description: "prototype 级库单元测试（common/enum/bitfield/package-id/package-ids/results/package/offline 等 10 个子用例），运行于 daemon 之外，与库组件直接对应"
    command: "meson test pk-test-library"
    result: "7/10 通过；offline 子用例失败：g_mkdir_with_parents(\"/tmp/PackageKit-self-test\") 因 OHOS /tmp 只读（E002 平台限制），其余 7 项通过"
  - file: tests/pk-test-daemon-internal.c
    source: PackageKit-1.3.6/tests/pk-test-daemon-internal.c
    description: "daemon 内部测试（pk-backend/pkg-scheduler 等），需编译 daemon 组件"
    command: "meson test pk-test-daemon-internal"
    result: "未运行：本包为库组件（daemon_tests=false 关闭 daemon 测试目标），如实声明未覆盖"
  - file: tests/pk-test-e2e.c
    source: PackageKit-1.3.6/tests/pk-test-e2e.c
    description: "端到端测试，需运行 packagekitd + backend + DBus 会话"
    command: "meson test pk-test-e2e"
    result: "未运行：需完整 daemon/DBus 环境，库组件包不提供，如实声明未覆盖"

# test_package 中自带的测试（消费者视角验证，R34 实质测试）
test_package_tests:
  - file: test.c
    description: "消费者测试：include <packagekit-glib2/packagekit.h>，创建 PkControl 对象（pk_control_new），验证 PK_MAJOR/MINOR/MICRO_VERSION 宏与对象类型（PK_IS_CONTROL）"
    command: "./test_libpackagekit"

# 测试断言总数（近似值）
assertion_count: 13