# 版本级 manifest — libpackagekit 1.3.6
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.3.6"

# 软件名
software: "libpackagekit"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/PackageKit/PackageKit/archive/refs/tags/v1.3.6.tar.gz"

  # 源码校验和
  sha256: "799a6e7c3e94d43d254cf793ee19761b475a9b2e86af320d1de1cf39f3fe70a5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
  - "-Dsystemd=false"
  - "-Dgobject_introspection=false"
  - "-Dman_pages=false"
  - "-Dgtk_doc=false"
  - "-Dlegacy_tools=false"
  - "-Dpackaging_backend=dummy"
  - "-Ddaemon_tests=false"
  - "-Dcron=false"
  - "-Dpython_backend=false"
  - "-Dgtk_module=false"
  - "-Dgstreamer_plugin=false"
  - "-Dbash_completion=false"
  - "-Dbash_command_not_found=false"
  - "-Doffline_update=false"
  - "--wrap-mode=nodownload"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "glib/2.84.0"
  - "sqlite3/3.53.4"
  - "polkit/127"
  - "jansson/2.15.1.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-policy-meson.build.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS musl gettext: libintl.h 为空 stub，需用 -Dgettext(x)=(x) -Ddgettext(d,x)=(x) -Dbindtextdomain(d,l)=(d) 等宏（polkit 同款）"
- "Policy XML 的 i18n.merge_file 需跳过（msgfmt 无 ITS 规则支持），直接 install_data 原文件"
- "OHOS dlopen 需要 ELF 签名（binary-sign-tool sign），否则运行时报 symbol not found"
- "HMDFS 软链接对 musl loader 不可靠（E050），.so 版本链接需替换为真实副本"
- "PkgConfigDeps 只生成 glib-2.0.pc，缺 gio-2.0/gio-unix-2.0 等子 .pc，需从 glib 包复制并合并 mkenums 工具变量"

patch_generation:
  method: manual
  description: "0001-policy-meson.build.patch — 修复 i18n.merge_file ITS 规则不可用"

patch_classification:
  - file: 0001-policy-meson.build.patch
    type: portability
    platform_only: True
    guard: none
