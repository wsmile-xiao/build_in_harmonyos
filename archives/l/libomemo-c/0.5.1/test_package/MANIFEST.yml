# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file

package: libomemo-c/0.5.1
homepage: "https://github.com/dino/libomemo-c"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "v0.5.1.tar.gz (GitHub release dino/libomemo-c)"
  source_sha256: "d1b65dbf7bccc67523abfd5e429707f540b2532932d128b2982f0246be2b22a0"
  build_system: "CMake"
  test_definition: "tests/CMakeLists.txt registers 10 tests via add_test(NAME ...) commands; each is a Check-based C executable"
  dependency: "check/0.15.2 and openssl (vendored protobuf-c runtime)"
  portability_changes: []
  counting_unit: "ctest entry (add_test)"
  verification: "grep -c 'add_test' tests/CMakeLists.txt => 10; ctest -N lists 10 tests"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_test_total: 10
upstream_test_count_method: ctest_entries

upstream_tests:
  - file: tests/test_curve25519.c
    source: libomemo-c-0.5.1/tests/test_curve25519.c
    description: "Curve25519 agreement and key generation tests"
    command: "./test_curve25519"
  - file: tests/test_hkdf.c
    source: libomemo-c-0.5.1/tests/test_hkdf.c
    description: "HKDF key derivation tests"
    command: "./test_hkdf"
  - file: tests/test_ratchet.c
    source: libomemo-c-0.5.1/tests/test_ratchet.c
    description: "Double ratchet tests"
    command: "./test_ratchet"
  - file: tests/test_protocol.c
    source: libomemo-c-0.5.1/tests/test_protocol.c
    description: "Signal protocol message tests"
    command: "./test_protocol"
  - file: tests/test_session_record.c
    source: libomemo-c-0.5.1/tests/test_session_record.c
    description: "Session record serialization tests"
    command: "./test_session_record"
  - file: tests/test_session_cipher.c
    source: libomemo-c-0.5.1/tests/test_session_cipher.c
    description: "Session cipher encrypt/decrypt tests"
    command: "./test_session_cipher"
  - file: tests/test_session_builder.c
    source: libomemo-c-0.5.1/tests/test_session_builder.c
    description: "Session builder (pre-key bundle) tests"
    command: "./test_session_builder"
  - file: tests/test_key_helper.c
    source: libomemo-c-0.5.1/tests/test_key_helper.c
    description: "Key helper generation tests"
    command: "./test_key_helper"
  - file: tests/test_simultaneous_initiate.c
    source: libomemo-c-0.5.1/tests/test_simultaneous_initiate.c
    description: "Simultaneous initiate tests"
    command: "./test_simultaneous_initiate"
  - file: tests/test_sender_key_record.c
    source: libomemo-c-0.5.1/tests/test_sender_key_record.c
    description: "Sender key record tests"
    command: "./test_sender_key_record"

test_package_tests:
  - file: test.c
    description: "Consumer smoke test exercising libomemo-c curve_internal_fast_tests via signal_context"
    command: "./test_libomemo-c"

assertion_count: 10
