# 软件级 manifest
# 文件位置: archives/l/last-align/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: last-align
display: "LAST"
description: "LAST 大规模基因组序列比对工具集（lastdb/lastal/last-split/last-pair-probs 等）"
category: utility
homepage: "https://gitlab.com/mcfrith/last"
license: GPL-3.0-or-later

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "plain Makefile 项目（非 autotools），顶层 makefile 委托 src/makefile 编译"
    - "CXXFLAGS 默认含 -msse4（x86 专属），aarch64 上为 unused-argument 警告，配方覆盖 CXXFLAGS 移除"
    - "SIMD 代码 src/mcf_simd.hh 自动选择 __ARM_NEON 路径，aarch64 无需补丁"
    - "链接 -lz，zlib/1.3.1 由 Conan 依赖注入 CPPFLAGS/LDFLAGS"
    - "顶层 makefile install 忽略 DESTDIR，用 prefix= 覆盖；配方用 copy 打包 bin/"
    - "上游测试脚本含硬编码 /tmp（E002 只读），测试运行需 TMPDIR/私有目录适配"
  common_dependencies:
    - zlib

# ============================================================
# 版本索引
# ============================================================

versions:
  "1652":
    status: built
    build_date: "2026-09-19"
