# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: last-align/1652
homepage: "https://gitlab.com/mcfrith/last"

# 上游测试命令 (LAST 是 plain Makefile 项目, 无 configure/ctest; 测试为 test/*.sh 回归脚本)
upstream_check_command: "cd test && ./last-test.sh (main suite, 68 subtests) 及 10 个独立回归脚本"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - name: "LAST 主回归套件 (last-test.sh)"
    source: "upstream test/last-test.sh"
    description: "68 个 lastal/lastdb/last-train 子测试, 输出与 last-test.out 参考比对"
    command: "cd test && ./last-test.sh"
  - name: "last-split 回归 (last-split-test.sh)"
    source: "upstream test/last-split-test.sh"
    description: "last-split 选项回归测试"
    command: "cd test && ./last-split-test.sh"
  - name: "maf 工具回归 (maf-convert/cut/linked/swap-test.sh)"
    source: "upstream test/maf-*-test.sh"
    description: "maf-convert/maf-cut/maf-linked/maf-swap 4 个脚本回归测试"
    command: "cd test && ./maf-convert-test.sh && ./maf-cut-test.sh && ./maf-linked-test.sh && ./maf-swap-test.sh"
  - name: "last-train 回归 (last-train-test.sh)"
    source: "upstream test/last-train-test.sh"
    description: "last-train 训练参数回归测试"
    command: "cd test && ./last-train-test.sh"
  - name: "last-pair-probs 回归 (last-pair-test.sh)"
    source: "upstream test/last-pair-test.sh"
    description: "last-pair-probs 配对读长距离估计回归测试"
    command: "cd test && ./last-pair-test.sh"
  - name: "last-postmask/last-map-probs 回归"
    source: "upstream test/last-postmask-test.sh, last-map-probs-test.sh"
    description: "last-postmask 与 last-map-probs 回归测试"
    command: "cd test && ./last-postmask-test.sh && ./last-map-probs-test.sh"
  - name: "last-dotplot 回归 (last-dotplot-test.sh)"
    source: "upstream test/last-dotplot-test.sh"
    description: "last-dotplot 绘图脚本回归 (依赖 Python PIL, 本环境缺 PIL 无法运行)"
    command: "cd test && ./last-dotplot-test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试: 调用 lastdb/lastal/last-split --version, 并对真实序列执行 lastdb 建库 + lastal 比对, 验证 MAF 输出含比对记录"
    command: "conan test_package"

# 鸿蒙特有测试数（规则 12 口径：PC 平台特有 / 鸿蒙适配特有）
# test_package/test.sh 消费者冒烟测试在 OHOS 实机 conan create 内执行（1 用例，6 断言）
harmony_specific_test_count: 1

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
