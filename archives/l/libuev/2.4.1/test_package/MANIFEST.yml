# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试: automake TESTS 共 7 个独立用例，双口径 7/7 通过

package: libuev/2.4.1
homepage: "https://github.com/troglobit/libuev"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (7/7 PASS)
upstream_tests:
  - file: active
    source: libuev-2.4.1/test/active.c
    description: "timer/cron watcher active 状态检查"
    command: "./active"
  - file: api
    source: libuev-2.4.1/test/api.c
    description: "公开 API 全量调用冒烟"
    command: "./api"
  - file: complete
    source: libuev-2.4.1/test/complete.c
    description: "timer 周期完成与生命周期回调"
    command: "./complete"
  - file: cronrun
    source: libuev-2.4.1/test/cronrun.c
    description: "cron 定时任务真实触发"
    command: "./cronrun"
  - file: signal
    source: libuev-2.4.1/test/signal.c
    description: "signalfd 信号与子进程 SIGCHLD/SIGSEGV"
    command: "./signal"
  - file: timer
    source: libuev-2.4.1/test/timer.c
    description: "timer 过期事件"
    command: "./timer"
  - file: event
    source: libuev-2.4.1/test/event.c
    description: "event 唤醒机制"
    command: "./event"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开 uev.h API 初始化事件循环并运行 timer"
    command: "./test_libuev"

# 测试断言总数 (近似值, 用于质量评估): 7 个独立用例 + 1 个消费者用例
assertion_count: 8