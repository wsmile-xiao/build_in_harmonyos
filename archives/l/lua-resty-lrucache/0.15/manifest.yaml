software: lua-resty-lrucache
version: "0.15"
status: built
build_system: makefile
build_date: "2026-06-11"

source_url: "https://github.com/openresty/lua-resty-lrucache/archive/refs/tags/v0.15.tar.gz"

dependencies:
  - lua/5.4.7

patches_applied: []

knowledge_gained:
  - "lua-resty-lrucache 是纯 Lua 库，无编译步骤，只需安装 Lua 文件"
  - "依赖 LuaJIT 的 FFI 功能，标准 Lua 不支持"
  - "测试需要 OpenResty 环境和 Test::Nginx::Socket::Lua Perl 模块"
  - "安装路径为 {PREFIX}/lib/lua/{LUA_VERSION}/resty/lrucache.lua 和 pureffi.lua"

