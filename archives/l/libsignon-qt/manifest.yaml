software: libsignon-qt
display: "libsignon-qt"
description: "Qt6 client library for the Single Sign On daemon (signond) — online accounts credential storage/SSO API"
category: system
homepage: "https://gitlab.com/accounts-sso/signond"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游只提供 qmake 工程（TARGET=signon-qt5 / CMAKE_BASENAME=SignOnQt5），且 ohpcd 的 qtbase 无 OHOS mkspec；本包经 exports_sources 自带 CMakeLists.txt，按 Qt6 形态构建（目标 signon-qt6、CMake 包 SignOnQt6）。"
    - "ohpcd qtbase 根 cpp_info 为 cmake_find_mode=none，CMakeDeps 不产出 Qt6 config；配方 generate() 把 <qtbase>/lib/cmake/Qt6 写入 Qt6_DIR 缓存变量。"
    - "lib/SignOn 内部以 <SignOn/xxx.h> 互相包含，构建期 include 根为 lib/（安装期为 include/signon-qt6）；AuthService/Identity/Error 等无扩展名转发头按 FILES 安装。"
    - "无补丁、仅依赖 qtbase/6.11.1.1；默认静态构建（-o libsignon-qt/*:shared=True 可切共享库）。"
    - "上游 QtTest 套件需运行中的 signond 守护进程 + 会话总线，未集成进 recipe build()；CI 回归由 test_package（20 断言，纯值类型 API）承担。"
  common_dependencies:
    - "qtbase/6.11.1.1"

versions:
  "8.61":
    status: published
    build_date: "2026-10-03"
