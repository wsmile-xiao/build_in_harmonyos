# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游 (signond 8.61) 使用 qmake 构建；测试工程位于 tests/tests.pro
# (SUBDIRS = passwordplugintest libsignon-qt-tests signond-tests extensions)。
# 本包只构建客户端库 lib/SignOn，相关测试工程为 tests/libsignon-qt-tests，
# 它通过 D-Bus 驱动运行中的 signond 守护进程 (testsession.conf)。

package: libsignon-qt/8.61
homepage: "https://gitlab.com/accounts-sso/signond"

# 上游测试命令 (qmake 工程，无 make check 目标；先构建测试工程再运行套件)
upstream_check_command: "qmake tests/libsignon-qt-tests/libsignon-qt-tests.pro && make && ./tests/libsignon-qt-tests/libsignon-qt-tests"

# conanfile.py build() 中未集成上游测试：该套件需要运行中的 signond 守护进程
# 与会话总线 (testsession.conf)，在干净 CI 容器内不可用。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/libsignon-qt-tests/libsignon-qt-tests.pro)
# 该 .pro 的 SOURCES 注册 6 个源文件，其中仅 2 个类含测试函数（合计 42 项）；
# 其余为辅助类（D-Bus 信号槽）或交互回调，无测试函数。
# 注意：tests/testsinglesignon.h（2 项）未注册进本 .pro 的 SOURCES，不属于本套件。
upstream_tests:
  - file: ssotestclient.h
    source: signond-8.61/tests/libsignon-qt-tests/ssotestclient.h
    description: "客户端套件主控 (ssotestclient.cpp 内含 int main)：驱动 signond 的 AuthService/AuthSession/Identity 全流程，20 项测试函数"
    command: "./tests/libsignon-qt-tests/libsignon-qt-tests"
  - file: testauthsession.h
    source: signond-8.61/tests/libsignon-qt-tests/testauthsession.h
    description: "AuthSession / AuthService 客户端会话流程，22 项测试函数"
    command: "./tests/libsignon-qt-tests/libsignon-qt-tests testauthsession"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libsignon_qt.cpp
    description: "消费者测试：链接 SignOnQt6::SignOnQt6，调用 SignOn::Error / SignOn::SessionData / SignOn::IdentityInfo 公开 API (20 处断言，无需 D-Bus)"
    command: "./test_libsignon_qt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
