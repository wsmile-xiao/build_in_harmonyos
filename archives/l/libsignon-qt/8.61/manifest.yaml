# 版本级 manifest — libsignon-qt 8.61 (OHOS PC)
# 文件位置: archives/l/libsignon-qt/8.61/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "8.61"
software: "libsignon-qt"

# 编译状态
# published | built | failed | archived
status: published

build_date: "2026-10-03"
build_system: cmake   # 上游为 qmake 工程，配方经 exports_sources 自带 CMakeLists.txt

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://gitlab.com/accounts-sso/signond/-/archive/VERSION_8.61/signond-VERSION_8.61.tar.gz"
  sha256: "3dd57c25e1bf1583b2cb857f96831e38e73d40264ff66ca43e63bb7233f76828"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DQt6_DIR=<qtbase package>/lib/cmake/Qt6"   # 由配方 generate() 注入
  dependencies:
    - qtbase/6.11.1.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 signond 8.61 只提供 qmake 工程（signon.pro / libsignon-qt.pri，TARGET=signon-qt5），ohpcd 的 qtbase 包无 OHOS mkspec，配方自带 CMakeLists.txt 走 CMake 构建"
  - "下游 kaccounts-integration 需要 CMake 包 SignOnQt6（find_package(SignOnQt6 8.55 CONFIG)）与变量 SIGNONQT_LIBRARIES/SIGNONQT_INCLUDE_DIRS，故自写 SignOnQt6Config.cmake.in 复刻上游 SignOnQt5Config.cmake.in 的变量契约"
  - "ohpcd qtbase 根 cpp_info 为 cmake_find_mode=none，CMakeDeps 不生成 Qt6 config；配方在 generate() 中把 <qtbase>/lib/cmake/Qt6 写进 Qt6_DIR 缓存变量"
  - "lib/SignOn 源码以 <SignOn/xxx.h> 形式互相包含（.pri: INCLUDEPATH += . ..），构建期 include 根必须是 lib/（SignOn 的父目录），安装期才是 include/signon-qt6"
  - "AuthService/AuthSession/Error/Identity/IdentityInfo/SecurityContext/SessionData 是无扩展名的转发头（各 #include <SignOn/xxx.h>），安装时须按 FILES 处理而非 DIRECTORY"
  - "上游测试套件 tests/libsignon-qt-tests 需要运行中的 signond 守护进程 + 会话总线（testsession.conf），干净 CI 容器内不可用，故 recipe build() 不集成上游测试"
