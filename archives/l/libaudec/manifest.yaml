# 软件级 manifest — libaudec（ARCHIVE-SPEC v2.0）

software: libaudec
display: "libaudec"
description: "Zrythm 项目的音频解码/重采样封装库（libsndfile + minimp3 + libsamplerate）"
category: library
homepage: "https://github.com/zrythm/libaudec"
license: AGPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建：tool_requires meson/1.11.0 + ninja/1.12.1（设备无 ambient meson）；机器文件锁定 ar/ranlib 等绝对路径（worker llvm-* 裸名会报 Unknown linker）"
    - "静态交付（R26）：上游 both_libraries() 连带的 .so 无法与 ohpcd libsamplerate 非-PIC 静态库链接，patch 0001 改 static_library()"
    - "pkg-config 桥接：samplerate.pc 别名（PkgConfigDeps pkg_config_aliases）+ 显式注入 PKG_CONFIG_PATH"
    - "meson install 改写 RUNPATH 破坏 .codesign，安装后重签 ELF（E077）"
    - "上游 3 项 meson test 在 build() 内运行；test_package 另有 12 断言消费者测试"
  common_dependencies:
    - libsndfile
    - libsamplerate

versions:
  "0.3.4":
    status: built
    build_date: "2026-09-21"
    conan_ref: "libaudec/0.3.4"
