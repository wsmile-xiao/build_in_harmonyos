# test_package/MANIFEST.yml — libaudec 0.3.4
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md

package: libaudec/0.3.4
homepage: "https://github.com/zrythm/libaudec"

# 上游测试发现命令：tests/meson.build 在 `tests` 选项（默认 true）下注册
# 3 个 meson test 条目；`meson test --list` 枚举结果与之逐一对应。
upstream_check_command: "meson test --list -C <build>（tests/meson.build 注册计数 = 3）"

# conanfile.py build() 方法中已集成上游测试：
# `meson test -C <build_folder> --print-errorlogs`（boxfort 同款先例）
upstream_test_in_build: true
upstream_test_command: "meson test -C <build_folder> --print-errorlogs"

upstream_tests_exist: true
upstream_test_total: 3
# 计数口径：meson test 注册数（tests/meson.build 中 3 个 test() 调用），
# 与 `meson test --list` 输出一致；不含 test_package 消费者用例。
upstream_test_count_method: "meson test registration（tests/meson.build）"
upstream_test_audit:
  - path: "tests/meson.build (tag v0.3.4)"
    finding: "get_option('tests') 为真时注册 3 个 meson test：wav_test（test_exe + test.wav, 44000）、mp3_test（test_exe + test.mp3, 48000）、log_test（log_test_exe + test.wav, 44000）；test_exe 由 tests/test.c 编译，log_test_exe 由 tests/log.c 编译。无其他 test() 调用，注册总数确定为 3。"
  - path: "tests/test.c (tag v0.3.4)"
    finding: "单一断言程序，按文件名分派期望值（test.wav: 164571 帧 @48000 声道2；test.mp3: 291583 帧 @44100 声道2），含 6 处活动 ad_assert（argc、sample_rate、frames、channels、samples_read>0、重采样后期望帧数精确相等；第 69 行 bpm 断言被上游注释掉）。"
  - path: "tests/log.c (tag v0.3.4)"
    finding: "1 处活动 ad_assert（argc>2），以静态库链接并解码 test.wav，覆盖静态链接产物可用性。"
  - path: "meson_options.txt (tag v0.3.4)"
    finding: "唯一定义选项 `tests`（boolean，默认 true）——配方 project_options['tests']='true' 保持默认语义。"
  - path: "测试数据"
    finding: "tests/test.wav 与 tests/test.mp3 随上游源码分发，解码路径：wav→libsndfile（ohpcd libsndfile/1.2.2）、mp3→上游捆绑 minimp3（头文件库，无外部依赖）。"

# 上游实际运行的测试程序（meson test 三项）
upstream_tests:
  - file: tests/test.c
    source: libaudec-0.3.4/tests/test.c（test.wav 数据集）
    description: "wav_test：解码 test.wav（164571 帧 @48000→44000 重采样），断言信息与重采样帧数精确相等（6 断言）"
    command: "meson test wav_test"
  - file: tests/test.c
    source: libaudec-0.3.4/tests/test.c（test.mp3 数据集）
    description: "mp3_test：minimp3 解码 test.mp3（291583 帧 @44100→48000 重采样），断言信息与重采样帧数精确相等（6 断言）"
    command: "meson test mp3_test"
  - file: tests/log.c
    source: libaudec-0.3.4/tests/log.c（静态库链接 + test.wav）
    description: "log_test：静态库消费方解码 test.wav @44000（1 断言）"
    command: "meson test log_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_audec.c
    description: "OHOS 消费者契约：运行期合成 16-bit PCM WAV（mono/48000Hz/16000 帧），经公共 API audec_finfo/audec_open/audec_read 完成恒等解码与 48000→24000 libsamplerate 下采样，12 项断言全部通过才退出 0"
    command: "./test_package"

# 测试断言总数（近似值, 用于质量评估）：
# 上游 13（test.c 6×2 + log.c 1×1）+ test_package 消费者 12
assertion_count: 25
