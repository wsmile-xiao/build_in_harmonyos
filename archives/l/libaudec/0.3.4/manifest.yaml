# 版本级 manifest — libaudec 0.3.4（ARCHIVE-SPEC v2.0）

version: "0.3.4"
software: "libaudec"
# O5：合并后 release upload 确认前一律 built
status: built
build_date: "2026-09-21"
build_system: "meson"

source:
  url: "https://github.com/zrythm/libaudec/archive/refs/tags/v0.3.4.tar.gz"
  sha256: "9a53eb292804818ddd8b19f749f64257ca586b54672494daf138092858935115"
  tar_format: tar.gz

build:
  system: meson
  # 交付形态：静态库（R26）。上游 both_libraries() 的 .so 变体无法与
  # ohpcd libsamplerate/0.2.2 非-PIC 静态库链接（见 patches/0001）。
  configure_options:
    - "-Ddefault_library=static（MesonToolchain project_options）"
    - "-Dtests=true（上游 3 项 meson test 在 build() 内运行）"
  dependencies:
    - libsndfile/1.2.2
    - libsamplerate/0.2.2
  tool_dependencies:
    - meson/1.11.0
    - ninja/1.12.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-meson-build-static-library.patch"

# 测试统计（采信轮干净轮实测，取数命令与逐字日志见 reports/test-report.md；
# 口径 TOTAL = PASS + FAIL + SKIP + NOT_RUN，上游与消费者分栏）
tests:
  upstream:
    total: 3          # meson test 注册数（tests/meson.build，3 个 test() 调用）
    passed: 3
    failed: 0
    skipped: 0
    not_run: 0
    assertions: 13    # tests/test.c 6×2 数据集 + tests/log.c 1×1
  harmonyos_consumer:
    total: 1          # test_package/test_audec.c
    passed: 1
    failed: 0
    skipped: 0
    not_run: 0
    assertions: 12    # SUMMARY: PASS (12 assertions, 0 failure(s))

# 知识沉淀（路径 B 草稿，行尾 knowledge_ref 为官方脚本唯一认可形态）
knowledge_gained:
  - "meson both_libraries() 无视 default_library 连带构建 .so；依赖静态库非 PIC（R_AARCH64_ABS64）时共享链接必失败，交付侧须改 static_library # knowledge_ref: E644"
  - "meson dependency('<name>') 按 .pc 名解析；conan 包未设 pkg_config_name 时用 PkgConfigDeps.set_property(pkg_config_aliases) 桥接，且 PKG_CONFIG_PATH 须显式注入 generators 目录 # knowledge_ref: E645"
