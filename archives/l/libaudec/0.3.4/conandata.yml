# conandata.yml — libaudec 0.3.4

sources:
  url: "https://github.com/zrythm/libaudec/archive/refs/tags/v0.3.4.tar.gz"
  sha256: "9a53eb292804818ddd8b19f749f64257ca586b54672494daf138092858935115"

patches:
  "0.3.4":
    - patch_file: "patches/0001-meson-build-static-library.patch"
      patch_description: >-
        Build the library with static_library() instead of both_libraries():
        both_libraries() unconditionally also builds a shared libaudec.so,
        which cannot link — the ohpcd libsamplerate/0.2.2 static library is
        non-PIC (R_AARCH64_ABS64 absolute relocations), rejected by lld for
        shared objects. Static-only is the R26 delivery; the installed
        `audec` CLI links the static library. Also rewrites the
        get_static_lib() call sites in meson.build and tests/meson.build
        (a static_library object has no such method).
      patch_type: "portability"
