# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfuse/3.16.1
homepage: "https://github.com/libfuse/libfuse"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游用 Meson，但 meson test 只注册了一个 wrong_command 用例，该用例在
# 非 subproject 构建下被设计为恒返回 1（提示改用 pytest）；真正的测试入口是
# test/ci-build.sh → python3 -m pytest test/。
upstream_check_command: "meson test -C builddir"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清点（详见 notes.md「上游测试清点」表）：
#   meson 注册用例：1（wrong_command，设计上恒返回 1）
#   C 测试程序：5（test_syscalls / test_setattr / test_write_cache /
#                  readdir_inode / release_unlink_race）
#   pytest 模块：3（test_examples.py / test_ctests.py / test_custom_io.py）
# 全部需要真实挂载 FUSE 文件系统（/dev/fuse + fusermount + root），
# OHOS 用户态不提供 /dev/fuse，故无法在目标平台执行；未修改任何上游测试。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >-
      真实链接 libfuse3 并调用公共 API：版本握手、选项解析、fuse_new 生命周期、
      低层 session 与多线程 loop（无 /dev/fuse 时的收敛，-EBADF 取值校验）
    command: "./test_libfuse"
  - file: test_fs_consumer.c
    description: >-
      鸿蒙特有完整消费者用例：注册完整 fuse_operations 表并经 fuse_new 构建 FUSE
      对象，驱动内存文件系统端到端工作流（构造输入→写文件→读回逐字节比对→getattr
      校验→readdir 列举→rename 移动→unlink 清理），并嵌入本移植的 pthread_cancel
      替代路径（LRU 清理线程启停、多线程 loop 收敛）做内容校验，全程确定性可复现
    command: "./test_fs_consumer"

# 测试断言总数（两个测试程序内的实际 check 调用数，均为取值/内容校验，无到达型断言）
assertion_count: 36
assertion_count_breakdown:
  value_assertions: 36
  reached_line_assertions: 0
