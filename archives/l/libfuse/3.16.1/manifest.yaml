# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（每条须带 knowledge_ref）
knowledge_gained:
  # OHOS musl libc 不声明也不导出 pthread_cancel 家族
  - "OHOS musl libc 既不声明也不导出 pthread_cancel/pthread_setcancelstate/pthread_setcanceltype/pthread_testcancel，链接期即 undefined symbol（knowledge_ref: E085）"
  # meson 对 harmonyos 的 host_machine.system() 返回 'harmonyos'
  - "Meson 交叉编译把 os=OHOS 映射为 host_machine.system() == 'harmonyos'，上游 `host_machine.system().startswith('linux')` 会漏掉 Linux 分支（knowledge_ref: E090）"
  # meson configuration_data 生成无值 #define → 必须用 #ifdef
  - "meson 的 configuration_data.set() 在布尔为真时写出无值 `#define HAVE_X`，为假时写出 `#undef HAVE_X`；因此 C 侧守卫只能用 #ifdef/#ifndef，写成 `#if HAVE_X` 会在为真时预处理报错（knowledge_ref: E090, DRAFT-LIBFUSE-3161-PTHREAD-CANCEL-MESON-FEATURE-DETECT-POLL）"
  # close() 不唤醒阻塞 read()
  - "OHOS 上另一线程 close(fd) 不会唤醒已阻塞在 read() 的同 fd 读取者，因此不能用「关闭 fd 兜底」释放 worker 线程；正确做法是有界 poll() 轮询 + O_NONBLOCK（knowledge_ref: E085, DRAFT-LIBFUSE-3161-PTHREAD-CANCEL-MESON-FEATURE-DETECT-POLL）"
  # W3 predl 的「还原」会把镜像 URL 写回 conandata.yml
  - "W3（build_and_test.sh）的镜像回退改写先于 Pre-download 备份，EXIT 陷阱「已还原为官方 URL」实际写回镜像列表；构建全绿但 conandata.yml 被静默写入 gh-proxy.com，命中 PF7/R39（knowledge_ref: DRAFT-LIBFUSE-3161-W3-PREDL-MIRROR-RESTORE-POLLUTES-CONANDATA）"

