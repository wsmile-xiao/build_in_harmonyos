# patch_classification — platform_only 判定口径（与 libfuse/2.9.9 一致）：
#   true  = 该改动的**效果**只对 OHOS 目标生效，在其它平台编译后为 no-op
#           或被条件编译排除 → 不宜直接上游化
#   false = 该改动是平台无关的可移植性修正，各平台行为与上游保持一致
#           → 欢迎上游化
patch_classification:
  - file: 0001-lib-fuse.c.patch
    type: portability
    platform_only: true
    guard: none
    description: "LRU 清理线程改为停止标志退出（无 pthread_cancel 时）(E085)；有 cancel 的平台走原路径，无效果变化"
  - file: 0002-lib-fuse_loop_mt.c.patch
    type: portability
    platform_only: true
    guard: none
    description: "多线程 loop 以有界 poll 释放 worker（无 pthread_cancel 时）(E085)；有 cancel 的平台走原路径，无效果变化"
  - file: 0003-lib-meson.build.patch
    type: portability
    platform_only: true
    guard: none
    description: "host_machine.system() == 'harmonyos' 时选用 Linux 挂载后端 mount.c (E090)"
  - file: 0004-meson.build.patch
    type: portability
    platform_only: false
    guard: none
    description: "cc.has_function('pthread_cancel') 特性探测：在**每个**平台都产出正确的 HAVE_PTHREAD_CANCEL，正是它保证 0001/0002 在 Linux 上被条件编译掉、行为与上游一致，属平台无关修正，可上游化"
