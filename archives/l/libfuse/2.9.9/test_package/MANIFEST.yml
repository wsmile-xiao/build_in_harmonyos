# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfuse/2.9.9
homepage: "https://github.com/libfuse/libfuse"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (libfuse 2.9.9 example/ 目录含示例，但 OHOS
# 因 pthread_cancel 未实现无法链接；make check 上游无独立测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 fuse_version() 验证 libfuse 符号可用 (R34)"
    command: "./test_libfuse"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
