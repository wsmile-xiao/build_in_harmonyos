# 软件级 manifest — libfuse
# 遵循 ARCHIVE-SPEC v2.0

software: "libfuse"
display: "libfuse (FUSE 3.x)"
description: "Filesystem in Userspace (fuse3)"
category: system
homepage: "https://github.com/libfuse/libfuse"
license: "LGPL-2.1-or-later AND GPL-2.0-only"
build_system: "meson"
latest_version: "3.16.1"

ohos_adaptation:
  key_points:
    - "Meson 把 os=OHOS 映射为 host_machine.system() == 'harmonyos'，上游的 startswith('linux') 判断会漏掉 Linux 分支"
    - "OHOS musl libc 不提供 pthread_cancel/pthread_setcancel*/pthread_testcancel，需要特性探测 + 退出标志/有界 poll 替代"
    - "meson 的 configuration_data 布尔为真时写出无值 #define，C 侧守卫必须用 #ifdef/#ifndef"
    - "OHOS 用户态无 /dev/fuse，无法运行任何需要真实挂载的上游测试"
    - "dl/rt 已并入 OHOS libc，无需额外系统库"
    - "3.x 需要 host_machine.system() 判断选了 Linux 的 mount.c（而非 mount_bsd.c），否则 mount.c 缺失导致 unmount 等符号未定义"
  common_dependencies: []

versions:
  "2.9.9":
    status: archived
    build_date: "2026-08-27"
    conan_ref: "libfuse/2.9.9"
  "3.16.1":
    status: built
    build_date: "2026-09-27"
    conan_ref: "libfuse/3.16.1"
    note: "conan-verify 与 W3 本地 CI 均通过；待 CI upload 成功后回填 published"
  "3.18.2":
