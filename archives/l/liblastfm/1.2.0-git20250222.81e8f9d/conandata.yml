sources:
  url: https://codeload.github.com/lastfm/liblastfm/tar.gz/81e8f9dc16
  sha256: cebd6459c8a3b3e39d6ebd44f4012e9bad5e9bdc6a6cfca332a954ce47abc706
patches:
  - patch_file: "patches/0001-cmake-recognize-HarmonyOS-in-UNIX-platform-branches.patch"
    patch_description: "Recognize HarmonyOS in UNIX platform branches: CMake 4.x Platform/HarmonyOS.cmake does not set the UNIX variable, so the upstream if(UNIX AND NOT APPLE) branches (Linux sources + Qt5DBus link) never match (E532 pattern)"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-use-Qt5-prefixed-targets-for-CMakeDeps-compati.patch"
    patch_description: "Use Qt5:: prefixed CMake targets: CMakeDeps generates Qt5:: prefixed imported targets only, the version-less Qt::Core/Qt::Network/Qt::Test names do not resolve"
    patch_type: "portability"
  - patch_file: "patches/0003-ws-fall-back-to-Http-scheme-when-built-with-QT_NO_SS.patch"
    patch_description: "Fall back to Http scheme when built with QT_NO_SSL: qt5-qtbase on OHOS has no OpenSSL backend, QSslSocket is compiled out (E276-adjacent platform constraint)"
    patch_type: "portability"
