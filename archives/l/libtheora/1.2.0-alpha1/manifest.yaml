# 版本级 manifest — libtheora 1.2.0-alpha1
# 遵循 ARCHIVE-SPEC v2.0

version: "1.2.0-alpha1"
software: "libtheora"
status: published
build_date: "2026-09-18"
build_system: "autotools"

source:
  url: "https://downloads.xiph.org/releases/theora/libtheora-1.2.0alpha1.tar.gz"
  upstream_version: "1.2.0alpha1"  # 官方 tarball/AC_INIT 命名（无连字符）；conan 版本与目录名为 1.2.0-alpha1
  conan_ref: "libtheora/1.2.0-alpha1"
  sha256: "538305e6efa484ba740616b521f0d8c4428a0a995193c5e6af9b20f488f3c497"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "native OHOS detection via vendored modern config.guess/config.sub (E007); no --host/--build triplet needed"
    - "--enable-shared/--disable-static (default option shared=True)"
  dependencies:
    - libogg/1.3.6.2
  cc: clang
  cxx: clang++

products:
  libraries:
    - libtheora.so.0.4.0 (combined encode+decode, SOVERSION parsed from configure.ac TH_LIB 4:0:4)
    - libtheoradec.so.1.1.5 (decoder, THDEC 2:5:1)
    - libtheoraenc.so.1.2.0 (encoder, THENC 3:0:2)
    - libtheora.a / libtheoradec.a / libtheoraenc.a (static variant)
  headers:
    - include/theora/theora.h
    - include/theora/theoradec.h
    - include/theora/theoraenc.h
    - include/theora/codec.h
  pkgconfig:
    - theora.pc
    - theoradec.pc
    - theoraenc.pc

upstream_tests:
  result: "9/9 passed (native OHOS aarch64)"
  programs: noop, noop_theora, noop_theoraenc, comment, comment_theoradec, comment_theora, granulepos, granulepos_theoraenc, granulepos_theora

patches_applied: []
# 无 .patch 文件；适配手段：
# - patches/autotools/config.guess|config.sub: vendored 现代版（GNU 2023-08-22 + HarmonyOS 补丁，
#   同 babeltrace2 2.1.2 仓内先例），source() 覆盖 2003 年旧版（E007）
# - configure 内联修复: umask 077→022 + mktemp 重定向 TMPDIR（E011, libkate 0.4.3 模式）
# - 生成物时间戳归一化，防 make 触发 aclocal/automake 重生成（E248, babeltrace2 模式）

knowledge_gained:
  - "E007: 2010 tarball 自带 2003 年 config.guess/config.sub 不识别 HarmonyOS；用仓内已验证的现代补丁对（babeltrace2 2.1.2）整体替换，原生模式识别 aarch64-unknown-linux-ohos"
  - "E011: configure 的 umask 077 + mktemp ./confXXXXXX 在 HMDFS 上触发权限问题；umask 022 + TMPDIR 重定向双修"
  - "强制交叉模式（--host/--build）会令 XIPH_PATH_VORBIS 对缺失的可选依赖 assume-OK，启用 vorbis 示例后编译失败；正确做法是原生模式 + vendored 现代 config 对（见 knowledge/drafts/libtheora-1.2.0-alpha1-cross-mode-assumed-optional-deps.kv）"
  - "共享 conan 依赖进入全局 LDFLAGS 后，configure 的编译器健全性 conftest 链接了 libogg.so.0 却无法运行；build() 开头注入依赖 libdir 到 LD_LIBRARY_PATH 解决（见 knowledge/drafts/libtheora-1.2.0-alpha1-shared-dep-conftest-runtime-path.kv）"
  - "上游 make check 9 个测试程序在 OHOS 原生环境全部通过（本机实测 9/9），测试二进制需 lib/.libs + libogg 在 LD_LIBRARY_PATH"
  - "libtheora 1.2.0alpha1 无 aarch64 汇编优化（上游仅 x86/ARM32/C64x），纯 C 编译即完整功能，无需裁剪"

# 补丁说明：本包无 .patch 文件（conandata patches: {}）。
# 适配手段为 vendored 整文件（patches/autotools/config.guess|config.sub）+
# conanfile.py source() 内的 configure 内联修复，不适用 per-file 补丁生成。
