# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libtheora/1.2.0-alpha1
homepage: "https://xiph.org/theora/"

# 上游测试命令
upstream_check_command: "make check (tests/: noop, comment, granulepos families)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C tests <9 check programs> && run each directly (tests/.libs/*)"

# 上游实际运行的测试程序 (tests/Makefile.am check_PROGRAMS, 编码支持启用)
upstream_tests:
  - file: noop
    source: libtheora-1.2.0alpha1/tests/noop.c
    description: "dummy call test for the current th_* api (links theoraenc+theoradec)"
    command: "./noop"
  - file: noop_theora
    source: libtheora-1.2.0alpha1/tests/noop_theora.c
    description: "dummy call test for the pre-1.0 legacy api with the legacy link line (libtheora)"
    command: "./noop_theora"
  - file: noop_theoraenc
    source: libtheora-1.2.0alpha1/tests/noop_theora.c
    description: "dummy call test for the pre-1.0 legacy api with current link line (theoraenc)"
    command: "./noop_theoraenc"
  - file: comment
    source: libtheora-1.2.0alpha1/tests/comment.c
    description: "th_comment handling verification (current api)"
    command: "./comment"
  - file: comment_theoradec
    source: libtheora-1.2.0alpha1/tests/comment_theora.c
    description: "comment handling via theoradec link line"
    command: "./comment_theoradec"
  - file: comment_theora
    source: libtheora-1.2.0alpha1/tests/comment_theora.c
    description: "comment handling via legacy libtheora link line"
    command: "./comment_theora"
  - file: granulepos
    source: libtheora-1.2.0alpha1/tests/granulepos.c
    description: "granulepos semantics verification (current api)"
    command: "./granulepos"
  - file: granulepos_theoraenc
    source: libtheora-1.2.0alpha1/tests/granulepos_theora.c
    description: "granulepos semantics via theoraenc link line"
    command: "./granulepos_theoraenc"
  - file: granulepos_theora
    source: libtheora-1.2.0alpha1/tests/granulepos_theora.c
    description: "granulepos semantics via legacy libtheora link line"
    command: "./granulepos_theora"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test_theora.c
    description: "Consumer round-trip: th_encode_alloc/flushheader/ycbcr_in/packetout + th_decode_headerin/packetin/ycbcr_out, 4 frames 32x32 YUV420, verifies frame count, dimensions, comment propagation, pixel means within lossy tolerance"
    command: "./test_theora"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
