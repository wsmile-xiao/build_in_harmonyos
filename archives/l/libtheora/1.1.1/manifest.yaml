version: "1.1.1"
status: built
build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
  build_duration: "2 minutes"
  compiler: clang 15.0.4
  warnings: operator precedence warnings (non-critical)
dependencies:
  - name: libogg
    version: "1.3.5"
    type: runtime
    source: local_precompiled
products:
  libraries:
    - libtheora.a (251KB)
    - libtheoradec.a (155KB)
    - libtheoraenc.a (193KB)
  headers:
    - include/theora/theora.h
    - include/theora/theoradec.h
    - include/theora/theoraenc.h
    - include/theora/codec.h
  pkgconfig:
    - theora.pc
    - theoradec.pc
    - theoraenc.pc
quality_gates:
  G0_build_clean: pass
  G1_headers_present: pass
  G2_pkgconfig_valid: pass
  G3_static_linkable: pass
  G4_test_executable: pass
knowledge_gained:
  - type: workaround
    description: "Autotools configure fails on HMDFS due to TMPDIR permission issues. Use CMake instead for HarmonyOS builds."
  - type: workaround
    description: "config.guess/config.sub do not recognize HarmonyOS. Specify --build=aarch64-unknown-linux-gnu for Autotools."
  - type: note
    description: "Created custom CMakeLists.txt for libtheora since upstream only provides Autotools and Visual Studio project files."
download_url: "https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.bz2"
archive_path: "packaging/libtheora-1.1.1-ohos-aarch64.tar.gz"
archive_size: "708KB"