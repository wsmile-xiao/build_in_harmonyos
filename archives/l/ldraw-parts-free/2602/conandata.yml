# conandata.yml — ldraw-parts-free 2602
# 上游 = LDraw.org 官方 complete.zip（2602，2026-02 更新）的 DFSG 自由子集。
# 官方 complete.zip 为滚动 URL（library.ldraw.org/updates?latest），无固定
# sha256；且库内约 3200 个零件/子零件及 4 个样例模型仍为 CC-BY-2.0-only
# 或双许可（DFSG 非自由），不可整体进 Debian main。Debian 以独立源码包
# ldraw-parts-free 2602+dfsg-1 重打包：repack.sh 提取 mklist 源码后，
# gendfsgsrc.py 按「0 !LICENSE 精确行匹配 CC BY 4.0」+「依赖图祖先剔除」
# 生成自由子集（parts 21186 + s 8267 + p 1741/127/920 + models 135 txt +
# 根 7 文件 + mklist.c/include 3h = 32387 文件；textures 135 张 PNG 整类
# 不携带）。本配方以该 dfsg orig.tar.xz 为钉死归档（Debian main 池，
# USTC 主 + aliyun 备，均实测可达），sha256 与 2602+dfsg-1.dsc 记录一致。

