knowledge_gained:
  - "LDraw 零件库官方 complete.zip 为滚动 URL（updates?latest）无固定 sha256，且库内约 3200 个零件/子零件及 4 个样例模型仍为 CC-BY-2.0-only 或双许可（DFSG 非自由），不可整体进 Debian main；Debian 以独立源码包 ldraw-parts-free 2602+dfsg-1 重打包为唯一可钉死 sha256 的自由子集归档"
  - "2602+dfsg 重打包口径（repack.sh + gendfsgsrc.py 实证）：repack.sh 提取 mklist 工具源码（mklist.c + include/*.h）；gendfsgsrc.py 按「首个 0 !LICENSE 生效行精确匹配 CC BY 4.0」+「依赖图祖先剔除」过滤，verbatim 清单整类不含 parts/textures（135 PNG）"
  - "2602+dfsg 发行清单：parts 21186 + s 8267 + p 1741/127/920 + models 135 txt + 根 7 文件 + mklist.c/include 3h = 32387 文件（完整库 35723 剔 3199 .dat + 135 PNG + 4 样例模型）"
  - "自由子集许可不变量：全部 32241 个 .dat 的生效许可行均为精确行 '0 !LICENSE Licensed under CC BY 4.0 : see CAreadme.txt'（被注释的历史旧许可行 '0 // !LICENSE ... CCAL version 2.0' 不参与判定，973pxis01.dat 第 145 行实证）"
  - "自由子集引用自包含：32241 个 .dat 中 368173 个 type-1 引用（第 15 token）全部在库内解析成功（0 缺失，依赖图祖先剔除的推论）"
  - "Debian 安装布局 /usr/share/ldraw/{parts,models,p,LDConfig*.ldr}；mklist.c/include 属 ldraw-mklist 二进制包构建输入，数据包不携带"
  - "dpkg-source 生成的 dfsg orig 条目带 ./ 前缀，conan get(strip_root=True) 不剥离顶层目录（真机 2.29.1 实证 build() 报 missing files）——get() 原样解压 + _src_root() 显式下钻"
  - "conan 2 目录级 copy(self, '<目录>', ...) 是空操作（真机 2.29.1 实证包目录只剩根文件）——package() 必须 copy('*') + excludes pattern 列表整树复制"
  - "纯数据包 test_package 若只有清单/格式/许可类静态检查项不满足审查规则对「鸿蒙特有测试」的端到端要求——测试重构为执行器结构（逐例 TEST PASS/FAIL + TEST SUMMARY + 失败退出码 1）并新增消费者端到端用例：最小 LDraw 渲染管线（载入 3001 装配体→type-1 引用递归解析至子件与 p/ 图元→图元几何载入→几何颜色索引对照 LDConfig，与 LeoCAD/LDView 消费本库的最小功能流同构；真机实测装配图 10 文件/25 引用/线段 40/三角 16/四边形 46）"
