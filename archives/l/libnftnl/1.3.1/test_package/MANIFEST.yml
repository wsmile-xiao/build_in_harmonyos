package: libnftnl/1.3.1
homepage: "https://www.netfilter.org/projects/libnftnl/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/Makefile.am
    source: libnftnl-1.3.1/tests/*.c
    description: "32 upstream unit tests covering table, chain, object, rule, set, flowtable and expression serialization APIs"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Consumer test creates a table, sets/reads its name and family through the installed libnftnl API"
    command: "./test_libnftnl"

assertion_count: 35
