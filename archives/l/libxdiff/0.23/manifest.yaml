software: libxdiff
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.23/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.23"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://www.xmailserver.org/libxdiff-0.23.tar.gz"

  # 源码校验和
  sha256: "e9af96174e83c02b13d452a4827bdf47cb579eafd580953a8cd2c98900309124"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: autotools

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 补丁描述
  patches:
    - file: "0001-config.guess.patch"
      desc: "替换老版本 config.guess 为系统 automake-1.17 版本以识别 HarmonyOS"
      type: platform
    - file: "0002-config.h.in.patch"
      desc: "autoheader 重新生成的 config.h.in 变更"
      type: auto-generated
    - file: "0003-config.sub.patch"
      desc: "替换老版本 config.sub 为系统 automake-1.17 版本"
      type: platform
    - file: "0004-configure.patch"
      desc: "修复 configure 脚本中 umask 077 导致 HMDFS 上无法创建临时文件的问题"
      type: platform

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.h.in.patch"
  - "0003-config.sub.patch"
  - "0004-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.guess 2005-08-03 无法识别 HarmonyOS，需替换为 automake-1.17 系统版本"
  - "autoconf 2.61 的 umask 077 在 HMDFS 上创建临时目录后无法写入文件，需改为 umask 022"
  - "make 会触发 config.status --recheck 导致 configure 被重新生成，需 touch 时间戳防止"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libxdiff-0.23.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libxdiff-0.23.work
  source_orig_hash: b47ca516beaae831
  source_work_hash: 149a514bda5f5941
  generated_at: '2026-06-25T13:24:27'
  patches_count: 4

patch_classification:
  - file: 0001-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config.h.in.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0004-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
