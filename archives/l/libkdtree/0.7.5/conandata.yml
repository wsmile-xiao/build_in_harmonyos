# conandata.yml — libkdtree++ 0.7.5
# Official source: GitHub tag v0.7.5 release tarball (R39 官方源).
# 只写官方 URL：镜像 fallback 由 CI（build_and_test.sh）在构建期临时注入并还原，
# 不得手工写入镜像前缀（gh-proxy/ghfast 等域名会被 preflight PF7 / R39 拦截）。
# Upstream is header-only and pulls in no external distribution: the only
# "requirements" of the release are the C++ standard library headers.
# The optional SWIG python-bindings subdirectory is disabled in the recipe
# (BUILD_PYTHON_BINDINGS=OFF), so no python/SWIG requirement is introduced.

sources:
  url: "https://github.com/nvmd/libkdtree/archive/refs/tags/v0.7.5.tar.gz"
