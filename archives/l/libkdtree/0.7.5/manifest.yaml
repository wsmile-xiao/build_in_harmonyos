# 版本级 manifest — libkdtree 0.7.5
# 遵循 ARCHIVE-SPEC v3.0

version: "0.7.5"

software: "libkdtree"

# 编译状态
# published | built | failed | archived
status: built

build_date: "2026-09-14"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 GitHub tag v0.7.5 归档（R39 官方源）
  url: "https://github.com/nvmd/libkdtree/archive/refs/tags/v0.7.5.tar.gz"
  sha256: "047c3c87062bdc6f5f1c828eca2fb9e0e74c8ca3ed1d81ebf666cb1d986d2de3"
  tar_format: tar.gz
  size_bytes: 131986

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  # 本包没有 autotools 配置项（G0 clean-verify 会用 ./configure 探测干净源码树）；
  # CMake 的开关见 build_command。
  configure_options: ""
  build_command: "cmake --build <build>（CMakeToolchain + clang++ 15.0.4，编译 examples/ 下 3 个测试程序；CMake 开关 -DBUILD_PYTHON_BINDINGS=OFF）"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试统计
# 单位：上游为 examples/ 下可执行测试程序个数；package 为 test_package 断言数
# ============================================================

test_results:
  upstream_total: 3
  upstream_passed: 3
  upstream_failed: 0
  upstream_skipped: 0
  upstream_note: "上游无 tests/ 目录、无 ctest/pytest 注册、autotools 无 check 目标；入口为 examples/{test_kdtree,test_hayne,test_find_within_range}.cpp，逐个真机执行，全部退出码 0"
  package_total: 15
  package_passed: 15
  package_failed: 0

# ============================================================
# 实跑证据
# ============================================================

validation:
  source_fetch:
    command: "curl -sS -L -o libkdtree-0.7.5.tar.gz https://codeload.github.com/nvmd/libkdtree/tar.gz/refs/tags/v0.7.5 && sha256sum libkdtree-0.7.5.tar.gz"
    result: "exit 0; 131986 bytes; sha256=047c3c87062bdc6f5f1c828eca2fb9e0e74c8ca3ed1d81ebf666cb1d986d2de3"
  upstream_census:
    command: "ls tests 2>/dev/null; ls examples/*.cpp; grep -c 'assert(' examples/*.cpp; grep -n 'enable_testing|add_test' CMakeLists.txt examples/CMakeLists.txt; grep -n check Makefile.am"
    result: "无 tests/ 目录；examples 下 3 个 .cpp（assert 23/4/2）；无 ctest 注册；无 check 目标 — reports/upstream-census.log"
  native_build:
    command: "cmake -S <src> -B <build> -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_PYTHON_BINDINGS=OFF -DCMAKE_CXX_COMPILER=/data/service/hnp/bin/clang++ && cmake --build <build>"
    result: "configure exit 0；build exit 0；3 个可执行程序全部链接成功（ELF aarch64）— reports/native-cmake-build.log"
  upstream_test_run:
    command: "<build>/examples/test_kdtree; <build>/examples/test_hayne; <build>/examples/test_find_within_range"
    result: "全部 exit 0（3/3）— reports/upstream-test_kdtree.log、reports/upstream-test_hayne.log、reports/upstream-test_find_within_range.log"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libkdtree++ 的 CMakeLists 用 install(FILES ${KDTREE_HEADERS} DESTINATION ${CMAKE_INSTALL_PREFIX}/include) 把头文件平铺，会破坏 #include <kdtree++/...>；应按 autotools 的 nobase_include_HEADERS 语义装到 include/kdtree++/ [knowledge_ref: E217]"
  - "header-only C++ 库按 Conan 2 的 package_type=header-library + cmake_layout/CMakeToolchain/CMakeDeps 打包，并在 conanfile build() 内编译 examples/ 下 assert 驱动的可执行程序直接执行，即可获得真实上游测试证据（无 ctest 注册）[knowledge_ref: E321]"
