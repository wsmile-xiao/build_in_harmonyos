# test_package/MANIFEST.yml — libkdtree 0.7.5
# 上游官方测试声明（R51）。libkdtree++ 是 header-only 模板库，上游**没有**
# tests/ 目录，也没有 ctest / pytest 注册；官方测试入口是 examples/ 下的三个
# assert 驱动的示例程序，由上游 CMakeLists.txt 的 add_executable 构建。
package: libkdtree/0.7.5
homepage: "https://github.com/nvmd/libkdtree"

# 上游测试清点（source tree 证据）：
#   - 无 tests/ 目录；configure.ac 无 AC_CONFIG_TESTDIR，CMakeLists.txt 无
#     enable_testing()/add_test()，autotools Makefile.am 无 check 目标。
#   - 可运行的上游测试入口 = examples/*.cpp 编译出的 3 个可执行程序。
#   清点命令：ls examples/*.cpp ; grep -c 'assert(' examples/*.cpp
upstream_check_command: "examples/test_kdtree && examples/test_hayne && examples/test_find_within_range"
upstream_test_in_build: true
upstream_test_command: "examples/<program>（三个程序逐个执行，退出码 0 = 通过）"

upstream_tests:
  - file: examples/test_kdtree.cpp
    source: libkdtree-0.7.5/examples/test_kdtree.cpp
    description: "insert/find/find_nearest/find_within_range/erase/optimise/迭代器/赋值（23 处 assert）"
    command: "./test_kdtree"
  - file: examples/test_hayne.cpp
    source: libkdtree-0.7.5/examples/test_hayne.cpp
    description: "254 轮删除 + 每轮 find() 双重校验（4 处 assert）"
    command: "./test_hayne"
  - file: examples/test_find_within_range.cpp
    source: libkdtree-0.7.5/examples/test_find_within_range.cpp
    description: "10000 个随机三维点 + 1000 轮范围查询与暴力集合比对（2 处 assert）"
    command: "./test_find_within_range"

# conanfile.py build() 中实测运行结果（真机 aarch64-linux-ohos，日志见 reports/）
upstream_test_result:
  discovered: 3
  executed: 3
  passed: 3
  failed: 0
  skipped: 0
  pass_rate: "3/3 (100%)"

# test_package 自带的消费者测试（真实 API 断言，R34）
test_package_tests:
  - file: test_libkdtree.cpp
    description: "默认 accessor KDTree<3, point>：insert/size/迭代/find/find_nearest/零半径 find_within_range/erase/optimise/拷贝构造"
    command: "./test_libkdtree"

assertion_count: 29
