software: libioth
version: "0.1.2"
status: built
build_date: "2026-09-26"
build_system: "cmake"

source:
  url: "https://github.com/virtualsquare/libioth/archive/refs/tags/0.1.2.tar.gz"
  sha256: "0e3370a35116ea1e125ebb0f494cb484634211d02f505657f806a77b8e34dd84"
  tar_format: tar.gz
  upstream_version: "0.1.2"

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF (default; ON when shared=True)"
  dependencies:
    - "libfduserdata/0.1.2"
    - "mhash/0.9.9.9"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-ohos-portability.patch"

knowledge_gained:
  - "上游 0.1.2 无任何自动化测试（无 enable_testing/add_test，无 tests/ 目录；test/ 仅为需 vde 交换机的手工示例），按 no_tests 路径审计接入（test_package/MANIFEST.yml: upstream_tests_exist=false, upstream_test_total=0, ctest_entries）"
  - "nlinline 0.2.2（ioth.h 包含的 header-only 库）暂无 OHOS 配方，在 source() 内获取官方 tag 源码并随包安装 nlinline.h/nlinline+.h"
  - "vdestack 插件是唯一消费 libvdeplug 的模块（尚无 OHOS 配方）；补丁使其仅在找到 libvdeplug 时构建，核心库不受影响"
  - "man/ 需要 pandoc + make，在 HarmonyOS 上按 CMAKE_SYSTEM_NAME 跳过该子目录"
  - "HarmonyOS libc 内含 pthread API，无独立 libpthread，按系统名跳过 pthread 显式链接"
  - "上游硬编码 add_library SHARED 且只安装 LIBRARY 产物，补丁使其跟随 BUILD_SHARED_LIBS 并补齐 ARCHIVE/RUNTIME 安装"
  - "musl sysroot 无 dlmopen/LM_ID_*（glibc 扩展），ioth.c 回退为 dlopen；musl sys/socket.h 与内核 linux/socket.h 的 sockaddr_storage 重定义按隐藏内核 tag 名处理；ioth_getifaddrs.c 去掉无用的 linux/if_arp.h"
knowledge_ref:
  - "archives/l/libioth/0.1.2/notes.md"
  - "archives/l/libioth/0.1.2/test_package/MANIFEST.yml"
