# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libioth/0.1.2
homepage: "https://github.com/virtualsquare/libioth"

# 上游源码审计：0.1.2 tag archive 不含任何自动化测试。
upstream_tests_exist: false
upstream_test_audit:
  - source: "源码树 (libioth-0.1.2 GitHub tag archive, https://github.com/virtualsquare/libioth/archive/refs/tags/0.1.2.tar.gz, sha256 0e3370a35116ea1e125ebb0f494cb484634211d02f505657f806a77b8e34dd84)"
    reason: "test/ 仅含 iothtest_server.c / iothtest_client.c 两个手工交互示例，需 vde 交换机与三终端手工操作（先起 vde_switch，再分别起 server/client），无断言、无期望输出比对、未注册为任何测试目标。"
  - source: "顶层 CMakeLists.txt + test/CMakeLists.txt + modules/CMakeLists.txt + man/CMakeLists.txt"
    reason: "全文无 enable_testing、include(CTest)、add_test、add_subdirectory(tests)；test/CMakeLists.txt 仅定义 iothtest_server/iothtest_client 手工示例可执行文件；modules/CMakeLists.txt 仅定义各栈插件模块目标；man/CMakeLists.txt 仅用 pandoc/make 生成安装 man 页。"
  - source: "ctest 确定性口径 (ctest -N)"
    reason: "上游无任何 add_test 注册，ctest -N 条目数为 0；故 upstream_test_total 为 0，口径 ctest_entries。"
  - conclusion: "上游 0.1.2 未提供自动化测试；由 test_package 执行消费者视角的库 API 验证（native 栈生命周期 + iothaddr 确定性向量，TAP 13 检查）。"
upstream_test_total: 0
upstream_test_count_method: "ctest_entries"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 check/test 目标，无上游测试。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无官方测试套件；验证手段为 test_package 对打包库的真实调用。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 验证：ioth_newstack/get_defstack/set_defstack 建栈设默认栈、ioth_msocket/ioth_socket 真实建套接字、ioth_close 关闭、iothaddr_hashmac 确定性向量、ioth_macton 解析及字节比对、ioth_ntomac 回显、hasheui64 与 eui64(hashmac) 一致性、ioth_delstack 删栈（TAP 13 检查，全部实质调用库 API，无网络、无 root 需求）"
    command: "test_libioth"

# 测试断言总数 (与 test.c CHECK 宏 13 处及 HMBS_TEST_PACKAGE_RESULT discovered 一致)
assertion_count: 13
