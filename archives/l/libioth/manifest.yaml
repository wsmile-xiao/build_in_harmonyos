# 软件级 manifest
software: libioth
display: "libioth"
description: "Internet of Threads 统一套接字 API（多栈插件式网络库）"
category: network
homepage: "https://github.com/virtualsquare/libioth"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游为 virtualsquare/libioth 官方仓库，0.1.2 为官方 tag"
    - "上游无任何自动化测试，按 no_tests 路径审计后由 test_package 消费者测试覆盖（TAP 13 检查）"
    - "nlinline header-only 依赖在 source() 内获取官方 tag 并随包安装头文件"
    - "vdestack 插件仅在找到 libvdeplug 时构建，核心库无 vde 依赖"
    - "HarmonyOS libc 内含 pthread API，无独立 libpthread，按 CMAKE_SYSTEM_NAME 跳过链接"
    - "man/ 需要 pandoc，在 HarmonyOS 上跳过该子目录（POSIX 兼容方式，无平台宏）"
    - "上游硬编码 SHARED，补丁使其跟随 BUILD_SHARED_LIBS，默认静态"
    - "musl 兼容：dlmopen 回退 dlopen、sockaddr_storage 内核 tag 隐藏、去掉无用 linux/if_arp.h"
  common_dependencies:
    - "libfduserdata"
    - "mhash"

versions:
  "0.1.2":
    status: built
    build_date: "2026-09-26"
