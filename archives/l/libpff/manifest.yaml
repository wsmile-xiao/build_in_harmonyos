software: libpff
display: "libpff — Personal Folder File library"
description: "libyal 取证家族的 PFF/OST 格式库（读取 Microsoft Outlook 个人文件夹 .pst 与脱机文件夹 .ost 邮件存储），纯 C，附 pffinfo/pffexport 工具"
category: forensics
homepage: "https://github.com/libyal/libpff"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GNU config.guess/config.sub（2023）不识别 HarmonyOS，构建期传显式 GNU 三元组 aarch64-unknown-linux-gnu（E007/DRAFT-E587 同族差异：本版本 config.sub 拒绝 linux-ohos）"
    - "HMDFS 文件系统 umask 077 导致 config.status 临时目录创建失败，构建期把 configure 内 umask 077 改为 umask 022（E011）"
    - "HMDFS 禁止直接执行源码树脚本且设备无 /bin/bash：CONFIG_SHELL 解释 configure，make check 传 LOG_COMPILER=/data/service/hnp/bin/bash（E087）"
    - "configure 显式 --disable-nls：设备无 gettext-devel，本库不依赖翻译消息（E027 同类）"
    - "zlib 为可选自动探测项，命中 OHOS NDK sysroot 的 zlib.h/-lz（压缩流能力保留，无需 Conan require）"
  common_dependencies: []

versions:
  "20231205":
    status: built
    build_date: "2026-09-20"
    source_url: "https://github.com/libyal/libpff/releases/download/20231205/libpff-alpha-20231205.tar.gz"
