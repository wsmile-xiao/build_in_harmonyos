package: libpff/20231205
homepage: https://github.com/libyal/libpff

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: "libpff library tests"
    source: tests/test_library.sh
    description: "Upstream shell runner for the 47 argument-only library test programs plus the 2 input-driven ones (file, support)"
    command: "./tests/test_library.sh"
  - name: "pfftools tests"
    source: tests/test_tools.sh
    description: "Upstream pfftools helper tests: info_handle, output, signal"
    command: "./tests/test_tools.sh"
  - name: "pffinfo tests"
    source: tests/test_pffinfo.sh
    description: "pffinfo metadata output checks; skips (exit 77) because the release archive ships no tests/input directory"
    command: "./tests/test_pffinfo.sh"
  - name: "pffexport tests"
    source: tests/test_pffexport.sh
    description: "pffexport item export checks; skips (exit 77) because the release archive ships no tests/input directory"
    command: "./tests/test_pffexport.sh"
  - name: "read items tests"
    source: tests/test_read_items.sh
    description: "pff_test_read_items driven over the tests/input corpus; skips (exit 77) because the release archive ships no tests/input directory"
    command: "./tests/test_read_items.sh"
  - name: "manpage tests"
    source: tests/test_manpage.sh
    description: "Renders the manuals with man(1); listed in check_SCRIPTS only and not registered in the automake TESTS face for this release, so it produces no runner log"
    command: "./tests/test_manpage.sh"
  - name: "python module tests"
    source: tests/test_python_module.sh
    description: "pypff binding smoke test; listed in check_SCRIPTS only and not registered in the automake TESTS face; the package is configured with --disable-python anyway"
    command: "./tests/test_python_module.sh"

test_package_tests:
  - file: test_libpff.c
    description: "Consumer API version, access flags, codepage, signature error path, and file object lifecycle checks"
    command: "./test_libpff"
  - file: test_ohos.c
    description: "OHOS-specific consumer test: compile-time OHOS target check and writable TMPDIR file lifecycle"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "ohos-tmpdir-file-lifecycle"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、TMPDIR 非 /tmp、临时文件读写和清理"
    command: "./test_ohos"
    assertions: 5
    platform: OHOS

assertion_count: 15
