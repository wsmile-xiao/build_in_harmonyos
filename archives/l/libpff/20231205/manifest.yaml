  sha256: "3e4932e3c68068b91b3024454ff095b941e326c4c15ea27ca727dc739004b880"
  tar_format: tar.gz
  upstream_release_url: "https://github.com/libyal/libpff/releases/download/20231205/libpff-alpha-20231205.tar.gz"
  upstream_tag: "20231205"
  upstream_commit: null
  release_artifact: >-
    上游官方 release 资产 libpff-alpha-20231205.tar.gz（HTTP 200，2151000 字节，
    顶层目录 libpff-20231205/）。双源互证：① 官方资产下载件 sha256
    3e4932e3c68068b91b3024454ff095b941e326c4c15ea27ca727dc739004b880；
    ② Debian PGP 签名 libpff_20231205-1.dsc 的 Checksums-Sha256 声明
    5389d05df51999e7e9dd02dcd238294763c929335b63b788b7c3576c0a063fc1 1187408
    libpff_20231205.orig.tar.xz（Debian 重压缩为 xz，归档哈希必然不同）；
    ③ 两归档解包后全树 1074 个文件逐文件 sha256 比对 FULL-TREE-IDENTICAL
    （抽样锚点 configure 两侧同为 742bd217b6146e4ca6ba1e329ed6a2beacd50fce66045e669526e33f29beb990）。
    gzip 魔术 1f 8b、tar 顶层目录核对通过。

build:
  system: autotools
  configure_options:
    - "--disable-python"
    - "--disable-java"
    - "--disable-nls"
    - "--enable-static-executables=no"
    - "--enable-shared"
    - "--disable-static"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfdatetime
    - libfguid
    - libfmapi
    - libfvalue
    - libfwnt
    - libuna
  optional_features:
    deflate: zlib
    multi_threading: pthread
    wide_character_type: "no"
    python_pypff: "no"
    java_jpff: "no"
    nls: "no"
    note: >-
      自动探测结果（configure 摘要逐字见 notes.md）：DEFLATE 压缩走 zlib（zlib.h/-lz
      命中 OHOS NDK sysroot，与同族 libfsapfs 读数一致）；多线程 pthread；宽字符类型
      未开启（默认）；pypff/jpff 绑定与 NLS 显式关闭。
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 平台适配全部内联在 conanfile.py 的 generate()/build()（平台三元组、umask、CONFIG_SHELL/
# LOG_COMPILER、沙箱 HOME）；测试驱动方式未做任何改动（上游 make check 原样驱动），
# 不修改任何上游 C 源文件与测试文件，故本列表为空。
patches_applied: []

knowledge_gained:
  # 每条行尾引用最接近的条目（写法遵循容器层口径：# knowledge_ref: <条目/新草稿号>）。
  - "2023+ libyal 发布包把 Python 绑定打包清单上移到仓库根（pyproject.toml 仅 [build-system] 引导、setup.py 自述 build and install Python-bindings、绑定源码在 pypff/ 一类目录），lang-preflight 据此判 manifest=python vs 主体 c≈98% 的 §4.7 冲突 → mixed→env_unsupported 假终态；按 R47 附录 D.4 绑定不算主体复核判 C 后继续，该步以未执行留痕跳过（libyal 族第 5 次独立复现，mixed 出口首次留证）。"  # knowledge_ref: DRAFT-E592-libyal-root-pep517-langpreflight-mixed-misdetect
  - "libpff 20231205 的 config.sub（2023 版）拒绝 aarch64-unknown-linux-ohos（rc=1，无 ohos 分支），config.guess 对 HarmonyOS 主机回落 gnu——同族不同版本能力不同，三元组必须现场用 ./config.sub 取证（本包回落 aarch64-unknown-linux-gnu 且 build==host 使 cross compiling=no）。"  # knowledge_ref: DRAFT-E587-libyal-ohos-triplet-variance
  - "libpff 的 DEFLATE 压缩是可选自动探测：configure 摘要 ac_cv_zlib=zlib、LIBADD=-lz，命中 OHOS NDK sysroot 自带 zlib；17 个捆绑 libyal 组件全部 local（configure 摘要逐字见 notes.md），无外部 Conan require。"  # knowledge_ref: DRAFT-E590-libyal-optional-dep-autodetect-ohos
  - "HMDFS 下 Autoconf 的 umask 077 临时目录不可用；构建期把 configure 里的 umask 077 改成 022，全程 umask 022。"  # knowledge_ref: E011
  - "HMDFS 禁止直接执行源码树脚本；用 CONFIG_SHELL 解释 configure，并给 make check 传 LOG_COMPILER=/data/service/hnp/bin/bash（设备无 /bin/bash）。"  # knowledge_ref: E087
  - "发布包自带 config.guess/config.sub 不识别 HarmonyOS，显式传 GNU 三元组且 --build 与 --host 同值时 configure 保持 cross compiling... no，AC_RUN_IFELSE 正常执行。"  # knowledge_ref: E007
  - "libpff 发布包是自包含闭包：17 个本地 libyal 组件 + 生成好的 configure/aclocal.m4/config.guess/config.sub/Makefile.in 全在 tarball 内；配方在 build() 早期校验闭包，缺失即报错，不调用 synclibs.sh。"  # knowledge_ref: E277
  - "上游 release archive 不含 tests/input/：test_pffinfo.sh、test_pffexport.sh、test_read_items.sh 按上游自身规则 SKIP（exit 77）；依赖语料的 pff_test_read_items 注册而未执行，按 NOT_RUN 申报并附独立探针读数（无参数运行 rc=1 Missing filename），不得为凑执行数混入。"  # knowledge_ref: E370
  - "automake 对 libpff tests/ 实际注册执行的 TESTS 只有 5 个 shell runner（pypff*.py 在 check_SCRIPTS 名单里但未进 TESTS 面）——统计时以 automake 汇总行（TOTAL 5/PASS 2/SKIP 3）与 runner 日志实物为准，不按脚本名单推算。"  # knowledge_ref: DRAFT-E584-libyal-tests-prefix-and-driven-subset

tests:
  upstream:
    command: "make check"
    counting_unit: "tests/Makefile.am 注册的 C 测试程序（check_PROGRAMS）"
    unit_programs: 53
    declared_n_head_lower_bound: 53
    executed: 52
    passed: 52
    failed: 0
    skipped: 0
    not_run: 1
    runner_cases: 5
    runner_passed: 2
    runner_skipped: 3
    note: >-
      取数口径：声明 N = 被审版本 20231205 自带的 53 个 check_PROGRAMS
      （程序化清点 tests/Makefile.am 注册表）；上游当前 HEAD 2026-09-20 现场
      取数同为 53，无差额。上游 runner 实际驱动的 52 个（test_library.sh 49 =
      47 个无参 + file/support 2 个带参；test_tools.sh 3 =
      tools_info_handle/tools_output/tools_signal）本次全部编译并真实执行、
      全部通过。NOT_RUN 1 项逐条归因：pff_test_read_items 由上游 runner
      test_read_items.sh 驱动，但 release archive 不含 tests/input/，runner 按
      上游自身规则 exit 77 跳过；独立探针（无参数运行该程序）rc=1
      "Missing filename."，与「需 PST 语料而发布包不含」一致。
      TOTAL 53 = PASS 52 + FAIL 0 + SKIP 0 + NOT_RUN 1。
      runner 面（另一计数单位，不并入 N）：automake 汇总 # TOTAL: 5 / PASS: 2 /
      SKIP: 3 / FAIL: 0（PASS: test_library.sh、test_tools.sh；SKIP:
      test_read_items.sh、test_pffinfo.sh、test_pffexport.sh，均 exit 77 无
      tests/input；pypff*.py 等未进 automake TESTS 面）。
  adapted:
    command: "Conan test_package"
    cases: 15
    passed: 15
    pass_rate: "15/15 (100%)"
    breakdown:
      generic_consumer_assertions: 10
      harmony_specific_assertions: 5
    note: >-
      test_libpff.c 10 项：版本串 20231205、读访问标志、get_codepage 正常/错误路径、
      set_codepage、check_file_signature(NULL) 错误路径、file_initialize、
      file_open 不存在文件错误路径、file_free；test_ohos.c 5 项：__OHOS__ 编译目标、
      TMPDIR 非 /tmp、临时路径构造、临时文件写读往返比对、清理后 access+errno=ENOENT。

