software: libplacebo5
display: "libplacebo5"
description: "Video rendering and color processing library (v5 series)"
category: gfx
homepage: "https://code.videolan.org/videolan/libplacebo"
license: LGPL-2.1
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "GPU 后端（OpenGL/Vulkan/D3D11）在 OHOS 无对应依赖，全部禁用（-Dopengl/vulkan/d3d11=disabled）"
    - "meson sanity check 需 libc++_shared.so 运行库路径（SDK <llvm>/lib/aarch64-linux-ohos/）"
    - "OHOS 缺 ar，需强制 AR=/data/service/hnp/bin/llvm-ar"
  common_dependencies:
    - meson
    - ninja

# 版本索引（所有已归档版本，含状态）
versions:
  "5.264.1":
    status: built
    build_date: "2026-09-16"