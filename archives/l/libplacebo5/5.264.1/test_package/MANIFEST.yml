# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libplacebo5/5.264.1
homepage: "https://code.videolan.org/videolan/libplacebo"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test (conan build() 内执行, -Dtests=true)"

# 上游实际运行的测试程序 — v5.264.1 meson 注册 9 个单元测试
# （src/meson.build tests 数组，全部不依赖 GPU，本地实测 9/9 通过）
upstream_tests:
  - file: src/tests/colorspace.c
    source: libplacebo5-5.264.1/src/tests/colorspace.c
    description: "colorspace 转换与色度计算单元测试"
    command: "./test.colorspace.c"
  - file: src/tests/common.c
    source: libplacebo5-5.264.1/src/tests/common.c
    description: "公共工具函数单元测试"
    command: "./test.common.c"
  - file: src/tests/dither.c
    source: libplacebo5-5.264.1/src/tests/dither.c
    description: "抖动(dithering)算法单元测试"
    command: "./test.dither.c"
  - file: src/tests/dummy.c
    source: libplacebo5-5.264.1/src/tests/dummy.c
    description: "dummy GPU 后端单元测试"
    command: "./test.dummy.c"
  - file: src/tests/lut.c
    source: libplacebo5-5.264.1/src/tests/lut.c
    description: "3D LUT 处理单元测试"
    command: "./test.lut.c"
  - file: src/tests/filters.c
    source: libplacebo5-5.264.1/src/tests/filters.c
    description: "图像滤波器单元测试"
    command: "./test.filters.c"
  - file: src/tests/string.c
    source: libplacebo5-5.264.1/src/tests/string.c
    description: "字符串工具单元测试"
    command: "./test.string.c"
  - file: src/tests/tone_mapping.c
    source: libplacebo5-5.264.1/src/tests/tone_mapping.c
    description: "色调映射(tone mapping)单元测试"
    command: "./test.tone_mapping.c"
  - file: src/tests/utils.c
    source: libplacebo5-5.264.1/src/tests/utils.c
    description: "通用工具函数单元测试"
    command: "./test.utils.c"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 pl_version() 验证库可链接可运行（纯 CPU API）"
    command: "./test_libplacebo5"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9