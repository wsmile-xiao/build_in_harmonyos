# libplacebo5 5.264.1 版本级 manifest
version: "5.264.1"
software: "libplacebo5"

# 编译状态（conan-verify 全部门禁通过）
status: built
build_date: "2026-09-16"
build_system: meson

source:
  # 上游官方源（videolan 主仓库，与 libplacebo/7.349.0.1 同源）
  url: "https://code.videolan.org/videolan/libplacebo/-/archive/v5.264.1/libplacebo-v5.264.1.tar.gz"
  sha256: "9eb0c198f58d994f1c0d173dd37647d4d07d27972412c48ab758e984503c787b"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dopengl=disabled"
    - "-Dvulkan=disabled"
    - "-Dd3d11=disabled"
    - "-Dglslang=disabled"
    - "-Dshaderc=disabled"
    - "-Ddemos=false"
    - "-Dtests=true"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "v5.264.1 tar.gz 不含 git submodules（3rdparty/ 为空），但 src/vulkan/meson.build 对 vulkan.h 的探测命中 OHOS SDK sysroot 自带头文件，无需补 submodule（与 v7.349.0 需补 fast_float 不同）"
  - "meson sanity check 需运行 clang++ 测试二进制，其依赖 libc++_shared.so 位于 SDK <llvm>/lib/aarch64-linux-ohos/ 子目录，conanfile generate() 需补齐 LD_LIBRARY_PATH"