# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libvncserver/0.9.15
homepage: "https://github.com/LibVNC/libvncserver"

# 上游测试命令 (用于 ctest -N / make -n check 分析)
upstream_check_command: "cmake --build . --target test  # 或 ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: cargstest.c
    source: libvncserver-LibVNCServer-0.9.15/test/cargstest.c
    description: "命令行参数解析测试"
    command: "./cargstest"
  - file: copyrecttest.c
    source: libvncserver-LibVNCServer-0.9.15/test/copyrecttest.c
    description: "CopyRect 编码测试"
    command: "./copyrecttest"
  - file: encodingstest.c
    source: libvncserver-LibVNCServer-0.9.15/test/encodingstest.c
    description: "多种编码格式测试（需要线程支持）"
    command: "./encodingstest"
  - file: wstest.c
    source: libvncserver-LibVNCServer-0.9.15/test/wstest.c
    description: "WebSocket 协议测试"
    command: "./wstest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 rfbGetScreen / rfbGetClient / rfbRegion API"
    command: "./test_libvncserver"

# 测试断言总数
assertion_count: 6