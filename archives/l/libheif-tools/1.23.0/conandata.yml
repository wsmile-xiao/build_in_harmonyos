# conandata.yml — libheif-tools 1.23.0
# 上游: https://github.com/strukturag/libheif (tag v1.23.0)
# 与 archives/l/libheif 同源工程（该归档为 1.22.2），本包只出 examples/ 里的命令行工具。
sources:
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"

patches:
  - patch_file: "patches/0001-libheif-box-cc-ranges-algorithms.patch"
    patch_description: >-
      libheif/box.cc 用了 C++20 的 std::ranges::all_of / std::ranges::find，
      而 OHOS SDK 自带的 libc++（clang 15.0.4）只有 std::ranges 命名空间、
      没有任何 ranges 算法，模板实例化直接报
      "no member named 'all_of' in namespace 'std::ranges'"，
      -std=c++17 更是连 std::ranges 都不存在。改为等价的 std::all_of /
      std::find（同文件已包含 <algorithm>），行为不变。
    patch_type: "portability"