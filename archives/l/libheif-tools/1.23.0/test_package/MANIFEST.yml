# test_package/MANIFEST.yml
# libheif-tools ships the examples/ command line drivers only; upstream's own
# ctest suite lives in tests/ and belongs to the libheif library archive.
package: libheif-tools/1.23.0
homepage: "https://github.com/strukturag/libheif"

upstream_check_command: "ctest --test-dir build"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# R34: the test_package must actually invoke the tested binaries.
test_package_tests:
  - file: test.sh
    description: >-
      端到端: 四个已安装工具 (heif-info/heif-dec/heif-convert/heif-enc) 的
      --version 退出码契约，用内嵌的官方 AVIF 夹具跑 heif-info 并断言
      MIME type / main brand / 图像数量，最后以缺失文件作反例
    command: "bash test.sh"

assertion_count: 8