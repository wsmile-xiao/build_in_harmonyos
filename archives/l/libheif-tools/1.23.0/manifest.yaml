# 版本级 manifest — libheif-tools 1.23.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.23.0"
software: libheif-tools

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-09-17"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"          # 静态 libheif + 静态 heifio, 工具自包含
    - "-DWITH_EXAMPLES=ON"               # 上游唯一的“出工具”开关 (examples/)
    - "-DWITH_EXAMPLE_HEIF_VIEW=OFF"     # 同一开关下的 SDL2 查看器
    - "-DWITH_EXAMPLE_HEIF_THUMB=OFF"    # 同一开关下需要 libpng 的缩略图插件
    - "-DBUILD_DEVELOPMENT_TOOLS=OFF"    # heif-gen-bayer 等
    - "-DBUILD_TESTING=OFF"
    - "-DENABLE_PLUGIN_LOADING=OFF"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_JPEG/PNG/WEBP/TIFF=ON"  # heifio 输入格式探测, 关掉保证封闭
                                                            # 注意 WEBP 必须全大写: 上游写的是
                                                            # find_package(WEBP), 而该变量大小写敏感
    - "-DWITH_LIBSHARPYUV=OFF"           # 默认 ON, 探测同一族 ~/usr/local 下的坏 CMake 配置
    - "-DWITH_<全部编解码器>=OFF"          # 与 libheif 归档一致: 无编解码器的容器构建
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-libheif-box-cc-ranges-algorithms.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "libheif 没有 tools 开关: 命令行工具全在 examples/ 子目录, 而该目录只由 if(WITH_EXAMPLES) 进入 —— 拆分包必须先意识到 '出工具' 等于 'WITH_EXAMPLES=ON', 而不是去找 -Dtools"
  - "WITH_EXAMPLES 同时门控三件事: examples/CLI 工具、WITH_EXAMPLE_HEIF_VIEW(SDL2 查看器)、WITH_EXAMPLE_HEIF_THUMB(libpng 缩略图插件); 只要 CLI 就必须把后两个显式关掉, 否则 SDL2/libpng 会被拉进依赖闭包"
  - "heif-dec / heif-enc 依赖静态辅助库 heifio, 它用 find_package 探测构建机上的 JPEG/PNG/WebP/TIFF 输入格式; 交叉构建下必须用 CMAKE_DISABLE_FIND_PACKAGE_<Pkg>=ON 关掉, 否则会误链设备 ~/usr/local 下的同名库, 破坏封闭性"
  - "上游用 install(CODE execute_process(cmake -E create_symlink heif-dec $ENV{DESTDIR}${CMAKE_INSTALL_PREFIX}/bin/heif-convert)) 安装历史别名; 打包时按符号链接处理, 签名和裁剪都不能跳过符号链接本体"
  - "heif-info/heif-dec/heif-enc 都提供 -v/--version 且以 0 退出, 满足平台 L2 冒烟测试; 不需要像 libdisplay-info 那样打补丁"
  - "OHOS SDK 自带的 libc++(clang 15.0.4) 只实现 std::ranges 命名空间, 没有任何 ranges 算法: std::ranges::all_of / std::ranges::find 在 -std=c++20 下报 no member named ... in namespace std::ranges, 在 -std=c++17 下连 std::ranges 都不存在 —— 报错酷似漏了 #include <algorithm>, 但提标准/补头文件都没用, 只能换成迭代器版 std::all_of / std::find"
  - "CMAKE_DISABLE_FIND_PACKAGE_<name> 的大小写必须与上游 find_package() 的参数完全一致: heifio 写的是 find_package(WEBP), 用 CMAKE_DISABLE_FIND_PACKAGE_WebP 等于没禁, 设备 ~/usr/local 的 WEBPConfig.cmake 会被拉进来, 并因为它引用了不存在的 libsharpyuv.so.0.1.2 而让 configure 直接失败 —— 这类错误即使 find_package 不带 REQUIRED 也会 fail"