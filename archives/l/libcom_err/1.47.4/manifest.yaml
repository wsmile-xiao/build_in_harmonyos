version: "1.47.4"
status: built
build_date: "2026-09-28"

source:
  url: "https://www.kernel.org/pub/linux/kernel/people/tytso/e2fsprogs/v1.47.4/e2fsprogs-1.47.4.tar.gz"
  sha256: "da274408bebbfd13a5a2fc3cfc66e3ffff17c48534673aa67f88d49b99123b96"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--disable-nls"
    - "--disable-rpath"
    - "--disable-backtrace"
    - "--disable-tls"
    - "--disable-testio-debug"
    - "--disable-debugfs"
    - "--disable-imager"
    - "--disable-resizer"
    - "--disable-defrag"
    - "--disable-mmp"
    - "--disable-tdb"
    - "--disable-bmap-stats"
    - "--disable-uuidd"
    - "--disable-fuse2fs"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libcom_err is the com_err error-description library, built from the lib/et autotools subproject of e2fsprogs 1.47.4 (official release tarball)"
  - "Run top-level ./configure only to generate lib/et/Makefile + MCONFIG + lib/config.h, then build/test/install with `make -C lib/et`"
  - "Static-only build (no --enable-elf-shlibs) avoids the shared-lib install-symlink + LDCONFIG machinery that is fragile on OHOS/HMFS"
  - "Upstream test suite = 6 compile_et test cases in lib/et/test_cases, executed by `make -C lib/et check`"
  - "OHOS/HMFS autoconf robustness: writable TMPDIR injection, ac_pwd fallback, config.status mktemp redirection (see conanfile build())"
