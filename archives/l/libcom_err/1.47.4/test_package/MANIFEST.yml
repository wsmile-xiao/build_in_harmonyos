# test_package/MANIFEST.yml — libcom_err 1.47.4
# Upstream and consumer test declaration required by CI L0e.

package: libcom_err/1.47.4
homepage: "http://e2fsprogs.sourceforge.net/"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "e2fsprogs-1.47.4.tar.gz (official tytso/kernel.org release)"
  source_sha256: "da274408bebbfd13a5a2fc3cfc66e3ffff17c48534673aa67f88d49b99123b96"
  build_system: "Autotools (e2fsprogs top-level; only lib/et subproject built)"
  test_definition: >
    lib/et/Makefile.in defines the `check` target as a loop over
    $(srcdir)/test_cases/*.et. For each error table it runs the built
    compile_et tool, then diffs the generated .c/.h against the checked-in
    expected files; it prints one "Test case <name> succeeded/failed" line
    per case. There are exactly 6 .et fixtures (continuation, heimdal,
    heimdal2, heimdal3, imap_err, simple), so upstream registers 6 test
    cases under this counting unit. The recipe runs
    `make -C lib/et check` and parses those framework lines for the real
    passed/failed counts.
  dependency: "none (compile_et needs awk + diff, both present in the OHOS env)"
  portability_changes: []

upstream_check_command: "make -C lib/et check"
upstream_test_in_build: true
upstream_test_command: "make -C lib/et check"

upstream_tests:
  - test_name: "continuation"
    source: "test_cases/continuation.et"
    kind: unit
  - test_name: "heimdal"
    source: "test_cases/heimdal.et"
    kind: unit
  - test_name: "heimdal2"
    source: "test_cases/heimdal2.et"
    kind: unit
  - test_name: "heimdal3"
    source: "test_cases/heimdal3.et"
    kind: unit
  - test_name: "imap_err"
    source: "test_cases/imap_err.et"
    kind: unit
  - test_name: "simple"
    source: "test_cases/simple.et"
    kind: unit

upstream_test_total: 6
upstream_test_count_method: autotools_tests

# Consumer-perspective checks exercise the com_err public API: table
# registration + exact lookups, unknown-code formatting, and hook dispatch.
# The C binary emits HMBS_TEST_PACKAGE_RESULT with its own real counters.
test_package_tests:
  - file: test_com_err.c
    scenario: "consumer-api"
    description: >
      Build and run a Conan consumer that links libcom_err and drives:
      init_error_table() registration, error_message() exact table lookups at
      base and base+1, the unknown-(negative)-code formatter, and
      set_com_err_hook() + com_err() dispatch. 5 deterministic checks, each
      with an explicit fail exit path.
    command: "./test_com_err"
    assertions: 5

assertion_count: 5
