# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsieve/2.2.6
homepage: http://libsieve.sourceforge.net/

# 上游测试命令 (上游 Makefile.am 未注册 TESTS，make check 为空；
# 真实套件是 sv_test 下的 testcomp + testvalid.sh + testmessage.sh)
upstream_check_command: "sv_test/testcomp + testvalid.sh + testmessage.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "testcomp + testvalid.sh(12) + testmessage.sh(24)"

# 上游实际运行的测试程序 (共 37 项执行)
upstream_tests:
  - file: testcomp.c
    source: libsieve-2.2.6.tar.gz/src/sv_test/testcomp.c
    description: "比较器单元测试 (134 行断言表，二进制退出码判定)"
    command: "./testcomp"
  - file: testvalid.sh
    source: libsieve-2.2.6.tar.gz/src/sv_test/testvalid.sh
    description: "脚本语法校验 script1.sv-script12.sv (12 项)"
    command: "./example scriptN.sv"
  - file: testmessage.sh
    source: libsieve-2.2.6.tar.gz/src/sv_test/testmessage.sh
    description: "脚本在 messagea/messageb 上的执行 (12x2=24 项，stdin 取 /dev/null)"
    command: "./example scriptN.sv messageX.mbox"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sieve.c
    description: "alloc/callbacks/validate/execute/free 全链路正向验证"
    command: "./test_sieve"
  - file: test_sieve_invalid.c
    description: "破损脚本必须被拒绝的反向验证"
    command: "./test_sieve_invalid"

# 测试断言总数 (近似值: testcomp 134 行 + 36 组 shell 退出码断言)
assertion_count: 170
