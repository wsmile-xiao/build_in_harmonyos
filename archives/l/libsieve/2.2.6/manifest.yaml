version: "2.2.6"
status: built
build_date: "2026-09-18"

source:
  url: "https://downloads.sourceforge.net/project/libsieve/libsieve/2.2.6/libsieve-2.2.6.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  cc: clang

patches_applied:
  - "0001-src-config.sub.patch"

recipe_text_edits:
  - "_patch_configure_umask: src/configure umask 077 -> 022 (E011)"
  - "_patch_example_eof: example.c read_file break on EOF, drop spurious 0xFF (Round-10)"
  - "_patch_fno_common: addr.c/addr.y tentative definition -> extern (Round-8, replaces removed 0002 diff)"

knowledge_gained:
  - "configure 与 Makefile.in 在 src/ 子目录，顶层 Makefile 只做 release；构建入口在 src/"
  - "2007 版 config.sub 不认识 aarch64，需补丁后才能传 aarch64 triplets"
  - "上游无 make check TESTS；真实套件是 sv_test/testcomp + testvalid.sh(12) + testmessage.sh(24)，共 37 项"
  - "addr.y 的 diff 上下文与真实包字节不一致时，用字节级文本替换代替 unified diff"
  - "_patch_headererror_const: headerinc.h/header.y -> const char *, (char *)s cast at do_error call (Round-9)"
