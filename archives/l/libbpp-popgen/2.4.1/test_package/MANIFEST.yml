# test_package/MANIFEST.yml
# 上游官方测试声明 + 消费者测试声明 for libbpp-popgen/2.4.1
package: libbpp-popgen/2.4.1
homepage: "https://github.com/BioPP/bpp-popgen"

# 上游测试：v2.4.1 发布包内**没有** tests/ 或 test/ 目录（清点命令：
#   tar -tzf bpp-popgen-2.4.1.tar.gz | grep -cE '/(tests?)/'  ->  0
#   ls bpp-popgen-2.4.1/  ->  AUTHORS.txt CMakeLists.txt COPYING.txt ChangeLog
#                              Doxyfile INSTALL.txt bpp-popgen.spec header.html
#                              package.cmake.in src
# ），因此上游 N=0，本配方不伪造上游用例，改按平台规则（PDF 第 21 页
# “上游没有测试用例时，按公开 API 设计真实测试”）以消费者测试补全覆盖。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的消费者测试（真实链接 + 真实执行）
test_package_tests:
  - file: test_package/test_bpp_popgen.cpp
    description: >-
      Bio++ PopGen 公共 API 消费者测试（31 项断言）：BasicAlleleInfo 标识符往返/相等性/clone；
      MonoAllele-、BiAllele-、MultiAlleleMonolocusGenotype 的等位基因索引与纯合判定；
      LocusInfo 名称/倍性常量/等位基因登记与键位查询，以及重复登记（BadIdentifierException）
      与未知等位基因（AlleleNotFoundException）两条异常契约；AnalyzedLoci 的位点登记、
      等位基因计数与倍性查询、按位点追加等位基因；DataSet 的 Group/Individual 增删查；
      Bpp/Version.h 指纹。全部无输入文件、无网络、无设备依赖。
    command: "ctest --output-on-failure -R test_bpp_popgen"

# 断言总数（消费者测试）：见 test_bpp_popgen.cpp 的 check() 调用数
assertion_count: 31
