# conandata.yml — libbpp-popgen 2.4.1
#
# Only the official upstream source URL is declared here: the CI pipeline adds
# its own mirror fallback (R39), and local builds point this entry at a local
# source mirror while validating.
sources:
  url: "https://github.com/BioPP/bpp-popgen/archive/refs/tags/v2.4.1.tar.gz"
  sha256: "03b57d71a63c8fa7f11c085e531d0d691fc1d40d4ea541070dabde0ab3baf413"

patches:
  "2.4.1":
    - patch_file: "patches/0001-cmake-use-conan-libbpp-seq-target.patch"
      patch_description: >-
        Resolve the libbpp-seq dependency through the Conan-generated CMake
        target (libbpp-seq::libbpp-seq) instead of the upstream
        find_package(bpp-seq 12.0.0): the published libbpp-seq package ships
        the upstream bpp-seq-config.cmake next to a pruned (static-only) lib
        directory, so that config aborts while validating its shared imported
        target.
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-cpp17-random-shuffle-compat.patch"
      patch_description: >-
        Local Fisher-Yates replacement for std::random_shuffle, which C++17
        removed and libc++ 15 no longer provides while the OHOS profile builds
        with -std=c++17. The replacement mirrors the historical libstdc++
        implementation (std::rand() driven), so the sampling behaviour of the
        five call sites is unchanged.
      patch_type: "portability"
      strip: 1
