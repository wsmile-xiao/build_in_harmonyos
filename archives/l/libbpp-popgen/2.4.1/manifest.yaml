knowledge_gained:
  - "Bio++ 家族（bpp-core/bpp-seq/bpp-phyl/bpp-popgen）用 libtool 的 CURRENT:REVISION:AGE 规则生成 CMake 包版本，因此 find_package 契约必须用「API 版本」而不是发布 tag：bpp-popgen 2.4.1 要求 find_package(bpp-seq 12.0.0)（该包 config-version.cmake 里 PACKAGE_VERSION=12.0.0），bpp-seq 又要求 find_package(bpp-core 4.1.0)。判定方法：直接读依赖包 lib/cmake/<name>/<name>-config-version.cmake 的 set(PACKAGE_VERSION ...)，不要按发布 tag 猜。"
  - "制品仓的 libbpp-seq/2.4.1 把 bpp-core 一起打包（lib/libbpp-core.a + lib/cmake/bpp-core/bpp-core-config.cmake），因此依赖 Bio++ 序列层的包只需 requires(libbpp-seq) 一个依赖即可满足上游 find_package(bpp-seq) 与嵌套 find_package(bpp-core)。"
  - "依赖包按 shared=False 剔除 .so 后，它随包携带的上游 *-targets.cmake 仍会把 .so 登记进 CMake 的 imported-file 校验表，导致消费者 find_package(<dep>) 直接 FATAL_ERROR（\"The imported target ... references the file ... but this file does not exist\"）。可靠做法是让消费者走 Conan 生成的 target（<pkg>::<pkg>），不要复用上游 config。"
  - "上游 CMake 的 cmake_minimum_required(VERSION 2.8.11) 在 CMake >= 4 下会直接报错，需在 conanfile 里钉 CMAKE_POLICY_VERSION_MINIMUM=3.5。"
  - "上游无条件安装 static+shared 两个变体：若按 shared=False 交付，必须在 package() 里删掉 .so，否则消费者可能解析到共享库（Bio++ 家族共用此模式）。"
  - "C++17 移除了 std::random_shuffle，OHOS 的 libc++15 不再提供；老 C++ 库按 cppstd=17 构建会编译失败，可用 std::rand() 驱动的 Fisher-Yates 等价替换（本包 5 处调用）。"
