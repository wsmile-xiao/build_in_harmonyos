software: libbpp-popgen
display: "libbpp-popgen"
description: "Bio++ 群体遗传学库——基因型/等位基因数据模型、单/多位点基因型、F 统计量与 Genepop/Genetix/Darwin 读写"
category: data
homepage: "https://github.com/BioPP/bpp-popgen"
license: CECILL-2.1
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 find_package(bpp-seq 12.0.0) 用的是 Bio++ 的 API 版本口径（= bpp-seq 的 SOVERSION），不是发布版本 2.4.1"
    - "依赖制品仓已发布的 libbpp-seq/2.4.1 静态包；该包内含 bpp-core（libbpp-core.a + bpp-core-config.cmake），故只需一个 requires"
    - "上游 cmake_minimum_required(VERSION 2.8.11)，需钉 CMAKE_POLICY_VERSION_MINIMUM=3.5 以适配现代 CMake"
    - "上游无条件安装 static+shared 两个变体，按 shared=False 交付时须在 package() 删除 .so 变体"
    - "消费者测试以绝对路径静态链接三个归档（bpp-popgen/bpp-seq/bpp-core），零运行时 .so 依赖"
  common_dependencies:
    - "libbpp-seq/2.4.1"

versions:
  "2.4.1":
    status: built
    build_date: "2026-09-23"
    conan_ref: "libbpp-popgen/2.4.1"
