# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lightmapper/2.8
homepage: "https://github.com/ands/lightmapper"

# 上游无独立测试套件：tarball 无 tests/ 目录，无 ctest/make check/meson test
# 注册；仓库仅含 example/（交互式 GL 窗口程序，依赖 GLFW+GL，CI 无窗口无法
# 运行）与 example_images/。R51 清点证据见 notes.md。
upstream_check_command: "none"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：实际调用 lmImageMin/Max/Power/Dilate/FtoUB/Add/Scale/SaveTGAub 并断言结果（CPU 侧 API，GL stub 不执行）"
    command: "./test_lightmapper"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14