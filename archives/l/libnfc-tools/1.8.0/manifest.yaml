# libnfc-tools 1.8.0 版本级 manifest（ARCHIVE-SPEC v2.0）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.0"

# 软件名
software: "libnfc-tools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（libnfc-tools 为 libnfc 源码树的 utils/+examples/ 工具拆分包）
  url: "https://github.com/nfc-tools/libnfc/releases/download/libnfc-1.8.0/libnfc-1.8.0.tar.bz2"

  # 源码校验和（与 conandata.yml 一致）
  sha256: "6d9ad31c86408711f0a60f05b1933101c7497683c2e0d8917d1611a3feba3dd5"

  # 压缩格式
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（配方自写 Makefile 直编 21 个工具，非上游 autotools）
  system: custom

  # 配置选项列表（配方等价编译选项 -std=c99 -D_XOPEN_SOURCE=600，见 conanfile.py generate()）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libnfc/1.8.0
    - libusb-compat/0.1.7
    - libusb/1.0.27

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁：所有适配均通过配方编译选项完成）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libnfc-tools 非独立上游，是 libnfc-1.8.0 源码树的 utils/+examples/ 工具拆分包（Alpine/SUSE 同口径）"  # knowledge_ref: knowledge/drafts/DRAFT-10251-libnfc-tools-1.8.0-tools-subpackage-identification.kv
  - "nfc-relay-picc.c 的 fdopen 需 -D_XOPEN_SOURCE=600（等价上游 config.h 的 AC_DEFINE）"  # knowledge_ref: knowledge/graph/E033.kv
  - "pn53x-diagnose.c 引用库内部头需 -I<src>/libnfc"  # knowledge_ref: knowledge/drafts/DRAFT-10251-libnfc-tools-1.8.0-tools-subpackage-identification.kv
  - "21 个工具源文件对 config.h 宏零使用，无需定义 HAVE_CONFIG_H"  # knowledge_ref: knowledge/drafts/DRAFT-10251-libnfc-tools-1.8.0-tools-subpackage-identification.kv
  - "手写 Makefile 时 VirtualBuildEnv 不注入 AutotoolsDeps 的 CPPFLAGS/LDFLAGS/LIBS，须显式合并 Toolchain 与 Deps 的 environment 后 apply（否则链接缺依赖符号，见 E2186）"  # knowledge_ref: knowledge/drafts/DRAFT-E2186-autotools-deps-missing-dep-flags.kv
  - "上游 6 个 Cutter 用例被 AM_CONDITIONAL(WITH_CUTTER) 守卫，Cutter 缺失时根本不进构建（make check 报 TOTAL=0）——要让上游测试真正可执行，须先补齐测试框架，'框架缺失'不是跳过上游测试的理由（R51）"  # knowledge_ref: knowledge/drafts/DRAFT-10251-libnfc-tools-1.8.0-autotools-test-framework-guard.kv
  - "OHOS musl 加载器无法通过 soname 符号链接定位共享库：libtool 产物的 libX.so.N（指向 libX.so.N.M.K 的软链）须替换为实体文件才能加载（报错 reason 为空、ctypes dlopen 却成功，是两个易误判的烟幕）"  # knowledge_ref: knowledge/graph/E505.kv
  - "automake per-target `*_CPPFLAGS =`（空值）会替换 AM_CPPFLAGS，VPATH 构建下导致头文件找不到 —— 可用 make 命令行回填绕过"  # knowledge_ref: knowledge/drafts/DRAFT-10251-libnfc-tools-1.8.0-automake-per-target-cppflags-empty-override.kv

# 知识库引用（本包沉淀的知识归宿；新草稿随本 PR 一并提交）
knowledge_ref:
  - knowledge/drafts/DRAFT-10251-libnfc-tools-1.8.0-tools-subpackage-identification.kv
  - knowledge/drafts/DRAFT-10251-libnfc-tools-1.8.0-autotools-test-framework-guard.kv
  - knowledge/drafts/DRAFT-10251-libnfc-tools-1.8.0-automake-per-target-cppflags-empty-override.kv
  - knowledge/drafts/DRAFT-E2186-autotools-deps-missing-dep-flags.kv
  - knowledge/graph/E033.kv
  - knowledge/graph/E505.kv

