# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 三步法：清点 → 实测 → 回填，详见 notes.md）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libnfc-tools/1.8.0
homepage: "https://github.com/nfc-tools/libnfc"

# 上游测试命令：libnfc 源码包 test/ 目录，Cutter 框架（>=1.1.7），
# 经 test-driver 由 automake make check 驱动
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（清点自 test/Makefile.am cutter_unit_test_libs，
# 共 6 个 Cutter 用例；均需物理 NFC 读卡器 + Cutter 框架）
upstream_tests:
  - file: test/test_access_storm.c
    source: libnfc-1.8.0/test/test_access_storm.c
    description: "访问风暴压力测试（需 PN53x 设备）"
    command: "make check (via run-test.sh + cutter)"
  - file: test/test_dep_active.c
    source: libnfc-1.8.0/test/test_dep_active.c
    description: "DEP 主动模式测试（需双设备对打）"
    command: "make check (via run-test.sh + cutter)"
  - file: test/test_dep_passive.c
    source: libnfc-1.8.0/test/test_dep_passive.c
    description: "DEP 被动模式测试（需双设备对打）"
    command: "make check (via run-test.sh + cutter)"
  - file: test/test_device_modes_as_dep.c
    source: libnfc-1.8.0/test/test_device_modes_as_dep.c
    description: "设备作为 DEP 目标模式测试（需设备）"
    command: "make check (via run-test.sh + cutter)"
  - file: test/test_register_access.c
    source: libnfc-1.8.0/test/test_register_access.c
    description: "PN53x 寄存器读写测试（需设备）"
    command: "make check (via run-test.sh + cutter)"
  - file: test/test_register_endianness.c
    source: libnfc-1.8.0/test/test_register_endianness.c
    description: "寄存器字节序测试（需设备）"
    command: "make check (via run-test.sh + cutter)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: harmonyos_specific_test.c
    description: "鸿蒙平台特有测试：编译期硬绑定 OHOS/AArch64 工具链 + 运行时链接 libnfc 调用 nfc_version() 校验依赖库 ABI 与版本 1.8.0"
    command: "clang harmonyos_specific_test.c -lnfc -lusb -lusb-1.0 -ldl -lpthread && ./harmonyos_specific_test"
  - file: run_nfc_tools_test.sh
    description: "消费者冒烟测试：真实执行 nfc-list（无设备 EXIT_SUCCESS）+ 校验 21 个工具齐全可执行"
    command: "./run_nfc_tools_test.sh <pkg>/bin"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
