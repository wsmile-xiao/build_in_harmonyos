# 版本级 manifest — lokalize 26.04.0
# 包名 lokalize = 上游产品 lokalize（KDE SDK / KDE Gear 26.04.0）
# 遵循 ARCHIVE-SPEC v2.0

version: "26.04.0"
software: "lokalize"

# 编译状态: built（本地 conan create 通过，未上传远端）
status: built
build_date: "2026-09-28"
build_system: cmake

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/lokalize-26.04.0.tar.xz"
  sha256: "d72c4d817b529c252eff748792676ee8535f5928642701ec4e18b36d066f64f9"
  tar_format: tar.xz
  git_tag_peeled: "v26.04.0 (KDE Gear 26.04.0)"

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DUSE_DBUS=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
    - "-DCMAKE_CXX_STANDARD=20"
    - "-DCMAKE_CXX_STANDARD_REQUIRED=ON"
  dependencies:
    - qtbase/6.11.1
    - qtbase-gui/6.11.1
    - qtbase-sql-dbus/6.11.1
    - ki18n/6.14.0
    - kconfig/6.14.0
    - kcoreaddons/6.14.0
    - kconfigwidgets/6.14.0
    - kitemviews/6.14.0
    - kwidgetsaddons/6.14.0
    - kio/6.14.0
    - kxmlgui/6.14.0
    - ktextwidgets/6.14.0
    - knotifications/6.14.0
    - kcrash/6.14.0
    - kiconthemes/6.14.0
    - kcolorscheme/6.14.0
    - kdbusaddons/6.14.0
    - sonnet/6.26.0
    - hunspell/1.7.3
    - ecm/6.20.0
    - tzdata/2026.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS 镜像没有 D-Bus（无守护进程/无会话总线）：lokalize 启动即退出（rc=1）；上游 USE_DBUS 开关关闭 QtDBus 初始化后，应用在无会话总线环境可正常启动"
  - "gettextheadertest 通过 QTimeZone 格式化日期，依赖 TZDIR；OHOS 镜像既无 /usr/share/zoneinfo 也无 /system/usr/share/zoneinfo，需 tool_requires tzdata 提供 zoneinfo（Qt6 未链 ICU，其 tz 后端确实读取 TZDIR）"
  - "探测 zoneinfo 候选目录必须用 os.path.exists：tz 数据库把 UTC/Europe/Moscow 等存为普通文件，isdir() 探测会拒绝所有合法数据库，表现为 QTimeZone 偏移恒为 +0000"
  - "projectmodeltest 用 QTEST_GUILESS_MAIN，却在遍历工程目录时经 KIconThemes 触发 KColorSchemeManager 的延迟调色板激活（QGuiApplication::setPalette），libKF6ColorScheme 解引用未初始化调色板后 SIGSEGV；GUI 应用本身不受影响"
  - "KF6 包把共享库装在 bin/ 而非 lib/，且本平台构建产物带 ../../bin/... 形式的构建树相对 DT_NEEDED：ctest 运行需在 LD_LIBRARY_PATH 注入各依赖 bin/ 目录，并在 scratch 目录准备 ../.. 可达的链接农场"
  - "sonnet 未发布 6.14.0，而上游 find_package(KF6Sonnet 6.14.0 REQUIRED) 接受 [6.14.0,7.0)：用 6.26.0 满足范围（KF6 其余模块保持 6.14.0 单版本链）"
