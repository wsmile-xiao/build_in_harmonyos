# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 清点方式: 解压上游源码包后执行
#   cmake -S lokalize-26.04.0 -B build -DBUILD_TESTING=ON (OHOS toolchain)
#   ctest -N   -> 7 项；ecm_add_test 注册于 src/tests/CMakeLists.txt (5) 与
#                 autotests/CMakeLists.txt (2)

package: lokalize/26.04.0
homepage: "https://invent.kde.org/sdk/lokalize"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E projectmodeltest"

# 上游实际运行的测试程序 (ctest -N 清点 7 项)
upstream_tests:
  - file: src/tests/gettextheadertest.cpp
    source: lokalize-26.04.0/src/tests/gettextheadertest.cpp
    description: "gettext 头字段解析；依赖时区数据库（TZDIR 指向 tzdata 包 zoneinfo）"
    command: "ctest -R gettextheadertest"
  - file: src/tests/filemetadatatest.cpp
    source: lokalize-26.04.0/src/tests/filemetadatatest.cpp
    description: "PO 文件元数据（译者/日期字段）读写"
    command: "ctest -R filemetadatatest"
  - file: src/tests/glossarytest.cpp
    source: lokalize-26.04.0/src/tests/glossarytest.cpp
    description: "术语表（glossary）装载与查找"
    command: "ctest -R glossarytest"
  - file: src/tests/tmjobstest.cpp
    source: lokalize-26.04.0/src/tests/tmjobstest.cpp
    description: "翻译记忆（TM）任务队列"
    command: "ctest -R tmjobstest"
  - file: src/tests/projectmodeltest.cpp
    source: lokalize-26.04.0/src/tests/projectmodeltest.cpp
    description: "工程目录树模型（无效工程/半翻译工程）；本平台运行时段错误，见 notes.md"
    command: "ctest -R projectmodeltest"
  - file: autotests/difftest.cpp
    source: lokalize-26.04.0/autotests/difftest.cpp
    description: "译文差异算法"
    command: "ctest -R difftest"
  - file: autotests/test_gettextheaderparser.cpp
    source: lokalize-26.04.0/autotests/test_gettextheaderparser.cpp
    description: "gettext 头解析器"
    command: "ctest -R test_gettextheaderparser"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "消费者用例 1：运行已安装程序取版本号（ELF 装载 + Qt 平台插件 + KF6 闭包）；OHOS 平台检查：AArch64 ET_DYN 且 DT_NEEDED 闭包可解析"
    command: 'lokalize -platform offscreen --version'
  - file: test_app.sh
    description: "消费者用例 2：打开真实 PO 文档并有界运行 20s（KIO file worker + hunspell + Qt6 SQL 翻译记忆）；用例 3：桌面消费者所需安装产物（desktop/appdata/kcfg/图标）完整性"
    command: 'sh test_app.sh <lokalize> <package-folder>'

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 24
