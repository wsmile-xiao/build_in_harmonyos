# test_package/MANIFEST.yml
# 上游官方测试声明文件 (R51 上游测试三步法)

package: libobjfwhid1/1.5.7
homepage: "https://objfw.nil.im/"

# 上游测试命令 (Autotools make check)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 make check 在适配探索阶段已实测执行通过 (1238 succeeded / 0 failed / 4 skipped)，
# 不在 conan build() 中重复集成 (仅 test_package 做消费者验证)。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (ObjFW 自研 OFTests 框架, 单一 tests 二进制)
upstream_tests:
  - file: "tests/tests"
    source: "objfw-1.5.7/tests"
    description: "ObjFW 自研测试框架二进制, 覆盖全部 OF* 单元测试 (1238 用例)"
    command: "./tests/tests"
  - file: "utils/ofgctester/OFGCTester.m"
    source: "objfw-1.5.7/utils/ofgctester/OFGCTester.m"
    description: "ofgctester: ObjFWHID 游戏手柄枚举参考工具 (需真实 /dev/input 设备)"
    command: "./ofgctester"

# test_package 中自带的测试 (消费者视角验证, 真实调用 ObjFWHID API)
test_package_tests:
  - file: "test.m"
    description: "消费者测试: 调用 +[OHGameController controllers] 真实 ObjFWHID API (evdev 后端)"
    command: "./test_libobjfwhid1"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1238
