# 编译中学到的知识
knowledge_gained:
  - "E007: GNU config.guess 无 __OHOS__/HarmonyOS 检测分支，需 patch-autotools-ohos.pl 打补丁（LIBC 检测 + HarmonyOS case 分支）输出 aarch64-unknown-linux-ohos"
  - "E122/E268: 新版 config.sub（2024+）的 kernel-OS 校验表（case $kernel-$os-$obj，linux-gnu*-...linux-mlibc*- 行）未含 linux-ohos，patch-autotools-ohos.pl 会误判已补丁，需手动追加 '| linux-ohos*- '，否则报 Kernel 'linux' not known to work with OS 'ohos'"
  - "E011: HMDFS 上 configure 的 umask 077 临时目录对当前进程不可写，configure 内 umask 077→022 修复"
  - "ObjFW 是 Objective-C 库：消费者必须用 ObjFW 运行时 flags（-fconstant-string-class=OFConstantString、-Xclang -fobjc-runtime=objfw-1.5、-fblocks），纯 C 项目需 enable_language(OBJC)"
  - "OHOS 无 OpenSSL/GnuTLS/mbedTLS TLS 后端，configure --without-tls 即可（HID 库不依赖 TLS）"
  - "make check 4 个跳过项均为平台能力缺失（UNIX stream/datagram/sequenced socket 与硬链接不支持），非库缺陷"

