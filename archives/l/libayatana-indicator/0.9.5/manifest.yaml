version: "0.9.5"
status: built
build_date: "2026-09-17"
conan_ref: "libayatana-indicator/0.9.5"

source:
  url: "https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.5.tar.gz"
  sha256: "73d71c908b803f12e4a5ecd8392511b58afbdd0c82ad7909611a17bb7847c5c8"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DENABLE_TESTS=OFF"
    - "-DENABLE_WERROR=OFF"
    - "-DENABLE_LOADER=ON"
    - "-DENABLE_IDO=ON"
    - "-DFLAVOUR_GTK3=ON"
  dependencies:
    - glib/2.84.0.1
    - gtk/3.24.43
    - ayatana-ido/0.10.4
  cc: clang
  cxx: clang++

package_contents:
  library: "lib/libayatana-indicator3.so (SONAME libayatana-indicator3.so.7, 上游硬编码 SHARED-only)"
  headers: "include/libayatana-indicator3-0.4/libayatana-indicator/*.h"
  pkg_config: "lib/pkgconfig/ayatana-indicator3-0.4.pc"
  tools: "bin/libayatana-indicator/ayatana-indicator-loader3"

patches_applied: []

notes:
  static_supported: false
  static_reason: "upstream add_library(SHARED) hardcoded; indicator_object_new_from_file() dlopen()s plugins at runtime (g_module_open)"

knowledge_gained:
  - "上游 pkg_check_modules 只用 PROJECT_DEPS_LIBRARIES，传递 -L 丢失，需配方注入依赖图 libdir（同 ayatana-ido E429）"
  - "glib-mkenums/glib-genmarshal find_program 受 runner 断链符号链接污染，显式注入 glib 包内路径（同 E543）"
  - "上游 tests/ 全部依赖 dbus-test-runner/Xvfb/gtester 桌面环境，CI 离线不可执行；test_package 用纯逻辑 API 覆盖"
  - "glib 的 PkgConfigDeps 不生成 gio-unix-2.0.pc（glib 配方无该组件）：复制 glib 包内原始 .pc 改写 prefix（accountsservice 同模式）"
  - "HarmonyOS 平台 CMake 对 VERSION/SOVERSION 不产出 -Wl,-soname：显式注入 soname flag + package() 复制版本化副本（W4/L5 门禁）"
