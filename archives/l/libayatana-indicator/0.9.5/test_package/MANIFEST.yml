# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源: tests/CMakeLists.txt（ENABLE_TESTS=ON 时注册 10 个 ctest）
# 全部测试依赖 dbus-test-runner（D-Bus session bus）+ Xvfb（X11 display）
# + gtester 桌面环境，OHOS CI runner 无 dbus-daemon / dbus-test-runner /
# Xvfb（which 均空），离线环境不可执行，故本配方 ENABLE_TESTS=OFF，
# 不在 conan create 中运行上游测试（MANIFEST 如实声明，不伪造通过）。
# 离线验证由 test_package 承担（见下方 test_package_tests）。

package: libayatana-indicator/0.9.5
homepage: "https://github.com/AyatanaIndicators/libayatana-indicator"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（10 个 ctest，均因环境依赖离线不可执行）
upstream_tests:
  - file: tests/service-manager-connect.c
    source: libayatana-indicator-0.9.5/tests/service-manager-connect.c
    description: "IndicatorServiceManager 连接测试 — 需 dbus-test-runner + session.conf（构建生成），CI 无 dbus-daemon 不可执行"
    command: "ctest -R service-manager-connect-tester"
  - file: tests/service-manager-no-connect.c
    source: libayatana-indicator-0.9.5/tests/service-manager-no-connect.c
    description: "IndicatorServiceManager 不连接场景 — 需 dbus-test-runner + /usr/share/dbus-test-runner/session.conf，不可执行"
    command: "ctest -R service-manager-no-connect-tester"
  - file: tests/service-manager-nostart-connect.c
    source: libayatana-indicator-0.9.5/tests/service-manager-nostart-connect.c
    description: "IndicatorServiceManager connect-nostart 场景（配 service-manager-connect-service.c）— 需 dbus-test-runner 双 task，不可执行"
    command: "ctest -R service-manager-connect-nostart-tester"
  - file: tests/service-shutdown-timeout.c
    source: libayatana-indicator-0.9.5/tests/service-shutdown-timeout.c
    description: "IndicatorService 关闭超时测试 — 需 dbus-test-runner + /usr/share/dbus-test-runner/session.conf，不可执行"
    command: "ctest -R service-shutdown-timeout-tester"
  - file: tests/service-version-manager.c
    source: libayatana-indicator-0.9.5/tests/service-version-manager.c
    description: "IndicatorService 版本协商测试（配 service-version-good/bad-service.c）— 需 dbus-test-runner + session.conf，不可执行"
    command: "ctest -R service-version-tester"
  - file: tests/service-version-multiwatch-manager.c
    source: libayatana-indicator-0.9.5/tests/service-version-multiwatch-manager.c
    description: "IndicatorService 多 watch 版本协商（8 task 并发，配 multiwatch-service/manager-impolite.c）— 需 dbus-test-runner，不可执行"
    command: "ctest -R service-version-multiwatch-tester"
  - file: tests/test-desktop-shortcuts.c
    source: libayatana-indicator-0.9.5/tests/test-desktop-shortcuts.c
    description: "IndicatorDesktopShortcuts 测试 — 需 gtester + Xvfb（run-xvfb.sh），CI 无 Xvfb 不可执行"
    command: "ctest -R test-desktop-shortcuts-tester"
  - file: tests/test-css-provider-leak.c
    source: libayatana-indicator-0.9.5/tests/test-css-provider-leak.c
    description: "GtkCssProvider 泄漏测试 — 需 gtester + Xvfb，不可执行"
    command: "ctest -R test-css-provider-leak-tester"
  - file: tests/test-indicator-ng.c
    source: libayatana-indicator-0.9.5/tests/test-indicator-ng.c
    description: "indicator-ng 加载器测试 — 需 dbus-test-runner + gtester + Xvfb，不可执行"
    command: "ctest -R test-indicator-ng-tester"
  - file: tests/test-loader.c
    source: libayatana-indicator-0.9.5/tests/test-loader.c
    description: "ayatana-indicator-loader 加载 dummy-indicator-* 插件测试 — 需 gtester + Xvfb（run-xvfb.sh），不可执行"
    command: "ctest -R loader-tester"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试（离线可执行，实测 4/4 PASS）：GObject 类型注册 indicator-object 类型可达 / 对象 unref 生命周期平衡 / IndicatorDesktopShortcuts 用真实 .desktop fixture（同上游 test-well-formed.desktop 手法）解析 Actions 段与 nick→Name 映射 / service-manager 头文件链接；另含 indicator-ng.h 编译期验证（WITH_IDO）"
    command: "./test_libayatana-indicator"
  - file: test-well-formed.desktop
    description: "desktop-shortcuts 用例的 .desktop fixture（上游同源文件）"
    command: "(fixture)"

# 测试断言总数 (近似值, 用于质量评估)
# test.c: 4 个 g_test 用例 + 3 项 HarmonyOS 专项 ELF 检查
# (ELF64+AArch64 / NEEDED 含 libayatana-indicator3.so.7 / RPATH 无泄漏)
assertion_count: 7
