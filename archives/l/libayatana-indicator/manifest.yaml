software: libayatana-indicator
display: "libayatana-indicator"
description: "Ayatana Indicators 核心库（indicator-object/service 框架，面板指示器插件 API）"
category: system
homepage: "https://github.com/AyatanaIndicators/libayatana-indicator"
license: GPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "pkg_check_modules 只取 _LIBRARIES 丢 _LIBRARY_DIRS，需配方注入依赖图 libdir"
    - "glib-mkenums/glib-genmarshal 受 runner 断链符号链接污染，显式注入 glib 包内路径"
    - "上游 tests 依赖 dbus-test-runner/Xvfb 桌面环境，离线 CI 不可执行"
  common_dependencies:
    - glib
    - gtk
    - ayatana-ido

versions:
  "0.9.5":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libayatana-indicator/0.9.5"
