version: "0.9.4"
status: done
build_date: "2026-09-18"
conan_ref: "libayatana-indicator/0.9.4"

source:
  url: "https://github.com/AyatanaIndicators/libayatana-indicator/archive/refs/tags/0.9.4.tar.gz"
  sha256: "a18d3c682e29afd77db24366f8475b26bda22b0e16ff569a2ec71cd6eb4eac95"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DENABLE_TESTS=OFF"
    - "-DENABLE_WERROR=OFF"
    - "-DENABLE_LOADER=ON"
    - "-DENABLE_IDO=ON"
    - "-DFLAVOUR_GTK3=ON"
  dependencies:
    - glib/2.84.0.1
    - gtk/3.24.43
    - ayatana-ido/0.10.4
  cc: clang
  cxx: clang++

package_contents:
  library: "lib/libayatana-indicator3.so (SONAME libayatana-indicator3.so.7, 上游硬编码 SHARED-only)"
  headers: "include/libayatana-indicator3-0.4/libayatana-indicator/*.h (7 个公共头)"
  pkg_config: "lib/pkgconfig/ayatana-indicator3-0.4.pc"
  tools: "libexec/libayatana-indicator/ayatana-indicator-loader3"
  data: "share/libayatana-indicator/80indicator-debugging"

patches_applied: []

conan_create:
  profile: "ci/conan/profiles/ohos-aarch64"
  shared: true
  shared_result: "rc=0 (package_id 2ac3f268672507aadbbd31130c0dee0a810fff47, rrev 48f7679ae83670b0d7b106ac121f5afa)"
  static: false
  static_reason: "validate() 拒绝: 上游 add_library 硬编码 SHARED (无 BUILD_SHARED_LIBS 分支); 核心API indicator_object_new_from_file() 运行时 g_module_open dlopen 插件, shared-only 为上游设计, 不强行支持"
  elf:
    library: "ELF64 / Little-Endian / AArch64, SONAME libayatana-indicator3.so.7, 无 RPATH/RUNPATH, NEEDED 34 项"
    consumer: "ELF64 / Little-Endian / AArch64 (e_machine 183), NEEDED 含 libayatana-indicator3.so.7, 无 RPATH/RUNPATH 宿主路径"

tests:
  # 统一口径: 逻辑测试用例 (CTest runner 数不与内部 g_test 重复相加)
  # 上游正式逻辑测试总数 = 18 个 g_test case (test-loader 11 + test-desktop-shortcuts 4
  # + test-indicator-ng 3) + 6 个独立 service-* CTest tester = 24
  upstream:
    total_logic_tests: 24
    passed: 15
    not_runnable: 9
    failed: 0
    detail:
      - "test-loader: 11/11 PASS (broadwayd 无头; dummy 插件补构建后)"
      - "test-desktop-shortcuts: 4/4 PASS (broadwayd 无头)"
      - "test-indicator-ng: 3 用例不可执行 (g_test_dbus 需 dbus-daemon 二进制, 环境缺失)"
      - "6 个 service-* tester 不可执行 (dbus-test-runner + dbus-daemon + session bus/machine-id 缺失)"
    summary: "24 个正式逻辑测试中 15 个真实通过, 9 个因 D-Bus 测试环境缺失无法执行, 0 个执行失败"
    note: "上游测试逻辑零修改; 直接执行测试二进制 (conan 缓存 gtester 因共享 worker noexec 不可执行, gtester 仅为 TAP 包装器)"
  new_tests:
    consumer_gtest: 6
    consumer_gtest_passed: 6
    ohos_specific: 1
    ohos_specific_passed: 1
    total: 7
    total_passed: 7  # 7/7 (100%)
  totals:
    logic_tests_after_adaptation: 31  # 24 上游 + 7 新增
    total_passed: 22  # 15 上游 + 6 consumer + 1 OHOS
    not_runnable: 9
    failed: 0
  assertion_note: "统计口径: 逻辑测试用例计数 (g_test case + 独立 tester), g_assert 不拆分; static/shared 不重复计数"

notes:
  static_supported: false
  static_reason: "upstream add_library(SHARED) hardcoded; indicator_object_new_from_file() dlopen()s plugins at runtime (g_module_open)"

knowledge_gained:
  - "0.9.4 src/CMakeLists.txt 用 ${PROJECT_DEPS_LIBRARIES} 裸 -l 名单且 -L 目录不进链接行（同 ayatana-ido E429 类根因），配方遍历依赖图注入全部 libdir"
  - "glib-mkenums/glib-genmarshal find_program 受 runner 断链符号链接污染，显式注入 glib 包内路径（同 E543 类根因）"
  - "glib 的 PkgConfigDeps 不生成 gio-unix-2.0.pc（glib 配方无该组件）：复制 glib 包内原始 .pc 改写 prefix（同 accountsservice 模式）"
  - "HarmonyOS 平台 CMake 对 VERSION/SOVERSION 不产出 -Wl,-soname：显式注入 soname flag + package() 复制版本化副本（W4/L5 门禁）"
  - "0.9.4 API 语义（版本特定, 非 OHOS 根因）: 裸 IndicatorObject 基类实例化 fatal (constructed() g_error); nick_get_name 非法 nick 走 CRITICAL; 库 g_warning 为 NULL log domain; g_signal_lookup 前需 class_ref 触发 class_init"

knowledge_base_decision:
  path: "A"
  new_draft: false
  reason: "无新的 HarmonyOS 平台性可跨包复用根因; 与 0.9.5 相同根因的 5 项适配复用既有知识, 上游 API 语义项与开发环境项均不满足入库标准"
