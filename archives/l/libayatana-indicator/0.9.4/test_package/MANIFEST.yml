# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libayatana-indicator/0.9.4
homepage: "https://github.com/AyatanaIndicators/libayatana-indicator"

# 上游测试命令: CMake 工程, ENABLE_TESTS=ON 时 tests/ 注册 9 个 ctest 条目
upstream_check_command: "ctest --test-dir build -N"

# conanfile.py build() 方法中是否已集成上游测试
# (配方 ENABLE_TESTS=OFF 构建库; 上游测试在 Task #6 以独立 ENABLE_TESTS=ON
#  构建树真实执行可执行子集, 结果见 notes.md / manifest.yaml)
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序 (tests/CMakeLists.txt, ENABLE_TESTS=ON, 共 9 个 ctest 条目;
# g_test 用例 18 个 = test-loader 11 + test-desktop-shortcuts 4 +
# test-indicator-ng 3; 另 6 个 service-* tester 为 dbus-test-runner 集成用例)
# 真实执行结果 (2026-09-18, broadwayd 无头显示方案, 直接执行测试二进制):
#   test-loader: 11/11 PASS (需先构建 6 个 dummy-indicator-*.so 插件)
#   test-desktop-shortcuts: 4/4 PASS
#   test-indicator-ng: 3 用例不可执行 (g_test_dbus 需 dbus-daemon 二进制)
#   6 个 service-* tester: 不可执行 (dbus-test-runner + dbus-daemon 缺失)
upstream_tests:
  - file: tests/test-loader.c
    source: libayatana-indicator-0.9.4/tests/test-loader.c
    description: "loader 单元测试: 11 个 g_test_add_func 用例 (含 6 个 dummy 插件加载)"
    command: "./test-loader"
    runnable_offline: true  # broadwayd 无头方案下真实执行 11/11 PASS
    result: "PASS 11/11"
  - file: tests/test-desktop-shortcuts.c
    source: libayatana-indicator-0.9.4/tests/test-desktop-shortcuts.c
    description: "desktop-shortcuts 单元测试: 4 个 g_test_add_func 用例 (creation/globalnosho/nicknames/launch)"
    command: "./test-desktop-shortcuts"
    runnable_offline: true  # broadwayd 无头方案下真实执行 4/4 PASS
    result: "PASS 4/4"
  - file: tests/test-indicator-ng.c
    source: libayatana-indicator-0.9.4/tests/test-indicator-ng.c
    description: "indicator-ng 单元测试: 3 个用例 (non-existing/instantiation/instantiation-with-profile), g_test_dbus 自建私有 bus"
    command: "./test-indicator-ng"
    runnable_offline: false  # 需 dbus-daemon 二进制, 环境缺失, 不伪造
    result: "NOT RUNNABLE (dbus-daemon missing)"
  - file: tests/service-manager-connect*.c 等 6 个 service-* tester
    source: libayatana-indicator-0.9.4/tests/service-*.c
    description: "service/manager 集成测试 (dbus-test-runner 包装, 需 session bus + machine-id)"
    command: "ctest (service-*-tester)"
    runnable_offline: false  # dbus-test-runner + dbus-daemon + /var/lib/dbus/machine-id 缺失
    result: "NOT RUNNABLE (dbus-test-runner/dbus-daemon missing)"

# test_package 中自带的测试 (消费者视角验证, 离线可执行)
test_package_tests:
  - file: test_package/test.c
    description: "消费者测试 6 用例: GObject 类型注册 (4 类型宏) / 对象类型元数据+class vtable / DesktopShortcuts 解析+缺失文件安全失败 / ServiceManager 构造析构 / Service 信号元数据 (class_init 后 lookup) — 全部离线纯逻辑, 无需桌面 session/DBus/Xvfb/真实插件"
    command: "./test_libayatana_indicator"
    result: "PASS 6/6 (conan create test_package 阶段)"

# OHOS 专项 (test_package/conanfile.py::test 内 3 处显式 self.run 真实执行)
ohos_checks:
  - "消费者二进制: ELF64 + Little-Endian + AArch64 (e_machine 183)"
  - "消费者二进制: NEEDED 含 libayatana-indicator3.so.7"
  - "消费者二进制: RPATH/RUNPATH 无宿主路径 (/storage /home /tmp /build)"
  - "库产物: ELF64 + Little-Endian + AArch64"
  - "库产物: DT_SONAME == libayatana-indicator3.so.7"
  - "库产物: RPATH/RUNPATH 无宿主路径"
  result: "ALL PASS (2026-09-18 conan create shared=True)"

# 统一统计口径: 逻辑测试用例 (CTest runner 数不与内部 g_test 重复相加)
# 上游正式逻辑测试 = 18 g_test case + 6 独立 service-* tester = 24
# 上游: 15 PASS / 9 环境限制未执行 (D-Bus 测试环境缺失) / 0 失败
# 新增: 6 consumer + 1 OHOS = 7/7 PASS
# 适配后: 总数 31, 实际 PASS 22, 未执行 9, 失败 0
test_counts:
  upstream_logic_total: 24  # 18 g_test case (loader 11 + ds 4 + ng 3) + 6 service tester
  upstream_passed: 15
  upstream_not_runnable: 9
  upstream_failed: 0
  consumer_gtest_total: 6
  consumer_gtest_passed: 6
  ohos_specific: 1
  ohos_specific_passed: 1
  new_tests_total: 7
  new_tests_passed: 7  # 7/7 (100%)
  logic_tests_after_adaptation: 31  # 24 + 7
  total_passed: 22  # 15 + 6 + 1
  assertion_note: "g_assert 不拆分; static/shared 不重复计数"
