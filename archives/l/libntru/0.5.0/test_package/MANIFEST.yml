# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libntru/0.5.0
homepage: "https://github.com/tbuktu/libntru"

# 上游测试命令 (make check / ctest -N / meson test --list 分析)
upstream_check_command: "make -f Makefile test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -f Makefile test CC=clang AR=llvm-ar"

# 上游实际运行的测试程序
# libntru 0.5 测试框架: tests/test.c main 调用 6 个套件函数, 每个 print_result()
# 调用为 1 个独立用户用例, 共 11 个 (testham 全功能构建)
upstream_tests:
  - file: tests/test.c
    source: libntru-0.5.0/tests/test.c
    description: "testham: 11 个独立用例 (test_mult_int/test_mult_tern/test_mult_prod/test_inv/test_arr/test_keygen/test_encr_decr/test_idxgen/test_bitstring/test_key/test_hash)"
    command: "LD_LIBRARY_PATH=. ./testham"
  - file: tests/test.c
    source: libntru-0.5.0/tests/test.c
    description: "testnoham: 专利规避构建 (-DNTRU_AVOID_HAMMING_WT_PATENT), test_mult_prod 被上游显式宏门控排除, 10 用例"
    command: "LD_LIBRARY_PATH=. ./testnoham"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 smoke: 链接 libntru, 密钥生成→加密→解密往返"
    command: "./test_libntru"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
