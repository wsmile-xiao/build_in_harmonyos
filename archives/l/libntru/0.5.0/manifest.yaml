knowledge_gained:
  - "OHOS (musl libc) defines __OHOS__ and __linux__ but not __GLIBC__; upstream libntru ntru_endian.h only handled __APPLE__/__MINGW32__/__GLIBC__<2.9/__OS2__, leaving htole32/64/16 undeclared on OHOS and failing the shared-library link with 'undefined reference ... htole32'. Patch adds a __OHOS__/__linux__/__FreeBSD__ branch that includes <endian.h> (musl provides htole* there)."
