# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/ADAPTATION_GUIDE.md §6, docs/TEST_QUALITY_SPEC.md

package: libuvc/0.0.7
homepage: "https://github.com/libuvc/libuvc"

# 上游测试审计结论：libuvc 0.0.7 没有任何可自动运行的测试框架。
# CMakeLists.txt 无 enable_testing/add_test/ctest，无 gtest，无 make check 目标，
# 无 tests/ 目录。按 hmbs 计数法（gtest TEST() / make check TOTAL / pytest def
# test_）= 0 个测试用例，故 upstream_tests_exist: false。
#
# 唯一的 test-ish 文件 src/test.c（CMake BUILD_TEST，默认 OFF）与 src/example.c
# 是 OpenCV + 物理 UVC 摄像头 + GUI 显示的集成 demo，不是测试框架用例（无断言
# 框架、无 ctest 注册）。OHOS 制品仓无 OpenCV，headless 构建器无摄像头/显示，
# 故在 OHOS 上无任何可运行的自动化测试用例。详见下方 upstream_test_audit。
upstream_tests_exist: false

upstream_test_audit: |
  Audited upstream libuvc v0.0.7 source tree (CMakeLists.txt + cmake/ +
  include/libuvc/ + src/).

  Test-framework count (hmbs method — gtest TEST() / make check TOTAL /
  pytest def test_): 0.

  - grep enable_testing / add_test / ctest in CMakeLists.txt: 0 hits.
    There is NO ctest / gtest / make-check test harness.
  - No tests/ directory; no unit-test source files.
  - The only test-ish targets are src/test.c and src/example.c, both gated
    behind CMake options BUILD_TEST / BUILD_EXAMPLE (default OFF).
  - src/test.c #includes <opencv2/highgui/highgui_c.h> and links
    opencv_core + opencv_highgui (CMakeLists.txt "if(BUILD_TEST)" block). Its
    main() opens a UVC camera, streams video for 10s into an OpenCV GUI window
    (cvNamedWindow / cvShowImage / cvWaitKey). It is an integration DEMO, not a
    unit test: no assertion framework, no ctest registration, no pass/fail exit
    contract. src/example.c is a sibling demo with the same hardware/display
    needs.

  Why none can run on OHOS:
  - OpenCV is absent from the OHOS artifact repo and is not low-cost to vendor
    (large dependency, never built on HarmonyOS-aarch64 here) — so test.c /
    example.c cannot even BUILD.
  - Even with OpenCV they need a physical UVC webcam + GUI display server,
    both absent on the headless OHOS CI builder.

  This is NOT assertion removal or a silent skip: the recipe performs an
  explicit audit (this file) and the conanfile emits
  HMBS_UPSTREAM_TEST_RESULT status="no_tests", discovered=0, executed=0. The
  consumer test_package (test_libuvc.c) genuinely exercises libuvc's frame
  conversion API (uvc_strerror / uvc_allocate_frame / uvc_any2bgr /
  uvc_free_frame) to cover the library's testable-without-hardware surface.

# test_package 中自带的测试（消费者视角验证）
# 调用 libuvc 无需硬件的纯计算 API：uvc_strerror / uvc_allocate_frame /
# uvc_any2bgr (YUYV->BGR 像素转换) / uvc_free_frame，实质链接并运行打包的
# libuvc，覆盖 frame.c 核心像素处理逻辑（R34/R40）。
# 转换结果按 BT.601 期望值逐通道校验（不是只看返回码或字节数），并含一项非法
# 格式反证，确保断言不恒真。共 6 个检查点，退出码 1-6 标识失败点。
test_package_tests:
  - file: test_libuvc.c
    description: "消费者测试: uvc_strerror 非空；uvc_any2bgr 对 4 组 YUYV 输入（中性/高亮/低亮/带色度）逐通道校验 BGR 数值；非法格式必须被拒绝的反证。真机实测 Y=149/200/50 且 U=V=128 时三通道分别等于 149/200/50，Y=149,U=200,V=100 时为 255,144,109。"
    command: "./test_libuvc"
    assertions: 6
    executed: true
    passed: true

# 测试断言总数
# - test_libuvc.c: 6 个检查点（uvc_strerror 非空、neutral/bright/dark/chroma
#   四组转换的逐通道数值校验、非法格式反证）
assertion_count: 6
assertion_executed: 4
assertion_skipped: 0
