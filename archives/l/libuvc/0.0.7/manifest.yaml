software: libuvc
version: "0.0.7"
status: built
build_date: "2026-08-13"
compile_date: "2026-08-13"
build_system: cmake
conan_ref: "libuvc/0.0.7"

source:
  url: "https://github.com/libuvc/libuvc/archive/refs/tags/v0.0.7.tar.gz"
  sha256: "7c6ba79723ad5d0ccdfbe6cadcfbd03f9f75b701d7ba96631eb1fd929a86ee72"
  tar_format: tar.gz

build:
  system: cmake

configure_options: "BUILD_EXAMPLE=OFF BUILD_TEST=OFF CMAKE_BUILD_TARGET=Shared"

dependencies:
  - "libusb/1.0.27"

platform_notes:
  - "CMake 不识别 HarmonyOS（E092），设置 CMAKE_SYSTEM_NAME=Linux 让 if(UNIX AND NOT APPLE) 的 pthread 探测生效"
  - "改写 cmake/FindLibUSB.cmake：从 Conan 注入的 LIBUSB_INCLUDE_DIR/LIBUSB_LIBRARIES 缓存变量构造 LibUSB::LibUSB，绕过 headless OHOS 不可靠的 pkg-config"
  - "上游测试 src/test.c 需 OpenCV + 物理 UVC 摄像头 + GUI 显示，OHOS 无 OpenCV，按 hmbs 放弃路径申报 executed=0 skipped=1"
  - "libusb 在鸿蒙沙箱中 USB I/O 受 SELinux neverallow 阻断；libuvc 作为系统服务（usb_host 域）使用时可正常通信"
