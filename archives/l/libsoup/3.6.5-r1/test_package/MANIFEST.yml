# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 libsoup 3.6.5 自带测试套件（tests/ 目录 + meson test 驱动），
# 本次适配未迁移运行（依赖完整测试环境）；test_package 为 OHOS 适配
# 自研的 L1 验证。

package: libsoup/3.6.5-r1
homepage: "https://github.com/GNOME/libsoup"

# 上游官方测试：tests/ 目录 + meson test
upstream_official_tests:
  - suite: "meson test"
    count: 30
    kind: "unit"
    command: "meson test"

# 构建阶段执行的测试命令：上游 meson test（本次适配未运行）
upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: "meson test"

# 适配补全测试（自研，非上游）：无（未迁移 meson test，消费者验证集中在
# test_package 的 L1 验证）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test.cpp
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：链接 libsoup-3.0 并调用 soup_version_string() 获取版本，断言非空，验证库真实可用"
    command: "./test_libsoup"

# 测试断言总数 (实际统计：1 项断言，全部为适配自研断言：
# soup_version_string() 非空)
assertion_count: 1
