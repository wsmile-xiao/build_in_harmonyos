knowledge_gained:
  - libsoup2 静态内嵌 glib2（shared=False）与共享 glib/2.84 并存 → 双 GObject
    类型系统冲突（g_param_spec_pool_lookup 断言 SIGABRT）；改用共享 glib 单副本
  - Conan PkgConfigDeps 生成的 glib-2.0.pc 缺 -lintl，链接 soup-init.c 时
    g_libintl_* undefined；用官方 glib-2.0.pc 覆盖修正
  - OHOS strip 破坏 .codesign hash（tc.strip=None）；meson install 破坏 DT_RUNPATH
    （复制原始构建产物）
patches_applied: []
source_url: https://download.gnome.org/sources/libsoup/2.74/libsoup-2.74.3.tar.xz
