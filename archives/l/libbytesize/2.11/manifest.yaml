software: libbytesize
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.11"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）— 自检必填字段
compile_date: "2026-06-01"

# 构建系统类型（G4 门禁必需字段）
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/storaged-project/libbytesize/releases/download/2.11/libbytesize-2.11.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（--prefix 已由 clean-verify 自动添加，此处仅记录额外选项）
  configure_options: ""
  # 环境变量（clean-verify 需要设置）
  env_vars:
    PKG_CONFIG_PATH: "$DEFAULT_PREFIX/lib/pkgconfig"
    CPPFLAGS: "-I$DEFAULT_PREFIX/include"
    LDFLAGS: "-L$DEFAULT_PREFIX/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gmp/6.3.0
    - mpfr/4.2.1
    - gettext/0.22.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.in.patch"
  - "0002-config.guess.patch"
  - "0003-config.sub.patch"
  - "0004-configure.patch"
  - "0005-dist-libbytesize.spec.patch"
  - "0006-tools-Makefile.patch"
  - "0007-tools-Makefile.in.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ref: E007/E072 — autotools 项目需补丁 config.guess/config.sub 以识别 HarmonyOS"
  - "ref: E011 — HMDFS 上 umask 077 导致 configure 创建临时目录失败，需 sed 为 umask 022（运行时修复，不作为补丁）"
  - "ref: E080 — HarmonyOS 缺少 GNU install 命令，需用 ginstall 替代 Makefile.in 中的硬编码 install"
  - "ref: E085 — libbytesize.so 需要 g_libintl_dgettext 符号（来自 libintl_glib.so），运行时必须链接 -lintl_glib"
  - "ref: E086 — bscalc Python 脚本在 HarmonyOS 上受限：shebang 需修改 + ctypes dlopen 权限限制"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libbytesize-2.11.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libbytesize-2.11.work
  generated_at: '2026-06-02T15:15:00'
  patches_count: 3

