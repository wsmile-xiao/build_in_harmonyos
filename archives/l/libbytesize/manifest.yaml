software: libbytesize
display: "libbytesize"
description: "C library for working with arbitrary sizes in bytes, supporting arithmetic operations and human-readable unit conversion"
category: system                    # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://github.com/storaged-project/libbytesize"
license: LGPL-2.1-or-later
build_system: autotools             # 常用构建系统（可被版本级覆盖）

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "autotools 项目需补丁 config.guess/config.sub 以识别 HarmonyOS (E007/E072)"
    - "HMDFS umask 077 导致 config.status 创建临时目录失败，需 sed 为 umask 022 (E011)"
    - "HarmonyOS 缺少 GNU install 命令，Makefile.in 中硬编码 install 需改为 ginstall (E080)"
    - "运行使用 libbytesize.so 的程序时必须链接 -lintl_glib（g_libintl_dgettext 符号）"
    - "bscalc Python 脚本受限：shebang 需改 + ctypes dlopen 权限限制"
  common_dependencies:
    - gmp
    - mpfr
    - gettext
    - pcre2
    - libintl_glib

# 版本索引（所有已归档版本，含状态）
versions:
  "2.11":
    status: built                  # published | built | failed | archived
    build_date: "2026-06-01"