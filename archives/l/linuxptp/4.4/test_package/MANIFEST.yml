# test_package/MANIFEST.yml
# linuxptp 4.4 上游测试声明（CI L0e 强制文件）
#
# ── 上游测试清点结论：上游 4.4 完全没有测试 ────────────────────────────────
#   证据 1  源码包全树 `find . -iname "*test*"` → 0 个匹配（无 tests/ 目录）
#   证据 2  `make -n check` → "make: *** No rule to make target 'check'.  Stop."
#   证据 3  构建系统只有 Makefile（无 CMakeLists.txt / meson.build / configure），
#           全树无 conftest.py、无 test_*.py、无 ctest 注册
#   上述命令的原始输出见 notes.md「上游测试清点」一节。
package: linuxptp/4.4
homepage: "https://linuxptp.sourceforge.net/"

# 上游测试命令：不存在（无 check/test 目标）
upstream_check_command: ""
# conanfile.py build() 中是否集成上游测试：上游无测试可集成
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# ── 路径 B：补全的单元测试 ────────────────────────────────────────────────
# 由 conanfile.py 的 build() 在上游 make 之后编译并实跑：直接链接 make 产出的
# 对象（filter/mave/mmedian/hash/lstab/tsproc/print/util/phc/sk），覆盖核心算法
# API，全部为确定性断言（非空壳、非 int main(){return 0;}）。
supplementary_tests:
  - file: tests/test_linuxptp_units.c
    source: linuxptp-4.4/tests/test_linuxptp_units.c
    description: >-
      补全单元测试 — tmv 运算与时钟/线格式转换、滑动均值(length 4)、
      滑动中位数(length 3/2)、hash 表(插入/重复拒绝/查找/销毁回调)、
      闰秒表(OK/AMBIGUOUS/EXPIRED/UNKNOWN)、tsproc 原始时延与偏差计算
    command: "./linuxptp_units"
    assertion_count: 67

# ── test_package 自带的测试（消费者视角：调用已安装的九个二进制）────────────
test_package_tests:
  - file: test.sh
    description: >-
      消费者测试 — 对 9 个已安装二进制逐个执行 5 项断言
      （存在性、`-v` 退出码、`-v` 版本号、`-h` usage 行、`-h` 退出码）= 45 项
    command: "bash test.sh"
    assertion_count: 45
  - file: test_ohos/run_ohos_test.sh
    description: >-
      鸿蒙专项 — aarch64 ELF 校验（T1a/T1b）、宿主绝对路径泄漏（T2）、
      本机可执行性（T3）、ptp4l 异常网卡退出码（T4）、man8 手册随包分发（T5）
    command: "sh test_ohos/run_ohos_test.sh <package_folder>"
    assertion_count: 6

# 断言总数 = 补全单元测试 67 + 消费者测试 45 + 鸿蒙专项 6 = 118
assertion_count: 118
