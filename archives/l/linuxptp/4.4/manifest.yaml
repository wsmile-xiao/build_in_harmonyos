knowledge_gained:
  - "incdefs.sh 用 ${KBUILD_OUTPUT}/usr/include 探测内核 UAPI 头（上游跨编译钩子）；不设置则回退宿主 /usr/include 全部 grep 失败，missing.h 会重定义 HWTSTAMP_TX_ONESTEP_*（knowledge_ref: E119）"
  - "OHOS sysroot <sys/socket.h> 以 #ifndef __MUSL__ 守卫 sockaddr_storage，而 <linux/socket.h> 无条件定义；裸 clang 不预定义 __MUSL__ 故必须显式 -D__MUSL__（knowledge_ref: E091）"
  - "linuxptp Makefile 硬编码 CC = $(CROSS_COMPILE)gcc，OHOS 无 gcc，必须经 Conan conf 注入 clang（knowledge_ref: E119，同族：OHOS toolchain 编译器注入）"
  - "OHOS 无 install(1)（coreutils 缺口，与 E010 的 toybox/GNU 工具替代同族），package() 必须直接复制产物而非依赖 make install（knowledge_ref: E010）"
  - "linuxptp 九个子命令均不支持 --version（unrecognized option），平台 smoke 须回退 -h/-v（knowledge_ref: none，属配方内冒烟约定，未入库）"

knowledge_ref:
  - "knowledge/doc/E091.md"
  - "knowledge/doc/E119.md"
  - "knowledge/doc/E010.md"
