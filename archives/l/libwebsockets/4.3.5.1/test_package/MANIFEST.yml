package: libwebsockets/4.3.5.1
homepage: "https://libwebsockets.org"

upstream_check_command: "conan create archives/l/libwebsockets/4.3.5.1 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 -r=ohpcd --build=libwebsockets/4.3.5.1 -c tools.build:jobs=1"
upstream_test_in_build: false
upstream_test_command: "for d in minimal-examples/api-tests/api-test-*; do cmake -S $d -B build/$d ... && cmake --build ... && ./lws-api-test-*; done"

upstream_tests:
  - framework: CTest
    source: libwebsockets-4.3.5/minimal-examples/api-tests
    total: 6
    passed: 6
    failed: 0
    note: >
      api-tests 共 19 个入口；其中 6 个在当前包构建配置下可构建运行且全部通过
      (api-test-lejp, api-test-lws_cache, api-test-lws_map, api-test-lws_smd,
      api-test-lws_tokenize, api-test-lwsac)。其余 13 个因上游 require_lws_config
      门禁要求 LWS_WITH_CBOR/GENCRYPTO/JOSE/COSE/LWS_DSH/SEQUENCER/STRUCT_JSON/
      STRUCT_SQLITE3/FTS/SMTP/SECURE_STREAMS/SYS_ASYNC_DNS/SYS_DHCP_CLIENT 等
      默认关闭特性而无法配置运行，属条件性不可运行，不计入通过。
      本轮为 R37 修复（依赖项修复），沿用 4.3.5 的上游测试结论，并重新核验。

test_package_tests:
  - file: test.c
    description: >
      Consumer smoke test: header include, link, compile-time LWS_WITH_LIBUV
      macro (#error if missing), real lws_uv_getloop() call against a context
      created with foreign uv_loop (ttyd 1.7.7 pattern), uv_loop_init/close +
      uv_version() proving libuv transitive dependency links, lws_dll2
      lifecycle, offline lejp JSON parse.
    command: "lws_consumer"

assertion_count: 13
