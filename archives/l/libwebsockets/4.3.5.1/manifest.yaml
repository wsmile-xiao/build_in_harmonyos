software: libwebsockets
# 版本级 manifest（ARCHIVE-SPEC v2.0）
# 文件位置: archives/l/libwebsockets/4.3.5.1/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 平台版本号（R37：上游 v4.3.5 + 适配修复后缀 .1）
version: "4.3.5.1"

# 编译状态
# published | built | failed | archived
# 注意：本版本已通过 conan-verify 与 finish built，但未提交 release/upload CI，
# 因此只能标记为 built，不得标记为 published。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-16"

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游源码版本：v4.3.5（4.3.5.1 是 R37 适配修复后缀，不是新上游版本）
  upstream_version: "v4.3.5"

  # 源码下载 URL（官方 GitHub release 归档，不使用本机 file:// 路径）
  url: "https://github.com/warmcat/libwebsockets/archive/refs/tags/v4.3.5.tar.gz"

  # 源码校验和
  sha256: "87f99ad32803ed325fceac5327aae1f5c1b417d54ee61ad36cffc8df5f5ab276"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DLWS_WITH_SSL=ON"
    - "-DLWS_WITH_LIBUV=ON"
    - "-DLWS_WITH_EVLIB_PLUGINS=OFF"
    - "-DLWS_WITH_HTTP2=ON"
    - "-DLWS_WITHOUT_TESTAPPS=ON"
    - "-DLWS_WITH_MINIMAL_EXAMPLES=OFF"
    - "-DLWS_WITHOUT_EXTENSIONS=ON"
    - "-DLWS_WITH_NETLINK=ON"
    - "-DLWS_WITH_IPV6=ON"
    - "-DLWS_WITH_CLIENT=ON"
    - "-DLWS_WITH_SERVER=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6
    - libuv/1.52.1

  # 编译器（由 Conan OHOS profile 提供）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（3 个，均已在官方 v4.3.5 源码上验证可干净应用）
patches_applied:
  - "0001-lib-core-net-client-sort-dns.c.patch"
  - "0002-lib-roles-netlink-ops-netlink.c.patch"
  - "0003-lib-event-libs-libuv-libuv.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 内核头文件 linux/if_addr.h / linux/netlink.h 引入的 sockaddr_storage 与 musl libc sys/socket.h 冲突，需要在其 include 前 #define 重命名（4.3.5 已有）"
  - "R37：libwebsockets 4.3.5.1 = 上游 v4.3.5 + 修复后缀。ttyd 1.7.7 无条件要求 LWS_WITH_LIBUV，因此启用 LWS_WITH_LIBUV=ON 并新增 libuv/1.52.1 依赖"
  - "上游 lib/event-libs/libuv/CMakeLists.txt 接受 LWS_LIBUV_INCLUDE_DIRS/LWS_LIBUV_LIBRARIES cache 变量显式指定外部 libuv；为空时回退 find_path/find_library 可能误中宿主系统库，必须显式传入 Conan libuv 包路径"
  - "LWS_WITH_EVLIB_PLUGINS 默认 UNIX 下为 ON（libuv 编成运行时插件 websockets-evlib_uv.so）；设为 OFF 使 libuv 直接编入 libwebsockets，消费者链接更简单"

patch_generation:
  method: inherited-from-4.3.5
  notes: "沿用 4.3.5 的两个 OHOS 平台头文件兼容补丁（patch --dry-run -p1 在官方 v4.3.5 源码上验证可干净应用），无新增补丁"

# ============================================================
# 测试结果（来自本轮真实日志，见 test_package/MANIFEST.yml）
# ============================================================

test_results:
  type: consumer
  total: 1
  passed: 1
  failed: 0
