software: libwebsockets
# 版本级 manifest（ARCHIVE-SPEC v2.0）
# 文件位置: archives/l/libwebsockets/4.3.5/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.3.5"

# 编译状态
# published | built | failed | archived
# 注意：本版本已通过 conan-verify 与 finish built，但未提交 release/upload CI，
# 因此只能标记为 built，不得标记为 published。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-14"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub release 归档，不使用本机 file:// 路径）
  url: "https://github.com/warmcat/libwebsockets/archive/refs/tags/v4.3.5.tar.gz"

  # 源码校验和
  sha256: "87f99ad32803ed325fceac5327aae1f5c1b417d54ee61ad36cffc8df5f5ab276"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DLWS_WITH_SSL=ON"
    - "-DLWS_WITH_HTTP2=ON"
    - "-DLWS_WITHOUT_TESTAPPS=ON"
    - "-DLWS_WITH_MINIMAL_EXAMPLES=OFF"
    - "-DLWS_WITHOUT_EXTENSIONS=ON"
    - "-DLWS_WITH_NETLINK=ON"
    - "-DLWS_WITH_IPV6=ON"
    - "-DLWS_WITH_CLIENT=ON"
    - "-DLWS_WITH_SERVER=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6

  # 编译器（由 Conan OHOS profile 提供）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lib-core-net-client-sort-dns.c.patch"
  - "0002-lib-roles-netlink-ops-netlink.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 内核头文件 linux/if_addr.h / linux/netlink.h 引入的 sockaddr_storage 与 musl libc sys/socket.h 冲突，需要在其 include 前 #define 重命名"
  - "libwebsockets 使用 CMake 构建系统，LWS_WITH_SSL 需要 OpenSSL（conan 依赖 openssl/3.5.6）"
  - "CMake 版本兼容性：需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"

patch_generation:
  method: manual-verified
  notes: "历史占位归档中的两个补丁经 patch --dry-run 验证可在官方 v4.3.5 源码上干净应用，保留并在 conandata.yml 中声明"

# ============================================================
# 测试结果（来自本轮真实日志，见 test_package/MANIFEST.yml）
# ============================================================

test_results:
  type: consumer
  total: 1
  passed: 1
  failed: 0
