software: libwebsockets
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.3.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.3.5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/libwebsockets-4.3.5.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DOPENSSL_ROOT_DIR=$HOME/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.0.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lib-core-net-client-sort-dns.c.patch"
  - "0002-lib-roles-netlink-ops-netlink.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E091: OHOS 内核头文件 linux/socket.h 定义了 struct sockaddr_storage，与 musl libc 的 sys/socket.h 冲突"
  - "解决方案：在 #include <linux/netlink.h> 前用 #define 将 sockaddr_storage 重命名为 __linux_sockaddr_storage"
  - "libwebsockets 使用 CMake 构建系统，需要指定 OpenSSL 路径"
  - "CMake 版本兼容性问题：需要添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/libwebsockets-4.3.5.orig
  source_work_dir: /storage/Users/currentUser/builds/libwebsockets-4.3.5.work
  source_orig_hash: 0725e469aa8a9c98
  source_work_hash: c22bcb2108e9a3bc
  generated_at: '2026-05-28T10:18:15'
  patches_count: 2

patch_classification:
  - file: 0001-lib-core-net-client-sort-dns.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-lib-roles-netlink-ops-netlink.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
