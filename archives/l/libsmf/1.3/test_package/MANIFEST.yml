# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsmf/1.3
homepage: "https://sourceforge.net/projects/libsmf/"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: libsmf-1.3.tar.gz, sha256 d3549f15de94ac8905ad365639ac6a2689cb1b51fdfa02d77fa6640001b18099)
upstream_test_audit:
  source_tarball: "libsmf-1.3.tar.gz"
  source_sha256: "d3549f15de94ac8905ad365639ac6a2689cb1b51fdfa02d77fa6640001b18099"
  top_level_files:
    - configure.ac        # AC_INIT/AC_PROG_CC/AC_PROG_LIBTOOL/PKG_CHECK_MODULES(GLIB); 无测试宏
    - Makefile.am         # SUBDIRS = src man; 无 TESTS / check_PROGRAMS / check-local
    - src/Makefile.am     # lib_LTLIBRARIES = libsmf.la + bin_PROGRAMS = smfsh; 无 TESTS/check_PROGRAMS
    - src/smf.c           # 纯实现源, 无 TEST()/TEST_F (gtest) / def test_ (pytest)
    - src/smfsh.c         # 交互式 smfsh 实现, 非测试
    - man/Makefile.am     # 仅手册页安装
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest 目标"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树无 tests/ 或 test/ 目录; tar 内容列表无 *test* 文件; Makefile.am 无 TESTS/check_PROGRAMS; configure.ac 无测试宏"
  make_check_output: "make -n check 展开为空 (check-am: all-am) — automake 默认空目标, make check 执行 0 用例退出 0"
  reason: "libsmf 1.3 为 Standard MIDI File 编解码库, 官方源码包不含任何测试套件: 无 tests/ 目录、无测试源文件、无 TESTS/check_PROGRAMS 目标、configure.ac 无测试宏; make check 是 automake 空目标 (check-am: all-am)。功能验证由 test_package 真实执行 SMF 创建/保存/加载往返 (test_smf.c 8 断言) 完成"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test_smf.c
    description: "真实 SMF 往返: smf_new → track 新建/添加 → 音符事件创建 → 按秒添加 → smf_save 落盘 → smf_load 回读校验 tracks==1 → smf_decode"
    command: "./test_smf"
  - file: conanfile.py
    description: "Conan test() 入口, 编译并执行 test_smf (8 断言) 输出 HMBS 机器证据标记 (test_package discovered=8/passedCount=8 + 上游 no_tests/0), 另做 smfsh -V 烟雾验证"
    command: "conan test test_package"

# 测试断言总数 (test_smf.c 的 8 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=8 一致)
assertion_count: 8
