version: '1.3'
status: built
build_date: '2026-09-14'

source:
  url: 'https://downloads.sourceforge.net/project/libsmf/libsmf/1.3/libsmf-1.3.tar.gz'
  sha256: 'd3549f15de94ac8905ad365639ac6a2689cb1b51fdfa02d77fa6640001b18099'
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - '--build=aarch64-unknown-linux-gnu'
    - '--host=aarch64-unknown-linux-gnu'
    - '--with-readline=no'
    - '--disable-dependency-tracking'
    - '--enable-static'
    - '--disable-shared'
  dependencies:
    - 'glib/2.88.0.1'
  build_dependencies:
    - 'pkgconf/3.0.5 (tool_requires)'
  cc: clang

patches_applied: []

verification:
  device: 'HarmonyOS PC aarch64 (待 HMBS 真机预检回填)'
  result: '待 HMBS 真机预检: conan create + test_package (test_smf 8 断言) + 上游 no_tests 审计'
  soname: 'libsmf(静态默认; shared=True 时 libsmf.so)'
  test: 'smf_new -> track 新建/添加 -> 音符事件创建 -> 按秒添加 -> smf_save -> smf_load 回读 tracks==1 -> smf_decode'

knowledge_gained:
  - 'libsmf 1.3 自带 2010 年版 config.sub: aarch64-unknown-linux-gnu 可识别, aarch64-linux-ohos / aarch64-unknown-linux-musl 报 machine not recognized; 用显式 gnu 三元组 --build/--host 跳过 config.guess (E129 家族) 并通过旧 config.sub 校验, build==host 走原生路径'
  - 'smfsh 的 readline 支持是交互式 shell 的可选装饰, --with-readline=no 关闭可保持依赖闭包仅 glib, 避免引入 readline+ncurses'
  - '上游无任何测试套件 (无 tests/ 目录、无 TESTS/check_PROGRAMS、configure.ac 无测试宏), make check 为 automake 空目标; 功能验证由 test_package 的 SMF 落盘/回读往返完成'
