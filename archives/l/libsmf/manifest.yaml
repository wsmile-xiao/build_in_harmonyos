software: libsmf
display: "libsmf"
description: "Standard MIDI File format library for handling SMF (.mid) files"
category: audio
homepage: "https://sourceforge.net/projects/libsmf/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "2010 年版 config.sub 不认 ohos/musl 三元组, 用显式 --build/--host=aarch64-unknown-linux-gnu 跳过 config.guess 并通过校验"
    - "--with-readline=no 关闭 smfsh 可选行编辑依赖, 依赖闭包仅 glib"
    - "configure 内 umask 077→022 (E011), HMDFS getcwd 设 PWD, make -j1 (E074)"
  common_dependencies:
    - glib

versions:
  "1.3":
    status: built
    build_date: "2026-09-14"
    packaging: conan
    notes: |
      首个适配版本。上游 1.3 (2010-03-21, SourceForge 官方归档)。
      无上游测试套件, 功能由 test_package SMF 落盘/回读往返 (8 断言) 验证。
      附带 bin/smfsh 交互式工具 (配套软件级 commands.json)。
    provides:
      - libsmf.a
      - bin/smfsh
