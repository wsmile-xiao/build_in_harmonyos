# test_package/MANIFEST.yml
# 上游官方测试声明文件 — libspatialaudio 0.4.1
package: libspatialaudio/0.4.1
homepage: "https://github.com/videolabs/libspatialaudio"

# 上游测试命令（CMake 注册 4 个独立测试可执行）
upstream_check_command: "ctest -N && ctest --output-on-failure"

# conanfile.py build() 方法中未集成上游测试（BUILD_TESTING=OFF，测试在适配期独立运行）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/ 下 4 个独立用例，均含 int main）
upstream_tests:
  - file: TestInsideAngleRange.cpp
    source: libspatialaudio-0.4.1/tests/TestInsideAngleRange.cpp
    description: "角度范围判定用例（音源方位角有效性校验）"
    command: "./TestInsideAngleRange"
  - file: TestAmbisonicShelfFilters.cpp
    source: libspatialaudio-0.4.1/tests/TestAmbisonicShelfFilters.cpp
    description: "Ambisonic 搁架滤波器增益用例（已废弃类兼容性验证）"
    command: "./TestAmbisonicShelfFilters"
  - file: TestAmbisonicDecoderPresets.cpp
    source: libspatialaudio-0.4.1/tests/TestAmbisonicDecoderPresets.cpp
    description: "Ambisonic 解码器预设用例（ACN/SN3D 解码矩阵验证）"
    command: "./TestAmbisonicDecoderPresets"
  - file: TestRenderer.cpp
    source: libspatialaudio-0.4.1/tests/TestRenderer.cpp
    description: "Renderer 用例（Object+DirectSpeaker 双通道双耳渲染）"
    command: "./TestRenderer"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_consumer.cpp
    description: "消费者用例：公开 API AmbisonicEncoder/BFormat 脉冲编码能量验证"
    command: "./test_libspatialaudio"

# 测试断言总数（上游 4 用例含 assert/数值校验；消费者用例含 assert + 能量校验）
assertion_count: 20
