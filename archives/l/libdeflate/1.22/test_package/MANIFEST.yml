package: libdeflate/1.22
homepage: https://github.com/ebiggers/libdeflate
upstream_check_command: "scripts/run_tests.sh"
upstream_test_in_build: true
upstream_tests:
  - name: regular
    command: "scripts/run_tests.sh regular"
  - name: O3
    command: "scripts/run_tests.sh O3"
  - name: march_native
    command: "scripts/run_tests.sh march_native"
  - name: valgrind
    command: "scripts/run_tests.sh valgrind"
  - name: ubsan
    command: "scripts/run_tests.sh ubsan"
  - name: asan
    command: "scripts/run_tests.sh asan"
  - name: cfi
    command: "scripts/run_tests.sh cfi"
  - name: install
    command: "scripts/run_tests.sh install"
  - name: symbol_prefix
    command: "scripts/run_tests.sh symbol_prefix"
  - name: use_shared_lib
    command: "scripts/run_tests.sh use_shared_lib"
  - name: freestanding
    command: "scripts/run_tests.sh freestanding"
test_package_tests:
  - file: test.c
    description: "Compression/decompression roundtrip through the installed public C API"
    command: "ctest --output-on-failure"
assertion_count: 5
platform_limitations:
  - "HMDFS rejects mkfifo(2) and link(2); corresponding upstream filesystem assertions are skipped only when EPERM is reported."
  - "HMDFS does not enforce chmod permission removal; the upstream permission-denied assertions are skipped when the mode remains readable."
  - "OHOS has no ldd; run_tests.sh detects dynamic linking via readelf NEEDED fallback (patch 0002)."
