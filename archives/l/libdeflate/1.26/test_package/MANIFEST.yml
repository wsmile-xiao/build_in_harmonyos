package: libdeflate/1.26
homepage: https://github.com/ebiggers/libdeflate
upstream_check_command: "scripts/run_tests.sh"
upstream_test_in_build: true
upstream_tests:
  - name: regular
    command: "scripts/run_tests.sh regular"
  - name: O3
    command: "scripts/run_tests.sh O3"
  - name: march_native
    command: "scripts/run_tests.sh march_native"
  - name: valgrind
    command: "scripts/run_tests.sh valgrind"
  - name: ubsan
    command: "scripts/run_tests.sh ubsan"
  - name: asan
    command: "scripts/run_tests.sh asan"
  - name: cfi
    command: "scripts/run_tests.sh cfi"
  - name: install
    command: "scripts/run_tests.sh install"
  - name: symbol_prefix
    command: "scripts/run_tests.sh symbol_prefix"
  - name: use_shared_lib
    command: "scripts/run_tests.sh use_shared_lib"
  - name: freestanding
    command: "scripts/run_tests.sh freestanding"
test_package_tests:
  - file: test.c
    description: "21 consumer assertions round-trip the public DEFLATE, zlib, and gzip APIs and reject malformed raw DEFLATE"
    command: "ctest --test-dir . --output-on-failure"
assertion_count: 21
platform_limitations:
  - "HMDFS may reject mkfifo(2) and link(2) with EPERM; the upstream assertions are skipped only for that explicit error."
  - "HMDFS may not enforce chmod read permission removal; those permission assertions are skipped only when the file remains readable."
  - "The current HarmonyOS shell lacks id; the permission-denial block is skipped with an explicit runtime notice."
  - "OHOS has no ldd; the upstream shared-library checks use readelf NEEDED entries as a fallback."
  - "valgrind is not installed on the current HarmonyOS host; the upstream valgrind group is skipped by the upstream runner."
