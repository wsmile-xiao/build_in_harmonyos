  cxx: clang++

patches_applied:
  - "0001-rtbuild-CMakeLists.txt.patch"
  - "0002-rtbuild-math-emath.h.patch"
  - "0003-rtbuild-sys-intrinsics.h.patch"
  - "0004-rtbuild-sys-platform.h.patch"

knowledge_gained:
  - "The source tree ships an SSE2-only vector layer (rtbuild/simd/*_sse2.h, sse.cpp); on aarch64 the SSE2 intrinsics must be supplied by an emulation header such as sse2neon"
  - "rtbuild/sys/intrinsics.h includes <immintrin.h> unconditionally, which hard-fails on non-x86; it must be guarded by architecture"
  - "rtbuild/math/emath.h references ../simd/arm/emulation.h, a file that exists in neither the v1.2.3 tarball nor upstream main - an ARM source path that was never released"
  - "rtbuild/sys/platform.h only defines __64BIT__ for x86, so on aarch64 the size_t overloads of min()/max() are absent and parallel_partition.h fails to compile"
  - "Upstream links TBB with a bare -ltbb name; with a package-manager-provided TBB the imported target must be used so the full library path is passed to the linker"
  - "Upstream's hardware test-suite requires -fsycl (Intel DPC++ compiler) and an Intel Xe device, so it cannot be built on an OpenHarmony PC"

patch_generation:
  method: per-file-difflib
  generated_at: '2026-09-26T22:27:22'
  patches_count: 4

