package: level-zero-gpu-raytracing/1.2.3
homepage: "https://github.com/intel/level-zero-raytracing-support"

upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: "ZE_RAYTRACING_SYCL_TESTS=OFF (see notes.md for the per-test technical reasons)"

# Upstream ships a hardware test-suite under testing/. It is gated behind
# ZE_RAYTRACING_SYCL_TESTS (default OFF) and every executable is built with
# "-fsycl -fsycl-targets=spir64", i.e. it requires an Intel DPC++ compiler and
# an Intel Xe device with a working Level Zero driver. Neither is available on
# an OpenHarmony PC or in CI, so the suite is not built here. Census of the
# gate, kept as evidence for the declaration above:
#
#   testing/CMakeLists.txt:
#     ADD_EXECUTABLE                     4   (rthwif_cornell_box, rthwif_test,
#                                             rthwif_cornell_box_ext, rthwif_test_ext)
#     ADD_INDIVIDUAL_TEST               56   (each expands to a ctest case)
#     "ADD_INDIVIDUAL_TEST(C G NAME ...)"  52 of the 56 also register a GPU case
#     "-fsycl -fsycl-targets=spir64"        8  compile/link property assignments
#   CMakeLists.txt:
#     SET(ZE_RAYTRACING_SYCL_TESTS "OFF")    default gate
#     IF (NOT ZE_RAYTRACING_SYCL_TESTS STREQUAL "OFF") ADD_SUBDIRECTORY(testing)
#
# Result: 0 of 56 upstream cases are runnable on this platform. The reason is a
# missing compiler front-end (-fsycl) and missing Xe hardware, not a lack of
# effort to run them.
upstream_tests: []

test_package_tests:
  - file: test.cpp
    description: >-
      Links the library, resolves the exported RTAS symbols with dlsym, and
      drives the real validation and format-comparison code paths, asserting
      their specific result codes (null-handle rejection, builder creation and
      destruction, identical/differing/invalid format handling).
    command: "./test_level_zero_gpu_raytracing"

assertion_count: 13
