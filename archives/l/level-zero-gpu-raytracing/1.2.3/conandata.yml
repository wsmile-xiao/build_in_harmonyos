# conandata.yml — level-zero-gpu-raytracing 1.2.3
sources:
  url: "https://github.com/intel/level-zero-raytracing-support/archive/refs/tags/v1.2.3.tar.gz"
  sha256: "0bfb03903154228cdba0320e3bc09c57787558b368da315b9b32e9603198b5b3"

patches:
  - patch_file: "patches/0001-rtbuild-CMakeLists.txt.patch"
    patch_description: "Link the imported TBB target when available instead of a bare -ltbb library name"
    patch_type: "portability"
  - patch_file: "patches/0002-rtbuild-math-emath.h.patch"
    patch_description: "Replace the reference to the non-shipped simd/arm/emulation.h with the bundled SSE2 emulation header"
    patch_type: "portability"
  - patch_file: "patches/0003-rtbuild-sys-intrinsics.h.patch"
    patch_description: "Only include the x86 intrinsic header on x86; other architectures get the SSE2 API from the emulation header"
    patch_type: "portability"
  - patch_file: "patches/0004-rtbuild-sys-platform.h.patch"
    patch_description: "Recognize aarch64 as a 64-bit platform so the 64-bit overloads (size_t min/max) are available"
    patch_type: "portability"
