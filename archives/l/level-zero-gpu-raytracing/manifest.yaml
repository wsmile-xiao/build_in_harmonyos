software: level-zero-gpu-raytracing
display: "Level Zero GPU Ray Tracing"
description: "Intel oneAPI Level Zero Ray Tracing Support - CPU-side acceleration structure construction for the ZE_extension_rtas API"
category: gfx
homepage: "https://github.com/intel/level-zero-raytracing-support"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "The vector layer is SSE2-only; on aarch64 the SSE2 API is provided by sse2neon (header-only emulation layer)"
    - "rtbuild/sys/intrinsics.h must not include <immintrin.h> on non-x86 architectures"
    - "rtbuild/math/emath.h references simd/arm/emulation.h, which is absent from the released source tree"
    - "__64BIT__ is only detected for x86 upstream; aarch64 must be added for the 64-bit size_t overloads to exist"
    - "TBB is consumed from the artifacts repository (ZE_RAYTRACING_TBB=normal) instead of the upstream FetchContent clone"
    - "Upstream test-suite needs an Intel DPC++ compiler (-fsycl) and Xe hardware; not buildable on OHOS"
  common_dependencies:
    - tbb
    - sse2neon

versions:
  "1.2.3":
    status: built
    build_date: "2026-09-26"
