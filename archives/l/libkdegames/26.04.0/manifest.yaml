knowledge_gained:
  - "libkdegames 26.04.0 installs libKDEGames6/libKDEGames6Private with cmake package name KDEGames6 and imported targets KDEGames6/KDEGames6Private (not KDEGames)."
  - "Upstream find_package(KF6 COMPONENTS ...) set is Archive/ColorScheme/Completion/Config/ConfigWidgets/DNSSD/GuiAddons/IconThemes/I18n/NewStuff/XmlGui; ktextwidgets/kcrash/kdbusaddons from older releases are no longer needed."
  - "The newest kiconthemes/6.18.0 recipe revision requires karchive/6.19.0 which conflicts with knewstuff/6.18.0 (karchive/6.18.0); self.requires('karchive/6.18.0', override=True) in the downstream recipe pins a single karchive for the whole graph."
  - "Upstream tests/ (kgamepopupitemtest) is compiled but never registered via add_test; only src/private/tests registers 2 ctest entries through ecm_add_tests."
  - "ctest runs test executables with cwd = the CMakeLists directory; relative DT_NEEDED entries like ../../bin/libKDEGames6.so resolve against that cwd (build/src/bin), so NEEDED compatibility links must cover src/bin, tests/bin and src/private/tests/bin bases."
  - "Upstream try_compile(check-libsndfile-capabilities) validates libsndfile Ogg/Vorbis enums at configure time; it succeeds with the conan libsndfile 1.2.2 package when its lib/cmake dir is on CMAKE_PREFIX_PATH with CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON."
  - "KGamePopupItem::showMessage() starts a QVariantAnimation that requires a running event loop with a real paint engine; in a headless consumer smoke test the scene/addItem/property/forceHide APIs are safe but showMessage() segfaults without app.exec()."
