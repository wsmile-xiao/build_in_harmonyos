software: libkdegames
display: "libkdegames"
description: "KDE Games shared library - common code for KDE games (KGameRenderer/KGameTheme, highscore framework, KGameClock, KGamePopupItem, OpenAL audio backend, KGame network/message layer)"
category: library
homepage: "https://invent.kde.org/games/libkdegames"
license: LGPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "KF_SKIP_PO_PROCESSING=ON skips the ki18n_install(po) catalog step (full gettext toolchain not needed for the library)"
    - "karchive version pin: the newest kiconthemes/6.18.0 recipe revision requires karchive/6.19.0 while knewstuff/6.18.0 requires karchive/6.18.0; the libkdegames recipe pins karchive/6.18.0 with override=True so the whole KF6 6.18 closure stays consistent"
    - "OpenAL/SndFile are found through their upstream CMake config files (OpenALConfig.cmake / SndFileConfig.cmake) once the conan package lib/cmake dirs are prepended to CMAKE_PREFIX_PATH (CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON)"
    - "Upstream try_compile(check-libsndfile-capabilities) runs during configure and succeeds against the conan libsndfile 1.2.2 package"
    - "BUILD_TESTING=ON registers the upstream ctest suite: 2 tests under src/private/tests (ecm_add_tests); tests/kgamepopupitemtest is built but not registered by upstream (no add_test)"
    - "Upstream test binaries run with cwd = their CMakeLists dir, so DT_NEEDED entries like ../../bin/libKDEGames6.so resolve to build/src/bin; the recipe's NEEDED compatibility-link logic covers those bases too"
    - "svgcleaner/7Zip are optional upstream tools; the build falls back to gzip for SVGZ generation and skips cleaning (BUILD_SVG_CHECKS=OFF default)"
  common_dependencies:
    - qtbase
    - qtdeclarative
    - qtsvg
    - kconfig
    - kconfigwidgets
    - kxmlgui
    - knewstuff
    - kdnssd
    - openal-soft
    - libsndfile
    - ecm

versions:
  "26.04.0":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libkdegames/26.04.0"
