# MANIFEST.yml - test_package for libkdegames 26.04.0.1
name: libkdegames
version: "26.04.0.1"
test_type: consumer
description: >
  Consumer tests for the libkdegames 26.04.0.1 conan package on
  HarmonyOS PC (aarch64). Builds small Qt6/KF6 applications that link
  KDEGames6 and call KGameClock / KGameTheme / KGamePopupItem APIs
  (test_libkdegames) plus OHOS-specific assertions for the openal audio
  backend wiring, openal-soft Null-backend playback and local highscore
  roundtrip (test_ohos), then runs them with the offscreen Qt platform.
build_system: cmake
language: c++
runner: ctest
