# 版本级 manifest — libkdegames 26.04.0.1
# 遵循 ARCHIVE-SPEC v2.0

version: "26.04.0.1"
software: "libkdegames"

# 编译状态: built (权威 CI ci-attempt5.log 全过)
status: built
build_system: cmake
created_at: 2026-09-19

# 版本说明: 上游源码仍为 26.04.0 release。conan 版本号按 R37 门禁要求
# 递增（制品仓已存在 libkdegames/26.04.0，recipe 内容有修改时必须递增
# 版本号后缀，不支持同版本多 revision 并存）。26.04.0.1 修复 SONAME
# 质量问题，详见 notes.md。

source:
  url: "https://invent.kde.org/games/libkdegames/-/archive/v26.04.0/libkdegames-v26.04.0.tar.gz"
  sha256: "2581070df40ee6facc393a25c0aa50a268c7af7ebabdaa5c1790e7b727eddc6a"
  tar_format: tar.gz
  # 对照: KDE release-service 官方发布归档 (Scout 固定)
  #   https://download.kde.org/stable/release-service/26.04.0/src/libkdegames-26.04.0.tar.xz
  #   sha256: 12d615bc466bbdff4e85336d9cab6453dda8b4b20c8a48b74c49ec89e70d76bd

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname, (OHOS, conanfile 注入)"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG=-Wl,-soname, (OHOS, conanfile 注入)"
    - "-DCMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE (OHOS, conanfile 注入)"
  dependencies:
    required:
      - qtbase/6.11.1
      - qtdeclarative/6.11.1
      - qtsvg/6.11.1
      - karchive/6.18.0 (override, 见 conanfile 注释)
      - kcolorscheme/6.18.0
      - kcompletion/6.18.0
      - kconfig/6.18.0
      - kconfigwidgets/6.18.0
      - kcoreaddons/6.18.0
      - kdnssd/6.29.0
      - kguiaddons/6.18.0
      - kiconthemes/6.18.0
      - ki18n/6.18.0
      - knewstuff/6.18.0
      - kxmlgui/6.18.0
      - openal-soft/1.25.2
      - libsndfile/1.2.2
    build:
      - ecm/6.26.0
    optional:
      - svgcleaner (未使用, BUILD_SVG_CHECKS=OFF)
      - 7zip (未使用, gzip 兜底)
    tools:
      - llvm-readelf (DT_NEEDED 读取, 仅构建期兼容性链接准备)
      - in-place .dynstr patch + llvm-objcopy --remove-section .codesign + binary-sign-tool -selfSign 1 (conanfile 自带实现, DT_NEEDED 路径形态清洗并重签名; 禁用 patchelf — 其重写 program header 后 musl 拒绝加载)
  cc: clang
  cxx: clang++

license: "LGPL-2.0-or-later / GPL-2.0-or-later / CC0-1.0 / BSD-2-Clause / BSD-3-Clause (mixed)"

patches_applied: []

