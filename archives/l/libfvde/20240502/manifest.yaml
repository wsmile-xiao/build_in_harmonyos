  novelty: "发布包把生成物 common/config.h 一起发布（内容是维护者机器带 OpenSSL 的探测结果），而 common.h 用引号 include 使源树副本永远优先于构建树新副本；在目标 sysroot 无 openssl/evp.h 的平台上表现为编译期 fatal error。给出设备可复现判据与两种修法（in-source 覆盖 / 删除陈旧生成物），并说明与 E412、E284 的边界。"
  differs_from:
    - "E412 处理 configure 自动探测到未声明的可选后端；本条是探测结果被发布包内陈旧生成物整体遮蔽。"
    - "E284 处理交叉编译需要生成 target config header；本条是生成物存在但内容来自宿主机。"
    - "DRAFT-libfsntfs-release-archive-closure 处理组件目录/生成文件是否齐全与镜像身份；本条处理生成文件齐全但内容陈旧。"
