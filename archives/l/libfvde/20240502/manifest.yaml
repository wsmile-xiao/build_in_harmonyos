build:
  system: autotools
  configure_options:
    - "--disable-python"
    - "--with-libfuse=no"
    - "--enable-static-executables=no"
    - "--with-openssl=no"
    - "--enable-shared"
    - "--disable-static"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  build_dir: "in-source（在源码目录内 configure/make/make install DESTDIR，用于覆盖发布包内置的陈旧 common/config.h）"
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcaes
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfguid
    - libfplist
    - libfvalue
    - libhmac
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=<bash 绝对路径，profile buildenv 注入>"
    - "SHELL=<同上>"

patches_applied: []

knowledge_gained:
  - "E007：发布包内置的 config.guess/config.sub 不识别 HarmonyOS，配方改用显式 GNU 三元组 --build/--host=aarch64-unknown-linux-gnu（不跑 autoreconf：设备有 automake，CI worker 没有）"  # knowledge_ref: E007
  - "E011：HMDFS 忽略 chmod 且 autoconf 用 umask 077 建 confXXXXXX 临时目录，构建全程 umask 022 + 就地改 configure 脚本"  # knowledge_ref: E011
  - "E087：HMDFS 禁止直接执行源码树里的 shell 脚本，configure 与 make check 的驱动都经 CONFIG_SHELL 解释器启动"  # knowledge_ref: E087
  - "E330 同族：libtool 测试目标是包装脚本、真实 ELF 在 .libs，测试期改写 tests/test_runner.sh 两个分发分支并注入 libfvde/.libs 到 LD_LIBRARY_PATH"  # knowledge_ref: E330
  - "E588（新草稿）：libyal 发布包内置的陈旧 common/config.h（维护者机器带 OpenSSL，HAVE_LIBCRYPTO/HAVE_OPENSSL_EVP_H=1）被 common.h 的引号 include 优先命中，遮蔽 configure 新生成头；OHOS sysroot 无 openssl/evp.h → 编译期 fatal error。改为 in-source 构建覆盖该头 + --with-openssl=no 走包内 libhmac/libcaes 本地实现"  # knowledge_ref: DRAFT-E588-libyal-bundled-configsh-ssl-shadow
  - "语言预检已知误判类：libyal 发布包根级 pyproject.toml/setup.py/setup.cfg 属 pyfvde Python 绑定（非主体），会被判 mixed → env_unsupported；按 R47 边界规则排除绑定打包文件后复核为 cpp（c 271/277=98%、构建系统 autotools）"  # knowledge_ref: DRAFT-libuninameslist-langpreflight-setuptools-binding-misdetect
  - "上游测试计数：tests/Makefile.am 27 个 check_PROGRAMS + 3 个 TESTS 驱动；真机 make check 执行 27 个 C 程序全 PASS、2 个驱动 PASS，test_fvdeinfo.sh 因发布包 EXTRA_DIST 不含 tests/data 按上游设计 exit 77 SKIP（上游 HEAD 同为 27 个 check_PROGRAMS，下界一致）"  # knowledge_ref: E277
  - "test_package 消费者测试 16 项断言（通用 11 + 鸿蒙特有 5）；首轮发现 notify_stream_close 成功返回 0 而非 1（上游 API 语义：仅当流由库自己 open 时才关闭），按上游文档修正断言后通过"  # knowledge_ref: DRAFT-E588-libyal-bundled-configsh-ssl-shadow

