# test_package/MANIFEST.yml — libfvde 20240502
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfvde/20240502
homepage: "https://github.com/libyal/libfvde"

# 上游测试命令: tests/Makefile.am 注册的 automake 测试套件
upstream_check_command: "make check"

# conanfile.py build() 中已集成上游测试 (真机执行，日志进 conan create 输出)
upstream_test_in_build: true
upstream_test_command: "make check (LOG_COMPILER=<CONFIG_SHELL>; TESTS=test_library.sh test_tools.sh test_fvdeinfo.sh)"

# 上游测试套件审计结论:
# tests/Makefile.am (20240502 发布包) 定义 27 个 check_PROGRAMS (fvde_test_* C 程序)
# 与 3 个默认 TESTS shell 驱动 (test_library.sh / test_tools.sh / test_fvdeinfo.sh),
# 合计 30 个注册测试单元，全部经 `make check` 构建；27 个 C 程序在真机上真实执行。
# test_python_module.sh 仅 HAVE_PYTHON_TESTS 时才并入 TESTS，本配方 --disable-python
# 关闭该分支，故不计入注册数。
upstream_tests_exist: true
upstream_test_audit:
  - path: "tests/Makefile.am (check_PROGRAMS)"
    finding: "定义 27 个 fvde_test_* C 测试程序: bit_stream / checksum / compression / deflate / encrypted_metadata / encryption_context / encryption_context_plist / error / huffman_tree / io_handle / keyring / logical_volume / logical_volume_descriptor / metadata / metadata_block / notify / physical_volume / physical_volume_descriptor / sector_data / segment_descriptor / support / tools_output / tools_signal / volume / volume_data_handle / volume_group / volume_header, 每个直连 ../libfvde/libfvde.la 做白盒验证"
  - path: "tests/Makefile.am (TESTS)"
    finding: "默认注册 3 个 shell 驱动: test_library.sh / test_tools.sh / test_fvdeinfo.sh; test_python_module.sh 仅在 HAVE_PYTHON_TESTS 条件分支注册, 本配方 --disable-python 未启用"
  - path: "tests/test_library.sh"
    finding: "LIBRARY_TESTS 列出 23 个无输入单元测试, LIBRARY_TESTS_WITH_INPUT='support volume' 在无 input/ 目录时回收成普通执行 (test -d input 分支), 合计 25 个 fvde_test_* 二进制"
  - path: "tests/test_tools.sh"
    finding: "TOOLS_TESTS='output signal' -> fvde_test_tools_output / fvde_test_tools_signal 两个二进制, 覆盖 fvdetools 通用输出与信号处理"
  - path: "tests/test_fvdeinfo.sh"
    finding: "fvdeinfo 端到端驱动, 依赖 tests/input 固件; 发布包 EXTRA_DIST 只含 check_SCRIPTS 不含 data, 因此按上游设计 exit 77 SKIP"
  - path: "tests/Makefile.am (EXTRA_DIST)"
    finding: "EXTRA_DIST 仅含 $(check_SCRIPTS), 不含 tests/data, 故 release tarball 下 test_fvdeinfo.sh 恒 SKIP, 非 OHOS 缺组件"

upstream_tests:
  - file: test_library.sh
    source: libfvde-experimental-20240502.tar.gz/tests/test_library.sh
    description: "库测试总驱动 (25 个 fvde_test_* 二进制: 23 个无输入 + support/volume)"
    command: "make check 执行 test_library.sh"
  - file: test_tools.sh
    source: libfvde-experimental-20240502.tar.gz/tests/test_tools.sh
    description: "终端工具测试驱动 (fvde_test_tools_output / fvde_test_tools_signal)"
    command: "make check 执行 test_tools.sh"
  - file: test_fvdeinfo.sh
    source: libfvde-experimental-20240502.tar.gz/tests/test_fvdeinfo.sh
    description: "fvdeinfo 工具端到端驱动 (发布包无 tests/input 固件 -> exit 77 SKIP)"
