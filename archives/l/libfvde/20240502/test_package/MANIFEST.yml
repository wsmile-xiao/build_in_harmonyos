# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libfvde.c
    description: "通用消费者测试: 版本字符串 / 只读访问标志 / codepage 正常与错误路径 / set_codepage(0) / 卷签名错误路径 / 通知流开关 / 卷对象初始化与释放 (11 项断言)"
    command: "./test_libfvde (conan test_package, env=conanrun)"
  - file: test_ohos.c
    description: "鸿蒙特有消费者测试: __OHOS__ 编译目标 / 包版本 / 非 /tmp 的可写 TMPDIR / 临时文件创建-写入-读回-清理 (5 项断言)"
    command: "./test_ohos (conan test_package, env=conanrun)"
    platform: OHOS

harmony_specific_tests:
  - name: "ohos-tmpdir-file-lifecycle"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、libfvde 版本、TMPDIR 非 /tmp、临时文件读写与清理"
    command: "./test_ohos"
    assertions: 5
    platform: OHOS

# 断言总数 = test_package 通用 11 + 鸿蒙特有 5；上游 27 个 C 程序与 3 个 shell 驱动
# 由 build() 内的 make check 真实执行, 不并入本文件的消费者断言数。
assertion_count: 16
