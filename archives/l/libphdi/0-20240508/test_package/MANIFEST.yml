# test_package/MANIFEST.yml
# Upstream test declaration required by CI L0e.

package: libphdi/0-20240508
homepage: https://github.com/libyal/libphdi

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"
upstream_c_test_programs: 19
upstream_unit_programs: 19
upstream_tools_programs: 0
upstream_integration_scripts: 1

upstream_tests:
  - name: "libphdi test_library"
    file: test_library.sh
    source: tests/test_library.sh
    description: "上游库与 C 测试程序运行器"
    command: "./tests/test_library.sh"
  - name: "libphdi test_phdiinfo"
    file: test_phdiinfo.sh
    source: tests/test_phdiinfo.sh
    description: "phdiinfo 元数据输出检查"
    command: "./tests/test_phdiinfo.sh"

test_package_tests:
  - file: test_libphdi.c
    description: "Consumer API version, signature, codepage, error-path, and object lifecycle checks"
    command: "./test_libphdi"
  - file: test_ohos.c
    description: "OHOS compile-target and writable TMPDIR file lifecycle checks"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "libphdi-ohos-tmpdir-file-lifecycle"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、TMPDIR 非 /tmp、临时文件读写和清理"
    command: "./test_ohos"
    assertions: 5
    platform: OHOS

assertion_count: 14
