# test_package/MANIFEST.yml — libservicelog 1.1.19
package: libservicelog/1.1.19
homepage: "https://github.com/power-ras/libservicelog"

# 上游测试命令（上游 Makefile.am：TESTS=src/tests/run_tests，bash 驱动
# src/tests/tests/test-00X-* 6 个场景脚本 + C 驱动 test_libservicelog）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "src/tests/run_tests"

# 上游测试盘点（git tag v1.1.19 递归计数 == 发行 tarball 内容，51 blobs）：
# 16 个测试相关文件 = 9 个 shell 脚本 + 1 个 C 驱动 + 6 个期望输出
upstream_tests:
  - file: src/tests/run_tests
    source: src/tests/run_tests
    description: "上游 bash 测试执行器（本配方 test_package 以 POSIX 移植版驱动同一组场景）"
    command: "src/tests/run_tests"
  - file: src/tests/test_libservicelog.c
    source: src/tests/test_libservicelog.c
    description: "上游 C 测试驱动（log/dump/truncate 7 种事件类型入口），本配方 test_package 原样编译为消费者二进制"
    command: "src/tests/test_libservicelog <event_type>"
  - file: src/tests/tests/test-001-log_basic_event
    source: src/tests/tests/test-001-log_basic_event
    description: "场景 1：BASIC 事件 log→dump 往返对比"
    command: "src/tests/run_tests -t test-001-log_basic_event -q"
  - file: src/tests/tests/test-002-log_os_event
    source: src/tests/tests/test-002-log_os_event
    description: "场景 2：OS 事件 log→dump 往返对比"
    command: "src/tests/run_tests -t test-002-log_os_event -q"
  - file: src/tests/tests/test-003-log_rtas_event
    source: src/tests/tests/test-003-log_rtas_event
    description: "场景 3：RTAS（Power 平台）事件 log→dump 往返对比"
    command: "src/tests/run_tests -t test-003-log_rtas_event -q"
  - file: src/tests/tests/test-004-log_encl_event
    source: src/tests/tests/test-004-log_encl_event
    description: "场景 4：ENCL（I/O 机箱）事件 log→dump 往返对比"
    command: "src/tests/run_tests -t test-004-log_encl_event -q"
  - file: src/tests/tests/test-005-log_bmc_event
    source: src/tests/tests/test-005-log_bmc_event
    description: "场景 5：BMC 事件 log→dump 往返对比"
    command: "src/tests/run_tests -t test-005-log_bmc_event -q"
  - file: src/tests/tests/test-006-truncate_event
    source: src/tests/tests/test-006-truncate_event
    description: "场景 6：清空→记录→清空（截断语义）"
    command: "src/tests/run_tests -t test-006-truncate_event -q"
  - file: src/tests/tests-results/test-001-log_basic_event.result.out
    source: src/tests/tests-results/test-001-log_basic_event.result.out
    description: "场景 1 期望输出（时间戳/平台/节点名容差比较）"
    command: "diff -u（上游 diff_with_result_without_timestamp 语义）"
  - file: src/tests/tests-results/test-002-log_os_event.result.out
    source: src/tests/tests-results/test-002-log_os_event.result.out
    description: "场景 2 期望输出"
    command: "diff -u"
  - file: src/tests/tests-results/test-003-log_rtas_event.result.out
    source: src/tests/tests-results/test-003-log_rtas_event.result.out
    description: "场景 3 期望输出"
    command: "diff -u"
  - file: src/tests/tests-results/test-004-log_encl_event.result.out
    source: src/tests/tests-results/test-004-log_encl_event.result.out
    description: "场景 4 期望输出"
    command: "diff -u"
  - file: src/tests/tests-results/test-005-log_bmc_event.result.out
    source: src/tests/tests-results/test-005-log_bmc_event.result.out
    description: "场景 5 期望输出"
    command: "diff -u"
  - file: src/tests/tests-results/test-006-truncate_event.result.out
    source: src/tests/tests-results/test-006-truncate_event.result.out
    description: "场景 6 期望输出"
    command: "diff -u"
  - file: libservicelog-ci/build-fedora-33.sh
    source: libservicelog-ci/build-fedora-33.sh
    description: "上游 CI 构建脚本（Fedora 33 容器，ppc64le）"
    command: "./libservicelog-ci/build-fedora-33.sh"
  - file: libservicelog-ci/build-ubuntu-20.04.sh
    source: libservicelog-ci/build-ubuntu-20.04.sh
    description: "上游 CI 构建脚本（Ubuntu 20.04 容器，ppc64le）"
    command: "./libservicelog-ci/build-ubuntu-20.04.sh"

# test_package 中自带的测试（消费者视角验证安装包）
test_package_tests:
  - file: probe.c
    description: "消费者探针：v1 API 全链路（open/log/query/print/truncate/close）逐字段断言"
    command: "./probe"
  - file: run_upstream_tests.sh
    description: "鸿蒙特有 E2E：上游 6 场景由消费者编译的上游驱动跑通，POSIX 移植+python 容差比较器"
    command: "sh run_upstream_tests.sh ./test_libservicelog <expected_dir> cmp_tolerant.py"
