# 版本级 manifest
# 文件位置: archives/l/libservicelog/1.1.19/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.1.19"

# 软件名
software: "libservicelog"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "custom"
conan_ref: "libservicelog/1.1.19"

# 源码信息
source:
  # 主源码下载 URL（官方上游，git tag v1.1.19）
  url: "https://github.com/power-ras/libservicelog/archive/refs/tags/v1.1.19.tar.gz"

  # 源码校验和
  sha256: "cf04b506ff5b4cbb4064490371810ff1feb3959133bf582d6f71b9a27b5dfeee"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表（手写构建，无 configure；-release/-version-info 语义由配方复刻）
  configure_options:
    - "-DDEST_DIR='/usr'"
    - "-Wl,-soname,libservicelog-1.1.so.1"
    - "-fPIC -O2"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sqlite3/3.53.4

  # 编译器
  cc: clang
  cxx: ""

# 应用的补丁列表
patches_applied:
  - "0001-servicelog-db-env-override.patch: SERVICELOG_PATH 硬编码 /var/lib/servicelog 增加 SERVICELOG_DB 环境变量覆盖（默认行为不变，测试/鸿蒙非 /var 环境可用）"

# 编译中学到的知识
knowledge_gained:
  - "autotools 硬依赖库（AC_CHECK_LIB 直接 exit -1）若 v1 主路径不调用，可按上游 Makefile.am 的精确源清单把纯解析子目录内联编译进主库，跳过整包适配（librtasevent_src 14 文件零 librtas 依赖）"
  - "libtool -release/-version-info 命名 + pkg-config -l 名不一致时（libservicelog-1.1.so.1.1.19 vs -lservicelog），包内以真实文件拷贝物化全部别名（soname/dev/无版本），HMDFS 无符号链接亦可行"
  - "上游 bash 测试器（diff -y/[[/source）在设备不可用时，以 POSIX 移植 + python 行级容差比较器复刻 diff_with_result_without_timestamp 语义，上游 6 场景原样跑通"
