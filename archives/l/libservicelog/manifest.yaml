# 软件级 manifest
# 文件位置: archives/l/libservicelog/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: libservicelog

# 显示名
display: "libservicelog"

# 一句话描述
description: "IBM Power servicelog library: sqlite3-backed platform event log"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://github.com/power-ras/libservicelog"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "纯 C + sqlite3，无 Power 平台二进制依赖，可在鸿蒙 PC 直接构建"
    - "librtasevent 依赖以内联编译官方源码（librtasevent_src/ 14 文件）闭合，无需适配 librtas 整包"
    - "数据库路径 /var 硬编码以 SERVICELOG_DB 环境变量覆盖（补丁），默认行为不变"
    - "共享库命名复刻 libtool -release/-version-info 语义，别名以真实拷贝物化（HMDFS 无符号链接）"
    - "上游 bash 测试器移植为 POSIX + python 容差比较器，场景文件原样保留"
  common_dependencies:
    - sqlite3

# 版本索引
versions:
  "1.1.19":
    status: built
    build_date: "2026-09-27"
