version: "0.1.7"
status: built
build_date: "2026-08-25"

source:
  url: "https://download.netsurf-browser.org/libs/releases/libnsbmp-0.1.7-src.tar.gz"
  sha256: "5407a7682a122baaaa5a15b505290e2d37df54c13c5edef4b09d12c862d82293"
  tar_format: tar.gz

build:
  system: netsurf-buildsystem
  system_note: "Replaced by standalone Makefile via patch (NSSHARED unavailable on OHOS)"
  compiler: clang
  cc: clang
  cxx: clang++
  dependencies: []
  make_targets:
    - "all"
    - "check"

patches_applied:
  - "0001-standalone-makefile.patch"

upstream_tests:
  runner: "test/runtest.sh"
  programs:
    - "test_decode_bmp"
    - "test_decode_ico"
  data:
    bmp_corpus: 1070
    ico_corpus: 611
    total_files: 1681
  status: run-in-conan-create

knowledge_gained:
  - "NetSurf 库（libnsbmp/libwapcaplet 等）使用 NSSHARED 私有构建系统，非 autotools/cmake/meson，OHOS 上需替换为 standalone Makefile"
  - "libnsbmp 无外部库依赖，仅需 netsurf-buildsystem 元构建工具（构建期），运行期无依赖"
  - "解码器按 4 字节/像素 [R,G,B,A] 写入回调分配的缓冲区，与上游 test/decode_bmp.c 的 BYTES_PER_PIXEL 一致"
  - "upstream runtest.sh 从源码根目录解析测试数据相对路径，check 目标必须从 source_folder 调用"
