package: libnsbmp/0.1.7
consumer: test_package
checks:
  - bmp_create returns BMP_OK
  - bmp_analyse returns BMP_OK
  - width == 2 (from analyse)
  - height == 1 (from analyse)
  - bpp == 24 (from analyse)
  - bmp_decode returns BMP_OK and bmp.decoded == true
  - pixel0 == red [FF,00,00,FF]
  - pixel1 == green [00,FF,00,FF]
notes: >
  Embeds a minimal 2x1 24-bit BMP (62 bytes). Pixel values verified against
  the upstream test_decode_bmp harness and the library's 4-bytes-per-pixel
  [R,G,B,A] write convention. No external test data files required.
