software: libdvbv5
display: "libdvbv5"
description: "DVBv5 userspace library (libdvbv5 from v4l-utils)"
category: multimedia
homepage: "https://linuxtv.org/wiki/index.php/V4l-utils"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "libdvbv5 是 v4l-utils 源码树中的 lib/libdvbv5 子库，用 -Dlibdvbv5=enabled 单独构建"
    - "libudev 是硬依赖，由 eudev/3.2.14 提供，通过 PkgConfigDeps 注入 libudev.pc"
    - "OHOS/musl 缺 argp 与可用 libintl，上游硬性依赖探测需改为可选"
    - "OHOS UAPI 头缺 V4L2_PIX_FMT_NV12_16L16，需补四字符码 fallback"
    - "musl 无 pthread_cancel，两处线程清理改为协作停止/socket shutdown + pthread_join"
    - "产物必须 ELF 签名，否则 OHOS 加载器拒绝加载"
  common_dependencies:
    - eudev/3.2.14

versions:
  "1.32.0":
    status: built
    build_date: "2026-09-22"
    conan_ref: "libdvbv5/1.32.0"
