version: "1.32.0"
software: "libdvbv5"
# built = conan verify 通过，尚未 conan upload（ARCHIVE-SPEC:255-257）。
# 本包未执行 upload，因此不能标 published。
status: built
build_date: "2026-09-22"
build_system: "meson"

source:
  url: "https://linuxtv.org/downloads/v4l-utils/v4l-utils-1.32.0.tar.xz"
  sha256: "6828828a17775526eb93fb258a9294d1d1073d633c344dd71ecd4e7a1ffb7dfc"
  tar_format: tar.xz
  note: >
    libdvbv5 是 v4l-utils 源码树中的 lib/libdvbv5 子库，上游没有独立
    tarball，因此使用官方 v4l-utils 发布包并以 -Dlibdvbv5=enabled 只构建该库。

build:
  system: meson
  configure_options:
    - "-Dlibdvbv5=enabled"
    - "-Dbpf=disabled"
    - "-Dgconv=disabled"
    - "-Djpeg=disabled"
    - "-Dqv4l2=disabled"
    - "-Dqvidcap=disabled"
    - "-Dv4l2-tracer=disabled"
    - "-Dv4l-utils=false"
    - "-Dv4l-plugins=false"
    - "-Dv4l-wrappers=false"
    - "-Ddoxygen-doc=disabled"
  dependencies:
    - eudev/3.2.14
  cc: clang
  cxx: clang++

patches_applied:
  - "0004-meson.build.patch"
  - "0001-lib-libdvbv5-dvb-dev-local.c.patch"
  - "0002-lib-libdvbv5-dvb-dev-remote.c.patch"
  - "0003-lib-libv4lconvert-libv4lconvert.c.patch"

knowledge_gained:
  - "上游顶层 meson.build 用 cc.find_library('argp') 做硬性探测；OHOS/musl 无 argp 库也无 argp_parse 符号，必须改为 required:false，否则整个 configure 失败"
  - "上游 dependency('intl') 是硬性依赖；OHOS/musl 未提供可用 libintl（sysroot 的 libintl.h 不声明任何函数，libc 也无 gettext 符号），必须改为可选，并由 include/gettext.h 的 NLS-disabled 分支兜底"
  - "上游只有 host_machine.system()=='linux' 才把顶层 include/ 加入搜索路径；OHOS 下报告为 'harmonyos'，导致 gettext.h 找不到，需把 harmonyos 纳入同一分支"
  - "上游无条件定义 -DENABLE_NLS；该宏决定 gettext.h 走真实 libintl 分支，必须仅在 dep_intl.found() 时定义"
  - "OHOS UAPI 头缺少 V4L2_PIX_FMT_NV12_16L16，libv4lconvert.c 编译失败，需补四字符码 fallback"
  - "musl 不提供 pthread_cancel；libdvbv5 两处线程清理需改为协作停止（停止标志 + select 超时）或 socket shutdown + pthread_join"
  - "libdvbv5 的 libudev 为硬依赖：lib/libdvbv5/meson.build 在 dep_libudev 未找到时直接 subdir_done()"
  - "OHOS 共享库必须用 binary-sign-tool 签名，否则加载器报 'Error loading shared library'"
  - "Meson 项目为生成依赖的 .pc 而 import conan.tools.gnu.PkgConfigDeps 时，conan-verify 的 G0 构建系统探测会误判为 autotools（判定顺序 cmake→autotools→meson，且以子串 'from conan.tools.gnu import' 命中），从而误报 E490。属框架检测规则限制，不影响构建"
  - "上游 lib/meson.build 无开关可单独构建 libdvbv5，会一并构建 libv4l1/libv4l2/libv4lconvert/libv4l2rds；与同源的 v4l 包存在产物重叠，需在 package() 中按前缀裁剪（注意 share/locale/*/v4l-utils.mo 不以 libv4l 开头，前缀规则覆盖不到）"

