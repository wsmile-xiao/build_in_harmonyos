# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libdvbv5/1.32.0
homepage: "https://linuxtv.org/wiki/index.php/V4l-utils"

# ── 上游测试入口核验（R51 第一步：清点）──────────────────────────────
# 本包是 v4l-utils 源码树中的 lib/libdvbv5 子库。上游该库**没有自动化测试**：
#   $ meson test -C build --list
#   No tests defined.
# 全树 meson.build 中 `test(` 注册数 = 0（grep 全量核实）。
# 因此 upstream_check_command 用 meson test，并如实记录「0 用例」。
upstream_check_command: "meson test -C build"

# conanfile.py build() 中是否已集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# ── 上游测试资产（存在但非 libdvbv5、且多数依赖设备）────────────────
upstream_tests:
  - file: "utils/dvb/dvb-format-convert.c"
    source: "v4l-utils-1.32.0/utils/dvb/dvb-format-convert.c"
    description: >
      唯一不依赖 DVB 硬件的 libdvbv5 消费者：调用 dvb_read_file_format /
      dvb_write_file_format 做频道文件格式转换。它依赖 argp（OHOS/musl 无
      argp），因此无法在 OHOS 上原样构建；其 libdvbv5 代码路径已由
      test_package 中的 test_channel_roundtrip 等价覆盖并实测通过。
    command: "dvb-format-convert -i CHANNEL -o DVBV5 in.conf out.conf"
  - file: "utils/edid-decode/test/*.test"
    source: "v4l-utils-1.32.0/utils/edid-decode/test"
    description: >
      EDID 解析输入语料（24 个）。属于 edid-decode 工具，与 libdvbv5 无关，
      本包不构建该工具，故不适用。
    command: "edid-decode <sample>"
  - file: "utils/v4l2-compliance"
    source: "v4l-utils-1.32.0/utils/v4l2-compliance"
    description: >
      V4L2 合规性测试，需要 /dev/video* 与 /dev/media* 设备节点及内核模块，
      worker 上不可执行；与 libdvbv5 无关。
    command: "v4l2-compliance"
  - file: "utils/dvb/dvb-fe-tool.c"
    source: "v4l-utils-1.32.0/utils/dvb/dvb-fe-tool.c"
    description: >
      DVB 前端测试工具，需要真实 DVB 前端设备（/dev/dvb/adapterN/frontend0），
      worker 上不可执行。
    command: "dvb-fe-tool"

# ── test_package 消费者测试（含鸿蒙特有测试）─────────────────────────
test_package_tests:
  - file: test_libdvbv5.c
    description: >
      libdvbv5 消费者测试：真实调用 dvb_read_file_format /
      dvb_write_file_format 完成 channel→DVBv5 往返，并校验解码后的
      DTV_FREQUENCY / DTV_DELIVERY_SYSTEM / DTV_BANDWIDTH_HZ /
      DTV_CODE_RATE_HP；另含非法输入拒绝与公共 helper 断言。
      其中 test_ohos_packaging 为**鸿蒙特有测试**：验证签名后的产物能被
      OHOS 加载器接受、消费者二进制可链接并运行（上游无任何覆盖）。
    command: "./test_libdvbv5"

# 测试断言总数（实测：checks=19）
assertion_count: 19
