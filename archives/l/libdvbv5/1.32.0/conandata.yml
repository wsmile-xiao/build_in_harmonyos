# conandata.yml — libdvbv5 1.32.0
#
# libdvbv5 是 v4l-utils 源码树中的 DVBv5 用户态库（lib/libdvbv5）。
# 上游没有独立 tarball，仍从官方 linuxtv.org 的 v4l-utils 发布包构建，
# 通过 Meson 选项 -Dlibdvbv5=enabled 只启用该库。
#
# 官方源：https://linuxtv.org/downloads/v4l-utils/v4l-utils-1.32.0.tar.xz

sources:
  url: "https://linuxtv.org/downloads/v4l-utils/v4l-utils-1.32.0.tar.xz"
  sha256: "6828828a17775526eb93fb258a9294d1d1073d633c344dd71ecd4e7a1ffb7dfc"

patches:
  - patch_file: "patches/0001-lib-libdvbv5-dvb-dev-local.c.patch"
    patch_description: "Replace pthread_cancel with cooperative stop/pthread_join in the udev monitor thread"
    patch_type: "portability"
  - patch_file: "patches/0002-lib-libdvbv5-dvb-dev-remote.c.patch"
    patch_description: "Replace pthread_cancel with socket shutdown/pthread_join in the remote receiver thread"
    patch_type: "portability"
  - patch_file: "patches/0003-lib-libv4lconvert-libv4lconvert.c.patch"
    patch_description: "Provide V4L2_PIX_FMT_NV12_16L16 fourcc absent from the OHOS UAPI headers"
    patch_type: "portability"
  - patch_file: "patches/0004-meson.build.patch"
    patch_description: "OHOS/musl platform probes: optional argp/intl and harmonyos include dir"
    patch_type: "portability"
