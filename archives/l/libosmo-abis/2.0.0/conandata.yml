# conandata.yml — libosmo-abis 2.0.0
# 上游官方发布包（osmocom 官方发布站点）
sources:
  url: "https://downloads.osmocom.org/releases/libosmo-abis/libosmo-abis-2.0.0.tar.bz2"
  sha256: "e4cd2682e0870f5475a81454bc8bf82a74603cad7f6565fc6755b3bfccd4a698"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS host triplet; drop umask 077 for the temporary directory (HMDFS does not support it)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept the linux-ohos kernel/OS pair so configure can canonicalize the target triple"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: drop umask 077 around the config.status temporary directory (HMDFS limitation)"
    patch_type: "portability"
  - patch_file: "patches/0004-include-mISDNif.h.patch"
    patch_description: "mISDNif.h: use the libc sys headers unconditionally instead of the kernel-uapi <linux/socket.h>, whose OpenHarmony sysroot copy redefines struct sockaddr_storage and conflicts with <sys/socket.h>"
    patch_type: "portability"
  - patch_file: "patches/0005-tests-ipa_recv-ipa_recv_test.c.patch"
    patch_description: "ipa_recv_test.c: accept the musl wording for strerror(EIO) ('I/O error' vs glibc 'Input/output error')"
    patch_type: "portability"
