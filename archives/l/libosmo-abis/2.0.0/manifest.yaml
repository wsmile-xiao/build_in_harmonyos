# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.0"

# 软件名
software: libosmo-abis

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-09"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.osmocom.org/releases/libosmo-abis/libosmo-abis-2.0.0.tar.bz2"

  # 源码校验和
  sha256: "e4cd2682e0870f5475a81454bc8bf82a74603cad7f6565fc6755b3bfccd4a698"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-ortp"
    - "--disable-dahdi"
    - "--enable-shared"
    - "--disable-static"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libosmocore/1.11.0
    - libosmo-netif/1.6.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-include-mISDNif.h.patch"
  - "0005-tests-ipa_recv-ipa_recv_test.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
