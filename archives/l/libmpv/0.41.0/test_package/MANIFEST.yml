# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmpv/0.41.0
homepage: https://github.com/mpv-player/mpv

# 上游测试命令
upstream_check_command: "meson test -C build"

# mpv 上游测试（test/ 目录）需编译完整 mpv（含播放器主程序与测试依赖），
# 本配方只构建 libmpv 库（cplayer=false），CI 超时内不编译上游测试。
upstream_test_in_build: false
upstream_test_command: ""

upstream_test_changes: []

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "Link mpv::mpv, create mpv_handle, check client API version, call initialize/load_config_file (4 assertions)"
    command: "./test_libmpv"

assertion_count: 4
