# 版本级 manifest
# 文件位置: archives/l/libmpv/0.41.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.41.0"
software: libmpv

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-25"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39: 仅官方源，镜像 fallback 由 CI 自动添加）
  url: "https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz"

  # 源码校验和
  sha256: "ee21092a5ee427353392360929dc64645c54479aefdb5babc5cfbb5fad626209"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dlibmpv=true -Dcplayer=false（只构建库，不构建播放器可执行文件）"
    - "-Dx11=disabled -Dwayland=disabled -Dgl=disabled -Dvulkan=disabled（OHOS 无显示栈）"
    - "-Dalsa=disabled -Djack=disabled -Dpulse=disabled -Dpipewire=disabled -Dopensles=disabled（无桌面音频后端）"
    - "-Ddvdnav=disabled -Dlibarchive=disabled -Duchardet=disabled -Dlibavdevice=disabled -Dzimg=disabled -Drubberband=disabled（未发布可选依赖）"
    - "-Dlcms2=enabled（色彩管理，制品仓已发布 lcms2/2.19）"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libass/0.17.5
    - ffmpeg/7.1.5
    - libplacebo/7.349.0.1
    - lcms2/2.19
    - zlib/1.3.1.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "mpv 的 libass 是硬依赖（meson.build dependency('libass')，无裁剪开关），必须先发布 libass 才能做 libmpv"
  - "mpv 0.41.0 要求 libavcodec >= 60.31.102（ffmpeg 6.1+），制品仓 4.4.8/5.1.10 不满足，需用 ffmpeg/7.1.5（libavcodec 61.x）"
  - "libmpv=true + cplayer=false 只构建 libmpv 库（libmpv.so.2.5.0），不构建 mpv 可执行文件，规避 OHOS 无显示服务器问题"
  - "OHOS 无 X11/Wayland/桌面音频后端，x11/wayland/gl/vulkan/alsa/jack/pulse/pipewire/opensles 全部裁剪"
  - "baka 所用 20 个 libmpv API 在 0.41.0 全部稳定向后兼容（此前调查确认）"
