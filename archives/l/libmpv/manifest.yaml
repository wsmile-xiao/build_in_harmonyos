software: libmpv
display: "libmpv"
description: "mpv 媒体播放器库（libmpv），Baka-MPlayer 的播放内核依赖"
category: multimedia
homepage: "https://github.com/mpv-player/mpv"
license: "LGPL-2.1-or-later OR GPL-2.0-or-later"
build_system: meson

ohos_adaptation:
  key_points:
    - "libmpv=true + cplayer=false：只构建 libmpv 库，规避 OHOS 无显示服务器（mpv 可执行文件运行时需显示栈）"
    - "libass 为硬依赖（mpv meson.build 无裁剪开关），依赖链：libass → freetype/fribidi/harfbuzz/fontconfig"
    - "ffmpeg 需 7.1.5（mpv 0.41.0 要求 libavcodec >= 60.31.102，4.4.8/5.1.10 不满足）"
    - "OHOS 无 X11/Wayland/桌面音频后端，x11/wayland/gl/vulkan/alsa/jack/pulse/pipewire/opensles 全部裁剪"
    - "保留 lcms2 色彩管理（lcms2/2.19 已发布）"
  common_dependencies:
    - libass/0.17.5
    - ffmpeg/7.1.5
    - libplacebo/7.349.0.1
    - lcms2/2.19
    - zlib/1.3.1.1

versions:
  "0.41.0":
    status: built
    build_date: "2026-08-25"
    source_url: "https://github.com/mpv-player/mpv/archive/refs/tags/v0.41.0.tar.gz"
