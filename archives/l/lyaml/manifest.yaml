software: lyaml
display: "lyaml"
description: "Lua bindings for LibYAML, providing YAML parsing and generation"
category: data
homepage: "https://github.com/gvvaughan/lyaml"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "使用 luke（Lua 构建工具），依赖 os.tmpname 函数"
    - "HarmonyOS 环境下 os.tmpname 无法正常工作（平台限制 E002）"
    - "解决方案：手动编译 C 模块，绕过 luke 构建系统"
  common_dependencies:
    - lua
    - libyaml

versions:
  "6.2.8":
    status: built
    build_date: "2026-06-09"