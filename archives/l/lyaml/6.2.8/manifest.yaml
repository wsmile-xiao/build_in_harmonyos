software: lyaml
# 版本级 manifest 模板
# 文件位置: archives/l/lyaml/6.2.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.2.8"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/gvvaughan/lyaml/archive/refs/tags/v6.2.8.tar.gz"

  # 源码校验和（需计算）
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表（手动编译，无标准配置）
  configure_options: []

  # 手动编译步骤
  build_method: manual

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.4.7
    - libyaml/0.2.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁，使用手动编译）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lyaml 使用 luke（Lua 构建工具），依赖 os.tmpname 函数"
  - "HarmonyOS 环境下 os.tmpname 无法正常工作（平台限制 E002）"
  - "解决方案：手动编译 C 模块，绕过 luke 构建系统"
  - "Lua 模块需要设置 LUA_PATH 和 LUA_CPATH 环境变量"

# ============================================================
# 特殊说明
# ============================================================

notes:
  - "这是一个 Lua YAML 库，提供 YAML 解析和生成功能"
  - "需要预先安装 Lua 5.4.x 和 LibYAML"
  - "使用时需要设置 Lua 搜索路径（见 notes.md）"