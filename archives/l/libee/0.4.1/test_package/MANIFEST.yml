# test_package/MANIFEST.yml — libee 0.4.1
# Upstream and consumer test declaration required by CI L0e.

package: libee/0.4.1
homepage: "http://www.libee.org"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "libee-0.4.1.tar.gz (official libee.org release asset)"
  source_sha256: "c0dac01938593deee06c3d161e4eda4ecc0fd7317e1321bd96e301aceb7fb027"
  build_system: "Autotools (configure.ac + Makefile.am, ships generated configure)"
  test_definition: >
    tests/Makefile.am registers an EMPTY TESTS list (TESTRUNS is empty and
    tagbucket.sh/tagbucket1 are commented out), so `make check` builds but
    does not execute anything by itself. The same file declares two
    check_PROGRAMS: genfile (a fixture-number generator helper) and ezapi1
    (a real event-format test program reading name/value pairs from stdin
    and printing the RFC5424 rendering). Counting unit is therefore those
    two check programs: upstream_test_total=2, method autotools_tests. The
    recipe runs `make check` (both must build) and additionally executes
    the freshly built ezapi1 with a scripted fixture, asserting exit 0 and
    a non-empty "Formatted event:" rendering — a content assertion, not a
    stdout string count.
  dependency: "libestr (PKG_CHECK_MODULES in configure.ac) + autoconf/2.72, automake/1.18, libtool/2.5.4, pkgconf/3.0.5 tool_requires (pkgconf bridged via PKG_CONFIG export + pkg-config shims, xmlsec 1.3.12 precedent)"
  portability_changes: []

upstream_check_command: "make check -j1 + ezapi1 fixture run (see conanfile.py _run_upstream_checks)"
upstream_test_in_build: true
upstream_test_command: "make check -j1 + ezapi1 fixture run"

upstream_tests:
  - test_name: "genfile"
    source: "tests/genfile.c"
    kind: "check_program (build verification via make check)"
  - test_name: "ezapi1"
    source: "tests/ezapi1.c"
    kind: "functional (built via make check, executed with scripted fixture)"

upstream_test_total: 2
upstream_test_count_method: "autotools_tests"
upstream_test_passed: 2
upstream_test_failed: 0

# Consumer-perspective checks exercise the packaged library end to end:
# version query, context/event lifecycle, field append, RFC5424 formatting
# and JSON decoding (the 0.4.1 headline feature). Each CHECK aborts with
# exit 1 on failure, so exit 0 proves all 6 assertions.
test_package_tests:
  - file: test_libee.c
    scenario: "consumer-api"
    description: >
      Build and run a Conan consumer that queries ee_version, inits a
      context, creates an event, appends a string field, formats it to
      RFC5424 (asserting non-empty output) and decodes a JSON event.
    command: "./test_libee"
    assertions: 6

assertion_count: 6
