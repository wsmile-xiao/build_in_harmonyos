software: libee
# 版本级 manifest - ARCHIVE-SPEC v2.0

version: "0.4.1"
status: built
build_date: "2026-09-20"
compile_date: "2026-09-20"

source:
  url: "http://www.libee.org/download/files/download/libee-0.4.1.tar.gz"
  sha256: "c0dac01938593deee06c3d161e4eda4ecc0fd7317e1321bd96e301aceb7fb027"
  tar_format: tar.gz

build_system: autotools
configure_options:
  - "--enable-static"
  - "--disable-shared"
  - "--build=aarch64-unknown-linux-gnu"
  - "--host=aarch64-unknown-linux-ohos"
dependencies:
  - "libestr/0.1.11"
tool_requires:
  - "autoconf/2.72"
  - "automake/1.18"
  - "libtool/2.5.4"
  - "pkgconf/3.0.5"
cc: clang
cxx: clang++

bootstrap_command: "autoreconf -fiv"

# R6: 只改源文件不改生成文件——conandata.yml 不声明任何补丁
# （autoreconf -fiv 重新生成 config.guess/config.sub，tool_requires 的
# automake 自带 OHOS 支持；沿用已合入的 libestr 0.1.11 方案）
patches_applied: []

knowledge_gained:
  - "官方 tar 包自带 2012 年 configure，config.guess/config.sub 不识别 OHOS，必须 autoreconf -fiv bootstrap"
  - "tool_requires automake/1.18 + libtool/2.5.4 注入：CI clean 环境无系统 autotools 时必须声明"
  - "configure.ac 用 PKG_CHECK_MODULES 找 libestr，配方需 PkgConfigDeps + requires libestr/0.1.11"
  - "上游 TESTS 为空，check_PROGRAMS 只有 genfile + ezapi1；配方额外用 fixture 实跑 ezapi1 取证"
  - "构建产物含 sbin/libee-convert，按 R38 在软件级声明 commands.json"
