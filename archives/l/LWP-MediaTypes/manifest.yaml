software: LWP-MediaTypes
display: "LWP::MediaTypes"
description: "guess media type for a file or a URL"
category: perl
homepage: "https://metacpan.org/pod/LWP::MediaTypes"
license: perl_5
build_system: perl-extutils

ohos_adaptation:
  key_points:
    - "Pure Perl module, no binary compilation required"
    - "Use perl Makefile.PL PREFIX=... to generate Makefile"
    - "Works with Perl 5.42.0 precompiled package on HarmonyOS"
  common_dependencies:
    - perl >= 5.006002
    - Carp
    - Exporter
    - File::Basename
    - Scalar::Util

versions:
  "6.04":
    status: published
    build_date: "2026-06-15"
    published_as: LWP-MediaTypes
    notes: "All functional tests passed (12/12), fully compatible with HarmonyOS"