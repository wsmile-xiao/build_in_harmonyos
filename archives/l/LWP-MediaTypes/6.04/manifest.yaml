software: LWP-MediaTypes
version: 6.04
status: published
category: perl
description: guess media type for a file or a URL

build_system:
  type: perl-extutils
  configure_command: perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local
  build_command: make
  install_command: make install DESTDIR=/storage/Users/currentUser/tmp/test-install-LWP-MediaTypes-6.04

configure_options:
  - PREFIX=/storage/Users/currentUser/usr/local

dependencies:
  runtime:
    - perl >= 5.006002
    - Carp
    - Exporter
    - File::Basename
    - Scalar::Util
  build:
    - ExtUtils::MakeMaker

patches:
  - name: 0001-Makefile.patch
    description: Makefile generated by perl Makefile.PL for HarmonyOS
    files_modified:
      - Makefile

test_results:
  type: manual
  total: 3
  passed: 3
  failed: 0
  note: Functional tests passed on HarmonyOS

platform_compatibility:
  ohos_kernel: compatible
  notes: Pure Perl module, no binary compilation required

artifacts:
  package: LWP-MediaTypes-6.04-ohos-aarch64.tar.gz
  binaries: none (pure Perl)
  libraries: none

build_date: 2026-06-15
compiler: none (pure Perl)