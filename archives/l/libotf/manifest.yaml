software: libotf
display: "libotf"
description: "OpenType 字体处理库（OTF 表/cmap/布局表解析，附带 otfdump/otflist/otftobdf 工具）"
category: library
homepage: "https://savannah.nongnu.org/projects/m17n"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 依赖 FreeType 2.10 起已移除的 freetype-config，缺失时静默置 HAVE_FREETYPE=no（E572）——补丁 0003 改用 pkg-config（freetype2 / Conan freetype）回退并保证 -lfreetype 进入链接行"
    - "autotools 的 confXXXXXX 临时目录以 umask 077 创建，HMDFS 下权限 2700 不可写（E011）——补丁 0003 改为 umask 022"
    - "上游 config.guess/config.sub（2014）不认识 HarmonyOS——补丁 0001/0002 补齐 aarch64-unknown-linux-ohos 且先于 -linux* 归一化命中"
    - "VPATH out-of-tree 构建下 example/Makefile.in 只有 -I$(top_builddir)/src，示例程序找不到 <otf.h>——补丁 0004 补 -I$(top_srcdir)/src"
    - "otf.h 公开头文件包含 <ft2build.h>/FT_FREETYPE_H，配方以 transitive_headers/transitive_libs 传递 freetype"
    - "三个 bin_PROGRAMS 工具（otfdump/otflist/otftobdf）随包安装，按 R38 在软件级目录声明 commands.json"
  common_dependencies:
    - freetype/2.14.3

versions:
  "0.9.16":
    status: published
    build_date: "2026-09-13"
    published_as: libotf
    notes: "上游无测试套件（example/ 4 个程序为示例程序）；适配测试 6 用例全过（单元 1 + 集成 4 + 鸿蒙特有 1），见 0.9.16/reports/test-report.md"
