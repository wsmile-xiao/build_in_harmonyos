# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libotf/0.9.16
homepage: "https://savannah.nongnu.org/projects/m17n"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libotf 0.9.16 无 tests/ 目录、无 check/test 目标、无测试框架注册
# （R51 三步清点：0 目录 + 0 目标 + 0 注册，见 notes.md）
# 上游 example/ 下的 otfdump/otflist/otftobdf（及条件编译的 otfview）是使用示例
# 而非测试套件，随 make install 安装到 bin/；本包在集成测试中端到端驱动其中 3 个。
upstream_tests: []

# test_package 测试统计（共 6 用例）：
#   - 单元测试：1（test.c → ./test_consumer，链接安装后的 libotf 调用公开 API）
#   - 集成测试：4（test.sh → otfdump / otflist / otftobdf 端到端 + 损坏字体负向）
#   - 鸿蒙特有测试：1（test_ohos.sh，独立统计）
# 内部多项断言不冒充独立测试用例。
#
# 单元测试（test.c，1 用例，17 项断言）：消费者视角只使用包内头文件/库编译链接
# （#include <otf.h>；otf.h 内部再包含 <ft2build.h>/FT_FREETYPE_H，故同时验证
# recipe 的 transitive_headers/transitive_libs 声明）——A1-A3 标签工具；
# B1-B5 OTF_open/OTF_check_table/OTF_get_scripts/OTF_get_features；
# C1-C5 OTF_drive_cmap 与 freetype FT_Get_Char_Index 逐字符比对（ASCII 段必须
# 一致，CJK 段按字体覆盖情况比对，并确认 CJK 路径确被覆盖）+ OTF_get_unicode
# glyph-id → Unicode 反向往返；
# D1-D2 OTF_open_ft_face（消费者自持 FT_Face）；E1-E2 错误路径（不存在文件
# 返回 NULL 且 OTF_error 置位）。
#
# 集成测试（test.sh，4 用例，5 项用例级断言）：驱动上游程序端到端——
# otfdump 真实字体表转储、otflist 字体目录枚举、otftobdf 生成 BDF 流、
# 损坏字体负向（报错退出且未被信号杀死）。

test_package_tests:
  - file: test.c
    description: >-
      单元测试（1 用例）：消费者链接安装后的 libotf 调用公开 API
      （OTF_open/OTF_check_table/OTF_get_scripts/OTF_get_features/OTF_drive_cmap/
      OTF_get_unicode/OTF_open_ft_face/OTF_close/OTF_tag/OTF_tag_name），与
      freetype FT_Get_Char_Index 逐字符交叉验证 cmap 映射
    command: "conan create -tf=test_package"
  - file: test.sh
    description: >-
      集成测试（4 用例）：otfdump 端到端表转储、otflist 端到端目录枚举、
      otftobdf 端到端生成 BDF、损坏字体负向（截断字体 → OTF-Error 且非信号退出）
    command: "sh ./test.sh <pkg> ./test_consumer"
  - file: test_ohos.sh
    description: >-
      鸿蒙特有测试（1 用例，独立统计）：包内产物齐备性、ELF64/AArch64 架构、
      SONAME、NEEDED（含 libfreetype.so.6、无桌面图形库污染）、.codesign 段、
      消费者链接契约、otf.h 的 freetype 头引用、libotf.pc 可用性
    command: "sh ./test_ohos.sh <pkg> ./test_consumer"

# 测试断言总数 (近似值, 用于质量评估)
# 单元 17（test.c，经 test.sh 的 U1 驱动）+ 集成 4（I1-I4 各 1）+ 鸿蒙特有 9 = 30
assertion_count: 30
