version: "0.9.16"
software: "libotf"
status: published
build_date: "2026-09-13"
build_system: "autotools"

source:
  url: "https://download.savannah.nongnu.org/releases/m17n/libotf-0.9.16.tar.gz"
  sha256: "68db0ca3cda2d46a663a92ec26e6eb5adc392ea5191bcda74268f0aefa78066b"
  tar_format: tar.gz

build:
  system: autotools
  # 无额外 configure 参数：freetype 头文件/链接参数经 PKG_CONFIG_PATH 由
  # pkg-config 探得（补丁 0003），上游只要求 --prefix
  configure_options: []
  dependencies:
    - freetype/2.14.3
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-example-Makefile.in.patch"

knowledge_gained:
  - "freetype 2.10 起移除 freetype-config：上游 configure 探测失败时静默置 HAVE_FREETYPE=no，库照样编出但 FT_Load_Sfnt_Table 等符号悬空、OTF 表读取链路全失效——改用 pkg-config（freetype2 / Conan freetype）回退并保证 -lfreetype 进入链接行（knowledge_ref: E572）"
  - "autotools configure 的 confXXXXXX 临时目录在 HMDFS 上以 umask 077 创建得到权限 2700 不可写目录，config.status 随即 Permission denied——补丁改 umask 022（knowledge_ref: E110, E011）"
  - "Conan 补丁器 patch-ng 严格按 hunk 行号定位、不做 GNU patch 式上下文偏移搜索：同一文件被多个补丁依次修改时，前序补丁的行数变化使后续补丁整块失配（apply 返回 False），必须把同一文件的改动合并为单个补丁（knowledge_ref: E577）"
  - "上游 example/Makefile.in 只用 -I$(top_builddir)/src，Conan 的 VPATH（out-of-tree）构建下示例程序找不到 <otf.h>——补 -I$(top_srcdir)/src（knowledge_ref: E578）"
  - "公开头文件 otf.h 内联包含 <ft2build.h>/FT_FREETYPE_H：配方需要 transitive_headers + transitive_libs 传递 freetype，否则消费者编译/链接失败（knowledge_ref: R26/R32 迁移口径）"

patch_generation:
