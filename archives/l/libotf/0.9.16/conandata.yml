# conandata.yml — libotf 0.9.16
# libotf 是 GNU m17n 项目的 OpenType 字体处理库（GNU Savannah 发布），
# 0.9.16 为上游最后一个发行版。

sources:
  url: "https://download.savannah.nongnu.org/releases/m17n/libotf-0.9.16.tar.gz"
  sha256: "68db0ca3cda2d46a663a92ec26e6eb5adc392ea5191bcda74268f0aefa78066b"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: 识别 HarmonyOS/aarch64，输出 aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: 接受 aarch64-unknown-linux-ohos 三元组，先于 -linux* 的 linux-gnu 归一化命中"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: freetype 探测回退到 pkg-config（freetype-config 自 FreeType 2.10 起已移除，缺失时上游静默置 HAVE_FREETYPE=no）；临时目录 umask 077 改为 022（HMDFS 下 077 目录权限 2700 不可写）"
    patch_type: "portability"
  - patch_file: "patches/0004-example-Makefile.in.patch"
    patch_description: "example/Makefile.in: 补 -I$(top_srcdir)/src，修复 VPATH（out-of-tree）构建下 <otf.h> 找不到"
    patch_type: "portability"
