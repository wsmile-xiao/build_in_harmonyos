test_type: conan-test-package
# test_package MANIFEST — liboil 0.3.17（HarmonyOS PC / AArch64）
#
# consumer 真实调用 liboil API 做确定性计算并逐项断言；另含 OHOS
# 专项 ELF 检查。对齐仓库 test_package 模板（libsmf 1.3 / orc 0.4.42）。

package: liboil/0.3.17
target_profile: ohos-aarch64

source:
  - file: conanfile.py
    role: Conan 2 test_package（CMakeDeps + CMakeToolchain）
  - file: CMakeLists.txt
    role: 构建脚本（find_package(liboil)）
  - file: oil_consumer.c
    role: 真实 API consumer（确定性计算 + 断言）
  - file: MANIFEST.yml
    role: 本文件

# ============================================================
# 测试内容
# ============================================================
real_api_tests:
  - name: oil_splat_u32
    what: 固定值 0x12345678 填充 8 元素 u32 数组
    assert: 逐元素相等
  - name: oil_copy_u8
    what: 16 字节确定性拷贝
    assert: memcmp 全等
  - name: oil_sum_f64
    what: {0.5,1.25,-0.25,2.0,0.5} 求和
    assert: 精确等于 4.0
  - name: oil_abs_f32_f32
    what: {-1.5,2.5,-0.25,0.0} 取绝对值
    assert: 逐元素与预期一致
  - name: oil_md5
    what: "b'liboil md5 test\\n'"
    assert: hexdigest == 6c86c52e2b9863d8ed7e5f66dd0f0fa5
  - name: oil_class_get("sum_f64")
    what: 类注册表查询
    assert: 返回非空类且 first_impl 非空

ohos_specific_checks:
  - readelf -h: Class ELF64 + Machine AArch64（shared 的 .so 与
    static 的 .a 首成员）
  - readelf -d (shared): NEEDED 全部打印；无 x86-only 依赖
  - RPATH/RUNPATH: 不含 /storage/ 宿主路径与 .conan 缓存路径
  - static: liboil.a 存在且成员为 AArch64 ELF

execution:
  # test() 内 subprocess 真实执行（等价 self.run），断言 rc==0
  test_command: oil_consumer
  pass_criteria: "oil_consumer: ALL CHECKS PASSED" + OHOS ELF 检查通过
  upstream_tests_note: >
    上游 19 个 TESTS（align, moo, introspect, proto1, proto2, test1,
    proto3, proto4, stride, dso_check, abs, md5, md5_profile, trans,
    copy, zigzag, mmx_engine, stack_align, double_catch）由 recipe 的
    test() make check 真实执行，见 ../notes.md 清点表
