version: '0.3.17'
# 版本级 manifest — liboil 0.3.17
# 父级软件 manifest: ../manifest.yaml（software: liboil）

package_format: conan
conan_channel: stable
# 本地 cache 引用名（本仓库惯例，见 libsmf 1.3 / orc 0.4.42）
conan_ref: liboil/0.3.17@archives/stable

# ============================================================
# 上游源
# ============================================================
sources:
  - url: https://liboil.freedesktop.org/download/liboil-0.3.17.tar.gz
    sha256: 105f02079b0b50034c759db34b473ecb5704ffa20a5486b60a8b7698128bfc69
    mirrors:
      - https://download.gnome.org/sources/liboil/0.3/liboil-0.3.17.tar.gz

license: BSD-2-Clause

# ============================================================
# 构建与适配
# ============================================================
build_system: autotools
# 上游 0.3.17 为最后版本（2007 年后无发布），config.guess/sub 为
# 2009-04-27 版，不识别 aarch64/OHOS；采用 --build=--host 显式三元组
# （aarch64-unknown-linux-gnu，config.sub 实测接受）走原生构建路径。
host_triplet: aarch64-unknown-linux-gnu

# 应用的补丁列表（根因）
patches: []

# 依赖（核心库零外部依赖；glib 仅 examples/uberopt 使用，默认不构建）
dependencies: []

# SIMD / CPU 特性在 AArch64 下的行为（上游架构条件，非适配禁用）:
# - AS_HOST_DEFINES(m4/as-host-defines.m4) 按 host_cpu 精确匹配:
#   i386→HAVE_I386, amd64→HAVE_AMD64, powerpc→HAVE_POWERPC,
#   arm→HAVE_ARM, 并据此拼 liboil/SUBDIRS。
# - aarch64 不命中任何 case → x86 MMX/SSE(i386,i386_amd64,amd64)、
#   ARM VFP(arm)、AltiVec(powerpc)、motovec 汇编目录全部不进构建，
#   无需补丁（E016 不适用），CPU 特性检测回退 liboilcpu-misc.c
#   （空实现，无 SIGILL 风险）。

# ============================================================
# 测试
# ============================================================
# 上游 testsuite/Makefile.am TESTS 共 19 个，make check 全部真实执行。
# 详见 ../notes.md（19 个测试逐一架构判定 + make check 输出）。
upstream_tests:
  total: 19
  executed: 19
  skipped_as_x86_only: 0   # 无 skip：x86-only 主体被上游条件编译排除

# ============================================================
# 验证记录
# ============================================================
# 完整 conan create（ohos-aarch64 profile）结果见 ../notes.md。
verified:
  ohos-aarch64:
    shared: pending    # Task #6 实际执行后回填 PASS/FAIL 与 rc
    static: pending
