software: libiodata
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.19.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.19.14"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# 构建系统类型（顶层字段，用于快速检索）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/sailfishos/libiodata/tarball/refs/tags/0.19.14"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 手动编译，无 configure 步骤

  # 编译依赖列表（格式: name/version）
  dependencies:
    - flex/2.6.4
    - bison/3.8.2
    - qt5/5.15.2

  # 编译器
  cc: clang
  cxx: clang++

  # 手动编译命令
  manual_build:
    - "bison -v -d -o parser.cpp datalang.y"
    - "flex -o tokens.cpp datalang.l"
    - "clang++ -std=c++14 -fPIC -I$QT_INCLUDE -I$QT_INCLUDE/QtCore -DQT_CORE_LIB -c *.cpp"
    - "clang++ -shared -o libiodata-qt5.so.0.19.14 *.o -L$QT_LIB -lQt5Core -Wl,-rpath,$QT_LIB"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "qmake 构建失败：Qt 安装不完整导致无法找到 features 目录（见 E111）"
  - "解决方案：手动使用 flex/bison + clang++ 编译 Qt 项目"
  - "版本号通过 IODATA_VERSION 环境变量设置"
  - "Qt5Core 运行时加载问题导致测试无法运行（环境限制）"
  - "DESTDIR 安装：手动复制库文件和头文件到测试目录"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"