software: libiodata
display: "libiodata"
description: "Qt-based data language library for input method configuration"
category: data              # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://github.com/sailfishos/libiodata"
license: BSD-2-Clause
build_system: custom               # 常用构建系统

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Qt 安装不完整导致 qmake 无法工作，需手动编译（flex/bison + clang++）"
    - "依赖 Qt5Core，需要设置 QT_INCLUDE 和 QT_LIB 环境变量"
    - "手动编译流程：bison/flex 生成 parser → clang++ 编译 → 创建共享库"
  common_dependencies:
    - flex/2.6.4
    - bison/3.8.2
    - qt5/5.15.2

# 版本索引（所有已归档版本，含状态）
versions:
  "0.19.14":
    status: built             # published | built | failed | archived
    build_date: "2026-06-04"