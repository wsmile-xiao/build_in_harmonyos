# test_package/MANIFEST.yml — lsw 0.3
#
# 上游测试清点证据（R51 上游测试三步法）：
#   - 上游 suckless 工具无任何测试基础设施：Makefile 无 test/check 目标
#     （全部目标：all/options/lsw/clean/dist/install/uninstall），源码仅
#     lsw.c 单文件（66 行）无测试代码 ⇒ N_static = 0；
#   - 依据 SKILL 规则「上游确实无测试（N_static=0）才允许仅消费者测试
#     补位」，本包以消费者测试补位；
#   - 消费者测试走无 X 环境确定性错误路径（设备/CI headless，无 Xvfb）：
#     XOpenDisplay 失败 → lsw.c L19-20 报 "cannot open display" 并以
#     EXIT_FAILURE 退出（clipnotify 1.0.2 test_nox.sh 同款机制），
#     真实执行了包内 ELF 与 libX11 动态链接链的加载。

package: lsw/0.3
homepage: "https://dl.suckless.org/tools/"

upstream_check_command: ""
upstream_check_command_note: "上游无测试目标（Makefile 全目标：all/options/lsw/clean/dist/install/uninstall；单文件 lsw.c 无测试代码）→ N_static=0，消费者测试补位"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_lsw_nox.sh
    description: "消费者测试：①包内二进制存在且可执行 ②无 DISPLAY 时执行 lsw 必须非零退出且 stderr 含 'cannot open display'（真实执行 X11 动态链接链加载）"
    command: "sh test_lsw_nox.sh <bindir> <tmpdir>"

assertion_count: 2
