# 版本级 manifest — archives/l/lsw/0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0；source.url / source.sha256 与 conandata.yml 同源

# ============================================================
# 必须字段
# ============================================================

version: "0.3"

software: "lsw"

# published | built | failed | archived
status: built

build_date: "2026-09-22"
build_system: "makefile"

# ============================================================
# 源码信息（与 conandata.yml 完全一致）
# ============================================================

source:
  url: "https://dl.suckless.org/tools/lsw-0.3.tar.gz"
  sha256: "0b3f3ce16eef060df6e0d90327ee82593dfd75281347908698747cfa3f8d0655"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 无 configure/meson：suckless 纯 Makefile + config.mk（详见 notes.md）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libx11/6.4.0"

  # 传递依赖（同图参与 include/lib 路径注入，不作 requires 声明）
  transitive_dependencies:
    - "xorgproto/2025.1"
    - "libxcb/1.16"
    - "libxau/1.0.11"
    - "libxdmcp/1.1.5"
    - "xtrans/1.6.0"

  cc: clang
  cxx: clang++

  # 实际构建命令（build() 内一条 make，零补丁）
  build_command: 'make CC=<conf compiler_executables> INCS="<全部 host 依赖绝对 -I>" LIBS="<全部 host 依赖绝对 -L> -lX11" lsw'
  install_command: "make install DESTDIR=<pkg> PREFIX=/ MANPREFIX=/share/man"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 测试账本（R51 五维，与 notes.md / test_package/MANIFEST.yml 同源）
# ============================================================

test:
  n_static: 0
  n_registered: 0
  n_executed: 0
  n_skipped: 0
  n_failed: 0
  n_consumer: 1
  n_assertion: 2
  note: "上游 suckless 无测试目标与测试源码（N_static=0），消费者测试补位；实测 2/2 断言通过"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "裸 Makefile 烧死 CC 与 X11 路径时，用 make 命令行覆盖聚合变量 INCS/LIBS 注入依赖路径，零补丁 (ref: DRAFT-lsw-0.3-suckless-baked-paths-makevar-override)"
  - "X11/Xlib.h 属 libx11 而 X11/X.h 属 xorgproto 协议头包，只注直接依赖 includedirs 首项必缺头 (ref: DRAFT-lsw-0.3-suckless-baked-paths-makevar-override)"

# ============================================================
# 产物信息
# ============================================================

artifacts:
  binaries:
    - bin/lsw
  libraries: []
  headers: []
  manpages:
    - share/man/man1/lsw.1
