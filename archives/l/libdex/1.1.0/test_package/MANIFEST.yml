package: libdex/1.1.0
homepage: "https://gitlab.gnome.org/GNOME/libdex"

# 上游测试命令（libdex 为 meson 项目，用 meson test 枚举）
upstream_check_command: "meson test --list -C builddir"
upstream_test_in_build: true
upstream_test_command: "meson test -C builddir"

# 上游实际运行的测试程序（按 test-report.md 双口径台账：源码声明 75 用例/13 文件，
# 当前 OHOS 配置实例化 12 个可执行用例并全量通过；test-dbus 11 用例因 gdbus 未实例化）
upstream_tests:
  - file: testsuite/test-fiber.c
    source: libdex-1.1.0/testsuite/test-fiber.c
    description: "GLib 测试：fiber 调度器 + ucontext 上下文切换 + channel await（3 用例）"
    command: "meson test -C builddir test-fiber"
  - file: testsuite/test-future.c
    source: libdex-1.1.0/testsuite/test-future.c
    description: "GLib 测试：future 解析/链式/错误传播（37 用例）"
    command: "meson test -C builddir test-future"
  - file: testsuite/test-channel.c
    source: libdex-1.1.0/testsuite/test-channel.c
    description: "GLib 测试：channel 收发（2 用例）"
    command: "meson test -C builddir test-channel"

# test_package 中自带的测试（消费者视角验证，使用公开 API）
test_package_tests:
  - file: test.c
    description: "消费者测试：dex_init/dex_scheduler_spawn/dex_future_get_status/dex_future_get_value 真实调用并断言结果"
    command: "./test_libdex"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 8