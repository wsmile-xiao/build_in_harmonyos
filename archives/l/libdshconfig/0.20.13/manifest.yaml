software: libdshconfig
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.20.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.20.13"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-14"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.netfort.gr.jp/~dancer/software/downloads/libdshconfig-0.20.13.tar.gz"

  # 源码校验和
  sha256: "6f372686c5d8d721820995d2b60d2fda33fdb17cdddee9fce34795e7e98c5384"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-shared"
    - "--enable-static"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0004-config.guess.patch"
  - "0006-config.sub.patch"
  - "0001-configure-umask-022.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autoconf 2.61 的 config.guess 不识别 HarmonyOS，需用补丁更新 config.guess/config.sub"
  - "HMDFS 文件系统不支持 umask 077 创建的目录内写文件，需改为 umask 022"
  - "cpp_info.libs 应使用不含 lib 前缀的库名（dshconfig 而非 libdshconfig）"
  - "conanfile.py build() 不应依赖系统 automake，应通过 conandata 补丁处理 config.guess/config.sub 更新"
