  - "0002-Makefile.in.patch"
  - "0003-aclocal.m4.patch"
  - "0004-config.guess.patch"
  - "0005-config.h.in.patch"
  - "0006-config.sub.patch"
  - "0007-configure.patch"
  - "0008-depcomp.patch"
  - "0009-install-sh.patch"
  - "0010-ltmain.sh.patch"
  - "0011-missing.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autoconf 2.61 的 config.guess 不识别 HarmonyOS，需 autoreconf -fi 重新生成"
  - "HMDFS 文件系统不支持 umask 077 创建的目录内写文件，需改为 umask 022"
  - "cpp_info.libs 应使用不含 lib 前缀的库名（dshconfig 而非 libdshconfig）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

