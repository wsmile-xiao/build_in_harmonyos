software: luau
version: 0.689-r0
category: language
description: A fast, small, safe, gradually typed embeddable scripting language derived from Lua
website: https://luau-lang.org/
source_url: https://github.com/luau-lang/luau/archive/refs/tags/0.689.tar.gz

build:
  system: cmake
  build_system: cmake
  compiler: clang++
  compiler_version: 15.0.4
  options:
    - -DCMAKE_BUILD_TYPE=Release
    - -DLUAU_BUILD_TESTS=OFF

dependencies: []

status: built

install:
  bins:
    - luau
    - luau-analyze
    - luau-ast
    - luau-bytecode
    - luau-compile
    - luau-reduce
  libs:
    - libLuau.Analysis.a
    - libLuau.Ast.a
    - libLuau.CLI.lib.a
    - libLuau.CodeGen.a
    - libLuau.Compiler.a
    - libLuau.Config.a
    - libLuau.EqSat.a
    - libLuau.Require.a
    - libLuau.RequireNavigator.a
    - libLuau.VM.a
  includes:
    - Luau/
    - lua.h
    - luaconf.h
    - lualib.h
    - luacode.h
    - luacodegen.h

test:
  command: ./luau --help
  expected: "Usage:"

notes: |
  - Built with clang++ 15.0.4 for aarch64-unknown-linux-ohos
  - No patches required
  - CMake project without install target, manual installation
  - Successfully built all CLI tools and static libraries