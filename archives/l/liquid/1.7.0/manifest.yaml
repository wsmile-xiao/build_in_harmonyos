# 版本级 manifest — liquid 1.7.0

version: "1.7.0"
software: "liquid"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 GitHub tag 归档
  url: "https://github.com/jgaeddert/liquid-dsp/archive/refs/tags/v1.7.0.tar.gz"

  # 源码校验和（SHA-256）
  sha256: "33c42ebc2e6088570421e282c6332e899705d42b4f73ebd1212e6a11da714dd4"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # CMake 配置选项（关闭 SIMD、autotests、benchmarks、examples；仅列出上游 1.7.0 真实存在的 option）
  configure_options:
  - "-DENABLE_SIMD=OFF"
  - "-DBUILD_AUTOTESTS=OFF"
  - "-DBUILD_BENCHMARKS=OFF"
  - "-DBUILD_EXAMPLES=OFF"
  - "-DBUILD_SANDBOX=OFF"
  - "-DBUILD_DOC=OFF"
  - "-DCOVERAGE=OFF"

  # 编译依赖列表（仅 libc + libm，无外部第三方依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "liquid-dsp 1.7.0 单 shared library 目标，仅依赖 libc + libm"
- "OHOS musl aarch64 需关闭 SIMD（ENABLE_SIMD=OFF）：cmake/FindSIMD.cmake 用 CHECK_C_SOURCE_RUNS()（try_run）探测，交叉编译下无法执行 target 探针"
- "v1.7.0 的 CMakeLists 未集成 FFTW（仅 CMakeLists.txt:47 注释 '# TODO: check for FFTW'），不存在 FIND_FFTW 开关，也无 GPL 污染问题"
- "上游用例数由 scripts/autoscript.c 扫描 CMake AUTOTESTS 清单生成 autotest_include.h 的 NUM_AUTOSCRIPTS 决定；v1.7.0 为 1317（158 个测试程序 / 156 package），含未登记用例后清单合计 1320"
- "上游 autotests 需构建期运行 autoscript 并执行 xautotest，交叉编译不可复现；按 R51 在 HarmonyOS aarch64 真机原生构建执行，1317/1317 通过、716451 断言通过"
- "test_package L1 以 AGC/NCO 对象创建销毁验证 libliquid 链接；消费者用例以 resamp_crcf 验证鸿蒙可行性"
