# test_package/MANIFEST.yml — liquid 1.7.0
# CI L0e requires this file to exist.

package: liquid/1.7.0
homepage: "https://github.com/jgaeddert/liquid-dsp"

# 上游测试命令（仅当 BUILD_AUTOTESTS=ON 时生成 CTest）
upstream_check_command: "ctest --output-on-failure"

# conanfile 未集成上游测试（保持构建可复现，autotests 在 cross-compile 下关闭）；
# 上游测试按 R51 在 HarmonyOS aarch64 真机原生构建执行并回填，
# 证据见 ../reports/upstream-autotest-1.7.0.md 与 ../reports/upstream-autotest-1.7.0.json
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（仅当 BUILD_AUTOTESTS=ON 时构建）
# v1.7.0 清点：autotest_include.h NUM_AUTOSCRIPTS=1317（158 个测试程序 / 156 package），
# 真机实测 1317/1317 通过、716451 断言通过、0 失败、57 警告、rc=0；
# 含未登记用例后用例清单合计 1320。
upstream_tests:
  - name: autotest
    source: autotest/
    description: "xautotest 全量 autotest 套件，验证所有 DSP 对象的基本功能（创建/销毁/运算一致性）"
    command: "./xautotest"
    test_cases: 1317
    assertions: 716451
    result: "1317/1317 PASS (100%), 0 failed, 57 warnings"

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "L1 链接测试：验证 agc_crcf + nco_crcf 对象可创建/销毁"
    command: "./test_liquid"
  - file: consumer-case/liquid-ohos-test.c
    description: "鸿蒙消费者用例：以 resamp_crcf 验证重采样器在鸿蒙环境下端到端可行性"
    command: "./liquid_ohos_consumer"

# 测试断言总数（近似值）
assertion_count: 4
