# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnl/3.11.0

homepage: "https://github.com/thom311/libnl"

# 上游测试命令
# 顶层 Makefile.am 定义 `TESTS =` + 末尾 `TESTS += $(check_programs)`，
# 而 `check_programs` 只被 `+= tests/check-all`（Makefile.am:1036）与
# `+= tests/check-direct`（Makefile.am:1060）追加 —— 即上游**有意**只把
# 这两个 libcheck 程序挂进 TESTS；24 个 test-create-* 与 3 个 cache 类
# 程序属 `check_PROGRAMS`，`make check` 只构建、不自动运行（它们需要
# root + NET_ADMIN 真机 netlink 环境）。
upstream_check_command: "make check"

# conanfile.py build() 中是否集成上游测试：否。
# 原因：本包以 `--disable-cli` 纯库形态交付，`check`（libcheck）为上游客选
# 测试依赖（configure.ac:87 `PKG_CHECK_MODULES([CHECK],[check >= 0.9.0])`
# 落在 WITH_CHECK 条件内，缺失仅 AC_MSG_WARN 关闭单测）。且上游 TESTS 中
# check-all 的 netns/iface 用例与 24 个 test-create-* 均需 root 与内核
# netlink 写权限，在容器/沙箱内必然失败 —— 挂在 build() 会让配方不可复现。
# 故上游测试在适配期以独立复现脚本执行并留证（见下方 upstream_tests 与
# notes.md「上游测试」节），配方本身只做 configure + make + install。
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（TESTS 变量展开：共 2 个）
upstream_tests:
  - name: "check-all"
    file: "tests/check-all.c"
    description: >-
      libcheck 主套件，链接 tests/      libnl-test-util.la。启用 4 个 suite：
      "main"(Core)、"Abstract addresses"、"Netlink attributes"、"Clone ematch tree"
      以及 "netns"。3.11.0 实测 Checks: 31 / Failures: 0 / Errors: 19
      （19 个 error 全部为 `(after this point) Received signal 31 (Bad system call)`
      —— 环境 seccomp（Seccomp: 2）拦截测试框架 nltst_netns_enter() 的
      unshare(CLONE_NEWUSER/CLONE_NEWNET) 建 netns，SIGSYS 无差别、非产品缺陷）。
    source_dir: "tests"
    expected_assertions: 31
  - name: "check-direct"
    file: "tests/check-direct.c"
    description: >-
      `--enable-static` 时才编译（Makefile.am:1058 `if WITH_CHECK / if ENABLE_STATIC`），
      以 `-static` 全静态链接，验证静态归档下符号解析与 vlan attribute 布局。
      实测 Checks: 2 / Failures: 0 / Errors: 0（100% 通过）。
    source_dir: "tests"
    expected_assertions: 2

# 上游 check_PROGRAMS 中**未**纳入 TESTS 的 27 个程序（适配期手工逐个运行留证）
# 24 个 link/netfilter 类：test-complex-HTB-with-hash-filters、test-create-bond、
#   test-create-bridge、test-create-geneve、test-create-ifb、test-create-ip6tnl、
#   test-create-ipgre、test-create-ipgretap、test-create-ipip、test-create-ipvlan、
#   test-create-ipvti、test-create-macsec、test-create-macvlan、test-create-macvtap、
#   test-create-sit、test-create-veth、test-create-vlan、test-create-vrf、
#   test-create-vxlan、test-create-xfrmi、test-delete-link、test-loopback-up-down、
#   test-socket-creation、test-u32-filter-with-actions
# 3 个 cache 类：test-cache-mngr、test-genl、test-nf-cache-mngr
# 实测：test-socket-creation 通过（EXIT 0）；其余 26 个因执行域特权限制返回
#   "No Access"/EACCES（EXIT 229/27/255/1）—— 鸿蒙 LSM 域（adhoc_bin，临时编译二进制）
#   无 AF_NETLINK bind() 权限（LD_PRELOAD 追踪 + attr/current 域对比坐实；
#   develop_tools_hap 域下 netlink socket/bind/收发全链路可用），非 seccomp、非 socket 创建被禁。
unupstream_run_programs_count: 27

# 上游测试程序总量（检视统计口径）：31 = check_PROGRAMS 29 + TESTS 2。
# check-all、check-direct 同时位于 TESTS 与 check_PROGRAMS 两表（Makefile.am 的
# check_programs 变量），去重后唯一程序 29 = TESTS 2 + 非 TESTS check_PROGRAMS 27（本文件所列）。
total_upstream_programs_count_review: 31

# test_package 自带测试（消费者视角：编译 + 链接 + 运行时断言）
test_package_tests:
  - file: test_libnl.c
    description: >-
      以 CMake 消费者身份链接 libnl::nl-3 / nl-route-3 / nl-genl-3 / nl-nf-3 /
      nl-idiag-3 / nl-xfrm-3 六个组件，运行时执行 7 组真实断言（非空跑）：
      LIBNL_VERSION 字面量、nl_af2str/nl_str2af 往返、nl_socket_alloc/free、
      nl_rtntype2str、idiagnl_state2str、nfnl_ct_alloc/put、
      genl_op2name/xfrmnl_ae_flags2str 符号可解析。
      进程返回 failures == 0 ? 0 : 1，test() 用 self.run() 真实校验退出码。
    command: "test_libnl"

# 测试断言总数（近似值，用于质量评估）
# 上游 TESTS 33（= 31 check-all checks + 2 check-direct checks）
#  + test_package 7 组断言 = 40
assertion_count: 40

# 刻意不忽略错误：libnl/3.7.0 的 test_package 用
# `self.run("bin/test_libnl", ignore_errors=True)` 吞掉了退出码；3.11.0 改为
# 真实断言，退出码非 0 即判 FAIL。
