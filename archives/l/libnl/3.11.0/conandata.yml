# conandata.yml — libnl 3.11.0 (Netlink Protocol Library Suite)
#
# 源码：上游官方 GitHub Release 归档（tag libnl3_11_0，发布于 2024-10-30）。
# SHA256 由官方同批发布的 `libnl-3.11.0.tar.gz.sha256sum` 资产核验一致：
#   官方资产值 = 2a56e1edefa3e68a7c00879496736fdbf62fc94ed3232c0baba127ecfa76874d
#   本地复算   = 2a56e1edefa3e68a7c00879496736fdbf62fc94ed3232c0baba127ecfa76874d
#
# R39/PF7：只写上游官方源 URL 一条，不手写镜像前缀（镜像回退由 CI 接管）。

sources:
  "3.11.0":
    url: "https://github.com/thom311/libnl/releases/download/libnl3_11_0/libnl-3.11.0.tar.gz"
    sha256: "2a56e1edefa3e68a7c00879496736fdbf62fc94ed3232c0baba127ecfa76874d"

patches:
  "3.11.0":
    - patch_file: "patches/0001-support-ohos-triplet.patch"
      patch_description: >-
        build-aux/config.guess(2023-06-23) 不识别 `uname -s` = HarmonyOS，configure
        报 "cannot guess build type"；config.sub 亦不识别 linux-ohos kernel-OS。
        按知识库 E205（scripts/patch-autotools-ohos.pl）为二者补 HarmonyOS /
        ohos / linux-ohos 识别，不使用 --build/--host 绕过。
      patch_type: "portability"
    - patch_file: "patches/0002-headers-selfcheck-use-linux-private.patch"
      patch_description: >-
        上游 Makefile.am/Makefile.in 的 build-headers-test 编译规则只带
        `-I$(srcdir)/include -I$(builddir)/include`，漏掉 libnl 自带内核头私有副本
        `include/linux-private`；OHOS sysroot 的 linux/socket.h 定义了无前缀的
        `struct sockaddr_storage`，与 sys/socket.h 冲突（知识库 E091/E119），
        导致 `check-local`/`check-build-headers` 在 `make check` 第一阶段即
        `redefinition of 'sockaddr_storage'` 中止。补上该 -I 后与库自身编译口径一致，
        公共头自包含性检查通过。仅影响自检规则，不改变交付库内容。
      patch_type: "portability"
