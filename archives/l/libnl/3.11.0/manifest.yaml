# 版本级 manifest — libnl 3.11.0
# 文件位置: archives/l/libnl/3.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# 状态说明：status 由 finish/W3 验证后回填；未经 finish 禁填 published。
#           本文件记录探索编译（手工复现）阶段的事实。

# ============================================================
# 必须字段
# ============================================================

version: "3.11.0"

software: libnl

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游官方 GitHub Release 归档（tag libnl3_11_0）
  url: "https://github.com/thom311/libnl/releases/download/libnl3_11_0/libnl-3.11.0.tar.gz"

  # 与官方同批发布的 libnl-3.11.0.tar.gz.sha256sum 资产逐字符一致
  sha256: "2a56e1edefa3e68a7c00879496736fdbf62fc94ed3232c0baba127ecfa76874d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 本包显式传入的 configure 选项（AutotoolsToolchain 另行注入
  # --prefix/--libdir/--includedir 等 Conan 标准项）。
  #
  # ⚠️ 两条硬性约束（G0 clean-verify 会真实踩到，勿改）：
  #   1) 列表项之后**不得**写行内 `#` 注释：G0 用一条不跨行的正则截取本字段的
  #      **第一行**，行内注释会被整体当成参数传给 configure，实测报
  #      "invalid feature name"。说明文字一律写在这里。
  #   2) 在此处也不要书写 `键名:` + 形如正则的示例文本：G0 用的是全文 re.search，
  #      会先命中注释里的这一行并抽出乱码参数（本包曾因此 G0 失败）。
  #   3) 首项必须是最关键的一项（正则只取第一项，其余项 G0 不会用到）。
  #
  # 选项释义: --disable-cli → CLI 依赖 netlink 内核交互，OHOS 用户态不可用，纯库交付
  configure_options:
    - "--disable-cli"
    - "--enable-static"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  # 本包无 Conan 依赖：R36 无适用对象。
  # 构建期宿主机工具 flex / bison / pkg-config 由 profile [buildenv] 的
  # /data/service/hnp/bin 提供；release dist tarball 已含预生成 configure /
  # Makefile.in，无需 automake/autoconf 自举。
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-support-ohos-triplet.patch"                    # config.guess/config.sub 识别 HarmonyOS / ohos / linux-ohos（E205）
  - "0002-headers-selfcheck-use-linux-private.patch"     # build-headers-test 补 -I$(srcdir)/include/linux-private（E091/E119）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  # 每条行尾的 `# knowledge_ref:` 指向知识图谱中承载该经验的正式节点
  # （check_knowledge_gap 要求逐条登记；顶层 knowledge_ref: 列表供 submit Check 8 校验路径存在）。
  - "E205（config.guess/config.sub 不识 HarmonyOS）在本包复现：uname -s = HarmonyOS / uname -r = 'HongMeng Kernel 1.12.0'，tarball 自带 config.guess(2023-06-23) 报 'cannot guess build type'。按 E205 用 scripts/patch-autotools-ohos.pl 生成为 0001；**不使用 --build/--host 绕过**（E205 明令禁止）"   # knowledge_ref: knowledge/graph/E205.kv
  - "⚠️ patch-autotools-ohos.pl 自身有 2 处缺陷需手工补齐：(a) 它按 __ANDROID__ / LIBC=android 定位 config.guess 插入点，libnl 的 config.guess 结构不同故找不到；(b) 2.1 步先写入 basic_os=linux-ohos，使 2.3 步 unless ($sc =~ /linux-ohos/) 恒为假被短路，kernel-OS 校验表未加 → config.sub 仍报 'Kernel linux not known to work with OS ohos'。须手工补 '| linux-ohos* )' 到 kernel-OS 校验表（本包 0001 第 4 个 hunk）"   # knowledge_ref: knowledge/graph/E205.kv
  - "E091/E119（sockaddr_storage 重定义）在本包的真实触发点是**上游自检规则**而非库代码：OHOS sysroot 的 linux/socket.h 定义无前缀 struct sockaddr_storage，与 sys/socket.h 冲突；libnl 自带 include/linux-private/linux/socket.h 定义的是带前缀 struct __kernel_sockaddr_storage（专为规避），且库自身编译 default_includes 把 -I$(srcdir)/include/linux-private 排在最先 → 库本体编译无碍。但 automake 生成的 %.build-headers-test.o 规则只带 -I$(srcdir)/include -I$(builddir)/include，漏了 linux-private → make check 第一阶段（check-local → check-build-headers）即中止。0002 补上该 -I"   # knowledge_ref: knowledge/graph/E119.kv
  - "⚠️ 消费者须知（写入 recipe docstring + MANIFEST.yml）：libnl 安装的公共头**不含** linux-private，下游若同时包含 <netlink/...> 与 <sys/socket.h>，<linux/netlink.h> 会落到 sysroot 并命中同一冲突 → 需按 E119 预定义 _UAPI_LINUX_SOCKET_H 与 __kernel_sa_family_t（本包 test_package/CMakeLists.txt 即此处置）"   # knowledge_ref: knowledge/graph/E119.kv
  - "上游 TESTS 只有 2 个：Makefile.am 的 TESTS 末尾 TESTS += $(check_programs)，而**小写** check_programs 仅被 += tests/check-all 与 += tests/check-direct 追加；24 个 test-create-* 与 3 个 cache 类属大写 check_PROGRAMS，make check 只构建不运行（需 root + NET_ADMIN）。统计上游测试数时勿把 check_PROGRAMS 当 TESTS"   # knowledge_ref: knowledge/graph/E231.kv
  - "libcheck 在 OHOS 上需两个环境变量才能启动：① 它把通信临时文件硬编码写 /tmp（只读 erofs），须设 TEMP=<可写目录>（strings libcheck.so 可见 TEMP 与 /tmp 相邻）；② 测试二进制动态链 libcheck.so，须把 check 包内 lib/ 加入 LD_LIBRARY_PATH。缺任一项分别得到 'Unable to create temporary file for communication' 与 'Error loading shared library libcheck.so'（exit 127）。本会话新增：check.pc 内嵌的是 conan **build** 目录的陈旧 prefix（/p/b/check*/p，已被清理）→ pkg-config 给出的 -I 失效、'check.h not found'；须用 PKG_CHECK_MODULES 支持的 CHECK_CFLAGS/CHECK_LIBS 环境变量覆盖"   # knowledge_ref: knowledge/graph/E265.kv
  - "沙箱 seccomp 拦截 netlink：check-all 的 netns / test_create_iface / cache_and_clone / route_1 用例报 'Received signal 31 (Bad system call)'（SIGSYS）；24 个 test-create-* 与 test-delete-link / test-loopback-up-down / test-cache-mngr / test-genl / test-nf-cache-mngr 全部返回 No Access（EPERM）。**属环境限制而非产品缺陷**，真机（root）下才具备运行条件"   # knowledge_ref: knowledge/graph/E051.kv
  - "手工构建在本沙箱可用的环境前提（本会话实测修正）：① safe-bin 垫片是**导出函数** BASH_FUNC_rm%%/unlink%%/rmdir%%，`unset BASH_FUNC_rm%%` 语法无效，必须 `unset -f rm unlink rmdir` 才真正移除；否则函数体展开为 ${CODEBUDDY_SAFE_DELETE_BIN_DIR}/rm（变量已清空）= /rm → 报 'environment: /rm: No such file or directory'。② G0 clean-verify 的 config_shell 取自环境变量 CONFIG_SHELL（clean_verify.py:68），默认 /data/service/hnp/bin/bash —— 该 bash 在本沙箱 getcwd() 返回 ENOTSUP，且 Python subprocess(cwd=) 不同步 PWD，autoconf 的 pwd 取不到值 → 'configure: error: working directory cannot be determined'；置 CONFIG_SHELL=/bin/sh 即通过（真实构建路径由 profile [buildenv] 指定 bash，不受影响）。③ TMPDIR 未设时 tempfile.mkdtemp 落到 /data/storage/el2/base/cache，该路径下 bash getcwd 亦被拒，须指向可写目录"   # knowledge_ref: knowledge/graph/E265.kv
  - "R38 判定：detect_bindirs.py rc=0 → package_type=library，产物无 bin/（configure 已 --disable-cli）→ 不登记 commands.json、不声明 bindirs。CLI 若日后需要，应作为独立 -tools 子包处理"   # knowledge_ref: knowledge/graph/E424.kv
  - "6 个子库 component 化：nl-3（includedirs=include/libnl3，因头文件装到 include/libnl3/netlink/*.h，消费者写 #include <netlink/netlink.h>）+ nl-route-3/nl-genl-3/nl-nf-3/nl-idiag-3/nl-xfrm-3（requires=nl-3）。对照：生成器模板给出的 cpp_info.libs=['libnl'] 是错的（实际库名 nl-3 等，与包名不同）"   # knowledge_ref: knowledge/graph/E323.kv

