# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS文件系统权限问题：umask 077创建的目录无组权限，HMDFS阻止在该目录内创建文件(Permission denied)；解决：将configure和config.status中umask 077改为umask 022"
  - "bash无法执行/usr/bin/下的toybox命令(rm/ls等)返回Permission denied，必须用/bin/sh(toybox sh)运行autotools脚本"
  - "GNU coreutils(cat/dd/head/sort/tail)的fstat/lseek对管道FD返回EACCES，需用~/tmp/toolbox-wrap/中toybox符号链接替代"
  - "config.guess无法识别HarmonyOS平台(E007)，用patch-autotools-ohos.pl修补使其输出aarch64-unknown-linux-ohos"
  - "make check测试程序需要Linux内核头文件(linux/pkt_sched.h等)，HarmonyOS SDK缺失这些头文件导致测试编译失败"

