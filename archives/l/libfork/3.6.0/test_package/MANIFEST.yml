# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libfork/3.6.0
homepage: "https://github.com/ConorWilliams/libfork"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libfork 的完整 Catch2 测试套件需要 Catch2（ohpcd registry 无此配方，
# 无法在 OHOS 工具链构建）；已用上游 single_header 自检
# (test/single_header/main.cpp, fib(10)==55) 作为等价上游测试，
# 用 OHOS clang 15 编译并在 aarch64 本机原生执行通过。
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/single_header/main.cpp
    source: libfork-3.6.0/test/single_header/main.cpp
    description: "单头文件自检: lazy_pool 上 fib(10)==55 (fork/call/join + 协程)"
    command: "./fib_check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libfork.cpp
    description: "消费者测试: 通过安装头文件编译 fib(10)==55 + 空 range fold 返回 nullopt"
    command: "./test_libfork"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
