# 编译中学到的知识
knowledge_gained:
  - "OHOS 定制 libcxx（libcxx-ohos, _LIBCPP_VERSION 15004）不提供 <source_location> 头文件，且 __cpp_lib_source_location/__cpp_lib_syncbuf 特性宏被注释禁用"
  - "OHOS libc++ 以 _LIBCPP_HAS_NO_INCOMPLETE_RANGES 禁用部分 ranges 算法（shuffle/max_element/destroy/uninitialized_default_construct_n/empty/fold），头文件存在但符号未导出"
  - "兼容方案：用 __has_include + 特性宏做能力探测回退（source_location → 内部占位类型；ranges 算法 → 经典算法替代），不引入平台宏"
  - "libfork 3.6.0 为 header-only C++23 协程库，需在配方中禁用可选依赖 hwloc/Boost.atomic（LF_NO_HWLOC/LF_NO_BOOST_ATOMIC）以保持零依赖"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/libfork-3.6.0.orig
  source_work_dir: /storage/Users/currentUser/builds/libfork-3.6.0.work
  source_orig_hash: 21045fcfbefec202
  source_work_hash: d06d7bf1cd90bcf3
  generated_at: '2026-09-03T06:57:46'
  patches_count: 6

patch_classification:
  - file: 0001-include-libfork-algorithm-fold.hpp.patch
    type: portability
    platform_only: True
    guard: 'ranges empty -> ranges size（OHOS incomplete ranges）'
  - file: 0002-include-libfork-core-co_alloc.hpp.patch
    type: portability
    platform_only: True
    guard: 'ranges destroy -> std::destroy（OHOS incomplete ranges）'
  - file: 0003-include-libfork-core-impl-awaitables.hpp.patch
    type: portability
    platform_only: True
    guard: 'ranges uninitialized_default_construct_n -> 经典版本'
  - file: 0004-include-libfork-core-impl-utility.hpp.patch
    type: portability
    platform_only: True
    guard: '__has_include 能力探测回退 source_location，无平台宏'
  - file: 0005-include-libfork-schedule-impl-numa_context.hpp.patch
    type: portability
    platform_only: True
    guard: 'ranges shuffle -> std::shuffle'
  - file: 0006-include-libfork-schedule-lazy_pool.hpp.patch
    type: portability
