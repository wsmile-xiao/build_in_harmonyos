# 版本级 manifest
# 文件位置: archives/l/libopenaptx/0.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.0"

# 软件名
software: "libopenaptx"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/pali/libopenaptx/archive/refs/tags/0.2.0.tar.gz"

  # 源码校验和
  sha256: "cca8b6d82d2256369b314855b3496ac2f0029adbc0adb66c770c0bf38c2c2cfc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "AR=llvm-ar"
    - "install PREFIX=<package_folder>"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libopenaptx API 契约：输入 24bit 有符号立体声原始流（24 字节/帧 = LLLRRR×4），
     aptX 4:1、aptX HD 3:1；编码器滞留最后 90 样本（取整到 92 = 23 帧），需 aptx_encode_finish() 冲刷"
  - "设备无法直连 github.com 时：Windows 侧经 codeload.github.com 下载官方 tag tarball
     （与 archive URL 同字节），scp 到设备后按内容 sha256 预置共享 dlcache 并登记官方 URL sidecar"
