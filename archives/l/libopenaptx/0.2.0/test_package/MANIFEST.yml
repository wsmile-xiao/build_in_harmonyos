# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libopenaptx/0.2.0
homepage: "https://github.com/pali/libopenaptx"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# 上游 Makefile 无 test/check 目标，也无注册测试程序（N_static = 0）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游（pali/libopenaptx tag 0.2.0）未提供自动化测试：Makefile 只有
# all/clean/install/uninstall 目标，仓库内无任何测试注册入口
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.c"
    description: "消费者测试：编译链接打包库并调用 aptx_init/encode/decode API，断言 4:1 编码比、确定性、23 帧延迟契约与往返保真度"
    command: "./test_libopenaptx"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
