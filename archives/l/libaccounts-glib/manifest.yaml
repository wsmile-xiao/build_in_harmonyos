software: libaccounts-glib
display: "libaccounts-glib"
description: "GLib-based library for managing online account information (accounts-sso project)"
category: system
homepage: "https://gitlab.com/accounts-sso/libaccounts-glib"
license: LGPL-2.1
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "GObject Introspection 需禁用（gobject-introspection 未预装）"
    - "文档生成需禁用（gtkdoc-scan 未预装）"
    - "命令行工具可能因 libintl 链接问题无法编译"
  common_dependencies:
    - glib
    - libxml2
    - sqlite3

# 版本索引
versions:
  "1.27":
    status: published
    build_date: "2026-05-29"