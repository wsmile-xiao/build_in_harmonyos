software: libpg_query
build_system: makefile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/17-6.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "17-6.2.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/pganalyze/libpg_query/tar.gz/17-6.2.2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile

  # 配置选项列表（Makefile 项目无 configure，使用 make build）
  configure_options:
    - "make build"

  # 编译依赖列表
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "构建系统实际为 makefile，非 JSON 标注的 autotools"
  - "lld 链接器缺少 libxml2.so.16，需使用 make build 只编译静态库"
  - "codeload.github.com 可替代 GitHub 直接下载 URL"
  - "链接测试程序需使用 -fuse-ld=bfd 规避 lld 问题"
  - "ELF 签名使用 binary-sign-tool sign -inFile -outFile -selfSign 1"