sources:
  url: "https://codeload.github.com/pganalyze/libpg_query/tar.gz/18.0.0"
  filename: "libpg_query-18.0.0.tar.gz"
  sha256: "6ad7783f272acfd116455c66a03298a0cac9a9168281df547969219112f0260f"

patches:
  - patch_file: "patches/0001-pg_config-undef-SVE.patch"
    patch_description: >-
      Undef USE_SVE_POPCNT_WITH_RUNTIME_CHECK in pg_config.h because
      OHOS clang 15's arm_sve.h requires -march=...+sve to be included.
    patch_type: "portability"
  - patch_file: "patches/0002-pg_popcount-aarch64-fill-NEON.patch"
    patch_description: >-
      Fill in pg_popcount_neon() and pg_popcount_masked_neon() function
      bodies that were stripped during extract_source. Uses __builtin_popcountl
      scalar fallback since NEON intrinsics have type issues under OHOS clang.
    patch_type: "portability"
