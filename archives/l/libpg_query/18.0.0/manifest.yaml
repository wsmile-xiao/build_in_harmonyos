# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "构建系统为纯 GNU Makefile，make build 只产静态库 libpg_query.a"
  - "OHOS clang 15 需要 undef USE_SVE_POPCNT_WITH_RUNTIME_CHECK 避免 arm_sve.h 报错"
  - "extract_source.rb 剥离了 NEON 函数体，需补实 pg_popcount_neon/pg_popcount_masked_neon"
  - "18.0.0 不需要 -fuse-ld=bfd（SDK 已修复 libxml2.so.16 问题）"
  - "protobuf-c/xxhash/PostgreSQL 解析器全部内嵌，0 运行期依赖"
  - "codeload.github.com 替代 github.com 直连下载"
  - "17 个上游测试二进制 54,805 用例 100% 通过"
  - "concurrency 500 线程在 OHOS musl 偶发 SIGABRT，降到 100 线程后稳定"
