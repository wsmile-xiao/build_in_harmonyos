# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lzham/1.0-stable1
homepage: "https://github.com/richgel999/lzham_codec"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（唯一用户测试程序 lzhamtest，c/d/a 三模式 + 全选项）
upstream_tests:
  - file: lzhamtest/lzhamtest.cpp
    source: lzham-1.0-stable1/lzhamtest/lzhamtest.cpp
    description: "LZHAM 官方命令行测试程序（压缩/解压/递归/校验模式，全级别 m0-m4 与全选项）"
    command: "./lzhamtest -v -m4 -d15 c <input> <out.lzham>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证：压缩->解压->字节级比对 + adler32 校验，含 __OHOS__ 平台分支"
    command: "./test_lzham"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
