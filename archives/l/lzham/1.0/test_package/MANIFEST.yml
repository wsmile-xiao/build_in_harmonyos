package: lzham/1.0
homepage: "https://github.com/richgel999/lzham_codec"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -R lzham_upstream_smoke"

upstream_tests:
  - file: lzhamtest/lzhamtest.cpp
    source: lzham_codec-1_0_release/lzhamtest/lzhamtest.cpp
    description: "上游内存压缩/解压缩冒烟测试，覆盖 lzham 压缩和解压 API"
    command: "lzhamtest"

test_package_tests:
  - file: test_lzham.c
    description: "消费者通过公开 zlib 风格 API 压缩、解压并逐字节检查 64 KiB 数据往返"
    command: "./test_lzham"
  - file: test_ohos.c
    description: "OHOS 专项消费者：确认 OHOS/Linux 编译目标并覆盖 16 字节对齐边界附近的压缩、解压和内部重分配路径"
    command: "./test_lzham_ohos"
    platform: OHOS

assertion_count: 14
