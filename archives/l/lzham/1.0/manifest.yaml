software: lzham
version: "1.0"
status: built
build_date: "2026-09-10"
conan_ref: "lzham/1.0"
build_system: cmake

source:
  url: "https://github.com/richgel999/lzham_codec/archive/refs/tags/v1_0_release.tar.gz"
  sha256: "41568ecb0746b769b49704594bdcea98d1e3d605cabd2fc225e72edb508837c3"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DLZHAM_BUILD_TESTS=ON"
    - "-DLZHAM_ANSI_CPLUSPLUS=1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-install-and-ansi-path.patch"
  - "0002-ohos-stdint-limits.patch"
  - "0003-ohos-aligned-allocation.patch"
  - "0004-ohos-aligned-malloc.patch"
  - "0005-ohos-aligned-realloc.patch"

knowledge_gained:
  - "上游 v1_0_release 的原始 CMake 没有安装规则且内部目标存在自链接，需由补丁整理为单一 lzham 目标"  # reference: patches/0001-cmake-install-and-ansi-path.patch
  - "上游 lzham_core.h 提供 ANSI C/C++ 路径，适合 OHOS aarch64 的无线程构建；设备 Conan profile 使用 C++17 与 libc++"  # reference: conanfile.py, notes.md
  - "OHOS SDK 的 stdint.h 定义了与上游命名空间常量同名的 INT/UINT limit 宏，补丁在 Linux/OHOS 路径解除这些宏"  # reference: patches/0002-ohos-stdint-limits.patch
  - "OHOS 默认 malloc 对小块分配未始终满足 LZHAM 的 16 字节最低对齐要求，补丁使用 posix_memalign 并实现对齐 realloc"  # reference: patches/0003-ohos-aligned-allocation.patch
  - "设备验证使用 AtomGit fork 的独立稀疏 worktree；旧 GitCode remote-curl bad line length 仅是初始化故障，不能替代当前 SHA 的验证证据"  # reference: notes.md#设备验证结果
