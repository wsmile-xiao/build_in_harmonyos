# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lurlparser/1.1
homepage: "https://github.com/corporateshark/LUrlParser"

# 上游测试命令 (test/makefile 的 all target；原始命令需 gtest，编译入口由配方补丁管理)
upstream_check_command: "make tests && ./tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest -R lurlparser_tests (with_tests=True, gtest/1.17.0)"

# 上游实际运行的测试程序（8 个 TEST_F 用例，经补丁 0002 移植到 release-1.1 API）
upstream_tests:
  - file: test/test.cpp
    source: LUrlParser-release-1.1/test/test.cpp
    description: "上游 gtest 测试套：example/cases/ipv6/ipv4/parens/trailingdot/specialchars/escapechars 共 8 个 TEST_F 用例（controlchars 上游注释保留），经 patches/0002 由已移除的 clParseURL/m_* API 移植到 release-1.1 ParseURL/scheme_* API"
    command: "./lurlparser_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅经公开头 LUrlParser.h 与公开 API 解析带 user:password/port/query/fragment 的完整 URL 并核验全部字段 + getPort"
    command: "./test_lurlparser"
  - file: ohos_test.cpp
    description: "鸿蒙专项测试：-Werror 严格编译 + IPv6 主机名解析 + getPort 端口边界 (0/65535/65536) + authority-only URL"
    command: "./test_lurlparser_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
