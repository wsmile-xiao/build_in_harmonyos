software: libfm-extra
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://deb.debian.org/debian/pool/main/libf/libfm/libfm_1.3.2.orig.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--with-extra-only"
    - "--disable-nls"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib-2.0"
    - "libintl"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 手动修改 configure 和 config.status（见 notes.md）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 上 config.status 临时目录创建失败，需使用 /storage/Users/currentUser/tmp"
  - "autotools XML::Parser perl 模块检查需跳过"
  - "glib 需要正确链接 libintl（g_libintl_* 符号）"
