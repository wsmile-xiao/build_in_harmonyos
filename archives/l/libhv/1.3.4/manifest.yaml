# 版本级 manifest — libhv/1.3.4（第一轮 R01 适配）
# 遵循 ARCHIVE-SPEC v2.0

version: "1.3.4"
software: "libhv"

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-09-02"
build_system: "cmake"

source:
  url: "https://github.com/ithewei/libhv/archive/refs/tags/v1.3.4.tar.gz"
  sha256: "f0a9a197f90da55cc3ff104f9c7a27cc927f117b6c18613c3292726068588e10"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED=ON"
    - "-DBUILD_STATIC=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_UNITTEST=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libhv 1.3.4 主构建系统为 CMake（上游同时提供自定义 configure bash 脚本，非 GNU autoconf，conan 配方应使用 CMake 模板）"
  - "libhv 无系统同名库冲突：目标库名 hv/hv_static，头文件安装在 include/hv/，消费者 include 路径应为 include/ 而非 include/hv/"
  - "libhv CMake 提供 install(EXPORT libhvConfig)，conan package_info 的 cmake_file_name 用 libhv 与之对齐"
