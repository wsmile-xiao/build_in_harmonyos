# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libhv/1.3.4
homepage: "https://github.com/ithewei/libhv"

# 上游测试命令 (libhv 以 CMake 为主构建；make check 无注册目标，见测试台账)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（独立上游用例，完整台账见任务回报 test_ledger）
# 通过数/发现数 = 35/38 (92.1%)；3 项不可运行：ping(ICMP raw socket 平台限制)、
# ftp/sendmail(需外部 FTP/SMTP 服务)
upstream_tests:
  - file: unittest/base64_test.c
    source: libhv-1.3.4/unittest/base64_test.c
    description: "base64 encode/decode 往返 (PASS)"
    command: "./base64 infile outfile"
  - file: unittest/md5_test.c
    source: libhv-1.3.4/unittest/md5_test.c
    description: "md5 已知答案 (PASS)"
    command: "./md5 -s hello"
  - file: unittest/sha1_test.c
    source: libhv-1.3.4/unittest/sha1_test.c
    description: "sha1 已知答案 (PASS)"
    command: "./sha1 -s hello"
  - file: unittest/hatomic_test.c
    source: libhv-1.3.4/unittest/hatomic_test.c
    description: "原子操作 (PASS)"
    command: "./hatomic_test"
  - file: unittest/hmutex_test.c
    source: libhv-1.3.4/unittest/hmutex_test.c
    description: "互斥锁/读写锁/递归锁 (PASS)"
    command: "./hmutex_test"
  - file: unittest/hstring_test.cpp
    source: libhv-1.3.4/unittest/hstring_test.cpp
    description: "字符串工具 split/toupper/trim (PASS)"
    command: "./hstring_test"
  - file: unittest/hpath_test.cpp
    source: libhv-1.3.4/unittest/hpath_test.cpp
    description: "路径解析 basename/dirname (PASS)"
    command: "./hpath_test"
  - file: unittest/hurl_test.cpp
    source: libhv-1.3.4/unittest/hurl_test.cpp
    description: "URL 编解码 (PASS)"
    command: "./hurl_test"
  - file: unittest/socketpair_test.c
    source: libhv-1.3.4/unittest/socketpair_test.c
    description: "socketpair 双向收发 (PASS)"
    command: "./socketpair_test"
  - file: evpp/EventLoop_test.cpp
    source: libhv-1.3.4/evpp/EventLoop_test.cpp
    description: "事件循环 runInLoop/queueInLoop (PASS)"
    command: "./EventLoop_test"

# test_package 中自带的测试 (消费者视角验证, 真实调用 libhv C API)
test_package_tests:
  - file: test.c
    description: "消费者测试: base64/md5/hbase 真实 API 调用 + 断言"
    command: "./test_libhv"

# 测试断言总数 (近似值, 消费者测试 6 断言 + 上游用例每项断言)
assertion_count: 6
