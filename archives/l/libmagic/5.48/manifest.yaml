software: libmagic
# 版本级 manifest
version: "5.48"
status: built
build_date: "2026-09-02"
build_system: autotools

source:
  url: "https://astron.com/pub/file/file-5.48.tar.gz"
  sha256: "ed14656883b23a364b4057c05595d93252da9bc473d30106519519d0da141283"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-zlib --disable-bzlib --disable-xzlib --disable-zstdlib"
    - "--disable-lzlib --disable-lrziplib --disable-libseccomp"
  dependencies: []
  cc: clang
  # 上游 5.48 无 CMakeLists.txt / test 框架脚本，正式测试是 automake
  # check-local（make check），在 conanfile.py build() 内执行。

upstream_tests:
  framework: "automake check-local (make check)"
  command: "make check"
  total: 83
  passed: 83
  failed: 0
  skipped: 0

patches_applied: []

knowledge_gained:
  - "HMFS umask 077 quirk：configure 生成的 config.status 用 `umask 077 && mktemp -d` 创建的临时目录在 setgid 父目录下无法写入（Permission denied），仓库判例是 sed 替换 umask 077→0"
  - "交叉模式下 magic.mgc 由 FILE_COMPILE（系统 PATH 上的 file）在构建期编译，版本检查必失败；用带路径的 FILE_COMPILE=$PWD/src/file 覆盖（含 '/' 跳过版本检查），构建宿主即 HarmonyOS AArch64 可直接运行 target file(1)"

compiled_tools:
  - name: "file"
    status: "success"
  - name: "libmagic"
    status: "success"
    static: "libmagic.a"
  - name: "magic.mgc"
    status: "success"
    note: "架构无关的版本化数据库，安装到 share/misc/magic.mgc"
