package: libgclib
version: "0.12.8"
homepage: "https://github.com/gpertea/gclib"
license: MIT
status: built
build_system: "manual (上游 Makefile 只提供 `all: htest`，没有库目标也没有 install 规则)"
build_date: "2026-09-20"

source:
  url: "https://github.com/gpertea/gclib/archive/refs/tags/v0.12.8.tar.gz"
  sha256: "a8dea4d273d6802f77f26a5394b1d66dfc1aba46a725c61e4c7399b756fb75e3"
  notes: "tag 带 v 前缀；解出目录 gclib-0.12.8，配方 strip_root=True 拉平。默认分支 master 与 v0.12.8 的文件集逐条相同（57 个条目，已用 GitHub contents API 复核）。"

build:
  system: manual
  source_flags: "-std=c++11 -D_REENTRANT -fno-exceptions -fno-rtti -O2"
  fpic: "-fPIC"
  compiled_tus: 16
  link:
    shared: "clang++ -shared -pthread -Wl,-soname,libgclib.so"
    static: "llvm-ar rcs"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游没有『库』这个产物：仓库根只有一份手写 Makefile，`all: htest` 只编出基准程序，`OBJS := GBase.o GStr.o GArgs.o GResUsage.o` 是给下游把 .o 直接链进自己程序用的用法。既没有库目标（无 .so/.a 规则）也没有 install 规则，因此『库的边界』必须由本配方自己定义。GFFread/StringTie 等下游正是把这些 .o 直接链进自己的可执行文件。"
  - "release tarball 编不全：22 个 .cpp 里 GBam.cpp 需要 htslib 的 kstring.h/sam.h/bam.h、gdimg.cpp 需要 libgd 的 gd.h、gff.cpp 需要 boost 的 boost/crc.hpp —— 三者都不随包发布、也没有任何 pkg-config/CMake 探测。另 htest.cpp/mdtest.cpp/gtest.cpp 带 main()。本配方只编译剩下的 16 个库翻译单元。"
  - "发运集合 = 已编译 TU 的 quoted-include 闭包（24 个头文件）。因此每个被发运的头都在 build() 里被真实编译过，不存在『发运了却编不过』的头。被排除的 6 个（GBam.h/gdimg.h/gff.h/GBitVec.h/GIntHash.hh/GIntervalTree.hh）连同理由写在 notes.md。注意 `#include \"config.h\"`（GBase.h，受 HAVE_CONFIG_H 守卫）、`<config.h>`（GArgs.h，同一守卫）、`\"windows.h\"`/`\"psapi.h\"`（proc_mem.cpp，受 _WIN32 守卫）在源码树里并不存在；它们全部被预处理守卫挡住，所以不构成依赖。"
  - "ENABLE_COMPRESSION 默认关闭（上游 Makefile 未定义）→ GCdbYank.h 的 <zlib.h> 与整个 GCdbZFasta 类都不参与编译。因此 libgclib 在本配置下**零第三方依赖**（上游 Makefile 的 LIBS := -lz 是为了给 gff.cpp/GBam.cpp 用的）。"
  - "上游全库零 throw、零 dynamic_cast/typeid，所以 BASEFLAGS 里的 -fno-exceptions -fno-rtti 只影响异常表与 RTTI 元数据的生成，不影响行为。唯一的 `noexcept` 在 GList.hh:375（GList 的移动构造模板），模板在消费者侧实例化，故 -std=c++11 编出的 .so 可以被 -std=c++17 的消费者正常链接——见 test_package 的 c++11/c++17 双跑。"
  - "库在加载期的隐式初始化：gdna.cpp 有 `static bool gdna_Ready=gDnaInit();`、codons.cpp 有 `static bool isCodonTableReady=codonTableInit();` —— 两张 256 项碱基表与 32K 密码子表都靠命名空间级静态初始化（.init_array）在库被映射时建好。消费者**从不显式调用** gDnaInit()/codonTableInit()，这一点由 rule12 鸿蒙特有测试用 dlopen+dlsym 直接验证。"
  - "proc_mem.cpp 的平台分支是 __APPLE__ / (_WIN32||_WIN64) / `#else //assume Linux` —— OHOS 落进最后一个分支，读 /proc/self/stat 并用 musl 的 sysconf(_SC_PAGE_SIZE) 换算，故 /proc 必须已挂载。"
  - "GList<OBJ>::Add(OBJ*) 的非有序实现（GList.hh:495-512）是 `this->fList[result]=item;` —— 原样存指针，不拷贝；而默认构造 GList(GCompareProc* =nullptr) 会把 fFreeProc 设成 DefaultFreeProc，于是 Clear()/析构会对每个元素 `delete`。把栈对象的地址 Add 进去会造成堆破坏。对照 GVec<OBJ>::Add(OBJ*) 是 `fArray[fCount] = *item;` 真拷贝（值语义），两者语义不同，消费者容易踩错。"
  - "translateCodon 的终止密码子返回 '.'（codonData 里 'T','A','A','.'），不是 '+' 或 '*'；translateDNA 返回的串由 GMALLOC 分配（malloc/free 配对）。"

upstream_tests:
  command: "(none — 上游无测试)"
  registrations: 0
  test_count: 0
  executed: 0
  not_executed: 0
  notes: "rule4 口径：仓库没有 test/ 目录、没有 CI 配置、没有发行版测试脚本；对默认分支 master 扫描 ^TEST( / ^TEST_F( / BOOST_AUTO_TEST_CASE / ctest / meson test / make check 的命中数均为 0。朴素扫描 `assert(` 会得到 8 处命中，但逐条核验后全部不是可执行用例：gff.cpp 3 处是被注释掉的 //assert(...)（且 gff.cpp 因缺 boost/crc.hpp 不参与编译）、xxhash.h 1 处是 `#define XXH_ASSERT(c) assert(c)` 宏定义、GHashMap.hh 4 处是编译期 static_assert。故上游测试数如实为 0。"

test_package:
  assertion_count: 104
  files:
    - test_libgclib.cpp
    - test_ohos_gclib.cpp
  description: "test_libgclib.cpp 是消费者契约（83 条 / 6 组，按 -std=c++11 与 -std=c++17 各编译并运行一次）；test_ohos_gclib.cpp 是鸿蒙特有测试（21 条 / 2 个场景，不链接 libgclib，全部入口经 dlopen+dlsym）。合计 104 条断言。见 test_package/MANIFEST.yml。"

ci:
  profile: ci/conan/profiles/ohos-aarch64
  package_type: library
  shared_default: true
