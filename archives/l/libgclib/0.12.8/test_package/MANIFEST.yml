# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游 gclib **没有任何测试**：仓库根只有一份手写 Makefile（`all: htest`），
# 没有 test/ 目录、没有 CI 配置、没有发行版测试脚本。默认分支 master 与
# v0.12.8 的文件集逐条相同（57 个条目，已用 GitHub contents API 复核），
# 其中 3 个带 main() 的文件（htest.cpp / mdtest.cpp / gtest.cpp）是手工演示
# 程序，不是测试用例（见 notes.md 第 1 节）。因此本包的上游测试数为 0，
# 全部测试覆盖由 test_package 提供。

package: libgclib/0.12.8
homepage: "https://github.com/gpertea/gclib"

# 上游没有测试入口；build() 只做编译，不执行任何上游测试
upstream_check_command: "(none — 上游无测试)"
upstream_test_in_build: false
upstream_test_command: "(none — 上游无测试)"

# 上游注册的测试用例：0
# 说明（rule4 口径自证）：对上游 master 做朴素文本扫描可能得到 8 处 assert 命中，
# 但每一处都不是可执行的测试用例，故上游测试数如实为 0：
#   - gff.cpp      3 处：//assert(parent); //assert(newgfo); //assert(s <= unsplicedlen);
#                        全部位于注释中，且 gff.cpp 因缺 boost/crc.hpp 不参与编译
#   - xxhash.h     1 处：#define XXH_ASSERT(c) assert(c)  宏定义，非用例
#   - GHashMap.hh  4 处：static_assert(std::is_trivial<K>::value, ...)  编译期类型检查，非用例
# TEST() / TEST_F() / BOOST_AUTO_TEST_CASE() / ctest / meson test / make check 的
# 命中数均为 0。
upstream_tests: []

# ---- test_package 自带的测试（消费者视角） ----
test_package_tests:
  - file: test_libgclib.cpp
    description: >
      消费者契约，83 条断言 / 6 组：
      (A) 发运头文件集与数据模型 —— 24 个已发运头全部单独包含（其中
          GapAssem.h / GHash.hh 两件因与 GHashMap.hh 同名不同签名的
          `class GHash` 互斥，装在 test_hdr_cluster_b.cpp 里，见下），
          GCLIB_VERSION 与包版本一致，OHOS PC 的 LP64 宽（void*/long/off_t/int64 均为 8 字节）；
      (B) GStr —— length/is_empty/count/index/rindex/startsWith/endsWith/contains/
          substr/upper/lower/asInt/asReal/split/splitr；
      (C) GArgs —— 以 argv={prog,-h,-n,42,input.txt,extra} 配格式串 "hQCn:" 验
          证 isError/getCount/getNonOptCount/getOpt/startNonOpt/nextNonOpt/startOpt；
      (D) gdna/codons —— 不显式初始化的互补表与密码子表（ntComplement/
          reverseComplement/translateCodon/translateDNA）；
      (E) GVec/GList —— 值容器与指针容器的 Add/Count/Get/First/Last/Clear 语义；
      (F) FASTA 写-读往还（writeFasta + GFastaFile::readSeq），并断言临时目录按
          $TMPDIR → $HOME → "." 解析（鸿蒙特有场景 #3）。
      同一份源码按 -std=c++11（上游 Makefile 的 BASEFLAGS）与 -std=c++17（OHOS
      profile 的 compiler.cppstd）各编译一次、各运行一次，两次都必须链接成功且
      83 条断言全绿。
    command: "./test_libgclib_cxx11 && ./test_libgclib_cxx17"
  - file: test_hdr_cluster_b.cpp
    description: >
      发运头文件集的第二个编译簇（GapAssem.h / GHash.hh），**无断言**：
      上游有两个同名不同签名的 `class GHash` —— GHash.hh 的是
      `template <class OBJ>`（char* 键），GHashMap.hh 的是
      `template <class V, class Hash, class Eq, typename khInt_t>`；
      而 GFastaIndex.h → GHashMap.hh、GapAssem.h → GHash.hh，故两簇
      不可能共处一个 TU（`too few template parameters in template
      redeclaration`）。本 TU 与 test_libgclib.cpp 链接成同一个可执行
      文件，存在的意义与那 22 个 `#include` 相同 —— 能编译、能链接即
      证明该簇自洽且其外部符号（strhash/GMALLOC/GFREE/GError）由
      libgclib 导出。因此不影响 83 条断言的计数。
    command: "(由 ./test_libgclib_cxx11 与 ./test_libgclib_cxx17 一并编译链接，无独立命令)"
  - file: test_ohos_gclib.cpp
    description: >
      鸿蒙特有测试（2 个场景 / 21 条断言，详见下方 ohos_specific_tests）。
      不链接 libgclib：所有入口都经 dlopen + dlsym 取得，因此「符号被导出」
      「加载器能解析」「静态初始化已执行」三件事是真的被测到。
    command: "./test_ohos_gclib <package>/lib/libgclib.so"

# 鸿蒙特有测试条数 (rule12)
ohos_specific_tests:
  count: 3
  entries:
    - "test_ohos_gclib:平台 ABI 契约 —— libgclib.so 为 ELFCLASS64/EM_AARCH64；DT_NEEDED 链 musl \"libc.so\"（非 glibc \"libc.so.6\"）与 \"libc++_shared.so\"（无 libstdc++.so.6）；动态串表导出 ntComplement/translateCodon；OHOS 加载器 dlopen(RTLD_NOW|RTLD_LOCAL) 成功且 dlsym 可解析三个入口"
    - "test_ohos_gclib:运行时契约 —— /proc/self/stat 可读且 get_mem_usage() 返回非零 vm/rss（证明 OHOS 走 proc_mem.cpp 的 `#else //assume Linux` 分支、musl sysconf(_SC_PAGE_SIZE) 可用）；ntComplement/translateCodon 在**从未显式调用** gDnaInit()/codonTableInit() 的情况下即正确工作（证明 gdna.cpp/codons.cpp 的命名空间级静态初始化随 dlopen 映射阶段执行）"
    - "test_libgclib:只读根文件系统 —— 临时目录按 $TMPDIR → $HOME → \".\" 解析并断言可写，不写死 /tmp 或 /var/tmp；FASTA 写-读整条链路在该目录下完成"
  command: "./test_ohos_gclib <package>/lib/libgclib.so && ./test_libgclib_cxx11"
  result: "3/3 passed"

# 测试断言总数（本次实测执行：83 + 21 = 104 条；其中 83 条因 c++11/c++17 各跑一遍
# 共执行 166 次）
assertion_count: 104
