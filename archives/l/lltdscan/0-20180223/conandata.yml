# conandata.yml — lltdscan 0-20180223
#
# Upstream (https://github.com/zed-0xff/lltdscan) has NO tags and NO releases:
# `git ls-remote --tags` is empty and the commit history stops at
# 258dbb1c7f8672c09a4a578fc17dada524c3eabb (2013-02-04, "Merge pull request #2
# from grawity/source-addr"). The AUR package is therefore named lltdscan-git.
# `0-20180223` is the version label assigned by competition platform task #8518,
# not an upstream release string.
#
# The archive URL below is the OFFICIAL GitHub-generated tarball for the exact
# pinned commit (not a mirror, and not a floating branch head that can drift).
# Verified: HTTP 200, 6209 bytes,
# sha256 = 678b4813d8ad0d33059797ce16614e8065bcd6ecd7658221967a8aee866f4108
#
# Two independent official routes were byte-compared and agree on that hash
# (note: do not end a comment line with the bare word "sha256" followed by a
#  colon — the L0b pre-commit regex reads it as an empty sha256 field):
#   https://codeload.github.com/zed-0xff/lltdscan/tar.gz/258dbb1c7f8672c09a4a578fc17dada524c3eabb
#   https://github.com/zed-0xff/lltdscan/archive/258dbb1c7f8672c09a4a578fc17dada524c3eabb.tar.gz
#
# Note the hash differs from the floating `refs/heads/master` archive
# (6aafc7a3183e4a6aa71a51a06c6c4cddc2227dc10f1d488e9d8702d47f58737b, 6206 bytes)
# ONLY because the tar root directory is named `lltdscan-<sha>` instead of
# `lltdscan-master` (6209 vs 6206 bytes). Every extracted file hashes
# identically between the two archives (verified per-file), i.e. the content is
# the same commit; only the archive envelope differs.
#
# No patches: the upstream Makefile link line already goes through $(CC), so the
# Conan toolchain compiler is honored without touching the source. The hardcoded
# /usr/local + /opt/csw include/library paths in CFLAGS2/LDFLAGS2 are overridden
# on the make command line instead. See notes.md §4.

sources:
  url: "https://codeload.github.com/zed-0xff/lltdscan/tar.gz/258dbb1c7f8672c09a4a578fc17dada524c3eabb"
  # The commit-SHA URL has no file extension, so conan get() cannot infer the
  # archive type and falls back to zip (BadZipFile). Declaring the filename
  # explicitly tells it this is a .tar.gz (abbtr/1.0.4 + accel-config/4.1.9
  # precedent for the same codeload layout).
  filename: "lltdscan-258dbb1c7f8672c09a4a578fc17dada524c3eabb.tar.gz"
  sha256: "678b4813d8ad0d33059797ce16614e8065bcd6ecd7658221967a8aee866f4108"