# 版本级 manifest — lltdscan 0-20180223
# 遵循 ARCHIVE-SPEC v2.0

# 必须字段
version: "0-20180223"
software: "lltdscan"
status: built
build_date: "2026-10-05"
build_system: "makefile"

# 源码信息
# 注意: 上游 zed-0xff/lltdscan 没有任何 tag/release (git 历史止于 2013-02-04),
# `0-20180223` 是赛事平台任务 #8518 指定的版本号, 不是上游发布号。
# URL 固定到上游 master HEAD 的 commit SHA, 保证可复现。
source:
  url: "https://codeload.github.com/zed-0xff/lltdscan/tar.gz/258dbb1c7f8672c09a4a578fc17dada524c3eabb"
  sha256: "678b4813d8ad0d33059797ce16614e8065bcd6ecd7658221967a8aee866f4108"
  tar_format: tar.gz
  upstream_commit: "258dbb1c7f8672c09a4a578fc17dada524c3eabb"
  upstream_commit_date: "2013-02-04"

# 构建配置
build:
  system: makefile
  configure_options: []
  dependencies:
    - "libpcap/1.10.6"
    - "libnet/1.2"
  cc: clang
  cxx: clang++

# 补丁信息
# 无需任何源码补丁: 上游 Makefile 的链接行本就使用 $(CC) 变量
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "上游 lltdscan 完全没有 tag/release, 版本号只能由赛事平台指定; 用 commit SHA 形式的 codeload 归档 URL 固定源码可复现"
  - "GitHub 的 commit-SHA 归档与 refs/heads/master 归档 sha256 不同 (根目录名不同导致 tar 长度差 3 字节), 但逐文件 sha256 完全一致; 校验时别把两者混用"
  - "手写 Makefile 里 CFLAGS2/LDFLAGS2 指向 /usr/local、/usr/include/pcap、/opt/csw (arping/Solaris 遗留), 用 make 命令行传同名变量即可整体覆盖, 不必改源码"
  - "该 Makefile 链接行已用 $(CC), 与 cdpr/2.4 不同 —— 无需 0001 编译器变量补丁"
  - "二层抓包工具的 test_package 只能覆盖开 socket 之前就返回的命令行路径 (-h/非法选项/参数校验); 真实抓包需混杂模式+root+对端 LLTD responder, CI 无法复现"
  - "make -j1 是必须的 (HMDFS jobserver FIFO EPERM, E074)"

patch_generation:
  method: none
  patches_count: 0