# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lltdscan/0-20180223
homepage: "https://github.com/zed-0xff/lltdscan"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: zed-0xff/lltdscan master HEAD 258dbb1c7f86 的官方归档,
# sha256 678b4813d8ad0d33059797ce16614e8065bcd6ecd7658221967a8aee866f4108)
upstream_test_audit:
  source_tarball: "lltdscan-258dbb1c7f8672c09a4a578fc17dada524c3eabb.tar.gz"
  source_sha256: "678b4813d8ad0d33059797ce16614e8065bcd6ecd7658221967a8aee866f4108"
  top_level_files:
    - Makefile          # 仅 all/lltdscan/clean/doc/install/dist 目标, 无 check/test/TESTS 目标
    - README            # 使用说明与示例输出, 无测试内容
    - lltdscan.c        # 主程序 (getopt 解析 + libnet 构造帧 + pcap 收包), 无 TEST()/TEST_F (gtest) / def test_ (pytest)
    - lltd.c            # LLTD TLV 解析实现, 被 lltdscan.c #include, 纯实现源非测试源
    - lltdscan.8        # man page
    - .gitignore       # 仅含 "lltdscan" (构建产物名)
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check / test / TESTS / check_PROGRAMS 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "configure.ac / CMakeLists.txt / meson.build 测试声明"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树仅 6 个文件, 无 tests/ 目录; find 未命中任何测试源文件; Makefile 无 check/test 目标; README 的 'EXAMPLES' 段是手工使用示例(需要真实 NIC 上的 LLTD 响应方), 不是自动化测试"
  make_check_output: "make check 无规则可执行 (No rule to make target 'check') — 上游未定义任何测试目标"
  reason: "lltdscan 为纯 CLI 二层抓包工具, 官方源码包不含任何测试套件: 无 tests/ 目录、无测试源文件、无 check/test 目标。README 的 EXAMPLES 需要网卡处于混杂模式且对端运行 LLTD responder, 无法在 CI 复现。功能验证由 test_package 真实执行 lltdscan 二进制完成, 覆盖全部在打开任何 socket 之前就返回的确定性命令行路径"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质执行被测包的二进制
test_package_tests:
  - file: test.sh
    description: "功能测试 5 例 / 20 断言: -h 用法横幅完整性与 exit 0; 未知选项 -Z 被拒; -t 缺参数被拒; 畸形 MAC 被拒; 两个尾随 MAC 打印用法并 exit 1"
    command: "bash test.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test.sh 并输出 HMBS 机器证据标记 (test_package discovered=5/passedCount=5 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test.sh 的 20 个真实断言: case1 = 1 exit + 1 非空 + 1 程序名 + 5 用法横幅 = 8;
# case2 = 1 exit + 1 报错 = 2; case3 = 1 exit + 1 报错 = 2;
# case4 = 1 exit + 1 报错 = 2; case5 = 1 exit + 5 用法横幅 = 6。合计 20)
assertion_count: 20