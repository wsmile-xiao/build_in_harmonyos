software: libcifpp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/10.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "10.0.4"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/PDB-REDO/libcifpp/archive/refs/tags/v10.0.4.tar.gz"

  # 源码校验和
  sha256: "4ef1386438b5032842c287b0629d5ffc4838d28fa91f384bdc57915dfca8fe9f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires:
  - "pcre2/10.45"
  - "fast_float/8.0.1"
  - "fmt/7.1.3"
  - "zlib/1.3.1"
  - "eigen/3.4.0"
  - "sqlite3/3.53.4"

# 构建配置选项
build_options:
  - "CMake C++20（上游声明 cxx_std_23 → patch 为 cxx_std_20，OHOS clang15 无 -std=c++23）"
  - "-D_LIBCPP_ENABLE_EXPERIMENTAL（恢复 libc++15 默认关闭的 std::ranges 算法）"
  - "std::format → fmt::format（libc++.so 无 format 符号，94 处机械替换）"
  - "CIFPP_DOWNLOAD_CCD=OFF / BUILD_TESTING=OFF"
  - "FindAtomic.cmake OHOS 强制 _CXX_ATOMIC_BUILTIN=1；key_element_type 补构造函数"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游测试**已实测**（2026-09-11）：**10/10 可执行文件全部通过**（112 个 test case，合计 5,209,054 条断言）。v10.0.4 的 test/ 目录含 13 个测试源文件、源码声明 120 个 TEST_CASE，CMake 注册 10 个测试可执行文件（unit-v2 / unit-3d / model / rename-compound / sugar / spinner / reconstruction / validate-pdbx / cql / matrix），并自带真实测试数据（1cbs-dssp.cif、brak.pdb、**rsrc/ccd-subset.cif**、**rsrc/mmcif_pdbx.dic** 等）。分项结果：unit-v2 100499 断言/60 用例、unit-3d 5093928/17、model 14331/9、cql 240/11、matrix 5/5、sugar 10/2、validate-pdbx 17/3、reconstruction 24/1、rename-compound 1 用例、spinner 3 用例。**此前声明「上游测试 0 运行」不准确**——当时仅因上游缺 Catch2 时会走 FetchContent 联网拉取而跳过，实际 ohpcd **已发布 catch2/3.8.1**（正满足上游 find_package(Catch2 3)），无需联网。实测复现需三处适配（**均不修改上游测试逻辑**）：① test/CMakeLists.txt 的 cxx_std_23 → cxx_std_20（根 CMakeLists 已由配方 patch，测试文件是**独立另一处**）；② 测试可执行文件需补链 libfmt.so（cifpp 对 fmt 为 PRIVATE 链接，替换为 fmt::format 后 libcifpp.a 引用 fmt 符号）；③ 运行需 `--data-dir <src>/test`。本配方构建仍设 BUILD_TESTING=OFF（避免引入 catch2 依赖与 5M 断言量级测试的耗时），上游测试结果以本地实测记录（复现命令见 test_package/MANIFEST.yml）。test_package 消费者探针（cif::file 构造）真实编译并运行，输出 libcifpp OK。"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libcifpp v10.0.4 上游声明 target_compile_features(cifpp PUBLIC cxx_std_23)，但实测源码未使用任何 C++23 独有特性（std::expected/print/to_underlying/byteswap/mdspan/flat_map/stacktrace 均为 0 处），ranges/format/concepts/<=> 全是 C++20——patch 为 cxx_std_20 即可编译（OHOS clang15 仅支持到 -std=c++2b，无 c++23）"
  - "OHOS libc++15 的 __config 默认定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES / _LIBCPP_HAS_NO_INCOMPLETE_FORMAT（在 !_LIBCPP_ENABLE_EXPERIMENTAL && !_LIBCPP_BUILDING_LIBRARY 时）；加 -D_LIBCPP_ENABLE_EXPERIMENTAL 可恢复 std::ranges 算法（实测编译+链接+运行通过，ranges 为 header-only 模板不依赖库符号）"
  - "std::format 无法用同一开关恢复：libc++.so 内 format_error 等符号计数为 0（llvm-nm -D），打开实验开关仅能编译、链接报 undefined symbol——需改用 fmt（94 处 std::format 机械替换，0 处自定义 std::formatter）"
  - "libcifpp v10 新增 sqlite3 依赖（BUILD_SQLITE_INTERFACE 默认 ON），ohpcd 已有 sqlite3/3.53.4"
  - "v10 供 cif-tools 2.0.0 使用（其 find_package(cifpp 10) 要求主版本 10；v9.0.6 不满足）"
