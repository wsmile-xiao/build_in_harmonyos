# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: libcifpp/10.0.4
homepage: "https://github.com/PDB-REDO/libcifpp"

# 上游测试（v10.0.4 自带的 test/ 目录）——**已实测 10/10 可执行文件全部通过**
#   （112 个 test case / 5,209,054 条断言；源码声明 120 个 TEST_CASE，13 个源文件）
#
# 关键更正：此前记为「0 运行」不准确。上游在缺 Catch2 时会走 FetchContent 联网
# 拉取，但那只是**回退路径**——ohpcd 实际**已发布 catch2/3.8.1**，满足上游
# `find_package(Catch2 3)`，无需联网即可构建测试。
#
# 复现命令（三处适配均不改上游测试逻辑）：
#   ① configure（接入 catch2 与各 *_DIR）
#      cmake -S <src> -B <build> -DBUILD_TESTING=ON \
#        -DCatch2_DIR=<catch2-pkg>/lib/cmake/Catch2 \
#        -DFastFloat_DIR=<fast_float-pkg>/share/cmake/FastFloat \
#        -DEigen3_DIR=<eigen-pkg>/share/eigen3/cmake \
#        -DSQLite3_DIR=<sqlite3-pkg>/lib/cmake/SQLite3 \
#        -DCMAKE_TOOLCHAIN_FILE=<generators>/conan_toolchain.cmake
#   ② 补丁 <src>/test/CMakeLists.txt：cxx_std_23 → cxx_std_20，
#      并给 test-main / 各 ${CIFPP_TEST} 的 target_link_libraries 追加 libfmt.so
#      （cifpp 对 fmt 是 PRIVATE 链接，换 fmt::format 后需显式补）
#   ③ 运行：<build>/test/<name>-test --data-dir <src>/test
upstream_check_command: "cmake -DBUILD_TESTING=ON -DCatch2_DIR=<pkg>/lib/cmake/Catch2 ... && make -j4（详见上方复现命令）"

# conanfile.py build() 中未运行上游测试（BUILD_TESTING=OFF，避免 catch2 依赖与
# 5M 断言量级测试的耗时）；上游测试结果为本地实测记录，见 manifest test_note
upstream_test_in_build: false
upstream_test_command: "<build>/test/<name>-test --data-dir <src>/test"

# 上游测试来源（注册的 10 个可执行文件）
upstream_tests:
  - name: unit-v2-test
    result: "PASS — 100499 assertions in 60 test cases"
  - name: unit-3d-test
    result: "PASS — 5093928 assertions in 17 test cases"
  - name: model-test
    result: "PASS — 14331 assertions in 9 test cases"
  - name: cql-test
    result: "PASS — 240 assertions in 11 test cases"
  - name: matrix-test
    result: "PASS — 5 assertions in 5 test cases"
  - name: sugar-test
    result: "PASS — 10 assertions in 2 test cases"
  - name: validate-pdbx-test
    result: "PASS — 17 assertions in 3 test cases"
  - name: reconstruction-test
    result: "PASS — 24 assertions in 1 test case"
  - name: rename-compound-test
    result: "PASS — 1 test case passed"
  - name: spinner-test
    result: "PASS — 3 test cases passed"

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_cifpp.cpp
    description: "消费者探针：cif::file 构造，验证 libcifpp 链接 + 初始化"
    command: "clang++ -std=c++20 test_cifpp.cpp -o test_cifpp_probe -lcifpp -lpcre2-8 -lfmt -lz && ./test_cifpp_probe"

# 断言总数（test_package 1 个断言）
assertion_count: 1
