sources:
  "9.0.6":
    url: "https://github.com/PDB-REDO/libcifpp/archive/refs/tags/v9.0.6.tar.gz"
    sha256: "e6263a63404762671d6875de385e0c7ad869b0fe3fae41808003e00c94e7ed8c"
patches:
  "9.0.6":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "Use Conan CMakeDeps targets: zlib::zlib, fast_float::fast_float, fmt::fmt; force CONFIG mode for ZLIB; remove FastFloat version constraint"
    - patch_file: "patches/0002-include-cif++-category.hpp.patch"
      patch_description: "Add explicit constructors to key_element_type for OHOS libc++ construct_at compatibility"
    - patch_file: "patches/0003-include-cif++-format.hpp.patch"
      patch_description: "Use fmt::format instead of std::format (OHOS libc++ has incomplete std::format)"
    - patch_file: "patches/0004-include-cif++-point.hpp.patch"
      patch_description: "Replace <format> include with <fmt/format.h> and std::format with fmt::format"
    - patch_file: "patches/0005-src-model.cpp.patch"
      patch_description: "Replace std::format with fmt::format"
    - patch_file: "patches/0006-src-utilities.cpp.patch"
      patch_description: "Replace <format> include with <fmt/format.h> and std::format with fmt::format"
