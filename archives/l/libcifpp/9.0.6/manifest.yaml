version: "9.0.6"
status: built
software: libcifpp
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://github.com/PDB-REDO/libcifpp/archive/refs/tags/v9.0.6.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCIFPP_DOWNLOAD_CCD=OFF"
    - "-DCIFPP_INSTALL_UPDATE_SCRIPT=OFF"
    - "-DBUILD_TESTING=OFF"
  cc: clang
  cxx: clang++
  cxx_std: "20"

patches_applied:
  - "0001-CMakeLists.txt.patch: Use Conan CMakeDeps targets, force CONFIG mode for ZLIB, remove FastFloat version constraint"
  - "0002-include-cif++-category.hpp.patch: Add explicit constructors to key_element_type for OHOS libc++"
  - "0003-include-cif++-format.hpp.patch: Use fmt::format instead of std::format"
  - "0004-include-cif++-point.hpp.patch: Replace <format> with <fmt/format.h>"
  - "0005-src-model.cpp.patch: Replace std::format with fmt::format"
  - "0006-src-utilities.cpp.patch: Replace <format> with <fmt/format.h>, std::format with fmt::format"

knowledge_gained:
  - "OHOS clang 15 libc++ does not support std::from_chars for float types; fast_float/7.0.0 used as fallback"
  - "OHOS libc++ has _LIBCPP_HAS_NO_INCOMPLETE_FORMAT defined; std::format is unavailable; fmt/8.1.1 used instead"
  - "OHOS libc++ construct_at does not support aggregate initialization (P0960); explicit constructors needed for aggregate types used with emplace_back"
  - "CIFPP_DOWNLOAD_CCD must be OFF to avoid 300MB download from wwPDB"
  - "CIFPP_INSTALL_UPDATE_SCRIPT must be OFF to avoid FATAL_ERROR on non-Linux/GNU/FreeBSD systems"
  - "pcre2 found via PkgConfigDeps; CMakeLists.txt uses pkg_check_modules not find_package"
  - "Data files (mmcif_ddl.dic, mmcif_pdbx.dic, mmcif_ma.dic) installed to share/libcifpp/"
