software: libcifpp
display: "libcifpp"
description: "A C++ library for reading and writing CIF (Crystallographic Information File) data"
category: science
homepage: "https://github.com/PDB-REDO/libcifpp"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS libc++ lacks std::from_chars for float → fast_float/7.0.0 fallback"
    - "OHOS libc++ has incomplete std::format → fmt/8.1.1"
    - "OHOS construct_at doesn't support aggregate init → explicit constructors"
    - "CIFPP_DOWNLOAD_CCD=OFF and CIFPP_INSTALL_UPDATE_SCRIPT=OFF required"
  common_dependencies: ["zlib", "eigen", "pcre2", "fast_float", "fmt"]

versions:
  "9.0.6":
    status: built
    date: "2026-09-10"
