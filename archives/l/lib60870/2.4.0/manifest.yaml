version: "2.4.0"
software: "lib60870"
status: built
build_date: "2026-09-14"
build_system: cmake

source:
  url: "https://github.com/mz-automation/lib60870/archive/refs/tags/v2.4.0.tar.gz"
  sha256: "5c4b9bded9555e914a1adcaaebbea3631828a6b08bd6d21573a62f34d439ea82"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_TESTS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux (OHOS override, E092)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "E092: OHOS conan CMakeToolchain 将 CMAKE_SYSTEM_NAME 映射为 HarmonyOS，CMake 4.x 视为未知平台导致 UNIX/APPLE/WIN32 未定义，上游 IF(UNIX) HAL 源文件选择分支全空（No SOURCES given to target）；对策为显式覆盖 CMAKE_SYSTEM_NAME=Linux + SYSTEM_PROCESSOR=aarch64，linux HAL 所需 API（socket/poll/termios/clock_gettime）musl 全部可用"
  - "CMake 4.x 拒绝上游 cmake_minimum_required(3.0)，CMAKE_POLICY_VERSION_MINIMUM=3.5 命令行传入即可"
  - "musl 无独立 librt，上游无条件 -lrt 实测可静默链接通过，无需 patch"
  - "上游库产物名为 liblib60870.so/liblib60870.a（CMake target 名与 OUTPUT_NAME 均为 lib60870，双 lib 前缀），cpp_info.libs 填 60870"
  - "上游 Unity 测试单二进制 121 用例中 31 个 TLS 用例由 CONFIG_CS104_SUPPORT_TLS 守卫，无 vendored mbedtls 时不编译；非 TLS 90 用例本机真实执行全 PASS"
  - "上游工程在源码包 lib60870-C/ 子目录，源码根无 CMakeLists.txt；strip_root 后 Conan CMake 自动向下定位"
