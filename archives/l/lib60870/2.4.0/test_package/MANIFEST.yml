# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lib60870/2.4.0
homepage: "https://lib60870.com/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build . --target tests && ./tests/tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "tests/tests (Unity runner, 90 non-TLS cases)"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/all_tests.c
    source: lib60870-2.4.0/lib60870-C/tests/all_tests.c
    description: "Unity 单体测试套件（单二进制 90 个非 TLS 用例：版本/CP56Time2a/信息对象编解码/CS101 ASDU/CS104 主从建连/事件队列/超时重传）；上游另有 31 个 TLS 用例仅在 CONFIG_CS104_SUPPORT_TLS=1 时编译执行，本包未启用 TLS（无 vendored mbedtls），与上游无 TLS 配置下跳过的集合一致"
    command: "./tests/tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：版本号校验、CS101_ASDU 填充与元素查询、CP56Time2a 时间戳、CS104 Slave 创建/配置/销毁、StepPositionInformation 读写"
    command: "./test_lib60870"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 90
