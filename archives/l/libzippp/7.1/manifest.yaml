software: libzippp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.1"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统（顶层字段，供 verify-build 检查）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/ctabin/libzippp/tar.gz/refs/tags/libzippp-v7.1-1.10.1"

  # 源码校验和
  sha256: "9ded3c4b5641e65d2b3a3dd0cbc4106209ee17c17df70e5187e7171420752546"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_PREFIX_PATH=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DLIBZIPPP_INSTALL=ON"
    - "-DLIBZIPPP_INSTALL_HEADERS=ON"
    - "-DLIBZIPPP_BUILD_TESTS=ON"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libzip/1.10.1"
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 打包信息
# ============================================================

packaging:
  # 预编译包文件名
  tarball: "libzippp-7.1-ohos-aarch64.tar.gz"
  # 预编译包大小
  size: "121KB"
  # 预编译包 SHA256
  sha256: "ed6a5267b160f5f451f20b169bd5cd90b46f40c59b0ea14b4a405a610693697b"
  # 包内文件数
  file_count: 7

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libzip 预编译包缺少 libzip.so 开发符号链接，需手动创建: rm -f libzip.so && ln -s libzip.so.5.5 libzip.so"
  - "libzippp 使用 CMake 构建，init-build 的 build_system 猜测可能不准，需根据 CMakeLists.txt 修正"
  - "CMake find_package(LIBZIP MODULE) 依赖 FindLIBZIP.cmake，需要 libzip.so 符号链接和 libzip.pc pkgconfig 文件"
