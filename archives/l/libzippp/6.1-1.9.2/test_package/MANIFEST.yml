package: libzippp/6.1-1.9.2
homepage: https://github.com/ctabin/libzippp
upstream_test_in_build: true
upstream_check_command: ctest --verbose --output-on-failure
upstream_test_command: ctest --verbose --output-on-failure
upstream_tests:
  - file: tests/tests.cpp
    source: official libzippp-v6.1-1.9.2
    description: All 24 original assertion-active upstream functions in one CTest container
    command: libzippp_shared_test
test_package_tests:
  - file: test.cpp
    description: Installed API ZIP create, UTF-8 entry, close, reopen, exact data and cleanup
    command: libzippp_consumer TASK_PRIVATE_DIR PACKAGE_LIBDIR
harmony_tests:
  - file: test.cpp
    description: HarmonyOS aarch64 signed storage-library loader identity, projected ownership, UTF-8 ZIP persistence and cleanup
    command: libzippp_consumer TASK_PRIVATE_DIR PACKAGE_LIBDIR --harmony
assertion_count: 14
assertion_count_scope: Explicit nonzero-exit failure gates in the consumer source, not upstream function count
upstream_function_count: 24
ctest_container_count: 1
harmony_test_count: 1
