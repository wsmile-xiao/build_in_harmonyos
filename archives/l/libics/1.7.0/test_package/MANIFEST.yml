# test_package/MANIFEST.yml
# libics 1.7.0 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libics/1.7.0
homepage: "https://svi-opensource.github.io/libics/"

# 上游测试命令 (CMake 项目)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游 CMakeLists.txt 注册的 ctest 用例（tag 1.7.0 审计，共 20 个真实测试
# + 1 个 ctest_build_test_code 构建辅助项；zlib 启用时含 test_gzip 与
# test_metadata4_cpp；C++ 接口 7 个用例需配方内 _fix_cpp_real16 先补齐
# Real16 枚举（与上游 master 同行，无补丁文件）
upstream_tests:
  - file: test_ics1.c
    source: "libics-1.7.0/test_ics1.c + test/testim.ics"
    description: "ICS v1 读写往返验证"
    command: "ctest -R test_ics1"
  - file: test_ics2a.c
    source: "libics-1.7.0/test_ics2a.c + test/testim.ics"
    description: "ICS v2a 读写往返验证"
    command: "ctest -R test_ics2a"
  - file: test_ics2b.c
    source: "libics-1.7.0/test_ics2b.c + test/testim.ics"
    description: "ICS v2b 读写往返验证"
    command: "ctest -R test_ics2b"
  - file: test_gzip.c
    source: "libics-1.7.0/test_gzip.c + test/testim.ics"
    description: "gzip 压缩读写验证（需 zlib）"
    command: "ctest -R test_gzip"
  - file: test_compress.c
    source: "libics-1.7.0/test_compress.c + test/testim_c.ics"
    description: "compress 压缩读写验证"
    command: "ctest -R test_compress"
  - file: test_strides.c
    source: "libics-1.7.0/test_strides.c + test/testim.ics"
    description: "带步幅数据读写验证"
    command: "ctest -R test_strides"
  - file: test_strides2.c
    source: "libics-1.7.0/test_strides2.c + test/testim.ics"
    description: "带步幅数据读写验证 2"
    command: "ctest -R test_strides2"
  - file: test_strides3.c
    source: "libics-1.7.0/test_strides3.c + test/testim.ics"
    description: "带步幅数据读写验证 3"
    command: "ctest -R test_strides3"
  - file: test_metadata.c
    source: "libics-1.7.0/test_metadata.c"
    description: "元数据读写验证（4 个 ctest 项：metadata1-4）"
    command: "ctest -R test_metadata"
  - file: test_history.c
    source: "libics-1.7.0/test_history.c"
    description: "历史记录读写验证"
    command: "ctest -R test_history"
  - file: support/cpp_interface/test_ics2a.cpp
    source: "libics-1.7.0/support/cpp_interface/test_ics2a.cpp"
    description: "C++ 接口 ICS v2a 读写验证"
    command: "ctest -R test_ics2a_cpp"
  - file: support/cpp_interface/test_ics2b.cpp
    source: "libics-1.7.0/support/cpp_interface/test_ics2b.cpp"
    description: "C++ 接口 ICS v2b 读写验证"
    command: "ctest -R test_ics2b_cpp"
  - file: support/cpp_interface/test_metadata.cpp
    source: "libics-1.7.0/support/cpp_interface/test_metadata.cpp"
    description: "C++ 接口元数据读写验证（4 个 ctest 项：metadata1_cpp-4_cpp）"
    command: "ctest -R test_metadata_cpp"
  - file: support/cpp_interface/test_history.cpp
    source: "libics-1.7.0/support/cpp_interface/test_history.cpp"
    description: "C++ 接口历史记录读写验证"
    command: "ctest -R test_history_cpp"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "ICS 文件创建/布局/数据往返/历史记录 5 项检查"
    command: "./test_libics"

# 测试断言总数 (test.c 内 5 个 CHECK-OK 检查点)
assertion_count: 5
