package: libmsv/1.1.1
homepage: "https://salsa.debian.org/clint/libmsv"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1 with deterministic loopback MSVA"

upstream_tests:
  - name: "checkmsva"
    command: "make check"
    expected: "pass 1/1 with a compatible MSVA available"

test_package_tests:
  - file: "test_upstream.c"
    description: "Upstream MSVA availability and certificate review integration path"
    command: "./test_upstream"
  - file: "test_ohos.c"
    description: "HarmonyOS aarch64 ABI and public error-contract verification"
    command: "./test_ohos"

assertion_count: 14
expected_stdout: "PASS: upstream MSVA integration path; PASS: HarmonyOS-specific libmsv contract"
