# 版本级 manifest — libcombine 0.2.20
# 遵循 templates/manifest-version.yaml（ARCHIVE-SPEC v2.0）

version: "0.2.20"
software: "libcombine"

status: built
build_date: "2026-09-16"
build_system: "cmake"

source:
  url: "https://github.com/sbmlteam/libCombine/archive/refs/tags/v0.2.20.tar.gz"
  sha256: "2b4f76d479490b6b503217bb8135cf05a924c22fc8307e6829b82a586f67d3c1"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TEST=ON"
    - "-DWITH_SWIG=OFF"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_CHECK=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - zlib/1.3.1.1.1.1
    - libxml2/2.15.3.1
  cc: clang
  cxx: clang++

# Vendored (single-PR, R36): not registry dependencies, shipped as sources.
vendored:
  - "libsbml/5.20.5 (private static helper, headers + libsbml-static.a shipped)"
  - "zipper/c56a27f (submodules/zipper)"
  - "minizip/e3a8cb7 (submodules/zipper/minizip)"

patches_applied: []

knowledge_gained:
  - "libCombine 硬依赖 libSBML 的 XML 层（sbml/xml/*），不可裁剪"
  - "FreeBSD biology/libcombine 同样外挂 zipper/minizip 并禁用上游 BUILD_TEST（0.2.19 链接问题，0.2.20 已修 path）"
  - "上游 cmake_minimum_required(2.6) 需 CMAKE_POLICY_VERSION_MINIMUM=3.5 过现代 CMake"
