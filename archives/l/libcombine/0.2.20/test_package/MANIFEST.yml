# test_package/MANIFEST.yml — libcombine 0.2.20
# Upstream test declaration (CI L0e). Numbers below come from auditing the
# v0.2.20 tag (src/test/*.cpp + CMakeLists BUILD_TEST block); pass rates are
# filled from the HarmonyOS aarch64 preflight evidence round, not estimated.

package: libcombine/0.2.20
homepage: "https://github.com/sbmlteam/libCombine"

# Upstream test command wired into the recipe build() via BUILD_TEST=ON.
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# The single ctest entry runs the Catch binary covering all 10 cases.
upstream_tests:
  - file: src/test/combine_test_create.cpp
    source: libCombine-0.2.20/src/test/combine_test_create.cpp
    description: "4 Catch SCENARIO (create/read/zero-size/metadata) + 2 TEST_CASE (purl/https formats)"
    command: "ctest -R test_Combine_run"
  - file: src/test/zip_test_read.cpp
    source: libCombine-0.2.20/src/test/zip_test_read.cpp
    description: "1 Catch SCENARIO: zip archive read/extract"
    command: "ctest -R test_Combine_run"
  - file: src/test/zip_test_write.cpp
    source: libCombine-0.2.20/src/test/zip_test_write.cpp
    description: "1 Catch SCENARIO: zip archive write/extract"
    command: "ctest -R test_Combine_run"
  - file: src/test/util_test.cpp
    source: libCombine-0.2.20/src/test/util_test.cpp
    description: "1 Catch SCENARIO: Util extensions, KnownFormats, temp-dir"
    command: "ctest -R test_Combine_run"
  - file: src/test/metadata_test_create.cpp
    source: libCombine-0.2.20/src/test/metadata_test_create.cpp
    description: "1 Catch SCENARIO: OmexDescription/VCard metadata roundtrip"
    command: "ctest -R test_Combine_run"

# L1 consumer test (calls real APIs: CombineArchive roundtrip, KnownFormats,
# Util, OmexDescription/VCard). 21 PASS/FAIL checks, exit code signals result.
test_package_tests:
  - file: test_combine.cpp
    description: "Consumer roundtrip: addFileFromString/writeToFile/initializeFromArchive/extractEntryToString plus registry/util checks"
    command: "./test_combine"

# Lower-bound estimate from counting REQUIRE macros in the 5 upstream test
# sources; exact assertion totals come from the preflight ctest output.
assertion_count: 100
