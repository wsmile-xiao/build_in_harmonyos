# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）

package: libbpp-raa/2.4.1
homepage: "https://github.com/BioPP/bpp-raa"

# 上游测试命令
upstream_check_command: ""
# libbpp-raa 2.4.1 上游**没有任何测试目标**：
#   - 顶层 CMakeLists.txt 无 enable_testing() / BUILD_TESTING / add_test
#   - 仓库无 test/ 目录
# 因此这里如实声明"无上游测试"，只由 test_package 提供消费者断言。
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带的消费者测试（R34：真实调用被测包公开 API/符号）
test_package_tests:
  - file: test_bpp_raa.cpp
    description: >-
      3 项断言：解析 RaaList 的三个公开静态常量（LIST_SEQUENCES / LIST_KEYWORDS /
      LIST_SPECIES，定义于 RaaList.cpp，解析成功即证明消费者已正确链接被测包及其
      bpp-seq / bpp-core / zlib 依赖）。RAA 是 ACNUC 数据库驱动库，行为级操作需已打开
      数据库且 RaaList 构造函数为私有（仅 RAA 友元可建），无法无头运行，故如实说明。
    command: "./test_bpp_raa（经 ctest -R test_bpp_raa）"

assertion_count: 3
