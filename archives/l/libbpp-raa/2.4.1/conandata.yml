# conandata.yml — libbpp-raa 2.4.1
#
# 上游：Bio++ RAA（ACNUC 数据库访问库），纯 CMake。
# 按 R39 只写官方原始 URL，不加镜像前缀。
sources:
  url: "https://github.com/BioPP/bpp-raa/archive/refs/tags/v2.4.1.tar.gz"
  sha256: "21ed87b5c0c80f5b1632493127b30a77ae92ac0853985c048f31bed5fd0fb301"

patches:
  # 上游 src/CMakeLists.txt 把 zlib 写成裸目标名 `zlib`（target_link_libraries ...
  # zlib）。CMake 的 FindZLIB 模块只创建 ZLIB::ZLIB（并设 ZLIB_LIBRARIES 变量），
  # 不会创建名为 `zlib` 的目标，于是 `zlib` 被当作库名展开成 -lzlib，链接失败。
  # 改为标准目标名 ZLIB::ZLIB。这是上游在"系统装了 zlib 且存在 zlib-config 目标"
  # 的假设下的写法，在 OHOS/Conan 环境下不成立。
  - patch_file: "patches/0001-src-CMakeLists-use-ZLIB-target.patch"
    patch_description: "src CMakeLists use ZLIB::ZLIB target instead of bare zlib name so CMake FindZLIB resolves it under Conan/OHOS"
    patch_type: "portability"
