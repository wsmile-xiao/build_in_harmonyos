software: libbpp-raa
version: "2.4.1"
upstream_version: "2.4.1"
status: built
build_date: "2026-09-21"
build_system: cmake
conan_ref: "libbpp-raa/2.4.1"

source:
  url: "https://github.com/BioPP/bpp-raa/archive/refs/tags/v2.4.1.tar.gz"
  sha256: "21ed87b5c0c80f5b1632493127b30a77ae92ac0853985c048f31bed5fd0fb301"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DZLIB_ROOT=<zlib 包目录>（FindZLIB 指到 conan zlib）"
    - "-Dbpp-seq_DIR=<libbpp-seq 包内>/lib/cmake/bpp-seq"
  dependencies:
    - libbpp-seq/2.4.1
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++
  package_type: library

patches_applied:
  - "patches/0001-src-CMakeLists-use-ZLIB-target.patch (portability: 裸 zlib 目标名 → ZLIB::ZLIB)"

knowledge_gained:
  - "libbpp-raa 2.4.1 上游没有任何测试目标（无 enable_testing / BUILD_TESTING / add_test / test 目录），只能以 test_package 消费者断言覆盖；与 gtkspell3 同属『上游无测试』类，MANIFEST 如实声明 upstream_test_in_build: false"
  - "上游 src/CMakeLists 把 zlib 写成裸目标名 `zlib`（target_link_libraries ... zlib），CMake FindZLIB 只创建 ZLIB::ZLIB，裸名会展开成 -lzlib 链接失败；改为 ZLIB::ZLIB 是标准修复"
  - "RAA 是 ACNUC 数据库驱动库，绝大多数公开 API（openDatabase/processQuery/RaaList 增删查/RaaSpeciesTree）都要在已打开数据库上工作，无数据库时无法无头做行为级测试；静态常量（RaaList::LIST_SEQUENCES 等）是仅有的可无头解析的真实导出符号"
  - "zlib 用 1.3.1.1（OHOS -fPIC 重建版）：上游 bpp-raa-shared 链接 zlib 静态对象，非 PIC 会报重定位失败"
  - "沿用 libbpp-phyl 的同族结论：cmake_minimum_required 2.8.11 需 CMAKE_POLICY_VERSION_MINIMUM=3.5；上游 set(CMAKE_CXX_FLAGS) 覆盖 --target，交叉编译用 CMAKE_<LANG>_COMPILER_TARGET 注入（E543）；libbpp-seq 包 CMake 导出引用已裁剪 .so，需构建内 shim"
