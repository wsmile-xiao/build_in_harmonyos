software: libbpp-raa
display: "Bio++ RAA Library"
description: "Bio++ RAA: ACNUC sequence database access library"
category: library
homepage: "https://github.com/BioPP/bpp-raa"
license: CECILL-2.1
build_system: cmake

ohos_adaptation:
  key_points:
    - "Pure CMake build; requires libbpp-seq/2.4.1 (published) and zlib/1.3.1.1"
    - "No upstream test targets; consumer smoke via test_package"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5 for cmake_minimum_required(2.8.11)"
    - "ZLIB_ROOT injected; bare zlib target patched to ZLIB::ZLIB"
  common_dependencies:
    - libbpp-seq/2.4.1
    - zlib/1.3.1.1

versions:
  "2.4.1":
    status: built
    build_date: "2026-09-21"
