software: libdap
display: "libdap"
description: "OPeNDAP C++ library implementing the DAP2/DAP4 data access protocol (scientific data access)"
category: net
homepage: "https://www.opendap.org/software/libdap"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "tarball 无预生成 configure, autoreconf 自举 (automake/libtool tool_requires)"
    - "gnulib weak-symbol 探测引用 musl 不存在的 pthread_cancel, 强制 gl_cv_have_weak=no"
    - "OHOS sysroot 无 rpc/xdr.h, libtirpc conan 包提供 XDR"
    - "conftest 运行需 LD_LIBRARY_PATH 注入 (libc++_shared.so + 依赖共享库)"
  status: adapted

