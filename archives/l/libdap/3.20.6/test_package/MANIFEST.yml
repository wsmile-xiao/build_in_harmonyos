# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libdap/3.20.6
homepage: "https://www.opendap.org/software/libdap"

# 上游测试命令 — libdap 有完整上游测试套件:
#   unit-tests/ 51 个 cppunit 程序 (make check)
#   tests/ 241 个 autotest + getdapTest (make check)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(args=['check'])"

# 上游实际运行的测试程序 (摘录核心项; 完整清单见 tests/unit-tests 目录)
upstream_tests:
  - suite: unit-tests
    framework: cppunit
    count: 51
    description: "DAP2/DAP4 数据模型单元测试 (DDS/DAS/DMR/marshaller/parser/AttrTable 等)"
  - suite: tests
    framework: autotest
    count: 242
    description: "das-test/dds-test/expr-test/dmr-test autotest 套件 + getdapTest"

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test_package.cpp
    description: "构造 DDS/DAS/Int32/Str/Array/AttrTable 并做 set_value/value 往返校验 + DDS.print 序列化"
    command: "./libdap_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
