# 编译中学到的知识
knowledge_gained:
  - "tarball 无预生成 configure, 需 autoreconf 自举 (tool_requires automake/libtool)"
  - "gnulib USE_POSIX_THREADS_WEAK 探测在 musl 上引用不存在的 pthread_cancel, 需强制 gl_cv_have_weak=no"
  - "OHOS sysroot 无 rpc/xdr.h, 用 libtirpc conan 包提供 (pkg-config + CPPFLAGS)"
  - "libtirpc pkg-config Libs 含 -L 时 acinclude.m4 的库名提取逻辑出错, 需修 m4"
  - "groff/col 不可用, man 页规则改为 cp (man 源文件本就是 roff 文本)"
  - "cppunit 是可选依赖, 未装时 unit-tests 被静默跳过 — 跑上游测试必须 tool_requires"
  - "E064 变体: conftest 失败或因 libc++_shared.so loader 路径而非安全弹窗"

