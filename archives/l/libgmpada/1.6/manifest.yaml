# libgmpada 1.6 版本级 manifest
# ARCHIVE-SPEC v2.0

version: "1.6"
software: "libgmpada"
status: built
build_date: "2026-09-20"
build_system: "makefile"

source:
  url: "http://nicolas.boulenguez.free.fr/libgmpada-1.6.tar.xz"
  sha256: "7691cb8fa8e146799590093868355aee7367efa875b9479cce9492476d902ac4"
  tar_format: tar.xz

build:
  system: makefile
  # 手写顶层 Makefile：无 configure / CMake / meson，配方直接调 make。
  configure_options: []
  dependencies:
    - gmp/6.3.0
    - gcc-ada/9.5.0
    - binutils/2.46.0
  cc: gcc
  cxx: gcc

patches_applied: []

knowledge_gained:
  - "gcc-ada/9.5.0 以 --enable-languages=c,ada 构建，只交付 gcc/gnatmake/gnatbind/gnatlink，没有 g++；上游 Makefile 默认的 CXX := g++-<gnat_version> 必须覆盖为同一个 gcc（C 驱动同样支持 -fdump-ada-spec）"
  - "gcc-ada 只交付 libgnat.a/libgnarl.a（静态），Makefile 手工链接的 -lgnat 需要 -L<adalib>"
  - "Ada 库在 OHOS 只有 gcc-ada/binutils 的 armv8 制品，必须原生两 profile 构建（同 libncursesada）"
  - "lang-preflight 的 LANG_ENUM 缺 ada，本库 9 个 .adb + 12 个 .ads 被误判为 c（libncursesada 后的第二个实证）"
