# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）

package: libgmpada/1.6
homepage: "http://nicolas.boulenguez.free.fr"

# 上游测试入口是顶层 Makefile 的 test 目标（无 configure/ctest）：
#   make test
# 它会在 DESTDIR=demo-install 下 make install，再用 gnatmake 分别链接
# demo.adb 到动态库与静态库两个 demo，两个都实际运行，最后 make uninstall。
upstream_check_command: "make test"

# conanfile.py build() 中确实构建并运行了上游 demo，但只跑静态库变体：
# OHOS 上 gcc-ada 只交付非 PIC 的静态 Ada 运行时（adalib/libgnat.a），
# 无法产出 libgmpada.so，故 demo-dynamic 不可构建（见 notes.md「未执行项」）。
upstream_test_in_build: true
upstream_test_command: "make obj/libgmpada.a obj/gmpada.gpr（仅静态库）→ gnatmake demo.adb 静态链接 → demo-static/demo"

upstream_tests:
  - file: demo.adb
    source: libgmpada-1.6
    description: >
      上游功能测试程序（248 行，43 条 pragma Assert），覆盖 Big_Integer /
      Big_Float / Big_Rationals、Integer/Float 转换、Text_IO/Wide_Text_IO、
      流式读写与 Random_Numbers。上游 make test 会链接动态库与静态库两个变体；
      本适配实际执行的是静态库变体 demo-static/demo（动态库变体在 OHOS 上
      无法产出，原因见 notes.md）。
    command: "./demo-static/demo"

test_package_tests:
  - file: src/main.adb
    description: >
      Ada 消费者：2**100 精确值断言、负值 Image 断言、整除/取余恒等式断言
    command: "gnatmake -o gmpada-consumer src/main.adb -Isrc -I<adainclude>/gmpada -largs <pkg>/lib/libgmpada.a -lgmp"

# 实际执行断言数 = 上游静态 demo 43 条 + test_package 消费者 3 条 = 46。
# （上游清点入口数 N=2，实跑 N′=1；动态库变体未执行，不计入。）
assertion_count: 46
