package: libfsntfs/20251028
homepage: https://github.com/libyal/libfsntfs

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: "libfsntfs library tests"
    source: tests/test_library.sh
    description: "Upstream shell runner for the library and its 75 C test programs"
    command: "./tests/test_library.sh"
  - name: "fsntfstools tests"
    source: tests/test_tools.sh
    description: "Upstream fsntfsinfo and fsntfsmount tool checks"
    command: "./tests/test_tools.sh"
  - name: "fsntfsinfo tests"
    source: tests/test_fsntfsinfo.sh
    description: "fsntfsinfo metadata output checks"
    command: "./tests/test_fsntfsinfo.sh"
  - name: "fsntfsinfo bodyfile tests"
    source: tests/test_fsntfsinfo_bodyfile.sh
    description: "fsntfsinfo bodyfile output checks"
    command: "./tests/test_fsntfsinfo_bodyfile.sh"

test_package_tests:
  - file: test_libfsntfs.c
    description: "Consumer API version, flags, codepage, error, and volume lifecycle checks"
    command: "./test_libfsntfs"
  - file: test_ohos.c
    description: "OHOS-specific consumer test: compile-time OHOS target check and writable TMPDIR file lifecycle"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "ohos-tmpdir-file-lifecycle"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、TMPDIR 非 /tmp、临时文件读写和清理"
    command: "./test_ohos"
    assertions: 5
    platform: OHOS

assertion_count: 14
