package: libewf/20140816
homepage: "https://github.com/libyal/libewf-legacy"

upstream_tests_exist: true
upstream_test_audit:
  - source: "tests/Makefile.am TESTS"
    reason: "make check registers 7 unconditional automake suites: test_library.sh, test_glob.sh, test_seek.sh, test_read.sh, test_ewfverify.sh, test_ewfverify_logical.sh, test_ewfinfo.sh."
  - source: "tests/Makefile.am TESTS_WRITE (HAVE_WRITE_TESTS)"
    reason: "9 additional write suites (test_write.sh, test_read_write.sh, test_read_write_delta.sh, test_ewfacquire.sh, test_ewfacquire_optical.sh, test_ewfacquirestream.sh, test_ewfacquire_resume.sh, test_ewfexport.sh, test_ewfexport_logical.sh) are registered only when configure detects zlib write support (ac_cv_uncompress=zlib)."
  - source: "tests/Makefile.am TESTS_PYEWF (HAVE_PYTHON)"
    reason: "test_pyewf.sh is registered only with --enable-python (upstream default: no); the recipe keeps the default, so this suite stays unregistered."
  - source: "tests/Makefile.am check_PROGRAMS"
    reason: "33 C test programs (ewf_test_handle, ewf_test_read, ewf_test_write, ewf_test_checksum, ...) are built by make check and driven from inside the shell suites; they are harnesses, not independent automake cases."
  - conclusion: "the automake universe is 17 TESTS scripts at most (7 unconditional + 9 zlib-conditional + 1 python-conditional); tier-1 (runnable bash + vendored input fixtures) runs native make check and parses test-suite.log TOTAL/PASS/FAIL/SKIP; tier-2 (release-tarball case: no runnable bash, no input fixtures) builds check_PROGRAMS via make check TESTS= and runs driver-identical direct assertions (25 library binaries + 32 write-matrix invocations + 20 replicated glob cases = 77), which equals the full executable coverage of CI-with-bash since input-dependent suites SKIP by upstream design with zero assertions there; the marker payload is persisted to res/upstream_test_result.json for test_package re-emit."

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - name: test_library
    type: unit
    command: "test_library.sh (drives the ewf_test_* C harnesses)"
  - name: test_glob
    type: functional
    command: "test_glob.sh (segment-file globbing)"
  - name: test_seek
    type: functional
    command: "test_seek.sh (media seek behaviour)"
  - name: test_read
    type: functional
    command: "test_read.sh (media read path)"
  - name: test_ewfverify
    type: functional
    command: "test_ewfverify.sh (ewfverify tool)"
  - name: test_ewfverify_logical
    type: functional
    command: "test_ewfverify_logical.sh (logical image verify)"
  - name: test_ewfinfo
    type: functional
    command: "test_ewfinfo.sh (ewfinfo tool)"
  - name: write-suites
    type: functional-conditional
    command: "test_write.sh, test_read_write.sh, test_read_write_delta.sh, test_ewfacquire.sh, test_ewfacquire_optical.sh, test_ewfacquirestream.sh, test_ewfacquire_resume.sh, test_ewfexport.sh, test_ewfexport_logical.sh (registered only with zlib write support)"
  - name: test_pyewf
    type: binding-conditional
    command: "test_pyewf.sh (registered only with --enable-python; recipe keeps upstream default no)"

upstream_test_count: 17
upstream_test_execution: "two-tier in recipe build() (libbde/20240502 precedent, same libyal harness): tier-1 native make check only when a runnable bash AND non-empty tests/input* fixtures both exist; tier-2 direct otherwise (release-tarball case): make check TESTS= builds all check_PROGRAMS, then driver-identical direct runs (25 no-arg ewf_test_* library binaries + 32 ewf_test_write/write_chunk matrix invocations + 20 python-replicated test_glob.sh fixture cases = 77 assertions, exactly what CI-with-bash would execute since the 12 input-dependent suites SKIP by upstream design with zero assertions); the exact marker payload is persisted to res/upstream_test_result.json and re-emitted by test_package"
consumer_test_count: 1
ohos_specific_test_count: 0

test_package_tests:
  - file: test_libewf.c
    name: consumer-api
    description: "Single consumer test entry; internally 6 assertions: (1) libewf_get_version() non-NULL, (2) version equals 20140816, (3) libewf_get_access_flags_read() equals LIBEWF_ACCESS_FLAG_READ, (4) libewf_handle_initialize() succeeds, (5) libewf_handle_free() succeeds and nulls the handle, (6) libewf_check_file_signature() returns 0 for a plain-text fixture (negative file-API path)."
    command: "./test_libewf"

assertion_count: 6
assertion_count_basis:
  version_present: 1
  version_match: 1
  access_flag_abi: 1
  handle_initialize: 1
  handle_free: 1
  signature_negative: 1
hardware_playback_required: false
hardware_playback_note: "libewf is a file-format library; consumer tests exercise the in-memory handle lifecycle and the signature check against a generated plain-text fixture, no hardware or device access needed."
