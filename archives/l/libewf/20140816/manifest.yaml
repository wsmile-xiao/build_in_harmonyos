software: libewf
version: "20140816"
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://github.com/libyal/libewf-legacy/releases/download/20140816/libewf-20140816.tar.gz"
  sha256: "6b2d078fb3861679ba83942fea51e9e6029c37ec2ea0c37f5744256d6f7025a9"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-libfuse=no"
    - "--build=aarch64-unknown-linux-gnu (OHOS only)"
    - "--host=aarch64-unknown-linux-gnu (OHOS only)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

# Adaptation path per templates PR template: 路径 A（基础适配）.
adaptation_path: "A"

knowledge_gained:
  - "a52dec/0.7.4 precedent: pre-2015 configure scripts get --build/--host=aarch64-unknown-linux-gnu on OHOS (bundled config.sub predates ohos triplets)"
  - "darts/0.32 patterns reused: E002 writable TMPDIR injection, shell_getcwd configure workdir fallback, E114 config.status mktemp redirect"
  - "E011/E114: autoconf umask 077 relaxed to 022 for HMDFS at build time (generated script only, no committed patch)"
  - "Homebrew precedent: --with-libfuse=no (ewfmount needs FUSE, absent on OHOS); python bindings stay at upstream default --enable-python=no"
  - "HAVE_WRITE_TESTS follows zlib auto-detection: 9 write suites register only with zlib write support; evidence marker parses test-suite.log so counts stay truthful either way"

homepage: "https://github.com/libyal/libewf-legacy"
license: "LGPL-3.0-or-later"

tests:
  upstream:
    command: "make check"
    cases: 17
    note: "Automake TESTS universe: 7 unconditional suites + 9 zlib-conditional write suites + 1 python-conditional suite; 33 ewf_test_* C programs run inside the shell suites. Pass counts come from the HarmonyOS aarch64 preflight evidence (test-suite.log TOTAL/PASS/FAIL/SKIP)."
  adapted:
    command: "test_package/test_libewf"
    cases: 1
    assertions: 6
    note: "Single consumer entry with 6 API assertions (version, access flags, handle lifecycle, signature negative check). Pass counts come from the HarmonyOS aarch64 preflight evidence."
