# conandata.yml — libewf 20260924
# 源码身份：上游 GitHub release 资产（libyal 日期 tag 通道，channel=experimental）。
# 溯源（2026-10-09 实测）：
#   ① 上游 GitHub（libyal/libewf）release tag 20260924 存在，资产
#      libewf-experimental-20260924.tar.gz = 200（本配方采用，2681717 字节，
#      sha256 e2da4fdb8999b855948863d1bcb11e9427af959e789093491ed94dca397905b5）。
#   ② 任务卡给定 codeload git tarball
#      （https://codeload.github.com/libyal/libewf/tar.gz/refs/tags/20260924）
#      HTTP 200 可达，但 tarball **不含** configure/Makefile.in/config.guess 等
#      预生成文件，也**不含**全部 22 个 libyal 支持子库（libcerror/libcdata/
#      libbfio/libsmraw/libodraw 等，tar 内实测全 MISSING，无 .gitmodules）；
#      synclibs.sh 需构建期 `git clone https://github.com/libyal/<lib>.git`
#      逐库拉取最新 tag，把未注册 vendored 依赖拉进 PR，违反本仓
#      "never pulls unregistered dependencies" 规范；且 CI worker PATH 没有
#      automake（libvmdk/20240510 notes 先例实证），构建期 bootstrap
#      （autogen.sh → autoreconf --force --install）不可行。
#      release experimental 资产为上游发布流水线 synclibs+autogen 后的
#      自包含快照，与同族 libvmdk/20260714（PR #15170）同通道同规范，故采用。
#   ③ tarball 顶层目录 libewf-20260924/：预生成 configure/Makefile.in/
#      aclocal.m4/config.guess/config.sub（2025-07-10 vintage），捆绑 22 个
#      libyal 支持组件（libbfio libcaes libcdata libcdatetime libcerror
#      libcfile libclocale libcnotify libcpath libcsplit libcthreads libewf
#      libfcache libfdata libfdatetime libfguid libfvalue libhmac libodraw
#      libsmdev libsmraw libuna；另加顶层 common/ 共享支撑代码），无外部
#      autoreconf 需求；唯一外部依赖 zlib（制品仓已发布）。
sources:
  url: "https://github.com/libyal/libewf/releases/download/20260924/libewf-experimental-20260924.tar.gz"
  sha256: "e2da4fdb8999b855948863d1bcb11e9427af959e789093491ed94dca397905b5"
  filename: "libewf-experimental-20260924.tar.gz"

patches:
  "20260924":
    - patch_file: "patches/0001-ohos-tests-tmpfile-tmpdir.patch"
      patch_description: "OHOS musl tmpfile(3) hardcodes read-only /tmp ignoring TMPDIR (EACCES on device) - route the 7 test tmpfile() call sites through mkstemp+fdopen+unlink on TMPDIR"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-tests-tzdate-offset-format.patch"
      patch_description: "OHOS musl renders the date xheader zone as +01:00 (CET) instead of glibc's  CET suffix - compare the deterministic 37-byte string with TZ pinned to CET by the recipe"
      patch_type: "portability"
