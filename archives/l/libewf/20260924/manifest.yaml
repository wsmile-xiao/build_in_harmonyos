software: libewf
version: "20260924"
status: built
build_date: "2026-10-10"
difficulty: "B"
adaptation_path: "路径 A（基础适配）"

source:
  # 上游 GitHub（libyal/libewf）实测（2026-10-09）：release tag 20260924 存在，
  # release 资产 libewf-experimental-20260924.tar.gz = 200（采用，2681717 字节）。
  # codeload git tarball 不含 configure 产物也不含 22 个 libyal 支持子库
  # （synclibs.sh 构建期 git clone 未注册 vendored 依赖，违反本仓规范），
  # 且 CI worker PATH 无 automake（bootstrap 不可行）；release 资产为上游发布
  # 流水线自包含快照，同族先例 libvmdk/20260714（PR #15170）同通道。
  url: "https://github.com/libyal/libewf/releases/download/20260924/libewf-experimental-20260924.tar.gz"
  sha256: "e2da4fdb8999b855948863d1bcb11e9427af959e789093491ed94dca397905b5"
  tar_format: tar.gz
  upstream_repo: "https://github.com/libyal/libewf"
  upstream_tag: "https://github.com/libyal/libewf/releases/tag/20260924"
  release_artifact: "upstream release asset present (libewf-experimental-20260924.tar.gz, HTTP 200); self-contained (configure + 22 bundled libyal components)"

build:
  system: autotools
  configure_options: ["--enable-shared", "--disable-static", "--disable-python", "--with-libfuse=no", "--build=aarch64-unknown-linux-gnu", "--host=aarch64-unknown-linux-gnu"]
  dependencies:
    - zlib/1.3.2

tests:
  upstream:
    framework: autotest（make check 构建期内嵌真跑）
    total: 78
    suites: "test_glob 1、test_library_write 1、test_macros 2、test_manpages 1、test_python_module 2、test_tools 4、test_tools_write 17"
  consumer:
    framework: 自研消费者测试（test_package）
    total: 65
    files: "test_libewf.c（35 检查点）+ test_ohos.c（30 检查点，OHOS 特有 TMPDIR/装载路径）"

platform_adaptations:
  - "E011：随包 configure 内 umask 077 → 022（HMDFS）"
  - "config.guess 无法识别 HarmonyOS，--build/--host 显式 aarch64-unknown-linux-gnu"
  - "CONFIG_SHELL 显式 /data/service/hnp/bin/bash 启动 configure（HMDFS）"
  - "autom4te 取 OHOS hnp 工具链（autoconf 2.72）驱动 autotest 上游测试"
  - "--disable-python（pyewf 绑定不入交付面）+ --with-libfuse=no（ewfmount 降级）"

task_card: 15015
