# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游清点口径（libyal libewf 20260924，autotest 框架）：
# tests/*.at 由 autom4te 生成套件脚本，check-local 驱动执行。
# 实测运行面（本机 make check，日志为准）：test_library 61 项、
# test_tools 17 项；其余套件（glob/manpages/macros/python/write）在
# --disable-python 与 input 夹具缺失形态下不展开。
# OHOS 平台差异由 conandata 声明的两个 portability patch 处理：
# ①tmpfile(3) 硬编码只读 /tmp → TMPDIR mkstemp 替身；
# ②日期 xheader 时区串 +01:00 (CET) 格式适配（TZ 由配方钉 CET）。

package: libewf/20260924
homepage: https://github.com/libyal/libewf

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check（autotest：autom4te 由 OHOS hnp 工具链提供，LD_LIBRARY_PATH 注入构建树 .libs）"

upstream_tests:
  - name: "test_library（autotest 套件）"
    source: tests/test_library.at
    description: "库测试套件：RUN_TEST_BINARIES 展开 61 个库级测试程序用例（含 ewf_test_header_values——OHOS 下由 0002 patch 适配时区串格式）"
    command: "./tests/test_library"
  - name: "test_tools（autotest 套件）"
    source: tests/test_tools.at
    description: "工具函数测试套件：17 个用例（ewf_test_tools_info_handle / ewf_test_tools_output 的 tmpfile() 在 OHOS 下由 0001 patch 走 TMPDIR mkstemp 替身）"
    command: "./tests/test_tools"

test_package_tests:
  - file: test_libewf.c
    description: "通用消费者断言：版本串（守卫：NULL 即失败返回）、access flags、codepage、EWF 签名正反探测、合成 EWF 镜像全链路写读回（含边界/尾部/EOF/错误路径/生命周期）（35 项断言）"
    command: "./test_libewf"
  - file: test_ohos.c
    description: "鸿蒙专项消费者测试：__OHOS__ 目标、TMPDIR 语义（守卫：NULL 即失败返回）、TMPDIR 下合成压缩 EWF 全链路（deflate/zlib）读回、跨扇区/尾部读、EOF、错误路径、生命周期（30 项断言）"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "ohos-consumer-tests"
    description: "test_ohos.c：TMPDIR 语义 + 压缩 EWF 全链路读回（OHOS 专项）"
    command: "./test_ohos"
    assertions: 30
    platform: OHOS
  - name: "generic-consumer-tests"
    description: "test_libewf.c：版本/access/codepage/签名/写读回全链路（平台无关，OHOS 上同样编译运行）"
    command: "./test_libewf"
    assertions: 35

assertion_count: 65
