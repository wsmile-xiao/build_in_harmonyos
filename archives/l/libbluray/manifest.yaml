software: libbluray
display: "libbluray"
description: "Blu-ray disc access library for media players"
category: multimedia
homepage: "https://www.videolan.org/developers/libbluray.html"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "E072: config.sub 需添加 ohos 操作系统支持（maybe_os + kernel-os 白名单）"
    - "E011: HMDFS umask 077 权限问题，需改为 umask 022"
    - "configure --disable-bdjava-jar 绕过 ant 依赖"
  common_dependencies:
    - libxml2
    - freetype2
    - fontconfig

versions:
  - version: "1.3.4"
    status: built
    build_date: "2026-05-20"