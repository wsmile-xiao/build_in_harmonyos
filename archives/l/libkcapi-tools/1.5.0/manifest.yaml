# 版本级 manifest
# 文件位置: archives/l/libkcapi-tools/1.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.0"

# 软件名
software: "libkcapi-tools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 URL，与 conandata.yml 一致）
  url: "https://github.com/smuellerDD/libkcapi/archive/refs/tags/v1.5.0.tar.gz"

  # 源码校验和
  sha256: "f1d827738bda03065afd03315479b058f43493ab6e896821b947f391aa566ba0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（conanfile.py 内 AutotoolsToolchain.configure_args）
  configure_options:
    - "--disable-werror"
    - "--disable-kcapi-test"
    - "--disable-kcapi-speed"
    - "--enable-kcapi-hasher"
    - "--enable-kcapi-rngapp"
    - "--enable-kcapi-encapp"
    - "--enable-kcapi-dgstapp"
    - "ac_cv_path_OPENSSL="

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lib-kcapi-kernel-if.c.patch"
  - "0002-ohos-stdbool-compat.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "同源自包含 -tools 子包：apps/ 静态链 in-tree libkcapi.la，DT_NEEDED 仅 libc.so，配方不 requires libkcapi（先例 libfreeaptx-tools）"
  - "E091 sockaddr_storage 冲突可用无条件 #define/#undef 宏守卫绕过 include 解决，无需平台宏（规避 R8），glibc 下为无害 no-op"
  - "工具侧 stdbool 冲突在 apps/app-internal.h（0002 补丁与 base 包共用）"
  - "kcapi-hasher install-exec-hook 用 ln -srf 建 pkglibexec 符号链接，toybox 可用；package() 白名单裁剪掉 pkglibexec/静态库/头文件，避免双归属"
  - "ac_cv_path_OPENSSL= 阻止构建机 openssl 探测，否则 make install 会生成 .kcapi-hasher.hmac 垃圾文件"
