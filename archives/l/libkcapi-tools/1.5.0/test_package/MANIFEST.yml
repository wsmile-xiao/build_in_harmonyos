# test_package/MANIFEST.yml
# libkcapi-tools 1.5.0 — 上游测试清点（R51）与 test_package 说明
package: libkcapi-tools/1.5.0
homepage: "https://github.com/smuellerDD/libkcapi"

# 上游 test/ 目录自带测试套件（test.sh 主套件 + 工具专项脚本），
# 但所有用例的密码学操作都走内核 AF_ALG socket。
upstream_check_command: "cd test && KCAPI_TEST_LOCAL=1 ./test.sh"
upstream_test_in_build: false
upstream_test_command: "test/test.sh; test/hasher-test.sh; test/kcapi-dgst-test.sh; test/kcapi-enc-test.sh; test/kcapi-enc-test-large.sh"

# 上游测试清单（清点口径：脚本调用点；全部依赖 AF_ALG 运行时能力）。
# 2026-09-26 真机实跑记录：4 个脚本全部以 --enable-kcapi-test 完整构建的
# 上游测试程序 bin/kcapi 原样驱动，未修改任何上游测试文件。
# 实测标记数（脚本内部按字节数/密钥长度循环展开，大于清点口径）：
#   test.sh 0/225 PASS；hasher-test.sh 18/182；kcapi-dgst-test.sh 64/384；
#   kcapi-enc-test.sh 120/483；kcapi-enc-test-large.sh 上游自停用(DEACTIVATED)。
#   合计 1275 标记：202 形式 PASS（全部为退化通过：负路径用例或期望/实际
#   输出同时为空），1072 FAIL——正向密码学用例 0 通过，全部失败于
#   "AF_ALG: bind failed (errno: -13)"。完整日志与逐条分析见
#   reports/upstream-test-execution.md（含 5 份脚本日志 sha256）。
upstream_tests:
  - file: "test/test.sh"
    cases: 225
    description: "主套件：hash/hmac/hkdf/skcipher/aead/rng 全量内核 crypto 用例（实跑 225/225 FAIL）"
    runnable_on_ohos: false
    reason: "每个用例都要 socket(AF_ALG)+bind()；OHOS SELinux 策略对非特权进程 bind(AF_ALG) 一律 EACCES/EPERM（2026-09-26 本机复验 hash/skcipher/rng/aead 四类全拒 + /proc/crypto 不存在，无 root 不可修复）"
  - file: "test/hasher-test.sh"
    cases: 23
    description: "kcapi-hasher 工具专项（实跑展开 182 标记：18 形式 PASS / 164 FAIL）"
    runnable_on_ohos: false
    reason: "同上：hasher 校验和经 AF_ALG hash 接口完成；18 个 PASS 全为负路径退化通过"
  - file: "test/kcapi-dgst-test.sh"
    cases: 16
    description: "kcapi-dgst 工具专项（实跑展开 384 标记：64 形式 PASS / 320 FAIL）"
    runnable_on_ohos: false
    reason: "同上：dgst 摘要经 AF_ALG hash 接口完成；64 个 PASS 全为退化通过（期望/实际同时为空）"
  - file: "test/kcapi-enc-test.sh"
    cases: 19
    description: "kcapi-enc 工具专项（实跑展开 483 标记：120 形式 PASS / 363 FAIL）"
    runnable_on_ohos: false
    reason: "同上：enc 加解密经 AF_ALG skcipher/aead 接口完成；120 个 PASS 全为退化通过"
  - file: "test/kcapi-enc-test-large.sh"
    cases: 1
    description: "kcapi-enc 大文件加解密（实跑：上游 libtest.sh wordsize 检测 DEACTIVATED，未执行）"
    runnable_on_ohos: false
    reason: "上游自身停用（[: too many arguments 检测缺陷，与 OHOS 无关）；即使启用仍依赖 AF_ALG"
  - file: "test/kcapi-fuzz-test.sh"
    cases: 0
    description: "模糊测试（需 libFuzzer/clang fuzzing，上游默认不启用）"
    runnable_on_ohos: false
    reason: "需 fuzzing 工具链，且被测逻辑仍依赖 AF_ALG"

# 上游测试在 OHOS 真机上的实测结果（2026-09-26，rule4 复审回应）：
# 实跑 1275 标记，202 形式 PASS（全部为退化通过，无正向密码学验证），
# 1072 FAIL，正向用例 0 通过——根因 AF_ALG 内核接口被 SELinux 策略层
# 全面封锁（socket() 成功、bind() EACCES，/proc/crypto 不存在，无 root、
# 无 KVM/qemu/docker 替代内核环境）。属平台能力限制而非适配缺陷。
# 逐条证据与完整日志：reports/upstream-test-execution.md；
# 根因鉴别实验（对照 strace、/proc/crypto、内核配置检查）见
# archives/l/libkcapi/1.5.0/notes.md（2026-09-16 基线）。

# R34: test_package 必须真跑被测二进制。
test_package_tests:
  - file: test.sh
    description: >-
      ①四个工具均在 PATH 上且可执行；②版本契约：kcapi-dgst/kcapi-enc/
      kcapi-rng --version 与 kcapi-hasher -v、--version 退出码 0 且输出
      含 1.5.0（仅调用用户态 kcapi_versionstring() API，不触碰 AF_ALG）；
      ③上游 --help 契约：三个 getopt_long 工具 --help 退出码 1（usage()
      以 exit(1) 收尾是上游设计，回归守卫防止工具链"顺手修掉"）；
      ④自包含断言：四个二进制的动态段均不得出现 libkcapi（静态链
      in-tree libkcapi.la）；⑤反例：未知选项必须以非 0 退出；
      ⑥加载性断言：四个二进制均携带 .codesign 段（OHOS 加载要求）
    command: "bash test.sh"

assertion_count: 15
