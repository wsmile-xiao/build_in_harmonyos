software: libkcapi-tools
display: "libkcapi-tools"
description: "Linux Kernel Crypto API User Space Command Line Tools (kcapi-dgst/kcapi-enc/kcapi-rng/kcapi-hasher)"
category: security
homepage: "https://github.com/smuellerDD/libkcapi"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "工具与 libkcapi 同源：从 apps/ 目录条件编译（--enable-kcapi-hasher/rngapp/encapp/dgstapp），静态链 in-tree libkcapi.la，自包含（DT_NEEDED 仅 libc.so），故本包不 requires libkcapi"
    - "工具侧同样需要 sockaddr_storage 重命名守卫补丁（E091）与 stdbool.h 兼容补丁（apps/app-internal.h）"
    - "运行时 AF_ALG 受 SELinux 策略限制（bind EPERM），--version/-v 可用，真加密/摘要操作在真机上报 EPERM，属平台能力限制"
    - "package() 白名单裁剪：只保留 4 个工具二进制与 man 页，排除 libkcapi 包专有的静态库/头文件/pkgconfig/pkglibexec 符号链接"
  common_dependencies: []

versions:
  "1.5.0":
    status: built
    build_date: "2026-09-25"
