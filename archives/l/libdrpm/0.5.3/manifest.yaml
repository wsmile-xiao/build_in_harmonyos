version: "0.5.3"
software: "libdrpm"
status: built
build_date: "2026-09-19"
build_system: cmake

source:
  url: "https://github.com/rpm-software-management/drpm/archive/refs/tags/0.5.3.tar.gz"
  sha256: "33b6337a07af2874835321d802c62cca0e6bd8ae18c4534ce1fe68f7bcf762bc"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF (static default: stale system libdrpm.so.0 + sandbox dlopen Permission denied)"
    - "-DENABLE_TESTS=ON"
    - "-DWITH_ZSTD=ON"
    - "-DHAVE_LZLIB_DEVEL=ON (vendored lzlib 1.15 static liblz.a, same CMake compiler; full 19/19, no gaps)"
  dependencies:
    - "rpm/6.0.2"
    - "popt/1.16"
    - "zlib/1.3.1.1"
    - "bzip2/1.0.8"
    - "xz/5.6.2"
    - "openssl/3.5.6"
    - "zstd/1.5.6"
    - "cmocka/2.0.2 (test_requires)"
    - "vendored lzlib 1.15 (BSD-2-Clause, lzlib-vendored/lzlib.c single-TU, built with CMake compiler to build_folder/lzlib-prefix, no registry package)"
  cc: clang
  cxx: clang++
  compiler: clang
  parallelism: 1

patches_applied:
  - "0001-src-cmakelists-shared-option.patch"
  - "0002-test-cmocka-commas.patch"
  - "0003-test-read-deltas-count.patch"

patch_classification:
  - file: "0001-src-cmakelists-shared-option.patch"
    type: portability
    platform_only: false
    guard: "No platform macro; lets BUILD_SHARED_LIBS decide static vs shared instead of hardcoded SHARED"
  - file: "0002-test-cmocka-commas.patch"
    type: portability
    platform_only: false
    guard: "Test-only; adds missing commas between conditionally compiled cmocka registrations when both HAVE_LZLIB_DEVEL and WITH_ZSTD are ON"
  - file: "0003-test-read-deltas-count.patch"
    type: portability
    platform_only: false
    guard: "Test-only; sizes read_deltas GC arrays for 7 read tests (base 5 + lzip + zstd), no platform macro"

knowledge_gained:
  - "libdrpm 0.5.3 is a CMake C99 library; upstream hardcodes add_library(drpm SHARED), so one build-system patch makes it honor BUILD_SHARED_LIBS."
  - "Upstream pkg_check_modules needs rpm, libcrypto and libzstd; PkgConfigDeps plus PKG_CONFIG_PATH to the generators folder satisfies it, with an xz.pc to liblzma.pc alias for FindLibLZMA."
  - "Upstream tests are 19 cmocka macros inside drpm_api_tests (make 7 + read 7 + check 1 + apply 4, incl. 3 lzip-guarded) plus drpm_cmp_files shell harness; both ctest wrappers run with ENABLE_TESTS=ON, marker counts macros (gtest_macros)."

validation:
  upstream_tests:
    command: "ctest --output-on-failure (drpm_api_tests cmocka 19 macros + drpm_cmp_files shell harness)"
    suites: 4
    total_audited: 19
    count_method: "gtest_macros (cmocka_unit_test in test/drpm_api_tests.c: make 7 + read 7 + check 1 + apply 4 = 19; ctest -N 2 wrappers are not units)"
    passed: "pending-preflight"
    failed: "pending-preflight"
    executed_expected: 19
    skipped_expected: 0
    gaps: "none (vendored lzlib 1.15 enables 3 lzip cases; 19/19, status passed consistent)"
    shell_harness: "drpm_cmp_files.sh via ctest drpm_cmp_files, fully run and must Pass (supplementary, not in 19-count)"
    note: "Source-static 19 macros; runtime WITH_ZSTD=ON HAVE_LZLIB_DEVEL=ON (vendored lzlib) => 19 [ OK ] + shell Passed."
  conan_create:
    command: "conan create archives/l/libdrpm/0.5.3 -pr:h=<ohos-aarch64-profile> -pr:b=<ohos-aarch64-profile> --build=missing"
    result: pending-preflight
  test_package:
    command: "./test_drpm"
    assertions: 7
    result: pending-preflight
