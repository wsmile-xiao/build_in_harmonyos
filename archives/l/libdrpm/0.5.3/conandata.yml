  - patch_file: "patches/0003-test-read-deltas-count.patch"
    patch_description: "size read_deltas GC arrays for 7 read tests when both HAVE_LZLIB_DEVEL and WITH_ZSTD are ON (base 5 + lzip + zstd); avoids heap overflow and SIGTRAP in drpm_read/drpm_check_sequence groups"
    patch_type: "portability"
