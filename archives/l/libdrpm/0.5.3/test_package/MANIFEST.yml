package: libdrpm/0.5.3
homepage: "https://github.com/rpm-software-management/drpm"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "0.5.3.tar.gz"
  source_sha256: "33b6337a07af2874835321d802c62cca0e6bd8ae18c4534ce1fe68f7bcf762bc"
  build_system: "CMake"
  test_definition: "test/drpm_api_tests.c holds 19 cmocka_unit_test macros (make 7 + read 7 + check 1 + apply 4, incl. 3 lzip-guarded); test/CMakeLists.txt registers 2 ctest wrappers (drpm_api_tests binary + drpm_cmp_files shell); drpm_memcheck only when valgrind exists"
  dependency: "cmocka/2.0.2 (test_requires) + vendored lzlib 1.15 (BSD-2-Clause, lzlib-vendored/, single lzlib.c, no registry package)"
  portability_changes:
    - "src/CMakeLists.txt honors BUILD_SHARED_LIBS instead of hardcoded SHARED (build-system only, no platform macro)"
  examples_note: "No separate examples; coverage comes from the upstream cmocka suites plus the shell harness and the test_package consumer."
  counting_unit: "cmocka macro (cmocka_unit_test, gtest_macros口径); ctest entries are wrappers, not units"
  verification: "grep -c 'cmocka_unit_test(' test/drpm_api_tests.c => 19 (make 5+1 zstd+1 lzip=7, read 5+1+1=7, check 1, apply 2+1+1=4); grep -c '#ifdef HAVE_LZLIB_DEVEL' => 3 lzip guards; ctest -N => 2 wrappers (drpm_api_tests + drpm_cmp_files); runtime WITH_ZSTD=ON HAVE_LZLIB_DEVEL=ON (vendored lzlib 1.15) => 19 macros compiled in"
  runtime_breakdown: "source 19 macros -> executed 19 (make 7 + read 7 + check 1 + apply 4, all [ OK ]), skipped 0 (vendored lzlib 1.15 enables 3 lzip cases); shell harness drpm_cmp_files.sh executed separately via ctest and must Pass (not a macro, out of 19-count)"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - test_name: "drpm_make group"
    target: "drpm_api_tests (make_* macros)"
    source: "test/drpm_api_tests.c (cmocka_unit_test make_nodiff/make_identity/make_rpmonly/make_standard/make_rpmonly_noaddblk + zstd + lzip)"
    total: 7
  - test_name: "drpm_read group"
    target: "drpm_api_tests (read_* macros)"
    source: "test/drpm_api_tests.c (cmocka_unit_test read_nodiff/read_identity/read_rpmonly/read_standard/read_rpmonly_noaddblk + zstd + lzip)"
    total: 7
  - test_name: "drpm_check_sequence group"
    target: "drpm_api_tests (check_sequence macro)"
    source: "test/drpm_api_tests.c (cmocka_unit_test check_sequence)"
    total: 1
  - test_name: "drpm_apply group"
    target: "drpm_api_tests (apply_* macros)"
    source: "test/drpm_api_tests.c (cmocka_unit_test apply_standard/apply_rpmonly_noaddblk + zstd + lzip)"
    total: 4

upstream_test_total: 19
upstream_test_count_method: gtest_macros
upstream_test_passed: "pending-preflight"
upstream_test_failed: "pending-preflight"

test_package_tests:
  - file: test_drpm.c
    scenario: "consumer-api"
    description: "Conan consumer links the static package and exercises drpm_make_options_init/set_type/set_version/set_delta_comp/destroy and distinct drpm_strerror strings (7 ok: lines); no runtime .so lookup."
    command: "./test_drpm"
    assertions: 7

assertion_count: 7
