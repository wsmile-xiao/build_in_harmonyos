category: library
homepage: "https://github.com/max0x7ba/atomic_queue"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "header-only：仅安装 include/atomic_queue/*.h，无编译产物"
    - "defs.h 原生支持 __aarch64__（yield 指令），非 x86 下 ATOMIC_QUEUE_FULL_THROTTLE 用 atomic 而非 asm barrier"
    - "上游测试依赖 Boost.Test 与外部仓库；test_package 用 13 项覆盖核心 API（FIFO、try_push/pop、RetryDecorator、move-only、3P/3C 压力）"
  common_dependencies: []

