software: libpostal
version: 1.1
status: built
build_system: autotools
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - --disable-sse2
dependencies: []
build_date: 2026-05-26
compiler: clang-15
platform: aarch64-unknown-linux-ohos

artifacts:
  package: libpostal-1.1-ohos-aarch64.tar.gz
  package_size: 46639586
  debug_package: libpostal-1.1-ohos-aarch64-debug.tar.gz
  debug_size: 10000908

install_files:
  bin:
    - libpostal
  lib:
    - libpostal.la
    - libpostal.so
    - libpostal.so.0
    - libpostal.so.0.0.0
    - libscanner.la
    - libscanner.so
    - libscanner.so.0
    - libscanner.so.0.0.0

notes:
  - 需禁用 SSE2 选项 (--disable-sse2)，因为 ARM 架构不支持 x86 SSE 指令集
  - autotools 构建系统
  - 地址解析库