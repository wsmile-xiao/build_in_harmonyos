# 版本级 manifest — lfortran 0.64.0
# 遵循 ARCHIVE-SPEC v3.0

version: "0.64.0"
software: "lfortran"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）—— 真机 conan create 验证通过之日回填
build_date: "2026-09-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/lfortran/lfortran/archive/refs/tags/v0.64.0.tar.gz"
  sha256: "1826dd1e94d0ea1a95de2806164172064cd1f4cba8e2c3c96a5f3fe812ae5290"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DWITH_LLVM=yes"
    - "-DWITH_TARGET_AARCH64=yes"
    - "-DWITH_JSON=yes"
    - "-DWITH_MLIR=no"
  dependencies:
    - "clang/22.1.8"
    - "zlib/1.3.2"
    - "zstd/1.5.7.1"
    - "rapidjson/1.1.0.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "patches/0001-musl-feenableexcept-fallback.patch"
    description: "feenableexcept 是 GNU/glibc 扩展，OHOS 的 musl 不提供；为 _lfortran_enable_fpe_traps 在 glibc 之外增加 ARMv8-A FPCR 直写回退（__GLIBC__/__aarch64__ 守卫）"
  - file: "patches/0002-lfortran-cxx-env-override.patch"
    description: "cpp 后端 system() 硬编码调用 g++（-c 编译与链接两处）无环境变量覆盖，与 cc 的 LFORTRAN_CC 不对称 → 对称新增 LFORTRAN_CXX 环境变量覆盖（未设回退 g++）"
  - file: "patches/0003-relocatable-share-install-dir.patch"
    description: "install(DESTINATION ${CMAKE_INSTALL_PREFIX}/share/lfortran) 在 configure 期烘焙绝对前缀，--prefix 无法重定向、非 root 必败 → 改相对 share/lfortran，安装可重定位"
  - file: "patches/0004-nested-runtime-install-prefix.patch"
    description: "postinstall 嵌套 cmake --install <build>/src/runtime 未传 --prefix，嵌套树回退默认前缀 /usr/local → 透传 --prefix，嵌套 .mod 随外层前缀落位"
  - file: "patches/0005-lfortran-gcc-env-override.patch"
    description: "c 后端 system() 硬编码调用 gcc 编译 .tmp.c 并链接（两处）无环境变量覆盖 → 对称新增 LFORTRAN_GCC 环境变量覆盖（未设回退 gcc）"
  - file: "patches/0006-complex32-bindc-c99-hfa-abi.patch"
    description: "complex32(kind 4) 非 Windows 平台 bind(c) 按值传递 ABI 由 <2 x float> 向量统一为 C99 float _Complex HFA（返回 {float,float}/实参 [2 x float]），修复 aarch64 上运行时复数数学包装与 bind(c) 按值复数实部虚部错位（集成套件 11 条失败）；x86-64 SysV SSE 分类等价、行为零变化"
  - file: "patches/0007-c-backend-rng-init-musl.patch"
    description: "c 后端生成 main 仅调 _lpython_set_argv 未初始化随机数种子，OHOS musl 无 srand 时首次 rand() 返回 0（glibc 首次约 2.2e-5 侥幸掩盖）→ random_number 首值恒 0.0、集成测试 intrinsics_74（c 后端）必败；单行改调 _lpython_call_initial_functions（与 llvm 后端 main 同构，含 srand(0)），双后端随机序列一致"
# ============================================================
# 测试
# ============================================================

