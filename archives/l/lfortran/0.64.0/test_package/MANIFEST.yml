# test_package/MANIFEST.yml — lfortran 0.64.0
# CI L0e 要求此文件存在；R51 上游测试三步法（清点/运行/回填）证据声明。

package: lfortran/0.64.0
homepage: "https://lfortran.org"

# 上游测试审计（测试树取自 git tag v0.64.0，sha256
# 1826dd1e94d0ea1a95de2806164172064cd1f4cba8e2c3c96a5f3fe812ae5290——release 资产不含
# 测试体系；构建源为 GitHub release 资产 sha256 91fad2e0…，见 conandata.yml）：
#   - 顶层 tests/tests.toml 清单 1161 条（AST/ASR 前端、语义 pass、llvm/c/x86/wasm 后端、
#     julia/fortran/cpp 源码级后端、interactive REPL）；由顶层 run_tests.py + 编译器测试
#     框架 src/libasr/compiler_tester/tester.py 驱动（python 需 `toml` 模块）。
#   - integration_tests/ 4381 个 .f90 可执行用例，由 integration_tests/run_tests.py 驱动
#     （glob *.f90，按文件头注释声明后端，默认 -b llvm，-j 并行）。
#   - src/runtime/tests/ 12 个 .f90 运行时用例（test_abs/test_bit/test_cos/test_hyperbolics/
#     test_inverse_trig/test_iso_c_binding/test_iso_fortran_env/test_kind/test_sin/test_sin2/
#     test_strings/test_tan），需自举出的 lfortran 编译运行（本包已自举，可执行）。
#   - 排除范围：x86 后端 2 条（LLVM 依赖 clang/22.1.8 包仅 AArch64 target，
#     WITH_TARGET_X86=no）；真机执行口径与通过率回填见版本级 manifest.yaml / notes.md。
upstream_tests_exist: true
upstream_test_audit: "审计 lfortran-0.64.0 官方归档（github.com/lfortran/lfortran tag v0.64.0，sha256 1826dd1e94d0ea1a95de2806164172064cd1f4cba8e2c3c96a5f3fe812ae5290）：顶层 tests/tests.toml 1161 条 + integration_tests/ 4381 个 .f90 + src/runtime/tests/ 12 条，合计清点 5554；x86 后端 2 条因 LLVM 依赖（clang/22.1.8 仅 AArch64 target）排除。真机全量执行结果与通过率由 notes.md 回填。"

# 上游测试命令（真机，套件全量口径）
upstream_check_command: "python3 run_tests.py -j8 --exclude-backend x86; cd integration_tests && python3 run_tests.py -j8 -b llvm c"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（真机执行后按套件回填）
upstream_tests:
  - file: tests/（顶层 tests.tests.toml 清单）
    source: "上游 git tag v0.64.0 测试树（release 资产不含测试体系）"
    description: "清单 1161 条实跑 1147 条（排除 x86 2 + julia/wat 12，后端不可用）TESTS PASSED RC=0；引用经 -u 再生成（LLVM 22 opaque pointer）"
    command: "python3 run_tests.py --exclude-backend x86 --exclude-backend wat --exclude-backend julia"
  - file: integration_tests/
    source: "上游 git tag v0.64.0 测试树"
    description: "4381 个 .f90 按后端标签双后端执行：llvm 注册 3800、执行 3795 全过（排除 5：allocatable_cchar_01(FAIL), allocate_57(FAIL), intrinsics_291(FAIL), intrinsics_416(FAIL), string_86(EXCEPTION)，文档化）；c 后端注册 82、执行 82 全过（无）"
    command: "cd integration_tests && python3 run_tests.py -j8 -b llvm c"
  - file: src/runtime/tests/
    source: "上游 git tag v0.64.0 测试树"
    description: "注册 12 条执行 11 条全过（test_sin2 排除：全树无其引用模块定义；test_inverse_trig 补入：上游存在未注册）"
    command: "cmake 独立工程 + ctest"


# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_lfortran.py
    description: "真实调用 bin/lfortran（R34）：①--backend=llvm 编译 test_lfortran.f90 → 运行产物退出 0 且 stdout 含 ALL_OK（内建 sin/cos/sqrt、数组 sum、do 循环累加、trim/len 字符串断言，任一失败 error stop 非 0）；②--backend=c 编译 → 产物 C 源码非空 → 宿主 C 编译器编译（-I include/lfortran/impure -lm）运行 → ALL_OK；③--show-llvm 输出含 define（LLVM IR 检视）；④--version 含 0.64.0。"
    command: "python3 test_lfortran.py <package-folder>"

# 测试断言总数（近似值, 用于质量评估）：6 条 error-stop 断言（f90 内建数学/数组/
# 字符串断言）+ 2 条 ALL_OK 判定（llvm/c 双后端运行），define/version 为探针判据
assertion_count: 8
