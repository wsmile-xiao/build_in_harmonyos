# conandata.yml — lfortran 0.64.0
#
# 源：GitHub release 资产 lfortran-0.64.0.tar.gz（tag 归档缺 build0.sh 的 7 个生成产物、
#     无法构建，release 资产为上游发行流程产物、开箱可构建，见 notes.md）。
# sha256 双源核对：
#   - conda-forge lfortran-feedstock @ 625e97e0（"LFortran 0.64.0"）meta.yaml 记录
#     release 资产 sha256 = 91fad2e020d046f2ec8db767584b487d982172798eb2de89788f111afa3a6b92；
#   - 本地两次独立下载 release 资产核验与 feedstock 值精确一致。

sources:
  url: https://github.com/lfortran/lfortran/releases/download/v0.64.0/lfortran-0.64.0.tar.gz
  sha256: 91fad2e020d046f2ec8db767584b487d982172798eb2de89788f111afa3a6b92
patches:
  0.64.0:
  - patch_file: patches/0001-musl-feenableexcept-fallback.patch
    patch_description: 为 glibc 之外的 libc（OHOS 用 musl，不提供 GNU 扩展 feenableexcept）提供 ARMv8-A
      FPCR 直写回退，消除 _lfortran_enable_fpe_traps 的未定义符号（与 archives/l/lfortran-runtime/0.61.0
      已合入补丁同源：上游 0.61.0→0.64.0 该代码段未变，仅行号偏移）
    patch_type: portability
  - patch_file: patches/0002-lfortran-cxx-env-override.patch
    patch_description: cpp 后端经 system() 硬编码调用 g++ 编译生成的 .cpp（无环境变量覆盖，与 cc 的 LFORTRAN_CC
      上游覆盖不对称）→ 对称新增 LFORTRAN_CXX 环境变量覆盖（两处调用点：-c 编译路径与链接路径），工具链无 g++ 别名时经环境注入指定编译器
    patch_type: portability
  - patch_file: patches/0003-relocatable-share-install-dir.patch
    patch_description: 'install(DESTINATION ${CMAKE_INSTALL_PREFIX}/share/lfortran)
      在 configure 期把默认 /usr/local 前缀烘焙成绝对路径，cmake --install --prefix <任意非 /usr/local
      目录> 无法重定向、非 root 环境 install 必败（真机 conan create package() 实录 file cannot create
      directory: /usr/local/share/lfortran）→ DESTINATION 改相对 share/lfortran，install
      期随 --prefix 解析，安装可重定位'
    patch_type: portability
  - patch_file: patches/0004-nested-runtime-install-prefix.patch
    patch_description: '外层 install 的 postinstall 步骤（cmake/postinstall/BuildRuntime.cmake）嵌套执行
      cmake --install <build>/src/runtime 时未传 --prefix → 嵌套树回退自身 configure 期默认前缀 /usr/local，运行时
      .mod 安装（DESTINATION ${CMAKE_INSTALL_PREFIX}/lib）写 /usr/local/lib 必败（真机实录 file
      cannot create directory: /usr/local/lib）→ 透传 --prefix "${CMAKE_INSTALL_PREFIX}"，嵌套安装随外层
      --prefix 解析，安装可重定位'
    patch_type: portability
  - patch_file: patches/0005-lfortran-gcc-env-override.patch
    patch_description: c 后端（--backend=c）经 system() 硬编码调用 gcc 编译生成的 .tmp.c 并链接（两处调用点：compile_to_binary
      的 -c 编译路径与 link_executable 的链接路径，均无环境变量覆盖，与 cc 的 LFORTRAN_CC 上游覆盖不对称）→ 对称新增
      LFORTRAN_GCC 环境变量覆盖，工具链无 gcc 时经 runenv_info 注入指定编译器（clang 驱动按扩展名兼容 .c）
    patch_type: portability
  - patch_file: patches/0006-complex32-bindc-c99-hfa-abi.patch
    patch_description: complex32(kind 4) 复数在非 Windows 平台的 bind(c) 按值传递 ABI 从 <2 x
      float> 向量统一为 C99 float _Complex HFA(返回 {float,float}、实参 [2 x float]),与 macOS_ARM
      既有分支一致。aarch64 上 C99 complex 实参/返回走 d0,d1 双寄存器,而 LLVM 向量只占单寄存器,导致运行时复数数学包装(_lfortran_ctan
      等)与 bind(c) 按值复数调用实部虚部错位(OHOS 真机集成测试 intrinsics_04s/18c/49/212/264/265/266/295
      共 8 条 + bindc_iso_fb_01/05、modules_15 共 11 条失败);x86-64 SysV 对 {float,float}、[2
      x float]、<2 x float> 三者 SSE 分类相同(xmm0),行为不变。
    patch_type: portability
  - patch_file: patches/0007-c-backend-rng-init-musl.patch
    patch_description: c 后端生成的主函数只调 _lpython_set_argv 不初始化随机数种子,首次 rand() 依赖 libc 默认种子;OHOS musl 无 srand 时首次 rand() 返回 0(glibc 首次约 2.2e-5 侥幸掩盖)→ random_number 首值恒 0.0,集成测试 intrinsics_74(c 后端)断言首值非零必败;改为与 llvm 后端一致的 _lpython_call_initial_functions(set_argv + _lfortran_init_random_clock=srand(0) 确定性种子),双后端随机序列一致
    patch_type: portability
