# 软件级 manifest — lfortran
# 遵循 ARCHIVE-SPEC v3.0

software: lfortran
display: "LFortran"
description: "LFortran — LLVM 系现代 Fortran 编译器（ASR 中间表示 + LLVM/C/C++/WASM 多后端），含自举式 Fortran 运行时模块"
category: system
homepage: "https://lfortran.org"
license: BSD-3-Clause
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "LLVM 依赖复用 clang/22.1.8 包（LLVM_BUILD_LLVM_DYLIB=ON 聚合 libLLVM.so；dylib 模式不导出 LLVMCore 组件目标，lfortran 自动回退链接 libLLVM.so）"
    - "真机原生编译：不设 CMAKE_SYSTEM_NAME + Platform/HarmonyOS.cmake 桩（include Platform/Linux）补 cmake 平台模块缺失，保持 CMAKE_CROSSCOMPILING=FALSE"
    - "自举链路：主构建产出 lfortran 后，嵌套 cmake 以之为 CMAKE_Fortran_COMPILER 编译 Fortran 运行时模块（--backend=cpp）；自举期需 LD_LIBRARY_PATH 注入 libLLVM.so"
    - "嵌套 configure 上游硬编码参数清单、不带 C/CXX 编译器 → 经环境变量 CMAKE_C_COMPILER/CMAKE_CXX_COMPILER 注入"
    - "zlib/zstd 静态链接（USE_DYNAMIC_*=no 默认 + 系统同名库静态 R26）"
    - "OHOS XPM：包内 bin/lfortran 与 lib/*.so 需 binary-sign-tool 自签"
    - "x86 后端依赖 LLVM X86 target（clang 包仅 AArch64）→ WITH_TARGET_X86=no"
  common_dependencies:
    - "clang/22.1.8"
    - "zlib/1.3.2"
    - "zstd/1.5.7.1"
    - "rapidjson/1.1.0.1"

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.64.0":
    status: built
    build_date: "TBD"
    conan_ref: "lfortran/0.64.0"
    note: "首个适配版本（HarmonyOS PC aarch64，LLVM 后端完整编译器）"
