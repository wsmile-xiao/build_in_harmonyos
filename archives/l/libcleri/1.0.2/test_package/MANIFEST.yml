# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcleri/1.0.2
homepage: "https://github.com/cesbit/libcleri"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cd test && bash ./test.sh"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（15 个 test_* 目录，共 179 个 _assert 断言）
upstream_tests:
  - file: test_choice/test_choice.c
    source: libcleri-1.0.2/test/test_choice/test_choice.c
    description: "choice 元素：most_greedy / first_match 行为"
    command: "./test_choice.out"
  - file: test_dup/test_dup.c
    source: libcleri-1.0.2/test/test_dup/test_dup.c
    description: "dup 元素复制与重复匹配"
    command: "./test_dup.out"
  - file: test_json_lang/test_json_lang.c
    source: libcleri-1.0.2/test/test_json_lang/test_json_lang.c
    description: "JSON 语言完整解析"
    command: "./test_json_lang.out"
  - file: test_keyword/test_keyword.c
    source: libcleri-1.0.2/test/test_keyword/test_keyword.c
    description: "keyword 元素关键字匹配"
    command: "./test_keyword.out"
  - file: test_list/test_list.c
    source: libcleri-1.0.2/test/test_list/test_list.c
    description: "list 元素列表解析"
    command: "./test_list.out"
  - file: test_optional/test_optional.c
    source: libcleri-1.0.2/test/test_optional/test_optional.c
    description: "optional 元素可选匹配"
    command: "./test_optional.out"
  - file: test_prio/test_prio.c
    source: libcleri-1.0.2/test/test_prio/test_prio.c
    description: "prio 元素优先级匹配"
    command: "./test_prio.out"
  - file: test_ref/test_ref.c
    source: libcleri-1.0.2/test/test_ref/test_ref.c
    description: "ref 元素循环引用"
    command: "./test_ref.out"
  - file: test_regex/test_regex.c
    source: libcleri-1.0.2/test/test_regex/test_regex.c
    description: "regex 元素基于 pcre2 的正则匹配"
    command: "./test_regex.out"
  - file: test_repeat/test_repeat.c
    source: libcleri-1.0.2/test/test_repeat/test_repeat.c
    description: "repeat 元素重复范围"
    command: "./test_repeat.out"
  - file: test_sequence/test_sequence.c
    source: libcleri-1.0.2/test/test_sequence/test_sequence.c
    description: "sequence 元素序列匹配"
    command: "./test_sequence.out"
  - file: test_thingsdb_lang/test_thingsdb_lang.c
    source: libcleri-1.0.2/test/test_thingsdb_lang/test_thingsdb_lang.c
    description: "ThingsDB 语言完整解析"
    command: "./test_thingsdb_lang.out"
  - file: test_token/test_token.c
    source: libcleri-1.0.2/test/test_token/test_token.c
    description: "token 元素分词匹配"
    command: "./test_token.out"
  - file: test_tokens/test_tokens.c
    source: libcleri-1.0.2/test/test_tokens/test_tokens.c
    description: "tokens 元素集合匹配"
    command: "./test_tokens.out"
  - file: test_version/test_version.c
    source: libcleri-1.0.2/test/test_version/test_version.c
    description: "版本号接口检查"
    command: "./test_version.out"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：clаeri_grammar/cleri_parse 解析 hi/bye 断言"
    command: "./test_libcleri"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 179