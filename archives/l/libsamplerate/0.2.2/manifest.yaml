status: success
build_system: cmake
created_at: 2026-04-20
knowledge_gained:
  - knowledge_id: libsamplerate-001
    title: CMake 版本兼容性处理
    description: libsamplerate 0.2.2 的 CMakeLists.txt 要求 CMake 版本 < 3.5，但现代 CMake 4.x 已移除对此的支持
    solution: 使用 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 参数绕过版本检查
    impact: 编译配置
    category: build_configuration
    discovered_at: 2026-04-20T23:02:00Z
    
  - knowledge_id: libsamplerate-002
    title: 无外部依赖编译
    description: libsamplerate 核心库无需任何外部依赖即可编译，sndfile、fftw3、ALSA 均为可选依赖
    solution: 直接使用 CMake 配置和编译，无需预先安装任何依赖库
    impact: 简化编译流程
    category: dependency_management
    discovered_at: 2026-04-20T23:02:00Z
    
  - knowledge_id: libsamplerate-003
    title: 静态库编译特性
    description: 默认编译输出为静态库 libsamplerate.a，大小约 1.4MB，适合嵌入式环境
    solution: 使用 CMAKE_INSTALL_PREFIX 指定安装路径
    impact: 库文件形式
    category: output_format
    discovered_at: 2026-04-20T23:03:00Z
    
  - knowledge_id: libsamplerate-004
    title: CTest 测试完整性
    description: 内置 13 个测试套件，涵盖 API、多声道、变速处理等所有核心功能，无需外部测试框架
    solution: 使用 make test 或 ctest -V 运行测试
    impact: 质量验证
    category: testing
    discovered_at: 2026-04-20T23:03:00Z
    
  - knowledge_id: libsamplerate-005
    title: pkg-config 集成
    description: 安装后自动生成 samplerate.pc 文件，支持 pkg-config 查询版本和编译参数
    solution: 使用 pkg-config --modversion samplerate 验证安装
    impact: 集成验证
    category: integration
    discovered_at: 2026-04-20T23:03:00Z
    
  - knowledge_id: libsamplerate-006
    title: CMake Config 文件生成
    description: 自动生成 SampleRateConfig.cmake 等 CMake 配置文件，便于 CMake 项目集成
    solution: 通过 find_package(SampleRate) 即可在 CMake 项目中使用
    impact: CMake 集成
    category: integration
    discovered_at: 2026-04-20T23:03:00Z
    
  - knowledge_id: libsamplerate-007
    title: 处理器裁剪能力检测失败
    description: CMake 配置时 CPU_CLIPS_POSITIVE 和 CPU_CLIPS_NEGATIVE 测试失败，但不影响编译
    solution: 库内部会使用安全的裁剪实现，无需特殊处理
    impact: 无实际影响
    category: platform_specific
    discovered_at: 2026-04-20T23:02:00Z
    
  - knowledge_id: libsamplerate-008
    title: 音频采样率转换算法
    description: libsamplerate 提供 5 种插值算法，从高质量 Sinc 插值（144dB SNR）到快速的线性插值
    solution: 根据质量/性能需求选择合适的 SRC_SINC_BEST_QUALITY 或 SRC_LINEAR
    impact: 使用选择
    category: algorithm
    discovered_at: 2026-04-20T23:03:00Z

