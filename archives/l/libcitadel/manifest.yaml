software: libcitadel
display: "libcitadel"
description: "Common code shared across the Citadel system"
category: library
homepage: "https://www.citadel.org/"
license: GPL-3.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 917 时代生成文件, 默认静态构建"
    - "仅依赖 zlib, 无其他 Citadel 全家桶依赖"
    - "2017 年 config.sub 需 --build/--host 覆盖兼容"
    - "HMDFS 下 umask 077 放宽为 022"
  common_dependencies:
    - zlib

versions:
  "917":
    status: built
    build_date: "2026-09-16"
