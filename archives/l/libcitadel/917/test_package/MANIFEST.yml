package: "libcitadel/917"
homepage: "https://www.citadel.org/"

upstream_check_command: "make -C tests (top-level Makefile wires no check target)"
upstream_test_in_build: true
upstream_test_command: "make -C tests && run tests/*_test CUnit binaries"

upstream_tests:
  - file: tests/
    source: "libcitadel_917.orig.tar.gz/tests/"
    description: "Upstream 917 ships a tests/ directory of CUnit programs (tests/Makefile + run_tests.sh); the top-level Makefile wires no check target, so the recipe builds tests/ explicitly (needs cunit/2.1-3) and runs each binary; exact case list pending device preflight readback"
    command: "make -C tests && run tests/*_test CUnit binaries"

test_package_tests:
  - file: test.c
    description: "StrBuf lifecycle plus hash Put/Get round-trip against the installed libcitadel"
    command: "./test_citadel"

assertion_count: 3
