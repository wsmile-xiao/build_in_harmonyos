sources:
  url: "https://github.com/johannesthoma/mmap_allocator/archive/adbfbe1.tar.gz"
  sha256: "3560A37C395C211A6A5D0C5871AC2A20231E4947C6233EAF951EC18E455DA181"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_type: "portability"
    patch_description: "Use Make variables for the toolchain and add an ELF SONAME so shared consumers can locate the library on HarmonyOS."
  - patch_file: "patches/0002-mmap_allocator.h.patch"
    patch_type: "portability"
    patch_description: "Share allocator mapping state across libc++ vector allocator copies and suppress default construction for mapped trivial objects."
  - patch_file: "patches/0003-mmappable_vector.h.patch"
    patch_type: "portability"
    patch_description: "Use public std::vector operations to size and release the mapped vector without libstdc++ private internals."
  - patch_file: "patches/0004-test_mmap_fixed.c.patch"
    patch_type: "portability"
    patch_description: "Reserve the complete MAP_FIXED remap range before replacing it, avoiding adjacent runtime mapping clobbering."
