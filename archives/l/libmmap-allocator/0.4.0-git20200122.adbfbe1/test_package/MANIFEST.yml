# test_package/MANIFEST.yml — libmmap-allocator 0.4.0-git20200122.adbfbe1

package: libmmap-allocator/0.4.0-git20200122.adbfbe1
homepage: "https://github.com/johannesthoma/mmap_allocator"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - name: test_allocator
    description: "Upstream allocator, vector, exception, mapping pool, conversion, remap, and persistence regression suite"
    source: test_allocator.cpp
    command: "make test"
  - name: test_mmap_fixed
    description: "Direct MAP_FIXED remapping regression test"
    source: test_mmap_fixed.c
    command: "make test_mmap_fixed && ./test_mmap_fixed"

test_package_tests:
  - file: test.cpp
    description: "Consumer API test for read-only mapping, vector conversion, and shared-write persistence"
    command: "./test_mmap_allocator"
  - file: test_ohos.cpp
    description: "HarmonyOS-specific page-size and shared mmap persistence test"
    command: "./test_mmap_allocator_ohos"

assertion_count: 11
