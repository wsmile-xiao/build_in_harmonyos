software: libfyaml
version: 0.9.6
status: published
build_system: autotools
configure_options: --prefix=/storage/Users/currentUser/usr/local
build_date: 2025-05-25
compiler: clang
platform: aarch64-unknown-linux-ohos

dependencies:
  - name: yaml-0.1
    version: ">=0.1"

binaries:
