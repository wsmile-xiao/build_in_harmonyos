# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libfyaml/0.9.6
homepage: "https://github.com/pantoniou/libfyaml"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check 驱动; 台账见 .oh-executor/libfyaml-r01-upstream-test-ledger.log)
upstream_tests:
  - file: test/libfyaml-test.c
    source: libfyaml-0.9.6/test/libfyaml-test.c
    description: "check 框架单元测试入口 (286 START_TEST: core/parser/fuzzing/emit/emit-bugs/parse-bugs/private/allocator/thread/meta)"
    command: "./test/libfyaml.test"
  - file: test/testsuite.test
    source: libfyaml-0.9.6/test/testsuite.test
    description: "YAML test-suite 数据驱动测试 (402 PASS)"
    command: "./test/testsuite.test"
  - file: test/jsontestsuite.test
    source: libfyaml-0.9.6/test/jsontestsuite.test
    description: "JSON test-suite 数据驱动测试 (318 PASS)"
    command: "./test/jsontestsuite.test"
  - file: test/testerrors.test
    source: libfyaml-0.9.6/test/testerrors.test
    description: "错误用例测试 (10 PASS)"
    command: "./test/testerrors.test"
  - file: test/testsuite-evstream.test
    source: libfyaml-0.9.6/test/testsuite-evstream.test
    description: "事件流数据驱动测试 (307 PASS 1 SKIP)"
    command: "./test/testsuite-evstream.test"
  - file: test/testsuite-json.test
    source: libfyaml-0.9.6/test/testsuite-json.test
    description: "JSON 数据驱动测试 (277 PASS 1 SKIP 1 XPASS)"
    command: "./test/testsuite-json.test"
  - file: test/testsuite-resolution.test
    source: libfyaml-0.9.6/test/testsuite-resolution.test
    description: "别名/解析数据驱动测试 (14 PASS 1 SKIP)"
    command: "./test/testsuite-resolution.test"
  - file: test/testemitter.test
    source: libfyaml-0.9.6/test/testemitter.test
    description: "发射器示例测试 (175 PASS)"
    command: "./test/testemitter.test"
  - file: test/testemitter-streaming.test
    source: libfyaml-0.9.6/test/testemitter-streaming.test
    description: "流式发射测试 (175 PASS)"
    command: "./test/testemitter-streaming.test"
  - file: test/testemitter-restreaming.test
    source: libfyaml-0.9.6/test/testemitter-restreaming.test
    description: "重流式发射测试 (175 PASS)"
    command: "./test/testemitter-restreaming.test"

# test_package 中自带的测试 (消费者视角验证, 真实调用 libfyaml API, R34)
test_package_tests:
  - file: test.c
    description: "消费者测试: fy_document_build_from_string -> mapping lookup -> scalar check -> emit -> reparse"
    command: "./test_libfyaml"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 286