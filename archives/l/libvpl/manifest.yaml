software: libvpl
display: "Intel VPL (oneVPL) dispatcher"
description: "Intel Video Processing Library (oneVPL) dispatcher — loads and dispatches the MFX API to oneVPL / legacy MSDK runtime implementations"
category: multimedia
homepage: "https://github.com/intel/libvpl"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 无 Platform/HarmonyOS.cmake，而 Conan 对 os=OHOS 的默认系统名与本机 uname -s 都是 HarmonyOS；此时 UNIX 未定义，libvpl 的 if(UNIX) 分支被整段跳过（src/linux/mfxloader.cpp 不进入构建图、MFX_MODULES_DIR 未定义、Threads 与 -pthread 链接跳过，DT_SONAME 也因 CMAKE_SHARED_LIBRARY_SONAME_<LANG>_FLAG 来自 Platform/Linux.cmake 而丢失），产物只剩 7 个 2.x loader 符号，1.x API（52 个符号）静默丢失。两处易误归因（均已实测排除）：①-Wl,--version-script 在 if(WIN32) 的 else() 分支，破损配置下仍生效但只覆盖那 7 个符号；②CMAKE_DL_LIBS 的链接在 if(UNIX) 之外且由 Platform/GNU.cmake 兜底，破损配置下仍有 -ldl。配方显式 CMAKE_SYSTEM_NAME=OHOS（SDK 随带 Platform/OHOS.cmake = include(Platform/Linux)），用平台真名而无需伪装成 Linux"
    - "平台差异只用这一个 CMake 变量解决，不需要任何源码补丁；判定回归的最快办法是链接一个调用 MFXInit/MFXInitEx 的 C 消费者（缺分支时是链接期符号缺失）"
    - "派发库不含编解码实现，运行时按 ONEVPL_SEARCH_PATH → 库所在目录 → MFX_MODULES_DIR → 系统目录 dlopen libmfx-gen / libmfxhw64 / libmfxsw64；OHOS 无 Intel 运行时，运行期只能返回 MFX_ERR_NOT_FOUND / MFX_ERR_UNSUPPORTED"
    - "上游测试自带 vendored googletest 与 stub/stub1x/stub-nofn 三个 in-tree 运行时，BUILD_TESTS=ON 后 ctest 可离线跑完，无需 Conan gtest 依赖"
    - "ctest 把 GTEST_SKIP 计入 passed，分账必须读 ctest --output-junit 的 skipped 属性或 gtest 原始输出"
  common_dependencies: []

versions:
  "2.16.0":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libvpl/2.16.0"
    difficulty: "A-path CMake/UNIX-branch adaptation + platform regression guard"
