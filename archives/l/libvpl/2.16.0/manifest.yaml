knowledge_gained:
  - "CMake 无 Platform/HarmonyOS.cmake, Conan 对 os=OHOS 的默认系统名 (HarmonyOS) 与本机 uname -s 都不带平台文件; 此时 UNIX 未定义, libvpl 的 if(UNIX) 分支被整段跳过 —— src/linux/mfxloader.cpp 不进入构建图、MFX_MODULES_DIR 未定义、find_package(Threads) 与 -pthread 链接一并跳过, 且因 CMAKE_SHARED_LIBRARY_SONAME_<LANG>_FLAG 由 Platform/Linux.cmake 定义而丢失 DT_SONAME; 产出的 libvpl.so 只导出 7 个 2.x loader 符号 (MFXLoad/MFXUnload/MFXCreateConfig/MFXSetConfigFilterProperty/MFXEnumImplementations/MFXCreateSession/MFXDispReleaseImplDescription), 1.x 全量 API (52 个符号) 静默丢失。两处易误归因(均已实测排除): ①-Wl,--version-script 位于 if(WIN32) 的 else() 分支, 破损配置下仍生效 (破损产物仍带 LIBVPL_2.0/2.1 版本节点), 只是仅覆盖那 7 个符号; ②CMAKE_DL_LIBS 的链接在 if(UNIX) 之外且由 Platform/GNU.cmake 兜底, 破损配置下 build.ninja 仍有 LINK_LIBRARIES = -ldl (正确配置多出的是 -pthread)。显式 CMAKE_SYSTEM_NAME=OHOS (SDK 随带 Modules/Platform/OHOS.cmake, 内容为 include(Platform/Linux)) 后 UNIX=1, mfxloader.cpp 入库、DT_SONAME 生成、version script 覆盖全部 59 个符号; 用平台真名而非伪装成 Linux, 与 archives/d/demumble、archives/d/dbus 同口径, 无需任何源码补丁"
  - "判别办法: 链接一个调用 MFXInit/MFXInitEx 的 C 消费者; 缺少 UNIX 分支时是链接期失败 (符号不存在), 而不是运行期错误 —— 比核对导出符号条目更早暴露"
  - "上游测试自带 vendored googletest (libvpl/test/ext/googletest, 212 文件) 与三个 in-tree stub 运行时 (stub/stub1x/stub-nofn), 发布 tarball 内已含子模块内容, 无需联网下载, 也不需要 Conan gtest 依赖"
  - "上游 ctest 默认只跑 stub 实现 (main.cpp: 无自定义参数时 g_bDispInclStub=true); GPU/CPU 运行时/legacy 加速器/vpl-inspect 相关 307 项在无 Intel 运行时的 OHOS 上按 SKIP 处理, 9 项为上游 DISABLED_ 不运行"
  - "ctest 会把 SKIP 计入 passed, 精确分账必须读 gtest 单进程输出或 ctest --output-junit 的 skipped 属性"
