# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libvpl/2.16.0
homepage: "https://github.com/intel/libvpl"

# 上游测试入口: script/test unit -> ctest --test-dir _build
upstream_check_command: "ctest -N"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j 2"

# 上游实际运行的测试程序 (libvpl/test/CMakeLists.txt)
upstream_tests:
  - file: libvpl/test/unit/src/*.cpp
    source: libvpl-2.16.0/libvpl/test/
    description: "vpl-tests: GTest 单元/集成套件 (26 个 suite, 1014 项可执行用例; gtest_discover_tests 注册 1023 项), 使用 in-tree stub/stub1x/stub-nofn 运行时, 无需真实 Intel GPU"
    command: "ctest --output-on-failure -j 2"
  - file: libvpl/test/diagnostic/{mfxinit-test,vpl-timing}
    source: libvpl-2.16.0/libvpl/test/diagnostic/
    description: "诊断可执行文件: 上游仅 add_executable, 未注册为 ctest 用例, 不进入分母"
    command: "(未注册, 不运行)"

# 上游源码声明总数 (口径: TEST/TEST_F 字面宏)
source_declared_total: 860
# CTest 框架注册总数 (gtest_discover_tests 枚举, 取最大口径申报)
framework_registered_total: 1023
# 实际执行 = 1023 - 9 (上游 DISABLED_)
executed_total: 1014
executed_passed_total: 707
executed_skipped_total: 307
executed_failed_total: 0
disabled_not_run_total: 9

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libvpl.c
    description: "消费者测试: oneVPL 2.x loader 全流程 (MFXLoad/MFXCreateConfig/MFXSetConfigFilterProperty/MFXEnumImplementations/MFXCreateSession/MFXUnload) 与出参契约"
    command: "./test_libvpl"
    assertions: 9
  - file: test_libvpl_ohos.c
    description: "OHOS 专项: 1.x 遗留派发入口 (MFXInit/MFXInitEx/MFXQueryVersion/MFXClose) 存在于打包产物且返回定义状态; 无 Intel 运行时时枚举返回 MFX_ERR_NOT_FOUND"
    command: "./test_libvpl_ohos"
    assertions: 9

# test_package 运行时断言总数 (两个消费者程序)
assertion_count: 18
