# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libmodbus/3.2.0
homepage: "https://libmodbus.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/unit-tests.sh
    source: libmodbus-3.2.0/tests/unit-tests.sh
    description: "单元测试脚本：启动 unit-test-server/client，覆盖位/寄存器/MASK/超时等 Modbus 读写场景"
    command: "./unit-tests.sh"
  - file: tests/proxy-tests.sh
    source: libmodbus-3.2.0/tests/proxy-tests.sh
    description: "代理测试脚本：backend server + proxy server + client 三层转发链路"
    command: "./proxy-tests.sh"
  - file: tests/random-test-client.c
    source: libmodbus-3.2.0/tests/random-test-client.c
    description: "随机读写一致性测试 (client)，与 random-test-server 配对运行"
    command: "./random-test-client 127.0.0.1 1505 50"
  - file: tests/bandwidth-client.c
    source: libmodbus-3.2.0/tests/bandwidth-client.c
    description: "带宽测试 (client)，与 bandwidth-server-one 配对运行"
    command: "./bandwidth-client tcp"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：创建 TCP context、set/get slave、未连接读寄存器错误路径验证"
    command: "./test_libmodbus"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 99
