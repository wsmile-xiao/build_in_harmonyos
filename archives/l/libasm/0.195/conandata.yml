sources:
  url: "https://raw.gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/blobs/a115c8c99c7471054f9b92d54203ba3c621b90fd/elfutils-0.195.tar.bz2"
  sha256: "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026"
patches:
  "0.195":
    - patch_file: "patches/0001-threadlib-conditional-error-h.patch"
      patch_description: "src/threadlib.c 无条件 include error.h；musl 无该头，改走上游既有的条件分支"
