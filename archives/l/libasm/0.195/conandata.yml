    - patch_file: "patches/0002-eu-config-musl-portability.patch"
      patch_description: "lib/eu-config.h：_() 按 ENABLE_NLS 分叉（musl 的 libintl.h 是空桩）；program_invocation_short_name 别名到 BSD 的 __progname"
      patch_type: "portability"
    - patch_file: "patches/0003-libasm-text-mode-init.patch"
      patch_description: "libasm text 模式（textp=true）上下文/节字段初始化修复——上游只在 binary 路径初始化，asm_end->__libasm_finictx 无条件释放未初始化字段导致 text 模式 asm_end 崩溃（SIGTRAP）"
      patch_type: "bugfix"
