software: libasm
version: "0.195"
build_system: autotools
status: built
build_date: "2026-09-23"
source:
  url: "https://raw.gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/blobs/a115c8c99c7471054f9b92d54203ba3c621b90fd/elfutils-0.195.tar.bz2"
  sha256: "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026"
  tar_format: tar.bz2
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"
    - "--disable-nls"
    - "--disable-werror"
    - "--disable-debuginfod"
    - "--with-zstd"
    - "--program-prefix=eu-"
  dependencies:
    - elfutils/0.195
    - zlib/1.3.1.1
    - zstd/1.5.7
    - bzip2/1.0.8
    - xz/5.6.2
    - argp-standalone/1.5.0
    - musl-fts/1.2.7
    - musl-obstack/1.2.3
  cc: clang
  cxx: clang++
patches_applied:
  - "patches/0001-threadlib-conditional-error-h.patch"
  - "patches/0002-eu-config-musl-portability.patch"
  - "patches/0003-libasm-text-mode-init.patch"
knowledge_gained:
  - "libasm text 模式（textp=true）是无需内部 libebl 的可独立消费 API，但上游 asm_end->__libasm_finictx 无条件释放未初始化字段，text 模式必崩；需在 prepare_text_output/text_newscn 补初始化"
  - "OHOS 无 coreutils install，elfutils 自带 install-sh 不支持 GNU -D；用 install-shim（INSTALL=sh shim）绕开"
