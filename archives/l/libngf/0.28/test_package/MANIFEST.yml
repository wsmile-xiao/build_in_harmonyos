# test_package/MANIFEST.yml — upstream test declaration (CI gate L0e)
# Facts audited from the 0.28 tag tree 2026-09-19; device execution
# numbers are filled only from real-device runs (never estimated).

package: libngf/0.28
homepage: "https://github.com/sailfishos/libngf"

# Upstream suite listing tool
upstream_check_command: "make check"

# Machine-evidence declaration (required by the device-test gate).
# Total inventory uses the official upstream unit: 13 libcheck START_TEST
# cases (7 in tests/test-proplist.c + 6 in tests/test-client.c) living in
# 2 automake TESTS programs. The OHOS-executed subset (7 bus-free cases)
# must never be used as the total.
upstream_tests_exist: true
upstream_test_total: 13
upstream_test_count_method: autotools_tests
upstream_test_count_detail: "13 libcheck START_TEST cases (7 tests/test-proplist.c + 6 tests/test-client.c) in 2 automake TESTS programs; counted by grep START_TEST over the 0.28 tag tree"

# The main recipe build() compiles and runs the bus-free subset with
# direct cc (same TU list as tests/Makefile.am test_proplist_SOURCES:
# tests/test-proplist.c + libngf/proplist.c); the D-Bus-dependent client
# binary is resource-gated on OHOS (no system bus on devices/CI workers,
# dbus-glib 0.114 precedent).
upstream_test_in_build: true
upstream_test_command: './test-proplist (direct cc: tests/test-proplist.c + libngf/proplist.c)'

upstream_tests:
  - file: tests/test-proplist.c
    source: libngf-0.28/tests/test-proplist.c
    description: "proplist suite: 7 libcheck cases (set/get, parse values, limits, foreach, foreach_extended, copy, get_keys), bus-free"
    command: './test-proplist (direct cc, same TU list as tests/Makefile.am)'
    result: "executed in build() via direct cc + libcheck run"
  - file: tests/test-client.c
    source: libngf-0.28/tests/test-client.c
    description: "client suite: 6 libcheck cases (create, failed-create, play NULL event/client, play sms, callback); 3 cases need DBUS_BUS_SYSTEM"
    command: "make check"
    result: "resource-gated on OHOS: needs a D-Bus system bus (dbus_bus_get DBUS_BUS_SYSTEM), absent on devices/CI workers; declared excluded"

# Consumer-side tests executed by conan create (L1)
test_package_tests:
  - file: test.c
    description: "links libngf0 via pkg-config; 8 offline proplist checks (string/integer/unsigned/boolean round-trips, type queries, parsers, foreach, copy, key listing)"
    command: "./test_ngf"
  - file: conanfile.py
    description: "re-emits the persisted HMBS_UPSTREAM_TEST_RESULT from package res/hmbs_upstream.json so every round carries upstream evidence"
    command: "./test_ngf"

# Upstream test sources contain ~70 fail_unless assertions (audited by
# grep over tests/test-proplist.c and tests/test-client.c); the executed
# OHOS subset plus 8 explicit CHECK-OK consumer assertions.
assertion_count: 78
