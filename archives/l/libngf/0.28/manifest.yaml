  - "ngf-client 为交互式系统总线调试客户端，不构建不打包，保持纯 library（免 R38 commands.json）"
  - "上游 13 个 libcheck 用例中 6 个需 D-Bus system bus，OHOS 上资源门控排除，proplist 7 用例全量执行"
