software: libngf
display: "Non-graphical feedback client library"
description: "Sailfish NGF non-graphical feedback C client library"
category: library
homepage: "https://github.com/sailfishos/libngf"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag 源码需 autoreconf 自举（automake/libtool 走 tool_requires）"
    - "E007/E011 autotools OHOS 适配（--build 显式指定 + umask 022）"
    - "ngf-client 交互式总线客户端不打包，保持纯 library"
  common_dependencies:
    - dbus
    - glib
    - dbus-glib
    - check

versions:
  "0.28":
    status: built
    build_date: "2026-09-19"
