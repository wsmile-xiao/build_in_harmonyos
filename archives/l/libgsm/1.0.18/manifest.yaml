software: libgsm
version: 1.0.18
status: published
build_date: 2026-05-19
source_url: http://www.quut.com/gsm/gsm-1.0.18.tar.gz
build_system: makefile
dependencies: []
configure_options: []
make_options:
  CC: clang
  CFLAGS: "--target=aarch64-linux-ohos"
  PREFIX: /usr/local
  DESTDIR: staging
patches:
  - 0001-makefile-harmonyos.patch
artifacts:
  library:
    - lib/libgsm.a
  headers:
    - include/gsm.h
  binaries:
    - bin/toast
    - bin/untoast
    - bin/tcat
  manpages:
    - share/man/man1/toast.1
    - share/man/man3/gsm.3
    - share/man/man3/gsm_explode.3
    - share/man/man3/gsm_option.3
    - share/man/man3/gsm_print.3
quality_gates:
  G0_clean_build: pending  # 未执行 ohc-run.py clean-verify
  G1_binary_integrity: pass  # 产物存在且有效
  G2_functionality: pass  # toast 工具可执行
  G3_portability: partial  # SELinux 限制导致未 strip/未签名
  G4_archive_integrity: pass  # 档案文件完整
platform_limitations:
  - SELinux chmod/strip 限制（Gotchas E046）
  - HMDFS 硬链接限制（Gotchas §7）
  - ldd 工具不可用（musl 系统）
known_issues:
  - 二进制未 strip（SELinux 限制）
  - ELF 未签名（工具不可用）
warnings:
  - src/gsm_create.c: unused variable
  - src/toast.c: deprecated string operations
  - src/toast_lin.c: deprecated function prototype
