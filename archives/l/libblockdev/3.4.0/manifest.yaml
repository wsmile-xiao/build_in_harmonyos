software: libblockdev
version: "3.4.0"
status: published
build_system: autotools
build_date: "2026-06-01"

source:
  url: "https://github.com/storaged-project/libblockdev/releases/download/3.4.0/libblockdev-3.4.0.tar.gz"
  sha256: "65ef9a37babd44b85b8ff9b273f90f9f7d5f8ff7b0c76a8edb69240325fd83f4"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-btrfs"
    - "--without-lvm"
    - "--without-lvm-dbus"
    - "--without-mpath"
    - "--without-dm"
    - "--without-crypto"
    - "--without-escrow"
    - "--without-nvdimm"
    - "--without-nvme"
    - "--without-smart"
    - "--without-smartmontools"
    - "--without-s390"
    - "--without-fs"
    - "--without-part"
    - "--without-swap"
    - "--without-tools"
    - "--without-python3"
    - "--without-mdraid"
    - "--with-loop"
  dependencies:
    - "glib-2.0/2.88.0"
    - "libintl/0.22.5"
    - "libpcre2-8/10.44"
    - "libffi/3.4.6"
    - "zlib/1.3.1"
    - "libudev/219 (stub)"
    - "libkmod/33 (stub)"
  cc: clang
  cxx: clang++

patches_applied:
  - "01-config.guess.patch"
  - "02-configure.patch"
  - "03-m4-libtool-downgrade.patch"
  - "04-Makefile.in-automake-downgrade.patch"

knowledge_gained:
  - "HMDFS不支持umask 077, 需改为022"
  - "config.guess需要添加aarch64-unknown-linux-ohos三元组"
  - "glib静态编译需要-lintl_glib链接参数"
  - "鸿蒙平台需要libudev/libkmod stub库（返回NULL/-2）"
  - "bd_init()因kmod stub循环会卡住, 建议单独使用bd_loop_init()"
  - "stub库需要ohc sign-elf签名后才能被dlopen加载"
  - "libbd_utils.so的NEEDED条目可能包含绝对路径, 需patchelf修复"

patch_generation:
  method: manual-merge
  patches_count: 4
  merged_from: 30
  note: "30个原始补丁精简为4个：01=config.guess, 02=umask, 03=m4降级合并(0010+0011+0013), 04=Makefile.in降级合并(17个)"

patch_classification:
  - file: 01-config.guess.patch
    type: platform
    platform_only: True
    description: "添加 HarmonyOS 三元组识别到 config.guess"
  - file: 02-configure.patch
    type: platform
    platform_only: True
    description: "将临时目录 umask 从 077 改为 022 (HMDFS 不支持 077)"
  - file: 03-m4-libtool-downgrade.patch
    type: toolchain
    platform_only: True
    description: "libtool m4 宏从 2.5.4 降级到 2.4.7 (合并原 0010+0011+0013)"
  - file: 04-Makefile.in-automake-downgrade.patch
    type: toolchain
    platform_only: True
    description: "全部 Makefile.in 从 automake 1.17 降级到 1.16.5 语法 (合并原17个补丁, 删除非必需的spec/版权/tests硬编码)"