# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libblockdev/3.4.0
homepage: "https://github.com/storaged-project/libblockdev"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/integration-tests
    source: libblockdev-3.4.0/tests/
    description: "Integration tests requiring root and block device access (not runnable on OHOS)"
    command: "make check"
  - file: tests/libs/tests
    source: libblockdev-3.4.0/tests/libs/tests/
    description: "Unit tests for library functions (require autotools test harness)"
    command: "./tests/libs/tests/test_blockdev_utils"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Verify libblockdev core API: bd_is_initialized() and bd_init_error_quark()"
    command: "./test_libblockdev"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
