    patch_description: "Downgrade all Makefile.in from automake 1.17 to 1.16.5 syntax"
    patch_type: "portability"
  - patch_file: "patches/0005-sysname-harmonyos.patch"
    patch_description: "Accept HarmonyOS/OHOS sysname in uname check for kernel version detection"
    patch_type: "portability"
  - patch_file: "patches/0006-nvme-remove-uuid-include.patch"
    patch_description: "Remove uuid/uuid.h include from nvme API header (not needed for API defs, uuid unavailable on OHOS)"
    patch_type: "portability"
