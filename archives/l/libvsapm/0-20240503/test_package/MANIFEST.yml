# test_package/MANIFEST.yml
# Upstream test declaration required by CI L0e.

package: libvsapm/0-20240503
homepage: https://github.com/libyal/libvsapm

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"
upstream_test_assets: 29             # tests/ 目录测试资产文件数：15 个 .c（11 个可执行测试程序 + 4 个共享夹具）+ 12 个 .h + 2 个 Makefile
upstream_c_test_programs: 11
upstream_unit_programs: 8
upstream_tools_programs: 3
upstream_integration_scripts: 2

upstream_tests:
  - name: "libvsapm test_library"
    file: test_library.sh
    source: tests/test_library.sh
    description: "上游库与 C 测试程序运行器"
    command: "./tests/test_library.sh"
  - name: "libvsapm test_tools"
    file: test_tools.sh
    source: tests/test_tools.sh
    description: "上游命令行工具测试运行器"
    command: "./tests/test_tools.sh"
  - name: "libvsapm test_vsapminfo"
    file: test_vsapminfo.sh
    source: tests/test_vsapminfo.sh
    description: "vsapminfo 元数据输出检查"
    command: "./tests/test_vsapminfo.sh"

test_package_tests:
  - file: test_libvsapm.c
    description: "Consumer API version, signature, codepage, error-path, and object lifecycle checks"
    command: "./test_libvsapm"
  - file: test_ohos.c
    description: "OHOS compile-target and writable TMPDIR file lifecycle checks"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "libvsapm-ohos-tmpdir-file-lifecycle"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、TMPDIR 非 /tmp、临时文件读写和清理"
    command: "./test_ohos"
    assertions: 5
    platform: OHOS

assertion_count: 14
