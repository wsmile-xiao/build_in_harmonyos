package: libdogleg/0.18
homepage: "https://github.com/dkogan/libdogleg"

# 上游测试：make check = 构建 sample/test-misc + 执行 check.sh。check.sh 是 zsh
# 脚本（#!/bin/zsh，OHOS 无此解释器），但其内容就是 4 条 ./sample --check
#（见上游 check.sh 的 CMDS 数组）；配方在 build() 中逐条直调，完全等价。
# test-misc 是第 5 个上游测试程序（DOGLEG_DEBUG_VNLOG 位对齐，防 ABI 回退）。
upstream_check_command: "./sample --check sparse|dense|dense-products-packed-upper|dense-products-unpacked + ./test-misc"
upstream_test_in_build: true
upstream_test_command: "./sample --check sparse && ./sample --check dense && ./sample --check dense-products-packed-upper && ./sample --check dense-products-unpacked && ./test-misc"

upstream_tests:
  - file: sample.c
    source: libdogleg-0.18/sample.c
    description: "稀疏求解 self-check：6 参数非线性拟合收敛且 6 个参数恢复到 5e-2 以内"
    command: "./sample --check sparse"
  - file: sample.c
    source: libdogleg-0.18/sample.c
    description: "稠密求解 self-check：同上（dense 路径，经 LAPACK dpotrf_）"
    command: "./sample --check dense"
  - file: sample.c
    source: libdogleg-0.18/sample.c
    description: "稠密乘积 packed-upper self-check（经 LAPACK dpptrf_）"
    command: "./sample --check dense-products-packed-upper"
  - file: sample.c
    source: libdogleg-0.18/sample.c
    description: "稠密乘积 unpacked self-check"
    command: "./sample --check dense-products-unpacked"
  - file: test-misc.c
    source: libdogleg-0.18/test-misc.c
    description: "DOGLEG_DEBUG_VNLOG 位对齐校验（dogleg_parameters2_t ABI 回归）"
    command: "./test-misc"

test_package_tests:
  - file: test_dogleg.c
    description: "消费者视角 dense 求解：dogleg_optimize_dense2 收敛断言 + 6 参数恢复断言"
    command: "./test_dogleg"

assertion_count: 7
