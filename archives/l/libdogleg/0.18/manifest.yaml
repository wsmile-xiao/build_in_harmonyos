software: libdogleg
version: "0.18"
status: built
build_date: "2026-09-18"
build_system: makefile

source:
  url: "https://github.com/dkogan/libdogleg/archive/refs/tags/v0.18.tar.gz"
  sha256: "d97ef0c149463f84e9bd40c8852da444605a38bac432b5b2774de3dd15180bab"
  tar_format: tar.gz

build:
  system: make
  cc: clang
  configure_options:
    - "VERSION=0.18 make -j1（mrbuild 框架；本地 vendored 官方 mrbuild v1.13，无需网络）"
    - "CC/CXX/CC_LINKER/CPPFLAGS/LDFLAGS 全部来自 Conan conf 与依赖包（R33；mrbuild 只接受环境变量形式的 *FLAGS）"
  dependencies:
    - suitesparse/7.8.3
    - openblas/0.3.34

patches_count: 1

knowledge_gained:
  - "E2BIG：绝不 save_script('conanbuild')/('conanrun')，聚合脚本通配符 source 会自引用死循环（printenv Argument list too long + exit 137）；自定义变量一律 build() 内 apply() 运行时注入（libmspub-tools/0.1.4 先例）。"
  - "dkogan 系 Makefile 项目（libdogleg/mrbuild 框架）：choose_mrbuild.mk 无本地 mrbuild/ 时要求 apt 或现场 wget；配方在 source() 把官方 mrbuild tarball 取到源码树 mrbuild/ 子目录即可离线构建，无需补丁。"
  - "mrbuild 禁止命令行传 *FLAGS（footer 开头即 error），*FLAGS 必须走环境；VERSION 不是 *FLAGS，但必须走命令行（Makefile 内 VERSION := $(VERSION_FROM_PROJECT) 会覆盖环境，无 .git 时退化成 VERSION_UNKNOWN）。"
  - "VERSION=0.18 命令行传入后产出上游惯例的 libdogleg.so.2.0.18 + .so.2/.so 软链（ABI_VERSION=2）。"
  - "上游 LDLIBS 的 -llapack 在 OHOS 无系统 liblapack.so，补丁换成 -lopenblas（本仓 BLAS/LAPACK 提供方，与 suitesparse 一致，避免双 BLAS 混链）；-lcholmod/-lsuitesparseconfig 来自 suitesparse/7.8.3。"
  - "上游 check.sh 是 zsh 脚本（OHOS 无 zsh），配方逐条直调其 CMDS 的 4 条 ./sample --check，外加 ./test-misc，共 5 条上游测试命令。"
