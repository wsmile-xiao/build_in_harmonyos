software: libdogleg
display: "libdogleg"
description: "Powell dogleg 信赖域法解非线性最小二乘（稀疏经 CHOLMOD，稠密经 LAPACK）"
category: foundation
homepage: "https://github.com/dkogan/libdogleg"
license: "LGPL-3.0-only"
build_system: makefile

ohos_adaptation:
  key_points:
    - "裸 Makefile + mrbuild 框架：source() 把官方 mrbuild v1.13 取到源码树，离线构建"
    - "mrbuild 禁命令行 *FLAGS（走 conanbuild 环境），VERSION 反必须走命令行（否则退化成 VERSION_UNKNOWN）"
    - "唯一补丁：-llapack 改链本仓 openblas（与 suitesparse 提供方一致，避双 BLAS 混链）"
    - "上游 check.sh 为 zsh 脚本，逐条直调其 4 条 sample --check，外加 test-misc，共 5 项上游测试"

versions:
  "0.18":
    status: built
    build_date: "2026-09-18"
    packaging: conan
    notes: |
      conan 配方（os=OHOS arch=armv8），mrbuild 框架离线化 + 单补丁换链 openblas。
      待真机原生 conan create 验证：上游 5 条测试命令 + test_package 7 条断言。
    dependencies:
      - suitesparse/7.8.3
      - openblas/0.3.34
    provides:
      - libdogleg.so.2
