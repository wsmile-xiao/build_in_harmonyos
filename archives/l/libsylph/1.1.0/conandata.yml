# conandata.yml — libsylph 1.1.0（Sylpheed 的邮件客户端库）
# 官方源（R39 合规：上游官方发布站 sylpheed.sraoss.jp）
#
# 补丁背景（CI L0f 会把 patches 段内每个缩进行当 key 解析，故说明一律放本注释块、
# patch_description 一律写成单行，且不得以 .patch/.diff 结尾）：
#   0001/0002 针对本包**捆绑的 2006 世代旧式 GNU config 脚本**（grep -c '^GUESS='
#   = 0，且全脚本无 aarch64 条目），故本仓 scripts/patch-autotools-ohos.pl 的锚点
#   全部落空（该工具锚点取自 2016-08 重构后的新式脚本）——必须手写补丁。
#   目的：让 configure 自行识别 aarch64-unknown-linux-ohos，从而不必用
#   --build/--host 硬编码（本仓铁律 E007/R8）。
#   已合入先例（锚点上下文与本包逐字相同）：archives/n/nvi/1.81.6 的同名 config 脚本补丁。
#   0003 针对现代 glib 的 <glibconfig.h> 直接包含守卫。

sources:
  url: "https://sylpheed.sraoss.jp/sylpheed/libsylph/libsylph-1.1.0.tar.bz2"
  sha256: "f0ebfb22f4d2bf49b88108fade4ce05c544dbfd192ebe157f9542c11dec12e2e"

patches:
  - patch_file: "patches/0001-config-guess-harmonyos.patch"
    patch_description: "config.guess 增加通用 *:HarmonyOS:*:* 分支（插在 *:NetBSD:*:* 之前，旧式 echo+exit 风格），把 HarmonyOS 主机判定为 <machine>-unknown-linux-ohos；不加此分支时会落到末位兜底分支，写 TMPDIR/dummy.c 失败（HMDFS 下 umask 077 与 mktemp -d 组合产出 2700 目录）并报 unable to guess system type / cannot guess build type。同已合入的 nvi 1.81.6 先例（该脚本与本包同为 2006 世代，case 语句上下文逐字相同）。"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-linux-ohos.patch"
    patch_description: "config.sub 三处锚点：(1) maybe_os 列表补 linux-ohos*，(2) basic os 列表补 -linux-ohos*，(3) 在 -linux*) 兜底改写前插入 -linux-ohos*) os=-linux-ohos 守卫；缺 (3) 时 os 会被静默改写成 linux-gnu-ohos（平台身份判错）。同已合入的 nvi 1.81.6 先例（锚点上下文与本包逐字相同）。"
    patch_type: "portability"
  - patch_file: "patches/0003-defs-use-glib-h.patch"
    patch_description: "libsylph/defs.h 的 #include <glibconfig.h> 改为 #include <glib.h>：现代 glib 的 glibconfig.h 会先引入 glib/gmacros.h，后者在未定义 __GLIB_H_INSIDE__ 时直接 #error Only <glib.h> can be included directly；glib.h 会先定义该宏再带入 glibconfig.h，语义等价。"
    patch_type: "portability"
