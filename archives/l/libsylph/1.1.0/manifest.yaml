# 文件位置: archives/l/libsylph/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.1.0"

software: libsylph

# 编译状态：published | built | failed | archived
status: built

build_date: "2026-09-23"

build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://sylpheed.sraoss.jp/sylpheed/libsylph/libsylph-1.1.0.tar.bz2"
  sha256: "f0ebfb22f4d2bf49b88108fade4ce05c544dbfd192ebe157f9542c11dec12e2e"
  compression: tar.bz2
  archive_root: "libsylph-1.1.0"
  note: >-
    上游官方发布站（R39 合规）。tarball 自带预生成的 configure（GNU Autoconf 2.61）、
    aclocal.m4、Makefile.in、config.h.in，以及 2006 世代的 config.guess/config.sub，
    故本配方刻意不执行 autoreconf（现代 glib/gettext 不再提供 AM_PATH_GLIB_2_0 /
    AM_GLIB_GNU_GETTEXT 所需的 glib-2.0.m4 / glib-gettext.m4 等宏）。

# ============================================================
# 依赖
# ============================================================

dependencies:
  required:
    - glib/2.84.0        # 公共头直接 #include <glib.h>；传递头与库
    - gettext/0.22.5     # libintl.h + libintl.a（glib 的 gi18n.h 用 gettext()）
  build:
    - pkgconf/3.0.6      # 设备与 CI 均无 pkg-config 二进制；AM_PATH_GLIB_2_0 依赖它
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - "--disable-glibtest"    # AM_PATH_GLIB_2_0 的运行态检测（同 DRAFT-6048）
  notes: >-
    不传 --build/--host（E007/R8 铁律）：由已打补丁的 config.guess 自行识别
    aarch64-unknown-linux-ohos。实测 configure 日志 build/host/target 三者均为
    aarch64-unknown-linux-ohos，且 "checking whether we are cross compiling... no"。
    PKG_CONFIG_PATH 只含 PkgConfigDeps 产物目录（generators_folder）；
    额外显式设置 PKG_CONFIG（pkgconf 无 pkg-config 别名）与 LD（OHOS 无 ld，仅 ld.lld）。

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config-guess-harmonyos.patch"   # config.guess 补通用 *:HarmonyOS:*:* 分支
  - "0002-config-sub-linux-ohos.patch"    # config.sub 补 linux-ohos（3 锚点，含静默改写守卫）
  - "0003-defs-use-glib-h.patch"          # defs.h 不再直接 include <glibconfig.h>

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: medium
  issues:
    - "SSL 未启用：configure.in 默认 --enable-ssl，但未列 openssl 依赖且 OHOS sysroot 无 libssl，实测 configure 报 'OpenSSL: no' → USE_SSL 未定义，库内 TLS 相关代码不编译。"
    - "三段三元组 aarch64-linux-ohos（Conan 异构 profile 注入形态）不被本包旧式 config.sub 接受（其机器表无 aarch64）；同构 profile 下 Conan 不注入该形态，不影响本包与 CI。"
  notes: >-
    上游无自动化测试套件，功能验证由消费者测试承担。po/ 本地化真实生成 29 个 .mo 并打包。

# ============================================================
# 测试结果（五维账本）
# ============================================================

test_results:
  type: consumer
  static_total: 0          # N_static：上游无 tests/、无注册入口；examples 仅 EXTRA_DIST 不编译
  registered_total: 0      # N_registered
  executed_total: 0        # N_executed：make check 已真实执行（automake 空套件，0 用例）
  review_count_total: 8    # 审查实测口径：examples/**/*.c 源码资产数（PR 正文「上游表合计」按此申报，§12.72 宁高勿低）
  not_executed:            # 未执行分类（如实列出，不并入 passed）
    - count: 8
      what: "examples/*.c（8 个示例程序，命名形如 libsylph-<词干>.c，词干为 compose、createmailbox、listfolder、listprefs、listsummary、pop、send、template 共 8 个；examples/ 无子目录）"
      reason: "examples 在顶层 SUBDIRS 内、make check 确实进入该目录（w3-local-ci.log:2009 Making check in examples），但 examples/Makefile.am 全文仅 208 字节 = EXTRA_DIST(README.ja + 8 个 .c)，无 noinst_PROGRAMS/编译规则 ⇒ 只回 Nothing to be done for 'check'，0 个用例被编译或运行；示例为客户端用法样例（含 ComposeInfo/PrefsAccount 与账户配置上下文），需真实账户环境才能运行；非本次适配引入，本次未给示例补构建规则"
  skipped: []
  consumer_programs: 1     # N_consumer：test_package/test.c → test_libsylph
  consumer_assertions: 8   # 8/8 通过
  passed: 8                # 消费者断言 8/8（type=consumer）；不含任何上游用例——上游 executed_total=0
  failed: 0
  note: |
    消费者测试（test_package，赛道二硬门禁）以库使用者身份 find_package(libsylph)
    编译、链接并调用公开 API，实测 8/8 断言通过：

      base64_encode(19 bytes) -> "bGlic3lscGgg5Lit5paHIAEC/w=="
      PASS: base64 编码长度 == 4*ceil(n/3)
      PASS: base64_decode 返回原始长度
      PASS: base64 往返载荷一致
      PASS: s_gnet_md5_new 返回非空
      md5("abc") -> 900150983cd24fb0d6963f7d28e17f72
      PASS: MD5("abc") == RFC 1321 向量
      qp_encode_line("a=b") -> "a=3Db\n"
      PASS: qp_encode_line 把 '=' 编成 =3D
      PASS: qp_decode_line 返回解码长度 3
      PASS: quoted-printable 往返一致

    make check 在 build() 内真实执行（if not cross_building(self): autotools.make(target="check")，
    本机原生 aarch64 构建故分支命中执行；未 ignore_errors，作为真实门禁）；
    reports/w3-local-ci.log:1999-2022 记录 RUN: make check -j2 后进入
    ac/doc/examples/libsylph/po 五个子目录（Making check in 依次 2001/2005/2009/2013/2017），每个均为 Nothing to be done for 'check'
    （门禁判 [ok] L1c）。上游确无测试套件，故为 0 用例，非"跳过不跑"。

    申报口径（双口径，同 notes.md「申报口径」一节）：注册/执行口径为 0；
    审查实测口径按上游源码树 examples/**/*.c 计 8（2026-09-23 find 复核，无子目录），
    PR 正文「上游库测试用例统计」合计按 8 申报（§12.72 宁高勿低），
    适配后合计 9（8 个示例仍未注册未执行 + 1 个新增消费者程序）。
    executed_total 保持 0，不因申报口径虚报执行。

