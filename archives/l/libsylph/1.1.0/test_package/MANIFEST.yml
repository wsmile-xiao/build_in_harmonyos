# test_package/MANIFEST.yml — libsylph 1.1.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsylph/1.1.0
homepage: "https://sylpheed.sraoss.jp/"

# 上游测试命令 (用于 make -n check 分析)：顶层 Makefile.am:1 为
# SUBDIRS = ac doc examples libsylph po，make check 会递归进入这五个子目录。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# conanfile.py:237-238 为 `if not cross_building(self): autotools.make(target="check")`，
# 未使用 ignore_errors。本机为 HarmonyOS PC 原生 aarch64 构建（cross_building=False），
# 故 check 真实执行：reports/w3-local-ci.log:1999-2022 记录
# "libsylph/1.1.0: RUN: make check -j2"（1999）后依次进入五个子目录
# （Making check in ac/doc/examples/libsylph/po = 2001/2005/2009/2013/2017）。
# 该日志为 2026-09-23 23:20 重跑输出，共 2353 行、sha256 前缀 d6f6176965c5f2b4，
# 与 .ci-result.json 的 log_sha256 同源；复核：grep -n "Making check in" 该日志。
upstream_test_in_build: true
upstream_test_command: "make check -j2"

# 上游实际运行的测试程序：0 个。
# examples/Makefile.am 全文 208 字节，内容只有 EXTRA_DIST = README.ja 与 8 个 .c
# （客户端用法样例，需真实账户/配置上下文），没有任何 noinst_PROGRAMS / TESTS /
# check_PROGRAMS 编译规则；源码树亦无 tests/ 目录、无 add_test/ctest 注册入口。
# 因此 make check 在五个子目录均只回 "Nothing to be done for 'check'"，
# 没有可列出的上游测试程序。上游 8 个示例文件的未执行明细见 ../manifest.yaml
# 的 test_results.not_executed。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：find_package(libsylph) 编译并链接 libsylph::libsylph 后真实运行，调用公开 API base64_encode/base64_decode、s_gnet_md5_new/s_gnet_md5_copy_string、qp_encode_line/qp_decode_line"
    command: "./test_libsylph"

# 测试断言总数 (test_package/test.c 实测 8 条)
assertion_count: 8
