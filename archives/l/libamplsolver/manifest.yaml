# 软件级 manifest — libamplsolver
software: libamplsolver
display: "AMPL Solver Library (ASL)"
description: AMPL 求解器接口库：读取 AMPL 通用输出 (.nl) 文件、写入解 (.sol) 文件的例程集合，帮助自定义求解器与 AMPL 集成
category: library
license: BSD-3-Clause
homepage: "https://ampl.com/netlib/ampl/"
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只提供 makefile.u/vc/lc/sy/wat 变体（无默认 Makefile），必须显式 make -f makefile.u"
    - "make 需在源码目录执行（cwd=self.source_folder），产物 amplsolver.a 就地生成"
    - "构建产物 amplsolver.a 无 lib 前缀，打包时需改名 libamplsolver.a 才能用 -lamplsolver 链接"
    - "makefile.u 的 arith.h 目标需编译并运行 arithchk.c 探针生成平台头文件（真机可运行）"
    - "上游无自动化测试套件，test_package 对真实 ASL API（ASL_alloc/ASL_free）做消费者验证"
  common_dependencies: []

versions:
  "0-20190702":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libamplsolver/0-20190702"
