# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libamplsolver/0-20190702
homepage: "https://ampl.com/netlib/ampl/"

# 上游测试命令: 上游（netlib ampl/solvers 20190702 快照，Debian 打包为
# libamplsolver_0~20190702.orig.tar.xz，其中的 ~ 仅在 Debian pool 归档文件名，
# 不在 Conan 引用名——Conan 2 拒绝版本含 ~，见 E563）不存在任何测试目标，
# 故无独立 check 命令可声明（审计见 upstream_test_audit）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件审计结论:
# libamplsolver 0-20190702 上游源码（Debian 归档文件名 libamplsolver_0~20190702.orig.tar.xz，
# netlib ampl/solvers 快照）仅提供 makefile.{u,vc,lc,sy,wat} 五种 makefile 变体
# 与 configure/configurehere 脚本。makefile.u 仅有 all/arith.h/stdio1.h/
# details.c/systemprintf/xsum.out/clean 目标：无 check/test/TESTS/
# check_PROGRAMS 目标，无 tests/ 或 test* 目录，无任何测试框架配置。
# xsum.out 目标仅是传输校验（依赖外部 netlib xsum 程序，非自动化测试）。
# 仓库亦无可执行测试套件。结论：上游确实没有任何自动化测试，status=no_tests
# 如实上报。消费者视角验证由 test_package 对真实库 API（ASL_alloc/ASL_free）
# 做实质断言覆盖（6 项）。
upstream_tests_exist: false
upstream_test_audit:
  - path: "makefile.u"
    finding: "上游 Unix makefile 仅定义 all / arith.h / stdio1.h / details.c / systemprintf / xsum.out / clean 目标。make -n check 无对应规则（无 check 目标）；xsum.out 仅为传输校验，且依赖外部 netlib xsum 程序，不是自动化测试套件。"
  - path: "makefile.vc / makefile.lc / makefile.sy / makefile.wat"
    finding: "其余平台 makefile 变体同样仅含 all/clean 等构建目标，均无 check/test 目标。"
  - path: "configure / configurehere"
    finding: "仅从 makefile.u 生成 makefile 并探测编译选项（NO_RUSAGE 等），不挂接任何测试。"
  - path: "源码树整体"
    finding: "无 tests/ 目录、无测试脚本、无 CI 配置、无可挂接测试的构建体系入口；library 代码为纯 C 例程（读 .nl / 写 .sol），上游未编写自动化测试。"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ampl.c
    description: "调用 libamplsolver 真实 API 的 6 项断言：ASL_alloc(ASL_read_pfgh) 分配、库写入字段 ASLtype/ASL_read_pfgh、n_prob==1、p.Objval 函数指针已接线、空模型 n_var_/n_con_==0、ASL_free 置空指针"
    command: "./test_ampl（由 test_package/conanfile.py test() 编译链接后经 self.run 实际执行）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6