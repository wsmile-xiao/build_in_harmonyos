  # Conan package version is "0-20190702" (hyphen). The Debian pool archive
  # *filename* keeps the upstream Debian version separator "~" (Debian
  # convention: earlier-than) — the '/~' lives only in the download URL,
  # never in the Conan reference (Conan 2 rejects '~' in a version, E563).
  # All URLs below serve the identical archive with the same sha256.
  url:
    - "https://mirrors.aliyun.com/debian/pool/main/liba/libamplsolver/libamplsolver_0~20190702.orig.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/liba/libamplsolver/libamplsolver_0~20190702.orig.tar.xz"
    - "https://ftp.debian.org/debian/pool/main/liba/libamplsolver/libamplsolver_0~20190702.orig.tar.xz"
    - "https://deb.debian.org/debian/pool/main/liba/libamplsolver/libamplsolver_0~20190702.orig.tar.xz"
  sha256: "85b05cd5e0dfa44ff063daccd8107238025be40241d639a6741681926a7344cf"
