knowledge_gained:
  - "The ytnef tag tarball ships no generated configure; autoreconf -fi bootstraps it"
  - "config.guess has no HarmonyOS branch and both it and config.status create mktemp dirs under umask 077, which HMDFS returns unwritable (dummy.c / subs1.awk Permission denied); normalising to umask 022 plus the aarch64-unknown-linux-ohos triplet removes the platform guessing"
  - "make -j2 cannot create its jobserver FIFO on OHOS (Operation not permitted), the build is single job"
  - "Upstream registers no automake TESTS entry; test-data/test.sh is its only executable test entry point"
