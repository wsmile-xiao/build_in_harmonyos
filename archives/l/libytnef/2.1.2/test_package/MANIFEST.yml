package: libytnef/2.1.2
homepage: "https://github.com/Yeraze/ytnef"

upstream_test_in_build: true
upstream_test_command: "sh test-data/test.sh"

upstream_tests:
  - name: "Yerase TNEF Reader sample-message suite (test-data/test.sh)"
    count: "7 declared; 7 executed"
    description: "Extracts the attachments of winmail.dat plus the bundled *.tnef samples, diffs the output against the committed expected results under test-data/results, then asserts six decoded fields through ytnefprint (PR_MESSAGE_DELIVERY_TIME, PR_TNEF_CORRELATION_KEY, PR_RTF_SYNC_BODY_CRC, PR_RTF_SYNC_BODY_COUNT, PR_RTF_COMPRESSED and the malformed-stream error path). Upstream registers no automake TESTS entry, so the recipe runs the script from build()"

test_package_tests:
  - file: test_package.c
    description: "R34 consumer test linking libytnef::libytnef: parses the bundled one-file.tnef sample with TNEFParseFile() and asserts the stream version, subject, message class, message id, attachment list and decoded MAPI property count, returning a distinct non-zero code per failed assertion"
    command: "conan create . --build=libytnef/*"
  - file: one-file.tnef.b64
    description: "Sample TNEF stream taken from upstream test-data, base64-encoded (binary blobs cannot ride in the PR diff applied by the CI checkout); decoded next to the consumer binary at test() time"

assertion_count: 8
