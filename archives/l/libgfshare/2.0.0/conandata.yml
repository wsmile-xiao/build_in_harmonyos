# conandata.yml — libgfshare 2.0.0
# Single source of truth for source URL + SHA256 + patches.
# conanfile.py reads this via self.conan_data["sources"] and
# apply_conandata_patches().
#
# Upstream: https://github.com/kinnison/libgfshare
# The 2.0.0 tag has no GitHub release asset; the official source is the
# GitHub git-archive tarball (codeload.github.com mirror of the tag ref).
# SHA256 below is computed from the downloaded tarball (20812 bytes).

sources:
  url: "https://github.com/kinnison/libgfshare/archive/refs/tags/2.0.0.tar.gz"
  sha256: "91d7ea7f3e5ddb3854a38827a3f6ea7c597db03067735dc953bd31c5b90f9930"

patches: []
# No patches required. The git-archive tarball ships only configure.ac /
# Makefile.am; build() runs `autoreconf -fi` to generate configure. The
# local (and CI tool_requires-provided) automake 1.18 config.sub recognizes
# aarch64-unknown-linux-ohos, so no config.sub portability patch is needed.
