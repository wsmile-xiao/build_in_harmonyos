package: libgfshare/2.0.0
homepage: "https://github.com/kinnison/libgfshare"

upstream_check_command: "make -n check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/test_gfshare_isfield.c
    source: libgfshare-2.0.0.tar.gz/tests/test_gfshare_isfield.c
    description: "Exhaustively verifies GF(2^8) field axioms (identity, inverse, commutativity, associativity, distributivity) and the exp/log table invariants used by libgfshare."
    command: "./test_gfshare_isfield"
  - file: tests/test_gfshare_blockwise_simple.c
    source: libgfshare-2.0.0.tar.gz/tests/test_gfshare_blockwise_simple.c
    description: "Split/recombine round-trip: 512-byte secret split 3 ways with threshold 2, recovered from 4 different T-subsets (shares 1+2, 1+3, 2+3, 1+2+3)."
    command: "./test_gfshare_blockwise_simple"
  - file: tests/test_gfsplit_gfcombine.sh
    source: libgfshare-2.0.0.tar.gz/tests/test_gfsplit_gfcombine.sh
    description: "Shell integration test exercising the gfsplit + gfcombine CLI round-trip."
    command: "./tests/test_gfsplit_gfcombine.sh"

test_package_tests:
  - file: test.c
    description: "Consumer test: links libgfshare, splits secrets into N shares with threshold T, recovers via two T-subsets, asserts byte-exact recovery across 4 input sizes (16/256/1/8 bytes), validates init_enc rejects zero share numbers."
    command: "./test_libgfshare"

assertion_count: 6
