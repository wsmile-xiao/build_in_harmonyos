package: libgfshare
version: "2.0.0"
homepage: "https://github.com/kinnison/libgfshare"
license: MIT
status: built
build_system: autotools
build_date: "2026-08-25"

source:
  url: "https://github.com/kinnison/libgfshare/archive/refs/tags/2.0.0.tar.gz"
  sha256: "91d7ea7f3e5ddb3854a38827a3f6ea7c597db03067735dc953bd31c5b90f9930"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  command: "make check"
  test_source_files: 3
  check_programs: 2
  tests_registered: 3
  c_test_programs: 2
  shell_integration_tests: 1
  notes: "check_PROGRAMS = test_gfshare_isfield test_gfshare_blockwise_simple; TESTS adds tests/test_gfsplit_gfcombine.sh. test_gfshare_isfield verifies GF(2^8) field axioms exhaustively; test_gfshare_blockwise_simple does split/recombine round-trip; the shell test exercises gfsplit+gfcombine CLI round-trip."

test_package:
  assertion_count: 6
  description: "Links libgfshare, splits a secret into N shares with threshold T, recovers via two different T-subsets, asserts byte-exact recovery across 4 input sizes (16/256/1/8 bytes), and validates gfshare_ctx_init_enc rejects zero share numbers."

knowledge_gained: []
