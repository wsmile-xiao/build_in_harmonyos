software: libgfshare
description: "Shamir Secret Sharing implementation in GF(2^8) (library + CLI tools)"
category: crypto
license: MIT
homepage: "https://github.com/kinnison/libgfshare"

build_system: autotools

ohos_adaptation:
  key_points:
    - "git-archive tarball, no shipped configure → autoreconf -fi in build()"
    - "tool_requires automake/1.18 + libtool/2.5.4 (host automake unusable)"
    - "--build/--host=aarch64-unknown-linux-ohos to skip config.guess probe"
    - "gfshare_maketable generates libgfshare_tables.h at make time (native build)"
    - "E114: strip umask 077 from generated configure (HMDFS)"
    - "E074: make -j1 (HMDFS jobserver fifo EPERM)"
  common_dependencies: []

versions:
  "2.0.0":
    status: built
    build_date: "2026-08-25"
