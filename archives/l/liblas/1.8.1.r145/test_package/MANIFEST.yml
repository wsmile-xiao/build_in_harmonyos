# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liblas/1.8.1.r145
homepage: "https://github.com/libLAS/libLAS"

# 上游测试命令 (TUT 单元测试经 ctest 驱动)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (test/unit, TUT 框架, ctest 名为 liblas_test)
# 注: 本配方 WITH_GEOTIFF=OFF, 上游 test/unit 中 GeoTIFF 门控的
# spatialreference 用例按上游 CMake 条件编译排除, 其余 TUT 用例原样运行
upstream_tests:
  - file: test/unit/bounds_test.cpp
    source: libLAS-33097f17/test/unit/bounds_test.cpp
    description: "上游 Bounds 单元测试 (TUT)"
    command: "./bin/liblas_test"
  - file: test/unit/header_test.cpp
    source: libLAS-33097f17/test/unit/header_test.cpp
    description: "上游 Header 单元测试 (TUT)"
    command: "./bin/liblas_test"
  - file: test/unit/point_test.cpp
    source: libLAS-33097f17/test/unit/point_test.cpp
    description: "上游 Point 单元测试 (TUT)"
    command: "./bin/liblas_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_liblas.cpp
    description: "消费者测试: 版本查询 + Header/Point/Bounds 真实 API 调用 (8 项断言)"
    command: "./test_liblas"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
