# 版本级 manifest — lwbtn 1.3.2

# ============================================================
# 必须字段
# ============================================================

version: "1.3.2"
software: "lwbtn"
status: built
build_date: "2026-09-21"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/MaJerle/lwbtn/archive/refs/tags/v1.3.2.tar.gz"
  sha256: "7ecd4fbfbfa319e1a2ea41730486216a79ff2b675ec7e9e19823bef0f01a10b0"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lwbtn 为 CMake 静态库（library.cmake 注册目标 lwbtn），上游无 install() 规则，conanfile 需在 package() 中手动复制 liblwbtn.a 与头文件（含 configure_file 生成的 lwbtn_opts.h）"
  - "test_package 驱动 lwbtn 状态机要点：lwbtn_process(mstime) 接收绝对毫秒时间戳；首次观察到的按钮状态必须为 inactive（LWBTN_FLAG_FIRST_INACTIVE_RCVD），否则事件被忽略；点击需满足 debounce+click_min 按压时长且释放时长超过 click_multi_max"
  - "GitHub 源在 ghfast.top 镜像 504 时，可预置 conan source download cache（core.sources:download_cache，按 sha256 命名）绕过网络失败（等价 E347）"
