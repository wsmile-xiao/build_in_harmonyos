# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lwbtn/1.3.2
homepage: "https://github.com/MaJerle/lwbtn"

# 上游测试命令: CMake 工程, tests/ 目录注册 ctest 测试
upstream_check_command: "cmake -S . -B build && cmake --build build && ctest --test-dir build"

# conanfile.py build() 中未集成上游测试(库目标构建跳过测试可执行)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_main.c
    source: lwbtn-1.3.2/tests/test_main.c
    description: "lwbtn 主测试: 按压/释放/点击/长按事件状态机验证 (test_lwbtn_main)"
    command: "./build/tests/LwLibPROJECT"
  - file: tests/test_lwbtn_keepalive_dynamic/test_lwbtn_keepalive_dynamic.c
    source: lwbtn-1.3.2/tests/test_lwbtn_keepalive_dynamic/test_lwbtn_keepalive_dynamic.c
    description: "keepalive 动态配置专项测试"
    command: "./test_lwbtn_keepalive_dynamic/__build__/tests/LwLibPROJECT"
  - file: tests/test_lwbtn_no_debounce_dynamic/test_lwbtn_no_debounce_dynamic.c
    source: lwbtn-1.3.2/tests/test_lwbtn_no_debounce_dynamic/test_lwbtn_no_debounce_dynamic.c
    description: "无去抖动动态配置专项测试"
    command: "./test_lwbtn_no_debounce_dynamic/__build__/tests/LwLibPROJECT"
  - file: tests/test_lwbtn_no_debounce_static/test_lwbtn_no_debounce_static.c
    source: lwbtn-1.3.2/tests/test_lwbtn_no_debounce_static/test_lwbtn_no_debounce_static.c
    description: "无去抖动静态配置专项测试"
    command: "./test_lwbtn_no_debounce_static/__build__/tests/LwLibPROJECT"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 注册按钮并驱动状态机, 断言 ONCLICK 事件"
    command: "./test_lwbtn"

# 测试断言总数 (近似值)
assertion_count: 30
