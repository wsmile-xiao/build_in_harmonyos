# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsqlite3/3.50.0
homepage: "https://www.sqlite.org/"

# 上游测试命令（上游 Tcl 回归套件，testfixture 驱动）
# 用例口径: test/*.test 文件 = 1 用例（与审查实测 N=1162 一致）
upstream_check_command: "testfixture test/<name>.test"
upstream_test_in_build: true
upstream_test_command: "for f in test/*.test; do testfixture \"$f\"; done"

# 上游实际执行的测试（sqlite/sqlite tag version-3.50.0 完整源码树 test/ 目录）
# 全量 1162 个 test/*.test；逐文件真实执行记录见
# reports/upstream-test-evidence.md（构建口径、判定标准、结果表、失败定位）
upstream_tests:
  - file: test/*.test (叶子用例 1154 个，含 do_test 断言)
    source: sqlite/sqlite version-3.50.0 test/*.test
    description: "上游 Tcl 回归套件叶子用例：1154 个文件逐文件执行全部 0 errors，do_test 子测试 1,413,931 次执行（harness 摘要实测求和）"
    command: "testfixture test/<name>.test"
  - file: test/all.test
    source: sqlite/sqlite version-3.50.0 test/all.test
    description: "套件调度驱动（自身 0 断言），按 permutation 全量调度；执行结果：单轮实测 5,198,857 子测试（25 个调度套件完成 23 个）后被共享 WSL 环境外部 shutdown 中断（5 次尝试留痕），22 处失败全部定位（16 处清单外 ext/recover + 6 处清单内叶子特定配置偶发）"
    command: "testfixture test/all.test"
  - file: test/full.test
    source: sqlite/sqlite version-3.50.0 test/full.test
    description: "套件调度驱动（自身 0 断言）；执行结果：1,355,810 子测试，4 处失败全部定位到清单外 ext/recover/recoverfault*.test 的 OOM 故障注入扫描尾部漂移（该文件独立执行 0 errors / 8,513 子测试）"
    command: "testfixture test/full.test"
  - file: test/quick.test
    source: sqlite/sqlite version-3.50.0 test/quick.test
    description: "套件调度驱动（自身 0 断言）；执行结果：786,994 子测试，6 处失败定位（4 处同上 ext/recover + 2 处 walsetlk 跨进程锁时序偶发，叶子独立执行 0 errors）"
    command: "testfixture test/quick.test"
  - file: test/extraquick.test
    source: sqlite/sqlite version-3.50.0 test/extraquick.test
    description: "套件调度驱动（自身 0 断言）；执行结果：0 errors，390,026 子测试，通过"
    command: "testfixture test/extraquick.test"
  - file: test/permutations.test
    source: sqlite/sqlite version-3.50.0 test/permutations.test
    description: "permutation 引擎（自身 0 断言）；执行结果：veryquick 入口 0 errors，382,836 子测试，通过"
    command: "testfixture test/permutations.test veryquick"
  - file: test/mallocAll.test
    source: sqlite/sqlite version-3.50.0 test/mallocAll.test
    description: "套件调度驱动（自身 0 断言）；执行结果：中断于 altermalloc2-5-oom-transient.862 SIGSEGV（两次执行同点；崩溃前实测 13,725 子测试全 Ok，叶子 altermalloc2.test 独立执行 9,949 子测试 0 errors）"
    command: "testfixture test/mallocAll.test"
  - file: test/soak.test
    source: sqlite/sqlite version-3.50.0 test/soak.test
    description: "套件调度驱动（自身 0 断言）；执行结果：standalone 不可完整执行（上游跨文件隐式依赖：第 70 行 clock_seconds 仅由 sort4.test:183 跨文件定义；垫片补齐后实测 175 子测试，于 fuzz_malloc.test 起始 db 命令生命周期断裂处中断；其 4 个调度目标叶子独立执行全部 0 errors）"
    command: "testfixture test/soak.test"
  - file: test/memleak.test
    source: sqlite/sqlite version-3.50.0 test/memleak.test
    description: "套件调度驱动（自身 0 断言）；执行结果：standalone 不可执行（第 20 行调用 memleak_check，该命令全源码树无定义，上游历史遗留死脚本；其调度目标叶子独立执行全部 0 errors）"
    command: "testfixture test/memleak.test"

# test_package 中自带的测试 (消费者端到端用例, OHOS aarch64 真机口径)
test_package_tests:
  - file: test.c
    count: 3
    description: "消费者端到端 3 例：文件库持久化 CRUD 生命周期（10 断言）/ 查询引擎路径含 FTS5+RTREE（7 断言）/ 版本与编译特性契约（7 断言）"
    command: "./test_sqlite3"
  - file: conanfile.py (_cli_e2e)
    count: 1
    description: "消费者端到端 1 例：打包 sqlite3 CLI 建库写数 → .dump 导出并校验内容 → 重导入新库 → RAISE(ABORT) 守卫触发器校验两个库（5 校验点）"
    command: "sqlite3 <db> <sql>"

test_case_count: 4
assertion_breakdown:
  consumer_persistence_crud: 10
  consumer_query_engine: 7
  consumer_metadata: 7
  consumer_cli_e2e: 5

# 测试断言总数：C 端 24 + CLI 端 5 = 29
assertion_count: 29
