knowledge_gained:
  - "The official autoconf bundle contains the amalgamation and CLI but not SQLite's separate Tcl test tree; the Conan test_package therefore validates the exported C API directly."
  - "Conan recipes that call apply_conandata_patches must also export the conandata patch set so the recipe remains self-contained on CI workers."
