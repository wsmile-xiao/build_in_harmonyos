sources:
  url: "https://prdownloads.sourceforge.net/libclaw/libclaw/libclaw-1.7.4.tar.gz"
  sha256: "0be289da7f43b1892575f14b27860af5d1e1f6961eae11653d64e625fd7924b7"
patches:
  - patch_file: "patches/0001-cmake-minimum-required-3-5.patch"
    patch_description: "0001 cmake minimum required 3 5"
    patch_type: "portability"
  - patch_file: "patches/0002-cxx11-cxx17-compat.patch"
    patch_description: "C++11 explicit-bool + C++17 unary_function removal port"
    patch_type: "portability"
  - patch_file: "patches/0003-dependent-template-keyword.patch"
    patch_description: "add template keyword for dependent cast_value_type_to"
    patch_type: "portability"
  - patch_file: "patches/0004-boost-bind-rvalue-compat.patch"
    patch_description: "local_swap takes placeholder by value for new Boost.Bind"
    patch_type: "portability"
# NOTE: former 0005 (disable NLS) removed as a context patch: its
# application.cpp hunk claimed @@ -38 but the constructor sits later
# (after the CLAW_MK_STR macros), so preflight apply_conandata_patches
# aborted with "source file is different" (actual
# ' * \\brief Build a char[] string representing an expression.').
# NLS is now disabled tolerantly in build()::_disable_nls, which never
# fails on line-number drift or absence.
# NOTE: former 0002 (drop -std=c++03) removed as a context patch: strict hunk
# failed in preflight ("source file is different", actual
# 'set( CLAW_APPLICATION_SOURCES'). The flag is now removed tolerantly in
# build()::_drop_cxx03_flag, which never fails on drift or absence.
