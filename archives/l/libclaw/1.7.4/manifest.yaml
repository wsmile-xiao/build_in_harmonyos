software: libclaw
version: "1.7.4"
build_system: cmake
status: built
build_date: "2026-09-18"

source:
  url: "https://prdownloads.sourceforge.net/libclaw/libclaw/libclaw-1.7.4.tar.gz"
  sha256: "0be289da7f43b1892575f14b27860af5d1e1f6961eae11653d64e625fd7924b7"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCLAW_INSTALL_CMAKE_MODULES=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - boost/1.91.0
    - libpng/1.6.39
    - libjpeg-turbo/3.0.4
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-minimum-required-3-5.patch"
  - "0002-cxx11-cxx17-compat.patch"
  - "0003-dependent-template-keyword.patch"
  - "0004-boost-bind-rvalue-compat.patch"
  # 0002 (drop -std=c++03) converted to tolerant in-build() replacement, no patch file
  # NLS disable converted to tolerant in-build() _disable_nls replacement, no patch file
  # (former 0005 context patch drifted: application.cpp hunk @@ -38 vs actual ctor
  # after CLAW_MK_STR macros, preflight "source file is different")

knowledge_gained:
  - "上游 cmake_minimum_required(2.6) 需同步补丁与 POLICY_VERSION_MINIMUM (devil/leptonica 先例, E103)"
  - "上游全局 -std=c++03 与 Boost>=1.84 冲突, 删除后由工具链 C++17 接管"
  - "C++11/C++17 可移植: configuration_file.cpp 显式 static_cast<bool> (istream operator bool 显式化), functional.hpp 去掉 C++17 已移除的 unary/binary_function 基类并自带 typedef (dawg 先例)"
  - "FindJPEG/FindPNG/FindBoost 老模块用绝对路径变量直连 Conan 产物 (stiff/opencv 先例)"
  - "1.7.4 无上游测试套件, 按 no_tests 口径由 test_package 输出证据 (bwm/0.6.3 先例)"
