# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libclaw/1.7.4
homepage: "https://libclaw.sourceforge.net/"

# 上游测试套件存在性 (经审计上游 1.7.4 源码确认)
upstream_tests_exist: false

# 上游测试审计 (源码: SourceForge libclaw-1.7.4.tar.gz,
# sha256 0be289da7f43b1892575f14b27860af5d1e1f6961eae11653d64e625fd7924b7,
# 与 Debian orig 包同值; 交叉核对 j-jorge/libclaw tag 1.7.4)
# 顶层 CMakeLists.txt 无 enable_testing/add_test; 1.7.4 发布包无 test/
# 目录 (test/check-examples.sh 仅存在于 master 后续开发分支);
# examples/ 下 20+ 个子目录均为演示程序 (main.cpp + CMakeLists),
# 无断言/期望输出比对, 不构成测试套件。
upstream_test_audit:
  source_tarball: "libclaw-1.7.4.tar.gz (SourceForge libclaw/libclaw)"
  source_sha256: "0be289da7f43b1892575f14b27860af5d1e1f6961eae11653d64e625fd7924b7"
  source_origin: "https://prdownloads.sourceforge.net/libclaw/libclaw/libclaw-1.7.4.tar.gz"
  top_level_files:
    - file: "CMakeLists.txt"
      role: "构建入口, cmake_minimum_required(2.6), 无 enable_testing/add_test"
      test_targets: "none (无 ctest 注册, 无 add_subdirectory(test))"
      is_test: false
    - file: "claw/ (约 100 个公开头文件 + code/ 实现)"
      role: "库实现 (application/config/logger/net/graphic/tween)"
      test_targets: "none (无 TEST()/TEST_F()/def test_ 包裹, 无独立测试入口)"
      is_test: false
    - file: "examples/ (application/automaton/avl/compress/config_file/curve/... 共 20+ demos)"
      role: "演示程序 (各含 main.cpp, 输出 .plot 数据文件, 无断言)"
      test_targets: "none (无期望输出比对, CTest 未注册)"
      is_test: false
    - file: "doc/ + desktop/ + cmake-module/ + claw-config.in"
      role: "文档/桌面文件/CMake 查找模块, 非测试套件"
      test_targets: "none"
      is_test: false
  scanned_for:
    - "enable_testing / add_test (ctest)"
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "tests/ / test/ / t/ / spec/ 目录 (1.7.4 发布包)"
    - "check_PROGRAMS / TESTS (automake)"
  scan_result: "0 matches — 顶层 CMakeLists.txt 全文无 enable_testing/add_test (已逐行核对 j-jorge/libclaw tag 1.7.4); 1.7.4 文件清单无 test/ 目录; examples/ 均为演示程序无断言"
  make_check_output: "不适用 (CMake 项目无 make check 目标); build() 不调用 ctest (upstream_test_in_build: false), 证据由 test_package 阶段 no_tests 标记给出 (对齐 bwm/0.6.3 范例)"
  reason: "libclaw 1.7.4 上游为纯 C++ 库, 发布包不含任何测试套件: 无 ctest/gtest/pytest 注册, 无 tests/test 目录, examples 仅为演示程序"

# 上游测试命令 (上游无测试套件, 故为空; 对齐 bwm/0.6.3 范例)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
upstream_tests: []

# 上游测试总数 (rule4 门禁要求显式声明, 缺失不得按 0 处理)
# 口径 ctest_entries: 顶层 CMakeLists.txt 无 enable_testing/add_test,
# 在上游构建树执行 ctest -N 发现 0 用例, 与本字段一致
upstream_test_total: 0
upstream_test_count_method: ctest_entries

test_package_tests:
  - file: test_libclaw.cpp
    description: "tween single_tweener 运行至完成且终值正确 (checks 1-2)"
    command: "ctest -R test_libclaw"
  - file: test_libclaw.cpp
    description: "box_2d 几何 width/area 校验 (checks 3-4)"
    command: "ctest -R test_libclaw"
  - file: test_libclaw.cpp
    description: "configuration_file ini 解析 has_field/取值校验 (checks 5-6)"
    command: "ctest -R test_libclaw"

assertion_count: 6
