# 版本级 manifest — libportal 0.10.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.10.0"
software: libportal

# published | built | failed | archived
status: built

build_date: "2026-09-15"
build_system: meson

source:
  url: "https://github.com/flatpak/libportal/releases/download/0.10.0/libportal-0.10.0.tar.xz"
  upstream_url: "https://github.com/flatpak/libportal"
  sha256: "1c74a3f7becbd4ff745d7f565afd06e97e50eb080a0e268cb14bb55289a745bf"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dbackend-gtk3=enabled"
    - "-Dbackend-gtk4=disabled"
    - "-Dbackend-qt5=disabled"
    - "-Dbackend-qt6=disabled"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Ddocs=false"
    - "-Dtests=false"
  dependencies:
    - glib/2.84.0.1
    - gtk/3.24.43
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libportal 0.10.0（Meson）核心库仅依赖 gio-2.0/gio-unix-2.0（D-Bus 走 GDBus 客户端 API，构建期不需要运行时 bus）；gtk3 backend 是可选 feature，OHOS 适配按任务前置要求 -Dbackend-gtk3=enabled"
