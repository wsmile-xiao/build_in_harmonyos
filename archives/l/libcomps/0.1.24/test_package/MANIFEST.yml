# test_package/MANIFEST.yml — libcomps 0.1.24 verification manifest
#
# The upstream suite is run inside build() (see ../conanfile.py):
#   * "test"       -> "ctest"      -> test_comps_run + test_parse_run
#   * "pytest_run" -> run_tests.sh -> __test.py, test_libcomps.py,
#                                     test_merge_comps.py
# The consumer program below is the HarmonyOS-specific row and is NOT part of
# the upstream case count.
package: libcomps/0.1.24
software: libcomps
version: "0.1.24"
homepage: "https://github.com/rpm-software-management/libcomps"

upstream_check_command: "cmake --build . --target test ; cmake --build . --target pytest_run"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target test && cmake --build . --target pytest_run"

# Upstream case counting uses the "registered case" unit, see ../notes.md for
# the four candidate readings and why 123 is the declared N.
upstream_tests:
  - suite: "test_comps (Check framework)"
    source: "libcomps/tests/check_comps.c"
    cases: 5
    run_by: "test -> ctest -> test_comps_run"
  - suite: "test_parse (Check framework)"
    source: "libcomps/tests/check_parse.c"
    cases: 8
    run_by: "test -> ctest -> test_parse_run"
  - suite: "__test.py (unittest)"
    source: "libcomps/src/python/tests/__test.py"
    cases: 84
    run_by: "pytest_run -> run_tests.sh"
  - suite: "test_libcomps.py (unittest)"
    source: "libcomps/src/python/tests/test_libcomps.py"
    cases: 11
    run_by: "pytest_run -> run_tests.sh"
  - suite: "test_merge_comps.py (unittest)"
    source: "libcomps/src/python/tests/test_merge_comps.py"
    cases: 4
    run_by: "pytest_run -> run_tests.sh"
  - suite: "test_objrtree / test_validate (Check framework, built but never run upstream)"
    source: "libcomps/tests/check_objrtree.c, libcomps/tests/check_validate.c"
    cases: 5
    run_by: "not wired into any upstream run target"
  - suite: "test_list (Check framework, source present, target commented out upstream)"
    source: "libcomps/tests/check_list.c"
    cases: 6
    run_by: "not built: libcomps/tests/CMakeLists.txt comments out add_executable(test_list ...)"

test_type: installed-package
test_package_tests:
  - file: test_libcomps.c
    name: test_libcomps
    description: "30-check consumer contract against the installed libcomps: comps_parse_parsed_create/_init/comps_parse_str, group/category/environment filters, group id/name/uservisible/default accessors, per-type and per-name package queries, comps2xml_str round trip, comps_doc_union"
    command: "./test_libcomps"

executables:
  - name: test_libcomps
    purpose: "installed-package API contract verification against the packaged headers and static library"

cases: 1
assertions: 30
