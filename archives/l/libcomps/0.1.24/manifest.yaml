software: libcomps
version: "0.1.24"
conan_ref: "libcomps/0.1.24"
status: built
build_date: "2026-09-20"
build_system: cmake

source:
  url: "https://github.com/rpm-software-management/libcomps/archive/refs/tags/0.1.24.tar.gz"
  sha256: "c24a81dea8e9f7f3c877618d3812a5293df772abc6b90fad1d34fa62326141bc"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_LIBCOMPS_SHARED=OFF"
    - "-DENABLE_TESTS=ON"
    - "-DENABLE_DEVELOPMENT=ON"
    - "-DENABLE_DOCS=OFF"
    - "-DCMAKE_HOME_DIRECTORY=<src>/libcomps"
  dependencies:
    - zlib/1.3.1.1
    - libxml2/2.15.3.1
    - expat/2.8.2.1
    - python/3.12.9
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-python-binding-install-dir.patch"
  - "0002-tests-portability.patch"
  - "0003-headers-install-comps-types.patch"

knowledge_gained:
  - "libcomps 0.1.24 的 CMake 工程根不是 tarball 顶层而是 libcomps/ 子目录（顶层只有 version.cmake、RPM spec 与 scikit-build 元数据）；配方用 build_script_folder=\"libcomps\"，与上游 spec 的 %cmake ../libcomps/ 一致。顶层 pyproject.toml/setup.py/setup_for_python_metadata.py 是 PyPI wheel 的打包 manifest，主体语言真值是 C（lang-preflight 实测 detected=c，未命中绑定 manifest 假阳性） # knowledge_ref: knowledge/drafts/E615-draft-LCMP.kv"
  - "Conan 的 CMakeToolchain 会写 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON。若不调用 CMakeDeps 且不显式钉住上游读的旧式变量（LIBXML2_LIBRARY/LIBXML2_LIBRARIES/EXPAT_LIBRARY/ZLIB_LIBRARIES/ZLIB_INCLUDE_DIRS/CHECK_LIBRARY/CHECK_INCLUDE_DIR），find_package/find_library 会命中设备宿主 ~/.harmonybrew 的 libxml2/zlib 配置，产物静默链接到非声明依赖（设备全绿、干净 worker 必红） # knowledge_ref: knowledge/drafts/E615-draft-LCMP.kv"
  - "上游 tests/CMakeLists.txt 的 add_custom_target 命令里写 $LD_LIBRARY_PATH：Makefile 生成器按 make 变量展开、Ninja 生成器按 ninja 变量展开，两种生成器都会把继承来的库搜索路径清空，测试二进制随即 relocating 失败；补丁改写为双美元转义后两种生成器都正确传递 # knowledge_ref: knowledge/drafts/E615-draft-LCMP.kv"
  - "check 0.15.2 的 IPC 临时文件受 TEMP/TMPDIR 控制（不是硬编码 /tmp）：在 /tmp 只读的 OHOS 设备上只要把 TMPDIR/TMP/TEMP 指向构建目录内的可写目录，check 套件即可全量运行（CK_FORK=no 同时保留） # knowledge_ref: E011；knowledge/drafts/E615-draft-LCMP.kv"
  - "上游 install(FILES ${libcomps_HEADERS}) 的清单漏了 comps_types.h，而已安装的 comps_log.h 会 include 它：不补丁则本包的任何消费者都无法编译（上游 RPM 用 include/libcomps/*.h 通配安装，掩盖了该缺陷） # knowledge_ref: knowledge/drafts/E615-draft-LCMP.kv"
  - "libcomps 的公开头文件包含 libxml 与 expat 的头，因此这两个依赖必须声明 transitive_headers=True；否则 CMakeDeps 生成的传递依赖 config 里 INCLUDE_DIRS 为空，消费者编译失败（Conan 传递依赖默认不传播头文件） # knowledge_ref: knowledge/drafts/E615-draft-LCMP.kv"
  - "上游 0.1.24 的 pytest 目标没有依赖 pytest_run，make test 不会执行 Python 绑定测试；绑定（libcomps/__init__.py + _libpycomps.so）随本包交付，配方显式构建 pytest_run 以验证 __test.py/test_libcomps.py/test_merge_comps.py # knowledge_ref: knowledge/drafts/E615-draft-LCMP.kv"
