# conandata.yml — libcomps 0.1.24
# Official source: RPM Software Management upstream (GitHub tag 0.1.24).

sources:
  url: "https://github.com/rpm-software-management/libcomps/archive/refs/tags/0.1.24.tar.gz"
  sha256: "c24a81dea8e9f7f3c877618d3812a5293df772abc6b90fad1d34fa62326141bc"

patches:
  - patch_file: "patches/0001-python-binding-install-dir.patch"
    patch_description: "Let packagers override the Python binding install prefix (an absolute sitearch path ignores --prefix/DESTDIR and escapes the package tree)"
    patch_type: "portability"
  - patch_file: "patches/0002-tests-portability.patch"
    patch_description: "Make the upstream test targets portable: link the Expat library CMake located instead of the bare -lexpat name, and escape LD_LIBRARY_PATH so the build generator stops dropping the inherited search path"
    patch_type: "portability"
  - patch_file: "patches/0003-headers-install-comps-types.patch"
    patch_description: "Install comps_types.h: the installed comps_log.h includes it, so the public header set was incomplete and no consumer could compile"
    patch_type: "portability"
