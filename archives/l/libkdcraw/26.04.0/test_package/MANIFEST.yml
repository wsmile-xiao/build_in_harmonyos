# MANIFEST.yml - test_package for libkdcraw 26.04.0
name: libkdcraw
version: "26.04.0"
test_type: consumer
description: >
  Consumer test for the libkdcraw 26.04.0 conan package on
  HarmonyOS PC (aarch64). Builds a small Qt6 application that links
  KDcraw (KDcrawQt6) and calls KDcraw::version / librawVersion /
  rawFilesList / supportedCamera / RawDecodingSettings /
  DcrawInfoContainer APIs plus decode-path rejection checks, then runs
  it with the offscreen Qt platform.
build_system: cmake
language: c++
runner: ctest
