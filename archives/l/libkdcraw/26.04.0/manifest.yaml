  test_package: "passed: 1/1 KDcraw consumer compile/link/runtime smoke (version/librawVersion/rawFilesList/supportedCamera/RawDecodingSettings/DcrawInfoContainer + decode-path rejection, offscreen platform, __OHOS__ check)"
  full_reference: "libkdcraw/26.04.0#7beb1eaff53dcb08853368df9ac3b514:7238b6908645ddcc192eb785e781237c584b1412#ab97349dd4bc84cee23a0250d808d185"
