knowledge_gained:
  - "libkdcraw 26.04.0 builds the KDcraw target with OUTPUT_NAME KDcrawQt6; the CMake package name is KDcrawQt6 (KDcrawQt6Config.cmake) and the imported target is KDcrawQt6 (EXPORT_NAME KDcrawQt6, empty NAMESPACE)."
  - "Upstream 26.04.0 requires only Qt6 Core+Gui, LibRaw>=0.18 and ECM - no KF6 framework library is needed at build or runtime (unlike libkdegames)."
  - "Upstream tests/ (raw2png, libinfo) are manual command-line tools built with BUILD_TESTING=ON but never registered via add_test; ctest -N reports 0 tests - the upstream N for PR statistics is 0 registered."
  - "Upstream FindLibRaw (cmake/modules/FindLibRaw.cmake) is a plain find_path/find_library module; it resolves against CMAKE_PREFIX_PATH/CMAKE_LIBRARY_PATH seeded with the libraw conan package folder, no PkgConfig needed."
  - "KDcrawConfig.cmake.in find_dependency chain is Qt6Core+Qt6Gui only (static builds add LibRaw); consumers must provide Qt6 themselves."
