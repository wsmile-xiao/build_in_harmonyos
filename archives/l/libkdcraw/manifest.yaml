software: libkdcraw
display: "libkdcraw"
description: "KDE RAW image decoding library wrapper around LibRaw (KDcraw thread-safe RAW decode/identify/preview APIs, RawDecodingSettings, DcrawInfoContainer)"
category: library
homepage: "https://invent.kde.org/graphics/libkdcraw"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "Upstream 26.04.0 needs only Qt6 Core+Gui + LibRaw>=0.18 + ECM; no KF6 framework library is required"
    - "cmake/modules/FindLibRaw.cmake (module mode) resolves against the conan libraw/0.22.1 package via CMAKE_PREFIX_PATH/CMAKE_LIBRARY_PATH/CMAKE_INCLUDE_PATH seeding (no PkgConfig on OHOS)"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5 passed on the command line for the OHOS SDK CMake 4.x deprecation policy (tarball declares cmake_minimum_required 3.16)"
    - "conan_cmakedeps_paths.cmake written manually because qtbase/libraw packages use cmake_find_mode=none (CMakeDeps doesn't add their lib/cmake dirs to CMAKE_PREFIX_PATH)"
    - "Upstream tests/ (raw2png, libinfo) are built with BUILD_TESTING=ON but never registered via add_test - upstream ctest count is 0; both tools are smoke-run inside conan create"
    - "Installed CMake package name is KDcrawQt6 (imported target KDcraw, empty namespace, SOVERSION 5)"
  common_dependencies:
    - qtbase
    - libraw
    - ecm

versions:
  - version: "26.04.0"
    status: built
    date: 2026-09-15
