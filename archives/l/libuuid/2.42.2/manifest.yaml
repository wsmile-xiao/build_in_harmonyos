software: libuuid
version: "2.42.2"
status: built
build_date: "2026-09-19"
build_system: autotools
issue: "#13727"

source:
  url: "https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
  sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
  tar_format: tar.xz

build:
  system: autotools
  options:
    - "--build=<derived from Conan settings_build.arch>"
    - "--host=<derived from Conan settings.arch>"
    - "--disable-all-programs"
    - "--enable-libuuid"
    - "--disable-libblkid"
    - "--disable-libmount"
    - "--disable-libsmartcols"
    - "--disable-libfdisk"
    - "--without-python"
    - "--without-systemd"
    - "--without-udev"
    - "--disable-makeinstall-chown"
    - "--disable-makeinstall-setuid"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-config-guess-ohos-detection.patch"

knowledge_gained:
  - "util-linux 2.42.2 config/config.sub already knows ohos*/linux-ohos*-; config.guess still needs the HarmonyOS detection patch (same as util-linux-login 2.42.2 / libblkid 2.42.2)."
  - "The E011 umask 077 fix from libblkid 2.42.2 (in-recipe sed umask 077->022) supersedes the 2.40.4 approach of patching configure's ac_tmp; both address HMDFS 0700 temp dirs being unwritable."
  - "libuuid check_PROGRAMS: test_uuid_parser + test_uuid_time in libuuid/src/Makemodule.am, test_uuid_namespace in tests/helpers/Makemodule.am (not gated by BUILD_LIBUUID_TESTS in 2.42.2 - all built with plain make targets)."
  - "uuid_get_template returns the RFC 4122 namespace UUIDs (dns/url/oid/x500); usable for a pkg-config-free template test in test_package."

patch_classification:
  - file: "patches/0001-config-guess-ohos-detection.patch"
    type: "portability"
    platform_only: true
    guard: "none"
