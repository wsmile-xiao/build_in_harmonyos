package: libuuid/2.42.2
homepage: "https://www.kernel.org/pub/linux/utils/util-linux/"

upstream_check_command: "make test_uuid_parser test_uuid_time test_uuid_namespace"
upstream_test_in_build: true
upstream_test_command: "./test_uuid_parser && ./test_uuid_namespace && ./test_uuid_time"
upstream_tests:
  - file: libuuid/src/test_uuid.c
    description: "test_uuid_parser: 14 uuid_parse assertions (valid/invalid UUID strings, case handling, all-zero, boundary)."
  - file: tests/helpers/test_uuid_namespace.c
    description: "test_uuid_namespace: 7 uuid_get_template assertions (dns/url/oid/x500 RFC 4122 templates + NULL/empty/unknown)."
  - file: libuuid/src/gen_uuid.c
    description: "test_uuid_time (gen_uuid.c -DTEST_PROGRAM): time-based (v1) UUID generation and time-field extraction."

test_package_tests:
  - file: test_uuid_pkg.c
    description: "Offline API smoke test: generate/parse/compare/is_null/clear, type+variant nibbles, namespace templates, v1 uuid_time, md5/sha1 (v3/v5) generation."
    command: "cmake --build <builddir> && <builddir>/test_uuid_api"

assertion_count: 19
