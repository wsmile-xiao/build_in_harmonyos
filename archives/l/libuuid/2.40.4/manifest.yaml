software: "libuuid"
version: "2.40.4"
status: built
build_date: "2026-09-16"
build_system: autotools

source:
  url: "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.40/util-linux-2.40.4.tar.xz"
  sha256: "5c1daf733b04e9859afdc3bd87cc481180ee0f88b5c0946b16fdec931975fb79"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=<derived from Conan settings_build.arch>"
    - "--host=<derived from Conan settings.arch>"
    - "--disable-all-programs"
    - "--enable-libuuid"
    - "--without-python"
    - "--disable-makeinstall-chown"
    - "--disable-makeinstall-setuid"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-configure-use-tmpdir-for-config-status.patch"

knowledge_gained:
  - "util-linux can build libuuid alone with --disable-all-programs --enable-libuuid."
  - "Install-time chown/setuid handling should be disabled in the CI package build."
  - "Autotools build and host triplets come from the Conan build and host contexts respectively."
  - "The recipe locates an available awk implementation instead of assuming gawk exists."
  - "On HMDFS the configure temp dir must NOT be created with umask 077: process uid differs from file owner, a 0700 dir becomes unwritable and config.status fails with Permission denied."

patch_classification:
  - file: "patches/0001-configure-use-tmpdir-for-config-status.patch"
    type: "portability"
    platform_only: true
    guard: "none"
