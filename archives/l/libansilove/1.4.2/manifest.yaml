# 遵循 ARCHIVE-SPEC v2.0
version: "1.4.2"
software: "libansilove"
status: published
build_date: "2026-09-11"
build_system: cmake

source:
  url: "https://github.com/ansilove/libansilove/releases/download/1.4.2/libansilove-1.4.2.tar.gz"
  sha256: "8bd4d0775ff558aacfebd7e7e284baa96d781183bf767283bf8410f44a2e2434"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_PLATFORM_NO_VERSIONED_SONAME=ON"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies:
    - "gd/2.3.3"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "HarmonyOS 无 CMake Platform 模块导致 SOVERSION 失效：NO_VERSIONED_SONAME + 注入 SONAME_C_FLAG（libharu 同根因）"
  - "gd/2.3.3.2 为 ENABLE_PNG=OFF 桩版，PNG 输出需求必须选 gd/2.3.3"
  - "gd 静态链入但 png/zlib 为共享依赖：.so 链接需补 -lpng16 -lz（OHOS lld --no-allow-shlib-undefined），NEEDED = libpng16 + libz + libc"
  - "上游无测试套件（0 add_test）；example 默认不构建"
