# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
#
# 上游 libansilove 1.4.2 无正式测试套件：
#   - 全树无 add_test/enable_testing/CTest 集成（CMakeLists.txt 仅定义库 target）
#   - example/ 非默认构建（不进 ALL），仅演示 API 用法，无断言
#   - fuzz/ 目标需 -fsanitize=fuzzer，非发布 tarball 的一部分（example/、fuzz/ 均在
#     tarball 内但 fuzz 依赖 clang fuzzer）
#   - 上游 CI（.github/workflows）只跑构建矩阵，不跑测试
#
# 因此本包不执行上游测试（0 个 add_test，非桩版清点），以下为本仓库自有测试：
tests:
  - type: consumer
    name: test_package
    origin: repo-local
    count: 1 executable (25 checks)
    description: >
      内联 ANSI/XBIN 输入走全链路：loadfile → loader 渲染 → savefile PNG。
      断言解析成功、PNG 魔数+IHDR 宽高（默认 640x32 / 80x50 字体 640x16 /
      truecolor 同尺寸 / XBIN 640x16）、错误路径（缺文件 FILE_READ_ERROR、
      非法控制序列容错）、字体/画布尺寸参数化。
  - type: ohos-runtime
    name: test_ohos
    origin: repo-local
    count: 1 executable (13 checks)
    description: >
      编译期 AArch64/musl 断言 + 真实 SGR ANSI 渲染（256 色、加粗/斜体/反色/
      消隐/闪烁）+ 字体表索引验证（80x50 字形高度 16）。
  - type: ohos-elf
    name: test_elf.sh
    origin: repo-local
    count: 1 script (8 assertions)
    description: >
      ELF 层断言：AArch64、DT_SONAME、NEEDED (libpng16/libz/libc)、
      .codesign 段、无 RPATH/RUNPATH、musl 判定（无 ld-linux）。
upstream_ctest_count: 0
upstream_tests_run: false
upstream_tests_note: "上游 1.4.2 无测试套件（无 add_test）；见 reports/upstream-tests.md"
