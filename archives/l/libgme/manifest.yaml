software: libgme
display: "libgme"
description: "Video game music emulation library - plays music from NES, Game Boy, Sega, and other classic game consoles"
category: media
homepage: "https://bitbucket.org/mpyne/game-music-emu/wiki/Home"
license: LGPL-2.1-or-later
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "**必须添加 -DENABLE_UBSAN=OFF 禁用 UBSan**（默认启用会导致运行时符号缺失）"
    - "CMake 会检测到未知平台 HarmonyOS，但可继续编译"
    - "无需补丁即可编译"
    - "SDL2 是可选依赖（demo player），不影响核心库"
    - "动态库依赖 libc++_shared.so，确保系统有 libc++ 运行时"
  common_dependencies:
    - zlib
    - libc++

# 版本索引（所有已归档版本，含状态）
versions:
  "0.6.3":
    status: published
    build_date: "2026-06-05"