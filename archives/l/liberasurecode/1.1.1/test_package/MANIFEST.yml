# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liberasurecode/1.1.1
homepage: "https://github.com/openstack/liberasurecode"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（本地实测，全部通过）
upstream_tests:
  - file: test/liberasurecode_test.c
    source: liberasurecode-1.1.1/test/liberasurecode_test.c
    description: "核心 API 测试：create/destroy/encode/decode/reconstruct/fragments/metadata/verify 全后端矩阵"
    command: "./liberasurecode_test"
  - file: test/libec_slap.c
    source: liberasurecode-1.1.1/test/libec_slap.c
    description: "libec 后端抽象层压测（encode/reconstruct 循环）"
    command: "./libec_slap"
  - file: test/builtin/xor_codes/test_xor_hd_code.c
    source: liberasurecode-1.1.1/test/builtin/xor_codes/test_xor_hd_code.c
    description: "内置 XOR-HD 编码解码测试（含多种 (k,m) 组合）"
    command: "./test_xor_hd_code"
  - file: test/builtin/rs_vand/rs_galois_test.c
    source: liberasurecode-1.1.1/test/builtin/rs_vand/rs_galois_test.c
    description: "Galois 域运算测试（乘法/除法/逆元）"
    command: "./rs_galois_test"
  - file: test/builtin/rs_vand/liberasurecode_rs_vand_test.c
    source: liberasurecode-1.1.1/test/builtin/rs_vand/liberasurecode_rs_vand_test.c
    description: "内置 RS-Vandermonde 后端矩阵测试"
    command: "./liberasurecode_rs_vand_test"
  - file: test/utils/chksum/test_alg_sig.c
    source: liberasurecode-1.1.1/test/utils/chksum/test_alg_sig.c
    description: "校验和/算法签名 XOR 测试（8_32/16_64/16_32）"
    command: "./alg_sig_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：创建/销毁 NULL 后端 liberasurecode 实例"
    command: "./test_liberasurecode"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 258
