software: lua-resty-dns
display: "lua-resty-dns"
description: "OpenResty DNS client library - non-blocking DNS resolver for ngx_lua"
category: network              # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://github.com/openresty/lua-resty-dns"
license: BSD-2-Clause
build_system: makefile         # 纯 Lua 库，使用简单 Makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Lua 库，无需编译，只需 make install"
    - "需要设置 LUA_VERSION=5.4（或其他版本）"
    - "需要依赖 OpenResty 或 ngx_lua 环境"
  common_dependencies:
    - lua

# 版本索引（所有已归档版本，含状态）
versions:
  "v0.23":
    status: built              # published | built | failed | archived
    build_date: "2026-06-11"