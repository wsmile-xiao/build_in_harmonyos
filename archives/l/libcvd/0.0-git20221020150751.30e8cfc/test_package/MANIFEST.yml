package: libcvd/0.0-git20221020150751.30e8cfc
homepage: "https://github.com/edrosten/libcvd"
upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"
upstream_tests:
  - file: tests/distance_transform_test.cc
    source: libcvd/tests/distance_transform_test.cc
    description: Distance transform
    command: distance_transform_test
  - file: tests/fast_corner_test.cc
    source: libcvd/tests/fast_corner_test.cc
    description: FAST corner detection
    command: fast_corner_test
  - file: tests/load_and_save.cc
    source: libcvd/tests/load_and_save.cc
    description: Image I/O including JPEG, PNG and TIFF
    command: load_and_save
  - file: tests/convolution.cc
    source: libcvd/tests/convolution.cc
    description: Image convolution
    command: convolution
  - file: tests/flips.cc
    source: libcvd/tests/flips.cc
    description: Image flip and transpose
    command: flips
conditional_upstream_tests:
  - file: tests/videoreader_test.cc
    condition: CVD_HAVE_FFMPEG (not enabled in this recipe)
  - file: tests/videowriter_test.cc
    condition: CVD_HAVE_FFMPEG (not enabled in this recipe)
  - file: tests/opencv_test.cc
    condition: CVD_ENABLE_OPENCV_TESTS (disabled by upstream default)
test_package_tests:
  - file: test.cpp
    description: Consumer image allocation, indexing and linked timer symbol
    command: test_libcvd
assertion_count: 4
