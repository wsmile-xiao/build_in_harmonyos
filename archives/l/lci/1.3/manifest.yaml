# 版本级 manifest — lci 1.3 (justinmeza/lci, LOLCODE 1.3 interpreter)

# 版本号
version: "1.3"

# 软件名
software: "lci"

# 编译状态
# published | built | failed | archived
# built: 本地 W3/conan-verify 已验证通过，制品尚未经远端 CI/release 流水线 upload
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://github.com/justinmeza/lci/archive/refs/tags/v1.3.tar.gz"

  # 源码校验和
  sha256: "56a77f8a19e6284868e609dad0e4f1d7c9fe59a61398e338726b58016c1eecef"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）— lci 仅依赖 libm，无三方依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
# 路径决定: path_a_no_knowledge（见 notes.md 知识候选台账）
# 本库适配零错误、零补丁，无新增可跨库复用知识，不建草稿
knowledge_gained: []