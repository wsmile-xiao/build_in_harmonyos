# test_package/MANIFEST.yml
# 上游官方测试声明文件 — lci 1.3 (justinmeza/lci, LOLCODE 1.3 interpreter)
# 枚举方式: ctest -N（CMake ADD_LOL_TEST 注册），官方 tag v1.3 源码 test/1.3-Tests/
# 共 319 个叶子测试目录（每个 = 1 个 ctest 用例，1 个 test.lol 程序 + 期望输出 test.out）
# 其中 0-Benchmarks/1-BFInterpreter 为基准测试（按规则列出但不计入独立用例分母）

package: lci/1.3
homepage: "https://github.com/justinmeza/lci"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（分类汇总，完整逐项台账见 notes.md / test-report.md）
upstream_tests:
  - file: test/1.3-Tests/0-Benchmarks/1-BFInterpreter/test.lol
    source: lci-1.3/test/1.3-Tests/0-Benchmarks/1-BFInterpreter/test.lol
    description: "基准测试（Brainfuck 解释器）— 列出但不计入独立用例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out -i=test.in"
  - file: test/1.3-Tests/1-Structure/*/test.lol (17 例)
    source: lci-1.3/test/1.3-Tests/1-Structure/
    description: "语言结构（HAI/KTHXBYE、缩进、分隔符、换行、INCLUDES）17 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/2-Comments/*/test.lol (17 例)
    source: lci-1.3/test/1.3-Tests/2-Comments/
    description: "注释 17 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/3-Types/*/test.lol (21 例)
    source: lci-1.3/test/1.3-Tests/3-Types/
    description: "类型（NIL/布尔/整数/浮点/字符串）21 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/4-Output/*/test.lol (7 例)
    source: lci-1.3/test/1.3-Tests/4-Output/
    description: "VISIBLE 输出 7 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/5-Input/*/test.lol (2 例)
    source: lci-1.3/test/1.3-Tests/5-Input/
    description: "GIMMEH 输入 2 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out -i=test.in"
  - file: test/1.3-Tests/6-Variables/*/test.lol (16 例)
    source: lci-1.3/test/1.3-Tests/6-Variables/
    description: "变量（声明/初始化/赋值/作用域）16 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/7-Operators/*/test.lol (184 例)
    source: lci-1.3/test/1.3-Tests/7-Operators/
    description: "运算符（算术/逻辑/比较/位运算等）184 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/8-Conditionals/*/test.lol (10 例)
    source: lci-1.3/test/1.3-Tests/8-Conditionals/
    description: "条件（O RLY?/WTF?）10 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/9-Functions/*/test.lol (11 例)
    source: lci-1.3/test/1.3-Tests/9-Functions/
    description: "函数（HOW IZ I/IM IN YR）11 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/10-Loops/*/test.lol (9 例)
    source: lci-1.3/test/1.3-Tests/10-Loops/
    description: "循环 9 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/11-Unicode/*/test.lol (9 例)
    source: lci-1.3/test/1.3-Tests/11-Unicode/
    description: "Unicode 9 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"
  - file: test/1.3-Tests/12-Arrays/*/test.lol (15 例)
    source: lci-1.3/test/1.3-Tests/12-Arrays/
    description: "数组（bukkit）15 例"
    command: "python3 test/testDriver.py build/lci test.lol -o=test.out"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试：真实运行已安装 lci 解释器执行 LOLCODE 程序并核验输出/退出码（R34）"
    command: "bash test.sh <work_dir>"

# 测试断言总数 (319 用例 × 每例 test.out 期望输出比较，消费侧另有 3 项检查)
assertion_count: 322
