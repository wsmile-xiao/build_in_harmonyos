package: lci/1.1
homepage: "https://github.com/chatziko/lci"

upstream_tests_exist: true
upstream_test_audit:
  - source: "top-level CMakeLists.txt"
    reason: "enable_testing() registers three unconditional CTest cases: build, queens, fixed_point; a fourth (valgrind) is conditionally registered only when find_program(VALGRIND) succeeds."
  - source: "CMakeLists.txt queens test"
    reason: "Pipes \"Consult 'queens.lci'; Queens 5\" into ./lci and matches the full 10-solution list of the 5-queens instance via PASS_REGULAR_EXPRESSION — real interpreter functionality."
  - source: "CMakeLists.txt fixed_point test"
    reason: "Pipes \"FixedPoint; Append [3,4,[]] [5]\" into ./lci and matches \"cycles removed.*[3, 4, [], 5]\" — Y-combinator normalization plus list Append."
  - source: ".github/workflows/test.yml"
    reason: "Upstream CI runs ctest --output-on-failure on ubuntu/macos/windows; the valgrind case is absent on systems without valgrind, matching the conditional registration."
  - conclusion: "the upstream CMakeLists.txt defines 4 CTest cases in total (build, queens, fixed_point unconditionally; valgrind conditionally on find_program(VALGRIND)); the 3 unconditional ones are all executed in this adaptation via ctest in the recipe build() and re-verified against the installed package by test_package; the conditional valgrind case is not registered on OHOS (no valgrind in the target environment)."

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target all && ctest --output-on-failure"
upstream_tests:
  - name: build
    type: build-smoke
    command: "make lci"
  - name: queens
    type: functional
    command: "sh -c \"printf \\\"Consult 'queens.lci'; Queens 5\\\\n\\\" | ./lci\\\""
  - name: fixed_point
    type: functional
    command: "sh -c \"printf \\\"FixedPoint; Append [3,4,[]] [5]\\\\n\\\" | ./lci\\\""
  - name: valgrind
    type: memory-check-conditional
    command: "conditional on find_program(VALGRIND); not registered on OHOS (valgrind absent)"

upstream_test_count: 4
upstream_test_execution: "3 registered / 3 passed / 1 conditional valgrind test not registered — of the 4 tests defined by the upstream CMakeLists.txt, the 3 unconditional ones (build, queens, fixed_point) are registered and executed on OHOS, all 3/3 passing; the conditional valgrind memory-check test is gated by find_program(VALGRIND valgrind) and is not registered because the OHOS target environment has no valgrind and this repo has no valgrind Conan package (neither failed, passed, nor removed)"
# Counting by independent test entries: test_package executes exactly ONE
# consumer entry (test_lci.sh) and ONE ohos-specific entry
# (ohos_specific_test.py); the scenario / assertion / checkpoint numbers
# below describe their internals. No execution is double-counted.
consumer_test_count: 1
ohos_specific_test_count: 1

test_package_tests:
  - file: test_lci.sh
    name: consumer-generic
    description: "Single consumer test entry; internally 3 scenarios / 7 assertions: (1) upstream queens expression with the exact 10-solution list (church numeral 1 prints as alias I); (2) upstream fixed_point expression asserting the Y-combinator cycle-removal message and the exact Append result [3, 4, [], 5]; (3) prelude arithmetic Mult 3 4 / Exp 2 10 / Monus 20 8 / Length [1,2,3,4,5] matching 12 / 1024 / 12 / 5."
    command: "bash test_lci.sh <package>/bin/lci <workdir>"

ohos_specific_tests:
  - file: ohos_specific_test.py
    name: ohos-specific
    description: "Single ohos-specific test entry (independent Python suite, fail closed: any check error is a failure, no silent skips); internally 6 checkpoints (detailed below). Supersedes the earlier test_lci_ohos.sh entry — one execution, one count."
    command: "python3 ohos_specific_test.py <package>/bin/lci"

ohos_specific_checkpoints:
  - file: ohos_specific_test.py
    name: ohos-elf-identity
    description: "Direct ELF header parse (no readelf dependency): EI_CLASS=ELFCLASS64, EI_DATA=ELFDATA2LSB (little-endian), e_machine=EM_AARCH64(183) on the packaged bin/lci."
    command: "python3 ohos_specific_test.py <package>/bin/lci"
  - file: ohos_specific_test.py
    name: ohos-musl-interpreter
    description: "PT_INTERP segment parsed from program headers: interpreter is exactly /lib/ld-musl-aarch64.so.1 — OHOS musl libc, not glibc."
    command: "python3 ohos_specific_test.py <package>/bin/lci"
  - file: ohos_specific_test.py
    name: ohos-codesign
    description: "Section header table parse: exactly one .codesign section present — the OHOS binary signing requirement (recipe signs via binary-sign-tool, E486/E489)."
    command: "python3 ohos_specific_test.py <package>/bin/lci"
  - file: ohos_specific_test.py
    name: ohos-no-rpath
    description: "readelf -d on the packaged bin/lci: no RPATH/RUNPATH dynamic entries at all — a statically linked terminal tool must not carry host library paths."
    command: "python3 ohos_specific_test.py <package>/bin/lci"
  - file: ohos_specific_test.py
    name: ohos-no-build-paths
    description: "Binary blob scan for build-machine absolute paths (worktree root /home/<user>/ CI homes): none may be embedded in the installed executable."
    command: "python3 ohos_specific_test.py <package>/bin/lci"
  - file: ohos_specific_test.py
    name: ohos-pty-repl
    description: "Run the packaged bin/lci under a REAL pseudo terminal (pty.fork, TERM=xterm) so the replxx/termios raw-mode init path (the exact code the musl TCGETA/TCSETA patch guards, src/run.c VMIN/VTIME) executes; evaluate the deterministic expression Head [7, 8, 9], strictly assert the printed result 7 and a clean EOT exit code 0."
    command: "python3 ohos_specific_test.py <package>/bin/lci"

test_scenario_count: 3
assertion_count: 7
assertion_count_basis:
  queens_10_solutions: 1
  fixed_point_cycles_and_result: 2
  prelude_arithmetic: 4
# The ohos-specific entry (ohos_specific_test.py) contains 6 checkpoints,
# not 6 independent tests.
ohos_checkpoint_count: 6
ohos_checkpoint_basis:
  elf_identity_class_data_machine: 3
  musl_interpreter: 1
  codesign_section: 1
  no_rpath: 1
  no_build_paths: 1
  pty_repl_result_and_exit: 2
hardware_playback_required: false
hardware_playback_note: "lci is a lambda-calculus interpreter; the generic consumer tests run over stdin pipes, and the OHOS-specific pty checkpoint runs the REPL in a real pseudo terminal on the HarmonyOS PC itself, covering the tty raw-mode paths without hardware dependencies."
