patches_applied:
  - "patches/0001-guard-termios-tcgeta-tcseta-musl.patch"

# Adaptation path per templates/积分赛事PR模板.md:
#   路径 A（基础适配） / 路径 B（贡献创新）
# This adaptation is declared as 路径 B: the musl TCGETA/TCSETA
# redefinition issue (run.c guards) is a real cross-project failure mode
# verified on OHOS armv8 (compile error -> root cause -> fix -> verified),
# is not covered by any existing knowledge entry (duplication checked
# against E103/E187/E321/E359/E423/E426/E456/E486/E489/E532/E535/E541/E542,
# DRAFT-E565 and the full knowledge/graph index; no termio/TCGETA coverage
# exists), and is captured as two knowledge drafts:
# DRAFT-E565-musl-tcgeta-tcseta-redefine-guard (the concrete macro
# redefinition compile-error mechanism) and
# DRAFT-E567-termio-ioctl-macro-capability-guard (the methodology upgrade:
# compile-time capability guards for ALL legacy System V termio ioctl
# macros — no faked macros, no hardcoded ioctl numbers, no skipping of
# terminal functionality; keep the POSIX termios path) per the repo draft
# process (drafts stay drafts; promotion to formal entries is a separate
# maintainer decision).
adaptation_path: "B"

knowledge_gained:
  - "E103: bump-cmake-minimum-version — avoided here via CMAKE_POLICY_VERSION_MINIMUM=3.5 (see E187)"
  - "E187: add-cmake-flag — CMAKE_POLICY_VERSION_MINIMUM passed as cache_variables, not tc.variables"
  - "E359: cross-build host variables — not needed: OHOS aarch64 self-hosted build, make_dparser runs natively"
  - "E426: build host tools from subdirectory (pico-sdk pioasm pattern) — same shape as make_dparser"
  - "E486/E489: OHOS ELF signing — sign build-tree and packaged lci with binary-sign-tool, verify .codesign"
  - "R26 (ARCHIVE-SPEC): terminal tool linked statically, BUILD_SHARED_LIBS=OFF"
  - "DRAFT-E565 (new, this task): musl already defines TCGETA/TCSETA in bits/ioctl.h and lacks termio.h, so glibc-oriented '#define TCGETA TIOCGETA' guards fail to compile; guard the redefinitions with #ifndef (draft in knowledge/drafts/, not promoted)"
  - "DRAFT-E567 (new, this task): compile-time capability guards for legacy System V termio ioctl macros (TCGETA/TCSETA/TCSETAW/TCSETAF) on platforms that lack them — isolate only the unavailable legacy termio branch, keep the POSIX termios path; never fake macros, hardcode ioctl numbers, or skip terminal functionality (draft in knowledge/drafts/, not promoted)"

tests:
  upstream:
    # Upstream CMakeLists.txt defines 4 add_test entries: build, queens,
    # fixed_point, valgrind. The valgrind case sits inside
    # find_program(VALGRIND valgrind) + if(VALGRIND) and is registered
    # only when valgrind is found; the OHOS target environment has no
    # valgrind, so the final CTestTestfile.cmake registers 3 tests.
    count: 4
    registered: 3
    detail: "defined: build, queens (10-solution 5-queens match), fixed_point (Y-combinator + Append), valgrind (conditional memory check); the first three are unconditional and all registered+executed on OHOS"
    executed: "ctest --output-on-failure in recipe build(): 3 of the 4 defined tests registered, 3/3 registered tests passed; the conditional valgrind test is not registered (no valgrind on the OHOS target environment, no valgrind Conan package in this repo's archives) — neither failed, passed, nor removed"
  consumer:
    # one test entry (conan test_package runs test_lci.sh once); internally
    # 3 scenarios / 7 assertions
    count: 1
    scenarios: 3
    assertions: 7
    detail: "test_lci.sh against the installed bin/lci: queens 10-solution exact match, fixed_point cycles+result exact match, prelude arithmetic (Mult 3 4 / Exp 2 10 / Monus 20 8 / Length [1,2,3,4,5] => 12/1024/12/5)"
    executed: "conan create ... --build lci, 1/1 entry passed (3 scenarios, 7 assertions)"
  ohos_specific:
    # one test entry (ohos_specific_test.py run once by test_package);
    # internally 6 checkpoints (fail closed: any check error is a failure)
    count: 1
    checkpoints: 6
    detail: "ohos_specific_test.py: ohos-elf-identity (ELF64 LE, e_machine=EM_AARCH64 via direct header parse), ohos-musl-interpreter (PT_INTERP == /lib/ld-musl-aarch64.so.1), ohos-codesign (.codesign section present), ohos-no-rpath (no RPATH/RUNPATH entries), ohos-no-build-paths (no build-machine absolute paths embedded), ohos-pty-repl (REAL pseudo terminal, TERM=xterm, replxx/termios init path guarded by the patch, Head [7,8,9] => 7, EOT exit 0)"
    executed: "conan create ... --build lci, 1/1 entry passed (6/6 checkpoints); pty checkpoint executed for real on the self-hosted OHOS armv8 machine"
