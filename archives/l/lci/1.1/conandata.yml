# lci 1.1 upstream release. The GitHub release archive does not embed the
# dparser and replxx git submodules, so the recipe fetches the exact commits
# pinned by the v1.1 tag (verified byte-identical to a recursive checkout):
#   dparser  a810bbcd0aab0825b447883bfc8294a2c94c3df6 (jplevyak/dparser)
#   replxx   d13d26504f97ed2a54bc02dd37d20ef3b0179518 (AmokHuginnsson/replxx)
#
# R39: only the official GitHub URLs are recorded here, as single-value
# entries. CI (ci/conan/build_and_test.sh, "Mirror fallback" step) rewrites
# each single-value GitHub url into a [gh-proxy.com, github.com] fallback
# list at build time, so hand-written mirror URLs are unnecessary — and a
# hand-written multi-URL list would actually disable that injection.
sources:
  url: "https://github.com/chatziko/lci/releases/download/v1.1/lci-v1.1.tar.gz"
  sha256: "51725e33a7066100757b7da84b2290a651a5f47b985eb3e3647acd871964cd58"

dparser:
  url: "https://github.com/jplevyak/dparser/archive/a810bbcd0aab0825b447883bfc8294a2c94c3df6.tar.gz"
  sha256: "429403303c17567d5db1a05466e6be2fde956f813b1e2689ee079a29b36bc8ba"

replxx:
  url: "https://github.com/AmokHuginnsson/replxx/archive/d13d26504f97ed2a54bc02dd37d20ef3b0179518.tar.gz"
  sha256: "9377dabdba4f72595c89bf37b88692c1ed27f27d06951642442d379fef30b794"

patches:
  # git-style header (diff --git a/src/run.c b/src/run.c): patch_ng parses
  # the a/ prefix itself, so strip must be 0 — strip:1 would double-strip
  # to bare "run.c" and fail to find the file under the conan src root.
  - patch_file: "patches/0001-guard-termios-tcgeta-tcseta-musl.patch"
    strip: 0
    patch_description: "Guard TCGETA/TCSETA fallback defines for musl (OHOS), where bits/ioctl.h already defines them and TIOCGETA/TIOCSETA do not exist"
    patch_type: "portability"
