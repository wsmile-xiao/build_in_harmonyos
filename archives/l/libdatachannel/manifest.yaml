software: libdatachannel
display: "libdatachannel"
description: "C/C++ WebRTC network library with Data Channels, Media Transport and WebSocket support"
category: network
homepage: "https://libdatachannel.org"
license: MPL-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS缺少BSD类型(u_int/u_long/u_char/caddr_t)，需-include ohos_compat.h注入"
    - "usrsctp子模块的user_socketvar.h原为空文件，补丁填充BSD socket定义"
    - "libsrtp必须是v2.x系列(v3.x target名不兼容)"
    - "cmake需显式指定OpenSSL路径(pkg-config指向错误版本)"
    - "CMAKE_C_FLAGS=-include ohos_compat.h是必需编译选项"
  common_dependencies:
    - openssl

versions:
  "0.24.0":
    status: published
    build_date: "2026-06-01"