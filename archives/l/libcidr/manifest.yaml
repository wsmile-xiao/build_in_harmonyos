software: libcidr
display: "libcidr"
description: "IPv4/IPv6 CIDR 地址与网段操作 C 库"
category: library
homepage: "https://www.over-yonder.net/~fullermd/projects/libcidr"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 工程，无 configure；GNU make 自动选用预生成 GNUmakefile"
    - "上游回归以 python 复刻 perl test.pl 执行 114 个 mkstr 向量，无需 perl"
    - "产物 SONAME 为 libcidr.so.0，别名 libcidr.so 以文件拷贝交付，不依赖软链接"
    - "static 变体归档 PIC 对象为 libcidr.a；cidrcalc 示例二进制随包签名交付"
  common_dependencies: []

versions:
  "1.2.3":
    status: built
    build_date: "2026-09-15"
    source_url: "https://www.over-yonder.net/~fullermd/projects/libcidr/libcidr-1.2.3.tar.xz"
