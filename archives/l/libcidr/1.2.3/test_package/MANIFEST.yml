# libcidr/1.2.3 test_package 上游测试声明
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: libcidr/1.2.3
homepage: "https://www.over-yonder.net/~fullermd/projects/libcidr"

# 上游测试审计（结论：存在 perl 回归套件，配方以 python 复刻全量执行）：
# 1) 顶层 Makefile/GNUmakefile：目标仅 all/build/clean/allclean/install，无 check/test 目标。
# 2) src/Makefile：目标仅 all/build（构建 libcidr.so.0），无测试目标。
# 3) src/test/Makefile：SUBDIRS = compare inaddr kids mkstr netbc nums parent，
#    all/clean 仅遍历构建 7 个手动验证程序（命令行演示，exit(0)，无 PASS/FAIL 断言），无 check/test 目标。
# 4) src/test/regression/test.pl（perl5）+ arr.pl（期望表）为唯一自动化套件，仅覆盖 mkstr
#   （cidr_from_str/cidr_to_str），arr.pl 含 114 个 {'args','res'} 向量，
#    经 ../run.sh ./cidr_mkstr -_ <args> <input> 执行并比对 'input' -> 'output'。
# 5) 全树无 TEST(/TEST_F（gtest）、def test_（pytest）、ctest，无独立 tests/ 目录。
# OHOS 工人未必提供 perl5，配方以 python 复刻 test.pl 全量执行 114 向量（低成本补齐），
# HMBS_UPSTREAM_TEST_RESULT 取 status=passed（test_package test() 每轮复发，
# 包缓存命中时主配方 build() 不执行，靠 test_package 保证标记必现）。
upstream_tests_exist: true
upstream_test_audit: "审计 libcidr 1.2.3 上游（over-yonder release tarball libcidr-1.2.3.tar.xz，sha256 afbe266a9839775a21091b0e44daaf890a46ea4c2d3f5126b3048d82b9bfbbc4）：1) 顶层/ src Makefile 无 check/test 目标；2) src/test 仅构建 7 个手动演示程序（compare/inaddr/kids/mkstr/netbc/nums/parent），无断言；3) 唯一自动化套件为 src/test/regression/test.pl + arr.pl（114 个 cidr_mkstr -_ 向量）；4) 无 gtest/pytest/ctest。上游确实存在可执行回归套件，以 python 复刻全量运行。"

upstream_check_command: "python3 regression harness over src/test/regression/arr.pl via src/test/mkstr/cidr_mkstr -_"
upstream_test_in_build: true
upstream_test_command: "python3 regression harness over src/test/regression/arr.pl via src/test/mkstr/cidr_mkstr -_ (114 vectors)"

upstream_tests:
  - file: src/test/regression/test.pl
    source: libcidr-1.2.3.tar.xz/src/test/regression/test.pl
    description: "上游 perl 回归驱动：遍历 arr.pl 期望表，经 run.sh 调用 cidr_mkstr -_ 并比对输出"
    command: "python3 harness run of all arr.pl vectors via cidr_mkstr -_"
  - file: src/test/regression/arr.pl
    source: libcidr-1.2.3.tar.xz/src/test/regression/arr.pl
    description: "114 个 mkstr 期望向量（v4/v6 解析、掩码/前缀、PTR 反查名、非法输入 FROMFAILED）"
    command: "parsed by conanfile.py _run_regression()"

test_package_tests:
  - file: test_libcidr.c
    description: "消费者冒烟测试：from_str/pflen/to_str 回显/contains/equals/v6 解析/network/broadcast/inaddr 往返/version，共 14 个 CHECK（R34 反空壳：全部经真实 libcidr API，失败即非零退出）"
    command: "test_libcidr"

assertion_count: 14
