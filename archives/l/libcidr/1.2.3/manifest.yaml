# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-version.yaml

version: "1.2.3"

software: "libcidr"

# 编译状态: published | built | failed | archived
# 首轮仅完成未提交工作树，真机预检尚未运行，暂标 built，待预检通过后由 HMBS 更新。
status: built

build_date: "2026-09-15"
build_system: "makefile"

source:
  url: "https://www.over-yonder.net/~fullermd/projects/libcidr/libcidr-1.2.3.tar.xz"
  sha256: "afbe266a9839775a21091b0e44daaf890a46ea4c2d3f5126b3048d82b9bfbbc4"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "无 configure；顶层 make -j1 CC=<conan clang>（GNU make 自动选用 GNUmakefile）"
    - "src/test 手动 make 构建 7 个验证程序（compare/inaddr/kids/mkstr/netbc/nums/parent）"
    - "上游回归：python 复刻 perl test.pl，对 cidr_mkstr -_ 执行 arr.pl 全部 114 向量（无需 perl）"
    - "static 变体：归档 src/*.So（PIC 可重定位对象）为 libcidr.a；shared 变体交付 libcidr.so.0 + .so 实文件拷贝"
    - "CC/AR 取自 Conan tools.build:compiler_executables，失效时回退 PATH（R33）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libcidr 为纯 Makefile 工程（BSD Makefile + 预生成 GNUmakefile），顶层 all 仅构建 src + docs/man + cidrcalc，test 需单独 make"
  - "docs/all 仅经 sed 生成 libcidr.3，无需 SGML 工具链，可随顶层安全构建"
  - "上游唯一自动化套件是 src/test/regression（perl test.pl + arr.pl，114 个 mkstr 向量），无 make check/test/ctest 目标"
  - "产物 SONAME 为 libcidr.so.0，别名 libcidr.so 以文件拷贝交付，不依赖软链接"
  - "cidrcalc 示例二进制随库安装至 bin，需随包签名并在 commands.json 登记"
