package: libschrift/0.10.2
homepage: "https://github.com/tomolt/libschrift"

upstream_check_command: "make stress && ./stress -s 1"
upstream_test_in_build: true
upstream_tests:
  - file: stress.c
    description: "Upstream stress test loads Ubuntu-Regular.ttf and exercises glyph lookup, metrics, and rendering"
    command: "./stress -s 1"

test_package_tests:
  - file: test.c
    description: "Checks the version API and rejects invalid in-memory and file font data"
    command: "./libschrift_test"

assertion_count: 3
