software: libcext
display: "ESO C Extension Library"
version: "1.3.2"
upstream_name: cext
upstream_version: "1.3.2"
status: built
build_system: autotools
compile_date: "2026-08-27"
target_platform: aarch64-unknown-linux-ohos
license: LGPL-2.1-or-later
homepage: "https://www.eso.org/sci/software/cpl/"

source:
  url: "https://ftp.eso.org/pub/dfs/pipelines/libraries/cext/cext-1.3.2.tar.gz"
  sha256: "622532430a63ad26756eb51751c1815c96bca4722ca30cb961ebb35a2072201d"
  tar_format: tar.gz
  version_mapping: "Conan libcext/1.3.2 maps to upstream cext 1.3.2."

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  command: "make check"
  test_count: 7
  notes: "tests/Makefile.am lists 7 TESTS (cxslist-test, cxlist-test, cxtree-test, cxmap-test, cxstring-test, cxdeque-test, cxtypes-test). cxmessages-test is built (check_PROGRAMS) but not registered in TESTS. The host is native aarch64 OHOS, so the built test binaries execute directly."

test_package:
  assertion_count: 5
  description: "Links libcext, creates/uses a cx_string, exercises cx_slist push/front/pop with state assertions, and reads the CX_VERSION_* compile-time symbols."

ohos_adaptation:
  key_points:
    - "Uses the upstream release Autotools files; no source patches (zero patch)"
    - "The release ships config.sub (2022-01-03) which accepts aarch64"
    - "OHOS environment fixes (umask 022, CONFIG_SHELL, CC/AR/RANLIB) are applied at configure time, not via source patches"
    - "Builds the shared libcext with the libtool -version-info (libtoolver) SONAME"
    - "make check runs the 7 upstream TESTS natively on aarch64 OHOS"
  common_dependencies: []

knowledge_gained:
  - "libcext 1.3.2 is ESO's C utility library (used by the Common Pipeline Library); upstream is ftp.eso.org, License LGPL-2.1-or-later."
  - "The release archive ships a pre-generated configure (no autoreconf needed) and admin/config.sub (2022-01-03) that accepts aarch64."
  - "configure uses umask 077 for config.status temp dirs; on setgid HMDFS this makes them unwritable. Replaced with umask 022 at configure time."
  - "configure has a #! /bin/sh shebang; on OHOS /bin/sh may be absent, so CONFIG_SHELL and the shebang are redirected to a real OHOS shell."
  - "tests/Makefile.am registers 7 TESTS; cxmessages-test is built but not in TESTS. Host is native aarch64 OHOS so the test binaries run directly."
