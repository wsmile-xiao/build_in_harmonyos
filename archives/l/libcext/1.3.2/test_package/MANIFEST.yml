package: libcext/1.3.2
homepage: "https://www.eso.org/sci/software/cpl/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: cxslist-test
    command: "tests/cxslist-test"
    expected: "pass"
  - name: cxlist-test
    command: "tests/cxlist-test"
    expected: "pass"
  - name: cxtree-test
    command: "tests/cxtree-test"
    expected: "pass"
  - name: cxmap-test
    command: "tests/cxmap-test"
    expected: "pass"
  - name: cxstring-test
    command: "tests/cxstring-test"
    expected: "pass"
  - name: cxdeque-test
    command: "tests/cxdeque-test"
    expected: "pass"
  - name: cxtypes-test
    command: "tests/cxtypes-test"
    expected: "pass"

test_package_tests:
  - file: test_cext.c
    description: "Links libcext, exercises cx_string set/append/sprintf with size state changes, and cx_slist push/pop with size and front-element assertions; reads the CX_VERSION_* compile-time symbols."
    command: "./test_cext"

assertion_count: 5
