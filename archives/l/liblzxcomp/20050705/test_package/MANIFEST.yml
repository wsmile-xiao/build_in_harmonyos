# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: liblzxcomp/20050705
homepage: "https://www.russotto.net/chm/lzx.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# liblzxcomp 的 Makefile 没有 check/install 目标；上游自测程序源码为 lzx_test.c，
# Makefile 提供 lzx_test (slide 变体) 与 lzx_test2 (nonslide 变体，即 liblzxcomp.a) 两个目标。
upstream_check_command: "make all"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（Makefile 无自测目标，程序源码随发行包提供）
# 计算方式与上游 Makefile 的 lzx_test2 目标一致：lzx_test.c 链接 liblzxcomp.a
# 2026-09-16 记录（打全 3 个补丁的原生 x86_64 运行）:
#   input=288000B, `./lzx_test 15 < in > out`, RC=0,
#   stderr: compressed: 852, uncompressed 294912, ratio 99.711100 (out=856B)
# 2026-09-17 起纳入 CI：test_package 内置该程序并在 OHOS aarch64 上真实执行
upstream_tests:
  - file: lzx_test.c
    source: lzx_compress/lzx_test.c
    description: "上游自测程序: 从 stdin 读明文，stdout 写 LZX 压缩流(前缀 4 字节未压缩长度)，stderr 打印压缩统计 (需以 window size 15..21 调用)"
    command: "./lzx_test 15 < lzx_in.bin > lzx_out.bin"
    sha256: "217d2002d7f71586ddf1d45c6fbdb1d05055fd29d7df5b4deb763c98a061dad2"
    verified: "PASS (2026-09-16 native x86_64 288000B -> 856B, ratio 99.7%; 2026-09-17 起由 test_package 在 OHOS aarch64 每次构建实跑)"

# test_package 中自带的测试 (消费者视角验证 + 上游自测程序原样执行)
test_package_tests:
  - file: test.c
    description: "消费者测试(鸿蒙特有): 内存中构造 512KB 可压缩数据，调用 lzx_init/lzx_compress_block/lzx_finish，断言输出非空且压缩率 < 100%"
    command: "./test_liblzxcomp"
  - file: lzx_test.c
    description: "上游自测程序原样执行: 字节级复制上游 lzx_test.c (sha256 217d2002…dad2)，CMake 生成确定性语料重定向为 stdin，断言退出码 0 且压缩输出小于输入"
    command: "./lzx_test2 15 < upstream_in.bin > upstream_out.bin"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
