# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "2005 年代码默认 32 位正确：sizeof(int*)==sizeof(int) 掩盖了 memset 元素大小错误，64 位静默堆溢出，交叉构建需逐一核对元素大小"
- "FreeBSD 风格源码依赖 sys/types.h 的 u_char/BYTE_ORDER，musl(OHOS)/glibc 需补 typedef 或改用编译器内建宏"
- "上游只有手工 CLI 自测程序（无 check 目标/无断言）时，按 ci/tools/extract_upstream_tests.sh 规范把测试源文件字节级复制进 test_package，用 CMake 生成确定性语料并重定向 stdin，即可把'一次性手工验证'变成随 conan create 每次回归的真实测试"

