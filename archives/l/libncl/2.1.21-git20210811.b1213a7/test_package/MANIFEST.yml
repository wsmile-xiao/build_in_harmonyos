package: libncl/2.1.21-git20210811.b1213a7
homepage: "https://github.com/mtholder/ncl"
upstream_check_command: "Read example/*/Makefile.am and test/Makefile.am at b1213a78003629483426d83258d8ab9e43ab20b1"
upstream_test_in_build: true
upstream_test_command: "python3 upstream-tests.py --source-root <source> --normalizer <build>/NEXUSnormalizer --converter <build>/NCLconverter --ncltest <build>/ncltest --translate <build>/NEXUStranslate --work-dir <build>"
upstream_tests:
  - file: test/roundTripNCLTest.py
    source: "mtholder/ncl@b1213a78003629483426d83258d8ab9e43ab20b1"
    description: "NEXUSnormalizer: 46 reference fixtures, exact normalized output or rejection"
    command: "python3 upstream-tests.py --source-root <source> --normalizer <build>/NEXUSnormalizer ..."
  - file: test/NTSInvalidIn/multitax.nex
    source: "mtholder/ncl@b1213a78003629483426d83258d8ab9e43ab20b1"
    description: "One additional invalid NEXUS fixture from the upstream test tree"
    command: "NEXUSnormalizer -s2 test/NTSInvalidIn/multitax.nex (must reject)"
  - file: example/ncltest/ncltest.cpp
    source: "mtholder/ncl@b1213a78003629483426d83258d8ab9e43ab20b1"
    description: "One OldValidIn round-trip reference"
    command: "python3 test/roundTripNCLTest.py <build>/ncltest test/OldValidIn test/OldValidOut"
  - file: example/translate/translateNuc.cpp
    source: "mtholder/ncl@b1213a78003629483426d83258d8ab9e43ab20b1"
    description: "Two TranslateIn references"
    command: "python3 test/roundTripNCLTest.py -o <build>/NEXUStranslate test/TranslateIn test/TranslateOut"
  - file: example/normalizer/converter.cpp
    source: "mtholder/ncl@b1213a78003629483426d83258d8ab9e43ab20b1"
    description: "One exact NeXML reference and one structural XML/branch-length case"
    command: "python3 upstream-tests.py --source-root <source> --converter <build>/NCLconverter ..."
test_package_tests:
  - file: test.cpp
    description: "Independent package consumer: TAXA, CHARACTERS, TREES, quoted label, missing state, tree name"
    command: "test_ncl fixtures/characters.nex fixtures/somebrlens.nex"
assertion_count: 62
