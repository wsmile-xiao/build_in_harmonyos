package: libnu/1.11.1
homepage: "https://bitbucket.org/alekseyt/nunicode"

upstream_check_command: "cmake -DNU_BUILD_TESTS=ON && cmake --build . && ./tests/units"
upstream_test_in_build: true
upstream_test_command: "build tests/units (NU_BUILD_TESTS=ON) and run it"

upstream_tests_exist: true
upstream_test_audit: "Audited nunicode 1.11.1 source https://bitbucket.org/alekseyt/nunicode/get/1.11.1.tar.gz sha256:09b4be81cb5a5086cc687a4a3a5fbed7691e4fbdedad29789aba7ee124d2d1ad. Build system is CMake; tests/CMakeLists.txt builds single 'units' assert binary when NU_BUILD_TESTS=ON. Counting unit is the units binary summary line 'OK - N tests' (assert total, single custom harness, not ctest/gtest/autotools/python). Verification: HarmonyOS preflight log shows 'OK - 103 tests' and HMBS_UPSTREAM_TEST_RESULT discovered/executed/passed=103/103/103; recipe parses that summary line as the single deterministic source with no fallback arithmetic."

upstream_test_total: 103
upstream_test_count_method: auto

upstream_tests:
  - file: units
    source: nunicode-1.11.1/tests/
    description: "Upstream assert-based unit suite (utf8/16/32, casemap, collation, validation)"
    command: "./tests/units"

test_package_tests:
  - file: test_libnu.c
    description: "Consumer link+run: utf8/utf16 round-trips, validation, version"
    command: "./test_libnu"

assertion_count: 5
