# 版本级 manifest — libxmlplusplus 3.2.5 (libxml++ 3.0 API 线)
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.2.5"

# 软件名（上游项目库名：libxml++/libxmlplusplus）
software: "libxmlplusplus"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39 官方源：GNOME download.gnome.org）
  url: "https://download.gnome.org/sources/libxml++/3.2/libxml++-3.2.5.tar.xz"

  # 源码校验和（GNOME 官方 sha256sum 文件：0c9b381b…）
  sha256: "0c9b381b5a83d6b3ab4b0b865d7256dab27d575981b63be2f859edcb94da59c7"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：Meson（MesonToolchain + PkgConfigDeps）
  system: meson

  # 配置选项（meson_options.txt 实际声明项）
  configure_options:
  - "-Dmaintainer-mode=false"
  - "-Dbuild-documentation=false"
  - "-Dbuild-examples=false"
  - "-Dbuild-tests=true"
  - "-Dvalidation=false"
  - "-Dbuild-pdf=false"
  - "-Dbuild-manual=false"

  # 编译依赖列表（格式: name/version；均为 ohpcd 制品仓已发布配方）
  dependencies:
  - glibmm/2.66.9
  - libxml2/2.15.3

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本版本无补丁）
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libxml++ 3.x 线（pc libxml++-3.0）依赖 glibmm-2.4（glibmm/2.66.9，2.4 ABI 线），不可用 glibmm 2.68+（提供 glibmm-2.68.pc 需 sigc++-3.0）"
- "libxml++ meson.build 声明 cpp_std=c++11，profile cppstd=17 会覆盖 → MesonToolchain 需显式回退 c++11"
- "meson 需 llvm-ar/llvm-ranlib 注入 native file（[binaries] ar/ranlib），否则交叉探测定裸名失败"
- "非交叉构建时 build() 内 meson test 需注入依赖 libdir（libglib 的 g_libintl_* gettext 符号）否则 exit 127"