# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libxmlplusplus/3.2.5
homepage: "https://libxmlplusplus.github.io/libxml++/"

# 上游 meson 测试套件已启用：conanfile.py 设置 build-tests=true，上游 4 个
# 独立测试（tests/istream_ioparser + tests/saxparser_* 3 项）随构建编译，
# 非交叉编译时在 build() 中执行 meson test（cross_building 守卫；meson test
# 注入依赖 libdir 解决 libglib 的 gettext 符号）。本地探索构建实测 4/4 通过
# （examples 16 项为示例程序，不计入上游用例数）。test_package 另承担消费者
# 视角验证（R34）。
upstream_check_command: "meson test --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test --print-errorlogs"

upstream_tests:
  - name: istream_ioparser
    description: "istream 输入解析器：自定义 streambuf + std::istream 交给 DomParser 解析"
    command: "tests/istream_ioparser_test"
  - name: saxparser_chunk_parsing_inconsistent_state
    description: "SAX 分块解析不一致状态回归（on_start_document 抛异常）"
    command: "tests/saxparser_chunk_parsing_inconsistent_state_test"
  - name: saxparser_parse_double_free
    description: "SAX 解析异常后 double-free 回归（on_cdata_block 抛异常）"
    command: "tests/saxparser_parse_double_free_test"
  - name: saxparser_parse_stream_inconsistent_state
    description: "SAX 流解析不一致状态回归（流中途抛异常）"
    command: "tests/saxparser_parse_stream_inconsistent_state_test"

# test_package 中自带的测试（消费者视角验证 3.0 API）。
test_package_tests:
  - file: test_libxmlplusplus.cpp
    description: "libxml++ 3.0 API 验证: DomParser::parse_file + parse_memory + get_document + get_root_node + Element::get_attribute_value + Node::get_children 子节点迭代"
    command: "./test_libxmlplusplus"

# 测试断言总数 (近似值)
assertion_count: 8