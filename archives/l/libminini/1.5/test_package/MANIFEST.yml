# libminini/1.5 上游测试及消费者测试声明
# 统计口径：上游独立程序中的 assert() 调用数；每个调用均为可独立失败的检查。

package: libminini/1.5
homepage: "https://github.com/compuphase/minIni"

upstream_tests_exist: true
upstream_check_command: "compile and run tests/test.c and tests/test2.cc"
upstream_test_in_build: true
upstream_test_command: "test_minini_c && test_minini_cpp"

upstream_tests:
  - file: tests/test.c
    source: "CompuPhase minIni 1.5 release/tests/test.c"
    description: "官方 C API 测试；29 个 assert 调用，覆盖读取、写入、覆盖、枚举、存在性、遍历和删除"
    command: "test_minini_c"
    discovered: 29
    executed: 29
    passed: 29
  - file: tests/test2.cc
    source: "CompuPhase minIni 1.5 release/tests/test2.cc"
    description: "官方 C++ 包装器测试；15 个 assert 调用，覆盖读取、默认值、写入、枚举和删除"
    command: "test_minini_cpp"
    discovered: 15
    executed: 15
    passed: 15

test_package_tests:
  - file: test_c.c
    description: "C 消费者端到端测试；真实链接包并调用读写、类型转换、枚举、遍历和删除 API"
    command: "test_c"
  - file: test_cpp.cpp
    description: "C++ 消费者端到端测试；真实链接包并调用 minIni 包装器 API"
    command: "test_cpp"
  - file: harmonyos_specific_test.c
    description: "OHOS 专属测试；验证 __OHOS__/AArch64 目标以及系统 libc 上的 UTF-8 文件名、节、键、值和 LF 行结束符"
    command: "harmonyos_specific_test"

upstream_assertion_count: 44
test_package_case_count: 3
adapted_test_case_count: 47
assertion_count: 90
