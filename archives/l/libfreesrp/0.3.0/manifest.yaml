# 版本级 manifest
# 文件位置: archives/l/libfreesrp/0.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.0"

# 软件名
software: "libfreesrp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/myriadrf/libfreesrp/archive/refs/tags/0.3.0.tar.gz"

  # 源码校验和（下载后 sha256sum 已核对）
  sha256: "e6c394e439617a6bad8188d0a82392ea474fd241e0a153644f1200771f9eaeff"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libusb/1.0.27"
    - "boost/1.91.0.1.3"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（libusb 定位与 boost 头文件注入均通过配方 generate() 的
# CMake cache 变量 / conf cxxflags 完成，无需源码补丁）
patches_applied: "patches/0001-fix-clang15-ambiguous-freeSRP-qualification.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 cmake/modules/Findlibusb-1.0.cmake 只搜系统路径，但其顶部缓存变量短路（LIBUSB_1_LIBRARIES/LIBUSB_1_INCLUDE_DIRS）可用 CMakeToolchain cache_variables 从 libusb 依赖包显式注入；CMakeLists 还使用单数 LIBUSB_1_INCLUDE_DIR 做 include_directories，三个变量都要设"
  - "示例工具 freesrp-ctl/freesrp-io 用 boost::lexical_cast/tokenizer 但 CMakeLists 从不 find_package(Boost)，上游假设系统 boost；header-only 用法下在配方 generate() 用 self.conf.append('tools.build:cxxflags', -I<boost_include>) 全局注入头文件路径"
  - "CMake 4.x: 上游 cmake_minimum_required(2.8.4) 过旧，需 CMAKE_POLICY_VERSION_MINIMUM=3.5（同 airspyhf 1.6.8 处理）"
  - "E092: CMake 不识别 HarmonyOS，设 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64 保证 install 规则生效"
  - "产物含 CLI（freesrp-ctl/freesrp-io）→ OHOS 要求 .so 与 bin/ 下可执行文件统一 binary-sign-tool 签名后才能加载/执行"
  - "libfreesrp 是 FreeSRP SDR 硬件客户端库：编译与链接验证可离线完成（list_connected() 无硬件返回空列表或抛 ConnectionError），但任何实际功能需真实 FreeSRP 硬件 + libusb 用户态 USB 访问权限（E051 类平台限制）"
