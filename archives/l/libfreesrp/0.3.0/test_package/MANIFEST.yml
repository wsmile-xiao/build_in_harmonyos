# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libfreesrp/0.3.0
homepage: "https://github.com/myriadrf/libfreesrp"

# 上游测试命令: libfreesrp 的 CMakeLists.txt 未注册任何 ctest/add_test/make
# check 测试目标（无 tests/ 目录），上游无自动化测试（N=0）。
# 上游验证依赖真实 FreeSRP 硬件（freesrp-ctl/freesrp-io 是硬件客户端工具）。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_freesrp.cpp
    description: "消费者测试：协议常量（VID/PID/帧参数/超时）、ConnectionError 异常派生关系、freesrp_version operator<< 流式输出、list_connected() 无硬件环境的 libusb 初始化+枚举安全路径（返回空列表或抛 ConnectionError）"
    command: "./test_freesrp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 7
