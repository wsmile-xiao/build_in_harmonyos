# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libhubbub/0.3.8
homepage: "https://www.netsurf-browser.org/projects/hubbub/"

# 上游测试命令: NetSurf 用 NSSHARED testrunner.pl 驱动 test/INDEX 中的测试程序
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (standalone Makefile test 目标驱动, 见 reports/test-report.md)
upstream_tests:
  - file: test/entities.c
    source: libhubbub-0.3.8/test/entities.c
    description: "Named entity dictionary"
    command: "./entities"
  - file: test/csdetect.c
    source: libhubbub-0.3.8/test/csdetect.c
    description: "Charset detection (7 data files)"
    command: "./csdetect test/data/csdetect/<file>"
  - file: test/parser.c
    source: libhubbub-0.3.8/test/parser.c
    description: "Public parser API (html data files)"
    command: "./parser test/data/html/<file>"
  - file: test/tokeniser.c
    source: libhubbub-0.3.8/test/tokeniser.c
    description: "HTML tokeniser (html data files)"
    command: "./tokeniser test/data/html/<file>"
  - file: test/tree.c
    source: libhubbub-0.3.8/test/tree.c
    description: "Treebuilding API (html data files)"
    command: "./tree test/data/html/<file>"
  - file: test/tree2.c
    source: libhubbub-0.3.8/test/tree2.c
    description: "Treebuilding API (tree-construction data)"
    command: "./tree2 test/data/tree-construction/<file>"
  - file: test/tree-buf.c
    source: libhubbub-0.3.8/test/tree-buf.c
    description: "Treebuilder specified chunks (tree-chunks data)"
    command: "./tree-buf test/data/tree-chunks/<file>"

# 跳过: tokeniser2/tokeniser3 依赖 json-c (本平台无), 见 reports/test-report.md

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 创建 parser + token 回调 + 解析 HTML"
    command: "./test_libhubbub"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1721
