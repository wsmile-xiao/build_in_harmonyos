# test_package/MANIFEST.yml
# 上游测试声明（CI 门禁 L0e 要求本文件存在且非空）

package: libnfsidmap-ldap/2.6.4
homepage: "https://linux-nfs.org/"

# 上游测试命令
upstream_check_command: "make -C support/nfsidmap check"

# conanfile.py build() 中是否已集成上游测试
# 上游 support/nfsidmap 无任何自动化测试（无 TESTS / check_PROGRAMS），
# build() 仍执行 make check 以便日志中可见“Nothing to be done for 'check'”。
upstream_test_in_build: false
upstream_test_command: "make -C support/nfsidmap check"

# 上游实际可用的测试入口（非自动化）
# support/nfsidmap/Makefile.am 只在 EXTRA_DIST 中列出 libtest.c，未注册进构建：
#   - 自动化测试套件: 无（整树仅 tests/t0001-statd-basic-mon-unmon.sh、
#     tests/nsm_client，针对 rpc.statd / nsm_client，不覆盖 libnfsidmap）
#   - 手工测试程序: libtest.c，需 /etc/idmapd.conf 与运行中的映射服务
# 因此不提供 upstream test 计数（0 个上游自动化用例）。
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: >-
      链接 libnfsidmap.so.1 调用公开 API（nfs4_init_name_mapping 按 idmapd.conf
      的 Method=umich_ldap 加载 LDAP 插件并解析 [UMICH_SCHEMA] 配置），
      再 dlopen umich_ldap.so 校验插件 ABI（libnfsidmap_plugin_init -> trans_func）
    command: "./test_libnfsidmap-ldap idmapd.conf"

# 测试断言总数（test_package/test.c 内的 check() 断言）
assertion_count: 4
