# 版本级 manifest — libnfsidmap-ldap 2.6.4
version: "2.6.4"
software: "libnfsidmap-ldap"
status: built
build_date: "2026-09-15"
build_system: autotools

source:
  url: "https://cdn.kernel.org/pub/linux/utils/nfs-utils/2.6.4/nfs-utils-2.6.4.tar.xz"
  sha256: "01b3b0fb9c7d0bbabf5114c736542030748c788ec2fd9734744201e9b0a1119d"
  tar_format: tar.xz

build:
  system: autotools
  # configure 参数由 conanfile.py 在 generate()/build() 中按依赖的实际包路径生成
  # （--with-krb5=<krb5 包路径> 只有运行时才知道），因此本列表留空；
  # 实际使用的参数见 conanfile.py 的 CONFIGURE_ARGS 与 notes.md：
  #   --enable-ldap --with-rpcgen=internal --disable-nfsv41 --disable-uuid
  #   --disable-nfsrahead --with-krb5=<krb5 package_folder>
  # 本列表留空（clean-verify 的解析器按行取字符串：写 `[]` 会被当成字面量参数，
  # 不写值会把下一行的 `dependencies:` 当参数）。
  configure_options: ""
  dependencies:
    - openldap/2.6.7
    - krb5/1.22.1
    - cyrus-sasl/2.1.28
    - libevent/2.1.13
    - uuid/2.40.1
    - libtirpc/1.3.7
    - sqlite3/3.49.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-support-nfs-conffile.c.patch"
  - "0005-support-nfsidmap-Makefile.am.patch"
  - "0006-support-nfsidmap-Makefile.in.patch"

knowledge_gained:
  - "HarmonyOS 下 dlopen 的 .so 只从自身 DT_NEEDED 闭包解析符号：主程序符号、主程序 DT_NEEDED 库、甚至 RTLD_GLOBAL 预加载库都不可见；libnfsidmap 的插件架构必须让插件自带 DT_NEEDED libnfsidmap.so.1"
  - "OHOS musl 不提供 versionsort()/strverscmp()/getrpcbynumber(_r)，且 libtirpc 也未实现；GNU 扩展缺失可用 __attribute__((weak)) 兼容定义（无需平台宏）"
  - "HMDFS 下 mktemp -d 恒 0700 且 chmod 无效，config.status 必须改用 $$ 名 + umask 000（cln/1.3.7 方案）"
  - "nfs-utils 顶层 configure 的 AC_SQLITE3_VERS 是无条件门禁（原生构建会真实运行探测程序），缺失即 AC_MSG_ERROR"
  - "aclocal/kerberos5.m4 只搜索 /usr 等固定目录中的 krb5-config，必须用 --with-krb5= 指向 conan 包"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libnfsidmap-ldap-2.6.4.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libnfsidmap-ldap-2.6.4.work
  source_orig_hash: 59571113f1f5a1bc
  source_work_hash: dcef5ac57848692b
  generated_at: '2026-09-16T07:52:26'
  patches_count: 6

patch_classification:
  # AI 回填（refresh-patch 生成时默认 type=auto / guard=pending）：
  #   type 与 conandata.yml 的 patch_type 一致（规范固定值 portability）；
  #   guard: none —— 全部补丁都是无条件的文件级修改，不使用平台宏/#ifdef 守卫
  #   （与 R8/PF5 一致：patches/ 内不出现 __OHOS__）；
  #   platform_only: 该改动是否只对 OHOS 平台成立——config.guess/sub/configure 的
  #   三元组与 HMDFS 处理为 true；conffile.c 的 weak 兼容定义与插件 DT_NEEDED 属
  #   平台无关的可移植性/架构修复（glibc 上同样成立且无害），故为 false。
  - file: 0001-config.guess.patch
    type: portability
    platform_only: true
    guard: 'none'
  - file: 0002-config.sub.patch
    type: portability
    platform_only: true
    guard: 'none'
  - file: 0003-configure.patch
    type: portability
    platform_only: true
    guard: 'none'
  - file: 0004-support-nfs-conffile.c.patch
    type: portability
    platform_only: false
    guard: 'none'
  - file: 0005-support-nfsidmap-Makefile.am.patch
    type: portability
    platform_only: false
    guard: 'none'
  - file: 0006-support-nfsidmap-Makefile.in.patch
    type: portability
    platform_only: false
    guard: 'none'
