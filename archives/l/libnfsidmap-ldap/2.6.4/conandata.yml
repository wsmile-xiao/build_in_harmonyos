# conandata.yml — libnfsidmap-ldap 2.6.4
#
# 源码 = nfs-utils 官方发布 tarball（kernel.org）。
# libnfsidmap 已并入 nfs-utils 源码树 support/nfsidmap/；"-ldap" 指其 LDAP 映射
# 插件 umich_ldap（support/nfsidmap/umich_ldap.c，构建为 umich_ldap.so）。
# 该 tarball 自带预生成的 configure / Makefile.in，构建不需要 autoconf/automake。
#
# 说明：此处只保留官方源的单一 url。CI（ci/conan/build_and_test.sh 的 mirror fallback）
# 会在构建时把该 url 临时改写为「镜像 + 官方源」的列表；那是构建期行为，不应进入提交内容。

sources:
  url: "https://cdn.kernel.org/pub/linux/utils/nfs-utils/2.6.4/nfs-utils-2.6.4.tar.xz"
  sha256: "01b3b0fb9c7d0bbabf5114c736542030748c788ec2fd9734744201e9b0a1119d"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "Add the HarmonyOS case branch so config.guess reports aarch64-unknown-linux-ohos instead of failing with 'unable to guess system type' (E007); avoids --build/--host, which would make configure treat the native build as a cross build"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "Accept the aarch64-unknown-linux-ohos triplet in config.sub: ohos-linux basic-machine branch, ohos* in the OS list and linux-ohos* in the kernel/OS validation list (E122)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: (1) downgrade the tree-wide getrpcbynumber(_r) hard gate to a warning -- OHOS musl and libtirpc provide neither and its only user (support/nfs/svc_socket.c, libnfs.la) is outside this package's scope; (2) create the config.status temp directory with a $$-based name under umask 000, because HMDFS makes a mktemp-created 0700 directory unwritable (E110/E112/E118)"
    patch_type: "portability"
  - patch_file: "patches/0004-support-nfs-conffile.c.patch"
    patch_description: "Provide weak versionsort()/strverscmp() definitions (GNU algorithm) because musl-based libcs lack both; conf_init_dir() calls versionsort() unconditionally so the file cannot compile without them (E534 technique, no platform conditionals)"
    patch_type: "portability"
  - patch_file: "patches/0005-support-nfsidmap-Makefile.am.patch"
    patch_description: "Link every mapping plugin against libnfsidmap.la so it records a DT_NEEDED on libnfsidmap.so.1 and can resolve the symbols it uses from the library (nfsidmap_conf_path etc.); without it no plugin can be dlopen()ed on HarmonyOS, where a dlopen()ed object resolves symbols only from its own DT_NEEDED closure"
    patch_type: "portability"
  - patch_file: "patches/0006-support-nfsidmap-Makefile.in.patch"
    patch_description: "Same plugin/libnfsidmap dependency as 0005 in the shipped (pre-generated) Makefile.in, which is the file actually used by the build"
    patch_type: "portability"
