software: libnfsidmap-ldap
display: "libnfsidmap-ldap"
description: "NFSv4 ID-mapping library (libnfsidmap) with the LDAP mapping plugin umich_ldap, built from the nfs-utils source tree"
category: network
homepage: "https://linux-nfs.org/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 增加 aarch64-unknown-linux-ohos 三元组（不用 --build/--host）"
    - "configure：getrpcbynumber 树级门禁降级为警告；config.status 临时目录改 $$+umask 000（HMDFS）"
    - "support/nfs/conffile.c：weak versionsort()/strverscmp()（musl 缺失）"
    - "插件记录 DT_NEEDED libnfsidmap.so.1（HarmonyOS dlopen 符号解析局限）"
    - "in-tree 构建（上游 support/* Makefile 不支持 VPATH）"
  common_dependencies:
    - openldap/2.6.7
    - krb5/1.22.1
    - cyrus-sasl/2.1.28
    - libevent/2.1.13
    - uuid/2.40.1
    - libtirpc/1.3.7
    - sqlite3/3.49.1

versions:
  "2.6.4":
    status: built
    build_date: "2026-09-15"
