# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libwapcaplet/0.4.3.1
homepage: "https://www.netsurf-browser.org/projects/libwapcaplet/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 `make check` 依赖 libcheck（test/testmain.c 直接 #include <check.h>），
# 本平台无 libcheck 包，改用自定义 standalone 测试 test_lwc.c 覆盖核心 API
# （24/24 PASS，见 notes.md）。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试在探索阶段以自定义 test_lwc.c 运行（24/24 PASS）；
# conan create 不重复运行（test_package 以消费者视角验证 API）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游 tarball 自带，依赖 libcheck 本平台不可用，
# 故实际以自定义 test_lwc.c 覆盖同一组核心 lwc_string_* API）
upstream_tests:
  - file: basictests.c
    source: libwapcaplet-0.4.3/test/basictests.c
    description: "lwc_string_* 核心 API 测试（intern/isequal/hash/substring/tolower）"
    command: "./test_testrunner"
  - file: test_lwc.c
    source: "自定义 standalone 测试（探索阶段写入源码工作目录）"
    description: "lwc_string_* 核心 API 全覆盖（intern/isequal/caseless/hash/substring/tolower/refcnt）"
    command: "./test_lwc"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 intern_string/intern_substring/isequal/caseless_isequal/hash/tolower/ref 等真实 API"
    command: "./test_libwapcaplet"

# 测试断言总数 (近似值, 用于质量评估)
# 探索阶段 test_lwc.c 24 个 PASS + test_package test.c 16 个断言
assertion_count: 40
