# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libwapcaplet/0.4.3
homepage: "https://www.netsurf-browser.org/projects/libwapcaplet/"

# 上游存在官方测试（test/ 目录，libcheck 框架），故此处为 true。
# libcheck 本平台缺失的完整审计见下方 upstream_test_audit。
upstream_tests_exist: true
upstream_test_audit:
  - source: "libwapcaplet-0.4.3/test/testmain.c"
    reason: "上游测试入口直接 #include <check.h>（libcheck 单元测试框架）。"
  - source: "libwapcaplet-0.4.3/test/basictests.c"
    reason: "上游用例使用 START_TEST/END_TEST/ck_assert 宏，覆盖 lwc_string_* 核心 API（intern/isequal/hash/substring/tolower）。"
  - source: "上游顶层 Makefile（WANT_TEST 分支）"
    reason: "测试链接 flag 取自 `pkg-config --cflags/--libs check`，回退 -lcheck；本平台制品仓与系统均无 libcheck 包，无法低成本补齐（check 需自行移植整套 runner，与被测库体量相当）。"
  - conclusion: "上游测试存在但本平台不可直接运行；改由 conanfile.py build() 运行等价检查（同一组 API，12 项 CHECK_PASS 计数），test_package 以消费者视角复验（16 个断言）。详见 conanfile.py _run_upstream_equiv_check 与 HMBS_UPSTREAM_TEST_RESULT 证据。"

# 上游测试命令（原始形式；实际执行见 build() 等价检查）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 是：build() 编译运行上游等价检查（12/12 CHECK_PASS 才判 passed，
# 失败即抛异常中断构建），并输出 HMBS_UPSTREAM_TEST_RESULT 机器证据。
upstream_test_in_build: true
upstream_test_command: "./upstream_check（conanfile.py 内嵌等价检查，覆盖与 test/basictests.c 同一组 lwc_string_* API）"

# 上游实际运行的测试程序
upstream_tests:
  - file: basictests.c
    source: libwapcaplet-0.4.3/test/basictests.c
    description: "lwc_string_* 核心 API 测试（intern/isequal/hash/substring/tolower，libcheck 框架）"
    command: "./upstream_check（等价实现，libcheck 缺失）"
  - file: testmain.c
    source: libwapcaplet-0.4.3/test/testmain.c
    description: "libcheck 测试主入口（srunner，本平台不可用，等价检查内聚同一覆盖）"
    command: "./upstream_check（等价实现，libcheck 缺失）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 intern_string/intern_substring/isequal/caseless_isequal/hash/tolower/ref 等真实 API（16 个断言）"
    command: "./test_libwapcaplet"

# 测试断言总数：build() 等价检查 12 项 + test_package test.c 16 个断言
assertion_count: 28
