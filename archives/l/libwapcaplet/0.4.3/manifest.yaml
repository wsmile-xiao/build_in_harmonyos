software: libwapcaplet
# 版本级 manifest
# 文件位置: archives/l/libwapcaplet/0.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（本文件为人读交叉校验，CI 唯一输入为 conanfile.py）

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游原生版本，首次适配无后缀，R37）
version: "0.4.3"

# 编译状态
# published | built | failed | archived
# 首轮工作树：待 HMBS 真机预检，证据轮按实测校准
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-14"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# 源码信息（与 conandata.yml 一致，冲突时以 conandata.yml 为准）
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://download.netsurf-browser.org/libs/releases/libwapcaplet-0.4.3-src.tar.gz"

  # 源码校验和（沿用 0.4.3.1 实测值，同名官方 tarball）
  sha256: "9b2aa1dd6d6645f8e992b3697fdbd87f0c0e1da5721fa54ed29b484d13160c5c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（沿用 0.4.3.1/0.4.3.2 已验证结论）
knowledge_gained:
  - ref: E096
    description: "NetSurf组件库使用自有构建系统（NSSHARED），需替换为standalone Makefile"
  - description: "静态库(.a)无需ELF签名和RPATH处理"
  - ref: E120
    description: "lld链接器缺libxml2.so.16，通过注入SDK llvm lib目录到LD_LIBRARY_PATH解决"
  - description: "tools.build:compiler_executables是dict conf，读取编译器必须整体取值再取c键（R33）"
  - description: "上游make check依赖libcheck（本平台无），build()运行等价检查并输出HMBS_UPSTREAM_TEST_RESULT"
