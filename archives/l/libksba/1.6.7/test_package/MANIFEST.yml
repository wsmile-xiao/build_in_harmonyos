package: libksba/1.6.7
homepage: "https://gnupg.org/software/libksba/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - file: tests/cert-basic.c
    source: libksba-1.6.7/tests/cert-basic.c
    description: "X.509 certificate parsing"
    command: "tests/cert-basic"
  - file: tests/t-crl-parser.c
    source: libksba-1.6.7/tests/t-crl-parser.c
    description: "CRL parser"
    command: "tests/t-crl-parser"
  - file: tests/t-dnparser.c
    source: libksba-1.6.7/tests/t-dnparser.c
    description: "Distinguished name parser"
    command: "tests/t-dnparser"
  - file: tests/t-oid.c
    source: libksba-1.6.7/tests/t-oid.c
    description: "Object identifier handling"
    command: "tests/t-oid"
  - file: tests/t-reader.c
    source: libksba-1.6.7/tests/t-reader.c
    description: "Reader abstraction"
    command: "tests/t-reader"
  - file: tests/t-cms-parser.c
    source: libksba-1.6.7/tests/t-cms-parser.c
    description: "CMS parser"
    command: "tests/t-cms-parser"
  - file: tests/t-der-builder.c
    source: libksba-1.6.7/tests/t-der-builder.c
    description: "DER builder"
    command: "tests/t-der-builder"

test_package_tests:
  - file: test.c
    description: "Consumer verifies version API and certificate object lifecycle"
    command: "./test_libksba"

assertion_count: 3
