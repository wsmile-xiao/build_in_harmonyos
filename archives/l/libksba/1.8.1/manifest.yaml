software: libksba
version: "1.8.1"
upstream_name: libksba
upstream_version: "1.8.1"
display: "libksba"
build_system: autotools
status: built
build_date: "2026-09-12"
target_platform: aarch64-unknown-linux-ohos

source:
  # 官方 URL（R39：单一官方 URL，无手写镜像前缀）
  url: "https://gnupg.org/ftp/gcrypt/libksba/libksba-1.8.1.tar.bz2"
  # 官方 722040 字节（与 gnupg.org 的 Content-Length 逐字节一致）
  sha256: "c2f84393011827219ae117131dba8e7684c2bed0961eed11b0642c2acba440b5"
  tar_format: tar.bz2
  version_mapping: "1.8.1 为上游 gnupg.org 的真实发行版（与 1.6.7.1 不同：后者是版本映射，实际打的是 1.6.7 tarball）。"

build:
  system: autotools
  configure_options: "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-musl --disable-doc --disable-static --with-libgpg-error-prefix=<libgpg-error>"
  dependencies:
    - "libgpg-error/1.55"
  cc: clang
  cxx: clang++

patches_applied: []

test_status: passed

test_note: "上游测试：make check **实跑通过**——7 个测试二进制（cert-basic / t-crl-parser / t-dnparser / t-oid / t-reader / t-cms-parser / t-der-builder）在 build() 中执行，sample 数据随源码包分发。test_package：dlopen 加载 libksba.so 并 dlsym 解析真实导出符号 ksba_cert_new / ksba_cert_release（R34 反空壳）。"

knowledge_gained:
  - "libksba 1.8.1 只要求 NEED_GPG_ERROR_VERSION=1.28（实测 configure.ac:61）——**低于** ohpcd 现存的 1.55，故不依赖 libgpg-error/1.61；gpg-error 系各库的最低版本要求需逐库从 configure.ac 读取，不可按「同族统一抬升」推断"
  - "libksba 1.8.1 的 config.sub **仍不识别 `linux-ohos`**（实测 `Invalid configuration ... OS 'ohos' not recognized`），但**自带 linux-musl 分支**（实测 `config.sub aarch64-unknown-linux-musl` 通过）→ 显式传 musl triplet 即可，无需 patch config.sub（对比 gnupg 2.5.22 必须补 config.sub 的白名单）"
  - "libgpg-error 1.56+ 已移除 gpg-error-config，只剩 gpgrt-config：gpg-error.m4 用 AC_PATH_PROG 在 PATH 上找，故须把 libgpg-error 的 bin 加入 PATH；--with-libgpg-error-prefix 按约定拼出的 $prefix/bin/gpg-error-config 并不存在"
  - "gpgrt-config --cflags 输出为空（includedir 按烤死的 / 算成标准路径）→ 编译找不到 gpg-error.h；须经 CPPFLAGS/LDFLAGS 直接补 libgpg-error 的 include/lib"
  - "configure 内 umask 077 在 HMDFS 上会产生 0600 成员的归档目录，install 阶段可读性不稳 → 放宽为 022"
