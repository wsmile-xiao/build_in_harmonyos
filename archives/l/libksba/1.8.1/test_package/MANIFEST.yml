package: libksba/1.8.1
homepage: "https://gnupg.org/software/libksba/"

upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: cert-basic
    command: "tests/cert-basic"
    expected: "pass"
  - name: t-crl-parser
    command: "tests/t-crl-parser"
    expected: "pass"
  - name: t-dnparser
    command: "tests/t-dnparser"
    expected: "pass"
  - name: t-oid
    command: "tests/t-oid"
    expected: "pass"
  - name: t-reader
    command: "tests/t-reader"
    expected: "pass"
  - name: t-cms-parser
    command: "tests/t-cms-parser"
    expected: "pass"
  - name: t-der-builder
    command: "tests/t-der-builder"
    expected: "pass"

test_package_tests:
  - file: test.c
    description: "dlopen libksba.so + resolve ksba_cert_new/ksba_cert_release exports"
    command: "./test_probe"

assertion_count: 2
