# test_package/MANIFEST.yml
# libmseed 2.19.8 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 审计方法: 下载官方源码包
# https://github.com/EarthScope/libmseed/archive/refs/tags/v2.19.8.tar.gz
# (sha256 10ac972cb4e76c8d6aa27bf9f56fc59d1922991477d9ddefd375b89dba9e93f6),
# 顶层 Makefile 定义 `test check: static` -> `make -C test test`;
# test/ 目录含 2 个 C 程序 (lmtestpack.c, lmtestparse.c, 编译成功即通过)
# 与 31 个 *.test 脚本 (7 pack-* + 24 read-*), 每个输出 diff 对照 *.test.ref。

package: libmseed/2.19.8
homepage: "https://github.com/EarthScope/libmseed"

# 上游测试命令 (顶层 Makefile 的 check 目标, 匹配 CI L1c 的 make.*check 模式)
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序 (31 个 .test 代表全部, 此处列出骨干用例)
upstream_tests:
  - file: lmtestpack.c
    source: libmseed-2.19.8/test/lmtestpack.c
    description: "上游打包测试程序, 编译成功即通过, 被 7 个 pack-*.test 调用"
    command: "make -C test test (build lmtestpack)"
  - file: lmtestparse.c
    source: libmseed-2.19.8/test/lmtestparse.c
    description: "上游解析测试程序, 编译成功即通过, 被 24 个 read-*.test 调用"
    command: "make -C test test (build lmtestparse)"
  - file: pack-Int32-encoded.test
    source: libmseed-2.19.8/test/pack-Int32-encoded.test
    description: "STEIM/整数编码打包测试代表, 输出 diff 对照 pack-Int32-encoded.test.ref"
    command: "./pack-Int32-encoded.test"
  - file: read-Steim2-littleendian.test
    source: libmseed-2.19.8/test/read-Steim2-littleendian.test
    description: "小端 STEIM2 读取测试代表, 输出 diff 对照 read-Steim2-littleendian.test.ref"
    command: "./read-Steim2-littleendian.test"
  - file: read-text-encoded.test
    source: libmseed-2.19.8/test/read-text-encoded.test
    description: "文本编码读取测试代表, 输出 diff 对照 read-text-encoded.test.ref"
    command: "./read-text-encoded.test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libmseed.c
    description: "消费者 API 测试: 版本/MSRecord 与 trace-group 生命周期/时间往返/采样查找/编码与采样率 (6 项检查)"
    command: "./test_libmseed"

# 测试断言总数 (test_libmseed.c 的 6 个真实检查, 与 HMBS_TEST_PACKAGE_RESULT discovered=6 一致)
assertion_count: 6
