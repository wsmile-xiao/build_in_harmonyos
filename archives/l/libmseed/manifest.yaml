software: libmseed
display: "libmseed"
description: "C library for manipulation of miniSEED seismological time series data"
category: data
homepage: "https://github.com/EarthScope/libmseed"
license: Apache-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目, 无 configure, CC/AR/RANLIB/SHELL 经 make 命令行覆盖, 零补丁"
    - "make -j1 (R9: HMDFS jobserver 限制), 编译器路径从 Conan conf 获取 (R33)"
    - "上游 `make check` 完整运行 test/ 套件 (2 构建 + 31 diff 用例), 结果解析自真实输出"
    - "pkgconfig(mseed.pc) 由 mseed.pc.in 生成, prefix 重定位为 ${pcfiledir}/../.."
  common_dependencies: []

versions:
  "2.19.8":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libmseed/2.19.8"
    note: "首个 OHOS PC 适配版本, 待真机预检复核后发布"
