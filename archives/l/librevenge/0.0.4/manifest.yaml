# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.0.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://sourceforge.net/projects/libwpd/files/librevenge/librevenge-0.0.4/librevenge-0.0.4.tar.gz/download"

  # 源码校验和
  sha256: "a2718efd86000fe769cb6178478af0fd424a9128807361241facd2491bcb772f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "boost (system, header-only)"
    - "zlib (system)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0009-configure.ac.patch"
  - "0031-src-test-RVNGStringIterTest.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: GNU config.guess/config.sub 不识别 OHOS 平台，需用 automake-1.17 版本替换"
  - "HarmonyOS umask 077 导致目录权限 drwx--S---，需改为 022"
  - "boost spirit headers 与 -Werror 冲突，需 -Wno-error=shadow"
  - "Conan 2.x CMakeDeps 不支持 lib 前缀，cpp_info.libs 需去除前缀"
  - "Conan 2.x conandata.yml 不支持 verify_ssl 字段"
  - "功能测试通过(55/55): RVNGString/RVNGStringVector/RVNGPropertyList/RVNGBinaryData/RVNGStringStream/RVNGFileStream/RVNGSVGDrawingGenerator 全部正常"
  - "drawEllipse API 需要 svg:cx/cy/rx/ry 属性(非 svg:x/y/width/height)，下游软件需注意"
  - "鸿蒙文件系统 I/O 完全兼容，RVNGFileStream 读写/seek/EOF 均正常"

