software: librevenge
display: "librevenge"
description: "A base library for document import/export filters (Document Liberation Project)"
category: doc
homepage: "https://sourceforge.net/projects/libwpd/files/librevenge/"
license: MPL-2.0
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "E007: config.guess/config.sub 不识别 OHOS 平台，需用 automake-1.17 版本替换"
    - "HarmonyOS umask 077 导致目录权限 drwx--S---，configure 中需改为 022"
    - "boost spirit headers 与 -Werror 冲突，需 -Wno-error=shadow"
    - "drawEllipse API 需要 svg:cx/cy/rx/ry 属性（非 svg:x/y/width/height）"
    - "功能测试全部通过(55/55)，鸿蒙文件系统I/O、UTF-8处理、SVG生成均正常"
  common_dependencies:
    - boost (header-only, spirit classic)
    - zlib

# 版本索引（所有已归档版本，含状态）
versions:
  "0.0.4":
    status: published
    build_date: "2026-06-29"
    conan_ref: "librevenge/0.0.4@ohpcd/stable"