# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lcmaps-plugins-voms/1.7.1
homepage: "https://software.nikhef.nl/security/lcmaps-plugins-voms/"

# 上游测试命令: 无（见下方 discovery 结论）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试 discovery（discovery.status = EVIDENCE_COMPLETE，结论 NO_UPSTREAM_TESTS）:
#   已检查入口:
#     - 顶层 Makefile.am: SUBDIRS = src doc，无 check 目标、无 TESTS/check_PROGRAMS 定义
#     - src/Makefile.am: 仅 plugin_LTLIBRARIES（6 个插件）+ EXTRA_DIST 文档，无测试驱动
#     - doc/Makefile.am: 仅 man 页与 LaTeX 文档（.man.in → man8），非测试
#     - tarball 无 tests/ 或 test/ 目录（tar tzf 实证）
#     - configure.ac: AC_LCMAPS_INTERFACE([basic]) 只声明插件接口面，无测试接入
#   证据路径（lcmaps-plugins-voms-1.7.1.tar.gz 内）:
#     - Makefile.am / src/Makefile.am / doc/Makefile.am
#     - configure.ac
#   结论: 上游零自动化测试（无 check 目标/测试程序接入构建系统）；
#         产物验证以 test_package OHOS 冒烟用例真实执行代替。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - name: ohos-consumer-smoke
    description: >
      dlopen/dlsym 全部 6 个插件对象（lib/lcmaps/liblcmaps_*.so，LCMAPS 框架
      消费模式），断言 plugin_initialize/plugin_run/plugin_terminate 入口符号，
      并断言 lib/lcmaps/lcmaps_*.mod 软链接别名与安装清单。E046（HMDFS 拒载
      未签名 ELF）时整体按 SKIP 申报。
    command: "./test_lcmaps_plugins_voms <package_root>"
  - name: ohos-e2e-policy-evaluation
    description: >
      鸿蒙特有端到端消费者用例：完整 LCMAPS 引擎评估往返（无需 VOMS 证书）。
      运行时生成 lcmaps.db（LCMAPS 1.6.x PDL 策略语言）与 grid-mapfile/
      ban-mapfile，经 lcmaps_init → 策略 acquisition_policy（ban_fqan ->
      voms_localaccount 两个真实插件链式评估）→
      lcmaps_run_with_fqans_and_return_account()（no-GSI 标准消费接口直接
      注入 FQAN 列表）→ 断言 FQAN "/vo/harmony/test/group" 被映射到
      root(uid 0) 与主 gid → lcmaps_term。覆盖策略解析、插件管理器 dlopen、
      FQAN 凭据注入、grid-mapfile 映射与账号提取全链路。
    command: "./test_lcmaps_plugins_voms_e2e <package_root>"
