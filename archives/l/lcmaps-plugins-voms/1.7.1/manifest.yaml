# ============================================================
# 必须字段
# ============================================================

version: "1.7.1"

software: "lcmaps-plugins-voms"

status: built

build_date: "2026-10-02"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方发布源（NIKHEF 软件分发站）
  url: "https://software.nikhef.nl/security/lcmaps-plugins-voms/lcmaps-plugins-voms-1.7.1.tar.gz"

  sha256: "fe2fd0d2abaed91f078b51933668b418f394bbbcba102276944261f1340f0ee9"

  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 无额外 configure 选项（插件默认 shared，-avoid-version）；
  # 依赖解析通过 PKG_CONFIG_PATH 指向 generate() 生成的修正版 lcmaps .pc
  configure_options: []

  # lcmaps 框架库（basic interface 头 + pkg-config 元数据）
  dependencies:
    - lcmaps/1.6.7

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config-guess-harmonyos.patch"
  - "0002-config-sub-ohos.patch"
  - "0003-config-status-mktemp-hmdfs.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 陷阱（新）: autoconf config.status 的 (umask 077 && mktemp -d ./confXXXXXX) 产出 drwx--S--- 目录，内部写文件 Permission denied，且 chmod 事后补救无效（E046）。修复：patch configure 使 mktemp 调用失败，走 autoconf 自带 ./conf$$-$RANDOM + mkdir fallback（HMDFS 归一化为 drwxrws--x 可写）"
  - "lcmaps/1.6.7 包内 .pc 的 prefix 写死为 /（首个 pkg-config 下游消费者暴露）；下游配方 generate() 重写 prefix 到依赖包 package_folder 注入私有 PKG_CONFIG_PATH（R49 模式先例）"
  - "lcmaps-plugins-voms 1.7.1 编译期不依赖 voms 库（configure.ac 无 voms 检查、Makefile.am 无 voms LIBADD、源码只 include lcmaps/*.h）——包名误导，FQAN 凭证由 LCMAPS 委托链运行期供给"
  - "LCMAPS 插件入口符号面: plugin_initialize/plugin_introspect/plugin_run/plugin_verify/plugin_terminate（llvm-nm 实测），dlopen+dlsym 即可冒烟"
