# conandata.yml — lcmaps-plugins-voms 1.7.1
# 官方源（R39/PF7）：NIKHEF 软件分发站
sources:
  url: "https://software.nikhef.nl/security/lcmaps-plugins-voms/lcmaps-plugins-voms-1.7.1.tar.gz"
  sha256: "fe2fd0d2abaed91f078b51933668b418f394bbbcba102276944261f1340f0ee9"

patches:
  "1.7.1":
    - patch_file: "patches/0001-config-guess-harmonyos.patch"
      patch_type: "portability"
      patch_description: "config.guess (2014): recognize HarmonyOS, return aarch64-unknown-linux-ohos (same root cause as lcmaps/1.6.7 0001, hunk adapted to the 2014 file)"
    - patch_file: "patches/0002-config-sub-ohos.patch"
      patch_type: "portability"
      patch_description: "config.sub (2014): accept linux-ohos* OS and aarch64-unknown-linux-ohos triplet"
    - patch_file: "patches/0003-config-status-mktemp-hmdfs.patch"
      patch_type: "platform_compatibility"
      patch_description: "configure: HMDFS cannot write mktemp -d directories (0700 turns into drwx--S---, chmod is a no-op per E046); make the autoconf mktemp call fail so config.status falls back to its mkdir-based tmp dir (proven writable)"
