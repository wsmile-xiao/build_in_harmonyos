# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libe57format/3.3.0
homepage: https://github.com/asmaloney/libE57Format

# 上游测试命令 (conanfile.py::build 直接编译 test/src/*.cpp 为 testE57
# 二进制并运行, 与 ctest 驱动的是同一套上游用例; 因真机 CMake 无法完成
# project() 编译器识别, 本配方不执行任何 CMake project(), 见 notes.md #11)
# 上游 test/ 由 GoogleTest 驱动: 43 个 TEST 用例 / 8 个测试套件
# (test/src/*.cpp), 在 build() 中编译运行 testE57 二进制。
# 为跑通上游测试, 配方从 Conan 取 GTest (test_requires, 链接 gtest;
# 上游自带 main() 故不链接 gtest_main) 并随源码取
# 官方测试数据仓 (~1 MB), 无数据时上游 main() 会自动过滤 *Data 用例。
upstream_check_command: "./testE57"
upstream_test_in_build: true
upstream_test_command: "./testE57 (--gtest_list_tests 先计数, 再实跑)"

upstream_tests:
  - file: test/src/test_SimpleData.cpp
    source: libE57Format-3.3.0/test/src/test_SimpleData.cpp
    description: "Simple API 数据头用例 (6 个 TEST, 无需外部数据)"
    command: "./testE57"
  - file: test/src/test_SimpleReader.cpp
    source: libE57Format-3.3.0/test/src/test_SimpleReader.cpp
    description: "Simple API 读取用例 (14 个 TEST, 13 个需测试数据)"
    command: "./testE57"
  - file: test/src/test_SimpleWriter.cpp
    source: libE57Format-3.3.0/test/src/test_SimpleWriter.cpp
    description: "Simple API 写入用例 (16 个 TEST, 1 个需测试数据)"
    command: "./testE57"
  - file: test/src/test_StringFunctions.cpp
    source: libE57Format-3.3.0/test/src/test_StringFunctions.cpp
    description: "内部字符串函数用例 (6 个 TEST, 仅静态库构建)"
    command: "./testE57"
  - file: test/src/TestData.cpp
    source: libE57Format-3.3.0/test/src/TestData.cpp
    description: "测试数据仓存在性断言 (1 个 TEST)"
    command: "./testE57"

# test_package 中自带的测试 (消费者视角验证, 链接已安装的库)
test_package_tests:
  - file: test_version.cpp
    description: "版本 API 契约 (ASTM 1.0/库标识 3.3.0, 7 个检查)"
    command: "./test_version"
  - file: test_roundtrip.cpp
    description: "写入 8 点扫描并读回校验坐标 (13 个检查, 含非空证据)"
    command: "./test_roundtrip"

# 测试断言总数 (test_version 7 + test_roundtrip 13)
assertion_count: 20
