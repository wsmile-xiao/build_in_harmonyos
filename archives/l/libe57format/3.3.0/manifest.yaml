# 版本级 manifest (交叉校验元数据, CI 不直接读取)
# 真实构建输入以 conanfile.py / conandata.yml 为准

version: "3.3.0"
software: "libe57format"
conan_ref: "libe57format/3.3.0"
status: built
build_date: "2026-09-14"
build_system: "cmake"
target_platform: aarch64-unknown-linux-ohos

source:
  url: "https://github.com/asmaloney/libE57Format/archive/refs/tags/v3.3.0.tar.gz"
  sha256: "0ba6de5c2ff6122c847867e81bf3f987b43ce4116b4949550c9cda277099e796"
  tar_format: tar.gz

build:
  system: direct-compile (no CMake project(); ddate/clamav-libunrar/critnib precedent)
  configure_options:
    - "-std=c++14 -stdlib=libc++ -fPIC -O2 (lib, 42 TU from src/CMakeLists.txt)"
    - "-DREVISION_ID/-DE57_VALIDATION_LEVEL=1/-DE57_ENABLE_DIAGNOSTIC_OUTPUT/-DCRCPP_USE_CPP11/-DCRCPP_BRANCHLESS"
    - "-DTEST_DATA_PATH=<source>/libE57Format-test-data (tests, C++17 for GTest 1.17)"
  dependencies:
    - xerces-c/3.2.5#9086fe3ffea711440f8f71d66d6ca6d0
  test_dependencies:
    - gtest/1.17.0.1#9ffddd9d9fcc4049457a71bc4b81d2ee
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-test-StringFunctions-locale-fallback.patch"

validation:
  local:
    - "conanfile.py / test_package 语法与字段已按仓库模板自查"
  remote:
    - "待 HarmonyOS aarch64 真机预检 (conan create 全量: 直编 + 上游 gtest 实跑 + test_package)"
  pending:
    - "真机预检通过后由 HMBS 统一提交推送"

knowledge_gained:
  - "上游 test/ 以 git submodule 拉 googletest, release tarball 中为空目录, 用 test_requires + find_package(GTest) 替代"  - "上游测试默认对 testE57 加 ASan/UBSan, OHOS NDK 无对应运行时, 需在配方中关闭"
  - "上游测试不注册 add_test, 配方补加 add_test(NAME testE57) 后才能用 ctest 驱动"
  - "本仓 xerces-c 包导出小写目标 xerces-c::xerces-c, 上游大写 XercesC::XercesC 需替换"
  - "上游测试数据在独立仓库 (~1 MB), 随源码拉取后 *Data 套件才真实运行"
  - "ConanCenter 版 xerces-c/3.2.5 在 OHOS 下因 network_accessor=socket 系统白名单判 Invalid, 消费者配方需按需关闭 network 选项 (E57 仅本地 XML 解析); 本仓 xerces-c 无此选项, 用 try/except 兼容两种来源, 目标名大小写替换同样按解析来源条件执行"
  - "预检 remote 顺序 conancenter 在前时 xerces-c 命中 CCI 修订版并从源码构建 (conan 按顺序取首个命中, 二进制与修订版绑定不可混用); 其构建失败点行号 156 经逐行核对即 CCI 配方的 cmake.configure, 位于依赖自身构建内, 消费者配方无法从外部影响。CI 因 setup.sh 禁用 conancenter 而走 ohpcd 本仓修订版, 两条路径不一致"
  - "裸版本引用在双 remote 下有歧义: requirements()/test_requires() 必须用 ohpcd revisions API 实测 RREV 显式 pin (xerces-c/3.2.5#9086fe3f, gtest/1.17.0.1#9ffddd9d, 2026-09-14 查询), 强制解析到本仓适配配方+已发布二进制, 跳过 CCI 修订版源码构建; RREV 禁止本地复算 (atracdenc 教训: 复算值在远端不存在会导致解析直接失败)。同 atracdenc/libsndfile+gtest 先例"
  - "E092真因在平台层而非依赖选择: CCI-xerces构建失败与本包构建失败是同一project()编译器检测签名, RREV只决定谁先撞墙。generate()须设CMAKE_SYSTEM_NAME=Linux+CMAKE_SYSTEM_PROCESSOR=aarch64 (zxc/ableton-link/function2已合入先例); 已审计上游顶层CMakeLists无任何平台门控分支, 覆盖零行为影响。test_package改显式generate()加同样两行"
  - "Linux覆盖仍红后转向直编: 真机compiler identification unknown连平台模块都绕不过 (ddate三轮含Linux映射仍红, critnib证实Linux-override+可写TMPDIR仍同一ID失败; 本包161→172行号证实覆盖生效但无效)。09-10/09-11合入的clamav-libunrar/critnib直编路线是唯一在同worker验证过的解法: 不执行任何CMake project(), 用conf编译器直编上游精确源集, E57Export.h现场生成, 上游gtest先计数后实跑并解析输出, 构建前导出可写TMPDIR+先跑编译链接smoke"
