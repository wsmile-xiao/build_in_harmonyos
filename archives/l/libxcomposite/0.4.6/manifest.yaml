software: libxcomposite
display: "libXcomposite"
version: "0.4.6"
upstream_name: libXcomposite
upstream_version: "0.4.6"
status: built
build_system: autotools
build_date: 2026-08-26
compile_date: 2026-08-26
target_platform: aarch64-unknown-linux-ohos
issue: TBD

source:
  url: "https://xorg.freedesktop.org/archive/individual/lib/libXcomposite-0.4.6.tar.xz"
  sha256: "fe40bcf0ae1a09070eba24088a5eb9810efe57453779ec1e20a55080c6dc2c87"
  tar_format: tar.xz
  version_mapping: "Conan libxcomposite/0.4.6 maps to upstream libXcomposite 0.4.6 and libXcomposite.so.1."

build:
  system: autotools
  configure_options:
    - "--disable-docs"
    - "--disable-specs"
    - "--without-xmlto"
    - "--without-fop"
    - "--without-xsltproc"
  dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0"
    - "xorgproto/2025.1"
    - "libxfixes/6.1.0"
  cc: clang
  cxx: clang++

patches_applied: []

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml, and test_package/MANIFEST.yml"
    - "L0 static gate checks passed"
    - "official source sha256 verified locally"
    - "test_package exercises libXcomposite ABI surface (10 exported functions) and COMPOSITE protocol version constants, display-independent"
  remote:
    - "pending GitCode CI build_and_test.sh run on PR"
  pending:
    - "PR validation / GitCode CI / REL upload"

knowledge_gained:
  - "libXcomposite configure hard-requires compositeproto >= 0.4 (xorgproto) + x11 pkg-config module, and runs PKG_CHECK_MODULES(XFIXES, xfixes) purely for the Xfixes.h header that Xcomposite.h includes."
  - "libXcomposite never links libXfixes: libXcomposite_la_LIBADD = $(XCOMPOSITE_LIBS) = -lX11 only."
  - "libxfixes/6.1.0 is on the cmd-pkgs track (libx11/6.4.0 + libxext/6.4.0 + xorgproto/2025.1) and exports pkg_config_name=xfixes, so no pkg-config stub or vendored header is needed — unlike libxi 1.8.3 which had to vendor Xfixes.h against the legacy libxfixes/6.0.2."
  - "Version -version-number 1:0:0 -> libXcomposite.so.1 / libXcomposite.so.1.0.0."
  - "COMPOSITE protocol version: COMPOSITE_MAJOR 0 / COMPOSITE_MINOR 4 (XCOMPOSITE_MAJOR/MINOR macros)."
