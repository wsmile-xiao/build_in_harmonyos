name: libsigrok
version: 0.5.2
description: libsigrok is a library providing hardware drivers for logic analyzers and other supported devices
website: https://sigrok.org/
license: GPL-3.0-or-later
category: library

build_info:
  system: OpenHarmony
  arch: aarch64
  compiler: clang-15
  build_type: autotools

dependencies:
  - glib-2.0
  - libserialport
  - libzip >= 1.10
  - zlib

package:
  filename: libsigrok-0.5.2-ohos-aarch64.tar.gz
  size: 12MB
  sha256: TBD

install_files:
  - lib/libsigrok.so.4.1.1
  - lib/libsigrok.a
  - lib/pkgconfig/libsigrok.pc
  - include/libsigrok/libsigrok.h
  - include/libsigrok/proto.h
  - include/libsigrok/version.h

drivers_enabled:
  - demo
  - fx2lafw
  - saleae-logic16
  - saleae-logic-pro
  - rigol-ds
  - siglent-sds
  - agilent-dmm
  - fluke-dmm
  - uni-t-dmm
  # ... (see configure.log for complete list)

quality_checks:
  G1_binary_integrity: PASS (3 checks)
  G2_functionality: WARN (pkg-config works, but runtime tests limited)
  G3_portability: PASS
  G4_archive_integrity: FAIL (needs manual verification)

notes:
  build_date: 2026-06-08
  build_duration: ~20 minutes
  issues_resolved:
    - Missing pkg.m4 macro file (manually created)
    - HMDFS hard link limitation (modified libtool to use cp)
    - Missing libzip library (created symlink)
    - Missing libffi.so symlink
  source: libsigrok-libsigrok-0.5.2 (GitHub release)