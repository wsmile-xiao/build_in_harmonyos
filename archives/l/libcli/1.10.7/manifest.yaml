# 版本级 manifest — libcli 1.10.7
# 文件位置: archives/l/libcli/1.10.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-version.yaml

version: "1.10.7"

software: "libcli"

# 编译状态: published | built | failed | archived
# 首轮仅完成未提交工作树，真机预检尚未运行，暂标 built，待预检通过后由 HMBS 更新。
status: built

build_date: "2026-09-14"
build_system: "makefile"

source:
  url: "https://github.com/dparrish/libcli/archive/refs/tags/V1.10.7.tar.gz"
  sha256: "179f78592f73492c22cc1b544b6f8cb0f6630a2f670430c118b8e084e6562e74"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "TESTS=0（跳过 clitest 交互式 telnet 演示服务，与 OpenWrt 打包一致）"
    - "LIBS 为空（musl libc 自带 crypt()，设备上无独立 libcrypt）"
    - "DYNAMIC_LIB/STATIC_LIB 跟随 shared 选项切换"
    - "CC/AR 取自 Conan tools.build:compiler_executables（R33）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []
# NOTE: cli_init() -> cli_init(void) strict-prototypes fix lives in-recipe
# (conanfile build() replace_in_file); unified-diff patch removed after
# hunk mismatch against the V1.10.7 tarball.

knowledge_gained:
  - "libcli 上游无测试套件：Makefile 无 check/test 目标，上游 CI 仅执行 make 编译"
  - "Makefile 在非 Darwin 平台硬编码 LIBS=-lcrypt；OHOS musl 自带 crypt()，需以 LIBS= 清空"
  - "产物 libcli.so 通过 -lcli 链接（cpp_info.libs=[cli]），头文件为 libcli.h"
  - "版本别名 libcli.so.1.10 / libcli.so 以文件拷贝而非软链接交付（ worker 文件系统软链接能力不确定）"
