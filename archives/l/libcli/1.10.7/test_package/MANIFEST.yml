# libcli/1.10.7 test_package 上游测试声明
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: libcli/1.10.7
homepage: "https://github.com/dparrish/libcli"

# 上游测试审计（结论：上游无测试套件，按 no_tests 处理）：
# 1) Makefile（V1.10.7）：目标仅 all/clean/install/rpmprep/rpm/lint，无 check/test
#    目标；TESTS 变量仅控制是否编译 clitest 演示程序，不是测试开关。
# 2) .github/workflows/c.yml：唯一 CI 步骤为 `make`（编译验证），无测试执行。
# 3) clitest.c：交互式 telnet 演示服务器（监听 8000 端口、fork() 多进程），
#    非自动化测试；clitest.txt 仅是一行示例输入 "show counters"，无断言。
# 4) 源码树无 tests/、test/ 目录，无 gtest/gtest TEST_F、ctest、pytest 痕迹。
# 因此 HMBS_UPSTREAM_TEST_RESULT 取 status=no_tests（test_package test() 每轮复发，
# 包缓存命中时主配方 build() 不执行，靠 test_package 保证标记必现）。
upstream_tests_exist: false
upstream_test_audit: "审计 libcli 1.10.7 上游（dparrish/libcli tag V1.10.7）：1) Makefile 目标仅 all/clean/install/rpmprep/rpm/lint，无 check/test 目标，TESTS 仅控制 clitest 演示编译；2) .github/workflows/c.yml 唯一 CI 步骤为 make 编译，无测试；3) clitest.c 为交互式 telnet 演示（监听 8000 + fork），clitest.txt 仅一行示例输入 show counters，无断言；4) 源码树无 tests/ 或 test/ 目录。上游确实无测试套件。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_libcli.c
    description: "消费者冒烟测试：cli_init/命令树注册/cli_run_command 无 socket 实跑/回调计数与参数校验/cli_print 回调捕获/注销顶层 show 后子树不可达（cli_unregister_command 仅匹配顶层名）/cli_done，共 10 个 CHECK（R34 反空壳：全部经真实 libcli API，失败即非零退出）"
    command: "test_libcli"

assertion_count: 10
