software: libcli
display: "libcli"
description: "Cisco 风格命令行交互（telnet CLI）C 库"
category: library
homepage: "https://github.com/dparrish/libcli"
license: LGPL-2.1-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "原生 Makefile 工程，无 configure；TESTS=0 跳过 clitest 交互式演示（与 OpenWrt 打包一致）"
    - "Makefile 非 Darwin 平台硬编码 LIBS=-lcrypt；OHOS musl 自带 crypt()，以 LIBS= 空值覆盖"
    - "产物经 -lcli 链接（cpp_info.libs=[cli]），头文件为 libcli.h"
    - "版本别名 .so 以文件拷贝交付，不依赖软链接"
  common_dependencies: []

versions:
  "1.10.7":
    status: built
    build_date: "2026-09-14"
    source_url: "https://github.com/dparrish/libcli/archive/refs/tags/V1.10.7.tar.gz"
