knowledge_gained:
  - "libxkbfile's configure runs PKG_CHECK_MODULES(XKBFILE, x11 kbproto); kbproto is headers-only from xorgproto/2025.1, and libxkbfile_la_LIBADD = -lX11 only, so the only hard library requirement is libx11/6.4.0."
  - "The xkbfile.pc.in declares 'Requires: kbproto' (public) and 'Requires.private: x11', with Libs: -lxkbfile; the Conan pkg_config_name is 'xkbfile'."
  - "-version-number 1:0:2 -> libxkbfile.so.1 / libxkbfile.so.1.0.2 (meson agrees: version 1.0.2)."
  - "libxkbfile.so.1 exports 54 non-macro Xkb*/Xkm* functions from XKBfile.h; XkbMapDefined/XkbStateDefined are #defines and XkbKSIsLower/XkbKSIsUpper/XkbKSIsDeadKey/XkbKSIsKeypad are macros, so they are not linkable symbols."
  - "XkbDescPtr comes from xorgproto XKBstr.h (xproto-transitive), and XKBfile.h includes no headers itself — consumers must pull <X11/Xlib.h> and <X11/extensions/XKBstr.h> explicitly."
  - "OHOS autoconf works-check trap: native configure (--build == --host) makes the works-check RUN the conftest binary, which the OHOS sandbox cannot execute ('C compiler cannot create executables', worker-dependent). Force --build=aarch64-unknown-linux-ohos --host=aarch64-linux-ohos so configure enters cross mode (link-only works-check passes)."
  - "config.guess/config.sub patches (from libxrender/0.9.12 port): libxkbfile ships config.guess 2023-01-01 / config.sub 2023-01-21 — identical to libxpm 3.5.17, so the SAME two conandata patches apply unchanged (ohos* in valid-OS list + linux-ohos* in kernel-os check; HarmonyOS branch before NetBSD in config.guess)."
