software: luv
display: "luv"
description: "Bare libuv bindings for Lua"
category: library
homepage: "https://github.com/luvit/luv"
license: Apache-2.0
build_system: cmake

# HarmonyOS 适配要点
ohos_adaptation:
  key_points:
    - "使用 PUC Lua 而非 LuaJIT（LuaJIT 有架构识别问题）"
    - "内嵌 libuv 需要平台适配补丁"
    - "禁用 CPU affinity、recvmmsg/sendmmsg、线程命名功能"
  common_dependencies:
    - lua/5.4

# 版本索引
versions:
  "1.51.0-1":
    status: published
    build_date: "2026-06-05"
    test_date: "2026-06-05"
    test_result: PASS