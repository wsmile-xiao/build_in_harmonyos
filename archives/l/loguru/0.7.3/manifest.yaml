# 版本级 manifest — loguru 0.7.3
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "0.7.3"

# 软件名
software: loguru

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-31"
build_system: python

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（PyPI sdist）
  url: "https://files.pythonhosted.org/packages/source/l/loguru/loguru-0.7.3.tar.gz"

  # 源码校验和（sha256，实测）
  sha256: "19480589e77d47b8d85b2c827ad95d49bf31b0dcde16593892eb51dd18706eb6"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "loguru-0.7.3"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  notes: "上游依赖均条件性（colorama/win32-setctime 仅 win32、aiocontextvars 仅 py<3.7）——OHOS(Python 3.12/Linux) 下零运行时依赖"

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "package_type=application（python-require 型 conan create 静默跳过构建——dataproperty/pytablewriter 先例）；package() 拷 loguru/ 到 site-packages"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "纯 Python 库，无 C 扩展；OHOS 下零运行时依赖"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 1554
  failed: 10
  note: |
    上游测试：tests/ 目录 pytest 套件（sdist 不含 tests/，测试取自
    GitHub v0.7.3 tag），本地实测 **1554 passed / 10 failed / 28 skipped**
    （99.36%，28 skipped 不计分母）。
    两轮修复：①mypy 1.13.0（上游固定版本）清零 44 个 typesafety 失败；
    ②剩余 10 个 test_filesink_permissions 失败为沙箱文件系统不保留精确
    权限位（os.open 指定 0o777 实际 0o770）——环境阻塞，非库缺陷
    （rule 5.2 如实记录）。
    适配后：test_package R34 真实 logger 记录验证（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "loguru 是纯 Python 日志库（OHOS 下零依赖——win32/旧 python 条件依赖不适用）——application 型配方 + commands.json（R38），test_package R34 真实 logger 记录验证"

references:
  - https://github.com/Delgan/loguru
