# test_package/MANIFEST.yml — loguru 0.7.3
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: loguru/0.7.3
homepage: "https://github.com/Delgan/loguru"

# 上游测试套件：tests/ 目录 pytest 套件（loguru OHOS 下零依赖，可本地运行）
upstream_check_command: "pytest tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: tests/
    source: loguru-0.7.3/tests/*.py
    description: "pytest 套件：本地实测 1554 passed / 10 failed / 28 skipped（99.36%；10 失败为沙箱文件系统权限位不保留，环境阻塞）"
    command: "pytest tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 loguru + logger 记录）
test_package_tests:
  - file: test_loguru.py
    description: "Imports packaged loguru and records a log message via a list sink, asserting the captured output"
    command: "python3 test_loguru.py"

# 断言总数：1（日志记录校验）
assertion_count: 1
