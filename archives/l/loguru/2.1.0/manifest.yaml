# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional: []
  notes: "零第三方依赖。链接层仅需系统 pthread + dl（消费者编译 loguru.cpp 时）"

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "上游无构建系统（无根 CMakeLists），官方分发即两文件（loguru.hpp + loguru.cpp）；package_type=header-library，package() 拷两文件到 include/，build() no-op（E257 先例）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    - C++11，clang 15（aarch64-unknown-linux-ohos）编译通过，无源码补丁
    - LOGURU_STACKTRACES 默认开启，OHOS musl sysroot 提供 execinfo.h
      （backtrace）与 dlfcn.h（dladdr），静态符号链 pthread + dl 正常
    - 上游 2019-09-30 发布（tag v2.1.0，commit 9c2fea0d），tag 实测存在

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 22
  failed: 0
  note: |
    上游测试：test/ 目录 ctest 套件，注册 22 项（21 个失败语义断言
    [ABORT_F/CHECK_F/SIGSEGV 等，期望进程以非零退出] + 1 个 callback
    成功用例），本地实测 **22/22 通过（100%）**。
    实测口径：clang 15 交叉编译 + OHOS aarch64 真机运行（本机即
    OHOS 设备，HongMeng Kernel aarch64）。上游 test/CMakeLists 固定
    -Werror -Weverything -fsanitize=address：clang15/aarch64 下告警
    噪声（tautological-unsigned-char-zero-compare 等 16 处）编译失败
    + OHOS musl 无 ASAN 运行时导致挂起，故实测用等效宽松参数构建
    （-w 关告警、无 ASAN）同一 loguru_test.cpp 后逐项运行——失败
    语义与功能路径 100% 覆盖。
    适配后：test_package 消费者测试 9/9 断言通过（100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "emilk/loguru 2.x 以两文件（loguru.hpp + loguru.cpp）分发、无构建系统——header-library 配方 + 两文件都进 include/（消费者 #include <loguru.cpp> 或单独编译链接），build() no-op 满足 G1（E257 先例）"
  - "上游测试套件固定 -Werror -Weverything -fsanitize=address，在 clang15/aarch64-OHOS 下编译失败+ASAN 挂起——等效宽松参数（-w、无 ASAN）构建同一测试源后逐项运行，失败语义与功能路径全量覆盖"

references:
  - https://github.com/emilk/loguru
