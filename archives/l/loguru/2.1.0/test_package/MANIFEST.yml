# test_package/MANIFEST.yml — loguru 2.1.0 (emilk)
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: loguru/2.1.0
homepage: "https://github.com/emilk/loguru"

# 上游测试套件：test/ 目录（loguru_test.cpp，ctest 注册 22 项）
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: test/loguru_test.cpp
    source: loguru-2.1.0/test/loguru_test.cpp
    description: "上游 ctest 套件 22 项（21 失败语义断言 + 1 callback 成功用例）：本地实测 22/22 通过（100%）。实测口径：clang 15 交叉编译 + OHOS aarch64 真机运行；因上游 test/CMakeLists 固定 -Werror -Weverything -fsanitize=address（clang15/aarch64 告警噪声编译失败 + OHOS musl 无 ASAN 运行时挂起），实测用等效宽松参数（-w 关告警、无 ASAN）构建同一 loguru_test.cpp 后逐项运行"
    command: "ctest --output-on-failure"

# test_package 消费者测试（#include <loguru.cpp> 单 TU + init/add_file/
# add_callback/LOG_F/remove_callback/版本宏）
test_package_tests:
  - file: test_loguru.cpp
    description: "消费者测试: 单 TU #include <loguru.cpp>（README 官方推荐用法），loguru::init + add_file 文件 sink + add_callback 回调捕获 LOG_F 输出 + remove_callback + shutdown 后文件落盘回读 + 版本宏校验"
    command: "./test_loguru"

# 断言总数：9（版本宏 3 + add_file 1 + 回调捕获 2 + remove_callback 1 + 文件回读 2）
assertion_count: 9
