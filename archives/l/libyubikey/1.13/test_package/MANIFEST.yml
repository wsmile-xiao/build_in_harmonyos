package: libyubikey/1.13
homepage: "https://developers.yubico.com/yubico-c/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: selftest
    command: "tests/selftest"
    expected: "pass — single test binary covering modhex-1.1/1.2/2/3, hex-1/2/3/4/5, aes-1.1/1.2, otp-1, crc-1/2/3/4"

test_package_tests:
  - file: test.c
    description: "Links libyubikey and verifies public constants, modhex/hex codec roundtrips, modhex_p/hex_p validation, CRC16 known-answer vectors, AES-128 block decrypt/encrypt, and OTP generate/parse roundtrip"
    command: "./libyubikey_test"
  - file: test_package/conanfile.py
    description: "Installed CLI smoke: 'modhex test' emits the known modhex encoding ifhgieif"
    command: "modhex test | grep -q ifhgieif"

assertion_count: 22
