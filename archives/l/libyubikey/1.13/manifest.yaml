software: libyubikey
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.13"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-06"

# 构建系统类型 (顶层字段，兼容 verify-build)
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://developers.yubico.com/yubico-c/Releases/libyubikey-1.13.tar.gz"

  # 源码校验和（真实计算值）
  sha256: "04edd0eb09cb665a05d808c58e1985f25bb7c5254d2849f36a0658ffc51c3401"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（实际使用的完整参数）
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "LDFLAGS=-L/storage/Users/currentUser/usr/local/lib -fuse-ld=/data/service/hnp/bin/ld"
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 编译器版本
  cc_version: "clang version 15.0.4"

  # 编译产出
  output_type:
    - static_library   # libyubikey.a
    - executable        # modhex, ykparse, ykgenerate

  # 是否仅静态库（无共享库）
  static_only: true

  # 共享库不支持的原因
  shared_unavailable_reason: "configure 判定 linker (ld.lld) 不支持 shared libraries on this platform"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需替换为 automake-1.17 版本以识别 aarch64-unknown-linux-ohos"
  - "OpenHarmony SDK lld 链接器依赖 libxml2.so.16 (musl 动态链接器找不到)，需使用 GNU ld 替代"
  - "未签名 ELF 二进制无法执行 (Permission denied)，需 LD wrapper 自动签名"
  - "HMDFS 下 mktemp -d (umask 077) 创建目录的组权限不足，需 mktemp wrapper (umask 002)"
  - "仅编译静态库 (libyubikey.a)，linker 不支持 shared libraries on this platform"

# ============================================================
# 补丁生成元数据
# ============================================================

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libyubikey-1.13.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libyubikey-1.13.work
  source_orig_hash: 1e21898aee5b7646
  source_work_hash: 0e35412aa0309989
  generated_at: '2026-06-06T10:05:44'
  patches_count: 2

patch_classification:
  - file: 0001-build-aux-config.guess.patch
    type: platform_detection
    platform_only: true
    guard: '#ifdef __OHOS__ 不适用（config.guess 是脚本，非 C 代码）'
    description: "替换 2013 版 config.guess 为 automake-1.17 版本，识别 aarch64-unknown-linux-ohos"
    affected_scope: "所有使用 autotools 且 config.guess 版本 < 2023 的三方库"
  - file: 0002-build-aux-config.sub.patch
    type: platform_detection
    platform_only: true
    guard: '#ifdef __OHOS__ 不适用（config.sub 是脚本，非 C 代码）'
    description: "替换 2013 版 config.sub 为 automake-1.17 版本，识别 aarch64-unknown-linux-ohos"
    affected_scope: "所有使用 autotools 且 config.sub 版本 < 2023 的三方库"

