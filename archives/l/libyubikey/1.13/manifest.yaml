software: libyubikey
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.13"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型 (顶层字段，兼容 verify-build)
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://developers.yubico.com/yubico-c/Releases/libyubikey-1.13.tar.gz"
  sha256: "04edd0eb09cb665a05d808c58e1985f25bb7c5254d2849f36a0658ffc51c3401"
  tar_format: tar.gz

# ============================================================
# 构建配置（Conan 配方：conanfile.py + conandata.yml）
# ============================================================

build:
  system: autotools

  configure_options:
    - "A2X=true"

  dependencies: []

  cc: clang
  cxx: clang++

  output_type:
    - static_library    # libyubikey.a (default_options shared=False)
    - executable        # modhex, ykparse, ykgenerate

  static_only: true

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E007: config.guess/config.sub 需替换为 automake-1.17 版本以识别 aarch64-unknown-linux-ohos"
  - "2026-06 ohc-run 真机构建：OpenHarmony SDK lld 链接器依赖 libxml2.so.16，需 GNU ld 或 LD wrapper 替代；未签名 ELF 无法执行需 sign-elf；HMDFS mktemp umask 077 权限问题需 umask 002 wrapper"
  - "a2x (asciidoc) 仅 maintainer 模式重新生成 man 页需要；tarball 自带预生成 man 页，A2X=true 即可"

# ============================================================
# 测试
# ============================================================

upstream_tests:
  command: "make check"
  test_count: 1
  notes: "tests/selftest 单一测试二进制，含 modhex/hex/aes/otp/crc 共 17 个 assert（2026-06 ohc-run 真机 TOTAL=1 PASS=1；2026-09-27 Conan shadow CI r4 复测 TOTAL=1 PASS=1）"

test_package:
  assertion_count: 22
  description: "21 个 C 断言（公共常量、modhex/hex 编解码、CRC16 已知向量、AES-128 块加解密、OTP generate/parse 往返）+ 1 个已安装 modhex CLI 冒烟"
