package: libnxt/0.5.2
homepage: "https://github.com/schodet/libnxt"

# 上游测试套件存在性（经审计上游源码包确认）
upstream_tests_exist: false

# 上游测试审计（源码：schodet/libnxt tag 0.5.2，sha256 ad8e6e2b32c841518f2ab36ed1eddba9eb74e42db1037711177c8776eea4f94e）
# 实拉 codeload/tag 归档逐文件验证：共 37 条目，无 tests/test/t/spec 目录，
# 无 *test*/*check* 文件；顶层 meson.build 无 test() 注册，仅 static_library(nxt)
# + executable(fwflash/fwexec) + custom_target(flash_routine.h 生成)；
# meson_options.txt 仅 build_doc 选项；flash_write 仅 ARM 固件构建（arm-none-eabi-gcc/as/ld/objcopy），
# doc 仅 scdoc 手册页。真实烧录需 NXT USB 真机硬件。
upstream_test_audit:
  source_tarball: "libnxt-0.5.2.tar.gz (schodet/libnxt tag 0.5.2)"
  source_sha256: "ad8e6e2b32c841518f2ab36ed1eddba9eb74e42db1037711177c8776eea4f94e"
  source_origin: "https://github.com/schodet/libnxt/archive/refs/tags/0.5.2.tar.gz"
  top_level_files:
    - file: "meson.build"
      role: "meson 入口，仅 static_library(nxt) + executable(fwflash/fwexec) + flash_routine.h 生成"
      test_targets: "none（无 test() 注册）"
      is_test: false
    - file: "meson_options.txt"
      role: "仅 build_doc 选项"
      test_targets: "none"
      is_test: false
    - file: "flash_write/meson.build"
      role: "ARM7 固件构建（arm-none-eabi 工具链），非宿主测试"
      test_targets: "none"
      is_test: false
    - file: "doc/meson.build"
      role: "scdoc 手册页构建"
      test_targets: "none"
      is_test: false
    - file: "*.c/*.h（cmd/error/firmware/flash/lowlevel/samba/common + main_fwflash/main_fwexec）"
      role: "库实现 + 双工具入口"
      test_targets: "none（无 TEST()/TEST_F()/def test_ 包裹，无独立测试入口）"
      is_test: false
  scanned_for:
    - "meson test() 注册"
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "tests/ / test/ / t/ / spec/ 目录"
    - "*_test.c / test_*.py / *check*.c 测试源"
    - "ctest / meson test / pytest 入口"
  scan_result: "0 matches — tag 0.5.2 归档 37 条目逐项核对：无 tests/test 目录，无 *test* 文件，meson.build 无 test() 注册"
  reason: "libnxt 0.5.2 上游为 NXT USB 烧录库 + 双工具，发布包不含任何测试套件；真实 flashing 需 NXT 真机硬件"

# 上游测试命令（上游无测试套件，故为空；清单器凭此判无上游测试命令）
upstream_check_command: ""

# conanfile.py build() 是否集成上游测试（上游无测试，不集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游分母（审方口径一致）：无测试套件，总数为 0
upstream_test_total: 0
upstream_test_count_method: auto

# 上游实际运行的测试程序（upstream_tests_exist: false）
upstream_tests: []

# test_package 自带消费者测试（消费者视角验证；同一 conan create 内执行）
test_package_tests:
  - file: test_nxt.c
    description: "无硬件 API 全覆盖：nxt_str_error 全枚举映射 + NXT_ERROR_USB/CMD 宏阈值 + nxt_firmware_validate 缺失/小文件双路径 + nxt_init/nxt_exit 配对"
    command: "ctest --test-dir . --output-on-failure"

# 测试断言总数（test_nxt.c 内显式失败分支计数：str_error 7 + firmware 4 + init 1）
assertion_count: 12
