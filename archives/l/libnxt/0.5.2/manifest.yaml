# 版本级 manifest — libnxt 0.5.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.5.2"
software: "libnxt"

status: built

build_date: "2026-09-20"
build_system: "meson"

source:
  url: "https://github.com/schodet/libnxt/archive/refs/tags/0.5.2.tar.gz"
  sha256: "ad8e6e2b32c841518f2ab36ed1eddba9eb74e42db1037711177c8776eea4f94e"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dbuild_doc=disabled"
  dependencies:
    - libusb/1.0.27
  build_requirements:
    - meson/1.11.0
    - pkgconf/3.0.6
    # NXT 端 ARM7 固件 blob 改用上游自带预编译驱动（rvs/libnxt flash_write/flash.bin，
    # 136 字节，与 0.5.2 同源；仍经上游 make_flash_header.py 生成 flash_routine.h）；
    # 不再构建期下载 ~152MB 官方 Arm GNU Toolchain（连续八轮真机预检均断连失败）
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-use-prebuilt-flash-driver.patch"
    description: "OHOS port: skip flash_write ARM rebuild; use upstream prebuilt flash driver via files('flash_write/flash.bin'), header still generated by upstream make_flash_header.py; mark static_library('nxt') install:true for a full (non-thin) archive"

upstream_tests_exist: false
upstream_test_audit: "libnxt 0.5.2 上游 (schodet/libnxt tag 0.5.2) 无测试套件：meson.build 仅定义 static_library(nxt) + executable(fwflash/fwexec)，无 test() 注册；源码包 37 条目无 tests/test 目录、无 *test* 源文件、无 ctest/pytest/gtest 注册；flash_write 子目录仅为 ARM 固件构建，doc 仅为 scdoc 手册页。需 NXT 真机硬件才能验证 flashing，CI/真机仅做消费者测试。"
upstream_test_total: 0
upstream_test_count_method: auto
upstream_check_command: ""
upstream_test_in_build: false

test_results:
  type: none
  total: 0
  passed: 0
  failed: 0

knowledge_gained:
  - "libnxt 上游 meson 仅构建静态库 + 双工具，无测试套件；flash_write 需 arm-none-eabi 交叉工具链构建 NXT 端 ARM7 固件 blob，真机预检验证其可用性"
  - "Meson + PkgConfigDeps 消费 libusb-1.0，-Dbuild_doc=disabled 跳过 scdoc 手册页依赖"
  - "conancenter/ohpcd 均无 arm-gnu-toolchain（CCI 提案未合入且其 validate 拒绝非 Linux-x86_64 宿主），tool_requires 此包在 OHOS 真机与 CI 上永远不可解析；改为配方构建期从 developer.arm.com 直取官方 14.2.rel1（x86_64/aarch64 双宿主 + sha256 校验，哈希与 STMicro/NXP Yocto 层交叉一致），仍从上游源码真实编译 blob"
  - "官方工具链包约 152MB单链路下载中途断连（SSH closed）时逐地址容错：同一文件的三个官方托管（GitLab 通用包仓库、Azure blob 直链、developer.arm.com 兜底，内容长度一致）按序尝试 + sha256 不变；持久缓存（~/.cache）中探针通过的已解压工具链跨轮复用，下载前先用可执行探针排序候选目录"
  - "第二策略周期：连续八轮同一根因（构建期下载约152MB官方工具链）未通过后彻底换路线——不再下载工具链；改用上游自带预编译flash驱动（rvs/libnxt flash_write/flash.bin，136字节，与0.5.2同源），meson补丁跳过flash_write子目录、经files()直供上游make_flash_header.py生成flash_routine.h；配方内嵌base64写出并校验尺寸/复位字/1024上限"
  - "meson thin 静态库（!<thin>，成员为 libnxt.a.p/*.o 相对引用）不可单文件拷贝打包，否则消费者 ld.lld 报 could not get the buffer for a child of the archive；补丁给 static_library('nxt') 加 install:true 使 meson>=0.60 直接产出完整归档（meson 无 b_thin_archives 内建选项，不可经 project_options 传 -Db_thin_archives），并在 package() 以魔数判定 + 同级 .p 对象目录 ar rcs 重打兜底"
