# version: 4.3.0
version: "4.3.0"
software: "libtsm"
status: built
build_date: "2026-09-11"
conan_ref: "libtsm/4.3.0"
build_system: meson

source:
  url: "https://github.com/kmscon/libtsm/archive/refs/tags/v4.3.0.tar.gz"
  sha256: "7e858bece0df5b0cc61fbcc99275f6828bf54007a88fa8459a8447a7ee7e67ad"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "meson setup --native-file conan_meson_native.ini --prefix=/（MesonToolchain + Meson 构建助手）"
    - "-Dtests=false（上游默认 true；check 是测试框架 不进包依赖链）"
    - "-Dgtktsm=false（上游默认 false 此处显式钉住 防止上游默认值漂移）"
    - "-Dextra_debug=false（上游默认 false 显式钉住）"
    - "tc.binaries[\"ar\"] 钉为 llvm-ar 绝对路径（防 CI worker PATH 短导致 Unknown linker(s)）"
    - "上游工程默认 werror=true / warning_level=1 保持不动（clang 15 零告警通过）"
  dependencies: []
  optional_dependencies:
    - "xkbcommon>=0.5.0（上游 dependency(required:false)；ohpcd 未发布 走上游自带 external/xkbcommon/xkbcommon-keysyms.h 回退 无需补丁）"
  cc: clang
  cxx: "不适用（project('libtsm' 'c') 纯 C 工程 c_std=gnu99）"
  parallelism: "conan 默认（设备实测 meson compile -j20）"

patches_applied: []

knowledge_gained:
  - "libcheck 在 /tmp 只读的 OHOS 上无需私有自建：open_tmp_file 探测顺序 TEMP→P_tmpdir→TMPDIR→\".\" 中 TEMP 已是最高优先 故运行测试前 export TEMP=<可写目录> 即可让 ohpcd 发行包 check/0.15.2 跑通全部用例 单独设 TMPDIR 无效（设备 A/B 实测）  # knowledge_ref: E571"
  - "上游 meson 测试二进制经 declare_dependency(sources:) 直接编译库源码 不链接交付的 libtsm.so 因此上游测试不覆盖交付物 交付物需由 test_package 消费者 + dlopen/sha256 补测覆盖  # reference: archives/l/libtsm/4.3.0/notes.md"
  - "meson install 在该库无 rpath 需求时不重链共享库 打包副本与 build-tree 的 libtsm.so.4.3.0 sha256 逐字节一致 hnp clang 的 .codesign 段因此完好 dlopen 正常（与 meson install 改写 .dynstr 破坏 .codesign 的已知模式相反 判据是两份 sha256 对比）  # reference: archives/l/libtsm/4.3.0/notes.md"

validation:
  upstream_tests:
    command: "TEMP=<任务可写目录> meson test -C build-native --print-errorlogs（先 meson setup build-native && meson compile -C build-native）"
    statistical_unit: "check 注册用例（TEST(...) 即 tcase_add_test）以各套件自报的 'Checks: N' 计入"
    suites: 7
    total: 37
    passed: 37
    failed: 0
    skipped: 0
    not_run: 0
    take_number_command: "for t in test_htable test_screen test_selection test_symbol test_valgrind test_vte_mouse test_vte; do TEMP=<可写> ./build-native/test/$t; done | grep -o 'Checks: [0-9]*' | awk '{s+=$2} END {print s}'"
  conan_create:
    command: "conan create archives/l/libtsm/4.3.0 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --build=missing --user=ohpcd --channel=stable（等价形态：CI 的 ci/conan/build_and_test.sh 用 --build=\"libtsm/*\" 强制重建目标包）"
    result: passed
  test_package:
    command: "./test_libtsm（CMakeDeps 消费者 链接包内 libtsm.so.4）"
    assertions: 47
    result: passed
  artifact_integrity:
    command: "sha256sum <build>/src/tsm/libtsm.so.4.3.0 <pkg>/lib/libtsm.so.4.3.0 && readelf -d <pkg>/lib/libtsm.so.4.3.0 | grep -E 'SONAME|NEEDED' && dlopen <pkg>/lib/libtsm.so.4.3.0"
    result: "两份 sha256 一致；SONAME=libtsm.so.4；DT_NEEDED 仅 libc.so；dlopen+dlsym 成功（默认 80x24）"
