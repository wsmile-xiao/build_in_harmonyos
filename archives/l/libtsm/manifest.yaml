software: libtsm
display: "libtsm (TSM)"
description: "终端模拟器状态机库：实现 DEC VT100-VT520 兼容的转义序列解析、屏幕缓冲区、选择与键盘编码（kmscon 等终端模拟器的底层库）"
category: library
homepage: "https://github.com/kmscon/libtsm"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 工程，配方用 MesonToolchain + Meson 构建；无 configure 脚本、无平台探测脚本，OHOS 交叉构建零补丁"
    - "xkbcommon 是上游可选依赖（仅用于 keysym 翻译）；ohpcd 未发布该包时走上游自带的 external/xkbcommon/xkbcommon-keysyms.h 回退路径，无需补丁"
    - "上游 src/tsm/meson.build 用 shared_library('tsm') 无条件产出共享库（version 4.x / soversion 4，libtsm.sym 符号版本 LIBTSM_3/LIBTSM_4），无静态变体，故配方 shared 选项默认 True 且拒绝 False"
    - "上游 test/meson.build 无条件 dependency('check')，但 check 只是测试框架（不得进入包依赖链），配方用 -Dtests=false 关闭；7 套 check 测试在设备原生阶段执行"
    - "上游测试二进制用 declare_dependency(sources:) 直接编译库源码，不链接交付的 libtsm.so——交付物另由 test_package 消费者与 dlopen/sha256 人工补测覆盖"
  common_dependencies: []

versions:
  "4.3.0":
    status: built
    build_date: "2026-09-11"
    conan_ref: "libtsm/4.3.0"
  "4.6.0":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libtsm/4.6.0"
