# test_package/MANIFEST.yml — libtsm 4.6.0
# Upstream and consumer test declaration required by CI L0e.

package: libtsm/4.6.0
homepage: "https://github.com/kmscon/libtsm"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "libtsm-4.6.0.tar.gz (official kmscon/libtsm tag v4.6.0 archive, top dir libtsm-4.6.0)"
  source_sha256: "5c64411fd558aa004170af9a04c12c3095e593b9e38a2fec7da1dafa7793dbb7"
  build_system: "meson (>= 1.1); upstream project('libtsm', 'c', c_std=gnu99)"
  test_definition: >
    test/meson.build builds 7 executables and registers them with the
    `check` framework (dependency('check'), unconditional). Each executable
    defines its cases with the upstream macros in test/test_common.h:
    TEST_DEFINE_CASE(<tcase>) creates a TCase and TEST(<fn>) registers a
    START_TEST function in it; TEST_DEFINE(TEST_SUITE(...)) provides main()
    and runs the suite via srunner_run_all(). `check` reports
    "100%: Checks: N, Failures: 0, Errors: 0" per executable, where N is the
    number of registered test cases that ran — that is the counting unit
    used below (44 cases in total, 7 suites).
  counting_unit: >
    one `check` test case = one TEST(...) registration = the N in the
    executable's "Checks: N" summary line
  take_number_command: >
    for t in test_htable test_screen test_selection test_symbol test_valgrind
    test_vte_mouse test_vte; do TEMP=<writable dir> ./build-native/test/$t;
    done | grep -o 'Checks: [0-9]*' | awk '{s+=$2} END {print s}'   # -> 44
  source_level_cross_check: >
    the same number is obtained directly from the upstream sources, without
    running anything: `cd <src>/libtsm-4.6.0 && grep -c '^START_TEST'
    test/*.c | awk -F: '{s+=$2} END {print s}'` -> 44 (2+4+13+2+1+7+15).
    meson registers 7 suites (`grep -c '^test(' test/meson.build` -> 7).
    Framework-reported cases, source-level START_TEST blocks and suite count
    are therefore mutually consistent.
  suite_list_command: "meson test -C build-native --list   # -> 7 suite names"
  dependency: >
    test framework `check` (published as check/0.15.2 on the ohpcd remote).
    It is NOT part of the package dependency chain: the recipe builds with
    -Dtests=true but check is supplied via test_requires+PkgConfigDeps, so it
    stays test-only and never leaks to consumers.
  note_deviation: >
    The upstream test binaries do NOT exercise the shipped shared library:
    src/tsm/meson.build declares libtsm_dep with `sources: libtsm_srcs`, so
    every test executable recompiles the library sources and links them
    statically (readelf -d test/test_vte shows no DT_NEEDED for libtsm).
    Upstream tests therefore validate the source tree; the delivered
    libtsm.so.4 is validated separately by test_package/test_libtsm.c and by
    the build-tree/installed-copy byte comparison in notes.md. No upstream
    test was modified, skipped or removed.

upstream_check_command: >
  meson setup build-native && meson compile -C build-native &&
  TEMP=<writable dir> meson test -C build-native --print-errorlogs
upstream_test_in_build: true
upstream_test_command: >
  TEMP=<build_folder> meson test -C builddir --print-errorlogs (runs inside
  conanfile.py build() after meson build; check resolved via
  test_requires check/0.15.2 + PkgConfigDeps)

# Counting unit: one `check` test case (TEST(...) registration).
# TOTAL = PASS + FAIL + SKIP + NOT_RUN = 44 + 0 + 0 + 0 = 44
upstream_tests:
  - test_name: "htable"
    source: "test/test_htable.c"
    description: "shl-htable hash table: string and ulong keys, insert/remove/visit/clear"
    command: "./build-native/test/test_htable"
    expected: "100%: Checks: 2, Failures: 0, Errors: 0"
  - test_name: "screen"
    source: "test/test_screen.c"
    description: "screen buffer: geometry, cursor movement, insert/delete lines and chars, erase operations"
    command: "./build-native/test/test_screen"
    expected: "100%: Checks: 4, Failures: 0, Errors: 0"
  - test_name: "selection"
    source: "test/test_selection.c"
    description: "selection handling incl. UTF-8/wide characters and scrollback selections"
    command: "./build-native/test/test_selection"
    expected: "100%: Checks: 13, Failures: 0, Errors: 0"
  - test_name: "symbol"
    source: "test/test_symbol.c"
    description: "symbol table: symbol creation, ref/unref, UTF-8 round trip"
    command: "./build-native/test/test_symbol"
    expected: "100%: Checks: 2, Failures: 0, Errors: 0"
  - test_name: "valgrind"
    source: "test/test_valgrind.c"
    description: >
      single case whose body allocates 0x100 bytes and asserts the pointer is
      non-NULL; upstream comments it as "Dummy which just leaks memory. Used
      to verify valgrind memcheck". Upstream CI runs plain `meson test`
      without invoking valgrind, and this run replicates exactly that: the
      case executes and passes, no valgrind instrumentation is claimed. No
      assertion of this case is conditional on running under valgrind.
    command: "./build-native/test/test_valgrind"
    expected: "100%: Checks: 1, Failures: 0, Errors: 0"
  - test_name: "vte_mouse"
    source: "test/test_vte_mouse.c"
    description: "mouse tracking modes: X10/1002/1003/1006/1016 encodings and modifier handling"
    command: "./build-native/test/test_vte_mouse"
    expected: "100%: Checks: 7, Failures: 0, Errors: 0"
  - test_name: "vte"
    source: "test/test_vte.c"
    description: "VTE escape sequence state machine: SGR, cursor addressing, modes, charsets, CSI defaults, ctrl+shift arrows"
    command: "./build-native/test/test_vte"
    expected: "100%: Checks: 15, Failures: 0, Errors: 0"

upstream_test_total: 44
upstream_test_passed: 44
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_test_not_run: 0

# Consumer-perspective checks against the packaged artifact (linked against
# the shipped libtsm.so.4, not against the source tree).
test_package_tests:
  - file: test_libtsm.c
    scenario: "consumer-api"
    description: >
      Screen and VTE construction over the public API of the installed
      library; geometry and resize; text through the escape-sequence parser
      verified through the tsm_screen_draw callback; SGR bold/underline/
      italic/inverse/dim (4.6.0) plus the 16-colour and 24-bit true-colour
      path; named colour palettes; ED/CUP handling; a wide CJK character
      (U+4E2D, width 2); scrollback buffer accounting; selection copy
      returning the selected UTF-8 text; keyboard encoding in normal and DEC
      cursor-key application mode; the new tsm_screen_draw2() simplified
      drawing API (4.6.0: direct cell array, verified against fed text);
      the tsm_ucs4_* helpers; reference counting. Every check has a failure
      exit path and the run aborts non-zero unless all 53 checks pass.
    command: "./test_libtsm"
    assertions: 53

assertion_count: 53
