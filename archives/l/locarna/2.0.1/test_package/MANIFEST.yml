# test_package/MANIFEST.yml
# 上游官方测试声明文件 — LocARNA 2.0.1
package: locarna/2.0.1
homepage: "https://s-will.github.io/LocARNA"

# 上游测试命令（automake make check）
upstream_check_command: "make check"
# conanfile.py build() 方法中是否已集成上游测试（Layer 1: make check 在 build() 末尾执行）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试是否真实存在（已通过源码审计确认，非 no_tests）
upstream_tests_exist: true
# Catch2 单元测试套件 test_locarna_lib：22 个 TEST_CASE、175 个断言，全部通过。
# 集成测试 test_programs（bash/perl 驱动，需 /bin/bash 与 MLocarna 模块，OHOS 环境
# 不具备）已在配方内从 TESTS 中剔除，仅保留单元套件。
# HMBS rule4 证据门禁以 Catch2 test-case 为统计单位，故 upstream_test_total = 22。
upstream_test_total: 22
upstream_test_count_method: catch2_test_cases

upstream_tests:
  - file: src/Tests/
    description: "Catch2 单元测试套件（22 个 TEST_CASE / 175 断言，分布在 src/Tests/{alphabet,anchor_constraints,ext_rna_data,matrices,multiple_alignment,rna_data,rna_ensemble,rna_structure,trace_controller,zip}.cc；test_locarna_lib.cc 仅为 CATCH_CONFIG_MAIN 包装）"
    command: "make check SHELL=/bin/sh TESTS=test_locarna_lib（配方从 TESTS 中剔除 test_programs 集成驱动）"

# test_package 侧额外覆盖（不入上游计数）：
#   - test_liblocarna：链接安装后的静态库并构造 LocARNA::Sequence（消费端 API 冒烟）
#   - L2/conan test：运行安装后的 locarna CLI（--version + 真实成对比对打分），
#     是 patches/0001（AArch64 plain char / getopt EOF 死循环）的回归测试。
