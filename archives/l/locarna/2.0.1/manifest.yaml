version: "2.0.1"
software: "locarna"
status: built
build_date: "2026-10-09"
build_system: "autotools"

source:
  url: "https://github.com/s-will/LocARNA/releases/download/v2.0.1/locarna-2.0.1.tar.gz"
  sha256: "1f50748d2f8f4bf5888394154d366e0eed8d4e20a3cd0da8b33e200aa1d9edf7"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared（静态 libLocARNA-2.0.a；R26 规避 OHOS 共享库加载问题）"
    - "--build/--host=aarch64-unknown-linux-gnu（老 config.sub 2014 版不识别 ohos，强制 GNU 三元组）"
    - "AWK=<toolchain gawk>（configure 需显式 awk）"
  dependencies:
    - viennarna/2.7.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-LocARNA-options.cc.patch"

knowledge_gained:
  - "ref: DRAFT-8543-plain-char-eof-sentinel-infinite-loop — 以 plain char 承接 getopt_long()/getc() 的 int 返回值再与 EOF 比较：OHOS/aarch64 下 plain char 默认无符号（__CHAR_UNSIGNED__），EOF(-1) 截断为 255，循环失去唯一出口 → 进程 100% CPU 空转且零输出（timeout 124）。修复＝把接收变量改为 int。同类既有条目 E419（plain char 有符号性影响 INT8 数值）症状不同：那里数据仍在、只是数值错，此处哨兵不可表示、控制流丢失。"
  - "ref: E490 — autotools 助手脚本可执行位：解包后 config.guess/config.sub/install-sh 可能丢失 +x；本配方不依赖其执行位（configure 经 /bin/sh 调用、install 走 bundled install-sh），构建全绿。"
  - "ref: E538-draft（误命中，非本包根因）— conan-verify G2 失败时知识引擎按通用报错匹配到 harfbuzz/pango 共享/静态 binary 漂移条目；locarna 的真实失败是补丁路径前缀错误（a/LocARNA/... 应为 a/src/LocARNA/...），与 E538 无关。"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/cache/builds/locarna-2.0.1.orig
  source_work_dir: /data/storage/el2/base/cache/builds/locarna-2.0.1.work
  source_orig_hash: 767586a50a60ab85
  source_work_hash: c312b56ebb643cd9
  generated_at: '2026-10-10T00:50:01'
  patches_count: 1

patch_classification:
  - file: 0001-src-LocARNA-options.cc.patch
    type: portability
    platform_only: false
    guard: 'none'
    note: >-
      AArch64 plain char 默认无符号导致 getopt_long() 的 EOF 哨兵不可表示；
      改接收变量为 int 在所有平台都是正确写法（getopt_long 的文档返回类型），
      无需 __OHOS__ 宏守卫，故 platform_only=false / guard=none。
      patch_generation.method=per-file-difflib（由 ohc-run.py refresh-patch --auto 生成）。
