patches:
  "2.0.1":
    - patch_file: "patches/0001-src-LocARNA-options.cc.patch"
      patch_description: >-
        OHOS/aarch64 可移植性修复：process_options() 用 `char c` 承接
        getopt_long() 的 int 返回值。AArch64 下 char 默认无符号（AAPCS），
        EOF(-1) 被截断为 255，主选项循环 `while ((c = getopt_long(...)) != EOF)`
        永不退出 → 所有调用（含 --help/--version）100% CPU 空转、零输出。
        改为 int c（getopt_long 的文档返回类型）后全部 CLI 恢复正常。
      patch_type: portability
