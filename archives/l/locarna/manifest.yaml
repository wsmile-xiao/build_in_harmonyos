software: locarna
display: "LocARNA"
description: "RNA sequence & structure alignment tools (8 native CLI tools + libLocARNA C++ library)"
category: biology
homepage: "https://s-will.github.io/LocARNA"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "patches/0001-src-LocARNA-options.cc.patch：process_options() 用 `char c` 承接 getopt_long() 的 int 返回值；AArch64 下 plain char 默认无符号（__CHAR_UNSIGNED__），EOF(-1)→255，`while ((c=getopt_long(...))!=EOF)` 永不退出 → 所有 CLI 100% CPU 空转、零输出、timeout 124。改为 `int c` 后 8 个工具全部恢复（含真实端到端比对）"
    - "硬依赖 viennarna/2.7.2（RNAlib2 >= 2.5.1）；其 RNAlib2.pc 的 prefix=/ 在 OHOS 解析到宿主 /lib，配方在 generate() 内重写为 viennarna 包目录并注入 PKG_CONFIG_PATH"
    - "老版 config.sub（2014）不识别 ohos，采用 libuuid 模式强制 --build/--host=aarch64-unknown-linux-gnu，autotools 永不直接收到 ohos 值"
    - "禁用 lib/perl 子目录：MLocarna.pm → MLocarna::threaded → `use threads`，OHOS 镜像自带 Perl 未编译线程支持（This Perl not built to support threads）；Perl 前端属独立交付物。bin/ 内的非 ELF 助手脚本（mlocarna/locarnate/*.pl/*.pm/benchmark-plot.R）在 OHOS 上同步剔除，只交付可执行的 ELF 工具"
    - "集成测试 test_programs（bash/perl 驱动）从 TESTS 剔除；仅保留 Catch2 单元套件 test_locarna_lib（22 用例 / 175 断言）作上游测试证据"
    - "configure umask 077->022 + ac_pwd getcwd 回退（HMDFS）；make install 经捆绑 config/install-sh（/bin/sh）绕过宿主 install shim（Error 64）"
    - "--disable-shared 静态构建，规避 OHOS 共享库加载问题（R26）"
  common_dependencies:
    - viennarna/2.7.2

versions:
  "2.0.1":
    status: built
    build_date: "2026-10-09"
