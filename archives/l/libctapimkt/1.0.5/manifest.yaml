# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
  - "--enable-static"
  - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # libctapimkt 自包含：仅 POSIX termios + dlfcn，无外部依赖

  # 构建工具（tool_requires）
  build_requirements:
  - "automake/1.18"
  - "autoconf/2.72"
  - "libtool/2.5.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 说明: 所有 OHOS 适配修复均在 conanfile.py build() 中动态完成
#   - config.guess/sub OHOS 识别: build() 内 _patch_config_guess_sub()
#   - configure umask 077 -> 022 (hmfs 兼容): build() 内 sed
#   - Makefile.am 移除 -lusb + -lctapimkt 改 libctapimkt.la: build() 内 sed
#   - mktlin.c antwort() 缺少返回值: build() 内 sed

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "2013 旧版 config.guess/config.sub 无法识别 aarch64-unknown-linux-ohos，需 autoreconf 重建或手工补丁（E007）"
- "autoreconf 生成的 configure 在 hmfs 上 mktemp -d + umask 077 创建的目录不可写，需 sed 'umask 077' -> 'umask 022'（E046 同类）"
- "Makefile.am 中 -lusb 为多余链接（mktlin 实际不使用 libusb API），移除后可构建"
- "上游 Makefile.am 无 include_HEADERS，头文件 ctapimkt/ctapi.h 需在 package() 手工复制"
- "mktlin.c antwort() 声明为 int 但函数体无返回值，clang 15 -Wreturn-type 视为 error"

