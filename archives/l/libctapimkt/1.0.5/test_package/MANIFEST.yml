# test_package/MANIFEST.yml
package: libctapimkt/1.0.5
homepage: "https://github.com/1Jo1/libctapimkt"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (上游 2010 年代码无 tests/ 目录，make check 无测试目标)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 -lctapimkt 并实际调用 CT_init/CT_data/CT_close CT-API 符号（R34 实质测试）"
    command: "./test_libctapimkt"

# 测试断言总数
assertion_count: 3
