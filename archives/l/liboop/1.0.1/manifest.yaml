version: "1.0.1"
software: "liboop"
status: built
build_date: "2026-09-18"
build_system: "autotools"

source:
  url: "https://ftp.lysator.liu.se/pub/liboop/liboop-1.0.1.tar.gz"
  tar_format: tar.gz
  sha256: "56af16ad65e7397dadc8268e37ff6f67431db390c60c75e21a33e12b0e0d17e0"

build:
  system: autotools
  configure_options:
    - "--without-adns"
    - "--without-readline"
    - "--without-glib"
    - "--without-tcl"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "liboop 1.0.1 upstream ships no automated test suite: no tests/ dir, no TESTS/check_PROGRAMS wiring, make check is an automake no-op; only test-oop manual interactive sample"
  - "Core-only configure flags disable all optional adapters (adns/readline/glib/tcl/libwww) for a zero-dependency deterministic build"
  - "autoconf 2.69 configure needs HMDFS workdir fallback (ac_pwd falls back to PWD) plus writable TMPDIR and /bin/sh SHELL override"
  - "E007: 2014-03-23 config.guess uses echo/exit style (pre-GUESS= refactor): HarmonyOS branch added in vintage style emitting aarch64-unknown-linux-ohos natively, config.sub accepts linux-ohos, --build/--host stripped"
  - "sandbox CC: profile /data/service/hnp/bin/clang is inaccessible in preflight (exit 127); resolve via shutil.which(clang) then tools.build:compiler_executables dict (juise 3.0.0 pattern), force CC/CXX/AR/RANLIB inline + conanbuild.sh rewrite"
