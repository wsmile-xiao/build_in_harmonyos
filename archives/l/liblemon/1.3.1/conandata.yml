sources:
  url: "https://lemon.cs.elte.hu/pub/sources/lemon-1.3.1.tar.gz"
  sha256: "71b7c725f4c0b4a8ccb92eb87b208701586cf7a96156ebd821ca3ed855bad3c8"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Use the supported CMP0048 policy behavior with modern CMake"
    patch_type: "portability"
  - patch_file: "patches/0002-lemon-random.h.patch"
    patch_description: "Remove register storage specifiers rejected by C++17 compilers"
    patch_type: "portability"
  - patch_file: "patches/0003-lemon-path.h.patch"
    patch_description: "Make RevArcIt to Arc conversion explicit for strict C++17 overload resolution"
    patch_type: "portability"
  - patch_file: "patches/0004-ohos-soname.patch"
    patch_description: "Force the loader-safe liblemon.so SONAME for OHOS and HarmonyOS CMake identities"
    patch_type: "portability"
  - patch_file: "patches/0005-ohos-config-install.patch"
    patch_description: "Install the generated LEMONConfig.cmake for OHOS and HarmonyOS CMake identities"
    patch_type: "portability"
