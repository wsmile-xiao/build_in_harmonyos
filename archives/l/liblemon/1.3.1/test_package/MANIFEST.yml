# Complete upstream inventory for the dependency-free LEMON configuration.
package: liblemon/1.3.1
homepage: https://lemon.cs.elte.hu/

upstream_check_command: "ctest --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"

# test/CMakeLists.txt defines these 42 unconditional tests. lp_test and
# mip_test are conditional on optional solver backends, all disabled here.
upstream_tests:
  - {file: test/adaptors_test.cc, command: adaptors_test}
  - {file: test/arc_look_up_test.cc, command: arc_look_up_test}
  - {file: test/bellman_ford_test.cc, command: bellman_ford_test}
  - {file: test/bfs_test.cc, command: bfs_test}
  - {file: test/bpgraph_test.cc, command: bpgraph_test}
  - {file: test/circulation_test.cc, command: circulation_test}
  - {file: test/connectivity_test.cc, command: connectivity_test}
  - {file: test/counter_test.cc, command: counter_test}
  - {file: test/dfs_test.cc, command: dfs_test}
  - {file: test/digraph_test.cc, command: digraph_test}
  - {file: test/dijkstra_test.cc, command: dijkstra_test}
  - {file: test/dim_test.cc, command: dim_test}
  - {file: test/edge_set_test.cc, command: edge_set_test}
  - {file: test/error_test.cc, command: error_test}
  - {file: test/euler_test.cc, command: euler_test}
  - {file: test/fractional_matching_test.cc, command: fractional_matching_test}
  - {file: test/gomory_hu_test.cc, command: gomory_hu_test}
  - {file: test/graph_copy_test.cc, command: graph_copy_test}
  - {file: test/graph_test.cc, command: graph_test}
  - {file: test/graph_utils_test.cc, command: graph_utils_test}
  - {file: test/hao_orlin_test.cc, command: hao_orlin_test}
  - {file: test/heap_test.cc, command: heap_test}
  - {file: test/kruskal_test.cc, command: kruskal_test}
  - {file: test/lgf_reader_writer_test.cc, command: lgf_reader_writer_test}
  - {file: test/lgf_test.cc, command: lgf_test}
  - {file: test/maps_test.cc, command: maps_test}
  - {file: test/matching_test.cc, command: matching_test}
  - {file: test/max_cardinality_search_test.cc, command: max_cardinality_search_test}
  - {file: test/max_clique_test.cc, command: max_clique_test}
  - {file: test/max_flow_test.cc, command: max_flow_test}
  - {file: test/min_cost_arborescence_test.cc, command: min_cost_arborescence_test}
  - {file: test/min_cost_flow_test.cc, command: min_cost_flow_test}
  - {file: test/min_mean_cycle_test.cc, command: min_mean_cycle_test}
  - {file: test/nagamochi_ibaraki_test.cc, command: nagamochi_ibaraki_test}
  - {file: test/path_test.cc, command: path_test}
  - {file: test/planarity_test.cc, command: planarity_test}
  - {file: test/radix_sort_test.cc, command: radix_sort_test}
  - {file: test/random_test.cc, command: random_test}
  - {file: test/suurballe_test.cc, command: suurballe_test}
  - {file: test/time_measure_test.cc, command: time_measure_test}
  - {file: test/tsp_test.cc, command: tsp_test}
  - {file: test/unionfind_test.cc, command: unionfind_test}

test_package_tests:
  - file: test.cpp
    description: "Link liblemon and verify graph counts, BFS reachability/distance, and the global random symbol"
    command: "./liblemon_test"

assertion_count: 6
