software: libax25
version: 1.2.2
status: published
category: library
description: AX.25 amateur radio protocol library
license: LGPL-2.1-or-later

build_info:
  build_system: autotools
  compiler: clang
  cflags: -fPIC -O2
  configure_options:
    - --prefix=/storage/Users/currentUser/usr/local
  build_type: static

dependencies:
  build:
    - zlib
  runtime:
    - zlib

files:
  libraries:
    - libax25.a
    - libax25io.a
  headers:
    - netax25/*.h

test_summary:
  test_date: 2026-05-30
  tests_passed: 5
  tests_total: 5
  test_coverage:
    - "头文件包含验证"
    - "库函数符号验证"
    - "静态库链接验证"
    - "结构体定义验证"
    - "函数调用验证"
  linkage: "libax25.a + libax25io.a + libz.a"

quality_gates:
  G1_binary_integrity: PASS
  G2_functionality: PASS (5/5 tests passed)
  G3_portability: PASS (static library)
  G4_archive_integrity: PASS