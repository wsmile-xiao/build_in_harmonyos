# conandata.yml - libdv-tools 1.0.0
# 上游: https://sourceforge.net/projects/libdv/ (libdv 1.0.0)
# 与 archives/l/libdv/1.0.0-r8 同一份上游源码 tarball。
sources:
  url: "https://downloads.sourceforge.net/project/libdv/libdv/1.0.0/libdv-1.0.0.tar.gz"
  sha256: "a305734033a9c25541a59e8dd1c254409953269ea7c710c39e540bd8853389ba"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: >-
      给 libdv 自带的 config.guess（2005-12-13 版）插入 *:HarmonyOS:*:* 分支：
      OHOS 上 uname -s 返回 HarmonyOS，2005 脚本的 case 表里没有任何分支能命中，
      configure 直接报 "cannot guess build type"。只新增 10 行分支，不整份替换文件。
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: >-
      给 libdv 自带的 config.sub（2005-12-11 版）补 aarch64/arm64 两条 CPU 规则、
      linux-ohos* 的 KERNEL-OS 规则，并让 -linux-ohos 不被归一化成 -linux-gnu。
      不补的话配置阶段会直接报 "machine `aarch64' not recognized"。
    patch_type: "portability"