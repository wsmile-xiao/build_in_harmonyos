# 版本级 manifest - libdv-tools 1.0.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.0"
software: libdv-tools

status: built
build_date: "2026-09-16"
build_system: autotools

source:
  # 与 archives/l/libdv/1.0.0-r8 同一份上游 tarball (R39: 上游官方地址)
  url: "https://downloads.sourceforge.net/project/libdv/libdv/1.0.0/libdv-1.0.0.tar.gz"
  sha256: "a305734033a9c25541a59e8dd1c254409953269ea7c710c39e540bd8853389ba"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared"     # libdv 静态链进三个工具
    - "--enable-static"
    - "--without-x"          # 鸿蒙没有 X11
    - "--disable-gtk"        # playdv 的 GTK 前端
    - "--disable-xv"         # XVideo 输出
    - "--disable-asm"        # IDCT 内联汇编只针对 x86
  dependencies:
    - popt/1.16              # encodedv/dubdv/dvconnect 的命令行解析
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

knowledge_gained:
  - "libdv 随包的 config.guess / config.sub 都是 2005 年版：CPU 表里没有 aarch64，OHOS 的 uname -s（HarmonyOS）也不在任何分支里。这类 2005 年脚本连 patch-autotools-ohos.pl 的注入点（__ANDROID__ / android-linux）都不存在，但不必整份替换：config.guess 插一个 *:HarmonyOS:*:* 分支（10 行），config.sub 补 aarch64/arm64 两条 CPU 规则 + linux-ohos* 的 KERNEL-OS 规则即可（合计 39 行），补丁体积从 6000+ 行降到 55 行"
  - "libdv 用 AM_MAINTAINER_MODE 且默认关闭，所以 build 时 configure 不会被重新生成 —— 这点和 libbs2b 完全相反（后者必须 autoreconf -fi 才能应用 configure.ac 补丁）。补 config.guess/config.sub 这类辅助脚本在 libdv 上能生效，在开了 maintainer mode 的项目上会被 automake --force-missing 覆盖"
  - "encodedv / dubdv / dvconnect 的命令行解析走 popt，链接行里的 $(POPT_LIB) 来自 configure.ac 的 AC_CHECK_LIB(popt, poptGetContext)，不是 pkg-config。popt 缺失时 configure 只 WARN（而且提示文案还写错成 playdv needs the popt package），编译照样通过，但工具没定义 HAVE_LIBPOPT，启动时遍历空选项表直接段错误（exit 139）——拆 tools 包必须把 popt 变成硬依赖并在 configure 后校验 config.h 里有 HAVE_LIBPOPT"
  - "同一个上游工程拆库包/tools 包时，configure 选项要分开：库包只需要 --without-x/--disable-asm，tools 包还额外需要 --disable-shared --enable-static，否则 encodedv/dubdv 链接的是 libdv.so，一旦 package() 把 lib/ 删掉就变成运行期找不到 .so"
  - "libdv 的 configure 用 umask 077 && mktemp -d ./confXXXXXX 建临时目录，HMDFS 忽略 chmod 导致 config.status 写不进去；需要改成 umask 000 + mkdir -p $TMPDIR/conf$$（和 ldns 是同一个补丁模式）"
  - "libdv 的 man 页（encodedv.1 dvconnect.1 dubdv.1）由 encodedv/Makefile.am 的 man_MANS 安装到 share/man，tools 包删除 share/ 时一并去掉；库包只出 lib/include/libdv.pc，两边不重叠"