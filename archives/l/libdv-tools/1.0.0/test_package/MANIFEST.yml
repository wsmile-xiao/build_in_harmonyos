# test_package/MANIFEST.yml
# libdv-tools ships only the programs from the upstream encodedv/ directory.
# libdv has no test suite (the top level Makefile.am defines no TESTS target,
# `make check` is a no-op), so test_package/test.sh is the only automated
# verification for these binaries.
package: libdv-tools/1.0.0
homepage: "https://sourceforge.net/projects/libdv/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# R34: the test_package must actually invoke the tested binaries.
test_package_tests:
  - file: test.sh
    description: >-
      端到端: ①encodedv/dubdv 的 popt --version 与 --help 契约（退出 0，
      且 help 里能看到 --start-frame/--encode-passes 等真实选项表）；
      ②popt 缺失时工具的失败模式回归守卫——无参数调用必须以普通退出码
      结束而不是被信号打死（历史缺陷：没有 HAVE_LIBPOPT 时 encodedv
      段错误，退出码 139）；
      ③未知选项与缺失输入模式两个反例必须以非 0 退出
    command: "bash test.sh"

assertion_count: 12