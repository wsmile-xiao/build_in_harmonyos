# test_package/MANIFEST.yml — libgetline 1.0
package: libgetline/1.0
homepage: "https://github.com/hilderingt/libgetline"

# 上游测试命令（make -n check 分析结果：无 TESTS/check_PROGRAMS 声明）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序：无。
# 全树枚举证据：上游仓库仅有 configure.ac / Makefile.am / src/libgetline.c /
# include/*.h / .build-aux/ / .m4/ 与 README/LICENSE，不存在 tests/ 目录、
# 测试源码或注册的测试目标；make check 是 automake 默认空目标（exit 0，无任何
# 测试程序执行）。详见 notes.md「上游测试枚举台账」。
upstream_tests: []

# test_package 中自带的测试（消费者视角 + 鸿蒙专项）
test_package_tests:
  - file: test.c
    description: "消费者用例：通过公开 API 打开文件并逐行读取、校验行内容与长度（含换行约定）"
    command: "./test_libgetline"
  - file: ohos_platform_test.c
    description: "鸿蒙专项测试：NOBLANK 空行抑制/EOF 状态位/NOCLOSE fd 置留/EBADF 错误路径/长行缓冲增长"
    command: "./test_libgetline_ohos"

# 测试断言总数（两个新增测试的 CHECK 断言合计：test.c 11 + ohos_platform_test.c 33）
assertion_count: 44