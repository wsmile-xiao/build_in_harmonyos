# conandata.yml — libgetline 1.0
# 官方源: https://github.com/hilderingt/libgetline (默认分支 master, 无 tag/release)
# sha256 由本任务实际下载的官方 codeload 归档核验（上游无发布物，锚定 master 快照）。
sources:
  url: "https://codeload.github.com/hilderingt/libgetline/tar.gz/refs/heads/master"
  sha256: "1c2536935e39ee9c53fc86d5b1555f86c66f49591099e30ceffb710ea96c99d5"
  # codeload URL 无文件扩展名，conan get() 无法推断压缩格式；显式给出文件名
  filename: "libgetline-master.tar.gz"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: "Replace umask 077 with umask 022 in configure temp-dir creation (E011/E129: HMDFS forces setgid, so umask-077 dirs are drwx--S--- and unwritable even by the owner, breaking config.status)"
    patch_type: "platform"
  - patch_file: "patches/0002-src-libgetline.c.patch"
    patch_description: "Fix two upstream bugs in libgetln_getline: (1) lsize was never initialized (only llen = 0), leaving the growth path UB; (2) the doubling optimization compounded into the running total, so a line read in small chunks reallocated to 2^N sizes (multi-TB) every chunk instead of max(needed, 2*cap) — exponential realloc explosion/hang"
    patch_type: "portability"
