knowledge_gained:
  - "conan 包名 libcob4 不是另一个上游项目：它取自 libcob/Makefile.am 的 libtool -version-info 6:0:2，SONAME = libcob.so.(6-2) = libcob.so.4，即 ABI 主版本 4"
  - "libtool -version-info C:R:A 的产物文件名是 libNAME.so.(C-A).A.R，本例 libcob.so.4.2.0；判定 ABI 包名只看 SONAME，不看 release/age"
  - "从 autotools 大包中拆运行库：`make -C <subdir> install` 只装该子目录的库与 pkginclude 头，顶层 include_HEADERS 的伞头文件（libcob.h）必须手工复制"
  - "上游测试套件经 cobc 驱动，因此拆库包不能只构建子目录；仍走完整 configure+make+check，只在 install 阶段收敛，才能既真跑上游测试又只交付运行库"
  - "libcob 的临时目录解析结果（cob_gettmpdir() 的 static tmpdir）是进程内静态缓存，测 TMPDIR 行为必须每条断言各起一个新进程"
  - "libcob 会把解析后的临时目录回写进 TMPDIR 环境变量，供它 fork 出去的外部工具使用"
  - "HarmonyOS 上 TMPDIR 可能不存在或指向只读挂载：libcob 必须拒绝无效目录并退化到可用目录（patch 0004/0005）"

knowledge_drafts:
