# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libcob4/3.2
homepage: "https://www.gnu.org/software/gnucobol/"

# 上游测试：libcob 与 gnucobol 是同一个上游（GnuCOBOL 3.2）的同一份源码，
# 测试套件就是 tests/testsuite（autotest 驱动）。该套件经 cobc 编译器跑，
# 因此本包的 build() 仍然执行完整 `./configure && make` 与 `make check`，
# 只在 install/package 阶段收敛到 libcob 子目录（见 conanfile.py 的 package()）。
upstream_check_command: "make MAKEINFO=true -j1 check"
upstream_test_in_build: true
upstream_test_command: "make MAKEINFO=true -j1 check"

upstream_tests:
  - file: tests/testsuite
    source: gnucobol-3.2/tests/testsuite
    description: "GnuCOBOL 编译器、解析器、运行时、方言与诊断测试套件（1226 behaved as expected / 56 skipped / 0 unexpected failures）"
    command: "make MAKEINFO=true -j1 check"
  - file: tests/cobol85/Makefile.am
    source: gnucobol-3.2/tests/cobol85/Makefile.am
    description: "COBOL 85 校验套件驱动"
    command: "make MAKEINFO=true -j1 check"

# 无宿主不兼容用例：套件本身在 OHOS aarch64 上完整跑通（56 例 skip 是
# --with-db=no/--with-xml2=no/--with-json=no 关掉的可选设施所致，非平台缺陷）
host_incompatible_tests: []

test_package_tests:
  - file: test_libcob.c
    description: >
      api 模式（ctest 驱动）：链接真实 libcob.so.4，断言
      cob_is_initialized() 在 cob_init() 前后分别为假/真、
      cob_malloc/cob_free 往返不丢载荷、
      cob_get_field_str 把 26 字节字段截断进 8 字节缓冲且不越界写（64 字节哨兵校验）、
      cob_sys_getpid() 与 libc getpid() 一致。
    command: "ctest --output-on-failure"
  - file: test_libcob.sh
    description: >
      TAP 驱动（13 条）：包布局 lib/libcob.so.4（SONAME，ABI 4）、
      lib/libcob.so.4.2.0（libtool ABI 文件名）、lib/libcob.so（链接名）、
      include/libcob.h + include/libcob/common.h，且包内无 bin/（纯库包）；
      以及公开 API cob_temp_name() 对四类 TMPDIR 的解析行为 —— 可用目录必须被采用
      并回写 TMPDIR 环境、不存在的目录必须静默退化、指向普通文件必须被拒绝、
      只读目录必须被拒绝（鸿蒙特有：HMFS 上临时目录可能不存在或只读，
      patch 0005 补的 access(W_OK) 检查正是为此；TMPDIR 解析结果是进程内静态
      缓存，故每条断言各起一个进程）。
    command: "sh test_libcob.sh <test_libcob> <package-folder>"

assertion_count: 14
