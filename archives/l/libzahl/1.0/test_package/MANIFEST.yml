# test_package/MANIFEST.yml
# libzahl 1.0 上游官方测试声明文件
package: libzahl/1.0
homepage: "https://git.suckless.org/libzahl"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: true

# 上游测试审计 (源码: 1.0.tar.gz, sha256 523ae1ba84b558fab3598f3d38885138c4df755cda403136102143f569b40162)
upstream_test_audit:
  source_tarball: "1.0.tar.gz"
  source_sha256: "523ae1ba84b558fab3598f3d38885138c4df755cda403136102143f569b40162"
  top_level_files:
    - Makefile           # 定义 check 目标: make check -> 构建 test 并执行 ./test
    - test.c             # 上游主测试源 (约1015行, 约516处 assert/assert_zu/assert_s 断言)
    - test-generate.py   # 随机测试生成器 (生成 test-random.c, 供 test.c 引用)
    - zahl.h             # 公开 API 头文件
    - src/               # 库实现源文件 (约50个 z*.c)
    - config.mk          # 构建配置 (CC/AR/RANLIB/CFLAGS)
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest 目标"
    - "find . -name '*test*' (全树)"
  scan_result: "全树 find -name '*test*' 仅命中 test.c + test-generate.py; 无 tests/ 目录、无 gtest/pytest 框架; Makefile 定义 check 目标 (check: test + ./test), 即上游唯一官方测试入口"
  make_check_output: "make check 构建 test 二进制 (test.c + test-random.c + libzahl.a) 并执行 ./test; 成功时退出码 0, 失败时打印 Failure at line 并返回非零"
  reason: "libzahl 1.0 为纯 C 大整数库, 上游测试即 test.c 确定性断言 + test-generate.py 生成的随机断言, 通过单一 test 二进制执行。无独立测试框架, make check 的 ./test 即完整官方套件"

# 上游测试命令 (make -n check 展开为构建 test 并执行 ./test)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make CC=<cc> AR=<ar> RANLIB=<ranlib> -j1 test && ./test"

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: libzahl-1.0/test.c
    description: "上游官方完整测试套件: 确定性断言 + test-generate.py 生成的随机断言, 单一 test 二进制执行"
    command: "./test"
  - file: test-generate.py
    source: libzahl-1.0/test-generate.py
    description: "上游随机测试生成器: 生成 test-random.c 供 test.c 编译引用"
    command: "./test-generate.py > test-random.c"

# test_package 中自带的测试 (消费者视角验证, R34 实质调用被测 API)
test_package_tests:
  - file: test.c
    description: "消费者视角验证: 加/乘/减/幂/gcd/字符串往返与比较共 6 项真实断言"
    command: "./test_libzahl"

# 测试断言总数 (test.c 的 6 项真实检查, 与 HMBS_TEST_PACKAGE_RESULT discovered=6 一致)
assertion_count: 6
