software: libzahl
version: 1.0
status: built
build_date: "2026-09-15"
description: "Suckless big integer library for arbitrary size integers"
url: https://github.com/maandree/libzahl/archive/refs/tags/1.0.tar.gz
build_system: makefile
category: foundation
dependencies: []
configure_options: []
compile_commands:
  - "make CC=<cc> AR=<ar> RANLIB=<ranlib> CFLAGS='-std=c99 -O2 -Wall -pedantic -fno-strict-aliasing -fwrapv' -j1 libzahl.a"
  - "<python3> test-generate.py > test-random.c (non-empty guard)"
  - "make CC=<cc> AR=<ar> RANLIB=<ranlib> CFLAGS='-std=c99 -O2 -Wall -pedantic -fno-strict-aliasing -fwrapv' -j1 test && ./test"
test_command: "./test"
install_command: "Conan copy() from libzahl.a and zahl.h"
binaries: []
libraries:
  - libzahl.a
headers:
  - zahl.h
patches_applied: []

knowledge_gained: []
notes: |
  libzahl is a portable, ISO C99 suckless bigint library with no dependencies
  beyond libc. Raw Makefile build (no configure/CMake); static-only upstream
  (libzahl.a). Upstream test suite is `make check` (single ./test binary).
