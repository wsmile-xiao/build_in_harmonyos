package: "libantlr3c/3.5.3"
homepage: "https://www.antlr3.org/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  runtime/C/Makefile.am (antlr3-3.5.3 tag archive) declares no TESTS,
  check_PROGRAMS, check-LTLIBRARIES, check-local, or custom test target;
  `make check` runs the automake default zero-test audit target.  The
  antlr3-3.5.3 source distribution ships its runtime test suite (the
  generated C test grammars under runtime/ANTLRTreeParser etc.) in Java
  harness form only, which is a host-side generator suite and cannot run
  against the installed library; upstream does not register any C-runnable
  test target for runtime/C.

test_package_tests:
  - id: "consumer-contract"
    source: "consumer_tests.c"
    command: "consumer_tests"
    description: >-
      Hand-written generated-style lexer drives the installed runtime
      through character-stream primitives (LA/consume/index/seek/EOF/line),
      a token stream over a manual mTokens override (WORD/PLUS/NUMBER/STAR
      sequence), token text/line/column detail checks, and the lexer error
      path (report + single-character recovery), ending with full resource
      release.  No ANTLR Java generator is invoked: the host/target split is
      exercised by hand-writing exactly the calls generated code would make.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

# Runtime assertion accounting (consumer_tests.c, verified by source audit):
#   static FAIL sites = 18 (grep 'FAIL ' on consumer_tests.c)
#   per-execution expansion = 24:
#     test_charstream  7: input!=NULL; LA(1)=='a'; LA(1)=='+' after 2
#       consumes; index-base==2; LA(1)=='2' after seek(base+4);
#       LA(1)==EOF after seek(base+5); line==1 && charPositionInLine==5
#     test_token_stream over "abc+42*def" (via run_lexer_tokens):
#       5 per-token type checks (WORD/PLUS/NUMBER/STAR/WORD)
#       + stream-ends-at-EOF terminal + errors==0
#     test_token_details  6: lexer init; type==WORD; line==1&&col==0;
#       text=="abc"; NUMBER@line2; errors==1
#     test_syntax_error over "hi?there" (via run_lexer_tokens):
#       2 per-token type checks (WORD/WORD) + EOF-terminal + errors==1
test_case_count: 1
assertion_count: 24
