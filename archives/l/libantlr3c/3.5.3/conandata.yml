sources:
  url: "https://github.com/antlr/antlr3/archive/refs/tags/3.5.3.tar.gz"
  sha256: "a0892bcf164573d539b930e57a87ea45333141863a0dd3a49e5d8c919c8a58ab"

patches:
  "3.5.3":
    - patch_file: "patches/0001-Makefile.am-VPATH-support.patch"
      patch_description: >-
        Replace the relative `INCLUDES = -Iinclude` with VPATH-safe
        `AM_CPPFLAGS = -I$(top_srcdir)/include -I$(top_builddir)` so the
        runtime builds out-of-source; antlr3config.h is generated in the
        build dir, hence the second -I.
      patch_type: "portability"
      patch_source: "https://github.com/antlr/antlr3/issues/1266"
