software: libantlr3c
display: "ANTLR v3 C Runtime"
description: "C runtime library for parsers generated by ANTLR v3"
category: devtools
homepage: "https://www.antlr3.org/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 git tag 归档不含生成的 configure，构建时需 autoreconf -fi 引导（E514 需 install-sh 在源码根，autoreconf 自带生成）"
    - "Makefile.am 零测试注册：make check 无 TESTS/check_PROGRAMS，上游 C runtime 无自带单元测试"
    - "无第三方依赖，仅 libc；默认产出 .so+.a，非系统同名库，默认动态由 Conan 管理依赖链"
    - "ANTLR Java 生成器属宿主开发工具，不参与目标构建；test_package 用手写可审计 lexer/parser 消费 runtime"
  common_dependencies: []

versions:
  "3.5.3":
    status: built
    build_date: "2026-09-03"
    conan_ref: "libantlr3c/3.5.3"
    note: "BSD-3-Clause C runtime for ANTLR v3 generated parsers; zero-entry upstream make check audited, consumer-level lexer/parser validation in test_package"
