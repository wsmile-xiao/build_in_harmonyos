# test_package/MANIFEST.yml — libaco 1.2.2
package: libaco/1.2.2
homepage: "https://github.com/hnes/libaco"

# 上游没有统一测试框架：make.sh 把 9 个独立测试程序直接编译，
# test.sh 逐个运行（tutorial_4/5 预期 abort=134；benchmark 为长时基准）。
# aarch64 平台上游 acosw.S 无 aarch64 支持，本端口通过补丁提供后全部可运行。
upstream_check_command: "bash test.sh"

# conanfile.py build() 中集成了上游测试（test_aco_tutorial_0）
upstream_test_in_build: true
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_aco_tutorial_0.c
    source: libaco-1.2.2/test_aco_tutorial_0.c
    description: "single-co yield x5 lifecycle tutorial"
    command: "./test_aco_tutorial_0"
  - file: test_aco_tutorial_1.c
    source: libaco-1.2.2/test_aco_tutorial_1.c
    description: "tutorial 1"
    command: "./test_aco_tutorial_1"
  - file: test_aco_tutorial_2.c
    source: libaco-1.2.2/test_aco_tutorial_2.c
    description: "tutorial 2"
    command: "./test_aco_tutorial_2"
  - file: test_aco_tutorial_3.c
    source: libaco-1.2.2/test_aco_tutorial_3.c
    description: "tutorial 3 (threads)"
    command: "./test_aco_tutorial_3"
  - file: test_aco_tutorial_4.c
    source: libaco-1.2.2/test_aco_tutorial_4.c
    description: "tutorial 4 (intended abort 134)"
    command: "./test_aco_tutorial_4"
  - file: test_aco_tutorial_5.c
    source: libaco-1.2.2/test_aco_tutorial_5.c
    description: "tutorial 5 (intended abort 134)"
    command: "./test_aco_tutorial_5"
  - file: test_aco_tutorial_6.c
    source: libaco-1.2.2/test_aco_tutorial_6.c
    description: "tutorial 6"
    command: "./test_aco_tutorial_6"
  - file: test_aco_synopsis.c
    source: libaco-1.2.2/test_aco_synopsis.c
    description: "synopsis example"
    command: "./test_aco_synopsis"
  - file: test_aco_benchmark.c
    source: libaco-1.2.2/test_aco_benchmark.c
    description: "benchmark (long-running; excluded from test.sh loop)"
    command: "./test_aco_benchmark"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "consumer test: share-stack + create/resume/yield/exit, arg preserved"
    command: "./test_libaco"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
