# 版本级 manifest — libaco 1.2.2 (HarmonyOS / aarch64 端口)
version: "1.2.2"
software: libaco
status: built
build_date: "2026-09-01"
build_system: cmake

source:
  url: "https://github.com/hnes/libaco/archive/refs/tags/v1.2.2.tar.gz"
  sha256: "66495660fd6834bfc94f024c3a64cd4c145cd6ce6576d2d95af15c493b3d825a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-aarch64-support.patch"
  - "patches/0002-add-cmakelists.patch"

knowledge_gained:
  - "libaco 上游仅支持 x86_64/i386（acosw.S 用 Intel 语法，aarch64 直接 #error）；鸿蒙 aarch64 端口需新增 aarch64 上下文切换汇编（GAS 语法，mrs/msr fpcr/fpsr），并在 aco.h/aco.c 注册 aarch64 寄存器布局"
  - "OHOS clang 集成汇编器不支持 .intel_syntax（仅 x86 可用），aarch64 分支必须用 GAS 原生语法；sp 对齐用 mov x9,sp / and x9,x9,#-16 / mov sp,x9（直接 and sp 立即数在本汇编器报 invalid operand）"
  - "aarch64 新协程首启需 trampoline（aco_funcp_entry_asm）：把 body 指针暂存 x19 槽（reg[0]），trampoline 对齐 sp 并置 x30=aco_funcp_protector_asm 后 br x19，实现与 x86 栈槽机制等价的『协程体 return 触发 protector abort』语义"
