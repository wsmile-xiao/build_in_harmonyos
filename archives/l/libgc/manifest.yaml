software: libgc
display: "libgc"
description: "Boehm-Demers-Weiser conservative garbage collector for C/C++"
category: memory
homepage: "https://github.com/bdwgc/bdwgc"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Uses the release Autotools files without bootstrap; in-source configure/make"
    - "Disables CANCEL_SAFE and GC_HAVE_PTHREAD_EXIT on OHOS (musl lacks pthread_setcancelstate/pthread_cancel)"
    - "Fixes HMDFS umask 077 permission issue (E011) via umask 022"
  common_dependencies: []

versions:
  "8.2.12":
    status: built
    build_date: "2026-09-15"
    format: conan
    note: "Autotools recipe; libgc static by default; upstream make check + consumer GC_MALLOC/REALLOC/STRDUP checks"
