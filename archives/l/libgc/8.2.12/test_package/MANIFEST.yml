package: libgc/8.2.12
homepage: "https://github.com/bdwgc/bdwgc"

# Upstream DOES have a test suite: autotools `make check` (tests/tests.am +
# cord/tests). Base 7 tests + cordtest = 8; with default THREADS (+5) and
# CPLUSPLUS (+1 test_cpp) the configured total is >= 13. Exact count is read
# from test-suite.log at build time and emitted in HMBS_UPSTREAM_TEST_RESULT.
upstream_tests_exist: true
upstream_test_audit: "Audit of bdwgc v8.2.12 GitHub release tarball gc-8.2.12.tar.gz (sha256 42e5194ad06ab6ffb806c83eb99c03462b495d979cda782f3c72c08af833cd4e): tests/ holds test.c (gctest), leak_test.c, middle.c (middletest), smash_test.c, huge_test.c, realloc_test.c, staticrootstest.c + staticrootslib.c, thread_leak_test.c, threadkey_test.c, subthread_create.c, initsecondarythread.c, test_atomic_ops.c, test_cpp.cc, trace_test.c, disclaim_test.c/disclaim_bench.c/disclaim_weakmap_test.c; tests/tests.am registers TESTS += gctest/leaktest/middletest/smashtest/hugetest/realloc_test/staticrootstest (+ tracetest if KEEP_BACK_PTRS, + 5 thread tests if THREADS, + test_cpp if CPLUSPLUS, + 3 disclaim tests if ENABLE_DISCLAIM); cord/tests/cordtest.c registers cordtest. Entry: `make check` (automake test-driver, test-suite.log with # TOTAL/# PASS/# FAIL). Framework: autotools-make-check."

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (workdir=source root; parses test-suite.log TOTAL/PASS/FAIL/SKIP)"

upstream_tests:
  - file: tests/test.c
    source: gc-8.2.12/tests/test.c
    description: "Main GC functionality test (gctest)"
    command: "./gctest"
  - file: tests/leak_test.c
    source: gc-8.2.12/tests/leak_test.c
    description: "Leak detection test (leaktest)"
    command: "./leaktest"
  - file: tests/middle.c
    source: gc-8.2.12/tests/middle.c
    description: "Middle-size allocation test (middletest)"
    command: "./middletest"
  - file: tests/smash_test.c
    source: gc-8.2.12/tests/smash_test.c
    description: "Heap smash test (smashtest)"
    command: "./smashtest"
  - file: tests/huge_test.c
    source: gc-8.2.12/tests/huge_test.c
    description: "Huge allocation test (hugetest)"
    command: "./hugetest"
  - file: tests/realloc_test.c
    source: gc-8.2.12/tests/realloc_test.c
    description: "GC_REALLOC test (realloc_test)"
    command: "./realloc_test"
  - file: tests/staticrootstest.c
    source: gc-8.2.12/tests/staticrootstest.c
    description: "Static roots test (staticrootstest)"
    command: "./staticrootstest"
  - file: cord/tests/cordtest.c
    source: gc-8.2.12/cord/tests/cordtest.c
    description: "CORD string library test (cordtest)"
    command: "./cordtest"
  - file: tests/thread_leak_test.c
    source: gc-8.2.12/tests/thread_leak_test.c
    description: "Thread leak test (THREADS build)"
    command: "./threadleaktest"
  - file: tests/threadkey_test.c
    source: gc-8.2.12/tests/threadkey_test.c
    description: "Thread-local key test (THREADS build)"
    command: "./threadkey_test"
  - file: tests/test_cpp.cc
    source: gc-8.2.12/tests/test_cpp.cc
    description: "C++ API test (CPLUSPLUS build)"
    command: "./test_cpp"

test_package_tests:
  - file: test.c
    description: "Consumer test: 3 real checks — GC_MALLOC, GC_REALLOC preserves content, GC_STRDUP + GC_gcollect keeps reachable (R34)"
    command: "ctest --output-on-failure + ./test_libgc (parses CHECK n: PASS)"
    framework: ctest
    discovered: 3

assertion_count: 3
