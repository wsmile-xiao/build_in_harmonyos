package: libxi/1.8.3
homepage: https://gitlab.freedesktop.org/xorg/lib/libXi

upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  The release tree ships no test directory, no check_PROGRAMS/TESTS in any
  Makefile.am, and no test target; the upstream maintainers publish no
  self-test suite for libXi.

test_package_tests:
  - id: "public-api-surface"
    source: "api_surface.c"
    command: "libxi_api_surface"
    description: >-
      Force a live typed relocation for every one of the 79 public functions
      (40 XInput v1 + 39 XInput v2, including XI 2.4 gesture API) exported by
      libXi.so.6.
  - id: "version-and-abi-contract"
    source: "version_contract.c"
    command: "libxi_version_contract"
    description: >-
      Validate the XI2 event opcodes, the X Fixes protocol version consumed by
      the PointerBarrier typedef, and the XInput v1 device event selectors,
      then exercise public ABI types display-independently.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 107
