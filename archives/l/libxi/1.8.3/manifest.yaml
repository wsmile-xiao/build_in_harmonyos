issue: TBD

source:
  url: "https://xorg.freedesktop.org/archive/individual/lib/libXi-1.8.3.tar.xz"
  sha256: "7ad60056f01af4f786cfe93b3a7707447711626fc8da2637bec71a90409babe5"
  tar_format: tar.xz
  version_mapping: "Conan libxi/1.8.3 maps to upstream libXi 1.8.3 and libXi.so.6.1.0."

build:
  system: autotools
  configure_options:
    - "--disable-docs"
    - "--disable-specs"
    - "--without-xmlto"
    - "--without-fop"
    - "--without-xsltproc"
  dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0"
    - "xorgproto/2025.1"
  cc: clang
  cxx: clang++

patches_applied: []

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml, and test_package/MANIFEST.yml"
    - "L0 static gate checks passed (shell-env-in-run / hardcoded-remote / external-curl / settings / exports_sources / name-version / test-run)"
    - "official source sha256 verified locally"
    - "test_package exercises libXi ABI surface (api_surface.c) and XInput2 protocol constants / public types (version_contract.c), display-independent"
  remote:
    - "pending GitCode CI build_and_test.sh run on PR"
  pending:
    - "PR validation / GitCode CI / REL upload"

knowledge_gained:
  - "libXi 1.8.3 configure needs pkg-config modules x11, xext, xfixes (CFLAGS only) and xproto/xextproto/inputproto headers."
  - "libxfixes/6.0.2 is pinned to libx11/1.8.13 (Track A) and its libtool-shadow mechanism requires libX11.la, which the cmd-pkgs libx11/6.4.0 (Track B) does not ship; pulling it in would create a two-libx11 conflict."
  - "XFIXES_CFLAGS/XFIXES_LIBS are satisfied by writing a xfixes.pc stub and vendoring Xfixes.h (PointerBarrier typedef only) into the source include tree; neither is installed."
  - "libXi.so does not link libXfixes.so; XFIXES is compile-time only."
  - "xorgproto/2025.1 declares XI_2_Major 2 / XI_2_Minor 4, compatible with libXi 1.8.3 XInput2 2.4 gesture API."
