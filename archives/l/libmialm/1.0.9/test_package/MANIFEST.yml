package: libmialm/1.0.9
homepage: "https://sourceforge.net/projects/mia/files/mialm/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "cd test && make check -j1"

upstream_tests:
  - file: test/checklmio.c
    source: mialm-1.0.9/test/checklmio.c
    description: "上游向量、相机、地标列表及 XML 往返测试，共 18 个断言/守卫"
    command: "cd test && make check -j1"

test_package_tests:
  - file: libmialm_api_test.c
    description: "安装后消费者视角的向量、四元数、相机、地标与 XML 往返测试，共 31 个检查"
    command: "ctest -R '^libmialm_api_test$' --output-on-failure"
  - file: libmialm_ohos_test.c
    description: "HarmonyOS PC 的系统名、aarch64 架构与公共 API 联动测试，共 4 个检查"
    command: "ctest -R '^libmialm_ohos_test$' --output-on-failure"

assertion_count: 35
