software: libmialm
version: "1.0.9"
status: built
build_date: "2026-09-23"
conan_ref: "libmialm/1.0.9"
build_system: autotools

source:
  url: "https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/libmialm/1.0.9-3/libmialm_1.0.9.orig.tar.xz"
  sha256: "3e9e8996e586fb1ba807f9a29bd7b56a7ee0813eca2a6aeb78118da86cf7a9f0"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-gtk-doc"
  dependencies:
    - "glib/2.88.3.1"
    - "libxml2/2.15.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

test_results:
  upstream:
    logical_cases: 18
    passed: 18
    failed: 0
    command: "cd test && make check -j1"
  test_package:
    logical_cases: 35
    passed: 35
    failed: 0
    ctest_targets_passed: 2
    ctest_targets_failed: 0
  total:
    logical_cases: 53
    passed: 53
    failed: 0
  device_validation: "HarmonyOS PC aarch64 Conan create and installed-package consumer tests passed"

patch_classification:
  - file: "0001-config.guess.patch"
    type: portability
    platform_only: true
    guard: "HarmonyOS uname"
  - file: "0002-config.sub.patch"
    type: portability
    platform_only: true
    guard: "linux-ohos triplet"

knowledge_gained:
  - "上游 2015 年版 config.guess 无法识别 HarmonyOS；根据 uname 映射为 aarch64-unknown-linux-ohos"
  - "config.sub 的内核-系统组合列表和有效系统列表都必须接受 linux-ohos 三元组"
  - "HarmonyOS PC 文件系统不支持 GNU make jobserver FIFO，构建、测试与安装均使用 -j1"
  - "Autoconf config.status 的私有临时目录在 HarmonyOS PC 文件系统上不可写，使用配方预建工作目录承载生成文件"
  - "上游源文件使用 <mialm/...> 根目录头路径，Conan 的 VPATH 构建需将源码根目录加入 CFLAGS"
  - "gtk-doc 仅用于发布文档且旧 Makefile 无条件调用缺失工具；构建 mialm 子目录并保留 test/check 上游测试"
  - "公共头直接暴露 GObject/libxml2 API；包目标显式传播对应链接库并保留 Conan requires 的头文件与运行环境闭包"
