software: libzen
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.4.41/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.4.41"

# 编译状态
# published | built | failed | archived
# 2026-09-27 修正: 原值 published 失实（制品仓 ohpcd 实测无此配方,
# conan search "libzen*" 0 匹配; 历史记录是设备端手工 cmake 编译,
# 非 conan 发布）。2026-09-27 补齐 conan 配方, 本地 conan create 通过。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（上游官方 GitHub tag, 与 mediaarea.net 发布包内容等价,
  # 逐文件 sha 实测一致; mediaarea.net 直链 CI Worker 不可达）
  url: "https://github.com/MediaArea/ZenLib/archive/refs/tags/v0.4.41.tar.gz"

  # 源码校验和
  sha256: "45d5173fa0278f5264daa6836ae297aa303984482227d00b35c4f03929494c8f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 构建入口（tarball 顶层无 CMakeLists.txt, 构建脚本在 Project/CMake）
  build_script_folder: "Project/CMake"

  # 关键 cmake 变量
  cmake_variables:
    - "BUILD_SHARED_LIBS=OFF"
    - "CMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "ENABLE_UNICODE=ON"
    - "LARGE_FILES=ON"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5"   # CMake>=4 与上游 min 3.1.0 的兼容下限

  # 编译依赖列表（格式: name/version）
  # 无第三方依赖（仅 pthread 系统库, CMake find_package(Threads)）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-Source-ZenLib-Thread.cpp.patch"

patch_generation:
  # 2026-09-27 重新生成: 原 603 行 /dev/null 整文件补丁（diff -ruN）
  # 对 conan patch_ng 有 /dev/null 新文件约定风险, 替换为最小 unified-diff
  # hunk。CRLF 行尾与上游 Thread.cpp 源一致（实测 CRLF 是唯一同时通过
  # conan patch_ng 与 git apply 的变体）。
  method: manual-minimal-hunk
  source_ref: "github.com/MediaArea/ZenLib v0.4.41 (Thread.cpp, CRLF)"
  verified: "patch_ng apply=True (byte-exact) + git apply --check exit=0"
  generated_at: '2026-09-27'
  patches_count: 1

patch_classification:
  - file: 0001-Source-ZenLib-Thread.cpp.patch
    type: portability
    platform_only: True
    # pthread_cancel 声明为 weak 弱符号 + 调用前判空（libc 探针, R8 合法例外）。
    # 有该符号的 POSIX libc 绑定真函数、保持上游语义; OHOS 等无符号 libc 上
    # 解析为 NULL、跳过调用。不引入任何平台条件编译宏（PF5 豁免场景说明）。
    guard: 'weak-symbol libc probe (no platform macro)'

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "OHOS musl libpthread 无 pthread_cancel 符号（nm -D + 交叉链接探针实证）; 用 weak 弱符号声明 + 调用前判空的 libc 探针适配（R8 合法例外）, 有符号 libc 保持上游取消语义, 无符号 libc 退化为仅置状态位（协作式终止经 RequestTerminate）"
  - "上游 tarball 顶层无 CMakeLists, 构建入口在 Project/CMake, 需 build_script_folder"
  - "上游 Source/Example/ZenLib_Test.cpp 是 demo 非测试框架（未被任何构建纳入, 末尾 system(\"PAUSE\") 交互）, test_package 自研功能断言"
  - "R8: patches/ 补丁默认禁平台条件编译宏, 弱符号/符号探测等 libc 探针属合法例外, 须在 PR/notes 说明"
