package: libzen/0.4.41
homepage: "https://mediaarea.net/en/ZenLib"

# Upstream ZenLib ships no test framework: no add_test()/ctest anywhere
# (Project/CMake, Project/GNU, .appveyor.yml). The only "test" file
# Source/Example/ZenLib_Test.cpp is a 47-line demo not referenced by any
# upstream build system, and it ends with an interactive system("PAUSE")
# (Windows console wait) which would hang a non-interactive OHOS CI
# shell. No upstream test is therefore runnable; the test_package below
# provides consumer-side functional assertions over the core public APIs
# instead (documented per R51, not silently skipped).
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.cpp
    description: >-
      Consumer functional test: Ztring default/empty, From_Unicode/To_Unicode
      round-trip, From_Local/To_Local round-trip, UTF-8 (CJK) round-trip,
      UTF-8 size() in characters, From_Number(int64u)/To_Local, operator+=,
      operator=, ZtringListList parse size / Read(1,1) / Read(0),
      File::Exists (true/false), FileName::Extension_Get,
      Thread::Run==Ok, worker progress before ForceTerminate,
      Thread::ForceTerminate==Ok, IsExited after ForceTerminate,
      RequestTerminate==IsNotRunning after ForceTerminate, worker keeps
      advancing on OHOS (no-op ForceTerminate), cooperative exit via
      RequestTerminate (Run==Ok / RequestTerminate==Ok / IsExited)
    command: "./libzen_test <writable-tmpdir>"

assertion_count: 23
