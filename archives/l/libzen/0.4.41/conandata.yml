# conandata.yml - libzen 0.4.41
#
# 源码源: 上游官方 GitHub tag v0.4.41 (MediaArea/ZenLib)。
# 与 mediaarea.net 官方发布包内容等价 (逐文件 sha 实测一致:
# 0.4.41 tarball 内 Thread.cpp 两源 sha 均为 532bfebd...);
# mediaarea.net 直链在 CI Worker 上不可达 (libmediainfo/25.07 已实测),
# GitHub 走 CI 镜像 fallback。
sources:
  url: "https://github.com/MediaArea/ZenLib/archive/refs/tags/v0.4.41.tar.gz"
  sha256: "45d5173fa0278f5264daa6836ae297aa303984482227d00b35c4f03929494c8f"

patches:
  # Thread::ForceTerminate() 调用 pthread_cancel, OHOS musl 的 libpthread
  # 无此符号 (实测 nm -D 无符号, 交叉链接 undefined symbol)。
  # 补丁将 pthread_cancel 声明为 weak 弱符号并在调用前判空 (libc 探针,
  # 符合 R8 例外): 有该符号的 POSIX libc 仍绑定真函数、保持上游取消语义;
  # OHOS 等无此符号的 libc 上符号解析为 NULL、跳过调用 (协作式终止仍可
  # 通过 RequestTerminate() 完成)。不引入任何平台条件编译宏。
  # 补丁文件为 CRLF 行尾 (与上游 Thread.cpp 源行尾一致), 经 conan
  # patch_ng (strip=1) 与 git apply 双重验证可应用。
  - patch_file: "patches/0001-Source-ZenLib-Thread.cpp.patch"
    patch_description: "probe pthread_cancel via weak symbol so ForceTerminate links on libcs without it (e.g. OHOS musl)"
    patch_type: "portability"
    strip: 1
