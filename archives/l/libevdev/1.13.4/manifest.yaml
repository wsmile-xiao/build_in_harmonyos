# 版本级 manifest — libevdev 1.13.4
# 遵循 ARCHIVE-SPEC v2.0

version: "1.13.4"
software: libevdev

# 编译状态
# published | built | failed | archived
status: published

build_date: "2026-09-28"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # Debian 源包 orig(bookworm);补丁上下文基于该树生成并实测
  # git apply 干净应用,故以 Debian orig 为源(URL 与 sha256 实测)。
  url: "https://deb.debian.org/debian/pool/main/libe/libevdev/libevdev_1.13.4+dfsg.orig.tar.xz"
  upstream_url: "https://gitlab.freedesktop.org/libevdev/libevdev/-/tags/libevdev-1.13.4"
  sha256: "be3456ab8289e53c9f13b6dfef10349b4f551f5d365cb58b7dd29d42488cd897"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson

  configure_options:
    - "-Ddefault_library=shared"
    - "-Dtests=disabled"
    - "-Ddocumentation=disabled"
    - "-Dtools=enabled"

  # 编译依赖(格式: name/version)
  dependencies: []
  # Linux 内核 UAPI 头(input.h / input-event-codes.h)来自 OHOS SDK sysroot

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-meson-make-librt-libm-optional.patch"
  # meson.build: cc.find_library('m'/'rt') → required:false。
  # musl 无独立 librt.so,libm 并入 libc;库本体不引用 librt 符号,
  # 查找失败不影响链接(glibc 行为不变:找得到就照样链)。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "meson 的 cc.find_library() 对缺失库默认直接报错;面向 musl 的包应 required:false——OHOS PC 的 musl libc 无 librt,libm 已并入 libc"
  - "构建要点与 main 上 1.13.7 配方一致:harmonyos 平台头软链(meson host_machine.system() 映射)、AR/RANLIB 注入(llvm-ar/llvm-ranlib)、TMPDIR(E002 /tmp 只读)"
  - "Debian +dfsg repack 只动了 doc/style 的远端资源引用(有对应 debian 补丁),对构建无影响;meson.build 与上游 release 一致"
