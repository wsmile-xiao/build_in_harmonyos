# gitlab archive 略有差异:本补丁上下文基于 Debian orig 树生成并
# 实测可干净应用,故 URL/sha256 以 Debian orig 为准)。

sources:
  "1.13.4":
    url: "https://deb.debian.org/debian/pool/main/libe/libevdev/libevdev_1.13.4+dfsg.orig.tar.xz"
    sha256: "be3456ab8289e53c9f13b6dfef10349b4f551f5d365cb58b7dd29d42488cd897"
    tar_format: tar.xz

patches:
  "1.13.4":
    - patch_file: "patches/0001-meson-make-librt-libm-optional.patch"
      patch_description: >-
        musl(OHOS PC)无独立 librt.so,libm 并入 libc;meson.build 里
        cc.find_library('m'/'rt') 改为 required:false。库本体不引用
        librt 符号(clock_gettime 仅测试代码使用,musl 与
        glibc>=2.17 均由 libc 提供),查找失败不影响链接。
      patch_type: "portability"
