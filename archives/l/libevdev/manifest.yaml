software: libevdev
name: Event Device Library
description: Library for handling evdev input devices
category: input
license: MIT
website: https://www.freedesktop.org/

versions:
  - version: "1.13.3"
    status: published
    compiled_at: 2026-05-30
    notes: |
      - 输入设备处理库
      - libinput 的依赖
      - 使用 meson 构建，需要设置 TMPDIR
    dependencies:
      - kernel headers (input.h)
    provides:
      - libevdev.so
  - version: "1.13.7"
    status: built
    compiled_at: 2026-09-04
    notes: |
      - 输入设备处理库（1.13.3 的维护升级版）
      - meson 构建，构建要点同 1.13.3（harmonyos 头文件软链、AR/RANLIB、TMPDIR）
    dependencies:
      - kernel headers (input.h)
    provides:
      - libevdev.so
  - version: "1.13.4"
    status: published
    compiled_at: 2026-09-28
    notes: |
      - 积分赛依赖任务提交(1.13.3 的同族维护版本,Debian bookworm 源包版本)
      - meson 构建,构建要点同 1.13.7(harmonyos 头软链、AR/RANLIB、TMPDIR)
      - 唯一补丁:meson cc.find_library('m'/'rt') required:false(musl 无独立 librt)
    dependencies:
      - kernel headers (input.h)
