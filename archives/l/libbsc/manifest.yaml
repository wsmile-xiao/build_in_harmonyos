software: libbsc
display: "libbsc"
description: "High performance block-sorting data compression library (BWT-based) with bsc CLI"
category: compress
homepage: "https://github.com/IlyaGrebnov/libbsc"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游原生支持 AArch64（__aarch64__ → LIBBSC_CPU_FEATURE_A64），x86 cpuid asm 完全编译排除，无源码补丁（路径 A）"
    - "BSC_ENABLE_NATIVE_COMPILATION=OFF：禁用 -march=native，避免宿主 CPU 特定指令 (E100)"
    - "BSC_ENABLE_OPENMP=OFF：OHOS SDK 无 libomp，单线程模式默认交付"
    - "DT_SONAME 经工具链变量注入（E322/libharu 模式），无需补丁"
    - "上游无自动化测试，官方验证为 README 手工 CLI round-trip；test_package 提供库 API + CLI + OHOS 专项完整覆盖"
  common_dependencies: []

versions:
  "3.3.12":
    status: built
    build_date: "2026-09-17"
