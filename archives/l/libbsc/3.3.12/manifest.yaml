version: "3.3.12"
software: "libbsc"
status: built
build_date: "2026-09-17"
build_system: "cmake"

source:
  url: "https://github.com/IlyaGrebnov/libbsc/releases/download/3.3.12/libbsc-3.3.12.tar.gz"
  sha256: "3d8eee9351468bdd3fb3bc28dda0e24cfc0332997eb0210ea7bd548d77c3d194"
  tar_format: tar.gz

build:
  system: cmake
  cmake_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBSC_ENABLE_NATIVE_COMPILATION=OFF"
    - "-DBSC_ENABLE_OPENMP=OFF"
    - "-DBSC_ENABLE_CUDA=OFF"
    - "-DBSC_BUILD_SHARED_LIB=ON"
  cc: clang

patches_applied: []

knowledge_gained:
  - "上游原生支持 AArch64：platform.h 将 __aarch64__ 映射到 LIBBSC_CPU_FEATURE_A64，x86 cpuid/xgetbv asm 由 #if LIBBSC_CPU_FEATURE >= SSE2 守卫（A64=1 < SSE2=2）完全排除，无需源码补丁（路径 A）"
  - "BSC_ENABLE_OPENMP=OFF：OHOS SDK 不带 libomp（native/llvm/lib 无 libomp*），单线程模式在设备上 round-trip 实测通过"
  - "CMakeLists 无 SOVERSION：借 E322/libharu 工具链变量（CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG + CMAKE_PLATFORM_NO_VERSIONED_SONAME）注入 DT_SONAME，无需补丁"
  - "上游无任何测试目标（无 enable_testing/add_test），bsc CLI round-trip 即上游 README 的官方验证方式；已加入 ci/config/no_official_test.txt 白名单（附依据）"
  - "上游 install 规则：headers→include/libbsc、lib→lib、bsc CLI→bin，布局规范无需调整"
