# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libbsc/3.3.12
homepage: https://github.com/IlyaGrebnov/libbsc

# 上游测试命令：libbsc 上游无任何自动化测试（CMakeLists.txt 无 enable_testing/add_test，
# 无 tests/ 目录，无 ctest 目标）。上游 README 的官方验证方式是手工 CLI round-trip：
#   bsc e input.txt input.bsc && bsc d input.bsc output.txt
# 该边界已记入 ci/config/no_official_test.txt（libbsc 条目）。
upstream_check_command: "grep -c 'add_test\\|enable_testing' CMakeLists.txt  # -> 0"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []  # 上游无自动化测试；官方验证 = README 手工 CLI round-trip

# test_package 中自带的测试 (消费者视角验证，替代上游测试覆盖)
test_package_tests:
  - file: test_package.cpp
    description: "库 API round-trip：bsc_init → bsc_compress → bsc_decompress → memcmp 字节级一致（synthetic ~64KiB + /etc/profile 真实文件两个语料）"
    command: "./test_package"
  - file: ohos_checks.py
    description: "HarmonyOS 专项：ELF64 AArch64 头、DT_SONAME 存在、.so 无宿主路径泄漏、CLI bsc e/bsc d 真实 round-trip 字节级一致（非 --help）"
    command: "python3 ohos_checks.py"

# 测试断言总数 (近似值, 用于质量评估)
# test_package.cpp: 版本宏1 + bsc_init 1 + 2语料×5(size/compress/decompress/memcmp/…)
# ohos_checks.py: ELF64 + AArch64 + DYN + SONAME + 无宿主路径 + CLI round-trip
assertion_count: 21
