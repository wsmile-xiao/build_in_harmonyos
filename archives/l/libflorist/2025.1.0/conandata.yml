# conandata.yml — libflorist 2025.1.0
#
# 官方源：AdaCore/florist（FLORIST，IEEE 1003.5 POSIX Ada 绑定）。
# 上游不发布 GitHub Release，也只有一个 tag（v22.0.0），2025.1.0 无对应 tag，
# 因此固定到 25.1 发布分支的提交快照（R39：官方源 + 不可变引用）。
#
# 版本对应关系（已实测取证，见 notes.md「源码来源取证」）：
#   提交 d28d09a618e9439e58ebc0368d100fe3b2992697 = 25.1 分支 tip
#                                                = 25.2 分支 tip（同一提交）
#   Debian 归一化版本 2025.1.0（libflorist_2025.1.0.orig.tar.gz）
#   与该提交快照逐文件比对仅差 2 个打包附带文件（.gitreview / configure.in），
#   即源码本体一致 → 2025.1.0 ≡ 官方 25.1。
sources:
  # NOTE: 保持单一官方 URL、不带任何镜像前缀。CI 预下载步骤会自行把它
  # 改写为 gh-proxy.com 前缀的列表供其运行使用；该状态**绝不能提交**
  # （R39 / PF7 拒绝镜像主机，且手写多 URL 列表会使 CI 的镜像注入失效）。
  url: "https://github.com/AdaCore/florist/archive/d28d09a618e9439e58ebc0368d100fe3b2992697.tar.gz"
  sha256: "267efe8a3fd63eb1dcdebaec1cc10fad678c11bd5beb7056e81541b2ff38f387"

patches:
  - patch_file: "patches/0001-musl-signal-range.patch"
    patch_description: >-
      c-posix.c / c-posix-signals.c 的 sigismember() 越界守卫假定 glibc 语义
      （越界返回 -1）。OHOS 使用 musl，越界返回 0，导致 first_bad 保持 -1，
      两处守卫都误判信号区间无效并向下取整，最终生成
      `NSIGS : constant := -2` 与越界空数组，使 posix-signals.ads 成为
      非法 Ada（dynamic or empty choice in aggregate）。改为仅在
      first_bad 有效（>= 0）时才收紧上界。
    patch_type: "portability"
