# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: libflorist/2025.1.0
homepage: "https://github.com/AdaCore/florist"

# ── R51 上游测试三步法 · 第 1 步：清点 ───────────────────────────────
# 清点对象：源码包 tests/ 目录（POSIX.5b VALIDATION TEST SUITE，IEEE 1003.5b）
# 清点证据：
#   $ grep -cE '^ [a-z0-9_]+\\?$' <(sed -n '/^TESTS =/,/^$/p' tests/Makefile)
#   → TESTS = 44
#   $ grep -cE '^ [a-z0-9_]+\\?$' <(sed -n '/^SPECIAL_TESTS=/,/^$/p' tests/Makefile)
#   → SPECIAL_TESTS = 17
# 两个清单交集为 0，并集 = 61 个测试程序（唯一测试入口总数）。
#   $ find tests -name '*.adb' | wc -l        → 79（含测试支撑单元：
#     posix_report.adb / test_parameters.adb / renumber.adb 及 sockets、xti 子目录）
upstream_test_inventory_count: 61
upstream_test_inventory_note: >-
  TESTS(44) ∪ SPECIAL_TESTS(17) = 61，取自上游 tests/Makefile；交集为 0。
  该 61 为“测试入口总数”上界，不把未执行入口计为 PASS。

# 上游测试驱动方式
upstream_check_command: "cd tests && make -f Makefile $(TESTS) $(SPECIAL_TESTS)"
upstream_test_in_build: true
upstream_test_command: "python3 tools/run_upstream_tests.py --tests-dir tests --run-dir tests/test.dir"

# ── 上游测试运行器说明 ───────────────────────────────────────────────
upstream_test_runner: >-
  配方 build() 内先运行 `make -f Makefile $(TESTS) $(SPECIAL_TESTS)` 编译全部测试，
  再由 tools/run_upstream_tests.py 逐项运行：每项先签名（OHOS 拒绝未签名 ELF）、
  stderr 与 stdin 挂 PTY 并设 TIOCSWINSZ（tests/README 要求标准错误必须是终端，
  重定向到文件会制造假失败）、每项独立超时；结果表写入
  <build>/build-release/upstream-results.txt。
  未采用上游自带的 tests/run_tests_1：它既不签名也不提供 PTY。
  但**复现了它的运行目录布局**（test.dir 内 `ln -fs ../<name>` 与 `bin -> ..`）与
  逐项环境（PATH 含 tests 目录、PWD、HOME、TMPDIR、LC_ALL=C、TZ=UTC、逐项 umask）。
upstream_test_notes: >-
  OHOS 沙箱下部分用例依赖未实现的 POSIX 可选服务或存在信号/内存语义差异，
  其失败原因在 notes.md「R51 上游测试三步法」与「评审意见响应」逐项列明。
  凡属"非系统限制"的失败项必须修复，不作整体豁免（响应评审意见）。

# ── R51 第 3 步：本次实测回填（禁占位符） ─────────────────────────────
# 复审轮 2026-09-29。驱动脚本修正后重跑：修正项见 upstream_test_runner。
upstream_test_census:
  inventory_total: 61
  helper_children: 8            # p030100b p030101b p030301b p030306a p120502a
                                # p150100b p990040b p990050b（父用例的子程序，
                                # 上游 run_tests_1 仅 ln -fs、从不独立运行）
  not_linked: 1                 # p030300a（不产出独立可执行文件）
  executed_total: 52
  passed: 17
  not_applicable: 10
  assertion_failed: 19
  other: 6                      # timeout 4 + crash 2
  timeout: 4
  crash: 2
  execution_pass_rate: "17/52 (32.7%)"
  adjusted_pass_rate: "17/42 (40.5%)"
  previous_round:
    executed_total: 60
    passed: 14
    assertion_failed: 33
    other: 3
    execution_pass_rate: "14/60 (23.3%)"
  fixed_this_round:             # 非系统限制项已修复（FAIL → PASS）
    - "p030100 (driver: test.dir symlink layout + PATH)"
    - "p030101 (driver: helper symlink)"
    - "p030102 (driver: helper symlink for bare-name exec)"
    - "p120502 (driver: helper symlink for bare-name exec)"
  remaining_non_system_limited: # 仍待修，本轮不豁免
    - "p030301 p030304 p030306 (signal mask / timing)"
    - "p050200 p050300 p060100 (terminal characteristics / umask)"
    - "p070200 (ioctl error-code mapping)"
    - "p110100 (thread scheduling semantics)"
    - "p120500 (test prerequisite file state)"
    - "p020400 (unlocated)"
  note: >-
    NOT_APPLICABLE 为上游自行判定（打印 "Test Not Applicable" + "Nonsupport of
    PRIORITY_PROCESS_SCHEDULING_OPTION detected."），不计为失败。
    口径自洽：17 + 19 + 6 + 10 = 52 = executed；61 = 52 + helper 8 + not_linked 1。

upstream_tests:
  - file: tests/p021000.adb
    source: florist/tests/p021000.adb
    description: "POSIX.5b 基础接口校验（Process Identification）"
    command: "./p021000 -t"
  - file: tests/p030100.adb
    source: florist/tests/p030100.adb
    description: "POSIX.5b 校验测试，含 p030100b 辅助单元"
    command: "./p030100 -t"
  - file: tests/p990010.adb
    source: florist/tests/p990010.adb
    description: "SPECIAL_TESTS 组（需单独运行，不经 run_tests_1）"
    command: "./p990010 -t"

# ── test_package：消费者视角验证 ─────────────────────────────────────
test_package_tests:
  - file: src/florist_consumer.adb
    description: >-
      真实调用 Florist 绑定 API 的消费者程序：Get_Process_ID/Image、
      Is_Environment_Variable、Environment_Value_Of、Is_Directory，
      并链接打包产出的 libflorist.a
    command: "./florist_consumer"

# ── 断言计数 ─────────────────────────────────────────────────────────
# 由 test_package/src/florist_consumer.adb 中的 5 个 Check 调用构成。
assertion_count: 5
