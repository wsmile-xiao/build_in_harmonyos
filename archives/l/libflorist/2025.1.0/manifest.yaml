knowledge_ref:
  - "musl 的 sigismember() 对越界信号返回 0（glibc 返回 -1）—— L1 平台真理"
  - "动态链接的 gcc-ada 二进制在 OHOS 上首次 stdio stderr 访问即段错误 —— L1 平台真理"
  - "HMDFS 下 umask 077 建出的目录不可写（ACL 覆盖 chmod）—— L1 平台真理"
  - "OHOS 拒绝执行未签名 ELF（conftest/生成器均需签名）—— L1 平台真理"
  - "gcc-ada 缺 gprbuild/gprinstall/gnatprep 时 Ada 库的构建范式 —— L2 模式经验"
