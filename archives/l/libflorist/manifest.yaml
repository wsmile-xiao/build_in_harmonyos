software: "libflorist"
display: "FLORIST (POSIX.5 Ada bindings)"
description: >-
  IEEE STD 1003.5 (POSIX.5), 1003.5b 及部分 1003.5c 的 Ada 绑定实现，
  使 Ada 程序可直接调用 POSIX 操作系统服务。
homepage: "https://github.com/AdaCore/florist"
license: "GPL-2.0-or-later WITH GCC-exception-2.0"
category: "development/library"
build_system: "autotools"

ohos_adaptation:
  toolchain: "gcc-ada/9.5.0 (GNAT) + binutils/2.46.0（均仅 OHOS/armv8）"
  native_only: true
  static_only: true
  key_points:
    - "ohpcd 无 gprbuild/gprinstall/gnatprep：库改用 gnatmake 直编 + 显式安装布局，并内置最小 gnatprep 替身"
    - "两个 C 生成器必须 -static 链接（动态链接的 gcc-ada 二进制在 stdio stderr 上段错误）"
    - "musl 的 sigismember() 越界返回 0（glibc 为 -1），需补丁修正信号区间推导（否则生成 NSIGS := -2）"
    - "configure/config.status 以 umask 077 建临时目录，HMDFS 下不可写，需 mktemp 垫片"
    - "Ada 运行库为静态非 PIC，只能产出静态库"

versions:
  - version: "2025.1.0"
    conan_ref: "libflorist/2025.1.0"
    status: built
    date: "2026-09-27"
