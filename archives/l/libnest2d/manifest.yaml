software: libnest2d
display: "libnest2d"
description: "2D irregular bin packaging and nesting library (header-only framework with Clipper backend)"
category: library
homepage: "https://github.com/Ultimaker/libnest2d"
license: LGPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "header-only by default, vendored Clipper 6.4.2 fallback when system polyclipping not found"
    - "Boost.Geometry header-only mode to avoid compiled boost deps on HMDFS"
    - "OHOS CMake requires CMAKE_SYSTEM_NAME=Linux"
    - "Optimizer optimlib + armadillo/12.8.4 (nlopt unpublished)"
  common_dependencies:
    - "boost/1.85.0"
    - "armadillo/12.8.4"

versions:
  "5.0.0":
    status: built
    build_date: "2026-09-15"
    upstream_test_total: 1
    upstream_test_count_method: ctest_entries
