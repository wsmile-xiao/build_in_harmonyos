# test_package/MANIFEST.yml
# 上游官方测试声明文件 — libnest2d 5.0.0

package: libnest2d/5.0.0
homepage: "https://github.com/Ultimaker/libnest2d"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游测试总数声明（rule4 门禁：必须与实测 discovered 一致，gtest_macros 口径：tests/test.cpp 中 19 个 TEST_CASE）
upstream_test_total: 19
upstream_test_count_method: gtest_macros

upstream_tests:
  - file: tests/test.cpp
    source: libnest2d-5.0.0/tests/test.cpp
    description: "Catch2 unit tests (Geometry + Nesting, 19 TEST_CASE)"
    command: "./tests/tests_clipper_nlopt --use-colour no"

test_package_tests:
  - file: test.cpp
    description: "消费者测试：真实调用 libnest2d::nest() 对 Rectangle 装箱并断言 bins>0"
    command: "./test_libnest2d"

assertion_count: 19
