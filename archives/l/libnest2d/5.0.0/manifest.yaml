# 版本级 manifest — libnest2d 5.0.0
version: "5.0.0"
software: "libnest2d"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"
build_system: cmake

# 上游测试统计（rule4 证据门禁：声明总数与实测口径一致）
upstream_test_total: 19
upstream_test_count_method: gtest_macros

# ============================================================
# 源码信息
# ============================================================

source:
  url:
    - "https://gh-proxy.com/https://github.com/Ultimaker/libnest2d/archive/refs/tags/5.0.0.tar.gz"
    - "https://github.com/Ultimaker/libnest2d/archive/refs/tags/5.0.0.tar.gz"
  sha256: "61F15E716C0634024F31D2DDA1F5F65F8429CE4DA05FFF80FD1A59DE6DFBDDE5"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DLIBNEST2D_HEADER_ONLY=ON"
    - "-DLIBNEST2D_GEOMETRIES=clipper"
    - "-DLIBNEST2D_OPTIMIZER=optimlib"
    - "-DLIBNEST2D_THREADING=std"
    - "-DLIBNEST2D_BUILD_UNITTESTS=ON"
  dependencies:
    - "boost/1.85.0"
    - "armadillo/12.8.4"
  test_requires:
    - "catch2/2.13.10"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-vendored-clipper-fallback.patch"
  - "0002-optimlib-export-target.patch"
  - "0003-optimlib-subplex-fallback.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libnest2d 5.0.0 为 header-only 框架，默认 clipper 后端需 polyclipping 6.4.2，ohpcd 无该包，改用 vendored fallback（pyclipper 1.3.0.post3 捆绑的 6.4.2）"
  - "优化器默认 nlopt (2.7) 在 ohpcd 缺失，改用 optimlib + armadillo/12.8.4（OHOS 已发布，含 openblas 依赖）"
  - "OHOS CMake 需显式设 CMAKE_SYSTEM_NAME=Linux 规避 System is unknown to cmake"
