knowledge_gained:
  - "chartype.h wchar_t 检查：OHOS 未定义 __STDC_ISO_10646__，通过 -D__STDC_ISO_10646__ CFLAGS 避免 #error (替代原 0010 补丁)"
  - "termcap 声明：OHOS ncurses 库有 tgetent/tgoto/tputs 等函数但 headers 未声明；使用 feature-based 检测 (HAVE_NCURSES_H && !HAVE_TERMCAP_H)"
  - "E011/HMDFS: autotools config.status 使用 umask 077 创建临时目录，HMDFS 上 mode 0700 目录无法写入；需改为 umask 022 或预创建可写目录"
  - "E011/HMDFS: /tmp 是 erofs 只读文件系统，autotools configure 需设置 TMPDIR 到可写目录（如 $HOME/.conan2/tmp）"
  - "ncursesw 链接：OHOS 系统 ncurses 为 libncursesw.a（宽字符版），需创建 libncurses.a -> libncursesw.a 符号链接以供 AC_CHECK_LIB(ncurses) 检测"
  - "libedit 版本号使用日期格式 (YYYYMMDD)，源码取自 libedit-20240808-3.1.tar.gz"
  - "config.guess/sub 需要添加 OHOS 系统检测 (aarch64-unknown-linux-ohos)"
  - "上游无自动化测试用例，test_package 补充了 API smoke test (4/4 PASS)"
  - "17 个补丁中仅 3 个（config.guess, config.sub, sys.h）匹配源码包实际文件；其余补丁目标文件为生成文件或新文件，不适用"
