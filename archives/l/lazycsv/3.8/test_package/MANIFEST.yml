# test_package/MANIFEST.yml
# 上游官方测试声明文件（lazycsv 3.8）
# lazycsv 使用 doctest 框架（test/doctest/doctest.h 为框架头，不计独立用例），
# 用户测试源 test/main.cpp 含 14 个独立 TEST_CASE，构建为单个可执行 main，
# ctest 注册 1 条 add_test(main main)，测试输入由 POST_BUILD 拷贝到构建目录。

package: lazycsv/3.8
homepage: "https://github.com/ashtum/lazycsv"

# 上游测试命令（CMake 构建，main 可执行）
upstream_check_command: "cmake -S . -B build-ohos -DBUILD_TESTING=ON && cmake --build build-ohos -j4 && (cd build-ohos && ctest --output-on-failure)"

# conanfile.py build() 中未集成上游测试（配方关闭 BUILD_TESTING，测试在适配阶段独立验证）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（14 个独立 TEST_CASE，全部通过）
upstream_tests:
  - file: test/main.cpp
    source: lazycsv-6c36a9d/test/main.cpp
    description: "lazycsv doctest 单元测试（14 个独立 TEST_CASE：mmap_source 3 + 字符串源解析 11，含空单元格/空行/末行换行/不同列数/trim/自定义分隔符/引号/CRLF）"
    command: "./main"

# test_package 中自带的测试（消费者视角验证，调用 lazycsv 公开 C++ API）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：公开头 <lazycsv.hpp> + parser/header()/cells()/raw()/trimmed()/index_of()，编译链接并运行，校验 2 行数据解析"
    command: "./test_lazycsv"

# 测试断言总数（上游 14 顶层用例 + 消费者测试 6 项检查）
assertion_count: 20
