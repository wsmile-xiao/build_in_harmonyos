  configure_options:
    - "-DBUILD_TESTING=OFF"
    - "-DCMAKE_TOOLCHAIN_FILE=ohos.toolchain.cmake"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 版本语义说明（任务版本 vs 上游）
