# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libmicrodns/0.2.0
homepage: "https://github.com/videolabs/libmicrodns"

# 上游测试命令 (meson test)
upstream_check_command: "meson test"

# conanfile.py build() 方法中已集成上游测试（cross_building() 时自动跳过）
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序（libmicrodns 0.2.0 提供 1 个 meson test 可执行文件，
# 纯 assert 实现，无外部测试框架依赖）
upstream_tests:
  - file: tests/unittests.c
    source: libmicrodns-0.2.0/tests/unittests.c
    description: "上游单元测试：mdns_parse 解析 mDNS PTR 应答报文，校验 header 计数/flags 与 entry 名称"
    command: "meson test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libmicrodns.c
    description: "消费者测试：mdns_strerror 错误串转换（未知码/MDNS_STDERR/零长度缓冲）、公开协议常量（MDNS_PORT/地址/rr_type RFC 值）、rr_entry 链构建与 mdns_entries_print 冒烟"
    command: "./test_libmicrodns"

# 测试断言总数
assertion_count: 8
