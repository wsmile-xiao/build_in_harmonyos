# 版本级 manifest — libmicrodns 0.2.0
version: "0.2.0"
software: libmicrodns
build_date: "2026-09-27"
status: built
build_system: meson

source:
  url: "https://github.com/videolabs/libmicrodns/archive/refs/tags/0.2.0.tar.gz"
  sha256: "9864a088ffef4d4255d5abf63c6f603d1dc343dfec2809ff0c3f1624045b80fa"
  tar_format: tar.gz
  checksum_provenance: "official videolabs GitHub tag archive (refs/tags/0.2.0); SHA-256 computed locally on download"

build:
  system: meson
  configure_options:
    - "-Dtests=enabled"
    - "-Dexamples=disabled"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
  - "OHOS 适配版 conan 将 os=OHOS 映射为 meson system 'harmonyos'；上游 meson.build 仅特判 Windows，POSIX 能力探测（poll/inet_ntop/getifaddrs/ifaddrs.h）在 OHOS 目标上自动进行，无需补丁（呼应知识库 E090/E355，本库不受影响）"
  - "meson 静态库构建需要 ar/ranlib；参照 cairomm 1.16.2 / E296 向 Meson machine file 注入 llvm-ar/llvm-ranlib 并强制 -fuse-ld 指向 ld.lld（lld 通用驱动依赖 libxml2.so.16，设备上不在动态链接器搜索路径）"
  - "conan Meson helper 在 Windows 宿主上硬编码 --prefix=abspath('/')='C:/'，POSIX 目标的 meson 拒绝（meson.build:25 ERROR: prefix value 'C:/' must be an absolute path）——仅影响 Windows 宿主交叉预验证，OHOS 设备原生 CI（prefix=/）不受影响"
