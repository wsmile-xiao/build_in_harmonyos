software: lbreakout2
display: "LBreakout2"
description: "Breakout/arkanoid style arcade game for SDL 1.2"
category: games
homepage: "https://lgames.sourceforge.io/LBreakout2/"
license: GPL-2.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - "SDL 1.2 through sdl12-compat with a recipe-generated sdl-config shim for the vendored AM_PATH_SDL macro"
    - "Networking disabled (no SDL_net 1.2 in the archive set); the standalone server daemon is still installed"
  common_dependencies:
    - sdl12-compat
    - sdl-mixer
    - libpng
    - zlib
versions:
  "2.6.5":
    status: built
    build_date: "2026-09-18"
    conan_ref: "lbreakout2/2.6.5"
    upstream_version: "2.6.5"
