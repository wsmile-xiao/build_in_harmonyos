sources:
  url: "https://downloads.sourceforge.net/project/lgames/lbreakout2/2.6/lbreakout2-2.6.5.tar.gz"
  sha256: "9104d6175553da3442dc6a5fc407a669e2f5aff3eedc5d30409eb003b7a78d6f"

patches:
  - patch_file: "patches/0001-config.sub.patch"
    patch_description: "Teach the vendored 2004 config.sub to accept aarch64 and linux-ohos (upstream copy predates both)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask.patch"
    patch_description: "Change configure's config.status temp-dir umask 077 -> 022 (HMDFS cannot write 0700 dirs, knowledge E011)"
    patch_type: "portability"
  - patch_file: "patches/0003-client-main-config-h.patch"
    patch_description: "Include config.h in client/main.c so AC_USE_SYSTEM_EXTENSIONS' _GNU_SOURCE makes the setresgid prototype visible"
    patch_type: "portability"
