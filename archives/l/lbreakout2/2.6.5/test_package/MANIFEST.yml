package: lbreakout2/2.6.5
homepage: https://lgames.sourceforge.io/LBreakout2/

upstream_check_command: "grep -R 'TESTS\\|check_PROGRAMS\\|check:' <src>/*/Makefile.am (no hits); find <src> -iname '*test*' (no hits)"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests: []

test_package_tests:
  - file: test_commands.py
    description: "Check both installed commands and the game data, then run lbreakout2 headless through the SDL dummy drivers and require it to reach its menu loop"
    command: "python3 test_commands.py <package>/bin <package>/share/lbreakout2"
  - file: test_sdl_runtime.c
    description: "Initialize the SDL video/audio/timer/joystick subsystems and 640x480x16 software display used by the game, open the SDL_mixer audio device, and round-trip an input event"
    command: "SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./test_sdl_runtime"

assertion_count: 4
