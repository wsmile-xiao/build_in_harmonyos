software: lbreakout2
version: "2.6.5"
status: built
build_system: autotools
build_date: "2026-09-18"
source:
  url: "https://downloads.sourceforge.net/project/lgames/lbreakout2/2.6/lbreakout2-2.6.5.tar.gz"
  sha256: "9104d6175553da3442dc6a5fc407a669e2f5aff3eedc5d30409eb003b7a78d6f"
  upstream_version: "2.6.5"
build:
  system: autotools
  configure_options:
    - "--disable-nls"
    - "--disable-network"
    - "--disable-sdltest"
    - "SDL_CONFIG=<build>/sdl-config (recipe-generated shim)"
  dependencies:
    - "sdl12-compat/1.2.68"
    - "sdl-mixer/1.2.12"
    - "libpng/1.6.58"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-config.sub.patch"
  - "0002-configure-umask.patch"
  - "0003-client-main-config-h.patch"
knowledge_gained:
  - "The 1999-era vendored AM_PATH_SDL macro only discovers SDL through sdl-config and overwrites SDL_CFLAGS/SDL_LIBS from its output; a recipe-generated sdl-config shim pointing at the resolved sdl12-compat package is required (ref: notes.md)."
  - "LBreakout2 bakes SRC_DIR/HI_DIR from --datadir/--localstatedir into the binary, so the Conan prefix must be the package folder itself and install must use an empty DESTDIR (ref: notes.md)."
  - "LBreakout2 2.6.5 has no upstream test suite; the consumer tests run the installed game headless through the SDL dummy drivers (ref: test_package/MANIFEST.yml)."
knowledge_ref:
  - "archives/l/lbreakout2/2.6.5/notes.md"
  - "archives/l/lbreakout2/2.6.5/test_package/MANIFEST.yml"
