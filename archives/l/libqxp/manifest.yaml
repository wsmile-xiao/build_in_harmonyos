software: libqxp
display: "libqxp"
description: "Library for parsing QuarkXPress files (LibreOffice project)"
category: doc
homepage: "https://wiki.documentfoundation.org/DLP/Libraries/libqxp"
license: MPL-2.0
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "config.guess/config.sub 版本过旧（2016），不识别 OHOS，需替换为 2023+ 版本"
    - "HMDFS 文件系统上 umask 077 创建的目录无法写入（setgid + 077 权限冲突），需改为 umask 022 或使用 mktemp wrapper"
    - "ICU 77.1 的 LocalOpenPointer 模板使用 C++17 auto 非类型模板参数，需 -std=c++17"
    - "源码需从 LibreOffice 镜像下载，Savannah URL 返回 404"
  common_dependencies:
    - librevenge
    - icu

# 版本索引
versions:
  "0.0.1":
    status: built
    build_date: "2026-06-25"
    conan_ref: "libqxp/0.0.1@ohpcd/stable"
