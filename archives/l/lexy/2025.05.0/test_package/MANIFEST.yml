# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lexy/2025.05.0
homepage: "https://github.com/foonathan/lexy"

# 上游测试命令 (CMake + doctest; 上游测试入口为 ctest)
upstream_check_command: "ctest --test-dir build (tests/lexy + tests/lexy_ext + examples)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/lexy
    source: lexy-2025.05.0/tests/lexy
    description: "lexy core unit tests (doctest): dsl rules, encoding, parse actions, error handling"
    command: "ctest (lexy_test target)"
  - file: tests/lexy_ext
    source: lexy-2025.05.0/tests/lexy_ext
    description: "lexy_ext extension tests (doctest)"
    command: "ctest (lexy_ext_test target)"
  - file: examples
    source: lexy-2025.05.0/examples
    description: "examples as integration tests: calculator/email/ip/json/shell/xml/turing"
    command: "ctest (examples targets)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_lexy.cpp
    description: "消费者测试：DSL 语法解析（整数 42/-17/+123/0 + 非数字拒绝）5 项断言"
    command: "./test_lexy"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
