# test_package/MANIFEST.yml
# libdwarf 0.11.1 test declaration file

package: libdwarf/0.11.1
homepage: https://www.prevanders.net/dwarf.html

# Upstream test command (libdwarf CMake build: enable testing via BUILD_TESTING,
# run via ctest)
upstream_check_command: "cmake -DBUILD_TESTING=ON .. && cmake --build . && ctest"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs
# libdwarf upstream CMake test suite: uses BUILD_TESTING=ON,
# covers libdwarf API, DWARF format parsing, etc.
upstream_tests:
  - file: test/
    source: libdwarf-code-0.11.1/test/
    description: "libdwarf official test suite — covers API/format parsing, via ctest"
    command: "cmake -DBUILD_TESTING=ON .. && cmake --build . && ctest --output-on-failure"

test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(libdwarf) + target_link_libraries — verify library can be found and linked"
    command: "cmake -S . -B build"
  - file: test_package/conanfile.py
    description: "dwarf_attrlist + dwarf_hasform + dwarf_dealloc API calls — verify library API is callable"
    command: "conan test"

assertion_count: 2
