# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: libdicom/1.3.0
homepage: "https://github.com/ImagingDataCommons/libdicom"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test -C build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -v -C {build_folder} --no-rebuild --print-errorlogs"

# 上游实际运行的测试程序
upstream_tests:
  - file: "tests/check_dicom.c"
    source: "libdicom-1.3.0.tar.gz/tests/check_dicom.c"
    description: "Check framework test suite: 31 START_TEST cases covering error handling, log level, tag/VR validity, dictionary lookups, element value types (AE/AS/CS/DS/IS/ST/SQ/UI/US), sequence/dataset handling, file parsing of sample DICOM files (sm_image, ct_brain_single), and encapsulated pixel data BOT handling"
    command: "./check_dicom"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_package/test_libdicom.c"
    description: "Consumer smoke test: parse real DICOM file (sm_image.dcm, upstream sample, transported as base64 text) via public API dcm_filehandle_create_from_file/dcm_filehandle_get_file_meta/dcm_dataset_get/dcm_element_get_value_string/dcm_dataset_foreach, verify TransferSyntaxUID (0002,0010), MediaStorageSOPClassUID (0002,0002) and metadata subset iteration"
    command: "./test_libdicom sm_image.dcm"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 31 个 START_TEST 用例全部通过 + 消费者测试 6 项校验
assertion_count: 37
