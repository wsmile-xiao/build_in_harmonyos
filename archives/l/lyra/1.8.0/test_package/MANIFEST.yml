# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lyra/1.8.0
homepage: "https://github.com/bfgroup/Lyra"

# 上游测试命令：Lyra 无 make check；上游测试是 tests/*_run_test.cpp
# 独立可执行程序（mini_test.hpp harness），由 conan build() 批量编译运行
upstream_check_command: "clang++ -std=c++11 -Iinclude tests/*_run_test.cpp && ./run"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "clang++ -std=c++11|14 -Iinclude tests/*_test.cpp"

upstream_tests:
  - file: tests/*_run_test.cpp（54 个 + 4 个 *_test.cpp）
    count: "58"
    description: "上游测试实测：58 个测试源文件全部编译通过并运行 0 失败（54 个含 main 的可执行测试 + base_compile_test 编译-only + issue_93_test C++14 + optional_type/single_include）——OHOS clang 15 原生编译运行"

test_package_tests:
  - file: test_lyra.py
    description: "R34：lyra/lyra.hpp 头文件存在 + 编译运行真实 lyra::cli 解析（-v flag + 位置参数）"
    command: "python3 test_lyra.py <package>"

assertion_count: 3