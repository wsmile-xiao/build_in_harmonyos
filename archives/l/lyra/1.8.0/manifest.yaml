# lyra 1.8.0 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.0"

# 软件名
software: "lyra"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake-header-only"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag tarball，R39）
  url: "https://github.com/bfgroup/Lyra/archive/refs/tags/1.8.0.tar.gz"

  # 源码校验和（官方 tarball sha256，已核验）
  sha256: "cd657146167cd2f80c27e4414ecd1a6639537f5a6d527e608bcd0c633d8beca9"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：header-only 库，无编译产物；上游为 CMake INTERFACE，
  # 仅安装 include/lyra/ 头文件
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）——header-only，0 依赖
  dependencies: []

  # 编译器（上游测试在 conan build() 中用 OHOS clang15 编译运行）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁，上游源码零修改）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（可复用经验）
knowledge_gained:
  - "header-only C++11 库适配：conan 配方用 package_type=header-library，cpp_info.libs=[]，仅安装 include/；conan-init 按 URL 猜 autotools 模板时需人工改写并补 export_sources()+apply_conandata_patches()（否则 G1 失败）"
  - "lyra 1.8.0 API 坑：bool 类型 opt 带 hint 会被当作需值选项导致 'Unable to convert'；bool flag 应写 opt(verbose)['-v'] 不带 hint"
  - "上游测试 doc_*_run_test.cpp include examples/ 下源码，编译测试需追加 -I<src>/examples"
  - "GitHub 直连超时（E017）：官方 tarball 预置 TMPDIR/builds 供 init-build 复用，镜像注入由 CI 侧完成"