# test_package/MANIFEST.yml — libgomp 16.1.1
# 上游 libgomp.c 测试真实分类（2026-09-26 重新清点，纠正此前「342 纯 API」口径）：
#   478 = 60 GPU(declare-variant/interop) + 71 纯 API + 347 含 #pragma omp
# OHOS clang 15 无法生成 GOMP ABI（-fopenmp=libgomp 被驱动吞参、-fopenmp 生成
# libomp ABI __kmpc_*），含 #pragma omp 的测试其 pragma 会被静默忽略 → 串行执行。
# 故 build() 内按真实分类编译运行，全部真实并行/真实运行验证：
#   - 66 个纯 API（不含 #pragma omp）直接编译运行
#   - 4 个需 OMP_* 环境变量的纯 API（allocator-1/2/3 需 OMP_ALLOCATOR、
#     target-48 需 OMP_TARGET_OFFLOAD=mandatory）
#   - 345 个含 #pragma omp / GNU 扩展（nested fn/__label__/__float128/VLA/_Alignof）
#     的测试等价改写（tests_equivalent/，其中 232 个 GOMP 真并行 outline + 113 个
#     串行/smoke/host-fallback 忠实还原）

package: libgomp/16.1.1
homepage: "https://gcc.gnu.org/"

upstream_check_command: "clang 编译运行 libgomp.c 测试（build() 内 415 个 = 66 纯 API + 4 env + 345 等价改写）"

upstream_test_in_build: true
upstream_test_command: "TMPDIR=<tmpfs> /data/service/hnp/bin/clang -I<src/libgomp> -I<build/obj> <test>.c -L<build/obj>/.libs -lgomp -pthread -o <out> && LD_LIBRARY_PATH=<build/obj>/.libs [<env>] <out>"

upstream_tests:
  - file: "testsuite/libgomp.c/*.c"
    description: "66 个纯 API 测试（不含 #pragma omp）+ 4 个需 OMP_* 环境变量的纯 API 测试，真实编译运行"
    command: "clang + LD_LIBRARY_PATH [+OMP_ALLOCATOR/OMP_TARGET_OFFLOAD] 运行（exit 0 = pass）"
  - file: "tests_equivalent/*.c"
    description: "345 个含 #pragma omp / GNU 扩展的测试等价改写（232 个 GOMP 真并行 outline + 113 个串行/smoke/host-fallback 忠实还原）"
    command: "clang + LD_LIBRARY_PATH 运行（exit 0 = pass）"

test_package_tests:
  - file: test.c
    description: "消费者测试: clang 链接 libgomp, 验证 omp_get_max_threads/omp_set_num_threads/omp_set_dynamic/omp_get_num_threads/omp_get_thread_num/omp_get_num_procs/omp_lock_t 与 GOMP_parallel 真并行(4 线程), 全部断言通过输出 ALL PASSED"
    command: "OMP_NUM_THREADS=4 ./test_libgomp"

assertion_count: 6
