# conandata.yml — libgomp 16.1.1
# libgomp 无独立 tarball，从 GCC 16 源码树构建 libgomp/ 子目录。
# Conan 包版本为 16.1.1；GCC 官方 ftp 无 gcc-16.1.1.tar.xz（仅 16.1.0 / 16.2.0），
# 采用同系列最接近的官方 release gcc-16.1.0 作为可复现源码源。

sources:
