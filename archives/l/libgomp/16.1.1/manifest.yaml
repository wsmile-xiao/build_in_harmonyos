# 版本级 manifest — libgomp 16.1.1
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "16.1.1"

# 软件名
software: "libgomp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  # libgomp 无独立 tarball，从 GCC 16 源码树构建 libgomp/ 子目录；16.1.1 无
  # 官方 tarball，采用同系列最接近的官方 release gcc-16.1.0
  url: "https://ftp.gnu.org/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz"

  # 源码校验和
  sha256: "50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-musl"
    - "--host=aarch64-unknown-linux-musl"
    - "--disable-multilib"
    - "--disable-werror"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "bundled gcc-16.1.0 (libgomp 子目录 + gcc/BASE-VER)"

  # 编译器
  cc: clang
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 注: 无 upstream patch 文件; 但配方在 source() 阶段对 6 个上游源文件做
#     clang 15 兼容性内联改写（in-recipe source mutation），非零补丁纯上游：
#       - omp.h.in（去 __malloc__(omp_free) 的 deallocator 参数）
#       - config/linux/ptrlock.h、config/linux/ptrlock.c（type-punning 统一 void*）
#       - env.c（label/case 后声明补 {}、gomp_global_icv 静态初始化字面量化）
#       - oacc-init.c（__builtin_acc_on_device → __clang__ 下 host-only 判断）
#       - allocator.c（memkind_data 声明上移）
#     build() 阶段另对 configure 内联改写（config.status mktemp 指到 $TMPDIR）。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libgomp 无独立上游 tarball，必须从 GCC 源码树 libgomp/ 子目录构建"
  - "libgomp 16.1.1 对应 GCC 16.1.1；GCC 官方 ftp 无 gcc-16.1.1.tar.xz，采用同系列 gcc-16.1.0 作为可复现源码源"
  - "libgomp 是纯 C 运行时库（可选 Fortran 接口），无需 GCC 前端（all-gcc）或 libgcc，可直接用 clang 编译 libgomp 子目录"
  - "--host=aarch64-unknown-linux-musl 让 configure.tgt 匹配 aarch64*-*-linux* → config_path='linux posix'（futex + pthread）"
  - "无 gfortran 时 configure 自动 FC=no 跳过 Fortran 模块（omp_lib），无需特殊处理"
  - "libgomp 不使用 pthread_cancel（E127 是 LLVM libomp 的坑，不适用 libgomp）"
  - "上游测试清点：libgomp/testsuite/libgomp.c 共 478 个 .c = 60 GPU(declare-variant/interop) + 71 纯 API + 347 含 #pragma omp"
  - "适配后执行：66 纯 API + 4 env + 345 等价改写（232 GOMP 真并行 outline + 113 串行/smoke/host-fallback 忠实还原）= 415 个真机编译运行通过；另 3 个 offload 设备门控 + 60 个 GPU 专属排除"
  - "OHOS clang 15 无法生成 GOMP ABI（-fopenmp=libgomp 被驱动吞参、-fopenmp 生成 libomp ABI __kmpc_*），含 #pragma omp 测试需手动 outline 成 GOMP ABI"
