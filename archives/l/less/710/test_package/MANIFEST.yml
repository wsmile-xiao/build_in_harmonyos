# test_package/MANIFEST.yml
# Upstream test declaration (L0e required)

package: less/710
homepage: "https://www.greenwoodsoftware.com/less/"

# less 710 ships the lesstest suite: 19 scripted terminal cases (lesstest/lt/*.lt)
# wired into the autotools `check` target (Makefile.in: check -> ${MAKE} LESSTEST=1
# -> runtest -l less_t lt).
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\")  # builds less_t + lesstest + lt_screen, runs 19 .lt cases"
upstream_tests:
  - suite: "lesstest"
    cases: 19
    source: "lesstest/lt/*.lt (counted by registration: ls lesstest/lt/*.lt | wc -l)"

test_package_tests:
  - file: smoke.sh
    description: "Behavioral consumer test of the packaged less binary: -F full-file output content assertion, -N line-number assertion, --version sanity (real run + grep assertions, not --version-only)."
    command: "sh smoke.sh <package>/bin"
