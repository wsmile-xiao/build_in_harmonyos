# test_package/MANIFEST.yml
# Upstream test declaration (L0e required)
# less has no official test suite; verified via --version smoke test

package: less/661
homepage: "https://www.greenwoodsoftware.com/less/"

upstream_check_command: "make check"

# less has no upstream test suite
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs (less has no test suite)
upstream_tests: []

# Consumer-side verification: run less --version
test_package_tests:
  - file: conanfile.py
    description: "Smoke test: verify less --version runs successfully"
    command: "less --version"

assertion_count: 1
