# 版本级 manifest — libxmu 1.3.1.1
# 遵循 ARCHIVE-SPEC v2.0（4.2 版本级字段）
#
# 说明：上游 libXmu 没有 1.3.2 发布，`.1` 是本仓的**配方修订号**：
# 同一份上游 1.3.1 源码，重出配方以在 libxext/6.4.0.1 已上架的当前
# ohpcd 状态下真正产出并上架 libxmu 制品（1.3.1 从未 upload 成功，
# 详见 notes.md「为什么重出 1.3.1.1」）。

version: "1.3.1.1"
software: libxmu
display: "libXmu"
upstream_name: libXmu
upstream_version: "1.3.1"
conan_ref: "libxmu/1.3.1.1"

status: built
build_date: "2026-09-29"
build_system: autotools
target_platform: aarch64-unknown-linux-ohos
issue: TBD

source:
  url: "https://xorg.freedesktop.org/releases/individual/lib/libXmu-1.3.1.tar.xz"
  sha256: "81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4"
  tar_format: tar.xz
  version_mapping: "Conan libxmu/1.3.1.1 maps to upstream libXmu 1.3.1 and the libXmu.so.6 / libXmuu.so.1 ABIs."

build:
  system: autotools
  configure_options:
    - "--enable-unit-tests"
  dependencies:
    - "libxt/1.3.1"
    - "libxext/6.4.0.1"
    - "libx11/1.8.13"
    - "xorgproto/2025.1"
  cc: clang
  cxx: clang++

patches_applied: []

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml and test_package/MANIFEST.yml"
    - "conan inspect archives/l/libxmu/1.3.1.1 passed: name=libxmu version=1.3.1.1 package_type=library"
    - "conan graph info with ci/conan/profiles/ohos-aarch64 as both host/build passed: libxt/1.3.1, libx11/1.8.13, xorgproto/2025.1, libxau/1.0.11, libxcb/1.17.0, libxdmcp/1.1.5, libsm/1.2.6, libice/1.1.2 all resolve on the forced libx11/1.8.13 track; only libxext/6.4.0.1 is Missing and rebuilds from source"
    - "conan list 'libxmu/*' -r=ohpcd -> found 0 matching recipe (this revision is the first upload)"
    - "conan list 'libxext/*' -r=ohpcd -> 6.4.0 and 6.4.0.1; 6.4.0.1's published binary requires libx11/6.4.Z, hence the from-source rebuild under force-pinned libx11/1.8.13"
    - "test_ohos.c assertions verified against upstream libXmu 1.3.1 sources: RdBitF.c returns BitmapFileInvalid when no bits array is parsed and BitmapOpenFailed when fopen fails; both status codes come from <X11/Xutil.h>"
    - "official source sha256 verified locally against xorg.freedesktop.org"
  remote:
    - "OHOS single-package CI: CI_PACKAGES=archives/l/libxmu/1.3.1.1 zsh ci/conan/build_and_test.sh"
  pending:
    - "PR validation"
    - "REL upload (post-merge) publishes libxmu/1.3.1.1 to ohpcd and unblocks libxaw/1.0.16 (PR #9432)"

knowledge_gained:
  - "libxmu/1.3.1 配方早已合入 main，但制品从未上架：合入时 libxext/6.4.0 的 matching binary eab79208 未发布，conan 回退到源码构建时 libtool 找不到 libxcb.la 而失败。"
  - "解除该阻塞需要三件事同时成立：libxext/6.4.0.1 已发布、libx11/1.8.13 以 force=True 统一整张图的 libx11 版本、并在 generate() 里为依赖合成 libtool .la shadow。"
  - "libXmu 与 libXmuu 是两个独立产物：libXmu 链 Xt/Xext/X11，libXmuu 是 Xt 无关子集只链 X11；下游按组件名 libxmu::Xmu / libxmu::Xmuu 引用。"
  - "OHOS 根文件系统只读且没有 /usr/share/X11/bitmaps，XmuReadBitmapDataFromFile() 必须返回确定的 BitmapOpenFailed 而不是中止进程。"
