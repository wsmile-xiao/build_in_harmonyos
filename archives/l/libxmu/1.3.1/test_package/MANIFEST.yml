# test_package/MANIFEST.yml — libxmu 1.3.1
# 上游官方测试声明文件 (CI L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: libxmu/1.3.1
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxmu"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/Makefile.am 的 check_PROGRAMS)
upstream_tests:
  - file: CursorName.c
    source: libxmu-1.3.1/test/CursorName.c
    description: "XmuCursorNameToIndex cursor name lookup"
    command: "./CursorName"
  - file: EditResStream.c
    source: libxmu-1.3.1/test/EditResStream.c
    description: "EditRes protocol stream serialization"
    command: "./EditResStream"
  - file: Lower.c
    source: libxmu-1.3.1/test/Lower.c
    description: "XmuCopyISOLatin1Lowered/Uppered/Compare/Snprintf"
    command: "./Lower"
  - file: ReadBitmapData.c
    source: libxmu-1.3.1/test/ReadBitmapData.c
    description: "XmuReadBitmapData/ReadBitmapDataFromFile"
    command: "./ReadBitmapData"
  - file: reallocarray.c
    source: libxmu-1.3.1/test/reallocarray.c
    description: "Xmureallocarray normal/zero/oversize/overflow (oversize: bionic libc 平台固有不兼容，见 notes.md)"
    command: "./reallocarray"
  - file: StrToBS.c
    source: libxmu-1.3.1/test/StrToBS.c
    description: "XmuCvtStringToBackingStore/BackingStoreToString"
    command: "./StrToBS"
  - file: StrToGrav.c
    source: libxmu-1.3.1/test/StrToGrav.c
    description: "XmuCvtStringToGravity/GravityToString"
    command: "./StrToGrav"
  - file: StrToJust.c
    source: libxmu-1.3.1/test/StrToJust.c
    description: "XmuCvtStringToJustify/JustifyToString"
    command: "./StrToJust"
  - file: StrToLong.c
    source: libxmu-1.3.1/test/StrToLong.c
    description: "XmuCvtStringToLong/LongToString"
    command: "./StrToLong"
  - file: StrToOrnt.c
    source: libxmu-1.3.1/test/StrToOrnt.c
    description: "XmuCvtStringToOrientation/OrientationToString"
    command: "./StrToOrnt"
  - file: StrToShap.c
    source: libxmu-1.3.1/test/StrToShap.c
    description: "XmuCvtStringToShapeStyle/ShapeStyleToString"
    command: "./StrToShap"

# 上游测试结果汇总 (make check, HarmonyOS aarch64, 2026-08-26)
# # TOTAL: 26   # PASS: 23   # SKIP: 1   # FAIL: 1   # ERROR: 1
# 崩溃点: test/reallocarray.c:157 test_Xmureallocarray_oversize
# 根因: HarmonyOS bionic libc 的 realloc 对 setrlimit(RLIMIT_AS) 的响应与 glibc 方向相反
# 详见: archives/l/libxmu/1.3.1/notes.md "上游测试崩溃点诊断"

# test_package 中自带的测试 (消费者视角验证, R34 实质调用)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 XmuCompareISOLatin1() 验证 libXmuu API"
    command: "./test_libxmu"

# 测试断言总数 (近似值)
assertion_count: 26
