version: "2.24"
status: built
build_date: "2026-09-19"

source:
  url: "https://github.com/libhugetlbfs/libhugetlbfs/archive/refs/tags/2.24.tar.gz"
  sha256: "e6731ce521cf3d9da4c55af005d5a14cddd0e4a25d7fe6fd13543cef39b2a704"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
  dependencies: []
  cc: clang

patches_applied: []

knowledge_gained:
  - "真机 shadow CI 全链路通过：L0/L1/L2/L4/L5 全 pass，conan create 成功，工具 hugeadm/hugectl/hugeedit 可运行"
  - "OHOS 内核已启用 hugetlbfs（/proc/meminfo 有 HugePages_Total=2、Hugepagesize=2048kB），mmap(MAP_HUGETLB) 机制正常；但分配大页需 root 写 /proc/sys/vm/nr_overcommit_hugepages（SELinux 拒绝 E031，CI 无 root）且现有大页已占满——编译/打包/消费可用，大页分配受权限边界限制"
  - "libhugetlbfs 是纯 autoconf 项目（无 AM_INIT_AUTOMAKE），tag 归档无 configure；autogen.sh 的 autoreconf 需 aclocal/automake，HMDFS 上被拦（E046/E087）→ 改用 autoconf 直接生成 configure"
  - "autoreconf/autoconf/m4 在 /data/service/hnp/bin（不在 PATH）→ build() 前置 PATH"
  - "config.status 用 umask 077 建临时目录，HMDFS UID 映射不可写（E011）→ sed 改 umask 022"
  - "musl 兼容点：alloc.c 的 _SC_LEVEL2_CACHE_LINESIZE→64；shm.c 的 __THROW/__nonnull 删除；hugeadm.c 的 addmntent→no-op"
  - "HMDFS 无符号链接（E018/E073）：Makefile ln -sf→cp；install-man 的 man 别名 ln -s 跳过"
  - "aarch64 库装到 lib64/，PREFIX 默认 /usr/local → package() 传 PREFIX=/ LIB64=lib 映射到 Conan 标准 lib/"
  - "OHOS 动态 .so 加载受限（E073/E088）→ shared=False 时删 .so，消费者静态链接"
