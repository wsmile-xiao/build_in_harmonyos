# test_package/MANIFEST.yml
# libhugetlbfs 2.24 — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libhugetlbfs/2.24
homepage: https://github.com/libhugetlbfs/libhugetlbfs

# 上游测试命令 (make check -> cd tests && ./run_tests.py)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make libs tools tests && cd tests && python3 run_tests.py"

# 上游测试说明：
#   build() 已真实编译上游 60 个测试二进制（跳过 4 个依赖 Linux ld.hugetlbfs
#   wrapper + 符号链接的 HUGELINK 测试），并真实执行 run_tests.py 捕获失败证据。
#   失败根因：普通用户无 root，写 /proc/sys/vm/nr_overcommit_hugepages 被
#   SELinux 拒绝（E031），大页分配需 root，属权限边界，非平台功能缺失。
#   （OHOS 内核已启用 hugetlbfs：/proc/meminfo 显示 HugePages_Total=2、Hugepagesize=2048kB。）
upstream_tests:
  - file: tests/*.c
    source: libhugetlbfs-2.24.tar.gz/tests/
    description: "上游 60 个测试二进制真实编译；run_tests.py 真实执行，因无 root 分配大页在 setup 阶段失败"
    command: "make libs tools tests && cd tests && python3 run_tests.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "链接 libhugetlbfs，调用 gethugepagesize()/getpagesizes() 验证符号可解析、可调用"
    command: "./test_libhugetlbfs"

# 测试断言总数 (消费者契约：2 个 API 调用)
assertion_count: 2
