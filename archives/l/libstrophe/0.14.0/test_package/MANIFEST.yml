# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libstrophe/0.14.0
homepage: "https://strophe.im/libstrophe/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/ 下 automake 测试集, 共 18 项, 本机全绿)
upstream_tests:
  - file: tests/test_ctx.c
    source: libstrophe-0.14.0/tests/test_ctx.c
    description: "ctx 生命周期/verbosity 测试"
    command: "./tests/test_ctx"
  - file: tests/test_stanza.c
    source: libstrophe-0.14.0/tests/test_stanza.c
    description: "stanza 序列化/解析测试"
    command: "./tests/test_stanza"
  - file: tests/test_jid.c
    source: libstrophe-0.14.0/tests/test_jid.c
    description: "JID 解析测试"
    command: "./tests/test_jid"
  - file: tests/test_hash.c
    source: libstrophe-0.14.0/tests/test_hash.c
    description: "hash 表测试"
    command: "./tests/test_hash"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 xmpp_initialize/xmpp_version_check/xmpp_ctx_new/free"
    command: "./test_libstrophe"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
