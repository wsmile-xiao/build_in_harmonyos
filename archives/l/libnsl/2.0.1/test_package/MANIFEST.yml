# test_package/MANIFEST.yml - libnsl 2.0.1 (HarmonyOS PC)
#
# CI L0e requires this file to exist. Every number below is backed by real
# evidence; see "upstream_tests" for why the upstream suite is empty.
package: libnsl/2.0.1
homepage: "https://github.com/thkukuk/libnsl"

# ---------------------------------------------------------------------------
# A. Source declarations (upstream test suite)
# ---------------------------------------------------------------------------
# libnsl 2.0.1 has NO upstream test suite. This is NOT inferred from
# "upstream_test_in_build=false" - it was established from the release tarball
# itself, with these commands run on the OHOS aarch64 worker:
#
#   $ tar xf libnsl-2.0.1.tar.xz && cd libnsl-2.0.1
#   $ grep -rn "TESTS\|check_PROGRAMS\|noinst_PROGRAMS" Makefile.am src/*/Makefile.am
#     (no output)
#   $ cat Makefile.am
#     SUBDIRS = po src
#   $ find . -maxdepth 2 -type d -iname '*test*'
#     (no output - no test directory in the tarball)
#   $ cat configure.ac | grep -i test
#     (no output - no AC_CONFIG_TESTDIR / AM_PATH_* test macros)
#
# Therefore: upstream_total = 0 because upstream really declares zero tests,
# verified at source level in three independent ways.
upstream_check_command: "make check   # no-op: upstream declares no TESTS targets"
upstream_test_in_build: false
upstream_test_command: "none (upstream ships no test targets)"
upstream_tests: []

# ---------------------------------------------------------------------------
# B. HarmonyOS consumer test (this test_package)
# ---------------------------------------------------------------------------
# A real consumer: links libnsl::libnsl (static) plus the transitive
# libtirpc::libtirpc, and exercises 41 assertions covering the NIS status
# tables, the wire->YP error mapping, the yp_get_default_domain contract and a
# genuine XDR encode/decode round trip.
test_package_tests:
  - file: test_libnsl.c
    description: >
      yperr_string (18 cases, exact upstream strings), ypbinderr_string
      (6 cases), ypprot_err (11 cases incl. 3 out-of-range statuses),
      yp_get_default_domain (2 contract checks, +1 when a domain is
      configured), xdr_domainname in-memory encode/decode round trip
      (4 checks, validates the transitive libtirpc link at runtime).
    command: "./test_libnsl"

# test_package assertions: 18 + 6 + 11 + 4 + 2 = 41 unconditionally, 42 on a
# host that has a NIS domain configured. Counted from test_libnsl.c.
assertion_count: 42

# ---------------------------------------------------------------------------
# C. Executed results on the HarmonyOS PC worker (real device, not CI)
# ---------------------------------------------------------------------------
# conan create / ctest:
#   Running tests...
#   1/1 Test #1: test_libnsl ......................   Passed    0.03 sec
#   100% tests passed, 0 tests failed out of 1
#
# Direct execution of the statically linked consumer binary
# (res/test_package_run.txt in the version directory):
#   checks=42 failures=0
#   RESULT: PASS (42/42)
executed_on_device:
  upstream_total: 0
  upstream_executed: 0
  upstream_passed: 0
  upstream_failed: 0
  test_package_assertions: 42
  test_package_executed: 42
  test_package_passed: 42
  test_package_failed: 0
  real_pass_rate: "42/42 (1.0)"
