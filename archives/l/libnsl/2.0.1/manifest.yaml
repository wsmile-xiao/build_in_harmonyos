version: "2.0.1"
software: libnsl
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://github.com/thkukuk/libnsl/releases/download/v2.0.1/libnsl-2.0.1.tar.xz"
  sha256: "5c9e470b232a7acd3433491ac5221b4832f0c71318618dc6aa04dd05ffcd8fd9"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-nls"
    - "--disable-shared"
    - "--enable-static"
    - "--disable-dependency-tracking"
  dependencies:
    - name: libtirpc
      version: 1.3.7
      role: requires   # TI-RPC primitives (xdr_*, clnt_*, netconfig)

patches_applied:
  - patch_file: "patches/0001-ohos-disable-nls-gettext-identity.patch"
    patch_type: portability
    description: >
      Guard the gettext() wrapper with ENABLE_NLS so a --disable-nls build
      compiles to the identity instead of an implicit-declaration error
      (OHOS libintl.h declares no gettext() with NLS off).

knowledge_gained:
  - "OHOS profile [buildenv] exports CONFIG_SHELL=/data/service/hnp/bin/bash and ConanFile.run() always wraps commands with that aggregated conanbuild env. libnsl's autoconf 2.69 configure probes its starting shell, finds /bin/sh inadequate, scans /bin:/usr/bin:$PATH for sh|bash|ksh|sh5 and re-execs into bash; that bash cannot getcwd() for a non-root cwd on hmfs/hmdfs, so configure dies with 'working directory cannot be determined'. An inline command-prefix CONFIG_SHELL=/bin/sh (which wins over the aggregated env) fixes it. Existing drafts: DRAFT-E551, DRAFT-6487. 29 recipes in this repo use the same idiom."
  - "The bundled config.guess (Autoconf 2.69, 2015) does not recognise uname -s = HarmonyOS: 'configure: error: cannot guess build type; you must specify one'. Passing an explicit native triplet --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu skips config.guess/config.sub; the alternative is re-anchoring a config.guess/config.sub portability patch for the pre-2016 script generation (DRAFT-E564)."
  - "autoconf creates its scratch dir with (umask 077 && mktemp -d ./confXXXXXX). On the OHOS hmdfs mount a 0700 dir below a setgid dir is not writable by the next process, so config.status dies with \"can't create ./confXXXXXX/subs1.awk: Permission denied\" -> \"could not setup config files machinery\". Relaxing configure's umask 077 to 022 (same as gmime/3.0.6 and classads/1.0.10) fixes it."
  - "libnsl 2.x is a pure TI-RPC client: configure.ac gates the whole RPC/XDR implementation behind PKG_CHECK_MODULES([TIRPC], [libtirpc]) + AC_DEFINE(HAVE_TIRPC). Without a resolvable libtirpc.pc the build silently degrades to a stub library, so libtirpc/1.3.7 is a hard requires(), supplied to configure via Conan PkgConfigDeps."
  - "The OHOS SDK sysroot ships libintl.h but no runtime message catalogues; --disable-nls leaves ENABLE_NLS undefined so libintl.h maps gettext() to the identity macro and no libintl/gettext dependency is needed."
  - "libnsl 2.0.1 declares no tests at all (no TESTS/check_PROGRAMS in any Makefile.am, no test dir in the release tarball): upstream_total = 0 is established from source evidence, not inferred from the recipe."
  - "src/libc-lock.h is a portable pthread shim (not glibc-internal), so the musl-only OHOS libc needs no patch."

verification:
  conan_create: passed
  conan_create_exit: 0
  recipe_revision: "RUN_AT_COMMIT"
  package_files: 11
  static_archives: 1
  shared_objects: 0
  target_runtime_executed: true
  target_system: "HarmonyOS PC aarch64 (OHOS 6.0, musl, clang 15.0.4)"
  upstream_total: 0
  upstream_executed: 0
  upstream_passed: 0
  upstream_failed: 0
  test_package_assertions: 42
  test_package_executed: 42
  test_package_passed: 42
  test_package_failed: 0
  test_package_ctest: "100% tests passed, 0 tests failed out of 1"
  evidence_log: "res/test_package_run.txt"

known_issues:
  - "libtirpc/1.3.7 as published to ohpcd exposes an EMPTY cpp_info.includedirs, so
    CMakeDeps emits `set(libtirpc_INCLUDE_DIRS_RELEASE )` and a consumer that only
    links libnsl::libnsl cannot find <rpc/rpc.h> (the .pc file carries the right
    Cflags, the cpp_info does not). libnsl declares cpp_info.requires and the
    test_package additionally injects the dependency include roots, the same
    workaround the merged libdap/3.20.6 test_package uses. A libtirpc republish
    would let the workaround be removed."
