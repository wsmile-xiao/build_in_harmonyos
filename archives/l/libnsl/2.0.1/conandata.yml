sources:
  url: "https://github.com/thkukuk/libnsl/releases/download/v2.0.1/libnsl-2.0.1.tar.xz"
  sha256: "5c9e470b232a7acd3433491ac5221b4832f0c71318618dc6aa04dd05ffcd8fd9"

patches:
  - patch_file: "patches/0001-ohos-disable-nls-gettext-identity.patch"
    patch_description: >
      Make the gettext() wrapper conditional on ENABLE_NLS. With --disable-nls
      the OHOS libintl.h declares no gettext(), so the unconditional
      `#define _(String) gettext (String)` makes clang emit an implicit
      declaration (int) and then fail with
      "incompatible integer to pointer conversion returning 'int' from a
      function with result type 'const char *'". Translate to the identity
      instead when NLS is off. Behaviour with ENABLE_NLS=1 is unchanged.
    patch_type: "portability"
