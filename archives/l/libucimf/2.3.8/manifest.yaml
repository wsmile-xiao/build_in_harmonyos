# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CONFIG_SHELL=bash 使 2011 年代 ltmain.sh 生成的 libtool 丢失引号转义（archive_expsym_cmds 版本脚本行报 syntax error near unexpected token），须以 CONFIG_SHELL=/bin/sh 命令行前缀重新 configure 生成（ref: knowledge/graph E551）"
  - "2010/2011 年代 config.guess/config.sub 不识别 HarmonyOS 内核与 aarch64，按 E007 模式补 *:HarmonyOS:*:* 分支、aarch64 CPU 与 linux-ohos OS 识别（ref: knowledge/graph E007）"
  - "init-build 的 .orig 快照与 .work 源码树共享硬链接，perl/Edit 类原地写入会穿透硬链接污染 diff 基线，refresh-patch 生成补丁前须确认两目录 inode 分离（ref: knowledge/graph E551 同源机制）"
  - "freetype/fontconfig 在 ohpcd 制品仓为 shared=True 预编译，消费方 conanfile 须以 default_options 声明 freetype/*:shared=True 才能命中二进制，否则整条字体链从源码构建（ref: knowledge/graph E538 同类 shared 不匹配）"
  - "autoconf 2.69 config.status 以 (umask 077 && mktemp -d ./confXXXXXX) 在 build 目录创建 700 临时目录；HMDFS /storage 卷属主映射为 20001006 时，组外 CI worker（uid 100，依赖 file_manager 组写权限）无法写入，报 can't create .../subs1.awk: Permission denied / could not setup config files machinery，chmod 亦无权限（需属主身份），TMPDIR 仍可能被指回 /storage（build #63288 实证）；且 mksh 下特殊内建（:）重定向失败会终止整个 shell、探针必须放进子 shell（build #63314 实证）。可靠解法：候选目录（${TMPDIR} → /data/* → build 目录 umask 000 建 0777 子目录）逐一做子 shell 真实写入探针、取第一个可写者（ref: knowledge/graph HMDFS 卷属主映射与 umask 077 临时目录族）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

