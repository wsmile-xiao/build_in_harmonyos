# test_package/MANIFEST.yml — libucimf 2.3.8 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libucimf/2.3.8
homepage: "https://github.com/matlinuxer2/ucimf"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清点证据 (R51 三步法 第 1 步):
#   对 2.3.8 tarball 全部 Makefile.am (顶层/display/font/src/sample/man)
#   grep 'check_PROGRAMS|TESTS|check-local' 均无命中 —— 上游没有注册任何
#   测试目标；automake 生成的 `make check` 是空跑（no check_PROGRAMS）。
#   sample/ 下的 console01/console04 是 noinst 演示程序而非测试：它们调用
#   ucimf_init()，在无 framebuffer / 无 fontconfig 字体的环境里
#   Font::instance() 返回 NULL 后 ->height() 空指针崩溃，无法作为
#   headless 测试运行。故上游实际可运行测试数为 0，测试通过率记 0/0。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    source: test_package/test.c
    description: >
      无头消费者端到端工作流：通过 CMakeDeps find_package(libucimf) 链接
      安装后的 libucimf（含 freetype/fontconfig/libltdl 传递依赖），调用
      <ucimf.h> 导出的 ucimf_process_raw()/ucimf_switch() C 入口。
      process_raw 以 KEY_LEFTCTRL(29) 按下/释放事件驱动真实的
      keycode->keysym->terminal-string 处理管线（KDGKBENT/KDGKBSENT ioctl
      在管道环境下以 ENOTTY 优雅失败），断言修饰键事件被消费（返回原缓冲
      指针、长度清零、缓冲清空）；switch 以非转义序列与错误长度负载验证
      早退透传契约。共 8 项断言，6 项 CHECK。
    command: "./test_libucimf"

# 测试断言总数 (用于质量评估)
assertion_count: 6
