# test_package/MANIFEST.yml
# Upstream official test declaration (CI L0e requires this file).
package: libheinz/4.1.0
homepage: "https://jugit.fz-juelich.de/mlz/libheinz"

# Command used to enumerate upstream tests (ctest -N against a configured build)
upstream_check_command: "ctest -N"

# Upstream tests are built and run inside conanfile.py build() via cmake.test()
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# Upstream Catch2 CTest programs (3 sources → 3 executables, 12 TEST_CASE)
upstream_tests:
  - file: test/CVectorTest.cpp
    source: libheinz-v4.1.0.tar.gz/test/CVectorTest.cpp
    description: "Complex vector trivial operations and arithmetic"
    command: "./CVectorTest"
  - file: test/KVectorTest.cpp
    source: libheinz-v4.1.0.tar.gz/test/KVectorTest.cpp
    description: "Real 3D vector basic methods and arithmetic"
    command: "./KVectorTest"
  - file: test/RotMatrixTest.cpp
    source: libheinz-v4.1.0.tar.gz/test/RotMatrixTest.cpp
    description: "Rotation matrix forth-and-back, Euler recovery, inversion"
    command: "./RotMatrixTest"

# Consumer test shipped in this test_package
test_package_tests:
  - file: test_package/test_heinz.cpp
    description: "Consumer API exercise across Complex/Vectors3D/Rotations3D"
    command: "./test_heinz"

# Approximate total assertions (upstream 114 + consumer 45)
assertion_count: 159
