# manifest.yaml — lablgtk3/3.1.5

version: "3.1.5"
status: built
build_date: "2026-09-27"

source:
  url: "https://github.com/garrigue/lablgtk/releases/download/3.1.5/lablgtk3-3.1.5.tbz"
  sha256: "d4821cdbecf3ae374f20317d63e43fe58030c3ba9657b51a2e83e652197e8eac"
  tar_format: tar.bz2
  # 与 opam-repository lablgtk3.3.1.5 的 checksum 一致（GitHub release 资产，
  # 非自动 tarball）。tag 3.1.5 → commit afbd6d2ee90b98cb0ea49cba34659e15b00cbfe3
  # 与 opam x-commit-hash 三方互证（Scout-A 报告）。

vendor_sources:
  # OCaml 侧依赖 vendor 进本包（单库门禁禁止在 archives/ 新建其他库目录）。
  camlp-streams:
    url: "https://github.com/ocaml/camlp-streams/archive/v5.0.1.tar.gz"
    sha256: "ad71f62406e9bb4e7fb5d4593ede2af6c68f8b0d96f25574446e142c3eb0d9a4"
    license: "LGPL-2.1-only WITH OCaml-LGPL-linking-exception"
    reason: "src/dune 的 varcc/propcc 工具 (libraries camlp-streams)"
  cairo2:
    url: "https://github.com/Chris00/ocaml-cairo/releases/download/0.6.4/cairo2-0.6.4.tbz"
    sha256: "40357352d7205d3a5735855643830cb345f2db838ff9d19a532018760d468a05"
    license: "LGPL-3.0"
    reason: "src/dune (libraries threads cairo2)；sha256 与 opam-repository 一致"
  dune:
    url: "https://github.com/ocaml/dune/archive/refs/tags/3.17.0.tar.gz"
    sha256: "a67dbfdd7d1a39ed08cadb04d928f645682d6a558b80cffb116663eb73f16e6e"
    license: "MIT"
    reason: "构建期需 dune-configurator（cairo2 与 lablgtk3 的 config/discover 均依赖），制品仓 dune/3.17.0 只发布 bin/dune；URL/sha256 与 archives/d/dune/3.17.0 的 conandata 一致"
  csexp:
    url: "https://github.com/ocaml-dune/csexp/releases/download/1.5.2/csexp-1.5.2.tbz"
    sha256: "1a14dd04bb4379a41990248550628c77913a9c07f3c35c1370b6960e697787ff"
    license: "MIT"
    reason: "dune-configurator 的 META 硬依赖；sha256 与 opam-repository csexp.1.5.2 一致"

build:
  system: dune（纯 dune，lang 1.8，release tarball 自带预生成 varcc.ml/propcc.ml，无 camlp5）
  build_command: "dune build -p camlp-streams && dune build -p csexp && dune build -p dune-configurator && dune build -p cairo2 && dune build -p lablgtk3 && dune build -p lablgtk3 examples/buttons.exe"
  tool_requires:
    - "ocaml/4.14.1.1.4（制品仓，bin/ocamlc、bin/ocamlopt 为原生 ELF——上游 ln -sf *.opt 以 cp -f 落盘）"
    - "dune/3.17.0（制品仓）"
    - "findlib/1.9.8（制品仓，bin/ocamlfind 为 ocamlfind_opt 原生 ELF）"
  host_requires:
    - "gtk/3.24.43（gtk+-3.0.pc >= 3.18 经 PkgConfigDeps 转发生成；broadway-only 后端不影响编译/链接）"
  cc: clang
  cxx: clang++

platform_adaptations:
  - "构建期显式环境：OCAMLLIB/OCAMLFIND_CONF/OCAMLPATH/CAML_LD_LIBRARY_PATH/PKG_CONFIG_PATH/TMPDIR 全部指向 conan 缓存与构建目录，不依赖设备隐式状态（implement-policy §5）"
  - "OHOS /tmp 只读 → TMPDIR/TMP/TEMP 注入构建目录"
  - "OHOS hmmac 拒绝 shebang/字节码可执行 → 全链原生 ELF（ocamlc/ocamlopt/ocamlfind/dune 均为制品仓原生产物）"
  - "dune_config 构建机执行 pkg-config gtk+-3.0 → PKG_CONFIG_PATH 指向 PkgConfigDeps 生成的 .pc（E527/E348 转发型 .pc 范式）"
  - "无显示后端（E463/E471）→ 测试 build-only + 无显示器 API 探针（Glib Utf8/charset 真实运行）"

patches_applied:
  - "patches/0001-ml_gdk-guard-gdkx-header-for-non-x11.patch：src/ml_gdk.c 残留的 gdk/gdkx.h include 以 GDK_WINDOWING_X11 守卫（该头文件仅随 X11 后端发布；OHOS gtk/3.24.43 为 broadway-only，E463/E527）；ml_gdk.c 未使用任何 X11 API"
  - "patches/0002-guard-x11-only-stubs-for-non-x11-backends.patch：GDK_WINDOWING_X11 未定义时走上游自带的非 X11 兜底——ml_gdk.c 的 XID/foreign_new 桩走 ml_raise_gdk \"only for X11\"、property_get 走 \"not supported\" Val_unit；ml_gtk.c 仅在 X11 下注册 plug/socket get_type，gtk_plug_new/gtk_socket_* 包装走 Unsupported() 桩（设备实机：broadway 安装的 gtkplug.h/gtksocket.h 本身以 #ifdef GDK_WINDOWING_X11 守卫，符号未声明/未导出）"

install_layout:
  - "lib/lablgtk3/**（findlib 包：META、.cma/.cmxa、C 头文件 wrappers.h 等）"
  - "lib/stublibs/dlllablgtk3_stubs.so、dllcairo_stubs.so（dlopen 插件/静态链接桩）"
  - "lib/camlp-streams/**、lib/cairo2/**、lib/csexp/**、lib/dune-configurator/**（vendored OCaml 库，OCAMLPATH 可解析）"
  - "licenses/LICENSE、licenses/LGPL"

knowledge_gained:
  - "lablgtk3 纯 dune 发布件经两处最小 portability patch（X11 守卫）即可在 OHOS 构建：C 侧全部经 pkg-config（conan .pc 转发 + 显式 .so 输入防系统静态 .a 影子化），OCaml 侧全显式环境注入"
  - "lld 链接闭包新实证：ocamlopt 自身把 -L/usr/local/lib 排在每个链接行首位，lld 在单目录内先查 .so 再查 .a——系统目录里仅存的静态 libgobject-2.0.a/libglib-2.0.a 会压过 -L 列表靠后的 conan 共享库；解法是把 conan 供给 .so 以绝对路径列为显式链接输入（isfile 守卫），使影子归档无符号可供给"
  - "OHOS 上 dune 生态外置库解析：OCAMLFIND_CONF 显式生成（newline 分隔 path），dune 3.17 经 ocamlfind printconf 读取"
  - "vendor OCaml 库范式：先 dune build -p <dep> 再拷 _build/install/default/lib 进 findlib root，供主包与 test_package 复用"
  - "无显示 GUI 绑定库的测试口径：上游 run-test 本身就是 build-only（examples/buttons.exe），运行级按 E471 分类排除并补无显示器 API 探针"
