# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求，详见 docs/TEST_QUALITY_SPEC.md）

package: lablgtk3/3.1.5
homepage: https://github.com/garrigue/lablgtk

# 上游测试命令（lablgtk3.opam 的 run-test 字段原文语义：
# ["dune" "build" "-p" name "-j" jobs "examples/buttons.exe"]——
# 上游无单元测试套件（全树 dune runtest=0、无 test/ 目录），
# 官方"测试"= 编译一个示例作为链接级冒烟，不运行）
upstream_check_command: "dune build -p lablgtk3 -j jobs examples/buttons.exe"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "dune build examples/buttons.exe（设备实测；等价于 opam run-test 的编译冒烟，仅编译不运行）"

# 上游测试声明
# 事实核查（2026-09，Scout-A 报告）：
#   - 上游无 runtest 规则（grep runtest=0）、无 test/ 目录、无测试框架依赖
#   - 上游 CI（.github/workflows/ci.yml）实质 = dune build @all 编译约 45 个
#     examples + 各可选子包
#   - 设备侧（E471）：OHOS PC 无任何原生显示后端，gtk_init() 运行必败，
#     示例只能编译/链接验证（build-only 属上游语义的正解，非"缺依赖"）
upstream_tests:
  - name: "examples_buttons_build"
    source: "lablgtk3-3.1.5/examples/buttons.ml（上游 opam run-test 指定目标）"
    description: "上游 run-test 语义：编译示例 buttons.exe 作链接级冒烟（不运行）"
    command: "dune build examples/buttons.exe"
    result: "pass"
    evidence: "conan create 日志中 dune 编译 examples/buttons.exe 成功且无错误"

  - name: "upstream_gui_runtime"
    source: "examples/*.ml（上游 45 个示例的运行面）"
    description: "上游示例运行级验证需显示服务器（gtk_init/GMain.init）"
    command: "（不可运行）"
    result: "skip"
    skip_reason: "OHOS PC 无原生 X11/Wayland 显示后端（E463/E471），broadway 显示服务因签名约束不可执行；运行级验证需 Broadway 服务或真实显示环境，非库缺陷"

# test_package 中自带的测试（消费者视角验证；探针在 test.sh，
# 经显式解释器 /bin/sh 驱动——OHOS hmmac 拒绝直接执行 shebang 脚本）
test_package_tests:
  - file: test.sh
    description: "T0 包结构断言：META/.cma/.cmxa/stubs .so/C 头文件 + vendored cairo2/camlp-streams（8 项 isfile 断言）"
    command: "test -f 断言组"
  - file: test.sh
    description: "T1 ocamlfind 解析 lablgtk3/cairo2/camlp-streams（显式 OCAMLFIND_CONF）"
    command: "ocamlfind query <pkg> x3"
  - file: test.sh
    description: "T2 OHOS 无显示 API 探针（本 run 新增的鸿蒙特有用例）：编译并真实运行链接 lablgtk3 stubs+cairo2+glib 的原生程序，执行 Glib.Convert.get_charset 与 Glib.Utf8 闭环（7 断言）——不需要 gtk_init/显示（E463/E471 ③ 无显示器 API 探针范式）"
    command: "ocamlfind ocamlopt -package lablgtk3 -linkpkg probe_glib.ml && ./probe_glib"
  - file: test.sh
    description: "T3 上游 run-test 对等：GTK 窗口消费者程序编译+链接（仅构建；运行需显示服务，按 E471 分类排除）"
    command: "ocamlfind ocamlopt -package lablgtk3 -linkpkg gtk_window_probe.ml"

# 测试断言总数
# T0: 8（结构断言）+ T1: 3（findlib 解析）+ T2: 7（探针运行断言，真实执行）
#    + T3: 1（链接级冒烟编译）= 19
assertion_count: 19
