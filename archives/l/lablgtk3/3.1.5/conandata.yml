# conandata.yml — lablgtk3 3.1.5
#
# Main source: official GitHub release asset (dune-release artifact), the
# same archive + checksum the opam-repository publishes for lablgtk3.3.1.5.
# Do NOT substitute the GitHub auto-generated tag tarball.
#
# vendor_sources: OCaml-side dependencies vendored into this package
# (single-library gate forbids new archives/ directories).  Both are
# official upstream archives with checksums cross-checked against the
# opam-repository (camlp-streams v5.0.1 archive tarball has no upstream
# sha256 in opam; the sha256 below was computed from the official
# archive and its sha512 matches opam-repository).
sources:
  "3.1.5":
    url: "https://github.com/garrigue/lablgtk/releases/download/3.1.5/lablgtk3-3.1.5.tbz"
    sha256: "d4821cdbecf3ae374f20317d63e43fe58030c3ba9657b51a2e83e652197e8eac"

vendor_sources:
  camlp-streams:
    url: "https://github.com/ocaml/camlp-streams/archive/v5.0.1.tar.gz"
    sha256: "ad71f62406e9bb4e7fb5d4593ede2af6c68f8b0d96f25574446e142c3eb0d9a4"
  cairo2:
    url: "https://github.com/Chris00/ocaml-cairo/releases/download/0.6.4/cairo2-0.6.4.tbz"
    sha256: "40357352d7205d3a5735855643830cb345f2db838ff9d19a532018760d468a05"
  # dune-configurator is required at build time (cairo2's config/discover and
  # lablgtk3's tools/dune_config link it), but the published dune/3.17.0
  # package ships bin/dune only (lib/dune is an empty findlib package).
  # Build it from the SAME official dune 3.17.0 archive the published dune
  # recipe uses (URL/sha256 identical to archives/d/dune/3.17.0/conandata.yml).
  dune:
    url: "https://github.com/ocaml/dune/archive/refs/tags/3.17.0.tar.gz"
    sha256: "a67dbfdd7d1a39ed08cadb04d928f645682d6a558b80cffb116663eb73f16e6e"
  # csexp: hard dependency of dune-configurator (its META requires it once
  # installed; dune's own workspace vendors it privately in release mode).
  # Official archive, sha256 cross-checked against opam-repository csexp.1.5.2.
  csexp:
    url: "https://github.com/ocaml-dune/csexp/releases/download/1.5.2/csexp-1.5.2.tbz"
    sha256: "1a14dd04bb4379a41990248550628c77913a9c07f3c35c1370b6960e697787ff"

patches:
  "3.1.5":
    - patch_file: "patches/0001-ml_gdk-guard-gdkx-header-for-non-x11.patch"
      patch_description: "Guard vestigial gdk/gdkx.h include with GDK_WINDOWING_X11: the header only ships with the X11 backend, which the OHOS gtk/3.24.43 package does not build (broadway-only, E463/E527); no X11 API is used by ml_gdk.c"
      patch_type: "portability"
    - patch_file: "patches/0002-guard-x11-only-stubs-for-non-x11-backends.patch"
      patch_description: "Route the X11-only C stubs to upstream's own non-X11 fallbacks when GDK_WINDOWING_X11 is undefined (gtkplug.h/gtksocket.h content is X11-guarded in the installed broadway GTK, so gtk_plug_*/gtk_socket_* and AnyPropertyType/GDK_WINDOW_XID are undeclared): ml_gdk.c XID/foreign_new wrappers take the ml_raise_gdk 'only for X11' stub path, ml_gdk.c property_get takes the 'not supported' Val_unit path, ml_gtk.c registers plug/socket get_type only under X11, and the gtk_plug_new/gtk_socket_* wrappers take the Unsupported() stubs — exactly upstream's win32/quartz fallback semantics"
      patch_type: "portability"
