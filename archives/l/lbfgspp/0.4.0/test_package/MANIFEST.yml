# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lbfgspp/0.4.0
homepage: "https://lbfgspp.statr.me/"

# 上游无正式测试套件 (仅 examples/)，无 make check
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游 examples (参考用，无断言)
upstream_tests:
  - file: examples/example-rosenbrock.cpp
    source: LBFGSpp-0.4.0/examples/example-rosenbrock.cpp
    description: "Rosenbrock optimization example (no assertions)"
    command: "./example-rosenbrock"
  - file: examples/example-quadratic.cpp
    source: LBFGSpp-0.4.0/examples/example-quadratic.cpp
    description: "Quadratic function optimization example (no assertions)"
    command: "./example-quadratic"

# test_package 中自带的测试 (消费者视角真实优化收敛验证)
test_package_tests:
  - file: test.cpp
    description: "Real optimization test: Rosenbrock convergence (x→1), quadratic (x→d), gradient norm check"
    command: "./test_lbfgspp"

# 测试断言总数 (3 convergence checks: Rosenbrock x, quadratic x, gradient norm)
assertion_count: 6
