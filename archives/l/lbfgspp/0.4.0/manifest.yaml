knowledge_gained:
  - "lbfgspp 是 header-only 库，package_type=header-library，只需打包头文件 + LICENSE"
  - "上游 v0.4.0 tag commit c524a40，发布于 2025-04-20"
  - "头文件 include 路径: include/LBFGS.h 和 include/LBFGSB.h (直接 include，非 include/lbfgspp/)"

references:
