# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 CMake 用 FindOpenSSL 的 OpenSSL::SSL target，conan openssl 只导出 openssl::openssl——generate() 里以 cmake_file_name=OpenSSL + 组件改名桥接（i2pd 2.58.0-r1 同款手法）"
  - "ohpcd openssl/3.5.6 配方无 components，桥接需 components.clear() 后重建 crypto/ssl 组件"
  - "上游 tests 为 CUnit 单驱动 testdriver（16 套件 176 测试），cunit/2.1-3 已在制品仓；上游对 cunit 用裸 -lcunit，需 CFLAGS/LDFLAGS 注入路径"
  - "libcoap3 导出 target 名 libcoap::coap-3（上游 libcoapConfig.cmake），package_info 用 cmake_file_name=libcoap 对齐"

