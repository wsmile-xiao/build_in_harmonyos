# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcoap3/4.3.5
homepage: "https://libcoap.net"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "./testdriver"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cmake -DENABLE_TESTS=ON ... && make && ./testdriver"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/testdriver.c
    source: libcoap-4.3.5/tests/testdriver.c
    description: "CUnit 总驱动：16 个套件 176 个测试（uri parser 33, byte value decoder 8, byte value encoder 8, option parser 14, pdu 17, error response 8, session 6, sendqueue 10, wellknown 4, tls 2, oscore 13, 等）"
    command: "./testdriver"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：coap_startup/cleanup 生命周期、coap_package_version、coap_pdu_init+coap_add_token+coap_add_option、coap_split_uri、coap_new_context（共 5 组 API 实调）"
    command: "./test_libcoap3"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1378
