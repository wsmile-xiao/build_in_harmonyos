# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.2.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.8"

# 软件名
software: "lib_fts"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: headeronly

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源；上游无 tag，使用 GitHub 官方归档 codeload URL）
  url: "https://github.com/forrestthewoods/lib_fts/archive/refs/heads/master.tar.gz"

  # 源码校验和
  sha256: "e7444838b4d3e3e1092e453e7c00cc7de8e13aad62e08bd03474a677605cb8cf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | headeronly | custom
  system: headeronly

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-tests-fuzzy_match-fts_fuzzy_match_test.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "上游无 git tag、无构建系统：header-only 库用 conanfile-headeronly.py.tmpl"
- "上游测试 Windows 反斜杠 include 路径需改为 POSIX 正斜杠才能编译"