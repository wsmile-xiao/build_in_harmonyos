# test_package/MANIFEST.yml — lib_fts 1.2.8
# 上游官方测试声明文件（CI L0e 强制要求）
# 详情: docs/TEST_QUALITY_SPEC.md

package: lib_fts/1.2.8
homepage: "https://github.com/forrestthewoods/lib_fts"

# 上游测试命令（上游无构建系统：无 ctest/make check/meson test；测试入口为
# tests/fuzzy_match/fts_fuzzy_match_test.cpp 交互式基准程序，无测试框架）
upstream_check_command: "none (header-only, no build system)"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试程序（交互式基准，无断言框架；编译并运行验证通过）
upstream_tests:
  - file: tests/fuzzy_match/fts_fuzzy_match_test.cpp
    source: codeload.github.com/forrestthewoods/lib_fts/tar.gz/refs/heads/master/tests/fuzzy_match/fts_fuzzy_match_test.cpp
    description: "交互式模糊匹配基准程序（单 main、无测试框架、非独立用例）"
    command: "./fts_fuzzy_match_test english_wordlist_2k.txt"

# test_package 中自带的测试（消费者视角验证 + HarmonyOS 专项 + 完整端到端消费者用例）
test_package_tests:
  - file: test.cpp
    description: "消费者用例：仅用公开头文件调用 fts::fuzzy_match/fuzzy_match_simple（文档语义示例）"
    command: "./test_lib_fts"
  - file: test_ohos.cpp
    description: "HarmonyOS 专项测试：路径模糊搜索/长字符串/多字节/评分语义"
    command: "./test_lib_fts_ohos"
  - file: consumer_e2e.cpp
    description: "完整端到端消费者用例：模拟设置项模糊搜索器业务组件（查询->匹配->排序->打开设置页），仅用公开头文件与公开 API"
    command: "./test_lib_fts_e2e wlan"

# 测试断言总数（按源码实际断言调用清点：test.cpp 12 + test_ohos.cpp 5 = 17，
# 与 conan-create.log 实际 PASS 行 12 + OHOS PASS 5 一致；上游基准程序无断言；
# consumer_e2e.cpp 为流程型端到端用例，含 E2E 自检但按流程用例计数，不重复计入断言）
assertion_count: 17