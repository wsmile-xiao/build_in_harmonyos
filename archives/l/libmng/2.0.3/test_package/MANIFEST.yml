# test_package/MANIFEST.yml — libmng 消费者功能测试
package: libmng/2.0.3
homepage: "https://www.libmng.com/"

# 上游 2.0.3 无正式测试套件（无 test/ 目录, make check 仅 all-am 递归, 无断言）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []

test_package_tests:
  - file: "test_package.c"
    description: |
      消费者功能测试 (TAP 1..31): T1 官方 fixture linux.mng
      (contrib/gcc/gtk-mng-view/, tarball 自带, 101x127, 20 帧内嵌
      PNG, TERM 无限循环) 整读 — 签名/processheader/尺寸/canvas 行;
      T2 程序化构造单帧 8x8 RGBA MNG (zlib crc32+compress2, MHDR+
      IHDR+IDAT+IEND+MEND, 无外部图片文件) 读取; T3 图像信息 API
      (get_sigtype/imagewidth/imageheight/framecount); T4 回调 ABI
      (memalloc/memfree/openstream/closestream/readdata 全链路计数,
      虚拟时钟动画模式 settimer+display_resume); T5 错误输入 (坏签名/
      未知 critical chunk BOGUS/纯噪声 → 非 NOERROR + getlasterror
      文本非空); T6 截断数据 (MHDR 前/中/后三档截断点全部拒绝)。
    command: "conan create archives/l/libmng/2.0.3 -pr:h ohos-aarch64 -pr:b ohos-aarch64"

fixtures:
  - file: "fixtures/linux.mng.b64"
    source: "libmng-2.0.3/contrib/gcc/gtk-mng-view/linux.mng"
    description: "官方 linux.mng 的 Base64 文本封装；测试时解码并校验原始 SHA256 59f1941cb335978a1c9e56c2845638f5dc2d6a9d87c59f89614683b1bff70553"
    sha256: "0ffcba37c12f82c5282f9be553b9a1d319119203ed43f49a43fa09fe89b28d58"

assertion_count: 31
