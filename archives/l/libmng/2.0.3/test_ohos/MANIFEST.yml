# test_ohos/MANIFEST.yml — HarmonyOS PC 专项验证
package: libmng/2.0.3
homepage: https://www.libmng.com/

# OpenHarmony PC 平台专项测试（独立于 test_package 的库 API 验证）
# 运行: conan test archives/l/libmng/2.0.3/test_ohos libmng/2.0.3 \
#       -pr:h ohos-aarch64 -pr:b ohos-aarch64
test_ohos_tests:
  - file: test_ohos.sh
    description: |
      鸿蒙交付验证 (bash + set -euo pipefail, 独立临时目录经
      trap EXIT/INT/TERM 清理, 失败/超时/中断均不残留、不写包目录)。
      OHOS 交付为 static-only (registry zlib/1.3.1 仅非 PIC 静态
      libz.a, OHOS+shared=True 被 conanfile validate() 拒绝), 10 项
      断言全部针对静态交付语义:
      H1 libmng.a 存在且包内无 libmng.so* (静态交付) + 归档成员全部
      ELF64 Little-Endian AArch64 (readelf -h, 失败 fail closed);
      H2 消费者 ELF 卫生: 针对包本体 libmng.a 编译链接的消费者,
      NEEDED 闭包恰好 {libjpeg.so.62, liblcms2.so.2, libc.so}
      (jpeg/lcms2 取 registry shared, zlib 以绝对路径链入静态
      libz.a — sysroot 有 libz.so, `-lz` 会被解析到系统库)、
      crc32 在 symtab 不在 dynsym (zlib 真实静态并入)、显式断言
      无 libturbojpeg 假依赖 (conan AutotoolsDeps 生成器假象, 配方
      已绕开)、无宿主 RPATH/RUNPATH; H3 .codesign 段 (readelf -S);
      H4 包内 libmng.a 无宿主路径 (strings 扫描); H5 真实 MNG 解码:
      消费者 C 程序针对包本体编译 (包头文件+libmng.a, 依赖 .a/.so/
      头由 conanfile 平铺 staging), OHOS 动态加载器加载, 对 Base64
      文本 fixture 解码并校验上游 SHA256 后还原官方 linux.mng —
      mng_initialize/readdisplay(虚拟时钟动画 resume)/尺寸 101x127/
      整帧 127 canvas 行 4 项 TAP 断言
    command: "conan test archives/l/libmng/2.0.3/test_ohos libmng/2.0.3 -pr:h ohos-aarch64 -pr:b ohos-aarch64"
    count: 10

assertion_count: 10
