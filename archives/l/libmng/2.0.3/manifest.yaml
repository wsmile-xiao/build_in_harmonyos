# 版本级 manifest — libmng 2.0.3
# 位置: archives/l/libmng/2.0.3/manifest.yaml

version: "2.0.3"
software: libmng
status: in_progress
build_date: "2026-09-11"
build_system: autotools

source:
  url: "https://sourceforge.net/projects/libmng/files/libmng-devel/2.0.3/libmng-2.0.3.tar.gz"
  sha256: "cf112a1fb02f5b1c0fce5cab11ea8243852c139e669c44014125874b14b7dfaa"
  tar_format: tar.gz

build:
  system: autotools
  # OHOS 交付 static-only: 默认 shared=False → --enable-static
  # --disable-shared (OHOS+shared 在 validate() 显式拒绝; 根因:
  # registry zlib/1.3.1 仅非 PIC 静态 libz.a, 见 knowledge_gained)
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-shared"
    - "--enable-static"
  dependencies:
    - zlib/1.3.1
    - libjpeg-turbo/3.0.4
    - lcms2/2.19
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-config-guess-ohos.patch"
    reason: |
      2012 版 config.guess/config.sub 不识别 aarch64-unknown-linux-ohos
      （E564 先例: libicns 同类补丁, libmng 用的 config.sub 较新, 锚点
      按 linux-musl*/-mingw64* 段修正）。
  - file: "patches/0002-configure-hmdfs-mktemp.patch"
    reason: |
      E114: HMDFS 上 `(umask 077 && mktemp -d "./confXXXXXX")` 可能
      假成功并产生后续不可写目录；改用上游已有的 `conf$$-$RANDOM`
      fallback 命名，继续以 `(umask 077 && mkdir "$tmp")` 创建，并执行
      实际写入/删除探针；探针失败即终止，不放宽 umask。
  - file: "patches/0003-automake-rebuild-noop.patch"
    reason: |
      tarball 是 automake 1.13 生成, 本机 automake 1.16; patch 触碰
      configure/Makefile.in mtime 后 am--refresh 链会尝试用 1.16 重建
      并因 configure.ac 语法差异失败 (Error 127)。将 Makefile.in 中
      4 条 autotools 重建规则 (am--refresh/Makefile.in/configure/
      aclocal.m4/config.h.in) no-op 化 (aaphoto 先例), 上游产物本身
      完好无需重建。

knowledge_gained:
  - "AutotoolsDeps 生成器把 libjpeg-turbo 双组件(libjpeg+turbojpeg)全展开进 LIBS, 上游 configure AC_CHECK_LIB 探测后原样接受 → 链接 shared libmng(上游/非 OHOS 能力)时假 NEEDED libturbojpeg.so.0; 解法: 不用 AutotoolsDeps, 手工 CPPFLAGS/LDFLAGS(-I/-L)+unset LIBS, configure 自行探测出干净 LIBS=-lz -ljpeg -llcms2 (elfutils 先例)"
  - "libmng 2.0.3 无测试套件: 无 test/ 目录, make check 仅递归 all-am, CMake 无 enable_testing; 以官方 fixture linux.mng + 程序化构造流补位消费者测试"
  - "libmng 公共头 libmng_types.h 直接 #include <zlib.h>/<jpeglib.h>/<lcms2.h>, 且 HAVE_LIBLCMS2 时 MNG_FULL_CMS=1 → zlib/jpeg/lcms2 均为 public 依赖(transitive_headers)"
  - "上游 -version-number 2:0:3 → libmng.so.2.0.2, SONAME libmng.so.2 (autotools libtool 规则: current=2,release=2,age=0)"
  - "mng_readdisplay 强制要求 7 个回调: openstream/closestream/readdata/processheader/getcanvasline/refresh/gettickcount/settimer; 缺任何一个返回 MNG_NOCALLBACK(3)"
  - "动画 MNG 的消费者模式: settimer 返回 TRUE + 循环 mng_display_resume 直到 rc != MNG_NEEDTIMERWAIT(15); gettickcount 用虚拟时钟(settimer 记录 delay, resume 前推进), 否则帧延时判断死循环"
  - "linux.mng fixture: 101x127, 20 帧内嵌 PNG (IHDR+IDAT+IEND ×20), TERM action=3 iteration=0 → 无限循环动画, MHDR simplicity=0x9 无 FRAM chunk → iFrameseq/get_currentframe 恒 0"
  - "E074: make 并行 jobserver FIFO 在 HMDFS mkfifo EPERM → make -j1"
  - "OHOS 交付 static-only: registry zlib/1.3.1 仅提供非 PIC 静态 libz.a, 链入 shared libmng 触发 AArch64 绝对重定位错误 (ld.lld: R_AARCH64_ADR_PREL_PG_HI21/R_AARCH64_ADD_ABS_LO12_NC ... recompile with -fPIC) → 默认 shared=False, OHOS+shared 在 validate() 显式拒绝 (bzip2 先例, 不用 linker 参数绕过); 上游 shared 能力 (SONAME libmng.so.2) 保留给非 OHOS 平台"

homepage: "https://www.libmng.com/"
license: "Zlib"

tests:
  upstream:
    command: "make check"
    cases: 0
    passed: 0
    note: |
      上游 2.0.3 无正式测试套件: 无 test/ 目录, automake check target
      仅递归 check-am → all-am (全量重链接验证), 无断言用例。
      (已核实 Makefile.am: check_PROGRAMS 未定义, TESTS 未定义)
  consumer:
    command: "test_package/test_package"
    cases: 31
    passed: 31
    pass_rate: "31/31 (100%)"
    note: |
      T1 官方 fixture linux.mng 整读(签名/MHDR 101x127/processheader/
      getcanvasline); T2 程序化构造单帧 MNG(zlib crc32+compress2, 无外部
      图片); T3 图像信息(sigtype/imagewidth/height/framecount); T4 回调
      ABI(alloc/free/open/close/readdata 全链路计数); T5 错误输入(坏签名/
      未知 critical chunk/纯噪声 + getlasterror 文本); T6 截断数据(三档
      截断点全部非 NOERROR 拒绝)。
  ohos:
    command: "test_ohos/test_ohos.sh"
    cases: 10
    passed: 10
    pass_rate: "10/10 (100%)"
    note: |
      H1 静态交付(libmng.a 存在且无 libmng.so*)+ 归档成员全部 ELF64 LE
      AArch64; H2 消费者 ELF 卫生: NEEDED 闭包恰好 {libjpeg.so.62,
      liblcms2.so.2, libc.so}(jpeg/lcms2 取 registry shared, zlib 以绝对
      路径链入静态 libz.a — sysroot 有 libz.so, `-lz` 会被解析到系统库)
      + 无 libturbojpeg 假依赖 + 无 RPATH/RUNPATH + crc32 在 symtab 不在
      dynsym(zlib 真实静态并入); H3 .codesign 段; H4 无宿主路径泄漏;
      H5 真实 MNG 解码(消费者程序针对包本体编译, OHOS 加载器加载, 4 项
      TAP)。
