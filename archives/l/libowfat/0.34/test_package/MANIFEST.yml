package: libowfat/0.34
homepage: https://www.fefe.de/libowfat/

upstream_check_command: "./t"
upstream_test_in_build: true
upstream_test_command: "make t && ./t"

upstream_tests:
  - file: t.c
    source: libowfat-0.34.tar.xz/t.c
    description: >-
      Upstream integration test binary. Links every object file carrying a
      UNITTEST macro (UNITTESTS = grep -l UNITTEST */*.c, 77 source files
      covering byte, str, fmt, scan, stralloc, buffer, socket, dns, cdb,
      critbit and the io layer). NOTE the inverted exit status: t returns
      (totalread == total), so EXIT 1 means all 1120372 bytes were echoed
      back and the suite PASSED; exit 0 means failure.
    command: "./t"
  - file: test/str.c
    source: libowfat-0.34.tar.xz/test/str.c
    description: "One of the 77 UNITTEST source files (str module)."
    command: "./t"

test_package_tests:
  - file: test_package.c
    description: >-
      Consumer test against the packaged archives: byte (byte_chr,
      byte_rchr, byte_equal, byte_diff), str (str_len, str_diff,
      str_equal, str_copy, str_start, str_chr), array (array_catb,
      array_cats, array_bytes, array_reset), buffer (BUFFER_INIT +
      buffer_put/buffer_puts/buffer_flush into a memory sink), fmt
      (fmt_str, fmt_ulong, fmt_xlong, fmt_ulong0), scan (scan_ulong,
      scan_xlong, scan_long, scan_8longn) and io (io_createfile +
      io_fd + io_waitwrite + io_readfile round-trip, falling back to a
      stralloc check when the CWD is read-only).
    command: "./test_package"

assertion_count: 34
