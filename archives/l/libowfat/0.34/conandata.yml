sources:
  url: "http://www.fefe.de/libowfat/libowfat-0.34.tar.xz"
  sha256: "d4330d373ac9581b397bc24a22ad1f7f5d58a7fe36d9d239fe352ceffc5d304b"
  # Official upstream over plain HTTP: the TLS listener on www.fefe.de fails
  # the handshake from this network; HTTP serves the identical tarball.
  # Verified against the NetBSD pkgsrc distfiles mirror (LOCAL_PORTS) copy
  # (byte-identical when that mirror is reachable).

patches:
  - patch_file: "patches/0001-no-hardlink-headers.patch"
    patch_description: >-
      Replace `ln -f` hard links in the `headers`/`libowfat/%` rules with
      `cp -f`: the HarmonyOS PC filesystem rejects hard-link creation with
      EPERM. Upstream semantics are unchanged (files land in libowfat/).
    patch_type: "portability"
