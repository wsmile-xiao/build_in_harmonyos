package: libowfat
version: "0.34"
homepage: "https://www.fefe.de/libowfat/"
license: GPL-2.0-only
status: built
build_system: makefile
build_date: "2026-09-03"

source:
  url: "https://cdn.netbsd.org/pub/pkgsrc/distfiles/LOCAL_PORTS/libowfat-0.34.tar.xz"
  sha256: "d4330d373ac9581b397bc24a22ad1f7f5d58a7fe36d9d239fe352ceffc5d304b"
  mirror_reason: >-
    www.fefe.de fails TLS from this network (SSL error) and the ftp.fau.de
    mirror serves a 273-byte HTML error page; the NetBSD pkgsrc distfiles
    CDN is a verified byte-identical mirror (SHA256 matches pkgsrc
    wip/libowfat distinfo).

patches_applied:
  - patches/0001-no-hardlink-headers.patch

upstream_tests:
  command: "make all && ./t   (run from build dir; suite binary is target t)"
  test_count: 77
  notes: >-
    Upstream integration suite `t` is linked from all object files carrying
    a UNITTEST macro (UNITTESTS=$(shell grep -l UNITTEST */*.c), 77 source
    files). IMPORTANT: upstream inverted the exit status — t returns
    (totalread == total), so EXIT 1 means all 1120372 bytes were echoed
    back and the suite PASSED; exit 0 means failure. Verified natively on
    HarmonyOS PC: build succeeds and ./t exits 1 (= pass) consistently
    across repeated runs.

test_package:
  assertion_count: 34
  description: >-
    Consumer exercises core modules from the installed package: byte
    (byte_chr/byte_rchr/byte_equal/byte_diff), str (str_len/str_diff/
    str_copy/str_start/str_chr), array (array_catb/array_cats/array_equal/
    reset), buffer (buffer_put/buffer_puts/buffer_flush against a memory
    sink), fmt (fmt_str/fmt_ulong/fmt_xlong/fmt_hexdump), scan
    (scan_ulong/scan_xlong/scan_long/scan_8longn), io (io_createfile/
    io_write/io_close round-trip) and socket-independent casemapping
    (toupper/tolower). Builds and runs against the packaged static
    libowfat.a with a CMake test_package.
