software: libnids
display: "libnids"
description: "基于 libpcap 的网络入侵检测开发库（IP 碎片重组、TCP 流重组、应用层协议解析）"
category: library
homepage: "https://libnids.sourceforge.io/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 1.24 的 config.guess/config.sub 为 2003 年老版本，不识别 ohos，最小 patch 更新为支持 aarch64-unknown-linux-ohos（复用 E007/E160 既有补丁模式）"
    - "configure 默认开启 libglib 支持，但 libnids 在 HAVE_LIBGTHREAD_2_0 下直接调用 g_thread_init()，该符号在 glib 2.84 已移除；配方以 --disable-libglib 关闭（E334 特性门控），glib 不进入依赖"
    - "libnet 默认启用仅影响 samples，配方以 --disable-libnet 关闭，主库仅依赖 libpcap"
    - "上游无 make check/test 目标；samples/ 演示程序默认 live capture（无 root/真实网卡即失败，不算 PASS），消费者验证由 test_package 以离线构造 pcap 驱动 nids_params.filename 路径完成（E287 同族）"
    - "产物 SONAME 为 libnids.so.<版本>（上游 Makefile 无 libnids.so 链接目标）；package() 补 libnids.so → libnids.so.<版本> 符号链接交付"
    - "static 变体归档 src/*.o 为 libnids.a，经 cpp_info.requires 传递 libpcap::libpcap（libnids.a 引用 pcap_* 符号）"
    - "1.26 走零补丁路线：显式 --build/--host 三元组绕过 config.guess 探测，构建期改写 config.sub/umask 077→022（HMDFS），详见 1.26/notes.md"
  common_dependencies:
    - "libpcap"

versions:
  "1.24":
    status: built
    build_date: "2026-09-17"
    source_url: "https://downloads.sourceforge.net/project/libnids/libnids/1.24/libnids-1.24.tar.gz"
  "1.26":
    status: built
    build_date: "2026-09-19"
    source_url: "https://github.com/MITRECND/libnids/archive/refs/tags/1.26.tar.gz"
