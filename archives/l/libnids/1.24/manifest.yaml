# 版本级 manifest — libnids 1.24
# 文件位置: archives/l/libnids/1.24/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-version.yaml

version: "1.24"

software: "libnids"

# 编译状态: published | built | failed | archived
# 双变体 conan create（ohos-aarch64）+ test_package 全 PASS；真机预检待 HMBS。
status: built

build_date: "2026-09-17"
build_system: "autotools"

source:
  url: "https://downloads.sourceforge.net/project/libnids/libnids/1.24/libnids-1.24.tar.gz"
  sha256: "314b4793e0902fbf1fdb7fb659af37a3c1306ed1aad5d1c84de6c931b351d359"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "CONFIG_SHELL=<bash> ./configure --host=aarch64-linux-ohos --prefix=<pkg> --disable-libglib --disable-libnet --disable-shared/--enable-shared 按变体"
    - "--disable-libglib：glib 2.84 已移除 g_thread_init()（HAVE_LIBGTHREAD_2_0 路径恒失败），关闭后主库零 glib 依赖（E334 特性门控）"
    - "--disable-libnet：libnet 仅被 samples 使用，主库不需要；关闭后 samples 中依赖 libnet 的程序不参与构建"
    - "--without-libpcre/--without-libnet：configure 不主动探测 pcre/libnet"
    - "CC/CFLAGS 经 Conan tools.build:compiler_executables 与 profile 传递（R33）"
  dependencies:
    - "libpcap/1.10.6（唯一真实链接依赖，PCAPLIB=-L<prefix>/lib -lpcap）"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-Makefile.in-shared-link-LDFLAGS.patch"
  - "0004-samples-overflows-rindex-strrchr.patch"
  - "0005-configure-umask-hmdfs.patch"

knowledge_gained:
  - "libnids 1.24 携带 2003 年版 config.guess/config.sub，aarch64-unknown-linux-ohos 不被识别；复用 E007/E160 模式最小更新两脚本即可通过 configure，无需改 configure.in"
  - "上游 1.24 无任何正式测试目标（无 make check/test、无 tests/ 目录），唯一可执行验证是 samples/ 演示程序；samples 默认 live capture（nids_init 不设 filename → pcap_open_live → dummy0 ioctl），无 root/网卡即失败，不算 PASS；test_package 以离线构造 pcap 驱动 nids_params.filename 路径完成真实消费者验证（E287 同族）"
  - "configure 的 --enable-libglib 路径在 glib>=2.32 以后必然编译失败（g_thread_init 已移除），必须 --disable-libglib；禁用后 libnids 主库纯 libpcap 依赖"
  - "上游 src/Makefile 只产 SONAME 文件 libnids.so.1.24（无 libnids.so 链接、无 .a/.so 并存 install 目标）；package() 手动 copy + 补 libnids.so → libnids.so.1.24 符号链接；static 包经 cpp_info.requires 传递 libpcap::libpcap"
  - "nids_run() 恒返 0（pcap_loop 对离线文件 EOF 也返 0），消费者测试判定必须依赖回调断言而非返回值（tcp.c L683）"
