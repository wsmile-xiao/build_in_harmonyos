# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnids/1.24
homepage: "https://libnids.sourceforge.io/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 libnids 1.24 无 make check/test 目标、无 tests/ 目录、无测试 harness，
# 官方自动测试数量为 0；samples/ 为示例程序（overflows/printall/sniff），
# 运行需 live capture（root + 真实网卡 + CAP_NET_RAW），不作为 PASS 前提。
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "(upstream ships no test target)"

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_package.c
    description: "离线 pcap 驱动 nids_init/nids_run：(single) TCP 流状态机 JUST_EST/DATA 双向 payload 精确比对/CLOSE；(multi) 双并发流 + 坏校验和静默丢弃 + 有效重传重组 + 选择性关闭；ELF64 AArch64、NEEDED libnids(shared)/无(static)、无宿主 RPATH/RUNPATH。pcap fixture 由 fixtures/gen_*.py 在 test() 开始时生成到构建临时目录（裸二进制 .pcap 无法随 GitCode PR diff 传输，packetq 1.7.3 先例），输出字节级可复现"
    command: "python3 fixtures/gen_one_tcp_flow.py <build>/one_tcp_flow.pcap && python3 fixtures/gen_flows.py <build>/flows.pcap && ./test_package single <build>/one_tcp_flow.pcap && ./test_package multi <build>/flows.pcap"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
