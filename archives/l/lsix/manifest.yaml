software: lsix
display: "lsix"
description: "Like ls, but for images: shows thumbnails of images directly in the terminal via SIXEL graphics"
category: terminal-graphics
homepage: "https://github.com/hackerb9/lsix"
license: GPL-3.0-or-later

build_system: custom

ohos_adaptation:
  key_points:
    - "纯 bash 脚本工具（单文件 341 行），无编译、无 ELF 产物、无需签名"
    - "脚本安装到包 res/ 目录（非可执行 bin/），以 env-bash shebang 分发"
    - "运行时依赖 imagemagick-full/7.1.2-23（magick/montage/convert 别名）和 bash/5.3"
    - "上游 v1.9.1 无测试目录、测试目标或测试样例"
    - "补丁将两处 stty 调用改为 command -v 守卫，使无 stty 的 HarmonyOS PC 运行时优雅降级"
    - "无终端环境真实契约：rc=0 + stdout 恰 2 字节 ESC-bSlash + stderr 报错（trap cleanup EXIT 覆盖 exit 1）"
    - "真实 sixel 渲染、终端能力/颜色/几何自检测、stty echo 切换无法在无 tty 的 CI 中验证"
  common_dependencies:
    - "imagemagick-full/7.1.2-23"
    - "bash/5.3"

versions:
  "1.9.1":
    status: built
    build_date: "2026-09-29"
