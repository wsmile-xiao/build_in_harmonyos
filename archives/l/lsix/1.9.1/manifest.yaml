# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lsix 是单文件 bash 脚本（341 行），不能套用 C/C++ 库适配方式；上游无构建系统、无测试"
  - "上游无 stty 时（HarmonyOS PC conanrun PATH）原版报 stty: command not found；实测非致命（bash 无 set -e，仍产出完整 sixel 流）但每次运行 stderr 有噪声，补丁用 command -v 守卫消除噪声并去掉脆弱前提"
  - "无终端真实契约：rc=0 + stderr 报错 + stdout 恰 2 字节 \\e\\\\（trap cleanup EXIT 内 exit 0 覆盖 line-119 exit 1）"
  - "magick 缺失时 exit 1 在 trap 注册前触发，故 rc=1 得以保留 — 与无终端分支行为不对称"
  - "ttygif 先例已沉淀 imagemagick conanrun PATH 经验、E272 已覆盖 stty 缺失家族问题，lsix 组合问题无足够普适性 → 路径 A"
