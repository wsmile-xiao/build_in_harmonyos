# test_package/MANIFEST.yml
# lsix v1.9.1 上游没有测试套件（无 tests 目录、无 CI、无 Makefile test 目标），
# 因此这里仅登记适配消费者测试（真实行为断言，覆盖 tty 边界外核心管线）。
package: lsix/1.9.1
homepage: "https://github.com/hackerb9/lsix"

upstream_check_command: "N/A (upstream v1.9.1 is a single 341-line bash script with no test target, test directory, or test samples)"
upstream_test_in_build: false
upstream_test_command: "N/A"
upstream_tests: []

supplemental_ohos_tests:
  - file: test.sh
    name: "package_layout_and_shebang"
    description: "验证 lsix 脚本以普通文件安装到包 res/ 目录、shebang 为 env-bash、Conan bash 版本满足上游 >= 4 要求。"
    command: "<Conan Bash> test.sh <lsix> <bash> <magick>"
  - file: test.sh
    name: "argument_parsing_no_hang"
    description: "验证 --help/未知参数被上游当作文件名传给 ImageMagick：脚本不挂起、rc=0、stdout 恰 2 字节 ESC-bSlash、stderr 含 NoDecodeDelegateForThisImageFormat 与 MissingAnImageFilename 原文。"
    command: "<Conan Bash> test.sh <lsix> <bash> <magick>"
  - file: test.sh
    name: "missing_imagemagick_boundary"
    description: "从 PATH 抽走 magick 后：rc=1、stdout 空、stderr 含上游原文 'Please install ImageMagick'（该 exit 1 在 trap 注册前触发，故保留）。"
    command: "<Conan Bash> test.sh <lsix> <bash> <magick>"
  - file: test.sh
    name: "no_sixel_terminal_boundary"
    description: "无 tty 时真实契约：rc=0（trap cleanup EXIT 覆盖 line-119 exit 1）、stdout 恰 2 字节 ESC-bSlash（hex 1b5c）、stderr 含 'does not report having sixel graphics support'。"
    command: "<Conan Bash> test.sh <lsix> <bash> <magick>"
  - file: test.sh
    name: "forced_sixel_core_pipeline"
    description: "LSIX_FORCE_SIXEL_SUPPORT=1 下纯红 PPM 完整跑通 montage→convert→sixel 管线：stdout 为 SIXEL 流（hex 头 1b50303b、尾 1b5c）、调色板 #0;2;100;0;0 为纯红。"
    command: "<Conan Bash> test.sh <lsix> <bash> <magick>"
  - file: test.sh
    name: "multi_image_montage"
    description: "双图 montage：调色板 #0 红、#1 蓝、#2 白（标签背景）、几何 '756x126' 双 tile 布局。"
    command: "<Conan Bash> test.sh <lsix> <bash> <magick>"
  - file: test.sh
    name: "ohos_patch_stty_noise_free"
    description: "HarmonyOS PC 专项：conanrun PATH 无 stty，验证 0001 补丁生效——全部运行（B/C/D/E/F）的 stderr 均无 'stty: command not found'（未打补丁原版必现该噪声）。"
    command: "<Conan Bash> test.sh <lsix> <bash> <magick>"

test_package_tests:
  - file: test.sh
    description: "Runs all seven real consumer boundaries above with Conan-provided bash and ImageMagick."
    command: "<Conan Bash> test.sh <lsix> <bash> <magick>"

upstream_test_count: 0
supplemental_ohos_test_count: 7
assertion_count: 33
