software: lm4tools
display: "lm4tools"
description: "TI Stellaris / Tiva C LaunchPad tools: lm4flash firmware flasher and lmicdi GDB-USB debug bridge"
category: system
homepage: "https://github.com/utzig/lm4tools"
license: "MIT AND BSD-3-Clause"
build_system: makefile

ohos_adaptation:
  key_points:
    - "两个独立 raw Makefile 子项目(lm4flash/ 与 lmicdiusb/), 无 configure/CMake, 均产出 CLI"
    - "两个 Makefile 均按 uname 分支(Linux/Darwin/FreeBSD)选 libusb 链接规则, OHOS uname=HarmonyOS 全不命中, 必须 make 命令行显式注入 LIBUSB_CFLAGS/LIBUSB_LIBDIR/LIBUSB_LIBS 或 CFLAGS/LDFLAGS(零补丁)"
    - "上游 tarball 的 lm4flash/bin/ 与 lmicdiusb/bin/ 含提交的预编译外来 ABI 二进制, make 前必须删除"
    - "上游无测试套件(两个 Makefile 均无 check/test 目标), 由 test_package 补全 22 项独立检查(功能 13 + 鸿蒙特有 9)"
    - "libusb 链接用 conan 依赖 cpp_info 直接拼 -I/-L, 不用包内未重定位的 libusb-1.0.pc"
    - "命令行工具, 已声明 commands.json (R38)"
    - "硬件边界: 实际刷写/调试需真实 Stellaris LaunchPad ICDI 板(USB VID:PID 1cbe:00fd), 无设备环境只能验证参数解析与干净失败"
  common_dependencies:
    - libusb

versions:
  "0.1.3":
    status: built
    build_date: "2026-09-29"
    conan_ref: "lm4tools/0.1.3"
    source_url: "https://github.com/utzig/lm4tools/archive/refs/tags/v0.1.3.tar.gz"
