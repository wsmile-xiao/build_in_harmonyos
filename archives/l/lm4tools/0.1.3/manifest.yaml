software: lm4tools
version: "0.1.3"
status: built
build_date: "2026-09-29"
build_system: makefile

source:
  url: "https://github.com/utzig/lm4tools/archive/refs/tags/v0.1.3.tar.gz"
  sha256: "e8064ace3c424b429b7e0b50e58b467d8ed92962b6a6dfa7f6a39942416b1627"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "lm4flash: CC + CFLAGS/LDFLAGS injected, pkg-config for libusb-1.0 provided by the libusb/1.0.27 conan package (CPPFLAGS -I<pkg>/include/libusb-1.0, LDFLAGS -L<pkg>/lib -lusb-1.0)"
    - "lmicdiusb: LIBUSB_CFLAGS/LIBUSB_LIBDIR/LIBUSB_LIBS injected on the make command line (the Makefile's uname Linux/Darwin/FreeBSD branches all miss OHOS)"
    - "make install DESTDIR-style via PREFIX=<package_folder> for both tools (both Makefiles install bin/ only)"
  dependencies:
    - libusb/1.0.27
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "lm4tools 0.1.3 builds two independent CLIs (lm4flash and lmicdi) from two raw recursive Makefiles; there is no top-level configure/CMake and no shared library."
  - "Both upstream Makefiles branch on uname (Linux/Darwin/FreeBSD) to locate libusb via pkg-config or *_LIBS variables; on OHOS none of the branches match, so the recipe must inject LIBUSB_CFLAGS/LIBUSB_LIBDIR/LIBUSB_LIBS (lmicdiusb) and explicit -I/-L (lm4flash) pointing at the conan libusb package."
  - "The upstream tarball ships prebuilt foreign-ABI binaries under lm4flash/bin/ and lmicdiusb/bin/; they must be deleted before make, otherwise a non-OHOS artifact gets packaged."
  - "Both Makefiles need PREFIX= for their install targets; `make install PREFIX=<pkg>` is enough to collect bin/lm4flash + bin/lmicdi."
  - "Upstream has no test suite: no check/test target in either Makefile and no tests/ tree."
  - "lm4flash's flash/verify paths and lmicdi's debug session require a physical Stellaris LaunchPad ICDI board (USB VID:PID 1cbe:00fd); on a device-less host they exit non-zero (255 via libusb_init failure or 1 'Unable to find any ICDI devices' / lmicdi abort 134), and must not be faked as passing."
  - "lm4flash's usage/version output goes to stdout (printf in flasher_usage()/show_version()), not stderr; only the libusb-stage errors go to stderr."
  - "Path A (no new knowledge): the uname-ifeq pattern and the .pc prefix-relocation issues are already covered by existing knowledge entries (E640 draft for uname-ifeq; E006/E028 family for .pc)."

verification:
  local_native_host: "manual mode-B build with the OHOS clang on this HarmonyOS aarch64 host -> both CLIs are ELF64 AArch64 OHOS binaries; used to validate the test assertions themselves"
  local_cross: "python3 scripts/ohc-run.py conan-verify lm4tools 0.1.3 --profile ohos-local"
  consumer_test: "test_package/test_lm4tools.sh <bin-dir> (runs on the HarmonyOS worker, gated by can_run())"
  ohos_specific_test: "test_package/ohos_abi_check.py --binary <package>/bin/{lm4flash,lmicdi} (pure Python ELF inspection, runs on any host)"
