# test_package/MANIFEST.yml - lm4tools 0.1.3
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）。详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径（唯一口径，贯穿 MANIFEST / notes.md / 测试日志 / PR 两张表）：
#   按「独立检查项数量」计数 —— 每个检查项可单独判定成败、单独打印 ok/FAIL，
#   同一检查项在 build() 与 test_package 各执行一次也只计 1 项。
#   适配后合计 22 项 = 功能补全 13 项（F1-F13）+ 鸿蒙特有 9 项（A1-A9）。

package: lm4tools/0.1.3
homepage: "https://github.com/utzig/lm4tools"

# ── 上游测试套件存在性（经审计官方 tar 包确认）────────────────────
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

upstream_test_audit:
  source_tarball: "v0.1.3.tar.gz (https://github.com/utzig/lm4tools/archive/refs/tags/v0.1.3.tar.gz)"
  source_sha256: "e8064ace3c424b429b7e0b50e58b467d8ed92962b6a6dfa7f6a39942416b1627"
  upstream_tag_commit: "5a91a1e95a70b7815a9a43720b1c56491959ff7c (tag v0.1.3)"
  build_system: >-
    两个独立 raw Makefile（lm4flash/Makefile 与 lmicdiusb/Makefile，无
    configure / 无 CMake / 无顶层构建入口），依赖 pkg-config 或显式
    LIBUSB_CFLAGS/LIBUSB_LIBS 变量提供 libusb。
  scanned_for:
    - "tests/ 或 test/ 目录内的可执行测试"
    - "lm4flash/Makefile 与 lmicdiusb/Makefile 中的 check / test 目标"
    - "gtest / criterion / check / CUnit 等 C 测试框架绑定"
    - "*_test.c / test_*.c 命名的测试源文件"
    - "CI 配置（.github/workflows、.travis.yml 等）"
  scan_result: >-
    tarball 共 47 个文件：顶层（.gitignore、README.md、LICENSE、Makefile 的
    软链行为由 README 说明）、lm4flash/（Makefile + lm4flash.c + 一个提交的
    bin/lm4flash 预编译二进制）、lmicdiusb/（Makefile + lmicdi.c + types.h +
    一个提交的 bin/lmicdi 预编译二进制）、外加 doc 与示例。两个 Makefile
    的目标只有 all/clean/install，没有 check 或 test 目标；仓库无 CI 配置，
    无第三方测试框架依赖，无 *_test.c / test_*.c 源文件。
  reason: >-
    lm4tools 0.1.3 上游无任何测试框架与测试目标（两个 Makefile 均无
    check/test 目标），按 no_tests 处理；适配后由 test_package 补全 22 个
    独立检查项。

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# ── test_package 自带的功能测试（上游无测试，适配后补全）──────────
# 执行位置: test_package/test_lm4tools.sh（can_run() 为真时在 HarmonyOS 上实跑）
#
# 硬件依赖边界（与 notes.md、PR 表同口径，不伪造硬件结果）：
#   lm4flash 的实际刷写回路与 lmicdi 的调试回路都需要真实 Stellaris
#   LaunchPad ICDI 板卡（USB VID:PID 1cbe:00fd）才能验证，本套件所在的无板
#   环境不可伪造其成功。因此本套件只断言两层可安全执行的行为：
#     (a) 参数解析层 —— 在 libusb_init() 之前完成的 -V/-h/无参/坏选项/
#         -S 对齐校验（F1-F5、F7、F10），退出码与输出文本均由源码唯一决定；
#     (b) 无设备路径 —— libusb 阶段在无板环境下必须干净失败（F6、F8、F9、
#         F11-F13），且绝不出现 rc=0（那意味着伪造了一次刷写成功）。
#   其余硬件行为（编程成功、verify 回读、debug 会话）记录在 notes.md 的
#   "requires real hardware" 一节，不属于本套件的通过条件。
test_package_tests:
  - file: test_lm4tools.sh
    description: >-
      功能补全 13 项（F1-F13），覆盖 lm4flash 全部参数解析路径与两个 CLI
      的无设备行为：F1 -V 打印 "LM4Flash version 0.1.3" 且 rc=0；F2 -h 打印
      "Usage: lm4flash" 概要且 rc=0；F3 无参数被拒（rc=1 + usage 文本，防止
      "无法执行"被误判为"正确拒绝"）；F4 未知选项 -q 被拒（rc=1 + usage）；
      F5 -S 0x1 未按 1024 字节擦除块对齐被拒（rc=1 + "must be ... aligned"）；
      F6 解析合法的 -S 0x400 + 文件在无 ICDI 板时干净失败（rc!=0，到达
      libusb 阶段）；F7 -S 拒绝逐字节可复现；F8 无板刷写失败时输出上游
      错误文本（Error initializing libusb / Unable to find any ICDI devices
      之一）；F9 缺失文件绝不报告成功（rc!=0）；F10 -s SERIAL 与未对齐 -S
      组合仍在参数层被拒；F11 lmicdi 无板时 rc!=0；F12 lmicdi stdout 保持
      为空（TRACE/错误走 stderr）；F13 lmicdi 在 10 秒内自行终止。
    command: "sh test_lm4tools.sh <bindir>"
    assertion_count: 13

# 鸿蒙特有测试（rule12: N >= 1，本包 N = 9）
# 上游是 ISO C + libusb-1.0，Makefile 以 uname 分支注入平台差异（Linux/
# Darwin/FreeBSD 三分支，OHOS 均不命中），故本次适配点全部落在工具链 /
# ABI / USB 库链接层，A1-A9 逐项锁定。两个 CLI 共用同一检查器，每个二进制
# 各跑一次（bin/lm4flash 与 bin/lmicdi）。
# 执行位置: test_package/ohos_abi_check.py，纯 Python 解析 ELF，不依赖
# readelf，因此交叉编译的开发机与鸿蒙 worker 上都能实跑（本机已实跑 9/9 ×2）。
harmonyos_specific_tests:
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A1: 产物为 ELF64 小端且 e_machine == EM_AARCH64(183)，即
      HarmonyOS PC arm64 目标。lm4flash/lmicdiusb Makefile 的 uname 三分支
      （Linux/Darwin/FreeBSD）在 OHOS 上全不命中，该断言证明配方显式注入
      的 OHOS clang 确实生效（负向对照：上游提交的预编译二进制为 Mach-O
      或宿主 ELF 时直接 FAIL）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/lm4flash"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A2: PT_INTERP == /lib/ld-musl-aarch64.so.1（鸿蒙 musl 动态
      加载器）；glibc sysroot 产物会是 /lib/ld-linux-aarch64.so.1，在鸿蒙上
      无法加载，故该断言可区分 sysroot 是否真的指向 OHOS。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/lm4flash"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A3: 存在 .note.ohos.ident 且 owner == "OHOS"。该段由 OHOS
      clang/lld 生成，是 knowledge/operations/harmonyos-specifics.md 明确
      记录且不可删除的平台标识段；通用 Linux 工具链不会产出。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/lm4flash"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A4: DT_NEEDED 恰为 musl libc.so + conan libusb soname
      （libusb-1.0.so.0），不含 glibc 风格版本化 soname 与任何宿主库。
      锁定链接目标是鸿蒙 musl 而非 glibc 或宿主 sysroot。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/lm4flash"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A5: libusb_* 导入符号（libusb_init/libusb_open 等）在
      .dynsym 中为 UND 且由 DT_NEEDED 的 libusb-1.0.so.0 满足。上游以 -lusb-1.0
      链接 libusb，OHOS 上 libusb 从 conan 包目录显式注入（Makefile uname
      分支不命中），该断言锁定这一关键差异确实生效。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/lm4flash"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A6: 包内产物不是上游 tarball 里提交的预编译二进制。断言检查
      魔数（ELF vs Mach-O）与 sha256，证明配方在 make 前删除了上游 bin/
      下的外来 ABI 产物并真的为鸿蒙重新链接（否则会打进一个无法在
      HarmonyOS 上执行的外来 ABI 产物）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/lm4flash"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A7: 无 DT_RPATH / DT_RUNPATH。构建机与 conan 缓存路径在鸿蒙
      设备上不存在，泄漏即运行时加载失败（与已合入的 seq-gen 1.3.5 同口径）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/lm4flash"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A8: PIE(ET_DYN + DF_1_PIE) + PT_GNU_RELRO + 不可执行
      PT_GNU_STACK(NX) + BIND_NOW 四项同时成立，即 OHOS HNP 对可执行文件的
      加固基线（CI L4 静态安全扫描检查同一组属性）。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/lm4flash"
    assertion_count: 1
  - file: ohos_abi_check.py
    description: >-
      鸿蒙特有 A9: 无 .gnu.version_r 的 GLIBC_* 版本需求，且无 GNU
      .note.ABI-tag。musl/OHOS 产物两者皆无，glibc 链接产物两者皆有，
      是比 soname 更底层的 libc 归属判据。
    command: "python3 ohos_abi_check.py --binary <pkg>/bin/lm4flash"
    assertion_count: 1

# 未断言 .codesign 的有无：按 knowledge/operations/harmonyos-specifics.md
# (E077)，配方先 llvm-objcopy --remove-section .codesign 再由
# binary-sign-tool 重新签名，因此该段在具备签名能力的鸿蒙 worker 上存在、
# 在交叉编译的开发机上不存在；任一方向的断言都依赖宿主，不可复现，故不纳入。

# 同一 ohos_abi_check.py 对 bin/lmicdi 再跑一遍（A1-A9 同口径，断言计数
# 相同的 9 项；lmicdi 无参数解析层，其功能面由 F11-F13 覆盖）。
# 注：harmonyos_specific_tests 按「独立检查项」计为 9 项，两个二进制各跑
# 一次同一检查器不重复计数（与 seq-gen 单二进制包的口径一致）。

# 测试断言总数（独立检查项：功能补全 13 + 鸿蒙特有 9）
assertion_count: 22
test_package_test_count: 13
harmonyos_specific_test_count: 9
count_method: "independent_check_items"
