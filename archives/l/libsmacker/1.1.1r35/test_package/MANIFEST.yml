# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsmacker/1.1.1r35
homepage: "http://libsmacker.sourceforge.net"

# 上游没有任何测试目标：Makefile.am 里没有 TESTS / check_PROGRAMS，
# 因此 `make check` 是 automake 生成的空目标（实测输出：
# "make: Nothing to be done for 'check'."）。这里如实登记该空目标。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libsmacker.c
    description: "consumer assertions over smk_open_*/smk_info_*/smk_enable_*/smk_first/smk_get_*/smk_close + the driver.c BMP dump path, driven by a synthesised .smk"
    command: "./libsmacker_test synthetic.smk"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 41
