# 版本级 manifest
# 文件位置: archives/l/libsmacker/1.1.1r35/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.1r35"

# 软件名
software: "libsmacker"

# 编译状态
# published | built | failed | archived
# 口径：合并 + release upload 确认前一律 built（AGENTS §1 O5）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（SourceForge 官方文件页直链）
  url: "https://sourceforge.net/projects/libsmacker/files/libsmacker-1.1/libsmacker-1.1.1r35.tar.gz"

  # 源码校验和
  sha256: "bb9c22c02ecda189a3389c9340a0eb6a8f287aa257099b54c3d9e1802a454630"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（config.guess 在 HarmonyOS 上不可用，故显式给三元组）
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--enable-static"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  # 运行期依赖为零；下列两项仅为构建期工具（tool_requires）
  dependencies:
    - "automake/1.18（tool）"
    - "libtool/2.5.4（tool）"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-install-header.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 Makefile.am 不安装公共头 smacker.h，需补 include_HEADERS 否则安装包不可用（与 Conan Center 同款补丁）"  # knowledge_ref: E742
  - "发行 tarball 无 configure 且用 AC_PROG_LIBTOOL：autoreconf 必须 tool_requires automake/1.18 + libtool/2.5.4（设备与 worker 只有 autoconf 家族）"  # knowledge_ref: E742
  - "config.guess 在 HMDFS 上因临时目录不可写而 unable to guess system type：显式 --build/--host=aarch64-unknown-linux-ohos 绕过探测"  # knowledge_ref: E742
  - "生成的 configure/config.status 内 umask 077 建 0700 临时目录在 HMDFS 不可写：build() 内归一为 umask 022 + mkdir -p 并打印命中/残留计数做反静默自检"  # knowledge_ref: E742
