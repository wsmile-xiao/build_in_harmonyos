# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "setup builddir"
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译器环境变量（meson 需要）
  env_vars:
    CC: "/storage/Users/currentUser/usr/local/bin/clang"
    CXX: "/storage/Users/currentUser/usr/local/bin/clang++"
    AR: "/storage/Users/currentUser/usr/local/bin/llvm-ar"
    RANLIB: "/storage/Users/currentUser/usr/local/bin/llvm-ranlib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - meson/1.11.1
    - ninja/1.13.1
    - nlohmann_json/3.11.2 (subproject, auto-downloaded)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-libpisp-backend-backend_prepare.cpp.patch"
  - "0002-src-libpisp-common-pisp_utils.cpp.patch"
  - "0003-src-libpisp-common-shm_mutex.hpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
