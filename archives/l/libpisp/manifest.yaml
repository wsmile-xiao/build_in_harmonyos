software: libpisp
display: "libpisp"
description: "Raspberry Pi ISP (Image Signal Processor) configuration library"
category: gfx
homepage: "https://github.com/raspberrypi/libpisp"
license: BSD-3-Clause
build_system: meson

ohos_adaptation:
  key_points:
    - "musl libc 不支持 pthread_mutexattr_setrobust，需条件编译排除"
    - "musl C++ 头文件不提供 std::size_t，需替换为 size_t"
    - "meson 构建需要显式设置 CC/CXX/AR 环境变量"
  common_dependencies: []
  knowledge_drafts:
    - E112: pthread_mutexattr_setrobust 缺失
    - E113: std::size_t 缺失

versions:
  "1.0.6":
    status: published
    build_date: "2026-06-11"