software: libgm2
# 版本级 manifest — archives/l/libgm2/16.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "16.1.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"

# 构建系统类型（顶层字段）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GCC releases/gcc-16 分支快照，含 Modula-2 前端 gcc/m2）
  url: "https://gcc.gnu.org/pub/gcc/snapshots/16-20260502/gcc-16-20260502.tar.xz"

  # 源码校验和
  sha256: "d78e2e56ee6f89e40dc742ae0c8a716ad4eb4637bc57bd49f9dec48ce9753283"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（GCC 顶层 configure）
  configure_options:
    - "--prefix=/"
    - "--libdir=/lib"
    - "--libexecdir=/libexec"
    - "--build=aarch64-linux-ohos --host=aarch64-linux-ohos --target=aarch64-linux-ohos"
    - "--enable-languages=c,c++,m2"
    - "--disable-bootstrap"
    - "--disable-lto"
    - "--disable-plugin"
    - "--disable-multilib"
    - "--disable-nls"
    - "--disable-libatomic"
    - "--disable-libitm"
    - "--disable-libsanitizer"
    - "--disable-libgomp"
    - "--disable-libquadmath"
    - "--disable-libssp"
    - "--disable-libvtv"
    - "--disable-werror"
    - "--without-isl"
    - "--disable-threads"
    - "--with-sysroot=<OHOS SDK native/sysroot>"
    - "--with-native-system-header-dir=/usr/include"

  # 编译依赖列表（格式: name/version，均为 build_requires）
  dependencies:
    - dejagnu/1.6.3.1
    - expect/5.45.4
    - tcl/8.6.16

  # 编译器（OHOS SDK Clang + clang-sign/clangxx-sign 签名包装器；
  # GNU as/ld 来自 /data/service/hnp/bin）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（conandata patches 为空；OHOS 适配通过
# files/prepare_ohos_sources.py 的有审核源码变换实现，见 notes.md）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 要求可执行 ELF 带 .codesign 签名（binary-sign-tool）；编译器包装器每次链接后签名，驱动 specs 用 *post_link: 追加签名步骤"
  - "HMDFS 上不能覆盖已签名可执行文件：`cp -p m2/stage1/cc1gm2 cc1gm2` 报 EPERM，须先 `rm -f` 目标再 cp（gcc/m2/Make-lang.in cc1gm2 规则）"
  - "config.guess 不识别 HarmonyOS（uname -s=HarmonyOS），嵌套 configure 须显式注入 --build/--host=aarch64-linux-ohos"
  - "OHOS SDK 头文件用 Clang 专属 __attribute__((__availability__(ohos, introduced=…)))，GCC 不解析；用 specs `%rename: cpp_old=cpp` 追加 -D__availability__(…)= 屏蔽"
  - "GCC 驱动存在 specs 文件时不自动传 --eh-frame-hdr，异常全部变 uncaught；须在 specs *link: 段前置 --eh-frame-hdr"
  - "HMDFS 用户映射下 autoconf `umask 077` 临时目录不可写，须改 umask 022（gcc/m2/gm2-libs/config-host 等）"
  - "OHOS /tmp 只读，mc 引导翻译器硬编码 /tmp/frag-*.frag 与 /tmp/mctemp. 改为当前目录"
  - "GCC --disable-threads 使 libgcc 选 gthr-single.h（缺 __gthread_cond_t），RTco.cc 编译失败；改 gthr-posix.h 用 OHOS musl pthread_cond_t"
  - "libstdc++-v3 在 OHOS 无法/无需构建：gm2spec.cc 无条件 -lstdc++，把 SDK libc++_static.a+libunwind.a 合并成 libstdc++.a 放入 -B gcc 目录"
  - "HarmonyOS Clang 默认 PIE，须置 gcc_cv_c_no_fpie/gcc_cv_no_pie=no 避免 LLD 生成无效 AArch64 copy relocation"
  - "GM2 运行时 .cc 用 OHOS SDK clang++（--target=aarch64-linux-ohos --sysroot + 签名）编译，CXX_FOR_TARGET 覆盖传入 make；需 GNU as/ld 而非 LLD"
  - "gcc/Makefile `$(SPECS): xgcc` 规则会在 configure/all-target-libgcc 期间用 `xgcc -dumpspecs` 覆盖手写 specs；须把 specs 写入移到 configure 之后并把该规则改为 `@touch $(SPECS)`"
  - "OHOS musl 无 pthread_cancel：gthr-posix.h 需在 __OHOS__ 下跳过 `__gthrw(pthread_cancel)` 声明、GTHR_ACTIVE_PROXY 回落 pthread_create（同 bionic）"

