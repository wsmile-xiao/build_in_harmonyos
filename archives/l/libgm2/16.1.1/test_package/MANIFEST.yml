# test_package/MANIFEST.yml — 上游官方测试声明
package: libgm2/16.1.1
homepage: "https://gcc.gnu.org/pub/gcc/snapshots/16-20260502/"

# 上游测试命令（make -n check / ctest -N / meson test --list 分析用）
upstream_check_command: "make -C gcc check-gm2"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "build() 用新构建的 gm2 驱动 + cc1gm2 编译并执行上游 examples/hello/pass/hello.mod（冒烟：验证 specs/__availability__/--eh-frame-hdr/post-link 签名/合并 libstdc++.a/5 个运行时库全链路）"

# 上游实际运行的测试程序（gcc/testsuite/gm2/** 113 个 .exp，DejaGNU）
upstream_tests:
  - file: gcc/testsuite/gm2/examples/hello/pass/hello.mod
    source: gcc-16-20260502/gcc/testsuite/gm2/examples/hello/pass/hello.mod
    description: "gm2 全量测试套件（113 个 .exp：builtins/calling-c/case/complex/coroutines/cpp/cse/dynamic/embedded/errors/examples/exceptions/extensions/fpu/imports/iso/isocoroutines/isolib/link/linking/pim/pimcoroutines/pimlib/projects/quads/recover/sets/switches/types/ulmlib/warnings）"
    command: "runtest --tool gm2 --srcdir <src>/gcc/testsuite --objdir <build>/gcc/testsuite --target aarch64-linux-ohos gm2/<subset>.exp（分批 b01..b13，见 reports/test-report.md 汇总）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libgm2.c
    description: "消费者测试：链接打包的 libm2iso/libm2pim + libstdc++.a stub，真实调用 m2pim_Builtins_strlen/strcmp 与 m2iso_CharClass_IsLetter/IsNumeric/IsUpper 运行时 API 并校验返回值（7 条断言）"
    command: "clang -O2 -Wl,--allow-shlib-undefined -L<lib> -lm2iso -lm2pim -lstdc++ -lm test_libgm2.c -o libgm2_test_program && LD_LIBRARY_PATH=<lib> ./libgm2_test_program"
  - file: ../test_consumer/consumer_use_case.c
    description: "消费者用例（端到端业务流程）：模拟配置清单预检报告器，用打包运行时 API 对文本清单做字符分类统计 + 长度计算 + 键值一致性校验，输出可观察报告（C1 执行 / C2 统计报告核验 / C3 consumer-ok 标记）"
    command: "sh ../test_consumer/consumer_use_case.sh <lib> clang"
  - file: ../test_ohos/run_ohos_test.sh
    description: "鸿蒙特有测试：OHOS_01 aarch64 ELF / OHOS_02 宿主路径泄漏 / OHOS_03 打包库真实运行（编译+链接+执行）/ OHOS_04 导出符号完整性"
    command: "sh ../test_ohos/run_ohos_test.sh <lib> clang"

# 鸿蒙特有测试用例数（rule12：≥1，本包 4 项 OHOS_01~OHOS_04）
ohos_specific_cases: 4

# 测试断言总数（近似值，用于质量评估；test_libgm2.c 7 + 消费者用例 3 + OHOS 专项 4）
assertion_count: 14
