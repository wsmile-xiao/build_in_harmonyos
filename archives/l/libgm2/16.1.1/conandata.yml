# conandata.yml — libgm2 16.1.1
# GCC 16 snapshot (releases/gcc-16 branch) Modula-2 runtime.
# sha256 verified against the exact tarball used for the HarmonyOS adaptation.
#
# URL lists (one sha256 below; every entry byte-identical): the OHOS CI worker
# runs with restricted egress and gcc.gnu.org is NOT in the CI mirror-rewrite
# table (ci/conan/build_and_test.sh get_mirrors only covers ftp.gnu.org /
# ftpmirror.gnu.org / github / gnome / kernel.org / xorg), so a lone
# gcc.gnu.org URL is attempted exactly once and fails: PR #13481 build #64212
# died with "Connection broken: IncompleteRead" after ~11MB of the 98.9MB
# snapshot.  Conan's download() walks this list on failure: the Sourceware
# mirror network first (documented worker-reachable by the merged
# gcc-snapshot/20260705 recipe, verified byte-identical 2026-10-01), then the
# official host last.  The GNU mirror network (tuna/ustc/aliyun/ftp.gnu.org)
# does NOT carry gcc snapshots (404 on snapshots/16-20260502/), so the snapshot
# list uses Sourceware only; gmp/mpfr/mpc are regular releases and use the CN
# GNU mirrors first (fast, already proven reachable by lib32-gcc builds).

