package: libquantum/1.0.0
homepage: "http://www.libquantum.de/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_tests_note: >-
  Upstream provides no formal test suite. Makefile.in defines only all/demos/
  quobtools/install/clean/distclean/dist targets — no check or test target.
  No test/ or tests/ directory exists. grover.c and shor.c are algorithm
  demonstrations with main() entry points, not self-checking unit tests.
  configure.in performs only feature detection (libm, 64-bit integer, complex
  number type, imaginary unit), no assertion-based runtime tests.

test_package_tests:
  - file: test_quantum.c
    description: >-
      Consumer creates a 2-qubit quantum register in basis state |00>, asserts
      initial width (2) and probability (1.0), applies a Hadamard gate to qubit
      0 and verifies the resulting uniform superposition: 2 non-zero basis
      states, each with probability 0.5, total probability 1.0. Applies a
      Pauli-X (sigma_x) gate to qubit 1 and re-verifies normalisation (2
      states, total probability 1.0). Performs a single-qubit measurement
      (quantum_bmeasure) and asserts the register collapses to exactly one
      basis state with probability 1.0 and a valid 0|1 bit result. Reports
      quantum_get_version() as a secondary sanity string.
    command: "./test_quantum"

assertion_count: 12
