sources:
  # Trusted distribution mirror: NetBSD pkgsrc distfiles CDN (also the
  # primary URL used by Homebrew's libquantum formula). The official site
  # www.libquantum.de mis-sends "Content-Encoding: x-gzip" on both HTTP and
  # HTTPS, which makes Conan's Python requests auto-decompress the .tar.gz
  # into a .tar and compute the gunzipped hash (5076fad1...) instead of the
  # canonical .tar.gz hash (b0f1a5...). The NetBSD CDN serves the identical
  # 223241-byte file with correct Content-Type and no Content-Encoding over
  # HTTPS, satisfying the repo's HTTPS-source convention. SHA256 verified
  # locally to match the Homebrew formula and pkgsrc distinfo (BLAKE2s/SHA512).
  url: "https://cdn.netbsd.org/pub/pkgsrc/distfiles/libquantum-1.0.0.tar.gz"
  sha256: "b0f1a5ec9768457ac9835bd52c3017d279ac99cc0dffe6ce2adf8ac762997b2c"

# No patches: no upstream source file is modified (zero patch). Build-system
# adaptation is done entirely in the recipe's build() method. See notes.md.
patches: []
