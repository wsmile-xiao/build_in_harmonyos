  sha256: "b0f1a5ec9768457ac9835bd52c3017d279ac99cc0dffe6ce2adf8ac762997b2c"

patches_applied: []

upstream_tests:
  command: ""
  test_count: 0
  notes: >-
    Upstream ships no formal test suite. The Makefile.in defines only `all`,
    `demos` (shor/grover algorithm demonstrations), `quobtools`,
    `install`, `clean`, `distclean` and `dist` targets — there is no `check`
    or `test` target. configure.in performs feature checks (libm, 64-bit
    integer type, complex number type, imaginary unit) but no assertion-based
    runtime tests. No test/, tests/ or examples/ directory exists in the
    source tree. grover.c and shor.c are algorithm demonstrations with main()
    entry points, not self-checking unit tests. Total/Pass/Fail/Skip = 0/0/0/0.

test_package:
  assertion_count: 12
  description: >-
    Consumer creates a 2-qubit quantum register in basis state |00>, asserts
    initial width/probability, applies a Hadamard gate and verifies the
    resulting uniform superposition (2 non-zero basis states, each with
    probability 0.5, total probability 1.0), applies a Pauli-X gate and
    re-verifies normalisation, then performs a single-qubit measurement and
    asserts the register collapses to exactly one basis state with probability
    1.0 and a valid 0|1 bit result. Version string is reported as a secondary
    sanity check, not the primary assertion.
