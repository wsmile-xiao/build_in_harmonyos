# 软件级 manifest — archives/l/libbrahe/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0（模板: templates/manifest-software.yaml）

software: libbrahe
display: "libbrahe"
description: "A heterogenous C library of numeric functions (PRNG, trig, rounding, GCF/LCM, statistics, FFT, pretty-printing)"
category: library
homepage: "https://web.archive.org/web/20191102085924/http://coyotegulch.scottrobertladd.net/products/brahe/index.html"
license: BSD-2-Clause

build_system: autotools

ohos_adaptation:
  key_points:
    - "上游作者站点已停放/域名失效，源码取 Debian pool 的 pristine libbrahe_1.3.2.orig.tar.gz（3.0 quilt，无 dfsg 改名）"
    - "随包 config.guess(2009-12-30)/config.sub(2010-01-22) 不认 HarmonyOS 与 linux-ohos 三元组，按 E007/E160 打补丁，不使用 --build/--host"
    - "config.status 的 umask 077 临时目录在 HMDFS 上不可写（E011），需把 configure 内两处改为 umask 022"
    - "conan ohos-aarch64 profile 导出的 hnp bash 在 HMDFS 构建目录内 getcwd 失败（E386），配方在 generate() 末尾重新声明 CONFIG_SHELL=SHELL=/bin/sh"
    - "上游 libtool 使用 -release 1.3，安装名为 libbrahe-1.3.so.3.0.1，同时保留 libbrahe.so/libbrahe.a，消费者仍用 -lbrahe"
  common_dependencies: []

versions:
  "1.3.2":
    status: built
    build_date: 2026-09-18
