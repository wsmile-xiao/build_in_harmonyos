sources:
  url: "https://deb.debian.org/debian/pool/main/libb/libbrahe/libbrahe_1.3.2.orig.tar.gz"
  sha256: "f102fed803ce1a75a1ee6bc56d2ddc0cedf9199e51d09a6e97fd3bec6f1ca98e"

patches:
  - patch_file: "patches/0001-config.guess-harmonyos-triplet.patch"
    patch_description: "Teach the bundled config.guess (2009-12-30) to report aarch64-unknown-linux-ohos on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-ohos-triplet.patch"
    patch_description: "Accept *-linux-ohos triplets in the bundled config.sub (2010-01-22)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask-022-hmdfs.patch"
    patch_description: "Use umask 022 for the config.status temp dir; HMDFS uid mapping makes 0700 dirs unwritable (E011)"
    patch_type: "portability"
  - patch_file: "patches/0004-test-rounding-expectation-sign.patch"
    patch_description: "Fix upstream test expectation literal: sigdig(-pi,8) is sign-preserving, expected value lacked the minus"
    patch_type: "portability"
