software: libbrahe
version: "1.3.2"
conan_ref: "libbrahe/1.3.2"
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/libb/libbrahe/libbrahe_1.3.2.orig.tar.gz"
  sha256: "f102fed803ce1a75a1ee6bc56d2ddc0cedf9199e51d09a6e97fd3bec6f1ca98e"
  tar_format: tar.gz
  upstream_note: "Author site offline; pristine upstream 1.3.2 tarball mirrored in the Debian pool (3.0 quilt, no dfsg/rename)"

build:
  system: autotools
  configure_options:
    - "--disable-shared --enable-static (Conan shared option default; shared=True flips them)"
    - "--disable-docgen (upstream default; keeps doxygen out of the build)"
  dependencies: []
  cc: clang

patches_applied:
  - "0001-config.guess-harmonyos-triplet.patch"
  - "0002-config.sub-ohos-triplet.patch"
  - "0003-configure-umask-022-hmdfs.patch"
  - "0004-test-rounding-expectation-sign.patch"

upstream_tests:
  command: 'LD_LIBRARY_PATH="src/.libs" ./test/<bin_PROGRAMS entry>, list parsed from test/Makefile.am'
  test_count: 6
  notes: "6 upstream console programs executed on device; 39 printed value comparisons, 0 mismatch after patch 0004; gcflcm self-reports 'found 0 error(s)' and fft prints 'Good data... success!'"

test_package:
  assertion_count: 43
  description: "Consumer program linked against the installed package covering rounding/significant digits, GCF/LCM, inverse hyperbolic identities, log helpers, array statistics, PRNG determinism and bounds, integer pretty-printing and sinusoid+FFT bin bounds."

knowledge_gained:
  - "2009/2010 世代的 config.guess/config.sub：scripts/patch-autotools-ohos.pl 的锚点是新版脚本结构（GUESS 变量），对老脚本只加分支不生效（Score 1/5、rc=1）；老脚本 case 分支必须写成 `echo \"...\" ; exit 0` 才能取代后续 CC 探测"
  - "config.sub 2010-01-22 已能直通 aarch64-*-linux-gnu，但拒绝 *-linux-ohos；在 '# Separate what the user gave…' 之前插入 early-exit 分支即可，不需要替换整个脚本（与 aiksaurus 的全量替换、a52dec 的 aarch64-gnu 白名单同族）"
  - "host_os=linux-ohos 时 2008 libtool 的 `linux*)` 分支仍然命中，无需额外三元组白名单，这也是不使用 --build/--host 的可行性依据"
  - "E011 命中点在 configure 的 config.status 生成段共 2 处（mktemp 与 mkdir 回退），只改 1 处仍会在回退路径复发"
  - "E386 复核：/data/service/hnp/bin/bash 在 HMDFS 构建目录内 `pwd` 即失败，导致 libtool install 丢路径（bash: /libtool）；配方 generate() 末尾用 Environment 重新声明 CONFIG_SHELL=SHELL=/bin/sh 后 install rc=0"
  - "上游 1.3.2 的 libtool `-release 1.3` 使安装名是 libbrahe-1.3.so.3.0.1，但同时保留 libbrahe.so/libbrahe.a 开发名，故 cpp_info.libs=[brahe] 可用；上游 libbrahe.pc 未安装且其 Libs 写作 -llibbrahe（上游笔误），因此不打包 .pc"
  - "上游 test/brahe_test_rounding.c 对 brahe_sigdig(-pi,8) 打印的期望值漏了负号；macOS 原生复现同一不匹配，证明与 OHOS 无关"
  - "上游 brahe_moving_average 在未初始化的 result[i] 上做 += 累加（读取未定义值），本包未对其建立断言"
