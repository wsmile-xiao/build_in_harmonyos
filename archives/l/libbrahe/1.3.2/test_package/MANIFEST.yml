# test_package/MANIFEST.yml — libbrahe 1.3.2 verification manifest
#
# Upstream registers six console test programs in test/Makefile.am
# (bin_PROGRAMS). They are built and executed by the recipe's build() step on
# this device, not by the consumer test below, and they are deliberately not
# installed into the package.
package: libbrahe/1.3.2
software: libbrahe
version: "1.3.2"
homepage: "https://web.archive.org/web/20191102085924/http://coyotegulch.scottrobertladd.net/products/brahe/index.html"

upstream_check_command: "none (1.3.2 has no check target; test/ programs are plain bin_PROGRAMS)"
upstream_test_in_build: true
upstream_test_command: 'LD_LIBRARY_PATH="src/.libs" ./test/brahe_test_prng && ... (one per bin_PROGRAMS entry)'

upstream_tests:
  - name: brahe_test_prng
    command: 'LD_LIBRARY_PATH="src/.libs" ./test/brahe_test_prng'
    expected: "exit 0; prints the Marsenne Twister/KISS/CMWC/MWC/ISAAC statistic tables"
  - name: brahe_test_trig
    command: 'LD_LIBRARY_PATH="src/.libs" ./test/brahe_test_trig'
    expected: "exit 0; atanh(tanh(x)) / asinh(sinh(x)) / acosh(cosh(x)) identities printed for +/-1, +/-4/3, +/-1.5"
  - name: brahe_test_rounding
    command: 'LD_LIBRARY_PATH="src/.libs" ./test/brahe_test_rounding'
    expected: "exit 0; 26 tonearest()/sigdig() comparisons, all agreeing after patch 0004"
  - name: brahe_test_gcflcm
    command: 'LD_LIBRARY_PATH="src/.libs" ./test/brahe_test_gcflcm'
    expected: "exit 0; 13 lcm()/gcf() comparisons plus the program's own 'found 0 error(s)' line"
  - name: brahe_test_fft
    command: 'LD_LIBRARY_PATH="src/.libs" ./test/brahe_test_fft'
    expected: "exit 0; 'Good data... success!' from the seven published FFT bin bounds"
  - name: brahe_test_pretty
    command: 'LD_LIBRARY_PATH="src/.libs" ./test/brahe_test_pretty'
    expected: "exit 0; comma and English-text renderings for the upstream value list"

test_type: installed-package
test_package_tests:
  - file: test_libbrahe.c
    name: test_libbrahe
    description: "Consumer contract against the packaged headers and library: rounding half-to-even, significant digits (including the sign-preserving sigdig(-pi,8) case), GCF/LCM, inverse hyperbolic identities, log2base/sizepow2, array statistics with n-1 variance, PRNG determinism and interval bounds, integer pretty-printing, sinusoid synthesis verified through the simple FFT"
    command: "./test_libbrahe"

executables:
  - name: test_libbrahe
    purpose: "installed-package API verification (link and run against the packaged libbrahe)"

cases: 1
assertions: 43
upstream_cases: 6
upstream_assertions: 39
