# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnet/1.2
homepage: "https://github.com/libnet/libnet"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libnet 1.2 tarball 的 make check 无实际测试用例 (只执行递归 make check 但各子目录无 test target)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 libnet_init/libnet_version/libnet_destroy API 验证库可用性"
    command: "./test_libnet"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
