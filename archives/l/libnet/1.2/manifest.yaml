software: libnet
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2"

# 编译状态
status: published

# 编译日期
build_date: "2026-08-14"

# 构建系统类型
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/libnet/libnet/releases/download/v1.2/libnet-1.2.tar.gz"
  sha256: "caa4868157d9e5f32e9c7eac9461efeff30cb28357f7f6bf07e73933fb4edaa7"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=${PREFIX}"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0006-include-libnet-libnet-structures.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "musl libc 不支持 __int64_t 类型，需替换为标准 int64_t"
  - "config.guess/config.sub 是自动生成文件，不应作为补丁提交；改用 --build=aarch64-unknown-linux-gnu 绕过 config.guess 探测"
  - "HMDFS 文件系统下 umask 077 创建的临时目录无法写入 (E114)，需移除 umask 077"
  - "libnet 是库类型，cpp_info.libs 应为 ['net']（lib前缀去掉）"
