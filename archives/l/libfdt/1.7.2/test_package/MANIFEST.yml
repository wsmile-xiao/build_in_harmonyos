# libfdt/1.7.2 test_package 上游测试声明
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: libfdt/1.7.2
homepage: "https://git.kernel.org/pub/scm/utils/dtc/dtc.git"

# 上游测试审计（结论：存在可执行的 libfdt C 套件，配方在 build() 全量运行）：
# 1) tests/Makefile.tests 定义 LIB_TESTS_L 66 个 + LIBTREE 3 个（truncated_*）+
#    DL_LIB_TESTS 2 个（asm_tree_dump/value-labels，非 STATIC_BUILD 时），合计 71 个
#    C 测试二进制，均链接 $(LIBFDT_dep)（本次构建的 libfdt），无 python/perl 依赖。
# 2) tests/*.dtb 夹具由 `make tests` 经 dumptrees 自动生成，非手工 fixture。
# 3) 完整 `make check`（2070 例，含 dtc/fdtget/fdtput/fdtoverlay 端到端）归同源
#    工具包 device-tree-compiler/1.7.2 所有；本库包 owning 71 个 libfdt API 用例，
#    避免跨包重复计数。
# 4) 全树无 gtest/pytest/ctest； DISABLED 列表为空，不存在静默跳过。
upstream_tests_exist: true
upstream_test_audit: "审计 dtc-1.7.2 上游（kernel.org dtc-1.7.2.tar.xz，sha256 92d8ca76…b237539）：tests/Makefile.tests 含 LIB_TESTS_L 66 个、LIBTREE 3 个、DL_LIB_TESTS 2 个（默认构建），合计 71 个 C 测试二进制，均链接本次构建的 libfdt；tests/*.dtb 由 dumptrees 生成；完整 make check 2070 例归同源工具包 device-tree-compiler/1.7.2，本库包执行其中 71 个 libfdt 子集。"

upstream_check_command: "make tests"
upstream_test_in_build: true
upstream_test_command: "sh tests/run_tests.sh -t libfdt"

upstream_tests:
  - file: tests/Makefile.tests
    source: dtc-1.7.2.tar.xz/tests/Makefile.tests
    description: "上游测试清单：LIB_TESTS 66 + LIBTREE 3 + DL 2 = 71 个 C 测试二进制定义"
    command: "make tests"
  - file: tests/testutils.c
    source: dtc-1.7.2.tar.xz/tests/testutils.c
    description: "上游测试公共驱动（PASS/FAIL 断言与树比对辅助）"
    command: "sh tests/run_tests.sh -t libfdt"

test_package_tests:
  - file: test_libfdt.c
    description: "消费者测试：fdt_create/finish 建树、compatible 属性往返、缺失属性/坏 magic 负向、magic/strerror，共 14 个 CHECK（R34 反空壳：全部经真实 libfdt API，失败即非零退出）"
    command: "test_libfdt"

# Counting unit: one harness testcase ("Total testcases" in TEST SUMMARY of
# `sh tests/run_tests.sh -t libfdt`), i.e. 71 C binaries from
# tests/Makefile.tests (LIB_TESTS 66 + LIBTREE 3 + DL 2) expanded by the
# harness with dtb fixtures into 1468 testcases. Single parseable framework,
# so upstream_test_count_method is auto. Matches true-machine evidence:
# discovered=1468, executed=1468, passed=1468, failed=0, skipped=0.
upstream_test_total: 1468
upstream_test_count_method: auto
upstream_test_passed: 1468
upstream_test_failed: 0
upstream_test_skipped: 0

assertion_count: 14
