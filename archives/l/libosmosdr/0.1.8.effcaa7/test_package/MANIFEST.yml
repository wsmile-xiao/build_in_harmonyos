# Upstream and consumer test declaration for CI L0e.
package: libosmosdr/0.1.8.effcaa7
homepage: "https://osmocom.org/projects/sdr/wiki/Libosmosdr"

# Upstream libosmosdr ships no test suite at all: the source tree has no tests/
# directory, no enable_testing()/add_test() call and no check/ctest target, so
# there is no upstream suite that could be executed and none is skipped. This
# package is deliberately NOT registered in ci/config/no_official_test.txt --
# a real test_package/ with executable consumer tests exists, so the exemption
# whitelist does not apply (see version-level manifest.yaml / notes.md).
upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_libosmosdr.c
    description: "TC-01 device enumeration on a host without OsmoSDR hardware; TC-02 error contract for absent devices (usb strings, open, close(NULL)); TC-03 (OHOS specific) libosmosdr.so loads through the OHOS musl loader and exports every public entry point"
    command: "./test_libosmosdr"
    executable: true
  - file: conanfile.py
    description: "TC-04 (OHOS specific) the packaged osmo_sdr command line tool executes on OHOS and reports its usage"
    command: "osmo_sdr"

assertion_count: 13
