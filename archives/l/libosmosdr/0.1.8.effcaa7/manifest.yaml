# Upstream ships no test suite at all: no tests/ directory, no
# enable_testing()/add_test() call and no check/ctest target in CMakeLists.txt.
# There is deliberately NO entry in ci/config/no_official_test.txt for this
# package: that file skips the L1a-L1d gates entirely, and this package has a
# real test_package which must be verified rather than exempted.
upstream_tests: false

functional_testing:
  date: "2026-09-16"
  report: "reports/test-report.md"
  result: "pass"
  pass_rate: "100%"
  tests_passed: 13
  tests_failed: 0
  tests_skipped: 0
  notes: >
    Upstream provides no test suite, so all 13 assertions are OHOS adaptation
    tests (4 test cases: TC-01 device enumeration, TC-02 error contract,
    TC-03 OHOS shared-object loadability, TC-04 OHOS osmo_sdr execution).
    Executed on the worker's own OHOS host via `conan create`, so the binary
    ran natively against the packaged artifacts.

platform_notes:
  - "上游 CMakeLists.txt 声明 cmake_minimum_required(VERSION 2.6)，CMake 4.x 拒绝 3.5 以下策略下限；通过 CMAKE_POLICY_VERSION_MINIMUM=3.5 缓存变量解决，未打补丁"
  - "上游 libosmosdr.pc.in 剥离构建期 -I 绝对路径的逻辑由 IF(CMAKE_CROSSCOMPILING) 守卫，而本平台是原生 OHOS 构建该标志为假，必须在 package() 中清理 .pc，否则 conan 缓存绝对路径被写入制品"
  - "上游同时安装 osmosdr_shared / osmosdr_static 两个同名库产物，需按 shared 选项裁剪，否则 -losmosdr 可能解析到错误变体"
  - "设备枚举在无 SDR 硬件的 worker 上返回 0、设备名为空字符串，行为安全无崩溃"
  - "未签名的 libosmosdr.so 可被 OHOS musl 加载器 dlopen 加载（实测通过），但仍保留 binary-sign-tool 签名步骤以符合平台惯例"

knowledge_gained:
  - "CMake 4.x 拒绝 cmake_minimum_required(VERSION <3.5) 的上游项目，用 CMAKE_POLICY_VERSION_MINIMUM 缓存变量免补丁解决 (ref: E187)"
  - "上游 CMake 用 IF(CMAKE_CROSSCOMPILING) 守卫构建路径剥离时，原生 OHOS 构建下该标志恒为假，守卫分支不执行，conan 缓存绝对路径被写入 .pc 并随制品发布 (ref: E580-draft-7C4E)"
  - "USB 库的公共 API 不检查 libusb_init()/libusb_get_device_list() 返回值时，无 USB 栈的运行环境（CI 容器）会解引用未初始化指针并 Signal 11；本机有 USB 时同一二进制正常，属环境相关崩溃 (ref: E581-draft-9B31)"

