software: luacheck
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.23.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.23.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型 (顶级字段，验证脚本需要)
build_system: luarocks

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mpeterv/luacheck/archive/refs/tags/0.23.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | luarocks
  system: luarocks

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.3.6
    - argparse/0.6.0
    - luafilesystem/1.8.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "luacheck 是纯 Lua 程序，不需要编译，只需复制文件"
  - "依赖 luafilesystem 和 argparse"
  - "启动脚本需要正确设置 LUA_PATH 和 LUA_CPATH 环境变量"