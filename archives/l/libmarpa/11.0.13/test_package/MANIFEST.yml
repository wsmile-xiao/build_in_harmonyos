# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 详见 docs/TEST_QUALITY_SPEC.md

package: libmarpa/11.0.13
homepage: https://github.com/jeffreykegler/libmarpa

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试程序（tests/TESTS，C TAP harness）
upstream_tests:
  - name: rule1
    command: "tests/simple/rule1"
    expected: "pass"
  - name: trivial
    command: "tests/simple/trivial"
    expected: "pass"
  - name: trivial1
    command: "tests/simple/trivial1"
    expected: "pass"
  - name: depr_unvalued
    command: "tests/simple/depr_unvalued"
    expected: "pass"
  - name: nits
    command: "tests/simple/nits"
    expected: "pass"
  - name: issue92a
    command: "tests/simple/issue92a"
    expected: "pass"
  - name: issue92b
    command: "tests/simple/issue92b"
    expected: "pass"
  - name: issue92c
    command: "tests/simple/issue92c"
    expected: "pass"

# test_package 消费者测试
test_package_tests:
  - file: test.c
    description: >-
      Version contract (marpa_check_version/marpa_version/11.0.13 globals),
      grammar construction (symbols, rules, start symbol, precompute),
      malformed-rule-id error path (MARPA_ERR_INVALID_RULE_ID), recognition
      of a 2-token input, full bocage/order/tree/value pipeline with
      token/rule step counting.
    command: "./libmarpa_test"

# 上游断言总数（C TAP harness, Files=8, Tests=896）+ 消费者断言数 (38 CHECK)
assertion_count: 934
