software: libmarpa
display: "Marpa parsing library (libmarpa)"
description: "The Marpa low-level parsing library (Earley/Leo, BNF grammars)"
category: dev
homepage: "https://github.com/jeffreykegler/libmarpa"
license: LGPL-3.0-or-later
repository: "https://github.com/jeffreykegler/libmarpa"
keywords:
  - marpa
  - parser
  - earley
  - bnf
  - grammar

ohos_adaptation:
  key_points:
    - "Rebuilds the upstream generation chain with ctangle (tool_requires cweb/4.12.2) instead of shipping pre-generated sources"
    - "Documentation payloads (PDF/info/html/tar) are replaced by placeholder files because pdftex/makeinfo/texi2any/texi2html are unavailable on the build host; installed code is unaffected"
    - "make dist dist-hook needs a git repo: the stage tree gets its own local repo holding the dist snapshot (GIT_LOG.txt provenance only)"
    - "Automake dist-gzip runs `gzip --best` which toybox gzip rejects (E402): a PATH front-end maps --best to -9 for that one command"
    - "Autoconf-generated configure creates its confXXXXXX temp dir with umask 077 under an HMDFS setgid build directory, so config.status cannot write subs*.awk (E114): the umask in that temp-dir creation scope of the generated stage/configure is relaxed to 022 after autoreconf, fail-closed on exact occurrence counts"
    - "No source patches: upstream Autotools build works unmodified for aarch64-linux-ohos"
  common_dependencies: []

versions:
  "11.0.13":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libmarpa/11.0.13"
    note: "GitHub tag v11.0.13 source; generation chain (ctangle -> work -> stage dist -> ac_dist) runs inside build()"
