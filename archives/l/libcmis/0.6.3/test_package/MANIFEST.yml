# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcmis/0.6.3
homepage: "https://github.com/tdf/libcmis"

# 上游测试命令 (顶层 `make check` 递归进入 qa/libcmis 与 qa/libcmis-c，
# 共 7 个 cppunit 测试程序；qa/mockup 只构建 noinst 辅助库，无 TESTS；
# test-c-build 仅编译不运行；gdrive/onedrive 上游已注释掉 "need updating")
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"
upstream_test_total: 7
upstream_test_count_method: autotools_tests

upstream_tests:
  - file: qa/libcmis/test-utils
    source: libcmis-0.6.3.tar.gz/qa/libcmis/test-commons.cxx
    description: "上游 commons/decoder/soap/xmlutils 离线单元测试 (cppunit)"
    command: "qa/libcmis/test-utils"
  - file: qa/libcmis/test-json
    source: libcmis-0.6.3.tar.gz/qa/libcmis/test-jsonutils.cxx
    description: "上游 JSON 工具离线单元测试 (cppunit)"
    command: "qa/libcmis/test-json"
  - file: qa/libcmis/test-atom
    source: libcmis-0.6.3.tar.gz/qa/libcmis/test-atom.cxx
    description: "上游 AtomPub 绑定测试 (mockup 本地桩 + DATA_DIR fixtures，无网络)"
    command: "qa/libcmis/test-atom"
  - file: qa/libcmis/test-factory
    source: libcmis-0.6.3.tar.gz/qa/libcmis/test-factory.cxx
    description: "上游 SessionFactory 测试 (mockup 本地桩，无网络)"
    command: "qa/libcmis/test-factory"
  - file: qa/libcmis/test-sharepoint
    source: libcmis-0.6.3.tar.gz/qa/libcmis/test-sharepoint.cxx
    description: "上游 SharePoint 绑定测试 (mockup 本地桩，无网络)"
    command: "qa/libcmis/test-sharepoint"
  - file: qa/libcmis/test-ws
    source: libcmis-0.6.3.tar.gz/qa/libcmis/test-ws.cxx
    description: "上游 WebServices 绑定测试 (mockup 本地桩，无网络)"
    command: "qa/libcmis/test-ws"
  - file: qa/libcmis-c/test-api
    source: libcmis-0.6.3.tar.gz/qa/libcmis-c/test-api.cxx
    description: "上游 C 绑定 API 测试 (cppunit，allowable-actions/document/folder/object/property/repository/session)"
    command: "qa/libcmis-c/test-api"

test_package_tests:
  - file: test_libcmis.cpp
    description: "消费者冒烟测试: PropertyType 构造/取值、Property 存取与 XML 序列化、Exception 共 6 项真实 API 断言"
    command: "./test_libcmis"

assertion_count: 6

# 测试接入说明 (HMBS 机器证据):
# - build() 分两阶段真机执行: 先 `make check TESTS= -j1` 编译全部测试程序
#   (SDK-first loader 前缀保 lld 启动)，再 `make check -j1` 运行
#   (conan-only loader 前缀)，输出 tee 到日志并加总所有 automake
#   "# TOTAL" 小节得到真实计数，持久化为 build_folder/hmbs_upstream.json，
#   随后立即输出 HMBS_UPSTREAM_TEST_RESULT=<同一 JSON> (非全绿抛异常)。
# - package() 把 hmbs_upstream.json 复制进包内 res/。
# - test_package test() 先从 <package>/res/hmbs_upstream.json 复发
#   HMBS_UPSTREAM_TEST_RESULT，再直接执行 ./test_libcmis 统计 CHECK-OK
#   行数并输出 HMBS_TEST_PACKAGE_RESULT (包缓存命中时 build() 不重跑，
#   仅 test_package 每轮必跑，保证标记每轮出现)。
# - 计数全部来自真机测试框架输出，不写死、不估算；文件缺失或 status 非
#   passed 均抛 ConanException 显式失败，不静默通过。
