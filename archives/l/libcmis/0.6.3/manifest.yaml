# 版本级 manifest
# 文件位置: archives/l/libcmis/0.6.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.6.3"
software: "libcmis"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "autotools"

source:
  url: "https://github.com/tdf/libcmis/releases/download/v0.6.3/libcmis-0.6.3.tar.gz"
  sha256: "a7de8359f002e91cc430fcdfc14e1bb9cb45ac6a47ead8905f88f589b1eca6a2"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-man"
    - "--disable-werror"
    - "--disable-client"
    - "--enable-tests"
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies:
    - curl/8.15.0
    - libxml2/2.15.3.1
    - openssl/3.5.6.1
    - boost/1.90.0.4
    - cppunit/1.15.1
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-qa-tmpfile-tmpdir-fallback.patch"  # qa-only, tmpfile TMPDIR fallback; no assertions touched

knowledge_gained:
  - "libcmis 的 mockup 测试无需网络：qa/mockup 拦截 curl，fixtures 随包发布"
  - "musl tmpfile() 硬编码 /tmp（无视 TMPDIR），只读 /tmp 上 qa 的 tmpfile 调用会失败：已用 TMPDIR 回退补丁覆盖 3 个 qa 文件"
  - "boost.m4 不走 pkg-config，需 --with-boost=<conan boost 包根目录> 显式指向"
  - "顶层 make check 有多个 automake 小节，TOTAL 计数必须加总而非取单个"
