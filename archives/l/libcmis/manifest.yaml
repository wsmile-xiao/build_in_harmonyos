# 软件级 manifest
# 文件位置: archives/l/libcmis/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: libcmis
display: "libcmis"
description: "C++ client library for the CMIS (Content Management Interoperability Services) protocol"
category: library
homepage: "https://github.com/tdf/libcmis"
license: "MPL-1.1 OR GPL-2.0-or-later OR LGPL-2.1-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 构建：--without-man --disable-werror --disable-client --enable-tests"
    - "boost.m4 需 --with-boost=<conan boost 包根目录> 显式指向"
    - "上游 7 个 cppunit 测试程序全部离线（mockup 桩 + 随包 fixtures）"
    - "顶层 make check 有多个 automake 小节，TOTAL 计数需加总"
  common_dependencies:
    - curl
    - libxml2
    - openssl
    - boost
    - cppunit

versions:
  "0.6.3":
    status: built
    build_date: "2026-09-19"
