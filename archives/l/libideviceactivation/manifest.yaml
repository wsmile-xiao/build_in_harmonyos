software: libideviceactivation
display: "libideviceactivation"
description: "Library and tool to activate/deactivate iOS devices (libideviceactivation-1.0)"
category: system
homepage: "https://github.com/libimobiledevice/libideviceactivation"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess(2018-03-08) 不识别 HarmonyOS → 显式 --build=aarch64-unknown-linux-gnu"
    - "HMDFS 上 umask 077 + mktemp -d 生成 mode 2700 不可写目录 → mktemp wrapper 强制走 mkdir 回退"
    - "依赖包 .la 烘焙 //lib 失效 → 消费者侧把依赖 lib/*.la 改名 .la.bak"
    - "上游零自动化测试；CLI 三子命令需真实 iOS 设备"
  common_dependencies:
    - libimobiledevice
    - libplist
    - libcurl
    - libxml2

versions:
  "1.1.1":
    status: built
    build_date: "2026-09-22"
