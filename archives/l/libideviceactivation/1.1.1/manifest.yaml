software: libideviceactivation
version: "1.1.1"
status: built
build_date: "2026-09-22"
conan_adapt_date: "2026-09-22"
compile_date: "2026-09-22"
build_system: autotools

source:
  url: "https://github.com/libimobiledevice/libideviceactivation/releases/download/1.1.1/libideviceactivation-1.1.1.tar.bz2"
  sha256: "4dfb01068554e889d4fff78f4a7ab4e8d87819148d4e57a9dccbec51b8edc712"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - libimobiledevice/1.3.0
    - libplist/2.3.0
    - libcurl/8.5.0
    - libxml2/2.15.3.1
  cc: clang
  cxx: clang++

patches_applied: []

# 每条均引用已有知识条目（knowledge_ref），无新增草稿 —— 四处 OHOS 现象在知识库中
# 均已有对应 E 条目，本次为复用/交叉验证而非新发现。
knowledge_gained:
  - "config.guess(2018-03-08) 不识别 HarmonyOS（uname -s=HarmonyOS / HongMeng Kernel），configure 'cannot guess build type'；用显式 --build=aarch64-unknown-linux-gnu 规避；config.sub 亦不识别 ohos 三元组故不传 --host/--target  knowledge_ref: E007, E160, E072"
  - "HMDFS 上 `umask 077 && mktemp -d` 生成 mode 2700 (drwx--S---) 目录属主也不可写，config.status 写 subs1.awk 报 Permission denied 'could not setup config files machinery'；mktemp wrapper（恒 exit 1）迫使回退到 `umask 077 && mkdir`（HMDFS 归一为 2771 可写）  knowledge_ref: E011, E114, E129"
  - "依赖包 .la 的 libdir 烘焙为 //lib、dependency_libs 含构建机绝对路径 → libtool 优先解析 .la 报 'not a valid libtool archive'；消费者侧把依赖 lib/*.la 改名 .la.bak 使其回退到 -L/-l  knowledge_ref: E236"
  - "AutotoolsDeps 会把依赖闭包写进 LIBS，使 AC_PROG_CC 最早的 conftest 运行探测链接整条共享闭包而失败（Error loading shared library libcurl.so）；只用 PkgConfigDeps 即可规避  knowledge_ref: E467"
  - "Conan 2.29 CMakeDeps 对非直接（传递）依赖生成的 <pkg>_INCLUDE_DIRS 为空，且静态库的传递依赖被 CMake 按 $<LINK_ONLY> 处理不传播 include；配方侧 transitive_headers=True 使其恢复  knowledge_ref: E216, E480, E447"
  - "默认 shared=False 静态库形态下，消费者 test_package 必须显式链接上游依赖 target 才能拿到公共头 libideviceactivation.h 所 include 的 plist/libimobiledevice 头路径  knowledge_ref: E221, E216"
  - "CLI 动态依赖 libcurl.so/libxml2.so.16，OHOS 加载器无 conan 缓存 lib 默认搜索路径 → CI L2 裸跑 --version 失败（非阻塞）；需 conanrun/VirtualRunEnv 提供 LD_LIBRARY_PATH  knowledge_ref: E019, E499"
  - "上游零自动化测试：无 tests/、无 TESTS/check_PROGRAMS 注册，make check 为 no-op；CLI 三子命令需真实 iOS 设备，质量保证只能落在 test_package  knowledge_ref: E054"
