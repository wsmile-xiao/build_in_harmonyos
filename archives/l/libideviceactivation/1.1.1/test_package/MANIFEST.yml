# test_package/MANIFEST.yml
# libideviceactivation 1.1.1 测试声明（上游测试入口 + test_package 用例）
#
# 上游测试入口核验（实测，见 .libideviceactivation/logs/22_make_check.log）：
#   $ make check   → rc=0，各子目录均为 "Nothing to be done for 'check'."
#   上游 tarball 无 tests/ 目录，Makefile.am 全量无 TESTS/check_PROGRAMS/check-local
#   注册（grep 无任何输出），tarball 内 `find . -iname "*test*"` 结果为 0 条
#   → 上游不存在自动化测试套件，make check 为 automake 空操作。

package: libideviceactivation/1.1.1
homepage: "https://github.com/libimobiledevice/libideviceactivation"

# 上游构建系统的测试入口命令（automake 约定；实测为空操作）
upstream_check_command: "make check"

# build() 中是否集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# 上游唯一可执行入口 = CLI ideviceactivation（man/ideviceactivation.1），
# 三个子命令 activate/deactivate/state 均需真实 iOS 设备 + usbmuxd 守护进程，
# 本环境实测均为 "ERROR: No device found!"（rc=1），无法作为自动化用例。
upstream_cli_entry:
  binary: ideviceactivation
  commands: ["activate", "deactivate", "state", "--version", "--help"]
  device_required: true
  evidence: ".libideviceactivation/logs/23_upstream_cli_all_commands.log"

# test_package 用例（消费者视角，OHOS 目标）
test_package_tests:
  - file: test_package/test.c
    description: "消费者 API 测试：请求/响应生命周期 + libplist 字段往返 + libxml2 HTML 解析/XPath + 鸿蒙平台身份断言"
    command: "./test_libideviceactivation"
  - file: test_package/conanfile.py
    description: "鸿蒙特有用例 OHOS-1 ohos_elf_interp：打包 CLI 必须嵌入 /lib/ld-musl-aarch64.so.1"
    command: "python: test() 内嵌断言"
  - file: test_package/conanfile.py
    description: "鸿蒙特有用例 OHOS-2 ohos_runtime_closure：conanrun 环境下执行 ideviceactivation --version 退出码 0"
    command: "ideviceactivation --version"
  - file: test_package/test.c
    description: "鸿蒙特有用例 OHOS-3/4/5：运行时 sysname==HarmonyOS / machine==aarch64 / sizeof(void*)==8"
    command: "./test_libideviceactivation"

# 鸿蒙特有用例总数（要求 ≥1）
ohos_specific_case_count: 5

# 断言总数：test_package/test.c 内 15 条 CHECK + conanfile.test() 内 2 条鸿蒙特有断言 = 17 条
# （另：ctest 报 1 个 test suite；test.c 运行期自报 "checks: 15, failures: 0"）
# 鸿蒙特有用例共 5 条 = conanfile.test() 2 条（ohos_elf_interp / ohos_runtime_closure）
#                          + test.c 3 条（sysname / machine / pointer-width）
assertion_count: 17
