# conandata.yml — libomptarget-rtl 18.1.8
# 官方 openmp 独立 tarball（仅含 openmp/ 树）；LLVM cmake 公共模块在
# conanfile.py source() 中生成（ExtendPath.cmake / LLVMCheckCompilerLinkerFlag.cmake）。

sources:
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/openmp-18.1.8.src.tar.xz"
  sha256: "60ed57245e73894e4a2a89b15889f367bd906abfe6d3f92e1718223d4b496150"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Use local cmake modules (openmp tarball lacks LLVM root cmake/)"
    patch_type: "portability"
  - patch_file: "patches/0002-libomptarget-plugins-nextgen-aarch64-CMakeLists.txt.patch"
    patch_description: "Build aarch64 offloading plugin on HarmonyOS (CMAKE_SYSTEM_NAME gate)"
    patch_type: "portability"
  - patch_file: "patches/0003-libomptarget-plugins-nextgen-common-src-JIT.cpp.patch"
    patch_description: "Adapt JIT.cpp to LLVM 20 API (LLVMTargetMachine removed)"
    patch_type: "portability"
  - patch_file: "patches/0004-runtime-src-CMakeLists.txt.patch"
    patch_description: "Set libomp VERSION/SOVERSION so consumers link libomp.so.5 (SONAME)"
    patch_type: "portability"
  - patch_file: "patches/0005-runtime-src-kmp.h.patch"
    patch_description: "Disable KMP_CANCEL_THREADS when pthread_cancel unavailable (capability macro, R8-compliant)"
    patch_type: "portability"
