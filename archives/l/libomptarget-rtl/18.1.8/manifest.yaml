# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.1.2 无 Platform/HarmonyOS 模块，需注入 include(Platform/Linux) 的 HarmonyOS.cmake 到 CMAKE_MODULE_PATH，否则 SONAME 缺失导致 DT_NEEDED 用构建树相对路径"
  - "plugins-nextgen 各插件按 CMAKE_SYSTEM_NAME 匹配平台，HarmonyOS 需扩展匹配正则（'Linux|HarmonyOS'）"
  - "libomptarget CMakeLists 默认 LIBOMPTARGET_USE_LTO=TRUE 在 CMAKE_CXX_FLAGS 之后追加 -flto，会覆盖 -fno-lto；必须 LIBOMPTARGET_USE_LTO=FALSE 在源头禁用 LTO（musl loader 拒绝 LTO 产物）"
  - "系统 libffi 存在时 find_package(FFI) 会让 aarch64 插件进入链接 libffi 模式并因 ffi/ffi.h include 路径失败；CMAKE_DISABLE_FIND_PACKAGE_FFI=TRUE 强制自包含 dlopened-libffi 模式"
  - "libomptarget.rtl.aarch64.so 链接 libLLVM.so.20.1（NEEDED），引用 LLVM_20.1 符号版本；HarmonyOS musl dlopen 对含 .gnu.version_r 的 ELF 返回 EACCES，运行时 dlopen 受限（同 libomptarget 主库，test_package 构建链接验证 + 跳过运行时）"

