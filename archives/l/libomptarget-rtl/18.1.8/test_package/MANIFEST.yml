# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libomptarget-rtl/18.1.8
homepage: "https://openmp.llvm.org"

# 上游测试命令
upstream_check_command: "llvm-lit libomptarget/test"
# libomptarget 上游 lit 测试（201 个含 RUN: 指令的测试文件：130 .c + 56 .cpp +
# 15 .f90）已通过 generic-elf-64bit 插件 + libffi 在宿主 CPU 真实运行（无 GPU
# 依赖）；结果 27 passed / 112 failed / 62 unsupported（62 个 REQUIRES 特性缺失
# 跳过，112 个失败为真实执行结果，主因宿主 CPU 执行设备镜像 SIGSEGV）。
upstream_test_in_build: true
upstream_test_command: "llvm-lit -j 4 --no-progress-bar libomptarget/test"

# 上游实际运行的测试程序
upstream_tests:
  - file: libomptarget/test
    source: openmp-18.1.8.src/libomptarget/test
    description: "libomptarget lit 测试套件（201 个含 RUN: 指令的测试文件，generic-elf-64bit + libffi 宿主 CPU 真实执行：27 passed / 112 failed / 62 unsupported）"
    command: "llvm-lit"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "链接 libomptarget.rtl.aarch64.so，调用 __tgt_rtl_number_of_devices 验证 RTL 插件库可安装可链接"
    command: "./test_libomptarget_rtl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
