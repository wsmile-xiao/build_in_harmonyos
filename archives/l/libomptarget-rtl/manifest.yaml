software: libomptarget-rtl
display: "libomptarget-rtl - LLVM OpenMP Offloading RTL Plugin Library"
description: "libomptarget-rtl is the RTL plugin library of the LLVM OpenMP offloading runtime (openmp/libomptarget/plugins-nextgen). It ships the target plugin libomptarget.rtl.aarch64.so (aarch64 generic-ELF64 NextGen, dlopened-libffi mode), mirroring the Alpine libomptarget-rtl packaging."
category: library
homepage: "https://openmp.llvm.org"
license: Apache-2.0 WITH LLVM-exception
build_system: cmake

ohos_adaptation:
  key_points:
    - "Built standalone (OPENMP_STANDALONE_BUILD=ON) from the official openmp-18.1.8.src.tar.xz"
    - "Consumes the published llvm/20.1.0 package for find_package(LLVM) (no llvm/18.1.8 published; sources verified compatible)"
    - "Injects Platform/HarmonyOS.cmake so CMake recognises the HarmonyOS system and emits shared-library SONAMEs"
    - "aarch64 generic-ELF64 offloading plugin built via dlopened-libffi path (CMAKE_DISABLE_FIND_PACKAGE_FFI=TRUE, no system libffi needed)"
    - "LIBOMPTARGET_USE_LTO=FALSE kills the -flto that libomptarget appends after CMAKE_CXX_FLAGS (musl loader rejects LTO ELF)"
    - "Disables DeviceRTL (GPU bitcode) which requires clang -fopenmp-targets and an offload-capable GPU"
    - "Packages only the RTL plugin .so (Alpine libomptarget-rtl parity); musl dlopen EACCES on verneed is a documented platform limitation"
  common_dependencies:
    - llvm

versions:
  "18.1.8":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libomptarget-rtl/18.1.8"
    note: "HarmonyOS PC aarch64 adaptation; RTL plugin package depends on llvm/20.1.0"
