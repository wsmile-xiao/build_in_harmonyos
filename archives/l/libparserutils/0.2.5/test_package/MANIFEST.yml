# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libparserutils/0.2.5
homepage: "https://www.netsurf-browser.org/projects/libparserutils/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 `make test` 依赖 netsurf-buildsystem 的 testrunner.pl，本平台无该
# 构建系统，改为 standalone Makefile 的 test 目标直接编译驱动上游 test/*.c。
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试在探索阶段运行（34/34 PASS，见 reports/test-report.md）；
# conan create 不重复运行（test_package 以消费者视角验证 API）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（全部来自上游 tarball 的 test/ 目录）
upstream_tests:
  - file: aliases.c
    source: libparserutils-0.2.5/test/aliases.c
    description: "字符集别名 canonicalise"
    command: "./build/test-bin/aliases"
  - file: filter.c
    source: libparserutils-0.2.5/test/filter.c
    description: "输入流过滤/编码转换"
    command: "./build/test-bin/filter"
  - file: inputstream.c
    source: libparserutils-0.2.5/test/inputstream.c
    description: "inputstream append/peek/advance/insert"
    command: "./build/test-bin/inputstream test/data/input/UTF-8-test.txt"
  - file: cscodec-utf8.c
    source: libparserutils-0.2.5/test/cscodec-utf8.c
    description: "UTF-8 codec 编解码 (2 数据文件)"
    command: "./build/test-bin/cscodec-utf8 test/data/cscodec-utf8/simple.dat"
  - file: cscodec-utf16.c
    source: libparserutils-0.2.5/test/cscodec-utf16.c
    description: "UTF-16 codec 编解码"
    command: "./build/test-bin/cscodec-utf16 test/data/cscodec-utf16/simple.dat"
  - file: cscodec-ext8.c
    source: libparserutils-0.2.5/test/cscodec-ext8.c
    description: "Windows-125x 扩展 8bit codec (9 数据文件)"
    command: "./build/test-bin/cscodec-ext8 test/data/cscodec-ext8/cp1252.dat"
  - file: cscodec-8859.c
    source: libparserutils-0.2.5/test/cscodec-8859.c
    description: "ISO-8859-n codec (15 数据文件)"
    command: "./build/test-bin/cscodec-8859 test/data/cscodec-8859/1.dat"
  - file: regression/filter-segv.c
    source: libparserutils-0.2.5/test/regression/filter-segv.c
    description: "回归：输入过滤无崩溃"
    command: "./build/test-bin/filter-segv"
  - file: regression/stream-nomem.c
    source: libparserutils-0.2.5/test/regression/stream-nomem.c
    description: "回归：inputstream 缓冲扩展"
    command: "./build/test-bin/stream-nomem"
  - file: regression/filter-badenc-segv.c
    source: libparserutils-0.2.5/test/regression/filter-badenc-segv.c
    description: "回归：重置坏编码不崩溃"
    command: "./build/test-bin/filter-badenc-segv"
  - file: regression/buffer-discard.c
    source: libparserutils-0.2.5/test/regression/buffer-discard.c
    description: "回归：memmove 越界修复"
    command: "./build/test-bin/buffer-discard"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 buffer/stack/vector/mibenum/utf8/inputstream API"
    command: "./test_libparserutils"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 34 个 PASS（每数据文件一次）+ test_package 17 个断言
assertion_count: 51
