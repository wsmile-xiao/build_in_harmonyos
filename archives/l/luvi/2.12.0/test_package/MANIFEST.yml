# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: luvi/2.12.0
homepage: "https://github.com/luvit/luvi"

# 上游测试命令（luvi 官方：make test / build/luvi samples/test.app）
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试豁免说明（规则 4 条件 2：受限环境无法运行上游测试）
# 上游测试为 samples/test.app（luvi 自举测试 app），入口 require('init')
# 依赖 luvit 层 init.lua；luvi 本身只提供 main.lua 入口，且本地/CI 构建
# 关闭了可选模块（OpenSSL/PCRE/LPEG/ZLIB），上游测试套件无法完整运行。
# 豁免：上游测试 0/0（N/A，无法运行），通过 test_package 消费者验证替代。
upstream_tests:
  - file: samples/test.app
    source: luvi-2.12.0/samples/test.app
    description: "luvi 自举测试 app（入口 require('init') 需 luvit 层，受限环境无法运行）"
    command: "build/luvi samples/test.app"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_package/test.sh
    description: "消费者测试：断言 luvi 二进制存在且可执行、LuaJIT VM 正常启动（luvi 无 luvit 层时入口 require('init') 不可用，报错属预期）"
    command: "./test.sh <luvi-binary>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
