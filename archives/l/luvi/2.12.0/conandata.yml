# luvi 的 deps 全部为 git 子模块（tar.gz 不含子模块内容），构建需单独拉取。
# 版本与仓库 lua-luv 1.51.0-1 先例对齐（luv 1.51.0-1 内部 libuv v1.52.1 + LuaJIT v2.1）。
submodules:
  luv:
    url: "https://codeload.github.com/luvit/luv/tar.gz/refs/tags/1.51.0-1"
    filename: "luv-1.51.0-1.tar.gz"
    sha256: "d4a11178ae8e16ba5886799ea91905dd9b0b479c75aebd67866d37373e41526f"
  libuv:
    url: "https://codeload.github.com/libuv/libuv/tar.gz/refs/tags/v1.52.1"
    filename: "libuv-1.52.1.tar.gz"
    sha256: "478baf2599bfbc882c355288c9cb6f92e0e7dda435fa04031fa5b607cf3f414c"
  luajit:
    url: "https://codeload.github.com/LuaJIT/LuaJIT/tar.gz/1edc3e52b67eaf6ce5f809be8e17d6862594b8bc"
    filename: "LuaJIT-2.1.tar.gz"
    sha256: "85497ea149d136afbe2d7ef222e08849248e52cecc6dc8deefd8588e551e4e00"
  lua-compat-5.3:
    url: "https://codeload.github.com/keplerproject/lua-compat-5.3/tar.gz/ad681cb6066fa64f3d8c26ead9413285cad3fe01"
    filename: "lua-compat-5.3.tar.gz"
    sha256: "468707b5b9d0de248507055097ae84dedc41648508d16d266e130d6060f1c3a3"

patches:
  - patch_file: "patches/0001-libuv-ohos.patch"
    patch_description: "libuv OHOS 补丁（与仓库 libuv/1.52.1 配方一致）：排除 sched_getaffinity/mmsg 等 OHOS 缺失 API。"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-minimum-version.patch"
    patch_description: "CMake 最低版本 2.8.9 → 3.5（新 CMake 已移除 <3.5 兼容）。"
    patch_type: "portability"
