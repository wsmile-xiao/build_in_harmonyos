package: libgdf/0.1.3
homepage: "https://github.com/mbillingr/libgdf"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_test_total: 8
upstream_test_count_method: ctest_entries
# 上游总数口径说明（release/0.1.3 实测，真机核验 N=8）：
# test/CMakeLists.txt 含 7 个 add_test（ctest -N = 7：testok、testfail、
# testCreateGDF、testRWConsistency、testSparseSampling、testHeader3、
# testDataTypes）；test/gdftest/ 另有 1 个 Qt 手动 harness（gdftest.pro +
# main.cpp，未注册 ctest，需 Qt 且硬编码 /media/... 外部数据集，OHOS 无头
# 环境不可运行）。7 + 1 = 8。ctest 部分 7/7 运行通过，第 8 项为已审计跳过
# （见配方 gaps，category=environment）。

upstream_tests:
  - file: test/testOK.cpp
    source: libgdf-release-0.1.3/test/testOK.cpp
    description: "Upstream smoke test: prints OK and exits 0"
    command: "ctest -R testok --output-on-failure"
  - file: test/testFail.cpp
    source: libgdf-release-0.1.3/test/testFail.cpp
    description: "Upstream negative test: expected failure (WILL_FAIL)"
    command: "ctest -R testfail --output-on-failure"
  - file: test/testCreateGDF.cpp
    source: libgdf-release-0.1.3/test/testCreateGDF.cpp
    description: "Upstream test: Writer creates empty 264-byte GDF file"
    command: "ctest -R testCreateGDF --output-on-failure"
  - file: test/testRWConsistency.cpp
    source: libgdf-release-0.1.3/test/testRWConsistency.cpp
    description: "Upstream test: write/read round-trip consistency"
    command: "ctest -R testRWConsistency --output-on-failure"
  - file: test/testSparseSampling.cpp
    source: libgdf-release-0.1.3/test/testSparseSampling.cpp
    description: "Upstream test: sparse sampling support"
    command: "ctest -R testSparseSampling --output-on-failure"
  - file: test/testHeader3.cpp
    source: libgdf-release-0.1.3/test/testHeader3.cpp
    description: "Upstream test: v3 header with tag reading"
    command: "ctest -R testHeader3 --output-on-failure"
  - file: test/testDataTypes.cpp
    source: libgdf-release-0.1.3/test/testDataTypes.cpp
    description: "Upstream test: all data types via alltypes.gdf sample"
    command: "ctest -R testDataTypes --output-on-failure"
  - file: test/gdftest/main.cpp
    source: libgdf-release-0.1.3/test/gdftest/main.cpp
    description: "Upstream manual Qt harness (gdftest.pro, NOT registered in CTest; requires Qt and hardcoded /media/... dataset; audited skip on OHOS headless)"
    command: "manual Qt harness, not run via ctest (audited skip, see gaps)"

test_package_tests:
  - file: test_libgdf.cpp
    description: "Consumer test: Writer creates empty GDF, checks 264-byte size and GDF_VERSION, Reader reopens it (6 checks)"
    command: "./test_libgdf"

assertion_count: 6
