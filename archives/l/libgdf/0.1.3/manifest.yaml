# 版本级 manifest
# 文件位置: archives/l/libgdf/0.1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.1.3"

# 软件名
software: "libgdf"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: cmake

# 源码信息
source:
  # 源码下载 URL
  url: "https://github.com/mbillingr/libgdf/archive/refs/tags/release/0.1.3.tar.gz"

  # 源码校验和
  sha256: "5c7f034d133cd5bb0b632aaf24bac9bbcce34e9dba382f595ce7b8f5ea007ceb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DBUILD_TESTING=ON"
  - "-DBUILD_PYTHON_MODULES=OFF"
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  # 无：上游仅使用 header-only Boost，已全部替换为 C++11 std 等价实现
  # （详见 patches/0001-0004 与 notes.md），tools/ CLI 不随库包发布。
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied:
- patches/0001-cmake-no-boost-no-tools.patch
- patches/0002-libheaders-boost-to-std.patch
- patches/0003-libsources-boost-to-std.patch
- patches/0004-upstream-tests-boost-to-std.patch
- patches/0005-missing-std-includes.patch

# 编译中学到的知识
knowledge_gained:
- "libgdf 上游仅使用 header-only Boost（cstdint/endian/numeric_cast/lexical_cast/scoped_ptr），
  可整体替换为 C++11 std 等价实现，从而零依赖构建，避开 conancenter Boost 源码构建链"
- "移除 Boost 头文件后需补回其此前传递提供的标准头文件（cassert/cmath），
  以 include 闭包逐 TU 核定，只加已证实使用的标识符对应的头文件"
