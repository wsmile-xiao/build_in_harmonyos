sources:
  "0.1.3":
    url: "https://github.com/mbillingr/libgdf/archive/refs/tags/release/0.1.3.tar.gz"
    sha256: "5c7f034d133cd5bb0b632aaf24bac9bbcce34e9dba382f595ce7b8f5ea007ceb"
patches:
  "0.1.3":
    - patch_file: "patches/0001-cmake-no-boost-no-tools.patch"
      patch_description: "Drop Boost find_package/COMPONENTS linkage and skip unshipped tools/ CLI so no compiled Boost libraries are required"
      patch_type: "portability"
    - patch_file: "patches/0002-libheaders-boost-to-std.patch"
      patch_description: "Replace header-only Boost in public headers (cstdint/endian/numeric_cast/lexical_cast/scoped_ptr) with C++11 std equivalents"
      patch_type: "portability"
    - patch_file: "patches/0003-libsources-boost-to-std.patch"
      patch_description: "Replace header-only Boost in library sources (numeric_cast to static_cast, lexical_cast to to_string) with std equivalents"
      patch_type: "portability"
    - patch_file: "patches/0004-upstream-tests-boost-to-std.patch"
      patch_description: "Replace header-only Boost numeric_cast in upstream tests with static_cast (valid-range conversions, semantics preserved)"
      patch_type: "portability"
    - patch_file: "patches/0005-missing-std-includes.patch"
      patch_description: "Add missing standard includes exposed by Boost removal (cassert in GDFHeaderAccess/Reader/Writer, cmath in Reader)"
      patch_type: "portability"
