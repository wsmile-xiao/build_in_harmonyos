version: "4.3.1"
status: built
build_date: "2026-04-24"

source:
  url: "https://ftp.openbsd.org/pub/OpenBSD/LibreSSL/libressl-4.3.1.tar.gz"
  tar_format: tar.gz

build:
  system: cmake

patches_applied:
  - "config.guess"
  - "config.sub"

knowledge_gained:
  - "LibreSSL autotools 在 HMDFS 上有临时文件权限问题，需使用 CMake"
  - "CMake 构建需手动复制架构特定头文件（crypto_arch.h, bn_arch.h）"
  - "可编译为静态库（libcrypto.a, libssl.a, libtls.a）"
  - "libcrypto.a (3.1M)"
  - "libssl.a (629K)"
  - "libtls.a (111K)"
  - "手动复制架构头文件"
  - "手动复制: crypto/arch/aarch64/crypto_arch.h -> crypto/crypto_arch.h"
  - "手动复制: crypto/bn/arch/aarch64/bn_arch.h -> crypto/bn/bn_arch.h"
  - "Autotools 构建系统在 HMDFS 上不可用（临时文件权限问题）"
  - "CMake 需手动复制架构特定头文件"

