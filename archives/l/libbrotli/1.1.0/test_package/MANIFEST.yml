package: libbrotli/1.1.0
homepage: "https://github.com/google/brotli"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "ctest --test-dir build-ohos --output-on-failure --no-tests=error"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-ohos --output-on-failure --no-tests=error"

# 上游实际注册并执行的 CTest 驱动
upstream_tests:
  - file: tests/run-roundtrip-test.cmake
    source: brotli-1.1.0/tests/run-roundtrip-test.cmake
    description: "七个输入（4 Canterbury 语料 + 3 源码文件）在四个质量级别下压缩/解压并逐字节比对"
    command: "ctest --test-dir build-ohos -R '^roundtrip/' --output-on-failure"
    case_count: 28
  - file: tests/run-compatibility-test.cmake
    source: brotli-1.1.0/tests/run-compatibility-test.cmake
    description: "解压兼容性样本并与原始内容逐字节比对"
    command: "ctest --test-dir build-ohos -R '^compatibility/' --output-on-failure"
    case_count: 44

upstream_test_case_count: 72

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "brotlienc+brotlidec+brotlicommon 三库全链：压缩/解压逐字节往返 + 压缩率断言（非空壳）"
    command: "./test_probe"
    assertion_count: 5

test_case_count: 1
assertion_breakdown:
  consumer_roundtrip: 5
assertion_count: 5
