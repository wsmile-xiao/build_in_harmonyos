software: libaegis
display: "libaegis"
version: "0.10.6"
upstream_name: libaegis
upstream_version: "0.10.6"
status: built
build_system: cmake
compile_date: 2026-09-27
target_platform: aarch64-unknown-linux-ohos
issue: TBD

source:
  url: "https://github.com/aegis-aead/libaegis/archive/refs/tags/0.10.6.tar.gz"
  sha256: "aaa17587424e1f4992b04abb4efa32c406965625f60fe34857c8679eea9fb7ce"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DFAVOR_PERFORMANCE=OFF"
    - "-DAEGIS_WASM_RELAXED_SIMD=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  upstream_check_command: "zig build test"
  # ziglang 0.0.0 placeholder wheel + no zig binary on the OHOS worker and no
  # network to fetch zig >= 0.16.0; the upstream Zig suite (main 43 + raf 99
  # + kdf 2 = 144 tests) could NOT be run anywhere in this environment.
  upstream_test_in_build: false
  upstream_tests:
    - name: "main.zig (43 tests)"
      description: "encrypt/decrypt oneshot+incremental, MAC, unauthenticated-encryption negative, streaming (byte-by-byte, RATE boundaries, empty updates, wrong-MAC negative), rooterberg KAT (4x121 vectors)"
      result: "not-run"
    - name: "raf_test.zig (99 tests)"
      description: "RAF (reusable audio framework) local module tests"
      result: "not-run"
    - name: "kdf_test.zig (2 tests)"
      description: "KDF (keccak-based) tests"
      result: "not-run"
  upstream_test_notes: >-
    Upstream test entry is `zig build test` (zig >= 0.16.0 per build.zig.zon);
    CMake defines no ctest target. The ziglang wheel on this worker is a 0.0.0
    placeholder with no zig executable, so the 144 Zig tests were not run.
    Instead, the full rooterberg KAT payload (4 sets x 121 vectors = 484:
    228 valid + 256 ModifiedTag negatives) was re-run against the built
    shared library on this OHOS aarch64 host via a ctypes harness calling
    aegis128l_decrypt_detached / aegis256_decrypt_detached with the same
    valid/invalid semantics as upstream: 228/228 valid decrypted with exact
    plaintext match, 256/256 negatives rejected (-1). Six API guard
    negatives (maclen 15/17/33, clen < maclen for both variants) also
    passed. The consumer test_package additionally embeds a 4-vector
    subset per set (tcId 1-3 valid + tcId 121 negative).

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml, test_package/MANIFEST.yml, software manifest"
    - "conan inspect . passed; conan source . verified sha256"
    - "conan create (static + shared) with ci/conan/profiles/ohos-aarch64 as both host/build profiles passed"
    - "Full rooterberg KAT re-run via ctypes against built libaegis.so.0.10.6: 484/484 vectors correct (228 valid exact-plaintext, 256 negatives rejected); 6/6 API guard negatives"
    - "Runtime probe on this aarch64 OHOS host: has_neon=1, has_neon_aes=1, has_neon_sha3=1, has_sve2_aes=0 (getauxval-driven, no forged features)"
    - "test_package built and ran on-device: 37/37 checks passed"
    - "readelf static: libaegis.a = 50 objects (32 with code; 18 empty guard-stubs for x86 AESNI/AVX/AVX512 and AltiVec backends, excluded by preprocessor on aarch64)"
    - "readelf shared: libaegis.so.0.10.6 with SONAME libaegis.so.0, symlink chain .so -> .so.0 -> .so.0.10.6, NEEDED libc.so only, .codesign section present"
  remote:
    - "pending"
  pending:
    - "Remote scoped CI run"

knowledge_gained:
  - "Upstream tests are Zig-only (zig build test, min zig 0.16.0); CMake has no ctest target, so KAT coverage must be carried by test_package or a manual harness."
  - "OHOS aarch64 musl: cpu.c runtime detection takes the __linux__ -> HAVE_GETAUXVAL path; has_neon_aes falls back to getauxval(AT_HWCAP) & HWCAP_AES because the profile passes no -march=+crypto, so no fake CPU features are possible; the *_neon_aes.c TUs still compile via #pragma clang attribute target(neon,crypto,aes) at function granularity."
  - "Cross-arch backend TUs (aesni/altivec/avx2/avx512) compile to EMPTY objects under their #if guards; the archive legitimately contains 18 empty stubs on aarch64."
  - "CMake on OHOS (no Platform/HarmonyOS module) leaves CMAKE_SHARED_LIBRARY_SONAME_C_FLAG undefined, so upstream set_target_properties(SOVERSION 0) emits no -Wl,-soname and libaegis.so ships without DT_SONAME; fixed by defining the flag in CMakeToolchain variables (same as libharu 2.3.0)."
  - "KAT .json.zst files can be decompressed on hosts without a zstd CLI via the python zstandard module."