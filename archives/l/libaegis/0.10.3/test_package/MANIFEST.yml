package: libaegis/0.10.3
test_date: 2026-09-10
build_system: cmake
test_type: test_package
source_package_path: ../
entry_points:
  - test_aegis
test_description: >-
  Consumer-side verification of libaegis 0.10.3 on OHOS aarch64: runtime CPU
  dispatch (aegis_init), deterministic KAT from embedded rooterberg vectors
  (4 sets x 4 vectors: Basic tcId 1-3 valid + final ModifiedTag tcId 121
  negative), one-shot and incremental API round trips for all six variants
  (aegis128l, aegis128x2, aegis128x4, aegis256, aegis256x2, aegis256x4),
  boundary message lengths (0, 1, RATE, RATE+1), authentication-failure
  negatives (tampered ciphertext, tampered MAC, wrong key), tag length
  variants (16/32), and output determinism. 37 checks total.
test_results:
  - name: test_aegis
    command: "test_aegis"
    result: pass
    details: >-
      37/37 checks passed: 1 aegis_init dispatch, 16 KAT (tcId 1-3 valid +
      tcId 121 negative per set), 12 aegis128l/aegis256 roundtrips incl.
      boundary lengths and maclen=32, 3 x-variant roundtrips, 3
      authentication-failure negatives, 1 determinism, 1 incremental ==
      one-shot. Full 484-vector rooterberg KAT was re-run separately via
      ctypes harness against the built shared library (228/228 valid,
      256/256 negatives rejected).
