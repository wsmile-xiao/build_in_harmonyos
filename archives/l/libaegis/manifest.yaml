software: libaegis
display: "libaegis"
description: "High-performance AEGIS family AEAD cryptographic library"
category: crypto
homepage: "https://github.com/jedisct1/libaegis"
license: MIT

build_system: cmake

ohos_adaptation:
  key_points:
    - "No patching needed: CMake >= 3.10 + C99, no dependencies, no config.guess"
    - "CPU backend selection is runtime (getauxval/AT_HWCAP on aarch64); do not add -march=+crypto or +simd globally — it would enable HAS_HW_AES compile-time fast path and break soft-fallback"
    - "Upstream tests are Zig-only (zig >= 0.16.0); CMake has no ctest. Consumer test_package must carry KAT coverage"
    - "Headers installed flat into include/ (8 headers: aegis.h, aegis128l.h, aegis128x2.h, aegis128x4.h, aegis256.h, aegis256x2.h, aegis256x4.h, aegis_raf.h)"
    - "Shared builds need CMAKE_SHARED_LIBRARY_SONAME_C_FLAG injected via CMakeToolchain (no Platform/HarmonyOS.cmake); upstream SOVERSION 0 then yields libaegis.so.0 SONAME"
    - "Cross-arch backend TUs (aesni/altivec/avx2/avx512) compile to empty .obj stubs under their #if guards; ~18 empty objects in the static archive are expected on aarch64"
  common_dependencies: []

versions:
  "0.10.3":
    status: built
    build_date: 2026-09-10
