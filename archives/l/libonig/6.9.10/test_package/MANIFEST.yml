version: "6.9.10"
upstream:
  source: "test/Makefile.am and test/test.sh"
  command: "make check"
  test_scripts: 7
  helper_checks: 2
  source_tests:
    - "test/test_utf8.c"
    - "test/test_syntax.c"
    - "test/test_options.c"
    - "test/testc.c"
    - "test/testu.c"
    - "test/test_regset.c"
    - "test/test_back.c"
  note: "The upstream Autotools test suite exercises UTF-8, syntax, options, EUC-JP, UTF-16, regset, and backward-search APIs."
adapted:
  files:
    - "test_onig.c"
    - "test_ohos.c"
  test_cases: 2
  assertion_count: 13
harmony_specific:
  files:
    - "test_ohos.c"
  test_cases: 1
  assertion_count: 7
  requirements:
    - "Must compile with __OHOS__ defined."
    - "Must use the Oniguruma API for a UTF-8 case-insensitive match."
    - "Must write and read a temporary file in TMPDIR or /data/local/tmp."
