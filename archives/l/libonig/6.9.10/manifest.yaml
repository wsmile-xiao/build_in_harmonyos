software: libonig
version: "6.9.10"
status: built
build_date: "2026-09-19"
conan_adapt_date: "2026-09-19"
build_system: cmake

source:
  url: "https://github.com/kkos/oniguruma/releases/download/v6.9.10/onig-6.9.10.tar.gz"
  sha256: "2a5cfc5ae259e4e97f86b68dfffc152cdaffe94e2060b770cb827238d769fc05"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF (default)"
    - "BUILD_SHARED_LIBS=ON (shared option)"
    - "BUILD_TEST=ON"
    - "INSTALL_DOCUMENTATION=OFF"
    - "INSTALL_EXAMPLES=OFF"
    - "OHOS_ARCH=arm64-v8a or x86_64 (OHOS only)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "The official release provides a CMake build and installs libonig, oniguruma.h, oniguruma.pc, and onig-config; the Conan pure-library package omits the helper script."
  - "The upstream CMake test target covers seven API programs; the package test adds direct UTF-8 capture and error-path checks."
  - "The OHOS build selects arm64-v8a or x86_64 from the Conan architecture and uses the OpenHarmony SDK toolchain."
