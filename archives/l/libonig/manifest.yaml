    - "使用上游 CMakeLists.txt 和 Conan CMakeToolchain 配置 OHOS 目标。"
    - "保留上游静态/共享库选项，默认构建静态库。"
    - "通过独立 HarmonyOS 测试验证 __OHOS__、Oniguruma API 和临时文件访问。"
  common_dependencies: []

versions:
