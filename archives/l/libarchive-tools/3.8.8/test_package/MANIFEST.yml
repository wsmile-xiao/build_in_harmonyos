# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libarchive-tools/3.8.8
homepage: "https://www.libarchive.org/"

# 上游测试命令 (automake TESTS, make check 驱动)
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试 (输出记入 make-check.log,
# 汇总存入包内 res/libarchive-tools/check-summary.json)
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件 (与 libarchive/3.8.7 同布局)
upstream_tests:
  - name: "libarchive_test"
    source: libarchive-3.8.8/libarchive/test/
    description: "libarchive 核心库单元测试 (各格式读写)"
    command: "make check"
  - name: "bsdtar_test"
    source: libarchive-3.8.8/tar/test/
    description: "bsdtar 命令行工具测试"
    command: "make check"
  - name: "bsdcpio_test"
    source: libarchive-3.8.8/cpio/test/
    description: "bsdcpio 命令行工具测试"
    command: "make check"
  - name: "bsdcat_test"
    source: libarchive-3.8.8/cat/test/
    description: "bsdcat 工具测试"
    command: "make check"
  - name: "bsdunzip_test"
    source: libarchive-3.8.8/unzip/test/
    description: "bsdunzip 工具测试"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证, R34: 真实执行二进制 + 链接 API)
test_package_tests:
  - file: test_bsdtar.sh
    description: "功能测试: bsdtar/bsdcpio --version + 打包/列表/解压 cmp 往返 (5 断言, 产物全经非空校验)"
    command: "bash test_bsdtar.sh"
  - file: test_libarchive_api.c
    description: "消费者测试: 内存 ustar 写读往返, 断言路径名/大小/内容 (1 断言)"
    command: "./test_libarchive_api"
  - file: conanfile.py
    description: "Conan test() 入口, 运行上两项并输出 HMBS 机器证据标记 (test_package discovered=6 + 上游 make check 汇总)"
    command: "conan test test_package"

# 测试断言总数 (test_bsdtar.sh 5 个 + test_libarchive_api 1 个, 与 HMBS_TEST_PACKAGE_RESULT discovered=6 一致)
assertion_count: 6
