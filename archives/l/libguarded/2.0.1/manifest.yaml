knowledge_gained:
  - "CsLibGuarded 2.0.1 is a CMake INTERFACE header-only C++20 library with no third-party Conan dependencies."
  - "The upstream CMakeLists.txt platform chain only recognizes Darwin/Linux/BSD/Windows; on OpenHarmony CMAKE_SYSTEM_NAME is HarmonyOS, so include(GNUInstallDirs) is never reached and CMAKE_INSTALL_INCLUDEDIR/LIBDIR stay empty."
  - "With empty CMAKE_INSTALL_* variables the install DESTINATION strings degrade to absolute paths (/cmake/CsLibGuarded) and cmake --install fails with 'file cannot create directory' even though configure reported success."
  - "Fix: extend the platform regex with OHOS/HarmonyOS (patch 0001) instead of overriding CMAKE_SYSTEM_NAME=Linux, keeping the real platform identity."

