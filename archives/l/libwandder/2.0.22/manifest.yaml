version: "2.0.22"
status: built
build_date: "2026-10-10"

source:
  url: "https://codeload.github.com/LibtraceTeam/libwandder/tar.gz/refs/tags/2.0.22-1"
  sha256: "ab041db66352665a7d8c2f43a8d361719dbc941d473bd3b4101b5c6367a9fc4d"
  tar_format: tar.gz
  upstream_tag: "2.0.22-1"

build:
  system: custom
  method: "direct cc build of the five src/Makefile.am lib_LTLIBRARIES sources; no autotools bootstrap"
  sources:
    - "src/encoder.c"
    - "src/decoder.c"
    - "src/itemhandler.c"
    - "src/libwandder_etsili.c"
    - "src/libwandder_etsili_ber.c"
  dependencies:
    - "uthash/2.3.0"
    - "openssl/3.5.7"
  system_libs:
    - pthread
    - m
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libwandder 2.0.22-1 tag archive has configure.ac and Makefile.am only, so the recipe compiles the five library sources directly"
  - "configure.ac requires uthash.h, libm, and libpthread; ETSI sources call OpenSSL EVP and are linked against published openssl/3.5.7"
  - "the tag tree has no tests directory and no automake TESTS or check_PROGRAMS, so build() runs no upstream suite"
