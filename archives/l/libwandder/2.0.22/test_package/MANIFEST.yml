package: libwandder/2.0.22
homepage: "https://github.com/LibtraceTeam/libwandder"

# Tag 2.0.22-1 has no automated suite. The strings below are an audit of
# that tree, not a claim that a suite was executed.
upstream_tests_exist: false
upstream_test_audit:
  - source: "libwandder 2.0.22-1 tree (top-level listing)"
    reason: "No tests/ directory. Workflows under .github/workflows are deb-build.yaml and rpm-build.yaml only."
  - source: "libwandder 2.0.22-1 Makefile.am and src/Makefile.am"
    reason: "Top-level SUBDIRS=src. src/Makefile.am defines lib_LTLIBRARIES=libwandder.la and include_HEADERS only. No TESTS, no check_PROGRAMS, no check target."
  - source: "libwandder 2.0.22-1 configure.ac"
    reason: "Probes CC, libtool, libm, libpthread, libcrypto and uthash.h. No AC_CONFIG_TESTDIR and no test harness."
  - source: "libwandder 2.0.22-1 src/libwandder_etsili.c"
    reason: "The identifier testPDU is an ETSI field name inside a dumper table, not a test case."
  - conclusion: "Upstream automated tests are 0. Coverage is the consumer program below, which calls the packaged library."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

upstream_test_total: 0
upstream_test_count_method: "source audit (no TESTS/check_PROGRAMS; no tests/ directory)"

test_package_tests:
  - file: test_wandder.c
    description: "DER octet string inside a universal SEQUENCE, then decode the child"
    command: "./test_wandder"
  - file: test_wandder.c
    description: "DER INTEGER 42, -44 and 128 inside a universal SEQUENCE"
    command: "./test_wandder"
  - file: test_wandder.c
    description: "DER NULL inside a universal SEQUENCE"
    command: "./test_wandder"
  - file: test_wandder.c
    description: "BER octet-string and BER INTEGER 42 roundtrip"
    command: "./test_wandder"
  - file: test_wandder.c
    description: "wandder_decode_integer_value on raw contents 0x7f and 0xff"
    command: "./test_wandder"
  - file: test_wandder.c
    description: "wandder_create_etsili_decoder / wandder_free_etsili_decoder"
    command: "./test_wandder"
  - file: test_wandder.c
    description: "reset_wandder_encoder then encode INTEGER 7"
    command: "./test_wandder"

# Each CHECK() that test_wandder prints. Device conan create on 2026-10-10
# printed "CHECKS 107/107 passed, 0 failed".
assertion_count: 107
