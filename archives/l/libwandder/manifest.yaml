software: libwandder
display: "libwandder"
description: "C library for DER and BER encoding and decoding, including ETSI LI helpers"
category: network
homepage: "https://github.com/LibtraceTeam/libwandder"
license: LGPL-3.0-or-later
repository: "https://github.com/LibtraceTeam/libwandder"
build_system: custom
keywords:
  - libwandder
  - der
  - ber
  - asn1
  - etsi
  - libtrace

ohos_adaptation:
  key_points:
    - "Tag archive ships configure.ac and Makefile.am only; direct cc build of the five lib_LTLIBRARIES sources"
    - "Requires published uthash/2.3.0 and openssl/3.5.7; libm and pthread are system libraries"
    - "Upstream 2.0.22 ships no test suite; coverage is the consumer exercise of the public API"
  common_dependencies:
    - "uthash/2.3.0"
    - "openssl/3.5.7"

versions:
  "2.0.22":
    status: built
    build_date: "2026-10-10"
