# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libntruprime/0-20260717
homepage: "https://libntruprime.cr.yp.to"

# 上游测试命令 (command/ntruprime-test.c: 126 个 test_* 函数，
# 无参数运行即执行全部；为 ntruprime-fulltest 的常规测试主力)
upstream_check_command: "package/bin/ntruprime-test"
upstream_test_in_build: true
upstream_test_command: "package/bin/ntruprime-test (no args: all 126 test_* functions)"

# 上游实际运行的测试程序
# main() 按顺序调用 126 个 test_* 函数（逐个统计自上游源码）：
# verify 6 + hash/hashblocks 2 + decode 31 + encode 37 + sort 2 +
# core（inv3/inv/mult3/mult/scale3/weight/wforce × 6 参数集）42 +
# kem（6 参数集 keypair/enc/dec 已知答案+往返）6。
upstream_tests:
  - file: command/ntruprime-test.c + command/ntruprime-test_*.c
    source: libntruprime-20260717/command/ntruprime-test*.c
    description: "常规测试主力：已知答案向量、编解码、核心运算、6 参数集 KEM 往返（126 个 test_* 函数）"
    command: "package/bin/ntruprime-test"
  - file: scripts-build/fulltest-* (ntruprime-fulltest 驱动脚本)
    source: libntruprime-20260717/command/ntruprime-test.c（valgrind TIMECOP 模式）
    description: "数据流测试：valgrind 下分支/下标与秘密无关；OHOS 无 valgrind，未运行（见 notes.md 与 PR 补充说明）"
    command: "未运行（OHOS 缺 valgrind）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ntruprime.c
    description: "消费者 API 测试：6 参数集 keypair-enc-dec 往返 + 封装随机化 + 双重解封（TAP 8 检查）"
    command: "test_ntruprime"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
