# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lib1305/0-20250415
homepage: "https://lib1305.cr.yp.to"

# 上游测试命令：lib1305 无 make check/ctest 目标；官方测试是构建产物
# build/<arch>/package/bin/lib1305-test（常规测试）与 lib1305-fulltest
#（编排脚本：常规测试全量 + valgrind 数据流测试）。
# conanfile.py build() 中已集成 lib1305-test 的真实运行。
upstream_check_command: "build/arm64/package/bin/lib1305-test"
upstream_test_in_build: true
upstream_test_command: "./bin/lib1305-test (cwd=build/arm64/command)"

# 上游实际运行的测试程序
upstream_tests:
  - file: command/lib1305-test.c
    source: lib1305-20250415/command/lib1305-test.c
    description: "常规测试：verify_16 与 onetimeauth_poly1305 在全部选中实现 x 输入偏移下的 SUPERCOP 风格已知答案 + 校验和测试；成功打印 all tests succeeded，退出码 0（失败为 100）"
    command: "./bin/lib1305-test"
  - file: command/lib1305-test_onetimeauth_poly1305.c
    source: lib1305-20250415/command/lib1305-test_onetimeauth_poly1305.c
    description: "poly1305 子测试：132 组预计算向量 + 边界输入（空/全0xff/小整数/模数边缘），由 lib1305-test 统一驱动"
    command: "./bin/lib1305-test onetimeauth poly1305"
  - file: scripts-build/fulltest-top
    source: lib1305-20250415/scripts-build/fulltest-top
    description: "lib1305-fulltest 编排脚本：常规测试全量并行 + valgrind 数据流测试；数据流一半要求 valgrind（OHOS 缺失，见补充说明），常规部分已被 lib1305-test 全覆盖"
    command: "package/bin/lib1305-fulltest"

# test_package 中自带的测试 (消费者视角验证 lib1305 公开 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：version/arch/实现选择 + RFC 8439 §2.5.2 已知答案向量 + 篡改检测 + 别名一致性 + roundtrip"
    command: "./test_lib1305"

# 测试断言总数：
#   1 version                  5 alias-agreement
#   2 arch                     6 verify-ok
#   3 implementation-nonnull   7 verify-tampered
#   4 rfc8439-kat              8 roundtrip
assertion_count: 8
