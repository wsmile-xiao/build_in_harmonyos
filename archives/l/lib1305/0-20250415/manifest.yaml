# 版本级 manifest — lib1305 0-20250415
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0-20250415"
software: "lib1305"
status: built
build_date: "2026-09-15"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://lib1305.cr.yp.to/lib1305-20250415.tar.gz"
  sha256: "ac20c0a49898db23e237ac208f876cab83dcfc952d690ec96d8038bb22204c5e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游构建系统：./configure（python3 脚本）+ scripts-build/ + Makefile，
  # 与 libcpucycles 同源的 djb 构建体系
  system: custom
  configure_options:
    - "--prefix=<package_folder>（configure 自动探测 arch=arm64）"
  dependencies:
    - "libcpucycles/20260625（tool_requires，仅供 lib1305-speed 基准工具构建）"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 零 patch：上游源码无需任何修改；librandombytes 缺口由配方自带
# vendor-randombytes/ 构建期 shim 补齐（新文件，非补丁），见 notes.md
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "djb 构建体系 configure 不读任何环境变量，工具链唯一注入点是源码树 compilers/default 首行（与 libcpucycles 同一结论）"
  - "lib1305 共享库链接行硬编码 -lrandombytes，但库本体零引用该符号，构建期 shim 静态满足即可，消费者无新增依赖"
  - "lib1305-test 的 DT_NEEDED 记录相对路径 lib/lib1305.so，必须在 build/<arch>/command 目录下运行"
  - "lib1305-fulltest 的数据流一半硬依赖 valgrind（缺失即 127 失败），OHOS 上只运行常规测试 lib1305-test"
  - "上游 install（scripts-build/install）在 OHOS hmfs setgid 目录下复现 libcpucycles 同款 PermissionError，同样改为从 build/arm64/package 直接收集"
