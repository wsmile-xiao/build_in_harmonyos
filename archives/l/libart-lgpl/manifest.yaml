# 软件级 manifest — archives/l/libart-lgpl/manifest.yaml

software: libart-lgpl
display: "libart-lgpl"
description: "LGPL 的独立 2D 矢量图形库（路径/仿射变换/SVP/抗锯齿光栅化）"
category: library
homepage: "https://download.gnome.org/sources/libart_lgpl/"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 C；无第三方依赖，仅链接 libm"
    - "上游 2010 年 config.sub/config.guess 不识别 aarch64/HarmonyOS → 用 OHOS 感知版本替换"
    - "autoconf 2.63 的 umask 077 临时目录在 HMDFS(setgid) 下不可写 → 放宽为 umask 022（E011）"
    - "产物同时含共享库与静态库，并提供 libart-2.0 pkg-config 文件"
    - "上游无 make check；真机运行 testuta 与 testart 五个子命令作为上游证据"
  common_dependencies: []

versions:
  "2.3.21":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libart-lgpl/2.3.21"
