knowledge_gained:
  - "2010 年 tarball 的 config.sub 不识别 aarch64/HarmonyOS：用 17 行最小补丁（早退 case）比携带上千行的新版 config.sub/config.guess 更可取——后者会让平台 AI 检视因变更过大而跳过（rule6）"
  - "autoconf 2.63 的 config.status 用 `umask 077 && mktemp -d` 建临时目录，HMDFS setgid 挂载下 0700 目录不可写，需放宽为 umask 022（E011）"
  - "libtool 2.2.6 + 显式 --build/--host 即可在 OHOS 生成 arm64 .so/.a，无需升级 libtool"
  - "Conan 以 `--prefix=/` + DESTDIR 安装 autotools 包，生成的 pkg-config 文件 prefix 会失真；需在 package() 重写 prefix/libdir/includedir"
  - "上游头文件装在 include/libart-2.0/libart_lgpl/，cpp_info.includedirs 要含 include 与 include/libart-2.0"
  - "上游无 make check；testart 的 5 个子命令与 testuta 可直接在真机运行作为上游证据"
  - "libart 的模块化渲染器（art_render_new + SVP 掩码 + 抗锯齿）在 OHOS 上产生与预期一致的像素结果"
  - "上游 API 语义：art_affine_rotate 用度数、art_affine_multiply(dst,a,b) 中 a 先应用、渲染颜色为 16 位 pixmax(ART_PIX_MAX_FROM_8)、mask 不透明度为 [0,0x10000]、art_render_invoke 会释放 render"
  - "跨架构对照：同一消费者程序在 OHOS aarch64(clang) 与 x86_64 Linux(gcc) 上均 20/20，抗锯齿部分覆盖像素数同为 88"
  - "原生 --prefix=<dir> 安装时 .pc 前缀正确，Conan(--prefix=/ + DESTDIR) 下变成 /，可据此定位 .pc 失真来源"
