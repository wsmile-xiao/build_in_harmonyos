# test_package/MANIFEST.yml
# libart-lgpl 2.3.21.
#
# Upstream ships no `make check` target: the tarball contains the demo
# programs testart.c and testuta.c, which are compiled by the stock Makefile
# and executed natively on the aarch64 device from the recipe build() (6
# program invocations: testuta + testart testpat/gradient/dash/dist/intersect).
# Coverage for consumers is provided by a CMake consumer program compiled
# against the installed package.

package: libart-lgpl/2.3.21
homepage: https://download.gnome.org/sources/libart_lgpl/

upstream_tests_exist: true
upstream_test_audit: "no tests/ directory and no check target in Makefile.am; testart.c/testuta.c are standalone demo programs built by make"
upstream_check_command: "n/a (no make check)"
upstream_test_in_build: true
upstream_test_command: "./testuta; ./testart testpat|gradient|dash|dist|intersect"

upstream_tests:
  - name: testuta
    command: "./testuta"
    expected: "pass (exit 0, PostScript/UTA dump on stdout)"
  - name: testart-testpat
    command: "./testart testpat"
    expected: "pass (exit 0, P6 test pattern on stdout)"
  - name: testart-gradient
    command: "./testart gradient"
    expected: "pass (exit 0, gradient test pattern)"
  - name: testart-dash
    command: "./testart dash"
    expected: "pass (exit 0, PostScript dash output)"
  - name: testart-dist
    command: "./testart dist"
    expected: "pass (exit 0, distance test output)"
  - name: testart-intersect
    command: "./testart intersect"
    expected: "pass (exit 0, intersector output)"

test_package_tests:
  - file: test.c
    description: "affine math, vpath bbox + affine transform, SVP flattening/intersection, RGB run helpers, anti-aliased renderer into an RGB buffer"
    command: "./libart_lgpl_consumer"

test_files:
  - path: "test_package/test.c"
    test_type: "R34"
    assertion_count: 20

test_package_test_count: 1
consumer_assertion_count: 20
assertion_count: 20
