# test_package/MANIFEST.yml
# Upstream test declaration file.
# CI script (build_and_test.sh L0e) requires this file to exist.
# See: docs/TEST_QUALITY_SPEC.md

package: lunzip/1.16
homepage: "https://www.nongnu.org/lzip/lunzip.html"

# Upstream test command (from Makefile.in `check` target analysis)
upstream_check_command: "make check"

# Whether upstream tests are integrated in conanfile.py build()
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs actually run
upstream_tests:
  - file: check.sh
    source: lunzip-1.16/testsuite/check.sh
    description: "lunzip self-test suite: decompression roundtrip, bad input, truncation, multi-member files, header variants"
    command: "make check"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_lunzip.sh
    description: "Decompress fixed .lz fixture, byte-exact cmp vs upstream plaintext; stdout decompress; -t integrity"
    command: "conan test"

# Approximate assertion count for quality assessment
assertion_count: 8
