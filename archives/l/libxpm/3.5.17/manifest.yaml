knowledge_gained:
  - "libXpm's configure runs PKG_CHECK_MODULES(XPM, xproto x11) — the sole runtime dep is libx11; xproto is headers-only from xorgproto/2025.1. src/Makefile.am has libXpm_la_LIBADD = $(XPM_LIBS). On OHOS the recipe uses the libxrender/0.9.12 pattern (PkgConfigDeps + AutotoolsDeps) so pkg-config resolves xproto/x11 directly (worker pkg-config lives at /data/service/hnp/bin/pkg-config)."
  - "OHOS autoconf works-check trap (confirmed by libxrender notes): native configure (--build == --host) fails with 'C compiler cannot create executables' on HarmonyOS workers because autoconf tries to RUN the conftest binary and the OHOS sandbox cannot execute it. Configure must use --host=aarch64-linux-ohos to enter cross-compiling mode (config.guess reports build=aarch64-unknown-linux-ohos != host), where the works-check only links and passes."
  - "config.guess/config.sub patches are MANDATORY (ported from libxrender/0.9.12): unpatched config.guess does not recognize HarmonyOS and falls through to the generic Linux probe that COMPILES a dummy.c in TMPDIR, which the OHOS worker sandbox blocks ('can't create .../dummy.c: Permission denied' -> 'cannot guess build type').  Patch 0002 inserts a HarmonyOS branch (uname -s == HarmonyOS -> echo aarch64-unknown-linux-ohos; exit) before the NetBSD case so no dummy.c is needed; patch 0001 adds ohos* to the valid-OS list and linux-ohos* to the kernel-os check.  Hunks were adapted to libxpm's config.guess/config.sub versions (2023-01-01 / 2023-01-21)."
  - "Dependency track trap (shared with libxcursor): the consumer must force libx11/6.4.0 (cmd-pkgs track, matching merged libxi/libxcursor).  Forcing 1.8.13 is fatal — libX11.la on the 1.8.13 track references libxcb.la and libxcb/1.16 ships no .la, so any downstream source build fails libtool with 'is not a valid libtool archive'."
  - "-version-number 4:11:0 -> libXpm.so.4 / libXpm.so.4.11.0; the conan cpp_info.libs entry must be 'Xpm' to match libXpm.so so CMakeDeps find_library works."
  - "cxpm (tools subdir) is NOT a linkage risk: cxpm/Makefile.am has bin_PROGRAMS = cxpm with no LDADD, but cxpm.c #include's the internal src/*.c translation units directly (data.c, parse.c, RdFToI.c, hashtab.c, misc.c, Attrib.c, Image.c) and none of those call Xlib functions, so cxpm links against nothing but libc.  sxpm auto-disables because PKG_CHECK_MODULES(SXPM, ... xt ...) fails without libXt."
  - "libXpm.so.4 exports 34 non-macro Xpm* functions; xpm.h declares them via FUNC(name,type,args) -> extern _X_EXPORT.  The display-independent parse/write/read path (XpmCreateXpmImageFromData / XpmWriteFileFromXpmImage / XpmReadFileToXpmImage / XpmCreateDataFromXpmImage) needs no X server, so the recipe ships a real XPM round-trip smoke test."
  - "XpmCreateDataFromXpmImage returns ONE XpmMalloc'd block whose row pointers point into that same buffer (man XpmCreateData: 'a single block malloc'ed data'); the caller frees it once with XpmFree(data_return).  Freeing each row individually double-frees interior pointers and aborts under the Bionic/scudo allocator (SIGTRAP 'Signal 5').  Caught by the OHOS CI round-trip test; this is the documented API contract, NOT a libXpm bug."