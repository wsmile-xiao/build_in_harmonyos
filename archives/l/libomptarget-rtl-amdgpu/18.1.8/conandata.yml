sources:
  # LLVM 18.1.8 monorepo 官方发布归档（llvm-project-18.1.8.src.tar.xz）。
  # SHA256 实算核对：本地下载与设备下载均等于 FreeBSD distinfo 值
  # 0b58557a6d32ceee97c8d533a59b9212d87e0fc4d2833924eb6c611247db2f2a（size 132067260）。
  # url 列表为等价镜像（conan get() 逐个尝试；下载结果均按本文件 sha256 自动校验，坏源自动拒收）。
  # gh-proxy.com 与 ghfast.top 已实测验证：gh-proxy.com HEAD Content-Length 精确匹配
  # 132067260；ghfast.top 全量下载 SHA256 实算一致。顺序依据官方仓惯例（PR 5084）：
  # 官方 URL 在前、镜像在后；ghproxy.net 供 gh 直连不可达时兜底。
  url:
    - "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/llvm-project-18.1.8.src.tar.xz"
    - "https://gh-proxy.com/https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/llvm-project-18.1.8.src.tar.xz"
    - "https://ghfast.top/https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/llvm-project-18.1.8.src.tar.xz"
    - "https://ghproxy.net/https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/llvm-project-18.1.8.src.tar.xz"
  sha256: "0b58557a6d32ceee97c8d533a59b9212d87e0fc4d2833924eb6c611247db2f2a"
patches:
  18.1.8:
    - patch_file: "patches/0001-openmp-cmake-let-ENABLE_CHECK_TARGETS-override-work.patch"
      patch_description: "openmp/cmake/OpenMPTesting.cmake: 无条件 set(ENABLE_CHECK_TARGETS TRUE) 使 -DENABLE_CHECK_TARGETS=OFF 失效且 check-* 目标硬依赖未构建的 in-tree clang；改为尊重显式覆盖"
      patch_type: "portability"
    - patch_file: "patches/0002-openmp-amdgpu-accept-HarmonyOS-as-linux-like-host.patch"
      patch_description: "amdgpu 插件宿主门禁：CMAKE_SYSTEM_NAME=HarmonyOS（linux 内核 OHOS 宿主）与 Linux 同等放行，否则插件被静默 return()"
      patch_type: "portability"
    - patch_file: "patches/0003-openmp-runtime-no-pthread-cancel-on-OpenHarmony.patch"
      patch_description: "openmp/runtime kmp.h: OHOS musl 移除 pthread_cancel/pthread_setcancel{type,state}，按上游 Android/WASI 先例在 __OHOS__ 下 undef KMP_CANCEL_THREADS 使 libomp 宿主运行时可编译"
      patch_type: "portability"
    - patch_file: "patches/0004-ompt-find-application-tool-via-dlsym-on-ohos.patch"
      patch_description: "openmp/runtime ompt-general.cpp: OHOS musl 不会用主程序的无版本强 ompt_start_tool 预占 libomp 的版本化弱定义（glibc 行为），应用内嵌 OMPT 工具被静默忽略且其 ompt_get_* 询问返回 NULL；__OHOS__ 下在弱定义内先 dlsym(RTLD_DEFAULT) 查找（跳过自身防递归），上游测试 ompt 门控用例（100 个）由全崩恢复可执行"
      patch_type: "portability"
