software: lastpass-cli
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# 构建系统
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lastpass/lastpass-cli/archive/refs/tags/v1.6.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "manual-compile: clang -std=gnu99 -D_GNU_SOURCE -fPIC -O2 -I. -I$DEFAULT_PREFIX/include/libxml2"
    - "manual-link: clang -fPIC -O2 *.o -o lpass -lxml2 -lssl -lcrypto -lcurl"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/1.1.1w
    - libcurl/8.8.0
    - libxml2/2.11.9

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake项目在OHOS上无法configure时，手动编译(clang直接编译+链接)绕过CMake"
  - "LLD链接器依赖libxml2.so.16，添加harmonybrew/lib到LD_LIBRARY_PATH会导致LLD无法运行"
  - "E105: LLD+harmonybrew LD_LIBRARY_PATH冲突 → 编译链接时使用默认LD_LIBRARY_PATH"
