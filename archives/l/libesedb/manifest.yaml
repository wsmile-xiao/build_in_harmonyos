software: libesedb
display: "libesedb — ESE Database Library"
description: "用于访问可扩展存储引擎 (ESE) 数据库文件 (EDB) 格式的 C 库，含 esedbexport/esedbinfo 终端工具"
category: forensics
homepage: "https://github.com/libyal/libesedb"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GNU config.guess 不识别 HarmonyOS，需内联修改添加 HarmonyOS 检测分支 (E007)"
    - "config.sub 需添加 ohos-linux/ohos* OS 模式支持 (E007)"
    - "HMDFS 文件系统 umask 077 导致 config.status 权限拒绝，需替换为 umask 022 (E011)"
    - "bindtextdomain 在独立 libintl 中，需链接 -lintl (gettext 0.26)"
    - "终端工具静态链接: --enable-static --disable-shared (R26)"
  common_dependencies: []

versions:
  "20240420":
    status: published
    build_date: "2026-06-26"
    source_url: "https://github.com/libyal/libesedb/releases/download/20240420/libesedb-experimental-20240420.tar.gz"
