# 版本级 manifest — lxqt2-build-tools 2.4.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.4.0"
software: "lxqt2-build-tools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-20"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/lxqt/lxqt-build-tools/releases/download/2.4.0/lxqt-build-tools-2.4.0.tar.xz"
  sha256: "14999ff954e820a23af44389b9f7c65f9e58b2f1c0a559f0badd38f9b459aee6"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DLXQT_ETC_XDG_DIR=/etc/xdg"
  dependencies:
    - qtbase/6.11.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lxqt2-build-tools 的 FindInstallConfigPath.cmake 无条件 find_package(Qt6 REQUIRED)，cmake configure 时必须提供 Qt6 前缀 (ref: E092)"
  - "make jobserver mkfifo 在鸿蒙文件系统不被允许（Operation not permitted），构建需用 -j1 单任务 (ref: E074)"
  - "产物为 CMake 模块（share/cmake/lxqt2-build-tools/）+ lxqt2-transupdate 脚本，属 tool 类型需 commands.json（R38）"
