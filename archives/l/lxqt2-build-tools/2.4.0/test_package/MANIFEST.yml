# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lxqt2-build-tools/2.4.0
homepage: "https://github.com/lxqt/lxqt-build-tools"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 CMakeLists.txt 无 enable_testing()/add_test()，ctest 显示 Total Tests: 0
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 lxqt2-build-tools 2.4.0 未提供任何自动化测试用例（ctest -N = 0）。
# 依据 skill 要求（测试样例不能为 0），已在 test_package/ 中制作完整功能测试集，
# 覆盖包的实质性功能：CMake 辅助模块（lxqt_create_pkgconfig_file 生成 .pc 文件）
# 与 lxqt2-transupdate 翻译更新工具。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, R34: 实质依赖被测包)
test_package_tests:
  - file: check_pc.c
    description: "调用包提供的 lxqt_create_pkgconfig_file() CMake 模块生成 .pc 文件并校验内容（Name/Version/prefix/libs）"
    command: "ctest --output-on-failure"
  - file: conanfile.py
    description: "执行安装的 bin/lxqt2-transupdate 翻译更新工具（在空目录下运行，验证工具可执行）"
    command: "conan create (test_package)"

# 测试断言总数 (近似值, 用于质量评估)
# check_pc.c: Name/Version/prefix/-llxqt2-test 4 项断言 + 文件可打开 1 项
# conanfile.py: transupdate 执行成功 1 项
assertion_count: 6
