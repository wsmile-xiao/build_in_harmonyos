knowledge_gained:
  - "libunwind-headers is the Apple oss-distributions libunwind header-only package (tag libunwind-201), distinct from LLVM libunwind and nongnu libunwind"
  - "Homebrew installs libunwind/include/* into include/ and libunwind/src/*.h* into include/libunwind/; no library is built"
  - "libunwind.h pulls in __libunwind_config.h whose non-native branch defines _LIBUNWIND_TARGET_AARCH64 and concrete context/cursor sizes, so the public header is includable on OHOS aarch64"
  - "The OHOS SDK ships its own libunwind.a at /usr/local/lib/aarch64-linux-ohos/libunwind.a (musl target), exported by clang's default link line via -l:libunwind.a; it defines unw_getcontext/unw_init_local/unw_step/unw_get_proc_info/unw_is_signal_frame (weak) and the _Unwind_* Itanium API — so upstream libunwind tests run natively on OHOS aarch64 without building any runtime"
  - "LLVM HandleLLVMOptions.cmake:152 fatal-errors on HarmonyOS system name (CMAKE does not treat HarmonyOS as UNIX); a Linux-ABI shim was used ONLY to build a throwaway runtime in an earlier attempt — that result was invalidated; the final OHOS upstream-test results use the OHOS SDK's own libunwind.a, NOT the shim build"

