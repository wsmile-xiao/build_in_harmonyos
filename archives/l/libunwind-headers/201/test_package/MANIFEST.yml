package: libunwind-headers/201
homepage: "https://github.com/apple-oss-distributions/libunwind"

# Upstream ships an LLVM-lit suite under libunwind/test/ (7 files). The lit
# wrapper (lit.site.cfg) imports libcxx.test.format + libcxx/utils/run.py;
# the Apple distribution tarball bundles NO libcxx/ sibling and no such module
# exists on this host, so the lit harness cannot run. The upstream test FILES
# are plain .pass.cpp programs that build and run against a libunwind runtime,
# so each was compiled and executed DIRECTLY with the real OHOS toolchain and
# the OHOS SDK's own libunwind.a (no Linux shim, no CMAKE_SYSTEM_NAME=Linux).

upstream_check_command: "clang++ -target aarch64-unknown-linux-ohos --sysroot=<OHOS sysroot> -std=c++17 -I<libunwind/include> <test>.pass.cpp -L<OHOS lib dir> -lunwind -lpthread -ldl -o t && ./t"
upstream_test_in_build: true
upstream_test_command: "6/6 .pass.cpp built+ran on OHOS aarch64 (exit 0); 1 .pass.sh.s skipped (REQUIRES x86)"

# Toolchain used (real OHOS, not a Linux/glibc shim):
#   clang target : aarch64-unknown-linux-ohos
#   clang triple : /storage/Users/currentUser/usr/local/bin/clang++ 15.0.4
#                  (default target aarch64-linux-ohos, defines __MUSL__)
#   sysroot      : /storage/Users/currentUser/usr/local/sysroot
#                  (musl libc: ELF interpreter /lib/ld-musl-aarch64.so.1)
#   libunwind    : /storage/Users/currentUser/usr/local/lib/aarch64-linux-ohos/libunwind.a
#                  (shipped by the OHOS SDK; clang links it by default via
#                   -l:libunwind.a; exports unw_getcontext / unw_init_local /
#                   unw_step / unw_get_proc_info / unw_is_signal_frame as weak
#                   symbols and the _Unwind_* Itanium API)
#   No CMAKE_SYSTEM_NAME=Linux shim was used for the upstream test results.

upstream_tests:
  - file: libunwind/test/unw_getcontext.pass.cpp
    source: "libunwind-201/libunwind/test/unw_getcontext.pass.cpp"
    description: "unw_getcontext returns UNW_ESUCCESS"
    compile: pass
    run: pass
    exit_code: 0
    target: aarch64-unknown-linux-ohos
    result: pass
  - file: libunwind/test/libunwind_01.pass.cpp
