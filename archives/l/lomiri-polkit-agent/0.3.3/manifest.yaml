  configure_options:
    - "-DBUILD_TESTING=OFF"   # 上游 tests/ 需 Ubuntu 专有 GMock(/usr/src/gtest) + dbustest-1，OHOS 不可用（见 notes.md 申报表）
    - "-DCMAKE_EXE_LINKER_FLAGS=-L<依赖包 libdir>"      # 上游只用 pkg_check_modules 的纯 -l 名字，需显式补 -L
    - "-DCMAKE_SHARED_LINKER_FLAGS=-L<依赖包 libdir>"   # 否则 ld.lld: unable to find library -lgio-2.0 / -lpolkit-agent-1

  # 编译依赖列表（格式: name/version）
