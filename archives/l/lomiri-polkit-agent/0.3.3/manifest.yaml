    - glib/2.84.0.1         # gio-2.0（GDBus 会话总线）
    - libnotify/0.8.3       # libnotify（桌面通知）；0.8.3.1 以 force=True 钉死 glib/2.88.0.1，与 polkit/124.1 冲突
    - properties-cpp/0.0.4  # properties-cpp（D-Bus 属性封装）

  missing_dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - file: "patches/0001-CMakeLists.txt.patch"
    description: "cmake: 用 if(COMMAND ...) 守卫 Ubuntu cmake-extras 提供的 add_formatcode_target()/ENABLE_COVERAGE_REPORT()，使非 Ubuntu 主机可 configure（源码树未随附这两个 .cmake 模块）"
  - file: "patches/0002-service-main.cpp.patch"
    description: "service: 增加 --version/--help 分支，使 D-Bus 激活型服务二进制可在无 session bus/polkitd 的 CI 环境被冒烟测试（R34/L1 运行层）"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "OHOS 动态链接器拒载 .codesign 失效/缺失的 ELF 共享库：制品仓 libnotify/0.8.3（recipe rev 3d16c3c8）的 libnotify.so.4.0.0 带一段无法通过校验的签名，dlopen 报 Permission denied，运行期表现为 Error loading shared library libnotify.so.4 + 随后 notify_* 系列 symbol not found。三态对照（本机实测）：原件 fail / 去掉 .codesign 段仍 fail（未签名同样被拒）/ 去段后 binary-sign-tool -selfSign 1 重签 OK"
  - "运行期加载闭包必须在测试执行前可加载：test_package/generate() 把依赖图共享库复制到私有目录（$TMPDIR/lomiri-polkit-agent-signed-libs）后统一重签名，并把该目录置于 LD_LIBRARY_PATH 首位；只写私有副本，绝不改动 conan 缓存（同 R49 的私有 prefix 口径）。先例：archives/a/awf-gtk/4.2.0、archives/a/abbtr/1.0.4"
  - "上游 CMakeLists 只用 pkg_check_modules(...)_LIBRARIES（纯 -l 库名，不含 -L），依赖 Ubuntu 系统库目录；OHOS 下依赖库都在 Conan 包目录，必须在 generate() 显式补 -L<依赖包 libdir>，否则链接报 ld.lld: unable to find library -lgio-2.0 / -lpolkit-agent-1"
  - "glib 的 OHOS 包把 gettext 实现放在自带 lib/libintl.so（导出 g_libintl_*，glib 自身对该组符号是未定义引用），其自带 glib-2.0.pc 写有 -lintl；PkgConfigDeps 按 cpp_info 重新生成的 .pc 只写 -lglib-2.0，导致任何用 _()/gi18n 的源码链接报 undefined symbol: g_libintl_gettext → generate() 补回 -lintl，并把 glib 的 lib 目录排在 -L 首位，避免同名 libintl 抢先解析"
  - "上游 CMakeLists 与 tests/ 依赖 Ubuntu 专有组件：cmake-extras（FormatCode/CoverageReport）与 dbustest-1 + 硬编码 /usr/src/gtest 的 GMock，OHOS/CI 均无 → 前者由补丁守卫，后者以 -DBUILD_TESTING=OFF 关闭并在 notes.md 按 R51 申报清点与不运行原因"

