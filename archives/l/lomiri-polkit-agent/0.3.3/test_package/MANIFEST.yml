# test_package/MANIFEST.yml
# 上游官方测试声明 + test_package 自检声明（CI L0e 强制要求此文件存在）
# 上游测试清点口径见 notes.md「上游测试申报表」（R51 三步法）。

package: lomiri-polkit-agent/0.3.3
homepage: "https://gitlab.com/ubports/development/core/lomiri-polkit-agent"

# 上游测试：源码自带 tests/ 目录，注册 3 个 ctest 用例（单元测试）。
# 适配后 3 例均可在 OHOS 上真实构建并运行：patches/0003 把两个探测块换成依赖图注入，
# build() 内按 E489 先对依赖闭包重签名（39 个 .so），再实跑
# `ctest --output-on-failure --timeout 180`（结果不阻断构建，R51）。
# 本轮（2026-10-02，W3 本地 CI 强制重建）实测：3 例均真实执行并进入上游断言点
# （agent-test.cpp:91 / auth-manager-test.cpp:73 / authentication-test.cpp:78），0 例通过；
# 失败点已从「加载期」推进到 libdbustest 的测试总线夹具层——夹具用 libdbustest spawn
# `dbus-daemon`，而 dbus 不在本包依赖图内（PATH 追加项为 libnotify/gdk-pixbuf/glib/libpng/
# dbustest），且依赖包 dbustest 把 bus 配置路径烘死为不可用的
# `//share/dbus-test-runner/{system,session}.conf`；mock 服务另需 `python3 -m dbusmock`
# （OHOS dbus-python 轮子缺 GLib 主循环绑定）。原始输出见 reports/upstream-ctest.log。
upstream_check_command: "ctest --output-on-failure --timeout 180"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --timeout 180"

upstream_test_count: 3
upstream_tests_runnable_on_ohos: 3
upstream_tests_run_on_ohos: 3
upstream_tests_passed_on_ohos: 0
upstream_measured_at: "2026-10-02"
upstream_measured_evidence: "reports/upstream-ctest.log（conan create 的 build() 内 ctest 原始输出，2026-10-02 强制重建刷新）"
upstream_tests:
  - name: agent-test
    kind: unit
    source: "tests/agent-test.cpp (+ tests/polkit-lib-mock.cpp, tests/policykit-mock.h)"
    registered_by: 'tests/CMakeLists.txt: add_test(NAME agent-test COMMAND agent-test)'
    runnable_on_ohos: true
    built_and_run_on_ohos: true
    result_on_ohos: "failed 0.27s"
    reason: "已真实构建并运行（patches/0003 + 依赖图注入 gmock/1.17.0、dbustest/19.04.0）。闭包重签名后加载期问题消除，gmock 注册 4 例并真实执行到 agent-test.cpp:91 断言；失败点在测试总线夹具：libdbustest spawn `dbus-daemon` 报 No such file or directory（dbus 不在本包依赖图，PATH 无其 bin）"
  - name: auth-manager-test
    kind: unit
    source: "tests/auth-manager-test.cpp"
    registered_by: 'tests/CMakeLists.txt: add_test(NAME auth-manager-test COMMAND auth-manager-test)'
    runnable_on_ohos: true
    built_and_run_on_ohos: true
    result_on_ohos: "failed 0.08s"
    reason: "同上：gmock 注册 4 例并真实执行到 auth-manager-test.cpp:73 断言；失败点在测试总线夹具（dbus-daemon 无法 spawn），其后 mock 服务另需 python3-dbusmock"
  - name: authentication-test
    kind: unit
    source: "tests/authentication-test.cpp"
    registered_by: 'tests/CMakeLists.txt: add_test(NAME authentication-test COMMAND authentication-test)'
    runnable_on_ohos: true
    built_and_run_on_ohos: true
    result_on_ohos: "failed 0.09s"
    reason: "同上：gmock 注册 3 例并真实执行到 authentication-test.cpp:78 断言；失败点在测试总线夹具（dbus-daemon 无法 spawn），其后 mock 服务另需 python3-dbusmock"

# test_package 中的测试（消费者视角验证，CI conan create 时执行）
test_package_tests:
  - file: conanfile.py
    description: "结构层：断言包内 policykit-agent 为 64 位 ELF 可执行文件、systemd user unit 已安装且非空；运行层（can_run 为真时）：实跑二进制 --version/--help"
    command: "conan create 时自动执行"
  - file: test.sh
    description: "冒烟脚本：执行 policykit-agent --version（断言含程序名与 0.3.3）与 --help（断言含 Usage 行）"
    command: "sh test.sh <policykit-agent>"

# 断言总数（近似值，用于质量评估）
# 口径：test_package/conanfile.py 内 5 处 assert 语句 + test.sh 内 2 处条件检查 = 7
assertion_count: 7
