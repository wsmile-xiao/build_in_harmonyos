sources:
  # 上游 GitLab 标签为 0.3.3（无 v 前缀）；带 v 的归档路径会 404
  url: "https://gitlab.com/ubports/development/core/lomiri-polkit-agent/-/archive/0.3.3/lomiri-polkit-agent-0.3.3.tar.gz"
  sha256: "96167c491cbb17d800e7037c0b038931104423e5d916069f34661231ccdba028"

patches:
  "0.3.3":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: "cmake: guard the Ubuntu cmake-extras targets (add_formatcode_target / ENABLE_COVERAGE_REPORT) with if(COMMAND ...) so configure succeeds on hosts without the FormatCode/CoverageReport CMake modules"
      patch_type: "portability"
    - patch_file: "patches/0002-service-main.cpp.patch"
      patch_description: "service: add --version/--help entry points so the installed policykit-agent binary is smoke-testable (the agent is D-Bus activated and requires a session bus + polkitd, unavailable in the test environment)"
      patch_type: "portability"
    - patch_file: "patches/0003-tests-CMakeLists.txt.patch"
      patch_description: "tests: take GTest/GMock and libdbustest from the dependency graph instead of Ubuntu's cmake-extras FindGMock, the hardcoded /usr/src/gtest source tree and pkg_check_modules(dbustest-1) (the shipped dbustest-1.pc has an unexpanded prefix), so the 3 upstream ctest cases build and run"
      patch_type: "portability"
