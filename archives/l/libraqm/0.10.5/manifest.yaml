software: libraqm
version: "0.10.5"
status: published
build_date: "2026-05-20"
build_date: "2026-05-20"
build_system: meson

source:
  url: "https://github.com/HOST-Oman/libraqm/releases/download/v0.10.5/raqm-0.10.5.tar.xz"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "--prefix=~/usr/local"
    - "--wrap-mode=nofallback"
  dependencies:
    - "freetype2/26.6.20"
    - "harfbuzz/14.2.0"
    - "fribidi/1.0.16"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Depends on freetype2, harfbuzz, fribidi"
  - "meson wrap-mode=nofallback prevents subproject fallbacks"