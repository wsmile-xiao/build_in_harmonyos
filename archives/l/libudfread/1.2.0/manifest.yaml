version: "1.2.0"
software: libudfread
status: built
build_date: "2026-08-26"
build_system: meson

source:
  url: "https://download.videolan.org/pub/videolan/libudfread/libudfread-1.2.0.tar.xz"
  sha256: "bb477cbd4cfbfc7787d9d05b71ee5e70430f5cfebf1297497f7e83547958050f"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "default_library=static"
    - "enable_examples=false"
  dependencies: []

compiler: clang 15
platform: OpenHarmony aarch64
default_options:
  shared: false
  fPIC: true

# Upstream ships no test suite: meson.build has no test()/benchmark(),
# meson_options.txt has no enable_tests, .gitlab-ci.yml only runs
# meson setup + meson compile, and the tarball has no test/ directory.
# test_package builds a real consumer that links the library and calls
# the public API (udfread_get_version, udfread_init/open/close, etc.).
upstream_tests_exist: false

products:
  - name: libudfread
    type: static-library
    file: lib/libudfread.a

headers:
  - include/udfread/udfread.h
  - include/udfread/udfread-version.h
  - include/udfread/blockinput.h

pkg_config: lib/pkgconfig/libudfread.pc

dependencies:
  - name: pthread
    relation: system

patches_applied: []

knowledge_gained:
  - "libudfread 1.2.0 ships an upstream Meson build system (meson.build + meson_options.txt)"
  - "No external dependencies beyond the C runtime + pthreads (meson dependency('threads'))"
  - "Library target is named 'udfread'; this package builds the static artifact libudfread.a"
  - "Public headers install to include/udfread/ (udfread.h, udfread-version.h, blockinput.h)"
  - "Upstream ships no test suite; test_package verifies version macros + udfread_get_version + UDF_BLOCK_SIZE + udfread_init success + udfread_open rejection of non-UDF dir and nonexistent path (6 real checks, no UDF image so udfread_get_volume_id is not exercised)"
