# Tests added in test_package (consumer-perspective verification)
# 6 real checks, each with a failure exit path:
#   normal scenario (./test_libudfread):
#     1. UDFREAD_VERSION_MAJOR/MINOR/MICRO macros == 1.2.0
#     2. udfread_get_version() reports 1.2.0
#     3. UDF_BLOCK_SIZE == 2048
#     4. udfread_init() returns a non-NULL handle
#     5. udfread_open(".") on a non-UDF directory is rejected (< 0)
#   fault-injection scenario (--missing-path):
#     6. udfread_open() on a nonexistent path is rejected (< 0)
# No real UDF image is available, so udfread_get_volume_id is intentionally
# NOT exercised (its result would only be meaningful on a successfully opened
# UDF image).
test_package_tests:
  - file: test_libudfread.c
    scenario: normal
    description: "Verify version macros == 1.2.0, udfread_get_version() == 1.2.0, UDF_BLOCK_SIZE == 2048, udfread_init() succeeds, and udfread_open('.') on a non-UDF directory is rejected (< 0)"
    command: "./test_libudfread"
  - file: test_libudfread.c
    scenario: fault-injection
    description: "Verify udfread_open() returns < 0 for a nonexistent path"
    command: "./test_libudfread --missing-path"

assertion_count: 6
