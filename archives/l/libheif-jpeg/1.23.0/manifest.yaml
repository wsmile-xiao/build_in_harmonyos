# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "交付 dlopen 插件模块的 Conan 子包，导出面必须拆两层：链接面/发布面只导出宿主（cpp_info.libs=[\"heif\"]，cmake_file_name/cmake_target_name/pkg_config_name 取宿主名 libheif，与 Conan 包名 libheif-jpeg 解耦，消费者写 find_package(libheif)），运行面用 runenv_info 导出插件目录 LIBHEIF_PLUGIN_PATH（上游读单数，头文件注释里的复数 PATHS 是过期文档）；插件是 MODULE 目标，塞进 cpp_info.libs 会让下游 target_link_libraries 直接失败"  # knowledge_ref: E624
  - "上游用 CMake 内建 MODULE 包 find_package(JPEG) 找依赖时，Conan 里既不需要 CMakeDeps 也不需要手钉 JPEG_INCLUDE_DIR/JPEG_LIBRARY：CMakeToolchain 把每个依赖的 include/lib 写进 CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH，FindJPEG 的 find_path/find_library 即命中 Conan 缓存（实测 Found JPEG: <conan cache>/p/libjp*/p/lib/libjpeg.so (found version \"62\")）；但这条链是目录搜索不是目标解析——依赖漏声明会静默命中设备系统库，必须回读解析出的绝对路径"  # knowledge_ref: E624
  - "OHOS clang15/libc++15 缺 C++20 std::ranges 算法：libc++ 的 __config 用 #if !defined(_LIBCPP_ENABLE_EXPERIMENTAL) && !defined(_LIBCPP_BUILDING_LIBRARY) 定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES 把 all_of/find 整段隐藏，-std=c++20/2b 都编不过（libheif/box.cc 3 处）。generate() 里对 OHOS 下发裸 -D_LIBCPP_ENABLE_EXPERIMENTAL（preprocessor_definitions 值为 None → add_compile_definitions 不带 =1）即零补丁解决；ranges 算法是模板，纯编译期可见性问题，不需要 -lc++experimental（与 libpqxx 8.0.1 / ladybug 0.18.2 缺 std::format 运行期符号的情形不同）"  # knowledge_ref: E624
  - "子包（父 tarball 内子模块）的上游 N 必须按父 tarball 全量注册面取「用例/注册类」最大值并逐项披露候选口径：libheif 1.23.0 的 Catch2 TEST_CASE = 217，而 CTest add_test 全开关上限只有 39、测试目标 39、测试源文件 41、断言宏 4016；只按 CTest 口径申报会被判 rule4 少报（差额 178 项按条件编译逐项归因）"  # knowledge_ref: E624
