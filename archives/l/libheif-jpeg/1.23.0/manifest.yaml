software: libheif-jpeg
# 版本级 manifest — 文件位置: archives/l/libheif-jpeg/1.23.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "1.23.0"
conan_ref: "libheif-jpeg/1.23.0"

# published | built | failed | archived
# O5：只有 release upload 已确认才可标 published，此前一律 built。
status: built

build_date: "2026-09-20"

# 构建系统类型（verify-build 要求的顶层字段）
# 注意：init-build 的启发式把本包误探测成 autotools（tarball 里有 configure.ac），
# 实际是 CMake（上游根 CMakeLists.txt + CMakePresets.json），此处按实修正。
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 父 tarball（本包是其中树内子模块：CMake 目标 heif-jpegdec / heif-jpegenc）
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # cmake 选项（与 conanfile.py generate() 一致；由 CMakeToolchain 下发的 -D 变量）
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"              # 插件 dlopen 语义要求宿主为共享库
    - "-DENABLE_PLUGIN_LOADING=ON"          # 交付面必要条件：插件模块形态
    - "-DWITH_JPEG_DECODER=ON"              # 交付面：JPEG 解码后端
    - "-DWITH_JPEG_DECODER_PLUGIN=ON"       # 交付面：以独立插件模块构建（→ libheif-jpegdec.so）
    - "-DWITH_JPEG_ENCODER=ON"              # 交付面：JPEG 编码后端
    - "-DWITH_JPEG_ENCODER_PLUGIN=ON"       # 交付面：以独立插件模块构建（→ libheif-jpegenc.so）
    - "-DWITH_LIBDE265=OFF"
    - "-DWITH_X265=OFF"
    - "-DWITH_X264=OFF"
    - "-DWITH_AOM_DECODER=OFF"
    - "-DWITH_AOM_ENCODER=OFF"
    - "-DWITH_DAV1D=OFF"
    - "-DWITH_KVAZAAR=OFF"
    - "-DWITH_UVG266=OFF"
    - "-DWITH_VVDEC=OFF"
    - "-DWITH_VVENC=OFF"
    - "-DWITH_FFMPEG_DECODER=OFF"
    - "-DWITH_OpenH264_DECODER=OFF"
    - "-DWITH_OpenH264_ENCODER=OFF"
    - "-DWITH_RAV1E=OFF"
    - "-DWITH_SvtEnc=OFF"
    - "-DWITH_OpenJPEG_DECODER=OFF"
    - "-DWITH_OpenJPEG_ENCODER=OFF"
    - "-DWITH_OPENJPH_ENCODER=OFF"
    - "-DWITH_OPENJPH_DECODER=OFF"
    - "-DWITH_LIBSHARPYUV=OFF"
    - "-DWITH_UNCOMPRESSED_CODEC=OFF"
    - "-DWITH_WEBCODECS=OFF"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_GDK_PIXBUF=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_DOCUMENTATION=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    # OHOS 专用：libc++15 用 !defined(_LIBCPP_ENABLE_EXPERIMENTAL) 隐藏 C++20
    # std::ranges 算法（见 knowledge_gained）；由 generate() 的
    # preprocessor_definitions 下发为裸 -D（不加 =1）。
    - "-D_LIBCPP_ENABLE_EXPERIMENTAL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libjpeg-turbo/3.2.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无补丁：上游源码零修改（ranges 问题用编译期宏解决，不改源码）。
patches_applied: []

