# notes.md / reports/test-report.md 五处同源同单位）
# ============================================================

upstream_test_counts:
  # 主 N：父 tarball 全量注册面中「用例/注册类」候选口径的最大值
  total: 217
  unit: 217
  integration: 0
  other: 0
  unit_basis: >-
    libheif 1.23.0 父 tarball tests/*.cc 的 Catch2 TEST_CASE 注册数
    （取数：grep -rho 'TEST_CASE' tests/*.cc | wc -l）
  candidate_units:
    catch2_test_case_registrations: 217      # ← 主 N（用例/注册类最大值）
    ctest_add_test_registrations_max: 39     # tests/CMakeLists.txt 38×add_libheif_test + 1×add_heifio_test
    test_executable_targets_max: 39
