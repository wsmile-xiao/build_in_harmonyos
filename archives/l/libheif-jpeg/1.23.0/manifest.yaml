    assertion_macros: 4016                   # REQUIRE 3994 + CHECK 18 + REQUIRE_FALSE 4（另一单位，只披露不并入 N）
  in_surface_scope: "libheif/plugins/decoder_jpeg.cc + encoder_jpeg.cc（上游目标 heif-jpegdec / heif-jpegenc）"
  in_surface_executed: 0
