# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libheif-jpeg/1.23.0
homepage: "https://github.com/strukturag/libheif"

# 上游测试命令（父 tarball libheif 1.23.0 的 CTest 入口；本包构建未启用 BUILD_TESTING）
upstream_check_command: "ctest   # 需 -DBUILD_TESTING=ON，本包交付面不含上游测试目标"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游用例清点（rule4）：主 N 取「用例/注册类」候选口径的最大值，全部口径带单位
upstream_test_counts:
  unit: 217
  integration: 0
  other: 0
  total: 217
  basis: >-
    父 tarball（libheif 1.23.0，sha256 50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a）
    全量注册面。候选口径逐项读数（取数命令均以解包后的 libheif-1.23.0 为 cwd）：
    a) Catch2 TEST_CASE 注册数 = 217（tests/*.cc，取数 grep -rho 'TEST_CASE' tests/*.cc | wc -l）
       —— 用例/注册类最大值，即主 N；
    b) CTest add_test 注册数（全开关上限）= 39（tests/CMakeLists.txt：38 次 add_libheif_test()
       + 1 次 add_heifio_test(tiffdecode)；取数 grep -c 'add_libheif_test(' + grep -c 'add_heifio_test('）；
    c) 测试可执行目标（全开关上限）= 39（与 add_test 一一对应）；
    d) 测试源文件 = 41 个 .cc（含 main.cc / test_utils.cc 两个不含用例的文件）；
    e) 断言宏 = 4016（REQUIRE 3994 + CHECK 18 + REQUIRE_FALSE 4；
       取数 grep -rhoE '(REQUIRE|CHECK)(_FALSE)?\(' tests/*.cc | wc -l）—— 属**另一单位**，只披露、不并入 N。
    另有 SECTION( 5 处、GENERATE( 43 处（Catch2 运行期展开），不构成新的注册单位。
  in_surface_scope: "libheif/plugins/decoder_jpeg.cc + libheif/plugins/encoder_jpeg.cc（上游目标 heif-jpegdec → libheif-jpegdec.so、heif-jpegenc → libheif-jpegenc.so）"
  in_surface_executed: 0
  not_run: 217
  harmony_specific: 25

# 上游实际运行的测试程序（本包交付面内没有上游测试目标）
upstream_tests:
  - file: N/A
    source: libheif-1.23.0/tests
    description: >-
      本包交付面是上游树内的 JPEG 解码/编码后端插件（CMake 目标 heif-jpegdec /
      heif-jpegenc），上游 tests/ 下的 39 个测试目标不被 install()、不属交付面；
      上游把 BUILD_TESTING 默认置 ON，但在交付配置下只有 13/39 个目标可编译
      （见 notes.md「上游测试清点」的逐项归因），217 项上游用例全部按 NOT_RUN 记账。
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(libheif REQUIRED) + target_link_libraries libheif::libheif（经 CMakeDeps 生成）"
    command: "cmake --configure"
  - file: test_package/test_libheif_jpeg.c
    description: >-
      25 项显式检查，分三层：①链接面/版本指纹（1.23.0、版本号分量）；②运行面
      （LIBHEIF_PLUGIN_PATH 环境变量 == 编译期 LIBHEIF_PLUGIN_DIRECTORY；heif_init；
      heif_have_decoder_for_format(JPEG)==1 且 heif_have_encoder_for_format(JPEG)==1
      —— 证明交付的两个插件模块被宿主 dlopen 并注册）；③反证 + 端到端
      （HEVC/AV1/JPEG2000 后端必须为 0；16x16 RGB → JPEG 编码 → 写 .jpg →
      JPEG 解码 → 尺寸一致 + 像素 ±10）
    command: "./test_libheif_jpeg"

# 测试断言总数 (test_libheif_jpeg.c 中 check() 调用数, 用于质量评估)
assertion_count: 25
