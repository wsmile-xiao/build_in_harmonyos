# conandata.yml — libheif-jpeg 1.23.0
#
# 源码 = 上游 libheif 1.23.0 官方 tag 归档（R39：官方源）。
# 本包是**同一 tarball 内的子模块**：JPEG 解码 + JPEG 编码后端插件，
# 源文件在树内 libheif/plugins/decoder_jpeg.{cc,h} 与
# libheif/plugins/encoder_jpeg.{cc,h}，由
#   libheif/plugins/CMakeLists.txt
#       plugin_compilation(jpegdec JPEG JPEG_FOUND JPEG_DECODER JPEG_DECODER)
#       plugin_compilation(jpegenc JPEG JPEG_FOUND JPEG_ENCODER JPEG_ENCODER)
# 生成 CMake 目标 heif-jpegdec / heif-jpegenc
# → 产物 libheif-jpegdec.so / libheif-jpegenc.so。
# 版本号取父 tarball 版本（同族先例：libheif-libde265 1.23.0、libhwy_test 1.3.0）。
#
# sha256 为设备实测值：本任务用同批 libheif 1.23.0 tarball 离线种子
# （见 notes.md「源码获取」）复算 sha256sum，与官方 tag 归档一致；
# conan create 时 conan 的 get() 也按该值校验通过。
# 与 archives/l/libheif/1.22.2 无关（不同 tarball、不同 sha256）。

sources:
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"

# 无补丁：上游源码零修改。
#
# 唯一需要处理的平台问题是 OHOS clang15/libc++15 缺 C++20 std::ranges 算法
# （libheif/box.cc 3 处），由 conanfile.py generate() 对 OHOS 下发编译期宏
# `_LIBCPP_ENABLE_EXPERIMENTAL` 解决，不改上游源码 —— 因此这里没有补丁条目，
# patches 段用空表（CI 的 L0f 只对非空 patches 段校验列表形态，空表不触发）。
patches: {}
