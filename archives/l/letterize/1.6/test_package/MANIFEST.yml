# test_package/MANIFEST.yml — letterize 1.6
package: letterize/1.6
homepage: "https://gitlab.com/esr/letterize"

# 上游无独立测试套件：letterize 1.6 是单 .c 工具（letterize.c ~13KB）
# 上游 Makefile 的目标是 all / clean / spellcheck / reflow / install /
# uninstall / version / dist / release / refresh —— **没有 check 或 test 目标**，
# 且源码 tarball 内不含任何测试源文件或期望输出。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_letterize.c
    description: >-
      消费者测试 34 条断言。核心是两条**不依赖硬编码词表**的结构属性：
      P1 每一行助记词长度必须等于输入长度（逐位 1:1 映射）；
      P2 每一位上，输出字符要么等于输入字符（0/1/'-' 等非字母键原样透传），
      要么落在该数字键位的字母集合内（2→abc … 9→xyz）。
      属性对全部输出行逐行校验，另加 8 组实测基线（非空行数 + 首行）与
      空输入用例。
    command: "test_letterize <bin/letterize>"

# 测试断言总数
assertion_count: 34
