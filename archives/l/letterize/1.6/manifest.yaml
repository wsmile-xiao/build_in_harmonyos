software: letterize
display: "letterize"
description: "Phone-number to letter-mnemonic generator (US keypad 2=ABC .. 9=XYZ), BSD-2-Clause"
category: text
homepage: "https://gitlab.com/esr/letterize"
license: BSD-2-Clause
build_system: custom  # 单 .c + 上游 Makefile 含 -Werror 与 asciidoctor 依赖，conanfile 直驱 clang

ohos_adaptation:
  key_points:
    - "单 .c 文件（letterize.c ~13KB），无外部库依赖（仅 libc：ctype/stdio/stdlib/string）"
    - "上游 Makefile 的 CFLAGS 含 -Werror 且 all: 目标依赖 asciidoctor 生成 man 页 → build() 直驱 clang 绕开"
    - "musl 全支持，无 patch"
    - "aarch64 Linux 默认 char 为 unsigned；实测词表索引对 char 符号性不敏感（aarch64 与 x86-64 行数一致）"
    - "编译产出单可执行文件 bin/letterize（约 20KB）"
  common_dependencies:
    - libc (ctype/stdio/stdlib/string)

versions:
  "1.6":
    status: built
    build_date: "2026-09-17"
    source_url: "https://deb.debian.org/debian/pool/main/l/letterize/letterize_1.6.orig.tar.gz"
    source_sha256: "10f9aa0587649d49c7d5496c1396be126c986bdba5b839ef9965b39e10fd27e5"
    test_assertions: 34
