software: libcdr
display: "libcdr"
description: "CorelDRAW document import library"
category: data
homepage: "https://wiki.documentfoundation.org/DLP/Libcdr"
license: MPL-2.0
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需要添加 HarmonyOS 平台检测（E007）"
    - "configure 脚本 umask 077 在 HMDFS 上导致临时目录不可写，需改为 umask 022（E011）"
    - "ICU 77+ 不再定义 TRUE/FALSE 宏，源码中需替换为 C++ true/false"
    - "Boost sp_thread_sleep.hpp 使用 pthread_setcancelstate（musl 不支持），需添加 __OHOS__ 守卫"
    - "clang 编译时 --disable-werror 避免 -Wdeprecated-copy 等警告升级为错误"
  common_dependencies:
    - librevenge
    - lcms2
    - zlib
    - icu4c
    - boost
    - cppunit

# 版本索引（所有已归档版本，含状态）
versions:
  "0.1.3":
    status: published
    build_date: "2026-06-25"
