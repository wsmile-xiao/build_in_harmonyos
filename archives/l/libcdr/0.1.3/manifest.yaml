software: libcdr
# 版本级 manifest
# 文件位置: archives/l/libcdr/0.1.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"
compile_date: "2026-06-25"

# 构建系统类型（顶层字段，G4 门禁检查）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://dev-www.libreoffice.org/src/libcdr-0.1.3.tar.bz2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--disable-werror"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "librevenge/0.0.5"
    - "lcms2/2.16"
    - "zlib/1.3.1"
    - "icu4c/77.1"
    - "boost/1.84.0"
    - "cppunit/1.15.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-src-lib-libcdr_utils.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess/config.sub 需要添加 HarmonyOS 检测（perl patch + 手动修复 GUESS→echo）"
  - "E011: configure 脚本 umask 077 在 HMDFS 上导致临时目录不可写，改为 umask 022"
  - "ICU 77.1 不再定义 TRUE/FALSE 宏，需替换为 C++ true/false"
  - "Boost 1.84.0 sp_thread_sleep.hpp 使用 pthread_setcancelstate（musl 不支持），需添加 __OHOS__ 守卫"
  - "--disable-werror 避免 clang -Wdeprecated-copy-with-user-provided-copy 报错"
  - "功能测试通过: 6个命令行工具正常, C++ API 29/29 PASS, CDR格式检测正确(v3/v9/vA/Waldo)"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libcdr-0.1.3.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libcdr-0.1.3.work
