# test_package/MANIFEST.yml — libclamunrar 1.4.4
# Upstream has no standalone test suite: audited clamav-1.4.4/libclamunrar/
# (50 C++ engine sources + CMakeLists.txt + map + headers, no tests/ dir,
# no ctest/meson/pytest registration). RAR integration checks live in
# clamav unit_tests/ and require full libclamav + Rust toolchain, which is
# unavailable on OHOS CI (capability matrix: Rust unsupported), so they are
# not part of this standalone engine package.
# Conclusion: no_tests (HMBS_UPSTREAM_TEST_RESULT status=no_tests).

package: libclamunrar/1.4.4
homepage: "https://github.com/Cisco-Talos/clamav"

upstream_tests_exist: false
upstream_test_audit: "审计 clamav-1.4.4 上游（GitHub tag clamav-1.4.4，conandata 源码包）：1) 本包构建对象 libclamunrar/ 仅含 50 个 C++ 引擎源文件 + CMakeLists.txt + libclamunrar.map + dll.hpp/rar.hpp 等头文件，无 tests/ 目录；libclamunrar/CMakeLists.txt 仅定义 clamunrar / clamunrar_static 建库目标，全文件无 add_test，grep 无 ctest/gtest/python_def 注册；2) 同一源码包顶层 unit_tests/（check_clamav.c 等 HAVE_UNRAR 分支）是 libclamav 整机集成测试，需完整构建 libclamav + Rust 工具链（顶层 CMake find_package(Rust REQUIRED)），OHOS CI 无 Rust（能力矩阵 env_unsupported），且其统计口径属于 libclamav 而非本独立引擎包，故不计入本包 upstream_test_total；3) 计数口径 auto：单一目录审计（libclamunrar/ 文件清单 + 建库 CMake 文本扫描），无可解析框架，总数 0。上游本包确实无独立测试套件。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

upstream_test_total: 0
upstream_test_count_method: "auto"

test_package_tests:
  - file: test_libclamunrar.cpp
    description: "链接 libclamunrar 并调用真实 UnRAR DLL API：RARGetDllVersion 版本断言 + RAROpenArchive/RAROpenArchiveEx 缺失文件 EOPEN 路径"
    command: "test_libclamunrar"
    assertions: 3

assertion_count: 3
