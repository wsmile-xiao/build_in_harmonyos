# 软件级 manifest
# 文件位置: archives/l/libfreehand-tools/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0（软件级元数据 + 版本索引）

software: libfreehand-tools
display: "libfreehand-tools"
description: "Macromedia/Adobe FreeHand（.fh）文档解析库与转换工具集（fh2raw/fh2svg/fh2text）"
category: doc
homepage: "https://wiki.documentfoundation.org/DLP/Libraries/libfreehand"
license: MPL-2.0
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "上游 configure.ac 的 --enable-werror 默认 yes，2017 年代码 + clang 15 会因新告警直接编译失败，打包传 --disable-werror"
    - "上游 --enable-tests 默认 yes：CPPUNIT 是默认构建期依赖，src/test 的 CPPUnit 用例默认进构建（tool_requires cppunit 并真实 make check）"
    - "src/lib 的 BUILT_SOURCES 需 gentoken.pl(perl) 与 gperf 生成 tokens.gperf/tokenhash.h；perl 有已发布 conan 包，gperf 无 binary、依赖 HNP 的 /data/service/hnp/bin/gperf"
    - "libtool _LIBADD 里绝对路径 .a 会被当 convenience 库嵌入产物，依赖须走 la-free shadow 目录 + -L -l"
    - "lcms2 制品仓只有动态库：工具产物带 DT_NEEDED=liblcms2.so.2，配方写 -Wl,-rpath 使包内 bin/ 可直接执行"
    - "U16_NEXT 宏在 ICU 78 展开为 do{...}while(0)，上游缺分号 → 需平台无关的单分号补丁"
  common_dependencies:
    - librevenge
    - icu4c
    - zlib
    - lcms2
    - boost
    - cppunit
    - pkgconf
    - perl

# 版本索引
versions:
  "0.1.2":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libfreehand-tools/0.1.2"
    notes: |
      首次适配（-tools 子包，与父包 libfreehand 同源 tarball）。
      交付 bin/fh2raw、bin/fh2svg、bin/fh2text 与 lib/libfreehand-0.1.a。
      上游 CPPUnit 用例 2/2 PASS（同一 make check 内）；fuzz 目标 1 项 NOT_RUN
      （需 -lFuzzingEngine，制品仓与工具链均无）；鸿蒙消费者用例 6/6 PASS。
