# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libfreehand-tools/0.1.2
homepage: "https://wiki.documentfoundation.org/DLP/Libraries/libfreehand"

# 上游测试命令（configure.ac 的 --enable-tests 上游默认 yes，故 src/test 默认进构建）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游测试总数 N（父 tarball 全量注册面清点，主 N = 候选口径最大值）
#   候选口径（用例/注册类）：
#     check_PROGRAMS = 1        (src/test/Makefile.am:5)
#     TESTS          = 1        (src/test/Makefile.am:25)
#     CPPUnit 注册用例 = 2       (src/test/FHInternalStreamTest.cpp:32-33: testRead/testSeek)
#     CPPUnit suite 注册 = 1     (src/test/FHInternalStreamTest.cpp:104)
#     测试/模糊测试源文件 = 3     (src/test 2 个 + src/fuzz 1 个)   <-- 主 N 取此最大值
#   assertion 数 = 20（testRead 7 + testSeek 13）属另一单位，只披露、不并入 N
declared_upstream_n: 3

# 本子包实际运行的上游用例（父 tarball 注册面中进本包构建的部分）
upstream_tests:
  - file: src/test/FHInternalStreamTest.cpp
    source: libfreehand-0.1.2/src/test
    description: "CPPUnit 用例：FHInternalStreamTest::testRead（7 断言）、testSeek（13 断言）"
    command: "make check（check_PROGRAM: test）"
  - file: src/test/test.cpp
    source: libfreehand-0.1.2/src/test
    description: "CPPUnit 运行器 main（不注册用例，随 check_PROGRAM `test` 编译运行，退出码 = 用例结果）"
    command: "make check"

# 未运行的上游注册项（NOT_RUN，不写 PASS）
upstream_tests_not_run:
  - file: src/fuzz/fhfuzzer.cpp
    source: libfreehand-0.1.2/src/fuzz
    description: "noinst_PROGRAMS = fhfuzzer（模糊测试目标）"
    reason: "链接需 -lFuzzingEngine（libFuzzer 引擎库），制品仓与工具链均无该库；上游 --enable-fuzzers 默认 no，放开该开关会引入不可得依赖"
    status: NOT_RUN

# test_package 中自带的鸿蒙消费者测试（不计入上游 N，单列）
test_package_tests:
  - file: harmonyos_specific_test.cpp
    description: "鸿蒙消费者用例：编译期 __OHOS__/__aarch64__ 硬绑定 + 运行期真实链接 libfreehand/librevenge/ICU/zlib/lcms2，调用 FreeHandDocument::isSupported/parse（含 AGD/FH3 魔数正向识别 + 纯文本/空指针拒绝）"
    command: "./harmonyos_specific_test"
  - file: conanfile.py
    description: "CLI 冒烟：fh2raw / fh2svg / fh2text --version 三个转换工具可执行且退出码 0"
    command: "fh2raw --version && fh2svg --version && fh2text --version"

# 测试断言总数（鸿蒙消费者用例，近似值，用于质量评估；上游断言 20 条见上，两者单位分栏）
assertion_count: 6
