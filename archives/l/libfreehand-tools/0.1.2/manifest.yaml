# 版本级 manifest
# 文件位置: archives/l/libfreehand-tools/0.1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.2"

# 软件名
software: "libfreehand-tools"

# Conan 引用（与 conanfile.py 的 name/version 一致）
conan_ref: "libfreehand-tools/0.1.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与父包 libfreehand 同源 tarball；-tools 子包 = 同一源码树的工具面）
  url: "https://dev-www.libreoffice.org/src/libfreehand/libfreehand-0.1.2.tar.xz"

  # 源码校验和（本任务自行下载复算，非照抄 0.1.1）
  sha256: "0e422d1564a6dbf22a9af598535425271e583514c0f7ba7d9091676420de34ac"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-static"
    - "--disable-shared"
    - "--disable-werror"

  dependencies:
    - "librevenge/0.0.5"
    - "icu4c/78"
    - "zlib/1.3.1"
    - "lcms2/2.19"
    - "boost/1.90.0.3"
    - "pkgconf/3.0.5"
    - "perl/5.42.2.3"
    - "cppunit/1.15.1"

  cc: clang
  cxx: clang++

# ============================================================
# 上游测试（父 tarball 全量注册面清点，主 N = 3）
# ============================================================

upstream_tests:
  # N = 候选口径最大值（用例/注册类）：
  #   check_PROGRAMS=1 (src/test/Makefile.am:5)  TESTS=1 (:25)
  #   CPPUnit 注册用例=2 (:32-33 testRead/testSeek)  suite 注册=1 (:104)
  #   测试/模糊测试源文件=3（src/test 2 + src/fuzz 1）  <-- 主 N 取此最大值
  # assertion 数=20（testRead 7 + testSeek 13）属另一单位，只披露不并入 N
  declared_total_n: 3
  declared_unit: "父 tarball 测试/模糊测试源文件数（用例/注册类口径最大值）"
  run:
    - file: "src/test/FHInternalStreamTest.cpp"
      cases: 2
      status: PASS
    - file: "src/test/test.cpp"
      cases: 0
      note: "CPPUnit 测试运行器 main（不注册用例），随 check_PROGRAM `test` 一起编译运行"
      status: PASS
  not_run:
    - file: "src/fuzz/fhfuzzer.cpp"
      cases: 1
      reason: "需 -lFuzzingEngine（libFuzzer 引擎库，制品仓与工具链均无），上游 --enable-fuzzers 默认 no；放开该开关会引入不可得依赖，按 NOT_RUN 申报"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（唯一 1 个：平台无关的 ICU U16_NEXT 分号补丁；
# config.guess/sub 的 HarmonyOS 识别由 GNU triplet 绕过，不需要配置类补丁）
patches_applied:
  - "0001-src-lib-libfreehand_utils.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "configure.ac 的 --enable-tests 与 --enable-werror 上游**默认都是 yes**：前者使 CPPUNIT 成为默认构建期依赖（src/test 的 CPPUnit 套件默认进构建），后者使 clang 15 对 2017 年代码的新告警直接编译失败；打包按发行版惯例传 --disable-werror，不改源码、不加平台宏"  # knowledge_ref: E617
  - "autotools 代码生成器 gperf 无已发布 conan 包（archives/g/gperf/3.1 只有配方，conan install --build=never rc=1），不能 tool_requires；src/lib/Makefile.am 的 BUILT_SOURCES 会用 gentoken.pl(perl) 生成 tokens.gperf 再调 gperf 生成 tokenhash.h —— 依赖 HNP 提供的 /data/service/hnp/bin/gperf（设备与 CI worker PATH 同源，libhubbub/0.3.8 先例）"  # knowledge_ref: E617
  - "lcms2 制品仓只有动态 binary（default shared=True，无 .a）：静态 libfreehand-0.1.a 的 FHParser.o 需要其符号，三个工具的最终产物带 DT_NEEDED=liblcms2.so.2，且 OHOS 系统只有 liblcms_shared.z.so（soname 不同）→ 配方写 -Wl,-rpath,<lcms2 libdir> 使包内 bin/ 可直接执行（L2 冒烟与 test_package 都不必手工设 LD_LIBRARY_PATH）"  # knowledge_ref: E617
  - "libtool _LIBADD 里绝对路径 .a 会被当 convenience 库嵌入产物（archive member 'libz.a' is neither ET_REL nor LLVM bitcode），须用 la-free shadow 目录 + -L<shadow> -l<name>；librevenge 的 .la 带 libdir='//lib' 病灶（E236），shadow 里不放 .la 即可规避"  # knowledge_ref: E236
  - "package_info 不写 cpp_info.requires（icu4c 无 cmake_target_name；boost 纯头文件），依赖闭包由消费侧自行解析（libmspub-tools/0.1.4 同族先例）"  # knowledge_ref: E617
  - "test_package 必须用 self.requires(self.tested_reference_str) 而非写死字面量 ref：conan-verify 以 `conan create … --user=ohpcd --channel=stable` 运行，写死 `libfreehand-tools/0.1.2`（无 user/channel）会解析到另一个 ref，G2 报 `Package … not resolved: Unable to find … in remotes`（整仓 5908 个 test_package 中 5896 个用标准写法）"  # knowledge_ref: E617
