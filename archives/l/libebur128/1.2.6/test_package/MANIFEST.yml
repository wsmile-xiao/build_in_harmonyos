# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libebur128/1.2.6
homepage: "https://github.com/jiixyj/libebur128"

# 上游测试命令（ctest，需 ENABLE_TESTS=ON）
upstream_check_command: "ctest"

# 上游 3 个测试程序（test/CMakeLists.txt 的 add_executable 全集）已在本 test_package
# 中原文编译并真实执行（见 upstream/README.md）：
#   1. r128-test-library（test/tests.c）     — EBU R128 参考套件，64 断言
#   2. minimal-example（test/minimal-example.c）— 官方示例，读 wav 打印门限响度
#   3. r128-fuzzer（test/fuzzer.cpp）        — 自足 fuzzer，确定性驱动 7 输入
upstream_test_in_build: true
upstream_test_command: "./r128-test-library && ./r128-fuzzer && ./minimal-example seq-3341-1-16bit.wav seq-3341-2-16bit.wav"
upstream_test_note: >-
  上游 tests.c/minimal-example.c 对 libsndfile 的依赖仅为读取 RIFF PCM wav
  （sf_open/sf_readf_double/sf_close），由 test_package/sndfile_stub/ 的
  精简 shim 提供等价实现后原文编译执行；libsndfile 完整适配另行单独开任务。
  EBU 官方测试向量受 EBU test-material 分发政策限制不能入库/CI 下载
  （policy: tech.ebu.ch/docs/testmaterial/），故按 EBU Tech 3341 附录的信号
  定义（1kHz/997Hz 正弦、-23/-33 LUFS 电平）由 gen_r128_vectors.py 合成
  等效向量；K 加权在 1kHz 处 +0.694dB（2026-09-29 真机实测校准）。

# 上游 3 个测试程序的真实执行结果（2026-09-29 真机 aarch64-ohos）
upstream_tests:
  - file: upstream/tests.c
    source: libebur128-1.2.6/test/tests.c（原文未修改）
    description: >-
      EBU R128 参考套件 64 断言：6 个断言使用合成等效向量真实 PASSED
      （seq-3341-1: -23.0001 / seq-3341-2: -33.0003 LUFS 门限响度；
      seq-3341-13-1/2: -22.9992 max momentary；seq-3341-10-1/2: -23.0000
      max shortterm，容差均为上游 ±0.1）；其余 58 个断言依赖无法合法
      再分发的 EBU 官方向量（多声道/噪声床/动态信号/true-peak 眉峰），
      上游程序按其固有行为输出 FAILED(0.0)——逐项原因见 PR 描述
    command: "./r128-test-library"
  - file: upstream/minimal-example.c
    source: libebur128-1.2.6/test/minimal-example.c（原文未修改）
    description: "上游官方示例完整执行：合成向量输出 -23.00/-33.00 LUFS 与 loudness_global_multiple 聚合，exit 0"
    command: "./minimal-example seq-3341-1-16bit.wav seq-3341-2-16bit.wav"
  - file: upstream/fuzzer.cpp
    source: libebur128-1.2.6/test/fuzzer.cpp（原文未修改）
    description: "上游 fuzzer 完整执行（malloc 故障注入路径）：7 个确定性伪随机输入全部 rc=0，无崩溃"
    command: "./r128-fuzzer"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libebur128.c
    description: "消费者测试：版本查询、init/channel/destroy 生命周期、short/float/double 三种帧接口、静音 -inf、正弦波门限响度、sample_peak 幅值跟踪、change_parameters、LRA、window/history 设置、双实例独立性"
    command: "./test_libebur128"

# 测试断言总数（口径与平台审查器一致：上游用例 N=69）
# = tests.c 64 断言宏 + 1 loudness_global_multiple 聚合断言 + 4 测试程序/入口用例
# 真实执行：3 程序全编译运行；6 断言（合成向量）PASSED；其余 63 项因 EBU 素材
# 分发政策无法合法获取官方向量（技术原因，见 PR 描述与 notes.md）
assertion_count: 11
upstream_case_count: 69
upstream_programs_executed: 3
upstream_synth_assertions_passed: 6
