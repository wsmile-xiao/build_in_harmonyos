software: lager
display: "Lager"
description: "C++ library for value-oriented design using Lenses and Observers"
category: library
homepage: "https://github.com/arximboldi/lager"
license: MIT
build_system: cmake

# OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Header-only 库，无需编译即可使用"
    - "需要 C++17 或更高版本编译器支持"
    - "依赖范围库（range-v3）和可选的依赖注入库（zug）"
  common_dependencies:
    - range-v3

# 版本索引
versions:
  "0.1.1":
    status: published
    build_date: "2026-05-30"
    test_result: "功能验证通过（4/4 测试通过）"