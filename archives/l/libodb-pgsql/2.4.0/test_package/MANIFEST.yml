package: libodb-pgsql/2.4.0
homepage: "https://www.codesynthesis.com/products/odb/"

upstream_check_command: "none available"
upstream_test_in_build: false
upstream_test_command: "none (the libodb-pgsql 2.4.0 tarball ships no test suite; see upstream_tests below)"
upstream_tests: []

# NO_UPSTREAM_TESTS discovery record (R51 three-step check):
#
# 1. Official entry point: the 2.4.0 release tarballs (libodb-pgsql-2.4.0,
#    libodb-2.4.0, sha256 pinned in conandata.yml) contain no tests/
#    directory and no Automake check targets — the top-level Makefile.am
#    only descends into odb/pgsql (libodb: odb/) and the only recursive
#    targets are build/install/doc/dist. Verified by directory enumeration
#    of the extracted tarballs (130 files, scout evidence) and by reading
#    Makefile.am. `make check` has no implementation upstream.
# 2. Build switch / dependency feasibility: the real upstream test suite is
#    the separate odb-tests-2.4.0 package. Running it requires (a) the odb
#    compiler (odb) to generate persistence code from .hxx definitions — a
#    GCC-plugin-based host compiler not ported to OHOS and not buildable in
#    this repo's CI sandbox, and (b) a live PostgreSQL server for the
#    runtime assertions. Both prerequisites are unavailable in the device CI
#    sandbox; there is no build knob in the libodb-pgsql build system that
#    produces a substitute test.
# 3. Alternative chosen: test_odb_pgsql.cxx in this test_package compiles a
#    C++ consumer against the packaged odb/odb-pgsql headers and libraries
#    and calls the real API (odb::pgsql::database construction incl.
#    connection factory instantiation, conninfo() round-trip, PQlibVersion()
#    from the transitive postgresql/18.3 package, ODB version contract
#    checks). This proves the libs are linkable, loadable and functional —
#    the maximal evidence obtainable without an odb compiler and a server.

test_package_tests:
  - file: test_odb_pgsql.cxx
    description: "C++ consumer test: constructs odb::pgsql::database (real constructor + connection_factory instantiation), checks conninfo() round-trip and ODB/LIBODB_PGSQL version contract, calls PQlibVersion() to prove libpq loads from the transitive dependency"
    command: "./test_odb_pgsql"

assertion_count: 3
