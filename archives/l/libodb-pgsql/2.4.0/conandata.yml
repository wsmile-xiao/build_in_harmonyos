# conandata.yml — libodb-pgsql 2.4.0
# Single-recipe bundle: the libodb-pgsql 2.4.0 runtime together with the
# libodb 2.4.0 core runtime it depends on. libodb is NOT published to the
# conan registry (no conancenter recipe, never adapted in this repo), and
# CI gate L0i/R36 fails any requires() that is not already published, so
# the core runtime is built from source in build() and packaged inside
# this one package (multi-component precedent: archives/p/postgresql/18.3).

sources:
  libodb-pgsql:
    url: "https://www.codesynthesis.com/download/odb/2.4/libodb-pgsql-2.4.0.tar.gz"
    sha256: "8e365b33617ec8ad8594d488755659dea28eea6463eedcde2ec59655fef20f1d"
  libodb:
    url: "https://www.codesynthesis.com/download/odb/2.4/libodb-2.4.0.tar.gz"
    sha256: "bfb9c398a6fdec675e33b320a1f80bdf74d8fbb700073bf17062f5b3ae1a2d5c"

patches:
  - patch_file: "patches/0001-odb-cxx17-header-compat.patch"
    patch_description: "libodb core under -std=c++17 + libc++ + HMDFS: (1) derive an ODB_NO_AUTO_PTR feature macro from __cplusplus in odb/details/config.hxx and compile out the std::auto_ptr interfaces (wrapper_traits/pointer_traits specializations, cache_query overloads, lazy_auto_ptr and its pointer_traits, transfer_ptr ctor, auto_ptr rvalue members of lazy_unique_ptr/lazy_shared_ptr) — C++17 removed std::auto_ptr from libc++/libstdc++; (2) drop the dynamic `throw (std::bad_alloc)` exception specifications on shared-ptr operator new — illegal in C++17; (3) remove the plain-text `version` doc file from the source root and dist_doc_DATA — with -I$(top_srcdir) it shadows libc++'s real <version> header (pulled by <memory>/<new>) and breaks every C++17 TU; (4) E011: create autoconf scratch dirs (configure ./confXXXXXX, config/config.guess cgXXXXXX) with umask 022 instead of 077 — HMDFS denies file creation inside 0700 dirs (same fix as unixodbc/2.3.12 patches/0007). Guards are language-standard checks only, no platform macros (R8)."
    patch_type: "portability"
  - patch_file: "patches/0002-libodb-pgsql-cxx17-header-compat.patch"
    patch_description: "libodb-pgsql under -std=c++17 + libc++ + HMDFS: remove the plain-text `version` doc file from the source root and dist_doc_DATA (with -I$(top_srcdir) it shadows libc++'s real <version> header and breaks every C++17 TU), and apply the E011 umask 022 scratch-dir fix to configure and config/config.guess (HMDFS denies file creation inside 0700 dirs)."
    patch_type: "portability"
