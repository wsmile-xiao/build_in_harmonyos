# Version-level manifest for libodb-pgsql 2.4.0
software: libodb-pgsql
version: "2.4.0"
status: built
build_date: "2026-09-17"

# Source information (two archives in one recipe: single-recipe bundle;
# libodb/2.4.0 has never been adapted/published and R36 forbids
# requires() on unpublished packages)
source:
  url: "https://www.codesynthesis.com/download/odb/2.4/libodb-pgsql-2.4.0.tar.gz"
  sha256: "8e365b33617ec8ad8594d488755659dea28eea6463eedcde2ec59655fef20f1d"
  tar_format: tar.gz
  bundled_sources:
    - name: libodb
      url: "https://www.codesynthesis.com/download/odb/2.4/libodb-2.4.0.tar.gz"
      sha256: "bfb9c398a6fdec675e33b320a1f80bdf74d8fbb700073bf17062f5b3ae1a2d5c"

# Build configuration
build:
  system: autotools
  # Release tarballs ship pre-generated configure (no autoreconf; CI device
  # has no automake). build() builds libodb-2.4.0 first, assembles the
  # --with-libodb staging layout (-I<root> -L<root>/odb -lodb), then builds
  # libodb-pgsql against it.
  pre_build_cmd: "apply_conandata_patches; configure (libodb); make; make install DESTDIR; configure --with-libodb (libodb-pgsql); make"
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-shared"
    - "--disable-static"
    - "--with-libodb=<staging>/odb-staging"
  dependencies:
    - "postgresql/18.3"
  package_scope: library_only
  cc: clang
  cxx: clang++

# Hints applied
hints_applied:
  - "template conanfile-autotools + unixodbc/2.3.12 OHOS autotools machinery (triplet mapping, CONFIG_SHELL/SHELL/TMPDIR/TMPPREFIX, ELF signing)"

# Patches applied by the current Conan recipe
patches_applied:
  - "0001-odb-cxx17-header-compat.patch"
  - "0002-libodb-pgsql-cxx17-header-compat.patch"

# Knowledge gained
knowledge_gained:
  - "C++17/libc++ removes std::auto_ptr: libodb 2.4.0 headers reference it unguarded (wrapper_traits, pointer_traits, cache_query overloads, lazy_auto_ptr, transfer_ptr ctor, auto_ptr rvalue members); patch derives ODB_NO_AUTO_PTR from __cplusplus in odb/details/config.hxx and compiles those interfaces out (no platform macros, R8)"
  - "C++17 forbids dynamic exception specs: drop throw(std::bad_alloc) on shared-ptr operator new declarations/definitions"
  - "The release tarballs ship a plain-text `version` doc file at the source root; with -I$(top_srcdir) it shadows libc++'s <version> header (pulled by <memory>/<new>) and breaks every C++17 TU — removed from source root and dist_doc_DATA in both trees"
  - "E011 sibling: autoconf 2.69 configure/config.guess create scratch dirs with explicit umask 077; HMDFS denies file creation inside 0700 dirs (config.status: Permission denied on subs1.awk) — patched to umask 022 in both trees"
  - "libodb m4 (--with-libodb=DIR) adds -I$DIR and -L$DIR/odb -lodb, so the staging layout must put odb/** headers AND the libodb library files directly inside $DIR/odb; libtool -release names the real file libodb-2.4.so (plus libodb.so symlink)"
  - "Manual configure invocations must pass --prefix=/ explicitly (autoconf default /usr/local redirects make install DESTDIR output under usr/local/)"
  - "codesynthesis.com is reachable directly from the CI device and is not in the CI mirror-fallback domain map, so conandata.yml URLs stay untouched"

# Known issues
known_issues:
  - "Upstream test suite (odb-tests-2.4.0) requires the odb code-generating compiler (host GCC plugin, not ported) plus a live PostgreSQL server; consumer test_package provides the achievable evidence (see test_package/MANIFEST.yml)"

# Installation products
products:
  libraries:
    - "libodb-pgsql.so.2.4 (libodb-pgsql runtime)"
    - "libodb.so.2.4 (bundled core runtime)"
  binaries: []
  headers:
    - "odb/*.hxx, odb/details/**, odb/posix/** (core, bundled)"
    - "odb/pgsql/*.hxx, odb/pgsql/details/config.h"

# Verification
verification:
  user_verify_passed: true
  staging_verify_passed: true

# Quality gates
quality_gates:
  G1_binary_integrity: pending
  G2_functional_availability: pending
  G3_portability: pending
  G4_archive_integrity: pending
