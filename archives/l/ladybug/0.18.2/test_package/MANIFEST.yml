# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: ladybug/0.18.2
homepage: "https://github.com/LadybugDB/ladybug"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# ladybug 上游测试需 BUILD_TESTS=ON 全量编译（项目极大），适配时关闭；
# 消费者侧由 test_package 的 C API 实质测试覆盖（见下）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：C API 建库/建表/写入/查询校验 + lbug --version"
    command: "./test_ladybug"
  - file: test_ai.c
    description: "AI 补充上游测试用例：value/data_type/query_result/prepared_statement/聚合/DDL/DML/过滤/事务/版本 10 大场景（规则 4 修复）"
    command: "./test_ai"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 62
