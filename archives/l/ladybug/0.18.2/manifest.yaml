# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS clang15 无法编译 simsimd 的 SVE/dotprod/fp16/bf16 扩展 SIMD 后端（arm_sve.h 无 SVE 使能即硬错、target(arch=+dotprod) 属性无法启用 vdotq_s32/bfloat16x8_t 内建），编译期禁用 SIMSIMD_TARGET_SVE/SVE2/NEON_I8/NEON_F16/NEON_BF16 仅保留 NEON baseline；simsimd 运行时 dispatch，向量查询仍走 NEON 后端"  # ref: E100
  - "OHOS 共享 libc++ (LLVM15) 的 std::format 符号（std::format_error/__throw_format_error）位于 libc++experimental.a，需 add_compile_definitions(_LIBCPP_ENABLE_EXPERIMENTAL) + 链接 -lc++experimental"  # ref: notes.md 发现与知识
  - "OHOS 无 libatomic，aarch64 clang 内联全部 128 位原子操作（ldaxp/stlxp），须跳过 CMake 默认的 -latomic 链接（按 CMAKE_SYSTEM_NAME=HarmonyOS 排除）"  # ref: notes.md 发现与知识
  - "OHOS libc++15 无 std::atomic_ref，改 __atomic_exchange_n 内建函数（patches 0002/0003）"  # ref: notes.md 发现与知识
  - "clang15 严格模式要求依赖类型前补 typename；结构化绑定不能作为 lambda 捕获（改普通变量）（patches 0004-0009）"  # ref: notes.md 发现与知识
  - "OHOS 下默认 max_db_size=8TB 的 mmap 会因地址空间限制失败，需显式设置较小 max_db_size（C API 测试用 256MB）"  # ref: notes.md 发现与知识
  - "R35: 验证 openssl/3.5.6.1.1 预编译 binary 用 conan cache path / conan download，禁止 conan list 判断"  # ref: notes.md 发现与知识
  - "test_package 链接 C++ 静态库时不能只用 LANGUAGES C：liblbug.a 内部引用 libc++ 符号（operator new/__cxa_*/std::mutex），须 project(LANGUAGES C CXX) + set_target_properties(LINKER_LANGUAGE CXX) 强制 C++ 链接器，否则 ld.lld 报未定义 C++ runtime 符号"  # ref: E247
  - "std::format 符号（std::format_error/typeinfo/vtable）位于 libc++experimental.a，消费者链接 liblbug.a 时须传 -lc++experimental；recipe 用 cpp_info.system_libs=['c++experimental']（OHOS 分支）声明，测试程序在 CMakeLists 兜底 target_link_options"  # ref: notes.md 发现与知识
  - "W3 本地 CI 门禁环境性阻塞经验：run_local_ci() 硬编码 600s 包装超时 vs CI 脚本强制 --build=ladybug/* 全量重建（25-35 分钟）+ github 源码下载慢；CI 真实预算 build_timeouts.txt 默认 3600s。大包本地 W3 必然超时，需主编/CI 侧放行（提高本地包装超时或加 build_timeouts.txt 覆盖）；门禁未过不得宣称 success（R9）"  # ref: notes.md W3 本地 CI 门禁阻塞记录

