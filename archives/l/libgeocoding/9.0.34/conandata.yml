  sha256: "5d2a61572110f0538fdb1afbc1f8381426fbfbbf544b45e8ae905297f2f5befa"
patches:
  "9.0.34":
    - patch_file: "patches/0001-ohos-conan-static-link-closure-and-abseil-mutex-api.patch"
      patch_description: >-
        OHOS/Conan 适配：(1) 上游 -Wall -Werror 下 abseil 20260107.1 的
        absl::MutexLock(&mutex) 已弃用导致编译失败，改用非弃用的引用构造；
        (2) 上游只发现 icuuc/icui18n/protobuf + 三个 Abseil 目标，静态归档不传递
        自身依赖，追加 Conan 侧完整静态闭包（icudata、protobuf 引用的其余 Abseil
        库、utf8_range/utf8_validity、zlib），供库与测试可执行文件链接。
      patch_type: "portability"
