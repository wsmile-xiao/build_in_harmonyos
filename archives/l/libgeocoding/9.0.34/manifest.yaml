version: "9.0.34"
software: "libgeocoding"
status: built
build_date: "2026-09-21"
build_system: cmake

source:
  url: "https://github.com/google/libphonenumber/archive/refs/tags/v9.0.34.tar.gz"
  sha256: "5d2a61572110f0538fdb1afbc1f8381426fbfbbf544b45e8ae905297f2f5befa"
  tar_format: tar.gz
  upstream_tag: "v9.0.34 (annotated b6e52ec48347097d71d60908cb6ab763dcbcd911 -> commit e6bd443a4d7a38662018a4f24c2265f944afd5fb)"

build:
  system: "cmake (上游 cpp/CMakeLists.txt，构建入口源码子目录 cpp/)"
  generator: Ninja
  configure_options:
    - "-DBUILD_GEOCODER=ON"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_STATIC_LIB=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DREGENERATE_METADATA=OFF"
    - "-DUSE_BOOST=OFF"
    - "-DUSE_STDMUTEX=ON"
    - "-DUSE_ICU_REGEXP=ON"
    - "-DUSE_ALTERNATE_FORMATS=ON"
    - "-Dabsl_DIR=<abseil-cpp 包>/lib/cmake/absl（避免 find_package(absl) 落空走 FetchContent）"
    - "-DCMAKE_PROGRAM_PATH=<protobuf 包>/bin（protoc 不在系统 PATH）"
    - "-DLIBPHONENUMBER_CONAN_LIBS=<静态闭包，见 patches/0001>"
  dependencies:
    - abseil-cpp/20260107.1
    - protobuf/33.6
    - icu4c/78
    - googletest/1.12.1 (test_requires：仅构建期运行上游 gtest，不向下游传播)
  cc: clang
  cxx: clang++

exports:
  libs:
    - libgeocoding.a
    - libphonenumber.a
  include: "phonenumbers/**（含 phonenumbers/geocoding/）"

patches_applied:
  - "patches/0001-ohos-conan-static-link-closure-and-abseil-mutex-api.patch"

upstream_tests:
  framework: gtest
  build_in_build_method: true
  suites:
    - name: libphonenumber_test
      command: "./libphonenumber_test"
      ran: 327
      passed: 327
      failed: 0
      skipped: 0
    - name: generate_geocoding_data_test
      command: "./tools/generate_geocoding_data_test"
      ran: 2
      passed: 2
      failed: 0
      skipped: 0
  sample:
    name: geocoding_test_program
    command: "./geocoding_test_program"
    exit_code: 0
    output: "Mountain View, CA"
  total: {ran: 329, passed: 329, failed: 0, skipped: 0}
  static_case_count_check: "上游 *_test.cc 静态 TEST 宏 327 + tools 2 = 329 = 实际执行数（无漏测）"

test_package:
  checks: 6
  ohos_specific_checks: 1
  ohos_specific_case: "ohos-concurrent-geocoding-embedded-data"

knowledge_gained:
  - "abseil 20260107.1 弃用 absl::MutexLock(ptr) 构造；上游 -Wall -Werror 下在 geocoding 源码（phonenumber_offline_geocoder.cc）构成硬错误，改用引用构造即可，无需放弃 -Werror"
  - "上游 CMake 的依赖发现有缺口：只 find_library 出 icuuc/icui18n/protobuf，静态归档不传递自身依赖 → libprotobuf.a 需要的其余 Abseil 库、utf8_range/utf8_validity、zlib 与 libicuuc.a 需要的 icudata 必须由配方按 cpp_info 闭包补齐（含 --start-group）"
  - "Conan 的工具链只写 CMAKE_LIBRARY_PATH/CMAKE_INCLUDE_PATH，不写 CMAKE_PREFIX_PATH：upstream find_package(absl) 因此落空并转入 FetchContent 从 GitHub 拉源码（本地有网会静默成功、CI 无外网必炸）→ 配方显式设 absl_DIR"
  - "CMake Makefile 生成器 + 上游「空 echo 自定义命令（REGENERATE_METADATA=OFF 分支）」：build.make 带 .DELETE_ON_ERROR，规则一执行就删除随包发布的 cpp/src/phonenumbers/test_metadata.cc → phonenumber_testing 编译失败；改用 Ninja 生成器即消除（实测 Ninja 下全量构建/测试/install 通过）"
  - "protoc 由 protobuf 依赖包 bin/ 提供，不在系统 PATH；CMakeToolchain 不注入，需 CMAKE_PROGRAM_PATH 或环境变量显式指向"
