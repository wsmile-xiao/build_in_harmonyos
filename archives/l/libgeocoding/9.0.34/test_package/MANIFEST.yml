package: libgeocoding/9.0.34
homepage: "https://github.com/google/libphonenumber"

upstream_check_command: "cmake --build <build> --target tests"
upstream_test_in_build: true
upstream_test_command: "./libphonenumber_test + ./tools/generate_geocoding_data_test"

