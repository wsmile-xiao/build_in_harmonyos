test_package_tests:
  - file: test.cpp
    description: "通过已安装的 libgeocoding 公开 API 真实执行离线地理编码（US/CN/DE 三地 + 本地化）"
    command: "./test_libgeocoding"
  - file: test.cpp
    description: "HarmonyOS 专有用例：并发调用离线 geocoder（覆盖适配修复的 absl::Mutex 加锁路径）+ 编译期嵌入数据无外部文件依赖"
    command: "./test_libgeocoding  # CHECK 6 (仅 OHOS)"

assertion_count: 6
