software: libgeocoding
display: "libgeocoding"
description: "Google libphonenumber 的离线电话号码地理编码库（C++，phonenumbers/geocoding）"
category: library
homepage: "https://github.com/google/libphonenumber"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "与 libphonenumber 同源：同一份 cpp/ CMakeLists.txt 由 BUILD_GEOCODER=ON 一次配置同时产出 geocoding 与 phonenumber 两个归档"
    - "上游 CMake 的 -Wall -Werror 在 abseil 20260107.1 下把 MutexLock(&mu_) 弃用警告变成硬错误 → 改用非弃用构造"
    - "上游只发现 icuuc/icui18n/protobuf + 三个 Abseil 目标，静态闭包（icudata、protobuf 引用的其余 Abseil、utf8_range/utf8_validity、zlib）需显式补齐"
    - "REGENERATE_METADATA=OFF（无 Java/Maven），USE_BOOST=OFF + USE_STDMUTEX=ON 砍掉 Boost 链"
    - "CMake 生成器必须用 Ninja：Makefile 生成器 + 上游空 echo 自定义命令会删除随包发布的 test_metadata.cc"
  common_dependencies:
    - abseil-cpp
    - protobuf
    - icu4c
    - googletest

versions:
  - version: "9.0.34"
    status: built
    build_date: "2026-09-21"
    notes: 上游 CMake 全量构建 + 上游 gtest 329 用例全通过（含 tools 生成器自测与 geocoding 示例程序）
