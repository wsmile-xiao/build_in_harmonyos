patches_applied: []

knowledge_gained:
  - "用 make 直接驱动的三方库：把 CC/LD/AR/RANLIB/CFLAGS/SOFLAGS 全部作为 make 变量传入（libmoe 同法），并显式设 DESTDIR= 与 PREFIX=<package_folder> 让上游 install 规则直接落到 Conan 包目录"
  - "clang 15 默认 -fno-common：libacpi.h 直接**定义** batteries/thermals/fans 全局数组（2007 年 gcc 默认 -fcommon 时无碍），现代工具链下库与消费者会各产生一份同名符号而链接失败 → 库与消费者都加 -fcommon"
  - "本库数据源是运行中的内核接口（/proc/acpi 与 /sys/class/power_supply、/sys/class/thermal），因此消费者测试应钉住契约（常量/枚举/导出数组/返回码集合）而不是具体数值，才能在不同机器上稳定判定"
  - "上游 demo 在缺少 ACPI 接口时返回 -1 属于设计行为而非失败：配方执行并记录日志，测试结果按 executed_with_environment_limitation 如实申报"
