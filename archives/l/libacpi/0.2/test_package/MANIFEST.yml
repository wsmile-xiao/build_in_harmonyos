# test_package/MANIFEST.yml
# libacpi 0.2.
#
# Upstream has no unit-test framework.  It ships test-libacpi.c, a demo that
# prints the batteries, thermal zones, fans and AC adapter reported by the
# running kernel and returns -1 by design when neither /proc/acpi nor
# /sys/class/power_supply is available.  The recipe builds and runs it as
# behavioural evidence and logs the outcome; consumer coverage over the
# installed package is provided by a CMake program that pins the library's
# contract, which is independent of what the machine exposes.

package: libacpi/0.2
homepage: http://www.ngolde.de/libacpi.html

upstream_tests_exist: true
upstream_test_audit: "no tests/ directory and no check target; test-libacpi.c is a demo program built by the Makefile's default target and installed into bin/"
upstream_check_command: "n/a (no make check)"
upstream_test_in_build: true
upstream_test_command: "make CC=clang CFLAGS='-O2 -Wall -fcommon -fPIC' && ./test-libacpi"

upstream_tests:
  - name: test-libacpi
    command: "./test-libacpi"
    expected: "runs and prints the kernel's ACPI inventory; upstream exits -1 by design when no ACPI interface exists (reported as an environment limitation)"

test_package_tests:
  - file: test_libacpi_consumer.c
    description: "documented constants (PROC_ACPI, LINE_MAX, MAX_ITEMS, buffer sizes), enum values (SUCCESS..ITEM_EXCEED, power_state_t), exported batteries/thermals/fans arrays, documented return-code sets of init_acpi_* and check_acpi_support, count bounds and read_acpi_acstate"
    command: "./libacpi_consumer"

test_files:
  - path: "test_package/test_libacpi_consumer.c"
    test_type: "R34"
    assertion_count: 24

test_package_test_count: 1
consumer_assertion_count: 24
assertion_count: 24
