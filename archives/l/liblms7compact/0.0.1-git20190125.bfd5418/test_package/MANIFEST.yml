# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liblms7compact/0.0.1-git20190125.bfd5418
homepage: "https://github.com/xtrx-sdr/liblms7002m"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 CMakeLists.txt 未启用测试 (无 enable_testing/ctest, 无 test 目录),
# 上游测试数量为 0；测试由 test_package 补齐。
upstream_check_command: "ctest -N"
upstream_tests_found: 0

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (上游无测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者集成测试：强符号 SPI/日志 hook + 验证寄存器写入序列与 CGEN 算法"
    command: "./test_liblms7compact"
  - file: test_default_hooks.c
    description: "鸿蒙特有测试：默认 weak hook 兼容层可独立链接运行 (无硬件时返回错误而非崩溃)"
    command: "./test_liblms7compact_default_hooks"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
