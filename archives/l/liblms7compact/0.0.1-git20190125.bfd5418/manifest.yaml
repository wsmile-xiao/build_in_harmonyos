# 编译中学到的知识
knowledge_gained:
  - "ref: E269 上游 regs/enum_parser.py 依赖 Python2 + Cheetah 模板引擎（构建期代码生成）；已重写为纯 Python3（iteritems->items、去 Cheetah、模板改为字符串拼接），输出符号名与值保持不变"
  - "ref: E187 上游 CMakeLists.txt 的 cmake_minimum_required(2.8) 在 CMake 4.x 下失败（<3.5 兼容已移除），需提升到 3.16（同时满足 find_package(Python3) 需要 3.12+）"
  - "ref: E294 上游 CMakeLists 硬编码非 Windows 构建 SHARED；已改为尊重 BUILD_SHARED_LIBS（Conan shared 选项可控制静态/动态）"
  - "ref: E085 liblms7002m.c 的 SPI/日志 hook（lms7_spi_transact/lms7_spi_post/lms7_log_ex）由集成方提供，上游无默认实现，独立链接 .so 会失败；新增 lms7_defaults.c 提供 weak 默认实现（消费方可强符号覆盖）"
  - "ref: E140 liblms7002m.h 用 #ifdef __linux 保护 unistd.h；OHOS 工具链 triple aarch64-linux-ohos 定义 __linux__（CMake 平台名 HarmonyOS），无需修改"
  - "ref: DRAFT-cpplocate-2.3.0-test-package-reliability 上游无测试（CMakeLists 无 enable_testing/ctest）；test_package 提供 2 个真实测试（消费者集成 + 鸿蒙特有 weak hook 检查），断言计入 ctest 自动化路径"

