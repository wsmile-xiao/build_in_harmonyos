software: libmaa
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/dict/libmaa/libmaa-1.5.1/libmaa-1.5.1.tar.gz"

  # 源码校验和
  sha256: "3a30e25f038e99c4715125545516490d991fe3a505825cc832b1a956e31bf669"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: mkc

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: mkc

  # 配置选项列表（mkc macros for OpenHarmony aarch64）
  configure_options:
    - "-DSIZEOF_LONG=8"
    - "-DSIZEOF_VOID_P=8"
    - "-DHAVE_HEADER_SYS_RESOURCE_H=1"
    - "-DHAVE_HEADER_ALLOCA_H=1"
    - "-DMAA_MAJOR=4"
    - "-DMAA_MINOR=1"
    - "-DMAA_TEENY=0"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libmaa uses mk-configure (mkc) build system, not standard autotools. Requires manual compilation with mkc macro definitions"
  - "SIZEOF_LONG=8 required for aarch64 (bit.c), SIZEOF_VOID_P=8 for pointer operations"
  - "HAVE_HEADER_SYS_RESOURCE_H=1 required for timer.c (sys/resource.h IS available on OpenHarmony)"
  - "HAVE_HEADER_ALLOCA_H=1 required for maaP.h (alloca.h IS available on OpenHarmony)"
  - "arggram.c must be generated from arggram.txt using awk arggram2c script"
  - "maa_init() must be called before using library (starts 'total' timer); maa_shutdown() stops it"
