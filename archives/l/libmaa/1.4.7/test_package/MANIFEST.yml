# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libmaa/1.4.7
homepage: "https://github.com/cheusov/libmaa"

# 上游测试命令（BSD make mkc 体系：make test；GNU make 不兼容，按等价方式逐个编译运行）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（tests/ 下 18 个独立测试程序，全部编译并运行通过）
upstream_tests:
  - file: tests/arg/argtest.c
    source: libmaa-1.4.7/tests/arg/argtest.c
    description: "arg grammar parsing tests (arggram)"
    command: "./argtest argtest.in"
  - file: tests/base/basetest.c
    source: libmaa-1.4.7/tests/base/basetest.c
    description: "base26/base64 conversion tests"
    command: "./basetest"
  - file: tests/basics/basicstest.c
    source: libmaa-1.4.7/tests/basics/basicstest.c
    description: "basic library facilities tests"
    command: "./basicstest"
  - file: tests/bit/bittest.c
    source: libmaa-1.4.7/tests/bit/bittest.c
    description: "bit set manipulation tests"
    command: "./bittest"
  - file: tests/debug/debugtest.c
    source: libmaa-1.4.7/tests/debug/debugtest.c
    description: "debugging helpers tests"
    command: "./debugtest"
  - file: tests/err/errtest.c
    source: libmaa-1.4.7/tests/err/errtest.c
    description: "error handling / log file tests"
    command: "./errtest 1..8"
  - file: tests/hash/hashtest.c
    source: libmaa-1.4.7/tests/hash/hashtest.c
    description: "hash table tests (with rnd.c)"
    command: "./hashtest"
  - file: tests/list/listtest.c
    source: libmaa-1.4.7/tests/list/listtest.c
    description: "doubly-linked list tests"
    command: "./listtest"
  - file: tests/log/logtest.c
    source: libmaa-1.4.7/tests/log/logtest.c
    description: "logging facility tests"
    command: "./logtest _log_test.txt"
  - file: tests/memobj/memobjtest.c
    source: libmaa-1.4.7/tests/memobj/memobjtest.c
    description: "memory object tests"
    command: "./memobjtest"
  - file: tests/memstr/memstrtest.c
    source: libmaa-1.4.7/tests/memstr/memstrtest.c
    description: "memory string tests"
    command: "./memstrtest"
  - file: tests/pr/prtest.c
    source: libmaa-1.4.7/tests/pr/prtest.c
    description: "generic printing/parsing tests"
    command: "./prtest"
  - file: tests/prime/primetest.c
    source: libmaa-1.4.7/tests/prime/primetest.c
    description: "prime number tests"
    command: "./primetest"
  - file: tests/prm/prmtest.c
    source: libmaa-1.4.7/tests/prm/prmtest.c
    description: "pattern matching tests"
    command: "./prmtest"
  - file: tests/set/settest.c
    source: libmaa-1.4.7/tests/set/settest.c
    description: "set tests (with rnd.c)"
    command: "./settest"
  - file: tests/sl/sltest.c
    source: libmaa-1.4.7/tests/sl/sltest.c
    description: "skip list tests"
    command: "./sltest"
  - file: tests/stack/stacktest.c
    source: libmaa-1.4.7/tests/stack/stacktest.c
    description: "stack tests"
    command: "./stacktest"
  - file: tests/string/stringtest.c
    source: libmaa-1.4.7/tests/string/stringtest.c
    description: "string pool tests"
    command: "./stringtest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 maa_version/hsh_*/str_pool_* 公开 API 验证哈希表与字符串池行为"
    command: "./test_libmaa"
  - file: ohos_special_test.c
    description: "鸿蒙专项测试：验证 timer(getrusage) 与 bit(SIZEOF_LONG=8) 两个 OHOS 平台适配点"
    command: "./test_libmaa_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17