software: libmaa
display: "libmaa"
description: "Memory Allocator Abstraction library - provides a unified interface for various memory allocation strategies"
category: system
homepage: "https://github.com/s-yata/libmaa"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "BSD make 不兼容 GNU make，需创建 Makefile.gnu"
    - "musl 缺少 sys/resource.h，timer.c 无法编译"
    - "bit.c 需要 SIZEOF_LONG=8 手动定义"
    - "共享库需要 -fPIC 编译选项"
  common_dependencies: []

versions:
  "1.4.7":
    status: built
    build_date: "2026-06-02"