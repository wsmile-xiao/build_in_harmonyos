# test_package/MANIFEST.yml
# langford 0.0.20130228 - upstream test declaration.

package: langford/0.0.20130228
homepage: "http://www.pervices.com/"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream 0.0.20130228 ships the kernel module (langford.c/langford.h), the
  userspace utilities (langford_util.cpp, langford_adc_util.cpp,
  langford_spi.cpp) and the libs/ RF/VGA programmers, plus a hand-written
  Makefile. There is no test suite (no make check, no ctest, no tests/
  directory with expectations); test/*.sh and test/*.grc are hardware demo
  scripts for a real Noctar board + GNU Radio and are not runnable here.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_langford.sh
    description: "installed userspace tools: usage and error paths of langford_util, langford_adc_util, langford_rf_fsynth and langford_rx_rf_bb_vga"
    command: "sh test_langford.sh"
  - file: test_spi.cpp
    description: "consumer compiled and linked against the installed liblangford_spi.a + headers; exercises LangordSpiWrite() and the ioctl constants"
    command: "<c++> -std=gnu++98 test_spi.cpp -llangford_spi"

test_files:
  - path: "test_package/test_langford.sh"
    test_type: "R34"
    assertion_count: 16
  - path: "test_package/test_spi.cpp"
    test_type: "R34"
    assertion_count: 1

test_package_test_count: 2
consumer_assertion_count: 17
upstream_test_cases: 0
assertion_count: 17
