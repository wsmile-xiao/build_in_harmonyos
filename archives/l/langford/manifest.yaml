software: langford
display: "langford"
description: "Per Vices Noctar（原 Phi）IQ 解调板的主机侧控制工具（用户态工具 + SPI 助手库）"
category: electronics
homepage: "http://www.pervices.com/"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游含 Linux 内核模块 langford.c；OHOS 无 loadable module / linux/pci.h，按 Debian langford-dkms 口径单独排除"
    - "用户态部分（langford_util/adc_util/spi/lib s）无三方依赖，clang++ -std=gnu++98 直接编译"
    - "上游只在明文 HTTP（pervices.com）发布；用 Debian 同版本 .orig.tar.bz2（HTTPS）固定 sha256"
    - "liblangford_spi.a 由 langford_spi.cpp 打包，LangordSpiWrite() 通过 ioctl 位敲 SPI"
  common_dependencies: []

versions:
  - version: "0.0.20130228"
    status: built
    build_date: "2026-09-29"
