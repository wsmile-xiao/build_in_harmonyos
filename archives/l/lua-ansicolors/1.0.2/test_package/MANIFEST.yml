test_package:
  type: conan
  language: c
  framework: lua-embed-smoke
  tests:
    - name: require-ansicolors
      command: ./test_ansicolors
      expected: "lua-ansicolors smoke ok"
  dependencies:
    - "lua/5.4.8"
  notes:
    - "Compiles a C Lua embedding smoke test and loads require('ansicolors') through Conan runenv LUA_PATH."
