# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: liblaxjson/1.0.5
homepage: "https://github.com/andrewrk/liblaxjson"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/primitives.c
    source: liblaxjson-1.0.5/test/primitives.c
    description: "Primitives test: booleans, numbers, strings, arrays, objects, escapes, unicode, decimal parsing (registered as ctest DetectPrimitives)"
    command: "./primitives_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 lax_json_create/feed/eof/destroy 解析真实 JSON 文档"
    command: "./test_liblaxjson"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 30
