# libarc 软件级 manifest
software: libarc
display: "libarc"
description: "出云雅尚（Masanao Izumo）的微型 C 解压库，可读取 tar / tar.gz / zip / lzh / MIME multipart 归档"
homepage: "http://www.onicos.com/staff/iz/release/"
license: GPL-2.0-or-later
category: compress
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "上游为手写 Makefile（无 configure），硬编码 gcc/ar，不适合 OHOS；conanfile.py 直接用 OHOS toolchain 编译 29 个真实 C 源文件并归档为静态库，不打补丁"
    - "上游 all 默认只构建静态库 libarc.a；arccat 示例工具不属于默认产物，本次仅交付静态库"
    - "公开头为 libarc/url.h、libarc/arc.h、libarc/mblock.h、libarc/memb.h（上游 install 目标安装的 4 个）"
    - "纯 C 库，无外部依赖；tar 解析为 ARM-safe 写法（checksum 兼顾 signed/unsigned）"
    - "许可证为 GPL-2.0-or-later"
  common_dependencies: []

# 版本索引
versions:
  "2.0.2":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libarc/2.0.2"
