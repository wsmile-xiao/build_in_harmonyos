# conandata.yml — libarc 2.0.2
#
# Upstream publishes no git repository and no versioned HTTPS API; the
# canonical source is Masanao Izumo's release directory
# (http://www.onicos.com/staff/iz/release/, documented as WWW by the
# FreeBSD archivers/libarc port). The file is currently not reachable
# there (HTTP 403/404, Sep 2026), so the FreeBSD ports distfile mirror
# — official FreeBSD infrastructure serving the identical tarball
# (size 97129 bytes, sha256 below, cross-checked against the FreeBSD
# ports distinfo) — is listed first; the official upstream URL is kept
# last as fallback. Conan `get` tries URLs in order with the same
# sha256.
#
# Mirror order note (Sep 2026 preflight): the https distcache endpoint
# fails TLS verification on the build workers (SSL CERTIFICATE_VERIFY_
# FAILED, hostname mismatch for 'distcache.freebsd.org'), so the plain
# http variant of the same official cache is listed first (identical
# file, same sha256; avoids TLS without weakening the hash check).
# The https variant is kept second, upstream http/https last.
sources:
  url:
    - "http://distcache.freebsd.org/ports-distfiles/libarc-2.0.2.tar.gz"
    - "https://distcache.freebsd.org/ports-distfiles/libarc-2.0.2.tar.gz"
    - "http://www.onicos.com/staff/iz/release/libarc-2.0.2.tar.gz"
    - "https://www.onicos.com/staff/iz/release/libarc-2.0.2.tar.gz"
  sha256: "a6778267610803c9607f26c5f77278840acff459bf518421a7b9be998b6fadf7"
