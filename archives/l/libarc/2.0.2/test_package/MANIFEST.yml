# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libarc/2.0.2
homepage: "http://www.onicos.com/staff/iz/release/"

# 上游正式自动化测试：0。libarc-2.0.2.tar.gz（97129 字节，
# sha256=a6778267...adf7，已校验）解包共 46 个文件：29 个 .c、
# 10 个 .h（含 libarc/ 下 4 个公开头）、Makefile、config.h、COPYING，
# 无 test/、tests/ 目录，无 *test* 源文件，Makefile 目标仅有
# all / arccat / clean / install（无 check / test 目标），无
# CMakeLists.txt / configure / meson.build。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "libarc-2.0.2.tar.gz 顶层（46 文件：29 .c + 10 .h + Makefile + config.h + COPYING）"
    finding: "无 test/、tests/、t/ 目录；无任何 *test*、Test*、*_test.c 源文件；无 CMakeLists.txt / CTestTestfile.cmake / configure(.ac) / Makefile.am / meson.build"
  - path: "libarc-2.0.2/Makefile（全部目标）"
    finding: "目标仅有 all（构建 libarc.a 静态库）、arccat（示例工具，需显式 make）、clean、install；无 check / test / tests 入口，无 TESTS / check_PROGRAMS / TESTS_ENVIRONMENT 变量"
  - path: "url_news.c / url_newsgroup.c / url_uudecode.c / url_b64decode.c / url_cgiesc.c / url_hqxdecode.c / url_qsdecode.c 内 #ifdef TEST main()"
    finding: "各为手写交互式演示程序入口（用法打印 + exit），无断言、无测试框架接线，不构成自动化套件；conanfile build() 不调用"
  - path: "FreeBSD archivers/libarc port（Makefile / pkg-plist）"
    finding: "port 仅执行构建与安装（arccat + libarc.so.1 + 6 头文件），无 do-test / TEST_TARGET；佐证上游无可接入的测试套件"

test_package_tests:
  - file: test_arc.c
    description: "真实消费者功能测试（5 组 CHECK-OK）：版本宏与符号校验 + get_archive_type 7 种扩展名前缀映射 + arc_wildmat/arc_case_wildmat 匹配语义 + arc_compress->arc_decompress 字节精确往返 + 手工 ustar 包经 url_arc_open 端到端读回（与 arccat 同路径）"
    command: "./test_arc"

assertion_count: 5
