software: libarc
# 版本级 manifest
# 文件位置: archives/l/libarc/2.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: makefile

# Conan 引用
conan_ref: "libarc/2.0.2"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（与 conandata.yml 一致：FreeBSD 官方 distfile 镜像在前，
  # 上游作者发布目录（当前不可达）作为回退保留在后）
  url: "https://distcache.freebsd.org/ports-distfiles/libarc-2.0.2.tar.gz"

  # 源码校验和（实测下载计算 + FreeBSD ports distinfo 三方一致）
  sha256: "a6778267610803c9607f26c5f77278840acff459bf518421a7b9be998b6fadf7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（手写 Makefile，无 configure 选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本次不修改任何上游源码：上游 Makefile 硬编码
# gcc/ar，不适合 OHOS；conanfile.py 直接用 OHOS toolchain 编译
# 29 个真实 C 源文件并归档，不打补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libarc 2.0.2 上游 Makefile 硬编码 CC=gcc / AR=ar -cr / PREFIX=/usr/local，无 configure；conanfile.py 绕过它，直接调用 OHOS toolchain 编译 OBJS 全部 29 个真实 C 源文件（-O2 -I. -Wall -fPIC），用 llvm-ar rcs 归档为 libarc.a，不打补丁、不改上游"
- "上游 all 默认只构建静态库 libarc.a；arccat 示例工具需显式 make arccat，不属于默认产物，本次仅交付静态库（package_type=library，无 commands.json，libb64 1.2.1 同类先例）"
- "公开头仅为上游 install 目标安装的 4 个：libarc/url.h、libarc/arc.h、libarc/mblock.h、libarc/memb.h（unlzh.h/zip.h 为内部头，不安装）"
- "核心 API（经源码确认）：ARC_LIB_VERSION=2.0.2、get_archive_type（纯扩展名映射：.tar/.tar.gz/.tgz/.zip/.lzh/.lha/mail:）、arc_wildmat/arc_case_wildmat（返回 TRUE=1/FALSE=0）、arc_compress/arc_decompress（输入缓冲仅在零输出时被库 free，成功路径调用者自理）、url_arc_open（arccat 同路径，需先 url_add_modules 注册 file/dir 模块）"
- "tar 解析为 ARM-safe 写法：tar_checksum 同时校验 signed/unsigned 两种和，octal_value 全程用 (unsigned char) 强转，无 char 符号性陷阱"
- "上游源码包 sha256=a6778267610803c9607f26c5f77278840acff459bf518421a7b9be998b6fadf7（97129 字节），与 FreeBSD ports distinfo 一致；作者发布目录当前返回 403/404，故 conandata.yml 以 FreeBSD distcache 镜像为首选、官方 URL 为回退"
- "许可证为 GPL-2.0-or-later（COPYING：GPLv2 或任何更新版本），package() 同步安装 COPYING 到 licenses/"
- "test_package/test_arc.c 为真实功能测试（5 组 CHECK-OK）：版本校验 + 7 种类型映射 + 通配符语义 + deflate 压缩往返 + 手工 ustar 经 url_arc_open 端到端读回"

# ============================================================
# 上游测试核验（严格审计）
# ============================================================

# 正式自动化测试：解包全树审计实证不存在
# 46 文件：29 .c + 10 .h + Makefile + config.h + COPYING 等；
# 无 test/ tests/ 目录、无 *test* 源文件、无 check/test 目标、
# 无 CMake/CTest/configure/meson 接线
upstream_automated_tests:
  exists: false
  test_source_files: 0
  test_targets: 0
  executed: 0
  passed: 0
  failed: 0
  skipped: 0
