version: "0.8"
software: libcaption
build_system: cmake
status: built
build_date: "2026-08-25"

source:
  url: "https://github.com/szatmary/libcaption/archive/refs/tags/v0.8.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_RE2C=OFF"
    - "-DBUILD_EXAMPLES=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

knowledge_gained:
  - "libcaption 0.8 是纯 C 库，无任何 OS 特定调用（无 uname/config.guess/config.sub/pthread/dlopen），OHOS 上原生 CMake 构建无需源码级平台补丁"
  - "CMakeLists.txt 仅 cmake_minimum_required(VERSION 2.8) 被 CMake 4.x 拒绝（4.x 最低要求 3.10），bump 到 3.10 即可，与 NixOS package.nix 的 postPatch 相同"
  - "re2c 可选（ENABLE_RE2C 默认 OFF），上游已提交 src/eia608_from_utf8.c.cached，构建时 configure_file 复制为 .c 源文件，无需 re2c 工具"
  - "上游正式测试只有 test_wrap（utf8 行折叠，确定性输入，exit 0，无媒体依赖）；eia608_test 与 test_sei(test_captions) 在 CMakeLists.txt 中被注释，非正式测试；examples/ 13 个 CLI 工具属示例非测试"
  - "test_sei.c 从 argv 读取媒体文件，但因被注释不参与构建，不存在媒体样本阻塞；仓库自带 unit_tests/tos.scc 但无活跃测试使用"
  - "caption 库导出 include/caption/*.h 与 lib/libcaption.a/.so；package_info 暴露 caption::caption cmake 目标与 caption pkg-config 名"
