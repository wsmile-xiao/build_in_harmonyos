package: libcaption/0.8
homepage: "https://github.com/szatmary/libcaption"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test_wrap"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target test_wrap && ./test_wrap"

# 上游实际运行的测试程序
# libcaption 0.8 顶层 CMakeLists.txt 仅注册 test_wrap（未注释）。
# eia608_test 与 test_sei(test_captions) 在 CMakeLists 中被注释，非正式测试。
# test_wrap 无媒体依赖（确定性 utf8 行折叠输入，exit 0）。
upstream_tests:
  - file: unit_tests/test_wrap.c
    source: libcaption-0.8/unit_tests/test_wrap.c
    description: "utf8 line-wrap exercise (deterministic input, exit 0, no media dependency)"
    command: "./test_wrap"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer CEA-608 parity/encode/decode + caption_frame pop-on flow (resume_loading->write->end_of_caption->read) (21 deterministic checks)"
    command: "./test_libcaption"

# 测试断言总数 (消费者侧确定性 checks)
assertion_count: 19
