build_system: "direct-cc"

source:
  url: "https://github.com/rescrv/libmacaroons/archive/releases/0.3.0.tar.gz"
  sha256: "e1db403c01b0407a276a84b2aaf54515faebe1a5c1a31ec10857a1917161d109"
  tar_format: tar.gz

vendored:
  sodium:
    version: "1.0.20"
    url: "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz"
    sha256: "ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19"
    reason: "conancenter shadows every libsodium recipe revision in dual-remote preflight, so no external requires() can reuse ohpcd binaries; vendored sources build to a private staging prefix with /bin/sh"
    build: "sh ./configure --disable-shared --enable-static --disable-dependency-tracking + make -j1 + make install (umask 022 relaxation, HMBS TMPDIR, probed CC/AR)"

build:
  system: direct-cc
  package_type: library
  configure_options: []
  dependencies: []

patches_applied: []

knowledge_gained:
  - "Upstream lib sources are exactly 4 files (Makefile.am libmacaroons_la_SOURCES): base64.c, macaroons.c, packet.c, port.c"
  - "Upstream hard-requires libsodium >= 0.4 (configure.ac PKG_CHECK_MODULES); satisfied by vendored 1.0.20 release tarball built to staging (no external requires, immune to conancenter shadowing)"
  - "Vendored sodium configure must run under /bin/sh with HMBS TMPDIR and umask 022; profile hnp bash is inaccessible in preflight sandbox"
  - "Upstream TESTS (default opts) is a single python2 doctest (test/python-hmac-sanity-check.sh, 4 HMAC vectors); device python3 runs a faithful port with identical digests"
