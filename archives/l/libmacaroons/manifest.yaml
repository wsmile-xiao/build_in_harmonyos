software: libmacaroons
display: "libmacaroons"
description: "C library for macaroons authorization credentials with decentralized delegation and attenuation"
category: library
homepage: "https://github.com/rescrv/libmacaroons"
license: BSD-3-Clause
build_system: direct-cc

ohos_adaptation:
  key_points:
    - "Direct-cc build of the 4 upstream C sources; archive ships no pre-generated configure"
    - "libsodium >= 0.4 hard dependency is vendored (1.0.20 release tarball) to a staging prefix with /bin/sh; no external conan requires"
    - "Upstream TESTS is a single python2 doctest (4 HMAC vectors), run as a faithful python3 port with cross-checked digests"
  common_dependencies: []

versions:
  "0.3.0":
    status: built
    build_date: "2026-09-14"
