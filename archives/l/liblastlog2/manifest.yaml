software: liblastlog2
display: "liblastlog2"
description: "Y2038-safe lastlog library with SQLite3 backend from the util-linux suite"
category: system
homepage: "https://github.com/util-linux/util-linux"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Built from the full util-linux tarball (--disable-all-programs --enable-liblastlog2); the global switch also disables liblastlog2 itself, so the explicit enable is mandatory."
    - "Hard dependency on sqlite3 (pkg-config name sqlite3); sqlite3 probing failure silently disables the library, so the configure summary must show 'lastlog2 support: yes'."
    - "<lastlog.h> is glibc-only; guarded with !__GLIBC__ (never __OHOS__, which the target clang does not define) with a layout-compatible struct lastlog for ll2_import_lastlog()."
    - "Upstream `make check` harness tests/run.sh shebangs /bin/bash which is absent on OHOS; the harness is invoked through bash via the Makefile's TESTS_COMMAND variable."
    - "config.guess needs the HarmonyOS detection patch; config.sub v2.42.2 already supports linux-ohos* natively."
  common_dependencies:
    - "sqlite3/3.49.1"

versions:
  "2.42.2":
    status: built
    build_date: "2026-09-14"
    format: conan
    note: "Autotools lib-only build; upstream make check (7 C tests + 7 ts scripts) and consumer test_package on OHOS aarch64."
    issue: ""
