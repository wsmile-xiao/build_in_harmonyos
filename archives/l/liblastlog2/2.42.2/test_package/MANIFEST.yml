# test_package/MANIFEST.yml
# Test declaration for liblastlog2 Conan L1 consumer verification.

package: liblastlog2/2.42.2
homepage: "https://github.com/util-linux/util-linux"

# Upstream suite executed in build(): the 7 C check_PROGRAMS are compiled
# -static (make test_lastlog2_*) and executed through the official
# tests/run.sh harness over the liblastlog2 component (all 7 ts scripts).
# Why not plain `make check`: that target also builds every other component's
# check_PROGRAMS, and lib/test_netlink.c does not compile against the musl/OHOS
# sysroot (linux/socket.h redefines sockaddr_storage) - unrelated to
# liblastlog2. The harness component filter is the upstream TESTS_COMPONENTS
# mechanism (tests/run.sh usage: "[options] [<component> ...]"). Three OHOS
# invocation adaptations, tests unchanged: the harness is invoked through bash
# (tests/run.sh shebangs /bin/bash, absent on OHOS); patch 0003 makes the
# run.sh driver interpret the scripts through bash instead of exec'ing their
# #!/bin/bash shebang; and a build-local PATH shim resolves `xargs` to the
# busybox applet because the toybox xargs first on PATH lacks the -I option
# used by the run.sh driver.
upstream_check_command: "make check (upstream full target, blocked on OHOS by unrelated lib/test_netlink.c)"
upstream_test_in_build: true
upstream_test_command: "make test_lastlog2_dlopen test_lastlog2_pam_lastlog2_output test_lastlog2_remove_entry test_lastlog2_rename_user test_lastlog2_write_read_user test_lastlog2_y2038_ll2_read_all test_lastlog2_y2038_sqlite3_time && bash tests/run.sh --srcdir=<src> --builddir=<build> --nonroot --show-diff --parallel liblastlog2 (PATH shim: xargs -> busybox)"

# The 7 C tests and all 7 ts scripts are in scope. Other util-linux components
# are not built (--disable-all-programs --enable-liblastlog2), so their harness
# entries are simply not discovered when filtering on the liblastlog2 component.
upstream_tests:
  - name: test_lastlog2_dlopen (tests/ts/liblastlog2/dlopen)
    source: liblastlog2/src/tests/tst_dlopen.c
  - name: test_lastlog2_pam_lastlog2_output (tests/ts/liblastlog2/pam_lastlog2_output)
    source: liblastlog2/src/tests/tst_pam_lastlog2_output.c
  - name: test_lastlog2_remove_entry (tests/ts/liblastlog2/remove_entry)
    source: liblastlog2/src/tests/tst_remove_entry.c
  - name: test_lastlog2_rename_user (tests/ts/liblastlog2/rename_user)
    source: liblastlog2/src/tests/tst_rename_user.c
  - name: test_lastlog2_write_read_user (tests/ts/liblastlog2/write_read_user)
    source: liblastlog2/src/tests/tst_write_read_user.c
  - name: test_lastlog2_y2038_ll2_read_all (tests/ts/liblastlog2/y2038_ll2_read_all)
    source: liblastlog2/src/tests/tst_y2038_ll2_read_all.c
  - name: test_lastlog2_y2038_sqlite3_time (tests/ts/liblastlog2/sqlite3_time)
    source: liblastlog2/src/tests/tst_y2038_sqlite3_time.c

upstream_test_case_count: 7

test_package_tests:
  - file: test.c
    count: 1
    description: "Consumer API test: write/read/rename/remove lifecycle via ll2_* API against a SQLite lastlog2 database"
    command: "./test_lastlog2_consumer"

test_case_count: 1
assertion_count: 10
