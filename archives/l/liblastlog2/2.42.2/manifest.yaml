version: "2.42.2"
status: built
build_date: "2026-09-14"
conan_ref: "liblastlog2/2.42.2"

source:
  url: "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
  sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-all-programs"
    - "--enable-liblastlog2"
    - "--disable-pam-lastlog2"
    - "--enable-shared"
    - "--enable-static"
    - "--without-systemd"
    - "--without-selinux"
    - "--without-audit"
    - "--disable-bash-completion"
    - "--disable-nls"
    - "--disable-plymouth-support"
    - "--without-cap-ng"
    - "--without-utempter"
    - "--disable-makeinstall-chown"
    - "--disable-makeinstall-setuid"
  dependencies:
    - sqlite3/3.49.1
  cc: clang

patches_applied:
  - "0001-config-guess-ohos-detection.patch"
  - "0002-liblastlog2-guard-lastlog-header-for-musl.patch"
  - "0003-tests-runsh-exec-ts-scripts-with-bash.patch"

knowledge_gained:
  - "--disable-all-programs also disables liblastlog2 itself (UL_DEFAULT_ENABLE); explicit --enable-liblastlog2 required."
  - "PKG_CHECK_MODULES([SQLITE3],[sqlite3]) honours SQLITE3_CFLAGS/SQLITE3_LIBS env overrides, avoiding the need for a system sqlite3.pc."
  - "<lastlog.h> is glibc-only; guard with !__GLIBC__ (never __OHOS__) and provide layout-compatible struct lastlog."
  - "tests/run.sh shebangs /bin/bash which is absent on OHOS and its driver needs xargs -I (toybox lacks it); run via bash with a build-local xargs->busybox PATH shim and the upstream component filter (run.sh ... liblastlog2)."
  - "Full `make check` is not viable on OHOS: it builds every component's check_PROGRAMS and lib/test_netlink.c fails on musl (linux/socket.h redefines sockaddr_storage)."
