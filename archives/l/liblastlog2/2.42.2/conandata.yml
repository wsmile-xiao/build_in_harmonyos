sources:
  "2.42.2":
    url: "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.2.tar.xz"
    sha256: "03a05d3adf9602ef128f2da05b84b3205ce60c351e5737c0370f74000679ce8a"
patches:
  - patch_file: "patches/0001-config-guess-ohos-detection.patch"
    patch_description: "Add HarmonyOS detection to config.guess for OHOS cross-compilation"
    patch_type: "portability"
  - patch_file: "patches/0002-liblastlog2-guard-lastlog-header-for-musl.patch"
    patch_description: "Provide a glibc-compatible struct lastlog definition when <lastlog.h> is unavailable (musl/OHOS); only ll2_import_lastlog() consumes legacy lastlog records"
    patch_type: "portability"
  - patch_file: "patches/0003-tests-runsh-exec-ts-scripts-with-bash.patch"
    patch_description: "tests/run.sh driver: interpret the test scripts through bash instead of exec'ing their #!/bin/bash shebang, which does not exist on OHOS"
    patch_type: "portability"
