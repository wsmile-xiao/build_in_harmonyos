# 版本级 manifest —— libodfgen 0.1.8
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.8"
software: libodfgen

status: built
build_date: "2026-09-14"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/libwpd/libodfgen/libodfgen-0.1.8/libodfgen-0.1.8.tar.xz"
  sha256: "55200027fd46623b9bdddd38d275e7452d1b0ff8aeddcad6f9ae6dc25f610625"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-gnu（本 dist 的 config.sub 是 2014-12-03 版，aarch64 与 musl 都认）"
    - "--prefix=/；--enable-static --disable-shared（R26）；--disable-dependency-tracking"
    - "--enable-test：打开 COMPILE_TEST 以构建 test/ 的 11 个生成器测试程序"
    - "--without-docs（文档需 doxygen，不属交付物）"
    - "REVENGE_* / REVENGE_STREAM_* / XML_* 三组 PKG_CHECK_MODULES 变量显式导出（设备无 pkg-config；注意前缀是 XML_* 而非 LIBXML_*）"
    - "librevenge 三个库经「只放 .a 的干净 -L 目录」引用；libxml2/zlib 不产 .la，直接用各自包目录"
    - "构建期 LD_LIBRARY_PATH 注入依赖的 lib 目录（运行上游测试程序需要共享的 libxml2）"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash；umask 077→022 改写；辅助脚本 chmod +x（E490）；TMPDIR 指向构建目录内 .tmp；CC/CXX 从 profile conf 显式导出"
  dependencies:
    - librevenge/0.0.5
    - libxml2/2.15.3.1
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "构建期要**运行**自己刚编出来的程序时，必须把依赖的共享库目录注入 LD_LIBRARY_PATH：libxml2 在制品仓里是带版本号的共享库，加载器无法自己找到 conan 包目录，上游 make launch_all 因此报 'Error loading shared library libxml2.so.16: (needed by ./testGraphic1)' + 'Error relocating ...: xmlReadDoc: symbol not found'。同一原因也让消费者测试不能用 ctest 作判据（ctest 不继承 conanrun 环境）"
  - "libodfgen 的头文件**不声明命名空间**：OdtGenerator/OdsGenerator/OdfDocumentHandler/ODF_FLAT_XML 全在全局命名空间（grep inc/libodfgen/*.hxx 无 namespace），消费者代码加 libodfgen:: 限定会报 'use of undeclared identifier libodfgen'"
  - "上游测试套件不一定挂在 make check 上：libodfgen 用 --enable-test 打开 COMPILE_TEST 构建 test/（11 个程序），由自定义目标 make launch_all 以 && 链执行其中 10 个（testChart1 未纳入上游自己的链，按上游口径不额外运行），且无 TESTS 变量——只跑 make check 会一条测试都不跑"
  - "对上游未规定的调用序列不要写死断言：ODS 后端的单元格文本需要特定的开启顺序（页面跨度等），我手写的序列拿不到输出。此时正确做法是把该后端的覆盖明确归给上游套件（本配方已把 launch_all 作为硬门禁），消费者测试只断言自己能确认的路径，并在 MANIFEST 里写明边界——而不是为了变绿去弱化断言"
