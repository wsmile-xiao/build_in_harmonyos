# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libodfgen/0.1.8
homepage: "https://wiki.documentfoundation.org/Development/libodfgen"

# 上游**自带**测试套件：test/ 目录下有 11 个生成器测试程序
# （testChart1/testGraphic1/testLayer1/testLink1/testList1/testMasterPage1/
#  testPageSpan1/testPara1/testSpan1/testTable1/testTextbox1），
# 由 --enable-test 打开 COMPILE_TEST 条件后构建，并用 make 的 launch_all 目标
# 串行执行其中 10 个（&& 链）。上游没有 TESTS 变量，故 `make check` 不会跑它们。
upstream_check_command: "make launch_all"
upstream_test_in_build: true
upstream_test_command: "make -j1 launch_all（在 test/ 目录，配方 build() 内执行）"

upstream_tests:
  - file: test/testGraphic1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "图形（odg）生成"
    command: "./testGraphic1"
  - file: test/testLayer1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "图层生成"
    command: "./testLayer1"
  - file: test/testLink1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "超链接生成"
    command: "./testLink1"
  - file: test/testList1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "列表生成"
    command: "./testList1"
  - file: test/testMasterPage1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "主页面生成"
    command: "./testMasterPage1"
  - file: test/testPageSpan1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "页面跨度生成"
    command: "./testPageSpan1"
  - file: test/testParagraph1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "段落生成（程序名 testPara1）"
    command: "./testPara1"
  - file: test/testSpan1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "文本跨度生成"
    command: "./testSpan1"
  - file: test/testTable1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "表格生成"
    command: "./testTable1"
  - file: test/testTextbox1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: "文本框生成（同时覆盖 odg/odp/ods/odt 四种后端）"
    command: "./testTextbox1"
  - file: test/testChart1.cxx
    source: libodfgen-0.1.8.tar.xz
    description: >-
      图表生成。**已构建但上游 launch_all 未纳入其 && 链**（上游自己的目标只串了
      10 个，见 test/Makefile.am），故本配方按上游口径执行，未额外运行它。
    command: "（上游 launch_all 未调用）"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libodfgen.cpp
    description: >-
      消费者功能测试：自实现公开的 OdfDocumentHandler 接口并捕获生成器实际产出的
      XML，对 **ODT（文字）后端**做端到端断言——文档根元素 office:document 与
      闭合标签、段落 text:p 结构、insertText 写入的文本、span 字体样式（Courier）
      已进入输出、有序列表结构与列表项文本。共 8 项断言，失败即非零退出。
      **ODS/ODG/ODP 后端不在此重复**：上游 testTextbox1.cxx 已驱动全部四种生成器，
      而本配方在 build() 中以硬门禁执行上游 launch_all 套件（含该程序），
      此处再手写 ODS 调用序列只会断言我对调用顺序的猜测而非库的行为。
    command: "./test_libodfgen"

# 测试断言总数（近似值，用于质量评估）：上游 launch_all 10 个程序组成的套件
# （每个程序内部各有多条断言）+ test_package 8 项断言
assertion_count: 18
