software: libutempter
display: "libutempter"
description: "终端多路复用器的utempter辅助库，用于更新utmp记录"
category: system
homepage: "https://github.com/altlinux/libutempter"
license: LGPL-2.1-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "OHOS使用musl libc，缺少updwtmp函数，需添加stub实现"
    - "HMDFS不支持ln -sf覆盖，需先rm -f再ln -s"
  common_dependencies: []

versions:
  "1.2.3":
    status: built
    build_date: "2026-06-05"