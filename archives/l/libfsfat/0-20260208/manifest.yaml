path_b:
  status: requested
  type: reusable_knowledge
  candidate: "knowledge/drafts/DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api"
  evidence: "notes.md § 平台适配与 § 上游测试；lang-preflight 原始输出与复核记录见 reports/lang-preflight-review.md"
  novelty: "把「libyal 纯 C 库 + 根目录绑定模块 manifest 触发 lang_detect 假阳性」、「OHOS file 输出导致 test_runner.sh 的 libtool 包装脚本判定失效但 make check 仍全绿」、「公开 API 的三处反直觉返回值约定」合成一条可复现判据，并给出设备可直接执行的复核命令。"
  differs_from:
    - "E007 只讲 config.guess/config.sub 的三元组适配；本条说明 2026 版 config.sub 已原生接受 linux-ohos，只需显式传三元组、无需改这两个文件（并发现在 OHOS 上还能直接建共享库）。"
    - "E011 只讲 umask 077→022；本条补充「configure 树内 2 处、config.status 无需二次替换」的实测边界。"
    - "overlay lang_detect 的缺陷 C 只覆盖绑定目录内的 manifest；本条给出根目录 manifest 与 binding_override 仅认 cpp 主体的缺口与修法。"
