build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--disable-python"
    - "--with-libfuse=no"
    - "--enable-static-executables=no"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfdatetime
    - libfguid
    - libhmac
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 平台适配全部内联在 conanfile.py build()，不新增 patches/ 文件，也不改上游任何 C/H 源文件
# 与测试脚本；唯一例外是 OHOS 构建期（在 Conan 缓存副本上）把随包 configure 内 2 处
# `umask 077` 改为 `022`（HMDFS 必需，E011）——详见 notes.md「R6 声明」。
patches_applied: []

knowledge_gained:
  - "HMDFS 上 autotools configure 的 umask 077 会生成连创建者都无法写入的 0700 临时目录；OHOS 构建期把源码树 configure 内 2 处 umask 077 改为 022 并全程 umask 022 即通过（树内 configure 与 config.status 无需二次替换）"  # knowledge_ref: E011
  - "libyal 发布包自带的 config.guess（2024-07-27）不识别 HarmonyOS，而 config.sub 已原生接受 linux-ohos；OHOS 下显式传 --build/--host=aarch64-unknown-linux-ohos（用 update_configure_args 覆盖而非追加）即可，无需改 config.guess/config.sub，libtool 正常走共享库 PIC 分支"  # knowledge_ref: E007
  - "libyal 的 tests/test_runner.sh 用 `file -b` 输出里是否含字面量 'POSIX shell script' 判断 libtool 包装脚本；OHOS 的 file 输出形如 '/bin/sh script'，因此判定失败、测试直接执行 libtool 包装脚本 —— 设备实测 make check 仍全绿，无需像同族先例那样在 build() 内改写 test_runner.sh"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api
  - "libfsfat 的公开 API 有三处易错约定：libfsfat_volume_get_file_system_format() 写回的是单字节枚举 LIBFSFAT_FILE_SYSTEM_FORMAT_*（不是字符串）、libfsfat_volume_close() 成功返回 0（不是 1）、libfsfat_get_version() 返回上游版本串 20260208（不是本包 Conan 版本 0-20260208）；消费者测试按这三条断言"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api
  - "lang-preflight 对「纯 C 库 + 绑定模块打包元数据在源码根」的 libyal 形态判 mixed→env_unsupported 属假阳性：manifest 优先级把根目录 pyproject.toml/setup.cfg（内容只是 setuptools 后端与 'Python bindings module for libfsfat' 自述）排在 configure.ac/Makefile.am 之前，且 binding_override 只在 dominant==cpp 时触发，纯 C 主体拿不到覆盖"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api
  - "libyal 上游 N 必须按 automake 两个注册面分别清点并披露：tests/Makefile.am 的 TESTS（3 个 shell 入口）+ check_PROGRAMS（19 个 C 测试程序）= 22；发布用 orig tarball 不含 tests/input/ 夹具时 test_fsfatinfo.sh 按上游规则 SKIP（TOTAL 3 / PASS 2 / SKIP 1 / FAIL 0），而 test_library.sh 的 LIBRARY_TESTS_WITH_INPUT 在 input/ 缺失时会退化为无输入运行（support、volume 仍真实执行），两者不可混为一谈"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api

tests:
  upstream:
    command: "make check"
    registration: "tests/Makefile.am: TESTS + check_PROGRAMS"
    cases: 22
    passed: 21
    skipped: 1
    failed: 0
    note: "TESTS 3 个入口：PASS 2（test_library.sh、test_tools.sh）+ SKIP 1（test_fsfatinfo.sh 需要 tests/input/ 夹具，发布包不含）；check_PROGRAMS 19 个 C 测试程序全部真实执行且 PASS"
  adapted:
    command: "conan create（W3）内 test_package"
    cases: 2
    passed: 2
    pass_rate: "2/2 (100%)"
    assertions: 31
    breakdown:
      generic_consumer_assertions: 11
      harmony_specific_assertions: 20
    note: "test_libfsfat.c 11 项通用断言；test_ohos.c 20 项鸿蒙专项断言（含合成 FAT-16 镜像读回链路）；另在 test() 内以 bin/fsfatinfo -V 做安装后 CLI 加载验证"

