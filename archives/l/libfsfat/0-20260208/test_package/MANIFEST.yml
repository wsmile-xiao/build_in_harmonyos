package: libfsfat/0-20260208
homepage: https://github.com/libyal/libfsfat

# 上游测试入口（在 build() 内执行，见 conanfile.py 与 notes.md）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游注册的可执行测试单元（口径：automake 的 TESTS + check_PROGRAMS 两个注册面）
upstream_tests:
  - name: "test_library.sh"
    source: tests/test_library.sh
    description: "库测试入口：驱动 13 个无条件 C 测试程序 + 2 个 input 驱动程序（无 input/ 时按上游逻辑退化为无输入运行）"
    command: "./tests/test_library.sh"
  - name: "test_tools.sh"
    source: tests/test_tools.sh
    description: "工具函数测试入口：驱动 info_handle / mount_path_string / output / signal 4 个 C 测试程序"
    command: "./tests/test_tools.sh"
  - name: "test_fsfatinfo.sh"
    source: tests/test_fsfatinfo.sh
    description: "fsfatinfo 元数据输出测试入口：依赖 tests/input/ 夹具；发布用 orig tarball 不含该目录，按上游规则 SKIP"
    command: "./tests/test_fsfatinfo.sh"
  - name: "check_PROGRAMS (19)"
    source: tests/Makefile.am
    description: "19 个 C 测试程序（allocation_table block_descriptor block_tree block_tree_node boot_record directory directory_entry error extent file_entry io_handle name notify support volume tools_info_handle tools_mount_path_string tools_output tools_signal）"
    command: "make check"

test_package_tests:
  - file: test_libfsfat.c
    description: "通用消费者断言：版本/访问标志/codepage 正常与错误路径/check_volume_signature 错误路径/volume 生命周期（11 项断言）"
    command: "./test_libfsfat"
  - file: test_ohos.c
    description: "鸿蒙专项消费者测试：__OHOS__ 编译目标、TMPDIR 非 /tmp 且可写、合成 FAT-16 镜像读回链路（签名→打开→格式枚举→卷标→根目录→按路径取文件项→大小→内容→关闭释放）（20 项断言）"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  # 计数口径：本列表逐项给出**互不重叠**的消费者测试程序与断言数，
  # assertion_count = test_libfsfat.c 的 11 项 + test_ohos.c 的 20 项 = 31。
  - name: "ohos-consumer-tests"
    description: "test_ohos.c（鸿蒙专项消费者测试）：__OHOS__ 编译目标、TMPDIR 语义（存在/非 /tmp/可写）、在 TMPDIR 下合成合法 FAT-16 镜像并读回（签名→打开→格式枚举→卷标→根目录项数→按 UTF-8 路径取文件项→大小→内容→关闭释放→清理）"
    command: "./test_ohos"
    assertions: 20
    platform: OHOS
  - name: "generic-consumer-tests"
    description: "test_libfsfat.c（通用消费者断言）：版本串、读访问标志、codepage 正常/错误路径、check_volume_signature 错误路径、volume 生命周期（该程序在 OHOS 上同样编译运行，但断言内容不依赖平台特性）"
    command: "./test_libfsfat"
    assertions: 11
  - name: "installed-cli-load"
    description: "安装后的 bin/fsfatinfo -V 必须能加载共享库并输出版本（运行/加载验证，在 test() 内执行；是运行检查，不计断言数）"
    command: "fsfatinfo -V"
    assertions: 0
    platform: OHOS

assertion_count: 31
