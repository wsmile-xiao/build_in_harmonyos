software: libfishsound
version: "1.0.1"
status: built
build_date: "2026-09-19"
conan_ref: "libfishsound/1.0.1"

source:
  url: "https://downloads.xiph.org/releases/libfishsound/libfishsound-1.0.1.tar.gz"
  sha256: "03eb1601e2306adc88c776afdf212217c6547990d2d0f9ca544dad9a8a9dbb8f"
  tar_format: tar.gz

build_system: autotools
build:
  system: autotools
  configure_options:
    - "--disable-flac"
  dependencies:
    - "libogg/1.3.6"
    - "libvorbis/1.3.7"
    - "speex/1.2.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

knowledge_gained:
  - "configure 经 PKG_CHECK_MODULES 找 ogg/vorbis/vorbisenc/speex 时，PkgConfigDeps 生成 .pc 模块 + VirtualBuildEnv 提供 LD_LIBRARY_PATH 即可原生检测全部依赖。"
  - "旧版 config.sub（2009）的 kernel-OS 组合校验需单独补 linux-ohos*，patch-autotools-ohos.pl 对旧文件会误报 already present（E007）。"
