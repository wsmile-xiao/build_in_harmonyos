# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libfishsound/1.0.1
homepage: "https://xiph.org/fishsound/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序 (src/tests/Makefile.am: TESTS，FS_DECODE+FS_ENCODE
# 均默认开启，故 4 个测试程序全部运行)
upstream_tests:
  - file: src/tests/encdec-audio.c
    source: libfishsound-1.0.1.tar.gz/src/tests/encdec-audio.c
    description: "Vorbis/Speex 编码-解码回环矩阵（多采样率/声道/块大小/交织）"
    command: "./encdec-audio"
  - file: src/tests/encdec-comments.c
    source: libfishsound-1.0.1.tar.gz/src/tests/encdec-comments.c
    description: "编解码链路上的元数据注释保真测试"
    command: "./encdec-comments"
  - file: src/tests/comment-test.c
    source: libfishsound-1.0.1.tar.gz/src/tests/comment-test.c
    description: "Vorbis/Speex 注释头读写 API 测试"
    command: "./comment-test"
  - file: src/tests/noop.c
    source: libfishsound-1.0.1.tar.gz/src/tests/noop.c
    description: "编解码器空转（识别后立即删除句柄）冒烟测试"
    command: "./noop"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libfishsound.c
    description: "Vorbis 与 Speex 编码→识别→解码回环消费者测试（链接 conan 包）"
    command: "./test_libfishsound"

# 测试断言总数 (近似值, 用于质量评估)
# 13 个 CHECK 断言点 × 2 个编解码器回环 = 26
assertion_count: 26
