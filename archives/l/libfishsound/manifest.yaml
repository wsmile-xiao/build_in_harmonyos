software: libfishsound
display: "libfishsound"
description: "Ogg 流中 Vorbis/Speex 音频编解码的统一编程接口"
category: multimedia
homepage: "https://xiph.org/fishsound/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 项目：config.guess/config.sub 需 HarmonyOS 识别补丁（E007）"
    - "configure 经 pkg-config 检测 ogg/vorbis/vorbisenc/speex，配方用 PkgConfigDeps 提供模块"
    - "FLAC 编解码禁用（制品仓 flac 固定 libogg/1.3.5，与 libogg/1.3.6 冲突）"
  common_dependencies:
    - libogg
    - libvorbis
    - speex

versions:
  "1.0.1":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libfishsound/1.0.1"
