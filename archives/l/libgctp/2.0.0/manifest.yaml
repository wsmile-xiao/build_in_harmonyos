knowledge_gained:
  - "1998 年代 autotools 快照（GCTPC）：configure.ac 的 AC_PROG_F77 是硬性探测，无 Fortran 编译器时 configure 直接中止；库本体纯 C 时可用 autoreconf -fi 重新生成 configure 裁掉该要求（补丁只改 configure.ac/Makefile.am）"
  - "上游唯一的 Fortran 文件 spload.f 是 noinst 辅助数据转换工具，make check 的 30 个脚本用 test/proj 自带数据，裁剪不影响测试覆盖"
  - "libgctp_la_LDFLAGS = -release 2.0.0 使产物名为 gctp-2.0.0（libgctp-2.0.0.a），cpp_info.libs 需写 gctp-2.0.0 而非 gctp"

