# conandata.yml — libgctp 2.0.0
# 源码 = GitHub OkoSanto/GCTP tag v2.0.0 官方归档（USGS GCTPC C 语言地图投影库）
# 补丁策略：唯一 Fortran 文件 spload.f 是辅助数据转换工具（noinst_PROGRAMS），
#   与库本体（纯 C 的 libgctp）无关；OHOS 工具链无 Fortran 编译器，configure.ac
#   的 AC_PROG_F77 是硬性探测（缺失即中止）。补丁 0001 裁剪 spload 及其数据
#   生成规则；上游 make check 的 30 个测试脚本不依赖 spload 产物（spcs_test 用
#   test/proj 自带数据），裁剪不影响测试完整性。

sources:
  url:
    - "https://gh-proxy.com/https://github.com/OkoSanto/GCTP/archive/refs/tags/v2.0.0.tar.gz"
    - "https://github.com/OkoSanto/GCTP/archive/refs/tags/v2.0.0.tar.gz"
  sha256: "a407161a96f5e7c818f68ba7a367ec24d8b0741eaeb76259543441ebb1c52a51"

patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: "Drop the vestigial Fortran helper spload (configure AC_PROG_F77 + noinst_PROGRAMS/pkgdata rules); the library itself is pure C"
    patch_type: "portability"
  - patch_file: "patches/0002-source-Makefile.am.patch"
    patch_description: "Set automake LOG_COMPILER/TEST_LOG_COMPILER to /bin/sh (HarmonyOS has no /bin/bash for the scripts' shebangs) and mark the upstream-broken som_test (Space Oblique Mercator segfaults testproj) as XFAIL_TESTS"
    patch_type: "platform"
  - patch_file: "patches/0003-source-br_gctp.c.patch"
    patch_description: "br_gctp.c K&R definition of gctp_ leaves fn27/fn83 with implicit int while proj.h prototypes them as char[]; declare them as char * to fix clang -Wint-conversion errors"
    patch_type: "portability"
