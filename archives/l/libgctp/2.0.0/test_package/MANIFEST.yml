# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 如实声明：上游 GCTP v2.0.0 自带官方 automake 测试套件
#（source/Makefile.am 的 check_PROGRAMS=testproj + TESTS=30 个校验脚本，
#  数据全部来自源码树 test/proj/，无网络/外部依赖）。

package: libgctp/2.0.0
homepage: "https://github.com/OkoSanto/GCTP"

# 上游官方测试：automake TESTS 注册的 30 个投影校验脚本
#（每个脚本驱动 testproj 二进制对自带验证数据做正/逆投影并 diff 结果，
#  输出含 "Differences exist" 即失败）。
upstream_official_tests:
  - file: test/test_proj/testproj.c
    source: GCTP-2.0.0/test/test_proj/testproj.c
    description: "官方测试驱动程序：解析参数/数据文件，调用 libgctp 各投影正逆变换并输出对比"
    command: "./testproj"
  - {file: "test/test_proj/albers_test",  description: "Albers 等积圆锥投影校验"}
  - {file: "test/test_proj/alaska_test",  description: "Alaska (modified stereographic) 投影校验"}
  - {file: "test/test_proj/azmeqd_test",  description: "方位等距投影校验"}
  - {file: "test/test_proj/equidc_test",  description: "等距圆锥投影校验"}
  - {file: "test/test_proj/eqrect_test",  description: "等距圆柱投影校验"}
  - {file: "test/test_proj/gnomon_test",  description: "心射投影校验"}
  - {file: "test/test_proj/good_test",    description: "Goode 同调投影校验"}
  - {file: "test/test_proj/gvnsp_test",   description: "General Vertical Near-side Perspective 投影校验"}
  - {file: "test/test_proj/hammer_test",  description: "Hammer (Aitoff) 投影校验"}
  - {file: "test/test_proj/hom_test",     description: "Hotine Oblique Mercator 投影校验"}
  - {file: "test/test_proj/imoll_test",   description: "Interrupted Mollweide 投影校验"}
  - {file: "test/test_proj/lamcc_test",   description: "Lambert 共形圆锥投影校验"}
  - {file: "test/test_proj/lamaz_test",   description: "Lambert 方位等积投影校验"}
  - {file: "test/test_proj/mercat_test",  description: "Mercator 投影校验"}
  - {file: "test/test_proj/miller_test",  description: "Miller 圆柱投影校验"}
  - {file: "test/test_proj/moll_test",    description: "Mollweide 投影校验"}
  - {file: "test/test_proj/obleqa_test",  description: "Oblique Equal-Area 投影校验"}
  - {file: "test/test_proj/ortho_test",   description: "正射投影校验"}
  - {file: "test/test_proj/polyc_test",   description: "Polyconic 投影校验"}
  - {file: "test/test_proj/ps_test",      description: "极射赤面投影校验"}
  - {file: "test/test_proj/robin_test",   description: "Robinson 投影校验"}
  - {file: "test/test_proj/snsoid_test",  description: "Sinusoidal 投影校验"}
  - {file: "test/test_proj/spcs_test",    description: "State Plane 坐标系校验（用 test/proj/spcs 自带数据，不依赖 spload 产物）"}
  - {file: "test/test_proj/stereo_test",  description: "双极立体投影校验"}
  - {file: "test/test_proj/som_test",     description: "Space Oblique Mercator 投影校验"}
  - {file: "test/test_proj/tm_test",      description: "Transverse Mercator 投影校验"}
  - {file: "test/test_proj/utm_test",     description: "UTM 投影校验"}
  - {file: "test/test_proj/vgrint_test",  description: "Van der Grinten 投影校验"}
  - {file: "test/test_proj/wagiv_test",   description: "Wagner IV 投影校验"}
  - {file: "test/test_proj/wagvii_test",  description: "Wagner VII 投影校验"}

# 构建阶段执行的测试命令（make check，见 conanfile.py build()）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    origin: ohos-adaptation (self-authored consumer test, public API from proj.h)
    description: "消费者测试：以库使用者身份调用 utmforint/utmfor 正变换 + utminvint/utminv 逆变换，断言中央经线 x=500000m 假东偏移、北坐标物理合理区间、逆变换往返恢复输入坐标（<1e-6 rad）"
    command: "./test_libgctp (经 ctest 驱动)"

# 测试断言总数 (test.c 中 check() 调用数)
assertion_count: 7
