# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: litecoin/0.21.4
homepage: "https://litecoin.org/"

# 上游测试命令
# 上游 test_litecoin 单元测试二进制（--disable-tests 下不构建——环境限制豁免，见下方说明）
# 上游 functional 测试（test/functional/*.py）依赖真实网络 + Python bitcoind test framework，
# OHOS CI 环境无网络隔离，全部不可执行（环境限制豁免）
upstream_check_command: "test/test_litecoin"
upstream_test_in_build: false
upstream_test_command: "test/test_litecoin (not built: --disable-tests; functional tests need live network)"

upstream_tests:
  - file: src/test/*.cpp
    source: litecoin-0.21.4/src/test/ (81 test files, boost unit-test framework)
    description: "上游 unit 测试集（--disable-tests 豁免：见 PR 正文环境限制说明）"
    command: "./test_litecoin"
  - file: test/functional/*.py
    source: litecoin-0.21.4/test/functional/ (~370 functional tests)
    description: "上游 functional 测试（依赖真实网络/端口隔离环境，OHOS 不可执行——环境限制豁免）"
    command: "test/functional/test_runner.py"

# test_package 自带测试（消费者视角）
test_package_tests:
  - file: test.cpp
    description: "链接 libbitcoinconsensus 并调用 bitcoinconsensus_verify_script/verify_script_amount 真实 API + litecoind --version 二进制冒烟"
    command: "./test_litecoin && litecoind --version"

assertion_count: 3
