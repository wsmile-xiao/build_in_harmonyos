      patch_type: "bugfix"
    - patch_file: "patches/0004-bdb-stub-include.patch"
      patch_type: "portability"
      patch_description: "--disable-wallet 下 MWEB 编译单元仍传递包含 bdb.h：db_cxx.h 换最小桩头（db_cxx_stub.h 随配方导出），wallet 未链接无符号需求"
