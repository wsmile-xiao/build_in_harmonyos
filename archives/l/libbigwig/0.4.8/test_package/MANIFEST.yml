# test_package/MANIFEST.yml — libbigwig/0.4.8
# 上游官方测试声明文件 (docs/TEST_QUALITY_SPEC.md, CI L0e 检查存在性)
#
# 上游无 CTest/注册式测试: test/CMakeLists.txt 只用 add_executable 生成测试
# 程序,由 Makefile `make test` 构建后调用 test/test.py 断言输出与产物 md5。

package: libbigwig/0.4.8
homepage: "https://github.com/dpryan79/libBigWig"

# 上游测试命令 (上游 Makefile: 先编译测试程序,再运行 test/test.py)
upstream_check_command: "make test"

# conanfile.py build() 中未集成上游测试 (包内 ENABLE_TESTING=OFF);
# 上游本地测试在 OHOS 设备上独立实跑,证据见 notes.md 与 reports/upstream-tests.md
upstream_test_in_build: false
upstream_test_command: "make test (独立实跑,非包构建内)"

# 上游实际运行的测试程序 (单元=本地数据,集成=需网络远端资源)
upstream_tests:
  - file: test/testLocal.c
    source: upstream test/testLocal.c
    description: "读取本地 test/test.bw 并断言头/染色体/区间数据 (14 处 assert; test.py 校验输出 md5)"
    command: "./testLocal test/test.bw"
  - file: test/exampleWrite.c
    source: upstream test/exampleWrite.c
    description: "从零创建 bigWig 文件 (test.py 校验产物 md5)"
    command: "./exampleWrite"
  - file: test/testWrite.c
    source: upstream test/testWrite.c
    description: "读取 test/test.bw 重写为新文件 (test.py 校验产物 md5)"
    command: "./testWrite test/test.bw out.bw"
  - file: test/testIterator.c
    source: upstream test/testIterator.c
    description: "用 bwOverlapIterator 遍历 bigWig/bigBed 数据块并打印 (人工核对退出码与输出)"
    command: "./testIterator test/test.bw 1 100"
  - file: test/testBigBed.c
    source: upstream test/testBigBed.c
    description: "打开 bigBed 远端 URL 并断言输出 md5 (需 libcurl 与外网; test.py 调用)"
    command: "./testBigBed https://www.encodeproject.org/files/ENCFF001JBR/@@download/ENCFF001JBR.bigBed"
  - file: test/testRemote.c
    source: upstream test/testRemote.c
    description: "读取 UCSC 远端 bigWig URL 并断言输出 md5 (需 libcurl 与外网; test.py 调用)"
    command: "./testRemote http://hgdownload.cse.ucsc.edu/goldenPath/hg19/encodeDCC/wgEncodeMapability/wgEncodeCrgMapabilityAlign50mer.bigWig"
  - file: test/testRemoteManyContigs.c
    source: upstream test/testRemoteManyContigs.c
    description: "解析含非叶节点染色体树的远端 bigWig 并断言输出 md5 (需 libcurl 与外网; test.py 调用)"
    command: "./testRemoteManyContigs http://hgdownload.cse.ucsc.edu/gbdb/dm6/bbi/gc5BaseBw/gc5Base.bw"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_roundtrip.c
    description: "消费者回环:写入区间块与 span 块,重开文件并逐条核对染色体表/条目数/坐标/值"
    command: "./test_libbigwig"

# 测试断言总数 (近似值): 上游 test.py 8 处 assert(6 个测试函数)
# + testLocal.c 14 处 assert + test_package 消费者 13 处检查点
assertion_count: 35
