# test_package/MANIFEST.yml
# 上游官方测试声明文件
# libbigwig 0.4.9 上游测试见 test/CMakeLists.txt:
#   本地测试: exampleWrite testBigBed testIterator testLocal testWrite
#   远端测试(需 curl): testRemote testRemoteManyContigs
# 本配方 WITH_CURL=OFF (curl 未发布且上游可选, NOCURL 守卫), 因此远端测试不适用。
# 实测: exampleWrite/testIterator/testLocal/testWrite 以源码包 test/test.bw 输入运行通过;
#       testBigBed 需要上游未附带的 .bb 输入文件, 无法以现有数据运行 (见 notes.md)。

package: libbigwig/0.4.9
homepage: "https://github.com/dpryan79/libBigWig"

# 上游测试命令 (cmake -DENABLE_TESTING=ON 构建出的测试二进制)
upstream_check_command: "cmake -S . -B build -DENABLE_TESTING=ON && cmake --build build --target testLocal testIterator testWrite exampleWrite"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/testLocal.c
    source: libBigWig-0.4.9/test/testLocal.c
    description: "本地 bigWig 读取测试 (以 test/test.bw 输入)"
    command: "./testLocal test/test.bw"
  - file: test/testIterator.c
    source: libBigWig-0.4.9/test/testIterator.c
    description: "迭代器遍历测试 (以 test/test.bw 输入)"
    command: "./testIterator test/test.bw 1 1000"
  - file: test/testWrite.c
    source: libBigWig-0.4.9/test/testWrite.c
    description: "bigWig 写入测试"
    command: "./testWrite test/test.bw test/out.bw"
  - file: test/exampleWrite.c
    source: libBigWig-0.4.9/test/exampleWrite.c
    description: "写入示例 (bwCreateHdr/bwAddIntervals/bwAppendIntervals)"
    command: "./exampleWrite"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者冒烟测试: 写 bigWig 文件并读回校验 3 个区间值"
    command: "./test_libbigwig"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
