# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.4.9"

# 软件名
software: libbigwig

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag tarball）
  url: "https://github.com/dpryan79/libBigWig/archive/refs/tags/0.4.9.tar.gz"

  # 源码校验和（官方 tarball sha256，实测）
  sha256: "c9d685d22030a610288e6154a8f25eb714269934da12096cdace63a3946d1f22"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DWITH_CURL=OFF"
    - "-DWITH_ZLIBNG=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
