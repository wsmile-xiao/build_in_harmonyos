software: lapackpp
display: "LAPACK++"
description: "LAPACK++ - a C++ API for LAPACK (UTK ICL SLATE foundation layer)"
category: foundation
homepage: "https://github.com/icl-utk-edu/lapackpp"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 C++（C++17）CMake 构建，设备原生编译；LAPACK 后端经上游 LAPACKFinder/LAPACKConfig 的显式库清单直通（LAPACK_LIBRARIES/BLAS_LIBRARIES，含 flang Fortran 运行时），不做 -llapack 名称探测"
    - "GPU 后端（cuda/hip/sycl）gpu_backend=none 显式禁用；本包 Fortran 编译为零，Fortran 运行时只在链接期由 lapack 包提供"
    - "零补丁：上游 CMakeLists/源码零改动，BLAS++ 的桥接全部在配方侧（tc.variables + CMAKE_PROJECT_lapackpp_INCLUDE 注入片段）完成"
    - "find_package(lapackpp) / lapackpp::lapackpp 命名与上游一致；前置硬依赖 blaspp/2024.10.26（上游 find_package(blaspp) 缺失即 FATAL_ERROR，公开头直接 #include \"blas.hh\"）"
    - "上游 tester 依赖 LAPACKE（C API），提供方 lapacke/3.12.1 尚未发布到 ohpcd → 本包 build_tests=OFF，只交付库；上游测试 NOT_RUN 的精确技术原因见版本级 notes.md"

versions:
  "2024.10.26":
    status: built
    build_date: "2026-09-28"
    conan_ref: "lapackpp/2024.10.26"
    notes: "零补丁；上游 181 个测试计划项因 lapacke 未发布全部 NOT_RUN；test_package 消费者 18 条数值断言全通过"
