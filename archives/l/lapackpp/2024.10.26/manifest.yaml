software: lapackpp
version: "2024.10.26"
status: built
build_date: "2026-09-29"
build_system: cmake

source:
  url: "https://github.com/icl-utk-edu/lapackpp/archive/refs/tags/v2024.10.26.tar.gz"
  sha256: "4c6d164b7d91e7c824e1bf0ae0949ead255b436ec4890451e96c95a17cb75cf1"
  tar_format: tar.gz
  tag: v2024.10.26

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-Dbuild_tests=ON（构建上游 tester 并在 build() 里真实执行上游测试）"
    - "-Dgpu_backend=none（鸿蒙无 GPU 后端，上游可选依赖显式禁用）"
    - "-DBLAS_LIBRARIES=<lapack/cblas 包库清单直通，见 conanfile.generate>"
    - "-DLAPACK_LIBRARIES=<lapack 包库清单 + 末位 libopenblas.a（LAPACKE 探针/tester 用，仅测试拓扑）>"
    - "-Dblaspp_defines=<自 blaspp 包 include/blas/defines.h 反解>"
    - "-Dblaspp_libraries=<与 BLAS_LIBRARIES 同源的库清单>"
    - "-DFETCHCONTENT_SOURCE_DIR_TESTSWEEPER=<vendor/testsweeper-2024.05.31（同 tag 本地源码，免构建期 git clone）>"
    - "-DCMAKE_PROJECT_lapackpp_INCLUDE=<conan/bridge_blaspp.cmake 注入片段（blaspp include + tester 门禁变量 + link_directories）>"
  dependencies:
    - blaspp/2024.10.26
    - lapack/3.12.1
    - cblas/3.12.1
  cc: ohos aarch64 clang 15（C++17，profile tools.build:compiler_executables）

package:
  package_type: library
  libraries:
    - lib/liblapackpp.a
  headers:
    - include/lapack.hh
    - include/lapack/*.hh
    - include/lapack/defines.h（构建树生成，含 LAPACK_HAVE_LAPACK / LAPACK_VERSION=31200 / LAPACK_HAVE_LAPACKE〔上游源码零引用，惰性宏〕）
  cmake_config: lib/cmake/lapackpp/lapackppConfig.cmake

tests:
  upstream_lapackpp_run_tests: "TOTAL=181: HOST 计划项 177 实跑 PASS=177 FAIL=0 SKIP=0（--quick --host 全量；辅助口径 test-case 4928/4928）；DEVICE 4 项 NOT_RUN（gpu_backend=none，无 GPU 后端）。两轮完整 conan create 结果逐项一致"
  test_package_consumer: "TOTAL=1 PASS=1 FAIL=0 SKIP=0 NOT_RUN=0"
  consumer_api_calls: 17
  consumer_assertions: 32

patches_applied: []

knowledge_gained:
  - "上游 BLAS++/LAPACK++ 族 find_package(blaspp) 只取两个私有变量（blaspp_defines/blaspp_libraries，见上游 blasppConfig.cmake.in 注释 Export private variables used in LAPACK++），Conan 的 CMakeDeps 生成的 blaspp-config.cmake 不导出它们，需在配方侧用 tc.variables 补齐"  # knowledge_ref: E671
  - "上游 lapackpp 对 blaspp 只 find_package、从不把导入目标链到自身，而 lapack/util.hh 以 #include \"blas.hh\" 引用 BLAS++ 公共头；Conan 下需用 CMAKE_PROJECT_<name>_INCLUDE 在 project() 后注入 find_package+include_directories 桥接（上游零改动）"  # knowledge_ref: E673
  - "LAPACKFortran 命名修饰/能力位应从依赖包已安装的 include/blas/defines.h 反解，而非在配方里硬编码 -DBLAS_FORTRAN_ADD_：defines.h 是 BLAS++ 构建期 configure_file 的权威记录，后端变化时不会静默链错符号（config.h 的 #error 只校验“定义了一个”、不校验“定义对了”，链错要到链接期才暴露）"  # knowledge_ref: E671
  - "LAPACK 例程只写 uplo 指定的三角形（potrf/trtri 的另一半保留原值），消费者/测试做 L·Lᵀ、U·U⁻¹ 回乘前必须清零严格上三角，否则数值断言假失败"  # knowledge_ref: E674
  - "LAPACK dsyev/dsyevd 的特征值按【升序】返回（不是常被误记的降序）；写 syev 数值断言须按升序取 W[0]≤W[1]"  # knowledge_ref: E674
  - "lapacke 配方未发布制品仓时，上游 lapackpp tester 的 LAPACKE 硬依赖可由 openblas/0.3.34 传递提供（lapacke.h 等 4 头 + libopenblas.a 内嵌 LAPACKE_* 符号，nm 实核）：libopenblas.a 追加到 LAPACK_LIBRARIES 末位，上游 LAPACKConfig 的 try_run 探针即走 'Found LAPACKE library in BLAS library' 路径真实通过；tester 拓扑 = 参考 LAPACK 先扫描 + openblas 单一提供 BLAS/CBLAS/LAPACKE（无符号重复）；交付面不变——openblas 经 cblas 传递访问而不直连 require（conan 2 的 direct requires 必须进 cpp_info.requires，visible=False 也绕不过校验）"  # knowledge_ref: E677
  - "本 OHOS 工具链 clang-15 不把 LIBRARY_PATH 环境变量翻译成 -L（实测设与不设同样报 unable to find library），裸 -l 名称必须用 CMake link_directories 显式给 -L；CPATH（头查找）则正常生效"  # knowledge_ref: E678
  - "dpocon 的 A 入参必须是 Cholesky 因子（dpotrf/dposv 输出）而 anorm 是原阵范数（lansy 算原阵）——两入参来自不同矩阵，传错得伪 rcond；另 dgesvd 奇异值降序 vs dsyev 特征值升序，SPD 交叉验证须反序对齐 σᵢ↔λ_{n-1-i}"  # knowledge_ref: E674
