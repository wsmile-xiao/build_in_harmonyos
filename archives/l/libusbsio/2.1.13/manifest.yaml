# 版本级 manifest — libusbsio 2.1.13
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1.13"
software: libusbsio

# published | built | failed | archived
status: built

build_date: "2026-09-16"
build_system: makefile (direct compile in recipe — 2 translation units)

source:
  url: "https://github.com/monwarez/libusbsio/archive/8577280966ee91cab606df5b0c64889be71ce7b9.tar.gz"
  upstream_url: "https://github.com/Intronics/libusbsio"
  upstream_status: "deleted (404) — see notes.md equivalence evidence"
  sha256: "0c1ea11ccde44595edc3d19928edcf31bd715cffc4de149be3e45c182ca450f3"
  tar_format: tar.gz

build:
  system: makefile-equivalent (recipe compiles src/lpcusbsio.c + src/hid_api/linux/hid.c directly)
  configure_options:
    - "upstream makefile Linux target reproduced (CC/-I/-fPIC/-shared); pkg-config libudev replaced by libudev-zero/1.0.4 conan dep"
  dependencies:
    - libudev-zero/1.0.4
  cc: clang (from profile conf tools.build:compiler_executables)

patches_applied: []

knowledge_gained:
  - "libusbsio 上游 GitHub Intronics/libusbsio 已删除（404）；NXP 官网仅提供 2.2.1 且需登录。2.1.13 的 Linux C 库与 2.1.10-2.1.11 逐字节相同（PyPI whl 内嵌 so MD5 对照），等价源走 monwarez/libusbsio@8577280 公开快照"
  - "libusbsio Linux 后端 = 内嵌 hidapi 0.11.2 (hidraw)：open/read/write 是纯 ioctl 路径（无 udev），仅设备枚举走 libudev——OHOS 无 systemd libudev，用制品仓 libudev-zero/1.0.4 静态链入即可全量构建，无需补丁"
  - "OHOS sysroot 自带 linux/hidraw.h（bionic kernel header），hidraw ioctl 常量可用；交叉编译零补丁零警告"
