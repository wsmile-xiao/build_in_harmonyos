software: libjcat
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.2.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2.6"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/hughsie/libjcat/releases/download/0.2.6/libjcat-0.2.6.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson
  build_system: meson

  # 配置选项列表
  configure_options:
    - "-Dgpg=false"
    - "-Dgnutls_pkcs7=false"
    - "-Dgnutls_ed25519=false"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Dtests=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0
    - json-glib/1.5.1 (subproject fallback)

  # 编译器
  cc: clang 15.0.4
  cxx: clang++ 15.0.4

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
�用系统 libuv"
