software: leptonica
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.87.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.87.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/DanBloomberg/leptonica/archive/refs/tags/1.87.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - libpng/1.6.39
    - libjpeg/62
    - libtiff/4.7.1
    - openjpeg/2.5.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 本次编译无补丁，使用cmake替代autotools构建

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autogen.sh 失败：libtoolize 脚本 shebang 路径错误（期望 /storage/Users/currentUser/usr/local/bin/bash，实际在 /data/service/hnp/bin/bash）"
  - "解决方案：使用 cmake 构建系统替代 autotools（源码包含 CMakeLists.txt）"
  - "cmake 警告 'System is unknown' 可忽略（鸿蒙不在 cmake 已知平台列表中）"
  - "纯库软件，无可执行二进制文件，仅需 pkg-config 验证"
