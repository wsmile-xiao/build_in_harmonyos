# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: leptonica/1.85.0
homepage: "https://github.com/DanBloomberg/leptonica"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# leptonica cmake 构建无 check target；上游 reg 测试在 prog/ 目录
# （BUILD_PROG=OFF，需要测试图像 + display 环境，见 1.87.0 同口径处理）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test_package/test.c
    source: leptonica-1.85.0/test_package/test.c
    description: "Consumer functional test: PIX ops + PNG/JPEG/TIFF/GIF/JP2K roundtrip"
    command: "./test_leptonica"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 版本 API + pixCreate/Destroy + 五种格式内存读写回环"
    command: "./test_leptonica"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
