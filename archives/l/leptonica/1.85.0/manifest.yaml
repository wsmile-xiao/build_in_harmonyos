# manifest.yaml — leptonica 1.85.0 (version-level)
software: leptonica
version: "1.85.0"
display: "Leptonica 1.85.0"
description: "Open source library for image processing and image analysis (OCR chain)"
homepage: "https://github.com/DanBloomberg/leptonica"
license: BSD-2-Clause
build_system: cmake
status: built

# 编译元数据
build:
  date: "2026-09-07"
  compiler: clang 15.0.4
  conan_version: 2.29.1
  profile: ci/conan/profiles/ohos-aarch64
  build_type: Release
  shared: true
  note: "2026-09-07 dependency lock switched libtiff 4.7.0 -> 4.7.2 and fully re-verified"

# 依赖（全部来自 ohpcd 制品仓）
dependencies:
  - name: zlib
    version: 1.3.1.1
    required: true
  - name: libpng
    version: 1.6.58
    required: true
  - name: libjpeg-turbo
    version: 3.2.0
    required: true
  - name: giflib
    version: 5.2.2
    required: true
    note: "5.x series: upstream find_package(GIF 5) requires major 5"
  - name: libtiff
    version: 4.7.2
    required: true
    note: "published registry version (4.7.0 still pending review in #8326)"
  - name: openjpeg
    version: 2.5.4
    required: true

# 禁用的可选依赖
disabled_dependencies:
  - name: libwebp
    reason: "upstream find_package(WebP 0.5.0 CONFIG): major-version mismatch with libwebp/1.6.0 (CMake compat rule), no viable config-mode hit"

# 测试
test:
  test_package: true
  upstream_test_in_build: true
  upstream_test_mode: "AUTO_REG 146 tests (make check semantics: <test> generate && <test> compare, reg_wrapper.sh equivalent) run in build() with /tmp→build-dir LD_PRELOAD redirect (test_files/lept_tmp_redirect.c)"
  upstream_test_result: "passed=115 skipped=20(gnuplot, reg_wrapper.sh exit-77 semantics) crashed=11(OHOS musl runtime SIGTRAP, PC ld-musl+0x1e3a8, not leptonica logic — golden files fully generated in generate phase; details in reports/test-report.md) failed=0"
  assertion_count: 12
