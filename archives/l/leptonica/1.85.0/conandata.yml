# sha256 实测（ghfast 镜像下载后 sha256sum）

sources:
  url: "https://github.com/DanBloomberg/leptonica/archive/refs/tags/1.85.0.tar.gz"
  sha256: "c01376bce0379d4ea4bc2ec5d5cbddaa49e2f06f88242619ab8c059e21adf233"

patches:
  - patch_file: "patches/001-jpegio-fflush-before-fclose-on-musl-memstream.patch"
    patch_description: "fflush() memstream after the terminating NUL in pixWriteMemJpeg (OHOS musl open_memstream does not count the terminating NUL in *psize unless explicitly flushed before fclose, unlike glibc; without this the -1 truncates the last byte of the JPEG EOI marker and every pixReadMem() fails with 'Premature end of JPEG file')"
    patch_type: "bugfix"
  - patch_file: "patches/002-memstream-fflush-before-fclose-on-musl.patch"
    patch_description: "Same OHOS musl open_memstream *psize semantic fix as patch 001, generalized to all *WriteMem() functions (boxa/boxaa/cmap/dewarp/dna/fpix/numa/pixa/pixcomp/pnm/pta/recog/sel/sarray, 20 call sites in 12 files): add fflush(fp) after the terminating NUL and before fclose() so that *psize is updated on musl as on glibc. Found by actually running the upstream AUTO_REG suite (heap_reg/watershed_reg/etc. failed with 'data not defined or size == 0' because numaWriteMem returned size=0)."
    patch_type: "bugfix"
