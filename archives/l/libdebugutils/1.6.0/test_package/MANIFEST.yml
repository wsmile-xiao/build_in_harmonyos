package: libdebugutils/1.6.0
homepage: "https://github.com/recastnavigation/recastnavigation"

# 1. Audit the pinned upstream archive's declared test target list.
upstream_check_command: "cmake -S . -B build -DRECASTNAVIGATION_DEMO=OFF -DRECASTNAVIGATION_EXAMPLES=OFF -DRECASTNAVIGATION_TESTS=ON; ctest --test-dir build -N"
# 2. The Conan recipe builds and runs the registered upstream test target.
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (native); Tests --reporter compact via hdc (HarmonyOS cross-build)"
# 3. Count was audited from Tests/Detour/Tests_Detour.cpp and Tests/Recast/Tests_Recast.cpp.
upstream_test_framework: "Catch2"
upstream_test_count: 43
upstream_test_audit: "Three-step audit of pinned v1.6.0: (1) Tests/CMakeLists.txt registers one Tests executable with add_test and vendors Catch2 in Tests/Contrib; (2) ctest -N lists that one registered entry; (3) source has 1 literal Detour TEST_CASE and 29 literal Recast TEST_CASEs (30 functional cases), plus 13 BM macro-generated benchmark cases when the OHOS target defines POSIX timer macros. The HarmonyOS x86_64 run reported all 43 cases passed; a platform that omits those benchmark guards runs the 30 functional cases. DebugUtils has no dedicated upstream target, so test_package separately calls duDebugDrawCircle through a recording duDebugDraw implementation."
upstream_tests:
  - file: Tests/Detour/Tests_Detour.cpp
    source: "recastnavigation-1.6.0/Tests/Detour/Tests_Detour.cpp"
    description: "Upstream Catch2 Detour coverage, 1 functional test case"
    command: "ctest --output-on-failure (native) / Tests --reporter compact via hdc (HarmonyOS cross-build)"
  - file: Tests/Recast/Tests_Recast.cpp
    source: "recastnavigation-1.6.0/Tests/Recast/Tests_Recast.cpp"
    description: "Upstream Catch2 Recast coverage, 29 functional cases plus 13 POSIX benchmark cases on OHOS"
    command: "ctest --output-on-failure (native) / Tests --reporter compact via hdc (HarmonyOS cross-build)"

test_package_tests:
  - file: test_libdebugutils.cpp
    description: "Calls DebugUtils circle rendering API and validates emitted primitive, lifecycle and finite vertices"
    command: "./libdebugutils_test"
  - file: test_harmonyos_platform.cpp
    description: "HarmonyOS-only target compile/runtime test for __OHOS__ and the 64-bit PC ABI"
    command: "./libdebugutils_harmonyos_test"

assertion_count: 8
