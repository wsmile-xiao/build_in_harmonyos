version: "1.6.0"
software: libdebugutils
status: built
build_date: "2026-09-23"
build_system: cmake

source:
  url: "https://github.com/recastnavigation/recastnavigation/archive/refs/tags/v1.6.0.tar.gz"
  sha256: "d48ca0121962fa0639502c0f56c4e3ae72f98e55d88727225444f500775c0074"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DRECASTNAVIGATION_DEMO=OFF"
    - "-DRECASTNAVIGATION_EXAMPLES=OFF"
    - "-DRECASTNAVIGATION_TESTS=ON"
    - "-DRECASTNAVIGATION_DT_POLYREF64=OFF"
    - "-DRECASTNAVIGATION_DT_VIRTUAL_QUERYFILTER=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "DebugUtils 1.6.0 is built from the Recast Navigation v1.6.0 release source."
  - "Static DebugUtils link dependencies are DetourTileCache, Detour and Recast; these are bundled into this package to avoid unverified external registry dependencies."
  - "The upstream project has no dedicated DebugUtils test target; its shared Catch2 suite has 30 functional cases and 13 POSIX benchmark cases on the OHOS target, complemented by DebugUtils consumer and HarmonyOS platform tests."
