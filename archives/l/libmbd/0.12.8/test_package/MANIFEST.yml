package: "libmbd/0.12.8"
homepage: "https://github.com/libmbd/libmbd"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests_exist: true

# Upstream audit (tag 0.12.8, sources re-checked 2026-10-04):
#   total 72 = ctest 46 + pytest 26 (review N=72)
#   ctest 46 = tests/mbd_grad_test_cases.F90 40 test_* subroutines
#     (driver tests/mbd_grad_tests.F90 dispatches all 40; 4 no-arg declarations
#     test_scs_deriv_impl_alpha, test_scs_ewald_deriv_impl_alpha,
#     test_scs_deriv_impl_vdw, test_scs_ewald_deriv_impl_vdw lack '(' so the
#     vanilla collect-mbd-tests.py regex registers only 36+6=42;
#     patches/collect-mbd-tests.patch relaxes it to 40+6=46)
#     + tests/mbd_api_tests.F90 6 case branches
#   pytest 26 (python_def: 'def test_*' per file; test_benchmark.py counts 1 def
#     although it parametrizes to 3 runs; pytest --collect-only would show 28,
#     the declaration keeps def counting to match review N=72 and avoid over-count)
#     = tests/test_fortran.py 23 + tests/test_python.py 1
#     + tests/test_benchmark.py 1 + tests/test_main.py 1
#   recipe runs ctest 46 for real in build(); pytest 26 is discovery-audited
#   (count must stay 26 or build refuses to report) plus a bounded wheel
#   backfill (split --only-binary installs: pytest+cffi, numpy, scipy each
#   into an isolated target, no source builds) and a real bounded pytest
#   tests/ -q run in build().
#   Collection stays blocked at tests/conftest.py's pymbd.fortran import
#   (C extension is a separate poetry/cffi deliverable built against an
#   installed libMBD; pymbd 0.12.8 sdist is on PyPI but needs a poetry-core
#   network build); the real collection error is the gap evidence.
#   Collection-blocked defs report as skipped with ohos_feature gaps.
upstream_tests:
  - id: "grad/*"
    source: "tests/mbd_grad_test_cases.F90 (40 test_* subroutines) + tests/mbd_grad_tests.F90 driver + tests/collect-mbd-tests.py (patched to match names with or without trailing '(')"
    command: "ctest -R grad/ (40 cases: T_bare_deriv, T_GG_deriv_expl/impl, T_fermi_deriv_impl, T_erfc_deriv_expl, mbd/scs/ts deriv families incl. ewald/stress/alpha/C6/vdw variants; incl. 4 no-arg scs cases the vanilla collect script drops: scs_deriv_impl_alpha, scs_ewald_deriv_impl_alpha, scs_deriv_impl_vdw, scs_ewald_deriv_impl_vdw)"
    description: "Analytical gradient vs 7-point finite-difference consistency across dipole/damping/MBD/SCS/TS kernels"
  - id: "api/*"
    source: "tests/mbd_api_tests.F90 (6 select-case branches)"
    command: "ctest -R api/ (6 cases: exception, energy, gradients, energy_from_ratios, hirshfeld_gradients, ts_gradients)"
    description: "High-level Fortran API end-to-end energy/gradient/exception paths on Ar dimer"
  - id: "pytest:test_fortran.py"
    source: "tests/test_fortran.py (23 def test_*) + tests/conftest.py fixtures"
    command: "pytest tests/test_fortran.py -q (needs pymbd C extension + numpy/scipy; device probe+run attempted in build, skipped with ohos_feature gaps when stack unimportable; audit in notes.md)"
    description: "pymbd Fortran-extension energy/gradient/RPA/periodic numerical assertions, 23 items"
  - id: "pytest:test_python.py"
    source: "tests/test_python.py (1 def test_ethylcarbamate)"
    command: "pytest tests/test_python.py -q (needs pymbd pure-python + numpy/scipy; device probe+run attempted in build, skipped with ohos_feature gaps when stack unimportable; audit in notes.md)"
    description: "pymbd pure-Python entry ethylcarbamate interaction energy, 1 item"
  - id: "pytest:test_benchmark.py"
    source: "tests/test_benchmark.py (1 def test_benchmark x 3 params: [], [--finite], [--method=ts])"
    command: "pytest tests/test_benchmark.py -q (needs pymbd.fortran benchmark subprocess + numpy/scipy; device probe+run attempted in build, skipped with ohos_feature gaps when stack unimportable; audit in notes.md; declared as 1 def)"
    description: "pymbd.benchmark subprocess end-to-end energy parsing, 1 item (3 parametrized runs)"
  - id: "pytest:test_main.py"
    source: "tests/test_main.py (1 def test_main)"
    command: "pytest tests/test_main.py -q (needs pymbd.fortran via pymbd.__main__ + numpy/scipy; device probe+run attempted in build, skipped with ohos_feature gaps when stack unimportable; audit in notes.md)"
    description: "pymbd.__main__ reference energy, 1 item"

test_package_tests:
  - id: "energy"
    source: "test_mbd.f90 check_energy"
    command: "sh run_mbd_tests.sh ./test_mbd (asserts MBD_TEST_PASS energy, Ar dimer custom vdw params)"
    description: "High-level Fortran API MBD energy on Ar dimer matches upstream api/energy reference"
  - id: "gradients"
    source: "test_mbd.f90 check_gradients"
    command: "sh run_mbd_tests.sh ./test_mbd (asserts MBD_TEST_PASS gradients sum)"
    description: "High-level Fortran API gradient norm matches upstream api/gradients reference"
  - id: "energy_from_ratios"
    source: "test_mbd.f90 check_energy_from_ratios"
    command: "sh run_mbd_tests.sh ./test_mbd (asserts MBD_TEST_PASS energy_from_ratios)"
    description: "vdW params from Hirshfeld ratios path matches upstream api/energy_from_ratios reference"
  - id: "run_mbd_tests.sh"
    source: "run_mbd_tests.sh (shell entry invoking ./test_mbd, asserts 3x MBD_TEST_PASS)"
    command: "sh run_mbd_tests.sh ./test_mbd (L0c shell entry, executed via self.run)"
    description: "POSIX shell harness that runs the Fortran consumer binary in order and fails on missing PASS markers"

test_counting:
  upstream_independent_total: 72
  integration_independent_total: 3
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 3
assertion_count: 3
upstream_test_total: 72
upstream_test_count_method: "ctest_entries+python_def"
