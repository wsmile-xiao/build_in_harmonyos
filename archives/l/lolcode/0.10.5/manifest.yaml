software: lolcode
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.10.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/justinmeza/lolcode/releases/download/v0.10.5/lolcode-0.10.5.tar.gz"

  # 源码校验和
  sha256: "3c552dd0240ba6abf35ea1d4eb1e22fd7e59f9730f55b145df237d370192829a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "--prefix=/"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 静态链接 (R26)
  static_linking: true
  ldflags: "-static"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lolcode 原始源码仅有简易 Makefile (gcc *.c -o lolcode)，需注入 configure 脚本和标准 Makefile"
  - "GitHub HTTPS 下载在中国大陆超时，可通过预填充 conan 下载缓存 (downloads/s/{sha256}) 解决"
  - "Conan Autotools 类在 build-release 子目录运行 make，需改用 self.run() + cwd=source_folder"
  - "test_package 需使用 self.dependencies[dep].cpp_info.bindirs[0] 获取二进制路径"
  - "make -j20 在鸿蒙系统上 jobserver mkfifo 失败，需使用 -j1"
  - "/tmp 为只读文件系统，Makefile 中需使用 TMPDIR 变量"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/lolcode-0.10.5.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/lolcode-0.10.5.work
  source_orig_hash: 332ce164ae70452e
  source_work_hash: 2bd7a23ebe5596fc
