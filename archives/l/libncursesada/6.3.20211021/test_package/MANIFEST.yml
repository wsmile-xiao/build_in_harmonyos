# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）

package: libncursesada/6.3.20211021
homepage: "https://invisible-island.net/ncurses/"

# 上游没有 make check / ctest / meson test；其"测试"= samples/ 下的示例程序，
# 默认随 `make` 构建（configure 的 --without-tests 可关闭），并链接到刚构建的
# Ada 库。因此这里如实声明：无自动化断言套件，只有构建级回归。
#
# 上游测试存量口径（评审 rule4 实测口径，2026-09-21 修正）：
#   samples/ 目录共 40 个 Ada 主体源文件 = 39 个 *.adb + 1 个 sample-explanation.adb_p
#   （`ls samples/*.adb samples/*.adb_p | wc -l` = 40）。
#   其中上游 samples/Makefile.in 的 PROGS 只构建 3 个可执行（tour/ncurses/rain），
#   其余 37 个为演示/单元源（上游 Makefile 无构建规则）。
#   声明必须取存量口径，不得只写被构建的子集，否则触发评审 rule4「少报」。
upstream_tests_inventory: 40
upstream_check_command: ""

# conanfile.py build() 中已通过 autotools.make() 构建 samples/
upstream_test_in_build: true
upstream_test_command: "make -j1  # 构建 include gen src doc samples"

upstream_tests:
  - file: samples/tour.adb
    source: AdaCurses-20211021/samples
    description: "交互式 Ada 绑定功能巡览（需 TTY；编译链接可自动判定）"
    command: "./tour"
  - file: samples/ncurses.adb
    source: AdaCurses-20211021/samples
    description: "ncurses2 演示主程序（聚合 attr/color/menu/form/panel 等 39 个 .adb；需 TTY）"
    command: "./ncurses"
  - file: samples/rain.adb
    source: AdaCurses-20211021/samples
    description: "经典 rain 演示（需 TTY；USE_GNAT_SIGINT 时构建）"
    command: "./rain"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/main.adb
    description: "Ada 消费者：Init_Screen/Add/Refresh/End_Window 最小屏幕生命周期"
    command: "gnatmake -o ncursesada-consumer src/main.adb -Isrc -largs -lAdaCurses -L<ncurses-libdir> -lncursesw ..."
  - file: run_pty.py
    description: "pty 驱动并在输出中断言 LIBNCURSESADA_CONSUMER_OK；OHOS 上执行前由 conanfile.py 用 binary-sign-tool 签名"
    command: "python3 run_pty.py ./ncursesada-consumer"

# 可自动判定的断言数：只有 test_package 的消费者程序带运行期断言（pty 断言标记）。
# 上游 samples/ 的 40 个主体源中（存量口径），只有 PROGS 的 3 个可执行
# （tour/ncurses/rain）会被构建，且为交互式，仅计「编译+链接通过」这一构建级证据，
# 不计入断言数（R51 口径：不得把构建级证据当作断言通过率）。
assertion_count: 1
