# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.3.20211021/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.3.20211021"

# 软件名
software: "libncursesada"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://invisible-island.net/archives/AdaCurses/AdaCurses-20211021.tgz"

  # 源码校验和
  sha256: "d2f74a8f88056ba28e0da6f503c20d5c7d074574bbadddc8a49cd4941e01f7f3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-widec"
    - "--disable-gnat-projects"
    - "--with-ada-compiler=gnatmake"
    - "--with-ada-libname=AdaCurses"
    - "--without-ada-sharedlib"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ncurses/6.5
    - gcc-ada/9.5.0
    - binutils/2.46.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: gcc
  cxx: g++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-config-guess-sub-ohos.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Ada(GNAT) 工具链在 ohpcd 只有 OHOS/armv8 制品，必须原生两 profile 构建（E007 同类：工具链可用性）"
  - "config.guess/config.sub 无 HarmonyOS 分支：需 patch 出 aarch64-unknown-linux-ohos，禁止用 --build/--host 绕过"
  - "默认 TMPDIR 下子进程新建目录写文件被拒（E114），需预建可写目录并改 configure 的 ac_tmp"
  - "lang-preflight 的 LANG_ENUM 缺 ada，Ada 项目会被误判为 c"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
