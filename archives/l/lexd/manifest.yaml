software: lexd
display: "lexd"
description: "lexd — Apertium 形态学词典编译器（.lexd 规则文件 → ATT 有限状态转换器）"
category: nlp
homepage: "https://github.com/apertium/lexd"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游原址 BlueDragonX/lexd 已下架（GitHub API 404），现官方仓库为 github.com/apertium/lexd（tag v1.3.5，release 资产 lexd-1.3.5.tar.bz2）；conandata.yml 以官方 release 资产为主源、Debian pool orig tarball（字节一致，sha256 4531686c…）为权威镜像兜底"
    - "发布包只有 configure.ac/Makefile.am，没有生成的 configure → 内置 `autoreconf -fi` 产物到 patches/autotools/（configure / aclocal.m4 / Makefile.in / src/Makefile.in + install-sh / missing / depcomp），在 source() 覆盖进源码树。不用 tool_requires(autoconf/automake) 的原因：会传递引入 musl 链接的 perl/5.42.2（本地 qemu 直接 signal 11；apertium/3.9.12 记录同一 perl 在真机 ABI 损坏），且 CI worker 只有 autoconf 没有 automake（lttoolbox/3.7.6 同一处置）"
    - "制品仓依赖的 .pc 以 `--prefix=/` 安装（pkg-config 会产出 -I/include / -L/lib，E355），且 worker 上没有可依赖的 pkg-config 二进制（E468）→ 不走 pkg-config：利用 pkg.m4 在 <PKG>_CFLAGS/<PKG>_LIBS 均已设置时跳过查找的语义，从 Conan 依赖模型导出这 6 个变量"
    - "lttoolbox 的 ustring.h 直接 `#include <utf8.h>`，而 utfcpp 包把它放在 include/utf8cpp/ → CPPFLAGS 追加「含 utf8.h 的子目录」，同时跳过 ICU 的 include/unicode/utf8.h（同名不同头）"
    - "依赖图只保留一个 ICU：requires icu4c/77（与 lttoolbox/3.7.6 传递依赖同款）。误用 icu/76.1 会同时存在两份 ICU，编译取 icu_77 头而 -licuuc 命中 76.1 归档 → 全量 icu_77::* 未定义；另 icu4c 的 cpp_info 不含 libicuio，而 configure 硬要求 icu-io，需显式补 `-licuio`（置于 trio 之前）"
    - "设备 uname 返回 HarmonyOS，config.guess 猜不出三元组 → configure 显式传 `--build=aarch64-unknown-linux-ohos`；不传 `--host`，避免 configure 进入交叉模式跳过 AC_RUN_IFELSE（E007/E205）"
    - "autoconf 生成的 configure 用 `umask 077 && mktemp -d` 建暂存目录，HMDFS setgid 下不可写 → 去掉 umask 077（E114 / DRAFT-6507）"
    - "automake maintainer 规则可能调用 worker 上不存在的 automake（Error 127）→ `ACLOCAL/AUTOMAKE/AUTOCONF/AUTOHEADER/AUTOM4TE=':'`（内置 Makefile.in/aclocal.m4 已是最新，属空操作，E041/E248/E071）"
    - "`make -j1`：HMDFS 下并行 jobserver fifo 报 EPERM（E074）"
    - "上游测试假定 in-source 构建：tests/feature/Makefile 是手写（无对应 AC_CONFIG_FILES 条目）且用相对路径 ../../src/lexd 取二进制 → 在源码目录手动 configure/make"
    - "纯 CLI 程序（package_type=application）：装 bin/lexd + share/man/man1/lexd.1 + lib/pkgconfig/lexd.pc，并提供软件级 commands.json（R38）"
    - "上游 1.3.5 的 -b/--bin 输出路径未实现（src/lexd.cc 中整段注释 + TODO: finish this!），任何输入都产出 0 字节且 rc=0 —— 不要按非空二进制断言"

versions:
  "1.3.5":
    status: built
    build_date: "2026-10-02"
    conan_ref: "lexd/1.3.5"
    build_system: autotools
    dependencies:
      - lttoolbox/3.7.6
      - icu4c/77
      - utf8cpp/4.1.1
    build_tools: []
    artifacts:
      - bin/lexd
      - share/man/man1/lexd.1
      - lib/pkgconfig/lexd.pc
    notes: >-
      上游 make check 的 2 个负例 × 6 flag 变体 = 12 次在 build() 内实测通过
      （.error 文件数强制校验 + sha256 证据随包发布）；36 个正例的 oracle 依赖
      HFST 工具链（制品仓未发布 hfst 与 foma），改由消费者侧 ATT gold 读取器
      覆盖 36 夹具 × 6 变体 = 216 组合 / 798 条断言（全部通过）
