package: lexd/1.3.5
homepage: "https://github.com/apertium/lexd"

# Upstream test inventory (R51): the tarball's top-level `make check` expands
# to 6 flag variants x 38 registered cases in tests/feature/Makefile —
#   36 positive (test-*.lexd, each with a *.strings.gold oracle)
#   2 negative  (negtest-col0.lexd, negtest-trailing-bracket.lexd)
# = 228 case executions upstream (36 x 6 = 216 positive, 2 x 6 = 12 negative).
upstream_tests_exist: true
upstream_test_count: 38
upstream_test_positive: 36
upstream_test_negative: 2
upstream_test_variants: 6
upstream_case_executions: 228
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -C tests/feature O=out-<variant> LEXD_TEST_FLAGS='<flags>' check-neg"

# Executed for real inside build(): the 2 negative cases x 6 variants = 12
# executions (they only need lexd's exit status). The recipe enforces the
# expected .error file count, requires every file to carry a lexd diagnostic
# and ships them under share/lexd/upstream-errors/ with a sha256 the consumer
# test re-computes.
upstream_executed: 12
upstream_passed: 12
upstream_failed: 0
upstream_evidence: "share/lexd/upstream-errors/*.lexd.txt.error (12 files) + share/lexd/upstream_test_result.json (sha256 in marker)"
# Excluded (NOT silently skipped): the 36 positive cases x 6 variants need the
# HFST command line tools (`hfst-txt2fst`, `hfst-fst2strings`) as their oracle.
# Neither is published in the ohpcd artifact repository, and HFST's own
# dependency Foma is not published either, so that pipeline is unavailable in
# CI; adapting HFST is a separate, much larger port.
upstream_excluded: 216
upstream_exclude_reason: >-
  positive oracle requires hfst-txt2fst + hfst-fst2strings (HFST), not published
  in the ohpcd registry (Foma dependency also absent); covered equivalently by
  the consumer-side ATT gold reader in test_package/att_check.py

upstream_tests:
  - file: tests/feature/Makefile
    source: lexd-1.3.5/tests/feature/
    description: "Upstream test driver: 36 positive cases diffed against *.strings.gold via hfst-txt2fst|hfst-fst2strings, 2 negative cases asserted on exit status"
    command: "make check"
  - file: tests/feature/negtest-col0.lexd
    source: lexd-1.3.5/tests/feature/
    description: "Negative case: `X(0)` column number 0 must be rejected (exit 1, 'Invalid column number (0)')"
    command: "make -C tests/feature LEXD_TEST_FLAGS='<flags>' check-neg"
  - file: tests/feature/negtest-trailing-bracket.lexd
    source: lexd-1.3.5/tests/feature/
    description: "Negative case: unexpected closing bracket must be rejected (exit 1, 'Unexpected closing bracket.')"
    command: "make -C tests/feature LEXD_TEST_FLAGS='<flags>' check-neg"
  - file: tests/feature/test-opt.lexd
    source: lexd-1.3.5/tests/feature/
    description: "Positive case (representative of 36): optional/prefix pattern attachment, oracle test-opt.lexd.txt.strings.gold"
    command: "make check (needs HFST) / att_check.py (shipped here)"
  - file: tests/feature/test-sieve.lexd
    source: lexd-1.3.5/tests/feature/
    description: "Positive case: sieve operators over 3 operands, oracle test-sieve.lexd.txt.strings.gold (21 surface forms)"
    command: "make check (needs HFST) / att_check.py (shipped here)"

test_package_tests:
  - file: test_lexd.sh
    description: >-
      Consumer smoke test running the installed bin/lexd: executable artifact,
      --version 1.3.5, --help usage banner, both upstream negative fixtures
      (exit status + error text), the upstream gold verification, the OHOS
      target assertion (ELF64/AArch64 header), the explicit output-file path
      (byte-identical to stdout) and graceful failure on a missing input file.
    command: "bash test_lexd.sh"
  - file: att_check.py
    description: >-
      Self-contained AT&T transducer reader reproducing the upstream positive
      oracle: every *.strings.gold line must be produced by the installed
      lexd for each of the 6 upstream flag variants (@0@ = empty label,
      @X.Y@ = flag diacritic per HFST -X obey-flags; dynamic-programming
      membership test, so no path enumeration cap). Also asserts the OHOS
      target: ELF64 AArch64. 36 fixtures x 6 variants = 216 combinations,
      798 gold assertions.
    command: "python3 att_check.py <bin/lexd> data/ <result-file>"

# Upstream fixtures/gold copied verbatim from lexd-1.3.5/tests/feature/
# (verified byte-identical with `diff -r`) so the consumer test can run
# without the source tree.
test_data:
  - path: "test_package/data/test-*.lexd"
    source: "lexd-1.3.5/tests/feature/"
    count: 36
  - path: "test_package/data/negtest-*.lexd"
    source: "lexd-1.3.5/tests/feature/"
    count: 2
  - path: "test_package/data/test-*.lexd.txt.strings.gold"
    source: "lexd-1.3.5/tests/feature/"
    count: 36
    description: "upstream expected-output oracles, 132 gold lines (+1 empty oracle) = 133 assertions per variant x 6 variants = 798"

assertion_count: 12
consumer_assertion_count: 12
gold_assertion_count: 798
gold_combination_count: 216
harmonyos_specific_assertions: 2  # ELF64/AArch64 asserted by both att_check.py and test_lexd.sh
