sources:
  "1.3.5":
    # Official upstream release asset. apertium/lexd is the current official home
    # of the project (the historical BlueDragonX/lexd repository is gone - the
    # GitHub API returns 404 for it). Release asset lexd-1.3.5.tar.bz2, 98619
    # bytes, sha256 4531686c0b7b71c87b3c17d709e99e3ea3eefec35968de69c45b60ccda872cb4
    # (byte-identical to the Debian pool orig tarball, which is where the
    # checksum was cross-checked from, since github.com is slow from the build host).
    # R39: only the official URL is listed here - CI injects its mirror fallback
    # automatically, so no manual mirror or repackaged source belongs in this file.
    url: "https://github.com/apertium/lexd/releases/download/v1.3.5/lexd-1.3.5.tar.bz2"
    sha256: "4531686c0b7b71c87b3c17d709e99e3ea3eefec35968de69c45b60ccda872cb4"

patches: []
