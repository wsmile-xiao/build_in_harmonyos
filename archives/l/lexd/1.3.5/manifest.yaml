software: lexd
version: "1.3.5"
status: built
build_date: "2026-10-02"
build_system: autotools (release tarball ships no generated `configure`; the autoreconf products are vendored in patches/autotools/ so the build needs neither autotools nor perl on the worker)
conan_ref: "lexd/1.3.5"

source:
  url: "https://github.com/apertium/lexd/releases/download/v1.3.5/lexd-1.3.5.tar.bz2"
  url_fallback: "https://deb.debian.org/debian/pool/main/l/lexd/lexd_1.3.5.orig.tar.bz2"
  sha256: "4531686c0b7b71c87b3c17d709e99e3ea3eefec35968de69c45b60ccda872cb4"
  tar_format: tar.bz2

build:
  system: autotools
  build_command: "source() overlays the vendored autoreconf products; CC=<clang> CXX=<clang++> ./configure --build=aarch64-unknown-linux-ohos --prefix=<pkg>; make -j1; make -C tests/feature O=out-<variant> LEXD_TEST_FLAGS='<flags>' check-neg (x6); make install"
  dependencies:
    - lttoolbox/3.7.6
    - icu4c/77
    - utf8cpp/4.1.1
  build_tools: []
  build_tools_note: >-
    none via tool_requires: autoreconf/autoconf/automake/m4 would pull the
    registry's musl-linked perl/5.42.2 into the build context, which crashes
    (signal 11 under qemu, ABI breakage on the native worker — apertium/3.9.12
    documents the same perl). The `autoreconf -fi` products are therefore
    vendored in patches/autotools/ and the dependency flags are exported as
    <PKG>_CFLAGS/<PKG>_LIBS so pkg-config is never invoked.
  cc: clang
  artifacts:
    - bin/lexd
    - share/man/man1/lexd.1
    - lib/pkgconfig/lexd.pc
    - share/lexd/upstream_test_result.json (R51 test evidence marker)
    - share/lexd/upstream-errors/*.error (the 12 real upstream negative-test outputs)

test_results:
  target: "OpenHarmony aarch64 (ELF64/AArch64 asserted by the test; native execution is covered by the CI release builder)"
  upstream_framework: "make check → 6 个 flag 变体 × 38 个注册用例（36 正例 + 2 负例）= 228 次"
  upstream_discovered: 228
  upstream_executed: 12
  upstream_passed: 12
  upstream_failed: 0
  upstream_excluded: 216
  upstream_note: "负例（negtest-col0 / negtest-trailing-bracket）× 6 变体 = 12 次实测全过（.error 文件数被强制校验，并按 sha256 落证据）；正例 oracle 需 hfst-txt2fst|hfst-fst2strings（HFST 未发布到制品仓，Foma 同样未发布）→ 不静默跳过，改由消费者侧 att_check.py 对 36 夹具 × 6 变体 = 216 组合、798 条 gold 断言全量覆盖（全部通过）"
  gold_fixtures: 36
  gold_assertions: 798
  gold_combinations: 216
  test_package_passed: 12
  test_package_failed: 0
  test_package_assertions: 12
  harmonyos_specific_assertions: 2
  execution: "conan create rc=0；build() 内上游负例 12/12；test_package 消费者断言 12/12（含 1 条 ELF64 AArch64 鸿蒙特有断言）+ att_check.py 798 条 gold 断言 / 216 组合全过"

test_passed: 822
test_failed: 0

patches_applied: []

knowledge_gained:
  - "制品仓依赖的 .pc 以 `--prefix=/` 安装 → pkg-config 会产出 -I/include / -L/lib（E355）；本配方改用 pkg.m4 的短路语义：当 <PKG>_CFLAGS 与 <PKG>_LIBS 都已设置时 PKG_CHECK_MODULES 不调用 pkg-config，故从 Conan 依赖模型直接导出这 6 个变量，同时也去掉了对 worker 上 pkg-config 二进制的依赖（E468）"
  - "autotools 包在 OHOS 上的自举：tool_requires(autoconf/automake) 会传递引入 musl 链接的 perl/5.42.2（本地 qemu signal 11 / 真机 ABI 损坏），CI worker 又缺 automake → 内置一次 autoreconf -fi 的产物（与 lttoolbox/3.7.6 同策），本地与 CI 走完全相同路径"
  - "依赖图里同时出现 icu/76.1 与 lttoolbox 传递的 icu4c/77 会造成头/库错配（编译取 icu_77 头、链接命中 76.1 归档）→ 全量 icu_77::* 未定义；只保留 icu4c/77，且 icu4c 的 cpp_info 未建模 libicuio，需显式补 -licuio"
  - "tests/feature 里的静态（手写）Makefile 只能在 in-source 构建下工作，且没有 automake 生成 tests/feature/Makefile 的 AC_CONFIG_FILES 条目 → 含此类测试的包必须手动在源码目录 configure/make"
  - "不需要 HFST 也能复核 ATT transducer 的 gold：@0@ 视作空标签、其余 @X.Y@ 视作 flag diacritic（等价 hfst -X obey-flags），用按位置索引的 DP 做成员判定即可避免路径枚举爆炸；注意 gold 因 `-c 10` 截断而是子集，断言只能是包含关系"
  - "上游 1.3.5 的 -b/--bin 输出路径整段被注释（TODO: finish this!），任何输入都产出 0 字节且退出码 0 —— 不要把 -b 的空输出当适配缺陷"
