software: libiscsi
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.19.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.19.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sahlberg/libiscsi/archive/refs/tags/1.19.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无外部依赖，仅需要标准 C 库

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-function-declaration.patch"

# 平台修复脚本（非补丁）
platform_fixes:
  - "apply-ohos-fixes.sh (E011 umask 077 → 022)"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011: HMDFS 文件系统 umask 077 导致 configure 创建临时目录失败，需修改为 umask 022"
  - "autogen.sh 生成的 configure 需应用平台修复，不应生成补丁"
  - "函数声明缺少 void 参数会导致 -Werror 编译失败"
  - "测试套件需要 libcunit，可跳过（不影响核心功能）"

