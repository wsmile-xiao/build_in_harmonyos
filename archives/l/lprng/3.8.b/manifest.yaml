# 版本级 manifest
# 文件位置: archives/l/lprng/3.8.b/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（任务串原样小写，与上游 tarball 实名 LPRng-3.8.B 的大小写差异
# 属不同命名域：URL/目录名内用上游实名，Conan/分支用任务串，未归一化）
version: "3.8.b"

# 软件名
software: "lprng"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方发布件，文件名大写 B）
  url: "https://downloads.sourceforge.net/project/lprng/lprng/LPRng-3.8.B/LPRng-3.8.B.tar.gz"

  # 源码校验和（与 Debian sid Sources 索引 .orig 一致，B 机自算复核同值）
  sha256: "541346a4bccd45acdeff1a8d09e80cc6a8bd22f9088739628ba787924a1806d1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（kerberos/tcpwrappers 上游默认关，无需显式开关；
  # --disable-ssl 裁掉 openssl 依赖、--disable-nls 关闭 i18n）
  configure_options:
    - "--disable-ssl"
    - "--disable-nls"
    - "CFLAGS=-fcommon"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "B 机 HMDFS：toybox mktemp -d 建出的目录属主不可写（drwx--S---），"
  - "autoconf config.status 经 confXXXX 临时目录 mv 落盘全部静默失败且 rc=0；"
  - "修法：PATH 垫片 mktemp（rmdir 后 mkdir 重建）或依赖 config.status 自身 mkdir 回退分支"
