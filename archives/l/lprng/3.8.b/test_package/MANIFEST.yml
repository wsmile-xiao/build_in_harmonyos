package: lprng/3.8.b
homepage: "https://lprng.sourceforge.net"

# 上游测试命令（不存在，留档供 CI 口径核对）
upstream_check_command: "make check"

# conanfile.py build() 中未集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 消费者视角测试（OHOS 新增，见 test.sh）
test_package_tests:
