    description: "OHOS 消费者冒烟：8 个打包二进制存在且可执行、etc/lpd 配置随包、4 个客户端对非法旗标打印 usage"
    command: "./test.sh"

# 测试断言总数（消费者断言：8 存在 + 2 配置 + 4 usage）
assertion_count: 14
