# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsepol/3.11
homepage: "https://github.com/SELinuxProject/selinux"

# 上游测试命令（上游 libsepol 无自动化测试套件：Makefile 无 check/test 目标，
# libsepol/tests 为手工工具集且依赖已编译的策略文件，非注册测试入口）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（N_static=0，见上）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试（CMake 构建 test_sepol 并断言运行）：①sepol handle 生命周期 set/get disable_dontaudit/preserve_tunables ②boolean record 增改查 ③context record 字段与 to_string 往返 ④编译期包含 <sepol/cil/cil.h>（3.11 新随包 CIL 头，secilc 下游依赖项）"
    command: "./test_sepol"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 24
