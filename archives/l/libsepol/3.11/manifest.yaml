# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.11"

# 软件名
software: "libsepol"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/SELinuxProject/selinux/archive/refs/tags/3.11.tar.gz"

  # 源码校验和
  sha256: "6ac2a91c05243895e69d5ecd182b78e3f90f09f0fed33933f0e026f4ed44cde6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: ["DISABLE_SHARED=y"]

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libsepol 3.x 静态库合并了全部 CIL 对象（nm libsepol.a 约 585 个 T cil_* 符号），下游 secilc 只需 -lsepol；但 CIL 头需按上游 install 布局单独安装 include/sepol/cil/cil.h，否则下游 include 失败"
