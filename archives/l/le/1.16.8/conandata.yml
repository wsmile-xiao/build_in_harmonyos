sources:
  url: "https://deb.debian.org/debian/pool/main/l/le/le_1.16.8.orig.tar.xz"
  sha256: "4ab7fdb9ddf12d57a0a3f0452d7cc5be583df8a926ab9e443bbc9be452cc402f"

patches:
  - patch_file: "patches/0001-configure-config-status-umask.patch"
    patch_description: "HMDFS: create the config.status scratch directory with umask 022 (umask 077 directories are unusable there)"
    patch_type: "portability"
  - patch_file: "patches/0002-signals-strict-cxx-typeof.patch"
    patch_description: "Use __typeof__ instead of the GNU typeof keyword, which strict -std=c++17 (the OHOS profile cppstd) rejects"
    patch_type: "portability"
