# 版本级 manifest — le 1.16.8
# 遵循 ARCHIVE-SPEC v2.0

version: "1.16.8"
software: "le"
status: built
build_date: "2026-10-04"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/l/le/le_1.16.8.orig.tar.xz"
  sha256: "4ab7fdb9ddf12d57a0a3f0452d7cc5be583df8a926ab9e443bbc9be452cc402f"
  tar_format: tar.xz
  upstream: "http://lav.yar.ru/programs.html"

build:
  system: autotools
  configure_options:
    - "release tarball 自带 configure（无 autoreconf）"
    - "--with-ncurses=yes"
    - "--with-curses-include=<ncurses 包>/include（LE 自带宏只搜索硬编码 /usr/include*）"
    - "--build/--host=aarch64-unknown-linux-gnu（config.guess 无法在本平台探测，E064）"
  dependencies:
    - ncurses/6.5
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-config-status-umask.patch"
  - "0002-signals-strict-cxx-typeof.patch"

package_type: application
artifacts:
  - "bin/le"
  - "share/le/**（keymap、颜色表、le.ini、图标、文档）"
libs: []
requires:
  - ncurses/6.5

tests:
  upstream_suite: "无（无 tests 目录、无 check_PROGRAMS/TESTS/check 目标）"
  upstream_audit: "build() 内执行 grep -nE 'check_PROGRAMS|^TESTS|check-local|^check:' 与 find -iname '*test*'，结果随 conan create 日志留证"
  consumer_checks: 7
  consumer_failures: 0
  consumer_pass_rate: "7/7 (100%)（test_package/test_le.sh：--version 版本与标识、--dump-keymap 内容+行数、--dump-colors 内容+行数、--help 用法路径 rc=1）"
  command: "conan create archives/l/le/1.16.8 -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"

knowledge_contributed:
  - "knowledge/drafts/DRAFT-ohos-libc-missing-family-variant-entrypoints.kv"
  - "knowledge/drafts/DRAFT-ohos-libc-missing-family-variant-entrypoints.md"

adaptation_paths:
  - B
