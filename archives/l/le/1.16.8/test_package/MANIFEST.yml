package: le/1.16.8
homepage: "http://lav.yar.ru/programs.html"

upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests:
  - name: upstream-suite-audit
    command: "grep -nE 'check_PROGRAMS|^TESTS|check-local|^check:' Makefile.in lib/Makefile.in src/Makefile.in misc/Makefile.in"
    expected: "no match: the release ships no test suite at all; the audit runs in build() and is recorded in the conan create log"

test_package_tests:
  - file: conanfile.py
    description: "Consumer recipe: locate the installed le binary via cpp_info.bindirs and run test_le.sh with the conanrun environment"
    command: "sh test_le.sh <package>/bin/le"
  - file: test_le.sh
    description: >
      Real binary invocations with output assertions for the editor's
      non-interactive entry points: --version (rc=0, must contain "1.16.8" and
      "Text editor LE"), --dump-keymap (rc=0, contains "backward-char",
      at least 100 lines), --dump-colors (rc=0, contains "default_colors",
      at least 20 lines) and --help (rc=1 by upstream design, must still print
      "Usage: le").  Writes its dumps to the build folder only.
    command: "le --version; le --dump-keymap; le --dump-colors; le --help"

assertion_count: 7
