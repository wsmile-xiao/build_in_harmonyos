# test_package/MANIFEST.yml
# Upstream validation-harness runs in build(); consumer test covers the public C++ API.

package: libmusicxml/3.22
homepage: "https://github.com/grame-cncm/libmusicxml"

upstream_tests_exist: true
upstream_test_audit: "Checked v3.22 tag: build/CMakeLists.txt has no enable_testing/add_test/gtest/ctest, but validation/Makefile (read/guido targets) and files/tests/Makefile drive the built sample tools xmlread and xml2guido over files/**/*.xml. That tool-over-samples loop is the runnable upstream suite; build() runs it with exit-0 plus non-empty-output assertions per file (xmlread output must contain '<'), so counts are dynamic (2 per sample file) and any failure fails the build."
upstream_check_command: "xmlread + xml2guido over files/**/*.xml"
upstream_test_in_build: true
upstream_test_command: "xmlread+xml2guido over files/**/*.xml (validation/Makefile + files/tests/Makefile entry)"
upstream_tests:
  - file: validation/Makefile
    source: validation/Makefile
    description: "Round-trip every files/**/*.xml sample through the built xmlread tool (exit 0, non-empty XML output)"
    command: "xmlread <sample.xml>"
  - file: files/tests/Makefile
    source: files/tests/Makefile
    description: "Convert every files/**/*.xml sample through the built xml2guido tool (exit 0, non-empty Guido output)"
    command: "xml2guido <sample.xml>"

test_package_tests:
  - file: test.cpp
    description: "Call musicxmllibVersion/VersionStr and convert a minimal score with musicxmlstring2guido, checking return code and non-empty Guido output (4 checks)"
    command: "./test_musicxml"

assertion_count: 4
