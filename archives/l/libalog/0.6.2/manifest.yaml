# 版本级 manifest — libalog 0.6.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.6.2"
software: "libalog"

# 编译状态
# published | built | failed | archived
# (R29: 未通过 conan_verify 只能标 built 或 failed；本配方已编写完成，
# 等待 HMBS 真机预检给出第一组实测证据，详见 notes.md)
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: custom

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方源：codelabs.ch Alog 项目发布的 libalog-0.6.2.tar.bz2
  url: "https://www.codelabs.ch/download/libalog-0.6.2.tar.bz2"
  sha256: "4f6f41aa85f7dec4bc2b4e10a26957514247eee4b5a498762fddab1714768425"
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================
build:
  # 构建系统类型：GNAT 工程文件（alog.gpr，经 gcc-ada 原生 gnatmake 直接驱动
  # 复刻；adacgi/1.6、libgmpada/1.6 先例，不再自带 Alpine 工具链引导）
  system: custom
  configure_options: []
  # 编译依赖列表（格式: name/version）
  # 构建期唯一的 Ada 工具链：制品仓原生 OHOS GNAT（tool_requires，不进
  # 运行时依赖链）；Ahven 2.8 测试框架在构建时从官方源下载（sha256 校验）。
  dependencies:
    - gcc-ada/9.5.0
    - binutils/2.46.0
  cc: gcc
  cxx: gcc

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

knowledge_gained:
  - "Alog 是纯 Ada 日志框架（Logger/Tasked_Logger/Active_Logger + FD/Syslog facility），上游用 alog.gpr/alog_tests.gpr（gprbuild），无 configure/CMake。"
  - "alog_tests.gpr 以 `with ahven` 依赖 Ahven 测试框架；Ahven 不在制品仓，用官方 ahven-2.8.tar.gz（sha256 pin）在构建时补齐，仅用于编译测试，不打包。"
  - "Ada 工具链改用制品仓原生 OHOS GNAT gcc-ada/9.5.0（tool_requires，adacgi/1.6、libgmpada/1.6 先例）：Alpine 13.2.1 自引导路线废弃——其 35MB 编译器后端（gnat1/cc1）在 binary-sign-tool 签名后一律即时段错误（rc=-11、零输出），两条签名路径皆然，栈加固/垫片隔离/pristine 重试/NEEDED 分诊均未改变指纹，分诊显示 NEEDED 回读为空。"
  - "gcc-ada 产出原生 OHOS ELF，只需 binary-sign-tool 自签（adacgi _sign_program 模式），无需 PT_INTERP/DT_NEEDED 改写；HNP bin 目录前置 PATH 供 gnat 驱动找 as/ld。"
  - "C 胶水 src/glue_syslog.c 用 aarch64-OHOS 门禁的 C 编译器选择编译后归档进 libalog.a（复刻 alog_common.gpr Languages Ada+C）：conf 值存在即用，缺失时经 PATH 发现并以 -dumpmachine 双门禁过滤，不用 gcc-ada 的 gcc 包装器（其 baked sysroot 检查在缺 SDK 的 runner 上拦截一切调用）。"
  - "gcc-ada bin/gcc 包装器在 baked sysroot 失效时全部调用失败；配方对 /data/service/hnp 做零假设：build 首步打 [device-truth] 宽探针，sysroot 多源探测（baked 值 + 多路 clang 推导 + OHOS 环境变量 + SDK glob，首个含 usr/include + Scrt1.o 者胜出，缺失则垫片降级直通），as/ld/ar 来自 binutils/2.46.0 tool_requires；全部 gnat 调用经 fixed-ohos-gcc 垫片直调 gcc.real。"
  - "上游 81 个 Add_Test_Routine 分布在 13 个 Ahven Testcase；Text_Runner 汇总行 Passed/Failed/Errors/Skipped 是唯一计数源。"

homepage: "https://www.codelabs.ch/alog"
license: "LGPL-2.1-or-later"

# ============================================================
# 测试
# ============================================================
tests:
  upstream:
    command: "gnatmake tests/test_runner.adb (复刻 alog_tests.gpr ALOG_BUILD=tests) && ./obj/test_runner"
    note: "上游 tests/test_runner.adb 串起 13 个 Ahven Testcase 共 81 个测试例；通过数以真机预检实际输出为准"
  adapted:
    command: "test_package/alog_smoke (经 test_package/run_tests.sh 驱动)"
    note: "消费者冒烟测试：Logger + FD facility 写文件、回读校验 3 项断言；通过数以真机预检实际输出为准"
