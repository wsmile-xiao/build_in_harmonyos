# test_package/MANIFEST.yml — libalog 0.6.2
# 上游官方测试声明文件

package: libalog/0.6.2
homepage: "https://www.codelabs.ch/alog"

# 上游测试存在性审计（HMBS rule4 门禁）：
# 上游 tests/ 目录含 test_runner.adb + 12 个 *_tests.adb 测试包 + 1 个
# mock 包，共 13 个 Ahven Testcase（与 test_runner.adb 的 Add_Test 列表一致）。
upstream_tests_exist: true
# 上游测试总数 = 81（逐文件统计 Add_Test_Routine 注册数，见 upstream_tests
# 各条目 routines 字段；统计方法与官方一致：Ahven 框架下每个
# Add_Test_Routine 即一个独立测试例，Text_Runner 逐个执行并汇总）。
upstream_test_total: 81
# 单一且可解析的框架（Ahven），总数来自源码 Add_Test_Routine 枚举，
# 真机执行数来自 Text_Runner 汇总行（见 conanfile.py _parse_ahven_summary）。
upstream_test_count_method: auto
upstream_test_audit: "Audit 2026-09-26 of libalog-0.6.2/tests: test_runner.adb registers 13 Ahven test cases; Add_Test_Routine counts per file: helper 5, log_request 1, protected_container 3, maps 3, facility 7, facility-fd 11, facility-syslog 1, transform 1, transform-casing 2, logger 16, tasked_logger 11, active_logger 14, policy 6; total 81. Ahven 2.8 Text_Runner prints deterministic 'Passed : N' (+ Failed/Errors/Skipped when > 0) summary lines used as the single counting source."

upstream_check_command: "gnatmake tests/test_runner.adb (replicates alog_tests.gpr ALOG_BUILD=tests) && ./obj/test_runner"
upstream_test_in_build: true
upstream_test_command: "./obj/test_runner (cwd=source root, ./data/*.ref fixtures)"

upstream_tests:
  - file: "tests/helper_tests.adb"
    source: "libalog-0.6.2/tests/helper_tests.adb"
    description: "Helpers: file equality + loglevel config file parsing (5 routines)"
    command: "./obj/test_runner"
    routines: 5
  - file: "tests/log_request_tests.adb"
    source: "libalog-0.6.2/tests/log_request_tests.adb"
    description: "Log_Request: async log request object (1 routine)"
    command: "./obj/test_runner"
    routines: 1
  - file: "tests/protected_container_tests.adb"
    source: "libalog-0.6.2/tests/protected_container_tests.adb"
    description: "Protected_Containers (3 routines)"
    command: "./obj/test_runner"
    routines: 3
  - file: "tests/maps_tests.adb"
    source: "libalog-0.6.2/tests/maps_tests.adb"
    description: "Maps: wildcard level maps (3 routines)"
    command: "./obj/test_runner"
    routines: 3
  - file: "tests/facility_tests.adb"
    source: "libalog-0.6.2/tests/facility_tests.adb"
    description: "Facility base: thresholds/timestamps/sources toggling (7 routines)"
    command: "./obj/test_runner"
    routines: 7
  - file: "tests/facility_tests-fd.adb"
    source: "libalog-0.6.2/tests/facility_tests-fd.adb"
    description: "FD facility: file logging vs data/*.ref fixtures (11 routines)"
    command: "./obj/test_runner"
    routines: 11
  - file: "tests/facility_tests-syslog.adb"
    source: "libalog-0.6.2/tests/facility_tests-syslog.adb"
    description: "Syslog facility: set/get origin, no daemon needed (1 routine)"
    command: "./obj/test_runner"
    routines: 1
  - file: "tests/transform_tests.adb"
    source: "libalog-0.6.2/tests/transform_tests.adb"
    description: "Transforms base (1 routine)"
    command: "./obj/test_runner"
    routines: 1
  - file: "tests/transform_tests-casing.adb"
    source: "libalog-0.6.2/tests/transform_tests-casing.adb"
    description: "Casing transform: lowercase/uppercase (2 routines)"
    command: "./obj/test_runner"
    routines: 2
  - file: "tests/logger_tests.adb"
    source: "libalog-0.6.2/tests/logger_tests.adb"
    description: "Logger: attach/detach facilities, message dispatch (16 routines)"
    command: "./obj/test_runner"
    routines: 16
  - file: "tests/tasked_logger_tests.adb"
    source: "libalog-0.6.2/tests/tasked_logger_tests.adb"
    description: "Tasked_Logger: async logging via tasks (11 routines)"
    command: "./obj/test_runner"
    routines: 11
  - file: "tests/active_logger_tests.adb"
    source: "libalog-0.6.2/tests/active_logger_tests.adb"
    description: "Active_Logger: active object logging (14 routines)"
    command: "./obj/test_runner"
    routines: 14
  - file: "tests/policy_tests.adb"
    source: "libalog-0.6.2/tests/policy_tests.adb"
    description: "Policy_DB: per-source/level policies (6 routines)"
    command: "./obj/test_runner"
    routines: 6

test_package_tests:
  - file: alog_smoke.adb
    description: "Consumer smoke test: Logger + FD facility writes 2 messages to a local log file and reads them back (3 assertions)"
    command: "./alog_smoke (via run_tests.sh)"
  - file: run_tests.sh
    description: "POSIX sh wrapper (L0c-recognized) that execs the real Ada smoke binary; exit status and checks_passed output pass through"
    command: "sh run_tests.sh ./alog_smoke"

assertion_count: 3
