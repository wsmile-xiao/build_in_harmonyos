software: libomp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/15.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "15.0.4"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
# cmake | autotools | makefile | meson | custom
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-15.0.4/openmp-15.0.4.src.tar.xz"

  # 源码校验和
  sha256: "1b6f92013e7555759127d84264c3e98eab116a3a5138570058d8507e1513f76e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DOPENMP_STANDALONE_BUILD=ON"
    - "-DLIBOMP_OMPT_SUPPORT=OFF"
    - "-DOPENMP_ENABLE_LIBOMPTARGET=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-runtime-src-kmp.h.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS 不支持 pthread_cancel 系列函数，需要 undef KMP_CANCEL_THREADS（类似 Android） (ref: E081)"
  - "libomp 使用 CMake 构建，需要 OPENMP_STANDALONE_BUILD=ON (ref: cmake-standalone)"
  - "需要复制 LLVM 公共 cmake 模块到源码目录（ExtendPath.cmake 等） (ref: llvm-cmake-modules)"
  - "禁用 libomptarget（OPENMP_ENABLE_LIBOMPTARGET=OFF）以避免 LLVM 依赖 (ref: libomptarget-disable)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/libomp-15.0.4.orig
  source_work_dir: /storage/Users/currentUser/builds/libomp-15.0.4.work
  source_orig_hash: d93555635135f9f8
  source_work_hash: f78d03e9d450bccb
  generated_at: '2026-05-19T19:34:55'
  patches_count: 2

patch_classification:
