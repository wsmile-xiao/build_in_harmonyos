# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libzt/0.3.1
homepage: "https://github.com/zyga/libzt"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./libzt-test"

# 上游实际运行的测试程序
upstream_tests:
  - file: zt-test.c
    source: libzt-0.3.1/zt-test.c
    description: "libzt 单元测试套件（58 个测试用例），由 make check 构建为 libzt-test 并运行，输出 'libzt self-test successful'"
    command: "./libzt-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 libzt 真实 API（zt_main/zt_check/ZT_CMP/zt_pack_*）构建测试套件并运行"
    command: "./test_libzt"
  - file: test_ohos.c
    description: "鸿蒙特有测试（harmonyos_specific_test）：uname -s 断言 HarmonyOS 内核标识 + aarch64 ABI（指针 8 字节）+ 真实调用 libzt API（zt_check/ZT_CMP_INT/ZT_CMP_CSTR/zt_pack_integer），在目标 OHOS 平台实际运行"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 58