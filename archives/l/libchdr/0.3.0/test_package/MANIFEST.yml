# test_package/MANIFEST.yml — libchdr 0.3.0
# Upstream test declaration (required by CI L0e).
# See docs/TEST_QUALITY_SPEC.md.

package: libchdr/0.3.0
homepage: "https://github.com/rtissera/libchdr"

# Upstream test suite existence.
# v0.3.0 tag registers no ctest test, but upstream master adds 5 ctest
# cases (known-answer, legacy-decode, sparse-map, open-ownership,
# parent-decode). The HMBS evidence gate requires executed>0 and rejects
# no_tests/0 when the upstream清单 shows tests, so the self-contained
# open-ownership case is vendored verbatim and executed on device.
upstream_tests_exist: true

upstream_test_audit:
  source_tarball: "v0.3.0.tar.gz"
  source_sha256: "313f6bf5537e2494daa3daa8a931a2536fc4f2b8312c07e3c3d5324d2052fa20"
  v0_3_0_tag:
    - "CMakeLists.txt: project(chdr VERSION 0.3.0); ends with add_subdirectory(tests); no include(CTest)"
    - "tests/CMakeLists.txt (v0.3.0): only add_executable(chdr-benchmark benchmark.c); fuzz target only under BUILD_FUZZER; no add_test()/enable_testing()"
    - "tests/benchmark.c: unregistered helper binary, not a test"
    - "tests/fuzz.c: optional libfuzzer harness, needs clang + libfuzzer, not a test"
  master_tree:
    - "tests/CMakeLists.txt (master): 5 add_test() registrations — known-answer (kat.c), legacy-decode (legacy_decode.c + corpus/legacy), sparse-map (sparse_map.c + corpus/seeds/rle_sparse.chd), open-ownership (open_ownership.c, in-memory only), parent-decode (parent_decode.c + corpus/parent)"
    - "scanned_for: TEST( / TEST_F (gtest), def test_ (pytest), add_test() / enable_testing() / include(CTest), tests/ corpus"
    - "scan_result: v0.3.0 tag 0 matches; master 5 add_test() matches"
  vendored:
    - "file: test_package/upstream_open_ownership.c — verbatim copy of master tests/open_ownership.c (BSD-3-Clause, Romain Tisserand)"
    - "reason_for_choice: only master case with zero corpus/network dependency (in-memory CHDv5 images + one scratch file); public API only, compatible with v0.3.0 headers"
    - "not_vendored: known-answer needs chd_crc16 (renamed vs v0.3.0 crc16) + version-specific KAT constants; legacy-decode/sparse-map/parent-decode need generated binary corpus (corpus/legacy, corpus/seeds, corpus/parent) not shipped in the v0.3.0 tarball"
  ctest_list_output: "v0.3.0 tag: ctest -N -> No tests were found!!! ; master: 5 tests (known-answer, legacy-decode, sparse-map, open-ownership, parent-decode)"
  reason: "v0.3.0 tag ships no registered test, but upstream master ships 5 ctest cases. Executing the self-contained open-ownership case on device satisfies the executed>0 gate with a genuine upstream test instead of no_tests/0."

upstream_check_command: "ctest -N (v0.3.0 tag: no tests; master: 5 tests)"
upstream_test_in_build: false
upstream_test_command: "upstream_open_ownership (vendored master tests/open_ownership.c, ctest open-ownership)"

upstream_tests:
  counting_basis: "Upstream master tests/CMakeLists.txt: 5 add_test() registrations; 1 self-contained case vendored and executed"
  total: 1
  cases:
    - file: upstream_open_ownership.c
      source: "upstream master tests/open_ownership.c (verbatim, BSD-3-Clause)"
      description: "Upstream ctest open-ownership: who closes file+parent on failed opens; in-memory images, sentinel 'all checks passed'"
      command: "./upstream_open_ownership"

# Tests added in test_package (consumer-perspective verification)
# R34: substantively calls the measured package API (chd_open,
# chd_read_header, chd_error_string, chd_close). No real CHD image is
# available, so hunk read-back is intentionally NOT exercised (it would
# only be meaningful on a successfully opened CHD image); both scenarios
# assert graceful error paths with distinct sentinels.
test_package_tests:
  - file: test_chdr.c
    scenario: normal
    description: "Verify chd_error_string() returns text, CHD_V5_HEADER_SIZE == 124, and chd_open()/chd_read_header() reject a missing file gracefully"
    command: "./test_chdr"
  - file: test_chdr.c
    scenario: fault-injection
    description: "Verify chd_open() returns a non-NONE error for a missing path"
    command: "./test_chdr --missing-path"

assertion_count: 6
