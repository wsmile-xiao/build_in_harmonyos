software: libchdr
version: "0.3.0"
status: built
build_date: "2026-09-17"
build_system: cmake

source:
  url: "https://github.com/rtissera/libchdr/archive/refs/tags/v0.3.0.tar.gz"
  sha256: "313f6bf5537e2494daa3daa8a931a2536fc4f2b8312c07e3c3d5324d2052fa20"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=ON (shared=True) / OFF + INSTALL_STATIC_LIBS=ON (shared=False)"
    - "BUILD_FUZZER=OFF"
  dependencies: []
  cc: clang

patches_applied:
  - "patches/0001-open-ownership.patch: backport upstream master open-ownership fix (failed chd_open closes file; OOM closes file+parent)"

knowledge_gained:
  - "libchdr 0.3.0 is the first formally tagged release (SOVERSION 0, libchdr.so.0)"
  - "All codecs vendored upstream (deps/lzma-25.01, deps/miniz-3.1.1, deps/zstd-1.5.7); no external requirements"
  - "Upstream ships no test suite: tests/CMakeLists.txt registers no ctest test, only chdr-benchmark helper + optional libfuzzer harness"
  - "Headers install to include/libchdr/; static target installs as libchdr-static.a only with INSTALL_STATIC_LIBS=ON"
