  - "librttopo_geom.h 需从 .in 模板生成（@SRID_MAX@=999999、@SRID_USR_MAX@=918999）"
  - "test_package 链接 rttopo（依赖 geos_c C++ 库）时需 set_target_properties LINKER_LANGUAGE CXX"

