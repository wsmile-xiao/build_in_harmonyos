software: libcodec2
build_system: cmake
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.0"

# 构建系统（顶层字段，供快速检索）
build_system: cmake

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/drowe67/codec2/archive/refs/tags/1.2.0.tar.gz"

  # 源码校验和
  sha256: "cbccae52b2c2ecc5d2757e407da567eb681241ff8dadce39d779a7219dbcf449"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DUNITTEST=OFF"
    - "-DLPCNET=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-run-codebook-generator-through-emulator.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Cross builds must execute upstream's generated codebook helper through CMAKE_CROSSCOMPILING_EMULATOR; otherwise Exec format error occurs."
  - "codec2 uses CMake build system (not autotools)"
  - "CMake warns about unknown platform HarmonyOS but builds fine"
  - "UNITTEST requires octave which is unavailable on OpenHarmony, must disable"
  - "LPCNET requires separate lpcnetfreedv library, disable for standalone build"
  - "Upstream install rules only install library+headers, not executables"
  - "Must use out-of-source build (CMakeLists.txt enforces this)"
