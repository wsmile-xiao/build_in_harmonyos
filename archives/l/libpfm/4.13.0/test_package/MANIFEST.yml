# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libpfm/4.13.0
homepage: "https://github.com/wcohen/libpfm4"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C tests validate && ./tests/validate"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "./tests/validate"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/validate.c
    source: libpfm4-4.13.0/tests/validate.c
    description: "libpfm upstream validation tool: per-arch event table encoding checks (validate_x86/arm/arm64/mips/power + validate_perf.c)"
    command: "./tests/validate"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: pfm_initialize + pfm_get_version + PMU 枚举 (真实调用 pfm_* API)"
    command: "./test_libpfm"
  - file: harmonyos_test.c
    description: "HarmonyOS PC (aarch64) 专项测试: arm_ac57::CPU_CYCLES 经 PFM_OS_PERF_EVENT 编码 + __aarch64__ 目标校验 + 库身份核验"
    command: "./test_libpfm_harmonyos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
