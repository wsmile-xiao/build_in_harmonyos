# 版本级 manifest — libpfm 4.13.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.13.0"

# 软件名
software: libpfm

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub codeload，tag v4.13.0）
  url: "https://codeload.github.com/wcohen/libpfm4/tar.gz/refs/tags/v4.13.0"

  # 源码校验和（官方 tag v4.13.0 tarball，实测核验）
  sha256: "b06071d7e528402a6504273ea700354ebfcf4b62ffe239cb6471fcdb04ae3f3d"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: makefile（libpfm4 使用 Makefile + config.mk，非 autotools）
  system: makefile

  # 配置选项（无 configure；make 变量覆盖见下）
  configure_options:
  - "make SYS=Linux  （uname -s 报 HarmonyOS，libpfm 的 perf_event 源文件挂在 ifeq SYS,Linux 下）"
  - "make ARCH=aarch64 （CONFIG_PFMLIB_ARCH_ARM64=y，仅编 ARM64 事件表）"
  - "make CONFIG_PFMLIB_NOPYTHON=y （跳过 python 绑定子目录，仅编 C 库）"
  - "make 'DBG=-g -Wall -Werror -Wextra -Wno-unused-parameter -Wno-error=unused-but-set-variable -Wno-error=#warnings' （最小放宽 clang 15 的两类误报警告，其余保持 -Werror）"

  # 编译依赖列表（无第三方依赖：libpfm4 仅依赖 libc/kernel headers）
  dependencies: []

  # 编译器（OHOS SDK clang 15，target aarch64-unknown-linux-ohos）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 无源码补丁：编译期警告通过 make DBG 变量放宽，不修改上游源码
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "libpfm4 纯 Makefile 构建：上游把 Linux-perf_event 源文件挂在 ifeq ($(SYS),Linux) 下，而 HarmonyOS 上 uname -s 返回 HarmonyOS，必须用 SYS=Linux 覆盖才能编译 perf_event 支持（HarmonyOS 内核即 Linux 系，perf_event_open 可用）"
- "上游 -Werror 在 clang 15 上对 64 位目标的两类误报：lib/pfmlib_common.c set-but-not-used 变量、OHOS sysroot <sys/poll.h> 重定向 #warning；用 -Wno-error=unused-but-set-variable 与 -Wno-error=#warnings 最小放宽即可，无需改源码"
- "libpfm 上游 validate 的 5 个 struct ABI 大小检查按 32 位 ABI0 常量硬编码（44/48/48/20/28），64 位 aarch64 实际 56/64/64/32/40 必然报 mismatch——是上游 64 位校准伪影，非适配缺陷，编码/事件表检查全部通过"
- "libpfm 支持 LIBPFM_ENCODE_INACTIVE=1 环境变量以编码非本机检测到的 PMU 事件，HarmonyOS 专项测试需同上游 validate 一样设置后才能验证 ARM64 事件表路径"

# ============================================================
# 测试信息
# ============================================================

test:
  upstream_check_command: "./tests/validate"
  upstream_test_in_build: false
  test_package_tests:
  - "test.c: pfm_initialize + pfm_get_version + PMU 枚举"
  - "harmonyos_test.c: arm_ac57::CPU_CYCLES 经 LIBPFM_ENCODE_INACTIVE=1 + pfm_get_event_encoding 编码验证 + __aarch64__ 目标校验"