software: libdotconf
# 版本级 manifest
# 文件位置: archives/l/libdotconf/1.4.1-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.4.1-r0"
build_system: autotools
status: published
build_date: "2026-06-02"
compile_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://codeload.github.com/williamh/dotconf/tar.gz/v1.4.1"
  sha256: "5922c46cacf99b2ecc4853d28a2bda4a489292e73276e604bd9cba29dfca892d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++
  # 原始 tarball 不包含 configure，需要 autoreconf 生成
  pre_configure:
    - "autoreconf -fi"
  # HMDFS setgid mktemp 权限修复：configure 中 mktemp -d 创建的目录组权限为 --S，
  # chmod 无法修改 HMDFS 目录权限；替换为 mkdir 继承父目录 setgid 权限
  post_autoreconf:
    - "sed -i '/mktemp -d \"\\.\\/confXXXXXX\"/c\\        tmp=\"\\${TMPDIR:-\\/tmp}\"\\/dotconf-$$; mkdir \"\\$tmp\" && chmod 700 \"\\$tmp\"' configure"

# ============================================================
# 补丁信息
# ============================================================

# 无补丁文件：此软件为 autotools 项目但原始 tarball 不含 configure，
# 所有构建辅助文件由 autoreconf -fi 从系统工具链复制生成。
# 系统的 config.guess/config.sub 已包含 OpenHarmony 支持。
# HMDFS setgid 修复通过 post_autoreconf sed 命令实现。
patches_applied: []

patch_generation:
  method: none
  note: "原始 tarball 无 configure，autoreconf -fi 生成所有构建文件；HMDFS 修复用 sed 命令"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS setgid 文件系统上 mktemp -d 创建目录权限为 --S（无组写权限），chmod 无法修改；需替换为 mkdir 继承父目录 setgid 权限"
  - "原始 tarball 不包含 configure 脚本的 autotools 项目，需 autoreconf -fi 生成，无需为生成文件创建补丁"
  - "libtoolize 默认将 ltmain.sh 放在 ../.. 路径，需手动复制到项目根目录"