# 软件级 manifest — libsignal-core
# 遵循 ARCHIVE-SPEC v2.0

software: libsignal-core
display: "libsignal-core"
description: "Signal Messenger 核心身份/密钥原语库（rust/core crate：ServiceId/Aci/Pni/E164/DeviceId/ProtocolAddress/curve X25519，AGPL-3.0）"
category: library
homepage: "https://github.com/signalapp/libsignal"
license: AGPL-3.0-only
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "libsignal monorepo workspace 根在仓库根；rust/core 不在 members 列表，靠 path 依赖隐式入图，必须 cargo build -p libsignal-core 切片选建"
    - "OHOS 预检沙盒 cargo/rustc 可能不在 PATH，先探测已知位置（HNP/harmonybrew/rustup）；无则 urllib 下载 Harmonybrew rust-1.98.1 bottle 自举（argc/1.24.0 同仓库先例；bottle 版本会随镜像换代过期，以 Harmonybrew formula 仓库 current revision 为准）"
    - "设置 CC/CXX=clang 与 RUSTFLAGS='-C linker=clang'，OHOS 无 cc 符号链接；OHOS /tmp 只读，构建与测试需用可写 TMPDIR"
    - "rlib 闭包交付：liblibsignal_core.rlib + deps/ 哈希后缀依赖 rlib，Rust 消费者 rustc --extern -L dependency 直链"
    - "上游 rust-toolchain 文件要求 1.98.1，cargo 直调忽略该文件；依赖 MSRV ≤ 1.93.1，自举 bottle 即 1.98.1"
    - "上游测试 cargo test -p libsignal-core --lib --release：25 个 src 单测全离线可执行；--lib 排除空 doc-tests 阶段（工具链无 rustdoc）"
  common_dependencies:
    - rust
    - openssl3
    - zlib-ng-compat

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.103.1":
    status: built
    build_date: "2026-09-27"
    published_as: ""
