patches:
  "0.103.1":
    - patch_file: "patches/0001-minimal-workspace-rust-core.patch"
      patch_description: "Shrink workspace to rust/core (drop 25 members / 3 git workspace deps / [patch.crates-io] / 4 zero-reference dev-deps) so cargo never re-resolves the full workspace (bridge git deps would clone signalapp/boring+BoringSSL submodule, unreachable on device and CI); the matching regenerated Cargo.lock ships as a standalone exported file and replaces the upstream lock wholesale in source() (byte-identical to the patch-ng result of the former full patch); zero version drift vs upstream lock"
