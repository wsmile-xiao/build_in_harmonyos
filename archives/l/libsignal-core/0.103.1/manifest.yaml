software: libsignal-core
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.103.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.103.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"

# 构建系统类型 (顶层字段)
build_system: cargo

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/signalapp/libsignal/archive/refs/tags/v0.103.1.tar.gz"

  # 源码校验和
  sha256: "1a85145629a2a5ba085c9dbc346d990e7ee5e9a9e5320b88889a0feaa0278c0e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | cargo | custom
  system: cargo

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "rust/1.98.1 (Harmonybrew bottle 自举)"
    - "openssl3/3.6.4 (Harmonybrew bottle, cargo.real 运行时依赖)"
    - "zlib-ng-compat/2.3.3 (Harmonybrew bottle, cargo.real 运行时依赖)"
  # Rust crate 依赖由 Cargo.lock 管理（workspace 切片 -p libsignal-core）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-minimal-workspace-rust-core.patch"
# 说明: 纯 manifest hunk（84 行）——workspace 缩容到 rust/core（删 25 成员/
# 3 个 git workspace 依赖/[patch.crates-io] 段/4 个零引用 dev-deps）；
# 重生成的 Cargo.lock（80 包，逐包 --precise 钉回上游原锁版本，零漂移）
# 以独立文件随配方 exports_sources 交付（MR 内唯一一份副本）、source()
# 打补丁后整体覆盖上游锁、package() 随包分发，test_package 从
# package_folder 取同一份锁（与老全量补丁 patch-ng strip=0 应用结果逐
# 字节一致），真机 cargo 零 git 解析；锁补丁拆分使可审 diff 从 14930
# 行降到可检视量级。test_package/patches/ 下的补丁副本与主配方为同一
# 84 行文件（原 7140 行全量副本同步替换，老补丁锁 hunk 效果本就被锁
# 覆盖抵消，语义不变）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libsignal monorepo workspace 根在仓库根；rust/core 不在 members 列表，靠 workspace.dependencies path 依赖隐式入图，必须 cargo build -p libsignal-core 切片选建，避免构建 25 个成员"
  - "仓库首个 Rust「库」包（此前 8 个已合入 Rust 包均为 application）：rlib 闭包交付（liblibsignal_core.rlib + deps/ 哈希后缀依赖 rlib），Rust 消费者 rustc --extern -L dependency 直链"
  - "上游 rust-toolchain 文件要求 1.98.1：直接调用 cargo 二进制时该文件仅被 rustup 强制、cargo 忽略；自举 bottle 即 1.98.1（镜像换代后旧 bottle 已清，bottle 版本以 Harmonybrew formula 仓库 current revision 为准，见 notes.md）"
  - "Harmonybrew rust bottle 换代伴随布局变化：1.97.1 及更早 = bin/cargo wrapper 脚本 + cargo.real 拆分层；1.98.1_2 起 = bin/ 直接放 ELF。自举搜索须兼容两种布局（先找 cargo.real，回退到非 #! 的 cargo）"
  - "bottle revision 决定 cargo 动态依赖面：1.98.1 r2 的 cargo NEEDED 实测含 libgit2/libssh2/libcurl/libsqlite3（需 12+ bottle 闭包），r0 仅 libc/libcrypto/libssl/libz（3 瓶集覆盖）→ 取 r0；选 bottle 前先验 NEEDED 再定闭包"
  - "Cargo.lock 是 workspace 级锁：manifest 与锁任何失配 → cargo 重解析**整个 workspace** → 解析器克隆其他成员的 git 依赖读 manifest（真机第 5 轮实证：patch 段与 dev-deps 已删仍去拉 signalapp/boring + boringssl 子模块卡死）——对策三件套：缩 workspace 到切片 + 随附与改动后 manifest 匹配的重生成锁（逐包 --precise 钉回上游原锁版本）+ 全链 --locked 兜底"
  - "上游 tarball 的 Cargo.toml 为 CRLF 而 Cargo.lock 为 LF：补丁上下文与目标字节必须行尾一致，否则报 'patch does not apply'（早前手写补丁未解之谜的根因）；补丁采用纯 unified 格式（无 diff --git/index 头，保留 --- a/X +++ b/X），conan 2.29 patch() 默认 strip=0（设备读 conan 源码实证，apply_conandata_patches 不传 strip），strip=0 + 纯 unified 在 CI build 阶段与真机第 6-12 轮双实证全绿（早前笔记'conan 默认 strip=1'有误，已纠正）"
  - "CI 与真机工具链环境分叉第二例：CI worker 的 /data/service/hnp/bin/git 缺 libz.so 加载失败（rc=127，subprocess git apply 挂 test_package，CI #63565 实证），设备 git 却可用——配方内补丁应用一律用 conan.tools.files.patch（patch-ng 纯 Python，无外部二进制），与主配方 source() 的 apply_conandata_patches 同机制，CI/真机行为一致"
  - "rustc -L dependency 只在单一目录解析哈希名 rlib：conan copy 保序会把 deps/ 子目录带进 package，哈希 rlib 落在 lib/deps/ 时消费者 probe 报 rlib closure incomplete（真机第 6 轮实证）→ package() 须增加 deps/ 平铺拷贝（第 7 轮定稿）"
  - "rlib 闭包还含 proc-macro crate 的哈希后缀 .so（zerocopy_derive 等，元数据在 .so 内）：消费者 rustc 对传递依赖做全图元数据加载，只拷 *.rlib 必报 can't find crate（真机第 7 轮实证；use 式报错会掩蔽成顶层 crate 名，需 extern crate 改写+RUSTC_LOG 定位）→ package() 须一并平铺拷贝 deps/*.so"
  - "裸 rustc 不读 RUSTFLAGS（RUSTFLAGS 是 cargo 的变量，cargo 转递给 rustc）：消费者 probe 直调 rustc 时必须显式 -C linker=clang，否则回退默认 cc 报 EACCES（OHOS 无 cc 符号，真机第 8 轮实证）"
  - "CI 门禁 L0d 是静态检查：test_package/conanfile.py 的 test() 源码里没有 self.run() 调用即判 stub_test_method，subprocess.run 实际执行了测试也照样挂——测试程序必须经 self.run 执行（2048.c 先例：CONFIG_SHELL 包住脚本），需解析输出的场景（如 cargo test 的 passed/failed 对账）保留 subprocess 但必须有至少一处 self.run 实际跑测试"
  - "conan 2.29 run() 参数语义：env 只接受 env-file 名列表（conanbuild/conanrun），传 dict 报 AssertionError；默认 ignore_errors=False，非零退出码 run() 自己 raise——自定义环境注入走 os.environ.update + env=None（真机第 10 轮实证）"
  - "上游测试：cargo test -p libsignal-core --lib --release 在 test_package 阶段执行（hmbs 预检只从 test_package 阶段 stdout 采集 HMBS_UPSTREAM_TEST_RESULT 标记，tlsx/1.2.2 先例）"
  - "Rust 工具链在 OHOS 真机预检沙盒中可能不在 PATH，先探测已知位置（HNP/harmonybrew/rustup）；无则用 urllib 下载 Harmonybrew OHOS rust bottle 引导（argc/1.24.0 同仓库已合入先例，设备 curl 无 CA bundle）"
  - "cargo 项目级 config 发现语义：.cargo/config.toml 只从 cwd 及祖先目录被发现——build() 用 cwd=source_folder 时，generate() 写进 build_folder 的镜像配置永不生效（CI #63478 实证：build 回退官方 crates.io，syn 下载 transfer-too-slow 30 次重试用尽挂掉；真机此前 11 轮因链路好侥幸全绿，ls-create9 的 rsproxy 行全来自 config 写对位置的 test_package 阶段）。整改=generate() 同时写 source_folder+build_folder；验证必须用全新空 CARGO_HOME 冷缓存复验（等价 CI 条件）"
  - "锁整体替换不宜内嵌进补丁：6575 行替换 hunk 在主配方与 test_package 双份 = 可审行爆炸（14930 行 → AI 检视跳过）。整改=锁拆分为独立随附文件（exports_sources 交付、source() 覆盖）+ 补丁只留 manifest hunk（84 行）；从老补丁抽取锁内容时注意多 hunk 夹缝行（hunk 外上下文由 patcher 直传、行级过滤必丢，须按 section header 锚点插回）；可审行大头可能是 test_package 自带的老全量补丁副本——三轮缩容才清干净"
  - "Harmonybrew bottle 的 bin 包装脚本带 0555（无写位）：OHOS 对 owner 也严格按权限位拒绝写入，重写 wrapper 前必须 os.chmod 补写位（真机第 16 轮 v1 实证 PermissionError EACCES）。自举路径要按'工具链可能被清空'设计——此前 14 轮 test_package 全靠 _find_cargo 命中预装工具链、bootstrap 从未被真正执行，环境一变立即暴露隐患；修复必须让主配方 build 全量重建走到 bootstrap 实证"
