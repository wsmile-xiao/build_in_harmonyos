# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsignal-core/0.103.1
homepage: "https://github.com/signalapp/libsignal"

# 上游测试命令 (cargo test for Rust projects)
upstream_check_command: "cargo test --locked -p libsignal-core --lib --release"

# 上游测试在 test_package 阶段执行（hmbs 预检只从 test_package 阶段
# stdout 采集 HMBS_UPSTREAM_TEST_RESULT 标记，tlsx/1.2.2 先例）
upstream_test_in_build: false
upstream_test_command: "cargo test --locked -p libsignal-core --lib --release"

# 上游测试存在性审计（hmbs 硬门禁要求）
upstream_tests_exist: true
upstream_test_audit: |
  审计结论：上游 libsignal 0.103.1 的 rust/core crate（crate 名
  libsignal-core）存在完整测试套件，已接入并在真机完整执行。
  1. rust/core/src/ 内 25 个 #[test] 单元测试（address.rs 12 + curve.rs 7
     + curve/curve25519.rs 4 + e164.rs 2），纯逻辑/密码学测试，无网络依赖
  2. core 无 tests/ 集成目录、无 doctest 用例（src/ 无代码块）
  3. 无在线数据集/外部服务依赖，全部用例可在 HarmonyOS aarch64 真机离线执行
  前置处理：应用补丁 0001（纯 manifest hunk，workspace 缩容到 rust/core）
  + 用随附重生成的 Cargo.lock 覆盖上游锁——根因（真机第 4/5 轮实证）：
  上游 workspace 25 个成员中 bridge/* 经 workspace.dependencies 直接 git
  依赖 signalapp/boring（含 boringssl 子模块）与 SparsePostQuantumRatchet，
  只要 Cargo.lock 与 manifest 有任何失配，cargo 就重解析整个 workspace，
  解析器必克隆上述 git 仓库取 manifest，设备/CI 无法访问 github（卡死在
  "Updating git submodule boringssl"）。因此：(1) members 缩到
  ["rust/core"]、删 3 个 git workspace 依赖与 [patch.crates-io] 段、删
  rust/core 4 个零引用 dev-deps（boring/boring-sys/clap/criterion，
  0.103.1 tag 全树 grep 实证）→ 解析图零 git 依赖，重解析也只走
  rsproxy registry；(2) 随附对缩容后 manifest 重生成的 Cargo.lock
  （80 包，Windows 侧以原锁为偏好逐包 --precise 钉回上游版本，
  cargo check --locked 实证锁即当前；主配方 exports_sources 唯一副本、
  package() 随包分发，test_package 从 package_folder 取同一份锁打补丁
  后整体覆盖上游锁，与老全量补丁 patch-ng strip=0 应用结果逐字节
  一致）→ 真机零重解析、依赖版本与上游锁零漂移，测试加 --locked 兜底
  （失配立即报错而非去克隆 github）。补丁不触及任何被测代码；上游
  tarball 的 Cargo.toml 为 CRLF，应用前先把 2 个待补丁 manifest 文件
  统一成 LF（LF↔LF 在 git apply/GNU patch/patch-ng 三系 patcher 下
  全部实证通过）。
  doc-tests 说明：cargo test 默认的 doc-tests 阶段因 OHOS rust 工具链
  （Harmonybrew bottle）无可用 rustdoc 无法执行——cargo 连 spawn rustdoc 都
  失败（ENOENT），与同仓库已合入的 martin/1.13.0 及 stylua/usage/gifski
  先例一致，判定为平台限制而非用例失败。core 源码无 doctest 用例，故以
  cargo test --locked -p libsignal-core --lib --release（--lib 只跑 src
  单测、天然排除空 doc-tests 阶段）执行，不丢失任何真实用例。
  计数方式：以真机 cargo test --locked -p libsignal-core --lib --release 的
  "test result:" 框架输出行为准（discovered/executed/passed/failed/skipped
  全部取自框架输出，非静态统计）。

# 上游实际运行的测试程序
upstream_tests:
  - file: rust/core/src/address.rs
    source: libsignal-0.103.1/rust/core/src/address.rs
    description: "ServiceId/Aci/Pni/DeviceId/ProtocolAddress 单元测试（12 个 #[test]：conversions, round_trip_service_id_binary/fixed_width_binary/string, logging, case_insensitive, accepts_ios_system_story_aci, rejects_invalid_binary_lengths/uuid_strings/types, ordering, ordering_consistency）"
    command: "cargo test --locked -p libsignal-core --lib --release"
  - file: rust/core/src/curve.rs
    source: libsignal-0.103.1/rust/core/src/curve.rs
    description: "curve 模块单元测试（7 个 #[test]：test_large_signatures, test_decode_size, curve_error_impls_std_error, honest_keys_are_torsion_free, tweaked_keys_are_not_torsion_free, keys_with_the_high_bit_set_are_out_of_range, keys_above_the_prime_modulus_are_out_of_range）"
    command: "cargo test --locked -p libsignal-core --lib --release"
  - file: rust/core/src/curve/curve25519.rs
    source: libsignal-0.103.1/rust/core/src/curve/curve25519.rs
    description: "curve25519 模块单元测试（4 个 #[test]：test_agreement, test_random_agreements, test_signature, test_random_signatures）"
    command: "cargo test --locked -p libsignal-core --lib --release"
  - file: rust/core/src/e164.rs
    source: libsignal-0.103.1/rust/core/src/e164.rs
    description: "E164 单元测试（2 个 #[test]：round_trip_through_bytes, round_trip_through_string）"
    command: "cargo test --locked -p libsignal-core --lib --release"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — rustc 直链打包的 rlib 闭包编译 probe.rs，25 项断言覆盖 VERSION/try_scoped/derive_arrays/E164/DeviceId/ProtocolAddress/ServiceId/curve 密钥对与 X25519"
    command: "/bin/sh test.sh <libdir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 25
