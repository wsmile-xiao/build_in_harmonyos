software: libhwy_contrib
version: "1.3.0"
status: built
build_system: cmake
source:
  url: "https://github.com/google/highway/archive/refs/tags/1.3.0.tar.gz"
  sha256: "07b3c1ba2c1096878a85a31a5b9b3757427af963b1141ca904db2f9f4afe0bc2"
build:
  options:
    - "BUILD_SHARED_LIBS=OFF"
    - "with_upstream_tests=True (default; upstream suite runs on device)"
    - "HWY_ENABLE_CONTRIB=ON (always)"
    - "HWY_ENABLE_EXAMPLES=OFF"
    - "HWY_ENABLE_INSTALL=OFF"
    - "HWY_ENABLE_TESTS=ON with upstream tests"
    - "HWY_TEST_STANDALONE=ON with upstream tests"
    - "HWY_FORCE_STATIC_LIBS=ON"
libs:
  - hwy_contrib
requires:
  - highway/1.3.0.2
test_package:
  type: cmake-consumer
  checks: 4
adaptation_paths:
  - A
notes:
  - "Platform task 13240: standalone contrib package for the highway 1.3.0 upstream tree."
  - "Packages only the compiled hwy_contrib library; contrib headers and core libhwy are provided by the highway/1.3.0.2 dependency."
  - "The published highway/1.3.0.2 binary also bundles a contrib library; scope relation is analyzed in notes.md."
