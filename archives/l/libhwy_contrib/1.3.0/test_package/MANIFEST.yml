# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e.

package: libhwy_contrib/1.3.0
homepage: "https://github.com/google/highway"

upstream_check_command: "conan create archives/l/libhwy_contrib/1.3.0"
upstream_test_in_build: true
upstream_test_mode: "default-on: with_upstream_tests=True (disable with -o libhwy_contrib/*:with_upstream_tests=False)"
upstream_test_command: "conan create archives/l/libhwy_contrib/1.3.0"

upstream_tests:
  - file: hwy/tests/
    source: highway-1.3.0/hwy/tests/
    description: "58 core Highway SIMD target/vector test executables, compiled by the same conan create and executed on-device through Highway's standalone GTest-compatible runner (core scope shared with the highway package)."
    command: "ctest --output-on-failure --no-tests=error"
  - file: hwy/contrib/
    source: highway-1.3.0/hwy/contrib/
    description: "16 contrib test executables (algo x3, bit_pack, dot, matvec, image, math, random, sort x3 incl. bench_sort, thread_pool x3, unroller) covering this package's vqsort/image/topology compiled sources and the header-only contrib APIs."
    command: "ctest --output-on-failure --no-tests=error"

test_package_tests:
  - file: test_libhwy_contrib.cpp
    description: "Consumer test sorting int32 keys via the compiled VQSort export in both orders; verifies core dependency include/lib propagation and the hwy::hwy_contrib CMake target. (ThreadPool/topology is covered by the upstream thread_pool/topology tests in the W3 suite.)"
    command: "./test_libhwy_contrib"

assertion_count: 4
