software: latexml
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.8.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.8.8"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统
# cmake | autotools | perl | python | makefile | meson | custom
build_system: perl

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://dlmf.nist.gov/LaTeXML/releases/LaTeXML-0.8.8.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置命令 (Perl Makefile.PL)
  configure_command: perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX NOMKTEXLSR=1

  # 配置选项列表
  configure_options:
    - INSTALL_BASE=$DEFAULT_PREFIX
    - NOMKTEXLSR=1

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl项目使用Makefile.PL而非./configure，需创建hints/configure包装脚本"
  - "HarmonyOS dlopen()拒绝加载非信任路径的XS .so文件(自签名也不行)"
  - "local::lib的PERL_MM_OPT与PREFIX冲突，需unset后使用INSTALL_BASE"