software: luit
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/20250912/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "20250912"

# 构建系统类型
build_system: autotools

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://invisible-mirror.net/archives/luit/luit-20250912.tgz"

  # 源码校验和
