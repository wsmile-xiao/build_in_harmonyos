# Clean-verify hints for luit 20250912
# Handles HMDFS umask 077 incompatibility

configure_command: "TMPDIR=$HOME/tmp /bin/sh ./configure --prefix=$DEFAULT_PREFIX && sed -i 's/umask 077/umask 022/g' config.status && TMPDIR=$HOME/tmp ./config.status"

build_command: "make -j1"

build_system: autotools
