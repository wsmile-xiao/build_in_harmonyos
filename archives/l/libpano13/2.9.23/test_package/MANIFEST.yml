# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libpano13/2.9.23
homepage: "https://panotools.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（cmake/ctest 注册，tests/ 子目录）
# 全部由 tests/panoAutomateTest.pl + tests/panoAutomatePSDtest.pl 驱动，
# 通过 tools/ 下 PTtiff2psd/PTmender 等命令处理 simpleStitch/simpleTiff16/
# simpleTiff2psd 测试图像并与 reference/ 结果比对。
upstream_tests:
  - file: tests/panoAutomateTest.pl
    source: libpano13-2.9.23/tests/panoAutomateTest.pl
    description: "simpleStitch 拼接测试（ctest 注册 simpleStitch）"
    command: "ctest -R simpleStitch"
  - file: tests/panoAutomateTest.pl
    source: libpano13-2.9.23/tests/panoAutomateTest.pl
    description: "simpleTiff16 16bit TIFF 测试（ctest 注册 simpleTiff16-16bit-1-layer / -2-layers）"
    command: "ctest -R simpleTiff16"
  - file: tests/panoAutomatePSDtest.pl
    source: libpano13-2.9.23/tests/panoAutomatePSDtest.pl
    description: "simpleTiff2psd PSD 导出测试（ctest 注册 4 项：1-layer/2-layers/uncropped 变体）"
    command: "ctest -R simpleTiff2psd"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：panoProjectionFormatCount()>0 / queryFOVLimits() rc==1 且视场角>0 / PT_setProgressFcn 回调链路 3 项 API 断言"
    command: "./test_libpano13"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
