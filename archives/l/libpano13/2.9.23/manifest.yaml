# 版本级 manifest — libpano13 2.9.23
# 遵循 ARCHIVE-SPEC v2.0

version: "2.9.23"
software: "libpano13"
status: published
build_date: "2026-09-15"
build_system: "cmake"

source:
  url: "https://sourceforge.net/projects/panotools/files/libpano13/libpano13-2.9.23/libpano13-2.9.23.tar.gz/download"
  sha256: "e7c076d37a14c39434962115e47ddbe18452ca3de5ce40e2aaefa7cf5815ea28"
  tar_format: tar.gz

build:
  configure: "cmake -DCMAKE_TOOLCHAIN_FILE=<ohos.toolchain> -DCMAKE_C_FLAGS=-D__Ansi__ -DSUPPORT_JAVA_PROGRAMS=OFF -DUSE_SPARSE_LEVMAR=OFF"
  make: "cmake --build"
  # 上游 ctest 8/8 在探索编译期执行（见 notes.md/test-report.md）；
  # 配方 build() 未内嵌上游 ctest（MANIFEST.yml upstream_test_in_build=false），
  # 由 test_package 的 3 项 API 断言承担消费者侧验证。
  test: "ctest（探索编译期，8/8 通过）| test_package API 断言 3/3"

dependencies:
  - zlib/1.3.1.1
  - libpng/1.6.58
  - libtiff/4.7.2
  - libjpeg-turbo/3.2.0

patches: []

test_report:
  upstream: "8/8 passed (ctest: simpleStitch, simpleTiff16-16bit-1-layer/2-layers, simpleTiff2psd-1-layer/2-layers/uncropped 变体)"
  local: "test_package 3 项 API 断言（panoProjectionFormatCount/PT_setProgressFcn/queryFOVLimits）"

notes: |
  - 上游 2.9.23 从 autotools 迁移到 CMake 构建（2025-09-10 移除 FIND_PACKAGE(PkgConfig)）
  - 必需依赖 TIFF/JPEG/PNG/ZLIB 全部已发布至 ohpcd 制品仓
  - CMakeLists 的 IF(UNIX) 在 OHOS 上不生效（cmake 不识别 HarmonyOS 平台），
    PTDialogs.c 会走 sys_X11.h 分支需要 GIMP/GTK → 用 -D__Ansi__ 显式切到纯 ANSI 分支
  - 依赖注入用 CMake 内置 find 缓存变量（JPEG_LIBRARY/PNG_LIBRARY/TIFF_LIBRARY/ZLIB_LIBRARY
    + INCLUDE 变量）绕过 FIND_ROOT_PATH_MODE=ONLY 交叉搜索限制
