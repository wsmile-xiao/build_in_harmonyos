# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libflac/1.5.0
homepage: "https://xiph.org/flac/"

# 上游**有**测试套件且随本配方构建执行：BUILD_TESTING=ON 时 CTest 注册
# test_flac / test_metafile / test_grabbag / test_seeking / test_streams
# 及 test_libFLAC(++) 单元测试，由配方 build() 以
# `ctest --output-on-failure -j1` 真实执行（结果见构建日志）。
# **例外（平台差异归因，§8.6）**：test_libFLAC 与 test_libFLAC++ 两个单元
# 测试的元数据迭代器用例依赖 Unix 权限位（chmod 只读后要求写入被拒）——
# 本平台构建目录位于 hmdfs，权限位不被保留（实测 chmod 444 后仍可写），
# 且不存在用户可写的非 hmdfs 路径，该前提无法成立；这两项以 ctest -E
# 排除并如实计入"未执行"，其余 9 项（含 flac 命令行真实编解码往返、
# 随机寻址、流边界）全部执行通过。
upstream_check_command: "ctest --output-on-failure -j1（build 目录）"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - file: src/test_streams
    description: 流编码/解码边界用例
  - file: src/test_libFLAC
    description: libFLAC 单元测试
  - file: src/test_libFLAC++
    description: libFLAC++ 单元测试
  - file: src/test_flac.sh
    description: flac 命令行编码/解码往返
  - file: src/test_metafile.sh
    description: 元数据读写
  - file: src/test_seeking
    description: 随机寻址定位
  - file: src/test_grabbag
    description: grabbag 工具面

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_flac_consumer.c
    description: >-
      消费者功能测试：stream encoder 编码 8192 帧立体声伪随机 PCM 到 FLAC
      文件，stream decoder 解码回读，要求**逐位一致**（无损往返）；TAP 风格
      输出，失败即非零退出。
