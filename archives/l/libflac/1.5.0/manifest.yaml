# 版本级 manifest —— libflac 1.5.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.5.0"
software: libflac

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://github.com/xiph/flac/archive/refs/tags/1.5.0.tar.gz"
  sha256: "aea54ed186ad07a34750399cb27fc216a2b62d0ffcd6dc2e3064a3518c3146f8"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS 按 Conan shared 选项映射"
    - "BUILD_CXXLIBS=ON（libFLAC++ 一并交付）；BUILD_PROGRAMS=ON（上游 ctest 套件驱动 flac 二进制）"
    - "BUILD_TESTING=ON + ctest --output-on-failure -j1 真实执行上游套件"
    - "BUILD_EXAMPLES=OFF；BUILD_DOCS=OFF（doxygen）；INSTALL_MANPAGES=OFF"
    - "WITH_OGG=OFF（移除 Ogg::ogg 依赖；flac 原生格式不需要）"
    - "构建环境显式清空 LD_LIBRARY_PATH（部分 CI worker 的 ambient 指向不兼容 libxml2，会破坏 SDK lld——同 libodfgen/libabw）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "xiph/flac 1.5.0 的 WITH_OGG=OFF 分支完全移除 Ogg::ogg 查找；ENABLE_MULTITHREADING 走 pthread（musl libc 内置）"
  - "上游 ctest 套件驱动 flac 二进制做真实编解码往返，是比单测更强的门禁——BUILD_PROGRAMS 必须开"
  - "CMake find_package(Iconv) 在 OHOS musl 下直接命中 libc 内置 iconv，无需额外包"
