# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: lttng-ust/2.15.1
homepage: "https://lttng.org/"

# 上游测试（tests/ 单元测试需要完整 tracer 会话/内核场景）——
# 本 PR 构建库本体，test_package 用 tracef 消费者探针验证
upstream_check_command: "echo \"upstream ust tests need full tracer session/kernel scenario\""

# conanfile.py build() 中未运行上游测试（tracer 场景受限）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_lttng_ust.c
    description: "消费者探针：tracef() 调用，验证 liblttng-ust 链接 + 不崩溃"
    command: "clang test_lttng_ust.c -o probe -llttng-ust -lurcu -ldl -lpthread && ./probe"

# 断言总数（test_package 1 个断言）
assertion_count: 1
