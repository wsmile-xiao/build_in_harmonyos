software: libgtop
version: "2.41.3"
status: built
build_date: "2026-09-09"
build_system: autotools

source:
  url: "https://download.gnome.org/sources/libgtop/2.41/libgtop-2.41.3.tar.xz"
  sha256: "775676df958e2ea2452f7568f28b2ea581063d312773dd5c0b7624c1b9b2da8c"
  tar_format: tar.xz

build:
  system: autotools
  cc: clang
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"

patches_applied:
  - "0001-configure-umask-022.patch: Use umask 022 for config.status tmp dir (setgid hmdfs makes umask 077 dirs unwritable)"
  - "0002-mountlist-proc-self-mounts.patch: Fall back to /proc/self/mounts when /etc/mtab is absent (OHOS/containers have no mtab)"

dependencies:
  - "glib/2.84.0.1"

upstream_tests:
  command: "make check"
  test_count: 0
  notes: "libgtop 2.41.3 官方源码无独立测试套件；examples/ 19 个 noinst_PROGRAMS 示例作为 API 自检程序编译运行（见 notes.md 台账）。"

test_package:
  assertion_count: 9
  description: "消费者测试（CPU/mem/uptime 非零）+ HarmonyOS 专项测试（proclist/proc_state/sysinfo/netlist/mountlist，5 断言）"