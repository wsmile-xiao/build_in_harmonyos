software: libpfm4
display: "libpfm4 (perfmon2)"
description: "Linux/HarmonyOS perf_events 硬件性能计数器编程接口库（perfmon2 用户态库）：枚举 PMU 与事件、生成 perf_event_attr 编码"
category: monitor
homepage: "https://github.com/wcohen/libpfm4"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 工程（无 configure / CMake），推荐参数：SYS=Linux ARCH=aarch64 NOPYTHON=y CONFIG_PFMLIB_SHARED=n"
    - "uname -s 在鸿蒙返回 HarmonyOS，必须显式传 SYS=Linux，否则 lib/Makefile 的 ifeq ($(SYS),Linux) 守卫会静默漏编 perf_events PMU 的三个源文件（构建成功但功能缺失）"
    - "ABI 常量原以 glibc 专属 __WORDSIZE 判定，musl 系 OHOS sysroot 无 <bits/wordsize.h>，公共头 ABI 大小会退化为 32 位；补丁改为 __LP64__/_LP64/__SIZEOF_POINTER__ 可移植判定"
    - "上游 tests/validate 在 build() 内执行（链接静态 libpfm.a），把上游测试变成 CI 门禁"
    - "python/ SWIG 绑定不构建（NOPYTHON=y）；perf_examples 因 musl sys/poll.h 重定向 + -Werror 不纳入构建"
    - "编译器从 Conan conf 获取 (R33)"
  common_dependencies: []
  error_patterns:
    - "E580: musl sysroot 无 <bits/wordsize.h> → __WORDSIZE 未定义 → ABI 常量退化 32 位"
    - "E581: uname -s 返回 HarmonyOS → ifeq ($(SYS),Linux) 守卫静默漏编源文件"

versions:
  "4.13.0-git106-g3e4031b":
    status: built
    build_date: "2026-09-16"
