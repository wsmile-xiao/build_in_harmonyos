# ============================================================
# 构建配置
# ============================================================

build:
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # libpfm4 是纯 Makefile 工程（无 configure、无 CMake），参数直接传给 make
  configure_options:
    - "SYS=Linux"       # 内核接口与 Linux 相同；uname -s 在鸿蒙返回 HarmonyOS，会静默漏编 perf_events PMU 源文件
    - "ARCH=aarch64"    # 选中 config.mk 的 CONFIG_PFMLIB_ARCH_ARM64
    - "NOPYTHON=y"      # 跳过 python/SWIG 子工程（工具链无 SWIG）
    - "CONFIG_PFMLIB_SHARED=n"   # 静态库，避免与系统同名库冲突（R26）

  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 应用的补丁列表
patches_applied:
  - "0001-include-perfmon-pfmlib.h.patch"
  - "0002-include-perfmon-pfmlib_perf_event.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

# knowledge_gained 条目必须带 ref:（W5 检查 unreferenced=0）
knowledge_gained:
  - "musl 系 sysroot（OHOS）无 <bits/wordsize.h>：__WORDSIZE 未定义会让 glibc 专属守卫的公共 ABI 常量退回 32 位，而结构体仍按 64 位填充，公共头契约与真实布局不一致；改用 __LP64__/_LP64/__SIZEOF_POINTER__ 可移植判定即可（ref: E580）"
  - "Makefile 的 SYS := $(shell uname -s) 在鸿蒙得到 HarmonyOS，ifeq ($(SYS),Linux) 守卫会静默漏编内核相关源文件（libpfm4 的 perf_events PMU 三个源文件），构建成功但功能整块缺失；构建期显式传 SYS=Linux 即可（ref: E581）"
  - "libpfm4 属纯 Makefile 工程：最小参数集 SYS=Linux + ARCH=aarch64 + NOPYTHON=y；tests/Makefile 的 validate 始终链接静态 libpfm.a，可直接在 conanfile build() 内执行上游测试套件（ref: E581）"

