# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libpfm4/4.13.0-git106-g3e4031b
homepage: "https://perfmon2.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C tests && ./tests/validate"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C tests && ./tests/validate"

# 上游实际运行的测试程序
# tests/Makefile 的 TARGETS 只有一个测试程序，它逐张校验事件表
upstream_tests:
  - file: validate.c
    source: libpfm4-3e4031b/tests/validate.c
    description: "上游事件表校验套件：枚举每个 PMU 的事件与属性，比对 libpfm4 内部表与架构表（Libpfm structure / perf_events / internal table / architecture specific 四段，82 个 PMU 表项）"
    command: "./tests/validate"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：公共 API（pfm_initialize / PMU 枚举 / 事件查找 / 原始编码 / perf_event 编码）"
    command: "./test_api"
  - file: test_upstream_validate.c
    description: "上游校验套件（tests/validate.c）针对已安装包重跑：80 张事件表逐项校验"
    command: "./test_upstream_validate"
  - file: test_ohos.c
    description: "鸿蒙专项：64 位 ABI 常量 == sizeof 结构体、perf_events PMU 已编入且通用事件可编码"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
# 9 (test.c) + 80 (上游表校验) + 9 (鸿蒙专项)
assertion_count: 98
