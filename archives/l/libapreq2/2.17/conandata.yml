    sha256: "046487f084c12fa1c822affc5f7de56efed9b48905a426e631a6b949c114d86c"
  # apr-util has no conan recipe in ohpcd (archives/a/apr-util/1.6.3 ships
  # only manifest/notes/patches), so it is built privately from official
  # sources (see conanfile _build_apr_util) instead of being required.
  # sha256 verified against archive.apache.org apr-util-1.6.3.tar.gz.sha256
  # (serf/1.3.10 precedent, same upstream version 1.6.3).
  # NOTE (2026-09-25 preflight): libapreq2 is retired (only Apache Archive
  # carries it) and apr-util-1.6.3 is superseded by 1.6.5 on dlcdn mirrors,
  # so the tuna/aliyun/ustc apache mirrors 404 for both archives. Keep only
  # official Apache URLs (archive proven reachable on-device); same sha256.
  apr-util:
    url:
      - "https://archive.apache.org/dist/apr/apr-util-1.6.3.tar.gz"
      - "https://downloads.apache.org/apr/apr-util-1.6.3.tar.gz"
      - "https://dlcdn.apache.org/apr/apr-util-1.6.3.tar.gz"
    sha256: "2b74d8932703826862ca305b094eef2983c27b39d5c9414442e9976a9acf1983"
