package: libapreq2/2.17
homepage: "https://httpd.apache.org/apreq/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: library/t/version.c
    source: libapreq2-2.17/library/t/version.c
    description: "Version API check (version_string + version_type, 6 assertions)"
    command: "./version"
  - file: library/t/cookie.c
    source: libapreq2-2.17/library/t/cookie.c
    description: "Cookie parse and jar tests (jar_make + jar_get + netscape/rfc, 43 assertions)"
    command: "./cookie"
  - file: library/t/params.c
    source: libapreq2-2.17/library/t/params.c
    description: "Request parameter table tests"
    command: "./params"
  - file: library/t/parsers.c
    source: libapreq2-2.17/library/t/parsers.c
    description: "URL-encoded/header/multipart parser tests"
    command: "./parsers"
  - file: library/t/error.c
    source: libapreq2-2.17/library/t/error.c
    description: "Error code and message tests"
    command: "./error"
  - file: library/t/util.c
    source: libapreq2-2.17/library/t/util.c
    description: "Utility function tests"
    command: "./util"

test_package_tests:
  - file: test_apreq2.c
    description: "Consumer test: apreq_version_string check plus cookie header parse check"
    command: "./test_apreq2"

assertion_count: 8
upstream_test_total: 11
upstream_test_count_method: "autotools_tests"
upstream_tests_exist: true
upstream_test_audit: "library/t/Makefile.am declares check_PROGRAMS = version cookie params parsers error util (6 TESTS via automake, each a C binary wrapped by a .t TAP script run with perl Test::Harness in `make test`); module/t holds 5 perl files (big_request, cgi, cookie, request, upload) driven over HTTP by t/TEST via Apache::Test against the upstream module/test_cgi CGI binary (module/Makefile.am run_tests copies test_cgi to t/cgi-bin). Total 11. Library 6 run via make check/make test plus direct-TAP fallback (hmbs-direct-tap.log, no perl needed); module 5 run via the exact upstream test_cgi binary invoked directly with CGI env + bodies taken from the 5 .t assertions (hmbs-module-cgi.log, one CASE line per .t; perl Apache::Test probe attempted first, HTTP driver needs live httpd which has no OHOS recipe)."
