# 版本级 manifest — libapreq2 2.17

version: "2.17"
software: "libapreq2"

status: built
build_date: "2026-09-24"
build_system: autotools

source:
  url: "https://archive.apache.org/dist/httpd/libapreq/libapreq2-2.17.tar.gz"
  sha256: "046487f084c12fa1c822affc5f7de56efed9b48905a426e631a6b949c114d86c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-perl-glue"
    - "--with-apache2-apxs=<fake apxs wrapper pointing at private apr-util>"
    - "--with-apr-config=<apr/1.7.6 apr-1-config>"
    - "--with-apu-config=<private apr-util prefix bin/apu-1-config>"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - "apr/1.7.6"
    - "expat/2.8.2"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libapreq2 configure 强制要求 apache2 apxs + httpd 二进制 + apr-config + apu-config，OHOS 无 httpd 配方时用构建目录假 apxs/httpd 包装满足版本探测，只构建 library（含 CGI/custom 模块），跳过 perl glue"
  - "apr-util/1.6.3 仓内无 conan 配方时沿用 serf/1.3.10 私有静态子构建：官方双源 + 已验证 sha256，Python 复刻 E007/E072/E011，显式 --build/--host 绕过旧 config.guess，产物 libaprutil-1.a 合入本包"
