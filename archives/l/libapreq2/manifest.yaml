software: libapreq2
display: "libapreq2"
description: "Apache HTTP Server Request Library for parsing HTTP cookies and POST data"
category: library
homepage: "https://httpd.apache.org/apreq/"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools：显式 --build/--host 为 gnu 三元组绕过旧 config.guess（原生 build==host）"
    - "上游 configure 强制要求 apxs + httpd，OHOS 无 httpd 配方时用构建目录假 apxs/httpd 包装满足版本探测"
    - "apr-util/1.6.3 仓内无配方时私有静态子构建并合入 libaprutil-1.a（serf/1.3.10 同款模式）"

versions:
  "2.17":
    status: built
    build_date: "2026-09-24"
    packaging: conan
    notes: |
      首个 OHOS 适配版本。只构建 library（含 CGI/custom 环境模块），关闭 perl glue；
      上游 library/t 6 项经 make check 执行，module/t 5 项需 live httpd，作为 ohos_feature 缺口声明。
    provides:
      - libapreq2.so
      - libapreq2.a
      - bin/apreq2-config
