# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HarmonyOS cmake不设置UNIX变量，需添加CMAKE_SYSTEM_NAME=Linux条件使平台检测落入unix.cmake"
  - "HarmonyOS缺少libatomic库，aarch64的atomic操作由clang内建支持，需用find_library条件检测后再链接"
  - "HarmonyOS缺少pthread_cancel，用__OHOS__守卫替换为pthread_kill（同Android方案），需添加<signal.h>头文件"
  - "clang C99模式禁止case标签后直接声明变量，需用花括号包裹switch/case中的变量声明块"

