# conandata.yml — libplctag 2.6.5
# Official GitHub release tarball. CI's mirror fallback rewrites this single
# URL into a mirror list at build time; the repo keeps the official HTTPS URL.

sources:
  url: "https://github.com/libplctag/libplctag/archive/refs/tags/v2.6.5.tar.gz"
  sha256: "0f2983e024c9ca8dd7e956258f0b99d64cc8c37aa0cf3eb75350e1edca00841f"

patches:
  - patch_file: "patches/0001-src-platform-posix-platform.c.patch"
    patch_description: "HarmonyOS musl libc lacks POSIX pthread_cancel; mirror the existing __ANDROID__ thread_kill behavior (pthread_kill) under __OHOS__"
    patch_type: "portability"
  - patch_file: "patches/0002-src-tests-hashtable-test_hashtable.c.patch"
    patch_description: "Fix stale relative include paths (lib/ -> libplctag/lib, util/ -> utils/) in the upstream unregistered hashtable unit test so it can be compiled for the test ledger"
    patch_type: "portability"