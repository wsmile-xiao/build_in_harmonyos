# test_package/MANIFEST.yml

package: libplctag/2.6.5
homepage: "https://github.com/libplctag/libplctag"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "src/tests/run_tests.sh"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/CMakeLists.txt
    source: libplctag-2.6.5/src/tests/CMakeLists.txt
    description: "上游测试二进制构建注册 (ab_server/hashtable)；运行依赖本地 PLC 模拟服务器，未在 conan create 中执行"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：plc_tag_check_lib_version + plc_tag_create + plc_tag_destroy 头/库链接与运行时行为"
    command: "./test_libplctag"
  - file: ohos_test.c
    description: "HarmonyOS 专项测试：版本契约 + 5 轮 tag 生命周期 create/status/destroy + 错误解码（离线网关预期 PLCTAG_ERR_CREATE），覆盖 OHOS pthread 补丁路径"
    command: "./ohos_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2

# R51 双口径台账摘要（完整台账在归档 reports/test-ledger.md，含逐项枚举与映射；R03 更新）
ledger_summary:
  source_declared_total: 22
  configured_executable_total: 21
  executed_passed_total: 16
  failed: 6
  not_run_uninstantiated: 0
  full_pass_rate: "16/22 (72.7%)"
  executed_set_pass_rate: "16/21 (76.2%)"