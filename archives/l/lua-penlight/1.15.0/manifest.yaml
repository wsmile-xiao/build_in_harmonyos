software: lua-penlight
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.15.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.15.0"

# 构建系统类型（顶层字段，供验证脚本使用）
# cmake | autotools | makefile | meson | custom | lua
build_system: lua

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lunarmodules/Penlight/archive/refs/tags/1.15.0.tar.gz"

  # 源码校验和
  sha256: "b7a2c3e65799a649d29e9927a337f99cca2a5fc46367a0ce101435be74e53b39"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | lua
  system: lua

  # 配置选项列表
  configure_options: []
  # 纯 Lua 库，无需 configure

  # 编译依赖列表（格式: name/version）
  dependencies:
    - luafilesystem  # pl.path 和 pl.dir 模块需要 lfs

  # 编译器
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
