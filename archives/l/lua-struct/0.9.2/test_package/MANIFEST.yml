test_package:
  type: consumer
  language: c
  requires:
    - lua-struct/0.9.2
    - lua/5.4.8.1
  entrypoint: test_lua_struct.c
  checks:
    - require struct module through LUA_PATH
    - pack/unpack round-trip for I/h/B types
    - pack/unpack string type
    - big-endian pack/unpack
    - float and long pack/unpack
