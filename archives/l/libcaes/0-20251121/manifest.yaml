version: "0-20251121"
software: "libcaes"
status: built
build_date: "2026-09-23"
build_system: "autotools"
conan_ref: "libcaes/0-20251121"

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/ubuntu/pool/universe/libc/libcaes/libcaes_0~20251121.orig.tar.gz"
  sha256: "4e597ebc143f2c1063785ccc1e491f1fc51c27413802f0d32644d260bf3c835c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-python"
    - "--disable-nls"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libcaes 0-20251121 用 Ubuntu orig dist 包（make dist 产物，自带 configure/Makefile.in/ltmain.sh 与 libcerror 子树），源码与 GitHub 提交 4dbdd25 逐字节一致，彻底去掉 synclibs.sh 与 autoreconf 自举"
  - "零 tool_requires 即零 m4 跨编译：m4/1.4.19 为 OHOS 构建时重执行 profile 的 CONFIG_SHELL=/data/service/hnp/bin/bash，在 HMBS 真机不可执行（Error 127）；配方层 env 覆盖救不了依赖包构建，只能连根去掉自举链（bwm/0.6.3 先例）"
  - "自身 configure 用 _force_posix_shell 文件内硬赋值 CONFIG_SHELL/SHELL=/bin/sh + build-scope env 脚本双保险，不依赖环境层叠顺序"
  - "上游 tests/Makefile.am 定义 7 个 check_PROGRAMS + TESTS=test_library.sh，make check 为唯一上游测试入口"
  - "test_package 用 libcaes_get_version/context 初始化释放/ECB-CBC-XTS 加解密往返等真实 API，共 1 个完整消费者端到端用例含 9 项检查（新增文件级 AES-128-CBC 写文件→加密落盘→解密还原→比对全流程）"
