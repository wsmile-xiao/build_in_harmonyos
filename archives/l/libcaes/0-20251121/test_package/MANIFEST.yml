# test_package/MANIFEST.yml — libcaes 0-20251121
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libcaes/0-20251121
homepage: "https://github.com/libyal/libcaes"

# 上游测试命令: tests/Makefile.am 注册的 automake 测试套件
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试, 并输出 HMBS_UPSTREAM_TEST_RESULT
upstream_test_in_build: true
upstream_test_command: "make check TESTS= build + direct run of 7 caes_test_* binaries (dist tarball, no input fixtures; python bindings disabled)"

# 上游测试套件审计结论 (dist 包，源码与 commit 4dbdd25 逐字节一致，见 notes.md):
# tests/Makefile.am 定义 7 个 check_PROGRAMS (caes_test_context /
# caes_test_crypt_cbc / caes_test_crypt_ccm / caes_test_crypt_xts /
# caes_test_error / caes_test_support / caes_test_tweaked_context) 与
# TESTS=test_library.sh (+ test_python_module.sh 仅 HAVE_PYTHON_TESTS 条件
# 分支)。配方以 --disable-python 构建, 故 TESTS 恒为单驱动
# test_library.sh；build() 经 make check TESTS= 构建全部 7 个二进制后逐个
# 直接执行 (与驱动的无输入断言相同, 零 SKIP)。
upstream_tests_exist: true
upstream_test_total: 7
upstream_test_count_method: "autotools_tests"
upstream_test_audit:
  - path: "tests/Makefile.am (check_PROGRAMS)"
    finding: "定义 7 个 caes_test_* C 单元测试程序 (context / crypt_cbc / crypt_ccm / crypt_xts / error / support / tweaked_context)，每个直连 ../libcaes/libcaes.la 做白盒验证"
  - path: "tests/Makefile.am (TESTS)"
    finding: "默认注册 1 个 shell 驱动 test_library.sh；test_python_module.sh 仅 HAVE_PYTHON_TESTS 条件分支才注册，配方 --disable-python 故默认不启用"
  - path: "tests/test_library.sh"
    finding: "LIBRARY_TESTS=context error support tweaked_context，按顺序执行 4 个二进制并汇总；crypt_cbc/crypt_ccm/crypt_xts 三个二进制已构建但不在驱动列表内，故配方改为 7 个二进制全量直跑以覆盖全部"
  - path: "tests/data"
    finding: "dist 包不含 tests/data 目录（快照内 4 个 crypt_*.1 仅 17 字节向量副本，测试 .c 用内置向量）；全部 7 个二进制无需外部固件即可执行"
  - path: "tests/pycaes_test_*.py"
    finding: "Python 绑定测试（crypt_cbc/ccm/ecb/xts + context/support），需 pycaes 模块构建；配方禁用 python，按缺失组件之外的构建配置处理，不计入本次发现数"

upstream_tests:
  - file: caes_test_context.c
    source: libcaes-20251121.orig.tar.gz/tests/caes_test_context.c
    description: "AES 上下文单元测试"
    command: "./caes_test_context (直接执行)"
  - file: caes_test_crypt_cbc.c
    source: libcaes-20251121.orig.tar.gz/tests/caes_test_crypt_cbc.c
    description: "AES-CBC 加解密单元测试"
    command: "./caes_test_crypt_cbc (直接执行)"
  - file: caes_test_crypt_ccm.c
    source: libcaes-20251121.orig.tar.gz/tests/caes_test_crypt_ccm.c
    description: "AES-CCM 加解密单元测试"
    command: "./caes_test_crypt_ccm (直接执行)"
  - file: caes_test_crypt_xts.c
    source: libcaes-20251121.orig.tar.gz/tests/caes_test_crypt_xts.c
    description: "AES-XTS 加解密单元测试"
    command: "./caes_test_crypt_xts (直接执行)"
  - file: caes_test_error.c
    source: libcaes-20251121.orig.tar.gz/tests/caes_test_error.c
    description: "错误对象单元测试"
    command: "./caes_test_error (直接执行)"
  - file: caes_test_support.c
    source: libcaes-20251121.orig.tar.gz/tests/caes_test_support.c
    description: "支撑函数单元测试"
    command: "./caes_test_support (直接执行)"
  - file: caes_test_tweaked_context.c
    source: libcaes-20251121.orig.tar.gz/tests/caes_test_tweaked_context.c
    description: "Tweak 上下文单元测试"
    command: "./caes_test_tweaked_context (直接执行)"
  - file: test_library.sh
    source: libcaes-20251121.orig.tar.gz/tests/test_library.sh
    description: "库测试总驱动 (顺序执行 context/error/support/tweaked_context)"
    command: "make check 执行 test_library.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libcaes.c
    description: "完整消费者用例(1 个端到端用例含 9 项检查): 真实调用 libcaes 公共 API——版本查询/上下文创建释放/密钥设置/ECB-CBC-XTS 加解密往返 + 文件级 AES-128-CBC 端到端流程(写明文文件→加密落盘→解密还原→字节比对, 64 字节多块验证 CBC 链)"
    command: "ctest --output-on-failure (运行 test_libcaes)"

# 测试断言总数 (test_package 1 个端到端消费者用例含 9 项检查; 上游 7 个 caes_test_* 单元由 build() 直接执行)
assertion_count: 9
