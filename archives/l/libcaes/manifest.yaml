software: libcaes
display: "libcaes — Cross-platform AES Encryption Library"
description: "跨平台 AES 加密的 C 函数库，支持 ECB/CBC/CCM/XTS 模式"
category: crypto
homepage: "https://github.com/libyal/libcaes"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GNU config.guess 不识别 HarmonyOS，需内联添加 HarmonyOS 检测分支 (E007)"
    - "config.sub 需添加 ohos-linux/ohos* OS 模式支持 (E007)"
    - "configure/config.status 的 umask 077 改为 022，兼容 HMDFS 权限限制 (E011)"
    - "dist 包自带 configure 与 libcerror 子树，零 tool_requires 即可构建，避免 m4 跨编译链"
    - "静态构建: --enable-static --disable-shared; 关闭 python 绑定与 NLS"
  common_dependencies: []

versions:
  "0-20251121":
    status: built
    build_date: "2026-09-23"
    conan_ref: "libcaes/0-20251121"
