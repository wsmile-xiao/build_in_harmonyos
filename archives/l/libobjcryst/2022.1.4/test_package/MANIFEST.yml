package: libobjcryst/2022.1.4
homepage: "https://github.com/diffpy/libobjcryst"

upstream_check_command: "./upstream_example (examples/testlib.cpp: fcc-create + cif-parse)"
upstream_test_in_build: true
upstream_test_command: "./upstream_example (examples/testlib.cpp: fcc-create + cif-parse)"
upstream_tests_exist: true
upstream_test_audit: "Audited tag v2022.1.4 file listing via GitHub API 2026-09-18: top level has SConstruct/src/examples/site_scons/conda-recipe only; no tests/ dir, no CTestTestfile, no CMakeLists, no `make check` target. src/ObjCryst/ObjCryst/test.cpp+test.h are library TUs (matched by src/SConscript.objcryst glob), not a runner. src/newmat/test_exc.cpp is a vendored-newmat standalone check excluded from the lib TU list in src/SConscript.newmat. README designates examples/testlib.cpp (FCC crystal + COD 4316154 CIF parse, ending in 'Installation of ObjCryst shared library works!') as the installation verification ('To verify libobjcryst installation, compile and run the included test code examples/testlib.cpp'). Synthetic upstream scope: build() compiles a corrected copy (degree->radian + hexagonal 90/90/120 angles) against the fresh lib and runs ./upstream_example as 2 checks (fcc-create, cif-parse); counts come from the real binary output (non-empty + CIF stage evidence + trailing works! line), any missing evidence fails the build."

test_package_tests:
  - file: test.cpp
    description: "FCC lattice/spacegroup + CIF crystal creation + version macros (3 checks)"
    command: "./test_libobjcryst"

assertion_count: 7
