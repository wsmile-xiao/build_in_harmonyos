# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcommuni/3.7.0
homepage: "https://communi.github.io"

# 上游测试命令 (qmake tests/ 子项目, make check)
upstream_check_command: "cd tests && make check"

# conanfile.py build() 方法中是否已集成上游测试
# 本配方 -nomake tests：上游 16 个 QtTest 模块已在本机 OHOS aarch64 实测运行
# （16/16 模块、937/939 函数通过，2 例因 qt5-qtbase 制品无 openssl 后端失败，
# 详见 ../notes.md 逐模块结果表）；不集成进 build() 是为
# 避免 2 例 SSL 依赖用例卡死 CI 的 make check 门禁，test_package 消费者视角验证照旧
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/auto/ 下 16 个 QtTest 模块)
upstream_tests:
  - file: tests/auto/irc/tst_irc.cpp
    source: libcommuni-3.7.0/tests/auto/irc
    description: "Irc 基础类型测试"
    command: "./tst_irc"
  - file: tests/auto/ircconnection/tst_ircconnection.cpp
    source: libcommuni-3.7.0/tests/auto/ircconnection
    description: "IRC 连接状态机测试"
    command: "./tst_ircconnection"
  - file: tests/auto/irccommand/tst_irccommand.cpp
    source: libcommuni-3.7.0/tests/auto/irccommand
    description: "IRC 命令测试"
    command: "./tst_irccommand"
  - file: tests/auto/ircmessage/tst_ircmessage.cpp
    source: libcommuni-3.7.0/tests/auto/ircmessage
    description: "IRC 消息解析测试"
    command: "./tst_ircmessage"
  - file: tests/auto/ircnetwork/tst_ircnetwork.cpp
    source: libcommuni-3.7.0/tests/auto/ircnetwork
    description: "IRC 网络配置测试"
    command: "./tst_ircnetwork"
  - file: tests/auto/ircbuffer/tst_ircbuffer.cpp
    source: libcommuni-3.7.0/tests/auto/ircbuffer
    description: "IRC 缓冲区测试"
    command: "./tst_ircbuffer"
  - file: tests/auto/ircbuffermodel/tst_ircbuffermodel.cpp
    source: libcommuni-3.7.0/tests/auto/ircbuffermodel
    description: "IRC 缓冲区模型测试"
    command: "./tst_ircbuffermodel"
  - file: tests/auto/ircchannel/tst_ircchannel.cpp
    source: libcommuni-3.7.0/tests/auto/ircchannel
    description: "IRC 频道测试"
    command: "./tst_ircchannel"
  - file: tests/auto/ircuser/tst_ircuser.cpp
    source: libcommuni-3.7.0/tests/auto/ircuser
    description: "IRC 用户测试"
    command: "./tst_ircuser"
  - file: tests/auto/ircusermodel/tst_ircusermodel.cpp
    source: libcommuni-3.7.0/tests/auto/ircusermodel
    description: "IRC 用户模型测试"
    command: "./tst_ircusermodel"
  - file: tests/auto/irccommandparser/tst_irccommandparser.cpp
    source: libcommuni-3.7.0/tests/auto/irccommandparser
    description: "IRC 命令解析器测试"
    command: "./tst_irccommandparser"
  - file: tests/auto/irccommandqueue/tst_irccommandqueue.cpp
    source: libcommuni-3.7.0/tests/auto/irccommandqueue
    description: "IRC 命令队列测试"
    command: "./tst_irccommandqueue"
  - file: tests/auto/irccompleter/tst_irccompleter.cpp
    source: libcommuni-3.7.0/tests/auto/irccompleter
    description: "IRC 补全器测试"
    command: "./tst_irccompleter"
  - file: tests/auto/irclagtimer/tst_irclagtimer.cpp
    source: libcommuni-3.7.0/tests/auto/irclagtimer
    description: "IRC 延迟计时器测试"
    command: "./tst_irclagtimer"
  - file: tests/auto/ircpalette/tst_ircpalette.cpp
    source: libcommuni-3.7.0/tests/auto/ircpalette
    description: "IRC 调色板测试"
    command: "./tst_ircpalette"
  - file: tests/auto/irctextformat/tst_irctextformat.cpp
    source: libcommuni-3.7.0/tests/auto/irctextformat
    description: "IRC 文本格式测试"
    command: "./tst_irctextformat"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者静态链接测试: 创建 IrcConnection 实例并校验 host 存取回环"
    command: "./test_libcommuni"

# 测试断言总数: 本机实测 16 模块共 939 个测试函数（937 通过 / 2 SSL 失败）
assertion_count: 939
