# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 4 对 cmake_minimum_required<3.5 直接 FATAL：老项目(2.8.x)需补丁提版本；其自带的第三方 cmake 模块（如 cmake-cxx11）里也各有一处要一起改"
  - "musl/OHOS 的 iconv 在 libc 内且编码表有限（无 UTF-7/Modified-UTF-7）：上游自定义 FindIconv 的 FIND_LIBRARY(iconv libiconv c) 找不到独立库时 FATAL，需换成 libc 内置探测并保留 const 参数编译检查自适应"
  - "conan 2 的 CMakeDeps 不为 tool_requires 生成 CMake config：CppUnit 走标准 FIND_PATH/FIND_LIBRARY 即可命中 conan 包（CMakeToolchain 注入 prefix path），无需 GTest_DIR 式 hack"
  - "上游 tests 段链接目标写死共享库名：静态-only 构建需补丁按 VMIME_BUILD_SHARED_LIBRARY 自适应选择 <name> 或 <name>-static（含 TARGET_LINK_LIBRARIES 与 ADD_DEPENDENCIES 全部出现点）"
  - "OHOS 设备 /tmp 只读：上游测试向 /tmp 写临时文件时 filesystem_exception；补丁改用 TMPDIR 环境变量兜底，conan build() 中 os.environ 设置 TMPDIR 后 cmake.test() 可传递"
  - "老 CMake 项目探测失败会把 NOTFOUND 变量泄漏进 CMAKE_REQUIRED_LIBRARIES 污染后续 try_compile（gnutls→getaddrinfo_a 探测连锁失败），探测后必须显式清空"

