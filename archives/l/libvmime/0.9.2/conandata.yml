# conandata.yml — libvmime 0.9.2

sources:
  url:
    - "https://gh-proxy.com/https://github.com/kisli/vmime/archive/refs/tags/v0.9.2.tar.gz"
    - "https://github.com/kisli/vmime/archive/refs/tags/v0.9.2.tar.gz"
  sha256: "9874bf911a7dbc257297ab00f7541875da221ee8251a4218cc65abff6e362399"

patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "CMake 4 compatibility (minimum 3.10), clean CMAKE_REQUIRED_LIBRARIES leakage from failed GNUTLS/anl probes, pthread-in-libc fallback for musl, and tests link target adaptation for static-only builds"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-cmake-FindIconv.cmake.patch"
    patch_description: "OHOS/musl provides iconv inside libc (no standalone libiconv); replace the finder with a libc-based probe keeping the const-argument compile check"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-cmake-cmake-cxx11-Modules-CheckCXX11Features.cmake.patch"
    patch_description: "Raise bundled cmake-cxx11 helper minimum version to 3.10 for CMake 4 compatibility"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-src-vmime-encoding.cpp.patch"
    patch_description: "Replace std::bind2nd (removed in C++17) with a lambda in the QP encoding helper"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0005-src-vmime-platforms-posix-posixSocket.cpp.patch"
    patch_description: "Select the XSI-compliant strerror_r() branch on musl/OHOS (GNU variant is glibc-only)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0006-tests-net-maildir-maildirStoreTest.cpp.patch"
    patch_description: "Write test maildir trees under TMPDIR (falling back to /tmp) because /tmp is read-only on the OHOS device"
    patch_type: "test-environment"
    strip: 1
  - patch_file: "patches/0007-tests-parser-fileContentHandlerTest.cpp.patch"
    patch_description: "Write test temporary data under TMPDIR (falling back to /tmp) because /tmp is read-only on the OHOS device"
    patch_type: "test-environment"
    strip: 1
