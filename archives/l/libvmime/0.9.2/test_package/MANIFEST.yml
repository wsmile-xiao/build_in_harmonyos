# test_package/MANIFEST.yml — libvmime 0.9.2
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求）

package: libvmime/0.9.2
homepage: "https://github.com/kisli/vmime"

# 上游测试命令：CMake VMIME_BUILD_TESTS=ON 生成 run-tests 与逐目录测试可执行
# （CppUnit 框架，ADD_TEST 注册），经补丁修复探测泄漏后由 ctest 驱动
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.test()（ctest 驱动 tests/ 下全部 CPPUNIT 测试可执行）"

# 上游实际运行的测试程序（tests/ 共 58 个 *Test.cpp，按目录归类）
upstream_tests:
  - file: tests/parser/
    source: libvmime-0.9.2/tests/parser/
    description: "MIME 解析器用例（bodyPart/body/charset/attachment 等，VMIME_TEST 注册）"
    command: "ctest"
  - file: tests/net/
    source: libvmime-0.9.2/tests/net/
    description: "网络层用例（mailer/SMTP/POP3/IMAP 会话语义）"
    command: "ctest"
  - file: tests/security/
    source: libvmime-0.9.2/tests/security/
    description: "安全层用例（证书/DIGEST-MD5 等）"
    command: "ctest"
  - file: tests/utility/
    source: libvmime-0.9.2/tests/utility/
    description: "工具层用例（path/datetime/stringUtils/parser 等）"
    command: "ctest"
  - file: tests/misc/
    source: libvmime-0.9.2/tests/misc/
    description: "杂项用例"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libvmime.cpp
    description: "消费者测试：以库使用者身份构造 messageBuilder，设置 From/Recipient/Subject 后 generate() 出 RFC 822 文本，断言 From 与 Subject 头真实存在"
    command: "./test_libvmime"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 453
