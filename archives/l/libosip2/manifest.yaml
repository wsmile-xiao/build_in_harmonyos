software: libosip2
display: "oSIP Library"
description: "oSIP库是一个开源的SIP协议栈实现，提供SIP消息的解析、生成和事务管理功能"
category: network
homepage: "https://www.gnu.org/software/osip/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "oSIP使用标准autotools构建系统，支持configure/make/make install流程"
    - "需更新config.guess/config.sub以识别HarmonyOS平台（E007）"
    - "HMDFS文件系统umask设置需修改configure中的umask 077为022（E011）"
    - "无外部依赖，仅需标准C库、pthread和librt"
  common_dependencies: []

versions:
  "5.3.1":
    status: published
    build_date: "2026-05-21"
    published_as: libosip2
    source_url: "https://ftp.gnu.org/gnu/osip/libosip2-5.3.1.tar.gz"