# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libabw-tools/0.1.3
homepage: "https://wiki.documentfoundation.org/Development/libabw"

# 上游**没有**测试套件：顶层与各 src/*/Makefile.am 均无 TESTS / check_PROGRAMS
# 声明，tarball 内无 *test* 命名源文件（src/ 下只有 lib、conv、fuzz，fuzz 需
# --enable-fuzzers 且依赖 libFuzzer，CI 不具备），也不分发任何 AbiWord 样例
# 文档（2026-09-19 对 0.1.3 tarball 实测）。build() 中照常执行 `make check`
# 留痕，结果 "Nothing to be done for 'check'"（rc=0）。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libabw_tools.cpp
    description: >-
      消费者功能测试（库级）：自实现最小 librevenge::RVNGInputStream（同时验证
      消费者可把自己的流类型喂给随包交付的 libabw 静态库），对
      AbiDocument::isFileFormatSupported 做负例（null / 空流 / 未压缩纯文本 /
      任意二进制 / gzip XML 但根元素是外来名）与正例（预生成的 gzip 载荷：
      根元素 <abiword> 与 <awml> 各一条；以及未压缩的合法 <abiword> XML ——
      0.1.3 的 ABWZlibStream 构造函数在 inflate 失败时回退为原始输入流
      m_input=input，故两种形态都是合法输入），并验证 AbiDocument::parse 对
      不支持输入的失败契约。共 9 项断言，失败即非零退出。
    command: "./test_libabw_tools"
  - file: test_package/test_libabw_cli.sh
    description: >-
      消费者功能测试（CLI 级）：对包内安装的 abw2text/abw2html/abw2raw 真实
      调用——三工具的 --version 必须成功（与 CI L2 冒烟门禁同口径）；不存在的
      输入文件必须以非零码失败；纯文本（非 AbiWord 文档）必须被非零码拒绝且
      **不得**以信号终止（abw2text 与 abw2raw 各验一次），据此证明转换工具
      链接成功且其 librevenge 生成器 / libxml2 依赖解析正确。共 7 项断言。
    command: "sh test_libabw_cli.sh <pkg>/bin"

# 说明：上游不分发 AbiWord 样例文档，故"正例解析整篇文档并比对输出文本"无法
# 完成；格式识别侧用**程序化生成的 gzip 载荷**做了正向断言（识别逻辑会先
# gzip 解压再查根元素，故正例必须是 gzip 流），工具侧验证了 --version 与
# 干净失败契约。
# 测试断言总数（近似值，用于质量评估）：库级 9 项 + CLI 级 7 项
assertion_count: 16
