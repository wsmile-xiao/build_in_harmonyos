# 版本级 manifest —— libabw-tools 0.1.3
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.3"
software: libabw-tools

# 设备实机构建已通过 conan create 与 G0-G5 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-19"
build_system: autotools

source:
  url: "https://dev-www.libreoffice.org/src/libabw/libabw-0.1.3.tar.xz"
  sha256: "e763a9dc21c3d2667402d66e202e3f8ef4db51b34b79ef41f56cacb86dcd6eed"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-gnu（0.1.3 dist 的 config.sub 经设备实测：sh config.sub 两个三元组均 rc=0 原样通过，直接常规配对）"
    - "--prefix=/（配合 DESTDIR 使 include/ 与 lib/ 直落包根）"
    - "--enable-static --disable-shared（R26 系统同名库默认静态；工具链接期吸收 libabw-0.1.a）"
    - "--disable-dependency-tracking"
    - "REVENGE_* / REVENGE_GENERATORS_* / REVENGE_STREAM_* 与 LIBXML_* / ZLIB_* 五组 PKG_CHECK_MODULES 变量逐个导出（设备无 pkg-config，该宏在 CFLAGS 非空时短路）"
    - "LDFLAGS 注入 -Wl,-rpath,<libxml2 包>/lib：工具是 PIE 且链共享 libxml2，CI L2 冒烟门禁无 LD_LIBRARY_PATH 跑 bin/*，须内嵌 RPATH（musl 支持，sfic 0.1.7 同款先例）"
    - "librevenge 三个库经「只放 .a 的干净 -L 目录」引用（规避其 .la 记录 libdir='//lib' 导致 libtool 'was moved'）；libxml2 与 zlib 不产 .la，直接用各自包目录的 -L/-l"
    - "BOOST_CFLAGS + CPPFLAGS 注入 boost 头（libabw 自身 TU 需要 boost/algorithm、boost/optional、boost/spirit）"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash；configure 的 umask 077→022 改写（0.1.3 恰 2 处，契约同 0.1.4）；autotools 辅助脚本 chmod +x（E490）；TMPDIR 指向构建目录内 .tmp"
    - "CC/CXX 从 profile 的 tools.build:compiler_executables 显式导出"
    - "make check 照常执行留痕（上游无 TESTS，结果 Nothing to be done for 'check'，rc=0）"
  dependencies:
    - librevenge/0.0.5
    - libxml2/2.15.3.1
    - zlib/1.3.1
    - boost/1.90.0.3（tool_requires：仅自身 TU 使用 boost 头）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "「库名-tools」模式（libabw-tools / libmwaw-tools）：上游源码树把库与转换工具合并在一个 autotools 构建里，Debian/Ubuntu 才拆成 -tools 包；本仓按 libmwaw-tools 先例整树构建、工具 + 静态库同包交付"
  - "libabw-0.1.3 与 0.1.4 的 configure.ac 仅版本号不同、src/lib/Makefile.am 逐字节相同、公开 API 未变 → 已发布 0.1.4 配方的 OHOS 构建机制可整体平移，逐项对 0.1.3 tarball 复核即可（umask 恰 2 处、config.sub 两三元组 rc=0）"
  - "工具二进制链共享 libxml2（ohpcd libxml2 只发带版本号共享库、无 .a），CI L2 冒烟门禁无 LD_LIBRARY_PATH 跑 bin/* → 配方在 LDFLAGS 注入 -Wl,-rpath 内嵌运行时路径，工具无需环境即可运行（与 sfic 对 libtdb 同法）"
  - "libabw 格式识别（isFileFormatSupported）：先经 ABWZlibStream 按 gzip 解压，inflate 失败时回退为按原始字节读 → 未压缩的合法 <abiword>/<awml> XML 也是正例，负例不能凭「先解压再解析」直觉写（0.1.3 与 0.1.4 该函数逐行一致）"
