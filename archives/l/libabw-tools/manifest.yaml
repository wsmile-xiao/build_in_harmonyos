software: libabw-tools
display: "libabw-tools"
description: "AbiWord 文档（abw）命令行转换工具集（abw2text/abw2html/abw2raw），基于 libabw 库"
category: data
homepage: "https://wiki.documentfoundation.org/Development/libabw"
license: LGPL-2.1-or-later OR MPL-2.0
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "与 libabw 0.1.4 同一源码树：整树 autotools 构建（库 + 转换工具），静态库 + 工具同包交付（libmwaw-tools 先例）"
    - "configure 的 umask 077 临时目录在 HMDFS 上不可写，需内联改写为 022"
    - "librevenge 包发布的 .la 文件 libdir 硬编码为 //lib，须经「只放 .a 的干净 -L 目录」引用；设备无 pkg-config，五组 PKG_CHECK_MODULES 变量逐个导出"
    - "工具链共享 libxml2，L2 冒烟门禁无 LD_LIBRARY_PATH 跑 bin/*，须 LDFLAGS 注入 -Wl,-rpath 内嵌运行时路径"
  common_dependencies:
    - librevenge
    - libxml2
    - zlib
    - boost（tool_requires，仅构建期头文件）

# 版本索引
versions:
  "0.1.3":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libabw-tools/0.1.3"
