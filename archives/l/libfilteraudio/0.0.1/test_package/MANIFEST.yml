# test_package/MANIFEST.yml — libfilteraudio 0.0.1
# CI L0e requires this file to exist.

package: libfilteraudio/0.0.1
homepage: "https://github.com/irungentoo/filter_audio"

# Upstream has no automated test entry point:
#   - Makefile targets are exactly `all`, `install`, `clean` (no check/test),
#     verified with `grep -nE '^[A-Za-z_.-]+:' Makefile`.
#   - No test framework (ctest/gtest/Catch2/CppUTest) is referenced anywhere.
#   - The 87 `assert(` occurrences in the tree are internal WebRTC DSP
#     invariants, not test cases.
# `make check` below documents the upstream invocation that does not exist.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs are registered or built. The two files under test/
# are interactive demos (`main()` + PortAudio stream + libsndfile input), not
# built by the Makefile and not runnable without a real audio device:
#   test/playback_mic.c, test/playback_mic_OSS.c
# other/speex_resampler.c has an `int main()` but it is inside `#if 0`.
upstream_tests: []

# test_package tests (consumer perspective, links the installed library)
test_package_tests:
  - file: test.c
    description: >-
      Drives the installed libfilteraudio through filter_audio.h: NULL/argument
      contracts, handle lifecycle, 10 ms frame alignment, VAD decision on
      digital silence vs a 440 Hz tone, real modification of the near-end
      buffer, echo-canceller attenuation of a far-end echo, and 8/16/32/48 kHz
      frame processing.
    command: "./test_libfilteraudio"

# Assertion count of the consumer test above (28 CHECK() sites in test.c)
assertion_count: 28
