# 版本级 manifest — libfilteraudio 0.0.1
# ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.0.1"
software: "libfilteraudio"
status: built
build_date: "2026-09-15"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 tag v0.0.1 (commit ada2f4fdc04940cdeee47caffe43add4fa017096)
  url: "https://github.com/irungentoo/filter_audio/archive/refs/tags/v0.0.1.tar.gz"
  sha256: "fb135592c5133c3b4b664da18f988f58609db912f204059abe16277df044a366"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 上游 Makefile 无 configure；仅需从 Conan conf 注入 CC（R33）
  configure_options:
    - "CC=<tools.build:compiler_executables:c>"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Makefile 的 WebRTC 抽取库在 aarch64 无需补丁：SSE2 实现被 #ifdef __SSE2__ 包裹，调用点被 WEBRTC_ARCH_X86_FAMILY 包裹，自动落可移植 C 路径"  # knowledge_ref: E577
  - "Conan basic_layout() 默认把 build 目录设为 build-<build_type>/，纯 Makefile 项目在那里找不到 Makefile（No targets specified and no makefile found）；用 basic_layout(self, build_folder=\".\") 压回源码根"  # knowledge_ref: E577
  - "上游 Makefile 的 VERSION=0.0.0 决定 soname（libfilteraudio.so.0）；按包版本传 VERSION=0.0.1 会把 soname 悄悄改成 .so.1，属 ABI 误声明，须保留上游值"  # knowledge_ref: E577
  - "上游 make install 用 $(abspath $(PREFIX)) 重写 .pc 的 prefix，PREFIX 为空时固化成构建目录死路径；须在 package() 重写为 ${pcfiledir}/../.. 的相对前缀"  # knowledge_ref: E577
