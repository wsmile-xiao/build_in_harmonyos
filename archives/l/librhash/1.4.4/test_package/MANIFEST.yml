# test_package/MANIFEST.yml - librhash 1.4.4

package: librhash/1.4.4
homepage: "https://github.com/rhash/RHash"

upstream_check_command: "make -j1 test-lib-static"
upstream_test_in_build: true
upstream_test_command: "make -j1 test-lib-static"

upstream_tests:
  - file: librhash/test_lib.c
    source: RHash-1.4.4.tar.gz/librhash/test_lib.c
    description: "Upstream LibRHash static-library vectors, alignment, import/export, and magnet-link tests"
    command: "./test_static"
  - file: librhash/test_utils.c
    source: RHash-1.4.4.tar.gz/librhash/test_utils.c
    description: "Upstream helper code linked into the LibRHash static test binary"
    command: "./test_static"

test_package_tests:
  - file: test.c
    description: "Consumer test calls rhash_msg, rhash_print_bytes, rhash_init, rhash_update, rhash_final, and rhash_print"
    command: "./test_librhash"

assertion_count: 250
