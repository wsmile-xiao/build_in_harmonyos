version: "1.4.4"
status: built
build_date: "2026-08-06"

source:
  url: "https://github.com/rhash/RHash/archive/refs/tags/v1.4.4.tar.gz"
  sha256: "8e7d1a8ccac0143c8fe9b68ebac67d485df119ea17a613f4038cda52f84ef52a"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "--prefix=/"
    - "--enable-static"
    - "--enable-lib-static"
    - "--disable-lib-shared"
    - "--disable-gettext"
    - "--disable-openssl"
    - "--disable-symlinks"
  dependencies: []
  optional_dependencies_disabled:
    - "openssl"
    - "gettext"
  cc: clang
  ar: llvm-ar

patches_applied: []

knowledge_gained:
  - "LibRHash is built from the RHash source tree with the makefile target lib-static."
  - "W0 has no required package dependencies; optional OpenSSL/gettext support is disabled."
  - "Static-only packaging avoids shared-library symlink creation on OHOS/HMDFS."
  - "Upstream library validation target is make -j1 test-lib-static."
  - "The target OHOS worker did not expose make/cmake; recipe fallback compiles LibRHash sources directly and still runs upstream test_static."
  - "Shadow CI passed on 2026-08-06 with Total=1, Success=1, L0/L1/L4/L5 pass and L2 skip for no bin directory."

build_system: makefile
