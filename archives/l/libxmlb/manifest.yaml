software: libxmlb
display: "libxmlb"
description: "Library for querying XML binary blobs efficiently"
category: data
homepage: "https://github.com/hughsie/libxmlb"
license: LGPL-2.1+
build_system: meson

ohos_adaptation:
  key_points:
    - "glib 2.88.3 共享库（GObject 类型系统一致性）；glib .pc 前缀/Requires 修正层"
    - "禁用 introspection/gtkdoc（OHOS worker 无 g-ir-scanner/gtkdoc-scan，属绑定/文档产物）"
    - "meson install 改写 ELF（RUNPATH 清理）破坏链接期自签 — 安装后 binary-sign-tool 重签"
    - "版本化 .so 别名物化为常规文件（HMDFS，glib/gtk 打包模式）"
  common_dependencies:
    - glib/2.88.3
    - liblzma/5.8.1
    - zstd/1.5.7.1

versions:
  "0.3.19":
    status: built
    build_date: "2026-09-17"
    knowledge_gained:
      - "E508: GNOME glib 静态链接 g_libintl_* 缺失 + meson host_machine 平台判断（glib/2.88.3 以 proxy-libintl 嵌入解决）"
