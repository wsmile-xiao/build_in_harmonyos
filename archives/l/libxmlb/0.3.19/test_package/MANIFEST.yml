# test_package/MANIFEST.yml — libxmlb 0.3.19
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md

package: libxmlb/0.3.19
homepage: "https://github.com/hughsie/libxmlb"

# 上游测试命令（meson test 于 build() 内原生执行）
upstream_check_command: "meson test -v -C <builddir>"
upstream_test_in_build: true
upstream_test_command: "meson test -v -C builddir --timeout-multiplier=16"

# 上游测试清单：src/xb-self-test.c 单一测试可执行文件
# - g_test_add_func 注册总数 51，其中 49 项默认执行，
#   2 项（threading/speed）在 g_test_perf()（--perf）下才注册
# - 测试数据 data/test.xml{,.gz.gz.gz,.xz,.zst}、test.quirk、test.desktop
#   （test.xml.xz / test.xml.zst 依赖 lzma/zstd 特性，均已启用）
upstream_inventory:
  source_literal_registrations: 51
  configured_total: 49
  executed_passed_total: 49
  failed_total: 0
  notes: "2 perf-only registrations (threading/speed) not counted in the default run"

upstream_tests:
  - file: src/xb-self-test.c
    source: libxmlb-0.3.19/src/xb-self-test.c
    description: "上游单测套件（g_test），含 builder/silo/xpath/opcodes/lzma/zstd 等 49 个默认用例"
    command: "meson test -v -C builddir --timeout-multiplier=16"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libxmlb.c
    description: "消费者通过 pkg-config('xmlb') 链接库：inline XML 编译为 silo、XPath 查询、节点相对查询、silo 导出回 XML、版本宏校验"
    command: "./test_libxmlb"
  - file: xb-tool（包内 CLI，test_package test() 驱动）
    description: "xb-tool compile + query 真实执行：XML 编译为 xmlb blob 并 XPath 查询返回 <id>xb.tool.check</id>（conanrun 环境）"
    command: "xb-tool compile xb-tool-check.xmlb xb-tool-check.xml && xb-tool query xb-tool-check.xmlb 'components/component/id'"

# 测试断言总数：7 处 CHECK 宏 + 4 处 API 失败硬退出（末尾 CHECK 汇总退出不计入）
assertion_count: 11
target_execution_status: passed
