software: libxmlb
# 版本级 manifest（ARCHIVE-SPEC v2.0）
# 文件位置: archives/l/libxmlb/0.3.19/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "0.3.19"

# 编译状态
# published | built | failed | archived
# built: conan-verify/W3 本地模拟全绿；upload 由 PR 合并 main 后的 CI 执行（R29）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"

# 构建系统
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/hughsie/libxmlb/releases/download/0.3.19/libxmlb-0.3.19.tar.xz"
  sha256: "0a3ec258b12dbf10e5fe840b2421c84137eb7cc1b09c3de6210f3f7d51733733"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dintrospection=false"
    - "-Dgtkdoc=false"
    - "-Dtests=true"
    - "-Dlzma=enabled"
    - "-Dzstd=enabled"
    - "-Dcli=true"
  dependencies:
    - glib/2.88.3
    - liblzma/5.8.1
    - zstd/1.5.7.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "glib/2.88.3 组件名为 glib/gobject/gio（非 glib-2.0），component requires 引用须用 glib::glib 形态"
  - "glib 安装 .pc 为 prefix=/（conan meson 约定），需 pc-fix 层重写 prefix 并剥离静态内部 Requires"
  - "meson install 改写 ELF（RUNPATH 清理）使 lld 链接期自签失效 — binary-sign-tool 重签 4 个 ELF 全部通过"
  - "conan MesonToolchain 将 libexecdir 映射到 bindir：installed-tests 落在 bin/installed-tests（非 libexec）"
