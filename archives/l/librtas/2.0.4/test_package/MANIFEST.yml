# test_package/MANIFEST.yml
# librtas 2.0.4 — upstream test declaration
# CI gate L0e requires this file; R51 requires an honest upstream test census.
package: librtas/2.0.4
homepage: "https://github.com/ibm-power-utilities/librtas"

# ── Upstream test census ────────────────────────────────────────────────
# Upstream ships NO automated test suite. Evidence collected from the source
# tree at tag v2.0.4 (github.com/ibm-power-utilities/librtas):
#   * no test/, tests/, or t/ directory
#   * Makefile.am declares no TESTS / check_PROGRAMS / no check target,
#     so `make check` is a no-op
#   * .github/workflows/ contains no test job
# => upstream test count is 0; there is nothing to run in build().
upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ── test_package tests (consumer perspective) ────────────────────────────
test_package_tests:
  - file: main.c
    description: >-
      librtasevent (11 assertions): parses a synthetic but well-formed RTAS
      event header and asserts version, event_length, section-list shape,
      that severity/disposition decode out of the data1 bitfield, the printer
      character-count contract, the EFAULT path for a NULL stream, cleanup, and
      rejection of an undersized buffer. The rendered dump is written to stdout
      and therefore visible in the CI log, but its text is NOT asserted on:
      neither capture sink is usable on the HarmonyOS device (open_memstream
      silently drops the final ~70-byte write, tmpfile returns NULL). See
      notes.md section 4 item 11.
    command: "./librtas_test"
  - file: main.c
    description: >-
      librtas (6 assertions, 4 of them HarmonyOS-specific): asserts
      rtas_set_debug() (syscall-free) succeeds -- reading back the extern
      dbg_lvl, not just the always-zero return value -- and that the RTAS
      syscall wrappers rtas_get_time()/rtas_delay_timeout() fail with a
      documented librtas error code because HarmonyOS aarch64 has no ppc64
      RTAS kernel interface. The four wrapper assertions are the
      HarmonyOS-specific ones.
    command: "./librtas_test"

# 17 assertions total: 6 against librtas, 11 against librtasevent.
# 4 of them are HarmonyOS-platform-specific (the documented-failure probes).
# main.c adds an 18th meta-assertion, check(checks == 17), which fails if an
# assertion is added or removed without updating this file and
# ../manifest.yaml, so the counts below cannot silently drift.
assertion_count: 17
librtas_assertions: 6
librtasevent_assertions: 11
harmonyos_specific_assertions: 4
