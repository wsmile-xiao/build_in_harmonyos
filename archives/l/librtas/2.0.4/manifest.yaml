version: "2.0.4"
software: "librtas"
status: "built"
build_date: "2026-09-30"
build_system: "autotools"

source:
  url: "https://github.com/ibm-power-utilities/librtas/archive/refs/tags/v2.0.4.tar.gz"
  sha256: "8a27d97fa2929441ac607225f522267361d2dd26dd3858d6ba2869af2eb50d27"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--build=aarch64-linux"
    - "--host=aarch64-linux"
  tool_requires:
    - "automake/1.18"
    - "libtool/2.5.4"
  dependencies: []
  cc: "clang"
  cxx: "clang++"
  artifacts:
    - "lib/librtas.so.2.0.0"
    - "lib/librtasevent.so.2.0.0"
    - "include/librtas.h"
    - "include/librtasevent.h"
    - "include/librtasevent_v4.h"
    - "include/librtasevent_v6.h"

patches_applied: []

knowledge_gained:
  - "librtas 主库是 ppc64 专属：__NR_rtas=255 仅由 Linux powerpc 架构实现，OHOS aarch64 sysroot 中该宏出现 0 次；Debian 打包 Architecture 也仅 powerpc/ppc64/ppc64el。"
  - "上游只提供 configure.ac（GitHub tag 与 Debian orig tarball 均无预生成 configure），config/ 由 autoreconf 生成，因此 patches/ 无法对其生效；改用 --host=aarch64-linux 免除对生成文件打补丁。"
  - "rtas_print_event() 返回累计打印字符数而非 0（错误路径 NULL stream 才返回 0 并置 EFAULT），断言返回值时须按此契约。"
  - "sanity_check() 先查 geteuid 再查 RTAS 内核接口，故 root 得 RTAS_KERNEL_INT(-1001)、非 root 得 RTAS_PERM(-1003)；测试须断言文档错误集合而非单一值。"
  - "rtas_set_debug() 无条件 return 0，只断言其返回值是恒真断言；须回读模块级 extern int dbg_lvl 才能真正验证状态跃迁。"
  - "OHOS/HMDFS 设备上无可靠的输出捕获介质：open_memstream() 静默丢弃最后一次约 70 字节写入（构建 #66024/#66052 实测 178 字节/3 换行，而同进程 stdout 同一份 dump 完整为 4 行 248 字节，且退出时 Signal 5）；tmpfile() 直接返回 NULL（#66078/#66088 实测 captured 0 byte）。两者都会给出「静默错误」的断言结论，故渲染文本断言退役，只保留 rtas_print_event() 的字符数契约与 NULL 流 EFAULT。"
  - "autoconf 生成物的 (umask 077 && mktemp -d ./confXXXXXX) 在 HMDFS 上落盘成 2700 不可写 → config.status: ./confXXXXXX/subs1.awk: Permission denied / could not setup config files machinery（E011/E129）。因 configure 会把该段原样拷进它生成的 config.status，改写生成物 configure 一处即可两边生效（实测 2→0，config.status sub_hits=0 证明继承），只改生成物故 conandata patches 仍为空。"

homepage: "https://github.com/ibm-power-utilities/librtas"
license: "LGPL-2.1-or-later"

tests:
  upstream:
    command: "make -n check"
    cases: 0
    passed: 0
    note: "上游无自动化测试：无 test/ 目录，Makefile.am 无 TESTS/check_PROGRAMS，.github/workflows 无测试 job。"
  adapted:
    command: "test_package/librtas_test"
    cases: 17
    passed: 17
    pass_rate: "17/17 (100%)"
    breakdown: "6 against librtas (4 HarmonyOS-specific), 11 against librtasevent"
    note: "main.c 末尾另有 1 条自计数守卫 check(checks == 17)，故二进制实际打印 '18 checks, 0 failure(s)'；cases 仍按断言计 17，守卫用于阻止断言数与本文件/ test_package/MANIFEST.yml 静默脱节。原 21 条中的 4 条「渲染文本断言」已按 notes.md 第四节第 11 条实测证据退役（OHOS 设备上 open_memstream 有损、tmpfile 返回 NULL，无可用捕获介质），改为只断言 rtas_print_event() 的字符数契约 + NULL 流 EFAULT；渲染文本本身仍写 stdout，可在 CI 日志中直接核对。"

platform_notes:
  - "librtas.so 的 RTAS syscall 封装在 aarch64 上运行期不可用（无 ppc64 RTAS 内核接口），属平台能力缺失，已在 notes.md 第二节留证；未做任何伪造可用的桩实现。"
  - "librtasevent.so 为架构中立的 RTAS 事件解析库，17 条断言中 11 条覆盖它且全部通过。"
