# librtas 2.0.4 源码声明
# 官方上游：https://github.com/ibm-power-utilities/librtas （git tag v2.0.4）
# 与 archives/l/libservicelog/1.1.19 使用同一 URL 与 sha256（已在本仓校验过）
sources:
  url: "https://github.com/ibm-power-utilities/librtas/archive/refs/tags/v2.0.4.tar.gz"
  sha256: "8a27d97fa2929441ac607225f522267361d2dd26dd3858d6ba2869af2eb50d27"

# 无补丁：
# 1) 上游只提供 configure.ac（GitHub tag 与 Debian orig tarball 均无预生成
#    configure），config/ 目录由 build() 里的 autoreconf 生成，不存在于源码树，
#    因此 patches/ 无法对其生效（与 jbig2enc 同款判定）。
# 2) 交叉编译不需要改 config.sub：generate() 直接传 --host=aarch64-linux，
#    该三元组是 config.sub 原生支持的，免去对「随 autoconf 版本漂移的生成文件」
#    打补丁的脆弱做法（见 notes.md「真实错误与修复」）。
patches: {}
