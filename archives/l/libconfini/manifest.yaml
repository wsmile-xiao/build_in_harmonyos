software: libconfini
display: "libconfini"
description: "Yet another INI parser — C99 library for parsing INI/.conf files"
category: parsing
homepage: "https://madmurphy.github.io/libconfini/"
license: GPL-3.0-or-later
build_system: autotools

versions:
  "1.16.4":
    status: built
    build_date: "2026-08-24"
    notes: >-
      首个 conan 配方。纯 C99 INI 解析库，无外部依赖。鸿蒙 PC aarch64 conan create
      通过；test_package 覆盖 section/key/value 解析、回调分发、数组拆分、隐式值、
      disabled 条目与返回值校验。无补丁：config.sub 不识别 ohos 三元组，改用 musl
      三元组（同 libdatrie/0.2.13 验证做法）；仅运行期修 configure 的 umask 077→022
      （HMDFS E011）并删 lib/*.la。
