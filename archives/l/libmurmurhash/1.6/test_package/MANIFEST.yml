package: libmurmurhash/1.6
homepage: "https://github.com/kloetzl/libmurmurhash"

upstream_check_command: "cmake build mmh/mmh_old + diff test/almostempty.hash"
upstream_test_in_build: true
upstream_test_command: "./mmh|./mmh_old test/almostempty | diff test/almostempty.hash - (via vendored CMake build, equivalent of upstream make check)"

upstream_tests:
  - file: test/mmh.c
    source: libmurmurhash-1.6/test/mmh.c
    description: "Upstream new-interface hash check on test/almostempty fixture"
    command: "./mmh test/almostempty | diff test/almostempty.hash -"
  - file: test/mmh_old.c
    source: libmurmurhash-1.6/test/mmh_old.c
    description: "Upstream deprecated-interface hash check on test/almostempty fixture"
    command: "./mmh_old test/almostempty | diff test/almostempty.hash -"

test_package_tests:
  - file: test.c
    description: "Consumer smoke test covering x86_32, x86_128 and x64_128 hashing determinism plus deprecated API"
    command: "test_libmurmurhash"

assertion_count: 9
