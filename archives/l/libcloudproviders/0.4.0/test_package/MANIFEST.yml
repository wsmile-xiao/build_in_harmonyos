# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libcloudproviders/0.4.0
homepage: "https://gitlab.gnome.org/GNOME/libcloudproviders"

# 上游测试命令分析：
# - meson 构建（meson.build），test/meson.build 仅构建两个可执行程序
#   testcloudprovidersserver / testcloudprovidersclient，未注册 meson test()
#   （无 test() 调用），即 meson test --list 为空。
# - 两个程序为 DBus session bus 集成/演示程序（server 通过 g_bus_own_name
#   注册 org.freedesktop.CloudProviders.ServerExample，client 通过 collector
#   监听供应商），运行需 session bus；OHOS 无 dbus-daemon，无法作为 CI
#   自动化测试运行。功能覆盖由 test_package 自研断言承担。
upstream_check_command: "meson test --list (empty; no test() registered)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（OHOS 平台限制无法运行，见 notes.md）
upstream_tests:
  - file: testcloudprovidersserver.c
    source: libcloudproviders-0.4.0/test/testcloudprovidersserver.c
    description: "DBus session bus 服务端演示/集成程序（注册 ServerExample 供应商并导出 3 个账户）"
    command: "./testcloudprovidersserver"
  - file: testcloudprovidersclient.c
    source: libcloudproviders-0.4.0/test/testcloudprovidersclient.c
    description: "DBus session bus 客户端演示/集成程序（collector 枚举供应商/账户）"
    command: "./testcloudprovidersclient"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：GType 注册 5 + collector 单例 3 + 枚举 ABI 4 = 12 基础断言；鸿蒙特有断言 2（OHOS 下 glib 运行期版本≥2.64 与头文件/库版本一致性）；session bus 可用时追加 exporter round-trip"
    command: "./test_libcloudproviders"

# 测试断言总数 (近似值, 用于质量评估)
# 基础断言 12 项（五类 GType 注册 + collector 单例 3 + 枚举 4）必然执行；
# 鸿蒙特有断言 2 项（__OHOS__ 下编译执行，rule12）；session bus 可用时
# 追加 provider/account exporter round-trip 断言（合计 14+）。
assertion_count: 14
