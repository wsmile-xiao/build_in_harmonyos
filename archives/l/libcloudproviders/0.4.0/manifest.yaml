# 版本级 manifest — libcloudproviders 0.4.0
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.4.0"

# 软件名
software: "libcloudproviders"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/libcloudproviders/0.4/libcloudproviders-0.4.0.tar.xz"

  # 源码校验和
  sha256: "247b228d1027b2683868e7d7080d38693a457e908aadd0c119d52de59a398064"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
  - "-Dintrospection=false"
  - "-Dvapigen=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - glib/2.88.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "glib≥2.88 conan 配方组件化（components 名 glib/gio 无 -2.0 后缀，pkg_config_name 才有）：cpp_info.requires 必须引用组件名 glib::glib/glib::gio（写 glib::glib-2.0 触发 CMakeDeps Component not found） ref: knowledge/drafts/E999-draft-BF96"
- "glib 组件 requires 内联 proxy-libintl 的 -lintl，但传递依赖在消费方不可见 → 需显式 requires proxy-libintl + cpp_info.requires 用 pkg::pkg 形式，否则链接期 unable to find -lintl ref: knowledge/drafts/E999-draft-BF96"
- "glib 包内 gio-unix-2.0.pc 存在但组件未声明：PkgConfigDeps 不生成，meson dependency('gio-unix-2.0') 需从包内复制 .pc 并重写 prefix（E348 复制改名式别名同款） ref: knowledge/drafts/E999-draft-BF96"
