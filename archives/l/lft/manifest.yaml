# 软件级 manifest — lft
# 遵循 ARCHIVE-SPEC v3.0

software: lft
display: "lft"
description: "Layer Four Traceroute (LFT)：通过完成真实 TCP/SCTP 握手来追踪路径的网络诊断工具（ICMP 被中间设备过滤时仍可见路径），随包提供 whob（whois/路由服务器客户端）"
category: network
homepage: "https://pwhois.org/lft/"
license: VOSTROM
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "package_type=application 的 CLI 网络工具：package_info 不导出 cpp_info.libs（只声明 bindirs=bin、resdirs=share），可执行命令由软件级 commands.json 声明为 [lft, whob]（R38/L0k）；一个包发布两个二进制 lft 与 whob，Makefile.in 的 `all: lft whob` 一次构建，install 目标把两者都装进 bindir"
    - "lft_types.h 无条件 `#include <pcap.h>` ⇒ libpcap 是硬依赖，configure 找不到时 as_fn_error 直接失败；c-ares（异步 DNS）与 ncurses（-W watch 模式）都是编译期可选：全部调用点在 `#ifdef HAVE_CARES`/`#ifdef HAVE_NCURSES` 内，configure 仅在探测到时才 #define。本配方用 --disable-async-dns --disable-ncurses 把它俩钉死为关，使链接闭包恰为 libpcap，且避开 configure 对 /opt/homebrew /usr/local /opt/local /opt/pkg 的 candidate-prefix 扫描误捡宿主库"
    - "把 pcap 探测钉到 Conan 包：--with-pcap=<libpcap package_folder> 会置 pcap_path_override=yes，注入 -I<include> 与 -L<lib>，并短路 pkg-config 分支与 candidate-prefix 扫描 ⇒ 不依赖宿主 pkg-config 是否认识 libpcap.pc，检测完全确定；profile 不强制 shared，故 libpcap 取其 default（static），最终 lft ELF 运行期不再需要 libpcap.so（pcap_lib_version() 被静态链入）"
    - "lft 的 Makefile.in 不是 VPATH 感知的（`$(CC) -c -o lft.o lft.c` 用裸相对路径），因此 configure 与 make 必须在同一目录：layout 用 basic_layout(self, build_folder='.') 把 build_folder 钉回源码根（basic_layout 默认会落到 build/Release 导致 out-of-tree 找不到 lft.c）"
    - "上游发布包只带已生成的 configure（autoconf 2.69）+ Makefile.in + config/，**没有 configure.ac** ⇒ configure 属发布产物，umask 改写就地发生在 build()（不走 patches/，与 1000+ 存量配方一致）；且 Makefile.in **没有 check 目标**，build() 只 make，不跑 check（跑了会 'No rule to make target check' 直接中断构建）"
    - "E386：profile [buildenv] 导出 CONFIG_SHELL=/data/service/hnp/bin/bash，该 bash 在 HMDFS 上 getcwd 失败，autoconf 生成的 configure 会用 $CONFIG_SHELL 重新 exec 自身并在启动期报 working directory cannot be determined；必须在**同一条命令**里 unset（generate() 期 env.unset 被运行期重注入击败，sword/1.9.0 与 wmcore/0.0.4 双侧实测）；configure 参数仍取 Autotools._configure_args，配方只追加 feature 开关不拼编译开关（R1/R33/R49）"
    - "E011/E114：config.status 以 `(umask 077 && mktemp -d ./confXXXXXX)` 建临时目录，HMDFS 上该目录回读为 0660 无检索位 ⇒ config files machinery 建立失败；build() 里把 configure 内的 umask 077 就地改写为 022（实测命中 2 处），未命中打 warning 不静默"
    - "E467：AutotoolsDeps 把依赖闭包的 -l 放进 $LIBS，autoconf 第一个『运行程序』测试因此链接闭包；同一条命令内联注入 LD_LIBRARY_PATH=<依赖 libdir>，否则（若 libpcap 被当共享库消费）加载器拒载会被误报成 cannot run C compiled programs；本包 libpcap 为静态故此项为防御性保留，与 wmcore 处方逐字一致"
    - "无权限判据（本设备非 root、raw socket 能力残缺）：`lft -v` 在 show_version() 里 exit(0)，而 show_version() 会真实调用 pcap_lib_version()/（条件编译的）ares_version()/curses_version() ⇒ 打出 'Packet capture: libpcap …' 即证明 libpcap 代码在运行期被执行；`lft --help` 与非法选项走 usage() 打 'Usage:' 并 exit(1)；`lft <target:port>` 走到 lft_check_permissions()（在选项解析之后，lft.c:634）→ 非 root 开 SOCK_RAW 得 EPERM → 'insufficient privileges' 并 exit(1)；实际 traceroute/抓包/watch 三类需要 raw 权限或网络的用例逐条声明 skipped 并附实测退出码，绝不记成通过"
    - "whob 走同一对象集（whois.c -DSTANDALONE，WHOB_LIBS 滤掉 ncurses）：`whob -v` 命中 usage() 打 'WhoB - version 3.98' 并 exit(1)；真正的 whois 查询需要向 43 端口建 TCP，网络受限故按能力层记 skip"
  common_dependencies:
    - libpcap

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.98":
    status: built
    build_date: "2026-09-26"
    conan_ref: "lft/3.98"
