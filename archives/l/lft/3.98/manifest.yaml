# ============================================================
# 源码信息
# ============================================================

source:
  # 上游官方直链（pwhois.org 是 LFT 的官方分发站，见 README「web site is located
  # at https://pwhois.org/lft/」）。登记表里 SCT 给的 deb.debian.org 那条是 3.91
  # 且哈希截断，另一个版本不能混用；/lft/lft-3.98.tar.gz 与 /lft/lft_3.98.tar.gz
  # 实测 404，只有 /get/ 路径 200。
  url: "https://pwhois.org/get/lft-3.98.tar.gz"
  sha256: "395ced8d95ee2bcc588a837f187e23bb25ce97999a0bb8481b2b3e0c1c633455"
  tar_format: tar.gz
  size_bytes: 507564

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/ （AutotoolsToolchain 默认，安装期由 DESTDIR=<package_folder> 落包，产物进 <pkg>/bin 与 <pkg>/share/man/man8）"
    - "--with-pcap=<libpcap package_folder>：把 pcap 探测钉到 Conan 包，置 pcap_path_override=yes，短路 pkg-config 分支与 /opt/homebrew 等 candidate-prefix 扫描"
    - "--disable-async-dns：关掉 c-ares 异步 DNS（HAVE_CARES 不定义，全部调用点 #ifdef 内），使链接闭包恰为 libpcap"
    - "--disable-ncurses：关掉 ncurses watch 模式（HAVE_NCURSES 不定义，WATCH_OBJS 为空）"
    - "其余目录变量由 AutotoolsToolchain 写入，配方不自加编译开关（R1/R33/R49）"
  build_command: >-
    unset CONFIG_SHELL; LD_LIBRARY_PATH=<依赖 libdir 列表> ./configure <工具链参数>
    --with-pcap=<libpcap pkg> --disable-async-dns --disable-ncurses && make -j1
  configure_note: >-
    不使用 autotools.configure()：profile [buildenv] 导出的
    CONFIG_SHELL=/data/service/hnp/bin/bash 在 HMDFS 上 getcwd() 失败，autoconf 2.69
    生成的 configure 会用 $CONFIG_SHELL 重新 exec 自身，从而在启动阶段即报
    "working directory cannot be determined"（E386，与 wmcore/0.0.4 同窗实测一致）。
    正解是在**同一条 shell 命令里** unset（generate() 期 env.unset 会被运行期重注入击败）。
    configure 参数仍取 AutotoolsToolchain 写入的 conf（Autotools._configure_args），
    配方只追加 feature 开关。layout 用 basic_layout(build_folder='.') 保证 in-tree 构建
    （Makefile.in 非 VPATH 感知）。
  install_method: "make install DESTDIR=<package_folder>（Autotools.install target=install；上游 install 会 chown/setuid，非 root 下该步以 || echo WARNING 兜底不致命；strip 已在 /data/service/hnp/bin 提供）"
  dependencies:
    - "libpcap/1.10.6（lft_types.h 无条件 #include <pcap.h>，硬依赖；静态链接，运行期 lft ELF 不再需要 libpcap.so）"
  dependency_track_note: >-
    只声明 libpcap 一条：c-ares 与 ncurses 均用 configure 开关钉死为关，避免把宿主
    /opt 前缀下的库误链进图；仓内 libpcap 已发布 1.10.1/1.10.6，取 1.10.6。
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: ["0001-lft-ohos-resolver-tuning.patch"]

patch_classification: []

in_build_source_transformations:
  - file: configure
    type: platform-build-environment
    applied_by: "conanfile._fix_configure_umask()（build() 内就地改写，不落 patches/）"
    change: "umask 077 → umask 022（命中 2 处）"
    reason: >-
      E011/E114：config.status 用 `(umask 077 && mktemp -d "./confXXXXXX")` 建临时目录，
      HMDFS 上 0700 目录回读为 0660（无检索位），随后写 subs*.awk 报 Permission denied
      → config.status: error: could not setup config files machinery。configure 是发布包
      内的生成文件（无 configure.ac），按 CONTRIBUTING 补丁规范不用 .patch 改生成文件，
      故在 build() 内就地改写，未命中打 warning。

# ============================================================
# 知识沉淀（引用的既有知识条目）
# ============================================================

knowledge_ref:
  - "E011"   # HMDFS umask 077 → config.status 临时目录不可用
  - "E114"   # 同族 mktemp 变体（存量配方的 umask 就地改写形态）
  - "E386"   # CONFIG_SHELL 指向 HMDFS 上 getcwd 失败的 shell：同命令内 unset
  - "E467"   # AutotoolsDeps 注入 $LIBS 导致首个运行程序测试被加载器拒载 → 误报交叉编译，同命令内联 LD_LIBRARY_PATH

knowledge_gained:
  - "（待与 conan-verify 实测日志对齐：本包按 hit 交付，未新增知识库条目；如撞到既有处方修不掉的新形态由主窗改判 create）"

