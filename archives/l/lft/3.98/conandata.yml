patches:
  - patch_file: "patches/0001-lft-ohos-resolver-tuning.patch"
    patch_description: "OHOS libc exports res_init()/res_query() but neither the legacy global _res nor glibc's __res_state(); keep res_init() and guard the two resolver-tuning assignments with __GLIBC__ so main() compiles on musl/OHOS (corpus entry E516: skip the generic _res path). Consequence: on OHOS the libc resolver defaults apply instead of the upstream 1s/1-retry tuning."
    patch_type: "portability"
