# test_package/MANIFEST.yml — lft/3.98
#
# ── 上游确无测试套件：三条实测证据（B 机，对象 sha256 已核实的官方 3.98 发布物）──
#   [1] 发布包内没有测试目录：只有 lft-3.98/ 源码根，`test -d tests` 与
#       `test -d test` 均不成立。
#   [2] 没有 check/test 目标：`Makefile.in` 的目标只有
#       all(51) / lft(53) / whob(59) / install(62) / clean(94) / distclean(97)，
#       无 check、无 TESTS、无 check_PROGRAMS。
#   [3] 文件清单里没有任何测试源文件：按 (^|/)(test|check)[^/]*\.(c|sh|pl|py)$
#       与 _test\. / \.t$ 过滤命中 0 条；*.c 全部是功能实现（lft.c、whob 相关
#       whois.c、lft_lib.c、lft_icmptrace.c、lft_btcptrace.c、lft_ifname.c）。
# ⇒ 上游静态测试数如实申报 0（这是清点结论，不是"平台没环境"）。

package: lft/3.98
homepage: "https://pwhois.org/lft/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_tests: []
upstream_zero_evidence: >-
  Zero upstream automated tests, established by three independent counts on the
  verified 3.98 tarball (sha256 395ced8d95ee2bcc588a837f187e23bb25ce97999a0bb8481b2b3e0c1c633455):
  (1) there is no tests/ or test/ directory in the release; (2) Makefile.in
  defines only all(51), lft(53), whob(59), install(62), clean(94), distclean(97)
  — no check target, no TESTS, no check_PROGRAMS; (3) filtering the file list by
  test/check source patterns yields 0 files, and every .c file present is
  functional code. This is not an environment limitation: the release ships no
  tests at all. The packaged consumer suite below exercises the built programs.

test_package_tests:
  # ---- ARTIFACT layer (test_package/conanfile.py) ---------------------------
# 实测打印 11 行 LFT_ARTIFACT_PASS：每枚二进制 5 条（存在 / AArch64 / .codesign 恰 1 /
# DT_NEEDED 全裸 soname / 无宿主路径）× 2 枚 + man page 1 条 = 11 个检查点；
# 下面按**检查项**列 6 条是因为两枚程序共享同一条描述（列条目数 != 打印检查点数）。
  - file: conanfile.py
    name: artifact-exists-both-programs
    outcome: passed
    description: "bin/lft 与 bin/whob 都必须被 make install 装出来"
    command: "test -f <pkg>/bin/lft -a -f <pkg>/bin/whob"
  - file: conanfile.py
    name: artifact-machine-aarch64
    outcome: passed
    description: "两枚产物 readelf -h 均 Machine: AArch64"
    command: "readelf -h <pkg>/bin/{lft,whob}"
  - file: conanfile.py
    name: artifact-codesign-section-at-most-1
    outcome: passed
    description: "每枚安装产物的 .codesign 段至多 1 个（0=CI 交付态未自签，>=2=重签残留必拦）；实测段数由 conanfile.py 打 LFT_MEASURED_*_codesign_sections，"恰好 1 段"在本测试自签副本后由 _stage_signed 硬断言"
    command: "readelf -SW <pkg>/bin/{lft,whob}"
  - file: conanfile.py
    name: artifact-needed-bare-sonames
    outcome: passed
    description: "每个 DT_NEEDED 都是裸 soname（含 `/` 即绝对路径被烤进产物）"
    command: "readelf -d <pkg>/bin/{lft,whob}"
  - file: conanfile.py
    name: artifact-no-host-prefix-leak
    outcome: passed
    description: "产物字节里不得出现 /storage/Users/currentUser 或 /usr/local"
    command: "byte scan of <pkg>/bin/{lft,whob}"
  - file: conanfile.py
    name: man-pages-installed
    outcome: passed
    description: "share 下必须同时有 lft.8 与 whob.8"
    command: "find <pkg>/share -name lft.8 -o -name whob.8"
  # ---- BEHAVIOUR layer (test_lft.sh, 8 asserted checkpoints) ----------------
  - file: test_lft.sh
    name: version-banner
    outcome: passed
    description: "lft --version 打印上游横幅 'Layer Four Traceroute (LFT) - version 3.98'：走到这里即证明加载器放行、依赖闭包可解析、-DVERSION 替换真实发生"
    command: "lft --version"
  - file: test_lft.sh
    name: version-exit-zero
    outcome: passed
    description: "lft --version 退出码 0（上游自身行为）"
    command: "lft --version; echo $?"
  - file: test_lft.sh
    name: no-args-exit-1
    outcome: passed
    description: "无参数运行退出码 1（usage 分支）"
    command: "lft; echo $?"
  - file: test_lft.sh
    name: no-args-usage-nonempty
    outcome: passed
    description: "无参数运行的 stdout/stderr 至少一路非空（真实 usage 文本）"
    command: "lft"
  - file: test_lft.sh
    name: bad-option-exit-1
    outcome: passed
    description: "未知选项退出码 1（default: usage）"
    command: "lft --certainly-not-an-option; echo $?"
  - file: test_lft.sh
    name: privilege-gate
    outcome: passed
    description: "lft 127.0.0.1 走到 main() 之后的 lft_check_permissions() 并报 privilege 诊断，且退出码不得是 126/127 —— 区分『包能跑、只是没特权』与『包坏了』"
    command: "lft 127.0.0.1"
  - file: test_lft.sh
    name: whob-version-in-usage
    outcome: passed
    description: "whob -v 走 usage 且横幅带 3.98，退出码 1"
    command: "whob -v"
  - file: test_lft.sh
    name: stripped-env-control
    outcome: passed
    description: "负对照：env -i 直跑 lft --version 仍不得 126/127（本 profile 下 libpcap 静态链入，产物自闭包）"
    command: "env -i <pkg>/bin/lft --version; echo $?"
  # ---- CAPABILITY layer: declared skipped, never counted as passed ----------
  - file: test_lft.sh
    name: raw-socket-traceroute
    outcome: skipped
    description: "真实 traceroute 需要 raw socket / CAP_NET_RAW，本设备非特权 uid 拿不到 ⇒ 逐条声明跳过"
    command: "lft <target>"
  - file: test_lft.sh
    name: interactive-ncurses-mode
    outcome: skipped
    description: "构建期 --disable-ncurses 关断交互模式（无显示/终端 UI）"
    command: "lft -N <target>"
  - file: test_lft.sh
    name: async-dns-cares-path
    outcome: skipped
    description: "构建期 --disable-async-dns 关断 c-ares 路径 ⇒ 异步 DNS 解析面未实测"
    command: "lft --async-dns <target>"

# 账本（五维 + 消费者）
static_upstream_test_files: 0
artifact_checkpoints_printed: 11
behavioral_checkpoints_printed: 8
capability_cases_skipped: 3
executable_test_cases: 19
measured_passed: 19
measured_skipped: 3
measured_failed: 0

test_case_count: 22
assertion_count: 17
# test_case_count 22 = 11 产物检查点 + 8 行为检查点 + 3 声明跳过（三者都是脚本/conanfile
# 实际打印/调用出来的行数：conanfile 的 6 条 results.append 里有 5 条在
# `for name in ("lft", "whob")` 循环内，展开即 11；test_lft.sh 有 8 个 ok 调用点、3 个 sk 调用点）。
# assertion_count 17 是另一个口径 = 源码判定表达式静态数，复现命令：
#   grep -c 'results.append(' conanfile.py            -> 6
#   grep -cE '^[[:space:]]*if ' test_lft.sh           -> 9
#   grep -cE '^\[ -x ' test_lft.sh                    -> 2
# test_lft.sh 的 8 个行为检查点用 `grep -oE '\bok [a-z][a-z0-9-]*' test_lft.sh | wc -l` 复现
# （不能用 '^[[:space:]]*ok '：有 3 处 `if ...; then ok name; else ...` 写在同一行，行首正则只数到 5）。
