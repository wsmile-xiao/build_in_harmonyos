# test_package/MANIFEST.yml — libpcre32 8.45 适配验证清单
#
# 上游测试来源声明：
#   - build_system: autotools（configure.ac，--enable-pcre32）
#   - 上游 make check 跑 RunTest 脚本套件（pcre32 模式下 grep 测试可运行）
#   - 本适配以消费者用例为准：pcre32_compile/exec/free roundtrip
#
# test_package 消费者用例（新增）：
#   test_pcre32.c — pcre32_compile("a.c+") + exec("abcccxyz") 匹配长度 5 断言
#                   + 无匹配不误报 + pcre32_free 生命周期
package: libpcre32/8.45
homepage: https://www.pcre.org/

upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - name: pcre32-compile-exec
    command: "./test_pcre32"
    assertions:
      - "compile 成功（re != NULL）"
      - "exec 返回 >= 1（匹配成功）"
      - "匹配子串长度 5（abccc）"
      - "无匹配不误报"
