software: libpcre32
version: "8.45"
build_system: autotools
status: built
build_date: "2026-09-13"

source:
  url: "https://downloads.sourceforge.net/project/pcre/pcre/8.45/pcre-8.45.tar.gz"
  sha256: "4e6ce03e0336e8b4a3d6c2b70b1c5e18590a5673a98186da90d4f33c23defc09"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-pcre32 --disable-pcre8 --disable-pcre16"
  cc: clang

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

knowledge_gained:
  - "libpcre32（上游 PCRE 8.45）用 --enable-pcre32 --disable-pcre8/16 只产出 libpcre32"
  - "config.guess 识别 HarmonyOS（aarch64-unknown-linux-ohos），config.sub 接受 ohos 基本系统 + linux-ohos 组合（沿用 libpcre16 已验证方案）"
  - "configure 临时目录 umask 077→022（HMDFS 0700 目录不可写）"
  - "pcre32 API 输入须为 PCRE_UCHAR32（unsigned int）码元数组而非 char*（ASCII 需显式转换）"

package_contract:
  libraries: ["pcre32"]
  pkg_config: ["libpcre32.pc"]
  headers: ["pcre.h"]

test_results:
  type: official
  total: 26
  passed: 26
  failed: 0
  note: "上游 RunTest 套件（pcre32 目标）26 项 + test_package 消费者 4 断言"
