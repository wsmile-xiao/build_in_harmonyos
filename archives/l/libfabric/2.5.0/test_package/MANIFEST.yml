# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: libfabric/2.5.0
homepage: "https://github.com/ofiwg/libfabric"

# 上游测试情况（2026-08-28 调查 + 实测）：
# fabtests 是独立仓库，不在 release tarball 中。
# Makefile.am 中 TESTS = util/fi_info，make check 仅运行 fi_info 二进制。
# 交叉编译产物为 OHOS aarch64 ELF（动态链接 /lib/ld-musl-aarch64.so.1），
# 在本机（aarch64 Linux + musl）可直接运行，make check 执行通过。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_run_result: "PASS — make check 1/1 PASS，util/fi_info 正常输出 16 个 provider 信息"
upstream_tests:
  - file: util/fi_info
    description: "make check 唯一测试项：运行 util/fi_info 二进制（provider 信息查询），非 fabtests 套件"
    command: "make check"
    result: "PASS (1/1) — fi_info 成功加载并输出全部 provider：ofi_rxm/ofi_rxd/shm/udp/tcp/sockets/ofi_hook_*/off_coll/sm2/ofi_mrail/lnx"
  - file: util/fi_info
    description: "fi_info -l 列出所有可用 provider"
    command: "./util/fi_info -l"
    result: "PASS — 16 个 provider 全部加载，版本号 205.0"
  - file: util/fi_info
    description: "fi_info --version 版本信息"
    command: "./util/fi_info --version"
    result: "PASS — 输出 'libfabric: 2.5.0 / libfabric api: 2.5'"
  - file: util/fi_info
    description: "fi_info -e 环境变量列表"
    command: "./util/fi_info -e"
    result: "PASS — 正常输出全部 libfabric 环境变量说明"

# test_package 自带测试（消费者视角：API 版本 + fi_strerror + fi_tostr + fi_getinfo 探测 + fi_fabric 生命周期）
test_package_tests:
  - file: test_package.c
    description: "libfabric API 实质验证：fi_version 版本检查 + fi_strerror 错误码 + fi_tostr 枚举序列化 + fi_getinfo provider 探测 + fi_fabric/fi_close 生命周期（无需真实网络）"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
