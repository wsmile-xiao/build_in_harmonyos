version: "23.0.1"
software: "libarrow"
status: published
build_date: "2026-09-13"
build_system: cmake

source:
  url: "https://github.com/apache/arrow/archive/refs/tags/apache-arrow-23.0.1.tar.gz"
  sha256: "9a9a057bba3aa7080abc2ba8e7a079effa74626a4f308ac56bfce035d31ef1ac"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DARROW_DEPENDENCY_SOURCE=SYSTEM"
    - "-DARROW_BUILD_STATIC=ON"
    - "-DARROW_BUILD_SHARED=OFF"
    - "-DARROW_COMPUTE=ON"
    - "-DARROW_CSV=ON"
    - "-DARROW_FILESYSTEM=ON"
    - "-DARROW_IPC=ON"
    - "-DARROW_JSON=ON"
    - "-DARROW_PARQUET=OFF"
    - "-DARROW_FLIGHT=OFF"
    - "-DARROW_FLIGHT_SQL=OFF"
    - "-DARROW_ORC=OFF"
    - "-DARROW_GANDIVA=OFF"
    - "-DARROW_CUDA=OFF"
    - "-DARROW_DATASET=OFF"
    - "-DARROW_ACERO=OFF"
    - "-DARROW_S3=OFF"
    - "-DARROW_GCS=OFF"
    - "-DARROW_HDFS=OFF"
    - "-DARROW_AZURE=OFF"
    - "-DARROW_SUBSTRAIT=OFF"
    - "-DARROW_JEMALLOC=OFF"
    - "-DARROW_MIMALLOC=OFF"
    - "-DARROW_BUILD_TESTS=OFF"
    - "-DARROW_BUILD_BENCHMARKS=OFF"
    - "-DARROW_BUILD_EXAMPLES=OFF"
    - "-DARROW_BUILD_UTILITIES=OFF"
    - "-DARROW_WITH_BROTLI=ON"
    - "-DARROW_WITH_BZ2=ON"
    - "-DARROW_WITH_LZ4=ON"
    - "-DARROW_WITH_SNAPPY=ON"
    - "-DARROW_WITH_ZLIB=ON"
    - "-DARROW_WITH_ZSTD=ON"
    - "-DARROW_WITH_RE2=ON"
    - "-DARROW_WITH_UTF8PROC=ON"
    - "-DARROW_USE_OPENSSL=ON"
    - "-DARROW_WITH_THRIFT=OFF"
    - "-DARROW_WITH_BACKTRACE=OFF"
    - "-DARROW_WITH_OPENTELEMETRY=OFF"
    - "-DARROW_SIMD_LEVEL=DEFAULT"
    - "-DARROW_RUNTIME_SIMD_LEVEL=MAX"
  dependencies:
    - boost/1.84.0
    - xsimd/13.2.0
    - rapidjson/1.1.0
    - re2/2024-04-01
    - utf8proc/2.11.3
    - openssl/3.0.16
    - zlib/1.3.1
    - lz4/1.10.0
    - zstd/1.5.7
    - brotli/1.2.0
    - bzip2/1.0.8
    - snappy/1.1.7
    - gflags/2.2.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
    - "Arrow 23.0.1 requires C++17, compatible with OHOS clang 15"
    - "ARROW_PARQUET=ON forces ARROW_WITH_THRIFT=ON; thrift not in registry, must disable parquet"
    - "Arrow uses ARROW_DEPENDENCY_SOURCE=SYSTEM with CMakeDeps for conan integration"
    - "SIMD: ARROW_SIMD_LEVEL=DEFAULT auto-selects NEON on aarch64/OHOS"
    - "Arrow cmake configure runs from cpp/ subdirectory (build_script_folder=cpp)"
    - "Disabled: Flight, Parquet, ORC, Gandiva, CUDA, Dataset, Acero, Plasma (deps unavailable or not needed)"
    - "Enabled: Compute, CSV, IPC, JSON, Filesystem + all compression codecs (zlib, lz4, zstd, brotli, bz2, snappy)"
