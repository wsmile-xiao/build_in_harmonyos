# conandata.yml — libheif-svtenc 1.23.0
#
# 交付面 = 上游 libheif 1.23.0 树内的 CMake 目标 heif-svtenc：
#   libheif/plugins/CMakeLists.txt:68-70
#     set(SvtEnc_sources encoder_svt.cc encoder_svt.h)
#     plugin_compilation(svtenc SvtEnc SvtEnc_FOUND SvtEnc SvtEnc)
#   → add_library(heif-svtenc MODULE ...)  → 产物 libheif-svtenc.so
#     （SVT-AV1 编码后端插件模块；libheif/plugins/encoder_svt.cc）
# 版本号取父 tarball 版本（同族先例：libhwy_test 1.3.0 ← highway 1.3.0）。

sources:
  # 父 tarball：上游 libheif 1.23.0 官方 tag 归档（R39：官方源）。
  # sha256 为设备实测下载值（本任务独立下载后 sha256sum 计算）。
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"

# 内树构建的编码器源码（**不是** Conan 依赖，见 requirements() 注释与 notes.md「W0 判定」）。
# 为什么写进 conandata 而不是硬编码进 conanfile.py：CI 的 mirror-fallback 与
# pre-download 只扫描 conandata.yml 里的 URL（ci/conan/build_and_test.sh:1021/1175），
# 写在这里才能被预下载与镜像回退覆盖。
svt_av1:
  url:
    # 官方主源：AOMediaCodec 的 GitLab 仓库（上游 Homepage）
    - "https://gitlab.com/AOMediaCodec/SVT-AV1/-/archive/v3.1.2/SVT-AV1-v3.1.2.tar.gz"
    # 官方 GitHub 镜像（同一 AOMediaCodec 组织；CI 对 github.com 有镜像回退）
    - "https://github.com/AOMediaCodec/SVT-AV1/archive/refs/tags/v3.1.2.tar.gz"
  # sha256 为设备实测下载值（本任务从官方 GitLab 主源下载后 sha256sum 计算）。
  sha256: "d0d73bfea42fdcc1222272bf2b0e2319e9df5574721298090c3d28315586ecb1"

patches:
  # 列表形态（仓库标准形态；CI L0f 对 patches 段的缩进 key 判 \.(patch|diff)$ —— 用
  # 文件名做 key 的映射形态会被判 [fail]，故此处不用版本号映射，直接列表）。
  # 唯一补丁，且**不作用于父 tarball**，而是作用于内树构建的 SVT-AV1 3.1.2 源码
  # （base_path=svt-av1，即 source() 里 get() 的第 4 个参数落点）。
  # 内容与仓库既有归档 archives/l/libSvtAv1Enc/3.1.2/patches/ 下的
  # 0001-Source-Lib-Codec-svt_threads.h.patch 逐字节一致
  # （blob c05cd29fbb79a1554d4b3733e6dbbfcf87497efe），是本设备上已验证过的
  # OHOS 适配：svt_threads.h 的 EB_CREATE_THREAD 在 __linux__ 分支调用
  # pthread_setaffinity_np()，而 OHOS 不提供该函数；补丁把 __OHOS__ 排除到无线程亲和分支。
  # 补丁按原样收录、不改一行（R8：源码修改四不准则）。
  # 注意：CI 的 L0f 会把 patches 段里所有**缩进行**当 key 判 \.(patch|diff)$，
  # 注释行同样会被扫到——上面那行把文件名放在行中间（不以 .patch 结尾）就是为此。
  - patch_file: "patches/0001-svt-av1-3.1.2-ohos-no-thread-affinity.patch"
    base_path: "svt-av1"
    strip: 1
    patch_description: "OHOS 无 pthread_setaffinity_np：svt_threads.h 的线程创建分支排除 __OHOS__"
    patch_type: "portability"
