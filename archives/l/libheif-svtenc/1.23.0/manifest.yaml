software: libheif-svtenc
# 版本级 manifest — 文件位置: archives/l/libheif-svtenc/1.23.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "1.23.0"
conan_ref: "libheif-svtenc/1.23.0"

# published | built | failed | archived
# O5：只有 release upload 已确认才可标 published，此前一律 built。
status: built

build_date: "2026-09-20"

# 构建系统类型（verify-build 要求的顶层字段）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 父 tarball（本包是其中树内子模块：CMake 目标 heif-svtenc）
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"
  tar_format: tar.gz
  # 包内树构建的编码器（**不是** Conan 依赖；制品仓无 svt-av1 包，见 notes.md「W0 依赖判定」）
  bundled_dependency:
    name: svt-av1
    version: "3.1.2"
    url:
      - "https://gitlab.com/AOMediaCodec/SVT-AV1/-/archive/v3.1.2/SVT-AV1-v3.1.2.tar.gz"
      - "https://github.com/AOMediaCodec/SVT-AV1/archive/refs/tags/v3.1.2.tar.gz"
    sha256: "d0d73bfea42fdcc1222272bf2b0e2319e9df5574721298090c3d28315586ecb1"
    tar_format: tar.gz
    build_system: cmake
    install_prefix: "<build_folder>/svt-av1-prefix（私有 prefix，R49）"

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # cmake 选项（与 conanfile.py generate() 一致；由 CMakeToolchain 下发的 -D 变量）
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"              # 插件 dlopen 语义要求宿主为共享库
    - "-DENABLE_PLUGIN_LOADING=ON"          # 交付面必要条件：插件模块形态
    - "-DWITH_SvtEnc=ON"                    # 交付面：SVT-AV1 编码后端
    - "-DWITH_SvtEnc_PLUGIN=ON"             # 交付面：以独立插件模块构建（→ libheif-svtenc.so）
    - "-DWITH_LIBDE265=OFF"
    - "-DWITH_X265=OFF"
    - "-DWITH_X264=OFF"
    - "-DWITH_AOM_DECODER=OFF"
    - "-DWITH_AOM_ENCODER=OFF"
    - "-DWITH_DAV1D=OFF"
    - "-DWITH_KVAZAAR=OFF"
    - "-DWITH_UVG266=OFF"
    - "-DWITH_VVDEC=OFF"
    - "-DWITH_VVENC=OFF"
    - "-DWITH_FFMPEG_DECODER=OFF"
    - "-DWITH_OpenH264_DECODER=OFF"
    - "-DWITH_RAV1E=OFF"
    - "-DWITH_JPEG_DECODER=OFF"
    - "-DWITH_JPEG_ENCODER=OFF"
    - "-DWITH_OpenJPEG_DECODER=OFF"
    - "-DWITH_OpenJPEG_ENCODER=OFF"
    - "-DWITH_OPENJPH_ENCODER=OFF"
    - "-DWITH_LIBSHARPYUV=OFF"
    - "-DWITH_UNCOMPRESSED_CODEC=OFF"
    - "-DWITH_WEBCODECS=OFF"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_GDK_PIXBUF=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_DOCUMENTATION=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"           # 设备 uname -s=HarmonyOS 而 SDK 无 Platform/HarmonyOS.cmake → 必须显式走 Linux 平台分支，否则共享库不带 SONAME、插件 DT_NEEDED 写进构建期路径
    - "-DSvtEnc_INCLUDE_DIR=<svt-av1 私有 prefix>/include"   # generate() 钉路径（FindSvtEnc.cmake 是 MODULE 模式）
    - "-DSvtEnc_LIBRARY=<svt-av1 私有 prefix>/lib/libSvtAv1Enc.so"
    # 包内树构建 SVT-AV1 3.1.2 的选项（conanfile.py _build_svt_av1()）
    - "-DCMAKE_SYSTEM_NAME=Linux"           # 子工程同样显式传（同因）
    - "-DBUILD_APPS=OFF"                    # 不构建 SvtAv1EncApp（本包不交付可执行文件，无 commands.json）
    - "-DBUILD_TESTING=OFF"                 # 不构建 SVT-AV1 自带测试
    - "-DSVT_AV1_LTO=OFF"                   # 规避交叉工具链 LTO/llvm-ar 链路风险

  # 编译依赖列表（格式: name/version）
  # 空：SVT-AV1 在包内树构建（制品仓无该包，R36 门禁下不能声明为 Conan 依赖）
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-svt-av1-3.1.2-ohos-no-thread-affinity.patch"

# ============================================================
# 测试
# ============================================================

# test_result 指本包的消费者测试（conan create 的 test_package）：14/14 通过。
# 上游 217 项用例**未运行**（本包交付面不含上游测试目标，BUILD_TESTING=OFF），
# 如实记为 NOT_RUN，不并入本字段、也不折算成通过率。
test_result: passed

# 上游用例清点（rule4）：与 PR 正文 / test_package/MANIFEST.yml / notes.md /
# reports/test-report.md 同源同单位——主 N = Catch2 TEST_CASE 注册数 = 217。
upstream_test_counts:
  unit: 217            # 用例/注册类最大值，即主 N
  integration: 0
  other: 0
  total: 217
  not_run: 217         # 本次实际运行 N′ = 0（PASS/FAIL/SKIP 均为 0）
  harmony_specific: 14 # test_package 消费者检查数（不进上游分母，单独成行）
  other_units:         # 其它口径只披露、不并入 N（单位不同，不得混用）
    ctest_add_test_all_switches_on: 39
    test_source_files_cc: 41
    assertions: 4016
  basis: >-
    父 tarball libheif 1.23.0（sha256 50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a）
    全量注册面；取数命令与逐项归因见 notes.md「上游测试清点」。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "「编解码插件子包」立项第一步是判依赖边界：先看上游是否 find_package/pkg_check_modules 该后端、再看树内有没有它的源码副本、最后用真实 conan install --build=never 探针确认制品仓有没有该包——三者缺一都会把结论带偏（本包：find_package(SvtEnc) + 树内无源码 + 制品仓无任何版本 → 只能内树构建）"   # knowledge_ref: E621
  - "R36 依赖门禁是机械的（finish step[5/10] 与 CI L0i 对每个 requires() 跑 conan download --only-recipe），所以「依赖没发布」不能靠写进 notes 绕过：要么先发布依赖，要么让包自包含（内树构建）。自包含在本仓库有已合并先例 handbrake/1.11.2（contribs 内树构建、requirements() 为空）"   # knowledge_ref: E621
  - "OHOS 上 CMAKE_SYSTEM_NAME 必须显式置 Linux：设备 uname -s 报 HarmonyOS，而 SDK 的 CMake 只有 Platform/OHOS.cmake、没有 Platform/HarmonyOS.cmake → 落「未知平台」回退（配置期打印 System is unknown to cmake, create: Platform/HarmonyOS），CMAKE_SHARED_LIBRARY_SONAME_* 未定义 → 共享库不带 SONAME（readelf -d 无 SONAME 行），插件 MODULE 把构建期路径写进 DT_NEEDED，运行期 dlopen 必失败。用 tc.variables（不是 cache_variables）才落进 conan_toolchain.cmake，内树子工程复用同一份 toolchain 时一并生效；子工程另需显式 -DCMAKE_SYSTEM_NAME=Linux"   # knowledge_ref: E621
  - "设备 libc++（_LIBCPP_VERSION 15004）在未定义 _LIBCPP_ENABLE_EXPERIMENTAL 时定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES，隐藏 std::ranges::all_of/find；上游 C++20 代码（libheif box.cc:4155/4156/4166）直接调用即报 no member named all_of in namespace std::ranges。generate() 里 tc.preprocessor_definitions['_LIBCPP_ENABLE_EXPERIMENTAL']=None 即可（编译期宏，无需 -lc++experimental）"   # knowledge_ref: E621
  - "archives/ 下的包目录不等于「制品仓里有这个包」：只有 manifest.yaml+notes.md(+patches/)、没有 conanfile.py/conandata.yml 的条目是另一个流程（cmd-pkgs，tarball 交付）的元数据孤儿。判据只能是 conan install/download 实测（R35），且必须带对照组（已发布包 rc=0 / 篡改版本号 rc=1）证明探针有效"   # knowledge_ref: E621
  - "包内树构建第二个源码的可行写法：URL 放 conandata.yml 的独立键（CI 的 mirror-fallback 与 pre-download 只扫 conandata.yml，硬编码进 conanfile.py 就失去预下载/镜像回退）、get() 落 source_folder 子目录、补丁用 apply_conandata_patches 的 base_path 字段定向到该子目录、子构建复用 CMakeToolchain 生成的 conan_toolchain.cmake（R33：编译配置全部来自 profile）"   # knowledge_ref: E621
  - "SVT-AV1 在 OHOS 上的两个真实边界：①svt_threads.h 的 EB_CREATE_THREAD 在 __linux__ 分支调用 pthread_setaffinity_np()，OHOS 的 clang 同时定义 __linux__ 与 __OHOS__ 但不提供该函数（补丁排除 __OHOS__）；②aarch64 走 NEON 路径、不需要 NASM，configure 实测 HAVE_ARM_PLATFORM/NEON_FLAG_SUPPORTED 均 Success"   # knowledge_ref: E621
  - "子包（父 tarball 内子模块）的上游 N 必须按父 tarball 全量注册面清点并取用例/注册类最大值：libheif 1.23.0 的 Catch2 TEST_CASE = 217，而 CTest add_test 只有 39（全开关上限）、测试源文件 41、断言 4016（另一单位，只披露）——只按 ctest 口径申报会被判少报（rule4）"   # knowledge_ref: E621
