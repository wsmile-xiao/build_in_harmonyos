software: libheif-svtenc
display: "libheif SVT-AV1 encoder plugin"
description: "SVT-AV1 (AV1) encoder backend plugin module for libheif, built in-tree from libheif's plugins/encoder_svt.cc as the upstream CMake target heif-svtenc"
category: gfx                      # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://github.com/strukturag/libheif"
license: LGPL-3.0-or-later
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "libheif 把编解码后端做成可独立装载的 MODULE 插件：树内目标 heif-<codec> → libheif-<codec>.so，装到 <libdir>/libheif/"
    - "插件模块不能脱离宿主运行：必须同源同版本、ENABLE_PLUGIN_LOADING=ON 的共享宿主；仓库既有 libheif/1.22.2 是插件装载关闭的 codec-free 核心，装不了插件"
    - "上游把默认插件目录编译期钉死（heif_version.h 的 LIBHEIF_PLUGIN_DIRECTORY = 构建时 <prefix>/lib/libheif），跨缓存/跨机不可移植 → 必须用 package_info().runenv_info 导出 LIBHEIF_PLUGIN_PATH（上游 plugins_unix.cc 读单数 PATH）"
    - "上游 FindSvtEnc.cmake 是 MODULE 模式（pkg-config + 无 HINTS 的 find_path/find_library），不认 CMakeDeps 的 config → 要用 cache 变量 SvtEnc_INCLUDE_DIR/SvtEnc_LIBRARY 直接钉住依赖路径"
    - "SVT-AV1 在 OHOS 上需要补丁：svt_threads.h 的 EB_CREATE_THREAD 在 __linux__ 分支调用 pthread_setaffinity_np()，OHOS 不提供该函数（__OHOS__ 排除到无线程亲和分支）"
    - "制品仓没有 svt-av1 包（任何版本/别名，W0 实测），故 SVT-AV1 在包内树构建；同形态已合并先例：archives/h/handbrake/1.11.2/conanfile.py 的 contribs 内树构建"
  common_dependencies: []          # 无 Conan 依赖（SVT-AV1 内树构建）

# 版本索引（所有已归档版本，含状态）
versions:
  "1.23.0":
    status: built                 # O5：仅 release upload 确认后才标 published
    build_date: "2026-09-20"
    conan_ref: "libheif-svtenc/1.23.0"
