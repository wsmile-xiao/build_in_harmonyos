# test_package/MANIFEST.yml
# 上游官方测试声明文件 — lsmount 0.2.4
#
# R51 上游测试清点（源包 18 个文件全量枚举，A 机实测证据见 notes.md「上游测试清点」节）：
#   1) 源包无 tests/ 与 test/ 目录：`ls -d tests test` -> "No such file or directory"
#   2) Makefile 无 check/test 目标：`make -n check` -> "make: *** No rule to make target 'check'.  Stop."
#      Makefile 全部目标 = all debug clean install uninstall manpage（6 个，无测试目标）
#   3) 源包文件清单（18 项）中不含任何测试源文件（*.c 5 个 + *.h 6 个均为产品代码，
#      其余为 Makefile/README/LICENSE/CHANGELOG.md/doc/lsmount.txt/share/*.rc*）
#   ⇒ 结论：上游确实无自动化测试（0 个静态用例、0 个 ctest/pytest 注册项），
#     不是"没跑"而是"没有"。本 PR 的可执行测试全部由 test_package 消费者测试与
#     test_ohos 鸿蒙特有验证承担。

package: lsmount/0.2.4
homepage: "https://www.lsmount.org"

# 上游测试命令（Makefile 无 check 目标 ⇒ 空）
upstream_check_command: ""

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 自带的消费者测试（调用已安装二进制，逐条真断言）
test_package_tests:
  - file: test.sh
    description: "消费者测试 T1..T9 / 28 条断言 —— 用受控 fixture 驱动已安装 lsmount 二进制，比对退出码与渲染内容（含 --help 版本串、--show-unused/--skip/--print-vertical/--use-alignment 行为差异、颜色开关、错误路径），并以本机 /proc/mounts 做行数与「设备+挂载点」两列逐行对账"
    command: "bash test.sh"

# 鸿蒙特有验证（真机专项）—— 计数口径经 W4 独立审计 r1 纠偏
ohos_tests:
  - file: test_ohos/run_ohos_test.sh
    description: "脚本内共 12 条 chk，其中 **T1..T4b 共 8 条为本组专项**（ELF 架构、PIE/RELRO/BIND_NOW 加固、宿主路径泄漏、OHOS 上 getpwuid() 返回 NULL 的空指针回归（修复前必致 SIGSEGV））；**T5a-T5d 共 4 条与 test_package 的 T9a/T9d/T9e/T9f 同源**（同一已安装二进制、同一本机 /proc/mounts、同一 hmfs/erofs/hmmac= 判据），本组保留它们作交叉复核但**不并入申报总数**。⇒ 全包不重复断言数 = 28 + 8 = 36。"
    command: "sh run_ohos_test.sh <已安装 lsmount 路径>"
    declared_unique: 8
    declared_cross_check: 4

# 上游测试断言总数（上游无测试 ⇒ 0，非"未统计"）
assertion_count: 0
