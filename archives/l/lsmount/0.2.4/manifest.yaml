status: built
build_date: "2026-09-25"
build_system: "makefile"

source:
  url: "https://github.com/Llandon/lsmount/archive/refs/tags/v0.2.4.tar.gz"
  sha256: "cb3cb9fb675278e513b038df20846638498912e94c38f85d789e9f6ae11fc67d"
  tar_format: tar.gz

build:
  system: makefile
  # 上游无 configure 脚本；以下"选项"是 make 命令行/环境覆盖，不改源码
  configure_options:
    - 'make CC="<conan conf tools.build:compiler_executables:c>"'
    - 'make LDFLAGS="-L<ncurses lib> -L<libconfig lib> -lncursesw -lconfig -z now"'
    - 'env CFLAGS += "-I<ncurses include> -D'\''gettext(x)=(x)'\'' ..."'
  dependencies:
    - libconfig/1.7.3
    - ncurses/6.5
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-lsmount.c-guard-null-getpwuid.patch"

knowledge_gained:
  - "裸 Makefile 把 CC/LDFLAGS 用 simple '=' 烧死 ⇒ 只有 make 命令行赋值能覆盖（env 无效）；CFLAGS/LDLIBS 用 '+=' ⇒ env 值被保留并追加，命令行赋值反而会把上游自身 flags 全丢掉"
  - "make install 目标烧死 /usr/bin + /etc + /usr/share/man 且依赖 a2x（asciidoc）生成 manpage ⇒ 不调用 make install，改由 package() 自行 staging，零补丁"
  - "OHOS sysroot 的 libintl.h 是 353 字节的空壳（不声明 gettext/textdomain/bindtextdomain）⇒ clang 下隐式声明 + -Wint-conversion 变错误；上游不带任何 .mo 语言目录 ⇒ NLS 本就是死代码，等价 E027 的 --disable-nls 做法是编译期把三个入口映射为 identity/no-op"
  - "ncurses/6.5 在制品仓只发布 libncursesw.a（无 libtermcap/libtinfo/.so），而上游 Makefile 第 8 行烧死 -ltermcap ⇒ 链接行必须改写为 -lncursesw（setupterm/tigetnum/del_curterm 均在其中，llvm-nm 实证 T setupterm / T tigetnum）"
  - "libconfig/1.7.3 包内自带的 lib/pkgconfig/libconfig.pc 不可重定位（prefix=/ ⇒ -I/include -L/lib）⇒ 必须用 Conan 的 PkgConfigDeps 生成的 .pc，不能让上游 pkg-config 直接命中包内 .pc"
  - "上游 main() 未判空即解引用 getpwuid(getuid())->pw_dir；鸿蒙 app uid（实测 20020105）不在 /etc/passwd ⇒ getpwuid 返回 NULL ⇒ 任何调用都 SIGSEGV(139)，连 --help 都跑不出来"
