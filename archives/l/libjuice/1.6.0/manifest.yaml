# 版本级 manifest — libjuice 1.6.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.0"

# 软件名
software: "libjuice"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/paullouisageneau/libjuice/archive/refs/tags/v1.6.0.tar.gz"

  # 源码校验和
  sha256: "90a13ed7049b97af4dcb494e5a82ebbffc41d29f917d17f0aa1b0b651034ae4c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）— 纯 C 库，仅系统 Threads
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libjuice 是纯 C (C11) CMake 库，无外部依赖，仅需系统 Threads；OHOS 上 CMake 提示 'System is unknown' 为非阻塞警告，configure 仍成功"
  - "test_package 消费测试必须只使用安装后的公共头 juice/juice.h 声明的 API（juice_crc32/juice_base64_* 为内部符号，未安装）"
  - "juice_set_local_ice_attributes 校验 ufrag>=4 且 pwd>=22 字符（RFC 8445），测试需用合法长度凭据"