# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libjuice/1.6.0
homepage: "https://github.com/paullouisageneau/libjuice"

# 上游测试命令: CMake 构建生成 juice-tests 可执行文件后直接运行
upstream_check_command: "cmake --build . && ./tests"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（CMake juice-tests，单二进制顺序执行全部用例）
upstream_tests:
  - file: test/main.c
    source: libjuice-1.6.0/test/main.c
    description: "CRC32 implementation test"
    command: "./tests"
  - file: test/main.c
    source: libjuice-1.6.0/test/main.c
    description: "base64 implementation test"
    command: "./tests"
  - file: test/main.c
    source: libjuice-1.6.0/test/main.c
    description: "STUN parsing implementation test"
    command: "./tests"
  - file: test/main.c
    source: libjuice-1.6.0/test/main.c
    description: "candidates gathering test"
    command: "./tests"
  - file: test/connectivity.c
    source: libjuice-1.6.0/test/connectivity.c
    description: "connectivity test (local candidates, controlled/controlling)"
    command: "./tests"
  - file: test/thread.c
    source: libjuice-1.6.0/test/thread.c
    description: "thread-mode connectivity test"
    command: "./tests"
  - file: test/mux.c
    source: libjuice-1.6.0/test/mux.c
    description: "mux-mode connectivity test"
    command: "./tests"
  - file: test/notrickle.c
    source: libjuice-1.6.0/test/notrickle.c
    description: "non-trickled connectivity test"
    command: "./tests"
  - file: test/conflict.c
    source: libjuice-1.6.0/test/conflict.c
    description: "connectivity test with role conflict"
    command: "./tests"
  - file: test/bind.c
    source: libjuice-1.6.0/test/bind.c
    description: "connectivity test with bind address"
    command: "./tests"
  - file: test/ufrag.c
    source: libjuice-1.6.0/test/ufrag.c
    description: "ufrag test"
    command: "./tests"
  - file: test/stun-unhandled.c
    source: libjuice-1.6.0/test/stun-unhandled.c
    description: "unhandled STUN message test"
    command: "./tests"
  - file: test/stun-unhandled-multiple.c
    source: libjuice-1.6.0/test/stun-unhandled-multiple.c
    description: "multiple handler unhandled STUN message test"
    command: "./tests"
  - file: test/stun-unhandled-unhandle.c
    source: libjuice-1.6.0/test/stun-unhandled-unhandle.c
    description: "unhandled, unhandled STUN message test"
    command: "./tests"
  - file: test/stun-unhandled-no-host.c
    source: libjuice-1.6.0/test/stun-unhandled-no-host.c
    description: "no host unhandled STUN message test"
    command: "./tests"
  - file: test/server.c
    source: libjuice-1.6.0/test/server.c
    description: "server test"
    command: "./tests"
  - file: test/turn.c
    source: libjuice-1.6.0/test/turn.c
    description: "TURN server test"
    command: "./tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: agent 公共 API 调用"
    command: "./test_libjuice"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18