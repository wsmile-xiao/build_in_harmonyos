# 版本级 manifest
# 文件位置: archives/l/libpsml/2.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.1.0"
software: "libpsml"

# 编译状态：built（配方已验证结构；待真机预检通过后由 HMBS 统一提交）
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: "cmake"

source:
  url: "https://gitlab.com/siesta-project/libraries/libpsml/-/archive/2.1.0/libpsml-2.1.0.tar.gz"
  sha256: "2977d4a83c06cb4c1bbe870d192ab1efd335e5bb78ee8f5ac3d51ce2cd2c0c60"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DXMLF90_SOURCE_DIR=<source>/external/xmlf90-1.6.3"
    - "-DCMAKE_SYSTEM_NAME=OHOS"
    - "-DCMAKE_Fortran_COMPILER=<flang-ohos/20.1.0>/bin/flang"
  dependencies:
    - "flang-ohos/20.1.0"
  cc: clang
  cxx: clang++
  fc: flang

patches_applied:
  - "patches/0001-xmlf90-scratch-tmpdir-fallback.patch"

knowledge_gained:
  - "HarmonyOS 上 Fortran STATUS=SCRATCH 不可用（libc tmpfile 无 /tmp 可用）：xmlf90 find_eor_eof 每次 open_xmlfile 都 STOP 'Cannot open test file'，12 项 ctest 未及断言全灭；修法是保留 SCRATCH 快捷路径 + 回退到 $TMPDIR/$TMP/$TEMP/当前目录的显名临时文件（用完即删），EOR/EOF 探测语义不变"
  - "纯 Fortran 库在 OHOS 上的标准解法：flang-ohos/20.1.0 tool_requires（netcdf-fortran/fortran-shlex 先例），.mod 私有接口要求消费方同工具链（package_id_mode full_mode）"
  - "conan 默认 CMAKE_SYSTEM_NAME=HarmonyOS 与 cmake 自带 Platform/OHOS.cmake 对不上，必须显式覆写为 OHOS，否则 SONAME 为空传染下游（netcdf-fortran 先例）"
  - "上游 LibpsmlFindPackage 支持 XMLF90_SOURCE_DIR 离线注入；xmlf90-1.6.3 作 conandata 第二源双 get() 下载校验，构建期零 git clone（E668 模式）"
  - "ctest 计数唯一确定源为 Testing/Temporary/LastTest.log（N/M Testing 头分母 + verdict 短语单遍计数）；LastTest.log 里没有 Test #K 行，stdout 风格正则必然数出 0/0"
