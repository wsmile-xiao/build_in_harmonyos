# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法: 解压上游源码包 → 读 examples/CMakeLists.txt 与
# xmlf90-1.6.3/doc/Examples/sax/features/CMakeLists.txt 的 add_test()
# 注册项（ctest -N 同口径）。
#
# 上游测试盘点（均为 ctest 注册项，无自建）：
#   libpsml 2.1.0 examples/ 6 项：libpsml_getz、libpsml_getz_die、
#     libpsml_getz_stat_non_existent、libpsml_getz_stat_parsing、
#     libpsml_show、libpsml_mgga。
#   xmlf90 1.6.3（第二源，随本包构建，add_subdirectory 带入 ctest）
#     doc/Examples/sax/features/ 6 项：XMLF90_SAX_Features、
#     XMLF90_SAX_check、XMLF90_SAX_check_stat、XMLF90_SAX_Malformed、
#     XMLF90_SAX_Malformed_stat、XMLF90_SAX_BadEntity。
#   examples/run_*.sh 与 run_test.sh 是手工安装检查脚本（非 ctest
#   注册，不计入总数；ctest 6 项已覆盖其等价路径）。
# 分母口径：ctest_entries（官方 ctest 注册数，与 `ctest -N` 一致）。

package: libpsml/2.1.0
homepage: "https://gitlab.com/siesta-project/libraries/libpsml"

# 上游测试命令
upstream_check_command: "ctest -N && ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure（在打包阶段内的 build 目录执行）"

# ctest 注册总数：libpsml 6 + xmlf90 6 = 12
upstream_test_total: 12
upstream_test_count_method: ctest_entries
upstream_tests:
  - file: examples/getz.F90
    source: libpsml-2.1.0/examples/getz.F90
    description: "libpsml_getz：解析 80_Hg.psml 并断言 Solver 输出含 80"
    command: "ctest -R libpsml_getz"
  - file: examples/getz.F90
    source: libpsml-2.1.0/examples/getz.F90
    description: "libpsml_getz_die：不存在的文件触发 custom psml_die"
    command: "ctest -R libpsml_getz_die"
  - file: examples/getz_stat.F90
    source: libpsml-2.1.0/examples/getz_stat.F90
    description: "libpsml_getz_stat_non_existent：stat 返回非零而非 die"
    command: "ctest -R libpsml_getz_stat_non_existent"
  - file: examples/getz_stat.F90
    source: libpsml-2.1.0/examples/getz_stat.F90
    description: "libpsml_getz_stat_parsing：畸形 bad.psml 的 stat/报错路径"
    command: "ctest -R libpsml_getz_stat_parsing"
  - file: examples/show_psml.F90
    source: libpsml-2.1.0/examples/show_psml.F90
    description: "libpsml_show：-p 画 projector 数据并匹配参照行"
    command: "ctest -R libpsml_show"
  - file: examples/show_psml.F90
    source: libpsml-2.1.0/examples/show_psml.F90
    description: "libpsml_mgga：mgga.psml 的 MGGA 泛函分支输出"
    command: "ctest -R libpsml_mgga"
  - file: doc/Examples/sax/features/example.F90
    source: xmlf90-1.6.3/doc/Examples/sax/features/example.F90
    description: "XMLF90_SAX_Features：SAX 特性解析（Mary had a little lamb）"
    command: "ctest -R XMLF90_SAX_Features"
  - file: doc/Examples/sax/features/xmlcheck.f90
    source: xmlf90-1.6.3/doc/Examples/sax/features/xmlcheck.f90
    description: "XMLF90_SAX_check：合法 test.xml 字符统计"
    command: "ctest -R XMLF90_SAX_check"
  - file: doc/Examples/sax/features/xmlcheck_stat.f90
    source: xmlf90-1.6.3/doc/Examples/sax/features/xmlcheck_stat.f90
    description: "XMLF90_SAX_check_stat：stat 版合法解析"
    command: "ctest -R XMLF90_SAX_check_stat"
  - file: doc/Examples/sax/features/xmlcheck.f90
    source: xmlf90-1.6.3/doc/Examples/sax/features/xmlcheck.f90
    description: "XMLF90_SAX_Malformed：畸形 XML 的报错路径"
    command: "ctest -R XMLF90_SAX_Malformed"
  - file: doc/Examples/sax/features/xmlcheck_stat.f90
    source: xmlf90-1.6.3/doc/Examples/sax/features/xmlcheck_stat.f90
    description: "XMLF90_SAX_Malformed_stat：stat 版畸形报错"
    command: "ctest -R XMLF90_SAX_Malformed_stat"
  - file: doc/Examples/sax/features/xmlcheck_stat.f90
    source: xmlf90-1.6.3/doc/Examples/sax/features/xmlcheck_stat.f90
    description: "XMLF90_SAX_BadEntity：非法实体的 Parsing error 路径"
    command: "ctest -R XMLF90_SAX_BadEntity"

# test_package 中自带的测试 (消费者视角验证, R34: 真实链接并调用 libpsml API)
test_package_tests:
  - file: run_consumer.sh
    description: "L0c 薄包装器（POSIX sh）：仅按 <binary> <fixture> <log> 透传并 exec 真实 Fortran 消费者二进制，不含断言；计数源仍为消费者程序自身汇总行"
    command: "sh run_consumer.sh ./test_libpsml_consumer fixtures/14_Si.psml"
  - file: test_libpsml_consumer.f90
    description: >-
      消费者视角 4 个检查：(1) 解析随包 fixture 14_Si.psml（上游原文件逐字复制）；
      (2) 原子序数 == 14（同上游 getz 断言）；(3) 元素符号 == Si；
      (4) 缺失文件 stat 非零返回（同上游 getz_stat 错误路径）。唯一计数源为程序
      自身汇总行 LIBPSML_CONSUMER N/M CHECKS PASSED。
    command: "./test_libpsml_consumer fixtures/14_Si.psml"
  - file: fixtures/14_Si.psml
    description: "上游 examples/14_Si.psml 逐字复制的解析夹具（103 KB，ONCVPSP Si 赝势）"
    command: "./test_libpsml_consumer fixtures/14_Si.psml"

# 测试断言总数 (4 个消费者检查；上游 12 项待真机预检回填实测)
assertion_count: 4
