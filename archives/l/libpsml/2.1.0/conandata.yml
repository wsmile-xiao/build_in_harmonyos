sources:
  "2.1.0":
    # 有序回退（2026-10-04 真机 compile 阶段 gitlab.com 连续
    # ReadTimeout/ConnectTimeout，conan 内置重试耗尽后失败）：
    # gitlab.com 无 CI 已维护镜像映射（ci/conan/build_and_test.sh 仅覆盖
    # github/gnu/gnome/kernel/pypi 等域），且 2026-10-02 已逐一实测 10 类
    # 候选——gh-proxy/moeyy/ghfast/gitclone 等代理 403/404（GitHub 专用），
    # gitlab API 归档与 SIESTA upload 静态包 sha 均与配方不一致，
    # Debian/Gentoo 为重打包或未收录——无字节完全相同的可信异地镜像。
    # 按守则保留官方原 URL：以列表声明两次，conan get() 按序尝试且每个条目
    # 各带内置重试退避，瞬时路由超时时重试预算翻倍；sha256 保持不变，
    # source() 取源逻辑不动。
    url:
      - "https://gitlab.com/siesta-project/libraries/libpsml/-/archive/2.1.0/libpsml-2.1.0.tar.gz"
      - "https://gitlab.com/siesta-project/libraries/libpsml/-/archive/2.1.0/libpsml-2.1.0.tar.gz"
    sha256: "2977d4a83c06cb4c1bbe870d192ab1efd335e5bb78ee8f5ac3d51ce2cd2c0c60"
  "xmlf90-1.6.3":
    # 第二源同宿主 gitlab.com，同等有序重试处理，sha256 保持不变。
    url:
      - "https://gitlab.com/siesta-project/libraries/xmlf90/-/archive/1.6.3/xmlf90-1.6.3.tar.gz"
      - "https://gitlab.com/siesta-project/libraries/xmlf90/-/archive/1.6.3/xmlf90-1.6.3.tar.gz"
    sha256: "79a30b60cfff4fbcb299ae86697b39c3e54c8b8811adeffa41a0df82bc70500b"

patches:
  "2.1.0":
    - patch_file: "patches/0001-xmlf90-scratch-tmpdir-fallback.patch"
      patch_description: "OHOS portability: xmlf90 find_eor_eof opened its EOR/EOF probe file with STATUS=SCRATCH (runtime creates an unnamed temp file via libc tmpfile, i.e. under /tmp), which is missing or not writable on HarmonyOS, so every open_xmlfile STOPped with 'Cannot open test file' and all 12 ctest items failed before doing any real work. Keeps SCRATCH as the fast path and falls back to an explicitly-named temp file under $TMPDIR/$TMP/$TEMP, then the current directory (deleted on close), preserving the EOR/EOF probing semantics; no test assertion is weakened."
      patch_type: "portability"
