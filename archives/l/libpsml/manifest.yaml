software: libpsml
display: "libpsml"
description: "处理 PSML 赝势文件的前端库（SIESTA/ESL 生态，Fortran）"
category: library
homepage: "https://gitlab.com/siesta-project/libraries/libpsml"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 Fortran 工程（LANGUAGES Fortran），用仓库 flang-ohos/20.1.0 作 tool_requires（同 netcdf-fortran/fortran-shlex 先例）"
    - "CMAKE_SYSTEM_NAME 固定为 OHOS（conan 默认 HarmonyOS 会导致平台变量留空，同 netcdf-fortran 先例）"
    - "xmlf90 依赖以上游自带 LibpsmlFindPackage 的 source 机制离线注入：source() 双 get() 下载并校验，generate() 传 -DXMLF90_SOURCE_DIR，杜绝构建期 git clone（E668 模式）"
    - "上游 ctest 全量运行（libpsml 6 项 + 随构建的 xmlf90 6 项），LastTest.log 单一确定源计数并上报标记"
  common_dependencies:
    - "flang-ohos/20.1.0"

versions:
  "2.1.0":
    status: built
    build_date: "2026-10-01"
    source_url: "https://gitlab.com/siesta-project/libraries/libpsml/-/archive/2.1.0/libpsml-2.1.0.tar.gz"
