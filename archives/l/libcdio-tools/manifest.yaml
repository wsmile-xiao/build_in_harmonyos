software: libcdio-tools
display: "libcdio-tools"
description: "libcdio 2.3.0 命令行工具集，提供 CD-ROM 与 ISO-9660/UDF 镜像检查和读取能力"
category: data
homepage: "https://www.gnu.org/software/libcdio/"
license: GPL-3.0-or-later
build_system: autotools
package_type: application

ohos_adaptation:
  key_points:
    - "复用已适配的 libcdio/2.3.0 静态库，仅编译并打包六个上游命令行工具，不重复打包库实现"
    - "补齐 config.guess/config.sub 对 HarmonyOS 三元组的识别，并修复 HMDFS 下 configure 临时目录权限问题"
    - "使用 HarmonyOS binary-sign-tool 对安装后的 ELF 签名"
    - "消费者测试运行全部六个安装后工具，并使用上游 2.3.0 CUE/BIN/ISO 固定数据进行输出比对"
  common_dependencies:
    - libcdio/2.3.0

versions:
  "2.3.0":
    status: verified
    build_date: "2026-09-24"
    conan_ref: "libcdio-tools/2.3.0"
