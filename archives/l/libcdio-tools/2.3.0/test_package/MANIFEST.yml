# test_package/MANIFEST.yml
# Upstream test declaration for libcdio-tools 2.3.0 (CI L0e).

package: libcdio-tools/2.3.0
homepage: "https://www.gnu.org/software/libcdio/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# The upstream 2.3.0 check suite builds and exercises the in-tree libcdio and
# libiso9660 implementations plus their C test programs. This recipe packages
# only the six installed command-line tools and links the already adapted
# libcdio/2.3.0 dependency, so no upstream test count is claimed here.
upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "libcdio-2.3.0.tar.gz"
  source_sha256: "37bcb13296febbcff9dc4485834bac09212cb463c31fcea52f70ee1dd3a5a5de"
  scope: "library_and_tool_integration"
  registered_by_upstream:
    test/check_PROGRAMS: 12
    test/check_SCRIPTS: 12
    recursive_test_subdirectories:
      - test/data
      - test/driver
  reason: >-
    Running the upstream check suite here would rebuild and test the in-tree
    libraries rather than the installed libcdio/2.3.0 dependency used by the
    packaged tools. The tool package therefore verifies its public executable
    behavior with the upstream 2.3.0 CUE, BIN, ISO-9660 and text fixtures.
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Runs all six installed tools and compares tool output with upstream 2.3.0 fixtures"
    command: "bash test.sh <package>/bin <decoded-fixtures-dir>"
  - file: conanfile.py
    description: "Conan consumer entry point: decodes the base64 binary fixtures, verifies their SHA256, runs test.sh under VirtualRunEnv and target execution checks"
    command: "conan test test_package"

assertion_count: 12
