software: libcdio-tools
version: "2.3.0"
status: verified
build_system: autotools-configure-direct-clang
package_type: application
license: GPL-3.0-or-later

source:
  url: "https://github.com/libcdio/libcdio/releases/download/2.3.0/libcdio-2.3.0.tar.gz"
  sha256: "37bcb13296febbcff9dc4485834bac09212cb463c31fcea52f70ee1dd3a5a5de"

dependencies:
  - ref: libcdio/2.3.0
    use: "Link the command-line tools; no library implementation is vendored or packaged"

package_contents:
  - bin/cd-drive
  - bin/cd-info
  - bin/cd-read
  - bin/iso-info
  - bin/iso-read
  - bin/mmc-tool
  - licenses/COPYING

upstream_test_scope:
  make_check_run_in_tool_package: false
  reason: >-
    Upstream make check rebuilds and exercises the in-tree libcdio libraries and
    test programs. Those tests belong to the libcdio/2.3.0 library package. The
    tools package links the mature installed library and validates the public
    executable behavior through test_package instead.
  library_owned_examples:
    - test/test*.c
    - test/driver/*
    - test/check_udf.sh
    - example/*
  tool_behavior_verified_here:
    - "VERIFIED: all six installed tools execute --version and report 2.3.0"
    - "VERIFIED: cd-drive enumerates compiled drivers without requiring media"
    - "VERIFIED: cd-info analyzes an upstream CUE/BIN fixture with exact output comparison"
    - "VERIFIED: cd-read reads MODE1 sectors with exact upstream output comparison"
    - "VERIFIED: iso-info lists an upstream ISO-9660 image with exact output comparison"
    - "VERIFIED: iso-read extracts a file with byte-for-byte comparison"
  device_only_not_verified:
    - "mmc-tool operations that require a real MMC optical device"

opendesk:
  job_id: "20260924-154132-7dfcec-libcdio-tools-2.3.0-v4"
  create_exit: 0
  test_package_result: "PASS assertions=12 tools=6 behaviors=5"
  device: "HarmonyOS aarch64; HongMeng Kernel 1.12.0"
  failed_predecessors:
    - job_id: "20260924-153436-77dc8b-libcdio-tools-2.3.0-v2"
      create_exit: 1
      reason: "Conan get() rejected the unsupported mirrors keyword"
    - job_id: "20260924-153903-5d189d-libcdio-tools-2.3.0-v3"
