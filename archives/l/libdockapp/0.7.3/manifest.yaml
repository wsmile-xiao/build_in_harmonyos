software: libdockapp
display: "libdockapp"
version: "0.7.3"
upstream_name: libdockapp
upstream_version: "0.7.3"
status: built
conan_ref: "libdockapp/0.7.3"
build_system: autotools
build_date: "2026-09-20"
compile_date: "2026-09-20"
target_platform: aarch64-unknown-linux-ohos
issue: "知识库扩展"

source:
  url: "https://www.dockapps.net/download/libdockapp-0.7.3.tar.gz"
  sha256: "16d992f684dfcdb19e3682822d495f473615fba6e9e2fa7a106307bc767b389c"
  tar_format: tar.gz
  version_mapping: "Conan libdockapp/0.7.3 maps directly to upstream libdockapp 0.7.3 and libdockapp.so.3.0.1."

build:
  system: autotools
  configure_options:
    - "--without-font"
    - "--without-examples"
    - "--enable-shared"
    - "--disable-static"
    - "MKFONTDIR=/system/bin/true"
  dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0"
    - "libxpm/3.5.17"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

validation:
  local:
    - "Official source SHA-256 verified."
    - "Upstream make check and the installed-package consumer test are executed by conan create."
    - "The consumer contains 25 assertions, including a HarmonyOS PC aarch64-specific assertion."
  remote:
    - "HarmonyOS PC conan create passed with recipe revision bb168856ac0f89767afffa6312d1a740."
    - "Upstream make check completed successfully (0 formal upstream tests)."
    - "Installed-package consumer test passed 25/25 assertions, including the HarmonyOS PC aarch64-specific assertion."
    - "Published ELF is AArch64, has SONAME libdockapp.so.3, one .codesign section, and no RPATH/RUNPATH."
    - "Installed dockapp.pc is relocatable and contains no Conan cache path."
  pending:
    - "GitCode CI / REL upload"

knowledge_gained:
  - "The 2018 GNU config scripts shipped by libdockapp 0.7.3 do not recognize HarmonyOS; two minimal portability patches add canonical linux-ohos handling and avoid config.guess compiler probing on HarmonyOS."
  - "The release declares no TESTS or check_PROGRAMS, so make check runs the canonical but empty upstream test target; installed-package coverage is supplied by 25 display-independent assertions."
  - "Fonts and example applications are optional and disabled for the library package, avoiding X server and font-util runtime requirements while preserving the complete public library ABI."
