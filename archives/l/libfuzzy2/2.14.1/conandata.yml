# conandata.yml — libfuzzy2 2.14.1
# R10: ordered URL list — CI-maintained GitHub mirror (build_and_test.sh
# maps github.com -> gh-proxy.com first, official last) so a single
# release-assets.githubusercontent.com read-timeout no longer fails
# source(); conan get() tries each in order. Same archive, sha256 kept.
sources:
  url:
    - "https://gh-proxy.com/https://github.com/ssdeep-project/ssdeep/releases/download/release-2.14.1/ssdeep-2.14.1.tar.gz"
    - "https://github.com/ssdeep-project/ssdeep/releases/download/release-2.14.1/ssdeep-2.14.1.tar.gz"
  sha256: "ff2eabc78106f009b4fb2def2d76fb0ca9e12acf624cbbfad9b3eb390d931313"

# No patches needed (R6): release tarball ships configure; OHOS triplet is
# passed via configure_args and the ssdeep -static tweak is a build-tree
# Makefile edit, not a source patch.
patches: {}
