# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfuzzy2/2.14.1
homepage: "https://github.com/ssdeep-project/ssdeep"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: ssdeep-2.14.1.tar.gz, sha256 ff2eabc78106f009b4fb2def2d76fb0ca9e12acf624cbbfad9b3eb390d931313)
upstream_test_audit:
  source_tarball: "ssdeep-2.14.1.tar.gz"
  source_sha256: "ff2eabc78106f009b4fb2def2d76fb0ca9e12acf624cbbfad9b3eb390d931313"
  top_level_files:
    - configure.ac        # 仅编译探测 (AC_PROG_CC/CXX, libtool, 头文件检查); 无 AC_CONFIG_TESTDIR / 测试宏
    - Makefile.am         # 仅 bin_PROGRAMS=ssdeep + lib_LTLIBRARIES=libfuzzy.la; 无 TESTS / check_PROGRAMS / check-local
    - fuzzy.c             # 库实现, 无 TEST() / TEST_F (gtest)
    - fuzzy.h             # 公共 API 头文件
    - sample.c            # 演示程序 (非测试框架, 无断言统计)
    - normal.sh           # 仅 distclean + configure + make 重建脚本
    - test-against-old.sh # 手工兼容性脚本 (需旧版 ssdeep-2.9 二进制 + 主机 /usr/bin 等路径, 非可运行套件)
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest 目标"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树无 tests/ 目录; find 仅命中 test-against-old.sh 手工脚本; Makefile.am 无 TESTS/check_PROGRAMS; configure.ac 无测试宏"
  make_check_output: "make -n check 展开为空 (check-am: all-am) — automake 默认空目标, make check 执行 0 用例退出 0"
  reason: "ssdeep 2.14.1 官方源码包不含任何自动化测试套件: 无 tests/ 目录、无测试源文件、无 TESTS/check_PROGRAMS 目标、configure.ac 无测试宏; sample.c 为演示程序, normal.sh/test-against-old.sh 非可运行套件。功能验证由 test_package 真实调用 libfuzzy API (hash buf/file + compare) 完成"

# 上游测试命令 (无测试套件, 故 check 命令不适用)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test_fuzzy.c
    description: "消费者 API 测试: fuzzy_hash_buf + fuzzy_hash_filename + fuzzy_compare 相同 100 分 + 近似输入可比 (4 断言)"
    command: "test_fuzzy"
  - file: conanfile.py
    description: "Conan test() 入口, 编译运行 test_fuzzy 并输出 HMBS 机器证据标记 (test_package discovered=4/passedCount=4 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test_fuzzy.c 的 4 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=4 一致)
# 1. fuzzy_hash_buf 成功且输出非空
# 2. fuzzy_hash_filename 成功且输出非空
# 3. fuzzy_compare 相同签名 == 100
# 4. 近似输入 hash 成功且 fuzzy_compare 返回有效分数
assertion_count: 4
