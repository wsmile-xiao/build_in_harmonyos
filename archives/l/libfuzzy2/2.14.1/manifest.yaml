software: libfuzzy2

version: "2.14.1"
status: built
build_date: "2026-09-15"
conan_ref: "libfuzzy2/2.14.1"

source:
  url: "https://github.com/ssdeep-project/ssdeep/releases/download/release-2.14.1/ssdeep-2.14.1.tar.gz"
  sha256: "ff2eabc78106f009b4fb2def2d76fb0ca9e12acf624cbbfad9b3eb390d931313"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static --disable-shared (shared=False default)"
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-ohos (OHOS only)"
  dependencies: []
  cc: clang
  cxx: clang++

# R6: no source patches; ssdeep -static is fixed via build-tree Makefile edit.
patches_applied: []

knowledge_gained:
  - "Release tarball ships configure; no autoreconf/bootstrap needed"
  - "libtool version-info 3:0:1 gives SONAME libfuzzy.so.2 (Debian libfuzzy2)"
  - "OHOS triplet avoids 2017-era config.guess not knowing aarch64-linux-ohos"
  - "Upstream has no automated test suite; make check is automake empty target"
