# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsv/1.2
homepage: "https://github.com/uael/sv"

# 上游测试命令（CMake 顶层构建时 enable_testing 注册 7 个程序）
upstream_check_command: "ctest --output-on-failure"

upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

upstream_tests:
  - file: test/version.c
    description: "semver 解析/写回，含 v 前缀、prerelease、build 元数据与非法输入（49 例）"
    command: "./test_version"
  - file: test/comp.c
    description: "比较器解析/写回与失败路径（77 例）"
    command: "./test_comp"
  - file: test/range.c
    description: "range 解析/写回：x-range、hyphen、tilde 展开（34 例）"
    command: "./test_range"
  - file: test/match.c
    description: "比较器与 range 匹配语义（93 例）"
    command: "./test_match"
  - file: test/utils.c
    description: "内部工具函数"
    command: "./test_utils"
  - file: test/usage.c
    description: "端到端用法场景（assert 断言）"
    command: "./test_usage"
  - file: test/semvers.c
    description: "semvers 向量 push/unshift/sort 场景"
    command: "./test_semvers"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sv.c
    description: "验证安装后的 libsv：解析/写回往返/比较语义/比较器与 range 匹配/semvers 向量/非法输入拒绝"
    command: "./test_sv"

# 测试断言总数 (test_sv.c 中 CHECK 宏调用数)
assertion_count: 26
