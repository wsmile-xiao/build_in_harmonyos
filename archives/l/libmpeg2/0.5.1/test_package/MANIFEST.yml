package: libmpeg2/0.5.1
homepage: "https://libmpeg2.sourceforge.io/"
upstream_check_command: "test/regression test/tests c"
upstream_test_in_build: true
upstream_test_command: "python3 run-upstream-73.py --decoder mpeg2dec --data-root cvs-suite-20261006 --manifest cvs-suite-20261006/manifest.tsv --upstream-tests test/tests"
upstream_tests:
  - file: test/regression
    source: libmpeg2-0.5.1.tar.gz/test/regression
    description: "73 MPEG stream cases; 68 MD5+dump and 5 upstream IGNORE-MD5 dump checks, executed inside Conan build() on OHOS"
    command: "test/regression test/tests c"
test_package_tests:
  - file: test.c
    description: "HarmonyOS installed-package end-to-end consumer: read a 12-frame MPEG2 stream in 7-byte chunks, decode and convert RGB24, verify reference pixel hashes, write/read PPM files in a task-private writable directory, and clean up"
    command: "./test_libmpeg2"
logical_test_count: 74
