software: libmodulemd
display: "libmodulemd"
description: "C library for manipulating module metadata (modulemd) files"
category: data
homepage: "https://github.com/fedora-modularity/libmodulemd"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 构建；OHOS 上禁用 rpmio（免除 rpm 整条依赖链），压缩探测走上游内置实现"
    - "OHOS 无 gobject-introspection/gtk-doc/pygobject：skip_introspection/无文档/无 man 页/无 Python 绑定"
    - "glib2 缺 gobject-2.0 单模块 .pc、libyaml 无 yaml-0.1.pc：generate() 补写兼容 .pc"
    - "test-import-headers.sh 硬编码 gcc/g++：测试时私有软链接指向 clang"
    - "meson install 破坏 OHOS ELF 自签：package 后重签（E077 模式）"
  common_dependencies:
    - "glib2"
    - "libyaml"

versions:
  "2.15.3":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libmodulemd/2.15.3"
