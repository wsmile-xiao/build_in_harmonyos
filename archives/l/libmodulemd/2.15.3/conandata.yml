# Vendored libyaml sources (2nd strategy cycle, 2026-09-14): the published
# libyaml/0.2.5 recipe rebuilds from source on OHOS via CMakeToolchain and
# fails before this recipe ever runs (see conanfile.py requirements note).
# The same official tarball is refetched here and compiled with direct-cc
# into a private prefix; no extra patch, same sha256 as the libyaml recipe.
yaml_sources:
