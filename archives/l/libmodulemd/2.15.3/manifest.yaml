# 版本级 manifest
# 文件位置: archives/l/libmodulemd/2.15.3/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "2.15.3"
software: libmodulemd
status: built
build_date: "2026-09-14"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/fedora-modularity/libmodulemd/releases/download/2.15.3/modulemd-2.15.3.tar.xz"
  sha256: "931b44eabdd5f7d170803f3476397c8e9dea07209589e1194ff8379429991ccb"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
  - "-Ddefault_library=static"
  - "-Drpmio=disabled"
  - "-Dskip_introspection=true"
  - "-Dwith_docs=false"
  - "-Dwith_manpages=disabled"
  - "-Dwith_py2=false"
  - "-Dwith_py3=false"
  - "-Dwrap_mode=nodownload"
  dependencies:
  - glib2/2.88.0
  tool_requires:
  - pkgconf/3.0.5
  # libyaml/0.2.5 已去 requires：其官方源码（同 URL/sha256，见 conandata.yml
  # yaml_sources）随包直编静态交付，不再触发 Conan 依赖构建。
  # zlib/1.3.1.2（override=True）：覆盖 glib2 钉死的 zlib/1.3.1（远端仍为
  # 旧 CMake 配方）；同上游 ABI，改用树内已验证的 Makefile 配方构建。
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
- "patches/0001-meson-bash-sh-fallback.patch"

# ============================================================
# 测试结果（实测值待 HMBS 真机预检回填；81 为源码审计清点数）
# ============================================================

test_results:
  type: official
  upstream_command: "meson test -C build --print-errorlogs"
  total: 81
  note: "首轮工作树未验证；passed/failed 待 HMBS 真机预检回填实测值"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "libyaml 不安装 yaml-0.1.pc、glib2 缺 gobject-2.0 单模块 .pc：generate() 补写兼容 .pc 供 meson dependency() 解析（模式同 at-spi2-core）"
- "test-import-headers.sh 硬编码 gcc/g++：build 内私有 bindir 软链接 gcc->clang、g++->clang++（仅测试环境，不进配方产物）"
- "rpmio=disabled 免除 rpm 整条依赖链；压缩格式探测走上游内置实现，config.h 以 HAVE_RPMIO=0 守卫"
