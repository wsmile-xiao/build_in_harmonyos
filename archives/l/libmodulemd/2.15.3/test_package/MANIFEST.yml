# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libmodulemd/2.15.3
homepage: "https://github.com/fedora-modularity/libmodulemd"

# 上游测试命令 (meson test 全量；配方 build() 内真实执行)
upstream_check_command: "meson test -C build --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test -C build --print-errorlogs"

# 上游实际运行的测试程序（with_py3=false 时共 81 项，见 notes.md 清点表）
upstream_tests:
  - file: tests/test-modulemd-build-config.c
    source: modulemd-2.15.3/modulemd/tests/test-modulemd-build-config.c
    description: "Modulemd build-config GTest suite"
    command: "meson test buildconfig_debug buildconfig_release"
  - file: tests/test-modulemd-moduleindex.c
    source: modulemd-2.15.3/modulemd/tests/test-modulemd-moduleindex.c
    description: "Modulemd module-index GTest suite"
    command: "meson test module_index_debug module_index_release"
  - file: tests/test-modulemd-modulestream.c
    source: modulemd-2.15.3/modulemd/tests/test-modulemd-modulestream.c
    description: "Modulemd module-stream GTest suite"
    command: "meson test modulestream_debug modulestream_release"
  - file: tests/test-modulemd-validator.c
    source: modulemd-2.15.3/modulemd/tests/test-modulemd-validator.c
    description: "modulemd-validator CLI tests (32 cases)"
    command: "meson test --suite modulemd_validator"
  - file: tests/test-import-headers.sh
    source: modulemd-2.15.3/modulemd/tests/test-import-headers.sh
    description: "Public header import smoke test (gcc + g++)"
    command: "meson test test_import_headers"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_modulemd.c
    description: "消费者测试：ModuleStream 创建/属性/NSVC/拷贝相等 + ModuleIndex 建索引/查询/导出 YAML（8 检查）"
    command: "./test_modulemd"
  - file: test_modulemd.c
    description: "随包 modulemd-validator CLI 冒烟（--version 真实运行）"
    command: "modulemd-validator --version"

# 测试断言总数
assertion_count: 8
