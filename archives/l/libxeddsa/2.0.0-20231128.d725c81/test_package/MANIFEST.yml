package: libxeddsa/2.0.0-20231128.d725c81
homepage: "https://github.com/Syndace/libxeddsa"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (run from <build_folder>, BUILD_SHARED_LIBS=OFF registers 2 tests)"

upstream_tests:
  - file: test/test.c
    source: libxeddsa-d725c816bb26483ac397ce0d19de5ad2972955f1/test/test.c
    description: "Upstream test runner: xeddsa_init plus three suites (signing, conversion uniqueness, public key derivation) in one binary registered as ctest xeddsa_test_static."
    command: "ctest -R xeddsa_test_static"
  - file: test/test_signing.c
    source: libxeddsa-d725c816bb26483ac397ce0d19de5ad2972955f1/test/test_signing.c
    description: "64 messages x 64 key pairs matrix: private-key signing with both sign bits, seed signing, verification accept and negative (wrong sign bit) checks."
    command: "ctest -R xeddsa_test_static"
  - file: test/test_conversion_uniqueness.c
    source: libxeddsa-d725c816bb26483ac397ce0d19de5ad2972955f1/test/test_conversion_uniqueness.c
    description: "8192 random keys: Curve25519 <-> Ed25519 public key conversion roundtrip equality and sign-bit handling."
    command: "ctest -R xeddsa_test_static"
  - file: test/test_pub_derivation.c
    source: libxeddsa-d725c816bb26483ac397ce0d19de5ad2972955f1/test/test_pub_derivation.c
    description: "Public key derivation from private keys and seeds."
    command: "ctest -R xeddsa_test_static"
  - file: ref10/kernelrandombytes/test.c
    source: libxeddsa-d725c816bb26483ac397ce0d19de5ad2972955f1/ref10/kernelrandombytes/test.c
    description: "Secure random source self-test (getentropy path on OHOS musl), registered as ctest kernelrandombytes_test_static."
    command: "ctest -R kernelrandombytes_test_static"

test_package_tests:
  - file: src/test_xeddsa.c
    description: "Deterministic consumer validation: RFC 8032 7.1 Ed25519 vectors 1+2 (exact signature bytes via ed25519_seed_sign, verify accept/reject), RFC 7748 5.2 X25519 vectors 1+2, RFC 7748 6.1 Alice/Bob shared secret, priv_to_curve25519_pub known answer, seed_to_priv/priv_to_ed25519_pub consistency, priv_force_sign(0)/(1) sign-bit functional verification via cross sign/verify, ed25519_priv_sign roundtrip with fixed nonce plus tampered-message rejection, conversion roundtrip."
    command: "./test_xeddsa"
  - file: src/test_xeddsa.c#session-exchange
    description: "鸿蒙特有消费者用例：Wire/Signal 式会话建立——双方种子派生 Curve25519/Ed25519 密钥对（sign bit 强制 0，XEdDSA 约定），交换公钥后双向签名/验签、双向 X25519 ECDH 共享密钥一致且非零、篡改会话签名拒绝（5 checks，全程确定性无 randombytes 依赖）。"
    command: "./test_xeddsa"
  - file: src/test_xeddsa.c#concurrent-threads
    description: "鸿蒙特有消费者用例：多线程并发可用性——3 个 pthread worker 各 50 轮并发执行私钥强制/签名/验签/ECDH 完整循环（线程专属固定密钥，pthread_create 失败路径不 join 未初始化句柄、断言如实失败），验证 xeddsa_init 后线程安全；另在 worker 存活期间做双向 ECDH 交换律校验（m×alice == alice×m，2 checks）。"
    command: "./test_xeddsa"

assertion_count: 27

harmonyos_validation:
  status: "device-verified (frp-tip.com, 2026-09-19: ctest 3/3 + test_package 20/20)"
  command: 'CI_PACKAGES="archives/l/libxeddsa/2.0.0-20231128.d725c81" zsh ci/conan/build_and_test.sh'
