software: "libxeddsa"
version: "2.0.0-20231128.d725c81"
status: built
build_date: "2026-09-19"
build_system: cmake

source:
  url: "https://github.com/Syndace/libxeddsa/archive/d725c816bb26483ac397ce0d19de5ad2972955f1.tar.gz"
  sha256: "b54af487fb6278fa7832be3cf5e7f88cd65900e635f85e47cc1286bc1920f7ed"
  tar_format: tar.gz
  upstream_tag: "v2.0.0"

build:
  system: cmake
  cmake_minimum: "3.5"
  language: c
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_INCLUDE_PATH=<libsodium_pkg>/include"
    - "-DCMAKE_LIBRARY_PATH=<libsodium_pkg>/lib"
  dependencies:
    - libsodium/1.0.22
  cc: clang

patches_applied:
  - "0001-cmake-gate-shared-targets-on-build_shared_libs.patch"

test:
  upstream_tests_registered: 3
  upstream_tests_note: >-
    BUILD_SHARED_LIBS=OFF 后 ctest 注册 3 项：xeddsa_test_static（单二进制
    依次执行 3 套件：signing 64x64 矩阵、conversion_uniqueness 8192 键、
    pub_derivation）、kernelrandombytes_test_static 与
    kernelrandombytes_test_dynamic（ref10 内部目标未受顶层门控影响，不链
    sodium，无害）。上游顶层的 xeddsa_test_dynamic 已被补丁 0001 门控跳过。
  test_package: "RFC 8032/7748 已知答案 + 固定 nonce 的 XEdDSA 签名回环（20 断言）"

dependencies:
  - name: libsodium
    version: "1.0.22"
    source: ohpcd
    verified: "ohpcd 注册表核实（recipe 1b4ff217 + OHOS armv8/clang15 二进制 4b977264）；sodium_stackzero 等全部所需符号已在包内验证"

knowledge_gained:
  - "OHOS 适配版 CMakeToolchain 将 os=OHOS 写为 CMAKE_SYSTEM_NAME=HarmonyOS，vanilla CMake 无 Platform/HarmonyOS → ref10 的 if(UNIX)/FindSodium elseif(UNIX) 落 FATAL_ERROR；需显式声明 Linux（et/7.0.0 先例）"
  - "上游 bundled FindSodium.cmake 的 EQUAL 看门狗对非数值 NO 恒 false，每次 configure 都 unset sodium_* CACHE，-D 注入不可靠；改喂 CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH（find_path/find_library 文档化搜索变量）"
  - "libxeddsa 公开头 xeddsa.h 依赖 ref10/include/cross_platform.h，上游无头文件安装规则，package() 需手工补装两个头"
  - "ed25519_seed_sign/ed25519_verify/seed_to_priv/x25519 分别是 libsodium crypto_sign_* / crypto_scalarmult_curve25519 的再导出，RFC 8032/7748 官方向量可直接当已知答案测试"
