  sha256: "b54af487fb6278fa7832be3cf5e7f88cd65900e635f85e47cc1286bc1920f7ed"

patches:
  - patch_file: "patches/0001-cmake-gate-shared-targets-on-build_shared_libs.patch"
    patch_description: >-
      Gate the xeddsa_dynamic shared library target, its test executable and
      its ctest registration on BUILD_SHARED_LIBS. Upstream unconditionally
      builds static and shared variants side by side; a shared libxeddsa.so
      would absorb the non-PIC static libsodium.a from the ohpcd registry
      (libsodium recipe is static-only), so the Conan shared=False default
      (BUILD_SHARED_LIBS=OFF via CMakeToolchain) must be able to skip the
      shared artifacts entirely. Static build and its tests are untouched.
    patch_type: "portability"
