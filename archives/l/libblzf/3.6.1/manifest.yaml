version: "3.6.1"
software: "libblzf"
status: built
build_date: "2026-09-24"
build_system: "autotools"

source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/libl/liblzf/liblzf_3.6.orig.tar.gz"
  tar_format: tar.gz
  sha256: "9c5de01f7b9ccae40c3f619d26a7abec9986c06c36d260c179cedd04b89fb46a"

build:
  system: autotools
  configure_options:
    - "--srcdir=."
    - "--prefix=/"
  cc: clang

patches_applied: []

knowledge_gained:
  - "3.6.1 为本地迭代版本：main 已于 e681381b70 合并 liblzf/3.6 完整配方（镜像优先 URL 规避 CI 下载超时），本归档在其基础上迭代版本号以承载 Conan 化补全工作，上游源码仍为 liblzf 3.6 tarball（sha256 一致，9c5de01f…b46a）"
  - "历史归档（2026-04-24）核验：旧 patches/0001-Makefile 与 0002-config.h 为设备本地生成文件捕获（含硬编码设备路径，违反 R6），已删除并改由 configure 重新生成"
  - "liblzf 3.6 上游无测试套件（18 项发布包审计：无 tests/ 目录、无 check/test 目标），按 no_tests 口径输出 HMBS 标记"
  - "手写 Makefile.in 不支持 DESTDIR，package() 用 prefix/bindir/libdir/includedir 显式覆盖安装进包目录"
  - "上游只产出静态 liblzf.a（无 .so），天然无 R26 系统库污染风险"
  - "预生成 configure 无需 autoreconf，无 autotools/perl tool_requires"
  - "编译器/SHELL/TMPDIR 走 HMBS 注入 + build 域 env 修正（bwm/0.6.3 同款），不传 --build/--host（R15）"
  - "消费者测试 6 个 ctest 用例：5 个 C API（压缩往返 + EINVAL/E2BIG 错误码）+ 1 个 CLI（bin/lzf 压缩解压往返 + 垃圾输入反向证伪）"
