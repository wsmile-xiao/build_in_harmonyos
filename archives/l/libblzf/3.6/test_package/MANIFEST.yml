# test_package/MANIFEST.yml — liblzf 3.6 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见 docs/TEST_QUALITY_SPEC.md

package: libblzf/3.6
homepage: "https://software.schmorp.de/pkg/liblzf.html"

# 上游测试套件存在性（经审计官方源码包确认：确无测试）
upstream_tests_exist: false
upstream_test_total: 0
upstream_test_count_method: manual_audit

# 上游测试审计（源码: liblzf_3.6.orig.tar.gz，sha256 见 conandata.yml）
upstream_test_audit:
  source_tarball: "liblzf_3.6.orig.tar.gz (Debian pool, 与 https://dist.schmorp.de/liblzf/liblzf-3.6.tar.gz 逐字节相同，57120 字节)"
  source_sha256: "9c5de01f7b9ccae40c3f619d26a7abec9986c06c36d260c179cedd04b89fb46a"
  build_system: "autotools（configure.ac + 预生成 configure + 手写 Makefile.in，非 automake/cmake/meson）"
  scanned_for:
    - "tests/ / test/ 目录"
    - "*test* / *check* 源文件"
    - "Makefile.in 中 check/test 目标"
    - "TESTS / check_PROGRAMS / TESTS_ENVIRONMENT 变量"
    - "configure.ac 中测试接线（AC_CHECK_PROGS 测试输出）"
    - "ctest / gtest / pytest 注册"
  scan_result: "tarball 共 18 项：lzf.h/lzfP.h/lzf_c.c/lzf_d.c/lzf.c、crc32.h、configure.ac/configure/config.h.in/Makefile.in/install-sh、cs/CLZF.cs + cs/README、Changes/README/LICENSE。无 tests/ 或 test/ 目录；无任何 *test*/*check* 源文件；Makefile.in 目标仅 all/clean/lzf/liblzf.a/install/dist/bench（无 check/test 目标）；configure.ac 仅含 AC_INIT/AC_CONFIG_HEADER/AC_PROG_CC/AC_PROG_RANLIB/AC_PROG_INSTALL/AC_HEADER_STDC/AC_C_CONST/AC_C_INLINE/AC_CHECK_HEADERS(getopt.h)/AC_CHECK_FUNCS(getopt_long)，无测试输出文件；cs/ 仅为 C# 移植（CLZF.cs），无测试；README/Changes 只描述压缩库用法与版本历史，无测试入口。"
  reason: "liblzf 3.6 上游无测试套件：无 tests/ 目录、无测试源文件、手写 Makefile.in 无 check/test 目标、无任何测试框架注册。按 no_tests 处理。"

# 上游测试命令（无测试套件，故不适用）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用库 API + 真实执行 CLI）
test_package_tests:
  - file: test_package/test_lzf.c（ctest 驱动，5 个用例）
    description: "真实调用 lzf_compress/lzf_decompress：roundtrip_text（~45KB 文本必须压缩且往返一致）、roundtrip_binary（32KB 固定种子伪随机往返）、roundtrip_large（256KB 零字节压缩率 <5% 且往返一致）、corrupt_einval（手工非法回指流必须返回 EINVAL）、small_out_e2big（手工超长字面量进 4 字节缓冲必须返回 E2BIG）"
    command: "ctest --output-on-failure（api:roundtrip_text/binary/large/corrupt_einval/small_out_e2big）"
    assertions: 5
  - file: test_package/test_cli.sh（ctest 用例 cli:help_and_roundtrip）
    description: "真实执行包内 bin/lzf：-h 打印 usage 且退出 0、管道压缩解压往返字节一致（非空守卫）、文件 f→f.lzf→f 往返字节一致、垃圾输入解压必须失败（反向证伪）"
    command: "sh test_cli.sh（LZF_BIN 指向包内 bin/lzf）"
    assertions: 4

harmonyos_specific_tests: []

# 测试断言总数（5 API 用例 + 4 CLI 检查；ctest 共 6 个测试）
assertion_count: 9
