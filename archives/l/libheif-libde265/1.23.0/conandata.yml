# conandata.yml — libheif-libde265 1.23.0
#
# 源码 = 上游 libheif 1.23.0 官方 tag 归档（R39：官方源）。
# 本包是**同一 tarball 内的子模块**：libde265（HEVC）解码后端插件，
# 源文件在树内 libheif/plugins/decoder_libde265.{cc,h}，
# 由 libheif/plugins/CMakeLists.txt 的 plugin_compilation(libde265 …) 生成
# CMake 目标 heif-libde265 → 产物 libheif-libde265.so。
# 版本号取父 tarball 版本（同族先例：libhwy_test 1.3.0 ← highway 1.3.0）。
#
# sha256 为设备实测下载值：本任务独立下载后 sha256sum 计算，
# 与 archives/l/libheif/1.22.2 无关（不同 tarball）。

sources:
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"

# 无补丁：上游源码零修改。
#
# libheif 1.23.0 用了 C++20 ranges 算法（libheif/box.cc 的 Box_rref 调
# std::ranges::all_of/find），而 OHOS SDK 的 libc++ 15004（clang 15.0.4）把
# ranges 重载 gate 在 _LIBCPP_ENABLE_EXPERIMENTAL 之后（未定义时
# __config 定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES）→ 本工具链下编译必然失败。
# 处置放在 conanfile.py 的 generate()：OHOS 下经 CMakeToolchain 注入
# preprocessor_definitions["_LIBCPP_ENABLE_EXPERIMENTAL"]（libc++ 官方开关，
# header-only，不需要 -lc++experimental），**不改上游源码、不需要补丁**。
# 仓内先例：archives/l/libpqxx/8.0.1、archives/l/ladybug/0.18.2。
#
# 形态提醒（本轮实测的坑）：`patches` 若用「文件名做 key」的映射形态，
# Conan 2 会把它解释成 {version: [条目…]}（apply_conandata_patches 源码
# `entries = patches.get(str(conanfile.version), [])`）→ 命中默认空列表 →
# **静默不应用任何补丁**（无告警无报错）；CI L0f 亦对缩进 key 判
# 「key is a filename, not a version」。声明补丁一律用**列表形态**：
# 顶层 `patches` 为序列，每个元素是含 patch_file / patch_description /
# patch_type 三个键的映射（patch_file 指向 patches/ 下的补丁文件）。
# 本包无补丁，故为下面的空映射。
patches: {}
