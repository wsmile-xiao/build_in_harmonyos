    - "-DWITH_LIBDE265=ON"                  # 交付面：libde265 后端
    - "-DWITH_LIBDE265_PLUGIN=ON"           # 交付面：以独立插件模块构建（→ libheif-libde265.so）
    - "-DWITH_X265=OFF"
    - "-DWITH_X264=OFF"
    - "-DWITH_AOM_DECODER=OFF"
    - "-DWITH_AOM_ENCODER=OFF"
    - "-DWITH_DAV1D=OFF"
    - "-DWITH_KVAZAAR=OFF"
    - "-DWITH_UVG266=OFF"
    - "-DWITH_VVDEC=OFF"
    - "-DWITH_VVENC=OFF"
    - "-DWITH_FFMPEG_DECODER=OFF"
    - "-DWITH_OpenH264_DECODER=OFF"
    - "-DWITH_RAV1E=OFF"
    - "-DWITH_SvtEnc=OFF"
    - "-DWITH_JPEG_DECODER=OFF"
    - "-DWITH_JPEG_ENCODER=OFF"
    - "-DWITH_OpenJPEG_DECODER=OFF"
    - "-DWITH_OpenJPEG_ENCODER=OFF"
    - "-DWITH_OPENJPH_ENCODER=OFF"
    - "-DWITH_LIBSHARPYUV=OFF"
    - "-DWITH_UNCOMPRESSED_CODEC=OFF"
    - "-DWITH_WEBCODECS=OFF"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_GDK_PIXBUF=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_DOCUMENTATION=OFF"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DLIBDE265_INCLUDE_DIR=<libde265 包的 include 绝对路径>"    # generate() 从 Conan 依赖解析
    - "-DLIBDE265_LIBRARY=<libde265 包的 lib/libde265.a 绝对路径>"  # generate() 从 Conan 依赖解析

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libde265/1.0.18

  cc: clang
  cxx: clang++

