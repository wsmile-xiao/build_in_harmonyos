# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 上 `cmake --install` 会把构建树 RUNPATH 就地改写成安装态 —— 字节一变，链接期写入的 OHOS 代码签名（.note.ohos.ident）失效，dlopen 报 Permission denied（不是 not found）。本例：插件 RUNPATH 安装前=<build>/libheif/、安装后无，同尺寸但 sha256 变（eb04f0f6…→abb4b2be…，cmp -l 182 字节差）；宿主 libheif.so 安装前后 sha256 完全相同（不链接同构建树 target）——只查宿主会误判。修法：package() 在 cmake.install() 后 llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1（先例 openh264/2.6.0、ffmpeg/8.1.2）；等价路线 CMAKE_BUILD_WITH_INSTALL_RPATH=ON + CMAKE_INSTALL_RPATH=''（源头不改写）"  # knowledge_ref: E618
  - "OHOS 上 CMAKE_SYSTEM_NAME 必须显式钉成 Linux：设备 uname -s=HarmonyOS，而 SDK CMake 只有 Platform/OHOS.cmake、没有 Platform/HarmonyOS.cmake，Conan 默认映射 HarmonyOS → 未知平台回退 → 共享库无 SONAME、无版本化文件名（探针：不覆盖只有 libfoo.so 且无 SONAME；覆盖后 libfoo.so.1.2.3 + SONAME=libfoo.so.1），进而使 MODULE 插件把相对路径 ../libheif.so 写进 DT_NEEDED → 运行期 dlopen 失败。配方一行 tc.cache_variables['CMAKE_SYSTEM_NAME']='Linux' 解决"  # knowledge_ref: E618
  - "libheif 1.23.0 用了 C++20 ranges 算法（libheif/box.cc 的 Box_rref 调 std::ranges::all_of/find）；OHOS SDK 的 libc++ 15004 把 ranges 重载 gate 在 _LIBCPP_ENABLE_EXPERIMENTAL 之后（未定义时 __config 定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES）→ 即使 -std=c++20 也报 'no member named find in namespace std::ranges'，且 __cpp_lib_ranges 仍声明 201811L（特性宏会骗人）。修法：OHOS 下经 CMakeToolchain 注入 preprocessor_definitions['_LIBCPP_ENABLE_EXPERIMENTAL']，不改上游源码、无需补丁、无需 -lc++experimental（header-only）；公共头 0 处 std::ranges 故不向消费者传播。先例 libpqxx/8.0.1、ladybug/0.18.2"  # knowledge_ref: E618
  - "conandata.yml 的 patches 必须用**列表**形态。Conan 2 把映射形态解释成 {version: [条目…]}（entries = patches.get(str(conanfile.version), [])），用文件名做 key 会命中默认空列表 → 补丁既不导出也不应用且**无任何告警**（实测一轮 S2 G2 白跑、编译错误逐字复现）；CI L0f 亦判 'key is a filename, not a version'"  # knowledge_ref: E618
  - "libheif 把编解码后端做成可独立装载的 MODULE 插件：树内目标 heif-<codec> → libheif-<codec>.so，包名按「交付库文件名去前后缀」取（同族：libhwy_test ← hwy_test）。CMake 变量 WITH_<CODEC>_PLUGIN 在「静态编入宿主」与「独立插件模块」之间切换，分支集中在 plugin_compilation() 一个宏里"  # knowledge_ref: E618
  - "libheif 的默认插件目录被编译期钉死（heif_version.h 的 LIBHEIF_PLUGIN_DIRECTORY = 构建时 CMAKE_INSTALL_FULL_LIBDIR/libheif）。Conan 包目录跨缓存/跨机不稳定，必须用 package_info() 的 runenv_info 导出 LIBHEIF_PLUGIN_PATH（上游 plugins_unix.cc 读单数 PATH；头文件注释里的复数 PATHS 是过期文档）"  # knowledge_ref: E618
  - "上游 cmake/modules/FindLIBDE265.cmake 是 MODULE 模式（MODULE 模式：pkg-config 探测 + `find_path`/`find_library`，HINTS 仅取自 pkg-config 结果 `${LIBDE265_PKGCONF_*}`，不读 CMakeDeps 生成的 config），不认 CMakeDeps 生成的 libde265-config.cmake；在 Conan 里要用 cache 变量 LIBDE265_INCLUDE_DIR/LIBDE265_LIBRARY 直接钉住依赖路径，否则可能命中设备系统库或依赖 pkg-config 是否可用"  # knowledge_ref: E618
  - "子包（父 tarball 内子模块）的上游 N 必须按父 tarball 全量注册面清点并取用例/注册类最大值：libheif 1.23.0 的 Catch2 TEST_CASE = 217，而 CTest add_test 只有 39（全开关上限）、测试源文件 41 —— 只按 ctest 口径申报会被判少报（rule4）"  # knowledge_ref: E618
  - "libheif 插件模块无法脱离宿主：插件 DT_NEEDED 宿主 libheif.so，且必须由宿主 dlopen 才能注册后端。因此 libheif-libde265 不能依赖已有的 codec-free 包 libheif/1.22.2（其 ENABLE_PLUGIN_LOADING=OFF，运行期根本不装载插件），只能自包含交付同源同版本的宿主"  # knowledge_ref: E618
