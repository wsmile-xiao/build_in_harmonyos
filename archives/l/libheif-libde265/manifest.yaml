software: libheif-libde265
display: "libheif-libde265"
description: "libde265 (HEVC) decoder backend plugin module of libheif"
category: gfx
homepage: "https://github.com/strukturag/libheif"
license: LGPL-3.0-or-later
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "本包是父 tarball（libheif）树内子模块：上游 CMake 目标 heif-libde265 → 产物 lib/libheif/libheif-libde265.so；包名 = 交付库文件名去掉 lib 前缀与扩展名（同族先例 libhwy_test）"
    - "交付面三要素：WITH_LIBDE265=ON + WITH_LIBDE265_PLUGIN=ON + ENABLE_PLUGIN_LOADING=ON；缺任一则不产生该目标（退回静态编入宿主）"
    - "插件/host 子包必须装后重签：OHOS 上 cmake --install 改写 RUNPATH 会让链接期代码签名失效 → dlopen Permission denied；package() 里 llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1（先例 openh264/2.6.0、ffmpeg/8.1.2）；只查宿主 sha256 会误判（宿主不被改写）"
    - "共享库/插件包必须显式 tc.cache_variables['CMAKE_SYSTEM_NAME']='Linux'：OHOS 默认映射的 HarmonyOS 在本 SDK 的 CMake 里没有 Platform 文件 → 共享库无 SONAME/无版本化软链 → MODULE 插件把相对路径写进 DT_NEEDED → 运行期 dlopen 必失败（构建期全绿，典型假绿）"
    - "插件无法脱离宿主（DT_NEEDED 宿主 + 必须由宿主 dlopen 注册），故自包含交付同源同版本、启用插件装载的 libheif 宿主；codec-free 的 libheif/1.22.2（ENABLE_PLUGIN_LOADING=OFF）不可作为依赖"
    - "默认插件目录被编译期钉死成构建时的绝对路径（heif_version.h 的 LIBHEIF_PLUGIN_DIRECTORY）；运行期用 LIBHEIF_PLUGIN_PATH（单数，代码口径）覆盖，配方经 package_info() 的 runenv_info 导出"
    - "libde265 依赖复用仓库既有独立包（libde265/1.0.18），不在内树重建；aarch64 NEON 汇编结论随该包继承（HAVE_NEON=FALSE + 关 ENABLE_ARM → C 回退）"
    - "上游 cmake/modules/FindLIBDE265.cmake 是 MODULE 模式（MODULE 模式：pkg-config 探测 + `find_path`/`find_library`，HINTS 仅取自 pkg-config 结果 `${LIBDE265_PKGCONF_*}`，不读 CMakeDeps 生成的 config），不认 CMakeDeps 的 config；用 cache 变量 LIBDE265_INCLUDE_DIR/LIBDE265_LIBRARY 钉住依赖路径"
    - "libheif 1.23.0 用了 C++20 ranges 算法，OHOS SDK libc++ 15004 声明 __cpp_lib_ranges 但未实现 → 经 CMakeToolchain 注入 libc++ 官方开关 _LIBCPP_ENABLE_EXPERIMENTAL（**零补丁**，不改上游源码；先例 libpqxx/8.0.1、ladybug/0.18.2）"
    - "conandata.yml 的 patches 必须用列表形态：Conan 2 把 dict 形态解释成 {version: [条目]}，用文件名当 key 会被静默忽略，补丁永不生效"
  common_dependencies:
    - libde265

# 版本索引（所有已归档版本，含状态）
versions:
  "1.23.0":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libheif-libde265/1.23.0"
