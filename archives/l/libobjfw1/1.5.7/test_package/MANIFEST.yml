# test_package/MANIFEST.yml — libobjfw1 1.5.7 适配验证清单
#
# 上游测试来源声明：
#   - build_system: autotools（configure.ac，ObjFW 1.5.7）
#   - 上游 make check：tests/ 84 个 .m 测试文件（make -C tests run）
#   - 本适配以消费者用例为准（ObjFW runtime API 真实 roundtrip；
#     ObjC 框架类需 -fobjc，OHOS clang 不认，故用纯 C runtime API）
#
# test_package 消费者用例（新增）：
#   test_objfw_c.c — ObjFWRT.h objc_allocateClassPair/objc_registerClassPair/
#                    objc_getClass 真实 roundtrip（4 断言，纯 C 编译）
package: libobjfw1/1.5.7
homepage: https://objfw.nil.im/

upstream_test_in_build: true
upstream_tests:
  - name: objfw-testsuite
    count: 84
    note: "tests/ 84 个 .m 测试文件（make check）"
test_package_tests:
  - name: objfwrt-api-roundtrip
    command: "./test_objfw_c"
    assertions:
      - "objc_allocateClassPair 分配成功（非 NULL）"
      - "objc_registerClassPair 注册不崩溃"
      - "objc_getClass 按名查询返回同一 Class"
      - "生命周期完整（正常退出）"
