software: "libversion"
version: "3.0.4"
upstream:
  repo: "https://github.com/repology/libversion"
  tag: "3.0.4"
  source: "https://github.com/repology/libversion/archive/refs/tags/3.0.4.tar.gz"
  sha256: "48c2a4a98b6f220dedd535979f1e9ab83f9bf869e06c0f5e7bb1be6d2e662fee"
  license: "MIT"
  language: "C"
  standard: "C99"
  build_system: "CMake"
  cmake_min: "3.22.1"
  dependencies: []
products:
  library: "libversion (OUTPUT_NAME=version → -lversion)"
  headers: ["libversion/version.h", "libversion/config.h", "libversion/export.h"]
  pkg_config: "libversion.pc"
  cli:
    - name: "version_compare"
      installed: true
    - name: "version_sort"
      installed: true
    - name: "version_explain"
      installed: false
options:
  shared: false
patches: []
ohos_notes: "No OHOS-specific patches required. Pure C library, no external dependencies."
