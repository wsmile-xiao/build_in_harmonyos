software: libjcat-tools
# 版本级 manifest — archives/l/libjcat-tools/0.2.3/manifest.yaml
version: "0.2.3"
status: built
build_date: "2026-09-19"

source:
  url: "https://github.com/hughsie/libjcat/releases/download/0.2.3/libjcat-0.2.3.tar.xz"
  sha256: "f2f115aad8a8f16b8dde1ed55de7abacb91d0878539aa29b2b60854b499db639"
  tar_format: tar.xz

build:
  system: meson
  build_system: meson
  configure_options:
    - "-Dcli=true"
    - "-Dgpg=true"
    - "-Dpkcs7=true"
    - "-Ded25519=true"
    - "-Dtests=false"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Dman=false"
    - "-Dgtkdoc=false"
  dependencies:
    - glib/2.84.0.1
    - json-glib/1.10.6
    - gpgme/1.24.0
    - gnutls/3.8.10
  cc: clang 15.0.4

patches_applied: []

knowledge_gained:
  - "gio-unix-2.0.pc 不在 PkgConfigDeps 产物中，需从 glib 包内复制修正 prefix"
  - "上游 cc.find_library 的依赖（gpgme/gpg-error）需 LDFLAGS 显式提供 lib 目录"
  - "OHOS 原生环境对新建依赖 .so 的 mmap(PROT_EXEC) 存在异步拦截（E488 同源），测试执行按环境限制申报"
