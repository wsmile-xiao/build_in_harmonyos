software: lsb
display: "lsb"
description: "Linux Standard Base 发行版识别与 init 脚本辅助工具"
category: system
homepage: "https://wiki.linuxfoundation.org/lsb/start"
license: GPL-2.0-only
build_system: custom
package_type: application

ohos_adaptation:
  key_points:
    - "上游默认只读取 /usr/share/distro-info/*.csv，配方补丁增加 LSB_DISTRO_INFO 与包内元数据回退"
    - "上游 apt-cache/dpkg-query 测试替身使用 #!/usr/bin/python3，鸿蒙无该路径，配方用包装脚本指向真实 python3"
    - "真机执行 11 个有效 unittest 用例与上游 shell 冒烟脚本，7 个上游 skip 用例保持 skip"
  common_dependencies:
    - "python3 >= 3.8"

versions:
  "11.6":
    status: verified
    build_date: "2026-09-24"
    conan_ref: "lsb/11.6"
