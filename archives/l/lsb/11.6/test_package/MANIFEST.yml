files:
  - conanfile.py
  - test_lsb_consumer.py

package: lsb/11.6
homepage: "https://wiki.linuxfoundation.org/lsb/start"
upstream_check_command: "python3 -m unittest discover -s test -p 'test_*.py'"
upstream_test_in_build: true
upstream_test_command: "python3 -m unittest discover -s test -p 'test_*.py' -v && sh test/lsb-test.sh ."
upstream_tests:
  - file: test/test_lsb_release.py
    source: lsb-11.6/test/test_lsb_release.py
    description: "11 active unittest cases for lsb_release.py"
    command: "python3 -m unittest test.test_lsb_release -v"
  - file: test/test_initdutils.py
    source: lsb-11.6/test/test_initdutils.py
    description: "7 declared upstream initdutils tests, all skipped by upstream"
    command: "python3 -m unittest test.test_initdutils -v"
  - file: test/lsb-test.sh
    source: lsb-11.6/test/lsb-test.sh
    description: "Upstream init-functions shell smoke test"
    command: "sh test/lsb-test.sh ."
test_package_tests:
  - file: conanfile.py
    description: "Installed lsb_release/init-functions consumer checks"
    command: "conan test"
assertion_count: 18
