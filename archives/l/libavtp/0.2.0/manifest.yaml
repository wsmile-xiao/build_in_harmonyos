version: "0.2.0"
software: "libavtp"
status: built
build_date: "2026-08-28"
build_system: meson

source:
  url: "https://github.com/Avnu/libavtp/archive/refs/tags/v0.2.0.tar.gz"
  sha256: "631f5e704a1b7c8f953ca017a382ad945e75c2952c81813ff355e9ab8071b70e"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "--prefix=/"
    - "-Dtests=enabled"
  dependencies:
    - "meson/1.11.0 (tool_requires)"
    - "cmocka/2.0.2 (test_requires)"
  build_tool:
    name: meson
    version: "1.11.0 (ohpcd prebuilt tool package)"
  cc: clang
  cxx: clang++
  compiler: clang
  parallelism: 1

patches_applied:
  - "0001-src-avtp_rvf.c.patch"
  - "0002-src-avtp_stream.c.patch"
  - "0003-unit-test-aaf.c.patch"
  - "0004-unit-test-crf.c.patch"
  - "0005-unit-test-cvf.c.patch"
  - "0006-unit-test-ieciidc.c.patch"
  - "0007-unit-test-rvf.c.patch"
  - "0008-unit-test-stream.c.patch"

patch_classification:
  - file: "0001-src-avtp_rvf.c.patch"
    type: portability
    platform_only: true
    guard: "OHOS endian.h exposes htobe64/be64toh"
  - file: "0002-src-avtp_stream.c.patch"
    type: portability
    platform_only: true
    guard: "OHOS endian.h exposes htobe64/be64toh"
  - file: "0003-unit-test-aaf.c.patch"
    type: portability
    platform_only: true
    guard: "OHOS upstream test compilation"
  - file: "0004-unit-test-crf.c.patch"
    type: portability
    platform_only: true
    guard: "OHOS upstream test compilation"
  - file: "0005-unit-test-cvf.c.patch"
    type: portability
    platform_only: true
    guard: "OHOS upstream test compilation"
  - file: "0006-unit-test-ieciidc.c.patch"
    type: portability
    platform_only: true
    guard: "OHOS upstream test compilation"
  - file: "0007-unit-test-rvf.c.patch"
    type: portability
    platform_only: true
    guard: "OHOS upstream test compilation"
  - file: "0008-unit-test-stream.c.patch"
    type: portability
    platform_only: true
    guard: "OHOS upstream test compilation"

knowledge_gained:
  - "libavtp 0.2.0 uses Meson and Ninja; the recipe declares the prebuilt meson/1.11.0 Conan tool_requires from ohpcd."
  - "OpenHarmony's endian conversion declarations require an explicit <endian.h> include in the two affected library sources and the affected unit tests."
  - "The cmocka package's installed pkg-config file can retain a build-cache prefix; the recipe emits a corrected generator-local cmocka.pc using the Conan package folder."
  - "Meson versioned shared-library aliases are materialized as regular files for the HarmonyOS loader; OHOS packaging resolves llvm-objcopy and binary-sign-tool from the Conan/profile tool paths and fails if either is unavailable."

validation:
  upstream_tests:
    command: "meson test -C <build-folder> --no-rebuild --print-errorlogs --timeout-multiplier=16"
    suites: 7
    total: 251
    passed: 251
    failed: 0
  conan_create:
    command: "conan create archives/l/libavtp/0.2.0 -pr:h=<absolute-ohos-aarch64-profile> -pr:b=<absolute-ohos-aarch64-profile> --build=missing"
    result: passed
  test_package:
    command: "./test_libavtp"
    assertions: 32
    result: passed
  examples: "Not enabled; upstream Linux packet-socket examples require argp.h and are outside the library/test target set."
