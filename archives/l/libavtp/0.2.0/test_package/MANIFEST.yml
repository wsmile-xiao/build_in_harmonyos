# test_package/MANIFEST.yml — libavtp 0.2.0
# Upstream and consumer test declaration required by CI L0e.

package: libavtp/0.2.0
homepage: "https://github.com/Avnu/libavtp"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "v0.2.0.tar.gz"
  source_sha256: "631f5e704a1b7c8f953ca017a382ad945e75c2952c81813ff355e9ab8071b70e"
  build_system: "Meson"
  test_definition: "meson.build registers seven cmocka executables with meson test()"
  dependency: "cmocka/2.0.2"
  portability_changes:
    - "src/avtp_stream.c and src/avtp_rvf.c include <endian.h> for OHOS htobe64/be64toh declarations"
    - "six unit test sources include <endian.h> for the same OHOS declarations"
  examples_note: "The optional Linux packet-socket examples are not enabled by the default build and require argp.h; the library and upstream unit tests are fully exercised."

upstream_check_command: "meson test -C <build-folder> --print-errorlogs --timeout-multiplier=16"
upstream_test_in_build: true
upstream_test_command: "meson test -C <build-folder> --print-errorlogs --timeout-multiplier=16"

upstream_tests:
  - test_name: "AVTP API"
    target: "test-avtp"
    source: "unit/test-avtp.c"
    total: 9
  - test_name: "Stream API"
    target: "test-stream"
    source: "unit/test-stream.c"
    total: 21
  - test_name: "AAF API"
    target: "test-aaf"
    source: "unit/test-aaf.c"
    total: 35
  - test_name: "CRF API"
    target: "test-crf"
    source: "unit/test-crf.c"
    total: 29
  - test_name: "CVF API"
    target: "test-cvf"
    source: "unit/test-cvf.c"
    total: 36
  - test_name: "RVF API"
    target: "test-rvf"
    source: "unit/test-rvf.c"
    total: 53
  - test_name: "IEC61883/IIDC API"
    target: "test-ieciidc"
    source: "unit/test-ieciidc.c"
    total: 68

upstream_test_total: 251
upstream_test_passed: 251
upstream_test_failed: 0

# Consumer-perspective checks use every public AVTP packet family and both
# common getter/setter paths.  Each REQUIRE has a failure exit path.
test_package_tests:
  - file: test_libavtp.c
    scenario: "consumer-api"
    description: "Build and run a Conan consumer that initializes AAF, CRF, CVF, RVF and IEC61883/IIDC PDUs, exercises common subtype and stream-ID accessors, and round-trips representative format fields."
    command: "./test_libavtp"
    assertions: 32

assertion_count: 32
