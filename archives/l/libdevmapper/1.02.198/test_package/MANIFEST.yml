# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdevmapper/1.02.198
homepage: "https://sourceware.org/lvm2/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make -C test/unit unit-test && ./test/unit/unit-test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 说明 (2026-09-22 实测):
#   - 上游 test/unit 共 13 个 *_t.c 单元测试源，聚合为 unit-test 二进制。
#     在本机 aarch64 实测运行：125/125 tests passed（含 device-mapper 数据结构/
#     vdo status 解析、config、bitset、dmlist、dmhash 等）。
#   - 上游 test/shell 下有 428 个 shell 集成测试，依赖内核 device-mapper ioctl 与
#     root/LVM 设备环境（loop/真实块设备），交叉编译环境无法运行——已记录为
#     shell 集成测试不适配交叉编译沙箱，不阻塞本库 PR（R51 如实申报）。
upstream_tests:
  - file: test/unit/框架 (framework.c + *_t.c)
    source: LVM2.2.03.24/test/unit/*_t.c
    description: "libdevmapper/libdm 数据结构单元测试（125 用例）"
    command: "./test/unit/unit-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者契约验证：dm_get_library_version + dm_task_create（父库 cryptmount 的 AC_CHECK_HEADER/AC_SEARCH_LIBS 契约）"
    command: "./test_libdevmapper"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 127