  sha256: "593c5503ba00faab1c6e0b4a597b9605ec7b5881845c04bf412ebf9d1bbfa13c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-gnu"
    - "--build=aarch64-linux-gnu"
    - "--disable-udev_sync"
    - "--disable-selinux"
    - "--disable-lvmlockd"
    - "--disable-lvmpolld"
