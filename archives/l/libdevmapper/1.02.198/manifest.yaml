    - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libdevmapper 是 LVM2 2.03.24 源码树内的 device-mapper 用户态库组件（libdm/），无独立归档；configure 用 --host=aarch64-linux-gnu + uname-shim 让 config.sub 按 Linux-ELF 处理，真实交叉目标由 OHOS clang 决定。"
  - "交叉编译下 autoconf 对 malloc/realloc 的 AC_FUNC 运行检测不可行，须显式 ac_cv_func_malloc_0_nonnull=yes / ac_cv_func_realloc_0_nonnull=yes，否则生成 rpl_malloc/rpl_realloc 替代导致 -ldevmapper 链接 undefined reference。"
  - "config.status 的 mktemp -d 以 umask 077 建 0700 临时目录，在共享/HMDFS 目录下对非属主进程不可写；configure 脚本内 umask 077→022 即可修复。"
  - "上游 test/unit 聚合单元测试本机实测 125/125 通过；test/shell 428 个集成测试依赖内核 device-mapper ioctl，交叉沙箱无法运行。"
