software: libdc1394
version: "2.2.7"
status: published
compile_date: "2026-06-02"
build_system: autotools

source:
  url: "https://sourceforge.net/projects/libdc1394/files/libdc1394-2/2.2.7/libdc1394-2.2.7.tar.gz"
  sha256: "537ceb78dd3cef271a183f4a176191d1cecf85f025520e6bd3758b0e19e6609f"
  tar_format: tar.gz

build:
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies:
    - libraw1394/2.1.2
  cc: clang
  cxx: clang++
  pre_configure_steps:
    - "autoreconf -fi  # 重新生成configure/Makefile.in/libtool（替代autoreconf产物patch）"
    - "libtoolize --copy  # 安装系统libtool 2.4.7（替代libtool升级patch）"
    - "sed -i 's|mktemp -d \"./confXXXXXX\"|mktemp -d \"$TMPDIR/confXXXXXX\"|' configure  # HMDFS mktemp修复"
    - "sed -i 's|tmp=./conf$$-$RANDOM|tmp=$TMPDIR/conf$$-$RANDOM|' configure  # HMDFS临时目录修复"

patches_applied:
  - "0002-configure.ac-SDL.patch"
  - "0003-config.guess.patch"
  - "0005-config.sub.patch"
  - "0009-dc1394-juju-capture.c.patch"
  - "0010-dc1394-juju-control.c.patch"

knowledge_gained:
  - "config.guess/config.sub需添加ohos支持（E007/E072）"
  - "clang不支持VLA in struct，需改为固定大小数组"
  - "HMDFS上config.status的mktemp/umask组合导致Permission denied"
  - "libtool版本需与系统版本(2.4.7)匹配"
  - "autoreconf产物和libtool升级不应作为patch追踪，应作为构建步骤（R2: Phase3不生成.patch）"

patch_generation:
  method: manual-selection
  patches_count: 5
  note: "从23个patch精简为5个，autoreconf/libtoolize产物改为构建步骤"