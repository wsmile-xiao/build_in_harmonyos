software: libdc1394
display: "libdc1394"
description: "IEEE 1394 (FireWire) digital camera control library — API for discovering, configuring, and capturing from IEEE 1394 cameras"
category: library
homepage: "https://sourceforge.net/projects/libdc1394/"
license: LGPL-2.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub需添加ohos支持（用patch-autotools-ohos.pl脚本或0003/0005 patch）"
    - "clang不支持VLA-in-struct，需改为固定大小数组"
    - "HMDFS上mktemp/umask组合导致Permission denied，需post-autoreconf sed修复"
    - "libtool版本需与系统版本(2.4.7)匹配，用libtoolize --copy替代"
    - "configure.ac中AM_PATH_SDL宏未展开是上游源码问题，需注释掉"
    - "需要IEEE 1394(FireWire)硬件才能完整验证功能"
  common_dependencies:
    - libraw1394
  build_recipe:
    - "perl patch-autotools-ohos.pl config.guess config.sub  # 或 0003/0005 patch"
    - "patch -p1 < 0002-configure.ac-SDL.patch              # SDL宏注释"
    - "autoreconf -fi                                         # 替代10个autoreconf产物patch"
    - "libtoolize --copy                                      # 替代7个libtool升级patch"
    - "sed -i 's|mktemp -d \"./confXXXXXX\"|mktemp -d \"$TMPDIR/confXXXXXX\"|' configure  # HMDFS"
    - "./configure --prefix=$DEFAULT_PREFIX && make -j1 && make install"

versions:
  "2.2.7":
    status: published
    build_date: "2026-06-02"