software: libarchive
version: "3.7.7"
build_system: cmake
status: published
build_date: "2026-09-05"

source:
  url: "https://www.libarchive.org/downloads/libarchive-3.7.7.tar.gz"
  sha256: "4cc540a3e9a1eebdefa1045d2e4184831100667e6d7d5b315bb1cbc951f8ddff"

build:
  system: cmake
  cmake_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (cmake 4.x vs upstream cmake_minimum_required 2.8.0)"
    - "-DOHOS_ARCH=arm64-v8a (OHOS NDK ohos.toolchain.cmake, self-discovered)"
    - "-DCMAKE_AR=llvm-ar -DCMAKE_RANLIB=llvm-ranlib-shim (SDK lacks llvm-ranlib)"
    - "-DENABLE_TEST=OFF (upstream suite run separately, see test_package/MANIFEST.yml)"
  disabled_optional_deps:
    - "ENABLE_NETTLE=OFF (crypto optional)"
    - "ENABLE_MBEDTLS=OFF"
    - "ENABLE_CNG=OFF (Windows only)"
    - "ENABLE_LIBB2=OFF (blake2 bundled)"
    - "ENABLE_LZO=OFF (license-restricted, not in registry)"
    - "ENABLE_PCREPOSIX=OFF / ENABLE_PCRE2POSIX=OFF (not in registry)"
    - "ENABLE_LIBGCC=OFF"
    - "ENABLE_EXPAT=OFF (xar XML: expat and libxml2 are either/or alternatives)"
    - "ENABLE_LIBXML2=OFF (xar format only; keeps dependency graph lean)"
    - "ENABLE_LZ4=OFF (not in registry)"
  dependencies:
    - "zlib/1.3.1.1 (-fPIC static rebuild; upstream zlib/1.3.1 libz.a breaks shared linking)"
    - "bzip2/1.0.8"
    - "xz/5.6.2"
    - "zstd/1.5.7"
  cc: clang 15.0.4 (aarch64-linux-ohos)

patches_applied: []

knowledge_gained:
  - "CMake 4.x rejects upstream cmake_minimum_required(2.8.0) — CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "OHOS SDK has no llvm-ranlib — shim via 'llvm-ar s' wrapper (same as zstd recipe)"
  - "hmfs utime()/GID semantics fail bsdtar tests (platform limits, not package defects)"
