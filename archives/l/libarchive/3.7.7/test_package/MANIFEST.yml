package: libarchive/3.7.7
upstream_test_in_build: true
upstream_tests:
  - suite: "libarchive_test"
    run: "./bin/libarchive_test -r <src>/libarchive/test"
    tests_run: 637
    tests_failed: 2
    failing_tests:
      - "test_write_disk_hardlink (hmfs: hardlinks unsupported)"
      - "test_write_disk_secure (hmfs: permission bits/setuid trimmed)"
    notes: "30,982,315 assertions checked, 9 failed; 194 skips (locale/win32-only). Failures are OHOS hmfs platform limits, same class as libarchive 3.8.7 notes."
  - suite: "bsdtar_test"
    run: "./bin/bsdtar_test -r <src>/tar/test"
    tests_run: 73
    tests_failed: 14
    notes: "86,392 assertions, 961 failed; root causes: hmfs utime() EPERM ('Can't restore time'), hmfs GID semantics ('Numeric group ID too large'), hardlink/fflags/xattr limits — OHOS platform limits, not package defects."
  - suite: "bsdcpio_test"
    run: "./bin/bsdcpio_test -r <src>/cpio/test"
    tests_run: 49
    tests_failed: 0
  - suite: "bsdcat_test"
    run: "./bin/bsdcat_test -r <src>/cat/test"
    tests_run: 18
    tests_failed: 0
  - suite: "bsdunzip_test"
    run: "./bin/bsdunzip_test -r <src>/unzip/test"
    tests_run: 23
    tests_failed: 1
    failing_tests:
      - "test_P_encryption (3 assertion failures)"
    notes: "Zip traditional-PKWARE encryption stream test; remaining failures cluster with the same hmfs time/permission limits."
test_package_tests:
  - file: test_libarchive.c
    description: "tar.gz write/read round-trip via archive_write_*/archive_read_* API (2 entries, content asserted byte-for-byte, gzip filter)"
    command: "./test_libarchive"
assertion_count: 31
