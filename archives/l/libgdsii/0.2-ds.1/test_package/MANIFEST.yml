# test_package MANIFEST - libgdsii 0.2-ds.1
test_program: test_libgdsii
language: cpp
asset: bend_flux_gds.h（604 字节上游 examples/bend-flux/bend-flux.gds 以 C 字节数组内嵌，运行时写出到工作目录解析；归档保持纯文本，避免 PR diff 携带二进制块）

upstream_tests:
  static_total: 0
  evidence: >-
    上游 tag 0.2 归档无任何自动化测试：无 tests/ 目录，无 TESTS/check-TESTS
    注册（顶层 Makefile.am 仅 SUBDIRS=lib applications examples），源码无测试文件。

consumer_test:
  build: CMakeDeps/CMakeToolchain, find_package(libgdsii), link libgdsii::libgdsii
  assertions:
    - "GetLayers() 非空（解析出金属层索引）"
    - "GetPolygons(-1) 非空且首多边形坐标数 >= 6（至少 3 顶点）"
    - "GetPolygons(layers[0]) 非空（按层过滤 API 可用）"
    - "GetTextStrings(-1) 可调用（文本元素 API 可用）"
  exit_code_semantics: 任一断言失败返回 1，conan test() 非零即失败
