software: libgdsii
display: "libGDSII"
description: "C++ library for reading GDSII geometry files"
category: libs
homepage: "https://github.com/HomerReid/libGDSII"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag 归档无生成物 configure，构建期 autoreconf -fi 自举（tool_requires automake/libtool）"
    - "configure.ac 为 2019 年代写法，--build/--host 均传 aarch64-unknown-linux-gnu"
    - "HMDFS umask 077 mktemp 探针需放宽（E011/E114）"
  common_dependencies: []

versions:
  "0.2-ds.1":
    status: built
    build_date: "2026-09-17"
