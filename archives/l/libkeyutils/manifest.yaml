software: libkeyutils
display: "libkeyutils"
description: "Linux key management utilities library (keyutils)"
category: system
homepage: "https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/"
license: "LGPL-2.1-or-later"
build_system: makefile

ohos_adaptation:
  key_points:
    - "Plain Makefile build (no configure/autotools)"
    - "-Drindex=strrchr: BSD alias rindex() not declared in musl libc"
    - "Disable -Werror (clang/musl produces new warnings)"
    - "Compiler path from Conan conf (R33)"
  common_dependencies: []

versions:
  "1.6.3":
    status: built
    build_date: "2026-06-09"
    build_system: makefile
