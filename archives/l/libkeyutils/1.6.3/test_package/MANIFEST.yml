package: libkeyutils/1.6.3
homepage: "https://git.kernel.org/pub/scm/linux/kernel/git/dhowells/keyutils.git/"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make -C tests run"

upstream_tests:
  - name: keyutils test suite
    command: "make -C tests run"
    expected: "run kernel keyring tests (may fail without kernel keyrings support)"

test_package_tests:
  - file: test_keyutils.c
    description: "Link against libkeyutils and call keyctl_get_keyring_ID() and keyutils_version_string"
    command: "./test_keyutils"

assertion_count: 2
