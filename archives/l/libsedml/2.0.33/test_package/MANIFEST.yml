package: libsedml/2.0.33
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: tests/TestIssues.cpp
    source: libSEDML-2.0.33/tests/TestIssues.cpp
    description: "Catch test suite: 33 TEST_CASE covering SED-ML L1V3-L1V5 read/write, sorting, styles, namespaces"
    command: "ctest --output-on-failure (runs test_sedml_run)"
test_package_tests:
  - file: test_sedml.cpp
    description: "consumer test: build L1V4 doc, KiSAO lookup, serialize, read back, validate error-free"
    command: "./test_sedml"
assertion_count: 10
