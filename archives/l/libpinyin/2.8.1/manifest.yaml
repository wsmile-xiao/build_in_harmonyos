# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.8.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8.1"

# 软件名
software: "libpinyin"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libpinyin/libpinyin/archive/refs/tags/2.8.1.tar.gz"

  # 源码校验和
  sha256: "42c4f899f71fc26bcc57bb1e2a9309c2733212bb241a0008ba3c9b5ebd951443"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - glib/2.88.3
  - berkeley-db/4.8.30
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-fix-ngram-tests-tmpdir.patch"
- "0002-model-data-download-resilience.patch"
- "0003-pinyin-h-stdbool-for-c-consumers.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "gen-2 索引（ChewingLargeTable2/Bigram）的实现只在 BDB/KyotoCabinet 后端头文件里，两个后端全关必然编译失败；制品仓 berkeley-db/4.8.30 已发布可直接用"
- "上游 FindGLIB2/FindBerkeleyDB 消费旧式变量（GLIB2_INCLUDE_DIR/DB_INCLUDE_DIR 等），而 conan 依赖经 CMakeDeps 以 config 包提供，find_package 会被 config 截胡导致变量为空：需在 generate() 用 tc.variables 显式喂 include 目录与库路径"
- "CMake >=4 移除了 <3.5 兼容：cmake_minimum_required 过旧必须在 configure 命令行 -DCMAKE_POLICY_VERSION_MINIMUM=3.5（toolchain 变量无效，它在 project() 才生效）"
- "设备 /tmp 为只读文件系统：上游硬编码 /tmp 的测试用例会段错误，需补丁改为相对路径"
- "上游 data 步骤无条件 wget SourceForge 模型包，网络抖动即构建失败；改为存在完整副本则跳过并从缓存预置"
- "共享 dlcache（core.sources:download_cache）按 conandata 声明的内容 sha256 命中，命中即零网络，可绕过 E017 镜像注入超时"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
