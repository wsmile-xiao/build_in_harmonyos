# conandata.yml — libpinyin 2.8.1
# 官方源（GitHub tag 归档），sha256 真机实测

sources:
  url:
    - "https://gh-proxy.com/https://github.com/libpinyin/libpinyin/archive/refs/tags/2.8.1.tar.gz"
    - "https://github.com/libpinyin/libpinyin/archive/refs/tags/2.8.1.tar.gz"
  sha256: "42c4f899f71fc26bcc57bb1e2a9309c2733212bb241a0008ba3c9b5ebd951443"

patches:
  - patch_file: "patches/0001-fix-ngram-tests-tmpdir.patch"
    patch_description: "测试用例硬编码 /tmp/*.db；OHOS 设备 /tmp 为只读文件系统，BDB open 失败导致 ngram/flexible_ngram 段错误。改用测试构建目录相对路径"
    patch_type: "test_fix"
    patch_strip: 1
  - patch_file: "patches/0002-model-data-download-resilience.patch"
    patch_description: "上游 data 步骤无条件 wget SourceForge 模型数据包，网络抖动即构建失败；已有完整副本时跳过下载（构建目录由配方预置共享缓存副本）"
    patch_type: "build_resilience"
    patch_strip: 1
  - patch_file: "patches/0003-pinyin-h-stdbool-for-c-consumers.patch"
    patch_description: "上游公开头 pinyin.h 使用 bool 但未包含 stdbool.h，纯 C 消费者无法编译；仅在非 C++ 编译时补 include，无 ABI 影响"
    patch_type: "portability"
    patch_strip: 1
