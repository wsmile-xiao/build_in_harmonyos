# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 要求存在）

package: libpinyin/2.8.1
homepage: "https://github.com/libpinyin/libpinyin"

# 上游 CMake 顶层 enable_testing() + tests/ 注册（tests/CMakeLists.txt 的 add_executable 系列）
upstream_check_command: "ctest --output-on-failure"

# build() 中已集成上游测试：CMakeToolchain 构建后调用 cmake.test()（R51 硬规则）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: tests/test_chewing.cpp
    source: libpinyin-2.8.1/tests/test_chewing.cpp
    description: "注音(chewing)输入解析用例"
    command: "ctest -R chewing"
  - file: tests/test_phrase.cpp
    source: libpinyin-2.8.1/tests/test_phrase.cpp
    description: "词组/短语解析用例"
    command: "ctest -R phrase"
  - file: tests/test_pinyin.cpp
    source: libpinyin-2.8.1/tests/test_pinyin.cpp
    description: "全拼输入解析用例"
    command: "ctest -R pinyin"

# test_package 自带的消费者测试（消费者视角，R34/赛道二硬门禁）
test_package_tests:
  - file: test.c
    description: "驱动 libpinyin 公开 API：pinyin_init/alloc_instance/parse_more_full_pinyins/get_sentence/reset/parse_more_chewings/free_*（5 项断言）"
    command: "./test_libpinyin"

assertion_count: 6
