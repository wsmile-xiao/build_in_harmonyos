sources:
  url:
    - "https://github.com/libpinyin/libpinyin/archive/refs/tags/2.10.3.tar.gz"
  sha256: "a49286721fb2b0234d86c095db9226246b0aa4a0bb6a885d0902da2743c56476"

patches:
  - patch_file: "patches/0001-tests-use-build-directory.patch"
    patch_description: "Avoid hard-coded /tmp paths in the registered database tests"
    patch_type: "test_fix"
    patch_strip: 1
  - patch_file: "patches/0002-preverified-model20.patch"
    patch_description: "Consume the SHA-256-verified model20 archive prepared by the recipe instead of invoking wget"
    patch_type: "build_resilience"
    patch_strip: 1
  - patch_file: "patches/0003-c-header-stdbool.patch"
    patch_description: "Make the public C header self-contained for bool"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0004-cmake-punctuation-parity.patch"
    patch_description: "Synchronize the CMake build, installed model, and registered test with the upstream Autotools punctuation feature"
    patch_type: "build_system"
    patch_strip: 1
  - patch_file: "patches/0005-cmake-clean-list.patch"
    patch_description: "Pass the CMake clean-files property a single quoted list argument"
    patch_type: "build_system"
    patch_strip: 1
