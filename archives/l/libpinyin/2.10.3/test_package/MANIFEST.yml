package: libpinyin/2.10.3
homepage: "https://github.com/libpinyin/libpinyin"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# CMake registers the first four tests; the parity patch registers the two
# additional upstream Autotools tests, so the declared count is exactly six.
upstream_tests:
  - file: tests/include/test_memory_chunk.cpp
    source: libpinyin-2.10.3/tests/include/test_memory_chunk.cpp
    description: "MemoryChunk persistence and mapping"
    command: "ctest -R '^memory_chunk$'"
  - file: tests/storage/test_phrase_index_logger.cpp
    source: libpinyin-2.10.3/tests/storage/test_phrase_index_logger.cpp
    description: "Phrase index logger persistence"
    command: "ctest -R '^phrase_index_logger$'"
  - file: tests/storage/test_ngram.cpp
    source: libpinyin-2.10.3/tests/storage/test_ngram.cpp
    description: "Berkeley DB n-gram save and load"
    command: "ctest -R '^ngram$'"
  - file: tests/storage/test_flexible_ngram.cpp
    source: libpinyin-2.10.3/tests/storage/test_flexible_ngram.cpp
    description: "Flexible n-gram database"
    command: "ctest -R '^flexible_ngram$'"
  - file: tests/storage/test_punct_table.cpp
    source: libpinyin-2.10.3/tests/storage/test_punct_table.cpp
    description: "Punctuation table round trip"
    command: "ctest -R '^punct_table$'"
  - file: tests/storage/test_table_info.cpp
    source: libpinyin-2.10.3/tests/storage/test_table_info.cpp
    description: "Table metadata round trip"
    command: "ctest -R '^table_info$'"

test_package_tests:
  - file: test.c
    description: "Consumer links the public C API, loads installed model20 data, and exercises parse/guess/reset"
    command: "./test_libpinyin"

assertion_count: 7
