software: libspatialite
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-20"

# 构建系统类型（必须）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.gaia-gis.it/gaia-sins/libspatialite-sources/libspatialite-5.1.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--enable-proj=no"
    - "--enable-freexl=no"
    - "--enable-geos=no"
    - "--enable-minizip=no"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - sqlite3/3.49.1
    - libxml2/2.13.5
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - name: "0004-configure.patch"
    type: "platform"
    description: "修改 configure 中的 umask 077 → umask 022，解决 HMDFS UID 映射权限问题 (E011)"
    guard: "autotools/HMDFS"
  - name: "0005-examples-demo2.c.patch"
    type: "conditional"
    description: "添加 #ifdef HAVE_GEOS_C_H 条件编译守卫，避免在禁用 GEOS 时编译失败"
    guard: "geos_disabled"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011 解决方案：修改 configure 中的 umask 077 → umask 022，解决 HMDFS UID 映射权限问题"
  - "examples/demo2.c 硬编码包含 geos_c.h，需要添加 #ifdef HAVE_GEOS_C_H 条件编译守卫"
  - "设置 CC=clang 和 CXX=clang++，以及 CFLAGS/LDFLAGS/PKG_CONFIG_PATH 环境变量以正确找到依赖"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/libspatialite-5.1.0.orig
  source_work_dir: /storage/Users/currentUser/builds/libspatialite-5.1.0.work
