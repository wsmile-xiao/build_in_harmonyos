software: libuio
display: "libuio"
description: "Linux UIO（Userspace I/O）用户空间辅助库：枚举/映射/读写 UIO 设备，附 lsuio/readuio 命令行工具"
category: system
homepage: "https://github.com/missinglinkelectronics/libuio"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "argp.h 为 glibc 扩展，OHOS musl 不提供：CLI 工具选项解析改 getopt_long（补丁）"
    - "GitHub tag 归档不含 configure：build() 先 bash autogen.sh 再 configure，automake/libtool 走 tool_requires，autoconf/m4 由 SDK 提供"
    - "gettext i18n 与 texinfo 文档裁剪（补丁）：OHOS 无 libintl 运行时，交叉工具链无 autopoint/makeinfo"
    - "glib-2.0 为可选依赖，--without-glib 关闭后库内有 g_warning→fprintf 回退，依赖闭包为空"
    - "AM_CONFIG_HEADER/AC_PROG_LIBTOOL 等旧宏在 automake 1.18 下仅 obsolete 警告，无需补丁（libnxml 0.18.5 同款实测）"
  common_dependencies: []

versions:
  "0.3.0":
    status: built
    build_date: "2026-09-19"
