# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libuio/0.3.0
homepage: "https://github.com/missinglinkelectronics/libuio"

upstream_check_command: "grep -c 'TESTS\\|check_PROGRAMS' Makefile.am; ls tests 2>&1"
upstream_test_in_build: false
upstream_test_command: ""

# R51 上游测试清点（证据）：
#   - 源码树无 tests/ 目录（tar xzf v0.3.0.tar.gz && ls：仅 AUTHORS/COPYING/
#     ChangeLog-from-git/Makefile.am/NEWS/README/*.c/*.h/autogen.sh/configure.ac/
#     lgpl21.texi/lsuio.1/lsuio.texi/po/ 等，无测试目录）
#   - Makefile.am 无 TESTS / check_PROGRAMS / XFAIL_TESTS 变量（通读全文核实）
#   结论：上游 0.3.0 确无测试套件，`make check` 为空操作。
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "C API：uio_find_devices 枚举真实 /sys/class/uio（无设备系统上合法返回 NULL）；uio_find_by_uio_name/uio_find_by_uio_num 负路径断言返回 NULL"
    command: "./test_libuio"
  - file: consumer_fake_sysfs.c
    description: "消费者级端到端：伪造完整 sysfs 树（name/version/dev/maps/mapN/{addr,size,name}）经 uio_setsysfs_point 重定向，断言枚举/name/version/major/minor/fd/maxmap/addr/size/offset（=addr&(pagesize-1)）/map name/按名索引/按名查找/按号查找/按基址查找 全部解析正确（23 项断言）。⭐真机发现：uio_find_by_uio_num 以残留 errno 判失败（search_major_minor 扫真 /dev 遇 EACCES，路径硬编码无法规避），该 API 断言命中或带 errno 的已文档化失败"
    command: "./consumer_fake_sysfs"
  - file: conanfile.py
    description: "CLI 冒烟：lsuio --version（走补丁 0001 的 getopt_long 路径）退出码 0；裸 lsuio 无设备时上游约定退出 1，故用 -V 作为确定性冒烟命令"
    command: "lsuio --version"

assertion_count: 26
