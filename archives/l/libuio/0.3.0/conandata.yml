# conandata.yml — libuio 0.3.0

sources:
  url: "https://github.com/missinglinkelectronics/libuio/archive/refs/tags/v0.3.0.tar.gz"
  sha256: "420fb12fca714ddcfa75804e6d3feb492b257579643876201af350b0a5d0fffd"

patches:
  - patch_file: "patches/0001-replace-argp-with-getopt-long-for-musl.patch"
    patch_description: "Replace glibc-only argp option parsing with getopt_long in lsuio/readuio and drop the argp.h configure check (OHOS musl has no argp)"
    patch_type: "portability"
  - patch_file: "patches/0002-drop-gettext-i18n-infrastructure.patch"
    patch_description: "Remove AM_GNU_GETTEXT machinery and po/ subdirectory: OHOS musl has no libintl runtime and the cross toolchain has no autopoint/gettextize; ENABLE_NLS stays undefined so the upstream _(Text) fallbacks compile to plain strings"
    patch_type: "portability"
  - patch_file: "patches/0003-drop-texinfo-docs-build.patch"
    patch_description: "Do not build the texinfo manual: makeinfo is not part of the OHOS cross toolchain and automake info rules would fail make all (man page is still installed)"
    patch_type: "portability"
