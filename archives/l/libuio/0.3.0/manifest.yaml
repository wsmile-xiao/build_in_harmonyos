software: libuio
# 版本级 manifest
# 文件位置: archives/l/libuio/0.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.3.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"

# 构建系统类型（顶级字段，verify 需要）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/missinglinkelectronics/libuio/archive/refs/tags/v0.3.0.tar.gz"
  sha256: "420fb12fca714ddcfa75804e6d3feb492b257579643876201af350b0a5d0fffd"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  configure_options:
    - "--without-glib"
    - "--without-werror"
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu"

  dependencies: []
  build_dependencies:
    - automake/1.18
    - libtool/2.5.4

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-replace-argp-with-getopt-long-for-musl.patch"
  - "0002-drop-gettext-i18n-infrastructure.patch"
  - "0003-drop-texinfo-docs-build.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "argp.h 为 glibc 扩展，OHOS musl 无；CLI 工具改 getopt_long（readuio.c 的 argp include 传递 errno.h，musl 下须补 errno.h）"
  - "GitHub tag 归档无 configure：OHOS 下不经 autogen.sh（其 autoreconf -s 符号链接模式被 HMDFS 拒绝），直接 autoreconf -f -i"
  - "HMDFS 拒绝脚本 exec：automake/libtool 包的 shim/perl 脚本经 $ACLOCAL/$AUTOMAKE/$LIBTOOLIZE 内联 env 前缀以解释器形态驱动（perl -I share/automake-1.18 .aclocal-real --automake-acdir/--system-acdir；automake 用 --libdir）"
  - "libtool/2.5.4 包 _lt_pkgdatadir 指向空目录：配方拼装 ltdata/（build-aux+libltdl+m4）并覆盖 _lt_pkgdatadir"
  - "HMDFS uid 映射 + umask：config.status 的 umask 077 mktemp 目录组位空导致 EACCES；BASH_ENV 注入 umask 022 的 mktemp 包装函数 + CONFIG_SHELL 钉 bash"
  - "hnp bash 在 HMDFS getcwd 失败：预设 PWD 环境变量走逻辑 pwd"
  - "gettext i18n 与 texinfo 文档直接裁剪：OHOS 无 libintl 运行时，交叉工具链无 autopoint/makeinfo"
  - "glib-2.0 可选依赖官方支持 --without-glib 关闭，库内有 g_warning→fprintf 回退"
  - "真机 10.62.178.77 conan create + test_package 1/1 + lsuio --version 全绿（2026-09-19，profile ohos-aarch64-fixed）"
