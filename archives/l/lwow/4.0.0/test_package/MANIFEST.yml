# test_package/MANIFEST.yml
# 上游官方测试声明文件 — lwow 4.0.0
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lwow/4.0.0
homepage: "https://github.com/MaJerle/lwow"

# 上游测试命令：lwow 官方 v4.0.0 无任何自动化测试套件
# （无 tests/ 目录、无 CTest/框架注册、CI 仅 release 发布），枚举证据见
# reports/upstream-test-enum.log（SHA-256 9e2fc4d8efacf65d3e7d1ace85d010f791ecb8514a34e40b64dbe1905e2d53e5）
upstream_check_command: "true  # 上游无测试：find/grep 枚举均 0 命中，无可复现测试命令"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无，如实申报）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，1 个)
test_package_tests:
  - file: test_package.c
    source: test_package/test_package.c
    description: "模拟 1-Wire 总线冒烟：lwow_init/lwow_reset/lwow_write_byte_ex/lwow_read_byte_ex/lwow_crc"
    command: "./test_package"

# 断言数量（test_package.c 内显式 FAIL 检查点 + 输出断言）
assertion_count: 5
