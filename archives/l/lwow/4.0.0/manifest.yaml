version: "4.0.0"
software: "lwow"
status: built
build_date: "2026-09-23"
build_system: "cmake"

source:
  url: "https://github.com/MaJerle/lwow/archive/refs/tags/v4.0.0.tar.gz"
  sha256: "0c4dd7573121b08029a05b7be3d63ff280b3d02476021f1762958c1775ae47b4"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "lwow 的 lwow/ 子目录为独立库 CMake 工程，library.cmake 无 install 规则，需 conanfile package() 手动打包"
  - "CMakeDeps 对多库包仅生成单一包 target（lwow::lwow），cpp_info.libs 中其余库不单独生成 target"
  - "cmake_layout 下 self.build_folder 已指向 build/Release，package() 需用候选路径探测库产物"