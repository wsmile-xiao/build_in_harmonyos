package: libnsgif/1.0.0
homepage: "https://www.netsurf-browser.org/projects/libnsgif/"

upstream_check_command: "sh test/runtest.sh <builddir>"
upstream_test_in_build: true
upstream_test_command: "sh test/runtest.sh <builddir>"

upstream_tests:
  - file: test/nsgif.c
    source: libnsgif-1.0.0/test/nsgif.c
    description: "Upstream GIF decoder test program; runs 284 GIF inputs (3 regular + 281 AFL corpus)"
    command: "sh test/runtest.sh <builddir>"

test_package_tests:
  - file: test.c
    description: "Consumer test covering GIF creation, scan, metadata, frame preparation and frame decoding"
    command: "./test_package"

assertion_count: 8
