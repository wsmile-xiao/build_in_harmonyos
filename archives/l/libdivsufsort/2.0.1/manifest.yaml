software: libdivsufsort
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/y-256/libdivsufsort/archive/refs/tags/2.0.1.tar.gz"

  # 源码校验和
  sha256: "9164cb6044dcb6e430555721e3318d5a8f38871c2da9fd9256665746a69351e0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 移除了对 cmake_minimum_required < 3.5 的兼容，需添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "conan-init 默认检测为 autotools，但本项目使用 CMake，需手动将 conanfile.py 从 Autotools 改为 CMake 工具链"
  - "CMAKE_POLICY_VERSION_MINIMUM 必须作为 cache_variable（-D 参数）传递，不能通过 tc.variables（toolchain 文件）设置，因为 cmake_minimum_required() 在 toolchain 加载前执行"
  - "libdivsufsort 静态库名为 divsufsort（libdivsufsort.a），package_info.cpp_info.libs 应设为 ['divsufsort']"
  - "GitHub 直连不可达时，可使用 codeload.github.com 镜像下载源码"
