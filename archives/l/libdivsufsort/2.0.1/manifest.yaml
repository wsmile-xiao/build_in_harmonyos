# manifest.yaml — libdivsufsort 2.0.1
# Follows ARCHIVE-SPEC v2.0

version: "2.0.1"
software: libdivsufsort
status: published
build_date: "2026-08-25"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/y-256/libdivsufsort/archive/refs/tags/2.0.1.tar.gz"
  sha256: "9164cb6044dcb6e430555721e3318d5a8f38871c2da9fd9256665746a69351e0"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_EXAMPLES=ON"
    - "-DBUILD_DIVSUFSORT64=ON"
    - "-DUSE_OPENMP=OFF"
    - "-DWITH_LFS=ON"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "libdivsufsort 2.0.1 upstream has no formal ctest/test suite; 5 example programs serve as verification targets"
  - "BUILD_DIVSUFSORT64=ON produces a second library divsufsort64 with 64-bit saidx64_t indices"
  - "Upstream CMake installs only the library + divsufsort.h; no CMake config targets are generated"
