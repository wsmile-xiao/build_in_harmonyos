# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8.0"

# 软件名
software: libsrtp2

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/cisco/libsrtp/archive/refs/tags/v2.8.0.tar.gz"

  # 源码校验和
  sha256: "d123dcff5c56d4f1a9006f2b311ea99a85016cbf3bb24b1007885d422237db85"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "LIBSRTP_TEST_APPS=ON"
    - "ENABLE_WARNINGS_AS_ERRORS=OFF"
    - "ENABLE_OPENSSL=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libsrtp2 官方源 tag v2.8.0 直接使用 CMake 构建，无需 autotools bootstrap"
  - "ENABLE_OPENSSL=OFF 使用内置 crypto（AES-ICM/AES-GCM/SHA-1），无外部依赖"
  - "静态库 libsrtp2.a 无需 ELF 签名；test_package 以 srtp2 公开 API 做会话生命周期验证"
