# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libsrtp2/2.8.0
homepage: "https://github.com/cisco/libsrtp"

# 上游测试命令 (CMake/CTest 注册)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试 (cmake.test())
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (ctest 注册的 12 项)
upstream_tests:
  - file: test/aes_calc.c
    source: libsrtp2-2.8.0/crypto/test/aes_calc.c
    description: "AES 128/256 向量校验 (aes_calc_128 / aes_calc_256)"
    command: "./aes_calc 000102030405060708090a0b0c0d0e0f 00112233445566778899aabbccddeeff 69c4e0d86a7b0430d8cdb78070b4c55a"
  - file: test/sha1_driver.c
    source: libsrtp2-2.8.0/crypto/test/sha1_driver.c
    description: "SHA-1 驱动测试"
    command: "./sha1_driver -v"
  - file: test/datatypes_driver.c
    source: libsrtp2-2.8.0/crypto/test/datatypes_driver.c
    description: "数据类型 (octet_string/bits) 驱动测试"
    command: "./datatypes_driver -v"
  - file: test/cipher_driver.c
    source: libsrtp2-2.8.0/crypto/test/cipher_driver.c
    description: "密码算法 (AES-ICM/AES-GCM) 驱动测试"
    command: "./cipher_driver -v"
  - file: test/kernel_driver.c
    source: libsrtp2-2.8.0/crypto/test/kernel_driver.c
    description: "Crypto kernel (组合算法) 驱动测试"
    command: "./kernel_driver -v"
  - file: test/rdbx_driver.c
    source: libsrtp2-2.8.0/test/rdbx_driver.c
    description: "Rollover Counter + 扩展序号数据库驱动测试"
    command: "./rdbx_driver -v"
  - file: test/replay_driver.c
    source: libsrtp2-2.8.0/test/replay_driver.c
    description: "重放保护驱动测试"
    command: "./replay_driver -v"
  - file: test/roc_driver.c
    source: libsrtp2-2.8.0/test/roc_driver.c
    description: "Rollover Counter 驱动测试"
    command: "./roc_driver -v"
  - file: test/srtp_driver.c
    source: libsrtp2-2.8.0/test/srtp_driver.c
    description: "SRTP 主驱动测试 (会话/策略/加解密)"
    command: "./srtp_driver -v"
  - file: test/test_srtp.c
    source: libsrtp2-2.8.0/test/test_srtp.c
    description: "SRTP 端到端测试"
    command: "./test_srtp"
  - file: test/rtpw_test.sh
    source: libsrtp2-2.8.0/test/rtpw_test.sh
    description: "rtpw 对端加密传输回环测试"
    command: "./rtpw_test.sh -w test/words.txt"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：srtp_init/srtp_create/srtp_dealloc/srtp_shutdown 会话生命周期"
    command: "./test_libsrtp2"

# 测试断言总数 (近似值)
assertion_count: 12