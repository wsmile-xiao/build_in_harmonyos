# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lfqueue/1.2.2
homepage: "https://github.com/Taymindis/lfqueue"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: example.c
    source: lfqueue-1.2.2/example.c
    description: "上游自测程序 lfqueue-example（CMake add_test lfqueue_test）：单生产者/多生产者与多消费者 FIFO 队列压测，验证 enq/deq/deq_must/single_deq API。注意：multi-enq+single-deq 场景存在上游 lock-free 竞态（_single_dequeue 立即 free head 与并发 _enqueue 的 tail 推进竞争），连续 5 次运行均在该场景挂起（见 notes.md 证据），单 enq+multi deq 场景 50/50 通过。"
    command: "./lfqueue-example"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：生产线程 enq 10 万整数、消费线程 deq，校验 FIFO 求和与 size==0，仅用公开 API"
    command: "./test_lfqueue"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
