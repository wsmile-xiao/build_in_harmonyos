# conandata.yml — lfqueue 1.2.2
# 官方源: Taymindis/lfqueue tag 1.2.2 (GitHub archive)
sources:
  url: "https://github.com/Taymindis/lfqueue/archive/refs/tags/1.2.2.tar.gz"
  sha256: "83b515dacb7fb92fa8690857fbb49592ebddea3e9b06cede1566107fadc224a9"

patches:
  - patch_file: "patches/0001-cmake-ohos-static-shared.patch"
    patch_description: "Bump cmake_minimum_required to 2.8...3.5 for CMake>=4 policy range; respect BUILD_SHARED_LIBS; drop install-time ldconfig (absent on OHOS); install header to plain include dir"
    patch_type: "portability"
  - patch_file: "patches/0002-single-deq-delayed-recycle.patch"
    patch_description: "Fix upstream _single_dequeue() UAF/livelock: do not free(head) immediately after head-advancing CAS (concurrent _enqueue() may still reference the node via its tail read); route the dequeued node into the delayed __lfq_recycle_free/__lfq_check_free free-list like the multi-consumer path, and drain the free-list after dequeue. Public API unchanged."
    patch_type: "bugfix"