# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdazzle/3.44.0
homepage: "https://gitlab.gnome.org/GNOME/libdazzle"

# 上游测试命令：meson 构建，tests/meson.build 注册 29 项 test()
upstream_check_command: "meson test -C build"

# conanfile.py build() 方法中已集成上游测试（_run_upstream_tests：
# broadwayd 无头显示 + GTest env，逐项执行并输出 upstream-test-results.txt）
upstream_test_in_build: true
upstream_test_command: "build() 内 _run_upstream_tests()（详见 conanfile.py UPSTREAM_TESTS）"

# 上游实际运行的测试程序（29 项注册套件，build-release/tests/ 下执行）
upstream_tests:
  - file: test-application.c
    source: libdazzle-3.44.0/tests/test-application.c
    description: "DzlApplication 注册与 action"
    command: "./test-application"
  - file: test-menu-manager2.c
    source: libdazzle-3.44.0/tests/test-menu-manager2.c
    description: "菜单管理器"
    command: "./test-menu-manager2"
