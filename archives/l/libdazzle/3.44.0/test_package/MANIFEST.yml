# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者端到端：GType 注册 → pattern spec 匹配语义 → Levenshtein 距离 → ref/unref 生命周期（真实调用 libdazzle-1.0.so 公开 API）"
    command: "./test_libdazzle"

# 测试断言总数 (实测：上游套件 28/29 套件级 PASS + 消费者 16 断言)
assertion_count: 16
