    description: "绑定组"
    command: "./test-binding-group"
  - file: test-binding-group.c（上游 bug：test-signal-group 注册同一二进制）
    source: libdazzle-3.44.0/tests/test-signal-group.c
    description: "信号组（套件实际运行 test-binding-group 二进制）"
    command: "./test-binding-group"
