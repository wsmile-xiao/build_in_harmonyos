# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libspandsp/3.1.1
homepage: "https://github.com/freeswitch/spandsp"

# 上游测试命令
# spandsp 使用 Autotools，测试为 tests/ 的 noinst_PROGRAMS（87 个二进制：
# 85 常规 + v32bis/v34 条件 2），无 automake TESTS harness，需 --enable-tests
# + make 手动构建运行；configure --enable-tests 要求 sox/pbmtog3/fax2tiff
# 外部程序与 libsndfile/fftw/libxml2/libpcap/X11/fltk 库（环境无，
# AC_MSG_ERROR 硬失败）。
upstream_check_command: "./configure --enable-tests && make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# R51 申报：上游共 87 个测试程序（tests/Makefile.am noinst_PROGRAMS，含 2 条件）
# - 实测编译运行 22 个纯算法/低依赖测试：21 PASS + 1 未跑（r2_mf_rx_tests
#   需 spandsp-sim 完整构建链）
# - 其余 65 个环境阻断：ITU/贝尔科版权测试数据、GUI（X11/fltk）、pcap/xml2
#   harness、真实音频设备
upstream_tests_total: 87
upstream_tests_pass: 21
upstream_tests_fail: 0
upstream_tests_skip: 66
upstream_test_pass_rate: "21/87 (可运行子集 21/22 = 95.5%；已跑测试 0 fail)"

# OHOS 上实际运行 PASS 的 21 个测试
upstream_tests:
  - file: tests/bit_operations_tests.c
    description: "位操作函数测试"
    command: "./bit_operations_tests"
  - file: tests/crc_tests.c
    description: "CRC 校验测试（ITU-16/ITU-32）"
    command: "./crc_tests"
  - file: tests/complex_tests.c
    description: "复数运算测试"
    command: "./complex_tests"
  - file: tests/complex_vector_float_tests.c
    description: "复数向量(浮点)测试"
    command: "./complex_vector_float_tests"
  - file: tests/complex_vector_int_tests.c
    description: "复数向量(整型)测试"
    command: "./complex_vector_int_tests"
  - file: tests/bitstream_tests.c
    description: "位流处理测试"
    command: "./bitstream_tests"
  - file: tests/hdlc_tests.c
    description: "HDLC 帧处理测试"
    command: "./hdlc_tests"
  - file: tests/t38_core_tests.c
    description: "T.38 核心测试"
    command: "./t38_core_tests"
  - file: tests/t38_non_ecm_buffer_tests.c
    description: "T.38 non-ECM buffer 测试"
    command: "./t38_non_ecm_buffer_tests"
  - file: tests/v42_tests.c
    description: "V.42 差错控制测试"
    command: "./v42_tests"
  - file: tests/vector_float_tests.c
    description: "向量(浮点)测试"
    command: "./vector_float_tests"
  - file: tests/vector_int_tests.c
    description: "向量(整型)测试"
    command: "./vector_int_tests"
  - file: tests/timezone_tests.c
    description: "时区处理测试"
    command: "./timezone_tests"
  - file: tests/logging_tests.c
    description: "日志框架测试"
    command: "./logging_tests"
  - file: tests/dc_restore_tests.c
    description: "直流恢复测试"
    command: "./dc_restore_tests"
  - file: tests/queue_tests.c
    description: "队列数据结构测试"
    command: "./queue_tests"
  - file: tests/awgn_tests.c
    description: "AWGN 高斯噪声测试"
    command: "./awgn_tests"
  - file: tests/alloc_tests.c
    description: "内存分配测试"
    command: "./alloc_tests"
  - file: tests/async_tests.c
    description: "异步数据测试"
    command: "./async_tests"
  - file: tests/bert_tests.c
    description: "BER 误码率测试（链 conan libsndfile 静态库）"
    command: "./bert_tests"
  - file: tests/t35_tests.c
    description: "T.35 国家代码测试（链 conan libsndfile 静态库）"
    command: "./t35_tests"

# 未运行 66 个测试的技术原因（R51 如实申报）：
# - r2_mf_rx_tests（1 个）：需 spandsp-sim 完整构建链（make_line_models
#   生成表 + fftw + line_model 数据），本轮未构建 sim 库
# - 传真/调制解调器数据驱动类：需 ITU/贝尔科版权测试数据（test-data/
#   的 unpack 脚本要外部数据包，不可分发）
# - GUI 类：X11/fltk 依赖
# - harness 类：pcap/xml2 socket harness
# - --enable-tests 本身 AC_MSG_ERROR（sox/pbmtog3/fax2tiff 外部程序缺失）

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libspandsp.c
    description: "消费者测试：G.711 编解码往返 + DTMF 生成 + CRC 交叉验证"
    command: "./test_libspandsp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 33
