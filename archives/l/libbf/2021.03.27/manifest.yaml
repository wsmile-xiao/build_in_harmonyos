software: libbf
display: "libbf"
version: "2021.03.27"
status: built
build_date: "2026-09-16"

source:
  url: "https://bellard.org/quickjs/quickjs-2021-03-27.tar.xz"
  sha256: "a45bface4c3379538dea8533878d694e289330488ea7028b105f72572fe7fe1a"
  tar_format: tar.xz

build:
  system: makefile
  configure_options:
    - "CC/AR/HOST_CC 从 Conan tools.build:compiler_executables 获取"
    - "libbf.a 直接编译 libbf.c + cutils.c (-O2 -fPIC)"
    - "make -j1 qjs CONFIG_BIGNUM=y (仅测试运行器, 不打包)"
    - "TMPDIR=<build_folder>/_tmp (qjsc 补丁配合)"
  dependencies: []

patches_applied:
  - "0001-qjsc-use-tmpdir.patch"

knowledge_gained:
  - "独立 libbf-2021-03-27.tar.gz 已从 bellard.org 下架, 同日期 quickjs 捆绑包内为同一 libbf"
  - "libbf.h 自包含, 打包仅需 libbf.h + libbf.a"
  - "qjsc.c /tmp 硬编码与 quickjs 新版本同源, 同一 TMPDIR 补丁适用"
  - "上游 test_bignum.js 经 qjs 运行即覆盖 libbf, 失败抛异常非零退出"
