# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libbf/2021.03.27
homepage: "https://bellard.org/libbf/"

# 上游测试套件存在性 (经审计源码包确认)
upstream_tests_exist: true

# 上游测试审计 (源码: quickjs-2021-03-27.tar.xz, sha256
# a45bface4c3379538dea8533878d694e289330488ea7028b105f72572fe7fe1a;
# 独立 libbf-2021-03-27.tar.gz 已从 bellard.org 下架, 详见 notes.md)
upstream_test_audit:
  source_tarball: "quickjs-2021-03-27.tar.xz"
  source_sha256: "a45bface4c3379538dea8533878d694e289330488ea7028b105f72572fe7fe1a"
  top_level_files:
    - libbf.c            # libbf 库本体 (与独立发布同日期版本一致)
    - libbf.h            # 自包含公开头文件 (仅依赖 stddef.h/stdint.h)
    - cutils.c/cutils.h  # 内部工具代码
    - list.h             # 内部链表头文件
    - qjs.c / quickjs.c  # qjs 测试运行器源码
    - tests/test_bignum.js  # 上游测试: BigFloat/BigDecimal (libbf 驱动)
    - Makefile           # test 目标经 ./qjs 运行各 JS 测试 (含 --bignum test_bignum.js)
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "tests/ 目录 (test_bignum.js 等)"
    - "Makefile test 目标"
  scan_result: "无 gtest/pytest; 上游测试为 tests/test_bignum.js, 由 Makefile test 目标经 './qjs --bignum tests/test_bignum.js' 运行; 文件含 126 处 assert() 调用点 + 8 处 assertThrows() 调用点 = 134 个静态断言点"
  make_check_output: "无 make check/ctest; 上游入口为 make test 的 test_bignum.js 一项"
  reason: "libbf 系无第三方依赖的纯 C 库, 上游以 JS 层 test_bignum.js 回归覆盖 libbf 的 BigFloat/BigDecimal(含 exp/log/pow/sin/cos/tan/asin/acos/atan/atan2 与进制转换); 失败时抛异常导致 qjs 非零退出, 无静默跳过"

# 上游测试命令 (conanfile.py build() 中真实执行)
upstream_check_command: "./qjs --bignum tests/test_bignum.js"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./qjs --bignum tests/test_bignum.js"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test_bignum.js
    source: quickjs-2021-03-27.tar.xz/tests/test_bignum.js
    description: "上游 BigFloat/BigDecimal 回归测试, 底层由 libbf 实现 (134 个静态断言点)"
    command: "./qjs --bignum tests/test_bignum.js"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libbf.c
    description: "消费者编译链接 libbf.a 并验证加/乘/除/开方/十进制解析 5 项真实断言"
    command: "sh test_libbf.sh"
  - file: test_libbf.sh
    description: "POSIX sh 包装器: 以打包头文件/静态库编译 test_libbf.c 并执行"
    command: "sh test_libbf.sh <include> <lib>"

# 测试断言总数 (134 上游静态断言点 + 5 test_package 真实断言)
assertion_count: 139
