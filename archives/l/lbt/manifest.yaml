software: lbt
display: "lbt"
description: "线性时序逻辑（LTL）到 Büchi 自动机的转换器（lbt 与 lbt2dot）"
category: utility
homepage: "http://www.tcs.hut.fi/Software/maria/tools/lbt/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 Makefile；C++（lbt）与 C（lbt2dot）混合，无三方依赖"
    - "2001 年的 C++ 源码用 `register` → 需 -std=gnu++98（C++17 已移除该存储类）"
    - "上游只在明文 HTTP 发布；用 Debian 同版本 .orig.tar.gz（HTTPS）固定 sha256"
  common_dependencies: []

versions:
  - version: "1.2.2"
    status: built
    build_date: "2026-09-23"
