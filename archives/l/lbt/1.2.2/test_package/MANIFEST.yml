# test_package/MANIFEST.yml
# lbt 1.2.2 - upstream test declaration.

package: lbt/1.2.2
homepage: "http://www.tcs.hut.fi/Software/maria/tools/lbt/"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream 1.2.2 ships C/C++ sources plus a hand-written Makefile with targets
  all/clean/reallyclean/install/installman. There is no test suite (no
  `make check`, no ctest, no tests/ directory); documentation is HTML under doc/.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_lbt.sh
    description: "installed lbt/lbt2dot filters: usage and error paths, translation of 'G p0' and conversion of the resulting automaton to GraphViz"
    command: "sh test_lbt.sh"

test_files:
  - path: "test_package/test_lbt.sh"
    test_type: "R34"
    assertion_count: 13

test_package_test_count: 1
consumer_assertion_count: 13
upstream_test_cases: 0
assertion_count: 13
