# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libomp-jonathonl/1.0.0
homepage: "https://github.com/jonathonl/omp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -S . -B build && cmake --build build && ./build/omp-test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./omp-test"

# 上游实际运行的测试程序
upstream_tests:
  - file: main.cpp
    source: omp-1.0.0/main.cpp
    description: "Upstream's complete standalone test: static and dynamic parallel_for, named/global critical sections, reusable thread_pool2, and parallel execution"
    command: "./omp-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: upstream_test.cpp
    description: "Exact consumer-side reproduction of the single upstream main.cpp test through the packaged CMake target"
    command: "./test_upstream"
  - file: ohos_thread_test.cpp
    description: "HarmonyOS-specific AArch64 test: verifies OHOS target macros, default omp::parallel, pthread scheduler metadata, dynamic scheduling, iteration indexes, and global critical sections"
    command: "./test_ohos_threads"

# 测试断言总数 (近似值, 用于质量评估)
upstream_inventory_total: 1
upstream_executed_total: 1
consumer_test_total: 1
ohos_specific_test_total: 1
assertion_count: 10
