software: libfixposix
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.1"

# 编译状态
# published | built | failed | archived
status: published
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/libfixposix/libfixposix-0.5.1.tar.gz"

  # 源码校验和
  sha256: "0c698a4483fee0b5830de668f113c242932adc68dfbffeb09bec527aa28539ce"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-aux-config.guess.patch"
  - "0002-config-aux-config.sub.patch"
  - "0003-configure.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "autoreconf -fi 需先运行（原始 tarball 不含 configure）"
  - "configure mktemp 路径需修改为 $TMPDIR（HMDFS umask 077 权限受限）"
  - "make -j2 失败（HMDFS mkfifo 不支持），需用 -j1"
  - "CONFIG_SHELL=bash 运行 configure 避免 toybox sh 兼容性问题"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib-minimal
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libfixposix-0.5.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libfixposix-0.5.1.work
  generated_at: '2026-06-04T16:05'
  patches_count: 2
  note: 0001/0002/原0003已移除（均为autoreconf -fi产物，不是手动源码修改）
  autoreconf_required: true  # config.guess/config.sub/configure 需先运行 autoreconf -fi 生成

patch_classification:
  - file: 0003-configure-mktemp.patch
    type: platform
    platform_only: True
    guard: 'none'  # configure mktemp 路径修改为 $TMPDIR，针对 HMDFS umask 077 权限限制
    applies_after: autoreconf  # 此补丁需在 autoreconf -fi 生成 configure 后应用
  - file: 0004-strerror-header-guard.patch
    type: bugfix
    platform_only: False
    guard: 'none'  # 修复上游头文件守卫冲突 _LFP_STRING_H_ → _LFP_STRERROR_H_
