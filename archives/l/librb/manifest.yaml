# 软件级 manifest — librb
# 遵循 ARCHIVE-SPEC v3.0

software: librb
display: "librb"
description: "Ring buffer FIFO queue C library with POSIX-like read/write API（单文件环形缓冲，支持多线程/growable/dynamic/claim-commit）"
category: library
homepage: "https://librb.bofc.pl"
license: BSD-2-Clause

build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub archive 快照不含 generated configure，需 autoreconf 自举（tool_requires 三件套）"
    - "generated configure 内 umask 077 在 HMDFS 上致 config.status 失败，构建时替换为 umask 022"
    - "线程保持上游默认开启，OHOS libc 提供 pthread/semaphore/C11 atomics"
    - "make check 的 mtest TAP 点以 tests.log 的 ok/not ok 计数为准"
    - "纯 C 库，无第三方依赖，无补丁"
  common_dependencies: []

versions:
  "2.0.0":
    status: built
    build_date: 2026-09-14
