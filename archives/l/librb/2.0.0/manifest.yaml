knowledge_gained:
  - "GitHub archive 快照不含 generated configure，需 tool_requires(automake/autoconf/libtool) + autoreconf 自举"
  - "generated configure 内 umask 077 在 HMDFS 上导致 config.status 写临时目录失败，构建时替换为 umask 022"
  - "上游 TESTS 虽只有一个 tests 二进制，但 mtest TAP 内部扇出数万测试点，计数以 tests.log 的 ok/not ok 行为准"
