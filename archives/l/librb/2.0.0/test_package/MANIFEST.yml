# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: librb/2.0.0
homepage: "https://librb.bofc.pl"

# 上游测试：automake TESTS 目标 `tests`（tests.c + rb.c + mtest.h），TAP 驱动
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试（_run_upstream_tests 解析 tests.log）
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试程序（单个 tests 二进制，内部为 mtest 参数化矩阵）
upstream_tests:
  - file: tests.c
    source: librb-2.0.0/tests.c
    description: "上游 mtest TAP 套件：单/多线程、growable/dynamic/claim-commit 全模式矩阵"
    command: "./tests"

# test_package 中自带的测试 (消费者视角验证，R34: 实质调用被测包 API)
test_package_tests:
  - file: test_librb.c
    description: "堆创建读写往返 + rb_count/rb_space 数值校验"
    command: "./test_librb"
  - file: test_librb.c
    description: "栈上 rb_init 初始化 + 结构体元素读写"
    command: "./test_librb"
  - file: test_librb.c
    description: "rb_growable 越限自动扩容后数据完整"
    command: "./test_librb"
  - file: test_librb.c
    description: "rb_peek 预读不消费 + rb_discard 丢弃语义"
    command: "./test_librb"
  - file: test_librb.c
    description: "rb_dynamic 变长帧写入读出 + rb_peek_size"
    command: "./test_librb"

# 测试断言总数 (test_librb.c 中 6 个检查约 29 处内部校验，近似值)
assertion_count: 29
