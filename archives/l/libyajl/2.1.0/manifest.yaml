software: libyajl
version: "2.1.0"
status: built
build_system: cmake
build_date: "2026-09-23"

source:
  url: "https://github.com/lloyd/yajl/archive/refs/tags/2.1.0.tar.gz"
  sha256: "3fb73364a5a30efe615046d07e6db9d09fd2b41c763c5f7d3bfb121cd5c5ac5a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - 0001-reformatter-cmake4-location.patch
  - 0002-verify-cmake4-location.patch

knowledge_gained:
  - "CMake 4.x removed GET_TARGET_PROPERTY(... LOCATION); use the $<TARGET_FILE:target> generator expression in ADD_CUSTOM_COMMAND instead."
  - "yajl top-level CMakeLists.txt declares CMAKE_MINIMUM_REQUIRED(VERSION 2.6); CMake 4.x rejects it — pass CMAKE_POLICY_VERSION_MINIMUM=3.5 as a cache variable."
  - "CMake 4.1.2 has no Platform/HarmonyOS.cmake module, so CMAKE_SHARED_LIBRARY_SONAME_C_FLAG is unset and libyajl.so links without a SONAME; set the flag explicitly in generate()."

verified:
  device: "HarmonyOS PC aarch64 (ohos profile clang)"
  date: "2026-09-23"
