# MANIFEST.yml — libyajl 2.1.0 test_package
# Declares the upstream test provenance for this L1 test (ARCHIVE-SPEC §2.2).

package: libyajl/2.1.0
test_type: conan-l1
test_origin: upstream
upstream_test: true
description: >
  Two-stage L1 test. Stage 1 (custom API consumer) parses an inline JSON
  document with yajl_tree_parse() and asserts nested string/integer values
  via yajl_tree_get(). Stage 2 (upstream regression) runs the upstream
  test/parsing harness: the packaged yajl_test binary against all 58
  test/parsing/cases/*.json inputs with flags derived from filename prefixes
  (ac_ -c / ag_ -g / am_ -m / ap_ -p), comparing combined stdout+stderr to
  the .gold expected outputs — mirroring upstream test/parsing/run_tests.sh.
test_sources:
  - test.c
build_system: cmake
runs_on_target: true
