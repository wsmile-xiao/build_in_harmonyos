package: libcoap/4.3.4
homepage: "https://github.com/obgm/libcoap"

# 上游测试声明
# 清点证据（v4.3.4 release tarball，tests/ 目录 CUnit 框架）：
#   tests/testdriver.c 依次注册 10 个 t_init_*_tests() 套件；
#   各测试文件以 *_TEST(suite, fn) 宏注册用例（python 统计非 #define 行）：
#     test_encode 16 / test_error_response 8 / test_options 43 / test_oscore 13 /
#     test_pdu 41 / test_sendqueue 10 / test_session 6 / test_tls 2 /
#     test_uri 24 / test_wellknown 4  => N_static = 167
# 默认构建（ENABLE_DTLS=OFF）下 16 套件中 oscore 不注册（其依赖 DTLS/crypto 后端），
# 实测 CUnit Run Summary：tests 154/154 passed、failed 0；未注册 13 项（test_oscore）
# 的技术原因：ENABLE_DTLS=OFF 消除系统 openssl 隐性依赖，OSCORE 无法启用。
# CMake 侧无 add_test/enable_testing 注册（上游经 testdriver 可执行文件手工运行）。
upstream_check_command: "tests/testdriver（CUnit，ENABLE_TESTS=ON 构建）"
upstream_test_in_build: true
upstream_test_command: "testdriver（配方 build() 内真实执行，CUnit Run Summary 判定）"

upstream_tests:
  - file: tests/testdriver.c
    source: libcoap-4.3.4/tests/
    description: "CUnit 全套上游单测（uri/encode/options/pdu/error_response/session/sendqueue/tls/wellknown）"
    command: "testdriver（build 目录内）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libcoap.c
    description: "消费者测试：coap_pdu_init/get_type/get_code/get_mid/add_option/add_data/get_data 回环断言"
    command: "./test_libcoap"

# 测试断言总数 (CHECK 宏计数，运行期输出)
assertion_count: 9
