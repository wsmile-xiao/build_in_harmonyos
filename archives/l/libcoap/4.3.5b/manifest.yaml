software: libcoap
version: "4.3.5b"
category: network
status: built
build_system: cmake
created_at: "2026-09-15"

source:
  url: "https://github.com/obgm/libcoap/archive/refs/tags/v4.3.5b.tar.gz"
  sha256: "383a17d8466cee7c1cb1d4dfbffad2651004850b29eb590e9591c7bedd46741d"

build:
  system: cmake
  compiler: "clang 15"
  target: "OHOS 6.0 armv8"
  options:
    - "ENABLE_DTLS=ON"
    - "DTLS_BACKEND=openssl"
    - "ENABLE_TESTS=ON"
    - "ENABLE_EXAMPLES=ON"
    - "ENABLE_DOCS=OFF"

dependencies:
  openssl: "3.5.6.1"
  cunit: "2.1.3"

verification:
  upstream_framework: "cunit"
  upstream_command: "./testdriver"
  consumer_tests: "pending真机evidence"
  cli_execution: "pending真机evidence"
