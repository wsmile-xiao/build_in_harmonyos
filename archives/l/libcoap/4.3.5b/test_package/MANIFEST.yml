package: libcoap/4.3.5b
homepage: "https://libcoap.net/"

upstream_check_command: "./testdriver"
upstream_test_in_build: true
upstream_test_command: "./testdriver (CUnit, built with ENABLE_TESTS=ON)"

upstream_tests:
  - file: tests/testdriver.c
    description: "CUnit driver running all suites (uri/encode/options/pdu/error_response/session/sendqueue/wellknown/tls/oscore)"
    command: "./testdriver"
  - file: tests/test_uri.c
    description: "URI parsing and construction tests"
  - file: tests/test_encode.c
    description: "Option/value encode and decode tests"
  - file: tests/test_pdu.c
    description: "PDU header and option iteration tests"
  - file: tests/test_tls.c
    description: "DTLS session and PSK credential tests"

test_package_tests:
  - file: test_coap.c
    description: "Consumer test: startup/version, URI parse, context+UDP session, session-backed PDU, option add/check"
    command: "./test_coap"

assertion_count: 12
