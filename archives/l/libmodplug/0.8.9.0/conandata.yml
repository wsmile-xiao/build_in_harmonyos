patches:
  - patch_file: "patches/0001-config.guess-ohos.patch"
    patch_description: "Teach 2015-era config.guess the HarmonyOS uname output (uname -s = HarmonyOS) and the __OHOS__ libc marker so native OHOS builds guess aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-ohos.patch"
    patch_description: "Accept linux-ohos triplets in config.sub (maybe_os split and the big os case list), matching the conan OHOS profile triplet"
    patch_type: "portability"
