# test_ohos/MANIFEST.yml — HarmonyOS PC 专项验证
# 七项独立鸿蒙检查（conanfile.py test() 输出 ==TEST_OHOS_BEGIN== JSON）：
#   T1_aarch64_elf    ELF64 AArch64
#   T2_musl_no_glibc  musl libc, 无 GLIBC 符号版本, 无 ld-linux
#   T3_soname         SONAME == libmodplug.so.1
#   T4_needed         NEEDED == [libc++_shared.so, libc.so]
#   T5_codesign       .codesign 段存在
#   T6_no_host_paths  无宿主绝对路径 / 无 RPATH-RUNPATH
#   T7_real_decode    test_modplug 18/18 (真实解码非静音)
checks:
  - id: T1_aarch64_elf
    desc: ELF64 AArch64 (readelf -h)
  - id: T2_musl_no_glibc
    desc: musl libc, no GLIBC symbol versions, no ld-linux
  - id: T3_soname
    desc: SONAME == libmodplug.so.1 (libtool -version-info 1:0:0)
  - id: T4_needed
    desc: NEEDED == [libc++_shared.so, libc.so]
  - id: T5_codesign
    desc: .codesign section present (OHOS signing pipeline)
  - id: T6_no_host_paths
    desc: no absolute host paths, no RPATH/RUNPATH
  - id: T7_real_decode
    desc: consumer TAP 18/18 pass incl. real non-silent decode
assertion_count: 25
assertion_count_note: 7 machine checks + 18 consumer TAP assertions (T7)
test_language: c
test_framework: tap
framework_flavor: bare
