# 版本级 manifest — libmodplug 0.8.9.0
# 位置: archives/l/libmodplug/0.8.9.0/manifest.yaml

version: "0.8.9.0"
software: libmodplug
status: in_progress
build_date: "2026-09-11"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/modplug-xmms/libmodplug/0.8.9.0/libmodplug-0.8.9.0.tar.gz"
  sha256: "457ca5a6c179656d66c01505c0d95fafaead4329b9dbaa0f997d00a3508ad9de"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--host=aarch64-linux-ohos"
    - "--build=aarch64-linux-ohos"
    - "--prefix=<package_prefix>"
    - "CC=clang"
    - "CXX=clang++"
    - "CFLAGS=-fPIC -O2"
    - "CXXFLAGS=-fPIC -O2 -fno-exceptions"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-config.guess-ohos.patch"
    reason: |
      config.guess 2015 版无 HarmonyOS 分支：`uname -s` 返回 "HarmonyOS"，
      未打补丁时所有 OHOS 元组探测返回空并 exit 1（实测 rc=1）。patch 在主
      case 加入 *:HarmonyOS:*:* 分支（旧式 echo/exit 风格），LIBC 探测宏
      用 __OHOS__ → LIBC=ohos，产出 linux-ohos 元组（对齐 libmikmod 0001
      与仓库 perl 脚本先例）。未选 musl：仓库规范要求 OHOS 变体用
      linux-ohos，与 conan profile host=aarch64-linux-ohos 一致。
  - file: "patches/0002-config.sub-ohos.patch"
    reason: |
      config.sub 2015 版 maybe_os 列表无 linux-ohos。patch 在 L118 maybe_os
      加 linux-ohos* 并入 os 大列表。第一版曾硬编码 os=-linux-ohos 破坏
      linux-gnu/android/musl 元组（回归实测），改为保留 os=-$maybe_os 传值
      后常见元组全部通过。

knowledge_gained:
  - "libmodplug 0.8.9.0 上游无任何测试（无 test 目录、无 check/TESTS 目标、无测试框架引用，tarball 全量列表+Makefile.am+configure 三重证据），按 TEST_QUALITY_SPEC 以消费者测试+鸿蒙专项测试替代"
  - "MODMAGIC 布局怪癖：libmodplug 0.8.9.0 load_mod.cpp 的探测结构把 4 字节 magic（M.K.）放在 order 列表之后（偏移 20+930+130=1080），与常见'magic 在 orders 前'的描述相反；合法 fixture 必须按此布局构造，否则探测失败落入 15-sample 分支（m_nSamples=15、Order 错位、GetLength=0、全静音）"
  - "conan profile 的 clang 路径 /data/service/hnp/bin/clang 与实际 /storage/Users/currentUser/usr/local/bin 不一致但 ABI 相同（同为 clang-15 aarch64 OHOS），本机原生构建即目标设备构建"
  - "源码树 umask 077 导致 HMDFS 下 configure 产出的文件组不可读，make 前需 sed 修复（lame 先例）"
