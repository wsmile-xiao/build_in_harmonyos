  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  verified_architectures:
    - armv8

patches_applied: []

tests:
  upstream:
    build_command: "cc -c opaque.c common.c oprf.c toprf.c utils.c + link tests/opaque-test and tests/opaque-munit"
    run_command: "./opaque-test && ./opaque-munit --fatal-failures"
    total: 33
    passed: 0
    target: "HarmonyOS 6.0 aarch64 (HMBS preflight pending)"
  consumer:
    command: "./test_opaque"
    assertions: 10
    passed: 0
    target: "HarmonyOS 6.0 aarch64 (HMBS preflight pending)"

limitations:
  - "Upstream CFRG test vectors (tests/opaque-testvectors.c) not run: needs OPRFHOME git checkout with generated headers, optional even upstream"
  - "Threshold/DKG/noise_xk sources and language bindings (python/js/lua/go/...) not packaged; core C protocol library only"
  - "utils/opaque demo CLI not packaged (needs pandoc man pages; library-only recipe)"

knowledge_gained:
  - "libopaque hard-depends on liboprf which has no registry recipe; vendoring its 3 portable core sources (oprf.c/toprf.c/utils.c) keeps a single-package PR"
  - "Upstream makefile flags (-march=native, sanitizers, pkgconf probes) are not device-portable; direct compilation with minimal flags needs no source patches"
  - "With libsodium >= 1.0.19, -DHAVE_SODIUM_HKDF=1 removes the need for both aux_ HKDF shims (opaque sha512 + oprf sha256)"
  - "liboprf dkg/tp-dkg/stp-dkg/mpmult/toprf-update sources need Zephyr/noise backends and are outside the core OPAQUE protocol; opaque.c only needs oprf_* and toprf_3hashtdh/toprf_thresholdmult"

patch_classification: []
