package: libopaque/1.0.1
homepage: "https://github.com/stef/libopaque"

upstream_check_command: "build and run src/tests/opaque-test and src/tests/opaque-munit"
upstream_test_in_build: true
upstream_test_command: "./opaque-test && ./opaque-munit --fatal-failures"

upstream_tests:
  - file: "tests/opaque-test.c"
    source: "libopaque-1.0.1/src/tests/opaque-test.c"
    description: "Upstream end-to-end program: 1-step registration plus 4-step private registration, each followed by a full credential AKE with shared-secret comparison and explicit user authentication"
    command: "./opaque-test"
    count: 1
  - file: "tests/opaque-munit.c + tests/munit/munit.c"
    source: "libopaque-1.0.1/src/tests/opaque-munit.c"
    description: "Upstream munit matrix (2 pwdU x 2 idU x 2 idS x 4 registration types: server-init, server-1k-init, private-init, private-1k-init), each case running registration plus full AKE"
    command: "./opaque-munit --fatal-failures"
    count: 32

upstream_test_audit: "Upstream src/tests/ holds opaque-test.c, opaque-munit.c (bundled munit), opaque-testvectors.c and pre-generated cfrg_test_vectors.h. opaque-testvectors.c (CFRG vectors) is intentionally not run: upstream builds it only when OPRFHOME (a liboprf git checkout with generated vector headers) exists and ignores its result (|| true); the vendored liboprf 0.9.4 release tarball has no generated vector headers. Counted suite is therefore 1 + 32 = 33 cases."

test_package_tests:
  - file: "test_opaque.c"
    description: "Consumer test calling the real public API: one-step registration, full credential AKE, shared-secret match, explicit user auth, export-key sanity, 4-step private registration, second AKE on the private record, wrong-password mismatch (negative)"
    command: "./test_opaque"
    count: 1
    assertions: 10

upstream_test_count: 33
consumer_test_count: 1
consumer_assertion_count: 10
assertion_count: 43
