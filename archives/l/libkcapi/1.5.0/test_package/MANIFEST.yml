# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libkcapi/1.5.0
homepage: "https://github.com/smuellerDD/libkcapi"

# 上游测试命令：test/test.sh（上游官方测试套件，通过 --enable-kcapi-test
# 构建 bin/kcapi 主测试程序）。已在鸿蒙 PC 本机实际执行：
#   KCAPI_TEST_BIN_DIR=<build>/bin bash test.sh
# 结果：0/225 通过（225 FAILED），exit=194。
# 根因（平台内核层，非库适配缺陷）：
#   1. 每个用例均在 libkcapi 内部 AF_ALG socket bind 处失败：
#      "libkcapi - Error: AF_ALG: bind failed (errno: -13)"
#      （EPERM，SELinux hishell_hap 域对非特权进程拒绝 bind(AF_ALG)）
#   2. /proc/crypto 不存在 —— HongMeng Kernel 1.12.0 不提供内核
#      crypto API 的 /proc/crypto 用户态视图，AF_ALG 无可用算法后端。
# 上游全部 225 个用例（hash/hmac/hkdf/skcipher/aead/rng 等）均依赖
# 内核 AF_ALG，属平台能力缺失（同 E237 compile-verify-with-runtime-
# degradation 模式），故上游用例通过率为 0%，另有 test_package 消费者
# 冒烟测试 1/1 通过（不依赖 AF_ALG 的纯用户态 API）。
upstream_check_command: "bash test.sh (executed; 0/225 — AF_ALG EPERM, /proc/crypto missing on HongMeng kernel)"
upstream_test_in_build: false
upstream_test_command: "bash test.sh"

# 上游实际运行的测试程序
upstream_tests:
  - file: bin/kcapi (from test/kcapi-main.c)
    description: "Upstream main test program: 225 cases (hash/hmac/hkdf/skcipher/aead/rng); all executed, all FAILED at AF_ALG bind (errno -13)"
    command: "./kcapi (driven by test/test.sh)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test: kcapi_versionstring/kcapi_version API linkage (no AF_ALG required) — PASS"
    command: "./test_libkcapi"

# 测试断言总数 (近似值)
assertion_count: 225
