software: libkcapi
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# 构建系统类型（顶层字段，供验证脚本使用）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/smuellerDD/libkcapi/archive/refs/tags/v1.5.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译器标志
  cflags: "-Wno-sign-compare"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lib-kcapi-kernel-if.c.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# 补丁分类标注（供 AI 填写）
patch_annotations:
  - file: "0001-lib-kcapi-kernel-if.c.patch"
    type: "platform_compat"
    guard: "__OHOS__"
    description: "修复 sockaddr_storage 重定义问题（OHOS 内核头文件与 musl libc 冲突）"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E091: OHOS 内核头文件 linux/socket.h 与 musl libc sys/socket.h 的 sockaddr_storage 重定义冲突"
  - "解决方案: 在 #include <linux/netlink.h> 前后添加宏守卫（#define sockaddr_storage __linux_sockaddr_storage）"
  - "CMSG_NXTHDR 符号比较警告: 需添加 -Wno-sign-compare 到 CFLAGS"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/libkcapi-1.5.0.orig
  source_work_dir: /storage/Users/currentUser/builds/libkcapi-1.5.0.work
  source_orig_hash: 2c961089172544bc
  source_work_hash: b457b8d368a898c1
  generated_at: '2026-06-10T10:26:34'
  patches_count: 1

patch_classification:
  - file: 0001-lib-kcapi-kernel-if.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
