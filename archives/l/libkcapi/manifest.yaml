software: libkcapi
display: "libkcapi"
description: "Linux Kernel Crypto API User Space Interface Library"
category: security
homepage: "https://github.com/smuellerDD/libkcapi"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 autoreconf -i 生成 configure 脚本"
    - "OHOS 内核头文件与 musl libc 的 sockaddr_storage 重定义冲突"
    - "CMSG_NXTHDR 符号比较警告需要 -Wno-sign-compare"
  common_dependencies: []

versions:
  "1.5.0":
    status: built
    build_date: "2026-06-10"