package: leaflet-geometryutil/0.4.0
homepage: "https://github.com/makinacorpus/Leaflet.GeometryUtil"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"
upstream_tests:
  - file: "upstream-test.js"
    source: "leaflet-geometryutil-0.4.0/package/test/test.geometryutil.js"
    description: "Upstream mocha suite (60 test cases). Executed in a jsdom + Leaflet 0.7.2 environment via mocha, replacing phantomjs which is EOL with no aarch64 build."
    command: "mocha --require setup.js upstream-test.js"

test_package_tests:
  - file: "harmony_smoke.js"
    description: "HarmonyOS-specific tests: verifies L.GeometryUtil API mounting (24 assertions), pure-function numeric results (13 assertions), and consumer scenarios on a real Leaflet map (3 assertions)."
    command: "node --jitless harmony_smoke.js <dist-js>"

assertion_count: 100
