# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libfm-qt/2.4.0
homepage: "https://github.com/lxde/libfm-qt"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（src/tests/ 下的 5 个演示程序，已适配为
# QTimer 自动退出 + 非零返回码失败判定，可无显示环境（offscreen）运行；
# 上游测试本身无 CHECK 断言宏，通过退出码判定成功/失败）
upstream_tests:
  - file: test-folder.cpp
    description: "验证 Fm::Folder::fromPath 打开目录并遍历文件"
  - file: test-filedialog.cpp
    description: "验证 Fm::FileDialog 构造与文件模式配置"
  - file: test-folderview.cpp
    description: "验证 Fm::CachedFolderModel / FolderView 模型装配"
  - file: test-placesview.cpp
    description: "验证 Fm::PlacesView 构造"
  - file: test-volumemanager.cpp
    description: "验证 Fm::VolumeManager::globalInstance 及卷枚举"

# test_package 中自带的测试 (消费者视角)
test_package_tests:
  - file: test.cpp
    description: "验证 libfm-qt 库链接和核心 API（FilePath + Folder + FolderModel），8 个 CHECK 断言"
    command: "./test_libfm-qt"

# 测试断言总数（test.cpp 8 项 CHECK 断言；上游 5 个演示程序通过 QTimer
# 自动退出 + 非零退出码判定，无 CHECK 断言宏）
assertion_count: 8
