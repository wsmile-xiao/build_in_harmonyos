software: libjose
display: "libjose"
description: "C-language implementation of Javascript Object Signing and Encryption (JOSE)"
category: crypto
homepage: "https://github.com/latchset/jose"
license: Apache-2.0
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 构建,docs=disabled 跳过 asciidoc man 页"
    - "PkgConfigDeps 暴露依赖,另派生 libcrypto.pc 别名供 meson dependency('libcrypto') 解析"
    - "共享库别名链在 HMDFS 上物化为实体拷贝"
  common_dependencies:
    - jansson
    - openssl
    - zlib

versions:
  "14":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libjose/14"
