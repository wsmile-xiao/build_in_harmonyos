# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libjose/14
homepage: "https://github.com/latchset/jose"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -v -C {build_folder} --no-rebuild --print-errorlogs"

# 上游实际运行的测试程序 (源码审计 tests/meson.build @ v14)
upstream_tests:
  - file: "tests/alg_hash.c"
    source: "jose-14.tar.xz/tests/alg_hash.c"
    description: "Compiled test: hash algorithm (jose_hook_alg_find KIND_HASH) coverage"
    command: "./alg_hash"
  - file: "tests/alg_sign.c"
    source: "jose-14.tar.xz/tests/alg_sign.c"
    description: "Compiled test: signature algorithm coverage"
    command: "./alg_sign"
  - file: "tests/alg_encr.c"
    source: "jose-14.tar.xz/tests/alg_encr.c"
    description: "Compiled test: encryption algorithm coverage"
    command: "./alg_encr"
  - file: "tests/alg_wrap.c"
    source: "jose-14.tar.xz/tests/alg_wrap.c"
    description: "Compiled test: key-wrap algorithm coverage"
    command: "./alg_wrap"
  - file: "tests/alg_comp.c"
    source: "jose-14.tar.xz/tests/alg_comp.c"
    description: "Compiled test: DEF compression round-trip incl. DoS bound (MAX_COMPRESSED_SIZE)"
    command: "./alg_comp"
  - file: "tests/api_b64.c"
    source: "jose-14.tar.xz/tests/api_b64.c"
    description: "Compiled test: public Base64 API"
    command: "./api_b64"
  - file: "tests/api_jws.c"
    source: "jose-14.tar.xz/tests/api_jws.c"
    description: "Compiled test: public JWS sign/verify API (ES256/RS256/HS256)"
    command: "./api_jws"
  - file: "tests/api_jwe.c"
    source: "jose-14.tar.xz/tests/api_jwe.c"
    description: "Compiled test: public JWE encrypt/decrypt API"
    command: "./api_jwe"
  - file: "tests/jose-alg"
    source: "jose-14.tar.xz/tests/jose-alg"
    description: "Shell test: jose CLI algorithm listing (sign/wrap/encr/exch)"
    command: "./jose-alg"
  - file: "tests/jose-fmt"
    source: "jose-14.tar.xz/tests/jose-fmt"
    description: "Shell test: jose CLI formatting"
    command: "./jose-fmt"
  - file: "tests/jose-b64-enc"
    source: "jose-14.tar.xz/tests/jose-b64-enc"
    description: "Shell test: jose CLI base64 encode"
    command: "./jose-b64-enc"
  - file: "tests/jose-b64-dec"
    source: "jose-14.tar.xz/tests/jose-b64-dec"
    description: "Shell test: jose CLI base64 decode"
    command: "./jose-b64-dec"
  - file: "tests/jose-jwk-eql"
    source: "jose-14.tar.xz/tests/jose-jwk-eql"
    description: "Shell test: jose CLI JWK equality"
    command: "./jose-jwk-eql"
  - file: "tests/jose-jwk-exc"
    source: "jose-14.tar.xz/tests/jose-jwk-exc"
    description: "Shell test: jose CLI JWK key exchange"
    command: "./jose-jwk-exc"
  - file: "tests/jose-jwk-gen"
    source: "jose-14.tar.xz/tests/jose-jwk-gen"
    description: "Shell test: jose CLI JWK generation"
    command: "./jose-jwk-gen"
  - file: "tests/jose-jwk-pub"
    source: "jose-14.tar.xz/tests/jose-jwk-pub"
    description: "Shell test: jose CLI public-key export"
    command: "./jose-jwk-pub"
  - file: "tests/jose-jwk-use"
    source: "jose-14.tar.xz/tests/jose-jwk-use"
    description: "Shell test: jose CLI key-use enforcement"
    command: "./jose-jwk-use"
  - file: "tests/jose-jwk-thp"
    source: "jose-14.tar.xz/tests/jose-jwk-thp"
    description: "Shell test: jose CLI key thumbprint"
    command: "./jose-jwk-thp"
  - file: "tests/jose-jws-fmt"
    source: "jose-14.tar.xz/tests/jose-jws-fmt"
    description: "Shell test: jose CLI JWS formatting"
    command: "./jose-jws-fmt"
  - file: "tests/jose-jws-ver"
    source: "jose-14.tar.xz/tests/jose-jws-ver"
    description: "Shell test: jose CLI JWS verification"
    command: "./jose-jws-ver"
  - file: "tests/jose-jws-sig"
    source: "jose-14.tar.xz/tests/jose-jws-sig"
    description: "Shell test: jose CLI JWS signing"
    command: "./jose-jws-sig"
  - file: "tests/jose-jwe-fmt"
    source: "jose-14.tar.xz/tests/jose-jwe-fmt"
    description: "Shell test: jose CLI JWE formatting"
    command: "./jose-jwe-fmt"
  - file: "tests/jose-jwe-dec"
    source: "jose-14.tar.xz/tests/jose-jwe-dec"
    description: "Shell test: jose CLI JWE decryption"
    command: "./jose-jwe-dec"
  - file: "tests/jose-jwe-enc"
    source: "jose-14.tar.xz/tests/jose-jwe-enc"
    description: "Shell test: jose CLI JWE encryption"
    command: "./jose-jwe-enc"
  - file: "tests/issue-75/issue-75.c"
    source: "jose-14.tar.xz/tests/issue-75/issue-75.c"
    description: "Compiled regression test for issue 75 (requires openssl)"
    command: "./issue75"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test_package/test_jose.c"
    description: "Consumer test: Base64 round-trip, oct JWK gen/kty/thumbprint, HS256 JWS sign/verify (8 checks)"
    command: "./test_jose"

# 测试断言总数 (消费者测试的真实断言数)
assertion_count: 8
