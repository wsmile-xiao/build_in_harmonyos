# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
# 依据 R51 上游测试三步法清点（2026-09-30 对 Debian orig 源码包实测）：
# libsbig 4.9.9 上游为「预编译二进制分发」——源码包顶层仅
#   libsbig_{arm64,x64,armhf}.bin / SBIGUDrvOSX.bin / sbigudrv.h /
#   sbig*.hex / stfga.bin / libsbig.spec / CMakeLists.txt / 51-sbig-debian.rules /
#   LICENSE.firmware / cmake_modules / indi-3rdparty-infos
# 无 tests/ 目录、无任何 *test* 文件、CMakeLists.txt 无 enable_testing/add_test
# 注册、spec 无 %check 段——上游确无任何测试。
package: libsbig/4.9.9
homepage: "https://github.com/indilib/indi-3rdparty/tree/main/libsbig"

# 上游无任何自动化测试：无 ctest 注册、无可执行测试程序（无 C 源码）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 自带的消费者测试（R34/PF3：实质依赖被测包）
# 注：libsbig_arm64.bin 为 glibc 构建（DT_NEEDED 含 ld-linux-aarch64.so.1），
# OHOS musl 无 glibc loader，运行时 dlopen/链接运行必然失败（ELF 自签名仅过
# E318，不提供 glibc 符号）。因此 test() 改为对打包产物做静态 ELF 校验：
# 构建阶段仍链接 test.c 验证链接契约（SONAME+导出符号可解析）。
test_package_tests:
  - file: test_package/check_elf.py
    description: >-
      静态消费者校验：对打包产物 libsbig.so.4 断言 ELF 为 ET_DYN/AArch64、
      SONAME == libsbig.so.4（链接契约）、导出符号含真实驱动入口
      SBIGUnivDrvCommand、DT_NEEDED 含 libudev.so.1（eudev 依赖契约）。
      test_package/conanfile.py 的 build() 同时链接 test.c（sbigudrv.h +
      libsbig::libsbig），验证头文件与链接符号真实可解析。
    command: "python3 check_elf.py <libsbig.so.4>"
assertion_count: 4

