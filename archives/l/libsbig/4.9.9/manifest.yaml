version: "4.9.9"
software: libsbig

status: built
build_date: "2026-09-30"
build_system: custom

source:
  url: "https://deb.debian.org/debian/pool/non-free/libs/libsbig/libsbig_4.9.9.orig.tar.gz"
  sha256: "02df9d7e47d5bfea0adb9b4126251f7ab0587097bdbea9e0f5d749a14779cf4a"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies:
    - eudev/3.2.14
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libsbig（SBIG CCD 相机驱动库）上游为预编译二进制分发：源码包无 C 源码，仅 .bin/.h/.hex/.spec + CMakeLists.txt（纯安装逻辑、无测试目标）；配方按 arch 挑 libsbig_{arm64,x64}.bin 并补齐 soname 符号链，固件装 res/sbig，build() 为空（custom 构建，R33 不适用）"
  - "预编译 .so 在 OHOS 设备必须 ELF 自签名才能 dlopen/加载（E318 同类，沿用 systemd 261.1 做法，binary-sign-tool 存在才签）；libsbig_arm64.bin 的 DT_NEEDED 为 libudev.so.1，由 eudev/3.2.14 recipe 依赖提供"
