sources:
  "1.1.2":
    url: "https://github.com/xqq/libaribcaption/archive/refs/tags/v1.1.2.tar.gz"
    sha256: "649b50bde99272b97c66af2a8400163e2f84eae072d252daa26baaaf0866a1c2"

patches:
  "1.1.2":
    - patch_file: "patches/0001-CMakeLists.txt-ohos-conan-deps.patch"
      patch_type: portability
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos_libaribcaption"
      patch_description: |
        Replace CMake bundled find_package(Freetype/Fontconfig) module calls
        with CMakeDeps config packages (freetype::freetype,
        fontconfig::fontconfig) and set the legacy FREETYPE_LIBRARIES /
        Fontconfig_LIBRARIES variables from the imported targets. The bundled
        Find modules cannot see conan packages under the cross sysroot.
    - patch_file: "patches/0002-png-writer-conan-libpng.patch"
      patch_type: portability
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos_libaribcaption"
      patch_description: |
        test/png_writer: use the CMakeDeps libpng config package
        (libpng::libpng) instead of the bundled FindPNG module, which needs
        ZLIB and cannot find conan packages under the cross sysroot.
    - patch_file: "patches/0003-drcs-conan-deps.patch"
      patch_type: portability
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos_libaribcaption"
      patch_description: |
        test/drcs: same CMakeDeps config switch for the standalone freetype
        and fontconfig lookups (used when the parent project did not enable
        the renderer).
    - patch_file: "patches/0004-fontconfig-freetype-conan-deps.patch"
      patch_type: portability
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos_libaribcaption"
      patch_description: |
        test/fontconfig_freetype: same CMakeDeps config switch for the
        standalone freetype and fontconfig lookups.
    - patch_file: "patches/0005-test-skip-ffmpeg-tests.patch"
      patch_type: conan
      patch_source: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos_libaribcaption"
      patch_description: |
        Guard the caption2srt and ffmpeg test subdirectories behind
        ARIBCC_SKIP_FFMPEG_TESTS: they need an external MPEG-TS sample
        (passed via argv) that upstream does not ship, plus avcodec/
        avformat which are outside this recipe's dependency set. The other
        five upstream tests remain enabled and are run in build().
    - patch_file: "patches/0006-test-drcs-fix-drawchar-signature.patch"
      patch_type: bug
      patch_source: "https://github.com/xqq/libaribcaption"
      patch_description: |
        test/drcs: pass the missing aspect_ratio argument (1.0f) to
        TextRendererFreetype::DrawChar. The v1.1.2 tag's test code lags
        behind the library code, which added the aspect_ratio parameter
        (commit after the tag), so the test does not compile as shipped.
    - patch_file: "patches/0007-test-fontconfig-freetype-fix-drawchar-signature.patch"
      patch_type: bug
      patch_source: "https://github.com/xqq/libaribcaption"
      patch_description: |
        test/fontconfig_freetype: pass the missing aspect_ratio argument
        (1.0f) to TextRendererFreetype::DrawChar — same v1.1.2 tag
        test/library signature drift as 0006.
