version: "1.1.2"
entry: conanfile.py
upstream:
  homepage: "https://github.com/xqq/libaribcaption"
  repo: "https://github.com/xqq/libaribcaption"
  tag: "v1.1.2"
  url: "https://github.com/xqq/libaribcaption/archive/refs/tags/v1.1.2.tar.gz"
  sha256: "649b50bde99272b97c66af2a8400163e2f84eae072d252daa26baaaf0866a1c2"
  license: "MIT"
build:
  kind: cmake
  options:
    shared: ["True", "False"]
    with_renderer: ["True", "False"]
  dependencies:
    - fontconfig/2.18.3
    - freetype/2.14.3
  test_dependencies:
    - libpng/1.6.58.2
harmonyos:
  arch: [aarch64]
  libc: musl
tests:
  upstream:
    total: 8
    runnable: 5
    note: "caption2srt/ffmpeg need an external MPEG-TS sample; static: 5/5 run & pass, shared: 2/2 (test_decode/test_capi) — the other 3 use internal classes hidden in the shared lib by upstream design"
  consumer: 2
  harmonyos: 1
