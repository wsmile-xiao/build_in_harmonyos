# test_package/MANIFEST.yml — libaribcaption 1.1.2
id: libaribcaption-1.1.2-test_package
entry: conanfile.py
targets:
  - name: test_package
    kind: consumer
    lang: c
    asserts:
      - "decode(sample_data_1) == GOT_CAPTION"
      - "caption text non-empty UTF-8"
      - "plane geometry 960x540 / 720x480"
      - "decode(sample_data_drcs_1) == GOT_CAPTION && drcs_map non-null"
      - "decode(NULL,0) / truncated / garbage == NO_CAPTION, no crash"
      - "logcat callback receives no unexpected errors"
  - name: test_cpp_api
    kind: consumer
    lang: cpp
    asserts:
      - "Decoder::Initialize true"
      - "Caption::text non-empty std::string, valid UTF-8"
      - "Caption::regions non-empty"
      - "drcs_map non-empty for DRCS sample"
coverage:
  - "aribcaption/aribcaption.h (C API: context/decoder/caption)"
  - "aribcaption/decoder.hpp + caption.hpp (C++ API)"
  - "error-input handling"
  - "OHOS: runtime closure + .codesign + FONTCONFIG_FILE fonts.conf"
tools:
  - "binary-sign-tool (sign)"
  - "readelf (SONAME/NEEDED verification in harmonyos-test)"
upstream_ref: "upstream tests sample_data_1 / sample_data_drcs_1 (MIT, magicxqq)"
