software: libaribcaption
version: "1.1.1"
build_system: cmake
status: published
build_date: "2026-06-12"

source:
  url: "https://github.com/xqq/libaribcaption/archive/refs/tags/v1.1.1.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=MinSizeRel"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_C_FLAGS=-D__OHOS__"
    - "-DCMAKE_CXX_FLAGS=-D__OHOS__"
    - "-DARIBCC_NO_RENDERER=ON"
  dependencies: []
  cc: clang
  cxx: clang++

