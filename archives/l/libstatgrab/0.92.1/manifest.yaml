knowledge_gained:
  - "OHOS sysroot 的 sys/sysinfo.h 与 linux/sysinfo.h 均定义 struct sysinfo，先包含 linux/sysinfo.h 并定义 _LINUX_KERNEL_H 可避免重定义（保留 sysinfo() 声明）"
  - "OHOS 的 linux/ethtool.h 缺 ethtool_cmd_speed() 内联函数（有 speed/speed_hi 字段），需按内核定义补充本地实现"
  - "OHOS 上 config.guess（2018）无法识别 HarmonyOS kernel，configure 需显式 --build/--host=aarch64-unknown-linux-gnu"
  - "OHOS 受限文件系统下 config.status 的 umask 077 临时目录写入被拒，需替换为 umask 022"
  - "libstatgrab 库文件为 libstatgrab.a（-lstatgrab），cpp_info.libs 应声明 statgrab 而非 libstatgrab，否则 CMakeDeps 查找 liblibstatgrab.a 失败"

