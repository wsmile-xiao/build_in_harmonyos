# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libstatgrab/0.92.1
homepage: "https://libstatgrab.org/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check (App::Prove 驱动，见 reports/test-ledger.md)"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/single_threaded/full_stats.c
    source: libstatgrab-0.92.1/tests/single_threaded/full_stats.c
    description: "单线程 full_stats 测试程序，枚举 12 个 libstatgrab API 函数组合运行"
    command: "./full_stats -r <func> -n 1"
  - file: tests/single_threaded/diff_stats.c
    source: libstatgrab-0.92.1/tests/single_threaded/diff_stats.c
    description: "单线程 diff_stats 测试程序（diff 模式）"
    command: "./diff_stats -r <func> -n 1"
  - file: tests/multi_threaded/full_stats.c
    source: libstatgrab-0.92.1/tests/multi_threaded/full_stats.c
    description: "多线程 full_stats 测试程序（ENABLE_THREADS 时构建）"
    command: "./full_stats -r <func> -n 1"
  - file: tests/multi_threaded/diff_stats.c
    source: libstatgrab-0.92.1/tests/multi_threaded/diff_stats.c
    description: "多线程 diff_stats 测试程序"
    command: "./diff_stats -r <func> -n 1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 sg_init/sg_get_host_info/sg_get_mem_stats/sg_get_load_stats/sg_get_cpu_stats 并断言结果（R34 实质依赖）"
    command: "./test_libstatgrab"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
