package: libbtrfs-dev/6.2
upstream_check_command: "compile and execute tests/library-test.c against the built libbtrfs library"
upstream_test_in_build: true
upstream_test_command: "Conan recipe build(): compile and execute tests/library-test.c (1/1)"
upstream_tests:
  - file: tests/library-test.c
    source: https://github.com/kdave/btrfs-progs/blob/v6.2/tests/library-test.c
    description: >-
      In-scope upstream test for the libbtrfs development library: checks the
      public send-stream, UUID-search, and subvolume-path APIs by linking to the
      built library.
    command: "compile tests/library-test.c against libbtrfs && execute the binary"
    executed: 1
    passed: 1
    status: passed

upstream_repository_suite:
  path_glob: "tests/**/test.sh"
  count: 161
  category_counts:
    cli: 17
    convert: 21
    fsck: 34
    fuzz: 9
    misc: 55
    mkfs: 25
  inventory_command: "find tests -type f -name test.sh | wc -l"
  target: btrfs-progs CLI and filesystem integration tests
  scope_note: >-
    These cases drive the btrfs-progs command line tools, which this package
    does not install (it ships libbtrfs headers and the library only). They are
    still counted as upstream test cases of the v6.2 source tree, so they were
    executed on the HarmonyOS PC target instead of being declared out of scope.
  device_run:
    executed_on: "HarmonyOS PC real device (not CI, not a cross-compiled dry run)"
    platform: "HarmonyOS localhost HongMeng Kernel 1.12.0 aarch64, Toybox shell"
    privilege: "login user currentUser, uid 20001006, not root, no sudo available"
    source_revision: "btrfs-progs v6.2 tarball, SHA-256 4573120351d37402ceb579280270f1757b73f41c935c3bdb12cfd7bddb763b15 (identical to conandata.yml)"
    toolchain: "OHOS native SDK clang 15 + ld.lld from the device ohos-aarch64 Conan profile; zlib/zstd/libuuid/libblkid from harmonybrew"
    harness_command: >-
      for each case directory: cd tests/<category>/<case> then run
      'timeout -s KILL 200 bash ./test.sh' with TOP, TEST_TOP, INTERNAL_BIN,
      RESULTS, IMAGE and TEST_DEV exported the same way the upstream
      <category>-tests.sh drivers export them
    classification: >-
      exit 0 without [NOTRUN]/[SKIPPED] = passed; [NOTRUN] or [SKIPPED] printed
      = not run (upstream prints these and exits 0 when a precondition such as
      root privileges is unavailable); non-zero exit = failed
    executed: 161
    passed: 28
    notrun: 120
    failed: 13
    passed_by_category:
      cli: 1
      convert: 0
      fsck: 20
      fuzz: 0
      misc: 6
      mkfs: 1
    notrun_reasons:
      - reason: "[NOTRUN] Need to validate root privileges"
        cases: 114
        detail: >-
          tests/common root_helper()/setup_root_helper() require an effective
          root id to mount a filesystem; the device login user is uid 20001006
          and the platform exposes no sudo, so every case that mounts or sends
          to a mounted filesystem stops before running any command.
      - reason: "[NOTRUN] no reiserfs support"
        cases: 5
        detail: "btrfs-progs was configured --disable-convert because no reiserfsprogs (reiserfscore) development package exists on the target."
      - reason: "[NOTRUN] fix not available"
        cases: 1
        detail: "upstream misc-tests guard that prints this marker when the checked fix is not present in the built binary."
    failed_cases:
      - case: convert-tests/004-ext2-backup-superblock-ranges
        reason: "check_prereq: btrfs-convert was not built (no ext2fs development library on the target)"
      - case: convert-tests/020-refuse-needs-recovery
        reason: "check_prereq: btrfs-convert was not built (no ext2fs development library on the target)"
      - case: misc-tests/005-convert-progress-thread-crash
        reason: "check_prereq: btrfs-convert was not built"
      - case: misc-tests/008-leaf-crossing-stripes
        reason: "check_prereq: btrfs-convert was not built"
      - case: misc-tests/010-convert-delete-ext2-subvol
        reason: "check_prereq: btrfs-convert was not built"
      - case: misc-tests/034-metadata-uuid
        reason: "check_global_prereq: udevadm is not present (build used --disable-libudev)"
      - case: mkfs-tests/017-small-backing-size-thin-provision-device
        reason: "check_global_prereq: udevadm is not present"
      - case: mkfs-tests/022-rootdir-size
        reason: "fallocate: fallocate failed: Permission denied (HMDFS does not support fallocate(2))"
      - case: mkfs-tests/008-sectorsize-nodesize-combination
        reason: "mkfs.btrfs sector-size/node-size combination rejected on this target; case exits non-zero"
      - case: mkfs-tests/011-rootdir-create-file
        reason: "mkfs.btrfs --rootdir population failed (needs POSIX ACL/chown semantics the target filesystem does not provide)"
      - case: mkfs-tests/016-rootdir-bad-symbolic-link
        reason: "mkfs.btrfs --rootdir population failed (same rootdir population path)"
      - case: misc-tests/025-zstd-compression
        reason: "btrfs restore of the compressed fixture failed; Toybox 'cp --sparse=auto' used by extract_image() is not supported by the device coreutils"
      - case: misc-tests/037-fi-show-on-new-file
        reason: "mkfs.btrfs -f on the freshly truncated image failed on this filesystem"
    build_adjustments_for_the_harness_only:
      - item: config.guess
        detail: >-
          Upstream config.guess cannot map 'uname -s = HarmonyOS'; added the
          HarmonyOS/HongMeng -> aarch64-unknown-linux-ohos branch (E205 style)
          so configure can detect the build type.
      - item: autoconf config.status
        detail: >-
          Toybox 'mktemp -d' on HMDFS creates a directory the owner cannot write
          into, which makes config.status abort with "can't create
          ./confXXXXXX/subs1.awk: Permission denied". The mktemp branch in the
          generated config.status was neutralised so it falls back to mkdir.
      - item: musl thread cancellation
        detail: >-
          The OHOS native libc has no pthread_cancel/pthread_setcancelstate/
          pthread_setcanceltype/pthread_tryjoin_np, used by 'btrfs scrub' and
          'btrfs rescue chunk-recover'. A link-time compatibility archive was
          added (pthread_kill + handler calling pthread_exit; tryjoin as a
          blocking join). Neither code path is exercised by the executed cases.
      - item: test interpreter
        detail: >-
          Cases are '#!/bin/bash' scripts and the target has no /bin/bash, so
          each test.sh was invoked as 'bash ./test.sh' with the harmonybrew bash.
    evidence: "per-case log and result files kept on the device; summary.tsv md5 2c44beadce49713a6585f128405634d8, 161 lines"

test_package_tests:
  - file: consumer.c
    description: >-
      Consumer includes the installed libbtrfs header closure, links a
      packaged public API symbol and checks stable btrfs constants.
    command: "cmake --build . && ./btrfs_consumer"
  - file: ohos_abi.c
    description: >-
      HarmonyOS PC AArch64 consumer checks pointer/long width and the
      installed btrfs ioctl structure size and field alignment.
    command: "./btrfs_ohos_abi"
assertion_count: 10
