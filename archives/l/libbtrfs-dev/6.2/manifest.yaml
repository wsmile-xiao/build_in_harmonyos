upstream_tests_note: >-
  The 161 upstream test.sh cases exercise the full btrfs-progs CLI and
  filesystem test harness, which this library-only package does not build or
  ship. The HarmonyOS worker has no btrfs or mkfs.btrfs executable, loop
  devices are absent, /dev is read-only, and /proc/filesystems is inaccessible.
  Separately, tests/library-test.c is compiled and executed against the
  packaged library (1/1 pass); it is not counted among the 161 scripts.
test_package_tests:
  - "consumer.c: installed-header closure and public library symbol linkage"
  - "ohos_abi.c: HarmonyOS aarch64 LP64 and btrfs ioctl structure ABI"
