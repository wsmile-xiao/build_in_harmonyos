software: libeis
version: "1.6.0"
description: "Emulated Input 服务端库（libeis，freedesktop libei 项目的 server 半边）"
license: MIT
category: input
build_system: meson
status: built
build_date: "2026-09-24"
homepage: "https://gitlab.freedesktop.org/libinput/libei"
source_url: "https://gitlab.freedesktop.org/libinput/libei/-/archive/1.6.0/libei-1.6.0.tar.gz"

ohos_adaptation:
  key_points:
    - "只交付 libeis.so：-Dlibeis=enabled -Dlibei=disabled -Dliboeffis=disabled（liboeffis 需 sd-bus，OHOS 无 libsystemd/libelogind/basu；libei 属另一任务面）"
    - "tests=auto 原生降级：1.6.0 的 test/meson.build 用 required: get_option('tests') 门控 python 探测与 pytest，feature=auto 即跳过 python 套件，无需源码补丁"
    - "补丁 0001（测试面）：musl tmpfile() 硬编码只读 /tmp → $TMPDIR 唯一文件 + 立即 unlink；hunk 按 1.6.0 行号重基（锚点比 1.5.0 偏移 5 行）"
    - "补丁 0002（测试面）：subprojects/munit.wrap 是 wrap-git(revision=head)，CI 离线不可拉取 → vendor munit 三文件并强制 install:false"
    - "补丁 0003（测试面）：上游 test-build-libeis 目标硬编码 -Werror，与 OHOS clang wrapper 注入的 -Wl,--code-sign（-c 步骤视为 unused 'linker' input）以及 -Wextra 的 unused argc/argv 相撞 → 仅对这两个告警 -Wno-error，保留 -Werror 与签名参数"
    - "配方侧修正：继承自 1.5.0 的 _inject_native_file_ar() 会把 profile 已声明的正确 ar 覆盖成不存在的 /data/service/hnp/bin/llvm-ar（meson 以 'Unknown linker(s)' 在 project() 直接失败）→ 改为仅当 toolchain 文件无 ar 条目且本机确有可用 ar 时注入"
    - "E461 平台边界（消费者测试内实测）：路径型 AF_UNIX socket 三态全不可 bind（HMDFS=$HOME/tmp→EPERM、/tmp→EROFS、/dev/shm→EACCES）→ eis_setup_backend_socket() 在 OHOS 不可用；上游推荐的 eis_setup_backend_fd()+eis_backend_fd_add_client()（socketpair，不 bind 路径）完全可用并被真实执行"
    - "不安装任何可执行文件（tools/eis-demo-server 无 install:true），故无 commands.json；/dev/uinput 只在那个不安装、且需可选依赖 libevdev 的 demo server 里，不在交付面"
  max_rss_mb: 800

common_dependencies:
  - name: libevdev
    version: ">=1.13"
    required: false
    note: "仅 tools/eis-demo-server-uinput.c 可选（meson required:false），不参与库本体构建、产物不安装"
  - name: libxkbcommon
    version: ">=1.6"
    required: false
    note: "仅 tools 可选依赖，核心 libeis 不需要"
  - name: epoll-shim
    version: "-"
    required: false
    note: "OHOS musl 自带 epoll，探测落空不影响本体"

upstream_tests:
  framework: "meson test + munit（+ pytest，本配置不注册）"
  static_cases: 44
  registered_cases: 44
  executed_cases: 44
  passed_cases: 44
  skipped_cases: 0
  note: "unit-tests-utils 36/36、unit-tests-eis 7/7、dtdcheck 1/1；交付面之外的入口（unit-tests-ei/oeffis、eierpecken、pytest 三组）因 -Dlibei/-Dliboeffis 裁剪与 tests=auto 不注册，逐项原因见 notes.md，未静默删除"

consumer_tests:
  executed_assertions: 18
  failed: 0
  gated_assertions: 8
  note: "8 个正向 socket-path 断言因 E461 平台受限未执行；测试改为断言 errno 原样传出 + ERROR 日志回调，并打印 PLATFORM-LIMITED 证据行"

patches_applied:
  - "0001-test-tmpfile-portable.patch"
  - "0002-vendor-munit-subproject.patch"
  - "0003-buildtest-werror-ohos-codesign.patch"

knowledge_gained:
  - "meson 包在 OHOS 上的 -Werror × 工具链注入 -Wl,--code-sign 冲突，只降级告警即可，不需删签名参数（与 unittest-cpp/usbrelay 同一机制的 meson 实例）"
  - "配方里用 shutil.which() 兜底注入工具路径前，必须先确认 toolchain 文件是否已声明同键；否则会把 profile 的正确值覆盖成不存在的绝对路径"
  - "conan MesonToolchain 对 OHOS 走 native 配置，meson test 可直接执行（无需 exe_wrapper），交叉构建下 meson test 判 exit 77 只在手工 cross-file 时出现"

