# conandata.yml — libeis 1.6.0（Emulated Input Server 库，freedesktop libei 项目的服务端半边）
#
# 官方源（R39 合规：GitLab tag archive，与已合入的 archives/l/libei/1.5.0 同源同形态）。
# sha256 双源一致：设备侧 curl(-/archive/1.6.0, HTTP 200/261509B) 与本机交叉下载同值；
# GitLab tags API 另确认 1.6.0 为 PGP 签名 tag（非编造版本号）。
# 本机直连 gitlab 取包会拿到反爬 HTML 拦截页（非 404），故按 E347 预置共享
# core.sources:download_cache（s/<sha256> + sidecar 登记官方 URL），URL 本身保持官方标量。
sources:
  url: "https://gitlab.freedesktop.org/libinput/libei/-/archive/1.6.0/libei-1.6.0.tar.gz"
  sha256: "81b4b967f0e5938492434a04f7ea2e6c6d96d3e6c44700bc691821f82281e602"
patches:
  - patch_file: "patches/0001-test-tmpfile-portable.patch"
    patch_description: "tests: replace tmpfile() with a portable $TMPDIR fallback in test helpers (musl tmpfile hardcodes read-only /tmp and ignores $TMPDIR)"
    patch_type: "portability"
  - patch_file: "patches/0002-vendor-munit-subproject.patch"
    patch_description: "Vendor munit subproject (nemequ/munit master fbbdf14) with portable tmpfile fallback and install:false (test-only lib must not leak into the package)"
    patch_type: "portability"
  - patch_file: "patches/0003-buildtest-werror-ohos-codesign.patch"
    patch_description: "test: demote only the two benign diagnostics that clang-15 on OHOS promotes to errors on the libeis header build-test (toolchain-injected -Wl,--code-sign seen as unused linker input, and -Wextra unused argc/argv); -Werror keeps ruling everything else and no signing flag is touched"
    patch_type: "portability"
