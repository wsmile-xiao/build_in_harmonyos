# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libeis/1.6.0
homepage: "https://gitlab.freedesktop.org/libinput/libei"

# 上游测试命令：meson test（配方 build() 内真实执行，非零即构建失败）
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"

# 口径说明：本包只构建 libeis（-Dlibei=disabled -Dliboeffis=disabled，
# tests=auto），因此交付面（libeis 本体 + 共享 util + 协议 DTD）的静态注册入口
# 共 3 个 test()，展开为 44 个原子用例，全部实际执行并通过。
upstream_tests:
  - file: src/util-*.c
    description: "util 层单元测试（test('unit-tests-utils')，36 个 MUNIT_TEST：bits 3 + io 13 + list 5 + sources 4 + strings 11）"
    command: "meson test unit-tests-utils"
  - file: src/libeis*.c + src/brei-shared.c
    description: "libeis 服务端本体单元测试（test('unit-tests-eis')，7 个 MUNIT_TEST）"
    command: "meson test unit-tests-eis"
  - file: proto/protocol.dtd
    description: "协议 XML DTD 校验（test('dtdcheck')，1 用例，xmllint --dtdvalid）"
    command: "meson test dtdcheck"

# 仅编译期校验的构建目标（meson 构建即编译，非 test() 注册项）
build_only_checks:
  - file: test/buildtest.c
    description: "libeis.h 在 C 下可独立包含（test-build-libeis，上游硬编码 -Werror，见补丁 0003）"
  - file: test/buildtest.cc
    description: "libeis.h 在 C++ 下可独立包含（test-build-cxx-libeis，meson 不吃 c_args 故仅告警）"

# 未注册/未执行项（逐项说明原因，不静默删除，也不计入本包分母）
not_executed:
  - suite: "unit-tests-ei"
    reason: "本包 -Dlibei=disabled，客户端库不构建（属另一任务面）"
  - suite: "unit-tests-oeffis"
    reason: "-Dliboeffis=disabled（需 sd-bus，OHOS 无 libsystemd/libelogind/basu）"
  - suite: "eierpecken / eierpecken-no-sigalrm"
    reason: "test/meson.build 门控 build_libei and build_libeis，需客户端库配合；含 test/test-ei.c 26 + test/test-eis.c 15 个静态用例"
  - suite: "protocol-test / scanner-pytest / oeffis-pytest"
    reason: "需 python pytest+structlog；上游用 required: get_option('tests') 门控，tests=auto 下优雅跳过（静态 23+4 个 def test_）"
  - suite: "protocol-test-valgrind"
    reason: "需 valgrind，且随 python 套件一起不注册"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_package.c
    description: "C 消费者程序真实链接 libeis.so 并调用公共 API：上下文生命周期/refcount/user_data 往返/1.6 新增事件名(EIS_EVENT_TEXT_KEYSYM)/时钟单调性 + 日志面(set_handler/set_priority/get_priority，失败路径必须回调 ERROR) + socket 后端(不可创建路径返回非零、平台 bind 受限 errno 原样传出) + 私有 fd 后端(eis_setup_backend_fd/eis_backend_fd_add_client 返回真实 SOCK_STREAM socketpair、eis_get_fd、eis_dispatch、未握手不得抛 CLIENT_CONNECT)。本机执行 18 断言 / 0 失败"
    command: "conan test"
  - file: conanfile.py
    description: "CMakeDeps find_package(libeis) + 链接 libeis::libeis 驱动（编译链接本身即验证 package_info 的 libs/includedirs 口径）"
    command: "conan test"

# 平台受限项（不删用例、不放宽断言）：本机任何可写目录都 bind 不了路径型
# AF_UNIX socket（HMDFS=$HOME/tmp→EPERM、/tmp→EROFS、/dev/shm→EACCES，即 KB
# E461 的三态签名），因此 test_package.c 里正向 socket-path 序列的 8 个断言未
# 执行；测试改为断言 eis_setup_backend_socket() 把 errno 原样传出并触发 ERROR
# 日志回调，同时打印 PLATFORM-LIMITED 证据行。上游推荐的 fd 后端不受影响。
platform_limited:
  - case: "eis_setup_backend_socket() 正向序列（bind/listen/真实 connect/握手前事件门/销毁 unlink socket+lockfile）"
    gated_assertions: 8
    reason: "E461：OHOS 上路径型 AF_UNIX socket 不可 bind（EPERM/EROFS/EACCES 三态实测）"
    evidence: "test_package 运行输出中的 PLATFORM-LIMITED 行（含三目录 errno 表）"

# 断言总数：上游 meson test 44 用例（44 通过 / 0 跳过）+ test_package 消费者
# 测试本机执行 18 断言（0 失败；另 8 断言平台受限见上）
assertion_count: 62
