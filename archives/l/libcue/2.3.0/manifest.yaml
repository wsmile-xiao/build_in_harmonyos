  - "CMAKE_MINIMUM_REQUIRED(VERSION 2.8) 在 CMake 4.x 已移除兼容性支持，需要更新到 >=3.5"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
