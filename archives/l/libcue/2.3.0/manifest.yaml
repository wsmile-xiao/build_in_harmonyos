software: libcue
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.0"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（G4门禁必需字段）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# 自检必需字段
compile_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lipnitsk/libcue/archive/refs/tags/v2.3.0.tar.gz"

  # 源码校验和
  sha256: "cc1b3a65c60bd88b77a1ddd1574042d83cf7cc32b85fe9481c99613359eb7cfe"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
