software: libfst
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.8.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.8.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/libfst/libfst-1.8.4.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统（兼容字段）
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$HOME/usr/local"
    - "CC=clang"
    - "CXX=clang++"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-umask.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E053: 需要显式指定 CC=clang CXX=clang++ 进行 configure"
  - "E011: configure 中的 umask 077 需要改为 umask 022 以解决 HMDFS 权限问题"
  - "E007: 使用 automake-1.16 的 config.guess/config.sub 可识别 OpenHarmony"