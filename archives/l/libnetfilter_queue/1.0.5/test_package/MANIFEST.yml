# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnetfilter_queue/1.0.5
homepage: "https://www.netfilter.org/projects/libnetfilter_queue/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
# 说明: libnetfilter_queue 上游没有可执行测试套件（无 TESTS/runtest 框架）。
# `make check` 只构建 check_PROGRAMS：utils/nfqnl_test 与 examples/nf-queue
# （编译 + 链接验证，全部链接 ../src/libnetfilter_queue.la）。两者的运行
# 都需要内核 NFQUEUE 子系统与 CAP_NET_ADMIN（向已入队报文下裁决），不属
# make check 的执行范围。
upstream_tests:
  - file: utils/nfqnl_test.c
    source: libnetfilter_queue-1.0.5/utils/nfqnl_test.c
    description: "check_PROGRAMS: compiled+linked against libnetfilter_queue.la by make check (not executed — needs kernel NFQUEUE + CAP_NET_ADMIN)"
    command: "make check (compile+link only)"
  - file: examples/nf-queue.c
    source: libnetfilter_queue-1.0.5/examples/nf-queue.c
    description: "check_PROGRAMS: compiled+linked against libnetfilter_queue.la by make check (not executed — needs kernel NFQUEUE + CAP_NET_ADMIN)"
    command: "make check (compile+link only)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer smoke test: nfq_nlmsg_put verdict/packet message construction + nfq_nlmsg_verdict_put/_put_mark attribute round-trip (userspace only, no CAP_NET_ADMIN)"
    command: "./test_libnetfilter_queue"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
