software: libnetfilter_queue
# 版本级 manifest - libnetfilter_queue 1.0.5
# 文件位置: archives/l/libnetfilter_queue/1.0.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0（v3 Conan 配方新建档案，参照同族
# libnfnetlink/1.0.2 与 libmnl/1.0.5 先例）

# ============================================================
# 必须字段
# ============================================================

version: "1.0.5"

build_system: autotools

status: built

build_date: "2026-09-09"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.netfilter.org/projects/libnetfilter_queue/files/libnetfilter_queue-1.0.5.tar.bz2"
  sha256: "f9ff3c11305d6e03d81405957bdc11aea18e0d315c3e3f48da53a24ba251b9f5"
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - "libmnl/1.0.5"
    - "libnfnetlink/1.0.2"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "0001-sockaddr-storage-guard.patch"
    type: source
    description: "修复 sockaddr_storage 重复定义冲突（覆盖 src/ 7 个 TU 与 make check 的 2 个 check_PROGRAMS）"
    guard: "#ifndef _UAPI_LINUX_SOCKET_H"
  - file: "0002-build-aux-config.guess.patch"
    type: platform
    description: "config.guess 添加 HarmonyOS 系统识别（*:HarmonyOS:*:*）"
    guard: "无"
  - file: "0003-build-aux-config.sub.patch"
    type: platform
    description: "config.sub 添加 ohos-linux / linux-ohos 三元组"
    guard: "无"
  - file: "0004-configure.patch"
    type: platform
    description: "HMDFS mktemp 权限修复：configure 临时目录改用 TMPDIR + chmod 755"
    guard: "无"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: header_conflict
    issue: "sysroot linux/socket.h 无条件定义 sockaddr_storage，与 musl sys/socket.h 在两种 include 顺序下都重定义"
    solution: "在受影响 TU 预定义 _UAPI_LINUX_SOCKET_H 并补 __kernel_sa_family_t typedef（E091/E119 同型守卫）"
    reusable: true
    affected_files:
      - "src/libnetfilter_queue.c"
      - "src/nlmsg.c"
      - "src/extra/checksum.c"
      - "src/extra/ipv4.c"
      - "src/extra/ipv6.c"
      - "src/extra/udp.c"
      - "src/extra/tcp.c"
      - "utils/nfqnl_test.c"
      - "examples/nf-queue.c"
    notes: "冲突面由 sysroot 头包含链决定：netinet/in.h、netinet/tcp.h、net/if_arp.h、libmnl.h、libnfnetlink.h 都会拉 musl sys/socket.h，linux/netlink.h 拉 sysroot linux/socket.h。本库捆绑 UAPI 头仅 include/linux/netfilter/nfnetlink_queue.h，无法像 libmnl 那样以捆绑副本遮蔽 sysroot 的 linux/netlink.h，故需逐 TU 守卫（src/extra/pktbuff.c 不含任何 linux 头，无需守卫）。"
  - category: platform
    issue: "上游 configure.ac 有 AC_DISABLE_STATIC，仅传 --disable-shared 会落空（shared/static 双空）"
    solution: "必须显式 --enable-static --disable-shared 才能得到 static-only 交付"
    reusable: true
  - category: build_system
    issue: "configure 经 PKG_CHECK_MODULES 硬依赖 libnfnetlink>=0.0.41 与 libmnl>=1.0.3（无关闭开关）"
    solution: "conanfile 声明 requires + PkgConfigDeps 生成代理 .pc，generate() 显式把 PKG_CONFIG_PATH 指向 generators 目录（conan 2.29.1 实测不自动设置）"
    reusable: true

  - category: header_conflict
    issue: "已安装 libnfnetlink 包自带 linux_nfnetlink.h（守卫 _NFNETLINK_H）与 sysroot linux/netfilter/nfnetlink.h（守卫 _UAPI_NFNETLINK_H）内容相同、守卫不同，同 TU 双 include 重定义 enum nfnetlink_groups / struct nfgenmsg"
    solution: "在已先包含 sysroot nfnetlink.h 的 TU 预定义 _NFNETLINK_H 抑制包内副本，沿用 sysroot 副本（CI round-01 于 nlmsg.lo 实测发现）"
    reusable: true
    affected_files:
      - "src/nlmsg.c"
      - "examples/nf-queue.c"
    notes: "仅当 TU 同时拿到两份 nfnetlink.h 时需要；libnfnetlink 包自身 recipe 不在 libnetfilter_queue run 边界内，未改动，根治建议在 libnfnetlink 侧评估。"

# ============================================================
# 产物信息
# ============================================================

artifacts:
  libraries:
    - name: "libnetfilter_queue.a"
      type: "static"
  headers:
    - "libnetfilter_queue/libnetfilter_queue.h"
    - "libnetfilter_queue/libnetfilter_queue_ipv4.h"
    - "libnetfilter_queue/libnetfilter_queue_ipv6.h"
    - "libnetfilter_queue/libnetfilter_queue_tcp.h"
    - "libnetfilter_queue/libnetfilter_queue_udp.h"
    - "libnetfilter_queue/linux_nfnetlink_queue.h"
    - "libnetfilter_queue/pktbuff.h"
  pkgconfig:
    - "libnetfilter_queue.pc"

# ============================================================
# 测试信息
# ============================================================

test_results:
  make_check: "PASS (check_PROGRAMS 编译+链接通过；运行需 CAP_NET_ADMIN)"
  pkg_config: "PASS (libnfnetlink>=0.0.41 / libmnl>=1.0.3 均解析)"
  consumer_smoke: "PASS (test_package verdict 消息构造回环)"

# ============================================================
# 注意事项
# ============================================================

notes:
  - "纯库文件，无可执行程序"
  - "上游无 testsuite，make check 仅构建 check_PROGRAMS（编译+链接）"
  - "静态交付：消费者运行无需 LD_LIBRARY_PATH（同 libmnl/libnfnetlink 先例）"
  - "上游 src/Makefile.am LDFLAGS 含 -Wc,-nostartfiles -lnfnetlink；static-only 下 libtool 走 ar 归档不触发该链接开关，未改动"
