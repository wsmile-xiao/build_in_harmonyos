sources:
  url: "https://www.netfilter.org/projects/libnetfilter_queue/files/libnetfilter_queue-1.0.5.tar.bz2"
  sha256: "f9ff3c11305d6e03d81405957bdc11aea18e0d315c3e3f48da53a24ba251b9f5"

patches:
  - patch_file: "patches/0001-sockaddr-storage-guard.patch"
    patch_description: "Pre-define _UAPI_LINUX_SOCKET_H + __kernel_sa_family_t in every TU combining musl sys/socket.h with sysroot linux uapi headers (sockaddr_storage redefinition); covers 7 src TUs and the 2 make check programs"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.guess.patch"
    patch_description: "Add HarmonyOS (aarch64) system identification to config.guess"
    patch_type: "portability"
  - patch_file: "patches/0003-build-aux-config.sub.patch"
    patch_description: "Add ohos-linux / linux-ohos machine-os triplets to config.sub"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.patch"
    patch_description: "HMDFS fix: create configure temp dirs under TMPDIR with chmod 755 instead of umask 077 mktemp (owner-unwritable dirs on HMDFS)"
    patch_type: "portability"
