# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清点（R51 申报表）:
#   autotests/ 通过 ECMAddTests 注册 48 个 CTest 条目（QtTest 可执行文件）:
#   - fake- 1 个 (fakenamtest)
#   - core 4 个 (accountinfofetchjob/accountmanager/createjob/fetchjob)
#   - calendar 9 个 (calendar/event create/delete/fetch/modify + freebusyquery)
#   - tasks 9 个 (task/tasklist create/delete/fetch/modify + taskmove)
#   - drive 14 个 (about/change/filecopy/filecreate/filesearchquery/
#                  drives create/delete/modify/hide/fetch/searchquery/
#                  teamdrive create/delete/modify/fetch/searchquery)
#   - people 11 个 (contactgroup create/delete/fetch/modify + person
#                   create/delete/fetch/modify/photoupdate/photodelete)
#   全部走离线 fake network access manager（fakenamtest 验证），无需联网。
#   实测: conan create 内 build() 以 ctest --output-on-failure 全量运行。

package: libkgapi/26.04.0
homepage: "https://invent.kde.org/pim/libkgapi"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --test-dir <build> --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir {build_folder} --output-on-failure --no-tests=error"

# 上游测试条目总数
upstream_test_total: 48
# 本次适配实测结果
upstream_test_passed: 48
upstream_test_failed: 0
