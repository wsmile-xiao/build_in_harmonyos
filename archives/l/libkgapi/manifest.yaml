software: libkgapi
display: "libkgapi (KPim6GAPI)"
description: "KDE PIM Google API client library (Calendar/Drive/Tasks/People/Latitude/Blogger/StaticMaps)"
category: library
homepage: https://invent.kde.org/pim/libkgapi
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "KF_MIN_VERSION lowered 6.22.0 -> 6.18.0 via patch (published ohpcd KF6 stack: kwallet/kcontacts 6.18.0)"
    - "BUILD_SASL_PLUGIN=OFF (cyrus-sasl plugin surface unused on this platform)"
    - "BUILD_TESTING=ON: all 48 upstream CTest entries run inside conan create (offline fake network layer)"
    - "cmake_find_mode=none: project ships its own KPim6GAPIConfig.cmake; conan_cmakedeps_paths.cmake wires qtbase/kwallet/kcalendarcore/kcontacts/ECM prefixes"

versions:
  - version: "26.04.0"
    status: built
    date: 2026-09-20
