package: libmenuw/6.6_p20260516
homepage: "https://invisible-island.net/ncurses/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1; verify test/programs targets 86/86 incl. demo_menus; make -j1 check"

upstream_tests:
  - file: "test/programs"
    source: "ncurses-snapshots-6_6_20260516/test/programs"
    description: "86 upstream terminal test program entrypoints of the ncurses snapshot; every target must build, menu consumer demo_menus included"
    command: "make -j1; verify all 86 test/programs targets"
  - file: "test/Makefile.in"
    source: "ncurses-snapshots-6_6_20260516/test/Makefile.in"
    description: "Upstream make check compiles every generated public header independently"
    command: "make -j1 check"

test_package_tests:
  - file: "src/test_menu_consumer.c"
    description: "Conan CMake config target libmenuw::libmenuw plus menu lifecycle: item name/description round trip, item_count, O_ONEVALUE, mark/fore/back/pad attributes, userptr, item value toggle under a temporarily multi-valued menu, selectable option off/on, scale_menu geometry, set_menu_format, post/current item with item visibility, REQ_LAST with denied REQ_NEXT and in-bounds REQ_PREV, set_current_item with row-major REQ_UP/REQ_RIGHT/REQ_LEFT navigation, request name tables, unpost and free teardown"
    command: "test_menu_consumer <output> <input>"
  - file: "src/test_menu_pkgconfig.c"
    description: "Relocatable menuw pkg-config consumer; -Wl,-t trace must select the libmenuw package libmenuw.a and the ncurses package libncursesw.a and no shared curses library"
    command: "isolated pkg-config menuw --cflags/--static --libs; compile, trace, and run"

assertion_count: 24
