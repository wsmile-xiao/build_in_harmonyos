software: libmenuw
display: "libmenuw"
description: "Menu programming library (wide character) from the ncurses distribution"
category: system
homepage: "https://invisible-island.net/ncurses/"
license: X11
build_system: autotools

ohos_adaptation:
  key_points:
    - "拆分包：源码取 ncurses 官方快照 v6_6_20260516 整树静态构建，包内仅 menu.h/eti.h/libmenuw.a/menuw.pc，核心 ncursesw 由 ncurses/6.6 依赖提供"
    - "必须静态编译（--without-shared），拒绝 shared=True，避免劫持系统 libmenuw/libncursesw 共享库导致系统组件崩溃"
    - "--enable-widec 生成宽字符 libmenuw；--enable-pc-files 生成 menuw.pc 并做 prefix 重定位"
    - "平台补丁与 ncurses 6.6 同源：Toybox expr 探针、HMDFS 头文件安装 shell、config.guess OHOS 识别、lib_mvcur 静态链接（按快照实测适配）"
    - "当前 CMakeDeps 对纯传递依赖不生成 include 目录，消费者应同时直接 requires ncurses/6.6 或走 pkg-config 元数据"
  common_dependencies:
    - ncurses

versions:
  "6.6_p20260516":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libmenuw/6.6_p20260516"
