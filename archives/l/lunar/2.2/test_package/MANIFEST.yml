# test_package/MANIFEST.yml — lunar 2.2
package: lunar/2.2
homepage: "https://tracker.debian.org/pkg/lunar"

# 上游无独立测试套件：lunar 2.2 是 2001 年发布的单 .c 工具
# （lunar.c + tables.h + lunar.bitmap + Makefile + lunar.1），
# 上游 Makefile 只有 `lunar:` 与 `clean:` 两个目标，没有 check/test 目标，
# 包内不含任何测试源文件或对照表数据。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_lunar.c
    description: >-
      消费者测试 67 条断言：① 公历→农历基准换算（含支持区间下界 1900.1.31
      与上界 2049.12.31、甲辰年正月初一、乙巳年正月初一）；② 农历→公历反查；
      ③ 闰月（-l，2023 闰二月）；④ 农历日起于 23:00 的约定（SC 1991.2.15.23
      与 SC 1991.2.16.0 同为 LC 1991.1.2）；⑤ -h 汉字段输出；⑥ 三类越界
      错误（月/日/年，退出码 1 + 明确原因）；⑦ 三类用法错误（退出码 1 +
      "Usage:"）；⑧ 往返一致性属性测试：12 个跨全区间采样点做
      solar→lunar→solar 必须回到原点（判据由被测程序自身闭合，不依赖
      硬编码对照表）；⑨ -b bitmap 字形输出（需 share/lunar/lunar.bitmap）。
      全程 popen 内存管道直读，不写任何临时文件。
    command: "test_lunar <bin/lunar> <share/lunar>"

# 测试断言总数
assertion_count: 67
