software: lunar
display: "lunar"
description: "Chinese Lunar Calendar conversion utility (solar <-> lunar, ganzhi, shengxiao, bazi), GPL-2.0-or-later"
category: system
homepage: "https://tracker.debian.org/pkg/lunar"
license: GPL-2.0-or-later
build_system: custom  # 单 .c + 上游裸 Makefile，conanfile 直驱 clang

ohos_adaptation:
  key_points:
    - "单 .c 文件（lunar.c ~19KB）+ tables.h（~12KB），无外部库依赖"
    - "仅依赖 libc：stdio.h / string.h，musl 全支持，无 patch"
    - "上游代码为 K&R 风格函数定义（2001 年），clang 15 默认 gnu17 可直接编译"
    - "上游 Makefile 用裸 `cc` 且 clean 用 `rm *.o`，交叉编译环境不可靠 → build() 直驱 clang"
    - "编译产出单可执行文件 bin/lunar（约 33KB）"
    - "-b bitmap 字形输出需要同目录 lunar.bitmap → 随包安装到 share/lunar/"
  common_dependencies:
    - libc (stdio/string)

versions:
  "2.2":
    status: built
    build_date: "2026-09-17"
    source_url: "https://deb.debian.org/debian/pool/main/l/lunar/lunar_2.2.orig.tar.gz"
    source_sha256: "1958388190584bb897190c17623dbdb83326d4386eb517ec933d12b312a4a1d6"
    test_assertions: 67
