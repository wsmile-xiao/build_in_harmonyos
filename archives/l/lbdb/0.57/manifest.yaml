# 版本级 manifest
# lbdb 0.57

version: "0.57"
software: "lbdb"
status: built
build_date: "2026-09-27"   # 首建日期；W3 收口轮重跑于 2026-09-28 12:47（见 0.57/.ci-result.json）
build_system: autotools

source:
  url: "https://www.spinnaker.de/lbdb/download/lbdb-0.57.tar.gz"
  sha256: "212fe2e40df5ed3e5496bc5e821e4b0683a6c9523b8885e7e87b634bcf923a88"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
    - "SH=/bin/sh"
    - "AWK=/bin/awk"
  dependencies: []
  cc: clang
  cxx: none

patches_applied:
  - patches/0001-config-guess-sub-ohos.patch

knowledge_gained:
  - "E007"   # knowledge_ref: E007 — config.guess/config.sub 不识别 HarmonyOS，重锚为 aarch64-unknown-linux-ohos
  - "E049"   # knowledge_ref: E049 — *.in 模板的 #! @SH@/@PERL@/@AWK@ 被 configure 填成构建机绝对路径，需归一为可移植解释器
  - "E160"   # knowledge_ref: E160 — cannot guess build type，且禁止用 --build/--host 绕过
  - "DRAFT-lbdb-0.57-autoconf-var-shebang-configure-pin"   # knowledge_ref: 本 PR 新增草稿 — autoconf `#! @VAR@` 模板被 configure 填成构建机绝对路径；只有带 `if test "x$VAR" = x` 守卫的变量钉得住（SH 生效、AWK/PERL 不生效），交付期 basename 归一是主案，另配全量 shebang 扫描断言验收

testing:
  consumer_test: test_package/test_lbdb.sh
  assertion_count: 10
  summary_line: "SUMMARY lbdb consumer: total=10 passed=10 failed=0"
  w3_log: reports/w3-local-ci.log
  upstream_autotest_files: 7   # 6 个用例文件 + testsuite.at 包装器
  upstream_autotest_cases: 20  # grep -c AT_SETUP 实测，见 test_package/MANIFEST.yml
  # ★2026-09-27 实跑-lbdb：20 例全部在 B 机 conan 构建目录被驱动，五维账本逐维给来源行号
  upstream_test_driver: "make -C tests check-local"   # 顶层与 tests/ 均无 check 目标
  upstream_ran_on_device: true
  upstream_autotest_ran: 14      # reports/upstream-make-check.log:50
  upstream_autotest_passed: 12    # 同文件 :10,20-25,29-33
  upstream_autotest_skipped: 6 # 同文件 :14,37-40,44；原因=缺 abook/mu/notmuch
  upstream_autotest_failed: 2  # 同文件 :18-19；详节 upstream-testsuite.log:132,176,185
  upstream_summary_line: "SUMMARY lbdb upstream autotest: total=20 ran=14 passed=12 skipped=6 failed=2"
  upstream_test_in_build: false       # 接成红门需先补 dotlock 无硬链接回退，交主窗裁决
  upstream_fail_root_cause: "HMDFS 不支持 link(2)（同目录 ln 报 Operation not permitted）⇒ lbdb_dotlock 建不出 <db>.lock 且 dotlock_lock() 未检查 link() 返回值仍返 0，lbdb-fetchaddr 收尾 dotlock -u 撞 ENOENT 返 1"
  evidence_logs:
    - reports/upstream-make-check.log
    - reports/upstream-testsuite.log
    - reports/upstream-skips-only.log

upstream_case_ledger:   # 逐套账；AT_SETUP 总数 20，与 MANIFEST.yml 同源
  m_muttalias: {cases: 1, passed: 1, skipped: 0, failed: 0}
  m_abook: {cases: 1, passed: 0, skipped: 1, failed: 0}            # 缺 abook
  m_inmail: {cases: 8, passed: 6, skipped: 0, failed: 2}           # 3/4 失败=无硬链接
  m_vcf: {cases: 5, passed: 5, skipped: 0, failed: 0}
  m_mu: {cases: 4, passed: 0, skipped: 4, failed: 0}               # 缺 mu
  m_notmuch_addrlookup: {cases: 1, passed: 0, skipped: 1, failed: 0}  # 缺 notmuch
