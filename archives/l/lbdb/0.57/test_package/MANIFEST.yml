# test_package/MANIFEST.yml
# lbdb 0.57 上游测试声明 + 消费者测试声明
#
# 上游自带一套 GNU autotest 套件：tests/ 下 7 个 *.at（testsuite.at 是 m4_include
# 包装器，AT_SETUP 0；6 个用例文件 m_abook 1 / m_inmail 8 / m_mu 4 / m_muttalias 1 /
# m_notmuch_addrlookup 1 / m_vcf 5）= 20 个 AT_SETUP 用例。
# 注册面：tests/Makefile.in:21-22 TESTSUITE_AT、tests/Makefile.in:38 check-local、
# configure.ac:238 AC_CONFIG_TESTDIR([tests])。testsuite 由 tarball 随包发出（3391 行），
# 不需要 autom4te 再生。
#
# ★驱动命令是 `make -C tests check-local`，不是 `make -C tests check`：
#   顶层 Makefile 与 tests/Makefile 都没有 check 目标（实测 `make -j1 check` rc=2，
#   报 "make: *** No rule to make target 'check'. Stop."）。check-local 的规则体是
#   $(SHELL) $(TESTSUITE) AUTOTEST_PATH=$(abs_top_srcdir) USE_LOCAL_LIB=$(abs_top_srcdir)，
#   用本地构建的 lbdbq，不需要先 install。
#
# ★2026-09-27 实跑-lbdb 在 B 机 conan 构建目录真跑过全部 20 例（本文件此前写的
#   「用例在本平台给不出有意义的判定 / 属环境性不可执行」是错的）：
#   20 例全部被驱动，14 例实际执行、12 例 ok、2 例 FAILED、6 例 skipped。
#   判决行见 reports/upstream-make-check.log（ok@10,20-25,29-33 / FAILED@18-19 /
#   skipped@14,37-40,44 / 汇总@50），详节见 reports/upstream-testsuite.log
#   :132（Failed tests 摘要）、:176 与 :185（两条
#   `exit code was 1, expected 0`）。
#   2 例失败的根因不是「平台没有邮件系统」，而是 lbdb 自己的 lbdb_dotlock 依赖
#   link(2)，而 HMDFS 不支持硬链接：同目录 `ln a b` 实测 rc=1，报
#   "cannot create hard link from 'a' to 'b': Operation not permitted"（EPERM）。
#   dotlock.c 的 link(nfslockfile, lockfile) 返回值未被检查，重试耗尽后
#   dotlock_lock() 仍 return DL_EX_OK(0) ⇒ <db>.lock 从未创建；lbdb-fetchaddr 最后一步
#   `$dotlock -u "$db"` 的 unlink(<db>.lock) 撞 ENOENT → 返 1 → 整条命令 rc=1
#   （库文件内容其实写对了）。
#   ⇒ 这不是测试脚手架问题，而是**被交付命令 lbdb-fetchaddr 在本机恒返回非 0** 的真实
#     平台缺陷；只有给 dotlock.c 加无硬链接回退，上游测试才能变成 build() 里的红门。
#     该源码补丁超出实跑棒授权，已带证据交主窗裁决（本棒未自行加补丁）。
#   可行性实证：只跑 6 个 skipped 用例时 testsuite 退出码 = 0
#   （reports/upstream-skips-only.log 末行「6 tests were skipped.」）
#   ⇒ autotest 不把 skip 判失败；补好 dotlock 后 `make -C tests check-local` 可转绿门。
#   6 例 skip 的原因逐条可核：AT_SKIP_IF([! which abook])（m_abook.at:20）、
#   AT_SKIP_IF([! which mu])（m_mu.at:19/35/61/87）、
#   AT_SKIP_IF([! which notmuch-addrlookup])（m_notmuch_addrlookup.at:19）+
#   :20 [! which notmuch]；本机 command -v abook/mu/notmuch/notmuch-addrlookup 全 MISSING。
#   tests/gen-maildir 的 shebang 确实写死 #!/usr/bin/perl（本平台无此路径），但它只被
#   m_mu.at 与 m_notmuch_addrlookup.at 使用，这 6 例已因缺外部程序先 skip，
#   gen-maildir 没有额外扣掉任何用例——12 例通过的用例都不依赖它。

package: lbdb/0.57
homepage: "https://www.spinnaker.de/lbdb/"

# 上游测试驱动命令（实测唯一可用形态；`make check` 在本包没有目标）
upstream_check_command: "make -C tests check-local"

# conanfile.py build() 是否已集成上游测试：false。
# 原因（一手实跑，非推测）：`make -C tests check-local` 在 conan 构建目录可执行，
# 但 20 例里 2 例因 HMDFS 无 link(2) 必失败（见上），接进 build() 会让
# conan create 恒红；而规则禁止 `|| true` / 吞退出码 / 缩分母。要接成红门必须先补
# dotlock 的无硬链接回退——该源码补丁属交付面决策，交主窗裁决。
# RREV 分档（第 4 轮 W4 P1 更正，原「未改 conanfile.py ⇒ 交付档 RREV 不变」已作废）：
#   · 2026-09-27 实跑棒未动导出集三件 ⇒ 当时交付档 `5546d0463ecf118ef6daa8a192b92cdf`；
#   · 2026-09-28 给 conandata.yml 三处标量补双引号（导出集内）后翻为
#     `75beb304afe7db959b8e31a4810f92a3`（`reports/conan-create.log:10` 实测）。
#   现行值以 notes.md §11.4 / §13.6 为准，⛔ 不要再引用旧的「RREV 不变」结论。
upstream_test_in_build: false
upstream_test_command: "make -C tests check-local"

# 上游实际测试程序（清点 + 实跑证据）
upstream_tests:
  - file: tests/*.at
    source: "7 个 .at = 6 个用例文件 + testsuite.at 包装器，共 20 个 AT_SETUP 用例（grep -c AT_SETUP 逐档 1/8/4/1/1/5+0；注册面 tests/Makefile.in:21-22,38 与 configure.ac:238）"
    description: "2026-09-27 B 机 conan 构建目录实跑（make -C tests check-local）：执行 14 / 通过 12 / 跳过 6 / 失败 2。通过=m_muttalias 1 + m_inmail SORT 与 whitespace 6 + m_vcf 5（真实驱动编译出的 lbdbq、fetchaddr、lbdb_dotlock 与 awk munge/tac，非空跑）。跳过=m_abook 1（缺 abook）+ m_mu 4（缺 mu）+ m_notmuch_addrlookup 1（缺 notmuch/notmuch-addrlookup）。失败=lbdb-fetchmail 与 m_inmail 共 2 例，根因 HMDFS 不支持 link(2) ⇒ lbdb_dotlock 建不出 <db>.lock、lbdb-fetchaddr 收尾解锁 ENOENT 返 1（被交付命令的真实平台缺陷，非测试脚手架问题）。判决行 reports/upstream-make-check.log（ok@10,20-25,29-33 / FAILED@18-19 / skipped@14,37-40,44 / 汇总@50）；详节 reports/upstream-testsuite.log:132,176,185"
    command: "make -C tests check-local"

# test_package 自带测试（消费者视角，调用已安装命令；与上游 20 例是两套数字，不得混算）
test_package_tests:
  - file: test_lbdb.sh
    description: "10 个断言：lbdbq/lbdb-fetchaddr 存在并可在 toybox /bin/sh 下运行、两个 perl 交付脚本解释器可解析(E049)、已安装脚本无绑定构建机的 shebang、fetchaddr->lbdbq 真实增查往返（驱动编译的 fetchaddr/lbdb_dotlock + awk munge/tac）、以及对非法查询返回 no matches 的破坏性反向验证(R34)。⚠ A9 往返断言只比库文件内容、不看 lbdb-fetchaddr 的退出码，故上游 autotest 抓到的「HMDFS 无硬链接 ⇒ 命令恒返 1」未被本套 10 例覆盖——两套互补，不能互相替代"
    command: "sh test_lbdb.sh"

# 消费者自测断言总数（与 test_lbdb.sh 静态站点数、SUMMARY 同源）
assertion_count: 10

# 两套数字分开申报。consumer 那条是**日志原文**（conan-create.log:357 / w3-local-ci.log:434）；
# upstream 那条是**据 reports/upstream-make-check.log:50-52 判决行汇总合成**的（14 ran / 2 failed / 6 skipped + 6 skip = 20），
# 本身**不存在于任何日志逐字行**，仅与 notes.md §13 / manifest.yaml testing 同源——引用时按判决行复核，⛔ 当成日志原文找行号。
# ↓ 合成行（非日志原文）：据 reports/upstream-make-check.log:50-52 汇总
upstream_summary_line: "SUMMARY lbdb upstream autotest: total=20 ran=14 passed=12 skipped=6 failed=2"
consumer_summary_line: "SUMMARY lbdb consumer: total=10 passed=10 failed=0"
