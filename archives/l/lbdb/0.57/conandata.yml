# conandata.yml — lbdb 0.57 (Little Brother's DataBase, Roland Rosenfeld)
#
# Official upstream release URL, discovered by grepping the real href on the
# project download page (https://www.spinnaker.de/lbdb/download/ -> the entry
# href="lbdb-0.57.tar.gz" resolves to the path below; the release also ships an
# lbdb-0.57.tar.gz.asc detached GPG signature).  The Debian pool URL is NOT used
# (PF7 blocks repackaged pool sources).
#
# sha256 was measured first-hand on the build host: three independent GETs of
# the official URL returned byte-identical 208683 B tarballs, each hashing to
# the value below, which also equals the Debian sid .orig index checksum used
# only as a cross-check.
sources:
  url: "https://www.spinnaker.de/lbdb/download/lbdb-0.57.tar.gz"
  sha256: "212fe2e40df5ed3e5496bc5e821e4b0683a6c9523b8885e7e87b634bcf923a88"

patches:
  # E007: GNU config.guess 2024-07-27 does not recognise `uname -s` == HarmonyOS
  # and aborts with "unable to guess system type" (measured rc=1).  config.sub
  # already accepts the linux-ohos OS, but still needs the ohos-linux kernel-
  # libc alias.  The repo's scripts/patch-autotools-ohos.pl hits every anchor of
  # this config.guess (LIBC=android + NetBSD case present, verified), but CI does
  # not set OHC_SKILL_ROOT so the build-time script would be skipped there -- so
  # we commit its exact output as a self-contained patch (same approach as
  # archives/j/jigit/1.22/patches/0001).  We do NOT pass --build/--host (E007).
  "0.57":
    - patch_file: "patches/0001-config-guess-sub-ohos.patch"
      patch_description: "Re-anchor config.guess/config.sub for HarmonyOS so configure guesses aarch64-unknown-linux-ohos without cross-compile flags (E007)"
      patch_type: "portability"
