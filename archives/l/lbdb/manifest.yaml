# 软件级 manifest
# lbdb（Little Brother's DataBase）

software: lbdb
display: "lbdb"
description: "面向 MUA 的轻量邮件别名/地址簿查询工具：lbdbq 前端 + lbdb-fetchaddr 采集 + m_* 查询模块"
category: utility
homepage: "https://www.spinnaker.de/lbdb/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "E007：GNU config.guess 2024-07-27 在 uname -s=HarmonyOS 上 rc=1；patches/0001 把 config.guess/config.sub 重锚为 aarch64-unknown-linux-ohos。不用 --build/--host 绕，否则 autoconf 误判交叉编译并跳过 AC_RUN_IFELSE/AC_PATH_PROG。"
    - "E129：autoconf 2.72 的 config.status 用 (umask 077 && mktemp -d) 建 scratch 目录，HMDFS 上该目录内的创建被内核拒绝（can't create ./confXXXXXX/subs1.awk: Permission denied）；配方改为 plain mkdir。"
    - "E049：*.in 模板的 #! @SH@/@PERL@/@AWK@ 会被 configure 填成构建机绝对路径。本平台无 /usr/bin/perl、无 /bin/bash（perl 只在 /data/service/hnp/bin），故 configure 钉 SH=/bin/sh AWK=/bin/awk 并在 package() 归一为 /bin/sh、/usr/bin/env perl、/bin/awk -f；实测已装 20 个脚本 0 个机器绑定 shebang。"
    - "test_package 的运行环境是 conanbuild 而非 conanrun：配方用 VirtualRunEnv(scope=build)，无 layout() 时 PATH 只聚合进 conanbuild.sh，self.run(env=conanbuild) 才拿得到包内 bin。"
    - "运行期零外部库依赖：configure 实测 checking for iconv... yes（OHOS libc/musl 自带 iconv），@LIBICONV@ 为空、requires 为空。"
    - "/tmp 只读（E002）与 HMDFS 忽略 chmod：消费者自测显式设 TMPDIR/HOME 到 scratch，并用 lbdb-fetchaddr -f 写入已存在目录，规避嵌套 mkdir -p 造出的 .local/share 缺属主 +x。"
    - "上游 0.57 的 tests/ 有 7 个 .at 文件（6 个用例文件 + testsuite.at 包装器）共 20 个 AT_SETUP 用例，已在平台全部实跑（make -C tests check-local：执行 14/通过 12/跳过 6/失败 2；跳过=缺 abook/mu/notmuch，失败=HMDFS 不支持 link(2) 致 dotlock 锁文件建不出，证据见 0.57/reports/ 三日志）；未接入 build() 红门（upstream_test_in_build: false，待 dotlock 无硬链接回退的用户裁决），另有 test_package 的 10 条断言从已安装命令面端到端验证。"
    - "CI 的 L2 smoke 只按 --version/--help 探测 bin 命令，本包 5 枚 bin 只有 lbdbq --version 返回 0 ⇒ 4 枚出非阻塞 [warn]，末行 L2_RESULT=pass（0.57/reports/w3-local-ci.log:459）；这是探测口径限制，不是解释器缺失。"
  common_dependencies: []

versions:
  "0.57":
    status: built
    build_date: 2026-09-27
    conan_ref: lbdb/0.57
