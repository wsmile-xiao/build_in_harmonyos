# 软件级 manifest
# 文件位置: archives/l/libexmdbpp/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: libexmdbpp

display: "libexmdbpp"

description: "grommunio 的 exmdb 线协议 C++ 实现，提供 exmdb RPC 请求/响应的构造与序列化 API"

category: library

homepage: "https://github.com/grommunio/libexmdbpp"

license: AGPL-3.0-or-later

# ============================================================
# 构建信息
# ============================================================

build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "提供纯动态库 libexmdbpp.so，无命令行可执行文件 → 软件级无需 commands.json (R38)"
    - "musl 无 glibc 的 ulong typedef，上游用它播种 mt19937_64 RNG，须改写为 static_cast<unsigned long>"
    - "conan create 下 cmake --build 的 clang 诊断经管道会被吞掉，build() 须把输出落盘到 build.log"
    - "Release profile (-DNDEBUG) 会剔除 assert()，test_package 断言须用自定义 CHECK 宏"
    - "网络 API (connect/login) 需真实 exmdb 服务端，设备侧只能做编译级 + 纯计算/序列化路径验证"

  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.11":
    status: published
    build_date: 2026-09-23
