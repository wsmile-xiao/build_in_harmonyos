# test_package/MANIFEST.yml — libexmdbpp 1.11
# CI L0e 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: libexmdbpp/1.11
homepage: "https://github.com/grommunio/libexmdbpp"

# 上游测试清点证据（R51 三步法第 1 步）
#   1. 源码包文件清单共 21 个文件：CMakeLists.txt / Config.cmake.in / Doxyfile /
#      LICENSE.txt / README.rst / bindings/pyexmdb.cpp / include/exmdbpp/*.h (9) /
#      src/*.cpp (5) —— 不存在 tests/、test/ 目录，也不存在任何 *test*.cpp 文件。
#   2. CMakeLists.txt 未出现 enable_testing() / add_test() / ctest 相关指令，
#      `ctest -N` 输出 "No tests were found!!!".
#   3. 结论：上游测试用例数 N = 0，既无法通过 `make check` 也无法通过 ctest 运行。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游确无测试程序
upstream_tests: []

# test_package 自带测试（消费者视角验证，补齐上游 N=0 的缺口）
#
# test.cpp 是**真正的消费者程序**：通过 find_package(libexmdbpp) 定位已安装的
# 包、链接 libexmdbpp::libexmdbpp，并像真实应用那样使用它。7 个用例全部遵循
# “构造输入 → 真实执行 → 产生输出 → 校验内容”四段式，其中 3 个是**真实 socket
# 端到端回路**：
#   1. 测试进程内起一个 exmdb server 模拟器（AF_INET / 127.0.0.1，内核分配端口）；
#   2. ExmdbClient 真实 connect() 并完成 ConnectRequest 握手；
#   3. 客户端把业务请求序列化后真正写入 TCP 连接；
#   4. 模拟器解析它**实际收到的字节**，按协议回 [status:u8][len:u32LE][payload]；
#   5. 客户端反序列化响应帧，测试同时校验解析结果与线上字节。
test_package_tests:
  - file: test.cpp
    description: "e2e-1 GET_STORE_PROPERTIES over a real TCP connection (15 checks)：真实 socket 上完成 ConnectRequest 握手 + 业务请求，校验客户端反序列化出的 propvals（tag/type/toString）以及服务端实际收到的线上字节（homedir、cpid、proptag 列表）"
    command: "./test_libexmdbpp"
  - file: test.cpp
    description: "e2e-2 protocol error propagated as ExmdbProtocolError (2 checks)：模拟器第二次应答 MISCONFIG_PREFIX，校验库抛出的 ExmdbProtocolError 及其 code 字段"
    command: "./test_libexmdbpp"
  - file: test.cpp
    description: "e2e-3 GET_STORE_ALL_PROPTAGS over a fresh connection (6 checks)：新建连接（isPrivate=false）发送 GetAllStorePropertiesRequest，校验 ProptagResponse 的 proptags 列表与线上 callId"
    command: "./test_libexmdbpp"
  - file: test.cpp
    description: "util: gc value / eid / filetime conversions (5 checks)：valueToGc/gcToValue 往返、makeEid/makeEidEx、ntTime/nxTime 换算"
    command: "./test_libexmdbpp"
  - file: test.cpp
    description: "structures: TaggedPropval (15 checks)：PT_LONG / PT_STRING8 / PT_BOOLEAN 三种 tag 的 type 推导、count()、typeName()、toString() 与拷贝构造"
    command: "./test_libexmdbpp"
  - file: test.cpp
    description: "structures: Restriction serialization (8 checks)：默认 XNULL 为假、EXIST(proptag) 为真、serialize() 输出 1 字节类型 0x08 + 4 字节小端 proptag"
    command: "./test_libexmdbpp"
  - file: test.cpp
    description: "requests: GetStorePropertiesRequest serialization (4 checks)：报文长度 = callId(1)+homedir+NUL+cpid(4)+count(2)+proptags，首字节为 callId 且等于 CallId::GET_STORE_PROPERTIES"
    command: "./test_libexmdbpp"

# 断言总数（test.cpp 内 CHECK 宏实际计数，非估算）
#   Release 构建带 -DNDEBUG，<cassert> 的 assert() 会退化成空操作，
#   因此全部断言使用自定义 CHECK 宏（普通 if，不受 NDEBUG 影响）。
assertion_count: 55
