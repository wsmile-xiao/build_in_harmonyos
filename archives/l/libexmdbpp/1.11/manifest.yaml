# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CMake 无 Platform/HarmonyOS 模块 → CMAKE_SHARED_LIBRARY_SONAME_C/CXX_FLAG 为空，OHOS 下 VERSION/SOVERSION 不生效：共享库无 DT_SONAME（W3 L5a）且导出文件写 IMPORTED_NO_SONAME TRUE（W3 L5c）"
  - "补 SONAME 的两个方向：① 注入 cache_variables['CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG']='-Wl,-soname,'（coin3/4.0.7 同法）修复最彻底，但会产出 .so.0 + namelink 软链，而 conan create 在构建目录里创建该软链必报 Permission denied（同一目录手动 make 却能成功，现象只出现在 conan 子进程上下文）→ 本仓不可用；② 给目标加 LINK_FLAGS '-Wl,-soname,libxxx.so' 保单文件，再在 package() 里把导出文件的 IMPORTED_NO_SONAME_RELEASE 换成 IMPORTED_SONAME_RELEASE"
  - "conan create 子进程上下文里创建 namelink 软链必失败（同一目录手动 make 却能建成）→ 配方不应让 CMake 产出版本化库，保持单文件名产物"
  - "musl(OHOS libc) 不提供 glibc 的 ulong typedef，上游 src/requests.cpp 用它播种 mt19937_64 RNG，须改写为 static_cast<unsigned long>"
  - "conan create 下 cmake --build -j20 的 clang 诊断经 conan 捕获管道会被吞掉，仅留 make Error 1；build() 须 cmake.build(stdout=log, stderr=log) 落盘 build.log"
  - "init-build 的 .work 是 .orig 的硬链接副本，直接编辑 .work 会写穿 .orig 导致 refresh-patch 生成空补丁；须先断开硬链接再分别还原两侧"
  - "Release profile (-DNDEBUG) 会剔除 assert()，test_package 断言必须用自定义 CHECK 宏"
  - "上游 libexmdbpp 1.11 无任何测试用例（无 tests/ 目录、CMakeLists.txt 无 enable_testing/add_test），须由 test_package 从零补齐"
  - "纯客户端库也能做端到端：test_package 进程内起 TCP 服务端模拟器（bind 到 127.0.0.1:0，getsockname 取端口），真实 connect + 握手 + 发报文 + 解析响应帧，并校验服务端实际收到的线上字节；OHOS 设备侧 loopback socket 可用"
  - "exmdb 线上帧格式：请求 [len:u32LE][callId:u8][payload]，响应 [status:u8][len:u32LE][payload]；ConnectRequest 由 ExmdbClient 构造时自动发出"
  - "constants::CallId / ResponseCode / PropvalType 是 namespace，using-declaration 不得指命名空间（`using exmdbpp::constants::CallId;` 报 undeclared identifier），须写成 namespace 别名"
  - "IOBuffer::push<T>/pop<T> 与 Serialize<T> 的定义在 IOBufferImpl.h 而非 IOBuffer.h；消费者若自行序列化必须一并 include，否则链接期报 undefined symbol: IOBuffer::push<T>"
  - "本机执行 ohc conan-verify 时，进程注入的 safe-delete shim（sitecustomize.py）会让 conan 清理缓存时报 [safe-delete][SAFE_DELETE_BULK_GUARD_ERROR] [Errno 13] Permission denied: <node>；设 CODEBUDDY_SAFE_DELETE_ENABLED=0 即可正常跑完 G2"

