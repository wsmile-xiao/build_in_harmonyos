# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: libsidplayfp/2.15.1
homepage: "https://github.com/libsidplayfp/libsidplayfp"

# 上游测试命令 (make check，--enable-tests 时启用 8 个单元测试)
upstream_check_command: "make check TESTS='TestEnvelopeGenerator TestWaveformGenerator TestSpline TestDac TestPSID TestMUS TestMos6510 TestResampler'"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本地 aarch64-unknown-linux-ohos 实测 8/8 PASS）
upstream_tests:
  - file: tests/TestEnvelopeGenerator.cpp
    source: libsidplayfp-2.15.1/tests/TestEnvelopeGenerator.cpp
    description: "Envelope generator (6581/8580) unit tests (utpp)"
    command: "./TestEnvelopeGenerator"
  - file: tests/TestWaveformGenerator.cpp
    source: libsidplayfp-2.15.1/tests/TestWaveformGenerator.cpp
    description: "Waveform generator unit tests (utpp)"
    command: "./TestWaveformGenerator"
  - file: tests/TestSpline.cpp
    source: libsidplayfp-2.15.1/tests/TestSpline.cpp
    description: "Spline interpolation unit tests (utpp)"
    command: "./TestSpline"
  - file: tests/TestDac.cpp
    source: libsidplayfp-2.15.1/tests/TestDac.cpp
    description: "DAC table unit tests (utpp)"
    command: "./TestDac"
  - file: tests/TestPSID.cpp
    source: libsidplayfp-2.15.1/tests/TestPSID.cpp
    description: "PSID container parsing unit tests (utpp)"
    command: "./TestPSID"
  - file: tests/TestMUS.cpp
    source: libsidplayfp-2.15.1/tests/TestMUS.cpp
    description: "MUS container parsing unit tests (utpp)"
    command: "./TestMUS"
  - file: tests/TestMos6510.cpp
    source: libsidplayfp-2.15.1/tests/TestMos6510.cpp
    description: "MOS6510 CPU unit tests (utpp)"
    command: "./TestMos6510"
  - file: tests/TestResampler.cpp
    source: libsidplayfp-2.15.1/tests/TestResampler.cpp
    description: "Resampler unit tests (utpp)"
    command: "./TestResampler"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    source: test_package/test.cpp
    description: "实例化 sidplayfp、读取 SidInfo 版本、setConfig 并校验错误状态"
    command: "./test_libsidplayfp"
