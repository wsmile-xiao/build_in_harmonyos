# test_package/MANIFEST.yml — libkaz 1.21
# 上游官方测试声明（R51 三步法第一步：适配前清点）。
# kazlib 1.21 无 ctest/make check 目标；每个模块源文件自带
# KAZLIB_TEST_MAIN 驱动（Makefile.gcc 的 PROGS/TESTS），共 6 个测试程序。

package: libkaz/1.21
homepage: "https://savannah.nongnu.org/projects/kazlib/"

upstream_check_command: "make -f Makefile.gcc libkaz.a libkaz.so.1.0.0 tests/dict-1"
upstream_test_in_build: true
upstream_test_command: "conanfile.py build(): 构建后按 Makefile 同款条件（CFLAGS+-DKAZLIB_TEST_MAIN）编译 5 个自测驱动并逐个执行、断言输出"

upstream_tests:
  - file: list.c
    source: kazlib-kazlib-1.21/list.c
    description: "双向链表自测驱动（交互式 REPL，脚本驱动 append/lookup/sort/dump/delete/count）"
    command: "./tlist < tlist.input"
  - file: dict.c
    source: kazlib-kazlib-1.21/dict.c
    description: "字典自测驱动（含 1.21 新增 strict lower/upper bound 查找 < 与 >）"
    command: "./tdict < tdict.input"
  - file: hash.c
    source: kazlib-kazlib-1.21/hash.c
    description: "哈希表自测驱动（add/lookup/size/count/dump/delete）"
    command: "./thash < thash.input"
  - file: except.c
    source: kazlib-kazlib-1.21/except.c
    description: "异常模块自测驱动（嵌套 try 捕获后落入设计内的未处理异常路径，预期 SIGABRT）"
    command: "./teh < teh.input"
  - file: sfx.c
    source: kazlib-kazlib-1.21/sfx.c
    description: "表达式副作用分析自测驱动（argv 传入表达式判定 none/certain）"
    command: "./tsfx \"x\" \"x + 1\" \"x = 1\""
  - file: tests/dict-1.cc
    source: kazlib-kazlib-1.21/tests/dict-1.cc
    description: "C++ 模板包装的字典多重索引测试（三条排序遍历）"
    command: "./tests/dict-1"

test_package_tests:
  - file: test.c
    description: "消费者测试：安装后的 libkaz 链接运行 list/dict/hash，含 1.21 严格上下界与缺失键分支"
    command: "./test_libkaz"

# 断言总数（近似值）：test.c 内 21 个 assert；6 个驱动脚本的
# 退出码 + 输出标记断言由 conanfile build() 内联检查。
assertion_count: 21
