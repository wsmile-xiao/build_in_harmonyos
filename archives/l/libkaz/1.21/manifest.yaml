knowledge_gained:
  - "上游仅发布 git 仓库（savannah），无 tarball；cgit snapshot 已禁用，采用 tag 同 commit 的 GitHub 自动同步镜像 tarball，sha256 双次下载字节一致"
  - "Makefile.gcc 用 ?= 读工具链并叠加目标专属 CFLAGS（-DKAZLIB_TEST_MAIN），工具链必须走环境变量传递，命令行变量会压掉测试 main 的注入"
  - "libkaz.so.1.0.0 由 libkaz.a 经 --whole-archive 链接，源对象必须加 -fPIC"
