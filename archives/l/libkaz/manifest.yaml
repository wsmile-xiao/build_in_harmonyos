# 软件级 manifest — libkaz
software: libkaz
display: "kazlib"
description: "Kaz Kylheku 的 ANSI C 数据结构库：字典、哈希表、双向链表、异常处理与表达式副作用分析"
category: library
homepage: "https://savannah.nongnu.org/projects/kazlib/"
license: BSD-3-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "无 configure/cmake，直接驱动上游 Makefile.gcc；工具链经环境变量传递（?= 语义），CFLAGS 追加 -fPIC 供 whole-archive 共享库链接"
    - "源码零补丁；库与 5+1 个上游自测驱动一次构建通过"
    - "teh 自测驱动按上游设计以未处理异常 abort(134) 结束，验证以捕获输出标记为准"
  common_dependencies: []

versions:
  "1.21":
    status: built
    build_date: "2026-09-19"
