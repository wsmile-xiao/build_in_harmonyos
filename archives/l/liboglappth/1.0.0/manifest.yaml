  - "0002-configure-umask.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "2011 版 config.sub 不识别 aarch64/-linux-ohos，补 CPU 段与 OS 段（与 sdl-image 2012 版同款 4 处修改）— reference: archives/s/sdl-image/1.2.12/knowledge"
  - "HMDFS 上 config.status 用 (umask 077 && mktemp -d) 建 0700 目录不可写 → configure 报 could not setup config files machinery；解法 umask 077→022（同 sdl-image/1.2.12 的 0002 补丁，knowledge E011）"
  - "gl4es 只在 <GL/glu.h> 声明 glu* 函数但不提供实现（无 libGLU）；库代码调用 GLU 函数时需自带 shim（gluLookAt/gluPerspective/gluPickMatrix 用纯 GL 1.1 参考实现）编译进库 — reference: archives/a/astromenace/1.3.2/gles_compat 先例"
  - "上游 Makefile.am 的 LIBADD 被注释，库有意保留所有 GL/GLU 符号为未定义（由消费者链接）；am_liboglappth_la_OBJECTS 是字面列表，向 .in 注入新源文件必须同时改 SOURCES 与 OBJECTS 两处"
  - "configure 只检查 GL 头可编译（链接检查被上游注释），因此配方无需 precious-variable 覆盖，AutotoolsDeps 注入 gl4es 头/库路径即可"

patch_generation:
  method: per-file-difflib
  generated_at: '2026-09-16T21:00:00'
  patches_count: 2

patch_classification:
  - file: 0001-config.sub.patch
    type: auto
    platform_only: True
    guard: 'none'
  - file: 0002-configure-umask.patch
    type: auto
    platform_only: False
    guard: 'none'   # pure portability fix (umask 077 -> 022), knowledge E011

