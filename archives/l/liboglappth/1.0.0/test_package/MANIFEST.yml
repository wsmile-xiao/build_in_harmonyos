# test_package/MANIFEST.yml
# 上游测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liboglappth/1.0.0
homepage: "https://www.bioinformatics.org/ghemical/liboglappth/"

# 上游测试声明：liboglappth 1.0.0 上游没有任何自动化测试套件（0 个测试用例）。
# 源码树无 Makefile.am test/check 目标、无 dejagnu/autotest (.at) 文件、
# 无 tests/ 目录；tar 包内仅有 doc/、src/ 与 example 程序（manual，
# 需要 GL 窗口环境，无断言不可自动化）。版本级 manifest.yaml 记录
# upstream_tests: 0；不修改 CI 白名单文件（L1 通过 test_package 执行满足）；
# 由消费者测试和鸿蒙特有消费者测试承担适配验证。
upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "none"
upstream_tests: []

# 适配补齐的消费者测试（真实调用被测库公开 API，非空壳）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接打包出的 liboglappth，调用 oglv3d<GLfloat> 向量模板（len/spr/vpr/ang/operator-/operator*）与 ogl_camera::CopySettings（经 ogl_ol_static 默认构造链），断言构造函数默认值、focus/clipping 拷贝语义、crd/zdir 位置拷贝"
    command: "./test_liboglappth"
    assertions: 16
  - file: harmonyos_specific_test.cpp
    description: "鸿蒙特有消费者测试：验证 OHOS 平台链路——ogl_ol_static::MakeCopy、sqrt/acos 经 OHOS libm、向量运算经 libc++-ohos、acos 精度契约"
    command: "./harmonyos_specific_test"
    assertions: 7

assertion_count: 23
harmonyos_specific_tests: 1
