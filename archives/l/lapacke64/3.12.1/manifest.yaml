software: lapacke64
version: "3.12.1"
build_system: cmake
status: built
source:
  url: "https://github.com/Reference-LAPACK/lapack/archive/refs/tags/v3.12.1.tar.gz"
  sha256: "2ca6407a001a474d4d4d35f3a61550156050c48016d949f0da0529c0aa052422"
build:
  system: cmake
  configure_options:
    - "-DBUILD_INDEX64=ON"
    - "-DBUILD_INDEX64_EXT_API=OFF"
    - "-DLAPACKE=ON"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - "flang-ohos/20.1.0 (tool_requires)"
  cc: "clang (C) + flang (Fortran)"
knowledge_gained:
  - "lapacke64 = Reference-LAPACK 同一官方 tarball 的 ILP64 变体：BUILD_INDEX64=ON 置库名 blas64/lapack64/lapacke64，C 侧 -DLAPACK_ILP64 -DHAVE_LAPACK_CONFIG_H -DWeirdNEC，Fortran 侧 FORTRAN_ILP=TRUE 由 CheckLAPACKCompilerFlags 兜底加 -fdefault-integer-8（flang 20 支持，不入 Intel/XL/NAG/NVHPC 特判列表）"
  - "不能 requires 仓内 lapack/3.12.1：其为 ILP32 且无 C 头文件，与 lapacke64 ABI 不兼容；自含单配方从同一 tarball 构建 blas64+lapack64+lapacke64 三件套（同 Debian libblas64/liblapack64/liblapacke64 口径）"
  - "BUILD_INDEX64_EXT_API 必须显式 OFF：_64 后缀双 API 的默认支持列表仅 Intel|GNU，flang 不在列；BUILD_LAPACKE/BUILD_CBLAS/USE_X64/I8_FOR_INT 在 3.12.1 不存在（正确开关是 LAPACKE/CBLAS）"
  - "消费方必须以 -DLAPACK_ILP64 -DHAVE_LAPACK_CONFIG_H 包含 lapacke.h（lapacke_config.h 仅在 LAPACK_ILP64 下把 lapack_int 定义为 int64_t）；package_info.defines 自动传播"
  - "v3.12.1 tag 的 ILAVER/CMake 仍报 3.12.0（INSTALL/ilaver.f VERS_PATCH=0，上游未随 tag 提升）；test_package 以 3.12.0 锁定 tarball 内置 Fortran 代码身份"
  - "flang 编译链复用 lapack/3.12.1 先例：SDK sysroot/resource-dir 注入 CMAKE_Fortran_FLAGS + CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY；LAPACKE/include 的 FortranCInterface_VERIFY 在该模式下不执行链接，实测通过"
  - "配置期自检 -fdefault-integer-8（读 CMakeFiles/*/flags.make 的 Fortran_FLAGS）：防 flang 编译器 ID 意外落入其他分支导致 Fortran 静默 ILP32、与 C 侧 int64 ABI 错位"
  - "TESTING/ 全套 Fortran 测试（EIG/LIN/MATGEN+lapack_testing.py）参考 BLAS 后端真机小时级（liblapacke 0.3.30 同套 lapack-test 实测 2-3h），不入 CI 45min 门禁；核心数值路径由 test_package 8 项断言 + LAPACKE/example 4 演示覆盖"
