package: lapacke64/3.12.1
homepage: "https://www.netlib.org/lapack/"
upstream_test_in_build: true
upstream_tests:
  - file: "LAPACKE/example/example_DGESV_colmajor.c（+lapacke_example_aux.c）"
    command: "build() 默认折入：设备 CC（/data/service/hnp/bin/clang）以 ILP64 宏口径编译上游演示源，链接本构建 liblapacke64.a→liblapack64.a→libblas64.a + flang FortranRuntime/Decimal 归档后就地真实执行（BUILD_TESTING=OFF 使上游 example/ 子目录不进主构建，此处手动编译同一源文件；上游 Makefile 入口以 $(FC) 链接，flang 精简运行集缺目标级 crt 无法链接可执行，故链接器用设备 CC——唯一声明偏差；stdout 于 conan create 构建日志）"
  - file: "LAPACKE/example/example_DGESV_rowmajor.c"
    command: "同上（设备真实执行，stdout 于 conan create 构建日志）"
  - file: "LAPACKE/example/example_DGELS_colmajor.c"
    command: "同上（设备真实执行，stdout 于 conan create 构建日志）"
  - file: "LAPACKE/example/example_DGELS_rowmajor.c"
    command: "同上（设备真实执行，stdout 于 conan create 构建日志）"
  - file: "TESTING/（EIG/LIN/MATGEN + lapack_testing.py 官方 Fortran 测试套件）"
    command: "不执行、不入 CI 门禁（有意取舍）：reference BLAS 后端全量 Fortran 测试真机需小时级（仓内 liblapacke/0.3.30 同套 lapack-test 实测 2-3h，COMPLEX16 LIN 单族即数十分钟），CI 45min 门禁不可容纳；ILP64 数值正确性由 test_package 8 项断言（LU/Cholesky/QR/特征值路径 + 负例）与 example 4 演示覆盖。如需全量：cmake -DBUILD_TESTING=ON 后 ctest，可执行链接需 flang overlay（knowledge/drafts/DRAFT-ohos-flang-driver-link-overlay）"
upstream_tests_note: >
  上游可执行 C 测试资产（LAPACKE/example 4 演示）默认折入 build() 真实执行；
  Fortran 全套 TESTING/ 为小时级负载，按 CI 时限取舍不入门禁（见
  notes.md）。配置期另有 recipe 内建自检：configure 后断言 Fortran flags
  实际含 -fdefault-integer-8（BUILD_INDEX64 的 ILP64 Fortran 分支生效证据）。
  上游 v3.12.1 tag 的 ilaver.f/CMake 版本号仍为 3.12.0（tag 未提升），
  test_package 以 3.12.0 断言锁定 tarball 内置代码身份。
test_package_tests:
  - file: test.c
    description: "直接链接 liblapacke64/liblapack64/libblas64 并做真实数值计算（#include <lapacke.h>，链接期即核验 LAPACKE_* 符号真实导出）：sizeof(lapack_int)==8 静态+运行期断言锁 ILP64、LAPACKE_ilaver 版本一致性（tarball 内置 3.12.0）、dgesv col/row-major 解线性方程组、dpotrf Cholesky、dgels 最小二乘、dgeev 非对称特征值+特征向量残差、dpotrf 负例（非正定 info=2），逐项校验计算结果而非仅解析符号"
    command: "./test_probe"
assertion_count: 8
