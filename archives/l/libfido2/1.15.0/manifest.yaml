software: libfido2
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.15.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.15.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-04"

# 构建系统类型（verify-build检查字段）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Yubico 官方发布源，R39）
  url: "https://developers.yubico.com/libfido2/Releases/libfido2-1.15.0.tar.gz"

  # 源码校验和
  sha256: "abaab1318d21d262ece416fb8a7132fa9374bda89f6fa52b86a98a2f5712b61e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_MANPAGES=OFF"
    - "-DBUILD_TOOLS=ON"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version，均为制品仓实际可用版本）
  dependencies:
    - "libcbor/0.10.2"
    - "openssl/3.5.6"
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-CMakeLists.txt.patch"
  - "0003-src-hid_unix.c.patch"
  - "0004-src-stub-udev-libudev.h.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E547(草稿): OHOS 无 libudev——stub-libudev.h 适配模式（设备发现降级需 R40 声明）"
  - "E383/E330: CMake 无 Platform/HarmonyOS.cmake 导致 SONAME 缺失，tools NEEDED 记录构建目录相对路径；CMAKE_SHARED_LIBRARY_SONAME_C_FLAG + CMAKE_PLATFORM_NO_VERSIONED_SONAME 修复（本包验证成功）"
  - "E384(同类): PkgConfigDeps 不生成 libcrypto.pc（openssl 配方 pkg_config_names=openssl），上游 pkg_search_module(CRYPTO libcrypto) 需手写补丁 pc"
  - "HarmonyOS缺少libudev，需要创建stub头文件和实现"
  - "HID backend在CMakeLists.txt中需要识别HarmonyOS系统"
  - "ppoll在OHOS musl有声明但需要_GNU_SOURCE（历史notes『ppoll不可用』结论已修正：patch 0003保守保留poll回退路径）"
  - "上游CMakeLists仅对Linux加-D_GNU_SOURCE/-D_DEFAULT_SOURCE，HarmonyOS分支需在toolchain补"
  - "cmake构建系统依赖用PkgConfigDeps注入（conan标准方式，.pc prefix会被conan正确重写）"
  - "上游cmake_minimum_required(3.7)，CMake 4.x需CMAKE_POLICY_VERSION_MINIMUM=3.5"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/libfido2-1.15.0.orig
  source_work_dir: /storage/Users/currentUser/builds/libfido2-1.15.0.work
  source_orig_hash: b642ba52c3cdc8dd
  source_work_hash: 69eb46fd0a7969b3
  generated_at: '2026-05-20T12:00:27'
  patches_count: 4

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'CMAKE_SYSTEM_NAME STREQUAL "HarmonyOS"'
  - file: 0002-src-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'CMAKE_SYSTEM_NAME STREQUAL "HarmonyOS"'
  - file: 0003-src-hid_unix.c.patch
    type: auto
    platform_only: True
    guard: '__OHOS__'
  - file: 0004-src-stub-udev-libudev.h.patch
    type: auto
    platform_only: True
    guard: 'n/a (new file, static-inline stub)'
