software: libfido2
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.15.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.15.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# 构建系统类型（verify-build检查字段）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/libfido2-1.15.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libcbor/0.11.0"
    - "openssl/1.1.1w"
    - "zlib/1.3.1"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-src-CMakeLists.txt.patch"
  - "0003-src-hid_unix.c.patch"
  - "0004-src-stub-udev-libudev.h.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS缺少libudev，需要创建stub头文件和实现"
  - "HID backend在CMakeLists.txt中需要识别HarmonyOS系统"
  - "ppoll系统调用在HarmonyOS上不可用，需要用poll替代（PSCAN-MUSL-003）"
  - "cmake构建系统需要设置PKG_CONFIG_PATH识别依赖"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

