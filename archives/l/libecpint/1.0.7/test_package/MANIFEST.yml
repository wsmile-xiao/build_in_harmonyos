# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libecpint/1.0.7
homepage: "https://github.com/robashaw/libecpint"

# 上游测试套件存在性 (经审计源码归档确认)
upstream_tests_exist: true

# 上游测试审计 (源码归档: v1.0.7.tar.gz,
# sha256 e9c60fddb2614f113ab59ec620799d961db73979845e6e637c4a6fb72aee51cc)
upstream_test_audit:
  source_tarball: "libecpint-1.0.7.tar.gz"
  source_sha256: "e9c60fddb2614f113ab59ec620799d961db73979845e6e637c4a6fb72aee51cc"
  tag: "v1.0.7"
  top_level_files:
    - CMakeLists.txt        # 根构建脚本：tests 选项默认 ON，docs 选项默认 ON
    - src/                  # 库本体 + generate 代码生成器（构建期原生执行）
    - include/              # 公共头文件 + testutil.hpp（测试辅助，不安装）
    - tests/lib/            # 11 个 benchmark 程序（含仅 pugixml 的 api_test2 与 StressTest）
    - tests/units/          # 7 个 gtest 单测程序
    - share/libecpint/      # ECP 基组数据（xml/raw），api_test2/stress_test 以 argv 传入
    - external/             # Faddeeva（内置编译）+ ImportPugiXML/ImportGTest（本任务补丁改 Conan 依赖）
    - example/ doc/         # 示例与文档（不参与构建/未接入）
  scanned_for:
    - "TEST( / TEST_F( / TEST_P( (gtest)"
    - "def test_ (pytest)"
    - "tests/ 目录 + add_test (ctest)"
    - "make check 目标"
  scan_result: "tests/lib + tests/units 共 17 个 add_test 注册（IntTest1、IntTest2、DerivTest1、DerivTest2、HessTest1、HessTest2、APITest1、APITest2、Type1Test1、Type1Test2 + mathutil、multiarr、bessel、gshell、ecp、gaussquad、generate）；stress_test 不在 ctest 内，为 StressTest 自定义目标 POST_BUILD 程序（argv 传入 share/libecpint）；tests/units 为 gtest，TEST/TEST_F/TEST_P 宏实例共 53 个（mathutil 7、multiarr 13、bessel 7、gshell 8、ecp 11、generate 3、gaussquad 4——gaussquad 为 TEST_P，实跑按 2 组参数展开为 8 个实例，7 程序实跑共 57 个运行实例），全部自带 main()，仅依赖 gtest::gtest 无 gtest_main；tests/lib 为普通 main() 程序，对照 *.output 基准文件（check_file 阈值 1e-5）。上游测试用例合计口径：53 gtest 用例 + 11 独立程序 = 64"
  make_check_output: "上游无 make check；等价入口为 cmake -DLIBECPINT_BUILD_TESTS=ON + ctest（17 项）+ cmake --build . --target StressTest（POST_BUILD 执行压测）。本配方 build() 即按此执行并输出 HMBS_UPSTREAM_TEST_RESULT / HMBS_STRESS_TEST_RESULT"
  reason: "上游测试形态：ctest 注册 17 项（10 个 tests/lib benchmark 程序 + 7 个 tests/units gtest 程序）+ 1 个 StressTest 自定义目标。api_test2/stress_test 依赖 pugixml 数据读取，数据目录经命令行参数传入，无编译期路径耦合"

# 上游测试命令 (等价于上游 CI azure-pipelines.yml 的 build + ctest 路径)
upstream_check_command: "cmake -DLIBECPINT_BUILD_TESTS=ON -DLIBECPINT_BUILD_DOCS=OFF . && cmake --build . && ctest && cmake --build . --target StressTest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure（cmake.test()）+ cmake --build . --target StressTest"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/lib (10 programs)
    description: "benchmark 程序共 10 项：IntTest1、IntTest2、DerivTest1、DerivTest2、HessTest1、HessTest2、APITest1、APITest2、Type1Test1、Type1Test2，对照各自 *.output 基准（check_file 阈值 1e-5）"
    command: "ctest -R 'Int|Deriv|Hess|APITest1|Type1'"
  - file: tests/lib/api_test2
    description: "APITest2：pugixml 读取 share/libecpint XML 基组并积分，数据目录经 argv 传入"
    command: "ctest -R APITest2"
  - file: tests/units (7 gtest programs)
    description: "gtest 单测（TEST/TEST_F/TEST_P 宏实例 53 个）：mathutil 7、multiarr 13、bessel 7、gshell 8、ecp 11、generate 3、gaussquad 4（TEST_P，实跑按 2 组参数展开为 8 个实例，7 程序实跑共 57 个运行实例）"
    command: "ctest -R 'Bessel|Ecp|GaussQuad|Generate|GShell|Mathutil|Multiarr'"
  - file: tests/lib/stress_test
    description: "StressTest 自定义目标 POST_BUILD 程序：水簇等大体系 ECP 积分压测（数据经 argv 传入）"
    command: "cmake --build . --target StressTest"

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test_ecpint.cpp
    description: "消费者测试：按包内安装的头文件/lib 复现上游 IntTest1 基准的 (A,A) shell pair——ECP 5 原函数 + 双 GaussianShell + ECPIntegral(3,4)，9 个积分值逐项对照上游 benchmark（1e-7，严于上游 1e-5），并校验安装的 config.hpp 暴露 LIBECPINT_MAX_L=5，共 4 组断言"
    command: "./test_ecpint"
  - file: conanfile.py
    description: "Conan test() 入口：CONFIG 模式 find_package(ecpint) + 链接 ECPINT::ecpint + bash 包装执行 test_ecpint"
    command: "conan test test_package"

# 测试断言总数 (test_ecpint.cpp 的 4 组 check)
# 1. (A,A) shell pair 产生 9 个积分值
# 2. 对角积分与上游基准一致 (1e-7)
# 3. 非对角积分与上游基准一致 (1e-7)
# 4. 安装的 config.hpp 暴露 LIBECPINT_MAX_L=5
assertion_count: 4
