# 版本级 manifest — libecpint 1.0.7
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.7"
software: "libecpint"
status: built
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://github.com/robashaw/libecpint/archive/refs/tags/v1.0.7.tar.gz"
  sha256: "e9c60fddb2614f113ab59ec620799d961db73979845e6e637c4a6fb72aee51cc"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF（shared 选项默认 False）"
    - "-DLIBECPINT_USE_PUGIXML=ON"
    - "-DLIBECPINT_USE_CERF=OFF（内置 Faddeeva）"
    - "-DLIBECPINT_BUILD_TESTS=ON"
    - "-DLIBECPINT_BUILD_DOCS=OFF"
  dependencies:
    - "pugixml/1.15-r0"
  test_dependencies:
    - "gtest/1.17.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-use-conan-pugixml.patch"
  - "patches/0002-use-conan-gtest.patch"

knowledge_gained:
  - "上游 ImportPugiXML/ImportGTest 两文件是『系统 find_library → 配置期网络拉取』两级回退，clean 环境必须整体替换为 Conan find_package CONFIG 并用 ALIAS 保留上游目标名（libpugixml/gtest），src 与 tests 的 CMake 零改动"
  - "libecpint 构建期先用 makelist.py 生成源文件清单、再编译执行 generate 程序展开积分递推；OHOS worker 原生 aarch64 构建可直接执行，无交叉执行问题；Python_EXECUTABLE 由 recipe 显式钉住以防 FindPython 搜索失败"
  - "gtest/1.17.0 包仅提供 gtest::gtest 单组件（无 gtest_main），与 libecpint 单测自带 main() 的形态正好匹配"
  - "stress_test 不在 ctest 注册内，而是 StressTest 自定义目标的 POST_BUILD 程序；补全上游测试必须额外 build 该目标，否则压测静默不跑"

test_results:
  type: ctest(17 项：53 gtest 用例聚合于 7 程序 + 10 benchmark 程序) + StressTest 自定义目标
  total: 64
  passed: 64
  failed: 0
  skipped: 0
  detail: "上游测试用例合计 64 = 53 gtest 用例（TEST/TEST_F/TEST_P 宏实例，gaussquad 4 实例按 2 组参数实跑展开为 8，共 57 个运行实例）+ 10 个 tests/lib benchmark 程序 + 1 个 StressTest 压测程序；全部实跑通过"
