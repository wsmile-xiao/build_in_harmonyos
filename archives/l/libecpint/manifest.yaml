software: libecpint
display: "libecpint"
description: "Rapid evaluation of effective core potential (ECP) integrals for quantum chemistry"
category: math
homepage: "https://github.com/robashaw/libecpint"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "ImportPugiXML/ImportGTest 改为 Conan 依赖（find_package CONFIG + ALIAS 保留上游目标名），消除配置期网络拉取"
    - "构建期 generate 代码生成器 + makelist.py 在 OHOS worker 原生执行；Python_EXECUTABLE 由 recipe 钉住"
    - "LIBECPINT_BUILD_DOCS=OFF（CI 无 Sphinx/Doxygen）；cerf 走内置 Faddeeva"
    - "上游测试 build() 内全量执行：ctest 17 项 + StressTest 自定义目标，标记 HMBS_UPSTREAM_TEST_RESULT/HMBS_STRESS_TEST_RESULT"
  common_dependencies:
    - "pugixml/1.15-r0"
    - "gtest/1.17.0 (test only)"

versions:
  "1.0.7":
    status: built
    build_date: "2026-09-19"
