test_package:
  type: meson
  files:
    - meson.build
    - conanfile.py
    - test_libliftoff.c
  # L1 消费者测试：链接已安装的 libliftoff，验证公开 API 可用与设备创建契约。
  # 共 7 处 CHECK：api symbols、create(-1)、open(/dev/null)、create(非 DRM fd)、
  #   调用方 fd 未被关闭（以上 5 项本机必执行），以及 create(/dev/dri/card0) 与
  #   register_all_planes（需真实 DRM 节点，本机无 /dev/dri 故条件跳过并如实打印 skip）。
  # 注：upstream 单测在 conan create 的 build() 阶段以 mock libdrm 运行（覆盖平面分配逻辑）。
  assertions: 7
  assertions_executed_on_this_host: 5
