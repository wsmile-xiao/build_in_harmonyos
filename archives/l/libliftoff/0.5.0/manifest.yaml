  url: "https://gitlab.freedesktop.org/emersion/libliftoff/-/archive/v0.5.0/libliftoff-v0.5.0.tar.gz"
  upstream_url: "https://gitlab.freedesktop.org/emersion/libliftoff"
  sha256: "3309218c3137a70faada653690802b514e4e46d9b38e7d9d5948ffcc4831f3b1"
