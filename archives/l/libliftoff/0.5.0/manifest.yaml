  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 上游测试（R51 如实申报）
# ============================================================

upstream_tests:
  source: "上游 test/ 目录（meson test），含 mock libdrm 不依赖真实 DRM 设备"
  total: 58
  passed: 58
  failed: 0
  note: >-
    test/meson.build 定义 5 组共 58 项：alloc 26、dynamic 17、priority 1、prop 12、
    candidate 1、check_ndebug 1。测试通过 test/libdrm_mock.c 经 meson
    override_dependency 替换真实 libdrm，故无需 /dev/dri 即可运行平面分配逻辑。
    未修改任何上游测试文件。

# 适配后测试（test_package，L1 消费者）
adapted_tests:
  type: meson
  files:
    - test_package/meson.build
    - test_package/conanfile.py
    - test_package/test_libliftoff.c
  assertions: 7
  passed: 5
  note: >-
    共 7 处 CHECK：api symbols、create(-1)、open(/dev/null)、create(非 DRM fd)、
    调用方 fd 未被关闭（以上 5 项本机必执行，实测全过），以及 create(/dev/dri/card0) 与
    register_all_planes（需真实 DRM 节点，本机无 /dev/dri 故条件跳过并如实打印 skip）。
    验证链接、公开头可用（libliftoff.h 需 libdrm 的 xf86drmMode.h）与设备创建契约。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "meson 内置选项 b_ndebug 无法仅靠 MesonToolchain 的 project_options 生效——conan 传 --buildtype=release 后 meson 会据 buildtype 重新推导；必须 configure 后再 `meson configure -Db_ndebug=false` 并用 meson introspect 实测校验"
  - "上游把断言与其副作用全写在 assert() 内时，Release(-DNDEBUG) 会让测试『假通过』却零执行；libliftoff 用 test/check_ndebug.c 哨兵主动暴露该情况——看到该哨兵失败即说明其余用例的通过数不可信"
  - "公开头包含某依赖的头（libliftoff.h → xf86drmMode.h）时，Conan 需 transitive_headers=True 才能让消费者编译通过；上游 .pc 的 Requires.private 可作为该关系存在的旁证"
  - "conan.tools.files.get() 不接受 conandata.yml 的 tar_format 字段，须显式传 url/sha256"
  - "libliftoff 仓库旧占位 0.1.0 无配方且不满足 wlroots 的 >=0.4.0 要求，适配应选上游最新 0.5.0（wlroots 对 >=0.5.0 有专门特性分支 HAVE_LIBLIFTOFF_0_5）"
