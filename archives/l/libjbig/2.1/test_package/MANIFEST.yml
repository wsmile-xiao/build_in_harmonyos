# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libjbig/2.1
homepage: "https://www.cl.cam.ac.uk/~mgk25/jbigkit/"

# 上游测试命令 — jbigkit 自带自动测试（make test，编码/解码回环验证）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（实测 2026-09-06，OHOS 环境）：
# - jbigkit Makefile 提供 `make test`（libjbig + pbmtools 自动测试：
#   T.82/T.85 编码/解码回环、pbm 工具验证，全部 PASSED）
# - test_package 以真实 JBIG1 编码/解码回环冒烟替代（16x16 图像
#   encode → decode → 尺寸/图像校验）
upstream_tests:
  - file: libjbig/ + pbmtools/
    source: jbigkit-2.1/
    description: "上游 make test（JBIG1 编码/解码自动测试）"
    command: "make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：JBIG1 编码/解码回环（16x16 图像，jbg_enc/jbg_dec API）"
    command: "clang test.c -ljbig -o test_libjbig_c && ./test_libjbig_c"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 3
