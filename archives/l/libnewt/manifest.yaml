software: libnewt
display: "libnewt"
description: "Not Erik's Windowing Toolkit - text mode windowing with slang"
category: system
homepage: "https://pagure.io/newt"
license: LGPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 为手写脚本（非 automake），无 config.guess/config.sub，无系统识别问题"
    - "Makefile.in 无 VPATH 支持，必须源码树内构建"
    - "OHOS 需 --without-python --without-tcl --disable-nls"
    - "make 时传 GNU_LD=ld 以保证 libnewt.so 带 DT_SONAME"
    - "OHOS 无 standalone install(1)，配方自带 install shim"
  common_dependencies:
    - slang
    - popt

versions:
  "0.52.25":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libnewt/0.52.25"
