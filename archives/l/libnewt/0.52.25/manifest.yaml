software: libnewt
version: "0.52.25"
status: built
build_date: "2026-09-17"
build_system: autotools
language: C
homepage: "https://pagure.io/newt"
license: LGPL-2.0-only

source:
  url: "https://releases.pagure.org/newt/newt-0.52.25.tar.gz"
  sha256: "ef0ca9ee27850d1a5c863bb7ff9aa08096c9ed312ece9087b30f3a426828de82"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-python"
    - "--without-tcl"
    - "--disable-nls"
  dependencies:
    - slang/2.3.3
    - popt/1.16
  cc: clang

patches_applied: []

knowledge_gained:
  - "newt 的 Makefile.in 无 VPATH 支持，必须在 build 目录内做源码树内构建"
  - "newt configure 无 config.guess/config.sub，不存在 E007 类系统识别问题"
  - "OHOS 上必须 --without-python --without-tcl --disable-nls，否则 configure 失败"
  - "configure 检出的 GNU_LD 为空，必须 make 时传 GNU_LD=ld 才能带上 DT_SONAME（L5a 门禁）"
  - "OHOS 无 standalone install(1)，配方自带 .hmbs-bin/install shim（含 -d 目录模式）"
  - "上游无任何自动化测试（BLFS 明示无 test suite），test_package 走消费者验证 + whiptail --version"

test_results:
  type: consumer
  note: "待 HMBS 真机预检回填；test_package 设计 2 项（test_newt 链接/API 校验 + whiptail --version）"
