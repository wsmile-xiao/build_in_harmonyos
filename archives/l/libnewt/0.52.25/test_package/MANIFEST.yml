# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnewt/0.52.25
homepage: "https://pagure.io/newt"

# 上游测试命令 (newt 无正式 make check 测试框架)
upstream_check_command: ""

# 上游审计：newt 无任何自动化测试框架
# - Makefile.in 无 `check` 目标；configure.ac 无测试框架绑定
# - test.c/testgrid.c/testtree.c/showchars.c/showkey.c 为交互式 TTY 演示程序，非自动化断言
# - BLFS 明确记载 "This package does not come with a test suite."
upstream_tests_exist: false
upstream_test_audit: "Audited newt 0.52.25 source (configure.ac, Makefile.in, release file list): no `make check`/`check` target in Makefile.in; no gtest/pytest/criterion/ctest bindings; test.c/testgrid.c/testtree.c/showchars.c/showkey.c are interactive TTY demo programs requiring terminal input, not automated assertions; BLFS documents 'This package does not come with a test suite.' No upstream test cases exist."
reason: "newt 0.52.25 ships no automated test suite: no make check target and no test framework; demo programs need an interactive terminal."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，全部无需终端)
test_package_tests:
  - file: test_newt.c
    description: "链接 libnewt 并校验导出调色板数据与公共宏（newtInit 需终端，刻意不用）"
    command: "./test_newt"
  - file: whiptail
    description: "运行随包安装的 whiptail --version（该路径在 newtInit 之前退出，无需终端）"
    command: "whiptail --version"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
