# 软件级 manifest — linuxinfo（ARCHIVE-SPEC v2.0）

software: linuxinfo
display: "linuxinfo"
description: "读取 /proc 与 uname(2) 并打印一行系统摘要的命令行工具"
category: system
homepage: "https://www.helgefjell.de/linuxinfo.php"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "E011/E114/E118 家族：configure 生成的 config.status 用 `umask 077 && mktemp -d ./confXXXXXX` 建临时目录，HMDFS 上落成属主不可写的 drwx--S--- ⇒ 把 4 处 umask 077 改 022"
    - "上游 config.guess(2024-07-27) 不认识 uname -s=HarmonyOS，裸跑 configure 报 cannot guess build type；但同包 config.sub(2024-05-27) 已认 ohos 后缀 ⇒ 显式喂 --build/--host，不改 config.guess/sub（R21）"
    - "GetSystemLibcInfo() 对三个 .weak glibc 版本符号做无保护三选一；OHOS 的 musl 一个都不导出（nm -D 实测 0/1954）⇒ 读地址 0 SIGSEGV，需补空指针守卫"
    - "零依赖：pcre2 只服务 --with-pcre（缺省 no，且 x86 专用），po4a 只生成多语言 man 而官方件已自带成品 po4a/linuxinfo.1；--disable-nls 把 USE_NLS/USE_PO4A 一并钉成 no"
    - "单二进制 CLI（Makefile.am 只有 bin_PROGRAMS = linuxinfo），package_type=application，软件级 commands.json 已声明（R38）"
  common_dependencies: []

versions:
  "4.2.3":
    status: built
    build_date: "2026-09-27"
    conan_ref: "linuxinfo/4.2.3"
    notes: >-
      起草棒产出：官方货源定性（www.helgefjell.de 官方下载页三采全绿，sha256 与
      Debian .orig 交叉核验同值）、W0 零依赖结论、配方骨架、test_package 消费者测试
      设计、两枚补丁（已在纯净官方件上 dry-run + 实打 + configure rc=0 验证）。
      2026-09-27 主理-73 收尾：conan create / conan-verify（G0-G4 PASS）/
      finish-W3 全绿（消费者测试 19/19，读数与证据见 4.2.3/notes.md §9）。
      W4 审计与 PR/提审交接主窗。
