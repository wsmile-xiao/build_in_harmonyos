# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: linuxinfo/4.2.3
homepage: "https://www.helgefjell.de/linuxinfo.php"

# ─────────────────────────────────────────────────────────────
# 上游测试清点（R51 第一步：先清点，再声明"确无测试"并附证据）
# 下列每条都是 2026-09-26 在 A 机对**官方件** linuxinfo-4.2.3 解包树逐字跑过的
# 命令与实测命中数，不是推断。
# ─────────────────────────────────────────────────────────────
#   find . -iname 'test*'                      -> 0 命中
#   grep -nE '^check:|TESTS|add_test' Makefile.am
#                                              -> 0 命中
#   grep -nE '^check:|TESTS|add_test' Makefile.in
#                                              -> 1 命中，且仅为 automake 自动生成的
#                                                 `902:check: check-recursive`（递归空壳，
#                                                 不含任何断言）
#   grep -nE '^(check|installcheck|test|bench):' Makefile.in
#                                              -> 2 命中：902 check / 917 installcheck，
#                                                 均为 automake 生成的 -recursive 转发目标
#   find . -name '*.t' -o -name 'CMakeLists.txt' -o -name '*.ctest'
#                                              -> 0 命中
#   顶层目录                                    -> m4/ po/ po4a/（无 tests/ 目录）
#   configure.ac                               -> 无 AC_TEST/AUTOMAKE init 之外的测试注册
#
# 结论：上游**没有**任何自动化测试套件，Makefile.am 里连 TESTS 变量都没有。
# 因此 `make check` 是可执行但零断言的空操作 —— 如实声明为"上游无测试"，
# 功能验证完全由 test_package 的消费者测试承担。

upstream_check_command: "make check"
upstream_test_exists: false
upstream_test_evidence: >-
  find . -iname 'test*' = 0; grep -nE '^check:|TESTS|add_test' Makefile.am = 0;
  Makefile.in 唯一命中是 automake 生成的 'check: check-recursive'（无断言）;
  无 tests/ 目录、无 *.t / CMakeLists.txt / *.ctest

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# ─────────────────────────────────────────────────────────────
# test_package 自带的消费者测试（R34：必须以使用者身份真跑被测二进制）
# 每条都同时断言「退出码」与「输出内容」。
# ─────────────────────────────────────────────────────────────
test_package_tests:
  - file: test.sh
    description: >-
      以终端用户身份执行打包后的 linuxinfo，共 5 组 15 条退出码+内容双断言：
      TC-01 `-v` 版本串须等于 4.2.3 且为 '<argv0> <version>' 形态；
      TC-02 `-h` 两条用法行原文；
      TC-03 喂构造的 cpuinfo（linuxinfo 支持把 cpuinfo 路径作为唯一实参）后，
            逐字断言厂商/架构解析 'Three ARM v7 instruction set'、'528MHz'、
            bogomips 累加值 '2001.00'、三段式输出结构；
      TC-04 不存在的入参须非 0 退出并在 stderr 报 'not found'；
      TC-05 真机无参运行：读 /proc/cpuinfo + /proc/meminfo + uname(2)，
            断言不 SIGSEGV(139)、有 'System library ' 行、OS 行含
            sysname=HarmonyOS、有 RAM 字段。
    command: "sh test.sh"
    covers_upstream_gap: true

# patches/0002 (libc 版本探测空指针守卫) 的直接回归用例：TC-05.1 / TC-05.2 / TC-05.3
# —— 无该补丁时 TC-05.1 会以 rc=139 (SIGSEGV) 失败。

# 测试断言总数（静态计数，逐条清点 test.sh 内 ok()/bad() 成对分支）
#   TC-00.1                    -> 1   （二进制可定位，前置门禁）
#   TC-01.1/2/3                -> 3   （-v 退出码 + 版本串 + argv0 格式）
#   TC-02.1/2/3                -> 3   （-h 退出码 + 两条用法行）
#   TC-03.1/2/3/4/5            -> 5   （canned cpuinfo：退出码 + 厂商架构 + 频率 + bogomips + 段结构）
#   TC-04.1/2                  -> 2   （错误路径：非 0 退出码 + stderr 文案）
#   TC-05.1/2/3/4/5            -> 5   （鸿蒙特有：真机 /proc 无参运行 + SIGSEGV 回归 + 三行结构）
#   -------
#   合计                       -> 19
# 其中 TC-05.* 共 5 条属"鸿蒙特有测试"（必须在鸿蒙真机上才成立），其余 14 条为
# 平台无关的消费者测试。⚠ 本棒未跑构建，以上为**设计口径的静态清点**，
# 实测通过数待接力棒 W3 之后回填。
assertion_count: 19
harmony_specific_count: 5
consumer_test_count: 14

