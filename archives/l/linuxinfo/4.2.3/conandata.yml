# conandata.yml — linuxinfo/4.2.3
# 单一真相源：官方货源 URL + sha256 + patches 列表（与 patches/ 目录 1:1）。
# 货源采样矩阵、交叉核验与排除项的证据在 notes.md §5。
# 本文件刻意只留一个 https 官方 URL 标量 —— 不放备用址、不放镜像、不放核验注记。

sources:
  url: "https://www.helgefjell.de/data/linuxinfo/linuxinfo-4.2.3.tar.xz"
  sha256: "003123eebb097fd8e12a299bd4ea8b9ed6988311b2412df132b148f3ca9a705a"

patches:
  - patch_file: "patches/0001-configure-umask.patch"
    patch_description: "configure: config.status 的临时目录 (umask 077 && mktemp/mkdir) 改 umask 022 —— HMDFS 上 0700 目录属主不可写，subs1.awk 建不出来，configure 死于 could not setup config files machinery (E011/E114/E118)"
    patch_type: "platform"
    patch_source: "E011"
  - patch_file: "patches/0002-linuxinfo_common-libc-version-probe.patch"
    patch_description: "linuxinfo_common.c: GetSystemLibcInfo() 探测三个 glibc 专有版本符号。上游用 asm(\".weak sym\") 声明弱符号，clang 不认这种写法是 weak ⇒ 常量折叠把 if (gnu_get_libc_version != 0) 判成恒真并生成**无条件** bl gnu_get_libc_version@plt（objdump 实证：main 第一条指令就是该调用）；OHOS/musl 无此符号，PLT 槽解析为 0 → SIGSEGV(139)。改真 __attribute__((weak)) 声明（clang 保留运行期空指针判定，glibc 上三符号全解析、行为不变），并保留末支空指针/空串守卫落回既有的 Unknown 默认值"
    patch_type: "portability"
    patch_source: "E047"
  - patch_file: "patches/0003-linuxinfo-nls-identity-fallback.patch"
    patch_description: "linuxinfo.c/linuxinfo_common.c: --disable-nls 下 gettext.m4 不 AC_DEFINE ENABLE_NLS，而源码无条件 #include <libintl.h> 并直调 gettext()/ngettext()/bindtextdomain()/textdomain()；OHOS sysroot 的 libintl.h 是 353B 无声明桩件 ⇒ 隐式 int 声明 + clang 把 -Wint-conversion 判 error（10 errors），另 setlocale/LC_ALL/LC_NUMERIC 缺 <locale.h> ⇒ 补 ENABLE_NLS 分支与恒等翻译回退"
    patch_type: "portability"
    patch_source: "knowledge/drafts/DRAFT-latino-1.4.4-musl-empty-libintl-bison-dgettext"
  - patch_file: "patches/0004-linuxinfo_common-splitstring-return-value.patch"
    patch_description: "linuxinfo_common.c: splitstring() 声明 int 却在下 fall off the end 不 return（上游 UB）。glibc 上靠尾调用 strcpy 留下的非空指针侥幸为真；OHOS clang -O3（Release）利用该 UB ⇒ 调用方恒见 0，GetHardwareInfo()/getphysicalmemory() 静默不解析任何东西，真机 -O3 输出退化成 'Unknown Unknown processors, ? total bogomips, 0M RAM'（-O0 同源码输出正确）。补显式 return 1"
    patch_type: "bugfix"
    # 无 patch_source：仓内知识图/drafts 里查不到"non-void 函数缺失 return 被 clang -O2/-O3
    # 折成 0 ⇒ 静默功能失效"这一机制（grep -rlE 'non-void|Wreturn-type|does not return a value'
    # knowledge/graph/*.kv knowledge/drafts/*.kv 与 index.tsv 关键词扫均 0 命中）。
    # 这是本包唯一可能升路径 B 的新机制，判定与 Issue/标题前缀归主窗，见 notes.md §8。

