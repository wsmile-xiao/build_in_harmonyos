package: libgccjit/16.1.1
homepage: "https://gcc.gnu.org/gcc-16/"

# NOTE ON VERSIONING: upstream GCC never released "libgccjit 16.1.1"; the
# actual upstream tarball is gcc-16.1.0.  libgccjit ships inside the GCC
# release, enabled by --enable-languages=c,jit.

upstream_check_command: "make -C gcc selftest"
upstream_test_in_build: true
upstream_test_command: "make -C gcc selftest && build-time gcc.c-torture/execute full suite (1812 source files x -O0/-O2 = 3624 executions)"

upstream_tests:
  - file: gcc/selftest-run-tests.cc
    source: gcc-16.1.0/gcc/selftest-run-tests.cc
    description: "GCC language-independent internal selftests"
    command: "make -C gcc selftest"
  - file: gcc/c/c-parser.cc
    source: gcc-16.1.0/gcc/c/c-parser.cc
    description: "C frontend parser selftests run through -fself-test"
    command: "make -C gcc selftest"
  - file: gcc/testsuite/gcc.c-torture/execute/20000112-1.c
    source: gcc-16.1.0/gcc/testsuite/gcc.c-torture/execute/20000112-1.c
    description: "Upstream execution torture tests: the full gcc.c-torture/execute suite (top-level 1684 sources + 59 builtins pairs + 69 IEEE tests = 1812 source files), each compiled with the freshly built compiler and executed at -O0 and -O2 (3624 runs), mirroring the upstream execute.exp/builtins.exp/ieee.exp DejaGNU drivers"
    command: "build() torture-execute full suite via the xgcc-sign wrapper"

test_package_tests:
  - file: test_jit.c
    description: "Link against libgccjit.so and run an in-process JIT compile: libgccjit builds a C function, materialises executable machine code (W^X/SELinux-sensitive JIT path), executes it and checks the result"
    command: "clang -I<pkg>/include -L<pkg>/lib -lgccjit test_jit.c -o jit_test_program && ./jit_test_program"

assertion_count: 5
