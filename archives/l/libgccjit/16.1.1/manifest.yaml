software: libgccjit
version: "16.1.1"
status: pending
build_date: ""
build_system: autotools-custom
adaptation_path: "路径 A（基础适配）+ 路径 C（高难度挑战）"

# NOTE ON VERSIONING: the OHPC board lists "libgccjit 16.1.1", but upstream
# GCC never released 16.1.1.  The real upstream tarball is gcc-16.1.0; the
# libgccjit library ships inside the GCC release via --enable-languages=c,jit.
# The recipe keeps the board version 16.1.1 and maps it to gcc-16.1.0 sources.

source:
  url: "https://ftp.gnu.org/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz"
  sha256: "50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79"
  tar_format: tar.xz

build:
  system: autotools-custom
  configure_options:
    - "--enable-languages=c,jit"
    - "--enable-host-shared"
    - "--disable-bootstrap"
    - "--disable-multilib"
    - "--without-isl"
  dependencies:
    - "bundled gmp/6.3.0"
    - "bundled mpfr/4.2.2"
    - "bundled mpc/1.3.1"
  cc: clang
  cxx: clang++

source_transforms:
  - "Map linux-ohos to GCC's musl target configuration"
  - "Inject config.sub compatibility into GCC and bundled prerequisites"
  - "Canonicalize none-unknown-linux-ohos from bundled prerequisite configure scripts to aarch64-unknown-linux-ohos"
  - "Replace Autoconf umask 077 with umask 022 for HMDFS"
  - "Apply source transforms before Conan copies the source tree to avoid immediate HMDFS rewrite/execute failures"
  - "Pre-apply additive OHOS compatibility transforms without reading settings in Conan's settings-independent source() phase"
  - "Run the large source-tree transform in a short-lived Python process so its memory and HMDFS state are released before configure"
  - "Use gcc_build_env.sh instead of Conan's reserved conanbuild.sh name to prevent recursive self-sourcing and SIGSEGV"
  - "Run configure, make and install with Bash and an unlimited stack because HarmonyOS shells otherwise crash on GCC's generated scripts"
  - "Retry a failed GCC command once after os.sync(): signal-11 (HMDFS settles) and any non-zero exit (transient fork() Out of memory on the no-swap CI worker) are both retried once"
  - "Override CI's LLVM IR assembler with the device's GNU as and ld for GCC target assembly"
  - "Relax signing temporary directories from 0700 to 0775 for HMDFS compatibility"
  - "Use serial make on OHOS because HMDFS does not support GNU make's FIFO jobserver reliably"
  - "Keep GCC host generators as PIE on OHOS to avoid LLD AArch64 copy-relocation alignment failures"
  - "Derive GCC's sysroot from the resolved OHOS SDK Clang path so fixincludes can find native headers"
  - "Build libgccjit with --enable-host-shared so the whole compiler links into libgccjit.so"

knowledge_gained:
  - knowledge_ref: "E007"
    item: "aarch64-linux-ohos must be mapped onto GCC's musl target configuration (config.guess cannot recognise HarmonyOS)"
  - knowledge_ref: "E077"
    item: "GCC host generators and output programs require HarmonyOS ELF signing, otherwise load fails with EPERM"
  - knowledge_ref: "E053"
    item: "GCC 16.1.0 must be bootstrapped with the OHOS SDK clang/clang++ host because cc1plus is unavailable"
  - knowledge_ref: "E176"
    item: "CONFIG_SHELL alone does not replace the initial interpreter or raise its stack limit; invoke Bash explicitly after ulimit -s unlimited"
  - knowledge_ref: "E016"
    item: "OpenDesk exports AS=llvm-as, but GCC needs GNU as; /data/service/hnp/bin/as and ld are GNU Binutils 2.45"
  - knowledge_ref: "E127"
    item: "The device has no /usr/include; GCC's sysroot is derived from the OHOS SDK Clang native/sysroot/usr/include tree"
  - knowledge_ref: "E045"
    item: "libgccjit materialises JIT code with mprotect RWX, which the 2026-04 W^X relaxation allows on HarmonyOS"
  - knowledge_ref: "E138"
    item: "GMP 6.3.0, MPFR 4.2.2 and MPC 1.3.1 are built in-tree per GCC 16.1.0's official download_prerequisites"

verification:
  local_static_checks: pending
  ohos_ci: pending
  note: "No HarmonyOS build success is claimed until the official CI completes. The full upstream gcc.c-torture/execute suite (1812 source files x -O0/-O2 = 3624 executions, mirroring execute.exp/builtins.exp/ieee.exp) and an in-process JIT compile-and-execute consumer test are run on OHOS."
