package: libdbi-drivers/0.9.0
homepage: "https://libdbi-drivers.sourceforge.net/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check TESTS=test_libdbi.sh"

# Release-tarball inventory: 11 test_*.sh entry points plus the two upstream
# test programs they invoke. The recipe executes the two SQLite3-related
# scripts; 9 optional-driver scripts stay visible as NOT RUN rather than being
# counted as pass. The two programs are built/invoked indirectly and are not
# double-counted.
upstream_tests:
  - name: dynamic-loader-suite
    command: "tests/test_libdbi.sh"
    status: passed
    expected: "the built SQLite3 driver is discovered through dlopen"
  - name: sqlite3-driver-suite
    command: "tests/test_sqlite3.sh"
    status: failed
    expected: "executed; legacy signed-char/numeric-conversion assumptions fail on OHOS AArch64 and end in Signal 5"
  - name: sqlite-driver-suite
    command: "tests/test_sqlite.sh"
    status: not-run
    expected: "requires the legacy sqlite driver, outside this SQLite3-only package"
  - name: mysql-driver-suite
    command: "tests/test_mysql.sh"
    status: not-run
    expected: "requires MySQL client/server"
  - name: pgsql-driver-suite
    command: "tests/test_pgsql.sh"
    status: not-run
    expected: "requires PostgreSQL client/server"
  - name: msql-driver-suite
    command: "tests/test_msql.sh"
    status: not-run
    expected: "requires mSQL client/driver"
  - name: oracle-driver-suite
    command: "tests/test_oracle.sh"
    status: not-run
    expected: "requires Oracle client"
  - name: firebird-driver-suite
    command: "tests/test_firebird.sh"
    status: not-run
    expected: "requires Firebird client/driver"
  - name: freetds-driver-suite
    command: "tests/test_freetds.sh"
    status: not-run
    expected: "requires FreeTDS client/driver"
  - name: ingres-driver-suite
    command: "tests/test_ingres.sh"
    status: not-run
    expected: "requires Ingres client/driver"
  - name: db2-driver-suite
    command: "tests/test_db2.sh"
    status: not-run
    expected: "requires DB2 client/driver"
  - name: test-dbi-program
    command: "tests/test_dbi"
    status: indirect
    expected: "invoked by the selected database-driver shell entries"
  - name: test-dbi-dlopen-program
    command: "tests/test_dbi_dlopen"
    status: indirect
    expected: "invoked by tests/test_libdbi.sh"

upstream_tests_total: 13
upstream_scripts_in_scope: 11
upstream_scripts_executed: 2
upstream_programs_indirect: 2
upstream_tests_executed: 2
upstream_tests_passed: 1
upstream_tests_failed: 1
upstream_tests_not_run: 9
upstream_tests_indirect: 2

# Consumer test calls libdbi and loads the packaged dbd_sqlite3 module.
test_package_tests:
  - file: test_libdbi_drivers.c
    description: "Load the packaged SQLite3 driver and execute CREATE/INSERT/SELECT through libdbi"
    command: "./test_libdbi_drivers <driver-directory> <database-directory>"

assertion_count: 15
upstream_pass_rate: "1/13 (7.7%)"
new_test_pass_rate: "15/15 (100%)"
