version: "0.9.0"
software: "libdbi-drivers"
status: "built"
build_date: "2026-09-21"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/libdbi-drivers/libdbi-drivers-0.9.0.tar.gz"
  sha256: "43d2eacd573a4faff296fa925dd97fbf2aedbf1ae35c6263478210c61004c854"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-docs"
    - "--enable-libdbi"
    - "--with-sqlite3"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - "libdbi/0.9.0-r5"
    - "sqlite3/3.53.4"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-config.guess.patch"
  - "0002-ohos-config.sub.patch"
  - "0003-ohos-configure.patch"
  - "0004-cgreen-clang.patch"
  - "0005-test-datetime-types.patch"

validation:
  conan_create:
    platform: "HarmonyOS PC AArch64 (OHOS 6.0)"
    status: built
    upstream_inventory: "13 release test entry points: 11 test_*.sh scripts plus test_dbi and test_dbi_dlopen"
    upstream_executed: "2/13 shell entries; test_dbi and test_dbi_dlopen indirect"
    upstream_pass_rate: "1/13 (7.7%): test_libdbi.sh passed; test_sqlite3.sh failed"
    upstream_not_run: "9 optional-driver script entries requiring database-specific client/server stacks outside the SQLite3-only closure"
    upstream_selected_check: "make check TESTS=test_libdbi.sh: 1 test passed"
    consumer_assertions: "15/15 (100%)"
  upstream_full_check:
    command: "tests/test_sqlite3.sh"
    status: "known-ohos-test-harness-limitation"
    result: "Executed and fails in the legacy libdbi matrix on unsigned plain-char and unsupported numeric-conversion assumptions; original test remains visible and was not used as the package gate."
  ohos_target:
    sdk: "OpenHarmony 6.0 API 20"
    triple: "aarch64-unknown-linux-ohos"
    library_compile: passed
    consumer_link: passed
    runtime: passed
    artifact: "lib/dbd/libdbdsqlite3.so"

knowledge_gained:
  - "The release bundles multiple optional database drivers; the reproducible OHOS package scope is the SQLite3 loadable driver."
  - "The old configure macro has a -lsqlite typo in its explicit sqlite3-libdir branch, so the Conan SQLite3 libdir is injected through LDFLAGS while the include directory is passed explicitly."
  - "The bundled Cgreen and legacy mSQL test sources need narrow modern-clang test-only portability fixes to compile on OHOS."
  - "The full legacy SQLite3 matrix assumes signed plain char and conversions not provided by the OHOS libdbi dependency; the public Conan consumer remains the runtime gate."
