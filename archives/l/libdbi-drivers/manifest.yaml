software: libdbi-drivers
display: "libdbi-drivers"
description: "Loadable database drivers for the libdbi C abstraction layer"
category: database
homepage: "https://libdbi-drivers.sourceforge.net/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Package the reproducible SQLite3 loadable driver on OpenHarmony PC AArch64"
    - "Recognize aarch64-unknown-linux-ohos in the bundled GNU config scripts"
    - "Use Conan libdbi and SQLite3 dependency paths with the legacy Autotools checks"
    - "Account for all 13 release test entry points; execute 2 SQLite3-related scripts, retain 9 optional-driver scripts as explicitly not run, and roll up the 2 test programs without double counting"
    - "Report upstream pass rate as 1/13 and the independent Conan consumer as 15/15"
    - "Retain the full upstream SQLite3 test result without claiming it passes on OHOS"
  common_dependencies:
    - "libdbi/0.9.0-r5"
    - "sqlite3/3.53.4"

versions:
  "0.9.0":
    status: built
    build_date: "2026-09-21"
    conan_ref: "libdbi-drivers/0.9.0"
