software: libfec
display: "libfec"
description: "前向纠错（FEC）算法库：Reed-Solomon 编解码器、Viterbi 卷积解码器（K=7/9/15）与 DSP 基元（点积/平方和/峰值）"
category: library
homepage: "https://github.com/fblomqvi/libfec"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Phil Karn (KA9Q) 原库的 fblomqvi 维护 fork，Debian 快照 1.0-26-gc5d935f；configure 为 autoconf 2.69 生成，makefile 为 1990s 手写风格"
    - "makefile.in 大量硬编码 gcc，须补丁改为 $(CC) 才能走 Conan 工具链"
    - "aarch64 落入 configure 的通用分支：纯 C 可移植实现（PORT），无 SIMD 汇编"
    - "构建期用本机工具 gen_ccsds/gen_ccsds_tal 生成 ccsds_tab.c/ccsds_tal.c（native 构建可用）"
    - "OHOS 下传 --build/--host 同为 aarch64-unknown-linux-gnu 绕过 2006 版 config.guess；config.sub 补丁接受 aarch64/linux-ohos"
    - "configure 生成 config.status 临时目录需 umask 022（setgid hmdfs 上 umask 077 目录不可写）"
  common_dependencies: []

versions:
  "1.0-26-gc5d935f":
    status: built
    build_date: "2026-09-18"
    license: "LGPL-2.1-or-later"
    source: "https://github.com/fblomqvi/libfec/archive/c5d935f42a79221871ff50e75d3971cf3e87be7c.tar.gz"
