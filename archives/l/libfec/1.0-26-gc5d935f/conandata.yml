# Upstream has no release tarball; per repo convention for upstreams without
# tags-as-tarballs the official GitHub commit archive is used.

sources:
  url: "https://github.com/fblomqvi/libfec/archive/c5d935f42a79221871ff50e75d3971cf3e87be7c.tar.gz"
  sha256: "a2fff6f8f883bcef9c9539279cebdb6f0407d2737adc7fac48a8438a3b7c3bc9"

patches:
  - patch_file: "patches/0001-config-sub-aarch64.patch"
    patch_description: "Accept modern aarch64 host triples (incl. linux-ohos) in the bundled 2001-era config.sub"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "Create the config.status tmp dir with umask 022 (setgid hmdfs makes umask 077 dirs unwritable)"
    patch_type: "portability"
  - patch_file: "patches/0003-makefile-use-cc-variable.patch"
    patch_description: "Replace hard-coded gcc with $(CC) throughout makefile.in so the Conan-configured toolchain is honored"
    patch_type: "portability"
  - patch_file: "patches/0004-makefile-test-objects-cflags.patch"
    patch_description: "Compile the vtest*.o test objects with $(CFLAGS) so -I. (build dir) finds the configure-generated config.h they include"
    patch_type: "portability"
