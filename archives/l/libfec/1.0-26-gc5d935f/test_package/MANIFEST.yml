package: libfec/1.0-26-gc5d935f
homepage: "https://github.com/fblomqvi/libfec"

upstream_check_command: "make test"
upstream_test_in_build: partial
upstream_tests:
  - name: correctness-suite
    file: makefile test target
    source: libfec makefile.in `test` target
    description: "vtest27/vtest29/vtest39/vtest615 (Viterbi decode with injected symbol errors: -e 3.0/-2.5/-2.5/-1.0 dB, -n 1000/1000/1000/100), dtest (dot product), sumsq_test, peaktest run inside conan build() on Linux/OHOS with exactly the makefile's parameters. rstest (extended RS codec table) and the 4 speed benchmarks are skipped in-recipe for the CI 3600s budget; the full `make test` including rstest's 228 up-to/beyond-capacity checks and all speed trials was executed verbatim on a real device (see notes.md)."
    command: "make vtest27 vtest29 vtest39 vtest615 dtest sumsq_test peaktest && ./vtest27 -e 3.0 -n 1000 -v && ..."
    expected: "7 fast correctness programs in build(); full 8-program suite + speed trials verified on device"

test_package_tests:
  - file: test_rs.c
    description: "RS(255,223) over GF(256) via init/encode/decode/free_rs_char and _int: clean decode returns 0, t=16 random errors corrected bit-exact, 17 errors reported uncorrectable, 2t=32 declared erasures corrected, int-symbol codec roundtrip with 8 errors."
    command: "test_rs"
  - file: test_viterbi.c
    description: "K=7 r=1/2 convolutional encode with fec.h V27POLYA/V27POLYB on a noise-free soft channel (0/255 symbols), 6-bit zero tail, create/init/update/chainback/delete_viterbi27 sequence mirroring upstream vtest27.c; requires bit-exact chainback."
    command: "test_viterbi"
  - file: test_dsp.c
    description: "initdp/dotprod/freedp and sumsq cross-checked against scalar reference loops; peakval over a non-zero-offset window vs max(|x|) reference."
    command: "test_dsp"
  - file: test_consumer.c
    description: "Consumer use case, CCSDS-style concatenated FEC link: 223-byte payload -> RS(255,223) outer encode -> K=7 r=1/2 convolutional inner encode (fec.h polynomials, 6-bit zero tail) -> noise-free soft channel -> Viterbi decode -> bit-unpack (chainback bytes are bit-reversed encoder history) -> inject 16 residual byte errors -> RS decode -> original payload recovered bit-exact."
    command: "test_consumer"

assertion_count: 24
