# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfec/1.0
homepage: "https://github.com/quiet/libfec"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（源码声明 8 个独立可执行用例，全部实际运行通过；
# 另有 rs_speedtest 为性能基准，不计入正确性用例）
upstream_tests:
  - file: vtest27.c
    source: libfec-1.0/vtest27.c
    description: "Viterbi r=1/2 k=7 解码正确性 + 速度测试"
    command: "./vtest27 -e 3.0 -n 1000 -v"
  - file: vtest29.c
    source: libfec-1.0/vtest29.c
    description: "Viterbi r=1/2 k=9 解码正确性 + 速度测试"
    command: "./vtest29 -e 2.5 -n 1000 -v"
  - file: vtest39.c
    source: libfec-1.0/vtest39.c
    description: "Viterbi r=1/3 k=9 解码正确性 + 速度测试"
    command: "./vtest39 -e 2.5 -n 1000 -v"
  - file: vtest615.c
    source: libfec-1.0/vtest615.c
    description: "Viterbi r=1/6 k=15 解码正确性 + 速度测试"
    command: "./vtest615 -e 1.0 -n 100 -v"
  - file: rstest.c
    source: libfec-1.0/rstest.c
    description: "通用 Reed-Solomon 编解码器全参数域测试"
    command: "./rstest"
  - file: dtest.c
    source: libfec-1.0/dtest.c
    description: "点积 (dot product) 测试"
    command: "./dtest"
  - file: sumsq_test.c
    source: libfec-1.0/sumsq_test.c
    description: "平方和 (sum of squares) 测试"
    command: "./sumsq_test"
  - file: peaktest.c
    source: libfec-1.0/peaktest.c
    description: "峰值检测 (peak value) 测试"
    command: "./peaktest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：RS(255,223) 编解码往返 + 8 错误纠正"
    command: "./test_libfec"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
