software: libmspub
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"
compile_date: "2026-06-25"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/LibreOffice/libmspub/archive/refs/tags/libmspub-0.1.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "librevenge/0.0.5"
    - "sed/4.10"
    - "pkg-config/0.29.2"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
# 所有变更为 autoreconf 生成文件 (Makefile.in/aclocal.m4/configure)
# 非源码修改, 可由 `autoreconf -fi` 重新生成, 无需上库
# E011 umask 修复 (sed: umask 077→022 on configure) 已记录在 notes.md
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011: HMDFS umask 077 causes Permission denied in config.status (configure script fix: umask 022)"
  - "GitHub archive requires autoreconf -fi to generate configure script (pkg.m4 needed for PKG_PROG_PKG_CONFIG)"
  - "AUTOM4TE env var needed to fix @am_AUTOM4TE@ placeholder in aclocal"
  - "PKG_CONFIG_PATH must include $DEFAULT_PREFIX/lib/pkgconfig for librevenge detection"

# 补丁生成信息
# 所有补丁为 autoreconf 生成文件, 非源码修改, 不上库
# 复现方式: autoreconf -fi && sed -i 's/umask 077/umask 022/g' configure
patch_generation:
  method: autoreconf
  patches_count: 0
  note: "生成文件变更, 可由 autoreconf -fi 重建; E011 umask fix 见 notes.md"

