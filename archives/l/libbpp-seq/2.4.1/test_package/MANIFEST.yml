# test_package/MANIFEST.yml
# 上游官方测试声明文件
package: libbpp-seq/2.4.1
homepage: "https://github.com/BioPP/bpp-seq"

# 上游测试命令 (ctest 注册的 7 个单测，由 BUILD_TESTING=ON 构建)
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（test/ 下 7 个 .cpp 各编译为独立可执行文件）
upstream_tests:
  - file: test/test_alignment_scores.cpp
    source: bpp-seq-2.4.1/test/test_alignment_scores.cpp
    description: "比对打分矩阵测试"
    command: "./test_alignment_scores"
  - file: test/test_alphabets.cpp
    source: bpp-seq-2.4.1/test/test_alphabets.cpp
    description: "DNA/RNA/蛋白/密码子字母表实例化与类型判定"
    command: "./test_alphabets"
  - file: test/test_bowker.cpp
    source: bpp-seq-2.4.1/test/test_bowker.cpp
    description: "Bowker 同质性检验"
    command: "./test_bowker"
  - file: test/test_containers.cpp
    source: bpp-seq-2.4.1/test/test_containers.cpp
    description: "序列容器操作测试"
    command: "./test_containers"
  - file: test/test_io.cpp
    source: bpp-seq-2.4.1/test/test_io.cpp
    description: "Fasta/Mase/Clustal/Phylip 等格式读写测试"
    command: "./test_io"
  - file: test/test_sequences.cpp
    source: bpp-seq-2.4.1/test/test_sequences.cpp
    description: "BasicSequence 严格/兼并匹配查找测试"
    command: "./test_sequences"
  - file: test/test_walker.cpp
    source: bpp-seq-2.4.1/test/test_walker.cpp
    description: "SequenceWalker 遍历测试"
    command: "./test_walker"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bpp_seq.cpp
    description: "DNA/RNA/密码子/蛋白字母表、BasicSequence 基序查找、VectorSequenceContainer 往返验证（8 项检查）"
    command: "ctest --output-on-failure -R test_bpp_seq"

# 测试断言总数 (上游 7 个 ctest 用例 + test_package 8 项检查)
assertion_count: 15
