# conandata.yml -- libbpp-seq 2.4.1

sources:
  url:
    - "https://gh-proxy.com/https://github.com/BioPP/bpp-seq/archive/refs/tags/v2.4.1.tar.gz"
    - "https://github.com/BioPP/bpp-seq/archive/refs/tags/v2.4.1.tar.gz"
  sha256: "dbfcb04803e4b7f08f9f159da8a947c91906c3ca8b20683ac193f6dc524d4655"

# Vendored build dependency: bpp-core 2.4.1 (provides bpp-core CMake package
# 4.1.0 required by bpp-seq). libbpp-core/2.4.1 is not yet published to the
# ohpcd remote, so it is built from source inside this recipe into a private
# prefix (see conanfile.py _build_bundled_bpp_core) instead of requires().
bpp_core:
  url:
    - "https://gh-proxy.com/https://github.com/BioPP/bpp-core/archive/refs/tags/v2.4.1.tar.gz"
    - "https://github.com/BioPP/bpp-core/archive/refs/tags/v2.4.1.tar.gz"
  sha256: "1150b8ced22cff23dd4770d7c23fad11239070b44007740e77407f0d746c0af6"

patches:
  - patch_file: "patches/0001-cxx17-random-shuffle-compat.patch"
    patch_description: "Replace removed-in-C++17 std::random_shuffle with std::shuffle + mt19937 in SymbolList.h so the recipe builds under the ohos-aarch64 profile (compiler.cppstd=17)"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-test-link-static.patch"
    patch_description: "Link build-tree ctest binaries against bpp-seq-static instead of bpp-seq-shared: the shared DT_NEEDED entries are slash-relative and unresolvable from the test WORKING_DIRECTORY under the OHOS loader; test sources unchanged"
    patch_type: "testing"
