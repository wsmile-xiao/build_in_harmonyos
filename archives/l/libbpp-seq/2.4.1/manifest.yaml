software: libbpp-seq
version: "2.4.1"
upstream_version: "2.4.1"
status: built
build_date: "2026-09-16"
build_system: cmake
conan_ref: "libbpp-seq/2.4.1"

source:
  url: "https://github.com/BioPP/bpp-seq/archive/refs/tags/v2.4.1.tar.gz"
  sha256: "dbfcb04803e4b7f08f9f159da8a947c91906c3ca8b20683ac193f6dc524d4655"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_PREFIX_PATH=<build_folder>/bpp-core-prefix (vendored bpp-core 2.4.1)"
  dependencies: []
  cc: clang
  cxx: clang++
  package_type: library

patches_applied:
  - "patches/0001-cxx17-random-shuffle-compat.patch (portability: random_shuffle -> std::shuffle, C++17)"
  - "patches/0002-ohos-test-link-static.patch (testing: ctest binaries link bpp-seq-static instead of bpp-seq-shared for OHOS loader; test sources unchanged)"

knowledge_gained:
  - "bpp-seq 2.4.1 需 bpp-core 2.4.1（提供 bpp-core 4.1.0 CMake 包），find_package(bpp-core 4.0.0) 经 CMAKE_PREFIX_PATH 解析"
  - "libbpp-core/2.4.1 尚未发布到 ohpcd，配方内 vendor bpp-core 2.4.1 源码（conandata.yml bpp_core）先装到 build_folder/bpp-core-prefix 再配置 bpp-seq，避免 requires() 在 L0i/R36 解析失败"
  - "上游同时构建 bpp-seq-static 与 bpp-seq-shared（OUTPUT_NAME 均为 bpp-seq，SOVERSION 12），test/ 下 7 个用例链接 shared 目标"
  - "cmake_minimum_required 2.8.11，需 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容新版 CMake"
  - "Conan 包名用 libbpp-seq 前缀，避免 CMakeDeps 生成的 libbpp-seq-config 与上游 bpp-seq-config 同名冲突"
  - "构建树 shared 库的 DT_NEEDED 为斜杠相对路径，OHOS loader 从测试工作目录无法解析，ctest 二进制改链 bpp-seq-static（测试源码与断言不变），test_package 消费者同样优先按绝对路径链接静态归档"
