software: libdmx
display: "X.Org DMX Extension Library"
description: "Distributed Multihead X (DMX) extension client library"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/lib/libdmx"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Uses the release Autotools files without source patches"
    - "Uses the cmd-pkgs dependency track: libx11/6.4.0 + libxext/6.4.0.1 + xorgproto/2025.1"
    - "Preserves the upstream libdmx.so.1 ABI and the dmxext.h header"
  common_dependencies:
    - libx11
    - libxext
    - xorgproto

versions:
  "1.1.5":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libdmx/1.1.5"
    note: "Latest stable upstream release; formal publication pending"
