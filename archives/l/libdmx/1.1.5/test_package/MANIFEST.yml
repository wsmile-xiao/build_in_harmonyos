package: "libdmx/1.1.5"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libdmx"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The release Makefile.am files declare no TESTS, check_PROGRAMS,
  check-local, or custom test target; `make check` reports zero tests.

test_package_tests:
  - id: "api-surface"
    source: "api_surface.c"
    command: "libdmx_api_surface"
    description: >-
      Forces a live typed relocation for every exported symbol of
      libdmx.so.1 (all 18 public DMX functions) at link and load time.
  - id: "version-contract"
    source: "version_contract.c"
    command: "libdmx_version_contract"
    description: >-
      Validates DMX protocol version constants, request opcodes, wire
      sizes, error-code agreement between dmx.h and dmxproto.h, and
      public ABI struct round-trips without a Display.
  - id: "ohos-abi-contract"
    source: "ohos_abi_contract.c"
    command: "libdmx_ohos_abi_contract"
    description: >-
      HarmonyOS-specific: executes a linked consumer on the OHOS target
      and pins the load-time contract; the recipe additionally gates on
      ELF64/AArch64 class, NEEDED closure (libXext.so.6, libX11.so.6),
      and absence of absolute Conan RPATH/RUNPATH entries in libdmx.so.1.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 3
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 3
assertion_count: 62
