  shadow_ci:
    date: "2026-09-29"
    result: "pass (run exit 0, r5 after 4 fix iterations)"
    upstream_tests: "make check all pass (ltcencode/ltcdecode 48k+96k diff, timecode.raw fixture decode, ltcloop round trip)"
    test_package: "6 assertions pass (encode/decode SMPTE round trip)"
