package: libltc/1.3.2
homepage: "https://x42.github.io/libltc/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: ltcencode-ltcdecode-48k
    command: "./ltcencode output.raw && ./ltcdecode output.raw | diff -q expect_48k_2sec.txt -"
    expected: "pass"
  - name: ltcencode-ltcdecode-96k
    command: "./ltcencode output.raw 192000 && ./ltcdecode output.raw 7680 | diff -q expect_96k_2sec.txt -"
    expected: "pass"
  - name: ltcdecode-fixture
    command: "./ltcdecode timecode.raw 882 | diff -q timecode.txt -"
    expected: "pass (uses bundled tests/timecode.raw fixture)"
  - name: ltcloop
    command: "./ltcloop"
    expected: "pass (encode/decode round trip)"

test_package_tests:
  - file: test_ltc.c
    description: "Encode LTC frames from 01:02:03:00 and decode them back, verifying the SMPTE timecode round-trips"
    command: "./libltc_test"

assertion_count: 6
