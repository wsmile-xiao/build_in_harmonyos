knowledge_gained:
  - "LEBINIOU 音乐可视化数据包为纯数据发行：1415 个 GIMP 调色板（.gpl，每文件恰 256 行 RGB 三元组）+ 图像主题（115 PNG/8 JPEG + 4 主题目录）+ 8 路径轨迹 + 15 序列定义 JSON + Vue 前端资源（css/img/js/media/sequences 共 163 文件）+ 测试素材 3 文件，共 1727 个安装文件"
  - "上游 autotools 安装布局为 $(datadir)/lebiniou/{colormaps,images/biniou,paths,sequences,vue,test}，Debian 以 all 架构包安装到 /usr/share/lebiniou/，本包沿用该惯例"
  - ".gpl 文件无 GIMP Palette 魔数头，直接以 RGB 三元组行开始（每文件恰 256 行）"
  - "bootstrap/ 不在上游 SUBDIRS 中、Makefile.am 为构建文件，均不参与安装"
  - "上游自带 Debian autopkgtest 材料（test/lebiniou-test.sh.in + FLAC 样本），需 lebiniou 主程序 + ffmpeg + 联网，OHOS 环境不具备（lebiniou 主程序本身未适配），属环境限制"
  - "lebiniou.json 顶层 5 键（screen/input/themes/engine/plugins），plugins 109 项"
  - "conan copy() 的 excludes 按相对 src 完整路径 fnmatch 精确匹配，只写 basename 挡不住嵌套目录同名文件；excludes=['Makefile.am','*/Makefile.am'] 可覆盖任意深度（fnmatch 的 * 可跨 /），真机 2.29.1 实测"
upstream_test_pass_rate: "N/A（上游无构建期测试套件；test/ 为 Debian autopkgtest 材料，需 lebiniou 主程序 + ffmpeg + 联网，OHOS 环境不具备，属环境限制）"
adapted_test_pass_rate: "真机 conan-verify 全门禁通过（G0-G4 PASS；L2/L4/L5 门禁标记 PASS，报告注明跳过——纯数据包无 conan cache 产物），消费者探针真机实跑 4608 断言 0 失败（100%，exit 0，conan create 内置执行）"
test_command: "conan create . --build=missing"
