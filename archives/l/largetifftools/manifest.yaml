software: largetifftools
display: "LargeTIFFTools"
description: "大型 TIFF 图像文件处理工具集，支持快速裁剪、马赛克拼接和图块分割"
category: image
homepage: "https://github.com/gn-nhc/largetifftools"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools 在鸿蒙环境下存在 config.status 权限问题，需采用手动 Makefile 编译"
    - "需手动创建 config.h 配置文件"
    - "libpng 为静态库，需额外链接 zlib (-lpng16 -lz)"
    - "运行时需设置 LD_LIBRARY_PATH 或使用 rpath"
  common_dependencies:
    - libtiff/4.7.1
    - libjpeg/unknown
    - libpng16/unknown
    - zlib/unknown
  build_difficulty: medium

versions:
  "1.4.1":
    status: built
    build_date: "2026-06-11"
    source_url: "https://codeload.github.com/gn-nhc/largetifftools/tar.gz/main"