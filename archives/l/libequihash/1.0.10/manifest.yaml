software: libequihash
# 版本级 manifest
# 文件位置: archives/l/libequihash/1.0.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.10"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-14"

# 构建系统
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag 归档）
  url: "https://github.com/stef/equihash/archive/refs/tags/v1.0.10.tar.gz"

  # 源码校验和（官方归档实测，27397 字节）
  sha256: "f48ed2d62abc94389b3bb1c612e733ce80107b058513a3e5611df1021140b971"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（make 变量覆盖，非 configure 选项）
  configure_options:
    - 'SYS="aarch64-linux-ohos"（覆盖 gcc -dumpmachine 探测）'
    - 'EXTRA_CXXFLAGS="-fstack-clash-protection"；LIBS="" 去掉上游 -lsodium 链接，EXTRA_SOURCES="blake2b.o" 链接内聚对象'
    - "构建目标：libequihash.so libequihash.a（-j1）"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-makefile-ar-variable.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 项目：SYS 变量在 make 命令行显式覆盖，避免在 OHOS 上执行 gcc -dumpmachine 探测"
  - "无外部依赖：上游唯一的 libsodium 调用（keyless BLAKE2b）已按 RFC 7693 内聚到 vendor/blake2b.c，构建不再经过 Autotools configure"
  - "只构建库目标：equihash CLI 链接行需要 -lstdc++，OHOS clang/libc++ 工具链不提供；bench/CLI 不打包，保持纯库形态"
  - "ar 硬编码改为 $(AR) 变量补丁（portability，无平台宏），归档器取自 tools.build:compiler_executables 或 llvm-ar 回退"
  - "上游无测试套件：Makefile 无 check/test 目标、无 tests 目录；python/test.py 仅为绑定演示"

# ============================================================
# 上游测试核验（严格审计：确无测试套件）
# ============================================================

upstream_automated_tests:
  exists: false
  test_source_files: 0
  test_targets: 0
  executed: 0
  passed: 0
  failed: 0
  skipped: 0
