# test_package/MANIFEST.yml — libequihash 1.0.10
# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: libequihash/1.0.10
homepage: "https://github.com/stef/equihash"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "Makefile（上游 v1.0.10）"
    finding: "全部目标仅为 all/android/clean/install/libequihash.pc，无 check/test 或等价测试目标；make -n check 无可执行内容"
  - path: "源码树顶层（v1.0.10.tar.gz 共 13 个文件）"
    finding: "无 tests/、test/ 目录；无 ctest/meson/pytest 注册；测试框架文件数为 0"
  - path: "python/test.py（上游源码）"
    finding: "仅 4 行绑定用法演示（solve 后打印 verify 结果），无断言、无测试框架，且需另行构建 Python 扩展模块，不构成可接入的上游测试套件"
  - path: "bench.cc（上游源码）"
    finding: "为性能基准（输出求解/验证耗时），无断言；上游 v1.0.5 起已将其排除出默认构建目标，属非可移植基准而非测试"

test_package_tests:
  - file: test_equihash.c
    description: "消费者功能测试：小参数（N=24/K=3）真实调用 solsize/solve/verify 共 4 项断言——公式值、固定种子求解、合法解接受、篡改解拒绝（R34 合规）"
    command: "./test_equihash（test_package/conanfile.py 编译并执行，日志解析 RESULT 行输出 HMBS 标记）"

assertion_count: 4
