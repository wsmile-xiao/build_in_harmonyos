# libequihash 软件级 manifest
software: libequihash
display: "libequihash"
description: "Equihash 内存困难型工作量证明库，验证速度快，提供 solsize/solve/verify 三个函数的 C API"
homepage: "https://github.com/stef/equihash"
license: CC0-1.0
repository: "https://github.com/stef/equihash"
category: library
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Makefile 项目（无 configure；SYS 探测用 gcc -dumpmachine，配方在 make 命令行显式传 SYS 覆盖，避免依赖宿主 gcc）"
    - "唯一外部依赖是 libsodium（链接 -lsodium），经 conan requires 引入，头文件与库路径由配方注入 EXTRA_CXXFLAGS"
    - "只构建并打包库目标 libequihash.so / libequihash.a 与公开头 equihash.h；equihash CLI 与 bench 不打包（CLI 链接行需要 -lstdc++，OHOS clang/libc++ 工具链不提供），保持纯库形态，无需 commands.json"
    - "归档补丁 0001-makefile-ar-variable.patch 把写死的 ar 换成 $(AR) 变量（portability，无平台宏），OHOS 上经 tools.build:compiler_executables 或 llvm-ar 回退传入"
    - "上游无测试套件（Makefile 无 check/test 目标、无 tests 目录），test_package 为消费者视角的真实 API 调用测试"
  common_dependencies:
    - "libsodium/1.0.22"

# 版本索引
versions:
  "1.0.10":
    status: built
    build_date: "2026-09-14"
