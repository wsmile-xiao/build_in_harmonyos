# test_package/MANIFEST.yml
package: libbiosoup-dev/0.11.0
homepage: https://github.com/rvaser/biosoup

upstream_tests_exist: true
upstream_test_audit: "上游 test/ 有 5 个 GoogleTest 文件、共 11 个 TEST 用例：nucleic_acid_test.cpp(4: NucleotideError/Inflate/Quality/ReverseAndComplement)、overlap_test.cpp(1: Compile)、progress_bar_test.cpp(1: Operator)、sequence_test.cpp(1: ReverseAndComplement)、timer_test.cpp(4: Start/Stop/Lap/Reset)。取数：grep -rhoE '^TEST\\([^)]*\\)' test/*.cpp | wc -l -> 11"
upstream_check_command: "见 conanfile.py build()：clang++ -std=c++17 -pthread -I<gtest include> -I<repo>/include test/*.cpp -L<gtest lib> -lgtest -lgtest_main -o biosoup_test && ./biosoup_test"
upstream_test_in_build: true
upstream_test_command: "./biosoup_test（GoogleTest，test_requires gtest/1.17.0）"
upstream_test_count: 11
upstream_test_file_count: 5

upstream_tests:
  - file: test/nucleic_acid_test.cpp
    source: biosoup-0.11.0/test/nucleic_acid_test.cpp
    description: "GoogleTest 用例 4 个：非核苷酸报错、InflateData、质量分、反向互补"
    ran: true
  - file: test/overlap_test.cpp
    description: "GoogleTest 用例 1 个：Overlap 编译/字段"
    ran: true
  - file: test/progress_bar_test.cpp
    description: "GoogleTest 用例 1 个：ProgressBar 输出"
    ran: true
  - file: test/sequence_test.cpp
    description: "GoogleTest 用例 1 个：Sequence 反向互补"
    ran: true
  - file: test/timer_test.cpp
    description: "GoogleTest 用例 4 个：Start/Stop/Lap/Reset"
    ran: true

upstream_result: "[  PASSED  ] 11 tests."

test_package_tests:
  - file: test_biosoup.cpp
    description: "非核苷酸报错、2-bit 编码、InflateData（含区间）、Sequence 反向互补、Overlap 字段、Timer，共 14 项"
    command: "ctest -R test_biosoup"

test_package_test_count: 1
consumer_assertion_count: 14
assertion_count: 14
