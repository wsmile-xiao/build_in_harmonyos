  dependencies:
    - json-c/0.18
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 无 CMake 平台模块，CMake 项目需 CMAKE_SYSTEM_NAME=Linux 映射 ref:E092"
  - "CMakeToolchain 不注入 PKG_CONFIG_PATH，需在 build() 手动加入 generators_folder 以满足 PKG_SEARCH_MODULE(json-c REQUIRED)"
  - "CMake install 期 RPATH_CHANGE 重写 .so 后 OHOS musl loader 无法加载，需 CMAKE_SKIP_INSTALL_RPATH + 构建产物覆盖"
  - "libblobmsg 与 libubox 同源（openwrt/libubox commit 1aa36ee7，2026-02-13），blobmsg 核心在 ubox 库，json 转换在 blobmsg_json 库"
  - "上游 14 个 test-*.c 需 UNIT_TESTING=ON 构建；OHOS 需裁剪 *-san/cram/shunit2/fuzz/jshn-san（sanitizer 与构建期 pip 联网不可用），剩余二进制按 cram .t 期待输出片段逐项真实执行并输出 HMBS_UPSTREAM_TEST_RESULT"
