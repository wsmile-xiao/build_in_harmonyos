# 版本级 manifest — libblobmsg 2026.02.13

# 版本号
version: "2026.02.13"

# 软件名
software: "libblobmsg"

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/openwrt/libubox/archive/1aa36ee774c8db4d7a396903e0d2e1fb79ee8bf1.tar.gz"
  sha256: "350407e95f40d2b07f39668fa15af8487089b2b72ea80cb9af83e580a8825c71"
