# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libblobmsg/2026.02.13
homepage: "https://github.com/openwrt/libubox"

# 上游存在测试（openwrt/libubox tests/：14 个 test-*.c 单元程序 + cram + shunit2）
upstream_tests_exist: true
upstream_test_framework: custom-c-unit
upstream_test_count: 15
upstream_test_audit: |
  Audited upstream openwrt/libubox at commit 1aa36ee774c8db4d7a396903e0d2e1fb79ee8bf1 (2026-02-13).
  tests/ holds 14 test-*.c programs (test-avl, test-b64, test-b64_decode,
  test-b64_encode, test-blob-buflen, test-blob-parse, test-blobmsg,
  test-blobmsg-parse, test-blobmsg-types, test-blobmsg_check_array,
  test-blobmsg-procd-instance, test-json-script, test-list, test-runqueue)
  plus tests/cram/*.t (needs pip install cram with network + valgrind, both
  unavailable on OHOS) and tests/shunit2. C unit tests are only built with
  UNIT_TESTING=ON and are not registered via ADD_TEST, so plain ctest runs
  just cram/shunit2. The recipe builds them with UNIT_TESTING=ON and executes
  all 14 binaries directly (15 invocations: test-blob-parse runs twice —
  positive key-build.ucert fixture plus negative invalid.ucert fixture),
  each checked against the expected output fragment from its tests/cram/
  test_*.t file (content-based, not exit-code-only). Not executed: *-san
  variants (need -fsanitize=address,leak, unsupported by OHOS clang),
  tests/fuzz (needs -fsanitize=fuzzer), the cram runner itself (pip network)
  and valgrind/shunit2 harnesses. Negative tests test-b64_decode/encode are
  counted as passed only when they abort with the upstream-expected
  Assertion message.

# 上游测试命令（conanfile.py build() 内真实执行，cram 等价调用+输出片段校验）
upstream_check_command: "./test-avl && ./test-b64 && ./test-b64_decode && ./test-b64_encode && ./test-blob-buflen && ./test-blob-parse key-build.ucert && ./test-blob-parse invalid.ucert && ./test-blobmsg && ./test-blobmsg-parse valid-blobmsg.bin && ./test-blobmsg-types && ./test-blobmsg_check_array && ./test-blobmsg-procd-instance procd-instance-nlbwmon.bin && ./test-json-script json-script.json && ./test-list && ./test-runqueue"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "conanfile.py build() _run_upstream_tests(): 15 invocations over 14 test-* binaries with per-case expected-output fragments from tests/cram/test_*.t"

# 上游实际的测试程序（14 个二进制，15 次调用）
upstream_tests:
  - file: tests/test-avl.c
    source: libubox-2026.02.13/tests/test-avl.c
    description: "AVL 树单元程序（cram: test_basics 输出）"
    command: "./test-avl"
  - file: tests/test-b64.c
    source: libubox-2026.02.13/tests/test-b64.c
    description: "base64 编解码单元程序"
    command: "./test-b64"
  - file: tests/test-b64_decode.c
    source: libubox-2026.02.13/tests/test-b64_decode.c
    description: "base64 解码负向断言程序（期待 abort + Assertion）"
    command: "./test-b64_decode"
  - file: tests/test-b64_encode.c
    source: libubox-2026.02.13/tests/test-b64_encode.c
    description: "base64 编码负向断言程序（期待 abort + Assertion）"
    command: "./test-b64_encode"
  - file: tests/test-blob-buflen.c
    source: libubox-2026.02.13/tests/test-blob-buflen.c
    description: "blob 缓冲区上限单元程序"
    command: "./test-blob-buflen"
  - file: tests/test-blob-parse.c
    source: libubox-2026.02.13/tests/test-blob-parse.c
    description: "ucert 证书解析单元程序（正/负向各一次）"
    command: "./test-blob-parse key-build.ucert && ./test-blob-parse invalid.ucert"
  - file: tests/test-blobmsg.c
    source: libubox-2026.02.13/tests/test-blobmsg.c
    description: "blobmsg 构建/解析/dump 单元程序"
    command: "./test-blobmsg"
  - file: tests/test-blobmsg-parse.c
    source: libubox-2026.02.13/tests/test-blobmsg-parse.c
    description: "blobmsg_parse 策略解析单元程序（fuzz 语料 valid-blobmsg.bin）"
    command: "./test-blobmsg-parse valid-blobmsg.bin"
  - file: tests/test-blobmsg-types.c
    source: libubox-2026.02.13/tests/test-blobmsg-types.c
    description: "blobmsg 各类型单元程序"
    command: "./test-blobmsg-types"
  - file: tests/test-blobmsg_check_array.c
    source: libubox-2026.02.13/tests/test-blobmsg_check_array.c
    description: "blobmsg 数组校验单元程序"
    command: "./test-blobmsg_check_array"
  - file: tests/test-blobmsg-procd-instance.c
    source: libubox-2026.02.13/tests/test-blobmsg-procd-instance.c
    description: "procd 实例解析单元程序（cram input procd-instance-nlbwmon.bin）"
    command: "./test-blobmsg-procd-instance procd-instance-nlbwmon.bin"
  - file: tests/test-json-script.c
    source: libubox-2026.02.13/tests/test-json-script.c
    description: "json_script 单元程序（cram input json-script.json）"
    command: "./test-json-script json-script.json"
  - file: tests/test-list.c
    source: libubox-2026.02.13/tests/test-list.c
    description: "双向链表单元程序"
    command: "./test-list"
  - file: tests/test-runqueue.c
    source: libubox-2026.02.13/tests/test-runqueue.c
    description: "runqueue 任务队列单元程序（fork/exec sleep）"
    command: "./test-runqueue"

# test_package 中自带的测试（消费者视角验证 blobmsg + blobmsg_json API）
test_package_tests:
  - file: test.c
    description: "消费者测试：blobmsg_buf_init/add_string/add_u32/遍历/policy 解析/format_json/json 反解析共 13 断言"
    command: "./test_libblobmsg"

# 测试断言总数（init 1 + add 2 + get 2 + 存在性 1 + parse 1 + format 非空 1 + json 字段 2 + 第二 init 1 + json 反解析 1 + round-trip 1 = 13）
assertion_count: 13
