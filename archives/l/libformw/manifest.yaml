software: libformw
display: "libformw"
description: "The ncurses form library (wide-character): fields, field types, validation, and form driver for terminal user interfaces"
category: system
homepage: "https://invisible-island.net/ncurses/"
license: X11
build_system: autotools

ohos_adaptation:
  key_points:
    - "libformw 是 ncurses 源码树 form/ 子库的打包名，不是独立上游项目；源码与已发布 ncurses/6.6 为同一份官方 tarball"
    - "必须使用 --without-shared 静态编译（同 ncurses 家族契约），避免遮蔽系统 libncursesw.so.6"
    - "form 对象依赖 config.h 与 ncursesw 内部符号，必须完整 configure 后随树构建，无法只挑头文件打包"
    - "包内只保留 form 产物（libformw.a/form.h/eti.h/formw.pc），libncursesw 本体由依赖 ncurses/6.6 提供"
    - "HMDFS 构建使用 /data/storage/el2/base 私有 build root 与 hnp bash，make -j1（沿用 ncurses/6.6 已验证契约）"
  common_dependencies:
    - gnu-coreutils

versions:
  "6.6_p20260516":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libformw/6.6_p20260516"
