software: libformw
version: "6.6_p20260516"
build_system: autotools
status: built
build_date: "2026-09-19"
source:
  url: "https://invisible-island.net/archives/ncurses/ncurses-6.6.tar.gz"
  sha256: "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--without-shared"
    - "--with-normal"
    - "--without-debug"
    - "--with-trace"
    - "--without-ada"
    - "--without-manpages"
    - "--enable-widec"
    - "--enable-overwrite"
    - "--enable-pc-files"
    - "--with-pkg-config-libdir=/lib/pkgconfig"
  dependencies:
    - ncurses/6.6
  cc: clang
patches_applied:
  - "0001-detect-compound-expr.patch"
  - "0002-lib-mvcur-static-link.patch"
  - "0003-install-headers-shell.patch"
  - "0004-config-guess.patch"
test_results:
  type: official
packaged_artifacts:
  - include/form.h
  - include/eti.h
  - lib/libformw.a
  - lib/pkgconfig/formw.pc
notes: >-
  libformw 是 ncurses 源码树 form/ 子库的打包名，与已发布 ncurses/6.6 同源同补丁；
  完整 in-tree 静态构建后只打包 form 产物，libncursesw 本体由依赖 ncurses/6.6 提供。
