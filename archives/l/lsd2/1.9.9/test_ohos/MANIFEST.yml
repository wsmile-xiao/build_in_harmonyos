# test_ohos/MANIFEST.yml — lsd2 1.9.9 鸿蒙 PC 专项验证
# 独立于 test_package 的 OHOS 专项测试（随 archives 交付，可在真实设备上单独执行）

package: lsd2/1.9.9
test_runner: "python3 run_ohos_test.py <conan_package_folder>"

checks:
  - id: T1
    name: "aarch64 ELF 验证"
    description: "产物 lsd2 为 ELF64 AArch64（OHOS PC 目标架构）"
  - id: T2
    name: "musl libc 验证"
    description: "NEEDED 中无 glibc / ld-linux，链接 musl libc.so，适配 OHOS 运行时"
  - id: T3
    name: "OHOS 签名段验证"
    description: ".codesign 段存在（OHOS 签名管线产出）"
  - id: T4
    name: "宿主路径泄漏检查"
    description: "二进制不含 /storage/、/home/、/Users/ 等宿主绝对路径与 RPATH 泄漏"
  - id: T5
    name: "真实定年计算验证"
    description: "驱动 lsd2 二进制（-i/-d/-o/-s）运行上游 h1n1 示例，rate≈0.0027、tMRCA≈2009，退出码 0，输出含可观察业务结果"

upstream_data:
  - file: data/h1n1_phyml.tree
    source: lsd2-1.9.9/examples/rooted_tree/h1n1_phyml.tree
  - file: data/h1n1.date
    source: lsd2-1.9.9/examples/rooted_tree/h1n1.date