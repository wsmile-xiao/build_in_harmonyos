# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# lsd2 1.9.9 上游未提供自动化测试套件（无 ctest/check 目标）；
# 上游交付物为 CLI 工具 + examples/ 下的真实数据集（h1n1/Dengue）。
# 消费者验证以 test_package 运行 lsd2 二进制 + 上游 h1n1 示例实现。

package: lsd2/1.9.9
homepage: "https://github.com/tothuhien/lsd2"

# 上游测试命令：上游无 make check / ctest 注册项
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游示例数据（真实运行验证用，非独立测试用例）
upstream_examples:
  - file: data/h1n1_phyml.tree
    source: lsd2-1.9.9/examples/rooted_tree/h1n1_phyml.tree
    description: "上游 h1n1 示例树（rooted tree）"
  - file: data/h1n1.date
    source: lsd2-1.9.9/examples/rooted_tree/h1n1.date
    description: "上游 h1n1 示例日期约束文件"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行已安装 lsd2 二进制：-h 版本横幅 + h1n1 示例 dating 运行（rate/tMRCA 输出）"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4