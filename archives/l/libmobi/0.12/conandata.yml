sources:
  url:
    - "https://github.com/bfabiszewski/libmobi/archive/refs/tags/v0.12.tar.gz"
  sha256: "78826d161c02ce93ff1cd62838b4d749df754f52185474b82e4093badf4689c1"
patches:
  # OHOS support for config.guess (2024-07-27, the version automake/1.18
  # installs via autoreconf --install). Adds the LIBC=ohos probe branch
  # (__OHOS__, after __LLVM_LIBC__) and the *:HarmonyOS:*:* system case
  # (before *:NetBSD:*:*). config.sub from automake/1.18 already accepts
  # *-linux-ohos, so no config.sub patch is needed.
  # Idempotency: build() skips this patch when the autoreconf-injected
  # config.guess already contains both HarmonyOS markers (OHOS-adapted
  # host autotools inject such a config.guess); the triplet assertions
  # still run unconditionally afterwards.
  "0.12":
    - patch_file: "patches/0001-config.guess-ohos.patch"
      # MUST be applied AFTER autoreconf --install: autoreconf overwrites
      # config.guess from automake's share dir, which would revert any
      # patch applied earlier. See build().
      patch_type: "portability"
      patch_source: "E007"
      patch_description: "Add HarmonyOS platform recognition to config.guess: LIBC=ohos probe (__OHOS__) and *:HarmonyOS:*:* case mapping to aarch64-unknown-linux-ohos. Self-authored OHOS adaptation for this repo, not an upstream backport."
