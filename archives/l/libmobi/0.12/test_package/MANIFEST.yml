# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: libmobi/0.12
homepage: "https://github.com/bfabiszewski/libmobi"

# Upstream test command
upstream_check_command: "make check"

# Upstream tests are bash-driven sample round-trips (tests/test.sh.in),
# run against tests/samples/*.mobi with md5 baselines (tests/samples_md5.txt)
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/test.sh.in
    source: libmobi-0.12/tests/test.sh.in
    description: "Round-trip driver: mobitool convert → md5 compare vs samples_md5.txt baseline (12 samples, 16 md5 pairs)"
    command: "make check"
  - file: tests/samples_md5.txt
    source: libmobi-0.12/tests/samples_md5.txt
    description: "md5 baselines for sample conversions"
    command: "consumed by test.sh"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/conanfile.py
    description: "Compiles test.c against installed libmobi headers/libs and runs it"
    command: "./test_probe"
  - file: test_package/test.c
    description: "Programmatic minimal-MOBI fixture: load, EXTH title/author, fullname, text decompression, record access; negative inputs assert specific MOBI_RET codes"
    command: "./test_probe"

# OHOS-specific test (independent entry; checkpoints not double-counted as cases)
ohos_specific_test:
  file: test_package/test_ohos_libmobi.c
  cases: 1
  checkpoints: 11
  description:
    - "包内 libmobi.so.0.0.0 为 ELF64 AArch64，SONAME==libmobi.so.0，NEEDED 为 musl libc.so（无 glibc 特征），含 .codesign 签名段"
    - "包内 mobitool 为 ELF64 AArch64，含 .codesign 签名段"
    - "真实文件解析：程序化 MOBI fixture 经 mobi_load_filename + mobi_meta_get_title 提取 EXTH title（非 mock）"
  test_method: "测试内最小 ELF64 解析器自证（不依赖宿主 readelf/file；PT_LOAD vaddr→offset 换算 + DT_STRTAB 两遍遍历）+ 真实调用被测包公开 API"

# Test assertion count (approximate)
assertion_count: 39
