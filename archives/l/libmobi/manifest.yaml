category: doc
homepage: "https://github.com/bfabiszewski/libmobi"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Configured with --with-zlib=no --with-libxml2=no: bundled miniz + internal xmlwriter, no external deps on device"
