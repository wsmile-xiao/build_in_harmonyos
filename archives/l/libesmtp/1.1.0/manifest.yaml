# 版本级 manifest
# 文件位置: archives/l/libesmtp/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.1.0"
software: libesmtp

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-14"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39: 仅官方源，镜像 fallback 由 CI 自动添加）
  url: "https://github.com/libesmtp/libESMTP/archive/refs/tags/v1.1.0.tar.gz"

  # 源码校验和
  sha256: "32bc3614ca12d21c7d933f32d43410e8744b6f91fdca7732da9877a385e4e6c3"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Ddefault_library=shared -Dtls=enabled -Dpthreads=enabled -Dlwres=disabled -Dbdat=true -Detrn=true -Dxusr=true -Dxdg=true"

  # 编译依赖列表（格式: name/version；openssl 固定到 ohpcd OHOS 兼容 recipe
  # revision，避免命中 conancenter CCI recipe 连带拉起不可构建的上游 zlib）
  dependencies:
    - openssl/3.5.6#748fc4deb56588d6f8ce900b21e8eb0a

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-skip-examples-mail-file-no-getpass.patch: skip non-installed examples/mail-file demo (obsolete getpass unavailable on OHOS/musl libc); library/plugins/pkg-config unchanged"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libesmtp 1.1.0 为 Meson 构建（无 configure，非 autotools），构建入口为 meson.build + meson_options.txt"
  - "STARTTLS 为核心能力：meson dependency('openssl', >=1.1.0)，配方 requires openssl/3.5.6 并 -Dtls=enabled"
  - "lwres（libbind9 getaddrinfo）上游默认 disabled，OHOS 无此库，保持 disabled"
  - "上游无任何测试套件（meson.build 无 test() 定义、无 tests/ 目录），仅 examples/mail-file 演示程序且不安装"
