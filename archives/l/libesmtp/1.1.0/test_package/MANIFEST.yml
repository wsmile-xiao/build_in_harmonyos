# test_package/MANIFEST.yml — libesmtp 1.1.0
# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: libesmtp/1.1.0
homepage: "https://github.com/libesmtp/libESMTP"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "meson.build（上游构建入口）"
    finding: "全文无 test() 目标定义；targets 章节仅 library('esmtp')、SASL 插件子目录（login/plain/crammd5/ntlm）与 examples 子目录，无任何测试接线"
  - path: "meson_options.txt"
    finding: "仅 pthreads/tls/xdg/lwres/bdat/etrn/xusr 七个构建特性开关，无测试相关选项"
  - path: "源码树顶层（v1.1.0 tag 文件清单）"
    finding: "无 tests/、test/、check/ 目录，无 *test*.c/*check*.c 测试源码；仅 examples/mail-file.c 一个演示程序"
  - path: "examples/meson.build"
    finding: "仅在 openssl 存在时编译 mail-file 演示可执行文件，且未声明 install:true；为示例程序而非测试套件"
  - path: "上游文档（libesmtp.github.io / INSTALL.md）"
    finding: "仅描述构建与安装流程，未提供任何测试入口、测试命令或 CI 测试步骤"

test_package_tests:
  - file: test.c
    description: "消费者离线验证：smtp_create_session 建会话、smtp_version 版本前缀、set_server/hostname、消息组装（发件人/收件人/头/消息体/DSN/尺寸估计）、enumerate 回调计数、set_timeout，共 6 组断言（R34 合规）"
    command: "./test_libesmtp"

assertion_count: 6
