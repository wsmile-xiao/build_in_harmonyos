software: libesmtp
display: "libesmtp"
description: "SMTP 客户端库（经由预配置 MTA 投递邮件）"
category: network
homepage: "https://github.com/libesmtp/libESMTP"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 构建，STARTTLS 为核心能力，requires openssl/3.5.6 并 -Dtls=enabled"
    - "lwres（libbind9）上游默认 disabled，OHOS 无此库，保持 disabled"
    - "上游无测试套件，仅 examples/mail-file 演示程序；test_package 做 6 组离线 API 断言"
  common_dependencies:
    - openssl/3.5.6

versions:
  "1.1.0":
    status: built
    build_date: "2026-09-14"
    source_url: "https://github.com/libesmtp/libESMTP/archive/refs/tags/v1.1.0.tar.gz"
