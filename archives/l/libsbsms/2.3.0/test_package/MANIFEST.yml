# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 ci/conan/build_and_test.sh L0e 强制要求存在）
package: libsbsms/2.3.0
homepage: "https://github.com/claytonotey/libsbsms"

# 上游测试命令：本版本没有测试入口。
# 清点证据见 archives/l/libsbsms/2.3.0/reports/upstream-test-inventory.md：
#   * tar tzf 共 72 项，无 test/ tests/ testing/ 目录；
#   * find . -iname '*test*' 零命中（命中的是 '*check*' -> m4/ax_check_compiler_flags.m4）；
#   * src/ 下 11 个 .cpp 无任何 int main(；
#   * 仓库根 Makefile.am 的 SUBDIRS 只有 src，无 TESTS / check-local / check_PROGRAMS；
#   * CMakeLists.txt 无 enable_testing() / add_test() / include(CTest)。
upstream_check_command: "(none — 上游 2.3.0 未随源码提供测试目录或测试程序)"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "(none)"

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，独立于上游用例计数）
test_package_tests:
  - file: test_sbsms.cpp
    description: >-
      以 440 Hz 单音驱动公开 API（SBSMSQuality/SBSMSQualityStandard、Slide、
      SBSMSInterfaceSliding 的 samples() 契约、SBSMS::read）做分析+合成往返：
      校验出厂 quality 表指纹、identity 保频保长、pitch x2 频率翻倍、
      rate x2 时长减半且保频，并逐样本检查输出有限性与非静音。
    command: "./test_sbsms"

# 测试断言总数（test_package 消费者断言；上游为 0，两者分栏统计）
assertion_count: 26
