# conandata.yml — libsbsms 2.3.0
#
# 唯一真相源：源码 URL + SHA256 + 补丁声明（conanfile.py 通过 self.conan_data 读取）。
# URL 为上游官方仓库 claytonotey/libsbsms 的 tag 归档（R39 要求官方源；Debian
# copyright 的 Upstream-Source 亦指向该 GitHub 仓库，SourceForge 上 sbsms.sourceforge.net
# 只是历史主页）。带显式 .tar.gz 后缀，避免 Conan get() 按 basename 误判压缩格式（E276）。
# sha256 为设备实测下载值（gzip magic 1f 8b、450111 字节已校验）。
#
# 本版本无需源码补丁：
#   * 构建系统选 CMake（上游 .github/workflows/build.yml 的官方路径，CMakeLists 声明
#     version 2.3.0），从而完全绕开 commit 里 configure/Makefile.in + config.guess/
#     config.sub 的 autotools 老三元组问题（prescan PSCAN-BUILD-001/102）；
#   * CMake 4.x 拒绝 cmake_minimum_required(VERSION 3.1) 由 recipe 的
#     CMAKE_POLICY_VERSION_MINIMUM=3.5 处理（E187/E321），不改源码；
#   * OHOS 平台名由 CMAKE_SYSTEM_NAME=OHOS 处理（SDK 自带 Platform/OHOS.cmake），不改源码。

