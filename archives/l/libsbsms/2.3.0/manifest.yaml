software: libsbsms
version: "2.3.0"
status: built
build_system: cmake
build_date: "2026-09-15"

source:
  url: "https://github.com/claytonotey/libsbsms/archive/refs/tags/2.3.0.tar.gz"
  sha256: "4f88d152bc06fedbda9d5d65517d40254a7310c9050601a93122309d45afd2c9"
  tar_format: tar.gz

build:
  configure_options:
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=OHOS"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "ref: E187, DRAFT-E321, E321 — CMake 4.x rejects cmake_minimum_required(VERSION 3.1); CMAKE_POLICY_VERSION_MINIMUM=3.5 must be delivered as a cache variable (-D) because tc.variables lands in conan_toolchain.cmake only after that call and is therefore ignored"
  - "ref: DRAFT-cmake-harmonyos-platform-soname-flag, E092, E140, E267 — os=OHOS makes Conan emit CMAKE_SYSTEM_NAME=HarmonyOS, for which CMake has no Platform module, so CMAKE_SHARED_LIBRARY_SONAME_<LANG>_FLAG stays undefined and SOVERSION/VERSION are silently dropped; selecting CMAKE_SYSTEM_NAME=OHOS loads the shipped Platform/OHOS.cmake (include(Platform/Linux)) and restores DT_SONAME (measured: SONAME libsbsms.so.2)"
  - "ref: E007, PSCAN-BUILD-001 — preferring the upstream CMake build over the autotools tree committed in the same tarball removes the obsolete config.guess/config.sub triplet problem entirely, and CMakeLists.txt carries the real 2.3.0 version while configure.ac still says 2.2.0"
  - "ref: E276 — keep an explicit .tar.gz suffix in the source URL so Conan get() does not mis-detect the archive format from the GitHub codeload basename"
  - "ref: E092 — once the platform name is resolved, check_function_exists(lrint) is detected correctly (it was found only under CMAKE_SYSTEM_NAME=OHOS), so real.h uses the real lrint/lrintf instead of its cast fallback"

test_results:
  type: conan_create_harmonyos_aarch64
  upstream_total: 0
  consumer_assertions: 26
  consumer_passed: 26
  consumer_failed: 0
  reason: "Upstream 2.3.0 ships no tests (inventory in reports/upstream-test-inventory.md). The test_package consumer drives the public API end to end: the 26 assertions cover the shipped quality table, identity/pitch-x2/rate-x2 round trips with measured 439.4/879.8/439.6 Hz against a 440 Hz input, and finiteness/non-silence of every output sample."
