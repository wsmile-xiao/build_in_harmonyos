software: libsbsms
display: "libsbsms"
description: "Subband Sinusoidal Modeling Synthesis — high quality time stretching and pitch scaling for audio"
category: library
homepage: "https://github.com/claytonotey/libsbsms"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "选 CMake 而非 commit 里同时存在的 autotools：只有 CMakeLists.txt 声明真实的 2.3.0，且不需要给老 config.guess/config.sub 补 aarch64-ohos 三元组"
    - "CMAKE_POLICY_VERSION_MINIMUM=3.5 必须走 cache_variables：-D 在 cmake_minimum_required() 之前生效，tc.variables 写进 conan_toolchain.cmake 时已经太晚"
    - "必须显式 CMAKE_SYSTEM_NAME=OHOS：Conan 由 os=OHOS 映射出的 HarmonyOS 没有 Platform 模块，SOVERSION/VERSION 会被静默丢弃、产物无 DT_SONAME"
    - "公开类型 audio 是按通道的 float[2]（stereo 的左右声道），mono 只有 [0] 有意义"
    - "SBSMS::read() 永不返回 0，消费者需按 getSamplesToOutput() 自行设停止条件"
  common_dependencies: []

versions:
  "2.3.0":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libsbsms/2.3.0"
