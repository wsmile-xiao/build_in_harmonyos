# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libeio/1.0
homepage: "https://github.com/scunningham/libeio"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libeio 1.0 官方源码无独立测试目录/测试框架：Makefile.am 未声明 TESTS/check_PROGRAMS，
# make check 无测试目标（退出 0 但无测试执行）。demo.c 是上游唯一可执行示例（官方
# 样例，非独立测试用例，不计入上游用例数）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用公开 API eio_init/eio_nthreads/eio_wd_open_sync/eio_wd_close_sync/eio_nop/eio_npending/eio_poll"
    command: "./test_libeio"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4