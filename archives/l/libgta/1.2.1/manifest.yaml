# 版本级 manifest — libgta 1.2.1
# 文件位置: archives/l/libgta/1.2.1/manifest.yaml （ARCHIVE-SPEC v3.0）

software: libgta
version: "1.2.1"
status: built
build_system: autotools
build_date: "2026-09-25"
conan_ref: "libgta/1.2.1"

source:
  url: "https://marlam.de/gta/releases/libgta-1.2.1.tar.xz"
  sha256: "d445667e145f755f0bc34ac89b63a6bfdce1eea943f87ee7a3f23dc0dcede8b1"
  tar_format: tar.xz

build:
  system: autotools
  bootstrap_command: ""   # 发布版 tarball 自带 configure，无需 autoreconf
  # ARCHIVE-SPEC §4.2: configure_options 须与 conanfile.py 一致。
  # 本配方 generate() 按 shared 选项（默认 shared=True）追加
  # --enable-shared --disable-static；--prefix=/ 由 conan AutotoolsToolchain
  # 注入（config.log 实测 `configure --prefix=/ ...`），package() 阶段
  # autotools.install() 无条件补 DESTDIR=<package_folder> 落包。
  # native 编译：未传 --build/--host（OHOS 三元组由 config.guess/config.sub
  # 整文件补丁产出 aarch64-unknown-linux-ohos，R1 参数最少化）。
  configure_options:
    - "--prefix=/"
    - "--enable-shared"
    - "--disable-static"
  # 零依赖：configure.ac 的 zlib/bz2/lzma 只在已废弃 --with-compression
  # （默认 off）下探测；CMakeLists.txt 亦无三方 find_package。
  dependencies: []
  tool_dependencies: []
  cc: clang
  cxx: clang++
  # 与 conanfile.py `package_type = "library"` 一致（ARCHIVE-SPEC §2.1）
  package_type: library

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure.patch"

artifacts:
  libraries:
    - lib/libgta.so
    - lib/libgta.a
  headers:
    - include/gta/gta.h
    - include/gta/gta.hpp
    - include/gta/gta_version.h
  pkgconfig:
    - lib/pkgconfig/gta.pc
  licenses:
    - licenses/COPYING

knowledge_gained:
  - "config.guess/config.sub 陈旧族（E007 族）：发布版 tarball 自带 2018-02-24 件，uname -s=HarmonyOS 直接打回 unable to guess system type（rc=1）；修法=2026-05-17 GNU config 整文件补丁 + config.guess 注入 *:HarmonyOS:*:* 分支输出 aarch64-unknown-linux-ohos（新 config.sub 认收），经 refresh-patch 两面登记"  # knowledge_ref: E007
  - "HMDFS config.status 权限杀（autoconf 2.69 单点修法）：config.status: error: could not setup config files machinery / ./confXXXXXX/subs1.awk: Permission denied 根因是 (umask 077 && mktemp -d \"./confXXXXXX\")——HMDFS 目录落盘 mode=0777&~umask|setgid、忽略请求 mode；发布版 tarball 的 configure 是受跟踪源文件，把暂存机制归一为 tmp=./conftmp + (umask 022 && mkdir -p) 补丁一次即可，config.status 模板内嵌于 configure、生成时自动继承，无需对生成物做第二次修复"  # knowledge_ref: E737

validation:
  upstream_tests:
    command: "make check（沙箱 HOME=$TASK_DIR/test-home，探索树 out-of-source）+ fuzz 驱动 100 轮种子补测"
    result: "声明 N=8（候选数法最大值：automake TESTS=6 / check_PROGRAMS=7 / 并集=8，差额逐项归因见 reports/test-report.md）；N′=8：PASS=7 SKIP=1 FAIL=0 NOT_RUN=0（fuzztest.sh 上游设计无参数 exit 77=SKIP；fuzztest-create/check 以 100 轮实测 100/100 判 PASS）"
    source: "$TASK_DIR/logs/makecheck-sandbox.log + $TASK_DIR/logs/fuzz-drivers.log + reports/test-report.md"
  test_package:
    command: "conan create 的 test() 阶段：test_package/test.c 消费者端到端往返（头/标签/像素写读一致，20 断言）"
    result: "20/20 assertions passed（采信轮 conan-create.log:383 与 W3 w3-local-ci.log:464 双日志同读数）"
    source: "reports/conan-create.log / reports/w3-local-ci.log"
  conan_verify: "采信轮 conan_verify_round.sh rc=0（干净轮标志 run_make=6 calling_build=2 apply_patch=3，DB 清缓存两表为空）：G1/G0/G2/G3/G4/L4/L5 PASS，L2 跳过（纯库无 bin/，人工补测 reports/conan-verify-supplement.md）；W3 本地 CI exit_code=0（Total 1 / Success 1）——reports/conan-verify-report.md、reports/w3-local-ci.log"
