# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libgta/1.2.1
homepage: "https://marlam.de/gta/"

# 上游测试命令 (make -n check / automake TESTS 注册清点)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# false: 上游测试在设备探索树以沙箱 HOME 独立执行并留档 (见 notes.md 验证结果),
#        conan build() 只负责构建 (与仓库其余 autotools 配方同口径)。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（声明 N=8：automake TESTS 6 + check_PROGRAMS 独有驱动 2，
# 候选数法最大值与差额归因见 ../reports/test-report.md）
upstream_tests:
  - file: basic
    source: libgta-1.2.1/tests/basic.c
    description: "基本头/数据写读往返（TESTS ∩ check_PROGRAMS）"
    command: "./basic"
  - file: taglists
    source: libgta-1.2.1/tests/taglists.c
    description: "标签列表读写（TESTS ∩ check_PROGRAMS）"
    command: "./taglists"
  - file: filedescriptors
    source: libgta-1.2.1/tests/filedescriptors.c
    description: "基于文件描述符的流式 IO（TESTS ∩ check_PROGRAMS）"
    command: "./filedescriptors"
  - file: blocks
    source: libgta-1.2.1/tests/blocks.c
    description: "块 IO (block IO) 接口（TESTS ∩ check_PROGRAMS）"
    command: "./blocks"
  - file: elements
    source: libgta-1.2.1/tests/elements.c
    description: "元素寻址/端序 (little/big-endian.gta 夹具)（TESTS ∩ check_PROGRAMS）"
    command: "./elements"
  - file: fuzztest.sh
    source: libgta-1.2.1/tests/fuzztest.sh
    description: "fuzz 驱动脚本——上游设计: 无参数调用固定 exit 77 (automake SKIP), 真实 fuzz 循环由 make fuzztest 驱动"
    command: "./fuzztest.sh"
  - file: fuzztest-create
    source: libgta-1.2.1/tests/fuzztest-create.c
    description: "fuzz 语料驱动（check_PROGRAMS 独有、不入 TESTS）——100 轮种子迭代实测 100/100"
    command: "./fuzztest-create <seed> valid.gta corrupt.gta"
  - file: fuzztest-check
    source: libgta-1.2.1/tests/fuzztest-check.c
    description: "fuzz 校验驱动（check_PROGRAMS 独有、不入 TESTS）——100 轮种子迭代实测 100/100"
    command: "./fuzztest-check valid.gta corrupt.gta"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者端到端往返: 16x8 RGB 头/标签/像素写读一致, 每条断言打 ASSERT n OK 行"
    command: "./test_libgta"

# 测试断言总数 (近似值, 用于质量评估)
# 声明 N=8（候选数法最大值：automake TESTS 6 + check_PROGRAMS 独有驱动 2，差额归因见
# ../reports/test-report.md；上游 tests/*.c 为手写 if+exit 用例、无断言宏）;
# test_package 为断言计数口径 20 (test.c check() 调用点, 实测 20/20)。
assertion_count: "声明 N=8（automake TESTS 6 + check_PROGRAMS 独有驱动 2，候选数法最大值，上游源码无断言宏按用例计）; test_package 消费者断言 20 (test.c, 实测 20/20)"
