# test_package/MANIFEST.yml
package: libredwg/0.14
homepage: "https://www.gnu.org/software/libredwg/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: "unit-testing"
    source: libredwg-0.14/test/unit-testing
    description: "数百个对象级单元测试（3dline/arc/circle/line/text等）"
    command: "make check"
  - name: "programs-alive"
    source: libredwg-0.14/programs/alive.test
    description: "dwgread/dwgwrite等工具存活测试"
    command: "make check"
  - name: "programs-dxf"
    source: libredwg-0.14/programs/dxf.test
    description: "DWG与DXF互转测试"
    command: "make check"
  - name: "programs-dxfb"
    source: libredwg-0.14/programs/dxfb.test
    description: "二进制DXF互转测试"
    command: "make check"
  - name: "top-level-suites"
    source: libredwg-0.14/test/test-data
    description: "顶层dwg/dxf/json/svg/rw集成套件（需jq/jing时自动跳过缺失项）"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "版本宏/Dwg_Data结构/错误路径API消费者测试"
    command: "./test_libredwg"
  - file: test.c
    description: "dwgread命令行工具冒烟测试"
    command: "dwgread --version"

assertion_count: 5
