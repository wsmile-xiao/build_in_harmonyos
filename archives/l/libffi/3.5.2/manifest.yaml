version: "3.5.2"
status: published
build_date: "2026-04-12"

source:
  url: "https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=$TEST_PREFIX"
  cc: clang

patches_applied:
  - "0001-port-for-ohos.patch"
  - "0002-closure-port-for-ohos.patch"

knowledge_gained:
  - "libffi 使用标准 autotools，打 config.guess/config.sub 补丁即可编译"
  - "ghfast.top 可作为 GitHub 加速代理"
  - "ffi_closure 需要 FFI_EXEC_STATIC_TRAMP + HMDFS 路径回退补丁"
