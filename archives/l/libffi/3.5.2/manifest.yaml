software: libffi
version: "3.5.2"
status: success
build_system: autotools
compile_date: "2026-03-28"

dependencies:
  required: [clang, make]
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  source: https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz
  configure_options:
    - --prefix=$HOME/usr/local
  cflags: null

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: 修改 config.guess 添加 HarmonyOS 检测，修改 config.sub 添加 ohos 操作系统支持
  - file: 0002-closure-port-for-ohos.patch
    purpose: 修复 ffi_tramp_get_libffi() 中 HMDFS 路径不可访问问题，添加 mount 表路径回退，添加 errno.h

compatibility:
  level: high
  issues:
    - "ffi_closure 需要 FFI_EXEC_STATIC_TRAMP + HMDFS 路径回退补丁（详见 CLOSURE_PORTING.md）"
    - "make install 的 .so 文件可能被截断（10K），需从构建目录 .libs/ 手动拷贝完整版本（109K）"
    - "ln -sf 创建带随机后缀残留文件，需 rm -f + ln -s 方式创建软链接"
    - "/proc/self/map_files 在鸿蒙上不可用，/proc/self/fd/ 中无动态加载 .so 的 fd"
    - "动态链接需设置 LD_LIBRARY_PATH，RPATH 在运行时 musl 不一定识别"
  notes: |
    核心功能（ffi_prep_cif、ffi_call）完全正常，3.5.2 新增版本 API 正常。
    ffi_closure 闭包功能需要额外补丁（FFI_EXEC_STATIC_TRAMP + HMDFS 路径回退），移植方案详见 CLOSURE_PORTING.md。
    静态链接和动态链接（需设置 LD_LIBRARY_PATH）均可正常工作。
    支持版本 API（ffi_get_version 等）、default_abi、wasm64。

test_results:
  type: manual
  passed: 2
  failed: 1
  skipped: 1
  note: |
    ffi_prep_cif + ffi_call 核心功能通过（abs(-42) 返回 42）。
    版本 API 通过（ffi_get_version()=3.5.2, ffi_get_version_number()=30502, ffi_get_closure_size()=48）。
    ffi_closure 失败（W^X 策略 + HMDFS 路径问题）。
    官方测试套件因缺少 runtest (DejaGnu) 跳过。

knowledge_gained:
  - "鸿蒙禁止 mmap/mprotect 使用 PROT_EXEC（errno=22），但允许 MAP_FIXED 替换已有可执行映射"
  - "HMDFS 导致 /proc/self/maps 中文件路径为内核内部路径，open() 返回 ENOENT，需通过 /proc/self/mounts 做路径转换"
  - "/proc/self/map_files 不可用，/proc/self/fd/ 中无动态加载 .so 的 fd"
  - "FFI_EXEC_STATIC_TRAMP 方案：复用 .so 内 trampoline_code_table，通过 MAP_FIXED 映射实现可执行内存，是鸿蒙上唯一可行的闭包方案"
  - "tramp.h (Linux 5.18+ 内核头) 可用空 stub 替代，tramp.c 未实际使用其中任何符号"
  - "make install 可能产生截断 .so 文件，需从 .libs/ 手动拷贝"
  - "libffi 动态链接需设置 LD_LIBRARY_PATH，RPATH 在运行时 musl 不一定识别"
  - "与 libffi 3.4.4 只能安装一个版本，互斥"
