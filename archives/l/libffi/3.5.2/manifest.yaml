# libffi 3.5.2 编译档案
software: libffi
version: "3.5.2"
status: success
build_system: autotools
compile_date: 2026-04-12

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$TEST_PREFIX
  cflags: "-fPIC -O2"
  env:
    CC: clang

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: config.guess + config.sub 添加 HarmonyOS 检测
  - file: 0002-closure-port-for-ohos.patch
    purpose: ffi_tramp HMDFS 路径回退修复

compatibility:
  level: high
  issues:
    - "ffi_closure 需要 FFI_EXEC_STATIC_TRAMP + HMDFS 路径回退补丁（详见 CLOSURE_PORTING.md）"
  notes: |
    - ffi_prep_cif + ffi_call 核心功能完全正常
    - 版本API正常（ffi_get_version=3.5.2, ffi_get_version_number=30502）
    - ffi_closure 闭包功能需要额外补丁
    - 动态库(.so)+静态库(.a)均有

test_results:
  type: manual
  passed: 3
  failed: 0
  note: "ffi_call add(5,7)=12 + ffi_call abs(-42)=42 + 版本API全部通过"

knowledge_gained:
  - "libffi 使用标准 autotools，打 config.guess/config.sub 补丁即可编译"
  - "ghfast.top 可作为 GitHub 加速代理"

references:
  - https://github.com/libffi/libffi
