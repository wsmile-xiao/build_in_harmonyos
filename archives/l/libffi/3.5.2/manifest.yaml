software: libffi
version: "3.5.2"
status: success
build_system: autotools
category: library
description: libffi - Foreign Function Interface library

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: "修改 config.guess 添加 HarmonyOS 检测，修改 config.sub 添加 ohos 操作系统支持"
    lines_changed: 23
  - file: 0002-closure-port-for-ohos.patch
    purpose: "修复 ffi_tramp_get_libffi() 中 HMDFS 路径不可访问问题，添加 mount 表路径回退，添加 errno.h"
    lines_changed: 79

compatibility:
  level: high
  issues:
    - "ffi_closure 功能需要额外补丁（FFI_EXEC_STATIC_TRAMP + HMDFS 路径回退），详见 CLOSURE_PORTING.md"
    - "make install 的 .so 文件可能被截断（10K），需从构建目录 .libs/ 手动拷贝完整版本（109K）"
    - "ln -sf 创建带随机后缀的残留文件，需 rm -f + ln -s 方式创建软链接（或用 cp 替代）"
    - "/proc/self/map_files 在鸿蒙上不可用，/proc/self/fd/ 中无 libffi 的 fd"
  notes: |
    核心功能（ffi_prep_cif、ffi_call）完全正常，版本 API（3.5.2 新增）正常。
    ffi_closure 闭包功能需要额外补丁启用 FFI_EXEC_STATIC_TRAMP 并修复 HMDFS 路径问题。
    闭包移植方案已设计完成，详见 CLOSURE_PORTING.md，待实现验证。
    静态链接和动态链接（需设置 LD_LIBRARY_PATH）均可正常工作。

test_results:
  type: manual
  passed: 3
  failed: 1
  skipped: 1
  details:
    - name: "make check (官方测试套件)"
      result: skipped
      note: "系统缺少 runtest (DejaGnu)，测试框架无法启动"
    - name: "ffi_prep_cif + ffi_call 核心功能"
      result: passed
      note: "通过静态库和动态库均验证成功，调用 abs(-42) 返回 42"
    - name: "版本 API (FFI_VERSION_STRING 等)"
      result: passed
      note: "ffi_get_version()=3.5.2, ffi_get_version_number()=30502, ffi_get_closure_size()=48"
    - name: "ffi_closure 闭包回调"
      result: failed
      note: |
        ffi_closure_alloc() 返回 NULL。
        根因1: 鸿蒙 W^X 策略禁止 mmap PROT_EXEC (errno=22)
        根因2: FFI_EXEC_STATIC_TRAMP 方案中 ffi_tramp_get_libffi() open(HMDFS路径) 失败 (ENOENT)
        解决方案: 启用 FFI_EXEC_STATIC_TRAMP + mount 表路径回退，详见 CLOSURE_PORTING.md

dependencies:
  required:
    - clang
    - make
  optional: []

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: clang 15.0.4

build:
  source: https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz
  system: autotools
  dependencies:
    - clang
    - make

  configure_flags:
    - --prefix=${HOME}/usr/local

  patches:
    - 0001-port-for-ohos.patch

  install_workarounds:
    - "make install 后 .so 被截断，需从 .libs/ 手动 cp 完整文件"
    - "清理 ln -sf 产生的随机后缀残留文件，用 rm -f + ln -s 重建软链接"

features:
  closures: "需额外补丁(STATIC_TRAMP+HMDFS回退)，详见CLOSURE_PORTING.md"
  version_api: yes
  default_abi: yes
  wasm64: yes

version_features:
  FFI_VERSION_STRING: yes
  FFI_VERSION_NUMBER: yes
  ffi_get_version: yes
  ffi_get_version_number: yes
  ffi_get_default_abi: yes
  ffi_get_closure_size: yes

knowledge_gained:
  - "鸿蒙系统禁止 mmap/mprotect 使用 PROT_EXEC 标志（errno=22 EINVAL），但允许 MAP_FIXED 替换已有可执行映射"
  - "鸿蒙 HMDFS 导致 /proc/self/maps 中的文件路径为内核内部路径，open() 返回 ENOENT，需通过 /proc/self/mounts 做路径转换"
  - "/proc/self/map_files 在鸿蒙上不可用（返回 ENOENT），/proc/self/fd/ 中无动态加载 .so 的 fd"
  - "FFI_EXEC_STATIC_TRAMP 方案：复用 .so 内 trampoline_code_table，通过 MAP_FIXED 映射实现可执行内存，是鸿蒙上唯一可行的闭包方案"
  - "tramp.h (Linux 5.18+ 内核头) 可用空 stub 替代，tramp.c 未实际使用其中任何符号"
  - "make install 可能产生截断的 .so 文件，需从构建目录 .libs/ 手动拷贝"
  - "libffi 动态链接在鸿蒙上需要设置 LD_LIBRARY_PATH，RPATH 在链接时设置但运行时 musl 不一定识别"

notes:
  - "3.5.2 新增版本 API（FFI_VERSION_STRING 等）"
  - "与 3.4.4 只能安装一个版本，互斥"
  - "闭包功能需要额外补丁，移植方案详见 CLOSURE_PORTING.md"
  - "闭包移植核心：启用 FFI_EXEC_STATIC_TRAMP + 修改 tramp.c 添加 mount 表路径回退"

closure_porting:
  status: "方案已设计，待实现验证"
  document: "CLOSURE_PORTING.md"
  approach: "FFI_EXEC_STATIC_TRAMP + HMDFS mount表路径回退"
  root_cause:
    - "鸿蒙 W^X 策略禁止 mmap PROT_EXEC"
    - "HMDFS 内部路径在 /proc/self/maps 中不可直接 open()"
  solution_summary: |
    1. 编译时启用 FFI_EXEC_STATIC_TRAMP=1
    2. 提供 tramp.h 空 stub（鸿蒙无此内核头）
    3. 修改 tramp.c ffi_tramp_get_libffi() 添加 mount 表路径回退
    4. 利用 MAP_FIXED 替换匿名 RW 映射的上半部分为 .so 中 trampoline_code_table 的 RX 映射

build_date: 2026-03-28