software: libffi
version: "3.5.2"
status: success
build_system: autotools
category: library
description: libffi - Foreign Function Interface library

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: "HarmonyOS 移植补丁"
    lines_changed: null

compatibility:
  level: high
  issues: []
  notes: "编译安装成功，功能完整"

test_results:
  type: build
  passed: 1
  failed: 0
  note: "autotools 编译通过，make check 未单独执行"

dependencies:
  required:
    - clang
    - make
  optional: []

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: clang 15.0.4

build:
  source: https://github.com/libffi/libffi/releases/download/v3.5.2/libffi-3.5.2.tar.gz
  system: autotools
  dependencies:
    - clang
    - make
  
  configure_flags:
    - --prefix=${HOME}/usr/local
  
  patches:
    - 0001-port-for-ohos.patch

features:
  closures: yes
  version_api: yes
  default_abi: yes
  wasm64: yes

version_features:
  FFI_VERSION_STRING: yes
  FFI_VERSION_NUMBER: yes
  ffi_get_version: yes
  ffi_get_version_number: yes
  ffi_get_default_abi: yes
  ffi_get_closure_size: yes

notes:
  - "3.5.2 新增版本 API（FFI_VERSION_STRING 等）"
  - "与 3.4.4 只能安装一个版本，互斥"

build_date: 2026-03-22