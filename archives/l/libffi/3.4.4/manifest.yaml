# libffi 3.4.4 编译档案

software: libffi
version: 3.4.4
status: success
build_system: autotools
compile_date: 2024-03-12

dependencies:
  required: []
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --enable-shared
  cflags: "-fPIC -O2"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: 修改 config.guess 和 config.sub 支持 HarmonyOS
    lines_changed: 50
    files_modified:
      - config.guess
      - config.sub

compatibility:
  level: high
  issues: []
  notes: |
    - FFI 核心功能完全可用
    - 多架构支持（aarch64, arm, x86_64）
    - 动态库和静态库正常
  syscalls:
    available: [mmap, mprotect]
    missing: []
    workaround: []

test_results:
  type: skipped
  total: 0
  passed: 0
  failed: 0
  note: "编译后通过简单测试验证功能正常"
  key_features:
    - ffi_call
    - ffi_closure

knowledge_gained:
  - "libffi 使用标准 autotools 构建系统"
  - "修改 config.guess 添加 HarmonyOS 检测"
  - "修改 config.sub 添加 ohos 操作系统支持"
  - "三元组格式：aarch64-unknown-linux-ohos"

references:
  - title: libffi 官方仓库
    url: https://github.com/libffi/libffi
  - title: libffi 下载
    url: https://github.com/libffi/libffi/releases/download/v3.4.4/libffi-3.4.4.tar.gz

maintainer: OpenHarmony PC Developer社区
last_updated: "2024-03-12"
tags: [ffi, foreign-function-interface, library]