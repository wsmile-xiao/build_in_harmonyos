version: 3.3.3
status: built
build_date: '2026-09-25'

source:
  url: "https://github.com/benmcollins/libjwt/archive/refs/tags/v3.3.3.tar.gz"
  sha256: "a562e5548a8e10ac6fcba64a5e6d326c15712211cb54d25242c15e8b3250b4f2"
  tar_format: tar.gz
  note: "与同源包 libjwt/3.3.3、libjwt-tools/3.3.3 同一官方版本化归档、同一 sha256。"

build:
  system: cmake
  configure_options:
    - "WITH_TESTS=ON（上游默认 ON，此处显式声明；上游 11 个 libcheck 套件随构建注册并由本配方执行）"
    - "WITH_GNUTLS=OFF（上游默认 ON=auto-detect；OHOS 不引入 gnutls，钉死以消除依赖图不确定性）"
    - "WITH_JSON_C=OFF（JSON 后端使用 jansson，上游默认值）"
    - "WITH_MBEDTLS=OFF / WITH_LIBCURL=OFF / WITH_KCAPI_MD=OFF / ENABLE_COVERAGE=OFF（均为上游默认值，显式声明以保证可复现）"
    - "CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE（HMDFS 无法创建版本化符号链接链，否则链接步骤报 Permission denied）"
    - "CMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,（缺该变量会走 CMakeDeps 的 IMPORTED_NO_SONAME 分支）"
    - "未传 BUILD_SHARED_LIBS：上游 CMakeLists 对该变量无任何分支，共享库与静态库被无条件同时构建"
  dependencies:
    - "jansson/2.15.1.1"
    - "openssl/3.5.6"
    - "check/0.15.2"
  dependency_notes:
    - "check/0.15.2 以 test_requires 引入：不参与 package_id、不向下游传播，仅供本包编译期运行上游测试。"
    - "openssl/3.5.6 制品仓只提供静态库（libcrypto.a/libssl.a），故 OpenSSL 被静态链入 libjwt.so。"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-fix-codegen-bash-c.patch"

artifacts:
  libraries:
    - "lib/libjwt.so"
    - "lib/libjwt.a"
  executables:
    - "bin/jwt-verify"
    - "bin/jwt-generate"
    - "bin/jwk2key"
    - "bin/key2jwk"
  headers:
    - "include/jwt.h"
    - "include/jwt_export.h"

knowledge_gained:
  - "上游用 pkg_check_modules()（pkg-config）而不是 find_package() 定位依赖：CMake 配方必须启用 PkgConfigDeps 生成 jansson.pc/openssl.pc/check.pc，仅靠 CMakeDeps 无法满足 pkg_check_modules。"
  - "libcheck 选临时目录的优先级是 TEMP → P_tmpdir 宏 → TMPDIR → 当前目录；OHOS libc 把 P_tmpdir 定义为只读的 /tmp，因此只设 TMPDIR 无效，必须设 TEMP。"
  - "上游 add_test() 硬编码解释器 /bin/bash（CMakeLists:315），OHOS 根文件系统只有 /bin/sh → ctest 无法驱动，须按 add_test 等价语义直接执行测试二进制。"
  - "上游 codegen 用 add_custom_command(COMMAND bash -c \"${CMAKE_C_COMPILER} -E ...\")，CMake 拆词后引号丢失、bash -c 只拿到裸编译器名 → clang 预处理静默失败（Error 1 无输出）；改直接调 ${CMAKE_C_COMPILER} -E（patch 0001）。"
  - "CMake 缺 Modules/Platform/HarmonyOS.cmake 时 CMAKE_SHARED_LIBRARY_SONAME_<LANG>_FLAG 为空，而该变量同时是 cmGeneratorTarget::HasSOName() 的判据：只补它会让上游声明的 VERSION/SOVERSION 生效、产出两级版本化符号链接（在 HMDFS 上创建失败 → 链接报错）；正确做法是同时设 CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE，产出单个实体 .so 加裸 DT_SONAME（与 E330/E383 及 expat/libharu/attica 同一组三行）。"
  - "上游 jwt 目标的 VERSION/SOVERSION 来自 cmake/LibJWTVersions.cmake 的 libtool 换算（SO_CRA 16:7:2 → VERSION_INFO 14.2.7、COMPATVERSION 14），因此不关版本化命名会产出 libjwt.so.14。"
  - "上游 tools 目标（jwt_add_tool）定义在 WITH_TESTS 块之外且无条件构建、PRIVATE 链接 jwt_static，故 build() 必须全量构建才能拿到 4 个命令行工具；不需要单独一次只构建工具的配方。"
  - "OHOS/musl 下 conan 的 self.run()（shell=True）驱动 cmake --build -jN（N>1）时，make jobserver 并行 spawn clang 子进程会静默失败（失败点随并行调度漂移）；改用 subprocess 直接 make -j1 串行编译可 100% 成功（E525/E074）。"
  - "conan 在同一进程内接着跑 test_package：build() 中改动的进程环境变量（TEMP/TMPDIR/LD_LIBRARY_PATH）必须还原，否则后续 make 会把 jobserver fifo 建到本包构建目录并报 Operation not permitted。"

validation:
  local:
    source_version_check: passed
    source_sha256_check: passed
    dependency_preflight_w0: passed
    conan_create: passed
    conan_create_package_id: "a87045f68ba2575c2c64510330eaf74cc5aa4077"
    upstream_tests: "passed (11/11 libcheck 套件, 147 checks, 0 失败 0 错误 = 100%)"
    test_package: "passed (test_libjwt3 34/34 + test_ohos 16/16 = 50/50, 100%)"
    build_warnings: 0
    reason: >-
      依赖三件套（jansson/2.15.1.1、openssl/3.5.6、check/0.15.2）经 conan download
      --only-recipe 实测均已发布；conan create 全量重建 EXIT=0
      （上游 11/11 套件 147 checks 0 失败 0 错误；test_package 50/50）。
      本地含 1 个源码补丁（0001-cmake-fix-codegen-bash-c.patch，codegen 的
      CMAKE_C_FLAGS 拆词修复）；共享库 SONAME 缺口由 conanfile.py 的 CMake 变量修复。
  ohos:
    conan_create: pending_ci
    reason: >-
      本地（OHOS aarch64 真机）全链路已验证；官方 CI 为 clean 环境，
      需在 PR 阶段做最终复验（重点：libcheck 的 TEMP 可写目录与上游测试执行路径）。
