# conandata.yml — libjwt3 3.3.3
# 源码: 上游官方仓库 benmcollins/libjwt 的 v3.3.3 标签归档（R39 官方源，https）
#       URL 与 sha256 与同源包 libjwt/3.3.3、libjwt-tools/3.3.3 一致（同一上游归档）。
# sha256 由本地下载实测确认（2026-09-25，与既有归档记录一致）。
#
# ⚠️ url 必须写成「单行式」（url: "https://…"），不能写成列表式
#    （url: 换行后跟 - "https://…"）。原因：ci/conan/build_and_test.sh 的
#    Mirror fallback 注入以 `grep -E 'url:.*https://…github\.com…'` 作判据，
#    仅匹配单行式；写成列表式会被整段跳过，conan 遂只能拿官方 URL 直连，
#    在受限 worker 上超时失败。单行式由 CI 自动改写为
#    [镜像 URL, 官方 URL] 列表，镜像回退统一由 CI 处理（R39：配方只写官方源）。
sources:
  url: "https://github.com/benmcollins/libjwt/archive/refs/tags/v3.3.3.tar.gz"
  sha256: "a562e5548a8e10ac6fcba64a5e6d326c15712211cb54d25242c15e8b3250b4f2"

patches:
  - patch_file: "patches/0001-cmake-fix-codegen-bash-c.patch"
    patch_description: "0001: CMakeLists codegen commands needed a properly split CMAKE_C_FLAGS list; the upstream form wrapped the preprocessor call in 'bash -c \"...\"' (quoting dropped by add_custom_command argument splitting) and passed ${CMAKE_C_FLAGS} as one argument, making the compiler see a bogus '-fPIC -O2'. Use separate_arguments() and call the compiler directly (fixes silent codegen Error 1 on OHOS)"
    patch_type: "portability"
