# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 数据来源：本机 OHOS aarch64 真机实测（2026-09-25）。逐套件日志位于
# reports/upstream_tests/（本地证据路径，被 .gitignore 忽略、不随 PR 入库）；
# 入库的逐套件计数证据见本文件下方 upstream_tests 清单与 notes.md §8/§9。
#   - 测试框架: libcheck（check/0.15.2）
#   - 注册方式: 上游 CMakeLists.txt:304-341 的 jwt_add_test()/add_test()，
#     WITH_TESTS=ON 且 pkg-config 找到 check>=0.9.10 时注册

package: libjwt3/3.3.3
homepage: "https://github.com/benmcollins/libjwt"

# 上游测试入口（CMake/CTest 工程；无 autotools 的 make check）
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# OHOS 上 ctest 不可用：上游 add_test()（CMakeLists:315）把解释器硬编码为 /bin/bash，
# 而 OHOS 根文件系统只有 /bin/sh（bash 位于 /data/service/hnp/bin/bash，非 FHS 路径）。
# 因此 build() 按 add_test() 的等价语义直接执行测试二进制：
upstream_test_command: "export TEST=<suite>; . tests/test-env.sh; exec tests/<suite>"

# 上游实际运行的测试程序（11 个 libcheck 套件；计数见 notes.md §8）
upstream_tests:
  - file: tests/jwt_crypto.c
    source: libjwt-3.3.3/tests/jwt_crypto.c
    description: "加密后端能力与算法可用性"
    command: "./tests/jwt_crypto"
  - file: tests/jwt_jwks.c
    source: libjwt-3.3.3/tests/jwt_jwks.c
    description: "JWKS 载入与 JWK 提取"
    command: "./tests/jwt_jwks"
  - file: tests/jwt_jwks_errors.c
    source: libjwt-3.3.3/tests/jwt_jwks_errors.c
    description: "非法 JWKS/JWK 的错误处理"
    command: "./tests/jwt_jwks_errors"
  - file: tests/jwt_ec.c
    source: libjwt-3.3.3/tests/jwt_ec.c
    description: "ECDSA/EdDSA（ES256/384/512、Ed25519、Ed448）签发与校验"
    command: "./tests/jwt_ec"
  - file: tests/jwt_rsa.c
    source: libjwt-3.3.3/tests/jwt_rsa.c
    description: "RSA（RS/PS 系列）签发与校验"
    command: "./tests/jwt_rsa"
  - file: tests/jwt_hs.c
    source: libjwt-3.3.3/tests/jwt_hs.c
    description: "HMAC（HS256/384/512）签发与校验"
    command: "./tests/jwt_hs"
  - file: tests/jwt_builder.c
    source: libjwt-3.3.3/tests/jwt_builder.c
    description: "builder 的 header/claim 设置与取值"
    command: "./tests/jwt_builder"
  - file: tests/jwt_checker.c
    source: libjwt-3.3.3/tests/jwt_checker.c
    description: "checker 的校验策略与回调"
    command: "./tests/jwt_checker"
  - file: tests/jwt_flipflop.c
    source: libjwt-3.3.3/tests/jwt_flipflop.c
    description: "加密后端选择与切换"
    command: "./tests/jwt_flipflop"
  - file: tests/jwt_claims.c
    source: libjwt-3.3.3/tests/jwt_claims.c
    description: "标准 claim 语义（exp/nbf/iss/aud 等）"
    command: "./tests/jwt_claims"
  - file: tests/jwt_security.c
    source: libjwt-3.3.3/tests/jwt_security.c
    description: "算法混淆/签名篡改等安全回归"
    command: "./tests/jwt_security"

# 未注册到构建的套件（如实申报，非配方裁剪）
upstream_tests_not_registered:
  - file: tests/jwt-cli.bats
    description: "命令行工具端到端用例（bats 用例）"
    reason: >-
      镜像内无 bats；上游 CMakeLists:297 用 find_program(bats) 探测，探测不到即
      不注册该测试（上游自身的优雅降级行为）。即使安装 bats，上游
      add_test(NAME jwt_cli COMMAND /bin/bash -c ...) 仍会因 OHOS 无 /bin/bash
      而无法驱动，属上游硬编码解释器问题；其端到端行为已由本配方 test_package
      （真实调用 API 与 CLI 工具）部分覆盖。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >-
      消费者功能测试：jwks_create 载入密钥集 → jwks_item_get 取 JWK →
      校验 kty/alg/key_oct → jwt_builder_new/setkey/generate 签发 HS256 →
      jwt_checker_new/setkey/verify 校验通过 → 篡改签名 / 篡改 payload /
      换密钥 / 非法令牌 / claim 策略不符 / 要求 exp 但缺失 等负样本必须失败；
      另含非法 JWK 的 jwks_error_any 检出
    command: "./test_libjwt3"
  - file: test_ohos.c
    description: >-
      鸿蒙（OHOS）平台特有测试：dlopen("libjwt.so") 验证加载器按裸 SONAME
      解析（OHOS musl 无法经版本化软链解析，E505/E274）；解析 ELF .dynamic
      段验证 DT_SONAME == "libjwt.so"（L5a 修复运行时证据）与 DT_NEEDED 含
      libjansson.so、不含 libcrypto/libssl（OpenSSL 静态链入）；
      v3 API 符号存在而 v2 的 jwt_new 已移除；4 个 CLI 工具
      经 Conan bindirs 通道可达且为合法 ELF64（R38）；/bin/sh 可执行
      （上游 add_test 硬编码 /bin/bash 的等价驱动解释器）
    command: "./test_ohos"

# 测试断言总数（上游 11 套件 + test_package 两项；
# 精确计数在 conan create 后由 notes.md §9 如实回填）
assertion_count: 147
