software: libjwt3
display: libJWT3
description: "JSON Web Token (JWT) 库 v3 系列，提供 JWS 签发/校验与 JWK/JWKS 密钥集支持"
category: crypto
homepage: https://libjwt.io
license: MPL-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游用 pkg_check_modules() 定位依赖（pkg-config），配方必须启用 PkgConfigDeps；仅 CMakeDeps 无法满足"
    - "上游 add_library(jwt SHARED)+add_library(jwt_static STATIC) 无条件产出两种库，BUILD_SHARED_LIBS 无任何分支，故不能靠该变量控制链接形态"
    - "libcheck 选临时目录优先级 TEMP > P_tmpdir > TMPDIR > 当前目录；OHOS libc 把 P_tmpdir 定义为只读 /tmp，只设 TMPDIR 无效，必须设 TEMP"
    - "上游 add_test() 硬编码解释器 /bin/bash，OHOS 根文件系统只有 /bin/sh → ctest 不可用，按 add_test() 等价语义直接执行测试二进制"
    - "CMake 缺 Modules/Platform/HarmonyOS.cmake → CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 为空（HasSOName 判据），须同时设该变量与 CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE，否则 HMDFS 无法创建版本化符号链接导致链接失败"
    - "非系统同名库（/lib、/lib64 下无 libjwt.so）：按 R26 保持默认动态链接"
  common_dependencies:
    - jansson
    - openssl

versions:
  "3.3.3":
    status: built
    build_date: "2026-09-25"
    conan_ref: "libjwt3/3.3.3"
