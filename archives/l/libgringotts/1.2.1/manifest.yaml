# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.1"

# 软件名
software: "libgringotts"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/gringotts.berlios/libgringotts-1.2.1.tar.bz2"

  # 源码校验和
  sha256: "a75e6f757b975d3da662fe7ea2d985f358f31ad2dede1a222bb4aa403d0dbfd1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/"
    - "--disable-shared"
    - "--enable-static"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libmcrypt/2.5.8
    - mhash/0.9.9.9
    - zlib/1.3.1
    - bzip2/1.0.8
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libmcrypt conan 包未携带 libmcrypt-config，recipe 在 build() 前 patch configure 绕过探测门（AutotoolsDeps 注入 MCRYPT_* 标志）"
  - "交叉编译复用 config.guess/sub 的 OHOS hook + llvm ar/ranlib/nm/ld/strip 环境变量"
  - "build() 用 self.run 输出重定向到日志文件，规避 OHOS worker 下编译器输出被静默吞掉导致假成功"
