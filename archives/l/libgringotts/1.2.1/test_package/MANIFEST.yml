# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libgringotts/1.2.1
homepage: "https://directory.fsf.org/wiki/LibGringotts"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# 上游实际运行的测试程序 (src/test.c -> libgrgtest)
# 注意: 上游 check-local 硬编码 `gcc test.c` 且需在本机运行，交叉编译下不在
# recipe 内集成运行；此处如实申报上游测试，真实验证由下方 test_package 承担。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: libgringotts-1.2.1/src/test.c
    description: "上游 make check 测试套件 (libgrgtest): 上下文创建/算法切换/密钥生成/文件加解密往返"
    command: "./libgrgtest"

# test_package 中自带的测试 (消费者视角验证，真实调用 libgringotts API)
test_package_tests:
  - file: test.c
    description: "消费者测试: grg_context_initialize_defaults + grg_key_gen + grg_encrypt_file/grg_decrypt_file 往返校验"
    command: "./test_libgringotts"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
