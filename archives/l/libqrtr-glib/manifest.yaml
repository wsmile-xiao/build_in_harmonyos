software: libqrtr-glib
display: "libqrtr-glib"
description: "GLib-based QRTR (Qualcomm Remote Processor Transport) library"
category: library
homepage: "https://github.com/linux-mobile-broadband/libqrtr-glib"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "sockaddr_storage 重定义冲突（sys/socket.h vs linux/socket.h）"
    - "需要先包含 sys/socket.h，定义 _UAPI_LINUX_SOCKET_H 防止 linux/socket.h"
    - "__packed 宏定义缺失，需手动定义"
  common_dependencies:
    - glib-2.0

versions:
  "1.4.0":
    status: built
    build_date: "2026-06-11"