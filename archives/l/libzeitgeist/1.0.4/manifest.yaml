software: libzeitgeist
version: "1.0.4"
status: built
build_date: "2026-08-29"
build_system: autotools

source:
  url: "https://launchpad.net/zeitgeist/1.0/1.0.4/+download/zeitgeist-1.0.4.tar.xz"
  sha256: "da0e11160b2a36fe6260acf62b4190e29755fd5df130818157a04883c1eb7237"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-fts"
    - "--disable-datahub"
    - "--disable-telepathy"
    - "--disable-downloads-monitor"
    - "--disable-docs"
    - "--disable-introspection"
  dependencies:
    - "glib/2.84.0.1"
    - "sqlite/3.53.3"
    - "vala/0.56.18 (build tool)"
    - "python3-rdflib/7.1.4 (build tool)"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-umask.patch"
  - "0004-ohos-no-desktopappinfo.patch"

knowledge_gained:
  - "Zeitgeist's libzeitgeist-2.0 core does not require Datahub, Telepathy, FTS, documentation, or introspection."
  - "The sqlite package has no sqlite3.pc, so the recipe supplies a generator-local pkg-config shim."

test_result:
  upstream_test_command: "make check -j1 (requires a runnable D-Bus environment)"
  upstream_test_status: "pending local OHOS Conan verification"
  consumer_test: "Zeitgeist Event and Subject API smoke test"
