software: libical3
version: 3.0.20
status: published
build_date: '2026-09-13'
build_system: cmake
source:
  url: https://codeload.github.com/libical/libical/tar.gz/refs/tags/v3.0.20
  filename: libical-3.0.20.tar.gz
  sha256: e73de92f5a6ce84c1b00306446b290a2b08cdf0a80988eca0a2c9d5c3510b4c2
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
  - -DWITH_CXX_BINDINGS=OFF
  - -DGOBJECT_INTROSPECTION=OFF
  - -DICAL_GLIB=ON
  - -DICAL_GLIB_VAPI=OFF
  - -DICAL_BUILD_DOCS=OFF
  - -DLIBICAL_BUILD_EXAMPLES=OFF
  - -DLIBICAL_BUILD_TESTING=ON
  - -DLIBICAL_BUILD_TESTING_BIGFUZZ=OFF
  - -DUSE_BUILTIN_TZDATA=ON
  - -DCMAKE_DISABLE_FIND_PACKAGE_ICU=ON
  - -DCMAKE_DISABLE_FIND_PACKAGE_BerkeleyDB=ON
  dependencies:
  - glib/2.88.3
  - libxml2/2.15.3.1
  - perl/5.42.2 (tool_requires)
  cc: clang
  cxx: clang++
patches_applied: []
in_source_edits:
- "src/libical-glib/CMakeLists.txt: CMAKE_CROSSCOMPILING 分支砍除（OHOS-on-OHOS 同架构，构建期 ical-glib-src-generator 就地构建运行）"
- "src/{libical,libicalss,libicalvcal,libical-glib}/CMakeLists.txt: 删除 VERSION/SOVERSION set_target_properties 块（OHOS 相对 soname 规则）"
test_results:
  type: conan_create_ohos_aarch64
  upstream: "passed: LIBICAL_BUILD_TESTING=ON ran the full upstream CTest set, 48/48 passed; no registered upstream tests were omitted"
  test_package: "passed: consumer linked ical/icalss/icalvcal/ical-glib via find_package(LibIcal)+PkgConfig GLib2, ran CTest 1/1, and directly verified iCalendar C API and libical-glib binding generation"
  full_reference: "libical3/3.0.20#96c61e406d3c2db4d99ab9e6dedd4b90:dc28935ec6800431699680a0d7977c3672b19cae"
knowledge_gained:
- "与 libical/4.0.1（ICAL_GLIB=OFF）差异化：本 3.0 线启用 GLib 绑定（glib/2.88.3 + libxml2/2.15.3.1），产出 libical-glib.so"
- "FindGLib/FindLibXML 走 pkg_check_modules：conan glib 包 .pc 的 prefix=/ broken 且 Requires 引用未安装 .pc 的 proxy-libintl——配方生成 pc-fix 副本（修 prefix/剥 proxy-libintl/置空 Requires.private）+ PKG_CONFIG_PATH 注入 cmake 进程"
- "pkg-config --libs-only-l 不含 -L：上游 FindLibXML 的 LIBXML_LIBRARIES 传给 target_link_libraries 时缺库路径——用 LIBRARY_PATH 环境变量补（clang/lld 认可）"
- "构建期 ical-glib-src-generator 链接 shared glib/libxml2 且就地运行：LD_LIBRARY_PATH 前置依赖包 lib（OHOS-on-OHOS 无需上游 CMAKE_CROSSCOMPILING native-import 分支）"
- "CMakeToolchain presets environment 的注入通道是 tc.presets_build_environment（基于 VirtualBuildEnv.environment() 再 prepend）；配方自身 buildenv_info 不进 presets，CMake helper 也不用 preset environment——进程内 env 用 Environment().vars().apply() 包裹 configure/build"
- "上游测试 NEEDED 相对 soname（./libical.so）：把构建 lib*.so* 复制到 CTestTestfile.cmake 所在各目录（含 bin 上溯），48/48 通过"
