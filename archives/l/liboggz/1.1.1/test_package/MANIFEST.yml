# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: liboggz/1.1.1
homepage: "https://downloads.xiph.org/releases/liboggz/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（liboggz 1.1.1 上游 make check 实测 23/23 通过）
upstream_tests:
  - file: src/tests/comment-test.c
    source: liboggz-1.1.1/src/tests/comment-test.c
    description: "注释读取测试"
    command: "./comment-test"
  - file: src/tests/io-count.c
    source: liboggz-1.1.1/src/tests/io-count.c
    description: "IO 字节计数测试"
    command: "./io-count"
  - file: src/tests/io-read-single.c
    source: liboggz-1.1.1/src/tests/io-read-single.c
