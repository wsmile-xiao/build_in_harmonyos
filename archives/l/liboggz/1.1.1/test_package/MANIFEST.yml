# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：oggz_new/oggz_close"
    command: "./test_liboggz"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 23
