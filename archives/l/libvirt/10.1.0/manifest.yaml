version: 10.1.0
status: built
build_date: 2026-05-20

# 源码信息（必填）
source:
  url: "https://libvirt.org/sources/libvirt-10.1.0.tar.xz"
  tar_format: xz
  # sha256: 未计算

# 构建信息（必填）
build:
  system: meson
  compiler: gcc
  platform: aarch64-ohos

  # 编译选项
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--buildtype=release"

  # 依赖库
  dependencies:
    - glib2
    - libxml2
    - readline
    - ncurses
    - pkg-config

# 补丁信息（按需）
patches_applied: []

# 知识提取（按需）
knowledge_gained: []

# 备注
notes: |
  libvirt 10.1.0 编译成功，使用 meson 构建系统。

  已知问题：
  - virsh 命令行工具未编译（可能需要特殊配置）
  - 部分驱动因依赖缺失而未编译

  编译产物完整，质量门禁通过（G0-G4）。