software: libvirt
display: "libvirt"
description: "Virtualization management API, daemon and tools for managing KVM, QEMU, Xen, LXC and other virtualization technologies"
category: system

homepage: "https://libvirt.org"
license: LGPL-2.1-or-later
build_system: meson

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "使用 meson 构建系统，需要 Python 3.6+ 和 ninja"
    - "依赖 glib2、libxml2、readline、ncurses 等库"
    - "需要配置正确的 cross-compilation 环境"
    - "部分驱动（qemu、lxc）需要额外依赖"
    - "virsh 工具可能需要特殊配置才能编译"
  common_dependencies:
    - glib2
    - libxml2
    - readline
    - ncurses
    - pkg-config
    - meson
    - ninja

# 版本索引（每个版本必须有 status 和 build_date）
versions:
  "10.1.0":
    status: built
    build_date: "2026-05-20"
    source_url: "https://libvirt.org/sources/libvirt-10.1.0.tar.xz"