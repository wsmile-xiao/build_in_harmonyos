# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtypec/0.6.0
homepage: "https://github.com/Rajaram-Regupathy/libtypec"

# ── 上游测试入口核验（R51 第一步：清点）──────────────────────────────
# 顶层 meson.build 只定义 library() 与 install_headers()，没有任何 test()
# 注册；全树 grep test( 计数 = 0。因此上游无自动化测试可跑。
# CMake 构建会生成 lstypec/typecstatus/ucsicontrol 三个诊断工具，但它们
# 直接遍历 /sys/class/typec，需要真实 Type-C 控制器，worker 上不可执行；
# 本配方改用 Meson，不构建这些工具。
upstream_check_command: "meson test -C build"

# conanfile.py build() 中是否已集成上游测试（上游无测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# ── 上游测试资产（存在但依赖硬件/未构建）────────────────────────────
upstream_tests:
  - file: "utils/lstypec.c"
    source: "libtypec-0.6.0/utils/lstypec.c"
    description: >
      连接器列表工具，遍历 /sys/class/typec 读取连接器/partner/cable 节点。
      需要内核 Type-C 子系统与真实硬件，worker 上不可运行；本包用 Meson
      只构建共享库，不构建该工具。
    command: "lstypec"
  - file: "utils/typecstatus.c"
    source: "libtypec-0.6.0/utils/typecstatus.c"
    description: >
      连接器状态工具，同样依赖 /sys/class/typec 与硬件；未构建。
    command: "typecstatus"
  - file: "utils/ucsicontrol.c"
    source: "libtypec-0.6.0/utils/ucsicontrol.c"
    description: >
      UCSI 控制工具，需要 UCSI 传输层与硬件；未构建。
    command: "ucsicontrol"
  - file: "utils/usbcview.c"
    source: "libtypec-0.6.0/utils/usbcview.c"
    description: >
      GTK3 图形查看器，依赖 gtk+-3.0（OHOS 无 GUI 栈）；明确不构建。
    command: "usbcview"

# ── test_package 消费者测试（含鸿蒙特有测试）─────────────────────────
test_package_tests:
  - file: test_libtypec.c
    description: >
      消费者用例 1（init/版本 smoke）：真实调用 libtypec_init()/libtypec_exit()，
      断言 init 在探测（缺失的）sysfs 后端之前已填充 session 版本串
      （"libtypec 0.6.0"）；并验证签名后的 libtypec.so 能被 OHOS 加载器加载、
      消费者可链接运行。不依赖真实 Type-C 硬件。
    command: "./test_libtypec"
  - file: test_query.c
    description: >
      消费者用例 2（查询 API 面 + 优雅降级）：链接并调用 libtypec_get_capability()
      与 libtypec_get_conn_capability(0)，验证多个导出符号可解析；在无 Type-C
      硬件的 OHOS 上库返回错误码（-1）而非崩溃/段错误——即硬件缺失时的健壮性。
      真机实测：get_capability=-1、get_conn_cap(0)=-1，进程正常退出 0。
    command: "./test_query"

# 测试断言数：用例1 版本串非空+前缀(2) + 用例2 进程不崩溃、多符号解析(2) = 4
assertion_count: 4
