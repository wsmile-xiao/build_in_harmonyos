# 版本级 manifest
# 文件位置: archives/l/libtypec/0.6.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.6.0"
software: "libtypec"
# conan create 已在 aarch64 OHOS 真机通过，test_package 运行成功；尚未 upload。
status: built
build_date: "2026-09-26"
build_system: "meson"

source:
  url: "https://deb.debian.org/debian/pool/main/libt/libtypec/libtypec_0.6.0.orig.tar.gz"
  sha256: "c4f337d142594d50e75ae55e7bb7f28d5cb348a961d468b02b62fb58c4dbf837"
  tar_format: tar.gz
  note: >
    公开 GitHub 仓库 tag 仅到 libtypec-0.5.1，0.6.0 未公开打 tag；
    使用 Debian orig tarball（未修改的上游发布包），sha256 本机实测一致。

build:
  system: meson
  configure_options:
    - "-Ddefault_library=shared"
  dependencies:
    - eudev/3.2.14
  tool_requires:
    - pkgconf/3.0.5
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 0.6.0 同时提供 meson.build 与 CMakeLists.txt；顶层 meson 只构建共享库 typec，不构建 utils（CMake 会额外构建 lstypec/typecstatus/ucsicontrol，usbcview 还依赖 gtk3），故选用 Meson 保持纯库表面、不需要 commands.json"
  - "libudev 是硬依赖（meson dependency('libudev', required:true)），仅 libtypec_sysfs_ops.c 用 udev monitor；由 eudev/3.2.14 经 PkgConfigDeps 注入 libudev.pc"
  - "公开 GitHub(Rajaram-Regupathy/libtypec) tag 最新仅 libtypec-0.5.1（main 仍 0.5.1 且无 meson.build），0.6.0 只能从 Debian orig tarball 获取"
  - "libtypec_init 在探测 sysfs 后端之前先填充 session 版本串/内核串/OS串，可作为不依赖硬件的测试断言点"
  - "OHOS 共享库需 binary-sign-tool 签名才能加载（沿用 libdvbv5 的签名流程）"
  - "待真机确认：内核 UAPI 头 <linux/usbdevice_fs.h>、<linux/usb/ch9.h>、<linux/magic.h> 是否在 OHOS NDK 中；缺失则补 0001 patch"
