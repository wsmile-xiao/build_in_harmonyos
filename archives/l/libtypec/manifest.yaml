software: libtypec
display: "libtypec"
description: "C library to interface with USB Type-C and USB Power Delivery class devices"
category: system
homepage: "https://github.com/Rajaram-Regupathy/libtypec"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 只构建共享库 typec，不构建依赖 gtk3 的 utils 工具"
    - "libudev 硬依赖由 eudev/3.2.14 经 PkgConfigDeps 注入"
    - "运行期需要 Linux Type-C sysfs，OHOS 上仅验证编译/链接/加载"
    - "OHOS 共享库需 binary-sign-tool 签名"
  common_dependencies:
    - eudev/3.2.14

versions:
  "0.6.0":
    status: draft
    build_date: "2026-09-26"
    conan_ref: "libtypec/0.6.0"
