software: lua-term
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.7"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/hoelzro/lua-term/archive/refs/tags/0.7.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "LUA_VER=5.4"
    - "PREFIX=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lua-term 使用简单 Makefile，需要调整 LUA_VER/LUA_DIR/LUA_INC 以匹配系统 Lua 安装"
  - "HMDFS 不支持 ln -s，需要用 cp 替代创建符号链接"
  - "Lua 模块需要设置 LUA_PATH/LUA_CPATH 环境变量，默认搜索路径为 /usr/local"
  - "Lua 模块的 DESTDIR 模式：PREFIX 设置安装前缀，DESTDIR 用于 staging 打包"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/lua-term-0.7.orig
  source_work_dir: /storage/Users/currentUser/builds/lua-term-0.7.work
  source_orig_hash: 2d2a389151f8136d
  source_work_hash: 92787390c539ec8a
  generated_at: '2026-06-09T11:58:18'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending'
