software: lua-term
description: A terminal manipulation library for Lua
category: library
license: MIT
homepage: https://github.com/lua-term/lua-term
versions:
  - version: 0.7
    status: built
    date: 2026-06-09
    notes: "Lua module for terminal operations, includes C binding"
dependencies:
  - lua >= 5.4
build_systems:
  - makefile
install_method: copy
files_to_install:
  - lib/lua/5.4/term/core.so
  - share/lua/5.4/term/init.lua
  - share/lua/5.4/term/cursor.lua
  - share/lua/5.4/term/colors.lua