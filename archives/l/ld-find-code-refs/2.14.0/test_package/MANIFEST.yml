# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ld-find-code-refs/2.14.0
homepage: "https://github.com/launchdarkly/ld-find-code-refs"

# 上游测试命令 (Go 项目: go test ./...)
upstream_check_command: "go test ./..."

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "go test -mod=vendor ./... (executed by recipe build() before go build; OHOS uses a go test -exec wrapper that self-signs each generated test binary; upstream ships a complete vendor/ tree so no module downloads)"

# 上游实际运行的测试程序 (Go 单元测试)
upstream_tests:
  - "go test -mod=vendor ./... — 11 *_test.go files across 9 packages (aliases, build/package/bitbucket-pipelines, build/package/github-actions, coderefs, flags, internal/git, internal/ld, internal/validation, search); 35 top-level test functions executed (8 additional func TestMain are per-package harnesses, not test cases); verbose run: 125 PASS entries (35 top-level + 90 subtests), 0 failed / 0 skipped; httptest-based local servers, no network/API key; integration test uses pure-Go go-git (no git binary execution)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "冒烟测试: --version 断言 ld-find-code-refs 2.14.0（internal/version 常量随源码烘焙）+ --help 子命令输出 + prune 空参数破坏性反向验证（cobra 参数校验必须拒绝，exit != 0）"
    command: "bash test.sh <bin/ld-find-code-refs>"

# 测试断言总数 (近似值, 用于质量评估)
test_package_assertion_count: 4
assertion_count: 129
