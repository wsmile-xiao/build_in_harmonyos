# 版本级 manifest — ld-find-code-refs 2.14.0
# 遵循 ARCHIVE-SPEC v2.0

version: "2.14.0"

software: "ld-find-code-refs"

# 编译状态: built (verify 通过未 upload)
status: built

build_date: "2026-09-26"

# 构建系统 (必填顶层字段)
build_system: go

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/launchdarkly/ld-find-code-refs/archive/refs/tags/v2.14.0.tar.gz"
  sha256: "c7e305001837e5d7b8c4e1f5dbbaea66e2e4567ff161c0039a5375fd2cf3b791"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # Go 项目，custom 构建（go build ./cmd/ld-find-code-refs，输出 ld-find-code-refs 二进制）
  system: go

  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux (OHOS)"
    - "GOARCH=arm64 (armv8)"
    - "-mod=vendor（上游自带完整 vendor/，GOPROXY=off 离线构建+测试）"
    - "go test -mod=vendor ./... → go build -trimpath -ldflags '-s -w' -buildvcs=false -o ld-find-code-refs ./cmd/ld-find-code-refs"
    - "Go 工具链 go1.26.3 (linux-amd64/linux-arm64) 自 mirrors.aliyun.com 下载，SHA256 已设备实测复核，置于模块树外"
    - "Go 缓存/临时目录/链接输出置于非 hmfs 工作区 /data/storage/el2/base/cache (E051/E134/E166)"
    - "产物与工具链 ELF 经 binary-sign-tool 自签 (E077)"

  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "ld-find-code-refs 是纯 Go CLI（Apache-2.0），无 C/C++ 目标库，属于路径 A 应用类适配"
  - "上游自带完整 vendor/：go test/go build 均加 -mod=vendor，GOPROXY=off 强制离线确定性，无需模块下载 (ref: E134)"
  - "internal/version.Version 是 Go 常量而非 var：-ldflags -X 注入对常量无效，版本号 2.14.0 随源码烘焙，烟囱断言直接匹配常量值"
  - "Go 测试二进制在 OHOS 上需 binary-sign-tool 自签后才能执行（go test -exec wrapper）(ref: E166)"
  - "Go linker mmap 在 hmdfs 上受限（E051/E134），链接输出与缓存目录放 /data/storage/el2/base/cache 非 hmfs 工作区 (ref: E051, E134, E166)"
  - "上游测试 11 文件/9 包 43 个 func Test，httptest 本地服务器无网络依赖；git 集成测试用 go-git 纯 Go 实现，git 二进制仅 exec.LookPath 探测（设备 git 2.45.2 满足运行期依赖 git>=2.21）"

