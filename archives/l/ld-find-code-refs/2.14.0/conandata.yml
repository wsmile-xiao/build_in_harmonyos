# conandata.yml — ld-find-code-refs 2.14.0
# Source: official GitHub archive for release tag v2.14.0（与 codeload
# .../tar.gz/refs/tags/v2.14.0 字节一致：12167167 字节，SHA256 相同，双端实测）。
# R39: URL points to the official upstream distribution. CI 会自动为 GitHub URL
# 添加镜像 fallback，因此这里只写官方原始 URL，不要手动加镜像前缀。
# 注意：URL 必须以 .tar.gz 结尾——conan get() 按扩展名选择解压器，
# codeload 形态的 URL 尾段为 v2.14.0 会被误判为 zip（BadZipFile）。

sources:
  url: "https://github.com/launchdarkly/ld-find-code-refs/archive/refs/tags/v2.14.0.tar.gz"
  sha256: "c7e305001837e5d7b8c4e1f5dbbaea66e2e4567ff161c0039a5375fd2cf3b791"

patches: {}

build:
  main: "./cmd/ld-find-code-refs"
  binary: "ld-find-code-refs"
  # internal/version.Version 是 Go 常量（const Version = "2.14.0"），
  # -ldflags -X 对常量无效且无必要，版本号随源码烘焙；与上游 Makefile 一致用 -s -w。
  ldflags: "-s -w"

# go.mod: go 1.24 / toolchain go1.24.1 → 本地 GOTOOLCHAIN=local 需要 >= 1.24.1 的工具链。
# go1.26.3 linux-arm64 SHA256 已在 OHOS 设备实测复核（sha256sum == 下列值）。
go_toolchain:
  version: "1.26.3"
  linux-amd64:
    url: "https://mirrors.aliyun.com/golang/go1.26.3.linux-amd64.tar.gz"
    sha256: "2b2cfc7148493da5e73981bffbf3353af381d5f93e789c82c79aff64962eb556"
    filename: "go1.26.3.linux-amd64.tar.gz"
  linux-arm64:
    url: "https://mirrors.aliyun.com/golang/go1.26.3.linux-arm64.tar.gz"
    sha256: "9d89a3ea57d141c2b22d70083f2c8459ba3890f2d9e818e7e933b75614936565"
    filename: "go1.26.3.linux-arm64.tar.gz"
