# 软件级 manifest — ld-find-code-refs
# 遵循 ARCHIVE-SPEC v2.0

software: ld-find-code-refs

display: "ld-find-code-refs"

description: "LaunchDarkly 官方 CLI，扫描代码库查找 feature flag 引用并上报（纯 Go）"

# 分类标签
category: developer-tool

# 官网 URL
homepage: "https://github.com/launchdarkly/ld-find-code-refs"

# 开源许可证（SPDX 标识）
license: Apache-2.0

# 常用构建系统
build_system: go

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Go 应用（CGO_ENABLED=0），无 C/C++ 目标库"
    - "上游自带完整 vendor/，-mod=vendor + GOPROXY=off 离线构建与测试"
    - "Go 工具链与产物均需 binary-sign-tool 自签（Seccomp 拦截未签名 ELF）"
    - "Go 缓存/链接输出/测试工作目录放在非 hmfs 工作区（/data/storage/el2/...）"
    - "版本号是 internal/version 包中的 Go 常量，随源码烘焙，无需 ldflags -X 注入"
    - "运行期依赖 git>=2.21（PATH 中需有 git，exec.LookPath 探测）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  2.14.0:
    status: built
    build_date: 2026-09-26
