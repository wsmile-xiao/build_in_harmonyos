# 软件级 manifest
# 文件位置: archives/l/libtirpc/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: libtirpc

display: "libtirpc"

description: "TI-RPC (Transport Independent RPC) library - 提供现代的RPC实现，支持TCP和UDP传输协议"

category: library

homepage: "https://sourceforge.net/projects/libtirpc/"

license: BSD-3-Clause

build_system: autotools

ohos_adaptation:
  key_points:
    - "HMDFS文件系统不允许在当前目录创建临时子目录，需在/data/storage/el2/base编译"
    - "aclocal-1.16脚本shebang指向错误perl路径，需创建perl符号链接"
    - "GSS-API为可选依赖，可使用--disable-gssapi禁用"
  
  common_dependencies:
    - pthread

versions:
  "1.3.3":
    status: built
    build_date: "2026-05-22"