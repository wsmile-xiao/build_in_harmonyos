software: libtirpc
version: 1.3.7
status: built
build_date: 2026-08-22
build_system: autotools

configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - --disable-gssapi

dependencies:
  - pthread

build_artifacts:
  - libtirpc.so.3.0.0
  - libtirpc.a

install_prefix: /storage/Users/currentUser/usr/local

notes: |
  libtirpc 1.3.7 适配编译
  1. config.guess/config.sub 添加 HarmonyOS/OHOS 支持
  2. 使用 --disable-gssapi 禁用 GSS-API 功能
  3. HMDFS 文件系统 umask 问题需在 config.status 中修复
  4. INSTALL 文件为绝对路径符号链接，需手动创建

knowledge_gained:
  - HMDFS 临时文件权限问题 (umask 077)
  - config.guess HarmonyOS 支持
  - libtirpc 可选 GSS-API 依赖
