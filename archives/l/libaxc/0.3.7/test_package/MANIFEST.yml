package: libaxc/0.3.7
homepage: "https://github.com/gkdr/axc"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - file: test/test_store.c
    source: axc-0.3.7/test/test_store.c
    description: "cmocka store suite: 36 unit tests for axc_store/axc_crypto"
    command: "make test_store"
  - file: test/test_client.c
    source: axc-0.3.7/test/test_client.c
    description: "cmocka client suite: 13 unit tests for axc encrypt/decrypt"
    command: "make test_client"

test_package_tests:
  - file: test.c
    description: "context lifecycle: create/set_db_fn/get_db_fn/destroy"
    command: "test_axc context"
  - file: test.c
    description: "buffer helpers: buf_create/get_data/get_len and list item"
    command: "test_axc buf"

assertion_count: 12
