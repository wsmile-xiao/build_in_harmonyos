# test_package/MANIFEST.yml
package: libplayerone/3.1.0
homepage: "https://libplayerone.org/"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
# 上游测试清点: libplayerone 3.1.0 (Player One Astronomy 官方 SDK) 是厂商
# 预编译二进制包——上游源码树仅含头文件 PlayerOneCamera.h、各架构厂商
# .bin、CMakeLists.txt (install_imported 安装规则) 与 udev 规则, 无
# 编译型源码, 无 tests/ 目录, 无 check/test 构建目标。厂商 .so 为闭源
# 二进制, 需物理 POA 相机经 USB 连接才能运行, 无法自动化测试。
# 证据: tar tzf 上游 tarball → 仅 .h/.bin/.rules/CMakeLists.txt/license
#   与 spec/debian 打包文件; CMakeLists 仅 add_library(... SHARED IMPORTED)
#   + install_imported, 无 add_test/enable_testing。

upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "头文件检验: PlayerOneCamera.h 已打包, 声明 POAGetAPIVersion/POAGetCameraCount/POAGetCameraName 核心 API 且使用 POACAMERA_API 导出宏"
    command: "conan test archives/l/libplayerone/3.1.0/test_package libplayerone/3.1.0"
  - file: conanfile.py
    description: "厂商 .so ELF 检验: libPlayerOneCamera.so.3 为 ELF64 AArch64 DYN, SONAME 与文件名一致, NEEDED libusb-1.0.so.0, 导出 POAGetAPIVersion/POAGetCameraCount/POAGetCameraName/POCOpenCamera"
    command: "conan test archives/l/libplayerone/3.1.0/test_package libplayerone/3.1.0"
  - file: lpo_probe.c
    description: "下游链接实质测试: OHOS clang 交叉编译 lpo_probe.c (真实引用头文件 API), 链接包内厂商 .so 生成 .so, 断言产物含 NEEDED libPlayerOneCamera.so.3 且导出 lpo_probe_version (R34 下游可用性证明)"
    command: "conan test archives/l/libplayerone/3.1.0/test_package libplayerone/3.1.0"

# 鸿蒙特有测试 (HarmonyOS-specific)：厂商闭源 .so 无法执行，鸿蒙侧验证 =
# 证明产物在 HarmonyOS aarch64 下游构建中真实可用。以下断言全部针对
# OHOS 目标平台（--target=aarch64-linux-ohos），非 glibc Linux 下可满足：
#   B1 厂商 .so 为 AArch64 ELF (llvm-readelf -h, OHOS 目标架构)
#   B2 头文件声明的 4 个核心 API 在厂商 .so 符号表全部导出 (llvm-nm -D)
#   B3 OHOS clang 交叉编译下游探针 lpo_probe.c 成功 (OHOS 目标工具链)
#   B4 探针与厂商 .so 链接成功, 产物含 NEEDED libPlayerOneCamera.so.3 (OHOS 下游可链接)
#   B5 探针导出 lpo_probe_version (OHOS 下游可消费)
# 上述 B1-B5 在 test_package/conanfile.py test() 内执行
# (对应断言 9-11, 14-17, 18-21 共 11 项)
harmonyos_specific_tests:
  - file: conanfile.py
    description: "鸿蒙特有测试 B1: 厂商 .so ELF64 AArch64 DYN (OHOS 目标架构校验)"
    command: "conan test archives/l/libplayerone/3.1.0/test_package libplayerone/3.1.0"
    assertion_count: 3
  - file: conanfile.py
    description: "鸿蒙特有测试 B2: 4 个核心 API 符号全部由厂商 .so 导出"
    command: "conan test archives/l/libplayerone/3.1.0/test_package libplayerone/3.1.0"
    assertion_count: 4
  - file: lpo_probe.c
    description: "鸿蒙特有测试 B3-B5: OHOS clang 交叉编译 + 链接下游探针 + NEEDED/导出符号校验"
    command: "conan test archives/l/libplayerone/3.1.0/test_package libplayerone/3.1.0"
    assertion_count: 4

# 断言总数 21 = 头文件检验 6 + 厂商 .so 打包文件/SONAME/NEEDED 检验 4 + 鸿蒙特有 B1-B5 11
assertion_count: 21
