# 版本级 manifest — libplayerone 3.1.0
# 遵循 ARCHIVE-SPEC v2.0 (交叉校验元数据；CI 唯一构建输入是 conanfile.py)

version: "3.1.0"
software: "libplayerone"

# 编译状态: published | built | failed | archived
status: built

# 编译日期
build_date: "2026-09-17"
build_system: install-imported

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://salsa.debian.org/debian-astro-team/libplayerone/-/archive/upstream/3.1.0+20221218103507/libplayerone-upstream-3.1.0+20221218103507.tar.gz"
  sha256: "133dc960e3549654720b93b6316bc5898598ab37ee163ba8cbe129566ecf2b63"
  tar_format: tar.gz
  note: "Player One Astronomy 官方 SDK 3.1.0 (2022-12-18 10:35:07 构建) 的上游快照; 含各架构厂商预编译 .bin + 头文件 + udev 规则。备选: cica 镜像的 Debian .orig (当前下载损坏 inflate EOF, 未采用); GitHub indilib/indi-3rdparty 的 libplayerone/ 子目录 (无 tag, .bin 为 git-lfs 指针)"

# ============================================================
# 构建配置
# ============================================================

build:
  system: install-imported
  # 说明: 上游无编译型源码; CMakeLists 仅 add_library(... SHARED IMPORTED)
  # + install_imported。配方按同一安装语义交付 armv8/aarch64 厂商库
  targets:
    - "lib/libPlayerOneCamera.so.3 (厂商预编译 aarch64 共享库, SONAME libPlayerOneCamera.so.3)"
    - "lib/libPlayerOneCamera.so (符号链接, 供 -lPlayerOneCamera 链接解析)"
    - "include/libplayerone/PlayerOneCamera.h (公共头文件)"
    - "lib/udev/rules.d/99-player_one_astronomy.rules (USB 设备 udev 规则)"
  dependencies:
    - "libusb/1.0.27 (run-only; 厂商 .so NEEDED libusb-1.0.so.0)"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libplayerone 是纯安装型预编译包: 厂商闭源 .bin 按架构分发 (i386/armhf/arm64/armv8/ppc64el/s390x), 上游 CMake 仅 IMPORTED 安装, 无任何构建目标; 配方按 install_imported 语义重命名 .bin 为其 SONAME (libPlayerOneCamera.so.3) 并建 -l 符号链接"
  - "厂商 .so NEEDED libusb-1.0.so.0: 声明 run=True 依赖 (不参与包构建, 仅运行时解析); ohpcd 注册表已有 libusb/1.0.27, L0i 通过"
  - "CI 沙箱禁止 dlopen 外部 .so (mmap PROT_EXEC denied, 改名 .so + 755 权限仍拒): 厂商库无法运行时测试; 且厂商库需物理 POA 相机经 USB 连接; test_package 改为下游消费验证 —— 头文件编译 + ELF/SONAME/NEEDED/符号静态校验 + OHOS clang 真实下游链接 (R34), 外部命令全部经 conan self.run 执行 (L0d)"
  - "package_id 剔除 compiler/build_type (预编译二进制与构建工具链无关), 仅 arch 影响包内容; validate() 拒绝 shared=False 与非 armv8 架构 (厂商只发 aarch64 二进制)"
  - "salsa tag tarball 偶发 429 限流 (瞬态, 重试即 200); conan create 内置下载器不受本容器 subprocess PATH 失效影响 (用 urllib 而非 curl)"
