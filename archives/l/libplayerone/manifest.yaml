software: libplayerone
display: "libplayerone"
description: "Player One Astronomy 天文相机 SDK：厂商预编译共享库 + 公共头文件，USB 访问 POA/ONE/ZWO 天文相机"
category: library
homepage: "https://libplayerone.org/"
license: MIT
build_system: install-imported

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "上游无可编译源码: 厂商按架构预编译的闭源 .bin (SONAME libPlayerOneCamera.so.3) + 自包含头文件 PlayerOneCamera.h + udev 规则; 上游 CMakeLists 仅 add_library(... SHARED IMPORTED) + install_imported, 无任何构建目标"
    - "配方按上游 CMake install_imported 语义安装: 复制 armv8 厂商 .bin 并重命名为其自身 SONAME 名 (libPlayerOneCamera.so.3), 建 -lPlayerOneCamera 符号链接, 头文件装到 include/libplayerone/"
    - "厂商 .so NEEDED libusb-1.0.so.0: 声明为 run=True 依赖 (仅运行时需要, 不参与包构建); ohpcd 注册表已有 libusb/1.0.27"
    - "CI 沙箱禁止 dlopen 外部 .so (mmap PROT_EXEC 被拒), 且厂商库需物理相机经 USB 连接: test_package 用下游消费方式验证 —— 头文件编译 + ELF 头/SONAME/NEEDED/导出符号校验 (llvm-readelf/llvm-nm, 全部经 conan self.run 执行) + 真实下游链接 (OHOS clang --target=aarch64-linux-ohos 编译引用核心 API 的探针并链接厂商 .so)"
    - "package_id 剔除 compiler/build_type (预编译二进制与构建工具链无关), 仅 arch 影响包内容; validate() 拒绝 shared=False 与非 armv8 架构 (厂商只发 aarch64)"
  common_dependencies:
    - "libusb/1.0.27 (run-only, 厂商 .so NEEDED libusb-1.0.so.0)"

# 版本索引
versions:
  "3.1.0":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libplayerone/3.1.0"
