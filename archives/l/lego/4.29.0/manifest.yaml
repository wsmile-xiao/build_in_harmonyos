software: lego
build_system: custom
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.29.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.29.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/go-acme/lego/archive/refs/tags/v4.29.0.tar.gz"

  # 源码校验和
  sha256: "58686e310d0952f150d600e8841cbdd7513fdab05f94b8e18b214d9f68c6721"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "go build -trimpath -ldflags '-X \"main.version=v4.29.0\"' -o dist/lego ./cmd/lego/"
  # Go项目：使用 go build 编译，CGO_ENABLED=0 静态编译

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "go/1.26.4"
  # Go 工具链是主要构建依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
