  test_cases_failed: 0
  pass_rate: "100%（模块关联 146/146；其余 5121 为非本模块测试，PR 正文逐类定性）"
  evidence: "conan create build 阶段构建并真机执行，test_results/upstream_tests_summary.txt（arena_promise 6/arena 28/basic_work_queue 7/factory 3/filter 15/memory_quota 20/party 25/resource_quota 1/thread_pool 12/uri 29）"

