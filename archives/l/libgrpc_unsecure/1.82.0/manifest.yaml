# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "1.82.0"
software: libgrpc_unsecure
# published | built | failed | archived
status: built
build_system: cmake
build_date: "2026-09-18"

source:
  url: "https://github.com/grpc/grpc/archive/refs/tags/v1.82.0.tar.gz"
  sha256: "d6851f59b9c4edb3218d2659a3abf1138e5bb4d2871c9e89c9330ed71756ed0b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DgRPC_ABSL_PROVIDER=package"
    - "-DgRPC_CARES_PROVIDER=package"
    - "-DgRPC_PROTOBUF_PROVIDER=package"
    - "-DgRPC_RE2_PROVIDER=package"
    - "-DgRPC_SSL_PROVIDER=package"
    - "-DgRPC_ZLIB_PROVIDER=package"
    - "-DgRPC_BUILD_CODEGEN=ON"
    - "-DgRPC_BUILD_TESTS=ON"
    - "-DgRPC_INSTALL=OFF"
    - "-DGPR_NO_PTHREAD_CANCEL=1"
    # cmake --build --target 收敛（unsecure 闭包 15 目标）见 conanfile.py _TARGETS
  dependencies:
    - abseil-cpp/20260107.1
    - protobuf/33.6
    - c-ares/1.34.6
    - re2/2024-04-01
    - openssl/3.5.6
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-thd-pthread-cancel.patch"
  - "0002-abseil-cpp-cmake-alias.patch"
  - "0003-cares-cmake-target.patch"
  - "0004-ssl-cmake-target.patch"
  - "0005-tmpfile-tmpdir.patch"
  - "0006-zlib-cmake-target.patch"

knowledge_gained:
  - "grpc 1.82 相对 1.70 的 absl 组件引用新增 die_if_null/charset/fixed_array/log_entry/log_sink/log_sink_registry/strings_internal/overload/variant 等，0002 alias 补丁组件清单需同步扩充否则 cmake configure 期 target not found"
  - "grpc 模块拆分件范式：复用主件构建体系 + cmake --build --target 收敛闭包 + gRPC_INSTALL=OFF 手动打包（上游 install 脚本要求全量 target 存在）"
  - "protobuf/33.6 cmake_find_mode=none：下游 package_info 需 cmake_find_mode=none 并让消费者手动链接（CMakeDeps config 会生成悬空 protobuf::protobuf 引用）"
  - "grpc release tarball 的测试支撑子模块（googletest/cel-spec/googleapis/xds/opencensus-proto/protoc-gen-validate/envoy-api）全为空，gRPC_BUILD_TESTS=ON 需按 v1.82.0 pin commit 下载填充（conandata 多源声明 + source() shutil.move 进 third_party 槽位）"
  - "grpc 上游测试 target 只链 grpc_test_util_unsecure 不显式链 zlib（依赖全量构建时的闭包传导）——拆分构建时 cmake/zlib.cmake 的 FindZLIB target 与 CMakeDeps zlib::zlib 不通，需补丁桥接（0006）"

