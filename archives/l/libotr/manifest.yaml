software: libotr
display: "libotr"
description: "Off-the-Record Messaging library for private conversations"
category: crypto
homepage: "https://otr.cypherpunks.ca"
license: LGPL-2.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要 config.guess/config.sub 平台识别补丁"
    - "configure 中 umask 077 需改为 umask 022"
    - "FORTIFY_SOURCE 符号缺失需禁用"
    - "tests/regression 编译失败，但不阻塞主库发布"
  common_dependencies:
    - libgcrypt

versions:
  "4.1.1":
    status: built
    build_date: "2026-06-11"