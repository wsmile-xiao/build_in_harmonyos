software: lustache
display: "Lustache"
description: "Mustache templating for Lua - a pure Lua implementation of the Mustache templating standard"
category: lua-library
homepage: "http://olivinelabs.com/lustache/"
license: MIT
build_system: custom

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "纯 Lua 库，无 C 代码编译"
    - "需要手动创建 Makefile 以支持 DESTDIR 安装模式"
    - "安装路径: ~/usr/local/share/lua/5.4/"
  common_dependencies:
    - lua >= 5.1

# 版本索引
versions:
  "1.3.1-0":
    status: built
    build_date: "2026-06-15"