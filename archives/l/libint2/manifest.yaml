# 软件级 manifest
# 文件位置: archives/l/libint2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0 / templates/manifest-software.yaml

software: libint2

display: "Libint2"

description: "A library for the evaluation of molecular integrals of many-body operators over Gaussian functions"

# 基础科学计算库
category: foundation

homepage: "https://github.com/evaleev/libint"

license: LGPL-3.0-or-later

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "使用上游 Release 的 exported library tarball（kernel 源码预生成）；GitHub tag 源码树走 autotools 且需先构建 libint 编译器（GMP/Boost），耗时数小时，勿用于适配"
    - "上游测试可执行文件需 -static-libstdc++（OHOS clang 默认动态链 libc++_shared.so，该库只在 SDK sysroot），否则 ctest 的 run 类用例全挂"
    - "上游 libint2.pc 由 autotools 模板经 CMake configure_file(@ONLY) 渲染，前缀/版本为空，需在 package() 用 ${pcfiledir} 重写"
    - "产物名 int2（ARCHIVE_OUTPUT_NAME）≠ 包名 libint2 → cpp_info.libs 必须写 int2"
    - "基组数据靠编译期宏 DATADIR/环境变量 LIBINT_DATA_PATH 定位 → package_info() 需补 DATADIR define，否则按名加载静默得到空基组"
  common_dependencies:
    - eigen

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.7.2":
    status: built
    build_date: "2026-09-13"
    packaging: conan
    notes: "conan 配方（os=OHOS arch=armv8 clang 15）；上游 ctest 12/12（含 unit 17 case / 2,104,689 断言）与 4 个消费者入口（38 断言）全部真实执行通过；产静态库 libint2.a + 基组数据 + CMake/pkg-config 双消费契约"

latest_version: "2.7.2"
