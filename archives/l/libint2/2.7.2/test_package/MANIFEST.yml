# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libint2/2.7.2
homepage: "https://github.com/evaleev/libint"

# 上游测试命令（用于 ctest -N 分析）：上游 CMakeLists.txt 注册 12 个 CTest 用例，
# 另有 `check` 自定义目标 = `ctest -V -R "libint2/"`
upstream_check_command: "ctest --output-on-failure -R libint2/"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -R libint2/"

# 上游实际运行的测试程序（ctest 12 项 = 4 个构建 fixture + 8 个运行用例）
upstream_tests:
  - file: tests/eri/test.cc
    source: libint-2.7.2/tests/eri
    description: "ERI kernel 测试：5 个运行用例 (eritest run0..run4)，逐壳层对比 (ss|ss)…(dd|dd) 解析参考值"
    command: "./eritest-libint2 0 2 && ./eritest-libint2 1 1 … ./eritest-libint2 4 1"
  - file: tests/unit/test.cc
    source: libint-2.7.2/tests/unit
    description: "Catch2 单元测试：17 个 test case / 2,104,689 断言（1-body、2-body、基组、C API、壳层序、精度等）"
    command: "./unit_tests-libint2"
  - file: tests/hartree-fock/hartree-fock.cc
    source: libint-2.7.2/tests/hartree-fock
    description: "H2O/STO-3G Hartree-Fock 积分流水线；输出能量与参考值 -74.942080057696 对比（tol 1e-11）"
    command: "./hf-libint2 h2o.xyz"
  - file: tests/hartree-fock/hartree-fock++.cc
    source: libint-2.7.2/tests/hartree-fock
    description: "H2O（旋转坐标）Hartree-Fock C++ API 流水线 + 校验脚本"
    command: "./hf++-libint2 h2o_rotated.xyz"

# test_package 中自带的消费者测试（4 个独立入口，唯一入口计数）
test_package_tests:
  - file: test_package.cpp
    description: "C++ API：BasisSet + Engine 计算 H2O/STO-3G 重叠矩阵与库仑积分，校验归一化/对称性/置换对称性/宇称零元/Schwarz（9 断言）"
    command: "./test_package"
  - file: test_c_api.c
    description: "C ABI：libint2_build_* 内核分发表、need_memory 单位与单调性、调用方 buffer 的 init/cleanup 契约（17 断言）"
    command: "./test_c_api"
  - file: test_basis.cpp
    description: "基组数据库：sto-3g/6-31g*/cc-pvdz/aug-cc-pvdz 按名加载 + 未知名默认空基组 / strict 抛异常且信息含数据目录（11 断言）"
    command: "./test_basis"
  - file: test_pkgconfig.c
    description: "pkg-config 消费契约：用安装出来的 libint2.pc 的 --cflags/--libs 真实编译并运行（对 .pc 重写的回归守卫）"
    command: "clang $(pkg-config --cflags libint2) test_pkgconfig.c -o ... $(pkg-config --libs libint2) && ./test_pkgconfig"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2104689
