software: libint2
# 版本级 manifest
# 文件位置: archives/l/libint2/2.7.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.7.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-13"

# 构建系统 (top-level for manifest checker)
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方 GitHub Release 资产：预生成库 tarball）
  url: "https://github.com/evaleev/libint/releases/download/v2.7.2/libint-2.7.2.tgz"

  # 源码校验和
  sha256: "a7306f1998a4c0a0babc13d480c62de2631674918e3562c78fb602c77efe0b94"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 质量门禁要求字段
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DREQUIRE_CXX_API=ON"
    - "-DENABLE_FORTRAN=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - eigen/3.4.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 release 资产 libint-2.7.2.tgz 是 exported library（kernel 源码已生成），无需 GMP/MPFR/Boost 编译器依赖；GitHub 仓库 master 的 autotools 编译器构建路径不适用于适配"
  - "CMake 的 find_package(Boost 1.29) 未命中时上游会用包内 external/boost.tar.gz（Boost.Preprocessor），并把 include/libint2/boost 一起安装，因此不必引入 boost 依赖"
  - "上游静态库输出名是 int2（ARCHIVE_OUTPUT_NAME int2）→ cpp_info.libs 必须写 int2 而不是 libint2"
  - "按名加载基组（BasisSet(\"sto-3g\", atoms)）依赖编译期宏 DATADIR（或环境变量 LIBINT_DATA_PATH），需在 package_info() 中定义 DATADIR=<pkg>/share/libint/2.7.2"
  - "上游测试经 CTest 注册（libint2/eritest、libint2/unit、libint2/hf、libint2/hf++），test 可执行文件为 EXCLUDE_FROM_ALL，ctest 会先经 fixture 构建再运行"
  - "CMake 4.1.2 会把 HarmonyOS host 报告为未知系统（Platform/HarmonyOS 缺失），仅打印提示，不影响配置与构建"

# ============================================================
# 测试信息（R51 上游测试三步法）
# ============================================================

tests:
  upstream_tests_discovered: true
  upstream_tests_count: 12
  upstream_tests_note: >
    上游 CMakeLists.txt 通过 CTest 注册 12 个用例（4 个 build fixture + 8 个 run）：
    libint2/eritest/{build,run0..run4}、libint2/unit/{build,run}、
    libint2/hf/{build,run}、libint2/hf++/{build,run}；
    另有 `check` 自定义目标 = `ctest -V -R "libint2/"`。
    测试源码：tests/eri/test.cc、tests/unit/test.cc（Catch2，17 case / 2,104,689 断言）、
    tests/hartree-fock/hartree-fock{++,}.cc（能量与参考值 -74.942080057696 校验，tol 1e-11）。
  upstream_tests_command: "ctest --output-on-failure -R libint2/"
  upstream_tests_executed: 12
  upstream_tests_passed: 12
  upstream_tests_failed: 0
  upstream_tests_skipped: 0
  upstream_tests_modified: 0
  added_consumer_entries: 4
  added_consumer_entries_note: >
    test_package 新增 4 个独立消费者入口（唯一入口计数）：
    ① test_package.cpp  C++ API（重叠矩阵/库仑积分，9 断言）
    ② test_c_api.c      C ABI（内核分发表/内存查询/生命周期，17 断言）
    ③ test_basis.cpp    基组数据库（4 个基组按名加载 + 2 个负向断言，11 断言）
    ④ test_pkgconfig.c  pkg-config 消费契约（用安装的 libint2.pc 真实编译运行）
  added_consumer_passed: 4
  added_consumer_failed: 0
  consumer_test: >
    test_package 的 4 个入口在 conan create 的 test 阶段全部真实执行（不替代上游测试统计）。

# ============================================================
# 知识库扩展（立项类型：知识库扩展）
# ============================================================

knowledge_reuse:
  - E480（header-only 依赖用 transitive_headers=True 传递头文件）
  - E216（CMakeDeps 不传播依赖 include → 消费者编译失败）
  - E092（CMake 不识别 HarmonyOS host 平台）
  - E247（上游 .pc 元数据不完整，同类问题）
  - DRAFT-boost184-component-pack-static-libcxx-testbin（OHOS libc++_shared.so 加载失败 → -static-libstdc++，本次复用不重复入库）

knowledge_added:
  - DRAFT-libint2-2.7.2-upstream-pc-template-unrendered-by-cmake（上游 .pc 模板经 CMake 渲染后前缀/版本为空）
  - DRAFT-libint2-2.7.2-cpp-info-libs-must-use-upstream-output-name（cpp_info.libs 必须用产物名）
  - DRAFT-libint2-2.7.2-compile-time-datadir-macro-for-runtime-data（运行期数据目录靠编译期宏定位，须补 define）

# ============================================================
# 产物信息
# ============================================================

# 无独立打包产物：制品由 CI release 流水线的 conan upload 生成
# （本地 conan create 已生成包缓存，release tar.gz 由 CI 产出）
