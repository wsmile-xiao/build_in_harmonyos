# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libcdio/2.3.0
homepage: "https://www.gnu.org/software/libcdio/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/driver/
    source: libcdio-2.3.0/test/driver/
    description: "上游 driver 测试：16 个用例，9 PASS、7 SKIP、0 FAIL"
    command: "make -C test/driver check"
  - file: test/
    source: libcdio-2.3.0/test/
    description: "上游核心测试：24 个用例，19 PASS、4 SKIP、1 XFAIL、0 FAIL"
    command: "make -C test check"
  - file: example/
    source: libcdio-2.3.0/example/
    description: "上游 example 测试：8 个用例，3 PASS、5 SKIP、0 FAIL"
    command: "make -C example check"

upstream_test_total: 48
upstream_test_passed: 31
upstream_test_skipped: 16
upstream_test_xfail: 1
upstream_test_failed: 0
upstream_test_pass_rate: "31/31 executed (100%); 0 failed; 16 skipped; 1 expected failure"
upstream_test_note: "SKIP 为无光驱/设备相关用例；testassert 为上游预期失败。所有可执行的非 SKIP/XFAIL 用例均通过。"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试"
    command: "./test_libcdio"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3

test_package_test_count: 1
test_package_test_passed: 1
test_package_test_failed: 0
test_package_test_pass_rate: "1/1 (100%)"
