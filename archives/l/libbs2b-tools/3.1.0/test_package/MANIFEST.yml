# test_package/MANIFEST.yml
# libbs2b-tools ships only the two upstream drivers; libbs2b has no test suite
# of its own (the top level Makefile.am defines no TESTS target, `make check`
# is a no-op), so test_package/test.sh is the only automated verification.
package: libbs2b-tools/3.1.0
homepage: "https://sourceforge.net/projects/bs2b/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# R34: the test_package must actually invoke the tested binaries.
test_package_tests:
  - file: test.sh
    description: >-
      端到端: ①两个工具都在 PATH 上；②两个工具的 --version/--help 退出码契约
      （补丁 0003 的回归守卫）；③用 Python 标准库 wave 现场生成 16bit/44.1kHz
      立体声 WAV，跑 bs2bconvert 后断言输出非空、输入输出都可解码为 16bit 立体声、
      采样率不变、帧数不变、样本确实被 crossfeed 改写；④把 16 KiB 原始 PCM 灌进
      bs2bstream，断言长度不变而内容被改写；⑤用不存在的输入文件作反例，断言
      bs2bconvert 以非 0 退出
    command: "bash test.sh"

# Assertion count is self-reported by test.sh on its last-but-one line
# ("[test] N/N assertions passed"). The script cross-checks the bash-side counter
# against a ledger file appended to by its Python blocks and FAILS if they
# disagree, so this number cannot drift away from the script the way a hard-coded
# claim can. 13 = 1 (PATH) + 4 (version/help x2 tools) + 5 (WAV conversion)
#        + 2 (PCM stream) + 1 (missing-input negative control)
assertion_count: 13
assertion_count_source: "self-reported by test.sh; bash counter cross-checked against Python-appended ledger"