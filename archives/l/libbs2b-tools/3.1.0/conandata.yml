# conandata.yml - libbs2b-tools 3.1.0
# 上游: https://sourceforge.net/projects/bs2b/ (libbs2b 3.1.0, 2009-08-31)
# 与 archives/l/libbs2b/3.1.0 同一份源码 tarball。
# 注意: config.guess / config.sub 不打补丁 —— 本包必须 autoreconf 重建 configure,
# 重建会用 automake 自带的 aux 脚本覆盖 build-aux/, 所以两个脚本改为随配方携带
# (support/), 在 autoreconf 之后覆盖回去, 见 conanfile.py 的 _restore_config_helpers()。
sources:
  url: "https://downloads.sourceforge.net/project/bs2b/libbs2b/3.1.0/libbs2b-3.1.0.tar.gz"
  sha256: "6aaafd81aae3898ee40148dd1349aab348db9bfae9767d0e66e0b07ddd4b2528"

patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: >-
      libsndfile 由硬依赖改为可选：上游 PKG_CHECK_EXISTS([sndfile], [],
      [AC_MSG_ERROR(Please install libsndfile.)]) 在没有 sndfile.pc 时直接终止
      configure，连 bs2bstream 都产不出来；改为 HAS_SNDFILE + AM_CONDITIONAL，
      并用 `pkg-config --libs --static` 取静态 libsndfile 的 -lm。
      同时把废弃的 AC_PROG_LIBTOOL 换成 LT_INIT、移除 dist-lzma，
      否则现代 automake/autoconf 下 autoreconf 会失败
    patch_type: "portability"
  - patch_file: "patches/0002-src-Makefile.am.patch"
    patch_description: >-
      bs2bconvert 改为按 HAVE_SNDFILE 条件编译；上游把 -lsndfile 硬编码进
      bs2bconvert_LDFLAGS（绕过 pkg-config），交叉编译拿不到 libsndfile 的 -L
      搜索路径，改为放进 LDADD 的 @SNDFILE_LIBS@，并补 @SNDFILE_CFLAGS@
      （bs2bconvert.c 需要 #include <sndfile.h>）
    patch_type: "portability"
  - patch_file: "patches/0003-src-cli-version-help.patch"
    patch_description: >-
      bs2bstream / bs2bconvert 只按 argv[i][1] 认单字符选项，--version 与
      --help 都会掉进 default 分支打印用法并 return 1，-h 本身也是 return 1
      -> 平台 L2 冒烟（先 --version 再回退 --help，都要求退出 0）必然 FAIL。
      补 --version/-V（退出 0）与 --help（退出 0）
    patch_type: "portability"