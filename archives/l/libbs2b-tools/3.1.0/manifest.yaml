# 版本级 manifest - libbs2b-tools 3.1.0
# 遵循 ARCHIVE-SPEC v2.0

version: "3.1.0"
software: libbs2b-tools

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-09-16"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================
source:
  # 与 archives/l/libbs2b/3.1.0 同源 (R39: 上游官方地址)
  url: "https://downloads.sourceforge.net/project/bs2b/libbs2b/3.1.0/libbs2b-3.1.0.tar.gz"
  sha256: "6aaafd81aae3898ee40148dd1349aab348db9bfae9767d0e66e0b07ddd4b2528"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options:
    - "--disable-shared"   # 只出静态 libbs2b.a，链接进两个工具
    - "--enable-static"
    - "PKG_CONFIG_PATH=<generators>"   # PkgConfigDeps 生成的 sndfile.pc
  dependencies:
    - libsndfile/1.2.2     # bs2bconvert 读写音频文件
  bootstrap:
    - "autoreconf -fi"     # configure.ac/Makefile.am 已打补丁，需重新生成 configure
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"
  - "0003-configure.ac.patch"
  - "0004-src-Makefile.am.patch"
  - "0005-src-cli-version-help.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "libbs2b 的 configure 把 libsndfile 当硬依赖：PKG_CHECK_EXISTS([sndfile], [], [AC_MSG_ERROR(Please install libsndfile.)])。拆 tools 包时若不改这一行，sndfile.pc 缺失会让 configure 直接终止，连不依赖 sndfile 的 bs2bstream 也一起产不出来 —— 要么把 sndfile 变可选（HAS_SNDFILE + AM_CONDITIONAL），要么必须把它作为 conan 依赖显式提供"
  - "src/Makefile.am 把 -lsndfile 硬编码在 bs2bconvert_LDFLAGS 里（绕过 pkg-config 的 @SNDFILE_LIBS@）。交叉编译时即使 pkg-config 找到了 sndfile，链接命令也拿不到 -L 搜索路径；而且 libtool 会把 LDFLAGS 里的 -l 当 deplibs 重排，静态链接语义不直观，应改到 LDADD"
  - "静态链接 libsndfile 时 pkg-config 必须加 --static：-lm 只在 Libs.private/system_libs 里，`pkg-config --libs sndfile` 拿不到，链接期 pow()/sin() 会 undefined"
  - "libsndfile 是 conan 依赖时，PKG_CHECK_EXISTS/PKG_CHECK_MODULES 不会自动生效：conan 不会把 PkgConfigDeps 的输出目录写进 PKG_CONFIG_PATH，必须显式 PkgConfigDeps(self).generate() + 把 PKG_CONFIG_PATH=<generators> 作为 configure 参数传入（autoconf 会 export VAR=VALUE 形式的参数）"
  - "libbs2b 2009 年的 configure/config.guess/config.sub 完全不认识 HarmonyOS，且 configure.ac 用了已废弃的 AC_PROG_LIBTOOL 与 dist-lzma；现代 automake 下必须先打 configure.ac 补丁再 autoreconf -fi，否则 configure 无法重新生成"
  - "autoconf 生成的 configure 里 config.status 用 umask 077 && mktemp -d 建临时目录，HMDFS 忽略 chmod 导致该目录随后不可写；需要改写为 umask 000 + mkdir -p $TMPDIR/conf$$"
  - "bs2bstream/bs2bconvert 的选项解析只看 argv[i][1]，--version/--help 一律掉进 default 分支 print_usage + return 1，-h 也是 return 1；平台 L2 冒烟按『先 --version，失败再 --help，都要求 0』判定，两个工具都不达标 -> L2 FAIL，必须补长选项并让 help 退出 0"