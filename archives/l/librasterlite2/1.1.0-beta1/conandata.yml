sources:
  url: "https://www.gaia-gis.it/gaia-sins/librasterlite2-sources/librasterlite2-1.1.0-beta1.tar.gz"
  sha256: "f7284cdfc07ad343a314e4878df0300874b0145d9d331b063b096b482e7e44f4"

patches:
  - patch_file: "patches/0001-config.guess-harmonyos.patch"
    patch_description: "Use an explicitly enabled compiler-proven config.guess tuple"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub-linux-ohos.patch"
    patch_description: "Accept linux-ohos as an Autoconf operating-system tuple"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-task-tmpdir.patch"
    patch_description: "Place Autoconf temporary files under the writable task TMPDIR"
    patch_type: "portability"
  - patch_file: "patches/0004-rasterlite2-private-time-t.patch"
    patch_description: "Declare time_t used by the private raster cache structure"
    patch_type: "portability"
  - patch_file: "patches/0005-rl2ascii-tmpfile-fallback.patch"
    patch_description: "Fall back to a task-writable anonymous stream when tmpfile is unavailable"
    patch_type: "portability"
