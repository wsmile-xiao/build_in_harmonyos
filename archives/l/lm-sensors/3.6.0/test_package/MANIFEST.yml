# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e
package: lm-sensors/3.6.0
homepage: "https://github.com/lm-sensors/lm-sensors"

# lm-sensors has no 'make check' target; tests are in lib/test/
upstream_check_command: "ls lib/test/test-scanner"

# No upstream test integration in build
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test files
upstream_tests:
  - file: lib/test/test-scanner.c
    source: lm-sensors-3.6.0/lib/test/test-scanner.c
    description: "libsensors config scanner test (requires generated conf-lex.c)"
    command: "./lib/test/test-scanner"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Verifies libsensors API: init, get_detected_chips, cleanup"
    command: "./test_lm_sensors"

# Approximate assertion count
assertion_count: 3
