software: libfaketime
version: 0.9.10
status: published
build_system: Makefile
configure_options: []
download_url: https://github.com/wolfcw/libfaketime/archive/refs/tags/v0.9.10.tar.gz
build_date: '2026-05-22'
compiler: clang-15.0.4
platform: ohos-aarch64

# 编译产物
artifacts:
  - bin/faketime
  - lib/faketime/libfaketime.so.1
  - lib/faketime/libfaketimeMT.so.1
  - share/man/man1/faketime.1.gz

# 补丁列表
patches:
  - 0001-makefile-ohos-adapt.patch
  - 0002-disable-glibc-symver.patch

# 功能验证
verification:
  version_check: passed
  basic_function: passed
  test_command: faketime '2020-01-01 00:00:00' date

# 平台适配说明
platform_notes:
  - musl libc 不支持 GLIBC 符号版本机制
  - 移除了不支持的编译器警告选项 -Wno-nonnull-compare