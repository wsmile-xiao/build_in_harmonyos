# conandata.yml — libfaketime 0.9.11
# 官方源：上游只通过 GitHub tag 归档分发（无 release 附件），URL 与 sha256 均取自
# https://github.com/wolfcw/libfaketime/archive/refs/tags/v0.9.11.tar.gz

sources:
  url: "https://github.com/wolfcw/libfaketime/archive/refs/tags/v0.9.11.tar.gz"
  sha256: "5912d8b4179402058d3847c0ad389e688630ea38898847b1190e636e12c33e44"

# 补丁按"每个源文件一份"登记：这是本仓 refresh-patch --auto 的输出形态，
# 它只描述已存在文件的改动，新增文件（如 OHOS 版 version script）不会进入
# 生成的补丁，因此那份脚本由配方在 build() 内生成（见 conanfile.py 顶部说明）。
patches:
  - patch_file: "patches/0001-src-Makefile.patch"
    patch_description: "Make the linker version script selectable: add VERSION_SCRIPT ?= libfaketime.map and pass it through -Wl,--version-script, so OHOS can point at its own script without touching upstream's"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0002-src-libfaketime.c.patch"
    patch_description: "Port the glibc .symver interposer bindings to musl/OHOS: keep the .symver statements under __GLIBC__ and expose the current ABI variants through __attribute__((alias)) otherwise, so all five interposers stay exported instead of being dropped"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0003-test-functests-common.inc.patch"
    patch_description: "test/functests/common.inc: uname reports HarmonyOS on HarmonyOS PC, so accept it (and OHOS) in the linuxlike platform() branch"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0004-test-functests-test_exclude_mono.sh.patch"
    patch_description: "test/functests/test_exclude_mono.sh: call bash through PATH instead of the absolute /bin/bash, which does not exist on OHOS (bash ships via HNP)"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0005-test-test_variable_data.sh.patch"
    patch_description: "test/test_variable_data.sh: shebang -> /usr/bin/env bash (no /bin/bash on OHOS)"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0006-test-testframe.sh.patch"
    patch_description: "test/testframe.sh: shebang -> /usr/bin/env bash (no /bin/bash on OHOS)"
    patch_type: "portability"
    patch_strip: 1
