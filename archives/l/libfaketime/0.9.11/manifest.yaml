# 版本级 manifest — libfaketime 0.9.11
# 遵循 ARCHIVE-SPEC（与 archives/c/connect-proxy/1.105/manifest.yaml 同构）

version: "0.9.11"
software: "libfaketime"

# built = 配方完成、真机本地验证通过，尚未由 CI upload 到制品仓
status: built

build_date: "2026-09-25"
build_system: "makefile"

source:
  url: "https://github.com/wolfcw/libfaketime/archive/refs/tags/v0.9.11.tar.gz"
  sha256: "5912d8b4179402058d3847c0ad389e688630ea38898847b1190e636e12c33e44"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - 'CC=<profile clang>'
    - 'PREFIX=<package_folder>'
    - 'LIBDIRNAME=/lib/faketime'
    - 'VERSION_SCRIPT=libfaketime.map.ohos'
    - 'FAKETIME_COMPILE_CFLAGS=-Wno-error=unused-command-line-argument -Wno-self-assign -Wno-error=unused-but-set-variable -DFAKE_RANDOM -DFAKE_PID'
    - 'make -j1 all | test | -C test snippets | install'
  dependencies: []
  cc: clang
  cxx: "n/a（纯 C 项目，无 C++ 源码）"

patches_applied:
  - patches/0001-src-Makefile.patch
  - patches/0002-src-libfaketime.c.patch
  - patches/0003-test-functests-common.inc.patch
  - patches/0004-test-functests-test_exclude_mono.sh.patch
  - patches/0005-test-test_variable_data.sh.patch
  - patches/0006-test-testframe.sh.patch
  # OHOS 版 version script（src/libfaketime.map.ohos）不在补丁里，由 build() 生成

test_results:
  type: upstream-suite-plus-consumer
  # 五维账本，口径与 notes.md / PR 正文 / test_package/MANIFEST.yml 完全一致
  upstream_static_total: 62
  upstream_registered_total: 55
  upstream_executed: 55
  upstream_passed: 55
  upstream_failed: 0
  upstream_not_executed: 7
  consumer_scenarios: 12
  consumer_programs: 4
  consumer_assertions: 54
  total: 67
  passed: 67
  failed: 0

artifacts:
  - bin/faketime
  - lib/faketime/libfaketime.so.1
  - lib/faketime/libfaketimeMT.so.1
  - share/man/man1/faketime.1.gz

verification:
  version_check: passed
  basic_function: passed
  test_command: >-
    conan create archives/l/libfaketime/0.9.11（build() 内 make test +
    make -C test snippets；test_package 12 个场景）

platform_notes:
  - musl/OHOS 无 ELF 符号版本机制，且 OHOS clang 汇编前端拒绝不带 '@' 的 .symver；
    改用 __attribute__((alias)) 暴露当前 ABI 变体 + 匿名 local-only version script（0002）
  - OHOS 版 version script 由 build() 生成而非补丁新增文件：本仓 refresh-patch --auto
    按"每个已存在源文件一份补丁"重生成，并丢弃新增文件段，补丁里带新文件会在下一次
    finish 时把配方指到不存在的补丁
  - bin/faketime 在编译期把 PREFIX+LIBDIRNAME 烤进可执行文件，build 与 install 必须同一 PREFIX
  - uname 在 HarmonyOS PC 上返回 HarmonyOS，上游 test/functests/common.inc 只认 Linux（0002）
  - OHOS 无 /bin/bash，bash 由 HNP 提供；上游两个脚本硬编码 /bin/bash（0002）
  - 用户态 perl 的 Time::HiRes::clock_gettime 未实现，测试需前置 /data/service/hnp/bin/perl
  - HMDFS 默认 0660，安装后的 bin/faketime 需 chmod 0755 才能 execve（E543）
  - 未签名 ELF 无法加载：三个产物在 package() 内 llvm-objcopy 去 .codesign 后 binary-sign-tool 自签
  - bin/faketime 的 CLI 只接受绝对时间串：它把规格交给 `date -d <spec> +%s`，OHOS 的
    toybox date 与设备上的 GNU coreutils 9.10 都拒绝 `-15d`/`15 days ago` 这类相对表达式
  - FAKE_RANDOM 的种子有下限口径：fakerandom_msws() 第 i 字节 = (i*seed)>>32，16 字节
    读要出现非零字节需 seed >= 2^28；低于该值真机输出全零流；上游 *.variable 用 64 位十六进制种子
  - libfaketime.so.1 在本机不能 dlopen()（SIGSEGV，未签名的构建目录副本同样如此，而
    libz.so 可正常 dlopen），它是纯 LD_PRELOAD 载荷；消费者测试改用预加载 + dlsym(RTLD_DEFAULT)+dladdr 归因

# 提交给框架的引用一律写"仓库内真实路径"（`scripts/ohc/submission.py` 的 check 8
# 按 project_root / ref 是否存在来判 PASS/FAIL，散文式条目恒 FAIL）。括号内是这些
# 路径在本工作区经验文档里对应的条目编号，便于交叉核对：
#   E543（HMDFS 默认文件模式 660 → 产物 chmod 0755）→ knowledge/operations/packaging.md
#   E386（hnp bash 在 HMDFS 构建目录 getcwd 失败）    → knowledge/doc/E386.md
#   E017（GitHub 源下载受限与镜像注入）                → knowledge/doc/E017.md
#   connect-proxy 1.105 的 R32/R33 Makefile 配方范式   → 该归档自己的 notes.md
knowledge_ref:
  - "knowledge/operations/packaging.md"
  - "knowledge/doc/E386.md"
  - "knowledge/doc/E017.md"
  - "archives/c/connect-proxy/1.105/notes.md"
knowledge_gained:
  - "DRAFT-libfaketime-0.9.11-musl-symver-alias：glibc .symver/version-script 移植到 musl 的最小改法（保留全部被拦截符号，而不是删掉整块）（ref: knowledge/drafts/DRAFT-libfaketime-0.9.11-musl-symver-alias.md，成对 .kv 同目录；Issue #3408）"

# 补丁分类（与 conandata.yml 的 patches 列表一一对应；6 个补丁全部是 OHOS/musl
# 平台专属改动，源码里用 __GLIBC__ / uname 模式守卫，在 glibc Linux 上行为不变）
patch_classification:
  - file: 0001-src-Makefile.patch
    type: portability
    platform_only: true
    guard: "VERSION_SCRIPT ?= libfaketime.map（默认值等于上游硬编码值，Linux/glibc 构建结果不变）"
  - file: 0002-src-libfaketime.c.patch
    type: portability
    platform_only: true
    guard: "#if defined __GLIBC__ 保留全部 .symver 语句；#else 分支用 __attribute__((alias)) 绑定当前 ABI 变体"
  - file: 0003-test-functests-common.inc.patch
    type: portability
    platform_only: true
    guard: "platform() case 追加 *HarmonyOS*|*OHOS* 到既有 *Linux* 分支，不改 Linux 匹配"
  - file: 0004-test-functests-test_exclude_mono.sh.patch
    type: portability
    platform_only: true
    guard: "/bin/bash → bash（PATH 解析）；Linux 上 /bin/bash 与 PATH bash 同一解释器"
  - file: 0005-test-test_variable_data.sh.patch
    type: portability
    platform_only: true
    guard: "shebang → /usr/bin/env bash（Linux 行为不变）"
  - file: 0006-test-testframe.sh.patch
    type: portability
    platform_only: true
    guard: "shebang → /usr/bin/env bash（Linux 行为不变）"
