software: lua-rapidjson
version: "0.6.0"
status: built
build_date: "2026-08-27"
build_system: cmake

source:
  url: "https://github.com/xpol/lua-rapidjson/archive/refs/tags/v0.6.0.tar.gz"
  sha256: "eaf053b745fdf89364f5d1416086265788489c0cae424c34f664b311df112b85"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - lua/5.4.8
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-platform-detection-and-march-native.patch: Fix HarmonyOS platform detection, remove -march=native, add lua.hpp include, link liblua on HarmonyOS"

knowledge_gained:
  - "CMake does not set UNIX for HarmonyOS; patch CMakeLists.txt to detect HarmonyOS"
  - "-march=native is incompatible with cross-compilation/CI; remove it"
  - "RapidJSON is embedded in source, no external dependency needed"
  - "lua-rapidjson builds as MODULE library (Lua C extension .so)"
  - "HarmonyOS dynamic linker does not export main executable symbols; link liblua.a directly"
