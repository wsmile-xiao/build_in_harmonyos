version: "0.6.0"
status: built
build_date: "2026-06-12"

source:
  url: "https://github.com/xpol/lua-rapidjson/archive/refs/tags/v0.6.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DLUA_INCLUDE_DIR=$HOME/usr/local/include"
    - "-DLUA_LIBRARIES=$HOME/usr/local/lib/liblua.a"
  dependencies:
    - lua/5.4.7
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 构建需要 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容性参数"
  - "Lua 静态库需要 -fPIC 编译才能链接到共享库"
