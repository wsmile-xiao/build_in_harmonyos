# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lua-rapidjson/0.6.0
homepage: "https://github.com/xpol/lua-rapidjson"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (busted spec files)
upstream_tests:
  - file: spec/json_decode_spec.lua
    source: lua-rapidjson-0.6.0/spec/json_decode_spec.lua
    description: "JSON decode tests (values, errors, arrays, objects, escaped chars, number formats, null)"
    command: "busted spec/json_decode_spec.lua"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "C program embedding Lua to load and test rapidjson module (decode, encode, array, null)"
    command: "./test_lua_rapidjson"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
