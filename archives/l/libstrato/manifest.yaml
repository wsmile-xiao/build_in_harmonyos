software: libstrato
display: "StratoHAL"
description: "ONScripter 系游戏引擎的硬件抽象层（HAL）：图像/字形解码、音频、GL 渲染后端与平台文件 IO 抽象"
category: gfx
homepage: "https://github.com/awemorris/StratoHAL"
license: Zlib
build_system: cmake

# ── 跨版本通用的 OHOS 适配知识 ──────────────────────────────────────────
ohos_adaptation:
  key_points:
    - "上游自带 STRATO_TARGET_OPENHARMONY 目标开关，但 cmake/toolchains/ 无 openharmony 工具链文件 ⇒ 交叉工具链须自建"
    - "OHOS 设备 uname -s=HarmonyOS 且 CMake 无 Platform/HarmonyOS.cmake ⇒ 工具链须显式 CMAKE_SYSTEM_NAME=Linux"
    - "src/image.c / glyph.c / wave.c 按上游自带 lib/build-libs.sh 的头文件布局写死 #include <png/png.h>、<jpeg/jpeglib.h>（子目录形式），conan 包为平铺 ⇒ 需私有 include 前缀"
    - "OHOS 的 libGLESv2.so 是转发桩只导出 OES 后缀 VAO 名；核心 ES3 名在 libGLESv3.so —— 用核心名的库须额外链 GLESv3"
    - "上游 OHOS 链接集合不完整（缺 EGL/GLESv3/hilog_ndk/ace_ndk/ace_napi，示例 App 在 App 层补） ⇒ 库包须自行补齐，否则加载期重定位失败"
    - "ohmain.cpp 以 extern int VIEWPORT_WIDTH/HEIGHT 由消费者提供视图尺寸（示例 App 契约，需 -rdynamic 导出）"
    - "头文件声明的 hal_get_image_width/height/pixels 全树无实现，消费者读 struct hal_image 公开成员"
    - "install 块无条件 install(TARGETS stratopack) 而 stratopack 仅在 STRATO_ENABLE_PACK=ON 时存在 ⇒ 打开 INSTALL 会 configure 失败"
  target_option: "STRATO_TARGET_OPENHARMONY"
  use_system_libs_option: "STRATO_ENABLE_DIST"

versions:
  - version: "1.0.19"
    date: "2026-09-23"
    status: built
    notes: "首次适配；22 条消费者断言全过；无补丁"
