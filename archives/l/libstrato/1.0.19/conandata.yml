sources:
  # GitHub 官方归档端点（github.com/<owner>/<repo>/archive/... 的 302 落地点），
  # 与 https://github.com/awemorris/StratoHAL/archive/refs/tags/v1.0.19.tar.gz
  # 逐字节同一份 tarball（SHA256 已双向核对一致）。仓库内已有 286 个配方采用该写法。
  url: "https://codeload.github.com/awemorris/StratoHAL/tar.gz/refs/tags/v1.0.19"
  # codeload 的 URL 末段是 tag 名而非 .tar.gz，conan 无法从 URL 推断压缩格式
  # （实测报 BadZipFile: File is not a zip file），须显式声明归档文件名。
  filename: "StratoHAL-v1.0.19.tar.gz"
  sha256: "0e7c8240171d4da0c6d445bd41acd667121472eae5578af3a4ad335b5967affe"
