version: "1.0.19"
status: built
build_date: "2026-09-23"
verification: "conan create PASS; test_package 22/22 断言 PASS; conan-verify G0/G1/G2/G3/G4/L2/L4/L5 全 PASS"

source:
  url: "https://codeload.github.com/awemorris/StratoHAL/tar.gz/refs/tags/v1.0.19"
  filename: "StratoHAL-v1.0.19.tar.gz"
  tar_format: tar.gz
  sha256: "0e7c8240171d4da0c6d445bd41acd667121472eae5578af3a4ad335b5967affe"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux        # 自建工具链文件内设置；CMake 无 OHOS/HarmonyOS 平台模块"
    - "-DSTRATO_TARGET_OPENHARMONY=ON   # 上游自带的 OHOS 目标开关"
    - "-DSTRATO_ENABLE_SHARED=ON"
    - "-DSTRATO_ENABLE_DIST=ON          # 用 conan 提供的 7 个依赖，不用仓库自带 lib/archive"
    - "-DSTRATO_ENABLE_INSTALL=OFF      # 上游 install 块无条件装 stratopack，会 configure 失败"
    - "-DSTRATO_ENABLE_PACK=OFF"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-lEGL -lGLESv3 -lhilog_ndk.z -lace_ndk.z -lace_napi.z"
  dependencies:
    - libpng/1.6.58.2
    - libjpeg-turbo/3.2.0
    - libwebp/1.6.0
    - libogg/1.3.6
    - libvorbis/1.3.7
    - freetype/2.14.3
    - zlib/1.3.2
  cc: aarch64-unknown-linux-ohos-clang
  cxx: aarch64-unknown-linux-ohos-clang++

patches_applied: []

knowledge_gained:
  - "OHOS 设备上 uname -s=HarmonyOS，而 CMake 不带 Platform/HarmonyOS.cmake ⇒ 交叉配置必须显式 CMAKE_SYSTEM_NAME=Linux；conan 的 CMakeToolchain 在 os=OHOS 下不写 CMAKE_SYSTEM_NAME/CMAKE_SYSROOT（generic_system 块为空）"
  - "上游若按其自带 lib/ 构建脚本的头文件布局写死 #include <png/png.h> / <jpeg/jpeglib.h>，需在 build_folder 建私有 include 前缀补齐子目录，conan 包头文件是平铺的"
  - "OHOS 的 libGLESv2.so 是单地址转发桩，只导出 OES 后缀名（glGenVertexArraysOES…）；核心 ES3 名（glGenVertexArrays/glBindVertexArray/glDeleteVertexArrays）只在 libGLESv3.so 中 ⇒ 用核心名的库必须额外链 GLESv3"
  - "上游 OHOS 目标的 target_link_libraries 可能不完整（示例 App 在 App 层补 EGL/GLESv3/hilog_ndk/ace_ndk/ace_napi）⇒ 打成库包必须由库自身补齐，否则加载期 Error relocating <lib>: <sym>: symbol not found"
  - "libstrato 的 ohmain.cpp 以 extern int VIEWPORT_WIDTH/HEIGHT 把视图尺寸交给消费者定义（上游示例 App 契约）⇒ 消费者须定义并 -rdynamic 导出"
  - "strato.h 声明了 hal_get_image_width/height/pixels 但全源码树无实现（undefined symbol），消费者应读 struct hal_image 的公开成员"
  - "本机 ghfast.top 不可达（rc=000/20s 超时）而 gh-proxy.com/github.com/codeload 正常 ⇒ conan_verify 的 E017 无条件镜像注入会让 github.com 源在本地必然失败；改用 codeload.github.com 官方归档端点（仓库内 286 例先例）可绕开且仍满足 R39/PF7"
  - "codeload 的 URL 末段是 tag 名，conan 无法从 URL 推断压缩格式（报 BadZipFile），conandata.yml 必须显式写 filename"
  - "libpng/1.6.58.1+ 均 pin zlib/1.3.2；libpng/1.6.58 的已发布 binary 与 zlib/1.3.1.1 组合不匹配（Missing binary）"

patch_classification: []
