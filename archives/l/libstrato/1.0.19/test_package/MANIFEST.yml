# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libstrato/1.0.19
homepage: "https://github.com/awemorris/StratoHAL"

# ── 上游测试清点（对照 tag v1.0.19 全源码树，347 个文件逐项核对）──
#   · 顶层 CMakeLists.txt 无 enable_testing() / add_test() / include(CTest)
#   · 无 tests/ 或 test/ 目录
#   · 无 Catch2 / GoogleTest / Unity Test / ctest 等测试框架接入
#   · resources/projects/{android,ios,macos,openharmony}/ 下的 *Test.ets、
#     *Tests 属上游示例 App 的工程模板资产（ArkTS / Xcode 工程，不经 CMake
#     注册，也不由本库构建触发），不是本库的自动化测试，故不计入 N_static
# ⇒ 上游自动化测试静态声明数 N_static = 0，无可执行的上游套件。
#   据实申报 0，消费者测试另行设计（见下）。
upstream_check_command: "无（上游未接入任何测试框架；ctest -N / make check 均无目标）"
upstream_test_in_build: false
upstream_test_command: "无（N_static=0，build() 中不存在可执行的上游测试）"

upstream_tests: []

# ── test_package 消费者测试（赛道二硬门禁：真实编译 + 链接 + 调用公开 API + 断言）──
test_package_tests:
  - file: test_package/test_libstrato.c
    description: >
      以库使用者身份 find_package(StratoHAL) 编译链接后调用公开 API 并断言，覆盖四条
      真实调用路径：①像素缓冲路径 hal_create_image / hal_clear_image + struct
      hal_image 公开成员 width/height/pixels 的 32 位像素往返；②hal_create_image_with_png
      经 libpng 对 2x2 无损 PNG 解码并做像素级精确断言 0xFFFFFFFF；③hal_create_image_with_jpeg
      经 libjpeg-turbo 解码 2x2 baseline JPEG；④hal_create_image_with_webp 经
      libwebp 解码 2x2 无损 WebP；另含畸形输入经 PNG / WebP 入口须安全返回 false。
      退出码由断言结果决定（全过 0，任一失败非 0）。
      注：头文件声明的 hal_get_image_width/height/pixels 在 tag v1.0.19 全源码树
      无实现（undefined symbol），故消费者改读 struct hal_image 的公开成员。
      JPEG 入口未做畸形输入断言：上游该函数装上 libjpeg 默认错误处理器后直接
      jpeg_read_header()，畸形输入会走 libjpeg 的 error_exit() 终止进程，
      属上游既有行为，不在本消费者测试断言范围内。
    command: "./test_libstrato"

# 断言总数：4 条调用路径的消费者断言 22 个（含失败路径与句柄回收检查）
assertion_count: 22
