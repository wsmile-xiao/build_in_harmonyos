# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libofx/0.10.9
homepage: "https://github.com/libofx/libofx"

# 上游测试套件存在性 (经审计源码确认, 见下方 upstream_test_audit)
upstream_tests_exist: true

# 上游测试审计 (源码: libofx 0.10.9 tag tarball,
# sha256 ea9fa07759622ecc7f25b637fa8fb34d587af80607ca4389d25966a6a4f94ab9)
upstream_test_audit:
  source_tarball: "0.10.9.tar.gz"
  source_sha256: "ea9fa07759622ecc7f25b637fa8fb34d587af80607ca4389d25966a6a4f94ab9"
  top_level_files:
    - CMakeLists.txt       # include(CTest); ofxdump/ofx2qif/ofxconnect 子目录
    - ofxdump/CMakeLists.txt  # add_test call-ofxdump + 20 个 sample-file 用例 (9 个 WILL_FAIL)
    - ofx2qif/CMakeLists.txt  # 仅 add_executable, 无 add_test
    - ofxconnect/CMakeLists.txt  # 需 curl + libxml++-2.6, 本配方关闭
    - doc/ofx_sample_files/  # 20 个 .ofx/.xml/.sgml 样本输入 + dtd/ 目录
    - Makefile.am          # autotools 侧无 check 目标, 测试仅 cmake 侧
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "make check / ctest 目标"
    - "tests/ 目录与 *test*.c 独立测试源"
  scan_result: "无 gtest/pytest; 无 tests/ 目录; 无 make check 目标; ctest 用例全部注册在 ofxdump/CMakeLists.txt (call-ofxdump 1 + SAMPLE_OFX_FILENAMES 20)"
  make_check_output: "autotools 侧无 make check; cmake 侧 ctest 共 21 项 (1 冒烟 + 11 好样本 + 9 预期失败样本 WILL_FAIL true)"
  reason: "ofxdump 样本用例直接执行包内 ofxdump 二进制解析 doc/ofx_sample_files 样本 (OFX_DTD_PATH=dtd); 失败样本以 WILL_FAIL 注册, 非预期失败即 ctest 失败。build() 内 subprocess 跑 ctest --output-on-failure 并解析 N tests passed out of M, 输出 HMBS_UPSTREAM_TEST_RESULT"

# 上游测试命令 (build() 内真实执行)
upstream_check_command: "ctest --output-on-failure (ofxdump sample files)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (ofxdump sample files)"

# 上游实际的测试程序
upstream_tests:
  - file: ofxdump/CMakeLists.txt
    source: libofx-0.10.9/ofxdump/CMakeLists.txt
    description: "冒烟用例 call-ofxdump: 无参执行 ofxdump, 要求退出码 0"
    command: "ctest -R call-ofxdump"
  - file: doc/ofx_sample_files/another-example.xml
    source: libofx-0.10.9/doc/ofx_sample_files/another-example.xml
    description: "样本用例: ofxdump 解析 another-example.xml (OFX_DTD_PATH=dtd)"
    command: "ctest"
  - file: doc/ofx_sample_files/example-listing1.xml
    source: libofx-0.10.9/doc/ofx_sample_files/example-listing1.xml
    description: "样本用例: ofxdump 解析 example-listing1.xml"
    command: "ctest"
  - file: doc/ofx_sample_files/example-listing2.xml
    source: libofx-0.10.9/doc/ofx_sample_files/example-listing2.xml
    description: "样本用例: ofxdump 解析 example-listing2.xml"
    command: "ctest"
  - file: doc/ofx_sample_files/ofx_spec160_stmtrs_example.sgml
    source: libofx-0.10.9/doc/ofx_sample_files/ofx_spec160_stmtrs_example.sgml
    description: "样本用例: ofxdump 解析 OFX 1.6 spec 报文样本"
    command: "ctest"
  - file: doc/ofx_sample_files/ofx_spec201_stmtrs_example.xml
    source: libofx-0.10.9/doc/ofx_sample_files/ofx_spec201_stmtrs_example.xml
    description: "样本用例: ofxdump 解析 OFX 2.0.1 spec 报文样本"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
# R34: 均实质调用被测包 API / 执行被测包二进制
test_package_tests:
  - file: test_libofx.cpp
    description: "消费者测试套件 context: 版本宏 + 文件格式 helpers + context 生命周期 (4 项断言)"
    command: "test_libofx"
  - file: test_libofx.cpp
    description: "消费者测试套件 requests: OFX 请求构造器 + 未知格式负向路径 (3 项断言)"
    command: "test_libofx"
  - file: test_package/conanfile.py
    description: "CLI 执行路径: 无参运行包内 ofxdump (上游 call-ofxdump 同款), 要求退出码 0"
    command: "ofxdump"

# 测试断言总数 (context 4 + requests 3, ofxdump 为冒烟执行不计断言)
assertion_count: 7
