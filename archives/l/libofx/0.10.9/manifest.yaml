software: libofx
version: "0.10.9"
status: built
build_date: "2026-09-17"
build_system: cmake

source:
  url: "https://github.com/libofx/libofx/archive/refs/tags/0.10.9.tar.gz"
  sha256: "ea9fa07759622ecc7f25b637fa8fb34d587af80607ca4389d25966a6a4f94ab9"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_OFXCONNECT=OFF"
    - "-DENABLE_OFXDUMP=ON"
    - "-DENABLE_OFX2QIF=ON"
    - "-DENABLE_ICONV=ON"
    - "-DENABLE_VCPKG_INTEGRATION=OFF"
  dependencies:
    - "opensp/1.5.2"
  cc: clang

patches_applied: []

knowledge_gained:
  - "libofx 0.10.9 dual build systems; recipe uses CMake (ofxconnect OFF avoids curl+libxml++-2.6)"
  - "Upstream ctest suite lives in ofxdump/CMakeLists.txt (call-ofxdump + 20 sample-file cases)"
  - "Library output is libofx.so with -lofx linker flag (PREFIX empty); headers in include/libofx"
