software: libforensic1394
version: "0.2"
conan_ref: "libforensic1394/0.2"
status: built
build_date: "2026-09-17"
build_system: cmake

source:
  url: "https://freddie.witherden.org/tools/libforensic1394/releases/libforensic1394-0.2.tar.gz"
  sha256: "50a82fe2899aa901104055da2ac00b4c438cf1d0d991f5ec1215d4658414652e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (CMake 4 policy floor, passed as a configure command line definition)"
    - "-DFORENSIC1394_BUILD_STATIC=ON"
    - "-DFORENSIC1394_BUILD_SHARED=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-harmonyos-platform.patch"

knowledge_gained:
  - "OHOS 上 CMake 报告 CMAKE_SYSTEM_NAME=HarmonyOS（CMAKE_SYSTEM 为 'HarmonyOS-HongMeng Kernel 1.12.0'），上游以 MATCHES \"Linux\" 选择 Linux/Juju 后端的写法必须显式扩到 HarmonyOS"
  - "上游 MESSAGE(FATAL ...) 缺少 _ERROR 后缀，不是合法 message 模式，不会终止 CMake 配置；错误会延后到 add_library 以 'No SOURCES given to target' 暴露"
  - "OHOS SDK sysroot 提供完整 linux/firewire-cdev.h（FW_CDEV_VERSION 3）与 firewire-constants.h，Juju 用户态后端可直接编译，无需 stub（与 libdc1394 2.2.7 同结论）"
  - "无 FireWire 控制器时 get_devices 返回空列表、enable_sbp2 返回 IO_ERROR/-5，属上游文档行为；真实对端枚举与内存读写路径需外接 IEEE 1394 设备，未在本环境实测（消费者测试不覆盖，已披露）"
  - "CMake 4 的 CMAKE_POLICY_VERSION_MINIMUM=3.5 必须以 configure 命令行 -D 注入：顶层 cmake_minimum_required 在 toolchain 文件加载前执行，tc.variables/tc.cache_variables 的 toolchain 缓存条目对该检查无效"
