# test_package/MANIFEST.yml — libforensic1394 0.2 verification manifest
#
# Upstream 0.2 ships no test suite: neither the published release tarball nor
# the upstream master branch contains a tests/ directory, a CTest
# enable_testing()/add_test() call or a Makefile check target.  The inventory
# evidence is recorded in ../notes.md, and the library itself is verified
# through the installed-package consumer programs below.
package: libforensic1394/0.2
software: libforensic1394
version: "0.2"
homepage: "https://freddie.witherden.org/tools/libforensic1394/"

upstream_check_command: "none (0.2 has no upstream test suite)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_type: installed-package
test_package_tests:
  - file: api_surface.c
    name: forensic1394_api_surface
    description: "Binds every exported function with its header-declared signature and checks the result-code to string table of the shipped object code"
    command: "./forensic1394_api_surface"
  - file: bus_lifecycle.c
    name: forensic1394_bus_lifecycle
    description: "Bus lifecycle without FireWire hardware: alloc, user-data round trip, device enumeration, SBP-2 error path, repeated destroy"
    command: "./forensic1394_bus_lifecycle"

executables:
  - name: forensic1394_api_surface
    purpose: "forced relocation against all 24 exported symbols plus public constant and result-string contract"
  - name: forensic1394_bus_lifecycle
    purpose: "documented runtime behaviour of the bus handle on a host without FireWire hardware"

cases: 2
assertions: 46
