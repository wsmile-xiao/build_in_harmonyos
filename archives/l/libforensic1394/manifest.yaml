software: libforensic1394
display: "libforensic1394"
description: "Library for performing live memory forensics over the IEEE 1394 (FireWire) interface"
category: library
homepage: "https://freddie.witherden.org/tools/libforensic1394/"
license: LGPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS 上 CMake 报告 CMAKE_SYSTEM_NAME=HarmonyOS，上游按 MATCHES \"Linux\" 选择 Juju 后端的条件必须扩展到 HarmonyOS"
    - "firewire-cdev 用户态接口随 OHOS SDK sysroot 提供（linux/firewire-cdev.h + firewire-constants.h），无第三方依赖"
    - "CMake 4 的 CMAKE_POLICY_VERSION_MINIMUM=3.5 必须以 configure 命令行 -D 注入：顶层 cmake_minimum_required 在 toolchain 文件加载前执行，tc.variables/tc.cache_variables 的 toolchain 缓存条目对该检查无效"
    - "无 FireWire 硬件时 get_devices 返回空列表、enable_sbp2 返回 IO_ERROR，属上游文档行为；真实对端枚举与内存读写路径需外接 IEEE 1394 设备，未在本环境实测"
  common_dependencies: []

versions:
  "0.2":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libforensic1394/0.2"
