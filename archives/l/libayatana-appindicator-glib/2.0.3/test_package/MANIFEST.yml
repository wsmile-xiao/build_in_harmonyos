# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libayatana-appindicator-glib/2.0.3
homepage: "https://github.com/AyatanaIndicators/libayatana-appindicator-glib"

# 上游测试命令 (ctest)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
# (上游 tests/ 的 dbus/status 端到端及 gtester 包装依赖 dbus-test-runner +
#  Xvfb，鸿蒙平台不可用 (E037/E049 平台限制，libdbusmenu/libayatana-indicator
#  先例)，故未在 recipe build() 中运行；可真实运行的单元测试
#  test-libappindicator 已逐字复制进 test_package 真实编译执行)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/CMakeLists.txt, add_test) — 实测 6 个可执行程序
upstream_tests:
  - file: tests/test-libappindicator
    source: libayatana-appindicator-glib-2.0.3/tests/test-libappindicator.c
    description: "上游单元测试：6 个 g_test 用例（init/init_props/init_set_props/prop_signals/set_label/label_signals）。每个用例经 app_indicator_new() 异步获取 session bus，无 dbus 会话时 g_test 判定 g_warning 为致命（CI #59876 实测 core dump）——E037 平台限制。已在 test_package 编译链接验证"
    command: "ctest -R libappindicator-tests (gtester 包装；无 dbus 会话不可运行)"
  - file: tests/test-libappindicator-dbus-client + test-libappindicator-dbus-server
    source: libayatana-appindicator-glib-2.0.3/tests/test-libappindicator-dbus-client.c + test-libappindicator-dbus-server.c
    description: "DBus client/server 测试（dbus-test-runner 编排，DISPLAY 置空 + run-xvfb.sh）——OHOS 无 dbus-test-runner/Xvfb，不可运行"
    command: "ctest -R test-libappindicator-dbus"
  - file: tests/test-libappindicator-status-client + test-libappindicator-status-server
    source: libayatana-appindicator-glib-2.0.3/tests/test-libappindicator-status-client.c + test-libappindicator-status-server.c
    description: "StatusNotifier client/server 测试（dbus-test-runner 编排，run-xvfb.sh）——OHOS 无 dbus-test-runner/Xvfb，不可运行"
    command: "ctest -R test-libappindicator-status"
  - file: tests/test-simple-app
    source: libayatana-appindicator-glib-2.0.3/tests/test-simple-app.c
    description: "示例消费者程序（构造 indicator + GMenu + GAction 后进入主循环，需手动终止）——OHOS 可作为编译链接验证"
    command: "手动运行"

# test_package 中自带的测试 (消费者视角验证 + 上游单元测试编译链接验证)
test_package_tests:
  - file: test_package.c
    description: "鸿蒙特有端到端消费者用例（rule12，真实运行）：构造 AppIndicator，设置 icon/attention_icon/title/label/status，挂载 GMenu/GAction，经事件循环驱动 new-label 信号回调并校验，getter 回读一致"
    command: "./test_package"
  - file: test-libappindicator.c
    description: "上游单元测试逐字复制（未修改），编译链接验证（rule4/API 兼容性）。运行需 dbus 会话（E037 平台限制，CI #59876 实测 core dump），与上游 dbus/status 测试同属不可运行类"
    command: "仅编译链接（./test-libappindicator 需 dbus 会话不可运行）"

# 测试断言总数 (近似值, 用于质量评估)
# 仅统计真实运行的用例：test_package 端到端用例 11 处 CHECK
assertion_count: 11
