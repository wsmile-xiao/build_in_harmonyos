# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libjpeg9/9f
homepage: "https://www.ijg.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（Makefile.am check-local）
upstream_tests:
  - file: Makefile.am
    source: jpeg-9f/Makefile.am
    description: "check-local: djpeg 解码 testorig.jpg（ppm/gif/bmp）、cjpeg 编码 testimg.ppm（基线+渐进）、jpegtran 转换 testprog.jpg，共 7 组编码/解码 + 7 条逐字节 cmp 比对"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用 jpeg_mem_dest/jpeg_mem_src 完成 RGB 图像内存编码-解码往返，校验 SOI 标记、输出尺寸与像素误差"
    command: "./test_libjpeg9"
  - file: test_ohos_static.c
    description: "鸿蒙特有(R26)：os=OHOS 下断言包静态化约束——运行平台为 HarmonyOS/OpenHarmony、包 lib/ 存在且 libjpeg.a 为非空 ar 归档、无任何 libjpeg.so* 产物、消费者进程未映射共享 libjpeg"
    command: "./test_ohos_static (仅 os=OHOS 执行)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
