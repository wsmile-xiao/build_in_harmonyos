software: libjpeg9
version: "9f"
build_system: autotools
status: built
build_date: "2026-09-15"

source:
  url: "https://www.ijg.org/files/jpegsrc.v9f.tar.gz"
  sha256: "04705c110cb2469caa79fb71fba3d7bf834914706e9641a4589485c1f832565b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch - HarmonyOS 平台识别（E007）"
  - "0002-config.sub.patch - config.sub 新增 ohos*/linux-ohos* 三元组"
  - "0003-configure.patch - HMDFS umask 限制修复（E011）"

knowledge_gained:
  - "E007: jpeg-9f 自带 config.guess(2021-06-03) 不识别 UNAME_SYSTEM=HarmonyOS，需新增分支输出 aarch64-unknown-linux-ohos"
  - "jpeg-9f 的 config.sub(2021-08-14) 未内置 ohos 三元组，需补丁新增 ohos* 与 linux-ohos*（区别于 libjpeg/10 的 2024-05-27 版，后者已内置无需补丁）"
  - "E011: configure 用 umask 077 创建临时目录，HMDFS 下 config.status 无法写入，改为 umask 022"
  - "libjpeg9 产物与系统 libjpeg 同名（R26），仅构建静态库，避免 .so 污染系统库路径"
  - "上游 Makefile.am check-local 是可复用的自测集（7 组逐字节 cmp 断言），已集成到 build()"

notes: 参照 archives/l/libjpeg/10 同族配方移植；static-only；详见 archives/l/libjpeg9/9f/notes.md
