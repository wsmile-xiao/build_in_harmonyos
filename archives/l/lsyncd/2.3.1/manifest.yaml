software: lsyncd
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/axkibe/lsyncd/archive/refs/tags/release-2.3.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DWITH_INOTIFY=ON"
    - "-DLUA_INCLUDE_DIR=/storage/Users/currentUser/usr/local/include"
    - "-DLUA_LIBRARIES=/storage/Users/currentUser/usr/local/lib/liblua.a"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.3.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/lsyncd-2.3.1.orig
  source_work_dir: /storage/Users/currentUser/builds/lsyncd-2.3.1.work
  source_orig_hash: db94a3c877144fff
  source_work_hash: ebae0b191395d72e
  generated_at: '2026-06-04T16:34:35'
  patches_count: 1

patch_classification:
