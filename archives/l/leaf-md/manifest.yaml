# 软件级 manifest
# 文件位置: archives/l/leaf-md/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: leaf-md

# 上游项目信息
upstream:
  name: "RivoLink/leaf"
  homepage: "https://github.com/RivoLink/leaf"
  language: rust
  build_system: cargo
  license: MIT

# 制品仓包名说明: 上游 crate 与可执行文件均名为 leaf，
# 本仓库以 leaf-md 为包名（沿用 Homebrew formula 名，避免与 crates.io 上
# 无关的 autumnai/leaf 项目混淆）；commands.json 中声明的可执行文件为 leaf。
package_alias: leaf-md
binary_names:
  - leaf

# 版本索引
versions:
  - version: "1.26.1"
    status: built
    build_date: "2026-09-17"
    path: "1.26.1"

# 已适配版本列表（供检索/依赖解析）
adapted_versions:
  - "1.26.1"

# 构建所需工具链
toolchain:
  - rust (cargo/rustc, 宿主三元组 aarch64-unknown-linux-ohos)
  - aarch64-unknown-linux-ohos-clang

# 发布到制品仓
publish:
  remote: ohpcd
  reference: "leaf-md/1.26.1"
