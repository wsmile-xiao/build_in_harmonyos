# conandata.yml — leaf-md 1.26.1 (terminal Markdown previewer written in Rust)
# Official GitHub release tarball (upstream project: RivoLink/leaf).
# The SHA256 below was verified to be identical when fetched through two
# independent routes (direct GitHub codeload and mirror), so it is the
# upstream-official digest.
#
# NOTE: do not write bare URLs in comments here. The CI pre-download step
# scans every http(s) URL in this file (comments included) and rewrites the
# matched strings to local file:// paths, which corrupts a real source URL
# when the comment URL is one of its prefixes.
#
# The binary shipped by upstream is named `leaf`; the Conan package is named
# `leaf-md` to match the distribution/packaging name used in this repository.

sources:
  # Official upstream release tarball as the single primary source (R39). The CI
  # pre-download step attaches mirror fallbacks automatically, so a proxy prefix
  # must not be listed first: the CI worker could not reach the gh-proxy route and
  # the pre-download timed out (build #49585). Mirrors stay a CI-side concern.
  url: "https://github.com/RivoLink/leaf/archive/refs/tags/1.26.1.tar.gz"
  sha256: "fcff13393d749efe738688d1a31064081957e5e8712a1a883d897d3c29959c63"

# No patches required for this version.
# The upstream source builds as-is with cargo for aarch64-unknown-linux-ohos;
# the OHOS linker/target selection is handled inside the recipe's build().
patches: []
