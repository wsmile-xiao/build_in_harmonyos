# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（每条均标注知识库引用）
knowledge_gained:
- "Rust 项目在 OHOS 上原生编译：Harmonybrew rust 的宿主三元组即 aarch64-unknown-linux-ohos，cargo build --release 直接产出 OHOS 可执行文件，无需 --target（ref: E180）"
- "cc-rs 编译 C 依赖（onig_sys / ring）必须用 env 传 CC_aarch64-unknown-linux-ohos——变量名带连字符不能做 POSIX sh 前缀赋值（ref: E385）"
- "Conan 打包 cargo 项目用 basic_layout + 固定 CARGO_TARGET_DIR（否则 target 落在非预期目录），package() 从 target/release 取二进制（ref: E340）"
- "OHOS ELF 必须用 binary-sign-tool 签名（-selfSign 1），且签名后 -outFile 产物会丢可执行权限位，必须补 chmod 755，否则运行报 Permission denied（exit 126）（ref: E186）"
- "cargo --locked 配合上游 Cargo.lock 锁定依赖版本，防止 CI 上依赖漂移（ref: E358）"
- "conandata.yml 的注释里不要写裸 http(s):// URL：CI 预下载步骤会扫描全文（含注释）并改写为本地 file:// 路径，注释 URL 若是真实归档 URL 的前缀就会把 sources.url 污染成不存在的路径，source() 随即 404/哈希校验失败（ref: E580）"
