# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: leaf-md/1.26.1
homepage: "https://github.com/RivoLink/leaf"

# 上游测试命令：leaf 的测试全部位于 src/tests/*.rs 的 #[cfg(test)] 模块内，
# 均为本地 Markdown 解析/渲染/终端宽度计算，无网络与外部服务依赖。
upstream_check_command: "cargo test --release --locked"

# conanfile.py 的 build() 中已集成上游测试：
# true = 每次 CI 构建都会重新执行完整上游测试套件（不允许跳过）
upstream_test_in_build: true
upstream_test_command: "cargo test --release --locked --no-fail-fast"

# 上游测试模块清单（实测 #[test] 数量，合计 348）
upstream_tests:
  - file: src/tests/mod.rs
    source: leaf-1.26.1/src/tests/mod.rs
    description: "上游测试模块入口，声明并聚合下列全部子模块（自身不含用例）"
    test_count: 0
  - file: src/tests/app.rs
    source: leaf-1.26.1/src/tests/app.rs
    description: "应用主逻辑：文档加载、滚动、状态机"
    test_count: 32
  - file: src/tests/app_code_blocks.rs
    source: leaf-1.26.1/src/tests/app_code_blocks.rs
    description: "代码块渲染与折叠"
    test_count: 4
  - file: src/tests/completions.rs
    source: leaf-1.26.1/src/tests/completions.rs
    description: "命令行补全脚本生成"
    test_count: 10
  - file: src/tests/config.rs
    source: leaf-1.26.1/src/tests/config.rs
    description: "配置文件解析与默认值"
    test_count: 18
  - file: src/tests/editor.rs
    source: leaf-1.26.1/src/tests/editor.rs
    description: "内嵌编辑器与光标/按键处理"
    test_count: 46
  - file: src/tests/file_fuzzy.rs
    source: leaf-1.26.1/src/tests/file_fuzzy.rs
    description: "文件模糊搜索匹配"
    test_count: 14
  - file: src/tests/file_picker.rs
    source: leaf-1.26.1/src/tests/file_picker.rs
    description: "文件选择器"
    test_count: 4
  - file: src/tests/inline.rs
    source: leaf-1.26.1/src/tests/inline.rs
    description: "非交互渲染路径（--inline）与输出格式"
    test_count: 28
  - file: src/tests/markdown_blocks.rs
    source: leaf-1.26.1/src/tests/markdown_blocks.rs
    description: "Markdown 块级元素解析（标题/引用/分割线等）"
    test_count: 31
  - file: src/tests/markdown_embedded.rs
    source: leaf-1.26.1/src/tests/markdown_embedded.rs
    description: "内嵌 HTML/图片/Mermaid 等嵌入式内容"
    test_count: 12
  - file: src/tests/markdown_links.rs
    source: leaf-1.26.1/src/tests/markdown_links.rs
    description: "链接解析与 OSC 8 超链接输出"
    test_count: 11
  - file: src/tests/markdown_list_blocks.rs
    source: leaf-1.26.1/src/tests/markdown_list_blocks.rs
    description: "复杂列表块（嵌套/多段）"
    test_count: 18
  - file: src/tests/markdown_lists.rs
    source: leaf-1.26.1/src/tests/markdown_lists.rs
    description: "有序/无序列表渲染"
    test_count: 17
  - file: src/tests/markdown_tables.rs
    source: leaf-1.26.1/src/tests/markdown_tables.rs
    description: "表格解析与列宽对齐"
    test_count: 11
  - file: src/tests/render.rs
    source: leaf-1.26.1/src/tests/render.rs
    description: "渲染管线整体行为"
    test_count: 9
  - file: src/tests/theme.rs
    source: leaf-1.26.1/src/tests/theme.rs
    description: "主题加载与样式映射"
    test_count: 10
  - file: src/tests/toc.rs
    source: leaf-1.26.1/src/tests/toc.rs
    description: "目录（TOC）生成、层级与跳转"
    test_count: 47
  - file: src/tests/update.rs
    source: leaf-1.26.1/src/tests/update.rs
    description: "版本检查与升级提示"
    test_count: 12
  # 下列两个模块位于 src/tests/ 之外，但同样带 #[test] 并由 cargo test 执行，
  # 计入上游测试总数（334 + 8 + 6 = 348）。
  - file: src/markdown/markers.rs
    source: leaf-1.26.1/src/markdown/markers.rs
    description: "Markdown 内联标记解析（模块内嵌单元测试）"
    test_count: 8
  - file: src/terminal.rs
    source: leaf-1.26.1/src/terminal.rs
    description: "终端能力探测与尺寸处理（模块内嵌单元测试）"
    test_count: 6

# test_package 中自带的测试（消费者视角 + 鸿蒙平台专项）
test_package_tests:
  - file: leaf_consumer_test.sh
    description: >
      A 消费者测试：驱动已安装的 leaf 二进制走公开 CLI（--version / --help /
      --inline 渲染文件与 stdin 管道 / 未知参数报错），共 10 项断言
      （A1 ×1、A2 ×2、A3 ×4、A4 ×2、A5 ×1）；
      B 鸿蒙特有测试：校验打包 ELF 的 AArch64 机器类型、HarmonyOS 签名
      (.codesign) 与 OHOS 原生运行库链接（musl，非 glibc），共 3 项断言。
    command: "leaf_consumer_test.sh"
    test_count: 13
  - file: ohos_elf_check.py
    description: "HarmonyOS 平台专项 ELF 校验（由 leaf_consumer_test.sh 调用）"
    test_count: 0

# 上游测试断言总数（实测 = 348，cargo test 实测 348 passed / 0 failed）
assertion_count: 348
