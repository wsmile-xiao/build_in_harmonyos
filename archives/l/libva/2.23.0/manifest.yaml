version: "2.23.0"
status: partial
build_date: "2026-06-05"

source:
  url: "https://github.com/intel/libva/releases/download/2.23.0/libva-2.23.0.tar.gz"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "-Dwith_glx=disabled"
    - "-Dwith_x11=disabled"
    - "-Dwith_wayland=disabled"
  dependencies:
    - libdrm/2.4.133
  cc: clang
  cxx: clang++

products:
  - name: "libva-2.23.0-ohos-aarch64.tar.gz"
    size: "10K"
    components:
      - "libva"
      - "libva-drm"

issues:
  - type: "dependency_missing"
    description: "缺少X11依赖栈，无法启用GLX支持"
    solution: "需先编译或安装完整的X11依赖栈"

knowledge_gained:
  - level: "L1"
    content: "meson构建系统需要完整路径的环境变量（CC, AR, CXX）"
  - level: "L2"
    content: "libdrm预编译包缺少.so软链接，需手动创建"