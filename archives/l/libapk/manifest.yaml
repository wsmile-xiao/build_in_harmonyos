software: libapk
display: "libapk"
description: "Alpine Package Keeper core library (package manager engine)"
category: system
homepage: "https://gitlab.alpinelinux.org/alpine/apk-tools"
license: GPL-2.0-only
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 构建，禁用 docs/help/lua/python，只构建 libapk 共享/静态库与 apk 主程序"
    - "加密后端 openssl，压缩依赖 zlib 与 zstd，全部来自 Conan 已发布包"
    - "上游 cmocka 单元测试在 OHOS 缺发布依赖，build() 用真实 libapk 跑上游 version.data 可比 harness 替代并落盘证据"
  common_dependencies:
    - openssl
    - zlib
    - zstd

versions:
  "3.0.6":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libapk/3.0.6"
