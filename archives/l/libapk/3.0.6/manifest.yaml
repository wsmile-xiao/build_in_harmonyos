version: "3.0.6"
status: built
build_date: "2026-09-19"
conan_ref: "libapk/3.0.6"

source:
  url: "https://gitlab.alpinelinux.org/alpine/apk-tools/-/archive/v3.0.6/apk-tools-v3.0.6.tar.gz"
  sha256: "e9b62742ef7e9e8c1c051efdaed3a2f49d06d8ce20c707697aa23d29bbc7c86a"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Ddocs=disabled"
    - "-Dhelp=disabled"
    - "-Dlua=disabled"
    - "-Dpython=disabled"
    - "-Dtests=disabled"
    - "-Dzstd=enabled"
    - "--wrap-mode=nodownload"
  dependencies:
    - openssl/3.5.8.1
    - zlib/1.3.1.1
    - zstd/1.5.7.1
  build_tools:
    - pkgconf/3.0.5
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "apk-tools 顶层 meson 以 subproject 区分只建静态库，本配方按顶层包构建，libapk.so 与 apk 可执行文件一并安装"
  - "meson 的 openssl/zlib/zstd 依赖经 PkgConfigDeps 由 Conan 依赖暴露，无需系统包"
  - "cmocka 未发布故 -Dtests=disabled，shell/solver 用例依赖目标机 shell；改用真实 libapk 跑上游 version.data 的可比 harness，保证退出码与用例数双真实"
  - "conan MesonToolchain 不写 ar/ranlib 进 native file，从 C 编译器同目录推导 llvm-ar/llvm-ranlib 注入"
  - "meson install 改写 rpath 破坏自签，package() 后剥 .codesign 并 binary-sign-tool -selfSign 1 重签"
  - "OHOS libc 无 fgetpwent/fgetgrent（GNU 扩展）：src/io.c 注入逐行解析嵌套 etc/passwd|group 的回退实现，仅重定向非 Apple 非 glibc/uClibc 分支，glibc/macOS 行为不变"
