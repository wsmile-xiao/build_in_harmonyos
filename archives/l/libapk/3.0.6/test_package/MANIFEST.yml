# test_package/MANIFEST.yml - libapk 3.0.6 upstream + consumer test declaration
package: libapk/3.0.6
homepage: "https://gitlab.alpinelinux.org/alpine/apk-tools"

# Upstream test situation: meson unit (cmocka) + shell/solver suites exist.
# cmocka/2.0.2 is not published in the registry (R36 forbids the reference),
# shell/solver cases depend on the target shell/apk runtime env, so the
# recipe build runs a comparable harness instead: the real built libapk
# over upstream test/unit/version.data plus blob vectors from blob_test.c.
# Counting: version.data raw 788 lines -> 785 non-empty non-comment cases
# (trim line, skip empty or leading '#'; verified against
#  https://raw.githubusercontent.com/alpinelinux/apk-tools/v3.0.6/test/unit/version.data)
# plus 5 blob vectors mirrored from test/unit/blob_test.c
# (3 contains + 2 split) = 790. The probe prints one UPSTREAM-SUMMARY line
# (total/passed/failed); conanfile parses only that line, no stdout counting.
upstream_tests_exist: true
upstream_test_audit: "Audited apk-tools v3.0.6 (tag v3.0.6, commit 7e92634a). test/meson.build registers unit_tests (cmocka, needs unpublished cmocka dep) plus shell (test/user/*.sh) and solver (test/solver/*.test) suites. Recipe sets -Dtests=disabled and instead links the just-built real libapk into build_folder/upstream/upstream_probe, which replays the full upstream test/unit/version.data corpus line-by-line with apk_version_validate/match plus 5 blob vectors from test/unit/blob_test.c (apk_blob_contains/split). version.data non-empty non-comment lines = 785, +5 blob vectors = 790."
upstream_test_total: 790
upstream_test_count_method: auto
upstream_test_passed: 790
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_test_not_run: 0
upstream_test_in_build: true
upstream_test_command: "upstream_probe test/unit/version.data + blob vectors (real libapk)"
upstream_tests:
  - file: test/unit/version.data
    source: apk-tools-v3.0.6/test/unit/version.data
    description: "Upstream version corpus (validate/compare/match per line)"
    command: "./upstream_probe test/unit/version.data"
  - file: test/unit/blob_test.c
    source: apk-tools-v3.0.6/test/unit/blob_test.c
    description: "Upstream blob vectors (contains/split) mirrored in probe"
    command: "./upstream_probe"

# test_package consumer tests (link apk::apk, call real APIs)
test_package_tests:
  - file: test_apk.c
    description: "Consumer links apk::apk and checks version validate/compare/match plus blob contains"
    command: "./test_apk"

assertion_count: 4
