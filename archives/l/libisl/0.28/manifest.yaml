software: libisl
version: "0.28"
status: built
build_date: "2026-09-16"

source:
  url: "https://libisl.sourceforge.io/isl-0.28.tar.xz"
  sha256: "3dc31b8e1b18329e42d5dfbf84dd55e15c59b61569a2ab246f61497d9592f727"
  tar_format: tar.xz

build:
  build_system: autotools
  configure_options:
    - "--with-int=gmp"
    - "--enable-portable-binary"
    - "--with-gmp=system"
    - "--with-gmp-prefix=<gmp package folder>"
    - "--disable-shared/--enable-static or inverse from Conan options"
    - "--with-pic for static fPIC builds"
  dependencies:
    - gmp/6.3.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-tmpdir.patch"

knowledge_gained:
  - "libisl 0.28 is an Autotools project with make check as upstream validation."
  - "The recipe consumes published gmp/6.3.0 through --with-gmp=system and --with-gmp-prefix."
  - "HarmonyOS requires direct linux-ohos recognition in config.guess/config.sub and TMPDIR-aware config.status temp directories."
  - "isl 0.28 probes ffs/__builtin_ffs via configure, so no ffs source patch is needed on OHOS clang."
  - "Upstream shell tests are shipped as .sh.in and generated by configure; make check runs 7 default entries with the gmp backend."

patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: true
    guard: "HarmonyOS uname/config.guess only"
  - file: 0002-config.sub.patch
    type: portability
    platform_only: true
    guard: "linux-ohos triples only"
  - file: 0003-configure-tmpdir.patch
    type: portability
    platform_only: true
    guard: "TMPDIR fallback keeps default behavior when TMPDIR is unset; umask 022 avoids OHOS user-storage ACL denial for config.status awk files"
