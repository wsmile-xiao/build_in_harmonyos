package: libisl/0.28
homepage: "https://libisl.sourceforge.io"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check -j1"

upstream_tests:
  - file: isl_test.c
    source: isl-0.28/isl_test.c
    description: "Main isl C API test driver (set/map/affine arithmetic checks)"
    command: "make check"
  - file: codegen_test.sh
    source: isl-0.28/codegen_test.sh.in (generated as codegen_test.sh by configure)
    description: "AST code generation regression tests"
    command: "make check"
  - file: pip_test.sh
    source: isl-0.28/pip_test.sh.in (generated as pip_test.sh by configure)
    description: "Parametric integer programming solver tests"
    command: "make check"
  - file: bound_test.sh
    source: isl-0.28/bound_test.sh.in (generated as bound_test.sh by configure)
    description: "Polynomial bound computation tests"
    command: "make check"
  - file: isl_test_int.c
    source: isl-0.28/isl_test_int.c
    description: "Integer backend (gmp) arithmetic validation"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Creates an isl context, parses { [i] : 0 <= i <= 41 }, verifies cardinality 42 via isl_set_count_val, and checks contradictory constraints yield an empty set"
    command: "ctest --output-on-failure"

assertion_count: 7
