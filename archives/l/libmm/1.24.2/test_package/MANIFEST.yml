# test_package/MANIFEST.yml
# Upstream official test declaration
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: libmm/1.24.2
homepage: "https://modemmanager.org/"

# Upstream test command (meson-based project)
upstream_check_command: "meson test -C build --no-rebuild --print-errorlogs"

# Upstream tests run in conanfile.py build(); evidence persisted to res/
# upstream_test_result.json in the package and re-emitted by test_package
upstream_test_in_build: true
upstream_test_command: "meson test test-common-helpers test-pco test-qcdm --no-rebuild --print-errorlogs"

# Upstream test-suite audit (mm-1-24 branch, meson.build + per-dir meson.build):
# only test() registrations count towards the total.
upstream_tests_exist: true
upstream_test_audit: "meson introspect --tests on preflight reports 29 registered tests (corrected audit 2026-09-20; the earlier file-grep audit of 3 was wrong because src/plugins and test dirs also call test()): 3 daemon-independent lib tests executed (test-common-helpers, test-pco, test-qcdm); the other 26 need the src daemon which does not compile on OHOS"
upstream_test_total: 29
upstream_test_count_method: "meson_tests"

upstream_tests:
  - file: libmm-glib/tests/test-common-helpers.c
    source: modemmanager_1.24.2.orig.tar.xz/libmm-glib/tests/test-common-helpers.c
    description: "mm-glib common helpers unit test (daemon-independent)"
    command: "meson test test-common-helpers --no-rebuild"
  - file: libmm-glib/tests/test-pco.c
    source: modemmanager_1.24.2.orig.tar.xz/libmm-glib/tests/test-pco.c
    description: "mm-glib PCO helper unit test (daemon-independent)"
    command: "meson test test-pco --no-rebuild"
  - file: libqcdm/tests/test-qcdm.c
    source: modemmanager_1.24.2.orig.tar.xz/libqcdm/tests/test-qcdm.c
    description: "libqcdm protocol unit test (daemon-independent)"
    command: "meson test test-qcdm --no-rebuild"

# test_package consumer-side tests (call real mm-glib APIs, no daemon needed)
test_package_tests:
  - file: test_mm.c
    description: "mm_core_error_quark + mm_modem_state_get_string for UNKNOWN/DISABLED/REGISTERED"
    command: "./test_mm"

# Test assertion count: 4 consumer cases in test_mm.c
assertion_count: 4
