software: libmm
# 版本级 manifest
# 文件位置: archives/l/libmm/1.24.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.24.2"

# 编译状态
# published | built | failed | archived
# （真机 conan 验证前为 built；预检通过后由 HMBS 更新）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"

# 构建系统类型（顶层字段，用于质量门禁）
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游：ModemManager 1.24.2（mm-glib 客户端库）。
  # gitlab.freedesktop.org 有反爬虫，此处使用内容完全相同的上游
  # orig 源码包的权威 Debian 镜像源（仓库内 270+ 配方的通行做法）。
  url: "https://deb.debian.org/debian/pool/main/m/modemmanager/modemmanager_1.24.2.orig.tar.xz"

  # sha256 经 Ubuntu .dsc（Checksums-Sha256）与独立镜像 .dsc 交叉验证
  sha256: "b58d1cf1797c7921ad57f4e7ad01b3122dd28a75bc6138218dc657ea1e81ec93"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表（OHOS 无 systemd/polkit/udev/MBIM/QMI/QRTR，均禁用；
  # tests=true 以构建 daemon 无关的 3 个上游单元测试）
  configure_options:
    - "-Dbash_completion=false"
    - "-Dman=false"
    - "-Dgtk_doc=false"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Dudev=false"
    - "-Dudevdir=/dev/null"
    - "-Dtests=true"
    - "-Dsystemdsystemunitdir=no"
    - "-Dsystemd_suspend_resume=false"
    - "-Dsystemd_journal=false"
    - "-Dpolkit=no"
    - "-Dmbim=false"
    - "-Dqmi=false"
    - "-Dqrtr=false"

  # 构建目标：仅 mm-glib 库 + 3 个 daemon 无关的上游单元测试
  # （daemon 在 src/，因鸿蒙 SDK 头文件冲突无法编译，见 notes.md）
  build_targets:
    - "mm-glib"
    - "test-common-helpers"
    - "test-pco"
    - "test-qcdm"

  # 上游测试（meson introspect --tests 注册 29 个；执行 3 个 daemon 无关单元测试）
  upstream_tests: 29

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib2/2.88.0"
    - "dbus/1.14.10"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - file: "0001-src-mm-netlink.c.patch"
    purpose: "调整头文件顺序，daemon 侧 socket 头文件冲突的已有修复尝试"
  - file: "0002-src-socket-wrapper.h.patch"
    purpose: "新增 socket wrapper 头文件，收敛 linux 与 libc socket 头文件冲突"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "freedesktop.org/GitLab 反爬虫拦截自动化下载，使用 Debian 镜像源替代"
  - "鸿蒙无 systemd/polkit/udev，需要禁用相关功能"
  - "鸿蒙 SDK 头文件冲突：linux/socket.h 和 sys/socket.h 都定义 sockaddr_storage，daemon 不可编译"
  - "mm-glib 库可独立编译（meson target mm-glib），不依赖 ModemManager daemon"
  - "上游 meson test 仅注册 3 个 daemon 无关用例：test-common-helpers、test-pco、test-qcdm"
  - "PkgConfigDeps 只产出 glib-2.0.pc，需手工补 gio/gobject/gio-unix 别名及 glib-mkenums/gdbus-codegen 工具"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/libmm-glib-1.24.2.orig
  source_work_dir: /storage/Users/currentUser/builds/libmm-glib-1.24.2.work
  source_orig_hash: 0db4c0be43c71874
  source_work_hash: 938fd19d0d491cc1
  generated_at: '2026-05-28T14:35:00'
  patches_count: 2

patch_classification:
  - file: 0001-src-mm-netlink.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-src-socket-wrapper.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
