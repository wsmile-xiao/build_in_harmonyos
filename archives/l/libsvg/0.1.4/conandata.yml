sources:
  "0.1.4":
    url: "https://cairographics.org/snapshots/libsvg-0.1.4.tar.gz"
    sha256: "4c3bf9292e676a72b12338691be64d0f38cd7f2ea5e8b67fbbf45f1ed404bc8f"
patches:
  "0.1.4":
    - patch_file: "patches/0001-svgint.h-include-libxml-parser-context.patch"
      patch_description: "Include <libxml/parser.h> in svgint.h so xmlParserCtxtPtr is a complete type under libxml2 2.15 (headers are no longer self-contained via SAX.h)"
      patch_type: "portability"
    - patch_file: "patches/0002-svg_parser_libxml.c-libxml-2.5-SAX-API.patch"
      patch_description: "Include <libxml/parserInternals.h> and use the xmlEntity layout accessors required by modern libxml2 (undeclared xmlEntity/xmlEntityPtr, SAX handler field mismatch)"
      patch_type: "portability"
    - patch_file: "patches/0003-svg_color.c-include-stdlib.h.patch"
      patch_description: "Include <stdlib.h> in svg_color.c for bsearch (C99 clang-15 rejects the implicit declaration as an error)"
      patch_type: "portability"
    - patch_file: "patches/0004-svg_image.c-libpng-1.4-API.patch"
      patch_description: "Replace png_check_sig with png_sig_cmp and png_set_gray_1_2_4_to_8 with png_set_expand_gray_1_2_4_to_8 (both removed in libpng 1.4)"
      patch_type: "portability"
    - patch_file: "patches/0005-config.guess-config.sub-ohos.patch"
      patch_description: "Recognize aarch64-unknown-linux-ohos in the bundled 2003 config.guess/config.sub (HarmonyOS was not a known OS in 2003)"
      patch_type: "portability"
    - patch_file: "patches/0006-configure-umask-022.patch"
      patch_description: "Use umask 022 instead of 077 for the configure mktemp probe directory (HarmonyOS MAC denies 0700 directories created under the Conan build dir)"
      patch_type: "portability"
