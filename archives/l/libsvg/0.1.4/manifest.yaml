package: libsvg
version: "0.1.4"
homepage: "https://cairographics.org/"
license: LGPL-2.1-or-later
status: built
build_system: autotools
build_date: "2026-09-01"

source:
  url: "https://cairographics.org/snapshots/libsvg-0.1.4.tar.gz"
  sha256: "4c3bf9292e676a72b12338691be64d0f38cd7f2ea5e8b67fbbf45f1ed404bc8f"

patches_applied:
  - "0001-svgint.h-include-libxml-parser-context.patch"
  - "0002-svg_parser_libxml.c-libxml-2.5-SAX-API.patch"
  - "0003-svg_color.c-include-stdlib.h.patch"
  - "0004-svg_image.c-libpng-1.4-API.patch"
  - "0005-config.guess-config.sub-ohos.patch"
  - "0006-configure-umask-022.patch"

upstream_tests:
  command: "make check"
  test_count: 0
  notes: >-
    Release tarball contains no test suite: no test/ or tests/ directory, no
    TESTS or check_PROGRAMS in any Makefile.am/Makefile.in, no test scripts,
    no CI configuration. `make check` runs nothing (no check target defined);
    `make test` does not exist. libsvg is a 2003-era snapshot release that
    shipped only the library sources and svg-viewer example.

test_package:
  assertion_count: 66
  description: >-
    Consumer tests linking the installed libsvg package: parses minimal SVG
    (viewport/viewBox/size), rect geometry+fill color, path geometry
    (move/line/curve/close + stroke color/width) and chunked parsing through
    the public API with a recording render engine; negative tests assert
    SVG_STATUS_PARSE_ERROR for malformed XML and tag mismatch, non-success
    for garbage input, and SVG_STATUS_FILE_NOT_FOUND for a missing file.
