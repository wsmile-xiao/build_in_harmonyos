# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: libsvg/0.1.4
homepage: https://cairographics.org/

# 上游测试情况：libsvg 0.1.4 release tarball 无任何测试套件
# - 无 test/ tests/ regression/ 目录
# - Makefile.am / Makefile.in 无 TESTS / check_PROGRAMS
# - 无 shell/python/perl 测试脚本，无 CI 配置
# - make check 无 check 目标（no-op）；make test 目标不存在
# 上游测试数：Total=0 Pass=0 Fail=0 Skip=0
upstream_test_in_build: false
upstream_tests: []

# test_package 自带测试（消费者视角：真实解析断言 + 负向测试）
test_package_tests:
  - file: test.c
    description: >-
      通过公共 API（svg_create/svg_parse_buffer/svg_parse_chunk_*/svg_render/
      svg_get_size/svg_destroy）解析程序化生成的 SVG 文本，用 recording
      render engine 对回调接收到的 viewport/viewBox/rect/path 几何与
      fill/stroke 颜色做确定性断言；含 4 组负向测试（malformed XML、
      tag mismatch、garbage、missing file 均显式断言错误状态码）。
    command: "./libsvg_test"

assertion_count: 66
