- "HarmonyOS不被cmake识别为UNIX，需在CMakeLists.txt中加入CMAKE_SYSTEM_NAME STREQUAL HarmonyOS条件以定义WEBRTC_POSIX和WEBRTC_LINUX (ref: L1-platform)"
- "libilbc.so依赖libc++_shared.so（C++运行时），打包时需确保该库可用"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
