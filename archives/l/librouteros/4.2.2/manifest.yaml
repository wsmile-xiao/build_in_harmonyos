knowledge_gained:
  - "librouteros 是 MikroTik RouterOS 的纯 Python API 客户端（同步 + asyncio），uv_build 构建后端，pip install --prefix 即可打包"
  - "上游 sdist 无任何测试文件（无 test/ 目录），test_package 补全消费者测试（协议字编码/解码、MD5 登录、config 工具函数）"
  - "uv_build 是 PEP 517 纯 Python 构建后端（与 flit_core 同类），build() 阶段 pip 安装即可支持 pyproject build-backend 构建"
  - "ROSType = str|int|bool 三型；协议字编码 encode_word/compose_word、长度编码 encode_length 均为纯函数，可在无设备环境测试"

