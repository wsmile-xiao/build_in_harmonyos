# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librouteros/4.2.2
homepage: "https://github.com/luqasz/librouteros"

# 上游 sdist 无任何测试文件（纯 Python API 客户端包：src/librouteros/*.py），
# 故上游测试命令为空，L1 验证由 test_package 承担（补全消费者测试）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 补全测试说明：上游无测试用例，适配后新增 12 个消费者测试
supplementary_tests:
  - file: test_package/test_librouteros.py
    count: 12
    description: >-
      import 与核心符号（connect/async_connect/Api/AsyncApi）、ConnectKwargs 默认值、
      协议字 parse_word/compose_word（str/int/bool 三型）、长度 encode_length/decode_length
      边界与回环、MD5 token 登录 encode_password（已知向量）、parse_version 版本串解析、
      strip_header 导出头归一化、compare 配置 diff（空/差异）、query Key 运算符构建查询
      生成器。均不需要真实 RouterOS 设备，可在 OHOS 受限环境运行。
