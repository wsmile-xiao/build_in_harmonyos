version: "v0.2.1"
status: built
source:
  url: "https://github.com/MayaPosch/libnymphcast/archive/refs/tags/v0.2.1.tar.gz"
  sha256: "4a824b3aef22e1bc32d4b4fcc6158e7c0e0d674155b031c12a5bdd0c3e534cf0"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - nymphrpc/v0.1.1
    - poco/1.15.3
  cc: clang
  cxx: clang++
  products:
    - type: library
      name: libnymphcast.a
      path: lib/libnymphcast.a

patches_applied:
  - "0001-Makefile-static-only.patch"

knowledge_gained:
  - "C++17 标准是 HarmonyOS SDK libc++ 的最低要求"
  - "NymphRPC v0.1.1 提供 nymph/nymph.h 头与静态 libnymphrpc.a（非 PIC）"
  - "POCO 1.15.3 Conan 包提供 PocoNet/PocoUtil/PocoFoundation/PocoJSON"
  - "nymphrpc 静态库非 PIC，libnymphcast 共享库无法在 OHOS 链接，只构建静态库"
