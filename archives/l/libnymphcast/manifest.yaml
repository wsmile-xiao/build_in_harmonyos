software: libnymphcast
display: "libnymphcast"
description: "NymphCast client library - stream media files to NymphCast receivers"
category: network
homepage: "https://github.com/MayaPosch/libnymphcast"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "需要 NymphRPC (nymph/nymph.h) 与 POCO 1.5+ 依赖"
    - "C++17 标准是 HarmonyOS SDK libc++ 的最低要求"
    - "make 必须 -j1 单线程（OHOS FIFO 限制）"
    - "无上游测试（make test 悬空 target），验证走 test_package 消费层"
  common_dependencies:
    - nymphrpc
    - poco

versions:
  "v0.2.1":
    status: built
    build_date: "2026-08-21"
