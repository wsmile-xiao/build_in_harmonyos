# conandata.yml -- libcontra 0.2.2
# Official upstream: https://git.alteholz.dev/alteholz/libcontra/
# (also recorded as Source in Debian copyright). Upstream publishes no static
# release-tarball URL for 0.2.2 and the git host is unreachable from the
# build network, so the source bytes below come from the Debian pool
# libcontra_0.2.2.orig.tar.bz2, which carries the pristine upstream tree
# (top dir libcontra-v0.2.2). The sha256 was verified against a download of
# the identical .orig file from an Ubuntu mirror (Stanford):
# eb001b3c57e90c8b845c930b442d2de0dc6d2a6c7e8e43ca197ca58de076a3b3.
# All three URLs below serve the same file (same bytes, same sha256).

sources:
  url:
    - "https://deb.debian.org/debian/pool/main/libc/libcontra/libcontra_0.2.2.orig.tar.bz2"
    - "http://ftp.debian.org/debian/pool/main/libc/libcontra/libcontra_0.2.2.orig.tar.bz2"
    - "http://archive.ubuntu.com/ubuntu/pool/universe/libc/libcontra/libcontra_0.2.2.orig.tar.bz2"
  sha256: "eb001b3c57e90c8b845c930b442d2de0dc6d2a6c7e8e43ca197ca58de076a3b3"
# No patches: all source fixes are recipe-side string edits in
# conanfile.py build() (the recorded patch series assumed a longer tree
# than the pristine 0.2.2 tarball and aborted with premature-end errors).
