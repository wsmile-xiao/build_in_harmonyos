# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcontra/0.2.2
homepage: "https://git.alteholz.dev/alteholz/libcontra/"

# 上游测试命令 (testlib/CMakeLists.txt 注册 13 个 ctest 用例)
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# ctest 实际运行的 13 个用例 (全部来自 testlib/)。
# 其中 contra_test_start/end 为首尾 echo 标记, 其余 11 个为真实功能用例:
# contra_test_pwd (harness 自检)、contra_test_server (二进制直调)、
# contra_test_00-08 九组 LD_PRELOAD 日志比对 (00 基础、01 socket、02 bind、
# 03 listen、04 accept+connect、05 recv+send、06 setsockopt+getsockopt、
# 07 gethostbyname+gethostbyaddr、08 freeaddrinfo+getaddrinfo,
# 其中 04/05 含 client/server 双端)。
upstream_tests:
  - file: testlib/test_server_00
    source: libcontra-v0.2.2/testlib/test_server_00
    description: "用例 00: 基础 server 启动, 日志与 log-template 比对"
    command: "ctest -R contra_test_00 --output-on-failure"
    tests: 1
  - file: testlib/test_server_01
    source: libcontra-v0.2.2/testlib/test_server_01
    description: "用例 01: socket() 拦截日志比对"
    command: "ctest -R contra_test_01 --output-on-failure"
    tests: 1
  - file: testlib/test_server_02
    source: libcontra-v0.2.2/testlib/test_server_02
    description: "用例 02: bind() 拦截日志比对"
    command: "ctest -R contra_test_02 --output-on-failure"
    tests: 1
  - file: testlib/test_server_03
    source: libcontra-v0.2.2/testlib/test_server_03
    description: "用例 03: listen() 拦截日志比对"
    command: "ctest -R contra_test_03 --output-on-failure"
    tests: 1
  - file: testlib/test_server_04
    source: libcontra-v0.2.2/testlib/test_server_04
    description: "用例 04: accept()+connect() 双端日志比对"
    command: "ctest -R contra_test_04 --output-on-failure"
    tests: 1
  - file: testlib/test_server_05
    source: libcontra-v0.2.2/testlib/test_server_05
    description: "用例 05: recv()+send() 双端日志比对"
    command: "ctest -R contra_test_05 --output-on-failure"
    tests: 1
  - file: testlib/test_server_06
    source: libcontra-v0.2.2/testlib/test_server_06
    description: "用例 06: setsockopt()+getsockopt() 日志比对"
    command: "ctest -R contra_test_06 --output-on-failure"
    tests: 1
  - file: testlib/test_server_07
    source: libcontra-v0.2.2/testlib/test_server_07
    description: "用例 07: gethostbyname()+gethostbyaddr() 日志比对"
    command: "ctest -R contra_test_07 --output-on-failure"
    tests: 1
  - file: testlib/test_server_08
    source: libcontra-v0.2.2/testlib/test_server_08
    description: "用例 08: freeaddrinfo()+getaddrinfo() 日志比对"
    command: "ctest -R contra_test_08 --output-on-failure"
    tests: 1
  - file: testlib/test_pwd_script
    source: libcontra-v0.2.2/testlib/test_pwd_script
    description: "contra_test_pwd: 测试 harness 自检 (pwd 可执行)"
    command: "ctest -R contra_test_pwd --output-on-failure"
    tests: 1
  - file: testlib/test_server.c
    source: libcontra-v0.2.2/testlib/test_server.c
    description: "contra_test_server: test_server 二进制直调 (确认构建成功)"
    command: "ctest -R contra_test_server --output-on-failure"
    tests: 1
  - file: testlib/CMakeLists.txt
    source: libcontra-v0.2.2/testlib/CMakeLists.txt
    description: "contra_test_start/end: 首尾 echo 标记用例"
    command: "ctest -R contra_test_start --output-on-failure"
    tests: 2

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libcontra.c
    description: "链接打包后的 contra 库, 实调 libcontra_init/af2string/sock2string/oname2string 共 7 个断言, 另含一次真实 socket() 调用"
    command: "./test_libcontra"
    assertions: 7

upstream_test_count: 13
consumer_test_count: 1
consumer_assertion_count: 7
assertion_count: 20

# 审计说明: 上游存在测试, 且配方 build() 中 via cmake.test() 完整执行。
upstream_tests_exist: true
upstream_test_audit: >
  检查范围: libcontra 0.2.2 上游源码树 (Debian pool
  libcontra_0.2.2.orig.tar.bz2, 顶层目录 libcontra-v0.2.2,
  sha256 eb001b3c57e90c8b845c930b442d2de0dc6d2a6c7e8e43ca197ca58de076a3b3)。
  顶层 CMakeLists.txt 含 include(CTest)/enable_testing() 并
  add_subdirectory(testlib); testlib/CMakeLists.txt 用 13 条 add_test()
  注册用例 (contra_test_start、contra_test_pwd、contra_test_server、
  contra_test_00-08、contra_test_end), 逐条已清点, 无遗漏。
  功能用例为 bash 脚本 (test_server_00-08、test_client_00/04、
  test_server_common), 通过 LD_PRELOAD 预加载构建出的 libcontra.so,
  运行 test_server/test_client 二进制并将日志输出与
  testlib/log-template/ 下的 11 份模板文件做 diff 比对;
  比对前用 cut -b26- 剥离 25 字符时间戳、用 sed 剥离版本号,
  故时间戳与版本差异不影响判定。结论: 上游存在测试 (13 个 ctest 用例),
  配方在真机 build() 阶段以 cmake.test() 真实完整执行, 不跳过、
  不替换, 数字以真机 ctest 输出为准。
