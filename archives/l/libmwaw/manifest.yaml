software: libmwaw
display: "libmwaw"
description: "旧版 Mac 文本文档（MacWrite/ClarisWorks 等）解析库，基于 librevenge 流接口"
category: data
homepage: "https://sourceforge.net/projects/libmwaw/"
license: LGPL-2.1-or-later OR MPL-2.0
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "0.3.23 起自带 2024 版 config.sub（原生支持 linux-ohos），仅 config.guess 需补 HarmonyOS 识别分支（GUESS= 风格）"
    - "configure 的 umask 077 临时目录在 HMDFS 上不可写，需改为 022"
    - "依赖 librevenge 包发布的 .pc/.la 文件 prefix 硬编码为 /，需在配方内做 .a + 本地 .pc staging"
    - "包内删除 bin/ 与 *.la（src/tools 无条件构建但归 libmwaw-tools；.la 内嵌构建绝对路径）"
    - "zlib 需 force 直接依赖（1.3.1.1 PIC 变体），cpp_info.requires 才能引用"
  common_dependencies:
    - librevenge
    - zlib

# 版本索引
versions:
  "0.3.23":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libmwaw/0.3.23"
