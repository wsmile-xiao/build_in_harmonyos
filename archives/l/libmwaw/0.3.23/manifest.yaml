# 版本级 manifest — libmwaw 0.3.23
# 遵循 ARCHIVE-SPEC v2.0 (交叉校验元数据；CI 唯一构建输入是 conanfile.py)

version: "0.3.23"
software: "libmwaw"

# 编译状态: published | built | failed | archived
status: built

# 编译日期
build_date: "2026-09-19"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://sourceforge.net/projects/libmwaw/files/libmwaw/libmwaw-0.3.23/libmwaw-0.3.23.tar.xz/download"
  sha256: "ac3590f691a2904eb8c7dc8b757b8a29f125f592449e421459ae8fa928b399eb"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--with-docs=no"
    - "--disable-tools"
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - "librevenge/0.0.5"
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-ohos-config.guess-harmonyos-recognition.patch"
  - "patches/0002-ohos-configure-umask-hmdfs-fix.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libmwaw 0.3.23 自带的 config.sub 已是 2024 版，原生接受 linux-ohos* 三元组；旧版（0.3.22 的 2014 config.sub）需要的 linux-ohos 白名单补丁在新版上不再适用也不再需要，适配前先核 config.sub 年份与 ohos 支持"
  - "2024 版 config.guess 主 case 不带引号且用 GUESS= 变量赋值风格，HarmonyOS 分支需按新风格插入（GUESS=$UNAME_MACHINE-unknown-linux-ohos）"
  - "设备 HMDFS 上 patch(1) 二进制对文件的就地改写会静默丢失（apply 报 rc=0、sha256 不变）；补丁有效性验证要用 dry-run（只比对 hunk）+ Python 应用后实测，真实构建走 conan 的 Python 补丁应用不受影响"
  - "包内 staging（.a + 本地生成 .pc）方案对库包同样适用；默认 --disable-tools 后 make install 只落 lib/ 与 include/，库包打包干净"
