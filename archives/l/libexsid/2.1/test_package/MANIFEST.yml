# Upstream and consumer test declaration for CI L0e.
package: libexsid/2.1
homepage: "https://github.com/libsidplayfp/exsid-driver"

# Tag source has no tests/ directory or Automake TESTS declarations.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []

# One consumer executable checks version macros, version compatibility,
# allocation/free, and NULL-handle error behavior without USB hardware.
test_package_tests:
  - file: test.c
    source: test_package/test.c
    description: "Consumer API checks for version macros, handle lifetime, and error-string NULL behavior"
    command: "./test_libexsid"

ohos_note: |
  Upstream contains no declared unit/integration tests. The consumer test uses
  only allocation and header-level API behavior; it does not require an exSID
  USB device or attempt hardware I/O.
