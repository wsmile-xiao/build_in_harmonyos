patches_applied: []

knowledge_gained:
  - "Upstream 11.8.17 is autotools with sole glib-2.0>=2.16 dependency (PKG_CHECK_MODULES); headers install to include/libmpd-1.0/libmpd/"
  - "No upstream automated suite (no TESTS/check_PROGRAMS); example/testcase needs a live MPD server, so recipe emits no_tests evidence"
  - "Consumer test stays offline: MpdObj lifecycle + setters/getters + tag lookup, 8 CHECK-OK lines"

upstream_test_total: 0
upstream_test_count_method: autotools_tests
