# test_package/MANIFEST.yml
package: lazarus/4.8
homepage: "https://www.lazarus-ide.org/"

# Upstream ships a fpcunit suite under test/ (runtests.lpi console runner,
# runtestsgui.lpi GUI runner).  The registered-test inventory is taken from the
# console runner itself: `./runtests --list` -> 406 tests in 353 suites.
upstream_tests_exist: true
upstream_test_total: 406
upstream_test_count_method: "runner --list (fpcunit console runner)"
upstream_check_command: "lazbuild test/runtests.lpi && ./runtests --all"
upstream_test_in_build: false
upstream_test_command: "lazbuild --ws=nogui test/runtests.lpi && ./runtests --all"

upstream_execution:
  channel: "aarch64 OHOS deliverable built by this recipe (nogui LCL), executed through qemu-binfmt in the adaptation workdir"
  command: "lazbuild --ws=nogui test/runtests.lpi && ./runtests --suite=<T*> for the 14 unit-test suites"
  registered: 406
  suites: 353
  executed: 48
  passed: 41
  failed: 3
  errors: 4
  pass_rate: "41/48 (85.4%)"
  not_run: 358
  not_run_reason: >-
    Bugs (40) / Projects (168) / Packages (149) are compile-and-run-project
    suites: every case drives lazbuild on a standalone project or package, and
    many need a complete GUI widgetset plus an X server, which HarmonyOS PC
    (headless) does not provide.  Through the qemu-binfmt local channel they
    also take hours (the --all run stalled on the first bug project).
  deviations:
    - "6 cases are nogui-widgetset artefacts: TTestPen 'Creating of APen failed' (2) and TTestPreferredSize EAccessViolation (4) - without a widgetset there are no real widget handles."
    - "1 case is a code-page round-trip difference: TTestLConvEncoding.Test_CP_UTF8_CP, cp852 char #128 returns #199."
  test_only_patches:
    - "test/runtests.lpr: drop lazmouseandkeyinput from the uses clause (it pulls -lXtst / X11)."
    - "test/runtests.lpi: drop the lazmouseandkeyinput RequiredPackage."
    - "test/testunits.pas: drop TestListView (depends on MouseAndKeyInput)."

upstream_tests:
  - file: test/runtests.lpi
    source: "lazarus-4.8-0.tar.gz: test/"
    description: "fpcunit console runner; 406 registered tests in 353 suites (Bugs, LazUtils, LCL, IDEIntf, Projects, Packages)"
    command: "lazbuild test/runtests.lpi && ./runtests --all"

test_package_tests:
  - file: test.sh
    description: "Boot path: the installed bin/lazbuild exists, is executable and reports version 4.8 via --version and -v."
    command: "lazbuild --version",
  - file: test.sh
    description: "Headless CLI contract: lazbuild --help exits 0 (the IDE/LCL have no X server on HarmonyOS PC)."
    command: "lazbuild --help"
  - file: test.sh
    description: "Installed LCL nogui unit tree contains lcl.ppu and interfaces.ppu."
    command: "find <pkg>/share/lazarus/lcl/units -name lcl.ppu"
  - file: test.sh
    description: "Installed tools (lazres, updatepofiles, lrstolfm) are present in share/lazarus/tools."
    command: "test -f <pkg>/share/lazarus/tools/lazres"

test_scenario_count: 4
assertion_count: 9