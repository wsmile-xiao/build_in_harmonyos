knowledge_gained:
  - "交付范围为 make lazbuild（lazbuild + nogui LCL + 工具）：OHOS PC 无 X server，GTK/Qt widgetset 无法开显示。"
  - "FPC 的 GTK2 绑定请求 glibc 时代 soname（-lglib-2.0.0/-lgdk-x11-2.0/-lgdkglext-x11-1.0），OHOS GTK2 栈不提供，且 gtk2/2.24.33 传递闭包在制品仓不完整（pango/libxrender 缺 binary）。"
  - "fpc 包启动器用命令行 -Fu 传入全部 unit 目录且排在调用方之前；FPC 取首个匹配，导致其 fv 包遮蔽 LCL 的 menus/dialogs。下游需把 FPC unit 目录置于调用方 -Fu 之后。"
  - "OHOS sysroot 的 libdl.a/libpthread.a 为空占位，dlopen 在 musl libc.so；FPC 链接需显式 -Fl<sysroot>。"
  - "lazarus Makefile 会用宿主 gcc 的 -print-libgcc-file-name 注入 x86_64 gcc 目录；交叉构建必须 GCCLIBDIR= 覆盖，否则 crtbegin.o 架构不符。"
  - "FPC 的 cprt0.o 引用 glibc 专有 __libc_csu_init/__libc_csu_fini；OHOS 需链接空实现 shim，并把 .interp 改为 /lib/ld-musl-aarch64.so.1。"
