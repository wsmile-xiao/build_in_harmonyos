software: lazarus
display: "Lazarus IDE"
description: "Lazarus 4.8 —— Free Pascal 的 LCL 组件库与 RAD IDE，含 lazbuild 命令行构建工具。"
category: ide
homepage: "https://www.lazarus-ide.org/"
license: "GPL-2.0-or-later AND LGPL-2.1-or-later (with static-linking exception)"
build_system: custom

ohos_adaptation:
  key_points:
    - "FPC 3.2.2 无 ohos 目标，lazarus 随 fpc 以 aarch64-linux 为目标；LCL/IDE 需 dlopen，链接 OHOS musl libc.so，产物为动态可执行文件。"
    - "修复 FPC 启动器 -Fu 顺序：FPC 取首个匹配目录，其 fv 包会遮蔽 LCL 的 menus/dialogs；配方生成 wrapper 把 FPC 包 unit 目录置于调用方 -Fu 之后。"
    - "补 OHOS sysroot（libdl.a/libpthread.a 为 8 字节占位，真正符号在 musl libc.so），并以 GCCLIBDIR= 阻止注入宿主 x86_64 gcc 目录。"
    - "FPC 的 glibc 启动对象 cprt0.o 引用 __libc_csu_init/__libc_csu_fini；配方链接一个空实现 shim，并把 ELF 解释器由 /lib/ld-linux-aarch64.so.1 改为 /lib/ld-musl-aarch64.so.1。"
    - "HarmonyOS PC 无 X server，GUI 无法显示；按 bluefish 先例交付编译/链接级产物并以无头 CLI（lazbuild --version/--help）验证。"
  common_dependencies:
    - fpc/3.2.2

versions:
  "4.8":
    status: built
    build_date: "2026-09-26"
    conan_ref: "lazarus/4.8"
