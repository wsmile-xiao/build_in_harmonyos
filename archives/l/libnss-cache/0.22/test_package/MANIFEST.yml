# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libnss-cache/0.22
homepage: "https://github.com/google/libnss-cache"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check 目标 = test_getent)
upstream_tests:
  - file: gen_getent.c
    source: libnss-cache-0.22/gen_getent.c
    description: "生成 passwd/group/shadow/gshadow 缓存并 diff 验证输出正确性"
    command: "./gen_getent && diff .testdata/passwd.cache .testdata/passwd.cache.out && diff .testdata/group.cache .testdata/group.cache.out && diff .testdata/shadow.cache .testdata/shadow.cache.out && diff .testdata/gshadow.cache .testdata/gshadow.cache.out"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "调用被测库公开 API _nss_cache_setpwent_path 验证库可链接且路径设置生效"
    command: "./test_libnss-cache"

# 测试断言总数 (近似值)
assertion_count: 4