# test_package/MANIFEST.yml — libmatheval 1.1.11
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/ADAPTATION_GUIDE.md §6。

package: libmatheval/1.1.11
homepage: "https://www.gnu.org/software/libmatheval/"

# 上游测试命令（手动复现）：make check 走 autotest 套件 tests/*.at
upstream_check_command: "make check (SUBDIRS 全量：tests 驱动为 guile 扩展，本目标不可构建)"

# conanfile.py build() 中是否已集成上游测试（层1）
# 否：上游 make check 驱动 tests/matheval 无条件 #include <libguile.h> 且调用
# guile 1.8/2.0 已移除 API（scm_sizet/scm_makfrom0str…），本仓 guile 2.2 无法编译；
# 按规则如实标注不可运行，不伪造通过数。build() 只 make SUBDIRS=lib 裁剪 doc/tests。
# 等价运行级覆盖改由 test_package 用公开 C API 逐条复现 tests/*.at 数值 oracle。
upstream_test_in_build: false
upstream_test_command: "不适用（上游 autotest 套件驱动为 guile 扩展，libguile 1.8/2.0 API 缺失，如实未运行）"

# 上游可运行测试数：套件共 118 条 AT_CHECK（basics 11 + numbers 4 + constants 16
# + variables 8 + functions 64 + un_ops 3 + bin_ops 12），但驱动 tests/matheval 是
# guile 扩展在本目标不可构建 → 原生可运行数 0；118 条 oracle 全部由 test_package
# 用公开 C API 逐条复现实跑（见下）。
upstream_test_count: 0
upstream_test_cases_skipped: 0

# 上游套件构成（tests/*.at：118 条 AT_CHECK = 数值求值 68 + get_string 原样 2
# + 符号导数 get_string 44 + get_variables 4），驱动 tests/matheval 是 guile 扩展
# → 不可运行。
upstream_tests:
  - file: tests/basics.at
    source: libmatheval-1.1.11/tests/basics.at
    description: "autotest basics 组（guile 驱动，本目标不可构建/运行）"
    command: "make check (不可运行：依赖 libguile.h + guile 1.8/2.0 已移除 API)"
  - file: tests/functions.at
    source: libmatheval-1.1.11/tests/functions.at
    description: "autotest functions 组（guile 驱动，本目标不可构建/运行）"
    command: "make check (不可运行：依赖 libguile.h + guile 1.8/2.0 已移除 API)"

# test_package 自带的消费者测试：用公开 C API 全量复现上游 .at 全部 118 条
# AT_CHECK oracle（同一表达式、同一变量绑定、同一 15 位有效数字期望；字符串类
# oracle 逐字节比对），另含 1 条本适配新增的非法表达式 NULL 检查，合计 119。
test_package_tests:
  - file: test_package/test_matheval.c
    description: "C-API 消费者测试：全量复现 tests/*.at 118 条 oracle（basics 11 + numbers 4 + constants 16 + variables 8 + functions 64 + un_ops 3 + bin_ops 12）+ 非法表达式新增 1 = 119，CI 实跑"
    command: "./test_matheval"

# 测试断言总数（test_package 119 项 = 上游 118 条 oracle 全量复现 + 新增 1）
assertion_count: 119
