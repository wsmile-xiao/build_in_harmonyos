software: libbcg729
build_system: cmake
version: "1.1.2"
status: built
build_date: "2026-08-26"

source:
  url: "https://github.com/BelledonneCommunications/bcg729/archive/refs/tags/1.1.2.tar.gz"
  sha256: "9c22d98c2debc1e37163b8a703f05278ad5d9c03f1c6b373629d8a072092184a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_STRICT=OFF"
    - "-DENABLE_UNIT_TESTS=OFF"
    - "-DBUILD_SHARED_LIBS=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Upstream ships a clean native CMakeLists.txt (project BCG729 1.1.2); use Conan CMakeToolchain directly — no build-system rewrite needed."
  - "ENABLE_STRICT=YES upstream adds -Werror -Wextra; harmless warnings on the OHOS clang toolchain become hard failures — disable it, but keep real compile errors visible."
  - "ENABLE_UNIT_TESTS upstream needs large speech test-data files under test/bin/ and reaches into private (non-exported) symbols; disable it for cross-compile and cover the public ABI via a custom test_package round-trip."
  - "Upstream target/soname is `bcg729` (libbcg729.so / -lbcg729); package_info exposes lib `bcg729`, cmake target libbcg729::bcg729, pkg-config libbcg729."

verified:
  device: "HarmonyOS PC aarch64 (HongMeng Kernel 1.12.0), ohos profile clang 15"
  date: "2026-08-26"
