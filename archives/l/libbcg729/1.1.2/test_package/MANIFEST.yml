# MANIFEST.yml — libbcg729 1.1.2 test_package
# Declares the upstream test provenance for this L1 test (ARCHIVE-SPEC §2.2).

package: libbcg729/1.1.2
test_type: conan-l1
test_origin: custom
upstream_test: false
description: >
  Custom smoke test exercising the public bcg729 encoder/decoder API round-trip
  (initBcg729EncoderChannel -> bcg729Encoder -> initBcg729DecoderChannel ->
  bcg729Decoder -> close) on a silence frame. Upstream's ENABLE_UNIT_TESTS
  tests require large speech test-data files and reach into private symbols,
  so they are disabled for cross-compile; this custom test covers the public
  ABI instead.
test_sources:
  - test.c
build_system: cmake
runs_on_target: true
