# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lzop/1.04
homepage: "https://www.lzop.org/"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: lzop-1.04.tar.gz, sha256 7e72b62a8a60aff5200a047eea0773a8fb205caf7acbe1774d95147f305a2f41)
upstream_test_audit:
  source_tarball: "lzop-1.04.tar.gz"
  source_sha256: "7e72b62a8a60aff5200a047eea0773a8fb205caf7acbe1774d95147f305a2f41"
  top_level_files:
    - configure.ac        # AC_CONFIG_FILES 仅 Makefile + src/Makefile; 无 AC_CONFIG_TESTDIR / 测试宏
    - Makefile.am         # 仅 bin_PROGRAMS = src/lzop + dist 文档安装, 无 TESTS / check_PROGRAMS / check-local
    - src/Makefile.am     # 仅 lzop 程序构建目标, 无 check_PROGRAMS / TESTS
    - src/lzop.c          # 纯实现源, 无 TEST()/TEST_F (gtest) / def test_ (pytest)
    - src/lzop.h          # 纯头文件
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.am TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest 目标"
    - "find . -name '*test*' (全树)"
  scan_result: "0 matches — 全树无 tests/ 目录; find -name '*test*' 仅命中 autoconf 生成脚本; Makefile.am 无 TESTS/check_PROGRAMS; configure.ac 无测试宏"
  make_check_output: "make -n check 展开为空 (check-am: all-am) — automake 默认空目标, make check 执行 0 用例退出 0"
  reason: "lzop 1.04 为纯 CLI 压缩工具, 官方源码包不含任何测试套件: 无 tests/ 目录、无测试源文件、无 TESTS/check_PROGRAMS 目标、configure.ac 无 AC_CONFIG_TESTDIR; make check 是 automake 空目标 (check-am: all-am)。功能验证由 test_package 真实执行 lzop 二进制 (--version + 压缩/解压往返 cmp) 完成"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test.sh
    description: "功能测试: lzop --version + 真实压缩(lzop -c)/解压(lzop -dc)往返并 cmp 内容一致"
    command: "bash test.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test.sh 并输出 HMBS 机器证据标记 (test_package discovered=3/passedCount=3 + 上游 no_tests/0)"
    command: "conan test test_package"

# 测试断言总数 (test.sh 的 3 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=3 一致)
assertion_count: 3
