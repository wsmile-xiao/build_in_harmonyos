software: lzop
display: "lzop"
description: "lzop 是基于 LZO 压缩库的文件压缩工具（类似 gzip，速度更快）"
category: compress
homepage: "https://www.lzop.org/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需更新以识别 OHOS (aarch64-linux-ohos) 平台 (E007)"
    - "configure 的 umask 077 临时目录在 HMDFS 上不可写, 改为 022 (E011/E114)"
    - "依赖 lzo2/2.10 (LZO 压缩库), AutotoolsDeps 传递 -I/-L/-l"
    - "命令行工具: 软件级 commands.json 声明 (R38)"
  common_dependencies:
    - lzo2

versions:
  "1.04":
    status: built
    build_date: "2026-08-13"
