software: LWP-Protocol-https
display: "LWP::Protocol::https"
description: "Provide HTTPS support for LWP::UserAgent"
category: network
homepage: "https://github.com/libwww-perl/LWP-Protocol-https"
license: Artistic-1.0-Perl OR GPL-1.0-or-later
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无 XS 组件"
    - "依赖链完整：Net::SSLeay → IO::Socket::SSL → Net::HTTP → perl-libwww"
    - "XS 模块（Net::SSLeay）受 SELinux HMDFS 限制，需安装到系统目录"
    - "Net::SSLeay 编译需要 -nostartfiles -nodefaultlibs 链接参数"
  known_issues:
    - "XS 模块无法从用户目录加载（SELinux HMDFS 限制）"
    - "需要管理员协助安装 HNP 包到系统目录"
  solutions:
    - "HNP 包方案：将 Net::SSLeay 打包安装到 /data/service/hnp/perl.org/perl_5.42.0/lib"
    - "等待 cmd-pkgs 发布预编译包"
  common_dependencies:
    - IO-Socket-SSL/2.085
    - Net-SSLeay/1.85
    - Net-HTTP/6.23
    - perl-libwww/6.81-r0

versions:
  "6.14":
    status: built
    build_date: "2025-06-15"
    dependencies:
      - Net::SSLeay/1.85 (XS, SELinux limited)
      - IO::Socket::SSL/2.085 (pure Perl)
      - Net::HTTP/6.23 (pure Perl, working)
      - perl-libwww/6.81-r0 (working)
    blockers:
      - "XS module cannot load from ~/usr/local/lib (SELinux HMDFS)"