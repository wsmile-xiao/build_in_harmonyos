version: "6.14"
status: built
build_date: "2025-06-15"
published_as: LWP-Protocol-https

source:
  url: "https://cpan.metacpan.org/authors/id/O/OA/OALDERS/LWP-Protocol-https-6.14.tar.gz"
  sha256: "59cdeabf26950d4f1bef70f096b0d77c5b1c5a7b5ad1b66d71b681ba279cbb2a"
  tar_format: tar.gz

build:
  system: perl
  configure_options:
    - "perl Makefile.PL PREFIX=~/usr/local"
  dependencies:
    - IO-Socket-SSL/1.970
    - Net-HTTP/6
    - perl-libwww/6.06
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "纯 Perl 模块，编译简单，只需 perl Makefile.PL && make install"
  - "运行时依赖 IO::Socket::SSL 和 Net::HTTPS，这些模块需要先编译安装"
  - "Net::SSLeay XS 模块编译需要 -nostartfiles -nodefaultlibs 链接参数"
  - "XS 模块受 SELinux HMDFS 限制，需安装到系统目录"

functional_status:
  test_date: "2026-06-16"
  result: "partial"
  issues:
    - "Net::SSLeay XS 模块编译成功但受 SELinux HMDFS 限制"
    - "需要 HNP 包安装到系统目录才能加载"
  blockers:
    - "XS 模块无法从 ~/usr/local/lib 加载"
  dependencies_compiled:
    - Net::SSLeay/1.85 (XS, SELinux limited)
    - IO::Socket::SSL/2.085 (pure Perl)
    - Net::HTTP/6.23 (pure Perl, working)