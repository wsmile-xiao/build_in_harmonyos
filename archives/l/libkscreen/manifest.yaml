software: libkscreen
display: "libkscreen"
description: "KDE Plasma 屏幕管理库（KF6Screen：多屏配置模型 + Wayland/fake 后端 + kscreen-doctor）"
category: desktop
homepage: "https://invent.kde.org/plasma/libkscreen"
license: "LGPL-2.1-or-later AND BSD-3-Clause AND GPL-2.0-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "KDE Plasma 屏幕管理：Config/Output/Mode/Screen/EDID 公有 API"
    - "依赖 Qt6(Core/DBus/Gui/WaylandClient)+ECM+Wayland Client+plasma-wayland-protocols"
    - "OHOS 无 XCB：XRandR 后端与 XCB DPMS 裁剪，Wayland 后端保留"
    - "plasma-wayland-protocols 未发布：配方携带 1.21 源码注入协议目录"
  common_dependencies:
    - "qtbase/6.11.1.2"
    - "qtwayland/6.11.1"
    - "wayland/1.22.0"
    - "ecm/6.26.0"

versions:
  "6.7.2":
    status: built
    build_date: "2026-09-19"
    source_url: "https://download.kde.org/stable/plasma/6.7.2/libkscreen-6.7.2.tar.xz"
    packaging: "6.7.2/"
