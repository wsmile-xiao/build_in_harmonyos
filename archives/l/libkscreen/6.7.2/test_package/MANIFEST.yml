# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libkscreen/6.7.2
homepage: "https://invent.kde.org/plasma/libkscreen"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <build> -R 'kscreen-' --output-on-failure"

# 上游实际运行的测试程序（BUILD_TESTING=ON 时 autotests/CMakeLists.txt
# 通过 kscreen_add_test 注册的 QTest 目标；testxrandr 需 XCB，测试时
# ENABLE_XRANDR_TESTS 未启用故未注册；testkwaylandbackend/testkwaylandconfig
# 需要 KF6::WaylandServer（上游 FIXME 标注 KF6 中不存在），CMake 配置阶段
# return() 跳过注册）
upstream_tests:
  - file: autotests/testscreenconfig.cpp
    source: libkscreen-6.7.2/autotests/testscreenconfig.cpp
    description: "QTest: screen config loading from fake backend JSON fixtures"
    command: "./testscreenconfig"
  - file: autotests/testconfigserializer.cpp
    source: libkscreen-6.7.2/autotests/testconfigserializer.cpp
    description: "QTest: config/mode/screen serialization round-trip"
    command: "./testconfigserializer"
  - file: autotests/testconfigmonitor.cpp
    source: libkscreen-6.7.2/autotests/testconfigmonitor.cpp
    description: "QTest: config monitor notifications"
    command: "./testconfigmonitor"
  - file: autotests/testinprocess.cpp
    source: libkscreen-6.7.2/autotests/testinprocess.cpp
    description: "QTest: in-process fake backend load/apply"
    command: "./testinprocess"
  - file: autotests/testbackendloader.cpp
    source: libkscreen-6.7.2/autotests/testbackendloader.cpp
    description: "QTest: backend loader plugin discovery"
    command: "./testbackendloader"
  - file: autotests/testlog.cpp
    source: libkscreen-6.7.2/autotests/testlog.cpp
    description: "QTest: logging category setup"
    command: "./testlog"
  - file: autotests/testmodelistchange.cpp
    source: libkscreen-6.7.2/autotests/testmodelistchange.cpp
    description: "QTest: mode list change tracking"
    command: "./testmodelistchange"
  - file: autotests/testedid.cpp
    source: libkscreen-6.7.2/autotests/testedid.cpp
    description: "QTest: EDID parser"
    command: "./testedid"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    source: test_package/test.cpp
    description: "consumer test: build Config/Screen/Output/Mode via public API, clone output, canBeApplied validation"
    command: "./test_libkscreen"
