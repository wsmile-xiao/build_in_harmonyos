# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: ltl2ba/1.3
homepage: "https://lsv.ens-paris-saclay.fr/~gastin/ltl2ba/"

# ltl2ba has no make check / ctest — it is a CLI translator with no
# bundled test suite. The upstream usage examples in README are
# `./ltl2ba -f 'formula'`; we mirror those as consumer-side tests.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: "./ltl2ba -f '[]p'"

upstream_tests:
  - file: N/A
    source: N/A
    description: "ltl2ba ships no test suite; upstream usage is interactive CLI"
    command: "./ltl2ba -f '[]p'"

test_package_tests:
  - file: test.sh
    description: "Runs installed ltl2ba on []p, <>p, p U q; asserts exit 0 + Büchi never claim"
    command: "bash test.sh <pkg-bin>/ltl2ba"

assertion_count: 6
