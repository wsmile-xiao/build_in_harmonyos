# ltl2ba 软件级 manifest
software: ltl2ba
display: "LTL2BA"
description: "ltl2ba 是线性时序逻辑 (LTL) 到 Büchi 自动机的快速翻译器，输出 Spin never claim 供模型检查器使用"
homepage: "https://lsv.ens-paris-saclay.fr/~gastin/ltl2ba/"
license: GPL-2.0-or-later
repository: https://lsv.ens-paris-saclay.fr/~gastin/ltl2ba/
category: verification
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "上游仅提供简单 Makefile（无 CMake、无 autotools configure），在 build() 中覆盖 CC/CFLAGS 即可交叉编译"
    - "parse.c/lex.c 为手写 C（非 flex/bison 生成），无需额外工具链"
    - "所有头文件均为标准 POSIX（stdio/stdlib/string/unistd/sys/time/sys/resource），无 Linux 专属假设，零 patch"
    - "构建产物为单一可执行文件 ltl2ba，安装到 package/bin（非库）"
    - "许可证为 GPL-2.0-or-later（附 LICENSE 文件）"
  common_dependencies: []

# 版本索引
versions:
  "1.3":
    status: built
    build_date: "2026-08-26"
