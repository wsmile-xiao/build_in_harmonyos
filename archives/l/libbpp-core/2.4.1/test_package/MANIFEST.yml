package: libbpp-core/2.4.1
homepage: "https://github.com/BioPP/bpp-core"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - {file: test/test_bfgs.cpp, source: bpp-core-2.4.1/test/test_bfgs.cpp, description: "BFGS optimizer test", command: "ctest -R test_bfgs"}
  - {file: test/test_dAGraphObs.cpp, source: bpp-core-2.4.1/test/test_dAGraphObs.cpp, description: "DAG graph observer test", command: "ctest -R test_dAGraphObs"}
  - {file: test/test_derivative1.cpp, source: bpp-core-2.4.1/test/test_derivative1.cpp, description: "numerical derivative test", command: "ctest -R test_derivative1"}
  - {file: test/test_distributions.cpp, source: bpp-core-2.4.1/test/test_distributions.cpp, description: "discrete distributions test", command: "ctest -R test_distributions"}
  - {file: test/test_downhill.cpp, source: bpp-core-2.4.1/test/test_downhill.cpp, description: "downhill simplex test", command: "ctest -R test_downhill"}
  - {file: test/test_eigen.cpp, source: bpp-core-2.4.1/test/test_eigen.cpp, description: "eigen decomposition test", command: "ctest -R test_eigen"}
  - {file: test/test_gradient.cpp, source: bpp-core-2.4.1/test/test_gradient.cpp, description: "gradient test", command: "ctest -R test_gradient"}
  - {file: test/test_graphObs.cpp, source: bpp-core-2.4.1/test/test_graphObs.cpp, description: "graph observer test", command: "ctest -R test_graphObs"}
  - {file: test/test_matrices.cpp, source: bpp-core-2.4.1/test/test_matrices.cpp, description: "matrix tools test", command: "ctest -R test_matrices"}
  - {file: test/test_mva.cpp, source: bpp-core-2.4.1/test/test_mva.cpp, description: "multivariate analysis test", command: "ctest -R test_mva"}
  - {file: test/test_numconstants.cpp, source: bpp-core-2.4.1/test/test_numconstants.cpp, description: "numerical constants test", command: "ctest -R test_numconstants"}
  - {file: test/test_powell.cpp, source: bpp-core-2.4.1/test/test_powell.cpp, description: "Powell optimizer test", command: "ctest -R test_powell"}
  - {file: test/test_range.cpp, source: bpp-core-2.4.1/test/test_range.cpp, description: "Range/MultiRange/RangeSet test", command: "ctest -R test_range"}
  - {file: test/test_reparametrization.cpp, source: bpp-core-2.4.1/test/test_reparametrization.cpp, description: "reparametrization test", command: "ctest -R test_reparametrization"}
  - {file: test/test_sample.cpp, source: bpp-core-2.4.1/test/test_sample.cpp, description: "sampling test", command: "ctest -R test_sample"}
  - {file: test/test_simplex.cpp, source: bpp-core-2.4.1/test/test_simplex.cpp, description: "simplex test", command: "ctest -R test_simplex"}
  - {file: test/test_stats.cpp, source: bpp-core-2.4.1/test/test_stats.cpp, description: "statistics test", command: "ctest -R test_stats"}
  - {file: test/test_text_tools.cpp, source: bpp-core-2.4.1/test/test_text_tools.cpp, description: "text tools test", command: "ctest -R test_text_tools"}
  - {file: test/test_treeGraphObs.cpp, source: bpp-core-2.4.1/test/test_treeGraphObs.cpp, description: "tree graph observer test", command: "ctest -R test_treeGraphObs"}

test_package_tests:
  - file: test.cpp
    description: "Consumer test: Range bounds, overlap, expandWith and toString"
    command: "./test_probe"

assertion_count: 5
