# 软件级 manifest — lbreakouthd
# 文件位置: archives/l/lbreakouthd/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

software: lbreakouthd
display: "LBreakoutHD"
description: "经典打砖块游戏（HD 现代主题，LGames 出品）"
category: game
homepage: "https://lgames.sourceforge.net/LBreakoutHD/"
license: GPL-3.0
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需打 HarmonyOS 三元组补丁（aarch64-unknown-linux-ohos，E007）"
    - "configure 内 umask 077→022，修复 HMDFS setgid 临时目录不可写（E046）"
    - "src/sdl.h 调整 include 顺序：SDL.h 必须先于 SDL_image.h/SDL_ttf.h（E481）"
    - "src/tools.h 需显式 #include <sys/types.h> 提供 uint（E482）"
    - "无加速渲染环境回退 SDL_RENDERER_SOFTWARE（E483，无头/无 GPU 必需）"
    - "数据布局：--disable-install（--prefix 仅安装二进制），levels/themes 数据由 conan copy 落入包内"
  common_dependencies:
    - sdl2
    - sdl2_image
    - sdl2_mixer
    - sdl2_ttf
    - gettext
    - libintl

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.3":
    status: built
    build_date: "2026-09-20"
    published_as: lbreakouthd
    source_url: "https://sourceforge.net/projects/lgames/files/lbreakouthd/lbreakouthd-1.2.3.tar.gz/download"
    patches: 6
