# conandata.yml — lbreakouthd 1.2.3
# (R39: canonical SourceForge LGames release URL; CI auto-adds mirror fallback)
# (backup_urls: Debian pool pristine tarball, sha256-identical to the
#  SourceForge release — used when CI workers cannot reach sourceforge.net)

sources:
  url: "https://sourceforge.net/projects/lgames/files/lbreakouthd/lbreakouthd-1.2.3.tar.gz/download"
  sha256: "effca8b96e4a87dfbc92ca1570f4e306e3fcc34efff7451eca11b4b72d1519c8"
  backup_urls:
    - "https://deb.debian.org/debian/pool/main/l/lbreakouthd/lbreakouthd_1.2.3.orig.tar.gz"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "E007: recognize the HarmonyOS uname and emit aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "E007: accept aarch64-unknown-linux-ohos triplets in the bundled config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "E046: use umask 022 for the config.status temp dir (HMDFS setgid makes umask-077 dirs unwritable)"
    patch_type: "portability"
  - patch_file: "patches/0004-src-sdl.cpp.patch"
    patch_description: "Fall back to the SDL software renderer when no accelerated driver is available (headless / no-GPU environments)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-sdl.h.patch"
    patch_description: "Include SDL.h before SDL_image.h (the quoted \"SDL.h\" inside SDL_image.h self-referenced the project sdl.h on case-insensitive filesystems)"
    patch_type: "portability"
  - patch_file: "patches/0006-src-tools.h.patch"
    patch_description: "Include <sys/types.h> so `uint` is defined (OHOS libc does not pull it in transitively)"
    patch_type: "portability"
