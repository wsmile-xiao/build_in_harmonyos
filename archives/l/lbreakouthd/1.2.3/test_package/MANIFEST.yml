# test_package/MANIFEST.yml — lbreakouthd 1.2.3
# CI L0e requires this file to exist.

package: lbreakouthd/1.2.3
homepage: "https://lgames.sourceforge.net/LBreakoutHD/"

# R51 上游测试清点 (2026-09-20):
#   - tarball 无 tests/ 目录 (find . -type d -name '*test*' 为空)
#   - Makefile.am / src/Makefile.am / libgame/Makefile.am 无 TESTS /
#     check_PROGRAMS / check-local 声明
#   - 生成的 Makefile 中 `check-am: all-am`、`check: check-recursive`
#     为 automake 自动生成的空目标
#   - `make check` 实测仅打印 "Nothing to be done for 'check-am'"，rc=0
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游无任何测试程序
upstream_tests: []

# test_package 测试 (消费者视角, 实质执行被测二进制)
test_package_tests:
  - file: test.sh
    description: "SDL dummy 视频/音频驱动 + 软件渲染回退无头启动被测二进制，断言版本横幅输出且 12s 内无崩溃 (rc=124/0)"
    command: "bash test.sh <package_bin>/lbreakouthd"

# 断言总数 (横幅存在 + 存活无崩溃 + 退出码合法)
assertion_count: 3
