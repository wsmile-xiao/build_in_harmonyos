# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmysofa/1.3.5
homepage: "https://github.com/hoene/libmysofa"

# 上游测试命令 (cmake 工程，测试通过 ctest 执行)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (CMakeLists.txt 注册的 ctest 用例)
# 41 项 ctest (4 直跑 mysofa2json + 6 compareIgnoreNew + 21 fail-issue notcrashed
#            + 10 compare.sh) + 3 个 CUnit 二进制 (external/internal/multithread)
# 其中 16 个 node 比对的 compare.sh 用例在本机 node/V8 对 OHOS musl errno
# 断言崩溃 (Signal 5)，已用 python 等价比对器 (tests/pyjsoncmp.py, 容差 0.05)
# 逐一交叉验证 mysofa2json 输出与参考 .json.bz2 完全一致 (16/16 EQUAL)。
upstream_tests:
  - file: external.c
    source: libmysofa-1.3.5/src/tests/external.c
    description: "CUnit 外部 API 测试 (13 用例, 20934 断言)"
    command: "./external"
  - file: internal.c
    source: libmysofa-1.3.5/src/tests/internal.c
    description: "CUnit 内部实现测试 (2 用例)"
    command: "./internal"
  - file: multithread.c
    source: libmysofa-1.3.5/src/tests/multithread.c
    description: "多线程并发 HRTF 读取测试 (20 线程)"
    command: "./multithread"
  - file: sofa2json.c
    source: libmysofa-1.3.5/src/tests/sofa2json.c
    description: "mysofa2json 工具 + 21 个 fail-issue 崩溃安全用例 + 16 个 JSON 比对用例"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 真实打开 data/testfile.sofa 并获取 HRTF 滤波器 (有限值断言)"
    command: "./test_libmysofa"
  - file: ohos_special_test.c
    description: "HarmonyOS 专项测试: 坐标往返/滤波器有限值/minphase+resample/多线程并发"
    command: "./ohos_special_test"

# 测试断言总数 (上游 CUnit 20934 + CUnit internal + 测试二进制 + 消费者断言)
assertion_count: 21000