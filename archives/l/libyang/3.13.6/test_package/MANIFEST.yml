# test_package/MANIFEST.yml
# Upstream test declaration file

package: libyang/3.13.6
homepage: "https://github.com/CESNET/libyang"

# Upstream test command
upstream_check_command: "ctest --output-on-failure --no-tests=error"

# conanfile.py build() method upstream test integration
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"

# Upstream test programs (statically inventoried from the 3.13.6 source tree;
# pass/fail counts are filled in from the real-device run, see notes.md)
upstream_tests:
  - framework: CTest
    source: libyang-3.13.6/tests/utests
    total: 56
    description: "56 cmocka unit-test binaries registered via ly_add_utest in tests/utests/CMakeLists.txt (types 22, basic 10, data 11, schema 5, extensions 5, restriction 2, node 1)"
  - framework: none
    source: libyang-3.13.6/tests/yanglint
    total: 0
    description: "yanglint tcl tests register only when tclsh+expect exist; not available on OHOS, unregistered by upstream CMake itself"
  - framework: none
    source: libyang-3.13.6/tests/yangre
    total: 0
    description: "yangre tcl test registers only when tclsh+expect exist; not available on OHOS, unregistered by upstream CMake itself"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_libyang.c
    description: "Consumer test: context/schema/JSON-data/print round-trip (6 checks)"
    command: "ctest -R '^libyang_consumer$' --output-on-failure"
  - file: yanglint
    description: "Packaged yanglint CLI executes and reports its version"
    command: "ctest -R '^yanglint_version$' --output-on-failure"

# Approximate assertion count
assertion_count: 6
