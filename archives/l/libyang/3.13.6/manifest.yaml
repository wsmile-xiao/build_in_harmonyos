# ============================================================
# Knowledge
# ============================================================

knowledge_gained:
  - "Upstream tests require the shared build (ENABLE_TESTS is forced OFF for static)"
  - "In-tree FindPCRE2/FindCMocka need explicit PCRE2_/CMOCKA_ cache variables"
  - "yanglint/yangre tool tests need tclsh+expect and stay unregistered without them"
