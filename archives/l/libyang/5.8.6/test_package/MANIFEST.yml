# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（libyang 5.8.6，源码实测）：
#
#   upstream_test_targets = 57
#       tests/CMakeLists.txt:10-38 的 `ly_add_utest(NAME ...)` 函数对每个用例
#       生成可执行文件 utest_<name> 并 add_test 注册；utests/CMakeLists.txt
#       共调用 57 次。
#
#   upstream_test_files   = 57
#       tests/utests/ 下 57 个 cmocka 单元测试源（uint8 … openconfig）。
#       另有 tests/plugins/、tests/yanglint/、tests/yangre/ 等目录，属于
#       插件与工具测试，见下方 NOT_RUN。
#
#   upstream_case_total   = 57   （**可靠枚举**：ly_add_utest 调用逐条可数）
#
#   ⚠️ 上游 CMakeLists 对**静态构建直接关闭全部测试**：
#       if(NOT BUILD_SHARED_LIBS)
#           message(STATUS "Disabling tests for static build")
#           set(ENABLE_TESTS OFF)
#     因此本配方 default_options 里 shared 默认为 True（libyang 非系统同名库，
#     R26 不适用，shared 由 Conan 管理依赖链）。静态构建的包将无测试可跑。
#
#   ⚠️ ctest 在该构建下注册 61 项 = 57 utests + 1 style 检查（headers）
#     + 3 个 regress_fuzz_*。本配方只跑 `ctest -R "^utest_"`（那 57 项），
#     其余不声明为通过：
#       - headers（tests/style）：源码风格检查，需要格式化工具链，非功能测试；
#       - regress_fuzz_*：需要 ENABLE_FUZZ_TARGETS 构建的 fuzz 目标，本配方关闭。
#
#   ⚠️ NOT_RUN（逐条技术原因，不计入通过）：
#       tests/yangre    —— 1 项，`tclsh all.tcl`；**设备无 tclsh**（实测 which 无结果），
#                          上游 CMake 在找不到 tclsh 时不注册该测试；
#       tests/yanglint  —— 交互式测试同为 Tcl 脚本。本配方用
#                          ENABLE_YANGLINT_INTERACTIVE=OFF 显式关闭：否则即使在无
#                          tclsh 的机器上，上游仍会注册命令为 PATH_TCLSH-NOTFOUND
#                          的测试项，造成假失败。
#
#   WSL 侧本地实测（非 conan，直接构建上游）：57/57 passed, 0 failed（6.11s）。

package: libyang/5.8.6
homepage: "https://github.com/CESNET/libyang"

upstream_check_command: "ctest -R '^utest_'"
upstream_test_in_build: true
upstream_test_command: "ctest -R '^utest_' --output-on-failure --timeout 300"

upstream_tests:
  - file: tests/utests/CMakeLists.txt
    source: "tests/CMakeLists.txt:10-38 ly_add_utest() + utests/CMakeLists.txt 的 57 次调用"
    description: >-
      57 个 cmocka 单元测试：基础类型（uint8/16/32/64、int8/16/32/64、string、bits、
      binary、inet_types、yang_types、enumeration、instanceid、union、boolean、
      decimal64、empty、identityref、leafref、range、pattern）、容器与列表、集合与
      哈希表、上下文与插件、XML/JSON 解析与打印、xpath、yanglib、schema 编译、
      树结构、验证、merge/diff、metadata、nacm、yangdata、schema_mount 等
    command: "ctest -R '^utest_'"

test_package_tests:
  - file: src/test_libyang.c
    description: >-
      C99 消费者链接安装后的 libyang，9 项断言走完整管线：拿到 YANG 模块目录；
      ly_ctx_new 建上下文；lys_parse_mem 编译内联 YANG 模块；lyd_parse_data_mem
      解析 JSON 实例数据；lyd_validate_all（LYD_VALIDATE_PRESENT）通过。
      另有 3 项**负向**断言：超出 range 的取值必须被验证拒绝、畸形 JSON 必须解析失败、
      strict 模式下无对应 schema 的数据必须被拒（R34 真实 API 调用）
    command: "./test_libyang"

assertion_count: 9
