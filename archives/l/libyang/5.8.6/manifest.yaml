version: "5.8.6"
software: libyang
status: built
build_date: "2026-09-22"
build_system: cmake

source:
  url: "https://github.com/CESNET/libyang/archive/refs/tags/v5.8.6.tar.gz"
  sha256: "6906b0f26c1d4494c5c2464313b16169ec92ccd07b45ecf3a1e9eb9cd7a55c0b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "shared 默认 True —— 上游对静态构建直接 set(ENABLE_TESTS OFF)，静态包将无测试可跑"
    - "ENABLE_TESTS=ON + cmocka（build_requirements 里的 test_requires）"
    - "ENABLE_VALGRIND_TESTS=OFF / ENABLE_FUZZ_TARGETS=OFF"
    - "ENABLE_YANGLINT_INTERACTIVE=OFF（Tcl 交互测试，设备无 tclsh）"
  dependencies:
    - "pcre2/10.47"

patches_applied: []

knowledge_gained:
  - "libyang 的 CMakeLists 在 NOT BUILD_SHARED_LIBS 时直接 set(ENABLE_TESTS OFF)（并打印 'Disabling tests for static build'）—— 静态构建**根本不会生成测试目标**。想跑上游测试就必须用 shared 构建；这不是配置疏忽而是上游的设计选择"
  - "libyang 5.8.6 的 ly_ctx_new(NULL, 0, &ctx) 会失败：'Loading \"ietf-inet-types@...\" module failed, not found'。必须把含内置 .yang 的目录传进去。上游把 modules/ 安装到 ${CMAKE_INSTALL_PREFIX}/share/yang/modules/libyang（CMakeLists.txt:259,452），Conan 包里即 <package_folder>/share/yang/modules/libyang。消费者（含 test_package）必须指向该目录"
  - "lyd_validate_all() 会连同上下文里**所有**模块一起校验；内置的 ietf-yang-library 有强制节点，调用方没提供就会报 'Mandatory node \"content-id\" instance does not exist'。只想校验自己那份数据时应传 LYD_VALIDATE_PRESENT（'Validate only modules whose data actually exist'）"
  - "libyang 的 utests 用 cmocka（find_package(CMocka 1.0.1)），作为 build_requirements 里的 test_requires 引入；仓库已有 cmocka/2.0.2 与 pcre2/10.47 且都有 OHOS 预编译二进制"
  - "tests/yangre 与 tests/yanglint 的交互测试是 Tcl 脚本。上游在找不到 tclsh 时不注册 yangre 测试，但 yanglint 侧仍会注册命令为 PATH_TCLSH-NOTFOUND 的项 —— 必须用 ENABLE_YANGLINT_INTERACTIVE=OFF 主动关闭，否则出现假失败"
  - "本地排雷受限说明：libyang 的依赖 pcre2 在制品仓里是 OHOS 适配版配方（构建脚本硬编码 /data/service/hnp/bin/bash），在 WSL 上无法 conan create。因此本项目改为**直接构建上游**做本地验证（自建 pcre2 10.47 + cmocka，configure/build/ctest），真机再验证 conan 侧"

patch_generation:
  method: none
  patches_count: 0

test_results:
  type: upstream
  total: 57
  passed: null
  failed: null
  skipped: 0
  note: "WSL 直接构建上游实测 57/57 passed, 0 failed (6.11s)，消费者 9/9；HarmonyOS 真机 conan create 结果待回填"
