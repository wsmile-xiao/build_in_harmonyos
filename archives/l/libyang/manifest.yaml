software: libyang
display: "libyang"
description: "YANG data modeling language parser and toolkit"
category: data
homepage: "https://github.com/CESNET/libyang"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，上游测试仅 shared 构建可用（static 时上游强制关闭）"
    - "自带 FindPCRE2/FindCMocka 只搜系统路径，需从 Conan 依赖显式注入"
    - "yanglint/yangre 随包发布，OHOS 执行需 binary-sign-tool 签名"
  common_dependencies:
    - pcre2

versions:
  "3.13.6":
    status: built
    build_date: "2026-09-16"
    format: conan
    note: "首个 OHOS 适配版本；真机预检结论以 CI 为准"
  "5.8.6":
    status: built
    build_date: "2026-09-22"
    format: conan
    source: "https://github.com/CESNET/libyang/archive/refs/tags/v5.8.6.tar.gz"
    note: "上游 57 个 cmocka 用例真机 57/57；依赖 pcre2/10.47 + cmocka/2.0.2（test_requires）"
