# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnl3-cli/3.11.0

homepage: "https://github.com/thom311/libnl"

# 上游测试命令（与 archives/l/libnl/3.11.0 同源同一份 tarball，测试口径一致）
# 顶层 Makefile.am 定义 `TESTS =` + 末尾 `TESTS += $(check_programs)`，
# 而 `check_programs` 只被 `+= tests/check-all` 与 `+= tests/check-direct`
# 追加 —— 上游**有意**只把这两个 libcheck 程序挂进 TESTS。48 个 CLI 工具
# 属 cli_programs（默认 --enable-cli=bin 下进 bin_PROGRAMS，不进 TESTS），
# 24 个 test-create-* 与 3 个 cache 类程序属 check_PROGRAMS，`make check`
# 只构建、不自动运行（它们需要 root + NET_ADMIN 真机 netlink 环境）。
upstream_check_command: "make check"

# conanfile.py build() 中是否集成上游测试：否。
# 原因：`check`（libcheck）为上游客选测试依赖（configure.ac:87
# `PKG_CHECK_MODULES([CHECK],[check >= 0.9.0])`，缺失仅 AC_MSG_WARN 关闭单测）。
# 且上游 TESTS 中 check-all 的 netns/iface 用例与 test-create-* 均需 root 与
# 内核 netlink 写权限，在本机终端域内必然失败 —— 挂在 build() 会让配方不可
# 复现。故上游测试在适配期以独立复现脚本执行并留证（见 notes.md「上游测试」
# 节与 reports/testlogs/），配方本身只做 configure + make + install。
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序（TESTS 变量展开：共 2 个）
upstream_tests:
  - name: "check-all"
    file: "tests/check-all.c"
    description: >-
      libcheck 主套件，链接 tests/libnl-test-util.la。启用 4 个 suite：
      "main"(Core)、"Abstract addresses"、"Netlink attributes"、"Clone ematch tree"
      以及 "netns"。3.11.0（本包实跑）Checks: 31 / Failures: 0 / Errors: 19
      （19 个 error 全部为 `(after this point) Received signal 31 (Bad system call)`
      —— 环境 seccomp（Seccomp: 2）拦截测试框架 nltst_netns_enter() 的
      unshare(CLONE_NEWUSER/CLONE_NEWNET) 建 netns，SIGSYS 无差别、非产品缺陷）。
    source_dir: "tests"
    expected_assertions: 31
  - name: "check-direct"
    file: "tests/check-direct.c"
    description: >-
      `--enable-static` 时才编译（Makefile.am `if WITH_CHECK / if ENABLE_STATIC`）。
      本包为 shared 交付（--disable-static），check-direct 不参与构建 —— 与本体
      包 --enable-static 下 2/2 PASS 的口径并列记录，不重复计为本包结果。
    source_dir: "tests"
    expected_assertions: 0

# 上游 check_PROGRAMS 中**未**纳入 TESTS 的 27 个程序（适配期手工逐个运行留证）
# 24 个 link/netfilter 类：test-complex-HTB-with-hash-filters、test-create-bond、
#   test-create-bridge、test-create-geneve、test-create-ifb、test-create-ip6tnl、
#   test-create-ipgre、test-create-ipgretap、test-create-ipip、test-create-ipvlan、
#   test-create-ipvti、test-create-macsec、test-create-macvlan、test-create-macvtap、
#   test-create-sit、test-create-veth、test-create-vlan、test-create-vrf、
#   test-create-vxlan、test-create-xfrmi、test-delete-link、test-loopback-up-down、
#   test-socket-creation、test-u32-filter-with-actions
# 3 个 cache 类：test-cache-mngr、test-genl、test-nf-cache-mngr
# （本包 --disable-static 下 check-direct 不构建，非 TESTS 的 check_PROGRAMS
#   为 27 个 —— 本体包 29 的口径中 check-direct/direct 两表重叠加一）
unupstream_run_programs_count: 27

# 上游测试程序总量（检视统计口径）：31 = check_PROGRAMS 29 + TESTS 2（上游
# Makefile.am 源文件口径，与本体包一致）；本包 --disable-static 实际构建其中 30。
total_upstream_programs_count_review: 31

# test_package 自带测试（消费者视角：编译 + 链接 + 运行时断言）
test_package_tests:
  - file: harmonyos_specific_test.c
    description: >-
      HarmonyOS 平台特定消费者用例（编译期 __OHOS__/__aarch64__ 硬绑定）。
      真实链接 libnl-cli-3（shared，DT_NEEDED 拉齐 6 子库），运行 11 组断言：
      ① dlopen 包内 libnl-cli-3.so.200（E316/E492/E505 SONAME 软链实体化验证）；
      ② dlopen cli/qdisc/htb.so 与 cli/cls/basic.so 插件（RTLD_NOW 符号解析）；
      ③ nl_cli_parse_u32 往返、nl_addr_parse("10.0.0.1/24") 前缀/二进制断言
      （纯用户态，musl ABI）；④ fork+exec 包内 bin/nl-util-addr 走 Usage
      路径退出码 255（端到端动态加载链）。退出码非 0 即 FAIL。
    command: "harmonyos_specific_test"
  - file: "（conanfile.py 内联）"
    description: >-
      通用冒烟（Linux/OHOS 均跑）：包内 bin/nl-util-addr 无参数运行，打印
      Usage 且退出码 255（ignore_error 捕获，输出留证于 test_package 日志）。
    command: "nl-util-addr"

# 测试断言总数（近似值，用于质量评估）
# 上游 TESTS 31（check-all checks；check-direct 本包 static 关闭不构建）
#  + test_package 11 组断言 + 1 组通用冒烟 = 43
assertion_count: 43

# 刻意不忽略鸿蒙消费者用例的退出码：harmonyos_specific_test 以
# self.run(exe, env="conanrun") 真实断言，退出码非 0 即判 FAIL。
