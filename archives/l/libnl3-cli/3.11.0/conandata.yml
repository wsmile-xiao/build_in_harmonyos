# conandata.yml — libnl3-cli 3.11.0 (Netlink Protocol Library Suite — 命令行工具子包)
#
# 上游：https://github.com/thom311/libnl （tag libnl3_11_0，发布于 2024-10-30）
# 交付：48 个 bin/ 工具 + 10 个 dlopen 插件 + libnl-cli-3
#       （对齐发行版 libnl3-cli 子包内容）
#
# 与 archives/l/libnl/3.11.0 同源同一份 tar 归档：主包以 `--disable-cli` 只交付 6 个
# 静态库，CLI 交付物由本子包承担（本仓惯例：本体不装 bin/，CLI 归独立子包）。
#
# SHA256 官方同批资产核验：
#   官方 .sha256sum = 2a56e1edefa3e68a7c00879496736fdbf62fc94ed3232c0baba127ecfa76874d
#   本地复算        = 2a56e1edefa3e68a7c00879496736fdbf62fc94ed3232c0baba127ecfa76874d
#   官方 .md5sum    = 0a5eb82b494c411931a47638cb0dba51（本地复算一致）
#
# R39/PF7：只写上游官方源 URL 一条，不手写镜像前缀（HTTP 回退由 CI 接管）。

sources:
  "3.11.0":
    url: "https://github.com/thom311/libnl/releases/download/libnl3_11_0/libnl-3.11.0.tar.gz"
    sha256: "2a56e1edefa3e68a7c00879496736fdbf62fc94ed3232c0baba127ecfa76874d"

patches:
  "3.11.0":
    - patch_file: "patches/0001-support-ohos-triplet.patch"
      patch_description: >-
        build-aux/config.guess(2023-06-23) 不识别本机 `uname -s` = HarmonyOS，configure
        第一步即 "config.guess: unable to guess system type" →
        "configure: error: cannot guess build type; you must specify one"；
        config.sub 亦不识别 linux-ohos kernel-OS（"OS 'ohos' not recognized"）。
        按知识库 E205（scripts/patch-autotools-ohos.pl）为二者补 HarmonyOS / ohos /
        linux-ohos 识别，**不使用 --build/--host 绕过**（E205 明令禁止）。
        与 archives/l/libnl/3.11.0 的 0001 逐字节同源（同一上游归档、同一适配点）。
      patch_type: "portability"
    - patch_file: "patches/0002-headers-selfcheck-use-linux-private.patch"
      patch_description: >-
        上游 build-headers-test 编译规则只带 `-I$(srcdir)/include -I$(builddir)/include`，
        漏掉 libnl 自带内核头私有副本 `include/linux-private`；OHOS sysroot 的
        linux/socket.h 定义了无前缀 `struct sockaddr_storage`，与 sys/socket.h 冲突
        （知识库 E091/E119），导致 `make check` 第一阶段 check-local →
        check-build-headers 以 `redefinition of 'sockaddr_storage'` 中止。
        补上该 -I 后与库自身编译口径一致。仅影响自检规则，不改变交付内容。
      patch_type: "portability"
    - patch_file: "patches/0003-cli-plugins-link-libnl-cli-3.patch"
      patch_description: >-
        musl 1.2.4+ 严格符号版本化（vs glibc 宽松匹配）下的插件加载修复：
        上游 10 个 CLI dlopen 插件（lib/cli/{cls,qdisc}）以 -module -avoid-version
        构建但 LIBADD 为空，产物 NEEDED 只有 libc.so，对 nl_cli_tc_register 等
        libnl-cli-3 符号是无版本 UND 引用；而 libnl-cli-3.so.200 经 version
        script（libnl-cli-3.sym）导出为 nl_cli_tc_register@@libnl_3。musl
        严格匹配下「无版本引用不等于带版本定义」→ 工具运行时
        nl_cli_load_module() dlopen(RTLD_NOW) 插件报
        "Error relocating ...: nl_cli_tc_register: symbol not found"
        （glibc 下无此问题，鸿蒙 musl 必现；RTLD_GLOBAL 预加载亦不能绕过，
        已实测探针坐实）。补丁为 Makefile.am/Makefile.in 增加 lib_cli_libadd
        （src/lib/libnl-cli-3.la）并挂到 10 个插件的 _la_LIBADD，使插件
        NEEDED/verneed 记录 libnl-cli-3.so.200 与 libnl_3 版本，dlopen 闭包
        自洽。仅改变插件链接输入，不改任何源码语义。
      patch_type: "portability"
