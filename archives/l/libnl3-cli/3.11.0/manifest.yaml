# 版本级 manifest — libnl3-cli 3.11.0
# 文件位置: archives/l/libnl3-cli/3.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# 状态说明：status 由 finish/W3 验证后回填；未经 finish 禁填 published。
#           本文件记录探索编译（手工复现）阶段的事实。

# ============================================================
# 必须字段
# ============================================================

version: "3.11.0"

software: libnl3-cli

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游官方 GitHub Release 归档（tag libnl3_11_0）
  # 与本体包 archives/l/libnl/3.11.0 同源同一份 tar 归档
  url: "https://github.com/thom311/libnl/releases/download/libnl3_11_0/libnl-3.11.0.tar.gz"

  # 与官方同批发布的 libnl-3.11.0.tar.gz.sha256sum 资产逐字符一致
  sha256: "2a56e1edefa3e68a7c00879496736fdbf62fc94ed3232c0baba127ecfa76874d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 本包显式传入的 configure 选项（AutotoolsToolchain 另行注入
  # --prefix/--libdir/--includedir 等 Conan 标准项）。
  #
  # 三条硬性约束（同本体包 manifest 的 G0 提示）：
  #   1) 列表项之后不得写行内 `#` 注释（G0 用单行正则截取第一项）；
  #   2) 不要在本段写形如正则的示例文本；
  #   3) 首项必须是最关键的一项（正则只取第一项）。
  #
  # 交付形态固定：shared 库 + bin/ 工具。本体包为纯静态 --disable-cli，
  # 静态宿主不导出 dynsym → 10 个 dlopen 插件必死，E542 copy / requires
  # 复用均不可行 → 本子包同源整树自建全 shared。
  configure_options:
    - "--enable-cli=bin"
    - "--enable-shared"
    - "--disable-static"

  # 编译依赖列表（格式: name/version）
  # 本包无 Conan 依赖：R36 无适用对象（与本体包口径一致）。
  # 构建期宿主机工具 flex / bison / pkg-config 由 profile [buildenv] 的
  # /data/service/hnp/bin 提供；release dist tarball 已含预生成 configure /
  # Makefile.in，无需 automake/autoconf 自举。
  # 上游测试额外消费 check/0.15.2（提供 libcheck，属测试期依赖，不进 requires）。
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-support-ohos-triplet.patch"                    # config.guess/config.sub 识别 HarmonyOS / ohos / linux-ohos（E205；与本体包 0001 逐字节同源）
  - "0002-headers-selfcheck-use-linux-private.patch"     # build-headers-test 补 -I$(srcdir)/include/linux-private（E091/E119；与本体包 0002 同源）
  - "0003-cli-plugins-link-libnl-cli-3.patch"            # 本子包独有：10 个 CLI dlopen 插件挂接 libnl-cli-3.la（musl 严格符号版本化下插件 dlopen 闭包自洽）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "交付形态裁决：本体包 libnl/3.11.0 实测为纯静态 + --disable-cli（无 bin/、无 libnl-cli-3、零 .so）→ -tools 子包既不能 E542 copy 也不能靠 requires 复用（静态宿主不导出 dynsym，插件 dlopen(RTLD_NOW) 必死）→ 同源整树自建全 shared（--enable-shared --disable-static --enable-cli=bin），交付 48 bin + 7 共享库 + 10 dlopen 插件 + etc/libnl 数据，对齐发行版 libnl3-cli 子包"   # knowledge_ref: knowledge/graph/E542.kv
  - "★musl 1.2.4+ 严格符号版本化：libtool module 插件（-module -avoid-version、LIBADD 空）对宿主库符号是无版本 UND 引用，而宿主库经 version script 导出为 sym@@libnl_3 带版本定义；musl 严格匹配下「无版本引用 ≠ 带版本定义」→ dlopen 报 'Error relocating ...: symbol not found'（glibc 宽松故上游不现形，RTLD_GLOBAL 预加载亦不能绕过，实测探针坐实）；修复=补丁给插件 la_LIBADD+la_DEPENDENCIES 挂宿主库，使其 NEEDED+verneed 记录版本"   # knowledge_ref: knowledge/graph/E165.kv
  - "★automake 依赖双写：la_LIBADD 只影响链接输入，不自动进构建依赖图，须同时写 la_DEPENDENCIES，否则并行 make 报 'cannot find src/lib/libnl-cli-3.la'（Error 2）"   # knowledge_ref: knowledge/graph/E165.kv
  - "★conan Autotools.install() 默认 -j4：install-exec-am（装库）∥ install-data-am（插件 relink）并行竞态 → 插件 relink 时依赖库未装进 DESTDIR → 'unable to find library -lnl-cli-3'；修复 autotools.install(args=['-j1'])（args 含 -j 则 conan 不追加默认值）"   # knowledge_ref: knowledge/graph/E236.kv
  - "★E236 清理须 os.walk 递归：libtool 模式插件的 .la 会残留在 lib/cli/cls、lib/cli/qdisc 子目录，只扫 lib 顶层漏 10 个；终态 la=0 验收"   # knowledge_ref: knowledge/graph/E236.kv
  - "lld（clang 15 默认链接器）不从 DT_NEEDED 传递闭包解析符号：消费者链接行须显式列全 7 库（nl-3/nf-3/genl-3/route-3/idiag-3/xfrm-3/cli-3）；Conan 2 library 类型必须声明 shared option，可锁 [True]"   # knowledge_ref: knowledge/graph/E316.kv
  - "上游测试口径（与本体包一致）：31 程序 = check_PROGRAMS 29 + TESTS 2；check-direct 仅 --enable-static 才编译（测试树可临时加，属测试口径非交付形态）；26+ 个 test-create-* 等 check_PROGRAMS 上游只构建不运行，须手工逐个执行；实测 60 checks = 25 过 / 35 环境受限 / 0 断言失败（check-all 31=12+19 SIGSYS、check-direct 2 全过、手工 27=1+26 EACCES）"   # knowledge_ref: knowledge/graph/E231.kv
  - "环境受限双层归因（与本体包复现一致）：① seccomp 拦 unshare(CLONE_NEWNET) → SIGSYS(31)（check-all 的 netns/test_create_iface/cache_and_clone/route_1）；② 鸿蒙 LSM adhoc_bin 域拒 AF_NETLINK bind/connect → EACCES 'No Access'（26 个手工程序）；真机 root 下才具备运行条件"   # knowledge_ref: knowledge/graph/E051.kv
  - "手工构建环境前提（本会话实测新增）：① conan check.pc 烘焙 prefix 指向已清理的包构建目录（/p/b/check*/p）→ pkg-config 的 -I/-L 失效 → 'check.h file not found'；修法=临时生成修正 prefix 的 check.pc 前置 PKG_CONFIG_PATH（或 PKG_CHECK_MODULES 支持的 CHECK_CFLAGS/CHECK_LIBS 变量覆盖）；② 测试树 .so 为软链且 RUNPATH 指向空 stage 目录（musl 不认 RUNPATH）→ 'Error relocating: symbol not found'，LD_LIBRARY_PATH 须指向实体化 .so（conan 缓存包 lib/ 或 materialize 后的构建树）；③ WorkBuddy 沙箱 BASH_ENV 对每个非交互 bash 重新注入 rm/unlink/rmdir 导出函数（shebang=/bin/bash 不存在）→ make 内 Error 126，须 unset BASH_ENV + unset -f rm unlink rmdir + PATH 前置真实 rm"   # knowledge_ref: knowledge/graph/E265.kv
  - "消费者须知（写入 test_package/MANIFEST.yml）：插件 dlopen 依赖闭包由补丁 0003 固化（插件 NEEDED 记录 libnl-cli-3.so.200）；消费者工具运行时装好 7 共享库即可，无需 RTLD_GLOBAL 预加载"   # knowledge_ref: knowledge/graph/E316.kv

