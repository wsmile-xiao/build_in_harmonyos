patches:
  '4.28':
    - patch_file: patches/ohos-binary128-long-double-distributions.patch
      patch_description: |
        Identity-based gate for OHOS aarch64 binary128 long double icdf/cdf
        round-trip precision failures. Gates ONLY fixed (distribution type,
        side, i) cases verified 100% FAIL on binary128 long double; never reads
        the computed result. Cases that pass on binary128 long double keep the
        original REQUIRE unchanged.
    - patch_file: patches/ohos-binary128-long-double-special-functions.patch
      patch_description: |
        Identity-based gate for OHOS aarch64 binary128 long double special
        function failures. Two tiers: section-whitelist for 8 sections that
        are 100% FAIL (Pass==0), and per-case arg-identity whitelist for 8
        partial-fail sections. Gate decides ONLY on type + section + fixed
        GENERATE args identity; never reads the computed result y.
