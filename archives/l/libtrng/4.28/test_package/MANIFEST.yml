# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI build_and_test.sh L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtrng/4.28
homepage: "https://www.numbercrunch.de/trng/"

# 上游测试命令: 上游 CMake 使用 ctest + catch_discover_tests
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --no-tests=error"

# 上游测试套件 (Catch2 v3, tests/ 目录)
upstream_tests:
  - file: tests/test_engines.cc
    description: "随机数引擎 (lcg64/yarn2-5/mrg2-5/mt19937/xoshiro256plus 等) 状态、jump、split、discard、IO"
  - file: tests/test_distributions.cc
    description: "离散/连续分布 (uniform/normal/gamma/poisson/binomial 等) 采样与统计"
  - file: tests/test_special_functions.cc
    description: "特殊函数 (gamma/beta/pow 等)"
  - file: tests/test_int_math.cc
    description: "整数数学工具"
  - file: tests/test_linear_algebra.cc
    description: "线性代数工具"
  - file: tests/test_uint128.cc
    description: "128 位无符号整数类型"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libtrng.cc
    description: "lcg64 固定 seed 确定性 + raw 输出范围 + uniform01/uniform_int/normal 分布采样 + jump2 独立流"
    command: "./test_libtrng"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
