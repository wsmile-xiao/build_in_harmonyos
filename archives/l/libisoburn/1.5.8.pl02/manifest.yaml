# libisoburn 1.5.8.pl02 编译元数据

software: libisoburn
version: "1.5.8.pl02"
status: published
build_system: autotools

# 编译日期
build_date: "2026-06-04"

# 配置选项
configure_options:
  - "--prefix=/storage/Users/currentUser/usr/local"

# 应用的补丁
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

# 依赖关系
dependencies:
  build:
    - "gcc"
    - "make"
    - "autoconf"
    - "automake"
  runtime: []

# 二进制产物
binaries:
  - "xorriso"

# 质量门禁
quality_gate:
  g1_binary_integrity: PASS
  g2_functional: PASS
  g3_portability: PASS
  g4_archive: PASS

# 预编译包
packages:
  - name: "libisoburn-1.5.8.pl02-ohos-aarch64.tar.gz"
    size: 1754400
  - name: "libisoburn-1.5.8.pl02-ohos-aarch64-debug.tar.gz"
    size: 3616317

# 平台信息
platform:
  os: "OpenHarmony"
  arch: "aarch64"
  kernel: "HongMeng Kernel 1.12.0"

# 知识沉淀
knowledge_gained:
  - "config.guess需要识别OpenHarmony平台"
  - "config.sub需要支持ohos架构标识"
  - "configure脚本中的umask修复（0003-configure.patch）"