# test_package/MANIFEST.yml
# Upstream test declaration required by CI L0e.

package: libolecf/20240427
homepage: https://github.com/libyal/libolecf

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"
upstream_c_test_programs: 15
upstream_unit_programs: 12
upstream_tools_programs: 3
upstream_integration_scripts: 3

upstream_tests:
  - name: "libolecf test_library"
    file: test_library.sh
    source: tests/test_library.sh
    description: "上游库与 C 测试程序运行器"
    command: "./tests/test_library.sh"
  - name: "libolecf test_tools"
    file: test_tools.sh
    source: tests/test_tools.sh
    description: "上游命令行工具测试运行器"
    command: "./tests/test_tools.sh"
  - name: "libolecf test_olecfinfo"
    file: test_olecfinfo.sh
    source: tests/test_olecfinfo.sh
    description: "olecfinfo 元数据输出检查"
    command: "./tests/test_olecfinfo.sh"
  - name: "libolecf test_olecfexport"
    file: test_olecfexport.sh
    source: tests/test_olecfexport.sh
    description: "olecfexport 命令检查"
    command: "./tests/test_olecfexport.sh"

test_package_tests:
  - file: test_libolecf.c
    description: "Consumer API version, signature, codepage, error-path, and object lifecycle checks"
    command: "./test_libolecf"
  - file: test_ohos.c
    description: "OHOS compile-target and writable TMPDIR file lifecycle checks"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "libolecf-ohos-tmpdir-file-lifecycle"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、TMPDIR 非 /tmp、临时文件读写和清理"
    command: "./test_ohos"
    assertions: 5
    platform: OHOS

assertion_count: 13
