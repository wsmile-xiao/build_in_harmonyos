package: libmrss/0.19.4
homepage: "https://github.com/bakulf/libmrss"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs (automake check framework, test/Makefile.am TESTS)
upstream_tests:
  - file: new
    source: test/new.c
    description: "Feed struct creation, set, write-buffer round-trip"
    command: "./new"

# noinst example programs (NOT tests — built and run separately in build())
upstream_examples:
  - file: parser
    source: test/parser.c
    description: "noinst example, not a formal test"
    command: "./parser <url-or-file>"
  - file: write
    source: test/write.c
    description: "noinst example, not a formal test"
    command: "./write <in> <out>"
  - file: time
    source: test/time.c
    description: "noinst example, not a formal test"
    command: "./time <url>"
  - file: search
    source: test/search.c
    description: "noinst example, not a formal test"
    command: "./search <file>"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test.c
    description: "inline RSS fixture: create/parse/read-fields/save/invalid-XML"
    command: "./test"

# 消费者测试 test_package/test.c 的内部断言数（9 个 PASS 行），
# 与上游测试数（1）、鸿蒙专项（1 脚本 6 项检查 A-F）分开计数、互不重叠。
assertion_count: 9

# Upstream test accounting
upstream_test_count: 1
upstream_test_skipped_reasons: |
  No tests skipped: the single formal test (test/new) executes and passes
  (make check, # PASS: 1). It is fully offline (struct creation + flags
  set + write-buffer round-trip, no network, no files outside the build
  tree). The four noinst examples (parser/write/time/search) are not
  formal tests; they are built and executed separately in build() with
  exit-code + output verification (parser/time use a local 127.0.0.1
  HTTP feed to exercise the download path offline).
