version: "0.19.4"
software: "libmrss"
status: built
build_date: "2026-09-10"
build_system: autotools

source:
  url: "https://github.com/bakulf/libmrss/archive/refs/tags/0.19.4.tar.gz"
  sha256: "28022247056b04ca3f12a9e21134d42304526b2a67b7d6baf139e556af1151c6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-static"
    - "--enable-shared"
  dependencies:
    - "curl/8.15.0 (库依赖：mrss_download.c 链接 curl_easy_*，configure AC_CHECK_LIB(curl) 强制)"
    - "libnxml/0.18.5 (库依赖：PKG_CHECK_MODULES(nxml>=0.18)，mrss_parser.c 调用 nxml_* API)"
  tool_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"
    - "autoconf/2.72"
    - "pkgconf/3.0.5 (PKG_CHECK_MODULES 宏展开需要 pkg.m4，ACLOCAL_PATH 注入)"
  cc: clang
  cxx: clang++

patches_applied: []   # 无源码补丁；OHOS 适配在 conanfile.py build() 内完成

knowledge_gained:
  - "tarball 无 NEWS 实体文件而 Makefile.am 未 foreign，automake 报 required file './NEWS' not found；自举前 touch NEWS 规避（DRAFT-6053，真实新缺口）"
  - "tarball 带预生成 configure，但仍统一 autoreconf -fi 自举（闭包脚本更新 + E007 打在覆盖之后）"
  - "automake/1.18 闭包携带 2024-07-27 config.guess/config.sub，不识别 HarmonyOS；E007 变换在配方内以纯 Python 复刻"
  - "依赖链：libmrss → libnxml(0.18.5) → curl(8.15.0)；libmrss.so NEEDED libnxml.so.0 + libcurl.so + libc.so"
  - "上游正式测试仅 1 项：test/new（automake TESTS，纯离线创建/设值/写缓冲往返）；parser/write/time/search 为 noinst 示例非测试，单独构建运行验证，不计数"
  - "SONAME 推导：version-info 19:4:19 → current=19,revision=4,age=19 → libmrss.so.0，实际构建产物 libmrss.so.0.19.4 与推导一致"
  - "消费者/鸿蒙测试计数口径：上游 1 / 消费者 1（test.c 内 9 个断言）/ 鸿蒙专项 1（脚本内 6 项检查 A-F），三类互不重叠计数"
  - "L0o 门禁：依赖访问用 self.dependencies.direct_host[\"curl/8.15.0\"] 完整 ref 写法（DRAFT-6052 复用）"
  - "OHOS lld 自动嵌入 .codesign 段且 musl 加载器校验：链接后对 .so 的任何字节级后处理（含清 RUNPATH）都会令签名失效——实测改 DT_RUNPATH d_val 为 0/非零空串偏移均拒载、恢复原值即通过；ELF 级规避必须全部在链接期完成"
  - "libtool 对带 .la 的依赖包（libnxml）做 -L libdir 硬编码进 DT_RUNPATH（curl 包无 .la 从不触发）：把 .so 复制到构建树内无 .la 目录再 -L/-l 链接即可规避，DT_NEEDED 正常记录；libtool 会把显式绝对 .so 路径吞出链接行，绝对路径方案不可行"
  - "conanbuildenv 聚合脚本在自定义 env script 之后 source（后写覆盖）：profile buildenv 的坏 CONFIG_SHELL 无法用 generate()/env= 参数覆盖，需配方内自建构建环境（source conanautotoolstoolchain.sh + conanautotoolsdeps.sh 后强制 CONFIG_SHELL/SHELL=绝对路径 bash）"
  - "out-of-tree 构建：mrss.h 由 mrss.h.in 生成于构建树，上游 AM_CPPFLAGS 只指源码树，make/make check/示例需统一补 CPPFLAGS='-I<build>/src -I<src>/src'"
