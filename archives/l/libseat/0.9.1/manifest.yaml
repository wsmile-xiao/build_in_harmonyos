# 版本级 manifest — libseat 0.9.1

version: "0.9.1"
software: libseat
status: published
build_date: "2026-09-07"
build_system: meson

source:
  url: "https://github.com/kennylevinsen/seatd/archive/refs/tags/0.9.1.tar.gz"
  sha256: "819979c922a0be258aed133d93920bce6a3d3565a60588d6d372ce9db2712cd3"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dserver=disabled"
    - "-Dlibseat-seatd=enabled"
    - "-Dlibseat-builtin=disabled"
    - "-Dlibseat-logind=disabled"
    - "-Dman-pages=disabled"
    - "-Dexamples=disabled"
    - "-Dwerror=false"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "OHOS sys/socket.h 的 CMSG_NXTHDR 宏展开带符号性警告，上游 -Werror 需置 false"
  - "libseat 的 noop 后端按设计无法切换会话（switch_session 返回 -1 且不设置 errno）"
  - "poller 上游测试等待事件分发会无限阻塞，构建期仅运行 linked_list 与 connection 两个确定性测试"