software: libnfnetlink
# 版本级 manifest - libnfnetlink 1.0.2
# 文件位置: archives/l/libnfnetlink/1.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.0.2"

build_system: autotools

status: built

build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.netfilter.org/projects/libnfnetlink/files/libnfnetlink-1.0.2.tar.bz2"
  sha256: ""
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: "0001-config.guess-harmonyos.patch"
    type: platform
    description: "添加 HarmonyOS 系统识别（aarch64:HarmonyOS）"
    guard: "无"
  - file: "0002-iftable.c-harmonyos-fix.patch"
    type: source
    description: "修复 sockaddr_storage 重复定义冲突"
    guard: "#ifndef _UAPI_LINUX_SOCKET_H"
  - file: "0003-libnfnetlink.c-harmonyos-fix.patch"
    type: source
    description: "修复 sockaddr_storage 重复定义冲突"
    guard: "#ifndef _UAPI_LINUX_SOCKET_H"
  - file: "0004-rtnl.c-harmonyos-fix.patch"
    type: source
    description: "修复 sockaddr_storage 重复定义冲突"
    guard: "#ifndef _UAPI_LINUX_SOCKET_H"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - category: platform
    issue: "config.guess 无法识别 HarmonyOS"
    solution: "在 config.guess 中添加 aarch64:HarmonyOS:*:* 识别规则"
    reusable: true
  - category: header_conflict
    issue: "linux/socket.h 和 sys/socket.h 都定义 sockaddr_storage"
    solution: "在源码中定义 _UAPI_LINUX_SOCKET_H 宏阻止重复包含"
    reusable: true
    affected_files:
      - "src/libnfnetlink.c"
      - "src/iftable.c"
      - "src/rtnl.c"
  - category: filesystem
    issue: "HMDFS 文件系统限制：mktemp 创建的 700 权限目录无法写入"
    solution: "修改 configure/config.status 中 umask 077 为 umask 000"
    reusable: true
    notes: "这是 HMDFS 特有问题，与标准 Linux 行为不同"

# ============================================================
# 产物信息
# ============================================================

artifacts:
  libraries:
    - name: "libnfnetlink.so.0.2.0"
      type: "shared"
      size: "36KB"
  headers:
    - "libnfnetlink/libnfnetlink.h"
    - "libnfnetlink/linux_nfnetlink.h"
    - "libnfnetlink/linux_nfnetlink_compat.h"
  pkgconfig:
    - "libnfnetlink.pc"

# ============================================================
# 测试信息
# ============================================================

test_results:
  make_check: "PASS (编译通过，测试程序需要 netlink 权限)"
  pkg_config: "PASS (版本 1.0.2)"
  symbol_check: "PASS (20+ 导出函数)"
  quality_gate: "PASS (G0-G4 全通过)"

# ============================================================
# 注意事项
# ============================================================

notes:
  - "纯库文件，无可执行程序"
  - "测试程序需要 CAP_NET_ADMIN 权限"
  - "是 libnetfilter_conntrack/libnetfilter_queue 的依赖"