# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lunasvg/3.5.0
homepage: "https://github.com/sammycage/lunasvg"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# lunasvg 3.5.0 官方 tag 源码无任何测试目录/断言宏/ctest/meson test 注册
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (官方源码无独立上游用例, 留空)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: loadFromData 解析 SVG + renderToBitmap 渲染 + 中心像素断言 (plutovg 表面为 BGRA 小端字节序, byte[2]=R)"
    command: "./test_lunasvg"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4