# 版本级 manifest — lunasvg 3.5.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.5.0"

# 软件名
software: "lunasvg"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/sammycage/lunasvg/archive/refs/tags/v3.5.0.tar.gz"

  # 源码校验和
  sha256: "1abf1472ee6c4d19797916e8cc3c2e4b628e0d81178ffac60bdb0d457e32c690"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DLUNASVG_BUILD_EXAMPLES=OFF"
  - "-DUSE_SYSTEM_PLUTOVG=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "lunasvg 3.5.0 为纯 CMake C++17 库,无外部 Conan 依赖;plutovg 以 submodule 内嵌(USE_SYSTEM_PLUTOVG=OFF),静态链接时需同时链接 libplutovg.a"
- "plutovg 表面像素为 BGRA 小端字节序(byte[0]=B),断言渲染结果时须按此通道映射,勿按 RGBA"
- "官方 tag 源码无任何测试声明(无 tests/、无 CTest/Meson 注册、无 TEST_CASE 宏),样例 svg2png/smiley.c 不计入上游用例"
