package: libnxml/0.18.5
homepage: "https://github.com/bakulf/libnxml"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs (automake check framework, test/Makefile.am TESTS)
upstream_tests:
  - file: new
    source: test/new.c
    description: "XML tree creation and free API tests"
    command: "./new"
  - file: easy
    source: test/easy.c
    description: "nxmle_* easy API tests incl. URL download path"
    command: "./easy"
  - file: test_base
    source: test/test_base.c
    description: "Core parser tests"
    command: "./test_base"

# noinst example programs (NOT tests — built and run separately in build())
upstream_examples:
  - file: parser
    source: test/parser.c
    description: "noinst example, not a formal test"
    command: "./parser"
  - file: write
    source: test/write.c
    description: "noinst example, not a formal test"
    command: "./write"
  - file: namespace
    source: test/namespace.c
    description: "noinst example, not a formal test"
    command: "./namespace"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test.c
    description: "libnxml public API XML parse/serialize round-trip"
    command: "./test"

# 消费者测试 test_package/test.c 的内部断言数（6 个 PASS 行），
# 与上游测试数（3）、鸿蒙专项（1 脚本 6 项检查 A-F）分开计数、互不重叠。
assertion_count: 6

# Upstream test accounting
upstream_test_count: 3
upstream_test_skipped_reasons: |
  No tests skipped: all 3 execute and pass (make check, # PASS: 3).
  The easy test's hardcoded URL (www.autistici.org/bakunin/index.php)
  was replaced with a 127.0.0.1 local HTTP server serving equivalent
  HTML: the domain has been suspended by the registry (serverHold,
  authoritative NXDOMAIN since 2026-08-28), which is an external
  dependency outage, not a porting defect. Test logic is unchanged.
  The three noinst examples (parser/write/namespace) are not formal
  tests; they are built and executed separately in build() with
  exit-code + output verification.
