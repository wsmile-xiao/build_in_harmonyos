version: "0.18.5"
software: "libnxml"
status: built
build_date: "2026-09-08"
build_system: autotools

source:
  url: "https://github.com/bakulf/libnxml/archive/refs/tags/0.18.5.tar.gz"
  sha256: "263d6424db3cd5f17a9f6300594548e82449ed22af59e9e5534646fa0dabd6a7"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-static"
    - "--enable-shared"
  dependencies:
    - "curl/8.15.0 (库依赖：nxml_*_url() 公开 API 链接并 NEEDS libcurl)"
  tool_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"
    - "autoconf/2.72"
  cc: clang
  cxx: clang++

patches_applied: []   # 无源码补丁；OHOS 适配在 conanfile.py build() 内完成

knowledge_gained:
  - "tarball 无预生成 configure，需 autoreconf -fi 自举（conan automake/1.18 + libtool/2.5.4 + autoconf/2.72 闭包）"
  - "automake/1.18 闭包携带 2024-07-27 config.guess/config.sub，不识别 HarmonyOS；E007 变换在配方内以纯 Python 复刻"
  - "configure.ac 的 AM_CONFIG_HEADER 等旧宏与 automake 1.18 实测兼容：仅 6 条 obsolete 警告，构建正常"
  - "curl 角色定性：库依赖（src/nxml_download.c 链接 curl_easy_*，libnxml.so NEEDED libcurl.so）"
  - "上游正式测试 3 项：new / easy / test_base（automake TESTS）；parser/write/namespace 为 noinst 示例非测试，单独构建运行验证，不计数"
  - "easy 测试硬编码 www.autistici.org，该域名 2026-08-28 起被注册局 serverHold 全球下线（NXDOMAIN）；以本地 127.0.0.1 HTTP 服务替代数据源后 3/3 通过"
  - "测试计数口径：上游 3 / 消费者 1（test.c 内 6 个断言）/ 鸿蒙专项 1（脚本内 6 项检查 A-F），三类互不重叠计数"
  - "CI L0o 门禁误报：`self.dependencies[\"curl\"]` 裸名带引号被当成外部 curl 命令调用；改用 `self.dependencies.direct_host[\"curl/8.15.0\"]`（文档化 API，完整 ref）后通过，详见 DRAFT-6052"
