name: libcacard
software: libcacard
version: "2.8.1"
description: "CAC (Common Access Card) library that provides emulation of smart cards to a virtual card reader"
build_system: meson
license: LGPL-2.1-or-later
status: built
build_date: "2026-09-13"
conan_ref: "libcacard/2.8.1"

source:
  url: "https://www.spice-space.org/download/libcacard/libcacard-2.8.1.tar.xz"
  sha256: "fbbf4de8cb7db5bdff5ecb672ff0dbe6939fb9f344b900d51ba6295329a332e7"
  tar_format: tar.xz
  tag: "v2.8.1"
  homepage: "https://gitlab.freedesktop.org/spice/libcacard"

build:
  system: meson
  configure_options:
    - "default_library=<shared option>"
    - "wrap_mode=nodownload"
    - "pcsc=disabled"
    - "disable_tests=false"
    - "OHOS/Linux Meson ar and ranlib use resolved absolute LLVM paths"
    - "meson native+cross c/cpp repaired only when profile path missing"
    - "meson native+cross pkgconfig injected only when entry missing"
  tool_dependencies:
    - "pkgconf/3.0.5 (meson 查询 glib-2.0.pc 所需 pkg-config 二进制)"
  dependencies:
    - "glib/2.84.0"
    - "nss/3.118.1 (shared=True)"
    - "pcre2/10.45.1.1 (override)"
    - "libffi/3.5.2 (override)"
  cc: clang

patches_applied: []

tests:
  upstream_registered: 6
  upstream_conditional: 2
  upstream_executed: "待真机预检回填"
  upstream_result: "待真机预检回填"
  consumer_flows_declared: 1
  consumer_result: "待真机预检回填"
  shared_static_repetitions_counted_separately: false

blocking_state:
  w0: "待真机核验：glib/2.84.0 与 nss/3.118.1 及覆盖项 pcre2/10.45.1.1、libffi/3.5.2（均为站内被已合入包消费的版本；2.84.0 的 zlib 为系统预装，无 conan 边）配方存在于本仓，制品仓存在性由真机 conan download 复核"
  conan_w3: "待真机预检"
  target_execution: "待真机预检"

knowledge_reused:
  - "pcsc-lite 2.4.0: meson native file 注入 ar/ranlib 全路径；meson install 后 binary-sign-tool 重签"
  - "libslirp 4.9.3: OHOS 上先签名再执行 meson test；TMPDIR 隔离；glib 依赖写法（本包用 override 把碰撞叶子钉到站内后缀版本）"

knowledge_drafts: []

adaptation_paths:
  - "A: base software adaptation"

classification:
  task_type: dependency
  high_difficulty: false
  rationale: "标准 meson 库，无新增架构或 ABI 障碍，沿用仓内已验证的 meson + ELF 签名模式"
