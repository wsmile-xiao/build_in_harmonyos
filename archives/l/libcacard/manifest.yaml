software: libcacard
display: "libcacard"
description: "CAC (Common Access Card) library that provides emulation of smart cards to a virtual card reader"
category: system
homepage: "https://gitlab.freedesktop.org/spice/libcacard"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "使用 meson 构建系统，与上游官方构建方式一致"
    - "依赖 glib-2.0 与 nss，PC/SC 直通（passthrough）默认关闭"
    - "meson install 后用 binary-sign-tool 重签 ELF（rpath 重写会使自签失效）"
  common_dependencies:
    - glib
    - nss

versions:
  "2.8.1":
    status: built
    build_date: "2026-09-13"
