# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libaesgm/2013.1.1
homepage: "https://github.com/xmake-mirror/libaesgm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游源码包为纯 C 源文件库，无任何构建系统与测试套件（无 Makefile/configure/ctest）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无测试）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "AES-128 加解密 roundtrip 消费者测试"
    command: "./test_libaesgm"

# 鸿蒙特有测试 (rule12: 适配交付硬门禁, 在 OH 设备实际运行)
harmony_specific_tests:
  - file: harmony_test.c
    description: "鸿蒙特有: AES-CBC 文件 I/O roundtrip + OHOS 临时目录语义 + uname 平台派生 IV"
    command: "./test_libaesgm_harmony"

# 测试断言总数 (近似值, 基于实际断言统计: test.c=3, harmony_test.c=8)
assertion_count: 11
