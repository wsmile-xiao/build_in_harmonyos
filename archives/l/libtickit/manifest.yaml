software: libtickit
display: "libtickit"
description: "Terminal rendering library"
category: system
homepage: "http://www.leonerd.org.uk/code/libtickit/"
license: MIT
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "纯Makefile项目，无configure脚本"
    - "依赖libtermkey和unibilium"
    - "需补丁解决OHOS SDK winsize结构体重复定义"
  common_dependencies:
    - libtermkey
    - unibilium
  known_issues:
    - "OHOS SDK sys/ioctl.h和bits/alltypes.h都定义winsize结构体导致冲突"

# 版本索引
versions:
  "0.4.6":
    status: built
    build_date: "2026-06-12"