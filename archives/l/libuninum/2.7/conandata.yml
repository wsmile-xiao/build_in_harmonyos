sources:
  # 上游原站 juluribek.ath.cx 已失效；取 Debian 官方池 orig.tar。
  # sha256 与 libuninum_2.7-2.dsc 中 Checksums-Sha256 完全一致（R39 权威镜像）。
  # 注意：本仓库配方约定 sources 为 dict 形式（配合 get(self, **conan_data["sources"])）。
  url: "https://deb.debian.org/debian/pool/main/libu/libuninum/libuninum_2.7.orig.tar.gz"
  sha256: "466b30b24131ec4b7c3ed8b34db7ec96a1e2193af5cc63d6d77f931aac81649f"
patches:
  - patch_file: "patches/0001-config.sub-ohos.patch"
    patch_type: "portability"
    patch_description: "tarball 内 config.sub 为 2009 版，不认识 aarch64 与 linux-ohos；补充识别以支持 --build/--host=aarch64-unknown-linux-ohos（跳过 config.guess）"
  - patch_file: "patches/0002-uniio-utf8in-zero-read.patch"
    patch_type: "portability"
    patch_description: "UTF8in 尾字节读取循环在 read(fd,buf,0) 返回 -1 的平台（OHOS bionic）会过量吞读后续输入，numconv 每行只读到首字符；改为仅在需要尾字节时读取"
  - patch_file: "patches/0003-uniio-putu8-utf32.patch"
    patch_type: "portability"
    patch_description: "putu8s/fputu8 形参为 wchar_t（LP64 上 4 字节）而 numconv 按 UTF32*(8 字节) 调用，输出在首个码点后即截断；统一为 UTF32（与 numconv.c 的 extern 声明一致）"
