version: "2.7"
software: "libuninum"
status: built
build_date: "2026-09-19"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/libu/libuninum/libuninum_2.7.orig.tar.gz"
  sha256: "466b30b24131ec4b7c3ed8b34db7ec96a1e2193af5cc63d6d77f931aac81649f"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--with-pic"
    - "--disable-allocaok（bionic 上 alloca 相关路径不可靠）"
    - "--build=aarch64-unknown-linux-ohos（仅 OHOS）"
    - "--host=aarch64-unknown-linux-ohos（仅 OHOS）"
  dependencies:
    - gmp/6.3.0.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.sub-ohos.patch"
  - "0002-uniio-utf8in-zero-read.patch"
  - "0003-uniio-putu8-utf32.patch"

knowledge_gained:
  - "tarball 内 config.guess/config.sub 为 2009 年版本，不认识 aarch64；显式传 --build/--host=aarch64-unknown-linux-ohos 跳过 config.guess，config.sub 由补丁补充 OHOS 识别（同 aalib/gmp 先例）"
  - "Makefile.am 未定义 TESTS，make check 为空跑；上游测试仅 TestFiles/*.tcl（需 tclsh + tcl_uninum 扩展），配方不引入 Tcl 依赖，断言由 test_package/test.c 承担（19 项，真机全过）"
  - "uninum.h 直接 #include <gmp.h>，package_info 需声明 cpp_info.requires = [gmp::gmp]"
  - "UTF32 是 unsigned long（aarch64 上 8 字节），与 OHOS 4 字节 wchar_t 不兼容，消费者代码必须手工构造 UTF32 数组"
  - "configure 内嵌 mktemp -d 探测在真机会失败，沿用 4ti2 的 mkdir 兜底替换"
  - "真机对脚本文件 execve 有策略限制（configure 补 +x 后直接执行仍 Permission denied），需 sh 显式解释执行；in-tree 构建布局使相对路径可用"
  - "CONFIG_SHELL 必须用 /bin/sh：/data/service/hnp/bin/bash 的 getcwd 在 detached 会话中不可靠（shell-init: getcwd Not atty 噪音并导致后续调用失败）"
  - "老 libtool 需在 PATH 提供 ar/nm/ranlib（注入 /data/service/hnp/bin），且 hnp/bin/ld 是坏符号链接，需用 libtool 的 $LD 覆写机制指定 ld.lld"
  - "上游 UTF8in 的 read(fd,buf,0) 在 bionic 返回 -1 导致过量吞读输入（numconv 每行只读首字符），0002 补丁修复"
  - "上游 Tcl 测试已真实执行（tcl/8.6.16 + tcl_uninum.so，配方内置）：70/70 用例执行（26 向量 + 44 系统），69 个确定性结果，1 个上游中文/泰米尔解析器内存缺陷崩溃（Signal 5，非本适配引入）"
  - "上游 putu8s/fputu8 形参 wchar_t 与 numconv 的 UTF32* 调用在 LP64 上不匹配（输出只出首字符），0003 补丁修复"
  - "上游已知限制：中文数字部分形式（七十七）StringToInt 崩溃（Signal 5，与 alloca 无关，--disable-allocaok 不能消除）；罗马数字 >3999 输出混入指针垃圾（LP64 生成器 bug）。位置数字系统（西方/阿拉伯-印度/天城文等）双向转换正常"
