package: libuninum/2.7
homepage: "https://billposer.org"

# 上游 Makefile.am 未定义 TESTS：automake 的 make check 只构建、不执行用例。
# 上游实质测试为 TestFiles/*.tcl（Tcl 探索性打印脚本，无内置断言），需
# tclsh + tcl_uninum.so 扩展：配方 build_requirements 引入制品仓 tcl/8.6.16，
# build() 内按 TclMakefile 等价命令构建扩展并真实执行（conan create 日志可见
# "上游 Test..." 汇总行）。断言由 test_package/test.c 与 CLI 端到端用例承担。
upstream_check_command: "make check + tclsh TestFiles/*.tcl（真机/CI 真实执行）"
upstream_test_in_build: true
upstream_test_command: "conan create 内置：tclsh 8.6.16 + tcl_uninum.so 执行 TestFiles/*.tcl（TestStringToNumber 逐向量隔离执行）"

upstream_tests:
  - file: TestFiles/TestStringToNumber.tcl
    source: libuninum-2.7/TestFiles/TestStringToNumber.tcl
    description: "字符串->数字转换：26 个向量（Tcl 探索性打印脚本，无内置断言）"
    result: "已真实执行 26/26（逐向量隔离，bionic dlopen 不解析相对路径故仅将 load 行改为绝对路径，其余上游逻辑原样）：25 个确定性输出（20 个正确转换——如 ٦٤٥٣→6,453、४५३→453、xlviii→48；4 个上游确定性错误报告——xl8/混合系统非法字符、28375 西方数字 NS_UNKNOWN 特性、1 个未知系统）+ 1 个上游解析器崩溃（向量 5 七万七，Signal 5，内存缺陷与 LP64 补丁无关，库级定位：StringToInt NS_TYPE_STRING 路径 mpz 损坏，见 notes.md；该崩溃非确定性显现，另一轮为向量 21 泰米尔位值）"
  - file: TestFiles/TestNumberToString.tcl
    source: libuninum-2.7/TestFiles/TestNumberToString.tcl
    description: "数字->字符串转换：44 个数字系统名（Tcl 探索性打印脚本，无内置断言；nslist 列表逐一统计）"
    result: "已真实执行 44/44（rc=0）：30 个系统成功转换 236，14 个确定性错误报告（各系统表示范围/BMP 限制，上游定义行为）"

test_package_tests:
  - file: test.c
    description: "消费者测试：uninum_version、StringToInt（西方/阿拉伯-印度/天城文向量）、GuessNumberSystem、NumberSystemToString/StringToNumberSystem 名称双向映射、IntToString 往返、非法字符报错；向量取自上游 TestStringToNumber.tcl，另断言西方数字需显式指定 NS_WESTERN 的确定性行为"
    command: "./test_uninum"
  - file: test_cli.sh
    description: "消费者 CLI 端到端用例：定位被测包安装的 numconv（dependencies 元数据 + bindirs，不依赖 PATH），断言 Western→Arabic_Western 完整多字符转换（٦٤٥٣，4 字符 8 字节 UTF-8）及反向转换；验证 LP64 补丁（0002 UTF8in 输入/0003 putu8s 输出）的端到端可用性"
    command: "sh test_cli.sh <numconv 绝对路径>"
  - file: conanfile.py
    description: "以 C 编译器编译 test.c 并链接 libuninum+gmp 运行 19 项断言（uninum.h 直接包含 <gmp.h>，gmp 路径一并注入）；随后以绝对路径执行被测包 numconv 运行 CLI 端到端用例"
    command: "test_uninum + test_cli.sh"

assertion_count: 20
# 计数口径：test.c 19 项 ASSERT（版本 2 + 西方显式系统 2 + 西方 NS_ANY 怪癖
# 2 + 阿拉伯 3 + 天城文 2 + 猜测 2 + 名称映射 2 + 往返 3 + 非法字符 1）+
# test_cli.sh CLI 端到端集成用例 1 项（正向 4 字符全串 + 字节数校验 + 反向
# 转换）= 20
# 已知限制：中文数字部分形式（如 七十七）在 OHOS 上触发上游解析器崩溃
# （Signal 5），已在配方中用 --disable-allocaok 规避 alloca 因素，未纳入断言。
