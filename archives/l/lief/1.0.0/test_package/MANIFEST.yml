# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lief/1.0.0
homepage: "https://github.com/lief-project/LIEF"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --test-dir <build> -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (C++ Catch2 unittests, 13 用例 494 断言)
upstream_tests:
  - file: tests/unittests/unittests
    source: LIEF-1.0.0/tests/unittests/
    description: "Catch2 单元测试: iterators/enums/utils/hash/binarystream/iostream/pe/elf/oat/macho (13 用例 494 断言, 全量通过)"
    command: "./unittests --reporter compact"
  - file: tests/test_define_conflicts.cpp
    source: LIEF-1.0.0/tests/test_define_conflicts.cpp
    description: "编译期宏冲突检查可执行 (exit 0)"
    command: "./test_define_conflicts"
# Python pytest 套件 (758 用例) 依赖 LIEF_PYTHON_API=ON, 当前 OHOS C++ 配置未启用 (see reports/test-ledger.md)

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_lief.cpp
    description: "消费者测试: 使用公开 C++ API (LIEF::ELF::Parser) 解析最小 ELF64 头, 校验 entrypoint/class"
    command: "./test_lief"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 494