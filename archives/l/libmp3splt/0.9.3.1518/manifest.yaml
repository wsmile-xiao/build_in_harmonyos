software: libmp3splt
name: libmp3splt
version: 0.9.3.1518
build_system: autotools
category: l/audio
description: Library for mp3/ogg/flac splitting without decoding
license: GPL-2.0+

source:
  url: https://github.com/mp3splt/mp3splt/archive/refs/tags/libmp3splt-0.9.3.1518.tar.gz
  type: tarball

dependencies:
  - libtool >= 2.4.7
  - libltdl
  - libpcre >= 8.45
  - libmad >= 0.15.1b
  - libid3tag >= 0.16.3
  - libogg >= 1.3.5
  - libvorbis >= 1.3.7
  - flac >= 1.4.3

build:
  type: autotools
  system: autotools
  configure_options: --prefix=/usr/local
  env:
    LDFLAGS: "-L~/usr/local/lib"
    CPPFLAGS: "-I~/usr/local/include"
    PKG_CONFIG_PATH: "~/usr/local/lib/pkgconfig"

plugins:
  - libsplt_mp3 (mp3 format)
  - libsplt_ogg (ogg/vorbis format)
  - libsplt_flac (flac format)

artifacts:
  - lib/libmp3splt.so.0.0.9
  - lib/libmp3splt.a
  - lib/libmp3splt0/libsplt_mp3.so
  - lib/libmp3splt0/libsplt_ogg.so
  - lib/libmp3splt0/libsplt_flac.so
  - include/libmp3splt/mp3splt.h
  - include/libmp3splt/version.h
  - lib/pkgconfig/libmp3splt.pc

status: published
notes: |
  编译过程中遇到的问题及解决方案：
  1. HMDFS 文件系统不支持 config.status 的临时文件创建
     - 解决：修改 config.status 脚本使用固定的临时目录
  2. automake/aclocal 预编译包的 AUTOM4TE 占位符问题
     - 解决：设置 AUTOM4TE 环境变量指向系统 autom4te
  3. libltdl 内嵌版本缺少源文件
     - 解决：使用系统预编译的 libltdl 库，并复制头文件到 ~/usr/local/include
  4. 预编译包缺少软链接（libpcre.so）
     - 解决：手动创建软链接