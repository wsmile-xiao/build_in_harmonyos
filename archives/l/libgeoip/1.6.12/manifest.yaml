# 版本级 manifest
# 文件位置: archives/l/libgeoip/1.6.12/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.6.12"
software: "libgeoip"
status: built
build_date: "2026-09-16"
build_system: "autotools"

source:
  url: "https://github.com/maxmind/geoip-api-c/archive/refs/tags/v1.6.12.tar.gz"
  sha256: "99b119f8e21e94f1dfd6d49fbeed29a70df1544896e76cd456f25e397b07d476"
  tar_format: tar.gz

build:
  system: autotools
  # tarball 无 configure, sh bootstrap (autoreconf -fiv) 引导;
  # automake/libtool 走 tool_requires; 生成 configure 后修 E114 umask 077 两处
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - "automake/1.18 (tool)"
    - "libtool/2.5.4 (tool)"
  cc: clang

patches_applied: []

knowledge_gained:
  - "上游 tarball 不带 configure, bootstrap 脚本 autoreconf -fiv 引导 (同 codecrypt 1.8)"
  - "E126: bootstrap 脚本 tarball 解出 rwxrwx---, 需 os.chmod 0o755"
  - "E114: 生成 configure 的 umask 077 两处需替换 (HMDFS setgid 目录不可写)"
  - "config.guess 不识别 HarmonyOS: triplet 显式 aarch64-unknown-linux-ohos 绕过探测"
  - "零依赖: 核心库不用 zlib, .dat 读取走裸 stdio+mmap, 源码零改动纯构建系统适配"
  - "上游 TESTS 注册 2 个 (test-geoip/test-geoip-invalid-file), 8 个 noinst 测试需商业数据库无法跑"
  - "GeoIP.dat 数据文件不打包 (运行时用户自备), test_package 携带 tarball 自带样例做验证"
  - "GitCode PR diff 通道无法携带真二进制文件 (missing binary patch data): test_package 样例库改 base64 文本形态, test() 内解码+sha256 校验"

compiled_artifacts:
  - name: "libGeoIP"
    status: "success"
    static: "libGeoIP.a"
    dynamic: "libGeoIP.so.1.6.12"
  - name: "geoiplookup"
    status: "success"
  - name: "geoiplookup6"
    status: "success"

upstream_tests:
  registered: 2
  passed: 2
  detail: "make check: test-geoip + test-geoip-invalid-file 全 PASS（设备原生实跑）"
