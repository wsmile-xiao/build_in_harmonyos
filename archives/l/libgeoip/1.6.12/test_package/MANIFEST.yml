# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libgeoip/1.6.12
homepage: "https://github.com/maxmind/geoip-api-c"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check -C test (exploratory build, run outside conan build)"

# 上游实际运行的测试程序 (test/Makefile.am: TESTS = test-geoip test-geoip-invalid-file)
upstream_tests:
  - file: test-geoip.c
    source: geoip-api-c-1.6.12/test/test-geoip.c
    description: "国家库查询全量回归：61 IP 向量集 × (code/code3 × addr/name) + 库信息横幅 + NULL 输入容错 + 文件/内存两种缓存模式"
    command: "./test-geoip"
  - file: test-geoip-invalid-file.c
    source: geoip-api-c-1.6.12/test/test-geoip-invalid-file.c
    description: "无效数据库文件容错：用 README.md 假扮 .dat 打开后对任意 IP 查询须返回 NULL"
    command: "./test-geoip-invalid-file"

# noinst 测试程序（编译但不注册进 TESTS，需 MaxMind 商业数据库 .dat 文件）
# benchmark + test-geoip-region/city/org/domain/asnum/isp/netspeed: 需
# GeoIPRegion.dat / GeoIPCity.dat 等商业数据库，源码 tarball 不携带

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: GeoIP.dat.b64
    description: "上游样例国家库（base64 文本形态，test 时解码+sha256 校验）——GitCode PR diff 通道无法携带二进制文件"
    command: "python3 -c base64 decode"
  - file: test_geoip.c
    description: "消费者测试：镜像上游 test-geoip.c 流程（61 IP 向量集全量跑）链接 conan 包内 libGeoIP"
    command: "./test_geoip"
  - file: test_geoip_ohos.c
    description: "鸿蒙特有测试：musl 页大小/mmap 路径 + stdio/pread 查询路径 + 自定义目录发现"
    command: "./test_geoip_ohos"
  - file: geoiplookup
    description: "命令行工具端到端：geoiplookup/geoiplookup6 用样例库查询国家"
    command: "geoiplookup -d <datadir> 12.87.118.0"

# 测试断言总数 (近似值, 用于质量评估)
# test_geoip.c: 61 IPs × 3 lookups + banner + NULL×2 + fs-mode×2 ≈ 188
# test_geoip_ohos.c: page/banner/lookups/custom-dir ≈ 7
assertion_count: 195
