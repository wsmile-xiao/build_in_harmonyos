software: libssh2
version: "1.11.0"
status: built
build_date: "2026-08-22"
build_system: cmake

source:
  url: "https://www.libssh2.org/download/libssh2-1.11.0.tar.gz"
  sha256: "3736161e41e2693324deb38c26cfdc3efe6209d634ba4258db1cecff6a5ad461"
  tar_format: tar.gz

build:
  system: cmake
  dependencies:
    - "openssl/3.5.6.1"
    - "zlib/1.3.1.1"
  configure_options:
    - "CRYPTO_BACKEND=OpenSSL"
    - "ENABLE_ZLIB_COMPRESSION=ON"
    - "BUILD_SHARED_LIBS=ON"
    - "BUILD_STATIC_LIBS=OFF"
    - "BUILD_EXAMPLES=OFF"
    - "BUILD_TESTING=OFF"
    - "ENABLE_WERROR=OFF"
