package: "libmpack-lua/1.0.13"
homepage: "https://github.com/libmpack/libmpack-lua"

upstream_check_command: "recipe build() runs test.lua through test/upstream_runner.c and test/upstream_runner.lua"
upstream_test_in_build: true
upstream_test_command: "upstream_runner upstream_runner.lua mpack.so test.lua"
upstream_tests:
  - file: test.lua
    discovered: 23
    assertion_calls: 176
    description: "Official libmpack-lua functional suite, executed unchanged."
  - file: leak_test.lua
    assertion_calls: 4
    description: "Official registry-leak child test, invoked by test.lua."

test_package_tests:
  - file: test_lmpack.c
    description: >-
      Creates a Lua 5.1 VM, dlopen()s the packaged mpack.so, resolves
      luaopen_mpack, requires the module, and checks pack/unpack, BIN mode,
      MsgPack-RPC request/receive, and mpack.NIL behavior.
    command: "test_lmpack /path/to/mpack.so"

harmonyos_specific_test:
  file: test_lmpack.c
  checks:
    - "__OHOS__ compiler macro is present"
    - "uname() returns a non-empty target identity"
    - "the packaged module path is a regular file"
    - "the OHOS loader resolves luaopen_mpack with dlopen()/dlsym()"

assertion_count: 188
host_assertion_count: 186
