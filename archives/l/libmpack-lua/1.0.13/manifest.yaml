software: "libmpack-lua"
version: "1.0.13"
status: built
build_date: "2026-09-16"
build_system: custom
package_type: lua-native
license: MIT
homepage: "https://github.com/libmpack/libmpack-lua"

source:
  url: "https://github.com/libmpack/libmpack-lua/archive/refs/tags/1.0.13.tar.gz"
  sha256: "436a6a3973207403d3f20082002c32e74c25d9149ff2516dc06b0b41514044bf"
  tar_format: tar.gz

build:
  system: custom
  dependencies:
    - "lua/5.1.5"
    - "libmpack/1.0.5"
  target_module: "lib/lua/5.1/mpack.so"
  compiler: clang
  cflags:
    - "-fPIC"
    - "-DMPACK_USE_SYSTEM"
    - "-DMPACK_DEBUG_REGISTRY_LEAK"

patches_applied: []

test_summary:
  upstream_suite:
    source: "test.lua"
    discovered: 23
    assertion_calls: 176
    leak_test_assertion_calls: 4
    runner: "test/upstream_runner.lua compatibility harness"
  consumer:
    source: "test_package/test_lmpack.c"
    checks: 8
    host_checks: 6
  harmonyos_specific_test: true
  harmonyos_target: "OHOS x86_64 via hdc"
  harmonyos_consumer_checks_passed: 8
  harmonyos_upstream_cases_passed: 23
  upstream_tests_modified: false

knowledge_gained:
  - "libmpack-lua 1.0.13 is a Lua 5.1 C module and leaves the Lua host API unresolved for the embedding process."
  - "The module links the published libmpack/1.0.5 static archive and installs as lib/lua/5.1/mpack.so."
  - "The upstream test.lua suite uses Busted globals; the recipe runs the unchanged upstream file with a small Lua 5.1 compatibility harness because the repository Busted package targets Lua 5.4."
  - "The HarmonyOS consumer verifies __OHOS__, uname(), regular-file module placement, dlopen(), and dlsym(luaopen_mpack)."
