package: libpopcnt/2.0
homepage: "https://github.com/kimwalisch/libpopcnt"

# 上游测试命令（header-only，无外部依赖；CMake test/ 目录 GLOB 两个测试源）
upstream_check_command: "cmake -B build-host && cmake --build build-host && ctest --test-dir build-host"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（test/CMakeLists.txt GLOB 发现）
upstream_tests:
  - file: test/test1.cpp
    description: "C++ popcnt correctness checks (small + large arrays)"
    command: "./test1"
  - file: test/test2.c
    description: "C popcnt correctness checks"
    command: "./test2"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "消费者测试 — 真实调用 libpopcnt.h popcnt/popcnt64 并核对位计数"
    command: "./test_libpopcnt"
  - file: test_hmos.c
    description: "OHOS aarch64 特定验证 — 真实 popcnt API（含大数组向量路径）"
    command: "./test_libpopcnt_hmos"
