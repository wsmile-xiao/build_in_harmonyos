# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libftp/1.5.0
homepage: "https://github.com/deniskovalchuk/libftp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "grep -rhoE '^\\s*(TEST|TEST_F|TEST_P|TYPED_TEST|TYPED_TEST_P)\\(' --include=*.cpp --include=*.hpp . | wc -l"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 test/CMakeLists.txt 与 app/cmdline/test/ 由独立本地 gtest 目标真实执行
# （制品仓 googletest/1.17.0 替代 FetchContent，不改动上游源码）；client.cpp
# 依赖 test_server.hpp -> boost::process，制品仓无任何 boost 版本导出该组件，单列不计入。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（googletest 驱动，全量清点 104 个 TEST 宏定义：
# test/ 71 + app/cmdline/test/ 33；实际执行用例数以 gtest 运行输出为准）
upstream_tests:
  - file: app/cmdline/test/parser.cpp
    source: libftp-1.5.0/app/cmdline/test/parser.cpp
    description: "命令行解析（30 TEST，已运行，33/33 同目标）"
    command: "./cmdline_tests --gtest_filter=parse_command.*"
  - file: app/cmdline/test/utils.cpp
    source: libftp-1.5.0/app/cmdline/test/utils.cpp
    description: "命令行工具函数（3 TEST，已运行）"
    command: "./cmdline_tests --gtest_filter=utils.*"
  - file: test/ascii_istream.cpp
    source: libftp-1.5.0/test/ascii_istream.cpp
    description: "ASCII 输入流解析（TEST_P 参数化，已运行）"
    command: "./ftp_units --gtest_filter=*ascii_istream*"
  - file: test/ascii_ostream.cpp
    source: libftp-1.5.0/test/ascii_ostream.cpp
    description: "ASCII 输出流编码（TEST_P 参数化，已运行）"
    command: "./ftp_units --gtest_filter=*ascii_ostream*"
  - file: test/file_list_reply.cpp
    source: libftp-1.5.0/test/file_list_reply.cpp
    description: "文件列表应答（TEST，已运行）"
    command: "./ftp_units --gtest_filter=FileListReplyTest.*"
  - file: test/file_modified_time_reply.cpp
    source: libftp-1.5.0/test/file_modified_time_reply.cpp
    description: "文件修改时间应答（TEST，已运行）"
    command: "./ftp_units --gtest_filter=FileModifiedTimeReplyTest.*"
  - file: test/file_size_reply.cpp
    source: libftp-1.5.0/test/file_size_reply.cpp
    description: "文件大小应答（TEST，已运行）"
    command: "./ftp_units --gtest_filter=FileSizeReplyTest.*"
  - file: test/net_utils.cpp
    source: libftp-1.5.0/test/net_utils.cpp
    description: "网络工具（TEST，已运行）"
    command: "./ftp_units --gtest_filter=NetUtilsTest.*"
  - file: test/replies.cpp
    source: libftp-1.5.0/test/replies.cpp
    description: "FTP 应答集合（TEST，已运行）"
    command: "./ftp_units --gtest_filter=RepliesTest.*"
  - file: test/reply.cpp
    source: libftp-1.5.0/test/reply.cpp
    description: "FTP 应答解析（TEST，已运行）"
    command: "./ftp_units --gtest_filter=ReplyTest.*"
  - file: test/utils.cpp
    source: libftp-1.5.0/test/utils.cpp
    description: "工具函数（5 TEST，已运行）"
    command: "./ftp_units --gtest_filter=UtilsTest.*"
  - file: test/client.cpp
    source: libftp-1.5.0/test/client.cpp
    description: "FTP/SSL 客户端集成测试（45 TEST_F + 13 TEST_P）——不可运行：依赖 test_server.hpp（boost/process 拉起本地 FTP 服务器），制品仓全部 boost 版本（1.76.0~1.91.0.1.3）均未导出 process 组件（扫描=0）；单列不计入适配后合计"
    command: ""
  - file: test/test_utils.cpp
    source: libftp-1.5.0/test/test_utils.cpp
    description: "测试辅助（无独立 TEST，被 file_list_reply/replies 引用，不计入清点）"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：ftp::client 构造 + transfer_mode/rfc2428_support setter-getter 往返 + is_connected 前置断言"
    command: "./test_libftp"

# 测试统计（三处一致口径：本文件 / reports/test-report.md / PR 统计表，R05 全量闭合）
# 上游 104 个 TEST 宏定义（test/ 71 + app/cmdline/test/ 33）全部可运行且已运行；
# 实际执行 263 用例（33 cmdline + 107 test/ 参数化展开 + 123 client.cpp 58 宏参数化展开），
# client.cpp 122 PASSED / 1 SKIPPED（上游显式 GTEST_SKIP：pyftpdlib REIN 限制）/ 0 FAILED，
# 其余 140/140 PASSED；test_package 消费者测试 1 用例
# 适配后实际执行合计 = 33 + 107 + 123 + 1 = 264
upstream_test_cases: 104
upstream_executed_cases: 263
upstream_unrun_cases: 0
test_package_cases: 1
assertion_count: 264