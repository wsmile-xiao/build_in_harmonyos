# conandata.yml — libfdisk 2.42.3
# libfdisk: util-linux 套件中的分区表操作库（DOS/GPT/SGI/SUN/BSD）。
# 本包从 util-linux 官方发行归档裁剪构建，仅编 libfdisk + 必需 libuuid。
# 官方源：https://www.kernel.org/pub/linux/utils/util-linux/v2.42/
# sha256 取自官方签名文件 sha256sums.asc（2026-09-02，v2.42.3）：
#   66ac7c0e725278eb2b039e3104f2c91119341d941b41bac7a285c695f940bd57  util-linux-2.42.3.tar.xz
#   2f4c3484f67c79688a50974b9e0ae52d089fe07a63d2dbb59b20e50ed26fe89f  util-linux-2.42.3.tar.gz
# 下列 URL 共用同一 sha256 校验；已验证可用的官方同源端点在前，
# 官方原始 URL（cdn.kernel.org）保留在最后作为回退。
# 映射复用 ci/conan/build_and_test.sh 的 kernel.org CDN 规则：
#   p = 去掉 https://cdn.kernel.org/ 前缀后的路径；
#   ustc -> https://mirrors.ustc.edu.cn/kernel.org/<p>；
#   tuna -> https://mirrors.tuna.tsinghua.edu.cn/<p>；
#   nju  -> https://mirror.nju.edu.cn/<p>。
# 注：CI 的 mirror-fallback 只改写单值 url，本文件已是列表形式，
# 故此处直接按上述规则手写有序列表，不依赖 CI 改写。
# 2026-09-25 真机预检（19:08 轮）：三个国内镜像对 v2.42.3 均 404
# （Not found），随后 mirrors.edge.kernel.org 成功完成 10.7MB 下载
# （Sources correctly downloaded），configure 成功，make 至 CC 阶段时
# SSH 中断（Connection closed by remote host，属传输/链路抖动）。
# 因此把已验证成功的 edge/www 置顶，直达可用源、缩短下载窗口；
# 国内三镜像留作后续同步后的中间回退，cdn 仍最后回退；sha256 不变。
# recipe source() 逐 URL 重试，单源超时/中断自动落到下一源，不致命。
sources:
  url:
    - "https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz"
    - "https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz"
    - "https://mirrors.ustc.edu.cn/kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz"
    - "https://mirror.nju.edu.cn/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz"
    - "https://cdn.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz"
  sha256: "66ac7c0e725278eb2b039e3104f2c91119341d941b41bac7a285c695f940bd57"

patches: {}
