# libfdisk/2.42.3 test_package 上游测试声明
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: libfdisk/2.42.3
homepage: "https://github.com/util-linux/util-linux"

# 上游测试审计（结论：libfdisk 库视图拥有 6 个可执行的 C 单元测试，
# 配方在 build() 全量运行）：
# 1) libfdisk/src/Makemodule.am (v2.42.3) 在 if BUILD_LIBFDISK_TESTS
#    （--enable-static 触发）下定义 6 个 check_PROGRAMS：
#    test_fdisk_ask / test_fdisk_gpt / test_fdisk_script /
#    test_fdisk_utils / test_fdisk_version / test_fdisk_item，
#    每个以 -DTEST_PROGRAM 编译，对应源码中的自检 main，无 python 依赖。
# 2) `make check` 负责构建这 6 个二进制（automake TESTS 为空，
#    不做 stdout 字符串计数；配方按进程退出码逐个计数）。
# 3) ts/ fdisk (16 脚本) + ts/sfdisk (7 脚本) 需要 fdisk/sfdisk 程序
#    （本包 --disable-all-programs 已禁用），归同源工具包所有，
#    不计入本库包总数，避免跨包重复计数。
# 4) 全树无 gtest/pytest/ctest；6 个二进制即全部 owning 用例。
upstream_tests_exist: true
upstream_test_audit: "审计 util-linux-2.42.3 上游（kernel.org util-linux-2.42.3.tar.xz，sha256 66ac7c0e…940bd57）：libfdisk/src/Makemodule.am 在 BUILD_LIBFDISK_TESTS（--enable-static）下定义 6 个 check_PROGRAMS（ask/gpt/script/utils/version/item），均以 -DTEST_PROGRAM 编译为可执行自检程序；ts/fdisk 16 个与 ts/sfdisk 7 个脚本需 fdisk/sfdisk 程序（本包已禁用），归工具包所有，本库包不计入。"

upstream_check_command: "make test_fdisk_ask test_fdisk_gpt test_fdisk_script test_fdisk_utils test_fdisk_version test_fdisk_item"
upstream_test_in_build: true
upstream_test_command: "test_fdisk_ask --ranges; test_fdisk_gpt --getattr <gpt.img> 1; test_fdisk_script --tokens 'a,b,c'; test_fdisk_utils --partnames /dev/sda; test_fdisk_version --print; test_fdisk_item --list-items <gpt.img> (scratch 10MB GPT image with 1 Linux partition in TMPDIR via mk_gpt helper: single-partition script + fdisk_write_disklabel; bare ./test_fdisk_* without args exits 1 by design via fdisk_run_test Usage)"

upstream_tests:
  - file: libfdisk/src/Makemodule.am
    source: util-linux-2.42.3.tar.xz/libfdisk/src/Makemodule.am
    description: "上游测试清单：BUILD_LIBFDISK_TESTS 下 6 个 check_PROGRAMS 定义"
    command: "make check"
  - file: libfdisk/src/version.c
    source: util-linux-2.42.3.tar.xz/libfdisk/src/version.c
    description: "上游自检示例：-DTEST_PROGRAM 下的 test_fdisk_version 入口"
    command: "./test_fdisk_version"

test_package_tests:
  - file: test_libfdisk.c
    description: "消费者测试：version/context/label/partition/table/script 共 14 个 CHECK（R34 反空壳：全部经真实 libfdisk API，失败即非零退出）"
    command: "test_libfdisk"

# Counting unit: one check_PROGRAM binary (exit code 0 = pass).
# Single parseable framework (direct binary execution), so
# upstream_test_count_method is auto. Numbers are placeholders until
# true-machine evidence; HMBS markers carry the authoritative counts.
upstream_test_total: 6
upstream_test_count_method: auto
upstream_test_passed: 6
upstream_test_failed: 0
upstream_test_skipped: 0

assertion_count: 14
