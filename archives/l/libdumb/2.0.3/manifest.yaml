version: "2.0.3"
software: libdumb
build_system: cmake
status: built
build_date: "2026-09-29"

source:
  url: "https://github.com/kode54/dumb/archive/refs/tags/2.0.3.tar.gz"
  sha256: "99bfac926aeb8d476562303312d9f47fd05b43803050cd889b44da34a9b2a4f9"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_ALLEGRO4=OFF"
    - "-DUSE_SSE=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies: []
  cc: clang (ohos-sdk)

patches_applied: []
knowledge_gained:
  - "上游 katajakasa/dumb 已死(IRC 引用、仓库消失),de facto 维护 fork = kode54/dumb(CMake);选源时原仓库 404 即应切换事实维护 fork,与 libzippp 7.1(ctasada→ctabin)同模式"
  - "上游 CMakeLists cmake_minimum_required 3.1 在 CMake 4 拒绝 → -DCMAKE_POLICY_VERSION_MINIMUM=3.5(libzippp 同款)"
  - "BUILD_ALLEGRO4 默认 ON 引 allegro4 依赖必须关;USE_SSE 默认 ON 是 x86 旗标,aarch64 需显式 OFF;BUILD_EXAMPLES 默认 ON 引 argtable2/SDL2 查找,全关"
  - "license 为 Unlicense(dumb 2.0 起重授权),非早期 GPL"
