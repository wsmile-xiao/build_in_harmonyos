package: libdumb/0.9.3
homepage: "https://dumb.sourceforge.net/"
upstream_check_command: "find . -iname '*test*'; grep -nE '^(check|test):' Makefile make/Makefile.inc"
upstream_test_in_build: false
upstream_test_command: "No upstream automated test target exists in the official 0.9.3 tarball"
upstream_tests: []
added_tests:
  - file: test_dumb.c
    description: "memory_io: endian reads, position, skip and end-of-file error"
  - file: test_dumb.c
    description: "mod_decode: parse a self-authored sample-bearing ProTracker MOD and verify duration"
  - file: test_dumb.c
    description: "stereo_pcm_render: render 4096 frames, verify nonzero PCM, channels and position"
  - file: test_dumb.c
    description: "invalid_and_missing_module: reject malformed and nonexistent modules"
  - file: test_ohos_storage.c
    description: "ohos_arm64_storage_mod_decode: verify native HarmonyOS ARM64 ABI and load a UTF-8-named MOD from application storage, render 4096 nonzero stereo frames, then clean the isolated fixture"
ohos_tests:
  - file: test_ohos_storage.c
    name: ohos_arm64_storage_mod_decode
    command: "./test_ohos_storage"
ohos_test_count: 1
