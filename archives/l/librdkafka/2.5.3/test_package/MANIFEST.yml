# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: librdkafka/2.5.3
homepage: "https://github.com/confluentinc/librdkafka"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (librdkafka make check runs integrity checks)
upstream_tests:
  - file: src/Makefile (check target)
    source: librdkafka-2.5.3/src/Makefile
    description: "Library integrity check: symbol visibility, librdkafka.so.1/librdkafka.a validity"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Creates rd_kafka_conf, checks version string, sets broker list config"
    command: "./test_librdkafka"

# 测试断言总数 (近似值)
assertion_count: 4
