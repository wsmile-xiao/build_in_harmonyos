sources:
  "0.5.9":
    url: "https://github.com/rpm-software-management/libpkgmanifest/archive/refs/tags/v0.5.9.tar.gz"
    sha256: "7b268f9c12f06137493def0d18bb7d8f59f2af0d26c1f9c0d531dabb80ae2854"
patches:
  "0.5.9":
    - patch_file: "patches/0001-test-cmake-use-find_package-for-gtest.patch"
      patch_type: "portability"
      description: "Replace pkg_check_modules(gtest/gmock) with find_package(GTest) for Conan cross-compilation compatibility"
    - patch_file: "patches/0002-replace-std-ranges-distance.patch"
      patch_type: "portability"
      description: "Replace std::ranges::distance with packages.size() - Clang15 libc++ lacks C++20 ranges"
    - patch_file: "patches/0003-remove-unused-private-field.patch"
      patch_type: "portability"
      description: "Remove unused private field 'repositories' to fix -Werror,-Wunused-private-field"
    - patch_file: "patches/0004-replace-std-format.patch"
      patch_type: "portability"
      description: "Replace std::format with string concatenation for OHOS clang 15 libc++ compatibility"
    - patch_file: "patches/0005-replace-std-views-filter.patch"
      patch_type: "portability"
      description: "Replace std::views::filter with manual loop for OHOS clang 15 libc++ compatibility"
    - patch_file: "patches/0006-add-yaml-cpp-include-dirs.patch"
      patch_type: "portability"
      description: "Add include_directories and link_directories for yaml-cpp; upstream assumes system install paths"
    - patch_file: "patches/0007-replace-std-views-values-keys.patch"
      patch_type: "portability"
      description: "Replace std::views::values/keys and std::ranges::copy with structured bindings for OHOS clang 15 libc++"
    - patch_file: "patches/0008-replace-std-format-in-test.patch"
      patch_type: "portability"
      description: "Replace std::format with std::to_string in test for OHOS clang 15 libc++ compatibility"
