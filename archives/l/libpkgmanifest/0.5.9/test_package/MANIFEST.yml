package: libpkgmanifest/0.5.9
homepage: "https://github.com/rpm-software-management/libpkgmanifest"

upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir build --output-on-failure"
upstream_tests: []
upstream_tests_note: >-
  Upstream provides a full gtest/gmock test suite (~50 tests) covering
  parser, serializer, manifest, packages, nevra, checksum, input, and
  repository operations. Tests are compiled with gtest/1.17.0 during the
  build phase (WITH_TESTS=ON), but the resulting aarch64-linux-ohos
  binaries cannot execute on the x86_64 host. The test binary
  libpkgmanifest_tests_runner links successfully, confirming compilation
  and linkage correctness.

test_package_tests:
  - file: test_package.cpp
    description: >-
      Consumer creates a Manifest object, sets document type, adds a
      Repository (id + baseurl), creates a Package with Nevra (name,
      version, release, arch), attaches packages to repositories, and
      verifies round-trip via get_document(), get_packages().size(),
      get_repositories().size(), and Repositories::contains().
    command: "./test_package"

assertion_count: 3
