# test_package/MANIFEST.yml — liboprf 0.9.4 上游测试声明
# 源码审计（tag v0.9.4）：src/tests/makefile 的 `all` 构建 11 个测试二进制，
# `tests` 目标依次运行这 11 个。反例测试契约逐条取自该 makefile：
# tp-dkg-corrupt / stp-dkg-corrupt 以 `|| exit 0` 运行（任一退出都不让 make 变红；
# 配方按“1..125 非零退出”判定篡改被检出，崩溃信号不计为通过）；
# toprf-update-corrupt 无 `|| exit 0`（上游要求退出 0，src/toprf-update.c 注释：
# 该破坏“不影响协议结果， end result is correct”）。
# noise_xk/example 的 `test` 目标不属于 `tests`，本次不计入。

package: liboprf/0.9.4
homepage: "https://github.com/stef/liboprf"

upstream_check_command: "make -C src/tests tests"
upstream_test_in_build: true
upstream_test_command: >-
  make -C src/tests all && ./dkg && ./tv1 && ./tv2 && ./toprf &&
  (ulimit -s 66000; ./tp-dkg 3 2) &&
  (ulimit -s 66000; ./tp-dkg-corrupt 3 2) &&
  (ulimit -s 1966000; ./stp-dkg 9 4) &&
  (ulimit -s 1966000; ./stp-dkg-corrupt 9 4) &&
  (ulimit -s 1966000; ./toprf-update 9 4) &&
  (ulimit -s 1966000; ./toprf-update-corrupt 9 4) && ./mpmult

upstream_tests:
  - file: "dkg.c"
    source: "liboprf-0.9.4/src/tests/dkg.c"
    description: "JF-DKG 分布式密钥生成单元测试"
    command: "./dkg"
    count: 1
  - file: "test.c (CFRG vectors, TC=0)"
    source: "liboprf-0.9.4/src/tests/test.c"
    description: "CFRG OPRF 官方测试向量（Blind/Evaluate/Unblind/Finalize 比对）"
    command: "./tv1"
    count: 1
  - file: "test.c (CFRG vectors, TC=1)"
    source: "liboprf-0.9.4/src/tests/test.c"
    description: "CFRG OPRF 官方测试向量（第二组编译配置）"
    command: "./tv2"
    count: 1
  - file: "toprf.c"
    source: "liboprf-0.9.4/src/tests/toprf.c"
    description: "阈值 OPRF 基本流程测试"
    command: "./toprf"
    count: 1
  - file: "tp-dkg.c"
    source: "liboprf-0.9.4/src/tests/tp-dkg.c"
    description: "可信第三方 DKG 多方测试（3 方，阈值 2）"
    command: "(ulimit -s 66000; ./tp-dkg 3 2)"
    count: 1
  - file: "tp-dkg.c (corrupt)"
    source: "liboprf-0.9.4/src/tests/tp-dkg.c"
    description: "反例测试：注入虚假投诉，篡改应被检出（上游以 `|| exit 0` 运行；配方按 1..125 非零退出判定通过，崩溃不计）"
    command: "(ulimit -s 66000; ./tp-dkg-corrupt 3 2)"
    count: 1
  - file: "stp-dkg.c"
    source: "liboprf-0.9.4/src/tests/stp-dkg.c"
    description: "半可信 DKG 多方测试（9 方，阈值 4）"
    command: "(ulimit -s 1966000; ./stp-dkg 9 4)"
    count: 1
  - file: "stp-dkg.c (corrupt)"
    source: "liboprf-0.9.4/src/tests/stp-dkg.c"
    description: "反例测试：破坏份额/承诺并虚假指控，篡改应被检出（上游以 `|| exit 0` 运行；配方按 1..125 非零退出判定通过，崩溃不计）"
    command: "(ulimit -s 1966000; ./stp-dkg-corrupt 9 4)"
    count: 1
  - file: "toprf-update.c"
    source: "liboprf-0.9.4/src/tests/toprf-update.c"
    description: "阈值 OPRF 密钥更新多方测试（9 方，阈值 4）"
    command: "(ulimit -s 1966000; ./toprf-update 9 4)"
    count: 1
  - file: "toprf-update.c (corrupt)"
    source: "liboprf-0.9.4/src/tests/toprf-update.c"
    description: "反例测试：该破坏不影响协议结果（源码注释 end result is correct），上游 tests 目标无 `|| exit 0`，按退出 0 判定通过"
    command: "(ulimit -s 1966000; ./toprf-update-corrupt 9 4)"
    count: 1
  - file: "mpmult.c"
    source: "liboprf-0.9.4/src/tests/mpmult.c"
    description: "多方乘法（Simplified VSS fast-track）测试"
    command: "./mpmult"
    count: 1

test_package_tests:
  - file: "test_oprf.c"
    description: >-
      消费者视角验证：完整 OPRF 往返（KeyGen/Blind/Evaluate/Unblind/Finalize），
      检查确定性（两次独立盲化输出一致）与定义域分离（不同输入输出不同），共 2 个检查
    command: "./test_oprf"
    count: 2
    assertions: 2

assertion_count: 2
