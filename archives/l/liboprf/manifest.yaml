# 软件级 manifest（遵循 ARCHIVE-SPEC v2.0）
# 文件位置: archives/l/liboprf/manifest.yaml

software: liboprf
display: "liboprf"
description: "Oblivious Pseudorandom Function (OPRF) and threshold OPRF library based on libsodium"
category: crypto
homepage: "https://github.com/stef/liboprf"
license: LGPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "手写 makefile 构建（src/makefile，无 configure）；CC/AR/CPPFLAGS/LDFLAGS 由配方从探测到的可用编译器注入，CFLAGS 保持上游加固选项原样"
    - "vendored libsodium-1.0.20（>= 1.0.19 启用 HAVE_SODIUM_HKDF，无需 aux_ 兼容源）；无外部 conan requires，规避 conancenter 影子配方导致的 hnp-bash 缺失重编失败"
    - "tool_requires pkgconf/3.0.5 满足 makefile 的 libsodium 版本探测（以 staged libsodium.pc 应答）"
    - "上游测试套件（src/tests，11 个二进制，含 3 个反例测试）在 build() 末尾真实执行并输出 HMBS_UPSTREAM_TEST_RESULT"
  common_dependencies: []

versions:
  "0.9.4":
    status: built
    build_date: "2026-09-18"
