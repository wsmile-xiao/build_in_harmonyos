# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lsp-test-fw/1.0.35
homepage: "https://github.com/lsp-plugins/lsp-test-fw"

# 上游测试命令（lsp-plugins 自研测试框架：<artifact>-test <subsystem>）
upstream_check_command: "./lsp-test-fw-test utest --verbose --jobs 1"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试二进制随 FEATURES="test" 构建，本地人工/CI 均以 utest 子命令运行；
# 不并入 recipe 自动流程（框架自带测试为 demo 级，消费者以 test_package 验证为主）。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/test/main.cpp
    source: lsp-test-fw-1.0.35/src/test/main.cpp
    description: "框架入口 main()，调用 lsp::test::main 执行注册的子系统测试"
    command: "./lsp-test-fw-test utest"
  - file: src/test/utest/demo/utest1.cpp
    source: lsp-test-fw-1.0.35/src/test/utest/demo/utest1.cpp
    description: "utest 子系统 demo 测试（框架示例）"
    command: "./lsp-test-fw-test utest"
  - file: src/test/utest/demo/utest2.cpp
    source: lsp-test-fw-1.0.35/src/test/utest/demo/utest2.cpp
    description: "utest 子系统 demo 测试（框架示例）"
    command: "./lsp-test-fw-test utest"
  - file: src/test/ptest/demo/trig.cpp
    source: lsp-test-fw-1.0.35/src/test/ptest/demo/trig.cpp
    description: "ptest 子系统 demo 测试（框架示例）"
    command: "./lsp-test-fw-test ptest"
  - file: src/test/mtest/demo/mtest1.cpp
    source: lsp-test-fw-1.0.35/src/test/mtest/demo/mtest1.cpp
    description: "mtest 子系统 demo 测试（框架示例）"
    command: "./lsp-test-fw-test mtest"
  - file: src/test/init/init1.cpp
    source: lsp-test-fw-1.0.35/src/test/init/init1.cpp
    description: "init 钩子 demo 测试"
    command: "./lsp-test-fw-test init"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：校验版本宏 + 运行 lsp::test::main 入口实调库"
    command: "./test_lsp-test-fw"

# 测试断言总数（近似值，上游自带 demo 测试）
assertion_count: 8
