# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.35/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.35"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: "{BUILD_SYSTEM}"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lsp-plugins/lsp-test-fw.git"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lsp-plugins 自研 make 系统按 uname -s 探测平台：OpenHarmony PC 返回 'HarmonyOS'（上游不识别落入 Unknown 分支），make config 必须显式传 PLATFORM=Linux；OHOS aarch64(-march=armv8-a+asimd) 与上游 Linux 路径一致，源码零 #ifdef 平台差异，零补丁"
  - "codeload.github.com/<org>/<repo>/tar.gz/refs/tags/<tag> 的 URL 无文件扩展名，conan 的 get() 会误判为 zip：conandata.yml 必须同时给 filename 参数指定 .tar.gz"
  - "OHOS 动态加载器要求 ELF 持有有效代码签名：未签名 .so 在运行期报 'Error loading shared library'，未签名可执行报 EPERM(exit 126/127)。需用 binary-sign-tool sign -selfSign 1 签名（mesa recipe 同款）；签名必须在所有 ELF 修改（objcopy/patchelf）之后"
  - "OpenDesk 沙箱下仅 ~/.conan2 等 hmdfs 域目录的可执行产物可 exec，/data/storage/el2/base/temp 等应用数据域新建文件即使 chmod 755 也 EPERM；conan 构建/测试目录恰在家目录故测试可跑"
  - "conan-verify/finish 的 G2/G3 使用 ci/conan/profiles/ohos-aarch64 硬编码路径（/data/service/hnp/bin/clang++，仅 CI worker 存在）；本地需建同名或别名 profile，微调 compiler_executables 指向本地工具链"
  - "test_package 的 test() 中 llvm-objcopy 加 2>/dev/null || true 会被 CI L1d 假测试检测（grep self.run.*true）误判为假测试；改用 conan self.run(..., ignore_errors=True) 规避"
