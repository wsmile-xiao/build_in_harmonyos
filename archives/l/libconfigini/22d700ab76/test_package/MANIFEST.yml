# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libconfigini/22d700ab76
homepage: "https://github.com/taneryilmaz/libconfigini"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libconfigini 使用纯 Makefile（无 configure），上游测试入口为 tests/Makefile
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test.c
    source: libconfigini-22d700ab76/tests/test.c
    description: "上游用户测试源：Test1(读文件) Test2(编辑保存) Test3(增删节) Test4(无节配置)，main 依次调用，返回 0"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过已安装头文件/库构建内存配置并读写回环，验证公开 API 行为"
    command: "./test_libconfigini"
  - file: test_ohos.c
    description: "鸿蒙专项测试：解析样例 INI、错误路径返回码、无节配置，覆盖 OHOS libc/malloc 行为"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
