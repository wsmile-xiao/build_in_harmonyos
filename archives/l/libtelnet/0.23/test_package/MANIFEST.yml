# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtelnet/0.23
homepage: "https://github.com/seanmiddleditch/libtelnet"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libtelnet 上游测试通过 test/run-all.sh → test/run-test.sh 驱动 util/telnet-test
# 逐条跑 11 个 .test 场景（environ01-03/mssp01/rfc1143/simple01-02/ttype01/zmp01-03），
# 每条用 `cmp` 对比实际输出与 .test 内 `%%` 分隔的期望输出，最终汇总 1 个 PASS。
upstream_tests:
  - file: test/run-all.sh
    source: libtelnet-0.23/test/run-all.sh
    description: "上游 Telnet 协议状态机测试套件（11 个 .test 场景：environ/mssp/rfc1143/simple/ttype/zmp）"
    command: "./test/run-all.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：创建 telnet 状态机并喂入数据与 IAC DO 协商，断言事件经回调送达（R34 实质测试）"
    command: "./test_libtelnet"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 run-test.sh 对 11 个 .test 逐条 cmp 比对（11 条断言）+ test_package 内 2 项失败判定
assertion_count: 13
