software: libtelnet
display: "libtelnet"
description: "TELNET 协议状态机 C 库（RFC 854/1143，支持 MSSP/TTYPE/ENVIRON/ZMP/MCCP2）"
category: library
homepage: "https://github.com/seanmiddleditch/libtelnet"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "tag tarball 无预生成 configure，构建前需 autoreconf -fi（配方 build() 内执行）"
    - "config.guess 无法识别 HarmonyOS uname，需显式 --build/--host=aarch64-unknown-linux-ohos"
    - "configure PKG_CHECK_MODULES(zlib) 失败时 HAVE_ZLIB 仍定义为 0 且编译 zlib 代码 → 需 zlib 依赖并注入 pkgconfig"
    - "util/* 程序链接静态 libtelnet.la 不传递 $(zlib_LIBS)，经补丁显式追加"
  common_dependencies:
    - "zlib/1.3.1.1"

versions:
  "0.23":
    status: built
    build_date: "2026-09-02"
    published_as: libtelnet
    source_url: "https://github.com/seanmiddleditch/libtelnet/archive/refs/tags/0.23.tar.gz"