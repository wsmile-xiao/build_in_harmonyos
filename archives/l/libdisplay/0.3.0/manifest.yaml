software: libdisplay
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.3.0/libdisplay-info-0.3.0.tar.gz"

  # 源码校验和
  sha256: "2b467e3336aec63819d6aca28d7310d3dc7415b2b3a3c3a5aec9d3727053c078"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: meson

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dc_std=c11"
    - "-Dwrap_mode=nodownload"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 说明: 无外部库依赖; 构建期数据依赖 hwdata(pnp.ids) 以补丁内置方式解决
  # (OHOS 无 hwdata 包, 上游硬编码 /usr/share/hwdata/pnp.ids 不存在)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-meson-build-pnp-ids.patch"
- "0002-pnp-ids.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS 沙箱 hmmac posix_spawn 限制: python 子进程无法按 PATH 搜索裸命令名(git/clang/meson 探测均失败), meson 交叉构建必须给编译器/ar/ranlib/strip 绝对路径"
- "hwdata(pnp.ids) 在 OHOS 无包且上游回退路径硬编码 /usr/share/hwdata: 需内置 pnp.ids 数据文件并改 meson.build 回退 files('pnp.ids')"
- "调用 libdisplay API 后正常 exit() 触发 SIGTRAP(Signal 5), _exit()/quick_exit() 绕过退出清理则正常——OHOS 沙箱 musl exit() 清理路径环境问题(与 libmaus2 AutoArray_maxmem 同类), 非库代码缺陷"
