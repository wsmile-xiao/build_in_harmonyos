package: libremidi/5.4.3
homepage: "https://github.com/celtera/libremidi"

upstream_check_command: "ctest --test-dir <build_folder> --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure"

upstream_tests:
  - file: cmake/libremidi.tests.cmake
    source: libremidi-5.4.3/cmake/libremidi.tests.cmake
    description: >-
      上游 CMake 在 -DLIBREMIDI_TESTS=ON 时注册 7 个 CTest 用例
      (conversion_test、error_test、midiin_test、midiout_test、
      midifile_read_test、midifile_write_test、midifile_write_tracks_test)，
      由 conanfile.py 的 build() 通过 ctest 实际执行。
    command: "ctest --test-dir <build_folder> --output-on-failure"

upstream_ctest_count: 7

upstream_test_case_count: 24
upstream_test_case_command: "grep -rcE '^\\s*TEST_CASE' tests/unit tests/integration"
upstream_registered_case_command: "for t in <binaries>; do $t --list-tests; done"
upstream_test_case_note: >-
  24 是上游 TEST_CASE 宏的声明数（口径与审查脚本一致：宏计数，不扣除条件编译），
  实跑数据：ctest 7/7 全绿，Catch2 层注册 23 个用例、0 失败，
  其中 conversion 4 用例/164 断言、midifile_read 4 用例/1354 断言、
  midifile_write 8 用例/2 断言、midifile_write_tracks 2 用例/9 断言、error 1 用例、
  midiin 2 用例(1 通过 + 1 跳过)、midiout 2 用例(1 通过 + 1 跳过)。
  宏数与注册数的差异来自 tests/unit/midi_out.cpp 的 "sending chunked messages"：
  整个 TEST_CASE 位于 #if defined(LIBREMIDI_ALSA) 之内，OHOS 上没有 ALSA
  （$HOME/.harmonybrew/include 与 /usr/include 均无 alsa/asoundlib.h），故不注册。
  两个 creation 用例（tests/unit/midi_in.cpp:16、tests/unit/midi_out.cpp:8）断言
  REQUIRE(in.get_current_api() == libremidi::API::KEYBOARD) 与
  REQUIRE(out.get_current_api() == libremidi::API::JACK_MIDI)，
  需要 JACK / 特定后端；真机既无 JACK 也无 ALSA，因此按上游自带的
  -DLIBREMIDI_CI=ON 模式运行 —— 该模式下这两个用例自身 SKIP
  （SKIP("GH runners do not have MIDI support")），不是本配方屏蔽或改写用例。

test_package_tests:
  - file: test_libremidi.cpp
    description: >-
      鸿蒙特有消费者用例 10 项：验证 OHOS 无实时 MIDI 后端时库仍可用并回退到
      DUMMY/keyboard 后端、midi_in/midi_out 可构造、SMF 写读往返
      （MThd 头 / 轨道数一致 / 96 ticks 分辨率保留）、以及损坏输入被判为 invalid。
      消费方需按 C++20 编译（公开头文件使用 std::span、concept、requires）。
    command: "./test_libremidi"
