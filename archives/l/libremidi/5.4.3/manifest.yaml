version: "5.4.3"
software: libremidi
status: built
build_date: "2026-09-19"
build_system: cmake
source:
  url: "https://codeload.github.com/celtera/libremidi/tar.gz/refs/tags/v5.4.3"
  filename: "libremidi-5.4.3.tar.gz"
  sha256: "a1c369c6aab01c80f1506345d1c099a167b330d1d59159aa7583f7b0b9f966b9"
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - "-DLIBREMIDI_LIBRARY_MODE=LIBRARY"
    - "-DLIBREMIDI_TESTS=ON"
    - "-DLIBREMIDI_EXAMPLES=OFF"
    - "-DLIBREMIDI_NO_ALSA=ON"
    - "-DLIBREMIDI_NO_UDEV=ON"
    - "-DLIBREMIDI_NO_JACK=ON"
    - "-DLIBREMIDI_NO_PIPEWIRE=ON"
    - "-DLIBREMIDI_NO_NETWORK=ON"
    - "-DLIBREMIDI_NO_BOOST=ON"
    - "-DLIBREMIDI_NO_ANDROID=ON"
    - "-DLIBREMIDI_CI=ON"
    - "-DLIBREMIDI_NO_WARNINGS=ON"
  dependencies:
    - catch2/3.16.0
  cc: clang
  cxx: clang++
patches_applied:
  - "patches/0001-tests-use-installed-catch2.patch"
knowledge_gained:
  - "codeload 的 tar.gz URL 末段是 refs/tags/vX，Conan get() 猜不出格式会 BadZipFile，必须补 filename: xxx.tar.gz"
  - "上游用 FetchContent 从 github.com 克隆测试框架：换成 find_package + conan test_requires 即可离线，且不动 tests/ 里的用例"
  - "OHOS 无 ALSA/JACK/PipeWire/Boost 时开 LIBREMIDI_NO_*，库回到上游 DUMMY 后端；纯 C++ 的 keyboard 后端可保留"
  - "上游用例硬断言具体后端(API::KEYBOARD/JACK_MIDI)时会必红，用上游自带的 LIBREMIDI_CI 模式 SKIP；它附带 -Werror，需配 LIBREMIDI_NO_WARNINGS"
  - "CMake target 名为 libremidi 时 Linux 产物是 liblibremidi.a，cpp_info.libs 要写 \"libremidi\""
  - "删掉上游导出的 lib/cmake 后，原本挂在 target PUBLIC 上的后端宏必须由 cpp_info.defines 自己导出"
