# 版本级 manifest — loksh 7.9
# 遵循 ARCHIVE-SPEC v2.0

version: "7.9"
software: "loksh"
status: built
build_date: ''
build_system: meson

source:
  url: "https://github.com/dimkr/loksh/releases/download/7.9/loksh-7.9.tar.xz"
  sha256: "9cd50a5d5023c1886ef70dfe7334cebec4f4c6a9548f15d01a04732038e9ac0f"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "--prefix=<package_folder>（meson setup --prefix=/ + install --destdir）"
    - "--native-file=conan_meson_native.ini（vendored meson，R33 编译器/ar 注入）"
  dependencies:
    - ncurses/6.6
  cc: clang
  upstream_test_command: "（上游无测试套件：meson.build 无 test()，tarball 不含测试目录；由 test_package 消费者测试补足）"

patches_applied: []  # 无补丁文件；构建守门在配方内（-DSMALL 检测）

knowledge_gained:
  - "loksh 7.9 起用 Meson 构建，硬性 require subprojects/lolibc 子模块（dimkr/lolibc，静态链入）；GitHub tag tarball 不含子模块，官方 release 资产已打包（33 文件）→ 必须钉 release 资产 URL"
  - "上游 meson.build 可选依赖 ncurses/ncursesw 均找不到时静默加 -DSMALL（砍掉命令行编辑）→ 配方在 build() 解析 build.ninja 检测 -DSMALL 并失败，防止静默降级"
  - "ncurses/6.6 的 pkg_config_name 为 ncursesw，PkgConfigDeps 生成 ncursesw.pc，与上游 dependency('ncursesw') 回退分支精确对应"
  - "vendored meson 方案（zchunk/1.5.2、astroterm/1.0.9、libdvdnav/7.0.0 同款）：官方 meson 1.11.2 源码进包，python3 -c 进程内注入 mesonmain.main()"
  - "E074 对 ninja 同样适用：HMDFS jobserver fifo EPERM → ninja -j1"
  - "无 autotools 面（无 config.guess/E114 umask 问题），meson 交叉构建走 MesonToolchain native file"
