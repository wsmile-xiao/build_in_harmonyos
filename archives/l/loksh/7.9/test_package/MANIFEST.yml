# test_package/MANIFEST.yml
# loksh 7.9
# 上游没有测试套件：meson.build 无 test()，release tarball 不含任何测试
# 目录；上游 GitHub CI（ci.sh + .github/workflows/*.yml）是容器构建冒烟
# 基础设施，不是随源码分发的可离线复用测试框架。按赛事规则说明原因并
# 自补消费者测试。

package: loksh/7.9
homepage: "https://github.com/dimkr/loksh"

upstream_tests_exist: false
upstream_test_audit: >
  上游 7.9 用 Meson 构建，meson.build（35 行）只声明 ksh 可执行与安装
  规则，无 test()；tarball 内无 tests/ 目录。上游 GitHub Actions/ci.sh
  为 CI 容器构建冒烟（build.yml 只做编译），无法离线复用为上游测试
  套件。上游测试计数为 0 属"上游不存在"，非"未运行"。
upstream_test_count: 0
upstream_check_command: "（上游无）"
upstream_test_in_build: false

# test_package 中自带的测试（消费者视角, R34: 真实执行被适配工具）
test_package_tests:
  - file: test_loksh.sh
    description: >
      消费者视角: 真实执行包内 ksh，12 项断言（echo 基本执行 / 变量与
      算术展开 / for+printf / 管道 / 退出码 / 脚本文件执行 / 位置参数 /
      test 内建 / 子 shell / while read here-doc / 函数 / KSH_VERSION），
      全部离线
    command: "bash test_loksh.sh <package>/bin/ksh"

test_fixtures: []

# 断言总数（消费者 12 项）
assertion_count: 12
