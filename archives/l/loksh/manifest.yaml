software: loksh
display: "loksh"
description: "OpenBSD Korn shell 的 Linux 移植版（单一 ksh 可执行文件）"
category: tool
homepage: "https://github.com/dimkr/loksh"
license: Public Domain
build_system: meson

ohos_adaptation:
  key_points:
    - "7.9 起用 Meson 构建；真机/CI 无 meson 可执行文件 → vendored meson 1.11.2 进包，python3 -c 进程内注入（zchunk/astroterm/libdvdnav 已验证方案）"
    - "硬性 require subprojects/lolibc 子模块 → 必须用官方 release 资产 tarball（含子模块），GitHub tag tarball 缺失不可用"
    - "可选 ncurses 找不到时静默 -DSMALL 砍编辑功能 → 配方解析 build.ninja 守门；PkgConfigDeps 生成 ncursesw.pc 命中上游回退分支"
    - "E074: HMDFS jobserver fifo EPERM → ninja -j1"
    - "上游无测试套件（meson.build 无 test()）→ 按规则自补消费者测试 12 项断言"
    - "CLI 工具门禁：软件级 commands.json（R38）"

versions:
  "7.9":
    status: prepared
    conan_ref: "loksh/7.9"
