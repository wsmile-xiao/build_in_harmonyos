knowledge_gained:
  - "GitHub tag 归档没有 autoreconf 产物：需 libtoolize --automake + aclocal + autoconf + autoheader + automake --add-missing --copy 自举，并给生成的 config.guess 注入 HarmonyOS 分支（E007，禁止用 --build/--host 伪造三元组） [knowledge_ref: E007；reference: notes.md 问题 #4/#6]"
  - "ohpcd 的 libtool/2.5.4 制品把独立 libltdl 发行版装在 share/libtool/，libtoolize --ltdl 期望的 share/libtool-conan/libltdl/ 只有头文件 → libtoolize 返回 1、autoreconf 直接失败；改从 libtool 包物化 libltdl/，并对 Makefile.in 里未被替换的 @MAINTAINER_MODE_TRUE@ 字面量做防御性清理（当前制品实测 0 处） [knowledge_ref: knowledge/drafts/E429-draft-LPR5.kv]"
  - "autoconf/2.72 与 automake/1.18 两个制品的 perl 依赖互相冲突（.autoreconf-real 用包内 perl/5.42.2 + PERL5LIB，.automake-real shebang 写死宿主 HNP perl）→ 混用报 Can't load .../auto/Cwd/Cwd.so；宿主 autoconf 已 2.72，只 tool_requires automake+libtool 即可自洽 [knowledge_ref: knowledge/drafts/E611-draft-LPR5.kv]"
  - "LTDL_INIT([recursive]) 让父 configure 替换 libltdl/Makefile，父包没跑过 _LT_LIBOBJ 检查 → LTLIBOBJS 为空、libltdlc.a 缺 lt__argz.lo、libprelude.so 带未定义符号出厂；改 LTDL_INIT([subproject]) 让 libltdl 跑自己的 configure [knowledge_ref: knowledge/drafts/E610-draft-LPR5.kv]"
  - "上游 src/Makefile.am 以 -I$(srcdir)/libprelude-error 引用生成头，VPATH 构建必失败 → 配方固定 in-tree 布局（source == build） [knowledge_ref: reference: notes.md 问题 #7（in-tree 布局）]"
  - "Conan Release 的 -DNDEBUG 会把上游测试里写在 assert() 参数中的被测 API 调用整体编译掉（6/9 段错误）；tc.ndebug=None 即可零改动跑通上游测试 [knowledge_ref: E259；reference: notes.md 问题 #8]"
  - "gnutls/3.8.10 制品 option shared=False 却只发布 .so → require.run 为 False，Conan 不给下游注入 LD_LIBRARY_PATH，消费端加载 libprelude.so 直接失败；由消费方 package_info() 按“依赖 lib 目录确有 .so”补 runenv [knowledge_ref: knowledge/drafts/E612-draft-LPR5.kv]"
  - "HMDFS：configure 的 umask 077 临时目录不可写（E011）；顶层 make -C tests check 会因 libtool wrapper 的 getcwd 解析失败导致 9 项假失败，须在 tests/ 目录内 make check [knowledge_ref: E011；knowledge/drafts/E613-draft-LPR5.kv]"

