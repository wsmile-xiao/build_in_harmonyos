software: libprelude
display: "libprelude"
description: "Prelude SIEM secure agent/manager communication library (IDMEF messages over TLS)"
category: security
homepage: "https://github.com/Prelude-SIEM/libprelude"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 GitHub tag 归档不含 autoreconf 产物，配方在 build() 里按 autogen.sh 思路自举（libtoolize --automake + aclocal + autoconf + autoheader + automake --add-missing --copy）"
    - "ohpcd libtool/2.5.4 制品把独立 libltdl 发行版装在 share/libtool/，libtoolize --ltdl 找不到文件直接返回 1（autoreconf 随之失败）；改为从该包物化 libltdl/，并用补丁把 LTDL_INIT 切成 subproject 模式让 libltdl 跑自己的 configure（否则父 configure 替换出的 LTLIBOBJS 为空，libltdlc.a 缺 lt__argz.lo）"
    - "只 tool_requires automake/libtool，不 tool_requires autoconf：两制品的 perl 依赖互相冲突（.automake-real shebang 写死宿主 perl，autoconf 制品又注入包内 perl 的 PERL5LIB），混用即 Cwd.so 加载失败；宿主 HNP autoconf 已是 2.72（与 69/78 既有自举配方口径一致）"
    - "E007 给生成的 config.guess 注入 HarmonyOS 分支（不用 --build/--host 伪造三元组）；E011 放宽 configure 的 umask 077；E236 用 build 私有 la-free 目录规避依赖 .la 的 //lib 假路径"
    - "上游 src/Makefile.am 以 $(srcdir)/libprelude-error 引用生成头 → 布局固定 in-tree；Conan Release 的 -DNDEBUG 会编译掉 assert() 里的被测 API → tc.ndebug=None，上游 9 项测试 9/9 通过"
    - "纯库交付：剔除 bin/（prelude-admin/prelude-adduser/libprelude-config）与 share/man，绑定与 gtk-doc 通过 --without-*/--disable-* 关闭"
  common_dependencies:
    - gnutls

versions:
  "5.2.0":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libprelude/5.2.0"
