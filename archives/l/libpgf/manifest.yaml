# 软件级 manifest — archives/l/libpgf/manifest.yaml
software: libpgf
display: "libpgf"
description: "libPGF：基于小波变换的 Progressive Graphics File (PGF) 图像压缩库"
category: compress
homepage: "https://libpgf.org"
license: LGPL-2.1-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 autotools 脚手架陈旧（configure.ac 停在 7.15.32）且 CI 缺 aclocal，无法 autoreconf；源码不引用 config.h，直接编译 src/ 6 个翻译单元"
    - "OpenMP 由 _OPENMP 宏门控，不传 -fopenmp 即禁用；POSIX 分支有默认兜底，OHOS 无需改源码"
    - "纯库包，无第三方依赖，无 commands.json"
  common_dependencies: []

versions:
  "7.21.7":
    status: built
    build_date: "2026-09-18"
