knowledge_gained:
  - "上游 7.21.7 zip 只带 configure.ac（版本号停留在 7.15.32）且无预生成 configure；CI 缺 aclocal 无法 autoreconf，而 src/include 源码均不引用 config.h——直接用极简 Makefile 编译 src/ 全部 6 个翻译单元即可，无需 autotools 链（inotify-tools 4.25.9.0 同型先例）"
  - "libpgf 的 OpenMP 由 _OPENMP 宏门控（PGFplatform.h），交叉编译不传 -fopenmp 即天然禁用，无需改源码"
