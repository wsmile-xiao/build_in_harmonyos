# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libpgf/7.21.7
homepage: "https://libpgf.org"

# 上游无任何测试套件，清点证据：
# - 源码 zip（libpgf.zip, 7.21.7）内无 test/ 或 tests/ 目录（find -iname '*test*' 仅命中 doc/ 内文档）
# - Makefile.am / src/Makefile.am 未定义 TESTS，无 check 自定义目标（automake 默认 check 目标为空操作）
# - configure.ac 无 AC_CHECK_* / AC_RUN_IFELSE 测试宏
upstream_check_command: "find . -iname '*test*' -not -path './doc/*'; grep -n 'TESTS' Makefile.am src/Makefile.am"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游确无测试，附上方清点证据）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libpgf.cpp
    description: "消费者测试：64x48 RGB 渐变图 PGF 无损编码→内存流→解码，头字段一致 + 逐字节像素往返断言"
    command: "./test_libpgf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
