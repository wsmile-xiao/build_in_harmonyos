# 版本级 manifest — libpll 0.3.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.3.2"

software: "libpll"

# 编译状态: built（仅 release/upload 流水线确认上传后才可为 published）
status: built

build_date: "2026-09-17"
build_system: autotools

source:
  url: "https://github.com/xflouris/libpll/archive/refs/tags/0.3.2.tar.gz"
  sha256: "45107d59d87be921c522478bb3688beee60dc79154e0b4a183af01122c597132"
  tar_format: tar.gz

build:
  system: autotools

  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--disable-sse"
    - "--disable-avx"
    - "--disable-avx2"

  dependencies: []

  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libpll tag 归档为 git snapshot 无 configure，需 autoreconf -fi 引导；flex/bison 由设备 /data/service/hnp/bin 提供（AC_PROG_LEX/AC_PROG_YACC）"
  - "上游 x86 SIMD（SSE3/AVX/AVX2）检测代码在 configure.ac 中被注释，have_* 默认 no，aarch64 上自动只编纯 C 内核，无需补丁"
  - "上游自带校验框架 test/（21 个用例源）未接入 automake（无 SUBDIRS/TESTS/check_PROGRAMS），`make check` 为空但用例真实存在：配方 build() 内 `make -j1 -e -C test obj/<case>` 逐个编译并执行，stdout 与 test/out/<case>.out 全文比对，2026-09-20 设备实测 21/21 通过（18 逐字节一致 + 3 例经形状校验的 musl 尾差/NaN 拼写差异）"
  - "上游测试语料在配套仓库（tag 归档不含 testdata/）：按 pinned commit + sha256 用 get() 取入构建目录，取不到的用例记 skipped 而非静默通过"
