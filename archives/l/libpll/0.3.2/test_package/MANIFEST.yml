# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# ⚠️ 如实声明：上游 libpll 0.3.2【无 automake 注册的测试套件】——
# 已核实：顶层 Makefile.am SUBDIRS = src man examples（test/ 目录未纳入）；
# 全树无 TESTS / check_PROGRAMS 声明；test/ 下是独立 runtest.py 脚本
#（非 automake 集成，依赖外部二进制产物，未在构建系统注册）。
# examples/ 下的示例程序在 make all 中真实编译，作为构建级验证。

package: libpll/0.3.2
homepage: "https://github.com/xflouris/libpll"

# 上游官方测试：无 automake 注册测试（已核实如上）
upstream_official_tests: []

# 构建阶段：上游无 TESTS，make check 为 automake 生成的 no-op 目标；
# conanfile.py build() 不调用 make check（避免"假装跑过测试"）。
# 构建级验证 = make all 中 src/ 库本体 + examples/ 全部示例程序真实编译链接。
upstream_check_command: "make check (upstream TESTS 未注册，no-op)"
upstream_test_in_build: false
upstream_test_command: "make all（src/ + examples/ 真实编译）"

# test_package 中自带的测试 (消费者视角验证，适配自研)
test_package_tests:
  - file: test.c
    origin: ohos-adaptation (self-authored consumer test, public API from pll.h)
    description: "消费者测试：pll_utree_parse_newick_string 解析 4-tip Newick 树，断言 tip/inner/edge 计数、pll_utree_check_integrity 结构完整性、叶标签精确匹配，并验证畸形输入被拒绝且置错误信息"
    command: "./test_libpll (经 ctest 驱动)"

# 测试断言总数 (test.c 中 check() 调用数)
assertion_count: 7
