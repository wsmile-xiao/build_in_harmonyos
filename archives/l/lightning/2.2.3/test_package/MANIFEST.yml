# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 脚本强制要求存在（L0e）
#
# GNU lightning 2.2.3 的测试套件是 automake `make check`（check/Makefile.am
# 的 TESTS 变量），在 build() 内真实编译并执行，汇总写入 check/test-suite.log。

package: lightning/2.2.3
homepage: "https://www.gnu.org/software/lightning/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# ── 上游是否存在测试 ────────────────────────────────────────────────
upstream_tests_exist: true
upstream_test_framework: "automake (autotools_tests)"

# ── 分母（与审方数法一致）───────────────────────────────────────────
# 口径：automake autotools_tests —— check/Makefile.am 中 aarch64 条件下
# 实际注册的 TESTS 条目数。aarch64 下 x87/arm/nodata 条件分支（
# @test_x86_x87_TRUE@/@test_arm_arm_TRUE@/@test_arm_swf_TRUE@/@test_nodata_TRUE@）
# 全部为空，因此：
#   base_TESTS = 67 个 .tst 转写用例（check.sh 驱动，见 Makefile.am base_TESTS 列表）
#   + TESTS += ccall self setcode nodata ctramp carg cva_list catomic protect
#             riprel cbit callee（12 个 C 测试程序，无条件追加）
#   合计 79。
# check_PROGRAMS 中的 cldstxba 编译但不进入 TESTS，不计入注册总数。
upstream_test_total: 79
upstream_test_count_method: autotools_tests

upstream_test_audit: >
  audited GNU lightning 2.2.3 tarball (lightning-2.2.3.tar.gz, sha256
  c045c7a3...6829): check/Makefile.am defines TESTS = $(base_TESTS) with the
  cpu-gated additions on statically-empty @test_*_TRUE@ conditionals for
  aarch64 (configure.ac: test_x86_x87/test_arm_arm/test_arm_swf are only set
  for x86/arm; test_nodata excludes aarch64). base_TESTS lists 67 .tst
  transcription cases; the unconditional `TESTS += ccall self setcode nodata
  ctramp carg cva_list catomic protect riprel cbit callee` adds 12 C test
  programs, for a total of 79 registered automake tests. cldstxba is a
  check_PROGRAM but not a TESTS entry. The `make check` run and its
  test-suite.log summary are executed inside conanfile.py build().

# 上游实际运行的测试程序
upstream_tests:
  - file: check/lightning.c
    source: lightning-2.2.3/check/lightning.c
    description: "JIT 汇编器/解析器，驱动 base_TESTS 各 .tst 转写用例"
    command: "./lightning <case>.tst"
  - file: check/check.sh
    source: lightning-2.2.3/check/check.sh
    description: "base_TESTS 转写用例的驱动脚本（每个 .tst 一个 automake 用例）"
    command: "./check.sh <case>.tst"
  - file: check/ccall.c
    source: lightning-2.2.3/check/ccall.c
    description: "调用约定/参数传递 C 测试程序"
    command: "./ccall"
  - file: check/self.c
    source: lightning-2.2.3/check/self.c
    description: "寄存器/调用者保存语义 C 测试程序"
    command: "./self"
  - file: check/setcode.c
    source: lightning-2.2.3/check/setcode.c
    description: "jit_set_code 相关 C 测试程序"
    command: "./setcode"
  - file: check/protect.c
    source: lightning-2.2.3/check/protect.c
    description: "内存保护(mprotect)相关 C 测试程序"
    command: "./protect"
  - file: check/cbit.c
    source: lightning-2.2.3/check/gen_cbit.c
    description: "位运算/进位语义（gen_cbit 生成）C 测试程序"
    command: "./cbit"

# test_package 中自带的测试 (消费者视角验证；同一 conan create 内执行)
# 实测结果待真机预检回填（首轮仅完成工作树）。
test_package_tests:
  - file: test.c
    description: "JIT 消费者：运行时代码生成并执行 4 项断言（常量返回/参数相加/负数/再次相加）"
    command: "./test_lightning"
    result: "待真机预检回填（设计 4 项断言，末尾打印 ok 行）"

# 测试断言总数（test_package 自带消费者测试）
# test.c: 4 项 JIT 代码生成并执行断言
assertion_count: 4
