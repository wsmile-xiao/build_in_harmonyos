software: lightning
version: "2.2.3"
build_system: autotools
status: built
build_date: "2026-09-24"

source:
  url: "https://ftp.gnu.org/gnu/lightning/lightning-2.2.3.tar.gz"
  sha256: "c045c7a33a00affbfeb11066fa502c03992e474a62ba95977aad06dbc14c6829"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-disassembler"
    - "--disable-devel-disassembler"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config.guess.patch - HarmonyOS 平台识别（UNAME_SYSTEM=HarmonyOS → aarch64-unknown-linux-ohos）"
  - "0002-config.sub.patch - 新增 ohos OS 与 linux-ohos 内核-OS 组合识别"
  - "0003-configure-umask-022.patch - HMDFS umask 077 权限限制修复"

knowledge_gained:
  - "lightning 自带 config.guess(2023) 不识别 UNAME_SYSTEM=HarmonyOS，需新增分支输出 aarch64-unknown-linux-ohos"
  - "lightning 自带 config.sub(2023) 无 ohos 支持，需新增 ohos OS 与 linux-ohos 组合识别"
  - "configure 用 umask 077 创建临时目录，HMDFS 下 config.status 无法写入，改为 umask 022"
  - "make check 走 automake TESTS：aarch64 下无 x87/arm/nodata 条件分支，运行 base_TESTS(67) + 12 个 C 测试程序共 79 个用例，汇总写于 check/test-suite.log"
  - "可选 disassembler 依赖 binutils (libbfd/libopcodes/libiberty/zlib)，OHOS 未提供，显式 --disable-disassembler"
  - "HMDFS 限制父目录 getcwd/readdir，configure 的 `ac_pwd=\`pwd\`` 失败报 working directory cannot be determined；conanfile.py 运行时把 ac_pwd 降级为 `pwd 2>/dev/null || echo $PWD` 并注入 PWD/TMPDIR，配合 umask 022 与可写 TMPDIR 通过"
