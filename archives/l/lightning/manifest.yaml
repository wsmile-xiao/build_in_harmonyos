software: lightning
display: "lightning"
description: "GNU lightning，运行时代码生成（JIT）库，向客户端提供标准化 RISC 指令集"
category: lib
homepage: "https://www.gnu.org/software/lightning/"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess(2023) 不识别 HarmonyOS，需新增分支输出 aarch64-unknown-linux-ohos"
    - "config.sub(2023) 无 ohos 支持，需新增 ohos OS 与 linux-ohos 组合识别"
    - "configure 的 umask 077 需改为 022，规避 HMDFS 临时目录权限限制"
    - "可选 disassembler 依赖 binutils，OHOS 未提供，显式 --disable-disassembler"
    - "aarch64 平台受支持，make check 运行 79 个 automake 用例"
  common_dependencies: []

versions:
  "2.2.3":
    status: built
    build_date: "2026-09-24"
