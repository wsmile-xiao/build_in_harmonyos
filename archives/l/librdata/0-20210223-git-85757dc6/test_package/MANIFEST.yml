# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librdata/0-20210223-git-85757dc6
homepage: "https://github.com/WizardMac/librdata"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（automake TESTS 注册 1 项；
# 上游 Makefile.am: check_PROGRAMS = test_rdata / TESTS = test_rdata）
upstream_tests:
  - file: test_rdata
    source: src/test/test_rdata.c
    description: "写→读往返：4 列 3 行（REAL/STRING/TIMESTAMP/DATE），含 NaN 与 NULL 文本；程序内部 20 处检查点（另一计量单位，不计入上游用例数 N）"
    command: "./test_rdata"

# test_package 中自带的测试（消费者视角验证，单独分栏，不混入上游用例数）
test_package_tests:
  - file: test_librdata.c
    description: "消费者测试：CMakeDeps 找包 + 公开 API 往返（.RData 与 .rds 两条路径）+ 错误串指纹 + 缺文件负向路径，共 23 处断言"
    command: "./test_librdata"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 23
