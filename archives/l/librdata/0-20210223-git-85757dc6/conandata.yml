# conandata.yml — librdata 0-20210223-git-85757dc6
# 官方源: github.com/WizardMac/librdata（上游无 release tag，本版本为 git 快照）
#   ↑ 这里刻意不写 URL scheme，注释里也不要写带 scheme 的仓库地址：
#     CI/W3 的预下载器（ci/conan/build_and_test.sh 的 Pre-download 段）用正则扫**全文**
#     （含注释）收集"源 URL"，再对每条成功下载的 URL 做裸 str.replace() 改写成
#     「file: + 本地绝对路径」。注释里那条仓库地址既会被当成一个源去下载（拿回仓库网页），
#     又因为它是 sources.url 的**前缀**而把 sources.url 改写成指向那个网页文件的子路径
#     （…/<hash>_<repo>/archive/<sha>.tar.gz），conan get() 随即报
#     NotADirectoryError: Not a directory。不写 scheme 即无匹配，行为恢复正常。
#     同理：本文件不得出现任何镜像代理域名或本机绝对路径（发布门禁 A 类红线）。
# 快照 commit: 4a80bf3894c9250195a564017f2136fd85757dc6（2021-02-23 "Improve support for MSVC"）
#              版本串末 8 位 85757dc6 即该 commit 短哈希
# sha256 为下载后实测值（gzip magic 1f 8b、顶层目录 librdata-4a80bf…dc6 已核对）

sources:
  url: "https://github.com/WizardMac/librdata/archive/4a80bf3894c9250195a564017f2136fd85757dc6.tar.gz"
  sha256: "b5d7745a41857c9d8658fa723dfd5fa7f0aecb9dd6de205c772779673780e23b"

patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: "Replace AM_ICONV (GNU gettext iconv.m4, absent from the OHOS build-tool closure) with a direct libc iconv.h/iconv()/iconv_open()/iconv_close() check; without it autoreconf fails with 'possibly undefined macro: AM_ICONV'"
    patch_type: "portability"
