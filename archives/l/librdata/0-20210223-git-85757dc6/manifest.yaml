version: "0-20210223-git-85757dc6"
status: built
software: librdata
build_date: "2026-09-20"
build_system: autotools

source:
  url: "https://github.com/WizardMac/librdata/archive/4a80bf3894c9250195a564017f2136fd85757dc6.tar.gz"
  sha256: "b5d7745a41857c9d8658fa723dfd5fa7f0aecb9dd6de205c772779673780e23b"
  tar_format: tar.gz
  snapshot_commit: "4a80bf3894c9250195a564017f2136fd85757dc6"
  snapshot_date: "2021-02-23"

build:
  system: autotools
  # configure 不在源码树里（GitHub archive 快照），build() 先 autoreconf 自举
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  bootstrap: "autoreconf --force --install (automake/1.18 + libtool/2.5.4 tool_requires)"
  dependencies:
    - zlib/1.3.1.1        # 可选压缩后端 deflate/inflate，静态内链
    - bzip2/1.0.8.2       # 可选压缩后端 BZ2_*
    - liblzma/5.8.1       # 可选压缩后端 lzma_*（制品实为 liblzma.a）
  build_requirements:
    - automake/1.18
    - libtool/2.5.4
  toolchain_shell: "/system/bin/sh (CONFIG_SHELL/SHELL 命令行前缀固定)"
  jobs: 2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.ac.patch"

knowledge_gained:
  - "AM_ICONV 需要 GNU gettext 的 iconv.m4，OHOS 工具链闭包里没有它 → autoreconf 报 possibly undefined macro: AM_ICONV；改直接探测 libc 的 iconv.h/iconv()"   # knowledge_ref: E626-draft-librdata-autotools-github-snapshot-ohos-bootstrap
  - "autoconf 生成的 configure 用 (umask 077 && mktemp -d ./confXXXXXX) 建临时目录，HMDFS 下不可写 → config.status 报 could not setup config files machinery；须在 autoreconf 之后就地去 umask"   # knowledge_ref: E626-draft-librdata-autotools-github-snapshot-ohos-bootstrap
  - "config.guess 在 HMDFS 上创建 dummy.c 失败 → unable to guess system type；显式传 --build/--host=aarch64-unknown-linux-ohos"   # knowledge_ref: E626-draft-librdata-autotools-github-snapshot-ohos-bootstrap
  - "tool_requires(autoconf) 带出 conan perl 并污染 PERL5LIB，与 HNP perl 混用后 autoreconf 因 Cwd.so 重定位失败；只 tool_require automake+libtool"   # knowledge_ref: E626-draft-librdata-autotools-github-snapshot-ohos-bootstrap
  - "OHOS sysroot 的 libz.so 是 stub（SO_NAME=libz.so、符号同址、/system/lib64 无此文件），AC_CHECK_LIB 命中后会写进 DT_NEEDED；压缩后端必须走 Conan 静态依赖"   # knowledge_ref: E626-draft-librdata-autotools-github-snapshot-ohos-bootstrap
  - "AutotoolsToolchain 不再为依赖注入 -I/-L/-l（conan 2.29 实测 LDFLAGS 为空），必须额外 AutotoolsDeps(self).generate()"   # knowledge_ref: E626-draft-librdata-autotools-github-snapshot-ohos-bootstrap
  - "HMDFS 强制 setgid + 属主映射：mode 0700 的目录即使显示 owner 有 rwx，非映射属主的进程也写不进去（同 E114）"   # knowledge_ref: E626-draft-librdata-autotools-github-snapshot-ohos-bootstrap

knowledge_ref:
  - "E626-draft-librdata-autotools-github-snapshot-ohos-bootstrap"

patch_generation:
  method: manual-minimal
  patches_count: 1
  note: "configure 是 autoreconf 产物、不在源码树里，故 E114 的 umask 修复只能落在 conanfile.build() 里（不进 patches/）"

patch_classification:
  - file: 0001-configure.ac.patch
    type: portability
    platform_only: true
    reason: "AM_ICONV 宏来自 GNU gettext 的 iconv.m4，不在 OHOS 构建工具闭包内；改用 libc iconv 探测"
