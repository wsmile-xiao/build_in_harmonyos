software: libopenv2g
display: "libopenv2g"
description: "C library implementing ISO 15118 and DIN 70121 EXI codecs plus V2GTP framing"
category: network
homepage: "https://sourceforge.net/projects/openv2g/"
license: LGPL-3.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只提供 Eclipse 生成的示例程序 Makefile；适配补充可复用静态/共享库构建目标"
    - "库构建使用 clang、llvm-ar 和 llvm-ranlib，不依赖 gcc"
    - "不编译 src/test 示例程序，避免将示例的固定小缓冲区和交互流程当作库 API"
  common_dependencies: []

versions:
  "0.9.5":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libopenv2g/0.9.5"
    note: "首次适配 OpenV2G 0.9.5；已完成 arm64 真机库构建和消费者 API 测试"
