knowledge_gained:
  - "上游 ZIP 提供 Eclipse 生成的 Release/makefile，默认只链接 src/test 示例程序；配方额外导出根目录库 Makefile。[knowledge_ref: E281]"
  - "所有非示例 C 源文件可用 HarmonyOS PC clang 编译为 libopenv2g.a；不需要第三方依赖。[knowledge_ref: E481]"
  - "上游没有 check/ctest 测试目标；test_package 通过公开的 EXI、位流和 V2GTP API 进行消费者验证。[knowledge_ref: E298]"
  - "src/test 示例程序使用固定小缓冲区并会在真机运行中崩溃，因此不作为库包的可执行产物。[knowledge_ref: E256]"

