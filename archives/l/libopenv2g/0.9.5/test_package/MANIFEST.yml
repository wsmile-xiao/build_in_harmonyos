package: libopenv2g/0.9.5
homepage: "https://sourceforge.net/projects/openv2g/"

# The upstream ZIP contains an Eclipse example project, not a registered
# test suite.  `Release/makefile` has only the OpenV2G.exe target and there is
# no tests/ directory, ctest registration, or check target.
upstream_check_command: "No upstream check target (make -n check reports no rule)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_audit: >-
  The archive was inspected before adaptation: src/test contains
  main.c, main_databinder.c, and main_example.c, which are sample programs
  selected by the executable switch rather than an automated test suite. The
  unmodified example was manually run on the HarmonyOS PC and terminated with
  SIGSEGV after protocol output, so it is not installed by this library recipe.
  The consumer test below exercises the public codec, application-handshake,
  and V2GTP APIs instead.

test_package_tests:
  - file: test.c
    description: >-
      Encodes and decodes an EXI application-handshake document, round-trips
      bit-stream values, and writes/reads a V2GTP header.
    command: "./test_libopenv2g"

# Individual CHECK-OK assertions in test.c.
assertion_count: 13
