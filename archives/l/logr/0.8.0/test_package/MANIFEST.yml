# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: logr/0.8.0
homepage: "https://github.com/ngrodzitski/logr"

# 上游测试命令 (gtest 通过 logr/test/CMakeLists.txt 的 gtest_discover_tests 注册)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（完整台账见 reports/upstream-test-ledger.md）
upstream_tests:
  - file: _utest.logr
    source: logr-0.8.0/logr/test/*.cpp
    description: "上游 27 个独立 TEST_CASE（6 个测试源文件，gtest 注册）"
    command: "./_utest.logr"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "logr 公开 API 消费者验证（ostream backend：版本号输出/级别过滤/error 路由三项断言）"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估；详见 reports/upstream-test-ledger.md)
assertion_count: 27