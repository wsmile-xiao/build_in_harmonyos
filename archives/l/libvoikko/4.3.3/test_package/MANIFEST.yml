package: libvoikko/4.3.3
homepage: "https://voikko.puimula.org/"

# 上游 `make check` = test/AllAutomaticTests.sh（Python3 unittest 套件），
# 运行时需要单独的 voikko-fi 词典数据包，本包不携带该数据，故不在 build 中执行。
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - file: test/AllAutomaticTests.py
    source: libvoikko-4.3.3/test/AllAutomaticTests.py
    description: "上游自动测试套件入口（汇总 NullComponent/Utf8Api/DictionaryInfo/DeprecatedApi 等用例）"
    command: "python3 AllAutomaticTests.sh"
    run_reason: "需要 voikko-fi 词典数据 + Python3 测试环境；本包仅构建库本身，未随附词典，故裁剪"
  - file: test/NullComponentTest.py
    source: libvoikko-4.3.3/test/NullComponentTest.py
    description: "null 形态后端拼写/分析/建议用例"
    command: "python3 NullComponentTest.py"
    run_reason: "需要在测试临时目录手工构造 morphology 词典描述，依赖上游测试夹具，不在打包范围"

test_package_tests:
  - file: test.c
    description: "dlopen libvoikko.so，解析并调用 voikkoInit/voikkoTerminate，断言无词典时优雅失败且错误信息非空"
    command: "./test_probe"

assertion_count: 3
