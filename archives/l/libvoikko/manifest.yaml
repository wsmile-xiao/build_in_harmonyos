software: libvoikko
display: "libvoikko"
description: "Spell checker, hyphenator and grammar checker library (Finnish NLP, C API over C++17)"
category: text-processing
homepage: "https://voikko.puimula.org/"
license: "MPL-1.1 OR GPL-2.0-or-later OR LGPL-2.1-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "C++17 Autotools；VFST 形态后端内置，无需外部库"
    - "HFST/VISLCG3/Lttoolbox 后端关闭（依赖 hfstospell/cg3/tinyxml2/lttoolbox，未发布）"
    - "config.sub 不识别 aarch64-linux-ohos -> configure 覆盖 --host/--build 为 gnu 三元组（原生 build==host）"
    - "uname-shim：设备 uname 输出 HarmonyOS"
    - "--disable-buildtools/--disable-testtools 纯库包，无需 commands.json"

versions:
  "4.3.3":
    status: built
    build_date: "2026-09-26"
