software: lz4
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.10.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（R37：上游版本 1.10.0 + 适配修复后缀；main 已并行合入 1.10.0.1/1.10.0.2，
# 本版取下一序号 .3，源码仍为上游 v1.10.0）
version: "1.10.0.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R37：1.10.0.3 = 同 1.10.0 上游源码的适配修复版）
  url: "https://github.com/lz4/lz4/releases/download/v1.10.0/lz4-1.10.0.tar.gz"

  # 源码校验和
  sha256: "537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）— lz4 零外部依赖
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（自 1.10.0 原样复用，字节级一致）
patches_applied:
  - "0001-Makefile.inc.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "R37 版本槽位冲突处理：PR 先行 CI 全绿（1.10.0.1，#43646）后，main 当晚并行合入他人 1.10.0.1/1.10.0.2，槽位被占 → 按 R37 取下一序号 1.10.0.3 重建分支（单 commit 基于最新 main），不覆盖任何已合入内容"
  - "v1.10.0 顶层 Makefile 没有 lib-shared 目标（1.9.4 同样），shared 构建须 make -C lib lib（lib 目标同时产出 .a 与带版本号 .so*）；1.10.0 配方的顶层 make lib-shared 是无效目标，因 CI 默认静态构建未暴露"
  - "make 的 SHELL=/data/service/hnp/bin/bash 仅 CI worker 存在（真机报 Error 127）；真机 /bin/sh 可用（1.10.0 同源实证）→ SHELL 覆盖按 os.path.exists 自适应，两种环境各有实证运行"
  - "真机（2026-09 布局）clang 已移至 /storage/Users/currentUser/usr/local/bin，但共享 profile 的 compiler_executables 仍指 /data/service/hnp/bin/clang，test_package 的 cmake.configure 会找不到编译器；隔离作业需在 profile 副本中 sed 修正（勿动共享 ~/.conan2）"
  - "上游 tests/Makefile 用裸 cc，设备无 cc 只有 clang → 上游测试命令必须显式 CC=clang"
  - "1.10.0/1.9.4 配方的 test_package/MANIFEST.yml 引用的 tests/check_mex.c 在 v1.10.0 源码中不存在（上游后续版本才引入），应引用 frametest.c/fuzzer.c/test-lz4-basic.sh 等真实存在的测试"
  - "上游测试执行要点继承自 1.10.0：HarmonyOS uname -s 不匹配 POSIX 列表需显式 POSIX_ENV=Yes；无此参数时 make 隐式规则生成幻影可执行文件显示 up to date 但测试从未运行；make usan 残留 UBSan 插桩 .o 会让后续链接报 undefined __ubsan_handle_pointer_overflow"
