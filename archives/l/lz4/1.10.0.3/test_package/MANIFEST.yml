package: lz4/1.10.0.3
homepage: "https://github.com/lz4/lz4"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/frametest.c
    source: lz4-1.10.0/tests/frametest.c
    description: "LZ4 frame API 测试（2097152 帧循环 + 全部负向用例，2026-08-31 真机 PASS）"
    command: "make test-frametest POSIX_ENV=Yes"
  - file: tests/fuzzer.c
    source: lz4-1.10.0/tests/fuzzer.c
    description: "LZ4 block API 随机模糊测试（5425 迭代，2026-08-31 真机 PASS）"
    command: "make test-fuzzer POSIX_ENV=Yes"
  - file: tests/test-lz4-basic.sh
    source: lz4-1.10.0/tests/test-lz4-basic.sh
    description: "CLI 基础压缩/解压往返测试（2026-08-31 真机 PASS）"
    command: "make test-lz4-basic POSIX_ENV=Yes"

test_package_tests:
  - file: test.c
    description: "Consumer test: LZ4_compress_default + LZ4_decompress_safe round-trip"
    command: "./test_lz4"
  - file: test_lz4_consumer.c
    description: "Path B 消费者用例①②：LZ4F frame API 往返 + 字典压缩往返（LZ4_loadDictSlow，v1.10.0 转正符号）"
    command: "./test_lz4_consumer"
  - file: test_package/conanfile.py::test()
    description: "Path B 消费者用例③：打包 bin/lz4 CLI 压缩/解压文件往返（R38 工具验证）"
    command: "lz4 -q -f sample.txt sample.lz4 && lz4 -q -d -f sample.lz4 sample.out"

assertion_count: 18
