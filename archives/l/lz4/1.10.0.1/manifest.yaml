  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.inc.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 默认 CC=cc，OHOS 工具链无 cc；须从 tools.build:compiler_executables 取 clang 以 CC/CXX/AR/RANLIB 传入 make（与 bzip2/zlib 同模式）"
  - "1.10.0 已发布于制品仓且 recipe 固化，同版本改 conanfile 被 R37 拒绝 → 以 .1 后缀升版 1.10.0.1 承载修复（glib 2.84.0.1.1 同款做法）"
  - "tests/Makefile 在 HarmonyOS 下 uname -s 不匹配 POSIX 列表导致 POSIX_ENV=No，需显式 POSIX_ENV=Yes 执行上游测试"
  - "make usan 残留 UBSan 插桩 .o 会让后续链接报 undefined __ubsan_handle_pointer_overflow，需清理后重建"

