software: lz4
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.9.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lz4/lz4/archive/refs/tags/v1.9.4.tar.gz"

  # 源码校验和
  sha256: "0b0e3aa07c8c063ddf40b082bdf7e37a1562bda40a0ff5272957f3e987e0e54b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.inc.patch"
  - "0002-freestanding.patch"
  - "0003-test-install.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "tests/Makefile 在 HarmonyOS 下 uname -s 不匹配 POSIX 列表导致 POSIX_ENV=No，测试目标隐藏，需显式 POSIX_ENV=Yes 执行上游测试"
  - "上游测试 24 个可执行目标全部通过；8 类目标因平台/环境限制无法执行（详见 reports/upstream-test-report.md）"
  - "test-freestanding：freestanding.c 非 x86_64 分支 _start 为空 ret（无退出），OHOS aarch64 下 segfault；补丁 0002 加入 exit syscall 修复"
  - "test-install：test_install.sh 的 make 不带 POSIX_ENV=Yes（顶层 install 目标仅在 POSIX_ENV=Yes 下定义），HarmonyOS 上不生效；补丁 0003 加 POSIX_ENV=Yes+工具链+LN_SF=cp 适配"
  - "conan build() 不跑 make check：OHOS conan self.run 环境管道受限（cat| 的 standard output Permission denied）+ hmdfs 别名覆盖限制（cp: unlz4 Operation not permitted），上游测试普遍含管道，故沿用 1.10.0 做法——build() 仅构建，CI L1 走 test_package"

# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/temp/lz4-src/orig
  source_work_dir: /data/storage/el2/base/temp/lz4-src/work
  source_orig_hash: ""
  source_work_hash: ""
  generated_at: '2026-09-03T00:00:00'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.inc.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-freestanding.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-test-install.patch
    type: auto
    platform_only: True
    guard: 'pending'
