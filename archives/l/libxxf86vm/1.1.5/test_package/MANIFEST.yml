package: "libxxf86vm/1.1.5"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxxf86vm"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The release Makefile.am files declare no TESTS, check_PROGRAMS,
  check-local, or custom test target.

test_package_tests:
  - id: "public-api-surface"
    source: "test_xxf86vm.c"
    command: "libxxf86vm_api_test"
