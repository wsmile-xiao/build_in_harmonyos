      Force a live typed relocation for all 22 public XF86VidMode functions,
      then execute XF86VidModeQueryVersion as a real API call against the
      installed shared library.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 1
assertion_count: 22
