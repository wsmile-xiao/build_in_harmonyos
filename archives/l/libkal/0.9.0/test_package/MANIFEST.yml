package: libkal/0.9.0
homepage: "https://tracker.debian.org/pkg/libkal"

upstream_check_command: "./check jul && ./check gre && ./check ar && ./check jew && ./test && ./test1 && ./test-dw"
upstream_test_in_build: true
upstream_test_command: "direct execution with semantic output validation"

upstream_tests:
  - file: check.c
    source: libkal-0.9.0/check.c
    description: "Exhaustive Julian calendar round-trip and sequence check"
    command: "./check jul"
  - file: check.c
    source: libkal-0.9.0/check.c
    description: "Exhaustive Gregorian calendar round-trip and sequence check"
    command: "./check gre"
  - file: check.c
    source: libkal-0.9.0/check.c
    description: "Exhaustive Arabic calendar round-trip and sequence check"
    command: "./check ar"
  - file: check.c
    source: libkal-0.9.0/check.c
    description: "Exhaustive Jewish calendar round-trip and sequence check"
    command: "./check jew"
  - file: test.c
    source: libkal-0.9.0/test.c
    description: "Interactive multi-calendar conversion example with deterministic input"
    command: "printf 'gre\\n1\\n1\\n2000\\n' | ./test"
  - file: test1.c
    source: libkal-0.9.0/test1.c
    description: "Validated multi-calendar conversion example with deterministic leap-day input"
    command: "printf 'gre\\n29\\n2\\n2000\\n' | ./test1"
  - file: test-dw.c
    source: libkal-0.9.0/test-dw.c
    description: "Day-of-week next/previous integration example"
    command: "./test-dw"

test_package_tests:
  - file: test_libkal.c
    description: "Consumer test with eight calendar API functional groups"
    command: "./test_libkal"
  - file: test_libkal_ohos.c
    description: "HarmonyOS aarch64 LP64 ABI and packaged API test"
    command: "./test_libkal_ohos"

assertion_count: 29
