software: libseqlib
display: "SeqLib"
description: "C++ htslib/bwa-mem/fermi interface for interrogating sequence data"
category: library
homepage: "https://github.com/walaj/SeqLib"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools recursive build (bwa/htslib/fermi-lite/src) with --host=aarch64-unknown-linux-ohos"
    - "Vendor pinned submodule tarballs (bwa/fermi-lite/htslib) since tag archive excludes them"
    - "OHOS shims for configure (umask/TMPDIR/uname/install) and HMDFS ln hardening"
  common_dependencies:
    - zlib
    - xz

versions:
  "1.2.0":
    status: built
    build_date: "2026-09-14"
