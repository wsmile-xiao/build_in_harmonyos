version: "1.2.0"
software: libseqlib
status: built
build_date: "2026-09-14"
build_system: autotools

source:
  url: "https://github.com/walaj/SeqLib/archive/refs/tags/1.2.0.tar.gz"
  sha256: "6892bdb5cae88d8d8acbbfadd351cfa00004bc7c0fd1ae912dc1ff1ccfd61a70"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - "zlib/1.3.1.1"
    - "xz/5.6.2"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "SeqLib 1.2.0 is Autotools with SUBDIRS bwa/htslib/fermi-lite/src; tag tarball lacks submodule contents, vendor pinned codeload tarballs"
  - "Upstream 1.2.0 has no make-check suite; Travis gate is configure+make, seq_test needs external test_data absent from tarball"
  - "OHOS Autotools needs --host=aarch64-unknown-linux-ohos, umask/TMPDIR fix, uname+install shims, ln -sf hardening (htslib pattern)"
  - "OHOS omits bzip2: SeqLib src/ has zero BZ2 refs, bundled htslib guards bz2 code with HAVE_LIBBZ2; drop the dep, neutralize top-level configure bz2 error, strip -lbz2 from htslib_default_libs (same as htslib/1.24-r0 --disable-bz2)"
  - "zlib must be 1.3.1.1 not 1.3.1: the suffix forces ohpcd resolution (Makefile build); 1.3.1 resolves to conancenter CMake which fails on OHOS (same HarmonyOS/clang error as bzip2)"
  - "ARM NEON backport for bundled walaj/bwa ksw.c (lh3/bwa v0.7.19 neon_sse.h, byte-identical, build-time shim; __max_16/__max_8/lazy-F use vmaxvq reductions, DP math unchanged)"
  - "BSD u_int32_t alias (guarded typedef) for bwa bwtgap.h/c, bwtindex.c, bwt_lite.c; NEON backport extended to fermi-lite f_ksw.c (same striped-SW family, verified byte-identical SIMD sites)"
  - "In-source layout (source==build==src, samtools/1.21 pattern): SUBDIRS use static Makefiles absent from AC_CONFIG_FILES; bundled makes hard-assign CC=gcc/AR=ar and ignore env CPPFLAGS/LDFLAGS, so drive make with CC/CXX/AR/RANLIB/CPPFLAGS/LDFLAGS/INCLUDES command-line vars and bake -L into subdir LIBS, drop bwa -lrt (no librt on OHOS)"

validation:
  conan_create: pending-hmbs-preflight
  upstream_subset_tests:
    - "./configure && make -j1 (Travis CI 1.2.0 compile gate)"
  test_package: pending-hmbs-preflight

artifacts:
  libraries:
    - "lib/libseqlib.a"
    - "lib/libbwa.a"
    - "lib/libfml.a"
    - "lib/libhts.a"
