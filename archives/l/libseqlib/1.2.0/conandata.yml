# conandata.yml — libseqlib 1.2.0
# Upstream 1.2.0 is Autotools (configure + recursive make).
# Main tarball is the official GitHub tag archive; bwa / fermi-lite / htslib
# are the pinned submodules at 1.2.0 (git submodule SHAs), fetched as
# official codeload tarballs so the build works without `git clone --recursive`.
# Download reliability (CI rule): GitHub direct is slow/flaky from the
# preflight worker (ConnectTimeout, retry storms). Mirror list follows
# ci/conan/build_and_test.sh get_mirrors() for github.com:
# gh-proxy.com first, official URL last as fallback. sha256 unchanged
# (mirrors serve the identical archive).

