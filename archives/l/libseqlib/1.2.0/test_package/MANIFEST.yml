# test_package/MANIFEST.yml — upstream and consumer test declaration
package: libseqlib/1.2.0
homepage: "https://github.com/walaj/SeqLib"

upstream_check_command: "./configure && make -j1"
upstream_test_in_build: true
upstream_test_command: "./configure && make -j1 (Travis CI 1.2.0 compile gate)"

# Upstream 1.2.0 ships no `make check` suite (no TESTS/check_PROGRAMS).
# Travis CI (.travis.yml) runs `./configure && make` only.
# seq_test/ holds 53 Boost.Test cases but needs external test_data
# (small.bam/cram/sam, refs) absent from the tag tarball plus Boost 1.73
# via secure download, hence not executed in upstream CI nor here.
# The compile gate itself is the upstream assertion (discovered=1).
upstream_tests:
  - file: configure
    source: SeqLib-1.2.0/configure
    description: "Travis CI compile gate: configure succeeds and recursive make builds bwa/htslib/fermi-lite/src"
    command: "./configure --host=aarch64-unknown-linux-ohos && make -j1"

test_package_tests:
  - file: test_seqlib.cpp
    description: "Consumer links libseqlib+bwa+fml+hts (+transitive zlib/lzma) via direct-cxx (no CMake: HarmonyOS unknown to vanilla CMake) and calls AddCommas/percentCalc/rcomplement/GRC-merge/Cigar"
    command: "./test_seqlib"

assertion_count: 5
