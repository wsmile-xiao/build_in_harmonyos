# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libbaseencode/1.0.15
homepage: "https://github.com/paolostivanin/libbaseencode"

# 上游测试命令: CMake + Criterion。
# tests/CMakeLists.txt 将 4 个测试源编译为单个 test_all 可执行并注册 ctest TestAll。
# 完整枚举证据见 reports/upstream-test-enumeration.md
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 29 个独立 Test 块 (Criterion)，单二进制 test_all
upstream_tests:
  - file: test-base32-encode.c
    source: libbaseencode-1.0.15/tests/test-base32-encode.c
    description: "base32 编码 7 用例 (null_input/data_nodata/rfc4648/all_chars/exceeded)"
    command: "./test_all"
  - file: test-base32-decode.c
    source: libbaseencode-1.0.15/tests/test-base32-decode.c
    description: "base32 解码 8 用例 (rfc4648/invalid/whitespaces/exceeded/null)"
    command: "./test_all"
  - file: test-base64-encode.c
    source: libbaseencode-1.0.15/tests/test-base64-encode.c
    description: "base64 编码 7 用例 (null_input/data_nodata/rfc4648/all_chars/exceeded)"
    command: "./test_all"
  - file: test-base64-decode.c
    source: libbaseencode-1.0.15/tests/test-base64-decode.c
    description: "base64 解码 7 用例 (rfc4648/invalid/whitespaces/exceeded)"
    command: "./test_all"

# test_package 中自带的测试 (消费者视角验证, 真实 API 调用, R34)
test_package_tests:
  - file: test.c
    description: "消费者测试: base32/base64 RFC-4648 编解码 round-trip 公开 API 调用"
    command: "./test_libbaseencode"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 29 Test 块 + test_package 6 组 round-trip 校验
assertion_count: 35