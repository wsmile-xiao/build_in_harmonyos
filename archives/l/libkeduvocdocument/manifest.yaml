software: libkeduvocdocument
display: "libkeduvocdocument (LibKEduVocDocument)"
description: "KDE vocabulary-document library: KVTML 1/2, KVTL, CSV, Pauker, Vokabeln, WordQuiz (wql) and XDXF readers/writers behind the KEduVocDocument API (used by Parley, KWordQuiz, KHangman, Kanagram)"
category: library
homepage: "https://invent.kde.org/education/libkeduvocdocument"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KF_IGNORE_PLATFORM_CHECK=TRUE bypasses the KDE platform allowlist (OHOS not listed)"
    - "KF_SKIP_PO_PROCESSING=ON: ki18n_install(po) needs gettext msgfmt (86 translations); not required for the library to work"
    - "CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG set manually (CMake has no Platform/HarmonyOS module, E092) so libKEduVocDocument.so.5 gets a real DT_SONAME"
    - "E537 relocatable linkage (patch 0002): ohpcd KF6 libraries ship without DT_SONAME, so the imported KF6::* targets are replaced by -l:libKF6*.so links plus explicit -L/include dirs; DT_NEEDED keeps bare basenames only"
    - "E537 consumer-side bridge in build(): published kio/6.26.0 embeds absolute ~/.cache/conan2 DT_NEEDED entries (akonadi 25.12.3 precedent) which LD_LIBRARY_PATH cannot override"
    - "upstream packaging fix (patch 0001): installed LibKEduVocDocumentConfig.cmake exported a non-existent target name and a hard-coded build-time include prefix"
    - "upstream builds keduvocdocument/tests/{sharedkvtmlfilestest,converter} but never registers them with ctest (ecm_mark_as_test does not call add_test); the recipe runs them explicitly"
  common_dependencies:
    - qtbase/6.11.1
    - ki18n/6.26.0
    - karchive/6.26.0
    - kio/6.26.0
    - libxml2/2.15.3

versions:
  - version: "26.04.0"
    status: published
    date: 2026-09-21
