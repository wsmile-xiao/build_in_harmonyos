sources:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/libkeduvocdocument-26.04.0.tar.xz"
  sha256: "032689e3af4da9ce578bfa8efb8945d214556a09ddff412a5c2f8d5be720d653"
patches:
  - patch_file: "patches/0001-LibKEduVocDocumentConfig.cmake.in.patch"
    patch_description: "Upstream packaging fix (all platforms): the installed LibKEduVocDocumentConfig.cmake hard-coded the build-time include prefix and pointed LIBKEDUVOCDOCUMENT_LIBRARIES at a non-existent target, so consumers could not use the exported target. Fix the include dir, the exported target name and add the missing find_dependency(Qt6 COMPONENTS Xml)."
    patch_type: "bugfix"
  - patch_file: "patches/0002-keduvocdocument-CMakeLists.txt.patch"
    patch_description: "E537 relocatable linkage on OHOS: the KF6 dependencies published on ohpcd carry no DT_SONAME, so linking the imported KF6::* targets makes ld record the absolute Conan cache path in DT_NEEDED. Link them by basename (-l:libKF6*.so) with explicit -L/include dirs instead, keeping Qt6::Xml as an imported target."
    patch_type: "portability"
