package: libkeduvocdocument/26.04.0
homepage: "https://invent.kde.org/education/libkeduvocdocument"

upstream_check_command: "ctest --test-dir <build> --output-on-failure --no-tests=error"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error"

# Upstream ctest registrations (BUILD_TESTING=ON):
#   keduvocdocument/autotests/CMakeLists.txt -> 3 (keduvocdocument_non_gui_unit_tests)
#                                              + 5 (keduvocdocument_gui_unit_tests_static)
#   keduvocdocument/tests/CMakeLists.txt     -> 0 ctest entries: upstream calls
#                                               ecm_mark_as_test(), which only sets
#                                               EXCLUDE_FROM_ALL and never add_test().
# The two test executables built from keduvocdocument/tests/ are therefore run
# explicitly by the recipe (see upstream_tests_extra below).
upstream_tests:
  - name: keduvocdocumenttest.cpp
    source: keduvocdocument/autotests/keduvocdocumenttest.cpp
    registration: "ecm_add_test, autotests/CMakeLists.txt:43 via keduvocdocument_non_gui_unit_tests (:70)"
    description: "KEduVocDocument API unit tests (KEduVocDocumentTests)"
    command: "ctest -R keduvocdocumenttest.cpp"
  - name: emptydocumenttest.cpp
    source: keduvocdocument/autotests/emptydocumenttest.cpp
    registration: "ecm_add_test, autotests/CMakeLists.txt:43"
    description: "EmptyDocumentTest: construction/destruction must not warn"
    command: "ctest -R emptydocumenttest.cpp"
  - name: keduvoctexttest.cpp
    source: keduvocdocument/autotests/keduvoctexttest.cpp
    registration: "ecm_add_test, autotests/CMakeLists.txt:43"
    description: "KEduVocTextTests: text/grade handling of KEduVocText"
    command: "ctest -R keduvoctexttest.cpp"
  - name: readerkvtml2test.cpp
    source: keduvocdocument/autotests/readerkvtml2test.cpp
    registration: "ecm_add_test GUI, autotests/CMakeLists.txt:61 via keduvocdocument_gui_unit_tests_static (:71)"
    description: "KVTML 2.0 reader/DTD conformance (embedded XML fixtures)"
    command: "ctest -R readerkvtml2test.cpp"
  - name: readerwordquiztest.cpp
    source: keduvocdocument/autotests/readerwordquiztest.cpp
    registration: "ecm_add_test GUI, autotests/CMakeLists.txt:61"
    description: "WordQuiz (wql) reader tests"
    command: "ctest -R readerwordquiztest.cpp"
  - name: readerpaukertest.cpp
    source: keduvocdocument/autotests/readerpaukertest.cpp
    registration: "ecm_add_test GUI, autotests/CMakeLists.txt:61"
    description: "Pauker reader tests"
    command: "ctest -R readerpaukertest.cpp"
  - name: readervokabelntest.cpp
    source: keduvocdocument/autotests/readervokabelntest.cpp
    registration: "ecm_add_test GUI, autotests/CMakeLists.txt:61"
    description: "Vokabeln reader tests"
    command: "ctest -R readervokabelntest.cpp"
  - name: readerxdxftest.cpp
    source: keduvocdocument/autotests/readerxdxftest.cpp
    registration: "ecm_add_test GUI, autotests/CMakeLists.txt:61"
    description: "XDXF reader tests"
    command: "ctest -R readerxdxftest.cpp"

# Upstream test programs that are built (BUILD_TESTING=ON) but never registered
# with ctest; the recipe runs them explicitly so no upstream test is skipped.
upstream_tests_extra:
  - name: sharedkvtmlfilestest
    source: keduvocdocument/tests/sharedkvtmlfilestest.cpp
    registration: "built via keduvocdocument_executable_tests(), then ecm_mark_as_test() (no add_test)"
    description: "SharedKvtmlFiles::languages()/fileNames() enumeration"
    command: "<build>/bin/sharedkvtmlfilestest"
  - name: converter
    source: keduvocdocument/tests/converter.cpp
    registration: "built via keduvocdocument_executable_tests(), then ecm_mark_as_test() (no add_test)"
    description: >
      KEduVocDocument::open()/saveAs() round trip on the upstream sample
      keduvocdocument/kvtml_empty_sample.kvtml (written as KVTML 2.0, then
      re-opened; identifiers/entries must survive - the recipe asserts the
      output document).
    command: "<build>/bin/converter <src>/keduvocdocument/kvtml_empty_sample.kvtml <out>.kvtml"

# 双口径声明（避免"程序数 / 用例数"混淆，四个文档统一引用本节）:
#   upstream_test_count   = 测试程序数 8（ctest 注册）+ 2（未注册，配方显式执行）= 10
#   upstream_test_cases   = QTest 用例数 = 23（8 个程序内部用例之和，`<binary> -functions` 实测）
upstream_test_count: 10
upstream_test_cases: 23
upstream_test_cases_breakdown:
  keduvocdocumenttest.cpp: 2
  emptydocumenttest.cpp: 1
  keduvoctexttest.cpp: 2
  readerkvtml2test.cpp: 10
  readerwordquiztest.cpp: 2
  readerpaukertest.cpp: 2
  readervokabelntest.cpp: 2
  readerxdxftest.cpp: 2
upstream_tests_extra_count: 2
upstream_test_programs_registered: 8
upstream_test_programs_total: 10

# HarmonyOS-specific test cases (>= 1 required for OHOS-adapted packages).
ohos_specific_tests:
  - name: dt_soname_stamped
    where: test_package/conanfile.py (test)
    description: >
      DT_SONAME of the packaged lib/libKEduVocDocument.so.5.1.0 must be the
      bare "libKEduVocDocument.so.5". CMake has no Platform/HarmonyOS module,
      so the SONAME link flag is undefined on OHOS; the recipe supplies
      -Wl,-soname, from conanfile.py generate()
      (CMAKE_SHARED_LIBRARY_SONAME_CXX_FLAG; keditbookmarks / kio 6.26.0
      precedent).
    command: "llvm-readelf -d <pkg>/lib/libKEduVocDocument.so.5.1.0 | grep SONAME"
  - name: no_absolute_needed_leak
    where: test_package/conanfile.py (test)
    description: >
      E537 regression on the OHOS baseline: the packaged library must not
      record absolute Conan cache paths in DT_NEEDED. The KF6 libraries
      published on ohpcd carry no DT_SONAME, so without patch 0002 (link the
      KF6 deps by basename instead of by imported target) the linker would
      embed "/storage/Users/currentUser/.conan2/p/.../libKF6*.so".
    command: "llvm-readelf -d <pkg>/lib/libKEduVocDocument.so.5.1.0 | grep NEEDED"

# HarmonyOS-specific test case count (must be >= 1 for OHOS-adapted packages).
ohos_specific_tests_count: 2

test_package_tests:
  - file: test.cpp
    description: >
      Consumer program linked against the installed package: builds a
      KEduVocDocument with 2 identifiers + 1 lesson entry, saveAs(Kvtml),
      open() again and compares title/identifiers/entry translations, then
      checks detectFileType().
    command: "./test_libkeduvocdocument"

assertion_count: 18
