knowledge_gained:
  - "E537 生产者侧：ohpcd 发布的 KF6 依赖库（karchive/ki18n/kcoreaddons/kconfig/kservice/kcrash）无 DT_SONAME，直接 link 导入目标会把 Conan 缓存绝对路径写进 DT_NEEDED。必须按 basename (-l:libKF6*.so) 链接；注意 CMake 4.1 下 IMPORTED_SONAME/IMPORTED_NO_SONAME 改写无效（最小复现验证），且 KF6 目标的 IMPORTED_LOCATION 只按配置（IMPORTED_LOCATION_RELEASE）设置，读 generic 属性得到 NOTFOUND。"
  - "E537 消费者侧：已发布的 kio/6.26.0 二进制内嵌 ~/.cache/conan2/p/<hash>/p/lib/libKF6*.so 绝对 DT_NEEDED，musl 直接按绝对路径解析、LD_LIBRARY_PATH 无法覆盖；须把这些路径物化为指向当前缓存的兼容符号链接（akonadi 先例）。"
  - "上游 libkeduvocdocument 的 CMake 测试注册：keduvocdocument/tests/CMakeLists.txt 只调用 ecm_mark_as_test()（仅设 EXCLUDE_FROM_ALL，不 add_test），sharedkvtmlfilestest/converter 两个测试程序不会被 ctest 执行，必须显式运行。"
  - "HarmonyOS 6.0 实测：saveAs() 写入新建 QTemporaryDir()（0700）会因 autosave/lock 伴随文件创建失败而返回 FileCannotLock；写入 QDir::tempPath()（上游测试同款做法）正常。"
  - "KF6 6.26 闭包链接 ki18n/karchive/kio 需要显式加入传递组件 KF6::CoreAddons/KF6::ConfigCore 的 include 目录，否则 KJob/KAutoSaveFile 等头文件与符号缺失。"

