patch_classification:
  - file: 0001-LibKEduVocDocumentConfig.cmake.in.patch
    type: bugfix
    platform_only: False
    guard: none
    reason: "上游打包缺陷（所有平台都会踩）：安装版 LibKEduVocDocumentConfig.cmake 把 build 期 include 前缀硬编码，且 LIBKEDUVOCDOCUMENT_LIBRARIES 指向不存在的目标名，消费者无法使用导出目标。"
  - file: 0002-keduvocdocument-CMakeLists.txt.patch
    type: portability
    platform_only: False
    guard: "conanfile.py: str(self.settings.os) in (\"Linux\", \"OHOS\")"
    reason: "E537：ohpcd 的 KF6 依赖库无 DT_SONAME，需按 basename (-l:libKF6*.so) 链接以获得可重定位的 DT_NEEDED（kpackage 6.26.0 / baloo 6.28.0 先例）。动机来自 OHOS/ohpcd，但补丁在 Linux 上同样安全（KF6 包在两侧都提供 *.so 开发符号链接），故按 conanfile.py 的 Linux/OHOS 双平台门控执行。"

