software: libavif
version: "1.4.2.2"
build_system: cmake
status: built
source:
  url: "https://github.com/AOMediaCodec/libavif/archive/refs/tags/v1.4.2.tar.gz"
  sha256: "2b645287340ba5a631d268b551dc2d72bd73ac33335962dd36dcdb6d8366921d"
knowledge_gained:
  - "E2174: resolve OHOS signing tools from the frozen task-owned compiler closure"
dependencies:
  required:
    - "libdav1d/1.5.4"
  omitted_when_apps_and_tests_off:
    - "libjpeg-turbo"
    - "libpng"
    - "zlib"
build:
  cmake_options:
    - "AVIF_CODEC_DAV1D=SYSTEM"
    - "AVIF_LIBYUV=OFF"
    - "AVIF_BUILD_APPS=OFF"
    - "AVIF_BUILD_TESTS=ON"
    - "AVIF_GTEST=OFF"
    - "AVIF_BUILD_EXAMPLES=OFF"
    - "AVIF_BUILD_MAN_PAGES=OFF"
