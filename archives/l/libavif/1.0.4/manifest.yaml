software: libavif
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.4"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶层字段，供 verify-build 检查）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/libavif/libavif-1.0.4.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DAVIF_CODEC_AOM=ON"
    - "-DAVIF_CODEC_AOM_DECODE=ON"
    - "-DAVIF_CODEC_AOM_ENCODE=ON"
    - "-DAVIF_BUILD_APPS=ON"
    - "-DAVIF_BUILD_TESTS=OFF"
    - "-DAVIF_BUILD_EXAMPLES=OFF"
    - "-DCMAKE_PREFIX_PATH=$DEFAULT_PREFIX"
    - "-DPNG_LIBRARY=$DEFAULT_PREFIX/lib/liblibpng16_static.a"
    - "-DJPEG_LIBRARY=$DEFAULT_PREFIX/lib/libjpeg.a"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - aom/3.8.0
    - png/1.6.43
    - jpeg/62
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E073：鸿蒙 HMDFS 对 .so 符号链接运行时加载支持不完整，采用静态编译（BUILD_SHARED_LIBS=OFF）"
  - "CMake 静态链接需明确指定静态库路径（PNG_LIBRARY/JPEG_LIBRARY），否则会链接动态库"
  - "静态链接成功后，仍需设置 LD_LIBRARY_PATH 才能运行（RPATH 未设置）"
