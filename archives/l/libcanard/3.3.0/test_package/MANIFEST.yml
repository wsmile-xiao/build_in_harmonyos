# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libcanard/3.3.0
homepage: "https://github.com/OpenCyphal/libcanard"

# 上游测试命令 (tests/ 为 Catch2 套件，由 ctest 驱动)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
# tests/ 共 33 个 TEST_CASE，分 3 个矩阵、每个矩阵 4 种 (x64/x32 × C99/C11)
# 变体，共 12 个 ctest 测试项；在 OHOS aarch64 上补丁清除 x86 专用
# -m32/-m64 后仍为 12 项（原生 flags 构建运行）。
upstream_tests:
  - file: tests/test_private_cavl.cpp + test_private_crc.cpp + test_private_rx.cpp + test_private_tx.cpp
    source: libcanard-3.2.0/tests/test_private_*.cpp
    description: "内部管线单测矩阵（AVL/CRC/RX/TX 私有实现，19 个 TEST_CASE × 4 变体）"
    command: "ctest -R run_test_private"
  - file: tests/test_private_crc.cpp
    source: libcanard-3.2.0/tests/test_private_crc.cpp
    description: "关闭 CRC 静态表后的 CRC 单测矩阵（1 个 TEST_CASE × 4 变体）"
    command: "ctest -R run_test_private_crc_table"
  - file: tests/test_public_tx.cpp + test_public_rx.cpp + test_public_roundtrip.cpp + test_self.cpp + test_public_filters.cpp
    source: libcanard-3.2.0/tests/test_public_*.cpp + test_self.cpp
    description: "公开 API 单测矩阵（TX/RX/回环/自检/过滤器，13 个 TEST_CASE × 4 变体）"
    command: "ctest -R run_test_public"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 冒烟测试：版本宏/instance 初始化/TX push-peek-pop/RX 订阅查询退订/过滤器 helper（TAP 16 检查）"
    command: "test_libcanard"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
