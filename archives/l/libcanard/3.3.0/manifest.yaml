software: libcanard
version: "3.3.0"
status: built
build_date: "2026-09-14"

source:
  url: "https://github.com/OpenCyphal/libcanard/archive/refs/tags/3.2.0.tar.gz"
  sha256: "ff88f86be1bea71f267d8b3bdc20097ab81289edb8458f2b7cfd8b4f8268495c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DNO_STATIC_ANALYSIS=ON"
    - "-DNO_CANARD_SANITIZER=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-tests-ohos-aarch64.patch"

knowledge_gained:
  - "libcanard 是纯 C 实现的 Cyphal/CAN 传输层，无外部运行时依赖"
  - "上游无 install 目标，配方按 linenoise 模式内嵌 CMakeLists.txt 构建安装"
  - "上游 tests/ 为 Catch2 套件（33 个 TEST_CASE），由 ctest 驱动 3 矩阵 × 4 变体共 12 项"
  - "上游测试矩阵硬编码 x86 专用 -m32/-m64，在 OHOS aarch64 上需补丁清除"
  - "HarmonyOS libc 内含 pthread API，无独立 libpthread，测试链接需跳过 -lpthread"
