# 软件级 manifest
software: libcanard
display: "libcanard"
description: "面向高完整性实时嵌入式系统的 Cyphal/CAN 传输层 C 语言紧凑实现"
category: network
homepage: "https://github.com/OpenCyphal/libcanard"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游为 OpenCyphal/libcanard 官方仓库；v3 产品线最新 tag 为 3.2.0，上游尚未发布 3.3.0 tag，本配方以 3.2.0 源码按任务版本 3.3.0 适配（R39 官方源，见补充说明）"
    - "上游无 install 目标（文档要求直接拷贝 canard.c/canard.h 集成），配方内嵌 CMakeLists.txt 构建安装（同 linenoise 模式）"
    - "上游 tests/ 为 Catch2 套件（33 个 TEST_CASE），conanfile build() 中以 ctest 完整执行 12 项，结果经 HMBS_UPSTREAM_TEST_RESULT 标记输出"
    - "上游测试矩阵硬编码 x86 专用 -m32/-m64，非 x86 目标编译器直接报错；补丁在非 x86_64 上清除这些 flags（POSIX 兼容方式，无平台宏）"
    - "HarmonyOS libc 内含 pthread API，无独立 libpthread；补丁在 HarmonyOS 上跳过测试的 pthread 链接"
    - "纯库项目，只安装 ARCHIVE/LIBRARY 与头文件，不声明 commands.json（R38）"
  common_dependencies: []

versions:
  "3.3.0":
    status: built
    build_date: "2026-09-14"
