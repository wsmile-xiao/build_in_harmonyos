# 版本级 manifest
# 文件位置: archives/l/logstalgia/1.1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.4"

# 软件名
software: "logstalgia"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-09"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 release tarball（make dist 产物：自带 configure/Makefile.in/
  # aclocal.m4/config.guess 与完整 src/core submodule 内容）
  url: "https://github.com/acaudwell/Logstalgia/releases/download/logstalgia-1.1.4/logstalgia-1.1.4.tar.gz"
  sha256: "c049eff405e924035222edb26bcc6c7b5f00a08926abdb7b467e2449242790a9"
  tar_format: tar.gz

# ============================================================
# 构建信息
# ============================================================

build:
  cc: clang
  cxx: clang++
  configure_command: "./configure --build=aarch64-linux --host=aarch64-linux --with-boost=$BOOST_DIR --with-boost-system=boost_filesystem"

dependencies:
  - sdl2/2.30.10
  - sdl2-image/2.8.12
  - boost/1.84.0
  - glm/0.9.9.8
  - freetype/2.14.3.1
  - pcre2/10.45.1.1
  - libpng/1.6.58.2
  - gl4es/1.1.6

knowledge_gained:
  - "官方 release tarball 是 make dist 产物，自带 configure 与完整 src/core（绕开 submodule 与 autoreconf）"
  - "OHOS 无桌面 GL/GLU/GLEW：gl4es 提供 libGL.so 与 GL 头；GLU 五函数 + GLEW 三符号自写 shim（libGLU.a）"
  - "configure 的 GL/GLU/GLEW 检查走 pkg-config：配方生成 gl/glu/glew/freetype2 别名 .pc 指向 gl4es 与 shim"
  - "boost_system 自 1.69 起 header-only：--with-boost-system=boost_filesystem 骗过 AX_BOOST_SYSTEM 的 AC_CHECK_LIB"
  - "E467：configure conftest 需加载整条共享依赖闭包 + libc++_shared.so，LD_LIBRARY_PATH 全量注入 buildenv"

test:
  upstream_tests: 0
  smoke_test: 1
