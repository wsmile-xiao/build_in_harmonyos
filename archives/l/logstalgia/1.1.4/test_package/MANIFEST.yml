# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: logstalgia/1.1.4
homepage: "https://github.com/acaudwell/Logstalgia"

# 上游测试命令：上游 Autotools 未定义 make check 目标，故无上游测试命令
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 注：src/tests.cpp 提供 LogstalgiaTester（--test 选项），但它需要真实图形
# 环境（创建 SDL2 窗口 + OpenGL 上下文 + FreeType 字体），无法在无头 CI 跑。
upstream_tests:
  - file: src/tests.cpp
    description: "LogstalgiaTester：运行时自检（解析器/摘要器分组校验），需图形环境（--test），CI 无头环境不可执行"
    command: "logstalgia --test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "①glu_glew_shim_selftest 矩阵数学自测（链接包内 libGLU.a：恒等逆/P*M 次序/project-unproject 往返，无 GL 上下文纯数学断言，AI review PR #9643 接入消费者侧）；②经 execlp 直接运行 logstalgia --help（绕过 OHOS mksh 无法 exec ELF 的限制）验证二进制可执行并正常退出"
    command: "clang test.c gl_stub.c libGLU.a -lm -o test_logstalgia && ./test_logstalgia"

# 测试断言总数 (近似值, 用于质量评估)
# selftest 断言: invert(identity) 成功+逐元素(2) / multiply P*M 逐元素(1) / gluProject 调用+wx+wy+wz(4) / unproject 往返(2) ≈ 9
# --help 冒烟断言: 退出码 0(1) / fork 成功(1) / waitpid 成功(1) ≈ 3
assertion_count: 12
