# 版本级 manifest
# 文件位置: archives/l/libkolabxml/1.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.2.1"
software: "libkolabxml"
status: built
build_date: "2026-09-19"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://deb.debian.org/debian/pool/main/libk/libkolabxml/libkolabxml_1.2.1.orig.tar.gz"
  sha256: "c6cc9ff7748daacde5202617882cdee39fbe9b74c370a74b733f439dacf34b06"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_CXX_FLAGS=-DXSD_CXX11 -DXSD_CXX11_TEMPLATE_ALIAS -DXSD_CXX11_NULLPTR"
    - "-DBUILD_TESTS=OFF (default; -o build_tests=True enables the upstream tests locally)"
    - "-DBUILD_UTILS=OFF"
    - "-DQT5_BUILD=ON (only with -o build_tests=True)"

  dependencies:
    - "xerces-c/3.2.5"
    - "boost/1.90.0"
    - "libcurl/8.5.0"

  # 仅 -o build_tests=True 时引入（本地复验上游测试用）
  test_dependencies:
    - "qt5/5.15.19"
    - "ecm/6.20.0"
    - "zlib/1.3.1.1 (force)"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-finddeps-pre-generated-bindings.patch"
  - "0002-cmake-pre-generated-bindings.patch"
  - "0003-unique-ptr-kolabconversions.patch"
  - "0004-unique-ptr-xcalconversions.patch"
  - "0005-unique-ptr-xcardconversions.patch"
  - "0006-unique-ptr-xmlparserwrapper.patch"
  - "0007-thread-local-xmlparserwrapper.patch"
  - "0008-thread-local-utils.patch"
  - "0009-std-thread-conversiontest.patch"

# 预生成文件（构建工具链无法在 CI 交叉编译环境运行）
pre_generated:
  - "bindings/ (xsdcxx cxx-tree --std c++11, XSD 4.0.0)"
  - "kolabformat-xcal-schema.cxx/.hxx (xsdbin compiled grammar array)"
  - "libxsd/ (header-only XSD C++/Tree runtime, XSD 4.0.0)"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CodeSynthesis XSD toolchain (xsdcxx/xsdbin) cannot run on cross-compile CI workers; pre-generate the C++/Tree bindings with --std c++11 and the compiled schema array offline, ship them in patches/"
  - "libxsd runtime is header-only; with C++17 the XSD_CXX11 + XSD_CXX11_TEMPLATE_ALIAS + XSD_CXX11_NULLPTR macros switch auto_ptr to unique_ptr"
  - "clang-on-OHOS masquerades as GCC 4.2 so XSD_CXX11_TEMPLATE_ALIAS is not auto-derived; define explicitly"
  - "2014-era std::auto_ptr requires std::move() at ownership-transfer call sites when converted to std::unique_ptr"
  - "boost/1.90.0 conan package has no compiled boost_thread; replace boost::thread_specific_ptr with C++11 thread_local and boost::thread with std::thread"
  - "CMake 4.x needs -DCMAKE_POLICY_VERSION_MINIMUM=3.5 for the cmake_minimum_required(2.8.5) era project"
  - "qt5/5.15.19 ships upstream Qt5 cmake config files in lib/cmake; inject via -DCMAKE_PREFIX_PATH on the configure cli (a toolchain cache variable would overwrite the CMakeDeps generators path)"
  - "qt5/5.15.19 Qt5CoreConfigExtrasMkspecDir.cmake references the build-time ../b/mkspecs path; the conan cache package needs a sibling b/mkspecs symlink for find_package(Qt5Core) to succeed"
  - "zlib version conflict between qt5 (1.3.1) and libcurl (1.3.1.1) resolved with self.requires('zlib/1.3.1.1', force=True)"
