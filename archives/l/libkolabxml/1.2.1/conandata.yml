sources:
  # 镜像列表形态：官方源第一+镜像第二（sha256 已核一致 c6cc9ff...）——
  # CI Worker 对 deb.debian.org 不可达时 conan 多源回退（#3135 修法）
  url:
    - "https://deb.debian.org/debian/pool/main/libk/libkolabxml/libkolabxml_1.2.1.orig.tar.gz"
    - "https://mirror.nju.edu.cn/debian/pool/main/libk/libkolabxml/libkolabxml_1.2.1.orig.tar.gz"
  sha256: "c6cc9ff7748daacde5202617882cdee39fbe9b74c370a74b733f439dacf34b06"

patches:
  - patch_file: "patches/0001-finddeps-pre-generated-bindings.patch"
    patch_type: "portability"
    patch_description: "OHOS: FindLibkolabxmlDependencies falls back to pre-generated bindings when xsdcxx is unavailable"
  - patch_file: "patches/0002-cmake-pre-generated-bindings.patch"
    patch_type: "portability"
    patch_description: "OHOS: CMake uses pre-generated XSD bindings/schema instead of running xsdcxx/xsdbin host tools"
  - patch_file: "patches/0003-unique-ptr-kolabconversions.patch"
    patch_type: "portability"
    patch_description: "OHOS: std::auto_ptr -> std::unique_ptr with std::move ownership transfer (C++17 removed auto_ptr)"
  - patch_file: "patches/0004-unique-ptr-xcalconversions.patch"
    patch_type: "portability"
    patch_description: "OHOS: std::auto_ptr -> std::unique_ptr with std::move ownership transfer (C++17 removed auto_ptr)"
  - patch_file: "patches/0005-unique-ptr-xcardconversions.patch"
    patch_type: "portability"
    patch_description: "OHOS: std::auto_ptr -> std::unique_ptr with std::move ownership transfer (C++17 removed auto_ptr)"
  - patch_file: "patches/0006-unique-ptr-xmlparserwrapper.patch"
    patch_type: "portability"
    patch_description: "OHOS: xml_schema::dom::auto_ptr -> unique_ptr in XMLParserWrapper"
  - patch_file: "patches/0007-thread-local-xmlparserwrapper.patch"
    patch_type: "portability"
    patch_description: "OHOS: boost::thread_specific_ptr -> C++11 thread_local (no compiled boost_thread in boost/1.90.0 package)"
  - patch_file: "patches/0008-thread-local-utils.patch"
    patch_type: "portability"
    patch_description: "OHOS: boost::thread_specific_ptr -> C++11 thread_local in utils.cpp"
  - patch_file: "patches/0009-std-thread-conversiontest.patch"
    patch_type: "portability"
    patch_description: "OHOS: boost::thread -> std::thread in upstream conversiontest"
