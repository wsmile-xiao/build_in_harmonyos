software: libavc1394
display: "libavc1394"
description: "Audio/Video Control library for IEEE-1394 devices"
category: system
homepage: "https://ieee1394.wiki.kernel.org/"
license: LGPL-2.1-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需添加 HarmonyOS 平台检测"
    - "configure 临时目录需使用 TMPDIR 环境变量"
    - "panelctl 依赖 GNU argp（不可用），可从 bin_PROGRAMS 移除"
  common_dependencies:
    - libraw1394

# 版本索引（所有已归档版本，含状态）
versions:
  "0.5.4":
    status: published
    build_date: "2026-05-30"