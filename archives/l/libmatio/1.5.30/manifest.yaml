software: libmatio
version: "1.5.30"
build_system: cmake
status: built
build_date: "2026-09-04"
source:
  url: "https://github.com/tbeu/matio/releases/download/v1.5.30/matio-1.5.30.tar.gz"
  sha256: "8bd3b9477042ecc00dd71c04762fa58468e14cccc32fd8c6826c2da1e8bc3107"
knowledge_gained:
  - "os=OHOS 时须显式设 CMAKE_SYSTEM_NAME=OHOS + CMAKE_SYSTEM_PROCESSOR=aarch64，否则 cmake 找不到 Platform/HarmonyOS.cmake，产物无 DT_SONAME 并传染下游（同 hdf5/netcdf 先例）"
  - "上游 cmake/test.cmake 在 build 阶段用 test/convert_at_to_ctest.py 把 test/tests/*.at 的 3338 个 autotest 用例转成 8197 个 ctest 条目（与 autotools make check 同源），需要 Python3 解释器（OHOS 设备 /data/service/hnp/bin/python3）；链式用例（_1→_N）有顺序依赖，ctest 须完整顺序跑"
  - "matio 上游 thirdParties.cmake 的 HDF5 目标级联只认 hdf5::hdf5-shared/-static 与 CMake 内置 FindHDF5 的 HDF5::HDF5；Conan 2 CMakeDeps 只生成扁平 INTERFACE 目标 hdf5::hdf5，须补丁加目标分支（patch 0001，patch_type=conan）"
  - "上游 src/mat.c 的 Mat_mktemp 模板硬编码 /tmp/ 且 MAT_MKTEMP_BUF_SIZE 按 21 字节短路径计算：OHOS /tmp 只读致 mkdtemp 失败，长 TMPDIR 又被 snprintf 长度检查拒绝（391/8197 个 ctest 条目失败，readwrite_delete_variables 链）；修复为 TMPDIR 优先 + PATH_MAX 缓冲区（patch 0002，patch_type=portability），修复后 8197/8197 个 ctest 条目全过；知识草稿 E559"
