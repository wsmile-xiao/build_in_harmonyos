sources:
  url: "https://github.com/tbeu/matio/releases/download/v1.5.30/matio-1.5.30.tar.gz"
  sha256: "8bd3b9477042ecc00dd71c04762fa58468e14cccc32fd8c6826c2da1e8bc3107"

patches:
  - patch_file: "patches/0001-hdf5-conan2-cmakedeps-target.patch"
    patch_description: "上游 cmake/thirdParties.cmake 的 HDF5 目标级联只认识 hdf5::hdf5-shared/-static（hdf5 1.10/1.12 config 模式）与 CMake 内置 FindHDF5 的 HDF5::HDF5；Conan 2 CMakeDeps 只生成扁平 INTERFACE 目标 hdf5::hdf5，全不命中时落入 else 分支用未定义的大写 HDF5_INCLUDE_DIRS（CMakeDeps 只定义小写 hdf5_*）→ 空 include → hdf5.h 找不到。新增 hdf5::hdf5 分支直接链接 CMakeDeps 目标"
    patch_type: "conan"
  - patch_file: "patches/0002-mktemp-tmpdir-env.patch"
    patch_description: "上游 src/mat.c 的 Mat_mktemp 硬编码 /tmp/ 且 MAT_MKTEMP_BUF_SIZE 按 21 字节短路径计算：OHOS 根文件系统只读，mkdtemp('/tmp/XXXXXX') 失败；即使设 TMPDIR，旧长度检查也拒绝长路径并回退 /tmp。改为优先 TMPDIR（POSIX 标准临时目录覆盖，正确处理尾斜杠），缓冲区扩到 PATH_MAX（无 PATH_MAX 平台回退 4096），未设置 TMPDIR 时行为与上游一致"
    patch_type: "portability"
