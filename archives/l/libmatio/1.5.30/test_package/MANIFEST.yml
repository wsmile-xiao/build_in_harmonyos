package: libmatio/1.5.30
upstream_test_in_build: true
upstream_tests:
  - file: "test/tests/*.at → ctest（经 test/convert_at_to_ctest.py 转换）"
    description: "3338 个 autotest AT_SETUP 用例、5389 个 AT_CHECK 断言（mat4/mat5 未压缩+压缩/mat73/cell/struct/subscript API），与 autotools make check 同源；转换器展开为 8197 个 ctest 执行条目；适配后测试用例总数 3339（3338 上游用例 + 1 个 test_package 用例）"
test_package_tests:
  - file: test_libmatio.c
    description: "程序化生成 MAT 数据的读写回环（公开 API 消费安装包）：创建/写入/读取/变量名/类类型/维度/数值内容/错误输入，覆盖 v4、v5（未压缩+压缩）、v7.3（未压缩+压缩）共 5 组各 16 断言；错误输入 6 断言；长 TMPDIR 下 Mat_VarDelete 回归 14 断言（上游 1.5.30 mktemp 缓冲区缺陷）"
    command: "./test_libmatio"
assertion_count: 100
assertion_breakdown: "5 组回环 × 16（14 CHECK + 2 位模式比较）= 80；错误输入 6；长 TMPDIR 回归 14（13 CHECK + 1 memcmp）= 100；动态输出 test_package: 100 checks, 0 failures"
