# 软件级 manifest — libmatio
# 遵循 ARCHIVE-SPEC v2.0
software: libmatio
display: "matio"
description: "MATLAB MAT 文件 I/O 库，支持读写 MAT v4/v5/v7.3（含压缩）格式"
category: data
homepage: "https://github.com/tbeu/matio"
license: BSD-2-Clause

build_system: cmake

ohos_adaptation:
  key_points:
    - "os=OHOS 时须显式设 CMAKE_SYSTEM_NAME=OHOS + CMAKE_SYSTEM_PROCESSOR=aarch64（否则无 DT_SONAME）"
    - "上游 CMake 测试需 Python3 解释器（转换 autotest → ctest），OHOS 设备 /data/service/hnp/bin/python3 可用"
    - "matio 装有 matdump 可执行文件，须签 bin/ 下 ELF + 软件级 commands.json 登记（R38）"
  common_dependencies:
    - hdf5
    - zlib

versions:
  "1.5.30":
    status: built
    build_date: "2026-09-03"
