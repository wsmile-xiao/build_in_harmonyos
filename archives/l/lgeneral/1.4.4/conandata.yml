# conandata.yml — lgeneral 1.4.4
# Source: official SourceForge release (files layout: /project/lgeneral/lgeneral/)
# Verified: full download 1891302 B, 373 members, sha256 stable across retries.
# SF mirrors occasionally truncate large files — Conan source() uses retry=5
# + CI mirror fallback (E017) for network resilience.
sources:
  url: "https://downloads.sourceforge.net/project/lgeneral/lgeneral/lgeneral-1.4.4.tar.gz"
  sha256: "0a26b495716cdcab63b49a294ba31649bc0abe74ce0df48276e52f4a6f323a95"

patches:
  - patch_file: "patches/0001-intl-locale-h.patch"
    patch_description: "intl/dgettext.c: unconditionally include <locale.h> on musl (regenerated configure no longer probes HAVE_LOCALE_H)"
    patch_type: "portability"
  - patch_file: "patches/0002-intl-libgettext-locale.patch"
    patch_description: "intl/libgettext.h: unconditionally include <locale.h> so LC_MESSAGES resolves to the musl value"
    patch_type: "portability"
  - patch_file: "patches/0003-localize-use-bundled-intl.patch"
    patch_description: "util/localize.h: use bundled intl/libgettext.h instead of the empty OHOS sysroot <libintl.h> stub"
    patch_type: "portability"
  - patch_file: "patches/0004-intl-makefile-no-insthdr.patch"
    patch_description: "intl/Makefile.in: hardcode empty libtool suffix `l` (autoconf 2.69 config.status no longer substitutes @l@) and drop the missing intlh.inst target"
    patch_type: "bugfix"
  - patch_file: "patches/0005-configure-mktemp-umask.patch"
    patch_description: "configure: drop `umask 077` sub-shell wrapper around mktemp/mkdir that fails on HMDFS"
    patch_type: "portability"
  - patch_file: "patches/0006-makefile-in-automake-true.patch"
    patch_description: "Makefile.in: neutralize ACLOCAL/AUTOCONF/AUTOHEADER/AUTOMAKE maintainer-mode rebuild rules (no autotools in OHOS SDK)"
    patch_type: "portability"
  - patch_file: "patches/0007-testfile-link-intl.patch"
    patch_description: "src/Makefile.{am,in}: link testfile with $(INTLLIBS) so the upstream make check target resolves dcgettext__ on musl"
    patch_type: "bugfix"
