# 版本级 manifest
# 文件位置: archives/l/lgeneral/1.4.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.4.4"
software: "lgeneral"
status: published
build_date: "2026-09-16"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://downloads.sourceforge.net/project/lgeneral/lgeneral/lgeneral-1.4.4.tar.gz"
  sha256: "0a26b495716cdcab63b49a294ba31649bc0abe74ce0df48276e52f4a6f323a95"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix={package_folder}"
    - "--disable-sdltest"
    - "CC=clang"
  dependencies:
    - "sdl12-compat/1.2.68"
    - "sdl2_mixer/2.8.1"
    - "sdl2/2.30.10"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-intl-locale-h.patch"
  - "0002-intl-libgettext-locale.patch"
  - "0003-localize-use-bundled-intl.patch"
  - "0004-intl-makefile-no-insthdr.patch"
  - "0005-configure-mktemp-umask.patch"
  - "0006-makefile-in-automake-true.patch"
  - "0007-testfile-link-intl.patch"
  - "config.guess / config.sub: upstream 2011 scripts replaced with savannah 2023 versions that know aarch64-unknown-linux-ohos"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "gettext 0.10.35 bundled intl 与 autoconf 2.69 再生 configure 不兼容：@l@ libtool 后缀与 HAVE_LOCALE_H 探测双双失效，须在 intl/Makefile.in 与源码头补丁修复"
  - "OHOS sysroot 的 <libintl.h> 是空壳 stub，内嵌 intl 的包应改用自带 libgettext.h"
  - "上游 AM_PATH_SDL 只认 sdl-config；sdl12-compat 不装该脚本，须在 recipe generate() 生成包装"
  - "上游 make check 的 testfile_LDADD 缺 $(INTLLIBS)，glibc 上 libc 提供 dcgettext__ 掩盖该 bug，musl 上显形"
  - "GNU make jobserver 在 HMDFS 上创建 command FIFO 失败，autotools 包须 -j1"
