# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lgeneral/1.4.4
homepage: "https://sourceforge.net/projects/lgeneral/"

# 上游测试命令（autotools check_PROGRAMS：src/testfile；无 TESTS 套件）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序
upstream_tests:
  - file: src/file.c (check_PROGRAMS testfile, -DTESTFILE main)
    source: lgeneral-1.4.4/src/file.c
    description: "目录条目枚举器：列真实目录内容、缺失目录报错退出（补丁 0007 修复 musl 链接后可构建运行）"
    command: "src/testfile <dir> [ext [root]]"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_commands.py
    description: "lgeneral --version 输出 1.4.4 且 rc=0"
    command: "usr/bin/lgeneral --version"
  - file: test_commands.py
    description: "lgeneral --help 输出上游 Syntax: 用法文本且 rc=0"
    command: "usr/bin/lgeneral --help"
  - file: test_commands.py
    description: "lgc-pg --version rc=0"
    command: "usr/bin/lgc-pg --version"
  - file: test_commands.py
    description: "lged --help 输出帮助文本（上游约定 rc=1，断言只看文本；纯终端工具无 SDL）"
    command: "usr/bin/lged --help"
  - file: test_commands.py
    description: "ltrextract --help 输出帮助文本（同 lged 上游约定）"
    command: "usr/bin/ltrextract --help"
  - file: test_commands.py
    description: "dummy SDL 驱动下无数据包启动：干净非零退出（不崩溃、不假运行）"
    command: "SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy usr/bin/lgeneral"
  - file: test_commands.py
    description: "ELF 检查：4 个二进制均为 ELF64 AArch64 PIE，musl interpreter，NEEDED 白名单（libSDL-1.2.so.0/libSDL2-2.0.so.0/libc.so）"
    command: "check_elf(usr/bin/lgeneral, usr/bin/lgc-pg, usr/bin/lged, usr/bin/ltrextract)"
  - file: test_commands.py
    description: "上游 testfile：枚举 bin 目录含 lgeneral 条目、/nonexistent 报错 rc≠0"
    command: "usr/bin/testfile <bindir>; usr/bin/testfile /nonexistent"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 15
