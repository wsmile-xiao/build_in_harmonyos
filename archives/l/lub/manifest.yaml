software: lub
display: "Lub"
description: "Lua Utility Belt - a collection of utility modules for Lua programming"
category: lua-library
homepage: "https://github.com/lubyk/lub"
license: MIT
build_system: cmake

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "纯 Lua 库，使用 CMake 构建系统"
    - "需要修改 cmake_minimum_required VERSION (2.8 → 3.5)"
    - "安装路径: ~/usr/local/share/lua/5.4/lub/"
    - "源码来源: LuaRocks src.rock 文件"
  common_dependencies:
    - lua >= 5.1
    - luafilesystem >= 1.8.0 (可选，用于 lub.Dir 功能)

# 版本索引
versions:
  "1.1.0":
    status: built
    build_date: "2026-06-15"