# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libcello/2.1.0
homepage: "https://libcello.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# (上游 make check 在零补丁验证阶段独立运行，未嵌入 conan build())
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序 (tests/test.c, 基于 tests/ptest.h)
upstream_tests:
  - file: tests/test.c
    source: Cello-2.1.0/tests/test.c
    description: "Cello 官方 ptest 套件 (21 suites / 133 tests / 1639 asserts)"
    command: "./tests/test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Cello 对象/容器/异常/生命周期消费者测试 (Int/Float/String/Array/List/Table/Tree/Tuple/Range/Exception/Copy/Show)"
    command: "./test_cello"

# 测试断言总数 (test.c 中 CHECK 宏调用数 + 上游 asserts)
# test_package: 27 个 CHECK 断言 (跨 11 个功能组)
# 上游 make check: 1639 asserts
assertion_count: 27
