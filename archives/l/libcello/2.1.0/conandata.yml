# conandata.yml — libcello 2.1.0

sources:
  # Conan's get() deduces the archive type from the saved filename's extension.
  # codeload.github.com serves the tarball at a path with no ".tar.gz" suffix
  # (the saved name becomes "2.1.0"), so Conan misdetected it as a zip
  # ("BadZipFile"). The codeload URL is used because Conan's urllib3 downloader
  # reliably reaches codeload.github.com, whereas github.com times out in this
  # environment. The explicit `filename` gives Conan the .tar.gz extension it
  # needs to detect the gzip format. Both URLs serve identical bytes.
  url: "https://codeload.github.com/orangeduck/Cello/tar.gz/refs/tags/2.1.0"
  filename: "libCello-2.1.0.tar.gz"
  sha256: "c138d974325fcb9640307c8b2d5dcc2d7127a1ccc5589d6c0794f86a5cb4001d"

# Zero patches: the upstream 2.1.0 source compiles and links cleanly on
# OHOS arm64 (musl libc) without any modification. OHOS musl provides
# pthread.h, execinfo.h (with real backtrace/backtrace_symbols in libc.so)
# and libm natively, so none of the upstream portability fallbacks need
# to be forced. See notes.md for the audit.
patches: []
