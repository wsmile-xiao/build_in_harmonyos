knowledge_gained:
  - "The v0.1.7 source tag still sets PROJECT_VER_PATCH to 5; the recipe changes it to 7 after source extraction."
  - "CMake 4.1.2 needs CMAKE_POLICY_VERSION_MINIMUM=3.5 for upstream's CMake 2.6 minimum."
  - "HarmonyOS lacks a CMake platform module, so find_library(m) fails although math symbols link from libc; the recipe skips this lookup for HarmonyOS."
  - "The remote file system rejects make's parallel jobserver FIFO, so builds use -j1."
