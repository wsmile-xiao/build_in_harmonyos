software: libambix
version: "0.1.2"
status: draft
build_system: autotools
target_platform: aarch64-unknown-linux-ohos
issue: TBD

source:
  url: "https://github.com/iem-projects/ambix/archive/refs/tags/v0.1.2.tar.gz"
  sha256: "e66994f4b776a43dba3f6719da2ba9bf9cb51c898ded4d68cb76f1b9282fe957"
  tar_format: tar.gz
  upstream_home: "https://git.iem.at/ambisonics/libambix"
  version_mapping: "GitHub mirror tag v0.1.2 carries upstream libambix 0.1.2 (verified identical bytes on both official mirrors)."

build:
  system: autotools
  bootstrap:
    - "autoreconf -fi (tag archive ships no generated configure)"
  configure_options:
    - "native build, no --build/--host (E007/R15: patched config.guess returns aarch64-unknown-linux-ohos, cross_compiling=no)"
    - "--without-jack"
    - "--without-samplerate"
  ohos_config_guess_patch: "E007: patch every automake-installed config.guess/config.sub via scripts/patch-autotools-ohos.pl (Python fallback embedded) after bootstrap"
  dependencies:
    - "libsndfile/1.2.2"
  tool_dependencies:
    - "automake/1.18"
    - "autoconf/2.72"
    - "libtool/2.5.4.1"
    - "pkgconf/3.0.5"
  cc: clang
  cxx: clang++

ohos_signing:
  - "Upstream test ELFs under libambix/tests are self-signed with binary-sign-tool before make check (OHOS only, ELF-magic detection)."
  - "test_package consumer binary is self-signed before execution (OHOS only, libsndfile precedent)."

patches_applied: []

validation:
  local:
    - "Python AST syntax check for conanfile.py and test_package/conanfile.py (device round)"
    - "YAML parsing for conandata.yml, manifest.yaml and test_package/MANIFEST.yml (device round)"
    - "Upstream tag audit: 86 automake TESTS entries in libambix/tests/Makefile.am"
  remote:
    - "Pending: HarmonyOS aarch64 conan create incl. make check (86 upstream tests) and test_package (6 checks)"

knowledge_gained:
  - "Upstream publishes via IEM GitLab; both GitHub mirrors carry identical v0.1.2 bytes."
  - "Tag archives contain no generated configure; autoreconf needs automake/libtool tool_requires on OHOS."
  - "libsndfile is the mandatory file-I/O backend; JACK and libsamplerate are optional and disabled."
  - "Upstream suite is automake with 86 TESTS entries including 2 XFAIL (fail, fail_if1)."
