# test_package/MANIFEST.yml — upstream test declaration (CI gate L0e)
# Facts audited from the v0.1.2 tag tree; device execution numbers are
# filled only from real-device runs (never estimated).

package: libambix/0.1.2
homepage: "https://git.iem.at/ambisonics/libambix"

# Upstream suite entry point
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (libambix/tests automake suite)"

# Upstream existence + denominator (official upstream unit)
upstream_tests_exist: true
upstream_test_total: 86
upstream_test_count_method: autotools_tests
upstream_test_count_detail: "86 automake TESTS entries in libambix/tests/Makefile.am of the v0.1.2 tag (3 smoke pass/skip/fail + 6 if0/if1 variants + datatest/matrix/matrices/const_matrix + markers_regions + 2 none_* + 4 basic_* + 8 extended_* + 7 ambix_open/close/get_sndfile/seek/seek_read/readf_int16/writef_int16 + 51 basic2extended_* matrix conversions); XFAIL_TESTS holds fail and fail_if1"

upstream_tests:
  - file: libambix/tests/pass.c, skip.c, fail.c
    source: "ambix-0.1.2/libambix/tests/ (TESTS = pass skip fail; XFAIL_TESTS = fail)"
    description: "Smoke harness: PASS, SKIP and expected-failure cases"
    count: 3
  - file: libambix/tests/pass_if0.c, pass_if1.c, skip_if0.c, skip_if1.c, fail_if0.c, fail_if1.c
    source: "ambix-0.1.2/libambix/tests/ (TESTS += pass_if0 pass_if1 skip_if0 skip_if1 fail_if0 fail_if1; XFAIL_TESTS += fail_if1)"
    description: "Conditional smoke variants incl. one more expected failure"
    count: 6
  - file: libambix/tests/datatest.c, matrixtests.c, matrices.c, const_matrix.c
    source: "ambix-0.1.2/libambix/tests/"
    description: "Data-file and matrix unit tests"
    count: 4
  - file: libambix/tests/markers_regions.c, none_float32.c, none_float64.c
    source: "ambix-0.1.2/libambix/tests/"
    description: "Marker/region and no-format sample tests"
    count: 3
  - file: libambix/tests/basic_float32.c, basic_float64.c, basic_pcm32.c, basic_pcm16.c
    source: "ambix-0.1.2/libambix/tests/"
    description: "BASIC-format read/write round-trips per sample type"
    count: 4
  - file: libambix/tests/extended_*.c
    source: "ambix-0.1.2/libambix/tests/ (float32/float64/pcm32/pcm16 x offset 0/1024)"
    description: "EXTENDED-format read/write round-trips per sample type and offset"
    count: 8
  - file: libambix/tests/ambix_open.c, ambix_close.c, ambix_get_sndfile.c, ambix_seek.c, ambix_seek_read.c, ambix_readf_int16.c, ambix_writef_int16.c
    source: "ambix-0.1.2/libambix/tests/"
    description: "Public file-handle API tests incl. seek and int16 I/O"
    count: 7
  - file: libambix/tests/basic2extended_*.c
    source: "ambix-0.1.2/libambix/tests/ (identity/N3D/SID/FUMA/rand matrices x float32/float64/pcm32/pcm16, plain + 3extra + f64/i16/i32 output variants)"
    description: "Adaptor-matrix conversion tests across formats and sample types"
    count: 51

# Consumer-side tests executed by conan create (L1)
test_package_tests:
  - file: test.c
    description: "Links libambix::libambix; 6 ordered CHECK groups (order2channels, channels2order, is_fullset, identity matrix, scale-matrix multiply_float32, copy/create/destroy)"
    command: "./test_libambix"
    count: 6

assertion_count: 6
