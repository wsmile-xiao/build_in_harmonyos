software: leaps
display: "leaps"
description: "协作式网页结对编程编辑器（操作变换同步服务，Go）"
category: network
homepage: "https://github.com/Jeffail/leaps"
license: MIT
build_system: go

ohos_adaptation:
  key_points:
    - "纯 Go 项目（go.mod 1.12，依赖树无 C/C++），CGO_ENABLED=0 静态二进制（平台白名单 ET_EXEC 形态）"
    - "官方 Go 工具链自举（go1.25.12 linux-arm64，cc-connect/caddy 先例同款 sha256 双源）+ 工具链/产物全 ELF 签名（E549）"
    - "Go linker 输出必须落在 el2 app-files（hmdfs 拒绝 PROT_EXEC mmap，E331/E523），GOTMPDIR 同域"
    - "模块代理 goproxy.cn + GOSUMDB=sum.golang.google.cn（go.sum 校验）"
  common_dependencies: []

versions:
  "0.9.1":
    status: built
    build_date: 2026-09-29
