software: leaps
version: 0.9.1
status: built
build_system: go
build_date: "2026-09-29"
created_at: 2026-09-28

# 构建信息
configure_options:
  - "官方 Go 工具链自举：go1.25.12 linux-arm64（cc-connect/caddy 先例同款 sha256 双源）+ 工具链全 ELF 签名（E549）"
  - "GOTOOLCHAIN=local / CGO_ENABLED=0 / GOPROXY=https://goproxy.cn,direct / GOSUMDB=sum.golang.google.cn / GOFLAGS=-mod=mod"
  - "E331/E523：link 输出与 GOTMPDIR 落在 el2 app-files（leaps-conan-go），完成后再拷贝回 build 目录"
  - "go build -ldflags \"-s -w\" -o <el2>/leaps ./cmd/leaps"

build_command: go build -ldflags "-s -w" -o <el2>/leaps ./cmd/leaps
install_command: 拷贝 bin/leaps + LICENSE 到 package

# 测试信息
test_command: |
  上游: go test -exec <E549 签名包装器> ./...  （53/53 PASS，0 FAIL，0 SKIP，见 reports/go-test-all.log）
  消费者: test_package 执行 `leaps --help` 断言 Usage 输出
test_result: "53/53 PASS（上游 go test）；test_package PASS"
test_status: built

# 补丁信息
patches_applied: []

# 知识沉淀
knowledge_gained:
  - "纯 Go 无 C API 项目在 OHOS 可行：官方 go linux-arm64 工具链自举 + 全树 ELF 签名（E549）后 go build/go test 均可运行"
  - "go test 产物（测试二进制）同样受 E549 约束：必须经 -exec 包装器签名后才能执行"
  - "Go linker 输出落 hmdfs 会被拒（PROT_EXEC mmap），必须走 el2 app-files（E331/E523）"

# 产物信息
artifacts:
  binaries:
    - bin/leaps
  libraries: []
