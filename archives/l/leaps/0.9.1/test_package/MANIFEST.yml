package: leaps/0.9.1
homepage: "https://github.com/Jeffail/leaps"

# R51 upstream test inventory (evidence): the official tag archive
# leaps-0.9.1.tar.gz (sha256 8335e2a9…7be4) ships 19 *_test.go files /
# 53 Test functions under lib/. This adaptation RUNS the full upstream
# suite on-device (`go test -exec <E549-signer> ./...`) — 53/53 PASS,
# 0 FAIL, 0 SKIP (reports/go-test-all.log). test/ contains 4 JS story
# files (client-side, need node — device has no node, not runnable).
upstream_tests:
  - suite: "lib/** (go test ./...)"
    note: "53/53 PASS executed on-device; see reports/go-test-all.log"
  - suite: "test/stories/*.js"
    note: "4 files, client-side JS stories, need node toolchain (absent on OHOS), not runnable"

test_package_tests:
  - file: test_leaps.sh
    description: |
      Consumer-level execution of the INSTALLED tool (L0c test source):
      `leaps --help` prints the "Usage: leaps" banner (R34 — real
      binary execution, not an empty shell test). Invoked by test().
  - file: conanfile.py (test())
    description: |
      Locates the packaged `leaps` binary in the dependency bindir and
      runs test_leaps.sh against it.
