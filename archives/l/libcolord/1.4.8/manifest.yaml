  - "libcolord 与 colord 同源同版本，meson 构建；纯库包需跳过 client/ 子目录（无 commands.json）（ref: E545）"
  - "gusb/gudev/libudev 在 OHOS 不可用，需 required:false + HAVE_LIBUDEV 配置宏守卫（R8：不用 __OHOS__ 平台宏）（ref: E546）"
  - "glib2 Conan 包只有聚合 glib-2.0.pc，meson 单模块查找需补写 gobject/gio/gio-unix/gmodule .pc 薄包装（ref: E547）"
  - "静态 glib 双副本导致跨库 GFile* G_IS_FILE 断言失败（上游测试环境限制），test_package 用 CdColorRGB/CdIcc 无跨库 GObject 传递（ref: E548）"

