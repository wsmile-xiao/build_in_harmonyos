# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcolord/1.4.8
homepage: "https://github.com/hughsie/colord"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
# libcolord 为纯库包，配方中 tests=false（daemon=false 时 src/cd-self-test 不可用；
# colord-test-daemon 需运行中的 colord daemon 进程，否则上游主动 [DISABLED]；
# colord-test-private 的 GFile 相关用例受静态 glib 双副本 GType 限制）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (OHOS 实测，R51；注册数按源码 g_test_add 全量口径)
upstream_tests:
  - file: cd-test-private.c
    source: lib/colord/cd-test-private.c
    description: "库内部功能测试 (colord-test-private, 38 个子用例)；OHOS 实测 11 通过 / 27 失败（详见 notes.md）"
    command: "./colord-test-private"
  - file: cd-test-daemon.c
    source: lib/colord/cd-test-daemon.c
    description: "客户端 D-Bus 交互测试 (colord-test-daemon, 源码注册 25 项、运行时 24 项，systemwide 需 HAVE_SYSTEMD)；OHOS 无运行中的 colord daemon 进程，上游全部打印 [DISABLED] 直接返回（rc=0，非 SIGSEGV）"
    command: "./colord-test-daemon"
  - file: cd-self-test.c
    source: src/cd-self-test.c
    description: "daemon 内部自测 (cd-self-test, 9 个子用例)；libcolord 纯库包 daemon=false 不构建"
    command: "./cd-self-test"
  - file: ch-self-test.c
    source: lib/colorhug/ch-self-test.c
    description: "ColorHug 配套库自测 (ch-self-test, 11 个子用例)；依赖 gusb 制品仓未发布，libcolord 配方跳过 lib/colorhug 子目录，未构建"
    command: "./ch-self-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：CdColorRGB 创建/设值/插值 + CdIcc 创建/元数据读写/版本查询"
    command: "./test_libcolord"

# 测试断言总数 (近似值)
assertion_count: 10
