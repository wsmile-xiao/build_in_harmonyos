# conandata.yml — libcolord 1.4.8
# Source: official colord 1.4.8 release tarball (libcolord is the client library
# shipped inside the colord upstream project)

sources:
  url: "https://github.com/hughsie/colord/archive/refs/tags/1.4.8.tar.gz"
  sha256: "4f707604f1d8c3e9d9191bc4499605ebcf03b2e4f45a246a78cbd381333879b7"

patches:
  "1.4.8":
    - patch_file: "patches/0001-data-meson.build.patch"
      patch_description: "Skip data/cmf, data/illuminant and data/profiles subdirs (their custom targets invoke cd-it8/cd-create-profile which need ELF-signed binaries at build time on OHOS)"
      patch_type: "portability"
    - patch_file: "patches/0002-lib-colord-cd-edid.c.patch"
      patch_description: "Guard libudev.h include and hwdb lookup in cd-edid.c with HAVE_LIBUDEV config macro (not __OHOS__ platform macro), preserving non-OHOS compatibility"
      patch_type: "portability"
    - patch_file: "patches/0003-lib-colord-meson.build.patch"
      patch_description: "Build a filtered optional_deps list so colordprivate/colord libraries link only against gudev/libudev when found, preserving non-OHOS compatibility"
      patch_type: "portability"
    - patch_file: "patches/0004-lib-meson.build.patch"
      patch_description: "Skip lib/colorhug subdir (requires gusb which is not available)"
      patch_type: "portability"
    - patch_file: "patches/0005-meson.build.patch"
      patch_description: "Make gusb/gudev/libudev optional (required:false), define HAVE_LIBUDEV when libudev found, skip po (needs gettext), skip client (libcolord is a client library only), skip meson_post_install.sh (needs chown)"
      patch_type: "portability"
