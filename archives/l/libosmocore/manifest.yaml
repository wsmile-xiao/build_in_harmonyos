software: libosmocore
display: libosmocore
description: Osmocom 核心库：GSM/UMTS/GPRS 协议栈与电信信令基础库集合（10 个共享库 + 命令行工具）
category: network
homepage: https://osmocom.org/projects/libosmocore
license: GPL-2.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - 原生 TLS（-fno-emulated-tls）修复 emutls 跨 DSO 传递 osmo_ctx 上下文导致的运行时段错误
    - config.guess / config.sub 补齐 aarch64-linux-ohos 平台三元组
    - sockaddr_storage 重定义冲突使用平台中立宏守卫
    - musl 缺 __always_inline 宏，hash.h 改平台中立写法
    - 上游 tarball 缺 src/gsm/kdf/crypto.h，按上游 tag 原文补齐
    - 无 SCTP 内核能力时上游测试自动跳过（AT_SKIP_IF）
  common_dependencies:
    - talloc          # 必需（TALLOC pkg-config）
    - libmnl          # 可选，recipe 默认 with_libmnl=True
    - pcsc-lite       # 可选，recipe 默认 with_pcsc=True
    - libusb          # 可选，recipe 默认 with_libusb=True
versions:
  1.11.0:
    status: failed
    build_date: 2026-09-13
