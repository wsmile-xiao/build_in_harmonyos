# conandata.yml — libosmocore 1.11.0
# 上游官方发布包（osmocom 官方发布站点）
sources:
  url: "https://downloads.osmocom.org/releases/libosmocore/libosmocore-1.11.0.tar.bz2"
  sha256: "8e8dbf5e7d6d705aa34461a4ab3a0bd57f6961582cef95a1aafef3c74604c6dc"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS host triplet; drop umask 077 for the temporary directory (HMDFS does not support it)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept the linux-ohos kernel/OS pair so configure can canonicalize the target triple"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: drop umask 077 around the config.status temporary directory (HMDFS limitation)"
    patch_type: "portability"
  - patch_file: "patches/0004-include-osmocom-core-hash.h.patch"
    patch_description: "hash.h: use __inline__ __attribute__((always_inline)) instead of the glibc-only __always_inline macro (bionic/musl headers do not provide it)"
    patch_type: "portability"
  - patch_file: "patches/0005-src-coding-libosmocoding.map.patch"
    patch_description: "libosmocoding.map: additionally export the talloc API symbols under a shared TALLOC_2.0.2 version node so that the static-only talloc dependency is hosted by a single module instead of one private copy per DSO"
    patch_type: "portability"
  - patch_file: "patches/0006-src-core-libosmocore.map.patch"
    patch_description: "libosmocore.map: additionally export the talloc API symbols under a shared TALLOC_2.0.2 version node so that the static-only talloc dependency is hosted by a single module instead of one private copy per DSO"
    patch_type: "portability"
  - patch_file: "patches/0007-src-core-mnl.c.patch"
    patch_description: "mnl.c: guard the redefinition of struct sockaddr_storage, which is already provided by <sys/socket.h> on this libc"
    patch_type: "portability"
  - patch_file: "patches/0008-src-core-netdev.c.patch"
    patch_description: "netdev.c: guard the redefinition of struct sockaddr_storage (see 0005)"
    patch_type: "portability"
  - patch_file: "patches/0009-src-core-osmo_io_internal.h.patch"
    patch_description: "osmo_io_internal.h: guard the unconditional <netinet/sctp.h> include with HAVE_LIBSCTP, so the build also succeeds where the SCTP headers are not installed"
    patch_type: "portability"
  - patch_file: "patches/0010-src-core-osmo_io_uring.c.patch"
    patch_description: "osmo_io_uring.c: guard the unconditional <netinet/sctp.h> include with HAVE_LIBSCTP (same defect as 0007)"
    patch_type: "portability"
  - patch_file: "patches/0011-src-core-sockaddr_str.c.patch"
    patch_description: "sockaddr_str.c: make address family conversion consistent with the libc getaddrinfo() behavior on this platform"
    patch_type: "portability"
  - patch_file: "patches/0012-src-core-socket.c.patch"
    patch_description: "socket.c: only retry getaddrinfo() for EAI_SERVICE, matching the libc error mapping on this platform"
    patch_type: "portability"
  - patch_file: "patches/0013-src-core-stats_tcp.c.patch"
    patch_description: "stats_tcp.c: guard the redefinition of struct sockaddr_storage (see 0005)"
    patch_type: "portability"
  - patch_file: "patches/0014-src-core-utils.c.patch"
    patch_description: "utils.c: map errno consistently in osmo_str_to_int64() for the libc used on this platform"
    patch_type: "portability"
  - patch_file: "patches/0015-src-ctrl-libosmoctrl.map.patch"
    patch_description: "libosmoctrl.map: additionally export the talloc API symbols under a shared TALLOC_2.0.2 version node so that the static-only talloc dependency is hosted by a single module instead of one private copy per DSO"
    patch_type: "portability"
  - patch_file: "patches/0016-src-gb-gprs_ns2_fr.c.patch"
    patch_description: "gprs_ns2_fr.c: guard the redefinition of struct sockaddr_storage (see 0005)"
    patch_type: "portability"
  - patch_file: "patches/0017-src-gb-libosmogb.map.patch"
    patch_description: "libosmogb.map: additionally export the talloc API symbols under a shared TALLOC_2.0.2 version node so that the static-only talloc dependency is hosted by a single module instead of one private copy per DSO"
    patch_type: "portability"
  - patch_file: "patches/0018-src-gsm-kdf-crypto.h.patch"
    patch_description: "add the missing src/gsm/kdf/crypto.h: the upstream release tarball does not ship this header although kdf/sha1.c and kdf/sha256.c include it (file taken verbatim from upstream git tag 1.11.0)"
    patch_type: "portability"
  - patch_file: "patches/0019-src-gsm-libosmogsm.map.patch"
    patch_description: "libosmogsm.map: additionally export the talloc API symbols under a shared TALLOC_2.0.2 version node so that the static-only talloc dependency is hosted by a single module instead of one private copy per DSO"
    patch_type: "portability"
  - patch_file: "patches/0020-src-isdn-libosmoisdn.map.patch"
    patch_description: "libosmoisdn.map: additionally export the talloc API symbols under a shared TALLOC_2.0.2 version node so that the static-only talloc dependency is hosted by a single module instead of one private copy per DSO"
    patch_type: "portability"
  - patch_file: "patches/0021-tests-exec-exec_test.c.patch"
    patch_description: "exec_test.c: avoid relying on external env and grep commands when validating the child environment"
    patch_type: "portability"
  - patch_file: "patches/0022-tests-gb-gprs_bssgp_test.c.patch"
    patch_description: "gprs_bssgp_test.c: wire the BSSGP transmit callback explicitly instead of relying on symbol interposition, which does not apply to symbols resolved inside a shared library"
    patch_type: "portability"
  - patch_file: "patches/0023-tests-lapd-lapd_test.c.patch"
    patch_description: "lapd_test.c: accept the libc wording for strerror(0)"
    patch_type: "portability"
  - patch_file: "patches/0024-tests-osmo_io-osmo_io_test.c.patch"
    patch_description: "osmo_io_test.c: create the temporary file in $TMPDIR/current directory, /tmp is read-only on this platform"
    patch_type: "portability"
  - patch_file: "patches/0025-tests-use_count-use_count_test.c.patch"
    patch_description: "use_count_test.c: accept the libc wording for strerror(ERANGE)"
    patch_type: "portability"
