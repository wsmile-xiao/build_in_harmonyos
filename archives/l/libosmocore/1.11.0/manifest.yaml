# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11.0"

# 软件名
software: "libosmocore"

# 编译状态
# published | built | failed | archived
# failed：配方与补丁可编译，但 CI 等价环境下上游测试必然失败
# （历史示例：制品仓 talloc 缺 shared 变体导致跨 DSO 双实例 abort；本包已由唯一宿主导出解决，见 notes.md 与 E568）
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-13"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.osmocom.org/releases/libosmocore/libosmocore-1.11.0.tar.bz2"

  # 源码校验和
  sha256: "8e8dbf5e7d6d705aa34461a4ab3a0bd57f6961582cef95a1aafef3c74604c6dc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（clean-verify 会逐条作为 configure 参数执行，此处仅可写可执行参数）
  # G0 干净构建只消费首条：clean_verify.py 把该串整体以 shlex.quote 作单个参数传入，
  # 一条里写多个开关会被 configure 当成一个参数（invalid feature name）→ 每条只放一个开关
  configure_options:
  - "--enable-shared"
  - "--disable-static"
  - "--disable-gnutls"
  - "--disable-libsctp"
  - "--disable-uring"
  # 说明：
  # - 交付形态：共享库（上游默认）。制品仓 talloc/2.4.4 仅静态变体且 chunk magic 按实例随机，
  #   共享 libosmocore 会私有烘入 libtalloc.a 并与调用方二进制形成两个 talloc 实例，跨实例
  #   操作触发 abort（曾 CI 实测 41/88 失败）→ 已在本包内解决：宿主 DSO libosmocore.so 的
  #   *.map global: 段导出 talloc 公开符号，使其成为 talloc 唯一宿主（导出 71 个符号），
  #   兄弟库改为引用其导出 → 0 失败；静态交付已实验证伪
  #   （上游 25 处 on_dso_load 构造函数注册在静态归档下不被拉入，详见 notes.md 与 E568）
  # - extra_cflags/extra_cxxflags 追加 -fno-emulated-tls（原生 TLS，见 notes.md 问题 1）
  # - --disable-libmnl/--disable-libusb/--disable-pcsc 仅在对应 with_* 选项关闭时传入，
  #   默认自动探测制品仓依赖
  # - PkgConfigDeps 注入 talloc/libmnl/libusb-1.0/libpcsclite 的 .pc
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "talloc/2.4.4（必需，TALLOC pkg-config）"
  - "libmnl/1.0.5（可选，with_libmnl 默认开）"
  - "libusb/1.0.27（可选，with_libusb 默认开）"
  - "pcsc-lite/2.4.0（可选，with_pcsc 默认开）"
  - "gnutls / liblksctp：制品仓无二进制，配方不 requires（对应开关关闭）"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

