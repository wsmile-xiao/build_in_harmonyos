# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS clang 默认 emulated TLS（emutls）：跨 DSO 访问库内 TLS 变量段错误，必须 -fno-emulated-tls（ref: E026、E104）"
  - "musl 下 sockaddr_storage 与内核 uapi 头重定义冲突，需平台中立宏守卫（ref: E091）"
  - "config.guess/config.sub 对 linux-ohos 的识别与脚本 umask 问题（ref: E007、E114）"
  - "conandata patches 条目不要写 strip：conan 用 patch_ng 自动剥离 a//b/ 前缀（strip=0 即正确），显式 strip:1 会把新增文件写到上一层目录（本次实测：crypto.h 落到源码根 gsm/kdf/ 导致编译失败）（ref: E515）"
  - "libtool 版本脚本 + clang lld 下 DSO 符号不能被可执行文件 interpose，测试桩须在测试侧接线（ref: E175）"
  - "上游发布 tarball 可能漏打包 git 中存在的头文件（1.11.0 缺 src/gsm/kdf/crypto.h），用上游 tag 原文补齐并以 /dev/null 新增补丁交付（ref: E254、DRAFT-release-tarball-missing-cmake-submodule）"
  - "Conan 对 package_type=static-library 的依赖默认不传递 headers/libs：配方 cpp_info.components 里的 talloc::talloc 引用会被 CMakeDeps 静默剔除（生成物中 FIND_DEPENDENCY_NAMES 与 DEPENDENCIES_RELEASE 为空），下游 test_package 编译期 'talloc.h' file not found（ref: E567、DRAFT-conan2-cmakedeps-transitive-include-strip）"
  - "talloc 的 chunk magic 按「每个 talloc 实例」随机生成（上游 talloc_test_get_magic；错配时报 'Bad talloc magic value - unknown value' 后 abort）：制品仓 talloc/2.4.4 只有静态变体，共享库 libosmocore.so 会把 libtalloc.a 私有烘入（libtool 版本脚本 + --exclude-libs 使其不导出，nm -D 中 talloc 符号数为 0），与调用方二进制里的 talloc 形成双实例 → 跨实例释放 abort（实测 Signal 6，88 项上游测试 41 项失败）；链接旗标无解（LOCAL 符号，--export-dynamic-symbol 导出 0 个）→ 静态交付试验同样证伪（上游 25 处 on_dso_load 构造函数注册在静态归档下不被拉入，实现能力静默缺失；用 --whole-archive 强制拉入又使测试的符号 interpose 打桩失效，失败数 8→13）→ 本包保持上游默认共享交付，并已在本包内解决：宿主 DSO libosmocore.so 的 *.map 的 global: 段导出 talloc 公开符号，使其成为 talloc 唯一宿主（nm -D 实测导出 71 个 talloc 符号），兄弟库改为引用其导出 → 0 失败（ref: E568）"
