# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者视角冒烟测试：跨 libosmocore/libosmogsm/libosmocodec 调用真实 API（hexdump/大小写转换/BCD/地址字符串/PLMN/AMR 重排）"
    command: "./test_smoke"
  - file: test_ohos_tls.c
    description: "鸿蒙特有测试：验证库导出的线程局部变量（osmo_ctx / osmo_cbsp_errstr）在跨 DSO 引用下可用、写入生效、线程间相互隔离（原生 TLS 模型一致性）"
    command: "./test_ohos_tls"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 33
