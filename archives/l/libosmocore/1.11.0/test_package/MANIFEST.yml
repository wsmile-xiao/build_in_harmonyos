# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试清单来源: 本机 `make check` 实测（tests/testsuite.log）
#   上游测试实体共 95 项 = tests/Makefile.am 的 check_PROGRAMS 声明的 94 个测试程序
#     + 1 个集成脚本 tests/osmo-auc-gen/osmo-auc-gen_test.sh
#   Autotest 套件 tests/testsuite.at 实际执行 90 个 case：88 pass / 2 skip
#     （socket_sctp: 平台内核不支持 SCTP；osmo_io (uring): 平台 seccomp 阻断 io_uring）
#   余下 7 个程序（auth/tuak_test、6 个 VTY 转录测试）按上游默认配置随 check_PROGRAMS
#     构建但不执行（上游 ext-tests 目标依赖外部 osmo_verify_transcript_vty.py，未启用）

package: libosmocore/1.11.0
homepage: "https://osmocom.org/projects/libosmocore"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试（Autotest 套件 tests/testsuite.at，共 90 个 case；上游测试实体共 95 项）
