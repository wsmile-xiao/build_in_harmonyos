package: libarcus/5.0.0
homepage: "https://github.com/Ultimaker/libArcus"

# Upstream discovery command (audit, not a test runner): the tag-5.0.0 tree
# was listed via the GitHub contents API and CMakeLists.txt was scanned for
# enable_testing/add_test/BUILD_TESTING. Result: zero ctest entries, but one
# consumer smoke program exists (test_package/test.cpp), promoted below.
upstream_check_command: "audit tag-5.0.0 tree + scan CMakeLists.txt for enable_testing/add_test/BUILD_TESTING"
upstream_test_in_build: false
upstream_test_command: "./upstream_smoke (built verbatim from upstream test_package/test.cpp)"

# Upstream 5.0.0 has no formal suite, but exactly one upstream-owned
# verification program. Declared exist:true with total 1 so the evidence
# gate's "upstream inventory shows tests" matches a real on-device
# execution (ccrtp precedent: promote the upstream verification program
# instead of claiming no_tests/0).
upstream_tests_exist: true
upstream_test_total: 1
# Single upstream program (one main(), exit-code oracle), not a named
# framework suite; auto is the only applicable method slot.
upstream_test_count_method: auto
upstream_test_audit:
  - path: "tag 5.0.0 root (GitHub contents API, ref=5.0.0)"
    finding: "12 entries: .gitignore, ArcusConfig.cmake.in, CMakeLists.txt, LICENSE, README.md, TODO.md, cmake/, conanfile.py, pyproject.toml.in, python/, src/, test_package/. No tests/ or test/ directory."
  - path: "CMakeLists.txt (tag 5.0.0, 4948 bytes)"
    finding: "Full text defines no enable_testing, no add_test, no BUILD_TESTING option and no check target; ctest_entries total is deterministically 0. Library target Arcus from 5 src/ files; python bindings under option BUILD_PYTHON (forced OFF in recipe)."
  - path: "src/ (13 files)"
    finding: "Only the Arcus library sources (Socket/SocketListener/MessageTypeStore/PlatformSocket/Error/Types/WireMessage); no test sources."
  - path: "python/ (7 files)"
    finding: "Only SIP binding sources (pyArcus.sip, Error.sip, Types.sip, SocketListener.sip, PythonMessage.sip/cpp/h); no pytest files, no test runner."
  - path: "test_package/test.cpp (tag 5.0.0, blob 8bb2db739a8d8d8a4223497d90e00c277eff9d73, 135 bytes)"
    finding: "The single upstream-owned verification program: includes Arcus/Socket.h + Arcus/Error.h, declares Arcus::SocketState, returns 0. Counted as upstream test total 1; vendored verbatim as test_package/upstream_test.cpp (provenance header only) and executed on device as ./upstream_smoke with exit-code oracle (0 = passed)."
  - path: "README.md examples note"
    finding: "README mentions an examples directory built by default, but tag 5.0.0 ships no examples/ directory, and upstream conanfile.py keeps examples opt-in (default False); nothing to promote."

upstream_tests:
  - file: test_package/test.cpp
    source: libArcus-5.0.0/test_package/test.cpp (upstream tag 5.0.0, verbatim vendored as test_package/upstream_test.cpp)
    description: "Upstream consumer smoke: declares Arcus::SocketState (forces header + lib linkage), returns 0"
    command: "./upstream_smoke"

test_package_tests:
  - file: test_socket.cpp
    description: "Socket lifecycle: initial state, InvalidStateError on close/reset in Initial, clearError, listener add/remove"
    command: "./test_socket"
  - file: test_error.cpp
    description: "Error value semantics: default invalid, code/message round-trip, fatal/native flags, toString/stream"
    command: "./test_error"

assertion_count: 12
