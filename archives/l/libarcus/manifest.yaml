software: libarcus
display: "libArcus"
description: "Ultimaker C++ socket communication library based on Protocol Buffers"
category: network
homepage: "https://github.com/Ultimaker/libArcus"
license: LGPL-3.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake library, Python bindings disabled (BUILD_PYTHON=OFF, no SIP dependency)"
    - "Requires protobuf 3.17.3 from the local registry (upstream needs Protobuf 3.17.1)"
    - "Upstream 5.0.0 ships no automated test suite (audited no_tests case)"
  common_dependencies:
    - protobuf

versions:
  "5.0.0":
    status: built
    build_date: "2026-09-19"
    conan_ref: "libarcus/5.0.0"
