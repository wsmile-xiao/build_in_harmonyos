knowledge_gained:
  - "LibSerial 是纯 C++17 + POSIX termios 库，零第三方依赖，OHOS 上无需补丁即可编译"
  - "上游 CMake 顶层强制 FIND_PACKAGE(Doxygen/PythonLibs/Boost.Test)，必须用 LIBSERIAL_ENABLE_TESTING/BUILD_EXAMPLES/PYTHON_ENABLE/BUILD_DOCS 四开关关闭非库目标"
  - "上游 gtest 套件（55 用例）硬编码 /dev/ttyUSB0、/dev/ttyUSB1 物理串口，OHOS 设备与 CI 均无，属环境不可运行而非失败"
  - "上游 install(DIRECTORY libserial) 会把 src/libserial/Makefile.am 一并装进 include/libserial/，属上游安装规则原样行为"
