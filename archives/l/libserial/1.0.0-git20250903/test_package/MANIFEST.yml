# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
# 清点方法与逐项原因见 archives/l/libserial/1.0.0-git20250903/notes.md R51 申报表

package: libserial/1.0.0-git20250903
homepage: "https://github.com/crayzeewulf/LibSerial"

# 上游测试命令分析：上游 test/CMakeLists.txt 仅注册 gtest 套件
# ADD_TEST(NAME UnitTests COMMAND UnitTests)；构建它需要
# LIBSERIAL_ENABLE_TESTING=ON（连带 FIND_PACKAGE(Boost unit_test_framework) REQUIRED
# 与 ExternalProject 下载 googletest 1.17.0）
upstream_check_command: "ctest -N --test-dir <build>（需 LIBSERIAL_ENABLE_TESTING=ON）"

# conanfile.py build() 未集成上游测试：gtest 套件硬编码物理串口 /dev/ttyUSB0、
# /dev/ttyUSB1（test/UnitTests.h:53,58），OHOS 设备与 CI 均无串口硬件
upstream_test_in_build: false
upstream_test_command: "ctest --test-dir <build> --output-on-failure（上游套件在 OHOS 无可运行入口，见 notes.md R51 申报表）"

# 上游实际存在的测试程序
upstream_tests:
  - file: test/UnitTests.cpp
    source: LibSerial-50e0f443666d48d7c7e181dc73a6b35700517fae/test/
    description: "googletest 套件（UnitTests 可执行程序）：SerialPortUnitTests 28 + SerialStreamUnitTests 25 + MultiThreadUnitTests 2 共 55 个 TEST_F 用例；硬编码 /dev/ttyUSB0 与 /dev/ttyUSB1 物理串口，OHOS 设备/CI 无硬件，全部 NOT_RUN"
    command: "ctest --test-dir <build> -R UnitTests"
    tests: 55
  - file: test/unit_tests.cpp
    source: LibSerial-50e0f443666d48d7c7e181dc73a6b35700517fae/test/unit_tests.cpp
    description: "Boost.Test 套件（unit_tests 可执行程序）2 个 BOOST_AUTO_TEST_CASE 用例；本身无硬件依赖（构造器默认状态 + 对不存在设备 Open 抛 OpenFailed），但链接 Boost.Test 运行时且随 LIBSERIAL_ENABLE_TESTING=OFF 不构建，NOT_RUN；其无硬件断言已由消费者测试同源覆盖"
    command: "./unit_tests"
    tests: 2

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libserial.cpp
    description: "消费者程序 1 个（test_libserial），8 个独立断言用例：SerialPort/SerialStream/SerialStreamBuf 默认构造处于关闭状态、未打开端口调用 SetBaudRate 抛 NotOpen、对不存在设备 Open 抛 OpenFailed 且保持关闭、失败 Open 后 SerialStream 非 good——后三条与上游 unit_tests.cpp 无硬件断言同源；链接安装后的 include/libserial/*.h 与 libserial.a"
    command: "./test_libserial"
    assertions: 8

upstream_test_count: 57
consumer_test_count: 1
consumer_assertion_count: 8
assertion_count: 65
