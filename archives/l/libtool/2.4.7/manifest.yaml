software: libtool
version: "2.4.7"
status: success
build_system: autotools
compile_date: "2024-03-19"

dependencies:
  required: [automake, autoconf]
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
  cflags: "-fPIC -O2"

patches_applied:
  - file: 0001-port-for-ohos.patch
    purpose: 添加 HarmonyOS 系统检测
    lines_changed: 30

compatibility:
  level: high
  issues:
    - libtoolize 在 zsh 下有兼容问题
  notes: Autotools 共享库支持必需

test_results:
  type: manual
  note: 核心功能正常

knowledge_gained:
  - libtool 是构建共享库的关键工具
  - libtoolize 在 zsh 下需要特殊处理

maintainer: OpenHarmony PC Developer社区
tags: [libtool, autotools, gnu]