# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libfirm/1.22.0
homepage: "https://github.com/libfirm/libfirm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (libfirm 自带 make test，编译并运行 unittests/*.c)
# 本机实跑: make test → 11 个测试程序全部通过 (exit 0)，共 142 个 assert
upstream_tests:
  - file: unittests/globalmap.c
    source: libfirm-1.22.0/unittests/globalmap.c
    description: "global hashmap 测试"
    command: "./globalmap"
  - file: unittests/nan_payload.c
    source: libfirm-1.22.0/unittests/nan_payload.c
    description: "NaN payload 往返测试"
    command: "./nan_payload"
  - file: unittests/rbitset.c
    source: libfirm-1.22.0/unittests/rbitset.c
    description: "bitset 操作测试 (34 asserts)"
    command: "./rbitset"
  - file: unittests/sc_val_from_bits.c
    source: libfirm-1.22.0/unittests/sc_val_from_bits.c
    description: "strcalc 位构建测试"
    command: "./sc_val_from_bits"
  - file: unittests/snprintf.c
    source: libfirm-1.22.0/unittests/snprintf.c
    description: "snprintf 兼容测试 (12 asserts)"
    command: "./snprintf"
  - file: unittests/strcalc.c
    source: libfirm-1.22.0/unittests/strcalc.c
    description: "字符串算术计算器测试 (60 asserts)"
    command: "./strcalc"
  - file: unittests/tarval_calc.c
    source: libfirm-1.22.0/unittests/tarval_calc.c
    description: "tarval 计算测试"
    command: "./tarval_calc"
  - file: unittests/tarval_float.c
    source: libfirm-1.22.0/unittests/tarval_float.c
    description: "tarval 浮点测试 (long double 分支在 aarch64 由上游跳过)"
    command: "./tarval_float"
  - file: unittests/tarval_floatops.c
    source: libfirm-1.22.0/unittests/tarval_floatops.c
    description: "tarval 浮点运算测试 (10 asserts)"
    command: "./tarval_floatops"
  - file: unittests/tarval_from_to.c
    source: libfirm-1.22.0/unittests/tarval_from_to.c
    description: "tarval 转换测试 (4 asserts)"
    command: "./tarval_from_to"
  - file: unittests/tarval_is_long.c
    source: libfirm-1.22.0/unittests/tarval_is_long.c
    description: "tarval long 测试 (10 asserts)"
    command: "./tarval_is_long"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：ir_init/new_ir_prog/set_irp/new_id_from_str 真实 API 调用"
    command: "./test_libfirm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 142