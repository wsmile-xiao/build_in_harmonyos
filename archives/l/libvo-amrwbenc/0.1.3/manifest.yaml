  url: "https://downloads.sourceforge.net/project/opencore-amr/vo-amrwbenc/vo-amrwbenc-0.1.3.tar.gz"
  sha256: "5652b391e0f0e296417b841b02987d3fd33e6c0af342c69542cbb016a71d9d4e"
  tar_format: tar.gz
  upstream_home: "https://sourceforge.net/projects/opencore-amr/（GitHub 镜像 mstorsjo/vo-amrwbenc）"

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-gnu"   # config.sub 不认 aarch64-linux-ohos；名义 gnu 三元组 + uname shim
    - "--build=aarch64-linux-gnu"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

test_passed: 1
test_failed: 0

test_results:
  # 上游 N=0：发行包内没有测试目录/测试目标，官方用法是它自己的 amrwb-enc 命令行
  upstream_registered: 0
  upstream_executed: 0
  upstream_passed: 0
  upstream_failed: 0
  upstream_skipped: 0
  # 完整消费者用例（平台 rule12）：6 步，含参考解码器闭环
  test_package_registered: 1
  test_package_executed: 1
  test_package_passed: 1
  test_package_failed: 0
  assertion_count: 6
  # 适配自检（M）：库/头/pkg-config/工具/许可/纯净性
  adapter_self_checks: 9
  # 闭环验证用的参考解码器（仅测试期依赖，仓库已适配）
  test_only_dependency: opencore-amr/0.1.6

knowledge_gained:
  - "vo-amrwbenc 的发行包（SourceForge 官方 release）自带 configure，无需 autoreconf；GitHub tag 归档包不含 configure。"
  - "config.sub 不认 aarch64-linux-ohos：按 lame 的做法用名义 GNU 三元组 --host/--build=aarch64-linux-gnu + PATH 前置 uname shim（-s 报 Linux，-m 报 aarch64）。"
  - "上游 configure 内含 umask 077，HMDFS/SELinux 下会让临时目录不可写（E011），构建前替换为 umask 022。"
  - "上游 Makefile.in 的 bin_PROGRAMS = amrwb-enc 没有进入 all/install 目标（较新 automake 下展开为空对象列表，make amrwb-enc 报 no input files）——按 Makefile.am 的声明手工编译同一个目标，bin/amrwb-enc 才真正随包交付。"
  - "AMR-WB 码流：魔数 #!AMR-WB\\n，20 ms/帧；帧头 1 字节 = (FT<<3)|0b100；帧长按模式为 18/24/33/37/41/47/51/59/61 字节（6.6k~23.85 kbps）。"
  - "E_IF_encode() 返回的 n 已包含 1 字节帧头（CLI 直接 fwrite(outbuf,1,n)），所以消费者可以直接与 CLI 产物逐字节比对。"
  - "闭环验证要按编解码器的算法延迟做延迟搜索：纯音信号直接逐样本比对会得到负相关系数（相位差约半个周期），搜索 0~2000 样本后相关系数 0.99+、SNR 18~21 dB。"
