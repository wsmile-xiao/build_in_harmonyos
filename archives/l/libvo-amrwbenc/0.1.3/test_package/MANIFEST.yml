package: libvo-amrwbenc/0.1.3
homepage: "https://sourceforge.net/projects/opencore-amr/"

# 上游 0.1.3 没有测试目录、没有 check/test 目标（N=0）；官方验证方式就是用它自己的
# 命令行工具编一段 16 kHz WAV。因此本包的上游"验证入口"就是 bin/amrwb-enc。
upstream_check_command: "bin/amrwb-enc -r 23850 in16k.wav out.awb"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: "(无)"
    source: "vo-amrwbenc-0.1.3/（无 test/ 目录、Makefile.am 无 check/test 目标、无 autopkgtest）"
    description: "上游 N=0：AMR-WB 编码器发行包不带自动测试，官方用法是 amrwb-enc 命令行编码"
    command: ""

test_package_tests:
  - file: test_vo_amrwbenc.c
    description: "完整消费者用例（rule12，6 步）：生成真实 16 kHz WAV → 用交付的 bin/amrwb-enc 编码成 #!AMR-WB 码流 → 校验魔数/50 帧/每帧 61 字节/帧头 FT=8 → 用 E_IF_* API 编码并与 CLI 产物逐字节一致 → 遍历 9 种模式校验帧长(18/24/33/37/41/47/51/59/61)与文件总长 → 用参考解码器 opencore-amr/0.1.6 解码回 16000 样本 PCM 做延迟搜索后的相关系数(≥0.97)与 SNR(≥10 dB)闭环校验"
    command: "./test_probe <pkg>/bin/amrwb-enc <workdir>"
  - file: test_layout.py
    description: "适配自检（M=9）：库/公开头、共享库 ELF、pkg-config 契约(Name/Version/Libs)、bin/amrwb-enc 可执行、licenses/{COPYING,NOTICE}、COPYING 声明 Apache-2.0、未夹带源码/中间产物"
    command: "python3 test_layout.py <package_folder>"

# 解码侧验证使用仓库已适配的同源参考实现（AMR-WB 解码器）
test_only_dependencies:
  - opencore-amr/0.1.6

assertion_count: 6
