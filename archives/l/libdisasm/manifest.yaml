software: libdisasm
display: "libdisasm"
description: "x86 指令集反汇编库及 x86dis 命令行反汇编工具"
category: library
homepage: "https://sourceforge.net/projects/bastard/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2003 年代 autotools + libtool 1.5.24：bundled config.sub 需补丁接受 aarch64 三元组"
    - "OHOS 下显式传 --build/--host 同为 aarch64-unknown-linux-gnu，避免老 configure 交叉模式误判"
    - "configure 生成 config.status 临时目录需 umask 022（setgid hmdfs 上 umask 077 目录不可写）"
  common_dependencies: []

versions:
  "0.23":
    status: built
    build_date: "2026-09-16"
    license: "GPL-2.0-or-later"
    source: "https://downloads.sourceforge.net/project/bastard/libdisasm/0.23/libdisasm-0.23.tar.gz"
