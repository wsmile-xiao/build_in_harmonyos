package: libdisasm/0.23
homepage: "https://sourceforge.net/projects/bastard/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_tests:
  - name: instruction-roundtrip
    file: test/run-test.sh
    source: libdisasm-0.23/test/run-test.sh
    description: "Round-trips every instruction in test/ia32_test_insn.S through GNU as --32 + objdump and compares against libdisasm output."
    command: "./run-test.sh"
    expected: "cannot run verbatim on the OHOS target (needs GNU as --32, objdump, perl); executed via the faithful device port reports/upstream-suite-device-port.py (clang i386 integrated assembler + llvm-readobj + python3)"

test_package_tests:
  - file: test_libdisasm.c
    description: "Decodes hand-verified IA-32 encodings (push/nop/mov/add/sub/ret and an invalid opcode) through the packaged library, checking consumed sizes, insn types, operand registers and immediates, and intel-syntax text."
    command: "test_libdisasm"
  - file: test_consumer.c
    description: "Consumer use case: linear scan of a synthetic function (listing, instruction count, byte coverage) and a code-patcher style search for the mov-with-immediate site, cross-checked in AT&T syntax."
    command: "test_consumer"

assertion_count: 30
