software: libelfin
display: "libelfin"
description: "C++11 ELF/DWARF parser (libelf++ and libdwarf++)"
category: library
homepage: "https://github.com/aclements/libelfin"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯递归 Makefile，无 configure；-Werror 下 clang 15 的 -Wunqualified-std-cast-call 需要 3 处 std::move 限定"
    - ".pc 规则依赖 git describe，release tarball 无 .git → 用传入的 VER 补丁修复，否则 pkg-config 拒绝并导致上游测试无法运行"
    - "test/test.sh 是 bash 脚本，OHOS 无 /bin/bash → 配方用显式 bash 解释器执行，不修改上游测试"
    - "上游 10 例测试基于仓库自带 DWARFv4 golden fixture；libdwarf++ 不支持 DWARF5"
    - "无外部库依赖，静态打包；同时提供可重定位的 pkg-config 元数据"
  common_dependencies: []

versions:
  "0.3.r7.ge017276":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libelfin/0.3.r7.ge017276"
