# 编译中学到的知识
# 每条行尾的 knowledge_ref 指向语料中最贴近该现象的既有条目/草稿（签名匹配）用于可追溯；
# 本次实际的修复动作（改 $(VER)、补 std::、显式 bash）写在 notes.md 与 PR 正文。
knowledge_gained:
  - "libelfin 是纯递归 Makefile（无 configure）：VER 必须显式传给 make；上游 elf/dwarf 的 .pc 规则用 git describe 取版本，release tarball 无 .git → 产出空 Version，pkg-config 报 \"Comparison operator but no version after package name 'libelf++'\"，examples/ 构建随之失败（补丁 0001/0004）"  # knowledge_ref: DRAFT-libcork-0.9.0-version-sh-git-describe
  - "clang 15 对未限定的 move() 报 -Wunqualified-std-cast-call，而上游 Makefile 带 -Werror：dwarf/dwarf.cc 1 处、dwarf/line.cc 2 处需改为 std::move()（补丁 0002/0003）；本例修的是调用点限定，不是关掉 -Werror"  # knowledge_ref: E063
  - "test/test.sh 的 shebang 是 #!/bin/bash，OHOS 无 /bin/bash（/data/service/hnp/bin/bash 可用）→ 不能依赖 make check，必须用显式 bash 解释器执行（因此未修改上游测试脚本）"  # knowledge_ref: E165
  - "上游测试 = 5 个 examples/dump-* 工具 × 2 个 golden fixture = 10 例，golden fixture 自带 DWARFv4 调试信息；libdwarf++ 只支持 DWARFv4，而 clang 15 与 OHOS 系统库（musl crt）产出 DWARF5（DW_FORM_strx1 0x25），解析自身镜像会抛 format_error: unknown attribute form 0x25——消费测试因此改用 dwarf++ 的 section loader 解析调试节"  # knowledge_ref: DRAFT-dwarf5-index-sections-toolchain-unsupported

