sources:
  url:
    - "https://github.com/aclements/libelfin/archive/e0172767b79b76373044118ef0272b49b02a0894.tar.gz"
  sha256: "0fb80f8a36b9b2563bd193ace5866972e739af306955e539310dc9dd870aef6c"

patches:
  - patch_file: "patches/0001-dwarf-Makefile.patch"
    patch_description: "Write the configured version into libdwarf++.pc instead of running git describe (a release tarball has no .git directory)"
    patch_type: "portability"
  - patch_file: "patches/0002-dwarf-dwarf.cc.patch"
    patch_description: "Qualify std::move when building the abbreviation table (clang 15 -Wunqualified-std-cast-call, and the upstream Makefile uses -Werror)"
    patch_type: "portability"
  - patch_file: "patches/0003-dwarf-line.cc.patch"
    patch_description: "Qualify std::move for include directory and file name entries (clang 15 -Wunqualified-std-cast-call, and the upstream Makefile uses -Werror)"
    patch_type: "portability"
  - patch_file: "patches/0004-elf-Makefile.patch"
    patch_description: "Write the configured version into libelf++.pc instead of running git describe (a release tarball has no .git directory)"
    patch_type: "portability"
