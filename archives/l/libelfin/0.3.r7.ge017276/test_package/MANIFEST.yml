package: libelfin/0.3.r7.ge017276
homepage: "https://github.com/aclements/libelfin"

upstream_check_command: "make check   # runs test/test.sh, which needs bash on PATH"
upstream_test_in_build: true
upstream_test_command: "bash ./test.sh   # executed from test/ with CC/CXX/VER exported; upstream shebang is #!/bin/bash and OHOS has no /bin/bash"

upstream_tests:
  - file: test/test.sh
    source: libelfin-e0172767b79b76373044118ef0272b49b02a0894/test/test.sh
    description: "Runs the five examples/dump-* tools over both golden fixtures (dump-sections, dump-segments, dump-lines, dump-syms, dump-tree x gcc-4.9.2 and gcc-6.2.1-s390x)"
    command: "bash ./test.sh"
  - file: test/golden-gcc-4.9.2/example
    source: libelfin-e0172767b79b76373044118ef0272b49b02a0894/test/golden-gcc-4.9.2
    description: "Committed golden ELF+DWARFv4 fixture (prebuilt binary plus expected dump output)"
  - file: test/golden-gcc-6.2.1-s390x/example
    source: libelfin-e0172767b79b76373044118ef0272b49b02a0894/test/golden-gcc-6.2.1-s390x
    description: "Committed golden big-endian ELF+DWARFv4 fixture (prebuilt binary plus expected dump output)"
upstream_case_count: 10

test_package_tests:
  - file: test_libelfin.cc
    description: "Consumer smoke test: parses its own image through the installed elf++ and dwarf++ libraries (ELF header, section table, symbol table, DWARF section loader)"
    command: "test_libelfin"
  - file: conanfile.py
    description: "Asserts the shipped pkg-config metadata (version and inter-library dependency)"
    command: "conan test"
assertion_count: 15
