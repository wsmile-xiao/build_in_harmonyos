package: "libxrandr/1.5.5"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxrandr"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The release Makefile.am files declare no TESTS, check_PROGRAMS,
  check-local, or custom test target, so upstream ships no test suite.

test_package_tests:
  - id: "api-surface"
    source: "api_surface.c"
    command: "libxrandr_api_surface"
    description: >-
      Link-time symbol surface: probe all 65 public XRR* entry points in
      libXrandr.so.2 via function-pointer references; verifies the exported
      ABI surface without needing a running X server.
  - id: "alloc-contract"
    source: "alloc_contract.c"
    command: "libxrandr_alloc_contract"
    description: >-
      Display-independent ABI contract: exercise XRRAllocModeInfo/XRRFreeModeInfo,
      XRRAllocGamma/XRRFreeGamma (contiguous channel stride), RANDR protocol
      version macros, and XRRScreenSize layout.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 19
