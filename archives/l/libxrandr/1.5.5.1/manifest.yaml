# 版本级 manifest — libxrandr 1.5.5.1
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "1.5.5.1"

# 软件名
software: libxrandr

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://xorg.freedesktop.org/archive/individual/lib/libXrandr-1.5.5.tar.xz"

  # 源码校验和
  sha256: "72b922c2e765434e9e9f0960148070bd4504b288263e2868a4ccce1b7cf2767a"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表（OHOS 交叉模式由 conanfile.py 生成 configure-ohos 提供）
  configure_options:
    - "--host=aarch64-linux-ohos"
    - "--enable-shared"
    - "--disable-static"

  # 编译依赖列表（格式: name/version）
  # 采用 cmd-pkgs 6.4.0 依赖轨道：libx11/6.4.0 = 上游 libX11 1.8.10 源码，
  # libxext/6.4.0 = 上游 libXext 1.3.6 源码（与已发布 libxcursor/libxi 一致）。
  dependencies:
    - libx11/6.4.0
    - libxext/6.4.0
    - libxrender/0.9.12
    - xorgproto/2025.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libxrandr 1.5.5 发布包自带预生成 configure（Autoconf 2.72），XORG 宏已内联，无需 xorg-macros m4；直接运行 configure 即可。"
  - "config.sub (2024-07-27) 已内置 ohos/linux-ohos 支持，仅 config.guess 缺少 HarmonyOS 分支，补丁 0001 添加后 config.guess 输出 aarch64-unknown-linux-ohos。"
  - "configure.ac 需要 x11/randrproto/xext/xextproto/xrender/renderproto 六个 pkg-config 模块；xrender 模块 + Xrender.h 由 libxrender/0.9.12 提供，即使 libXrandr 源码不调用 XRender* 符号也必须链接声明。"
  - "依赖轨道：libxext/6.4.0 钉 libx11/6.4.0，libxrender/0.9.12 钉 libx11/1.8.13，必须在 recipe 用 libx11/6.4.0 force=True 统一到 cmd-pkgs 轨道，libxrender 重新源码构建（linker-view 支持）。"
  - "产物 libXrandr.so.2.2.0（-version-number 2:2:0），安装头文件 include/X11/extensions/Xrandr.h。"
