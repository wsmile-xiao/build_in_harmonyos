# 软件元数据
name: libXrandr
description: "X RandR Extension Library - X Resize, Rotate and Reflect extension"
license: MIT
category: x11
homepage: https://www.x.org/releases/individual/lib/
source_url: https://xorg.freedesktop.org/archive/individual/lib/libXrandr-1.5.5.tar.xz

# 版本索引
versions:
  1.5.5:
    build_date: "2026-09-03"
    build_system: autotools
    status: built
    notes: 正规 autotools 构建，conan-verify 通过

# 依赖关系
dependencies:
  required:
    - "libX11 >= 1.8.10"
    - "libXext >= 1.3.6"
    - "libXrender >= 0.9.11"
    - "randrproto >= 1.6.0"

# 关键特性
features:
  - 支持 XRandR 1.6 规范
  - 动态库 + 静态库双版本
  - 位置无关代码 (-fPIC)