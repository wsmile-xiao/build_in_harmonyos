software: libheif-openjpeg
display: "libheif-openjpeg"
description: "OpenJPEG (JPEG 2000) decoder+encoder backend plugin modules of libheif"
category: gfx
homepage: "https://github.com/strukturag/libheif"
license: LGPL-3.0-or-later
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "本包是父 tarball（libheif）树内子模块：上游 CMake 目标 heif-j2kdec/heif-j2kenc → 产物 lib/libheif/libheif-j2kdec.so、libheif-j2kenc.so；包名按仓库惯例取「交付的编解码后端名」（同族 libheif-libde265/libheif-openh264 等）"
    - "交付面三要素：WITH_OpenJPEG_{DECODER,ENCODER}=ON + WITH_OpenJPEG_{DECODER,ENCODER}_PLUGIN=ON + ENABLE_PLUGIN_LOADING=ON；缺任一则不产生 MODULE 目标（退回静态编入宿主）。两个开关的 upstream 默认 defaultEnabled 都是 OFF（CMakeLists.txt:264-265）"
    - "插件无法脱离宿主（DT_NEEDED 宿主 + 必须由宿主 dlopen 注册），故自包含交付同源同版本、启用插件装载的 libheif 宿主；codec-free 的 libheif/1.22.2（ENABLE_PLUGIN_LOADING=OFF，且版本/ABI 不匹配）不可作为依赖"
    - "默认插件目录被编译期钉死成构建时的绝对路径（heif_version.h 的 LIBHEIF_PLUGIN_DIRECTORY）；运行期用 LIBHEIF_PLUGIN_PATH（单数，代码口径）覆盖，配方经 package_info() 的 runenv_info 导出"
    - "CMakeDeps 大小写陷阱：libheif 的 plugin_compilation() 判的是全大写 OPENJPEG_FOUND/OPENJPEG_LIBRARIES/OPENJPEG_INCLUDE_DIRS（宏体 plugins/CMakeLists.txt:2-45，注册在 :86,90），而 config 模式只 set OpenJPEG_*，且 CMakeToolchain 默认 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON → 必须 cmake_find_mode=module + cmake_additional_variables_prefixes=[OPENJPEG]，否则后端被静默跳过（Not compiling 'j2kdec' backend，全程 rc=0）"
    - "依赖复用仓库既有独立包 openjpeg/2.5.4（同上游库另有 openjpeg2/2.5.4，其 cmake_file_name=openjpeg2 命中不了 find_package(OpenJPEG 2)，不要选）"
    - "libheif 1.23.0 的 box.cc 用 C++20 std::ranges::all_of/find；OHOS SDK libc++ 15004 在未定义 _LIBCPP_ENABLE_EXPERIMENTAL 时定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES 把算法藏起来 → 编译失败。配方对 OHOS 加 tc.preprocessor_definitions['_LIBCPP_ENABLE_EXPERIMENTAL']=None 即可（公共头 0 处 std::ranges，无需传播）"
    - "conandata.yml 的 patches 用列表形态（无补丁时写 []）：Conan 2 把 dict 形态当 {version: [条目]}，用文件名当 key 会被静默忽略"
  common_dependencies:
    - openjpeg

# 版本索引（所有已归档版本，含状态）
versions:
  "1.23.0":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libheif-openjpeg/1.23.0"
