# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libheif-openjpeg/1.23.0
homepage: "https://github.com/strukturag/libheif"

# 上游测试命令（父 tarball libheif 1.23.0 的 CTest 入口；本包 BUILD_TESTING=ON，在 build() 内真跑）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure（build() 内；随后逐 <build>/tests/<binary> 取 Catch2 用例汇总行）"

# 上游用例清点（rule4）：主 N 取「用例/注册类」候选口径的最大值，全部口径带单位
upstream_test_counts:
  unit: 217
  integration: 0
  other: 0
  total: 217
  basis: >-
    父 tarball（libheif 1.23.0，sha256 50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a）
    全量注册面。候选口径逐项读数（同单位、不混用）：
    a) Catch2 TEST_CASE 注册数 = 217（tests/*.cc 39 个文件，取数 grep -rho 'TEST_CASE(' tests/*.cc | wc -l
       —— 用例/注册类最大值，即主 N）；
    b) CTest add_test 注册点（全开关上界）= 39（38 个 add_libheif_test + 1 个 add_heifio_test）；
    c) 含用例的测试源文件 = 39；d) tests/*.cc 文件总数 = 41 = 39 个含用例文件 + main.cc +
    test_utils.cc 两个无用例文件（catch_amalgamated.cpp 是 .cpp，不被该 glob 覆盖）；
    e) 断言 REQUIRE*/CHECK* = 3998 + 18 = 4016 —— 属**另一单位**，只披露、不并入 N；
    f) SECTION 5 处、fuzzing add_executable 6 个，均非 CTest 注册单位。
    下界印证：本包配置实际注册 14 个可执行测试（ctest -N）。
  in_surface_scope: "tests/encode_jpeg2000.cc（2 用例，真编码）+ 10 个公开 API 用例 + mini_decode + omaf + tiffdecode，共 14 个注册项"
  in_surface_executed: 37
  in_surface_breakdown: "用例级：PASS 8 / FAIL 6 / SKIP 23（断言 94 属另一单位，只披露）。FAIL 6 全在 region（直接调 heif_context_get_encoder_for_format(AV1) 不经上游跳过助手；AV1 编码后端属兄弟包交付面，aom/svt-av1 制品仓不可得，R36 禁止未发布依赖）；SKIP 23 由上游 get_encoder_or_skip_test(HEVC/AV1) 与 have_decoder 守卫产生。注意 ctest 汇总会因 SKIP_REGULAR_EXPRESSION 把 region 的 6 个 FAIL 掩蔽成 Skipped（ctest 报 100% passed / 0 failed），台账取用例级读数"
  not_run: 180
  harmony_specific: 35

# 上游实际运行的测试程序（本包 BUILD_TESTING=ON，交付面内可编译的用例真跑）
upstream_tests:
  - file: tests/CMakeLists.txt
    source: libheif-1.23.0/tests
    description: >-
      父 tarball 的 tests/CMakeLists.txt 注册 39 个可执行测试（全开关上界）。本包保持上游默认
      WITH_REDUCED_VISIBILITY=ON，且不启用未压缩编码 / HT-J2K(OpenJPH) / 实验特性，
      故实际注册 14 个：encode、encode_grid、entity_groups、extended_type、grid_tile_missing、
      region、tai、text、cxx_wrapper、component_descriptions、encode_jpeg2000（真编码 J2K）、
      mini_decode、omaf、tiffdecode。全部随 conan create 真跑；未注册的注册项按 NOT_RUN 记账，
      逐项归因见 notes.md §6。
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(libheif REQUIRED) + target_link_libraries libheif::libheif（经 CMakeDeps 生成）"
    command: "cmake --configure"
  - file: test_package/test_libheif_openjpeg.c
    description: >-
      显式检查：宿主版本指纹（1.23.0 = 1/23/0）、heif_init、插件搜索目录来自
      LIBHEIF_PLUGIN_PATH、heif_have_decoder_for_format(JPEG2000)==1 与
      heif_have_encoder_for_format(JPEG2000)==1（证明交付的两个插件模块都被宿主装载并注册）、
      HEVC/AV1 后端反证、**JPEG 2000 lossless 真实往返**（自造 64x48 YCbCr 4:2:0 图 →
      lossless 编码 → 写 HEIF → 读回 → 解码回 YCbCr 平面逐像素比对 → ispe 64x48 与保真度
      断言 MAE<=1 / max<=16，实测 0.0395 / 4；另做 RGB 解码的结构判据）、heif_deinit
    command: "./test_libheif_openjpeg"

# 测试断言总数 (test_libheif_openjpeg.c 中 check() 调用数, 用于质量评估)
assertion_count: 35
