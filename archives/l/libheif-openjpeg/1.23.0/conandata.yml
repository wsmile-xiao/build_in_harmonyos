# conandata.yml — libheif-openjpeg 1.23.0
#
# 源码 = 上游 libheif 1.23.0 官方 tag 归档（R39：官方源）。
# 本包是**同一 tarball 内的子模块**：OpenJPEG(JPEG 2000) 编解码后端插件模块，
# 源文件在树内 libheif/plugins/{decoder,encoder}_openjpeg.{cc,h}，由
# libheif/plugins/CMakeLists.txt 的 plugin_compilation(j2kdec/j2kenc …) 生成
# CMake 目标 heif-j2kdec / heif-j2kenc → 产物 libheif-j2kdec.so / libheif-j2kenc.so。
# 版本号取父 tarball 版本（**已合并真先例**：`archives/l/libheif-tools/1.23.0` —— 同一 libheif
# v1.23.0 tarball、同 sha256 50ea4fbd…，已在 upstream/main 合并（合并提交 4498c9732 / !10832）；
# 另见 `archives/l/libhwy_contrib/1.3.0`
# ← highway 1.3.0，父 tarball 内子模块独立成包的已合并先例）。
#
# sha256 为设备实测值（$TASK_DIR/upstream/libheif-1.23.0.tar.gz 上 sha256sum 复算），
# 同批 6+1 个 libheif 子包共用这一个 tarball。

sources:
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"

# 无补丁：本包不需要平台适配补丁。
#   * 依赖 OpenJPEG 本体来自仓库既有独立包 openjpeg/2.5.4（已发布，manifest status=built）；
#   * find_package(OpenJPEG 2) 的命中由配方 generate() 的 CMakeDeps 属性钉住
#     （module 形态 + OPENJPEG 变量前缀），不改上游源码；
#   * 插件目录可移植性由 package_info() 的 runenv_info(LIBHEIF_PLUGIN_PATH) 解决，
#     不改上游 heif_version.h。
patches: []
