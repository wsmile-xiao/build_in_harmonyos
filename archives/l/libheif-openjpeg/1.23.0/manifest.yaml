adaptation_paths:
  - A

knowledge_gained:
  - "libheif 编解码插件子包的交付面三要素（WITH_<CODEC>=ON + WITH_<CODEC>_PLUGIN=ON + ENABLE_PLUGIN_LOADING=ON）与宿主自包含口径；插件模块 DT_NEEDED 宿主、运行期必须由宿主 dlopen 注册" # knowledge_ref: DRAFT-ohos-dlopen-own-dt-needed-closure
  - "插件子包对外部编解码库的依赖声明与版本口径：包名是 codec 名、版本是父 tarball 版本、conandata 用父 tarball 的 URL/sha256；find_package 名 ≠ conan 包名 ≠ 变量前缀大小写，CMakeDeps 必须 cmake_find_mode=module + cmake_additional_variables_prefixes（否则后端被静默跳过、rc=0 假绿）；依赖必须是有配方且已发布 binary 的包（R35/R36）" # knowledge_ref: DRAFT-E620-libheif-plugin-external-codec-dep-and-version-semantics
  - "上游 find_package(<CODEC>) 是交付面的隐性闸：找不到时 libheif 只打一行 Not compiling '<name>' backend 就继续，configure/install 全程 rc=0 —— 必须把「后端真被编译」与「产物真在包里」写成硬判据（日志 Compiling '<name>' as dynamic plugin + package() 存在性自检）" # knowledge_ref: DRAFT-ohos-cmake-recipe-dependency-find-package-gates
  - "OHOS SDK libc++ 15004（clang 15.0.4）在未定义 _LIBCPP_ENABLE_EXPERIMENTAL 时定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES，隐藏 C++20 ranges 算法（ranges_all_of.h:25 整个头体被屏蔽）→ libheif 1.23.0 box.cc 的 std::ranges::all_of/find 编译失败；配方加 tc.preprocessor_definitions['_LIBCPP_ENABLE_EXPERIMENTAL']=None 可解，上游源码零修改、无需补丁，公共头 0 处 std::ranges 故不需传播" # knowledge_ref: DRAFT-ohos-libcxx15-missing-cpp20-ranges-algorithms
  - "OHOS 上必须显式 CMAKE_SYSTEM_NAME=Linux：设备 uname -s=HarmonyOS 而 SDK cmake 只有 Platform/OHOS.cmake，缺 HarmonyOS.cmake 时平台变量留空（CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 为空）→ 宿主共享库不写 SONAME → 插件 MODULE 的 DT_NEEDED 落成含斜杠路径 ../libheif.so（设备实测），按 CWD 解析 → dlopen 失败、后端注册不到（本包 dev-build2 轮 ctest rc=8、tai 与 encode_jpeg2000 两条 REQUIRE 报 3==0）。加该行后宿主得 SONAME libheif.so.1" # knowledge_ref: DRAFT-cmake-harmonyos-platform-soname-flag

  - "OHOS 上 cmake --install 会就地改写 RUNPATH，破坏链接期写入的 ELF 签名 → 装出来的插件 dlopen 报 Permission denied（EACCES，不是 not found），heif_init code=11；只链同构建树 target 的产物被改写（本包两个插件都链 heif），宿主安装前后 sha256 完全相同（只查宿主必误判）。处置=装后重签（llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1，先例 openh264/2.6.0、ffmpeg/8.1.2），并把真 dlopen 写成 package() 硬判据（binary-sign-tool 无 verify 子命令，dlopen 是唯一 oracle）" # knowledge_ref: DRAFT-ohos-signed-so-inplace-rewrite-dlopen-denied