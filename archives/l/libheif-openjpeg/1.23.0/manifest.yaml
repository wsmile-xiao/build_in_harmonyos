# 版本级 manifest — libheif-openjpeg 1.23.0
# 遵循 ARCHIVE-SPEC v3.0

version: "1.23.0"
software: libheif-openjpeg
conan_ref: "libheif-openjpeg/1.23.0"

# published | built | failed | archived
# （O5 口径：只有合并后 release upload 已确认才写 published，此前一律 built）
status: built

build_date: "2026-09-20"
build_system: cmake

source:
  # 上游 libheif 官方 tag 归档（R39：官方源）。本包是同一 tarball 内的子模块，
  # 版本号取父 tarball 版本；同批 6+1 个 libheif 子包共用这一份 tarball。
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.23.0.tar.gz"
  sha256: "50ea4fbd1e19c7b8820271d6d0c73f2623fec5d659ce9fae57e48dbeb94fab9a"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=ON（插件 MODULE 必须与宿主共享同一份 libheif 运行时）"
    - "ENABLE_PLUGIN_LOADING=ON（交付面必需：否则后端静态编入宿主，不产生插件目标）"
    - "WITH_OpenJPEG_DECODER=ON / WITH_OpenJPEG_DECODER_PLUGIN=ON（交付面：heif-j2kdec → libheif-j2kdec.so）"
    - "WITH_OpenJPEG_ENCODER=ON / WITH_OpenJPEG_ENCODER_PLUGIN=ON（交付面：heif-j2kenc → libheif-j2kenc.so）"
    - "WITH_{LIBDE265,X265,X264,KVAZAAR,UVG266,VVDEC,VVENC,AOM_DECODER,AOM_ENCODER,DAV1D,SvtEnc,RAV1E,JPEG_DECODER,JPEG_ENCODER,FFMPEG_DECODER,OpenH264_DECODER,OPENJPH_ENCODER,LIBSHARPYUV}=OFF（18 个非交付面后端显式关闭）"
    - "WITH_UNCOMPRESSED_CODEC=OFF / WITH_WEBCODECS=OFF / WITH_HEADER_COMPRESSION=OFF"
    - "WITH_EXAMPLES=OFF / WITH_EXAMPLE_HEIF_THUMB=OFF / WITH_EXAMPLE_HEIF_VIEW=OFF / WITH_GDK_PIXBUF=OFF / BUILD_DEVELOPMENT_TOOLS=OFF / BUILD_DOCUMENTATION=OFF / WITH_FUZZERS=OFF / ENABLE_COVERAGE=OFF（非交付面：不交付可执行文件 → 不需要 commands.json，R38 不适用）"
    - "BUILD_TESTING=ON（本包配置下可编译的 14 个上游测试目标真跑：ctest --output-on-failure）"
    - "WITH_REDUCED_VISIBILITY=ON（上游默认，已合并的 archives/l/libheif/1.22.2 同口径；代价是需内部符号的 12 个注册项 NOT_RUN，逐项归因见 notes.md §6）"
    - "CMAKE_INSTALL_LIBDIR=lib（把插件目录钉在 <prefix>/lib/libheif，供 LIBHEIF_PLUGIN_PATH 使用）"
    - "CMAKE_SYSTEM_NAME=Linux（仅 OHOS：设备缺 Platform/HarmonyOS.cmake，否则宿主无 SONAME、插件 DT_NEEDED 落成含斜杠路径，见 notes.md §7.2）"
    - "_LIBCPP_ENABLE_EXPERIMENTAL（仅 OHOS：libc++ 15004 缺 C++20 ranges 算法，见 notes.md §7.1）"
  dependencies:
    - openjpeg/2.5.4
  cc: clang (from profile conf tools.build:compiler_executables)
  cxx: clang++ (from profile conf tools.build:compiler_executables)

patches_applied: []

# 平台适配（全部落在配方 generate()/package()，上游源码零修改；见 notes.md §7）
adaptation:
  - "OHOS: CMAKE_SYSTEM_NAME=Linux（补 SONAME，否则插件 DT_NEEDED=../libheif.so）"
  - "OHOS: _LIBCPP_ENABLE_EXPERIMENTAL 编译期宏（libc++ 15004 缺 C++20 ranges 算法）"
  - "OHOS: package() 装后重签插件（cmake --install 就地改写 RUNPATH 会使链接期 ELF 签名失效 → dlopen EACCES）"
  - "CMakeDeps: openjpeg 依赖用 cmake_find_mode=module + cmake_additional_variables_prefixes=['OPENJPEG']（否则 libheif 判 OPENJPEG_FOUND 为假、后端静默跳过）"

# 交付面 = 父 tarball 内 libheif 树的两个 OpenJPEG 插件模块 + 承载它们的宿主
libs:
  - heif
  - libheif-j2kdec.so
  - libheif-j2kenc.so

requires:
  - openjpeg/2.5.4

# 上游测试清点（rule4：主 N 取「用例/注册类」候选口径最大值，全部候选口径带单位披露）
# 取数命令与逐项归因见 notes.md「上游测试清点」与 §6
upstream_test_counts:
  unit: 217
  integration: 0
  other: 0
  total: 217
  basis: "用例/注册口径最大值 = Catch2 TEST_CASE 注册数 217（父 tarball libheif 1.23.0 的 tests/*.cc，取数 grep -rho 'TEST_CASE(' tests/*.cc | wc -l）。同单位候选口径逐项（不混用）：CTest add_test 注册点 39（38 个 add_libheif_test + 1 个 add_heifio_test，全开关上界）、含用例的测试源文件 39、tests/*.cc 文件总数 41 = 39 个含用例文件 + main.cc/test_utils.cc 两个无用例文件（catch_amalgamated.cpp 是 .cpp，不被该 glob 覆盖）；断言 REQUIRE*/CHECK* = 3998+18 = 4016 属**另一单位**，只披露不并入 N；SECTION 5 处、fuzzing 目标 6 个均非注册单位。下界印证：本包配置实际注册 14 个可执行测试（ctest -N）。"
  in_surface_detail: "本包 BUILD_TESTING=ON，14 个可执行测试随 conan create 真机执行；用例级台账 PASS 8 / FAIL 6 / SKIP 23 / 断言 94（另一单位）。FAIL 6 全在 region（直接调 heif_context_get_encoder_for_format(AV1) 而不经上游跳过助手；AV1 编码后端属兄弟包交付面且 aom/svt-av1 制品仓不可得，R36 禁止未发布依赖）；SKIP 23 由上游 get_encoder_or_skip_test(HEVC/AV1) 与 have_decoder 守卫产生。注意：ctest 汇总会因 SKIP_REGULAR_EXPRESSION 把 region 的 6 个 FAIL 掩蔽成 Skipped（ctest 报 100% passed / 0 failed），故台账取用例级读数"
  in_surface_scope: "tests/encode_jpeg2000.cc（2 用例，真编码）+ 本包配置可编译的 10 个公开 API 用例 + mini_decode + omaf + tiffdecode，共 14 个注册项"
  in_surface_executed: 37
  not_run: 180
