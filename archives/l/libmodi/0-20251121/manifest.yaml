  # archives/l/libmodi/0-20251121/notes.md「源码溯源」。
  url: "https://github.com/libyal/libmodi/releases/download/20251121/libmodi-experimental-20251121.tar.gz"
  sha256: "b3c6783c908480711957d9e0e14227c90821be9e90c10f6abe7af1f86ed4bccb"
