build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--disable-python"
    - "--with-libfuse=no"
    - "--enable-static-executables=no"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcaes
    - libcdata
    - libcdirectory
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfguid
    - libfmos
    - libfplist
    - libfvalue
    - libhmac
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 平台适配全部内联在 conanfile.py build()，不新增 patches/ 文件，也不改上游任何 C/H
# 源文件与测试脚本；唯一例外是 OHOS 构建期（在 Conan 缓存副本上）把随包 configure 内
# 2 处 `umask 077` 改为 `022`（HMDFS 必需，E011）——详见 notes.md「R6 声明」。
patches_applied: []

knowledge_gained:
  - "HMDFS 上 autotools configure 的 umask 077 会生成连创建者都无法写入的 0700 临时目录；OHOS 构建期把源码树 configure 内 2 处 umask 077 改为 022 并全程 umask 022 即通过（树内 configure 与 config.status 无需二次替换）"  # knowledge_ref: E011
  - "libyal 发布包 config.sub 已原生接受 linux-ohos 三元组；OHOS 下显式传 --build/--host=aarch64-unknown-linux-ohos（update_configure_args 覆盖语义）即可建出共享库，无需改 config.guess/config.sub"  # knowledge_ref: E007
  - "实验状态 libyal 库的 release 资产名带 -experimental 后缀：tag 20251121 存在但 plain/-alpha 资产名实测 404，实际资产为 libmodi-experimental-20251121.tar.gz；且 libmodi 实为 Mac OS 磁盘镜像格式库（sparse bundle/sparse/UDIF），与名字望文生义的 Microsoft Office Document Imaging (.mdi) 无关——包身份以 README 为准"  # knowledge_ref: DRAFT-E594-libyal-2025-experimental-asset-error-type-koly-fixture
  - "2025+ libyal 公开 API 的 error 类型是本库自有别名（include/libmodi/error.h: typedef intptr_t libmodi_error_t），内嵌 libcerror 类型不在安装面；消费者测试沿用 libcerror_error_t 模板会报 use of undeclared identifier，失败路径只用 libmodi_error_fprint 打印（无公开 error_free）；getter 名先读头文件清单（该库是 get_media_size，不存在 get_image_size）"  # knowledge_ref: DRAFT-E594-libyal-2025-experimental-asset-error-type-koly-fixture
  - "UDIF 签名判定是「头 4 字节或文件末尾 512 字节处 koly 魔数」二选一且 handle_open 惰性解析：512 字节全零+koly 合成文件即可驱动 signature→open→get_media_size→close→free 真实消费者链路（发布包无 tests/input/ 夹具、test_modiinfo.sh 按上游规则 exit 77 SKIP 时的替代验证）；程序级 PASS 证据在 tests/test_*.sh.log 而非 automake 主日志"  # knowledge_ref: DRAFT-E594-libyal-2025-experimental-asset-error-type-koly-fixture
  - "lang-preflight 对「纯 C 库 + 源码根放 pymodi 绑定打包元数据」的 libyal 形态判 mixed→env_unsupported 属假阳性（c:264/268=99% 主体）；三条人工核验（manifest 全文/真实构建入口/配方 --disable-python）成立即继续任务并留证"  # knowledge_ref: DRAFT-libuninameslist-langpreflight-setuptools-binding-misdetect

