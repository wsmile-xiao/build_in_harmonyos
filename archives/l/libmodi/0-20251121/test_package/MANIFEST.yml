package: libmodi/0-20251121
homepage: https://github.com/libyal/libmodi

# 上游测试入口（在 build() 内执行，见 conanfile.py 与 notes.md）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游注册的可执行测试单元（口径：automake 的 TESTS + check_PROGRAMS 两个注册面；
# --disable-python 时 TESTS_PYMODI 条件段不展开）
upstream_tests:
  - name: "test_library.sh"
    source: tests/test_library.sh
    description: "库测试入口：驱动 bands_data_handle / bit_stream / bzip / data_block / deflate / error / handle / huffman_tree / io_handle / notify / sparse_bundle_xml_plist / sparse_image_header / support / system_string / udif_block_table / udif_block_table_entry / udif_resource_file / udif_xml_plist 等 C 测试程序（无 tests/input/ 夹具时按上游逻辑退化为无输入运行）"
    command: "./tests/test_library.sh"
  - name: "test_tools.sh"
    source: tests/test_tools.sh
    description: "工具函数测试入口：驱动 tools_info_handle / tools_output / tools_signal C 测试程序"
    command: "./tests/test_tools.sh"
  - name: "test_modiinfo.sh"
    source: tests/test_modiinfo.sh
    description: "modiinfo 端到端输出测试入口：依赖 tests/input/ 夹具；发布包不含该目录，脚本按上游规则 SKIP（exit 77）"
    command: "./tests/test_modiinfo.sh"
  - name: "check_PROGRAMS (21)"
    source: tests/Makefile.am
    description: "21 个 C 测试程序（bands_data_handle bit_stream bzip data_block deflate error handle huffman_tree io_handle notify sparse_bundle_xml_plist sparse_image_header support system_string tools_info_handle tools_output tools_signal udif_block_table udif_block_table_entry udif_resource_file udif_xml_plist）"
    command: "make check"

test_package_tests:
  - file: test_libmodi.c
    description: "通用消费者断言：版本串（上游 20251121）/访问标志位/codepage 设置与回环/check_file_signature 参数错误与无签名路径/handle 打开错误路径（11 项断言）"
    command: "./test_libmodi"
  - file: test_ohos.c
    description: "鸿蒙专项消费者测试：__OHOS__ 编译目标、TMPDIR 语义（已设置/非 /tmp/存在/可写）、在 TMPDIR 下合成 512 字节 UDIF koly 尾块并走完整读回链路（签名判定==1→initialize→open==1→get_media_size==1 且 size==0→close==0→free==1）（11 项断言）"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  # 计数口径：本列表逐项给出**互不重叠**的消费者测试程序与断言数，
  # assertion_count = test_libmodi.c 的 11 项 + test_ohos.c 的 11 项 = 22。
  - name: "ohos-consumer-tests"
    description: "test_ohos.c（鸿蒙专项消费者测试）：__OHOS__ 编译目标、TMPDIR 语义（已设置/非 /tmp/存在/可写）、在 TMPDIR 下合成 512 字节 UDIF koly 尾块文件并完成「签名判定→打开→media size→关闭释放」真实库调用链路"
    command: "./test_ohos"
    assertions: 11
    platform: OHOS
  - name: "generic-consumer-tests"
    description: "test_libmodi.c（通用消费者断言）：版本串、访问标志位、codepage 设置与回环、check_file_signature 参数错误/文件缺失/无签名三路径、handle_open 打开错误路径（该程序在 OHOS 上同样编译运行，但断言内容不依赖平台特性）"
    command: "./test_libmodi"
    assertions: 11
  - name: "installed-cli-load"
    description: "安装后的 bin/modiinfo -V 必须能加载共享库并输出版本（运行/加载验证，在 test() 内执行；是运行检查，不计断言数）"
    command: "modiinfo -V"
    assertions: 0
    platform: OHOS

assertion_count: 22
