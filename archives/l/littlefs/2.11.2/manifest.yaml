knowledge_gained:
  - "littlefs 上游测试框架（runners/test_runner.h）为给源码定义 feature 宏的机会，显式 #undef _FEATURES_H + #undef _STDIO_H；该机制依赖 glibc 风格可重入头文件，在 OHOS sysroot（musl/OHOS 风格，fpos_t/fdsan 枚举内联）下第二次包含 stdio.h 会重定义 _G_fpos64_t/fdsan 枚举；以 CFLAGS+=-D_STDIO_H 预定义守卫编译可修复（测试运行器专用，不影响 liblfs.a 本身）"
  - "lang-preflight 将 littlefs scripts/ 下 21 个测试/基准工具 python 脚本计入主体，误判 mixed（pcd 68）；按边界规则 D.4『辅助脚本不算主体』人工复核判 cpp，c↔cpp 兼容族不迁移（同 edlib 记录，根因在框架 lang_detect.py）"
  - "littlefs 纯 Makefile 库无 CMake/configure，`make` 默认目标即 liblfs.a（lfs.c + lfs_util.c），CC/AR 从 Conan profile conf 注入（R33），package 用 copy 替代 make install"