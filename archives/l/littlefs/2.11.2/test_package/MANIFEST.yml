package: littlefs/2.11.2
homepage: "https://github.com/littlefs-project/littlefs"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/*.toml (20 suites)
    source: littlefs-2.11.2/tests/
    description: "littlefs 官方自研测试框架（TOML 定义 + test_runner）：文件/目录/断电/坏块/兼容性等 194 个用例、11606 permutations（含 28741 次掉电场景）"
    command: "./scripts/test.py ./runners/test_runner -b -k"

test_package_tests:
  - file: harmonyos_test.c
    description: "Consumer test: 内存块设备上 format/mount/建目录/写读回验/卸载重挂 全流程 + OHOS 平台识别"
    command: "./test_littlefs"

assertion_count: 20
