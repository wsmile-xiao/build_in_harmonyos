# 版本级 manifest — lwprintf 1.1.0

version: "1.1.0"

# 软件名
software: "lwprintf"

# 编译状态: published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-28"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (官方 GitHub tag v1.1.0)
  url: "https://github.com/MaJerle/lwprintf/archive/refs/tags/v1.1.0.tar.gz"

  # 源码校验和 (官方 tag 归档 SHA-256)
  sha256: "43f5053ab9f8bcb375d4f93e54ee31b7296503d72109f8c3b870f42be8954104"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项 (OHOS arm64, R26 静态)
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表 (lwprintf 无第三方依赖)
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-win32-opts-only-on-win32.patch"
  - "0002-portable-upstream-test.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lwprintf 顶层 CMake 无条件使用 win32 专用 dev/lwprintf_opts.h（含 #include windows.h），OHOS 构建需在非 WIN32 回落可移植 lwprintf_opts_template.h"
  - "上游 tests/test.c 的 %p 断言按 32 位指针假设（'Pointer, 32-bit system'），OHOS arm64 64 位指针下 3 项断言长度不一致；库本身无缺陷"
  - "lwprintf 上游无 install() 规则，Conan 配方需手动 copy 头文件与 liblwprintf.a；%K 字节数组格式需 %*K 带长度参数"