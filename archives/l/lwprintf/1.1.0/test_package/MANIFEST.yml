# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lwprintf/1.1.0
homepage: "https://github.com/MaJerle/lwprintf"

# 上游测试命令 (ctest -N / make check 分析)
# lwprintf 的上游测试是 Windows 开发版可执行程序 LwLibPROJECT
# (dev/main.c + tests/test.c + lwprintf_sys_win32.c, 顶层 CMake 构建),
# 依赖 windows.h, 不属于 OHOS 可移植库目标; 可移植用例集合见 descriptions.
upstream_check_command: "ctest -N (LwLibPROJECT, windows-only dev harness)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/test.c
    source: lwprintf-1.1.0/tests/test.c
    description: "lwprintf 核心格式化断言 (test_printf, 170 个 do_test 断言, 经 LwLibPROJECT win32 harness 运行)"
    command: "./LwLibPROJECT (windows-only)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用公开 API lwprintf_snprintf 校验 %s/%d 与 %.2f 格式化输出"
    command: "./test_lwprintf"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 172