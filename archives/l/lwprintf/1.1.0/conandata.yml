patches:
  - patch_file: "patches/0001-win32-opts-only-on-win32.patch"
    patch_description: "Use the win32-specific dev/lwprintf_opts.h (includes windows.h) and WIN32 compile definitions only on native Windows; on other platforms fall back to the portable lwprintf_opts_template.h so the library builds for HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0002-portable-upstream-test.patch"
    patch_description: "Make the upstream test harness portable: include windows.h and the win32 system port (lwprintf_sys_win32.c) only on native Windows so the upstream test_printf assertions in tests/test.c build and run on HarmonyOS"
    patch_type: "portability"
