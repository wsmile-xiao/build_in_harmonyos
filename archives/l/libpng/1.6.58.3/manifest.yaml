knowledge_gained:
  - '选 autotools 而非 CMake：libtool 自管 SONAME libpng16.so.16，避开无版本 SONAME（reference: openharmony-pc-cmake-soname-hmdfs）'
  - '用 POSIX shell 解释 configure，并以 clang -dumpmachine 能力探测值提供 native triplet（reference: knowledge/operations/debug-methodology.md）'
  - '在临时构建副本中放宽 Autoconf 私有 umask，避免 config.status 的 HMDFS setgid 写入失败（reference: E129）'
  - '显式重签测试 ELF，并用 POSIX shell 解释 HMDFS 上的外层与嵌套上游测试脚本（reference: E077）'
  - '当前 1.6.58 在同一冻结快照上通过 36 项上游测试和 1 条 test_package 消费者流（内含 4 条断言）（reference: reports/test-report.md）'
  - '删除真实元数据文件后继续识别并删除悬空别名 symlink（reference: E2152-draft-2301）'

package_contract:
  libraries: ['png16']
  pkg_config: ['libpng16.pc', 'libpng.pc']
  headers: ['png.h']
