software: libpng
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.39/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.39"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统（verify-build 要求的字段）
build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"
compile_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/libpng/libpng16/1.6.39/libpng-1.6.39.tar.gz"

  # 源码校验和
  sha256: "af4fb7f260f839919e5958e5ab01a275d4fe436d45442a36ee62f73e5beb75ba"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$HOME/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_C_COMPILER=clang"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_C_FLAGS=-fuse-ld=bfd"
    - "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=bfd -Wl,-rpath,$HOME/usr/local/lib"
    - "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=bfd -Wl,-rpath,$HOME/usr/local/lib"
    - "-DCMAKE_INSTALL_RPATH=$HOME/usr/local/lib"
    - "-DPNG_TESTS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
