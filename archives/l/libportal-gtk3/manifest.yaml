software: libportal-gtk3
display: "libportal-gtk3"
description: "GTK3 backend of libportal — XDG desktop portal integration for GTK3 applications"
category: desktop
homepage: "https://github.com/flatpak/libportal"
license: LGPL-3.0-only
build_system: meson

ohos_adaptation:
  key_points:
    - "上游同仓多后端（meson feature 选项 backend-gtk3/gtk4/qt5/qt6），本件只启用 gtk3 后端，其余全 disabled"
    - "主库在源码树内一起编译，package() 剔除主件产物（libportal.so*/libportal.pc/include/libportal/）只交付 gtk3 后端——与 libportal/0.10.0 主件包跨账号同链分工（#13396/#13397）"
    - "gtk broadway 后端下 GDK_WINDOWING_X11/WAYLAND 均 #undef，上游 portal-gtk3.c 的 X11/Wayland 分支被条件编译自然剔除，零平台补丁"
    - "gio-unix-2.0.pc 由 glib 包内真实 pc 复制改 prefix（cpdb-libs 模式）；glib_mkenums/glib_genmarshal/gdbus_codegen 工具变量注入 pc（accountsservice 模式）"
    - "上游 81 pytest 用例（dbus+dbusmock 框架）全量豁免：OHOS 无 D-Bus session bus（无 machine-id），xdp_portal_new 实测 abort"
  common_dependencies:
    - gtk
    - glib
    - libportal

versions:
  - version: "0.10.0"
    status: built
    date: "2026-09-15"
    notes: "首个适配版本；等待 libportal/0.10.0 主件发布后接 CI"
