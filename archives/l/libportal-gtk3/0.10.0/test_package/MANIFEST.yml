package: libportal-gtk3/0.10.0
homepage: "https://github.com/flatpak/libportal"

upstream_check_command: "meson test --list"

upstream_test_in_build: false
upstream_test_command: "meson test -C build --suite pyportaltest"

upstream_tests:
  - file: tests/pyportaltest/test_inputcapture.py
    source: libportal-0.10.0/tests/pyportaltest/test_inputcapture.py
    description: "pytest+dbusmock input capture portal tests (35 cases)"
    command: "pytest-3 tests/pyportaltest/test_inputcapture.py"
  - file: tests/pyportaltest/test_notification.py
    source: libportal-0.10.0/tests/pyportaltest/test_notification.py
    description: "pytest+dbusmock notification portal tests (13 cases)"
    command: "pytest-3 tests/pyportaltest/test_notification.py"
  - file: tests/pyportaltest/test_remotedesktop.py
    source: libportal-0.10.0/tests/pyportaltest/test_remotedesktop.py
    description: "pytest+dbusmock remote desktop portal tests (19 cases)"
    command: "pytest-3 tests/pyportaltest/test_remotedesktop.py"
  - file: tests/pyportaltest/test_screencast.py
    source: libportal-0.10.0/tests/pyportaltest/test_screencast.py
    description: "pytest+dbusmock screencast portal tests (6 cases)"
    command: "pytest-3 tests/pyportaltest/test_screencast.py"
  - file: tests/pyportaltest/test_wallpaper.py
    source: libportal-0.10.0/tests/pyportaltest/test_wallpaper.py
    description: "pytest+dbusmock wallpaper portal tests (8 cases)"
    command: "pytest-3 tests/pyportaltest/test_wallpaper.py"

test_package_tests:
  - file: test.c
    description: "Consumer test: calls xdp_parent_new_gtk + XdpParent vtable verification (no display needed)"
    command: "./test_libportal_gtk3"

assertion_count: 5
