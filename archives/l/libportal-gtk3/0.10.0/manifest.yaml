version: "0.10.0"
software: "libportal-gtk3"
status: built
build_date: "2026-09-15"
conan_ref: "libportal-gtk3/0.10.0"
build_system: "meson"
source:
  url: "https://github.com/flatpak/libportal/archive/refs/tags/0.10.0.tar.gz"
  sha256: "e1b6913c6d9015bfa918ace86f82c30940982add97aed9c18cc929c5327054fd"
  tar_format: tar.gz
build:
  system: meson
  configure_options:
    - "-Dbackend-gtk3=enabled"
    - "-Dbackend-gtk4=disabled"
    - "-Dbackend-qt5=disabled"
    - "-Dbackend-qt6=disabled"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Ddocs=false"
    - "-Dtests=false"
    - "-Dportal-tests=false"
  dependencies:
    - gtk/3.24.43
    - libportal/0.10.0
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "libportal 上游同仓多后端（meson feature 选项 backend-gtk3/gtk4/qt5/qt6 控制产出），本件只启用 gtk3 后端"
  - "主库 libportal 在同一源码树内一起编译（meson declare_dependency 内部 target 依赖），构建期不需要外部 libportal 包；运行期 NEEDED libportal.so.1 由 libportal/0.10.0 主件包提供（跨账号同链分工，package() 阶段剔除主件产物避免双包冲突）"
  - "gtk broadway 后端下 gdkconfig.h 的 GDK_WINDOWING_X11/WAYLAND 均 #undef，上游 portal-gtk3.c 的 X11/Wayland 分支被条件编译自然剔除，零平台补丁"
  - "glib/2.84.0.1 配方未声明 gio-unix 组件，PkgConfigDeps 不产出 gio-unix-2.0.pc；从 glib 包内真实 pc 复制并改写 prefix（cpdb-libs 模式）"
  - "gnome.mkenums 需要 glib-2.0.pc 的 glib_mkenums/glib_genmarshal 变量与 gio-2.0.pc 的 gdbus_codegen 变量；glib 包 bin/ 的 python3 脚本直接以绝对路径注入（accountsservice 模式）"
  - "test_package 运行需手动把依赖 lib 目录 + /system/lib64 注入 LD_LIBRARY_PATH（alkimia 先例）；xdp_portal_new 在无 D-Bus machine-id 的机器上 abort，消费者测试只能用 xdp_parent_new_gtk（纯内存操作）"
upstream_tests:
  framework: "pytest + dbus + dbusmock"
  registered_cases: 81
  detail:
    test_inputcapture.py: 35
    test_notification.py: 13
    test_remotedesktop.py: 19
    test_screencast.py: 6
    test_wallpaper.py: 8
  local_run_attempt: "CI 离线 + OHOS 无 D-Bus session bus；pytest 需 python-dbus/dbusmock/PyGObject 且 dbus-daemon 生成 session bus 依赖 machine-id——OHOS /var/lib/dbus/machine-id 与 /etc/machine-id 均不存在（xdp_portal_new 实测 abort: Cannot spawn a message bus without a machine-id）。81 用例全量豁免：环境限制（无 D-Bus daemon），逐文件技术原因与实测证据见 PR 正文"
