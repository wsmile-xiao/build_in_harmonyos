software: libaemu
display: "libaemu"
version: "0.1.2"
upstream_name: aemu
upstream_version: "0.1.2"
status: built
build_system: cmake
compile_date: 2026-09-25
target_platform: aarch64-unknown-linux-ohos
issue: TBD

source:
  method: "git-clone (pinned commit, Tsinghua AOSP mirror first, official googlesource fallback)"
  git_urls:
    - "https://mirrors.tuna.tsinghua.edu.cn/git/AOSP/platform/hardware/google/aemu"
    - "https://android.googlesource.com/platform/hardware/google/aemu"
  git_commit: "dd8b929c247ce9872c775e0e5ddc4300011d0e82"
  git_tag: "v0.1.2-aemu-release"
  note: >-
    The old +archive tarball URL was dropped 2026-09-25: Gitiles regenerates
    the gzip per request (423118 B/a69bf040… then 423321 B/00deeca3… same
    day), so a pinned tarball sha256 rots; the tag archive serves the
    dd8b929c tree, verified blob-identical to the Tsinghua mirror commit.

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DAEMU_COMMON_BUILD_CONFIG=gfxstream"
    - "-DAEMU_COMMON_GEN_PKGCONFIG=ON"
    - "-DENABLE_VKCEREAL_TESTS=ON"
    - "-DAEMU_BASE_USE_LZ4=OFF"
    - "-DAEMU_COMMON_USE_PERFETTO=OFF"
  dependencies:
    - gtest/1.17.0#ab1bc3bf51522490eef07a83c2dbd203
    - pkgconf/3.0.5 (tool_requires, provides pkg-config for upstream third-party/CMakeLists.txt find_package(PkgConfig))
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  upstream_check_command: "ctest -N / ctest --output-on-failure"
  upstream_test_in_build: true
  upstream_tests:
    - name: "aemu-base_unittests (80 gtest cases)"
      description: "AlignedBuf 6, HealthMonitor 25 (9 TEST + 16 TEST_F), ArraySize 2, LayoutResolver 2, LruCache 1, ManagedDescriptor 4, Optional 13, ring_buffer 11 (incl 1 DISABLED), StringFormat 7, SubAllocator 4, TypeTraits 3, WorkerThread 2"
      result: "pending-device-run"
    - name: "aemu-host-common_unittests (44 gtest cases)"
      description: "address_space_graphics 10 TEST_F, address_space_host_memory_allocator 5, address_space_shared_slots 5, HostAddressSpace 9 TEST_F, HostmemIdMapping 3, logging 9, GfxstreamFatalError 3"
      result: "pending-device-run"
  upstream_test_notes: >-
    Upstream tests are opt-in via ENABLE_VKCEREAL_TESTS=ON (default OFF in
    rebuild.sh). Counting method is gtest_macros over the 19 unittest sources
    wired by build-config/gfxstream (12 base + 7 host-common): 80 + 44 = 124.
    ctest registers each gtest case via gtest_discover_tests (PRE_TEST mode).
    Counts verified by findstr against tag tarball 2026-09-25. Device execution
    pending HMBS preflight; numbers in test_package/MANIFEST.yml are authoritative.

validation:
  local:
    - "Source tarball downloaded via curl (423118 bytes) and SHA256 verified with certutil"
    - "Source identity switched 2026-09-25 from +archive tarball to pinned git commit dd8b929c (Tsinghua first): tarball bytes verified non-deterministic, tag archive verified == dd8b929c tree (411 files, blob SHAs match)"
  - "Tarball contents audited: CMakeLists.txt, base/, host-common/, snapshot/, build-config/gfxstream, third-party/"
    - "TEST/TEST_F macros counted per unittest source (base 80 + host-common 44 = 124)"
    - "Python AST syntax check for conanfile.py and test_package/conanfile.py pending device round"
  remote:
    - "pending"
  pending:
    - "HMBS device preflight (conan create + ctest 124 + test_package)"
    - "Remote scoped CI run"

knowledge_gained:
  - "AEMU top-level CMake requires -DAEMU_COMMON_BUILD_CONFIG=gfxstream, otherwise the AEMU_COMMON_BUILD_CONFIG guard mis-evaluates."
  - "Upstream tests are VKCEREAL-gated and found via pkg_search_module(gtest/gmock); Conan must provide them through PkgConfigDeps."
  - "googlesource +archive tarballs are gzip-non-deterministic per request: pin the immutable git commit instead of a tarball sha256."
