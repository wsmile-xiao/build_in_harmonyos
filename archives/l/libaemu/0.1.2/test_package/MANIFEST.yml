# test_package/MANIFEST.yml — libaemu 0.1.2
# Upstream and consumer test declaration required by CI L0e.

package: libaemu/0.1.2
homepage: "https://android.googlesource.com/platform/hardware/google/aemu"

upstream_tests_exist: true
upstream_test_audit:
  source_commit: "dd8b929c247ce9872c775e0e5ddc4300011d0e82 (v0.1.2-aemu-release release content; Tsinghua AOSP mirror first, official googlesource fallback; blob-verified identical to the official tag tarball 2026-09-25)"
  source_note: "The old +archive tarball sha256 a69bf040… rotted (same URL served different bytes hours apart); the immutable git commit is the stable source identity."
  build_system: "CMake 3.18+, gfxstream build-config"
  test_definition: >
    Upstream tests are opt-in via ENABLE_VKCEREAL_TESTS=ON (default OFF in
    rebuild.sh). With the flag on, base/CMakeLists.txt builds
    aemu-base_unittests from 12 unittest sources and
    host-common/CMakeLists.txt builds aemu-host-common_unittests from 7
    unittest sources; each gtest case is registered with ctest through
    gtest_discover_tests (PRE_TEST mode). The recipe turns the flag ON and
    runs ctest --output-on-failure in build().
  test_files: >
    base: AlignedBuf_unittest.cpp, HealthMonitor_unittest.cpp,
    ArraySize_unittest.cpp, LayoutResolver_unittest.cpp,
    LruCache_unittest.cpp, ManagedDescriptor_unittest.cpp,
    Optional_unittest.cpp, ring_buffer_unittest.cpp,
    StringFormat_unittest.cpp, SubAllocator_unittest.cpp,
    TypeTraits_unittest.cpp, WorkerThread_unittest.cpp;
    host-common: address_space_graphics_unittests.cpp,
    address_space_host_memory_allocator_unittests.cpp,
    address_space_shared_slots_host_memory_allocator_unittests.cpp,
    HostAddressSpace_unittest.cpp, HostmemIdMapping_unittest.cpp,
    logging_unittest.cpp, GfxstreamFatalError_unittest.cpp.
  count_method: >
    ctest_entries: `ctest -N` registration under ENABLE_VKCEREAL_TESTS=ON
    (gtest_discover_tests PRE_TEST). Device and desktop agree on 123
    entries: base 79 (80 TEST/TEST_F macros minus 1 upstream DISABLED_
    ring_buffer ProducerDrivenSync, excluded by gtest itself on every
    platform) + host-common 44. Source-macro audit (findstr 2026-09-25)
    finds 124 macros; the DISABLED_ one never registers, so the runner
    total 123 is the official registration count, not a machine subset.
    Base file list unchanged (AlignedBuf 6, HealthMonitor 25, ArraySize 2,
    LayoutResolver 2, LruCache 1, ManagedDescriptor 4, Optional 13,
    ring_buffer 11 macros incl 1 DISABLED, StringFormat 7, SubAllocator 4,
    TypeTraits 3, WorkerThread 2); host-common 44 (address_space_graphics
    10 TEST_F, host_memory_allocator 5, shared_slots 5, HostAddressSpace 9
    TEST_F, HostmemIdMapping 3, logging 9, GfxstreamFatalError 3).
  dependency: >
    gtest/gmock provided by Conan test_requires
    gtest/1.17.0#ab1bc3bf51522490eef07a83c2dbd203 (ohpcd hardened RREV,
    no cmake tool_requires) through PkgConfigDeps (.pc), consumed by
    upstream pkg_search_module.
  portability_changes: []
  disabled_note: >
    ring_buffer DISABLED_ProducerDrivenSync is an upstream gtest DISABLED_
    case (1 of 124 source macros). gtest excludes DISABLED_ from default
    execution and gtest_discover_tests does not register it, so `ctest -N`
    reports 123 on every platform (base 79 + host-common 44). The 2026-09-26
    device preflight reports discovered=123 executed=122 passed=122 failed=0
    skipped=1; the single skipped entry is the ctest Disabled/Skipped line
    for the DISABLED_ family, covered by one gaps entry summing to
    total-passed=1 with marker status "incomplete" (failed=0, no real
    failure).

upstream_check_command: "ctest -N + ctest --output-on-failure (ENABLE_VKCEREAL_TESTS=ON)"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure, executed inside conan build() on device"

upstream_tests:
  - test_name: "aemu-base_unittests"
    source: "base/*_unittest.cpp (12 files)"
    kind: "gtest-suite"
    cases: 79
    command: "ctest -R aemu-base_unittests"
    comparison: "ctest per-test Passed lines"
  - test_name: "aemu-host-common_unittests"
    source: "host-common/*unittest*.cpp (7 files)"
    kind: "gtest-suite"
    cases: 44
    command: "ctest -R aemu-host-common_unittests"
    comparison: "ctest per-test Passed lines"

upstream_test_total: 123
upstream_test_count_method: "ctest_entries"
upstream_test_passed: 122
upstream_test_failed: 0
upstream_test_skipped: 1
upstream_test_not_run: 0
upstream_test_suites_total: 2
upstream_test_suites_passed: 2
upstream_excluded_note: >
  No exclusions. Total 123 is the ctest registration count (base 79 +
  host-common 44); the 124th source macro is the upstream DISABLED_ case
  excluded by gtest on all platforms, not an OHOS skip. Device run reports
  discovered=123 executed=122 passed=122 failed=0 skipped=1; the single
  gaps entry (count=1) sums to total-passed=1. ctest per-test lines are the
  deterministic source.

test_package_tests:
  - file: test_libaemu.cpp
    scenario: "consumer-api"
    description: >
      Build and run a Conan consumer that links libaemu::libaemu and calls
      the real aemu-base StringFormat API (StringFormatRaw, templated
      StringFormat with std::string unpacking, StringAppendFormatRaw,
      StringAppendFormat), 12 checks with a parsed SUMMARY trailer.
    command: "./test_libaemu"
    assertions: 12

assertion_count: 12
