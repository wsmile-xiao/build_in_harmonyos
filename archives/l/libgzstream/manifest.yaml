software: libgzstream
display: "libgzstream"
description: "C++ iostream classes wrapping the zlib compression library"
category: compress
homepage: "https://github.com/kanedo/gzstream"
license: LGPL-2.1-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "使用 -idirafter 解析 gzstream.h，避免源码根目录 version 文件遮蔽 libc++ 标准头"
    - "保持上游静态库产物，并通过 Conan 传递 zlib 公共依赖"
    - "执行上游 2 项 gzip 互操作测试和 1 项 HarmonyOS 消费者测试"
  common_dependencies:
    - zlib

versions:
  "1.5-git20171107.9a20658":
    status: built
    build_date: "2026-09-15"
