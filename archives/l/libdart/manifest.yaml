software: libdart
display: "libdart (Dart)"
description: "A high performance, network optimized, binary JSON protocol and high-level C++ library"
category: data
homepage: "https://github.com/target/libdart"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Header-only C++14 库（公开头文件依赖 gsl::span，requires ms-gsl/4.2.1）"
    - "conanfile generate() 双路注入：CMAKE_INCLUDE_PATH/LIBRARY_PATH 供上游 find_path/find_library 探测，CMAKE_CXX_FLAGS -I 供 #include 编译"
    - "CMakeToolchain 无 cxxflags 属性，需 tc.variables 注入编译器标志"
    - "CMake>=4 拒绝 cmake_minimum_required(<3.5)，注入 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "codeload URL 无扩展名，conandata 显式 filename 才能被 conan get() 正确解压"
  common_dependencies:
    - ms-gsl/4.2.1

versions:
  "1.4.0":
    status: built
    build_date: "2026-09-27"