  - "codeload URL 无扩展名时 conan get() 需显式 filename 才能正确解压 tar.gz（E276/E392/E483）"
  - "CMake 4.x 下 cmake_minimum_required(<3.5) 需注入 CMAKE_POLICY_VERSION_MINIMUM=3.5（DRAFT-E321）"