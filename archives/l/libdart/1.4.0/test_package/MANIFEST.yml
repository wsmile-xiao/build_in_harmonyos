# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdart/1.4.0
homepage: "https://github.com/target/libdart"

# 上游测试命令 (ctest -N 实测)
upstream_check_command: "ctest --test-dir build -N"

# conanfile.py build() 方法中已集成上游测试 (243 用例全量)
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir {build_folder} --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: unit_tests
    source: libdart-1.4.0/test/*_unit_tests.cc
    description: "C++14 核心 API 单元测试 (170 TEST_CASE/SCENARIO)"
    command: "./unit_tests"
  - file: json_test
    source: libdart-1.4.0/test/json_test.cc
    description: "RapidJSON 互操作 JSON 测试 (2 TEST_CASE)"
    command: "./json_test"
  - file: yaml_test
    source: libdart-1.4.0/test/yaml_test.cc
    description: "libyaml 互操作 YAML 测试 (1 TEST_CASE)"
    command: "./yaml_test"
  - file: abi_tests
    source: libdart-1.4.0/test/*_abi_unit_tests.cc
    description: "C89 ABI 层测试 (70 TEST_CASE/SCENARIO)"
    command: "./abi_tests"

# test_package 中自带的测试 (消费者视角验证，真实调用公开 API)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：parse/取值/to_json 公开 API 往返验证"
    command: "./test_libdart"

# 测试断言总数 (上游 243 + 消费者 5 项校验)
assertion_count: 248