# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libxkbcommon/1.8.0
homepage: "https://github.com/xkbcommon/libxkbcommon"

# 上游测试命令：meson test（keysym/keymap/context 等测试套件）
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的测试程序（meson test 自动发现，tests/ 目录）
upstream_tests:
  - file: test/keysym.c
    description: "XKB keysym 查询单元测试（test-keysym）"
    command: "meson test keysym"
  - file: test/keymap.c
    description: "XKB keymap 解析单元测试（test-keymap）"
    command: "meson test keymap"
  - file: test/context.c
    description: "XKB context 单元测试（test-context）"
    command: "meson test context"
  - file: test/rules-file.c
    description: "XKB rules 文件解析单元测试（test-rules-file）"
    command: "meson test rules-file"
  - file: test/stringcomp.c
    description: "XKB keymap 字符串编译单元测试（test-stringcomp）"
    command: "meson test stringcomp"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_libxkbcommon.sh
    description: "验证 libxkbcommon 产物完整（xkbcommon.h/libxkbcommon.so/xkbcommon.pc 存在，3 个断言）"
    command: "bash test_libxkbcommon.sh <pkg_dir>"
  - file: conanfile.py
    description: "验证 include/xkbcommon/xkbcommon.h 存在（1 个断言）"
    command: "conan test"

# 测试断言总数：上游 meson test 测试套件（5 个代表用例全过），test_package 4 个断言
assertion_count: 9
