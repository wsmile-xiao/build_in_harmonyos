# 软件级 manifest
# 文件位置: archives/l/libkcompactdisc/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: libkcompactdisc

# 显示名
display: "KCompactDisc"

# 一句话描述
description: "KDE Gear 库，提供 CD-ROM 光驱接口（音频 CD 播放、碟片状态与音轨控制），产出 libKCompactDisc6.so"

# 分类标签
category: library

# 官网 URL
homepage: "https://invent.kde.org/multimedia/libkcompactdisc"

# 开源许可证（SPDX 标识）
license: LGPL-2.0-or-later AND GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
  - "KF_IGNORE_PLATFORM_CHECK=TRUE 绕过 KDE 平台检测（OHOS 不在 KDE 平台列表）"
  - "E092：注入 CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG；因 conan 进程树被 HMDFS 拒绝 symlink()，需去掉 VERSION/SOVERSION 属性（产物为未版本化单文件）"
  - "Qt6DBus 平台未发布（qtbase FEATURE_dbus=OFF），DBus 消费点需可选化（WITH_QTDBUS）"
  - "KDE 依赖包（qtbase/solid/ki18n/phonon4qt6）均 cmake_find_mode=none，需手工 conan_cmakedeps_paths.cmake"
  - "wmlib 平台层使用 plat_linux.c（sysroot 有 linux/cdrom.h），音频后端由宏守卫（HAVE_ALSA/USE_ARTS/sun）"
  - "无 CD-ROM 硬件：光驱枚举返回空列表，属预期行为"

  # 跨版本通用依赖
  common_dependencies:
  - qtbase
  - solid
  - ki18n
  - phonon4qt6
  - alsa-lib
  - ecm

# ============================================================
# 版本索引
# ============================================================

versions:
  "25.12.1":
    status: published
    build_date: 2026-09-24
