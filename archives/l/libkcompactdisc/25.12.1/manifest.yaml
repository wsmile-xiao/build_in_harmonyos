- "0002-src-CMakeLists.txt.patch (feature+适配: Qt::DBus 链接/HAVE_QTDBUS 定义条件化；移除 VERSION/SOVERSION 属性绕过 HMDFS symlink 限制)"
- "0003-src-kcompactdisc.cpp.patch (feature: urlToDevice 的 mediamanager DBus 调用用 HAVE_QTDBUS 守卫，无 DBus 时回退原始设备路径)"

# ============================================================
# 知识沉淀
