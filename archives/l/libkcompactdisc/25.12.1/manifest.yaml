# 编译中学到的知识
knowledge_gained:
- "KDE Gear 首个 release-service 包：KF_IGNORE_PLATFORM_CHECK=TRUE 绕过 KDE 平台检测"
- "E092 SONAME 修复：注入 CMAKE_SHARED_LIBRARY_SONAME_{C,CXX}_FLAG（CMAKE_SYSTEM_NAME=HarmonyOS 无平台模块）"
- "conan(python3) 进程树后代全部被 HMDFS/SELinux 拒绝 symlink()，带 VERSION/SOVERSION 的 CMake 目标本地必败：必须去属性改用单一未版本化文件"
- "OHOS clang-15 对 -Wl,a,b 不拆分逗号，避免 LINKER:SHELL 多参形式，soname 统一走 E092 平台变量注入"
- "qtbase/solid/ki18n/phonon4qt6 均 cmake_find_mode=none，必须手工生成 conan_cmakedeps_paths.cmake"
- "ki18n_install(po) 依赖 ki18n 包内已打补丁的 KF6I18nMacros（Gettext QUIET + python fallback）"
- "alsa-lib CMakeDeps 生成 ALSA::ALSA，src/CMakeLists 的 find_package(ALSA) 走 config 模式命中"

