# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libkcompactdisc/25.12.1
homepage: "https://invent.kde.org/multimedia/libkcompactdisc"

# 上游测试命令
upstream_check_command: "ctest -N (no tests registered in CTest)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 清点结论 (R51): 上游源码树 libkcompactdisc-25.12.1 有 tests/ 目录，
# 仅 1 个测试程序 tests/testkcd.cpp，但 tests/CMakeLists.txt 未调用
# add_test()，ctest -N 注册数为 0。testkcd 为手动运行程序（QCoreApplication
# + KCompactDisc 实例，打印音频系统/光驱设备/碟片状态后退出）。
# 本适配已真实构建并运行该程序（aarch64 真机，qtbase libexec/moc + clang++
# 编译，LD_LIBRARY_PATH 指向 conan 依赖包）：退出码 0，输出 2 个音频系统
# (phonon/alsa，HAVE_ALSA 生效)、0 个光驱（无硬件预期）、
# discStatus=4(Nodisc)、tracks=0，无光驱环境下安全退出。
upstream_tests:
  - file: tests/testkcd.cpp
    registered_in_ctest: false
    description: "实例化 KCompactDisc（Asynchronous 模式），打印 audioSystems/cdromDeviceNames/discStatus/tracks 等运行时状态后退出"
    command: "./testkcd（手动运行，非 ctest）"
    result: "PASS（exit 0；2 audio systems / 0 cdrom drives / status=Nodisc）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_kcompactdisc.cpp
    description: "消费者链接 libKCompactDisc6.so 并调用 KCompactDisc 公开 API（audioSystems/defaultCdromDeviceName/cdromDeviceNames/urlToDevice）"
    command: "./test_kcompactdisc"

# 测试断言总数
assertion_count: 4
