package: libfile-fnmatch-perl/0.02
homepage: "https://metacpan.org/pod/File::FnMatch"

upstream_test_in_build: false

upstream_tests:
  - name: t/（01use.t + 10use_fnmatch.t——tar tzf 核验）
    count: "2"
    description: "上游测试实测回填（rule 4）——t/ 2 个 .t 测试文件——如实"

test_package_tests:
  - file: test_file_fnmatch_perl.py
    description: >-
      R34 分层验证：L1 产物 + ELF ABI 契约（导出 boot_File__FnMatch /
      引用 Perl_xs_handshake 与 libc fnmatch / NEEDED 仅 libc.so，含阴性
      对照）；L2 `perl -c` 解析随包 .pm（真实进程）；L3 真实 dlopen 加载
      XS 并调用 fnmatch() 校验语义。L3 若被沙箱拒绝（SELinux 域禁止对用户
      .so 做 mmap PROT_EXEC，见 PR #6846 08-30 说明）则如实报 SKIP 并打印
      原文与 errno——绝不静默计为通过；FNMATCH_REQUIRE_XS_LOAD=1 可将其
      升级为 FAIL。
    command: "python3 test_file_fnmatch_perl.py <package>"

assertion_count: 9
