software: libcapi20
display: "libcapi20"
description: "User space implementation of the CAPI 2.0 interface (ISDN/telephony) with loadable driver modules"
category: network
homepage: https://github.com/leggewie-DM/libcapi20
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "Driver plugins are dlopen()-ed from the compile time LIBDIR; a packaged library must relocate them via CAPI20_MODULE_DIR (patch 0003), exported by runenv_info."
    - "compat/byteswap.h required glibc-only <features.h>/<bits/byteswap.h>; made self-contained (patch 0002)."
    - "configure probes a umask 077 temp dir which HMDFS cannot honour; umask lowered to 022 (patch 0001)."
    - "CONFIG_SHELL=bash is required: the HiShell /bin/sh cannot run configure's print and libtool probes."
    - "The plugin modules use -module -no-undefined, so the package keeps the upstream shared+static default."
    - "The library artefact is libcapi20.so.3 and is consumed with -lcapi20."
  common_dependencies: []

versions:
  "3.27":
    status: built
    build_date: "2026-09-15"
    conan_ref: libcapi20/3.27
    patches: 3
