package: libcapi20
software: libcapi20
version: "3.27"
homepage: "https://github.com/leggewie-DM/libcapi20"
license: GPL-2.0-only
status: built
build_system: autotools
build_date: "2026-09-15"

source:
  url: "https://deb.debian.org/debian/pool/main/libc/libcapi20-3/libcapi20-3_3.27.orig.tar.bz2"
  sha256: "d8e423d5adba1750f511a2c088296db2a8a2e1e9209401871b01ce411d8ac583"

build:
  system: autotools
  configure_options:
    - "--prefix=<conan package folder> (only parameter used, R1)"
  dependencies: []

patches_applied:
  - "0001-configure-hmdfs-umask.patch"
  - "0002-compat-byteswap-portable.patch"
  - "0003-runtime-module-dir-override.patch"

upstream_tests:
  command: "none"
  test_count: 0
  notes: "Upstream 3.27 ships no test suite: Makefile.am declares no TESTS target and the release archive contains no test sources or check scripts. There is therefore no upstream test case to run or to preserve."

test_package:
  test_count: 2
  assertion_count: 21
  description: "Two adaptation test executables (upstream had none). test.c exercises the CAPI 2.0 codec and library accessors (6 cases / 17 assertions); test_ohos.c verifies the HarmonyOS specific parts of the adaptation through the platform loader (3 cases / 4 assertions)."

knowledge_gained:
  - "ref: E114/E118 - configure probes mktemp -d under umask 077; HMDFS ignores the mode change, so the probe dir is unwritable and configure fails. Patch the umask to 022."
  - "ref: E-module-loading - libcapi20 dlopen()s its driver plugins from the compile time LIBDIR; a packaged library must not depend on that absolute path. Add a CAPI20_MODULE_DIR override and export it through runenv_info."
  - "ref: E-glibc-headers - compat/byteswap.h included glibc-only <features.h>/<bits/byteswap.h>; HarmonyOS has no glibc headers, so the file must carry its own implementation."
