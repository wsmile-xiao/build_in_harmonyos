# test_package/MANIFEST.yml
# 测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcapi20/3.27
homepage: "https://github.com/leggewie-DM/libcapi20"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 3.27 无测试套件：Makefile.am 未声明 TESTS，发布包内无测试源码或 check 脚本
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "CAPI 2.0 报文编解码与库状态访问器（6 用例 / 17 断言）"
    command: "./test_libcapi20"
  - file: test_ohos.c
    description: "鸿蒙平台特有：驱动插件目录重定位与 dlopen 加载（3 用例 / 4 断言）"
    command: "./test_libcapi20_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 21
