package: libxls/1.6.3
homepage: "https://github.com/libxls/libxls"

upstream_check_command: "make check, then explicit test2_libxls and test_cpp execution"
upstream_test_in_build: true
upstream_test_command: "make check && ./test2_libxls test/files/test2.xls && ./test_cpp test/files/test2.xls"

upstream_tests:
  - file: test/test.c
    description: "Registered Automake regression that parses and renders the bundled test2.xls workbook"
    command: "make check"
  - file: test/test2.c
    description: "Upstream parser diagnostic built but not registered in TESTS; executed explicitly with test2.xls"
    command: "./test2_libxls test/files/test2.xls"
  - file: "cplusplus/main.cpp, cplusplus/XlsReader.cpp"
    description: "Upstream C++ wrapper test built but not registered in TESTS; executed explicitly with test2.xls"
    command: "./test_cpp test/files/test2.xls"

test_package_tests:
  - file: test_libxls.c
    description: "Consumer validation of version API, buffer API, error reporting, compile, and static link"
    command: "./test_libxls"

upstream_source_count: 3
upstream_registered_count: 1
upstream_executed_count: 3
upstream_passed_count: 3
consumer_test_count: 1
consumer_passed_count: 1
verified_test_count: 4
