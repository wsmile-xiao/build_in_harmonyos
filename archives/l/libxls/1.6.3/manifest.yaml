knowledge_gained:
  - "libxls 1.6.3 has no third-party Conan dependencies; AM_ICONV resolves against the HarmonyOS platform C library."
  - "Only test_libxls is registered in Automake TESTS; test2_libxls and test_cpp are built but must be executed explicitly with the bundled test2.xls fixture for complete upstream coverage."
