# conandata.yml — libgsasl-tools 2.2.4
# 上游: https://www.gnu.org/software/gsasl/
# 与 archives/l/libgsasl 同一份上游源码 tarball（该归档为 1.10.0，本包为 2.2.4）。
sources:
  url: "https://ftp.gnu.org/gnu/gsasl/gsasl-2.2.4.tar.gz"
  sha256: "d32be15efd3a04cb19b232f721bdca02cc6ad7ab415df7d79fb2dd2c0da3e0be"

patches:
  - patch_file: "patches/0001-build-aux-config.guess.patch"
    patch_description: >-
      gsasl 2.2.4 自带的 build-aux/config.guess 时间戳是 2025-07-10，
      仍只认 aarch64:Linux:*，没有任何 HarmonyOS 分支；按知识库 E007 的
      scripts/patch-autotools-ohos.pl 注入 __OHOS__ LIBC 探测与
      *:HarmonyOS:*:* 三元组分支，输出 aarch64-unknown-linux-ohos。
      不做这一步时 configure 直接报
      "cannot guess build type; you must specify one"
    patch_type: "portability"
  - patch_file: "patches/0002-build-aux-config.sub.patch"
    patch_description: >-
      同一份注入脚本给 config.sub 补 ohos-linux 三元组解析
      （basic_os=linux-ohos）。config.guess 猜出来的三元组必须再被
      config.sub 接受，否则 configure 报 "Invalid configuration"——
      两个辅助脚本必须成对补
    patch_type: "portability"