# test_package/MANIFEST.yml
# libgsasl-tools ships the single upstream program from src/ (bin_PROGRAMS =
# gsasl); the library, its headers and the pkg-config file belong to the
# libgsasl package, and upstream's examples/ are noinst_PROGRAMS.
package: libgsasl-tools/2.2.4
homepage: "https://www.gnu.org/software/gsasl/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# tests/Makefile.am drives the gsasl program itself:
#   AM_TESTS_ENVIRONMENT = GSASL="$(LIBTOOL) --mode=execute ../src/gsasl"
# so the upstream suite belongs to the library archive; the program side is
# covered here by test_package/test.sh.
upstream_tests: []

# R34: the test_package must actually invoke the tested binary.
test_package_tests:
  - file: test.sh
    description: >-
      端到端: ①--version 报 2.2.4、--help 退出 0 且列出真实选项表（平台 L2
      冒烟契约）；②无参数调用退出 0 并打印用法；③--client-mechanisms /
      --server-mechanisms 列表非空且含 SCRAM-SHA-256，客户端机制数 >= 5；
      ④--mkpasswd 用固定 salt 与 iteration-count 做可复现的 SCRAM-SHA-256 /
      SCRAM-SHA-1 密钥派生（形状 {mech}count,salt,stored,server，两次运行
      必须完全一致，换密码必须不同）；⑤反例：未知选项与未知机制都必须以
      非 0 退出；⑥ELF 依赖自检：产物不得再有 libgsasl 的 DT_NEEDED
    command: "bash test.sh"

assertion_count: 14