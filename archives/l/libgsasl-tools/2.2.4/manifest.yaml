# 版本级 manifest - libgsasl-tools 2.2.4
# 遵循 ARCHIVE-SPEC v2.0

version: "2.2.4"
software: libgsasl-tools

status: built
build_date: "2026-09-17"
build_system: autotools

source:
  # 上游官方地址 (R39)；与 archives/l/libgsasl 同源工程
  url: "https://ftp.gnu.org/gnu/gsasl/gsasl-2.2.4.tar.gz"
  sha256: "d32be15efd3a04cb19b232f721bdca02cc6ad7ab415df7d79fb2dd2c0da3e0be"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-shared"        # libgsasl 静态链进 gsasl，产物自包含
    - "--enable-static"
    - "--disable-nls"           # 应用包不需要 gettext 目录
    - "--disable-gtk-doc"
    - "--without-gnutls"        # 不让 /usr/local 的 GnuTLS 混进链接行
    - "--without-stringprep"    # 同上，GNU libidn
    - "--disable-gssapi"        # OHOS 上没有 GSS-API 实现
    - "--disable-gs2"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

knowledge_gained:
  - "gsasl 2.2.4 的 build-aux/config.guess 时间戳是 2025-07-10，仍然只认 aarch64:Linux:*，没有任何 HarmonyOS 分支；用知识库 E007 的 scripts/patch-autotools-ohos.pl 注入后 config.guess 在假 uname（uname -s = HarmonyOS, -m = aarch64）下输出 aarch64-unknown-linux-ohos，config.sub 也接受该三元组——两个辅助脚本必须成对补"
  - "GNU SASL 的库/程序拆分边界不在 configure 开关，而在 Makefile：lib/src/Makefile.am 声明 lib_LTLIBRARIES + include_HEADERS，src/Makefile.am 只有一行 bin_PROGRAMS = gsasl；上游把库、程序、示例、文档、po 都放在同一个 ./configure && make 里，SUBDIRS = lib po gl src examples tests doc。所以 tools 包照样全量构建，但只执行 make -C src install-exec DESTDIR=...，等价于 ldns-tools 的 install-drill install-examples"
  - "examples/ 里的 client / client-serverfirst / client-mech / smtp-server 全是 noinst_PROGRAMS，不安装——确认这一点可以避免把示例程序当成 tools 包该交付的内容"
  - "GNU SASL 在 configure.ac 里用 AC_LIB_HAVE_LINKFLAGS 探测 gnutls 与 idn（libidn）；这个宏查的是系统目录与 LD_LIBRARY_PATH，不是 pkg-config，所以在 OHOS 上会被 /usr/local 下的同名库静默满足，链接行被污染、产物带上没人交付的 DT_NEEDED。拆包时显式 --without-gnutls --without-stringprep 才是 hermetic 的做法（与 libheif-tools 里 CMAKE_DISABLE_FIND_PACKAGE_* 是同一类问题：系统前缀里的第三方包配置对交叉构建是负面因素）"
  - "src/Makefile.am 里 gsasl_cmd.c/gsasl_cmd.h 由 gengetopt 从 gsasl.ggo 生成，生成规则的依赖里带 Makefile.am；发行 tarball 内所有文件时间戳相同所以不会触发重生成，但只要打任何触碰 src/Makefile.am 或 gsasl.ggo 的补丁，make 就会去调 worker 上不存在的 gengetopt。本包因此不改上游源码，只补 build-aux 两个辅助脚本"
  - "gsasl 程序的 --version/--help 由 src/gsasl.c 自己处理（gengetopt 生成时用了 --no-handle-version --no-handle-help），两条路径都返回 EXIT_SUCCESS，不需要为平台 L2 冒烟补补丁；--version 打印的版本号来自 gsasl_check_version(NULL)，也就是运行期库的版本，与程序自身的 PACKAGE_VERSION 不一致时会改用 PACKAGE_STRING 但依然退出 0"
  - "GNU SASL 上游 tests/ 里 26 个 C 测试程序 + 6 个 shell 脚本通过 AM_TESTS_ENVIRONMENT 的 GSASL=\"$(LIBTOOL) --mode=execute ../src/gsasl\" 直接驱动 gsasl 程序本身，所以这套用例归库归档；tools 归档另写 test_package 覆盖命令行契约与 SCRAM 派生"

patch_classification:
  - file: 0001-build-aux-config.guess.patch
    type: manual
    platform_only: true
    guard: "verified"
  - file: 0002-build-aux-config.sub.patch
    type: manual
    platform_only: true
    guard: "verified"