software: libxapian
version: "2.0.0"
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://oligarchy.co.uk/xapian/2.0.0/xapian-core-2.0.0.tar.xz"
  sha256: "6cea3f49952a47224439a40bdb3608f928d121ad8721b9921cc42802d548ecf8"
  tar_format: tar.xz

build:
  system: autotools
  build_system: autotools
  configure_options:
    - "--disable-documentation"
    - "--disable-dependency-tracking"
  dependencies:
    - "zlib/1.3.1.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-backends-uuids.cc.patch"
  - "0002-config.guess.patch"
  - "0003-config.sub.patch"
  - "0004-configure.patch"
  - "0005-tests-api_backend.cc.patch"

verification:
  derivation: "同源复用 xapian-core/2.0.0 的真机验证结论（同一 tarball、同一组补丁、同一配方逻辑）"
  upstream_make_check:
    status: "failed_1_flaky_timing_case"
    command: "make check -j1"
    totals: "cases=3617 passed=3545 failed=1 skipped=70 expected_failures=1"
    note: "唯一失败项为上游 CPU 计时门限用例 qp_scale1（阈值 2.15 落在该机型抖动带下沿），功能无缺陷，未修改该用例"
  test_package:
    status: "pending_hmbs_preflight"
    note: "test_package 10 项断言（inmemory/glass/honey/版本号）待 HMBS 真机预检执行回填"

knowledge_gained:
  - "libxapian 即上游 xapian-core 源码构建出的 libxapian.so，2.0.0 移除了 chert 后端，glass/honey/inmemory/remote 为构建后端，glass/honey 需要 zlib"
  - "OHOS sysroot 无 uuid/uuid.h，configure 选择 USE_PROC_FOR_UUID；真机禁读 /proc/sys/kernel/random/uuid，需回退 /dev/urandom"
  - "toybox sed 对 GNU 专用地址 0,/re/ 静默删光输出，导致空 version.h；改 POSIX 形式 1,/re/ 后 GNU/toybox 行为等价"
  - "config.guess 仅需 *:HarmonyOS:*:* 识别分支即可输出 aarch64-unknown-linux-ohos，无需 __OHOS__ 探针，补丁零平台宏"
  - "honey 在 2.0.0 只读，需由 glass 库 compact 产生；XAPIAN_VERSION 宏替代已移除的 version_string() 接口"
