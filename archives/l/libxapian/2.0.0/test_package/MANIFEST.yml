# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 读取）
package: libxapian/2.0.0
homepage: "https://xapian.org/"

# 上游测试命令（make -n check 注册了 apitest/internaltest/stemtest/unittest 四个程序）
upstream_check_command: "make check"

# 本配方 build() 中集成轻量上游套件 internaltest（7 例、零跳过、秒级）作为
# 真机 HMBS_UPSTREAM_TEST_RESULT 证据（./tests/internaltest 实跑实发）；
# 全量 make check（apitest 3482 例、单轮超 20 分钟、qp_scale1 计时抖动失败、
# 70 跳过）与同源包 xapian-core/2.0.0 同口径单独审计，见 notes.md。
upstream_test_in_build: true
upstream_test_command: "./tests/internaltest"

# HMBS rule4 门禁：声明官方同版本注册总数（不能用可运行子集替代）。
# 口径：make -n check 在 tests/ 注册 4 个程序；总数来自同一 tarball
# 全量 make check -j1 真机审计（apitest 3482 + internaltest 7 +
# stemtest 105 + unittest 23 = 3617），详见 notes.md 统计表。
upstream_tests_exist: true
upstream_test_total: 3617
upstream_test_count_method: autotools_tests
upstream_test_audit: "make -n check registers apitest/internaltest/stemtest/unittest in tests/; full make check -j1 audit on same tarball: apitest 3482 (3446 passed, 1 flaky timing qp_scale1, 34 skipped, 1 expected failure) + internaltest 7/7 + stemtest 105 (70 passed, 35 skipped, no dict samples) + unittest 23 (22 passed, 1 skipped) = 3617; see notes.md"

# 上游实际运行的测试程序（同一 tarball 在真机 make check -j1 实跑，详见 notes.md 统计表）
upstream_tests:
  - file: tests/api_backend.cc
    source: xapian-core-2.0.0/tests/api_*.cc
    description: "Backend API tests; 3482 case-runs over 10 backend groups, 3446 passed, 1 flaky timing failure (qp_scale1), 34 skipped, 1 expected failure"
    command: "./apitest <backend>"
  - file: tests/internaltest.cc
    source: xapian-core-2.0.0/tests/internaltest.cc
    description: "Internal helper tests; 7/7 passed"
    command: "./internaltest"
  - file: tests/stemtest.cc
    source: xapian-core-2.0.0/tests/stemtest.cc
    description: "Stemmer tests; 35 stemmers, 70 passed, 35 stemdict cases skipped (no dict samples in release tarball)"
    command: "./stemtest"
  - file: tests/unittest.cc
    source: xapian-core-2.0.0/tests/unittest.cc
    description: "Common utility unit tests incl. uuid1 which validates the /dev/urandom fallback; 22 passed, 1 skipped"
    command: "./unittest"

# test_package 自带的消费者视角测试（conan create 时由 CI 执行）
test_package_tests:
  - file: test_libxapian.cpp
    description: "完整消费者端到端用例 ./test_libxapian：迷你搜索应用全流程（glass 建库 → TermGenerator+Stem 索引 5 篇真实文档 → QueryParser 自然语言查询与排序检索 → 元数据/替换/删除/落盘重开），兼覆盖 inmemory/glass/honey 三后端与 glass→honey 压实路径"
    command: "./test_libxapian"

# 断言总数（1 个完整消费者端到端用例运行时执行 18 次断言：版本 1 + 三后端各 3 + 消费者工作流 8）
assertion_count: 18
