# conandata.yml — libxapian 2.0.0
# 上游源码与 xapian-core/2.0.0 同源（同一 tarball，库文件即 libxapian.so）。
sources:
  url: "https://oligarchy.co.uk/xapian/2.0.0/xapian-core-2.0.0.tar.xz"
  sha256: "6cea3f49952a47224439a40bdb3608f928d121ad8721b9921cc42802d548ecf8"
patches:
  - patch_file: "patches/0001-backends-uuids.cc.patch"
    patch_description: "Fall back to /dev/urandom when the /proc UUID generator is unreadable"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "Recognize HarmonyOS and emit aarch64-unknown-linux-ohos in config.guess"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "Accept linux-ohos target triplets in config.sub"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.patch"
    patch_description: "Use POSIX sed address and 022 temp dir umask so configure works with toybox sed on HMDFS"
    patch_type: "portability"
  - patch_file: "patches/0005-tests-api_backend.cc.patch"
    patch_description: "Probe the effective file mode instead of assuming 0644 in lockfileumask1"
    patch_type: "test"
