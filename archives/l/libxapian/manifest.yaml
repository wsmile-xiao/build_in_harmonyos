# 软件级 manifest
# 文件位置: archives/l/libxapian/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: libxapian

# 显示名
display: "Xapian Search Engine Library"

# 一句话描述
description: "开源全文检索引擎库"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://xapian.org/"

# 开源许可证（SPDX 标识）
license: GPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Autotools 包需要 config.guess/config.sub 识别 HarmonyOS 并输出 aarch64-unknown-linux-ohos"
    - "glass/honey 后端需要 zlib"
    - "OHOS 可能拒绝读取 /proc/sys/kernel/random/uuid，UUID 生成需回退到 /dev/urandom"
    - "toybox sed 不支持 GNU 专用地址 0,/re/，需改用 POSIX 形式 1,/re/"
    - "OHOS 存储可能把锁文件权限屏蔽为 0640，测试期望值需运行时探测"

  # 跨版本通用依赖
  common_dependencies:
    - "zlib/1.3.1.1"

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.0.0":
    status: built
    build_date: "2026-09-18"
