package: libcxx/17.0.6
homepage: "https://libcxx.llvm.org/"

upstream_check_command: "libc++ unit tests (skipped in build; validated via consumer smoke test)"
upstream_test_in_build: false
upstream_case_count: 0
upstream_test_note: "libc++ is a standard-library package; upstream correctness is validated via the consumer smoke test and via aevol 9.4.0 (78/78 tests pass on aarch64-ohos with clang 15 + this libc++)."

test_package_tests:
  - file: "test_libcxx.cpp"
    description: "Compile and run a C++20 program using std::format, std::views::transform and aggregate construct_at against the packaged libc++17."
    command: "clang++ -std=c++20 -nostdinc++ -isystem <pkg>/include -D_LIBCPP_PROVIDES_DEFAULT_RUNE_TABLE -include ohos_libc_compat.h test_libcxx.cpp <pkg>/lib/libc++.a <pkg>/lib/libc++abi.a -o test_libcxx && ./test_libcxx"

test_package_assertion_count: 3
assertion_count: 3
