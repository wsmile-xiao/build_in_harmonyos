version: "17.0.6"
software: libcxx

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-17.0.6.tar.gz"
  sha256: "81494d32e6f12ea6f73d6d25424dbd2364646011bb8f7e345ca870750aa27de1"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_CXX_FLAGS=-D_LIBCPP_PROVIDES_DEFAULT_RUNE_TABLE -include <compat> -isystem <libcxxabi>/include"
    - "-DLIBCXX_ENABLE_SHARED=OFF -DLIBCXX_ENABLE_STATIC=ON"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-construct-at-is-aggregate-dispatch.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 基于 musl 的 libc 无 ctype rune table 宏（_ISSPACE/_S 等），libc++ 需 -D_LIBCPP_PROVIDES_DEFAULT_RUNE_TABLE"
  - "OHOS musl 缺 strtoll_l/strtod_l 等 locale 感知函数，需 ohos_libc_compat.h 垫片（映射到无 locale 版本）"
  - "clang 15 不支持 C++20 括号聚合初始化，construct_at 需 is_aggregate 分派"
