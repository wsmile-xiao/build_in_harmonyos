# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lzip/1.24.1
homepage: "https://www.nongnu.org/lzip/lzip.html"

# 上游测试命令（单 runner 脚本：testsuite/check.sh，220 个断言调用点）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序（RUNTEST 脚本口径，经验汇总 §12.72）
upstream_tests:
  - file: testsuite/check.sh
    source: lzip-1.24.1/testsuite/check.sh
    description: "单 runner 全量套件：针对构建出的 lzip 二进制真实执行压缩/解压/完整性/错误恢复/截断/格式边界共 220 个断言调用点（复算命令 grep -c 'test_failed $LINENO' testsuite/check.sh = 220；grep -c '|| test_failed' = 214 为其中主形态，另 6 处在 else 分支），全部通过时打印 'tests completed successfully' 且 exit 0"
    command: "make check -j1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_lzip.py
    description: "ELF 结构断言：lzip 为 ELF64 AArch64 PIE，NEEDED 仅 musl libc（零运行时依赖）"
    command: "check_elf(usr/bin/lzip)"
  - file: test_lzip.py
    description: "--version 输出 1.24.1 且 rc=0"
    command: "usr/bin/lzip --version"
  - file: test_lzip.py
    description: "-9 压缩真实收益（压缩后 < 原始）+ -k 保留原文件"
    command: "usr/bin/lzip -k -f -9 payload.bin"
  - file: test_lzip.py
    description: "-t 完整性校验 rc=0"
    command: "usr/bin/lzip -t payload.bin.lz"
  - file: test_lzip.py
    description: "-d 解压后 sha256 与源字节级一致（roundtrip）"
    command: "usr/bin/lzip -d -k -f payload.bin.lz"
  - file: test_lzip.py
    description: "截断损坏的 .lz 必须非零退出（错误路径断言）"
    command: "usr/bin/lzip -t corrupted.lz"
