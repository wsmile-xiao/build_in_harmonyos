software: lua-subprocess
display: "Lua Subprocess"
description: "Lua library for spawning subprocesses and managing I/O"
category: system
homepage: "https://github.com/duizendnegen11/lua-subprocess"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile build, requires CC=clang"
    - "Install to $PREFIX/lib/lua/5.4/subprocess.so"
    - "Set PKG_CONFIG_PATH for lua dependency"
  common_dependencies:
    - lua/5.4

versions:
  "0.02":
    status: built
    build_date: "2026-06-09"