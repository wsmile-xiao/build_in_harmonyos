software: lp_solve
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.5.2.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.5.2.14"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# 构建系统类型（用于 verify-build 门禁）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lp-solve/lp_solve/releases/download/5.5.2.14/lp_solve_5.5.2.14_source.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "LDFLAGS=-fuse-ld=/data/service/hnp/bin/ld.bfd"
    - "CFLAGS=-fPIC -O2"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 特殊说明: lp_solve 使用自定义 ccc shell 脚本构建系统，非标准 autotools/cmake
  # 需要手动创建 Makefile 并处理 flex/bison 前缀映射问题

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/lp_solve-5.5.2.14.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/lp_solve-5.5.2.14.work
  source_orig_hash: aee8ad22d4266d16
  source_work_hash: 7149dfcb6af58568
  generated_at: '2026-06-09T16:24:25'
  patches_count: 3

patch_classification:
  - file: 0001-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-lp_rlp.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-lp_rlp_tokens.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
