# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "同一上游 tarball 派生子包：openfst-1.8.4.tar.gz 的 configure.ac 里 --enable-far 默认 no，不显式打开则 src/extensions/Makefile.am 的 HAVE_FAR 为空、far 子目录根本不进构建（configure.ac:60-64 / src/extensions/Makefile.am:14-16）"  # knowledge_ref: E596
  - "同 tarball 子包的上游用例 N 必须按父 tarball 全量清点面取最大值：openfst 1.8.4 注册面 7（src/test/Makefile.am 的 check_PROGRAMS/TESTS、BUILD.bazel 的 cc_test 同为 7）、用例分支面 10（2 个独立程序 + algo_test.cc:66-89 的 8 个 TEST_* 分支），主 N=10；源码级断言宏 CHECK( 185 处属另一计数单位，只披露不并入 N"  # knowledge_ref: E596
  - "静态（--disable-shared）链接会让 openfst 的类型注册表整体失效：lib/fst-types.cc 的 REGISTER_FST 展开成文件作用域 static 对象，fst-types.o 没有任何被引用的强符号 → 链接器按需取对象文件时整块剔除 → FstRegister 表空 → Fst::Read 回退 dlopen(\"vector-fst.so\") 失败返回 nullptr。实测后果是**包内交付的 CLI 集体失效**：fstinfo/fstprint/farinfo/farextract 读任何 FST 都报 Unknown FST type，farcreate 静默写出 0 条目的空档案且 rc=0（假成功）。修法：默认改 shared 构建（动态库整库加载即执行全部静态注册器，也是上游 ./configure 的默认形态），静态形态则必须 -Wl,--whole-archive 包夹 libfst.a"  # knowledge_ref: E598
  - "子包 test_package 的消费者验证三件套：链接期用只在本子包编译单元定义的强符号证明归属（libfstfar 的 fst::IsSTList/fst::IsSTTable 只在 extensions/far/stlist.cc、sttable.cc），运行期真机编译链接跑 FAR API 往返（STList 是顺序档案，Find() 不支持，必须走 Done/GetKey/GetFst/Next 顺序迭代），交付面再跑包内 far*/fst* CLI 端到端往返（`--enable-bin` 形态下实测 8/8，正是第三件抓出了上面的注册表缺陷；本包最终按 `--disable-bin` 收敛交付面后该项记 NOT_RUN）"  # knowledge_ref: E598
  - "子包 cpp_info.libs 要带上传递依赖（libfstfar.la 的 LIBADD 是 libfst.la，故 [\"fstfar\", \"fst\"]）；交付给用户的二进制还需要 $ORIGIN/../lib 可重定位 rpath——libtool 不会自动加，缺了在裸 PATH/无 LD_LIBRARY_PATH 环境下加载器找不到 libfst.so.26（CI 的 L2 smoke 因此必失败）"  # knowledge_ref: E598
  - "OHOS 无 GNU install，toybox install 在 HMDFS 上 Error 64；配方写 install shim（cp -f + mkdir -p，chmod 容错）并 sed 改写各 Makefile 的 INSTALL 变量指向它（libtool --mode=install 读的正是该变量，故 .so 安装同样走 shim）"  # knowledge_ref: E596
  - "HMDFS 权限边界需要 configure 的 umask 077 → 022（补丁 0003），并把 TMPDIR 显式指到可写目录"  # knowledge_ref: E011
