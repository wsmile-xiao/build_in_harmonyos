# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
# 包：libalkimia/8.2.1（上游 KDE alkimia 8.2.1）

package: libalkimia/8.2.1
homepage: "https://invent.kde.org/office/alkimia"

# ---------------------------------------------------------------------------
# 上游测试清点（R51 三步法第 1 步，源码 alkimia-8.2.1/）
# ---------------------------------------------------------------------------
# 口径：autotests/CMakeLists.txt 在 BUILD_TESTING=ON、BUILD_WITH_WEBENGINE=OFF、
# ENABLE_FINANCEQUOTE=OFF 的默认形态下 ecm_add_tests/ecm_add_test 注册的
# CTest 目标 = 12 个（每个 CTest 目标 = 1 个用例）。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error -E ^(alkonlinequotestest|alkdownloadengine-qt-test|alknewstuffenginetest)$"

upstream_tests:
  - file: autotests/alkvaluetest.cpp
    source: alkimia-8.2.1/autotests/alkvaluetest.cpp
    description: "AlkValue 多精度金额（GMP mpq）构造/运算/舍入单测"
    command: "ctest -R ^alkvaluetest$"
  - file: autotests/alkonlinequotesourcetest.cpp
    source: alkimia-8.2.1/autotests/alkonlinequotesourcetest.cpp
    description: "报价源对象构造/赋值/持久化 read-write-remove 单测"
    command: "ctest -R ^alkonlinequotesourcetest$"
  - file: autotests/alkquoteitemtest.cpp
    source: alkimia-8.2.1/autotests/alkquoteitemtest.cpp
    description: "AlkQuoteItem 报价条目单测"
    command: "ctest -R ^alkquoteitemtest$"
  - file: autotests/alkcompanytest.cpp
    source: alkimia-8.2.1/autotests/alkcompanytest.cpp
    description: "AlkCompany 公司信息单测"
    command: "ctest -R ^alkcompanytest$"
  - file: autotests/alkdomtest.cpp
    source: alkimia-8.2.1/autotests/alkdomtest.cpp
    description: "AlkDom 数据对象单测"
    command: "ctest -R ^alkdomtest$"
  - file: autotests/alkexceptiontest.cpp
    source: alkimia-8.2.1/autotests/alkexceptiontest.cpp
    description: "AlkException 异常路径单测"
    command: "ctest -R ^alkexceptiontest$"
  - file: autotests/alkdateformattest.cpp
    source: alkimia-8.2.1/autotests/alkdateformattest.cpp
    description: "AlkDateFormat 日期格式解析/输出单测"
    command: "ctest -R ^alkdateformattest$"
  - file: autotests/alkonlinequoteprivatetest.cpp
    source: alkimia-8.2.1/autotests/alkonlinequoteprivatetest.cpp
    description: "报价解析内核（价格/日期/CSV/JSON 解析）单测；其中 testParseQuoteJson 依赖 UTC 日边界，测试环境注入 TZ=UTC"
    command: "ctest -R ^alkonlinequoteprivatetest$"
  - file: autotests/alkwebpagetest.cpp
    source: alkimia-8.2.1/autotests/alkwebpagetest.cpp
    description: "AlkWebPage（QTextBrowser 后端）单测"
    command: "ctest -R ^alkwebpagetest$"
  - file: autotests/alkonlinequotetest.cpp
    source: alkimia-8.2.1/autotests/alkonlinequotetest.cpp
    description: "在线报价完整流程测试（ctest 名 alkonlinequotestest）：真实下载 https://kmymoney.org/onlinequotestest.php；网络型用例，CI 离线口径 ctest -E 排除，本地联网口径完整执行"
    command: "ctest -R ^alkonlinequotestest$"
  - file: autotests/alkdownloadenginetest.cpp
    source: alkimia-8.2.1/autotests/alkdownloadenginetest.cpp
    description: "下载引擎（QtNetwork 后端，ctest 名 alkdownloadengine-qt-test）真实 HTTP 下载；网络型用例，同上"
    command: "ctest -R ^alkdownloadengine-qt-test$"
  - file: autotests/alknewstuffenginetest.cpp
    source: alkimia-8.2.1/autotests/alknewstuffenginetest.cpp
    description: "KNewStuff 报价源仓库引擎测试，访问 https://autoconfig.kde.org/ocs/providers.xml；网络型用例，同上"
    command: "ctest -R ^alknewstuffenginetest$"

# 未注册入 CTest 的上游测试目标（清点留痕，不计入 12 用例口径）：
#  - tests/：4 个手工 GUI 冒烟可执行（qmlalkonlinequotetest /
#    alkonlinequoteswidgettest / alknewstuffwidgettest /
#    alkwebviewwidget-qtextbrowser-test），上游未 add_test，需人工带界面运行
#  - autotests/test-qwebengine-*.cpp / alkdownloadengine-{webkit,webengine}-test：
#    仅 BUILD_WITH_WEBKIT/WEBENGINE=ON 注册，OHOS 无 QtWebEngine 制品
#  - autotests/client-package + test-install-*：仅 ENABLE_CLIENT_PACKAGE_TEST=ON
#    注册（上游默认 OFF）
#  - autotests/appstreamtest：上游 CMake 在 appstreamcli 不存在时不注册

# ---------------------------------------------------------------------------
# test_package 消费者端到端用例（rule12，OHOS aarch64 真机口径执行）
# ---------------------------------------------------------------------------
test_package_tests:
  - file: test_package/test_libalkimia.cpp (case1)
    count: 1
    checks: 12
    description: "金融金额计算回环：字符串解析（欧式逗号小数点）-> 复式记账四则运算 -> 舍入/精度换算 -> toString 回环再解析 -> 比较运算"
    command: "./test_libalkimia"
  - file: test_package/test_libalkimia.cpp (case2)
    count: 1
    checks: 8
    description: "报价源存储回环：AlkOnlineQuotesProfile 持久化 write -> 重开读取逐字段校验 -> 自定义 CSV 源写读 -> rename -> remove 存储清空"
    command: "./test_libalkimia"
  - file: test_package/test_libalkimia.cpp (case3)
    count: 1
    checks: 3
    description: "报价引擎消费者契约：AlkOnlineQuote 构造 + 单条信号开关回读 + 未知报价源 launch 失败契约（返回 false、不发起下载）"
    command: "./test_libalkimia"

test_case_count: 3
# 校验点总数以实际执行输出为准（见 reports/upstream-test-evidence.md 与
# reports/device-e2e-evidence.md 的 RESULT 行）
assertion_count: 23
