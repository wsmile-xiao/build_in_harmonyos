# libshumate 1.7.0 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "1.7.0"

software: libshumate

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（download.gnome.org 为 GNOME 官方发布镜像）
  url: "https://download.gnome.org/sources/libshumate/1.7/libshumate-1.7.0.tar.xz"

  # 源码校验和
  sha256: "3896cc4b6a7bf83141c27df23ce48cdd68467603bc6b764960307cdcbbef80e5"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dgir=false"
    - "-Dvapi=false"
    - "-Dgtk_doc=false"
    - "-Ddemos=false"
    - "-Dsysprof=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gtk4/4.22.4
    - glib/2.84.0.1.1
    - cairo/1.18.4
    - sqlite3/3.49.1
    - libsoup3/3.6.5-r3
    - json-glib/1.10.6
    - protobuf-c/1.5.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 无源码补丁（平台差异全部在配方层解决）

# ============================================================
# 测试统计（rule4：N=上游 meson 注册测试目标数）
# ============================================================

test_summary:
  upstream_registered: 16
  upstream_runnable: 13
  upstream_passed: 13
  upstream_display_limited: 3
  consumer_test_package: "7 断言 ALL PASS"
  notes: >-
    16 项中 13 项纯 g_test_init（无显示需求）实跑 49 断言全 PASS；
    3 项（map/marker/marker-layer）依赖 gtk_init 显示（OHOS 无窗口系统，
    Broadway socket SELinux 禁止），平台限制如实申报；test_package
    消费者测试 7 断言 ALL PASS。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libsoup3 必须 -r3（glib/2.84.0.1.1 shared）：-r1/-r2 静态内嵌 GObject 导出 4110 个 g_* 符号，运行时双 GObject 副本 SIGABRT"
  - "制品仓下载的 .so 带 CI worker 签名，本机 XPM 拒载：build() 里对依赖 .so 重签（llvm-objcopy + binary-sign-tool -selfSign 1）"
  - "conanbuildenv 注入唯一有效点是 build() 里追加 conanbuildenv-*.sh（VirtualBuildEnv 在 generate() 后写文件；ConanFile.run 用 source conanbuild.sh 包装一切命令）"
  - "override-only pin 不生成 .pc：PkgConfigDeps 只为直接依赖生成（sqlite3 必须普通 requires）"
  - "OHOS musl loader 不搜 /system/lib64 的 libc++_shared.so：LD_LIBRARY_PATH 必须显式加（ninja/cmake 等 hnp ELF 全踩）"
