# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# libshumate 1.7.0 上游 tests 基于 meson（tests/meson.build 注册 16 个 g_test
# 目标）。build() 中在 OHOS 宿主直接执行测试二进制（13 项实跑全 PASS；
# 3 项 gtk_init 显示依赖如实申报豁免）。

package: libshumate/1.7.0
homepage: https://gitlab.gnome.org/GNOME/libshumate

# 上游测试命令
upstream_check_command: "meson test -C builddir"
upstream_test_in_build: true
upstream_test_command: "builddir/tests/<name> (direct exec on OHOS host)"

# 代表性上游测试（完整 16 项清单与逐项结果见 notes.md）
upstream_tests:
  - file: tests/coordinate.c
    source: libshumate-1.7.0.tar.xz/tests/coordinate.c
    description: "ShumateCoordinate 生成与位置换算测试"
    command: "builddir/tests/coordinate"
  - file: tests/vector-expression.c
    source: libshumate-1.7.0.tar.xz/tests/vector-expression.c
    description: "矢量渲染表达式求值器测试（gperf 生成解析器，17 断言）"
    command: "builddir/tests/vector-expression"
  - file: tests/viewport.c
    source: libshumate-1.7.0.tar.xz/tests/viewport.c
    description: "ShumateViewport 缩放/中心逻辑测试"
    command: "builddir/tests/viewport"

# test_package 自带测试（消费者视角，真实 API）
test_package_tests:
  - file: test.c
    description: "真实 API 冒烟：版本宏 + MapSourceRegistry 默认源 OSM_MAPNIK 缩放级/纬度换算 + ShumateCoordinate + ShumateViewport 缩放往返"
    command: "./test_libshumate"

# 断言数：版本宏 1 + registry 1 + OSM 查找 1 + zoom 范围 1 + 纬度 1 + coordinate 1 + viewport 1
assertion_count: 7
