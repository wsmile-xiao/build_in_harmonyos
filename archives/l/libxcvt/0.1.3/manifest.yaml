software: libxcvt
version: 0.1.3
status: success
build_system: meson
created_at: 2026-05-06
knowledge_gained:
  - meson 构建系统在 HarmonyOS 上正常工作
  - 需要安装 meson（python3 -m pip install --user meson）
  - cvt 工具需要 ELF 签名才能执行（sign-elf）
patches_applied: []
build_log: logs/build.log
source_url: https://www.x.org/releases/individual/lib/libxcvt-0.1.3.tar.xz
configure_options:
  - meson setup build --prefix=/storage/Users/currentUser/usr/local
build_commands:
  - ninja -C build
install_commands:
  - DESTDIR=$TEST_PREFIX ninja -C build install
