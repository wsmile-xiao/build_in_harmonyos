software: libcanberra
display: "libcanberra"
version: "0.30"
upstream_name: libcanberra
upstream_version: "0.30"
status: built
build_system: autotools
build_date: 2026-09-05
compile_date: 2026-09-05
target_platform: aarch64-unknown-linux-ohos
issue: "开源鸿蒙PC专项积分赛-依赖"

source:
  url: "https://0pointer.de/lennart/projects/libcanberra/libcanberra-0.30.tar.xz"
  sha256: "c2b671e67e0c288a69fc33dc1b6f1b534d07882c2aceed37004bf48c601afa72"
  tar_format: tar.xz
  version_mapping: "Conan libcanberra/0.30 maps to upstream libcanberra 0.30 and libcanberra.so.0 (libtool -version-info 2:5:2)."

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--with-builtin=null"
    - "--disable-alsa"
    - "--disable-oss"
    - "--disable-pulse"
    - "--disable-gstreamer"
    - "--disable-udev"
    - "--disable-gtk"
    - "--disable-gtk3"
    - "--disable-tdb"
    - "--disable-lynx"
    - "--disable-gtk-doc"
    - "--with-systemdsystemunitdir=no"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-vorbis-optional.patch (wraps the whole Ogg Vorbis decoder read-vorbis.c behind #if HAVE_VORBIS)"
  - "0002-vorbis-read-sound-file-guards.patch (guards the vorbis fallbacks in read-sound-file.c; WAV kept)"
  - "0003-null-driver-playing.patch (adds the driver_playing() the null driver forgot)"

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml, and test_package/MANIFEST.yml"
    - "L0 static gate checks passed"
    - "official source sha256 verified locally"
    - "test_package drives the public canberra.h API on the built-in null driver (no audio device needed): 19 exported symbols relocated with strong types, CA_MAJOR/CA_MINOR/error-code compile-time contract, error-string sweep, and a full create/open/play_full(callback)/playing/cancel/cache/destroy lifecycle plus expected failure modes"
  remote:
    - "pending GitCode CI build_and_test.sh run on PR"
  pending:
    - "PR validation / GitCode CI / REL upload"

knowledge_gained:
  - "VORBIS bypass: configure.ac runs PKG_CHECK_MODULES(VORBIS, vorbisfile) UNCONDITIONALLY (configure.ac:586) with no --disable-* switch, so a stock configure aborts when libvorbisfile is absent. The generated configure (bundled old pkg.m4) only takes the env branch when BOTH VORBIS_CFLAGS and VORBIS_LIBS are non-empty; the recipe feeds 'VORBIS_CFLAGS=-DHAVE_VORBIS=0' and 'VORBIS_LIBS= ' (note the space) so pkg-config is never invoked. HAVE_VORBIS is NOT AC_DEFINE'd anywhere (absent from config.h.in), so the -D reaches every compilation unit via libcanberra_la_CFLAGS = $(AM_CFLAGS) $(VORBIS_CFLAGS) and the two patches guard the decoder with #if HAVE_VORBIS."
  - "Real audio drivers (pulse/alsa/gstreamer/...) are libltdl DSO modules needing libltdl plus a runtime plugin dir, neither applicable on OHOS. --with-builtin=null compiles exactly one driver (null.c) into libcanberra.so and turns BUILTIN_DSO off, so no dso.c and no $(LIBLTDL) link; configure must not use plain '--with-builtin' without a driver name."
  - "Upstream null.c implements driver_open/destroy/change_device/change_props/play/cancel/cache but forgets driver_playing(), which common.c calls unconditionally — in module mode the DSO wrapper used to supply it. Patch 0003 adds the missing stub (*playing = 0) so the shared library links."
  - "Top-level Makefile.am recurses into 'src gtkdoc doc'; gtkdoc/ needs the gtk-doc toolchain and doc/ is generated docs, so the recipe only builds/installs the src subdir and copies the configure-substituted libcanberra.pc into package lib/pkgconfig itself (rewriting prefix to ${pcfiledir}/../.. and deleting libcanberra.la). -version-info 2:5:2 -> libcanberra.so.0; cpp_info.libs must be 'canberra' so CMakeDeps finds libcanberra.so."
  - "OHOS configure runs in cross-compiling mode (--host=aarch64-linux-ohos) under /system/bin/sh, with the generated configure's 'umask 077' rewritten to 'umask 022' (must appear exactly twice), following the CI-verified libxrender/0.9.12 pattern — native --build == --host mode would try to RUN conftest binaries the OHOS sandbox cannot execute."
