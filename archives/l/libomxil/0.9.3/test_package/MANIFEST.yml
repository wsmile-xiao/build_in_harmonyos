# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
#
# 上游 libomxil-bellagio 0.9.3 自带 test/ 目录（SUBDIRS=components），但其组件
# 测试依赖 X11/图形栈与真实音视频设备，且上游 make check 仅编译不运行断言，
# 不适配 OHOS 交叉环境。因此上游用例记为不随构建执行，适配后用
# test_package/test.c 从消费者视角验证 OpenMAX IL 核心运行时。

package: libomxil/0.9.3
homepage: "https://sourceforge.net/projects/omxil/"

# 上游测试命令（用于 `make -n check` 分析；上游测试不适配交叉环境，不随构建执行）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_tests: []

# test_package 消费者视角验证：6 项断言
test_package_tests:
  - file: test.c
    description: "OpenMAX IL 核心消费者验证：omxregister-bellagio 生成组件注册表后，OMX_Init 初始化、OMX_ComponentNameEnum 组件枚举（>=3）、OMX_GetHandle/OMX_FreeHandle 首个组件实例化与释放、OMX_Deinit 反初始化全链路断言"
    command: "./test_probe"
    assertion_count: 6

# 鸿蒙特有测试 (HarmonyOS-specific)：断言产物在本平台可用所必需的特性
# H1/H2/H3 ELF machine = AArch64 且 e_type = ET_DYN（core / 动态加载器插件 / 组件库）；
# H4 bin/omxregister-bellagio 的 PT_INTERP 指向 OHOS aarch64 动态加载器
#     （/lib/ld-linux-aarch64.so.1 或 /lib/ld-musl-aarch64.so.1），证明是 OHOS
#     musl 二进制而非 glibc Linux；H5 产物无任何 glibc 专属 soname 依赖
#     （libc.so.6/libpthread.so.0/libdl.so.2/...，musl 将其折叠进 libc.so）；
# H6 core 的 DT_NEEDED 仅 libc.so；H7/H8 dlopen 实际加载加载器插件与全部组件库并
#     校验 setup_component_loader / omx_component_library_Setup 入口符号可解析。
harmonyos_specific_tests:
  - file: test.c
    description: "鸿蒙特有测试 8 项（AArch64 产物 / OHOS 加载器 / 无 glibc soname / dlopen 入口符号）"
    command: "LIBOMXIL_PKG=<pkg> ./test_probe"
    assertion_count: 8

# 测试断言总数 (近似值, 用于质量评估)
# 消费者视角验证 6 + 鸿蒙特有测试 8
assertion_count: 14
