# 版本级 manifest — libomxil 0.9.3
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.3"

# 软件名
software: "libomxil"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"
build_system: autotools
# 包类型：library（OpenMAX IL 核心库 + 组件加载器 + 组件集 + 注册工具）
package_type: library

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 官方 orig tarball，与 omxil.sourceforge.net 0.9.3 发布版一致）
  url: "https://deb.debian.org/debian/pool/main/libo/libomxil-bellagio/libomxil-bellagio_0.9.3.orig.tar.gz"

  # 源码校验和（已核验）
  sha256: "593c0729c8ef8c1467b3bfefcf355ec19a46dd92e31bfc280e17d96b0934d74c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-dependency-tracking"
    - "--disable-static"
    - "ac_cv_func_malloc_0_nonnull=yes"
    - "ac_cv_func_realloc_0_nonnull=yes"

  # 编译依赖列表（格式: name/version）— 无外部依赖
  # （核心库仅链接 libc/pthread/dl，musl 已折叠后两者）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（全部为平台移植性修复，不改功能逻辑）
patches_applied:
  - "patches/0001-config.guess-harmonyos.patch"
  - "patches/0002-config.sub-ohos-aarch64.patch"
  - "patches/0003-configure-umask-022.patch"
  - "patches/0004-no-werror.patch"
  - "patches/0005-extern-rm-globals.patch"
  - "patches/0006-dynamic-loader-link-core.patch"

patches:
  - file: patches/0001-config.guess-harmonyos.patch
    purpose: "config.guess 增加 HarmonyOS 分支（uname -s），输出 <machine>-unknown-linux-ohos，避免 dummy.c 探测被 OHOS worker 存储拒绝（与 libm17n-core 同款修复）"
    type: manual
    platform_only: true
  - file: patches/0002-config.sub-ohos-aarch64.patch
    purpose: "config.sub 接受 aarch64-ohos / aarch64-unknown-linux-ohos 三元组（vendor 可为 - 或 unknown，kernel 可省略）"
    type: manual
    platform_only: true
  - file: patches/0003-configure-umask-022.patch
    purpose: "configure 的 ./confXXXXXX 辅助目录 umask 077 改为 022，规避 HMDFS 上 0700 目录导致 subs1.awk Permission denied（E011/E533，libthai/libm17n-core 先例）"
    type: manual
    platform_only: true
  - file: patches/0004-no-werror.patch
    purpose: "configure 去掉 -Werror：OHOS clang 15 对 2009 年代源码大量告警，-Werror 会把告警升级为构建失败"
    type: manual
    platform_only: true
  - file: patches/0005-extern-rm-globals.patch
    purpose: "src/base/rm.h 的队列/注册表全局变量改为头文件 extern 声明 + rm.c 单点定义：lld 默认 -fno-common，拒绝旧头文件在每个编译单元生成的重复定义"
    type: manual
    platform_only: true
  - file: patches/0006-dynamic-loader-link-core.patch
    purpose: "src/dynamic_loader/Makefile.am 与随包 Makefile.in 同步补 LIBADD=$(top_builddir)/src/libomxil-bellagio.la：上游未给 loader 插件任何 LIBADD，插件因此无 DT_NEEDED 指向 core，dlopen 的对象在 musl 上只从自身依赖链解析符号，RM_Init 未解析；组件库本就有 LIBADD 故同路径正常"
    type: manual
    platform_only: true

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游顶层 Makefile.am 把 $(DESTDIR)$(prefix) 烧进 docdir，automake 安装规则再前置一次 $(DESTDIR)，产生嵌套的 <pkg>/<pkg>//share/doc 目录树；conan package() 须丢弃 bin/include/lib 之外的所有顶层残留"
  - "lld 默认 -fno-common：2009 年代把全局变量直接定义在头文件里的写法（bellagio src/base/rm.h 的队列/注册表）会在每个编译单元生成重复定义，链接期报 duplicate symbol；修法是头文件 extern 声明 + 单点定义"
  - "omxregister-bellagio 的 main() 对多数错误路径都返回 0，退出码不能作成败判据；验证注册须检查注册表文件非空（OMX_Init 无注册表时返回 ENOENT）"
  - "Bellagio 运行时按注册表驱动：OMX_Init 读 $OMX_BELLAGIO_REGISTRY（默认 ~/.omxregister）；组件目录与 loader 目录（${libdir}/omxloaders）在 configure 期烧进二进制，conan prefix 布局天然自洽"
  - "交叉编译下 AC_FUNC_MALLOC/AC_FUNC_REALLOC 默认判 malloc(0) 损坏，config.h 定义 rpl_malloc 而上游无实现；预置 ac_cv_func_*_0_nonnull=yes 即可（musl 语义本就满足，libm17n-core 同款）"
  - "WSL 本地验证 aarch64 musl 制品：binfmt_misc 注册 qemu-aarch64 后，导出 QEMU_LD_PREFIX=<OHOS 运行时根> 即可直接执行 conan cache 里的制品，test_package 的完整运行时路径（注册表生成 + OMX_Init/GetHandle/Deinit + 8 项鸿蒙特有审计）可在提交 CI 前全部走通"
  - "OHOS SDK 工具链给可执行文件写入的 PT_INTERP 是 /lib/ld-linux-aarch64.so.1（OHOS 将 musl 运行时以 ld-linux 名称安装，与 /lib/ld-musl-aarch64.so.1 同一文件）；判断‘是否 OHOS 二进制’不能只认 ld-musl 拼写"
  - "DT_NEEDED 的 d_val 是动态字符串表下标而非虚拟地址，需先取 DT_STRTAB 的 vaddr、加上下标，再经 PT_LOAD 段换算成文件偏移；自写 ELF 审计器（H1~H8 鸿蒙特有测试）据此校验无 glibc soname 与 dlopen 入口符号"
