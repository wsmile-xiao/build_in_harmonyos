sources:
  "0.9.3":
    url: "https://deb.debian.org/debian/pool/main/libo/libomxil-bellagio/libomxil-bellagio_0.9.3.orig.tar.gz"
    sha256: "593c0729c8ef8c1467b3bfefcf355ec19a46dd92e31bfc280e17d96b0934d74c"

patches:
  "0.9.3":
    - patch_file: "patches/0001-config.guess-harmonyos.patch"
      patch_description: "config.guess: recognize HarmonyOS (uname -s) and emit <machine>-unknown-linux-ohos; without it configure falls back to a dummy.c probe that the OHOS worker storage rejects"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0002-config.sub-ohos-aarch64.patch"
      patch_description: "config.sub: accept the aarch64-ohos / aarch64-unknown-linux-ohos triplets (vendor '-' or 'unknown', kernel 'linux' or omitted, os 'ohos')"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0003-configure-umask-022.patch"
      patch_description: "configure: create the ./confXXXXXX helper directory with umask 022 instead of 077 — on the OHOS worker's HMDFS storage the 0700 directory makes the generated helper scripts unusable (subs1.awk: Permission denied)"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0004-no-werror.patch"
      patch_description: "configure: drop -Werror from the warning set (line 3030) — OHOS clang 15 warns on the 2009-era sources and -Werror turns those warnings into build failures"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0005-extern-rm-globals.patch"
      patch_description: "src/base/rm.h / rm.c: declare the queue/registry global variables as extern in the header with a single definition in rm.c — the OHOS linker (lld, -fno-common by default) rejects the duplicate definitions the old header emitted into every including translation unit"
      patch_type: "portability"
      strip: 1
    - patch_file: "patches/0006-dynamic-loader-link-core.patch"
      patch_description: >-
        dynamic_loader: 让 loader 插件声明对 IL core 的依赖（LIBADD）。上游
        src/dynamic_loader/Makefile.am 未给该插件任何 LIBADD，插件因此没有
        DT_NEEDED 指向 core，只靠宿主进程提供 RM_Init——而 dlopen 的对象在 musl 上
        只从自身依赖链解析符号，于是 H7 报 `RM_Init: symbol not found`。组件库
        （src/components/*/Makefile.am 均有 LIBADD）走同一路径正常（H8 通过），
        这里让插件与组件一致。随包交付的是上游已生成的 Makefile.in，故同步修改
        Makefile.am 与 Makefile.in（避免依赖构建机上 automake 版本与上游一致）。
      patch_type: "portability"
      strip: 1
