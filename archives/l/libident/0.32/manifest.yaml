# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: GNU config.guess (2004版) 不识别 HarmonyOS，需添加 *:HarmonyOS:*:* case 映射到 aarch64-unknown-linux-gnu"
  - "HMDFS umask 077 导致临时目录权限 0700，文件创建 Permission denied，需替换为 umask 022"
  - "Conan 2.x 无 self.cache_folder 属性，source() 中下载需使用 tempfile.mkdtemp()"
  - "SSL 证书验证失败时，conanfile.py source() 可用 curl -kL + hashlib.sha256 + tarfile 替代 conan 内置下载器"
  - "库包 cpp_info.libs 应去掉 lib 前缀：libident.a → libs=['ident']"
  - "R26 库包静态链接：generate() 使用 --enable-static --disable-shared 而非 -static ldflag"
  - "conan cache path <ref> 不带 package ID 时返回 recipe export 目录而非 package 目录，conan-verify G4 需符号链接 workaround"
  - "HMDFS 不支持 mkfifo，make jobserver 自动降级单线程，不影响构建"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libident-0.32.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libident-0.32.work
