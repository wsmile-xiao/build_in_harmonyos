software: libxt
display: "X.Org X Toolkit Intrinsics Library"
description: "X Toolkit Intrinsics library for X11 applications"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxt"
license: MIT
build_system: autotools

ohos_adaptation:
  key_points:
    - "Preserves the upstream libXt.so.6 ABI and generated public headers"
    - "Runs all 20 independently registered upstream GLib test paths"
    - "Keeps platform handling in the recipe without source condition macros"
  common_dependencies:
    - libx11
    - libsm
    - libice
    - xorgproto

