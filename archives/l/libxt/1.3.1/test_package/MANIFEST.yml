test_package_tests:
  - id: "allocation-contract"
    source: "allocation_contract.c"
    command: "libxt_allocation_contract"
    description: >-
      Exercise allocation, zero initialization, reallocation, array growth,
      formatted allocation, and release through the installed libXt API.
  - id: "application-context-contract"
    source: "context_contract.c"
    command: "libxt_context_contract"
    description: >-
      Initialize Xt and validate application-context creation, exit-flag
      state transitions, and destruction without opening a Display.

test_counting:
