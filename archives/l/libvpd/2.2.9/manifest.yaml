version: "2.2.9"
software: "libvpd"
status: built
build_date: "2026-09-27"
build_system: autotools

source:
  url: "https://github.com/power-ras/libvpd/archive/refs/tags/v2.2.9.tar.gz"
  sha256: "91ee5176c7518554bd79cd3e3bdda29c6604fa0cc43309ece44c0c80da4a8fef"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--sysconfdir=${prefix}/etc"
    - "--localstatedir=${prefix}/var"
  dependencies:
    - sqlite3/3.53.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-makefile-portability.patch"   # Makefile.am: -lstdc++→-lc++、-I./src→-I$(srcdir)/src、install hook 可移植化

knowledge_gained:
  - "libvpd_cxx_la_LDFLAGS 的 -lstdc++ 在 OHOS 无对应库，必须改 -lc++（sysroot 仅提供 libc++）"
  - "上游不提供 configure：按仓库主流做法用 tool_requires(automake/1.18 + libtool/2.5.4) 在 CI 内自举 ac_local/autoconf/autoheader/automake，不随配方提交生成物（R6：生成物不可复现）"
  - "hnp/bin 只有 autoconf 家族（autoconf/autoheader/autom4te/m4/autoreconf/perl），没有 aclocal/automake/libtool —— 故必须 tool_requires 拉入；CI 的 conan create 已传 -pr:h/-pr:b，tool_requires 可正常解析"
  - "automake/1.18 自带的 config.sub 已识别 aarch64-linux-ohos（实测 sh config.sub aarch64-linux-ohos → aarch64-unknown-linux-ohos），无需再随配方携带 config.guess/config.sub 覆盖"
  - "OHOS 无 /bin/bash：configure shebang 需改写为 /data/service/hnp/bin/bash（/bin/sh 存在，不需改）"
  - "HMDFS：config.status 用 umask 077 + mktemp -d 建 700 子目录会被拒写（agg 有同款记录）"
  - "sqlite3 不在 sysroot：必须在 generate() 里加 AutotoolsDeps，否则 AC_CHECK_HEADERS([sqlite3.h]) 失败"
  - "上游零测试：Makefile.am 无 TESTS/check_PROGRAMS，libvpd-ci/ 只是 Dockerfile + 构建脚本"
  - "上游 Makefile.am 的 -I./src 假定 in-tree 构建，conan 的 out-of-tree 构建下所有 <libvpd-2/…> 都找不到，需改 $(srcdir)/src"
  - "上游 install-exec-hook 用 GNU coreutils 的 install --mode=644，OHOS 只有 busybox install（只认 -m），且 out-of-tree 下需 $(srcdir)/ 前缀"
  - "自举链必须用 self.run(env=\"conanbuild\")：tool_requires 注入的 $ACLOCAL/$AUTOMAKE/$LIBTOOLIZE 只对该环境生效，Python 进程 os.environ 取不到（仓库先例实测裸调报 aclocal: not found）"
  - "该库构建带 -DNDEBUG，测试中不可用 assert() 判空；且 free_dataitem() 内部会自行释放字段，重复 free 会双重释放"
  - "new_vpddbenv() 会尝试打开 sqlite 库文件，目录不存在时返回 NULL —— 不是纯构造函数，调用方必须判空"



patch_generation:
  method: per-file-difflib
  source_orig_dir: "libvpd-2.2.9"                       # 上游 orig tarball 顶层目录
  source_work_dir: "archives/l/libvpd/2.2.9/patches"
  generated_at: "2026-09-27"
