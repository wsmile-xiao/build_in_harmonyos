# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求）
package: libvpd/2.2.9
homepage: "https://github.com/ibm-power-utilities/libvpd"

# 上游测试命令：上游 Makefile.am 未定义 TESTS / check_PROGRAMS，
# 因此 `make -n check` 不产生任何测试目标（已核实：顶层 Makefile.am 无 TESTS/check_PROGRAMS，
# libvpd-ci/ 仅含 Dockerfile 与构建脚本，不是测试套件）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（上游零测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libvpd.c
    description: "C 消费者视角：调用上游全部 6 个公开 C 头文件的 24 个函数（common.h 的 list 三函数 / dataitem.h 的构造-追加-打包长度-解包往返 / component.h 的构造-追加-unpack 契约 / system.h / vpddbenv.h 的 fetch 空库契约 / vpdretriever.h 的 get 空指针守卫），验证可编译、链接、运行并通过 45 项显式检查（不用 assert，因构建带 -DNDEBUG）"
    command: "./test_libvpd_c"
  - file: test_libvpd_cxx.cpp
    description: "C++ 消费者视角：链接并调用包内 libvpd_cxx.a（配方 package_info 声明 libs=[\"vpd\",\"vpd_cxx\"]，此前 C 用例只触及 C API、该库随包发布却从未被实际使用验证），覆盖 lsvpd 命名空间下 DataItem / Source / Component / System 四类的默认构造、访问器、pack↔unpack 往返与析构释放，共 36 项显式检查"
    command: "./test_libvpd_cxx"
  - file: test_libvpd_ohos.cpp
    description: "鸿蒙（HarmonyOS PC）专有视角：断言只在 OHOS 平台才有意义的适配前提——①编译期 __OHOS__ 已定义（os=OHOS 目标）；②运行期 uname(2) 报 sysname=HarmonyOS、machine=aarch64；③标准库为 libc++（_LIBCPP_VERSION 存在且无 __GLIBCXX__），即本适配 -lstdc++ → -lc++ 补丁的判据；④静态链接产物可用（shared=False，无 .so，故不走 dlopen，直接调用公开 C/C++ API）。共 11 项显式检查"
    command: "./test_libvpd_ohos"

# 断言总数（45 C + 36 C++ + 11 鸿蒙特有）
assertion_count: 92
