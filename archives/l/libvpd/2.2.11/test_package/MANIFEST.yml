# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 读取）
package: libvpd/2.2.11
homepage: "https://github.com/power-ras/libvpd"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中是否集成上游测试
# 上游 tag 源码无任何测试套件（无 tests/ 目录、Makefile.am 无 TESTS/
# check_PROGRAMS，make check 仅空转通过），故不集成
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（官方 v2.2.11 tag 未携带测试套件）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: "消费者测试：C++ 公开 API System pack/unpack 往返 + C API new_vpdretriever 调用"
    command: "./test_libvpd"

# 测试断言总数（质量评估用）
assertion_count: 3