# 版本级 manifest — libvpd/2.2.11 (HarmonyOS PC aarch64)
version: "2.2.11"
software: "libvpd"
status: built
build_date: "2026-09-27"
build_system: "autotools"

source:
  url: "https://codeload.github.com/power-ras/libvpd/tar.gz/refs/tags/v2.2.11"
  sha256: "557a5ead6d15d4f5a6d0e3d0ac0344cc028e17a162d9174680d41b37c99b1431"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-gnu"
    - "--host=aarch64-linux-ohos"
  dependencies:
    - sqlite3/3.53.4
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-makefile-am-ohos-adapt.patch"
  # 移除 C++ 库冗余 -lstdc++（OHOS 用 libc++）；空转 install-exec-hook

knowledge_gained:
  - "官方 tag tarball 未携带生成的 configure，需在 recipe build() 内跑 autotools bootstrap（aclocal/autoheader/automake --add-missing/autoconf）；ohpcd 的 autoconf/automake 包 shebang/前缀不可重定位，需以系统 perl + autom4te_perllibdir/AUTOM4TE/AUTOCONF 包装器统一解释器"
  - "HMFS 对 0700 目录归一化为 0760（组无 x），autoconf 生成的 config.status 用 umask 077 + mktemp 建临时目录会 Permission denied；需 sed 改 umask 002"
  - "上游 Makefile.am 的 cwd 相对 -I./src/ 在 conan 异目录构建失效，需经 configure CPPFLAGS 参数固化绝对 -Isrc 与 sqlite3 头路径"