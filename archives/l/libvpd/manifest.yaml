software: libvpd
display: "libvpd"
description: "IBM VPD（Vital Product Data）库：以 C 与 C++ 两套 API 读取硬件清单数据"
category: system
homepage: "https://github.com/ibm-power-utilities/libvpd"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游无预生成 configure（只有 configure.ac/Makefile.am/bootstrap.sh）：用 tool_requires(automake/1.18 + libtool/2.5.4) 在 CI 内自举 aclocal/autoconf/autoheader/automake，不随配方提交生成物（R6）"
    - "libvpd_cxx_la_LDFLAGS 硬编码 -lstdc++，OHOS sysroot 只有 libc++，必须改为 -lc++"
    - "automake/1.18 自带的 config.sub 已原生识别 aarch64-linux-ohos，无需再随配方携带 config.guess/config.sub 覆盖"
    - "依赖 sqlite3 不在 OHOS sysroot，需由 conan 从制品仓提供（AutotoolsDeps 注入 -I/-L）"
    - "安装钩子 install-exec-hook 会写 udev/rules.d 与 var/lib/lsvpd（OHOS 无 udev）：configure 加 --sysconfdir/--localstatedir 收敛到 prefix 内"

  common_dependencies:
    - sqlite3

versions:
  "2.2.9":
    status: built
    build_date: 2026-09-27
