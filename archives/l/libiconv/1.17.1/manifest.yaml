knowledge_gained:
  - "本版本是 libiconv 1.17 的适配修复版本，版本号使用 1.17.1。"
  - "旧制品保留 libtool .la 文件，其中含构建机绝对路径和 libdir='//lib'，会误导 Autotools 消费者并造成运行时链接/检测失败。"
  - "package() 安装后删除 lib/*.la；静态归档和头文件仍完整保留。"
  - "消费者测试覆盖 UTF-8→ASCII、EUC-KR→UTF-8、UTF-8→ISO-2022-JP，针对 GMime 失败场景回归。"

