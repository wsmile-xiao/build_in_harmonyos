software: luasocket
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-15"

# 构建系统类型 (顶层字段，自检需要)
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/lunarmodules/luasocket/archive/refs/tags/v2.0.2.tar.gz"

  # 源码校验和
  sha256: "4861d1d6589462ac638c8d096085e7b4fe12bb90263c84e13bac5c89b0b67475"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "LD=clang"
    - 'LUAINC=-I<lua/5.1 include>'
    - "CFLAGS=-I<lua_inc> -DLUASOCKET_DEBUG -Wall -O2 -fPIC"
    - "LDFLAGS=-O -shared -fPIC"
  # 注: LUAINC 由 Conan 配方从依赖自动获取；2.0.2 无平台目标（非 3.x 的 make linux）

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua/5.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  total: 11
  passed: 7
  failed: 0
  skipped: 4
  note: >
    上游测试真跑：urltest/mimetest/ltn12test/stufftest/excepttest（纯逻辑）
    + testclnt+testsrvr（回环 TCP/UDP 真实网络 I/O，278 行日志 33 个 ok）
    全部通过；httptest/ftptest/smtptest/dicttest/tftptest 需活的外部
    服务器（HTTP/FTP/SMTP/DICT/TFTP），离线环境豁免。

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "luasocket 2.0.2 与 3.x make 变量命名不同：CC/LD/LUAINC（非 CC_linux 等），无平台目标直接 make all"
  - "install 用 INSTALL_TOP_SHARE/INSTALL_TOP_LIB 变量（非 3.x 的 DESTDIR+prefix+install-unix）"
  - "HarmonyOS 上 CMake ENABLE_EXPORTS 不生效（未知平台），静态 Lua + dlopen 扩展需显式 -rdynamic"
  - "Lua 5.1 扩展模块不链 -llua，Lua 符号由宿主在 dlopen 时解析"
  - "2.0.2 的 url 是独立模块 require('socket.url')，port 返回字符串（3.x 才是数字）"

knowledge_ref: []
