# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: luasocket/2.0.2
homepage: "https://github.com/lunarmodules/luasocket"

# 上游测试命令
upstream_check_command: "lua test/*.lua (needs live network services: http/ftp/smtp servers)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/urltest.lua
    source: luasocket-2.0.2/test/urltest.lua
    description: "URL parse/build round-trip tests (pure logic, no network)"
    command: "lua test/urltest.lua"
  - file: test/mimetest.lua
    source: luasocket-2.0.2/test/mimetest.lua
    description: "MIME b64/qp encode-decode round-trip tests (local files, no network)"
    command: "lua test/mimetest.lua"
  - file: test/ltn12test.lua
    source: luasocket-2.0.2/test/ltn12test.lua
    description: "LTN12 pump/filter/sink/source tests (pure logic, no network)"
    command: "lua test/ltn12test.lua"
  - file: test/stufftest.lua
    source: luasocket-2.0.2/test/stufftest.lua
    description: "HTTP stuff (headers) tests (pure logic, no network)"
    command: "lua test/stufftest.lua"
  - file: test/excepttest.lua
    source: luasocket-2.0.2/test/excepttest.lua
    description: "Exception (protected call) tests (pure logic, no network)"
    command: "lua test/excepttest.lua"
  - file: test/httptest.lua
    source: luasocket-2.0.2/test/httptest.lua
    description: "HTTP client tests (requires live network HTTP server - not runnable offline)"
    command: "lua test/httptest.lua"
  - file: test/ftptest.lua
    source: luasocket-2.0.2/test/ftptest.lua
    description: "FTP client tests (requires live network FTP server - not runnable offline)"
    command: "lua test/ftptest.lua"
  - file: test/smtptest.lua
    source: luasocket-2.0.2/test/smtptest.lua
    description: "SMTP client tests (requires live network SMTP server - not runnable offline)"
    command: "lua test/smtptest.lua"
  - file: test/dicttest.lua
    source: luasocket-2.0.2/test/dicttest.lua
    description: "DICT protocol tests (requires live network DICT server - not runnable offline)"
    command: "lua test/dicttest.lua"
  - file: test/tftptest.lua
    source: luasocket-2.0.2/test/tftptest.lua
    description: "TFTP client tests (requires live network TFTP server - not runnable offline)"
    command: "lua test/tftptest.lua"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Embeds Lua 5.1, loads socket/mime/socket.url/ltn12/socket.http via require(), tests TCP+UDP socket creation, DNS lookup, MIME base64 round-trip, URL parse/build"
    command: "./test_luasocket <package_folder>"

# 测试断言总数 (近似值)
assertion_count: 24
