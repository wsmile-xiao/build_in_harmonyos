software: libxslt
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.39/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.39"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.39.tar.xz"

  # 源码校验和
  sha256: "2a20ad621148339b0759c4d4e96719362dee64c9a096dbba625ba053846349f0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--without-python"  # 禁用 Python 绑定，避免需要 python-dev
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    runtime:
      - name: libxml2
        version: "2.15.3"
        constraint: ">= 2.9.0"
    build:
      - name: pkg-config
        version: "0.29.2"
      - name: libxml2
        version: "2.15.3"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-aclocal.m4.patch"
  - "0002-config.guess.patch"
  - "0003-config.sub.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E007: config.guess 平台识别 - 添加 HarmonyOS 系统识别分支，输出 aarch64-unknown-linux-ohos 三元组"
  - "E072: config.sub 三元组验证 - 添加 3 处 OpenHarmony 支持（basic_os 映射、OS 白名单、kernel-os 白名单）"
  - "libxml2 静态链接：编译时 libxml2 被静态链接到 libxslt.so 中，不存在运行时 libxml2.so 依赖问题"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libxslt-1.1.39.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libxslt-1.1.39.work
  source_orig_hash: aba179ba8a5db633
  source_work_hash: 0ebbf4101fc63e2b
  generated_at: '2026-05-21T19:51:09'
  patches_count: 3

patch_classification:
  - file: 0001-aclocal.m4.patch
    type: auto
    platform_only: True
    guard: 'verified'
  - file: 0002-config.guess.patch
    type: auto
    platform_only: True
    guard: 'verified'
  - file: 0003-config.sub.patch
    type: auto
    platform_only: True
    guard: 'verified'

