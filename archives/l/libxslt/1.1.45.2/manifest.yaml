software: libxslt
version: "1.1.45.2"
status: adapted
build_date: "2026-08-17"
build_system: cmake
conan_ref: "libxslt/1.1.45.2"

source:
  url: "https://github.com/GNOME/libxslt/archive/refs/tags/v1.1.45.tar.gz"
  sha256: "023900618fbf789dba364f38f184a0fe2d3ebad2b2ab06003ffd2d1ee2d5461c"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DLIBXSLT_WITH_PROGRAMS=ON"
    - "-DLIBXSLT_WITH_DEBUGGER=ON"
    - "-DLIBXSLT_WITH_CRYPTO=OFF"
    - "-DLIBXSLT_WITH_PYTHON=OFF"
    - "-DLIBXSLT_WITH_TESTS=OFF"
  dependencies:
    - "libxml2/2.15.3"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libslax 3.1.6 requires libxslt debugger APIs that are absent when LIBXSLT_WITH_DEBUGGER is disabled"
  - "Upstream libxslt 1.1.45 provides LIBXSLT_WITH_DEBUGGER and enables the required implementations without source patching"
  - "HarmonyOS native clang successfully builds libxslt with debugger support enabled"
  - "The debugger-enabled static library exports xsltSetDebuggerStatus, xsltSetDebuggerCallbacks, and xslHandleDebugger"
  - "The existing xsltproc capability is retained for compatibility with current consumers"
