# test_package/MANIFEST.yml — libfdk 2.0.3
package: libfdk/2.0.3
homepage: "https://github.com/mstorsjo/fdk-aac"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "fdk-aac-2.0.3.tar.gz"
  source_sha256: "829b6b89eef382409cda6857fd82af84fabb63417b08ede9ea7a553f811cb79e"
  source_url: "https://downloads.sourceforge.net/project/opencore-amr/fdk-aac/fdk-aac-2.0.3.tar.gz"
  upstream_repo: "https://github.com/mstorsjo/fdk-aac"
  upstream_tag: "v2.0.3"
  build_system: "CMake (upstream also ships autotools)"
  test_definition: "test/run-test.sh defines 2 ref comparisons: Sample01_4.wav stereo + derived mono, each via test-encode-decode binary and diff against test/ref-stereo.txt and test/ref-mono.txt"
  test_sources:
    - "test/run-test.sh"
    - "test/ref-stereo.txt"
    - "test/ref-mono.txt"
    - "test-encode-decode.c"
    - "wavreader.c"
  registration: "No ctest/gtest/pytest wiring: CMakeLists.txt has no enable_testing or add_test; Makefile.am has no TESTS/check_PROGRAMS/check-local; configure.ac has no test dir. run-test.sh is the only harness."
  offline_blockers: "run-test.sh requires curl media.xiph.org Sample01_4.wav (md5 a5c105544c64ce92c6c5c06d280e6b9c) plus ffmpeg to derive mono (md5 3bfccac9f2e527ba3ef888874f09a409); sealed CI has neither network fixture nor ffmpeg, so the script cannot run verbatim"
  offline_mirror: "test_package/test_libfdk.c roundtrip-mono and roundtrip-stereo synthesize square-wave PCM in memory and drive the same public API path as test-encode-decode.c (AAC-LC AOT=2 44100Hz 64kbit afterburner 1, RAW transmux, ConfigRaw + Fill + DecodeFrame), asserting encoded bytes > 0 and decoded samples > 0"
  portability_changes: []
  examples_note: "BUILD_PROGRAMS=OFF keeps the package library-only; aac-enc and test-encode-decode are build-time only and not installed, so no commands.json is required."

upstream_check_command: "test/run-test.sh (2 ref comparisons: stereo + mono)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - test_name: "stereo encode-decode vs ref"
    source: "test/run-test.sh + test/ref-stereo.txt"
    description: "test-encode-decode Sample01_4.wav stereo across AAC-LC/HE-AAC/HE-AACv2/ELD configs, diff log vs ref-stereo.txt"
    command: "./test-encode-decode Sample01_4.wav"
    mirror: "test_libfdk roundtrip-stereo (synthetic stereo PCM, AAC-LC 64k)"
  - test_name: "mono encode-decode vs ref"
    source: "test/run-test.sh + test/ref-mono.txt"
    description: "test-encode-decode Sample01_4-mono.wav across AAC-LC/LD/ELD configs, diff log vs ref-mono.txt"
    command: "./test-encode-decode Sample01_4-mono.wav"
    mirror: "test_libfdk roundtrip-mono (synthetic mono PCM, AAC-LC 64k)"

upstream_test_total: 2
upstream_test_count_method: "auto"
upstream_test_passed: 2
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_test_note: "Counts come from test/run-test.sh (2 diff invocations). Sealed-CI counts come from the offline mirror (roundtrip-mono + roundtrip-stereo) using the same codec path; no string counting."

test_package_tests:
  - file: test_libfdk.c
    scenario: "encoder_open_close"
    description: "Open AAC-LC encoder, set AOT/samplerate/channelmode/bitrate/transmux/afterburner, init, fetch info, close"
    command: "./test_libfdk encoder"
    assertions: 3
  - file: test_libfdk.c
    scenario: "decoder_open_close"
    description: "Open RAW decoder and close, verifying link and handle lifecycle"
    command: "./test_libfdk decoder"
    assertions: 1
  - file: test_libfdk.c
    scenario: "roundtrip_mono"
    description: "Synthetic mono square-wave PCM AAC-LC 64k encode then RAW decode, asserting bytes and samples non-empty"
    command: "./test_libfdk roundtrip-mono"
    assertions: 4
  - file: test_libfdk.c
    scenario: "roundtrip_stereo"
    description: "Synthetic stereo square-wave PCM AAC-LC 64k encode then RAW decode, asserting bytes and samples non-empty"
    command: "./test_libfdk roundtrip-stereo"
    assertions: 4

assertion_count: 12
test_package_test_count: 4
test_package_test_passed: 4
test_package_test_failed: 0
test_package_test_pass_rate: "4/4 (100%)"
