knowledge_gained:
  - "构建期 host 工具交叉坑:libatasmart 的 Makefile 无条件编译并执行 strpool(生成 atasmart.strpool.c);交叉时 strpool 被目标链编译却要在构建机运行必挂——tarball 已自带生成产物时,最小解 = patch Makefile.in 把生成规则 noop(而非引入 CC_FOR_BUILD 工具链)"
  - "pool 已移除的 Debian 包经 snapshot.debian.org 取回:先 /package/<pkg>/<ver>/ 页面找 /archive/debian/<时间点>/pool/... 直链,两个不同时间点路径即同字节双源"
  - "libatasmart 0.19 纯 C 零第三方依赖;configure/make 在 glibc 主机实测通过,无 musl 专属补丁需求"
