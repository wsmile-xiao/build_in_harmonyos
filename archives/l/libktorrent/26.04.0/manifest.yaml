# 版本级 manifest
# 文件位置: archives/l/libktorrent/26.04.0/manifest.yaml

version: "26.04.0"
software: "libktorrent"
status: built
build_date: "2026-09-20"
build_system: "cmake"
conan_ref: "libktorrent/26.04.0"

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/libktorrent-26.04.0.tar.xz"
  sha256: "4c7ef4b7416fcedf9d1ca8b759cae8ee0cd4254dca80e3978753399445dcf008"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "BUILD_TESTING=ON（38 个上游 ecm_add_test 全注册全执行）"
    - "USE_CRYPTO_BACKEND=LibGcrypt（openssl 3.5.6.1 静态包无 legacy provider，RC4 不可用）"
    - "CMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE"
    - "WITH_XFS=OFF（XFS 预分配探测 linux 专属头）"
    - "KF_SKIP_PO_PROCESSING=ON / KF_IGNORE_PLATFORM_CHECK=TRUE（audiocd/kgoldrunner 先例）"
  dependencies:
    - qtbase/6.11.1
    - karchive/6.26.0
    - kconfig/6.26.0（ConfigCore: KSharedConfig）
    - kcrash/6.26.0
    - ki18n/6.26.0
    - kio/6.26.0（KIOCORE_ONLY 基线）
    - solid/6.26.0
    - boost/1.90.0.3（header-only: align/smart_ptr/circular_buffer）
    - gmp/6.3.0.1
    - libgcrypt/1.12.2（crypto 后端：ARCFOUR/RC4）
    - libgpg-error/1.55（gcrypt.h 依赖 gpg-error.h）
  build_dependencies:
    - ecm/6.26.0
  cc: clang
  cxx: clang++
  crypto_backend: "LibGcrypt"

test:
  upstream_tests_registered: 38
  upstream_tests_executed: 38
  upstream_tests_passed: 38
  upstream_tests_failed: 0
  upstream_test_command: "ctest --timeout 90（QT_QPA_PLATFORM=offscreen + LD_LIBRARY_PATH 全依赖链）"
  test_package: "通过（bencode round-trip + SHA-1 + version API 消费者验证）"

patches:
  - "0001-ohos-kiocore-only.patch"

notes: >
  上游 38 个 ecm_add_test 全部注册并全部通过（100%）。KIOWidgets 裁剪至
  KIOCore-only 基线（kio 6.26.0 包形态）；crypto 后端切 LibGcrypt（openssl
  静态包无 legacy provider 导致 InitLibKTorrent 必败的替代路径）。
