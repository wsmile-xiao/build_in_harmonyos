software: libmanticore-columnar
display: "Manticore Columnar Library"
description: "面向列的存储和二级索引库，用于 Manticore Search 的高性能低内存占用存储方案"
category: db
homepage: "https://manticoresearch.com"
license: Apache-2.0
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "CMake 项目需要添加 SIMDe 支持以处理 ARM SIMD"
    - "FastPFORConfig.cmake 路径修复为相对路径"
    - "Embeddings 库可选（未找到时不阻塞安装）"
  common_dependencies: []

# 版本索引
versions:
  "13.0.0":
    status: published
    build_date: "2026-06-03"