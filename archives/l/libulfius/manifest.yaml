software: libulfius
display: "Ulfius"
description: "REST C framework (HTTP endpoints, client requests, websocket) — the endpoint of the babelouest stack"
homepage: "https://github.com/babelouest/ulfius/"
license: "LGPL-2.1-or-later"
build_system: cmake

ohos_adaptation:
  key_points:
    - "REST C framework; runtime deps = orcania + libyder + jansson + libmicrohttpd + gnutls + zlib + curl (all from ohpcd, W0 verified)"
    - "CMakeDeps target case mismatch (upstream GnuTLS::GnuTLS/MHD::MHD/Jansson::Jansson vs conan gnutls::gnutls/libmicrohttpd::libmicrohttpd/jansson::jansson): portability patch prefers the CMakeDeps targets which carry the complete static transitive closures, falls back to the bundled find-modules"
    - "BUILD_STATIC=ON: the conan CMakeDeps package exports only the *-static targets for orcania/yder, so the unconditionally built shared target must link them too"
    - "No certtool on OHOS: upstream test/cert/create-cert.sh executed with the certtool shipped inside the conan gnutls package (PATH + LD_LIBRARY_PATH injection)"
    - "framework tests use localhost loopback only (pthread-built socket servers) — no external network needed"
    - "uwsc CLI tool trimmed (BUILD_UWSC=OFF); library websocket functionality fully retained"
    - "Test suite (check/0.15.2, ohpcd) runs the 88 upstream check cases (core 13 + u_map 9 + framework 28 + example_callbacks 25 + websocket 13) inside conan create"
  common_dependencies:
    - orcania
    - libyder
    - jansson
    - libmicrohttpd
    - gnutls
    - zlib
    - curl

versions:
  "2.7.15":
    status: built
    build_date: "2026-09-19"
    notes: "Initial OHOS aarch64 adaptation. 88/88 upstream check cases (core/u_map/framework/example_callbacks/websocket) pass inside conan create. Portability patch only (CMake wiring); upstream assertions untouched."
