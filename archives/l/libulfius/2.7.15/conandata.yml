patches:
  "2.7.15":
    - patch_file: "patches/0001-ohos-portability.patch"
      patch_description: "OHOS portability: (1) prefer the Conan CMakeDeps targets (gnutls::gnutls, libmicrohttpd::libmicrohttpd, jansson::jansson, zlib::zlib, CURL::libcurl) which carry the complete transitive link closures, falling back to the upstream bundled find-modules (MODULE mode) otherwise; (2) accept the camel-case Orcania/Yder VERSION_STRING that Conan CMakeDeps exports in the upstream version gates; (3) under BUILD_STATIC=ON the conan package only exports the *-static targets, so the unconditionally built shared target must link them too or the bare names resolve to nothing and the compile loses the include dirs; (4) force find_package(Check MODULE) so the bundled FindCheck.cmake runs under CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON; (5) relax the Subunit hard requirement for the test tree (ohpcd libcheck is self-contained, same relaxation as orcania/libyder/libhoel); (6) link the tests against the actual library target (ulfius_static) under BUILD_STATIC. Upstream test assertions keep their expected results."
      patch_type: portability
