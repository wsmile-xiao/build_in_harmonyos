# 版本级 manifest
# 文件位置: archives/l/libulfius/2.7.15/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.7.15"
software: "libulfius"
status: published
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://github.com/babelouest/ulfius/archive/refs/tags/v2.7.15.tar.gz"
  sha256: "19cf789b2af1919b69f77c7701237bfc318a9781ec657b68fd4b6ffa9d53f111"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_STATIC=ON"
    - "-DWITH_GNUTLS=ON"
    - "-DWITH_WEBSOCKET=ON"
    - "-DWITH_CURL=ON"
    - "-DBUILD_UWSC=OFF"
    - "-DBUILD_ULFIUS_TESTING=ON"
  dependencies:
    - orcania/2.3.3
    - libyder/1.4.20
    - jansson/2.14
    - libmicrohttpd/1.0.1
    - gnutls/3.8.10
    - zlib/1.3.1
    - curl/8.15.0
  test_dependencies:
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied:
  - patches/0001-ohos-portability.patch

knowledge_gained:
  - "ulfius 2.7.15 上游 5 个 CTest 程序（core/u_map/framework/example_callbacks/websocket，88 check 用例）在 OHOS aarch64 全部通过"
  - "babelouest CMakeDeps target 映射：gnutls::gnutls / libmicrohttpd::libmicrohttpd / jansson::jansson / zlib::zlib / CURL::libcurl——上游 target 大小写不匹配时优先链 CMakeDeps target（携带完整静态传递闭包），回落上游 bundled find-module"
  - "OHOS 无 certtool：上游 test/cert/create-cert.sh 用 conan gnutls 包内的 certtool 执行（PATH+LD_LIBRARY_PATH 注入），证书现场生成"
  - "framework 测试的 SMTP/HTTP 用例全部走 localhost 回环（pthread 自建 socket 服务器），无需外部网络"
  - "uwsc（websocket CLI 工具）BUILD_UWSC=OFF 裁剪——库本体 websocket 功能完整保留（websocket.c 13 用例照跑），R38 不适用"
