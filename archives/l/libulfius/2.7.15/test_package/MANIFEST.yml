# test_package/MANIFEST.yml - libulfius 2.7.15
# CI L0e requires this file to exist. Upstream test declaration (rule 4:
# no fabricated pass rates — every number below is backed by the conan create
# build log which builds + runs the unmodified upstream check suite).

package: libulfius/2.7.15
homepage: "https://github.com/babelouest/ulfius/"

# Upstream v2.7.15 exposes a CTest suite via BUILD_ULFIUS_TESTING=ON
# (Check framework; test/core.c 13 cases, test/u_map.c 9 cases,
# test/framework.c 28 cases, test/example_callbacks.c 25 cases,
# test/websocket.c 13 cases — 88 START_TEST cases in 5 executables).
# The recipe's conanfile.py build() enables it and runs ctest against the
# unmodified upstream tests.
upstream_check_command: "ctest --test-dir build --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build --output-on-failure"

# The official upstream check suites. 85/88 cases pass on OHOS aarch64
# inside conan create. The 3 exempted cases fail deterministically because
# the ohpcd libmicrohttpd/1.0.1 package is built with its optional HTTPS
# (gnutls) support OFF (verified: zero gnutls symbols in
# libmicrohttpd.a) — every ulfius_start_secure_* path therefore returns
# U_ERROR_LIBMHD on this dependency set:
#   - core:test_ulfius_start_instance (TLS segment; the plain-HTTP
#     segments of the same case pass before the secure assertion)
#   - framework:test_ulfius_server_ca_trust
#   - framework:test_ulfius_client_certificate
upstream_tests:
  - file: test/core.c
    source: ulfius-2.7.15/test/core.c
    description: "upstream core check suite: 13 START_TEST cases in the core CTest executable (instance init/clean, request/response structures, u_map bindings, endpoint management, url encode/decode)"
    command: "./core"
  - file: test/u_map.c
    source: ulfius-2.7.15/test/u_map.c
    description: "upstream u_map check suite: 9 START_TEST cases in the u_map CTest executable (map get/set/enum/remove)"
    command: "./u_map"
  - file: test/framework.c
    source: ulfius-2.7.15/test/framework.c
    description: "upstream framework check suite: 28 START_TEST cases in the framework CTest executable running real loopback ulfius instances (endpoint callbacks incl. stream, multiple handlers, injection, SMTP round trip on a pthread socket server, large posts, post processor, send_http_request, 2 TLS server cases exempted per the MHD HTTPS limitation above)"
    command: "./framework"
  - file: test/example_callbacks.c
    source: ulfius-2.7.15/test/example_callbacks.c
    description: "upstream example_callbacks check suite: 25 START_TEST cases in the example_callbacks CTest executable (http_compression and static_compressed_inmemory_website callback modules)"
    command: "./example_callbacks"
  - file: test/websocket.c
    source: ulfius-2.7.15/test/websocket.c
    description: "upstream websocket check suite: 13 START_TEST cases in the websocket CTest executable (client connections, extensions incl. permessage-deflate, keep_messages, origin, json messages)"
    command: "./websocket"

# test_package tests (consumer perspective: link Ulfius::Ulfius-static and
# exercise the public API on OHOS aarch64) — HarmonyOS-added validation.
test_package_tests:
  - file: src/test_ulfius.c
    description: "Compile + link consumer that starts a real ulfius HTTP endpoint on a loopback port via ulfius_start_framework (MHD engine), sends a request with ulfius_send_http_request (curl-backed client) and asserts the callback response body round-trips (status 200 + body match)"
    command: "./test_ulfius"

# HarmonyOS-added consumer assertions (4 API check groups in a single run:
# instance init + endpoint registration, framework start, client request
# round trip with status+body verification, framework stop + instance
# cleanup). The 88 upstream check cases are tracked separately in
# upstream_tests above.
assertion_count: 4
