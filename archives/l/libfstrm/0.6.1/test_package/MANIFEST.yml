# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libfstrm/0.6.1
homepage: "https://github.com/farsightsec/fstrm"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（make check 实测 9 项：7 PASS / 2 FAIL）
# FAIL 均为 OHOS SELinux 限制 AF_UNIX bind（知识 E024，平台限制；TCP 等价用例 PASS）
upstream_tests:
  - file: t/test_control
    source: libfstrm-0.6.1/t/test_control.c
    description: "控制消息编解码单元测试"
    command: "./t/test_control"
  - file: t/test_queue
    source: libfstrm-0.6.1/t/test_queue.c
    description: "无锁环形队列单元测试"
    command: "./t/test_queue"
  - file: t/test_fstrm_io_file
    source: libfstrm-0.6.1/t/test_fstrm_io_file.c
    description: "文件 I/O 读写、往返测试"
    command: "./t/test_fstrm_io_file"
  - file: t/test_fstrm_io_sock
    source: libfstrm-0.6.1/t/test_fstrm_io_sock.c
    description: "TCP socket I/O 读写测试（AF_INET 127.0.0.1）"
    command: "./t/test_fstrm_io_sock"
  - file: t/test_writer_hello
    source: libfstrm-0.6.1/t/test_writer_hello.c
    description: "writer hello 内容类型协商测试"
    command: "./t/test_writer_hello"
  - file: t/test_file_hello
    source: libfstrm-0.6.1/t/test_file_hello.c
    description: "文件 hello 内容类型协商测试"
    command: "./t/test_file_hello"
  - file: t/program_tests/test_fstrm_dump
    source: libfstrm-0.6.1/t/program_tests/test_fstrm_dump.sh
    description: "fstrm_dump 程序端到端测试（文件通道）"
    command: "./t/program_tests/test_fstrm_dump.sh"
  - file: t/program_tests/test_fstrm_replay
    source: libfstrm-0.6.1/t/program_tests/test_fstrm_replay.sh
    description: "fstrm_replay 程序测试（tcp 段 PASS；unix 段因 SELinux AF_UNIX 限制 FAIL）"
    command: "./t/program_tests/test_fstrm_replay.sh"
  - file: t/run_test_fstrm_io_unix.sh
    source: libfstrm-0.6.1/t/run_test_fstrm_io_unix.sh
    description: "AF_UNIX socket I/O 测试（OHOS SELinux 禁止 bind，平台限制 FAIL）"
    command: "./t/run_test_fstrm_io_unix.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "libfstrm 文件往返测试：写入 2 帧经 fstrm_file_writer，fstrm_file_reader 读回校验内容"
    command: "./test_libfstrm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 26