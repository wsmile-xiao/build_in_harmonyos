# 版本级 manifest
# 文件位置: archives/l/libfstrm/0.6.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.6.1"

# 软件名
software: "libfstrm"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（farsightsec/fstrm 官方 tag 归档；libfstrm 为包名）
  url: "https://github.com/farsightsec/fstrm/archive/refs/tags/v0.6.1.tar.gz"

  # 源码校验和
  sha256: "4f0f7ad2b760119c441aba58271e84de683b3cc138530d02710896641866e2d2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
  - "--build=aarch64-unknown-linux-ohos"
  - "--host=aarch64-unknown-linux-ohos"
  - "--disable-programs"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无源码补丁；配方内运行 autoreconf 自举 + umask 修补）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "GitHub tag archive 不含 configure，conan 配方需 tool_requires automake/libtool 并 autoreconf 自举"
- "config.guess 无法识别 HarmonyOS（uname -s=HarmonyOS），configure 需显式 --build/--host=aarch64-unknown-linux-ohos"
- "HMDFS umask 077 使 config.status 临时目录不可写（E011/E114），autoreconf 后须将 configure 中 umask 077 改为 022"
- "make check 的 AF_UNIX 用例在 OHOS SELinux 下 bind 受限（E024），TCP 等价用例通过，属平台限制非库缺陷"
