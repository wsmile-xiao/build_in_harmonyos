version: "1.1.0"
status: built
build_date: "2026-09-21"

source:
  url: "https://github.com/google/liquidfun/archive/refs/tags/v1.1.0.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "LIQUIDFUN_HEADLESS（patch 注入的顶层 CMakeLists 固化：关闭 examples/unittests 目标，库本体全编）"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-add-headless-cmakelists.patch"

knowledge_gained:
  - "liquidfun v1.1.0 = Box2D 2.3.0 vendored 全量内置（liquidfun/Box2D/Box2D/ 54 源文件）+ Google 粒子系统扩展——与仓内 box2d/2.4.1 独立 API 线，不构成依赖"
  - "上游构建树三大坑：cmake-2.8 老式 + -Wall -Werror（2014 代码在新 clang 触发 -Wshift-negative-value）+ add_subdirectory(Unittests) 大小写错（真名 UnitTests，大小写敏感 FS 必挂）——弃用上游树，patch 注入自写顶层 CMakeLists 直接编源"
  - "上游 include 布局：源码 #include <Box2D/...>，include 根=liquidfun/Box2D（Box2D.h 的父目录），install 时头文件保 Box2D/ 前缀相对路径"
  - "上游测试：13 个 test_executable 注册（Unittests/CMakeLists.txt），179 个 gtest TEST 宏（源码实测计数）；gtest 用 vendored sibling（tarball 根 googletest/），测试工程由配方 build() 动态生成 CMake 装载"
  - "OHOS 跑测试二进制：bash 包装（mksh 不能 exec OHOS ELF）——13 个 gtest 二进制逐个 bash -c 执行，任一非零退出即构建失败"
