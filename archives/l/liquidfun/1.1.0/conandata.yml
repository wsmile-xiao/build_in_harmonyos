sources:
  # 镜像列表形态：官方源 + GitHub 加速镜像（conan 2 原生按序多源尝试，
  # 网络波动自愈；SDL2 2.30.10 / soloud version_1_0 同款打法）
  url:
    - "https://github.com/google/liquidfun/archive/refs/tags/v1.1.0.tar.gz"
    - "https://ghfast.top/https://github.com/google/liquidfun/archive/refs/tags/v1.1.0.tar.gz"
    - "https://gh-proxy.com/https://github.com/google/liquidfun/archive/refs/tags/v1.1.0.tar.gz"
  sha256: "b7ae0d3dc8e21e91b276c25629e5bbd294187a9e32b4628ee13177d7025dd486"

patches:
  - patch_file: "patches/0001-add-headless-cmakelists.patch"
    patch_description: "add headless top-level CMakeLists.txt (upstream tree is cmake-2.8 era with -Werror and a case-broken Unittests reference; builds all 54 sources under liquidfun/Box2D/Box2D, installs headers in upstream include/Box2D layout)"
    patch_type: "portability"
