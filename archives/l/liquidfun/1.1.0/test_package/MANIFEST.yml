package: liquidfun/1.1.0
homepage: "https://google.github.io/liquidfun/"

upstream_check_command: "ls liquidfun/Box2D/UnitTests"
upstream_test_in_build: true
upstream_test_command: "ctest/upstream gtest binaries via recipe build()"

upstream_tests:
  - file: liquidfun/Box2D/UnitTests/*/*Tests.cpp
    description: "13 gtest test binaries (BlockAllocator/BodyContacts/Callback/Color/Common/Confinement/Conservation/FreeList/Function/HelloWorld/IntrusiveList/SlabAllocator/TrackedBlock), 179 TEST cases total, built against the vendored googletest sibling and executed during conan build()"
    command: "./build/upstream-tests/*Tests (bash-wrapped)"

test_package_tests:
  - file: test.cpp
    description: "Consumer smoke: b2World gravity step on a falling box + b2ParticleSystem pool (particle count, finite positions, fall verification)"
    command: "./test_liquidfun"

assertion_count: 179
