software: lgogdownloader
display: "LGOGDownloader"
description: "非官方 GOG.com 游戏下载器（GOG Galaxy API 命令行客户端）"
category: utility
homepage: "https://github.com/Sude-/lgogdownloader"
license: WTFPL
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 CMakeLists 依赖自带 Find*.cmake（pkg-config + FOO_INCLUDE_DIRS/FOO_LIBRARIES 变量）；鸿蒙改用 ConanDeps 导入目标（Boost::*/CURL::libcurl/JsonCpp::JsonCpp/tinyxml2::tinyxml2/rhash::rhash/ZLIB::ZLIB/Tidy::Tidy），由 patches/0001 完成"
    - "Boost.Iostreams 需带 zlib 过滤器，故选 boost/1.85.0（1.90/1.91 系列显式 BOOST_IOSTREAMS_ENABLE_ZLIB=False 不可用）"
    - "boost/1.85.0 基于 zlib/1.3.1，curl 基于 zlib/1.3.1.1，用 override 统一到 zlib/1.3.1.1（zlib ABI 稳定）"
    - "禁用 Qt GUI（-DUSE_QT_GUI=OFF，默认可不传），保持依赖闭包最小"
  common_dependencies:
    - boost
    - curl
    - jsoncpp
    - tinyxml2
    - rhash
    - tidy-html5
    - zlib

versions:
  "3.18":
    status: built
    build_date: "2026-09-27"
