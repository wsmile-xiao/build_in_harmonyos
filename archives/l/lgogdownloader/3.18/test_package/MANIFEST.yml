# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试清点结论：lgogdownloader 3.18 不含任何自动化测试套件——
# 源码树无 tests/ 目录，CMakeLists.txt 未调用 enable_testing()/add_test()，
# 无 ctest/pytest/meson 测试入口。上游唯一的自动化验证是 GitHub Actions
# 的 .github/workflows/linux.yml：完成 release 构建后执行
# `cd build && ./lgogdownloader --help`（冒烟）。因此上游用例数 = 0，
# 该冒烟已在本配方 build() 中集成（can_run 时执行 --version/--help）。

package: lgogdownloader/3.18
homepage: "https://github.com/Sude-/lgogdownloader"

# 上游测试命令（无自动化测试套件，故为空）
upstream_check_command: ""

# conanfile.py build() 方法中已集成上游的冒烟验证
upstream_test_in_build: true
upstream_test_command: "./lgogdownloader --version && ./lgogdownloader --help"

# 上游实际运行的测试程序（上游无独立测试套件）
upstream_tests: []

# test_package 中自带的测试（消费者视角 + 鸿蒙平台专项验证）
test_package_tests:
  - file: test_lgogdownloader.sh
    description: "消费者测试: --version 版本串 / --help CLI 表面 / 非法选项退出码"
    command: "bash test_lgogdownloader.sh <binary> <work_dir> <log>"
  - file: ohos_specific_test.sh
    description: "鸿蒙专项测试: AArch64 ELF 架构 / HarmonyOS 平台标识 / XDG 配置路径解析"
    command: "bash ohos_specific_test.sh <binary> <work_dir> <log>"

# 测试断言总数（上游 0 条自动化用例；适配后 9 条消费者/鸿蒙专项断言）
assertion_count: 9
