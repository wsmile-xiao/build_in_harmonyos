software: libucl
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/vstakhov/libucl/archive/refs/tags/0.9.4.tar.gz"

  # 源码校验和
  sha256: "319d8ff13441f55d91cd7f3708a54bd03779733e26958c2346c5109014520aaf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DBUILD_SHARED_LIBS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libucl 源码同时包含 autotools(configure.ac/Makefile.am) 和 cmake(CMakeLists.txt) 构建系统，实际应使用 CMake"
  - "conan-init 默认按 registry 记录的构建系统生成模板，若与实际不符需手动修正 conanfile.py"
  - "CMake target 名为 ucl（非 libucl），package_info.libs 必须写 [\"ucl\"]"
  - "CMake 在 HarmonyOS 上输出 'System is unknown' 警告但不影响构建（E092）"
  - "test_schema 测试脚本硬编码 /tmp 路径，鸿蒙 /tmp 只读导致失败（E002 平台陷阱）"
  - "libucl 0.9.4 无外部依赖，自包含 uthash/klib 等内嵌库"
