package: libucl/0.9.2
homepage: "https://github.com/vstakhov/libucl"

upstream_check_command: "make check"
upstream_test_in_build: false
# The recipe uses CMake and does not execute Autotools tests in build().
# Adaptation verification builds the six upstream test binaries against the
# CMake-built static library, then invokes the upstream shell scripts below.
upstream_test_command: "CMake-build test binaries; execute tests/{basic,generate,schema,msgpack,speed}.test"

# tests/Makefile.am registers five unique make-check suites (msgpack.test is
# listed twice upstream). streamline.test is an additional upstream script that
# is present in the source tree but is not registered by make check.
# schema.test is first run unchanged; its hard-coded /tmp output fails on OHOS,
# so the same test_schema binary is then invoked once per schema input (25/25).
# streamline.test is run unchanged; its one-argument invocation exposes an
# upstream argc parsing defect, while its stdout matches streamline.res.
# Complete commands and results are recorded in reports/test-report.md.
upstream_tests:
  - file: tests/basic.test
    source: libucl-0.9.2/tests/basic.test
    description: "Basic parser and emitter cases plus output modes"
    command: "TEST_DIR=tests TEST_OUT_DIR=build/tests TEST_BINARY_DIR=build/tests sh tests/basic.test"
  - file: tests/generate.test
    source: libucl-0.9.2/tests/generate.test
    description: "Generated configuration output comparison"
    command: "TEST_DIR=tests TEST_OUT_DIR=build/tests TEST_BINARY_DIR=build/tests sh tests/generate.test"
  - file: tests/schema.test
    source: libucl-0.9.2/tests/schema.test
    description: "JSON schema validation suite (25 schemas; original script fails only on read-only /tmp, equivalent binary invocation passes 25/25)"
    command: "set -e; for f in tests/schema/*.json; do build/tests/test_schema < \"$f\"; done"
  - file: tests/msgpack.test
    source: libucl-0.9.2/tests/msgpack.test
    description: "MessagePack parser test"
    command: "TEST_DIR=tests TEST_OUT_DIR=build/tests TEST_BINARY_DIR=build/tests sh tests/msgpack.test"
  - file: tests/speed.test
    source: libucl-0.9.2/tests/speed.test
    description: "Compressed reference input benchmark"
    command: "TEST_DIR=tests TEST_OUT_DIR=build/tests TEST_BINARY_DIR=build/tests sh tests/speed.test"
additional_upstream_tests:
  - file: tests/streamline.test
    source: libucl-0.9.2/tests/streamline.test
    description: "Unregistered upstream streamline script; original script exposes upstream argc parsing defect, stdout matches streamline.res"
    command: "build/tests/test_streamline | diff -u tests/streamline.res -"

test_package_tests:
  - file: test.c
    description: "Consumer parsing and typed lookup through ucl::ucl"
    command: "./test_libucl"

# 50 data items from the five registered make-check suites plus one
# unregistered streamline data item; see reports/test-report.md.
assertion_count: 51
