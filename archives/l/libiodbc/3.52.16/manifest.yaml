# 编译中学到的知识
knowledge_gained:
  - "libtool convenience library (noinst_LTLIBRARIES) 不会被合并到 .a 静态归档中；使用 --disable-static 或移除样本程序的 -static LDFLAGS 可避免链接失败"
  - "iODBC 源码缺少 configure 脚本，需 autoreconf -fi 生成"
  - "iODBC 无测试套件，make check 仅为编译级检查"

