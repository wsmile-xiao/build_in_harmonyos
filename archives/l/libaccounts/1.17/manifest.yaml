name: libaccounts
version: "1.17"
description: "GLib-based client library for the accounts database (Accounts-SSO framework)"
upstream_url: "https://gitlab.com/accounts-sso/libaccounts-glib"
upstream_tag: "1.17"
build_system: autotools
language: c
license: "LGPL-2.1-or-later"
status: published
dependencies:
  - glib2/2.88.0.1
  - libxml2/2.15.3.1
  - sqlite3/3.53.4
build_dependencies:
  - automake/1.17
  - libtool/2.4.7
  - pkgconf/2.2.0
patches: []
adapters:
  - description: "Disable gobject-introspection (not available on OHOS)"
  - description: "Disable gtk-doc documentation"
  - description: "Disable python bindings (pygobject not available)"
  - description: "Remove -Werror flag (glib 2.88 deprecation warnings)"
  - description: "Disable docs subdirectory"
  - description: "Add AM_PROG_AR for libtool"
