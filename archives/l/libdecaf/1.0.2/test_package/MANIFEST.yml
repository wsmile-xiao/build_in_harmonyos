# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libdecaf/1.0.2
homepage: "https://sourceforge.net/projects/ed448goldilocks/"

# 上游测试命令 (ENABLE_TESTS=ON 时向 CTest 注册 decaf / bench 两项；
# 上游默认 OFF，实跑记录见 notes.md 与 reports/)
upstream_check_command: "cmake -DENABLE_TESTS=ON -DENABLE_STRICT=OFF <src> && cmake --build <build> && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (设备原生 aarch64 实测 2/2 通过, decaf 19 组全 PASS)
upstream_tests:
  - file: test/test_decaf.cxx
    source: libdecaf-1.0.2/test/test_decaf.cxx
    description: "decaf_tester: Curve25519/Ed448-Goldilocks 算术、Elligator、EC、EdDSA、ECDH、CFRG/Ristretto/Dalek 向量等 19 组测试"
    command: "./decaf_tester"
  - file: test/bench_decaf.cxx
    source: libdecaf-1.0.2/test/bench_decaf.cxx
    description: "bench: 点运算基准（可执行性冒烟）"
    command: "./bench"

# 上游构建但未注册 CTest 的测试程序 (notes.md 记录)
#   - test/ristretto_tester: 交互式调试计算器，非交互环境以用法输出退出
#   - test/shakesum_tester: SHAKE/SHA3 摘要工具，管道模式实测正常

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_decaf_api.c
    description: "消费者测试: decaf_448 C API 标量算术/点运算/编解码往返/有效性/单位元拒绝 共 6 项"
    command: "./test_libdecaf"

# 测试断言总数 (近似值, test_package 的 CHECK 项数)
assertion_count: 6
