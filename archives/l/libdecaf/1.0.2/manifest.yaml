# archives/l/libdecaf/1.0.2/manifest.yaml — 版本级元数据
version: "1.0.2"
software: "libdecaf"
status: built
build_date: "2026-09-17"
build_system: "cmake"

source:
  # 上游仅以 git tag v1.0.2 发布（未提供 files tarball）；
  # 此 orig tarball 与上游 tag 树内容逐字节一致（diff -r 零差异，见 notes.md）
  url: "https://launchpad.net/ubuntu/+archive/primary/+sourcefiles/libdecaf/1.0.2-2/libdecaf_1.0.2.orig.tar.gz"
  sha256: "96ce1f59bfc6257748d44dffeb40684c886a0742a8ed10524201e6ad95598552"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DENABLE_SHARED=OFF"
    - "-DENABLE_STATIC=ON"
    - "-DENABLE_STRICT=OFF"
    - "-DCMAKE_SYSTEM_NAME=HarmonyOS"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-min-version-3.5.patch"
  - "0002-fix-arm64-arch-detection.patch"

knowledge_gained:
  - "CMake if(${VAR} MATCHES) 展开陷阱：VAR 的值被当作变量名重新求值，未定义时恒假，架构检测静默失效"
  - "CMake 4.x 移除 cmake_minimum_required <3.5 兼容，老项目需提升最低版本"
  - "加密库新 clang 下 -Werror 与 -Wdeprecated-copy 冲突，-DENABLE_STRICT=OFF 规避"
