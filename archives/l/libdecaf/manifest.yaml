# archives/l/libdecaf/manifest.yaml — 软件级元数据
software: libdecaf
display: "libdecaf"
description: "Ed448-Goldilocks / Curve25519 elliptic curve cryptography library implementing the Decaf point compression protocol"
category: crypto
homepage: "https://sourceforge.net/projects/ed448goldilocks/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "cmake_minimum_required 需 >=3.5 才能在 CMake 4.x 下配置（patches/0001）"
    - "上游 if(${CMAKE_SYSTEM_PROCESSOR} MATCHES ...) 展开后值被当作变量名重新求值恒为假，aarch64 落到通用 arch_32 路径；修复后按 toolchain 的 aarch64 选择 arch_ref64（patches/0002）"
    - "ENABLE_STRICT 默认 -Werror，新 clang 对生成的 C++ 头报 -Wdeprecated-copy，配方传 -DENABLE_STRICT=OFF"
    - "构建期用 FindPythonInterp 运行 src/generator/template.py 生成公共头文件，构建环境需 python3"
  common_dependencies: []

versions:
  "1.0.2":
    status: built
    build_date: 2026-09-17
