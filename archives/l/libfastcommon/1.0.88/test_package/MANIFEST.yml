# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libfastcommon/1.0.88
homepage: "https://github.com/happyfish100/libfastcommon"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游为 make.sh 驱动的 raw Makefile 构建，无 configure/ctest；测试在 src/tests 下
upstream_check_command: "make -C src/tests all"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (src/tests/Makefile.in 注册 34 个 test_* + 2 个 benchmark)
upstream_tests:
  - file: src/tests/test_allocator.c
    source: libfastcommon-1.0.88/src/tests
    description: "fast_allocator 分配/释放单元测试"
    command: "./test_allocator"
  - file: src/tests/test_skiplist.c
    source: libfastcommon-1.0.88/src/tests
    description: "skiplist 单元测试"
    command: "./test_skiplist"
  - file: src/tests/test_multi_skiplist.c
    source: libfastcommon-1.0.88/src/tests
    description: "multi_skiplist 单元测试"
    command: "./test_multi_skiplist"
  - file: src/tests/test_mblock.c
    source: libfastcommon-1.0.88/src/tests
    description: "mblock 内存池长时基准测试"
    command: "./test_mblock"
  - file: src/tests/test_blocked_queue.c
    source: libfastcommon-1.0.88/src/tests
    description: "阻塞队列生产/消费长时测试"
    command: "./test_blocked_queue"
  - file: src/tests/test_id_generator.c
    source: libfastcommon-1.0.88/src/tests
    description: "64 位 ID 生成器测试"
    command: "./test_id_generator"
  - file: src/tests/test_char_convert.c
    source: libfastcommon-1.0.88/src/tests
    description: "字符集转换测试"
    command: "./test_char_convert"
  - file: src/tests/test_logger.c
    source: libfastcommon-1.0.88/src/tests
    description: "logger 异步日志测试"
    command: "./test_logger"
  - file: src/tests/test_skiplist_set.c
    source: libfastcommon-1.0.88/src/tests
    description: "skiplist_set 单元测试"
    command: "./test_skiplist_set"
  - file: src/tests/test_pthread_lock.c
    source: libfastcommon-1.0.88/src/tests
    description: "pthread 锁测试"
    command: "./test_pthread_lock"
  - file: src/tests/test_uniq_skiplist.c
    source: libfastcommon-1.0.88/src/tests
    description: "uniq_skiplist 单元测试"
    command: "./test_uniq_skiplist"
  - file: src/tests/test_server_id_func.c
    source: libfastcommon-1.0.88/src/tests
    description: "server id 功能/调度测试（长时 INFO 输出）"
    command: "./test_server_id_func"
  - file: src/tests/test_pipe.c
    source: libfastcommon-1.0.88/src/tests
    description: "pipe 通信测试（200 万次循环）"
    command: "./test_pipe"
  - file: src/tests/test_sorted_array.c
    source: libfastcommon-1.0.88/src/tests
    description: "sorted_array 单元测试"
    command: "./test_sorted_array"
  - file: src/tests/test_sorted_queue.c
    source: libfastcommon-1.0.88/src/tests
    description: "sorted_queue 单元测试"
    command: "./test_sorted_queue"
  - file: src/tests/test_thread_local.c
    source: libfastcommon-1.0.88/src/tests
    description: "thread local 测试"
    command: "./test_thread_local"
  - file: src/tests/test_memcpy.c
    source: libfastcommon-1.0.88/src/tests
    description: "memcpy 性能测试"
    command: "./test_memcpy"
  - file: src/tests/test_fast_buffer.c
    source: libfastcommon-1.0.88/src/tests
    description: "fast_buffer 单元测试"
    command: "./test_fast_buffer"
  - file: src/tests/cpool_benchmark.c
    source: libfastcommon-1.0.88/src/tests
    description: "connection pool 基准测试"
    command: "./cpool_benchmark"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - name: md5+logger
    file: test_package.c
    description: "消费者测试：真实调用 fastcommon md5 (my_md5_*) 与 logger (log_init) API"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 36