software: libswe
display: "Swiss Ephemeris"
description: "Astrodienst 高精度天文星历 C 库 (行星/恒星/食/宫位计算)"
category: library
homepage: "https://www.astro.com/swisseph/"
license: AGPL-3.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目, 无 configure/CMake, in-source 构建 (对齐 zlib/1.3.1)"
    - "只构建可移植目标, 跳过 RHEL-only 的 swetests 静态目标"
    - "编译器走 Conan conf (R33), SHELL/TMPDIR 按 bwm/0.6.3 模式加固"
    - "上游 setest 套件 (60 TESTCASE) 完整接入 build(), m4/openssl 经 tool_requires 引入 (仅测试用, 不进 requires)"
    - "SWIEPH/JPLEPH 用例需另行下载星历数据, 豁免见版本 MANIFEST"
  common_dependencies: []

versions:
  "2.10.03":
    status: built
    build_date: "2026-09-17"
