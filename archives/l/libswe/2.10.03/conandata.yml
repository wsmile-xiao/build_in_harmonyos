# conandata.yml — libswe 2.10.03 (Swiss Ephemeris)
# Official upstream source: aloistr/swisseph tag v2.10.03.
# The former astro.com FTP source directory
# (https://www.astro.com/ftp/swisseph/src/) now only points at the GitHub
# repository, and the v2.10.03 GitHub release ships no attached assets, so
