sources:
  url: "https://github.com/aloistr/swisseph/archive/refs/tags/v2.10.03.tar.gz"
  sha256: "8c166796767a560691581575b6eb4b4383d849e542b16647dca2e0b127fb70b0"

patches:
  - patch_file: "patches/0001-clang-no-gcc-nested-functions.patch"
    patch_description: "setest harness: hoist GCC nested functions to file scope so it builds with clang (OHOS HNP toolchain). setest.c run()/evaluate_cmdline_options() and multivalues.c multivalues_get_next() used `auto` nested functions, a GCC-only extension clang rejects (illegal storage class on function). Behavior unchanged: captured ctx/n/multivalues become explicit parameters."
    patch_type: "portability"
  - patch_file: "patches/0002-m4-generated-setest-clang-compat.patch"
    patch_description: "m4-generated setest suite: emit file-scope functions so generated_tests.c builds with clang. TESTCASE/SETUP/TEARDOWN definitions move to divert(4)/divert(3) (flushed after each testsuite closes), take test_context explicitly, and gain prototypes; per-suite shared locals become static suite_N_state structs with macro aliases (test bodies untouched); set_sid_mode hoisted with ctx parameter."
    patch_type: "portability"
