# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libswe/2.10.03
homepage: "https://www.astro.com/swisseph/"

# 上游测试套件存在性 (经审计上游源码 tar 包确认, 见下方 upstream_test_audit)
upstream_tests_exist: true

# 上游测试审计 (源码: aloistr/swisseph tag v2.10.03,
# sha256 8c166796767a560691581575b6eb4b4383d849e542b16647dca2e0b127fb70b0)
# 2026-09-17 下载官方 tag 归档逐项验证: 共 144 个条目; setest/ 目录含 10 个
# suite_*.c 测试套件 + testsuite.m4 代码生成器 + t.fix/t.exp 固件与期望文件;
# 顶层 Makefile 提供 `test: cd setest && make && ./setest t` 官方入口。
upstream_test_audit:
  source_tarball: "swisseph-2.10.03 (aloistr/swisseph tag v2.10.03)"
  source_sha256: "8c166796767a560691581575b6eb4b4383d849e542b16647dca2e0b127fb70b0"
  source_origin: "https://github.com/aloistr/swisseph/archive/refs/tags/v2.10.03.tar.gz"
  top_level_files:
    - file: "Makefile"
      role: "唯一构建入口, 目标 all/swetest/swetests/swevents/swemini/libswe.a/libswe.so/test/test.exp/clean"
      test_targets: "test -> cd setest && make && ./setest t (官方测试入口)"
      is_test: true
    - file: "setest/setest.c + setest.h"
      role: "测试驱动主程序 (fixture 读取/期望比对/统计输出)"
      test_targets: "binary setest, 用法 ./setest t"
      is_test: true
    - file: "setest/suite_01_calc.c .. suite_10_solcross.c (10 files, 60 TESTCASE)"
      role: "上游测试用例本体 (swe_calc/恒星/杂项/黄道/日期/宫位/拱点/食/升起/solcross)"
      test_targets: "60 TESTCASE via testsuite.m4 -> generated_tests.c"
      is_test: true
    - file: "setest/t.fix + setest/t.exp (21KB + 12.9MB)"
      role: "测试固件与期望输出 (t.exp 头部 swisseph-version: 2.10.02a)"
      test_targets: "fixture t, 125 个 ITERATION"
      is_test: true
    - file: "setest/testsuite.m4 + testsuite_end.m4 + gen_fix_templ.m4"
      role: "m4 代码生成器 (套件注册/固件模板), 需构建机提供 m4"
      test_targets: "generated_tests.c (构建期生成, 非手写测试)"
      is_test: false
    - file: "swetest.c + swemini.c + swevents.c"
      role: "示例/演示程序 (非断言测试, 不计入上游用例)"
      test_targets: "none"
      is_test: false
    - file: "setest/t/test.sh + test.pl"
      role: "上游开发者级二次检查 (需 bash+perl), 非 `make test` 主路径"
      test_targets: "none (顶层 make test 不调用)"
      is_test: false
  scanned_for:
    - "TESTCASE( (setest 套件宏)"
    - "TESTSUITE (固件分节)"
    - "make test 目标"
    - "tests/ / test/ / spec/ 目录"
    - "gtest TEST( / TEST_F"
    - "def test_ (pytest)"
    - "ctest / meson test 入口"
  scan_result: "60 TESTCASE in setest/suite_*.c, 11 TESTSUITE sections / 125 ITERATIONs in setest/t.fix, 官方入口 `make test` (顶层 Makefile)"
  make_check_output: "顶层 `make test` 编译 setest (需 m4 + libcrypto) 并运行 ./setest t, 输出 `Testmode 't': Total <suites>/<cases>/<iters> ... <failures> failures in <failed> iterations.`; build() 解析该行产生 HMBS_UPSTREAM_TEST_RESULT 真实计数"
  reason: "libswe 2.10.03 上游自带 setest 测试框架: 10 个 suite 源共 60 TESTCASE, 固件 125 ITERATION, 官方 make test 入口完整"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中已集成上游测试 (由 t.exp 派生 t_nojpl.exp:
# 仅删去 iephe 含 JPL 位的 538 个 ITERATION 小节, 其余字节与上游一致,
# 再运行 ./setest t_nojpl; 即上游 make test 入口的配对保持式 JPL 排除, 见 exemptions)
upstream_test_in_build: true
upstream_test_command: "./setest t_nojpl (t.exp minus 538 JPL sections, pairing-preserving)"

# make test 实际运行的测试套件 (全部经 ./setest t 二进制执行)
upstream_tests:
