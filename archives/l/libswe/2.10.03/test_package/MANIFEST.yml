    command: "./setest t"

# 上游测试豁免声明 (TEST_QUALITY_SPEC 3.3: 确实无法修复时声明豁免并说明原因)
# build() 运行 ./setest t_nojpl 并如实上报 HMBS_UPSTREAM_TEST_RESULT;
# JPL 小节经派生期望文件显式排除 (命令与派生计数如实记录, 非静默跳过);
# 2026-09-19 真机实测按套件失败分布: on-pin 基线轮 349 (01=132/02=5/04=7/
# 05=5/07=23/08=32/09=10/10=135); 516 轮 (01=193/02=8/04=7/05=5/07=87/
# 08=32/09=10/10=174) 为缺数据+off-pin 漂移混合 (suite_07 回到 87 无数据基线,
# suite_01 +61/suite_10 +39 为 master DE441 字节漂移); 最新 149 轮
# (01=112/02=0/04=3/05=1/07=12/08=5/09=10/10=6, 执行 12219/通过 12070) 为整包
# era-pin 后的真 on-pin floor (suite_10 135→6、suite_08 32→5、suite_02→0、
# suite_07 87→12 优于 23 基线; suite_09 保持 10 数据无关侧证), 残留驱动为代码
# 行为漂移+DE441 sat 覆盖+MPC 根数漂移 (第三轮官方 diff 已核验), 非缺数据。
# 按用例: 1.1=93/1.3=15/1.5=4/4.1=3/5.4=1/7.3=12/8.3=1/8.7=3/8.9=1/9.3=8/9.4=1/
# 9.5=1/10.8=6 (13 个用例, 与配方 drift ledger 完全一致, 无新回归; suite_02=0
# 已清零, suite_09=10 全程数据无关)。第七轮起
# 配方改走严格门禁 (off-pin 拒绝+小行星必需化), 此后只有 on-pin 完整数据运行
# 或具名基础设施错误, 不再以 warn-and-continue 带病运行。第三轮已用上游官方
# v2.10.02...v2.10.03 全量 diff (17MB, GitHub compare)逐条核验下述成因,
# 不再是推断; 行星 .se1 时代锚定亦经 pin 提交实存核验 (41 个必需文件在
# b51a0833 全部存在, 且字节数与 master 不同, 锚定真实有效)。
upstream_test_exemptions:
  - scope: "t.exp 中 iephe 含 JPL 位的 538/12757 个 ITERATION 小节 (已由 t_nojpl.exp 显式排除, 不执行)"
    reason: "默认 JPL 文件 de431.eph 达 2.6GB (de406 190MB), 上游发布包不含, 真机无法低成本补齐; 派生文件由配方每构建一次从 t.exp 文本过滤生成 (仅删 JPL 小节, 保留小节的 section-id 按用例内连续重排以恢复 reader 顺序 seek 不变量、期望值字节一致, 配对保持 1:1, 计数打日志), 等价于 ctest -E, 非静默跳过; 2026-09-18 对 v2.10.03 归档实数: 12757 小节中 538 个 iephe=1, 保留 12219, 60 用例无纯 JPL、无 disabled"
  - scope: "iephe=SEFLG_SWIEPH 中超出已提供数据覆盖或与 t.exp 版本漂移的 ITERATION"
    reason: "build() 获取行星 .se1 全日期覆盖 (_00.._30+_36/m06..m30+m36 三系约 35MB, 主取上游仓库 DE441 前最后提交 b51a0833 的不可变文件、与 t.exp 时代一致, master 与 scryr.io 仅作回退; m36/_36 为必需: t.exp 在 JD 624942.5(-3002)/625000(-3001) 处含 SWIEPH 真实值且 serr 为空, 缺 m36 时會报 seplm36.se1 not found 且数值回退失配) 与 5 个小行星 short+long 文件 (Hygiea/Eros/Chiron/Pholus/10433, scryr.io, 约 5MB; Ceres/Pallas/Juno/Vesta 无需独立文件, 已含于 seas_*.se1; 9501/9599 为行星卫星非小行星, 见下条) 放入 setest 目录/astN 子目录, 加 sefstars.txt; 均经大小完整性校验, 缺必需文件时直接报基础设施错误而非带病运行"
  - scope: "行星卫星/COB (sat/sepm*.se1) 与假设天体 (seorbel.txt) ITERATION"
    reason: "t.exp 实数含 24 处 sepm serr (CENTER_BODY/planetocentric, suite_01) 且假设天体 (Cupido/40/43/47/Nibiru) 期望空 serr (即上游生成时持有文件); 缺文件时报 sepm9599.se1/seorbel.txt not found 而失配。build() 从官方镜像 scryr.io 补齐 sat/sepm9501/9599/9699/9799/9899/9999 (swi_gen_filename 要求 sat/ 子目录, 4-10MB/个约 43MB, 1MB 下限+20s 超时+20MB 上限, 缺失报基础设施错误) 与 seorbel.txt (setest 根目录; 时代锚定: scryr.io 现行 6237B 为更新后根数, 主取 git 快照 eecb996a 的 6063B 版本, 与 sefstars.txt 同提交、master 至今一致, 为最接近 2022 t.exp 时代的存活快照, scryr 仅作回退); sat 为 DE441 重建 (2026-03, git 之外无时代版本)。第三轮实测纠正前轮假设: 越界 lower-limit serr 与版本有关, 并非无关: t.exp 期望值为 2378491.5 (9599/9699/9799) 与 2396759.5 (9899), 而 DE441 重建文件实际报出 2378496.5/2378861.5 (2026-09-18 真机 serr 直方图, 各 2 次), 此类 COB 越界迭代用现存任何数据都无法匹配; 在界 COB 值同样可能带 DE441-vs-DE431 漂移, 但仍严格优于缺文件回退; 9501/9599 此前误列入小行星清单 (astN URL 恒 404) 已移至 sat, 免 4 次无效抓取"
  - scope: "swe_pheno 月亮星等相关 ITERATION (suite_08 部分, 149 轮 suite_08=5 与本条+下条共同覆盖; suite_03 实测 0 失败, 不在此列)"
    reason: "t.exp 头部 swisseph-version: 2.10.02a (2022-08-27 生成), 上游未随 2.10.03 重生成; 第三轮取回官方 v2.10.02...v2.10.03 全量 diff 核验: swecl.c 月亮星等由 Allen 单公式改为 MAG_MOON_VREIJS 分段模型 (phase angle>147.1385465 度用 Samaha 立方响应), 期望值必然偏移, 数据无法修复"
  - scope: "swe_lun_eclipse_when 相关 ITERATION (suite_08 部分)"
    reason: "同上 t.exp 为 2.10.02a 版本生成; 第三轮核验官方 diff: swecl.c 古代日期阈值 tjd<2000000 改为 tjd<2100000 (注释 was tjd < 2000000 until 26-aug-22), 改变古代日期搜索步长与收敛时刻; 数据无法修复"
  - scope: "swe_deltat 内置 Delta-T 表相关 ITERATION (用 swe_calc_ut/UT 入口且 JD 落在 2020-2028 的用例, suite_01 现代 JD 迭代为主 (149 轮 suite_01=112 含本类; suite_10 残留仅 6 (按用例 10.8=6; 旧 135~194 为 off-pin/缺数据虚高)))"
    reason: "第三轮核验官方 diff: swephlib.c 编译进的 dt[] 表在 2.10.03 更新 (2020.0-2023.0 补入 69.2945/69.1833 实测值, 2024-2028 预测值改写), t.exp 系旧表行为; Delta-T 表编进库代码, 数据文件无法修复"
  - scope: "suite_04 ayanamsa TESTCASE 1 值漂移 (149 轮实测 3 个失败迭代, suite_04=3; 上游输入与期望已对齐, 本条为值漂移豁免)"
    reason: "2026-09-19 对 v2.10.03 归档实数证伪了上一轮配对失衡假设: t.exp suite_04 已含 TESTCASE 2 的 iephe:2 与 iephe:66 双期望小节及 TESTCASE 3 的 NONUT daya 期望 (suite_04 期望小节按用例为 {1:8, 2:2, 3:1, 4:1} 共 12, 与 t.fix 多值展开 1:1 一致; 头部 2.10.02a 只是未更新版本号, 内容已含 NONUT 新断言; TESTCASE 3 代码根本不读 iephe, 加行无展开效应)。上一轮 _fix_suite04_fixture 把双值归一为单值反而制造失衡并删除上游新增的 NONUT 断言, 已于本轮整体删除, 上游输入此后零改动。残留 3 失败落在 TESTCASE 4.1 (Mercury/Ceres/Eros/Pluto/apogee 值漂移), 系 sweph.h ayanamsa 定长表 (SE_NSIDM_PREDEF、删 Manjula 条目、46 号 LAHIRI_ICRC 标注) 与 sweph.c 新增 sid_mode<SE_NSIDM_PREDEF 守卫及 NONUT 掩码的代码行为漂移, 数据文件无法修复; 精度保持上游 1e-8 不动"
  - scope: "suite_07 apsides 失败迭代 (162 个保留迭代; on-pin 基线 23, 缺数据基线 87; 149 轮实测 12 (按用例 7.3=12) 优于 23 基线)"
    reason: "第三轮核验官方 diff: sweasp.c 在 2.10.02...2.10.03 间仅有花括号排版与 #if 0 死代码删除, 零功能变更, 故非代码漂移; 该套件 JD 固定 2450333.2 (2008, Delta-T 表未变区段)。基线成因为小行星密切根数随 MPC 更新漂移 (scryr.io 只提供现行版本, 无 2022 时代快照); 三轮实测 87->23->87 证明数据可用性占主导。第六轮单主机重试 (3 次 x 15s) 未能把 516 轮 suite_07 拉回 23, 证明 warn-and-continue 会把断网伪装成 64 个测试失败; 第七轮改走严格门禁路线 (与前六轮不同实现): 行星必需文件仅接受 era-pin 字节 (off-pin 直接拒绝并转基础设施错误), 小行星 short+long 由 best-effort 提升为必需 (缺失直接报基础设施错误而非带病运行)。此后预检只有两种诚实结果: 完整 on-pin 数据下的 23 基线漂移, 或具名基础设施错误 (调度重试), 不再出现 87 伪装成测试失败"

