version: "2.10.03"
software: "libswe"
status: built
build_date: "2026-09-17"
build_system: "makefile"

source:
  url: "https://github.com/aloistr/swisseph/archive/refs/tags/v2.10.03.tar.gz"
  tar_format: tar.gz
  sha256: "8c166796767a560691581575b6eb4b4383d849e542b16647dca2e0b127fb70b0"

build:
  system: makefile
  configure_options:
    - 'make -j1 CC=<conan-conf> CFLAGS="-O2 -Wall -fPIC" libswe.a [libswe.so] swetest swevents swemini'
    - "make test (setest harness: CC/CFLAGS/LIBS overrides, static libcrypto)"
  dependencies: []
  tool_requires:
    - m4/1.4.19
    - openssl/3.5.6.1
  cc: clang

patches_applied:
  - "patches/0001-clang-no-gcc-nested-functions.patch (portability: setest harness GCC nested functions hoisted to file scope for clang)"
  - "patches/0002-m4-generated-setest-clang-compat.patch (portability: m4 template emits file-scope suite functions; per-suite state structs for clang)"

knowledge_gained:
  - "astro.com FTP 源码目录已下线 (仅剩跳转 GitHub), v2.10.03 release 无附件, tag tarball 是唯一官方源"
  - "顶层 all 含 RHEL-only 的 swetests 目标 (-L/usr/lib/x86_64-redhat-linux6E + -static), 只构建 libswe.a/libswe.so/swetest/swevents/swemini"
  - "上游自带 setest 框架 (60 TESTCASE/125 ITERATION), 入口 make test -> ./setest t, 统计行 Total <suites>/<cases>/<iters> ... <failures> failures in <failed> iterations"
  - "setest 构建需 m4 (generated_tests.c 代码生成) 与 libcrypto (setest.c 一处 SHA1 打印); 私有目录只放 libcrypto.a 使 -lcrypto 静态解析, 测试二进制无运行时动态依赖"
  - "SWIEPH/JPLEPH 用例需 .se1/JPL 数据文件 (发布包不含), t.exp 为 2.10.02a 版本生成; 豁免见 test_package/MANIFEST.yml"
  - "消费者测试走 SEFLG_MOSEPH 解析路径, 免数据文件, 断言区间有天文依据 (J2000 太阳黄经约 280.4 度, 月地距离 0.00238-0.00271 AU); 另含 1 个完整端到端消费者用例 (格林尼治 J2000 出生盘: julday->日月 calc->sidtime->houses->revjul 全链路)"
