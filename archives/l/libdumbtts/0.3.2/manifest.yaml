# manifest.yaml — libdumbtts 0.3.2
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.2"

# 软件名
software: "libdumbtts"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，Debian watch 同源记录）
  url: "https://www.polip.com/files/libdumbtts-0.3.2.tar.gz"

  # 源码校验和
  sha256: "e20056bc9c271398509a53fd460da4d52ba2c8b85c43ec6f8147949c46777900"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：纯 Makefile（无 configure，Makefile 位于 src/ 下）
  system: makefile

  # 配置选项列表（无 configure 脚本）
  configure_options: []

  # 编译依赖列表（零第三方依赖，仅标准 C 库）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-src-libdumbtts.c.patch"
  - "0002-src-libdumbtts_dic.c.patch"
  - "0003-src-libdumbtts_re.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GNU C 嵌套函数（gcc 扩展）不被 clang 支持；须提升为文件级 static 函数并将捕获变量改为显式参数（本任务 3 文件 8 函数）"
  - "上游 Makefile 仅对 x86_64 启用 -fPIC；OHOS armv8 共享库必须显式传 PIC=-fPIC"
  - "conan basic_layout 将工作目录置于 build-release/，make 须用 cwd=self.source_folder 或在源码目录内执行"