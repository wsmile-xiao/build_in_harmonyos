# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
package: libdumbtts/0.3.2
homepage: "http://www.polip.com/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libdumbtts 为纯 Makefile 项目且无 test/check 目标：
#   - 源码包根目录与 src/ 下 Makefile 均只含 all/clean/install 目标
#   - 无 tests/ 目录、无 ctest/pytest 注册
#   - 唯一可执行示例为 demo/demo.c（非自动化测试，无断言）
upstream_check_command: "make -C src check"
upstream_test_count: 0

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 自研测试（鸿蒙特有测试）：test.c 调用 dumbtts_TTSInit + dumbtts_WCharString +
# dumbtts_GetString 验证库 API 可用性，共 3 组断言（TTSInit 初始化、宽字符转换、
# UTF-8 字符串转换）。test() 直接运行测试二进制（test_package/conanfile.py L45-46）。
custom_test_count: 3
custom_test_command: "conan create (test_package test() 阶段自动运行 test_libdumbtts)"