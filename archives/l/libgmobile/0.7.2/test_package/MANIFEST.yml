# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在；详见 docs/TEST_QUALITY_SPEC.md）
#
# libgmobile 是 meson 项目，上游测试在 tests/meson.build 里注册为 7 个
# test() 程序（tests 列表），已在配方 build() 中随 `meson test` 全量执行，
# 并回读 meson-logs/testlog.txt 汇总块硬断言（不吃退出码）。
# 上游默认分支 main 与本次钉版 tag v0.7.2 的 tests/ 内容一致：同为 7 个
# 测试程序、14 个 g_test_add_func 用例，无版本差。

package: libgmobile/0.7.2
homepage: "https://gitlab.gnome.org/World/Phosh/gmobile"

# 上游测试命令（已在 build() 中集成执行）
upstream_check_command: "meson test -C <builddir>"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游实际运行的全部测试程序（tests/meson.build 的 tests 列表，7 个）
# 说明：not_installed = ['test-device-tree'] 只影响「是否安装 .test 元数据」，
# 该程序仍会被构建并执行，故计入执行集。
upstream_tests:
  - file: tests/test-cutout.c
    source: gmobile-v0.7.2.tar.gz/tests/test-cutout.c
    description: "GmCutout：从 SVG path 求边界框、路径字符串往返（1 个用例）"
    command: "meson test cutout"
  - file: tests/test-display-panel.c
    source: gmobile-v0.7.2.tar.gz/tests/test-display-panel.c
    description: "GmDisplayPanel：内联 JSON 解析（name/x-res/y-res/border-radius/width/height/cutouts）+ corner-radii 数组（2 个用例）"
    command: "meson test display-panel"
  - file: tests/test-mcc-mnc.c
    source: gmobile-v0.7.2.tar.gz/tests/test-mcc-mnc.c
    description: "gm_mcc_to_iso()：MCC → ISO 3166-1 国家码查表与错误分支（1 个用例）"
    command: "meson test mcc-mnc"
  - file: tests/test-svg-path.c
    source: gmobile-v0.7.2.tar.gz/tests/test-svg-path.c
    description: "GmSvgPath：SVG path 解析为边界框与多边形点列（4 个用例）"
    command: "meson test svg-path"
  - file: tests/test-timeout.c
    source: gmobile-v0.7.2.tar.gz/tests/test-timeout.c
    description: "gm_timeout_*：超时回调触发与取消（2 个用例）"
    command: "meson test timeout"
  - file: tests/test-utils.c
    source: gmobile-v0.7.2.tar.gz/tests/test-utils.c
    description: "gm_str_is_null_or_empty / gm_strv_is_null_or_empty 宏 + gm_list_devices() 含 purism,librem5（3 个用例）"
    command: "meson test utils"
  - file: tests/test-device-tree.c
    source: gmobile-v0.7.2.tar.gz/tests/test-device-tree.c
    description: "GmDeviceTree：用 tests/data/compatibles1|2 夹具按 compatible 串匹配设备（1 个用例，不读 /proc/device-tree）"
    command: "meson test device-tree"

# 上游用例总数（g_test_add_func 注册数，含 g_test_add_data_func 等同族）
# 上游默认分支 main 与 v0.7.2 一致：14
upstream_test_case_count: 14

# test_package 中自带的测试 (消费者视角验证，见 notes.md)
test_package_tests:
  - file: test.c
    description: >-
      libgmobile 真实 API 冒烟：gm_mcc_to_iso() 查表（含 IMSI 前缀形式与两条
      错误分支反向对照）+ GResource 嵌入物经 gm_list_devices() /
      gm_display_panel_new_from_resource() 读回 + 内联 JSON 经 libjson-glib
      解析（含畸形 JSON 反向对照）
    command: "./test_libgmobile"

# 测试断言总数 (近似值, 用于质量评估；test.c 内 CHECK(...) 调用数）
assertion_count: 16
