# conandata.yml — libgmobile 0.7.2
# 官方上游: https://gitlab.gnome.org/World/Phosh/gmobile (Phosh 项目)
# 官方归档: GitLab 项目归档接口（tag v0.7.2，根目录 gmobile-v0.7.2/）

sources:
  url: "https://gitlab.gnome.org/World/Phosh/gmobile/-/archive/v0.7.2/gmobile-v0.7.2.tar.gz"
  sha256: "2566187fbd0974d1b1e8ee417935db526c8f65dad28807ab3a5244a5fa757c92"

patches:
  "0.7.2":
    - patch_file: "patches/0001-gmobile-gresources-drop-json-stripblanks.patch"
      patch_description: >-
        data/gmobile.gresources.xml 的 34 个 JSON 资源带
        preprocess="json-stripblanks"。该预处理由 glib-compile-resources
        **外部派生** json-glib-format 完成（无 shell，g_spawn_sync），而在
        OHOS 构建机上该子进程动态装载 libjson-glib-1.0.so.0 失败
        （Error relocating ...: json_generator_new: symbol not found /
        Child process exited with code 127），且派生方是 glib 内部 helper，
        配方侧无法为它注入可用的库路径。gmobile 运行期用 JsonParser 解析
        这些文件，空白无关语义，因此改为原样内嵌。
      patch_type: portability
