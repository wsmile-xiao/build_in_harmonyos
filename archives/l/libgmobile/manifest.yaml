software: libgmobile
display: "gmobile"
description: "Functions useful in mobile related, glib based projects (Phosh)"
category: system
homepage: "https://gitlab.gnome.org/World/Phosh/gmobile"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 项目，无补丁：默认分支 main，v0.7.2 tag 归档自带 meson.build"
    - "资源编译的 json-stripblanks 预处理由 glib-compile-resources 以子进程方式调用外部 json-glib-format（PATH 查找 / JSON_GLIB_FORMAT 覆盖），配方把 glib 与 json-glib 的 bin/ 前置进 PATH 并显式设 JSON_GLIB_FORMAT"
    - "PkgConfigDeps 生成的 glib .pc 缺 -lintl（glib 在 OHOS 上与 proxy-libintl 同构建但 package_info 未声明 intl），配方就地增补生成物"
    - "build() 内全量执行上游 meson test（7 个测试程序 / 14 个用例），并回读 meson-logs/testlog.txt 汇总块硬断言"
    - "依赖 glib/2.84.0.1 + json-glib/1.10.6，tool_requires meson/1.11.0"

common_dependencies:
  - glib
  - json-glib

versions:
  "0.7.2":
    status: built
    build_date: "2026-09-20"
