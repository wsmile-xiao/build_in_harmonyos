# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lasem-render/0.5.1
homepage: "https://gitlab.gnome.org/GNOME/lasem"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/dom
    source: lasem-LASEM_0_5_1/tests/dom.c
    description: "DOM API 单元测试：document/element/node-list/insert-before 等 7 个用例（g_test_add_func 注册）"
    command: "cd tests && ./dom"
  - file: tests/str
    source: lasem-LASEM_0_5_1/tests/str.c
    description: "字符串工具单元测试：str_consolidate 1 个用例"
    command: "cd tests && ./str"
  - file: tests/filter
    source: lasem-LASEM_0_5_1/tests/filter.c
    description: "SVG filter surface 单元测试：surface/similar/processing/processing_mismatch/processing_null 5 个用例"
    command: "cd tests && ./filter"
  - file: tests/suite
    source: lasem-LASEM_0_5_1/tests/suite.c
    description: "数据驱动渲染回归套件：递归枚举 tests/data/**/*.mml|*.svg（排除 ignore-* 与 images/），每文件注册一个 /render/<path> 用例并真实渲染到 cairo surface（lsm_dom_view_render）。注册 1168 用例（1743 文件 - 565 ignore-* 排除 - 95 images 排除 - 4 suite.ini 原有 ignore - 6 本轮豁免：tiff.svg/image.svg/svgImageViewBox.svg/svgImageViewBoxClip.svg/svgImageViewBoxOverflow.svg/struct-image-05-b.svg 通过 <image xlink:href> 引用 .tif/.svg 资源，conan gdk-pixbuf 只带内建 PNG/JPEG/GIF loader，lasem 对 NULL pixbuf 调 g_object_ref 触发 FATAL-CRITICAL 中断 suite——依赖能力缺口非平台特有）"
    command: "cd tests && ./suite"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_lasem_render.c
    description: "消费者数学渲染验证：lsm_dom_document_new_from_memory 解析内联 MathML(a²+b²=c²) → lsm_dom_view_get_size_pixels 布局测量（pango 文本整形）→ lsm_dom_view_render 渲染到 cairo ARGB32 surface → lsm_shutdown 库回收"
    command: "./test_lasem_render"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1186