test_package_tests:
  - name: "test_libcupsfilters image+dither+lut 三模块公共 API 链接验证"
    description: "调用 libcupsfilters 公共 API 覆盖上游 testdither.c / testfilters.c 核心测试项: image 模块 cfImageRGBToWhite / cfImageRGBToBlack (上游 image.h cfImageRGBToWhite), lut 模块 cfLutNew / cfLutDelete (上游 testdither.c cfLutNew(nlutvals, lutvals, logfunc, ld)), dither 模块 cfDitherNew / cfDitherLine / cfDitherDelete (上游 testdither.c cfDitherNew(512) + cfDitherLine + cfDitherDelete)"
    assertion_count: 8
upstream_test_source: "https://github.com/OpenPrinting/libcupsfilters/blob/v2.2.1/cupsfilters/testdither.c"
upstream_test_coverage:
  covered:
    - "image 模块 cfImageRGBToWhite (上游 image.h extern void cfImageRGBToWhite)"
    - "image 模块 cfImageRGBToBlack (上游 image.h extern void cfImageRGBToBlack)"
    - "lut 模块 cfLutNew (上游 testdither.c lut = cfLutNew(nlutvals, lutvals, logfunc, ld))"
    - "lut 模块 cfLutDelete (上游 testdither.c cfLutDelete(lut))"
    - "dither 模块 cfDitherNew (上游 testdither.c dither = cfDitherNew(512))"
    - "dither 模块 cfDitherLine (上游 testdither.c cfDitherLine(dither, lut, line, 1, pixels))"
    - "dither 模块 cfDitherDelete (上游 testdither.c cfDitherDelete(dither))"
  not_covered:
    - "cfFilterChain / cfFilterUniversal (testfilters.c) 需要 filter.h 引入 cups/cups.h 复杂依赖"
    - "cfImageOpen / cfImageClose (testimage.c) 需要真实图片文件作为参数"
    - "testpdf1.c / testpdf2.c PDF 输出测试 需要 pdfutils-private.h 私有 API"
    - "test1284.c IEEE-1284 并口测试 需要 libieee1284 运行时"
