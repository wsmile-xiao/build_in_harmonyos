# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lcmaps-plugins-basic/1.7.1
homepage: "https://software.nikhef.nl/security/lcmaps-plugins-basic/"

# 上游测试命令: 无（见下方 discovery 结论）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试 discovery（discovery.status = EVIDENCE_COMPLETE，结论 NO_UPSTREAM_TESTS）:
#   已检查入口:
#     - 顶层 Makefile.am: SUBDIRS = doc src，仅 stage/distsrc/distbin 自定义
#       目标，无 check 目标、无 TESTS/check_PROGRAMS 定义
#     - src/Makefile.am: 无 check 目标；5 个 src/*/plugin_test.c
#       (ban_dn/ldap_enf/localaccount/poolaccount/posix_enf) 仅列于 EXTRA_DIST，
#       为手动测试客户端，未接入构建
#     - doc/Makefile.am: 仅 man8 页安装，非测试
#     - configure.ac: 无 AC_CONFIG_TESTDIR 等测试设施
#   证据路径（lcmaps-plugins-basic-1.7.1.tar.gz 内）:
#     - Makefile.am / src/Makefile.am / doc/Makefile.am / configure.ac
#     - src/ban_dn/plugin_test.c、src/ldap_enf/plugin_test.c、
#       src/localaccount/plugin_test.c、src/poolaccount/plugin_test.c、
#       src/posix_enf/plugin_test.c（全部 EXTRA_DIST）
#   结论: 上游零自动化测试（无 check 目标/测试程序接入构建系统），
#         产物验证以 test_package OHOS 冒烟用例真实执行代替。
discovery:
  status: EVIDENCE_COMPLETE
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >
      OHOS 冒烟用例：测试二进制 NEEDED liblcmaps_without_gsi.so.0（与插件
      产物同型的显式框架依赖，musl dlopen 作用域适配），再逐个以 RTLD_NOW
      dlopen 安装位 lib/lcmaps/lcmaps_<mod>.mod（install-data-hook 符号链接/
      copy 回退语义，补丁 0004/E018；RTLD_NOW 即证明跨库符号闭包全可解析，
      E004 面；ldap_enf 的 libldap 闭包经 LD_LIBRARY_PATH 提供并顺带验证），
      dlsym 插件契约三入口 plugin_initialize/plugin_run/plugin_terminate，
      并断言包内清单（7 个 .so + 7 个 .mod + man8 页）。
    command: "./test_lcmaps_plugins_basic <plugins_package_root> <lcmaps_framework_root>"
