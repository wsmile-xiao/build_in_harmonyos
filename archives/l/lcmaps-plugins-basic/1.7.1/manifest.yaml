# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "lcmaps-plugins-basic 依赖 without-gsi 面的 lcmaps/1.6.7：configure 头文件面用上游 --with-lcmaps-prefix 直连（包内 lcmaps-basic-interface.pc prefix=/ 会令 pkg-config 返回 -I//include，不可单独依赖）；OHOS musl dlopen 作用域探针实证：dlopen 的 DSO 只对自己的 DT_NEEDED 闭包解析（不对主程序/启动库/RTLD_GLOBAL 对象），上游「插件符号由调用方框架提供」模型不可重定位 → recipe 以 LDFLAGS 追加 -llcmaps_without_gsi 使插件携带显式框架 DT_NEEDED（能力级适配）"
- "configure 对 ldap.h 无开关必查（AC_CHECK_HEADER 硬检查），liblcmaps_ldap_enf LIBADD=-lldap → openldap/2.6.7 为硬依赖；AC_CHECK_LIB([dl]) 在 OHOS 工具链可过（musl dl* 在 libc，E013）"
- "E075 陷阱实测面：C_INCLUDE_PATH 未清则 pkg-config 把 -I 过滤掉，LCMAPS_CFLAGS 为空；generate() 内 unset C_INCLUDE_PATH/CPLUS_INCLUDE_PATH/LIBRARY_PATH；另注意 conan AutotoolsToolchain.environment() 是工厂方法，env 修改必须回传 tc.generate(env=env) 才生效"
- "conan --prefix=/ 装包使依赖包内 .la 记录 libdir='//lib'，libtool 解析 LIBADD=-lldap 时报 'not a valid libtool archive'；构建前删除坏 .la（a52dec/0.7.4 先例），libtool 回退直链 .so"
- "install-data-hook 用 LN_S 为每个插件建 lcmaps_<mod>.mod 符号链接；E018（OHOS 对软链接创建受限）兜底补丁 0004：LN_S 失败回退 cp -p，保持 .mod 可 dlopen 语义"
- "上游零自动化测试（无 check 目标/TESTS/check_PROGRAMS；5 个 plugin_test.c 仅 EXTRA_DIST 手工程序）；产物验证以 test_package 冒烟（RTLD_NOW dlopen 7 个 .mod + dlsym 插件契约三入口 + 包内清单断言）真实执行代替"
