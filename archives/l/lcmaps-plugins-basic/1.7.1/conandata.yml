sources:
  url: "https://software.nikhef.nl/security/lcmaps-plugins-basic/lcmaps-plugins-basic-1.7.1.tar.gz"
  sha256: "ed3a02cdac4171fa47670b7ad962f9b2d473409621aeb68ab2a8e2c1dc8e40ba"

patches:
  - patch_file: "patches/0001-config-guess-harmonyos.patch"
    patch_description: "Add HarmonyOS (aarch64) system identification to config.guess (uname -s reports HarmonyOS; without this config.guess falls into its compile-fallback path which fails on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "Add linux-ohos OS recognition to config.sub (2014-07-28 vintage: maybe_os KERNEL-OS list + OS pattern list)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-hmdfs-tmpdir.patch"
    patch_description: "HMDFS fix: create configure temp dirs without umask 077 (dirs created 2700 are owner-unwritable on HMDFS) with chmod 755; same fix as lcmaps/1.6.7 and libmnl/1.0.5 patches/0003"
    patch_type: "portability"
  - patch_file: "patches/0004-mod-install-symlink-fallback.patch"
    patch_description: "install-data-hook: fall back to cp when the .mod symlink creation fails (knowledge E018: OHOS SELinux/HMDFS restricts symlink creation in some directories); keeps symlink semantics when possible"
    patch_type: "portability"
