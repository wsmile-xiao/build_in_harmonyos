platform_limits:
  - "FUSE kernel module not available on OpenHarmony (dev)"
  - "/dev/fuse permission denied"
  - "Mount functionality requires FUSE kernel support"
  - "FUSE userland tools (fusermount + libfuse.so) installed from precompiled package"
  - "Precompiled package cannot solve kernel module missing issue"
knowledge_gained:
  - "链接器模式差异（musl vs glibc）：使用 -Wl,--allow-shlib-undefined 放宽限制"
  - "Makefile 项目适配：设置 PKG_CONFIG_PATH，添加 RPATH"
  - "FUSE 软件 OpenHarmony 平台限制：需内核模块支持"
notes: |
  luufs is a lazy man's, user-mode union file system.
  Implemented in C using FUSE.

  Key challenges:
  - Linker error due to --no-allow-shlib-undefined
  - Solution: use -Wl,--allow-shlib-undefined

  Functional test results:
  - Binary integrity: PASS
  - Dependency check: PASS
  - CLI interface: PASS
  - Mount test: BLOCKED (platform limit: no FUSE kernel module)

  Deployment requirements:
  - Target system must enable FUSE kernel module
  - fusermount tool + libfuse.so.2 required
