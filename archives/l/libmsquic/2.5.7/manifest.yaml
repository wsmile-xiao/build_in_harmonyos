version: "2.5.7"
software: "libmsquic"
status: built
build_date: "2026-09-17"
build_system: "cmake"

source:
  url: "https://github.com/microsoft/msquic/archive/refs/tags/v2.5.7.tar.gz"
  sha256: "ef447e3fb2e3d7e2dd2edfe23576e0e5fb7225073d8e83b30ca4e2a63a99b9e5"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DQUIC_BUILD_SHARED=OFF"
    - "-DQUIC_BUILD_TOOLS=OFF"
    - "-DQUIC_BUILD_PERF=OFF"
    - "-DQUIC_BUILD_TEST=ON"
    - "-DQUIC_ENABLE_LOGGING=OFF"
    - "-DQUIC_TLS_LIB=quictls"
    - "-DQUIC_USE_SYSTEM_LIBCRYPTO=OFF"
    - "-DQUIC_LINUX_XDP_ENABLED=OFF"
    - "-DQUIC_EMBED_GIT_HASH=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GitHub release tarball不含submodule，需按v2.5.7 pinned commits重取clog/quictls/googletest"
  - "Linux默认lttng日志在OHOS不可用，QUIC_ENABLE_LOGGING=OFF"
  - "XDP仅x64支持，aarch64强制QUIC_LINUX_XDP_ENABLED=OFF"
  - "msquictest端到端套件在HarmonyOS沙箱2400秒超时，仅跑msquiccoretest+msquicplatformtest单元子集（ctest -R），排除项见test_package/MANIFEST.yml"
  - "TlsTest初始化失败根因：selfsign_openssl.c硬编码/tmp（真机只读），证书生成返回NULL；配方honor TMPDIR回退/tmp并放大路径缓冲"
