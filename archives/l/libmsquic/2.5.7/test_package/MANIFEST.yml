package: libmsquic/2.5.7
homepage: "https://github.com/microsoft/msquic"

upstream_tests_exist: true
upstream_test_audit: "msquic v2.5.7 上游存在完整测试套件：src/core/unittest（msquiccoretest，约208用例）、src/platform/unittest（msquicplatformtest，约66用例）、src/test（msquictest，约1681用例）。真机实测：全量 ctest --output-on-failure 在 HarmonyOS 沙箱 2400 秒超时、零汇总输出（msquictest 需实时 UDP 回环 QUIC 握手与自签证书，沙箱内永不结束）；故按 knowledge E344 口径仅运行自包含单元子集，msquictest 的约1681用例未运行；单元部分的 discovered/executed/passed 以真机 gtest 汇总解析为准；round-3 真机证据：全量ctest改-R后 msquiccoretest 600秒超时零汇总、msquicplatformtest 的 TlsTest 初始化失败致50跳过，根因为 selfsign_openssl.c 硬编码 /tmp（真机只读）致证书生成失败，配方已改走 TMPDIR 回退 /tmp 并分片执行定位core挂起用例"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "per-suite shards: ./msquiccoretest --gtest_filter='Suite.*' + ./msquicplatformtest --gtest_filter='Suite.*' (timeout 90s/suite, SpinFrame 600s, cwd=bin dir)"

excluded_upstream_tests:
  - file: src/test/bin
    source: msquic-2.5.7/src/test
    description: "端到端协议/集成测试 (msquictest, 约1681用例, gtest, 需实时UDP回环与自签证书)"
    reason: "HarmonyOS 沙箱内全量 ctest 2400 秒超时零输出，msquictest 永不结束；已在补充说明声明未运行，不计入通过率"

upstream_tests:
  - file: src/core/unittest
    source: msquic-2.5.7/src/core/unittest
    description: "QUIC 核心协议单元测试 (msquiccoretest, 约208用例, gtest)"
    command: "./msquiccoretest --gtest_filter='Suite.*' per-suite shards (timeout 90s/suite, SpinFrame 600s)"
  - file: src/platform/unittest
    source: msquic-2.5.7/src/platform/unittest
    description: "平台层单元测试 (msquicplatformtest, 约66用例, gtest)"
    command: "./msquicplatformtest --gtest_filter='Suite.*' per-suite shards (timeout 90s/suite)"

test_package_tests:
  - file: test_msquic.c
    description: "消费者冒烟测试1：MsQuicOpen2/MsQuicClose，校验API表非空"
    command: "./test_msquic open"
  - file: test_msquic.c
    description: "消费者冒烟测试2：RegistrationOpen/Close，校验库线程与内存管理"
    command: "./test_msquic registration"

assertion_count: 310
result_format: "HMBS_TEST_PACKAGE_RESULT JSON（discovered=2，passedCount由test_msquic真实计数打印）；HMBS_UPSTREAM_TEST_RESULT JSON（单元子集约274用例=208+66文档示例值，gtest汇总解析，build()持久化至res/hmbs_upstream.json，test_package每轮复发；msquictest约1681用例已排除，见excluded_upstream_tests）"
