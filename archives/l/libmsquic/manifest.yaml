software: libmsquic
display: "MsQuic"
description: "Microsoft implementation of the IETF QUIC protocol (C library)"
category: network
homepage: "https://github.com/microsoft/msquic"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "自包含vendored quictls（OpenSSL分支），无需外部openssl依赖"
    - "QUIC_ENABLE_LOGGING=OFF：OHOS无lttng，关闭日志后端"
    - "QUIC_BUILD_TOOLS/PERF=OFF，仅构建库与测试，节省真机时间"
    - "QUIC_LINUX_XDP_ENABLED=OFF：XDP不支持ARM架构"
    - "GitHub tarball不含submodule，配方内按pinned commit重取clog/quictls/googletest官方源码"
  common_dependencies: []

versions:
  "2.5.7":
    status: built
    build_date: "2026-09-17"
