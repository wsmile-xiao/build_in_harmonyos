# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsixel/1.10.5
homepage: "https://github.com/libsixel/libsixel"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libsixel meson tests are disabled in build (tests=disabled)
# upstream tests require bash and img2sixel_tests.sh / sixel2png_tests.sh
upstream_tests:
  - file: converters/img2sixel_tests.sh
    source: libsixel-1.10.5/converters/img2sixel_tests.sh
    description: "img2sixel converter integration tests"
    command: "bash img2sixel_tests.sh"
  - file: converters/sixel2png_tests.sh
    source: libsixel-1.10.5/converters/sixel2png_tests.sh
    description: "sixel2png converter integration tests"
    command: "bash sixel2png_tests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证 sixel_allocator_new API 调用"
    command: "./test_libsixel"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
