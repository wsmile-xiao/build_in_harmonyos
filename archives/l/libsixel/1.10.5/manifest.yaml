software: libsixel
version: "1.10.5"
status: built
build_date: "2026-08-19"
build_system: meson

source:
  url: "https://github.com/libsixel/libsixel/archive/refs/tags/v1.10.5.tar.gz"
  tar_format: tar.gz

build:
  system: meson
  options:
    - "-Dgdk-pixbuf2=enabled"
    - "-Dgd=enabled"
    - "-Dlibcurl=enabled"
    - "-Djpeg=enabled"
    - "-Dpng=enabled"
    - "-Dpython=disabled"
    - "-Dtests=disabled"
    - "default_library=static"

patches:
  - patches/0001-meson-build-gd-pkgconfig.patch

dependencies:
  - libjpeg/10
  - libpng/1.6.58
  - gd/2.3.3.2
  - curl/8.15.0
  - gdk-pixbuf/2.44.6

knowledge_gained:
  - "libsixel是Sixel图像格式库"
  - "meson构建系统，所有可选功能启用(不裁剪)"
  - "依赖: libjpeg, libpng, gd, curl, gdk-pixbuf"
  - "需要patch将cc.find_library('gd')改为dependency('gdlib')以使用pkg-config"
  - "OHOS动态链接器不支持LD_LIBRARY_PATH加载用户目录的.so，默认使用静态链接"
  - "meson需要设置AR环境变量为llvm-ar完整路径(HMDFS PATH解析问题)"
