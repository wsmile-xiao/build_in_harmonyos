# test_package/MANIFEST.yml
# ldns-tools ships drill + the examples/ programs only; upstream's own test
# suite needs the full source tree and belongs to the ldns archive.
package: ldns-tools/1.9.2
homepage: "https://www.nlnetlabs.nl/projects/ldns/"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# R34: the test_package must actually invoke the tested binaries.
test_package_tests:
  - file: test.sh
    description: >-
      端到端: drill -v 与 ldns-version 的版本查询, 用内嵌 zone 夹具跑
      ldns-read-zone 并断言解析出的 SOA/A 记录, 再用缺失文件作反例
    command: "bash test.sh"

assertion_count: 6