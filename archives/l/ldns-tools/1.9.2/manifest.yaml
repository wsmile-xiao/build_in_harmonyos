# 版本级 manifest — ldns-tools 1.9.2
# 遵循 ARCHIVE-SPEC v2.0

version: "1.9.2"
software: ldns-tools

status: built
build_date: "2026-09-16"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://www.nlnetlabs.nl/downloads/ldns/ldns-1.9.2.tar.gz"
  sha256: "b524fa21994b6e834200ceb8c27f1b84bda5982fe35706f058196c079db94d5d"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options:
    - "--enable-static --disable-shared"   # 工具自包含, 不产出 libldns
    - "--with-drill"                       # 产出 drill
    - "--with-examples"                    # 产出 ldns-* 系列示例程序
    - "--without-pyldns"                   # SWIG python 绑定不属于命令行工具
    - "--with-ssl=<openssl/3.5.6>"         # drill 与签名/校验类工具需要
  install_targets:
    - "install-drill"
    - "install-examples"
  dependencies:
    - openssl/3.5.6
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "ldns 的库和工具由同一次 ./configure && make 产出: --with-drill / --with-examples 只决定“编不编这些程序”, 真正的库/工具拆分只存在于 Makefile 的安装目标层 (install-lib install-h install-pc vs install-drill install-examples); 拆分包必须逐目标安装, 不能 make install"
  - "ldns 的聚合安装目标 install 会连带 install-manpages, 其中 470+ 个 ldns_*.3 man3 页面对工具包毫无意义且会把鸿蒙端构建拖到超时 —— 拆分包要显式列出 install-drill install-examples 两个目标"
  - "ldns 1.9.2 自带的 config.guess 时间戳已是 2026-05-17, 但仍只认 aarch64:Linux:*, 没有 HarmonyOS 分支; 交叉构建下 configure 报 'cannot guess build type; you must specify one', 需要补 aarch64:HarmonyOS:*:* 分支并让 config.sub 接受 aarch64-harmonyos-linux-gnu 三元组"
  - "HarmonyOS 的 HMDFS 会让 config.status 用 umask 077 + mktemp -d 建的临时目录不可写, configure 报 \"can't create ./confXXXXXX/subs1.awk: Permission denied\"; 需把 configure 里两处临时目录创建改成 umask 000 + mkdir -p $TMPDIR/conf$$"
  - "drill 用短选项 -v 打印版本并以 0 退出, 但它是 getopt(不是 getopt_long), 平台 L2 冒烟测试的 --version/--help 会落到未知选项分支; 好在 examples/ldns-version 的 main(void) 忽略 argv 直接打印 ldns_version(), 因此 L2 仍能通过"