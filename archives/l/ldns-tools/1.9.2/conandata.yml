# conandata.yml — ldns-tools 1.9.2
# 上游: https://www.nlnetlabs.nl/projects/ldns/
sources:
  url: "https://www.nlnetlabs.nl/downloads/ldns/ldns-1.9.2.tar.gz"
  sha256: "b524fa21994b6e834200ceb8c27f1b84bda5982fe35706f058196c079db94d5d"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: >-
      给 ldns 1.9.2 自带的 config.guess（timestamp 2026-05-17）补 aarch64:HarmonyOS
      分支；该版本仍只认 Linux，在鸿蒙上 configure 直接报
      "cannot guess build type; you must specify one"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: >-
      让 config.sub 接受 aarch64-harmonyos-linux-gnu 三元组，否则 config.guess
      猜出的结果会被 config.sub 判为 Invalid configuration
    patch_type: "portability"