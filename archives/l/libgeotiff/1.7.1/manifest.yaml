software: libgeotiff
version: "1.7.1"
build_system: cmake
status: built
source:
  url: "https://github.com/OSGeo/libgeotiff/releases/download/1.7.1/libgeotiff-1.7.1.tar.gz"
  sha256: "05ab1347aaa471fc97347d8d4269ff0c00f30fa666d956baba37948ec87e55d6"
knowledge_gained:
  - "libproj.a 是 C++ 静态库，链接到 C 共享库时需要 -fuse-ld=bfd 和 -lc++_shared"
  - "libgeotiff 依赖 libtiff.so 的所有传递依赖（zstd, libwebp, lerc, libdeflate）"
  - "CMAKE_C_STANDARD_LIBRARIES 追加到链接命令末尾，可解决传递依赖顺序问题"
  - "conan create 强制重建时会忽略 source() 中的离线检查，需要从 conan 下载缓存获取源码"
  - "1.7.1 CMakeLists.txt 没有 BUILD_MAN/BUILD_DOC 选项（1.7.4 有），defs 里不要加这两个"
