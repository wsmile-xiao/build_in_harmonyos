software: libgeotiff
version: "1.7.4"
build_system: cmake
status: built
source:
  url: "https://github.com/OSGeo/libgeotiff/releases/download/1.7.4/libgeotiff-1.7.4.tar.gz"
  sha256: "c598d04fdf2ba25c4352844dafa81dde3f7fd968daa7ad131228cd91e9d3dc47"
knowledge_gained:
  - "libproj.a 是 C++ 静态库，链接到 C 共享库时需要 -fuse-ld=bfd 和 -lc++_shared"
  - "libgeotiff 依赖 libtiff.so 的所有传递依赖（zstd, libwebp, lerc, libdeflate）"
  - "CMAKE_C_STANDARD_LIBRARIES 追加到链接命令末尾，可解决传递依赖顺序问题"
  - "conan create 强制重建时会忽略 source() 中的离线检查，需要从 conan 下载缓存获取源码"
