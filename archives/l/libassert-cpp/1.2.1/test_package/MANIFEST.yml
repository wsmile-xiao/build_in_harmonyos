# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libassert-cpp/1.2.1
homepage: "https://github.com/jeremy-rifkin/libassert"

# 上游测试命令 (ctest -N 列出的目标)
upstream_check_command: "cmake --build . -DASSERT_BUILD_TESTS=ON && ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（占位，首轮 Adapt 后按真实 ctest 结果补充）
upstream_tests:
  - file: tests/basic
    source: libassert-1.2.1/tests/basic
    description: "upstream basic assertion behaviour tests"
    command: ""

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "consumer links assert::assert and exercises ASSERT macro"
    command: "./test_libassert_cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2