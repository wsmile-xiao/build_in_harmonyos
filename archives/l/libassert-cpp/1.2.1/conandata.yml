patches:
  "1.2.1":
    - patch_file: "patches/0001-fix-raw-string-literal-regex-libcxx.patch"
      patch_description: "Replace tempered-dot lookahead backreference in raw_string_literal regex with a lazy match. OHOS libc++ std::regex rejects backreferences inside lookahead assertions, which made the analysis regex throw regex_error at runtime (3 upstream tests crashed). Verified functionally equivalent on 8 raw-string-literal token shapes."
      patch_type: "portability"