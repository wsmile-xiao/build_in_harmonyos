# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libopf/2.1
homepage: "https://github.com/jppbsi/LibOPF"

# 上游无测试框架（无 ctest/GTest）；验证入口为 examples/ 6 个端到端脚本
# 与 tools/ 2 个统计脚本，均在本地完成枚举并实际运行（全部 rc=0）
upstream_check_command: "sh examples/example1.sh ... example6.sh"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（端到端分类流程：split→train/learn/cluster→classify→accuracy）
upstream_tests:
  - file: examples/example1.sh
    source: LibOPF-7b44910/examples/example1.sh
    description: "无学习过程 OPF 分类：boat.dat split 50/50 → opf_train → opf_classify → opf_accuracy"
    command: "sh example1.sh"
  - file: examples/example2.sh
    source: LibOPF-7b44910/examples/example2.sh
    description: "带学习过程 OPF 分类：boat.dat split 30/20/50 → opf_learn → opf_classify → opf_accuracy"
    command: "sh example2.sh"
  - file: examples/example3.sh
    source: LibOPF-7b44910/examples/example3.sh
    description: "预计算距离（Manhattan）无学习分类：cone-torus.dat"
    command: "sh example3.sh"
  - file: examples/example4.sh
    source: LibOPF-7b44910/examples/example4.sh
    description: "预计算距离带学习分类：cone-torus.dat"
    command: "sh example4.sh"
  - file: examples/example5.sh
    source: LibOPF-7b44910/examples/example5.sh
    description: "无监督 OPF 聚类分类：data1-5.dat 五种 k/P2 参数组合（脚本原引用 opf_knn_classify 已修正为 opfknn_classify）"
    command: "sh example5.sh"
  - file: examples/example6.sh
    source: LibOPF-7b44910/examples/example6.sh
    description: "半监督 OPF 分类：saturn.dat（含/不含 evaluating 两流程）"
    command: "sh example6.sh"
  - file: tools/runOPF.sh
    source: LibOPF-7b44910/tools/runOPF.sh
    description: "监督 OPF 多次运行统计（boat.dat 1 次迭代实测：97.06%）"
    command: "bash runOPF.sh ../data/boat.dat 0.5 0.5 0 1"
  - file: tools/runLearning.sh
    source: LibOPF-7b44910/tools/runLearning.sh
    description: "监督 OPF 学习过程多次运行统计（boat.dat 1 次迭代实测：92.65%/94.12%）"
    command: "bash runLearning.sh ../data/boat.dat 0.3 0.2 0.5 0 1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者验证：构造 8 节点 OPF 数据集 → ReadSubgraph → SplitSubgraph → CreateArcs+OPFTraining → OPFClassifying → opf_Accuracy（训练/分类/准确率 ≥ 50% 断言）"
    command: "./test_libopf"
  - file: ohos_specific_test.c
    description: "鸿蒙专项测试：验证 aarch64 平台两处适配修复——①SNode.status 无符号 char 导致 NIL(-1) 比较失效的 opf_SplitSubgraph 段错误（6+2=8 分割无崩溃）；②聚类 label 超过 nlabels 时 opf_ConfusionMatrix/opf_Accuracy 堆越界（acc=50.00% 有效数值）"
    command: "./ohos_specific_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6