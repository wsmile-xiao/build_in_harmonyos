# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lwmem/2.2.4
homepage: "https://github.com/MaJerle/lwmem"

# 上游测试命令: CMake 构建 7 个测试配置, 每个 ctest 1 个用例 (R51 清点)
upstream_check_command: "cmake -S . -B build -DTEST_CMAKE_FILE_NAME=tests/<name>/cmake.cmake && cmake --build build && ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (7 个配置, 每个 1 个 ctest 用例, 本机 7/7 通过)
upstream_tests:
  - file: tests/test_simple_config/lwmem_test_simple.c
    source: lwmem-2.2.4/tests/test_simple_config/lwmem_test_simple.c
    description: "simple config (LWMEM_CFG_FULL=0) 分配行为"
    command: "./LwLibPROJECT"
  - file: tests/test_available_mem/lwmem_test_available_mem.c
    source: lwmem-2.2.4/tests/test_available_mem/lwmem_test_available_mem.c
    description: "可用内存统计"
    command: "./LwLibPROJECT"
  - file: tests/test_memory_structure/lwmem_test_memory_structure.c
    source: lwmem-2.2.4/tests/test_memory_structure/lwmem_test_memory_structure.c
    description: "内存块结构"
    command: "./LwLibPROJECT"
  - file: tests/test_region_allocation/lwmem_test_region_allocation.c
    source: lwmem-2.2.4/tests/test_region_allocation/lwmem_test_region_allocation.c
    description: "跨 region 分配"
    command: "./LwLibPROJECT"
  - file: tests/test_region_size_alignment/lwmem_test_region_size_alignment.c
    source: lwmem-2.2.4/tests/test_region_size_alignment/lwmem_test_region_size_alignment.c
    description: "region 大小与对齐"
    command: "./LwLibPROJECT"
  - file: tests/test_statistics/lwmem_test_statistics.c
    source: lwmem-2.2.4/tests/test_statistics/lwmem_test_statistics.c
    description: "统计计数"
    command: "./LwLibPROJECT"
  - file: tests/test_stats_compile/lwmem_test_stats_compile.c
    source: lwmem-2.2.4/tests/test_stats_compile/lwmem_test_stats_compile.c
    description: "编译期统计配置"
    command: "./LwLibPROJECT"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 分配/写/重分配/释放/统计"
    command: "./test_lwmem"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 60
