# conandata.yml — libmpcdec 0.1
#
# Upstream: MusePack SV8 decoder snapshot "musepack_src_r475" (the source the
# distribution packages version as 0.1).  Official files.musepack.net tarball;
# sha256 measured locally after download
# (sha256sum musepack_src_r475.tar.gz).

sources:
  "0.1":
    url: "https://files.musepack.net/source/musepack_src_r475.tar.gz"
    sha256: "a4b1742f997f83e1056142d556a8c20845ba764b70365ff9ccf2e3f81c427b2b"

patches:
  "0.1":
    - patch_file: "patches/0001-CMakeLists.txt.patch"
      patch_description: >-
        CMake >= 3.5 minimum (CMake 4.x compatibility); append-style CFLAGS
        preserving toolchain injection; -fcommon for legacy tentative
        definitions; build only libmpcdec + include
      patch_type: "portability"
    - patch_file: "patches/0002-include-CMakeLists.txt.patch"
      patch_description: >-
        Install only header files (FILES_MATCHING *.h) so the upstream .svn
        metadata stays out of include/
      patch_type: "packaging"
    - patch_file: "patches/0003-libmpcdec-CMakeLists.txt.patch"
      patch_description: >-
        Add the missing install rule and the normalized output name (mpcdec)
        for the libmpcdec static/shared targets
      patch_type: "packaging"
