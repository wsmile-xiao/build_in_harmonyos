# test_package/MANIFEST.yml — 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# libmpcdec 来自 musepack_src_r475 快照（Arch libmpcdec 1:0.1+r475），
# 上游源码包不含任何测试目标:
#   - CMake 版无 add_test()/enable_testing()，ctest 为空集
#   - autotools 版 (configure.in) 无 make check 规则
# 因此 upstream test inventory 为空，本包质量验证由 test_package 的
# 消费者解码测试承担（链接 libmpcdec，解码内嵌 SV8 流并校验 PCM）。

package: libmpcdec/0.1
homepage: "https://www.musepack.net/"

# 上游测试命令分析结果: 无
upstream_check_command: "ctest -N (empty — no add_test in upstream CMakeLists)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试清单 (无)
upstream_tests: []

# 适配侧补充测试 (test_package 消费者用例)
adapted_tests:
  - name: "sv8-streaminfo"
    command: "test_libmpcdec (links libmpcdec: mpc_demux_init/mpc_demux_get_info)"
    description: "SV8 容器头解析: stream_version=8 / 44100 Hz / 2 声道 / 6615 样本"
  - name: "sv8-full-decode"
    command: "test_libmpcdec (mpc_demux_decode over every frame)"
    description: "全流解码: 7 帧 / 6615 样本, 首样本与参考解码一致, RMS/峰值落在参考区间"
