# ============================================================

knowledge_gained:
- "2009 年代 CMake 项目在 CMake 4.x 下需把 cmake_minimum_required 提升到 3.5（<3.5 兼容已移除）(knowledge_ref: knowledge/graph/E103.kv)"
- "覆盖式 set(CMAKE_C_FLAGS ...) 会丢弃 Conan toolchain 注入的 CFLAGS，必须改为追加式；mpc_decoder.c/requant.c 的多 TU tentative definition (Res_bit/__Cc/__Dc) 需 -fcommon (knowledge_ref: knowledge/drafts/E322-draft-8541.kv)"
- "同一上游 tarball 可按交付物拆包：只构建 libmpcdec 时不需要 libcuefile/libreplaygain（它们只被 mpcgain/mpcchap 工具使用），依赖集为空 (knowledge_ref: knowledge/graph/E425.kv)"
- "test_package 内嵌 known-answer SV8 流（同版本参考编码器产物，C 数组形式，PR 无二进制夹具）后走 mpc_reader->mpc_demux_init->mpc_demux_decode 全流解码 + PCM 断言，可在上游零测试、解码库包不含对端编码器时真实验证 (knowledge_ref: knowledge/drafts/DRAFT-7316-quirc-decoder-only-consumer-test.kv)"

