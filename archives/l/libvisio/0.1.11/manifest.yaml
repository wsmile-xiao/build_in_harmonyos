# 版本级 manifest
# 文件位置: archives/l/libvisio/0.1.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.11"

# 软件名
software: "libvisio"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-22"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/LibreOffice/libvisio/archive/refs/tags/libvisio-0.1.11.tar.gz"

  # 源码校验和
  sha256: "1c0862937939423c5e793b5ca25f218bc5f2a1d4210054e726134c3b60352798"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-tests"
    - "--disable-tools"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "boost/1.90.0.3"
    - "librevenge/0.0.5@ohpcd/stable"
    - "icu4c/78@ohpcd/stable"
    - "libxml2/2.15.3"
    - "zlib/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E165 shebang fix required for autogen.sh and configure"
  - "E002 mktemp wrapper needed for HMDFS config.status"
  - "AUTOM4TE env var needed for aclocal @am_AUTOM4TE@ workaround"
  - "LD_LIBRARY_PATH breaks lld (linked against libxml2), use -Wl,-rpath instead"
  - "ICU static lib lacks -fPIC, must use --enable-static --disable-shared"
  - "librevenge .la files have broken libdir='//lib', need runtime fix"
  - "PkgConfigDeps generates .pc without version suffix, need aliases"
  - "librevenge package doesn't expose cpp_info.includedirs, need manual include path"
