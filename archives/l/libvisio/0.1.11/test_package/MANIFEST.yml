# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libvisio/0.1.11
homepage: "https://github.com/LibreOffice/libvisio"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(target='check')"

# 上游实际运行的测试程序
# 源码: src/test/Makefile.am
# tests = importtest unittest
# unittest_SOURCES = VSDInternalStreamTest.cpp VSDXMLHelperTest.cpp (9 CPPUNIT_TEST cases)
# importtest_SOURCES = importtest.cpp xmldrawinggenerator.cpp (37 data files)
upstream_tests:
  - file: src/test/VSDInternalStreamTest.cpp
    source: libvisio-0.1.11/src/test/VSDInternalStreamTest.cpp
    description: "VSDInternalStream 单元测试 (5 CPPUNIT_TEST cases)"
    command: "./unittest"
  - file: src/test/VSDXMLHelperTest.cpp
    source: libvisio-0.1.11/src/test/VSDXMLHelperTest.cpp
    description: "VSDXMLHelper 单元测试 (4 CPPUNIT_TEST cases)"
    command: "./unittest"
  - file: src/test/importtest.cpp
    source: libvisio-0.1.11/src/test/importtest.cpp
    description: "导入测试，使用 37 个 .vsd/.vsdx/.wmf/.png 数据文件验证解析"
    command: "./importtest"
  - file: src/test/data/
    source: libvisio-0.1.11/src/test/data/
    description: "37 个测试数据文件 (.vsd/.vsdx/.wmf/.png)"
    command: "importtest 使用"

# 上游测试运行结果：全部通过
# PASS: unittest (9 CPPUNIT_TEST cases)
# PASS: importtest (37 data files)
# # PASS: 2, # FAIL: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 创建 RVNGStringStream 并调用 VisioDocument::isSupported() API"
    command: "./test_libvisio"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 unittest: 9 CPPUNIT_TEST cases (全部通过)
# 上游 importtest: ~63 test assertions with 37 data files (全部通过)
# test_package: 1 assertion (isSupported() returns false for non-Visio data)
assertion_count: 11
