# test_package/MANIFEST.yml
# 上游官方测试声明 (CI 门禁 L0e 要求此文件存在)

package: libbfio/20170123
homepage: "https://github.com/libyal/libbfio"

# 上游自带 autotools 测试套件：tests/Makefile.am 注册 12 个可执行测试单元
# （`check_PROGRAMS` 10 个测试程序 + `TESTS` 2 个测试入口脚本）。
# 设备原生 `make check` 实跑通过（# TOTAL: 2 / # PASS: 2 / # FAIL: 0）；
# 其中 20170123 版 `TESTS` 未驱动的 4 个程序（handle_read/handle_seek/
# pool_read/pool_seek 在 tests/*.sh 中无任何引用，make check 只编译不执行）
# 按同约定补跑，10/10 rc=0 —— 合计 12/12，无跳过、无未执行。
# 另单列：tests/ 测试源全集 11 个 = 10 程序 + 支持源 bfio_test_memory.c
# （无独立入口/无 main，编入 handle/pool 的 SOURCES，Makefile.am L59/L104），
# 不与上面的计数混用。
# 执行形态（E386：用 automake `LOG_COMPILER` 指定设备可用 bash 启动 runner，
# 不改上游脚本；源码目录名与 test_write_functions.sh 的 TEST_PREFIX 缺陷）
# 与逐字执行记录见 archives/l/libbfio/20170123/reports/upstream-tests.md；
# 本包的 W3/CI 消费者验证由 test_package/ 承担。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check LOG_COMPILER=/data/service/hnp/bin/bash"

# 上游测试单元（计数单位 = automake 注册项，与 reports/test-report.md、
# PR 正文「上游库测试用例统计」表同源同单位：10 + 2 = 12）
upstream_tests:
  # ── automake check_PROGRAMS：10 个可执行测试程序（tests/Makefile.am L31–L41）──
  - file: tests/bfio_test_error.c
    registered_as: check_PROGRAMS
    description: "error 对象创建/复制/打印/释放（无参数）"
    command: "./bfio_test_error"
  - file: tests/bfio_test_support.c
    registered_as: check_PROGRAMS
    description: "库版本字符串与 codepage 支持函数（无参数）"
    command: "./bfio_test_support"
  - file: tests/bfio_test_handle.c
    registered_as: check_PROGRAMS
    description: >-
      handle 全生命周期（打开/读写/seek/clone/关闭，输入 input/raw/test.raw）；
      同时编入失败注入支持源 bfio_test_memory.c
    command: "./bfio_test_handle input/raw/test.raw"
  - file: tests/bfio_test_pool.c
    registered_as: check_PROGRAMS
    description: >-
      文件池创建/挂载/分离（输入 input/raw/test.raw）；同时编入失败注入
      支持源 bfio_test_memory.c
    command: "./bfio_test_pool input/raw/test.raw"
  - file: tests/bfio_test_handle_read.c
    registered_as: check_PROGRAMS
    description: >-
      handle 读路径（输入 input/raw/test.raw）；20170123 版 TESTS 未驱动，
      按 test_library.sh 的 run_test_with_input 同约定补跑
    command: "./bfio_test_handle_read input/raw/test.raw"
  - file: tests/bfio_test_handle_seek.c
    registered_as: check_PROGRAMS
    description: >-
      handle seek 各 whence 与边界（输入 input/raw/test.raw）；20170123 版
      TESTS 未驱动，按同约定补跑
    command: "./bfio_test_handle_seek input/raw/test.raw"
  - file: tests/bfio_test_handle_write.c
    registered_as: check_PROGRAMS
    description: "handle 写路径（由 TESTS 的 test_write_functions.sh 驱动，空文件与 1000 字节两档）"
    command: "./bfio_test_handle_write <tmp>/write <0|1000>"
  - file: tests/bfio_test_pool_read.c
    registered_as: check_PROGRAMS
    description: >-
      文件池读路径（输入 input/raw/test.raw）；20170123 版 TESTS 未驱动，
      按同约定补跑
    command: "./bfio_test_pool_read input/raw/test.raw"
  - file: tests/bfio_test_pool_seek.c
    registered_as: check_PROGRAMS
    description: >-
      文件池 seek（输入 input/raw/test.raw）；20170123 版 TESTS 未驱动，
      按同约定补跑
    command: "./bfio_test_pool_seek input/raw/test.raw"
  - file: tests/bfio_test_pool_write.c
    registered_as: check_PROGRAMS
    description: "文件池写路径（由 TESTS 的 test_write_functions.sh 驱动，空文件与 1000 字节两档）"
    command: "./bfio_test_pool_write <tmp>/write <0|1000>"

  # ── automake TESTS：2 个测试入口脚本（tests/Makefile.am L15–L17）──
  - file: tests/test_library.sh
    registered_as: TESTS
    description: >-
      automake TESTS 入口 1：驱动 error/support/handle/pool 共 4 个程序
      （handle、pool 走 input/raw/test.raw）
    command: "./tests/test_library.sh"
  - file: tests/test_write_functions.sh
    registered_as: TESTS
    description: >-
      automake TESTS 入口 2：驱动 handle_write/pool_write 共 2 个程序
      （各 0 与 1000 两档）
    command: "./tests/test_write_functions.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >-
      C 消费者：通过已安装的 libbfio.h 调用公开 API——libbfio_get_version、
      libbfio_file_initialize/set_name、libbfio_handle_open(LIBBFIO_OPEN_READ)/
      get_size/read_buffer/seek_offset(SEEK_SET)/close/free，对真实文件做
      写入/大小/顺序读/绝对 seek/seek 后内容共 14 项检查
    command: "./test_bfio"

# 测试断言总数 (test_bfio 的 CHECK 宏 14 项；计数单位与 reports/test-report.md 一致)
assertion_count: 14
