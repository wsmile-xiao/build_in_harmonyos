version: "20170123"
software: "libbfio"
status: built
build_date: "2026-09-18"
conan_ref: "libbfio/20170123"
build_system: autotools

source:
  # 上游 GitHub 仓库重置后 20170123 release 资产已删除；使用 Debian 的
  # pristine orig tarball（无 +dfsg、无重打包），内容哈希由 PGP 签名的
  # libbfio_20170123-6.dsc 锚定，与官方 20170123 发布内容一致。
  # 溯源与核对过程见 notes.md「源码溯源」。
  url: "https://deb.debian.org/debian/pool/main/libb/libbfio/libbfio_20170123.orig.tar.gz"
  sha256: "d45eaa2c7bc5d75905bbd1d04f9730e17bb4b638417343db1af410f3b17a15dd"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-nls"
  dependencies: []
  cc: clang
  cxx: ""

# 平台适配以 conanfile.py build() 内联补丁实施（E007/E011，见注释与 notes.md），
# 不使用 patches/ 文件，故本列表为空。
patches_applied: []

knowledge_gained:
  - "libyal 2017 年代源码的 config.sub 与 2024 结构完全不同（无 android/basic_os 分支）：接受 linux-ohos 三元组要改两处——KERNEL-OS 拆分分支的 maybe_os 列表加 linux-ohos*、os 合法性列表加 -linux-ohos*；libesedb 20240420 的内联补丁锚点（basic_os=linux-android 等）在旧版上不存在，不能照抄"  # knowledge_ref: E007
  - "HMDFS 上 autotools config.status 的 mktemp -d 临时目录（umask 077 → 0700）连创建者都无法写入，configure 报 'can''t create .../subs1.awk: Permission denied'；把 configure 内 umask 077 全部替换为 022 即修复（E011 在树内构建同样成立）"  # knowledge_ref: E011
  - "libyal 测试套件在 OHOS 设备上可原样 make check：两个 TESTS 入口带 #!/bin/bash 而设备无 /bin/bash，用 automake 的 LOG_COMPILER 指定一个**能力探测通过**的设备 bash（构建目录内 `bash -c pwd` 的 rc=0 且 stderr 为空）即可，上游脚本与 Makefile.am 一个字节都不用改（E386 的 capability-tested shell 形态）"  # knowledge_ref: DRAFT-E584-libyal-tests-prefix-and-driven-subset
  - "上游 test_write_functions.sh 的 TEST_PREFIX 推导 sed 写成 `s/^lib\\([^-]*\\)/\\1/`，比 test_library.sh 的 `s/^lib\\([^-]*\\).*$/\\1/` 少一个 `.*$`：release/orig tarball 的顶层目录名 libbfio-<版本> 下会算出 bfio-<版本>（实际产物是 bfio_test_*），报 'Missing test executable: ./bfio-<版本>_test_handle_write.exe'。该缺陷与平台无关（任何平台从 release tarball 直跑 make check 都会命中），改用与上游 git 检出等价的目录名 libbfio/ 运行即通过，不要改上游脚本"  # knowledge_ref: DRAFT-E584-libyal-tests-prefix-and-driven-subset
  - "libbfio 20170123 的 TESTS 只驱动 10 个 check_PROGRAMS 中的 6 个：test_library.sh 跑 error/support/handle/pool，test_write_functions.sh 跑 handle_write/pool_write；handle_read/handle_seek/pool_read/pool_seek 在 tests/*.sh 中无任何引用，make check 只编译不执行 —— 清点上游 N 时这两个注册面（TESTS 与 check_PROGRAMS）必须分别披露，未驱动程序按 test_library.sh 的 run_test_with_input 同约定（`<程序> input/raw/test.raw`）补跑"  # knowledge_ref: DRAFT-E584-libyal-tests-prefix-and-driven-subset
