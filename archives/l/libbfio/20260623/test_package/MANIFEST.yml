# test_package/MANIFEST.yml
# 上游官方测试声明 (CI 门禁 L0e 要求此文件存在)

package: libbfio/20260623
homepage: "https://github.com/libyal/libbfio"

# 上游 autotools 测试套件：tests/Makefile.am 注册 12 个可执行测试程序
# （check_PROGRAMS：error/support/system_string 3 个无输入程序 +
# file/file_io_handle/file_pool/file_range/file_range_io_handle/handle/
# memory_range/memory_range_io_handle/pool 9 个 input 驱动程序），
# 另注册 autotest 套件（test_library.at 驱动上述 12 程序、
# test_manpages.at 的 LINT_MANPAGES 在无 mandoc 工具时上游即 skip）。
# 设备实测（OHOS 真机，clang 15.0.4）：
#   - make -j1 check LOG_COMPILER=/data/service/hnp/bin/bash：
#     3 个无输入程序（error/support/system_string）由 test_library.at 实跑
#     全过（# TOTAL: 3 / # PASS: 3 / # FAIL: 0），test_manpages.at 按上游
#     设计 skip（无 lint 工具，非失败）；
#   - 9 个 input 驱动程序（test_inputs_libbfio 为空表，make check 只编译
#     不驱动）按 RUN_TEST_BINARIES_WITH_INPUT 同调用约定
#     `<程序> input/raw/test.raw` 补跑，9/9 rc=0。
# 合计 12/12 可执行测试程序覆盖通过，无跳过、无未执行。
# 逐字执行记录见 reports/upstream-tests.md。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check LOG_COMPILER=/data/service/hnp/bin/bash"

# 上游测试单元（计数单位 = automake check_PROGRAMS 注册项，与
# reports/test-report.md、PR 正文「上游库测试用例统计」表同源同单位）
upstream_tests:
  # ── 无输入程序（3 个，由 test_library.at 的 RUN_TEST_BINARIES 实跑）──
  - file: tests/bfio_test_error.c
    registered_as: check_PROGRAMS
    description: "error 对象创建/复制/打印/释放（无参数）"
    command: "./bfio_test_error"
  - file: tests/bfio_test_support.c
    registered_as: check_PROGRAMS
    description: "库版本字符串与 codepage 支持函数（无参数）"
    command: "./bfio_test_support"
  - file: tests/bfio_test_system_string.c
    registered_as: check_PROGRAMS
    description: "系统字符串与宽字符转换（无参数）"
    command: "./bfio_test_system_string"

  # ── input 驱动程序（9 个，make check 只编译，按同约定补跑）──
  - file: tests/bfio_test_file.c
    registered_as: check_PROGRAMS
    description: "文件 IO 打开/读/seek（输入 input/raw/test.raw）"
    command: "./bfio_test_file input/raw/test.raw"
  - file: tests/bfio_test_file_io_handle.c
    registered_as: check_PROGRAMS
    description: "文件 IO handle（输入 input/raw/test.raw）"
    command: "./bfio_test_file_io_handle input/raw/test.raw"
  - file: tests/bfio_test_file_pool.c
    registered_as: check_PROGRAMS
    description: "文件池（输入 input/raw/test.raw）"
    command: "./bfio_test_file_pool input/raw/test.raw"
  - file: tests/bfio_test_file_range.c
    registered_as: check_PROGRAMS
    description: "文件范围（输入 input/raw/test.raw）"
    command: "./bfio_test_file_range input/raw/test.raw"
  - file: tests/bfio_test_file_range_io_handle.c
    registered_as: check_PROGRAMS
    description: "文件范围 IO handle（输入 input/raw/test.raw）"
    command: "./bfio_test_file_range_io_handle input/raw/test.raw"
  - file: tests/bfio_test_handle.c
    registered_as: check_PROGRAMS
    description: "handle 全生命周期（输入 input/raw/test.raw）"
    command: "./bfio_test_handle input/raw/test.raw"
  - file: tests/bfio_test_memory_range.c
    registered_as: check_PROGRAMS
    description: "内存范围（输入 input/raw/test.raw）"
    command: "./bfio_test_memory_range input/raw/test.raw"
  - file: tests/bfio_test_memory_range_io_handle.c
    registered_as: check_PROGRAMS
    description: "内存范围 IO handle（输入 input/raw/test.raw）"
    command: "./bfio_test_memory_range_io_handle input/raw/test.raw"
  - file: tests/bfio_test_pool.c
    registered_as: check_PROGRAMS
    description: "文件池 IO（输入 input/raw/test.raw）"
    command: "./bfio_test_pool input/raw/test.raw"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >-
      C 消费者：通过已安装的 libbfio.h 调用公开 API——libbfio_get_version、
      libbfio_file_initialize/set_name、libbfio_handle_open(LIBBFIO_OPEN_READ)/
      get_size/read_buffer/seek_offset(SEEK_SET)/close/free，对真实文件做
      写入/大小/顺序读/绝对 seek/seek 后内容共 14 项检查
    command: "./test_bfio"

# 测试断言总数 (test_bfio 的 CHECK 宏 14 项；计数单位与 reports/test-report.md 一致)
assertion_count: 14
