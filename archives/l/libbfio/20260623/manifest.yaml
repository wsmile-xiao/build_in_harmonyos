version: "20260623"
software: "libbfio"
status: built
build_date: "2026-09-27"
conan_ref: "libbfio/20260623"
build_system: autotools

source:
  # 官方 GitHub release 资产（20260623 唯一正式发布形态，含全部捆绑
  # libc* 库与生成 configure；git tag tarball 缺捆绑库目录不可用）。
  # 直连 GitHub releases 下载在本机超时，经 gh-proxy.com 镜像拉取同一
  # 官方资产，sha256 与本地实测一致。
  url: "https://github.com/libyal/libbfio/releases/download/20260623/libbfio-alpha-20260623.tar.gz"
  sha256: "95ba2ee1a6365000b454f810e92709fd02bfcac0bba8a9b36512a0e71cc1bf32"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-nls"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies: []
  cc: clang
  cxx: ""

# 平台适配以 conanfile.py build() 内联实施（E011 umask 077→022、
# 显式 --build/--host 三元组），不使用 patches/ 文件（R6 家族口径，
# 同 20170123），故本列表为空。
patches_applied: []

knowledge_gained:
  - "libbfio 20260623 的官方 release 资产（libbfio-alpha-20260623.tar.gz）含全部捆绑 libc* 目录与生成 configure，而 GitHub 同一 tag 的 git archive tarball 只有 libbfio 自身源码、无 libc* 捆绑库——两者 sha256 不同，配方必须指向官方 release 资产"  # knowledge_ref: E013 类（源资产选择）
  - "20260623 版 config.sub 已收录 ohos（`| ohos* \` 与 `| linux-ohos*-` 两分支均在），直接接受 aarch64-unknown-linux-ohos，无需 config.sub 内联补丁；但 config.guess 仍无法猜测 HarmonyOS，configure 必须显式传 --build/--host 三元组"  # knowledge_ref: E007 变体
  - "libbfio 20260623 的 autotest 套件（test_library.at）只驱动 3 个无输入程序（error/support/system_string），9 个 input 驱动程序（file/file_io_handle/file_pool/file_range/file_range_io_handle/handle/memory_range/memory_range_io_handle/pool）因 test_inputs_libbfio 为空表只编译不驱动——按 RUN_TEST_BINARIES_WITH_INPUT 同约定 `<程序> input/raw/test.raw` 补跑 9/9 rc=0，12/12 全量覆盖"  # knowledge_ref: DRAFT-E584-libyal-tests-prefix-and-driven-subset 变体
  - "libbfio_handle_close 在本版成功返回 0（非 1）：consumer 测试断言须按源码成功路径 `return( 0 )` 核对（libbfio_handle.c 第 968 行），照抄 20170123 先例的 `== 1` 会误判失败"  # knowledge_ref: 库 API 语义

