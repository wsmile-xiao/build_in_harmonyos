software: libbfio
display: "libbfio — Basic File IO Library"
description: "libyal 取证家族的基础文件 I/O 抽象库（文件/文件池/内存流/范围 IO），纯 C，为上层取证格式库提供统一访问层"
category: forensics
homepage: "https://github.com/libyal/libbfio"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GNU config.guess（2015-01-01）不识别 HarmonyOS，需内联添加检测分支 (E007)"
    - "2017 版 config.sub 结构与 2024 不同（无 android/basic_os 分支），需按旧结构锚点加 linux-ohos 识别 (E007)"
    - "HMDFS 文件系统 umask 077 导致 config.status 临时目录创建失败，需替换为 umask 022 (E011)"
    - "configure 默认启用 NLS，用 --disable-nls 避免引入 gettext/libintl (E027)"
  common_dependencies: []

versions:
  "20170123":
    status: built
    build_date: "2026-09-18"
    source_url: "https://deb.debian.org/debian/pool/main/libb/libbfio/libbfio_20170123.orig.tar.gz"
