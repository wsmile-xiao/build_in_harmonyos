package: libmstoolkit/82
homepage: "https://github.com/mhoopmann/mstoolkit"

upstream_check_command: "N/A (rev82 Makefile has no test or check target)"
upstream_test_in_build: false
upstream_test_command: ""

# Census basis: independently executable/registered upstream test entries.
# The rev82 archive has no tests/test directory, no test framework metadata,
# and no test/check target in its hand-written Makefile.
upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "Official rev82 archive tree"
    finding: "No tests/ or test/ directory and no independently executable test source"
  - path: "Makefile"
    finding: "Defines all, lite, clean, and object compilation rules only; no test/check target or TESTS registration"
  - path: "Official rev82 build metadata"
    finding: "No CTest, GoogleTest, pytest, Automake TESTS, or shell test driver is present"

test_package_tests:
  - file: test_libmstoolkit.cpp
    description: "Installed-package consumer: Spectrum/MSObject construction and MSReader MS2 write/read round-trip"
    command: "./test_libmstoolkit"
  - file: test_ohos_libmstoolkit.cpp
    description: "HarmonyOS-only AArch64 test: fail-closed platform guards, writable TMPDIR file metadata, and real MS2 API round-trip"
    command: "./test_ohos_libmstoolkit"
    ohos_specific: true

# Count unit: explicit fail-closed runtime verification branches across the
# two independently compiled and executed test programs. Compound conditions
# that return one error code count as one checkpoint.
assertion_count: 14
