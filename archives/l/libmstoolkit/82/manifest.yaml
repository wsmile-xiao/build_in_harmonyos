version: "82"
software: libmstoolkit
build_system: makefile
status: failed
build_date: "2026-09-15"
failure_reason: "当前执行主机缺少 /data/service/hnp/bin/clang++，无法完成 HarmonyOS PC/AArch64 W3 构建与专项测试"
waiting_for: "在具备 ohos-aarch64 clang 15 工具链的 HarmonyOS 构建机上重新执行 finish"

source:
  url: "https://github.com/mhoopmann/mstoolkit/archive/refs/tags/rev82.tar.gz"
  sha256: "a306a5659c55d4f9290031c5820a4f28103cea8c130e9ed567b1f009d3cfc850"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "direct clang++ compile of the rev82 Makefile source census"
    - "static library"
  dependencies:
    - "expat/2.8.2.1.1"
    - "sqlite3/3.49.1"
    - "zlib/1.3.2"
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-add-build-compatibility-header.patch"
knowledge_gained:
  - "rev82 Makefile hard-codes g++, gcc and ar; the recipe must use tools.build:compiler_executables and a discovered llvm-ar"
  - "The bundled Expat 2.2.0, SQLite 3.7.7.1 and zlib 1.2.8 can be excluded while preserving full functionality through explicit Conan dependencies"
  - "Upstream rev82 contains no registered or executable test suite; test_package supplies two independent consumer entries"
  - "Public MSReader.h requires _LARGEFILE_SOURCE and _FILE_OFFSET_BITS=64 to be propagated to consumers"
  - "A forced compatibility header selects the declared Expat/zlib headers and scopes Clang's legacy register diagnostic without rewriting CRLF sources"
  - "The compiled source census includes Apache-2.0, BSD-2-Clause, Artistic-1.0-Perl, and Zlib notices"
