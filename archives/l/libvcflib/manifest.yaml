# 软件级 manifest — libvcflib
# 文件位置: archives/l/libvcflib/manifest.yaml

software: libvcflib
display: "vcflib (libvcflib)"
description: "C++ library for parsing and manipulating VCF (Variant Call Format) files, with the upstream command line tools"
category: library
homepage: "https://github.com/vcflib/vcflib"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "源码必须取 release 的 -src 资产：GitHub 自动 tarball 的 contrib/* 子模块目录为空，CMake 配置期即失败。"
    - "HMDFS 文件系统大小写不敏感：contrib/WFA2-lib/VERSION 会被 #include <version> 命中并顶替 C++17 标准头，需 -idirafter 挂载该包含目录。"
    - "contrib/fastahack/LargeFileSupport.h 用 glibc 私有类型 __off64_t，OHOS musl/bionic 系 libc 无此类型，改标准 off_t。"
    - "WFA2 必须取静态目标 wfa2_static：85 个工具与 libvcflib.a 因此运行期不依赖 libwfa2.so（readelf 实测 NEEDED 无该库）；包内仍会随上游 WFA2 的安装规则装出 lib/libwfa2.so，本包与消费者都不使用它。"
    - "ZIG=OFF：zig 仅用于 vcfcreatemulti 的新代码路径，OHOS 无 zig 工具链，注册用例因此少 1 个（vcfcreatemulti）。"
    - "Python FFI 绑定 pyvcflib 不构建：pybind11 不在 ohpcd，OHOS 无 pybind11 工具链；其 doctest 随之未运行。"
    - "链接行必须补 pkg-config 返回的库目录（HTSLIB_LIBRARY_DIRS）：上游只消费库名，依赖不在链接器默认搜索路径时全部 not found。"

  common_dependencies:
    - htslib
    - zlib
    - bzip2

versions:
  "1.0.12":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libvcflib/1.0.12"
