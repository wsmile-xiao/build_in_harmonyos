# test_package/MANIFEST.yml — libvcflib/1.0.12 上游测试与消费者测试声明

package: libvcflib/1.0.12
homepage: https://github.com/vcflib/vcflib

# 上游测试是在 build() 里通过 ctest 真跑的（不是"仅声明"）。
# 计数单位：CMake/CTest 注册的测试用例。doctest 示例数、断言数是另一单位，只披露不并入。
upstream_test_in_build: true
upstream_test_unit: "CMake/CTest 注册用例（add_pytest / add_pydoctest / add_doctest / WFA2 的 add_wfa_test）"

upstream_tests:
  - command: "ctest -E \"vcfallelicprimitives|wfa2lib\""
    description: >-
      上游 CTest 注册面共 11 个用例：vcflib 自身 10 个（realign、pyvcflib、vcflib-api、
      vcf2tsv、vcfallelicprimitives、vcfwave、vcffilter、vcfcreatemulti[if(ZIG)]、
      vcfnulldotslashdot、doc/vcfintersect）+ 子项目 WFA2 的 wfa2lib（add_wfa_test，仅
      WFA_GITMODULE=ON 时注册，而上游 CI 正是 -DWFA_GITMODULE=ON）。
      本包 ZIG=OFF 且 pybind11 不可得，实际注册 8 个；其中 2 个的测试工具面无法在 OHOS
      运行（见 not_run），其余 6 个本轮实跑并全部通过。
    cases_registered_upstream_max: 11
    cases_registered_this_package: 8
    cases_run_this_package: 6
    cases_passed_this_package: 6
    not_run:
      - name: vcfcreatemulti
        reason: >-
          被上游 if(ZIG) 守卫；zig 只服务 vcfcreatemulti 的较新代码路径，OHOS 无 zig
          工具链，ohpcd 的 zig 0.15/0.16 不接受本项目 0.13 期 build.zig。
      - name: pyvcflib
        reason: >-
          pybind11 不在 OHOS 制品仓（ohpcd 无 pybind11/*），OHOS 亦无 pybind11 工具链，
          Python FFI 绑定模块 pyvcflib 不构建；补丁 0003 把该目标与其 doctest 一并纳入
          if(pybind11_FOUND)。
      - name: realign
        reason: >-
          test/tests/realign.py 第 12 行 `from pyvcflib import *`，与 pyvcflib 同因
          （同一守卫覆盖）。
      - name: vcfallelicprimitives
        reason: >-
          该 doctest 的一个示例把 `diff <a> <b> | tail -6` 交给 shell，并与上游用 GNU
          diffutils（默认 normal 格式）记录的期望值比对；OHOS 的 /system/bin/diff 是
          toybox（只有 unified 格式），且 OHOS Python 会给每个子进程 PATH 前置
          /system/bin:/usr/bin:/bin，/data/service/hnp/bin 的 GNU diff 永远轮不到。
          属测试工具面差异，不是产品缺陷；本轮以 ctest -E 显式排除并记为 NOT_RUN。
      - name: wfa2lib
        reason: >-
          contrib/WFA2-lib/tests/wfa.utest.sh 的 shebang 为 `#!/bin/bash -x`，OHOS 没有
          /bin/bash（bash 在 /data/service/hnp/bin），内核按 shebang 解析即 ENOENT，
          ctest 报 BAD_COMMAND；未改上游第三方 vendored 脚本。

test_package_tests:
  - file: test_libvcflib.cpp
    description: >-
      C++ 消费者：用安装后的头文件（include/vcflib + include/wfa2lib）与静态库
      （lib/libvcflib.a、lib/libwfa2.a）解析 test.vcf 的 3 条记录，校验字段、等位基因
      分解、库内工具函数，并经 vcflib::WfaVariant 门面证明 vendored WFA2 归档可链接
    command: "./test_libvcflib test.vcf"
    assertions: 30
  - file: conanfile.py
    description: "安装面断言：lib/libvcflib.a、lib/libwfa2.a 与 3 个公开头文件必须存在"
    command: "conan test_package layout assertions"
    assertions: 5

# 鸿蒙侧（test_package 消费者）断言合计 = 30 + 5 = 35
consumer_assertion_count: 35

# 另一单位的披露（不并入上游用例数 N）
upstream_doctest_examples: 36
upstream_doctest_examples_note: >-
  test/pytest/*.md 里 `>>> ` 示例计数：pyvcflib 7、vcf2tsv 5、vcfallelicprimitives 9、
  vcfcreatemulti 6、vcffilter 2、vcflib-api 0、vcfnulldotslashdot 1、vcfwave 6；
  doc/vcfintersect.md 0。合计 36，是 doctest 的 example 单位，不与 CTest 注册用例数混用。
upstream_unregistered_helpers:
  - test/pytest/rtest.py
  - test/pytest/vcf2tsv-test.py
