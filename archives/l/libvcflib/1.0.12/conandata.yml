# conandata.yml — libvcflib 1.0.12
#
# 源码必须用 release 附带的 `-src` 资产：GitHub 自动生成的
# /archive/refs/tags/v1.0.12.tar.gz 里 contrib/* 子模块目录（tabixpp、fastahack、
# smithwaterman、filevercmp、fsom、intervaltree、multichoose、WFA2-lib）与
# src/simde **全部为空目录**（实测 0 条），CMake 配置期即报
# "Cannot find source file: contrib/fastahack/Fasta.cpp"，无法构建。
# 只有 releases/download/v1.0.12/vcflib-1.0.12-src.tar.gz 自带全部子模块
# （各目录 5–22 条，src/simde 20 条），是唯一可构建的发布 tarball。
# 两者 sha256 不同，不得混用（用自动 tarball 的 URL 配 -src 资产的 sha256 会在
# source() 阶段直接校验失败）。

sources:
  url: "https://github.com/vcflib/vcflib/releases/download/v1.0.12/vcflib-1.0.12-src.tar.gz"
  sha256: "cb1e78d675f06ae3b22ffed7e1dea317e4c7f826e51e5b5dabd80240efbe1019"

patches:
  - patch_file: "patches/0001-CMakeLists.txt-link-dirs-and-optional-curl.patch"
    patch_description: >-
      链接期可移植性与构建预算：①pkg-config 只把库名交给连接器
      （-lhts/-llzma/-ldeflate），从不消费它自己返回的库目录，依赖不在链接器默认搜索
      路径时全部 not found；补 link_directories(${HTSLIB_LIBRARY_DIRS}
      ${TABIXPP_LIBRARY_DIRS})。②libcurl 只是给 htslib 的远程访问用（上游注释
      "for htslib"），本包的 htslib 依赖是 --disable-libcurl 构建的，且 vcflib 源码零处
      include curl；把 include(FindCURL) 改成 find_package(CURL) 并把 CURL::libcurl /
      ${CURL_LIBRARIES} 包成条件，存在 curl 时保持上游原行为，缺失时不再产生
      "CURL_LIBRARY-NOTFOUND" 生成期错误。③关闭 IPO/thin-LTO：85 个可执行目标每一个都要
      对整库重跑一次 LTO 代码生成（实测单次链接 ~19 s、85 个链接合计 ~28 min），串行
      构建立即超出构建时限（3600 s）；关闭后目标代码语义不变。
    patch_type: "portability"
  - patch_file: "patches/0002-CMakeLists.txt-wfa2-static-include-and-tools-install.patch"
    patch_description: >-
      ①WFA2 链接静态目标：上游 add_subdirectory(contrib/WFA2-lib) 后取 SHARED 目标
      wfa2，本包改取 wfa2_static（两者 OUTPUT_NAME 同为 wfa2），使 85 个工具静态自包含、
      运行期不依赖 libwfa2.so 与 RPATH/LD_LIBRARY_PATH（包内仍会安装 WFA2 自己的
      libwfa2.so，那是 WFA2 的安装规则）。
      ②HMDFS/HarmonyOS 文件系统大小写不敏感：contrib/WFA2-lib/VERSION（纯版本字符串）
      会被 `#include <version>` 命中并顶替 C++17 标准头；改用 -idirafter 挂载该包含
      目录（在编译器自身包含目录之后搜索），既保住 vendored 的
      "wavefront/wfa.hpp"/"utils/*.h"，又让 <version> 仍解析到 libc++。
      ③补齐 WFBINS 安装规则：上游只 install(TARGETS ${BINS} ...)，6 个 wavefront 工具
      （vcfwave、vcfallelicprimitives、vcfcleancomplex、vcfparsealts、vcfroc、vcfstats）
      被编出来却从不安装；补一条 install(TARGETS ${WFBINS} ...) 让"构建面 = 交付面"一致
      （vcfwave / vcfallelicprimitives 还是上游 doctest 的主力用例对象）。
    patch_type: "portability"
  - patch_file: "patches/0003-CMakeLists.txt-optional-python-bindings.patch"
    patch_description: >-
      Python FFI 绑定（pyvcflib）及其两个消费者用例改为可选：pybind11 不在 OHOS 制品仓
      （ohpcd）里，OHOS 也没有 pybind11 工具链，而上游无条件调用 pybind11_add_module()
      （find_package 不是 REQUIRED，缺 pybind11 时 CMake 直接报未知命令）。把该目标与
      依赖它的两个用例（add_pytest(realign)、add_pydoctest(pyvcflib)，两者都
      `from pyvcflib import *`）一并放进 if(pybind11_FOUND)——与上游对 zig 依赖用例
      （add_pydoctest(vcfcreatemulti) 的 if(ZIG)）同一种写法；有 pybind11 的环境行为不变。
    patch_type: "portability"
  - patch_file: "patches/0004-contrib-fastahack-LargeFileSupport.h-off64.patch"
    patch_description: >-
      contrib/fastahack/LargeFileSupport.h 在非 Windows/非 Apple 分支用 glibc 私有类型
      __off64_t 定义 off_type；OHOS 的 musl/bionic 系 libc 没有该类型，编译期
      "unknown type name '__off64_t'"。改用标准 off_t——该头文件自身已
      #define _FILE_OFFSET_BITS 64，且所有目标都是 64 位，两者等价。
    patch_type: "portability"
  - patch_file: "patches/0005-test-pytest-rtest.py-bash-path-resolution.patch"
    patch_description: >-
      上游测试助手 test/pytest/rtest.py 的 sh() 用 Popen(['bash','-c',...]) 启动 shell；
      OHOS 定制 Python 的 subprocess 恒走 posix_spawn 且不对裸命令名做 PATH 搜索
      （subprocess.run(['bash',...]) 必 ENOENT），使 vcfallelicprimitives / vcfwave /
      vcffilter 三个 doctest 在助手层就抛 FileNotFoundError。改用
      shutil.which('bash') 解析后再调用：命令串、断言与期望输出逐字不变，只修解释器查找方式。
    patch_type: "portability"
