# 遵循 ARCHIVE-SPEC v3.0

version: "1.0.12"
software: "libvcflib"

# published | built | failed | archived
# O5：只有合并后 release upload 已确认才写 published；本包尚未发布 → built
status: built

build_date: "2026-09-20"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 必须是 release 附带的 -src 资产：自动生成的 archive/refs/tags/v1.0.12.tar.gz
  # 里 contrib/* 子模块目录全为空，无法构建（详见 conandata.yml 顶部说明）
  url: "https://github.com/vcflib/vcflib/releases/download/v1.0.12/vcflib-1.0.12-src.tar.gz"
  sha256: "cb1e78d675f06ae3b22ffed7e1dea317e4c7f826e51e5b5dabd80240efbe1019"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # conanfile.py generate() 里通过 CMakeToolchain 下发的变量
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DZIG=OFF"
    - "-DWFA_GITMODULE=ON"
    - "-DOPENMP=OFF"

  dependencies:
    - htslib/1.24-r0
    - zlib/1.3.1
    - bzip2/1.0.8

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-CMakeLists.txt-link-dirs-and-optional-curl.patch"
  - "0002-CMakeLists.txt-wfa2-static-include-and-tools-install.patch"
  - "0003-CMakeLists.txt-optional-python-bindings.patch"
  - "0004-contrib-fastahack-LargeFileSupport.h-off64.patch"
  - "0005-test-pytest-rtest.py-bash-path-resolution.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  # knowledge_ref: DRAFT-E616-upstream-auto-tarball-vs-release-src-asset-submodules
  - "上游 GitHub 自动 tarball（archive/refs/tags/<tag>.tar.gz）不含子模块内容：vcflib 1.0.12 的 contrib/{tabixpp,fastahack,smithwaterman,filevercmp,fsom,intervaltree,multichoose,WFA2-lib} 与 src/simde 全为 0 条，CMake 配置期报 'Cannot find source file: contrib/fastahack/Fasta.cpp'；必须改用 release 附带的 vcflib-1.0.12-src.tar.gz（自带全部子模块，sha256 cb1e78d6…）。"
  # knowledge_ref: DRAFT-E616-upstream-auto-tarball-vs-release-src-asset-submodules
  - "search-url/init-build 对已下线或同名异源的 URL 一律标 ✅ [Official]（本包命中 savannah 目录本身 404 与 waterlan.home.xs4all.nl 的同名异源站点）；采信前必须下载后核对 gzip magic、顶层目录与子模块目录条目数。"
  # knowledge_ref: DRAFT-E616-upstream-auto-tarball-vs-release-src-asset-submodules
  - "手工拆分的补丁必须能被 patch_ng（conan apply_conandata_patches 的实现，strip=0）按序套用：每个补丁的 @@ 行号必须是「该补丁开始时的文件状态」下的行号——即只需累计**之前补丁**在同一文件里、位置在本 hunk 之前的净增行数，不能把本补丁自身 hunk 的位移算进去（patch_ng 按行号精确匹配且不搜索偏移；GNU patch 会容忍，故 `patch -p1` 自测通过不代表 conan 能过）。"
  # knowledge_ref: DRAFT-E616-upstream-auto-tarball-vs-release-src-asset-submodules
  - "OHOS 的 /system/bin/diff 是 toybox（默认且只有 unified 格式），且 OHOS Python 会给每个子进程的 PATH 前置 /system/bin:/usr/bin:/bin（`env -i PATH=<hnp> python3` 读回仍是前置后的值）——凡上游测试用 shell `diff` 比对**GNU diffutils 默认 normal 格式**的期望输出，在 OHOS 上必然不一致。"
  # knowledge_ref: DRAFT-E616-upstream-auto-tarball-vs-release-src-asset-submodules
  - "WFA_GITMODULE=ON 会把 vendored WFA2 子项目的 CTest 用例（add_wfa_test → tests/wfa.utest.sh）并入本包的 ctest 注册面：清点上游 N 时必须把它算进去（否则 N 少报 1）；该脚本 shebang 为 #!/bin/bash，而 OHOS 没有 /bin/bash，ctest 报 BAD_COMMAND。"
  # knowledge_ref: DRAFT-E616-upstream-auto-tarball-vs-release-src-asset-submodules
  - "85 个可执行目标 + 静态库的 CMake 工程在 jobs=1 下必须关掉 IPO/thin-LTO：每个链接都会对整库重跑一次 LTO 代码生成（实测 ~19 s/链接、合计 ~28 min），叠加编译后超出 conan create 的 3600 s 内建超时。"

tests:
  upstream:
    command: "cmake --build <build> -j1 && ctest -E \"vcfallelicprimitives|wfa2lib\""
    registration: "CMakeLists.txt: add_pytest/add_pydoctest/add_doctest（vcflib 10）+ contrib/WFA2-lib/CMakeLists.txt: add_wfa_test()（子项目 1）"
    cases: 11
    passed: 6
    skipped: 0
    failed: 0
    not_run: 5
    note: "N=11 为候选数法最大值（vcflib 自身 CTest 注册 10 + WFA2 子项目 add_wfa_test 1；后者仅 -DWFA_GITMODULE=ON 时进入注册面，上游 CI 正是该形态）。本包构建形态（ZIG=OFF、无 pybind11）实际注册 8 个，其中 2 个的测试工具面在 OHOS 跑不了（toybox diff / 无 /bin/bash），由 conanfile.py 的 CTEST_EXCLUDE 显式排除，实跑 6 个全部通过。NOT_RUN 5 项：vcfcreatemulti(ZIG)、pyvcflib 与 realign(pybind11)、vcfallelicprimitives(toybox diff)、wfa2lib(无 /bin/bash)。doctest 示例 36 个属另一单位，不并入。逐字读数见 reports/test-report.md"
  adapted:
    command: "conan create（采信轮 conan-verify G2）内 test_package"
    cases: 2
    passed: 2
    pass_rate: "2/2 (100%)"
    assertions: 35
    breakdown:
      consumer_binary_assertions: 30
      install_layout_assertions: 5
    note: "test_package/test_libvcflib.cpp 30 项断言（VCF 解析 / SNP·插入·缺失的 parsedAlternates 分解 / 库内工具函数 / 经 vcflib::WfaVariant 门面证明 libwfa2.a 可链接），每项打印 [ok]；安装面 5 项断言（lib/libvcflib.a、lib/libwfa2.a、Variant.h、tabix.hpp、LeftAlign.hpp）。另在安装树上真跑 vcfecho/vcf2tsv/vcfstats/vcfwave/vcfallelicprimitives（rc=0，readelf 显示无 libwfa2.so 依赖）"

blockers: []
