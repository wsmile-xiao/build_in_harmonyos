# 知识沉淀
# ============================================================

knowledge_gained:
  - "zpaq 0.01 ships a single self-contained C++ file with no build system; build = documented g++ one-liner (manual source-list recipe, binn/cssc style)"
  - "SDK libc++_shared.so is a linker-script INPUT file the musl loader cannot resolve: CLI tools linked against it die at startup; -static-libstdc++ bakes libc++ in leaving only libc.so dependency (boost1.84-* test binary precedent)"
  - "zpaq does not create output directories on extract (upstream design documented in readme): consumers must mkdir -p before zpaq x"
  - "zpaq usage()/unknown-option path exits 0 and prints help, so the CI L2 --version/--help smoke passes without a portability patch"

