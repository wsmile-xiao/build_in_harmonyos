# test_package/MANIFEST.yml — libzpaq 0.01
# CI L0e requires this file to exist.

package: libzpaq/0.01
homepage: "https://github.com/zpaq/zpaq"

# zpaq 0.01 has no upstream test suite: single-file release without
# any build system (no make check target, no tests/ directory, no test
# harness). Verified by inspecting the 0.01 tag tarball contents:
#   .gitignore max.cfg min.cfg readme.txt zpaq.cpp
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Full functional roundtrip: compress 3 files (random binary / sequence / text) with min.cfg model, list archive, extract, byte-exact cmp verification"
    command: "bash test.sh"

# Approximate assertion count
assertion_count: 9
