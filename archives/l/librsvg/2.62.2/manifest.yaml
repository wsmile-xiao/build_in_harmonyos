knowledge_gained:
  - "OHOS SDK clang wrapper 是 shell 脚本，HMDFS 禁止执行，需使用 clang-15 直接二进制"
  - "使用 OHOS SDK 的 clang-15 作为 Rust 链接器: RUSTFLAGS='-C linker=/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/bin/clang-15'"
  - "cargo cbuild 编译成功，生成静态库 librsvg_2.a"
  - "librsvg 依赖 Rust，需要 cargo-cbuild 工具"
  - "编译需要禁用测试 (-Dtests=false) 以避免链接测试程序时的动态库依赖问题"

