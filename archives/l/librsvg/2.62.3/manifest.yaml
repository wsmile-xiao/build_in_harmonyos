software: librsvg
# 版本级 manifest
# 文件位置: archives/l/librsvg/2.62.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "2.62.3"
status: built
build_date: "2026-08-14"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.gnome.org/sources/librsvg/2.62/librsvg-2.62.3.tar.xz"
  sha256: "7eb449b2722a768021356f66dfee3202c229b54ed4e6a70ce40c090e97ff16f2"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "--default-library=static"
    - "-Dintrospection=disabled"
    - "-Drsvg-convert=disabled"
    - "-Davif=disabled"
    - "-Dpixbuf=enabled"
    - "-Dpixbuf-loader=disabled"
  dependencies:
    - cairo/1.18.4
    - glib/2.84.0.1
    - gdk-pixbuf/2.44.6
    - pango/1.56.4
    - harfbuzz/14.2.0.1
    - libxml2/2.15.3.1
    - fontconfig/2.18.1.1
    - freetype/2.14.3
    - cairo-gobject/1.18.4
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - file: 0001-meson.build.patch
    type: portability
  - file: 0002-rsvg-meson.build.patch
    type: portability
  - file: 0003-cargo-wrapper-tests.patch
    type: portability
    platform_only: true
    guard: active
    description: "HMDFS workaround: makedef.py 用 python3 执行"
  - file: 0002-rsvg-meson.build.patch
    type: portability
    platform_only: true
    guard: active
    description: "HMDFS workaround: rsvg/meson.build makedef_args 改用 python3"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "librsvg 2.62.3 从零编写 Conan recipe（2.62.2 旧 archive 无 conanfile.py）"
  - "2.62.2 的 HMDFS workaround patches 可直接复用于 2.62.3（源码上下文一致）"
  - "所有依赖已在制品仓可解析：cairo/1.18.4, glib/2.84.0.1, gdk-pixbuf/2.44.6, pango/1.56.4 等"

build_context:
  src_dir: ""
  test_prefix: ""
  default_prefix: ""
