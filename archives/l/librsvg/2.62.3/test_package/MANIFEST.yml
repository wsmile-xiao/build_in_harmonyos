# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: librsvg/2.62.3
homepage: https://gitlab.gnome.org/GNOME/librsvg

# 上游测试情况：conanfile build() 中运行 meson test 真实执行上游测试
# - Rust 测试（cargo test）：rsvg/tests/*.rs 12+ 文件 + src/test_utils，经 cargo_wrapper 运行，
#   RUSTFLAGS rpath 指向依赖 .so，--tests 排除 doctest（OHOS rust 工具链缺 rustdoc 组件）
# - C API 测试：librsvg-c/tests-c/api.c（meson executable，链接 librsvg_dep）
# 运行时依赖 .so 通过 RUSTFLAGS RUNPATH 可达（避免 LD_LIBRARY_PATH 污染构建期 lld）
upstream_test_in_build: true
upstream_tests:
  - "cargo test: rsvg/tests/{api,bugs,errors,filters,geometries,intrinsic_dimensions,loading_crash,loading_disallowed,primitive_geometries,primitives,reference,render_crash,shapes,text}.rs"
  - "C API tests: librsvg-c/tests-c/api.c (meson test)"

# test_package 自带测试（消费者视角：解析最小 SVG + 版本常量编译）
test_package_tests:
  - file: test.c
    description: "rsvg_handle_new_from_data 解析最小 SVG + LIBRSVG_VERSION_STRING 编译核验"
    command: "./test_probe"

assertion_count: 2
