knowledge_gained:
  - "R02（2026-09-19）：R01 已发布 librsvg/2.62.3.1，CI R37 因制品仓同版本 409 失败 → 按 R37 递增后缀至 2.62.3.1.1（cnb.cool 不支持同版本多 revision 并存，必须递增版本号）；全仓无下游 requires(librsvg/2.62.3.1) 引用，无需同步。"
  - "2.62.3.1：gtk3 生态版（R37 版本后缀）。制品仓 2.62.3 的 requires 为 pango/1.56.4（GTK4/新生态链），与 gtk 3.24.52 生态（pango/1.50.14.1.1）不匹配，gdk-pixbuf 无法加载其 SVG loader → 本版本将对齐 gtk3 生态（pango/1.50.14.1.1、cairo/1.18.4.1、cairo-gobject/1.18.4.3、harfbuzz/14.2.0.1.1.1）重新发布，供 gtk/gdk-pixbuf 的 SVG loader 使用（修复 2 项上游测试：icon-effect-missing、treeview-fixed-height）"
  - "上游测试：C API 测试（librsvg-c/tests-c/api.c）在 build() 中无条件真实运行；Rust cargo test 仅 LIBRSVG_ENABLE_UPSTREAM_TESTS=1 时启用（默认禁用，OHOS 构建最小化）——如实申报（R51）"
