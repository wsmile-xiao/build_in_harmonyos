# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: librsvg/2.62.3.1.1
homepage: https://gitlab.gnome.org/GNOME/librsvg

# 上游测试情况：conanfile build() 中运行 meson test 执行上游测试
# - C API 测试（librsvg-c/tests-c/api.c，meson executable，链接 librsvg_dep）：
#   在 build() 中无条件真实运行（R51 证据：build 日志 meson test api）
# - Rust 测试（cargo test：rsvg/tests/*.rs）：经 cargo_wrapper 运行，但仅在
#   LIBRSVG_ENABLE_UPSTREAM_TESTS=1 时启用（默认禁用——OHOS 构建最小化推进；
#   需要 harmonybrew rust 工具链环境，见 notes.md 本机验证受限说明）
upstream_test_in_build: true
upstream_tests:
  - "meson test C API: librsvg-c/tests-c/api.c（build() 内无条件运行）"
  - "cargo test: rsvg/tests/*.rs（LIBRSVG_ENABLE_UPSTREAM_TESTS=1 时启用，默认禁用）"
  - "C API tests: librsvg-c/tests-c/api.c (meson test)"

# test_package 自带测试（消费者视角：解析最小 SVG + 版本常量编译）
test_package_tests:
  - file: test.c
    description: "rsvg_handle_new_from_data 解析最小 SVG + LIBRSVG_VERSION_STRING 编译核验"
    command: "./test_probe"

assertion_count: 2
