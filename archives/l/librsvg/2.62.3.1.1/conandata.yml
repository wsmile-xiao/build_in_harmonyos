sources:
  url:
  - https://mirrors.ustc.edu.cn/gnome/sources/librsvg/2.62/librsvg-2.62.3.tar.xz
  - https://mirrors.tuna.tsinghua.edu.cn/gnome/sources/librsvg/2.62/librsvg-2.62.3.tar.xz
  - https://mirror.nju.edu.cn/gnome/sources/librsvg/2.62/librsvg-2.62.3.tar.xz
  - https://download.gnome.org/sources/librsvg/2.62/librsvg-2.62.3.tar.xz
  sha256: 7eb449b2722a768021356f66dfee3202c229b54ed4e6a70ce40c090e97ff16f2
patches:
  2.62.3.1.1:
  - patch_file: patches/0001-meson.build.patch
    patch_description: 'HMDFS workaround: makedef.py 用 python3 执行而非直接 find_program（HMDFS
      禁止执行脚本）'
    patch_type: portability
  - patch_file: patches/0002-rsvg-meson.build.patch
    patch_description: 'HMDFS workaround: rsvg/meson.build 中 makedef_args 改用 python3
      + makedef_script'
    patch_type: portability
  - patch_file: patches/0003-cargo-wrapper-tests.patch
    patch_description: OHOS rust 工具链缺 rustdoc 组件，cargo test 加 --tests 排除 doctest（单元/集成测试真实运行）
    patch_type: portability
  - patch_file: patches/0004-meson-drop-cargo-cbuild.patch
    patch_description: 移除 meson.build 的 cargo-cbuild 存在性检查（该变量在项目中从未被使用；cargo-c 在
      OHOS 构建机上不可用）
    patch_type: portability
  - patch_file: patches/0005-cargo-wrapper-cbuild-to-build.patch
    patch_description: cargo_wrapper.py 的 cbuild 分支改用纯 cargo build 替代 cargo cbuild（避免
      CI 现场源码编译 cargo-c 超时）
    patch_type: portability
  - patch_file: patches/0006-librsvg-c-lib-crate-type.patch
    patch_description: librsvg-c/Cargo.toml 声明 [lib] name=rsvg_2 + crate-type=staticlib，使纯
      cargo build 直接产出 meson 期望的 librsvg_2.a
    patch_type: portability
  - patch_file: patches/0007-cargo-wrapper-librsvg-c-capi.patch
    patch_description: 'R05: cargo_wrapper.py ①对 -p librsvg-c 的测试附加 capi feature（legacy_sizing.rs
      需 librsvg_c::sizing::LegacySize/legacy_layer_geometry，缺失报 E0433/E0599）；②cbuild
      复制 .a 产物时把 liblibrsvg_c.a 改名复制为 librsvg_2.a（匹配 meson custom_target ''librsvg-2''
      输出名）'
    patch_type: portability
