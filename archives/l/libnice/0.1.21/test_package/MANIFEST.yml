package: libnice/0.1.21
homepage: https://nice.freedesktop.org/

# Inventory follows upstream meson.build test() registrations. cases counts
# individual test items: GLib g_test registrations where present, otherwise one
# standalone test invocation per Meson target. The arpa/inet.h and shell-tool
# dependent entries are conditional in the upstream build.
upstream_check_command: "meson test -C build"
upstream_test_in_build: true
upstream_test_command: "meson test -v --timeout-multiplier=16 --no-rebuild"
upstream_meson_target_count: 41
upstream_test_count: 69
upstream_tests:
