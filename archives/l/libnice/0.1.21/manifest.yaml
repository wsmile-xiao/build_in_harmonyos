software: libnice
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.1.21/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.21"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://nice.freedesktop.org/releases/libnice-0.1.21.tar.gz"

  # 源码校验和
  sha256: "72e73a2acf20f59093e21d5601606e405873503eb35f346fa621de23e99b3b39"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Ddefault_library=static"
    - "-Dcrypto-library=openssl"
    - "-Dgstreamer=disabled"
    - "-Dgupnp=disabled"
    - "-Dintrospection=disabled"
    - "-Dgtk_doc=disabled"
    - "-Dexamples=disabled"
    - "-Dtests=enabled"
    - "-Dwrap_mode=nodownload"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0.1.1
    - openssl/1.1.1w

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-tests-test-pseudotcp.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PseudoTCP 随机传输测试遇到 EWOULDBLOCK 时须把负返回值归一为接受 0 字节，再更新计数和文件回退量；否则会多回退一个字节并重复数据。" # knowledge_ref: E545
  - "OHOS 上 libnice 使用 shared GLib 依赖；静态 GLib 与 libintl 的链接问题见 E123。" # knowledge_ref: E123
  - "Conan consumer 运行时需将依赖库目录纳入运行环境；闭包验证参考 E499。" # knowledge_ref: E499
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
