software: libnice
display: "libnice"
description: "ICE (Interactive Connectivity Establishment) library for NAT traversal"
category: network
homepage: "https://nice.freedesktop.org"
license: MPL-1.1
build_system: meson

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "必须使用 glib 动态链接版本（禁用 G_INTL_STATIC_COMPILATION）"
    - "必须设置 CC/CXX 环境变量为鸿蒙 SDK 编译器"
    - "必须设置 AR 环境变量为 llvm-ar"
  common_dependencies:
    - glib
    - openssl
    - pcre2
    - libffi
    - gettext

# 版本索引
versions:
  "0.1.21":
    status: built
    build_date: "2026-05-26"