software: libtatsu
display: "libtatsu"
description: "Tatsu Signing Server client library (Apple TSS request/response handling)"
category: system
homepage: "https://libimobiledevice.org/"
license: LGPL-2.1+
build_system: autotools

ohos_adaptation:
  key_points:
    - "libplist 2.6.0 dict helpers backported as static inline compat header (LIBPLIST_LT_2_6)"
    - "mktemp wrapper for config.status on HMDFS (same as libimobiledevice-glue)"
    - "--build=aarch64-unknown-linux-gnu forced (config.guess does not know OHOS)"
    - "LD_LIBRARY_PATH required for configure conftest with shared deps"
  common_dependencies:
    - libplist
    - libcurl

versions:
  "1.0.5":
    status: built
    build_date: "2026-09-02"
