# test_package/MANIFEST.yml
# libtatsu 1.0.5 upstream test declaration

package: libtatsu/1.0.5
homepage: "https://libimobiledevice.org/"

# Upstream test command (no formal test suite in release tarball)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs (none in release tarball)
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test_package/test_package.c
    description: "Offline TSS request/response contract verification against local mock HTTP server (127.0.0.1): request build/overrides/manifest parameters, tag builders (incl. missing required fields), exact serialized XML body, wire headers (POST, Content-Type, User-Agent, Cache-Control), SUCCESS response parse, ticket/path/blob accessors, negative paths (HTTP 503 + STATUS=100, connection refused, malformed body, empty body), memory cleanup"
    command: "./test_package"
  - file: test_package/test_cpp.cpp
    description: "C++ consumer: extern \"C\" header inclusion, linking and API calls (version, request build, tag builder, debug level)"
    command: "./test_cpp"

# Test assertion count (CHECK() macros across both programs)
assertion_count: 68
