software: libdiscid
display: "libdiscid"
description: "C library for creating MusicBrainz and FreeDB DiscIDs from audio CD TOCs"
category: data
homepage: "https://musicbrainz.org/doc/libdiscid"
license: LGPL-2.1+
build_system: cmake

ohos_adaptation:
  key_points:
    - "HarmonyOS 为 generic OS 平台，disc reading 功能不可用（disc_generic.c 实现）"
    - "cmake 不识别 HarmonyOS 系统名，System unknown 警告不影响构建"
    - "源码 config-cmake.h.in 需从 autotools @...@ 语法改为 cmake ${...} 语法"
    - "核心功能 discid_put() (DiscID 计算) 完全可用，仅 disc reading 不可用"
  common_dependencies: []

versions:
  "0.6.5-r0":
    status: published
    build_date: "2026-06-02"