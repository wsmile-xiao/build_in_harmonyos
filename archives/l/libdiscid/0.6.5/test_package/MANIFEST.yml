# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libdiscid/0.6.5
homepage: "https://github.com/metabrainz/libdiscid"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cmake.build(target=check)"

# 上游实际运行的测试程序 (CMakeLists.txt ADD_CUSTOM_TARGET check)
upstream_tests:
  - file: test/test_core.c
    source: libdiscid-0.6.5/test/test_core.c
    description: "核心 API 测试：版本字符串、特性列表、默认设备、对象生命周期、错误处理"
    command: "./test_core"
    assertions: 7
    hardware_required: false
  - file: test/test_put.c
    source: libdiscid-0.6.5/test/test_put.c
    description: "discid_put DiscID 计算测试：参数验证、TOC 设置、ID/FreeDB ID/TOC 字符串/提交 URL"
    command: "./test_put"
    assertions: 7
    hardware_required: false
  - file: test/test_read.c
    source: libdiscid-0.6.5/test/test_read.c
    description: "discid_read 磁盘读取测试（HarmonyOS generic 平台 SKIP，预期退出 77）"
    command: "./test_read"
    assertions: 32
    hardware_required: true
    expected: skip
  - file: test/test_read_full.c
    source: libdiscid-0.6.5/test/test_read_full.c
    description: "discid_read 完整读取测试（HarmonyOS generic 平台 SKIP，预期退出 77）"
    command: "./test_read_full"
    assertions: 20
    hardware_required: true
    expected: skip

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "消费者 L1 测试：实质调用 discid_new/put/get_id/get_freedb_id/free，验证已知 DiscID 计算"
    command: "./test_package"
    assertions: 9

# 测试断言总数 (上游 test_core 7 + test_put 7 + test_read 32 + test_read_full 20 = 66)
assertion_count: 66
