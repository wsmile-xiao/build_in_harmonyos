# Source and OHOS portability patches for libcdio-paranoia 10.2+2.0.2.
sources:
  url: "https://ftp.gnu.org/gnu/libcdio/libcdio-paranoia-10.2+2.0.2.tar.bz2"
  sha256: "186892539dedd661276014d71318c8c8f97ecb1250a86625256abd4defbf0d0c"

patches:
  - patch_file: "patches/0001-config-guess-ohos.patch"
    patch_description: "Teach config.guess to identify HarmonyOS targets"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "Accept linux-ohos triplets in config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-hmdfs-tmpdir.patch"
    patch_description: "Use HMDFS-writable configure temporary directories"
    patch_type: "portability"
  - patch_file: "patches/0004-test-cue-files.patch"
    patch_description: "Point shipped CUE fixtures at their matching BIN files"
    patch_type: "bugfix"
  - patch_file: "patches/0005-endian-cue-files.patch"
    patch_description: "Make the endian regression test read its generated BIN files"
    patch_type: "bugfix"
  - patch_file: "patches/0006-start-track-fixture.patch"
    patch_description: "Exercise non-one audio track numbers with libcdio 2.3.0 BIN/CUE semantics"
    patch_type: "bugfix"
