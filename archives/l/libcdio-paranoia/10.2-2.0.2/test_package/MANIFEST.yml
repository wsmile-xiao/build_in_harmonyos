# test_package/MANIFEST.yml
# Upstream test census and consumer-level validation for libcdio-paranoia.

package: libcdio-paranoia/10.2-2.0.2
homepage: "https://www.gnu.org/software/libcdio/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: test/cdda_interface/toc.c
    source: libcdio-paranoia-10.2+2.0.2/test/cdda_interface/toc.c
    description: "Validate BIN/CUE CDDA table-of-contents and track-sector APIs"
    command: "./test/cdda_interface/toc"
  - file: test/check_paranoia.sh
    source: libcdio-paranoia-10.2+2.0.2/test/check_paranoia.sh
    description: "Exercise deterministic BIN/CUE extraction, jitter, and track handling"
    command: "./test/check_paranoia.sh"
  - file: test/endian.sh
    source: libcdio-paranoia-10.2+2.0.2/test/endian.sh.in
    description: "Round-trip little-endian and big-endian CDDA BIN images"
    command: "./test/endian.sh"
  - file: test/check_start_track_not_one.sh
    source: libcdio-paranoia-10.2+2.0.2/test/check_start_track_not_one.sh.in
    description: "Verify audio tracks beginning at track 7 in a BIN/CUE image"
    command: "./test/check_start_track_not_one.sh"
  - file: test/testutils.c
    source: libcdio-paranoia-10.2+2.0.2/test/testutils.c
    description: "Run the upstream utility test executable"
    command: "./test/testutils"
  - file: test/get_libcdio_version.c
    source: libcdio-paranoia-10.2+2.0.2/test/get_libcdio_version.c
    description: "Report and validate the linked libcdio version"
    command: "./test/get_libcdio_version"
  - file: example/paranoia.c
    source: libcdio-paranoia-10.2+2.0.2/example/paranoia.c
    description: "Example program smoke tests (requires a physical audio CD)"
    command: "./example/paranoia"

# These seven source entries are representative inputs for nine registered
# checks: toc (1), test/ (6, including testparanoia), and example/ (2).
# The remote HarmonyOS PC run observed 9 registered checks: 6 passed and 3
# skipped (physical-CD-dependent examples/testparanoia); no failures.
upstream_check_count: 9

test_package_tests:
  - file: test.c
    description: "Call both public version APIs from the packaged paranoia and CDDA libraries"
    command: "./libcdio_paranoia_test"
