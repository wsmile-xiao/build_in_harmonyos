patches_applied:
  - "0001-config-guess-ohos.patch"
  - "0002-config-sub-ohos.patch"
  - "0003-configure-hmdfs-tmpdir.patch"
  - "0004-test-cue-files.patch"
  - "0005-endian-cue-files.patch"
  - "0006-start-track-fixture.patch"

knowledge_gained:
  - "Autotools config.guess/config.sub in the release archive do not recognize the OHOS triplet (knowledge_ref: DRAFT-libcdio-paranoia-10.2-2.0.2-ohos-autotools)."
  - "HMDFS requires configure's mktemp/mkdir temporary directory to use umask 022 and chmod 755 (knowledge_ref: DRAFT-libcdio-paranoia-10.2-2.0.2-ohos-autotools)."
  - "The official release CUE fixtures reference BOING.BIN although the shipped BIN files are cdda*.bin; correcting the references restores deterministic tests (knowledge_ref: DRAFT-libcdio-paranoia-10.2-2.0.2-ohos-autotools)."
  - "The endian test must rewrite CUE references when it creates cdda-be.bin and cdda-le.bin (knowledge_ref: DRAFT-libcdio-paranoia-10.2-2.0.2-ohos-autotools)."
  - "libcdio 2.3.0's BIN/CUE driver resets image track numbering to one; the start-track regression fixture uses six preceding data entries so audio tracks are exposed as 7/8/9 (knowledge_ref: DRAFT-libcdio-paranoia-10.2-2.0.2-ohos-autotools)."
  - "The package is a library/CLI hybrid: it exports libcdio_paranoia and libcdio_cdda plus the cd-paranoia executable (knowledge_ref: DRAFT-libcdio-paranoia-10.2-2.0.2-ohos-autotools)."

upstream_tests:
  command: "make check"
  total: 9
  passed: 6
  skipped: 3
  failed: 0
  pass_rate_excluding_skips: "100% (6/6)"

test_package:
