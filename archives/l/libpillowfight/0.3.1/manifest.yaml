build_system: cmake
language: C
c_standard: c11
dependencies: []
upstream_url: https://gitlab.gnome.org/World/OpenPaperwork/libpillowfight
patches_applied: []
knowledge_gained:
  - 上游构建系统需要 _version.h 头文件定义 INTERNAL_PILLOWFIGHT_VERSION 宏，源码包中不包含该文件，需在 conanfile.py 的 source() 后动态生成
  - 上游 CMakeLists.txt 通过 -DNO_PYTHON 宏排除 Python 绑定代码，仅编译纯 C 库
  - 库依赖 libm 和 libpthread（Unix 系统），OHOS 平台均支持
  - 上游测试使用 pytest 框架（Python），交叉编译环境下无法直接运行，需通过消费者测试替代验证
  - 头文件安装到 include/pillowfight/ 子目录，消费者需要使用 include/pillowfight 路径
