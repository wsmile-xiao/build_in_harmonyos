# 版本级 manifest
# 文件位置: archives/l/libcyaml/1.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.2"

# 软件名
software: "libcyaml"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 tag 归档）
  url: "https://github.com/tlsa/libcyaml/archive/refs/tags/v1.4.2.tar.gz"

  # 源码校验和（SHA-256）
  sha256: "3211b2a0589ebfe02c563c96adce9246c0787be2af30353becbbd362998d16dc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # - "VARIANT=release"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libyaml/0.2.5

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本次适配零补丁，纯 Makefile 直编）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libcyaml 为纯 Makefile 工程（无 configure），Makefile 使用 CPPFLAGS += VERSION_FLAGS；注入依赖 include/lib 路径必须经环境变量（env），不能经 make 命令行，否则会覆盖 += 丢弃 -DVERSION_* 宏"
  - "basic_layout 构建目录在 build-release/ 下而 Makefile 在源码根：build() 用 make -C {source_folder}"
  - "E017 预防的 ghfast.top 镜像下载验证可用（github.com 直连超时）"