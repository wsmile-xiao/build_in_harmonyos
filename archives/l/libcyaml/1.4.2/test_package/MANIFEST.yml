# test_package/MANIFEST.yml
# 上游官方测试声明文件（详见 docs/TEST_QUALITY_SPEC.md）

package: libcyaml/1.4.2
homepage: "https://github.com/tlsa/libcyaml"

# 上游测试命令（make check 等价：运行两个测试二进制）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（两二进制均为同一套 382 用例）
upstream_tests:
  - file: test/units/cyaml-shared
    source: libcyaml-1.4.2/test/units/cyaml-shared
    description: "上游单元测试（共享库链接），382/382 通过"
    command: "./cyaml-shared"
  - file: test/units/cyaml-static
    source: libcyaml-1.4.2/test/units/cyaml-static
    description: "上游单元测试（静态库链接），382/382 通过"
    command: "./cyaml-static"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过 cyaml_load_data 解析 YAML 字段并断言"
    command: "./test_libcyaml"
  - file: ohos_test.c
    description: "鸿蒙专项测试：UTF-8 中文 YAML load->save->reload 往返断言"
    command: "./test_libcyaml_ohos"

# 测试断言总数（上游运行时 382 用例 + test_package 2 测试程序）
assertion_count: 382