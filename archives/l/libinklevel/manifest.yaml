software: libinklevel
display: "libinklevel"
description: "Library to read the ink level of inkjet printers (Canon/Epson/HP over USB, parallel port and BJNP network protocol)"
category: printer
homepage: "https://libinklevel.sourceforge.net/"
license: GPL-2.0
build_system: autotools
source_url: "https://downloads.sourceforge.net/project/libinklevel/libinklevel/0.9.7/libinklevel-0.9.7.tar.gz"

ohos_adaptation:
  key_points:
    - "上游 2009 年的 config.guess/config.sub 不认识 OHOS 三元组，需按 E007 补 aarch64-*-linux-ohos"
    - "configure 的 mktemp -d 临时目录分支在 HMDFS 上不可用（E490），改用固定目录名"
    - "上游 bjnp-debug.c 的 NDEBUG 守卫与 bjnp-io.c 的无条件调用不一致，Release(-DNDEBUG) 构建出未解析符号的共享库"
    - "库依赖 libusb-1.0 / libxml-2.0 经 pkg-config 探测，用 PkgConfigDeps 生成 .pc 注入（R49：不写共享 /usr/local）"
  common_dependencies:
    - libusb
    - libxml2

versions:
  "0.9.7":
    status: published
    build_date: "2026-09-13"
