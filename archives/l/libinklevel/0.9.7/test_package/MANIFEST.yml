# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: libinklevel/0.9.7
homepage: "https://libinklevel.sourceforge.net/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libinklevel 0.9.7 官方 tarball 无独立测试：无 tests/ 目录、无测试框架、
# 无 TESTS/check_PROGRAMS 目标（Makefile.am 只有 lib_LTLIBRARIES）、
# make check 报 "No rule to make target 'check'"。source_declared_total = 0，
# 上游无测试用例，由 test_package/ 消费者测试覆盖。
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用公共 API）
test_package_tests:
  - file: test.c
    description: "通用消费者契约测试：get_version_string() 版本号 + 未知端口 UNKNOWN_PORT_SPECIFIED(-6) + 非法 BJNP URI BJNP_URI_INVALID(-17) + 无设备 USB 探测返回负值"
    command: "./test_package"
  - file: test_ohos.c
    description: "鸿蒙 PC 平台特有测试：/proc/self/maps 实证按 SONAME 解析（libinklevel.so.5 + libusb-1.0.so.0 + libxml2.so.16）与运行时搜索路径归属 + 无 USB 设备/权限时探测有界快速失败（3 轮 < 5s 且均可重复）+ 中文与 900 字节 UTF-8 设备名健壮性 + 产物为 aarch64 64 位 ELF"
    command: "./test_ohos"

# 测试断言总数（test.c 5 条 + test_ohos.c 11 条）
assertion_count: 16
