# libinklevel 0.9.7 —— 上游源码与适配补丁声明
# 源码：SourceForge 官方发布包（R39）
sources:
  "0.9.7":
    url: "https://downloads.sourceforge.net/project/libinklevel/libinklevel/0.9.7/libinklevel-0.9.7.tar.gz"
    sha256: "819d3bb4c2578722c1057c9f3da999a1a3eb46628f0fe91aeb52bfccd3884675"

patches:
  "0.9.7":
    - patch_file: "patches/0001-bjnp-debug.c.patch"
      patch_description: "去掉 bjnp-debug.c 中 NDEBUG 守卫：Release(-DNDEBUG) 下 bjnp_hexdump/level2str/str2level 定义被剔除但 bjnp-io.c 仍无条件调用，共享库出现未解析符号导致加载失败"
      patch_type: "bugfix"
    - patch_file: "patches/0002-config.guess.patch"
      patch_description: "config.guess: 按 uname 分支识别 HarmonyOS，产出 aarch64-unknown-linux-ohos 三元组（E007；不含平台宏）"
      patch_type: "portability"
    - patch_file: "patches/0003-config.sub.patch"
      patch_description: "config.sub: 放行 aarch64-*-linux-ohos 三元组（E007）"
      patch_type: "portability"
    - patch_file: "patches/0004-configure.patch"
      patch_description: "configure: mktemp -d 分支改用固定临时目录，规避 HMDFS 权限陷阱（E490）"
      patch_type: "portability"
