knowledge_gained:
  - "Release 构建（-DNDEBUG）下 bjnp-debug.c 的 #ifndef NDEBUG 守卫会剔除 bjnp_hexdump/level2str/str2level 定义，而 bjnp-io.c 无条件调用它们 → 共享库残留未解析符号，消费者加载即失败；修复为去掉守卫常编译（ref: E568）"
  - "上游 2009 年 vintage 的 config.guess/config.sub 不认识 OHOS：config.guess 需按 uname（HarmonyOS）补一条 case 分支产出 aarch64-unknown-linux-ohos（不引入 __OHOS__ 宏，避免补丁含平台宏），config.sub 还需把 linux-ohos 补进 kernel/os 校验白名单，否则 configure 报 machine not recognized（ref: E007）"
  - "旧 autoconf 生成的 configure 里 mktemp -d ./confXXXXXX 分支在 HMDFS 上不可用（权限/目录创建失败），改为固定目录名即可绕过（ref: E490）"
  - "library 包依赖经 pkg-config 探测时，用 PkgConfigDeps 生成 .pc 并由 AutotoolsToolchain 自动挂 PKG_CONFIG_PATH；依赖路径落在 Conan 构建目录，不写共享 /usr/local（ref: R49）"

