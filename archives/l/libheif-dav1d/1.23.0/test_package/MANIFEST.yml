# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libheif-dav1d/1.23.0
homepage: "https://github.com/strukturag/libheif"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 ctest 在独立的 BUILD_TESTING=ON 原生构建里跑（见 reports/test-report.md 与
# $TASK_DIR/run-upstream-tests.sh），不塞进 conan create 的产物构建，
# 以免把 39 个测试可执行文件混进交付包。
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试总数 N（父 tarball 完整注册面，用例类口径取最大值）
#   N = 217 = 上游 tests/*.cc 的 Catch2 TEST_CASE 注册点总数
#             （= grep -ho '^TEST_CASE' tests/*.cc | wc -l）
#   其余候选口径（同一父 tarball，只披露、不并入 N）：
#     ctest add_test 注册数            = 39   （grep -oE 'add_(libheif|heifio)_test\([a-z0-9_]+\)' tests/CMakeLists.txt | sort -u | wc -l）
#     测试目标数                        = 39   （与 add_test 一一对应）
#     tests/*.cc 源文件数               = 41   （含 2 个非用例文件 main.cc / test_utils.cc）
#     断言宏数（另一单位，禁止并入 N）  = 4024
#   N 取「用例/注册类」最大值：max(217 用例, 39 注册) = 217。
#   N′ = 本包配置下 ctest 实际注册 13 个目标、编译进二进制并可运行的用例数 = 35；
#        实测 PASS 9 / FAIL 6 / SKIP 20；未运行 182（未注册 174 + 编入排除 8）。
#        逐项归因见 reports/test-report.md。
upstream_tests:
  - file: "tests/CMakeLists.txt"
    source: "libheif-1.23.0/tests"
    description: >-
      上游 ctest 注册面：39 个 add_test 目标 / 217 个 Catch2 用例。
      本包配置（WITH_REDUCED_VISIBILITY=ON 保持上游默认、WITH_UNCOMPRESSED_CODEC=OFF、
      仅 dav1d 后端 ON）实际注册 13 个目标，编入 35 个用例：
      PASS 9 / FAIL 6（全部为 region 的编码用例，上游缺编码器守卫）/ SKIP 20
      （HEVC/AV1 编码器与 HEVC 解码器缺席，属同族其它子包交付面）。
      mini_decode 用 tests/data/simple_osm_tile_alpha.avif 真实走 dav1d 解码并通过。
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证) —— 鸿蒙特有测试，不进上游分母
test_package_tests:
  - file: test.c
    description: "消费者契约测试: 插件产物落盘+ELF / 配方经 runenv_info 导出的 LIBHEIF_PLUGIN_PATH 等于产物所在目录 / heif_init() 装载插件目录 / AV1 解码能力可用 / HEVC 解码与 AV1 编码能力缺席（负对照）"
    command: "./test_libheif_dav1d"

# test_package 断言总数（与 test.c 的 g_total 一致：grep -c '^\s*check(' test.c = 13；
# 与上游计数分栏，不并入上游 N）
assertion_count: 13
