# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "libheif 1.23.0 的编解码后端是「内置 vs 独立插件」双子形态：plugin_option(<NAME> <desc> <defaultEnabled> <defaultPlugin>) 同时派生 WITH_<NAME> 与 WITH_<NAME>_PLUGIN 两个开关，只有 ENABLE_PLUGIN_LOADING=ON 且 _PLUGIN=ON 时才建 add_library(heif-<name> MODULE) 装到 <libdir>/libheif；否则把源码编进 libheif.so 本体。因此「libheif-<codec> 子包」的交付面是 MODULE 插件而不是另一个 libheif 变体，且插件必须与宿主 libheif.so 同包交付（target_link_libraries(... heif)） ref: knowledge/drafts/DRAFT-E623-libheif-dav1d-1.23.0-plugin-consumer-contract-and-dlopen-signing"  # knowledge_ref: E623
- "插件宿主的插件目录在 configure 期就被烧进 heif_version.h 的 LIBHEIF_PLUGIN_DIRECTORY 宏（源模板 libheif/api/libheif/heif_version.h.in:36 = @PLUGIN_DIRECTORY@ = ${CMAKE_INSTALL_FULL_LIBDIR}/libheif）。Conan 的 CMakeToolchain 会在 configure 前把 CMAKE_INSTALL_PREFIX 设成构建期 package_folder，所以烧进去的是构建期绝对路径，包被搬到最终缓存目录后即失效 -> package_info() 必须用 runenv_info 导出 LIBHEIF_PLUGIN_PATH；且插件是 dlopen 对象，鸿蒙 XPM 下必须带有效 .codesign 段（cmake install 会改写 RUNPATH 使链接期签名失效，需装包后重签） ref: knowledge/drafts/DRAFT-E623-libheif-dav1d-1.23.0-plugin-consumer-contract-and-dlopen-signing"  # knowledge_ref: E623
- "上游用 libfind_pkg_check_modules() 而非 CMake 包配置来发现后端依赖（FindDAV1D.cmake -> pkg_check_modules(DAV1D_PKGCONF dav1d) + find_path/find_library HINTS）。这类上游不需要手写 PKG_CONFIG_PATH：CMakeToolchain 默认带 PkgConfigBlock，会把 generators 目录前置进 PKG_CONFIG_PATH 环境变量，只要 generate() 里调过 PkgConfigDeps(self).generate()，依赖的 .pc 就能被 pkg_check_modules 命中 ref: knowledge/drafts/DRAFT-E623-libheif-dav1d-1.23.0-plugin-consumer-contract-and-dlopen-signing"  # knowledge_ref: E623
