# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libpqueue/09b72d55c4
homepage: "https://github.com/vy/libpqueue"

# 上游无构建系统（无 configure/Makefile/CMakeLists），无 make check/ctest 注册。
# 上游唯一的测试程序是两个样例：src/sample.c 与 src/sample-multiattr.c，
# 均在本地编译并实际运行验证通过（2/2）。
upstream_check_command: "cc -Wall -g pqueue.c sample.c -o sample && ./sample"

# conanfile.py build() 方法中未集成上游测试（上游无测试框架），
# 上游样例测试在适配阶段已实际运行，见 notes.md 验证结果。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/sample.c
    source: libpqueue-09b72d55c4/src/sample.c
    description: "单属性优先级样例：插入 5 节点、peek、change_priority、pop 顺序校验"
    command: "./sample"
  - file: src/sample-multiattr.c
    source: libpqueue-09b72d55c4/src/sample-multiattr.c
    description: "多属性优先级样例：独立优先级向量 + pop 顺序校验"
    command: "./sample-multiattr"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 pqueue_init/insert/peek/change_priority/pop 并校验输出"
    command: "./test_libpqueue"

# 测试断言总数 (近似值, 用于质量评估): 上游 sample 5 项 pop 断言 + multiattr 若干，
# test_package 对 size/peek/pop 顺序共 10 项断言。
assertion_count: 10
