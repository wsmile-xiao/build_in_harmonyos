software: libfm
version: "1.3.2"
status: published
build_date: "2026-06-05"

source:
  url: "https://download.savannah.nongnu.org/releases/libfm/libfm-1.3.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-extra-only"
    - "--disable-nls"
  dependencies:
    - "glib/2.88.0"
    - "libintl/8.4.0"
    - "pcre2/0.11.0"
  cc: clang
  cxx: clang++
  extra_ldflags: "-Wl,--whole-archive -lintl"

patches_applied:
  - "0001-config-guess-ohos.patch"

knowledge_gained:
  - "E007/E072: config.guess/config.sub ohos 支持"
  - "静态链接需 -Wl,--whole-archive -lintl"
  - "运行时依赖 libglibintl-shim.so"

runtime_requirements:
  shim_library: "libglibintl-shim.so"
  preload_method: "LD_PRELOAD=libglibintl-shim.so"

test_results:
  library_integrity: PASS
  header_integrity: PASS
  symbol_export: PASS
  pkg_config: PASS
  elf_signature: PASS
  runtime_loading: PASS
  overall: PASS

packaging:
  file: "libfm-1.3.2-ohos-aarch64.tar.gz"
  size: "1.5MB"
  contents:
    - "lib/libfm-extra.so.4.1.3 (1.4MB, signed, stripped)"
    - "lib/libfm-extra.a (26KB)"
    - "lib/libglibintl-shim.so (67KB, signed)"
    - "include/*.h (3 files)"
    - "lib/pkgconfig/libfm-extra.pc"
    - "README.txt"
  rpath: "$ORIGIN"

notes:
  - "仅 libfm-extra（精简版）"
  - "替代有缺陷的 libfm-1.4.0"
  - "运行时需 LD_PRELOAD libglibintl-shim.so"