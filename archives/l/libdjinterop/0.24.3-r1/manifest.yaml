# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DSYSTEM_SQLITE=ON"
    - "-DBUILD_TESTING=OFF"
    - "-DBUILD_DOC=OFF"
    - "-DCMAKE_C_FLAGS=-fPIC -O2"
    - "-DCMAKE_CXX_FLAGS=-fPIC -O2"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - sqlite3/3.49.1

  # 编译器
  cc: clang
  cxx: clang++

