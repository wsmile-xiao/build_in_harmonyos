# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libtasn1/4.20.0
homepage: "https://www.gnu.org/software/libtasn1/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check: 31/31 PASS, 见 tests/ 目录)
upstream_tests:
  - file: tests/ASN1_decode.c
    source: libtasn1-4.20.0/tests/ASN1_decode.c
    description: "DER decoding of ASN.1 structures"
    command: "./ASN1_decode"
  - file: tests/ASN1_encode.c
    source: libtasn1-4.20.0/tests/ASN1_encode.c
    description: "DER encoding of ASN.1 structures"
    command: "./ASN1_encode"
  - file: tests/parser.c
    source: libtasn1-4.20.0/tests/parser.c
    description: "ASN.1 schema parser"
    command: "./parser"
  - file: tests/coding.c
    source: libtasn1-4.20.0/tests/coding.c
    description: "coding/decoding round-trip"
    command: "./coding"
  - file: tests/decoding.sh
    source: libtasn1-4.20.0/tests/decoding.sh
    description: "der decoding shell tests"
    command: "./decoding.sh"
  - file: tests/parser.sh
    source: libtasn1-4.20.0/tests/parser.sh
    description: "parser shell tests"
    command: "./parser.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：ASN.1 INTEGER schema 解析/编码/解码往返 (asn1_parser2tree + asn1_der_coding + asn1_der_decoding)"
    command: "./test_libtasn1"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4