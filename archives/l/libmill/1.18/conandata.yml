# conandata.yml — libmill 1.18
# Source: official upstream repository (tag 1.18, no "v" prefix).
# sha256 computed from the downloaded tarball (112086 bytes).

sources:
  url: "https://github.com/sustrik/libmill/archive/refs/tags/1.18.tar.gz"
  sha256: "ff6903cd05f45c4cc050921d03201a93d2723ab59c480eb924f8f1ca8c6f0614"

patches:
  - patch_file: "patches/0001-tests-file-writable-tmp.patch"
    patch_description: >-
      tests/file.c: create the test file in the current working directory
      instead of the hard-coded "/tmp/file1".  HarmonyOS mounts /tmp read-only
      ("Read-only file system"), so mfopen() returned NULL there and the
      subsequent NULL dereference crashed the test with SIGSEGV.  The test's
      behaviour is otherwise untouched (same open/write/flush/seek/read/close
      sequence); ctest runs it from the writable build directory.  This is the
      documented remedy for the platform's read-only /tmp.
    patch_type: "portability"
