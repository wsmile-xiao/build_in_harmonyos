  dependencies: []

patches_applied:
  - "patches/0001-tests-file-writable-tmp.patch"

knowledge_gained:
  - "libmill 的 dns/dns.h:499 用 &dns_quietinit((struct dns_rr_i){...}) 取复合字面量地址：clang 分支把 quietinit 展开成 _Pragma 包裹的复合字面量（是 lvalue，合法），GCC 分支（__GNUC__>4）展开成 __extension__({...}) 语句表达式——语句表达式不是 lvalue，取地址直接报 'lvalue required as unary & operand'。**所以这个包在 GCC 下编译不过、在 clang 下正常**；OHOS worker 是 clang 15，不受影响"
  - "本机（WSL）默认 profile 是 gcc，用它跑 conan create 会撞上上面这个问题；本地排雷要显式用一个 clang profile，且 profile 里必须配 tools.build:compiler_executables 指向 clang，否则 CMake 仍会解析到 cc(=gcc)"
  - "libmill 的 CMakeLists 同时产出静态 libmill.a 和共享 libmill.so（用 OUTPUT_NAME 让两者同名），不认 BUILD_SHARED_LIBS；配方按 shared 选项选择性打包"
  - "libmill 上游 CMakeLists **没有任何 install() 规则**，必须手工 copy 头与库；公开头只有 libmill.h（权威依据是 autotools 的 millinclude_HEADERS = libmill.h），且 libmill.h 自包含、不 include 任何内部头"
  - "tests/ssl.c 整体包在 #if defined HAVE_SSL 里，未定义时落到 #else 的空 main（tests/ssl.c:137-143）——不接 OpenSSL 也能编译并通过，属于真实用例而非跳过"
  - "perf/ 下 7 个 .c 只有 add_executable、没有 add_test，是性能基准不是测试，不计入上游用例数"
  - "⚠️ HarmonyOS 不允许 AF_UNIX（unix domain socket）bind：设备实测 EPERM（PermissionError [Errno 1] Operation not permitted，用 python3 socket.AF_UNIX 在可写目录直接复现）。tests/unix.c 因此无法在真机执行，记为 NOT_RUN 而非通过；上游测试文件未改动"
  - "⚠️ HarmonyOS 的 /tmp 是只读的（实测 Read-only file system）：tests/file.c 写死 /tmp/file1，mfopen 返回 NULL，Release 的 NDEBUG 又把 assert(f1) 编译掉，于是空指针解引用 SIGSEGV（首轮真机 16/18 的失败原因之一）。补丁把路径改为 cwd 下的相对路径，语义不变"
  - "⚠️ 首轮真机失败 2 条（test_file SEGFAULT / test_unix SEGFAULT），修复方式不同：前者是 /tmp 只读（可修），后者是平台禁止 AF_UNIX（不可修，只能 NOT_RUN）。判断依据是先在设备上做最小探针复现，再决定改配方还是记 NOT_RUN"

