software: libgit2
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.9.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9.0"

# 编译状态
# published | built | failed | archived
status: published
build_system: cmake
compile_date: 2026-05-19

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/libgit2-1.9.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DUSE_HTTPS=OpenSSL"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/1.1.1w

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 需要 OPENSSL_ROOT_DIR 环境变量指向 OpenSSL 安装路径"
  - "libgit2 默认需要 HTTPS 后端，支持 OpenSSL/mbedTLS 或禁用"
  - "getloadavg 在 musl/OHOS 上可用，预扫描报告中的 low 级别警告无需处理"
  - "/tmp 硬编码问题：仅影响测试代码（fuzzers/tests），不影响核心功能"
  - "chmod 调用：非阻塞，HMDFS 上可能无权限效果但不影响基本功能"
