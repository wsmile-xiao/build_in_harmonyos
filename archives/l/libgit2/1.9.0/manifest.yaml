software: libgit2
# 版本级 manifest（与 conandata.yml 官方源一致，无 file:// 残留）

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.9.0"

# 编译状态
# published | built | failed | archived
status: built
build_system: cmake
compile_date: 2026-09-18

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 HTTPS，与 conandata.yml 一致）
  url: "https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.0.tar.gz"

  # 源码校验和（与官方 tarball 独立下载核验一致）
  sha256: "75b27d4d6df44bd34e2f70663cfd998f5ec41e680e1e593238bbe517a84c7ed2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（无执行端绝对路径）
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DUSE_HTTPS=OpenSSL"
    - "-DBUILD_CLI=ON"

  # 编译依赖列表（格式: name/version，与 conanfile.py requirements 一致）
  dependencies:
    - openssl/1.1.1w
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libgit2 1.9 的仓库目录属主安全校验（GIT_OPT_SET_OWNER_VALIDATION）在 HMDFS 共享属主语义下误判，消费者需 git_libgit2_opts(GIT_OPT_SET_OWNER_VALIDATION, 0)"
  - "CMakeDeps PREFER_CONFIG=ON 使 find_package(OpenSSL) 命中 conan config（小写 openssl_FOUND），上游检查大写 OPENSSL_FOUND 失败；配方关 PREFER_CONFIG + 注入 OPENSSL_ROOT_DIR 回退模块模式"
  - "libgit2 默认需要 HTTPS 后端，USE_HTTPS=OpenSSL；SHA256 亦走 OpenSSL"
  - "getloadavg 在 musl/OHOS 上可用，预扫描报告中的 low 级别警告无需处理"
  - "chmod/硬链接相关测试失败为 HMDFS 平台差异（E046/E079），非库缺陷"