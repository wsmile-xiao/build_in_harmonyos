# MANIFEST — libgit2 1.9.0
# 轻量级跨平台 Git 核心库（CMake, C），HarmonyOS PC (aarch64) 适配

# 软件级元数据
name: libgit2
version: "1.9.0"
description: "Lightweight cross-platform Git core library implementation"
homepage: "https://libgit2.org/"
license: "GPL-2.0-only WITH GCC-exception-2.0"
language: C
build_system: cmake

# 上游测试（R51 申报表，如实填报，详细台账见最终任务报告 test-ledger 章节）
# libgit2 上游使用 Clar 测试框架（tests/libgit2 + tests/util），官方 tag 源码
# 中按可复制枚举规则（grep '^(void|static void) test_[a-z0-9_]+__[a-z0-9_]+ *('）
# 发现 4097 个测试函数声明（libgit2 3609 + util 488）；CTest 注册 12 个测试
# 入口（libgit2_tests 11 + util_tests 1）。本地 OHOS 实际运行：6 个入口通过
# （gitdaemon/gitdaemon_namespace/gitdaemon_sha256/online_customcert/ssh/
# auth_clone_and_push），3 个失败（invasive/proxy/util，HMDFS 权限/证书平台
# 差异），3 个网络入口阻塞（offline 超时/online/auth_clone）。全量通过率
# 6/12 = 50%（失败/阻塞均计入分母）。逐项映射与失败原因见最终报告。
upstream_tests:
  - description: "Clar 测试套件（tests/libgit2+util，4097 个测试函数声明，12 个 ctest 入口）"
    count: 4097
    status: "已枚举；6/12 ctest 入口通过，3 失败（HMDFS 平台差异），3 网络阻塞；逐项映射见最终报告"
  - description: "真实执行：gitdaemon/gitdaemon_namespace/gitdaemon_sha256/online_customcert/ssh/auth_clone_and_push 通过；invasive/proxy/util 失败原因逐项记录"
    count: 12
    status: "6 passed / 3 failed / 3 blocked (network)"

# test_package 中自带的测试（消费者视角验证, R34 真实 API）
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 git_libgit2_version（版本断言）+ git_libgit2_init + git_libgit2_opts(GIT_OPT_SET_OWNER_VALIDATION,0)（HMDFS 属主校验适配）+ git_repository_init 在当前目录创建裸仓库（成功断言）"
    command: "conan create（test_package 自动构建运行）"