# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 如实申报，无占位符）
# 详见: docs/TEST_QUALITY_SPEC.md

package: libgit2/1.9.0
homepage: "https://libgit2.org/"

# 上游测试命令 (用于 ctest -N 分析；libgit2 使用 Clar 测试框架)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 否：上游测试由适配过程独立构建运行（build-step2/ctest），配方 build() 仅构建库与 CLI（BUILD_TESTS=OFF）
upstream_test_in_build: false
upstream_test_command: "cd build && ctest --output-on-failure"

# 上游实际运行的测试程序（Clar 套件：tests/libgit2 3609 用例 + tests/util 488 用例，共 4097 个源码声明；
# ctest 注册 12 个入口，其中 6 个通过、3 个失败（HMDFS 平台差异）、3 个网络阻塞，详见最终报告台账）
upstream_tests:
  - file: tests/libgit2/main.c
    source: libgit2-1.9.0/tests/libgit2
    description: "libgit2 Clar 主测试程序（3609 个测试函数，384+ 套件；入口：offline/invasive/online/online_customcert/gitdaemon/ssh/proxy/auth_clone 等）"
    command: "./libgit2_tests"
  - file: tests/util/main.c
    source: libgit2-1.9.0/tests/util
    description: "libgit2 工具层 Clar 测试程序（488 个测试函数，54 套件；ctest 入口 util）"
    command: "./util_tests"

# test_package 中自带的测试 (消费者视角验证, R34 真实 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 git_libgit2_version（版本断言）+ git_libgit2_init/git_libgit2_opts(GIT_OPT_SET_OWNER_VALIDATION,0)（HMDFS 属主校验适配）+ git_repository_init 在当前目录创建裸仓库（成功断言），链接 libgit2::libgit2 编译运行"
    command: "./test_libgit2"

# 测试断言总数 (近似值, 用于质量评估)：2 个（版本号一致 + 仓库初始化成功）
assertion_count: 2
