software: libexif
display: "libexif"
description: "EXIF 元数据处理库，用于读取、写入和编辑图像文件的 EXIF 信息"
category: library
homepage: "https://libexif.github.io"
license: LGPL-2.1+
build_system: autotools

ohos_adaptation:
  key_points:
    - "HarmonyOS 平台需要更新 config.guess 和 config.sub"
    - "configure 临时文件创建受 SELinux 限制，需修改临时目录路径"
    - "纯静态库，无可执行文件"
  common_dependencies: []

versions:
  "0.6.26.1":
    status: published
    build_date: "2026-08-15"
    source_url: "https://github.com/libexif/libexif/releases/download/v0.6.26/libexif-0.6.26.tar.gz"