# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libexif/0.6.26.1
homepage: "https://libexif.github.io"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (make check 实测: 14 PASS, 1 SKIP)
upstream_tests:
  - file: test/test-mem.c
    source: libexif-0.6.26/test/test-mem.c
    description: "Memory allocation / ExifMem API tests"
    command: "./test-mem"
  - file: test/test-value.c
    source: libexif-0.6.26/test/test-value.c
    description: "EXIF value conversion tests"
    command: "./test-value"
  - file: test/test-integers.c
    source: libexif-0.6.26/test/test-integers.c
    description: "Integer type round-trip tests"
    command: "./test-integers"
  - file: test/test-parse.c
    source: libexif-0.6.26/test/test-parse.c
    description: "Parse EXIF data from files"
    command: "./test-parse"
  - file: test/test-parse-from-data.c
    source: libexif-0.6.26/test/test-parse-from-data.c
    description: "Parse EXIF data from memory buffers"
    command: "./test-parse-from-data"
  - file: test/test-tagtable.c
    source: libexif-0.6.26/test/test-tagtable.c
    description: "Tag table lookup tests"
    command: "./test-tagtable"
  - file: test/test-sorted.c
    source: libexif-0.6.26/test/test-sorted.c
    description: "Sorted tag list tests"
    command: "./test-sorted"
  - file: test/test-fuzzer.c
    source: libexif-0.6.26/test/test-fuzzer.c
    description: "Fuzz-oriented robustness tests"
    command: "./test-fuzzer"
  - file: test/test-null.c
    source: libexif-0.6.26/test/test-null.c
    description: "NULL-handling robustness tests"
    command: "./test-null"
  - file: test/test-gps.c
    source: libexif-0.6.26/test/test-gps.c
    description: "GPS EXIF tag tests"
    command: "./test-gps"
  - file: test/parse-regression.sh
    source: libexif-0.6.26/test/parse-regression.sh
    description: "Regression test: parse sample images"
    command: "./parse-regression.sh"
  - file: test/swap-byte-order.sh
    source: libexif-0.6.26/test/swap-byte-order.sh
    description: "Byte-order swap round-trip tests"
    command: "./swap-byte-order.sh"
  - file: test/extract-parse.sh
    source: libexif-0.6.26/test/extract-parse.sh
    description: "Extract and parse test images"
    command: "./extract-parse.sh"
  - file: test/check-mnote.sh
    source: libexif-0.6.26/test/check-mnote.sh
    description: "MakerNote data tests"
    command: "./check-mnote.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 exif_data_new()/exif_loader_new() 验证 libexif API 可用性 (R34)"
    command: "./test_libexif"
  - file: oom-test.c
    description: "OOM 鲁棒性补全测试：ExifMem 失败分配器注入（第 N 次分配返回 NULL）+ RLIMIT_AS 限制，验证内存分配失败时优雅失败不崩溃"
    command: "./oom-test --fail-n N <jpg> | ./oom-test --rlimit MB <jpg>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
