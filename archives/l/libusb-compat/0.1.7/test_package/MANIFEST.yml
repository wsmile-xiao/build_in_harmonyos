# Upstream and consumer test declaration for CI L0e.
package: libusb-compat/0.1.7
homepage: https://libusb.info/

# Upstream has no test suite — libusb-compat is a thin shim (one .c file)
# that delegates every call to libusb-1.0.  No upstream tests to run.
upstream_test_in_build: false

test_package_tests:
  - file: test_libusb_compat.c
    description: "Compat layer init, bus/device enumeration, and error-string validation"
    command: "./test_libusb_compat"

assertion_count: 3
