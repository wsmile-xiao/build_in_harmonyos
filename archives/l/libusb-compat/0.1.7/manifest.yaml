build:
  system: cmake
  dependencies:
    - libusb/1.0.27

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-config.h.cmake.patch"
  - "0003-libusb.pc.in.patch"

knowledge_gained:
  - "Upstream uses autotools but HMDFS hmmac blocks temp file operations; CMake build system added via patches"
