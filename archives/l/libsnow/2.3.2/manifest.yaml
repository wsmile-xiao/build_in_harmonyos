name: libsnow
version: 2.3.2
status: published
build_system: header-only
upstream_url: https://github.com/mortie/snow
source_url: https://github.com/mortie/snow/archive/refs/tags/v2.3.2.tar.gz

dependencies:
  build: []
  runtime: []

patches:
  - file: patches/0000-replace-typeof-with-__typeof__.patch
    description: Replace typeof with __typeof__ for C11 compatibility
    category: portability
    upstream_status: not_submitted

build_info:
  compiled: false
  header_only: true
  tested: true
  test_framework: snow
  
adaptation_notes: |
  snow is a header-only testing framework that requires no compilation.
  
  Main adaptation:
  - Replaced GNU extension 'typeof' with '__typeof__' for strict C11 compatibility
  
  The original snow.h uses 'typeof' keyword which is a GNU extension.
  While GCC accepts it, Clang in strict C11 mode requires '__typeof__'.
  Both GCC and Clang support '__typeof__' as a builtin keyword.

verification:
  local_build: passed
  conan_create: passed
  test_package: passed

