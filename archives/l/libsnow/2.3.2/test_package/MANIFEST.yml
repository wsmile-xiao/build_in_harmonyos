name: snow
version: 2.3.2
test_summary:
  upstream_tests:
    total: 0
    description: |
      snow is a testing framework itself, not a library with tests.
      The upstream repository contains example projects demonstrating
      usage, but no self-tests of the framework.
  
  adaptation_tests:
    total: 1
    description: |
      Conan test_package that verifies:
      - snow.h can be included
      - Basic assertions work (asserteq)
      - String assertions work (asserteq_str)
      - Test execution and reporting functions correctly
    
    framework: snow
    location: test_package/
    
  pass_rate:
    upstream: "N/A (no upstream tests)"
    adaptation: "2/2 (100%)"
    
verification_method: |
  Header-only library verification through Conan test_package.
  Tests demonstrate that the patched snow.h works correctly
  with strict C11 compilation on OHOS/musl.
