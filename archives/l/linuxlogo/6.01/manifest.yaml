version: "6.01"
software: linuxlogo
status: built
build_date: "2026-09-25"
build_system: makefile
conan_ref: "linuxlogo/6.01"

source:
  url: "https://github.com/deater/linux_logo/archive/refs/tags/v6.01.tar.gz"
  sha256: "ca831148b39d6c86eb5413068aca9e450f2f704c95cee3ccb7c0dd574d8e6e16"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "--prefix=<package_folder>  (upstream hand written configure parses only this one token)"
  make_variables:
    - "CC=/data/service/hnp/bin/clang"
    - "AR=llvm-ar"
    - "OS=Linux"
    - "USE_I18N=0"
    - "TRANSLATIONS="
    - "LIBSYSINFO=libsysinfo-0.3.0  (tests/Makefile only)"
  dependencies: []
  cc: "/data/service/hnp/bin/clang"
  cxx: "n/a (纯 C 项目，未使用 C++ 编译器)"

patches_applied: []

knowledge_gained:
  - "手写 configure 只认 --prefix，命令行 var=value 与环境变量都不是可靠入口：编译器/标志一律改在 make 命令行以行内变量传入"
  - "configure 编译器探测失败仍 exit 0 并写出空 CC ⇒ make 报 make: O2: No such file or directory（第一条真实错误不是编译器名）"
  - "uname 返回 HarmonyOS 的包若用 cd $(OS) 选后端需在 make 时强制 OS=Linux"
  - "OHOS native sysroot 无 libintl.h：gettext 型 i18n 需 USE_I18N=0 关闭而非补库"
  - "basic_layout 下 conan 在 build() 期把 cwd 切到 build-release，in-tree 构建的 ./configure/make 必须显式 cwd=source_folder"
  - "conan 2.29 只注册 dict 型 tools.build:compiler_executables，:c 形态会抛 does not exist in configuration list"
  - "CI 门禁 L0d 要求 test_package 的 test() 字面含 self.run，只用 subprocess 会被判 stub_test_method"

knowledge_ref: "knowledge/drafts/DRAFT-linuxlogo-6.01-custom-configure-drops-nonprefix-argv.md"
