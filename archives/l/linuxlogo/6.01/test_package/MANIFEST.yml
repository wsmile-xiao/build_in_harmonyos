# rule4 test ledger.  Upstream ships tests/ (tests/README: "some tests
# checking for buffer overruns in linux_logo") so the count is not zero.
# Denominator = 4 atomic upstream cases found statically under tests/:
#   tests/test1, tests/test2 (shell drivers, counted individually),
#   tests/memory_print, tests/memory_method (programs built by tests/Makefile).
# There is no automake/CTest harness and neither Makefile declares a check or
# test target, so N_registered == N_static == 4.
# All four are executed from the recipe's build(), each asserted on its exit
# status and (except test1) on an output marker.  test2 exits 1 because that
# is the upstream truncation guard firing, which is its expected outcome.
package: linuxlogo
version: "6.01"
upstream_tests:
  - name: tests/test1
    kind: shell
    status: executed-passed
    note: "./linux_logo -t <huge title>; asserted rc == 0"
  - name: tests/test2
    kind: shell
    status: executed-passed
    note: "asserts the truncation guard fires (rc 1 plus the upstream error text)"
  - name: tests/memory_print
    kind: program
    status: executed-passed
    note: "built by tests/Makefile with CC/AR/LIBSYSINFO overridden; asserted rc == 0 and the 1PB row"
  - name: tests/memory_method
    kind: program
    status: executed-passed
    note: "same build; asserted rc == 0 and the MEMINFO backend block"
consumer_tests:
  - name: test_package/conanfile.py
    asserts: 6
max_rss_mb: 5
