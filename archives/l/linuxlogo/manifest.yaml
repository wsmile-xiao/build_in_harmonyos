software: linuxlogo
display: "Linux Logo"
description: "在终端打印发行版 Logo，并在 Logo 上叠加 CPU 型号与数量、内存、负载、运行时间、主机名等系统信息"
category: utils
homepage: "http://www.deater.net/weave/vmwprod/linux_logo/"
repository: "https://github.com/deater/linux_logo"
license: GPL-2.0-or-later
build_system: makefile
keywords:
  - logo
  - terminal
  - sysinfo
  - uptime
ohos_adaptation:
  key_points:
    - "上游 ./configure 是手写脚本（非 autoconf），参数协议只有 --help/--prefix：其余 var=value 命令行 token 被静默丢弃"
    - "编译器探测 which gcc/which cc 双双落空时只打印 C compiler not found! 仍 exit 0，并把空 CC 烧进 Makefile.default ⇒ make 报 make: O2: No such file or directory；唯一可靠通道是 make 命令行行内变量"
    - "uname 返回 HarmonyOS，而 libsysinfo 用 cd $(OS) 选后端且上游无该目录 ⇒ make 时 OS=Linux（该后端只读 /proc，HongMeng 提供）"
    - "OHOS native sysroot 无 libintl.h ⇒ make 时 USE_I18N=0 并 TRANSLATIONS= 跳过 po/"
    - "设备无 install(1)、configure 的 INSTALL 为空 ⇒ package() 手工 copy + os.chmod(0o755)"
    - "上游 6.01 只在明文 http 官网发布 tarball，PF7 拒绝；改用作者自有仓库 release tag（与 Debian orig 逐文件同一）"
versions:
  "6.01":
    status: built
    build_date: "2026-09-25"
    conan_ref: "linuxlogo/6.01"
    packaging: conan
    notes: "conan recipe（os=OHOS arch=armv8），零依赖；上游 4 项用例全部在 build() 内执行并按退出码+输出标记双断言"
    dependencies: []
