software: libuinputplus
name: libuInputPlus
description: Easy-to-use C++ library for the Linux uinput interface (virtual input devices)
category: input
license: MIT
website: https://github.com/YukiWorkshop/libuInputPlus

versions:
  - version: "0.1.4"
    status: built
    compiled_at: 2026-09-27
    notes: |
      - 首次适配
      - CMake 构建，无第三方依赖（仅 sysroot Linux UAPI 头）
      - 上游 v0.1.4 同时构建 .so 与 .a，头文件在 include/uInputPlus/ 子目录
    dependencies:
      - kernel headers (linux/uinput.h)
    provides:
      - libuInputPlus.so
      - libuInputPlus.a
