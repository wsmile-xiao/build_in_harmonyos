# manifest.yaml — libuinputplus 0.1.4 版本级元数据

software: libuinputplus
version: "0.1.4"
status: built
build_date: "2026-09-27"

build_system: cmake
upstream_url: "https://github.com/YukiWorkshop/libuInputPlus"
source_url: "https://github.com/YukiWorkshop/libuInputPlus/archive/refs/tags/v0.1.4.tar.gz"
sha256: "a537e156d11ad00c643b93cbd9b712d3ec9d0ae8e40731ff763fe9a6ffe97458"
upstream_tag: v0.1.4

description: "Easy-to-use C++ library for the Linux uinput interface (virtual input devices)"
license: MIT

dependencies:
  - name: kernel-headers
    type: system
    description: "Linux kernel UAPI headers (linux/uinput.h -> linux/input.h, linux/input-event-codes.h), provided by OHOS SDK sysroot"

provides:
  - libuInputPlus.so
  - libuInputPlus.a
  - include/uInputPlus/uInput.hpp
  - include/uInputPlus/uInputSetup.hpp
  - include/uInputPlus/CommonIncludes.hpp

conan:
  user: ohpcd
  channel: stable

notes: |
  - CMake 构建，无第三方依赖，仅需工具链 sysroot 中的 Linux UAPI 头
  - 上游 cmake_minimum_required(3.0)，通过 CMAKE_POLICY_VERSION_MINIMUM=3.5
    兼容 CMake 4.x（不打补丁，知识条目 E103）
  - v0.1.4 tag 的 CMake 同时构建 SHARED 与 STATIC（同输出名），头文件装
    include/uInputPlus/ 子目录（.pc 的 Cflags 指向该子目录），配方
    includedirs 与之一致
  - 上游无测试套件（清点证据见 notes.md）；test_package 使用回调模式
    （无需 /dev/uinput）验证安装后的库
  - R40 说明：真实设备路径（open /dev/uinput + ioctl）在真机上的可用性
    取决于内核 uinput 模块与设备节点权限，需真机验证
