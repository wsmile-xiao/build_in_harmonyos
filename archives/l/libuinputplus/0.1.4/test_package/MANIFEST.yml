# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libuinputplus/0.1.4
homepage: "https://github.com/YukiWorkshop/libuInputPlus"

# 上游测试清点（R51 三步法第一步，清点证据见 notes.md）：
# - v0.1.4 源码树无 tests/ 目录；CMakeLists.txt 无 add_test / enable_testing
# - 根目录 test.cpp 是交互式 demo：构造 uInput(setup) 会立即
#   open("/dev/uinput")，构建机无设备节点权限，无法作为 CI 测试运行
# - .gitlab-ci.yml 仅编译不测试
upstream_check_command: "grep -c add_test CMakeLists.txt || true"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_uinputplus.cpp
    description: >-
      回调模式（无需 /dev/uinput）验证安装后的库：extern 常量集
      （DefaultEventTypes/DefaultKeys/DefaultRels/DefaultAbss）、
      uInputDeviceInfo/uInputAbsSetup/uInputSetup 构造与引用成员、
      SendKey/SendKeyPress/RelativeMove/RelativeWheel/AbsolutePosition
      的事件序列与 SYN_REPORT 行为
    command: "./test_uinputplus"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
