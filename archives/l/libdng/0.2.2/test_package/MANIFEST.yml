package: libdng/0.2.2
homepage: "https://gitlab.com/megapixels-org/libdng"

upstream_check_command: "meson test --list"
upstream_test_in_build: true
upstream_test_command: "meson test --print-errorlogs"

upstream_tests:
  - file: check_mode.c
    source: libdng-0.2.2/tests/check_mode.c
    description: "greatest mode tests (mode_from_name 8bit/10bit/packed, 3 TESTs)"
    command: "meson test check_mode"
  - file: check_dng.c
    source: libdng-0.2.2/tests/check_dng.c
    description: "greatest DNG roundtrip tests (generate_simple_dng/read_dng, 2 TESTs)"
    command: "meson test check_dng"
  - file: check_dcp.c
    source: libdng-0.2.2/tests/check_dcp.c
    description: "greatest DCP calibration test (load_pinephone_dcp, 1 TEST)"
    command: "meson test check_dcp"
  - file: check_repack.c
    source: libdng-0.2.2/tests/check_repack.c
    description: "greatest repack tests (repack_10bit/pad1, 2 TESTs)"
    command: "meson test check_repack"

test_package_tests:
  - file: test.c
    description: "消费者冒烟：init/new/free、RGGB 模式、元数据 setters、16x16 最小 DNG 写出并校验非空"
    command: "./test_libdng"

assertion_count: 4
