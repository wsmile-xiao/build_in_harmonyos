version: "0.2.2"
software: "libdng"
status: built
build_date: "2026-09-17"
build_system: "meson"
conan_ref: "libdng/0.2.2"

source:
  url: "https://gitlab.com/megapixels-org/libdng/-/archive/0.2.2/libdng-0.2.2.tar.gz"
  sha256: "f0f99a8e47c9bd67087238b54ae33a9692fc32e855362c98c94b6aaceea96821"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "default_library=shared"
    - "man-pages=disabled"
    - "wrap_mode=nodownload"
  dependencies:
    - libtiff/4.7.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libdng 0.2.2 主构建是 Meson；CMakeLists 仍为 0.1 旧版本号，不采用"
  - "man-pages 须 disabled，否则 dependency scdoc 在 OHOS/CI 失败"
  - "shared_library 改 library 一行替换即可让 default_library 生效，无需补丁文件"
