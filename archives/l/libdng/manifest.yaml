software: libdng
display: "libdng"
description: "Interface library between libtiff and the world to make sure the output is valid DNG"
category: gfx
homepage: "https://gitlab.com/megapixels-org/libdng"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson primary build (upstream CMakeLists is stale at 0.1); man-pages disabled (no scdoc on OHOS)"
    - "Depends only on libtiff/4.7.2 via PkgConfigDeps (upstream dependency libtiff-4)"
    - "Upstream greatest suite (4 meson tests) runs in build() via meson.test()"
  common_dependencies:
    - libtiff

versions:
  "0.2.2":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libdng/0.2.2"
