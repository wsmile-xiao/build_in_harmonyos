functional_testing:
  date: "2026-10-08"
  report: "conan create 全链验证（见 notes.md 第四节）"
  result: "pass"
  pass_rate: "100%（消费冒烟 5/5；上游 4 程序运行态受沙箱限制 0/4，环境限制豁免）"
  tests_passed: 5
  tests_failed: 0
  tests_skipped: 0
  notes: >
    配方形态沿袭 1.0.27：--enable-tests-build 上游默认关闭，tests/ 不进
    SUBDIRS，make check 无失败项。试验实测（--enable-tests-build）：
    stress/stress_mt/set_option/init_context 4 程序全部死于
    libusb_init 返回 LIBUSB_ERROR_IO(-1)，根因为 OHOS HAP 沙箱 SELinux
    neverallow 阻断 /sys/bus/usb/devices 设备发现（1.0.27 归档能力评估
    已完整定性：平台限制非代码缺陷）。消费测试 test_package 5/5 通过
    （含 NO_DEVICE_DISCOVERY 平台初始化路径，吸收 1.0.27.1 分支 AI
    review P2 修复形态）。

platform_notes:
  - "默认初始化失败：sysfs /sys/bus/usb/devices/ 受 SELinux 策略限制（同 1.0.27，errno=13）"
  - "热插拔 netlink socket 在 HAP 沙箱受限（同 1.0.27，neverallow，平台限制非代码缺陷）"
  - "推荐初始化方式：libusb_init_context + LIBUSB_OPTION_NO_DEVICE_DISCOVERY（同 1.0.27）"
  - "动态链接和静态链接均可正常使用"

knowledge_gained:
  - id: E091
    description: "sockaddr_storage 重定义冲突（linux/socket.h vs sys/socket.h）——1.0.29 实测仍适用"
  - id: E112
    description: "HMDFS umask 077 导致 configure 临时目录权限异常——1.0.29 实测仍适用"
  - description: "HongMeng 内核版本格式解析修复沿用 1.0.27 方案——1.0.29 linux_usbfs.c 解析逻辑未变，精确匹配复用"
