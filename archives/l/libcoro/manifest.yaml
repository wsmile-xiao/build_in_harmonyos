software: libcoro
display: "libcoro"
description: "Lightweight C coroutine library providing context switching functionality"
category: foundation
homepage: "https://metacpan.org/pod/Coro"
license: BSD-2-Clause
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "必须使用 CORO_SJLJ 后端（-DCORO_SJLJ），其他后端在 musl/OHOS 不可用"
    - "CORO_UCONTEXT: musl/OHOS 缺少 getcontext/makecontext/swapcontext"
    - "CORO_PTHREAD: musl/OHOS 缺少 pthread_cancel"
    - "CORO_ASM: aarch64 汇编标注 experimental/unstable"
    - "源码是 Perl Coro 模块的子组件，需要自定义 Makefile 编译独立 C 库"
  common_dependencies: []

# 版本索引
versions:
  "6.513":
    status: published
    build_date: "2026-06-01"