knowledge_gained:
  - "OpenLDAP 2.6 头文件用 #if LDAP_DEPRECATED 隐藏旧 API（ldap_init/ldap_simple_bind_s/ldap_search_s 等），需 CFLAGS 加 -DLDAP_DEPRECATED=1（符号仍在 libldap.so 中导出） [knowledge_ref: E600]"
  - "HMDFS 不支持硬链接：Makefile 的 ln -f ldap2dns ldap2dnsd 需改为 cp -f [knowledge_ref: E079]"
  - "上游 Makefile 把 $(LIBS) 写在 prerequisites 中导致 make 报 No rule to make target '-lldap'，需移到链接命令行 [knowledge_ref: E097]"

