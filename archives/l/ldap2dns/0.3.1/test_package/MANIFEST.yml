# test_package/MANIFEST.yml — ldap2dns 0.3.1 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
# 详见: docs/TEST_QUALITY_SPEC.md

package: ldap2dns/0.3.1
homepage: "https://packages.debian.org/source/ldap2dns"

# 上游测试命令 (make -n check / ctest -N / meson test --list)
# R51 清点：上游 0.3.1 无任何测试——无 tests/ 目录、Makefile 无 check/test
# 目标、无 autotools 测试机制（Makefile 无 installcheck 等）。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无，见上）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "ldap2dns/ldap2dnsd 二进制可执行验证（-V 打印版本行且输出非空）"
    command: "./test_ldap2dns"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
