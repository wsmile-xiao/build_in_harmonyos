# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libubox/20260222
homepage: "https://github.com/openwrt/libubox"

# 上游测试命令 (CMake UNIT_TESTING=ON + ctest)
upstream_check_command: "make check"

# conanfile.py build() 方法中未集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (cram/shunit2，依赖 valgrind，OHOS 平台不可用)
upstream_tests:
  - file: tests/unit/test-blobmsg.c
    source: libubox-20260222/tests/unit/test-blobmsg.c
    description: "blobmsg 单元测试"
    command: "./test-blobmsg"

# test_package 中自带的测试 (消费者视角验证 blobmsg API)
test_package_tests:
  - file: test.c
    description: "消费者测试: blobmsg_buf_init/add_string/add_u32/遍历断言"
    command: "./test_libubox"

# 测试断言总数 (name 字符串 + year 数值 + 2 个存在性检查)
assertion_count: 4
