sources:
  url:
    - "https://github.com/benmcollins/libjwt/archive/refs/tags/v3.3.3.tar.gz"
  sha256: "a562e5548a8e10ac6fcba64a5e6d326c15712211cb54d25242c15e8b3250b4f2"

patches:
  - patch_file: "patches/0001-cmake-fix-codegen-bash-c.patch"
    patch_description: "0001: CMakeLists codegen commands used 'bash -c \"...\"' whose quoting is dropped by add_custom_command's argument splitting, leaving bash -c to run only the compiler name with no input; call the compiler directly instead (fixes silent codegen Error 1 on OHOS)"
    patch_type: "portability"
