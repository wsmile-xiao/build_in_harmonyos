version: 3.3.3
software: libjwt-tools
status: built
build_date: '2026-09-18'
build_system: cmake

source:
  url: "https://github.com/benmcollins/libjwt/archive/refs/tags/v3.3.3.tar.gz"
  sha256: "a562e5548a8e10ac6fcba64a5e6d326c15712211cb54d25242c15e8b3250b4f2"
  tar_format: tar.gz
  note: "与同源父包 libjwt/3.3.3 同一官方版本化归档、同一 sha256。"

build:
  system: cmake
  configure_options:
    - "WITH_TESTS=OFF（工具包不注册上游 check target；tools 目标位于 CMakeLists.txt:179-205 的 WITH_TESTS 块之外，无条件构建）"
    - "WITH_JSON_C=OFF / WITH_GNUTLS=OFF / WITH_MBEDTLS=OFF / WITH_LIBCURL=OFF / WITH_KCAPI_MD=OFF / ENABLE_COVERAGE=OFF"
    - "CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE（HMDFS 无法创建版本化符号链接）"
    - "CMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,（缺该变量会走 CMakeDeps 的 IMPORTED_NO_SONAME 分支）"
    - "构建目标：make -j1 jwt-verify jwt-generate jwk2key key2jwk（只构建 4 个工具，不构建 lib/tests）"
  dependencies:
    - "libjwt/3.3.3"
    - "openssl/3.5.6"
  dependency_notes:
    - "libjwt/3.3.3 为本包本体：package_type=application，只交付 bin/，不 re-export libjwt 的头/库。"
    - >-
      openssl/3.5.6 必须显式声明为本包的 direct require。仅靠 libjwt 传递时，该 require 经
      graph.py:154 Requirement.transform_downstream() 传到消费者层后 run=false/libs=false，
      被 graph_binaries.py:556-564 _skip_binaries() 标 skip=True（节点 binary=BINARY_SKIP），
      而 conan/internal/model/dependencies.py:167 的 dependencies.host 会过滤 skip=True，
      PkgConfigDeps（pkgconfigdeps.py:335/364）正遍历 dependencies.host → 不产出 openssl.pc
      → 上游 CMakeLists.txt:71 pkg_check_modules(OPENSSL openssl>=3.0.0 REQUIRED) 报
      "No package 'openssl' found"。jansson 不受影响，因 libjwt.so 动态依赖 libjansson.so（run=true）。
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-fix-codegen-bash-c.patch"

artifacts:
  executables:
    - "bin/jwt-verify"
    - "bin/jwt-generate"
    - "bin/jwk2key"
    - "bin/key2jwk"
  manpages:
    - "share/man/man1/jwt-verify.1"
    - "share/man/man1/jwt-generate.1"
    - "share/man/man1/jwk2key.1"
    - "share/man/man1/key2jwk.1"
  licenses:
    - "licenses/LICENSE"

knowledge_gained:
  - >-
    Conan 2 的 dependencies.host 是 filter({\"build\": False, \"test\": False, \"skip\": False})：
    凡是被 _skip_binaries() 标 skip=True 的依赖都不会出现在 host 里，PkgConfigDeps/CMakeDeps 也就
    拿不到它。判定依据是 Requirement.transform_downstream() 后的 run/libs traits —— 已经预编译的
    共享库把某个静态依赖链进去了，该依赖传到消费者层就是 run=false/libs=false → skip=True。
    解法：把它提成本包的 direct require（消费者根节点的 direct require 一定进 deps_required）。
  - >-
    package_type=application 的子包不 re-export 本体库的头/库，因此在 test_package 里本体只处于
    传递位置：CMakeDeps 生成的 libjwt-release-armv8-data.cmake 中 set(libjwt_INCLUDE_DIRS_RELEASE )
    与 set(libjwt_LIBS_RELEASE ) 都是空值（同文件 LIB_DIRS/BIN_DIRS/SYSTEM_LIBS 正常），
    test_package 若要用本体 API 必须自己再 requires(\"libjwt/3.3.3\")。
  - >-
    OHOS/musl 下 make jobserver 并行 spawn 竞态同样影响工具目标构建，故沿用父包的
    subprocess + make -j1 串行构建（并前置 SDK llvm/lib 进 LD_LIBRARY_PATH 供 lld 加载 libxml2.so.16）。
  - >-
    工具产物静态链接 jwt_static：4 个可执行文件的 DT_NEEDED 只有 libjansson.so + libc.so，
    不含 libjwt.so；e_machine=183（AArch64）且带 PT_INTERP，可直接在 OHOS 上执行。
  - >-
    本机无 bats（上游 CMakeLists 用 find_program(bats) 探测，探测不到即不注册 jwt_cli 测试，
    属上游优雅降级），且无 jq；本配方按 tests/jwt-cli.bats 的 9 个 @test 逐条等价复现，
    并用 python3 复现 jq 的 normalize/equiv 语义，不裁剪任何用例。

upstream_tests:
  framework: bats（tests/jwt-cli.bats）
  upstream_registration: "add_test(NAME jwt_cli ...) 仅在 find_program(bats) 命中时注册"
  command: "逐条复现 tests/jwt-cli.bats 的 9 个 @test（镜像无 bats），在 build 目录内执行 ./tools/<tool>"
  discovered: 9
  executed: 9
  passed: 9
  failed: 0
  skipped: 0
  cases:
    - "Generate a JWT with alg none"
    - "Verify a JWT with alg none"
    - "Generate a JWT with alg HS256"
    - "Verify a JWT with alg HS256"
    - "Generate a JWT with alg HS256 and claims"
    - "Verify a JWT with alg HS256 with claims"
    - "Generate JWKS from PEM Files"
    - "Convert JWK to PEM - RSA"
    - "Convert JWK to PEM - OCT"
  deviations:
    - "用例 3-6 的密钥路径：上游 bats 写 '../tests/keys/oct_key_256.json'（假定 build 目录位于源码树内），本配方用源码树绝对路径等价替代。"
    - "用例 7 的 JSON 等价比较：上游用 jq（normalize = walk(if type == \"array\" then sort else . end)），OHOS 镜像无 jq，本配方用 python3 复现同一 normalize/equiv 语义。"

test_package:
  harness: "test_package/conanfile.py"
  discovered: 37
  passed: 37
  failed: 0
  cases:
    - "test_consumer（C）：经 requires(libjwt/3.3.3) 调用公开 API，JWKS 装载 → HS256 签发 → 校验通过 → 篡改负样本，12/12"
    - "test_ohos（C，本适配新增的鸿蒙消费者用例）：4 个工具经 Conan bindirs 可达 + X_OK + ELF64/e_machine=183/PT_INTERP + DT_NEEDED 含 libjansson.so 且不含 libjwt.so，21/21"
    - "工具端到端（Python）：key2jwk 生成 JWK → jwt-generate 签发 → jwt-verify 校验通过 → 篡改后被拒绝，4/4"

validation:
  local:
    source_version_check: passed
    source_sha256_check: passed
    dependency_preflight_w0: passed
    conan_create: passed
    conan_create_recipe_revision: "b49cd66f9054e21e1c2c2888d64c12fb"
    conan_create_package_id: "d5638da3e804c734402caf87ffefdafa9e205fd9"
    upstream_tests: "passed (9/9 上游 jwt-cli.bats 用例，0 失败 0 跳过)"
    test_package: "passed (37/37 = test_consumer 12 + test_ohos 21 + 工具端到端 4)"
    reproducible_rerun: >-
      package_id 在多次独立干净复跑中恒为 d5638da3e804c734402caf87ffefdafa9e205fd9（含
      仅注释/方法顺序改动引起的 recipe revision 变更前后），即配方在二进制维度确定可复现。
    log: "reports/conan-create-final.log（本地证据，已被 .gitignore 忽略，不入库）"
  ohos:
    conan_create: pending_ci
    reason: >-
      本地（OHOS aarch64 设备）conan create 全链路 EXIT=0；官方 CI 为 clean 环境，需在 PR 阶段做最终复验。
