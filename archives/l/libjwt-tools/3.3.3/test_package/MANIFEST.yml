# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 数据来源：本机 OHOS aarch64 实测（2026-09-18）。逐用例原始输出见
# reports/conan-create.log 的 HMBS_UPSTREAM_TEST_RESULT 标记（本地证据路径，
# 被 .gitignore 的 reports/ 规则忽略、不随 PR 入库）。
#
# libjwt-tools 是 libjwt 同一源码树的命令行工具子包，上游对该交付物的
# 自动化测试就是 tests/jwt-cli.bats（由 CMakeLists.txt:342 的
# add_test(NAME jwt_cli ...) 经 ctest 驱动，`check` target 触发）。

package: libjwt-tools/3.3.3
homepage: "https://github.com/benmcollins/libjwt"

# 上游测试入口（上游方式：CMake/CTest 驱动 bats）
upstream_check_command: "ctest -R jwt_cli"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
# 镜像内无 bats（上游 CMakeLists 用 find_program(bats) 探测），故 build() 按
# add_test(NAME jwt_cli) 的等价语义逐条复现 9 个 @test 的「命令 + 断言」，
# 由 /bin/sh 驱动（上游把解释器硬编码为 /bin/bash，OHOS 根文件系统只有
# /bin/sh）。差异逐条登记于下方 deviations 与 notes.md「上游测试」节。
upstream_test_command: "cd <build>; ./tools/{jwt-generate,jwt-verify,key2jwk,jwk2key} <与 bats 逐条同参的命令>"

# 上游实际运行的测试程序（tests/jwt-cli.bats 的 9 个 @test，逐条对应）
upstream_tests:
  - file: tests/jwt-cli.bats
    source: libjwt-3.3.3/tests/jwt-cli.bats
    description: "① Generate a JWT with alg none（断言 == eyJhbGciOiJub25lIn0.e30.）"
    command: "./tools/jwt-generate -v -a none -n"
  - file: tests/jwt-cli.bats
    source: libjwt-3.3.3/tests/jwt-cli.bats
    description: "② Verify a JWT with alg none"
    command: "./tools/jwt-verify -v eyJhbGciOiJub25lIn0.e30."
  - file: tests/jwt-cli.bats
    source: libjwt-3.3.3/tests/jwt-cli.bats
    description: "③ Generate a JWT with alg HS256（断言 == 上游 HS256_RES）"
    command: "./tools/jwt-generate -v -a HS256 -n -k tests/keys/oct_key_256.json"
  - file: tests/jwt-cli.bats
    source: libjwt-3.3.3/tests/jwt-cli.bats
    description: "④ Verify a JWT with alg HS256"
    command: "./tools/jwt-verify -v -k tests/keys/oct_key_256.json ${HS256_RES}"
  - file: tests/jwt-cli.bats
    source: libjwt-3.3.3/tests/jwt-cli.bats
    description: "⑤ Generate a JWT with alg HS256 and claims（断言 == 上游 CLAIM_RES）"
    command: "./tools/jwt-generate -v -n -k tests/keys/oct_key_256.json -c s:group=staff -c b:admin=false -c s:iss=disk.swissdisk.com -c s:user=bcollins -c i:exp=1839317562 -j '{\"foo\":\"bar\"}'"
  - file: tests/jwt-cli.bats
    source: libjwt-3.3.3/tests/jwt-cli.bats
    description: "⑥ Verify a JWT with alg HS256 with claims"
    command: "./tools/jwt-verify -v -k tests/keys/oct_key_256.json ${CLAIM_RES}"
  - file: tests/jwt-cli.bats
    source: libjwt-3.3.3/tests/jwt-cli.bats
    description: "⑦ Generate JWKS from PEM Files（与 tests/cli/all.json 做 JSON 规范化等价比较）"
    command: "./tools/key2jwk --disable-kid -o - tests/keys/pem-files/*.pem tests/keys/pem-files/*.bin | grep -v libjwt.io:"
  - file: tests/jwt-cli.bats
    source: libjwt-3.3.3/tests/jwt-cli.bats
    description: "⑧ Convert JWK to PEM - RSA（jwk2key 产物与 tests/keys/pem-files/rsa_key_1024.pem 逐字节一致）"
    command: "./tools/jwk2key -d . tests/keys/rsa_key_1024.json && cmp rsa_1024_*.pem tests/keys/pem-files/rsa_key_1024.pem"
  - file: tests/jwt-cli.bats
    source: libjwt-3.3.3/tests/jwt-cli.bats
    description: "⑨ Convert JWK to PEM - OCT（jwk2key 产物与 tests/cli/oct_384.bin 逐字节一致）"
    command: "./tools/jwk2key -d . tests/keys/oct_key_384.json && cmp oct_384.bin tests/cli/oct_384.bin"

# 与上游 bats 原文的差异（如实申报；均为等价替换，不改断言语义）
upstream_tests_deviations:
  - description: >-
      用例③-⑥的密钥路径：上游 bats 写 '../tests/keys/oct_key_256.json'
      （该相对路径假定 build 目录位于源码树内，是上游 CI 的偶然约定）；
      本配方改用源码树绝对路径 '<source>/tests/keys/oct_key_256.json'。
  - description: >-
      用例⑦的 JSON 等价比较：上游用 jq（normalize = walk(if type == "array"
      then sort else . end) + equiv），OHOS 镜像内无 jq；本配方用 python3
      复现同一 normalize/equiv 语义（对象递归、数组递归后排序）。

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_consumer.c
    description: >-
      消费者冒烟（12 checks）：消费者除被测包外另显式 requires("libjwt/3.3.3")
      （libjwt-tools 是 application 包、不 re-export 本体头/库，libjwt 处于传递位置时
      Conan 会按 headers=false/libs=false 过滤其 cpp_info，CMakeDeps 导出的
      libjwt_INCLUDE_DIRS_RELEASE / libjwt_LIBS_RELEASE 均为空），取得
      libjwt::libjwt 的 include 与 -ljwt 后：JWKS 载入 → 取 JWK → HS256 签发 →
      校验通过 → 篡改后校验失败（负样本）
    command: "./test_consumer"
  - file: test_ohos.c
    description: >-
      鸿蒙（OHOS）平台特有消费者用例（21 checks，本适配新增）：验证
      libjwt-tools 交付的 4 个命令行工具经 Conan bindirs 通道可达（access
      X_OK），且为合法 OHOS aarch64 可执行文件（ELF64 / e_machine=183 /
      PT_INTERP），并断言 DT_NEEDED 含 libjansson.so 而不含 libjwt.so
      （上游 jwt_add_tool() 以 PRIVATE jwt_static 静态链接 libjwt →
      工具交付物不依赖本体共享库）；另验证 /bin/sh 可执行（上游
      add_test 硬编码 /bin/bash 的等价驱动解释器）
    command: "./test_ohos"
  - file: conanfile.py
    description: >-
      交付物动态可用性（4 checks，Python 层实际执行）：key2jwk 随机密钥 → 合法
      JWK；jwt-generate 签发三段式 token；jwt-verify 正向校验通过；篡改 token
      被拒绝（负样本）
    command: "key2jwk / jwt-generate / jwt-verify（bin/ 内交付物就地执行）"

# 上游断言总数：tests/jwt-cli.bats 9 个用例（每例 1 个断言）
assertion_count: 9
