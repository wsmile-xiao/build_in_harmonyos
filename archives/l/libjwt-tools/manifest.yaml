software: libjwt-tools
display: libJWT Tools
description: "libJWT 命令行工具集（jwt-verify / jwt-generate / jwk2key / key2jwk），同源子包，取自 libjwt 源码树 tools/"
category: crypto
homepage: https://libjwt.io
license: MPL-2.0
build_system: cmake
ohos_adaptation:
  key_points:
    - "上游用 pkg_check_modules() 定位依赖，配方需 PkgConfigDeps；且 openssl 必须声明为本包 direct require，否则传递位置会被 Conan 标 skip=True 而不生成 openssl.pc"
    - "CMake 缺 Modules/Platform/HarmonyOS.cmake，需同时给 CMAKE_PLATFORM_NO_VERSIONED_SONAME=TRUE 与 CMAKE_SHARED_LIBRARY_SONAME_<LANG>_FLAG（同父包 libjwt）"
    - "OHOS/musl 下 make jobserver 并行 spawn 竞态，改 subprocess 直接 make -j1 串行构建 4 个工具目标"
    - "上游 codegen 的 bash -c 引号拆词，沿用父包补丁 0001，并预生成 jwt-builder.i / jwt-checker.i"
    - "图像/工具包不跑 ctest（上游 add_test 硬编码 /bin/bash），按 tests/jwt-cli.bats 的等价语义逐条复现 9 个用例"
  common_dependencies:
    - "libjwt"
    - "jansson"
    - "openssl"
versions:
  3.3.3:
    status: built
    build_date: '2026-09-18'
