software: libxmp
version: 4.6.0
status: built
download_url: https://github.com/libxmp/libxmp/releases/download/libxmp-4.6.0/libxmp-4.6.0.tar.gz
build_system: cmake
configure_options:
  - -DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
dependencies: []
artifacts:
  - libxmp.so
  - libxmp.a
  - xmp.h
install_paths:
  lib: /storage/Users/currentUser/usr/local/lib
  include: /storage/Users/currentUser/usr/local/include
  cmake: /storage/Users/currentUser/usr/local/lib/cmake/libxmp
  pkgconfig: /storage/Users/currentUser/usr/local/lib/pkgconfig
build_date: 2026-05-22
build_duration: 20min
compiler: clang 15.0.4
platform: aarch64-unknown-linux-ohos
quality_check:
  g0_clean_build: pass
  g1_binary_integrity: pass
  g2_functionality: pass
  g3_portability: pass
  g4_archive_completeness: pass
issues:
  - E007: config.guess 无法识别 HarmonyOS 系统，已通过补丁修复
  - configure 权限问题，改用 CMake 构建
solutions:
  - 使用 patch-autotools-ohos.pl 补丁脚本修改 config.guess 和 config.sub
  - 修改 config.sub 内核验证部分添加 linux-ohos*
  - 使用 CMake 构建（libxmp 支持 CMake）
knowledge_gained:
  - libxmp 支持 CMake 构建，可作为 autotools 失败时的备选方案
  - CMake 在 HarmonyOS 上需要 CMAKE_POLICY_VERSION_MINIMUM 参数