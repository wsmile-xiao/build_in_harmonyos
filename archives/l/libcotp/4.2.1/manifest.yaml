software: libcotp
version: "4.2.1"
status: built
build_system: cmake
build_date: "2026-08-26"

source:
  url: "https://github.com/paolostivanin/libcotp/archive/refs/tags/v4.2.1.tar.gz"
  sha256: "5f0cc41049e9fa296c1edf09c6fb0bb6dae588b149d5049adbc41d21aefc1bb1"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DHMAC_WRAPPER=openssl"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTS=OFF"
    - "-DCOTP_BUILD_FUZZERS=OFF"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies:
    - "openssl/3.5.6"
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  type: official
  test_package:
    total: 10
    passed: 10
    failed: 0
    note: "test_cotp.c — RFC-4226 HOTP + RFC-6238 TOTP known-answer vectors via real public API"
  upstream_tests:
    total: 0
    passed: 0
    failed: 0
    note: "BUILD_TESTS=OFF (upstream suite needs Criterion test framework, not built for release)"

knowledge_gained:
  - "libcotp 上游为 paolostivanin/libcotp，CMake 构建，提供 gcrypt/openssl/mbedtls 三个 HMAC 后端"
  - "选择 openssl 后端：仓库已有 openssl/3.5.6 Conan 包，且 CMake 原生 find_package(OpenSSL) 与 Conan CMakeDeps 生成的 OpenSSL:: 目标直接对接，零 patch"
  - "上游 CMake option 名为 HMAC_WRAPPER（非 CRYPTO_BACKEND），需以实际名为准"
  - "BUILD_SHARED_LIBS / BUILD_TESTS / COTP_ENABLE_VALIDATION / COTP_BUILD_FUZZERS 为上游真实 option"
  - "libcotp 输出单一库 libcotp（target 名 cotp，SOVERSION=4），public header 为 src/cotp.h 装到 include/cotp.h"
  - "OTP 函数接收 base32 编码的 secret，故测试需先 base32_encode 原始 seed（与上游 tests/test_otp.c 一致）"
