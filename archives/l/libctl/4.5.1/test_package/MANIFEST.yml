# test_package/MANIFEST.yml
package: libctl/4.5.1
homepage: "https://github.com/NanoComp/libctl"

upstream_check_command: "make check -j1"
upstream_test_in_build: true
upstream_test_command: "make check -j1"
upstream_tests:
  - name: test-prism
    source: utils/test-prism.c

test_package_tests:
  - file: test_libctl.c
    description: "Initialize Guile, normalize a path, and verify vector dot product from the installed package"
    command: "./test_libctl"

assertion_count: 2
