notes: |
  Data-only package. The shipped 137 MB 3-gram arpa corpus is converted at
  build time with the upstream tools/sortlm.py + tools/genfilter.py (the
  exact commands from data/models/Makefile.am). sortlm.py consumes the
  marisa trie through the out-of-process helper bindings/marisa_tool.cc,
  which is compiled in one command together with the upstream marisa-trie
  0.3.1 sources pinned by sha256 in conandata.yml (marisa_sources): a
  CPython extension module cannot be imported on the OHOS build worker,
  where the sandbox only loads shared objects carrying the hnp_file
  security label (hmmac, knowledge E212). The helper is built for the
  machine that runs the tools: its compiler is picked from an ordered
  candidate list and each candidate is accepted only after its selftest
  actually runs. Building marisa from the pinned source in the same command
  keeps the helper and the trie on one ABI on every build machine, which a
  tool_requires marisa/0.3.1 cannot guarantee (a Conan package resolves for
  the profile context, so a non-OHOS build machine gets a library built by a
  different compiler). The packaged files are byte-identical and
  SHA256-verified.
validation:
  conan_create: "pass (local two-profile: OHOS clang host x build-machine marisa_tool)"
  marisa_tool_selftest: "pass (3-key trie, key ids cross-checked by lookup; the recipe only accepts a compiler/flags combination whose selftest runs on the build machine)"
  model_reproduction: "pass (8 files, size + sha256 identical to the reference; vocab trie 118,333 keys, input trie 117,901 keys, 86s end to end)"
  conan_verify: "pass (G1 sha256 / G2 upstream commands / G3 marisa source pin / G4 test_package)"
  marisa_source_provenance: "pass (all 41 upstream files verified byte-identical to the sha256-pinned official v0.3.1 tarball, so the generated model is unchanged)"
  make_check: "n/a — upstream has no independent test target"
  test_package: "pass (8 files, size + sha256 byte-identical)"
