# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libkkc-data/0.2.7
homepage: "https://github.com/ueno/libkkc"

# 上游测试命令 — 数据包无独立测试目标，构建即数据生成
# （data/models/Makefile.am 的 sorted3-data.stamp，由本 recipe build() 复现）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (libkkc-data 无测试套件)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_verify.py
    description: "Verifies all 8 model files under lib/libkkc/models/sorted3 exist and match the deterministic SHA256 reference, and that metadata.json parses"
    command: "python3 test_verify.py $PACKAGE_ROOT"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 25