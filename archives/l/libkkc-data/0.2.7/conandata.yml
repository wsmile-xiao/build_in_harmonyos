# Upstream marisa-trie 0.3.1 (BSD-2), the trie implementation the model
# generator needs. Pinned here instead of vendored so the repository carries
# no third-party source copy: the recipe compiles it together with
# bindings/marisa_tool.cc in one command for the build machine's own compiler,
# which keeps the helper and the trie on one ABI on every build machine. A
# `tool_requires marisa/0.3.1` cannot do that — a Conan package resolves for
# the profile's context, so a build machine whose profile differs from
# ohos-aarch64 either has no binary or gets a library built by a different
# compiler (locally the default Windows profile resolves an MSVC marisa.lib
# that MinGW g++/clang++ cannot link).
marisa_sources:
  url: "https://github.com/s-yata/marisa-trie/archive/refs/tags/v0.3.1.tar.gz"
  sha256: "986ed5e2967435e3a3932a8c95980993ae5a196111e377721f0849cad4e807f3"

patches:
  - patch_file: "patches/0001-python3-compat.patch"
    patch_description: "Python 3 compatibility port of tools/sortlm.py and tools/genfilter.py (print function, iteritems/items, sorted cmp→key, integer division, binary-mode file handles) and skip degenerate n-gram lines that reference tokens absent from the unigram vocabulary"
    patch_type: "portability"
  - patch_file: "patches/0002-marisa-tool.patch"
    patch_description: "Replace the in-process `marisa` Python module with the out-of-process bindings/marisa_tool helper: the OHOS build worker cannot load a CPython extension built in a user-owned path (hmmac security labels, knowledge E212). The trie build/save and the key-id lookup are unchanged, only the calling mechanism differs."
    patch_type: "portability"