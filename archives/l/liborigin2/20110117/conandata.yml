# conandata.yml — liborigin2 20110117
#
# 上游溯源说明（重要）：
#   liborigin2 原始分发渠道已全部失效 —— 作者主页 soft.proindependent.com/liborigin2/
#   已下线（Debian 只能用 Wayback 快照做 Homepage），当年的下载托管 berlios.de 已关闭，
#   SourceForge 上也没有 liborigin2 的 20110117 版本（该 SF 项目 liborigin 的
#   liborigin2/ 目录只有 2009/2010 两版）。
#   目前该版本唯一可复现、带公开校验和的来源是 Debian 源码池里的 orig tarball，
#   其 sha256 与 Debian 的 liborigin2_20110117-7.dsc 中 Checksums-Sha256 一致。
sources:
  url: "https://deb.debian.org/debian/pool/main/libo/liborigin2/liborigin2_20110117.orig.tar.gz"
  sha256: "95af95714223474e768573294f2ee9ffffc93bff3d669f4a626acf8e5dc7445e"

# 注意：orig tarball 与上游 .pro 都不包含 tree.hh，但 OriginParser.h:33 直接
# `#include "tree.hh"` —— 即该版本按原样无法编译。tree.hh 由 Conan 依赖
# tree-hh/3.18 提供（见 conanfile.py requirements），配方不 vendoring 该头文件。

patches:
  - patch_file: "patches/0001-use-shared-ptr-instead-of-auto-ptr.patch"
    patch_description: "OriginFile.h 用 std::shared_ptr 取代已从 C++17 移除的 std::auto_ptr（clang 15/libc++ 与 gcc 均报错）"
    patch_type: "portability"
  - patch_file: "patches/0002-fix-ostream-comparison-in-logging.patch"
    patch_description: "logging.hpp 里 `*s == std::cout` 是拿流对象和流对象比较，应为指针比较 `s == &std::cout`"
    patch_type: "bugfix"
  - patch_file: "patches/0003-include-algorithm-for-find-if.patch"
    patch_description: "OriginObj.h 使用了 std::find_if 却未包含 <algorithm>（新标准库不再间接引入）"
    patch_type: "portability"
  - patch_file: "patches/0004-fix-boost-posix-time-seconds-argument.patch"
    patch_description: "Origin750Parser.h 把 double 直接传给 boost::posix_time::seconds，Boost >= 1.67 起只接受整型构造"
    patch_type: "portability"
  - patch_file: "patches/0005-fix-operator-precedence-in-parsers.patch"
    patch_description: "四个解析器里的 `h & 0x60 == 0x60` 实为 `h & (0x60 == 0x60)`，恒为 h & 1；补括号恢复本意"
    patch_type: "bugfix"
  - patch_file: "patches/0006-remove-register-storage-class.patch"
    patch_description: "移除 endianfstream.hh / OriginDefaultParser.cpp 中的 register 存储类说明符（C++17 已删除，clang 15 下是硬错误）"
    patch_type: "portability"
