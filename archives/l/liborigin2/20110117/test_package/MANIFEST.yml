# test_package/MANIFEST.yml — liborigin2 20110117
# CI L0e 要求此文件存在。下面的 "0" 是实测结论，不是省略：
# 上游 20110117 源码树中确实不存在任何测试/示例（证据见 upstream_tests_evidence）。

package: liborigin2/20110117
homepage: "https://sourceforge.net/projects/liborigin/"

# 上游没有任何测试驱动目标：只有 qmake 工程 liborigin2.pro，其 TARGET 为 lib，
# 无 test/check target；也没有 tests/、test/、examples/ 目录。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试数 0 —— 逐条核验命令与结果（全部在解包后的 liborigin2-20110117/ 下执行）：
#   $ find . -iname '*test*' -o -iname '*example*' -o -iname '*demo*'
#     → 无输出（无任何测试/示例文件或目录）
#   $ grep -rn "int main" .
#     → 无命中（没有任何可执行示例）
#   $ grep -rn "add_test\|enable_testing" .
#     → 无命中
#   $ grep -n "test\|check" liborigin2.pro
#     → 只匹配到 CONFIG += warn_on release thread（无 test/check 目标）
#   同项目的 SourceForge 20101029 tarball 同样没有测试。
# 因此 Conan 配方 build() 中无从执行上游测试，本包的上游测试记为 0（如实申报）。
upstream_tests: []
upstream_test_count: 0

# 消费者视角测试（HarmonyOS 增量验证）：合成 .opj 版本头，驱动库的真实代码路径。
test_package_tests:
  - file: test_origin2.cpp
    description: >-
      OriginFile 构造会读取文件偏移 0x7 的 4 字节 build version 并映射为
      version()（fileVersion/100.0）与对应解析器工厂。测试据此合成 .opj 文件头：
      (1) 头部 2907 → Origin 8.1，校验 version()==8.1 与四个计数接口为 0、
      project() 返回非空工程树、parse() 对截断文件安全返回；
      (2) 头部 2635 → Origin 6.1，校验 version()==6.1；
      (3) 头部 0001（未知版本）必须抛 std::logic_error；
      (4) 不存在的文件路径不得让构造函数抛异常。
    command: "./test_origin2"

# test_origin2.cpp 中的独立断言数（每条 check() 计 1）
assertion_count: 10
