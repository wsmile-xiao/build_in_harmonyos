version: "20110117"
software: liborigin2
status: built
build_date: "2026-09-16"
build_system: cmake

source:
  url: "https://deb.debian.org/debian/pool/main/libo/liborigin2/liborigin2_20110117.orig.tar.gz"
  sha256: "95af95714223474e768573294f2ee9ffffc93bff3d669f4a626acf8e5dc7445e"
  tar_format: tar.gz
  # 上游原始分发渠道（作者主页 soft.proindependent.com、berlios.de）均已失效；
  # 该版本唯一可复现且带公开校验和的来源是 Debian 源码池 orig tarball，
  # 其 sha256 与 liborigin2_20110117-7.dsc 的 Checksums-Sha256 一致。

build:
  system: cmake
  configure_options:
    - BUILD_SHARED_LIBS=<options.shared>
  # 上游只带 qmake 工程 liborigin2.pro（且不使用任何 Qt 库）。OHOS 上没有
  # Qt5/qmake，因此由配方注入 files/CMakeLists.txt（源文件清单与 .pro 的
  # SOURCES 完全一致）复刻其构建语义。
  dependencies:
    - name: boost
      version: 1.90.0.4.1
      role: requires      # 仅头文件使用，链接期无 boost 符号
    - name: tree-hh
      version: 3.18
      role: requires      # 提供 tree.hh（上游 20110117 tarball 缺此头文件）
  cc: clang
  cxx: clang++

patches_applied:
  - patch_file: "patches/0001-use-shared-ptr-instead-of-auto-ptr.patch"
    patch_type: portability
    description: "std::auto_ptr 已从 C++17 移除"
  - patch_file: "patches/0002-fix-ostream-comparison-in-logging.patch"
    patch_type: bugfix
    description: "logging.hpp 中 `*s == std::cout` 应为指针比较"
  - patch_file: "patches/0003-include-algorithm-for-find-if.patch"
    patch_type: portability
    description: "OriginObj.h 缺 <algorithm> 却使用 std::find_if"
  - patch_file: "patches/0004-fix-boost-posix-time-seconds-argument.patch"
    patch_type: portability
    description: "boost::posix_time::seconds 不接受 double（Boost >= 1.67）"
  - patch_file: "patches/0005-fix-operator-precedence-in-parsers.patch"
    patch_type: bugfix
    description: "`h & 0x60 == 0x60` 运算符优先级错误，恒为 h & 1"
  - patch_file: "patches/0006-remove-register-storage-class.patch"
    patch_type: portability
    description: "register 存储类在 C++17 已删除（clang 下是硬错误）"

knowledge_gained:
  - "上游 20110117 tarball 不完整：OriginParser.h 直接 #include \"tree.hh\" 但包内没有该头文件，原样无法编译。仓库已有 tree-hh/3.18 包，作为 Conan 依赖提供，无需 vendoring。"
  - "liborigin2 不依赖 Qt：.pro 里 `QT -= gui core`，源码零 Qt 引用，qmake 只是构建工具。Debian 也是这么认定的（changelog: removed unneccessary dependency on libQt）。"
  - "boost 只作头文件使用：Debian build log 的链接行有 -lboost_date_time，但 readelf -d 的 NEEDED 里没有它（--as-needed 丢弃），本配方本地实测不传任何 -lboost* 也能链接成功，且 nm -D --undefined-only 里无 boost 符号。"
  - "boost 版本下限由 OHOS 决定：boost/core/detail/sp_thread_sleep.hpp 自 1.90 起才带 `!defined(__OHOS__)` 守卫，1.84/1.85 需要包内 BOOST_SP_NO_PTHREAD_SETCANCELSTATE 宏（pthread_setcancelstate 在 OHOS musl 上不存在）。本配方固定 1.90.0.4.1。"
  - "endian 处理是运行时探测（endianfstream.hh: bigEndian = (*(char*)&word) != 0x21）而非编译期宏，因此不涉及字节序宏配置；无 Windows 专有 API。"
  - "上游 OriginFile 构造函数有运行时副作用：每次构造都会在当前工作目录创建 opjfile.log 日志文件（logging::sink），只读目录下静默失败。"
