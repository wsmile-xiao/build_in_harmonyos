software: liborigin2
display: "liborigin2"
description: "Library for reading OriginLab Origin 4.1 - 8.5.1 project files (.opj)"
category: library
homepage: "https://sourceforge.net/projects/liborigin/"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游只提供 qmake 工程，但库本身零 Qt 依赖；OHOS 上没有 Qt5/qmake，配方注入 files/CMakeLists.txt（源文件清单与 .pro 的 SOURCES 一致）复刻构建语义"
    - "上游 20110117 tarball 缺 tree.hh 却直接 include 它，由已有 Conan 包 tree-hh/3.18 提供，不 vendoring"
    - "boost 只作头文件使用，链接期无 boost 符号；必须 >= 1.90（该版本起 boost 自带 __OHOS__ 守卫跳过 pthread_setcancelstate）"
    - "6 个最小源码补丁：auto_ptr→shared_ptr、ostream 指针比较、补 <algorithm>、boost::posix_time::seconds 整型化、运算符优先级、移除 register 存储类"
    - "上游无任何测试/示例，上游测试数为 0（如实申报）；运行期验证全部来自 test_package 的消费者断言"
    - "shared 产物在 OHOS 上需要剥离旧 .codesign 段后重新自签，否则 XPM 拒绝加载"
    - "OriginFile 构造会在当前工作目录创建 opjfile.log（上游行为）"
  common_dependencies:
    - boost
    - tree-hh

versions:
  "20110117":
    status: built
    build_date: "2026-09-16"
    notes: "首次适配。上游原始分发渠道（proindependent 主页 / berlios）已失效，源码取 Debian 源码池 orig tarball（sha256 与 .dsc 一致）。WSL 原生与 WSL OHOS 交叉编译均已通过；Harmony 真机 conan create 与 CI 尚未执行。"
