# 归档不含 configure（非 release tarball），由 patches + build() 内 autoreconf 引导生成。
# 所有补丁为 git a/b 前缀格式 → strip: 1。
sources:
  url: "https://gitlab.gnome.org/GNOME/libgsf/-/archive/LIBGSF_1_14_58/libgsf-1.14.58.tar.gz"
  sha256: "5254e2a571f6ae29f188f51f5c37b66e54a6cf660ec32c9da72c43125db2eca7"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "OHOS 适配 config.guess（拷贝自 automake-1.17 并打 OHOS 补丁，识别 aarch64-*-ohos）"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "OHOS 适配 config.sub（识别 ohos* / linux-ohos 目标，autoreconf/configure 平台检测用）"
