# 版本级 manifest（AI 元数据，CI 不读）
software: libgsf
version: "1.14.58"
status: pending_ci        # published | built | failed | archived | pending_ci（CI 验证前不预标 built）
build_date: "2026-08-13"

source:
  url: "https://download.gnome.org/sources/libgsf/1.14/libgsf-1.14.58.tar.xz"
  sha256: "06e07ea12b7a52b9e316faddfecb640b1717a4875c59f0efb3b0cec1e2ccf35a"
  tar_format: tar.xz     # GNOME 上游 tarball

build:
  system: autotools
  configure_options: ["--disable-gdk-pixbuf", "--disable-introspection", "--disable-thumbnailer", "--disable-tools", "--build=aarch64-linux", "--host=aarch64-linux"]
  dependencies: ["glib/2.84.0.1", "libxml2/2.15.3.1", "zlib/1.3.1.1"]  # 与 conanfile requirements 对齐
  dependencies_note: "R44: 真机预检证明 2.84.0/2.15.3/1.3.1 与 conancenter 同版本冲突——预检 remote 顺序 conancenter 在前,依赖解析到 conancenter 上游配方,其依赖树 tool_require cmake/4.4.2,该 cmake 配方 build() 在 OHOS 无 sources 键报 KeyError 'OHOS'。改用 R37 仓库独有版本 (.1, conancenter 无同版本) 自动解析到 ohpcd 本仓适配配方,与 atk/cairo-gobject/chafa/libgda/netcdf 同款做法。libgsf 适配发布后下游 abiword-plugin-docbook/epub 可解依赖前置。"
  cc: clang
  cxx: clang++

patches_applied: []

test_results:
  type: conan-verify
  total: 5
  passed: 5
  failed: 0
  note: "待真机预检验证: 计划 conan create passed 后, test_package 5/5 ABI 烟雾测试 + 上游 5 个自包含 C 测试程序(test-ole/test-compress/test-csv/test-xml/test-msole-dup)在真机执行。R53: test-iconv(1.14.58 新增)因 OHOS 平台 iconv 对 U+20AC→ISO-8859-1 不返回 EILSEQ(直接映射/替换为单字节), glib g_convert_with_fallback 的 NULL fallback 不触发, 真机实测 22 字节 ≠ 期望 27 字节, 属平台 iconv 语义差异非 libgsf 缺陷, 移出执行集并如实审计(见 test_package/MANIFEST.yml)。上游 14 个 perl 测试脚本因依赖 XML::Parser 模块 + unzip/zipinfo + tools/gsf 二进制在鸿蒙环境不可用,未运行(见 test_package/MANIFEST.yml 审计)。数字以真机预检日志实际输出为准。R54: 真机 compile 阶段 install-libgsf_1_includeHEADERS Error 64 (HMDFS 的 install 带 -m 644 调 chmod 失败, E182/E188 同型), 配方 build() 增加 cp/mkdir install shim + 重定向生成 Makefile 的 INSTALL 变量, 待复跑验证。"

knowledge_gained:
  - "libgsf 是 GNOME 结构化文件库(C),读写 OLE2/ZIP/tar 等格式"
  - "上游依赖: glib>=2.36, libxml2>=2.4.16, zlib(三者 conancenter 均已存量)"
  - "可选依赖: gdk-pixbuf(图形), introspection(GObject 反射)— 用 --disable-* 禁用"
  - "下游通过 libgsf-1.pc pkg-config 发现,abiword-plugin-docbook/epub 依赖此库"
  - "纯 C 库,鸿蒙 arm64 适配难度低,主要工作在 config.guess/sub 补丁与可选依赖禁用"
  - "上游 tests/ 有 34 个 C 测试程序(check_PROGRAMS,链接 libgsf-1.la,可在真机构建运行)+ 14 个 perl 脚本(TESTS,依赖 XML::Parser,鸿蒙不可用)"
  - "R54: 真机 HMDFS 的 install 带 -m 644(INSTALL_DATA 展开)调 chmod 返回 Error 64(E182/E188,libfstconst/adms/libxcb 同款), 配方用 cp/mkdir install shim + sed 生成 Makefile 的 INSTALL 变量重定向解决"
  - "R55: conan 2 要求每个直接依赖都必须被 (cpp_info/components).requires 引用, 否则 package_info() 报 direct dependency not used; libffi/pcre2(R46-R48 解析 pin)一并登记进 cpp_info.requires(pkg::pkg 格式, glib 配方同款)"

