# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 libgsf 1.14.5 自带官方测试套件（tests/ 目录，Automake check 驱动），
# 本次适配未迁移运行（依赖 glib 测试框架与测试数据文件）；test_package
# 为 OHOS 适配自研的 L1 验证。

package: libgsf/1.14.5
homepage: "https://gitlab.gnome.org/GNOME/libgsf"

# 上游官方测试：Automake check（tests/ 目录，Makefile check 目标）
upstream_official_tests:
  - suite: "check"
    count: 50
    kind: "unit"
    command: "make check"

# 构建阶段执行的测试命令：上游 make check（本次适配未运行）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 适配补全测试（自研，非上游）：无（未迁移 make check，消费者验证集中在
# test_package 的 L1 验证）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：链接 libgsf-1 并用 gsf_input_memory_new（needs_free=FALSE，static 缓冲）创建内存输入，gsf_input_read 读回数据并断言内容与 payload 一致，验证库真实可用"
    command: "./test_libgsf"

# 测试断言总数 (实际统计：3 项断言，全部为适配自研断言：
# gsf_input_memory_new 成功、gsf_input_read 返回非 NULL、读回内容与
# payload 一致)
assertion_count: 3
