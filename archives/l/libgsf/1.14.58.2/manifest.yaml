# 版本级 manifest — libgsf 1.14.58.2
# 本仓 4 段「本地修订版本」：复用 1.14.58.1 配方/补丁（上游无 1_14_58_2 tag、
# 官方渠道 404——详见 notes.md 版本性质问题表；编排方 2026-09-23 裁决授权）。
# 原位修订 = 版本号位移、零源码 delta，非上游新版本。

version: "1.14.58.2"
software: "libgsf"

# 编译状态: built（conan-verify 门禁 + 采信轮通过；ohpcd 制品仓无上传凭证 → 不标 published）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitLab release tag 归档；download.gnome.org 在 CI 网络不可达）
  url: "https://gitlab.gnome.org/GNOME/libgsf/-/archive/LIBGSF_1_14_58/libgsf-1.14.58.tar.gz"
  # 源码校验和（归档实测 sha256sum 一致）
  sha256: "5254e2a571f6ae29f188f51f5c37b66e54a6cf660ec32c9da72c43125db2eca7"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools
  # GitLab 归档不含 configure → build() 内 autoreconf --force --install 引导生成
  configure_options:
    - "--disable-gtk-doc"
    - "--disable-nls"
  # 编译依赖列表（格式: name/version；ohpcd 均已发布，W0 preflight 复核通过）
  dependencies:
    - glib/2.84.0.1
    - libxml2/2.15.3.1
    - zlib/1.3.1.1
  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（git a/b 前缀格式，strip: 1）
patches_applied:
  - "patches/0001-config.guess.patch"
  - "patches/0002-config.sub.patch"
  - "patches/0003-gtk-doc.make.patch"
  - "patches/0004-gtkdocize.patch"
  - "patches/0005-m4-ohos-gtkdoc-stub.m4.patch"
  - "patches/0006-configure.ac-gtkdoc.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GitLab release 归档不含 configure，须 build() 内 autoreconf --force --install 引导（需 gtkdocize/m4 stub 补丁配合）"  # knowledge_ref: knowledge/drafts/DRAFT-E689-gnome-gitlab-no-configure-gtkdoc-stub.kv
  - "E007: autotools 平台检测需 OHOS 版 config.guess/config.sub（识别 aarch64-*-ohos / ohos* 目标）"  # knowledge_ref: E007
  - "E074: HMDFS 上 make 并行 jobserver FIFO 被 SELinux 禁止 → make -j1"  # knowledge_ref: E074
  - "E089: automake/aclocal 脚本内 @am_AUTOM4TE@ 占位符未替换 → 环境变量覆盖 AUTOM4TE/SED/AUTOCONF/AUTOHEADER"  # knowledge_ref: E089
  - "E107/E142: 全局 LDFLAGS=-L/usr/local/lib 会优先选中旧静态 glib（缺 g_libintl_*/ffi/pcre2 符号）→ LDFLAGS 用 conan 依赖 libdirs 前置"  # knowledge_ref: E107
  - "E129/E167: HMDFS mktemp 临时目录 setgid 权限问题 → ac_tmp 固定到预创建的 fixed_tmp"  # knowledge_ref: E129
  - "R34: test_package 实质调用 gsf_init + GsfOutfileZip 往返，非空壳测试"  # knowledge_ref: docs/ADAPTATION_GUIDE.md
  - "上游 make check 为 perl 脚本（需 XML::Parser/Expat），OHOS 无 → 平台限制，用消费者 test_package 覆盖"  # knowledge_ref: E265
  - "本仓 4 段版本号 = 本地修订约定：上游无对应 tag/官方渠道 404 时先查同包 4 段先例与 247 目录实存，W0-1 命中可经编排方裁决按『源字节逐字节同源』授权继续，不得包装成上游新版本"  # knowledge_ref: knowledge/drafts/DRAFT-E686-4segment-local-revision-version.kv

