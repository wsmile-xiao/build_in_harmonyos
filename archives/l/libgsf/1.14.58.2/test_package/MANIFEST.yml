# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libgsf/1.14.58.2
homepage: "https://gitlab.gnome.org/GNOME/libgsf"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 中未集成上游测试：
# 上游测试为 perl 脚本（t1000-zip-*.pl / t1100-ole-*.pl / t2000-*.pl / t8000-valgrind-*.pl），
# 强依赖 Perl XML::Parser 模块（需 Expat C 库），OHOS 平台无该模块 → 探索编译阶段实测 14/14 FAIL
# （失败均为 "Can't locate XML/Parser.pm"，属平台测试工具缺失，非库缺陷）。
# 库核心功能已通过 gsf 工具实测验证：createzip/createole/list/cat 全通，zip 可用 python zipfile 解出。
upstream_test_in_build: false
upstream_test_command: "make check -j1"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/t1000-zip-single.pl
    source: libgsf-1.14.58/tests/t1000-zip-single.pl
    description: "ZIP single member 往返测试 (perl + XML::Parser，OHOS 无 XML::Parser → 跳过)"
    command: "perl t1000-zip-single.pl"
  - file: tests/t1001-zip-multiple.pl
    source: libgsf-1.14.58/tests/t1001-zip-multiple.pl
    description: "ZIP multiple members 往返测试 (同上)"
    command: "perl t1001-zip-multiple.pl"
  - file: tests/t1002-zip-aaaa.pl
    source: libgsf-1.14.58/tests/t1002-zip-aaaa.pl
    description: "ZIP aaaa 目录测试 (同上)"
    command: "perl t1002-zip-aaaa.pl"
  - file: tests/t1003-zip-noise.pl
    source: libgsf-1.14.58/tests/t1003-zip-noise.pl
    description: "ZIP 噪声数据测试 (同上)"
    command: "perl t1003-zip-noise.pl"
  - file: tests/t1004-zip-zip64.pl
    source: libgsf-1.14.58/tests/t1004-zip-zip64.pl
    description: "ZIP64 测试 (同上)"
    command: "perl t1004-zip-zip64.pl"
  - file: tests/t1005-zip-nonseekable.pl
    source: libgsf-1.14.58/tests/t1005-zip-nonseekable.pl
    description: "ZIP 不可寻址输出测试 (同上)"
    command: "perl t1005-zip-nonseekable.pl"
  - file: tests/t1100-ole.pl
    source: libgsf-1.14.58/tests/t1100-ole.pl
    description: "OLE 文件往返测试 (同上)"
    command: "perl t1100-ole.pl"
  - file: tests/t1101-ole-many.pl
    source: libgsf-1.14.58/tests/t1101-ole-many.pl
    description: "OLE 多流往返测试 (同上)"
    command: "perl t1101-ole-many.pl"
  - file: tests/t8000-valgrind-zip.pl
    source: libgsf-1.14.58/tests/t8000-valgrind-zip.pl
    description: "ZIP valgrind 内存测试 (OHOS 无 valgrind → 平台限制)"
    command: "perl t8000-valgrind-zip.pl"
  - file: tests/t8020-valgrind-ole.pl
    source: libgsf-1.14.58/tests/t8020-valgrind-ole.pl
    description: "OLE valgrind 内存测试 (OHOS 无 valgrind → 平台限制)"
    command: "perl t8020-valgrind-ole.pl"

# test_package 中自带的测试 (消费者视角验证，R34：实质调用 libgsf API)
test_package_tests:
  - file: test.c
    description: "消费者测试：gsf_init + 版本校验 + GsfOutfileZip 创建/写入/关闭往返"
    command: "./test_libgsf"

# 测试断言总数
assertion_count: 4
