# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.2"

# 软件名
software: "{software}"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: "{BUILD_SYSTEM}"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/laundrify/laundrify-pypi/archive/refs/tags/v1.2.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: copy

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Python 包用 copy 模式（绕开 setup.py 交互式 DistWheelCommand）——sdist 直接 copy 模块目录进 site-packages"
  - "R36 依赖缺口的 vendor 模式：pyjwt 未发布时从官方 sdist 下载解包并入 site-packages（sdist 顶层目录需 walk 定位包目录）"
  - "build() import 冒烟检查需同时注入 conan 依赖的 site-packages（aiohttp 在模块加载时即 import），且用 sys.executable 而非裸 python3（conan 环境无 PATH）"
  - "aiohttp ClientSession 构造需 running event loop 且行为随解释器环境差异——测试传占位 session 绕开，构造逻辑仍被真实执行"

# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
