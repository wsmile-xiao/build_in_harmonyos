schema_version: 1
software: log4cplus
version: 2.2.0.1
upstream_tests:
  - name: ctest
    command: ctest --output-on-failure
    expected: pass
consumer_tests:
  - name: logger_api_smoke
    source: test_package/test.cpp
    api_calls:
      - log4cplus::Logger::getInstance
      - LOG4CPLUS_INFO
    expected: 1/1
test_policy:
  upstream_ctest_registered: true
  upstream_inventory_frozen: true
  cross_build_runtime: target_device_required
