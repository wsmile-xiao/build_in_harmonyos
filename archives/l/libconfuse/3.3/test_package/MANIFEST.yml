# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libconfuse/3.3
homepage: "https://github.com/libconfuse/libconfuse"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（make check 实测 24 项：22 PASS / 2 FAIL）
# FAIL 均为 OHOS 平台限制（非库缺陷）：
#   - quote_before_print: 使用 tmpfile()，HMDFS /tmp 只读 → fopen 返回 NULL
#   - print_filter: 使用 fmemopen()，OHOS musl 实现写缓冲不回读（探针实测 buf 为空）
# 其余 22 项（keyval/suite_*/section_*/include/searchpath/env/annotate 等）全部 PASS
upstream_tests:
  - file: tests/keyval
    source: libconfuse-3.3/tests/keyval.c
    description: "key-value 解析单元测试"
    command: "./tests/keyval"
  - file: tests/suite_single
    source: libconfuse-3.3/tests/suite_single.c
    description: "单 section 测试"
    command: "./tests/suite_single"
  - file: tests/suite_dup
    source: libconfuse-3.3/tests/suite_dup.c
    description: "重复键测试"
    command: "./tests/suite_dup"
  - file: tests/suite_func
    source: libconfuse-3.3/tests/suite_func.c
    description: "函数回调测试"
    command: "./tests/suite_func"
  - file: tests/suite_list
    source: libconfuse-3.3/tests/suite_list.c
    description: "list 语法测试"
    command: "./tests/suite_list"
  - file: tests/suite_validate
    source: libconfuse-3.3/tests/suite_validate.c
    description: "校验器测试"
    command: "./tests/suite_validate"
  - file: tests/suite_ptr
    source: libconfuse-3.3/tests/suite_ptr.c
    description: "指针存取测试"
    command: "./tests/suite_ptr"
  - file: tests/list_plus_syntax
    source: libconfuse-3.3/tests/list_plus_syntax.c
    description: "list+ 语法测试"
    command: "./tests/list_plus_syntax"
  - file: tests/section_title_dupes
    source: libconfuse-3.3/tests/section_title_dupes.c
    description: "section 标题重复测试"
    command: "./tests/section_title_dupes"
  - file: tests/single_title_sections
    source: libconfuse-3.3/tests/single_title_sections.c
    description: "单标题 section 测试"
    command: "./tests/single_title_sections"
  - file: tests/section_remove
    source: libconfuse-3.3/tests/section_remove.c
    description: "section 删除测试"
    command: "./tests/section_remove"
  - file: tests/section_add
    source: libconfuse-3.3/tests/section_add.c
    description: "section 添加测试"
    command: "./tests/section_add"
  - file: tests/section_getopt
    source: libconfuse-3.3/tests/section_getopt.c
    description: "section 选项遍历测试"
    command: "./tests/section_getopt"
  - file: tests/quote_before_print
    source: libconfuse-3.3/tests/quote_before_print.c
    description: "引号转义打印测试（OHOS: tmpfile() 受 HMDFS /tmp 只读限制 FAIL）"
    command: "./tests/quote_before_print"
  - file: tests/include
    source: libconfuse-3.3/tests/include.c
    description: "include 指令测试"
    command: "./tests/include"
  - file: tests/searchpath
    source: libconfuse-3.3/tests/searchpath.c
    description: "搜索路径测试"
    command: "./tests/searchpath"
  - file: tests/env
    source: libconfuse-3.3/tests/env.c
    description: "环境变量展开测试"
    command: "./tests/env"
  - file: tests/ignore_parm
    source: libconfuse-3.3/tests/ignore_parm.c
    description: "参数忽略测试"
    command: "./tests/ignore_parm"
  - file: tests/annotate
    source: libconfuse-3.3/tests/annotate.c
    description: "注释保留测试"
    command: "./tests/annotate"
  - file: tests/empty_string
    source: libconfuse-3.3/tests/empty_string.c
    description: "空字符串测试"
    command: "./tests/empty_string"
  - file: tests/setopt_ptr
    source: libconfuse-3.3/tests/setopt_ptr.c
    description: "setopt 指针测试"
    command: "./tests/setopt_ptr"
  - file: tests/setmulti_reset
    source: libconfuse-3.3/tests/setmulti_reset.c
    description: "setmulti 重置测试"
    command: "./tests/setmulti_reset"
  - file: tests/print_filter
    source: libconfuse-3.3/tests/print_filter.c
    description: "打印过滤器测试（OHOS: fmemopen 缓冲不回读 FAIL）"
    command: "./tests/print_filter"
  - file: tests/modified_flag
    source: libconfuse-3.3/tests/modified_flag.c
    description: "modified 标志测试"
    command: "./tests/modified_flag"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：cfg_init/cfg_parse_fp/cfg_getstr/cfg_getint/cfg_print 全链路"
    command: "./test_libconfuse"

# 测试断言总数
assertion_count: 8
