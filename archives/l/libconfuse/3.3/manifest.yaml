software: libconfuse
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.3"

# 编译状态
# published | built | failed | archived | partial
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-04-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-config.status-tmpdir.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 文件系统 mktemp 创建的目录有权限问题，需要修改 config.status 使用 mkdir 替代"
  - "config.guess 需要添加 HarmonyOS 系统识别"
  - "Makefile 重新生成规则需要禁用以避免 automake 版本不匹配问题"
