software: libconfuse

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.3"

# 编译状态
# published | built | failed | archived | partial
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 release 源，R39）
  url: "https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"

  # 源码校验和（2026-09-10 官方 tarball 实测）
  sha256: "3a59ded20bc652eaa8e6261ab46f7e483bc13dad79263c15af42ecbb329707b8"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表（显式 GNU triplet 跳过 config.guess OHOS 探测，abiword/libfstrm 先例）
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-static"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version；libconfuse 无第三方运行时依赖，仅需 flex 生成 lexer）
  dependencies: []

  # 编译器（OHOS SDK clang，profile ohos-aarch64）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-tmpdir-mkdir.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "config.guess（2018 版）无法识别 HarmonyOS：uname -s=HarmonyOS 时 'cannot guess build type'；bundled config.sub 也无 *-linux-ohos，显式传 --build/--host=aarch64-unknown-linux-gnu 跳过探测（abiword/libfstrm 先例）"
  - "HMDFS 上 configure config.status 用 mktemp 创建的 0700 临时目录被投影为不可写 drwx--S---（E114/E046 平台限制），必须改用 mkdir 创建临时目录"
  - "上游 make check 24 项：22 PASS / 2 FAIL 均为 OHOS 平台限制——quote_before_print 用 tmpfile()（/tmp 只读）、print_filter 用 fmemopen()（musl 实现写缓冲不回读），非库缺陷"
  - "libtool 构建 libconfuse.so（SONAME libconfuse.so.2），库名 confuse，头文件 confuse.h（include_HEADERS）"
