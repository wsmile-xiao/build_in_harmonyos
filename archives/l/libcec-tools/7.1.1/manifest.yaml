version: "7.1.1"
software: libcec-tools
status: built
build_date: "2026-09-26"
build_system: cmake
source:
  url: "https://github.com/Pulse-Eight/libcec/archive/refs/tags/libcec-7.1.1.tar.gz"
  sha256: "7f7da95a4c1e7160d42ca37a3ac80cf6f389b317e14816949e0fa5e2edf4cc64"
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DHAVE_LIBUDEV=ON"
    - "-DHAVE_RANDR=OFF"
    - "-DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON"
  environment:
    SOURCE_DATE_EPOCH: "0"
    UMASK: "022"
  dependencies:
    - "p8-platform/2.1.0"
    - "eudev/3.2.14"
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-include-pkgconfig-udev-headers.patch"
knowledge_gained:
  - "libcec 7.1.1 honors SOURCE_DATE_EPOCH to skip configure-time whoami/hostname probes; the later DISABLE_BUILDINFO option is absent in this release."
  - "Mapping CMAKE_SYSTEM_NAME to Linux preserves libcec's expected versioned SONAME for its runtime loader while the Conan OHOS profile still selects the target compiler and sysroot."
  - "CMake install rewrites ELF runtime paths after link and invalidates .codesign; re-sign installed ELF files and preserve their executable bits before testing or publishing."
