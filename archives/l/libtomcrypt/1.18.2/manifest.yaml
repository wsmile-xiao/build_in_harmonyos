software: libtomcrypt
version: "1.18.2"
status: built
build_system: makefile
build_date: '2026-09-01'
source:
  url: https://github.com/libtom/libtomcrypt/releases/download/v1.18.2/crypt-1.18.2.tar.xz
  # SHA-256 computed from the downloaded tarball; the official release
  # .hashes file ships SHA-512 and the local sha512 matches it too.
  sha256: 96ad4c3b8336050993c5bc2cf6c057484f2b0f9f763448151567fbab5e767b84
  tar_format: tar.xz
  license: WTFPL
  homepage: https://github.com/libtom/libtomcrypt
build:
  system: makefile
  configure_options:
  - PREFIX=$DEFAULT_PREFIX
  env_vars:
  - CC
  - AR
  - RANLIB
  - CFLAGS
  - EXTRALIBS
  dependencies:
  - gmp/6.3.0
  cc: clang
  cxx: clang++
  make_target: library
  upstream_test: make test && ./test
  upstream_tests_executed: 21
patches_applied: []
patch_classification: []
knowledge_gained:
- libtomcrypt 1.18.2 上游为纯 GNU makefile（makefile 静态库 / makefile.shared libtool 共享库），无 configure。
- 上游正式自测是单一 `test` 可执行文件（tests/test.c），注册 21 个套件入口（store/rotate/misc/mpi/cipher_hash/mac/modes/der/pkcs_1×5/rsa/dh/ecc/dsa/katja/file/multi/prng），按套件粒度统计 passed/failed/nop，最终输出 "SUCCESS: passed=20 failed=0 nop=1"。katja_test nop 是上游默认（LTC_MKAT 在 tomcrypt_custom.h 默认注释掉），非 OHOS 问题。无 test_standalone 目标（那是 1.17 及以前）；demos/timing.c 是 benchmark 不是 correctness 测试。
- MPI provider 可选：无 provider 时所有 PK 套件 nop。选 gmp/6.3.0（ohpcd 已发布 OHOS aarch64 包，API 匹配）；libtommath 未发布于 ohpcd 且 1.3.0 的 mp_to_radix 新增第 5 参数 size_t *written 与 1.18.2 调用点不兼容，需 patch，故弃用。
- 构建零 patch：CC/AR/RANLIB/CFLAGS/EXTRALIBS 全部命令行传入即可交叉编译；makefile 的 RANLIB 默认取 $(CROSS_COMPILE)ranlib，显式传入即可。
- musl/clang15 无需任何源码修改；-Wall -Wextra 警告存在但仅 1 warning 级别，不阻塞。
