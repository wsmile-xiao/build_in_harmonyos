# test_package/MANIFEST.yml
# Upstream and consumer-test declarations for CI quality gates.

package: libtomcrypt/1.18.2
homepage: "https://github.com/libtom/libtomcrypt"

# Upstream formal self-test: `make test` produces a single `test`
# executable (tests/test.c) that runs all 21 registered suites
# sequentially (store/rotate/misc/mpi/cipher_hash/mac/modes/der/
# pkcs_1 x5/rsa/dh/ecc/dsa/katja/file/multi/prng) and prints a final
# "SUCCESS: passed=<p> failed=<f> nop=<n> duration=..." summary line.
# It IS executed in build() (see conanfile.build) on the OHOS aarch64
# target. With gmp as the MPI provider every suite is expected to run
# (no nop). The upstream count unit is the SUITE (21 entries), not the
# internal per-algorithm assertions.
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "./test"
upstream_tests:
  - name: "test (make test)"
    command: "./test"
    description: "21 registered suites in tests/test.c; per-suite pass/fail/nop + final SUCCESS/FAILURE summary; exit code nonzero on any failure"

test_package_tests:
  - file: test.c
    description: "Public-API tests: SHA-256 KAT (FIPS 180-4), AES-128 ECB KAT + round-trip (NIST SP 800-38A F.1.1), base64 KAT (RFC 4648), yarrow PRNG, CRYPT_BUFFER_OVERFLOW error path"
    command: "ctest --output-on-failure"

# check() assertion counts in test.c:
#  1 find_hash + 1 hash_memory OK + 2 sha256 KATs
#  + aes_setup/encrypt/KAT/decrypt/round-trip (5)
#  + base64 encode KAT + decode KAT (2)
#  + find_prng/start/add_entropy/ready/read x2/differ (7)
#  + buffer-overflow error + error_to_string (2) = 20
assertion_count: 20
