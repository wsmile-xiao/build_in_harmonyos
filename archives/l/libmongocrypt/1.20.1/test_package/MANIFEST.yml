# test_package/MANIFEST.yml
# 上游官方测试声明（CI 的 L0e 强制要求此文件；规范见 docs/TEST_QUALITY_SPEC.md）
# 所有数字来自 2026-09-19 真机 HarmonyOS PC（HongMeng Kernel 1.12.0 / aarch64）
# conan create 的实际输出，取数命令逐条附在下面，可复算。

package: libmongocrypt/1.20.1
homepage: https://github.com/mongodb/libmongocrypt

# 上游测试命令（CTest；已在 conanfile.py 的 build() 中真实执行，不是只在 test_package 里跑）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "LD_LIBRARY_PATH=<build/Release> ctest --output-on-failure"

# 上游 ctest 条目（ctest -N 实测 8 条）
upstream_tests:
  - file: test-mongocrypt
    source: libmongocrypt-1.20.1/test/*.c（64 个测试源文件）
    description: >-
      单进程顺序执行的上游主套件。源码安装点 347（INSTALL_TEST 334 + INSTALL_TEST_CRYPTO 13，
      取数 `grep -rhoE "INSTALL_TEST(_CRYPTO)?\(" test/*.c | wc -l`）；按用例名去重为 295 个，
      另有 6 个在 main() 中以字面名安装 → 301 个；本次配置实际安装并跑完 301-7=294 个，
      `begin`/`end` 配对一致、test-mongocrypt 退出码 0。
    command: "ctest -R '^mongocrypt$'"
  - file: test_kms_request
    source: libmongocrypt-1.20.1/kms-message/test/test_kms_request.c
    description: >-
      vendored kms-message 的 HTTP 请求签名/解析套件，40 个用例
      （取数 `grep -cE "^[[:space:]]*RUN_TEST[[:space:]]*\(" test/test_kms_request.c` = 41，
      其中 1 行是 RUN_TEST 宏本身 → 40）。全部通过。
    command: "ctest -R '^test_kms_request$'"
  - file: mlib.path / mlib.str / mc-mlib.int128 / mc-dec128 / example-state-machine / example-state-machine-static
    source: src/mc-mlib/{path,str}.test.c、src/mc-mlib/int128.test.cpp、src/mc-dec128.test.cpp、test/example-state-machine.c
    description: >-
      其余 6 个 ctest 条目。5 个通过；mc-dec128 在 Decimal128 未启用时按上游自身逻辑打印
      `@@ctest-skip@@` 并返回 0（见 src/mc-dec128.test.cpp:76），不是失败也不是本包屏蔽。
    command: "ctest -N"

# 本次配置下没有安装/没有运行的上游用例，逐条给出**具体技术原因**（不允许只写「未运行」）
not_applicable:
  - cases: 4 个 *_decimal128 range payload 用例（insert/find × 精度）
    reason: >-
      test-mongocrypt-ctx-encrypt.c 中它们被 `#if MONGOCRYPT_HAVE_DECIMAL128_SUPPORT()` 包住。
      该宏在 -DMONGOCRYPT_ENABLE_DECIMAL128=OFF 时为 0；OHOS 上必须关闭，因为上游 vendored 的
      third-party/IntelRDFPMathLib20U2 在 LIBRARY/float128/architecture.h:716 直接
      `#error "Architecture must be specified"`（其架构表没有 OHOS/aarch64 分支，实测编译即失败）。
    system_capability: Intel DFP(_Decimal128) 后端
  - cases: _test_crypto_hooks_unset、test_is_crypto_available_with_crypto_prohibited
    reason: >-
      以 `INSTALL_TEST_CRYPTO(..., CRYPTO_PROHIBITED)` 注册，运行器只在 DISABLE_NATIVE_CRYPTO
      构建中安装它们；本包启用了原生 OpenSSL 后端（依赖制品仓 openssl/3.5.6），
      `mongocrypt_is_crypto_available()` 为真，故按上游设计不参与。
    system_capability: 不适用（配置互斥，非能力缺失）
  - cases: _test_no_log
    reason: >-
      test-mongocrypt-log.c 的 `INSTALL_TEST(_test_no_log)` 被
      `#if defined(__GLIBC__) || defined(__APPLE__)` 包住；OHOS 使用自有 libc，
      实测 sysroot 的 clang 预定义里没有 __GLIBC__（只有 __OHOS__/__linux__），故不编译。
    system_capability: OHOS libc 非 glibc
  - cases: 在线 KMS 用例（Azure/GCP/真实 mongod）
    reason: >-
      由 `-DENABLE_ONLINE_TESTS=OFF` 排除：这些用例需要真实 KMS 端点与 mongod 实例，
      上游同时据此不构建 csfle 工具与 test_kms_azure_online / test_kms_gcp_online 目标；
      离线可跑的 KMS 协议路径（local KMS、kms-response 解析、状态机）都在上面 294 个用例内实跑。
    system_capability: 需要外部服务，非平台限制

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: >-
      鸿蒙特有 23 项消费者断言：版本三元组、原生 OpenSSL 后端在位、状态对象读写自洽、
      binary 视图语义、96 字节 local master key 的 FLE1 datakey 真实加密封装
      （AES-256-CBC + HMAC-SHA-512，走制品仓 openssl/3.5.6）、产物首 4 字节小端长度与文档
      长度自洽（确认是真 BSON 而非空壳），以及两条负向路径（错长度 master key、缺 master key）。
    command: "./test_libmongocrypt"

assertion_count: 23
