software: libmongocrypt
version: "1.20.1"
status: pending_ci  # published | pending_ci | built
build_system: cmake
homepage: https://github.com/mongodb/libmongocrypt
license: Apache-2.0
source_url: https://codeload.github.com/mongodb/libmongocrypt/tar.gz/refs/tags/1.20.1
source_format: tar.gz
dependencies:
  required:
    - openssl/3.5.6 (制品仓已发布；上游 include(FindOpenSSL) 只认 OPENSSL_ROOT_DIR)
  vendored_by_upstream:
    - mongo-c-driver/2.3.3#src/libbson (cmake/FetchMongoC.cmake 的 MONGOC_FETCH_TAG_FOR_LIBBSON)
    - kms-message (上游仓库内自带目录)
tests:
  upstream: "ctest 8 条目 / test-mongocrypt 实跑 294 用例 + test_kms_request 40 用例，退出码 0"
  ohos_specific: "test_package/test.c 23 项消费者断言（含真实 FLE1 local datakey 加密封装）"
patches:
  - 0001-kms-message-obj-openssl-include.patch
  - 0002-mcr_dll-path-via-dladdr-on-ohos.patch
notes: "OHOS libc 无 dlinfo/RTLD_DI_LINKMAP 且 dlopen 句柄不可解释，mcr_dll_path 改用 dlsym+dladdr；Intel DFP 无 OHOS 架构分支故 Decimal128 关闭；Conan 的 CMakeToolchain 不写 CMAKE_SYSTEM_NAME 使 CMake 落到 uname 的 HarmonyOS（无对应 Platform 模块）→ build-tree 无 RPATH，配方显式给 CMAKE_SYSTEM_NAME=OHOS 并以 LD_LIBRARY_PATH 兜底。"
