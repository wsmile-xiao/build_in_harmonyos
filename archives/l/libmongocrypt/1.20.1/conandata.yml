sources:
  libmongocrypt:
    url:
      - "https://codeload.github.com/mongodb/libmongocrypt/tar.gz/refs/tags/1.20.1"
      - "https://github.com/mongodb/libmongocrypt/archive/refs/tags/1.20.1.tar.gz"
    sha256: "ebbbac83988d1831c9ebb7e7fc87a26abf236ac2eaa6eb451ec888a44dc12829"
  # libmongocrypt 1.20.1 自身把 libbson 以 vendored 方式构建:
  # cmake/FetchMongoC.cmake 的 MONGOC_FETCH_TAG_FOR_LIBBSON = 2.3.3, etc/purls.txt 亦记
  # pkg:github/mongodb/mongo-c-driver@2.3.3?#src/libbson。预先解包到 mongo-c-driver/ 并
  # 传 MONGOCRYPT_MONGOC_DIR, 让 CMake 不再走 FetchContent 联网。
  mongo-c-driver:
    url:
      - "https://codeload.github.com/mongodb/mongo-c-driver/tar.gz/refs/tags/2.3.3"
      - "https://github.com/mongodb/mongo-c-driver/archive/refs/tags/2.3.3.tar.gz"
    sha256: "1ca94a2f706e8eab5c9478f1725c69bff23d2692e4a1e476bce093245c8efd5d"

patches:
  "1.20.1":
    - patch_file: "patches/0001-kms-message-obj-openssl-include.patch"
      patch_description: "kms_message_obj 是 OBJECT library，拿不到消费方的头文件路径，交叉编译时 openssl/sha.h 找不到"
      patch_type: "portability"
    - patch_file: "patches/0002-mcr_dll-path-via-dladdr-on-ohos.patch"
      patch_description: "OHOS libc 没有 dlinfo/RTLD_DI_LINKMAP，且 dlopen 句柄是与 dlpi_addr 不对应的脱敏指针；改用 dlsym + dladdr 反查已加载库路径，实现上游的 mcr_dll_path"
      patch_type: "portability"
