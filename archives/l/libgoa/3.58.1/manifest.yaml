knowledge_gained:
  - "多制品构建的交付面必须从构建系统导出全集（meson `introspect --installed`；CMake 用 install_manifest.txt）再与配方交付清单逐项 diff；任务名、公开头或“上游只有一个库”的推断都会漏面，未交付面必须在 notes/manifest 显式申报（不交付什么/为什么/公开面是否完整）" # knowledge_ref: DRAFT-13206-libgoa-goa-module-identity-and-backend-delivery-surface
  - "交付身份按上游构建变量 api_name 对齐四个面（共享库名/SONAME、pkg-config filebase、CMake/typelib 命名空间、安装头子目录），不另造 alias .pc；可选第二共享库（goa-backend-1.0：独立 SONAME + 独立头目录 goabackend/）在 src/goa/*.h 里没有 GOA_BACKEND_ENABLED 守卫，公开头里不可见，只能靠枚举发现" # knowledge_ref: DRAFT-13206-libgoa-goa-module-identity-and-backend-delivery-surface
  - "OHOS 加载器只加载 .codesign 有效的 ELF（E077）：meson install 的 depfixer 就地改写 .dynstr 会让链接期签名失效，package() 需移除旧签名后用 binary-sign-tool -selfSign 1 重签并恢复权限" # knowledge_ref: DRAFT-13206-libgoa-goa-module-identity-and-backend-delivery-surface

