# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
#
# 上游测试来源：gnome-online-accounts 3.58.1 的官方发布 tarball 内不含任何
# 测试目录或 meson test 目标（对全部 meson.build 检索 test( 无命中；顶层只有
# data/ src/ doc/ po/ 与 subprojects/ 的 wrap 文件），因此 conanfile.py 的
# build() 不集成上游测试，这里如实声明，不做假声明。

package: libgoa/3.58.1
homepage: "https://gitlab.gnome.org/GNOME/gnome-online-accounts"

# 上游测试命令（用于 meson test --list 分析）：上游没有测试套件
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_goa_consumer.c
    description: "消费者契约测试：链接 libgoa-1.0.so.0，调用版本全局量 goa_major_version、goa_check_version()、goa_error_quark()，验证 GoaClient/GoaObject/GoaAccount/GoaManager 的 GType 注册，并真实执行 goa_client_new_sync() 的 D-Bus 路径"
    command: "./test_goa_consumer"

# 测试断言总数：12 = 恒定执行 10 条（goaconfig 版本宏 2 + 版本全局量/检查 3 +
# 错误域 1 + GType 注册 3 + goa_client_new_sync 返回检查 1）+ 仅成功分支才
# 有条件执行的 2 条（GOA_IS_CLIENT / object manager）。真机 OHOS 无会话总线，
# 走 error 分支，实跑打印 "ok   - " 10 条 + info 1 条、失败 0 条；
# 条件分支的 2 条不计入本次实跑通过率。
assertion_count: 12
