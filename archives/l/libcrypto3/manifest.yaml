software: libcrypto3
display: "libcrypto3 (OpenSSL libcrypto component)"
description: "OpenSSL libcrypto component — cryptographic primitives library (AES/RSA/SHA/HMAC/RAND)"
category: crypto
homepage: "https://www.openssl.org/"
license: "Apache-2.0"
build_system: custom-perl

ohos_adaptation:
  key_points:
    - "libcrypto3 = OpenSSL source packaged with only libcrypto exposed (no libssl)"
    - "使用 Perl Configure（大写C），而非 autotools 的 ./configure"
    - "3.5.x 内置 linux-aarch64 target，无需自定义平台配置"
    - "no-asm 禁用汇编优化（ARM64汇编在 RSA-PSS 签名验证有 bug）"
    - "no-shared 强制静态构建（R26: libcrypto 是系统同名库）"
    - "使用 -j2 构建：HMDFS 并行 make 会触发 .d.tmp mv 竞争导致随机失败"
    - "--with-rand-seed=getrandom 规避 OHOS(musl) 不提供 __fd_chk 的问题"
    - "继承 openssl 3.5.8.1 的 musl fd_set 有界实现补丁"
    - "核心加密功能完全可用（AES/RSA/SHA/HMAC/RAND）"
  common_dependencies:
    - perl

versions:
  "3.5.7":
    status: built
    build_date: "2026-09-15"
    notes: "首次适配：OpenSSL 3.5.7 源码打包 libcrypto 组件（不含 libssl）。复用 openssl 3.5.8.1 的 musl fd_set 补丁。"
