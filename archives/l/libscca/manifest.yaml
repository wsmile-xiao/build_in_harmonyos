software: libscca
display: "libscca — Windows Prefetch File Library"
description: "访问 Windows 预取文件（SCCA/PF）格式的 C 库，含 sccainfo 终端工具"
category: forensics
homepage: "https://github.com/libyal/libscca"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "GNU config.guess 不识别 HarmonyOS，需内联添加 HarmonyOS 检测分支（E007）"
    - "config.sub 需添加 ohos-linux/ohos* OS 模式支持（E007）"
    - "HMDFS 下 umask 077 导致临时目录不可写，替换为 umask 022（E011）"
    - "关闭 Python 绑定与 NLS，零外部依赖，捆绑 libc* 内部库随包编译"
  common_dependencies: []

versions:
  "20250915":
    status: building
    build_date: "2026-09-18"
    source_url: "https://github.com/libyal/libscca/releases/download/20250915/libscca-alpha-20250915.tar.gz"
