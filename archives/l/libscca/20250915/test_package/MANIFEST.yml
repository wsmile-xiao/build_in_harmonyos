# test_package/MANIFEST.yml — libscca 20250915
package: libscca/20250915
homepage: "https://github.com/libyal/libscca"

# Upstream ships an automake test suite executed via `make check`.
upstream_tests_exist: true
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/test_library.sh
    source: libscca-alpha-20250915/tests/test_library.sh
    description: "Library unit tests: 16 scca_test_* binaries (compressed_block, file, file_header, file_information, notify, tools handles)"
    command: "make check"
  - file: tests/test_tools.sh
    source: libscca-alpha-20250915/tests/test_tools.sh
    description: "Tools unit tests: sccatools helper binaries exercised via test_tools.sh"
    command: "make check"
  - file: tests/test_sccainfo.sh
    source: libscca-alpha-20250915/tests/test_sccainfo.sh
    description: "sccainfo end-to-end test on bundled test images"
    command: "make check"

test_package_tests:
  - file: test.c
    description: "Consumer test: get_version, access_flags, file_initialize, check_file_signature rejects non-Prefetch, file_free"
    command: "./test_libscca"

assertion_count: 5
