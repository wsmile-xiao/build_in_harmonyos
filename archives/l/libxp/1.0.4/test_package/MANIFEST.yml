# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libxp/1.0.4
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"
upstream_tests: []
upstream_test_notes: >
  libXp 1.0.4 的 Makefile.am / src/Makefile.am / man/Makefile.am 里没有任何
  check_PROGRAMS、TESTS 或 check-local 定义，`make check` 是空目标；
  release tarball 中也只有 src/*.c 与 man/*.man，不含任何测试源码。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libxp.c
    description: >
      链接 libXp 并真实执行其唯一一族不需要 X server 的公开接口
      （XpSetLocaleHinter / XpGetLocaleHinter / XpGetLocaleNetString），
      覆盖默认 hinter、%locale% 关键字替换、描述优先、以及 OHOS/musl 下
      被拒绝的 locale 不得被当成生效值上报（鸿蒙特有场景，场景四）。
    command: "./test_libxp"

# 鸿蒙特有测试 (rule12)
ohos_specific_tests: 1
ohos_specific_description: >
  test_libxp.c 场景四：OHOS 用 musl，镜像无 locale 数据目录，setlocale()
  对 "C"/"POSIX" 以外的请求通常返回 NULL 并保持原 locale。三条断言都写成
  与运行环境无关的不变量：net string 必须非空、必须等于 C 库**实际生效**
  的 locale、且「请求值是否被接受」必须与「net string 是否等于请求值」一致
  —— 即不得把被 C 库拒绝的 "en_US.UTF-8" 当成生效值上报，同时被接受时
  必须跟随。

# 测试断言总数 (近似值, 用于质量评估)
# 场景一 4 条 + 场景二 5 条 + 场景三 1 条 + 场景四 3 条（OHOS 分支）
assertion_count: 13
