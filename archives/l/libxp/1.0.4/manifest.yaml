software: libxp
display: "libXp"
version: "1.0.4"
upstream_name: libXp
upstream_version: "1.0.4"
status: built
build_system: autotools
compile_date: 2026-09-20
target_platform: aarch64-unknown-linux-ohos
issue: TBD

source:
  url: "https://xorg.freedesktop.org/archive/individual/lib/libXp-1.0.4.tar.xz"
  sha256: "1f19e3b8e82a34a8fd9889a7d9af0abe8588cb03fb57c37c569634cf3b9df1a4"
  tar_format: tar.xz
  version_mapping: "Conan libxp/1.0.4 与上游 libXp 1.0.4 一一对应，产物为 libXp.so.6.2.0（libXp.la 的 -version-number 6:2:0）。"

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "lt_cv_deplibs_check_method=pass_all"
  environment:
    - "XPRINT_CFLAGS / XPRINT_LIBS 由 Conan 依赖目录生成（PKG_CHECK_MODULES 的 AC_ARG_VAR 逃生口）"
  dependencies:
    - "libx11/6.4.0"
    - "libxext/6.4.0.1"
    - "libxau/[>=1.0.11]（范围而非钉死：libxcb 一侧的 libxau 诉求在 1.0.11/1.0.12 间变过）"
    - "xorgproto/2025.1"
  cc: clang
  cxx: clang++

patches_applied: []

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml, and test_package/MANIFEST.yml"
    - "official source sha256 verified locally (archive/ 与 releases/ 两份 tarball 同为 1f19e3b8e82a34a8fd9889a7d9af0abe8588cb03fb57c37c569634cf3b9df1a4)"
    - "conan list 'libx11/6.4.0#*' -r=ohpcd -> found"
    - "conan list 'libxext/6.4.0.1#*' -r=ohpcd -> found"
    - "conan list 'libxau/1.0.11#*' -r=ohpcd -> found"
    - "conan list 'xorgproto/2025.1#*' -r=ohpcd -> found"
    - "conan list 'libxp/1.0.4#*' -r=ohpcd -> not found before this recipe"
    - "头文件可用性逐条核对（下载制品仓二进制后实查）：Print.h/Printstr.h 在 xorgproto/2025.1 include/X11/extensions；Xauth.h 在 libxau/1.0.11；extutil.h 在 libxext/6.4.0.1；Xatom.h/Xos.h/Xos_r.h/Xthreads.h/Xfuncproto.h 在 xorgproto/2025.1"
    - "符号可用性核对：libXp 引用的 XauReadAuth/XauFileName/XauDisposeAuth（libxau）与 XextCreateExtension/XextFindDisplay（libxext）均由依赖包导出"
    - "printproto 不可满足性实证：xorgproto/2025.1 的 share/pkgconfig 下 29 个模块 .pc 中没有 printproto.pc"
    - "configure 的逃生口核对：生成的 configure 第 19277/19294 行为 if test -n \"$XPRINT_CFLAGS\"/\"$XPRINT_LIBS\"，非空即不调用 pkg-config"
    - "头文件产出核对：libXp 1.0.4 的 make install 只落地 lib/libXp.so*、share/man/man3/*.3、lib/pkgconfig/xp.pc，package_folder 下没有 include/ —— 故 package_info() 显式 cpp_info.includedirs = []（CI #53038 的 CMake generate 报 `Imported target libxp::libxp includes non-existent path .../p/include` 即由此而来）"
  remote:
    - "待 CI 流水线实跑（见本 PR 的 CI-BOT 结论）"
  pending:
    - "PR validation / REL upload"

knowledge_gained:
  - "libXp 1.0.4 自身**不安装任何头文件**（SUBDIRS 只有 src/man，make install 落地 lib/libXp.so*、share/man/man3/*.3、lib/pkgconfig/xp.pc，package_folder 下没有 include/）。Conan 的 cpp_info.includedirs 默认是 [\"include\"]，指向不存在的路径会让 CMakeDeps 写进 INTERFACE_INCLUDE_DIRECTORIES，消费者 find_package 在 generate 阶段直接报 `Imported target ... includes non-existent path`。对这类「纯运行库、头文件全来自依赖」的包必须显式 cpp_info.includedirs = []。"
  - "libXp 1.0.4 的 configure 要求 pkg-config 模块 printproto，而 printproto 并入 xorgproto 后没有任何包再提供 printproto.pc —— 该 PKG_CHECK_MODULES 在当代发行版上必然失败。"
  - "PKG_CHECK_MODULES 生成的 configure 带 AC_ARG_VAR(XPRINT_CFLAGS)/AC_ARG_VAR(XPRINT_LIBS)，把两者设成非空即可完全绕过 pkg-config，无需提供 printproto.pc。"
  - "libxau/1.0.11 发布的 libXau.la 中 libdir= 指向构建期临时目录、dependency_libs 残留 -L/…/usr/local/lib，libtool 用 -lXau 时会读它并按 libdir 找 .so。"
  - "上游 xp.pc.in 的 Requires: printproto 会毒化消费者，安装后需改写为实际存在的模块。"
  - "上游无测试套件：Makefile.am/src/man 三处均无 check_PROGRAMS/TESTS，make check 为空目标。"
  - "同一传递依赖被两个上游包以不同精确版本引入时，消费者侧钉死任一侧都会在制品仓侧版本变动后立刻变成 version conflict；对这类「与图中其它约束共享」的库应写版本范围（libxau/[>=1.0.11]），让 Conan 采纳另一侧的约束。"
