package: libgff/2.0.0
homepage: "https://github.com/COMBINE-lab/libgff"

# 上游测试声明
# 清点证据（v2.0.0 release tarball）：
#   tar -tzf libgff-2.0.0.tar.gz | sed 's|^[^/]*/||' | cut -d/ -f1 | sort -u
#   -> .gitignore BoostLicense.txt CMakeLists.txt Readme.md include
#      libgffConfig.cmake.in src
# CMakeLists.txt 中无 enable_testing() / add_test() 注册项；
# src/TestGFFParse.cpp 是需外部 GFF 输入文件的手动工具，未注册为测试，
# 且 tarball 未随附示例注释文件。故上游静态测试数 N_static = 0。
upstream_check_command: "无（上游无注册测试目标）"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libgff.cpp
    description: "消费者测试：GffReader 解析内联 GFF3，断言转录本/基因 ID、exon 数与属性访问"
    command: "./test_libgff"

# 测试断言总数 (CHECK 宏计数，运行期输出)
assertion_count: 7
