# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libgff/2.0.1
homepage: "https://github.com/COMBINE-lab/libgff"

# 上游测试命令（CMake 项目无 check 目标；上游测试程序为 TestGFFParse）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: src/TestGFFParse.cpp
    source: libgff-2.0.1/src/TestGFFParse.cpp
    description: "GFF/GTF 解析测试：读取 GFF3 输入并统计转录本特征（本地实测：构造 1 gene+1 mRNA+2 exon 输入，输出 tx1，退出码 0）"
    command: "./TestGFFParse <gff-input>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：调用 GffReader 解析 GFF3 并断言转录本 ID/数量"
    command: "./test_libgff"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2