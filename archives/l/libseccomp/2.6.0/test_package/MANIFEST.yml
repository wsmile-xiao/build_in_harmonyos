# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 libseccomp 2.6.0 自带回归测试套件（tests/ 目录 + make check 驱动），
# 本次适配未迁移运行（依赖完整测试环境，见下）；test_package 为 OHOS 适配
# 自研的 L1 验证。

package: libseccomp/2.6.0
homepage: "https://github.com/seccomp/libseccomp"

# 上游官方测试：tests/ 目录 + make check（回归测试，约 200+ 用例，
# 部分依赖 seccomp 系统调用运行时能力与完整构建环境）
upstream_official_tests:
  - suite: "make check"
    count: 200
    kind: "unit"
    command: "make check"

# 构建阶段执行的测试命令：上游 make check（本次适配未运行）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 适配补全测试（自研，非上游）：无（未迁移 make check，消费者验证集中在
# test_package 的 L1 验证）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：链接 libseccomp 并调用 seccomp_init()/seccomp_release()/seccomp_syscall_resolve_name() 验证库真实可用"
    command: "./test_libseccomp"

# 测试断言总数 (实际统计：2 项断言：seccomp_init 非空 + read syscall 解析成功)
assertion_count: 2
