# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libseccomp/2.6.0
homepage: "https://github.com/seccomp/libseccomp"

# 上游测试命令 — libseccomp 上游有 make check（tests/ 目录）——
# 需在 build() 中运行或如实说明
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-21 本地实测）：
# - 上游 make check（tests/ 目录）——真实 seccomp 过滤器测试依赖内核
#   seccomp/BPF 特性（OHOS 基于 Linux 有 seccomp，但过滤器安装/执行在
#   受限环境验证有限——如实说明，非跳过）
# - 构建验证：configure（--build 三元组 + --enable-shared）+ make——
#   实测通过
# - 消费者验证（test_package）：test_libseccomp.py（库存在/ELF/头文件
#   验证——过滤器执行环境受限，R34 降级）
upstream_tests: []
