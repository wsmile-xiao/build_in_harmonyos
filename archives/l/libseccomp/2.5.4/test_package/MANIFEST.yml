# test_package MANIFEST — libseccomp 2.5.4
# 描述 test_package 中的测试内容（CI L0e 门禁要求）

test_package_tests:
  - file: conanfile.py
    description: "编译 test_seccomp.c 链接 -lseccomp 并运行：真实调用 seccomp_version()（struct scmp_version）与 seccomp_api_get()"
    command: "conan test"

upstream_tests:
  suite: "make check"
  notes: |
    libseccomp 上游 make check（tests/ 目录）中真实 seccomp 过滤器测试依赖内核
    seccomp/BPF 特性；OHOS 基于 Linux 有 seccomp，但过滤器安装/执行在受限沙箱
    验证有限。sim 系列纯用户态回归测试可运行；arch-syscall-check 的 OHOS syscall
    表差异如实记录，不阻塞构建。消费者验证（test_package）通过编译链接并运行
    纯用户态 API 完成（R34）。
