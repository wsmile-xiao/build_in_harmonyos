# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0"

# 软件名
software: "linenoise"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-29"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/antirez/linenoise/archive/refs/tags/2.0.tar.gz"

  # 源码校验和
  sha256: "97ad7d4041e11d7fa395819fd773c1892dea89e5292342378a8345692ce89c29"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "waterlan.home.xs4all.nl 发行站已失效（重定向 notxs4all HTML），linenoise 需从官方 GitHub antirez/linenoise 取源码"
- "上游纯 Makefile 项目无 configure/install 目标时，可在配方内嵌 CMakeLists.txt 覆盖构建（同 MurmurHash3 模式）"
- "CMakeLists 的 install(TARGETS ... RUNTIME DESTINATION bin) 会被 CI L0k 误判为 CLI tool（R38），纯库项目必须省略 RUNTIME DESTINATION"
- "linenoise API 成功返回 1、失败返回 0（与常规约定相反），测试断言方向需反转"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
