# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: linenoise/2.0
homepage: "https://github.com/antirez/linenoise"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "TERM=xterm ./linenoise-test"

# 上游实际运行的测试程序
upstream_tests:
  - file: linenoise-test.c
    source: linenoise-2.0/linenoise-test.c
    description: "VT100 模拟终端测试套件（72 个用例；OHOS arm64 设置 TERM=xterm 后本地真实 PTY 实测 72 项全部通过）"
    command: "./linenoise-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 冒烟测试：linenoiseHistorySetMaxLen + linenoiseHistoryAdd"
    command: "./test_linenoise"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
