# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: linenoise/1.0
homepage: "https://github.com/antirez/linenoise"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 1.0 tag 的上游 Makefile 仅含 linenoise_example 目标（example.c），
# 无独立测试程序/测试源文件（2.0 才新增 linenoise-test.c），故上游测试列表为空。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 冒烟测试：linenoiseHistorySetMaxLen + linenoiseHistoryAdd + HistorySave/Load 持久化链路"
    command: "./test_linenoise"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
