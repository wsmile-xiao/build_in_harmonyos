software: lzsa
display: "lzsa"
description: "lzsa 是字节对齐 LZ 压缩器, 提供高解压速度和紧凑解压器 (~116 字节快速路径), 仅 CLI 工具"
category: compress
homepage: "https://github.com/emmanuel-marty/lzsa"
license: CC0-1.0, Zlib
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 使用 CC=clang / CFLAGS=... 简单 = 赋值, 命令行可覆盖, 零补丁 (E007 不适用)"
    - "CC= 通过 make 命令行显式传入 OHOS arm64 clang, 覆盖 Makefile 硬编码的 CC=clang (命令行赋值优先于 Makefile 内 = 赋值)"
    - "CFLAGS 覆盖: 丢弃上游 -fomit-frame-pointer (无害但冗余), 保留 -O3 + -Isrc/libdivsufsort/include -Isrc"
    - "make -j1 (R9/E074: HMDFS jobserver FIFO EPERM)"
    - "命令行工具: 软件级 commands.json 声明 (R38), 二进制安装到 bin/lzsa"
    - "仅 CLI, 无库目标: Makefile 无 lib/.a/.so 目标, cpp_info.libs=[]"
  common_dependencies: []

versions:
  "1.4.1":
    status: built
    build_date: "2026-08-13"
