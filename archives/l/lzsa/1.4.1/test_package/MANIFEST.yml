# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lzsa/1.4.1
homepage: "https://github.com/emmanuel-marty/lzsa"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: true

# 上游测试审计 (源码: lzsa-1.4.1.tar.gz, sha256 c65ca1e6a43696f4ca5edc2c98229fba1044806bd21bc2a8ce4b867dc9cfc45c)
upstream_test_audit:
  source_tarball: "lzsa-1.4.1.tar.gz"
  source_sha256: "c65ca1e6a43696f4ca5edc2c98229fba1044806bd21bc2a8ce4b867dc9cfc45c"
  top_level_files:
    - Makefile           # 定义 test 目标: ./lzsa -test (内置自测); 无 check 目标
    - src/lzsa.c         # 主程序源, 内含 -test 自测代码路径 (压缩/解压往返校验)
    - src/lzsa.h         # 纯头文件
    - src/libdivsufsort/ # 后缀数组排序库 (Zlib 许可), 编译时静态链接
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "make check / ctest 目标"
    - "find . -name '*test*' (全树)"
  scan_result: "Makefile 定义 test 目标运行 ./lzsa -test (内置自测); 全树 find -name '*test*' 仅命中 Makefile test 目标 + lzsa -test 命令行选项; 无独立 tests/ 目录或测试源文件"
  make_check_output: "无 make check 目标; make test 执行 ./lzsa -test 内置自测 (压缩→解压往返校验)"
  reason: "lzsa 1.4.1 为纯 CLI 压缩工具, Makefile 定义 test 目标运行内置自测 (./lzsa -test): 二进制内置压缩/解压往返校验代码, 不依赖外部测试框架。无独立 tests/ 目录、无 TESTS/check_PROGRAMS 目标; 功能验证由 test_package 真实执行 lzsa 二进制 (-test 自测 + 格式2/格式1 压缩/解压往返 cmp 内容一致) 完成"

# 上游测试命令 (make test 运行 ./lzsa -test 内置自测)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile
    source: lzsa-1.4.1/Makefile
    description: "内置自测: make test → ./lzsa -test (压缩/解压往返校验)"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的二进制
test_package_tests:
  - file: test_lzsa.sh
    description: "功能测试: lzsa -test 自测 + 格式2/格式1 压缩→解压往返 cmp 内容一致 + 压缩率健全性检查"
    command: "bash test_lzsa.sh"
  - file: conanfile.py
    description: "Conan test() 入口, 执行 test_lzsa.sh 并输出 HMBS 机器证据标记 (test_package discovered=4/passedCount=4 + 上游 self_test/1)"
    command: "conan test test_package"

# 测试断言总数 (test_lzsa.sh 的 4 个真实断言, 与 HMBS_TEST_PACKAGE_RESULT discovered=4 一致)
# 1. lzsa -test 自测通过
# 2. 格式2 (默认) 压缩→解压→cmp 内容一致
# 3. 格式1 (-1) 压缩→解压→cmp 内容一致
# 4. 压缩文件小于原始文件 (健全性检查)
assertion_count: 4
