software: lzsa

# ============================================================
# 必须字段
# ============================================================

version: "1.4.1"
status: published
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/emmanuel-marty/lzsa/archive/refs/tags/1.4.1.tar.gz"
  sha256: "c65ca1e6a43696f4ca5edc2c98229fba1044806bd21bc2a8ce4b867dc9cfc45c"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options:
    - "LDFLAGS=-static"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/add-version-help.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lzsa 使用纯 Makefile 而非 autotools，无 configure/install/check 目标"
  - "Makefile 中 LDFLAGS= 赋空值会覆盖环境变量，需通过 make 命令行参数传递 LDFLAGS=-static"
  - "lzsa main() 不处理 --version/--help 参数，当作文件名导致 exit 100，需补丁添加处理"
  - "test_package 应使用完整二进制路径而非依赖 conanrun PATH"
  - "conan create 从 GitHub 下载源码超时，conanfile.py source() 添加本地 tarball 回退"
