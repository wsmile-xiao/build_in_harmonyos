version: "2.7.4"
software: libaudit
status: built
build_date: "2026-09-15"
build_system: autotools
conan_ref: "libaudit/2.7.4"
w0_status: built

source:
  url: "https://github.com/linux-audit/audit-userspace/archive/refs/tags/audit-2.7.4.tar.gz"
  sha256: "6e5e302476b4625c71d65e39032b3d2827f43c9e21bdd9072607080e523f4d89"
  tar_format: tar.gz

build:
  build_system: autotools
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--without-python"
    - "--without-python3"
    - "--without-golang"
    - "--without-libcap-ng"
    - "--disable-zos-remote"
    - "--disable-listener"
    - "--disable-shared"
  dependencies: []
  tool_dependencies:
    - "automake/1.18"
    - "libtool/2.5.4"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-audisp-audispd.c.patch"
  - "0002-audisp-plugins-prelude-audisp-prelude.c.patch"
  - "0003-audisp-plugins-remote-queue.c.patch"
  - "0004-audisp-plugins-remote-test-queue.c.patch"
  - "0005-audisp-plugins-zos-remote-zos-remote-plugin.c.patch"
  - "0006-auparse-auparse.c.patch"
  - "0007-auparse-interpret.c.patch"
  - "0008-lib-gen_tables.c.patch"
  - "0009-lib-libaudit.h.patch"
  - "0010-src-auditctl.c.patch"
  - "0011-src-auditd-reconfig.c.patch"
  - "0012-src-auditd.c.patch"
  - "0013-src-ausearch-common.h.patch"
  - "0014-src-ausearch-lol.c.patch"
  - "0015-src-ausearch-lookup.c.patch"
  - "0016-src-autrace.c.patch"
  - "0017-src-delete_all.c.patch"

ohos_notes:
  netlink_reality: >-
    socket(PF_NETLINK, SOCK_RAW, NETLINK_AUDIT) constants exist in the
    OHOS SDK sysroot but the kernel/SELinux policy denies the socket to
    the app sandbox (EACCES); audit_open() fails gracefully with the
    documented negative-fd error surface.  Netlink-mediated tests are
    exempted on that basis (declared in the PR body); pure-library
    lookups/parsing are fully functional and covered.

artifacts:
  - reports/quality-report.md
