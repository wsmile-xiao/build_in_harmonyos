package: "libaudit/2.7.4"
homepage: "https://github.com/linux-audit/audit-userspace"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_tests:
  - id: "lib-lookup_test"
    source: "lib/test/lookup_test.c"
    command: "make check (lib)"
    description: >-
      syscall/field/machine name<->value table lookups via libaudit.
      PASS on aarch64 OHOS (the audit 4.1.2 archive had this FAIL on
      aarch64 because of i386-table assumptions; 2.7.4's lookup_test
      passes after the header-guard patches).
  - id: "src-ilist_test"
    source: "src/test/ilist_test.c"
    command: "make check (src)"
    description: ausearch-int internal list unit test.
  - id: "src-slist_test"
    source: "src/test/slist_test.c"
    command: "make check (src)"
    description: ausearch-string internal list unit test.
  - id: "audisp-remote-test-queue"
    source: "audisp/plugins/remote/test-queue.c"
    command: "make check (audisp/plugins/remote)"
    description: >-
      file/memory queue implementation test (EEXIST/EBUSY locking,
      wraparound, resize). Requires a writable TMPDIR: /tmp is
      read-only on OHOS (E002) — the patched template honours
      $TMPDIR with /data/local/tmp fallback.
  - id: "auparse-test"
    source: "auparse/test/auparse_test.c"
    command: "make check (auparse, custom check target)"
    description: >-
      10-section auparse walkthrough (iterate/search/compound/regex/
      buffer+file feed) diffed against auparse_test.ref, plus the
      list-of-lists test diffed via auditd_raw.sed. The custom check
      target prints "Auparse Test Passes" on success.
  - id: "auparse-lol-test"
    source: "auparse/test/auparselol_test.c"
    command: "make check (auparse, custom check target)"
    description: >-
      list-of-lists event stream reordering test over test3.log
      (part of the same custom check target as auparse_test).

upstream_zero_evidence: >-
  (not applicable — the build system registers tests, see above; the
  audit-testsuite the task prompt mentions is a SEPARATE repository
  and is not part of the audit-userspace 2.7.4 release tarball)

test_package_tests:
  - id: "consumer-contract"
    source: "consumer_tests.c"
    command: "consumer_tests"
    description: >-
      Exercises the installed package through its public API split in
      two halves: (a) pure-library helpers asserted with real values —
      audit_detect_machine, x86_64 syscall name<->number round trips,
      field name<->value tables, msg-type tables,
      audit_rule_fieldpair_data rule construction, libauparse record
      parsing (field read-back + interpretation), ausearch expression
      matching; (b) the OHOS reality check for the netlink-mediated
      surface — audit_open() must return a negative fd (kernel denies
      NETLINK_AUDIT to the app domain) rather than crash, matching the
      documented error surface.

test_counting:
  upstream_independent_total: 4
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

# Runtime assertion accounting (consumer_tests.c, verified by source audit):
#   23 numbered CHECKs:
#     machine detection      1
#     syscall tables         3
#     field tables           3
#     msg-type tables        2
#     rule construction      1
#     OHOS netlink surface   1
#     auparse parsing        5
#     ausearch expression    3
#     (init fallthroughs fold into the section CHECKs above)
test_case_count: 1
assertion_count: 23
