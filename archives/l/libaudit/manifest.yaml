software: libaudit
name: libaudit
display: "libaudit (Linux Audit System client library)"
description: "Linux 审计子系统客户端库（libaudit 内核 netlink 通信 + 查找表；libauparse 审计日志解析；含 auditctl/auditd/ausearch/aureport 等管理工具）"
category: library
homepage: "https://github.com/linux-audit/audit-userspace"
license: LGPL-2.1-or-later (libraries), GPL-2.0-or-later (tools)
build_system: autotools

ohos_adaptation:
  key_points:
    - "linux/socket.h(uapi) 与 sys/socket.h 的 sockaddr_storage 重定义：在任一头被包含前定义 _UAPI_LINUX_SOCKET_H 守卫 + 补 __kernel_sa_family_t typedef（audit 4.1.2 经验泛化到所有先含 linux/net.h 的编译单元）"
    - "audit netlink 内核形态（W0 实测）：NETLINK_AUDIT 常量在 sysroot 存在，但内核/SELinux 策略对 app 域拒绝该 socket（EACCES）；audit_open() 按文档语义优雅返回负 fd，netlink 控制面测试据此豁免申报，纯库查找/解析面全覆盖"
    - "strndupa 用宏实现而非 static inline：clang 内联器对内联函数内 alloca 打 llvm.lifetime 标记，返回后立即失效（实测 audit_strsplit 返回乱码）；宏展开到调用点保持栈帧存活"
    - "posix_fallocate 返回码语义（POSIX 规定返回错误编号、errno 不保证；glibc 恰好双设）：OHOS HMDFS 不支持分配返回 EACCES 且 errno 未动，上游用 errno 判断会读到残留值（实测 ERANGE 34）——改查返回码+回退 ftruncate"
    - "lld 默认 -fno-common：ausearch-common.h 头文件 tentative 定义 event_node_list 变重复符号 → __OHOS__ 下改 extern"
    - "OHOS libc 缺 glibc 扩展：rawmemchr→memchr(SIZE_MAX)、strndupa 宏、pthread_cancel→pthread_kill(4.1.2 同款)、fd_set/PATH_MAX 显式 include"
    - "tag 归档不含 configure：autoreconf -f -i 引导（tool_requires automake/1.18 + libtool/2.5.4，E443）；E114 umask 077 剥除；E074 make -j1；三元组钉死 aarch64-unknown-linux-ohos"
    - "上游 make check 全过：lookup_test(ilb)+ilist/slist(src)+test-queue(audisp/remote)+auparse 双测试（4.1.2 归档时 lookup_test 在 aarch64 失败，2.7.4 修复后通过）"
  common_dependencies: []

versions:
  "2.7.4":
    status: built
    build_date: "2026-09-15"
    recommended: true
