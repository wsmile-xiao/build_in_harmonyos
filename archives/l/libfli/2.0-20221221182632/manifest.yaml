# 版本级 manifest — libfli 2.0-20221221182632
# 上游: indilib/indi-3rdparty 的 libfli/ 子目录
#       官方仓库 https://github.com/indilib/indi-3rdparty
#       上游未为 libfli 单独打 tag；Debian Astronomy Team 以 orig.tar.gz 发布该
#       子目录快照，版本 2.0+20221221182632（时间戳即 git 提交时刻 2022-12-21
#       18:26:32），与本任务版本号一一对应（conan 版本号把 '+' 规范化为 '-'）。

version: "2.0-20221221182632"
software: libfli
status: built
build_date: "2026-09-28"
build_system: cmake

source:
  url: "https://deb.debian.org/debian/pool/main/libf/libfli/libfli_2.0%2B20221221182632.orig.tar.gz"
  sha256: "41d1bf856f43c860c033285559f4081a780a3b8525dd4c7eebfee67d9f42711c"
  tar_format: tar.gz
  upstream_homepage: "https://github.com/indilib/indi-3rdparty"
  upstream_license: "LICENSE.BSD (BSD-3-Clause)"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DUDEVRULES_INSTALL_DIR=lib/udev/rules.d"
  dependencies:
    - libusb/1.0.27
    - libindi/2.2.2.1
  cc: clang
  cxx: clang++

artifacts:
  - include/libfli.h
  - lib/libfli.a
  - lib/udev/rules.d/99-fli.rules
  - licenses/LICENSE.BSD

patches_applied:
  - patches/0001-FindINDI.cmake.patch
  - patches/0002-CMakeLists.txt.patch

patch_classification:
  - file: 0001-FindINDI.cmake.patch
    type: auto
    platform_only: false
    guard: "not_required"
    rationale: >
      版本号正则回移上游 indi-3rdparty master 的同一处修复，兼容 INDI 2.x
      indiversion.h 中带引号的 `#define INDI_VERSION "2.2.2"`。与平台无关，
      不含任何平台宏（Linux 上构建同样需要），因此不适用 R8 平台宏约束。
  - file: 0002-CMakeLists.txt.patch
    type: auto
    platform_only: false
    guard: "not_required"
    rationale: >
      上游 `ADD_LIBRARY(fli SHARED …)` 硬编码共享库，打包器无法请求静态构建。
      改为遵循标准 `BUILD_SHARED_LIBS` 开关，变量未定义时保持原 shared-only
      行为。纯构建系统语义修正，不含平台宏，Linux 上同样适用。

knowledge_gained:
  - "E092: CMake 不识别 HarmonyOS 平台，需 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64"
  - "Conan CMakeToolchain 默认 CMAKE_FIND_PACKAGE_PREFER_CONFIG=ON，会 shadow 项目自带 Find*.cmake 的旧式变量；须在 toolchain 末尾强制 OFF（libindi/2.2.2.1 同款）"
  - "上游 CMakeLists 不把 FindUSB1.cmake 找到的 USB1_INCLUDE_DIRS 加进 include 路径（依赖系统 /usr/include），Conan 布局下 <libusb-1.0/libusb.h> 找不到，必须显式注入 libusb include 根目录"
  - "FindINDI.cmake 2022 快照的版本正则无法匹配 INDI 2.x 的 INDI_VERSION \"x.y.z\" 引号形式 → FATAL_ERROR failed to detect INDI version；回移上游 master 修复"
  - "UDEVRULES_INSTALL_DIR 默认绝对路径 /lib/udev/rules.d 在 CI 沙箱不可写，须重定向到包内私有 prefix（R49）"
  - "unix/linux/libfli-parport.c 的 <asm/param.h> 在 OHOS sysroot 中经 -isystem <sysroot>/usr/include/aarch64-linux-ohos 解析成功，无需额外适配"
  - "CMake >= 4.0 移除 < 3.5 兼容，cmake_minimum_required(VERSION 3.0) 直接硬报错；CMAKE_POLICY_VERSION_MINIMUM 必须走 cmake.configure(cli_args=[...]) 的命令行 -D（写进 conan_toolchain.cmake 的普通变量不跨 CMake 内部 system scope 存活）"
  - "OHOS/aarch64 上产出静态库必须显式 CMAKE_POSITION_INDEPENDENT_CODE=ON：CMake 对静态 target 默认关闭 PIC，否则下游 clang -shared --whole-archive 会报 R_AARCH64_ADR_PREL_PG_HI21 cannot be used against symbol 'devices'，静态库无法被下游 .so 吸收"
  - "GNU ar 在 OHOS/LLVM 工具链下会为 .o 成员使用 '//' 长名表 + '/<offset>' 名字引用，解析 ar 归档时必须解析三种长名格式（plain 'name/'、BSD '#1/len'、GNU '/offset'）"
