# conandata.yml — libfli 2.0-20221221182632
# 源码 = indilib/indi-3rdparty 仓库 libfli/ 子目录的官方快照。
# 上游未为 libfli 单独打 tag，Debian Astronomy Team 以 orig.tar.gz 形式发布
# 该子目录快照，版本号 2.0+20221221182632（时间戳 = git 提交时刻），
# 是该版本的权威可下载源；conan 版本号把 '+' 规范化为 '-'。

sources:
  # The '+' is written literally rather than percent-encoded as %2B on purpose.
  # CI's pre-download step rewrites every source URL to a file:// path built from
  # the URL's last segment; Conan then percent-decodes that path, so an encoded
  # %2B in the URL would be looked up on disk as a literal '+' while the cached
  # file name keeps the '%2B' -> FileNotFoundError. Both spellings resolve on
  # deb.debian.org (verified: HTTP 200, identical 134270 bytes / sha256).
  url:
    - "https://deb.debian.org/debian/pool/main/libf/libfli/libfli_2.0+20221221182632.orig.tar.gz"
  sha256: "41d1bf856f43c860c033285559f4081a780a3b8525dd4c7eebfee67d9f42711c"
  # strip_root 由 conanfile.py 的 get(..., strip_root=True) 统一传入，
  # 此处不再声明（否则 get() 会收到重复关键字参数）。

patches:
  - patch_file: "patches/0001-FindINDI.cmake.patch"
    patch_description: "FindINDI.cmake 版本号正则回移上游 master 修复：兼容 INDI 2.x indiversion.h 的 INDI_VERSION \"2.2.2\" 引号形式（否则 FATAL_ERROR failed to detect INDI version）"
    patch_type: "portability"
  - patch_file: "patches/0002-CMakeLists.txt.patch"
    patch_description: "ADD_LIBRARY 不再硬编码 SHARED，改为遵循标准 BUILD_SHARED_LIBS 开关（未定义时保持原 shared-only 行为），使打包器可请求静态库"
    patch_type: "portability"
