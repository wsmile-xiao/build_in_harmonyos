version: "3.0.16"
software: "libmodsecurity"
status: built
build_date: "2026-09-13"
build_system: "autotools"
conan_ref: "libmodsecurity/3.0.16"

source:
  url: "https://github.com/owasp-modsecurity/ModSecurity/releases/download/v3.0.16/modsecurity-v3.0.16.tar.gz"
  sha256: "739be3c71b1939f14e91afe1eeae654acbd440da11bd29790458840bc315b4c0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--with-pcre2"
    - "--with-yajl"
    - "--without-curl"
    - "--without-libxml"
    - "--without-lmdb"
    - "--without-lua"
    - "--without-ssdeep"
    - "--without-geoip"
    - "--without-maxmind"
    - "--disable-examples"
  dependencies:
    - pcre2/10.40
    - yajl/2.1.0
  cc: clang
  cxx: clang++

patches_applied: ["patches/0001-unique_id-musl-ifh.patch"]

knowledge_gained:
  - "Release tarball bundles configure and libinjection/mbedtls; no autoreconf needed"
  - "Minimal R36 closure (pcre2+yajl); resource-gated JSON tests filtered from TESTS override"
