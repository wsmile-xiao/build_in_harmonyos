package: libmodsecurity/3.0.16
homepage: "https://github.com/owasp-modsecurity/ModSecurity"

upstream_check_command: "make -j1 check TESTS=\"<filtered>\""
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - file: test/unit/unit.cc
    source: modsecurity-v3.0.16/test/unit/unit.cc
    description: "Unit test binary (unit_tests): operators, transformations, engine helpers"
    command: "./unit_tests <case>"
  - file: test/regression/regression.cc
    source: modsecurity-v3.0.16/test/regression/regression.cc
    description: "Regression driver (regression_tests): replays test-cases JSON suites"
    command: "./regression_tests <case>"
  - file: test/test-suite.in
    source: modsecurity-v3.0.16/test/test-suite.in
    description: "Automake TESTS list (about 260 JSON files: regression + secrules-language-tests + unit)"
    command: "make check"

test_package_tests:
  - file: test_modsecurity.c
    description: "C API lifecycle: init/whoAmI/rules-add/transaction phases/intervention/logging/cleanup"
    command: "./test_modsecurity"
  - file: test_waf_block.c
    description: "WAF deny rule (ARGS:testparam @contains test -> 403) triggers disruptive intervention"
    command: "./test_waf_block"

assertion_count: 19

upstream_tests_exist: true
upstream_test_audit: >
  Checked owasp-modsecurity/ModSecurity v3.0.16 tag tree via GitHub API:
  test/ holds unit/ (unit.cc/unit_test.cc), regression/ (regression.cc),
  test-suite.in (TESTS+= list of about 260 JSON files covering
  test/test-cases/regression/*.json, secrules-language-tests/operators/*.json
  and transformations/*.json, plus test/test-cases/unit/*.json), test-suite.sh
  driver and custom-test-driver. build() runs the full automake harness
  (`make check`) with a TESTS override that excludes only JSON files whose
  `"resource"` requires a feature this recipe disables
  (curl/lua/libxml2/ssdeep/geoip/maxmind); excluded files are not counted in
  discovered and are declared here instead of impersonating passes. The two
  network cases (config-secremoterules.json, operator-ipMatchFromFile.json
  https subtest) fall under the curl resource and are excluded for the same
  reason. No `no_tests` claim is made.
