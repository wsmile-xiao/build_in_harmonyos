software: libmodsecurity
display: "ModSecurity v3 (libmodsecurity)"
description: "Open source cross-platform web application firewall (WAF) library"
category: network
homepage: "https://github.com/owasp-modsecurity/ModSecurity"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools release tarball already contains generated configure and bundled libinjection/mbedtls submodules"
    - "Minimal R36-compliant closure: only pcre2 and yajl (both published); curl/libxml2/lmdb/lua/ssdeep/geoip/maxmind explicitly disabled"
    - "Upstream make check (test-suite.in regression + unit suites) runs in build() with machine-evidence marker"
  common_dependencies:
    - pcre2
    - yajl

versions:
  "3.0.16":
    status: built
    build_date: "2026-09-13"
    conan_ref: "libmodsecurity/3.0.16"
    note: "First HarmonyOS PC adaptation; awaiting device preflight evidence"
