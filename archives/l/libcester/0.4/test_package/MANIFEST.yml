# test_package/MANIFEST.yml
# 上游官方测试声明文件（L0e 要求）
# libcester 0.4 = header-only C 单元测试框架（单头文件 include/exotic/cester.h）

package: libcester/0.4
homepage: "https://github.com/exoticlibraries/libcester"

# 上游测试命令（test/CMakeLists.txt：GLOB test_*.c 逐一 clang/gcc 编译并运行）
upstream_check_command: "cd test && cmake -S . -B build && cmake --build build --target cester_test"

# conanfile.py build() 中未集成上游测试（header-only 无编译阶段）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（57 个 test_*.c 独立测试程序，每个自带自动生成 main）
upstream_tests:
  - file: test/test_assert_int.c
    source: libcester-0.4/test/test_assert_int.c
    description: "整数断言（cester_assert_cmp_int/assert_int_* 系列）"
    command: "./build/test_assert_int_gcc"
  - file: test/test_assert_char.c
    source: libcester-0.4/test/test_assert_char.c
    description: "字符断言"
    command: "./build/test_assert_char_gcc"
  - file: test/test_assert_string.c
    source: libcester-0.4/test/test_assert_string.c
    description: "字符串断言"
    command: "./build/test_assert_string_gcc"
  - file: test/test_mock.c
    source: libcester-0.4/test/test_mock.c
    description: "函数 mock（-Wl,--wrap）"
    command: "./build/test_mock_gcc"
  - file: test/test_mem_leak_detection.c
    source: libcester-0.4/test/test_mem_leak_detection.c
    description: "内存泄漏检测"
    command: "./build/test_mem_leak_detection_gcc"
  - file: test/test_mock_function.c
    source: libcester-0.4/test/test_mock_function.c
    description: "函数级 mock"
    command: "./build/test_mock_function_gcc"
  - file: test/test_assert_equal.c
    source: libcester-0.4/test/test_assert_equal.c
    description: "通用相等断言"
    command: "./build/test_assert_equal_gcc"
  - file: test/test_assert_null.c
    source: libcester-0.4/test/test_assert_null.c
    description: "NULL 断言"
    command: "./build/test_assert_null_gcc"
  - file: test/test_assert_true_false.c
    source: libcester-0.4/test/test_assert_true_false.c
    description: "true/false 断言"
    command: "./build/test_assert_true_false_gcc"
  - file: test/test_skip_macro.c
    source: libcester-0.4/test/test_skip_macro.c
    description: "CESTER_SKIP 跳过宏"
    command: "./build/test_skip_macro_gcc"

# test_package 消费者验证（仅用安装后的公开头文件与 API）
test_package_tests:
  - file: test.c
    description: "消费者视角验证：include <exotic/cester.h>，运行 4 个真实断言 suite"
    command: "./test_libcester"
  - file: test_ohos.c
    description: "鸿蒙专项验证：OHOS 工具链编译 + POSIX 运行时 + musl libc 行为"
    command: "./test_libcester_ohos"

# 上游断言总数（57 个 test_*.c 独立测试程序，均为上游真实用例）
assertion_count: 57