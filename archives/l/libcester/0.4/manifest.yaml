# 知识沉淀
# ============================================================

knowledge_gained:
- "libcester 为 header-only C 单元测试框架（单头文件 include/exotic/cester.h），无构建系统、无外部依赖，采用 header-library 配方（conanfile-headeronly 变体 A），消费者以 #include <exotic/cester.h> 使用"
- "上游 57 个 test_*.c 独立测试程序自带自动生成 main（无需 CESTER_MAIN），每个文件即一个独立测试套件，通过 test/CMakeLists.txt 以 clang/gcc 多变体逐一编译运行"
