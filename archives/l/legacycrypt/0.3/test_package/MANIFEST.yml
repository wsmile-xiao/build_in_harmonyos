# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: legacycrypt/0.3
homepage: "https://github.com/tiran/legacycrypt"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python tests.py"

upstream_tests:
  - name: tests.py（stdlib unittest 套件——sdist 自带；8 个用例）
    count: "8"
    description: "上游测试实测（rule 4，分母=全部 8 用例）：7 passed / 1 failed（test_types）/ 0 skipped——失败原因：libxcrypt（默认 failure-tokens 构建）对无效/空 setting 返回 '*0' 失败令牌而非 NULL，上游 assertIs(crypt('',''), None) 按 glibc 行为预期写死；系算法库行为差异，非移植缺陷（补丁只改 find_library fallback，不改上游其余逻辑）。SHA512/SHA256/BLOWFISH/MD5/CRYPT 五算法全部真实往返通过"

test_package_tests:
  - file: test_consumer.c
    description: "test() 现场编译的 C 消费者（硬验收门禁）：把 libxcrypt shared 包链为自身 DT_NEEDED（exec 时 NEEDED 加载——OHOS CI worker 唯一放行的加载路径），跑真实 crypt_r() 往返断言（失败令牌检查 + 二次 crypt_r(hash) 相等），rc!=0 即测试失败"
    command: "conanfile.py test() 内 clang 编译并 self.run 执行"
  - file: test_legacycrypt.py
    description: "R34：legacycrypt.py 存在于 site-packages + compile() 语法门禁 + import + 真实 crypt() 往返与 mksalt（methods 探测 SHA512/SHA256/BLOWFISH/MD5/CRYPT）。导入失败时输出 E502 风格逐条取证行（errno + OSError 尾部），创建 E488 copy-rewrite 新鲜副本并直接 dlopen 探测，再以显式 LD_LIBRARY_PATH（副本目录优先）re-exec 恢复一次（守卫防循环）；仅当所有已探测候选（含新鲜副本）无一加载成功且均为 loader-policy 拒绝才降级为显式 WARN——判定为 EACCES/EPERM errno，或（官方 worker 二轮取证，返修轮 3）errno=None 且 dlerror 消息含 Permission denied（dlerror 不暴露底层 errno，strerror 与 EACCES 同义；CI 沙箱 dlopen 边界，numpy 1.26.4 已合入先例，此时由 test_consumer.c 承担真实验证）；任一 dlopen 探测成功或副本证据缺失均不降级，其余任何失败（No such file、格式错误等）以非 0 退出，不放宽到任意 OSError（R9 禁止伪通过）"
    command: "python3 test_legacycrypt.py <package> <libxcrypt_libdir>"

assertion_count: 6
