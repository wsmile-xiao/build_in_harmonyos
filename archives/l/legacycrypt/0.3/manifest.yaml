knowledge_gained:
  - category: L1
    content: "上游 tests.py（8 用例）build() 集成实测：7 passed / 1 failed——唯一失败 test_types 为 libxcrypt 行为差异：libxcrypt 默认 failure-tokens 构建对空/无效 setting 返回 '*0' 而非 NULL（glibc 行为），上游 assertIs(crypt('',''), None) 按后者写死；SHA512/SHA256/BLOWFISH/MD5/CRYPT 五算法 saltedcrypt/rounds 往返全部通过"
    reason: "rule 4 实测回填（分母=全部 8 用例）"
  - category: L1
    content: "ctypes 依赖库适配要点：OHOS（musl）上 ctypes.util.find_library() 对任何库都返回 None（无 ldconfig/gcc），需小补丁 fallback 直接 CDLL(确切 SONAME)；SONAME 以依赖包实际产物为准（libxcrypt/4.5.2 shared 产物 SONAME=libcrypt.so.2，NEEDED 仅 libc.so）；conan 依赖图不会为 ctypes 动态加载自动注入 LD_LIBRARY_PATH——build() 与 test_package 均需显式注入依赖 lib/ 路径；ctypes 加载需依赖以 shared=True 构建（制品仓 libxcrypt 仅 static 二进制，shared 由 --build=missing 源码构建）"
    reason: "legacycrypt 0.3 适配实测——同源教训可复用于其他 ctypes 纯 Python 库"
  - category: L1
    content: "官方 conan-pr-check worker test_package 阶段 ctypes CDLL('libcrypt.so.2') 失败（本机权威 CI 同脚本 PASS）：根因为 CI 沙箱 dlopen 平台边界——worker 拒绝一切进程启动后对用户目录 .so 的 dlopen（EACCES，与签名/位置/权限位无关，exec 时 DT_NEEDED 仍放行；E502 机理 + numpy 1.26.4 notes.md 多 worker 穷尽实验佐证；官方 worker 的 /data/service/hnp/bin/python3 本设备不存在，无法本机复现）。成熟修法（numpy 已合入先例，本轮复用）：test 期现场编译 C 消费者链接依赖 .so 作 DT_NEEDED（exec 时路径）跑真实功能断言作硬门禁 + python import 降为显式 WARN（E502 风格逐条取证行 + re-exec copy-rewrite 恢复仍失败且全为 EACCES/EPERM 时），其余失败仍非 0 退出。注意：musl dlopen 不按 SONAME 去重已加载对象——绝对路径预加载满足不了后续 CDLL('SONAME')，恢复需 re-exec 让加载器在进程启动时重走搜索路径"
    reason: "返修轮 2（官方 PR #12961 CI 失败）根因调查与修复实测——可复用于一切经 ctypes/FFI dlopen 用户目录 .so 的包在官方 worker 的 test_package"
