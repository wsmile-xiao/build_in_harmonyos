package: libgkarrays/2.1.0
homepage: "http://crac.gforge.inria.fr/gkarrays/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: tests/testPairedEnd.cpp
    source: libgkarrays_2.1.0+dfsg.orig.tar.xz/tests/testPairedEnd.cpp
    description: "Paired-end index consistency checks over offline dataset/*.fa"
    command: "./testPairedEnd"
  - file: tests/testVariableFixed.cpp
    source: libgkarrays_2.1.0+dfsg.orig.tar.xz/tests/testVariableFixed.cpp
    description: "Variable-length vs fixed-length index equivalence checks"
    command: "./testVariableFixed"
  - file: tests/testConsistency.cpp
    source: libgkarrays_2.1.0+dfsg.orig.tar.xz/tests/testConsistency.cpp
    description: "Read index internal consistency checks (22 TAP assertions)"
    command: "./testConsistency"

test_package_tests:
  - file: test_package.cpp
    description: "Version, isDiscarded filtering and SolArray set/get round-trip"
    command: "test_libgkarrays"

assertion_count: 6
