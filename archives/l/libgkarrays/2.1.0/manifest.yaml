software: libgkarrays
version: "2.1.0"
status: built
build_system: autotools
build_date: "2026-09-15"
source:
  url: "https://deb.debian.org/debian/pool/main/libg/libgkarrays/libgkarrays_2.1.0+dfsg.orig.tar.xz"
  sha256: "bb73beac8d9c3e6b4acfebba325904a98653357f8373ec60ed3614ff6f04bb84"
  tar_format: tar.xz
  note: "Upstream GForge retired; Debian/Ubuntu dfsg repack (identical bytes, .dsc verified). Strips only generated autotools files; regenerated via autoreconf -fi."

build:
  system: autotools
  language: "C++"
  configure_options:
    - "--disable-dependency-tracking"
    - "--disable-shared"
    - "--enable-static"
    - "--build=aarch64-unknown-linux-gnu"
  dependencies:
    - "zlib/1.3.1"
  build_requirements:
    - "autoconf/2.72"
    - "automake/1.18"
    - "libtool/2.5.4"
  cc: clang
  cxx: clang++

upstream_tests:
  framework: "automake-check"
  command: "make check"
  total: 3
  inventory:
    - "testPairedEnd"
    - "testVariableFixed"
    - "testConsistency"
  datasets: "tests/dataset/*.fa (offline, shipped in tarball)"
  rationale: "Upstream TESTS in tests/Makefile.am; each binary runs TAP assertions over the bundled FASTA fixtures. No network or missing components required."

patches_applied: []

target_validation:
  status: pending
  note: "Awaiting HMBS preflight evidence (HMBS_UPSTREAM_TEST_RESULT / HMBS_TEST_PACKAGE_RESULT)."

conan_validation:
  status: pending
  mode: "hmbs preflight (conan create on HarmonyOS aarch64)"
