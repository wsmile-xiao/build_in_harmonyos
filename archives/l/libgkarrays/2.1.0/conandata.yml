# conandata.yml -- libgkarrays 2.1.0
# Upstream GForge (http://crac.gforge.inria.fr/gkarrays/) is retired; the
# original libGkArrays-2.1.0.tar.gz is no longer reachable. Use the
# authoritative Debian/Ubuntu dfsg repack (identical bytes on both archives,
# sha256 verified against the Debian .dsc record). The dfsg repack only strips
# generated autotools files (configure, Makefile.in, config.guess/sub); the
# recipe regenerates them with `autoreconf -fi`.

sources:
  url:
    - "https://deb.debian.org/debian/pool/main/libg/libgkarrays/libgkarrays_2.1.0+dfsg.orig.tar.xz"
    - "https://archive.ubuntu.com/ubuntu/pool/universe/libg/libgkarrays/libgkarrays_2.1.0+dfsg.orig.tar.xz"
  sha256: "bb73beac8d9c3e6b4acfebba325904a98653357f8373ec60ed3614ff6f04bb84"

patches: []
