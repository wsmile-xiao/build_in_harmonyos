sources:
  "1.58.0":
    url: "https://gitlab.freedesktop.org/api/v4/projects/411/packages/generic/NetworkManager/1.58.0/NetworkManager-1.58.0.tar.xz"
    sha256: "0c6f2703a2c9b017cd68fbfe1d2e8a1a5d7ff05137c751ec421cba36e94546ba"

patches:
  "1.58.0":
    - patch_file: "patches/0001-n-dhcp4-socket-netinet-udp.patch"
      patch_description: "OHOS: include musl netinet/udp.h for struct udphdr (bionic-style linux/udp.h only defines __kernel_udphdr)"
      patch_type: "portability"
    - patch_file: "patches/0002-n-dhcp4-packet-netinet-udp.patch"
      patch_description: "OHOS: include musl netinet/udp.h for struct udphdr in packet sockets (bionic-style linux/udp.h only defines __kernel_udphdr)"
      patch_type: "portability"
    - patch_file: "patches/0003-nm-sd-adapt-core-secure-getenv.patch"
      patch_description: "portability: in the vendored systemd adapt header, replace the hard #error raised when neither secure_getenv(3) nor __secure_getenv(3) exists with a guarded getenv(3) fallback, so the header stays portable across libcs without the GNU extension. No platform-specific macro is introduced; the recipe's force-included OHOS compat header already maps secure_getenv to getenv(3)"
      patch_type: "portability"
    - patch_file: "patches/0004-tools-bash-shebang.patch"
      patch_description: "OHOS: point build/test helper scripts' bash shebangs at /data/service/hnp/bin/bash — OHOS ships no /bin/bash (bash lives at /data/service/hnp/bin/bash), and meson invokes these helpers through their shebang, which dies with ENOENT from the missing interpreter; these scripts need real bash features (set -o pipefail, <(...) process substitution) so /bin/sh is not an option"
      patch_type: "portability"
    - patch_file: "patches/0005-meson-script-invocation.patch"
      patch_description: "OHOS/sandbox: invoke shell helper scripts (create-exports-NetworkManager.sh, check-exports.sh, run-nm-test.sh) via an explicit interpreter (/data/service/hnp/bin/bash or /bin/sh) so meson/ninja run them through sh -c, because the build domain cannot exec script files whose shebang points into the hnp_file domain (Permission denied); the meson test/check programs point at the recipe-generated launchers inside the source tree (tools/nm-run-test, tools/nm-check-exports) through join_paths(source_root, 'tools', …), so the patch contains no machine- or user-specific absolute path"
      patch_type: "portability"
    - patch_file: "patches/0006-tools-devfd-process-subst.patch"
      patch_description: "OHOS/sandbox: replace bash process substitution <(cmd) (which passes /dev/fd/N to grep, denied here: 'grep: /dev/fd/63: Permission denied') with plain temp files under $TMPDIR in create-exports-NetworkManager.sh and check-config-options.sh"
      patch_type: "portability"
    - patch_file: "patches/0007-meson-check-tests-interpreter.patch"
      patch_description: "OHOS/sandbox: run the check-* test helper scripts (check-gitlab-ci/check-tree/check-vapi/check-nm-autoptr/check-config-options) through an explicit /data/service/hnp/bin/bash so meson test does not exec them via their bash shebang (denied in the conan domain)"
      patch_type: "portability"
    - patch_file: "patches/0008-create-exports-symbols-symtab.patch"
      patch_description: "OHOS: enumerate NetworkManager's exported symbols from the regular symbol table (global T/D/G/R/B/S) instead of `nm -D`, because NetworkManager-all-sym is linked as a PIE without --export-dynamic so its .dynsym holds only imports; the previous behaviour yielded an empty version script and made the build fail"
      patch_type: "portability"
    - patch_file: "patches/0009-meson-post-install-interpreter.patch"
      patch_description: "OHOS/sandbox: run the meson post-install script through an explicit /bin/sh interpreter (find_program) instead of letting meson exec it via its shebang, which is denied in the conan domain ('install script could not be run', mapped to exit 127)"
      patch_type: "portability"
    - patch_file: "patches/0010-meson-remaining-tests-interpreter.patch"
      patch_description: "OHOS: run the remaining test helper scripts (src/tests/client/test-client.sh, src/tests/check-systemd-unit.sh, src/tests/check-potfile-list.py) through an explicit interpreter (find_program('/data/service/hnp/bin/bash') / the discovered python) instead of letting meson exec them via their shebang; /bin/bash and a PATH-resolvable python3 for #!/usr/bin/env do not exist on OHOS, so execve failed with ENOENT and meson aborted the whole test run (FileNotFoundError)"
      patch_type: "portability"
