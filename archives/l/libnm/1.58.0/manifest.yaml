software: libnm
version: "1.58.0"
status: built
build_date: "2026-09-20"
build_system: meson

issue: ""

source:
  url: "https://gitlab.freedesktop.org/api/v4/projects/411/packages/generic/NetworkManager/1.58.0/NetworkManager-1.58.0.tar.xz"
  sha256: "0c6f2703a2c9b017cd68fbfe1d2e8a1a5d7ff05137c751ec421cba36e94546ba"
  tar_format: tar.xz

build:
  system: meson
  # 交付面：NetworkManager 源树中的客户端库 libnm（libnm.pc: Name: libnm /
  # Libs: -lnm / Cflags: -I${includedir}/libnm）。NM 1.58 的 meson 没有
  # daemon/libnm 裁剪开关，守护进程与客户端工具一并构建，但只打包 libnm
  # 库 + 头 + pc + 许可证。
  project_options:
    - "docs=false / man=false / introspection=false / vapi=false (文档与语言绑定裁剪)"
    - "polkit=false (无 conan 包；polkit 授权属桌面集成)"
    - "selinux=false / libaudit=no / systemd_journal=false / session_tracking=no (OHOS 无对应栈)"
    - "crypto=null (无 nss/gnutls；NM 客户端库不需要 TLS 栈)"
    - "concheck=false (libpsl/libcurl 裁剪)"
    - "modem_manager=false / teamdctl=false / ovs=false / nm_cloud_setup=false / clat=false"
    - "ebpf=false / nbft=false / qt=false / readline=none / ifupdown=false"
    - "wifi=true / bluez5_dun=false / iwd=false / ppp=false"
    - "nmcli=false / nmtui=false (客户端工具不交付)"
    - "udev_dir=no / dbus_conf_dir=share/dbus-1/system.d / systemdsystemunitdir=lib/systemd/system / systemdsystemgeneratordir=lib/systemd/system-generators (安装目录收敛)"
    - "tests=yes (保留上游自动化测试入口)"
  dependencies:
    - "glib/2.88.3"
    - "libndp/1.9"
    - "libudev-zero/1.0.4"
    - "dbus/1.14.10.2"
    - "uuid/2.40.1"
  tool_requires:
    - "meson/1.11.0"
    - "ninja/1.12.1"
    - "pkgconf/3.0.6"
    - "perl/5.42.2.3"
    - "gettext/0.22.5.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-n-dhcp4-socket-netinet-udp.patch"
  - "0002-n-dhcp4-packet-netinet-udp.patch"
  - "0003-nm-sd-adapt-core-secure-getenv.patch"
  - "0004-tools-bash-shebang.patch"
  - "0005-meson-script-invocation.patch"
  - "0006-tools-devfd-process-subst.patch"
  - "0007-meson-check-tests-interpreter.patch"
  - "0008-create-exports-symbols-symtab.patch"
  - "0009-meson-post-install-interpreter.patch"
  - "0010-meson-remaining-tests-interpreter.patch"

artifacts:
  libraries:
    - "lib/libnm.so.0 (运行时 SONAME，ELF 自签名)"
    - "lib/libnm.so (链接期别名，实体文件)"
  headers:
    - "include/libnm/*.h"
  pkgconfig:
    - "lib/pkgconfig/libnm.pc"
  licenses:
    - "licenses/COPYING.LGPL"

validation:
  local:
    py_compile: passed
    conan_create: "passed；reports/conan-create.log 为真编日志（Building from source → Calling build() → [867/867] → Package 'e89918d2770ed06ea46a48461138ff057a73cc23' built → Created package revision cc86c681edfdf700e8646d34a03b1244）"
    conan_verify: "passed（Verdict PASS；G2 的 conan create 为真编，非缓存命中）"
    recipe_revision: "2d9b66d08534de2b4621bec91adb853d"
    package_id: "e89918d2770ed06ea46a48461138ff057a73cc23"
    upstream_tests: "meson test 共 66 项：43 PASS / 23 FAIL / 0 SKIP。23 项失败按实测退出码分七类，均不构成适配缺陷：①7 项 SIGSYS(159) 沙箱 seccomp 拦 netlink 系统调用；②6 项 SIGABRT(134) 因本配方 crypto=null 导致 802-1x/TLS 断言（已知配置后果）；③3 项 SIGABRT(134) 无法启动 D-Bus 会话总线（无 machine-id）；④2 项 SIGABRT(134) 需真实 netlink 平台初始化；⑤3 项因构建树无 libnm.so.0 软链导致加载器解析失败（DT_NEEDED 实测含 libnm.so.0；本平台不能建链）；⑥1 项 sym/libnm-device-plugin-adsl.so 以 LD_PRELOAD 注入时解析不到 libudev 的 udev_* 符号（该 .so 的 DT_NEEDED 实测不含 libudev 亦不含 libnm.so.0，udev 符号需宿主提供）；⑦1 项 check-local-tests-client 前提不成立（需开发者软链与 nmcli）。退出状态口径：经 run-nm-test.sh 包裹的 21 项用例 meson 逐项行记 exit status 5，真实内层码在 stderr 的 failed with exit code N；不经 wrapper 的两项直接反映进程状态（插件项 exit status 127、check-local-tests-client exit status 1）。对照证据：同族 *-fake 变体全部 PASS。"
    test_package: "6/6 PASS（headers-and-version / uuid-api / ohos-consumer-smoke{arg,dlopen,dlsym,symbol-consistency}）；日志原样输出 6 check(s) run, 0 failure(s): PASSED（执行数与失败数分列，AI Review P3 修复）"
    w3_local_ci: "L0_RESULT=pass / L1_RESULT=pass / L2_RESULT=skip（无 bin/）/ L4_RESULT=pass / L5_RESULT=pass；reports/w3-local-ci.log"
    packaging: "packaging/libnm-1.58.0-ohos-aarch64.tar.gz（4916997 B / 138 条目，sha256 aac6dfb505e4320023333695373e5ff3fd252fc0a0fbc92e9fad46455e151fd2）+ -debug.tar.gz（1202891 B / 3 条目，sha256 e29c4702ba4cdf2d4c35243003e95f6aa17ae043eab583ac4077af232ed718c3），由 PackageBuilder 10 步工具链产出（packaging/.packaged）；tar 内无 storage/ 畸形条目。注：packaging/ 被 .gitignore 忽略、不入 PR；其 sha256 随 ELF 重签名的时戳变化，重新打包会得到不同哈希（体积与条目数稳定）"
    staging_verified: "verify-build --install-prefix 产 .verify-passed（verdict=PASS）+ reports/quality-report.md（G1/G2/G3/G4 全 PASS，❌0；G4 在 packaging/ 产出后重跑已刷新为 ✅0 ⚠️0 ❌0）；.staging-verified 为框架规定的空标记文件（本包无 bin/，无二进制可探测）"
    finish_gates: "finish exit=0 / status=built；archive 校验缺失项 0（打包产物补齐后）；一致性问题 1 = 框架 patch 通配 patches/000*.patch 不匹配 4 位序号 ≥0010 的补丁（本仓多版本目录同现象，属框架通配符局限）；W5 的 E219/E253/E305 字段空为框架 hash 解析器不解析 YAML 块标量的假阳性，且属 upstream 既有 tracked 数据，按 PR 原子性不改"
    reason: "conan-verify 工具判定 PASS：G0/G1/G2/G3 PASS，G4 记「无程序包 ID 可校验」，L2/L4/L5 记「跳过（无 cache 路径）」；W3 本地 CI 模拟通过（L0/L1/L4/L5 pass，L2 skip 因无 bin/）。ELF 签名 PACKAGE_CODESIGN=PASS signed_elfs=1。"
  ohos:
    conan_create: pending_ci
    reason: "本地已验证；官方 CI 需在 PR 触发后复验。"

