  method: "unified-diff（本地 difflib，基于上游 pristine 解包树）"
  note: "本包未走 init-build，故无 orig/work 编辑追踪基线；refresh-patch --auto 在 finish Step 1 执行后报告「无差异，保留现有补丁」。10 个补丁已在重新下载并解包的 pristine 上游树（NetworkManager-1.58.0，tar sha256 复算一致）上逐条复现：用 conan 同款严格应用器 patch_ng（无 fuzz、严格行号）应用 10/10 通过，补丁产物全树 __OHOS__ 计数 0；头两行均为 --- a/<path> / +++ b/<path>。"
  generated_at: "2026-09-24"
  patches_count: 10

