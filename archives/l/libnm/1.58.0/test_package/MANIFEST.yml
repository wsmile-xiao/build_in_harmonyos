# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnm/1.58.0
homepage: "https://gitlab.freedesktop.org/NetworkManager/NetworkManager"

# 上游测试命令 (用于 meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "meson test -C build-release --no-rebuild --print-errorlogs -j1"

# 上游实际运行的测试程序
upstream_tests:
  - file: meson.build
    source: NetworkManager-1.58.0
    description: "上游 meson 测试套件，meson test --list 枚举 66 项：platform/*-{fake,linux}、libnm-core-impl/tests、libnm-client-impl/tests、supplicant、devices、check-* 元检查（check-vapi/check-tree/check-potfile-list 等）"
    command: "meson test -C build-release --no-rebuild --print-errorlogs -j1"
upstream_tests_result:
  total: 66
  passed: 43
  failed: 23
  skipped: 0
  # 失败归因（按实测退出码分 7 组，组内合计 7+6+3+2+3+1+1 = 23，均非配方缺陷）：
  #  1) 7 项 SIGSYS(159，'Bad system call')：沙箱 seccomp 拦截 netlink 等系统调用 ——
  #     platform/test-{address,cleanup,link,route,tc}-linux、test-l3cfg、devices/test-lldp。
  #  2) 6 项 SIGABRT(134，glib assertion failed -> 'Bail out!')：断言依赖 crypto/TLS，
  #     系本配方 crypto=null 的已知配置后果 —— test-crypto、test-keyfile、test-secrets、
  #     test-setting、test-keyfile-settings、supplicant/test-supplicant-config。
  #  3) 3 项 SIGABRT(134)：无法启动 D-Bus 会话总线（'Cannot spawn a message bus without
  #     a machine-id'）—— test-nm-client、test-remote-settings-client、test-secret-agent。
  #  4) 2 项 SIGABRT(134)：需要真实 netlink 平台初始化（nm-linux-platform.c:12238
  #     assertion failed）—— platform/test-platform-general、test-netns。
  #  5) 4 项动态加载期失败（meson 逐项行记 'exit status 5'×3 / 'exit status 127'×1；
  #     经 run-nm-test.sh 包裹的用例其 meson 外层状态恒为 5，真实码需读 stderr）：
  #     5a) 3 项 —— 构建树无 libnm.so.0 开发软链（本平台 HMDFS 无法创建符号链接，
  #         meson 自述 "Symlink creation does not work on this platform"），加载器报
  #         'Error loading shared library libnm.so.0' + 随后的
  #         'Error relocating <bin>: nm_*: symbol not found'；readelf -d 实测这三者
  #         DT_NEEDED 确实含 libnm.so.0 —— test-libnm-client-aux、test-dispatcher-envp、
  #         test-libnmc-setting。
  #     5b) 1 项 —— sym/libnm-device-plugin-adsl.so：该用例把设备插件以 LD_PRELOAD 注入
  #         'NetworkManager --version'，插件解析不到 libudev（libudev-zero 提供）的
  #         udev_enumerate_* / udev_device_* / udev_list_entry_* 符号（17 行 stderr 全为
  #         此类，无 'Error loading shared library libnm.so.0'）；readelf -d 实测该 .so 的
  #         DT_NEEDED 仅 libgobject-2.0.so.0 / libglib-2.0.so.0 / libc.so，既不含 libudev
  #         也不含 libnm.so.0（其 udev 符号依赖宿主进程在全局作用域提供）。
  #  6) 1 项：check-local-tests-client —— 需构建树开发软链 libnm.so（同 5a 的无软链成因）
  #     与 nmcli，而本配方按客户端库定位以 -Dnmcli=false 构建。
  # 对照证据：同族 *-fake 变体（test-address-fake / test-cleanup-fake / test-link-fake /
  # test-route-fake）与 test-nmp-object 在同一沙箱内全部 PASS。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libnm.c
    description: "消费者测试：头文件与版本宏、uuid API、dlopen libnm.so.0 + dlsym 符号一致性、E316 实体化 SONAME 校验"
    command: "./test_libnm"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
