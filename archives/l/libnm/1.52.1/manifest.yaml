    - "-Dofono=false"
    - "-Dovs=false"
    - "-Dwext=false"
    - "-Dwifi=false"
    - "-Dppp=false"
    - "-Diwd=false"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Dqt=false"
    - "-Ddocs=false"
    - "-Dfirewalld_zone=false"
    - "-Dsession_tracking=no"
    - "-Dsuspend_resume=auto"
    - "-Dsystemd_journal=false"
