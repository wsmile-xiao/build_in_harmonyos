  - "0002-src-n-dhcp4-src-util-packet.c.patch"
  - "0003-src-libnm-std-aux-nm-linux-compat.h.patch"
  - "0004-src-linux-headers-mptcp.h.patch"
  - "0005-src-libnm-systemd-shared-sd-adapt-shared-nm-sd-adapt-shared.h.patch"
