knowledge_ref:
  - "E091"
  - "E165"
  - "E217"
  - "DRAFT-libnm-1.52.1-ohos-loader-rejects-symlinked-dt-needed"
  - "DRAFT-libnm-1.52.1-cpp-info-check-component-requires"
  - "DRAFT-libnm-1.52.1-upstream-test-harness-false-negatives"

knowledge_gained:
  - "E091: the OHOS sysroot defines struct sockaddr_storage twice (linux/socket.h unconditionally, sys/socket.h only when __MUSL__ is unset); -D__MUSL__ in MesonToolchain c_args/cpp_args selects the sys/socket.h branch and turns the later linux/socket.h include into a no-op - no source patch needed (knowledge_ref: E091)"
  - "the OHOS dynamic loader refuses to resolve a DT_NEEDED entry whose file is a symbolic link; musl prints an EMPTY strerror for it ('Error loading shared library libgnutls.so.30: (needed by ...)') and the process exits 127, which is easy to misread as a missing file (proven with a two-object probe: same binary + same LD_LIBRARY_PATH, rc=0 with a regular file, rc=127 with a symlink) (knowledge_ref: DRAFT-libnm-1.52.1-ohos-loader-rejects-symlinked-dt-needed)"
  - "binary-sign-tool sign -inFile X -outFile X -selfSign 1 rewrites X in place, which de-references symlinks; that is why every .so in the glib and nss packages is a regular file. Signing the whole glob without skipping links is what materialises libnm.so -> libnm.so.0 -> libnm.so.0.1.0 (knowledge_ref: DRAFT-libnm-1.52.1-ohos-loader-rejects-symlinked-dt-needed)"
  - "cpp_info.check_component_requires (Conan 2) rejects the recipe unless every visible, non-override direct dependency is listed in cpp_info.requires, even when libnm.pc only advertises 'Requires: gio-2.0' and libnm.so resolves libudev/libuuid/gnutls internally via --no-undefined (knowledge_ref: DRAFT-libnm-1.52.1-cpp-info-check-component-requires)"
  - "the upstream suite needs -Dtests=yes; it then registers 54 tests (meson-info/intro-tests.json). tools/run-nm-test.sh normalises a crashed test to exit status 5, so the meson testlog shows 5 without saying why (knowledge_ref: DRAFT-libnm-1.52.1-upstream-test-harness-false-negatives)"
  - "the upstream suite depends on /bin/bash (tools/run-nm-test.sh, tools/check-*.sh); OHOS has no /bin/bash, the interpreter is /data/service/hnp/bin/bash, so every shebang has to be rewritten before meson.build() runs check targets (knowledge_ref: E165)"
  - "the test binaries need every symlinked dependency .so materialised first (private runtime dir prepended to LD_LIBRARY_PATH): 20/54 -> 40/54 tests pass, the remaining 14 all blocked by the sandbox (netlink/D-Bus/keyfile daemon helper) (knowledge_ref: DRAFT-libnm-1.52.1-ohos-loader-rejects-symlinked-dt-needed)"
  - "upstream tools/check-exports.sh pipes bare nm output into a comparison against the '#<sym>@<ver>;' comment lines of libnm.ver; bare nm reads .symtab and prints no version tag, so it reports 21 missing symbols that `nm -D libnm.so` shows are all exported (knowledge_ref: DRAFT-libnm-1.52.1-upstream-test-harness-false-negatives)"
  - "consumers must #include <NetworkManager.h>: upstream installs into include/libnm and points the include path at that directory itself (Cflags: -I${includedir}/libnm), so <libnm/NetworkManager.h> does not resolve (knowledge_ref: E217)"
