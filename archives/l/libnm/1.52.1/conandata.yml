sources:
  "1.52.1":
    # NetworkManager releases moved off download.gnome.org; the official
    # release asset now lives on gitlab.freedesktop.org (see
    # download.gnome.org/sources/NetworkManager/IMPORTANT-NetworkManager-releases-moved.txt).
    url: "https://gitlab.freedesktop.org/NetworkManager/NetworkManager/-/releases/1.52.1/downloads/NetworkManager-1.52.1.tar.xz"
    sha256: "8b122c73493a72f2bae527c125cebd87711671b90352dbe2b1788aba9575ac6f"
    tar_format: tar.xz
patches:
  "1.52.1":
    - patch_file: "patches/0001-src-n-dhcp4-src-n-dhcp4-socket.c.patch"
      patch_description: >-
        n-dhcp4 packet filter uses <netinet/udp.h> for struct udphdr. The
        OHOS/bionic-derived SDK sysroot makes <linux/udp.h> expose only the
        kernel-side struct __kernel_udphdr, so the type the BPF program
        filters on stayed incomplete. The sibling n-dhcp4 sources
        (n-dhcp4-incoming.c, n-dhcp4-outgoing.c) already include
        <netinet/udp.h>; this aligns n-dhcp4-socket.c with them and keeps
        the glibc-style member names (source/dest/len/check) that
        offsetof(struct udphdr, dest) relies on. No platform or libc macro
        is involved.
      patch_type: "portability"
    - patch_file: "patches/0002-src-n-dhcp4-src-util-packet.c.patch"
      patch_description: >-
        Same <linux/udp.h> -> <netinet/udp.h> alignment as patch 0001, for
        the second n-dhcp4 translation unit that builds a UDP header with
        the glibc-style member names (packet_builder_append_udp()).
      patch_type: "portability"
    - patch_file: "patches/0003-src-libnm-std-aux-nm-linux-compat.h.patch"
      patch_description: >-
        nm-linux-compat.h bundles newer copies of three Linux UAPI headers.
        The OHOS sysroot ships its own copies of two of them under different
        include guards (linux/ethtool.h as _UAPI_LINUX_ETHTOOL_H,
        linux/mptcp.h as _UAPI_MPTCP_H), so both spellings ended up in one
        translation unit and struct ethtool_cmd/ethtool_drvinfo/... plus the
        tunable_id enumerators were redefined. Predefining the system guards
        makes the system copies no-ops and keeps the newer bundled ones
        authoritative - the same E119 technique used for
        _UAPI_LINUX_SOCKET_H elsewhere in this repository. No platform or
        libc macro is involved. linux/nl802154.h needs no suppression because
        the sysroot does not ship it.
      patch_type: "portability"
    - patch_file: "patches/0004-src-linux-headers-mptcp.h.patch"
      patch_description: >-
        The bundled linux/mptcp.h declares its two storage fields as
        "struct __kernel_sockaddr_storage". The OHOS sysroot's
        <linux/socket.h> declares that type unprefixed as
        "struct sockaddr_storage" and provides no __kernel_ alias, leaving
        both fields incomplete (platform/nm-linux-platform.c, nm-platform.c,
        nm-platform-utils.c, wifi/nm-wifi-utils-nl80211.c,
        wpan/nm-wpan-utils.c and core/nm-l3cfg.c all failed on this).
        <sys/socket.h>, already included by the same header, provides the
        unprefixed type on every libc and the two are interchangeable here:
        128 bytes, ss_family at offset 0. No platform macro is involved.
      patch_type: "portability"
    - patch_file: "patches/0005-src-libnm-systemd-shared-sd-adapt-shared-nm-sd-adapt-shared.h.patch"
      patch_description: >-
        Three glibc extensions the vendored systemd code uses have no musl
        equivalent and are absent from the OHOS libc (verified with nm -D on
        sysroot libc.so): secure_getenv(), qsort_r() and
        get_current_dir_name(). meson records the first one as
        HAVE_SECURE_GETENV=0 / HAVE___SECURE_GETENV=0, so the header's
        existing #error branch made every systemd-shared translation unit
        fail. The patch adds getenv() as the fallback (libnm never raises its
        own privileges), builds qsort_r() on top of qsort() with a
        thread-local comparison context (needed because sort-util.h calls it
        directly while libnm.so is linked with --no-undefined), and
        implements get_current_dir_name() with getcwd(NULL, 0), which is what
        path-util.c safe_getcwd() needs (a malloc'ed absolute path). The
        guards are libc probes (!defined(__GLIBC__)), not platform macros.
      patch_type: "portability"
    - patch_file: "patches/0006-src-libnm-systemd-core-sd-adapt-core-nm-sd-adapt-core.h.patch"
      patch_description: >-
        nm-sd-adapt-core.h undefines NETWORKMANAGER_COMPILATION before
        including nm-sd-adapt-shared.h, so that header's
        NM_NETWORKMANAGER_COMPILATION_WITH_SYSTEMD block - which carries the
        secure_getenv() fallback added by patch 0005 - stays inert here. This
        patch adds the same getenv() branch to the core-side #if chain, and
        with it a sigisemptyset() fallback: that is another glibc extension
        (2.30) which the OHOS libc does not export (it only has sigemptyset()
        and sigismember()), and sd-event.c:817 calls it, so
        NetworkManager-all-sym failed to link. The fallback compares the mask
        against a zeroed sigset_t, which is the equivalent check on Linux and
        the same one systemd itself carries. Both guards are libc probes
        (!defined(__GLIBC__)), no platform macro.
      patch_type: "portability"
    - patch_file: "patches/0007-src-core-meson.build.patch"
      patch_description: >-
        The core targets include <libudev.h> and <ndp.h> without declaring
        the matching meson dependencies (core_plugin_dep for the device
        plugins, core_default_dep for libNetworkManagerBase and
        libNetworkManagerTest_dep). Upstream gets away with it because
        libudev.h and ndp.h sit in the compiler's default include path on a
        system-wide installation; with Conan the dependencies live in
        separate prefixes, so nm-atm-manager.c, ndisc/nm-lndp-ndisc.c and
        platform/tests/test-nmp-object.c failed with "file not found". This
        declares the two dependencies where they are actually used.
      patch_type: "portability"
