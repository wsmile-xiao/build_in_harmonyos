# ============================================================
# 本包自己的消费端测试
# ============================================================

test_package_tests:
  - id: "libnm-public-api"
    source: "test_libnm.c"
    command: "test_libnm"
    description: >-
      Builds against the installed headers/libnm.pc (CMakeDeps + libnm::libnm),
      then asserts the version contract, the nm_utils_* helpers, a full
      NMConnection profile built from NMSettingConnection/Wired/IP4Config +
      NMIPAddress, normalize + verify through the real setting validators, a
      complete GVariant (D-Bus) serialisation round trip, and the NMClient
      GType contract. Runs on the OHOS device without a NetworkManager daemon
      and without a system D-Bus.

