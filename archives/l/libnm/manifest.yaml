# 软件级 manifest — libnm（NetworkManager 客户端库）
# 文件位置: archives/l/libnm/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# 软件级元数据 + 版本索引（人读；CI 不依赖本文件；CI 唯一输入是版本级 conanfile.py）

# ============================================================
# 必须字段
# ============================================================

software: libnm

display: "libnm"

description: "NetworkManager 客户端库 —— 通过 GIO/D-Bus 与 NetworkManager 守护进程交互的 GObject 客户端 API"

category: network

homepage: "https://gitlab.freedesktop.org/NetworkManager/NetworkManager"

# SPDX 标识（上游 libnm 为 LGPL-2.1-or-later）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

build_system: meson

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - >-
      交付面：NM 1.58 的 meson 没有「只构建 libnm」的开关，守护进程与客户端
      工具会一并编译；本仓只打包 libnm 库本体（include/ + lib/ + pkgconfig +
      许可证）。用 meson project options 关闭 OHOS 上无包/无意义的可选项：
      polkit / selinux / libaudit / systemd(session_tracking, systemd_journal) /
      crypto=null / concheck(libpsl,libcurl) / modem_manager / teamdctl / ovs /
      nm_cloud_setup / clat / ebpf / nbft / qt / readline / ifupdown / nmcli /
      nmtui / bluez5_dun / iwd / ppp / docs / man / introspection / vapi。
    - >-
      Musl/bionic 头差异：bionic 化的 linux/udp.h 只定义 __kernel_udphdr，没有
      struct udphdr → n-dhcp4 的 socket/packet 两处改从 musl netinet/udp.h 取；
      secure_getenv 由 nm-sd-adapt-core 兼容头映射为 getenv(3)，视作可用。
    - >-
      脚本执行域（本仓多包通用坑）：OHOS 无 /bin/bash，且本构建域的 SELinux
      策略不允许脚本按自身 shebang 做解释器域转移（Permission denied）→
      构建期/测试期/安装期脚本一律改为让 meson/ninja **显式 exec 解释器**、
      脚本仅作参数（custom_target 的 command / test() 的 program /
      add_install_script 的 program 全部传 find_program(...)）。
    - >-
      沙箱无 /dev/fd：脚本内的 bash 进程替换 <(cmd) 会被拒
      （grep: /dev/fd/63: Permission denied）→ 改为落 $TMPDIR 临时文件。
    - >-
      符号枚举：NetworkManager-all-sym 以 PIE 链接且未加 --export-dynamic，
      其 .dynsym 只有导入符号，原 `nm -D` 取不到定义符号（只剩 _init/_fini）→
      版本脚本退化为空并触发 set -e 退出；改为读普通符号表中的全局定义符号
      (T/D/G/R/B/S)，等价于 --export-dynamic 之后的动态符号集。
    - >-
      pkg-config 垫片：dbus 配方只暴露 dbus（NM 要 dbus-1）、libudev-zero 只
      暴露 libudev-zero（NM 要 libudev>=175）、glib 配方无 gio-unix 组件
      （NM 要 gio-unix-2.0>=2.42）。其中 dbus-1.pc 的 interfaces_dir /
      system_bus_services_dir **必须经 ${datadir} 中转**——NM 的 meson 用
      pkgconfig_define 覆盖 datadir 取安装目录，直接展开成 ${prefix}/share/…
      会让 NM 的 dbus 内省 XML 与 service 声明被装进 dbus 依赖包的包目录下，
      在包内形成 storage/…/dbus…/p/share/… 的畸形子树。
    - >-
      SONAME 实体化（E316/E492/E505）：OHOS musl 加载器不能加载「SONAME 名是
      软链」的库 → package() 把 libnm.so.0 / libnm.so 软链族物化为规则文件，
      并断言运行时 SONAME 恰一个规则文件、链接期别名非软链；包内 ELF 逐个
      OHOS binary-sign-tool selfSign（先例 glib/2.88.3）。
    - >-
      test_package 需把 glib 提升为**直接**依赖：glib 若只作为传递依赖
      （经 cpp_info.requires 引用其组件），会被 conan 归入 "Skipped binaries"，
      cpp_info（含 include 目录）在生成 CMakeDeps 数据时被清空 → 消费者编译
      <NetworkManager.h>（无条件 include gio/gio.h）报头文件找不到
      （先例 abiword-plugin-openwriter/3.0.8）。
    - >-
      消费者须知：pkg-config 名 libnm，链接 -lnm，头文件在 include/libnm/；
      运行时需 LD_LIBRARY_PATH 指向包的 lib/（OHOS musl 不解析 RUNPATH）。
    - >-
      环境限制（非适配缺陷，详见各版本 reports/test-report.md 的逐类归因）：
      本机沙箱 seccomp 拦截 netlink 等系统调用 ⇒ 7 项 platform/test-*-linux 一类用例
      SIGSYS；11 项因无 crypto（crypto=null 的已知配置后果）/ 无 D-Bus 会话总线 /
      无真实平台初始化而 glib 断言 SIGABRT；3 项因构建树缺 libnm.so.0 软链
      （HMDFS 不支持创建符号链接）而加载器报 reloc 失败；1 项设备插件以 LD_PRELOAD
      注入时解析不到 libudev 的 udev_* 符号（该 .so 的 DT_NEEDED 实测既不含 libudev
      也不含 libnm.so.0，其 udev 符号需宿主进程提供）；1 项 check-local-tests-client
      需开发软链与 nmcli。对照证据：同族 *-fake 变体与 test-nmp-object 在同一沙箱内
      全部 PASS。

  common_dependencies:
    - "glib/2.88.3"
    - "libndp/1.9"
    - "libudev-zero/1.0.4"
    - "dbus/1.14.10.2"
    - "uuid/2.40.1"

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.52.1":
    status: built
    build_date: "2026-09-19"
  "1.58.0":
    status: built
    build_date: "2026-09-20"
