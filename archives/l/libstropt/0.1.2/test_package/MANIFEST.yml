package: libstropt/0.1.2
homepage: "https://github.com/rd235/libstropt"

# R51 inventory: the release archive has no tests directory, test source,
# enable_testing()/add_test(), or make/check target. A clean CMake configure
# followed by `ctest -N` reports exactly `Total Tests: 0`.
upstream_check_command: "ctest -N"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_libstropt.c
    description: "General consumer test: 16 assertions exercise stropt, stroptx, stropt2buf, and stropt2str through the packaged shared library"
    command: "test_libstropt"
  - file: test_libstropt_ohos.c
    description: "HarmonyOS-specific test: 5 assertions require __OHOS__/aarch64 and verify parsing plus portable fixed/dynamic buffer reconstruction on OHOS musl"
    command: "test_libstropt_ohos"

assertion_count: 21
