software: libstropt
display: "libstropt"
description: "支持引号、参数、转义与自定义分隔符的轻量级 C 选项字符串解析库"
category: library
homepage: "https://github.com/rd235/libstropt"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 C/POSIX 库，无第三方依赖；以可移植的有界内存写入替代 OHOS musl 上不可用的内存流写入"
    - "上游 0.1.2 标签的 CMake 项目版本误写为 0.0.1，补丁修正为 0.1.2"
    - "非系统同名库，按上游行为构建共享库并保留动态链接产物"
    - "HarmonyOS 的 CMake 平台模块缺少 SONAME flag，配方显式注入未版本化且可重定位的 libstropt.so SONAME"
    - "上游无自动化测试；新增真实 API 消费者测试和 OHOS aarch64/musl 特有测试"
  common_dependencies: []

versions:
  "0.1.2":
    status: built
    build_date: "2026-09-18"
    conan_ref: "libstropt/0.1.2"
