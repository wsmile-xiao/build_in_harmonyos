version: 0.7.3
software: ltrace
status: built
build_date: '2026-09-03'
build_system: '{BUILD_SYSTEM}'
source:
  url: https://download.savannah.nongnu.org/releases/ltrace/ltrace-0.7.3.tar.bz2
  sha256: ''
  tar_format: tar.gz
build:
  system: autotools
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
- OHOS aarch64 不支持 error.h，需替换为 fprintf(stderr, ...) + exit()
- OHOS aarch64 的 pt_regs 使用 regs[] 数组而非 uregs[]，需要兼容宏
- ltrace 需要创建 aarch64 → arm 符号链接才能在 aarch64 上构建
- clang -Werror 会将 unused typedef/variable 当作错误，需添加 __attribute__((unused))
- proc.h 需要显式包含 <sys/types.h> 以定义 pid_t
- REG_NOERROR 在 OHOS 上未定义，需替换为 0
- error.h 间接包含的头文件需要在移除后显式添加（stdio.h, string.h, sys/types.h）
