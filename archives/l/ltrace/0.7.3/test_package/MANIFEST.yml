# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ltrace/0.7.3
homepage: "https://gitlab.com/cespedes/ltrace"

# 上游测试命令 (DejaGnu 框架: AUTOMAKE_OPTIONS = dejagnu, make check -> runtest)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成原因（实测证据，非推测）:
#   1. 适配/CI 环境无 tclsh、expect、runtest(DejaGnu)，且无法安装
#      (pip3 不可用; 实测 make check 输出 "WARNING: could not find 'runtest'" 后跳过)
#   2. 上游测试为运行时 ptrace 行为测试（跟踪真实进程），依赖 glibc 特定行为;
#      Gentoo 对 musl 直接 RESTRICT="elibc_musl? ( test )"（上游测试在 musl 类
#      libc 上大半不可用）。OHOS 为 musl 类 libc，预期多数用例不适用。
#   3. 测试需将 testsuite/ 内 C 源码在本机编译为目标程序再跟踪，交叉编译 +
#      设备运行环境无法在 CI 内闭环。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际测试清单（源码包 ltrace_0.7.3.orig.tar.bz2 testsuite/ 实测统计,
# sha256=0e6f8c077471b544c06def7192d983861ad2f8688dd5504beae62f0c5f5b9503）
# .exp 测试脚本共 26 个（另有 2 个框架文件 config/unix.exp、lib/ltrace.exp 不计入）:
#   ltrace.main/  11 个: branch_func, filters, hello-vfork, main-internal,
#                        main-threaded, main-vfork, main, parameters,
#                        parameters2, signals, system_calls
#   ltrace.minor/ 11 个: attach-process, count-record, demangle, libdl-simple,
#                        print-instruction-pointer, time-record-T, time-record-tt,
#                        time-record-ttt, trace-clone, trace-exec, trace-fork
#   ltrace.torture/ 4 个: ia64-sigill, ppc-lwarx, signals, vfork-thread
upstream_tests:
  - file: testsuite/ltrace.main/*.exp
    source: ltrace-0.7.3/testsuite/ltrace.main/
    description: "主流程 DejaGnu 测试 11 个（跟踪参数/信号/系统调用/vfork 等）"
    command: "runtest --srcdir testsuite (经 make check)"
  - file: testsuite/ltrace.minor/*.exp
    source: ltrace-0.7.3/testsuite/ltrace.minor/
    description: "次要功能 DejaGnu 测试 11 个（attach/demangle/计数/fork-clone-exec 等）"
    command: "runtest --srcdir testsuite (经 make check)"
  - file: testsuite/ltrace.torture/*.exp
    source: ltrace-0.7.3/testsuite/ltrace.torture/
    description: "压力 DejaGnu 测试 4 个（ia64/ppc 特有 2 个与 aarch64 无关）"
    command: "runtest --srcdir testsuite (经 make check)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 运行 ltrace --version 验证包内工具可执行"
    command: "./test_ltrace"

# 测试断言总数 (ltrace_verify_output 调用次数, DejaGnu 断言近似值)
assertion_count: 134
