# test_package/MANIFEST.yml — libfbclient/5.0.4
# 上游官方测试声明（CI build_and_test.sh L0e 强制要求）
#
# 上游测试清单获取方式（真实命令与输出见 notes.md / reports/）：
#   grep -rc 'BOOST_AUTO_TEST_SUITE\|BOOST_AUTO_TEST_CASE' src/common/tests/CommonTest.cpp \
#       src/common/classes/tests/*.cpp src/jrd/tests/*.cpp
#   make -C gen -f Makefile tests          # 目标 = common_test + engine_test
#   make -C gen -f Makefile -p | grep -E '^(COMMON_TEST|ENGINE_TEST) '
#
# 上游共有两个测试二进制（builds/posix/Makefile.in:432 / :477）：
#   * common_test (COMMON_TEST) — 客户端侧公共代码，13 个 boost 用例
#   * engine_test (ENGINE_TEST) — 引擎侧（Compressor/RecordNumber），2 个用例；
#     在 --enable-client-only 配置下结构性不可构建（引擎与 gpre_full 均不在该
#     配置内），实测 `make tests` 在构建 common_test 后于 engine 源码预处理阶段
#     失败：gen/Release/firebird/bin/gpre_current: No such file or directory (make.rules:102, Error 127)

package: libfbclient/5.0.4
homepage: "https://firebirdsql.org/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make -C gen -f Makefile tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -f Makefile TARGET=Release gen/Release/firebird/tests/common_test && gen/Release/firebird/tests/common_test --log_level=test_suite --report_level=detailed"

# 上游实际运行的测试程序（客户端侧）
upstream_tests:
  - file: common_test
    source: Firebird-5.0.4.1812-0-source/src/common/tests/CommonTest.cpp
    description: >-
      boost.test 主模块（BOOST_TEST_MODULE CommonTest）+ 4 个测试源文件：
      src/common/classes/tests/{AlignerTest,ArrayTest,ClumpletTest,DoublyLinkedListTest}.cpp
      共 13 个用例 / 61 个断言，全部通过
    command: "./gen/Release/firebird/tests/common_test --log_level=test_suite --report_level=detailed"
  - file: engine_test
    source: Firebird-5.0.4.1812-0-source/src/jrd/tests/EngineTest.cpp
    description: >-
      引擎侧测试（Compressor 1 用例 PackAndUnpackTest + RecordNumber 1 用例 IsValildTest，共 2 个
      用例）；--enable-client-only 配置下无法构建（引擎及 gpre_full 不在该配置内），本包不构建引擎
    command: "(not buildable in client-only mode)"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libfbclient.cpp
    description: >-
      链接并加载打包后的 libfbclient.so.2，真实调用 Y-Valve master 接口 / 旧版 C API
      版本入口 / ICU 时区编解码 / 远程 inet provider 连接错误路径；含 3 个鸿蒙特有
      用例（OHOS-1 工具链与架构、OHOS-2 打包产物 ELF 校验、OHOS-3 OHOS 上 ICU 路径）
    command: "./test_libfbclient"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 61
