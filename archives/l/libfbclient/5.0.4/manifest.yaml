# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  # 上游 POSIX autotools 构建，client-only 模式（= 客户端库本体，无引擎/工具）
  configure_options:
    - "--enable-client-only"
    - "--without-editline"
    - "--disable-rpath"
  # 全部为 libfbclient 本体的强制第三方依赖，均已从 ohpcd 制品仓消费
  dependencies:
    - icu4c/78
    - zlib/1.3.2
    - libtommath/1.3.0
    - libtomcrypt/1.18.2
  tool_requires: []
  cc: clang
  cxx: clang++
  compiler_version: "15.0.4 (OHOS SDK)"
  target_triplet: "aarch64-unknown-linux-ohos"

