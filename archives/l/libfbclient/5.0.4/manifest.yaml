# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "config.guess 补 HarmonyOS 识别（uname -s=HarmonyOS，E007）；config.sub 补 ohos OS + linux-ohos 内核组合；native 编译不做 --build/--host 伪造"
  - "config.status 的 umask 077 在 HMDFS 上产生 2700 目录不可写（E114），需改 umask 000"
  - "上游 tarball 预置的 src/include/gen/autoconfig.auto 是 glibc 宿主产物（HAVE_PTHREAD_CANCEL/HAVE_DLINFO defined），OHOS 必须由 configure 重新生成，禁止还原该文件"
  - "extern/cloop/Makefile 只用 $(LIBS) 链接、不传 $(LDFLAGS)，需用 LIBRARY_PATH 暴露 conan 依赖 lib 目录"
  - "client-only 模式下上游 make install 结构损坏（install.sh 未被拷入打包目录即被执行）+ 会 cp 调试符号到 /；改为打包 gen/Release/firebird 安装镜像（与 Debian override_dh_auto_install:true 同口径）"
  - "client-only 下上游 make tests 只能构建 common_test（13 用例），ENGINE_TEST 需引擎与 gpre_full（make.rules:102 gpre_current 缺失，Error 127）"

