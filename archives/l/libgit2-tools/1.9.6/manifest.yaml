# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.9.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

name: libgit2-tools

# 软件名（required field）
software: libgit2-tools

# 版本号
version: "1.9.6"

# 编译状态
status: built

# 编译日期
build_date: "2026-09-18"

# 构建系统
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/libgit2/libgit2/archive/refs/tags/v1.9.6.tar.gz"
  sha256: "a88a42a4ea9bdab7aa8686eead3bf7d9c6dd74529caca16ab22eaa92433d31d9"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "BUILD_CLI=ON (git2 CLI，libgit2-tools 的核心交付物)"
    - "BUILD_TESTS=OFF (上游 clar 测试套件在 CI 交叉环境不可运行，本地实测见 notes.md)"
    - "BUILD_EXAMPLES=OFF"
    - "BUILD_FUZZERS=OFF"
    - "USE_HTTPS=OpenSSL"
    - "USE_SHA1 保持上游默认 CollisionDetection (sha1dc)"
    - "USE_SHA256=OpenSSL"
    - "USE_BUNDLED_ZLIB=OFF (使用 conan zlib)"
    - "USE_SSH=OFF (上游要求 libssh2>=0.28 新 API，保持最小依赖)"
    - "USE_GSSAPI=OFF / USE_NTLMCLIENT=OFF / USE_ICONV=OFF"
    - "REGEX_BACKEND 走上游自动检测（OHOS 上解析为 bundled PCRE2/builtin）"
    - "USE_THREADS=ON"
  dependencies:
    - openssl/3.5.6.1
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libgit2-tools 即 libgit2 源码树 BUILD_CLI=ON 产出的 git2 CLI（openSUSE/Debian 拆包命名）"
  - "OHOS conan CMakeToolchain 自动设置 CMAKE_SYSTEM_NAME=HarmonyOS；soname/rpath 规则需用 CMAKE_USER_MAKE_RULES_OVERRIDE_C 补齐（同 libssh2 配方做法）"
  - "find_package(OpenSSL)/find_package(ZLIB) 用 OPENSSL_ROOT_DIR/OPENSSL_SSL_LIBRARY 等缓存变量指向 conan 依赖"
  - "musl regcomp 后端双重 regfree 段错误：上游 REGCOMP 后端 git_regexp_dispose 为裸 regfree，userdiff 测试循环 compile→dispose 后 cleanup 再 dispose 触发 musl regfree 双重释放崩溃；改用上游默认自动检测（OHOS 上=bundled PCRE2）即安全——上游测试通过 3010+41+446"
  - "上游测试为 clar 套件（单二进制 libgit2_tests + util_tests + headertest，ctest 11 个标签入口），CI 交叉环境不执行，本地实测"
