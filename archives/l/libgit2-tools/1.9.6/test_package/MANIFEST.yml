# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libgit2-tools/1.9.6
homepage: "https://github.com/libgit2/libgit2"

# 上游测试命令
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（libgit2 clar 套件，由独立二进制 libgit2_tests 承载）
upstream_tests:
  - file: tests/libgit2/main.c
    source: libgit2-1.9.6/tests/libgit2/main.c
    description: "clar test harness entry"
    command: "./libgit2_tests -v"
  - file: tests/libgit2/clar/clar.c
    source: libgit2-1.9.6/tests/libgit2/clar/clar.c
    description: "clar framework implementation"
    command: "./libgit2_tests -v"
  - file: tests/libgit2/repository/init.c
    source: libgit2-1.9.6/tests/libgit2/repository/init.c
    description: "repository init/creation tests"
    command: "./libgit2_tests -vs repo::init"
  - file: tests/libgit2/repository/open.c
    source: libgit2-1.9.6/tests/libgit2/repository/open.c
    description: "repository open tests"
    command: "./libgit2_tests -vs repo::open"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_git2.c
    description: "运行 git2 --version 验证二进制可执行"
    command: "conan test"

# 测试断言总数（上游 tests/libgit2 + tests/util clar 套件断言）
assertion_count: 7278
