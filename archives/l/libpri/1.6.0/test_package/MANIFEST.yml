# test_package/MANIFEST.yml — libpri 1.6.0
# CI L0e requires this file to exist; its job here is to declare the upstream
# test inventory that the recipe runs from build().

package: libpri/1.6.0
homepage: "https://www.asterisk.org/"

# Upstream ships no `check`/`test` target. The Makefile goals are exactly
# all / update / install / uninstall / pritest / testprilib / pridump /
# rosetest / clean (grep -nE '^[A-Za-z_.-]+:' Makefile). There is no test
# framework (no ctest/gtest/Catch2/CppUTest anywhere in the tree).
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "./rosetest && ./testprilib"

# `make all` builds UTILITIES = pridump pritest rosetest testprilib.
#   pritest  : includes <dahdi/user.h> + <dahdi/tonezone.h> and opens
#              /dev/dahdi/*; DAHDI is a Linux kernel driver, absent on OHOS
#              and not shipped in the tarball -> cannot be built at all.
#   pridump  : diagnostic utility (also includes <dahdi/user.h>), not a test.
# The recipe therefore builds/executes only the two portable programs.
upstream_tests:
  - program: rosetest
    cases: 267
    status: run
    kind: data-driven ROSE encode/decode round-trip
    breakdown: >-
      143 rose_etsi_msgs + 112 rose_qsig_msgs + 4 rose_dms100_msgs
      + 2 rose_ni2_msgs + 6 rose_test_exception() decode cases
    oracle: >-
      rosetest's main() unconditionally returns 0 and reports per-case
      failures through pri_error(); the recipe counts the 267
      "Message <n> encoded length is <len>" markers and rejects the run if
      any "Error: Message:<n> ..." / "test: Message failed to decode" /
      "did not match" marker appears.
    command: "./rosetest"
  - program: testprilib
    cases: 1
    status: run
    kind: BRI point-to-multipoint loopback smoke test
    oracle: >-
      Two libpri stacks (PRI_NETWORK + PRI_CPE) joined by socketpair(),
      driven by two threads for 5 s. No assertion counter upstream: the
      recipe requires the protocol event trace
      ("Network is up.  Sending blast of calls!", "Setup 1 calls!",
      "PRI 2: PRI_EVENT_RING (5)", "PRI 1: PRI_EVENT_RINGING (7)")
      and fails the build if any of them is missing.
    command: "./testprilib"
  - program: pritest
    cases: 1
    status: not_run
    reason: >-
      Requires the DAHDI kernel driver plus <dahdi/user.h> and
      <dahdi/tonezone.h>; DAHDI is Linux-only, is not part of OHOS and is not
      shipped in the release tarball, so the program cannot even be compiled
      here (upstream `make all` fails on OHOS for this reason).

# test_package tests (consumer perspective, links the installed library)
test_package_tests:
  - file: test_libpri.c
    description: >-
      Drives the installed libpri through libpri.h: packaged version
      fingerprint (1.6.0), event/cause/switch/node string helpers, the
      pri_sr_* SETUP-request lifecycle, controller/call-record creation on a
      socketpair, pri_dump_info_str(), and a real Q.921/Q.931 exchange between
      a PRI_NETWORK and a PRI_CPE stack (SETUP -> RING with the dialled
      number, ALERTING -> RINGING back).
    command: "./test_libpri"

# 28 CHECK() macro call sites in test_libpri.c; 27 execute on the passing
# path — the 28th sits in the failure-only `else` branch that guards the
# loopback when a controller could not be created.  None of them is inside a
# loop, so the runtime count printed by the binary is exactly 27
# ("<n> checks, <n> failed"; see reports/conan-create.log).
assertion_count: 27
