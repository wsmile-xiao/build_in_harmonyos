# conandata.yml — libpri 1.6.0
#
# 上游：Asterisk 项目（Digium/Sangoma）的 Primary Rate ISDN 协议库。
# 发行物取自项目官方发行目录（downloads.asterisk.org/pub/telephony/libpri/releases/），
# 该目录同时提供 tar.gz 与 tar.gz.asc。sha256 由本任务从官方站点下载后计算，
# 并与 conan create 实际下载物逐字节核对（见 reports/）。
#
# 注：本文件注释中不写带 scheme 的地址——与 tarball 同前缀的裸字符串会被
# ci/conan/build_and_test.sh 的本地源预下载步骤当作源地址改写，连带改坏 tarball 地址
# （libfilteraudio 实测，E577）。

sources:
  url: "https://downloads.asterisk.org/pub/telephony/libpri/releases/libpri-1.6.0.tar.gz"
  sha256: "7225ea7ec334a115f9dc08e71f55589c38cb4e00b13964cd2f08cc4e6123e3f6"

patches:
  "1.6.0":
    - patch_file: "patches/0001-Makefile-parameterize-archiver.patch"
      patch_description: >-
        Makefile: 归档器改为 $(AR)/$(RANLIB) 变量（默认仍是 ar/ranlib），
        使配方可从 Conan conf 注入 LLVM 工具链
      patch_type: "portability"
    - patch_file: "patches/0002-testprilib-use-posix-signal-header.patch"
      patch_description: >-
        testprilib.c: <sys/signal.h> 改为 POSIX 的 <signal.h>；
        OHOS sysroot 对前者发 #warning，被上游 -Werror 升级为编译错误
      patch_type: "portability"
