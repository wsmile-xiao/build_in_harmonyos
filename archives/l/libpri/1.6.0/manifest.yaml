# 版本级 manifest — libpri 1.6.0
# ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.6.0"
software: "libpri"
status: built
build_date: "2026-09-16"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方发行 tarball（Asterisk 项目发行目录，HTTPS）
  url: "https://downloads.asterisk.org/pub/telephony/libpri/releases/libpri-1.6.0.tar.gz"
  sha256: "7225ea7ec334a115f9dc08e71f55589c38cb4e00b13964cd2f08cc4e6123e3f6"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 上游根 Makefile，无 configure；配方直接驱动 make 并从 Conan conf 注入
  # CC/AR/RANLIB（R33），并用 UTILITIES= 只构建两个可移植测试程序。
  configure_options:
    - "CC=<tools.build:compiler_executables:c>"
    - "AR=<tools.build:compiler_executables:ar|llvm-ar>"
    - "RANLIB=<tools.build:compiler_executables:ranlib|llvm-ranlib>"
    - "LDCONFIG=true"
    - 'UTILITIES="rosetest testprilib"'
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Makefile-parameterize-archiver.patch"
  - "0002-testprilib-use-posix-signal-header.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Makefile 包若把归档器写成字面 `ar rcs` / `ranlib`，交叉编译时用的是 PATH 上碰巧存在的宿主 binutils；把该行参数化为 `$(AR)`/`$(RANLIB)` 后可从 Conan conf 注入 llvm-ar/llvm-ranlib（本包 0001 补丁）"
  - "上游 `make all` 默认构建的 UTILITIES 里有个别程序依赖平台专有内核头（libpri 的 pridump/pritest 需要 <dahdi/user.h>，DAHDI 是 Linux 内核驱动）时，`make all` 在 OHOS 必然失败；用命令行 UTILITIES=\"...\" 只构建可移植子集，无需改动上游 Makefile"
  - "OHOS sysroot 对 `<sys/signal.h>` 这类重定向头只发 `#warning`；上游带 `-Werror` 时该警告升级为硬错误（libpri testprilib.c 实测），最小修法是改成 POSIX 的 `<signal.h>` 而不是关掉 -Werror"
  - "上游测试程序可能恒返回 0（libpri rosetest 的 main() 无条件 return 0，失败只经 pri_error 打印）；此类测试必须把判据建在输出上（用例计数 + 精确失败标记正则），退出码不可作为 oracle"
