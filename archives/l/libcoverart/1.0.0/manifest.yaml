software: libcoverart
version: "1.0.0"
build_system: cmake
status: built
source:
  url: "https://github.com/metabrainz/libcoverart/archive/refs/tags/release-1.0.0.tar.gz"
  sha256: "cc830e265fef0f77ed172705bb60ca705a4237d02c0454d3ee4952e1de98eb76"
build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF (default; neon ships non-PIC static only)"
  dependencies:
    - "neon/0.34.0"
    - "jansson/2.15.1.1 (repo-unique, same upstream v2.15.1, zero tool_requires)"
    - "libxml2/2.15.3.1 (build-time code generator only)"
    - "zlib/1.3.1.1 (override via neon, repo-unique)"
    - "expat/2.8.2.1 (override via neon, repo-unique)"
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "libcoverart 1.0.0 tag tarball already uses xmlParser.cpp (master-only staleness)"
  - "upstream registers no CTest tests; offline ctest binary gates the build instead"
notes: >-
  首次适配 (R37: 上游版本 1.0.0)。CMake 构建；配方内做两处可移植调整
  (cmake_minimum_required 2.6 -> 3.5；去掉 -Werror)，无 patches/ 目录。
  上游 tests/cctest 的 6 个在线抓取场景需公网，未纳入门禁，
  详见 notes.md 与 test_package/MANIFEST.yml。
