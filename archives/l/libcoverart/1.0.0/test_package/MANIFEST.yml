# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcoverart/1.0.0
homepage: "https://github.com/metabrainz/libcoverart"

# 上游无 CTest 注册、无 make check 目标：tests/ 下是两个手工测试程序，
# 由顶层 add_subdirectory(tests) 随构建编译。离线可跑的部分在 build() 中执行。
upstream_check_command: "./tests/ctest (hand-rolled binary, no CTest registration)"
upstream_test_in_build: true
upstream_test_command: "./tests/ctest (offline C-API: new/get_version/delete)"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/ctest.c
    source: libcoverart-release-1.0.0/tests/ctest.c
    description: "C API offline lifecycle: new/get_version/delete, prints Version, exit 0"
    command: "./tests/ctest"
  - file: tests/test.cc
    source: libcoverart-release-1.0.0/tests/test.cc
    description: "C++ API online scenarios (ReleaseInfo + 5 image fetches vs Cover Art Archive)"
    command: "./tests/cctest (built but not gated: requires public internet)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_c.c
    description: "消费者测试: C API new/version/proxy/lastresult/clone/delete（8 断言，离线）"
    command: "./test_c"
  - file: test_cc.cpp
    description: "消费者测试: C++ API Version/LastResult/LastHTTPCode/LastErrorMessage/proxy（8 断言，离线）"
    command: "./test_cc"

# 测试断言总数 (test_package 内 PASS 检查数: 8 + 8)
assertion_count: 16
