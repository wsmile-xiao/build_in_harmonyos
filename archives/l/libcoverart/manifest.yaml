software: libcoverart
display: "libcoverart"
description: "C/C++ client library for the MusicBrainz Cover Art Archive"
category: multimedia
homepage: "https://github.com/metabrainz/libcoverart"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建；cmake_minimum_required 2.6 -> 3.5，去掉 -Werror（配方内处理，无补丁）"
    - "默认静态：neon/0.34.0 仅提供非 PIC 静态库"
    - "依赖 neon + jansson + libxml2（libxml2 仅用于构建时代码生成器）"
  common_dependencies:
    - neon
    - jansson
    - libxml2

versions:
  "1.0.0":
    status: built
    build_date: "2026-09-16"
