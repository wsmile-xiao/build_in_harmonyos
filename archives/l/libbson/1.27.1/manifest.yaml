software: libbson
version: "1.27.1"
status: published
build_date: "2026-06-01"
build_system: cmake

source:
  url: "https://download.savannah.nongnu.org/releases/libbson/libbson-1.27.1.tar.gz"
  sha256: "cc97407b16da54ba9b27029237b9a7a13651ada04da15e3b5dcd8fee8db20eed"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DENABLE_MONGOC=OFF"
    - "-DENABLE_TESTS=OFF"
    - "-DENABLE_EXAMPLES=OFF"
    - "-DENABLE_UNINSTALL=OFF"
    - "-DENABLE_HTML_DOCS=OFF"
    - "-DENABLE_MAN_PAGES=OFF"
    - "-DENABLE_MAINTAINER_FLAGS=OFF"
    - "-DENABLE_TRACING=OFF"
    - "-DENABLE_COVERAGE=OFF"
    - "-DENABLE_DEBUG_ASSERTIONS=OFF"
    - "-DENABLE_STATIC=ON"
    - "-DENABLE_SHARED=ON"
    - "-DENABLE_STATIC_LIBBSON_INSTALL=ON"
    - "-DENABLE_SHARED_LIBBSON_INSTALL=ON"
    - "-DUSE_SYSTEM_LIBBSON=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libbson is part of mongo-c-driver; Savannah release tarball includes all generated cmake modules"
  - "Savannah tarball (download.savannah.nongnu.org) includes build/cmake/ modules; GitHub archive does NOT"
  - "ohc-run.py build re-initializes .work directory, causing build/cmake/ subdirectory to be lost"
  - "Must use Mode B (manual cmake/make) to avoid .work re-initialization clearing cmake modules"
  - "If .work directory is re-initialized, copy build/cmake/ from .orig directory to restore modules"
  - "bson_append_oid() requires a valid bson_oid_t pointer; NULL triggers precondition assertion"

packaging:
  release: "libbson-1.27.1-ohos-aarch64.tar.gz"
  release_size: 2310005
  debug: "libbson-1.27.1-ohos-aarch64-debug.tar.gz"
  debug_size: 253498
  contents:
    - "lib/libbson-1.0.so.0.0.0 (shared, 222KB)"
    - "lib/libbson-static-1.0.a (static, 460KB)"
    - "include/libbson-1.0/ (28 headers)"
    - "lib/pkgconfig/libbson-1.0.pc"
    - "lib/pkgconfig/libbson-static-1.0.pc"
    - "lib/cmake/bson-1.0/ (7 cmake configs)"
    - "lib/cmake/libbson-1.0/"
    - "lib/cmake/libbson-static-1.0/"
    - "share/mongo-c-driver/COPYING"
    - "share/mongo-c-driver/THIRD_PARTY_NOTICES"

elf_info:
  format: "ELF64 AArch64 LSB"
  soname: "libbson-1.0.so.0"
  rpath: "$ORIGIN:$ORIGIN/external"
  signed: true
  stripped: true
  debug_link: "libbson-1.0.so.0.0.0.debug"
  exported_symbols: 247

