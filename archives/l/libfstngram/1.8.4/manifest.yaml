software: libfstngram
version: "1.8.4"
status: built
build_system: autotools
build_date: "2026-09-20"

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://openfst.org/twiki/pub/FST/FstDownload/openfst-1.8.4.tar.gz"
  sha256: "a8ebbb6f3d92d07e671500587472518cfc87cb79b9a654a5a8abb2d0eb298016"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  # 行内流式列表：overlay 的 clean_verify G0 解析不支持 YAML 块列表（已知告警），
  # 行内形态与"空表字面量不当选项"修正同源，故此处不写块列表。
  configure_options: ["--enable-ngram-fsts", "--enable-bin", "--enable-static", "--disable-shared"]
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-flags-help-exit.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "libfstngram 是 openfst-1.8.4 的 NGramFst 扩展子库（libfstngram.so.26 / libfstngram.a），源码包同 openfst-1.8.4.tar.gz；configure --enable-ngram-fsts 单独打开本扩展"  # knowledge_ref: E596
  - "同 tarball 子包的上游 N 必须按父 tarball 全量清点面取最大值：openfst-1.8.4 用例口径 10 > 注册口径 7（src/test/Makefile.am check_PROGRAMS/TESTS = BUILD.bazel cc_test = 7）> 源文件口径 3；algo_test.cc 另有 3 个未注册 TEST_* 分支（left/right string、gallic）必须逐项归因，否则按父 tarball 全量注册面复核会被判少报"  # knowledge_ref: E596
  - "上游 10 个测试程序是 openfst 整体测试：链接 libfst.a 时必须用 -Wl,--whole-archive / -Wl,--no-whole-archive 包夹，否则 REGISTER_FST 静态 registerer 被链接器剔除，Fst::Read 回退 dlopen(\"vector-fst.so\") 假败"  # knowledge_ref: E596
  - "OHOS/toybox 的 install 在 HMDFS 上 `-c` 直接失败（Error 64）且无 GNU install：make install 须用 install shim（cp/mkdir）+ sed 改各 Makefile 的 INSTALL 变量，chmod 步骤容错跳过"  # knowledge_ref: E182
  - "config.guess/config.sub 需识别 aarch64-unknown-linux-ohos；configure 的 umask 077 临时目录在 HMDFS 上不可写，须改 umask 022"  # knowledge_ref: E011
