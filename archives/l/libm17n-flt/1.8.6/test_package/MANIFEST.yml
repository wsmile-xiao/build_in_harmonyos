# test_package/MANIFEST.yml — libm17n-flt 1.8.6 适配验证清单
#
# 上游测试来源声明：
#   - build_system: autotools（configure.ac，m17n-lib 1.8.6）
#   - 上游无独立自动化测试套件（无 make check 目标）
#   - 本适配以消费者用例为准：m17n init/fini + FLT + 编码列表查询 roundtrip
#
# test_package 消费者用例（新增）：
#   test_m17n_flt.c — m17n_init + m17n_init_flt + mconv_list_codings + m17n_fini_flt/fini
package: libm17n-flt/1.8.6
homepage: https://www.nongnu.org/m17n/

upstream_test_in_build: false
upstream_tests: []
test_package_tests:
  - name: m17n-init-flt-list
    command: "./test_m17n_flt"
    assertions:
      - "m17n_init 初始化成功"
      - "m17n_init_flt（FLT 子系统）初始化成功"
      - "mconv_list_codings 返回 >=0（编码列表可查询）"
      - "m17n_fini_flt + m17n_fini 生命周期完整"
