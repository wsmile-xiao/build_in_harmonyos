software: libm17n-flt
version: "1.8.6"
build_system: autotools
status: built
build_date: "2026-09-14"

source:
  url: "https://download.savannah.gnu.org/releases/m17n/m17n-lib-1.8.6.tar.gz"
  sha256: "7129fe3b7ad500f88b8af8605ef07b96c87a75ec986a695fffc0a409f44a7c86"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build/--host=aarch64-unknown-linux-ohos --disable-nls --disable-gui --without-libotf --without-fontconfig --without-gd"
  cc: clang

patches_applied:
  - "0001-configure-umask.patch"

knowledge_gained:
  - "libm17n-flt（m17n-lib 1.8.6）同一 tarball 产出 libm17n-flt/libm17n-core/libm17n 三库"
  - "config.guess 无法识别 HarmonyOS，需显式 --build/--host=aarch64-unknown-linux-ohos"
  - "--disable-nls 跳过内置 gettext intl（lock.h #pragma weak pthread_cancel 在 OHOS musl 无该符号）"
  - "--disable-gui --without-libotf/fontconfig/gd 禁用可选重依赖（X11/OTF/freetype/fontconfig）"
  - "符号三库分散（flt=FLT 符号、core=数据符号、m17n=核心函数），package_info 三者全链"
  - "mconv_list_codings(NULL) 在 OHOS 段错误需传合法缓冲；M17N_INIT() 宏依赖内部符号编译失败"

package_contract:
  libraries: ["m17n-flt", "m17n-core", "m17n"]
  pkg_config: ["m17n-flt.pc"]
  headers: ["m17n.h", "m17n-flt.h"]

test_results:
  type: consumer
  total: 4
  passed: 4
  failed: 0
  note: "上游无自动化测试套件；test_package 消费者 4 断言（m17n init/flt/list/fini roundtrip）"
