patches:
  "0.32":
    - patch_file: "patches/0001-cmake-complete-upstream-tests.patch"
      patch_description: "Repair early CMake target properties and register the complete four-test upstream suite"
      patch_type: "portability"
    - patch_file: "patches/0002-testlo-writable-unix-socket.patch"
      patch_description: "Run the upstream Unix socket test under the writable TMPDIR instead of read-only /tmp"
      patch_type: "portability"
    - patch_file: "patches/0003-bidirectional-tcp-bounded-ephemeral-ports.patch"
      patch_description: "Use per-run TCP ports and bounded receives so the upstream bidirectional test cannot hang indefinitely"
      patch_type: "portability"
