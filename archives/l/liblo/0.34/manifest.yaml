软件名称: liblo
版本: "0.34"
分类: 音频/网络
描述: 轻量级 OSC (Open Sound Control) 实现，用于实时音频/音乐软件通信
主页: https://liblo.sourceforge.net/
源码地址: https://download.savannah.nongnu.org/releases/liblo/liblo-0.34.tar.gz

构建系统: cmake
配置参数:
  - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
  - "-DENABLE_DOXYGEN=OFF"

依赖: []
提供:
  - liblo.so (共享库)
  - oscdump (OSC 消息 dump 工具)
  - oscsend (OSC 消息发送工具)
  - oscsendfile (OSC 文件发送工具)

状态: 已编译
编译日期: "2026-05-20"
编译主机: aarch64-unknown-linux-ohos

