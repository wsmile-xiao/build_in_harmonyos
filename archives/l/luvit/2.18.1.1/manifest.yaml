software: luvit
version: "2.18.1.1"
status: built
build_date: "2026-07-20"

source:
  url: "https://github.com/luvit/luvit/archive/refs/tags/2.18.1.tar.gz"
  sha256: "b792781d77028edb7e5761e96618c96162bd68747b8fced9a6fc52f123837c2c"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "package Lua resources and upstream tests; external luvi runtime required for execution"
  dependencies:
    - luvi/2.12.0 (external runtime, not available in OHPCD Conan remote)
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Luvit 2.18.1.1 is a Lua application/module set for the luvi runtime, not a standalone C/C++ project."
  - "The upstream Makefile downloads lit and luvi to build self-contained binaries; OHPCD Conan currently has no luvi or lit recipe."
  - "This recipe packages official Lua resources plus the upstream tests/ tree and records the external luvi runtime boundary explicitly instead of fabricating a binary."
  - "package() writes .luvit-assets.json for every shipped resource; test_package verifies the full inventory, required entry points, and all 84 upstream tests/test-*.lua files even without luvi."
  - "tests/run.lua was run with official luvi 2.12.0 Linux x86_64: 249/250 TAP assertions pass, with 1 reproducible timing-sensitive failure in http-stream-finish. luvi 2.15.0 is incompatible with luvit 2.18.1's tests."
  - "OpenDesk is an aarch64 HarmonyOS device and luvi 2.12.0 has no published aarch64 asset; upstream execution on the device therefore depends on staging a compatible runtime."
  - "OpenDesk 2026-08-14 queue run passed the full resource inventory (257 files, 84 upstream tests) on head 87d8e446d; luvi 2.15.0 aarch64 downloads but cannot execute on the device, so tests/run.lua was explicitly skipped rather than claimed as passed."
