software: libjama
version: "1.2.5"
status: built
build_date: "2026-09-19"
build_system: header-only
conan_ref: "libjama/1.2.5"

source:
  url: "https://deb.debian.org/debian/pool/main/libj/libjama/libjama_1.2.5.orig.tar.bz2"
  sha256: "c07cf219d0980bba09a9801adfacd8abcbfffbe3f95604f9c9400796f657ab00"
  tar_format: tar.bz2

build:
  system: header-only
  build_command: "clang++ -std=c++17 -I src -I <libtnt>/include -c jama_headers_smoke.cpp"
  dependencies:
    - "libtnt/1.2.6"
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "none（上游仅提供 5 个头文件，无测试目录/check 目标）"
  upstream_discovered: 0
  upstream_passed: 0
  upstream_failed: 0
  upstream_note: "上游无测试；build() 编译包含全部公开头的 TU 作为编译证据"
  test_package_passed: 12
  test_package_failed: 0
  test_package_assertions: 12
  execution: "conan create rc=0 + 消费者 12 条数值断言（LU/QR/Cholesky/SVD/特征值）"

test_passed: 12
test_failed: 0

patches_applied:
  - "0001-jama-qualify-min-max.patch（std::min/std::max 限定 + 去掉头文件级 using namespace std + jama_cholesky.h 自包含）"

knowledge_gained:
  - "libjama 是纯头文件库（仅 5 个 jama_*.h），存储模板 Array1D/Array2D 来自 libtnt"
  - "已发布的 libtnt/1.2.6 Conan 包把 TNT 头平铺在 include/ 下，因此 jama 的非限定 #include \"tnt_*.h\" 无需额外头路径即可解析（无需像 Debian 那样改成 <tnt/...>）"
  - "老 C++ 头（C++11 前）同时 using namespace TNT 和 std，未限定的 min/max 在现代标准库下二义 → 限定 std::min/std::max 并删掉 using namespace std 即可（Debian 同思路）"
  - "上游 jama_cholesky.h 不自包含（缺 #include \"tnt.h\"，依赖调用方先包含 TNT）；补上后任意 jama 头都能单独包含"
  - "上游 tarball 不含 LICENSE 文件；JAMA 为 MathWorks/NIST 公共领域（Debian copyright 记为 public-domain），配方 license 用 LicenseRef-Public-Domain"
