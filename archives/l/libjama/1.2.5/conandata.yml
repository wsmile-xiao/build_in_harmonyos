patches:
  - patch_file: "patches/0001-jama-qualify-min-max.patch"
    patch_description: "JAMA/C++ predates C++11: the headers pull both TNT and std into scope and call an unqualified min()/max() that is ambiguous under a modern standard library (Debian carries the same fix). Qualify those calls as std::min/std::max, drop the header-level 'using namespace std;', and make jama_cholesky.h self-contained (upstream omitted the TNT include and relied on the caller)."
    patch_type: "portability"
