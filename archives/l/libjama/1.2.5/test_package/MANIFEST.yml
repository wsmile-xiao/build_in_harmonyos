# test_package/MANIFEST.yml
# libjama 1.2.5.
#
# Upstream ships no test suite: the source tree contains only the five public
# headers (no test/ directory, no check target).  The consumer program checks
# the numeric result of each decomposition instead.

package: libjama/1.2.5
homepage: https://math.nist.gov/tnt/

upstream_tests_exist: false
upstream_test_audit: "no tests/ directory and no check target; upstream distributes only src/jama/{jama_lu,jama_qr,jama_svd,jama_cholesky,jama_eig}.h"
upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_jama.cpp
    description: "LU solve/determinant/regularity, QR least squares, Cholesky factor and solve, SVD singular values/norm/rank, symmetric eigenvalues"
    command: "./libjama_consumer"

test_files:
  - path: "test_package/test_jama.cpp"
    test_type: "R34"
    assertion_count: 12

test_package_test_count: 1
consumer_assertion_count: 12
assertion_count: 12
