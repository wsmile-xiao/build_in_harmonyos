# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libappimage/1.0.4-5
homepage: "https://github.com/AppImage/libappimage"

# 上游测试命令 (ctest 全量 5 个测试二进制)
upstream_check_command: "ctest --output-on-failure --no-tests=error --timeout 120"

# conanfile.py build() 方法中已集成上游测试 (ctest 在 build() 尾部运行, env=conanrun)
upstream_test_in_build: true
upstream_test_command: "TMPDIR=<writable> HOME=<writable> ctest --test-dir <build_folder> --output-on-failure --no-tests=error --timeout 120"

# 上游实际运行的测试程序 (ctest 5/5 = 100% 通过, 2026-09-26)
upstream_tests:
  - file: tests/libappimage/TestLibappimage++.cpp
    source: libappimage-1.0.4-5/tests/libappimage
    description: "libappimage++ API 测试 (type/md5/payload offset/extract/read file/integration 等 48 项)"
    command: "./test_libappimage++"
    result: "PASS (48/48 OK; OHOS 适配: TMPDIR 化补丁 0009 + 测试数据截断自动恢复)"
  - file: tests/libappimage/legacy/test_libappimage.cpp
    source: libappimage-1.0.4-5/tests/libappimage/legacy
    description: "libappimage C API 测试 (get_type/get_md5/create_thumbnail/desktop integration 等)"
    command: "./test_libappimage"
    result: "PASS (全量 OK; OHOS 适配: TMPDIR 化 + XDG_CACHE_HOME fixture 覆盖补丁 0009)"
  - file: tests/libappimage/legacy/test-xdg-basedir.cpp
    source: libappimage-1.0.4-5/tests/libappimage/legacy
    description: "xdg-basedir 环境变量解析测试 (user_home/data/config/cache × default/custom 8 项)"
    command: "./test-xdg-basedir"
    result: "PASS (8/8 OK; OHOS 适配: musl environ realloc 导致上游测试 UAF, 补丁 0010 strdup 修复)"
  - file: tests/libappimage/shared/test_shared.cpp
    source: libappimage-1.0.4-5/tests/libappimage/shared
    description: "libappimage_shared 独立库测试"
    command: "./test_shared"
    result: "PASS (exit 0)"
  - file: tests/desktop-integration/TestDesktopIntegration.cpp
    source: libappimage-1.0.4-5/tests/desktop-integration
    description: "桌面集成端到端测试 (desktop file 安装/卸载/thumbnail, 需 TMPDIR)"
    command: "./TestDesktopIntegration"
    result: "PASS (全量 OK; OHOS 适配: TMPDIR 化补丁 0009)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：链接 libappimage.so, 调用 appimage_get_type (普通文件/Type-1/Type-2), appimage_get_md5, appimage_get_payload_offset (含构造的 Type-2 ELF 头 AI\\x02 签名)"
    command: "./test_package"
    result: "PASS (all checks passed)"

# 测试断言总数 (gtest TEST() 宏统计, 用于质量评估)
assertion_count: 116
