version: "1.0.4-5"
software: libappimage
build_system: cmake
status: built
build_date: "2026-09-26"

source:
  # Upstream release tag v1.0.4-5 (commit 7acfb43e150e); the tarball ships
  # without the gtest submodule, so gtest comes from the conan package.
  url: "https://github.com/AppImage/libappimage/archive/refs/tags/v1.0.4-5.tar.gz"
  sha256: "2c4e18860a790c5959da6eb064cbd07f165fe6a9b15989491a3a3f176d06af31"
  tar_format: tar.gz
  original_url: "https://github.com/AppImage/libappimage/releases/tag/v1.0.4-5"
  vendored_sources:
    # xdg-utils-cxx and squashfuse are not packaged in the Conan registry;
    # both are vendored into conandata.yml and built during build().
    - name: xdg-utils-cxx
      url: "https://github.com/azubieta/xdg-utils-cxx/archive/refs/tags/v1.0.1.tar.gz"
      sha256: "337231f7be7eba4cdcd01470e8ae82aa59c5345f0791ece2a0235810c132b2d4"
    - name: squashfuse
      url: "https://github.com/vasi/squashfuse/archive/1f980303b89c779eabfd0a0fdd36d6a7a311bf92.tar.gz"
      sha256: "8cef1539bd9c9efd3c407004fdd7a3bbef44102a5966b892819a275d609013a3"

build:
  system: cmake
  configure_options:
    - "-DUSE_SYSTEM_XZ=ON"
    - "-DUSE_SYSTEM_LIBARCHIVE=ON"
    - "-DUSE_SYSTEM_BOOST=ON"
    - "-DUSE_SYSTEM_SQUASHFUSE=ON"
    - "-DUSE_SYSTEM_XDGUTILS=ON"
    - "-DXDGUTILS_PREFIX=<build_folder>/prefix"
    - "-DLIBAPPIMAGE_DESKTOP_INTEGRATION_MODE=ON"
    - "-DBUILD_TESTING=ON"
  dependencies:
    - glib/2.84.0.1 (conan, cnb 制品仓; librsvg 强制版本)
    - cairo-gobject/1.18.4.3 (conan, cnb 制品仓; 仓库惯例的 cairo 提供者)
    - zlib/1.3.1.1 (conan, cnb 制品仓; OHOS -fPIC 重建版, 与 glib 一致)
    - librsvg/2.62.3.1 (conan, cnb 制品仓)
    - libarchive/3.8.7 (conan, cnb 制品仓)
    - boost/1.90.0.2 (conan, cnb 制品仓)
    - xz/5.6.2 (conan, cnb 制品仓; 与 libarchive/libtiff 一致; 自定义 liblzma.pc 补 pkg_config_name 缺失)
    - gtest/1.17.0.2 (conan, cnb 制品仓; 替代源码 tarball 中缺失的 gtest 子模块)
  tool_requires:
    - automake/1.18, autoconf/2.72, libtool/2.5.4.1 (squashfuse autotools 构建)
    - libfuse/2.9.9 (squashfuse configure 链接检查; 静态库, 运行时仅 dlopen)
    - desktop-file-utils/0.28 (BUILD_TESTING 需要 desktop-file-validate)
  cc: clang
  test: "conan create + test_package 全部通过; 上游 ctest 5/5 (100%) 通过"

patches_applied:
  - "0001-cmake-minimum-version.patch"
  - "0002-libarchive-find-package.patch"
  - "0003-xdgutils-prefix-escape.patch"
  - "0004-gtest-find-package.patch"
  - "0005-cairo-pkgconfig-name.patch"
  - "0006-lightelf-begindecls.patch"
  - "0007-libcxx-compat.patch"
  - "0008-pathmax-boostfstream.patch"
  - "0009-tmpdir-aware-tests.patch"
  - "0010-xdg-basedir-environ-uaf.patch"

knowledge_gained:
  - "CMake 4.x 拒绝 cmake_minimum_required(VERSION 3.0-3.4)，8 处统一提升到 3.5"
  - "CMakeDeps 生成的 libarchive 配置名为 libarchive，上游的 LibArchive 名称找不到"
  - "xz recipe 无 pkg_config_name → PkgConfigDeps 不会生成 liblzma.pc，需在 generate() 手写"
  - "cairo-gobject/1.18.4.3 是仓库惯例的 cairo 提供者（合并构建），pkg-config 模块名为 cairo-gobject"
  - "OHOS XPM 会 SIGKILL 未签名的可执行文件与共享库，ctest 前需签名 build tree 二进制与 .so"
  - "OHOS /tmp 只读，ctest 前需将 TMPDIR/HOME 指向可写目录；上游测试硬编码 /tmp 需 TMPDIR 化"
  - "squashfuse 需先应用 squashfuse.patch 再应用 squashfuse_dlopen.patch（后者依赖前者的改动）"
  - "OHOS 6.0 native libc 是 musl（非 bionic）：pthread_cancel/pthread_setcancelstate 未实现，需 no-op 桩静态合入 .so"
  - "musl setenv/unsetenv 会 realloc environ 数组，上游测试缓存 getenv() 指针后使用 → 悬垂指针 UAF（glibc 不触发），需 setenv 前 strdup"
  - "libc++ 的 std::istream 无默认构造函数（libstdc++ 有），PayloadIStream 需显式初始化；streambuf 移动操作不能用 libstdc++ 私有成员 _M_in_beg 等"
  - "新版 boost::filesystem 不再传递包含 boost/filesystem/fstream.hpp，测试代码需显式包含"
  - "Conan 2 VirtualRunEnv 仅在 require.run=True 时把 libdir 加入 LD_LIBRARY_PATH（默认 False），运行时依赖必须声明 run=True"
  - "Conan 2 build() 中 source_folder == build_folder（installer.py copytree 后 set_base_source 指向 build），cmake 在 build 目录配置是正确行为"
  - "/storage/Users 的 tmpfs overlay 在 conan copytree 时偶发截断大文件（测试数据），需从 source 缓存恢复"
  - "OHOS 系统级导出 XDG_* 环境变量会泄漏进测试；上游 fixture 只覆盖 HOME/XDG_DATA_HOME/XDG_CONFIG_HOME，thumbnail 测试依赖 xdg_cache_home() 回退 HOME，fixture 需补齐 XDG_CACHE_HOME"
