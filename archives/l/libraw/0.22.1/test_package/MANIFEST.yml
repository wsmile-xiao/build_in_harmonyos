# test_package/MANIFEST.yml — libraw 0.22.1
# CI L0e 要求此文件存在（上游测试声明）
# 详见: docs/TEST_QUALITY_SPEC.md

package: libraw/0.22.1
homepage: "https://www.libraw.org/"

# 上游测试命令 (LibRaw autotools 项目无 make check 目标)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (LibRaw 无自动化测试套件; samples/ 含示例程序
# dcraw_emu/raw-identify 等，需手动运行于实际 RAW 文件，非自动化测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test.c
    description: >-
      LibRaw C API 冒烟测试: 调用 libraw_init/open_buffer/strerror/
      version/versionNumber/recycle/close，验证头文件包含、动态库符号链接
      与运行时解析（open_buffer 对空缓冲区返回非零错误码属预期行为）
    command: "./test_libraw"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
