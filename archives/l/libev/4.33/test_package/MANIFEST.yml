# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libev/4.33
homepage: "http://software.schmorp.de/pkg/libev.html"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: libev-4.33/自建测试
    description: "验证 libev 事件循环库核心API: ev_version_major/minor, ev_default_loop, ev_loop_destroy"
    command: "./test_libev"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 创建默认事件循环并销毁"
    command: "./test_libev"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
