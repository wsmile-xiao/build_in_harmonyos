# 软件级 manifest — archives/l/libhbalinux/manifest.yaml

software: libhbalinux
display: "libhbalinux"
description: "SNIA HBA API 的 FC 厂商库（基于 scsi_transport_fc sysfs）"
category: library
homepage: "http://www.open-fcoe.org"
license: LGPL-2.1-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游只发 autotools 源码（无 configure/Makefile.in/aclocal.m4）→ build() 先 autoreconf --install --force"
    - "环境有 autoconf/autoreconf/pkg-config/perl 但无 automake/aclocal/libtoolize → tool_requires automake/1.18 + libtool/2.5.4（libhbaapi 同款）"
    - "configure.ac 探 pkg-config 模块 pciaccess，而 libpciaccess/0.19 无 pkg_config_name → 在 generators 目录生成 pciaccess.pc 别名（xf86-video-r128 先例）"
    - "libpciaccess 传递的 zlib/1.3.1 静态库非 PIC，无法链入本库 DSO（E541）→ self.requires('zlib/1.3.1.2', override=True)"
    - "E011：autoreconf 生成的 configure 中 umask 077 在 HMDFS 下不可写 → 程序化放宽为 022（icoutils 先例）"
    - "E007：显式 --build/--host 避开 config.guess"
    - "HBAAPI 只是编译期头文件依赖（Makefile.am 未用 HBAAPI_LIBS）→ DSO 的 DT_NEEDED 仅 libc.so"
    - "本库不安装头文件 → package_info() 需置空 includedirs，否则 CMakeDeps 报 non-existent path"
    - "上游 1.0.16 无测试与样例；OHOS 专属断言 = vendor 库可 dlopen + 无 /sys/class/fc_host 时不虚报适配器"
  common_dependencies:
    - libpciaccess
    - libhbaapi
    - zlib

versions:
  "1.0.16":
    status: built
    build_date: "2026-09-22"
    conan_ref: "libhbalinux/1.0.16"
