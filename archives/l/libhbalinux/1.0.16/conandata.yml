# 因此使用 Debian 归档保存的上游 orig tarball（与 archives/l/libhbaapi/2.2.9
# 同源同做法，该包已合并且上游版本一致：libhbalinux 1.0.16-2 == upstream 1.0.16）。
sources:
  url: "https://deb.debian.org/debian/pool/main/libh/libhbalinux/libhbalinux_1.0.16.orig.tar.gz"
  sha256: "e0d8fabcd8a74d76a8f768eb1dfedadbe0c71b3d55bfc255c8cdd74176c150f6"

# 无需源码补丁：autotools 引导、umask(E011)、pc 模块名别名、zlib PIC 覆盖
# 均在 conanfile.py 内程序化处理。
patches: {}
