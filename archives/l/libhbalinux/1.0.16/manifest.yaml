# 版本级 manifest — archives/l/libhbalinux/1.0.16/manifest.yaml

version: "1.0.16"
software: libhbalinux
status: built
build_date: "2026-09-22"
build_system: autotools
conan_ref: "libhbalinux/1.0.16"

source:
  url: "https://deb.debian.org/debian/pool/main/libh/libhbalinux/libhbalinux_1.0.16.orig.tar.gz"
  sha256: "e0d8fabcd8a74d76a8f768eb1dfedadbe0c71b3d55bfc255c8cdd74176c150f6"
  tar_format: tar.gz
  upstream_note: >
    上游 Open-FCoE 的下载目录已下线：http(s)://www.open-fcoe.org/openfc/libhbalinux-1.0.16.tar.gz
    → 301 → 404；http://downloads.open-fcoe.org/ DNS 不解析；GitHub 无官方仓库（404）。
    因此使用 Debian 归档保存的 upstream pristine orig tarball（42605 B，sha256 与上游一致，
    未做发行版二次改造；与已合并先例 libhbaapi/2.2.9 同源同做法）。
    用户已批准该 R39 例外：提交时以 OHC_PREFLIGHT=0 跳过 preflight PF7 闸，理由见本段与 notes.md。

build:
  system: autotools
  build_command: >
    autoreconf --install --force &&
    ./configure --build=aarch64-unknown-linux-gnu --host=aarch64-linux-ohos &&
    make -j2 && make install
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-linux-ohos"
    - "--enable-shared（由 Conan AutotoolsToolchain 依据 options.shared 注入）"
  dependencies:
    - libpciaccess/0.19
    - libhbaapi/2.2.9
    - zlib/1.3.1.2      # override：libpciaccess 钉的 zlib/1.3.1 静态库非 PIC（E541）
  tool_requires:
    - automake/1.18
    - libtool/2.5.4
  cc: clang

test_results:
  target: "OpenHarmony aarch64（OHOS SDK 26.0.0.18，clang 15.0.4）"
  upstream_framework: "none — 上游 1.0.16 无 tests/ 目录、无 TESTS/check_PROGRAMS、无样例程序"
  upstream_discovered: 0
  upstream_passed: 0
  upstream_failed: 0
  upstream_skipped: 0
  upstream_note: >
    grep -nE 'TESTS|check_PROGRAMS|check-local|BUILD_TESTING|pytest' Makefile.am configure.ac → rc=1（无匹配）；
    tar tzf 上游 tarball 28 条目录项内无 test/ 或 tests/。SNIA 的示例程序（hbaapitest/hbasample）
    属于 libHBAAPI 工程，不随本库发布（libhbaapi/2.2.9 已单独适配并执行）。
    上游唯一可执行路径是 Makefile.am 的 install-data-hook（安装期改写 ${sysconfdir}/hba.conf），
    已在 make install 中真实执行并留证（OHOS 上 /etc 只读且无该文件 → 仅打印 WARNING，非致命）。
  test_package_passed: 11
  test_package_failed: 0
  test_package_assertions: 11
  test_package_ohos_specific: 3
  execution: "conan create rc=0；消费者断言 11/11（含 OHOS dlopen 契约 2 条 + OHOS sysfs 事实 1 条）"

test_passed: 11
test_failed: 0

patches_applied:
  - "（程序化）autoreconf 生成的 configure 中 umask 077 → 022（E011）"
  - "（程序化）生成 pciaccess.pc 别名：libpciaccess/0.19 未设置 pkg_config_name（xf86-video-r128 先例）"

knowledge_gained:
  - "上游只发 autotools 源码（无 configure/Makefile.in/aclocal.m4，名为 CONFIGURE 的文件其实是 INSTALL 文本）→ 必须先 autoreconf --install --force"
  - "环境（设备与 CI 同镜像）自带 autoconf/autoreconf/pkg-config/perl，但没有 automake/aclocal/libtoolize → tool_requires automake/1.18 + libtool/2.5.4（libhbaapi/2.2.9 同款）"
  - "configure.ac 探 pkg-config 模块 pciaccess，而 libpciaccess/0.19 未声明 pkg_config_name，PkgConfigDeps 只产出 libpciaccess.pc → 在 generators 目录生成 pciaccess.pc 别名（xf86-video-r128 先例）"
  - "libpciaccess 钉死 zlib/1.3.1，其静态 libz.a 未用 -fPIC 编译，链入本库 .so 时 aarch64 报 R_AARCH64_ADR_PREL_PG_HI21/z_errmsg（E541）→ self.requires('zlib/1.3.1.2', override=True)（同时保持 zlib 静态，避免与系统 libz.so 冲突，R26）"
  - "autoreconf 生成的 configure 含 umask 077 + mktemp -d，HMDFS setgid 挂载下 config.status 报 'could not setup config files machinery'（E011）→ 程序化放宽为 022（icoutils/libhbaapi 先例）"
  - "config.guess 在 HMDFS 上无法创建临时文件（E007）→ generate() 显式传 --build/--host"
  - "HBAAPI 是编译期头文件依赖而非链接依赖：Makefile.am 只用 $(HBAAPI_CFLAGS)，AC_SUBST 未导出 HBAAPI_LIBS → 本库 .so 的 DT_NEEDED 只有 libc.so"
  - "vendor 库的真实契约是 HBA_RegisterLibrary/HBA_RegisterLibraryV2 把处理函数表填回调用方（libHBAAPI 再调用这些 handler），test_package 完整复刻该路径"
  - "OHOS 无 /sys/class/fc_host → adapter_init() 不崩溃且适配器计数为 0；vendor 库可被 dlopen（libHBAAPI 经 /etc/hba.conf 动态加载），二者构成鸿蒙专属断言"
