# test_package/MANIFEST.yml
# libhbalinux 1.0.16
#
# 上游测试核验（R51 三步法）
#   * 清点：tarball = 28 条目录项（1 目录 + 27 文件；configure.ac / Makefile.am / *.c / *.h /
#     libhbalinux.pc.in / libhbalinux.spec.in / README / INSTALL / build.sh /
#     bootstrap.sh），没有 tests/ 目录。
#   * 注册目标：Makefile.am 只有 lib_LTLIBRARIES / pkgconfig_DATA /
#     install-data-hook，没有 TESTS 或 check_PROGRAMS；
#     configure.ac 只有两个 PKG_CHECK_MODULES，没有 AC_CONFIG_TESTDIR。
#     实测 `grep -nE 'TESTS|check_PROGRAMS|check-local|BUILD_TESTING|pytest'
#     Makefile.am configure.ac` 退出码 1（无匹配），`make check` 无该目标。
#   * SNIA 的示例程序（hbaapitest / hbasample）属于 libHBAAPI 工程，
#     不随 libhbalinux tarball 发布（libhbaapi/2.2.9 已单独适配并执行）。
#   ⇒ 上游无自动化测试、无样例程序可执行；本包的可执行验证面为 test_package/
#     （真实 vendor API 调用 + OHOS dlopen 契约），不冒充上游测试统计。

package: libhbalinux/1.0.16
homepage: http://www.open-fcoe.org

upstream_tests_exist: false
upstream_test_audit: "no tests/ directory in the tarball; Makefile.am declares no TESTS/check_PROGRAMS; grep TESTS|check_PROGRAMS|BUILD_TESTING -> rc=1 (no match); `make check` target does not exist"
upstream_check_command: "n/a (upstream provides no check target)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_libhbalinux.c
    description: "libHBAAPI 的实际调用契约：HBA_RegisterLibraryV2 填回处理函数表，再调用版本/加载/适配器计数/名称查询/打开/释放各 handler（case1-case7、case10）"
    command: "./test_libhbalinux"
  - file: test_libhbalinux.c
    description: "OHOS 平台契约：case8/case8b vendor DSO 可被 dlopen 且导出 HBA_RegisterLibraryV2；case9 无 /sys/class/fc_host 时不虚报适配器（OHOS 专属用例 3 条断言）"
    command: "./test_libhbalinux"

test_files:
  - path: "test_package/test_libhbalinux.c"
    test_type: "R34"
    assertion_count: 11
    ohos_specific_assertions: 3

test_package_test_count: 11
consumer_assertion_count: 11
assertion_count: 11
