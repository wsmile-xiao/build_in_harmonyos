version: "1.6.0"
software: libdvdcss
status: built
build_date: "2026-09-23"
build_system: meson

source:
  url: "https://code.videolan.org/videolan/libdvdcss/-/archive/1.6.0/libdvdcss-1.6.0.tar.bz2"
  sha256: "c43b5506604ab93e38fde11912c01239e00ba6331db0cf930acd1c204a57964f"

build:
  system: meson
  configure_options:
    - "default_library=static"
    - "enable_docs=false"
    - "enable_examples=false"
  dependencies: []

tests:
  upstream_tests: 0
  added_consumer_scenarios: 2
  added_consumer_assertions: 11

quality:
  elf_signed: true
  headers_installed: 2
  static_library: libdvdcss.a
  pc_file: libdvdcss.pc

notes:
  - "libdvdcss 1.6.0 已切换到 Meson 构建（>= 0.60.0），不再使用 autotools"
  - "meson.build 不声明 libdvdread 依赖，libdvdcss 可独立编译安装"
  - "OHOS 目标命中 linux cdrom 分支（linux/cdrom.h dvd_struct 检测），DVD ioctl 头检测通过"
  - "上游 test/ 目录仅含需真实 DVD 镜像的示例程序，CI 不运行，记 0 条可执行上游测试"
  - "公开头文件仅 dvdcss.h + dvdcpxm.h 两个，安装于 include/dvdcss/"

knowledge_gained:
  - "libdvdcss 1.5.0→1.6.0 构建系统从 autotools 迁移到 Meson，配方需按 meson 重写"
  - "VideoLAN 源码以 gitlab archive 形式发布于 code.videolan.org，download.videolan.org 为等价镜像"
  - "OHOS meson 交叉构建需注入 llvm-ar/llvm-ranlib 到 conan_meson_cross.ini 的 [binaries] 段"
