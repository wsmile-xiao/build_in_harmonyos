# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libpcap/1.10.1
homepage: "https://www.tcpdump.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testprogs/filtertest.c
    source: libpcap-1.10.1/testprogs/filtertest.c
    description: "BPF filter expression validation"
    command: "./filtertest <dlt> <expression>"
  - file: testprogs/findalldevstest.c
    source: libpcap-1.10.1/testprogs/findalldevstest.c
    description: "List all network devices"
    command: "./findalldevstest"
  - file: testprogs/capturetest.c
    source: libpcap-1.10.1/testprogs/capturetest.c
    description: "Basic packet capture test"
    command: "./capturetest"
  - file: testprogs/opentest.c
    source: libpcap-1.10.1/testprogs/opentest.c
    description: "pcap_open_live test"
    command: "./opentest"
  - file: testprogs/writecaptest.c
    source: libpcap-1.10.1/testprogs/writecaptest.c
    description: "pcap_dump_open write test"
    command: "./writecaptest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "HarmonyOS consumer test: pcap_open_dead, pcap_compile, pcap_datalink, pcap_setnonblock, pcap_fopen_dead"
    command: "./test_libpcap"

# 测试断言总数
assertion_count: 10
