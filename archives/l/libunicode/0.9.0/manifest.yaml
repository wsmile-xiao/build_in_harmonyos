software: libunicode
version: 0.9.0
status: built
build_system: cmake
configure_options:
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_INSTALL_PREFIX=$HOME/usr/local
  - -DLIBUNICODE_BUILD_STATIC=OFF
  - -DLIBUNICODE_TESTING=OFF
  - -DLIBUNICODE_TOOLS=OFF
  - -DLIBUNICODE_SIMD_IMPLEMENTATION=none
  - -DCMAKE_CXX_FLAGS=-stdlib=libc++
  - -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++ -lc++
dependencies: []
knowledge_gained:
  - Clang 15不支持std::format，需使用自定义format_compat.h兼容层
  - Clang 15不支持std::simd，需禁用SIMD实现
  - Clang 15不支持std::formatter特化，需移除Catch2测试相关代码
