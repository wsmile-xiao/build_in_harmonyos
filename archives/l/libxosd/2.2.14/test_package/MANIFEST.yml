package: libxosd/2.2.14
homepage: "https://sourceforge.net/projects/libxosd/"

# xosd 上游无独立 test suite；其 `make check` 仅覆盖 xmms/bmp 插件（不适用 OHOS）。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.c
    description: |
      Link libxosd and exercise the public API surface in a display-free way:
      read the osd_default_font / osd_default_colour global externs (no X
      server needed) and take the address of xosd_set_bar_length.  Validates
      that the shared object links, loads, and its transitive X11 / Xext /
      Xinerama dependencies resolve.
    command: "test_libxosd"

assertion_count: 2
