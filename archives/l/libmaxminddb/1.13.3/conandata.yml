# conandata.yml — libmaxminddb 1.13.3
# 单一事实源：源码 URL + SHA256 + 补丁声明。
# conanfile.py 通过 self.conan_data["sources"] 与 apply_conandata_patches() 读取。

sources:
  url: "https://github.com/maxmind/libmaxminddb/releases/download/1.13.3/libmaxminddb-1.13.3.tar.gz"
  sha256: "a66502ea76eadbe17f2cd6fd708946777253972d2ae8157dee1b23a2fb528171"

patches:
  - patch_file: "patches/0001-t-makefile-libtap-out-of-tree.patch"
    patch_description: "Use $(top_srcdir) in t/Makefile all-local/clean-local so out-of-tree (conan basic_layout) builds don't abort with 'cd libtap: No such file or directory' (E547)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-tmpdir.patch"
    patch_description: "config.status tmp dir fails on HMDFS setgid build dirs with 'umask 077 && mktemp -d ./confXXXXXX' (Permission denied on subs1.awk); relax umask to 007 and create tmp dir under ${TMPDIR:-$HOME/tmp}"
    patch_type: "portability"
