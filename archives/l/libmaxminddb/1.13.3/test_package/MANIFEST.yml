# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmaxminddb/1.13.3
homepage: "https://github.com/maxmind/libmaxminddb"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游测试为 aarch64 OHOS 交叉编译产物（configure --host=aarch64-linux-ohos），
# 无法在 x86_64 构建机执行（exec format error），须在 OHOS 真机/模拟器上运行
# （R51 测试台账见 notes.md）；conanfile.py build() 仅执行 configure + make，
# 未把 make check 编入配方构建。

# 上游实际注册的测试程序（t/Makefile.am TESTS：26 个 C 程序 + 3 个 Perl 脚本）
upstream_tests:
  - file: t/basic_lookup_t.c
    source: libmaxminddb-1.13.3/t/basic_lookup_t.c
    description: "基本 IP 查找与值解码（run_ipv4_tests / run_ipv6_tests）"
    command: "./basic_lookup_t"
  - file: t/data_types_t.c
    source: libmaxminddb-1.13.3/t/data_types_t.c
    description: "全部 MaxMind DB 数据类型解码"
    command: "./data_types_t"
  - file: t/get_value_t.c
    source: libmaxminddb-1.13.3/t/get_value_t.c
    description: "MMDB_get_value / MMDB_aget_value 字段路径查找"
    command: "./get_value_t"
  - file: t/threads_t.c
    source: libmaxminddb-1.13.3/t/threads_t.c
    description: "多线程并发查询（-pthread，110 断言）"
    command: "./threads_t"
  - file: t/mmdblookup_t.pl
    source: libmaxminddb-1.13.3/t/mmdblookup_t.pl
    description: "mmdblookup CLI 帮助/错误输出（依赖 Perl 模块 IPC::Run3）"
    command: "perl mmdblookup_t.pl"

# test_package 中自带的测试 (消费者视角验证，真实调用 MMDB API)
test_package_tests:
  - file: test_package.c
    description: "消费者测试：MMDB_open(mmap) + MMDB_lookup_string(1.1.1.1) + MMDB_get_value(ip=1.1.1.1 逐字节断言) + MMDB_close，全调用检查返回码；本机 aarch64 OHOS 实机验证通过（退出码 0）"
    command: "./test_libmaxminddb"

# 测试断言总数 (test_package 核心断言 7 项；上游全量断言台账见 notes.md R51)
assertion_count: 7
