# 版本级 manifest — libmaxminddb 1.13.3
# 遵循 ARCHIVE-SPEC v3.0（交叉校验元数据，CI 不读取；以 conandata.yml 为准）

version: "1.13.3"
software: libmaxminddb
status: published               # conan-verify G0–G4 全 PASS（2026-09-24）后更新
build_date: "2026-09-24"
build_system: autotools
conan_ref: "libmaxminddb/1.13.3"
task_id: "ohpcd #13585"
task_branch: "feat/libmaxminddb-1.13.3"

source:
  url: "https://github.com/maxmind/libmaxminddb/releases/download/1.13.3/libmaxminddb-1.13.3.tar.gz"
  sha256: "a66502ea76eadbe17f2cd6fd708946777253972d2ae8157dee1b23a2fb528171"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-linux-ohos"
    - "--enable-shared"
    - "--disable-static"
  dependencies: []                 # 无外部依赖（仅标准 POSIX 头 + clock_gettime/open_memstream）
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-t-makefile-libtap-out-of-tree.patch"
  - "0002-configure-umask-tmpdir.patch"

knowledge_gained:
  - "E547: automake all-local/clean-local 写死相对 cd，out-of-tree(conan basic_layout) 构建报 'cd libtap: No such file or directory'，改用 $(top_srcdir) 前缀"
  - "E550: t/maxmind-db/ 为官方附带 vendored Go 测试数据生成工具(9 .go + go.mod)，lang-preflight 报 mixed(go) 系假阳性，库主体纯 C，正常适配"
  - "E046族: configure/config.status 在 HMDFS setgid 构建目录下以 umask 077 创建 ./confXXXXXX 临时目录后写 subs1.awk 报 Permission denied；改 umask 007 + ${TMPDIR:-$HOME/tmp} 后通过"
  - "上游 config.sub 已支持 aarch64-linux-ohos，无需 config.guess/config.sub 补丁；显式 --host 使 configure 判定 cross_compiling，避免 AC_C_BIGENDIAN 执行 aarch64 二进制"
