software: libmaxminddb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/maxmind/libmaxminddb/releases/download/1.11.0/libmaxminddb-1.11.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--disable-shared"
  
  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libxml2/2.15.3"
  
  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-include-maxminddb_config.h.patch"
  - "0004-include-stamp-h2.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E011: HMDFS umask 077 导致 config.status 无法创建临时文件，需改为 umask 022"
  - "E007: config.guess 需添加 HarmonyOS 系统识别"
  - "E072: config.sub 需添加 linux-ohos* 到 kernel-os 白名单"
  - "E064: 编译器 wrapper 自动签名解决 ELF 签名问题"
  - "R18: libxml2 预编译包解决链接器 lld 依赖问题"
