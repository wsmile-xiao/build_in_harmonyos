# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcbor/0.10.2
homepage: "https://github.com/PJK/libcbor"

# 上游测试命令 (cmake 工程，测试通过 ctest 执行)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (test/CMakeLists.txt file(GLOB *_test.c) 生成的 26 个二进制 + cpp_linkage_test)
upstream_tests:
  - file: array_encoders_test.c
    source: libcbor-0.10.2/test/array_encoders_test.c
    description: "数组编码器测试 (4 用例)"
    command: "./array_encoders_test"
  - file: array_test.c
    source: libcbor-0.10.2/test/array_test.c
    description: "数组 API 测试 (10 用例)"
    command: "./array_test"
  - file: bad_inputs_test.c
    source: libcbor-0.10.2/test/bad_inputs_test.c
    description: "非法输入处理测试 (7 用例)"
    command: "./bad_inputs_test"
  - file: bytestring_encoders_test.c
    source: libcbor-0.10.2/test/bytestring_encoders_test.c
    description: "字节串编码器测试 (3 用例)"
    command: "./bytestring_encoders_test"
  - file: bytestring_test.c
    source: libcbor-0.10.2/test/bytestring_test.c
    description: "字节串 API 测试 (16 用例)"
    command: "./bytestring_test"
  - file: callbacks_test.c
    source: libcbor-0.10.2/test/callbacks_test.c
    description: "流式回调测试 (12 用例)"
    command: "./callbacks_test"
  - file: cbor_serialize_test.c
    source: libcbor-0.10.2/test/cbor_serialize_test.c
    description: "序列化测试 (44 用例)"
    command: "./cbor_serialize_test"
  - file: cbor_stream_decode_test.c
    source: libcbor-0.10.2/test/cbor_stream_decode_test.c
    description: "流式解码测试 (55 用例)"
    command: "./cbor_stream_decode_test"
  - file: copy_test.c
    source: libcbor-0.10.2/test/copy_test.c
    description: "拷贝/深拷贝测试 (33 用例)"
    command: "./copy_test"
  - file: float_ctrl_encoders_test.c
    source: libcbor-0.10.2/test/float_ctrl_encoders_test.c
    description: "浮点/控制编码器测试 (9 用例, 2 平台差异失败)"
    command: "./float_ctrl_encoders_test"
  - file: float_ctrl_test.c
    source: libcbor-0.10.2/test/float_ctrl_test.c
    description: "浮点/控制 API 测试 (7 用例)"
    command: "./float_ctrl_test"
  - file: fuzz_test.c
    source: libcbor-0.10.2/test/fuzz_test.c
    description: "模糊测试 (1 用例)"
    command: "./fuzz_test"
  - file: map_encoders_test.c
    source: libcbor-0.10.2/test/map_encoders_test.c
    description: "映射编码器测试 (3 用例)"
    command: "./map_encoders_test"
  - file: map_test.c
    source: libcbor-0.10.2/test/map_test.c
    description: "映射 API 测试 (12 用例)"
    command: "./map_test"
  - file: memory_utils_test.c
    source: libcbor-0.10.2/test/memory_utils_test.c
    description: "内存工具测试 (4 用例)"
    command: "./memory_utils_test"
  - file: negint_encoders_test.c
    source: libcbor-0.10.2/test/negint_encoders_test.c
    description: "负整数编码器测试 (6 用例)"
    command: "./negint_encoders_test"
  - file: negint_test.c
    source: libcbor-0.10.2/test/negint_test.c
    description: "负整数 API 测试 (6 用例)"
    command: "./negint_test"
  - file: pretty_printer_test.c
    source: libcbor-0.10.2/test/pretty_printer_test.c
    description: "美化打印测试 (1 用例, tmpfile 环境限制 abort)"
    command: "./pretty_printer_test"
  - file: stack_over_limit_test.c
    source: libcbor-0.10.2/test/stack_over_limit_test.c
    description: "栈溢出保护测试 (1 用例)"
    command: "./stack_over_limit_test"
  - file: string_encoders_test.c
    source: libcbor-0.10.2/test/string_encoders_test.c
    description: "字符串编码器测试 (3 用例)"
    command: "./string_encoders_test"
  - file: string_test.c
    source: libcbor-0.10.2/test/string_test.c
    description: "字符串 API 测试 (12 用例)"
    command: "./string_test"
  - file: tag_encoders_test.c
    source: libcbor-0.10.2/test/tag_encoders_test.c
    description: "标签编码器测试 (2 用例)"
    command: "./tag_encoders_test"
  - file: tag_test.c
    source: libcbor-0.10.2/test/tag_test.c
    description: "标签 API 测试 (10 用例)"
    command: "./tag_test"
  - file: uint_encoders_test.c
    source: libcbor-0.10.2/test/uint_encoders_test.c
    description: "无符号整数编码器测试 (6 用例)"
    command: "./uint_encoders_test"
  - file: uint_test.c
    source: libcbor-0.10.2/test/uint_test.c
    description: "无符号整数 API 测试 (10 用例)"
    command: "./uint_test"
  - file: unicode_test.c
    source: libcbor-0.10.2/test/unicode_test.c
    description: "Unicode 测试 (2 用例)"
    command: "./unicode_test"
  - file: cpp_linkage_test.cpp
    source: libcbor-0.10.2/test/cpp_linkage_test.cpp
    description: "C++ 链接冒烟测试"
    command: "./cpp_linkage_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 libcbor 真实 API 做 uint/string/array 编解码回环"
    command: "./test_libcbor"
  - file: ohos_special_test.c
    description: "HarmonyOS 专项测试: 宽整型精确字节/大字节串/嵌套 map-array/流式解码 (OHOS 平台特征)"
    command: "./ohos_special_test"

# 测试断言总数 (近似值, 上游 279 用例 + 消费者 3 回环组)
assertion_count: 282
