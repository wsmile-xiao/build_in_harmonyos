# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.10.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10.2"

# 软件名
software: "libcbor"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/PJK/libcbor/archive/refs/tags/v0.10.2.tar.gz"

  # 源码校验和
  sha256: "e75f712215d7b7e5c89ef322a09b701f7159f028b8b48978865725f00f79875b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 CMakeLists.txt 声明 cmake_minimum_required(3.0)，本环境 CMake 4.x 已移除 <3.5 兼容，配方 generate() 注入 CMAKE_POLICY_VERSION_MINIMUM=3.5 可修复"
  - "OHOS 环境 tmpfile() 返回 NULL（Permission denied），上游 pretty_printer_test 因 cbor_describe(item, NULL) abort；属环境限制非适配缺陷"
  - "libcbor 静态库链接名是 cbor（libcbor.a），cpp_info.libs 应为 ['cbor']"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
