# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: list/0.4.1
homepage: "https://github.com/clibs/list"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make bin/test && ./bin/test"

# 上游实际运行的测试程序
# test.c 含 12 个独立测试函数（test_list_node_new / test_list_rpush /
# test_list_lpush / test_list_find / test_list_at / test_list_remove /
# test_list_rpop / test_list_lpop / test_list_destroy /
# test_list_empty_list_destroy / test_list_destroy_complexver /
# test_list_iterator_t），由 main() 逐一调用，Makefile `make test` 运行。
upstream_tests:
  - file: test.c
    description: "上游单元测试（12 个独立测试函数，assert 断言）"
    command: "make test && ./bin/test"

# test_package 中自带的测试 (消费者视角验证 + 鸿蒙专项)
test_package_tests:
  - file: test_consumer.c
    description: "消费者 API 冒烟测试：仅通过公开头文件 clibs/list.h 与公开 API（list_new/rpush/find/at/iterator/rpop/remove/destroy）编译链接运行"
    command: "./test_consumer"
  - file: test_ohos.c
    description: "HarmonyOS/aarch64 专项测试：100 万节点压力 + 负索引/越界语义 + 双向迭代器"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 46