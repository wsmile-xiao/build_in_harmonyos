# test_package/MANIFEST.yml
# 上游官方测试声明文件 — lwjson 1.9.0

package: lwjson/1.9.0
homepage: "https://github.com/MaJerle/lwjson"

# 上游测试命令 (CMake + CTest；默认顶层配置注册 test_stream 入口为 ctest "Test")
upstream_check_command: "ctest --test-dir <build>/tests --output-on-failure"

# conanfile.py build() 中已集成上游默认测试入口
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir {binary_folder}/tests --output-on-failure"

# 上游实际运行的测试程序（6 个独立入口，均为独立 CMake 配置，由
# tests/test.py 逐项驱动；每个入口 = test_main.c + 各自 test_*.c 与
# 各自 lwjson_opts.h，构成独立可执行程序）
upstream_tests:
  - file: tests/test_stream/test_stream.c
    source: lwjson-1.9.0/tests/test_stream/test_stream.c
    description: "流式解析器测试（默认顶层 CTest 注册入口），含流事件回调、字符串转义、数字解析"
    command: "./LwLibPROJECT"
  - file: tests/test_json_parse_basic/test_json_parse_basic.c
    source: lwjson-1.9.0/tests/test_json_parse_basic/test_json_parse_basic.c
    description: "基础 JSON 解析测试：对象/数组/字符串/数字/布尔/空值 类型正确性"
    command: "./LwLibPROJECT"
  - file: tests/test_json_find/test_json_find.c
    source: lwjson-1.9.0/tests/test_json_find/test_json_find.c
    description: "lwjson_find 路径查找测试（点分路径、嵌套对象定位）"
    command: "./LwLibPROJECT"
  - file: tests/test_json_data_types/test_json_data_types.c
    source: lwjson-1.9.0/tests/test_json_data_types/test_json_data_types.c
    description: "数据类型测试：各 JSON 类型 token 识别与值读取"
    command: "./LwLibPROJECT"
  - file: tests/test_parse_token_count/test_parse_token_count.c
    source: lwjson-1.9.0/tests/test_parse_token_count/test_parse_token_count.c
    description: "令牌计数测试：解析后 token 使用数断言"
    command: "./LwLibPROJECT"
  - file: tests/test_serializer/test_serializer.c
    source: lwjson-1.9.0/tests/test_serializer/test_serializer.c
    description: "序列化器测试：lwjson_serializer 输出 JSON 文本"
    command: "./LwLibPROJECT"

# test_package 中自带的测试（消费者视角验证 + 鸿蒙专项）
test_package_tests:
  - file: test.c
    description: "消费者测试：解析业务配置 JSON，lwjson_find 点分路径取 name/version/int/real/bool，遍历数组元素"
    command: "./test_lwjson"
  - file: test_ohos.c
    description: "鸿蒙/aarch64 专项：UTF-8 中文+emoji 字符串往返、令牌预算守恒断言、6 层嵌套 JSON 遍历"
    command: "./test_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 26