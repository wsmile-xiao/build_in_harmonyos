# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lwjson 上游无 install() 规则，需最小补丁补充 install(TARGETS/DIRECTORY/FILES) 才能产出可安装包；configure_file 生成的配置头（lwjson_opts.h）也必须 install(FILES)，否则消费者编译缺头" ref: knowledge/drafts/DRAFT-21002-cmake-library-no-install-rules.kv
  - "顶层 CMake 仅在 PROJECT_IS_TOP_LEVEL 时 add_subdirectory(tests)；CTestTestfile.cmake 只在 <build>/tests 子目录，ctest --test-dir 需指向 tests/ 子目录否则 'No tests were found' 假通过" ref: knowledge/drafts/DRAFT-21003-ctest-subdir-testfile.kv
  - "conandata.yml 注释里绝不能出现 https:// URL：CI pre-download 正则会把注释 URL 提取为源码 URL 并做 file:// 替换，腐蚀同文件真实 URL 前缀致 conan create 失败" ref: knowledge/drafts/DRAFT-21004-conandata-comment-url-predownload.kv
  - "本地 main 与 origin/main 深度分叉时新建分支的三点 diff 被其他库污染致 W3 JC6 误拦；用 pr.diff 模拟真实 CI、并从 origin/main 重建分支保证远端 PR diff 干净" ref: knowledge/drafts/DRAFT-21005-diverged-main-jc6-prdiff.kv
  - "test_package 断言含副作用调用（lwjson_init/parse）在 CI Release（-DNDEBUG）下整个被编译删除导致未初始化段错误；副作用调用必须移出 assert" ref: knowledge/graph/E259.kv
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

