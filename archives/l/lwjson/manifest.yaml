software: lwjson
display: "lwjson"
description: "Lightweight JSON parser and serializer library written in C (MaJerle)"
category: c
homepage: "https://github.com/MaJerle/lwjson"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Pure C library, no platform-specific code; builds out of the box with clang for OHOS"
    - "Upstream has no install() rules; a minimal CMake patch adds install(TARGETS/DIRECTORY/FILES)"
    - "lwjson_opt.h includes user config header lwjson_opts.h; package ships the default generated one"
  common_dependencies: []

versions:
  "1.9.0":
    status: published
    build_date: "2026-10-04"
    published_as: lwjson
    notes: "Full adaptation: 6/6 upstream test entries pass, consumer + OHOS specialty tests pass"