version: "1.1"
software: lbrate
status: built
build_date: "2026-09-25"
build_system: makefile

source:
  url: "https://ibiblio.org/pub/Linux/utils/compress/lbrate-1.1.tar.gz"
  sha256: "ec73e07fa6c38752e0665fe00105b3c6c84bbac06654bb192651bf29a8577dd9"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -j1 lbrate CC=<tools.build:compiler_executables.c>   # 覆盖上游 Makefile 写死的 CC=gcc"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "老式 Makefile 写死 CC=gcc 时，make 命令行变量覆盖即可，无需补丁（命令行变量优先级高于 makefile 赋值）"
  - "x86 runner 上动态 OHOS 产物无法执行：test_package 仅在非 aarch64 主机上把运行期用例报 SKIP，aarch64 上探测失败即硬失败"
