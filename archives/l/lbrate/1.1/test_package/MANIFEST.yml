# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（lbrate 1.1，pristine tarball 实测）：
#
#   upstream_test_targets = 0
#   upstream_test_files   = 0
#   upstream_case_total   = 0
#
# 依据（可逐条核对）：tarball 共 18 个文件——5 个 .c、4 个 .h、Makefile、
# mkinstalldirs、lbrate.1、README/NEWS/TODO/ChangeLog/COPYING、lzhuf-post.txt。
# 无 tests/ 目录、无 .lbr/.?q?/.?z?/.?y? 测试数据、Makefile 只有
# all/installdirs/install/uninstall/clean/tgz 六个目标（无 check/test）。
# 是**确认的 0**，不是 UNKNOWN。

package: lbrate/1.1
homepage: "https://ibiblio.org/pub/Linux/utils/compress/"

upstream_tests_exist: false
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# 补全的消费者测试：test_lbrate.py 现场构造规范 LBR 归档并驱动已打包的 bin/lbrate
test_package_tests:
  - file: test_package/test_lbrate.py
    description: >-
      构造 LBR 归档（目录扇区 + stored 成员 HELLO.TXT + squeezed 成员
      SQUEEZE.TQT，均带 CRC-16 与 CP/M 日期；squeeze 编码器为 readhuff.c/
      readrle.c 的逆过程）。R1 -h 版本横幅；R2 未知选项经 getopt()/optopt
      报错退出 1；R3 -l 列出两成员及大小/日期；R4 通配符 sq* 只选中压缩成员；
      R5 -t 两成员 CRC 通过；R6 损坏归档 -t 报 bad CRC 退出 1；R7 stored 成员
      逐字节一致（128 字节记录 ^Z 填充）；R8 squeezed 成员 Huffman+RLE 解码
      并按内嵌原名改名；R9 -n 原样导出压缩成员。
    command: "python3 test_lbrate.py --bin <pkg>/bin/lbrate --workdir <build>"

# 鸿蒙特有测试（rule12）
ohos_specific_tests:
  - id: OHOS-1
    description: >-
      交付二进制 ELF 契约：ELFCLASS64 + EM_AARCH64(183) + ET_DYN(PIE) +
      PT_INTERP=/lib/ld-musl-aarch64.so.1（OHOS musl 动态加载器）。纯文件解析，
      任何主机都实际执行。
  - id: OHOS-2
    description: >-
      时间戳还原：lbrate 用 libc gmtime()/mktime() 把 CP/M 日期换算为 time_t，
      再以 utime() 写回解出的文件。TZ=UTC0 下，OHOS-2a 断言默认（修改日期）
      mtime 精确等于期望 epoch（含 2000-02-29 闰日），OHOS-2b 断言 -c（创建日期）
      路径同样精确。验证 OHOS musl 的 TZ/mktime 语义与 OHOS 文件系统 utime() 行为。

# 执行策略：运行期用例在 aarch64 主机上探测失败即硬失败；仅在非 aarch64 主机
# （x86_64 构建机无法加载 OHOS musl loader）上报 SKIP，不计为通过。

assertion_count: 12
