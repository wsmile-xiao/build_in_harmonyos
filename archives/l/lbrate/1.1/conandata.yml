# sha256 = the published tarball bytes (what curl/wget and the CI pre-download
# save).  ibiblio adds a Content-Encoding header, and conan's requests-based
# downloader transparently gunzips it into a bare tar (sha256 66f8e87c...);
# conanfile.py source() then falls back to urllib, which keeps these bytes.
sources:
  "1.1":
    url: "https://ibiblio.org/pub/Linux/utils/compress/lbrate-1.1.tar.gz"
    sha256: "ec73e07fa6c38752e0665fe00105b3c6c84bbac06654bb192651bf29a8577dd9"
