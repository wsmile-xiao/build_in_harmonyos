# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libshout/2.4.6
homepage: "https://icecast.org/"

# 上游测试命令 (libshout 上游 examples/ 目录含 example.c / nonblocking.c
# 流式发送示例，需要连接 icecast 服务器，不适合 CI 离线验证，故未集成)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libshout 上游无独立测试套件，examples/ 为交互式流式示例（需网络服务）
upstream_tests:
  - file: examples/example.c
    source: libshout-2.4.6/examples/example.c
    description: "上游流式发送示例（需 icecast 服务器，不适合离线 CI）"
    command: "./example"

# test_package 中自带的测试 (消费者视角验证)
# 实质调用 libshout API：shout_version/shout_init/shout_new/shout_set_*/
# shout_get_*/shout_get_connected/shout_free/shout_shutdown
test_package_tests:
  - file: test.c
    description: "libshout API 烟雾测试（版本查询、实例创建、参数设置/读取、连接状态校验）"
    command: "./test_libshout"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
