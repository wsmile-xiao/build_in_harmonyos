# conandata.yml — libshout 2.4.6
# Source: official Xiph downloads

sources:
  url: "https://downloads.xiph.org/releases/libshout/libshout-2.4.6.tar.gz"
  sha256: "39cbd4f0efdfddc9755d88217e47f8f2d7108fa767f9d58a2ba26a16d8f7c910"

patches:
  # 0001-0002: config.guess/config.sub replaced with system automake-1.16
  # versions that recognize HarmonyOS (aarch64-unknown-linux-ohos). E007.
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS/aarch64"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept linux-ohos triplet"
    patch_type: "portability"
  # 0003: HMDFS umask 077 temp-dir permission fix (E011)
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: umask 077 -> 022 for HMDFS temp dir"
    patch_type: "portability"
  # 0004: skip pthread_setcancelstate on OHOS (unimplemented, E051-like)
  - patch_file: "patches/0004-src-common-thread-thread.c.patch"
    patch_description: "thread.c: guard pthread_setcancelstate with __OHOS__"
    patch_type: "portability"
  # 0005-0006: missing stdlib.h/stdio.h includes (upstream clang fix)
  - patch_file: "patches/0005-src-icy.c.patch"
    patch_description: "icy.c: add stdlib.h/stdio.h includes"
    patch_type: "bugfix"
  - patch_file: "patches/0006-src-legacy.c.patch"
    patch_description: "legacy.c: add stdlib.h include"
    patch_type: "bugfix"
