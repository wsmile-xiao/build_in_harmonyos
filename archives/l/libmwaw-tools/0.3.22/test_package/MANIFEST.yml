# 均未注册 AM_TESTS/check_PROGRAMS; `make check` 实测输出
# "Nothing to be done for 'check-am'" (rc=0) —— 上游确实无自动化测试。
# 证据: find libmwaw-0.3.22 -name 'Makefile.am' | xargs grep -l 'check_PROGRAMS\|TESTS' → 无匹配

upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "CLI 冒烟: mwawFile --version / mwaw2text --version 报告 0.3.22"
    command: "mwawFile --version && mwaw2text --version"
  - file: mwaw_api_test.cpp
    description: "C++ API 实质测试: 链接 libmwaw 并调用 MWAWDocument::isFileFormatSupported() 断言分类结果"
    command: "mwaw_api_test"

assertion_count: 5
