# 版本级 manifest — libmwaw-tools 0.3.22
# 遵循 ARCHIVE-SPEC v2.0 (交叉校验元数据；CI 唯一构建输入是 conanfile.py)

version: "0.3.22"
software: "libmwaw-tools"

# 编译状态: published | built | failed | archived
status: published

# 编译日期
build_date: "2026-09-16"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://sourceforge.net/projects/libmwaw/files/libmwaw/libmwaw-0.3.22/libmwaw-0.3.22.tar.xz/download"
  sha256: "a1a39ffcea3ff2a7a7aae0c23877ddf4918b554bf82b0de5d7ce8e7f61ea8e32"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--with-docs=no"
  dependencies:
    - "librevenge/0.0.5"
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-ohos-config.guess-harmonyos-recognition.patch"
  - "patches/0002-ohos-config.sub-linux-ohos-triplet.patch"
  - "patches/0003-ohos-configure-umask-hmdfs-fix.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "librevenge 包发布的 .pc/.la 文件 prefix 硬编码为 /（系统安装布局），conan 包布局下 pkg-config 与 libtool 都会读错；解法是在 build() 内 staging 纯 .a + 本地生成正确 prefix 的 .pc，PKG_CONFIG_PATH 指向 staging"
  - "staging .pc 的 Cflags 必须带 -I${includedir}/librevenge-0.0（与上游 .pc 一致），头文件在 include/librevenge-0.0/ 子目录下"
  - "librevenge 0.0.5 包不发布 RVNGMemoryStream.h，API 测试需自实现 RVNGInputStream 内存流"
  - "MWAWDocument 类在全局命名空间，librevenge 命名空间内只有流类型的前向声明"
  - "package_type=application 的包被 test_package 普通 requires 时默认 traits 为 headers/libs=False，CMakeDeps 渲染出空 LIBS/INCLUDE_DIRS；需在 test recipe 显式 requires(ref, headers=True, libs=True)"
  - "conan cache 会按配方内容生成 recipe revision，验证时用 conan list 确认最新 revision 与磁盘 conanfile 一致"
