software: libmwaw-tools
display: "libmwaw-tools"
description: "旧版 Mac 文本文档（MacWrite/ClarisWorks 等）命令行转换工具集，基于 libmwaw 库"
category: data
homepage: "https://sourceforge.net/projects/libmwaw/"
license: LGPL-2.1-or-later OR MPL-2.0
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "config.guess/config.sub 需打补丁支持 HarmonyOS (aarch64-unknown-linux-ohos)"
    - "configure 的 umask 077 临时目录在 HMDFS 上不可写，需改为 022"
    - "依赖 librevenge 包发布的 .pc/.la 文件 prefix 硬编码为 /，需在配方内做 .a + 本地 .pc staging"
    - "package_type=application 时 test_package 需显式 requires(headers=True, libs=True)"
  common_dependencies:
    - librevenge
    - zlib

# 版本索引
versions:
  "0.3.22":
    status: published
    build_date: "2026-09-16"
    conan_ref: "libmwaw-tools/0.3.22@ohpcd/stable"
