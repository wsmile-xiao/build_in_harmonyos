# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lunarlog/1.29.2
homepage: "https://github.com/LunarECL/LunarLog"

# 上游测试命令 (CMake + gtest)
upstream_check_command: "cmake --build build && ctest --test-dir build"
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/tests/test_basic_logging.cpp
    source: test/tests/test_basic_logging.cpp
    description: "gtest 基本日志功能测试 (TestLunarLog, 1157 用例总集)"
    command: "./TestLunarLog"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 通过公开头文件/API 创建 logger, 写入 FileSink 并读回验证"
    command: "./test_lunarlog"

# 测试断言总数 (上游 1157 用例; 消费者 2 断言)
assertion_count: 1159
