# 版本级 manifest
# 文件位置: archives/l/lunarlog/1.29.2/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "1.29.2"
software: "lunarlog"
status: published
build_date: "2026-09-23"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 codeload, tag v1.29.2, commit 5be1cfcba7004368c5bc72ec57054636c29e1fb1）
  url: "https://codeload.github.com/LunarECL/LunarLog/tar.gz/refs/tags/v1.29.2"
  # 官方 tarball SHA-256
  sha256: "c1d9b321b30677bc38f9fb450b07a9d605c0abe6067425a26458212c02866168"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DLUNARLOG_BUILD_TESTS=OFF (recipe 构建时; 上游测试在独立 work 目录全量运行)"
    - "-DLUNARLOG_BUILD_EXAMPLES=OFF"
    - "-DLUNARLOG_BUILD_BENCHMARKS=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 适配说明: header-only 库, 无需源码补丁; recipe 为 CMakeToolchain header-library 配方

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 无 locale 数据 (/usr/share/locale、/usr/lib/locale 缺失): std::locale('en_US') 构造成功但输出 classic C 格式, 无千分位分隔符 (E023)"
  - "gtest CaptureStderr/CaptureStdout 在非 Android 分支硬编码 /tmp (gtest-port.cc:1132), OHOS /tmp 为 erofs 只读导致 4 项测试 Subprocess aborted; TMPDIR/TMP/TEMP 无效 (E002/E110)"
  - "HMDFS chmod 000 不生效 (E046), 依赖 chmod 权限位断言的测试失效"
  - "codeload.github.com 的 tar.gz URL 无 .tar.gz 扩展名, conan get() 需显式 filename 声明否则按 zip 解压报 BadZipFile"
  - "conanfile.py 不能同时声明 generators='CMakeToolchain' 又在 generate() 实例化 CMakeToolchain (ConanException)"
  - "header-only 库 (INTERFACE target) 配方: package_type=header-library, cpp_info.bindirs/libdirs 置空, pthread 进 system_libs"
