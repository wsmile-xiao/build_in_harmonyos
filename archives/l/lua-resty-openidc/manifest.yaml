software: lua-resty-openidc
display: "lua-resty-openidc"
description: "OpenID Connect support library for OpenResty/Nginx"
category: network
homepage: "https://github.com/zmarttech/lua-resty-openidc"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure Lua library, no compilation required"
    - "Requires OpenResty or Nginx with lua-nginx-module"
    - "Lua 5.1/LuaJIT compatible"
  common_dependencies:
    - lua-resty-http
    - lua-resty-session

versions:
  "1.7.6":
    status: published
    build_date: "2026-06-10"