patches:
  "2.6.1":
    - patch_file: "patches/0001-cmake-support-harmonyos-platform.patch"
      patch_description: "Add HarmonyOS to the Linux platform branch in CMakeLists.txt so the Linux backend (epoll/inotify/eventfd) is used on OHOS"
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-pthread-cancel-compat.patch"
      patch_description: "OHOS musl libc does not export GNU pthread cancellation API (pthread_cancel/setcancelstate/testcancel); provide no-op stubs guarded by __OHOS__ libc probe (R8 libc-probe exception)"
      patch_type: "portability"
    - patch_file: "patches/0003-ohos-monitor-si-fd-fallback.patch"
      patch_description: "OHOS sigwaitinfo does not populate si_fd for F_SETSIG RT signals; monitoring thread falls back to scanning live kqueues and cleaning up those whose pipe write end was closed (prevents hang at process exit)"
      patch_type: "portability"
    - patch_file: "patches/0004-ohos-monitor-tgkill-wake.patch"
      patch_description: "OHOS musl has no pthread_cancel (stub returns ESRCH); linux_libkqueue_free now wakes the monitoring thread with tgkill(SYS_tgkill, MONITORING_THREAD_SIGNAL) so it exits deterministically instead of hanging in pthread_join"
      patch_type: "portability"
    - patch_file: "patches/0005-ohos-monitor-sigtimedwait-poll.patch"
      patch_description: "OHOS does not reliably deliver the F_SETSIG RT close notification to sigwaitinfo (si_fd empty); monitoring thread polls with sigtimedwait(100ms) + explicit fd-state scan, and linux_libkqueue_free skips the join on OHOS (thread detaches itself; musl pthread_join would block forever)"
      patch_type: "portability"
