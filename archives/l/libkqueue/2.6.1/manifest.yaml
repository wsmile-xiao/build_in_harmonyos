notes:
  first_adaptation: true
  strategy: >
    libkqueue 是用户态 kqueue 事件通知库。OHOS（Linux 后端）使用
    epoll/inotify/eventfd/signalfd/timerfd，全部受 OHOS 内核支持。
    适配要点：CMake 平台分支加 HarmonyOS；musl 无 GNU pthread 取消 API
    提供 stub；sigwaitinfo 不填充 si_fd 且 F_SETSIG close 通知不可靠，
    监控线程改 sigtimedwait 轮询 + fd 状态扫描 + tgkill 唤醒；共享库注入
    DT_SONAME。

knowledge_gained:
  - "OHOS musl libc 不导出 GNU pthread 取消 API（pthread_cancel/setcancelstate/testcancel），需以 __OHOS__ libc 探针提供 stub（knowledge_ref: DRAFT-ohos-pthread-cancel-decl 既有知识复用）"
  - "OHOS sigwaitinfo 不填充 si_fd 且 F_SETSIG close 通知不可靠，监控线程需 sigtimedwait 轮询 + fd 状态扫描 + 显式唤醒，且无 pthread_cancel 时退出须跳过 pthread_join（knowledge_ref: knowledge/drafts/DRAFT-libkqueue-2.6.1-ohos-sigwaitinfo-si-fd-monitor.kv）"
  - "HarmonyOS 非版本化 CMake 平台，共享库缺 DT_SONAME 需注入 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG=-Wl,-soname,（reference: attica/6.14.0 先例）"