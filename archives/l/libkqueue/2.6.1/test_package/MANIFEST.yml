package: libkqueue/2.6.1
homepage: "https://github.com/mheily/libkqueue"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

upstream_tests:
  - name: libkqueue-test
    command: "test/libkqueue-test"
    expected: "run upstream CTest suite: kqueue/kevent/EVFILT_READ/EVFILT_WRITE/EVFILT_TIMER/EVFILT_SIGNAL/EVFILT_PROC/EVFILT_VNODE"

test_package_tests:
  - file: test_libkqueue.c
    description: "Call kqueue()/close() to verify the exported API links and runs"
    command: "./test_libkqueue"

assertion_count: 1