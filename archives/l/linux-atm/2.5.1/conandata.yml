# conandata.yml — linux-atm 2.5.1
# 单一事实源：源码 URL + SHA256 + 补丁列表（conanfile.py 读取 sources / patches）

sources:
  url:
    - "https://downloads.sourceforge.net/project/linux-atm/linux-atm/2.5.1/linux-atm-2.5.1.tgz"
    - "https://sourceforge.net/projects/linux-atm/files/linux-atm/2.5.1/linux-atm-2.5.1.tgz/download"
  sha256: "6bc60fe53c9e9c828a6d7f3675da11ad7fb54491863584e01c1051740fe2a286"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: teach it the HarmonyOS host (aarch64-unknown-linux-ohos)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept the linux-ohos (ohos) OS triplet"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: relax the temp-dir umask from 077 to 022 so config.status can create its files on HMDFS"
    patch_type: "portability"
  - patch_file: "patches/0004-src-arpd-arp.c.patch"
    patch_description: "arpd/arp.c: define _UAPI_LINUX_SOCKET_H so <linux/socket.h> cannot redefine sockaddr_storage"
    patch_type: "portability"
  - patch_file: "patches/0005-src-arpd-io.c.patch"
    patch_description: "arpd/io.c: suppress the duplicate sockaddr_storage and drop the duplicate tentative definition of the libatm global 'now'"
    patch_type: "portability"
  - patch_file: "patches/0006-src-arpd-itf.c.patch"
    patch_description: "arpd/itf.c: define _UAPI_LINUX_SOCKET_H so <linux/socket.h> cannot redefine sockaddr_storage"
    patch_type: "portability"
  - patch_file: "patches/0007-src-include-atm.h.patch"
    patch_description: "atm.h: suppress the duplicate sockaddr_storage and restore the atmpvc/atmsvc_addr_in_use helpers dropped from modern linux/atm.h"
    patch_type: "portability"
  - patch_file: "patches/0008-src-include-atmsap.h.patch"
    patch_description: "atmsap.h: provide the blli_in_use() helper the sources call but upstream never defines (lld rejects the undefined symbol)"
    patch_type: "bugfix"
  - patch_file: "patches/0009-src-oamd-io.c.patch"
    patch_description: "oamd/io.c: define _UAPI_LINUX_SOCKET_H so <linux/socket.h> cannot redefine sockaddr_storage"
    patch_type: "portability"
  - patch_file: "patches/0010-src-qgen-Makefile.in.patch"
    patch_description: "qgen: drop -lfl; the OHOS toolchain ships no libfl"
    patch_type: "portability"
  - patch_file: "patches/0011-src-qgen-ql_l.l.patch"
    patch_description: "qgen lexer: %option noyywrap so no flex runtime library is needed"
    patch_type: "portability"
  - patch_file: "patches/0012-src-sigd-Makefile.in.patch"
    patch_description: "atmsigd: drop -lfl"
    patch_type: "portability"
  - patch_file: "patches/0013-src-sigd-atmsigd.c.patch"
    patch_description: "atmsigd: replace the glibc-only on_exit() with portable atexit()"
    patch_type: "portability"
  - patch_file: "patches/0014-src-sigd-cfg_l.l.patch"
    patch_description: "sigd lexer: %option noyywrap so no flex runtime library is needed"
    patch_type: "portability"
  - patch_file: "patches/0015-src-sigd-io.c.patch"
    patch_description: "sigd/io.c: drop the duplicate definition of the libatm global 'now' (duplicate symbol when linking statically)"
    patch_type: "portability"
  - patch_file: "patches/0016-src-switch-cfg_l.l.patch"
    patch_description: "switch lexer: %option noyywrap so no flex runtime library is needed"
    patch_type: "portability"
  - patch_file: "patches/0017-src-switch-debug-Makefile.in.patch"
    patch_description: "sw_debug: drop -lfl"
    patch_type: "portability"
  - patch_file: "patches/0018-src-switch-tcp-Makefile.in.patch"
    patch_description: "sw_tcp: drop -lfl"
    patch_type: "portability"
  - patch_file: "patches/0019-src-test-Makefile.in.patch"
    patch_description: "isp: drop -lfl"
    patch_type: "portability"
  - patch_file: "patches/0020-src-test-ispl_l.l.patch"
    patch_description: "isp lexer: %option noyywrap so no flex runtime library is needed"
    patch_type: "portability"
  - patch_file: "patches/0021-src-q2931-Makefile.in.patch"
    patch_description: "q2931: build the check program from the generated q.test.c (q_test_SOURCES) and enable the TESTS runner so `make check` really executes q.test"
    patch_type: "bugfix"
  - patch_file: "patches/0022-src-qgen-first.c.patch"
    patch_description: "qgen: emit a field name into the q.test collision table only for the first instance of a shared structure, so multi-instance IEs (blli1/2/3) no longer look like duplicate fields"
    patch_type: "bugfix"
  - patch_file: "patches/0023-src-qgen-second.c.patch"
    patch_description: "qgen: only 'case' selectors are value-unique; 'multi' selectors may legally repeat a value (blli1/2/3), so stop generating the unique[] check table for multi selectors"
    patch_type: "bugfix"
