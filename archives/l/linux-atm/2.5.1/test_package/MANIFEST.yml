package: linux-atm/2.5.1
homepage: "https://linux-atm.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check（src/q2931：check_PROGRAMS = q.test；补丁 0021 重接 q_test_SOURCES/TESTS/check-TESTS，0022/0023 令 qgen 碰撞表按结构实例与 case 选择器检查）"

# 上游实际运行的测试程序
# 说明: src/q2931/Makefile.am 声明 check_PROGRAMS = q.test（唯一的上游测试入口）。
#   原状不可用：TESTS 被注释、q_test_SOURCES 指向只供 #include 的 qtest.c（而非生成的
#   q.test.c），make check 只构建、不执行，且构建对象缺少字段表；另外 qgen 生成的
#   q.test 碰撞表会把「同一 IE 被多实例化」（blli1/2/3、cause/cause2、git/git2/git3）
#   与「multi 选择器重复取值」误报为碰撞（该语义只对 case 选择器成立）。
#   补丁 0021-0023 修正构建接线与碰撞表语义后，make check 在真机构建并执行 q.test，
#   真实结果 PASS（0 collision，退出码 0）。
upstream_tests:
  - file: "src/q2931/qtest.c"
    source: "linux-atm-2.5.1/src/q2931/qtest.c"
    description: "Field/group/value collision checker for the generated Q.2931 message tables (check_PROGRAMS = q.test)"
    command: "make check (builds the generated q.test.c into q.test and executes it)"
    result: pass

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.c"
    description: "libatm consumer: text2atm/atm2text round-trip, atmpvc_addr_in_use, sap_equal (blli_in_use), sys/socket.h + linux/atm.h coexistence"
    command: "./test_linux_atm"
  - file: "conanfile.py"
    description: "HarmonyOS smoke test: packaged atmsigd is an aarch64 OHOS ELF binary and runs (atmsigd -V -> 2.5.1)"
    command: "atmsigd -V"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
