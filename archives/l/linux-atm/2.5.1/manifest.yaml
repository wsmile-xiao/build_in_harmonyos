knowledge_gained:
  - "HMDFS: configure 生成 config.status 时用 umask 077 + mktemp -d，其 0700 临时目录在 HMDFS 上不可写（UID 映射），表现为 'cannot create ./confXXXXXX/subs1.awk: Permission denied'（知识库 E011）。把 configure 里的 umask 077 改为 022 即可。(knowledge_ref: E011 / patches/0003-configure.patch)"
  - "OHOS musl 的 <sys/socket.h> 与内核头 <linux/socket.h> 都定义 struct sockaddr_storage；同时包含即报 redefinition。预定义 _UAPI_LINUX_SOCKET_H 阻断后者，但要自行补 __kernel_sa_family_t（<linux/netlink.h> 等依赖它）。(knowledge_ref: patches/0007-src-include-atm.h.patch)"
  - "OHOS 工具链用 lld，默认 --no-allow-shlib-undefined，会拒绝共享库中的未定义符号；上游 linux-atm 依赖 GNU ld 宽松行为，存在 blli_in_use 未定义、'now' 重复软定义、缺 atmpvc/atmsvc_addr_in_use 等隐患。(knowledge_ref: patches/0008-src-include-atmsap.h.patch)"
  - "OHOS 不提供 glibc 扩展 on_exit()；也不随工具链提供 flex 运行库 libfl（-lfl），可用 %option noyywrap + 去掉 -lfl 让 scanner 自包含。(knowledge_ref: patches/0013-src-sigd-atmsigd.c.patch)"
  - "qgen（构建期工具）并行不安全：flex 输出 ql_l.c 依赖 bison 生成的 ql_y.h 但缺少 make 依赖，make -jN 会间歇失败，需串行构建。(knowledge_ref: conanfile.py build())"
  - "上游声明的测试入口（check_PROGRAMS = q.test）不等于可运行：src/q2931/Makefile.am 的 TESTS 被注释、q_test_SOURCES 指向只供 #include 的 qtest.c（而非生成的 q.test.c），直接 make check 只构建不执行；且 qgen 生成的 q.test 碰撞表会把「同一个 IE 被多实例化」（blli1/2/3、cause/cause2、git/git2/git3）和「multi 选择器重复取值」当作碰撞误报。修好构建接线并把碰撞表改成按实例/按 case 检查后，q.test 真机执行通过（1/1）。(knowledge_ref: patches/0021-0023)"

