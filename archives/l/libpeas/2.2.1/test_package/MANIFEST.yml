# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
#
# libpeas 2.2.1 上游测试基于 meson test（TAP），注册 4 个测试可执行：
# tests/libpeas/{engine,extension-c,extension-set,plugin-info}.c，
# 共 54 个用例。recipe 在 native OHOS/HarmonyOS 构建中运行 meson test；
# 交叉构建时因目标二进制不可执行而跳过。introspection（GIR/typelib
# 生成）依赖 g-ir-scanner，在鸿蒙上因 E212（_giscanner.so 无法 dlopen）
# 不可用，patch 0003 使测试在无 typelib 下照常构建运行。

package: libpeas/2.2.1
homepage: https://gitlab.gnome.org/GNOME/libpeas

# 上游测试命令
upstream_check_command: "meson test -v -C <build> --timeout-multiplier=16"

# conanfile.py build() 中集成了上游测试（native OHOS/HarmonyOS）
upstream_test_in_build: true
upstream_test_command: "meson test"

# 上游测试清单（4 个 meson test / 54 用例）
upstream_tests:
  - file: tests/libpeas/engine.c
    source: libpeas-2.2.1.tar.xz/tests/libpeas/engine.c
    description: "PeasEngine 生命周期/搜索路径/加载插件测试（18 TAP assertions）"
    command: "meson test test-engine"
  - file: tests/libpeas/extension-c.c
    source: libpeas-2.2.1.tar.xz/tests/libpeas/extension-c.c
    description: "C loader 扩展激活/先决条件/属性测试（21 TAP assertions）"
    command: "meson test test-extension-c"
  - file: tests/libpeas/extension-set.c
    source: libpeas-2.2.1.tar.xz/tests/libpeas/extension-set.c
    description: "PeasExtensionSet 增加/遍历/属性测试（9 TAP assertions）"
    command: "meson test test-extension-set"
  - file: tests/libpeas/plugin-info.c
    source: libpeas-2.2.1.tar.xz/tests/libpeas/plugin-info.c
    description: "PeasPluginInfo 元数据校验测试（6 TAP assertions）"
    command: "meson test test-plugin-info"
