# 软件级 manifest
# 文件位置: archives/l/libidn2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: libidn2

# 显示名
display: "libidn2"

# 一句话描述
description: "IDNA 2008 国际化域名处理库"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://www.gnu.org/software/libidn/libidn2/"

# 开源许可证（SPDX 标识）
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "依赖 libunistring，需先编译安装"
    - "标准 autotools 构建系统，无需特殊补丁"
    - "musl 动态链接器限制，需静态链接"

  # 跨版本通用依赖
  common_dependencies:
    - libunistring

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.3.8":
    status: published
    build_date: "2026-05-20"
    build_type: static_linked