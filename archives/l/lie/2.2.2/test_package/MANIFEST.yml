# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# lie 2.2.2 上游**无 make check 目标**：测试入口是源码树 progs/ 下的三个
# LiE 脚本，由 build() 内 `./Lie.exe initfile . < progs/<file>` 直跑
# （conan create 日志即执行证据，CI L1 读取）。断言口径 = assertion 单栏，
# 与消费者断言严格分栏（AGENTS §3.5）。
#
# 计数依据（W0 实测 $TASK_DIR/w0/prog-*.out，2026-09-23/24）：
#   progs/test      源含 25 个 print("N Okay/False") 断言行，#13/#15 上游注释掉
#                   → 23 条活断言，输出 23 Okay / 0 False
#   progs/testsuite 18 条件断言（if…then print("error…")，仅失败才打印）+
#                   3 行分节标题；输出 error 计 0 → 18/18
#   progs/maxsub0   纯定义装载（406 行 Maxsub/Resmat 数据），载入 rc=0 零输出
#                   → 0 断言；另做 A5 冒烟（7 子群）作正向执行证据，**不计上游断言**
#   上游合计 assertion: TOTAL=41（23+18+0）
#   test_package 消费者断言 7 条，独立分栏（见 test_package_assertion_count）

package: lie/2.2.2
homepage: "https://salsa.debian.org/debian/lie"

# 上游测试命令（无 make check，等价入口为三文件直跑）
upstream_check_command: "./Lie.exe initfile . < progs/test && ./Lie.exe initfile . < progs/testsuite && ./Lie.exe initfile . < progs/maxsub0"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./Lie.exe initfile . < progs/test; ./Lie.exe initfile . < progs/testsuite; ./Lie.exe initfile . < progs/maxsub0"

# 上游实际运行的测试程序
upstream_tests:
  - file: test
    source: lie-2.2.2/progs/test
    description: "LiE 断言脚本 — 23 条活断言（源 25 行、#13/#15 上游注释掉），输出 23 Okay / 0 False"
    command: "./Lie.exe initfile . < progs/test"
  - file: testsuite
    source: lie-2.2.2/progs/testsuite
    description: "LiE 条件断言套件 — 18 条（if…then print error，仅失败打印）+ 3 行分节标题，输出 error=0 → 18/18"
    command: "./Lie.exe initfile . < progs/testsuite"
  - file: maxsub0
    source: lie-2.2.2/progs/maxsub0
    description: "纯定义装载（406 行 Maxsub/Resmat 数据），载入 rc=0 零输出 = 0 断言；build() 另跑 A5 冒烟（7 子群）作正向执行证据，不计上游断言"
    command: "./Lie.exe initfile . < progs/maxsub0"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者冒烟 7 条 — 算术核心 2 条 + ?help/?dim 帮助数据 4 条（走 printexpr，验 0001 NULL 补丁面与 INFO 数据随包交付）+ 干净退出 1 条"
    command: "sh test.sh"

# 鸿蒙/OHOS 特有测试（不并入上游用例数，单独计入 rule12 鸿蒙行）
added_tests:
  - name: "printexpr-null-erofs-help"
    source: test_package/test.sh
    description: "?help/?dim 走 printexpr 的 tmpnam+fopen 分页路径 — 修前 /tmp 只读(EROFS) fopen 返 NULL 直接 SIGSEGV(rc=139)，补 0001 NULL 检查后回退 stdout rc=0；消费者侧断言同时验证 INFO 数据文件随包交付"

# 上游测试断言总数（= 23 + 18 + 0，assertion 单栏口径，与 W0 预演 TOTAL=41 一致）
assertion_count: 41

# test_package 消费者断言总数（= test.sh 中 ok/no 计数器条目数）
test_package_assertion_count: 7
