  # 编译器
  cc: "clang"
  cxx: "clang++"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-printexpr-null-check.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 C 程序对 tmpnam+fopen 返回值不判 NULL：OHOS /tmp 只读(EROFS) 下 fopen 必返 NULL，随后经该 FILE* 写入即 SIGSEGV(rc=139)；修法=NULL 检查后回退 stdout 且不启 pager，与同文件 learn.c:135 及 print.c 另三处 cur_out==stdout→stdout 的既有形态对齐（portability 补丁、无平台宏，PF5 免拦）"  # knowledge_ref: E710
  - "rc=139 崩溃双支定性：自家探针缺 #include <stdlib.h> 致 getenv 隐式声明是独立假信号源，须先修正探针三连复跑（rc=0）再对上游定性；设备事实 tmnam 产名正常但 fopen/tmpfile 恒 NULL(EROFS)，不判空的调用方必 SIGSEGV"  # knowledge_ref: E710
  - "W0 关①三源 sha256 全等 + sha1 双算法互证锚定发行物（两镜像实下载 + sagemath/sage checksums.ini 第三方记录），Debian +dfsg 重打包源命中 PF7 A 类硬拦时改道 sage 上游镜像（check_source_urls 函数级模拟零 findings）"  # knowledge_ref: E710
  - "W0 关②「自带 bigint 不用 GMP」三层证真法：静态 grep 0 命中 + readelf NEEDED 仅 libc.so + bigint.c(478 行) 在 Makefile common_objects 实际参与链接——三层互证后 requires() 留空即为零缺口"  # knowledge_ref: E710
