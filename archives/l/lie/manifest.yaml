software: lie
display: "LiE"
description: "李群与根系的专门化计算机代数系统（交互式批处理解释器 + Lie.exe 计算内核）"
category: math

homepage: "https://salsa.debian.org/debian/lie"
license: LGPL-2.1-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "裸 Makefile 无 configure：make -j1 noreadline CC=<clang 绝对路径> CFLAGS='-O3 -pipe -DNDEBUG' 显式钉桩（设备无 gcc/cc、无 readline，noreadline 为 README 明文路径）"
    - "parser.c/parser.h 由 bison 3.8.2 构建期从 parser.y 生成（发行 tarball 不带生成物），属构建期产物不入补丁面"
    - "上游 printexpr 等对 tmpnam+fopen 不判 NULL：/tmp 只读(EROFS) 下 fopen 返 NULL，随后写入即 SIGSEGV(rc=139)——0001 补丁 NULL 回退 stdout（对齐同文件 learn.c:135 先例）"
    - "包装脚本 lie 必须自定位（dirname $0）：上游 make_lie 把构建目录绝对路径烧进 LD=，随 conan 包迁移即断链"
    - "交付面单目录 bin/：Lie.exe + INFO.0-4/INFO.a/INFO.ind/LEARN/LEARN.ind/title 必须与二进制同目录（argv[2] 目录是 INFO 查找根）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.2.2":
    status: built
    build_date: "2026-09-24"
    conan_ref: "lie/2.2.2"
