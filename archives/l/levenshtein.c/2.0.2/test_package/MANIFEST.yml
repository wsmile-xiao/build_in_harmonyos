# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: levenshtein.c/2.0.2
homepage: "https://github.com/wooorm/levenshtein.c"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test && ./test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: levenshtein.c-2.0.2/test.c
    description: "上游断言测试：22 个 levenshtein/levenshtein_n 断言"
    command: "./test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用公开 API levenshtein/levenshtein_n 并验证结果"
    command: "./test_levenshtein.c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 22
