# 软件级 manifest — librtpi
# 遵循 ARCHIVE-SPEC v2.0

software: librtpi
display: "librtpi"
description: "Real-Time Priority Inheritance library: PI mutex/condvar on Linux PI futex syscalls with priority-ordered wakeup"
category: library
homepage: "https://gitlab.com/linux-rt/librtpi"
license: LGPL-2.1-only

build_system: cmake  # 上游为 autotools（仅 configure.ac）；OHOS 无 autotools，配方以 CMake 包装

ohos_adaptation:
  key_points:
    - "真机/CI 无 autoconf/automake/libtoolize，autotools 上游改用导出的最小 CMakeLists.txt 包装（上游源码零修改）"
    - "OHOS musl 无 pthread_setcancelstate/pthread_setcanceltype/pthread_cancel（E127），必须使用上游 --disable-cancellation 配置"
    - "PI futex 系统调用（FUTEX_LOCK_PI/FUTEX_WAIT_REQUEUE_PI 等）需目标内核支持；HongMeng 内核支持性待真机 test_package 探针确认"
    - "sysroot 含 linux/futex.h，编译期无缺口"
  common_dependencies: []  # 无第三方依赖，仅平台 libc/pthread

versions:
  "1.0.0":
    status: built  # 2026-09-19 真机单包实测通过；平台限制：HongMeng 内核未实现 PI 重排队 futex，condvar API ENOSYS
    build_date: "2026-09-19"
