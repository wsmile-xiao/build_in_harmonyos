# 版本级 manifest — librtpi 1.0.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.0.0"
software: "librtpi"
# 2026-09-19 真机单包实测通过（构建/打包/test_package），平台限制见下。
status: built
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://gitlab.com/linux-rt/librtpi/-/archive/1.0.0/librtpi-1.0.0.tar.gz"
  sha256: "7115cbddd72c11d8c7a19db984fa972781758e9331567e461a8ed7bfcb021aca"
  tar_format: tar.gz

build:
  # 上游为 autotools（仅 configure.ac，无生成的 configure），但真机无
  # autoconf/automake/libtool（2026-09-18 探测），改用配方导出的最小
  # CMakeLists.txt 包装，CMakeToolchain 构建（cmake 真机已装、CI 矩阵可用）。
  system: cmake
  configure_options:
    - "RTPI_ENABLE_CANCELLATION=ON (Linux) / 自动关闭 (OHOS, E127)"
    - "BUILD_SHARED_LIBS=OFF (默认静态)"
  dependencies: []
  cc: "OHOS Clang 15 (aarch64-unknown-linux-ohos-clang)"
  outputs:
    - "lib/librtpi.a (默认) 或 lib/librtpi.so.1"
    - "include/rtpi.h"
    - "include/rtpi_internal.h"
    - "include/rtpi/condition_variable.hpp"
    - "include/rtpi/mutex.hpp"

patches_applied: []

# 上游测试清点（R51 三步法第 1 步）；第 2 步真机实测 2026-09-19 完成
tests:
  upstream: "注册 45 项（cancellation 默认开启）/ OHOS 构建配置 40 项。真机实测可执行子集 19 项：7/19 通过（36.8%）——12 项失败全部为 condvar 用例触发内核缺 FUTEX_WAIT_REQUEUE_PI（ENOSYS，平台能力缺口）；libstdc++-tests 19 项依赖 GNU libstdc++ 内部头文件无法在 libc++ 平台编译；tst-condpi2*.sh 2 项需线程优先级特权。详见 notes.md §8。"
  test_package: "TOTAL=3 PASS=3 FAIL=0——test_rtpi（6 阶段 API 冒烟+内核探针）、consumer_checks（错误路径/PSHARED）、consumer_cpp（C++ 绑定）；Build Summary Total:1 Success:1，L0/L1/L4/L5 pass、L2 纯库 skip。"

# 平台能力缺口（非包缺陷）
platform_limitations:
  - "HongMeng 内核 1.12.0（真机 10.62.178.77）未实现 FUTEX_WAIT_REQUEUE_PI / FUTEX_CMP_REQUEUE_PI（errno 38）；condvar API 运行期不可用，mutex API 功能完好。见知识草稿 DRAFT-librtpi-100-hongmeng-futex-requeue-enosys。"

knowledge_gained:
  - "librtpi 通过原始 PI futex 系统调用自行实现优先级继承，不依赖 glibc 的 pthread PI mutex；musl 下可编译。"
  - "真机实测（HongMeng 内核 1.12.0）：FUTEX_LOCK_PI/FUTEX_UNLOCK_PI 可用，FUTEX_WAIT_REQUEUE_PI/FUTEX_CMP_REQUEUE_PI 返回 ENOSYS——condvar 不可用、mutex 可用。"
  - "OHOS 真机与 CI 镜像无 autoconf/automake/libtoolize，autotools-only 上游需改用 CMake 包装或补齐 autotools 工具链。"
  - "OHOS musl libc 无 pthread_setcancelstate/pthread_setcanceltype/pthread_cancel（E127 实测复核：llvm-nm -D libc.so 无符号）；librtpi 需用上游 --disable-cancellation 配置。"
  - "CMake add_library(librtpi) 在 Unix 产物为 liblibrtpi.a（双 lib 前缀），需 OUTPUT_NAME rtpi 才能匹配 cpp_info.libs=[\"rtpi\"]。"
  - "runner 环境下 build_and_test.sh 必须用 CI_PACKAGES 环境变量定位单包，位置参数在该链路未生效（会全仓扫描 260 包）。"
