# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: librtpi/1.0.0
homepage: "https://gitlab.com/linux-rt/librtpi"

# 上游测试命令 (tests/Makefile.am 的 check_PROGRAMS/TESTS)
#   make check 注册 4 个顶层测试 + glibc-tests + libstdc++-tests
#   默认 (ENABLE_CANCELLATION, glibc 环境): 4 + 22 + 19 = 45 个测试程序
#   OHOS 配方 (cancellation 关闭, 上游专门分支): 4 + 17 + 19 = 40 个测试程序
# 上游 make check 依赖 autotools (真机/CI 环境无 autoreconf/automake，
# 见 notes.md)，因此配方 build() 未集成 make check，改由 test_package
# 做 6 阶段 API 冒烟 (含 PI futex 慢路径内核探针)。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (tests/Makefile.am check_PROGRAMS/TESTS 清点)
upstream_tests:
  - "test_api (tests/test_api.c)"
  - "tst-cond1 (tests/tst-cond1.c)"
  - "tst-condpi2.sh -> tst-condpi2 / tst-condpi2-orig (优先级继承功能测试)"
  - "tst-condpi2-cpp.sh -> tst-condpi2-cpp (C++ 绑定)"
  - "glibc-tests/: 22 个 tst-cond*.c (cancellation 开启) / 17 个 (关闭)"
  - "libstdc++-tests/: 19 个 condition_variable/mutex 回归测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_rtpi.c
    description: >
      6 阶段 API 冒烟: (1) alloc/init/trylock/unlock 无竞争快路径;
      (2) 双线程竞争 lock 强制 FUTEX_LOCK_PI/FUTEX_UNLOCK_PI 慢路径;
      (3) condvar 能力探测——无信号者 timedwait，ETIMEDOUT=内核支持
      PI 重排队 / ENOSYS=内核未实现（输出 UNSUPPORTED 标记后继续，
      其余返回值硬失败）; (4) condvar timedwait+signal 强制
      FUTEX_WAIT_REQUEUE_PI/FUTEX_CMP_REQUEUE_PI 重排队路径（仅在
      (3) 证明支持后运行）; (5) 无信号者超时返回 ETIMEDOUT; (6)
      destroy/free 生命周期。
    command: "./test_rtpi"
  - file: consumer_checks.c
    description: >
      消费者可用性用例（全部内核无关、确定性通过）：PSHARED 互斥锁初始化
      与快路径；未知 mutex/cond 标志返回 EINVAL；自死锁返回 EDEADLK；
      跨线程解锁返回 EPERM；timedwait 非法 timespec 返回 EINVAL。
    command: "./consumer_checks"
  - file: consumer_cpp.cpp
    description: >
      C++ 绑定消费者用例：验证安装的 rtpi/mutex.hpp 可编译可用——
      rtpi::mutex 构造/try_lock/unlock、自死锁抛 std::system_error(EDEADLK)、
      native_handle() 与 C API 互操作。
    command: "./consumer_cpp"

# 实测记录 (2026-09-19, 真机 HongMeng 内核 1.12.0, 详见 notes.md §8)
#   mutex API (阶段 1/2/6): 通过
#   condvar API (阶段 3): ENOSYS — 内核未实现 FUTEX_WAIT_REQUEUE_PI 族
#   平台缺口属内核能力问题，非配方缺陷；见知识草稿 DRAFT-librtpi-100

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
