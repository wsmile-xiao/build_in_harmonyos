version: "23.0.1"
software: "libparquet"
status: published
build_date: "2026-09-17"
build_system: cmake

source:
  url: "https://archive.apache.org/dist/arrow/arrow-23.0.1/apache-arrow-23.0.1.tar.gz"
  sha256: "bd09adb4feac11fe49d1604f296618866702be610c86e2d513b561d877de6b18"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DARROW_DEPENDENCY_SOURCE=SYSTEM"
    - "-DARROW_BUILD_STATIC=ON"
    - "-DARROW_BUILD_SHARED=OFF"
    - "-DARROW_COMPUTE=ON"
    - "-DARROW_CSV=ON"
    - "-DARROW_FILESYSTEM=ON"
    - "-DARROW_IPC=ON"
    - "-DARROW_JSON=ON"
    - "-DARROW_PARQUET=ON"
    - "-DTHRIFT_SOURCE=BUNDLED"
    - "-DARROW_FLIGHT=OFF"
    - "-DARROW_FLIGHT_SQL=OFF"
    - "-DARROW_ORC=OFF"
    - "-DARROW_GANDIVA=OFF"
    - "-DARROW_CUDA=OFF"
    - "-DARROW_DATASET=OFF"
    - "-DARROW_ACERO=OFF"
    - "-DARROW_S3=OFF"
    - "-DARROW_GCS=OFF"
    - "-DARROW_HDFS=OFF"
    - "-DARROW_AZURE=OFF"
    - "-DARROW_SUBSTRAIT=OFF"
    - "-DARROW_JEMALLOC=OFF"
    - "-DARROW_MIMALLOC=OFF"
    - "-DARROW_BUILD_TESTS=ON"
    - "-DARROW_TESTING=ON"
    - "-DARROW_BUILD_BENCHMARKS=OFF"
    - "-DARROW_BUILD_EXAMPLES=OFF"
    - "-DARROW_BUILD_UTILITIES=OFF"
    - "-DARROW_WITH_BZ2=ON"
    - "-DARROW_WITH_LZ4=ON"
    - "-DARROW_WITH_SNAPPY=ON"
    - "-DARROW_WITH_ZLIB=ON"
    - "-DARROW_WITH_ZSTD=ON"
    - "-DARROW_WITH_RE2=ON"
    - "-DARROW_WITH_UTF8PROC=ON"
    - "-DARROW_USE_OPENSSL=ON"
    - "-DARROW_WITH_BACKTRACE=OFF"
    - "-DARROW_WITH_OPENTELEMETRY=OFF"
    - "-DARROW_SIMD_LEVEL=DEFAULT"
    - "-DARROW_RUNTIME_SIMD_LEVEL=MAX"
  dependencies:
    - boost/1.84.0
    - xsimd/13.2.0
    - rapidjson/1.1.0
    - re2/2024-04-01
    - utf8proc/2.11.3
    - openssl/3.0.16
    - zlib/1.3.1
    - zstd/1.5.7
    - lz4/1.10.0
    - bzip2/1.0.8
    - snappy/1.1.7
  bundled_dependencies:
    - thrift/0.22.0 (FetchContent from archive.apache.org, not in ohpcd registry)
  test_dependencies:
    - gtest/1.17.0.1 (test_requires)
    - gflags/2.2.2.1 (test_requires, ARROW_NEED_GFLAGS under ARROW_BUILD_TESTS=ON)

test_report:
  upstream_tests_registered: 62
  upstream_test_sources: "cpp/src/parquet/CMakeLists.txt (12 add_parquet_test, 10 enabled by default) + core arrow tests (52)"
  upstream_test_result: "see PR body for measured pass rate"
  test_package_result: "pass"

adapter:
  agent: "2404_87638649"
  reference_pr: "#9874 (libarrow main), #9896 (libarrow_acero)"
  notes: "Superset package reusing libarrow recipe with ARROW_PARQUET=ON + bundled thrift"
