software: libmm-glib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.24.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.24.2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# 构建系统类型（顶层字段，用于质量门禁）
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://deb.debian.org/debian/pool/main/m/modemmanager/modemmanager_1.24.2.orig.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dbash_completion=false"
    - "-Dman=false"
    - "-Dgtk_doc=false"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Dudev=false"
    - "-Dudevdir=/dev/null"
    - "-Dtests=false"
    - "-Dsystemdsystemunitdir=no"
    - "-Dsystemd_suspend_resume=false"
    - "-Dsystemd_journal=false"
    - "-Dpolkit=no"
    - "-Dmbim=false"
    - "-Dqmi=false"
    - "-Dqrtr=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib/2.88.0"
    - "dbus/1.14.10"
    - "gio-unix-2.0/2.88.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - file: "0001-src-mm-netlink.c.patch"
    purpose: "调整头文件顺序，修复 sockaddr_storage 定义冲突"
  - file: "0002-src-socket-wrapper.h.patch"
    purpose: "创建 socket wrapper 头文件，尝试解决 SDK 头文件冲突"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "freedesktop.org 拒绝自动化下载，使用 Debian 镜像源替代"
  - "鸿蒙无 systemd/polkit/udev，需要禁用相关功能"
  - "鸿蒙 SDK 头文件冲突：linux/socket.h 和 sys/socket.h 都定义 sockaddr_storage"
  - "libmm-glib 库可独立编译，不依赖 ModemManager daemon"
  - "ModemManager daemon 编译失败，但库本身可用"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/libmm-glib-1.24.2.orig
  source_work_dir: /storage/Users/currentUser/builds/libmm-glib-1.24.2.work
  source_orig_hash: 0db4c0be43c71874
  source_work_hash: 938fd19d0d491cc1
  generated_at: '2026-05-28T14:35:00'
  patches_count: 2

patch_classification:
  - file: 0001-src-mm-netlink.c.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-src-socket-wrapper.h.patch
    type: auto
    platform_only: True
    guard: 'pending'
