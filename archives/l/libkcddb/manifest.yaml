software: libkcddb
display: "libkcddb"
description: "KDE CDDB 库——CD 音频元数据查询（查询/提交/缓存），audiocd KIO-slave 的核心依赖"
category: multimedia
homepage: "https://invent.kde.org/multimedia/libkcddb"
license: LGPL-2.0-or-later AND GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "KIO HTTP 传输层替换为 Qt6::Network（QNetworkAccessManager），制品仓未发布 kio"
    - "kcmcddb（KCM 系统设置面板）通过 BUILD_KCM=OFF 禁用——依赖 KIO/KCMUtils/Solid 全部未发布"
    - "上游 13 个注册测试中仅 cdinfotest/cachetest 离线可测，其余 11 个依赖外网 CDDB/MusicBrainz 服务器，CI 无网环境豁免"
    - "KEMailSettings 来自 kconfig（已发布），无需额外依赖"
  common_dependencies:
    - "qtbase/6.11.1"
    - "ecm/6.26.0"
    - "kconfig/6.26.0"
    - "ki18n/6.26.0"

versions:
  "26.04.3":
    status: built
    build_date: "2026-09-09"
    conan_ref: "libkcddb/26.04.3"
