knowledge_gained:
  - "libkcddb 26.04.3 (KDE Gear) depends on KF6 Config/I18n/KIO/WidgetsAddons/KCMUtils upstream; KIO/KCMUtils/Solid are not published to ohpcd, so the KCM settings module (kcmcddb) is disabled via BUILD_KCM=OFF and the KIO HTTP transport is replaced."
  - "The library only uses KIO for plain HTTP GET (KIO::get on QUrl) and HTTP POST (KIO::http_post + custom headers) — a complete functional replacement is QNetworkAccessManager::get/post with QNetworkReply::finished, keeping the public Lookup/Submit/Sites API unchanged."
  - "KIO::TransferJob::data signal accumulates chunks; with QNetworkReply the full body is available via readAll() after finished() — the per-chunk slotData slot can be dropped entirely."
  - "KJob::result signal passes the job; QNetworkReply::finished passes nothing — slots must retrieve the sender via qobject_cast<QNetworkReply*>(sender()) (Qt5-style new-syntax connect argument count assertion)."
  - "SyncHTTPSubmit/Sites used KJob::exec(); QNetworkReply has no exec — use a QEventLoop connected to QNetworkReply::finished."
  - "QNetworkAccessManager must outlive its QNetworkReply objects: allocate with new QNetworkAccessManager(this) in QObject-derived classes (AsyncHTTPLookup::fetchURL, HTTPSubmit::createJob); stack-allocated managers go out of scope before async replies finish."
  - "cdinfo.cpp includes <KStringHandler> (KStringHandler::perlSplit) which lives in KCoreAddons, but upstream CMakeLists.txt never declares KCoreAddons — upstream gets it transitively via KIO. Declare find_package(KF6 COMPONENTS CoreAddons) + link KF6::CoreAddons (PRIVATE) explicitly. Note: FindKF6 component name is 'CoreAddons' (finds KF6CoreAddonsConfig.cmake), cmake target is KF6::CoreAddons."
  - "kconfig's libKF6ConfigGui.so carries a relative DT_NEEDED '../../bin/libKF6ConfigCore.so' baked in at packaging time; consumers running tests need symlink workarounds (kconfig 6.26.0 _prepare_ctest_runtime_links precedent)."
  - "KDEInstallDirs with ECM on a conan build outputs everything under bin/ (single-dir layout): libKCddb6.so lands in bin/, ctest resolves relative ../../bin paths from the build tree."
