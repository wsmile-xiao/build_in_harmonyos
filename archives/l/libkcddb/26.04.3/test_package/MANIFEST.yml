# test_package/MANIFEST.yml
# Upstream and consumer test declaration for libkcddb/26.04.3.

package: libkcddb/26.04.3
homepage: https://invent.kde.org/multimedia/libkcddb

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure -E \"^(asynchttplookuptest|asynccddblookuptest|synccddblookuptest|synchttplookuptest|utf8test|musicbrainztest|asyncmusicbrainztest|musicbrainztest-severaldiscs|musicbrainztest-fulldate|asynchttpsubmittest|synchttpsubmittest|sitestest)$\""

upstream_tests:
  - file: tests/
    source: libkcddb-26.04.3/tests/
    description: "libkcddb upstream CTest suite (13 registered tests)"
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON; executes the 2 offline-runnable tests (cdinfotest, cachetest); excludes 11 network-dependent tests that require live CDDB/MusicBrainz servers (CI sandbox has no internet access — network-dependent test exemption)"

test_package_tests:
  - file: test_package/test_package.cpp
    description: "Consumer smoke: CDInfo field set/get round trip, xmcd toString serialization, CDInfo::load parse-back, Categories/Genres helper lists, plus loopback HTTP transport coverage of the rewritten (KIO->QNetworkAccessManager) transport via KCDDB::Client against a local QTcpServer-based HTTP endpoint (no external network, per AI review request): lookup Success (CDDB 200)/NoRecordFound (202)/ServerError (HTTP 500) paths, outgoing CGI query verification, and the submit path — HTTP POST to submit.cgi with Category/Discid/User-Email/Submit-Mode/Charset raw headers and text/plain Content-Type."
    command: "conan create (test_package builds and runs test_package)"

assertion_count: 33
