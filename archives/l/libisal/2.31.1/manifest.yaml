version: "2.31.1"
software: libisal
status: built             # 真机 conan create 全绿（frp 设备，2026-09-19）
build_date: "2026-09-19"
build_system: make       # 上游 Makefile.unx + make.inc（免 autotools）

source:
  url: "https://github.com/intel/isa-l/archive/refs/tags/v2.31.1.tar.gz"
  tar_format: tar.gz
  sha256: "e1d5573a4019738243b568ab1e1422e6ab7557c5cae33cc8686944d327ad6bb4"

build:
  system: 上游 Makefile.unx（include 各模块 Makefile.am 源列表；官方 tag 包无
    configure，且 automake/autoconf/libtool 工具包自身无法在 HMDFS 上从源码构建
    —— 其 configure 直接 exec 触发 Error 126，perl 包 dlopen 失败，故弃 autotools 路线）
  cc: clang 15（集成汇编器可直接编全部 52 个 aarch64 .S 含 .req 别名，
    实测 make check 16/16；无需 -fno-integrated-as，与 isa-l_crypto 2.26 不同）
  make_flags:
    - "arch=aarch64 host_cpu=aarch64（uname 启发式会把 HarmonyOS 当成未知 arch）"
    - "CC/AR 来自 tools.build:compiler_executables conf（R33）"
  targets: "lib progs check"
  verified_on: frp-tip.com 真机（ohos-test-runner 隔离作业，exit 0）

patches_applied:
  - "patches/0001-igzip-adler32-neon-drop-merge-section-flag.patch"
  - "patches/0002-fix-64bit-swar-detection-for-musl-aarch64.patch"

knowledge_gained:
  - "libisal 2.31.1 aarch64 全模块原生支持；上游 check 套件 16 测试（crc4/ec4/igzip3/mem1/raid4）真机全过"
  - "⭐ OHOS 平台重大发现：SHF_MERGE 常量段（.rodata.cst16,\"aM\"）在两台 OHOS 真机上运行时被移位，adrp/adr PC 相对取常量读到错位字节——adler32 NEON 的 factors 表因此取错，isal_adler32 高 16 位（B 和）错、低 16 位（A 和）对；改成普通 .rodata 即修复。C 编译的大数组 .rodata 表不受影响（crc 测试全过）。曾误诊为 UMLAL2 指令 no-op——volatile 微测试的输入数组也被放进 merge 段导致同样错位加载，形成假象"
  - "⭐ 上游真 bug：64 位 SWAR 检测用 glibc 私有宏 __WORDSIZE，musl/OHOS 未定义且 aarch64 无 __x86_64__ → raid_base.c/ec_base.c 选中 32 位掩码（0xfefefefe）配 64 位 unsigned long，pq_gen_base 每 8 字节块高 4 字节 Q 全错（pq_check_base 返回 i|2 于第 4 字节实锤）；补 __LP64__（编译器内建）修复，对 glibc/x86 行为不变"
  - "官方 tag 包无 configure；tool_requires automake/autoconf/libtool 在 HMDFS 真机不可用（工具包自身构建即挂：configure 直接 exec EACCES=126 + conan perl Cwd.so dlopen 失败），ohpcd 无预构建 → 走上游 Makefile.unx（include 同一套 Makefile.am 片段，支持 lib/progs/check 目标）"
  - "make.inc 用 `CFLAGS = ...` 普通赋值：命令行传 CFLAGS 会整体覆盖；CC 是 ?=，传 CC/AR 即可覆盖全部规则（AS=$(CC)、LINK.o 同源）"
  - "igzip CLI 由 progs 目标产出在 programs/igzip（bin/ 只有 .o 和 .a）；无参数时读 stdin 写 stdout，与 gunzip 互通"
  - "frp 真机工具链在 $HOME/usr/local/bin（clang/sysroot/--code-sign 包装），无 GNU as；LAN 机（10.62.178.77）在 /data/service/hnp/bin（含 as 2.45）——两台设备工具链不同，profile 的 compiler_executables 路径要按机器适配"
  - "OHOS conan profile 需 os.version（settings.yml 枚举 5.0/6.0）+ library 类型必须声明 shared 选项（或用 static-library）"

upstream_tests:
  total: 16
  harness: "make -f Makefile.unx check"
  result: "16/16 PASS（真机，含 igzip_rand_test 大规模随机 round-trip）"
  modules: {crc: 4, erasure_code: 4, igzip: 3, mem: 1, raid: 4}

test_package:
  assertions: 14
  result: "14/14 PASS（真机 conan create test_package）"
