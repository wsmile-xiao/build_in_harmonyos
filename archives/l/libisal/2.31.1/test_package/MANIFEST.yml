# test_package/MANIFEST.yml
# Upstream test declaration file
# CI (build_and_test.sh L0e) requires this file to exist

package: libisal/2.31.1
homepage: "https://github.com/intel/isa-l"

# Upstream test command (upstream Makefile.unx check harness, 16 check tests)
upstream_check_command: "make -f Makefile.unx arch=aarch64 host_cpu=aarch64 check"

# Upstream tests are integrated in recipe build()
upstream_test_in_build: true
upstream_test_command: "make -f Makefile.unx check"

upstream_tests:
  - file: crc/crc16_t10dif_test.c
    source: isa-l-2.31.1/crc/crc16_t10dif_test.c
    description: "CRC16 T10-DIF: accelerated vs base vs reference over random buffers"
    command: "./crc/crc16_t10dif_test"
  - file: crc/crc16_t10dif_copy_test.c
    source: isa-l-2.31.1/crc/crc16_t10dif_copy_test.c
    description: "Stitched CRC16 T10-DIF + memcpy correctness"
    command: "./crc/crc16_t10dif_copy_test"
  - file: crc/crc32_funcs_test.c
    source: isa-l-2.31.1/crc/crc32_funcs_test.c
    description: "CRC32 ieee/gzip_refl/iscsi across all dispatch variants"
    command: "./crc/crc32_funcs_test"
  - file: crc/crc64_funcs_test.c
    source: isa-l-2.31.1/crc/crc64_funcs_test.c
    description: "CRC64 ecma/iso/jones norm+refl across all dispatch variants"
    command: "./crc/crc64_funcs_test"
  - file: erasure_code/gf_vect_mul_test.c
    source: isa-l-2.31.1/erasure_code/gf_vect_mul_test.c
    description: "GF(2^8) vector multiply vs reference"
    command: "./erasure_code/gf_vect_mul_test"
  - file: erasure_code/erasure_code_test.c
    source: isa-l-2.31.1/erasure_code/erasure_code_test.c
    description: "Encode/decode erasure vectors and recover failed sources"
    command: "./erasure_code/erasure_code_test"
  - file: erasure_code/gf_inverse_test.c
    source: isa-l-2.31.1/erasure_code/gf_inverse_test.c
    description: "GF(2^8) matrix inversion"
    command: "./erasure_code/gf_inverse_test"
  - file: erasure_code/erasure_code_update_test.c
    source: isa-l-2.31.1/erasure_code/erasure_code_update_test.c
    description: "Update erasure coding on changed source vector"
    command: "./erasure_code/erasure_code_update_test"
  - file: igzip/igzip_rand_test.c
    source: isa-l-2.31.1/igzip/igzip_rand_test.c
    description: "Randomized deflate/inflate round-trips across levels, flush types and gzip/zlib wrappers"
    command: "./igzip/igzip_rand_test"
  - file: igzip/igzip_wrapper_hdr_test.c
    source: isa-l-2.31.1/igzip/igzip_wrapper_hdr_test.c
    description: "gzip/zlib header parsing and trailer checksums"
    command: "./igzip/igzip_wrapper_hdr_test"
  - file: igzip/checksum32_funcs_test.c
    source: isa-l-2.31.1/igzip/checksum32_funcs_test.c
    description: "isal_adler32/isal_crc32 dispatch variants vs reference"
    command: "./igzip/checksum32_funcs_test"
  - file: mem/mem_zero_detect_test.c
    source: isa-l-2.31.1/mem/mem_zero_detect_test.c
    description: "Zero-buffer detection incl. first non-zero offset"
    command: "./mem/mem_zero_detect_test"
  - file: raid/xor_gen_test.c
    source: isa-l-2.31.1/raid/xor_gen_test.c
    description: "XOR parity generation across vector counts/sizes"
    command: "./raid/xor_gen_test"
  - file: raid/pq_gen_test.c
    source: isa-l-2.31.1/raid/pq_gen_test.c
    description: "P+Q (GF) parity generation"
    command: "./raid/pq_gen_test"
  - file: raid/xor_check_test.c
    source: isa-l-2.31.1/raid/xor_check_test.c
    description: "XOR parity verification"
    command: "./raid/xor_check_test"
  - file: raid/pq_check_test.c
    source: isa-l-2.31.1/raid/pq_check_test.c
    description: "P+Q parity verification"
    command: "./raid/pq_check_test"

test_package_tests:
  - file: test.c
    description: "Consumer test: 7 known-answer CRC/Adler checks, igzip stateless round-trip (5 checks), raid xor_gen parity, erasure_code gf_vect_mul vs bitwise GF reference"
    command: "./test_libisal"
  - file: test.c#gzip-interop
    description: "鸿蒙特有消费者用例：gzip_flag=IGZIP_GZIP 产出标准 gzip 流（RFC 1952 magic/trailer 校验，trailer CRC32 与 crc32_gzip_refl 交叉验证、ISIZE 校验），isal_inflate(ISAL_GZIP) 解回比对（5 checks）"
    command: "./test_libisal"
  - file: test.c#t10dif-copy
    description: "鸿蒙特有消费者用例：crc16_t10dif_copy 缝合函数（存储 DIF 场景，一趟 copy+T10 CRC），验证复制一致且 CRC 与 crc16_t10dif 相等（2 checks）"
    command: "./test_libisal"

assertion_count: 22
