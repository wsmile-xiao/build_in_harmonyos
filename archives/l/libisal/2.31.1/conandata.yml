# conandata.yml — libisal 2.31.1 (Intel ISA-L)

sources:
  url: "https://github.com/intel/isa-l/archive/refs/tags/v2.31.1.tar.gz"
  sha256: "e1d5573a4019738243b568ab1e1422e6ab7557c5cae33cc8686944d327ad6bb4"

patches:
  - patch_file: "patches/0001-igzip-adler32-neon-drop-merge-section-flag.patch"
    patch_description: >-
      igzip_isal_adler32_neon.S puts its 32-byte factor table in a
      SHF_MERGE section (.rodata.cst16,"aM"). On the OHOS PC devices
      tested, merged constant sections end up displaced at runtime:
      the adrp/adr PC-relative load reads shifted bytes, so isal_adler32
      returns a wrong B (upper 16-bit) half while A stays correct
      (checksum32_funcs_test failed 904 checks). Moving the table to
      plain .rodata fixes it; verified adler32 + full make check 16/16.
    patch_type: "portability"
  - patch_file: "patches/0002-fix-64bit-swar-detection-for-musl-aarch64.patch"
    patch_description: >-
      Upstream detects 64-bit SWAR via __WORDSIZE, a glibc-internal
      macro that musl (OHOS libc) does not define; on aarch64 neither
      _WIN64 nor __x86_64__ applies, so raid_base.c and ec_base.c
      compiled 32-bit masks (0xfefefefe) against 64-bit unsigned long
      SWAR math. pq_gen_base then produced a wrong Q for bytes 4..7 of
      every 8-byte block and pq_check_test's end test failed
      (pq_check_base returned i|2 at byte 4). Add __LP64__ (a compiler
      builtin, defined on OHOS) to the condition; behavior-neutral on
      glibc/x86 where __WORDSIZE already worked.
    patch_type: "bugfix"
