software: libisal
display: "libisal (Intel ISA-L)"
description: "Intel Intelligent Storage Acceleration Library — CRC16/32/64, igzip deflate/gzip compression, RAID XOR/PQ, GF(2^8) erasure coding, with aarch64 NEON/SVE/CRC-ext runtime dispatch"
category: compression
homepage: "https://github.com/intel/isa-l"
license: BSD-3-Clause
build_system: make

ohos_adaptation:
  key_points:
    - "官方 tag 源码包不含 configure，且 automake/autoconf/libtool 工具包在 HMDFS 无法从源码构建（configure 直接 exec EACCES + perl dlopen 失败）→ 用上游自带 Makefile.unx + make.inc（include 同一套 Makefile.am 源列表）"
    - "arch=aarch64 host_cpu=aarch64 显式传入（uname 启发式不识别 HarmonyOS）"
    - "52 个 aarch64 .S 用 .req 寄存器别名，clang 15 集成汇编器不支持 → -fno-integrated-as 挂在 CC 上（make.inc 的 CFLAGS 是普通赋值，命令行 CFLAGS 会覆盖丢 -I/-O2）走系统 GNU as 2.45"
    - "multibinary 分派 = 自修补蹦床 + getauxval(AT_HWCAP)，非 ifunc；无特性位回退基础 C 实现"
    - "TMPDIR 指向 build 目录（OHOS /tmp 只读，make.inc 探测用 mktemp）；纯静态库 + igzip CLI，打包手动 copy"
    - "OHOS conan profile 必须带 os.version（5.0/6.0），ohos-aarch64 原版缺它"
  common_dependencies: []

versions:
  "2.31.1":
    status: adapted           # 真机验证进行中
    build_date: "2026-09-19"
    format: conan
    note: "Makefile.unx 路线；make check 16 测试进 build()；test_package 13 断言（CRC/Adler 已知答案复算 + igzip round-trip + xor_gen + gf_vect_mul）；bin/igzip CLI 随包"
