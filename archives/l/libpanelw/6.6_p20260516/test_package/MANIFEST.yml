package: libpanelw/6.6_p20260516
homepage: "https://invisible-island.net/ncurses/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1; verify test/programs targets 86/86 incl. demo_panels; make -j1 check"

upstream_tests:
  - file: "test/programs"
    source: "ncurses-snapshots-6_6_20260516/test/programs"
    description: "86 upstream terminal test program entrypoints of the ncurses snapshot; every target must build, panel consumer demo_panels included"
    command: "make -j1; verify all 86 test/programs targets"
  - file: "test/Makefile.in"
    source: "ncurses-snapshots-6_6_20260516/test/Makefile.in"
    description: "Upstream make check compiles every generated public header independently"
    command: "make -j1 check"

test_package_tests:
  - file: "src/test_panel_consumer.c"
    description: "Conan CMake config target libpanelw::libpanelw plus panel deck lifecycle: window identity, visibility, above/below order, top_panel, userptr, move, replace, update_panels/doupdate, delete, teardown"
    command: "test_panel_consumer <output> <input>"
  - file: "src/test_panel_pkgconfig.c"
    description: "Relocatable panelw pkg-config consumer; -Wl,-t trace must select the libpanelw package libpanelw.a and the ncurses package libncursesw.a and no shared curses library"
    command: "isolated pkg-config panelw --cflags/--static --libs; compile, trace, and run"

assertion_count: 21
