sources:
  # LiDIA 原始宿主 http://www.informatik.tu-darmstadt.de/TI/LiDIA/ftp/LiDIA/ 已失效
  # （SageMath 文档原句："Abandoned upstream and has disappeared from the web at TU Darmstadt."）。
  # 现行事实上的上游是 LattE integrale 项目维护的 latte-patches 版本，
  # SageMath optional spkg `lidia` 亦从此取源，故此处取上游官方网址 math.ucdavis.edu。
  # 归档内含预生成 configure / Makefile.in / aclocal.m4 / ltmain.sh ⇒ 不需要 autoreconf。
  url: "https://www.math.ucdavis.edu/~latte/software/packages/lidia/current/lidia-2.3.0%2Blatte-patches-2014-10-04.tar.gz"
  sha256: "66ee8cfe229e8fe1d071bc0eafec3b281bcda22ffbe1f3443774a1312c417ffb"

patches:
  - patch_file: "patches/0001-config.sub-ohos.patch"
    patch_description: "config.sub: 识别 aarch64 机器与 -linux-ohos* 系统（2008 版 config.sub 两者皆缺，新版 GNU config.sub 亦未收录 ohos）"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "configure: 生成 config.status 时用 umask 022 取代 077 创建临时目录（HMDFS 新建目录强制 setgid，umask 077 产出 drwx--S--- 致属主亦不可写 → config.status: could not setup config files machinery，知识图谱 E011）"
    patch_type: "portability"
