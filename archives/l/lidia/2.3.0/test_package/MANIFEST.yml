# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lidia/2.3.0
homepage: "https://github.com/passagemath/upstream-LiDIA"

# 上游无 automake check 目标：全树 Makefile.am 中 TESTS/check_PROGRAMS 实测 0 命中
# （configure.ac 也无 AC_CONFIG_TEST_DIR / use tests）。test_roots_appl.cc 及其
# 输入/期望文件 test_roots.1 / test_roots.1.cmp 仅存在于 EXTRA_DIST，默认不构建。
upstream_check_command: ""

# conanfile.py build() 方法中未集成上游测试（上游无自动化测试入口）
upstream_test_in_build: false
upstream_test_command: ""

# 上游 EXTRA_DIST 中的测试资产，本适配已实际执行并单独汇报：
#   编译 src/base/polynomial/test_roots_appl.cc（LiDIA 静态库 + gmp），
#   以 test_roots.1 为 stdin 输入，与 test_roots.1.cmp 期望输出比对。
#   8 个多项式求根用例：顺序无关 + 相对容差 1e-18 口径下 8/8 通过
#   （程序自述根 "in a random order" 输出，行序严格比对不适用，见复判日志）。
upstream_tests:
  - file: src/base/polynomial/test_roots_appl.cc
    source: lidia-2.3.0+latte-patches-2014-10-04/src/base/polynomial
    description: "多项式求根测试（EXTRA_DIST 资产实跑：8 用例输入/期望比对）"
    command: "./test_roots_appl < test_roots.1"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: src/test_lidia_consumer.cpp
    description: "鸿蒙消费者用例：真实调用 LiDIA bigint（构造/gcd/lcm/大数乘/30!/素性/开方/加减共 10 项断言）"
    command: "./test_lidia_consumer"

# 测试断言总数 (近似值, 用于质量评估): 上游 8 用例 + 消费者 10 断言
assertion_count: 18
