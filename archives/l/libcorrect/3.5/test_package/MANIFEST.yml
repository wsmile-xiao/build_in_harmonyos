# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcorrect/3.5
homepage: "https://github.com/quiet/libcorrect"

# 上游测试命令 (ctest -N 分析: libcorrect 是 CMake 项目)
# 上游 tests/CMakeLists.txt 注册 7 个 add_test，其中 4 个无条件注册；
# HAVE_SSE（x86 内在函数，aarch64 上关闭）与 HAVE_LIBFEC（可选外部
# Phil Karn libfec 互操作，ohpcd registry 未发布）控制另外 3 个。
upstream_check_command: "make test_runners && ctest"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本适配配置实际实例化并运行的 4 个）
upstream_tests:
  - file: tests/convolutional.c
    source: libcorrect-3.5/tests/convolutional.c
    description: "卷积码 (convolutional) 编解码错误率模拟: rate 3/6, order 8/9/15, 多 SNR 点"
    command: "./convolutional_test_runner"
  - file: tests/convolutional-shim.c
    source: libcorrect-3.5/tests/convolutional-shim.c
    description: "卷积码 fec_shim 兼容层编解码错误率模拟 (rate 6, order 15)"
    command: "./convolutional_shim_test_runner"
  - file: tests/reed-solomon.c
    source: libcorrect-3.5/tests/reed-solomon.c
    description: "Reed-Solomon (255, 251/125) 编解码 + 错误/擦除恢复矩阵"
    command: "./reed_solomon_test_runner"
  - file: tests/reed-solomon-shim-interop.c
    source: libcorrect-3.5/tests/reed-solomon-shim-interop.c
    description: "Reed-Solomon fec_shim 互操作: (255, 239/120) 错误/擦除恢复矩阵"
    command: "./reed_solomon_shim_interop_test_runner"

# 未实例化的上游测试（全局条件分支，非当前配置可执行集合）
uninstantiated_upstream_tests:
  - file: tests/convolutional-sse.c
    source: libcorrect-3.5/tests/convolutional-sse.c
    description: "SSE 4.1 内在函数卷积测试 — HAVE_SSE 在 aarch64/OHOS 上关闭（x86intrin 不可用）"
  - file: tests/convolutional-fec.c
    source: libcorrect-3.5/tests/convolutional-fec.c
    description: "libfec 互操作卷积测试 — HAVE_LIBFEC 因可选外部 libfec 未发布而关闭"
  - file: tests/reed-solomon-fec-interop.c
    source: libcorrect-3.5/tests/reed-solomon-fec-interop.c
    description: "libfec 互操作 RS 测试 — HAVE_LIBFEC 因可选外部 libfec 未发布而关闭"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "RS(255,223) 公开 API 编解码: 编码->破坏4字节->解码逐字节恢复"
    command: "./test_libcorrect"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
