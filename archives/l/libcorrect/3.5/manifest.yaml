# 版本级 manifest — libcorrect 3.5
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.5"

# 软件名
software: libcorrect

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 GitHub archive URL（重定向到 codeload 官方 commit 归档 ee82e667）
  url: "https://github.com/quiet/libcorrect/archive/ee82e6673a806dfdf0a969b975ab36596ecc5401.tar.gz"

  # 源码校验和
  sha256: "2f6ee079aee7e8415511fef364983ec0bc6d93f1ebdd2287017bd9ca223c3565"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libcorrect 上游无 git tag/release；'3.5' 对应 master HEAD ee82e667（cmake_minimum_required VERSION 3.5）"
- "Conan tools.files.get() 依 URL 扩展名判定解压格式：裸 codeload tar.gz/<sha> URL 无扩展名被误判 zip（BadZipFile），必须用官方 github archive URL（.tar.gz 结尾，302→codeload）"
- "HAVE_SSE（x86intrin）在 aarch64/OHOS 自动关闭，convolutional-sse 测试不实例化；HAVE_LIBFEC（可选外部 libfec）未发布时 fec interop 测试不实例化"
