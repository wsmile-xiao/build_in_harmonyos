software: libcorrect
display: "libcorrect"
description: "C library for forward error correction: Reed-Solomon and convolutional codes with Viterbi decoding"
category: library
homepage: "https://github.com/quiet/libcorrect"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "纯 C99 CMake 库，仅依赖 libc（nm -D 实证），Linux/OHOS 同源构建，零补丁"
    - "上游测试为手写 C main + CTest 注册（不用 check 框架），4 个无条件注册测试全部在 conan create 内真实运行；SSE4.1/libfec 条件测试按上游平台门控不注册（与上游 GitHub CI 一致）"
    - "CMAKE_SYSTEM_NAME=OHOS 显式注入（E092/libaec 先例）；aarch64 顺带跳过 -march=native 探测"
    - "libfec API-compat shim 不随包发布（避免遮蔽真 libfec 包）；上游 .so 无 SONAME，默认 static 规避（E077 家族）"
  common_dependencies: []

versions:
  "0.0-git20260204":
    status: built
    build_date: "2026-10-02"
    conan_ref: "libcorrect/0.0-git20260204"
