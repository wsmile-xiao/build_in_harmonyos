# 版本级 manifest — libcorrect 0.0-git20260204
# 文件位置: archives/l/libcorrect/0.0-git20260204/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游 master-only，无正式 release；快照日期 2026-02-05，
# pax 头记录 commit ee82e6673a806dfdf0a969b975ab36596ecc5401）
version: "0.0-git20260204"

# 软件名
software: "libcorrect"

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-02"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub codeload master 快照，R39 单 URL）
  url: "https://github.com/quiet/libcorrect/archive/refs/heads/master.tar.gz"

  # 源码校验和（2026-10-02 本机实测下载计算）
  sha256: "4eb509e971765adca8092aef2835bad2479bfdfd0fc3b53d9fd6b4352697ed54"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=OHOS  # conanfile.py generate() 内按 profile os 守卫注入，E092/libaec 先例"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  # 无需额外变量：上游无 option() 开关；SSE4.1/libfec 探测在 aarch64 上
  # 按上游自身门控自然失败，SSE/libfec 条件测试不被注册（与上游
  # GitHub CI runner 行为一致）

  # 编译依赖列表（W0 核验：纯 C，仅 libc；测试另链 m，无需 conan 节点；
  # 上游测试为手写 C main + CTest 注册，不用 check 框架，无 check 供给需求）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++
  profile: "ci/conan/profiles/ohos-aarch64 (compiler=clang 15, os=OHOS 6.0, arch=armv8)"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零补丁：上游 CMake 在 OHOS 下原样配置构建通过）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（仅登记已入库的正式图谱条目）
knowledge_gained:
  - "E092: CMake 不识别 HarmonyOS 平台名，os=OHOS 时显式设 CMAKE_SYSTEM_NAME=OHOS/CMAKE_SYSTEM_PROCESSOR=aarch64（libaec/libbgcode 先例，本包照用即中） (ref: E092)"
  - "E077: 上游 .so 无 SONAME，shared=True 消费者会把包路径烤进 DT_NEEDED；本包默认 static 规避，conanfile 注释已记录该限制 (ref: E077)"

# submission.py:_scan_knowledge_ref() 只读**顶层** knowledge_ref
knowledge_ref:
  - "E092"
  - "E077"

# ============================================================
# 测试信息（本包测试统计的唯一权威口径）
# ============================================================

tests:
  upstream: "4 个 ctest 条目（convolutional_test、convolutional_shim_test、reed_solomon_test、reed_solomon_shim_interop_test——SSE 与 libfec 互操作测试因 aarch64/OHOS 无 libfec 不被上游注册，与上游 CI runner 一致），conanfile.py build() 内构建 test_runners 目标 + ctest 真实运行，计数唯一来源 tests/Testing/Temporary/LastTest.log"
  upstream_result: "4/4 passed（2026-10-02 OHOS aarch64 本机实测，总耗时 121.74s）"
  test_package: "2 个消费者可执行文件（test_correct：RS(255,223)+conv(1/2,K=7) 往返；test_correct_ohos：OHOS musl 加载器 + aarch64/LP64 断言 + RS(255,239,16) + conv(1/3,K=6) 独立参数往返），ctest 真实运行"

# ============================================================
# 验证记录
# ============================================================

validation:
  conan_create: "2026-10-02 本机 conan create -pr:h/-pr:b=ci/conan/profiles/ohos-aarch64 通过"
  upstream_tests: "ctest 4/4 passed（LastTest.log 口径）"
  test_package: "test_correct + test_correct_ohos 全部通过"
