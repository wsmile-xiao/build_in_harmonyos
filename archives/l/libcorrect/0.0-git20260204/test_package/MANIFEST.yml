# test_package/MANIFEST.yml — libcorrect 0.0-git20260204
# 上游官方测试声明文件 (CI build_and_test.sh L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 统计口径: 上游 tests/ 为手写 C main + CTest add_test 注册（不用 check
# 框架）。口径 ctest_entries；4 为该 master 快照在无 SSE/libfec 平台上
# 注册的全部官方测试（与上游自己 GitHub CI runner 的注册数一致——
# SSE4.1 与 libfec 互操作测试受上游 HAVE_SSE/HAVE_LIBFEC 门控，在
# aarch64/OHOS 上按上游设计不注册，非裁测）。conanfile.py build() 内
# 显式构建 test_runners 聚合目标后以
# `ctest --output-on-failure`（tests/ 子目录）真实运行，计数唯一来源为
# tests/Testing/Temporary/LastTest.log。

package: "libcorrect/0.0-git20260204"
homepage: "https://github.com/quiet/libcorrect"

upstream_test_total: 4
upstream_test_count_method: ctest_entries

# 上游测试命令 (conanfile.py build() 末尾真实执行)
upstream_check_command: "ctest --output-on-failure"
# 本配方 build() 在 conan create 内运行上游 ctest 套件并解析 LastTest.log，
# 非零失败即 conan create 失败；标记 HMBS_UPSTREAM_TEST_RESULT。
upstream_test_in_build: true

# 上游实际运行的测试（2026-10-02 OHOS aarch64 本机实测 4/4 passed，
# 总耗时 121.74s；断言点数为各测试源码内校验调用统计）
upstream_tests:
  - id: "convolutional_test"
    file: tests/convolutional.c
    source: "libcorrect master ee82e66 (2026-02-05)"
    description: "卷积码 Viterbi 译码 BER 门限验证（rate 1/2..1/3 × order 6..9 组合，AWGN 信道仿真，24 个校验点）"
    command: "./convolutional_test_runner"
    assertions: 24
  - id: "convolutional_shim_test"
    file: tests/convolutional-shim.c
    source: "libcorrect master ee82e66 (2026-02-05)"
    description: "libfec API 兼容 shim 上卷积码 BER 门限验证（12 个校验点）"
    command: "./convolutional_shim_test_runner"
    assertions: 12
  - id: "reed_solomon_test"
    file: tests/reed-solomon.c
    source: "libcorrect master ee82e66 (2026-02-05)"
    description: "RS 编码-加噪-译码回环（多组块长/消息长/错误数/擦除数组合，32 个校验点）"
    command: "./reed_solomon_test_runner"
    assertions: 32
  - id: "reed_solomon_shim_interop_test"
    file: tests/reed-solomon-shim-interop.c
    source: "libcorrect master ee82e66 (2026-02-05)"
    description: "libfec API 兼容 shim 上 RS 编码-加噪-译码回环（16 个校验点）"
    command: "./reed_solomon_shim_interop_test_runner"
    assertions: 16

# 上游未注册的测试（上游平台门控，非适配裁剪）
upstream_tests_not_registered:
  - id: "convolutional_sse_test"
    file: tests/convolutional-sse.c
    reason: "HAVE_SSE 门控：SSE4.1 探测在 aarch64 上失败（x86intrin.h 不存在），上游自身设计；上游 GitHub CI runner 同样不注册"
  - id: "convolutional_fec_test"
    file: tests/convolutional-fec.c
    reason: "HAVE_LIBFEC 门控：系统无 libfec，find_library 探测失败，上游自身设计"
  - id: "reed_solomon_interop_test"
    file: tests/reed-solomon-fec-interop.c
    reason: "HAVE_LIBFEC 门控：同上（该测试与真 libfec 互操作，需要系统 libfec）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_correct.c
    description: "消费者测试: RS(255,223,32) CCSDS 编码→3 字节损伤→译码回环比对 + 卷积码 rate 1/2 order 7 encode/decode 回环比对"
    command: "./test_correct"
  - file: test_correct_ohos.c
    description: "鸿蒙特有测试: OHOS musl 加载器(/lib/ld-musl-aarch64.so.1) + uname.machine=aarch64 + LP64 断言，并独立参数(RS 255,239,16 + conv 1/3,K=6)执行编码-损伤-译码回环"
    command: "./test_correct_ohos"

# 测试断言总数 (上游 84 校验点 + 消费者测试断言, 用于质量评估)
assertion_count: 100
