# test_package/MANIFEST.yml
# light 1.2.2 上游测试声明（六形自数的取证命令与读数见 ../notes.md「测试账」）

package: light/1.2.2
homepage: "https://github.com/haikarainen/light"

# 上游发布树（Debian .orig）不含任何测试用例：configure.ac 无 TESTS/check 注册，
# src/Makefile.am 只有 bin_PROGRAMS + install-exec-hook，`make check` 是
# automake 的隐式空目标 ⇒ 上游原生断言数 0。
upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 消费者断言（真实执行已安装二进制，每条外部调用都套 /usr/bin/timeout）
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 执行已安装 light 二进制：产物解析、ELF 架构回读、-V 版本出口、-h 选项文案面、无参数错误路径、以及 sysfs 能力缺失时 -L 的诚实降级（有诊断 + 退出码非 0 + 不被信号杀死）"
    command: "bash test.sh"

# 上游 0 条 → 适配后 6 条消费者断言；三条同源：assertion_count == test.sh PASS 行数 == 日志通过数
assertion_count: 6
