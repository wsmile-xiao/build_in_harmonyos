version: "1.2.2"
software: "light"
status: built
build_date: "2026-09-25"
build_system: "autotools"

source:
  url: "https://deb.debian.org/debian/pool/main/l/light/light_1.2.2.orig.tar.gz"
  sha256: "62e889ee9be80fe808a972ef4981acc39e83a20f9a84a66a82cd1f623c868d9c"
  tar_format: tar.gz

build:
  system: autotools
  # 发布树无 configure ⇒ build() 先 autoreconf -i 自举，再 configure/make
  configure_options:
    - "--with-udev=no"
  dependencies: []
  tool_dependencies:
    - "automake/1.18"
  cc: clang
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Debian .orig 发布树是 autogen 形态（无 configure/Makefile.in/config.guess），必须 autoreconf -i 自举"
  - "OHOS 上 /sys 全树对非特权进程 opendir 返回 EACCES，而 stat 成功——sysfs 能力面整体受限，backlight 与 net/devices 表现一致"
  - "libudev 在 HarmonyOS PC 上三个 soname 变体 dlopen 全部失败，/etc/udev 与 /run/udev ENOENT"
