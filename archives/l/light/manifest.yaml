software: light
display: "light"
description: "Linux 背光/LED 亮度调节命令行工具（sysfs 后端）"
category: utility
homepage: "https://github.com/haikarainen/light"
license: GPL-3.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "上游发布树缺全部 autotools 生成件，需 autoreconf -i 自举（automake 走 tool_requires）"
    - "运行期能力面受限：sysfs 目录 readdir 对非特权进程返回 EACCES，工具退化为无控制器可用"
    - "不链接 libudev；--with-udev 只决定是否安装一份 udev 规则文件，OHOS 无 udev 守护"
  common_dependencies: []

versions:
  "1.2.2":
    status: built
    build_date: 2026-09-25
