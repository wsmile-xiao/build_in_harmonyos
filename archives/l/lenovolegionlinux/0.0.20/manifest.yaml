# 版本级 manifest — lenovolegionlinux 0.0.20
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "0.0.20"

# 软件名
software: lenovolegionlinux

# 编译状态
# built = 配方已验证（conan create + CI L0/L1 通过），尚未 upload 到制品仓
# 注意：内核模块（.ko）本身未构建 —— 交付物是用户态 Python 层 + 上游源码快照，
#       原因见 notes.md 与 reports/upstream-test-evidence.md
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 tag 归档源（R39：CI 自动注入镜像 fallback）
  url: "https://github.com/johnfanv2/LenovoLegionLinux/archive/refs/tags/v0.0.20.tar.gz"

  # 实测 sha256（819667 bytes）
  sha256: "c9974cfde03d8fd73de0a09628189f8fd9341037f10e28649b2fe5d1ec68bb2e"

  compression: tar.gz
  archive_root: "LenovoLegionLinux-0.0.20"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  # 上游 python/setup.cfg install_requires: PyQT6, PyYAML, argcomplete, darkdetect
  # 制品仓中仅有 pyyaml，故只有它是 requires；其余三个的处置见 notes.md
  required:
    - pyyaml/6.0.2
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: >-
    package_type=application（纯 Python 用户态层，需配套 commands.json，R38）。
    build() = 目标解释器 compileall 全量字节码编译（真实编译步骤，逐文件 Compiling 日志）；
    package() = site-packages + bin 入口 + share 桌面集成文件 + 上游源码快照
    （share/lenovolegionlinux/upstream/{kernel_module,tests,python}）。
    内核模块（Kbuild obj-m + DKMS）在 OHOS 侧无法构建：无内核构建树，且
    legion-laptop.c 需要的 16 个内核内部头缺 11 个 → 源码随包交付 + fail-closed 契约测试，
    不伪造内核态通过。

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-legion-cli-argcomplete-optional.patch（legion_cli 的 argcomplete 由硬依赖降级为可选导入；无平台宏）"

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: medium
  issues:
    - "内核模块（.ko）不可交付：OHOS 无内核构建树与内核内部头（缺 11/16）"
    - "GUI（legion_gui）需 PyQt6 与 X 服务器，OHOS 制品仓无 PyQt6 制品"
    - "硬件功能（风扇曲线/电源模式/电池养护等）需真实 Legion 机型 + 已加载内核模块，无法在 CI 验证"
  notes: >-
    交付范围内（用户态 legion_linux + legion_cli）全部测试通过；内核态与 GUI 部分
    如实标注为未执行，未声明通过。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: conan-test-package
  upstream_total: 12
  upstream_executed: 2
  upstream_passed: 2
  upstream_failed: 0
  upstream_blocked: 10
  adapted_assertions: 38
  adapted_failed: 0
  note: |-
    上游共 12 个测试脚本（tests/*.sh 实测计数）。CI 中对本包交付物真实执行 2 个并通过
    （test_python_cli.sh / test_python_cli_installed.sh，后者为逐字副本，经包内 bin/legion_cli
    执行）；其余 10 个逐条给出实测阻塞证据（内核构建树/root/DKMS、xvfb/PyQt6、pkexec），
    见 reports/upstream-test-evidence.md。
    test_package 新增 38 个断言全部通过：消费者 API 9 + 鸿蒙平台 11 + 内核模块源码契约 18
    （另有上游 2 个 CLI 用例逐字执行通过，按脚本自身退出码语义，不重复计入断言数）。
    未声明通过：内核模块构建/加载、hwmon/sysfs 读值、GUI 启动。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Linux 内核模块类任务（Kbuild obj-m/DKMS）在 OHOS 用户态 conan 框架内的可交付边界：内核源码可作为 fail-closed 契约对象随包交付，但 .ko 不可构建/加载，必须在 PR 与 manifest 中分层声明"
  - "上游 tests/*.sh 中与硬件/root/GUI 无关的用例（CLI 冒烟）可在 OHOS CI 真实执行：源树变体经包内上游布局快照逐字执行，已安装变体经 conanrun PATH 执行包内 bin 入口"
  - "上游硬依赖中无 OHOS 制品的部分（本例 argcomplete，可选补全辅助）应按上游既有的可选依赖写法（darkdetect 先例）降级为可选导入，而不是裁剪功能或跳过测试"

references:
  - https://github.com/johnfanv2/LenovoLegionLinux
