# test_package/MANIFEST.yml — lenovolegionlinux/0.0.20
# CI L0e 要求此文件存在（上游官方测试声明）。所有数字均为实测，口径写在命令里。

package: lenovolegionlinux/0.0.20
homepage: "https://github.com/johnfanv2/LenovoLegionLinux"

# ── 上游测试入口 ──
# 上游没有 make check / ctest / pytest 目标（顶层无 Makefile，构建系统为
# kernel_module/Makefile 的 Kbuild 与 python/setup.cfg 的 setuptools），
# 全部测试是 tests/ 下的 12 个 shell 脚本，逐脚本手工调用。
upstream_check_command: "bash tests/<script>.sh（12 个脚本，无统一 runner）"
upstream_test_in_build: false
upstream_test_command: ""

# ── 上游用例总数（实测口径 = tests/*.sh 文件数）──
upstream_test_count: 12
upstream_test_count_command: "ls tests/*.sh | wc -l   # = 12"

# ── 在 CI 中对本包交付物真实执行的上游用例 ──
upstream_test_executed: 2
upstream_test_executed_command: >-
  bash <test_package>/test_python_cli_installed.sh
  （= 上游 tests/test_python_cli_installed.sh 逐字副本，经 PATH 执行包内 bin/legion_cli）
  → PASS；bash <pkg>/share/lenovolegionlinux/upstream/tests/test_python_cli.sh
  （= 上游原始脚本，未改一行，针对包内上游源码快照执行）→ PASS
upstream_test_unexecuted: 10
upstream_test_unexecuted_reason: >-
  10 个未执行用例分三类，逐条实测证据见
  archives/l/lenovolegionlinux/0.0.20/reports/upstream-test-evidence.md：
  ① 5 个内核态用例需要 Linux 内核构建树 + root（make / make install / make dkms /
  make reloadmodule / 内核 checkpatch）——OHOS 侧 /lib/modules/$(uname -r)/build、
  usr/src、include/generated 均不存在，legion-laptop.c 依赖的 16 个内核内部头只有 5 个
  存在（4 个为 _UAPI_ 桩），缺 11 个；② 4 个 GUI 用例需要 X 显示（xvfb-run）与 PyQt6
  ——OHOS 制品仓无 PyQt6 制品且无 X 服务器；③ 1 个用例要求 sudo pkexec（polkit 提权）
  ——与本仓非特权用户空间适配框架冲突。

# ── 上游用例逐条状态 ──
upstream_tests:
  - file: tests/test_kernel_build.sh
    source: tests/test_kernel_build.sh
    status: blocked
    reason: "`cd kernel_module && make` 需要 KSRC=/lib/modules/$(uname -r)/build（OHOS 侧不存在）"
  - file: tests/test_kernel_checkpath.sh
    source: tests/test_kernel_checkpath.sh
    status: blocked
    reason: "需要 deploy/dependencies/install_dir/checkpatch.pl（上游 submodule，tarball 不含）"
  - file: tests/test_kernel_dkms_install.sh
    source: tests/test_kernel_dkms_install.sh
    status: blocked
    reason: "`sudo apt-get install dkms` + `sudo make dkms`：OHOS 无 apt/dkms，且需 root"
  - file: tests/test_kernel_install.sh
    source: tests/test_kernel_install.sh
    status: blocked
    reason: "`make` + `sudo make install` 安装 .ko 到 /lib/modules：无内核构建树且需 root"
  - file: tests/test_kernel_reload.sh
    source: tests/test_kernel_reload.sh
    status: blocked
    reason: "`sudo make reloadmodule` 循环 20 次：需已加载的内核模块与 root"
  - file: tests/test_python.sh
    source: tests/test_python.sh
    status: blocked
    reason: "pylint 未随 OHOS 制品仓分发（用例本体为静态检查，无 pylint 即无法执行）"
  - file: tests/test_python_cli.sh
    source: tests/test_python_cli.sh
    status: executed
    reason: "已对包内上游源码快照逐字执行并通过（本次 CI 实测）"
  - file: tests/test_python_cli_installed.sh
    source: tests/test_python_cli_installed.sh
    status: executed
    reason: "已对包内 bin/legion_cli 逐字执行并通过（本次 CI 实测）"
  - file: tests/test_python_gui.sh
    source: tests/test_python_gui.sh
    status: blocked
    reason: "需要 xvfb-run（X 服务器）与 PyQt6；OHOS 制品仓无 PyQt6 制品"
  - file: tests/test_python_gui_installed.sh
    source: tests/test_python_gui_installed.sh
    status: blocked
    reason: "同上（已安装形态的 GUI 冒烟）"
  - file: tests/test_python_installed.sh
    source: tests/test_python_installed.sh
    status: blocked
    reason: "组合脚本，内部调用 test_python_gui_installed.sh，随 GUI 用例阻塞"
  - file: tests/test_python_run_gui_root.sh
    source: tests/test_python_run_gui_root.sh
    status: blocked
    reason: "`sudo pkexec ls`：需 polkit 提权，OHOS 适配框架为非特权用户空间沙箱"

# ── 本包 test_package 自带测试（全部真实执行，R34）──
test_package_tests:
  - file: test_legion_api.py
    description: "消费者用例：真实调用包内 legion_linux API（FanCurve/FanCurveEntry YAML 往返、LegionModelFacade(expect_hwmon=False)、sysfs 基准路径契约）"
    command: "python3 test_legion_api.py <site-packages>"
    executable: true
  - file: test_python_cli_installed.sh
    description: "上游 tests/test_python_cli_installed.sh 逐字副本：经 conanrun PATH 执行包内 bin/legion_cli --donotexpecthwmon"
    command: "bash test_python_cli_installed.sh"
    executable: true
  - file: test_ohos_platform.sh
    description: "鸿蒙特有测试：site-packages/入口打包契约、目标解释器可导入、无 Legion 内核接口时的优雅降级（无 traceback）、argcomplete 可选化、不得交付预编译 .ko"
    command: "bash test_ohos_platform.sh <package_folder> <python3>"
    executable: true
  - file: test_kernel_module_contract.sh
    description: "内核模块源码契约 fail-closed 校验（module_init/exit、ACPI-WMI、DMI 机型绑定、hwmon、platform_profile、Kbuild obj-m/KSRC、DKMS、无预编译 .ko）"
    command: "bash test_kernel_module_contract.sh <snapshot_folder>"
    executable: true

# ── 断言总数 ──
# test_legion_api.py 9 + test_ohos_platform.sh 11（含 1 个 python 断言）+ 
# test_kernel_module_contract.sh 18（12 个 require + 6 个显式断言）= 38
# 另有上游两个 CLI 用例以脚本自身退出码语义逐字执行（不重复计入断言数）
assertion_count: 38

# ── 明确未声明通过的部分（防止把「源码契约」误读为「内核态功能通过」）──
not_verified:
  - "内核模块构建（.ko）：OHOS 侧无内核构建树与内核内部头，未执行"
  - "内核模块加载/卸载（insmod/modprobe/rmmod）与 sysfs/hwmon 读值：需真实 Legion 机型与 root，未执行"
  - "GUI（legion_gui）：需 PyQt6 与 X 服务器，两者在 OHOS 侧均不存在，未执行"
