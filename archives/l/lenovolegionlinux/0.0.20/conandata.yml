# conandata.yml — lenovolegionlinux 0.0.20
#
# R39: URL 为上游官方 tag 归档源（CI 会自动注入镜像 fallback，故此处只写官方 URL）。
# sha256 为实测下载计算值（819667 bytes，tar.gz），与上游 tag v0.0.20 一致。
sources:
  url:
    - "https://gh-proxy.com/https://github.com/johnfanv2/LenovoLegionLinux/archive/refs/tags/v0.0.20.tar.gz"
    - "https://github.com/johnfanv2/LenovoLegionLinux/archive/refs/tags/v0.0.20.tar.gz"
  sha256: "c9974cfde03d8fd73de0a09628189f8fd9341037f10e28649b2fe5d1ec68bb2e"

patches:
  - patch_file: "patches/0001-legion-cli-argcomplete-optional.patch"
    patch_description: >-
      legion_cli: 把 argcomplete（shell 补全辅助，非功能必需）从硬依赖降级为可选导入，
      与上游对 darkdetect 的处理方式一致。制品仓无 argcomplete 制品，硬依赖会让 CLI 在
      OHOS PC 上完全无法启动（功能本身不依赖补全）。补丁不含平台宏（R8）。
    patch_type: "portability"
  - patch_file: "patches/0002-legion-shell-portability.patch"
    patch_description: >-
      legion.py: 不再硬依赖 bash —— 上游用 `bash -c` 执行 dmesg / systemd 服务状态等
      可选探测，OHOS PC 只提供 POSIX shell（/system/bin/sh），bash 缺失时 Popen 抛
      FileNotFoundError，被 CommandFeature._exec_cmd 重新抛出后直接使
      `LegionModelFacade` 构造崩溃（CI 构建 #53594 实测：`No such file or directory: 'bash'`
      → traceback → test_package 失败）。改为
      `SHELL = shutil.which('bash') or shutil.which('sh') or 'sh'` 选择可用 shell。
      补丁不含平台宏（R8）。
    patch_type: "portability"
