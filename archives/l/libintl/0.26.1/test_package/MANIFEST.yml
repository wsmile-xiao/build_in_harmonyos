# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libintl/0.26.1
homepage: ""

# 无上游测试（自研 shim，非上游软件包）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，R34 实质调用被测包)
test_package_tests:
  - file: test_libintl.c
    description: "C 级验证：dlopen libintl.so.8 并校验同时导出 libintl_* 与 g_libintl_* 双符号集"

# 测试断言总数
assertion_count: 3
