# 版本级 manifest — libobjc2 2.2.1
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.2.1"

# 软件名
software: "libobjc2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-19"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/gnustep/libobjc2/tar.gz/refs/tags/v2.2.1"

  # 源码校验和
  sha256: "768ea8c5bd0999a29b5d15781125494f986456c1dc5c51d370fb31852cd31ea1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DTESTS=ON"
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DFETCHCONTENT_SOURCE_DIR_ROBINMAP=<本地 robin-map v1.2.1>"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 注: tsl-robin-map 由配方内 vendored 下载（GitHub 不可达, codeload 可用）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 注: 无源码补丁; robin-map 依赖通过配方 conanfile.py 处理
#     (download + FETCHCONTENT_SOURCE_DIR_ROBINMAP)

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libobjc2 使用 CMake 构建(非 autotools)，conan-init 的 autotools 模板需替换为 CMake 模板"
- "codeload.github.com URL 无 .tar.gz 后缀，conan get()/download() 需显式指定 filename 才能识别压缩格式(BadZipFile 修复)"
- "robin-map v1.2.1 的 CMakeLists 声明 cmake_minimum_required(VERSION 2.8)，CMake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
- "GitHub 不可达时，FetchContent 依赖可通过 vendored download + FETCHCONTENT_SOURCE_DIR_<NAME> 解决"
- "鸿蒙 libunwind 未实现 _Unwind_Resume()，Objective-C++/C++ 异常跨语言展开测试受平台限制失败(10/190)"
