# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: lwip/2.2.1
homepage: "https://savannah.nongnu.org/projects/lwip/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# lwIP 官方 test/unit 使用 check 框架，Makefile 入口: test/unit/Makefile check
upstream_check_command: "make -C test/unit check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (check 框架单元测试, 见 reports/upstream_test_ledger 双口径台账)
upstream_tests:
  - file: test/unit/lwip_unittests.c
    source: lwip-2.2.1/test/unit/lwip_unittests.c
    description: "lwIP check 框架单元测试主程序 (137 用例, 覆盖 core/ip4/ip6/tcp/udp/dhcp/mdns/mqtt 等)"
    command: "./lwip_unittests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: lwip_init + tcp_new 真实 API 调用"
    command: "./test_lwip"

# 测试断言总数 (近似值, 用于质量评估): 上游 137 用例 + test_package 1 用例 + 消费者/平台测试 2
assertion_count: 140
