version: "26.04.0"
software: "libkmahjongg"

# published | built | failed | archived
status: built
build_date: "2026-09-14"
build_system: cmake

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/libkmahjongg-26.04.0.tar.xz"
  sha256: "6720c525249cfd7d9e9879aa97fcb92fde5da29095313847667adbc38430bbd9"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
    - "-DBUILD_TESTING=OFF"
  dependencies:
    - qtbase/6.11.1
    - qtsvg/6.11.1
    - kconfig/6.14.0
    - kconfigwidgets/6.14.0
    - kcoreaddons/6.14.0
    - kwidgetsaddons/6.14.0
    - ki18n/6.14.0
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "KF6 类 CMake 库在 OHOS 需要 KF_IGNORE_PLATFORM_CHECK=TRUE + KF_SKIP_PO_PROCESSING=ON"
  - "qtsvg 为 cmake_find_mode=none，需显式设置 Qt6Svg_DIR 指向 qtsvg 包 lib/cmake/Qt6Svg"
  - "ECM_MODULE_PATH 需手动设置（CMakeDeps 生成的不传播）"
  - "OHOS ELF 需 binary-sign-tool 签名，package() 中必须 sign 已安装 ELF（否则 loader Permission denied）"
  - "本地 conan create --build=missing 重编译的 KF6/Qt6 依赖包缺签名会致运行时加载失败，需对缓存内 .so 重新签名"
