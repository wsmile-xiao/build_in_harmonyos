# 软件级 manifest — libcryptui
# 遵循 ARCHIVE-SPEC v2.0

software: libcryptui

display: "libcryptui"

description: "GNOME Seahorse 拆出的密钥选择/加密 UI 库：收件人/签名密钥选择对话框与 GtkTreeModel 密钥模型，供第三方应用复用"

category: library

homepage: "https://gitlab.gnome.org/Archive/libcryptui"

license: LGPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "SUBDIRS 裁剪是唯一的依赖面收敛手段：daemon/（gnome-keyring + gpgme + MIME 数据库）与 libegg/（libSM/libICE）是重依赖的唯一消费者，裁到 libcryptui + data 后库本体只需 gtk+-3.0/gio-2.0/dbus-glib-1"
    - "configure 内嵌硬闸须同步降级（8 处）：intltool/XML::Parser 与 perl 版本（po/ 已裁）、SM/ICE 的 PKG_CHECK_MODULES（无 action-if-not-found 分支）、glib-compile-schemas 的 pkg-config 变量探测（conan 生成的 gio-2.0.pc 无 glib_compile_schemas 变量）"
    - "tarball 自带 cryptui-marshal.c/.h 且比 .list 新：构建前 touch 产物即可让 make 判定 Up-to-date，绕开 OHOS 上 conan 包内未签名 glib-genmarshal 无法 exec 的问题"
    - "依赖包 .la 的 libdir='//lib'（conan --prefix=/ 拼接产物）会让 libtool 链接本库时报 'is not a valid libtool archive'：构建前就地改写依赖 .la 的 libdir/dependency_libs（E236，libgsf 1.14.5 先例）"
    - "HMDFS 上 autotools 的两个独立打击面：`ac_pwd=`pwd`` 判定失败、`umask 077 && mktemp -d` 得到不可写的 drwx--S--- 目录"

  common_dependencies:
    - gtk/3.24.43
    - dbus-glib/0.114.1

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.12.2":
    status: built
    build_date: "2026-10-01"
