# conandata.yml — libcryptui 3.12.2
# R39：GNOME 官方发布站 download.gnome.org 为主源，并列官方镜像 fallback
# （ustc / tuna / nju 均为 GNOME 官方镜像），CI 侧按序回退。

sources:
  url:
    - "https://download.gnome.org/sources/libcryptui/3.12/libcryptui-3.12.2.tar.xz"
    - "https://mirrors.ustc.edu.cn/gnome/sources/libcryptui/3.12/libcryptui-3.12.2.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/gnome/sources/libcryptui/3.12/libcryptui-3.12.2.tar.xz"
    - "https://mirror.nju.edu.cn/gnome/sources/libcryptui/3.12/libcryptui-3.12.2.tar.xz"
  sha256: "71ead1a7b496f07f6c5102ae79945dd2515b7b9342c6edefe58b47318be20866"

# 补丁均以 `a/`、`b/` 前缀生成 → 需显式 strip: 1
# （conan tools.files.patch 默认 strip=0，会去找 ./a/config.guess 而失败）。
patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: 识别 HarmonyOS 内核（*:HarmonyOS:* → ${MACHINE}-unknown-linux-ohos，musl libc）"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: 接受 *-linux-ohos 三元组（aarch64-unknown-linux-ohos）"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: 豁免 intltool(XML::Parser)/gettext 工具硬闸、ac_pwd 回退（HMDFS）、SM/ICE 由硬依赖降级（libSM/libICE 在 OHOS 不可用且其唯一消费者 libegg/eggsmclient 已被裁掉）"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0004-subdirs.patch"
    patch_description: "Makefile.am/Makefile.in: SUBDIRS 裁剪为 libcryptui(库本体)+data(gsettings schema)，去掉 daemon/libegg/reference/po/pixmaps"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0005-configure-intltool-perl.patch"
    patch_description: "configure: intltool 的 perl 存在性/perl>=5.8.1/XML::Parser 三处硬闸降级为 no-op（po/ 已从 SUBDIRS 裁掉，intltool 在本构建无消费者；无 perl XS 模块的环境不应因此中断）"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0006-configure-glib-compile-schemas.patch"
    patch_description: "configure: glib-compile-schemas 在非交叉分支（pkg-config 变量为空，conan 生成的 gio-2.0.pc 无 glib_compile_schemas）回退到 PATH 查找，避免 as_fn_error 硬失败"
    patch_type: "portability"
    strip: 1
