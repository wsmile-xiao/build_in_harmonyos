# libcryptui 3.12.2 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "3.12.2"

software: libcryptui

# 编译状态
# published | built | failed | archived
# built = 配方 + test_package 就绪，且本机 conan create 已通过（G2 PASS，含
# test_package 16 项 TAP 断言 16/16）；制品上传由 CI release 流水线在合并后完成，
# 故合并前据实为 built（不预支 published）。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（download.gnome.org 为 GNOME 官方发布站）
  url: "https://download.gnome.org/sources/libcryptui/3.12/libcryptui-3.12.2.tar.xz"

  # 源码校验和
  sha256: "71ead1a7b496f07f6c5102ae79945dd2515b7b9342c6edefe58b47318be20866"

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  # daemon/（gnome-keyring+gpgme）、libegg/（libSM/libICE）、reference/（gtk-doc）、
  # po/（intltool）、pixmaps/ 已在补丁中从 SUBDIRS 裁掉，故相关开关一并关闭。
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--disable-nls"
    - "--disable-gtk-doc"
    - "--disable-introspection"
    - "--disable-update-mime-database"
    - "--disable-schemas-compile"
    - "--disable-gpg-check"
    - "--disable-libnotify"

  # 编译依赖列表（格式: name/version）
  # 库本体需求即 cryptui.pc.in 的 Requires：gtk+-3.0 gio-2.0 dbus-glib-1
  # （gio-2.0/glib 经 gtk 传递；gnome-keyring/gpgme/libSM/ICE 仅 daemon 与
  #  libegg 使用，已随子目录裁剪移除）
  dependencies:
    - gtk/3.24.43
    - dbus-glib/0.114.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-config.guess.patch"
  - "patches/0002-config.sub.patch"
  - "patches/0003-configure.patch"
  - "patches/0004-subdirs.patch"
  - "patches/0005-configure-intltool-perl.patch"
  - "patches/0006-configure-glib-compile-schemas.patch"

# ============================================================
# 测试统计（rule4：N=上游源码包 test/tests 目录文件数）
# ============================================================

test_summary:
  upstream_test_files: 3            # libcryptui/tests/ 目录文件数（N 口径）
  upstream_executable_tests: 1      # libcryptui/tests/cryptui-test-ui.c（138 行）
  upstream_runnable: 0              # 无 headless 可跑用例
  upstream_display_limited: 1       # 唯一用例首行 gtk_init() → OHOS 无窗口系统
  consumer_assertion_count: 16      # test_package 消费者用例 TAP 断言数
  consumer_assertion_result: "16/16 通过"   # 本机 conan create 实测 16 ok / 0 not ok
  not_executed:
    - file: libcryptui/tests/cryptui-test-ui.c
      reason: >-
        用例 main() 首行即 gtk_init(&argc, &argv)，依赖 GTK 显示连接；
        HarmonyOS PC 无窗口系统（无 X11/Wayland/EGL），且 Broadway 无头后端所需的
        unix socket bind 被平台拒绝，故本机/CI 均无法执行。配方在 build() 中对
        `make check` 做非致命尝试（日志留痕），绝不把未执行计为通过。
  notes: >-
    消费者用例（test_package/test_libcryptui.c）16 项 TAP 断言覆盖真实消费路径：
    公共头包含（按上游要求定义 LIBCRYPTUI_API_SUBJECT_TO_CHANGE）、链接
    libcryptui.so、库内真实逻辑 cryptui_key_get_base() 的 5 种输入（裸密钥/单冒号/
    双冒号截断/4 段以上/前导冒号）、GObject 类型注册（CRYPTUI_TYPE_KEY_STORE 及
    父类 GtkTreeModelSort，验证 libcryptui↔gtk-3↔dbus-glib 链接完整性）、
    CryptUIKeyStore 模型列布局（NAME==0/KEY==6/NCOLS==7）以及 6 个 ABI 常量的
    跨进程约定值。刻意避开需要窗口系统或 DBus 会话总线的入口
    （cryptui_prompt_* / cryptui_key_get_enctype / cryptui_key_store_new）。
    断言与用例执行结果以 CI 日志为准（逐项打印 TAP）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "GNOME 3.x 时代 autotools + intltool 库在 OHOS 的最小可行裁剪法：库本体与守护进程/示例/翻译支线严格分层，仅将 SUBDIRS 裁到 <库目录> + data 即可绕开 gnome-keyring/gpgme/libSM/libICE/gtk-doc/intltool 整条依赖面——libcryptui 的 daemon/ 与 libegg/ 是唯一吃这些依赖的消费者，configure 的硬闸需同步降级（SM/ICE 的 PKG_CHECK_MODULES 无 action-if-not-found 分支，必须改 as_fn_error）"
  - "Autotools 分发的 marshal 产物（BUILT_SOURCES）是最省事的交叉编译捷径：cryptui-marshal.c/.h 由 glib-genmarshal 生成但随 tarball 分发，且比 .list 新；构建前触摸产物即可让 make 判定 Up-to-date，彻底避开 OHOS 上 conan 包内未签名 ELF 工具无法 exec（E077）的问题，无需像 gtksourceview 那样拷贝+重签工具"
  - "HMDFS 对 autotools 生成脚本的两个独立打击面：`ac_pwd=`pwd``（工作目录判定失败 → 'working directory cannot be determined'）与 `umask 077 && mktemp -d`（config.status 临时目录被 SGID 语义变成 drwx--S--- 不可写）；两者都需在 configure 内嵌模板上打补丁，且补丁位置在生成脚本而非 configure.ac"
  - "gsettings schema 库的安装期钩子取舍：OHOS 上 glib-compile-schemas 是未签名 aarch64 ELF，configure 的 GSETTINGS_RULES 钩子必然失败；用 --disable-schemas-compile 保构建，再由配方在 package() 内拷贝+自签+执行该工具做 best-effort 编译（失败仅告警），比让 CI 在 install 阶段硬失败更稳"
  - "conan tools.files.patch 默认 strip=0：以 `a/`、`b/` 前缀生成的补丁必须在 conandata.yml 的条目里显式写 strip: 1（apply_conandata_patches 会把条目其余键原样作为 kwargs 透传给 patch()），否则 patch 会去找 ./a/config.guess 而报 'No file to patch'"
  - "cryptui.h 是 #error 强制宏的典型：上游要求消费者定义 LIBCRYPTUI_API_SUBJECT_TO_CHANGE 才允许包含；配方应用 cpp_info.defines 替 CMakeDeps 消费者兜底，纯 pkg-config 消费者（.pc 不携带该宏）仍需自行 -D"
