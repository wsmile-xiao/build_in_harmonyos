package: libcryptui/3.12.2
homepage: "https://wiki.gnome.org/Apps/Seahorse"

# 上游唯一测试用例：libcryptui/tests/cryptui-test-ui.c（libcryptui/Makefile.am:
# SUBDIRS = . tests，noinst_PROGRAMS = cryptui-test）。
# 该用例 main() 按 argv 选模式：plain/normal/symmetric 弹 GTK 对话框（需真人
# 交互）；keyset 为无 UI 模式（遍历 keyset，无 seahorse 服务时为空、正常退出 0）。
upstream_check_command: "cryptui-test keyset（dbus-run-session + GDK_BACKEND=broadway）"

# 上游用例真实执行（rule4）：配方 package() 把构建树中的 cryptui-test ELF
# 收入包内 tools/ 并随包签名（E489）；test_package test() 经依赖图的
# dbus-run-session + broadwayd 以 keyset 模式真跑，GTK/broadway/DBus 栈
# 全链路初始化，退出码 0。
upstream_test_in_build: false
upstream_test_command: "dbus-run-session <pkg>/tools/cryptui-test keyset（BROADWAY_DISPLAY=:N，XDG_RUNTIME_DIR=构建目录）"

upstream_tests:
  - file: libcryptui/tests/cryptui-test-ui.c
    source: libcryptui-3.12.2/libcryptui/tests/cryptui-test-ui.c
    description: "上游唯一用例（gtk_init → cryptui_keyset_new(openpgp) → 按 argv 分支）。keyset 模式为无 UI 自动化路径：GTK 初始化走 broadway 无头后端，keyset 经 session bus 查询 seahorse 服务（无服务时空表遍历 0 项后 exit 0）。平台事实：broadwayd 的 unix socket 落在 $XDG_RUNTIME_DIR——此前『bind 被平台拒绝』的真实根因是 E002（/tmp 在 HMDFS 只读），XDG_RUNTIME_DIR 指向构建目录后 bind 正常。"
    command: "dbus-run-session <pkg>/tools/cryptui-test keyset"
    result: executed
    exit_code: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libcryptui.c
    description: >-
      Consumer test（16 项 TAP 断言）：包含安装后的公共头（按上游要求定义
      LIBCRYPTUI_API_SUBJECT_TO_CHANGE）、链接 libcryptui.so；库内真实逻辑
      cryptui_key_get_base() 的 5 种输入（裸密钥/单冒号/双冒号截断/4 段以上/前导冒号）；
      GObject 类型注册 CRYPTUI_TYPE_KEY_STORE 及父类 GtkTreeModelSort
      （验证 libcryptui↔gtk-3↔dbus-glib 链接完整性）与 G_TYPE_OBJECT 派生；
      CryptUIKeyStore 模型列布局（NAME==0/KEY==6/NCOLS==7）；6 个 ABI 常量
      （CryptUIEncType/CryptUIKeyFlags/CryptUILocation/CryptUIValidity）的跨进程约定值。
    command: "./test_libcryptui"

assertion_count: 16
