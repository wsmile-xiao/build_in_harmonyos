# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libhwy/1.3.0
homepage: "https://github.com/google/highway"

# 上游测试命令
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (highway 1.3.0 官方测试套件)
# Highway 上游使用 HWY_ENABLE_TESTS 开关控制测试构建，
# 测试经 CTest 调度，使用自带 standalone 运行器（不下载 GTest）。
upstream_tests:
  - file: hwy/tests/
    source: highway-1.3.0/hwy/tests/
    description: "Highway SIMD 官方测试套件 — 覆盖算术/逻辑/类型转换/压缩/排序/密码学及 contrib"
    command: "ctest --output-on-failure"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/CMakeLists.txt
    description: "find_package(hwy REQUIRED CONFIG) + target_link_libraries hwy::hwy"
    command: "cmake --configure"
  - file: test_package/test_libhwy.cpp
    description: "SupportedTargets/TargetName/lane count/SIMD load/Iota/Set/Store 运算 + 非活跃 lane 保护（7 个显式检查）"
    command: "./test_libhwy"

# 测试断言总数 (test_libhwy.cpp 中 Check() 调用数, 用于质量评估)
assertion_count: 7
