# 版本级 manifest — libhwy 1.3.0
# 遵循 ARCHIVE-SPEC v3.0

version: "1.3.0"
software: libhwy

# published | built | failed | archived
status: built

build_date: "2026-09-19"
build_system: cmake

source:
  url: "https://github.com/google/highway/archive/refs/tags/1.3.0.tar.gz"
  sha256: "07b3c1ba2c1096878a85a31a5b9b3757427af963b1141ca904db2f9f4afe0bc2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF"
    - "with_upstream_tests=True (default)"
    - "HWY_ENABLE_CONTRIB=ON with upstream tests"
    - "HWY_ENABLE_EXAMPLES=OFF"
    - "HWY_ENABLE_TESTS=ON with upstream tests"
    - "HWY_TEST_STANDALONE=ON with upstream tests"
    - "HWY_FORCE_STATIC_LIBS=ON"
    - "HWY_WARNINGS_ARE_ERRORS=OFF"
  dependencies: []
  cc: clang (from profile conf tools.build:compiler_executables)
  cxx: clang++ (from profile conf tools.build:compiler_executables)

patches_applied: []

knowledge_gained:
  - "Google Highway 在 OHOS aarch64 下自动选用 NEON 路径；CMake 无 HarmonyOS 平台模块，需 CMAKE_SYSTEM_NAME=Linux 选中 Linux/NEON 分支"
  - "HWY_TEST_STANDALONE=ON 使用上游自带轻量测试框架，不从网络下载 googletest，CI 沙箱可完整运行上游 CTest 套件"
  - "部分 CI worker 缺少 lld 依赖的 libxml2 共享库，generate() 中 CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY 跳过编译器检测链接步骤"

libs:
  - hwy

requires: []

test_package:
  type: cmake-consumer
  checks: 7

adaptation_paths:
  - A
