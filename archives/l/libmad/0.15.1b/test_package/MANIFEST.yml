# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libmad/0.15.1b
homepage: "https://www.underbit.com/products/mad/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (libmad 0.15.1b 无独立测试程序)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试 — 验证 mad_version_string、mad_decoder_init/finish、mad_header_init/finish API 可调用"
    command: "./test_libmad"
  - file: test_ohos.c
    description: "HarmonyOS aarch64 专项测试 — 真实 MPEG-1 Layer II 帧解码验证 FPM_DEFAULT/SIZEOF_LONG=8 定点运算"
    command: "./test_ohos"

# 测试断言总数
assertion_count: 9
