package: libmad
version: "0.15.1b"
homepage: "https://www.underbit.com/products/mad/"
license: GPL-2.0-or-later
status: built
build_system: autotools
build_date: "2026-08-27"

source:
  url: "https://deb.debian.org/debian/pool/main/libm/libmad/libmad_0.15.1b.orig.tar.gz"
  sha256: "bbfac3ed6bfbc2823d3775ebb931087371e142bb0e9bb1bee51a76a6e0078690"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "inline: config.guess HarmonyOS aarch64 detection"
  - "inline: config.sub ohos/linux-ohos canonical names"
  - "inline: configure remove GCC-only flags unsupported by clang"
  - "inline: configure HMDFS mktemp workaround in config.status template"
  - "inline: mad.h FPM_INTEL->FPM_DEFAULT, SIZEOF_LONG 4->8 for aarch64"

knowledge_gained:
  - "libmad 0.15.1b 的 configure 含 GCC 专属优化 flag（-fforce-mem 等），clang 需在 configure 内剔除" reference: "DRAFT-libmad-0.15.1b-clang-gcc-only-optimization-flags"
  - "config.guess/config.sub 需增加 HarmonyOS/ohos 识别，否则 host triple 无法识别" reference: "E007,E205,E268"
  - "HMDFS 文件系统 mktemp -d 行为受限，configure config.status 模板需改用固定临时目录" reference: "E011,E052,E060"
  - "aarch64 上 mad.h 默认 FPM_INTEL/SIZEOF_LONG=4 会导致定点运算位宽错误，需切 FPM_DEFAULT 与 SIZEOF_LONG=8" reference: "DRAFT-libmad-0.15.1b-aarch64-fixed-point-width-wordsize"

upstream_tests:
  command: "make check"
  test_count: 0
  notes: "libmad 0.15.1b 官方发布包未附带独立测试程序或 fixture；make check 无注册测试入口。"

test_package:
  assertion_count: 6
  description: "Links libmad, verifies mad_version string, mad_decoder_init/finish and mad_header_init/finish API callability."
