# test_package/MANIFEST.yml
# Upstream official test declaration (CI L0e and conan-verify G1 require this file)
package: libg3d/0.0.8
homepage: "http://automagically.de/g3dviewer/"

# Upstream test suite: 4 smoke programs in tests/ (tests/Makefile.am
# noinst_PROGRAMS). There is no automake TESTS registration, so plain
# `make check` only recurses. The recipe build() runs `make -j1 check` to
# build the tree and then executes each program individually, emitting
# HMBS_UPSTREAM_TEST_RESULT with the true per-program outcome; the JSON
# verdict is stored as hmbs_upstream_result.json in the package so
# test_package can re-emit it on Conan cache hits where build() is skipped.
upstream_tests_exist: true
upstream_test_framework: autotools-check
upstream_test_count: 4
upstream_test_total: 4
upstream_test_count_method: autotools_tests
upstream_test_audit: |
  Upstream libg3d 0.0.8 tarball (806038-byte orig, verified locally)
  contains tests/ with exactly 4 programs declared in tests/Makefile.am
  noinst_PROGRAMS: test_lib (test_lib.c), test_buf (test_buf.c),
  test_imgdump (test_imgdump.c) + test_cxx (test_cxx.cxx, gated by
  configure.in --enable-cxxtest / HAVE_CXX). No automake TESTS variable,
  no gtest/pytest/ctest harness, so the canonical count
  (autotools_tests caliber) is 4 test programs. Recipe passes
  --enable-cxxtest so all 4 build, then runs tests/test_lib,
  tests/test_buf, tests/test_imgdump, tests/test_cxx one by one in
  build() (test_buf expects 0x01234567 MSB/LSB output, test_cxx expects
  "got context"; each execution is exactly one counted test).
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "conanfile.py build() _run_upstream_tests(): make -j1 check to build, then run tests/test_lib tests/test_buf tests/test_imgdump tests/test_cxx with per-program rc/output verification"
upstream_tests:
  - file: tests/test_lib.c
    source: libg3d-0.0.8/tests/test_lib.c
    description: "Upstream smoke program: context new/load/free (run with no args)"
    command: "tests/test_lib"
  - file: tests/test_buf.c
    source: libg3d-0.0.8/tests/test_buf.c
    description: "Upstream smoke program: stream BE/LE buffer checks, expects 0x01234567 output"
    command: "tests/test_buf"
  - file: tests/test_imgdump.c
    source: libg3d-0.0.8/tests/test_imgdump.c
    description: "Upstream smoke program: texture load path (run with no args)"
    command: "tests/test_imgdump"
  - file: tests/test_cxx.cxx
    source: libg3d-0.0.8/tests/test_cxx.cxx
    description: "Upstream smoke program: C++ context check, expects 'got context' (needs --enable-cxxtest)"
    command: "tests/test_cxx"

# Consumer tests shipped in test_package (consumer view of the delivered library)
test_package_tests:
  - file: test_package/test_libg3d.c
    description: "Consumer test: context/material/primitive/object/model APIs, 12 assertions (box verts, faces, radius, scale, sphere, fresh model)"
    command: "./test_libg3d"

assertion_count: 12
