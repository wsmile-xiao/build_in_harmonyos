# test_package/MANIFEST.yml — libmusicbrainz5 5.1.0-git20150707 适配验证清单
#
# ── 上游测试清点（R51）──
# 构建系统: CMake
# 上游仓库: https://github.com/metabrainz/libmusicbrainz
# 快照 commit: 97f98a6e04d6ae0bc7c1a7f8003e25b6c364d59b (2015-07-07)
#
# 上游 CMake 中 **未注册任何自动化测试框架**：
#   - 顶层 CMakeLists.txt 与 tests/CMakeLists.txt 均无 enable_testing() / add_test()
#     （grep 实证：0 处匹配）→ `ctest -N` 用例数为 0，无 CTest 入口
#   - tests/ 下仅有 2 个手工测试程序（非测试框架注册）：
#       * tests/mbtest.cc → 可执行文件 mbtest（C++ API 手工演示）
#       * tests/ctest.c   → 可执行文件 ctest （C API 手工演示）
#   - examples/ 下 5 个示例程序，同样为手工演示
#
# 两个手工程序均硬编码访问真实 MusicBrainz Web Service：
#   - tests/ctest.c:59  mb5_query_new("ctest","test.musicbrainz.org",0)
#   - tests/mbtest.cc:69 CQuery MB2("MBTest/v1.0","musicbrainz.org")
# 即其"测试"语义是对真实线上服务的端到端调用。
#
# ── 实际执行情况（详见 reports/upstream-test-report.md）──
#   ctest: 已实际执行。本地部分（mb5_query_get_version）成功输出版本号，
#          联网查询段因服务端返回认证挑战而静默失败，进程退出码 0。
#   mbtest: 已实际执行。内嵌解析段输出了 1799 行真实元数据解析结果，随后因
#          MusicBrainz5::CAuthenticationError（服务端要求 Bearer/Digest 认证）
#          抛出未捕获异常，进程以 SIGABRT(134) 终止 —— 属上游测试程序的
#          环境依赖（需可认证的线上服务），非本库适配缺陷。
#   测试断言统计: 无（上游程序不含断言，仅打印）
package: libmusicbrainz5/5.1.0-git20150707
homepage: https://musicbrainz.org/doc/libmusicbrainz

# 上游测试命令（CMake 项目；上游未注册 CTest 用例，故 ctest -N 为空）
upstream_check_command: "ctest -N"

# conanfile.py build() 中未集成上游测试（上游测试需联网访问 MusicBrainz 服务）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试程序（手工演示程序，非测试框架注册）
upstream_tests:
  - file: tests/ctest.c
    source: libmusicbrainz-97f98a6e04d6ae0bc7c1a7f8003e25b6c364d59b/tests/ctest.c
    description: "C API 端到端演示，硬编码访问 test.musicbrainz.org"
    command: "./tests/ctest"
  - file: tests/mbtest.cc
    source: libmusicbrainz-97f98a6e04d6ae0bc7c1a7f8003e25b6c364d59b/tests/mbtest.cc
    description: "C++ API 端到端演示，硬编码访问 musicbrainz.org"
    command: "./tests/mbtest"

# test_package 消费者用例（本适配新增，替代不可离线执行的上游测试）
test_package_tests:
  - file: test_musicbrainz5.cpp
    description: "C++ API(CMetadata getter/拷贝/Clone) + C API(mb5_query_new/get_version 生命周期) 消费者视角验证"
    command: "./test_musicbrainz5"
    assertions:
      - "C++ API: CMetadata 默认构造成功，空对象 getter 返回空串"
      - "C++ API: 拷贝构造与 Clone()/delete 生命周期完整"
      - "C API: mb5_query_new 句柄构造成功"
      - "C API: mb5_query_get_version 返回非空版本串（本地操作，无网络）"
      - "C API: mb5_query_delete 句柄释放完整"

# 测试断言总数（test_package 消费者用例中的 CHECK 宏计数）
assertion_count: 6
