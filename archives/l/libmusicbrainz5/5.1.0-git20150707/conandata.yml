# conandata.yml — libmusicbrainz5 5.1.0-git20150707
# libmusicbrainz5 — MusicBrainz Web Service 客户端库（CMake 构建，依赖 neon + libxml2）
#
# 版本说明：5.1.0-git20150707 对应 Debian 源包 libmusicbrainz5 的
#   5.1.0+git20150707-N（上游 5.1.0 之后未再发布 release，各发行版改用 git 快照）。
#   源码取上游 metabrainz/libmusicbrainz 在 2015-07-07 当日 master HEAD：
#   commit 97f98a6e04d6ae0bc7c1a7f8003e25b6c364d59b
#   （该快照相比 release-5.1.0（2014-11-13）包含 C 接口拆分：新增
#    musicbrainz5cc 库与 libmusicbrainz5cc.pc）

sources:
  url: "https://github.com/metabrainz/libmusicbrainz/archive/97f98a6e04d6ae0bc7c1a7f8003e25b6c364d59b.tar.gz"
  sha256: "15ea1bf5a01ba2e5f0f1f3eb6ac5d281711df09cbdf4ddfad67783b57a2dd048"

patches:
  - patch_file: "patches/0001-xmlGetLastError-const.patch"
    patch_description: "src/xmlParser.cc 兼容 libxml2 2.15.x（xmlGetLastError 返回 const xmlError*）"
    patch_type: "portability"
  - patch_file: "patches/0002-remove-glob-dependency.patch"
    patch_description: "src/CMakeLists.txt 移除 *.inc 字面通配符依赖（make 不展开 glob，报 No rule to make target）"
    patch_type: "build_fix"
  - patch_file: "patches/0003-set-shared-library-soname.patch"
    patch_description: "src/CMakeLists.txt 显式设置两个共享库的 DT_SONAME（OHOS 工具链下 CMake 未按 SOVERSION 生成）"
    patch_type: "portability"
