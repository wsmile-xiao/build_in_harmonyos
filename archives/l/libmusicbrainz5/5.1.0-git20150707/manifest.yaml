# 版本级 manifest
# 文件位置: archives/l/libmusicbrainz5/5.1.0-git20150707/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "5.1.0-git20150707"

software: "libmusicbrainz5"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-09-17"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游 metabrainz/libmusicbrainz 2015-07-07 当日 master HEAD
  # （= Debian 源包 libmusicbrainz5 的 5.1.0+git20150707-N 对应快照）
  url: "https://github.com/metabrainz/libmusicbrainz/archive/97f98a6e04d6ae0bc7c1a7f8003e25b6c364d59b.tar.gz"
  sha256: "15ea1bf5a01ba2e5f0f1f3eb6ac5d281711df09cbdf4ddfad67783b57a2dd048"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBUILD_SHARED_LIBS=OFF"          # 由 conanfile options.shared 驱动
    - "-DCMAKE_INCLUDE_PATH=<libxml2>/include/libxml2;<neon>/include"
    - "-DCMAKE_LIBRARY_PATH=<libxml2>/lib;<neon>/lib"

  dependencies:
    - libxml2/2.15.3.1
    - neon/0.34.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-xmlGetLastError-const.patch"
  - "0002-remove-glob-dependency.patch"
  - "0003-set-shared-library-soname.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS SDK 的 lld 依赖 SDK llvm/lib 下的 libxml2.so.16；Conan libxml2 的 lib 目录若前置到 LD_LIBRARY_PATH 会令 lld 加载 ABI 不兼容的同名库，报 symbol not found（应 SDK 优先、Conan 依赖追加）(knowledge_ref: E120 forbid_1 / E132 / E266)"
  - "上游 cmake_minimum_required(VERSION 2.6) 在 CMake 4.x 下被移除兼容模式；CMAKE_POLICY_VERSION_MINIMUM=3.5 须在 cmake_minimum_required() 之前生效——用 cache_variables/cli_args（-D），写 CMakeToolchain 变量无效 (knowledge_ref: E103 / DRAFT-E321)"
  - "上游 cmake/modules/FindLibXml2.cmake / FindNeon.cmake 仅用 FIND_PATH/FIND_LIBRARY 搜系统路径，需经 CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH 注入 Conan 依赖 (knowledge_ref: E216)"
  - "make 不展开 ADD_CUSTOM_COMMAND 的 DEPENDS 中 *.inc 字面通配符，报 No rule to make target；补丁 hunk 行号须对目标源码重新生成 (knowledge_ref: DRAFT-cmake-add-custom-command-depends-glob-literal)"
  - "OHOS 平台 CMake 链接项目内库时使用相对路径而非 SONAME（本项目表现为产物缺 DT_SONAME）(knowledge_ref: E207 / E274)"
  - "libmusicbrainz5 5.1.0-git20150707 快照将 C 接口拆为 musicbrainz5cc 库，C API 为纯函数式（无 mb5_metadata_new / MB5_VERSION_MAJOR）(knowledge_ref: reports/upstream-test-report.md)"
