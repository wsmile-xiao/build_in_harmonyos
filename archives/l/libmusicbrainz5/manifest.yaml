software: libmusicbrainz5
display: "libmusicbrainz5"
description: "MusicBrainz Web Service client library (C/C++ binding of libmusicbrainz5)"
category: multimedia
homepage: "https://musicbrainz.org/doc/libmusicbrainz"
license: LGPL-2.1
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 cmake_minimum_required(VERSION 2.6)，CMake 4.x 下需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "上游 FindLibXml2.cmake/FindNeon.cmake 仅搜系统路径，需 CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH 注入 Conan 依赖"
    - "构建期 make-c-interface 工具运行需 libxml2；LD_LIBRARY_PATH 须让 OHOS SDK llvm/lib 优先于 Conan libxml2，否则 lld 加载 ABI 不兼容的 libxml2.so.16 报 symbol not found"
    - "make 不展开 DEPENDS 中的 *.inc 字面 glob，需补丁移除"
    - "该快照（2015-07-07）将 C 接口拆分为独立库 musicbrainz5cc，产出两个 .so"
    - "上游 tests/ctest、tests/mbtest 硬编码访问线上 MusicBrainz 服务，无法离线回归"
  common_dependencies:
    - libxml2/2.15.3.1
    - neon/0.34.0

versions:
  "5.1.0-git20150707":
    status: published
    build_date: "2026-09-17"
