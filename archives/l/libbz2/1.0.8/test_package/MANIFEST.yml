# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libbz2/1.0.8
homepage: "https://sourceware.org/bzip2/"

# 上游测试命令
upstream_check_command: ""

# bzip2 Makefile default target embeds 6 tests (3 compress + 3 uncompress)
upstream_test_in_build: true
upstream_test_command: "make"

# 上游实际运行的测试程序 (embedded in make default target)
upstream_tests:
  - file: bzip2.c (sample1 compress)
    source: bzip2-1.0.8/sample1.ref
    description: "Compress sample1.ref with -1 flag"
    command: "./bzip2 -1 < sample1.ref > sample1.rb2"
  - file: bzip2.c (sample2 compress)
    source: bzip2-1.0.8/sample2.ref
    description: "Compress sample2.ref with -2 flag"
    command: "./bzip2 -2 < sample2.ref > sample2.rb2"
  - file: bzip2.c (sample3 compress)
    source: bzip2-1.0.8/sample3.ref
    description: "Compress sample3.ref with -3 flag"
    command: "./bzip2 -3 < sample3.ref > sample3.rb2"
  - file: bzip2.c (sample1 decompress)
    source: bzip2-1.0.8/sample1.bz2
    description: "Decompress sample1.bz2"
    command: "./bzip2 -d < sample1.bz2 > sample1.tst"
  - file: bzip2.c (sample2 decompress)
    source: bzip2-1.0.8/sample2.bz2
    description: "Decompress sample2.bz2"
    command: "./bzip2 -d < sample2.bz2 > sample2.tst"
  - file: bzip2.c (sample3 decompress)
    source: bzip2-1.0.8/sample3.bz2
    description: "Decompress sample3.bz2 with -ds flag"
    command: "./bzip2 -ds < sample3.bz2 > sample3.tst"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_bzip2.c
    description: "Library API round-trip: BZ2_bzlibVersion + compress + decompress + integrity check"
    command: "./test_bzip2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
