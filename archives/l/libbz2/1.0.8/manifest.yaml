software: libbz2
version: "1.0.8"
build_system: makefile
status: built
build_date: "2026-09-08"

source:
  url: "https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz"
  sha256: "ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269"
  tar_format: tar.gz

build:
  system: makefile
  cc: clang

patches_applied:
  - "0001-Makefile.patch"

knowledge_gained:
  - "libbz2（上游 bzip2）使用简单 Makefile（无 configure）"
  - "必须添加 -fPIC 标志（静态库被链接到共享库时）"
  - "鸿蒙 ln -sf 有 bug；当前 Conan 配方禁用 shared=True，避免 Makefile-libbz2_so 的符号链接逻辑在 HMDFS 上出错"
  - "SHELL=/bin/sh 在 OHOS 不存在，需通过 CONFIG_SHELL 传入 bash 路径"
  - "tools.build:compiler_executables 是 dict 类型，不能用 :c 后缀取值"
