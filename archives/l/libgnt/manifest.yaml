name: libgnt
category: libraries
description: GLib Ncurses Toolkit for text-mode graphical UI
license: GPL-2.0+

versions:
  2.14.0:
    status: built
    build_system: meson
    source_url: https://github.com/dylex/libgnt/archive/refs/tags/v2.14.0.tar.gz
    dependencies:
      - glib >= 2.16.0
      - ncursesw
      - libxml2 >= 2.6.0 (optional)
      - meson >= 0.37.0
    configure_options: []
    patches:
      - 0001-meson-add-local-prefix-search-path.patch
      - 0002-gntwm-fix-ncurses-opaque-panel.patch

notes: |
  libgnt 自 Pidgin 项目分离后的独立仓库，自 2.14.0 开始使用 Meson 构建系统。

  平台适配要点：
  - ncurses 搜索路径需要添加本地安装前缀
  - NCURSES_OPAQUE_PANEL 问题需要使用 panel_window() API

  SSL certificate issues on HarmonyOS require manual download with -k flag.