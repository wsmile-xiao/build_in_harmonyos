software: libgnt
version: 2.14.0
status: built
build_system: meson
source_url: https://github.com/dylex/libgnt/archive/refs/tags/v2.14.0.tar.gz

# Dependencies
dependencies:
  required:
    - name: glib
      version: ">=2.16.0"
      installed: 2.88.0
    - name: ncursesw
      version: any
      installed: 6.4
  optional:
    - name: libxml2
      version: ">=2.6.0"
      installed: 2.15.3

# Build tools
build_tools:
  - meson >= 0.37.0

# Compilation details
configure_options: []
build_options:
  - meson setup build --prefix=$DEFAULT_PREFIX
  - ninja -C build

# Installation
install_provides:
  libs:
    - libgnt.so
  headers:
    - gnt/*.h
  pc_files:
    - gnt.pc

# Quality gates
quality_gates:
  G0: pending  # Clean build verification
  G1: pass     # Binary integrity
  G2: pass     # Functional test (鈿狅笍1)
  G3: pass     # Portability (RPATH)
  G4: pass     # Archive integrity

# Patches
patches:
  - 0001-meson-add-local-prefix-search-path.patch
  - 0002-gntwm-fix-ncurses-opaque-panel.patch

# Metadata
build_date: "2026-06-15"
compiler_agent: subtask