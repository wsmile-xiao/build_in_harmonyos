# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lcmaps/1.6.7
homepage: "https://software.nikhef.nl/security/lcmaps/"

# 上游测试命令: 无（见下方 discovery 结论）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试 discovery（discovery.status = EVIDENCE_COMPLETE，结论 NO_UPSTREAM_TESTS）:
#   已检查入口:
#     - 顶层 Makefile.am: SUBDIRS = src examples doc interface etc，无 check 目标、
#       无 TESTS/check_PROGRAMS 定义
#     - src/Makefile.am: 无 check 目标；EXTRA_DIST 含 pdl_test.c 与 lcmaps_test.c
#       （lcmaps_test.c 是手动 GSI 客户端，依赖 GSI 面，不随 without-gsi 构建安装）
#     - examples/Makefile.am: 仅 noinst_LTLIBRARIES 演示插件，无测试驱动
#     - doc/Makefile.am: 仅 LaTeX 文档（pdf/doc 目标），非测试
#   证据路径（lcmaps-1.6.7.tar.gz 内）:
#     - Makefile.am / src/Makefile.am / examples/Makefile.am / doc/Makefile.am
#     - src/lcmaps_test.c（EXTRA_DIST，GSI 面手动测试客户端）
#     - src/evaluationmanager/pdl_test.c（EXTRA_DIST，未接入构建）
#   结论: 上游零自动化测试（无 check 目标/测试程序接入构建系统），
#         产物验证以 test_package OHOS 冒烟用例真实执行代替。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: >
      OHOS 冒烟用例：dlopen liblcmaps_without_gsi.so（musl 动态加载适配点，E013）
      + dlsym lcmaps_init/lcmaps_run_without_credentials_and_return_username/lcmaps_term
      （框架入口导出验证）
      + 编译期断言安装的 lcmaps/lcmaps_version.h API 版本宏
      + 包内清单核对（include/lcmaps/*.h、lib/pkgconfig/lcmaps-basic-interface.pc、
      lcmaps-without-gsi.pc、lib/liblcmaps_without_gsi.so）
    command: "./test_lcmaps <package_root>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 11
