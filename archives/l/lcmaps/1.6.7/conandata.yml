sources:
  url: "https://software.nikhef.nl/security/lcmaps/lcmaps-1.6.7.tar.gz"
  sha256: "eeb3f2521fc0fab79c4a2a813b9b05586ee4828d663529d2425b60a68c9fc401"

patches:
  - patch_file: "patches/0001-config-guess-harmonyos.patch"
    patch_description: "Add HarmonyOS (aarch64) system identification to config.guess (uname -s reports HarmonyOS; without this config.guess falls into its compile-fallback path which fails on OHOS)"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-ohos.patch"
    patch_description: "Add ohos-linux / linux-ohos machine-os triplets to config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-hmdfs-tmpdir.patch"
    patch_description: "HMDFS fix: create configure temp dirs without umask 077 (dirs created 2700 are owner-unwritable on HMDFS) with chmod 755; the generated config.status inherits the fixed block from configure at build time; same fix as libmnl/1.0.5 patches/0003"
    patch_type: "portability"
