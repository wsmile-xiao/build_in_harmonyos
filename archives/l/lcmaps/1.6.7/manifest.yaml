# 版本级 manifest — lcmaps 1.6.7

version: "1.6.7"
software: "lcmaps"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-26"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 Nikhef 发布归档）
  url: "https://software.nikhef.nl/security/lcmaps/lcmaps-1.6.7.tar.gz"

  # 源码校验和（SHA-256，官方 .sha256 与实下载双验一致）
  sha256: "eeb3f2521fc0fab79c4a2a813b9b05586ee4828d663529d2425b60a68c9fc401"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
  - "--disable-gsi-mode"

  # 编译依赖列表（libc-only 闭包：musl dl* 在 libc，LEXLIB 为空）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（平台专用：config.guess/config.sub 识别 HarmonyOS 三元组）
patches_applied:
- "patches/0001-config-guess-harmonyos.patch"
- "patches/0002-config-sub-ohos.patch"
- "patches/0003-configure-hmdfs-tmpdir.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "lcmaps 默认 GSI 面硬依赖 globus/voms/openssl（仓内均无配方）；上游支持的 --disable-gsi-mode 面依赖闭包仅 libc（musl dl* 在 libc，AC_CHECK_LIB([dl]) 在 OHOS 工具链实探可过）"
- "tarball 自带预生成 pdl_yacc.c/pdl_lex.c，无 flex 依赖；勿跑 autoreconf（E089）"
- "LCMAPS_ETC_HOME/LIB_HOME/MOD_HOME 编译期 -D 写死但均由 prefix 推导，Conan 包内自洽"
- "without-gsi 库无 -export-symbols/版本脚本，默认导出全部公共 API；liblcmaps_return_poolindex_without_gsi/gss_assist_gridmap LIBADD liblcmaps_without_gsi"
- "上游零自动化测试（无 check 目标/check_PROGRAMS，lcmaps_test.c 仅 EXTRA_DIST 且面向 GSI）；产物验证用 test_package dlopen/dlsym 冒烟"
