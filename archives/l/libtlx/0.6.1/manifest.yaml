# 版本级 manifest — libtlx 0.6.1
# 文件位置: archives/l/libtlx/0.6.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.6.1"
software: "libtlx"

# 设备端真实验证完成后的状态口径（built ≠ published；合并并确认 release upload 才置 published）
status: built
build_date: "2026-10-02"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 GitHub tag tarball（tag 形态 v0.6.1；上游仓库 https://github.com/tlx/tlx）
  url: "https://github.com/tlx/tlx/archive/refs/tags/v0.6.1.tar.gz"
  # 三路一致：conandata.yml sources.sha256 = 本字段 = 实测值
  # （tarball 实测 429649 字节）
  sha256: "24dd1acf36dd43b8e0414420e3f9adc2e6bb0e75047e872a06167961aedad769"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  # conan 包构建参数（配方 generate() 内映射；TLX_BUILD_TESTS 钉 OFF 走纯库构建，
  # 上游测试套件在设备端用下方 configure_options 原生构建真跑，见 test_summary）
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DTLX_BUILD_STATIC_LIBS=ON"
    - "-DTLX_BUILD_SHARED_LIBS=OFF"
    - "-DTLX_BUILD_TESTS=OFF"
  # 上游测试套件的原生 CMake 构建参数（设备端取数命令，与 conan 包构建分列）
  upstream_test_configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DTLX_BUILD_TESTS=ON"
    - "-DCMAKE_C_COMPILER=/data/service/hnp/bin/clang"
    - "-DCMAKE_CXX_COMPILER=/data/service/hnp/bin/clang++"
  # 零重依赖：上游唯一硬依赖 find_package(Threads REQUIRED)（pthread，
  # musl libc 集成）；可选 boost 组件上游 CMake 实际零引用
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-cmake-min-version-for-cmake4.patch"

# ============================================================
# 测试统计（统计单位 = 上游测试目标；四口径分列不混用）
# ============================================================

test_summary:
  # ── 口径1 源码用例函数 ─────────────────────────────────────────
  upstream_source_test_functions: 83   # tests/ 下 static void test_* 函数（46 个 .cpp）
  # ── 口径2 框架注册数 ─────────────────────────────────────────
  upstream_ctest_registered: 41        # tlx_build_test() 注册的 add_test 目标数（clang15 支持 C++14 → 5 个 meta 条件测试全含）
  upstream_build_only_programs: 6      # tlx_build_only() 只构建不注册（benchmark/示例程序）
  # ── 口径3 断言数（另一统计单位，不与测试目标口径混用作 N）──────
  upstream_source_assertions: 1102     # tests/ 下 die_* 断言宏调用总数
  # ── 口径4 设备端实测（2026-10-02，OHOS PC aarch64 + clang 15.0.4）──
  upstream_ctest_passed: 41
  upstream_ctest_failed: 0
  upstream_ctest_pass_rate: "100% (41/41)"
  upstream_test_note: "首轮 ctest 41/41 因 libc++_shared.so 运行库缺 LD_LIBRARY_PATH 加载失败；export LD_LIBRARY_PATH=<ohos-sdk>/llvm/lib/aarch64-linux-ohos 后 41/41 全绿（Total 30.97s）。测试失败面为运行环境而非代码。"
  # ── test_package 消费者测试（不进上游分母）────────────────────
  test_package_programs: 2
  test_package_note: "consumer.cpp + ohos_special_test.cpp，静态 libc++ 链接（-static-libstdc++）免运行库依赖直跑"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 cmake_minimum_required(VERSION 2.8.12) 被 CMake 4.1.2 拒绝（<3.5 已移除），bump 3.5...3.22 即可（知识库 E103 同结论）"
  - "backtrace.cpp 的 glibc execinfo 路径由上游 #if defined(__GNU_LIBRARY__) 守卫，OHOS musl 下自动降级空实现，无需补丁"
  - "tlx 用自有开关 TLX_BUILD_STATIC_LIBS/SHARED_LIBS 控制显式 add_library 类型，不读 BUILD_SHARED_LIBS，conan options.shared 必须显式映射"
  - "上游 install(EXPORT tlx-targets) 导出目标无 NAMESPACE，cmake_target_name=tlx::tlx（CMakeDeps 生成）+ pkg_config_name=tlx"
  - "OHOS 设备端跑动态链接 libc++ 的测试二进制需 LD_LIBRARY_PATH 指向 ohos-sdk/llvm/lib/aarch64-linux-ohos；静态链接 -static-libstdc++ 可免依赖直跑"
