# test_package/MANIFEST.yml — libtlx 0.6.1
# 上游官方测试声明文件（CI L0e 强制要求）
package: libtlx/0.6.1
homepage: "https://github.com/tlx/tlx"

# 上游测试命令（设备端原生构建真跑，见版本级 manifest.yaml test_summary）
upstream_check_command: "cd build && ctest -N && LD_LIBRARY_PATH=<ohos-sdk>/llvm/lib/aarch64-linux-ohos ctest"
upstream_test_in_build: false
upstream_test_command: "cmake -S . -B build -DTLX_BUILD_TESTS=ON -DCMAKE_CXX_COMPILER=/data/service/hnp/bin/clang++ && make -C build -j2 && LD_LIBRARY_PATH=<ohos-sdk>/llvm/lib/aarch64-linux-ohos ctest --test-dir build"

# 上游实际运行的测试程序（41 个 ctest 目标全列，格式：目标|die_断言数）
upstream_tests:
  - file: tests/CMakeLists.txt
    source: tlx-0.6.1.tar.gz/tests/CMakeLists.txt
    description: "上游测试注册表：tlx_build_test() 41 个（含 CXX14 条件 5 个 meta 测试）+ tlx_build_only() 6 个（benchmark/示例）。设备端实测 41/41 通过（100%，Total 30.97s，2026-10-02）。41 目标 die_ 断言合计 1088；46 个测试 .cpp 全集 1102"
    command: "ctest  # 41 目标逐个执行"
  - file: tests/string_test.cpp
    description: "die_ 断言 316：split/trim/to_upper/join/ssprintf/base64/escape/hexdump 全 string 算子族"
    command: "./tlx_string_test"
  - file: tests/container/btree_test.cpp
    description: "die_ 断言 252：btree_set/map/multimap/multiset 插入/删除/查找/遍历"
    command: "./tlx_container_btree_test"
  - file: tests/math_test.cpp
    description: "die_ 断言 118：round_up/down、integer_log2、between、clamp 等"
    command: "./tlx_math_test"
  - file: tests/container/radix_heap_test.cpp
    description: "die_ 断言 57：radix heap 四种堆序"
    command: "./tlx_container_radix_heap_test"
  - file: tests/container/lru_cache_test.cpp
    description: "die_ 断言 46：LruCacheSet/Map 淘汰/touch/erase"
    command: "./tlx_container_lru_cache_test"
  - file: tests/meta/vmap_for_test.cpp
    description: "die_ 断言 43（CXX14）：vmap_for 变参遍历"
    command: "./tlx_meta_vmap_for_test"
  - file: tests/delegate_test.cpp
    description: "die_ 断言 25：Delegate 绑定函数/成员/lambda"
    command: "./tlx_delegate_test"
  - file: tests/digest_test.cpp
    description: "die_ 断言 23：md5/sha1/sha256/sha512 已知答案向量"
    command: "./tlx_digest_test"
  - file: tests/container/ring_buffer_test.cpp
    description: "die_ 断言 21：环形缓冲 push/emplace/拷贝"
