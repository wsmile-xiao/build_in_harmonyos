  - file: tests/container/simple_vector_test.cpp
    description: "die_ 断言 21：simple_vector 栈/回退模式"
    command: "./tlx_container_simple_vector_test"
  - file: tests/meta/fold_test.cpp
    description: "die_ 断言 20（CXX14）：meta fold 变参折叠"
    command: "./tlx_meta_fold_test"
  - file: tests/container/string_view_test.cpp
    description: "die_ 断言 14：string_view 兼容层"
    command: "./tlx_container_string_view_test"
  - file: tests/counting_ptr_test.cpp
    description: "die_ 断言 14：侵入式引用计数指针"
