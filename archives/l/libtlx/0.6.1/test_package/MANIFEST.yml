# test_package 中自带的测试（消费者视角验证，不进上游分母）
test_package_tests:
  - file: consumer.cpp
    description: "已安装包消费者（find_package(tlx) → tlx::tlx）：TLX_VERSION 宏断言、digest 四族 RFC 标准向量（python hashlib 交叉验证）、string 算子族（split/trim/join/ssprintf/base64/escape_uri/escape_html）、integer_log2、btree_set/btree_map、LruCacheSet/Map、RingBuffer、SplayTree、CountingPtr 引用计数、ThreadPool 100 任务、MultiTimer、timestamp、SipHash 上游向量、parallel_mergesort、multiway_merge。运行期断言约 90 条"
    command: "./consumer"
  - file: ohos_special_test.cpp
    description: "HarmonyOS 专项（#ifdef __OHOS__ 真实质校验，非空壳）：__OHOS__/__OHOS_FAMILY__ 宏、aarch64 64 位、clang15、TLX 小端宏与运行时字节序实测一致、静态库跨编译单元符号（md5/ssprintf/expand_environment_variables/base64）、musl pthread 4 线程原子计数、tlx::setenv+环境变量展开。运行期断言约 18 条"
    command: "./ohos_special_test"

# 测试断言总数（断言口径；不与上游用例口径 N 混用）
assertion_count: 108   # ≈ consumer 90 + ohos_special 18（精确值以运行输出 PASS n/n 为准）
