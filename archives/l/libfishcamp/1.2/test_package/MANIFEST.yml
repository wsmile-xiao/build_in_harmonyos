# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libfishcamp/1.2
homepage: "https://github.com/indilib/indi-3rdparty"

# 上游测试命令 (libfishcamp 是天文 CCD 硬件驱动库，上游 monorepo 未提供
# 任何独立测试套件；也无 ctest/make check 等可运行测试)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (libfishcamp 上游无测试用例)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 纯 C 库，仅依赖 libusb-1.0；以下测试在 OHOS aarch64 宿主上真实链接并运行，
# 调用公共 API 验证库可用（无需相机硬件、不触发 libusb 运行时调用）。
test_package_tests:
  - file: src/test_fishcamp.c
    description: "消费者测试：真实链接 libfishcamp 并调用 fcUsb_setSimulation / fcUsb_setLogging / fcUsb_GetNumCameras（纯全局状态 API，无硬件依赖）"
    command: "./test_fishcamp"

# 测试断言总数 (test_package 内自定义 CHECK 宏断言数，用于质量评估)
assertion_count: 3
