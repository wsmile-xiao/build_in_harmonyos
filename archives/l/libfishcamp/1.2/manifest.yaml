# 版本级 manifest — libfishcamp 1.2

version: "1.2"
software: "libfishcamp"

# 编译状态（finish 时由 close-archive 更新）
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: cmake

# ============================================================
# 源码信息
#
# libfishcamp 是 indi-3rdparty 单体仓库内的一个子项目。为避免拉取整
# 个 monorepo，这里直接从官方 v2.2.4 tag 抓取 4 个文件（3 个源 + LGPL
# 许可证）。完整校验和见 conandata.yml。
# ============================================================

source:
  # 官方上游 tag（单体仓库归档，仅作位置说明）
  url: "https://github.com/indilib/indi-3rdparty/archive/refs/tags/v2.2.4.tar.gz"

  # 实际构建拉取的 4 个文件（官方 raw 源，见 conandata.yml）
  files:
    - "https://raw.githubusercontent.com/indilib/indi-3rdparty/v2.2.4/libfishcamp/fishcamp.c"
    - "https://raw.githubusercontent.com/indilib/indi-3rdparty/v2.2.4/libfishcamp/fishcamp.h"
    - "https://raw.githubusercontent.com/indilib/indi-3rdparty/v2.2.4/libfishcamp/fishcamp_common.h"
    - "https://raw.githubusercontent.com/indilib/indi-3rdparty/v2.2.4/libfishcamp/COPYING.LIB"

  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  # 配置选项（精简 CMake 配方，不依赖 INDI 框架）
  configure_options: []

  # 编译依赖：仅 libusb-1.0（由 Conan 提供）
  dependencies:
    - "libusb/1.0.27"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-drop-indi-dependency.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge:
  - "libfishcamp 仅需 libusb-1.0；fishcamp.c 唯一的 INDI 耦合是 indimacros.h 的 INDI_UNUSED 宏，patch 本地定义即可，无需 libindi"
  - "上游 CMakeLists 依赖 INDI/CMakeCommon 与父级 cmake_modules，本适配用精简 CMakeLists 替代"
