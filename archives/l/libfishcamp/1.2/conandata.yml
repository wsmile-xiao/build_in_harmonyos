# conandata.yml — libfishcamp 1.2
# Single source of truth for source URLs + SHA256 + patches.
#
# Upstream libfishcamp lives inside the indi-3rdparty monorepo as a single
# subproject. Rather than pulling the whole monorepo, we fetch the 3 source
# files (fishcamp.c / fishcamp.h / fishcamp_common.h) and the LGPL license
# directly from the official v2.2.4 tag on GitHub (raw.githubusercontent.com,
# which is GitHub's official raw host — PF7 compliant).
#
# The only upstream build dependency is libusb-1.0 (provided by Conan). The
# INDI framework is NOT required to build this library: fishcamp.c references
# just the INDI_UNUSED macro from indimacros.h, and patches/ drops that include
# and defines the macro locally. No libindi library functions are used.

sources:
  - url: "https://raw.githubusercontent.com/indilib/indi-3rdparty/v2.2.4/libfishcamp/fishcamp.c"
    sha256: "f5c3d7cd20edb4b338968ec27bf442512b859ca7a86e790c44df1c20b2d1c79f"
    filename: "fishcamp.c"
  - url: "https://raw.githubusercontent.com/indilib/indi-3rdparty/v2.2.4/libfishcamp/fishcamp.h"
    sha256: "c9caf318352a090ecb67a3b4db324c67e690cca41bb9c6bac2d87322bc81f2e8"
    filename: "fishcamp.h"
  - url: "https://raw.githubusercontent.com/indilib/indi-3rdparty/v2.2.4/libfishcamp/fishcamp_common.h"
    sha256: "ad8cf6c592172de2df8063daeda4e4fbff570af11797bba7ac9cf6c03606441d"
    filename: "fishcamp_common.h"
  - url: "https://raw.githubusercontent.com/indilib/indi-3rdparty/v2.2.4/libfishcamp/COPYING.LIB"
    sha256: "20cf5be7deab6ff1440e83fea7e3de2592c210b942247c6a509b48bfb7ce8f72"
    filename: "COPYING.LIB"

patches:
  - patch_file: "patches/0001-drop-indi-dependency.patch"
    patch_description: "Remove INDI indimacros.h build dependency; define INDI_UNUSED macro locally (no libindi functions are used)"
    patch_type: "portability"
