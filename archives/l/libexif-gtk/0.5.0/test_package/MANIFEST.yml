# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libexif-gtk/0.5.0
homepage: "https://libexif.github.io/"

# 上游测试命令（实测：configure.ac/Makefile.am 无 TESTS=/check_PROGRAMS，
# make check 只递归空跑 —— 见 reports/test-report.md 原始输出）
upstream_check_command: "make check"

# conanfile.py build() 中是否集成上游测试：否（上游无自动化测试可集成）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游只有一个 *交互式示例* 程序 tests/test-libexif-gtk（noinst_PROGRAMS），
# 非测试套件：gtk_init() + 建窗 + gtk_exif_browser_new() + exif_data_new_from_file()
# + gtk_main()，无断言、无退出码语义；上游 .travis.yml 自述
# "There are no automated tests to run"。
# 本配方已在 broadway 无显示后端下真实运行该示例（3 个有效 EXIF 图片用例 +
# 1 个无效图片负向对照），统计见 reports/test-report.md。
upstream_tests:
  - file: tests/test-libexif-gtk.c
    source: libexif-gtk-0.5.0/tests/test-libexif-gtk.c
    description: "上游唯一示例程序（交互式，非断言型）：加载 EXIF 文件并用 GtkExifBrowser 显示；本配方以 broadway 后端实测运行"
    command: "GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 ./tests/test-libexif-gtk <exif-image.jpg>"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libexif_gtk.c
    description: "消费者冒烟：gtk_exif_browser_get_type / gtk_exif_content_list_get_type（真实 API）、dlopen(RTLD_NOW) 符号完整性、dlsym 导出、libexif 传递依赖、uname()==HarmonyOS（鸿蒙特有用例 OHOS-1）"
    command: "./test_libexif_gtk"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
