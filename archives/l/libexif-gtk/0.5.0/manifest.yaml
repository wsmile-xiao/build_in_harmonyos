# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "release 资产 > tag 自动 tarball：libexif-gtk v0.5.0 的 GitHub release 附件（475056 B, sha256 b8ca3729…）自带 configure/Makefile.in，而 git-archive tarball 与 Debian orig.tar.gz 不含 configure，必须 autoreconf（本机/CI 无 automake·libtool）"
  - "E007/E072/E122：SKILL 自带 perl patch-autotools-ohos.pl 面向 2021+ config.* 版本，对 2020-01-01 vintage 只命中 config.guess 的 1/5 处；且该 vintage 的主 case 分支用 echo…exit 而非 GUESS 变量，需手工把插入的 GUESS=… 改成 echo+exit，config.sub 侧只需把 linux-ohos* 加进 basic OS 白名单（无 basic_os/kernel 校验两处）"
  - "E136/E114：configure 的 ac_tmp 与由它生成的 config.status 都用 umask 077 + ./confXXXXXX，HMDFS 下目录变 drwx--S--- 不可写；改 ${HOME}/tmp + umask 022 后 configure/config.status 均通过（改 configure 即同时修好 config.status，因其内容来自 configure 的 heredoc）"
  - "E136 遗留的目录存在性假设（首轮 CI 实证）：把 ac_tmp 指向 ${HOME}/tmp 后必须自己创建该父目录——本地探索机 ~/tmp 恰好存在（TMPDIR 默认即 ~/tmp）→ 本地全绿；CI worker 的 $HOME 可写但无 tmp/ 子目录 → mktemp ENOENT，报错落在 config.status 阶段（mkdir: '…/tmp/conf8316-11777': No such file or directory）。修复：补丁两条分支各加 mkdir -p + 配方 build() 兜底 mkdir(parents=True)"
  - "非 NLS 分支 i18n 桩不全：上游 12 个源文件无条件调用 bind_textdomain_codeset()，但 #ifdef ENABLE_NLS 的 #else 分支只定义了 bindtextdomain 等 5 个 no-op 宏；OHOS 无 libc libintl 时该调用进 .so 成为未定义符号，lld 默认 --no-allow-shlib-undefined 使消费者链接直接失败（本库 tests/test-libexif-gtk 链接阶段首个错误）"
  - "patchelf 不可用于 OHOS：用 patchelf --remove-rpath 清理构建机 RUNPATH 后，同一 .so 在 OHOS 加载器上 dlopen 报 'Error loading shared library …: Permission denied'（未重写的原件加载正常）；RUNPATH 残留无害——加载器先查 LD_LIBRARY_PATH"
  - "上游无自动化测试：Makefile.am 无 TESTS=/check_PROGRAMS（make check 只递归空跑）；tests/test-libexif-gtk 是交互式示例，需显示后端，可用 gtk 包自带 broadwayd（GDK_BACKEND=broadway）在无 X11/Wayland 环境真实运行"

