# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnfc/1.8.0
homepage: "https://github.com/nfc-tools/libnfc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libnfc 1.8.0 自动化测试使用 Cutter 框架（AC_CHECK_CUTTER），
# 本环境无 cutter，make check 的 test 目标为 0 用例（TOTAL: 0）。
# 上游 test/ 目录含 6 个独立测试源（见 upstream_tests），
# 均依赖物理 NFC 设备（USB 读卡器）驱动，设备缺失按硬阻塞记录。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（源文件清单，运行受物理设备硬阻塞）
upstream_tests:
  - file: test_register_endianness.c
    source: libnfc-1.8.0/test/test_register_endianness.c
    description: "寄存器字节序测试（设备硬阻塞）"
    command: "./test_register_endianness"
  - file: test_register_access.c
    source: libnfc-1.8.0/test/test_register_access.c
    description: "寄存器访问测试（设备硬阻塞）"
    command: "./test_register_access"
  - file: test_device_modes_as_dep.c
    source: libnfc-1.8.0/test/test_device_modes_as_dep.c
    description: "设备模式 DEP 测试（设备硬阻塞）"
    command: "./test_device_modes_as_dep"
  - file: test_dep_passive.c
    source: libnfc-1.8.0/test/test_dep_passive.c
    description: "DEP 被动目标测试（设备硬阻塞）"
    command: "./test_dep_passive"
  - file: test_dep_active.c
    source: libnfc-1.8.0/test/test_dep_active.c
    description: "DEP 主动目标测试（设备硬阻塞）"
    command: "./test_dep_active"
  - file: test_access_storm.c
    source: libnfc-1.8.0/test/test_access_storm.c
    description: "访问风暴测试（设备硬阻塞）"
    command: "./test_access_storm"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：nfc_version/nfc_init/nfc_exit API 验证"
    command: "./test_libnfc"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2