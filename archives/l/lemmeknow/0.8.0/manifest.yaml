# 版本级 manifest — lemmeknow 0.8.0

version: "0.8.0"
software: "lemmeknow"

# 编译状态
# built：HarmonyOS PC (aarch64) 本地交叉编译+上游测试+test_package 通过；
# Rust 工具链由制品仓基础设施包 rust-toolchain/1.97.1 提供（tool_requires），
# 不依赖系统 cargo、不使用 rustup 引导（rustup 无法识别 HarmonyOS 宿主，E105/E154）。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: "cargo"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39；选 crates.io 归档因内含 Cargo.lock，
  # GitHub tag v0.8.0 tarball 无 lock 文件）
  url: "https://static.crates.io/crates/lemmeknow/lemmeknow-0.8.0.crate"

  # 源码校验和（实测 sha256，与 crates.io API checksum 一致）
  sha256: "6a84dc3c9c3aba3b43b2bccec7ff9ca15ee94e6644eac129fef1ffd13d9e4733"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（Rust cargo 项目，配方内自管 cargo 命令）
  system: custom

  # 配置选项列表（cargo 无 configure 选项）
  configure_options: []

  # 编译依赖列表（纯 Rust 项目，无 C/C++ 目标依赖）
  dependencies: []

  # 构建期工具依赖（tool_requires）
  build_tools:
    - "rust-toolchain/1.97.1"

  # 编译器（链接器为 OHOS SDK aarch64-unknown-linux-ohos-clang）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无：上游代码零修改，纯 Rust 无平台相关编译问题）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Rust 纯工具型包（无 C 依赖）在 OHOS 的最小配方形态：below/0.11.0 配方去掉 libelf/zlib requires、libbpf 补丁与 _wire_dependency_paths 后即为通用 Rust CLI 模板（tool_requires rust-toolchain/1.97.1 + 自签名 + harmonybrew cargo 运行库 + rsproxy/CA）"
  - "crates.io .crate 归档内含上游发布时验证过的 Cargo.lock，cargo --locked 可复现构建，优于 GitHub tag tarball（v0.8.0 tag 无 lock 文件）"
  - "cargo test --release --locked 在真机（host=target=aarch64-unknown-linux-ohos）直接可跑：cargo 编译的测试二进制无需签名即可执行，只有 rust-lang dist 包内 cargo/rustc 需自签名"
  - "tests/cli.rs 经 assert_fs::NamedTempFile 写临时样本文件，受 OHOS /tmp 只读（E002）影响，配方需保证可写 TMPDIR"
