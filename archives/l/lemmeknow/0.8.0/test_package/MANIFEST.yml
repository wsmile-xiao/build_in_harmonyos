# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51：上游测试三步法申报）

package: lemmeknow/0.8.0
homepage: "https://github.com/swanandx/lemmeknow"

# 上游测试命令（cargo 项目，无 make check / ctest / meson test）
# --tests 覆盖全部 10 个测试目标（含 src/lib.rs 单元测试）；doc-test 除外：
# rust-toolchain/1.97.1 基础设施包不含 rustdoc 二进制，上游仅有的 2 个 rust
# doc-example 与 tests/identifier_check.rs 覆盖面重复（to_json 序列化路径）
upstream_check_command: "cargo test --release --locked --tests"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "cargo test --release --locked --tests --target aarch64-unknown-linux-ohos"

# 上游实际运行的测试程序（cargo 测试，静态统计 10 个 #[test] 函数）
upstream_tests:
  - file: "tests/cli.rs"
    source: "lemmeknow-0.8.0/tests/cli.rs"
    description: "4 个 assert_cmd CLI 集成测试：文件内容识别(IPv4→Internet Protocol) / URL 识别 / 无法识别提示 / --help"
    command: "cargo test --release --locked --tests --target aarch64-unknown-linux-ohos --test cli"
  - file: "tests/identifier_check.rs"
    source: "lemmeknow-0.8.0/tests/identifier_check.rs"
    description: "4 个识别器库级测试：YouTube Channel ID / TryHackMe Flag(min_rarity+boundaryless) / bytes 识别 URL / bytes boundaryless(HackTheBox Flag)"
    command: "cargo test --release --locked --tests --target aarch64-unknown-linux-ohos --test identifier_check"
  - file: "tests/validate_regexes.rs"
    source: "lemmeknow-0.8.0/tests/validate_regexes.rs"
    description: "src/data/regex.json 全部 140 条规则可编译并匹配示例样本校验"
    command: "cargo test --release --locked --tests --target aarch64-unknown-linux-ohos --test validate_regexes"
  - file: "src/lib.rs"
    source: "lemmeknow-0.8.0/src/lib.rs"
    description: "1 个单元测试（it_works 占位断言）"
    command: "cargo test --release --locked --tests --target aarch64-unknown-linux-ohos --lib"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_lemmeknow.py
    description: "消费者冒烟+功能测试：--help / --version / 识别 127.0.0.1 为 Internet Protocol"
    command: "python3 test_lemmeknow.py"

# 鸿蒙特有测试 (HarmonyOS-specific)：断言产物在本平台可用所必需的特性
# B1 ELF machine = AArch64；B2 PT_INTERP = OHOS musl loader（证明是 OHOS
# bionic/musl 二进制而非 glibc Linux）；B3 含 OHOS code signature（未签名
# ELF 在 HarmonyOS 上无法 execve，EACCES errno 13，正是配方 _sign_binaries()
# 修复的失败点）；B4 非空可执行文件
harmonyos_specific_tests:
  - file: test_lemmeknow.py
    description: "鸿蒙特有测试 4 项（AArch64 / musl 解释器 / code signature / 产物完整性）"
    command: "PACKAGE_FOLDER=<pkg> python3 test_lemmeknow.py"
    assertion_count: 4

# 依赖测试：lemmeknow 为纯 Rust 静态链接产物，无 C/C++ 依赖包
# （Cargo.lock 123 项全为纯 Rust，无 lib/include 消费面），故无 dependency_tests。
dependency_tests: []

# 测试断言总数 (近似值, 用于质量评估)
# 上游 cargo 测试 10 + test_package 消费者冒烟 4 + 鸿蒙特有测试 4
assertion_count: 18
