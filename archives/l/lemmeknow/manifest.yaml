# 软件级 manifest — lemmeknow
# 遵循 ARCHIVE-SPEC v2.0

software: lemmeknow
display: "lemmeknow"
description: "网络安全与取证字符串识别工具 — 基于 140 条正则规则识别 IP、URL、邮箱、API 密钥、令牌格式等文本模式，支持文件扫描与 JSON 输出"
category: utility
homepage: "https://github.com/swanandx/lemmeknow"
license: MIT
build_system: cargo

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Rust cargo 项目（edition 2021），依赖闭包 123 项全为纯 Rust、无任何 C/C++/网络库依赖，cargo build --release --locked 直接编译"
    - "设备无 cargo/rustc：经 tool_requires 引用制品仓基础设施包 rust-toolchain/1.97.1（宿主与目标均为 aarch64-unknown-linux-ohos）"
    - "rust-lang dist 工具链二进制无 code signature，OHOS 拒绝 execve（E318）：配方内 binary-sign-tool -selfSign 1 自签名 cargo/rustc/librustc_driver，其余负载软链"
    - "cargo 自身动态链接 OpenSSL/zlib：harmonybrew openssl@3/zlib-ng-compat bottle 提供运行库，OHOS loader 忽略 DT_RUNPATH 须显式 LD_LIBRARY_PATH"
    - "设备无默认 CA store：SSL_CERT_FILE/CURL_CA_BUNDLE 指向系统 cacert.pem，crates 索引走 rsproxy.cn sparse 镜像"
    - "禁止 rustup 引导（rustup 无法识别 HarmonyOS 宿主，E105/E154）"
    - "OHOS /tmp 只读（E002）：构建与上游测试需可写 TMPDIR"
    - "上游测试 cargo test --release --locked 全离线（10 个用例：4 CLI 集成 + 4 识别器 + 1 规则校验 + 1 单元），真机可直接运行"
  common_dependencies:
    - rust

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.8.0":
    status: built
    build_date: "2026-09-25"
    published_as: lemmeknow/0.8.0
