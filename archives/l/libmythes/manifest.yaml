software: libmythes
display: "MyThes"
description: "Simple thesaurus library using structured text data"
category: doc
homepage: "https://github.com/hunspell/mythes"
license: BSD-Mark-Modifications
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建，configure 强制依赖 hunspell pkg-config（仅 example 需要）"
    - "configure 加 --disable-werror，适配 clang 15"
    - "make -j1，OHOS 沙箱无 jobserver"
    - "上游 make check 零自动化断言，仅构建 example"
    - "HMDFS 下 .so 别名链解引用为实文件，删 .la"
  common_dependencies:
    - hunspell

versions:
  "1.2.6":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libmythes/1.2.6"
    source_url: "https://github.com/hunspell/mythes/releases/download/v1.2.6/mythes-1.2.6.tar.xz"
