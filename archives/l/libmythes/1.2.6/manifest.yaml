# manifest.yaml — libmythes 1.2.6 版本级元数据

software: libmythes
version: "1.2.6"
status: built
build_date: "2026-09-15"

build_system: autotools
upstream_url: "https://github.com/hunspell/mythes"
source_url: "https://github.com/hunspell/mythes/releases/download/v1.2.6/mythes-1.2.6.tar.xz"
sha256: "97bd2ba5738aebdba1bc31f30f1be42f1404386c94105ad5990d839a1311c8a5"

description: "Simple thesaurus library using structured text data (.idx/.dat)"
license: BSD-Mark-Modifications

dependencies:
  - hunspell/1.7.3

provides:
  - libmythes-1.2.so
  - mythes.hxx
  - mythes.pc
  - th_gen_idx.pl

conan:
  user: ohpcd
  channel: stable

patches_applied: []

notes: |
  - Autotools 构建，configure 强制 PKG_CHECK_MODULES(hunspell)，故 requires hunspell/1.7.3。
  - 库本体（mythes.cxx）不含 hunspell，仅 example.cxx 用 hunspell 做 stemming。
  - configure 加 --disable-werror（上游默认 -Werror，clang 15 下 legacy 告警会变错）。
  - make -j1（OHOS 沙箱无 mkfifo jobserver）。
  - 上游 make check 仅构建 check_PROGRAMS=example，无 TESTS，零自动化断言。
  - package() 删 .la、.so 别名链解引用为实文件副本（HMDFS 不解析符号链接）。
