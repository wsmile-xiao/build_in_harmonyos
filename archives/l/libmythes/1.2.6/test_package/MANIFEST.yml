# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmythes/1.2.6
homepage: "https://github.com/hunspell/mythes"

# 上游测试套件存在性（经审计上游源码确认：无自动化测试框架）
upstream_tests_exist: false

# 上游测试审计（源码：mythes-1.2.6.tar.xz，
# sha256 97bd2ba5738aebdba1bc31f30f1be42f1404386c94105ad5990d839a1311c8a5）
upstream_test_audit:
  source_tarball: "mythes-1.2.6.tar.xz"
  source_sha256: "97bd2ba5738aebdba1bc31f30f1be42f1404386c94105ad5990d839a1311c8a5"
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "enable_testing / add_test (ctest)"
    - "check_PROGRAMS / TESTS (automake make check)"
    - "meson test wiring"
    - "tests/ / test/ 目录"
  scan_result: "Makefile.am 仅有 check_PROGRAMS = example，无 TESTS 变量；全仓无 gtest/pytest/ctest/meson 测试；tests/ 目录不存在"
  manual_programs_only:
    - "example.cxx — 手动示例程序，需人工传参 idx/dat/wordlist（及可选 aff/dic），非自动化断言套件"
    - "th_gen_idx.pl — 索引生成 perl 脚本（dist_bin_SCRIPTS），非测试"
    - "th_en_US_new.idx/.dat + morph.* + checkme.lst — 随包示例数据/待查词表，非测试 harness"
  make_check_output: "make check 仅构建 example 二进制，0 项自动化测试执行（libXext 6.4.0.1 同类空 check 先例）"
  reason: "mythes 1.2.6 上游发布包不含任何自动化测试套件"

# 上游测试命令（无自动化套件，故 check 命令不适用）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
# build() 仍执行 make check 以链接验证 example（含 libmythes + hunspell），
# 但因上游零断言，此处记 false，与 libXext 空 check 先例一致。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_mythes.cpp
    description: "链接 libmythes-1.2 加载自研最小词库，Lookup 命中 hello（含 greeting/hi）、未命中 missingword/空串，校验编码与内存清理"
    command: "./test_mythes"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 9
