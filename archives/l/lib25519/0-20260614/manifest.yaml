# 版本级 manifest — lib25519 0-20260614
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一构建输入，本文件为人读交叉校验）

version: "0-20260614"
software: "lib25519"
status: built
build_date: "2026-09-15"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://lib25519.cr.yp.to/lib25519-20260614.tar.gz"
  sha256: "208f883405ac0c2f503c3f7d07f0e525d0b3b6f7a883ebf53d936a82840652a9"
  tar_format: tar.gz
  version_mapping: "Conan lib25519/0-20260614 maps to upstream lib25519-20260614 tarball (Debian-style 0~20260614 snapshot versioning, no upstream major version)."

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游构建系统：./configure (python3 脚本) + scripts-build/ + Makefile
  # （与 libcpucycles 同族：编译器唯一来源是 compilers/default，需前置 OHOS clang）
  system: custom
  configure_options:
    - "--host=arm64"
    - "--no-valgrind"
    - "--prefix=<package_folder>"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 零 patch：上游 20260614 在 OHOS aarch64 上无需任何源码修改。
# helpers/randombytes.{h,c} 为构建期新增的缺失依赖补齐（未发布的
# librandombytes 的 getrandom 实现），不修改上游任何文件。
patches_applied: []

# ============================================================
# 验证
# ============================================================

validation:
  local:
    - "conanfile.py / test_package/conanfile.py Python 语法检查待真机轮执行"
    - "conandata.yml / manifest.yaml / test_package/MANIFEST.yml YAML 解析待真机轮执行"
    - "上游 tarball gzip CRC 完整性已验证（全量解包列表 4550 条目无错误）"
    - "test_package 调用真实 C API（10 断言：协商一致性/签名往返/篡改与错钥拒绝）"
    - "上游 13 个 api 操作分支逐个运行 lib25519-test（须 all tests succeeded 且退出码 0）"
  remote:
    - "pending HMBS 真机预检（conan create + test_package + 13 上游分支）"
  pending:
    - "HMBS preflight evidence（通过率数字以真机日志为准）"
    - "GitCode CI build_and_test.sh / AI review / 合入"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "lib25519 与 libcpucycles 同属 djb ./configure 家族：configure 不读任何环境变量，工具链唯一注入点是源码树 compilers/default（首个 --version 探测成功的整行被采用），只改构建缓存副本"
  - "静态归档本身仅持有未定义的 randombytes() 引用（keypair 包装器调用），但共享链接（scripts/sharedlib … -lrandombytes）与全部 command 工具必须在链接期解析该符号；用 OHOS getrandom 私有静态归档满足链接，shared 产物不产生对外部 librandombytes 的 DT_NEEDED"
  - "上游 make install（scripts-build/install）在 OHOS hmfs 上与 libcpucycles 同因失败（setgid 目标目录内 tempfile.TemporaryDirectory，umask 077 → EACCES），改为直接收集 build/arm64/package/（install 无编译动作，语义等价）"
  - "上游测试可在无 valgrind 环境运行常规分支（--no-valgrind 切正常头文件）；数据流测试（valgrind）因 OHOS 无 valgrind 跳过，已在补充说明声明"
  - "cr.yp.to 源站下载缓慢（16MB 包单流约 50KB/s），CI 若出现源码下载超时再按规则加镜像，当前保留官方单 URL"
