# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: lib25519/0-20260614
homepage: "https://lib25519.cr.yp.to"

# 上游测试命令：lib25519 自带 SUPERCOP 风格测试 command/lib25519-test
# （lib25519-fulltest 包装器另需 valgrind 数据流测试，OHOS 无 valgrind，
#   此处运行常规测试；13 个 `api` 操作分支逐个调用，每分支必须打印
#   "all tests succeeded" 且退出码为 0）
upstream_check_command: "build/arm64/package/bin/lib25519-test"
upstream_test_in_build: true
upstream_test_command: "lib25519-test <op> <prim> for 13 api operation splits"

upstream_tests:
  - file: command/lib25519-test.c
    description: "上游常规测试: verify/32 已知答案测试"
    command: "lib25519-test verify 32"
  - file: command/lib25519-test_hashblocks_sha512.c
    description: "上游常规测试: hashblocks/sha512 已知答案测试"
    command: "lib25519-test hashblocks sha512"
  - file: command/lib25519-test_hash_sha512.c
    description: "上游常规测试: hash/sha512 已知答案测试"
    command: "lib25519-test hash sha512"
  - file: command/lib25519-test_pow_inv25519.c
    description: "上游常规测试: pow/inv25519 已知答案测试"
    command: "lib25519-test pow inv25519"
  - file: command/lib25519-test_powbatch_inv25519.c
    description: "上游常规测试: powbatch/inv25519 已知答案测试"
    command: "lib25519-test powbatch inv25519"
  - file: command/lib25519-test_nP_montgomery25519.c
    description: "上游常规测试: nP/montgomery25519 已知答案测试"
    command: "lib25519-test nP montgomery25519"
  - file: command/lib25519-test_nPbatch_montgomery25519.c
    description: "上游常规测试: nPbatch/montgomery25519 已知答案测试"
    command: "lib25519-test nPbatch montgomery25519"
  - file: command/lib25519-test_nG_merged25519.c
    description: "上游常规测试: nG/merged25519 已知答案测试"
    command: "lib25519-test nG merged25519"
  - file: command/lib25519-test_nG_montgomery25519.c
    description: "上游常规测试: nG/montgomery25519 已知答案测试"
    command: "lib25519-test nG montgomery25519"
  - file: command/lib25519-test_mGnP_ed25519.c
    description: "上游常规测试: mGnP/ed25519 已知答案测试"
    command: "lib25519-test mGnP ed25519"
  - file: command/lib25519-test_multiscalar_ed25519.c
    description: "上游常规测试: multiscalar/ed25519 已知答案测试"
    command: "lib25519-test multiscalar ed25519"
  - file: command/lib25519-test_dh_x25519.c
    description: "上游常规测试: dh/x25519 已知答案测试"
    command: "lib25519-test dh x25519"
  - file: command/lib25519-test_sign_ed25519.c
    description: "上游常规测试: sign/ed25519 已知答案测试"
    command: "lib25519-test sign ed25519"

# test_package 中自带的测试 (消费者视角验证 lib25519 公开 C API)
test_package_tests:
  - file: test_lib25519.c
    description: "消费者测试: 常量/X25519 密钥协商/Ed25519 签名验签往返与拒绝用例"
    command: "./test_lib25519"

# 测试断言总数：
#   1 const-sizes              6 sign-roundtrip
#   2 dh-keypair-random        7 sign-tamper-reject
#   3 dh-agree                 8 sign-wrongkey-reject
#   4 dh-nontrivial            9 sign-empty
#   5 sign-keypair-random     10 sign-resign-reverify
assertion_count: 10
