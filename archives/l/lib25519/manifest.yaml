software: lib25519
display: "lib25519"
description: "X25519 key exchange and Ed25519 signatures using Curve25519"
category: crypto
homepage: "https://lib25519.cr.yp.to"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "djb 家族 ./configure：工具链唯一注入点为源码树 compilers/default，需前置 OHOS clang"
    - "librandombytes 未入仓时用 OHOS getrandom 私有实现作构建期补齐（不改上游文件）"
    - "跳过 make install，直接收集 build/<arch>/package/（hmfs setgid 语义）"
  common_dependencies: []

versions:
  "0-20260614":
    status: built
    build_date: "2026-09-15"
    format: conan
    note: "首个 OHOS 适配版本；零 patch；13 上游分支待真机预检回填"
