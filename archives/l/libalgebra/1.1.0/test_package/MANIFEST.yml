# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libalgebra/1.1.0
homepage: "https://github.com/mklarqvist/libalgebra"

# 上游测试命令 (上游 CMakeLists.txt 无 add_test/enable_testing 目标)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 库无编译产物，不集成上游测试；上游源码不含测试框架/测试目标
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 官方 v1.1.0 源码仅含 libalgebra.h 与 x86 专用
# benchmark.cpp（无独立上游测试用例，见 reports/ 双口径台账）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 STORM_popcount64/STORM_intersect_count/STORM_union_count/STORM_diff_count 并断言结果"
    command: "./test_libalgebra"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4