# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: libgudev/238
homepage: "https://gitlab.gnome.org/GNOME/libgudev"

# 上游自测（test-enumerator-filter / test-sysfsattr）需 gio + umockdev
# （LD_PRELOAD=libumockdev-preload.so）——OHOS 不可用，构建时 -Dtests=disabled 关闭
upstream_check_command: "echo \"upstream tests require umockdev LD_PRELOAD (unavailable on OHOS); disabled via -Dtests=disabled\""

# conanfile.py build() 中已按上游 meson 配置裁剪（tests/introspection/vapi/gtk_doc 关闭）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_gudev.c
    description: "消费者探针：g_udev_client_new() 创建 GUdevClient，验证 libgudev 链接 + 初始化（无需 udev hwdb）"
    command: "clang test_gudev.c -o test_gudev_probe $(pkg-config --cflags --libs gudev-1.0) && ./test_gudev_probe"

# 断言总数（test_package 1 个断言）
assertion_count: 1
