test_note: "上游测试实测（2026-09-08 + 2026-09-10 复查）：test-gudevdevice 手动编译成功并实跑——测试真实执行（非无法运行），但断言失败根因已确认（上游源码证据）：libudev-zero 1.0.4 的 udev_device_new_from_environment() 为 `/* XXX NOT IMPLEMENTED */ return NULL;`（libudev-zero-1.0.4/udev_device.c:723）——test-gudevdevice.c:37 调用该未实现 API 必然返回 NULL，g_udev_device_get_tags 断言失败（1/1 FAIL，依赖包功能缺口，非 libgudev 缺陷）；其余 3 个（enumerator-filter/sysfsattr/double）需 umockdev LD_PRELOAD（OHOS 不可用）；libudev-zero/1.0.4 的 libudev.pc Version=251 满足 libgudev 的 libudev>=251；test_package 消费者探针（g_udev_client_new）compile+link+init 通过，1/1"
