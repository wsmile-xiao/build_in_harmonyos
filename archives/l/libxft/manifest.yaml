software: libxft
display: "X.Org X FreeType Library"
description: "Client-side FreeType font rendering library for X11"
category: gfx
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxft"
license: "HPND-sell-variant"
build_system: meson   # 上游最新（2.3.9）口径；2.3.8 为 autotools，由版本级 manifest 覆盖

ohos_adaptation:
  key_points:
    - "Uses the upstream Meson build without source patches"
    - "Preserves the libXft.so.2 ABI and exports the complete dependency closure"
    - "Tests all 77 public functions plus display-independent name contracts"
    - "2.3.8 (Autotools) needs config.guess/config.sub OHOS tuple patches and a materialised, re-signed dependency view before autoconf run probes succeed"
  common_dependencies:
    - libx11
    - libxrender
    - fontconfig
    - freetype
    - xorgproto

versions:
  "2.3.9":
    status: built
    build_date: "2026-08-26"
    conan_ref: "libxft/2.3.9"
    note: "Fresh W0 and same-snapshot OHOS/arm64 W3 passed"
  "2.3.8":
    status: built
    build_date: "2026-08-28"
    conan_ref: "libxft/2.3.8"
    build_system: autotools
    note: "Device-side conan create passed for shared and static variants; 3 consumers / 137 assertions, upstream 0/0 recorded truthfully"
