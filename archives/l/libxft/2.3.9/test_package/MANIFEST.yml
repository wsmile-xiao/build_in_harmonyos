package: "libxft/2.3.9"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxft"

upstream_check_command: "meson test --no-rebuild --print-errorlogs"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The release has no test directory, Automake TESTS, check_PROGRAMS,
  check-local, or Meson test() registration.

test_package_tests:
  - id: "public-api-surface"
    source: "api_surface.c"
    command: "libxft_api_surface"
    description: >-
      Bind all 77 public functions with typed relocations and execute the
      version and FreeType-library initialization contracts.
  - id: "name-contract"
    source: "name_contract.c"
    command: "libxft_name_contract"
    description: >-
      Validate Fontconfig name round trips and positive/negative XLFD parsing
      without requiring a display server.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 95
