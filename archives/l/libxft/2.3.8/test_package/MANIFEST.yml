package: "libxft/2.3.8"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxft"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The 2.3.8 release registers no Automake TESTS, check_PROGRAMS or
  check-local rule and has no test directory: the top-level Makefile.am only
  sets SUBDIRS = man src, and src/Makefile.am builds libXft without a check
  target. `make -j1 check` therefore runs and reports zero test cases.

test_package_tests:
  - id: "public-api-surface"
    source: "api_surface.c"
    command: "libxft_api_surface"
    description: >-
      Bind all 77 public functions declared by the installed 2.3.8 header
      through typed relocations, then execute the version and FreeType
      library initialization contracts.
  - id: "name-contract"
    source: "name_contract.c"
    command: "libxft_name_contract"
    description: >-
      Validate Fontconfig name parse/unparse round trips, XLFD field mapping
      (family, foundry, weight, slant, size, pixel size, preserved raw name)
      and five negative XLFD rejections without requiring a display server.
  - id: "soname-contract"
    source: "soname_contract.c"
    command: "libxft_soname_contract"
    description: >-
      Load libXft exclusively through dlopen against both the SONAME
      (libXft.so.2) and the unversioned alias (libXft.so), resolve and call
      real entry points in each, and prove the versioned aliases are usable by
      the OHOS runtime loader rather than merely present on disk. Applies to
      the shared package: a shared=False build ships no libXft.so*, so the
      test_package recipe prints an explicit SKIP and the archive is covered
      by the two linked consumers instead.

test_counting:
  convention: >-
    Per binary, assertions counts the CHECK-macro invocations that binary
    prints in its own terminal marker. api_surface is 77 typed symbol bindings
    plus 4 runtime checks. name_contract is 28 check sites. soname_contract is
    14 check sites executed once per library name (libXft.so.2 and libXft.so),
    so its printed total is 28. Compiler output and repeated build variants are
    not counted.
  upstream_independent_total: 0
  integration_independent_total: 3
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 3
assertion_count: 137
