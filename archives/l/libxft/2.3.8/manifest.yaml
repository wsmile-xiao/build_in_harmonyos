  - "0002-config.sub.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libXft 2.3.8 是最后一个 Autotools 发布，2.3.9 已切 Meson，两者配方不可互用（ref: 本版本 notes.md「为什么必须新写配方」；同软件 archives/l/libxft/2.3.9）"
  - "OHOS 加载器认 LD_LIBRARY_PATH 且其查找压过 DT_RPATH；指向含符号链接别名的依赖包目录会让本可用的 rpath 查找失败，必须指向实体化视图（ref: E257 草稿 XFT8；据实收窄 E088/E186/E266）"
  - "已发布包的 .so 可能带本机不接受的签名：dlopen 报 Permission denied 而非 No such file，且同目录相邻库正常，需去 .codesign 段后重签名（ref: E321 草稿 XFT8，与 E135 未签名场景相邻）"
  - "AutotoolsDeps 导出 LIBS 使 autoconf 最早的 AC_PROG_CC 运行探测就链接整条依赖闭包，故加载问题在 configure 阶段以 rc=77 暴露而非测试阶段（ref: E322 草稿 XFT8）"
  - "scripts/patch-autotools-ohos.pl 对 config.sub 只插 ohos-linux 且对 linux-ohos 误报已存在，X.Org 2022-09-17 版需手工补 linux-ohos*（ref: E268 正式条目，配合 E122/E072/E007）"
  - "共享库版本化别名实体化必须保留 owner 可执行位，否则 PROT_EXEC 映射被拒成 Permission denied（ref: E257 草稿 XFT8；别名加载实测要求同 E050/E073）"
  - "PkgConfigDeps 不会把 generators_folder 加入 PKG_CONFIG_PATH，X.Org 包的 PKG_CHECK_MODULES 需配方自行追加；xorg-macros 缺失属静默降级（ref: E323 草稿 XFT8）"
  - "上游 configure 的 umask 077 使 HMDFS 上 config.status 无法写 subs1.awk；configure 属生成文件，按 R6 用 build 目录内副本修正而非源码补丁（ref: E114；权限联合验证口径见 E223）"

