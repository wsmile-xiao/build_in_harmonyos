# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--enable-shared --disable-static（由 options.shared 驱动）"
    - "--srcdir=<source_folder>（OHOS 走 build 目录内的 configure-ohos 副本）"
    - "其余 prefix/bindir/libdir/includedir 由 AutotoolsToolchain 生成，未额外加参"
  dependencies:
    - libx11/1.8.13
    - libxrender/0.9.12
    - fontconfig/2.18.3
    - freetype/2.14.3
    - xorgproto/2025.1
  tool_dependencies:
    - util-macros/1.20.1
  cc: clang
  cxx: clang++
  profile: "ci/conan/profiles/ohos-aarch64"
  parallelism: "-j1"

# ============================================================
# 测试
# ============================================================

test:
  upstream_command: "make -j1 check"
  upstream_registered: 0
  upstream_zero_evidence: >-
    2.3.8 无 test/ 目录，顶层 Makefile.am 只有 SUBDIRS = man src，
    不存在 TESTS/check_PROGRAMS/check-local，因此上游口径为 0/0。
  consumers:
    - name: libxft_api_surface
      assertions: 81
      note: "绑定安装头中全部 77 个公共函数 + 版本与 FreeType 初始化契约"
    - name: libxft_name_contract
      assertions: 28
      note: "名称解析/反解析往返、XLFD 字段映射与 5 个负例拒绝"
    - name: libxft_soname_contract
      assertions: 28
      note: "不链接 libXft，仅经 dlopen 加载 libXft.so.2 与 libXft.so 并调用真实入口"
  consumer_total: 3
  assertion_total: 137
  static_variant: "shared=False 下 2/2 链接型消费者通过，dlopen 契约按产物实况显式 SKIP"

