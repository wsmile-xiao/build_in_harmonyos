# Test manifest for libpd 0.16.1.
package: libpd/0.16.1
homepage: "https://github.com/libpd/libpd"

# ── Upstream test inventory (libpd 0.16.1) ───────────────────────────────
# Counting unit: test CASES — framework-registered cases (@Test / [Test]) plus
# standalone assert-bearing programs counted as one case each.
# N = 84 cases, N' (actually run) = 0; every entry is NOT_RUN with the
# technical reason below.  Assertion call-site counts are deliberately NOT
# declared here (a second counting basis invites miscounts and must not be
# mixed with the case count); only the number of assert call sites in the two
# standalone C programs is quoted, where it identifies the program as
# assertion-bearing.
upstream_test_in_build: false
upstream_test_count: 84
upstream_passed: 0
upstream_failed: 0
upstream_run: 0
upstream_not_run: 84
upstream_test_sources:
  # JUnit 4 binding tests — 19 cases (16 + 3)
  - path: "samples/java/test/org/puredata/core/PdBaseTest.java"
    framework: "JUnit 4"
    cases: 16
    runnable_on_ohos: false
    not_run_reason: >-
      Requires a JVM plus JUnit 4/EasyMock/Objenesis and libpdnative built from
      jni/ (JNI bindings); none of these runtimes exist on the OHOS target and
      upstream CI never runs the Java tests.
  - path: "samples/java/test/org/puredata/core/utils/PdDispatcherTest.java"
    framework: "JUnit 4"
    cases: 3
    runnable_on_ohos: false
    not_run_reason: "Same JVM + JUnit + JNI pdnative requirement as PdBaseTest.java."
  # NUnit binding tests — 63 cases across 13 files
  - path: "samples/csharp/pdtest/"
    framework: "NUnit"
    cases: 63
    files:
      - "LibPDTests.cs (7)"
      - "Managed/AudioTests.cs (5)"
      - "Managed/CApiTests.cs (2)"
      - "Managed/MessagingTests.cs (8)"
      - "Managed/MidiTests.cs (7)"
      - "Managed/PatchTests.cs (3)"
      - "Managed/PdArrayTests.cs (5)"
      - "Managed/PdTests.cs (7)"
      - "MultiInstance/AudioTests.cs (1)"
      - "MultiInstance/MessagingTests.cs (6)"
      - "MultiInstance/MidiTests.cs (5)"
      - "MultiInstance/PdArrayTests.cs (3)"
      - "MultiInstance/PdNumberOfInstancesTests.cs (4)"
    runnable_on_ohos: false
    not_run_reason: >-
      Requires .NET/Mono + NUnit + libpdnative (P/Invoke into the libpd shared
      library); no .NET runtime on the OHOS target and upstream CI never runs
      the C# tests.
  # Standalone assert-bearing C programs — 2 cases (17 and 3 assert call sites)
  - path: "samples/c/pdtest_thread/pdtest_thread.c"
    framework: "none (plain assert.h program)"
    cases: 1
    assert_call_sites: 17
    runnable_on_ohos: false
    not_run_reason: >-
      Exercises the multi-instance API (libpd_new_instance at :54, DSP result
      assertion at :196); its own Makefile builds libpd with MULTI=true.  This
      recipe follows the upstream default PD_MULTI=OFF (Makefile MULTI unset,
      CMake PD_MULTI=OFF), where libpd_new_instance() returns NULL
      (libpd_wrapper/z_libpd.c), so the program cannot pass against the
      delivered artifact.  Upstream CI only *compiles* it, never runs it.
  - path: "samples/c/pdtest_queued/pdtest_queued.c"
    framework: "none (plain assert.h program)"
    cases: 1
    assert_call_sites: 3
    runnable_on_ohos: false
    not_run_reason: >-
      Requires PDINSTANCE/PDTHREADS (libpd_new_instance + libpd_queued_init);
      assertion at :117 checks pthread_create.  Same PD_MULTI=OFF limitation as
      pdtest_thread.  Upstream CI builds but never runs it.
# Assertion-free upstream samples, listed so the inventory can be audited
# exhaustively (they contain no assertions and no non-zero failure path):
upstream_non_test_samples:
  - "samples/c/pdtest/pdtest.c"
  - "samples/c/pdtest_double/pdtest_double.c"
  - "samples/c/pdtest_gui/pdtest_gui.c"
  - "samples/c/pdtest_multi/pdtest_multi.c"
  - "samples/c/pdtest_portaudio/pdtest_portaudio.c"
  - "samples/cpp/** (pdtest, pdtest_freeverb, pdtest_jack, pdtest_multi, pdtest_rtaudio)"
  - "samples/emscripten/** (gemtest, pdtest, pdtest_gui)"
  - "samples/objc/ios/pdtest/**"
  - "samples/python/** (test.py, pygame_test.py, pygame_fun_test.py)"
  - "pure-data/libpd/test_libpd/test_libpd.c (two-instance demo, prints ticks, always returns 0)"
  - "pure-data/gtk/test1.pd (demo patch)"
# Excluded on purpose: the two vendored third-party RtAudio copies under
# samples/cpp/*/src/RtAudio.cpp contain assert call sites but are not libpd
# tests; jni/oboe/logging_macros.h is third-party Oboe logging code.  The
# pure-data submodule declares no TESTS and has no test/.

test_files:
  - path: "test_package/libpd_test.c"
    test_type: "R34"
    assertion_count: 16
    description: >-
      Consumer program using the installed libpd C API: initializes the
      library, checks the Pure Data version banner and the pinned pure-data
      revision (0.56.5), loads the fixture patch, round-trips a bang and a
      float through bound receivers, and processes a real [osc~ 440] ->
      [dac~] signal chain (finite samples, audible peak, [-1,1] range).
  - path: "test_package/libpdtest.pd"
    test_type: "fixture"
    assertion_count: 0
    description: >-
      Pure Data fixture patch: two receivers feeding [print] objects plus an
      [osc~ 440] -> [dac~] chain driven by the consumer test.

test_package_test_count: 1
consumer_assertion_count: 16
assertion_count: 16
