conan_ref: "libpd/0.16.1"

source:
  url: "https://github.com/libpd/libpd/archive/refs/tags/0.16.1.tar.gz"
  sha256: "546cd536af9055d803d1d5b5034446fb159abea3a34f666423cf825f2c902c49"
  tar_format: tar.gz
  submodules:
    pure-data:
      url: "https://github.com/pure-data/pure-data/archive/f009fd8d7b537e209e09898d487fdf1bf547da2b.tar.gz"
      sha256: "29ad07f1f13dd199e2ebcd3c486dca4c496e4874dd856c925dc3891e11e58267"
      revision: "f009fd8d7b537e209e09898d487fdf1bf547da2b"

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  targets:
    - "make libpd -j1 CC=<clang> ADDITIONAL_CFLAGS=\"-O3 -DNDEBUG -DHAVE_ALLOCA_H -DHAVE_LIBDL\" ADDITIONAL_LDFLAGS=\"-ldl -Wl,-soname,libpd.so\""
    - "make libs/libpd.a -j1 (shared=False)"
  install:
    - "make install prefix=<package_folder>"

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "JUnit 4 (19 cases) + NUnit (63 cases) + 2 plain assert.h programs = 84 cases"
  upstream_total: 84
  upstream_passed: 0
  upstream_failed: 0
  upstream_not_run: 84
  upstream_not_run_reasons:
    - "JUnit 19 cases: needs JVM + JUnit + the JNI libpdnative built from jni/; absent on OHOS, never run by upstream CI"
    - "NUnit 63 cases: needs .NET/Mono + NUnit; absent on OHOS, never run by upstream CI"
    - "2 plain assert programs (pdtest_thread 17 asserts, pdtest_queued 3 asserts): need PD_MULTI=true; this recipe follows the upstream default PD_MULTI=OFF, where libpd_new_instance() returns NULL; upstream CI only compiles them"
  test_package_passed: 1
  test_package_failed: 0
  test_package_assertions: 16
  execution: "conan create rc=0 (shared and shared=False); consumer asserts 16/16; upstream 84 cases NOT_RUN (see reasons)"

test_passed: 16
test_failed: 0

verified:
  compiler: "OHOS Clang 15.0.4"
  cmake: "4.1.2"
  conan: "2.29.1"
  date: "2026-09-15"
  evidence: "conan create rc=0; test_package consumer assertions 16/16 PASS; failures=0; upstream 84 cases NOT_RUN with per-entry technical reasons"

patches_applied: []

knowledge_gained:
  - "libpd 的 GitHub 源码包不含 pure-data 子模块内容（pure-data/ 为空），必须用 conandata submodules 段注入固定 commit 快照后再构建"
  - "上游 Makefile 以 uname -s 分支；OHOS 上该值是 HarmonyOS，Linux 分支不触发，HAVE_ALLOCA_H/HAVE_LIBDL 与 -ldl 需经 ADDITIONAL_CFLAGS/ADDITIONAL_LDFLAGS 显式注入"
  - "上游 CFLAGS 用 '=' 赋值，继承的环境 CFLAGS 被覆盖，只有 ADDITIONAL_CFLAGS 钩子能把 Conan 工具链 flags 传进去"
  - "libpd 的上游测试不在 tests/ 而在 samples/ 下：JUnit（samples/java/test）、NUnit（samples/csharp/pdtest）、无框架 assert 程序（samples/c/pdtest_thread|queued）；按目录名 or 文件名或 maxdepth 2 的 find 清点会全部漏掉，必须按测试框架标记全仓 grep"
  - "上游 Makefile 链接行不设置 SONAME，本地 CI 的 L5a 门禁会拒绝；经 ADDITIONAL_LDFLAGS 追加 -Wl,-soname,libpd.so 即可，无需改上游源文件"
