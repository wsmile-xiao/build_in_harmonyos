software: libpd
display: "libpd"
description: "Pure Data embedded as a portable audio synthesis library"
category: library
homepage: "https://github.com/libpd/libpd"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 用 `uname -s` 选择平台分支；OHOS 上该值是 HarmonyOS 而不是 Linux，所以 Linux 分支的 -DHAVE_ALLOCA_H / -DHAVE_LIBDL / -ldl 不会触发，需经 ADDITIONAL_CFLAGS / ADDITIONAL_LDFLAGS 显式注入（三个头文件在 OHOS sysroot 中实测存在）"
    - "GitHub 源码包不含 pure-data 子模块内容（pure-data/ 为空目录），source() 从 conandata.yml 的 submodules 段注入固定快照后再构建"
    - "上游 CFLAGS 用 '=' 赋值，环境变量 CFLAGS 不生效；配方只能走 Makefile 自带的 ADDITIONAL_CFLAGS 钩子"
    - "上游链接行不设置 SONAME，本地 CI 的 L5a 门禁会判缺 DT_SONAME；经 ADDITIONAL_LDFLAGS 追加 -Wl,-soname,libpd.so 即可（与安装出的未版本化文件名一致）"
    - "上游测试不在 tests/ 而在 samples/ 下：samples/java/test（JUnit）、samples/csharp/pdtest（NUnit）、samples/c/pdtest_thread 与 pdtest_queued（裸 assert，需 PD_MULTI=true）。按目录名或浅层 find 清点会整组漏掉"
    - "交付物为 include/libpd 下的 C/C++ 头文件与 lib/libpd.so（或 lib/libpd.a），无命令行工具"
  common_dependencies: []

versions:
  "0.16.1":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libpd/0.16.1"
