software: libdsm
# 版本级 manifest
# 文件位置: archives/l/libdsm/0.4.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.4.3"

# published | built | failed | archived
status: built

# cmake | autotools | makefile | meson | custom
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-09"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/videolabs/libdsm/archive/refs/tags/v0.4.3.tar.gz"
  sha256: "747c4563d6291303d9b085c9e7dc96ac44f91871dcac3e20480fdcc066eee88a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson

  configure_options:
    - "-Dbinaries=false"
    - "-Dc_std=gnu11"
    - "-Dwrap_mode=nodownload"
    - "c_args=-D_GNU_SOURCE"

  # 编译依赖列表
  dependencies:
    - "libtasn1/4.21.0"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 0.4.3 已从 autotools 切换为 meson（tarball 只含 meson.build，无 configure/autogen.sh）"
  - "真实依赖是 libtasn1（SPNEGO ASN.1），不是 zlib——全源码树无 zlib 引用"
  - "tarball 不含预生成的 spnego_asn1.c，需 tool_requires libtasn1 提供 asn1Parser 在构建时生成"
  - "meson.build 对非 linux/darwin 系统统一加 -D_POSIX_C_SOURCE=200809L，musl 严格方言下 strlcpy 无声明；c_std=gnu11 + c_args 注入 -D_GNU_SOURCE 解决（零 patch）"
  - "OHOS musl iconv 原生可用（iconv_open 实测 OK），无需第三方 libiconv"
  - "NetBIOS UDP socket 序列（SO_BROADCAST/IP_MULTICAST_LOOP/bind）在 OHOS 全部可用"
