package: libatomic-ops/7.10.0
homepage: "https://github.com/bdwgc/libatomic_ops"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: tests/test_atomic.c
    source: libatomic_ops-7.10.0/tests/test_atomic.c
    description: "Upstream ctest test_atomic: fetch_add, CAS, barriers"
    command: "ctest -R test_atomic$"
  - file: tests/test_atomic.c
    source: libatomic_ops-7.10.0/tests/test_atomic.c
    description: "Upstream ctest test_atomic_generalized: generalized emulation"
    command: "ctest -R test_atomic_generalized$"
  - file: tests/test_atomic.c
    source: libatomic_ops-7.10.0/tests/test_atomic.c
    description: "Upstream ctest test_atomic_pthreads: pthread definitions"
    command: "ctest -R test_atomic_pthreads$"
  - file: tests/test_stack.c
    source: libatomic_ops-7.10.0/tests/test_stack.c
    description: "Upstream ctest test_stack: lock-free stack"
    command: "ctest -R test_stack$"
  - file: tests/test_malloc.c
    source: libatomic_ops-7.10.0/tests/test_malloc.c
    description: "Upstream ctest test_malloc: atomic malloc"
    command: "ctest -R test_malloc$"

test_package_tests:
  - file: test.c
    description: "Consumer test: fetch_add, CAS, test_and_set, pause, malloc, stack"
    command: "./test_libatomic_ops"

assertion_count: 16
