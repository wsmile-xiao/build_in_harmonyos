software: libatomic-ops
version: "7.10.0"
status: built
build_date: "2026-09-14"
build_system: cmake

source:
  url: "https://github.com/bdwgc/libatomic_ops/releases/download/v7.10.0/libatomic_ops-7.10.0.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DAO_BUILD_SHARED_LIBS=OFF"
    - "-DBUILD_TESTING=ON"
    - "-Denable_docs=OFF"
    - "-Denable_gpl=ON"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "7.10.0 CMake renames BUILD_SHARED_LIBS to AO_BUILD_SHARED_LIBS and build_tests to standard BUILD_TESTING"
  - "Upstream registers 5 ctest cases; build() runs ctest and emits HMBS_UPSTREAM_TEST_RESULT"
  - "Consumer test covers fetch_add, CAS, test_and_set, pause, malloc and stack across both libs"
