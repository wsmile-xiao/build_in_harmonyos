software: libc-abi
description: "libc++abi — LLVM 的 C++ ABI 库（libcxxabi 子项目）：提供 __cxa_* 运行时入口（异常抛出/捕获与展开、RTTI/__dynamic_cast、__cxa_demangle 反修饰、__cxa_guard_* 函数内静态量初始化、__cxa_thread_atexit 线程局部析构）以及 operator new/delete 的默认实现。是 libc++ 的 ABI 底座，与设备 SDK 自带 libc++abi 同名，按 R26 只产出静态库。"
category: development
build_system: cmake
versions:
  - version: "22.1.8"
    status: built
    build_date: "2026-09-16"
homepage: "https://libcxxabi.llvm.org"
