package: libc-abi/22.1.8
homepage: "https://libcxxabi.llvm.org"

# 上游测试来源：libcxxabi 是 LLVM 单仓（llvm-project）的子项目，测试套件位于
# libcxxabi/test/。磁盘共 81 个测试文件（71 *.pass.cpp + 2 *.pass.sh.S +
# 5 *.pass.sh.s + 2 *.sh.cpp + 1 *.sh.test），其中 2 个由上游自身
# lit.local.cfg 目录级排除，本配方驱动 79 个（对账见 ../reports/test-report.md）。
upstream_check_command: "python3 -c \"...\" (内联于 conanfile.py build()->_run_upstream_tests)"
upstream_test_in_build: true
upstream_test_command: "conan create . --build=missing"
upstream_tests:
  - file: libcxxabi/test/*.pass.cpp
    source: llvm-project-22.1.8.src/libcxxabi/test
    description: >
      libcxxabi 上游 lit 测试套件全量 79 例（exception、unwind、guard、demangle、
      thread_local、new/delete 等）。不依赖 llvm-lit：本包只构建 libcxxabi，
      CI 上不存在 llvm-config 全量工具链，故配方内联实现了 lit 的
      REQUIRES/UNSUPPORTED/XFAIL/ADDITIONAL_COMPILE_FLAGS 语义
      （conanfile.py::_run_upstream_tests），逐个编译并运行。
    command: "conan create . (build() 自动执行)"

test_package_tests:
  - file: test_libcxxabi.cpp
    description: >
      ABI 消费者测试：真实调用 libc++abi 入口 —— __cxa_demangle（含非法输入与
      调用方缓冲区复用）、__cxa_guard_acquire/release（8 线程竞争下函数内静态量
      只初始化一次）、__cxa_throw/__cxa_begin_catch/__cxa_end_catch（跨 5 层栈
      展开并保留异常负载）、RTTI（typeid 名字、dynamic_cast 交叉/向下转型）、
      __cxa_thread_atexit（4 线程 thread_local 析构）、operator new/delete 的
      普通/数组/对齐(align_val_t)/nothrow 四个重载。
    command: "./test_libcxxabi"
  - file: test_ohos_abi.cpp
    description: >
      HarmonyOS(aarch64) 平台特有测试：uname 确认运行于 aarch64 鸿蒙；
      异常 TLS 状态隔离（8 线程 x 200 次抛接，__cxa_get_globals_fast 的 __thread
      实现不得跨线程串扰）；__cxa_thread_atexit_impl 在鸿蒙 pthread 上按构造逆序
      析构 thread_local；异常跨 dlopen 边界（libohosthrow.so 抛出、主程序接住）；
      与设备 SDK 随附 libc++ 15 的 exception_ptr/rethrow 互操作；__cxa_demangle
      处理鸿蒙 triple 生成的 Itanium 修饰名。
    command: "./test_ohos_abi <build>/bin/libohosthrow.so"
  - file: ohos_throw_module.cpp
    description: >
      上述 dlopen 边界测试的动态模块源码，编译为 libohosthrow.so，导出
      ohos_abi_throw()：从模块内部抛 std::runtime_error，验证静态链接本包
      libc++abi 的 .so 与主程序共享同一套 __cxa_exception 布局与 unwind 实现。
    command: "clang++ -shared -fPIC -o libohosthrow.so ohos_throw_module.cpp"

assertion_count: 26

# 上游测试结果（本机实测，aarch64 鸿蒙 PC，详见 ../reports/test-report.md）：
#   total=79 pass=65 fail=0 build_fail=0 xfail=0 skip=14
# 14 例 skip 逐一可追溯到上游文件自带的 REQUIRES/UNSUPPORTED 标记：
# forced_unwind4（target=aarch64-*-gnu）、native/x86_64/lpstart-zero（target=x86_64）、
# noexception1-4（no-exceptions）、vendor/apple（stdlib=apple-libc++）、
# vendor/ibm AIX 系列 6 例（target=aix）。无一例由本配方屏蔽。
upstream_result_note: "total=79 pass=65 fail=0 build_fail=0 xfail=0 skip=14"
