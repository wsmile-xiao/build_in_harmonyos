software: libc-abi
version: "22.1.8"
status: built
build_system: cmake
build_date: "2026-09-16"
compile_date: "2026-09-16"

source:
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz"
  sha256: "922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888"
  tar_format: tar.xz
  note: >
    libc++abi 是 LLVM 单仓（llvm-project）的 libcxxabi/ 子项目，没有独立
    tarball，因此取 llvm-project-22.1.8.src.tar.xz（167MB），
    source() 用 strip_root=True，取其中 libcxxabi/ 与 libcxx/ 两个子目录。
    与 archives/c/clang/22.1.8 同源同 sha256。

dependencies:
  required: []
  optional: []

build:
  cmake_options:
    - "-DLIBCXXABI_ENABLE_STATIC=ON"
    - "-DLIBCXXABI_ENABLE_SHARED=OFF"
    - "-DLIBCXXABI_INSTALL_STATIC_LIBRARY=ON"
    - "-DLIBCXXABI_INSTALL_HEADERS=ON"
    - "-DLIBCXXABI_ENABLE_EXCEPTIONS=ON"
    - "-DLIBCXXABI_ENABLE_THREADS=ON"
    - "-DLIBCXXABI_ENABLE_NEW_DELETE_DEFINITIONS=ON"
    - "-DLIBCXXABI_USE_LLVM_UNWINDER=OFF"
    - "-DLIBCXXABI_USE_COMPILER_RT=OFF"
    - "-DLIBCXXABI_ENABLE_ASSERTIONS=OFF"
    - "-DLIBCXXABI_HERMETIC_STATIC_LIBRARY=OFF"
    - "-DLIBCXXABI_INCLUDE_TESTS=OFF"
    - "-DLIBCXXABI_LIBCXX_PATH=<src>/libcxx"
    - "-DLIBCXXABI_LIBCXX_LIBRARY_PATH=<sdk>/lib/aarch64-linux-ohos"
  cxx_flags:
    - "-D_LIBCPP_HAS_THREADS=1"
    - "-D_LIBCPP_HAS_THREAD_API_PTHREAD=1"
    - "-D_LIBCPP_HAS_EXCEPTIONS=1"
    - "-D_LIBCPP_HAS_LIBRARY_ALIGNED_ALLOCATION=1"
    - "-isystem <sdk>/include/libcxx-ohos/include/c++/v1"
    - "-fPIC"
  cc: clang
  cxx: clang++
  package_type: static-library

libcxx_headers:
  provider: "OHOS SDK (libc++ 15)"
  path: "<sdk>/include/libcxx-ohos/include/c++/v1"
  reason: >
    源码树自带的 libc++ 22 头文件要求 clang 19+，设备/CI 工具链是 clang 15，
    无法编译；改用 SDK 随附 libc++ 15 头文件，并把 libcxxabi 22 源码的差异
    收敛为补丁。

patches_applied:
  - "0001-libcxxabi-src-cxa_exception_storage.cpp.patch"
  - "0002-libcxxabi-src-cxa_thread_atexit.cpp.patch"
  - "0003-libcxxabi-src-fallback_malloc.cpp.patch"
  - "0004-libcxxabi-src-stdlib_new_delete.cpp.patch"
  - "0005-libcxxabi-test-test_fallback_malloc.pass.cpp.patch"
  - "0006-libcxx-test-support-concat_macros.h.patch"
  - "0007-libcxx-test-support-make_test_thread.h.patch"
  - "0008-libcxxabi-src-cxa_guard_impl.h.patch"

test_results:
  type: conan
  # —— 上游套件（libcxxabi/test/*.pass.cpp 全量，build() 内执行）——
  upstream:
    command: "conan create . -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"
    default_in_recipe: true
    option: "with_upstream_tests"
    files_on_disk: 81
    excluded_by_upstream_lit_local_cfg: 2
    excluded_reason: >
      native/arm-linux-eabi/lit.local.cfg 自行设置 config.unsupported = True
      （仅当 host triple 是原生 arm-linux-eabi 才启用），其下
      ttype-encoding-00/90.pass.sh.s 两例被上游自身排除，本配方忠实复现该语义。
    total: 79
    passed: 65
    failed: 0
    build_failed: 0
    xfailed: 0
    skipped: 14
    skip_reason: >
      14 例 skip 全部源于上游文件内自带的 REQUIRES / UNSUPPORTED 标记在本目标下
      不成立，逐条可追溯：forced_unwind4（REQUIRES target=aarch64-*-gnu，本目标
      triple 为 aarch64-linux-ohos）、native/x86_64/lpstart-zero（REQUIRES
      target=x86_64）、noexception1-4（REQUIRES no-exceptions，本包启用异常）、
      vendor/apple（REQUIRES stdlib=apple-libc++）、vendor/ibm AIX 系列 6 例
      （REQUIRES target=aix）。无一例由本配方屏蔽。
  # —— 消费者测试（test_package）——
  test_package:
    total: 2
    passed: 2
    failed: 0
    files:
      - "test_libcxxabi.cpp（ABI 功能消费者测试，15 checks）"
      - "test_ohos_abi.cpp（鸿蒙 aarch64 平台特有测试，11 checks）"
    helper_module: "ohos_throw_module.cpp → libohosthrow.so（dlopen 边界测试用）"
    assertions: 26
    ohos_specific_coverage:
      - "异常 ABI 在 OHOS aarch64 目标上的分配/进入/退出往返"
      - "跨 dlopen 模块边界的异常按类型捕获（__cxa_*/type_info 全进程单实例）"
      - "uname() 平台身份断言（sysname=HarmonyOS），非 OHOS 主机不会误过"
    self_run_note: >
      本平台 test_package 内 self.run 有两种失效形态（SIGSEGV 抛出；list argv 被
      /bin/sh 方括号化恒返 127 且不抛异常）。test() 内仍调用 self.run（满足 CI L0c /
      preflight PF3），命中任一形态则回退 Python subprocess 直启同一二进制并取其
      真实退出码，回退有日志、不伪造结果。
  breaking_reverse_check:
    description: >
      用设备 SDK 自带的 libc++abi.a（15）替换被测库后重新链接运行 test_package，
      有测试失败，证明本套测试确实在检验本包产物（不是恒过的空壳）。
    result: "SDK libc++abi.a 替换后有 2 个测试失败"

knowledge_gained:
  - "libcxxabi 22 必须配同版本（22）libc++ 头文件；clang 19+ 要求与 clang 15 工具链冲突，需改用 SDK 随附 libc++ 15 头文件并经 CMAKE_CXX_FLAGS 的 -isystem 注入（LIBCXXABI_LIBCXX_INCLUDES 变量并不存在）——ref: knowledge/drafts/E580-draft-0BA0.kv"
  - "libc++ 15 的 __config_site 缺 libc++ 22 的值型宏，须补 _LIBCPP_HAS_THREADS/_LIBCPP_HAS_THREAD_API_PTHREAD/_LIBCPP_HAS_EXCEPTIONS/_LIBCPP_HAS_LIBRARY_ALIGNED_ALLOCATION 4 个宏，另加 -fPIC——ref: knowledge/drafts/E580-draft-0BA0.kv"
  - "dlopen 跨 .so 边界异常按类型捕获的决定因素是**可执行文件侧 -rdynamic**（导出 __cxa_*/type_info）；模块 .so 不应再链自身运行时，否则两份 type_info 不合并——ref: knowledge/drafts/E580-draft-0BA0.kv"
  - "本平台 test_package 内 conan self.run 有两种失效形态（SIGSEGV 抛出 / list argv 被 /bin/sh 方括号化恒返 127 且不抛异常）；需在 test() 内保留 self.run 以满足 PF3，并回退 Python subprocess 取真实退出码——ref: knowledge/drafts/E580-draft-0BA0.kv"

