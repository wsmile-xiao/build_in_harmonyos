# conandata.yml — libc-abi 22.1.8 (libc++abi, part of the LLVM project)
# R39: 只写官方 URL，镜像由 CI 自动添加（须用单值 url，列表格式会跳过 mirror fallback）
sources:
  url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/llvm-project-22.1.8.src.tar.xz"
  sha256: "922f1817a0df7b1489272d18134ee0087a8b068828f87ac63b9861b1a9965888"

patches:
  - patch_file: "patches/0001-libcxxabi-src-cxa_exception_storage.cpp.patch"
    patch_description: >
      Probe for libc++ 22's renamed <__thread/support.h> and fall back to
      <__threading_support>, which is the header shipped by the libc++ 15
      headers in the OHOS SDK.  Both expose the same std::__libcpp_* TLS API.
    patch_type: "portability"
    sha256: "52f621323f146ecea6f1c2bef2bc6f5b19acdcd03b20ff6541325dbb5f7fcb97"
  - patch_file: "patches/0002-libcxxabi-src-cxa_thread_atexit.cpp.patch"
    patch_description: >
      Same <__thread/support.h> probe for the thread-exit hook implementation.
    patch_type: "portability"
    sha256: "d084a0ac43f1fd4c1604e498cc5832bbc77e9b7422d62016a65ffa489635f837"
  - patch_file: "patches/0003-libcxxabi-src-fallback_malloc.cpp.patch"
    patch_description: >
      Use the SDK's <__threading_support> header and take the aligned
      allocation helpers from <new> (libc++ 15) instead of libc++ 22's
      standalone include/aligned_alloc.h.
    patch_type: "portability"
    sha256: "fa888c0dc4651b478c0fc61c848d2b03a80ab8083b390d9037820d22286b3dca"
  - patch_file: "patches/0004-libcxxabi-src-stdlib_new_delete.cpp.patch"
    patch_description: >
      Include libc++ 22's standalone include/aligned_alloc.h only when the
      libc++ headers really no longer provide __libcpp_aligned_* from <new>;
      with libc++ 15 pulling both in redefines __libcpp_aligned_free.
    patch_type: "portability"
    sha256: "91f95e79ee5d4b5aa1183c2e7055ca314e8b271540cdd7cb27049a53d6102790"
  - patch_file: "patches/0005-libcxxabi-test-test_fallback_malloc.pass.cpp.patch"
    patch_description: >
      Apply the same <__thread/support.h> probe to the upstream test that
      includes a private libc++abi source file, so the test suite builds.
    patch_type: "portability"
    sha256: "79abb82a0a59dd36ac9e41ff4039b4d1c5898991762683c291be5395de0cbe23"
  - patch_file: "patches/0006-libcxx-test-support-concat_macros.h.patch"
    patch_description: >
      Make the libc++ test support header build without <source_location>
      (absent from the SDK's libc++ 15) by guarding the diagnostic
      stream operator instead of making the whole suite unbuildable.
    patch_type: "portability"
    sha256: "fe7f390f717d5a7b3eb6fa4a25d14d2b66d57b831aca66c50753479cae4526f3"
  - patch_file: "patches/0007-libcxx-test-support-make_test_thread.h.patch"
    patch_description: >
      Gate make_test_jthread on __cpp_lib_jthread rather than TEST_STD_VER
      alone, since the SDK's libc++ 15 has no std::jthread even in C++20 mode.
    patch_type: "portability"
    sha256: "f56f5565edc019ba2cfaff85a3548a4ac4920c697f4785b4d0b81489a80e8207"
  - patch_file: "patches/0008-libcxxabi-src-cxa_guard_impl.h.patch"
    patch_description: >
      Same <__thread/support.h> probe for the guard-variable implementation,
      which is where the thread-local abstraction is used on the hot path.
    patch_type: "portability"
    sha256: "5474d29fef52a12f44af3dce7319d53091962be6d8ff9d61a98c1c2da34875ae"
