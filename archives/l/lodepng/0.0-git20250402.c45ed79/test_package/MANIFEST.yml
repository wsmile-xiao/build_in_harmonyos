# 上游测试命令 (等价于 Makefile 的 unittest 目标，不含需 SDL2 的 benchmark/showpng)
upstream_check_command: "c++ -O2 -I. lodepng.cpp lodepng_util.cpp lodepng_unittest.cpp -o lodepng_unittest && ./lodepng_unittest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./lodepng_unittest"

# 上游实际运行的测试程序
upstream_tests:
  - file: lodepng_unittest.cpp
    source: lodepng-c45ed79/lodepng_unittest.cpp
    description: "上游自包含单测二进制：38 个 doMain 测试组（PngSuite 解码/编解码往返/颜色转换/zlib/工具），全部通过打印 test successful"
    command: "./lodepng_unittest"

# test_package 中自带的测试 (消费者视角验证)
# R34: 必须实质调用被测包的 API
test_package_tests:
  - file: test_lodepng.cpp
    description: "消费者测试：版本串校验 + C++ 编码 PNG 签名 + 解码还原尺寸/像素逐字节一致 + error_text 可用 + 截断 PNG 反向对照，共 5 组"
    command: "./test_lodepng"
  - file: conanfile.py
    description: "Conan test() 入口，运行 test_lodepng 并重放包内上游 verdict（缓存命中时仍输出 HMBS_UPSTREAM_TEST_RESULT）"
    command: "conan test test_package"

# 测试断言总数 (test_lodepng.cpp 的 5 组 CHECK，与 HMBS_TEST_PACKAGE_RESULT discovered=5 一致)
# 1. 版本串为 20241228
# 2. encode 返回 0 + PNG 签名正确
# 3. decode 返回 0 + 尺寸 16x16 + 像素逐字节一致
# 4. lodepng_error_text(0) 非空
# 5. 截断 PNG 解码返回非零错误
assertion_count: 5
