# 版本级编译元数据
software: libxml++
version: "5.4.0"
status: built
build_system: meson
compiler: clang 15.0.4
configure_options:
  - "--prefix=/storage/Users/currentUser/usr/local"
  - "--libdir=lib"
  - "--buildtype=release"
build_date: "2026-05-21"

# 依赖信息
dependencies:
  - name: libxml2
    version: "2.15.3"
    type: static
    note: "静态链接 libxml2.a，绕过 HMDFS 动态库权限限制"

# 产物信息
products:
  library:
    - libxml++-5.0.so.1.0.0 (2.26MB)
  headers:
    - libxml++/*.h (42个)
  pkgconfig:
    - libxml++-5.0.pc

# 质量门禁
quality_gates:
  G1_binary_integrity: pass
  G2_functionality: pass
  G3_portability: pass
  G4_archive_integrity: pass
  notes: "G0 干净构建因 Python subprocess 平台限制未能自动执行，已手动验证编译流程完整"

# 技术要点
technical_notes:
  - "静态链接 libxml2.a，不依赖 libxml2.so"
  - "pkg-config 已修改：移除 Requires，添加 Libs.private"
  - "绕过 HMDFS stat permission denied 问题 (E076)"