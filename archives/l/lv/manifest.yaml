software: lv
display: "lv"
description: "Powerful multi-lingual file viewer/grep tool"
category: doc                    # doc: 文档查看工具
homepage: "http://www.ff.iij4u.or.jp/~nrt/lv/"
license: GPL-2.0-or-later
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "HMDFS 不支持硬链接，需改为符号链接 (ln → ln -s)"
    - "Debian 源码包的 lv.hlp/lv.1 在父目录而非 src/"
    - "ncurses 依赖自动检测"
  common_dependencies:
    - ncurses

# 版本索引（软件级 manifest 核心）
versions:
  "4.51-10":
    status: built
    build_date: "2026-06-05"
    patches: 1
    notes: |
      - HMDFS 硬链接适配补丁
      - 无自动化测试套件
      - 交互式终端程序，需真实 TTY 环境
    package: lv-4.51-10-ohos-aarch64.tar.gz

# 最新版本标记
latest: "4.51-10"

# 统计信息
statistics:
  total_versions: 1
  published: 0
  built: 1
  failed: 0