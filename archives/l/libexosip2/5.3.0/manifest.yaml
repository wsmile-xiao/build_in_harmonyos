software: libexosip2
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.3.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# 构建系统类型（G4 必需）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/exosip/libexosip2-5.3.0.tar.gz"

  # 源码校验和
  sha256: "5b7823986431ea5cedc9f095d6964ace966f093b2ae7d0b08404788bfcebc9c2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"
  - "0002-scripts-config.guess.patch"
  - "0003-scripts-config.sub.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E072: 旧版(2014) config.guess 不含 HarmonyOS 支持，需替换为 2023 版本"
  - "E011: HMDFS UID 映射导致 umask 077 创建的目录不可写，需改为 umask 022"
  - "R18: libosip2 依赖通过预编译包安装优先于手动编译"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libexosip2-5.3.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libexosip2-5.3.0.work
  source_orig_hash: 6d5abd434172dd1f
  source_work_hash: de83e17fb69091f0
  generated_at: '2026-06-03T10:23:11'
  patches_count: 3

patch_classification:
  - file: 0001-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-scripts-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-scripts-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
