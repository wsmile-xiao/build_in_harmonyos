# 版本级 manifest — libnl3 3.12.0
# 文件位置: archives/l/libnl3/3.12.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0
# 状态说明：status 由 finish/W3 验证后回填；未经 finish 禁填 published。
#           本文件记录探索编译阶段的事实，首轮 status=built 待真机验证。

# ============================================================
# 必须字段
# ============================================================

version: "3.12.0"

software: libnl3

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游官方 GitHub Release 归档（tag libnl3_12_0，2025-12-04）
  url: "https://github.com/thom311/libnl/releases/download/libnl3_12_0/libnl-3.12.0.tar.gz"

  # 与官方同批发布的 libnl-3.12.0.tar.gz.sha256sum 资产及 Debian dsc 交叉一致
  sha256: "fc51ca7196f1a3f5fdf6ffd3864b50f4f9c02333be28be4eeca057e103c0dd18"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # 本包显式传入的 configure 选项（AutotoolsToolchain 另行注入
  # --prefix/--libdir/--includedir 等 Conan 标准项）。
  #
  # G0 约束：列表项之后不得写行内 `#` 注释；首项必须是最关键的一项。
  # 选项释义: --disable-cli → CLI 依赖 netlink 内核交互，OHOS 用户态不可用，纯库交付
  configure_options:
    - "--disable-cli"
    - "--enable-static"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  # 本包无 host 依赖：R36 无适用对象；构建期 tool_requires pkgconf/3.0.5、
  # flex/2.6.4.2、bison/3.8.2、m4/1.4.19（真机无系统 pkg-config/flex/bison，
  # configure 缺失即硬失败；m4 显式声明以便 M4 可用性探测与覆盖）及
  # check/0.15.2（上游 TESTS 经 libcheck 运行，configure 以
  # PKG_CHECK_MODULES 探测，缺失仅 WARN；为在真机真实执行 make check 而补齐，
  # 不得包装成 gaps 豁免）。release dist tarball 已含预生成 configure /
  # Makefile.in，无需 automake/autoconf 自举。
  # 上游可选测试依赖 check>=0.9.0 已由 tool_requires 补齐；c-list 自检缺
  # meson/ninja 时自动 skip，不引入硬依赖。
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
  # 零静态补丁配方：E205（config.guess/config.sub）与 E091/E119（build-headers-test
  # 漏 -I linux-private）均由 build() 运行时容错修补覆盖。3.12.0 基线漂移致静态
  # 0001（config.guess:191 失配/config.sub 判异）与 0002（Makefile.in 判异）先后
  # 失败，故删除全部静态补丁。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "CONFIG_SHELL 真凶：profile 写死 /data/service/hnp/bin/bash 但真机不存在（xz/5.8.3.2 同款实测结论）；3.12.0 configure:132 exec 重执行即 Error 127。generate() 用 Environment 指到实存 shell（which bash→/bin/sh→/system/bin/sh + 试运行校验），build() 批量改写生成脚本坏前缀并直写 os.environ 双保险"
  - "config.sub 出厂已支持 ohos：官网 tarball（sha256 已验）的 config.sub 自带 `| ohos*`（OS 表）与 `| linux-ohos*-`（kernel 校验）；运行时修补的 OS 表/核表示步骤带星号守卫后正确跳过，仅补 ohos-linux 别名与 config.guess 侧。triplet 全链路已推演：linux-ohos→kernel=linux/os=ohos→双表命中"
  - "3.12.0 上游增量：libnl-route-3.sym 新增 68 符号（nexthop/nh encap、ip6tnl collect-metadata），向后兼容；tests 新增 cksuite-link-ip6tnl/cksuite-route-nexthop/cksuite-route-nh，test-create-ip6tnl 从 check_PROGRAMS 移除改由 cksuite 覆盖；TESTS 仍为 check-all + check-direct 共 2 项"
  - "tools/check-c-list.sh 在缺 meson/ninja 时 exit 0 skip，不引入硬依赖；check 仍为可选项"

knowledge_ref:
  - "knowledge/graph/E205.kv"
  - "knowledge/graph/E114.kv"
  - "knowledge/graph/E490.kv"
  - "knowledge/graph/E091.kv"
  - "knowledge/graph/E119.kv"
  - "knowledge/graph/E051.kv"
  - "knowledge/graph/E231.kv"
  - "knowledge/graph/E265.kv"
  - "knowledge/graph/E323.kv"
  - "knowledge/graph/E424.kv"
