# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (ci/conan/build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libnl3/3.12.0

homepage: "https://github.com/thom311/libnl"

# 上游测试命令
# 顶层 Makefile.am 定义 `TESTS =` + 末尾 `TESTS += $(check_programs)`，
# 而 `check_programs` 只被 `+= tests/check-all` 与 `+= tests/check-direct`
# 追加 —— 即上游有意只把这两个 libcheck 程序挂进 TESTS；其余 check_PROGRAMS
# `make check` 只构建、不自动运行（它们需要 root + NET_ADMIN 真机 netlink 环境）。
# 3.12.0 增量：check-all 新增 cksuite-link-ip6tnl / cksuite-route-nexthop /
# cksuite-route-nh；test-create-ip6tnl 从 check_PROGRAMS 移除改由 cksuite 覆盖；
# 新增 check-local-c-list（tools/check-c-list.sh，缺 meson/ninja 时自动 skip）。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# HMBS 真机门禁口径：TESTS 变量展开共 2 项（autotools_tests 口径）
upstream_test_total: 2
upstream_test_count_method: autotools_tests

# 上游实际运行的测试程序（TESTS 变量展开：共 2 个）
upstream_tests:
  - name: "check-all"
    file: "tests/check-all.c"
    description: >-
      libcheck 主套件，链接 tests/libnl-test-util.la。3.12.0 启用 suite：
      main、Abstract addresses、Netlink attributes、Clone ematch tree、
      netns，新增 link-ip6tnl、route-nexthop、route-nh 三个 cksuite。
      3.11.0 实测 Checks: 31 / Failures: 0 / Errors: 19（环境 seccomp 拦截
      unshare 建 netns，SIGSYS）；3.12.0 断言数增加，以真机实测为准。
    source_dir: "tests"
    expected_assertions: 31
  - name: "check-direct"
    file: "tests/check-direct.c"
    description: >-
      --enable-static 时才编译，以 -static 全静态链接，验证静态归档下
      符号解析与 vlan attribute 布局。3.11.0 实测 Checks: 2 / 100% 通过。
    source_dir: "tests"
    expected_assertions: 2

# 上游 check_PROGRAMS 中未纳入 TESTS 的程序（适配期手工逐个运行留证）
# 3.12.0 共 26 个：test-complex-HTB-with-hash-filters、test-create-bond、
#   test-create-bridge、test-create-geneve、test-create-ifb、test-create-ipgre、
#   test-create-ipgretap、test-create-ipip、test-create-ipvlan、
#   test-create-ipvti、test-create-macsec、test-create-macvlan、
#   test-create-macvtap、test-create-sit、test-create-veth、test-create-vlan、
#   test-create-vrf、test-create-vxlan、test-create-xfrmi、test-delete-link、
#   test-loopback-up-down、test-socket-creation、test-u32-filter-with-actions
#   + test-cache-mngr、test-genl、test-nf-cache-mngr。
# 3.11.0 实测：test-socket-creation 通过；其余因执行域特权限制（seccomp SIGSYS /
# 鸿蒙 LSM adhoc_bin 域无 AF_NETLINK bind 权限）无法运行，属环境限制。
unupstream_run_programs_count: 26

# 上游测试程序总量（检视统计口径）：28 = check_PROGRAMS 26 + TESTS 2 去重后。
# check-all、check-direct 同时位于 TESTS 与 check_PROGRAMS 两表。
total_upstream_programs_count_review: 28

# test_package 自带测试（消费者视角：编译 + 链接 + 运行时断言）
test_package_tests:
  - file: test_libnl.c
    description: >-
      以 CMake 消费者身份链接 libnl3::nl-3 / nl-route-3 / nl-genl-3 / nl-nf-3 /
      nl-idiag-3 / nl-xfrm-3 六个组件，运行时执行 7 组真实断言（非空跑）：
      LIBNL_VERSION 字面量、nl_af2str/nl_str2af 往返、nl_socket_alloc/free、
      nl_rtntype2str、idiagnl_state2str、nfnl_ct_alloc/put、
      genl_op2name/xfrmnl_ae_flags2str 符号可解析。
      进程返回 failures == 0 ? 0 : 1，test() 用 self.run() 真实校验退出码。
    command: "test_libnl"

# 测试断言总数（上游 TESTS 断言以真机实测为准，此处为 3.11.0 基线 + test_package 7 组）
assertion_count: 40
