# conandata.yml — libjwt2 2.1.3
# 官方 tag v2.1.3；SHA-256 由 GitHub 归档实测（2026-09-15，curl -k 直连与 gh-proxy 一致）。

sources:
  url: "https://github.com/benmcollins/libjwt/archive/refs/tags/v2.1.3.tar.gz"
  sha256: "ea13f42713edd113e65c05f9601ba25383f89b34a644b64f30ee0ecbf282dc83"
# jansson vendored source for offline FetchContent override.
# Upstream libjwt/libjwt/CMakeLists.txt declares
#   FetchContent_Declare(jansson GIT_REPOSITORY https://github.com/akheron/jansson.git GIT_TAG v2.14)
# and the true machine cannot `git clone github.com` (65s timeout x3 retries).
# source() pre-downloads this tarball (same URL/sha256 as archives/j/jansson/2.14)
# and generate() points FETCHCONTENT_SOURCE_DIR_JANSSON at it, so
# FetchContent_MakeAvailable() reuses the local copy with zero network access.
jansson:
  url: "https://github.com/akheron/jansson/archive/refs/tags/v2.14.tar.gz"
  sha256: "c739578bf6b764aa0752db9a2fdadcfe921c78f1228c7ec0bb47fa804c55d17b"
# No conandata patches: tests/jwt_tests.h config.h guard is done via
# replace_in_file in build() (patch route dropped after true-machine
# "extra lines for hunk no.1" parse failure).
