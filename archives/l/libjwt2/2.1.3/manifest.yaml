# 版本级 manifest — libjwt2 2.1.3

version: "2.1.3"
software: "libjwt2"

status: built
build_date: "2026-09-15"
build_system: "cmake"
conan_ref: "libjwt2/2.1.3"

source:
  url: "https://github.com/benmcollins/libjwt/archive/refs/tags/v2.1.3.tar.gz"
  sha256: "ea13f42713edd113e65c05f9601ba25383f89b34a644b64f30ee0ecbf282dc83"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_TESTS=ON"
    - "-DUSE_INSTALLED_JANSSON=OFF"
    - "-DENABLE_PIC=OFF"
  dependencies:
    - openssl/3.5.6.1
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "v2 分支库目标名为 jwt，包名用 libjwt2 与 3.x 并存"
  - "Jansson 用 USE_INSTALLED_JANSSON=OFF 经 FetchContent 内嵌"
  - "上游 12 个 Check 单测经 BUILD_TESTS=ON 以 ctest 执行（CMake 原生注册 8 项 + 配方补注册 jwt_rsa_pss/jwt_eddsa/jwt_crypto/jwt_es256k）"
