# test_package/MANIFEST.yml — libjwt2 2.1.3
# 上游官方测试声明文件

package: libjwt2/2.1.3
homepage: "https://github.com/benmcollins/libjwt"

# 上游测试命令（conanfile.py build() 中已集成 ctest）
upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试（tests/Makefile.am TESTS，共 12 个 ctest 二进制，Check 框架；
# 各二进制内含多个 Check 用例，tcase 注册合计 110：
# jwt_new 25 / jwt_validate 16 / jwt_rsa 14 / jwt_ec 12 / jwt_encode 9 /
# jwt_grant 7 / jwt_header 7 / jwt_rsa_pss 7 / jwt_dump 6 / jwt_eddsa 3 /
# jwt_es256k 3 / jwt_crypto 1；CMake 原生只注册其中 8 个二进制，
# 另 4 个由配方 build() 补注册后同跑 ctest）
upstream_test_total: 110
upstream_test_count_method: auto
upstream_test_passed: 110
upstream_test_failed: 0
upstream_test_skipped: 0
upstream_tests_exist: true
upstream_test_audit: "tests/Makefile.am TESTS=12 (jwt_new/jwt_grant/jwt_header/jwt_dump/jwt_encode/jwt_rsa/jwt_ec/jwt_validate/jwt_rsa_pss/jwt_eddsa/jwt_crypto/jwt_es256k); 各 tests/*.c 经 tcase_add_test/tcase_add_loop_test 注册的 Check 用例合计 110；PR 正文与 marker 均按 110 声明，ctest 二进制数 12 仅为执行载体"
upstream_tests:
  - file: tests/jwt_dump.c
    source: libjwt-2.1.3/tests/jwt_dump.c
    description: "dump/parse round-trip（Check 单测）"
    command: "./jwt_dump"
  - file: tests/jwt_ec.c
    source: libjwt-2.1.3/tests/jwt_ec.c
    description: "EC 签名校验（Check 单测）"
    command: "./jwt_ec"
  - file: tests/jwt_encode.c
    source: libjwt-2.1.3/tests/jwt_encode.c
    description: "编码/头部断言（Check 单测）"
    command: "./jwt_encode"
  - file: tests/jwt_grant.c
    source: libjwt-2.1.3/tests/jwt_grant.c
    description: "grant 增删查（Check 单测）"
    command: "./jwt_grant"
  - file: tests/jwt_header.c
    source: libjwt-2.1.3/tests/jwt_header.c
    description: "头部 alg/typ 断言（Check 单测）"
    command: "./jwt_header"
  - file: tests/jwt_new.c
    source: libjwt-2.1.3/tests/jwt_new.c
    description: "新建/释放与错误路径（Check 单测）"
    command: "./jwt_new"
  - file: tests/jwt_rsa.c
    source: libjwt-2.1.3/tests/jwt_rsa.c
    description: "RSA 签名校验（Check 单测）"
    command: "./jwt_rsa"
  - file: tests/jwt_validate.c
    source: libjwt-2.1.3/tests/jwt_validate.c
    description: "过期/签发校验（Check 单测）"
    command: "./jwt_validate"
  - file: tests/jwt_rsa_pss.c
    source: libjwt-2.1.3/tests/jwt_rsa_pss.c
    description: "RSA-PSS 签名校验（Check 单测；autotools TESTS 有、CMake 原生未注册，配方补注册）"
    command: "./jwt_rsa_pss"
  - file: tests/jwt_eddsa.c
    source: libjwt-2.1.3/tests/jwt_eddsa.c
    description: "EdDSA 签名校验（Check 单测；autotools TESTS 有、CMake 原生未注册，配方补注册）"
    command: "./jwt_eddsa"
  - file: tests/jwt_crypto.c
    source: libjwt-2.1.3/tests/jwt_crypto.c
    description: "crypto 后端切换（Check 单测；autotools TESTS 有、CMake 原生未注册，配方补注册）"
    command: "./jwt_crypto"
  - file: tests/jwt_es256k.c
    source: libjwt-2.1.3/tests/jwt_es256k.c
    description: "secp256k1 签名校验（Check 单测；autotools TESTS 有、CMake 原生未注册，配方补注册）"
    command: "./jwt_es256k"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：HS256 编码出 3 段 token + 解码 grant 回环"
    command: "./test_libjwt2"

# 测试断言总数（消费者 2 + 上游 110 Check 用例；执行载体为 12 个 ctest 二进制）
assertion_count: 112
