software: libgtop-tools
version: "2.41.3"
status: published
build_date: "2026-09-19"
build_system: autotools

source:
  url: "https://download.gnome.org/sources/libgtop/2.41/libgtop-2.41.3.tar.xz"
  sha256: "775676df958e2ea2452f7568f28b2ea581063d312773dd5c0b7624c1b9b2da8c"
  tar_format: tar.xz

build:
  system: autotools
  cc: clang
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"

patches_applied:
  - "0001-configure-umask-022.patch: Use umask 022 for config.status tmp dir (setgid hmdfs makes umask 077 dirs unwritable)"
  - "0002-mountlist-proc-self-mounts.patch: Fall back to /proc/self/mounts when /etc/mtab is absent (OHOS/containers have no mtab)"

dependencies:
  - "glib/2.84.0.1"

upstream_tests:
  command: "make check"
  test_count: 0
  notes: "libgtop 2.41.3 官方源码无独立测试套件（与 libgtop 库包适配清点结论一致）；examples/ 19 个 noinst_PROGRAMS 为 API 自检示例，不随 install 安装。"

test_package:
  assertion_count: 3
  description: "消费者测试（daemon/server 二进制存在且可执行，2 断言）+ 实际执行 libgtop_daemon2 --help（GOption 路径 exit 0）"
