# test_package/MANIFEST.yml
# Test declaration for libgtop-tools Conan L1 consumer verification.

package: libgtop-tools/2.41.3
homepage: "https://gitlab.gnome.org/GNOME/libgtop"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
# Note: libgtop 2.41.3 官方源码无独立测试套件（与 libgtop 库包适配时清点
# 结论一致：make check 无注册测试，examples/ 19 个 noinst_PROGRAMS 为
# API 自检示例，不随 install 安装）。

test_package_tests:
  - file: conanfile.py
    description: "Consumer test: verify libgtop_daemon2/libgtop_server2 exist and are executable, then actually run libgtop_daemon2 --help (exit 0); libgtop_server2 is executed with outcome recorded (upstream setuid design: setreuid is seccomp-blocked for non-root on OHOS, Signal 31)"
    command: "conan test_package verifies binary existence and real execution"

assertion_count: 3
