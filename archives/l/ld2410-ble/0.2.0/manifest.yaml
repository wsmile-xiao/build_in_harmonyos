# 版本级 manifest — ld2410-ble 0.2.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.2.0"
software: "ld2410-ble"

# 编译状态（R29：conan_verify 通过后才可标 published）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GitHub 官方 tag archive，含上游 tests/ 目录；PyPI sdist 不含测试）
  url: "https://github.com/930913/ld2410-ble/archive/refs/tags/v0.2.0.tar.gz"
  # 源码校验和
  sha256: "9ce32580ee9ecfec65f644e879d73eca045b2c667182c54f7286573673990e73"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 纯 Python 包（poetry-core / src 布局），无 configure/make 步骤，
  # 安装路径为 pip install . --prefix=<stage>，故标为 custom
  system: custom

  # 配置选项列表（纯 Python 无编译期选项）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # 本包为纯 Python，刻意不引入任何 C/C++ 编译依赖。
  # 运行时 Python 依赖 bleak / bleak-retry-connector / async-timeout 未发布为
  # conan 配方（async-timeout/5.0.1 已发布，但同组依赖 non-uniform 会拆成两条
  # 解析路径），统一由 pip 从配置的 pypi.cnb.cool 镜像解析（airthings-ble /
  # aiven-client 先例）。
  dependencies: []

  # 编译器（纯 Python 不涉及编译，随 OHOS profile 填充以过 L0 settings 完整性门禁）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（上游源码零修改）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PyPI sdist 不含 tests/ 目录，为接入上游 pytest 套件须使用 GitHub 官方 tag archive 作为源码；sha256 需分别核验两个归档（见 conandata.yml：GitHub 9ce3258… 采用 / PyPI 25046e1… 未采用）；ref: E466（Python 包 sdist 提取/源码布局陷阱）"
  - "纯 Python 库运行时依赖未发布为 conan 配方时，由 pip install . 从 pypi.cnb.cool 镜像自动解析（airthings-ble / aiven-client 先例）；参考 archives/a/airthings-ble/1.2.0；knowledge_ref: E512（纯 Python 包 CI 干净环境缺依赖导致 local pass / CI fail）"
  - "OHOS 平台 platform.system() 返回 'HarmonyOS'，而 bleak 仅接受 'Linux'（bleak.backends.get_default_backend() 抛 BleakError: Unsupported platform: HarmonyOS）——BLE 数据解码面可用，但默认 BLE 传输后端在 HarmonyOS 上不可解析，属平台缺口；knowledge_ref: E090（平台检测 harmonyos/linux 不一致类问题的 sed 替换处置）"
  - "bleak 的 dbus-fast 依赖携带 wheel marker platform_system == 'Linux'，在 HarmonyOS 上为 false，pip 跳过安装 dbus-fast；镜像虽提供 dbus_fast-*-ohos_aarch64.whl，但其 tag(ohos_aarch64) 与本机 pip tag(harmonyos_aarch64) 不匹配，无法经 marker 路径安装；reference: E319（python 包 noarch wheel / site-packages / PYTHONPATH 安装口径）"
  - "纯 Python 包配 settings 需四项齐全（os/arch/compiler/build_type）方过 CI L0 settings 完整性门禁；compiler/build_type 对 pip 安装为惰性字段（platformdirs / airthings-ble / aiven-client 惯例）；ref: E319"
  - "refresh-patch --auto 在无编辑追踪器时回退排除规则扫描，比对 .work 与 .orig；.orig 基线若被 init-build 嵌套目录探测缺陷（F068）破坏，逐字节一致的工作树也会被判为『新增文件』而产出 9 个 add-file 幻影补丁，G0 应用即 FAILED；判据=diff -rq orig work 无输出却仍有补丁；处置=重建干净基线 + 清空 patches/，禁止手改 hunk；ref: E585（本任务新知识草稿）"
  - "zsh 的 here-document 走 TMPPREFIX（默认 /tmp/zsh）而非 TMPDIR；鸿蒙 PC worker 的 /tmp 是只读 erofs 挂载，故 ci/conan/build_and_test.sh 内含 heredoc 的 L0 门禁会假失败（can't create temp file for here document: read-only file system），表现为 python 能跑、zsh 脚本挂；处置=export TMPPREFIX=<可写目录> 后再跑 finish/submit（workflow_checks._run 复制 os.environ 可穿透），禁止 remount /tmp；ref: E586（本任务新知识草稿）"

