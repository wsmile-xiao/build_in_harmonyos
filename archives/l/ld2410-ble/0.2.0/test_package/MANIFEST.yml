# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ld2410-ble/0.2.0
homepage: "https://github.com/930913/ld2410-ble"

# 上游测试命令 — ld2410-ble 上游使用 pytest 套件
upstream_check_command: "python3 -m pytest tests/"

# 上游测试在 test_package/conanfile.py 的 test() 中执行并输出
# HMBS_UPSTREAM_TEST_RESULT 标记（真机预检每轮必跑 test_package）。
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest test_package/tests/ -q --no-header -o addopts= -p no:cacheprovider"

# 上游实际运行的测试程序（2026-09-25 实测记录）：
# PyPI 官方 sdist（ld2410_ble-0.2.0-py3-none-any.whl / .tar.gz）只含
# src/ld2410_ble/ 与打包元数据，不含 tests/ 目录；GitHub 官方 tag archive
# v0.2.0 含完整 tests/。因此源码采用 GitHub 官方 tag archive
# （sha256=9ce32580ee9ecfec65f644e879d73eca045b2c667182c54f7286573673990e73，
# 已在 conandata.yml 中核验）。上游 tests/ 原样复制进 test_package/tests/，
# 未做任何修改，由 test_package 的 test() 运行。
upstream_tests:
  - file: tests/test_init.py
    source: ld2410-ble-0.2.0/tests/test_init.py
    description: "上游唯一测试用例：import ld2410_ble 并断言包可导入（test_add）"
    command: "python3 -m pytest test_package/tests/test_init.py"

# test_package 中自带的测试（消费者视角验证，纯 Python 库用 Python 脚本）
test_package_tests:
  - file: test_ld2410_ble.py
    description: "消费者测试（L0c）：真实 API（R34）——LD2410B/C 帧解析（目标状态位/移动与静止距离能量/探测距离）、工程模式能量门（8 门）、回调查询与注销、分包缓冲重组、little-endian intify、常量线序契约，无需 BLE 硬件"
    command: "python3 test_ld2410_ble.py <site-packages-dir>"
  - file: test_ld2410_ble_ohos.py
    description: "鸿蒙特有测试：OHOS 运行时契约——platform.system()==HarmonyOS、sys.platform 属 OHOS 族（linux|ohos，设备构建报 linux、CI worker 构建报 ohos）、aarch64 little-endian 解码正确性、包内无原生扩展（纯 Python 免 OHOS 原生工具链）、运行期依赖导入完整性、bleak 在 HarmonyOS 上 backend 不可解析的平台缺口探测（接受 Linux/OHOS 双结果）"
    command: "python3 test_ld2410_ble_ohos.py <site-packages-dir>"

# 测试断言总数（近似值, 用于质量评估）
# 上游 1 + 新增消费者 43 + 新增鸿蒙特有 20 = 64
assertion_count: 64
