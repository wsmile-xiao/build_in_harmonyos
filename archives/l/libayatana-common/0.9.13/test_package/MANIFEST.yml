# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源: tests/CMakeLists.txt
#   - add_test(TstUtils tst_utils)      -> tests/tst_utils.cpp (GTest/GMock)
#   - add_test(TstUtilsVala ...)        -> tests/tst_utils.vala (Vala + GObjectIntrospection)
# 两个测试都依赖 GMock/GTest 与 Vala 工具链，OHOS 环境不可用，故本配方
# ENABLE_TESTS=OFF，不在 conan create 中运行上游测试（MANIFEST 如实声明）。

package: libayatana-common/0.9.13
homepage: "https://github.com/AyatanaIndicators/libayatana-common"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tst_utils.cpp
    source: libayatana-common-0.9.13/tests/tst_utils.cpp
    description: "GTest 单元测试：桌面会话检测 is_lomiri/is_ubuntutouch/is_gnome/is_unity/is_mate/is_xfce/is_pantheon/is_budgie + ellipsize 字符串截断"
    command: "./tst_utils"
  - file: tests/tst_utils.vala
    source: libayatana-common-0.9.13/tests/tst_utils.vala
    description: "Vala 测试：同一组桌面会话检测 + ellipsize（需 Vala 编译器 + GObjectIntrospection）"
    command: "./tst_utils_vala"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：链接 libayatana-common 并调用 ayatana_common_utils_is_lomiri() 验证库 API 与 glib 依赖链可用"
    command: "./test_libayatana-common"

# 测试断言总数 (近似值, 用于质量评估)
# tst_utils.cpp: 33 (isLomiri 4 + isUbuntuTouch 4 + isGnome 4 + isUnity 4 +
#   isMate 4 + isXfce 4 + isPantheon 2 + isBudgie 4 + ellipsize 3)
# tst_utils.vala: 34 (args 1 + isLomiri 4 + isUbuntutouch 4 + isGnome 4 +
#   isUnity 4 + isMate 4 + isXfce 4 + isPantheon 2 + isBudgie 4 + ellipsize 3)
assertion_count: 67
