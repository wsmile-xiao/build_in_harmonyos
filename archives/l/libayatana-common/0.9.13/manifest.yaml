software: libayatana-common
version: "0.9.13"
status: published
build_date: "2026-08-26"
build_system: cmake
issue: ""

source:
  url: "https://github.com/AyatanaIndicators/libayatana-common/archive/refs/tags/0.9.13.tar.gz"
  sha256: "4eda83a71a0deb49562b02e10a4a7da53608ccfff4e5a79aec4cc3b270a4e19b"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF (src/CMakeLists.txt 目标名 ayatana-common 固定 SHARED)"
    - "ENABLE_TESTS=OFF"
    - "ENABLE_WERROR=OFF"
    - "ENABLE_LOMIRI_FEATURES=OFF"
    - "SKIP_DATA_PO=ON (OHOS 无 GSettings/Intltool CMake 模块，0001 补丁增加该选项跳过 data/ po/ 子目录)"
  dependencies:
    - "glib/2.88.0.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-skip-data-po-subdirs.patch"
  - "0002-soname-link-flag.patch"
  - "0003-link-deps-library-dirs.patch"

artifacts:
  libraries:
    - "lib/libayatana-common.so*"
  headers:
    - "include/ayatana/common"
  pkg_config:
    - "lib/pkgconfig/libayatana-common.pc"

validation:
  local:
    py_compile: passed
    diff_check: passed
    conan_create: passed
    conan_verify: passed
    reason: "conan-verify 8 道门禁全 PASS（G0-G4 + L2/L4/L5），.conan-verified 已生成；纯库无命令行工具，无需 commands.json"
  ohos:
    conan_create: pending_ci
    reason: "本地已验证；官方 CI 需最终确认。"
