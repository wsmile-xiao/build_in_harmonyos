  sha256: "49fce66107de4f90698311c799f2a7ebd02bf6e913b189ac765e496007ca5a61"

patches:
  "0.9.11":
    - patch_file: "patches/0001-skip-data-po-subdirs.patch"
      patch_description: "CMakeLists: add SKIP_DATA_PO option to skip data/ and po/ subdirectories (HarmonyOS lacks GSettings/Intltool CMake modules) — 借鉴 0.9.13"
      patch_type: "cmake"
    - patch_file: "patches/0002-soname-link-flag.patch"
      patch_description: "src/CMakeLists.txt: ①补 target_link_directories(${DEPS_LIBRARY_DIRS})——glib 静态库时 pkg_check_modules 缺 -L 导致 CI ld.lld unable to find library；②LINK_FLAGS -Wl,-soname,libayatana-common.so——SOVERSION=0 时 CMake 不生成 DT_SONAME，W3 L5 门禁要求共享库带 SONAME（借鉴 0.9.13）"
      patch_type: "cmake"
    - patch_file: "patches/0003-fix-tests-target.patch"
      patch_description: "tests/CMakeLists.txt: tst_utils_vala 的 add_dependencies 引用不存在的 target \"src\"（实际库目标名为 ayatana-common），修复使 ENABLE_TESTS=ON 可编译（rule 4 整改：开启上游 gtest 测试）"
      patch_type: "cmake"
    - patch_file: "patches/0004-fix-tests-schema-dep.patch"
      patch_description: "tests/CMakeLists.txt: gschemas.compiled 依赖路径从构建目录改为源码目录（SKIP_DATA_PO=ON 跳过 data/ 子目录导致构建目录无 gschema.xml，使 gtest ellipsize 用例可编译运行）"
      patch_type: "cmake"
    - patch_file: "patches/0005-fix-tests-schema-exec.patch"
      patch_description: "tests/CMakeLists.txt: COMPILE_SCHEMA_EXECUTABLE 仅当未注入时才 pkg-config 查询——OHOS conan 环境 pkg-config 查 glib_compile_schemas 不可靠（PKG_CONFIG_PATH 指向 glib 原始 .pc 的 prefix=/ 返回 //bin/ 错误路径；generators .pc 缺该变量返回空），由配方注入 glib 包 bin/glib-compile-schemas 绝对路径"
      patch_type: "cmake"
    - patch_file: "patches/0006-disable-vala-add-gtest-include.patch"
      patch_description: "tests/CMakeLists.txt: ①tst_utils 加 ${DEPS_INCLUDE_DIRS}（含 gtest/gmock 头路径，修复 gtest/gtest.h not found）；②禁用 tst_utils.c/tst_utils_vala 的 vala 段（OHOS 无 valac 运行链，gtest 测试 tst_utils.cpp 已覆盖 rule 4 目标）"
      patch_type: "cmake"
