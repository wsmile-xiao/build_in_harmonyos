# test_package/MANIFEST.yml — libayatana-common 0.9.11
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: libayatana-common/0.9.11
homepage: "https://github.com/AyatanaIndicators/libayatana-common"

# 上游测试：tests/ 下 tst_utils.cpp gtest 注册 9 个用例（TEST_F：isLomiri/
# isUbuntuTouch/isGnome/isUnity/isMate/isXfce/isPantheon/isBudgie + ellipsize，
# 注册 2 个 CTest 项：TstUtils + TstUtilsVala）；rule 4 整改后开启
# ENABLE_TESTS=ON 实测运行 9/9 = 100% 通过（详见 notes.md/manifest.yaml）。
upstream_check_command: "ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - count: 9
    kind: gtest
    note: "tests/ tst_utils.cpp gtest TEST_F 用例（isLomiri/isUbuntuTouch/isGnome/isUnity/isMate/isXfce/isPantheon/isBudgie + ellipsize）；rule 4 整改：ENABLE_TESTS=ON + gtest/gmock 依赖 + 0003/0004 构建修复，OHOS 实测 9/9 = 100% 通过"

# test_package 消费者测试（R34 真实产物 + API 调用：CMake 编译 test.c，
# 调 is_lomiri 三场景；借鉴 0.9.13）
test_package_tests:
  - file: test.c
    description: "CMake 编译 test.c 链接 libayatana-common::libayatana-common，运行 test_libayatana-common 验证 is_lomiri() 三场景（无桌面→FALSE / Lomiri→TRUE / GNOME→FALSE）"
    command: "conan create 内自动执行（CMake build + run test_libayatana-common）"

# 断言总数：3（is_lomiri 三场景）
assertion_count: 3
