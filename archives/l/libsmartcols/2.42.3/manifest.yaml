software: libsmartcols
version: "2.42.3"
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://mirrors.edge.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.3.tar.xz"
  sha256: "66ac7c0e725278eb2b039e3104f2c91119341d941b41bac7a285c695f940bd57"
  tar_format: tar.xz
  upstream_tag: v2.42.3
  source_note: "util-linux 2.42.3 源码树（libsmartcols 子目录构建——同 util-linux 系其他 lib 件取源法）"

build:
  configure_options:
    - "--disable-all-programs"
    - "--enable-libsmartcols"
    - "--enable-libuuid"
    - "--disable-libblkid --disable-libmount --disable-libfdisk"
    - "--disable-pam --disable-libudev --disable-nls"
  dependencies:
    - "libuuid/2.40.4"
  cc: clang
  cxx: clang++

patches_applied: []

artifacts:
  - lib/libsmartcols.a
  - include/libsmartcols.h
  - lib/pkgconfig/smartcols.pc

knowledge_gained:
  - "libsmartcols 2.42.3 从 util-linux 源码树独立构建：--disable-all-programs + --enable-libsmartcols（同 util-linux/2.42 libblkid/libuuid/libmount 三件套模式）"
  - "libsmartcols 内部依赖 libcommon.la（util-linux 内部库，同树构建自动解决）"
  - "打包时需剔除同树构建的 libuuid 产物（uuid 归 libuuid/2.40.4 包管）"
