manifest:
  version: "3.0.61"
  status: built  # 真机 conan create 退出码 0（见 notes.md 与 PR 正文的日志证据）
  upstream:
    name: "lifelines"
    homepage: "https://lifelines.github.io/lifelines/"
    source: "https://codeload.github.com/lifelines/lifelines/tar.gz/refs/tags/3.0.61"
    sha256: "9eb469bca4123f1edd7e23162175bb426fa2f954aee8f113fa938957bc585e73"
    license: "MIT"
    build_system: "autotools"  # tag 归档未附生成件，配方自带 aclocal/autoheader/automake/autoconf 引导
    test_cases:
      count: 8  # reports/st selftest 的 golden-file 比对次数（harness 层是 TESTS = selftest 1 项）
      description: "reports/st/Makefile.am：test_iter 对 6 份 .ref 比对 + st_all 对 st_all.ref/st_all_stdout.ref 比对；取数 `ls reports/st/*.ref | wc -l` = 8"
      upstream_pass_rate: "5/8（62.5%）"  # 3 项不可达，逐条技术原因见 notes.md 与 PR 正文
    adapted_test_cases:
      count: 23
      description: "test_package/check_lifelines.py：已安装包 bin/llines + bin/llexec 的版本横幅、GEDCOM→数据库（含 4 个库成员）、两份消费者自写报告的内容断言、三条负向路径"
      pass_rate: "100%"  # 23/23
  adaptation:
    target: "OHOS aarch64"
    recipe: "conanfile.py"
    patches:
      - "patches/0001-src-stdlib-environ.c.patch"
      - "patches/0002-configure.ac.patch"
      - "patches/0003-Makefile.am.patch"
      - "patches/0004-reports-st-Makefile.am.patch"
      - "patches/0005-build-autotools-config.sub.patch"
    dependencies:
      - "ncurses/6.6"
    tool_dependencies:
      - "perl/5.42.2"
      - "autoconf/2.72"
      - "automake/1.18"
      - "libtool/2.5.4"
      - "m4/1.4.19"
      - "bison/2.7"
    notes: >-
      LifeLines 是家谱数据系统：GEDCOM 库 + curses 前端 llines + 自语言报告批处理 llexec，
      运行期只依赖 ncurses。tag 归档没有 configure/Makefile.in（官方 release 资产只到 3.1.1），
      故配方在 build() 里真跑 autotools 引导；bison 必须用 2.7（yacc.y 是旧式 %pure_parser）。
      产物含 bin/ 可执行文件，按 L0k/R38 在软件级目录给 commands.json。
      真机四个坑（设备 profile 的 PATH 不含 /usr/bin、制品仓 perl 与宿主 perl 的 @INC/XS 冲突、
      制品仓 automake 包装脚本 shebang 指向 worker 才有的 /data/service/hnp/bin/perl、
      HMDFS 上 umask 077 + mktemp 自建目录写不进）的实测取证与修法见 notes.md。
