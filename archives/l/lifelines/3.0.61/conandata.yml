# conandata.yml — lifelines 3.0.61
#
# Source: upstream git tag "3.0.61" of https://github.com/lifelines/lifelines
# Both URLs below were downloaded and compared byte-for-byte on 2026-10-03
# (local + HarmonyOS device), sha256 identical:
#   9eb469bca4123f1edd7e23162175bb426fa2f954aee8f113fa938957bc585e73
# codeload is listed first because github.com is intermittently unreachable
# from the device; the tag archive carries no ".tar.gz" suffix so source()
# passes an explicit filename to conan's get().

sources:
  url:
    - "https://codeload.github.com/lifelines/lifelines/tar.gz/refs/tags/3.0.61"
    - "https://github.com/lifelines/lifelines/archive/refs/tags/3.0.61.tar.gz"
  sha256: "9eb469bca4123f1edd7e23162175bb426fa2f954aee8f113fa938957bc585e73"

patches:
  - patch_file: "patches/0001-src-stdlib-environ.c.patch"
    patch_description: "environ_determine_tempfile(): honour TMPDIR instead of hard-coding /tmp (read-only on HarmonyOS devices)"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0002-configure.ac.patch"
    patch_description: "Drop the 2007 AM_GNU_GETTEXT/AM_ICONV block and the intl/po output files; keep @LIBINTL@/@LIBICONV@ substitutions empty"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0003-Makefile.am.patch"
    patch_description: "SUBDIRS: drop intl and po (NLS disabled); add -I m4 to ACLOCAL_AMFLAGS for the bootstrap"
    patch_type: "portability"
    patch_strip: 1
  - patch_file: "patches/0004-reports-st-Makefile.am.patch"
    patch_description: "reports/st selftest: pass llexec options before the database argument (this libc's getopt() does not permute argv)"
    patch_type: "platform"
    patch_strip: 1
  - patch_file: "patches/0005-build-autotools-config.sub.patch"
    patch_description: "config.sub (2007): accept the linux-ohos kernel-OS pair so --host=aarch64-unknown-linux-ohos canonicalises"
    patch_type: "portability"
    patch_strip: 1
