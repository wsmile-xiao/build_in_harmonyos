# test_package/MANIFEST.yml
# Upstream official test declaration (CI gate L0e).
# See docs/TEST_QUALITY_SPEC.md

package: lifelines/3.0.61
homepage: "https://lifelines.github.io/lifelines/"

# Upstream test command, taken from reports/st/Makefile.am
#   TESTS = selftest
#   selftest: ti test_iter st_all
upstream_check_command: "make check"

# conanfile.py build() really executes the upstream suite after `make`
upstream_test_in_build: true
upstream_test_command: "TMPDIR=<build>/tmptest TERM=xterm make -k check   (cwd: <build>/reports/st)"

# Upstream actual test programs (all data/expectation files are pristine
# upstream files under reports/st/; verdicts are computed by diffing the
# produced artefacts against the shipped .ref files).
upstream_tests:
  - file: reports/st/test_forindi.ll
    source: upstream reports/st (selftest / test_iter)
    description: "forindi iterator -> diff against test_forindi.ref"
    command: "llexec -x ./test_forindi.ll ./ti && diff test_forindi.out test_forindi.ref"
  - file: reports/st/test_forfam.ll
    source: upstream reports/st (selftest / test_iter)
    description: "forfam/children/spouses iterators -> diff against test_forfam.ref"
    command: "llexec -x ./test_forfam.ll ./ti && diff test_forfam.out test_forfam.ref"
  - file: reports/st/test_indi_it.ll
    source: upstream reports/st (selftest / test_iter)
    description: "individual iterators -> diff against test_indi_it.ref"
    command: "llexec -x ./test_indi_it.ll ./ti && diff test_indi_it.out test_indi_it.ref"
  - file: reports/st/test_fam_it.ll
    source: upstream reports/st (selftest / test_iter)
    description: "family iterators -> diff against test_fam_it.ref"
    command: "llexec -x ./test_fam_it.ll ./ti && diff test_fam_it.out test_fam_it.ref"
  - file: reports/st/test_othr_it.ll
    source: upstream reports/st (selftest / test_iter)
    description: "other-record iterators -> diff against test_othr_it.ref"
    command: "llexec -x ./test_othr_it.ll ./ti && diff test_othr_it.out test_othr_it.ref"
  - file: reports/st/trigtest.ll
    source: upstream reports/st (selftest / test_iter)
    description: "trigonometry/dms builtins -> diff against trigtest.ref"
    command: "llexec -x ./trigtest.ll ./ti && diff trigtest.out trigtest.ref"
  - file: reports/st/st_all.ll
    source: upstream reports/st (selftest / st_all)
    description: "full builtin function sweep -> diff st_all.out and st_all.stdout against the two .ref files"
    command: "printf '1\\n1\\n0\\nst_all.out\\n' | llexec -x ./st_all.ll ./ti > st_all.stdout"

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: check_lifelines.py
    description: "23 assertions: PATH resolution, --version banners, GEDCOM -> database build (4 database members), two consumer report programs (individual + family/spouse navigation), record-level content checks, and three negative paths"
    command: "python3 check_lifelines.py <workdir>"
  - file: conanfile.py
    description: "test() drives the script above under the conanrun environment"
    command: "TMPDIR=<work> python3 check_lifelines.py <work>"

# Test assertion count (consumer suite)
assertion_count: 23

# Upstream suite verdict on HarmonyOS PC (aarch64, OHOS + clang from the
# harmonybrew SDK), 2026-10-03 run: 5 of the 8 golden-file comparisons match
# upstream's own .ref byte-for-byte.  The other three are unreachable and are
# NOT counted as passing:
#   - st_all.out: 310 lines both sides, one hunk, only the embedded
#     "version: 3.0.49" vs "version: 3.0.61" line differs (upstream generated
#     the reference from release 3.0.49).
#   - st_all.stdout: 2 hunks (77 lines here vs 40 there).  This port builds
#     without NLS/iconv (patches 0002 + 0003), so the transcript additionally
#     prints "Locale missing: en_US/it_IT/sv_SE" and a batch of
#     "convertcode(...,UTF-8,ISO-8859-*) FAILURE" lines, and the subtotals
#     become 4/36 convert, 0/22 string UTF-8, 581/584 date vs the reference's
#     28/36, 20/22, 598/598.
#   - trigtest: the reference expects "House Lon: -80 degrees"; the LP64 build
#     renders the negative degree component as 4294967216 (= (unsigned) -80)
#     through the report language's d() builtin, while the decimal part on the
#     same line stays correct (-80.51).  Pre-existing upstream 64-bit defect,
#     not a port change; the .ref and the builtin are left untouched.
# See archives/l/lifelines/3.0.61/notes.md for the full evidence.
