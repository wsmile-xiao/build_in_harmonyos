  - "clang headers"
  - "cmake config files"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "LLVM 在鸿蒙上编译需要使用系统 clang 15.0.4，而非自编译 clang 18"
  - "config.guess 需要手动添加 HarmonyOS case 分支"
  - "HandleLLVMOptions.cmake 需要添加 HarmonyOS 到 UNIX 分支"
  - "clang 运行时库 libclang_rt.builtins 是关键产物"
  - "Python libintl.so.8 问题会中断编译"

# 编译完成度
completion: 90

# 失败原因
failure_reason: "Python libintl.so.8 库加载失败，导致 clang/Tooling/NodeIntrospection.inc 生成失败"

# 后续计划
next_steps:
  - "使用系统 clang 15.0.4 替代 clang 18"
  - "已安装静态库和 clang 工具，可作为依赖库使用"

# 替代方案决策
alternative_solution:
  reason: "clang 18 编译卡住，系统 clang 15.0.4 已完整可用且有 ELF 签名"
  decision: "使用系统 clang 15.0.4 替代 clang 18"
  system_clang_path: "/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/bin/clang"
  system_clang_version: "15.0.4"

