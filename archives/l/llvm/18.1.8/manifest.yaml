software: llvm
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/18.1.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "18.1.8"

# 编译状态
# published | built | failed | archived | partial
status: partial

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# 编译完成日期（YYYY-MM-DD）
compile_date: "2026-06-09"

# 构建系统类型
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/tarballs/llvm-project-18.1.8.src.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DLLVM_TARGETS_TO_BUILD=AArch64"
    - "-DLLVM_ENABLE_PROJECTS="
    - "-DCMAKE_AR=/data/service/hnp/bin/ar"
    - "-DCMAKE_RANLIB=/data/service/hnp/bin/ranlib"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: /data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/bin/clang
  cxx: /data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/bin/clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.guess-harmonyos.patch"
  - "0002-HandleLLVMOptions-harmonyos.patch"

# ============================================================
# 产物信息
# ============================================================

# 已生成的产物
artifacts:
  static_libraries:
    count: 114
    size: "591MB"
    location: "/storage/Users/currentUser/usr/local/lib/llvm-18.1.8/"
  runtime_library:
    name: "libclang_rt.builtins-aarch64.a"
    size: "361KB"
    location: "/storage/Users/currentUser/usr/local/lib/clang/18/lib/aarch64-linux-ohos/"

# 缺失的产物
