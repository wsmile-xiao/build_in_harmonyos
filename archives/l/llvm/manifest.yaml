# 软件级 manifest.yaml
# 文件位置: archives/l/llvm/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（唯一标识）
software: llvm

# 显示名称
display: "LLVM"

# 简要描述
description: "LLVM (Low Level Virtual Machine) - 模块化编译器基础设施项目，提供编译器前端、优化器、后端及运行时库"

# 软件分类
# compiler | runtime | library | tool | system | application
category: compiler

# 官方主页
homepage: "https://llvm.org"

# 许可证
# SPDX 许可证标识符
license: "Apache-2.0 WITH LLVM-exception"

# ============================================================
# 构建信息
# ============================================================

# 默认构建系统
build_system: cmake

# ============================================================
# 版本列表
# ============================================================

versions:
  "18.1.8":
    status: partial
    build_date: "2026-06-09"
    completion: 90
    alternative: "使用系统 clang 15.0.4 替代"

# ============================================================
# 依赖关系（可选）
# ============================================================

# 编译依赖
dependencies:
  build:
    - cmake >= 3.20
    - ninja 或 make
    - python >= 3.8
  runtime: []

# ============================================================
# 扩展信息（可选）
# ============================================================

# 关键词（用于搜索）
keywords:
  - compiler
  - llvm
  - clang
  - aarch64
  - optimization
  - codegen

# 维护者信息
maintainers:
  - name: "OpenDesk Compiler Team"
    email: "compiler@opendesk.org"

# 参考资料
references:
  - title: "LLVM 官方文档"
    url: "https://llvm.org/docs/"
  - title: "LLVM 在 HarmonyOS 上编译指南"
    url: "https://gitee.com/openharmony/docs/blob/master/docs/llvm.md"