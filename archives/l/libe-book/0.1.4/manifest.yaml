# 版本级 manifest —— libe-book 0.1.4
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.4"
software: libe-book

status: built
build_date: "2026-09-20"
build_system: autotools

# ⚠️ 可退化移植（§3.6）：关闭了 liblangtag（详见 build.language_support）
# ⚠️ 拆分说明：转换工具（ebook2raw/ebook2html/ebook2text）不在本包——平台将
#    库与转换工具拆为两个任务（libe-book 0.1.4 / libe-book-tools 0.1.3），
#    与归档内 libmspub / libmspub-tools 的拆分一致；本包 --without-tools。
build:
  system: autotools
  language_support:
    liblangtag: disabled
    reason: >-
      liblangtag 在本平台不可得：archives/l/liblangtag/0.6.4/manifest.yaml 写着
      status: published，但制品仓实测（本任务 w0 轮次，2026-09-20）无 liblangtag
      配方，与 libetonyek 0.1.13 移植时实测一致 → 按 AGENTS.md §3.7 属"有档案无
      发布"（发布流水线缺口，不是缺任务）。主库按 §3.6 走可退化移植。
    retained:
      - "全部电子书格式解析链路：PalmDoc/TealDoc/Plucker/PeanutPress/zTXT/RocketBook/TomeRaider/BBeB/LIT/HTMLHelp/FictionBook 2/HTML 等到 librevenge 的导出"
      - "格式识别（isSupported 置信度分级）与解密路径（忽略加密的降级上报）"
      - "上游单元测试套件（src/test 的 cppunit 程序，make check 硬门禁）"
    removed:
      - "文本段的语言标注（language tagging）：解析结果不再带 liblangtag 推断的语言标签（EBOOKLanguageManager 走上游自身的 no-langtag 空实现）"
    user_visible_impact: >-
      仅影响解析结果中的语言元数据字段；文档内容、结构与其他元数据不受影响。
      消费者若依赖该字段需知悉其缺失。
  tools_split:
    tools_built: false
    reason: >-
      --without-tools：平台任务拆分（库任务与 libe-book-tools 任务分离，
      R38 库类型不建 commands.json）；generators/stream 依赖随测试路径仍声明。
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-gnu（本 dist 的 config.sub/config.guess 为 2024 版，aarch64 与 musl 都认）"
    - "--prefix=/；--enable-static --disable-shared（R26）；--disable-dependency-tracking"
    - "--enable-tests：构建 src/test/ 的 cppunit 程序，配方在 build() 内以 make check 执行（硬门禁）"
    - "--without-liblangtag：§3.6 可退化移植，边界见上"
    - "--without-tools：平台任务拆分，本包为纯库"
    - "--without-docs"
    - "CXXFLAGS=-std=c++17：与 profile cppstd=17 一致（AX_CXX_COMPILE_STDCXX_11 在编译器默认满足 C++11 时不加 -std，SDK clang 15 默认 gnu++14）"
    - "REVENGE / REVENGE_STREAM / XML / ZLIB / ICU / CPPUNIT 共 6 组 PKG_CHECK_MODULES 变量逐个导出，且每组 CFLAGS 与 LIBS 两半都必须非空（任一半为空会落到 pkg-config 分支并硬报错——libetonyek 实测教训）"
    - "BOOST_CFLAGS 注入 tool_requires 的 boost 私有头路径；librevenge 经「只放 .a 的干净 -L 目录」（其 .la 记录 //lib 导致 libtool moved 报错）；libxml2 共享库直连包目录并 bake -Wl,-rpath；icu4c 静态库链接行带 -lc++（ICU 是 C++ 库）"
    - "gperf 经 tool_requires 并前置 PATH（AC_PATH_PROG 硬检查 + src/lib BUILT_SOURCES 用 gperf 编 6 张 .gperf token 表）"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash；umask 077→022 改写（configure 恰 2 处）；辅助脚本 chmod +x（E490）；TMPDIR 指向构建目录内 .tmp；CC/CXX 从 profile conf 显式导出（R33）；LD_LIBRARY_PATH 显式置空防 CI worker 环境污染（CI-021 #48068）"
  dependencies:
    - librevenge/0.0.5
    - libxml2/2.15.3.1
    - zlib/1.3.1
    - icu4c/77
  build_requirements:
    - boost/1.90.0.3（tool_requires，私有头）
    - cppunit/1.15.1（tool_requires，上游测试套件用）
    - gperf/3.3（tool_requires，AC_PATH_PROG 硬检查 + .gperf 生成）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "icu4c/77 包内自带 icu-uc.pc/icu-i18n.pc，但 package_info 只声明 pkg_config_name=icu-uc；对 PKG_CHECK_MODULES([ICU],[icu-i18n]) 的 autotools 项目，直接导出 ICU_CFLAGS/-ICU_LIBS 变量对即可绕开 .pc 缺口（cif-api 走 .pc 复制是另一条等价路径）。icu4c 是静态 .a 的 C++ 库：链接行必须补 -lc++，否则 configure 的链接探测与最终链接都缺 C++ 运行库符号"
  - "AC_PATH_PROG 的构建工具（本例 gperf）是真实构建期依赖：dist tarball 里 src/lib/Makefile.am 的 BUILT_SOURCES 用 %.inc : %.gperf 规则在构建期生成 6 张 token 表，tarball 不含生成物；conan 侧用 tool_requires + PATH 前置解决"
  - "LT_INIT([disable-static pic-only]) 的默认可以被命令行 --enable-static 覆盖：DLP 系 tarball（libe-book configure.ac 首部）带此默认，R26 静态策略仍然可行"
  - "上游测试默认开启（--enable-tests 默认 yes）但需要 cppunit + librevenge-stream：关闭 tools 后 need_stream 仍由 tests 打开，REVENGE_STREAM 变量对必须继续导出"
  - "consumer 测试优先复用上游工具自己用的具体类（RVNGFileStream/RVNGTextTextGenerator）而不是手写流子类，避免依赖未验证的头文件签名"
