# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libe-book/0.1.4
homepage: "https://sourceforge.net/p/libebook/"

# 上游**自带**测试套件：src/test/ 只登记一个 cppunit 程序 `test`，
# 同时出现在 check_PROGRAMS 与 TESTS 中，由 `make check` 执行；
# --enable-tests（上游默认开启）构建它。本配方关闭了 liblangtag，因此
# EBOOKLanguageManager.cpp 测试 TU 按上游自身的条件编译被排除。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check（配方 build() 内执行；--enable-tests 打开 TESTS 条件）"

upstream_tests:
  - file: src/test/test（cppunit 聚合）
    source: libe-book-0.1.4.tar.xz
    description: >-
      上游单元测试程序：默认配置（--without-liblangtag、无 --enable-experimental）
      下聚合 EBOOKBitStreamTest / EBOOKMemoryStreamTest / PDBLZ77StreamTest /
      SoftBookLZSSStreamTest 四个 cppunit TU（test.cpp 为运行器）。
      EBOOKLanguageManagerTest（liblangtag）与 XMLCollectorTest /
      XMLTreeWalkerTest（experimental 的 libcss/hubbub）随对应开关关闭而排除。
    command: "./test"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libe_book.cpp
    description: >-
      消费者功能测试：按上游转换工具（src/conv/text/ebook2text.cpp）的公开
      API 用法逐字节构造真实 PalmDoc（PDB 容器 TEXt/REAd + 未压缩文本记录），
      断言 isSupported 识别为 TYPE_PALMDOC、parse 经 RVNGTextTextGenerator
      产出原文本；并断言负契约——纯文本被拒（CONFIDENCE_NONE 且类型停留
      TYPE_UNKNOWN、parse 非 RESULT_OK）、isSupported(nullptr) 返回
      CONFIDENCE_NONE。共 10 项断言，失败即非零退出。
    command: "./test_libe_book"

# 覆盖边界（如实声明）：正向解析由上游 src/test/ 的四个 cppunit TU 与本测试的
# PalmDoc 用例共同覆盖（本配方已在 build() 中以 make check 作硬门禁执行）；
# liblangtag 语言标注随 --without-liblangtag 关闭（可退化移植，见 manifest.yaml），
# libcss/hubbub/mspack 的 experimental 格式路径上游默认关闭、本包未启用。
# 测试断言总数（近似值，用于质量评估）：上游 1 个测试程序（4 TU）+ test_package 10 项断言
assertion_count: 11
