sources:
  # CI worker 对 github.com 直连超时（多轮"源码下载超时"诊断，#67970 等）；
  # ghfast 镜像实测可达且内容一致，官方源保留兜底（ACE_TAO 先例格式）。
  url:
    - "https://ghfast.top/https://github.com/openzim/libzim/archive/refs/tags/9.8.2.tar.gz"
    - "https://github.com/openzim/libzim/archive/refs/tags/9.8.2.tar.gz"
  sha256: "38f8e2139a089f00196f288f52f2d0677a6becc218f380b54ca70b6f162398bd"

patches:
  "9.8.2":
    - patch_file: "patches/0003-enable-tests-cross-build.patch"
      patch_description: "Enable upstream test suite in cross-build (upstream excludes tests when meson.is_cross_build(); OHOS target tests run on device)"
      patch_type: "portability"

