# conandata.yml — libmalcontent 0.10.2
# 上游: https://github.com/endlessm/malcontent (tag: Version_0.10.2)
# sha256 与本地已下载 tarball 校验一致

sources:
  url: "https://github.com/endlessm/malcontent/archive/refs/tags/Version_0.10.2.tar.gz"
  sha256: "0a86ee2aabd887d38954fbb739d59289809245f173948f7a0c43d4fac0e6419d"
  tar_format: tar.gz

patches:
  "0.10.2":
    - patch_file: "patches/0001-accounts-service-meson.build.patch"
      patch_type: "portability"
      patch_description: "accounts-service/meson.build: i18n.merge_file() 去掉位置参数 output（meson 1.12 不接受位置参数，改用 input:/output: 关键字形式），使 polkit policy 文件翻译合并可在新版 meson 配置"
      patch_source: "https://github.com/endlessm/malcontent"
    - patch_file: "patches/0002-libmalcontent-meson.build.patch"
      patch_type: "portability"
      patch_description: "libmalcontent/meson.build: gnome.generate_gir() 包进 get_option('introspection') 守卫（默认 disabled）——gobject-introspection 工具链与 polkit 的 glib 版本约束冲突，且 GIR 元数据仅用于动态语言绑定，C 库消费者不需要"
      patch_source: "https://github.com/endlessm/malcontent"
    - patch_file: "patches/0003-meson.build.patch"
      patch_type: "portability"
      patch_description: "根 meson.build: help 子目录条件化（itstool/yelp-build 存在才构建文档，OHOS 无 yelp-tools）；pam 子目录条件化（libpam/libpam_misc 存在才构建 PAM 模块，OHOS 无 PAM 栈）——均为可选功能，核心 libmalcontent 库不受影响"
      patch_source: "https://github.com/endlessm/malcontent"
    - patch_file: "patches/0004-meson_options.txt.patch"
      patch_type: "portability"
      patch_description: "meson_options.txt: 新增 introspection feature 选项（默认 disabled），配合 0002 使 GObject Introspection 元数据生成可关闭"
      patch_source: "https://github.com/endlessm/malcontent"
