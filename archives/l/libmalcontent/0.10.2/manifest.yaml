knowledge_gained:
  - "meson 1.12 i18n.merge_file 不接受位置参数 output，须用 input:/output: 关键字形式"
  - "gobject-introspection 与 polkit 的 glib 版本约束冲突时可将 GIR 生成选项化关闭（GIR 仅动态语言绑定用）"
  - "OHOS 上系统 /data/service/hnp/bin/gdbus-codegen shebang 为 #!/usr/bin/python3 不可用，meson 需在 native file [binaries] 声明可用 wrapper"
  - "OHOS SDK cmake/ninja 依赖 libc++_shared.so（llvm/lib/aarch64-linux-ohos），必须注入 LD_LIBRARY_PATH"

