# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmalcontent/0.10.2
homepage: "https://github.com/endlessm/malcontent"

# 上游测试命令 (meson test --list 分析)
upstream_check_command: "meson test -C builddir --print-errorlogs"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -C builddir --print-errorlogs"

# 上游实际运行的测试程序（4 个测试进程）
upstream_tests:
  - file: libmalcontent/tests/app-filter.c
    source: libmalcontent-0.10.2/libmalcontent/tests/app-filter.c
    description: "App filter 单元测试：error-quark/types/refs/serialize/deserialize/builder（17 个断言）+ bus 测试（依赖会话 D-Bus）"
    command: "./app-filter --tap"
  - file: libmalcontent/tests/session-limits.c
    source: libmalcontent-0.10.2/libmalcontent/tests/session-limits.c
    description: "Session limits 单元测试：types/serialize/deserialize/builder/check-time-remaining（16 个断言）+ bus 测试（依赖会话 D-Bus）"
    command: "./session-limits --tap"
  - file: subprojects/libglib-testing/libglib-testing/tests/signal-logger.c
    source: libmalcontent-0.10.2/subprojects/libglib-testing/libglib-testing/tests/signal-logger.c
    description: "libglib-testing 子项目 signal-logger 测试"
    command: "./signal-logger --tap"
  - file: subprojects/libglib-testing/libglib-testing/tests/dbus-queue.c
    source: libmalcontent-0.10.2/subprojects/libglib-testing/libglib-testing/tests/dbus-queue.c
    description: "libglib-testing 子项目 dbus-queue 测试（依赖会话 D-Bus）"
    command: "./dbus-queue --tap"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：mct_app_filter_builder/serialize/deserialize + mct_session_limits_builder 实质断言"
    command: "./test_libmalcontent"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 40
