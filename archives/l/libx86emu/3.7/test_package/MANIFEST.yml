# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libx86emu/3.7
homepage: "https://github.com/wfeldt/libx86emu"

# 上游测试命令（make -n 分析：本项目为纯 Makefile，无 configure/ctest）
upstream_check_command: "make -C test"

# 上游测试清点与实测（R51）
upstream_test_count: 60
upstream_test_registered: 60
upstream_test_passed: 42
upstream_test_failed: 0
upstream_test_skipped: 18
upstream_test_note: >
  上游 test/ 目录共 60 个 .tst 用例（nasm 汇编 + x86test 驱动，逐指令模拟比对）。
  实测 42/42 有 .done 期望输出的用例全部通过（ok），18 个用例（0023_op_A_80、
  0030_int_rm16、0031_io、foo1..foo17）上游未提供 .done 期望输出，x86test 自身
  标记为 unchecked（"-"），无失败。nasm 由 ohpcd 制品仓 nasm/2.16.03 提供；
  prepare_test 在 /tmp 只读环境以 $TMPDIR 等价替换后运行（CI /tmp 可写，无需）。

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""
