patches_applied:
  - "0001-config-guess-sub-ohos.patch"
  - "0002-xar-h-api-available.patch"
  - "0003-linuxattr-safe-dirname.patch"
  - "0004-hash-openssl3-opaque-ctx.patch"
  - "0005-util-optimal-io-mnt-local.patch"
  - "0006-fts-bionic-vendored.patch"
  - "0007-src-include-path.patch"
  - "0008-xar-getopt-int-c.patch"

knowledge_gained:
  - "xar 498（Apple 官方发行）的 config.guess/config.sub 为 2005 年版，E007 补丁脚本只能覆盖 config.guess，config.sub 需手补 aarch64 与 linux-ohos（含 KERNEL-OS 分离列表与 -linux-ohos 接受，防止被 -linux*) 规则改写为 linux-gnu-ohos）"
  - "configure 不检测 OpenSSL：hash.c 在非 Apple 平台无条件使用 EVP 接口——经 CPPFLAGS/LIBS 注入 -lcrypto，不改源码"
  - "lzmaxar.c 依赖 2006 年 LZMA SDK 4.42 API（LZMA_FILTER_COPY/lzma_preset_lzma/lzma_memlimit_* 等，xz 5.x 已移除），上游 configure 也从不定义 HAVE_LIBLZMA——保持上游默认不启用 lzma，勿强行对接 xz 5.x"
  - "linuxattr.c:229 调用不存在的 safe_dirname（应为 util.h 的 xar_safe_dirname）；该分支仅在 HAVE_LSETXATTR 且非 Apple 时编译，glibc 时代 gcc 只警告、clang 15 起为 error"
  - "OpenSSL 1.1/3.x 起 EVP_MD_CTX 不透明：按值内嵌字段编译报 incomplete type——改指针 + EVP_MD_CTX_new/DigestInit/DigestUpdate/DigestFinal/EVP_MD_CTX_free"
  - "util.c xar_optimal_io_size_at_path 使用 BSD MNT_LOCAL（glibc/bionic 均无）——#ifdef MNT_LOCAL 包裹探测块，缺省回 1MiB 默认 rsize，行为与上游默认一致"
  - "bionic 无 fts(3)（glibc 有 libfts、musl 靠 musl-fts 包）：CLI 的 xar -c 目录遍历依赖 fts——vendor musl-fts 1.2.7 进 src/ 只编入 CLI，库与 API 面不变；Alpine 以 musl-fts 包同源方案解决"
  - "src/ 的 CLI 源码按已安装布局写 <xar/xar.h>，构建树无法解析（Debian Fix-include-path 从 Fedora xar.spec 取）——xar_internal.h 改 \"xar.h\"、xar.c 改 ../lib/ 相对路径"
  - "xar 默认 shared=yes 时安装版 CLI 链接 libxar.so.1 且 RUNPATH 为 configure 期 LIBDIR（conan 2 无法预知包目录）→ 运行期必挂；--disable-shared --enable-static 让 CLI 静态自含（xz -static 同款思路）"
  - "ARM/OHOS 上 char 默认 unsigned：getopt 系列返回值必须用 int 接（char c 把 -1 变 255，短选项全部失效且无报错）——src/xar.c main 即此坑，#ifdef __OHOS__ 类守卫也救不了纯语言层问题"
  - "conan libxml2 的 xml2-config 硬编码 /usr/local：xar 支持 --with-xml2-config，配方生成指向 conan 缓存的包装脚本（区别于 juise 的 prefix 追加方案）"
  - "tarball 顶层是发行物（xcodeproj/patches 等），autoconf 工程在 xar/ 子目录——source() 中上移为源码根"

patch_generation:
