# conandata.yml — libxar 1.8.0.498
# 源码取自 Apple 官方开源发行仓库 apple-oss-distributions/xar（tag xar-498；
# Debian/Ubuntu 的 1.8.0.498 即此源码，dversionmangle 去掉 1.8.0. 前缀）

sources:
  url: "https://github.com/apple-oss-distributions/xar/archive/refs/tags/xar-498.tar.gz"
  sha256: "9cee4f80b96cf592ccc545a4fdd51e4da4a5bd3b4734901637d67b043eff3c75"

patches:
  - patch_file: "patches/0001-config-guess-sub-ohos.patch"
    patch_description: "config.guess/config.sub（2005 年版）补齐 HarmonyOS/OHOS 与 aarch64 识别（E007）"
    patch_type: "portability"
  - patch_file: "patches/0002-xar-h-api-available.patch"
    patch_description: "上游 bug 修复：xar.h 非 Apple 分支漏定义 API_AVAILABLE 空宏（xar_get_safe_path 声明用到），导致 clang 编译失败"
    patch_type: "portability"
  - patch_file: "patches/0003-linuxattr-safe-dirname.patch"
    patch_description: "上游 bug 修复：linuxattr.c 调用不存在的 safe_dirname（实际为 xar_safe_dirname），仅 HAVE_LSETXATTR 且非 Apple 时编译故上游未暴露"
    patch_type: "portability"
  - patch_file: "patches/0008-xar-getopt-int-c.patch"
    patch_description: "上游 bug 修复：main 的 getopt 返回值存入 char——OHOS/ARM 的 char 默认 unsigned，-1 变 255，所有短选项落入 default 打印 usage（xar -c/-t/-x 全不可用）"
    patch_type: "portability"
  - patch_file: "patches/0007-src-include-path.patch"
    patch_description: "CLI include 路径修正（Debian Fix-include-path 同款）：xar_internal.h 的 <xar/xar.h> 改 \"xar.h\"，xar.c 的 lib 头改 ../lib/ 相对路径"
    patch_type: "portability"
  - patch_file: "patches/0006-fts-bionic-vendored.patch"
    patch_description: "CLI 编译修复：bionic 无 fts(3)——vendor musl-fts 1.2.7（BSD-3，Alpine 同源方案）进 src/，仅编入 xar CLI，库不受影响"
    patch_type: "portability"
  - patch_file: "patches/0005-util-optimal-io-mnt-local.patch"
    patch_description: "可移植性修复：xar_optimal_io_size_at_path 使用 BSD MNT_LOCAL 标记，Linux/bionic 无该常量且 statfs 不完整——#ifdef MNT_LOCAL 包裹，无标记平台走 1MiB 默认"
    patch_type: "portability"
  - patch_file: "patches/0004-hash-openssl3-opaque-ctx.patch"
    patch_description: "OpenSSL 3 兼容修复：EVP_MD_CTX 自 3.x 不透明，hash.c 按值内嵌字段改为指针（EVP_MD_CTX_new/free 管理），改用既有非平台宏分支"
    patch_type: "portability"
