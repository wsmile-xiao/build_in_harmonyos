# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libxar/1.8.0.498
homepage: "https://github.com/apple-oss-distributions/xar"

# 上游测试命令 — xar 上游无 make check（Makefile.in 无 check 目标），
# 测试为 test/ 下 7 个独立 Python 2 脚本（ attr/checksums/compression/data/
# hardlink/heap/integrity ），通过 PATH 上的 xar CLI 驱动
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-09-19 实测记录）：
# - test/：7 个 Python 2 测试脚本，57 个测试用例（attr 8/checksums 16/compression 8/data 10/hardlink 3/heap 2/integrity 10）
# - 上游脚本为 Python 2 语法（cStringIO/`except X, e`/func_name），且 util.py
#   顶层 import xattr（OHOS 设备 python3.12 无此模块、bionic 未提供易装扩展），
#   原样不可运行——已在设备上以最小可披露修改的 python3 适配副本实跑，
#   逐项结果见版本目录 reports/upstream-tests-log.md（原件哈希/字节/行数同记）
upstream_tests:
  - file: test/
    source: xar-498/test/
    description: "7 个 Python 2 脚本共 57 用例；py2 语法 + xattr 依赖无法原样运行，以 python3 适配副本实跑（修改逐项申报于 PR 上游测试用例修改说明）；lzma 用例按上游 skip 守卫跳过（本包按上游 498 默认不启用 lzma）"
    command: "python3 <test.py>（需 PATH 含 xar）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_xar.c
    description: "消费者测试（L0c）：真实 API（R34）——libxar 建档/读回/xar_verify round-trip（none/gzip/bzip2 × sha1/sha256/sha512），覆盖 zlib/bzip2/openssl 依赖链路"
    command: "编译 test_xar.c 并运行（conanfile.py test()）"
  - file: "conanfile.py test() CLI 冒烟"
    description: "包内 xar CLI 真实建档（-c）+ 列档（-t）"
    command: "xar -c -f sample.xar sample.txt && xar -t -f sample.xar"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 8
