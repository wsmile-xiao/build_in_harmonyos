software: libxar
display: "Xar (eXtensible ARchive)"
description: "Apple xar archive format library and CLI tool (create/list/extract xar archives with gzip/bzip2 encodings and sha1/sha256/sha512 checksums)"
category: compress
homepage: "https://github.com/apple-oss-distributions/xar"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub（2005 年版）补齐 HarmonyOS/OHOS 与 aarch64 识别（E007）"
    - "umask 077→022 + mktemp 包装解决 HMDFS 临时目录权限（E011）"
    - "xml2-config 包装脚本解决 conan libxml2 前缀硬编码"
    - "OpenSSL 摘要经 CPPFLAGS/LIBS 注入链接（configure 无检测）；lzma 按上游 498 默认不启用"
  common_dependencies:
    - "zlib"
    - "bzip2"
    - "libxml2"
    - "openssl"

versions:
  "1.8.0.498":
    status: built
