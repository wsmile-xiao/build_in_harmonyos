# conandata.yml — libradsec 0.0.5
# 源码取自 Debian 官方发布池的 libradsec_0.0.5.orig.tar.gz（上游保留的前缀发行包）。
# 多个官方 Debian pool 镜像按顺序回退，保证下载可靠性。
sources:
  url:
    - "https://deb.debian.org/debian/pool/main/libr/libradsec/libradsec_0.0.5.orig.tar.gz"
    - "https://ftp.debian.org/debian/pool/main/libr/libradsec/libradsec_0.0.5.orig.tar.gz"
  sha256: "12cc2f067078be738b705bb17109f5b6010d0dc1de4ff12f6669ffc603d89ced"

# libconfuse 3.3 源码（confuse-3.3.tar.gz），用于在本配方内静态编译为
# -lconfuse + confuse.h，供 libradsec configure 的 AC_CHECK_LIB([confuse],[cfg_init])。
# 说明：ohpcd 未发布 libconfuse 的 OHOS 二进制包，--build=missing 会从远端配方以
# autotools 源码构建，而在 HMDFS 挂载目录下该 configure 因 getcwd 失败无法运行
# （working directory cannot be determined）且无法在依赖侧注入修复；故在本配方内
# 用非 configure 的直接编译方式把 libconfuse 静态打进 libradsec。
libconfuse_sources:
  url:
    - "https://gh-proxy.com/https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"
    - "https://mirror.ghproxy.com/https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"
    - "https://ghproxy.com/https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"
    - "https://gitclone.com/github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"
    - "https://moeyy.cn/gh-proxy/https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"
    - "https://kkgithub.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"
    - "https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"
  sha256: "3a59ded20bc652eaa8e6261ab46f7e483bc13dad79263c15af42ecbb329707b8"

patches: []
