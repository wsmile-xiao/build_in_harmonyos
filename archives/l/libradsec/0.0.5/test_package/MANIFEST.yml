# test_package/MANIFEST.yml — libradsec 0.0.5
# 上游官方测试声明 + HMBS 审计字段
package: libradsec/0.0.5
homepage: "https://github.com/janetuk/libradsec"

# ── HMBS 上游测试声明 ──
# 上游存在测试（tests/ 目录，CUnit 框架）
upstream_tests_exist: true
# 官方统计单位：tests/test-udp.c 中注册的 CUnit 用例数（test_auth、test_buffering）。
# CUnit 注册用例与 gtest 注册用例同构，采用 gtest_macros 口径。
upstream_test_total: 2
upstream_test_count_method: gtest_macros

# ── 上游测试审计（为何无法在构建环境运行）─
upstream_test_audit: |
  上游自带单元测试 tests/test-udp.c，注册 2 个 CUnit 用例：
    * test_auth（tests/test-udp.c:70）：需要外部 RADIUS 服务器（localhost:1820，
      共享密钥 "sikrit"）中预置用户 molgan@PROJECT-MOONSHOT.ORG / password；test_auth
      -> authenticate() 实际发送 Access-Request 并断言 PW_ACCESS_ACCEPT（真实在线
      RADIUS 服务，不可在密闭构建环境内提供）。test.conf 未随源码包附带，需使用者自建；
    * test_buffering（tests/test-udp.c:103）：读取 test.conf 的 test-udp-buffering
      联接，并自建本地 UDP 服务器（port 11820）验证多包缓冲（本可本地运行）。
  构建/运行依赖：
    * tests/Makefile.am: test_udp_LDADD = ../libradsec.la -lcunit -lm，即编译链接
      需要 CUnit 测试框架。CUnit 未以 conan 包形式发布到 ohpcd 制品仓（CUnit 在鸿蒙上
      亦需手动编译修复，见 archives/c/cunit），构建环境无法提供 -lcunit，故 test-udp
      二进制无法构建/链接（test_buffering 也无法运行）。
    * tests/ 目录仅位于顶层 Makefile.am 的 DIST_SUBDIRS，未接入 SUBDIRS，默认
      make check 不会构建/运行它们（配方 build() 内实际执行 make check 亦确认无测试跑）。
  HMBS 上报口径：discovered=2（gtest_macros，test-udp.c 注册数）；executed=passed=
  failed=skipped=0；status=incomplete；gaps 两条（均为 environment）：
    (1) test_auth 需外部在线 RADIUS 服务器（不可补、纯外部服务环境依赖）；
    (2) CUnit 框架在 ohpcd 无包（且即便补齐 CUnit，test_auth 仍因外部服务器无法通过）。
  gaps 总数=2==discovered-passed。test_package 提供真实消费者测试覆盖其核心 RADIUS
  packet/AVP 功能。

# 上游测试命令（用于 make -n check 分析）
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（审计：无法在构建环境运行，如实登记）
upstream_tests:
  - file: test-udp.c
    source: libradsec-0.0.5/tests/test-udp.c
    description: "CUnit 单元测试（2 个注册用例：auth 需外部 RADIUS 服务器；buffering 自建本地服务）"
    command: "./test-udp"

# test_package 自带测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：ctx 创建 + 配置加载(read_config 解析 UDP realm) + conn 创建(bound 到 blocking-udp realm) + RADIUS Access-Request 包构造 + packet code + User-Name/User-Password AVP 校验。使用上游 config-file 模式(rs_context_read_config + rs_conn_create(ctx,&conn,realm))，避免 NULL config 下手动连接路径对 conn->realm 的空指针解引用(该路径在 NDEBUG 下 SEGV)。"
    command: "./test_libradsec test.conf"

# test_package 断言总数（真实运行并在 HMBS_TEST_PACKAGE_RESULT 中上报）
assertion_count: 7
