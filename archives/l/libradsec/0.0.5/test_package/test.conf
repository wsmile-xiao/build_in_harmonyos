# libradsec 0.0.5 — consumer test RADIUS realm configuration.
# Mirrors the upstream examples/client.conf "blocking-udp" realm (the only
# example realm that works under the base adaptation, which disables TLS).
# The consumer test only CONSTRUCTS a RADIUS Access-Request packet locally;
# it does not send to the server, so 127.0.0.1:1820 is just a placeholder peer.
realm blocking-udp {
    type = "UDP"
    timeout = 2
    retries = 2
    server {
        hostname = "127.0.0.1"
        service = "1820"
        secret = "sikrit"
    }
}
