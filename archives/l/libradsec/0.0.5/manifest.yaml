# 版本级 manifest — libradsec 0.0.5
version: "0.0.5"
software: "libradsec"
status: built
build_date: "2026-09-25"
build_system: autotools

source:
  url: "https://deb.debian.org/debian/pool/main/libr/libradsec/libradsec_0.0.5.orig.tar.gz"
  sha256: "12cc2f067078be738b705bb17109f5b6010d0dc1de4ff12f6669ffc603d89ced"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-tls"
  dependencies:
    - libevent/2.1.12
    # libconfuse 3.3 不再作为独立托管依赖：ohpcd 未发布其 OHOS 二进制，且其在 HMDFS
    # 下无法以 autotools 从源码构建（configure getcwd 失败）；本配方在 build() 内用
    # 官方 confuse-3.3 源码直接静态编译（提供 cfg_init/confuse.h）并内嵌进 libradsec。
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "E063: configure 的 -Werror 需要注入 -Wno-error=implicit-function-declaration 等关闭特定告警升级"
  - "TLS 依赖 libevent event_openssl 组件（当前不可用），基础适配使用 --disable-tls，仅 RADIUS(UDP/TCP) 功能"
  - "上游测试 tests/test-udp 需 CUnit 框架 + 外部 RADIUS 服务器 + 用户数据库，无法在构建环境运行"
  - "dictionaries.c / include/radsec/radius.h 由 release 包预生成，make 不需要 perl 重新生成"
  - "libconfuse 3.3 未发布 OHOS 二进制，且其 HMDFS autotools configure 报 working directory cannot be determined；改为在本配方内 get libconfuse_sources 并直接静态编译（confuse.c/lexer.c/reallocarray.c，OHOS 缺 reallocarray；NLS 关闭）成 stage，经 -I/-L 暴露给 libradsec configure 的 AC_CHECK_LIB([confuse],[cfg_init])，libconfuse 静态内嵌"
  - >-
    HMDFS getcwd 失败：build() 先 os.chdir(build_folder)+PWD=build_folder，并把
    libradsec configure 的 ac_pwd (pwd) 改为回退 $PWD（同 viennarna 经验）
  - >-
    autoconf 临时目录不可写（HMBS 诊断 unsafe_local_mktemp）：configure 用
    `(umask 077 && mktemp -d "./confXXXXXX")` 创建临时目录，本真机文件系统下 config.status
    无法向其中写 subs1.awk（./confCcolNo/subs1.awk: Permission denied → could not setup
    config files machinery）。当 HMBS_AUTOCONF_MKTEMP_FALLBACK=1 时，在 build() 内把
    configure 的 `mktemp -d "<template>"` 就地改写为 `false`，触发脚本自带 mkdir 回退
    （tmp=./conf$-$RANDOM; mkdir）创建可写临时目录；config.status 复用 configure 的
    $ac_tmp，故只需改 configure 一处。
