# 软件级 manifest — libradsec
software: libradsec
display: "libradsec"
description: "RADIUS 协议客户端库（含 RadSec/1.0 数据模型及 RADIUS packet/AVP 编解码）"
category: network
homepage: "https://github.com/janetuk/libradsec"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 的 -Werror 需通过 extra_cflags 关闭特定告警升级（E063）"
    - "TLS（RadSec）默认依赖 libevent 的 event_openssl 组件，本配方在 --disable-tls 下调用的公开 el 组件（event_core/event_extra）"
    - "上游测试套件（CUnit test-udp）依赖 CUnit 框架与外部 RADIUS 服务器，见 test_package/MANIFEST.yml 审计说明"
  common_dependencies:
    - libconfuse
    - libevent

versions:
  "0.0.5":
    status: built
    build_date: "2026-09-25"
    published_as: libradsec
