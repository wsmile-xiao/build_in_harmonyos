# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试三步法）
package: libfacedetection/3.0
homepage: "https://github.com/ShiqiYu/libfacedetection"

# 上游无 ctest/make check/独立测试套件：顶层 CMakeLists.txt 无
# enable_testing/add_test；example/ 三个程序（detect-image/detect-camera/
# benchmark）依赖 OpenCV（DEMO=ON），非库运行时依赖，未纳入配方构建。
upstream_check_command: "（上游无测试注册：无 ctest、无 make check 目标）"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实测程序（OpenCV 依赖，未进库构建；仅作清点证据，R51）
upstream_tests: []

# test_package 自带的消费者测试（真实调用 facedetect_cnn 推理 API）
test_package_tests:
  - file: test.cpp
    description: "构造 256x192 空白 BGR 图像调用 facedetect_cnn，验证 API 契约与链接可用"
    command: "./test_libfacedetection"

# 断言数：API 非空返回 + 人脸数非负 + 程序退出码 0
assertion_count: 3
