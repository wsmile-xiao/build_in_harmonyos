version: "0.16.3"
status: published
build_date: "2026-05-21"

source:
  url: "https://ftp.debian.org/debian/pool/main/libi/libid3tag/libid3tag_0.16.3.orig.tar.gz"
  sha256: "e335334c4504c5def4c0bc04833a34a8ef032767a078cb93429a9094481a9925"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 4.x 与 cmake_minimum_required(3.1) 不兼容，需 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "Savannah 镜像在 OpenHarmony 环境不可达，Debian pool mirror (ftp.debian.org) 可替代"
  - "G0 clean-verify 仅支持 autotools，CMake 项目需创建 hints/configure.sh wrapper"
  - "init-build 依赖 configure.ac 判断构建系统，纯 CMake 项目需手动修正 build_system"