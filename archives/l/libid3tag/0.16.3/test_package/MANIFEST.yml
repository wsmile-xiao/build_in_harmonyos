# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libid3tag/0.16.3
homepage: "https://codeberg.org/tenacity/libid3tag"

# 上游测试命令
# libid3tag 0.16.3 上游 tarball 无 tests/ 目录、无 enable_testing()/add_test()、
# 无 make check/ctest 目标；官方 CI 仅执行 configure/build/install。
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 核验结论：上游不存在正式测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Consumer test — libid3tag API: id3_tag_new, id3_frame_new, id3_field_addstring, id3_tag_render, id3_tag_parse, id3_ucs4_utf8duplicate"
    command: "./test_libid3tag"

# 测试断言总数
assertion_count: 10
