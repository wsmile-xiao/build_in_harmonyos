software: libid3tag
display: "libid3tag"
description: "ID3 标签解析与操作库，支持读写 MP3 文件中的 ID3v1/ID3v2 元数据"
category: data
homepage: "https://download.savannah.nongnu.org/releases/libid3tag/"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 4.x 与 cmake_minimum_required(3.1) 不兼容，需添加 -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "Savannah 镜像在 OHOS 环境不可达，需使用 Debian pool mirror (ftp.debian.org) 替代"
    - "G0 clean-verify 仅支持 autotools，CMake 项目需创建 hints/configure.sh wrapper"
    - "上游 CMakeLists 链接 ZLIB::ZLIB，Conan CMakeDeps 生成 zlib::zlib，需在 recipe build() 中修正目标名"
  common_dependencies:
    - zlib

versions:
  "0.16.3":
    status: published
    build_date: "2026-05-21"