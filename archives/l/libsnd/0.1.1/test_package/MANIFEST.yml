# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsnd/0.1.1
homepage: "https://github.com/everdrone/libsnd"

# 上游测试命令 (CMake + googletest)
# 说明: 上游 CMakeLists.txt 中 add_test() 被注释，无 ctest 注册；
#       测试入口为 gtest 可执行文件 test (test/main.cpp RUN_ALL_TESTS)。
upstream_check_command: "cmake -DBUILD_TESTS=ON . && make test && ./test"
upstream_test_in_build: false
upstream_test_command: "./test"

# 上游实际运行的测试程序 (gtest, 96 个独立 TEST_CASE, 8 个 suite)
# 账目: 源码声明 96 个独立 TEST() (10 个测试源文件, main.cpp 为 runner),
#       实际实例化并运行 96/96, 全部 PASSED。
#       bilinear.cpp 中注释掉的 TEST(Bilinear, canGetSampleRate) 不是独立用例。
upstream_tests:
  - file: test/main.cpp
    source: libsnd-0.1.1/test/main.cpp
    description: "gtest runner (InitGoogleTest + RUN_ALL_TESTS)"
    command: "./test"
  - file: test/approx.cpp
    source: libsnd-0.1.1/test/approx.cpp
    description: "Approx suite: 21 TEST() (sine/cos/tan/sin approximations)"
    command: "./test --gtest_filter=Approx.*"
  - file: test/conversion.cpp
    source: libsnd-0.1.1/test/conversion.cpp
    description: "Conversion suite: 24 TEST() (pitch/frequency/dB/log/scale/BLTPrewarp)"
    command: "./test --gtest_filter=Conversion.*"
  - file: test/denormal.cpp
    source: libsnd-0.1.1/test/denormal.cpp
    description: "Denormal suite: 5 TEST() (denormalCancel/isDenormal)"
    command: "./test --gtest_filter=Denormal.*"
  - file: test/interpolation.cpp
    source: libsnd-0.1.1/test/interpolation.cpp
    description: "Interpolation suite: 33 TEST() (linear/bSpline/lagrange/hermite/2oOscu/etc.)"
    command: "./test --gtest_filter=Interpolation.*"
  - file: test/lfo.cpp
    source: libsnd-0.1.1/test/lfo.cpp
    description: "LFO suite: 6 TEST()"
    command: "./test --gtest_filter=LFO.*"
  - file: test/saturator.cpp
    source: libsnd-0.1.1/test/saturator.cpp
    description: "Saturator suite: 4 TEST() (tanhSaturator)"
    command: "./test --gtest_filter=Saturator.*"
  - file: test/sine.cpp
    source: libsnd-0.1.1/test/sine.cpp
    description: "Oscillator suite: 1 TEST() (Sine)"
    command: "./test --gtest_filter=Oscillator.*"
  - file: test/utils.cpp
    source: libsnd-0.1.1/test/utils.cpp
    description: "FlipFlop suite: 2 TEST() (tick_flips/FlipFlop_initial_state)"
    command: "./test --gtest_filter=FlipFlop.*"

# test_package 中自带的测试 (消费者视角验证 + HarmonyOS 专项)
test_package_tests:
  - file: test.cpp
    description: "消费者测试: 调用打包后 libsnd 静态库 API (FlipFlop/isDenormal)"
    command: "./test_libsnd"
  - file: ohos_specific_test.cpp
    description: "HarmonyOS 专项测试: aarch64 运行时探针 + denormal 处理 + DSP API 数值行为"
    command: "./test_ohos"

# 测试断言总数: 上游 96 + test_package 2
assertion_count: 98