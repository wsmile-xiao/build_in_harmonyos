build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies:
    - libcurl/8.5.0
    - nettle/3.10.2.1
    - json-c/0.18
    - libuv/1.52.1.1
    - libmicrohttpd/1.0.1
  bundled_dependencies: []
  optional_features:
    cli_storj: "bin/storj（上游 Makefile 内建目标）"
    tests_mock_servers: "libmicrohttpd mock bridge :8091 / mock farmer :8092（仅测试）"
    multi_threading: "libuv 线程池"
    note: >-
      configure 摘要：build/host=aarch64-unknown-linux-ohos、cross compiling=no、
      C 编译器 /data/service/hnp/bin/clang、HAVE_ALIGNED_ALLOC/POSIX_MEMALIGN/
      POSIX_FALLOCATE=1、PKG_CHECK_MODULES 五依赖全部命中（conan 生成器目录
      的 .pc + libuv.pc 别名）。工具链 automake/1.18 + libtool/2.5.4 经
      tool_requires（E178），autoconf 用 HNP 套件（避开 conan autoconf/2.72
      的 PERL5LIB 毒丸）。
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 0001：上游 storj CLI 与测试程序 -static 整体静态链接，ohpcd libcurl 制品
# 仅共享库（无 libcurl.a）⇒ 静态 -lcurl 必失败；工具链静态可执行本身可用
# （clang -static 探针 ELF EXEC 运行 rc=0），库本体仍 R26 静态优先。
# 0002：crypto.h 以 nettle 3.1 时代 unsigned 原型重声明 pbkdf2_hmac_sha512、
# crypto.c 同名包装定义；nettle >= 3.4 头文件把该名字宏展开为
# nettle_pbkdf2_hmac_sha512(size_t,...) ⇒ conflicting types。删冗余声明与
# 包装（nettle 真函数等价，调用点参数序本就匹配其签名）。
# 0003：test/Makefile.am 的 `mockbridge.c: *.json.h` 无配方显式规则使 make
# 在 out-of-tree（VPATH）构建下跳过对 mockbridge.c 的 VPATH 搜索 ⇒
# `no such file or directory: 'mockbridge.c'`；改用 automake BUILT_SOURCES
# 机制先产 .json.h 头再编译（上游只做过 in-tree 构建）。
# 0004：tests_rs.c 先 `#define PROFILE` 再整源 include ../src/rs.c，把 x86
# 专用 rdtsc TSC 内联汇编带进 aarch64（`invalid output constraint '=d'
# in asm`）；rdtsc 为仅插桩死代码（无调用点），x86 之外回退
# clock_gettime(CLOCK_MONOTONIC)，行为不变。
# 0005：HMDFS 拒绝 fallocate 系统调用（posix_fallocate 返回 EACCES，
# 2026-09-21 探针取证）⇒ create_parity_shards 的 allocatefile 失败 ⇒
# STORJ_FILE_PARITY_ERROR；posix_fallocate 失败时回退 ftruncate（调用方
# 只需文件长到 length 再做 MAP_SHARED 映射），fallocate 正常的文件系统行为不变。
patches_applied:
  - "patches/0001-ohos-drop-static-link-flag.patch"
  - "patches/0002-nettle-pbkdf2-prototype.patch"
  - "patches/0003-out-of-tree-tests-built-sources.patch"
  - "patches/0004-rdtsc-portable-non-x86.patch"
  - "patches/0005-allocatefile-ftruncate-fallback.patch"

knowledge_gained:
  # 每条行尾引用最接近的条目（写法遵循容器层口径：# knowledge_ref: <条目/新草稿号>）。
  - "OHOS SDK（llvm 15.0.4 / ohos-sdk 26.0.0.18）完整支持 -static 可执行：clang -static 探针产出 ELF EXEC 且设备运行 rc=0（静态 musl + libclang_rt 在位）；「Makefile 硬编码 -static」不构成必然失败，真缺口在依赖侧是否带 .a（本例 ohpcd libcurl/8.5.0 仅共享库 ⇒ 去上游 -static 而不是换工具链）——先探针工具链、再查依赖归档、最后才动补丁的三步判读序。"  # knowledge_ref: DRAFT-E635-ohos-static-exec-supported-shared-only-deps-judgment-order
  - "AutotoolsDeps 只注入 CPPFLAGS/LDFLAGS/LIBS、不注入依赖 libdirs 到 LD_LIBRARY_PATH：configure 的 conftest 被其 LIBS 全量链接远程共享库制品，运行即 `Error loading shared library` rc=127 ⇒ `cannot run C compiled programs`（形态像交叉编译配置错误）；修法把依赖 cpp_info.libdirs 追加进 AutotoolsToolchain env 的 buildenv，configure 与 make check 一并受益。"  # knowledge_ref: E467
  - "LT_INIT 隐式引入 AC_CANONICAL_HOST（libtoolize 装 config.guess/sub）而 conan 对 os=OHOS 不产三元组参数 ⇒ configure 落到 config.guess 猜 build 类型：2024-07 版不认 uname -s=HarmonyOS 且其 TMPDIR 编译探针在 HMDFS 被拒 ⇒ `cannot guess build type; you must specify one`；显式传 --build/--host=aarch64-unknown-linux-ohos 后 cross compiling=no、AC_RUN_IFELSE 正常执行（config.sub 2024 版接受 *-linux-ohos）。"  # knowledge_ref: E007
  - "远端 libuv 包 cpp_info 的 pkg_config_name 是 libuv-static，PkgConfigDeps 只产 libuv-static.pc，上游 configure 按 pkg-config 模块名 libuv 查询即报 `libuv1 ... was not found`；generate() 里以 libuv-static.pc 内容写 libuv.pc 别名（仅改 Name 行）即过。凡「configure 找不到包、但 conan 图明明有」先 ls 生成器目录的 .pc 文件名再下结论。"  # knowledge_ref: E384
  - "上游库内部临时目录选择链（storj_init_env）的 TMPDIR 分支是死代码，环境覆盖只认 STORJ_TEMP，兜底到字面量 /tmp；OHOS 设备 /tmp 存在但只读 ⇒ fopen(\"w+\") 创建 .crypt 必失败，重试 6 次后以「File encryption error」这种语义错误码收场，与文件系统毫无关联词；判读先用日志全开（level=4）重链测试二进制拿库内部日志。"  # knowledge_ref: DRAFT-E634-libstorj-library-temp-path-tmp-readonly-storj-temp
  - "HMDFS 上 autoreconf 现场生成的 configure 必须做 umask 077→000 sed（config.status 临时目录 drwx--S--- ⇒ `can't create ./confXXXX/subs1.awk: Permission denied`，本任务独立复现）；autoreconf 由 automake/1.18+libtool/2.5.4 tool_requires 提供，autoconf 走 HNP 套件，避开 conan autoconf/2.72 的 PERL5LIB 毒丸。"  # knowledge_ref: E114
  - "HMDFS 拒绝 fallocate 系统调用（posix_fallocate 返回 EACCES，探针取证）⇒ 上游 allocatefile（HAVE_POSIX_FALLOCATE 分支）分配 parity mmap 文件必失败 ⇒ File create parity error；posix_fallocate 失败时回退 ftruncate（调用方只需文件长到 length 再 MAP_SHARED）。"  # knowledge_ref: DRAFT-E634-libstorj-library-temp-path-tmp-readonly-storj-temp

