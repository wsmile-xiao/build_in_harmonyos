# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: libstorj/1.0.3
homepage: https://github.com/storj-archived/libstorj

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试程序（automake TESTS = tests tests_rs）
upstream_tests:
  - file: tests
    source: "test/tests.c（驱动 mockbridge.c/mockfarmer.c 本地 mock bridge :8091 与 mock farmer :8092，纯回环）"
    description: >-
      API/上传/下载/BIP39/加密/工具六组集成测试：bridge CRUD、注册、
      badauth 负路径、整文件加密上传（store_file 及 cancel）、resolve_file、
      mnemonic 校验/生成、bucket key、AES-CTR IV 递增、加密授权写读、
      元数据加密、str2hex/hex2str、时间戳、分片尺寸、内存映射；
      逐条打印 PASS/FAIL，末尾 `PASSED: N ... TOTAL: M`
    command: "make check"
  - file: tests_rs
    source: "test/tests_rs.c（#define PROFILE 后整源 include ../src/rs.c）"
    description: >-
      Reed-Solomon FEC 单测：galois 域、子矩阵、乘法、求逆、单编码、单解码、
      批量编码、重构（与 golang 参考输出逐字节比对）+ 编码基准；
      成功标志 `reach here means test all ok`
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_consumer.c
    description: >-
      消费者 ABI 验证 8 条：util_timestamp、mnemonic_check 正/反、
      mnemonic_generate(128) 12 词回环、encrypt_auth→decrypt_auth 回环
      （nettle AES-CTR/PBKDF2 + json-c）、错口令拒绝、strerror 文本、
      安装产物 storj CLI --help 冒烟（OHOS 设备真跑）
    command: "conan test_package（clang 直链 libstorj.a + 依赖闭包）"

# 测试断言总数（上游 tests 二进制运行期 PASS 计数 39 + tests_rs 测试函数 9）
assertion_count: 48
