# conandata.yml — libstorj 1.0.3
# 源码为上游官方 tag 归档（R39 官方源头口径）。上游仓库已归档
# （Storj/libstorj → storj-archived/libstorj），v1.0.3 release 无源码资产，
# 官方下载入口即 tag 归档（GitHub releases/expanded_assets 页仅列出
# archive/refs/tags/v1.0.3.tar.gz 与 .zip 两个入口，实测 2026-09-21）。
# 双源互证（字节级最强形态）：
#   ① 上游 tag 归档 sha256 = 下方值（170838 字节，gzip 魔术 1f 8b，
#      tar 顶层目录 libstorj-1.0.3/）；
#   ② Debian pool libstorj_1.0.3.orig.tar.gz
#      （http://deb.debian.org/debian/pool/main/libs/libstorj/）
#      与 ① 为同一字节流：同字节数 170838、同 sha256。
sources:
  url: "https://github.com/storj-archived/libstorj/archive/refs/tags/v1.0.3.tar.gz"
  sha256: "0f68f6a8374b93c240ae3a87c2f08feb34f812685858935bf079c1d0501ad032"
  filename: "libstorj-1.0.3.tar.gz"

# OHOS 适配补丁：上游把 `storj` CLI 与两个测试程序都以 `-static` 整体静态链接，
# 而 ohpcd 远程 libcurl/8.5.0 制品只提供共享库（p/lib 下无 libcurl.a，实测
# 2026-09-21）⇒ -static 链接在 -lcurl 处必然失败。工具链本身支持静态可执行
# （clang -static hello → ELF EXEC 且可运行，已探针取证），缺口只是依赖归档，
# 故去掉两处 -static（库本体仍按 R26 默认 --enable-static --disable-shared）。
patches:
  - patch_file: "patches/0001-ohos-drop-static-link-flag.patch"
    patch_description: >-
      Drop upstream -static from storj_LDFLAGS/tests_LDFLAGS: the ohpcd
      libcurl artifact ships shared-only (no libcurl.a) so a fully static
      link cannot resolve; the library itself stays static (R26).
    patch_type: "portability"
  - patch_file: "patches/0002-nettle-pbkdf2-prototype.patch"
    patch_description: >-
      nettle >= 3.4 compatibility: crypto.h redeclared pbkdf2_hmac_sha512
      with `unsigned` lengths (nettle 3.1-era) and crypto.c defined a
      same-named wrapper; nettle's header macro expands the name to
      nettle_pbkdf2_hmac_sha512 whose prototype now takes size_t, so the
      build dies with "conflicting types". Remove the redundant declaration
      and the wrapper — nettle's own function is identical in behavior and
      the call site (bip39.c) already matches its signature.
    patch_type: "portability"
  - patch_file: "patches/0003-out-of-tree-tests-built-sources.patch"
    patch_description: >-
      Out-of-tree (VPATH) build fix for test/: the dependency-only rule
      `mockbridge.c: mockbridge.json.h mockbridgeinfo.json.h` made make treat
      mockbridge.c as buildable in the build dir and skip the VPATH search
      (clang: no such file or directory: 'mockbridge.c'). Replace with
      automake's BUILT_SOURCES mechanism so the hexdump-generated headers
      are built before anything else.
    patch_type: "portability"
  - patch_file: "patches/0004-rdtsc-portable-non-x86.patch"
    patch_description: >-
      tests_rs.c does `#define PROFILE` before #including ../src/rs.c, which
      compiles the x86-only `rdtsc` TSC inline asm — on aarch64 clang dies
      with "invalid output constraint '=d' in asm". Guard the asm for x86
      and fall back to clock_gettime(CLOCK_MONOTONIC) elsewhere; rdtsc() is
      instrumentation-only (never called), so behavior is unchanged.
    patch_type: "portability"
  - patch_file: "patches/0005-allocatefile-ftruncate-fallback.patch"
    patch_description: >-
      HMDFS rejects the fallocate(2) syscall (posix_fallocate returns
      EACCES, probed 2026-09-21), so create_parity_shards' allocatefile()
      failed and storj_bridge_store_file ended with
      STORJ_FILE_PARITY_ERROR. Fall back to ftruncate() when
      posix_fallocate fails — the caller only needs the file grown to
      `length` before its MAP_SHARED mapping. No behavior change on
      filesystems where fallocate works.
    patch_type: "portability"
