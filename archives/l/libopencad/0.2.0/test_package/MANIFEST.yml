package: "libopencad/0.2.0"
homepage: "https://github.com/nextgis-borsch/lib_opencad"

# 上游测试运行情况：上游 22 用例已在本机 OHOS 交叉产物上直接运行通过
# （io_test 14/14 + geometry_test 8/8 = 22/22，0 失败）。
# 上游采用 GTest 框架，共 22 用例 / 80 断言：
#   - io_check.cpp             14 用例（位读取原语 ReadBITSHORT/Read3B/ReadRAWSHORT）
#   - reading_geometries.cpp    8 用例（打开 r2000 DWG 样例读取几何）
# 由 BUILD_TESTS=ON 触发构建，依赖 gtest（ohpcd 已有 gtest/1.17.0）。

upstream_check_command: "cmake -DBUILD_TESTS=ON && ctest"
upstream_test_in_build: false
upstream_tests:
  - id: "io_check"
    framework: "googletest"
    case_count: 14
    assertion_count: 14
    runnable_on_device: true
  - id: "reading_geometries"
    framework: "googletest"
    case_count: 8
    assertion_count: 66
    runnable_on_device: true
upstream_total_cases: 22
upstream_total_assertions: 80

test_package_tests:
  - id: "open-arc-dwg"
    source: "test_libopencad.cpp"
    command: "test_libopencad"
    description: >-
      Opens the 1arc.dwg sample through the public opencad_api.h
      C API (OpenCADFile READ_FAST), checks version API, verifies exactly
      1 layer and exactly 1 ARC geometry (mirrors upstream
      reading_geometries.1arc). Exits non-zero on any mismatch.
      Test data note: the DWG sample is NOT stored in the git repo (PR
      diffs cannot carry binary patch data, which broke CI checkout-pr);
      it is shipped by the libopencad package itself under res/ (copied
      from the upstream source tarball tests/data/r2000/ at package()
      time) and read from the dependency package folder at test runtime.

test_counting:
  upstream_independent_total: 22
  integration_independent_total: 1
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 23
assertion_count: 81
