sources:
  url: "https://github.com/nextgis-borsch/lib_opencad/archive/refs/tags/v0.2.0.tar.gz"
  filename: "libopencad-0.2.0.tar.gz"
  sha256: "b7bf09fc4b1b5f2c0daa869266267434c36207f3266e7b2ddb33579d0347e42d"

patches:
  - patch_file: "patches/0001-cmake-configure-file.patch"
    patch_description: >-
      Use an explicit CMAKE_SOURCE_DIR path for the uninstall.cmake.in
      configure_file input; expanding ${CMAKE_MODULE_PATH}/uninstall.cmake.in
      breaks under modern CMake (4.x) once the conan toolchain prepends the
      generators dir to CMAKE_MODULE_PATH.
    patch_type: "portability"
