# 版本级 manifest — libopencad 0.2.0

version: "0.2.0"
software: "libopencad"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-14"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag）
  url: "https://github.com/nextgis-borsch/lib_opencad/archive/refs/tags/v0.2.0.tar.gz"

  # 源码校验和（SHA-256）
  # 注意：必须与 conandata.yml 下载 URL（github.com/archive/...）产出的 tarball 一致，
  # 与 api.github.com 的 tarball（dfc6e160...）因顶层目录名不同而哈希不同。
  sha256: "b7bf09fc4b1b5f2c0daa869266267434c36207f3266e7b2ddb33579d0347e42d"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=OFF"
  - "-DBUILD_APPS=OFF"
  - "-DBUILD_TESTS=OFF"

  # 编译依赖列表（库本体零外部依赖，仅 C++ 标准库）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 语言标准（注意：认领信息写"C"，实际为 C++11）
  language_standard: "C++11"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "patches/0001-cmake-configure-file.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libopencad 0.2.0 为纯 C++11 CMake 库，库本体零外部依赖（仅标准库），适配难度低"
- "上游顶层 CMakeLists 的 project() 名为 opencad（非 libopencad），静态库产物名为 opencadstatic，头文件安装到 include/opencad/"
- "认领信息中语言标注为 C，实际源码为 C++11，需在 PR 中纠正"
- "上游测试为 GTest 框架（io_check 14 用例 + reading_geometries 8 用例，共 22 用例/80 断言），BUILD_TESTS 默认 OFF，测试依赖 gtest/1.17.0（ohpcd 已有）"
- "上游 CMakeLists 硬编码 -std=c++11，与 ohos-aarch64 profile 的 compiler.cppstd=17 无冲突，clang15 可正常编译"
