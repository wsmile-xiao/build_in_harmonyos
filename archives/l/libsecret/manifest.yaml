software: libsecret
display: "libsecret"
description: "GNOME 密钥管理库 — Secret Service API 的 GObject 客户端绑定（libsecret-1 + secret-tool，含本地文件后端）"
category: core
homepage: "https://gitlab.gnome.org/GNOME/libsecret"
license: LGPL-2.1-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建；glib 经 Conan 提供（PkgConfigDeps + 包内 .pc prefix 重写）"
    - "crypto=libgcrypt 启用文件后端：OHOS 无 gnome-keyring daemon，SECRET_BACKEND=file 是唯一可用 secret 存储"
    - "getpass() 声明缺失：OHOS musl 有符号但 SDK 头缺声明，补丁补 extern 声明（glib 2.84 同款）"
    - "egg 测试 scratch 目录硬编码 /tmp：改用 g_get_tmp_dir()（E002）"
    - "0.21.8 起 flock 键环锁用 O_CREAT/O_RDWR 但上游未含 <fcntl.h>（glibc 传递引入、musl 不传递）：补丁补包含"
    - "secret-tool 链接需 -L/lib -l:ld-musl-aarch64.so.1（系统 musl 提供 getpass 符号）"
  common_dependencies:
    - "glib"
    - "libgcrypt"

versions:
  "0.21.7":
    status: built
    build_date: "2026-09-15"
  "0.21.8":
    status: built
    build_date: "2026-09-20"
