# 知识沉淀
knowledge_gained:
- "glib 包自带 .pc 的 prefix=/，pkg-config 消费方必须重写 prefix 为真实包路径"
- "proxy-libintl 与 pcre2 无 .pc 或需链上传递，须作为直接依赖并在 cpp_info.requires 引用"
- "PkgConfigDeps 生成的 glib*.pc 工具变量(gdbus_codegen/glib_mkenums)路径损坏，需指向 glib 包内真实脚本"
- "OHOS 加载器无法从 .conan2 缓存按符号链接加载 .so；测试二进制需 $ORIGIN RPATH + 实体库拷贝 + E077 重签名"

