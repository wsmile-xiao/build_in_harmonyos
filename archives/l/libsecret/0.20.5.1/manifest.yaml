# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号（上游 0.20.5 + 适配修复后缀 .1，R37）
version: "0.20.5.1"

# 软件名
software: "libsecret"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"
build_system: "meson"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源优先，镜像仅作 fallback）
  url: "https://download.gnome.org/sources/libsecret/0.20/libsecret-0.20.5.tar.xz"

  # 源码校验和
  sha256: "3fb3ce340fcd7db54d87c893e69bfc2b1f6e4d4b279065ffe66dac9f0fd12b4d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 构建工具（来自 Conan tool_requires，不依赖全局 PATH / pip）
  build_requires:
  - meson/1.11.0

  # 配置选项列表
  configure_options:
  - "-Dintrospection=false"
  - "-Dvapi=false"
  - "-Dgcrypt=true"
  - "-Dtpm2=false"
  - "-Dbash_completion=disabled"
  - "-Dmanpage=false"
  - "-Dgtk_doc=false"

  # 编译依赖列表（格式: name/version）
  # glib/2.88.3 = Qt6 链（libnm/1.58.0, gsettings-qt/1.1.1, qtbase-sql-dbus/6.11.1,
  # networkmanager-qt/6.26.0, kylin-nm-base/4.20.0.0）所用的同一代 glib。
  dependencies:
  - glib/2.88.3
  - proxy-libintl/0.5
  - pcre2/10.47
  - libffi/3.5.2
  - zlib/1.3.2
  - libgpg-error/1.55
  - libgcrypt/1.12.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-tool-secret-tool.c.patch"

# 知识沉淀
knowledge_gained:
- "★ E077 根因：meson install 用 patchelf 重写已安装 target 的 RPATH → 链接器自签的 .codesign 失效 → OHOS 加载器以 EACCES/'Permission denied' 拒绝该 ELF（dlopen 与 exec 都拒）。已发布 libsecret/0.20.5 二进制即此缺陷受害者（pristine conan home 复现：libglib-2.0.so.0 可加载，libsecret-1.so.0.0.0 报 Permission denied；strip .codesign 重签后 dlopen OK）。"
- "★ 修复（E077/ML-0043 四步法，仓库先例 cairo/1.18.4.2、glib/2.88.3.1）：package() 内 meson.install() 之后对包内 OHOS ELF（lib/*.so* 与 bin/secret-tool）执行 llvm-objcopy --remove-section .codesign → binary-sign-tool sign -selfSign 1 → 恢复执行位。工具路径取自 tools.build:compiler_executables / OHOS SDK（R33，不用裸 shell 变量）。"
- "★ test_package 不再 meson install 脚手架二进制：install 期 RPATH 重写同样会剥离其签名使其不可执行；改为直接运行 build 树产物（build_rpath 由链接器写入，签名有效）。被测库拷贝保持字节不变、绝不重签——这样才能真实证明产物可加载。"
- "glib 包自带 .pc 的 prefix=/，pkg-config 消费方必须重写 prefix 为真实包路径"
- "proxy-libintl 与 pcre2 无 .pc 或需链上传递，须作为直接依赖并在 cpp_info.requires 引用"
- "PkgConfigDeps 生成的 glib*.pc 工具变量(gdbus_codegen/glib_mkenums)路径损坏，需指向 glib 包内真实脚本"
- "OHOS 加载器无法从 .conan2 缓存按符号链接加载 .so；测试需真实文件拷贝 + RPATH/LD_LIBRARY_PATH 指向实体目录"

# ============================================================
# 验收测试（本版本新增）
# ============================================================

acceptance_test:
  runner: "test_package/conanfile.py::test()"
  description: >
    link_probe 经导出的 secret-1 pkg-config 模块链接并调用 secret_value_*（下游链接契约）；
    dlopen_probe 不链接 libsecret，dlopen("libsecret-1.so.0", RTLD_NOW) + secret_* 符号解析
    与真实 API 调用（可加载性验收）。conan create 下两者均 exit 0。
  observed:
    link_probe: "LINK PROBE: -lsecret-1 link + secret_value_* call OK"
    dlopen_probe: "ACCEPTANCE: dlopen(RTLD_NOW) OK / secret_* symbol resolution 12/12 / secret_value_new-get-unref roundtrip OK"

patch_generation:
