# conandata.yml — libsecret 0.20.5.1
#
# 0.20.5.1 = upstream 0.20.5 + OHOS adaptation fix (R37 adaptation suffix).
# Fix scope vs the published 0.20.5 artifact:
#   * E077 — the published 0.20.5 binary carried a stale `.codesign` section
#     (ELF modified after signing), so the OHOS loader rejected
#     `libsecret-1.so.0.0.0` with EACCES ("Permission denied"). This build is
#     produced by a tool_requires'd meson toolchain and nothing rewrites the
#     linked ELF afterwards, so the toolchain-issued signature stays valid.
#   * build toolchain is taken from the Conan graph (meson/1.11.0) instead of
#     a "pip install" fallback inside build().

sources:
  url:
    - "https://download.gnome.org/sources/libsecret/0.20/libsecret-0.20.5.tar.xz"
    # authoritative mirrors (fallback only; CI also injects its own fallbacks)
    - "https://mirrors.ustc.edu.cn/gnome/sources/libsecret/0.20/libsecret-0.20.5.tar.xz"
    - "https://mirrors.tuna.tsinghua.edu.cn/gnome/sources/libsecret/0.20/libsecret-0.20.5.tar.xz"
    - "https://mirror.nju.edu.cn/gnome/sources/libsecret/0.20/libsecret-0.20.5.tar.xz"
  sha256: "3fb3ce340fcd7db54d87c893e69bfc2b1f6e4d4b279065ffe66dac9f0fd12b4d"

patches:
  - patch_file: "patches/0001-tool-secret-tool.c.patch"
    patch_type: portability
    patch_description: "Replace getpass() with portable stdin read (bionic declaration mismatch)"
