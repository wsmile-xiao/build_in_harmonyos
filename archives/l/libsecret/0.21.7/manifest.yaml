software: libsecret
version: "0.21.7"
status: built
build_date: "2026-09-15"

source:
  url: "https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.7.tar.xz"
  sha256: "6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dcrypto=libgcrypt"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Dmanpage=false"
    - "-Dgtk_doc=false"
    - "-Dbash_completion=disabled"
    - "-Dpam=false"
    - "-Dtpm2=false"
  dependencies:
    - glib/2.84.0.1
    - libgcrypt/1.11.0
  cc: clang

patches_applied:
  - "0001-secret-tool-getpass-declaration.patch: OHOS musl libc 提供 getpass() 符号但 SDK 头文件缺声明（glib/2.84.0 patch 0002 同款问题），补声明消除 -Wint-conversion 编译错误"
  - "0002-egg-testing-scratch-dir.patch: egg 测试 scratch 目录从硬编码 /tmp 改用 g_get_tmp_dir()（遵循 TMPDIR；OHOS /tmp 只读 E002），解锁 test-file-collection 运行"

knowledge_gained:
  - "libsecret meson 构建需 glib 全套 .pc（含 gio-unix-2.0）且 gdbus_codegen 变量必须可解析——glib 包 .pc 的 prefix=/ 需在配方 generate() 重写"
  - "file backend（crypto=libgcrypt）是 OHOS 上唯一可用的 secret 存储路径（无 gnome-keyring daemon）"
  - "8 个上游测试依赖 python D-Bus mock service（需 session bus + dbus/gi python 模块），OHOS 环境类豁免"

verification:
  upstream_tests:
    registered_targets: 16
    registered_subcases: 195
    runnable_targets: 8
    passed_subcases: 62
    exempted_targets: 8
    exempted_subcases: 133
  test_package:
    consumer_test: "PASS"
    secret_tool_smoke: "PASS (file backend store/lookup/clear)"
