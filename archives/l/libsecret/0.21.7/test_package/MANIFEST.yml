# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libsecret/0.21.7
homepage: "https://gitlab.gnome.org/GNOME/libsecret"

# 上游测试命令（meson test 全量 16 个注册目标）
upstream_check_command: "meson test"

# conanfile.py build() 方法中已集成上游测试（8 个可运行目标，62 子用例实测通过）
upstream_test_in_build: true
upstream_test_command: "meson test libsecret:test-hex libsecret:test-secmem libsecret:test-dh libsecret:test-hkdf libsecret:test-attributes libsecret:test-value libsecret:test-file-collection libsecret:test-secret-tool.sh"

# 上游实际运行的测试程序（meson 注册 16 目标：8 可运行 + 8 依赖 D-Bus mock 豁免）
upstream_tests:
  - file: egg/test-hex.c
    source: libsecret-0.21.7.tar.xz/egg/test-hex.c
    description: "egg hex 编解码（4 子用例）"
    command: "meson test libsecret:test-hex"
  - file: egg/test-secmem.c
    source: libsecret-0.21.7.tar.xz/egg/test-secmem.c
    description: "egg 安全内存分配（7 子用例）"
    command: "meson test libsecret:test-secmem"
  - file: egg/test-dh.c
    source: libsecret-0.21.7.tar.xz/egg/test-dh.c
    description: "egg Diffie-Hellman（libgcrypt 后端，8 子用例）"
    command: "meson test libsecret:test-dh"
  - file: egg/test-hkdf.c
    source: libsecret-0.21.7.tar.xz/egg/test-hkdf.c
    description: "egg HKDF 密钥派生（libgcrypt 后端，7 子用例）"
    command: "meson test libsecret:test-hkdf"
  - file: libsecret/test-attributes.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-attributes.c
    description: "属性构建与 schema 校验（12 子用例）"
    command: "meson test libsecret:test-attributes"
  - file: libsecret/test-value.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-value.c
    description: "SecretValue 生命周期（11 子用例）"
    command: "meson test libsecret:test-value"
  - file: libsecret/test-file-collection.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-file-collection.c
    description: "文件后端 collection 读写加解密（7 子用例）"
    command: "meson test libsecret:test-file-collection"
  - file: tool/test-secret-tool.sh
    source: libsecret-0.21.7.tar.xz/tool/test-secret-tool.sh
    description: "secret-tool 端到端 store/lookup/search/clear（6 子用例，file 后端）"
    command: "meson test libsecret:test-secret-tool.sh"
  - file: libsecret/test-prompt.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-prompt.c
    description: "SecretPrompt（12 子用例，需 python D-Bus mock service——豁免）"
    command: "meson test libsecret:test-prompt"
  - file: libsecret/test-service.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-service.c
    description: "SecretService（12 子用例，需 python D-Bus mock service——豁免）"
    command: "meson test libsecret:test-service"
  - file: libsecret/test-session.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-session.c
    description: "会话协商（6 子用例，需 python D-Bus mock service——豁免）"
    command: "meson test libsecret:test-session"
  - file: libsecret/test-paths.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-paths.c
    description: "DBus 路径 API（20 子用例，需 python D-Bus mock service——豁免）"
    command: "meson test libsecret:test-paths"
  - file: libsecret/test-methods.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-methods.c
    description: "常用方法（25 子用例，需 python D-Bus mock service——豁免）"
    command: "meson test libsecret:test-methods"
  - file: libsecret/test-password.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-password.c
    description: "密码 API（15 子用例，需 python D-Bus mock service——豁免）"
    command: "meson test libsecret:test-password"
  - file: libsecret/test-item.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-item.c
    description: "SecretItem（20 子用例，需 python D-Bus mock service——豁免）"
    command: "meson test libsecret:test-item"
  - file: libsecret/test-collection.c
    source: libsecret-0.21.7.tar.xz/libsecret/test-collection.c
    description: "SecretCollection（27 子用例，需 python D-Bus mock service——豁免）"
    command: "meson test libsecret:test-collection"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.c
    description: "消费者测试：版本宏/schema 构建/SecretValue 生命周期/内建 schema"
    command: "./test_package"
  - file: secret-tool 冒烟（conanfile test()）
    description: "secret-tool file 后端端到端 store/lookup/clear"
    command: "secret-tool store/lookup/clear (SECRET_BACKEND=file)"

# 上游注册 16 个 meson 测试目标 = 195 个 TAP 子用例（8 可运行目标 62 子用例
# 实测全过 + 8 个 D-Bus mock 目标 133 子用例环境豁免）
assertion_count: 62
