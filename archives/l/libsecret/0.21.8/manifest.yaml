# 编译中学到的知识
knowledge_gained:
- "0.21.8 新增 flock() 键环锁使用 O_CREAT/O_RDWR，上游靠 glibc <sys/file.h> 传递引入 <fcntl.h>；musl 不传递，需补 <fcntl.h>（补丁 0002）"
- "0.21.8 新增 linker version script（libsecret.map）：lld 支持 -Wl,--version-script，公开符号 secret_*/SECRET_*/SECMEM_* 均正常导出，无需适配"
- "0.21.8 meson 新增 test_setup feature 选项（默认 auto）：无 dbus-run-session 时仅打印提示不报错，与 0.21.7 行为等价"
- "glib 包自带 .pc 的 prefix=/ 需在配方 generate() 重写（0.21.7 同款），gdbus_codegen/glib_mkenums 工具变量才能解析"
- "OHOS musl libc 有 getpass 符号但 SDK 头文件缺声明，补丁声明（glib/2.84.0 patch 0002 同款）"
- "egg 测试 scratch 目录硬编码 /tmp 改用 g_get_tmp_dir()（E002）"
- "meson test 选择器 `project_name:test_name` 语义：0.21.8 注册 17 目标全部属于 project libsecret，套件名（libegg/libsecret/secret-tool）不影响选择"

