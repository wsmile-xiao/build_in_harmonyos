patches:
  - patch_file: "patches/0001-egg-egg-testing.c.patch"
    patch_type: "portability"
    patch_description: "Use g_get_tmp_dir() instead of hardcoded /tmp for the egg test scratch directory (OHOS /tmp is read-only, E002; g_get_tmp_dir honors TMPDIR)"
    patch_source: "https://gitlab.gnome.org/GNOME/libsecret"
  - patch_file: "patches/0002-libsecret-secret-file-collection.c.patch"
    patch_type: "portability"
    patch_description: "Include <fcntl.h> for O_CREAT/O_RDWR used by the new flock()-based keyring locking (upstream relies on glibc's transitive include from sys/file.h; musl does not provide it)"
    patch_source: "https://gitlab.gnome.org/GNOME/libsecret"
  - patch_file: "patches/0003-tool-secret-tool.c.patch"
    patch_type: "portability"
    patch_description: "Declare getpass() in tool/secret-tool.c for OHOS musl libc (SDK headers lack the declaration; the system musl loader exports the symbol — same gap glib/2.84.0 worked around in its patch 0002)"
    patch_source: "https://gitlab.gnome.org/GNOME/libsecret"
