# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsquish/1.15
homepage: "https://sourceforge.net/projects/libsquish/"

# 上游无独立 make check / ctest 套件，CMakeLists.txt 无 test target
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libsquish.cpp
    description: "libsquish API 往返测试: RGBA→DXT1压缩→解压→MSE误差校验"
    command: "./test_libsquish"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
