patches:
  - patch_file: "patches/0001-test-utils-honor-TMPDIR-for-test-log-tmpfile.patch"
    patch_description: "Create the test log buffer below $TMPDIR instead of the hardcoded read-only /tmp on OpenHarmony (musl tmpfile() ignores TMPDIR)"
    patch_type: "portability"
  - patch_file: "patches/0002-scripts-portable-interpreter-for-kdoc-check.patch"
    patch_description: "Use a portable interpreter shebang for the kernel-doc check script (OHOS has no /bin/bash)"
    patch_type: "portability"
  - patch_file: "patches/0003-test-sysfs-portable-interpreter-and-tolerant-tar.patch"
    patch_description: "Portable interpreter (env bash + set -e) and tolerant toybox tar extraction for the sysfs tree-diff test"
    patch_type: "portability"
  - patch_file: "patches/0004-test-config-portable-interpreter-and-tolerant-tar.patch"
    patch_description: "Portable interpreter (env bash + set -e) and tolerant toybox tar extraction for the config-diff test"
    patch_type: "portability"
