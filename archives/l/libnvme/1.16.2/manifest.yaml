software: libnvme
version: "1.16.2"
status: built
build_date: "2026-10-09"
build_system: meson

source:
  url: "https://codeload.github.com/linux-nvme/libnvme/tar.gz/refs/tags/v1.16.2"
  sha256: "1d850d5a871559abf641d6e6b63bb86047e4cb26f3ad144597c2c64b3cff7231"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dpython=disabled"
    - "-Dopenssl=enabled"
    - "-Dkeyutils=disabled"
    - "-Dlibdbus=disabled"
    - "-Dliburing=disabled"
    - "-Ddocs=false -Ddocs-build=false"
    - "-Dexamples=false"
    - "-Dtests=true"
  dependencies:
    - "json-c/0.18"
    - "openssl/3.5.7"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-test-utils-honor-TMPDIR-for-test-log-tmpfile.patch"
  - "0002-scripts-portable-interpreter-for-kdoc-check.patch"
  - "0003-test-sysfs-portable-interpreter-and-tolerant-tar.patch"
  - "0004-test-config-portable-interpreter-and-tolerant-tar.patch"

knowledge_gained:
  - "OHOS /tmp 只读（EROFS）且 musl tmpfile() 不遵循 TMPDIR，测试日志 tmpfile() 失败 EACCES → mkstemp($TMPDIR) 替代"
  - "OHOS 无 /bin/bash：#!/bin/bash shebang 脚本直接 ENOENT（且 toybox env 不支持带参 shebang bash -e）→ env bash + 体内 set -e"
  - "toybox tar 无法复现自引用硬链接条目（X link to X）：先 unlink 目标再 link 导致 ENOENT → tar -xk 容错提取（普通文件优先落盘）"
  - "json-c Conan 包头文件在 include/json-c/ 子目录而 libnvme 用 #include <json.h>：需在 PkgConfigDeps 生成的 json-c.pc Cflags 追加 -I${includedir}/json-c"
  - "libnvme 自带 Linux UAPI 兜底：linux/nvme.h ioctl 定义内嵌于 nvme/ioctl.h（_UAPI 守卫），linux/mctp.h 缺失时自动 fallback mi-mctp-compat.h，OHOS sysroot 的 linux/types.h 存在即满足最小需求"
  - "openssl 静态库（PIC）可链入 libnvme.so：DT_NEEDED 只含 libjson-c.so.5，TLS 密钥函数全量可用"
  - "meson C++ sanity check 需 LD_LIBRARY_PATH 含 SDK llvm/lib（libc++_shared.so），否则 cxx 语言探测静默降级，cpp-dump/cpp-misc 测试不注册"

verify:
  upstream_tests:
    registered: 38
    passed: 36
    expected_fail: 2
    failed: 0
    detail: "mi(4xx断言)/mi-mctp/uuid/uriparser/tree/util/psk/ana/discovery/features/identify/logs/zns/misc/cpp-dump/cpp-misc/ioctl×7/NBFT×14(2 expected-fail)/sysfs×2/config×5/kdoc"
  test_package: "10 断言消费者冒烟（版本/根/控制器/JSON/UUID/TLS密钥回环/MI）"
