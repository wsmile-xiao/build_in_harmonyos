test_package:
  type: cmake
  files:
    - CMakeLists.txt
    - conanfile.py
    - test_libnvme.c
  upstream_tests:
    - file: test/meson.build
      source: libnvme-1.16.2/test/meson.build
      description: "上游 meson test 套件（build() 内真机执行，38 注册目标：mi/mi-mctp/uuid/uriparser/tree/util/psk/ana/discovery/features/identify/logs/zns/misc/cpp-dump/cpp-misc + ioctl 7 项 + sysfs 2 项 + config 5 项 + NBFT 14 项 + kdoc）"
      command: "meson test --print-errorlogs --num-processes 2"
    - file: test/ioctl/meson.build
      source: libnvme-1.16.2/test/ioctl/meson.build
      description: "ioctl 管理命令 mock 测试（LD_PRELOAD mock-ioctl，7 项）"
    - file: test/nbft/meson.build
      source: libnvme-1.16.2/test/nbft/meson.build
      description: "NBFT ACPI 表解析测试（12 正常表 + 2 损坏表 should_fail）"
    - file: test/sysfs/meson.build
      source: libnvme-1.16.2/test/sysfs/meson.build
      description: "sysfs 拓扑 dump 对比测试（2 项，tarball 解包 + diff）"
    - file: test/config/meson.build
      source: libnvme-1.16.2/test/config/meson.build
      description: "JSON 配置文件解析测试（5 项：config-pcie/config-pcie-with-tcp-config/hostnqn-order/psk-json-tls_key-1/2）"
    - file: doc/meson.build
      source: libnvme-1.16.2/doc/meson.build
      description: "kernel-doc 注释规范性检查（kdoc，11 个 API 头）"
  test_package_tests:
    - file: test_libnvme.c
      description: "消费者冒烟（10 断言：版本/根对象/控制器分配/JSON配置读/UUID转换/TLS密钥导出导入回环/身份派生/MI根对象）"
      command: "./test_libnvme"
