# test_package/MANIFEST.yml
# loki 2.4.7.4
#
# Upstream DOES ship a test suite: `make tests` in test/ runs 7 statistical
# regression tests (jvtst_1/2/cens/lm/mg, gaw9_tst, jvtst_3) that drive the
# prep+loki programs and diff the output against recorded standards under
# test/standards/. These are run in build() (upstream_test_in_build: true).

package: loki/2.4.7.4
homepage: "https://www.stat.washington.edu/thompson/Genepi/loki.shtml"

upstream_tests_exist: true
upstream_check_command: "make tests   # in test/, 7 tests"
upstream_test_in_build: true
upstream_test_command: "make -j1 -B tests  (test/: jvtst_1 jvtst_2 jvtst_cens jvtst_lm jvtst_mg gaw9_tst jvtst_3)"
upstream_test_count: 7
upstream_passed: 7
upstream_failed: 0

test_package_tests:
  - file: test_loki.sh
    description: "4 binaries installed; loki -v version banner; prep/loki argument checks; hist/qavg real runs on synthetic data"
    command: "sh test_loki.sh"

test_files:
  - path: "test_package/test_loki.sh"
    test_type: "OHOS consumer"
    assertion_count: 11
    description: "11 assertions against the installed programs"

test_package_test_count: 11
consumer_assertion_count: 11
assertion_count: 11
