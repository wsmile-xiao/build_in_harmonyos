software: loki
display: "Loki"
description: "MCMC 多元连锁分析程序（一般家系的连锁/关联分析），含 loki/prep/qavg/hist"
category: science
homepage: "https://www.stat.washington.edu/thompson/Genepi/loki.shtml"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2003 年代 C 依赖 gcc 默认 -fcommon；clang 默认 -fno-common 会 duplicate symbol → CFLAGS 加 -fcommon（E491）"
    - "configure/config.status 的 umask 077 在 HMDFS 上失效 → 改 022（E011/E528）"
    - "AR/RANLIB 探测为 GNU 名，OHOS 只有 llvm-ar/llvm-ranlib → 显式传（E012）"
    - "上游自带已生成的 configure 与预生成 flex/bison 源，无需 autoreconf/bison/flex"
    - "上游有 7 个统计回归测试（make tests），配方在 build() 内实跑并断言 7/7"
  common_dependencies: []

versions:
  "2.4.7.4":
    status: built
    build_date: "2026-09-26"
    conan_ref: "loki/2.4.7.4"
