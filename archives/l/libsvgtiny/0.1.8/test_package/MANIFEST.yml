# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libsvgtiny/0.1.8
homepage: "https://www.netsurf-browser.org/projects/libsvgtiny/"

# 上游测试: test/runtest.sh 驱动 test/decode_svg 对 test/data/*.svg (12) 与
# test/ns-afl-svg/*.svg (2612) 逐个解码, 合计 2624 个 SVG 用例 (exit 0 为通过;
# 有 .mvg 参考文件时输出比对 — 本版本两个数据目录均无 .mvg, 实际判据为退出码)
upstream_check_command: "test/runtest.sh"

# conanfile.py build() 方法中是否已集成上游测试
# build() 内编译未修改的上游 harness (test/decode_svg.c), 再调用上游驱动脚本
# 实跑全量 2624 例; 2612 个 AFL fuzz 语料随官方 src tarball 一同提供, 无需 vendor。
upstream_test_in_build: true
upstream_test_command: "sh test/runtest.sh ."

# 上游实际运行的测试程序 (runtest.sh 驱动, 见 notes.md rule4 说明)
upstream_tests:
  - file: test/decode_svg.c
    source: libsvgtiny-0.1.8/test/decode_svg.c
    description: "SVG Tiny 解码器 (svgtiny_create/parse/free + MVG 输出)"
    command: "./test_decode_svg <svg> 1.0 <out.mvg>"
  - file: test/data/*.svg
    source: libsvgtiny-0.1.8/test/data/
    description: "回归数据: 12 个 SVG (tiger/sprite/arc-path 等)"
    command: "./test_decode_svg test/data/<file> 1.0 <out>"
  - file: test/ns-afl-svg/*.svg
    source: libsvgtiny-0.1.8/test/ns-afl-svg/
    description: "AFL fuzz 套件: 2612 个 SVG 边缘用例"
    command: "./test_decode_svg test/ns-afl-svg/<file> 1.0 <out>"

# 上游测试总数 = 12 (data) + 2612 (ns-afl-svg) = 2624 个 SVG 解码用例

# test_package 中自带的测试 (消费者视角 + 上游测试实跑)
# - 上游全量 2624 例 (12 data + 2612 ns-afl-svg) 已在层1 build() 内实跑,
#   判据 = 汇总行必须为 Tests:2624 Pass:2624 Fail:0 Error:0 (glob 未命中时
#   runtest.sh 会以 Tests:0 退出 0, 故额外校验总数, 防空转假绿)
# - test_svgtiny: 内联 SVG 经 svgtiny_create/parse/free, 断言 shape_count>=2
# - test_decode_svg: vendored 上游 harness, 对 12 个 data 文件逐个解码 (exit 0)
#   附 STRICT 判据: 解析失败输出 (FAIL_REGULAR_EXPRESSION) 亦判失败
test_package_tests:
  - file: test.c
    description: "消费者测试: svgtiny_create/svgtiny_parse/svgtiny_free 解析内联 SVG"
    command: "./test_svgtiny"
  - file: upstream/decode_svg.c
    description: "上游 harness 实跑: 12 个 data/*.svg 逐个解码, 逐文件注册为 CTest 用例 decode_*; 判据 = exit 0 且无 svgtiny_parse/svgtiny_create 失败输出 (FAIL_REGULAR_EXPRESSION, 上游 harness 解析失败也 return 0, 单靠退出码会空转); 例外: afl-expat-crash.svg 是 AFL 发现的 expat 崩溃 PoC, 预期 graceful 解析失败不崩溃, 不适用严格判据"
    command: "ctest (12 cases: test_decode_svg upstream/data/<file> 1.0 <out>)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
