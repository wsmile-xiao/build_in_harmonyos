# conandata.yml — libsvgtiny 0.1.8
# 官方源: https://download.netsurf-browser.org/libs/releases/libsvgtiny-0.1.8-src.tar.gz

sources:
  url: "https://download.netsurf-browser.org/libs/releases/libsvgtiny-0.1.8-src.tar.gz"
  sha256: "c357227f02e83fb2a76b12b901191a082229db1f007362e8f31c754510c2a01c"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: "Replace NetSurf NSSHARED build system with a standalone Makefile (remove -Werror for clang 15 compatibility; committed colour table is the single source of truth — no gperf invocation, clean never deletes it, missing file fails fast)"
    patch_type: "portability"
  - patch_file: "patches/0002-autogenerated-colors.patch"
    patch_description: "Commit a functionally equivalent hand-written src/autogenerated_colors.c (linear search over the same 147 CSS colour entries from src/colors.gperf, values verified against the gperf input; not byte-identical gperf output) so the build never requires the gperf host tool"
    patch_type: "portability"
