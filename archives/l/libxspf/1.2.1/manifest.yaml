# libxspf 1.2.1 版本级 manifest
version: "1.2.1"
software: libxspf

# 首轮：工作树已按规范完成，待 HMBS 真机预检（conan create + make check +
# test_package）全部通过后再更新为 published。
status: built
build_date: "2026-09-15"
build_system: autotools

source:
  url: "https://downloads.sourceforge.net/project/libspiff/Sources/1.2.1/libxspf-1.2.1.tar.bz2"
  sha256: "ce78a7f7df73b7420b6a54b5766f9b74e396d5e0b37661c9a448f2f589754a49"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--disable-shared --enable-static (shared 选项关闭时)"
    - "--enable-shared --disable-static (shared 选项开启时)"
    - "--disable-doc"
    - "--build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu (仅 OHOS)"
    - "-std=c++11 (库源码使用 std::auto_ptr，C++17 已移除)"
  dependencies:
    - expat/2.8.2.1
    - uriparser/1.0.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libxspf 测试套件是 CppTest 的 TESTS=test/xspf_test 单测程序，147 个 TEST_ADD 分布在 9 个 Suite（Official 97 为主体，大量 pass/fail XSPF fixture）"
  - "ohpcd 无 cpptest 配方：build() 内 vendor 官方 CppTest 2.0.0（sha256 校验）静态构建，仅供 make check，交付物不链接 LGPL 测试框架"
  - "CppTest TextOutput 摘要行格式为 Total: N tests, P% correct；9 个 Suite 摘要行缺一即判 harness 未完整执行"
