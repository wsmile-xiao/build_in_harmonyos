package: libxspf/1.2.1
homepage: "https://libspiff.sourceforge.net/"

# `make check` builds and runs TESTS = test/xspf_test (CppTest). The recipe
# keeps the suite enabled and vendors CppTest 2.0.0 at build time.
upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 147 TEST_ADD registrations audited from the 1.2.1 release tarball. The
# recipe cross-checks the real CppTest summary (`Total: N tests, P% correct`)
# against this total and requires all 9 suite summaries to be present.
upstream_tests:
  - file: test/OfficialSuite.cpp
    source: libxspf-1.2.1/test/OfficialSuite.cpp
    description: "97 pass/fail XSPF v0/v1 fixture cases (official conformance corpus)"
    command: "./test/xspf_test"
  - file: test/DateTimeSuite.h
    source: libxspf-1.2.1/test/DateTimeSuite.h
    description: "23 dateTime parsing edge cases (fractional seconds, timezones, leap years)"
    command: "./test/xspf_test"
  - file: test/WhiteSpaceSuite.cpp
    source: libxspf-1.2.1/test/WhiteSpaceSuite.cpp
    description: "11 whitespace tolerance cases (anyURI, nonNegativeInteger, dateTime)"
    command: "./test/xspf_test"
  - file: test/MaliciousXmlSuite.cpp
    source: libxspf-1.2.1/test/MaliciousXmlSuite.cpp
    description: "6 hostile-XML guards (entity expansion depth/count/size limits)"
    command: "./test/xspf_test"
  - file: test/ChunkCallbackSuite.cpp
    source: libxspf-1.2.1/test/ChunkCallbackSuite.cpp
    description: "4 chunked-input parsing cases"
    command: "./test/xspf_test"
  - file: test/ExtensionReaderFactorySuite.cpp
    source: libxspf-1.2.1/test/ExtensionReaderFactorySuite.cpp
    description: "2 extension reader factory cases"
    command: "./test/xspf_test"
  - file: test/ReadWriteSuite.cpp
    source: libxspf-1.2.1/test/ReadWriteSuite.cpp
    description: "2 read/write round-trip cases"
    command: "./test/xspf_test"
  - file: test/MemoryModelSuite.cpp
    source: libxspf-1.2.1/test/MemoryModelSuite.cpp
    description: "1 ownership/memory-model case (give/lend/steal title)"
    command: "./test/xspf_test"
  - file: test/ProjectOpus/ProjectOpusSuite.cpp
    source: libxspf-1.2.1/test/ProjectOpus/ProjectOpusSuite.cpp
    description: "1 ProjectOpus playlist extension case"
    command: "./test/xspf_test"

# Consumer tests shipped in test_package/ (subscriber view, R34: they link
# and call the installed library, no stub main).
test_package_tests:
  - file: test_xspf.cpp
    description: "14 CHECKs: version macros, parseMemory of a valid v1 doc (2 tracks), rejection of truncated/malformed XML, writer writeMemory bytes, re-parse round-trip"
    command: "./test_xspf"

# CHECK() count in test_xspf.cpp (each prints XSPF-CHECK-PASS on success).
assertion_count: 14
