# Vendored test-only framework (NOT packaged): CppTest drives `make check`.
# ohpcd publishes no cpptest recipe, so build() downloads, verifies and
# builds it into a build-tree prefix; the installed libxspf never links it.
cpptest:
  version: "2.0.0"
  urls:
    - "https://github.com/cpptest/cpptest/releases/download/2.0.0/cpptest-2.0.0.tar.bz2"
    - "https://downloads.sourceforge.net/project/cpptest/cpptest/cpptest-2.0.0/cpptest-2.0.0.tar.bz2"
  sha256: "7c258936a407bcd1635a9b7719fbdcd6c6e044b5d32f53bbf6fbf6f205e5e429"
