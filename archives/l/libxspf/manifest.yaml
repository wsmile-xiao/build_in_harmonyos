software: libxspf
display: "libxspf"
description: "XSPF playlist reading and writing library (Xiph.Org reference implementation)"
category: library
homepage: "https://libspiff.sourceforge.net/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "显式 --build/--host 三元组绕开老旧 config.guess 对 HarmonyOS 的识别缺失"
    - "强制 -std=c++11（源码使用 C++17 已移除的 std::auto_ptr）"
    - "CppTest 2.0.0 官方包 build 内 vendor，仅供 make check，不进交付物"
    - "测试二进制与交付工具均经 binary-sign-tool 自签名后才可执行"
  common_dependencies:
    - expat
    - uriparser

versions:
  "1.2.1":
    status: built
    build_date: "2026-09-15"
