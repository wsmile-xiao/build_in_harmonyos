software: libdivecomputer
display: "libdivecomputer"
description: "跨平台潜水电脑通信与日志解析 C 库"
category: library
homepage: "https://www.libdivecomputer.org/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.sub (2022-01-03) 不识别 ohos triplet，patch 接受 ohos*/linux-ohos*（与 acpid/adplug 同根因）"
    - "传输后端全可选且优雅降级，构建无需潜水电脑硬件；serial 仅标准 POSIX termios"
    - "with_libusb 默认开（制品仓有 ohos-aarch64 二进制）；usbhid 无 hidapi 时回退 libusb；ble 上游硬编码关"
    - "上游零自动化测试，test_package 以硬件无关 API（version/context/descriptor/合成剖面 parser）验证"
  common_dependencies:
    - "libusb/1.0.27（可选，USB 传输）"

versions:
  "0.9.0":
    status: draft
    build_date: "2026-09-17"
    source_url: "https://github.com/libdivecomputer/libdivecomputer/releases/download/v0.9.0/libdivecomputer-0.9.0.tar.gz"
