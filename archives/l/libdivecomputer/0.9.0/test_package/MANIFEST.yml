# libdivecomputer/0.9.0 test_package 上游测试声明
# CI 门禁 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md

package: libdivecomputer/0.9.0
homepage: "https://www.libdivecomputer.org/"

# 上游测试审计（结论：零自动化测试，test_package 以硬件无关 API 复刻验证）：
# 1) 顶层 Makefile.am：SUBDIRS = include src [examples] [doc]，无 check/test 目标，
#    仅 pkgconfig_DATA = libdivecomputer.pc。
# 2) src/Makefile.am：仅 lib_LTLIBRARIES = libdivecomputer.la，无测试目标。
# 3) examples/Makefile.am：bin_PROGRAMS = dctool（dctool_version/list/scan/download/
#    dump/parse/read/write/timesync/fwupdate），为手动 CLI 工具：list/parse 离线可用，
#    download/read/write/timesync/fwupdate/scan 需真实潜水电脑（serial/USB/Bluetooth）。
# 4) 全树无 TEST(/TEST_F（gtest）、def test_（pytest）、ctest、tests/ 目录。
# 因此上游正式测试数量为 0；不存在可离线执行的上游正式测试。
# test_package 以硬件无关公共 API 做消费者验证：dc_version/dc_version_check、
# dc_context_new/set_loglevel/get_transports/free、dc_descriptor_iterator 全量设备库、
# dc_parser_new2/get_type/get_field/samples_foreach 解析合成 Suunto Solution 潜水
# 剖面（divetime=(4*3+5)*60、maxdepth=40*0.3048），不打开任何串口/USB/蓝牙设备。
# OHOS 专项：传输掩码断言 SERIAL 必在、BLE 必不在（上游 0.9.0 硬编码 transport_ble=no）、
# libusb 启用时 USB|USBHID 必在（证明 OHOS 构建未因无硬件而阉割真实 backend）。
upstream_tests_exist: false
upstream_test_audit: "审计 libdivecomputer 0.9.0 上游（官方 release tarball libdivecomputer-0.9.0.tar.gz，sha256 a7b80b9083a2113a43280ee7b51d48d66ea5a779fc3fee57df7c451da0251c65）：1) 顶层/src Makefile.am 无 check/test 目标；2) examples/dctool 为手动 CLI 工具而非测试框架；3) 无 gtest/pytest/ctest/tests 目录。上游自动化测试数量为 0，无任何可离线执行的上游正式测试。"

upstream_check_command: "n/a (upstream has no automated test suite)"
upstream_test_in_build: false
upstream_test_command: "n/a (upstream has no automated test suite)"

upstream_tests: []

test_package_tests:
  - file: test_package.c
    description: "消费者验证（硬件无关）：version 双向核对（宏+链接期 C 函数）、DC_VERSION_CHECK 宏逻辑、dc_version_check 接受 0.9.0/拒绝 99.0.0、context 生命周期与日志级别、编译期传输掩码（SERIAL 必在、BLE 必不在、libusb 启用时 USB|USBHID 必在）、描述符迭代器全量枚举（>100 设备、DC_STATUS_DONE 收尾、Suunto Solution 在库）、dc_parser_new2 解析合成剖面（divetime/maxdepth 数值断言、samples_foreach 样本事件、get_type 家族号），共 20 个 CHECK，失败即非零退出"
    command: "test_package"

assertion_count: 20
