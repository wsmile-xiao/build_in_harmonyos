# 版本级 manifest — libdivecomputer 0.9.0
# 模板：templates/manifest-version.yaml

name: libdivecomputer
version: "0.9.0"
status: draft
source_url: "https://github.com/libdivecomputer/libdivecomputer/releases/download/v0.9.0/libdivecomputer-0.9.0.tar.gz"
source_sha256: "a7b80b9083a2113a43280ee7b51d48d66ea5a779fc3fee57df7c451da0251c65"
license: "LGPL-2.1-or-later"
homepage: "https://www.libdivecomputer.org/"
bugtracker_url: "https://github.com/libdivecomputer/libdivecomputer/issues"
categories: [library, communication, hardware-interface]

description: "Cross-platform library for communication with dive computers from various manufacturers."

build:
  system: autotools
  patch: "patches/0001-ohos-triplet-and-umask.patch"

# 编译出的制品
outputs:
  - type: shared-library
    names: ["libdivecomputer.so"]
  - type: static-library
    names: ["libdivecomputer.a"]
  - type: executable
    names: ["dctool"]
    note: "example CLI tool, built when enable_examples=True (default)"

# 依赖情况（真实，无设备需求）
dependencies:
  required: []          # 核心库无强制依赖
  optional:
    - name: libusb
      version: "1.0.27"
      note: "USB transport (--with-libusb, pkg-config libusb-1.0); ohos-aarch64 binary published in artifact repo"
    - name: hidapi
      note: "USBHID transport (--with-hidapi); when absent, usbhid.c falls back to plain libusb on non-mac platforms"
    - name: bluez
      version: "5.79"
      note: "Bluetooth Classic transport (--with-bluez); OHOS not validated (daemon-centric package), Linux only"

# 测试声明（上游零自动化测试）
tests:
  upstream_official: 0
  offline_runnable: 0
  hardware_dependent: 0
  detail: "上游无 check/test 目标、无 gtest/pytest/ctest/tests 目录；examples/dctool 是手动 CLI 工具，其中 list/parse 离线可用，scan/download/read/write/timesync/fwupdate 需真实潜水电脑。test_package 以硬件无关公共 API 做消费者验证（详见 test_package/MANIFEST.yml）。"

# 硬件说明
hardware:
  required_for_build: false
  required_for_test: false
  detail: "构建与离线测试均不需要潜水电脑；transport 后端在缺少硬件/依赖时退化为运行时 DC_STATUS_UNSUPPORTED。"

# OHOS 平台适配点（全部实测复现的根因）
platform:
  ohos:
    - "config.sub (2022-01-03) 不识别 aarch64-unknown-linux-ohos → patch 接受 ohos*/linux-ohos*"
    - "config.guess 无 HarmonyOS case → 无法 guess 系统类型 → patch 增加 *:HarmonyOS:*:* case（acpid 2.0.34 先例）"
    - "configure/config.guess 的 umask 077 mktemp 目录在 HMDFS 上为 0700+setgid 不可写 → umask 022（E011，libusb 先例）"
    - "libtool+clang/lld 将 -L 依赖目录硬编码为 DT_RUNPATH（宿主 ~/.conan2 缓存路径）→ package() 改写为 DT_FLAGS=0 + binary-sign-tool 重签（E077）"
    - "serial 走标准 POSIX termios（serial_posix.c），OHOS musl 提供，无 TCGETA 依赖（E565 不适用）"
    - "irda 为头文件探测（linux/irda.h），OHOS 上自然缺失，源码编译为空操作"
    - "BLE 上游 0.9.0 硬编码 transport_ble=no（ble.c 仅是公共 API 壳）"
    - "R9: OHOS worker 上 make -j1 串行构建"

# 构建结果（ohos-aarch64）
build_result:
  static: "rc=0；libdivecomputer.a 114 成员全 ELF64/AArch64；test_package 20/20 PASS"
  shared: "rc=0；SONAME=libdivecomputer.so.0；NEEDED=libusb-1.0.so.0,libc.so（全目标侧）；RUNPATH 无宿主路径；test_package 20/20 PASS"
