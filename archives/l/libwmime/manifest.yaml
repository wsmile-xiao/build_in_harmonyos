software: libwmime
display: "libwmime (VMime Mail Library)"
description: "C++ library for RFC 5322 / MIME messages and IMAP, POP3, SMTP"
category: network
homepage: "https://github.com/grommunio/wmime"
license: GPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，C++17，库目标 wmime（SOVERSION 2），无源码补丁"
    - "TLS 后端选用已发布的 openssl，不用默认 gnutls"
    - "字符集转换固定 iconv（已发布的 libiconv），不用未发布的 icu4c"
    - "SASL 关闭（gsasl 无可用配方），如后续发布可重开"
  common_dependencies:
    - openssl
    - libiconv

versions:
  "1.1.0":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libwmime/1.1.0"
    note: "首次适配 grommunio/wmime wmime-1.1.0；发布前以真机预检与 CI 为准"
