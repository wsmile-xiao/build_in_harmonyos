version: "1.1.0"
software: libwmime
status: built
build_date: "2026-09-16"
build_system: "cmake"

source:
  url: "https://github.com/grommunio/wmime/archive/refs/tags/wmime-1.1.0.tar.gz"
  sha256: "799edc17de7ba7fb9ce70e09972e293dc412ab45232ccacc3e0b1a598f7285d6"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DVMIME_BUILD_TESTS=ON"
    - "-DVMIME_BUILD_SAMPLES=OFF"
    - "-DVMIME_HAVE_SASL_SUPPORT=OFF"
    - "-DVMIME_HAVE_TLS_SUPPORT=ON"
    - "-DVMIME_TLS_SUPPORT_LIB=openssl"
    - "-DVMIME_CHARSETCONV_LIB=iconv"
  dependencies:
    - openssl/3.5.8.1
    - libiconv/1.17
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Upstream tag is wmime-1.1.0 (grommunio/wmime fork of vmime); library target and SONAME follow wmime with SOVERSION 2."
  - "SASL disabled because gsasl has no published Conan recipe; TLS uses published openssl instead of default gnutls."
  - "Charset conversion pinned to iconv with published libiconv; icu4c is only built, not published."
  - "Upstream CppUnit suite (58 *Test.cpp) is enabled via VMIME_BUILD_TESTS and executed with ctest in build()."
