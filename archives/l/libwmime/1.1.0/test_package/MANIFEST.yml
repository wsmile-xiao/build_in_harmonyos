package: "libwmime/1.1.0"
homepage: "https://github.com/grommunio/wmime"

upstream_check_command: "ctest --output-on-failure -j1"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j1"

upstream_tests:
  - file: tests/parser/messageTest.cpp
    source: wmime/tests/parser/messageTest.cpp
    description: "Message construction, generation and parsing round-trip"
    command: "ctest -R message"
  - file: tests/parser/headerTest.cpp
    source: wmime/tests/parser/headerTest.cpp
    description: "RFC 5322 header field parsing and generation"
    command: "ctest -R header"
  - file: tests/parser/bodyTest.cpp
    source: wmime/tests/parser/bodyTest.cpp
    description: "MIME body and body-part handling"
    command: "ctest -R body"
  - file: tests/parser/datetimeTest.cpp
    source: wmime/tests/parser/datetimeTest.cpp
    description: "RFC 5322 date-time parsing"
    command: "ctest -R datetime"
  - file: tests/net/imap/IMAPParserTest.cpp
    source: wmime/tests/net/imap/IMAPParserTest.cpp
    description: "IMAP protocol parser"
    command: "ctest -R IMAP"
  - file: tests/net/smtp/SMTPCommandTest.cpp
    source: wmime/tests/net/smtp/SMTPCommandTest.cpp
    description: "SMTP command formatting"
    command: "ctest -R SMTP"

upstream_test_audit: >-
  Upstream ships 58 *Test.cpp files under tests/ (parser, net/imap, net/pop3,
  net/smtp, net/maildir, security, utility, misc), each registered as one ctest
  case plus a run-tests aggregate binary via VMIME_BUILD_TESTS=ON. The recipe
  enables VMIME_BUILD_TESTS and runs the full ctest suite in build();
  counts for the PR come from that real run, not from file counting.

test_package_tests:
  - id: "message-build"
    source: "test_message_build.cpp"
    command: "test_message_build"
    description: >-
      Build an RFC 5322 message with vmime::messageBuilder, generate raw text,
      and verify From/To/Subject/body round-trip with 6 CHECK-OK assertions.
  - id: "mime-parse"
    source: "test_mime_parse.cpp"
    command: "test_mime_parse"
    description: >-
      Parse a raw quoted-printable MIME message and verify header presence,
      RFC 2047 subject decoding and quoted-printable body decoding with 6
      CHECK-OK assertions.

test_counting:
  upstream_independent_total: 58
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 12
