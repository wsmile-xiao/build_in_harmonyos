software: libb64
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-24"

# 构建系统
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/libb64/libb64/libb64/libb64-1.2.1.zip"

  # 源码校验和（与 Homebrew / Gentoo dev-libs/libb64 三方交叉验证一致）
  sha256: "20106f0ba95cfd9c35a13c71206643e3fb3e46512df3e2efb2fdbf87116314b2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本次不修改任何上游源码，直接用 OHOS toolchain 编译真实 C 源文件）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "libb64 1.2.1 上游 Makefile 硬编码 gcc/ar 且带 -Werror -pedantic，不适合交叉编译；conanfile.py 直接调用 OHOS toolchain 编译 src/cencode.c 与 src/cdecode.c 两个真实源文件，不打补丁、不改上游"
- "公开 C 头文件位于 include/b64/：cencode.h（base64_init_encodestate/base64_encode_block/base64_encode_blockend）、cdecode.h（base64_init_decodestate/base64_decode_block）"
- "纯静态库 libb64.a，无系统同名库冲突风险（R26/G3 无需处理）"
- "上游 zip sha256=20106f0ba95cfd9c35a13c71206643e3fb3e46512df3e2efb2fdbf87116314b2，与 Homebrew homebrew-core Formula/lib/libb64.rb 及 Gentoo dev-libs/libb64/Manifest 三方一致"
- "上游 examples/c-example1.c 演示了完整 encode->decode 往返流程；test_package 据此编写真实功能测试"
- "base64_encode_blockend 会输出尾部换行，测试中需 trim 后比对"
- "许可证为 CC-PDDC（公有领域），非 BSD/GPL"

# ============================================================
# 上游测试核验（严格审计）
# ============================================================

# 正式自动化测试：全树搜索（4 个 Makefile + 全部文件名）实证不存在
# test/ tests/ 目录、make check/make test 目标、CMake/CTest、configure/autotools/meson 均无
upstream_automated_tests:
  exists: false
  test_source_files: 0
  test_targets: 0
  executed: 0
  passed: 0
  failed: 0
  skipped: 0

# 上游 examples（非正式测试套件，但作为功能验证实际编译运行）
upstream_examples:
  source_files: 2
  files:
    - examples/c-example1.c   # 硬编码 "hello world" encode->decode + strcmp 断言
    - examples/c-example2.c   # stdin -> 3 文件 encode/decode
  compiled: 2
  ran: 2
  passed: 0
  failed: 2
  results:
    - file: examples/c-example1.c
      compile: ok
      run: crash
      reason: "Assertion failed: strcmp(input, decoded) == 0 → Signal 6 (core dumped)；decode 返回 12B 而输入 11B"
    - file: examples/c-example2.c
      compile: ok
      run: ok_exit0
      reason: "但解码输出 12 字节 ≠ 输入 11 字节，多余尾字节 0x3e '>'（未做断言，故未 crash）"

# decode padding 行为根因
decode_padding_behavior:
  root_cause: "src/cdecode.c 将 '=' 映射到 skip 分支（如空白符），不作为终止符；'=' 不携带数据位但流式解码器忽略它，从残余部分位产生 1 个多余尾字节"
  is_real_upstream_behavior: true
  documented_in_readme: false
  upstream_example_c1_crashes: true
  strict_length_workaround: "strip '=' padding 后再 decode → cnt == ptlen + 逐字节一致（实证）"
