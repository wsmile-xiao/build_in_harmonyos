software: libb64
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-16"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/libb64/libb64/libb64/libb64-1.2.1.zip"

  # 源码校验和
  sha256: "20106f0ba95cfd9c35a13c71206643e3fb3e46512df3e2efb2fdbf87116314b2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Makefile项目无configure脚本和make install目标，需手动安装（cp到staging目录）"
  - "base64命令行工具名与coreutils base64冲突，需重命名为libb64-base64"
  - "base64_decode_block解码末尾多输出1字节为库的设计行为"
  - "zip格式源码包G0 clean-verify需特殊处理（tar xf不支持zip）"
  - "init-build从URL扩展名误判build_system为autotools，纯Makefile项目需手动修正为makefile"
