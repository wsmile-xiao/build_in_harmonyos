# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libb64/1.2.1
homepage: "https://libb64.sourceforge.net/"

# 上游正式自动化测试：0（全树搜索实证：无 test/ 目录、无 make check/test 目标、
# 无 CMake/CTest、无 configure/autotools/meson、无 test*.c 源文件）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: examples/c-example1.c
    source: "https://libb64.sourceforge.net/"
    description: "上游自带示例（非正式测试套件）：硬编码 'hello world' encode->decode + strcmp 断言。OHOS aarch64 实测运行崩溃：Assertion failed Signal 6（decode 返回 12B 而输入 11B）"
    command: "N/A"
    status: crash
  - file: examples/c-example2.c
    source: "https://libb64.sourceforge.net/"
    description: "上游自带示例（非正式测试套件）：stdin->3 文件 encode/decode。OHOS aarch64 实测可编译可运行 exit 0，但解码输出 12B ≠ 输入 11B（多余尾字节 0x3e，未做断言故未 crash）"
    command: "N/A"
    status: runs_but_overproduces

test_package_tests:
  - file: test_b64.c
    description: "真实功能测试（解码侧分两条明确分开的路径）：encode 固定字符串校验 + Path A padded 原始输入行为验证（不 strip '='，直接解码，记录并断言已知非严格上游行为 cnt≠ptlen）+ Path B strict round-trip（strip '=' 后 cnt==ptlen + memcmp 逐字节一致）+ 编码长度校验"
    command: "./test_b64"
    decode_contract: "libb64 1.2.1 流式解码器忽略 '=' padding（src/cdecode.c 将 '=' 映射到 skip 分支），padding 存在时 cnt=ptlen+1。test_package 分两条路径：Path A 直接解码 padded 输入，真实记录并断言该非严格上游行为（cnt≠ptlen，不冒充正确标准 padding 行为）；Path B strip '=' 后 decode，强制 cnt==ptlen + memcmp 逐字节一致。上游源码未修改"

assertion_count: 4
