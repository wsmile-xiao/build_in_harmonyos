# libb64 软件级 manifest
software: libb64
display: "libb64"
description: "libb64 是 ANSI C 编写的快速 Base64 编码/解码库，含 C++ 包装器和独立的编解码可执行程序"
homepage: "https://libb64.sourceforge.net/"
license: CC-PDDC
repository: "https://sourceforge.net/projects/libb64/"
category: library
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "上游 Makefile 硬编码 gcc/ar 且带 -Werror -pedantic，不适合交叉编译；conanfile.py 直接用 OHOS toolchain 编译 src/cencode.c 与 src/cdecode.c 两个真实源文件，不改动上游源码"
    - "公开 C 头文件位于 include/b64/：cencode.h、cdecode.h"
    - "纯静态库 libb64.a，无系统同名库冲突风险"
    - "许可证为 CC-PDDC（公有领域）"
  common_dependencies: []

# 版本索引
versions:
  "1.2.1":
    status: built
    build_date: "2026-08-24"
