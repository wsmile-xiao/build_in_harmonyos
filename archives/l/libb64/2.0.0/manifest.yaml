# ============================================================

knowledge_gained:
- "libb64 2.0.0 官方来源：GitHub stefantalpalaru/libb64（维护 fork，源出 sourceforge libb64），正式标签 v2.0.0（commit 293fb02，2016-07-19）；tarball sha256=28c43c47674409fc50e7145d4c2d26dc1f3d200889c41205e7812c2b67f26382"
- "2.0.0 API 相对 1.2.1 变化（头文件+实测核查）：encode/decode block 返回 size_t，入参 (const void*, size_t, ...) / (const char*, size_t, void*, ...)；新增 base64_encode_length() 与 base64_decode_maxlength() 辅助函数"
- "2.0.0 编码器状态含 chars_per_line（默认 BASE64_CENC_DEFCPL=0），base64_encode_blockend() 不再输出尾部换行（1.2.1 固定输出）"
- "2.0.0 padded decode 已修正 1.2.1 的 +1 尾字节缺陷：对 'SGVsbG8sIGxpYmI2NCE=' 直接解码返回 cnt==ptlen 且逐字节匹配；分块 streaming decode 同样精确"
- "上游 Makefile 依旧硬编码 gcc/ar + -Werror -pedantic，不适合 OHOS 交叉编译；沿用 1.2.1 镜像方案：conanfile.py 直接用 OHOS clang 编译 src/cencode.c 与 src/cdecode.c，llvm-ar 归档 libb64.a，零补丁"
- "ccommon.h 有 #elseif 拼写（合法替代 #elif 不存在，clang 报 warning 但非致命）；size_t 由 <stdlib.h> 提供"

