# test_package/MANIFEST.yml — libb64 2.0.0
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: libb64/2.0.0
homepage: "https://github.com/stefantalpalaru/libb64"

# 上游测试命令：2.0.0 全树 4 个 Makefile（Makefile / src / base64 / examples）
# 均无 check/test/ctest 目标，也无 test/ tests/ 目录、无 CMake/CTest/meson/autotools
upstream_check_command: "（无：上游源码树无任何自动化测试目标，见 notes.md 全树搜索实证）"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "（无）"

# 上游实际运行的测试程序：无正式测试，仅有 examples/ 示例
upstream_tests:
  - file: examples/c-example1.c
    source: libb64-2.0.0/examples/c-example1.c
    description: "硬编码 'hello world' encode->decode + strcmp 断言（2.0.0 padded decode 已修正，断言可过）"
    command: "./c-example1"
  - file: examples/c-example2.c
    source: libb64-2.0.0/examples/c-example2.c
    description: "stdin -> 3 文件 encode/decode 示例"
    command: "./c-example2"

# test_package 中自带的测试（消费者视角验证，真实链接并运行 libb64）
test_package_tests:
  - file: test_package/test_b64.c
    description: "真实功能测试：encode 期望值比对 / 无尾部换行 / padded decode 精确恢复 / 分块 streaming decode / 4 倍数长度 / 长度辅助函数"
    command: "./test_b64"

# 测试断言总数
assertion_count: 6