# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libabw/0.1.4
homepage: "https://wiki.documentfoundation.org/Development/libabw"

# 上游**没有**测试套件：顶层与各 src/*/Makefile.am 均无 TESTS / check_PROGRAMS
# 声明，tarball 内无 *test* 命名源文件（src/ 下只有 lib、conv、fuzz），
# 也不分发任何 AbiWord 样例文档（2026-09-14 对 0.1.4 tarball 实测）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_libabw.cpp
    description: >-
      消费者功能测试（库级）：自实现最小 librevenge::RVNGInputStream（同时验证
      消费者可把自己的流类型喂给 libabw），对 AbiDocument::isFileFormatSupported
      做负例（null / 空流 / 未压缩纯文本 / 任意二进制 / gzip XML 但根元素是外来名）
      与**正例**（预生成的 gzip 载荷：根元素 <abiword> 与 <awml> 各一条；
      以及**未压缩**的合法 <abiword> XML —— 流的 zlib 层在 inflate 失败时会回退为
      按原始字节读取，故两种形态都是合法输入，这一条由设备实测纠正了最初的错误假设），
      并验证 AbiDocument::parse 对不支持输入的失败契约。
      共 9 项断言，失败即非零退出。
    command: "./test_libabw"
  - file: test_package/test_libabw_cli.sh
    description: >-
      消费者功能测试（CLI 级）：对包内安装的 abw2text 真实调用——不存在的输入
      文件必须以非零码失败；纯文本（非 AbiWord 文档）必须被非零码拒绝且**不得**
      以信号终止，据此证明转换工具链接成功且其 librevenge 生成器依赖解析正确。
      共 4 项断言。
    command: "sh test_libabw_cli.sh <pkg>/bin/abw2text"

# 说明：上游不分发 AbiWord 样例文档，故"正例解析整篇文档"无法完成；格式识别侧
# 用**程序化生成的 gzip 载荷**做了正向断言（识别逻辑会先 gzip 解压再查根元素，
# 故正例必须是 gzip 流），工具侧验证了干净失败契约。
# 测试断言总数（近似值，用于质量评估）：库级 9 项 + CLI 级 4 项
assertion_count: 13
