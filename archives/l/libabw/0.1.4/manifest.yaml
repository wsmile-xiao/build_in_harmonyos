# 版本级 manifest —— libabw 0.1.4
# 遵循 ARCHIVE-SPEC v2.0

version: "0.1.4"
software: libabw

# 设备实机构建已通过 conan create 与 G0-G4 全部门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-14"
build_system: autotools

source:
  url: "https://dev-www.libreoffice.org/src/libabw/libabw-0.1.4.tar.xz"
  sha256: "fa2685a3440da6e03a66a778480d93cb95f6064e4541e58e37397680760fd6a0"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-musl --host=aarch64-unknown-linux-gnu（本 dist 的 config.sub 是 2024-05-27 版，aarch64 与 musl 都认，可直接用常规配对；不像 libwpd 的 2012 版需要四段名绕行）"
    - "--prefix=/（配合 DESTDIR 使 include/ 与 lib/ 直落包根）"
    - "--enable-static --disable-shared（R26 系统同名库默认静态）"
    - "--disable-dependency-tracking"
    - "REVENGE_* / REVENGE_GENERATORS_* / REVENGE_STREAM_* 与 LIBXML_* / ZLIB_* 五组 PKG_CHECK_MODULES 变量逐个导出（设备无 pkg-config，该宏在 CFLAGS 非空时短路）"
    - "librevenge 三个库经「只放 .a 的干净 -L 目录」引用（规避其 .la 记录 libdir='//lib' 导致 libtool 'was moved'）；libxml2 与 zlib 不产 .la，直接用各自包目录的 -L/-l —— libxml2 只有带版本号的共享库，复制符号链接会留下悬空链接"
    - "BOOST_CFLAGS + CPPFLAGS 注入 boost 头（libabw 自身 TU 需要 boost/algorithm、boost/optional、boost/spirit）"
    - "SHELL/CONFIG_SHELL=/data/service/hnp/bin/bash；configure 的 umask 077→022 改写；autotools 辅助脚本 chmod +x（E490）；TMPDIR 指向构建目录内 .tmp"
    - "CC/CXX 从 profile 的 tools.build:compiler_executables 显式导出"
  dependencies:
    - librevenge/0.0.5
    - libxml2/2.15.3.1
    - zlib/1.3.1
    - boost/1.90.0.3（tool_requires：仅自身 TU 使用 boost 头）
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libabw **不依赖 libwpd**（与本仓任务清单里的推测相反）：configure.ac 只查 librevenge / libxml-2.0 / zlib，源码与转换工具都不引用 libwpd。移植前应先读 configure.ac 而不是沿用同族包的依赖印象"
  - "把依赖库复制进「只放 .a 的干净链接目录」时要注意：libxml2 的包只提供**带版本号的共享库**（libxml2.so → libxml2.so.16 → libxml2.so.16.1.3），按 *.a/*.so 通配只会复制到那个 .so 符号链接本身，目标未复制，链接期报 'unable to find library -lxml2'。该干净目录只应用于产 .la 的依赖（librevenge 家族）；无 .la 的依赖直接用自己的 -L/-l"
  - "cpp_info.requires 的条目必须写成 <conan包名>::<组件>：不带 :: 的裸名会被当作**本包内部组件**（报 'requires to other internal components that are not defined'），而写 CMake 目标名（如 LibXml2::LibXml2）会因包名不匹配被拒（'not a direct requirement of the recipe'）。依赖包没有定义组件时，用 <包名>::<包名> 指代整包"
  - "静态库链接了**共享**依赖时，ctest 不能作为判据：libabw 静态库链共享 libxml2，ctest 不继承 conan 的运行时环境，直接跑会报按摩 'Error relocating ./test_libabw: xmlTextReaderConstName: symbol not found'。判据应由 self.run(<exe>, env=\"conanrun\") 承担（同时把逐条断言打进日志），ctest 注册保留给交互使用"
  - "上游的 zlib 流层在 inflate 失败时可能回退为按原始字节读取（libabw 的 ABWZlibStream 即如此），所以「未压缩的合法 XML」也是合法输入——不要凭「先解压再解析」的直觉把它写成负例，这类假设必须由设备实测确认"
