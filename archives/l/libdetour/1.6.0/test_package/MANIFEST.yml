package: libdetour/1.6.0
homepage: "https://github.com/recastnavigation/recastnavigation"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (Tests, Catch2)"
upstream_tests_exist: true
upstream_test_framework: "catch2"
upstream_test_count: 30
upstream_test_audit: "audited recastnavigation v1.6.0 tarball (URL+sha256 same as conandata.yml): Tests/CMakeLists.txt globs Tests/Detour/*.cpp and Tests/Recast/*.cpp into the Tests executable, links Recast+Detour, vendors Catch2 in Tests/Contrib, registers one ctest entry add_test(Tests Tests). Tests/Detour/Tests_Detour.cpp has 1 TEST_CASE (dtRandomPointInConvexPoly); Tests/Recast/Tests_Recast.cpp has 29 TEST_CASEs (rcSwap/rcMin/rcMax/rcAbs/rcSqr/rcClamp/rcSqrt/rcVcross/rcVdot/rcVmad/rcVadd/rcVsub/rcVmin/rcVmax/rcVcopy/rcVdist/rcVdistSqr/rcVnormalize/rcCalcBounds/rcCalcGridSize/rcCreateHeightfield/rcMarkWalkableTriangles/rcClearUnwalkableTriangles/rcAddSpan/rcRasterizeTriangle/rcRasterizeTriangle overlapping/rcRasterizeTriangle smaller/rcRasterizeTriangles/rcVector). Benchmark BM() cases are platform-conditional (__unix__+_POSIX_TIMERS) and not counted. Total 30 non-benchmark cases."

upstream_tests:
  - file: Tests/Detour/Tests_Detour.cpp
    source: Tests/Detour/Tests_Detour.cpp
    description: "upstream Catch2 suite - 1 TEST_CASE (dtRandomPointInConvexPoly)"
    command: "ctest --output-on-failure"
  - file: Tests/Recast/Tests_Recast.cpp
    source: Tests/Recast/Tests_Recast.cpp
    description: "upstream Catch2 suite - 29 TEST_CASEs (rc* vector/heightfield/rasterize)"
    command: "ctest --output-on-failure"

test_package_tests:
  - file: test_detour.cpp
    description: "links libdetour::libdetour, checks navmesh lifecycle, convex poly sample, query/vector helpers"
    command: "./libdetour_test"

assertion_count: 3
