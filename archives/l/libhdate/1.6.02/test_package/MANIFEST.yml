# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libhdate/1.6.02
homepage: "http://libhdate.sourceforge.net/"

# 上游测试命令 — libhdate 上游无独立 CI 单元测试套件（C 库 + 工具，
# 验证 = 构建 + 工具运行）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-21 本地实测）：
# - 上游无独立测试套件（无 make test 入口；源码含 src/ 库 + hcal/hdate
#   工具，autotools 构建）
# - 构建验证：configure（--build 三元组 + 绑定禁用）+ make——实测通过
# - 消费者验证（test_package）：test_libhdate.py——hdate 真实执行
#   （希伯来历法日期计算，OHOS 无环境限制）+ 库/头文件验证（R34）
upstream_tests: []
