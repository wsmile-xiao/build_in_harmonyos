software: librevisa
display: "librevisa"
description: "Free software implementation of the VISA instrument control standard"
category: system
homepage: "https://git.sr.ht/~sjr/librevisa"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "sourcehut 归档无 configure：build() 先 autoreconf -fi，automake/libtool 走 tool_requires"
    - "libusb/avahi/vxi 均为可选自动探测依赖，OHOS 缺失时回退到可移植核心"
    - "老 config.guess 不识别 HarmonyOS：显式 --build/--host=aarch64-unknown-linux-gnu"
    - "HMDFS umask 022 修复：生成 configure 中的 umask 077 全部替换"
  common_dependencies: []

versions:
  "0.0.20130812":
    status: built
    build_date: "2026-09-26"
