# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: librevisa/0.0.20130812
homepage: "https://git.sr.ht/~sjr/librevisa"

# 上游测试命令（真机池无 autoconf 套件，无法运行 automake harness；
# 同 22 个测试程序由配方直接以 CXX 编译链接并逐个运行）
upstream_check_command: "direct CXX compile, link and run of 22 tests programs"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "direct CXX compile, link and run of 22 tests programs"

# HMBS 上游测试存在性声明 (rule4 硬门禁)
upstream_tests_exist: true
upstream_test_total: 22
upstream_test_count_method: autotools_tests
upstream_test_audit: >-
  源码 tests/ 含 22 个 .c 测试文件；tests/Makefile.am 定义
  check_PROGRAMS = 22 个程序且 TESTS = $(check_PROGRAMS)；
  全部链接 tests/dummy.cpp 注册的 DUMMY 资源，无需真实仪器。
  真机池无 autoconf 套件（autoreconf 不存在，Conan autoconf 会拉起
  m4 源码构建并失败），故配方以 CXX 直接编译链接同一批 22 个程序并
  逐个运行，以进程退出码计数（0=通过），用例与上游一一对应。

# make check 实际运行的 22 个上游测试程序
upstream_tests:
  - file: find.c
    source: librevisa-3e3e027/tests/find.c
    description: "viFindRsrc 资源枚举 (DUMMY)"
    command: "./find"
  - file: lock_attr_exclusive.c
    source: librevisa-3e3e027/tests/lock_attr_exclusive.c
    description: "独占锁属性测试"
    command: "./lock_attr_exclusive"
  - file: lock_attr_global.c
    source: librevisa-3e3e027/tests/lock_attr_global.c
    description: "全局锁属性测试"
    command: "./lock_attr_global"
  - file: lock_attr_shared.c
    source: librevisa-3e3e027/tests/lock_attr_shared.c
    description: "共享锁属性测试"
    command: "./lock_attr_shared"
  - file: lock_invalid_mode.c
    source: librevisa-3e3e027/tests/lock_invalid_mode.c
    description: "非法锁模式测试"
    command: "./lock_invalid_mode"
  - file: lock_recursive_exclusive.c
    source: librevisa-3e3e027/tests/lock_recursive_exclusive.c
    description: "递归独占锁测试"
    command: "./lock_recursive_exclusive"
  - file: lock_recursive_shared.c
    source: librevisa-3e3e027/tests/lock_recursive_shared.c
    description: "递归共享锁测试"
    command: "./lock_recursive_shared"
  - file: open.c
    source: librevisa-3e3e027/tests/open.c
    description: "viOpen/viClose 基本会话测试"
    command: "./open"
  - file: open_multi.c
    source: librevisa-3e3e027/tests/open_multi.c
    description: "多会话打开测试"
    command: "./open_multi"
  - file: print.c
    source: librevisa-3e3e027/tests/print.c
    description: "viPrintf 格式化输出测试"
    command: "./print"
  - file: read.c
    source: librevisa-3e3e027/tests/read.c
    description: "viRead 读取测试"
    command: "./read"
  - file: rule_3_2_3.c
    source: librevisa-3e3e027/tests/rule_3_2_3.c
    description: "VISA 规范规则 3.2.3 测试"
    command: "./rule_3_2_3"
  - file: rule_3_3_2.c
    source: librevisa-3e3e027/tests/rule_3_3_2.c
    description: "VISA 规范规则 3.3.2 测试"
    command: "./rule_3_3_2"
  - file: rule_3_6_38.c
    source: librevisa-3e3e027/tests/rule_3_6_38.c
    description: "VISA 规范规则 3.6.38 测试"
    command: "./rule_3_6_38"
  - file: rule_3_7_3.c
    source: librevisa-3e3e027/tests/rule_3_7_3.c
    description: "VISA 规范规则 3.7.3 测试"
    command: "./rule_3_7_3"
  - file: rule_4_2_1.c
    source: librevisa-3e3e027/tests/rule_4_2_1.c
    description: "VISA 规范规则 4.2.1 测试"
    command: "./rule_4_2_1"
  - file: rule_4_2_2.c
    source: librevisa-3e3e027/tests/rule_4_2_2.c
    description: "VISA 规范规则 4.2.2 测试"
    command: "./rule_4_2_2"
  - file: rule_4_3_11.c
    source: librevisa-3e3e027/tests/rule_4_3_11.c
    description: "VISA 规范规则 4.3.11 测试"
    command: "./rule_4_3_11"
  - file: wait_immediate_noevents.c
    source: librevisa-3e3e027/tests/wait_immediate_noevents.c
    description: "无事件立即等待测试"
    command: "./wait_immediate_noevents"
  - file: wait_nenabled.c
    source: librevisa-3e3e027/tests/wait_nenabled.c
    description: "未使能事件等待测试"
    command: "./wait_nenabled"
  - file: wait_timeout.c
    source: librevisa-3e3e027/tests/wait_timeout.c
    description: "等待超时测试"
    command: "./wait_timeout"
  - file: write.c
    source: librevisa-3e3e027/tests/write.c
    description: "viWrite 写入测试"
    command: "./write"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_visa.c
    description: "consumer test: viOpenDefaultRM + viParseRsrc(rc) + viGetAttribute(RM_SESSION/RSRC_NAME) + viClose, 5 checks, no hardware (viStatusDesc has no implementation in this snapshot and must not be called)"
    command: "./test_visa"

# 测试断言总数 (上游 22 程序 + 消费者 5 断言)
assertion_count: 27
