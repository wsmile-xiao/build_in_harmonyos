knowledge_gained:
  - category: L1_平台真理
    issue: E007 - autotools config.guess 无法识别 HarmonyOS
    solution: 使用 patch-autotools-ohos.pl 补丁脚本添加 __OHOS__ 检测和 ohos-linux 三元组
    file: knowledge/platform-truths.md
  - category: L1_平台真理
    issue: HMDFS 临时文件创建限制
    solution: 使用 VPATH 构建（在 $TMPDIR 中构建）避免在源码目录创建临时文件
    file: knowledge/platform-truths.md
  - category: L2_模式经验
    pattern: autotools 项目在 HarmonyOS 上编译的标准流程
    solution: 补丁 config.guess/config.sub → VPATH 构建 → 静态库优先
    file: knowledge/pattern-experiences.md
  - category: L3_本版笔记
    note: libsodium 1.0.22 测试套件依赖动态库加载，在 HarmonyOS 上失败，静态库可用
    recommendation: 使用静态库链接方式编译依赖 libsodium 的应用

