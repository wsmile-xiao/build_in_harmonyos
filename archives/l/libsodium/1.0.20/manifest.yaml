version: "1.0.20"
software: "libsodium"
status: built
build_date: "2026-09-08"
build_system: autotools
conan_ref: "libsodium/1.0.20"

source:
  url: "https://download.libsodium.org/libsodium/releases/libsodium-1.0.20.tar.gz"
  sha256: "ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-dependency-tracking"
    - "--disable-shared"
    - "--enable-static"
  dependencies: []
  cc: clang
  cxx: clang++
  verified_architectures:
    - x86_64
    - armv8

patches_applied:
  - "0001-build-aux-config-guess.patch"
  - "0002-build-aux-config-sub.patch"

tests:
  upstream:
    build_command: "make check -j1 TESTS="
    run_command: "execute every test/default binary on the HarmonyOS target"
    total: 80
    passed: 80
    target: "HarmonyOS 6.0 x86_64 PC VM"
    armv8_compile_only: true
  consumer:
    command: "./test_sodium"
    assertions: 7
    passed: 7
    target: "HarmonyOS 6.0 x86_64 PC VM"
    armv8_compile_only: true

limitations:
  - "HarmonyOS shared=True is rejected because a shared library has not passed target runtime verification"

knowledge_gained:
  - "上游发布包自带完整 Autotools 生成文件，不需要在 HarmonyOS 构建机运行 autoreconf"
  - "config.guess 需要识别 HarmonyOS 的 uname 输出，config.sub 需要接受 linux-ohos 组合；交叉构建使用 SDK 提供的真实目标三元组"
  - "交叉编译让 configure 在构建主机执行，避免在 HarmonyOS HMDFS 上执行 Autotools 生成脚本"
  - "HarmonyOS HMDFS 会让 configure 的 umask 077 临时目录发生 UID 映射，config.status 因而无法访问 subs1.awk；运行 configure 前需将该掩码调整为 022"

patch_classification:
  - file: "0001-build-aux-config-guess.patch"
    type: portability
    platform_only: true
    guard: "Autotools platform detection"

  - file: "0002-build-aux-config-sub.patch"
    type: portability
    platform_only: true
    guard: "Autotools platform detection"
