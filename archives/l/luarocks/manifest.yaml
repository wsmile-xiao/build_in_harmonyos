# 软件级 manifest - luarocks
# 文件位置: archives/l/luarocks/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: luarocks

# 显示名
display: "LuaRocks"

# 一句话描述
description: "Lua package manager for installing Lua modules as self-contained packages"

# 分类标签
category: build-tool

# 官网 URL
homepage: "https://luarocks.org"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Pure Lua scripts, no native compilation needed"
    - "Requires Lua/LuaJIT interpreter"

  # 跨版本通用依赖
  common_dependencies:
    - lua

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.12.2":
    status: built
    build_date: 2026-05-27