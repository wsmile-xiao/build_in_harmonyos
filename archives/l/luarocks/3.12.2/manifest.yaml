# 版本级 manifest - luarocks 3.12.2
# 文件位置: archives/l/luarocks/3.12.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: luarocks

# 构建系统
build_system: autotools

# 版本号
version: "3.12.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/luarocks/luarocks/archive/refs/tags/v3.12.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-lua=/storage/Users/currentUser/usr/local"
    - "--lua-version=5.1"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - lua

  # 编译器
  cc: clang
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Pure Lua package, no native code compilation"
  - "Uses LuaJIT for Lua 5.1 compatibility"