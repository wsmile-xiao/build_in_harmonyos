patches:
  - patch_file: "patches/0001-unix-datestring2tm-portable-yearday.patch"
    patch_description: "Portable %Y-%j (year + day-of-year) parsing in _isds_datestring2tm: zeroed temp struct per attempt plus manual ordinal-day to month/day conversion with leap-year handling. glibc strptime %j normalizes tm_mon/tm_mday, musl/OHOS leave them untouched so stale values (e.g. tm_mon=34 from the failed %m parse of '2001-34') leak into the result."
    patch_type: "portability"
  - patch_file: "patches/0002-offline-utf82locale-c-codeset.patch"
    patch_description: "Behavior-driven C-locale utf82locale test: log nl_langinfo(CODESET), hard-require ASCII round-trip (guards the iconv path), probe the non-ASCII conversion — NULL expects NULL (glibc strict), UTF-8 codeset expects byte-identical round-trip (musl), lenient platform iconv that succeeds on unconvertible input is skipped explicitly with reason instead of failing."
    patch_type: "portability"
