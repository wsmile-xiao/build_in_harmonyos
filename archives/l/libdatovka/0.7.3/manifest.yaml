version: "0.7.3"
software: "libdatovka"
status: built
build_date: "2026-09-16"
build_system: "autotools"

source:
  url: "https://datovka.nic.cz/libdatovka/libdatovka-0.7.3.tar.xz"
  sha256: "a6924d4cea81a87d6201036cafebe1283a8d372193a99e731970abf21e1434c1"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--disable-doc"
    - "--enable-openssl-backend"
    - "--disable-nls"
    - "--disable-fatalwarnings"
    - "--with-libcurl"
    - "--enable-test"
  dependencies:
    - curl/8.15.0
    - libxml2/2.15.3.1
    - expat/2.8.2.1
    - openssl/3.5.6.1
    # json-c >= 0.9 hard-required by configure.ac but vendored as static
    # 0.18 (S3 tarball) in build(): conancenter/ohpcd RREV collision makes
    # preflight resolve CCI recipe (SYSTEM_NAME=OHOS unknown to cmake).
    # gnutls intentionally absent: only test/simline needs it, stubbed.
    # Build requirement (not listed as runtime dep): pkgconf/3.0.5
    # tool_requires — device has no system pkg-config; build() shims
    # bin/pkgconf as pkg-config (cassbeam/1.1 precedent).
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-unix-datestring2tm-portable-yearday.patch"
  - "patches/0002-offline-utf82locale-c-codeset.patch"

knowledge_gained:
  - "libdatovka uses openssl backend to avoid gpgme/libgcrypt chain"
  - "test/offline is the runnable upstream suite; test/online needs live ISDS credentials"
  - "configure umask 077 must be patched to 022 on HMDFS"
