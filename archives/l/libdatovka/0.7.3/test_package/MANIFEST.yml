package: libdatovka/0.7.3
homepage: "https://www.datovka.cz/cs/pages/libdatovka.html"

upstream_check_command: "make -C test/offline check"
upstream_test_in_build: true
upstream_test_command: "make -C test/offline check -j1"

upstream_tests:
  - name: offline-b64
    command: "make -C test/offline check (b64decode/b64encode round-trip)"
    expected: "pass"
  - name: offline-codec
    command: "make -C test/offline check (cencode/cdecode)"
    expected: "pass"
  - name: offline-isds-core
    command: "make -C test/offline check (isds, validator, physxml, multipart)"
    expected: "pass"
  - name: offline-datetime
    command: "make -C test/offline check (isds-datestring2tm, time_conversion)"
    expected: "pass, locale-sensitive (Alpine patches isds-datestring2tm/utf82locale for musl; OHOS evidence decides)"
  - name: offline-locale
    command: "make -C test/offline check (utf82locale)"
    expected: "pass, locale-sensitive"
  - name: online-suite
    command: "make -C test/online check (live ISDS network + credentials)"
    expected: "not run: needs live ISDS credentials and public network"
  - name: simline-harness
    command: "test/simline TLS sim-server harness (libserver links gnutls)"
    expected: "not built/run: gnutls chain (nettle->gmp) has no OHOS binary and its m4 build needs runner-absent /data/service/hnp/bin/bash; offline suite is the runnable evidence"

test_package_tests:
  - file: test.c
    description: "Link libdatovka and exercise isds_init/ctx_create/strerror/ctx_free/cleanup"
    command: "./test_libdatovka"

assertion_count: 5
