software: libgooglepinyin
display: "libgooglepinyin"
description: "Google 拼音输入法解码引擎库（源自 Android AOSP Google 拼音输入法）"
category: library
homepage: "https://code.google.com/archive/p/libgooglepinyin/"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "上游 data/ 构建步骤要运行刚编译的 dictbuilder 生成二进制词典；交叉编译无法运行目标架构工具，配方用构建机 CMake pass 先构建 dictbuilder 生成 dict_pinyin.dat，再经补丁的 prebuilt 路径安装"
    - "cmake_minimum_required(2.6) 在 CMake 4 下配置失败，已提升到 3.5"
    - "上游 install DESTINATION 为绝对路径，无法用 CMAKE_INSTALL_PREFIX 重定向，已改为相对路径"
    - "ENABLE_STATIC 改为 static/shared 二选一，使 Conan shared 选项真实生效"
  common_dependencies: []

versions:
  "0.1.2":
    status: built
    build_date: "2026-09-17"
    conan_ref: "libgooglepinyin/0.1.2"
