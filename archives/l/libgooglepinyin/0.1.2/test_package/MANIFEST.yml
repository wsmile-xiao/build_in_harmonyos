# Upstream and consumer test declaration for libgooglepinyin/0.1.2.

package: libgooglepinyin/0.1.2
homepage: https://code.google.com/archive/p/libgooglepinyin/

# Upstream test inventory (R51): the libgooglepinyin-0.1.2 tarball contains no
# test suite. Evidence: the archive holds only cmake/, data/, include/, src/
# and tools/; no CMakeLists.txt registers add_test or enable_testing, there is
# no tests/ or test/ directory, no check target and no unit-test source file.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_disabled_reason: >
  Upstream ships no test suite at all (inventory evidence above), so there is
  nothing to run. Consumer validation is provided by test_package, which
  exercises the decoding engine end to end against the packaged dictionary.

upstream_tests: []

test_package_tests:
  - file: test_package/test_libgooglepinyin.cpp
    description: >
      C++ consumer links the packaged libgooglepinyin, opens the packaged
      binary dictionary with im_open_decoder, searches "nihao" with im_search,
      requires a non-zero candidate count, requires im_get_candidate to return
      a real string, and requires U+4F60 U+597D ("ni hao") to appear in the
      top candidates before closing the decoder.
    command: >
      conan create (test_package builds and executes test_libgooglepinyin
      when target execution is available; cross builds verify compile/link)
    status: "OHOS native execution passed (see notes.md verification log)"

assertion_count: 4
