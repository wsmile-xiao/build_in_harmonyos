sources:
  "0.1.2":
    url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/libgooglepinyin/libgooglepinyin-0.1.2.tar.bz2"
    sha256: "1a339ae45721a60b9fadd15e43c34b9bb27af3bb999c00ed0d88b4084cfd0637"

patches:
  "0.1.2":
    - patch_file: "patches/0001-raise-cmake-minimum-version.patch"
      patch_description: "Raise cmake_minimum_required to 3.5 so CMake 4 can configure the project"
      patch_type: "portability"
    - patch_file: "patches/0002-relative-install-destinations.patch"
      patch_description: "Install headers, library and data under relative destinations so staged installs honor CMAKE_INSTALL_PREFIX"
      patch_type: "portability"
    - patch_file: "patches/0003-exclusive-static-shared-library.patch"
      patch_description: "Make ENABLE_STATIC select exactly one static or shared googlepinyin library, and pin the shared library SONAME because the HarmonyOS platform module skips versioned sonames"
      patch_type: "portability"
    - patch_file: "patches/0004-prebuilt-dictionary-for-cross-builds.patch"
      patch_description: "Install a packaged dict_pinyin.dat when present so builds do not execute the target-ABI dictbuilder tool"
      patch_type: "portability"
