package: libgravatar/25.12.3
homepage: "https://invent.kde.org/pim/libgravatar"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"
upstream_tests:
  - file: autotests/gravatarcachetest.cpp
    source: libgravatar-25.12.3/autotests/gravatarcachetest.cpp
    description: "Gravatar positive and negative cache behavior"
    command: "./autotests/gravatarcachetest"
  - file: autotests/gravatarconfiguresettingsdialogtest.cpp
    source: libgravatar-25.12.3/autotests/gravatarconfiguresettingsdialogtest.cpp
    description: "Configuration dialog defaults"
    command: "./autotests/gravatarconfiguresettingsdialogtest"
  - file: autotests/gravatarconfiguresettingswidgettest.cpp
    source: libgravatar-25.12.3/autotests/gravatarconfiguresettingswidgettest.cpp
    description: "Configuration widget behavior"
    command: "./autotests/gravatarconfiguresettingswidgettest"
  - file: autotests/gravatardownloadpixmapdialogtest.cpp
    source: libgravatar-25.12.3/autotests/gravatardownloadpixmapdialogtest.cpp
    description: "Pixmap download dialog behavior"
    command: "./autotests/gravatardownloadpixmapdialogtest"
  - file: autotests/gravatardownloadpixmapwidgettest.cpp
    source: libgravatar-25.12.3/autotests/gravatardownloadpixmapwidgettest.cpp
    description: "Pixmap download widget behavior"
    command: "./autotests/gravatardownloadpixmapwidgettest"
  - file: autotests/gravatarresolvurljobtest.cpp
    source: libgravatar-25.12.3/autotests/gravatarresolvurljobtest.cpp
    description: "URL resolver job behavior"
    command: "./autotests/gravatarresolvurljobtest"

test_package_tests:
  - file: test_gravatar.cpp
    description: "Consumer checks for email, backend options, default-pixmap options and image-size bounds"
    command: "./test_gravatar"
  - file: test_harmonyos_cache.cpp
    description: "On-device cache-directory creation and real file write/read/removal on HarmonyOS"
    command: "./test_harmonyos_cache"

assertion_count: 21
