# test_package/MANIFEST.yml — libobjfwrt1 1.5.7 适配验证清单
#
# 上游测试来源声明：
#   - build_system: autotools（configure.ac，ObjFW 1.5.7）
#   - 上游 make check：tests/ 84 个 .m 测试文件（与 libobjfw1 同源）
#   - 本适配以消费者用例为准（runtime objc_* API roundtrip）
#
# test_package 消费者用例（新增）：
#   test_objfwrt.c — 运行时头文件可包含 + objc_class/objc_allocateClassPair
#                    编译链接 + 生命周期（4 断言）
package: libobjfwrt1/1.5.7
homepage: https://objfw.nil.im/

upstream_test_in_build: true
upstream_tests:
  - name: objfw-testsuite
    count: 84
    note: "tests/ 84 个 .m 测试文件（make check，与 libobjfw1 同源）"
test_package_tests:
  - name: objfwrt-api-roundtrip
    command: "./test_objfwrt"
    assertions:
      - "ObjFWRT.h 可包含（objc_* API 声明可用）"
      - "objc_class 查询编译链接通过"
      - "objc_allocateClassPair 符号可解析"
      - "生命周期完整（不崩溃）"
