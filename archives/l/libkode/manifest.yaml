# 软件级 manifest — libkode
# File location: archives/l/libkode/manifest.yaml

software: libkode
display: "libkode"
description: "C++/Qt 库，用于程序化 C++ 代码生成与 XML/XSD 模式解析（kode 项目与 KDSOAP 共用）"
category: library
homepage: "https://github.com/cornelius/libkode"
license: LGPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "需要 Qt6（Core/Network/Xml/Test）：-Dlibkode_QT6=ON 走 Qt6 路径，qtbase/6.11.1 提供所需模块"
    - "qtbase 使用 cmake_find_mode=none，需手工写 conan_cmakedeps_paths.cmake 预置 CMAKE_PREFIX_PATH 使 find_package(Qt6) 生效"
    - "上游无 install() 规则，0001-add-install-rules.patch 补齐三个静态库与头文件的安装"
    - "纯逻辑 QtTest 测试（3 个 ctest 条目），在 ctest 内以 offscreen QPA 运行，无窗口/网络依赖"
  common_dependencies:
    - qtbase

versions:
  "0.0-git20251106.580356d":
    status: built
    build_date: "2026-09-26"
    conan_ref: "libkode/0.0-git20251106.580356d"
