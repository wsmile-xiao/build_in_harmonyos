version: "0.0-git20251106.580356d"
software: "libkode"
status: built
build_date: "2026-09-26"
build_system: cmake

source:
  url: "https://github.com/cornelius/libkode/archive/580356d2a2f0d890e5482808f578874ad3900442.tar.gz"
  sha256: "30a52fb888592686cb8c2eeb970cbe9d86dcd02f90c4e553ee50e2a770c00a33"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-Dlibkode_QT6=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies:
    - qtbase/6.11.1
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-add-install-rules.patch (add install() rules for kode/xmlcommon/xmlschema static libs + headers)"

knowledge_gained:
  - "libkode builds three STATIC libraries (kode, xmlcommon, xmlschema) against Qt6. The upstream top-level sets libkode_LIBRARY_QTID but the subdir set_target_properties use ${kode_LIBRARY_QTID} (variable-name mismatch), so QTID is always empty and the archives are named exactly libkode.a / libxmlcommon.a / libxmlschema.a (no -qt6 suffix)"
  - "Upstream requires Qt6 Core/Network/Xml/Test; qtbase/6.11.1 ships FEATURE_testlib=ON so find_package(Qt6 ... Test) resolves via prepending qtbase lib/cmake to CMAKE_PREFIX_PATH"
  - "qtbase uses cmake_find_mode=none, so the recipe writes conan_cmakedeps_paths.cmake manually for find_package(Qt6) (adwaita-qt/alkimia/accessibility precedent)"
  - "Upstream upstream ships no install() rules; an install patch packages libs + flat include/ headers"
  - "Upstream autotests = 3 QtTest ctest entries (tst_xmlelement/tst_element/tst_group), pure logic (copy/move/assignment), run via ctest with offscreen QPA"

