software: libitl-gobject
display: "libitl-gobject (GObject bindings for ITL)"
description: "GObject bindings for the ITL library — Hijri calendar, prayer times and Qibla direction"
category: library
homepage: "https://github.com/aelmahmoudy/libitl-gobject"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 tag 归档无生成好的 Autotools 文件，必须 autoreconf 引导（automake/1.18 + libtool/2.5.4 tool_requires，分步执行生成器）"
    - "pkg.m4 / introspection.m4 随配方 vendoring，否则 autoconf 报 possibly undefined macro"
    - "config.guess/config.sub 不认 HarmonyOS，需按 E007 打补丁（禁用 --build/--host 绕过）"
    - "libitl 与 libitl-gobject 头文件在 Conan 下分属两个 prefix，itl-gobject.h 的裸 #include <hijri.h> 需加 itl/ 前缀"
    - "basic_layout 为 VPATH 构建，src/Makefile.am 手写 glib-mkenums 规则需补 $(srcdir)/"
    - "LDFLAGS 只放 -L，塞入具体 .so 会让 configure 探针因 DT_NEEDED 解析失败而误报 cannot run C compiled programs"
    - "阶段一关闭 introspection（gir/typelib 生成需 g-ir-scanner，另行立项）"
  common_dependencies:
    - "libitl/0.8.0"
    - "glib/2.84.0.1"

versions:
  "0.3":
    status: published
    build_date: "2026-09-14"
