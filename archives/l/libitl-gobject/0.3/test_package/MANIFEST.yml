# test_package/MANIFEST.yml
package: libitl-gobject/0.3
homepage: "https://github.com/aelmahmoudy/libitl-gobject"

# 上游没有测试套件：任何 Makefile.am 都没有 TESTS 变量，src/ 下只有库源码与
# 两个 glib-mkenums 模板，仓库自带的 test.js 是 gjs 绑定示例而非自动化测试。
# build() 仍按 TEST_QUALITY_SPEC §3.1 调用上游 `make check` 目标
# （零注册用例，用于守住 check 机制本身不被破坏）。
upstream_check_command: "make check"

upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests: []

test_package_tests:
  - file: test.c
    description: >-
      Consumer API surface, linked against the packaged libitl_gobject.so via
      the CMakeDeps target: itl_G2H/itl_H2G Umm al-Qura round trip with golden
      values, itl_h_date/itl_g_date, both directions of the itl_HijriGreg
      dispatcher, ItlPrayer GType/instance/GOBJECT_IS_PRAYER, setLocation
      (longitude, latitude) + setMethod, getNorthQibla, getPrayerTimes
      (6 ordered GDateTime values, Fajr..Isha) and getNextDayFajr.
    command: "./test_libitl_gobject"

# 实测输出 “40 assertion(s), 0 failure(s)”。
assertion_count: 40
