# conandata.yml — libitl-gobject 0.3
# 源码 URL 为上游 GitHub 官方 tag 归档（tag 0.3 = master HEAD c6d96f1e）。
# 该归档与 Debian orig.tar.gz 内容一致（sha256 相同）。

sources:
  url: "https://github.com/aelmahmoudy/libitl-gobject/archive/refs/tags/0.3.tar.gz"
  sha256: "7195315a05094e4741b2df5f167a2b103bc532a35f3156883d82dbf949e4af8f"

patches:
  - patch_file: "patches/0001-src-Makefile.am.patch"
    patch_description: >-
      src/Makefile.am 硬编码 Debian 系统路径 -I/usr/include/itl（itl-gobject.h 用
      #include <hijri.h>，而 libitl 包头文件装在 <prefix>/include/itl/）。改为由消费者
      CPPFLAGS 提供该目录，避免注入系统级路径。
    patch_type: "portability"
  - patch_file: "patches/0002-libitl-gobject.pc.in.patch"
    patch_description: >-
      修正上游 .pc 的链接名：实际库文件是 libitl_gobject.so（下划线），
      原 .pc 写的是 -litl-gobject（连字符），消费者按 pkg-config 链接必然失败。
    patch_type: "portability"
  - patch_file: "patches/0003-src-Makefile.am-vpath.patch"
    patch_description: >-
      src/Makefile.am 两条手写的 glib-mkenums 规则把模板与头文件写成相对路径
      （$@.in / itl-gobject.h），没有 automake 自动补的 $(srcdir)。在 VPATH
      （out-of-tree）构建下 make 的工作目录是 build-<type>/src，文件实际在
      <srcdir>/src，规则必然报 FileNotFoundError: itl-gobject-enums.c.in。
      补上 $(srcdir)/ 前缀后源码内构建与 VPATH 构建都成立。
    patch_type: "portability"
  - patch_file: "patches/0004-itl-gobject.h-include-prefix.patch"
    patch_description: >-
      公共头 itl-gobject.h 用 #include <hijri.h> / <prayer.h> 引 libitl 的头文件。
      上游把 libitl 与 libitl-gobject 的头文件装在同一个 $(includedir)/itl 目录，
      所以裸文件名能命中；Conan 下两者是各自独立的 prefix，libitl 的 cpp_info 只导出
      include/（头文件实际在 include/itl/），裸文件名必然找不到。改为补 itl/ 前缀，
      只用双方 cpp_info 已声明的公共 include 目录即可解析（CMakeDeps 与 PkgConfigDeps
      一致），不需要往 cpp_info 里塞依赖包的绝对路径。
    patch_type: "portability"
