# 版本级 manifest — libitl-gobject 0.3

version: "0.3"
software: "libitl-gobject"
status: built
build_date: "2026-09-14"
build_system: "autotools"

source:
  url: "https://github.com/aelmahmoudy/libitl-gobject/archive/refs/tags/0.3.tar.gz"
  sha256: "7195315a05094e4741b2df5f167a2b103bc532a35f3156883d82dbf949e4af8f"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--disable-introspection"
  dependencies:
    - "libitl/0.8.0"
    - "glib/2.84.0.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-src-Makefile.am.patch"
  - "0002-libitl-gobject.pc.in.patch"
  - "0003-src-Makefile.am-vpath.patch"
  - "0004-itl-gobject.h-include-prefix.patch"

knowledge_gained:
  - "上游 tag 归档不含 configure/Makefile.in/aclocal.m4/ltmain.sh/m4/，autoreconf 引导是强制前置；OHOS 下需分步执行各生成器绕开 HMDFS autoconf.m4f 冲突"
  - "configure.ac 用到 PKG_CHECK_MODULES 与 GOBJECT_INTROSPECTION_CHECK，对应 pkg.m4/introspection.m4 需随配方 vendoring（不在构建机默认 aclocal 路径）"
  - "上游把 libitl 与 libitl-gobject 头文件都装进同一 $(includedir)/itl；Conan 下二者是独立 prefix，itl-gobject.h 内的裸 #include <hijri.h> 不再命中，补丁 0004 改为 <itl/hijri.h>/<itl/prayer.h>，只用双方 cpp_info 已声明的公共目录解析（优于往 cpp_info 里塞依赖包绝对路径）"
  - "src/Makefile.am 硬编码 Debian 系统路径 -I/usr/include/itl，需补丁移除"
  - "上游 .pc 的链接名 -litl-gobject 与实际库文件 libitl_gobject.so 不符，需补丁修正"
  - "basic_layout 下 autotools 是 VPATH（out-of-tree）构建：src/Makefile.am 里手写规则的输入文件必须补 $(srcdir)/，否则 make 在 build 目录找不到 itl-gobject-enums.*.in（补丁 0003）"
  - "src/Makefile.am 用裸名 glib-mkenums 生成 enums 源；PATH 中 glib 包外的同名 perl 脚本（shebang 指向不存在的 /usr/bin/perl）会抢先，包装器目录必须在 conanbuild.sh 最后 source 的脚本里前置 PATH——profile [buildenv] 的 PATH=+(path) 会覆盖配方早先的前置"
  - "config.guess/config.sub（automake/libtool 自带）不识别 HarmonyOS，报 cannot guess build type；按 E007 给两脚本打补丁而非用 --build/--host 绕过（绕过会被判为交叉编译，跳过全部 AC_RUN_IFELSE，生成错误 config.h）"
  - "configure 探针报 cannot run C compiled programs 时，真因常是探针带上了无法解析的 DT_NEEDED（如把 <glib>/lib/libintl.so 绝对路径塞进 LDFLAGS → exit 127）；真实链接所需的 -lintl 应由 glib-2.0.pc 的 Libs: 提供，LDFLAGS 只放 -L 搜索路径"
  - "OHOS 上 autoconf 现生成的脚本在 HMDFS 丢失执行位（Error 126），需补回 S_IXUSR|S_IXGRP|S_IXOTH 并用 sh \"<abs>/configure\" 显式调用（同 pcre2 先例）；同时把生成文件里的 umask 077 改成 022 以避开 E011/E114"
  - "OHOS 上编译器的 stdout/stderr 若是管道，编译会静默失败（日志从回显的编译行直接跳到 make/cmake 的 Error 1，无任何诊断；零延迟重试也无效）——需把 make（配方）与 cmake（test_package）的输出分别绑到文件再回显，输出绑文件后全链路一次通过"
  - "GOBJECT_INTROSPECTION_CHECK 默认 auto，PKG_CONFIG_PATH 无 gobject-introspection-1.0 时自动 HAVE_INTROSPECTION=false，gir/typelib 块整体跳过（阶段一即以此关闭 introspection）"
  - "ITL 0.8.0 的 itl_G2H/itl_H2G 形参名写作 (yg,mg,dg) 但实现按位置取 (day,month,year)；实测 itl_G2H(28,7,2026) == 1448-02-14、itl_H2G(14,2,1448) == 2026-07-28，按形参名传参会得到垃圾值甚至死循环"
  - "itl_prayer_setLocation 的顺序是 (longitude, latitude, gmtDiff, dst)；getNorthQibla 返回 ITL 自身约定角度（阿布扎比 99.886°，与大圆方位角 260.1° 互补），断言时不能用地理方位角"
