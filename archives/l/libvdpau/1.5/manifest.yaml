# 版本级 manifest — libvdpau 1.5
# 遵循 ARCHIVE-SPEC v2.0

version: "1.5"
software: "libvdpau"

# published | built | failed | archived
# built: conan-verify + W3 全过；upload 待 PR 合并后 release 流水线执行
status: built
conan_ref: "libvdpau/1.5"

build_date: "2026-09-18"
build_system: meson

source:
  url: "https://gitlab.freedesktop.org/vdpau/libvdpau/-/archive/1.5/libvdpau-1.5.tar.gz"
  sha256: "66490802f30426d30ff9e8af35263bbbbaa23b52d0a2d797d06959c3d19638fd"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Ddri2=true"
    - "-Ddocumentation=false"
    - "-Dwrap_mode=nodownload"
  dependencies:
    - libx11/6.4.0
    - libxext/6.4.0.1
    - xorgproto/2025.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-trace-declare-x11-dependency.patch"

knowledge_gained:
  - "mesa_dri2.c 头文件全部可由 conan 依赖提供: Xlibint.h←libx11, Xext.h/extutil.h←libxext, dri2{proto,tokens}.h←xorgproto (dri2proto 已并入 xorgproto)"
  - "MesonToolchain 在 machine file 写死 pkg_config_path=generators 目录, meson 用其替换 env PKG_CONFIG_PATH → 依赖经 buildenv_info 暴露的 pc 目录被遮蔽; 后处理 ini 改写为列表可解决"
  - "meson install 重写 .so (剥 build rpath) 使链接器 OHOS 自签失效, XPM 拒绝加载 (Permission denied); package() 内 llvm-objcopy 剥旧 .codesign + binary-sign-tool -selfSign 1 重签"
  - "musl 无 secure_getenv/__secure_getenv, 上游 util.h 自动回退 getenv_wrapper (getuid==geteuid 检查), 无需补丁"
  - "上游唯一导出符号 vdp_device_create_x11: 测试用 VDPAU_DRIVER=<不存在驱动> 驱动完整 dlopen 分发链并断言 VDP_STATUS_NO_IMPLEMENTATION"
  - "meson test 需 conanrun 环境 (host 依赖 libdir), conanbuild 不携带; 用 self.run('meson test …', env='conanrun') 可让上游 dlclose 测试真实走到 XOpenDisplay 才 SKIP(77)"
