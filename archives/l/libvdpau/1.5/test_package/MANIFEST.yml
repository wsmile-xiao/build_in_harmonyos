# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI build_and_test.sh L0e 强制要求)
#
# 上游测试清点 (R51 三步法, 详见 ../notes.md):
#   libvdpau 1.5 meson 注册的全部测试 = 1 项: test/dlclose.c ('dlclose')
#   - 文件描述符泄漏回归测试: dlopen("src/libvdpau.so") + XOpenDisplay +
#     vdp_device_create_x11, 最后比对 /proc/self/fd 数量
#   - 无 X server 时 XOpenDisplay(NULL) 返回 NULL → 程序自身 return SKIP(77)
#     (上游内置的跳过路径, meson 报告为 SKIP)
#   - 本仓 CI worker 为 OpenHarmony PC, 无 X11 server → 实测出口即 SKIP

package: libvdpau/1.5
homepage: "https://gitlab.freedesktop.org/vdpau/libvdpau"

upstream_check_command: "meson test --list"
upstream_test_command: "meson test"

# conanfile.py build() 方法中已集成上游测试 (meson.test())
upstream_test_in_build: true

upstream_tests:
  - file: test/dlclose.c
    source: libvdpau-1.5/test/dlclose.c
    description: "FD 泄漏回归测试: dlopen 加载包装库+X 显示连接后 dlclose, 比对 fd 数量; 无 X 显示时上游自身返回 SKIP(77)"
    command: "meson test"

test_package_tests:
  - file: test.c
    description: "消费者视角: 链接 libvdpau.so 并调用 vdp_device_create_x11, 校验 dlopen 分发链返回 VDP_STATUS_NO_IMPLEMENTATION"
    command: "./test_libvdpau"

assertion_count: 6
