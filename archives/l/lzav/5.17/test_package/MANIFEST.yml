# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lzav/5.17
homepage: "https://github.com/avaneev/lzav"

# 上游测试命令：lzav 5.17 官方 tag 为 header-only 单文件库，
# 源码仅含 LICENSE/README.md/lzav.h，无测试目录、无 Makefile/CMake、
# 无上游测试程序或测试脚本（已用 tar 清单 + 源码 grep 全量枚举核验）。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（官方 tag 无任何测试入口，故为空表）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证 + 鸿蒙专项)
test_package_tests:
  - file: test.c
    description: "消费者验证：include 安装后的公开头文件 lzav.h，调用 lzav_compress_bound/lzav_compress_default/lzav_decompress 完成 1MiB 往返压缩-解压并校验结果，另验证畸形输入安全拒绝"
    command: "./lzav_consumer_test"
  - file: test_ohos.c
    description: "鸿蒙专项测试：__OHOS__ 编译守卫 + uname 运行时核验 HarmonyOS + 1MiB 压缩往返，验证库在 OHOS 消费者路径真实运行"
    command: "./lzav_ohos_test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4