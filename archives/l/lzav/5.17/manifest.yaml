# 版本级 manifest
# 文件位置: archives/{letter}/{name}/5.17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.17"

# 软件名
software: "lzav"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "headeronly"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub release tag 源）
  url: "https://codeload.github.com/avaneev/lzav/tar.gz/refs/tags/5.17"

  # 源码校验和
  sha256: "b56a854a878fae9ca02793f9ac09a1b555d0801bde7897d8caace5cd88901b90"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | headeronly
  system: headeronly

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
