software: libplist
version: "2.7.0"
status: built
build_date: "2026-09-17"
conan_adapt_date: "2026-09-17"
compile_date: "2026-09-17"
build_system: autotools

source:
  url: "https://github.com/libimobiledevice/libplist/releases/download/2.7.0/libplist-2.7.0.tar.bz2"
  sha256: "7ac42301e896b1ebe3c654634780c82baa7cb70df8554e683ff89f7c2643eb8b"
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--without-cython"
    - "--with-tools"
    - "--with-tests"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libplist 2.7.0 has no external Conan dependencies; libcnary is bundled."
  - "autoconf config.status needs a private mktemp wrapper on HarmonyOS HMDFS."
  - "config.guess needs --build=aarch64-unknown-linux-gnu for HarmonyOS."
  - "The pkg-config and CMake file name is libplist-2.0."
  - "The package also exports the upstream plistutil CLI, so it is cataloged as a tool while retaining the libplist library."
  - "The HarmonyOS consumer test covers the new Unix timestamp API and temp-file IO."
