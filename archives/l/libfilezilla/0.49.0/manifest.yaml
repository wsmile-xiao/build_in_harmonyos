package_date: "2026-06-05"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://download.savannah.nongnu.org/releases/libfilezilla/libfilezilla-0.49.0.tar.xz"
  sha256: ""
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  dependencies:
    - gmp/6.3.0
    - libtasn1/4.19.0
    - nettle/3.10.2
    - hogweed/3.10
    - gnutls/3.8.9
    - brotli/1.2.0

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure.patch"
  - "0002-lib-impersonation.cpp.patch"
  - "0003-lib-iputils.cpp.patch"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libfilezilla-0.49.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libfilezilla-0.49.0.work
  source_orig_hash: 25b2bb0650865607
  source_work_hash: a59acf8dac152db4
  generated_at: '2026-06-05T14:12:38'
  patches_count: 3

patch_classification:
  - file: 0001-configure.patch
    type: platform
    platform_only: true
    guard: '#ifdef __OHOS__'
    description: "umask 077 -> umask 022 修复 HMDFS 权限问题"
  - file: 0002-lib-impersonation.cpp.patch
    type: platform
    platform_only: true
    guard: '#ifdef __OHOS__'
    description: "musl libc 不支持 shadow 密码线程安全函数"
  - file: 0003-lib-iputils.cpp.patch
    type: platform
    platform_only: true
    guard: '#ifdef __OHOS__'
    description: "sockaddr_storage 重定义冲突修复"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "musl libc 不支持 shadow 密码线程安全函数 getspnam_r/crypt_r"
  - "HMDFS 临时目录问题：必须设置 TMPDIR，推荐使用 ~/tmp"
  - "内核头文件 linux/socket.h 与 sys/socket.h 的 sockaddr_storage 重定义冲突"
  - "gnutls 需要 nettle 启用公钥加密功能（使用 mini-gmp 或 gmp）"
  - "umask 077 导致 HMDFS 权限失败，需修改为 umask 022"

# ============================================================
# 功能测试结果
# ============================================================

functional_test:
  date: "2026-06-05"
  total_tests: 18
  passed: 18
  failed: 0
  modules_tested:
    - time
    - encode
    - buffer
    - file
    - json
    - iputils
    - hash
  conclusion: "所有核心功能正常，libfilezilla 在 HarmonyOS 上可用"

# ============================================================
# 环境变量设置（用户部署参考）
# ============================================================

environment_setup:
  tmpdir:
    recommended: "/storage/Users/currentUser/tmp"
    alternative: "/data/storage/el/base/cache"
    reason: "HMDFS 系统中 /tmp 只读，需要设置可写的临时目录"
  ld_library_path:
    value: "/storage/Users/currentUser/usr/local/lib"
    reason: "包含 gnutls, nettle, brotli 等依赖库"