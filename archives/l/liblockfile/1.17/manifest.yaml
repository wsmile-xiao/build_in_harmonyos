software: liblockfile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.17"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# 构建系统类型（兼容旧格式）
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.debian.org/debian/pool/main/libl/liblockfile/liblockfile_1.17.orig.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"  # HMDFS umask 权限修复
  - "0002-dotlockfile.c.patch"  # 处理 getpwuid 返回 NULL
  - "0003-lockfile.c.patch"  # HMDFS 不支持硬链接，使用 open(O_EXCL) 替代

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HMDFS 不支持硬链接，link() 操作会返回 EPERM"
  - "HMDFS 的 hmmac 强制访问控制限制 umask 077 创建的文件权限"
  - "鸿蒙系统用户 ID 可能没有用户名映射，getpwuid 可能返回 NULL"
  - "原子锁创建应使用 open(O_CREAT|O_EXCL) 替代 link()"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/liblockfile-1.17.orig
  source_work_dir: /storage/Users/currentUser/builds/liblockfile-1.17.work
  source_orig_hash: 8437bcb2e05db4b3
  source_work_hash: e6b3019ab4a74fd0
