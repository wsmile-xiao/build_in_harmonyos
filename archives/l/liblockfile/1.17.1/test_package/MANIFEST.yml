# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: liblockfile/1.17.1
homepage: "https://github.com/miquels/liblockfile"

# 上游测试命令 (实际为 make test，内部调用 run-tests.sh；上游无 make check 目标)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: run-tests.sh
    source: liblockfile-1.17/run-tests.sh
    description: "锁创建/重复加锁/解锁/带命令加锁/超时加锁等场景的 shell 测试"
    command: "./run-tests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 lockfile_create/lockfile_check/lockfile_remove 真实 API 验证锁生命周期"
    command: "./test_liblockfile"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
