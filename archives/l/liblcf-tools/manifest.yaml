# liblcf-tools software manifest
software: liblcf-tools
display: "liblcf-tools"
description: "Command-line tools for converting and extracting RPG Maker 2000/2003 LCF data"
category: utility
homepage: "https://github.com/EasyRPG/liblcf"
license: MIT

build_system: cmake
package_type: application

ohos_adaptation:
  key_points:
    - "采用上游 CMake/C++17 路线；LIBLCF_ENABLE_TOOLS=ON 安装 lcfstrings 和 lcf2xml。"
    - "使用 Conan 的 expat/2.8.2.1、inih/r58 和静态 icu4c/77；通过 ICU 避免无 ICU 编码转换路径在 OHOS locale 下的兼容性问题。"
    - "OHOS ELF 工具在 consumer test 中重新签名并检查 .codesign 段。"
  common_dependencies:
    - expat/2.8.2.1
    - inih/r58
    - icu4c/77

commands:
  - lcfstrings
  - lcf2xml

notes:
  - "lcfstrings extracts strings from LDB/LMT/LMU/LSD files."
  - "lcf2xml converts RPG Maker LCF files to XML and back."

versions:
  0.8.1:
    status: built
    build_date: "2026-09-14"
    conan_ref: "liblcf-tools/0.8.1"
