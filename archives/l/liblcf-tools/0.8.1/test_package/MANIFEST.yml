# Upstream and consumer test declaration for liblcf-tools 0.8.1
package: liblcf-tools/0.8.1
homepage: "https://github.com/EasyRPG/liblcf"

# The upstream CMake project ships a doctest-based C++ suite under tests/.
# The package recipe runs its custom `check` target; upstream has no ctest
# registration for this target.
upstream_check_command: "cmake --build . --target check"
upstream_test_in_build: true
upstream_test_command: "cmake --build . --target check"
upstream_tests:
  - file: tests/dbarray.cpp
    test_cases: 11
  - file: tests/dbbitarray.cpp
    test_cases: 9
  - file: tests/dbstring.cpp
    test_cases: 10
  - file: tests/enum_tags.cpp
    test_cases: 10
  - file: tests/flag_set.cpp
    test_cases: 3
  - file: tests/ini.cpp
    test_cases: 7
  - file: tests/span.cpp
    test_cases: 3
  - file: tests/string_view.cpp
    test_cases: 3
  - file: tests/time_stamp.cpp
    test_cases: 3
  - file: tests/test_main.cpp
    test_cases: 0

# Consumer tests execute both installed tools and verify an XML/LCF round-trip.
test_package_tests:
  - file: test.sh
    description: >
      Verifies installed lcfstrings/lcf2xml binaries, their usage contracts,
      and a deterministic empty-LMT XML -> LCF -> XML round-trip.
    command: "bash test.sh"
# Number of explicit consumer assertions in test.sh; upstream doctest reports 693.
assertion_count: 10
