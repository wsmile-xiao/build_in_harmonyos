# liblcf-tools 0.8.1 version manifest
version: "0.8.1"
software: "liblcf-tools"
status: built
build_date: "2026-09-14"
conan_ref: "liblcf-tools/0.8.1"
build_system: cmake

source:
  url: "https://github.com/EasyRPG/liblcf/archive/refs/tags/0.8.1.tar.gz"
  sha256: "5ec89082d54f1a29d23fed54de70acab4375036d57828ff0fc7a88b81833d40f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DLIBLCF_WITH_INI=ON"
    - "-DLIBLCF_WITH_ICU=ON"
    - "-DLIBLCF_WITH_XML=ON"
    - "-DLIBLCF_UPDATE_MIMEDB=OFF"
    - "-DLIBLCF_ENABLE_TOOLS=ON"
    - "-DLIBLCF_ENABLE_TESTS=ON"
    - "-DLIBLCF_ENABLE_BENCHMARKS=OFF"
    - "-DLIBLCF_ENABLE_INSTALL=ON"
    - "-DCMAKE_INSTALL_BINDIR=bin"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.16"
  dependencies:
    - expat/2.8.2.1
    - inih/r58
    - icu4c/77
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "liblcf-tools is a separate application package: upstream liblcf is compiled as an internal static target and only lcfstrings/lcf2xml are installed."
  - "lcf2xml is conditional on LIBLCF_WITH_XML and therefore requires the published expat/2.8.2.1 Conan dependency; the enabled upstream INI tests use published inih/r58, and ICU supplies the upstream Unicode conversion path."
  - "The upstream test target is a custom `check` target that runs test_runner; it is not registered with ctest."

# Consumer test count used by repository review tooling; upstream counts are
# recorded separately below.
test_passed: 1
test_failed: 0
test_skipped: 0
test_total: 1

test_results:
  type: conan_consumer
  total: 1
  passed: 1
  failed: 0
  skipped: 0
  status: "Conan consumer test passed on OpenHarmony PC; it exercised both installed tools, usage contracts, XML/LCF round-trip, and lcfstrings consumption."

upstream_test_results:
  command: "cmake --build . --target check"
  total: 59
  passed: 59
  failed: 0
  skipped: 0
  assertions: 693
  note: "The upstream doctest suite ran unchanged through the CMake check target; parameterized span cases are counted as three test cases."

quality_gates:
  W3_local_ci: "PASS for the targeted package: L0, L1, L5 and JC6 passed; L2 usage probing was a non-blocking skip because the upstream tools return nonzero usage codes."
  conan_verify: "G0, G1, G2, G3 and G4 passed; verifier L2/L4/L5 cache-path extraction skipped for the hyphenated package name and were manually covered."
  source_integrity: "Official HTTPS source URL and SHA-256 are retained in conandata.yml; local device validation used a separately downloaded archive with the same SHA-256."

known_issues:
  - "The repository preflight PF9 currently rejects the required software-level CLI metadata files (commands.json and software manifest) because it requires every changed archives path to include a version directory; PR creation must disclose this PF8/PF9 conflict and use the documented no-preflight escape if needed."
  - "No Conan package tarball is committed or published; status remains built until the normal PR and platform lifecycle completes."
