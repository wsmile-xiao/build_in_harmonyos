package: libfstlookahead
version: "1.8.4"
homepage: "https://www.openfst.org/"
license: Apache-2.0
status: built
build_system: autotools
build_date: "2026-09-20"
conan_ref: "libfstlookahead/1.8.4"

# ============================================================
# 源码信息（与父包 openfst/1.8.4 同 tarball，URL/sha256 逐字一致）
# ============================================================
source:
  url: "https://openfst.org/twiki/pub/FST/FstDownload/openfst-1.8.4.tar.gz"
  sha256: "a8ebbb6f3d92d07e671500587472518cfc87cb79b9a654a5a8abb2d0eb298016"
  tar_format: tar.gz
  upstream_release_url: "https://openfst.org/twiki/pub/FST/FstDownload/openfst-1.8.4.tar.gz"
  upstream_tag: "openfst-1.8.4"
  release_artifact: >-
    官方发行 tarball openfst-1.8.4.tar.gz（openfst.org 官方下载目录）。
    本包是同一 tarball 的 LookAheadFst 扩展子库，源码 URL 与 sha256 与已合并的
    archives/o/openfst/1.8.4 和 archives/l/libfstconst/1.8.4 逐字一致；
    实测 sha256sum = a8ebbb6f3d92d07e671500587472518cfc87cb79b9a654a5a8abb2d0eb298016。

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options:
    - "--enable-lookahead-fsts"
    - "--disable-bin"
    - "--enable-static"
    - "--disable-shared"
  dependencies: []
  cc: clang
  cxx: clang++
  notes: >-
    上游 configure.ac 中各扩展开关默认都是 no（lookahead 亦不例外），--enable-bin 默认 yes；
    本配方只显式打开本扩展，并显式 --disable-bin：src/bin 无 lookahead 专用工具、上游 7 个
    check_PROGRAMS 只链 libfst，且 src/script+src/bin 占整包编译量约 80%（G2/CI 3600s 预算）。

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-flags-help-exit.patch"

# ============================================================
# 测试统计（五处同源：本文件 / test_package/MANIFEST.yml / notes.md /
# reports/test-report.md / PR 正文）
# ============================================================
tests:
  upstream:
    command: "make check"
    counting_unit: "src/test/Makefile.am 注册的 check_PROGRAMS（TESTS = $(check_PROGRAMS)）"
    declared_n: 7
    declared_n_basis: >-
      候选口径取最大值：注册面 A（automake check_PROGRAMS/TESTS）= 7；
      注册面 B（BUILD.bazel 的 cc_test：fst_test + weight_test + algo_test_%s × 5）= 7；
      源文件面 = 3 个 .cc（algo_test.cc 被 5 个宏各编一份）；
      CMake add_test / pytest 目标 = 0（无 CMakeLists.txt）。主 N = 7，子包不裁剪上游测试面，差额 0。
    assertion_macro_sites: 59
    assertion_note: >-
      assertion 属另一单位（weight_test.cc 内 59 处 CHECK，fst_test/algo_test 经
      fst/test/*.h 的 CHECK/EXPECT 宏），只披露、不并入 N。
    executed: 7
    passed: 7
    failed: 0
    skipped: 0
    not_run: 0
    runner_note: >-
      7 个程序在配方 build() 中按上游同一组源码/宏编译（-Wl,--whole-archive 包夹 libfst.a），
      随包安装到 _ohos_tests/，由 test_package 在真机逐项执行并以退出码统计。
  adapted:
    command: "Conan test_package"
    cases: 25
    passed: 25
    pass_rate: "25/25 (100%)"
    breakdown:
      harmony_consumer_assertions: 16
      harmony_artifact_header_checks: 9
    note: >-
      lookahead_consumer.cc 16 项断言（注册表 3 个类型名、构造/弧/终态/类型、Matcher 与
      LookAheadMatcher 语义、写出后经 FstRegister 读回）；check_libfstlookahead.sh 9 项
      产物与头文件声明检查。上游 7 项不重复计入本行。

blockers: []

knowledge_gained:
  # 每条行尾引用最接近的条目（写法遵循容器层口径：# knowledge_ref: <条目/新草稿号>）。
  - "openfst-1.8.4 是单 tarball 多子库：configure.ac 每个扩展开关默认 no（本包需显式 --enable-lookahead-fsts），而 --enable-bin 默认 yes——库子包应显式 --disable-bin（src/bin 无 lookahead 专用工具，且占约 80% 编译量）。"  # knowledge_ref: DRAFT-E614-openfst-subpackage-recipe-pattern
  - "子库交付物 = libfstlookahead.a（-version-info 26:0:0，共享构建时 libfstlookahead.so.26）+ 3 个模块 arc/ilabel/olabel_lookahead-fst；静态构建时模块落在 lib/fst/*.a。"  # knowledge_ref: DRAFT-E614-openfst-subpackage-recipe-pattern
  - "上游测试面与子库无关：src/test/Makefile.am 的 7 个 check_PROGRAMS 是 openfst 整体回归；BUILD.bazel 的 cc_test 为同一组 7 项。子包不裁剪，声明 N 必须取父 tarball 注册面 7。"  # knowledge_ref: DRAFT-E614-openfst-subpackage-recipe-pattern
  - "手工编译上游测试/消费者必须 -Wl,--whole-archive 包夹 libfst.a：REGISTER_FST 的静态 registerer 无强引用会被链接器剔除，Fst::Read 回退 dlopen(vector-fst.so) 失败。"  # knowledge_ref: DRAFT-E614-openfst-subpackage-recipe-pattern
  - "fst_test 的 TestIO 写 FST_FLAGS_tmpdir（flags.cc 默认读 TMPDIR、回落 /tmp），设备 /tmp 只读，必须显式传 --tmpdir=<可写目录>，不能依赖继承环境。"  # knowledge_ref: DRAFT-E614-openfst-subpackage-recipe-pattern
  - "make install 需替换 INSTALL 变量指向 cp/mkdir shim：toybox install -c 在 HMDFS 上 Error 64（E182/E188）。"  # knowledge_ref: E182
  - "扩展可用性的证据形态：FstRegister<Arc>::GetRegister()->GetEntry(\"arc_lookahead\").reader != nullptr，且写出后 Fst<Arc>::Read 能经注册表读回 —— 只 grep 头文件不足以证明扩展链接可用。"  # knowledge_ref: DRAFT-E614-openfst-subpackage-recipe-pattern

knowledge_ref:
  - "knowledge/drafts/DRAFT-E614-openfst-subpackage-recipe-pattern.kv"
  - "knowledge/drafts/DRAFT-E614-openfst-subpackage-recipe-pattern.md"

path_b:
  status: requested
  type: reusable_knowledge
  candidate: "knowledge/drafts/DRAFT-E614-openfst-subpackage-recipe-pattern"
  evidence: "notes.md § 上游测试用例审计 / § 配方策略；$TASK_DIR/consumer-iter/*.out（真机 7/7 逐项输出）"
  novelty: >-
    把「同 tarball 子包」从一次性的配方复制变成可判定流程：①先数父 tarball 的**两处**注册面
    （automake check_PROGRAMS/TESTS 与 BUILD.bazel cc_test）再声明 N，子包不裁剪即自然对齐，
    避免 libgmpxx 式少报；②扩展开关默认 no、bin 默认 yes 的默认值陷阱；
    ③静态注册器必须 --whole-archive 的链接根因与「注册表查询 + 读回」这一可执行的扩展可用性证据形态。
  differs_from:
    - "libgmpxx 子包判例（DRAFT-libgmpxx-6.3.0-subpackage-in-tree-static-bindings）讲的是 in-tree 静态绑定与父 tarball 全量 190 的少报；本条讲注册面本身就等于父面的家族，以及注册表链接口径。"
    - "E182/E188 只覆盖 toybox install shim；本条引用其处置形态但不重复。"
