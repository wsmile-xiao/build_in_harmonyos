package: libfstlookahead/1.8.4
homepage: https://www.openfst.org/

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_counting_unit: "src/test/Makefile.am 注册的 check_PROGRAMS（TESTS = $(check_PROGRAMS)）"
upstream_declared_n: 7
upstream_n_notes: >-
  openfst-1.8.4 的测试注册面只有一处：src/test/Makefile.am 的 7 个 check_PROGRAMS
  （fst_test、weight_test、algo_test_{log,tropical,minmax,lexicographic,power}），
  TESTS 直接引用同一组变量。BUILD.bazel 的 cc_test 规则（fst_test + weight_test +
  algo_test_{tropical,log,minmax,lexicographic,power}）是同一组 7 项，两个注册面计数一致；
  源码面是 3 个 .cc（algo_test.cc 被 5 个宏各编一份），无 CMake/pytest 测试目标。
  本子包与父 tarball 的注册面相同（子包不裁剪上游测试），7 项全部编译并在真机执行。

upstream_tests:
  - name: "fst_test"
    source: "src/test/fst_test.cc"
    description: "FST 核心读写/拷贝/属性/IO（含 Fst::Read 注册表分派与 tmpdir 往返）"
    command: "_ohos_tests/fst_test --tmpdir=<writable>"
  - name: "weight_test"
    source: "src/test/weight_test.cc"
    description: "权重半环语义（59 处 CHECK 断言）"
    command: "_ohos_tests/weight_test --tmpdir=<writable>"
  - name: "algo_test_log"
    source: "src/test/algo_test.cc -DTEST_LOG"
    description: "LogArc 算法回归（AlgoTester::Test）"
    command: "_ohos_tests/algo_test_log --tmpdir=<writable>"
  - name: "algo_test_tropical"
    source: "src/test/algo_test.cc -DTEST_TROPICAL"
    description: "StdArc(tropical) 算法回归"
    command: "_ohos_tests/algo_test_tropical --tmpdir=<writable>"
  - name: "algo_test_minmax"
    source: "src/test/algo_test.cc -DTEST_MINMAX"
    description: "MinMaxArc 算法回归"
    command: "_ohos_tests/algo_test_minmax --tmpdir=<writable>"
  - name: "algo_test_lexicographic"
    source: "src/test/algo_test.cc -DTEST_LEXICOGRAPHIC"
    description: "LexicographicArc 算法回归"
    command: "_ohos_tests/algo_test_lexicographic --tmpdir=<writable>"
  - name: "algo_test_power"
    source: "src/test/algo_test.cc -DTEST_POWER"
    description: "PowerWeight 算法回归"
    command: "_ohos_tests/algo_test_power --tmpdir=<writable>"

test_package_tests:
  - file: check_libfstlookahead.sh
    description: "包内 LookAheadFst 扩展产物存在 + 扩展头文件声明（ArcLookAheadMatcher/LookAheadMatcherBase/LookAheadLabel/arc_lookahead_fst_type/StdArcLookAheadFst）"
    command: "sh check_libfstlookahead.sh <lib> <lookahead-matcher.h> <matcher-fst.h>"
  - file: lookahead_consumer.cc
    description: "消费者用例：用包内头文件+静态库现场编译，真机调用 LookAheadFst 扩展（注册表 3 项、构造/弧/终态/类型、Matcher/LookAheadMatcher 语义、写出后经 FstRegister 读回）"
    command: "./lookahead_consumer <tmp.fst>"

harmony_specific_tests:
  - name: "lookahead-consumer-api"
    description: "OHOS 真机上用包内安装产物编译并执行 LookAheadFst 消费者程序，覆盖注册面/运行时行为/端到端读回"
    command: "./lookahead_consumer <tmp.fst>"
    assertions: 16
    platform: OHOS
  - name: "lookahead-artifact-headers"
    description: "OHOS 真机上校验包内扩展库产物与扩展头文件声明"
    command: "sh check_libfstlookahead.sh ..."
    assertions: 9
    platform: OHOS

assertion_count: 25
