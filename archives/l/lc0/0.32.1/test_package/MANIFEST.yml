# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lc0/0.32.1
homepage: "https://lczero.org/"

# 上游测试命令 — lc0 的 C++ 单元测试（src/*_test.cc，gtest 框架，lc0_gtest 二进制）
upstream_check_command: "meson test -C build"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（实测 2026-08-16，OHOS 环境）：
# - src/ 下 7 个 *_test.cc（board/position/engine/encoder/syzygy/hashcat/
#   optionsparser），gtest 框架（subprojects/gtest.wrap）
# - meson 构建 lc0_gtest 测试二进制；受限环境运行情况以本地验证实测为准
upstream_tests:
  - file: src/*_test.cc
    source: lc0-0.32.1/src/
    description: "上游 C++ 单元测试（gtest，7 个测试文件：board/position/engine/encoder/syzygy/hashcat/optionsparser）"
    command: "meson test -C build"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_lc0.py
    description: "消费者测试：lc0 --version（引擎信息）+ --help（CPU backend 初始化）"
    command: "python3 test_lc0.py <lc0-bin>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
