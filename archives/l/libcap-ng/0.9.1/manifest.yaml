software: libcap-ng
name: libcap-ng
version: 0.9.1
status: built
description: Library for Linux that makes using posix capabilities easy
platforms:
  - arm64_linux
  - x86_64_linux
build_system: manual_makefile
source_url: https://github.com/stevegrubb/libcap-ng/archive/refs/tags/v0.9.1.tar.gz
license: LGPL-2.1 (library), GPL-2 (utilities)

components:
  libraries:
    - name: libcap-ng
      type: shared
      files:
        - lib/libcap-ng.so.0.0.1
        - lib/libcap-ng.so.0
        - lib/libcap-ng.so
    - name: libcap-ng-static
      type: static
      files:
        - lib/libcap-ng.a
    - name: libdrop_ambient
      type: shared
      files:
        - lib/libdrop_ambient.so.0.0.0
        - lib/libdrop_ambient.so.0
        - lib/libdrop_ambient.so
  headers:
    - include/cap-ng.h
  utilities:
    - bin/pscap
    - bin/filecap
    - bin/netcap
    - bin/captest

dependencies:
  required:
    - linux-kernel-headers (linux/capability.h)
    - pthread

test_results:
  total: 2
  passed: 2
  failed: 0
  skipped: 0

build_date: 2026-05-16
build_host: HarmonyOS aarch64 (HongMeng Kernel 1.12.0)
compiler: gcc

