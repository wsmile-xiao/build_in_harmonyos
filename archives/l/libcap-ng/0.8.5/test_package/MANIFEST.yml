# test_package/MANIFEST.yml
# Upstream test declaration for CI (build_and_test.sh L0e requires this file)

package: libcap-ng/0.8.5
homepage: "https://github.com/stevegrubb/libcap-ng"

# Upstream uses autotools; source archive has no pre-generated configure script
upstream_check_command: "make check"

# Upstream tests are in src/test/ directory
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (from src/test/Makefile.am)
upstream_tests:
  - file: src/test/lib_test.c
    source: libcap-ng-0.8.5/src/test/lib_test.c
    description: "Library bit manipulation tests (clear, fill, update, text conversion)"
    command: "./lib_test"
    status: "platform_issue"
    note: "Fails on HarmonyOS: get_last_cap() returns CAP_LAST_CAP=40 from headers but runtime binary search detects last_cap=39; /proc/sys/kernel/cap_last_cap not available on OHOS"
  - file: src/test/thread_test.c
    source: libcap-ng-0.8.5/src/test/thread_test.c
    description: "Thread separation of capabilities test"
    command: "./thread_test"
    status: "pass"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.c
    description: "Consumer test: clear/fill/update/have_capability/text conversion/save-restore/updatev"
    command: "./test_package"

# Test assertions count (approximate)
assertion_count: 12
