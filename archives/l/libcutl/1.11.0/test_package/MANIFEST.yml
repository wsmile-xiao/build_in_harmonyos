# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcutl/1.11.0
homepage: "https://www.codesynthesis.com/projects/libcutl/"

# 上游测试命令 (build2 不可用，无 make check)
upstream_check_command: "n/a (build2 build system, no make check)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (build2 无标准测试套件可列举)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者视角验证: fs::path, exception, compiler::type_id API"
    command: "./test_libcutl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4
