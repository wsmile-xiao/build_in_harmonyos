software: libcutl
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# 构建系统类型（简写，G4门禁要求）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.codesynthesis.com/download/xsd/4.2/libcutl-1.11.0.tar.gz"

  # 源码校验和
  sha256: "bb78ff87d6cb1a2544543ffe7941f0aeb8f9dcaf7dd46e9acef3e032ed7881dc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  # 注意: 源码 v1.11.0 实际使用 build2 构建系统，但平台无 build2，
  # 因此采用手动编译（custom）方式
  system: custom

  # 配置选项列表
  configure_options:
    - "manual_compile: clang++ -c -O2 -fPIC -I. -DLIBCUTL_STATIC_BUILD"
    - "manual_ar: llvm-ar rcs libcutl.a"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 构建产物
# ============================================================

products:
  static_library:
    name: libcutl.a
    size: "519970 字节"
    objects:
      - exception.o
      - shared-ptr-base.o
      - re.o
      - fs-exception.o
      - fs-auto-remove.o
      - fs-path.o
      - compiler-type-info.o
      - compiler-cxx-indenter.o
      - compiler-context.o
  headers:
    count: 45
    format: .hxx/.ixx/.txx
    install_path: include/libcutl/libcutl/（含 compiler/container/fs/meta/re/shared-ptr 子目录）
  pkg_config:
    name: libcutl.pc
    version: "1.11.0"

# ============================================================
# 预编译包
# ============================================================

package:
  filename: libcutl-1.11.0-ohos-aarch64.tar.gz
  size: "662KB (678011 字节)"
  created_by: ohc-run.py package

# ============================================================
# 测试结果
# ============================================================

test_results:
  version_check: PASS
  feature_fs_path: PASS
  feature_exception: PASS
  feature_compiler_type_id: PASS
  local_install: PASS
  pkg_config: PASS
  static_library_content: PASS
  header_install: PASS
  symbol_table: PASS
  shared_ptr_intrusive: SKIPPED（侵入式智能指针需继承 shared base）
  make_check: SKIPPED（无 autotools 测试套件，build2 不可用）
  g0_clean_build: FAIL（源码无 configure 脚本，build2 构建系统）
  g1_binary_integrity: PASS
  g2_functional: PASS（⚠️ 无独立可执行二进制）
  g3_portability: PASS
  g4_archive_integrity: PASS

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libcutl v1.11.0 使用 build2 构建系统而非 autotools，需要手动编译"
  - "libcutl::shared_ptr 是侵入式智能指针，不能用于未继承 shared base 的对象"
  - "version.hxx 在源码包中已预生成，无需额外处理"
  - "G0 门禁无法通过（无 configure 脚本），但 G1-G4 可通过手动验证"
