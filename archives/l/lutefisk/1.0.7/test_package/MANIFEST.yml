# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: lutefisk/1.0.7
homepage: "http://www.hairyfatguy.com/lutefisk/"

upstream_check_command: ""
# lutefisk 1.0.7 ships no automated test harness (no `make check`, no test
# directory). Upstream only publishes one sample spectrum together with the
# reference result its author produced for it, which is what the assertions
# below are measured against.
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_lutefisk.sh
    description: "Runs the packaged lutefisk executable: usage text, a full de novo sequencing pass over Qtof_ELVISLIVESK.dta compared against the upstream reference output (peptide set, ranking order and the four score columns with a 0.005 tolerance), the negative path, and 8 HarmonyOS-specific ELF assertions via elf_check.py"
    command: "sh test_lutefisk.sh <exe> <share-dir> <elf_check.py>"
    assertion_count: 20
  - file: elf_check.py
    description: "HarmonyOS-specific assertions on the packaged ELF: ELF magic, 64-bit little-endian, EM_AARCH64, ET_DYN (PIE), non-executable PT_GNU_STACK, PT_GNU_RELRO, immediate binding and system-libraries-only DT_NEEDED (invoked as T18 by test_lutefisk.sh)"
    command: "python3 elf_check.py <exe>"
    assertion_count: 8

assertion_count: 28
ohos_specific_assertions: 8