software: lutefisk
version: "1.0.7"
status: built
build_date: "2026-10-04"
build_system: makefile

source:
  url: "https://deb.debian.org/debian/pool/main/l/lutefisk/lutefisk_1.0.7+dfsg.orig.tar.gz"
  sha256: "6b1624daaf4035ec596c5ce168eb5f7cc587d50e72025639722029fce2ebbf9a"
  tar_format: tar.gz
  strip_root: true
  note: >-
    Upstream site (www.hairyfatguy.com/lutefisk, originally
    sourceforge.net/projects/lutefiskxp) is offline; the Debian +dfsg repack of
    the original tarball is the authoritative surviving copy and is what the
    sha256 above pins.

build:
  system: makefile
  makefile: src/Makefile.linux
  configure_options: []
  dependencies: []
  cc: clang
  cflags: "-D__LINUX -O2 -fPIE"
  lflags: "-pie -Wl,-z,relro,-z,now -lm -o"
  linked_libs:
    - libc.so
    - libm.so

runtime_data:
  share_dir: share/lutefisk
  files:
    - Lutefisk.details
    - Lutefisk.residues
    - Lutefisk.params
    - Lutefisk.paramsLCQ
    - Lutefisk.lcq_params
    - Lutefisk.qtof_params
    - database.sequence
  examples: share/lutefisk/examples (Qtof_ELVISLIVESK.dta + upstream reference .lut)

patches_applied:
  - "0001-math-include.patch"
  - "0002-format-specifiers.patch"
  - "0003-printf-safety.patch"
  - "0004-char-scan-and-labs.patch"
  - "0005-filename-buffers.patch"

patch_classification:
  - file: 0001-math-include.patch
    type: portability
    platform_only: false
    guard: 'none'
  - file: 0002-format-specifiers.patch
    type: portability
    platform_only: false
    guard: 'none'
  - file: 0003-printf-safety.patch
    type: portability
    platform_only: false
    guard: 'none'
  - file: 0004-char-scan-and-labs.patch
    type: portability
    platform_only: false
    guard: 'none'
  - file: 0005-filename-buffers.patch
    type: portability
    platform_only: false
    guard: 'none'

knowledge_gained:
  - "未包含 <math.h> 时 sqrt()/fabs() 走 C89 隐式 int 声明，LP64(aarch64) 上 double 返回值被截断"
  - "LP64 上 int 实参零扩展进 x 寄存器，'%ld' 读 int 会按无符号打印；'%d' 读 size_t 会截断"
  - "格式串里嵌 '\\0' 会在 NUL 处截断，转换说明符根本不生效，打印的是垃圾"
  - "手写 Makefile 用普通 '=' 赋值时，make 命令行传参可覆盖，无需先改成 '+='"