sources:
  url: "https://deb.debian.org/debian/pool/main/l/lutefisk/lutefisk_1.0.7+dfsg.orig.tar.gz"
  sha256: "6b1624daaf4035ec596c5ce168eb5f7cc587d50e72025639722029fce2ebbf9a"

patches:
  - patch_file: "patches/0001-math-include.patch"
    patch_description: "Add the missing #include <math.h> to LutefiskHaggis.c and LutefiskMain.c: sqrt() and fabs() were implicitly declared, so the C89 implicit int return truncated the double result on LP64 (aarch64)."
    patch_type: "portability"
  - patch_file: "patches/0002-format-specifiers.patch"
    patch_description: "Rewrite the 44 printf conversion specifiers that disagree with the promoted argument type (all 44 -Wformat diagnostics are cleared): on LP64 an int argument is zero-extended, so %ld printed unsigned garbage and %d truncated a size_t."
    patch_type: "portability"
  - patch_file: "patches/0003-printf-safety.patch"
    patch_description: "Pass versionString as an argument instead of as the format string (-Wformat-security) and drop the embedded NUL from two \"%d\" formats, which terminated the format early so the file counter was printed as garbage."
    patch_type: "portability"
  - patch_file: "patches/0004-char-scan-and-labs.patch"
    patch_description: "Compare the peptide char against the character constant instead of the NULL pointer constant, replace three sprintf(p, \"\\0\") no-op terminations with a direct store, and use labs() for the long argument so abs() no longer truncates."
    patch_type: "portability"
  - patch_file: "patches/0005-filename-buffers.patch"
    patch_description: "Raise the eight 256-byte pathname buffers in tParam to MAX_FILENAME_SIZE (4096): the strncpy(optarg, sizeof(field)) command-line parsing overflows them with the deeply nested paths used by conan and CI."
    patch_type: "portability"
