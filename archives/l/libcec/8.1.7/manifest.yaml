# ============================================================
# 必须字段
# ============================================================

version: "8.1.7"
software: "libcec"
status: built
build_date: "2026-09-16"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/Pulse-Eight/libcec/archive/refs/tags/libcec-8.1.7.tar.gz"
  sha256: "e4ac4d1dd3559cf83189d29ab40fc5537b5a2beceb82916ef173dac7e50dbfa0"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DDISABLE_BUILDINFO=ON"
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libcec 8.1.7 为 CMake 构建（init-build URL 误判 autotools，conan-init 需改 CMake 模板）"
  - "OHOS 无 whoami：SetBuildInfo.cmake 的 string(STRIP) 空值报错，需 DISABLE_BUILDINFO=ON"
  - "OHOS 上 make -j jobserver 需 mkfifo 可写 TMPDIR（~/tmp HMDFS 受限），本库串行 make 即可"
  - "libcec 构建产物含 CLI（cec-client/cecc-client），软件级 commands.json 必须随包提交（R38/L0k）"
  - "lang-preflight 对含 src/rust 绑定子目录的 C++ 库误判为 rust（子树 Cargo.toml 命中）；按'绑定类包按主体语言判定'边界规则应判 cpp"