# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libcec/8.1.7
homepage: "https://github.com/Pulse-Eight/libcec"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libcec 8.1.7 官方源码以 CMake 构建，仓库内无 CTest/enable_testing/add_test，
# 无 make check 目标；唯一测试入口是可选 Rust 绑定 (ENABLE_RUST_LIB=OFF 默认关闭，
# 需 cargo，设备无 Rust 工具链)。C++ 核心库上游未声明独立可执行用例。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (完整枚举台账见 notes.md / test-report.md)
# 结论: 0 个独立上游 C++ 测试用例 (官方 tag 无测试目标；src/rust/tests 为
# 绑定测试且默认不构建，不计入 C++ 核心库用例)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者用例：经公开 C API (libcec_initialise/libcec_get_lib_info/libcec_destroy) 模拟上层业务组件编译、链接并运行"
    command: "./test_libcec"
  - file: test_ohos.c
    description: "HarmonyOS 专项测试：版本宏断言 + clientVersion 一致性 + 无硬件环境下 detect_adapters 优雅返回"
    command: "./test_libcec_ohos"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 4