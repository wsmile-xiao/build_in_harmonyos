software: libcec
display: "libcec"
description: "Pulse-Eight libCEC — HDMI-CEC 库与 cec-client/cecc-client 命令行客户端"
category: hardware
homepage: "https://github.com/Pulse-Eight/libcec"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS 无 whoami：需 -DDISABLE_BUILDINFO=ON 关闭上游 SetBuildInfo 构建信息注入"
    - "CMAKE_SYSTEM_NAME=Linux 使 CMake 生成带 SONAME 的版本化 libcec.so.8"
    - "构建产物含 CLI（cec-client/cecc-client），软件级 commands.json 随包提交（R38/L0k）"
    - "lang-preflight 对含 src/rust 绑定子目录的 C++ 库误判 rust：按绑定类包主体语言规则判 cpp"
  common_dependencies: []

versions:
  "8.1.7":
    status: built
    build_date: "2026-09-16"
