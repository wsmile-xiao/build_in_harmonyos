# 版本级 manifest — libcec 7.1.1
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "7.1.1"

# 软件名
software: "libcec"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源，R39）
  url: "https://github.com/Pulse-Eight/libcec/archive/refs/tags/libcec-7.1.1.tar.gz"

  # 源码校验和（下载 tarball 实测）
  sha256: "7f7da95a4c1e7160d42ca37a3ac80cf6f389b317e14816949e0fa5e2edf4cc64"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（init-build 由 URL 误判 autotools，实测为 CMake）
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DCMAKE_SYSTEM_NAME=Linux"
  - "-DCMAKE_PREFIX_PATH=<p8-platform 包前缀>"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "p8-platform/2.1.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "7.1.1 的 SetBuildInfo.cmake 无 DISABLE_BUILDINFO 守卫（8.1.7 才有），OHOS 无有效 whoami（bad uid），必须用 SOURCE_DATE_EPOCH 可复现分支跳过 whoami/hostname"
- "p8-platform 制品包的 p8-platform-config.cmake 烘焙了已清理的构建树路径（.conan2/p/b/...），消费侧需修正 include 路径"
