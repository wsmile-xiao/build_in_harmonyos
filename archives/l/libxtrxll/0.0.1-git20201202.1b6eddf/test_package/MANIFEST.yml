# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md 与 references/iron-rules.md R51（上游测试三步法）

package: libxtrxll/0.0.1-git20201202.1b6eddf
homepage: "https://github.com/myriadrf/libxtrxll"

# ── R51 第一步：上游测试清点（证据：tarball 内源码树） ──
#
# 清点命令（在源码根目录执行）:
#   ls tests/                     -> CMakeLists.txt  test_xtrxflash.c  test_xtrxll.c
#   grep -rn "enable_testing\|add_test(" .   -> 0 hits（全树无 ctest 注册）
#   sed -n '1,12p' tests/CMakeLists.txt      -> 仅 add_executable + install
#
# 结论：
#   * 上游 tests/ 下有 2 个 .c 程序（test_xtrxll.c / test_xtrxflash.c），
#     但它们是 getopt 驱动的**交互式硬件工具**，不是自动化测试：
#     - 无任何断言/校验逻辑，退出码只反映硬件操作结果；
#     - 通过位置参数打开真实设备（xtrxll_open(device,...) -> /dev/xtrx*、
#       discovery 读 /sys/class/xtrx/）；
#     - tests/CMakeLists.txt 只做 add_executable + install，全树
#       grep -rn "enable_testing\|add_test(" 命中数为 0，即 ctest 注册数 = 0。
#   * 因此"上游可自动化运行的测试用例数" = 0，ctest 注册数 = 0。
#   * 这两个程序仍需编译（add_subdirectory(tests) 在上游是无条件的），
#     已由 conanfile.py build() 的 cmake.build() 编译，作为"构建期可编译性"
#     证据；在无 XTRX 硬件的机器上执行它们没有意义（会尝试打开不存在的
#     /dev/xtrx*），故不纳入自动化执行。
#
# 验证平台：HarmonyOS PC (aarch64)，无 XTRX 硬件与内核驱动（真机环境事实）。
upstream_check_command: "ctest -N"
upstream_tests_found: 0
upstream_test_programs_present: 2
upstream_test_registration: "none (no enable_testing()/add_test() in the tree)"

# conanfile.py build() 方法中是否已集成上游测试运行
# （上游无可自动运行的测试套件，因此 build() 只编译不含运行，见上方清点）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际可运行的自动化测试（上游无 ctest 注册用例）
upstream_tests: []

# ── R51 第二步：本包在真机/CI 上实际运行的测试（test_package） ──
# 两个程序均真实链接 libxtrxll 并调用其公共 API（R34：非空壳）。
test_package_tests:
  - file: test_consumer.c
    description: "消费者集成测试：xtrxll_discovery() 生命周期、xtrxll_open() 错误映射（-ENODEV/-ENOENT）、日志级别往返与自定义日志回调派发"
    command: "./test_consumer"
  - file: test_ohos_offline.c
    description: "鸿蒙特有测试：静态插件注册（xtrxllpciev0_init 为所链接库的可见符号，证明 PCIe 传输编入 libxtrxll.so 而非运行时 dlopen）+ 无 XTRX 内核驱动/硬件时的干净运行（discovery 返回 0、重复 discovery 稳定、失败 open 无 fd 泄漏）"
    command: "./test_ohos_offline"

# 测试断言总数（test_consumer.c 11 项 + test_ohos_offline.c 7 项 = 18）
assertion_count: 18
