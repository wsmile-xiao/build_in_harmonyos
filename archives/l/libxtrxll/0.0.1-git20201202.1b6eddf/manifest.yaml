# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.0.1-git20201202.1b6eddf/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.0.1-git20201202.1b6eddf"

# 软件名
software: "libxtrxll"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-04"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游官方源：myriadrf/libxtrxll commit 1b6eddf，原 xtrx-sdr/libxtrxll）
  url: "https://github.com/myriadrf/libxtrxll/archive/1b6eddfbedc700efb6f7e3c3594e43ac6ff29ea4.tar.gz"

  # 源码校验和
  sha256: "1ae6d112e41fe7427ab97b7e828609f08aea177edb6fdc08726cc58f01f8566b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"   # 上游 cmake_minimum_required(2.8)，CMake 4.x 需下限
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON" # 静态插件归档进 .so，HarmonyOS 上上游不自加 -fPIC
    - "-DENABLE_PCIE=ON"                     # 保留 PCIe 传输
    - "-DENABLE_USB3380=OFF"                 # libusb3380 未适配/未发布，关闭可选插件
    - "-DXTRXLL_STATIC=ON"                   # 插件静态编入，避免 dlopen + RPATH 依赖

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 说明: libusb3380 为可选插件依赖，仓库与 OHOS 制品仓均不存在，
  #       按 W0/R36 不捎带适配，改以 ENABLE_USB3380=OFF 关闭。

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本库在 OHOS 上零源码补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ref: E187 上游 cmake_minimum_required(VERSION 2.8) 在 CMake >= 4 下直接报 'Compatibility with CMake < 3.5 has been removed'；必须设 CMAKE_POLICY_VERSION_MINIMUM=3.5，且要用 **cache_variables**（普通 variables 不进 CMakeCache，压不住）。同类先例 airspyhf/1.6.8、airspy/1.0.10、laz-perf/3.4.0"
  - "上游 XTRXLL_STATIC 默认 ON 时，mod_pcie/mod_usb3380 编译为静态库并归档进 libxtrxll.so；上游仅对 CMAKE_SYSTEM_NAME MATCHES \"Linux\" 的静态插件目标 add_definitions(-fPIC)，HarmonyOS 上 CMAKE_SYSTEM_NAME=HarmonyOS 不匹配 → 非 PIC 目标重定位导致 .so 链接失败。配方以 CMAKE_POSITION_INDEPENDENT_CODE=ON 全树修复，胜于修改上游 if() 判断（R8 四不准则）"
  - "上游 mod_pcie/mod_usb3380 的 PLUGIN_TYPE 可为 SHARED，此时核心库用 dlopen(\"libxtrxll_pcie.so.0\") 动态查找，依赖加载器 RPATH；Conan 包布局下脆弱。保持上游默认 XTRXLL_STATIC=ON 把 PCIe 传输编入 libxtrxll.so，可彻底消除运行时插件查找依赖"
  - "libusb3380（USB3380 传输的外部依赖）在仓库 archives/ 与 OHOS 制品仓均不存在；上游 find_package(libusb3380) 失败时会自动 set(ENABLE_USB3380 OFF)，属可选插件。按 W0/R36 不捎带适配，直接以 -DENABLE_USB3380=OFF 明确关闭并在 notes.md 记录"
  - "Conan 2 的 conan.tools.files.copy() 没有 delete 参数（与旧教程不同）；清理包内 *.la/*.dylib 必须用 conan.tools.files.rm(self, pattern, folder)"
  - "ref: R51 上游 tests/ 下 2 个 .c 是 getopt 驱动的交互式硬件工具（无断言、需真实 XTRX 板），全树 grep -rn 'enable_testing|add_test(' 命中 0 → 可自动化运行的用例数 = 0；测试由 test_package 补齐（消费者集成 + 鸿蒙特有）"
  - "许可证口径：GitHub 元数据将 myriadrf/libxtrxll 标为 Apache-2.0，但仓库内 LICENSE 全文为 GNU LGPL v2.1、所有源文件头声明 LGPL-2.1-or-later；以仓库内 LICENSE 文件为准（conanfile license = LGPL-2.1）"

# ============================================================
# 测试
# ============================================================

tests:
  upstream_count: 0          # 上游无 ctest 注册用例（2 个程序为交互式硬件工具，非自动化测试）
  test_package_count: 2      # test_consumer.c + test_ohos_offline.c
  assertion_count: 18        # 11 + 7
  verified_on: "HarmonyOS PC aarch64 真机（无 XTRX 硬件），conan create -pr:h=ohos -pr:b=ohos"

patch_generation:
  method: none
  reason: "OHOS 适配全部由 CMake cache/普通变量完成，无需修改上游源码（R1/R8）"
  patches_count: 0
