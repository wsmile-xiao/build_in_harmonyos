software: leakcanary-shark
display: "LeakCanary Shark"
description: "Java heap dump parsing and leak analysis library family from LeakCanary (shark, shark-graph, shark-hprof, shark-log)"
category: data
homepage: "https://github.com/square/leakcanary"
license: Apache-2.0
build_system: gradle

ohos_adaptation:
  key_points:
    - "纯 JVM Kotlin 库：Gradle 7.4.2 + bishengjdk17 源码编译，无 native 代码"
    - "设备 toybox sh 无法运行 Gradle 自带 bin/gradle 启动脚本，需 java -classpath lib/* org.gradle.launcher.GradleMain 直启"
    - "JAVA_TOOL_OPTIONS 需 -Dos.name=Linux 与 -Djava.io.tmpdir 指向可写目录（/tmp 只读）"
    - "Kotlin 1.4.21 编译器需 --add-opens java.base/*=ALL-UNNAMED 才能在 JDK17 下运行；JAVA_TOOL_OPTIONS 不接受 --add-opens（BiSheng JDK 拒绝），须放在启动命令或 org.gradle.jvmargs 中"
    - "TYPESAFE_PROJECT_ACCESSORS 要求根项目名合法，settings.gradle 中固定 rootProject.name"
  common_dependencies:
    - "bishengjdk17 (cmd-pkgs install-jdk.sh)"
    - "kotlin-stdlib 1.3.72 (Maven Central)"
    - "okio 2.2.2 (Maven Central)"

versions:
  "2.14":
    status: built
    build_date: "2026-09-26"
    conan_ref: "leakcanary-shark/2.14"
