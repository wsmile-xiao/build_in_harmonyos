# conandata.yml — leakcanary-shark 2.14
# 源码 tarball 从 GitHub 下载（square/leakcanary tag v2.14，含完整源码 + 上游测试）
# 本包只构建纯 JVM 模块：shark / shark-graph / shark-hprof / shark-log
# SHA256: b8a58752f8d0dd15207f8e4c4e44f654386b78c988e233120f8900caf30b1f05
# （设备实测两次一致；tag v2.14 对应上游 commit 8d29638ccf25e15d84b0119b6617f0069bc0b2d8）

sources:
  url: "https://github.com/square/leakcanary/archive/refs/tags/v2.14.tar.gz"
  sha256: "b8a58752f8d0dd15207f8e4c4e44f654386b78c988e233120f8900caf30b1f05"

patches:
  - patch_file: "patches/0001-minimal-jvm-settings-and-root-build.patch"
    patch_description: "Trim the Gradle build graph to the pure-JVM shark family and drop dead/hostile infrastructure. settings.gradle keeps only :shark, :shark-graph, :shark-hprof, :shark-hprof-test, :shark-log, :shark-test plus the TYPESAFE_PROJECT_ACCESSORS preview the module build files use, and pins rootProject.name (typesafe accessors reject the Conan source folder name which is not guaranteed to match the upstream checkout dir). Root build.gradle keeps only what the JVM modules need: kotlin-gradle-plugin on the buildscript classpath, mavenCentral/gradlePluginPortal repositories (the dead jcenter() is removed), GROUP/VERSION_NAME, the Kotlin apiVersion=1.3 override and the FULL testLogging configuration. The removed blocks (AGP, dokka, detekt, binary-compatibility-validator, keeper, vanniktech maven-publish, installGitHooks, siteDokka) are Android release/doc infrastructure that cannot work without the Android SDK and are irrelevant to building and testing the shark JVM modules."
    patch_type: "portability"
  - patch_file: "patches/0002-jvm-modules-drop-maven-publish-plugin.patch"
    patch_description: "Remove the com.vanniktech.maven.publish plugin from the four shark module build files. That plugin only wires Maven-Central publication (sources/javadoc/javadocJar tasks, Sonatype staging) which is out of scope for an OHOS Conan package; dropping it also avoids dragging the dokka javadoc toolchain into the JVM build."
    patch_type: "portability"
  - patch_file: "patches/0003-gradle-properties-jdk17-tuning.patch"
    patch_description: "Tune Gradle for bishengjdk17 on HarmonyOS aarch64: raise org.gradle.jvmargs to -Xmx2g for the heap-analysis test suites and add --add-opens java.base/{java.lang,java.util,java.io,java.net,java.nio,java.lang.reflect}=ALL-UNNAMED so the Kotlin 1.4.21 compiler (which reflects into JDK internals such as ResourceBundle) can run inside the Gradle daemon on JDK 17. Note: BiSheng JDK rejects --add-opens passed through JAVA_TOOL_OPTIONS, so the flags live in the daemon JVM args; the in-process compiler execution strategy is forced via a -D system property on the launcher command line in the recipe because Kotlin 1.4.21 ignores the gradle.properties form."
    patch_type: "portability"
