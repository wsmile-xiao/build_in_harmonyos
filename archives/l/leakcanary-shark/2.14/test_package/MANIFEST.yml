# test_package/MANIFEST.yml
# Upstream test declaration file for leakcanary-shark 2.14
# CI script (build_and_test.sh L0e) requires this file
# See: docs/TEST_QUALITY_SPEC.md

package: leakcanary-shark/2.14
homepage: "https://github.com/square/leakcanary"

# Upstream tests run via Gradle test tasks (gradle --no-daemon --console=plain
# :shark-log:test :shark-hprof:test :shark-graph:test :shark:test ... + :jar)
# Upstream test framework: JUnit 4.12 (org.junit.Test), executed on the real
# device with bishengjdk 17 + Gradle 7.4.2 + Kotlin 1.4.21.
upstream_check_command: "gradle --no-daemon --console=plain :shark-log:test :shark-hprof:test :shark-graph:test :shark:test :shark-log:jar :shark-hprof:jar :shark-graph:jar :shark:jar"
upstream_test_in_build: true
upstream_test_command: "gradle --no-daemon --console=plain :shark-log:test :shark-hprof:test :shark-graph:test :shark:test :shark-log:jar :shark-hprof:jar :shark-graph:jar :shark:jar"

# Upstream test total & counting method (hmbs rule4 hard gate)
# Total registered = 172 @Test methods across the 4 upstream JUnit test module
# suites (29 test .kt files), executed in build() via Gradle test tasks.
# Count method: static @Test annotation count from the source tree matches the
# executed count summed from build/test-results/test/TEST-*.xml, so "auto" applies.
upstream_test_total: 172
upstream_test_count_method: auto

# Upstream JUnit test cases (run in build())
# Source: shark*/src/test/java/ directories
upstream_tests:
  - file: shark/src/test/java/shark/
    source: "leakcanary-2.14.tar.gz/shark/src/test/java/shark/"
    description: "HeapAnalyzer/retained-size/reference-matcher/rendering suites (16 test files, 120 @Test methods)"
    command: "gradle :shark:test"
  - file: shark-graph/src/test/java/shark/
    source: "leakcanary-2.14.tar.gz/shark-graph/src/test/java/shark/"
    description: "Hprof graph parsing/writing/stripping/deobfuscation suites (10 test files, 46 @Test methods)"
    command: "gradle :shark-graph:test"
  - file: shark-hprof/src/test/java/shark/
    source: "leakcanary-2.14.tar.gz/shark-hprof/src/test/java/shark/"
    description: "HprofReader primitive array + ProguardMapping suites (2 test files, 3 @Test methods)"
    command: "gradle :shark-hprof:test"
  - file: shark-log/src/test/java/shark/
    source: "leakcanary-2.14.tar.gz/shark-log/src/test/java/shark/"
    description: "SharkLog suite (1 test file, 3 @Test methods)"
    command: "gradle :shark-log:test"

# test_package tests (consumer-side verification, runs on HarmonyOS device)
test_package_tests:
  - file: test.sh
    description: "Java API integration test: write HPROF with HprofWriter, run HeapAnalyzer leak analysis, query HprofHeapGraph (class lookup + gc roots), deobfuscate ProguardMapping class/field, capture SharkLog message (R34 substantive verification)"
    command: "bash test.sh"

# Assertion count
# Upstream: 172 @Test methods (run in build() via Gradle test tasks)
# test_package: 9 integration checks (heap analysis x3 + heap graph x3 + proguard x2 + log x1)
assertion_count: 181
