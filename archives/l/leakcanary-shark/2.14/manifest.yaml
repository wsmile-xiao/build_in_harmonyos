version: "2.14"
software: "leakcanary-shark"
status: built
build_date: "2026-09-26"
conan_ref: "leakcanary-shark/2.14"

source:
  url: "https://github.com/square/leakcanary/archive/refs/tags/v2.14.tar.gz"
  sha256: "b8a58752f8d0dd15207f8e4c4e44f654386b78c988e233120f8900caf30b1f05"
  tar_format: tar.gz

build:
  system: gradle
  configure_options:
    - ":shark-log:test :shark-hprof:test :shark-graph:test :shark:test"
    - ":shark-log:jar :shark-hprof:jar :shark-graph:jar :shark:jar"
  dependencies:
    - "BiSheng JDK 17.0.13 (cmd-pkgs install-jdk.sh)"
    - "Gradle 7.4.2 (pinned distribution zip, mirrors.cloud.tencent.com/gradle)"
    - "kotlin-stdlib 1.3.72 / okio 2.2.2 (runtime, fetched from Maven Central by Gradle)"
  cc: ""
  cxx: ""

patches_applied:
  - "0001-minimal-jvm-settings-and-root-build.patch: keep only the pure-JVM shark modules in settings.gradle (pin rootProject.name for typesafe accessors) and trim the root build.gradle to the Kotlin plugin + mavenCentral/gradlePluginPortal (removes AGP/dokka/detekt/binary-compatibility-validator/keeper/vanniktech publish wiring and the dead jcenter())"
  - "0002-jvm-modules-drop-maven-publish-plugin.patch: drop com.vanniktech.maven.publish from the 4 shark module build files (Maven Central publication only; not needed for OHOS packaging)"
  - "0003-gradle-properties-jdk17-tuning.patch: -Xmx2g jvmargs + kotlin in-process compiler execution for bishengjdk17 on HarmonyOS"

upstream_tests:
  framework: "JUnit 4.12 (org.junit.Test) via Gradle test tasks"
  test_files: 29
  test_methods: 172
  test_command: "gradle --no-daemon --console=plain :shark-log:test :shark-hprof:test :shark-graph:test :shark:test :shark-log:jar :shark-hprof:jar :shark-graph:jar :shark:jar"
  run_in_build: true

knowledge_gained:
  - "源码编译方式：下载 GitHub tarball (square/leakcanary tag v2.14)，用 Gradle 7.4.2（与上游 wrapper 同版本）构建纯 JVM 模块"
  - "上游测试：172 个 @Test 方法（JUnit 4.12），29 个测试 .kt 文件，分布于 shark(120)/shark-graph(46)/shark-hprof(3)/shark-log(3)"
  - "build() 中运行 4 个模块的 test 任务并从 build/test-results/test/TEST-*.xml 汇总，输出 HMBS_UPSTREAM_TEST_RESULT"
  - "设备 toybox sh 跑不了 Gradle 自带 bin/gradle 启动脚本，需 java -classpath lib/* org.gradle.launcher.GradleMain 直启（gradle 8.12 包同款方案）"
  - "TYPESAFE_PROJECT_ACCESSORS 要求根项目名匹配 [a-zA-Z][A-Za-z0-9-_]*，Conan 源码目录名不可控，需在 settings.gradle 里 rootProject.name 固定"
  - "JAVA_TOOL_OPTIONS=-Dos.name=Linux -Djava.io.tmpdir=$TMPDIR 同时解决 HarmonyOS 识别与 /tmp 只读问题"
  - "Kotlin 1.4.21 编译器在 JDK17 环境用 kotlin.compiler.execution.strategy=in-process 避开 daemon 问题"
  - "运行时依赖 kotlin-stdlib 1.3.72 + okio 2.2.2 由 Gradle 从 Maven Central 解析，打包时从 ~/.gradle 缓存收集进 libexec"
