# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libkdumpfile/0.5.6
homepage: "https://github.com/ptesarik/libkdumpfile"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 通过在 OHOS PC 上实际执行 `make check` 统计 (test-suite.log)：
#   TOTAL: 206  PASS: 206  SKIP: 0  XFAIL: 0  FAIL: 0  ERROR: 0  → 100%
upstream_tests:
  - file: tests/Makefile.am
    source: libkdumpfile-0.5.6/tests/Makefile.am
    description: "automake TESTS + check_PROGRAMS 注册的全部 206 个测试 (make check 实际执行, 全部 PASS)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 调用 libkdumpfile 公开 API (kdump_new/kdump_open_fdset/kdump_get_attr/kdump_free) 验证编译/链接/运行"
    command: "./test_libkdumpfile"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 206
