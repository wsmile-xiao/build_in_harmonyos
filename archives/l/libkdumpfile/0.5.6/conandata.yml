# conandata.yml — libkdumpfile 0.5.6
# 源码采用官方上游 v0.5.6 tarball 的 Debian 官方镜像 (deb.debian.org),
# 与 GitHub release v0.5.6 内容一致; SHA256 为实测值。
# (GitHub direct release 链接当前环境不可达, 故用 Debian pool 官方源)
#
# patches 由 refresh-patch 按文件拆分生成 (77 个 git a/b 格式补丁, strip: 1)

sources:
  url: "https://deb.debian.org/debian/pool/main/libk/libkdumpfile/libkdumpfile_0.5.6.orig.tar.gz"
  sha256: "ea393ad145f42741690689432734976ba715df4fffd7fa5fac57b468340905a0"

