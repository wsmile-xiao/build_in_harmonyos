version: "0.5.6"
software: libkdumpfile
status: built
build_date: "2026-09-20"
build_system: autotools

source:
  # 与 conandata.yml 一致：GitHub release v0.5.6 链接不存在/不可达，
  # 采用 Debian 官方 pool（orig tarball，SHA256 实测一致）
  url: "https://deb.debian.org/debian/pool/main/libk/libkdumpfile/libkdumpfile_0.5.6.orig.tar.gz"
  sha256: "ea393ad145f42741690689432734976ba715df4fffd7fa5fac57b468340905a0"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-zlib"
    - "--disable-kdumpid"
    - "--enable-static"
    - "--disable-shared"
  # 与 conanfile.py requirements() 一致：仅强制 zlib；
  # lzo2/snappy/libzstd 由 configure 自动探测（检测到则启用，否则静默禁用）
  dependencies:
    - zlib/1.3.2
  cc: clang
  cxx: clang++

patches_applied:
  # 共 77 个补丁（refresh-patch 按文件拆分，git a/b 格式 strip:1）；
  # 完整逐条清单见下方 patch_classification。
  # 源码/测试逻辑修复（8 个）+ xlat 脚本 shebang（69 个）
  - "patches/0001-src-kdumpfile-diskdump.c.patch"
  - "patches/0002-src-kdumpfile-elfdump.c.patch"
  - "patches/0003-src-kdumpfile-sadump.c.patch"
  - "patches/0004-src-kdumpfile-test-blob.c.patch"
  - "patches/0005-src-kdumpfile-test-clone-attr.c.patch"
  - "patches/0006-tests-elf-vmcoreinfo.patch"
  - "patches/0007-tests-elf-xen_prstatus.patch"
  - "patches/0008-tests-err-addrxlat.c.patch"
  # 0009-0077 = 69 个 tests/xlat-* 脚本 shebang 补丁（详见 patch_classification）

compatibility:
  level: high
  issues:
    - "kdumpid 工具因 OHOS 工具链无 binutils BFD/dis-asm.h 而 --disable-kdumpid（本库核心转储解析不依赖它, 不影响 libkdumpfile/libaddrxlat）"
  notes: "musl 下需 shared_decref_locked；OHOS 无 /bin/bash 需 #!/usr/bin/env bash；musl getopt 不重排选项"

test_results:
  type: make check
  upstream_registered_tests: 206
  passed: 206
  failed: 0
  skipped: 0
  note: "OHOS PC aarch64 实机执行 make check，test-suite.log: TOTAL 206 / PASS 206 / FAIL 0 / SKIP 0 / ERROR 0 → 100%"

knowledge_gained:
  - "持有 shared->lock 写锁时释放位图会触发 bmp cleanup 回调；cleanup 内须用 shared_decref_locked（无锁变体），glibc 非递归 rwlock 二次加锁是未定义行为、musl 直接自死锁"
  - "OHOS 无 /bin/bash，测试脚本 shebang 应写成 #!/usr/bin/env bash 并在 PATH 提供 bash"
  - "musl getopt 不重排参数；选项必须在文件名之前（glibc 会 GNU 重排，掩盖了依赖顺序的调用）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libkdumpfile-0.5.6.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libkdumpfile-0.5.6.work
