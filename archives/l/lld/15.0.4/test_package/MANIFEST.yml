# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# lld 15.0.4 上游测试框架为 LLVM lit（ShTest），由 check-lld 目标驱动，
# 测试源位于上游源码 lld/test/，枚举口径见 reports/test-report.md。

package: lld/15.0.4
homepage: "https://lld.llvm.org/"

# 上游测试命令
upstream_check_command: "cmake --build . --target check-lld"

# conanfile.py build() 中已集成 check-lld（lit 全量套件）
upstream_test_in_build: true
upstream_test_command: "cmake --build <build> --target check-lld"

# 上游实际运行的测试入口（lit 套件按子目录枚举）
upstream_tests:
  - file: lld/test/COFF
    source: lld-15.0.4/lld/test/COFF
    description: "COFF 链接器 lit 测试套件（191 个 .test 入口）"
  - file: lld/test/ELF
    source: lld-15.0.4/lld/test/ELF
    description: "ELF 链接器 lit 测试套件（198 个 .test 入口）"
  - file: lld/test/MachO
    source: lld-15.0.4/lld/test/MachO
    description: "Mach-O 链接器 lit 测试套件（9 个 .test 入口）"
  - file: lld/test/MinGW
    source: lld-15.0.4/lld/test/MinGW
    description: "MinGW 链接器 lit 测试套件（2 个 .test 入口）"
  - file: lld/test/wasm
    source: lld-15.0.4/lld/test/wasm
    description: "WebAssembly 链接器 lit 测试套件（30 个 .test 入口）"
