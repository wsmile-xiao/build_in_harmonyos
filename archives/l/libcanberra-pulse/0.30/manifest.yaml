software: libcanberra-pulse
display: "libcanberra + PulseAudio driver"
version: "0.30"
upstream_name: libcanberra
upstream_version: "0.30"
status: built
build_system: autotools
build_date: 2026-09-26
compile_date: 2026-09-26
target_platform: aarch64-unknown-linux-ohos
issue: "开源鸿蒙PC专项积分赛"

source:
  url: "https://0pointer.de/lennart/projects/libcanberra/libcanberra-0.30.tar.xz"
  sha256: "c2b671e67e0c288a69fc33dc1b6f1b534d07882c2aceed37004bf48c601afa72"
  tar_format: tar.xz
  version_mapping: "Conan libcanberra-pulse/0.30 maps to upstream libcanberra 0.30 (libtool -version-info 2:5:2 -> libcanberra.so.0.2.5) built with the PulseAudio driver compiled in (--with-builtin=pulse); the self-contained null flavour is archives/l/libcanberra/0.30."

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--with-builtin=pulse"
    - "--enable-pulse"
    - "--disable-null"
    - "--disable-alsa"
    - "--disable-oss"
    - "--disable-gstreamer"
    - "--disable-udev"
    - "--disable-gtk"
    - "--disable-gtk3"
    - "--disable-tdb"
    - "--disable-lynx"
    - "--disable-gtk-doc"
    - "--with-systemdsystemunitdir=no"
    - "LIBS="
    - "VORBIS_CFLAGS=-DHAVE_VORBIS=0"
    - "VORBIS_LIBS=' '"
  dependencies:
    - pulseaudio/17.0.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-vorbis-optional.patch (wraps the whole Ogg Vorbis decoder read-vorbis.c behind #if HAVE_VORBIS so libvorbis/libogg become optional)"
  - "0002-vorbis-read-sound-file-guards.patch (guards the vorbis fallbacks in read-sound-file.c; WAV kept)"
  - "0003-config.guess-harmonyos.patch (config.guess learns HarmonyOS / aarch64-unknown-linux-ohos)"
  - "0004-config.sub-ohos.patch (config.sub accepts linux-ohos)"
  - "0005-configure-ltdl.patch (neutralizes configure's unconditional libltdl hard error; --with-builtin=pulse leaves BUILTIN_DSO at 0 and never links $(LIBLTDL))"

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml and test_package/MANIFEST.yml"
    - "official source sha256 verified"
    - "recipe builds and packages on the OHOS device worker: Package '3ede511660589a725610954353afc1822d4019b6' created"
    - "test_package two consumers: api_surface 61 checks + pulse_contract 74 checks = 135 assertions, 0 failed"
    - "libcanberra.so.0 DT_NEEDED pins libpulse.so.0 (pulse backend compiled in); the null flavour at archives/l/libcanberra/0.30 only needs libc.so"
  remote:
    - "pending GitCode CI build_and_test.sh run on PR"
  pending:
    - "PR validation / GitCode CI / REL upload"

knowledge_gained:
  - "libcanberra resolves its audio driver through an unconditional PKG_CHECK_MODULES(PULSE, libpulse >= 0.9.11) in configure.ac. The published pulseaudio/17.0.1 package ships lib/pkgconfig/libpulse.pc but the file records prefix=/ (recipes install into a staging prefix), so PKG_CONFIG_PATH alone yields -I/include -L/lib; PKG_CONFIG_SYSROOT_DIR pointed at the package folder re-roots the flags. The bundled old pkg.m4 expands the env-branch form, so pre-seeding PULSE_CFLAGS/PULSE_LIBS does not work - pkg-config --exists has to succeed."
  - "AutotoolsDeps aggregates every dependency library into LIBS and configure links LIBS into each probe program. The published PulseAudio binaries carry no .codesign section and the OHOS loader refuses to map such an object, so the basic 'is the C compiler working?' probe dies with 'cannot run C compiled programs' / 'Error loading shared library libpulse.so.0'. Passing the precious variable LIBS= empties LIBS for all probes while PULSE_CFLAGS/PULSE_LIBS still reach src/Makefile."
  - "--with-builtin=pulse compiles pulse.c into libcanberra.so and forces HAVE_ALSA/HAVE_OSS/HAVE_GSTREAMER/HAVE_NULL to 0, leaving BUILTIN_DSO at 0 so dso.c/driver-order.c and $(LIBLTDL) are never used - but configure still aborts unconditionally when the ltdl probe leaves LIBLTDL empty, hence patches/0005. Unlike the null flavour, no driver_playing() stub patch is needed because pulse.c implements it."
  - "A driver compiled into libcanberra.so cannot be observed through a plugin module or a public query, so the package proves it two ways: the shared library's DT_NEEDED pins libpulse.so.0, and every backend's driver_open() starts with a driver-name guard, so ca_context_open('pulse') gets past the guard (CA_ERROR_NOTAVAILABLE without a server) while 'null'/'alsa'/'no-such-backend' all report CA_ERROR_NODRIVER - the exact opposite of archives/l/libcanberra/0.30 (--with-builtin=null)."
  - "The OHOS loader only maps signed objects: libcanberra.so.0 depends on libpulse.so.0, so any consumer run must resolve it against the signed platform client libraries (/system/lib64/libpulseaudio.z.so symlinked as libpulse.so.0). The test package therefore runs each consumer twice - once in the plain conanrun environment to document the limitation of the published dependency, and once with the signed libraries on LD_LIBRARY_PATH for the real assertions."
