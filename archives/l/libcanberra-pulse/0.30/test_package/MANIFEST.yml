# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# 上游测试核验：解包 libcanberra-0.30.tar.xz 后 configure.ac / src/Makefile.am
# 无任何 TESTS / check_PROGRAMS（自动化测试框架不存在）；唯一可执行
# test-canberra 是 noinst 演示程序（无断言，需真实音频后端播放系统声音），
# 不计入自动化测试。故上游自动化测试数 = 0。
#
# 适配后由两个 consumer 覆盖公共 canberra.h API，并在没有 PulseAudio 服务端、
# 没有声卡的机器上真实执行。
#
# 驱动判定：--with-builtin=pulse 把 pulse 驱动编进 libcanberra.so，产物里
# 没有可 dlopen 的插件模块，也没有「当前编入了哪个驱动」的公开查询接口。
# 可观测的契约是每个驱动在 driver_open() 里的名字守卫：编入 pulse 的库对
# "pulse" 放行、对 "null"/"alsa" 返回 CA_ERROR_NODRIVER；而
# archives/l/libcanberra/0.30（--with-builtin=null）恰好相反。
#
# 运行环境：libcanberra.so.0 的 DT_NEEDED 含 libpulse.so.0，而制品仓
# pulseaudio/17.0.1 缺 .codesign、加载器拒绝映射，故 conanfile.py 的 test()
# 先用纯 conanrun 环境跑一次并只记录该现状，再用指向平台已签名客户端库
# （/system/lib64/libpulseaudio.z.so 软链为 libpulse.so.0）的 LD_LIBRARY_PATH
# 执行正式断言。

package: libcanberra-pulse/0.30
homepage: "http://0pointer.de/lennart/projects/libcanberra/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "none"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无自动化测试，保持空列表）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: api_surface.c
    description: "libcanberra.so 全部 19 个导出符号（ca_proplist_create/destroy/sets/setf/set、ca_context_create/set_driver/change_device/open/destroy/change_props/change_props_full/play_full/play/cache_full/cache/cancel/playing、ca_strerror）强类型活重定位 + 错误字符串域扫描 + proplist 生命周期"
    command: "./libcanberra_api_surface"
  - file: pulse_contract.c
    description: "CA_MAJOR/CA_MINOR/CA_CHECK_VERSION 与错误码枚举（-19..0）编译期契约 + ca_strerror 字符串表 + PulseAudio 后端判定（open(\"pulse\") 不返回 NODRIVER、open(\"null\")/open(\"alsa\")/open(\"no-such-backend\") 必须返回 NODRIVER）+ play/cache 缺属性守卫 + 无服务端时 play 不可成功"
    command: "./libcanberra_pulse_contract"

# 测试断言总数（api_surface 61 + pulse_contract 74，真机实测）
assertion_count: 135
