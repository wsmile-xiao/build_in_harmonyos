knowledge_gained:
  - "BSD 基础系统工具（usr.bin/*）的 Makefile 是 BSD make 片段（.include <bsd.prog.mk>），OHOS/CI 无 bsd.prog.mk，无法用 make；须绕开 make，直接用 Conan 提供的编译器编译单一 TU"
  - "OHOS musl libc 的 <sys/cdefs.h> 不提供 NetBSD 专有宏 __COPYRIGHT/__RCSID；且无 getprogname(3)（仅导出 __progname）——需 #ifndef 兜底宏 + 非 BSD 平台 getprogname fallback；移植补丁不得引入 __OHOS__，用 POSIX 兼容写法"
  - "u_int 是 BSD <sys/types.h> 的拼写，musl 下仅在 _GNU_SOURCE/_BSD_SOURCE 之后可见（另需显式包含 <sys/types.h>）；OHOS 下实测 -D_GNU_SOURCE 亦不生效，直接改用 portable 的 unsigned int"

