    reason: "The archive contains exactly three files — Makefile (132 B), leave.1 (3391 B) and leave.c (4671 B) under leave-1.12/; there is no tests/ directory, no test source, no test data and no CI configuration."
  - source: "leave-1.12/Makefile (6 lines, complete)"
    reason: "The entire build description is `PROG= leave` plus `.include <bsd.prog.mk>`: it declares no test:/check:/regress: target, and the generic bsd.prog.mk targets it inherits are build/install only."
  - source: "leave-1.12/leave.c (187 lines)"
    reason: "Single translation unit containing only the program (main / doalarm / usage); there are no assertions, no test hooks and no self-test entry point."
  - source: "NetBSD/FreeBSD usr.bin/leave provenance"
    reason: "leave is a base-system utility covered by the whole-OS build rather than a per-tool test suite; the historical 4.4BSD leave has never shipped tests."
