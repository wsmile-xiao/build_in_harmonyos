upstream_test_count: 0
upstream_test_execution: "N/A — upstream provides no test suite (see upstream_test_census). Nothing was skipped for environmental reasons: there is genuinely no upstream test to execute."
upstream_check_command: "N/A (no upstream test/check target exists)"

# ── test_package entries ────────────────────────────────────────────────────
consumer_test_count: 1
ohos_specific_test_count: 1

test_package_tests:
  - file: test_leave.sh
    name: consumer-generic
    description: "Single consumer test entry that drives the installed bin/leave 5 times: 3 invalid-argument checks (9999 -> invalid minutes, 2400 -> hours>23, 12x -> non-digit) each asserting exit 1 and 'Usage: leave [[+]hhmm]' on stderr; the no-argument + EOF path asserting the prompt and exit 0; and the valid '+6' scheduling path (parent exit 0 + alarm announcement) whose forked nagging child is explicitly killed."
    command: "bash test_leave.sh <package>/bin/leave <workdir>"

ohos_specific_tests:
  - file: ohos_specific_test.py
    name: ohos-specific
    description: "Single HarmonyOS-specific entry (independent Python suite, fail closed: any exception is a failure, no silent skips). It both inspects the packaged binary and really executes it on the HarmonyOS PC (R53): invalid-argument exit code, no-argument prompt path, and the '+6' alarm scheduling path with child reaping."
    command: "python3 ohos_specific_test.py <package>/bin/leave"

ohos_specific_checkpoints:
  - file: ohos_specific_test.py
    name: ohos-elf-identity
    description: "Direct ELF header parse (no readelf dependency): EI_CLASS=ELFCLASS64, EI_DATA=ELFDATA2LSB (little-endian), e_machine=EM_AARCH64 (183) on the packaged bin/leave."
    command: "python3 ohos_specific_test.py <package>/bin/leave"
  - file: ohos_specific_test.py
    name: ohos-musl-interpreter
    description: "PT_INTERP segment parsed from the program headers: interpreter is exactly /lib/ld-musl-aarch64.so.1 — OHOS musl libc, not glibc."
    command: "python3 ohos_specific_test.py <package>/bin/leave"
  - file: ohos_specific_test.py
    name: ohos-no-rpath
    description: "readelf -d on the packaged bin/leave: no RPATH/RUNPATH dynamic entries (the tool links only against libc)."
    command: "python3 ohos_specific_test.py <package>/bin/leave"
  - file: ohos_specific_test.py
    name: ohos-invalid-arg-exit
    description: "Actually executes `leave 9999` on the OHOS PC and asserts exit status 1 with 'Usage: leave [[+]hhmm]' on stderr — the time-argument parsing path."
    command: "python3 ohos_specific_test.py <package>/bin/leave"
  - file: ohos_specific_test.py
    name: ohos-noarg-eof
    description: "Actually executes `leave` with stdin at EOF and asserts it prints 'When do you have to leave?' and exits 0."
    command: "python3 ohos_specific_test.py <package>/bin/leave"
  - file: ohos_specific_test.py
    name: ohos-valid-schedule
    description: "Actually executes `leave +6` on the OHOS PC: the parent process exits 0 and the forked child announces 'Alarm set for ... (pid N)'; the test parses N, sends SIGKILL and confirms the child is gone (deterministic, no hang)."
    command: "python3 ohos_specific_test.py <package>/bin/leave"

test_scenario_count: 5
assertion_count: 5
assertion_count_basis:
  invalid_minutes_usage_exit1: 1
  hours_over_23_usage_exit1: 1
  non_digit_usage_exit1: 1
  no_argument_eof_prompt_exit0: 1
  valid_plus6_alarm_parent_exit0: 1

ohos_checkpoint_count: 6
ohos_checkpoint_basis:
  elf_identity_class_data_machine: 3
  musl_interpreter: 1
  no_rpath: 1
  invalid_arg_exit_and_usage: 2
  noarg_eof_prompt_and_exit: 2
  valid_schedule_parent_exit_announce_kill: 3
hardware_playback_required: false
hardware_playback_note: "leave is a pure-C command-line tool; every check runs on the HarmonyOS PC itself over ordinary process execution, with no hardware or peripheral dependency. The scheduling test is made deterministic by using 'leave +6' (parent returns immediately, forked child is killed) instead of waiting for a real alarm."
