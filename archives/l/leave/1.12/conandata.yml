# conandata.yml — leave 1.12
#
# R39 source provenance
# ---------------------
# leave is part of the BSD base systems (NetBSD/FreeBSD usr.bin/leave; original
# 4.4BSD code; BSD-3-Clause; Copyright (c) 1980, 1988, 1993 The Regents of the
# University of California).  The upstream projects publish *no release
# artifact* for this tool: there is no tarball, no release tag and no versioned
# download page — the program only exists inside the NetBSD/FreeBSD source
# trees and in the historical 4.4BSD-Lite distribution.
#
# The URL below is the pristine upstream source archive as redistributed by
# Debian under the "orig" name.  A Debian *.orig.tar.gz is by definition the
# *unmodified* upstream tarball (Debian's own changes live in the separate
# debian.tar.xz); this one contains exactly the three upstream files
# (Makefile, leave.1, leave.c) with their original 2003 timestamps and no
# debian/ directory — verified with `tar tzvf` (see notes.md, "Source
# provenance").  Because no first-party hosting exists, this authoritative
# mirror is the only faithful location of the exact upstream 1.12 source.
# No Debian patch content is used: patch 0001 below was authored for this
# adaptation.

sources:
  url: "https://deb.debian.org/debian/pool/main/l/leave/leave_1.12.orig.tar.gz"
  sha256: "de30529de8abf49004da4120ca352d5c588a657f8845e44d5e83a4860e6bbe1f"

patches:
  - patch_file: "patches/0001-leave.c.patch"
    strip: 1
    patch_description: >-
      Portability for non-BSD libc: add #ifndef fallbacks for the NetBSD
      __COPYRIGHT/__RCSID macros, add a getprogname(3) fallback compiled only
      on non-BSD platforms, and use the portable `unsigned int` spelling
      instead of the BSD `u_int` type.
    patch_type: "portability"
