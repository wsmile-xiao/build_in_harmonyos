# test_package/MANIFEST.yml — lpctools 1.07
package: lpctools/1.07
homepage: "https://sources.debian.org/src/lpctools/1.07/"

# 上游无独立测试套件：lpctools 的 Makefile 只有 all / clean / mrproper 三个
# 目标，没有 check/test。它的"自检"是 lpc_binary_check 那个**可执行程序**
# （用来检查烧录镜像的向量表与 user code），不是测试用例；且它需要真实的
# LPC 器件或至少一条能应答的串口线，OHOS worker 上不存在。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_lpctools.c
    description: >-
      消费者测试 30 条断言。lpctools 的三个产物都是可执行程序、没有可链接的
      库 API，所以用例按"该程序的真实调用方式"验证：把包内 bin/ 下的
      lpcprog / lpcisp / lpc_binary_check 以子进程拉起，对用法输出、选项解析
      诊断、退出码做确定性断言。
      ★ 零硬件：串口路径一律指向 /dev/null，握手立刻 EOF，所以"连不上目标"
        这条真实失败路径能稳定复现，不需要接 LPC 板子。
      (A) lpcprog 的用法与选项解析：无参数 → 退出码 255 + `No command given.
          use -h or --help for help on available commands.`；-h / --help →
          退出码 0，打印工具横幅、`-d <dev_name> -c <command>` 用法行、
          五个命令 `dump, flash, id, blank, go`、默认波特率 B115200；
          --bogus → 退出码 0 + `unrecognized option: bogus` 并附带完整用法；
      (B) lpcprog 两条零硬件失败路径：-c id 不给 -d → 退出码 0 + `No serial
          device given, exiting`；-d /dev/null -c id → 退出码 255 + `serial_read:
          end of file` + `Unable to connect to target, consider hard reset of
          target or link`；
      (C) lpcisp：无设备 → `No serial device given` 且退出码 0；-h 打印位置参数
          形式的用法（device 是位置参数，不是 -c）；-c 被拒（`unrecognized
          option: c`）——与 lpcprog 的 -c 语义形成对照；
      (D) lpc_binary_check：无文件名 → 退出码 255 + `Need one (and only one)
          file name to check.`；-h → 退出码 **255**（与 lpcprog -h 的 0 构成
          真实行为差异）；检查空文件 → 退出码 254。
      ★ 用法行断言只查 argv[0] 之后的那一段：这三个程序把 argv[0] 原样打进
        用法行（实测得到的是完整调用路径），硬编码 "./lpcprog" 这类字面量会
        随调用路径变化而失效。
      全部期望文本与期望退出码取自 qemu-aarch64 + OHOS sysroot 下的**实测输出**。
    command: "test_lpctools <package_root>"

# 测试断言总数
assertion_count: 30
