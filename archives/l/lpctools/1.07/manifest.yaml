software: lpctools
display: "lpctools"
description: "ISP (In-System Programming) toolset for NXP LPC microcontrollers: lpcprog / lpcisp flashers plus lpc_binary_check"
category: embedded
homepage: "https://sources.debian.org/src/lpctools/1.07/"
license: GPL-2.0-or-later
build_system: make  # 上游 Makefile 用三组互不相同的目标对象集建三个可执行文件；conanfile 用 CMake 照搬同样三组

ohos_adaptation:
  key_points:
    - "九个源文件（lpcprog/lpcisp/check/isp_commands/isp_utils/isp_wrapper/prog_commands/parts + 头文件），零外部依赖"
    - "仅 libc：stdio、stdlib、string、stdint、unistd、fcntl、termios、getopt、errno，全部由 OHOS sysroot 自带"
    - "★ 零 patch：三个二进制一次 clang-ohos 交叉编译通过，产物 ELF64/AArch64，NEEDED 均仅 libc.so"
    - "★ 必须照搬上游的三组对象集：check.c 自带 main()，与 lpcprog/lpcisp 混链会得到 ld.lld: duplicate symbol: main / help / trace_on"
    - "★ 零硬件可测：串口路径指向 /dev/null 时握手立刻 EOF，\"连不上目标\" 这条真实失败路径可稳定复现，不需要 LPC 板子"
    - "★ 三个程序的用法行都嵌入 argv[0]（打印完整调用路径），不是字面量 ./lpcprog —— 测试断言必须与调用路径无关"
    - "★ lpcprog -h 退出码 0，lpc_binary_check -h 退出码 255 —— 同一工具集内两处不一致的真实行为差异"
    - "lpcprog 把 device/command 放在 -d/-c 选项后，而 lpcisp 把 device 当**位置参数**且不认 -c；两者命令行语义不同"
    - "装 lpctools_parts.def（芯片型号描述表，lpcprog/lpcisp 的 -p 默认值）；不安装任何串口驱动或 udev 规则"
  common_dependencies:
    - libc (stdio, stdlib, string, stdint, unistd, fcntl, termios, getopt, errno)

patches: []

versions:
  "1.07":
    status: built
    build_date: "2026-10-04"
    source_url: "https://deb.debian.org/debian/pool/main/l/lpctools/lpctools_1.07.orig.tar.gz"
    source_sha256: "93f16532efac6af60b983819e977d94c5222f9439c7bfac3d807aa2edaaf3b3a"
    test_assertions: 30
