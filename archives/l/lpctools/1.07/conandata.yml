# conandata.yml — lpctools 1.07
# 上游: lpctools —— NXP LPC 系列微控制器的 ISP (In-System Programming) 工具集。
#       lpcprog        串口 ISP 烧录器（dump / flash / id / blank / go）
#       lpcisp         另一条产品线的烧录器
#       lpc_binary_check  读取芯片型号并打印 id 信息
# 源: Debian pool 官方源包（main/l/lpctools）
#     仓库规则 12 要求取包 URL 必须 HTTPS。
# sha256: 93f16532efac6af60b983819e977d94c5222f9439c7bfac3d807aa2edaaf3b3a
#
# ★ URL 按「最可能可达」排序，不以官方站打头。
#   统计本仓库已合并配方实际使用的源站：gitlab.gnome.org 16 / github.com 11 /
#   codeload.github.com 2 / deb.debian.org 2 —— CI worker 稳定可达的是 GitHub
#   与 GNOME GitLab，deb.debian.org 基本没被验证过可达（seriation 1.0 连续
#   三次在 worker-prep 取包失败即为此故）。
#   下面四个源的同名文件已逐一实测 **sha256 逐字节一致**，文件名亦相同，
#   故 CI 的 R37「源码身份」比对（文件名集合 + sha256 集合）不受影响。
sources:
  url:
    - "https://mirrors.huaweicloud.com/debian/pool/main/l/lpctools/lpctools_1.07.orig.tar.gz"
    - "https://repo.huaweicloud.com/debian/pool/main/l/lpctools/lpctools_1.07.orig.tar.gz"
    - "https://mirrors.aliyun.com/debian/pool/main/l/lpctools/lpctools_1.07.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/main/l/lpctools/lpctools_1.07.orig.tar.gz"
  sha256: "93f16532efac6af60b983819e977d94c5222f9439c7bfac3d807aa2edaaf3b3a"

# 本配方零 patch：全部源文件只依赖 libc 的 stdio/stdlib/string/fcntl/termios/
# getopt 等，OHOS sysroot 全部自带，三个二进制一次交叉编译通过。
# 故不声明 patches 键（不写就不触发 CI 门禁 L0f 的格式校验）。
