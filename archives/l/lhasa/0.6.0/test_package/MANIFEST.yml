package: lhasa/0.6.0
homepage: "https://fragglet.github.io/lhasa/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream test programs (automake check framework)
upstream_tests:
  - file: test-crc16
    source: test/test-crc16.c
    description: "CRC-16 calculation tests"
    command: "./test-crc16"
  - file: test-basic-reader
    source: test/test-basic-reader.c
    description: "Basic LHA reader tests"
    command: "./test-basic-reader"
  - file: test-decoder
    source: test/test-decoder.c
    description: "Decoder unit tests"
    command: "./test-decoder"
  - file: test-decompress
    source: test/test-decompress
    description: "Decompression integration tests"
    command: "./test-decompress"
  - file: test-file-headers
    source: test/test-file-headers
    description: "File header parsing tests"
    command: "./test-file-headers"
  - file: test-list-output
    source: test/test-list-output
    description: "List output format tests"
    command: "./test-list-output"
  - file: test-crc-output
    source: test/test-crc-output
    description: "CRC output tests"
    command: "./test-crc-output"
  - file: test-print
    source: test/test-print
    description: "Print output tests"
    command: "./test-print"
  - file: test-dry-run
    source: test/test-dry-run
    description: "Dry-run mode tests"
    command: "./test-dry-run"
  - file: test-extract-regression
    source: test/test-extract-regression
    description: "Extract regression tests"
    command: "./test-extract-regression"
  - file: test-extract-mac
    source: test/test-extract-mac
    description: "Mac OS archive extraction tests"
    command: "./test-extract-mac"
  - file: test-extract-msdos
    source: test/test-extract-msdos
    description: "MS-DOS archive extraction tests"
    command: "./test-extract-msdos"
  - file: test-extract-os2
    source: test/test-extract-os2
    description: "OS/2 archive extraction tests"
    command: "./test-extract-os2"
  - file: test-extract-unix
    source: test/test-extract-unix
    description: "Unix archive extraction tests"
    command: "./test-extract-unix"
  - file: test-extract-windows
    source: test/test-extract-windows
    description: "Windows archive extraction tests"
    command: "./test-extract-windows"
  - file: test-extract-misc1
    source: test/test-extract-misc1
    description: "Miscellaneous extraction tests 1"
    command: "./test-extract-misc1"
  - file: test-extract-misc2
    source: test/test-extract-misc2
    description: "Miscellaneous extraction tests 2"
    command: "./test-extract-misc2"

# test_package tests (consumer-side verification)
test_package_tests:
  - file: test.c
    description: "Lhasa library API smoke test"
    command: "./test_lhasa"

assertion_count: 4

# Upstream test accounting
upstream_test_count: 17
upstream_test_skipped_reasons: |
  No tests skipped: all 17 execute and pass. Two portability fixes are applied
  to test_common.sh in build() to get there:
  1. HMDFS: bash getcwd() fails on symlink paths, leaving $PWD unbound under
     set -u. Now uses ${PWD:-.}.
  2. musl does not look up zoneinfo by name and ignores TZDIR, so the suite's
     TZ=Europe/London degrades to a zero-offset abbreviation. DST and the
     1968-1971 all-year BST period are both lost, shifting 9 timestamp tests
     by exactly 3600s. Now given the tzfile absolute path instead.