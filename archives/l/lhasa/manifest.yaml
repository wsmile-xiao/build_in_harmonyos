software: lhasa
display: "Lhasa — LHA/LZH archive tool and library"
description: "Lhasa is a command-line tool for extracting LHA archives (.lzh, .lzs) and a C library (liblhasa) for reading LHA archives."
category: compress
homepage: "https://fragglet.github.io/lhasa/"
license: ISC
build_system: autotools

ohos_adaptation:
  key_points:
    - "Pure C library, no external dependencies"
    - "Builds with autotools, requires --build=aarch64-unknown-linux-gnu for config.guess"
    - "HMDFS workaround: use CONFIG_SHELL=/bin/sh to avoid bash getcwd() failure"
    - "HMDFS workaround: patch umask 077 to umask 0 for config.status temp dir creation"
  common_dependencies: []

versions:
  "0.6.0":
    status: built
    build_date: "2026-08-23"
    conan_ref: "lhasa/0.6.0"
    note: "First adaptation for HarmonyOS PC"