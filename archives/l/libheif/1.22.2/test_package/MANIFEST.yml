# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libheif/1.22.2
homepage: "https://github.com/strukturag/libheif"

# 上游测试命令
upstream_check_command: "ctest"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: N/A
    source: libheif-1.22.2/tests
    description: "上游测试在构建时已禁用 (BUILD_TESTING=OFF)"
    command: "N/A"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "L1 冒烟测试: heif_get_version + heif_context_alloc/free"
    command: "./test_libheif"

# 测试断言总数
assertion_count: 3
