software: libheif
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.22.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.22.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# 构建系统类型（verify-build 要求的顶层字段）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/strukturag/libheif/archive/refs/tags/v1.22.2.tar.gz"

  # 源码校验和
  sha256: "af30a8b32dfbc1dc86a7f0f55a53107dad35010a65ebf1feb468082e402b11e0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（cmake 格式）
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DWITH_EXAMPLES=OFF"
    - "-DWITH_GDK_PIXBUF=OFF"
    - "-DBUILD_TESTING=OFF"
    - "-DWITH_LIBDE265=OFF"
    - "-DWITH_X265=OFF"
    - "-DWITH_AOM_DECODER=OFF"
    - "-DWITH_AOM_ENCODER=OFF"
    - "-DWITH_X264=OFF"
    - "-DWITH_DAV1D=OFF"
    - "-DENABLE_PLUGIN_LOADING=OFF"
    - "-DWITH_LIBSHARPYUV=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
