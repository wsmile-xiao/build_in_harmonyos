software: libnoise
version: "1.0.0"
conan_ref: "libnoise/1.0.0"
status: built
build_date: "2026-09-18"
build_system: cmake

source:
  url: "https://downloads.sourceforge.net/project/libnoise/libnoise%20sources/1.0.0/libnoisesrc-1.0.0.zip"
  sha256: "34ed402f43f30ce5e39812642c9533c11082cd2bc092341c65160f5c743be95b"
  tar_format: zip

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF (Conan shared option default; shared=True flips it)"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libnoise 1.0.0 的上游构建是手写递归 Makefile，编译规则硬编码 libtool --mode=compile；OHOS 构建环境没有 libtool，配方改为导出自带 CMakeLists.txt 按 noise/src/Sources 的同一 35 个翻译单元编译，上游源文件零修改、零补丁"
  - "1.0.0 源码 zip 顶层是 COPYING.txt 与 noise/ 两个条目，Conan get(strip_root=True) 会因多根归档失败，必须 strip_root=False 后由配方 CMakeLists 用 noise/ 前缀寻址"
  - "35 个 .cpp 与全部头文件在 OHOS SDK clang（C++17）下零警告错误直接编译，无 throw() 异常规范、无 register 等老语法残留"
  - "上游安装布局是 <prefix>/include/noise/{*.h,module/,model/}（cp -R include /usr/local/include/noise），消费者按 #include <noise/noise.h> 引用；soname 链 libnoise.so.0.3 / libnoise.so.0，CMake 用 VERSION 0.3 SOVERSION 0 复刻"
  - "1.0.0 无任何测试入口（无 tests/ 目录、Makefile 无 check 目标、无 CTest），消费者测试以 16 断言覆盖 Perlin/Billow/RidgedMulti、ScaleBias 模块图精确算术、ExceptionNoModule 契约、四个 model 类与 LatLonToXYZ"
