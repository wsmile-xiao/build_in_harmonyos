# test_package/MANIFEST.yml — libnoise 1.0.0 verification manifest
#
# Upstream 1.0.0 ships no test suite: the source zip contains only
# COPYING.txt, doc/, include/, lib/, noise project files (src/, Makefile,
# INSTALL) and win32/ MSVC project files.  There is no tests/ directory, no
# CTest enable_testing()/add_test() call and no check target in any of the
# Makefiles (top-level goals: all/clean/install/doc/src/include/lib only).
# The inventory evidence is recorded in ../notes.md, and the library is
# verified through the installed-package consumer program below.
package: libnoise/1.0.0
software: libnoise
version: "1.0.0"
homepage: "https://libnoise.sourceforge.net/"

upstream_check_command: "none (1.0.0 has no upstream test suite; top-level Makefile has no check target)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_type: installed-package
test_package_tests:
  - file: test_libnoise.cpp
    name: test_libnoise
    description: "16-assertion consumer contract: deterministic/finite/coherent Perlin sampling, parameter setters, Billow/RidgedMulti generators, ScaleBias module graph (exact source*scale+bias), ExceptionNoModule contract, Sphere/Cylinder/Plane/Line model layer, LatLonToXYZ unit-sphere helper"
    command: "./test_libnoise"

executables:
  - name: test_libnoise
    purpose: "installed-package API contract verification against the packaged headers and library"

cases: 1
assertions: 16
