# test_package/MANIFEST.yml — libbgcode 0.0-git20260521.6f4ad7c
# 上游官方测试声明文件 (CI build_and_test.sh L0e 强制要求)
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 统计口径: 上游 Catch2 TEST_CASE 经 catch_discover_tests 注册为 ctest 条目，
# 口径 ctest_entries；总数 8 为该提交官方全部测试（2 core + 2 binarize +
# 4 convert），非可运行子集。conanfile.py build() 内以
# `ctest --output-on-failure` 真实运行，计数唯一来源为
# Testing/Temporary/LastTest.log。

package: "libbgcode/0.0-git20260521.6f4ad7c"
homepage: "https://github.com/prusa3d/libbgcode"

upstream_test_total: 8
upstream_test_count_method: ctest_entries

# 上游测试命令 (conanfile.py build() 末尾真实执行)
upstream_check_command: "ctest --output-on-failure"
# 本配方 build() 在 conan create 内运行上游 ctest 套件并解析 LastTest.log，
# 非零失败即 conan create 失败；标记 HMBS_UPSTREAM_TEST_RESULT。
upstream_test_in_build: true

# 上游实际运行的测试 (Catch2 TEST_CASE -> ctest 条目)
upstream_tests:
  - id: "core-file-transversal"
    file: tests/core/core_tests.cpp
    source: "prusa3d/libbgcode @ 6f4ad7c tests/core/core_tests.cpp"
    command: "ctest -R core_tests"
    description: "遍历 mini_cube_b.bgcode 全部 block 并校验 checksum（File transversal）"
  - id: "core-search-gcode-blocks"
    file: tests/core/core_tests.cpp
    source: "prusa3d/libbgcode @ 6f4ad7c tests/core/core_tests.cpp"
    command: "ctest -R core_tests"
    description: "按类型检索 GCode block（Search for GCode blocks）"
  - id: "binarize-meatpack-indented-comments"
    file: tests/binarize/binarize_tests.cpp
    source: "prusa3d/libbgcode @ 6f4ad7c tests/binarize/binarize_tests.cpp"
    command: "ctest -R binarize_tests"
    description: "缩进注释经 MeatPack 往返保留（本次提交新增，覆盖 6f4ad7c 修复点）"
  - id: "binarize-meatpack-remove-comments"
    file: tests/binarize/binarize_tests.cpp
    source: "prusa3d/libbgcode @ 6f4ad7c tests/binarize/binarize_tests.cpp"
    command: "ctest -R binarize_tests"
    description: "Flag_RemoveComments 下缩进注释被移除（本次提交新增）"
  - id: "convert-binary-to-ascii"
    file: tests/convert/convert_tests.cpp
    source: "prusa3d/libbgcode @ 6f4ad7c tests/convert/convert_tests.cpp"
    command: "ctest -R convert_tests"
    description: "mini_cube_b.bgcode 转 ascii 并与参照 gcode 逐行比对"
  - id: "convert-ascii-to-binary"
    file: tests/convert/convert_tests.cpp
    source: "prusa3d/libbgcode @ 6f4ad7c tests/convert/convert_tests.cpp"
    command: "ctest -R convert_tests"
    description: "mini_cube_a.gcode 转 binary 再转回，往返一致"
  - id: "convert-binary-to-ascii-ps281"
    file: tests/convert/convert_tests.cpp
    source: "prusa3d/libbgcode @ 6f4ad7c tests/convert/convert_tests.cpp"
    command: "ctest -R convert_tests"
    description: "PS 2.8.1 格式 binary 转 ascii 并与参照比对"
  - id: "convert-ascii-to-binary-ps281"
    file: tests/convert/convert_tests.cpp
    source: "prusa3d/libbgcode @ 6f4ad7c tests/convert/convert_tests.cpp"
    command: "ctest -R convert_tests"
    description: "PS 2.8.1 格式 ascii 转 binary 再转回，往返一致"

# test_package 自带测试 (消费者视角验证)
test_package_tests:
  - id: "convert-contract"
    source: "convert_contract.cpp"
    command: "convert_contract"
    description: >-
      经 convert API 做 ascii->binary->ascii 往返：输入为最小 PrusaSlicer
      格式样本（含 producer 头、printer/print/slicer 元数据，与上游
      convert_tests 同构），配置与上游一致（slicer Deflate + gcode
      Heatshrink_12_4 + MeatPackComments）；两次 EResult::Success、
      bgcode 非空、往返文本保留 G1 X10 / Y20，共 5 个检查。
  - id: "core-contract"
    source: "core_contract.cpp"
    command: "core_contract"
    description: >-
      经 Binarizer API 写 bgcode（set_enabled(true) 后
      initialize/append_gcode/finalize，预置 printer/print/slicer 各一条
      元数据以满足 enabled 初始化要求），再用 core API 做非空、
      is_valid_binary_gcode、read_header 校验，共 6 个检查。

test_counting:
  upstream_independent_total: 8
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 11
