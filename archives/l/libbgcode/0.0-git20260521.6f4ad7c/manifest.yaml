# 版本级 manifest
# 文件位置: archives/l/libbgcode/0.0-git20260521.6f4ad7c/manifest.yaml
# 遵循 knowledge/ARCHIVE-SPEC.md v3.0（交叉校验用，CI 以 conanfile.py 为准）

version: "0.0-git20260521.6f4ad7c"
software: "libbgcode"
status: built
build_date: "2026-09-20"
build_system: "cmake"
conan_ref: "libbgcode/0.0-git20260521.6f4ad7c"

source:
  url: "https://github.com/prusa3d/libbgcode/archive/6f4ad7ce6b0e638b760199d6611039a610a5a479.tar.gz"
  sha256: "f40e669226e9d3236799e22347ee7727bd411d3993b79c192717b1ce6f22efc5"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DLibBGCode_BUILD_TESTS=ON"
    - "-DLibBGCode_BUILD_COMPONENT_Binarize=ON"
    - "-DLibBGCode_BUILD_COMPONENT_Convert=ON"
    - "-DLibBGCode_BUILD_CMD_TOOL=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies:
    - boost/1.90.0.4
    - zlib/1.3.1.1
    # heatshrink v0.4.1 + Catch2 v3.8.1 vendored (no conan nodes)
  cc: clang
  cxx: clang++
  profile: "ci/conan/profiles/ohos-aarch64 (compiler.cppstd=17, compiler.libcxx=libc++, os.version=6.0)"

patches_applied:
  - "0001-conan-deps-target-mapping.patch"

tests:
  upstream: "8 个 ctest 条目（core 2 + binarize 2 + convert 4，Catch2 经 catch_discover_tests 注册），conanfile.py build() 内 ctest 真实运行，计数唯一来源 Testing/Temporary/LastTest.log"
  test_package: "2 个消费者可执行文件（convert_contract 5 检查 + core_contract 6 检查），ctest 真实运行"

knowledge_gained:
  - "heatshrink v0.4.1 随配方 vendor（上游 Makefile 直编双档案，随本包发布并重导出 heatshrink::dynamic/static；dynalloc 风味等价于上游要的 heatshrink_dynalloc）"
  - "registry boost 无 nowide 编译组件，测试仅用 boost::nowide::fopen（POSIX 头文件直通），用 Boost::boost 链接并去掉 COMPONENTS 请求即可"
  - "Catch2 v3.8.1 随配方 vendor（conandata catch2_source，build() 内以同一 conan_toolchain.cmake + 系统 cmake 构建安装到私有前缀，Catch2_DIR 指向该前缀；图中无 catch2 conan 节点，无 conancenter 解析可能），include(Catch)/catch_discover_tests 离线可用"
  - "计数字段只读 LastTest.log，不对 stdout 做正则数数或算术修补；日志缺失或格式异常直接失败并给出 reason"
