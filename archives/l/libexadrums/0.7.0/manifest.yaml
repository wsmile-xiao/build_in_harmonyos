# 版本级 manifest — ARCHIVE-SPEC v2.0
version: "0.7.0"
software: "libexadrums"
status: published
build_date: "2026-09-19"
build_system: "autotools"

source:
  url: "https://github.com/SpintroniK/libeXaDrums/archive/refs/tags/0.7.0.tar.gz"
  sha256: "c507fbaad3aac318c8489bee9c872ef59295024ddf664fb79063a4c41d3657b6"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-dependency-tracking"
  dependencies:
    - tinyxml2/11.0.0
    - minizip/1.3.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure-drop-pkgconfig-and-werror.patch"
  - "0002-makefile-drop-stdcxxfs-latomic.patch"
  - "0003-pc-drop-alsa.patch"

knowledge_gained:
  - "OHOS 无 ALSA 且无 ohpcd alsa 包；内嵌静态 stub libasound.a + alsa/asoundlib.h，使库以原样编译链接，音频变为 no-op。"
  - "autotools 包用 AutotoolsDeps 注入 tinyxml2/minizip 的 -I/-L/-l，避免依赖 pkg.m4 / 系统 pkg-config。"
  - "configure.ac 删除 PKG_CHECK_MODULES 后不再需要 pkg.m4；aclocal/libtool.m4 由系统提供（/usr/local/share/aclocal）。"
  - "clang/libc++ 工具链下不存在 -lstdc++fs / -latomic，已从 LIBADD 移除。"
  - "ALSA 构造在 eXaDrums 中需要 dataLoc 配置；test_package 仅调用静态 API（GetVersion / GetDevices / AlsaParameters），不触发设备打开。"
