# conandata.yml — single source of truth for source URL + SHA256 + patches.
# NOTE: keep the source URL as the official upstream (no gh-proxy mirror).
sources:
  url: "https://github.com/SpintroniK/libeXaDrums/archive/refs/tags/0.7.0.tar.gz"
  sha256: "c507fbaad3aac318c8489bee9c872ef59295024ddf664fb79063a4c41d3657b6"

patches:
  - patch_file: "patches/0001-configure-drop-pkgconfig-and-werror.patch"
    patch_description: "Drop PKG_CHECK_MODULES (deps injected via Conan AutotoolsDeps); relax -Werror"
    patch_type: "portability"
  - patch_file: "patches/0002-makefile-drop-stdcxxfs-latomic.patch"
    patch_description: "Remove -lstdc++fs -latomic (absent in OHOS clang/libc++)"
    patch_type: "portability"
  - patch_file: "patches/0003-pc-drop-alsa.patch"
    patch_description: "Drop alsa from Requires.private (ALSA is a bundled OHOS stub)"
    patch_type: "portability"
  - patch_file: "patches/0004-cxx17-drop-ranges.patch"
    patch_description: "Replace C++20 <ranges> (std::views/std::ranges) which libc++ 15 lacks; use loops + std::find_if"
    patch_type: "portability"
  - patch_file: "patches/0005-chrono-system-clock.patch"
    patch_description: "Use system_clock::time_point for to_time_t (libc++ distinguishes high_resolution_clock from system_clock)"
    patch_type: "portability"
