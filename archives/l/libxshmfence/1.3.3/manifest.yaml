version: "1.3.3"
upstream_name: libxshmfence
upstream_version: "1.3.3"
status: built
build_system: autotools
build_date: 2026-08-26
compile_date: 2026-08-26
target_platform: aarch64-unknown-linux-ohos
issue: "知识库扩展"

source:
  url: "https://www.x.org/archive/individual/lib/libxshmfence-1.3.3.tar.xz"
  sha256: "d4a4df096aba96fea02c029ee3a44e11a47eb7f7213c1a729be83e85ec3fde10"
  tar_format: tar.xz
  version_mapping: "Conan libxshmfence/1.3.3 maps to upstream libxshmfence 1.3.3 and libxshmfence.so.1."

