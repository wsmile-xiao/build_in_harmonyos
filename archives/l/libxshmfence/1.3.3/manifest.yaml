patches_applied:
  - "0001-config.guess.patch (adds HarmonyOS -> aarch64-unknown-linux-ohos to config.guess)"
  - "0002-config.sub.patch (adds ohos* OS and linux-ohos*- kernel to config.sub)"

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml, and test_package/MANIFEST.yml"
    - "L0 static gate checks passed"
    - "official source sha256 verified locally"
    - "test_package runs the unmodified upstream test/xshmfence_test.c (fork 5 children, full trigger/await/query/reset lifecycle) against the installed libxshmfence.so.1 in addition to ABI surface (7 exported functions), typed signature contracts (7), and a display-independent functional smoke test (alloc/map/query/trigger/reset/await/unmap)"
  remote:
    - "pending GitCode CI build_and_test.sh run on PR"
  pending:
    - "PR validation / GitCode CI / REL upload"

knowledge_gained:
  - "libxshmfence's configure only runs PKG_CHECK_MODULES(XPROTO, xproto) — xproto is a headers-only module shipped by xorgproto — so the sole dependency is xorgproto/2025.1, and the library links nothing but pthreads when futexes are unavailable (xshmfence_alloc falls back to a pthread shm impl)."
  - "SHMDIR trap: AC_ARG_WITH(shared-memory-dir) auto-detects /run/shm /dev/shm /var/tmp /tmp at configure time and hard-fails with 'No directory found for shared memory temp files' if none exist. The OHOS CI worker has no /tmp, so the recipe passes --with-shared-memory-dir=<build_folder>/tmp. At runtime the primary allocation path is memfd_create(2) (present on the OHOS Linux kernel); the SHMDIR-backed mkostemp fallback is only hit when memfd is unavailable, so the baked path never matters for real consumers."
  - "-version-number 1:0:0 -> libxshmfence.so.1 / libxshmfence.so.1.0.0; libxshmfence_la_LIBADD only links libc (no -lX11, no -lxshmfence self-link)."
  - "libxshmfence.so.1 exports 7 non-macro xshmfence_* functions from X11/xshmfence.h: alloc_shm, map_shm, unmap_shm, query, trigger, reset, await. The upstream test/xshmfence_test.c is fork+memfd_create+futex based and runs stably on the OHOS CI worker (~2s), so it is vendored unmodified into test_package and executed for real; the recipe also ships ABI-surface and signature-contract consumers."
