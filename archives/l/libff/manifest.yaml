software: libff
display: "libff (Finite Fields and Elliptic Curves)"
description: "C++ library for zk-SNARKs arithmetic: finite fields, elliptic curve groups and bilinear pairings"
category: crypto
homepage: "https://github.com/scipr-lab/libff"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Pins CURVE=ALT_BN128: official tag archive ships empty depends/ submodules AND the restored-submodule BN128 path is x86-64-only (Xbyak JIT), so ALT_BN128 is the only buildable path on aarch64"
    - "ALT_BN128 is the same BN254 curve (bit-identical q/r, equivalent pairings) but NOT API/ABI/serialization-equivalent to BN128; consumers use alt_bn128_* types via CURVE_ALT_BN128 define"
    - "Disables WITH_PROCPS; upstream NO_PROCPS fallback covers OHOS"
    - "Runs upstream ctest in a separate Debug tree without NDEBUG (tests use assert() as oracle)"
    - "GMP is a transitive-headers dependency (bigint.hpp includes gmp.h)"
    - "HarmonyOS-specific consumer test parses the in-package libff.a (ar+ELF): 24 objects, all EM_AArch64, 5 alt_bn128_* curve objects, no bn128_* leak"
  common_dependencies:
    - gmp
    - openssl

versions:
  "0.2.1":
    status: published
    build_date: "2026-09-07"
    conan_ref: "libff/0.2.1"
    note: "Official v0.2.1 tag archive from scipr-lab/libff; no source patches; CURVE=ALT_BN128 (BN128 unusable: empty submodules in tag archive + x86-64-only Xbyak path; same BN254 curve but not API/ABI/serialization-equivalent)"
