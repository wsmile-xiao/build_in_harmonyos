# 版本级 manifest
# 文件位置: archives/l/libff/0.2.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.2.1"
software: "libff"

# published | built | failed | archived
status: published

build_date: "2026-09-07"

# ============================================================
# 源码信息（上游身份链，证据见 notes.md）
# ============================================================

source:
  url: "https://github.com/scipr-lab/libff/archive/refs/tags/v0.2.1.tar.gz"
  sha256: "630010841f6992ad6e4758bb079d248eab46cfe66a4c0391c11075f3e5387b60"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCURVE=ALT_BN128"
    - "-DWITH_PROCPS=OFF"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DIS_LIBFF_PARENT=ON"
  dependencies:
    - gmp/6.3.0.1
    - openssl/3.5.6
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "官方 tag 归档不含 depends/ 子模块内容，默认 CURVE=BN128 configure 即失败；ALT_BN128 路径自包含可构建（子模块恢复方法论 → E150）"
  - "WITH_PROCPS=OFF 触发上游 NO_PROCPS 回退（profiling.cpp），适配无 procps 的 OHOS"
  - "上游测试以 assert() 为 oracle（#ifndef NDEBUG 门控），Release 的 NDEBUG 会让测试空转；需 Debug 测试树执行（E294 变体）"
  - "测试二进制运行期需 conanrun 环境解析 gmp shared（conanbuild 不含依赖 lib 路径）"
  - "架构驱动的密码学后端替换属兼容性契约：BN128→ALT_BN128 后公开类型/ABI/序列化非等价，宏集（CURVE_ALT_BN128+BINARY_OUTPUT+MONTGOMERY_OUTPUT）必须经 cpp_info.defines 全集下发（E2186）"
