# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游 libff 0.2.1 (scipr-lab/libff) 测试体系（源码取证）:
#   CMakeLists.txt: enable_testing() + add_custom_target(check COMMAND ctest)
#   libff/CMakeLists.txt: 3 个测试可执行文件（EXCLUDE_FROM_ALL，挂 check target）:
#     - algebra_bilinearity_test  (algebra/curves/tests/test_bilinearity.cpp)
#     - algebra_groups_test       (algebra/curves/tests/test_groups.cpp)
#     - algebra_fields_test       (algebra/fields/tests/test_fields.cpp)
#   注册为 ctest 测试（include(CTest) + add_test）。
#   CI 交叉编译（OHOS armv8）时 ctest 不能本机运行：build() 内改为
#   cmake --build --target check 构建全部上游测试二进制（编译+链接验证），
#   can_run=True（本机/设备）时执行 ctest。

package: libff/0.2.1
homepage: https://github.com/scipr-lab/libff

upstream_check_command: "cmake --build . --target check && ctest"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - file: test_bilinearity.cpp
    source: libff-v0.2.1.tar.gz/libff/algebra/curves/tests/test_bilinearity.cpp
    description: "配对双线性 e(aP,bQ)==e(P,Q)^(ab) 与非退化性检验"
    command: "./algebra_bilinearity_test"
  - file: test_groups.cpp
    source: libff-v0.2.1.tar.gz/libff/algebra/curves/tests/test_groups.cpp
    description: "G1/G2 群公理（结合律/逆元/标量乘）"
    command: "./algebra_groups_test"
  - file: test_fields.cpp
    source: libff-v0.2.1.tar.gz/libff/algebra/fields/tests/test_fields.cpp
    description: "Fp/Fp2/Fp6/Fp12 域公理（分配律/逆元/ Frobenius）"
    command: "./algebra_fields_test"

test_package_tests:
  - file: test_package.cpp
    description: "ALT_BN128 配对+群/域运算+序列化往返（消费者视角，17 项显式 CHECK：Release/NDEBUG 下同样真实执行）"
    command: "./test_package"
  - file: test_package_ohos.cpp
    description: "HarmonyOS 专项：NO_PROCPS profiling 回退运行、aarch64 可移植 Fp invert/sqrt 路径、bigint↔mpz 互操作、q/r 常数位级一致、配对确定性、zero 序列化分支、包内 libff.a 对象级检查（ar/ELF 头逐成员解析：24 对象全为 ELF64/小端/ET_REL/EM_AArch64、alt_bn128 5 对象齐备、无 bn128_* 混入），8/8 通过"
    command: "./test_package_ohos"

# 口径：消费者侧全部运行期检查 = test_package.cpp 17 CHECK + test_package_ohos.cpp 8 检查
assertion_count: 25
