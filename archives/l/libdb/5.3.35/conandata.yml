# conandata.yml — libdb 5.3.35
#
# 上游是 berkeleydb/libdb（Berkeley DB 的社区 fork，Oracle 不再是维护方）。
# 该 fork 从 5.3.29 起只用 CalVer 发版（dist/RELEASE 里 DB_CALVER=2026.09、
# DB_VERSION=2026.0.7），**没有 v5.3.35 这个 tag**：5.3.35 是 dist/configure.ac
# 被 fork 的发布脚本代换后写进 dist/configure 的 PACKAGE_VERSION
# （`PACKAGE_VERSION='5.3.35'` / `PACKAGE_STRING='Berkeley DB 5.3.35'`），
# 也就是任务版本号的来源。因此这里固定到该 PACKAGE_VERSION 所在的 master
# 提交，而不是 `refs/heads/master`（可变引用会让构建不可复现）。
#
# 提交 b1cb444aad1d53bb8c6ff3a9da31b30063c4a98a 的 dist/RELEASE
# DB_RELEASE_DATE 为 "September 7, 2026"，与 dist/configure 的
# PACKAGE_VERSION=5.3.35 同属一次发布。

sources:
  url: "https://codeload.github.com/berkeleydb/libdb/tar.gz/b1cb444aad1d53bb8c6ff3a9da31b30063c4a98a"
  sha256: "53da64b1a3541b584bf2f19cd7fce6a91e47b082337851dee4d7ae77b600d469"
  filename: "libdb-5.3.35.tar.gz"

patches:
  - patch_file: "patches/0001-meson-version-metadata-align.patch"
    patch_type: "portability"
    patch_description: "Meson 构建路径的版本元数据停留在旧值（db_subs.json 5.3.29 / dist/meson.build 5.3.34 / meson.build 5.3.34），与 configure.ac 代换出的 PACKAGE_VERSION=5.3.35 不一致 → meson 生成的 db.h 里 DB_VERSION_PATCH/DB_VERSION_STRING/DB_VERSION_FULL_STRING 报 5.3.29，而这三个宏正是 src/env/env_open.c 的 db_version()/db_full_version() 运行时返回值；把三处版本串对齐到 5.3.35，其余代换项与代码不动"
    patch_source: "https://github.com/berkeleydb/libdb"
  # 必须排在 0001 之后：两条补丁改的是同一张表的相邻行，本条的上下文行
  # 特意选了 0001 不动的那两行（见补丁头注释）。
  - patch_file: "patches/0002-meson-db-subs-proto-macros.patch"
    patch_type: "portability"
    patch_description: "src/dbinc/db.in 用 @DB_PROTO1@/@DB_PROTO2@ 两个槽位容纳 __P() 原型的定义（db.h 故意不包含 db_config.h，所以宏必须由模板自己给出），dist/configure.ac 为 ANSI C 编译器代换成 `#undef __P` + `#define __P(protos) protos`；Meson 路径的 dist/meson/db_subs.json 却把这两个槽位留成空串，而 gen_header.py 是「占位符→查表值」的等值替换，空串等于把宏整段抹掉 → meson 生成的 db.h 用了 400 多处 __P((...)) 却从未定义 __P，凡是包含 db.h 的编译单元全部报 `expected ';' at end of declaration list`（引子 dist/db_int.h:88 → dist/db.h:529），Meson 构建彻底产不出库。把两个槽位补成 configure.ac 对 ANSI C 编译器所选的值（DB_CONST 保持空串，同样与 configure.ac 一致）"
    patch_source: "https://github.com/berkeleydb/libdb"
