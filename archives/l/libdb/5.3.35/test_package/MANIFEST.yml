# test_package/MANIFEST.yml — libdb 5.3.35 上游测试声明
#
# 上游同时存在两套构建体系：dist/configure.ac（Autotools，历史线）与
# meson.build + dist/meson.build（Meson，本 fork 新增）。本配方走 **Meson**，
# 所以「上游测试」= meson test 注册的用例集。
#
# test/tiers/meson.build 把三个 tier 注册成三个 suite：
#   tiers        B1 isolation  —— test/isolation/test_iso_anomaly.c（gating，本配方执行）
#   tiers-xfail  B3 lock-matrix —— test/lockmatrix/test_lock_matrix.c
#                                 上游注释原文：“aborts on current master: that abort IS
#                                 the #140 reproduction”，故意红，故单独成 suite
#   tiers-slow   B2 soak        —— test/soak/test_soak_resources.c
#                                 args ['-n', '2000']，timeout 1800（分钟级 soak）
# 三个可执行目标都是 build_by_default: false，需按名构建后再 --no-rebuild 跑。
#
# test/ 下另有大量 autotools/TCL/C++/Java/SQL 测试资产（test/c、test/cxx、test/xa、
# test/tcl、test/sql、test/java、test/fuzz、test/cbmc、test/sim、test/faultinject…），
# 属 dist/configure.ac 那条管线，**未被 Meson 构建注册**，本配方不执行 —— 详见
# notes.md 的「上游测试口径（rule2 / rule4）」一节。

package: libdb/5.3.35
homepage: "https://github.com/berkeleydb/libdb"

# 上游测试命令 (用于 meson test --list / ninja -t targets 分析)
upstream_check_command: "meson test -C build --suite tiers"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: >-
  ninja -C build -j1 test/tiers/test_iso_anomaly &&
  meson test -C build --suite tiers --no-rebuild --print-errorlogs

# 上游测试数（rule4 声明值）。三档口径由宽到窄，声明值取**最宽**者：
#   A. 整包朴素扫描  find . -type f -iname '*test*' | wc -l  = 1081  <= 声明 N
#   B. test/ 递归文件数  find test -type f | wc -l             = 1017
#   C. Meson 构建注册的可执行测试程序                           = 3
# 取 A 保证 >= 任一更窄口径，不存在少报。
# 未执行 = 1081 - 1 = 1080，三类闭合：1014 + 64 + 2（见下），无「未归因」项。
upstream_test_case_count: 1081
upstream_test_scan_commands:
  - cmd: "find . -type f -iname '*test*' | wc -l"
    value: 1081
    note: "= 声明 N（最宽口径，整包）"
  - cmd: "find test -type f | wc -l"
    value: 1017
    note: "test/ 目录递归文件数；1017 + 64 = 1081"
  - cmd: "grep -n 'test(' test/*/meson.build"
    value: 3
    note: "pbt:84 / sim:37 / tiers:54；仅 tiers 在顶层入口链上（meson.build:42 无条件，:36 受 hegel 选项门控，test/sim 上游注明尚未接入）"
upstream_test_unexecuted_breakdown:
  - count: 1014
    reason: >-
      test/ 内非本构建体系资产（TCL/Java/SQL/C/C++/XA/CuTest/fuzz/cbmc/micro/bench/sim/pbt），
      由 dist/configure.ac（Autotools）管线驱动；而该线在 HMDFS 上不可构建（print 回显探测
      假阳性 / umask 077 mktemp 拒写 / 2011 版 config.guess 不认 HarmonyOS）—— 本包改用 Meson
      正是为绕开它们 => 平台不可达，非适配裁剪
  - count: 64
    reason: >-
      test/ 外的 *test* 命中文件，非测试对象：build_windows VS8/VS10 工程文件、
      lang/sql/sqlite（vendored SQLite 自带测试）、docs_src 文档、dist/s_test
  - count: 2
    reason: >-
      Meson 已注册但不执行的两个 tier：tiers-xfail（上游注明 #140 故意红）、
      tiers-slow（分钟级 soak，args -n 2000 / timeout 1800）

# 上游实际运行的测试程序（Meson 注册集，共 3 项，本配方执行 1 项）
upstream_tests:
  - file: test/isolation/test_iso_anomaly.c
    source: libdb-b1cb444aad1d53bb8c6ff3a9da31b30063c4a98a/test/isolation/test_iso_anomaly.c
    suite: tiers
    executed: true
    description: "B1 隔离性 / 可串行化校验——并发事务调度下由模型枚举算出判定，而非硬编码期望值"
    command: "meson test -C build --suite tiers --no-rebuild --print-errorlogs"
  - file: test/lockmatrix/test_lock_matrix.c
    source: libdb-b1cb444aad1d53bb8c6ff3a9da31b30063c4a98a/test/lockmatrix/test_lock_matrix.c
    suite: tiers-xfail
    executed: false
    description: "B3 锁矩阵——上游注释原文 'aborts on current master: that abort IS the #140 reproduction'，故意红，故单列 suite，不并入 gating"
    command: "meson test -C build --suite tiers-xfail"
  - file: test/soak/test_soak_resources.c
    source: libdb-b1cb444aad1d53bb8c6ff3a9da31b30063c4a98a/test/soak/test_soak_resources.c
    suite: tiers-slow
    executed: false
    description: "B2 资源 soak——上游注册 args ['-n','2000']、timeout 1800（分钟级），刻意排除在默认 suite 之外"
    command: "meson test -C build --suite tiers-slow"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libdb.c
    description: >-
      消费者测试 5 组：(A) 版本同一性——db.h 编译期宏 / db_version() / db_full_version()
      三者与库本体同报 5.3.35（验证 patches/0001 生效）；(B) DbEnv(DB_INIT_LOCK|DB_INIT_MPOOL)
      打开成功即证明 pthread 已随库正确链接；(C) 鸿蒙特有——DB_THREAD 下 4 线程并发写入
      128 条记录后游标计数 256 条零丢失（上游三个 tier 均为单线程，不覆盖该路径）；
      (D) 关闭 DbEnv/DB 后重开文件仍在、文件系统上真实非空；(E) 错误路径确定性——
      DB_CREATE|DB_RDONLY 非法组合返回 EINVAL 而非崩溃。
    command: "ctest --test-dir . --output-on-failure"

# 测试断言总数 (近似值, 用于质量评估；静态统计本文件 CHECK( 出现次数)
# test_libdb.c: 31 条 CHECK 断言 + 2 处硬失败分支（pthread_create 失败 / 顺序写失败）
assertion_count: 31

# 鸿蒙特有测试数（rule12：body「适配后测试用例统计」表须有该行且 N>=1）
mohos_specific_tests: 3
