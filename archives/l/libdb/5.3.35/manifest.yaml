# 版本级 manifest — libdb 5.3.35
# 遵循 ARCHIVE-SPEC v2.0

version: "5.3.35"
software: "libdb"

status: built

build_date: "2026-09-20"
build_system: "meson"

source:
  # 本 fork 从 5.3.29 起改用 CalVer 发版（dist/RELEASE: DB_CALVER=2026.09），
  # **没有 v5.3.35 这个 tag**：5.3.35 是 fork 的发布脚本代换后写进 dist/configure
  # 的 PACKAGE_VERSION。故钉到该 PACKAGE_VERSION 所在的 master 提交
  # （dist/RELEASE 的 DB_RELEASE_DATE="September 7, 2026" 与 configure 同属一次发布），
  # 而不用可变的 refs/heads/master。
  url: "https://codeload.github.com/berkeleydb/libdb/tar.gz/b1cb444aad1d53bb8c6ff3a9da31b30063c4a98a"
  sha256: "53da64b1a3541b584bf2f19cd7fce6a91e47b082337851dee4d7ae77b600d469"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Ddefault_library=static"          # R26：系统同名库默认静态
    - "-Dhegel=disabled"                  # 上游 PBT 层（Hegel 属性测试）默认即关闭
  tool_requires:
    - "meson/1.11.0"                      # 精确版本（L0：tool_requires 不得带版本范围）
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-meson-version-metadata-align.patch"
  - "patches/0002-meson-db-subs-proto-macros.patch"

test_results:
  # Meson 注册集共 3 项（tiers / tiers-xfail / tiers-slow），本配方执行 gating 的
  # tiers 1 项；另 2 项按上游自身声明排除（xfail=#140 复现故意红；slow=分钟级 soak）。
  # 详见 notes.md「上游测试口径（rule2 / rule4）」。
  type: official
  total: 1
  passed: 1
  failed: 0

knowledge_gained:
  - "Berkeley DB 的 Meson 构建（本 fork 新增）不生成 config.status / libtool，一次绕开 autotools 路径在 HMDFS 上的三类环境坑：dist/configure 的 'print -r --' 回显探测假阳性（ksh 内建 → config.status 运行时报 'print: command not found'）、config.status 的 (umask 077 && mktemp -d ./confXXXXXX) 在 setgid 目录拒写、config.guess/config.sub(2011-11-11) 不认 HarmonyOS 三元组。5.3.28 / 6.2.32 两条 autotools 配方均实证过这三坑。"
  - "libdb fork 的版本串分散在三处且互不一致：dist/configure(autotools)=5.3.35、dist/meson.build 的 PACKAGE_VERSION=5.3.34、dist/meson/db_subs.json=5.3.29。db_subs.json 驱动 gen_header.py 渲染 db.h，其 DB_VERSION_PATCH/STRING/FULL_STRING 正是 src/env/env_open.c 里 db_version()/db_full_version() 的运行时返回值——不补则运行库自报 5.3.29。"
  - "上游 Meson 构建只产出核心 C 库（B-tree/Hash/Heap/Queue/Recno、lock、log、mpool、txn、replication、crypto、compression），不含 C++/Java/Tcl/SQL 绑定与 db_* 命令行工具（那属 dist/configure.ac 管线），故 package_type=library、无 bin/、无 commands.json（L0k）。"
  - "libdb 是 Berkeley DB 的社区 fork（README 首行 'Not affiliated with or endorsed by Oracle'，v5.3.29 起为社区发布），与仓内 berkeley-db5/5.3.28（download.oracle.com 源码）和 db/6.2.32（Oracle 6.x，AGPL）互为独立软件条目：源码来源、主页、版本线、许可证表述、构建体系均不同。"
  - "Berkeley DB 的 DB_THREAD 不只是『可多线程调用』的开关，它同时改变返回值所有权：src/db/db_iface.c 的 __dbt_ferr() 对 DB->get 的 data 参数传 check_thread=1，线程态下若 DBT 不带 DB_DBT_MALLOC/DB_DBT_REALLOC/DB_DBT_USERMEM/DB_DBT_USERCOPY/DB_DBT_READONLY 就直接报 BDB0630 'DB_THREAD mandates memory allocation flag on data DBT' 并返回 EINVAL（库不肯把内部缓冲区指针交回调用方）。同一函数里 key 传 DB_RETURNS_A_KEY(dbp,flags)（普通 B-tree + flags=0 时为假），游标 __dbc_get_arg、DB->put/del 的 data 一律 check_thread=0 —— 所以这是 DB->get 独有的契约，上游三个 tier 全是单线程，永不暴露。"
