# test_package/MANIFEST.yml
# 上游官方测试与包消费检查声明
package: liquid-dsp/1.8.0.2
homepage: "https://liquidsdr.org"

# 上游测试命令（CMake 构建的聚合 autotest 程序）
upstream_check_command: "./xautotest"

# conanfile.py build() 已集成上游测试（cmake.test() → CTest 驱动 xautotest）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的聚合测试程序：完整输入列表由上游 CMakeLists.txt 的
# BUILD_AUTOTESTS 分支定义（autotest/null_autotest.c 与各 src/*/tests/*_autotest.c）。
upstream_tests:
  - file: CMakeLists.txt
    source: liquid-dsp-1.8.0/CMakeLists.txt
    aggregate_binary: xautotest
    description: "Complete AUTOTESTS source list builds xautotest: 1341 tests / 716520 checks, driven through CTest"
    command: "ctest --output-on-failure"

# test_package 自带的消费者检查（含 OpenHarmony 专有用例）
test_package_tests:
  - file: test.c
    description: "Consumer link/API checks (liquid_nchoosek, liquid_version, windowf) plus OpenHarmony checks [OHOS-1] platform identity, [OHOS-2] aarch64 NEON dotprod, [OHOS-3] built-in FFT with FIND_FFTW=OFF"
    command: "./test_liquid_dsp"

# 上游统计与 test_package 检查分开记录
upstream_test_count: 1341
upstream_assertion_count: 716520
test_package_assertion_count: 6
assertion_count: 716526
