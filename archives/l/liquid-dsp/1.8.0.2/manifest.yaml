# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "v1.8.0 迁移到 CMake 构建系统；FFTW 为可选加速，关闭 FIND_FFTW 使用内置 FFT，依赖闭包为空；aarch64 真机 native 构建下 SIMD try_run 正常执行并自动启用 NEON (knowledge_ref: E327)"
  - "静态 target 为 liquid::liquid-static，安装制品为 lib/libliquid.a，pkg-config 名为 liquid-dsp；static-only 构建必须保持逻辑包名 liquid 以维持 Config/Targets/export 身份一致 (knowledge_ref: E327)"
  - "OHOS 下 conan create 必须使用 ci/conan/profiles/ohos-aarch64；default profile 缺 os.version 会在 package_id 计算阶段直接 Invalid (exit 6) (knowledge_ref: DRAFT-liquid-dsp-1.8.0.2-ohos-conan-default-profile-missing-os-version)"

