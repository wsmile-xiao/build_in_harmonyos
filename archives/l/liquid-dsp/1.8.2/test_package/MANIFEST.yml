# test_package/MANIFEST.yml
# 上游官方测试与包消费检查声明
package: liquid-dsp/1.8.2
homepage: "https://liquidsdr.org"

# 上游测试命令（CMake 构建的 autotest 程序）
upstream_check_command: "./xautotest"

# conanfile.py build() 已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的聚合测试程序。完整输入列表由上游 CMakeLists.txt 定义，
# 包含 autotest/null_autotest.c 及各 src/*/tests/*_autotest.c。
upstream_tests:
  - file: CMakeLists.txt
    source: liquid-dsp-1.8.2/CMakeLists.txt
    aggregate_binary: xautotest
    description: "Complete AUTOTESTS source list builds xautotest; exact test inventory is recorded by the 1.8.2 build evidence"
    command: "ctest --output-on-failure"

# test_package 自带的消费者视角检查
test_package_tests:
  - file: test.c
    description: "Consumer link and API test (liquid_nchoosek, liquid_version, windowf)"
    command: "./test_liquid_dsp"

# 分开记录上游统计和 test_package 检查，兼容总数字段为两者 checks 之和
upstream_test_count: 1341
upstream_assertion_count: 716520
test_package_assertion_count: 3
assertion_count: 716523
