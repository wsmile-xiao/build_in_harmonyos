name: liquid-dsp
version: "1.8.2"
software: liquid-dsp
status: in_progress
build_system: cmake

source:
  url: "https://github.com/jgaeddert/liquid-dsp/archive/refs/tags/v1.8.2.tar.gz"
  sha256: "a0adbc3ec5630d620a55351285573f59948153a14c703fb64b4ad58989bd6e2f"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_AUTOTESTS=ON"
    - "-DBUILD_BENCHMARKS=OFF"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_STATIC_LIBS=ON"
    - "-DFIND_FFTW=OFF"
    - "-DFIND_SIMD=OFF"
    - "-DENABLE_SIMD=OFF"
    - "-DENABLE_LOGGING=ON"
  dependencies: []

patches_applied:
  - "0001-cmakelists-static-config.patch"

validation:
  upstream_tests: "PASS: ctest aggregate autotest 1/1 (121.28s); inventory metadata 1341 tests / 716520 assertions"
  consumer_tests: "PASS: fresh install-wsl-r2 CMake consumer 1/1; 3 API assertions"
  source_syntax: "PASS: py_compile conanfile.py and test_package/conanfile.py"
  cmake_export: "PASS: fresh install contains liquidConfig.cmake and liquid::liquid-static"
  target_w3: "Exact external run evidence must bind the final staged tree before PR"
  platform_ci: "pending"

notes:
  - "FFTW is optional; FIND_FFTW=OFF keeps the target dependency closure empty."
  - "SIMD auto-detection uses try_run; FIND_SIMD=OFF and ENABLE_SIMD=OFF keep OHOS cross configuration deterministic."
  - "Static-only installation requires preserving the logical liquid package name for Config/Targets consistency."
