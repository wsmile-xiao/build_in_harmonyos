package: "libxrender/0.9.12"
homepage: "https://gitlab.freedesktop.org/xorg/lib/libxrender"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_tests: []
upstream_zero_evidence: >-
  The release Makefile.am files declare no TESTS, check_PROGRAMS,
  check-local, or custom test target.

test_package_tests:
  - id: "public-api-surface"
    source: "api_surface.c"
    command: "libxrender_api_surface"
    description: >-
      Force a live typed relocation for all 44 public functions, then execute
      and validate the display-independent lowercase rgba parser branch.
  - id: "rgba-color-contract"
    source: "color_contract.c"
    command: "libxrender_color_contract"
    description: >-
      Validate channel scaling, alpha premultiplication, zero alpha, and
      rejection of overlong, empty, and uppercase rgba components.

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 2
assertion_count: 67
