# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libuhttpd/3.14.2
homepage: "https://github.com/zhaojh329/libuhttpd"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# libuhttpd 主库 CMake 未注册任何 ctest/make check 测试 (0 项)；
# 其 vendored http-parser 子模块自带 nodejs/http-parser 测试套件
# (test.c + Makefile test 目标, v2.9.3), 已在适配期实际编译运行通过。
upstream_check_command: "ctest -N (0 tests registered); vendored http-parser: make -C src/http-parser test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: http-parser/test.c
    source: libuhttpd-3.14.2/src/http-parser/test.c
    description: "vendored nodejs/http-parser 测试套件 (HTTP 解析器, v2.9.3)：message/scan/header 全量校验"
    command: "./http_parser_test (strict=0 构建, 实际执行)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者功能测试：启动 uh_server 监听 127.0.0.1, 注册 /hello handler, 通过真实 socket 发起 HTTP/1.1 GET 并校验 200 状态行与响应体"
    command: "./test_libuhttpd"

# 测试断言总数 (近似值, 用于质量评估)
# vendored http-parser 套件含 250+ message 断言 (响应/请求双扫描全通过, exit 0)；
# test_package 校验 200 状态行 + 响应体内容 2 项关键断言。
assertion_count: 252
