# 版本级 manifest — libuhttpd 3.14.2
# 遵循 ARCHIVE-SPEC v2.0

version: "3.14.2"
software: "libuhttpd"
status: published
build_date: "2026-09-27"
build_system: "cmake"

source:
  url: "https://codeload.github.com/zhaojh329/libuhttpd/tar.gz/refs/tags/v3.14.2"
  sha256: "729e2f5d970bd226bd520ca96f75e36b0c594a42a22237e908b9d3ff6f7a2640"
  tar_format: tar.gz
  notes: "上游 v3.14.2 源码归档不含 git 子模块内容（src/{buffer,http-parser,log,ssl} 为空目录）；conandata.yml 按 v3.14.2 tag 锁定的子模块 commit 分别拉取并布局到对应目录"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 (CMake 4.x 移除 <3.5 兼容, 源码 replace 提升 cmake_minimum_required)"
    - "-DBUILD_EXAMPLE=OFF (示例为演示服务器, 库包不需要)"
    - "-DUSE_OPENSSL=ON (SSL 子模块默认选择 OpenSSL 后端)"
    - "-DCMAKE_INCLUDE_PATH/-DCMAKE_LIBRARY_PATH 注入 libev/openssl 依赖目录 (上游 FindLibev/FindOpenSSL 模块查找器)"
    - "-DOPENSSL_INCLUDE_DIR 显式注入 (上游 ssl 子模块读取单数变量, pkg-config 只设复数)"
  dependencies:
    - libev/4.33
    - openssl/3.5.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GitHub source archive 不含 submodule 内容（src/{buffer,http-parser,log,ssl} 为空目录），需按 tag 锁定 commit 分别拉取子模块布局（同 ableton-link/adlplug 先例）"
  - "codeload 归档 URL 以 ref/commit 结尾（无 .tar.gz 后缀），conan get() 需显式传 filename 才能识别压缩格式"
  - "CMake 4.x 移除 <3.5 兼容：toolchain 层 CMAKE_POLICY_VERSION_MINIMUM 设置太晚（cmake_minimum_required 在加载 toolchain 前解析），需 replace_in_file 提升源码声明的 min 版本（adlplug 先例）"
  - "上游 ssl 子模块用 pkg_check_modules 找 OpenSSL 但读取单数 OPENSSL_INCLUDE_DIR（pkg-config 只设复数 OPENSSL_INCLUDE_DIRS），需在 generate() 显式注入单数变量"
  - "libuhttpd 单线程事件循环：客户端请求必须在独立线程执行，否则客户端阻塞在 recv 时事件循环无法 accept（死锁）；chunked 响应 + Connection: close 需 SO_RCVTIMEO 兜底"
