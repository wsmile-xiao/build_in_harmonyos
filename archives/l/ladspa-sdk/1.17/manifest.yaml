package: ladspa-sdk
version: "1.17"
homepage: "https://www.ladspa.org/"
license: LGPL-2.1-or-later
status: built
build_system: makefile
build_date: "2026-08-25"

source:
  url: "https://www.ladspa.org/download/ladspa_sdk_1.17.tgz"
  sha256: "27d24f279e4b81bd17ecbdcc38e4c42991bb388826c0b200067ce0eb59d3da5b"

patches_applied: []

upstream_tests:
  command: ""
  test_count: 0
  notes: >-
    Upstream ships no formal test suite. The Makefile `test` target is an
    interactive audio demonstration (plays snd/noise.wav and /tmp/test.wav via
    sndfile-play and runs the three example tools to generate a wave file); it
    contains no assertions and requires a sound device, so it is not runnable
    as a CI test. The `targets`/`install` targets build 5 example plugins
    (amp, delay, filter, noise, sine) and 3 host tools (analyseplugin,
    applyplugin, listplugins).

test_package:
  assertion_count: 18
  description: >-
    Consumer authors a minimal valid LADSPA plugin against the installed
    ladspa.h, then dlopen()s both that plugin and the installed example amp.so
    and asserts descriptor fields, function-pointer presence, run_adding
    pairing, a full instantiate->connect_port->activate->run->deactivate->
    cleanup host cycle, and the LADSPA_Data scalar ABI.
