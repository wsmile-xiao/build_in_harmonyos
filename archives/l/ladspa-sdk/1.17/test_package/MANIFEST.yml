package: ladspa-sdk/1.17
homepage: "https://www.ladspa.org/"

upstream_check_command: "make targets"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_tests_note: >-
  Upstream provides no formal test suite. The Makefile `test` target is an
  interactive audio demo (plays noise.wav / /tmp/test.wav via sndfile-play and
  runs the example tools to generate a wave file); it asserts nothing and
  requires a sound device, so it is not a runnable test in CI.

test_package_tests:
  - file: test_minplugin.c
    description: >-
      Consumer authors a minimal but fully valid LADSPA plugin (1 audio in, 1
      audio out, HARD_RT_CAPABLE) against the installed ladspa.h and exports
      ladspa_descriptor().
    command: "build test_minplugin.so"
  - file: test_consumer.c
    description: >-
      Consumer dlopen()s the plugin it built AND the installed example amp.so,
      resolves ladspa_descriptor(), and asserts descriptor fields (UniqueID,
      Label, Name, Maker, Copyright, PortCount, PortDescriptors, PortNames,
      PortRangeHints, instantiate, connect_port, run, cleanup,
      run_adding/set_run_adding_gain pairing) plus a full
      instantiate->connect_port->activate->run->deactivate->cleanup host cycle
      on each.
    command: "./test_consumer test_minplugin.so"

assertion_count: 18
