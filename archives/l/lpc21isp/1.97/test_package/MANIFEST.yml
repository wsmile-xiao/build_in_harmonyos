# test_package/MANIFEST.yml — lpc21isp 1.97
# CI L0e requires this file to exist.

package: lpc21isp/1.97
homepage: "https://sourceforge.net/projects/lpc21isp/"

# lpc21isp has NO upstream test suite (2014 plain-Makefile project).
# Makefile only defines `all` and `clean` targets — no `check`/`test`/`install`.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
# lpc21isp is a serial-port flash tool; the real flash path
# (OpenSerialPort -> termios/ioctl + NxpDownload <-> MCU) needs physical NXP
# hardware + a serial port, which CI cannot provide. The verifiable
# hardware-independent CLI path is: argc < 5 -> prints version banner + full
# usage -> exit(1), WITHOUT touching any serial port. test.sh exercises that
# pure-software path (CLI startup, version, usage, arg parsing, unknown-option
# handling) — the only path runnable in a clean OHOS CI environment.
test_package_tests:
  - file: test.sh
    description: "Runs lpc21isp with no args (version banner+usage, exit 1), checks usage syntax/options, verifies -debug0 arg parsing and graceful unknown-option handling — all hardware-free CLI paths"
    command: "bash test.sh"

# Approximate assertion count:
# 1. binary present   2. exit code 1 on no-args   3. version banner
# 4. banner title      5. syntax line              6. -hex documented
# 7. -bin documented   8. -detectonly documented  9. -NXPARM documented
# 10. -debug0 exit 1  11. unknown option reported 12. unknown option exit 1
assertion_count: 12
