# 软件级 manifest — lpc21isp
# 遵循 ARCHIVE-SPEC v2.0

software: lpc21isp
display: "lpc21isp"
description: "便携式命令行 ISP（在系统编程）工具，用于 NXP LPC1000/LPC2000 系列及 Analog Devices ADUC70xx 微控制器，通过串口烧录固件"
category: utility
homepage: "https://sourceforge.net/projects/lpc21isp/"
license: LGPL-3.0-or-later
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目（无 configure、无 make check、无 install 目标），仅 all/clean"
    - "上游 Makefile 用 OSTYPE/uname 做平台检测，OHOS 落入 else 分支 COMPILE_FOR_LINUX，termios 串口路径可用"
    - "上游 Makefile 对非 Apple 平台硬编码 -static，OHOS 静态链接需 libc.a；本配方改用 Conan Toolchain 管 CFLAGS 去掉 -static，动态链接 musl（与仓库其他 CLI 工具一致）"
    - "stricmp/strnicmp 在 Linux 分支映射为 strcasecmp/strncasecmp（头文件已处理）"
    - "无上游测试套件：纯软件测试路径为无参数运行→打印版本 banner+用法→exit(1)，全程不触碰串口"
    - "硬件路径（OpenSerialPort→termios/ioctl + NxpDownload 与 MCU 通信）需真实 NXP 芯片+串口，CI 无法覆盖"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.97":
    status: built
    build_date: "2026-08-30"
