version: "0.5.0"
software: "libgal"
status: "built"
build_date: "2026-09-19"
build_system: "autotools"

source:
  url: "https://mirrors.ustc.edu.cn/freebsd-ports/distfiles/libgal-0.5.0.tar.gz"
  sha256: "0e149ba25a9c7f4d3705c2d9c2e7821d0a751d70adc2effb248b27f62085ad31"
  tar_format: "tar.gz"

build:
  system: "autotools"
  configure_options:
    - "--disable-shared"
    - "--enable-static"
    - "--with-pic"
    - "--prefix=/"
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
  dependencies: []
  cc: "clang"
  cxx: "clang++"

patches_applied:
  - "0001-config.sub-ohos.patch"
  - "0002-vsop87-j0-ub.patch"
  - "0003-tledec-scanf-long.patch"

knowledge_gained:
  - "libgal 0.5.0 is a self-contained C89/C99 numerical library (SOFA-derived); runtime deps = libc + libm only, no Conan dependencies."
  - "Upstream homepage (homepage.mac.com/pclwillmott/GAL) and the Savannah mirror are dead; the authoritative surviving source archive is the FreeBSD distfile cache, whose astro/libgal distinfo sha256 (0e149ba2...) matches the tarball used here byte-for-byte."
  - "2009-era config.sub does not know aarch64 or ohos; the established fix is the aalib-style triplet patch (add aarch64 machine + linux-ohos OS/kernel suffixes) plus explicit --build/--host=aarch64-linux-ohos so config.guess is never invoked (it cannot recognize the HarmonyOS uname output)."
  - "Real upstream defect E-class (miscompilation): gal_vsop87() velocity accumulation reads t[j-1] at j==0 (out of bounds). With clang -O3 on aarch64 this zeroed every VSOP87 velocity component (549 upstream ephemerides test failures) while -O0/-O2 were unaffected; guarding the j==0 term fixes it. A textbook case of optimizer-exploited UB, not a platform quirk."
  - "Real upstream defect (LP64 struct corruption): gal_tledec() used sscanf %5ld into the 4-byte int tle->satnum; the 8-byte store zeroed the adjacent classification and intldesg members on OHOS aarch64 (musl). Fix: %5d. Scanf conversion specifiers must match field width on LP64."
  - "gal_tref's gal_c2tpv00a/gal_t2cpv00a roundtrip assertion (tolerance 1e-12 on magnitude ~4743, ~2 ULP of headroom) fails by 1.8e-12 on OHOS aarch64 at every optimization level (-O0..-O3, with/without -ffp-contract=off): a platform libm floating-point characteristic, not an algorithmic defect. Documented as the single known upstream-test deviation (86/87)."
  - "The recipe pins the exact per-program make-check results (14 programs, 53974 assertions) and fails loudly on any deviation instead of trusting make's exit code."
  - "Every OHOS build step binds its output to a log file (conan self.run() inherited streams make clang fail silently on the first compilation unit on this platform; see libncurses 6.6, PR #10975)."

homepage: "http://homepage.mac.com/pclwillmott/GAL/"
license: "GPL-2.0-or-later"

tests:
  upstream:
    command: "make check"
    cases: 53974
    passed: 53973
    pass_rate: "53973/53974 (99.998%)"
    note: "14 upstream check_PROGRAMS programs (gal_tdatetime ... gal_tkepler) built and ran on OHOS aarch64 during conan create. 13 programs pass in full; gal_tref passes 86/87 assertions - the single failing roundtrip assertion exceeds its 1e-12 tolerance by 0.8e-12 (~2 ULP) due to OHOS libm floating-point behaviour at all optimization levels (documented in notes.md)."
  adapted:
    command: "test_package/test_gal"
    cases: 9
    passed: 9
    pass_rate: "9/9 (100%)"
    note: "Consumer binary links libgal::libgal static and exercises gal_cal2jd (status codes + J2000.0 Julian Date), gal_pdp and gal_tlechksum; 9 assertions in one binary run."
