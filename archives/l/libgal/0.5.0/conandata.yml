sources:
  "0.5.0":
    url: "https://mirrors.ustc.edu.cn/freebsd-ports/distfiles/libgal-0.5.0.tar.gz"
    sha256: "0e149ba25a9c7f4d3705c2d9c2e7821d0a751d70adc2effb248b27f62085ad31"

patches:
  "0.5.0":
    - patch_file: "patches/0001-config.sub-ohos.patch"
      patch_description: "OHOS portability: teach the 2009-era Autoconf config.sub the aarch64 machine and the linux-ohos OS/kernel suffixes so the aarch64-linux-ohos triplet is accepted. Build/host triplets are passed explicitly, so config.guess (which cannot recognize the HarmonyOS uname output) is never invoked."
      patch_type: portability
    - patch_file: "patches/0002-vsop87-j0-ub.patch"
      patch_description: "Upstream defect fix (verified miscompilation on clang -O3/aarch64): the VSOP87 series velocity accumulation reads t[j-1] at j==0, an out-of-bounds access the optimizer is free to exploit, which zeroed all VSOP87 velocity components (549 upstream ephemerides test failures). Guard the j==0 term with (j > 0 ? j*t[j-1]*cp : 0.0); the j==0 velocity contribution -t[0]*c*sin(p) is unchanged. Upstream test data and assertions untouched."
      patch_type: portability
    - patch_file: "patches/0003-tledec-scanf-long.patch"
      patch_description: "Upstream defect fix (LP64 corruption): gal_tledec decoded card 2 with %5ld into the 4-byte int tle->satnum. On LP64 targets the 8-byte store zeroes the adjacent gal_tle_t members classification and intldesg (observed on OHOS aarch64 musl). Change the conversion to %5d to match the declared field type. Upstream test data and assertions untouched."
      patch_type: portability
