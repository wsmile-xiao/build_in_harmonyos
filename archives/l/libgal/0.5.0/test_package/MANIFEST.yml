# test_package/MANIFEST.yml - libgal 0.5.0
# CI L0e requires this file to exist. Upstream test declaration (rule 4:
# no fabricated pass rates - every number below is backed by the conan
# create build log, which builds and runs the 14 unmodified upstream test
# programs via `make check`).

package: libgal/0.5.0
homepage: "http://homepage.mac.com/pclwillmott/GAL/"

# Upstream ships its own test framework (test/ sub-library) and one test
# program per sub-library, wired into automake's TESTS via check_PROGRAMS.
# The recipe's conanfile.py build() runs `make check` unmodified on
# OHOS aarch64 during conan create.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# The 14 official upstream test programs (top-level Makefile.am
# check_PROGRAMS). Built and executed on OHOS aarch64 during conan create;
# see the make-check step log for the per-program PASS statistics emitted
# by the upstream gal_test_stop() reporter.
upstream_tests:
  - file: date_time/gal_tdatetime.c
    description: "Dates and times sub-library tests (calendar/Julian Date conversions)"
    command: "./gal_tdatetime"
  - file: vec_mat/gal_tvecmat.c
    description: "Vector and matrix manipulation sub-library tests"
    command: "./gal_tvecmat"
  - file: eao/gal_tprecnut.c
    description: "Precession, nutation and polar motion tests"
    command: "./gal_tprecnut"
  - file: eao/gal_tearthrot.c
    description: "Earth rotation tests"
    command: "./gal_tearthrot"
  - file: ephemerides/gal_tephemerides.c
    description: "Ephemerides (VSOP87 Sun/planets/Pluto) tests"
    command: "./gal_tephemerides"
  - file: pstrings/gal_tpstrings.c
    description: "Pascal-string container tests"
    command: "./gal_tpstrings"
  - file: star/gal_tstar.c
    description: "Star catalogue sub-library tests"
    command: "./gal_tstar"
  - file: ellipsoids/gal_tellipsoids.c
    description: "Reference ellipsoid tests (WGS72/WGS84 etc.)"
    command: "./gal_tellipsoids"
  - file: math/gal_tmath.c
    description: "Math sub-library tests (angles, sexagesimal, spherical)"
    command: "./gal_tmath"
  - file: gravity/gal_tgravity.c
    description: "Gravity model tests"
    command: "./gal_tgravity"
  - file: sgp4/gal_tsgp4.c
    description: "SGP4 propagation tests (TLE checksum, orbital elements)"
    command: "./gal_tsgp4"
  - file: ref_frames/gal_tref.c
    description: "Reference frame transformation tests"
    command: "./gal_tref"
  - file: odeint/gal_todeint.c
    description: "ODE integrator tests"
    command: "./gal_todeint"
  - file: kepler/gal_tkepler.c
    description: "Keplerian propagator tests (pv2kep/kep2pv/ma2ea/ma2ha/t2pa)"
    command: "./gal_tkepler"

# test_package tests (consumer perspective: link libgal::libgal static and
# exercise the public API on OHOS aarch64) - HarmonyOS-added validation.
test_package_tests:
  - file: test_gal.c
    description: "Compile + link consumer that calls gal_cal2jd (J2000.0 day: 2400000.5 + 51544.0), its documented bad-month/bad-day status codes (-2/-3), gal_pdp dot product ((1,2,3).(4,5,6)=32), and gal_tlechksum on the real ISS TLE line 2 (trailing checksum '7') plus a TLE-format line with matching checksum digit; asserts the binary runs and prints PASS"
    command: "./test_gal"

# HarmonyOS-added consumer assertions only (9 checks in a single binary run:
# 5 gal_cal2jd status/value checks + 1 gal_pdp + 1 TLE length + 2 gal_tlechksum).
# The 14 upstream make-check programs are tracked separately above.
assertion_count: 9
