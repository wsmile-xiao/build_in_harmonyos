# test_package/MANIFEST.yml

package: libfreenect/0.5.3
homepage: "https://openkinect.org/"

# 上游构建系统: CMake。上游 CMakeLists.txt 未注册任何 ctest/add_test
# 目标，也无 make check 目标（无 tests/ 目录；examples 需 GLUT/OpenGL 且
# 本次已在配方中关闭）。R51 清点证据: 上游无可运行的自动化测试套件。
upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: false
upstream_test_command: ""

# 上游示例程序 (examples/) 需物理 Kinect + GLUT/OpenGL 显示环境，本次关闭。
upstream_tests: []

# test_package 自带测试（消费者视角，真实调用 API）
test_package_tests:
  - file: test_freenect.c
    description: >-
      消费者用例 1：调用 freenect_init() -> freenect_num_devices() ->
      freenect_shutdown() 真实 API，验证主库 libfreenect 可链接可调；
      OHOS 沙箱无 USB 枚举时 freenect_init 返回非零，优雅容忍不判失败。
    command: "./test_freenect"
  - file: test_sync.c
    description: >-
      消费者用例 2：编译链接同步包装层头文件 libfreenect_sync.h 并调用
      freenect_sync_stop()，验证第二个导出 API 面 libfreenect_sync 的
      头文件与符号可被消费者 CMake target 使用；无设备时为安全空操作。
    command: "./test_sync"
  - file: test_harmony.c
    description: >-
      鸿蒙特有测试：dlopen 运行时加载已签名的 libfreenect.so 与
      libfreenect_sync.so，并打印 uname。鸿蒙上未经 binary-sign-tool
      签名的 ELF 无法 dlopen，此用例直接验证配方的 OHOS ELF 签名步骤生效。
    command: "./test_harmony"

assertion_count: 6
