# 版本级 manifest
# 位置: archives/l/libfreenect/0.5.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.5.3"
software: "libfreenect"

# 状态: built (本机前置配方已就绪，待真机/conan-verify 编译验证)
# published | built | failed | archived
status: built

build_date: "2026-09-23"
build_system: cmake

source:
  url: "https://github.com/OpenKinect/libfreenect/archive/refs/tags/v0.5.3.tar.gz"
  sha256: "9eeba91c4419c1809b5b5ea3bce59c270d8fd6f5b9e8ac3dd2a909a998c0e102"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_FAKENECT=OFF"
    - "-DBUILD_C_SYNC=ON"
    - "-DBUILD_CPP=ON"
    - "-DBUILD_REDIST_PACKAGE=ON"
  dependencies:
    - "libusb/1.0.27"
  cc: clang
  cxx: clang++

# 配方通过 generate() 的 CMake cache 变量对接依赖与平台，无源码补丁。
patches_applied: []

knowledge_gained:
  - "E092: CMake 不识别 HarmonyOS，配方 generate() 设 CMAKE_SYSTEM_NAME=Linux + CMAKE_SYSTEM_PROCESSOR=aarch64，使 UNIX/install 规则生效。"
  - "上游 cmake_modules/Findlibusb-1.0.cmake 用 find_path/find_library 写死 /usr 路径，且命中复数 cache 变量即短路；配方从 conan libusb 包解析 LIBUSB_1_INCLUDE_DIRS/LIBUSB_1_LIBRARIES。"
  - "test_big_endian() 是交叉编译 try_run，预设 BIG_ENDIAN=FALSE 跳过（aarch64 小端）。"
  - "BUILD_EXAMPLES/BUILD_FAKENECT 关闭：examples 需 GLUT/OpenGL 显示环境，fakenect 为 mock 库。"
  - "OHOS 沙箱 libusb 无法枚举 /sys/bus/usb (errno=13)，freenect_init 无设备返回非零；test_package 优雅容忍，不判失败。"
