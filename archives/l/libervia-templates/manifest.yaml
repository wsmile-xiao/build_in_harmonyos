software: libervia-templates
display: "Libervia Templates"
description: "Libervia（XMPP 通信套件）官方 Jinja2 模板包：sat_templates Python 包 + default/bulma 两套主题模板与 i18n 数据"
category: web
homepage: "https://libervia.org"
license: AGPL-3.0-or-later
build_system: pyproject

ohos_adaptation:
  key_points:
    - "纯 Python + 模板数据包（hatchling 构建后端），无 C/C++ 编译产物"
    - "按 python-require 模式适配：package() 拷贝 sat_templates/ 到 site-packages，package_info() 注入 PYTHONPATH"
    - "运行时依赖 jinja2/3.1.6（ohpcd 已发布）"
    - "上游无测试套件（0 个用例），test_package 补充消费者功能测试（12 项断言）+ 鸿蒙特有端到端消费者用例（7 项检查，非纯断言）"
  common_dependencies:
    - "jinja2"

versions:
  "0.9.0-hg413":
    status: built
    build_date: "2026-09-26"
    source_url: "https://deb.debian.org/debian/pool/main/libe/libervia-templates/libervia-templates_0.9.0~hg413+dfsg.orig.tar.xz"
