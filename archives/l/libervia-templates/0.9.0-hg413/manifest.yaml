# 版本级 manifest — libervia-templates 0.9.0-hg413
# 遵循 ARCHIVE-SPEC v3.0

version: "0.9.0-hg413"
software: libervia-templates
status: built
build_date: "2026-09-26"
build_system: pyproject

# ============================================================
# 源码信息
# ============================================================

source:
  # Debian 官方镜像 hg413 快照 orig 包（R39 合规：权威镜像源；
  # 上游 repos.goffi.org archive 接口 500、PyPI 只有 0.8.0 版本不符）
  url: "https://deb.debian.org/debian/pool/main/libe/libervia-templates/libervia-templates_0.9.0~hg413+dfsg.orig.tar.xz"
  sha256: "d55513b166d4aa737a6ec65d81c1ab879327a5f4314a27054dba3e6c6b9f63b4"
  compression: tar.xz
  archive_root: "libervia-templates-0.9.0~hg413+dfsg"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "jinja2/3.1.6"
  optional: []
  note: |
    sat_templates 是 Libervia 的官方 Jinja2 模板包，消费方必然用 jinja2 渲染。
    上游 pyproject.toml 声明的 dependencies = []（模板上下文由宿主注入），
    但为保持依赖链完整，配方声明运行时依赖 jinja2/3.1.6（ohpcd 已发布，
    W0 预检 conan download 通过）。jinja2 自身依赖 markupsafe/3.0.3，
    由 jinja2/3.1.6 配方声明，无需在此重复。

    ⚠️ 上游版本信息不一致（如实记录）：pyproject.toml 用 hatchling 构建，
    version 动态取自 sat_templates/__init__.py 的 __version__（hg413 =
    "0.9.0.dev0"）；sat_templates/VERSION 文件仍为 "0.8.0"，为上游遗留
    旧文件（setup.py 旧路径读取它），不参与 hatchling 构建。配方版本号
    0.9.0-hg413 对应上游 Mercurial rev 413。

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: |
    package_type=python-require（纯 Python 无二进制产物；不产生 bindirs，
    故无需 commands.json，R38 不适用）。

    上游采用 **hatchling** 构建后端（pyproject.toml: requires = ["hatchling"]，
    build-backend = hatchling.build；wheel 目标 packages = ["sat_templates"]）。
    纯 Python 无编译产物，故配方 package() 直接把整个 `sat_templates/`
    （__init__.py + VERSION + i18n/ + templates/ 两套主题）拷入
    `<pkg>/lib/python3.12/site-packages/sat_templates`，跳过 hatchling/
    pip 构建流程（与 jinja2/3.1.6 先例一致）。

    **本配方无需补丁**（patches 为空）：纯 Python + 模板数据，无平台相关
    代码、无 C 扩展，py3.12 下实测可直接 import 并渲染模板。

    package_info() 同时声明 runenv_info 与 buildenv_info 的 PYTHONPATH
    （jinja2/aiohttp 教训：仅 print 不够，CI 会报 "No module named ..."）。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: high
  issues: []
  notes: |
    纯 Python，无 C 扩展、无平台相关代码，aarch64-ohos 与上游行为一致。
    templates 内的 _browser/__init__.py（bulma 主题的浏览器端 JS 绑定，
    引用 browser/document 全局）仅被 Libervia 前端的浏览器端打包器引用，
    不会在 Python 侧 import，不影响本包。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  note: |
    上游（R51，2026-09-26 实测）：hg413 快照**无上游测试用例（0 个）**。
    build() 内真实检查整个源码树：无 tests/ 目录、无 test_*.py /
    *_test.py、无 tox.ini / pytest.ini / setup.cfg / pyproject.toml 的
    pytest 配置段；setup.py（legacy）无 tests_require/test_suite 声明。
    若检测到任何测试文件/配置，配方会显式抛错（R51 禁止「有套件却跳过」）。

    适配后：test_package 补充消费者功能测试（R34 真实 API），
    **19/19 passed（100%）**——消费者功能测试 **12/12**（import
    sat_templates 校验 __version__（"0.9.0.dev0"）、打包布局（VERSION/两套
    主题/i18n/settings.json 合法 JSON）、用 jinja2(3.1.6) FileSystemLoader
    渲染打包内实际模板（default/bulma 主题 error/404.html 与 error/401.html
    全链渲染，断言标题/正文/bulma.min.css），含 1 个负例（缺失模板必须
    报错））+ 鸿蒙特有端到端消费者用例 **7/7**（test_consumer_e2e.py：
    模拟真实前端消费者经完整模板链渲染 blog/login/app/error 完整页面并
    落盘产物、校验产物为完整页面，非纯断言）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游仓库无 archive 接口可用（repos.goffi.org archive 返回 500）、PyPI 只有旧版 0.8.0 时，可取 Debian 官方镜像的 hg 快照 orig 包（deb.debian.org pool/main/libe/libervia-templates/libervia-templates_<ver>~hg<rev>+dfsg.orig.tar.xz）作为官方权威源（R39 合规），注意版本号用 ~ 表示，conan 版本号用 - 归一化"
  - "上游同时维护 pyproject.toml（hatchling，version 动态取自 __init__.py 的 __version__）与旧 setup.py（读 sat_templates/VERSION 文件）两条构建路径，两者读到的版本可能不一致（hg413：__init__.py=0.9.0.dev0 vs VERSION=0.8.0）；纯 Python 包适配时直接按 pyproject/__init__.py 为准，无需跑构建后端"
  - "Jinja2 模板数据包（如 sat_templates）做消费者功能测试时，用 jinja2.Environment(loader=FileSystemLoader(<打包内 templates dir>), extensions=[jinja2.ext.i18n]) + 注入 script/C/icon/_/gettext 等模板依赖的全局对象，即可端到端渲染打包内真实模板（extends/import/trans/块继承全链），断言输出，避免只测 __version__ 的空壳"

references:
