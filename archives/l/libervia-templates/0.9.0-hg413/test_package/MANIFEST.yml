# test_package/MANIFEST.yml — libervia-templates 0.9.0-hg413
# 上游测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libervia-templates/0.9.0-hg413
homepage: "https://libervia.org"

# ── 上游测试情况（R51 如实申报）──────────────────────────────────────
# hg413 快照（Debian orig 包，与 repos.goffi.org rev 413 内容一致）：
#   * 无 tests/ 目录（grep 整个源码树：无任何 test_*.py / *_test.py）
#   * 无 tox.ini / pytest.ini / setup.cfg / pyproject.toml 无 pytest 配置段
#   * setup.py（legacy）无 tests_require / test_suite 声明
# → 上游无正式测试套件（0 个用例）。
# conanfile.py 的 build() 内做了上述真实检查（_check_upstream_test_suite），
# 若检测到任何测试文件/配置会显式抛错拒绝构建（防止「有套件却跳过」）。
upstream_check_command: "none — 上游无测试套件"
upstream_test_in_build: false
upstream_test_command: "n/a"

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，R34 真实 API）
test_package_tests:
  - file: test_libervia_templates.py
    description: >-
      消费者功能测试（12 项断言）：
      import sat_templates 校验 __version__=="0.9.0.dev0"；校验打包布局
      （VERSION / default / bulma 两套主题 / i18n .mo/.po / settings.json
      合法 JSON）；用 jinja2(3.1.6) FileSystemLoader 渲染打包内**实际模板**
      —— default 与 bulma 主题的 error/404.html、error/401.html（全链：
      extends error/base.html -> base/base.html -> components/common.html，
      含 i18n trans、script 对象注入、xmlattr、块继承），断言标题/正文/
      bulma.min.css 资源引用；含 1 个负例（模板缺失必须报错）。
    command: "python3 test_libervia_templates.py <site-packages-dir>"
  - file: test_consumer_e2e.py
    description: >-
      鸿蒙特有测试（端到端消费者用例，非纯断言）：模拟真实前端消费者
      使用打包的 sat_templates 数据，经完整 Jinja2 模板链（base/base.html
      -> error/base.html、app/app.html、blog/articles.html + blog/item.html +
      components/avatar.html + input/navigation.html、login/login.html +
      input/form.html + input/field.html；含 i18n trans、script/icon/C 注入、
      next_gidx/cur_gidx 状态 id、date_fmt/urlize、xmlattr、块继承）渲染
      完整 HTML 页面并**落盘为产物文件**，再校验产物为完整页面
      （doctype/html/head/body/title + i18n footer + 主菜单 + 表单字段）。
      场景：default 主题 blog 页、default 主题 login 页、两套主题
      error/404+401 页、default 主题 app 页，共 7 项检查。
    command: "python3 test_consumer_e2e.py <site-packages-dir>"

# 测试断言总数（test_package 消费者测试 12 项 + 鸿蒙特有端到端用例 7 项）
assertion_count: 19

# 测试结果（R51 如实申报）
upstream_test_note: >-
  上游无测试用例（0 个）——hg413 快照源码树中不存在 tests/ 目录、
  test_*.py 文件或 tox/pytest 配置（build() 内真实检查通过后如实记录）。
  适配后补充的 test_package 消费者功能测试（12 项断言）+ 鸿蒙特有端到端
  消费者用例（7 项检查）：**19/19 passed（100%）**，覆盖 import/布局校验、
  两套主题真实模板全链渲染、完整页面渲染产物落盘校验 + 负例。
