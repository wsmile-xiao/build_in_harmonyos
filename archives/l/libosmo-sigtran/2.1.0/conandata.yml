# conandata.yml — libosmo-sigtran 2.1.0

sources:
  # 官方源第一 + 镜像第二（osmocom 官方镜像列表成员），conan 2 按序多源尝试
  url:
    - "https://downloads.osmocom.org/releases/libosmo-sigtran/libosmo-sigtran-2.1.0.tar.bz2"
    - "https://mirrors.nju.edu.cn/osmocom/releases/libosmo-sigtran/libosmo-sigtran-2.1.0.tar.bz2"
  sha256: "adc42dde8659b3731b7c2b711d6039b0b80de47ed24e07bde84681eded79c456"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS host triplet; drop umask 077 for the temporary directory (HMDFS does not support it)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: "config.sub: accept the linux-ohos kernel/OS pair so configure can canonicalize the target triple"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: drop umask 077 around the config.status temporary directory (HMDFS limitation)"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-sctp-check.patch"
    patch_description: "configure: soften the hard sctp_recvmsg AC_MSG_ERROR into a WARNING so builds continue on platforms without libsctp (HAVE_LIBSCTP stays undefined), matching the libosmocore/libosmo-netif platform approach"
    patch_type: "portability"
  - patch_file: "patches/0005-src-sctp-include.patch"
    patch_description: "src/*.c: include the sctp_ohos.h RFC6458 type shim on __OHOS__ (musl has no netinet/sctp.h and linux/sctp.h conflicts with libc headers); guard the osmocom/netif/sctp.h include (not installed by the --disable-libsctp build of libosmo-netif)"
    patch_type: "portability"
  - patch_file: "patches/0006-src-osmo_ss7_asp.c.patch"
    patch_description: "osmo_ss7_asp.c: guard get_logevel_by_sn_type/log_sctp_notification and their rx_cb call sites with HAVE_LIBSCTP (the osmo_sctp_* string helpers are only exported by a libsctp-enabled libosmo-netif); guard the multiaddr add/drop local-address calls returning -ENOTSUP without SCTP"
    patch_type: "portability"
  - patch_file: "patches/0007-src-osmo_ss7_vty.c.patch"
    patch_description: "osmo_ss7_vty.c: guard the multiaddr get_ip_and_port/snprintf call sites with HAVE_LIBSCTP, falling back to the single-address osmo_sock_get_ip_and_port API"
    patch_type: "portability"
  - patch_file: "patches/0008-src-sctp_ohos.h.patch"
    patch_description: "add src/sctp_ohos.h: minimal RFC6458 SCTP type shim for __OHOS__ builds (musl has no netinet/sctp.h; the kernel UAPI linux/sctp.h conflicts with libc headers via a duplicate struct sockaddr_storage)"
    patch_type: "portability"
