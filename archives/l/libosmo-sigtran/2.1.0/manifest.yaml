software: libosmo-sigtran
version: "2.1.0"
status: built
build_date: "2026-09-24"

source:
  url: "https://downloads.osmocom.org/releases/libosmo-sigtran/libosmo-sigtran-2.1.0.tar.bz2"
  sha256: "adc42dde8659b3731b7c2b711d6039b0b80de47ed24e07bde84681eded79c456"
  tar_format: tar.bz2

build:
  system: autotools
  build_system: autotools
  configure_options:
    - "--disable-doxygen"
    - "--enable-shared"
  cflags:
    - "-D_GNU_SOURCE"
    - "-fno-emulated-tls"
  dependencies:
    - libosmocore/1.11.0
    - libosmo-netif/1.6.0
  cc: clang 15.0.4

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-configure-sctp-check.patch"
  - "0005-src-sctp-include.patch"
  - "0006-src-osmo_ss7_asp.c.patch"
  - "0007-src-osmo_ss7_vty.c.patch"
  - "0008-src-sctp_ohos.h.patch"

knowledge_gained:
  - "上游 configure.ac 的 sctp_recvmsg 检查是硬 AC_MSG_ERROR（SIGTRAN 假设 SCTP 可用）——无 libsctp 平台须软化为 WARNING 走 HAVE_LIBSCTP 未定义路径"
  - "musl 无 netinet/sctp.h 且 linux/sctp.h 与 libc 头冲突（sockaddr_storage 重复定义）——需自供 RFC6458 类型 shim 头"
  - "musl netinet/tcp.h 的 struct tcp_info 在 #ifdef _GNU_SOURCE 内——osmocom 系构建统一 -D_GNU_SOURCE"
  - "无 SCTP 平台 libosmo-netif 不导出 osmo_sctp_*/osmo_sock_multiaddr_* 符号——sigtran 调用点按 HAVE_LIBSCTP 守卫（multi-homing 返回 -ENOTSUP、vty 回退单地址 API）"
