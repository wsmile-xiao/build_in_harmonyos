# 软件级 manifest — libpgm (OpenPGM)
# 文件位置: archives/l/libpgm/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: libpgm
display: "libpgm (OpenPGM)"
description: "Implementation of the PGM reliable multicast transport protocol (RFC 3208); the reliable-multicast engine behind ZeroMQ pgm/epgm"
category: network
homepage: "https://github.com/steve-o/openpgm"
license: LGPL-2.1-or-later

# 常用构建系统（可被版本级覆盖）
build_system: autotools

# OHOS 适配知识（跨版本通用）
ohos_adaptation:
  key_points:
    - "Autotools 发布包只带 configure.ac/Makefile.am，需先 autoreconf；autoconf/automake/libtool 由 Conan tool_requires 提供（OHOS worker 无系统 automake）。"
    - "config.guess 不识别 uname -s=HarmonyOS，退回 set_cc_for_build（其 umask 077 && mktemp -d 在 HMDFS 不可写）；构建期补 *:HarmonyOS:*:* 分支并用 sh 实跑校验三元组（E007）。"
    - "生成的 configure 用 umask 077 && mktemp -d，config.status 在 HMDFS 上失败；构建期 umask 077->022（E114）。"
    - "Autotools + Conan 的 perl 双体系冲突（Perl_my_cxt_init / Cwd handshake）；PERL=perl + PERL5LIB 收敛为 automake/autoconf 纯 Perl 目录（DRAFT-6049）。"
    - "libtool 必须经 Conan conanbuild env（注入 ACLOCAL_PATH/LIBTOOLIZE/_lt_pkgdatadir），否则 autoreconf 跳过 libtoolize 并报 possibly undefined macro: AC_PROG_LIBTOOL（E6502）。"
    - "cpu.c 的 x86 __cpuidex/_xgetbv 内联汇编仅被 #ifndef _MSC_VER 包住；aarch64 需 #if defined(__i386__)||defined(__x86_64__) 守卫（E016，补丁 0001，无平台宏）。"
    - "上游 SCons 注册的 libcheck 单测必须与库一起 -DSKB_DEBUG 编译，否则 txw_unittest 段错误（pgm_skb_is_valid(NULL) 返回 TRUE）。"
    - "静态 glib 的 gettext 缺口：OHOS/musl 无 unprefixed gettext 入口，单测 harness 需内置 C-locale shim（仅测试链接，不进包；E107）。"
    - "产物为静态库，运行期仅依赖 libc（pthread/libm/librt 由 configure 探测）；不与系统同名库冲突，无需 commands.json（R38）。"
  common_dependencies:
    - autoconf
    - automake
    - libtool
    - m4
    - check
    - glib

# 版本索引
versions:
  "5.3.128":
    status: built
    build_date: "2026-10-05"
    conan_ref: "libpgm/5.3.128"
    path: archives/l/libpgm/5.3.128
  "5.3.128-dfsg":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libpgm/5.3.128-dfsg"
    path: archives/l/libpgm/5.3.128-dfsg
