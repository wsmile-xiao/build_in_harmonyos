# 知识沉淀
knowledge_gained:
  - "OpenPGM 的 cpu.c 仅用 #ifndef _MSC_VER 守卫 x86 __cpuidex/_xgetbv 内联汇编，clang 对未使用静态函数也校验 asm 约束 → aarch64 必失败；补丁 0001-cpu.c.patch 回移上游 master 的 #if defined(__i386__) || defined(__x86_64__) 守卫（ref: E016）"
  - "2025 版 GNU config.guess 不识别 uname -s=HarmonyOS，退回 set_cc_for_build（其 (umask 077 && mktemp -d) 在 HMDFS 不可写）→ 构建期补 HarmonyOS 分支并用 sh config.guess/config.sub 实跑校验三元组（ref: E007）"
  - "生成的 configure 用 umask 077 && mktemp -d ./confXXXXXX，config.status 阶段在 HMDFS 上建临时目录失败 → 构建期 umask 077→022（ref: E114）"
  - "conan automake/1.18 的 aclocal/automake 脚本硬编码平台 perl 且 @INC 前缀为空，与 conan perl/5.42.2 的 PERL5LIB 冲突（Perl_my_cxt_init / Cwd handshake）→ PERL=perl + PERL5LIB 收敛为 automake/autoconf 两个纯 Perl 模块目录（ref: DRAFT-6049, E116）"
  - "conan libtool/2.5.4 经 buildenv_info 注入 ACLOCAL_PATH/LIBTOOLIZE/_lt_pkgdatadir，autoreconf 才会探测到 AC_PROG_LIBTOOL 并调用 libtoolize；手工拼 PATH 会跳过 libtoolize 并报 possibly undefined macro: AC_PROG_LIBTOOL -> 必须走 conanbuild env（ref: E6502, E209）"
  - "上游 SCons 注册的 libcheck 单测必须与 libpgm 一起用 -DSKB_DEBUG 编译：否则 pgm_skb_is_valid(NULL) 返回 TRUE，txw_unittest 段错误而非按预期 SIGABRT（ref: libpgm-notes-6）"
  - "glib 静态库在 OHOS 上引用 unprefixed GNU gettext 入口，制品仓 libintl.so 只导出 libintl_*/g_libintl_* 别名；静态链接 glib 的消费者需自带 C locale 恒等 shim（ref: E107）"

