# 版本级 manifest - libpgm 5.3.128-dfsg
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "5.3.128-dfsg"

# 软件名
software: "libpgm"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "autotools"

# 源码信息
source:
  url: "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/libp/libpgm/libpgm_5.3.128~dfsg.orig.tar.xz"
  sha256: "f81831dcb05fa57ba6346541372cc04e67e8bbe4ce5d7d9438c9767d31f358f2"
  tar_format: tar.xz

# 构建配置
build:
  system: autotools
  configure_options:
    - "--disable-shared --enable-static（shared=False，R26 静态库）"
    - "PYTHON=<conan 解释器绝对路径>（configure.ac 用 AC_PATH_PROG(PYTHON, python)，worker 无 python 别名）"
  dependencies: []
  cc: clang
  cxx: clang++

# 测试结果（上游 SCons 开发构建注册的 29 个 libcheck 单测程序）
# 26 个执行：25 通过（368 条 check）、1 失败（if_unittest 13/261，IPv6 mock 拓扑依赖）；
# 3 个按上游自带前置条件跳过（socket/ip 需 root、getnetbyname 需 /etc/networks）
test_results:
  type: official
  total: 29
  passed: 25
  failed: 1
  skipped: 3

# 补丁信息
patches_applied:
  - "0001-cpu.c.patch"

# 知识沉淀
knowledge_gained:
  - "OpenPGM 5.3.128 的 cpu.c 只用 #ifndef _MSC_VER 包住 x86 __cpuidex/_xgetbv 内联汇编，clang 对未使用静态函数也校验 asm 约束，aarch64 必失败；上游 master 已用 #if defined(__i386__) || defined(__x86_64__) 守卫"
  - "2025 版 GNU config.guess 不识别 uname -s=HarmonyOS，会退回 set_cc_for_build，其 (umask 077 && mktemp -d) 目录在 HMDFS 不可写；须先补 HarmonyOS 分支并实跑校验三元组（E007）"
  - "conan automake/1.18 的 aclocal/automake 脚本硬编码平台 perl 且 @INC 前缀为空，与 conan perl/5.42.2 的 PERL5LIB 冲突（Perl_my_cxt_init / Cwd handshake）；解法是 PERL=perl + PERL5LIB 收敛为 automake/autoconf 两个纯 Perl 模块目录（DRAFT-6049）"
  - "上游 SCons 注册的 libcheck 单测必须与 libpgm 一起用 -DSKB_DEBUG 编译：否则 pgm_skb_is_valid(NULL) 返回 TRUE，txw_unittest 会段错误而非按预期 SIGABRT"
  - "glib 静态库在 OHOS 上引用 unprefixed GNU gettext 入口，制品仓 libintl.so 只导出 libintl_*/g_libintl_* 别名；静态链接 glib 的消费者需要自带 C locale 恒等 shim"
