sources:
  "5.3.128-dfsg":
    # Upstream Savannah no longer serves libpgm (the whole
    # download.savannah.nongnu.org/releases/libpgm/ directory returns 404),
    # so the authoritative source is Debian's DFSG-repacked orig tarball.
    # Debian README.source documents that ~dfsg only removes the two
    # non-DFSG-free RFC drafts under doc/; no source code is changed.
    # Both entries are standard Debian pool mirrors; sha256 pins the content.
    url:
      - "https://mirrors.tuna.tsinghua.edu.cn/debian/pool/main/libp/libpgm/libpgm_5.3.128~dfsg.orig.tar.xz"
      - "https://mirrors.ustc.edu.cn/debian/pool/main/libp/libpgm/libpgm_5.3.128~dfsg.orig.tar.xz"
    sha256: "f81831dcb05fa57ba6346541372cc04e67e8bbe4ce5d7d9438c9767d31f358f2"

patches:
  "5.3.128-dfsg":
    - patch_file: "patches/0001-cpu.c.patch"
      patch_description: "0001 cpu guard x86 cpuid helper asm"
      patch_type: "portability"
