package: libpgm/5.3.128-dfsg
homepage: "https://github.com/steve-o/openpgm"

# 上游发布包（Autotools）未把任何用例接入 automake：Makefile.am 没有 TESTS=，
# `make check` 是空操作。上游源码树内另有 SCons 开发构建注册的 29 个 libcheck
# 单测程序（openpgm/pgm/SConscript.libpgm 的 te.Program 调用），本配方在
# build() 中编译并运行它们。
upstream_check_command: "make check (automake: no TESTS registered -> no-op)"
upstream_test_in_build: true
upstream_test_command: "compile + run 29 libcheck unit-test programs from SConscript.libpgm against an SKB_DEBUG build"

upstream_tests:
  - file: SConscript.libpgm
    source: libpgm-5.3.128~dfsg/openpgm/pgm/SConscript.libpgm
    description: "29 个 te.Program([..._unittest.c]) 单测程序（check 0.15.2 框架）"
    command: "conan create . -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64"

test_package_tests:
  - file: test_package/test.c
    description: "调用公开 API：版本三元组、pgm_gsi_*/pgm_tsi_* 指纹、pgm_init/pgm_shutdown，并在 OHOS 上断言构建指纹为 HarmonyOS/aarch64"
    command: "./test_libpgm"
    assertion_count: 15
