# 编译中学到的知识
knowledge_gained:
  - "config.guess/config.sub 需打 HarmonyOS 识别补丁（E007），映射 aarch64-unknown-linux-ohos" knowledge_ref: E007
  - "configure config.status 临时目录 umask 077 需改 022（E011，HMDFS 权限）" knowledge_ref: E011
  - "codeload URL 无扩展名时 conandata.yml 需显式 filename，否则 conan get 按 zip 解压失败" knowledge_ref: E483
  - "libsigc 是接口依赖，需 cpp_info.requires 传递 include 给下游消费者" knowledge_ref: DRAFT-libpar2-0.2-consumer-contract-ohos-prebuilt-deps
  - "上游 Makefile.am glob 安装头文件失效，package() 需显式 copy 公开头文件" knowledge_ref: DRAFT-libpar2-0.2-consumer-contract-ohos-prebuilt-deps
  - "cpp_info.libs 填 par2（find_library 自动补 lib 前缀）" knowledge_ref: DRAFT-libpar2-0.2-consumer-contract-ohos-prebuilt-deps
  - "Par2Repairer::Process 需先 PreProcess 加载，否则 mainpacket 为空 SegFault" knowledge_ref: DRAFT-libpar2-0.2-consumer-contract-ohos-prebuilt-deps
  - "2006 版 config.guess 无 GUESS 后处理需 echo+exit；libtool SED 硬编码 /bin/sed 需改 /usr/bin/sed" knowledge_ref: DRAFT-libpar2-0.2-old-autotools-scripts-ohos-adaptation

