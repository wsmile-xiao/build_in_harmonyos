# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# libpar2 0.2 上游测试枚举结论（R51 三步法）：
#   1. 官方 master tarball（codeload，sha256 915066d0...4701）无 tests/ 目录，
#      无 testdata.tar.gz、pretest/test1~test6/posttest 脚本（EXTRA_DIST 与
#      TESTS 全部被注释，见 Makefile.am 第 57-61 行）。
#   2. Makefile.am 中 `#TESTS = pretest test1 ... posttest` 被注释，automake
#      生成的 Makefile 无 TESTS/check_PROGRAMS/check_SCRIPTS 注册。
#   3. 实测 `make check` 退出码 0 且零测试输出（无任何用例被注册/运行）。

package: libpar2/0.2
homepage: "https://github.com/parchive/libpar2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（枚举结论：官方 tag 源码无任何独立上游测试用例）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者验证：调用 libpar2 公开 API（CommandLine/Par2Creator/Par2Repairer）完成 PAR2 创建+校验闭环"
    command: "./test_libpar2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
