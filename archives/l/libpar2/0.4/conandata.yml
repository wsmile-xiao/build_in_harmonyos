sources:
  url: "https://launchpad.net/libpar2/trunk/0.4/+download/libpar2-0.4.tar.gz"
  filename: "libpar2-0.4.tar.gz"
  sha256: "316d6f0eb31eb896f5546171c2e86801aeffe5ae5e2decffc17f0018346796d4"

patches:
  - patch_file: "patches/0001-config.sub-ohos.patch"
    patch_description: "config.sub: recognize aarch64 CPU and linux-ohos OS so the OHOS triplet canonicalizes"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-libstdcxx.patch"
    patch_description: "configure: do not append -lstdc++ to LIBS when the AC_CHECK_LIB(stdc++) probe succeeds (OHOS uses libc++, libstdc++ is absent)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-umask.patch"
    patch_description: "configure: drop umask 077 when creating the config.status tmp dir (E114 — HMDFS forces setgid and a drwx--S--- dir is not writable by its owner)"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-echo.patch"
    patch_description: "configure: force ECHO=printf probe over the ksh `print` builtin so generated config.status/libtool (bash shebang) do not fail with 'print: command not found'"
    patch_type: "portability"
  - patch_file: "patches/0005-libpar2-init-repairers.patch"
    patch_description: "libpar2.cpp: initialize par1Repairer/par2Repairer to NULL in LibPar2 ctor (destructor deletes both; the uninitialized one caused Signal 11 in test_package)"
    patch_type: "correctness"
