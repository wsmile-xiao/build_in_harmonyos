software: libpar2

# 版本号
version: "0.4"

# 构建系统（扁平字段，用于 G4 门禁）
build_system: autotools

# 编译状态: published | built | failed | archived
status: built

# 编译日期
build_date: "2026-09-14"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://launchpad.net/libpar2/trunk/0.4/+download/libpar2-0.4.tar.gz"
  sha256: "316d6f0eb31eb896f5546171c2e86801aeffe5ae5e2decffc17f0018346796d4"
  tar_format: tar.gz
  upstream_repo: "https://github.com/Parchive/libpar2"

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux-ohos"
    - "--host=aarch64-linux-ohos"
    - "ac_cv_lib_stdcpp_main=yes"
    - "PKG_CONFIG_PATH=<generators_folder>"
  cxxflags:
    - "-std=c++11"
  dependencies:
    - "libsigc/2.10.8"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-config.sub-ohos.patch"
  - "0002-configure-libstdcxx.patch"
  - "0003-configure-umask.patch"
  - "0004-configure-echo.patch"
  - "0005-libpar2-init-repairers.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "libpar2 认领信息标注语言为 C，实际是 C++（全 .cpp 源码 + configure.ac 用 AC_PROG_CXX/AC_LANG_CPLUSPLUS），需以实际为准"
  - "autotools 库在 OHOS 上最大的坑是 AC_CHECK_LIB(stdc++...)：OHOS 只有 libc++ 没有 libstdc++，链接探测必然失败；注入缓存变量 ac_cv_lib_stdcpp_main=yes 可跳过探测，但 configure 成功分支仍会把 -lstdc++ 追加进 LIBS，导致最终链接失败——必须同时 patch 掉该注入行"
  - "AC_CHECK_LIB(stdc++) 生成的缓存变量名是 ac_cv_lib_stdcpp_main（autoconf 把 '+' 映射为 'p'），不是常见误写的 ac_cv_lib_stdcpp__main"
  - "旧版 config.sub 不认识 aarch64 与 linux-ohos，交叉编译前需 patch config.sub 加入 aarch64 CPU 与 linux-ohos OS 三元组"
  - "AutotoolsToolchain 不会自动注入 OHOS 的 --build/--host 三元组，需在 configure_args 显式传 aarch64-linux-ohos"
  - "configure 的 PKG_CHECK_MODULES(SIGC, sigc++-2.0) 需要 PkgConfigDeps 生成 .pc 文件并把 PKG_CONFIG_PATH 指向 generators_folder"
  - "2003 年老代码在 clang 15 下需显式 -std=c++11（nixpkgs clang 路径同样加 CXXFLAGS），避免默认 cppstd=17 引发兼容问题"
  - "configure conftest 链接依赖的共享库（libsigc）后要运行产物，OHOS loader 无默认搜索路径，需把依赖 libdir 注入 LD_LIBRARY_PATH（E114/aaphoto 同一模式）"
  - "Makefile.am 中 LDADD 含 -lstdc++ 但库目标链接只用 $(LIBS)，patch configure 的 LIBS 注入即可，无需动 Makefile.am"
