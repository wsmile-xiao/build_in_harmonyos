# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libpar2/0.4
homepage: https://github.com/Parchive/libpar2

# 上游无测试套件：Makefile.am 中 TESTS 被注释、无 tests/ 目录
upstream_check_command: "none"
upstream_test_in_build: false
upstream_test_command: "none"

upstream_tests: []

# test_package 中自带的测试（消费者视角验证，全流程闭环）
test_package_tests:
  - file: test_libpar2.cpp
    description: "libpar2 API 闭环验证: Par2Creator 创建恢复集 + LibPar2 校验完好文件 + 损坏检测(eRepairPossible) + 修复 + 修复内容与原始一致"
    command: "./test_libpar2"

# 测试断言总数（7 项独立断言）
assertion_count: 7
