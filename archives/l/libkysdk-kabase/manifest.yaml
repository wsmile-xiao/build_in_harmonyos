software: libkysdk-kabase
display: "libkysdk-kabase (openKylin KylinSDK kabase / single_application)"
description: "openKylin KylinSDK kabase 的 single_application 组件：基于 QtLocalPeer(QLocalServer) 的 QtSingleApplication 单实例应用辅助库。提供 libkysdk-kabase.so 与上游真实头文件 include/single_application/single_application.hpp，是 kylin-calendar（#include <single_application/single_application.hpp>）的直接依赖"
category: desktop
homepage: "https://gitee.com/openkylin/libkysdk-applications"
license: LGPL-3.0
build_system: qmake

ohos_adaptation:
  key_points:
    - "只构建 kysdk-kabase/kabase/single_application 组件（kabase.pro 裁剪）：该组件自包含，仅需 Qt5 Core/Network/Widgets；上游 kabase 模块其余部分依赖 gsettings-qt/opencv/freeimage/X11/xcb/KWindowSystem/systemd/kylog/kyconf，OHOS 制品仓不可得"
    - "single_application.cpp 唯一外部头 <kwindowsystem.h>（KWindowSystem::forceActiveWindow）在 OHOS 无 X11/KWin → 补丁 0002 改用 Qt 原生窗口激活 raise()/activateWindow()"
    - "头文件安装到 include/single_application/single_application.hpp —— 即上游真实文件路径（非改名 shim），消费者 <single_application/single_application.hpp> 直接可用"
    - "qmake 构建依赖 qt5-qtbase 的 qt.conf/.pri 重定位（_fix_qtbase_paths，同 libkysdk-applications 先例）"
  common_dependencies:
    - qt5-qtbase/5.15.2.2

versions:
  "3.0.1.0":
    status: built
    build_date: "2026-10-08"
    source_url: "https://gitee.com/openkylin/libkysdk-applications/repository/archive/621ebd9dd72c7aa2e6642e2cd929e2b13c25b1e4.tar.gz"
