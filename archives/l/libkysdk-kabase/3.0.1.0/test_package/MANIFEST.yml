# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试来源: kysdk-kabase/test/（openKylin libkysdk-applications huanghe @3.0.1.0）
#   - kabase_test.pro: TEMPLATE=app 的“手动测试台”（非 ctest/QTest 注册），
#     main.cpp 手工调用 widget/dbus/gsettings/image 等接口；依赖 opencv
#     (-lopencv_core/imgcodecs/imgproc)、gsettings-qt、dbus 与被裁模块 → OHOS 不可构建。
#   - application_access_test/{application_a,application_b}: 单例应用辅助示例
#     （TEMPLATE=app），非自动化测试。
#   - single_application 组件的“应用单例测试”在 test/main.cpp 的 main() 中
#     整段被注释（手动/交互式，需真实显示与交互），无自动化用例。
#   → 结论：kysdk-kabase 无 single_application 组件的自动化上游测试（N=0 可运行）。
#     test_package 提供真实消费者测试补足（R34）。

package: libkysdk-kabase/3.0.1.0
homepage: "https://gitee.com/openkylin/libkysdk-applications"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试目标（如实清点）
upstream_tests:
  - name: "kysdk-kabase/test/ 总览（含 manual 测试台与示例）"
    location: kysdk-kabase/test/
    count: 0
    runnable: false
    note: "kabase 模块为手动测试台（kabase_test.pro, TEMPLATE=app），无 ctest/QTest 自动注册；single_application 组件无自动化用例"
  - name: "single_application 单例测试（被注释）"
    location: kysdk-kabase/test/main.cpp
    count: 0
    runnable: false
    note: "上游 main() 中 QtSingleApplication 单例测试整段注释（// kdk::kabase::QtSingleApplication app(argc, argv); ...），手动/交互式，需真实显示与交互；不构成可运行自动化用例"
  - name: "kabase-test 手动测试台"
    location: kysdk-kabase/test/kabase_test.pro
    count: 0
    runnable: false
    note: "TEMPLATE=app 手动测试台（widget_test/dbus_test/gsettings_test/image_test），依赖 opencv/gsettings-qt/dbus 及被裁模块（本包只保留 single_application 组件）→ OHOS 不可构建"
  - name: "application_access_test 示例应用"
    location: kysdk-kabase/test/application_access_test/
    count: 0
    runnable: false
    note: "application_a / application_b 单例示例（TEMPLATE=app），依赖被裁的 application_access 模块，非自动化测试"

# 上游测试用例修改说明（如实申报）
#   - 无：本包不构建任何上游测试目标（kysdk-kabase 无 single_application 组件
#     自动化测试，其余测试台依赖被裁模块/不可得依赖链），故未修改上游测试文件。
# 补全测试用例说明
#   - test_package/test_single_application.cpp 为新增消费者测试（非上游文件）：
#     包含上游真实头文件 <single_application/single_application.hpp>、链接
#     libkysdk-kabase.so，真实调用 QtSingleApplication 构造 / id() /
#     activationWindow()/setActivationWindow() / isRunning()，断言失败非零退出。

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "build(): 用 qt5-qtbase 的 qmake 编译消费者程序 test_single_application.cpp（INCLUDEPATH=被测包 include/，LIBS=-lkysdk-kabase）→ 产出链接 libkysdk-kabase.so 的可执行文件；test(): 在 QT_QPA_PLATFORM=offscreen + 可写 TMPDIR 下真实运行该程序，断言 id() 回显构造参数、activationWindow() 状态、并调用 isRunning()（返回码 0=通过）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
