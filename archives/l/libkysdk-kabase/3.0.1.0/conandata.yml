sources:
  "3.0.1.0":
    # 上游官方源：openKylin libkysdk-applications（huanghe 分支 = 3.0.1.0）。
    # 锁定到 huanghe HEAD 提交 621ebd9dd72c7aa2e6642e2cd929e2b13c25b1e4，
    # 使归档快照不可变（branch 快照会随分支推进改变，SHA 归档稳定）。
    url: "https://gitee.com/openkylin/libkysdk-applications/repository/archive/621ebd9dd72c7aa2e6642e2cd929e2b13c25b1e4.tar.gz"
    sha256: "f4877743fced6e0e5b2e68a5004acfb008d1f9b5b555e3dc1d326659a0c1cc97"
    tar_format: tar.gz

patches:
  "3.0.1.0":
    - patch_file: "patches/0001-kabase-pro-single-application-only.patch"
      patch_type: "portability"
      patch_description: "裁剪 kabase.pro 为仅构建 single_application 组件（上游 kabase 模块其余部分依赖 gsettings-qt/opencv/freeimage/X11/xcb/KWindowSystem/systemd/kylog/kyconf 等 OHOS 制品仓不可得依赖链）"
      strip: 1
    - patch_file: "patches/0002-single-application-drop-x11-kwin.patch"
      patch_type: "portability"
      patch_description: "single_application.cpp 去除 <kwindowsystem.h> 与 KWindowSystem::forceActiveWindow（OHOS 无 X11/KWin），改用 Qt 原生窗口激活 raise/activateWindow"
      strip: 1
