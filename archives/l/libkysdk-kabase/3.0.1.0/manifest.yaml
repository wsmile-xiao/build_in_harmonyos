software: libkysdk-kabase
version: "3.0.1.0"
status: built
build_system: qmake
build_date: "2026-10-08"
created_at: 2026-10-08

source:
  url: "https://gitee.com/openkylin/libkysdk-applications/repository/archive/621ebd9dd72c7aa2e6642e2cd929e2b13c25b1e4.tar.gz"
  sha256: "f4877743fced6e0e5b2e68a5004acfb008d1f9b5b555e3dc1d326659a0c1cc97"
  format: tar.gz
  ref: "openkylin/huanghe @ 621ebd9dd72c7aa2e6642e2cd929e2b13c25b1e4 (changelog 3.0.1.0-ok0.29)"
  note: "上游官方源 openKylin libkysdk-applications（huanghe 分支 = 3.0.1.0）；锁定提交 SHA 使归档不可变。上游 repo 根 = libkysdk-applications-<sha>/，strip_root=True。"

dependencies:
  required:
    - qt5-qtbase/5.15.2.2
  build: []

build:
  system: qmake
  target: "kysdk-kabase/kabase/kabase.pro（已裁剪为仅 single_application 组件）"
  artifact: "lib/libkysdk-kabase.so（TARGET=kysdk-kabase）+ include/single_application/single_application.hpp"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-kabase-pro-single-application-only.patch"
  - "0002-single-application-drop-x11-kwin.patch"

test_results:
  type: conan_create_ohos_aarch64
  upstream: "kysdk-kabase 上游无 single_application 组件自动化测试（test/main.cpp 中的单例测试整体被注释，手动/交互式）；kabase-test 手动测试台依赖 opencv/gsettings-qt/dbus 与被裁模块，OHOS 不可构建 → N=0 可运行上游自动化用例"
  test_package: "passed: qmake 消费者程序包含 <single_application/single_application.hpp>，链接 libkysdk-kabase.so 并真实调用 QtSingleApplication 构造 / id() / activationWindow() / isRunning()（见 test_package/MANIFEST.yml）"
  full_reference: "libkysdk-kabase/3.0.1.0"

knowledge_gained:
  - "库头文件 <single_application/single_application.hpp> 的真实提供者是 kysdk-kabase（上游 libkysdk-applications 的 kysdk-kabase/kabase/single_application/），声明 namespace kdk::kabase::QtSingleApplication : public QApplication；此前 itay-grudev/SingleApplication 改名 shim 的方案是错误身份（无该命名空间/类型），已废弃 (knowledge_ref: notes.md 头文件提供者调查)"
  - "single_application 组件自包含：仅依赖 Qt5 Core/Network(QtLocalPeer 用 QLocalServer/QLocalSocket)/Widgets(QApplication/QWidget)，唯一外部头是 single_application.cpp 的 <kwindowsystem.h>（KWindowSystem::forceActiveWindow）→ 补丁改用 Qt 原生 raise/activateWindow (knowledge_ref: patches/0002-single-application-drop-x11-kwin.patch; notes.md 依赖分析)"
  - "上游 kabase 模块其余部分（gsettings-qt/opencv/freeimage/X11/xcb/KWindowSystem/systemd/kylog/kyconf）依赖链 OHOS 制品仓不可得 → kabase.pro 裁剪为仅 single_application（与 archives/l/libkysdk-applications/3.0.1.2 裁剪 kysdk-kabase 模块同源理由） (knowledge_ref: patches/0001-kabase-pro-single-application-only.patch)"
  - "gitee 归档端点（repository/archive/<ref>.tar.gz）的 WAF 按 User-Agent 判别：curl/wget 类 UA 得到 302→blazearchive 的真实 tar.gz，而 python-requests/Conan/浏览器 UA 得到 HTML 挑战页（sha256 不符）。conan 默认 UA='Conan/...' 会被拦 → 配方 get() 显式传 headers={'User-Agent': 'curl/8.0.0'}（conan 仅在未提供 UA 时才注入默认值） (knowledge_ref: E017 网络下载超时/镜像; notes.md 排错要点)"
