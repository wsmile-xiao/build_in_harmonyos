package: luksmeta/10
homepage: "https://github.com/latchset/luksmeta"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check (7 registered tests executed individually)"

upstream_tests:
  - file: "test-crc32c.c"
    source: "luksmeta-10/test-crc32c.c"
    description: "CRC32C reference vectors"
    command: "./test-crc32c"
  - file: "test-lm-assumptions.c"
    source: "luksmeta-10/test-lm-assumptions.c"
    description: "LUKS1 layout assumptions"
    command: "./test-lm-assumptions"
  - file: "test-lm-init.c"
    source: "luksmeta-10/test-lm-init.c"
    description: "metadata initialization, corruption detection, and nuke"
    command: "./test-lm-init"
  - file: "test-lm-one.c"
    source: "luksmeta-10/test-lm-one.c"
    description: "single-slot metadata lifecycle"
    command: "./test-lm-one"
  - file: "test-lm-two.c"
    source: "luksmeta-10/test-lm-two.c"
    description: "multi-slot metadata lifecycle"
    command: "./test-lm-two"
  - file: "test-lm-big.c"
    source: "luksmeta-10/test-lm-big.c"
    description: "large-value and boundary validation"
    command: "./test-lm-big"
  - file: "test-luksmeta"
    source: "luksmeta-10/test-luksmeta"
    description: "CLI end-to-end suite including CVE-2025-11568 boundaries"
    command: "bash test-luksmeta"

test_package_tests:
  - file: "test_api.c"
    description: "consumer API lifecycle: format, init, save, load, wipe, nuke"
    command: "./test_api"
  - file: "test_ohos.c"
    description: "HarmonyOS-specific writable-storage and synchronized I/O lifecycle"
    command: "./test_ohos"

assertion_count: 25
