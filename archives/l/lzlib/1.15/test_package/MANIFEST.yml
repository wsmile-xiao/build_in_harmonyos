# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lzlib/1.15
homepage: "https://www.nongnu.org/lzip/lzlib.html"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: lzcheck.c
    source: lzlib-1.15/lzcheck.c
    description: "lzlib round-trip compression/decompression test"
    command: "./lzcheck"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：压缩-解压缩往返验证"
    command: "./test_lzlib"

# 测试断言总数
assertion_count: 3
