software: liboauth2
display: "liboauth2"
description: "OAuth2 / OpenIDC client library for C"
category: library
homepage: "https://github.com/OpenIDC/liboauth2"
license: Apache-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建系统，需禁用 Apache/Nginx 模块"
    - "依赖 cjose 进行 JOSE/JWT 处理"
    - "依赖 pcre2 进行正则匹配"
  common_dependencies:
    - openssl
    - libcurl
    - jansson
    - cjose
    - pcre2

versions:
  "2.3.0":
    status: built
    build_date: "2026-09-15"
