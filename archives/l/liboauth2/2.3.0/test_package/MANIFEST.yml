# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: liboauth2/2.3.0
homepage: "https://github.com/OpenIDC/liboauth2"

# 上游测试命令
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/check_liboauth2.c
    source: liboauth2-2.3.0/test/check_liboauth2.c
    description: "上游单元测试 (check 框架), 需 check 库, OHOS 上无法运行"
    command: "./check_liboauth2"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test.c
    description: "验证 liboauth2 链接 + oauth2_version() API + log 枚举"
    command: "./test_liboauth2"

# 测试断言总数
assertion_count: 3
