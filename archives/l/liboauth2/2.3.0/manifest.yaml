version: "2.3.0"
software: "liboauth2"
status: built
build_date: "2026-09-15"
build_system: autotools

source:
  url: "https://github.com/OpenIDC/liboauth2/archive/refs/tags/v2.3.0.tar.gz"
  sha256: "a68002d8fed942aefb48999817bcebfcc08d97e88b4ed4ee323151bd6ec70a1b"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-apache"
    - "--without-nginx"
    - "--without-memcache"
    - "--without-redis"
    - "--without-jq"
  dependencies:
    - openssl/3.5.8.1
    - libcurl/8.5.0
    - jansson/2.15.1.1
    - cjose/0.6.2.7
    - pcre2/10.48
  cc: clang
  cxx: clang++

patches_applied: []
knowledge_gained:
    - "liboauth2 是纯 C 库（非 C++），使用 Autotools 构建"
    - "可选组件（Apache/Nginx/Memcache/Redis/JQ）可通过 configure 参数禁用"
    - "核心依赖为 openssl、libcurl、jansson、cjose、pcre2"
