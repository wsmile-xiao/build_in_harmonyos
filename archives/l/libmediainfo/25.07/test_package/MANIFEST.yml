# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试情况说明:
#   MediaInfoLib 上游的自动化测试位于 Project/GNU/Library/test/
#   (autotools make check 路线, CMake 路线未注册测试):
#     TESTS = trace.sh s3.sh xml.sh mixml.sh ebucore.sh unicode.sh (6 个)
#     check_PROGRAMS = mil_analyze (测试驱动, 链接 libmediainfo)
#     数据 = MediaArea-RegressionTestingFiles 仓库 (15 个媒体文件)
#     + Release/Example.ogg + MediaAreaXml 的 4 个 XSD schema
#   s3.sh 需要私有的 AWS S3 凭证 (S3_KEY/S3_PASS), 无凭证时按上游
#   设计 exit 77 跳过。
#
# 本包在本地 (OHOS PC) 已完整跑过这 6 个上游测试 (详见 PR 正文),
# CI 离线环境无法下载 RegressionTestingFiles/XSD, 由 test_package 的
# 消费者测试覆盖核心解析路径 (官方 Example.ogg 全管线断言)。

package: libmediainfo/25.07
homepage: "https://mediaarea.net/en/MediaInfo"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - name: trace.sh
    command: "Project/GNU/Library/test/trace.sh"
    description: "15 回归文件 XML+MicroXML 输出 + xmllint 良构校验 + mediatrace/micromediatrace XSD 校验"
    expected: "本地实测通过 (1 文件豁免, 见 PR 正文)"
  - name: s3.sh
    command: "Project/GNU/Library/test/s3.sh"
    description: "S3 远程 URL 读取 (需私有 S3_KEY/S3_PASS 凭证)"
    expected: "无凭证按上游设计 exit 77 跳过"
  - name: xml.sh
    command: "Project/GNU/Library/test/xml.sh"
    description: "15 回归文件 XML 输出 + xmllint 良构校验 + mediainfo_2_0.xsd 校验"
    expected: "本地实测通过 (1 文件豁免, 见 PR 正文)"
  - name: mixml.sh
    command: "Project/GNU/Library/test/mixml.sh"
    description: "MiXml 格式 zlib+base64 压缩往返"
    expected: "本地实测通过"
  - name: ebucore.sh
    command: "Project/GNU/Library/test/ebucore.sh"
    description: "EBUCore 1.5/1.6/1.8ps/1.8sp XML+JSON 输出校验"
    expected: "本地实测通过"
  - name: unicode.sh
    command: "Project/GNU/Library/test/unicode.sh"
    description: "Release/Example.ogg 多语言 Unicode 标签 round-trip"
    expected: "本地实测通过"

test_package_tests:
  - file: test.cpp
    description: |
      Consumer-side functional test: parses the official MediaArea
      Example.ogg regression sample (embedded base64, 4855 bytes) through
      the full MediaInfo pipeline and asserts: container Format=Ogg;
      audio Format=Vorbis; OverallBitRate_Mode=VBR; Unicode title
      round-trip; Inform() XML output contains Audio track; Info_Version
      contains 25.07.
    command: "./mediainfo_test"

assertion_count: 6
