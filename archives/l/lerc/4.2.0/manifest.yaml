  remote:
    - "pending GitCode CI build_and_test.sh run on PR"
  pending:
    - "PR validation / GitCode CI / REL upload"

knowledge_gained:
  - "Esri/lerc is a C++17 project whose install PUBLIC_HEADER is src/LercLib/include/Lerc_c_api.h + Lerc_types.h; the C API is 12 linkable symbols (lerc_computeCompressedSize/lerc_encode/lerc_computeCompressedSizeForVersion/lerc_encodeForVersion/lerc_getBlobInfo/lerc_getDataRanges/lerc_decode/lerc_decodeToDouble plus the _4D variants), and LERCDLL_API is visibility(default) on non-Windows."
  - "The shared lib is libLerc.so.4 (SOVERSION 4); SONAME is libLerc.so.4 and the Conan cpp_info.libs must be ['Lerc'] to match the file name."
  - "Conan cmake target name is LERC::LERC (cmake_file_name=LERC, cmake_target_name=LERC::LERC); pkg-config name is Lerc (lib/pkgconfig/Lerc.pc)."
  - "libLerc.so is a C++ shared lib and carries DT_NEEDED libc++_shared.so; the OHOS consumer loader must be able to resolve it (as verified on-device for 4.1.1)."
