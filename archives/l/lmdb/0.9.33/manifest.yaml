software: lmdb
version: 0.9.33
category: database
description: Lightning Memory-Mapped Database Manager (embedded key-value store)

build_system: makefile
configure_options: []
make_options:
  CC: clang
  XCFLAGS: "-DMDB_USE_ROBUST=0"

dependencies: []
status: partial

notes: |
  LMDB is an ultra-fast, memory-mapped key-value store.
  OpenHarmony musl libc does not support robust mutex, so MDB_USE_ROBUST=0 is required.

artifacts:
  - mdb_stat
  - mdb_copy
  - mdb_dump
  - mdb_load
  - liblmdb.a
  - liblmdb.so
  - lmdb.h
