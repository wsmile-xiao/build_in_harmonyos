software: libfreexl
version: "2.0.0"
status: built
build_system: autotools
build_date: "2026-09-14"
compile_date: "2026-09-14"
conan_ref: "libfreexl/2.0.0"

source:
  url: "https://www.gaia-gis.it/gaia-sins/freexl-2.0.0.tar.gz"
  sha256: "176705f1de58ab7c1eebbf5c6de46ab76fcd8b856508dbd28f5648f7c6e1a7f0"
  tar_format: tar.gz

build:
  cc: clang
  cxx: clang++
  dependencies:
    - expat/2.8.2
    - minizip/1.3.1
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--disable-dependency-tracking"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-linux-ohos"

platform_adaptations:
  - "Replace config.status temporary-directory umask 077 with 022 for HMDFS"
  - "Pass an explicit GNU-compatible build/host triplet because config.guess does not recognize HarmonyOS"
  - "Default to static library to avoid OHOS shared-library runtime path issues"
  - "Resolve expat and minizip headers and libraries through AutotoolsDeps backed by published Conan packages"
  - "Rely on the platform C library for iconv (musl provides iconv in libc, no extra libiconv package)"

patches_applied: []

knowledge_gained:
  - "freexl 2.0.0 requires expat and minizip; iconv resolves against the HarmonyOS platform C library."
  - "Upstream tests live in tests/ and run through Automake TESTS via make check (21 programs in 2.0.0)."
  - "The release config.guess cannot identify HarmonyOS; an explicit GNU-compatible triplet avoids the probe while preserving the OHOS compiler from the Conan profile."

knowledge_ref: []
knowledge_used:
  - "openharmony-compile-agent"
