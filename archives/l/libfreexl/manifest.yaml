software: libfreexl
display: "libfreexl"
description: "C library for extracting data from Excel .xls/.xlsx and ODS spreadsheets"
category: data
homepage: "https://www.gaia-gis.it/fossil/freexl/index"
license: MPL-1.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "显式传入 GNU 兼容 build/host triplet，绕过 config.guess 对 HarmonyOS 的识别失败"
    - "将 configure 中的 umask 077 替换为 umask 022，适配 HMDFS 临时目录权限"
    - "默认静态库交付，避免 OHOS 共享库运行时路径问题"
    - "expat 与 minizip 通过 AutotoolsDeps 注入已发布 Conan 包；iconv 由平台 libc 提供"
  common_dependencies:
    - expat
    - minizip

versions:
  "2.0.0":
    status: built
    build_date: "2026-09-14"
    conan_ref: "libfreexl/2.0.0"
