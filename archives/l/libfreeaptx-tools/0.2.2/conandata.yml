# conandata.yml - libfreeaptx-tools 0.2.2
# 上游: https://github.com/regularhunter/libfreeaptx (维护者 Hunter Wardlaw 本人仓库,
#       Debian 的 debian/watch 里写的 iamthehorker/libfreeaptx 是同一仓库的旧账号名,
#       GitHub 会把 iamthehorker/libfreeaptx 302 到 regularhunter/libfreeaptx,
#       两个 URL 取到的 tar.gz 都是同一个 27871 字节的文件)。
# 注意: archives/l/libfreeaptx/0.2.2/manifest.yaml 里写的
#       https://download.savannah.nongnu.org/releases/libfreeaptx/libfreeaptx-0.2.2.tar.gz
#       已经 404, 该地址已失效, 不能再当上游源用。
sources:
  url: "https://github.com/regularhunter/libfreeaptx/archive/refs/tags/0.2.2.tar.gz"
  sha256: "5ab5ebddf3f2eb7ce47a505b87460b00fc1ede99c70010796d3575ab31ea80bf"

patches:
  - patch_file: "patches/0001-Makefile-static-tools.patch"
    patch_description: >-
      上游 Makefile 把两个工具链到共享库上（$(UTILITIES): $(LIBNAME)，再靠
      `.o:` 后缀规则 $(CC) ... -o $@ $< $(LIBNAME) 收尾），生成的
      freeaptxenc/freeaptxdec 都带 DT_NEEDED libfreeaptx.so.0 且没有 RUNPATH。
      拆出 tools 包后 lib/ 归库包所有、必须删掉，工具就会在加载期直接报
      "cannot open shared object file" 退出 127，连 --version 都答不了。
      上游虽然声明了 STATIC_UTILITIES = $(NAME)enc.static $(NAME)dec.static 和
      `.SUFFIXES: .o .c .static`，却没有配套的 .c.static 规则，
      `make freeaptxenc.static` 只会报 "No rule to make target"。
      本补丁把工具改成直接由 freeaptxenc.o/freeaptxdec.o 加 freeaptx.c 链接，
      二进制自包含；同时把 default / install 裁剪成只出 bin/，
      不再生成、也不再安装 .so、头文件和 pkg-config 文件。
    patch_type: "portability"
  - patch_file: "patches/0002-cli-version-help.patch"
    patch_description: >-
      两个工具都只认 -h/--help 与 --hd 两个选项：--help 打印用法到 stderr 后
      return 1，-h 同样 return 1，任何未识别选项（包括 --version）也掉进
      最后的 else 分支 return 1。平台 L2 冒烟按「先跑 --version，失败再回退
      --help，任一退出 0 即通过」判定，上游两个工具必然 FAIL。
      本补丁补 -V/--version（打印 freeaptxenc/dec 版本号，退出 0），
      并让 -h/--help 以 0 退出。
    patch_type: "portability"