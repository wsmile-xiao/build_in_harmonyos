# test_package/MANIFEST.yml
# libfreeaptx ships no test suite at all: the hand written Makefile has no
# check/test target and the upstream README documents manual sox pipelines
# only, so test_package/test.sh is the only automated verification.
package: libfreeaptx-tools/0.2.2
homepage: "https://github.com/regularhunter/libfreeaptx"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# R34: the test_package must actually execute the tested binaries.
test_package_tests:
  - file: test.sh
    description: >-
      端到端: ①两个工具的 --version/--help 退出码契约（补丁 0002 的回归守卫）；
      ②用 Python 标准库现场生成 4800 字节 24bit 立体声 PCM，freeaptxenc 编成
      aptX（断言 892 字节 = 800 + 92 帧发送缓冲）、freeaptxdec 解回并断言
      长度与输入完全一致、样本被有损改写但平均绝对误差 < 2%；
      ③同样的输入走 --hd，断言 1338 字节 = 1200 + 138 帧发送缓冲并成功解回；
      ④反例：未知选项与非 aptX 数据流都必须以非 0 退出
    command: "bash test.sh"

assertion_count: 16