# 版本级 manifest - libfreeaptx-tools 0.2.2
# 遵循 ARCHIVE-SPEC v2.0

version: "0.2.2"
software: libfreeaptx-tools

# 编译状态: published | built | failed | archived
status: built

build_date: "2026-09-16"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================
source:
  # 与 archives/l/libfreeaptx/0.2.2 同一份上游源码
  # （注意: 库包 manifest 里登记的 savannah 地址已经 404）
  url: "https://github.com/regularhunter/libfreeaptx/archive/refs/tags/0.2.2.tar.gz"
  sha256: "5ab5ebddf3f2eb7ce47a505b87460b00fc1ede99c70010796d3575ab31ea80bf"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: makefile
  # 纯 POSIX Makefile, 没有 configure
  configure_options: []
  make_options:
    - "-j1"                    # R9: 串行构建
    - "CC=<conan conf: tools.build:compiler_executables:c>"
    - 'CFLAGS=-W -Wall -O3 -fPIC'   # 上游 Makefile 里的 CFLAGS 会盖掉环境变量, 只能命令行传
    - "PREFIX=/"               # install 时落到 <package_folder>/bin
  dependencies: []
  bootstrap: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "0001-Makefile-static-tools.patch"
  - "0002-cli-version-help.patch"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "libfreeaptx 的 Makefile 把两个工具链到共享库上: `$(UTILITIES): $(LIBNAME)` 加上 `.o:` 后缀规则 `$(CC) $(CFLAGS) $(LDFLAGS) -o $@ $< $(LIBNAME)`。生成的 freeaptxenc/freeaptxdec 因此带 DT_NEEDED libfreeaptx.so.0 且完全没有 RUNPATH/RPATH。拆 tools 包时会删掉 lib/（归库包所有），工具就会在加载期直接失败：`error while loading shared libraries: libfreeaptx.so.0: cannot open shared object file`，退出码 127，连 --version 都答不出来 —— L2 冒烟必挂"
  - "上游虽然写好了 STATIC_UTILITIES = $(NAME)enc.static $(NAME)dec.static 和 `.SUFFIXES: .o .c .static`，却没有配套的 .c.static 规则：`make freeaptxenc.static` 只会回 'No rule to make target'。也就是说上游的静态工具目标是个从来没写完的空壳，拆包时不能指望它"
  - "正确的修法是改链接规则，让工具直接由 `$@.o` + freeaptx.c 链接（二进制自包含），而不是去补 .c.static / 加 rpath。上游 README 里 `LD_RUN_PATH='$ORIGIN' make` 那套只适合 .so 和工具装在同一目录的场景，对拆分包无效"
  - "上游 Makefile 的 `CFLAGS = -W -Wall -O3` 是普通赋值，会盖掉环境里的 CFLAGS，所以交叉编译需要的额外标志只能以 make 命令行变量的形式传（命令行赋值优先级最高）。把 freeaptx.c 直接编进可执行文件时必须补 -fPIC：目标平台若默认出 PIE，非 PIC 目标文件会在链接期报 R_AARCH64_ADR_PREL_PG_HI21 一类重定位错误"
  - "两个工具的选项解析只认 -h/--help 与 --hd：--help/-h 打印用法后 return 1，任何未识别选项（含 --version）都落进最后的 else 分支 return 1。平台 L2 冒烟按『先 --version，失败再回退 --help，两者都要退出 0』判定，所以必须补 -V/--version 并把 --help 的退出码改成 0"
  - "库包 archives/l/libfreeaptx/0.2.2/manifest.yaml 里登记的源码地址 https://download.savannah.nongnu.org/releases/libfreeaptx/libfreeaptx-0.2.2.tar.gz 现在返回 404。libfreeaptx 的真实上游是维护者 Hunter Wardlaw 本人的仓库 github.com/regularhunter/libfreeaptx（Debian 的 debian/watch 仍写着旧账号名 iamthehorker/libfreeaptx，GitHub 会 302 到 regularhunter，两者 tar.gz 完全相同）"