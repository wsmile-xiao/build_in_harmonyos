software: libks
version: 2.0.11
status: built
build_date: 2026-06-03
build_time: "17:25 - 17:35"
compiler: clang
build_system: cmake

configure_options:
  - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
  - "-DCMAKE_BUILD_TYPE=Release"
  - "-DOPENSSL_ROOT_DIR=/storage/Users/currentUser/usr/local"

dependencies:
  - openssl
  - uuid

# 核心产物
artifacts:
  libks2.so:
    path: ~/usr/local/lib/libks2.so
    size: 192KB (stripped)
    status: installed
    dependencies:
      - libssl.so.1.1
      - libcrypto.so.1.1
      - libuuid.so.1
      - libc.so

# 源码修改
source_modifications:
  - file: cmake/FindLibM.cmake
    reason: "HarmonyOS 中 libm 集成在 libc 中，不需要单独链接"
    change: "创建空的 LIBM::LIBM 接口库"
  - file: CMakeLists.txt
    reason: "HarmonyOS 中 libatomic 不存在"
    change: "移除 atomic 库链接"
  - file: ~/usr/local/lib/pkgconfig/openssl.pc
    reason: "OpenSSL pkg-config 文件指向旧路径"
    change: "修复 prefix 路径为 ~/usr/local"

# 依赖修复
dependency_fixes:
  openssl:
    issue: "pkg-config 文件指向旧路径"
    solution: "修复 openssl.pc, libssl.pc, libcrypto.pc 的 prefix"