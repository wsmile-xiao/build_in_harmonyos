    finding: "全文件无 enable_testing() / add_test() / add_custom_target(check) 调用；仅 find_package(Protobuf) + add_subdirectory(osmpbf) + add_subdirectory(tools)"
  - path: "osmpbf/CMakeLists.txt"
    finding: "仅定义 osmpbf（STATIC）与 osmpbf_shared（SHARED）两个库目标及头文件安装；无任何测试目标注册"
  - path: "tools/CMakeLists.txt"
    finding: "仅定义 osmpbf-outline 演示工具可执行目标；无测试目标注册"
  - path: "源码树结构（v1.6.1 tarball）"
    finding: "无 tests/ 或 test/ 目录；C++ 侧无测试源文件（*test*.cpp 为零）"
  - path: "test.java/crosby/binary/ReadFileTest.java"
    finding: "唯一的 ReadFileTest 系 Java 侧 Maven 测试，验证 Java 库读取 PBF，与本 C++ Conan 包的构建与链接无关，无法接入"
  - conclusion: "上游 1.6.1 C++ 未提供自动化测试；由 test_package 执行消费者视角的真实 API 验证（test.cpp 7 项断言）"

test_package_tests:
  - file: test.cpp
    description: "真实 C++ 消费者：版本宏非空、三常量取值、BlobHeader/Blob/PrimitiveBlock/HeaderBlock 四组 protobuf 序列化往返"
    command: "./test_libosmpbf"
  - file: conanfile.py
    description: "上游无测试审计：确认 C++ 无测试套件后输出 HMBS_UPSTREAM_TEST_RESULT（status=no_tests，discovered/executed/passed/failed=0）"
    command: "python3 conanfile.py test 阶段自动执行"

assertion_count: 7
