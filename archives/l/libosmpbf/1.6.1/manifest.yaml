version: "1.6.1"
status: built
build_date: "2026-09-15"

source:
  url: "https://github.com/openstreetmap/OSM-binary/archive/refs/tags/v1.6.1.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux (OHOS only)"
    - "-DProtobuf_DIR=<protobuf>/lib/cmake/protobuf"
    - "-DProtobuf_PROTOC_EXECUTABLE=<protobuf>/bin/protoc"
  dependencies:
    - protobuf/33.6
    - zlib/1.3.1.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 C++ 无任何测试套件（无 enable_testing/add_test，无 tests 目录），按 c10t 先例以 no_tests 审计上报"
  - "制品仓 protobuf 导出 cmake_find_mode=none，需显式注入 Protobuf_DIR/utf8_range_DIR/absl_DIR 与 protoc 路径"
  - "OHOS 下强制 CMAKE_SYSTEM_NAME=Linux（E092 先例），否则 device cmake 无 HarmonyOS 平台模块"
  - "上游同时构建 static osmpbf 与 shared osmpbf_shared，按 shared 选项在 package 阶段二选一"
