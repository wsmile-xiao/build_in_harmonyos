software: libosmpbf
display: "libosmpbf"
description: "C++ library for reading/writing OpenStreetMap PBF files"
category: data
homepage: "https://github.com/openstreetmap/OSM-binary"
license: LGPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS 下强制 CMAKE_SYSTEM_NAME=Linux（device cmake 无 HarmonyOS 平台模块）"
    - "制品仓 protobuf 需显式注入 Protobuf_DIR 与 protoc 路径（cmake_find_mode=none）"
    - "上游 C++ 无测试套件，以 no_tests 审计上报"
  common_dependencies:
    - protobuf/33.6
    - zlib/1.3.1

versions:
  "1.6.1":
    status: built
    build_date: "2026-09-15"
