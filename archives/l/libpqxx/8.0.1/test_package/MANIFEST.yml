# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libpqxx/8.0.1
homepage: "https://github.com/jtv/libpqxx"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake --build build && ./build/test/runner (ctest -N lists 1 runner target aggregating 298 registered tests)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "cd $HOME/tmp/libpqxx-upstream/build && ctest --output-on-failure && ./test/runner -j 2"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/runner.cxx
    source: libpqxx-8.0.1/test/runner.cxx
    description: "上游测试聚合 runner，链接 test/ 下全部 80 个 .cxx 测试源文件（298 个注册测试函数）；runner 支持按名称运行单个测试"
    command: "./build/test/runner [test_name ...]"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "真实 API 调用测试：版本宏校验、pqxx::to_string/from_string 纯客户端转换、pqxx::separated_list 模板工具、pqxx::connection 错误路径（连接不存在的服务器触发 pqxx::broken_connection，无需 PG 服务端）"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
# test_package 4 组共 9 项断言；上游 runner 298 注册测试中 89 个纯客户端测试可在无 PG 服务端环境通过
assertion_count: 9
