# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS libc++ 15 无 <source_location>：最小 shim（current/file_name/function_name/line/column）即可满足 libpqxx 8.0.1 的诊断用途"
  - "OHOS libc++ 15 incomplete <format>：格式串 '<{}' 模式触发非 constexpr __throw_format_error 导致 consteval 校验失败，4 处字面量加空格规避"
  - "_LIBCPP_ENABLE_EXPERIMENTAL + -lc++experimental（ladybug 先例复用）：打开 <format> 头并补齐 std::format_error 运行时符号"
  - "消费者传递：cpp_info.components[pqxx].defines=['_LIBCPP_ENABLE_EXPERIMENTAL'] + system_libs=['c++experimental']（CMakeDeps 会传播 INTERFACE_COMPILE_DEFINITIONS）"
  - "profile cppstd=17 与 C++20 库冲突：toolchain.blocks['cppstd'].values['cppstd']='20' 覆盖（cache_variables 无效，会被 profile 的 -std=c++17 压制）"
  - "OHOS 运行时 libc++_shared.so 在 /system/lib64，设备 shell LD_LIBRARY_PATH 有分隔符后空格问题：test() 显式 LD_LIBRARY_PATH=/system/lib64（date 3.0.5 先例）"
  - "libpq/18.1 制品仓包为 shared 构建，libpq.a 缺 libpgport/libpgcommon 伴生库不可静态链接：消费者一律动态链接 libpq.so"

