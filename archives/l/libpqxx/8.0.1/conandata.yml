# conandata.yml — libpqxx 8.0.1

sources:
  "8.0.1":
    url: "https://github.com/jtv/libpqxx/archive/refs/tags/8.0.1.tar.gz"
    sha256: "24f878a1b4249035e4b6c07d49351506bf99f88df584d36bf198d58ebf293823"

patches:
  - patch_file: "patches/0001-cmake-config.cmake.patch"
    patch_description: "CMake 配置优先消费 Conan libpq::libpq target（本仓库 libpq/18.1 的 CMakeDeps 命名）；HarmonyOS/OHOS 下启用 _LIBCPP_ENABLE_EXPERIMENTAL 编译宏 + 链接 libc++experimental（std::format 运行时符号所在）"
    patch_type: "portability"
  - patch_file: "patches/0002-src-CMakeLists.txt.patch"
    patch_description: "src/ 库目标链接 conan libpq::libpq（无 conan target 时回退 PostgreSQL::PostgreSQL）"
    patch_type: "portability"
  - patch_file: "patches/0003-test-CMakeLists.txt.patch"
    patch_description: "test/ runner 同样优先 conan libpq::libpq target"
    patch_type: "portability"
  - patch_file: "patches/0004-include-pqxx-array.hxx.patch"
    patch_description: "libc++ 15 incomplete <format> 的 consteval 格式串校验在 '<' 紧邻 '{...}' 时失败（__parse_fill_align 走非 constexpr __throw_format_error 路径）：array.hxx 错误消息字面量 '<{}' 改为 '< {} >'"
    patch_type: "portability"
  - patch_file: "patches/0005-include-pqxx-types.hxx.patch"
    patch_description: "OHOS libc++ 15 无 <source_location> 头：types.hxx 改 include internal/source_location_shim.hxx"
    patch_type: "portability"
  - patch_file: "patches/0006-include-pqxx-internal-source_location_shim.hxx.patch"
    patch_description: "新增 std::source_location 最小回退实现（current/file_name/function_name/line/column 占位值；__cpp_lib_source_location 存在时自动让位真头）"
    patch_type: "portability"
  - patch_file: "patches/0007-test-test_util.cxx.patch"
    patch_description: "test_util.cxx 3 处格式串字面量同 0004 的 '<{}' 规避（binary_cast/vector/map 类型名渲染）"
    patch_type: "portability"
