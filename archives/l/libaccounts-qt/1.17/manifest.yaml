# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.17"

# 软件名
software: "libaccounts-qt"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-02"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitLab）
  url: "https://gitlab.com/accounts-sso/libaccounts-qt/-/archive/VERSION_1.17/libaccounts-qt-VERSION_1.17.tar.gz"

  # 源码校验和
  sha256: "6ed3e976133962c1c88f6c66928ba0d0a17a570843577d31e783dc891659e5d8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DCMAKE_PREFIX_PATH=<qtbase pkg>/lib/cmake"
    - "-DGLIB_GIO_UNIX_INCLUDE_DIR=<glib2 pkg>/include/gio-unix-2.0"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - qtbase/6.11.1.1
    - libaccounts-glib/1.27
    - glib2/2.88.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游仅提供 qmake 构建（accounts-qt.pro），ohpcd 的 qtbase 包不含 qmake；配方改为自写 CMakeLists.txt 经 exports_sources 随包分发（与 1.13 配方同法）"
  - "ohpcd 的 qtbase 根 cpp_info 设了 cmake_find_mode=none：CMakeDeps 不会生成可用的 Qt6 配置，构建侧须用 Qt6_DIR 指向 <qtbase>/lib/cmake/Qt6，消费侧须先把 qtbase 映射到真实目标（set_property cmake_target_name=Qt6::Core）并显式 find_package(Qt6 CONFIG) 后，CMakeDeps 生成的 AccountsQt6 接口才可解析"
  - "conandata.yml 必须用扁平结构（sources.url/sha256）：W3/E017 的 ghfast.top 镜像注入按扁平结构改写文件，用版本键控结构会被改写后抛 KeyError: '1.17'"
  - "get() 必须带 strip_root=True，否则源码解压到子目录，自写 CMakeLists 的 CMAKE_CURRENT_SOURCE_DIR/Accounts 路径落空（configure_file 报找不到 accounts-qt6.pc.in）"
  - "glib2 需以 transitive_headers/transitive_libs 声明，且 gio-unix-2.0 头目录（CMakeDeps 未导出）须显式传给 CMake"
  - "上游测试为 QtTest 套件，本地实测 4/36 通过，其余 32 项因沙箱无 accounts DB/D-Bus 服务失败（环境所致，非库缺陷），未接入 build()"
