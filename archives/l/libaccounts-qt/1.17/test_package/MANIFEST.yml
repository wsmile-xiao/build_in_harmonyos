# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libaccounts-qt/1.17
homepage: "https://gitlab.com/accounts-sso/libaccounts-qt"

# 上游测试命令 (qmake 工程, 通过 tests/tests.pro + tests/accountstest.sh 驱动)
upstream_check_command: "cd tests && ./accountstest.sh"

# conanfile.py build() 中未集成上游测试（上游为 qmake 工程，配方改用 CMake
# 仅构建库本体；上游测试在本地实测后记录结果，见 upstream_tests）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tst_libaccounts.cpp
    source: libaccounts-qt-1.17/tests/tst_libaccounts.cpp
    description: "上游 QtTest 单元测试（Manager/Account/Provider/Service/ServiceType/Error），需 libaccounts-glib 账号库与 D-Bus 会话服务"
    command: "./accountstest"
    local_run_result: "36 个测试函数：4 通过 / 32 失败 / 0 崩溃；失败原因均为环境（沙箱内 accounts DB 无法打开：'Error opening accounts DB: unable to open database file'，无 accounts 服务与 D-Bus 服务文件），非库功能缺陷"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libaccounts_qt.cpp
    description: "消费者冒烟测试：Accounts::Error 类型/消息往返 + 拷贝构造 + 默认构造，Accounts::Manager 构造（验证 libaccounts-glib/glib2 依赖链链接）"
    command: "./test_libaccounts_qt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
