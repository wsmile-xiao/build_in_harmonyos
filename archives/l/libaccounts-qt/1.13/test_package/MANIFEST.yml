# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: libaccounts-qt/1.13
homepage: "https://gitlab.com/accounts-sso/libaccounts-qt"

# Upstream test command
upstream_check_command: "make check"

# conanfile.py build() does not integrate upstream tests
upstream_test_in_build: false
upstream_test_command: ""

# Upstream tests (from tests/accountstest.pro)
upstream_tests:
  - file: tests/accountstest/accountstest.cpp
    source: libaccounts-qt-1.13/tests/accountstest/accountstest.cpp
    description: "Accounts unit tests (QtTest-based)"
    command: "./accountstest"

# test_package consumer-side test
test_package_tests:
  - file: test_libaccounts_qt.cpp
    description: "Consumer smoke test - instantiate Accounts::Manager and call accountList()"
    command: "./test_libaccounts_qt"

# Approximate assertion count
assertion_count: 5
