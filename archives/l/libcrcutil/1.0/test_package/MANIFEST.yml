package: "libcrcutil/1.0"
homepage: "https://code.google.com/archive/p/crcutil/"

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

upstream_tests:
  - id: "crcutil-aarch64-functional-suite"
    source: "tests/unittest.cc and tests/unittest.h"
    command: "./crcutil_ut --noperf"
    scenarios: 54
    description: "All AArch64-applicable upstream functional scenarios; counted from the 54 distinct Functional test of log entries."

test_package_tests:
  - id: "installed-library-consumer"
    source: "test_libcrcutil.cpp"
    command: "./test_libcrcutil"
    description: "Calls the packaged CRC API for metadata, known-vector, incremental, and rolling CRC checks."
  - id: "installed-library-crc32c-vectors"
    source: "test_vectors.cpp"
    command: "./test_vectors"
    scenarios: 45
    description: "Checks 45 deterministic, independently expected CRC32C vectors through the installed public API."
  - id: "ohos-aarch64-portable-fallback"
    source: "test_ohos.cpp"
    command: "./test_ohos"
    description: "HarmonyOS-specific test that requires OHOS AArch64 macros, rejects x86 SSE4.2 availability, and validates the portable CRC32C path."

test_counting:
  upstream_independent_total: 100
  upstream_target_applicable_total: 54
  integration_independent_total: 46
  harmonyos_specific_total: 1
  adapted_independent_total: 101
  internal_algorithm_assertions_counted_as_cases: false
  performance_benchmarks_counted_as_cases: false

execution:
  status: "pass"
  upstream_passed: 100
  upstream_target_applicable_passed: 54
  integration_passed: 46
  harmonyos_specific_passed: 1

assertion_count: 56
