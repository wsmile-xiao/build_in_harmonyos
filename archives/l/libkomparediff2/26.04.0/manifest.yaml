knowledge_gained:
  - "libkomparediff2 26.04.0 needs Qt6Core/Qt6Widgets, KF6 CoreAddons/Config/XmlGui/I18n and ECM; the upstream KF6KIO dependency spans TWO files: KIO::upUrl() in src/kompareprocess.cpp and the save-path KIO stat/mkdir/file_copy jobs in src/modellist.cpp (Scout briefs claiming a single KIO call site are wrong - modellist.cpp is also compiled into the upstream interactiveDiffTest)."
  - "ecm_generate_qdoc() degrades gracefully without Qt6Tools: ECM 6.26 only prints a status line and skips API-doc generation, no patch needed."
  - "DiffModel::parseDiff() is declared in the public header but has no implementation in the 26.04.0 tarball; consumers must use ModelList::parseAndOpenDiff()/parseDiffOutput() or DiffModel::linesChanged() instead."
  - "KF_SKIP_PO_PROCESSING=ON suppresses ki18n_install(po) catalog generation (verified in ki18n 6.18.0 KF6I18nMacros.cmake.in), so msgfmt is not needed at build time."
