# test_package/MANIFEST.yml
# Upstream and consumer test declaration for libkomparediff2/26.04.0.

package: libkomparediff2/26.04.0
homepage: https://invent.kde.org/libraries/libkomparediff2

upstream_check_command: "ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"

upstream_tests:
  - file: tests/
    source: libkomparediff2-26.04.0/tests/
    description: "libkomparediff2 upstream CTest suite: 2 self-contained entries (libkomparediff2-interactiveDiffTest: DiffModel/Difference parse+edit behavior over embedded patch strings; libkomparediff2-levenshteintest: Levenshtein table primitives). QTEST_GUILESS_MAIN, no external diff binary or display required."
    command: "ctest --output-on-failure"
    condition: "run in the Conan build with BUILD_TESTING=ON (Qt6Test required; QT_QPA_PLATFORM=offscreen)"

test_package_tests:
  - file: test_package/test.cpp
    description: "Consumer smoke creates a DiffModel, applies a programmatic one-line change and checks the Difference type, recreateDiff() round-trip and applied/unapplied bookkeeping."
    command: "conan create (test_package builds and runs test_libkomparediff2)"

assertion_count: 5
