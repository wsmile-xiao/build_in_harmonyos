software: ldap2zone
display: "ldap2zone"
description: "从 LDAP 目录（dnszone schema）生成 DNS zone 文件与 BIND 配置的命令行工具"
category: tool
homepage: "https://salsa.debian.org/debian-edu-pkg-team/ldap2zone"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游是单 C 文件 + 3 行 Makefile（无 configure/install/check 目标）；build() 复述其编译行并从 tools.build:compiler_executables 取 CC（R33），不打手写补丁"
    - "链接 openldap/2.6.7（-lldap -llber）；仅用现代 LDAP API，无需 LDAP_DEPRECATED（与 ldap2dns 的差异点）"
    - "无 make install：package() 直接 copy ldap2zone/ldap2bind 到 bin/，man 手册到 share/man/man1"
    - "上游零测试：build() 做 live R51 审计并打印 HMBS_UPSTREAM_TEST_RESULT（status: no_tests）"
    - "CLI 工具：软件级 commands.json；消费者测试覆盖用法/退出码/URL 校验/ldap2bind 语法"

versions:
  "0.2":
    status: built
    build_date: "2026-09-24"
    conan_ref: "ldap2zone/0.2"
