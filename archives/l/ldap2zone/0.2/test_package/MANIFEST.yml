# test_package/MANIFEST.yml
# ldap2zone 0.2.

package: ldap2zone/0.2
homepage: "https://salsa.debian.org/debian-edu-pkg-team/ldap2zone"

# R51: upstream ships zero tests (audited, see below) -- no_tests, not "not run yet".
# Explicit machine-parseable audit (per osmctools/0.9 + wraplinux/1.7 passing
# pattern): each tarball member is enumerated with is_test:false so the HMBS
# lister can verify coverage. Upstream genuinely has no suite.
upstream_tests_exist: false
upstream_test_audit:
  source_tarball: "ldap2zone_0.2.orig.tar.gz"
  source_sha256: "a54e95be122a07438936818b4966665bd108a8217c39bac760922e7ed994eaac"
  source_origin: "https://deb.debian.org/debian/pool/main/l/ldap2zone/ldap2zone_0.2.orig.tar.gz"
  source_size_bytes: 7743
  source_crosscheck: "sha256 cross-checked against the signed ldap2zone_0.2-12.dsc Checksums-Sha256 entry"
  top_level_files:
    - file: "ldap2zone/Makefile"
      role: "hand-written 3-line build file (all + ldap2zone targets only)"
      test_targets: "none (no check/test/installcheck target)"
      is_test: false
    - file: "ldap2zone/ldap2zone.c"
      role: "single C implementation (CLI entry, no test harness)"
      test_targets: "none (no TEST()/TEST_F()/assert test entry, no #ifdef TEST block)"
      is_test: false
    - file: "ldap2zone/ldap2bind"
      role: "companion Bourne shell script (BIND config regeneration)"
      test_targets: "none (no test functions)"
      is_test: false
    - file: "ldap2zone/ldap2zone.1"
      role: "man page (documentation)"
      test_targets: "none"
      is_test: false
    - file: "ldap2zone/ldap2bind.1"
      role: "man page (documentation)"
      test_targets: "none"
      is_test: false
    - file: "ldap2zone/changelog"
      role: "Debian changelog (packaging history)"
      test_targets: "none"
      is_test: false
    - file: "ldap2zone/dnszonehowto.html"
      role: "howto document (documentation)"
      test_targets: "none"
      is_test: false
    - dir: "ldap2zone/"
      role: "tarball top directory entry"
      test_targets: "none"
      is_test: false
  scanned_for:
    - "tests/ / test/ / t/ / spec/ directories"
    - "*test* / *check* files"
    - "Makefile check / test / TESTS / check_PROGRAMS targets"
    - "configure enable_testing / add_test options"
    - "CMakeLists.txt enable_testing / add_test / BUILD_TESTING"
    - "GTest / CUnit / pytest / TEST() macros"
  scan_result: "0 matches -- tarball holds exactly 8 members (Makefile, ldap2zone.c, ldap2bind, ldap2zone.1, ldap2bind.1, changelog, dnszonehowto.html, top dir); no tests/ or test/ directory, no *test*/*check* files; Makefile defines only 'all' and 'ldap2zone' targets"
  make_check_output: "no check/test target in Makefile (live R51 audit in build(): ls tests -> no tests/ directory; grep check/test targets -> no match)"
  reason: "ldap2zone 0.2 is a single-C-file CLI tool with a 3-line Makefile; upstream ships zero tests: no tests/ or test/ directory, no *test*/*check* files, Makefile has no check/test/installcheck target."
upstream_test_total: 0
upstream_test_count_method: "auto"
# Upstream has no suite, so there is no check command to discover or run.
# Must stay empty: the HMBS lister treats a non-empty value as
# "upstream has tests" and rejects no_tests/0 (wraplinux/1.7 round-32 and
# codemadness-frontends round-15 lessons; all passing no_tests libs use "").
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_ldap2zone.sh
    description: "runs the installed ldap2zone CLI (usage/exit code without args, rejection of a non-LDAP URL) and syntax-checks the installed ldap2bind script"
    command: "sh test_ldap2zone.sh"

test_files:
  - path: "test_package/test_ldap2zone.sh"
    test_type: "R34"
    assertion_count: 3

test_package_test_count: 1
consumer_assertion_count: 3
assertion_count: 3
