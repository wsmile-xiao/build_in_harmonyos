software: ldap2zone
version: "0.2"
status: built
build_date: "2026-09-24"
build_system: makefile (single C file, no configure/install/check targets)
conan_ref: "ldap2zone/0.2"

source:
  url: "https://deb.debian.org/debian/pool/main/l/ldap2zone/ldap2zone_0.2.orig.tar.gz"
  sha256: "a54e95be122a07438936818b4966665bd108a8217c39bac760922e7ed994eaac"
  tar_format: tar.gz

build:
  system: makefile
  build_command: "<cc> -Wall -O2 -I<openldap>/include ldap2zone.c -o ldap2zone -L<openldap>/lib -lldap -llber (upstream Makefile line verbatim, compiler from tools.build:compiler_executables)"
  dependencies:
    - openldap/2.6.7
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "none — upstream ships zero tests (no tests/ dir, no check/test make target; see upstream_test_audit in test_package/MANIFEST.yml)"
  upstream_discovered: 0
  upstream_passed: 0
  upstream_failed: 0
  upstream_note: "R51 audit only (static fact, no execution possible); build() records HMBS_UPSTREAM_TEST_RESULT status no_tests with the live audit trail"
  test_package_passed: 0
  test_package_failed: 0
  test_package_assertions: 3
  execution: "待首轮真机预检回填（本轮仅完成未提交工作树，conan create 尚未运行）"

test_passed: 0
test_failed: 0

patches_applied: []

knowledge_gained:
  - "ldap2zone 上游是单 C 文件 + 3 行 Makefile（无 configure/install/check），直接在 build() 里复述其编译行并注入 CC/-I/-L，可完全避免手写补丁（审查规则 R18 只允许 refresh-patch --auto 生成补丁）"
  - "与 ldap2dns 0.3.1 不同：ldap2zone 只用现代 LDAP API（ldap_initialize/ldap_search_ext/...），OpenLDAP 2.6 头文件无需 LDAP_DEPRECATED 即可声明，无需 -DLDAP_DEPRECATED=1"
  - "CLI 的 argv/URL-scheme 校验发生在 ldap_initialize() 之前，可做零网络消费者测试（无参→Usage/exit 1；非 LDAP URL→Not an LDAP URL/exit 1）"
