  required:
    - libparserutils/0.2.5
    - libwapcaplet/0.4.3
  build: []

patches_applied:
  - patches/0001-standalone-Makefile.patch

test_results:
  type: upstream_tests_passed
  upstream: "passed: 2759/2759 (100%) — 上游数据驱动测试套件全量真跑（本地复刻 testrunner.pl）：8 个测试二进制（csdetect/lex/lex-auto/number/parse/parse-auto/parse2-auto/select/css21）对 55 个数据文件逐个执行全部 PASS。用例数=数据文件内 #data 块 2619 + select #tree 块 140。testrunner.pl（netsurf-buildsystem perl 驱动）本平台无——测试程序本身是独立 C 程序（testutils.h assert 宏，任一断言失败 exit(EXIT_FAILURE)），配方 build() 内 shell 循环逐文件执行并输出 HMBS_UPSTREAM_TEST_RESULT 机器证据。"
  test_package: "passed: 6/6 consumer assertions — 解析内联 CSS 样式表（含 @media screen 查询与 @import 声明）→ select 引擎对 <p> 元素计算 computed style → color == 0xffff0000（#ff0000 规则命中）+ background-color 透明（body 规则不适用于 p，级联 specificity 正确）→ 销毁路径干净。最小 node 查询 handler 单元素桩（NetSurf examples 消费者标准模式）。"
  package_id: "(local conan create, filled by CI)"

platform_adaptations:
  - "顶层 Makefile 替换为 standalone 版（libwapcaplet 0.4.3 / libparserutils 0.2.5 先例）：netsurf-buildsystem 包本平台不可得（官方 git.netsurf-browser.org 域名已 404）"
  - "两阶段构建：宿主 BUILD_CC 编译 gen_parser（css_property_parser_gen.c）由 properties.gen 生成 119 个 autogenerated_*.c 属性解析器（上游 PRE_TARGETS 规则手工复刻）+ 311 个源文件（184 一手 + 119 生成 + 127 select/properties）编入 libcss.a"
  - "补上 netsurf-buildsystem Makefile.clang 注入的 -D_ALIGNED=__attribute__((aligned)) -DSTMTEXPR=1 宏（src/stylesheet.h 的 struct css_rule 声明依赖 _ALIGNED，缺失时链接期 duplicate symbol）"
  - "-Werror 移除（clang 15 兼容，libwapcaplet 先例）"
  - "select/ 侧 autogenerated_{computed,propget,propset}.h 发布 tarball 已预生成，无需 select_generator.py"
  - "R9: make -j1（HMDFS jobserver mkfifo EPERM）"

known_issues:
  - "上游 testrunner.pl 是 perl 驱动，本平台以 shell 循环逐文件复刻（INDEX 语义：对每个套件的数据文件执行测试二进制并计 PASS/FAIL）——用例级结果等价"
