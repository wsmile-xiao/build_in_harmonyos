# test_package/MANIFEST.yml
# 上游官方测试声明文件
#
# 上游测试核验：解包 libcanberra-0.30.tar.xz 后 configure.ac / src/Makefile.am
# 无任何 TESTS / check_PROGRAMS（自动化测试框架不存在）；唯一可执行
# test-canberra 是 noinst 演示程序（无断言，需真实音频后端播放系统声音），
# 不计入自动化测试。故上游自动化测试数 = 0。
#
# 适配后由 consumer 测试覆盖公共 canberra-gtk.h API（broadway GTK3 后端，
# 无需 X11；无头环境下跳过 GTK 运行时部分，符号重定位检查仍执行）。

package: libcanberra-gtk3/0.30
homepage: "http://0pointer.de/lennart/projects/libcanberra/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "none"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游无自动化测试，保持空列表）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: api_surface.c
    description: "libcanberra-gtk3.so 全部导出符号（ca_gtk_context_get[_for_screen]、ca_gtk_proplist_set_for_widget、ca_gtk_play_for_widget、ca_gtk_proplist_set_for_event、ca_gtk_play_for_event、ca_gtk_widget_disable_sounds）强类型活重定位；GTK 可初始化时驱动 ca_gtk_context_get_for_screen 与 widget proplist 助手，无头环境跳过 GTK 运行时检查"
    command: "./libcanberra_gtk3_api_surface"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 12
