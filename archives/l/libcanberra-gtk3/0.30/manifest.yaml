software: libcanberra-gtk3
display: "libcanberra-gtk3"
version: "0.30"
upstream_name: libcanberra
upstream_version: "0.30"
status: built
build_system: autotools
build_date: 2026-09-26
compile_date: 2026-09-26
target_platform: aarch64-unknown-linux-ohos
issue: "开源鸿蒙PC专项积分赛-依赖"

source:
  url: "https://0pointer.de/lennart/projects/libcanberra/libcanberra-0.30.tar.xz"
  sha256: "c2b671e67e0c288a69fc33dc1b6f1b534d07882c2aceed37004bf48c601afa72"
  tar_format: tar.xz
  version_mapping: "Conan libcanberra-gtk3/0.30 maps to upstream libcanberra 0.30; libtool -version-info 1:9:1 yields soname libcanberra-gtk3.so.0 and real file libcanberra-gtk3.so.0.1.9."

build:
  system: autotools
  configure_options:
    - "--enable-shared"
    - "--disable-static"
    - "--with-builtin=null"
    - "--disable-alsa"
    - "--disable-oss"
    - "--disable-pulse"
    - "--disable-gstreamer"
    - "--disable-udev"
    - "--disable-gtk"
    - "--enable-gtk3"
    - "--disable-tdb"
    - "--disable-lynx"
    - "--disable-gtk-doc"
    - "--with-systemdsystemunitdir=no"
  dependencies:
    - "libcanberra/0.30"
    - "gtk/3.24.43"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-vorbis-optional.patch (wraps the whole Ogg Vorbis decoder read-vorbis.c behind #if HAVE_VORBIS)"
  - "0002-vorbis-read-sound-file-guards.patch (guards the vorbis fallbacks in read-sound-file.c; WAV kept)"
  - "0003-null-driver-playing.patch (adds the driver_playing() the null driver forgot)"
  - "0004-config.guess-harmonyos.patch (config.guess recognizes HarmonyOS and emits aarch64-unknown-linux-ohos)"
  - "0005-config.sub-ohos.patch (config.sub accepts linux-ohos and canonicalizes to aarch64-unknown-linux-ohos)"
  - "0006-configure-ltdl.patch (neutralizes configure's hard libltdl gate)"
  - "0007-gtk3-broadway-no-x11.patch (drops x11/gdk-3.0 from the GTK3 pkg-config probe and guards all X11 includes/calls behind GDK_WINDOWING_X11)"

validation:
  local:
    - "Python AST syntax check passed for conanfile.py and test_package/conanfile.py"
    - "YAML parsing passed for conandata.yml, manifest.yaml, and test_package/MANIFEST.yml"
    - "L0 static gate checks passed"
    - "official source sha256 verified locally"
    - "test_package links libcanberra-gtk3::libcanberra-gtk3 and verifies every public symbol in canberra-gtk.h via strong-typed relocation; GTK runtime checks run when gtk_init_check succeeds"
  remote:
    - "pending GitCode CI build_and_test.sh run on PR"
  pending:
    - "PR validation / GitCode CI / REL upload"

knowledge_gained:
  - "libcanberra-gtk3 is the GTK3 binding of libcanberra; the core library is provided by libcanberra/0.30 and this package ships only the GTK3 artifacts (libcanberra-gtk3.so.1, the GTK3 module, canberra-gtk.h, libcanberra-gtk3.pc)."
  - "Upstream configure.ac hard-requires x11 and a separate gdk-3.0 module in the GTK3 pkg-config probe, and the GTK3 sources include <gdk/gdkx.h>/<X11/Xatom.h> and call XGetWindowProperty/GDK_WINDOW_ID unconditionally. The ohpcd gtk/3.24.43 package is broadway-only (GDK_WINDOWING_X11 undefined) and ships a single gtk+-3.0 module (no gdk-3.0), so patch 0007 removes x11/gdk-3.0 from the probe and guards every X11 include and X11-only code path behind #ifdef GDK_WINDOWING_X11."
  - "The libcanberra-gtk3.pc.in fix drops -lX11 and uses the published core pc name (Requires: canberra gtk+-3.0, Libs: -lcanberra) so pkg-config consumers resolve libcanberra via the libcanberra/0.30 package."
  - "The GTK3 library is built against the build-tree core libcanberra.la (link-time dependency) but only the GTK3 artifacts are packaged, mirroring the libportal-gtk3 pattern; core libcanberra.so belongs to libcanberra/0.30."
  - "OHOS configure runs in cross-compiling mode (--host=aarch64-linux-ohos) under /system/bin/sh with the config.guess/config.sub HarmonyOS patches and the umask 022 rewrite, following the CI-verified libcanberra/0.30 pattern."
