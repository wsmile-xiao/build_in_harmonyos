sources:
  "0.30":
    url: "https://0pointer.de/lennart/projects/libcanberra/libcanberra-0.30.tar.xz"
    sha256: "c2b671e67e0c288a69fc33dc1b6f1b534d07882c2aceed37004bf48c601afa72"
patches:
  - patch_file: "patches/0001-vorbis-optional.patch"
    patch_description: "Guard read-vorbis.c behind HAVE_VORBIS so libvorbis/libogg become optional"
    patch_type: "portability"
  - patch_file: "patches/0002-vorbis-read-sound-file-guards.patch"
    patch_description: "Guard the vorbis fallback paths in read-sound-file.c behind HAVE_VORBIS"
    patch_type: "portability"
  - patch_file: "patches/0003-null-driver-playing.patch"
    patch_description: "Add the missing driver_playing() to the null driver for --with-builtin=null"
    patch_type: "bugfix"
  - patch_file: "patches/0004-config.guess-harmonyos.patch"
    patch_description: "Teach config.guess to recognize HarmonyOS (uname -s=HarmonyOS) and emit aarch64-unknown-linux-ohos so configure's build-guess no longer aborts with 'cannot guess build type'"
    patch_type: "portability"
  - patch_file: "patches/0005-config.sub-ohos.patch"
    patch_description: "Accept linux-ohos in config.sub so --host=aarch64-linux-ohos canonicalizes to aarch64-unknown-linux-ohos"
    patch_type: "portability"
  - patch_file: "patches/0006-configure-ltdl.patch"
    patch_description: "Neutralize configure's hard libltdl gate (LIBLTDL empty no longer aborts) since --with-builtin=null disables BUILTIN_DSO and never links $(LIBLTDL)"
    patch_type: "portability"
  - patch_file: "patches/0007-gtk3-broadway-no-x11.patch"
    patch_description: "Drop the hard X11/gdk-3.0 pkg-config requirements from the GTK3 probe (the ohpcd gtk/3.24.43 package ships a single gtk+-3.0 module, no separate gdk-3.0) and guard all X11-only includes/calls behind GDK_WINDOWING_X11 so libcanberra-gtk3 builds against the broadway GTK3 stack (no X11)"
    patch_type: "portability"
