package: libmeshb/8.02
homepage: "https://github.com/LoicMarechal/libMeshb"

# 上游测试声明
# v8.02 release tarball 顶层包含 testing/ 目录（7.80 无），CMakeLists.txt
# 在 WITH_GMF_CTEST=ON 时 add_subdirectory(testing)，注册 9 个 ctest 用例：
#   test_libmeshb / test_libmeshb_HO / test_libmeshb_block /
#   test_libmeshb_p2_sol / test_polyhedra / test_libmeshb_sol / mesh2poly
#   + Fortran 门控 2 个（test_libmeshb_block_f77 / test_libmeshb_f77，
#     需 CMAKE_Fortran_COMPILER，OHOS clang 工具链无 Fortran 编译器不注册）。
# 故当前 OHOS 配置下可注册上游 ctest 用例 N_ctest = 7（Fortran 2 个未实例化）。
upstream_check_command: "ctest -N（WITH_GMF_CTEST=ON 时注册）"
upstream_test_in_build: true
upstream_test_command: "ctest"

upstream_tests:
  - name: test_libmeshb
    source: testing/CMakeLists.txt (add_test)
  - name: test_libmeshb_HO
    source: testing/CMakeLists.txt (add_test)
  - name: test_libmeshb_block
    source: testing/CMakeLists.txt (add_test)
  - name: test_libmeshb_p2_sol
    source: testing/CMakeLists.txt (add_test)
  - name: test_polyhedra
    source: testing/CMakeLists.txt (add_test)
  - name: test_libmeshb_sol
    source: testing/CMakeLists.txt (add_test)
  - name: mesh2poly
    source: testing/CMakeLists.txt (add_test)
  - name: test_libmeshb_block_f77
    source: testing/CMakeLists.txt (add_test, Fortran 门控)
  - name: test_libmeshb_f77
    source: testing/CMakeLists.txt (add_test, Fortran 门控)

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libmeshb_consumer.c
    description: "消费者测试：写入 2 顶点 + 1 边的 Meshb.8 网格并回读，断言版本/维度/关键字计数与数值"
    command: "./test_libmeshb_consumer"
  - file: test_libmeshb_ohos.c
    description: "鸿蒙专项测试：同一 3 顶点 + 1 三角形网格以 ASCII(.mesh) 与 binary(.meshb) 双格式写入并回读，断言版本/维度/关键字计数/坐标与引用值"
    command: "./test_libmeshb_ohos"

# 测试断言总数 (CHECK 宏计数，运行期输出；逐测试分别计数)
assertion_count:
  test_libmeshb_consumer: 9
  test_libmeshb_ohos: 22
  total: 31
