package: libmeshb/7.80
homepage: "https://github.com/LoicMarechal/libMeshb"

# 上游测试声明
# 清点证据（v7.80 release tarball 顶层）：
#   tar -tzf libmeshb-7.80.tar.gz | sed 's|^[^/]*/||' | cut -d/ -f1 | sort -u
#   -> .gitignore CMakeLists.txt Documentation LICENSE.txt README.md
#      _config.yml copyright.txt examples legacy_sources sample_meshes
#      sources todolist.md utilities whatsnew.md
# CMakeLists.txt 的 WITH_GMF_CTEST 开关会 add_subdirectory(testing)，但 release
# tarball 中不存在 testing/ 目录（--enable ctest 即配置失败），故 ctest 路径不可用；
# examples/test_libmeshb*.c 等是示例程序（无 add_test 注册，且读取
# ../sample_meshes/quad.mesh 相对路径），不算注册测试。
# 综上上游静态测试数 N_static = 0。
upstream_check_command: "无（release tarball 无 testing/ 目录，ctest 开关不可用）"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libmeshb_consumer.c
    description: "消费者测试：写入 2 顶点 + 1 边的 Meshb.7 网格并回读，断言版本/维度/关键字计数与数值"
    command: "./test_libmeshb_consumer"

# 测试断言总数 (CHECK 宏计数，运行期输出)
assertion_count: 11
