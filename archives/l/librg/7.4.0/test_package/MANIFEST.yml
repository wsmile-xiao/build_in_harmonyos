# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: librg/7.4.0
homepage: "https://github.com/zpl-c/librg"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# librg 上游无 configure/make check：Makefile 的 test 目标直接编译并运行单元测试
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序：code/tests/unit.c（zpl tester 框架，89 个 IT 用例）
upstream_tests:
  - file: code/tests/unit.c
    source: librg-7.4.0/code/tests/unit.c
    description: "librg 上游单元测试 (zpl tester)：entity 8 + general 20 + packing 35 + query 26 = 89 个 IT 用例"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证, R34 实质调用 librg API)
test_package_tests:
  - file: test.c
    description: "消费者测试：LIBRG_IMPL 聚合实现 + world/entity/query/packing 往返断言"
    command: "./test_librg"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20