package: libsvg-cairo/0.1.6
homepage: "https://cairographics.org/"

upstream_check_command: "make -n check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_tests_note: >-
  Upstream libsvg-cairo 0.1.6 (2005 snapshot) ships no test suite: no
  test/ directory, no examples/, no check_PROGRAMS in any Makefile.am,
  no CI of its own. `make -n check` resolves to Automake's default
  empty check target (nothing to run), so there is no upstream test to
  integrate into build().

test_package_tests:
  - file: test_package.c
    description: >-
      Consumer parses an in-source SVG fixture string with
      svg_cairo_parse_buffer, queries document size via
      svg_cairo_get_size, renders onto a pure headless cairo image
      surface (cairo_image_surface_create_for_data + svg_cairo_render),
      asserts deterministic pixel changes via
      cairo_image_surface_get_data (black center, white corner,
      strictly more non-zero bytes after render), rejects a malformed
      SVG with a non-success status, and destroys the context.
    command: "./test_package"

harmonyos_specific_tests:
  - file: test_ohos.sh
    description: >-
      OHOS-specific artifact-level test on HarmonyOS PC (aarch64).
      Takes the FINAL conan package's static archive (libsvg-cairo.a
      from the package_folder in the conan cache, not sources or the
      build tree) as input: verifies the archive directly (ar archive
      magic, non-empty, member extraction, each member an ELF64
      little-endian AArch64 relocatable object), then links consumer
      ELF artifacts from it — a derived shared library
      libsvg-cairo-ohos.so.0 (--whole-archive, with static
      libsvg.a/libjpeg.a deps bundled in) and a consumer executable —
      and runs the OHOS property and runtime checks on those consumer
      artifacts: the derived shared library must be ELF64/AArch64,
      expose a SONAME matching the actual file name, export real
      svg_cairo_* symbols from the package archive (no zero-export
      empty shell), and declare only OHOS-valid NEEDED entries (no
      host paths like /storage, /home, /tmp); the consumer executable
      must be ELF64/AArch64, use the OHOS musl dynamic interpreter
      /lib/ld-musl-aarch64.so.1, carry the OpenHarmony
      .code_signature section, depend on the derived shared library,
      and run a real SVG parse + render flow (ohos_svg_check) on the
      OHOS PC. The static archive itself is never claimed to have
      SONAME/INTERP/code_signature. All assertions count as ONE
      harmonyos test.
    command: "bash test_ohos.sh"
    assertion_count: 14

assertion_count: 16
