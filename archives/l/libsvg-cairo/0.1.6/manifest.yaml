package: libsvg-cairo
version: "0.1.6"
homepage: "https://cairographics.org/"
license: LGPL-2.0-or-later
status: built
build_system: autotools
build_date: "2026-09-03"

source:
  url: "https://cairographics.org/snapshots/libsvg-cairo-0.1.6.tar.gz"
  sha256: "a380be6a78ec2938100ce904363815a94068fca372c666b8cc82aa8711a0215c"

patches_applied:
  - "0001-config-guess-config-sub-ohos.patch"
  - "0002-configure-umask-022.patch"

upstream_tests:
  command: ""
  test_count: 0
  notes: >-
    Upstream libsvg-cairo 0.1.6 ships no test suite: no test/ directory,
    no examples/, no check_PROGRAMS, no CI. `make -n check` runs nothing
    (Automake default empty check target), so 0 upstream tests exist and
    0 are executed.

test_package:
  assertion_count: 16
  description: >-
    Consumer integration test: parses an in-source SVG fixture with
    svg_cairo_parse_buffer, verifies svg_cairo_get_size, renders onto a
    headless cairo image surface, asserts deterministic pixel changes
    through cairo_image_surface_get_data, rejects malformed SVG, and
    destroys the context.

harmonyos_specific_tests:
  count: 1
  description: >-
    OHOS-specific artifact-level test (test_ohos.sh +
    ohos_svg_check.c): takes the FINAL conan package's static archive
    libsvg-cairo.a as input, verifies the archive members'
    architecture (ar archive, ELF64 little-endian AArch64 relocatable
    members), links consumer ELF artifacts from it, and runs the OHOS
    property and runtime checks on the consumer artifacts: derived
    shared library ELF64/AArch64 + SONAME/file consistency + exported
    svg_cairo_* symbols + host-path-free NEEDED; consumer executable
    musl dynamic interpreter /lib/ld-musl-aarch64.so.1 +
    .code_signature section + host-path-free NEEDED, then a real SVG
    parse + render flow on the OHOS PC. The static archive itself has
    no SONAME/INTERP/code_signature — those apply only to the
    consumer-linked ELF artifacts. Fails closed on any assertion.
