  sha256: "a380be6a78ec2938100ce904363815a94068fca372c666b8cc82aa8711a0215c"

patches:
  - patch_file: "patches/0001-config-guess-config-sub-ohos.patch"
    patch_description: "Recognize aarch64-unknown-linux-ohos in the bundled 2005 config.guess/config.sub (HarmonyOS was not a known OS in 2005)"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-umask-022.patch"
    patch_description: "Use umask 022 instead of 077 for the configure mktemp probe directory (HarmonyOS MAC denies 0700 directories created under the Conan build dir)"
    patch_type: "portability"
