# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libscfg/0.2.0
homepage: https://codeberg.org/emersion/libscfg

# libscfg 上游 meson.build 含 test('parse'/'format')，但依赖 meson test runner
# 与 check 库无关（纯自包含 test.c）。CI 走 conan create 消费者测试路径验证。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_scfg.c
    description: "libscfg API 验证: scfg_parse_file 解析 + 指令/参数/子块结构断言 + scfg_format_file round-trip 重新解析一致性 + scfg_block_finish 释放"
    command: "./test_scfg"

# 测试断言总数 (parse 1 + count 1 + d0 name/params/children 4 + d1 name/params/children 7 + d2 2 + format 2 + round-trip 5 + finish 1 = 23)
assertion_count: 23
