software: libscfg
version: "0.2.0"
build_system: meson
status: built
build_date: "2026-08-24"

source:
  url: "https://codeberg.org/emersion/libscfg/releases/download/v0.2.0/libscfg-0.2.0.tar.gz"
  sha256: "18bf24666aa77b12347b6dffeec32b2e7d24719698041c372ab27da80d16150c"
  mirror_urls:
    - "https://deb.debian.org/debian/pool/main/libs/libscfg/libscfg_0.2.0.orig.tar.gz"
  mirror_sha256: "11df0bf3654214ce51c2965819ce741409aa6b5403728669c5a6b8ab55c2e5d3"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--default_library=shared"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libscfg 是零依赖的 C 库，meson 构建，产物 libscfg.so + scfg.h + scfg.pc"
  - "上游 meson.build 设 werror=true，依赖 clang 15 与 -Wno-* 抑制组合，OHOS clang 15 下编译干净无需 patch"
  - "Codeberg 对 CI runner 间歇返回 429（同 libjodycode 4.1.2 实证），必须带 Debian mirror + mirror_sha256"
  - "profile 未设 tools.build:archiver，需在 generate() 向 conan_meson_native.ini 注入 ar（shutil.which 探测，hnp 回退）"
  - "API: scfg_load_file/scfg_store_file/scfg_parse_file/scfg_format_file/scfg_block_finish，结构体 scfg_block/scfg_directive"
