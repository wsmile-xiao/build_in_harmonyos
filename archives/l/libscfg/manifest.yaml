software: libscfg
display: "libscfg"
description: "a small C99 library for parsing and formatting scfg configuration files"
category: library
homepage: "https://codeberg.org/emersion/libscfg"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 项目，零外部依赖，仅依赖 libc"
    - "上游 meson.build 设 werror=true，需 -Wno-error=unused-command-line-argument 抑制 OHOS profile 注入的 -Wl,--code-sign 警告"
    - "产物为 libscfg.so + scfg.h + scfg.pc，pkg-config 名为 scfg"
    - "Codeberg CI 间歇返回 429，conandata.yml 需带 Debian mirror + mirror_sha256"
  common_dependencies: []

versions:
  "0.2.0":
    status: built
    build_date: "2026-08-24"
