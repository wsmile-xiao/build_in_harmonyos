# libqb 2.0.10 编译清单
# 创建于 2026-06-11

software:
  name: libqb
  version: 2.0.10
  category: library
  description: Library providing high performance client server reusable components
  license: LGPL-2.1
  homepage: https://github.com/ClusterLabs/libqb

build:
  system: autotools
  configure_options:
    - --prefix=/storage/Users/currentUser/usr/local
    - --disable-man
    - --disable-examples
  dependencies:
    - name: glib
      version: ">=2.0"
    - name: systemd
      optional: true
  patches: []

status: built
quality:
  g0_clean_build: pending
  g1_binary_integrity: passed
  g2_functionality: warning
  g3_portability: passed
  g4_archive_integrity: passed

artifacts:
  tarball: libqb-2.0.10.tar.xz
  package: libqb-2.0.10-ohos-aarch64.tar.gz

knowledge_gained:
  - config.guess 平台适配: HarmonyOS 系统需要修改 config.guess/config.sub
  - umask + setgid 目录权限问题: 使用 umask 077 在 setgid 目录下创建子目录会导致权限问题
patches:
  - 0001-config.guess-harmonyos.patch
  - 0002-config.sub-harmonyos.patch
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - --disable-man