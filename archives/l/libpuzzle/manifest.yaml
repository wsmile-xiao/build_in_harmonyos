software: libpuzzle
display: "libpuzzle"
description: "感知图像哈希库，快速找出视觉相似的图片，附 puzzle-diff 工具"
category: gfx
homepage: "https://github.com/jedisct1/libpuzzle"
license: ISC
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 移植，无 config.guess/config.sub 补丁需求"
    - "依赖带 JPEG 支持的 gd/2.3.3.1（上游回归测试全部加载 JPG）"
    - "上游 regress 缺夹具时 exit(0)：配方校验夹具尺寸防假 PASS"
  common_dependencies:
    - gd

versions:
  "0.11":
    status: built
    build_date: "2026-09-18"
    notes: >-
      首次适配。C 库（puzzle.h）+ puzzle-diff CLI。
      build() 执行上游 make check（3 regress）并显式重跑取证；
      test_package 用 gd 现场生成 PNG 做 6 个消费者用例 + 1 个 CLI 用例。
