version: "0.11"
software: libpuzzle
status: built
build_date: "2026-09-18"
build_system: autotools

verification:
  device: "HarmonyOS PC aarch64 (HMBS preflight, pending evidence)"
  conan_create: "pending HMBS preflight"
  test_package: "pending HMBS preflight"
  upstream_tests: "make check, 3 regress binaries (regress_1/2/3)"

source:
  url: "https://download.pureftpd.org/pub/libpuzzle/releases/libpuzzle-0.11.tar.gz"
  sha256: "381e774d0434ac897f3a301a62d3e6647f4cfdd5fdd1bda0c9f10ca1f95c0369"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/"
    - "--build=x86_64-pc-linux-gnu, no --host (OHOS only: 2008 scripts know neither HarmonyOS nor aarch64; host defaults to build -> native)"
  dependencies:
    - "gd/2.3.3.1"
  dependency_note: >-
    gd/2.3.3.1 provides the JPEG/PNG/GIF decoding used by
    puzzle_fill_cvec_from_file and by all 3 regress fixtures.
    gd/2.3.3 is --without-jpeg: with it every regress test would
    exit(0) on unloadable JPGs (fake PASS), so it is not usable here.
  umask_fix: "conanfile.py build() conditional replace: configure umask 077 -> 022 (OHOS temp dir write failure, E011 precedent)"

patches_applied: []

knowledge_gained:
  - "libpuzzle 0.11 configure has no AC_CANONICAL_HOST: no config.guess/config.sub patch needed"
  - "upstream regress tests exit(0) on missing fixtures: build() asserts fixture sizes before trusting PASS"
  - "gdlib-config is not shipped by the gd conan package; AC_CHECK_LIB probe passes via AutotoolsDeps LIBS"
