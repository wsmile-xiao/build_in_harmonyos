test_package_tests:
  - file: test.c
    description: "Consumer test: nih_alloc/nih_string/nih_list (3 checks)"
    command: "./test_libnih"
  - file: conanfile.py (test)
    description: "nih-dbus-tool --help smoke test (1 check)"
    command: "nih-dbus-tool --help"

assertion_count: 4

upstream_test_count: 41
upstream_test_total: 41
upstream_test_count_method: autotools_tests
upstream_test_skipped_reasons: |
  No skips expected: all 41 TESTS programs are self-contained C unit
  tests with no network or display dependency. Suite runs via
  `make check` in conanfile.py build(); counts parsed from the automake
  TOTAL/PASS/FAIL summary into HMBS_UPSTREAM_TEST_RESULT.
