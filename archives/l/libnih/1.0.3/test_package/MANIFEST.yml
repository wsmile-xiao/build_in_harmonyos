package: libnih/1.0.3
homepage: "https://launchpad.net/libnih"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# Upstream suite: 41 automake TESTS programs.
# nih/ 17: test_alloc, test_string, test_list, test_hash, test_tree,
#   test_timer, test_signal, test_child, test_io, test_file, test_watch,
#   test_main, test_option, test_command, test_config, test_logging,
#   test_error.
# nih-dbus/ 7: test_dbus_error, test_dbus_connection, test_dbus_message,
#   test_dbus_object, test_dbus_pending_data, test_dbus_proxy,
#   test_dbus_util.
# nih-dbus-tool/ 17: test_main, test_symbol, test_indent, test_type,
#   test_marshal, test_demarshal, test_node, test_interface, test_method,
#   test_signal, test_property, test_argument, test_annotation, test_parse,
#   test_output, test_com.netsplit.Nih.Test_object,
#   test_com.netsplit.Nih.Test_proxy.
# Source: nih/Makefile.am + nih-dbus/Makefile.am + nih-dbus-tool/Makefile.am
# (each lists TESTS / check_PROGRAMS explicitly).
