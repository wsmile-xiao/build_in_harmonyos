# test_package/MANIFEST.yml — libobjc 16.1.1
# 上游测试为 GCC objc.dg (DejaGNU)，需要 DejaGNU + Objective-C 前端，
# 在 HarmonyOS PC 隔离 job 上不现实，故 upstream_test_in_build=false，
# 消费者验证由 test_package 的 runtime API 测试承担。

package: libobjc/16.1.1
homepage: "https://gcc.gnu.org/"

upstream_check_command: "make check-target-libobjc (DejaGNU; not run on OHOS)"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_objc.c
    description: "消费者测试: 链接 libobjc 并调用 modern GNU runtime API(sel_registerName/sel_getName/objc_getClass/class_getName/objc_getClassList/class_createInstance/object_dispose), 全部断言通过返回 0"
    command: "./test_libobjc"

assertion_count: 8
