# 版本级 manifest — libobjc 16.1.1
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "16.1.1"

# 软件名
software: "libobjc"

# 编译状态
# published | built | failed | archived
status: pending

# 编译日期（YYYY-MM-DD）
build_date: ""
build_system: "autotools-custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  # libobjc 无独立 tarball，从 GCC 16 源码树构建；16.1.1 无官方 tarball，
  # 采用同系列最接近的官方 release gcc-16.1.0
  url: "https://ftp.gnu.org/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz"

  # 源码校验和
  sha256: "50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools-custom

  # 配置选项列表
  configure_options:
    - "--enable-languages=c,objc"
    - "--disable-bootstrap"
    - "--disable-multilib"
    - "--disable-nls"
    - "--without-isl"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "bundled gmp/6.3.0"
    - "bundled mpfr/4.2.2"
    - "bundled mpc/1.3.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 注: 无 upstream patch 文件; OHOS 兼容变换在 files/prepare_ohos_sources.py
#     中于 source() 阶段应用 (config.sub triplet 注入 + umask 修复 +
#     gcc/config.gcc aarch64 musl/ohos 映射)

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libobjc 无独立上游 tarball，必须从 GCC 完整源码树构建 libobjc 子库"
  - "libobjc 16.1.1 对应 GCC 16.1.1；GCC 官方 ftp 无 gcc-16.1.1.tar.xz，采用同系列 gcc-16.1.0 作为可复现源码源"
  - "GCC 16 前端为 C++ 实现，构建需要 clang + clang++"
  - "libobjc 目标仅在 --enable-languages 包含 objc 时启用；构建依赖 gcc/runtime-info.h(all-gcc 生成) 与 libgcc"
  - "GCC 16 的 GMP/MPFR/MPC 版本为 6.3.0 / 4.2.2 / 1.3.1 (download_prerequisites)"
  - "gcc/config.gcc 的 aarch64 musl 块在 GCC 16 中可能漂移，OHOS 映射需真机验证后确认"
