# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmysofa-tools/1.3.2
homepage: "https://github.com/hoene/libmysofa"

# 上游测试命令 (cmake 工程，测试通过 ctest 执行)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (CMakeLists.txt 注册的 ctest 用例)
# 43 项 ctest = 40 项数据用例 (3 直跑 mysofa2json + 5 compareIgnoreNew
#            + 11 compare.sh + 21 fail-issue notcrashed) + 3 个 CUnit 二进制
#            (external/internal/multithread)
# 实测: 43/43 全部原生 Passed (reports/upstream-ctest.log, CTEST_RC=0)。
# 说明: node/V8 在 OHOS musl 上必崩溃 (Signal 5)，16 项 JSON 比对测试的
# node 调用无法执行；补丁 0005 以语义逐条等价的 python 比对器
# (tests/json_diff_ohos.py，精确复刻 json-diff.js / json-diffIgnoreNew.js
# 的容差 0.05 与忽略语义) 替换 node 调用，并把软链 .sofa 输入解析为实体
# 路径 (OHOS 沙箱对打包二进制 deny open(2) symlink)。替换后 43 项全绿。
# 历史: 替换前 27 项原生通过、16 项环境失败 (node 崩溃 15 + 软链 EACCES 1)，
# 当时已用独立等价比对器交叉验证 16/16 EQUAL (reports/upstream-pycompare.log)。
# 证据: reports/upstream-ctest.log（43/43 全绿版）
upstream_tests:
  - file: external.c
    source: libmysofa-1.3.2/src/tests/external.c
    description: "CUnit 外部 API 测试 (13 用例)"
    command: "./external"
  - file: internal.c
    source: libmysofa-1.3.2/src/tests/internal.c
    description: "CUnit 内部实现测试 (2 用例)"
    command: "./internal"
  - file: multithread.c
    source: libmysofa-1.3.2/src/tests/multithread.c
    description: "多线程并发 HRTF 读取测试 (20 线程)"
    command: "./multithread"
  - file: sofa2json.c
    source: libmysofa-1.3.2/src/tests/sofa2json.c
    description: "mysofa2json 工具 + fail-issue 崩溃安全用例 + JSON 比对用例"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: 真实打开 data/testfile.sofa 并获取 HRTF 滤波器 (有限值断言)"
    command: "./test_libmysofa"
  - file: ohos_special_test.c
    description: "HarmonyOS 专项测试: 坐标往返/滤波器有限值/minphase+resample/多线程并发"
    command: "./ohos_special_test"
  - file: "(ctest: ohos_tool_mysofa2json)"
    description: "新增 HarmonyOS 消费者用例: 直接驱动打包出的 mysofa2json 工具解码真实 SOFA 并校验 JSON 输出 (M/Dimensions 键)"
    command: "ctest -R ohos_tool_mysofa2json"
