version: 1.3.2
status: published
build_date: '2026-09-16'
source:
  url: https://github.com/hoene/libmysofa/archive/refs/tags/v1.3.2.tar.gz
  sha256: 6c5224562895977e87698a64cb7031361803d136057bba35ed4979b69ab4ba76
  tar_format: tar.gz
build:
  system: cmake
  generator: Ninja
  configure_options:
  - -DCMAKE_BUILD_TYPE=Release
  - -DBUILD_SHARED_LIBS=OFF
  - -DBUILD_STATIC_LIBS=ON
  - -DBUILD_TESTS=OFF
  dependencies:
  - zlib/1.3.1
  cc: clang
  cxx: clang++
patches_applied:
- patches/0001-src-CMakeLists-install-tool-without-tests.patch
- patches/0002-src-tests-easy.c.patch
- patches/0003-src-tests-multithread.c.patch
- patches/0004-top-CMakeLists-min-version.patch
- patches/0005-tests-json-diff-python-comparator.patch
knowledge_gained:
- "OHOS /tmp 只读，测试临时文件需改用工作目录相对路径"  # knowledge_ref: knowledge/drafts/DRAFT-rjj666-libmysofa-tmp-readonly-test-workdir.kv
- "OHOS musl 无 pthread_cancel，需以标志位+pthread_join 等价替换"  # knowledge_ref: knowledge/drafts/DRAFT-rjj666-libmysofa-musl-pthread-cancel-flag-join.kv
- "上游 mysofa2json 目标藏在 BUILD_TESTS 块内，-tools 交付物需将其移出守卫"  # knowledge_ref: knowledge/drafts/DRAFT-rjj666-libmysofa-tools-target-build-tests-guard.kv
- "顶层 cmake_minimum_required(2.8.12) 低于 CMake 兼容线，toolchain 变量注入无效，须补丁升级到 3.5"  # knowledge_ref: knowledge/drafts/DRAFT-rjj666-libmysofa-cmake-min-version-toolchain-inject.kv
- "conanfile 需显式 Ninja 生成器（tools.cmake.cmaketoolchain:generator），且 define 须先于 CMakeToolchain 构造"  # knowledge_ref: knowledge/drafts/DRAFT-rjj666-libmysofa-ninja-generator-define-timing.kv
- "node/V8 在 OHOS musl 必崩溃（Signal 5），node 依赖型测试需以语义等价的 python 比对器替换"  # knowledge_ref: knowledge/drafts/DRAFT-rjj666-libmysofa-node-v8-musl-signal5-python-comparator.kv
- "OHOS 沙箱对打包二进制 deny open(2) symlink，测试脚本须先解析软链为实体路径"  # knowledge_ref: knowledge/drafts/DRAFT-rjj666-libmysofa-packaged-bin-symlink-deny-resolve.kv
