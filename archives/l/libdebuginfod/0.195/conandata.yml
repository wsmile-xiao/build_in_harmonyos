sources:
  url: "https://sourceware.org/elfutils/ftp/0.195/elfutils-0.195.tar.bz2"
  sha256: "37629fdf7f1f3dc2818e138fca2b8094177d6c2d0f701d3bb650a561218dc026"
patches:
  "0.195":
    - patch_file: "patches/0001-threadlib-conditional-error-h.patch"
      patch_description: "src/threadlib.c 无条件 include error.h;musl 无该头,改走上游既有的条件分支(与 elfutils/0.195 同源同补丁)"
      patch_type: "portability"
    - patch_file: "patches/0003-tests-error-h-musl.patch"
      patch_description: "tests/{eu_search_macros,dwfl-report-offline-memory}.c 引用 musl 不存在的 error.h 且无实际调用,删除死 include(仅测试源)"
      patch_type: "portability"
    - patch_file: "patches/0004-tests-makefile-musl-pthread.patch"
      patch_description: "tests/Makefile.in 剔除 dwfl-proc-attach:该测试用 pthread_cancel,musl 不实现此接口,无法链接(仅测试基建)"
      patch_type: "portability"
    - patch_file: "patches/0002-eu-config-musl-portability.patch"
      patch_description: "lib/eu-config.h:_() 按 ENABLE_NLS 分叉;program_invocation_short_name 别名到 BSD 的 __progname(与 elfutils/0.195 同源同补丁)"
      patch_type: "portability"
