version: "1.1.0.1"
status: built
build_date: "2026-09-03"

source:
  url: "https://gitee.com/openkylin/libkysdk-coreai-speech/repository/archive/upstream/1.1.0.1.tar.gz"
  sha256: "0ad9a41c56107e7aef1996230fe6e9f8585d7b27278e53ffaf86e7aac2732cc5"
  tar_format: tar.gz

build:
  system: cmake
  configure_options: []
  dependencies:
    - glib/2.88.0.1
    - openssl/3.5.6
    - jsoncpp/1.9.8
    - kysdk-ai-common (vendor, upstream 分支)
    - kylin-ai-proto (vendor, upstream 分支)
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmakelists-conan-targets.patch"
  - "0002-kylin-ai-proto-functions-paths.patch"
  - "0003-kysdk-ai-common-install-prefix.patch"
  - "0004-kylin-ai-proto-install-prefix.patch"
  - "0005-jsoncpp-include-prefix.patch"
  - "0006-gio-link-dirs-and-usr-install.patch"

knowledge_gained:
  - "KylinAiProto gdbus 生成宏硬编码 /usr/bin/gdbus-codegen 与 /usr/share/kylin-ai/protocols/gdbus/，需变量化（KYLAI_GDBUS_CODEGEN/KYLAI_GDBUS_PROTOCOL_DIR）并钉死 glib 自带 gdbus-codegen"
  - "私有依赖 kysdk-ai-common/kylin-ai-proto 制品仓无配方，随配方 vendor 构建装入 staging 前缀"
  - "上游 .pc 的 Cflags 硬编码 -I/usr/include/kylin-ai，安装后改写为 staging include 前缀"
  - "上游 5 个测试依赖 pulse 音频后端 + 音频设备 + kylin-ai-runtime AI 服务进程（DBus），OHOS 不可运行（ENABLE_TEST=OFF，MANIFEST 如实申报 0 可运行）"
  - "OHOS 动态链接器要求签名 ELF：llvm-objcopy 移除 .codesign 段后 binary-sign-tool 签名"
