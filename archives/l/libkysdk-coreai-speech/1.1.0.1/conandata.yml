# conandata.yml — libkysdk-coreai-speech 1.1.0.1
# Kylin AI Core Speech SDK（麒麟 AI 子系统语音识别/合成客户端库）
#
# 源码来源：openKylin 官方仓库 gitcode.com/openkylin/libkysdk-coreai-speech，
# tag upstream/1.1.0.1（46bb1fb）；下载经 gitee.com/openkylin 官方镜像归档
# （与 gitcode 同源同一 tag，tarball 内容校验一致）。
#
# 私有依赖（OHOS 制品仓均无配方，随本配方 vendor 构建）：
#   - kysdk-ai-common：kylin-ai/common 公共头 + is_ai_subsystem_inited()
#   - kylin-ai-proto：KylinAiProto cmake 宏（gdbus-codegen 生成 glue）+ 协议 XML
# 下载固定到 commit sha（非分支 ref，供应链可复现；sha256 强校验）：
#   kysdk-ai-common @ 8e1950b94ad0a88203e64cf481d05f90c01cd4d9 (upstream)
#   kylin-ai-proto @ 21784935fe2b4381b14eb78a2e38b9779a3380ac (upstream)

sources:
  speech:
    url: "https://gitee.com/openkylin/libkysdk-coreai-speech/repository/archive/upstream/1.1.0.1.tar.gz"
    sha256: "0ad9a41c56107e7aef1996230fe6e9f8585d7b27278e53ffaf86e7aac2732cc5"
  kysdk-ai-common:
    url: "https://gitee.com/openkylin/kysdk-ai-common/repository/archive/8e1950b94ad0a88203e64cf481d05f90c01cd4d9.tar.gz"
    sha256: "18e57a458a7f5014fbd963d365af9a899069c7780a1e33254fd83e16a80a39cf"
  kylin-ai-proto:
    url: "https://gitee.com/openkylin/kylin-ai-proto/repository/archive/21784935fe2b4381b14eb78a2e38b9779a3380ac.tar.gz"
    sha256: "1cbe75cfd10e8bc37da815419906a28eb6b2a15faab24bafbf81708da27207fc"

patches:
  "1.1.0.1":
    - patch_file: "patches/0001-cmakelists-conan-targets.patch"
      description: "顶层 CMakeLists：OpenSSL/jsoncpp 改走 Conan CMakeDeps CONFIG 目标（openssl::openssl / JsonCpp::JsonCpp）"
    - patch_file: "patches/0002-kylin-ai-proto-functions-paths.patch"
      base_path: "vendor/kylin-ai-proto"
      description: "KylinAiProto gdbus 生成宏：硬编码 /usr/bin/gdbus-codegen 与 /usr/share/kylin-ai/protocols/gdbus/ 改为 ${KYLAI_GDBUS_CODEGEN} / ${KYLAI_GDBUS_PROTOCOL_DIR} 变量"
    - patch_file: "patches/0003-kysdk-ai-common-install-prefix.patch"
      base_path: "vendor/kysdk-ai-common"
      description: "kysdk-ai-common 顶层 CMakeLists：install(DIRECTORY usr/ DESTINATION /usr) 绝对路径写 /usr 越权，改为 DESTINATION ${CMAKE_INSTALL_PREFIX}"
    - patch_file: "patches/0004-kylin-ai-proto-install-prefix.patch"
      base_path: "vendor/kylin-ai-proto"
      description: "kylin-ai-proto 顶层 CMakeLists：install(DIRECTORY protocols/usr/ DESTINATION /usr) 绝对路径写 /usr 越权，改为 DESTINATION ${CMAKE_INSTALL_PREFIX}"
    - patch_file: "patches/0005-jsoncpp-include-prefix.patch"
      description: "src/_audioconfig.h、src/_speechmodelconfig.cpp：jsoncpp 头文件在 include/json/json.h（制品仓 jsoncpp 包布局），#include <jsoncpp/json/json.h> 改为 <json/json.h>"
    - patch_file: "patches/0006-gio-link-dirs-and-usr-install.patch"
      description: "顶层 CMakeLists：① pkg_check_modules(GIO) 后补 link_directories(${GIO_LIBRARY_DIRS})（-L 不传给 lld 则 -lgio-2.0 等找不到，同 ayatana 0004）；② install(DIRECTORY usr/ DESTINATION /usr) 绝对路径越权，改 DESTINATION ${CMAKE_INSTALL_PREFIX}"
    - patch_file: "patches/0007-tests-conan-dep-dirs.patch"
      description: "tests/CMakeLists.txt：jsoncpp/pulse 非 pkg-config 依赖（原始 -l 名），补 include_directories(${JSONCPP_INCLUDE_DIR} ${PULSE_INCLUDE_DIR}) + link_directories(${JSONCPP_LIBRARY_DIR} ${PULSE_LIBRARY_DIR})，支持 ENABLE_TEST=ON 真实构建上游 5 个测试"
    - patch_file: "patches/0008-tests-aiconfig-ohos-stub.patch"
      description: "上游 tests/ 依赖 libkysdk-ai-private 的 ai-config 模块（kyai::config::model::ModelConfig，libkyai-config.so 独立包、OHOS 制品仓未发布）→ CI fatal error 'kylin-ai/private/aiconfig/modelconfig.h' file not found。按生态 ohosstub 模式（libkysdk-applications QGSettings stub 同款）新增 tests/ohosstub/kylin-ai/private/aiconfig/modelconfig.h header-only 内联 stub（枚举/结构体按上游原样，ModelConfig 方法内联、set 存进程内静态表，不链接 libkyai-config；测试仅将模型鉴权/当前模型设置作前置调用无断言），并在 tests/CMakeLists.txt 补 include_directories(${CMAKE_CURRENT_SOURCE_DIR}/ohosstub)；适配修改已在 PR body 上游测试修改说明申报"
    - patch_file: "patches/0009-tests-openssl-conan-target.patch"
      description: "tests/CMakeLists.txt 的 find_package(OpenSSL REQUIRED) 经典模块在 OHOS 无系统 openssl 可寻（conan 的 openssl CONFIG 为小写 openssl-config.cmake），${OPENSSL_INCLUDE_DIR}/${OPENSSL_LIBRARIES} 为空 → tests 重编译 __/src/util.cpp 报 'openssl/bio.h' file not found（CI #60813 实测，0008 aiconfig stub 已生效后暴露）。0001 只改了顶层 CMakeLists，未动 tests。修复：与顶层一致 find_package(openssl CONFIG REQUIRED) + include_directories(${OPENSSL_INCLUDE_DIRS}) + 链接 openssl::openssl"
    - patch_file: "patches/0010-tests-fullpath-libs.patch"
      description: "tests/CMakeLists.txt：jsoncpp/pulse/pulse-simple 由 link_directories 裸名链接改为全路径（${JSONCPP_LIBRARY_DIR}/libjsoncpp.so、${PULSE_LIBRARY_DIR}/libpulse.so、${PULSE_LIBRARY_DIR}/libpulse-simple.so）→ CMake 全路径链接自动把对应目录加入 build RPATH（glib::glib 等 conan 目标即以此加载，CI #60938 实测 CMAKE_BUILD_RPATH 注入未生效、-lpulse 裸名无 auto-RPATH 仍 Error loading shared library libpulse.so.0）"
    - patch_file: "patches/0011-tests-pulse-stub.patch"
      description: "tests/pulse_stub.cpp + tests/CMakeLists.txt：上游 tests/（AudioRecorder/AudioPlayer）依赖 pulse/pulse-simple 音频后端，OHOS 无 PulseAudio 运行时且制品仓 pulseaudio 包不携带传递依赖 libpulsecommon-*.so（加载器又不用可执行文件 RPATH 解析传递依赖，CI #61016/#61095 实测）→ 直接链接 libpulse.so.0 使 5 个测试可执行加载期失败（rc=127）被判非可运行（rule4 0/5）。新增同 API 面 pulse 桩（pa_simple_new 返回 NULL/错误码使音频路径按 OHOS 无音频设备语义优雅降级，麦克风探测模拟可用默认源），CMakeLists SOURCES 加桩、LIBRARIES 移除 libpulse/libpulse-simple 全路径链接；与 0008 aiconfig stub 同模式（未使用 #ifdef __OHOS__）"
    - patch_file: "patches/0012-stop-speaking-null-guard.patch"
      description: "src/coreaispeechserviceproxy.cpp：stopSpeaking 在 proxy_ 为 NULL（AI 服务进程不可达——g_dbus_proxy_call 断言后返回 NULL 且不设置 GError）时解引用 error->message 段错误（test06_Synthesizer 在 0011 桩使其可运行后实测 SIGSEGV）→ 增加 proxy_ == nullptr 守卫直接返回 AISDK_RUNTIME_ERROR，使无服务场景优雅降级"
