# test_package/MANIFEST.yml
# libocxl 1.2.1.

package: libocxl/1.2.1
homepage: https://github.com/OpenPOWERFoundation/libocxl

upstream_tests_exist: true
upstream_test_audit: "unittests/unittests.c runs against virtocxl.c, a FUSE filesystem that emulates an OpenCAPI AFU; it is invoked by 'make test' via sudo and needs libfuse plus /dev/fuse"
upstream_check_command: "make test (builds testobj/unittests, links -lfuse -lpthread, runs under sudo)"
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - name: "unittests (virtocxl FUSE device)"
    path: "unittests/unittests.c"
    description: "read_file_uint / read_file_buf / ioctl error paths against a virtual OCXL device"

test_package_tests:
  - file: test_libocxl.c
    description: "errno-to-string mapping, unknown-value fallback, info string and version, message handler setters, and the failed AFU open paths"
    command: "./libocxl_consumer"

test_files:
  - path: "test_package/test_libocxl.c"
    test_type: "R34"
    assertion_count: 9

test_package_test_count: 1
consumer_assertion_count: 9
assertion_count: 9

# The upstream unit test cannot run on OHOS (no FUSE); the consumer test covers
# the hardware independent API.  Technical reason is reported to the PR.
