software: libocxl
version: "1.2.1"
status: built
build_date: "2026-09-19"
build_system: direct (upstream hand-written Makefile bypassed, same flags)
conan_ref: "libocxl/1.2.1"

source:
  url: "https://deb.debian.org/debian/pool/main/libo/libocxl/libocxl_1.2.1.orig.tar.xz"
  sha256: "583e041a81cc2c5ddf8ba197954a4af8c44312768af5ef14cd363d1cb5e99d29"
  tar_format: tar.xz
ocxl_uapi:
  url: "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/include/uapi/misc/ocxl.h?h=v6.12"
  sha256: "ab973021d23761170adda6e15a4d713e2f83ffe564fd953163823a045669e9f3"

build:
  system: direct
  build_command: "clang -O2 -std=c11 -fPIC -D_FILE_OFFSET_BITS=64 -I src/include -I kernel/include -c src/{afu,internal,irq,mmio,setup}.c && clang -shared -Wl,-soname,libocxl.so.1 -Wl,--version-script,symver.map -o libocxl.so *.o"
  dependencies: []
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "unittests/unittests.c + virtocxl.c (FUSE-emulated OCXL device)"
  upstream_discovered: 1
  upstream_passed: 0
  upstream_failed: 0
  upstream_note: "上游单测依赖 libfuse 与 /dev/fuse（virtocxl 用 FUSE 模拟 AFU）；OHOS 用户态无 FUSE，未运行（技术原因）"
  test_package_passed: 9
  test_package_failed: 0
  test_package_assertions: 9
  execution: "conan create rc=0 + 消费者 9 条断言（errno 字符串/info/失败打开路径）"

test_passed: 9
test_failed: 0

patches_applied: []

knowledge_gained:
  - "libocxl 只有手写 Makefile；Makefile 会在构建时用 wget/curl 下载内核 uapi misc/ocxl.h → 配方改为在 source() 取 pinned 副本（Linux v6.12），构建可复现且离线"
  - "src/libocxl_info.h 由 version.pl（perl）生成，需要 VERSION_MAJOR/MINOR/PATCH 与 CC 环境变量；tarball 无 .git 时 gitHash 为空"
  - "上游单测用 FUSE（virtocxl）模拟 OCXL 设备，OHOS 无 FUSE 无法运行；改为覆盖硬件无关 API：ocxl_err_to_string、ocxl_info、失败打开路径"
  - "注意 OCXL_NO_DEV 未在 setup.c 的 ocxl_err_to_string 中处理，会落到 default 返回 'Unknown error'（上游行为，消费者测试如实断言）"
  - "共享库用上游 symver.map 作为 --version-script（lld 支持），并给出 SONAME libocxl.so.1"
