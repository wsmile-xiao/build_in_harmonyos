# test_package/MANIFEST.yml
# Upstream test declaration file

package: libecoli/0.11.7
homepage: "https://github.com/rjarry/libecoli"

# Upstream test command
upstream_check_command: "meson test -C <builddir>"

# conanfile.py build() method upstream test integration
upstream_test_in_build: true
upstream_test_command: "meson test -v --print-errorlogs --no-rebuild -C <builddir>"

# Upstream test programs (source: test/meson.build, suite 'unit';
# test name = file stem + '_test'; yaml test excluded, see below)
