software: libgxps
# 版本级 manifest
# 文件位置: archives/l/libgxps/0.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.gnome.org/sources/libgxps/0.3/libgxps-0.3.2.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson

  # 配置选项列表
  configure_options:
    - "-Dwith-liblcms2=false"
    - "-Dwith-libjpeg=false"
    - "-Dwith-libtiff=false"
    - "-Denable-test=false"
    - "-Ddisable-introspection=true"

  # 编译依赖列表
  dependencies:
    - glib/2.88.0
    - cairo/1.18.4
    - libarchive/3.7.4
    - freetype/2.14.3
    - openssl/3.5.6
    - lzma/5.6.2
    - bzip2/1.0.8

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "libarchive 依赖 OpenSSL (libcrypto), lzma, bzip2，需要手动链接"
  - "meson 不处理 Libs.private 中的传递依赖"
  - "libpng NEON 符号问题需要使用 --allow-shlib-undefined 绕过"
  - "可选依赖 lcms2/libjpeg/libtiff 可通过 meson 选项禁用"

# ============================================================
# 特殊处理记录
# ============================================================

special_handling:
  link_issues:
    - "手动添加 lzma.a 和 bz2.a 到链接命令"
    - "移除 --no-undefined，添加 --allow-shlib-undefined"
  
  runtime_issues:
    - "xpstopng 存在共享库加载问题，建议静态编译"