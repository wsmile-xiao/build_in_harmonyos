software: libgxps
display: "libgxps"
description: "GNOME XPS document rendering library - GObject based library for handling and rendering XPS documents"
category: document
homepage: "https://gitlab.gnome.org/GNOME/libgxps"
license: LGPL-2.1+
build_system: meson

ohos_adaptation:
  key_points:
    - "需要 glib-2.0, cairo, libarchive 作为必需依赖"
    - "libarchive 需要 OpenSSL, lzma, bzip2 传递依赖"
    - "禁用可选依赖 (lcms2, libjpeg, libtiff)"
    - "需要手动解决 meson 链接依赖传递问题"

versions:
  "0.3.2":
    status: built
    build_date: "2026-05-21"