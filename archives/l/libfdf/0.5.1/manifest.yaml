software: libfdf
version: "0.5.1"
license: BSD-3-Clause
status: built
build_system: cmake
build_date: "2026-09-27"
source:
  url: "https://deb.debian.org/debian/pool/main/libf/libfdf/libfdf_0.5.1.orig.tar.bz2"
  sha256: "31341ab4ba5be67defb6b894bab9390de2b7eeb604d031f2cda65212fc6299f4"
  tar_format: tar.bz2

build:
  system: cmake
  dependencies:
    - "flang-ohos/20.1.0"
  fc: flang
  cxx: none
  artifact: "lib/libfdf.a"
  modules: "include/libfdf/<Flang-version>/*.mod"

patches_applied: []

test_results:
  upstream_test_count: 3
  upstream_test_passed: 3
  upstream_tests:
    - "fdf-sample-test"
    - "fdf-units-test"
    - "fdf-ambiguous-units-test"
  upstream_test_command: "ctest --output-on-failure (executed by cmake.test() in build())"
  test_package_checks: 4
  test_package_passed: 4
  harmonyos_device: "OpenDesk HarmonyOS aarch64; job 20260927-045257-c41459-batch6-libfdf-ci4; upstream CTest 3/3 and consumer API 4/4 passed"

knowledge_gained:
  - "libfdf's CMake project already registers exactly three CTest entries, so the recipe can run upstream tests unchanged in build()."
  - "flang-ohos needs the OHOS SDK sysroot, clang resource directory and SDK AArch64 library directory before it can link the upstream test executables."
  - "Both fdf and fdf_prec module files must be exported, and package_info must expose their compiler-versioned include directory."
