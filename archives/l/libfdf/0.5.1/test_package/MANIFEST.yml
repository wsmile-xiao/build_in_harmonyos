# test_package/MANIFEST.yml
# The upstream project registers exactly three CTest entries. The recipe runs
# them unchanged in build(); this file separately records the consumer test.

package: libfdf/0.5.1
homepage: "https://gitlab.com/siesta-project/libraries/libfdf"

upstream_check_command: "ctest -N && ctest --output-on-failure"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (cmake.test() in recipe build())"
upstream_test_count: 3

upstream_tests:
  - file: tests/CMakeLists.txt
    source: libfdf-0.5.1/tests/CMakeLists.txt
    description: "fdf-sample-test: run fdf-tester; upstream pass regex 'Polar | Enabled'"
    command: "ctest --output-on-failure -R '^fdf-sample-test$'"
  - file: tests/CMakeLists.txt
    source: libfdf-0.5.1/tests/CMakeLists.txt
    description: "fdf-units-test: run test-units; upstream pass regex '472491909'"
    command: "ctest --output-on-failure -R '^fdf-units-test$'"
  - file: tests/CMakeLists.txt
    source: libfdf-0.5.1/tests/CMakeLists.txt
    description: "fdf-ambiguous-units-test: run test-ambiguous-units; upstream pass regex 'Ambiguous'"
    command: "ctest --output-on-failure -R '^fdf-ambiguous-units-test$'"

test_package_tests:
  - file: test_libfdf.f90
    description: "Consumer imports packaged fdf/fdf_prec modules, links libfdf.a, reads integers, physical units, strings and a defined marker"
    command: "./test_libfdf"

consumer_flow_count: 1
# Four explicit assertions in test_libfdf.f90. Upstream CTest's internal
# program output is not counted as test_package assertions.
assertion_count: 4
