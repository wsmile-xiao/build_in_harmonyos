package: lighter/1.1.3
homepage: "https://github.com/mourisl/Lighter"
upstream_test_in_build: false
upstream_tests: []
upstream_test_absence_evidence: "tar tzf lighter_1.1.3.orig.tar.gz has no test/spec/check path and the Makefile targets are all, lighter, main.o, ErrorCorrection.o, GetKmers.o, clean"
test_package_tests:
  - file: "test.sh"
    description: "Runs the packaged lighter CLI in a scratch dir over a plain FASTQ, an invalid-base FASTQ, a gzipped FASTQ and a plain FASTA fixture: asserts the usage banner, Lighter's 12-record FASTQ framing (headers and quality separators counted), that the spectrum statistics leave the substituted read verbatim (Corrected 0 bases), that a read carrying an invalid base is corrected onto the 11x template (Corrected 1 bases, header tagged cor), that gzip input and output round-trip through an independent decompressor, the FASTA record count, and that zlib is resolved inside the ELF."
    command: "./test.sh"
assertion_count: 9
