# 软件级 manifest — libclapper
# 遵循 ARCHIVE-SPEC v3.0

software: libclapper
display: "libclapper"
description: "Clapper 播放库（libclapper-0.0），基于 GStreamer 的媒体播放内核，Clapper 播放器依赖"
category: multimedia
homepage: "https://github.com/Rafostar/clapper"
license: "LGPL-2.1-or-later"
build_system: meson

ohos_adaptation:
  key_points:
    - "Clapper 为单体仓库，含 libclapper 库 / clapper-gtk / clapper-app / gst-plugin；工业级裁剪只需构建核心 clapper 库（-Dclapper=enabled，其余 disabled）"
    - "核心库需 glib/gstreamer/gst-plugins-base；registry 这三者都不带标准 .pc，需在 generate() 手写 .pc wrapper"
    - "gstreamer-audio/tag/pbutils 由 gst-plugins-base 提供，必须显式声明 gst-plugins-base 依赖"
    - "核心库不需要 gst-gl / GTK4 / OpenGL（仅 gst-plugin 的 clappersink GL importer 用到）"
    - "上游所有 feature 依赖为 required:false + meson feature（auto 语义）；显式 disabled 避免引入 libpeas/libsoup3/microdns"
  common_dependencies:
    - glib2/2.88.0
    - gstreamer/1.28.3
    - gst-plugins-base/1.28.3

versions:
  "0.10.0":
    status: built
    build_date: "2026-09-25"
    source_url: "https://github.com/Rafostar/clapper/archive/refs/tags/0.10.0.tar.gz"
