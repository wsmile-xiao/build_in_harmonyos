# conandata.yml — libclapper 0.10.0
# Single source of truth for source URL + SHA256.
#
# The official GitHub archive is slow but reachable as last-resort fallback.
# gh-proxy.com (matching ci/conan/build_and_test.sh's GitHub mirror mapping)
# is placed first for reliable downloads; the official URL is kept last.

sources:
  url:
    - "https://gh-proxy.com/https://github.com/Rafostar/clapper/archive/refs/tags/0.10.0.tar.gz"
    - "https://github.com/Rafostar/clapper/archive/refs/tags/0.10.0.tar.gz"
  sha256: "344c0f20e540a63c6fb44cdd5de88c168ed145bb66c1307e79b2b08124780118"

# vendored meson 构建工具源码：真机 HMBS_BUILD_TOOLS 只提供 cmake/make/ninja/
# python3，无 meson 可执行文件，且 HMBS_PYTHON3 的 site-packages 无 mesonbuild
# （`meson setup` 报 "No module named 'mesonbuild'"）。ohpcd/conancenter 远端亦无
# meson 工具包。采用 libdvdnav/7.0.0 -> astroterm/1.0.9 已验证的 vendored meson
# 方案：下载官方 meson 1.11.2 源码解压到 source_folder/meson-vendor/，build() 时经
# python3 进程内 sys.path.insert 注入调用 mesonmain.main()，完全绕开 PATH 上的
# meson 可执行文件。镜像映射沿用 ci/conan/build_and_test.sh 的 gh-proxy.com 前置。
meson_source:
  url:
    - "https://gh-proxy.com/https://github.com/mesonbuild/meson/releases/download/1.11.2/meson-1.11.2.tar.gz"
    - "https://github.com/mesonbuild/meson/releases/download/1.11.2/meson-1.11.2.tar.gz"
  sha256: "698feae069cef3ecd4d7aaf281d7df359bdfcf555a9a1564383d3b913fa8a736"

patches:
  - patch_file: "patches/0001-gl-handler-skip-when-gstreamer-gl-missing.patch"
    patch_description: "GL handler gracefully skips when gstreamer-gl-1.0 is missing (OHOS has no GL lib)"
    patch_type: "portability"
