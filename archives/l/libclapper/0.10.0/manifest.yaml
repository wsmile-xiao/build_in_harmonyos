# manifest.yaml — libclapper 0.10.0（版本级）
# 遵循 ARCHIVE-SPEC v3.0

version: "0.10.0"

# 编译状态：published | built | failed | archived
status: built

build_date: "2026-09-25"

conan_ref: "libclapper/0.10.0"

source:
  url: "https://github.com/Rafostar/clapper/archive/refs/tags/0.10.0.tar.gz"
  sha256: "344c0f20e540a63c6fb44cdd5de88c168ed145bb66c1307e79b2b08124780118"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dclapper=enabled"
    - "-Dclapper-gtk=disabled"
    - "-Dclapper-app=disabled"
    - "-Dgst-plugin=disabled"
    - "-Dintrospection=disabled"
    - "-Dvapi=disabled"
    - "-Ddoc=false"
    - "-Denhancers-loader=disabled"
    - "-Ddiscoverer=disabled"
    - "-Dmpris=disabled"
    - "-Dserver=disabled"
  dependencies:
    - "glib2/2.88.0"
    - "gstreamer/1.28.3"
    - "gst-plugins-base/1.28.3"
  cc: clang
  cxx: clang++

patches_applied: []

upstream_tests:
  exist: false
  test_count: 0
  audit: "libclapper 0.10.0 源码树的唯一测试位于 src/bin/clapper-app/data 下（appstream/gsettings/desktop 校验），属于 clapper-app 应用组件；本配方只构建核心 clapper 库（clapper-app=disabled），库本身无任何测试。随库一起构建的根 meson.build 不会注册任何 test()。详见 test_package/MANIFEST.yml 的 upstream_test_audit 明细。"

# 上游测试总数口径（hmbs 硬门禁）：库无自动化测试
upstream_test_total: 0
upstream_test_count_method: none

knowledge_gained:
  - "Clapper 单体仓库同时含 libclapper 库 / clapper-gtk / clapper-app / gst-plugin；Meson feature 选项可精确裁剪，只构建核心 clapper 库（-Dclapper-gtk=disabled -Dclapper-app=disabled -Dgst-plugin=disabled -Ddiscoverer/mpris/server=disabled）"
  - "上游这些 feature 都是 required:false 的 dependency + meson feature 组合：缺依赖时仅 subdir_done()，不会报错（auto 语义）；显式 disabled 更省依赖"
  - "gstreamer-audio/tag/pbutils 由 gst-plugins-base 配方提供（libgstaudio/tag/pbutils-1.0）；registry 的 gstreamer/gst-plugins-base 包都不带标准 .pc，需在 generate() 手写 .pc wrapper（同 gstreamer/gst-plugins-base 先例）"
  - "核心 clapper 库不需要 gst-gl / gtk4 / OpenGL（gst-gl 仅在 gst-plugin 的 clappersink GL importer 中用到，本配方不构建该插件）"
