# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libclapper/0.10.0
homepage: "https://github.com/Rafostar/clapper"

# 上游源码审计（hmbs 硬门禁）：libclapper 0.10.0 库无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "src/lib/clapper/（含 gst/ features/ 子目录）"
    reason: "库源码树无 *_test 源文件、无 tests/ 目录；meson.build 对 clapper 库不注册任何 test()。"
  - source: "src/meson.build / 根 meson.build"
    reason: "唯一 test() 位于 src/bin/clapper-app/data/meson.build（appstream/gsettings/desktop 校验），属于 clapper-app 应用组件；本配方 clapper-app=disabled 不构建该组件，库本身无测试。"
  - source: "conanfile.py build() 的 _audit_upstream_tests"
    reason: "conan create 时对真实源码树执行 grep/find 审计，日志保留机器证据。"
  - conclusion: "上游 libclapper 播放库未提供自动化测试套件；由 test_package 执行消费者视角的真实 API 验证（init/版本/对象构造）。"

# 上游检查命令（库无测试，置空）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试总数口径（hmbs 硬门禁）：无测试，计数为 0
upstream_test_total: 0
upstream_test_count_method: none

upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "链接 libclapper-0.0，clapper_init_check 初始化、版本函数 (get_major/minor/micro/version_s)、ClapperMarker 对象构造与 getter 校验（10 断言，无需 GStreamer 插件，可在无头设备确定性执行）"
    command: "./test_clapper"

assertion_count: 10
