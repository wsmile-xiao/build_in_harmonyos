sources:
  url: "https://download.kde.org/stable/release-service/25.12.3/src/libksieve-25.12.3.tar.xz"
  sha256: "4dfde60dfa60f2c6c4c1235acc32f8bd6e2bbe65e419cdae71dd26fea5993e0d"
patches:
  "25.12.3":
    - patch_file: "patches/0001-ohos-optional-webengine.patch"
      patch_description: "Make Qt WebEngineWidgets optional and skip KSieveUi (requires qtwebengine, unavailable for OHOS) so the remaining KSieve/KManageSieve/KSieveCore libs and the parser autotests still build."
      patch_type: "portability"
    - patch_file: "patches/0002-ohos-optional-kio.patch"
      patch_description: "Make KF6KIO optional and skip KManageSieve+KSieveCore when KIO is unavailable (kio/6.18.0 is not yet published to the OHOS remote), so the KSieve parser library, its 2 upstream parser autotests and the consumer test_package still build."
      patch_type: "portability"
    - patch_file: "patches/0003-ohos-optional-pim-textaddons.patch"
      patch_description: "Guard the KDE PIM (KPim6PimCommon/Libkdepim/Mime/IdentityManagementCore/MailTransport/IMAP) and KF6::Text* find_package REQUIRED calls behind if(KF6KIO_FOUND) - they are only consumed by KManageSieve/KSieveCore/KSieveUi which are already skipped - so configure succeeds when the corresponding PIM/ktextaddons recipes are absent from the OHOS remote."
      patch_type: "portability"
    - patch_file: "patches/0004-ohos-optional-printsupport.patch"
      patch_description: "Make Qt6 PrintSupport OPTIONAL alongside WebEngineWidgets (both are only consumed by the KSieveUi editor library, which is skipped when Qt6WebEngineWidgets is absent), so configure succeeds when qtbase-sql-dbus/6.11.1 does not ship the Qt6PrintSupport module."
      patch_type: "portability"
    - patch_file: "patches/0005-ohos-install-parser-headers.patch"
      patch_description: "Install the KSieve parser public headers (parser.h/scriptbuilder.h/error.h/lexer.h/utf8validator.h and the generated ksieve_export.h) under include/KSieve and export $<INSTALL_INTERFACE:include> on the KPim6::KSieve target, so find_package(KPim6KSieve) consumers can compile against the KSieve::Parser API. Upstream only installs libksieve_version.h, which is why this recipe's test_package could not find <KSieve/parser.h>."
      patch_type: "portability"
