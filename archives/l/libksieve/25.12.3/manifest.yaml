software: libksieve
version: "25.12.3"
status: built
build_system: cmake
build_date: "2026-09-26"

source:
  url: "https://download.kde.org/stable/release-service/25.12.3/src/libksieve-25.12.3.tar.xz"
  sha256: "4dfde60dfa60f2c6c4c1235acc32f8bd6e2bbe65e419cdae71dd26fea5993e0d"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_QCH=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
  dependencies:
    - qtbase-sql-dbus/6.11.1
    - qtsvg/6.11.1
    - karchive/6.18.0
    - kcodecs/6.18.0
    - kcolorscheme/6.18.0
    - kconfig/6.18.0
    - kcoreaddons/6.18.0
    - ki18n/6.18.0
    - kiconthemes/6.18.0
    - knewstuff/6.18.0
    - ksyntaxhighlighting/6.18.0
    - kwidgetsaddons/6.18.0
    - kxmlgui/6.18.0
    - sonnet/6.18.0
    - openssl/3.5.6.1
    - zstd/1.5.7.1
    - cyrus-sasl/2.1.28.1
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-ohos-optional-webengine.patch: make Qt WebEngineWidgets optional and skip KSieveUi (qtwebengine unavailable for OHOS) so KSieve/KManageSieve/KSieveCore and the parser autotests still build."
  - "0002-ohos-optional-kio.patch: make KF6KIO optional and skip KManageSieve+KSieveCore when KIO is unavailable (kio/6.18.0 not published to OHOS remote), so the KSieve parser library + its 2 parser autotests + consumer test_package still build."
  - "0003-ohos-optional-pim-textaddons.patch: guard the KDE PIM (KPim6PimCommon/Libkdepim/Mime/IdentityManagementCore/MailTransport/IMAP) and KF6::Text* find_package REQUIRED calls behind if(KF6KIO_FOUND); they are only consumed by the skipped KManageSieve/KSieveCore/KSieveUi, so configure succeeds when the corresponding PIM/ktextaddons recipes are absent from the OHOS remote."
  - "0004-ohos-optional-printsupport.patch: make Qt6 PrintSupport OPTIONAL alongside WebEngineWidgets (both only consumed by the skipped KSieveUi editor library), so configure succeeds when qtbase-sql-dbus/6.11.1 does not ship the Qt6PrintSupport module."
knowledge_gained:
  - "libksieve 产出 4 个库: KPim6KSieve(解析器)/KPim6KManageSieve/KSieveCore/KSieveUi, 对应 4 个 CMake 包."
  - "上游仅对 KSieve 解析器有 autotest (lexertest/parsertest), 只依赖 KPim6::KSieve + Qt::Test."
  - "KSieveUi 硬依赖 Qt::WebEngineWidgets, 顶层 CMakeLists 无条件 REQUIRED, 是 OHOS 上尚未解决的硬依赖."
  - "适配补丁(patch 0001)把 WebEngineWidgets 从 REQUIRED find_package 移出并改为 OPTIONAL, 且在 src/CMakeLists.txt 用 if(Qt6WebEngineWidgets_FOUND) 跳过 ksieveui 子目录; qtwebengine/6.11.1 制品缺失时其余 3 库与 2 个 parser autotest 仍可构建运行."
