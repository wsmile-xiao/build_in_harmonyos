# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libksieve/25.12.3
homepage: https://invent.kde.org/pim/libksieve

# 上游测试注册总数 (ctest_entries 口径): BUILD_TESTING=ON 时 autotests/ 下
# ecm_add_tests(lexertest.cpp parsertest.cpp NAME_PREFIX "libksieve-parser-"
# LINK_LIBRARIES KPim6::KSieve Qt::Test) 注册 2 条 CTest 条目:
#   libksieve-parser-lexertest / libksieve-parser-parsertest
# KSieveUi 下的 editor/vacation/webengine 用例依赖 QtWebEngineWidgets, 在
# qtwebengine 不可用的 OHOS 平台上不注册, 不计入可运行的注册总数。
upstream_test_total: 2
upstream_test_count_method: ctest_entries

# 上游测试命令 (本项目为 CMake, 上游测试用 ctest 驱动; BUILD_TESTING=ON 时
# autotests/ 下通过 ecm_add_tests 注册的 lexertest/parsertest 会作为 CTest 条目)
upstream_check_command: "ctest --test-dir build --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure --no-tests=error"

# 上游实际运行的测试程序 (autotests/)
upstream_tests:
  - file: lexertest.cpp
    source: libksieve-25.12.3/autotests/lexertest.cpp
    description: "Sieve 词法分析器测试 (Lexer token 序列验证)"
    command: "./libksieve-parser-lexertest"
  - file: parsertest.cpp
    source: libksieve-25.12.3/autotests/parsertest.cpp
    description: "Sieve 脚本解析器测试 (Parser 语法树生成验证)"
    command: "./libksieve-parser-parsertest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libksieve.cpp
    description: "消费者测试: 用 KSieve::Parser 编译合法/非法 Sieve 脚本"
    command: "./test_libksieve"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
