# test_package/MANIFEST.yml — lftp 4.9.3
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lftp/4.9.3
homepage: "https://lftp.yar.ru/"

# 上游测试命令（automake TESTS, tests/Makefile.am）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check"

# make check 实际运行的测试套件（TESTS = 4 编译程序 + 3 脚本）
upstream_tests:
  - file: tests/ftp-mlsd.cc
    source: lftp-4.9.3/tests/ftp-mlsd.cc
    description: "FTP MLSD 列表解析单元测试（内置 79 条硬编码数据，纯离线）"
    command: "make check"
  - file: tests/ftp-list.cc
    source: lftp-4.9.3/tests/ftp-list.cc
    description: "FTP 长列表读取测试（直连 mirror.yandex.ru，需公网）"
    command: "make check"
  - file: tests/http-get.cc
    source: lftp-4.9.3/tests/http-get.cc
    description: "HTTP 拉取测试（连接 lftp.yar.ru，需公网）"
    command: "make check"
  - file: tests/ftp-cls-l.cc
    source: lftp-4.9.3/tests/ftp-cls-l.cc
    description: "FTP 会话列表测试（open ftp://mirror.yandex.ru，需公网）"
    command: "make check"
  - file: tests/module1
    source: lftp-4.9.3/tests/module1
    description: "可加载模块测试（--without-modules 默认构建下 SKIP，exit 77）"
    command: "make check"
  - file: tests/lftp-https-get
    source: lftp-4.9.3/tests/lftp-https-get
    description: "HTTPS 拉取测试（cat https://lftp.yar.ru/features.html，需公网）"
    command: "make check"
  - file: tests/lftp-queue-kill
    source: lftp-4.9.3/tests/lftp-queue-kill
    description: "kill all 终止排队命令测试（纯本地，可离线通过）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证安装包）
test_package_tests:
  - file: test_lftp.sh
    description: "离线功能测试：版本串、help 输出、queue/kill/jobs、lcd/lpwd，共 4 项检查"
    command: "sh test_lftp.sh"

# 上游测试总数（automake TESTS 条目口径：4 程序 + 3 脚本）
upstream_test_total: 7
upstream_test_count_method: "autotools_tests"
upstream_test_audit: >-
  源码级审计：tests/Makefile.am 定义 check_PROGRAMS =
  ftp-mlsd ftp-list http-get ftp-cls-l（4 个编译测试程序）与
  check_SCRIPTS = module1 lftp-https-get lftp-queue-kill（3 个脚本），
  TESTS = $(check_PROGRAMS) $(check_SCRIPTS) 共 7 个 automake 测试条目。
  其中 ftp-list/ftp-cls-l/http-get/lftp-https-get 直连公网服务器
  （ftp-list.cc 硬编码 mirror.yandex.ru，ftp-cls-l.cc open
  ftp://mirror.yandex.ru/，http-get.cc 连接 lftp.yar.ru，lftp-https-get
  拉取 https://lftp.yar.ru/features.html），离线沙箱无法通过；
  ftp-mlsd 为纯离线解析单元测试（79 条硬编码 MLSD 数据）；
  module1 在默认 --without-modules 构建下以 exit 77 SKIP；
  lftp-queue-kill 可离线通过。计数口径 autotools_tests。

test_counting:
  upstream_independent_total: 7
  integration_independent_total: 4
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

test_case_count: 4
assertion_count: 8
