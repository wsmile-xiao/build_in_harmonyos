# 版本级 manifest
# 文件位置: archives/l/lftp/4.9.3/manifest.yaml
# 首轮工作树状态 built: 配方已按规范写完, 待 HMBS 真机预检实证后由后端提交.
# 若预检失败, 本文件状态与日期随修复一起更新.

# 版本号
version: "4.9.3"

# 软件名
software: "lftp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "autotools"
conan_ref: "lftp/4.9.3"

# 源码信息
source:
  # 源码下载 URL（上游官网，与 conandata.yml 一致）
  url: "https://lftp.yar.ru/ftp/lftp-4.9.3.tar.gz"

  # 源码校验和（2026-09-27 从官网实测下载验证）
  sha256: "68116cc184ab660a78a4cef323491e89909e5643b59c7b5f0a14f7c2b20e0a29"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（与 conanfile.py generate() 一致）
  configure_options:
    - "--with-readline=<conan readline/8.3 package>"
    - "--with-zlib=<conan zlib/1.3.1 package>"
    - "--with-openssl=<conan openssl/3.5.6 package>"
    - "--without-gnutls"
    - "--disable-rpath"

  # 编译依赖列表（格式: name/version, 均为制品仓已发布版本）
  dependencies:
    - readline/8.3
    - zlib/1.3.1
    - openssl/3.5.6

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.guess.patch"
  - "0002-build-aux-config.sub.patch"

# 编译中学到的知识
knowledge_gained:
  - "E007 实证: 未打补丁的 config.sub 对 aarch64-unknown-linux-ohos 报 OS ohos not recognized, 仅补 guess+triplet/OS 表仍报 Kernel linux not known to work with OS ohos, 必须同时补 kernel 校验表"
  - "patch-autotools-ohos.pl 的 2.3 步在 2.1 成功后恒被跳过, 且其模式会误伤 uclinux-uclibc 分支, 本配方改用精确分支补丁"
  - "lftp 的 readline/zlib/openssl 检测宏均支持 DIR 前缀参数, 用 conan 包路径显式传入比依赖 PATH 搜索更确定"
  - "上游 automake TESTS 共 7 项, 其中 5 项直连公网服务器, 离线沙箱只能如实记录 gaps, 不能当失败 veto 掉整个包"
