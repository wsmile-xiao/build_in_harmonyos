software: lftp
display: "lftp"
description: "Sophisticated command-line file transfer client (FTP/HTTP/SFTP)"
category: network
homepage: "https://lftp.yar.ru/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "E007 平台三元组补丁：config.guess 增加 HarmonyOS 分支，config.sub 增加 triplet/OS/kernel 表项"
    - "readline/zlib 为 configure 硬要求，openssl 提供 FTPS/HTTPS 支持"
    - "单可执行文件产物（application），无需处理 .so 污染问题"
  common_dependencies:
    - readline
    - zlib
    - openssl

versions:
  "4.9.3":
    status: built
    build_date: "2026-09-27"
    conan_ref: "lftp/4.9.3"
