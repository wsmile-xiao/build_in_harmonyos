# test_package/MANIFEST.yml
# 上游官方测试声明文件（HMBS 真机门禁依据）
# 详见: docs/TEST_QUALITY_SPEC.md

package: libbpp-phyl-omics/2.4.1
homepage: "https://github.com/BioPP/bpp-phyl-omics"

# 上游源码审计（hmbs 硬门禁）：libbpp-phyl-omics v2.4.1 发布包确认无任何自动化测试
upstream_tests_exist: false
upstream_test_audit:
  - source: "顶层 CMakeLists.txt (v2.4.1 tag)"
    reason: "仅声明 project(bpp-phyl-omics)/cmake_minimum_required(2.8.11)/find_package(bpp-seq-omics 3.0.0)/find_package(bpp-phyl 12.0.0)/add_subdirectory(src)/Doxygen(可选)；全文件无 enable_testing / add_test / BUILD_TESTING / ctest 引用。"
  - source: "src/CMakeLists.txt"
    reason: "仅 set(CPP_FILES) + add_library({name}-static/shared) + install；无测试目标。"
  - source: "发布包源码树"
    reason: "v2.4.1 归档无 test/、tests/ 目录，src/ 下无 *_test 源文件；grep 'enable_testing|add_test|BUILD_TESTING|ctest|check_PROGRAMS|check-local' 在整个树无命中（已在 conan build() 对真实源码树执行，日志可见）。"
  - conclusion: "上游未提供自动化测试套件（upstream_test_total=0）；由 test_package 执行消费者视角的真实 API 验证。"

# 无自动化测试，故无上游测试命令；总数按官方注册口径为 0（无任何 ctest/测试目标）。
upstream_test_total: 0
upstream_test_count_method: ctest_entries

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_bpp_phyl_omics.cpp
    description: "5 项断言：CountClustersMafStatistics 构造 / getTreeProperty / setTreeProperty / getPropertyName / getShortName / getFullName（真实调用被测包 API 并链入 libbpp-phyl-omics.a 及并入本包的 vendored libbpp-phyl.a 与 Conan 依赖静态归档）"
    command: "./test_bpp_phyl_omics（经 ctest -R test_bpp_phyl_omics）"

assertion_count: 5
