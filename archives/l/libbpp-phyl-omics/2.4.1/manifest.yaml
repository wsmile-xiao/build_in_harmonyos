software: libbpp-phyl-omics
version: "2.4.1"
upstream_version: "2.4.1"
status: built
build_date: "2026-09-25"
build_system: cmake
conan_ref: "libbpp-phyl-omics/2.4.1"

source:
  url: "https://github.com/BioPP/bpp-phyl-omics/archive/refs/tags/v2.4.1.tar.gz"
  sha256: "fb0908422e59c71065db874e68d5c71acddf66d8a51776f7e04a5f8d5f0f6577"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-Dbpp-seq-omics_DIR=<libbpp-seq-omics 包 shim>/lib/cmake/bpp-seq-omics"
    - "-Dbpp-phyl_DIR=<vendored bpp-phyl-prefix>/lib{,64}/cmake/bpp-phyl（经 CMAKE_PREFIX_PATH，见配方）"
    - "-Dbpp-seq_DIR=<libbpp-seq 包 shim>/lib/cmake/bpp-seq"
    - "-Dbpp-core_DIR=<libbpp-seq 包 shim>/lib/cmake/bpp-core"
  dependencies:
    - libbpp-seq-omics/2.4.1
    - libbpp-seq/2.4.1
  vendored:
    - libbpp-phyl/2.4.1   # 未发布到 ohpcd，按同族先例 vendor 源码（bpp_phyl 条目），构建进私有前缀 bpp-phyl-prefix
  cc: clang
  cxx: clang++
  package_type: library

patches_applied: []

knowledge_gained:
  - "Bio++ 家族通用配方模式的进一步泛化：上游 set(CMAKE_CXX_FLAGS) 覆盖 --target 需 CMAKE_<LANG>_COMPILER_TARGET 注入（E543）；cmake_minimum_required 2.8.11 需 CMAKE_POLICY_VERSION_MINIMUM=3.5"
  - "多依赖 shim 的修正版：libbpp-phyl/2.4.1 未发布到 ohpcd，requires() 会因 'Package libbpp-phyl/2.4.1 not resolved' 在依赖图解析阶段失败；改为按同族先例 libbpp-seq vendor bpp-core 的做法 vendoring bpp-phyl 源码（conandata.yml bpp_phyl），在 build() 里先构建到私有前缀。对 Conan 依赖 libbpp-seq-omics / libbpp-seq 分别做 CMake 导出 shim（剔除 shared 目标、BPP_LIBS_SHARED 重定向 static），统一注入 bpp-seq-omics/bpp-seq/bpp-core 三个 _DIR，bpp-phyl 经 CMAKE_PREFIX_PATH 指向 vendored 前缀"
  - "libbpp-phyl-omics v2.4.1 无任何自动化测试（无 test/ 目录、无 enable_testing/add_test/ctest），test_package 阶段如实输出 status=no_tests + upstream_test_total=0"
