# test_package/MANIFEST.yml
# Upstream test declaration for CI L0e, plus the test_package test inventory.
package: lcdproc/0.5.9
homepage: "https://github.com/lcdproc/lcdproc"

# ---------------------------------------------------------------- upstream
# Upstream ships NO automated test suite.  Counting evidence, run in the
# unpacked lcdproc-0.5.9 tarball:
#
#   find . -maxdepth 3 -type d \( -name 'test*' -o -name 'tests' \) | wc -l   -> 0
#   grep -rlE '^(TESTS|check_PROGRAMS|check_LTLIBRARIES)' --include='Makefile.am' . | wc -l -> 0
#   grep -rnE '^(TESTS|check_PROGRAMS)[[:space:]]*=' --include='Makefile.am' . | wc -l      -> 0
#   grep -rlE 'AC_HELP_STRING.*test|make check' configure.ac | wc -l           -> 0
#
# `make check` therefore only descends into automake's empty `check-recursive`
# -> `check-am` chain and runs nothing: no TESTS list is registered anywhere, so
# it succeeds vacuously.  This is the "上游确无测试" case; the coverage below is
# therefore entirely consumer-side and new.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ------------------------------------------------------------- test_package
test_package_tests:
  - file: test.sh
    description: "9 个端到端用例：(1) lcdproc -h 完整 usage 横幅与 -s/-p 选项文档；(2) lcdexec -h usage；(3) lcdvc -h usage；(4) lcdproc 对关闭端口 39117 的真实连接拒绝诊断原文 + 退出码 1；(5) lcdvc 在无 LCDd 主机上真实运行到错误路径、打印真实诊断并以 255 退出——本机若有 /dev/vcs 则诊断为连接被拒，真机（无 /dev/vcs）则为控制台设备缺失，两条都是真实运行路径；(6) 鸿蒙特有——打包后的 aarch64 OHOS 客户端跑通一次**完整 LCDd 会话**：真实 TCP 连接 → hello 握手 → 33x6 几何协商（客户端内置回退是 20x4，故回显数字即握手被真正解析的硬证据）→ 用本机实时数据构建 C/L/T 三块屏（/proc/stat CPU 计量、/proc/loadavg 负载直方图、实时时钟）→ 对端发 bye 后客户端以 0 干净退出；其中客户端自报主机名与 socket.gethostname() 交叉校验；(7) 鸿蒙特有——lcdproc/lcdexec/lcdvc/LCDd 的 ELF e_machine == 0xB7 (AArch64)；(8) 鸿蒙特有——LCDd 全部 10 个驱动插件同 AArch64 ABI（否则 dlopen 会在启动时才炸）；(9) 载荷完整性：LCDd + 10 个驱动插件 + 4 个随包配置"
    command: "sh test.sh <package bin> <package lib/lcdproc> <lcdd_stub.py>"
  - file: lcdd_stub.py
    description: "用例 6 的对端：一个最小的 LCDd 线路协议实现（TCP 监听 + connect 几何协商 + listen + 抓取客户端上行报文 + bye）。它只是测试夹具，**不进入包产物**；所有断言都落在**打包后的 aarch64 OHOS 客户端真实写上线路的字节**上。之所以不用真 LCDd 当对端：server/sock.c 用 FD_SET，OHOS NDK 的 sys/select.h 会先调 __fd_chk()，真机 libc 有该符号而本地 WSL 仿真 guest（普通 musl）没有，直接拿真守护进程当对端会让用例的成败取决于机器碰巧装的是哪个 libc——那是平台假设不是事实；被测客户端不用 FD_SET，故对它做全程会话在任何 libc 上都确定。"
    command: "python3 lcdd_stub.py <portfile> <greetingfile> <streamfile> <hostfile> 45"

# 9 test cases / 46 failure branches; counted with
#   grep -c '^pass '                  test.sh  -> 9
#   grep -c 'fail "'                  test.sh  -> 46
assertion_count: 46
