# conandata.yml - lcdproc 0.5.9
# Single source of truth for source URL + SHA256 + patches (R39: official source).
#
# URL provenance (R39 / R52 - only what was actually verified is claimed):
#   The single source below is the upstream project's own GitHub release asset
#   for tag v0.5.9.  It was downloaded and hashed locally, and the sha256
#   recorded here is the digest of that download:
#     curl -fsSL -o lcdproc-0.5.9.tar.gz \
#       https://github.com/lcdproc/lcdproc/releases/download/v0.5.9/lcdproc-0.5.9.tar.gz
#     sha256sum lcdproc-0.5.9.tar.gz
#     d48a915496c96ff775b377d2222de3150ae5172bfb84a6ec9f9ceab962f97b83
#   Its HTTP status was checked to be 200 at the time of writing.
#
#   The historical Savannah/freedesktop tarball
#   (https://download.savannah.nongnu.org/releases/lcdproc/lcdproc-0.5.9.tar.gz)
#   is deliberately NOT listed: it no longer serves 0.5.9 - the frontend answers
#   HTTP 302 and the mirror it redirects to returns HTTP 404 - so listing it
#   would only hand the pipeline a dead fallback.  It is likewise NOT claimed to
#   be byte-identical to the GitHub asset - no such comparison was performed.
sources:
  url: "https://github.com/lcdproc/lcdproc/releases/download/v0.5.9/lcdproc-0.5.9.tar.gz"
  sha256: "d48a915496c96ff775b377d2222de3150ae5172bfb84a6ec9f9ceab962f97b83"

patches:
  - patch_file: "patches/0001-config-guess-ohos-triplet.patch"
    patch_description: "E007/E072: teach the bundled 2014-03-23 config.guess two ways to answer aarch64-unknown-linux-ohos - (a) a *:HarmonyOS:*:* uname branch for the on-device CI runner, (b) a compiler-target probe that reports the OHOS triple whenever the selected compiler targets *-linux-ohos, so a cross build resolves the same host as a native one"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-linux-ohos.patch"
    patch_description: "E072: accept the linux-ohos kernel-OS pair in the bundled 2014-09-11 config.sub - one entry in the `case $maybe_os` kernel-OS whitelist and one in the final `case $os` OS whitelist, otherwise config.sub rejects aarch64-unknown-linux-ohos with 'machine aarch64-unknown-linux not recognized'"
    patch_type: "portability"
  - patch_file: "patches/0003-iface-extern-definition.patch"
    patch_description: "Split the tentative definition of the shared `iface[]` table in clients/lcdproc/iface.h into an extern declaration plus the single real definition in iface.c. The header is included by both main.c and iface.c, so with clang's -fno-common default each translation unit emitted its own strong .bss definition and the lcdproc client failed to link with 'duplicate symbol: iface'"
    patch_type: "portability"
  - patch_file: "patches/0004-configure-umask-022.patch"
    patch_description: "E011/E114: relax `umask 077` to `umask 022` in the generated configure and in config.guess so the ./confXXXXXX and $TMPDIR/cgXXXXXX scratch directories stay writable. On HMDFS the running process UID differs from the mapped directory owner, so an owner-only scratch dir is not even writable by its owner and config.status dies with \"can't create ./confXXXXXX/...: Permission denied\""
    patch_type: "platform"
