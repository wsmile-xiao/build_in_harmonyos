software: libdv
display: "libdv"
description: "Quasar DV codec library - software codec for DV video format"
category: gfx
homepage: "https://libdv.sourceforge.net/"
license: LGPL-2.1
build_system: autotools

ohos_adaptation:
  key_points:
    - "需要替换 config.guess/config.sub 为支持 HarmonyOS 的版本"
    - "configure 中 umask 077 导致 HMDFS 临时目录权限问题，需移除 umask 077"
    - "需要禁用 X/GTK/Xv/asm (--disable-gtk --disable-xv --without-x --disable-asm)"
  common_dependencies: []

versions:
  "1.0.0-r8":
    status: published
    build_date: "2026-06-01"
