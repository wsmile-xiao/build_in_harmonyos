# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libmesode/0.10.1
homepage: "https://github.com/profanity-im/libmesode"

upstream_check_command: "direct cc driver per Makefile.am TESTS mapping"
upstream_test_in_build: true
upstream_test_command: "direct cc driver: compile the 12 TESTS programs per Makefile.am check_PROGRAMS source mapping and execute them with the automake exit-code protocol (exit 0 == PASS), same binaries and assertions as `make check` (no autoreconf/configure: preflight sandbox provides neither native autoreconf nor a buildable conan autoconf/m4)"

upstream_tests:
  - file: tests/check_parser.c
    source: libmesode-0.10.1/tests/check_parser.c
    description: "expat 解析器回调测试"
    command: "./tests/check_parser"
  - file: tests/test_sha1.c
    source: libmesode-0.10.1/tests/test_sha1.c
    description: "SHA1 实现测试"
    command: "./tests/test_sha1"
  - file: tests/test_md5.c
    source: libmesode-0.10.1/tests/test_md5.c
    description: "MD5 实现测试"
    command: "./tests/test_md5"
  - file: tests/test_rand.c
    source: libmesode-0.10.1/tests/test_rand.c
    description: "随机数测试"
    command: "./tests/test_rand"
  - file: tests/test_scram.c
    source: libmesode-0.10.1/tests/test_scram.c
    description: "SCRAM 认证测试"
    command: "./tests/test_scram"
  - file: tests/test_ctx.c
    source: libmesode-0.10.1/tests/test_ctx.c
    description: "上下文生命周期测试"
    command: "./tests/test_ctx"
  - file: tests/test_base64.c
    source: libmesode-0.10.1/tests/test_base64.c
    description: "Base64 编解码测试"
    command: "./tests/test_base64"
  - file: tests/test_hash.c
    source: libmesode-0.10.1/tests/test_hash.c
    description: "哈希表测试"
    command: "./tests/test_hash"
  - file: tests/test_jid.c
    source: libmesode-0.10.1/tests/test_jid.c
    description: "JID 解析测试"
    command: "./tests/test_jid"
  - file: tests/test_snprintf.c
    source: libmesode-0.10.1/tests/test_snprintf.c
    description: "snprintf 兼容层测试"
    command: "./tests/test_snprintf"
  - file: tests/test_string.c
    source: libmesode-0.10.1/tests/test_string.c
    description: "字符串工具测试"
    command: "./tests/test_string"
  - file: tests/test_resolver.c
    source: libmesode-0.10.1/tests/test_resolver.c
    description: "DNS 解析器测试"
    command: "./tests/test_resolver"

test_package_tests:
  - file: test.c
    description: "消费者测试: ctx/stanza/JID/SHA1/Base64/UUID/message 共 11 个断言"
    command: "./test_libmesode"

assertion_count: 11
