software: libsnl
version: "0.2.1.svn.18"
status: built
build_date: "2026-09-19"
build_system: makefile
conan_ref: "libsnl/0.2.1.svn.18"

source:
  url: "https://deb.debian.org/debian/pool/main/libs/libsnl/libsnl_0.2.1.svn.18.orig.tar.xz"
  sha256: "2d90e6c4f6a2c3e79e04777884658444d657c934731285d8f6551211e3d16472"
  tar_format: tar.xz

build:
  system: makefile
  build_command: "clang++ -std=gnu++98 -O2 -Wall -fPIC -c src/*.cpp (排除 snlTest.cpp) && clang++ -shared -o libSNL.so.0.2 *.o"
  dependencies: []
  cc: clang++

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "upstream src/snlTest.cpp（自带 test/demo 程序）"
  upstream_discovered: 1
  upstream_passed: 1
  upstream_failed: 0
  upstream_note: "snlTest 覆盖曲线/曲面插值、节点插入与移除、升阶、投影与线性求解，全部通过时打印 'All tests have passed :-)'"
  test_package_passed: 10
  test_package_failed: 0
  test_package_assertions: 10
  execution: "conan create rc=0 + 上游 snlTest 通过 + 消费者 10 条断言"

test_passed: 10
test_failed: 0

patches_applied: []

knowledge_gained:
  - "上游只有手写的 src/makefile（无 configure/CMake）：直接按同一源码列表用 clang++ 编译即可，连 make 变量注入都不需要；这类库是最轻的适配形态"
  - "2004 年的 C++ 代码用 -std=gnu++98 编译最稳（与上游年代一致），现代 clang++ 默认 gnu++17 可能因旧语法告警或报错"
  - "上游 snlTest.cpp 自带 main() 与通过判定（'All tests have passed :-)'）：把它作为 build() 的硬性上游证据，比自造测试更能说明适配后库的正确性"
  - "libSNL 的插值性质（曲线必须过型值点，误差 <= 1e-14）是理想的确定性消费者断言：snlCurve + SNL_GLOBAL_INTERPOLATION + evalHmg 即可验证"
