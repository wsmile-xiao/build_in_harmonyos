# test_package/MANIFEST.yml
# libSNL 0.2.1.svn.18.
#
# Upstream ships src/snlTest.cpp, a test/demo program that exercises curves,
# surfaces, knot insertion/removal, degree elevation, projections and the
# linear solver, and prints "All tests have passed :-)" when everything
# succeeds.  The recipe compiles and runs it as upstream evidence; consumer
# coverage over the installed headers/library is a CMake program.

package: libsnl/0.2.1.svn.18
homepage: http://libsnl.sourceforge.net/

upstream_tests_exist: true
upstream_test_audit: "no tests/ directory and no make check; src/snlTest.cpp is the upstream test/demo program (has main()) built by `make test` in src/makefile"
upstream_check_command: "cd src && make test && ./snlTest"
upstream_test_in_build: true
upstream_test_command: "<clang++> -std=gnu++98 -o snlTest src/snlTest.cpp <libSNL objects> && ./snlTest"

upstream_tests:
  - name: snlTest
    command: "./snlTest"
    expected: "pass; prints 'All tests have passed :-)'"

test_package_tests:
  - file: test_libsnl.cpp
    description: "snlPoint 4 components, snlVector length/dot/crossProduct/point distance, snlCurve global interpolation through its data points (max error <= 1e-9), parameter range"
    command: "./libsnl_consumer"

test_files:
  - path: "test_package/test_libsnl.cpp"
    test_type: "R34"
    assertion_count: 10

test_package_test_count: 1
consumer_assertion_count: 10
assertion_count: 10
