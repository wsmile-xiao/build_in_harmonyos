knowledge_gained:
  - "GitHub tag tarball 无预生成 configure，构建须 aclocal/autoconf/autoheader/automake 自举，ltmain.sh 需从 libtool tool_requires 复制"
  - "native OHOS (settings_build.os==OHOS) 下 configure 直接执行触发 Permission denied(126)，须 /system/bin/sh 前缀（E232）"
  - "OHOS hmdfs 下 config.status 临时目录 umask 077 不可写，须改 022（E114 家族）"
  - "OHOS config.guess 无法识别且其暂存写入被拒，显式 --build/--host 跳过（E007）"
  - "liboauth 1.0.3 hash.c 使用 OpenSSL 1.1 前栈式 EVP_MD_CTX API，须迁移 EVP_MD_CTX_new/EVP_MD_CTX_free"

