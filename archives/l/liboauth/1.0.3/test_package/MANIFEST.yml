# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: liboauth/1.0.3
homepage: "http://liboauth.sourceforge.net/"

# 上游测试命令 (make check)：实际运行 tcwiki/tceran/tcother 三个测试程序
# 验证 OAuth 1.0 HMAC-SHA1 签名与 OAuth 规范示例（Wiki / Eran / Other 向量）
upstream_check_command: "make check"

# conanfile.py build() 中未集成上游测试（测试在本地 make check 执行并记录）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本地实测 3/3 PASS）
upstream_tests:
  - file: tests/commontest.c
    source: liboauth-1.0.3/tests/commontest.c
    description: "OAuth 1.0 签名公共向量测试（base64/escape/HMAC-SHA1/plaintext）"
    command: "./tests/tcwiki"
  - file: tests/selftest_eran.c
    source: liboauth-1.0.3/tests/selftest_eran.c
    description: "Eran 测试向量（oauth_sign_url2 全流程签名）"
    command: "./tests/tceran"
  - file: tests/selftest_other.c
    source: liboauth-1.0.3/tests/selftest_other.c
    description: "Other 测试向量（签名与 bodyhash）"
    command: "./tests/tcother"

# test_package 中自带的测试 (消费者视角验证, 实质调用库 API)
test_package_tests:
  - file: test.c
    description: "消费者测试：调用 oauth_encode_base64/url_escape/sign_hmac_sha1/sign_plaintext/decode 校验 RFC 向量"
    command: "./test_liboauth"

# 测试断言总数 (近似值, 用于质量评估)：上游 3 程序 + test_package 5 断言
assertion_count: 8