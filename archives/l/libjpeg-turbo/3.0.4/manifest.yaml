software: libjpeg-turbo
version: "3.0.4"
build_system: cmake
status: built            # R01: conan create + test_package 已过（2026-09-05）
source:
  url: "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.4/libjpeg-turbo-3.0.4.tar.gz"
  sha256: "99130559e7d62e8d695f2c0eaeef912c5828d5b84a0537dcb24c9678c9d5b76b"
build:
  system: cmake
  toolchain: "自发现 ohos.toolchain.cmake + 裸 cmake（绕开 conan_toolchain，与 glfw/3.4.6/3.2.0 同法；recipe 自包含，裸 conan create 即可）"
  cmake_options:
    - "CMAKE_INSTALL_LIBDIR=lib"   # ohos.toolchain 64 位默认 lib64/，须强制 lib/
    - "ENABLE_SHARED=ON"
    - "ENABLE_STATIC=OFF"
    - "WITH_TOOLS=OFF"
    - "WITH_TESTS=OFF"
    - "WITH_SIMD=OFF"              # E096 平台识别致 SIMD 链接失败，须禁（2.1.5.1/3.1.4.1/3.2.0 既有适配结论）
    - "OHOS_ARCH=arm64-v8a"
  cc: clang
  sign_so: true                    # SDK toolchain 产的 .so 自签无效，package() 用 binary-sign-tool -selfSign 重签
libs:
  - jpeg        # libjpeg.so.62 (SONAME libjpeg.so.62) — 经典 libjpeg API
  - turbojpeg   # libturbojpeg.so.0 — TurboJPEG API
requires: []    # 无外部依赖；aarch64 不用 nasm
verified:
  date: "2026-09-05"
  evidence: "conan create rc=0；test_package dlopen libjpeg.so ok(dlsym jpeg_std_error)；SONAME=libjpeg.so.62"
knowledge_gained:
  - "R01 第一轮完整适配（知识库扩展任务）：3.0.4 复用 3.2.0 同谱配方结论"
  - "cmake 库 ML-0035：自发现 ohos.toolchain.cmake + 裸 cmake（绕开 conan_toolchain），recipe 自包含、不依赖 CI profile host 段"
  - "WITH_SIMD=OFF：E096 HarmonyOS 平台识别致 SIMD 链接失败，须禁"
  - "ohos.toolchain 64 位默认装 lib64/，须 -DCMAKE_INSTALL_LIBDIR=lib"
  - "SDK toolchain 产的 .so 自签无效，dlopen 报 Permission denied，须 binary-sign-tool -selfSign 重签"
