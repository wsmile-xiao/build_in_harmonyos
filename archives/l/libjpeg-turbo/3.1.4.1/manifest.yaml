version: "3.1.4.1"
status: published
build_date: "2026-04-21"

source:
  url: "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.1.4.1/libjpeg-turbo-3.1.4.1.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-GUnix Makefiles"
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DWITH_SIMD=0"
    - "-DWITH_TESTS=0"

knowledge_gained:
  - "E096: libjpeg-turbo SIMD 链接失败（未知平台），需禁用 SIMD"

notes: |
  编译过程中遇到 SIMD 链接失败问题，通过禁用 SIMD (-DWITH_SIMD=0) 解决。
  同时禁用测试 (-DWITH_TESTS=0) 以简化编译流程。

