# Lighttpd 编译产物清单
# OpenHarmony Third-party Library Prebuilt Archive

software:
  name: lighttpd
  version: 1.4.82
  description: Lighttpd - a fast, secure, and flexible web server
  homepage: https://www.lighttpd.net/
  license: BSD-3-Clause

build:
  status: published
  date: 2026-05-23
  platform: OpenHarmony
  arch: aarch64
  compiler: clang

dependencies:
  - openssl
  - zlib
  - pcre2

modules:
  - name: mod_accesslog.so
    description: Access log module
    size: 70K
  - name: mod_ajp13.so
    description: AJP13 protocol module
    size: 74K
  - name: mod_auth.so
    description: Authentication module
    size: 107K
  - name: mod_authn_file.so
    description: File-based authentication module
    size: 59K
  - name: mod_cgi.so
    description: CGI module
    size: 78K
  - name: mod_deflate.so
    description: Compression module
    size: 126K
  - name: mod_dirlisting.so
    description: Directory listing module
    size: 106K
  - name: mod_extforward.so
    description: External forward module
    size: 82K
  - name: mod_h2.so
    description: HTTP/2 module
    size: 186K
  - name: mod_openssl.so
    description: OpenSSL TLS module
    size: 159K
  - name: mod_proxy.so
    description: Proxy module
    size: 90K
  - name: mod_rrdtool.so
    description: RRDtool module
    size: 50K
  - name: mod_sockproxy.so
    description: Socket proxy module
    size: 46K
  - name: mod_ssi.so
    description: Server Side Includes module
    size: 94K
  - name: mod_status.so
    description: Server status module
    size: 74K
  - name: mod_userdir.so
    description: User directory module
    size: 42K
  - name: mod_vhostdb.so
    description: Virtual host database module
    size: 54K
  - name: mod_webdav.so
    description: WebDAV module
    size: 122K
  - name: mod_wstunnel.so
    description: WebSocket tunnel module
    size: 87K

binaries:
  - path: bin/lighttpd
    type: executable
    size: 1.5M

files:
  - path: manifest.yaml
    description: This manifest file
  - path: README.md
    description: Documentation and usage guide
  - path: bin/lighttpd
    description: Main executable
  - path: lib/mod_*.so
    description: Loadable modules (19 modules)
  - path: reports/build.log
    description: Build log
  - path: reports/configure.log
    description: Configure log
  - path: reports/install.log
    description: Install log

notes:
  - All modules are dynamically loadable via server.modules in lighttpd.conf
  - OpenSSL module requires libssl and libcrypto
  - HTTP/2 support enabled via mod_h2
  - Compression support via mod_deflate requires zlib