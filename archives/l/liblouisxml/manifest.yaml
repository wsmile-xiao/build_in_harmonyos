software: liblouisxml
display: "liblouisxml"
description: "Braille transcription services for XML/HTML via liblouis"
category: accessibility
homepage: "https://github.com/liblouis/liblouisxml"
license: GPL-3.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Bundles liblouis 3.33.0 as private static build for PKG_CHECK_MODULES"
    - "Disables Python bindings to avoid Python.h hard dependency"
    - "Uses AutotoolsDeps/PkgConfigDeps for libxml2 and private liblouis prefix"
  common_dependencies:
    - libxml2

versions:
  "2.4.0":
    status: built
    build_date: "2026-09-15"
    conan_ref: "liblouisxml/2.4.0"
    note: "Initial OHOS adaptation; bundles liblouis 3.33.0 privately, runs make check"
