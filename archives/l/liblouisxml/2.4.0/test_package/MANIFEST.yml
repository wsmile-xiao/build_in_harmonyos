package: "liblouisxml/2.4.0"
homepage: "https://github.com/liblouis/liblouisxml"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: check_version.c
    source: tests/check_version.c
    description: "Upstream check_version verifies lbx_version matches PACKAGE_VERSION"
    command: "./check_version"

test_package_tests:
  - file: test.c
    description: "Consumer test linking against liblouisxml and calling lbx_version"
    command: "./test"
  - file: test.c
    description: "CLI smoke test for xml2brl --version"
    command: "xml2brl --version"

assertion_count: 3
test_counting:
  upstream_independent_total: 1
  integration_independent_total: 2
test_case_count: 3
