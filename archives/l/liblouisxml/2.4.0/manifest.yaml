package: liblouisxml/2.4.0
homepage: "https://github.com/liblouis/liblouisxml"
description: "Braille transcription services for XML/HTML via liblouis"
license: "GPL-3.0"

build_system: autotools
upstream_source:
  url: "https://mirror.jmu.edu/pub/ubuntu/pool/universe/libl/liblouisxml/liblouisxml_2.4.0.orig.tar.gz"
  sha256: "7dcfcba2d4918e4c2b2bd2b3ec24a8cf86941c252e2d73f3ac2fa25704794912"
  bundled_liblouis:
    url: "https://github.com/liblouis/liblouis/releases/download/v3.33.0/liblouis-3.33.0.tar.gz"
    sha256: "e2ad56d132d0cd63f08f3122391a0472adcc8c5d046d7cd81bcadf48a55deea4"

dependencies:
  - libxml2/2.15.3.1

ohos_adaptation:
  bundled_liblouis_version: "3.33.0"
  patches:
    - patches/0001-disable-python.patch
  build_test:
    command: "make check"
    expected: "check_version passes"
