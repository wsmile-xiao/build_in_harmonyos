software: libndp
version: "v1.7"
status: published
build_date: "2026-05-29"
build_system: autotools

source:
  url: "https://github.com/jpirko/libndp/archive/refs/tags/v1.7.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/usr/local"
  dependencies:
    - autoconf
    - automake
    - libtool
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libndp tarball is raw source, requires autogen.sh to generate configure script"
  - "autotools project with no platform-specific patches required"
  - "One compiler warning (incompatible pointer types) does not affect functionality"