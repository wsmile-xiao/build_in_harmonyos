# test_package/MANIFEST.yml — libndp 1.9
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）

package: libndp/1.9
homepage: "http://libndp.org"

# 上游 1.9 无测试套件：顶层与各子目录 Makefile.am 均无 check 目标，
# `make check` 实跑报 "No rule to make target 'check'"（2026-09-16 实测留档）。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 —— 上游不存在测试源文件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：真实调用 libndp 公开 API（ndp_msg_new(RS)=0 / ndp_msg_new(NDP_MSG_ALL) 应失败 / ndp_msg_destroy 生命周期配对）；不使用 ndp_open 因其需 raw ICMPv6 socket 特权，CI 沙箱必然 EACCES"
    command: "./test_libndp"

# 测试断言总数（近似值）
# 上游 0；test_package test.c 断言 3（new(RS) 成功、msg 非空、new(ALL) 失败）
assertion_count: 3
