knowledge_gained:
  - "libndp tag 归档无预生成 configure；autogen.sh 需 automake/libtoolize（构建机缺失），autotools 路线不可行，配方采用手写 clang 编译（libndp.c + ndptool.c 两翻译单元）" # knowledge_ref: archives/l/libndp/1.9/reports/conan-create.log
  - "上游 config.guess (2023-06-23) 不识别 OpenHarmony，configure 报 cannot guess build type；这是放弃 configure 路线的平台性根因" # knowledge_ref: archives/l/libndp/1.9/notes.md
  - "safe-bin 垫片注入的坏 rm 使 configure 的 rm 探测失败（Your 'rm' program is bad）；最小修复为清 BASH_FUNC_*/BASH_ENV/CODEBUDDY_SAFE_DELETE_* 并以 /system/bin/rm 进 PATH" # knowledge_ref: archives/l/libndp/1.9/notes.md
  - "musl 下 ndptool.c 的 ppoll 为隐式声明（需 _GNU_SOURCE）；编译期加 -D_GNU_SOURCE，musl libc 导出 ppoll 符号，链接正常" # knowledge_ref: archives/l/libndp/1.9/reports/conan-create.log
  - "libtool 版本戳 c=3:r=0:a=3 => SONAME libndp.so.0 / 实体 libndp.so.0.3.0；musl 不能加载 SONAME 名为软链的库，打包时全部落实体文件" # knowledge_ref: knowledge/graph/E316.kv
  - "上游无测试套件（各 Makefile.am 无 check 目标，make check 报 No rule to make target 'check'）；验证依赖 conan test_package L1 冒烟 + ndptool 真机运行" # knowledge_ref: archives/l/libndp/1.9/test_package/MANIFEST.yml
  - "R38：本包含 bin/ndptool，软件级 commands.json（type=tool）与 package_info() bindirs=[\"bin\"] 双件套齐备" # knowledge_ref: archives/l/libndp/commands.json

