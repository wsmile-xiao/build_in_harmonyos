# test_package/MANIFEST.yml — libmorton 0.2.9
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/ADAPTATION_GUIDE.md §6。

package: libmorton/0.2.9
homepage: "https://github.com/Forceflow/libmorton"

# 上游测试命令（手动复现：源码树顶层配置 + 构建单一可移植测试目标 + 运行）
upstream_check_command: "cmake -S . -B build -DBUILD_TESTING=ON && cmake --build build --target libmorton-test && ./build/test/libmorton-test 256"

# conanfile.py build() 中是否已集成上游测试（层1）
# header-only：build() 内 _run_upstream_tests 用 -DBUILD_TESTING=ON 配置、
# 构建可移植目标 libmorton-test 并实跑（argv=64 收敛性能段）。
# 注：patches/0002 把 test2D/test3D_performance.h 的 Timer.start()/stop() 从
# 最内层循环提升到函数级（回移上游 0.2.12 自身改动）——v0.2.9 每采样两次
# clock_gettime，全跑 ~10.5M 次 syscall，慢速 OHOS CI 两次独立 worker 均超
# 3600s conan 预算。纯计时适配：12 个正确性检查与全部循环工作量不变。
upstream_test_in_build: true
upstream_test_command: "libmorton-test 64 (conanfile.py build() 末尾 _run_upstream_tests)"

upstream_test_count: 12
upstream_test_cases_skipped: 0

# 上游 12 个正确性检查（单一可执行 test/libmorton-test，见 main() 的
# CORRECTNESS TESTS 段：2D/3D × {EncodeDecodeMatch, EncodeCorrectness,
# DecodeCorrectness} × {32-bit, 64-bit} = 12；任一失败 exit 1）。
# 注：test/CMakeLists.txt 另注册 x86 专用变体（libmorton-test-bmi2/avx512/zen2，
# 带 -march=haswell/icelake/znver2），OHOS aarch64 无法编译，逐项记为不可用而非构建。
upstream_tests:
  - file: test/libmorton_test.cpp
    source: libmorton-0.2.9/test/libmorton_test.cpp
    description: "正确性套件：3D 64/32-bit 与 2D 64/32-bit 的 encode/decode 往返一致 + 编码/解码正确性，共 12 组检查"
    command: "libmorton-test 64"

# test_package 自带的消费者测试（真实调用公开 API）
test_package_tests:
  - file: test_package/test_libmorton.cpp
    description: "消费者测试：morton3D_64/morton2D_64 编解码往返断言(18+10) + 确定性检查(1) ≈ 29 断言"
    command: "./test_libmorton"

# 测试断言总数（上游 12 组正确性检查内部大量逐函数断言；消费者 ≈29 断言，粗估）
assertion_count: 30
