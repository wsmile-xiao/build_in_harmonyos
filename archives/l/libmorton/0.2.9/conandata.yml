# conandata.yml — libmorton 0.2.9
# 源码 + 补丁声明（CI 读取）

sources:
  "0.2.9":
    url: "https://github.com/Forceflow/libmorton/archive/refs/tags/v0.2.9.tar.gz"
    sha256: "a3c86360a6cb97bfcad60216d44f30870e9d20c6f62610c4617a74bf678c9cc8"

patches:
  - patch_file: "patches/0001-fix-m2d-d-for-loop-bound.patch"
    patch_description: "Fix m2D_d_for loop bound: iterate i < checkbits instead of <= to avoid shifting a 32-bit morton selector by 32 bits (undefined) and corrupting decoded coordinates. Defect present identically in v0.2.9 and v0.2.12."
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-hoist-perf-timers.patch"
    patch_description: "Hoist the Timer.start()/stop() calls in test2D/test3D_performance.h out of the innermost loops to function scope. Upstream v0.2.9 wraps every unrolled block / every random sample with a clock_gettime(CLOCK_REALTIME) pair (~10.5M syscalls per full run at MAXRUNSIZE=64); under the slow OHOS CI execution this alone blows the conan build budget (two workers exceeded 3600s). v0.2.12 upstream fixed exactly this by moving start()/stop() around the whole measured region. Pure timing adaptation: no correctness assertion touched, the 12 correctness checks and all loop work are unchanged."
    patch_type: "portability"
    strip: 1
