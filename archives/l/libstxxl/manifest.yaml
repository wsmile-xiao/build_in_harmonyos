software: libstxxl
display: "libstxxl"
description: "Standard Template Library for Extra Large Data Sets (external-memory containers and algorithms)"
category: library
homepage: "https://github.com/stxxl/stxxl"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "E092: CMake 无 HarmonyOS 平台模块，generate() 强制 CMAKE_SYSTEM_NAME=Linux 走 Unix 分支"
    - "上游默认静态库，Conan shared=False 对应 BUILD_SHARED_LIBS=OFF/BUILD_STATIC_LIBS=ON"
    - "无外部 Conan 依赖，仅需系统 pthread"
    - "BUILD_TESTS=ON 注册完整 ctest 套件，STXXL_TMPDIR 透传 HMBS 可写目录"
  common_dependencies: []

versions:
  "1.4.1":
    status: built
    build_date: "2026-09-19"
    source_url: "https://github.com/stxxl/stxxl/releases/download/1.4.1/stxxl-1.4.1.tar.gz"
