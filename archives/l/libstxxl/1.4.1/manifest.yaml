version: "1.4.1"
software: "libstxxl"
status: built
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://github.com/stxxl/stxxl/releases/download/1.4.1/stxxl-1.4.1.tar.gz"
  sha256: "92789d60cd6eca5c37536235eefae06ad3714781ab5e7eec7794b1c10ace67ac"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_CXX_STANDARD=11"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DBUILD_STATIC_LIBS=ON"
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_EXTRAS=OFF"
    - "-DUSE_BOOST=OFF"
    - "-DUSE_GNU_PARALLEL=OFF"
    - "-DCMAKE_CXX_FLAGS_RELEASE=-O1 -DNDEBUG"
    - "-DCMAKE_CXX_FLAGS_DEBUG=-O0 -g1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-test_config-writable-tmp.patch"

knowledge_gained:
  - "E092: CMake 无 HarmonyOS 平台模块，generate() 强制 CMAKE_SYSTEM_NAME=Linux 走 Unix 分支"
  - "CMake 4.x 移除 <3.5 兼容，上游 cmake_minimum_required(VERSION 2.6.2)，generate() 设 CMAKE_POLICY_VERSION_MINIMUM=3.5，不改上游源码"
  - "上游默认静态库，Conan shared=False 对应 BUILD_SHARED_LIBS=OFF/BUILD_STATIC_LIBS=ON"
  - "BUILD_TESTS=ON 注册 109 个 ctest 用例，BUILD_EXTRAS=OFF 排除额外大用例"
  - "测试需可写 STXXL_TMPDIR，已透传 HMBS TMPDIR；_writable_tmpdir 可写探测、永不回退 /tmp"
  - "沙箱编译器识别失败时真实 --version 探测并直改 conan_toolchain.cmake(FORCE) + 清坏 CMakeCache"
  - "小内存盒 Signal 9：按构建类型封顶优化/调试等级（Release -O1、Debug -O0 -g1），示例属 ctest 口径不得裁剪"
