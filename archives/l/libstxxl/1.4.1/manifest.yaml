software: libstxxl
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.4.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.4.1"

# 构建系统类型（顶层字段）
build_system: cmake

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/stxxl/stxxl/1.4.1/stxxl-1.4.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBUILD_SHARED_LIBS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMakeLists.txt.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 移除了对 < 3.5 版本兼容性，需将 cmake_minimum_required 改为 ≥ 3.5"
  - "OpenHarmony 平台需用 -DCMAKE_SYSTEM_NAME=Linux 让 cmake 正确识别 POSIX 特性"
  - "STXXL 默认磁盘路径 /var/tmp 在鸿蒙平台只读(E002)，需 ~/.stxxl 配置可写路径"
  - "建议 BUILD_SHARED_LIBS=OFF 编译为静态库，避免鸿蒙平台共享库兼容性问题"
  - "clean_verify.py 不支持 cmake 构建系统，需后续补充 cmake 专用逻辑"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/libstxxl-1.4.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/libstxxl-1.4.1.work
  source_orig_hash: 67f61bf209670ed7
  source_work_hash: e03d1a7a042a8042
  generated_at: '2026-06-10T03:35:41'
  patches_count: 1

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: '#ifdef __OHOS__'
type: auto
    platform_only: True
    guard: 'pending'
