# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试盘点（9.4.2 release tarball 实测）:
#   - tarball 内无 test/ 目录、无 fixtures、无 CTest/add_test 目标（find/tar -t 核实）
#   - llhttp 的官方测试套件位于 Node.js 主仓（test/parallel/test-llhttp*.js 等），
#     依赖 Node.js 测试运行器，C/C++ 侧无 native test target，无法在 CI 直接执行
#   - CMakeLists.txt 仅定义 llhttp_shared / llhttp_static 库目标，无 test 目标

package: llhttp/9.4.2
homepage: "https://github.com/nodejs/llhttp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 make check / ctest 目标，留空并以上方盘点说明代替
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无 native 测试套件（Node.js 侧测试不在本 tarball，且依赖 Node 运行时）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# 依据用户约束: 上游无测试时不少报——本消费者测试覆盖上游 Node.js 测试套件
# 在 C API 层面可等价验证的核心功能面（方法矩阵/回调/错误/pause-resume/响应）
test_package_tests:
  - file: test.c
    description: "消费者测试: 链接 libllhttp.so，6 个测试组共 53 项断言——GET 基础解析与回调、全方法矩阵(DELETE/GET/HEAD/POST/PUT/CONNECT/OPTIONS/PATCH + method_name 往返，CONNECT 按设计返回 HPE_PAUSED_UPGRADE)、chunked body 与 on_body/on_chunk_header/on_chunk_complete 回调、错误报告(llhttp_get_errno/llhttp_get_error_reason/llhttp_errno_name)、pause/resume 控制流、HTTP 响应解析(on_status/status_code/llhttp_finish)"
    command: "./test_llhttp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 53
