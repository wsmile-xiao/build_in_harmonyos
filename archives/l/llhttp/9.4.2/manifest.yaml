# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/9.4.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.4.2"

# 软件名
software: "llhttp"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/nodejs/llhttp/archive/refs/tags/release/v9.4.2.tar.gz"

  # 源码校验和
  sha256: "ba717a2f99f340a0ee9796aaf2b1acca057e1e37682ffd2bc4def4d3b6bc4005"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "llhttp 上游 CMake 不设 SOVERSION（无版本化 .so 实体），产物无 DT_SONAME：需 patchelf 补 SONAME + 剥旧签名段 + 自签，否则下游 DT_NEEDED 写入 conan cache 绝对路径，换机器无法加载"
  - "llhttp 对 CONNECT 请求按设计返回 HPE_PAUSED_UPGRADE（隧道升级暂停），测试断言不能写 HPE_OK；CONNECT 请求也不能带 Content-Length（RFC 7231 §4.3.6）"
  - "llhttp 官方测试套件在 Node.js 主仓（test/parallel/test-llhttp*.js），release tarball 无 native 测试目标，适配测试需自建消费者测试覆盖 C API 功能面"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
