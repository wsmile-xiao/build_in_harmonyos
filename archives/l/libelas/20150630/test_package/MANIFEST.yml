# test_package/MANIFEST.yml
# libelas 20150630.

package: libelas/20150630
homepage: http://www.cvlibs.net/software/libelas/

upstream_tests_exist: true
upstream_test_audit: "the upstream CMakeLists only builds the 'elas' demo; there is no test framework, but './elas demo' processes the 7 bundled img/ stereo pairs (the README documents it as the verification)"
upstream_check_command: "./elas demo (run in the source root); output = 14 *_disp.pgm files"
upstream_test_in_build: true
upstream_test_command: "./elas demo"

upstream_tests:
  - name: "elas demo (7 stereo pairs)"
    path: "img/ (bundled)"
    description: "computes left+right disparity maps for cones, aloe, raindeer, urban1..4"

test_package_tests:
  - file: test_libelas.cpp
    description: "synthetic textured stereo pair shifted by 6 px; checks that the majority of interior disparities recover the shift, the mean is within 1 px, and both maps are non-empty"
    command: "./libelas_consumer"

test_files:
  - path: "test_package/test_libelas.cpp"
    test_type: "R34"
    assertion_count: 6

test_package_test_count: 1
consumer_assertion_count: 6
assertion_count: 6
