  sha256: "c7cb4e10de04a4392031baf21a4f4b7b6615d47eedd4e7f9bb70468a31e0686e"

# Portability header providing the x86 SSE intrinsics libelas uses on top of
# ARM NEON.  Fetched (not vendored) so the recipe diff stays small.
sse2neon:
  url: "https://codeload.github.com/DLTcollab/sse2neon/tar.gz/refs/tags/v1.8.0"
  sha256: "e251746e3b761f3f0de1ad462b1efe53532341b6b0498d394765fceb85ce8a46"
  filename: "sse2neon-v1.8.0.tar.gz"

patches:
  - patch_file: "patches/0001-port-sse-to-neon.patch"
    patch_description: "libelas is x86-only: elas.h and descriptor.cpp unconditionally include <emmintrin.h>. Include the bundled SSE2NEON header instead on non-x86 targets so the SSE2 intrinsics used by elas.cpp map to NEON."
    patch_type: "portability"
