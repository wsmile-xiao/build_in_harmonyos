patches_applied:
  - "0001-port-sse-to-neon.patch（非 x86 用 sse2neon.h 替代 <emmintrin.h>）"

knowledge_gained:
  - "libelas 是 x86 专用：elas.h/descriptor.cpp 无条件 #include <emmintrin.h>，elas.cpp 用 _mm_* SSE2，CMakeLists 硬编码 -msse3；Debian 也只发布了 amd64 二进制"
  - "SSE2NEON（DLTcollab，MIT）单头覆盖本库用到的全部 22 个 _mm_* 内建（含 _mm_malloc/_mm_free）；在 aarch64 上以 NEON 实现，可直接替换 emmintrin.h"
  - "elas.h 的私有方法签名暴露 __m128i，因此 sse2neon.h 必须随 elas.h 一起安装，消费者头文件才能编译"
  - "绕过上游 CMake（其 SET(CMAKE_CXX_FLAGS -msse3) 会清空工具链 flags）直接编译，避免 SSE 标志与 CMake 变量覆盖"
  - "libc++ 不会经 <iostream> 传递包含 <algorithm>，demo 的 main.cpp 用 max() 需显式 -include algorithm"
