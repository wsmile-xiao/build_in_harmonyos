software: libpagemaker
display: "libpagemaker"
description: "Library for importing and converting Adobe PageMaker documents (LibreOffice DLP)"
category: document
homepage: "https://wiki.documentfoundation.org/DLP/Libraries/libpagemaker"
license: MPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "需替换 config.guess/config.sub 为 HarmonyOS-aware 版本"
    - "config.status umask 077 在 HMDFS 上需修复（mktemp wrapper 方案）"
    - "--disable-werror 必须使用（boost 头文件触发 -Wdeprecated-copy 警告）"
    - "R26 静态链接需同时修改 librevenge .la 文件和使用 -static -Wl,-Bstatic"
  common_dependencies:
    - "librevenge/0.0.5"
    - "boost (headers only)"

versions:
  "0.0.3":
    status: built
    compile_date: "2026-06-25"
    functional_test: "2026-06-26 PASS (50/50)"
