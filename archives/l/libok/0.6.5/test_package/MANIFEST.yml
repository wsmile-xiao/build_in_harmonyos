# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libok/0.6.5
homepage: "https://github.com/jwerle/libok"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# libok 只有一个上游测试源 test.c（单 main TAP 程序，8 个断言：
# ok_expect(4) + 4 个 ok() + 1 个 notok() 失败路径 + ok_done 两次校验），
# 通过 make test 编译为 ok-test 并直接运行（make check 需 valgrind，
# 本环境无 valgrind，等效直接运行 ./ok-test）。
upstream_tests:
  - file: test.c
    source: libok-0.6.5/test.c
    description: "libok TAP 输出库上游冒烟测试（ok_expect/ok/notok/ok_done）"
    command: "./ok-test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：通过公开头文件 ok.h 与静态库调用 ok_expect/ok/ok_done"
    command: "./test_libok"
  - file: test_ohos.c
    description: "鸿蒙特有测试：管道捕获 stdout，校验 OHOS 目标上 TAP 计划行/ok 计数/notok 失败检测/ok_done 汇总与 pass/fail 输出"
    command: "./test_ohos"

# 测试断言总数 (上游 test.c 的 TAP 断言行：计划 1..4 的 4 个 ok + 计划 1..2 的 1 个 ok + 1 个 notok；
# ok_expect 设置计划、ok_done 输出汇总校验，均不计入断言数)
assertion_count: 6
