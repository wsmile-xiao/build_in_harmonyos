knowledge_gained:
  - "lang-preflight 对 clib 生态 C 库误判：package.json 仅含发布辅助脚本（version: update-clib-json）时被误判为 nodejs/npm → mixed；真实语言由 Makefile/clib.json 与 100% C 源码决定（R47 辅助脚本不算主体边界规则）"
  - "上游 ok_explain() 边界缺陷：while (explaination[i] != '0') 把 '\\0' 写成字符 '0'，多行注释解析读越界产生乱码字节；不影响断言，TAP 输出仍完整，测试退出码 0"
