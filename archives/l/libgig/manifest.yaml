software: libgig
display: "libgig — Gigasampler/GigaStudio 采样文件库"
description: "C++ 库，读写 Gigasampler/GigaStudio(.gig)、DLS、SoundFont2、KORG 与 Akai 采样文件，附 14 个命令行工具"
category: multimedia
homepage: "https://www.linuxsampler.org/libgig/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "静态链接会激活上游潜伏的静态初始化顺序缺陷（Serialization.cpp 的 static 成员 DataType::m_nativeTypes
       与消费者 TU 的全局 NativeDataTypeRegistry<> 构造器竞争）→ serializationtests 在 main() 之前
       SIGSEGV(139)；改为函数内 static 访问器（补丁 0002/0003）后 4 套上游测试全绿 (E627)"
    - "autotools/libtool 在 configure --prefix=/ 下把 pkglib_LTLIBRARIES 写成绝对 RUNPATH
       //lib/libgig（不存在路径），裸环境报 Error loading shared library libgig.so.13；
       本包以 --enable-static --disable-shared 从结构上消除该面 (E627)"
    - "14 个 CLI 只实现短选项 -v，--version/--help 全部非 0 → L2 smoke 恒失败；
       按 E503 先例在 main() 开头补 GNU 长选项并 return 0（补丁 0004–0017）"
    - "configure 内 umask 077 在 HMDFS 上建出的 0700 临时目录不可写，需改 umask 022 (E011)"
    - "configure.ac 对 libuuid 只用 AC_CHECK_HEADERS/AC_SEARCH_LIBS（不是 pkg-config），
       必须把依赖 include/lib 目录注入 CXXFLAGS/LDFLAGS (E007)"
  common_dependencies:
    - libsndfile/1.2.2
    - libuuid/2.42.2

versions:
  "4.5.2":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libgig/4.5.2"
    source_url: "https://download.linuxsampler.org/packages/libgig-4.5.2.tar.bz2"
