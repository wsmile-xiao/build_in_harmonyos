knowledge_gained:
  - "libgig 的 14 个 CLI 工具只实现短选项 -v，--version/--help 全部落进 'Unknown option' 或 fopen 失败分支并以 EXIT_FAILURE 退出，L2 smoke 探针（--version/--help/-V/-h）对全部 14 个恒失败；按 E503 先例在 main() 开头拦截 --version/--help 并 return 0"  # knowledge_ref: E503
  - "libgig 静态链接会触发上游静态初始化顺序缺陷：Serialization.cpp 的 static 成员 DataType::m_nativeTypes 是动态初始化，而测试 TU 的全局 NativeDataTypeRegistry<> 构造器在自身 TU 的动态初始化阶段就调用 registerNativeDataType<>()，静态链接时测试对象排在库对象之前 → serializationtests 在 main() 之前 SIGSEGV(139)；最小复现：同一条链接命令里把 Serialization.o 显式排在测试对象之前即 rc=0（t4=139 / t4b=0）；改为函数内 static 访问器后 4 套上游测试全绿"  # knowledge_ref: E627
  - "autotools/libtool 在 configure --prefix=/ 下把 pkglib_LTLIBRARIES 的安装路径写成 //lib/libgig，14 个工具随之得到 RUNPATH=//lib/libgig（不存在的绝对路径），裸环境运行报 Error loading shared library libgig.so.13，而同一份 make check 日志全绿 —— 与 libfstfar 的 //lib RUNPATH 同族；本包以 --enable-static --disable-shared 从结构上消除该面（工具自包含，无 DT_NEEDED 无 RUNPATH）"  # knowledge_ref: E627
  - "libgig 的库产物落在 $(libdir)/libgig/（上游 pkglib_LTLIBRARIES），不在 lib/ 顶层：package_info() 的 cpp_info.libdirs 必须含 lib/libgig，否则消费者链接期找不到 -lgig；头文件同样装在 include/libgig/，G4 的 lib/ 顶层扫描看不到 .a/.so 属正常"  # knowledge_ref: E627
  - "configure.ac 对 libuuid 只用 AC_CHECK_HEADERS/AC_SEARCH_LIBS/AC_CHECK_FUNCS（不是 pkg-config），只靠 PKG_CONFIG_PATH 不够：必须把依赖的 include/lib 目录分别注入 CXXFLAGS/LDFLAGS，AC_SEARCH_LIBS(uuid_generate, uuid) 才能在 LDFLAGS 里找到 -luuid"  # knowledge_ref: E007

