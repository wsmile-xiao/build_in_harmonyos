# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 build_and_test.sh L0e 强制要求存在）
package: libgig/4.5.2
homepage: "https://www.linuxsampler.org/libgig/"

# 上游测试入口：src/testcases/Makefile.am 的 `check:` 目标（非 automake TESTS 机制，
# 是显式 check 规则），依次构建并执行 4 个测试程序。
upstream_check_command: "make check"

# conanfile.py 的 build() 内已集成上游测试（make check + 4 个测试程序逐个复跑）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（4 个，合计 406 条断言：90 + 104 + 84 + 128）
upstream_tests:
  - file: src/testcases/HelperTest.cpp
    source: libgig-4.5.2.tar.bz2
    description: "helper.cpp 路径辅助函数（strip2ndFromEndOf1st/parentPath/lastPathComponent/pathWithoutExtension/extensionOfPath）"
    command: "./helpertests"
  - file: src/testcases/SerializationTests.cpp
    source: libgig-4.5.2.tar.bz2
    description: "Serialization 框架（struct/vector/set/map、weak/strong 指针、多态、自引用）"
    command: "./serializationtests"
  - file: src/testcases/RiffTests.cpp
    source: libgig-4.5.2.tar.bz2
    description: "RIFF 容器层（建/存/读/收缩 chunk，RAM 与 IO 两种流）"
    command: "./rifftests"
  - file: src/testcases/GigWriteTest.cpp
    source: libgig-4.5.2.tar.bz2
    description: "Gigasampler 文件层（建文件、样本数据写入、校验和、复制、多线程加载）"
    command: "./gigtests"

# test_package 自带的消费者测试（鸿蒙侧新增，rule12 计数来源）
test_package_tests:
  - file: test_package/test_libgig.cpp
    description: "C++ 消费者：版本指纹 + RIFF 层往返 + gig 层结构往返（30 条断言，分节 3/7/20）"
    command: "./test_libgig"
  - file: test_package/conanfile.py
    description: "交付的 14 个 CLI 工具裸环境 smoke（unset LD_LIBRARY_PATH 后 --version/--help 必须 rc=0）"
    command: "sh -c 'unset LD_LIBRARY_PATH; exec ./<tool> --version'"

# 上游断言总数（4 个测试程序自报计数之和，源码级+运行级清点见 reports/test-report.md）
assertion_count: 406
