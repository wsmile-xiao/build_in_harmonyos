# 17 个补丁由 `refresh-patch --auto` 按被改源文件逐文件生成，分三组：
#   A. E007：config.guess 增加 HarmonyOS 识别分支（0001）
#   B. 静态链接下的静态初始化顺序修复（0002/0003）
#   C. CLI GNU 长选项 --version/--help（0004–0017，14 个工具各一个文件）
patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: "0001 config.guess add HarmonyOS detection branch (E007)"
    patch_type: "portability"
