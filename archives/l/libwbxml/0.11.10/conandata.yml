sources:
  url: "https://github.com/libwbxml/libwbxml/archive/refs/tags/libwbxml-0.11.10.tar.gz"
  sha256: "027b77ab7c06458b73cbcf1f06f9cf73b65acdbb2ac170b234c1d736069acae4"
patches:
  "0.11.10":
    - patch_file: "patches/0001-fix-ohos-test-runtime.patch"
      patch_description: "Fix launchTests.sh for OHOS musl loader: inject LD_LIBRARY_PATH/PATH so libwbxml2.so + libexpat.so.1 resolve at test runtime; widen mktemp template from XXX to XXXXXX for busybox/OHOS mktemp. NOTE: upstream CONFIGURE_FILE(launchTests.sh) is NOT @ONLY, so ${CMAKE_CURRENT_BINARY_DIR} is expanded by CMake at configure time — leave it as ${...}, do not switch to @...@."
      patch_type: "bugfix"
    - patch_file: "patches/0002-fix-expat-discovery-cmake4.patch"
      patch_description: "Fix Expat discovery for CMake >= 3.x/4.x: upstream calls FIND_PACKAGE( Expat REQUIRED ) which triggers module-mode lookup of FindExpat.cmake, but 0.11.10 dropped its bundled FindExpat and CMake 4.1 ships only FindEXPAT.cmake (uppercase). Renaming to FIND_PACKAGE( EXPAT REQUIRED ) selects CMake's official FindEXPAT module, which consumes EXPAT_INCLUDE_DIR/EXPAT_LIBRARY cache vars already set by the recipe. No source/tests changed."
      patch_type: "bugfix"
