# 版本级 manifest
# 文件位置: archives/l/libmspub-tools/0.1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.4"

# 软件名
software: "libmspub-tools"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://dev-www.libreoffice.org/src/libmspub/libmspub-0.1.4.tar.xz"

  # 源码校验和
  sha256: "ef36c1a1aabb2ba3b0bedaaafe717bf4480be2ba8de6f3894be5fd3702b013ba"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--enable-static"
    - "--disable-shared"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "librevenge/0.0.5"
    - "icu4c/78"
    - "zlib/1.3.1"
    - "boost/1.90.0.3"
    - "pkgconf/3.0.5"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E2BIG: 切勿在 generate() 里 save_script('conanbuild')，会 self-source 死循环（printenv Argument list too long）"
  - "E165 姊妹陷阱: safe-bin/rm shim 的 #!/bin/bash shebang 在 OHOS 无效，须从 PATH 剔除 safe-bin（_sanitize_path）"
  - "libtool _LIBADD 里绝对路径 .a 会被当 convenience 库嵌入产物，须用 -L<la-free shadow> -l<name>"
  - "librevenge .la 带 libdir='//lib' 病灶（E236），la-free shadow 目录规避"
  - "package_info 不写 cpp_info.requires（icu4c 无 cmake_target_name，libvisio 同族先例）"
  - "上游无自动化测试（Makefile.am 无 TESTS），以 pub2raw/pub2xhtml CLI 实测 + test_package 鸿蒙消费者用例替代"
