# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libmspub-tools/0.1.4
homepage: "https://github.com/LibreOffice/libmspub"

# 上游测试命令（libmspub 上游无自动化测试套件：所有 Makefile.am 无 TESTS）
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 TESTS，上游测试入口 = 转换工具 CLI 本身）
upstream_tests:
  - file: src/conv/raw/pub2raw.cpp
    source: libmspub-0.1.4/src/conv/raw
    description: "Publisher -> raw 转换工具（上游测试入口，无自动化测试套件）"
    command: "pub2raw --version"
  - file: src/conv/svg/pub2xhtml.cpp
    source: libmspub-0.1.4/src/conv/svg
    description: "Publisher -> xhtml 转换工具（上游测试入口，无自动化测试套件）"
    command: "pub2xhtml --version"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: harmonyos_specific_test.cpp
    description: "鸿蒙消费者用例：编译期 __OHOS__/__aarch64__ 硬绑定 + 运行期真实链接 libmspub/librevenge/icu/zlib，调用 isSupported/parse 验证 ABI 可用"
    command: "./harmonyos_specific_test"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 4
