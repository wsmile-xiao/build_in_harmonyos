package: ldap-git-backup/1.0.8
homepage: "https://github.com/elmar/ldap-git-backup"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "prove t"
upstream_tests:
  - "001_help-option.t"
  - "010_read_ldif.t"
  - "020_entry-name.t"
  - "030_git-from-scratch.t"
  - "031_backup-to-existing-dir.t"
  - "040_delete-entry.t"
  - "050_modify-entry.t"
  - "060_custom_commit.t"
  - "061_no_change.t"
  - "070_mock-slapcat.t"
  - "071_safe-ldif.t"
upstream_test_note: >-
  上游 autotools 的 make check 即 `prove t`：11 个 .t 用例 + mock-slapcat
  （用 testdata/ 下 15 个 LDIF 假导出模拟 slapcat 输出）驱动两个 Perl 脚本
  的完整功能链（help/读 LDIF/条目名/git 建库/增量备份/删除/修改/自定义
  commit/无变更/safe-ldif），无需真实 LDAP 服务。其中 001_help-option.t
  与 031_backup-to-existing-dir.t 使用非核心模块 IPC::Run（仅作 stdout/
  stderr 捕获）；仓库无 IPC::Run 的 conan 配方（perl-ipc-run 仅旧管线归档
  knowledge 条目），故两用例由 test_package 原生等价覆盖；030_git-from-
  scratch.t 的 mode==0700 子断言在 OHOS FUSE 下无法复现（mkdir 0700 实际
  落盘 0771，存储守护进程钳制 mode），其余 9 条子断言由 test_package 原生
  等价覆盖（目录+.git 创建、1→2 个 revision）；其余 8 用例原样执行（其中
  040_delete-entry.t 依赖工具内 1 行 SIGPIPE 适配补丁——Git.pm command()
  空上下文提前关管道、OHOS 上 git rm 被 SIGPIPE 杀死致删除失效，真机实测
  后改为列表上下文，见 notes.md 真机记录第 5 条）。上游
  测试树按原相对布局随包安装于 share/ldap-git-backup/（@abs_*@ 已指向该
  目录），消费者在具备 IPC::Run 的环境可 `prove t` 全量复跑。
test_package_tests:
  - file: test_ldap_git_backup.sh
    description: >-
      真实消费者测试 5 组共 20 断言：① 执行包内 ldap-git-backup --help
      （Pod::Usage 渲染，断言退出码 0 且输出含 --help——上游 001 等价）；
      ② 断言运行时依赖 perl + Git.pm 可加载；③ 备份到已存在 0777 目录
      断言退出码 0 + world readable 告警 + 备份提交落库（上游 031 等价；
      world writable 位在 OHOS FUSE 下因目录 mode 被钳制为 2751 而不触发，
      上游 031 自身的 mode==0777 断言同样无法在 OHOS 复现，Linux/CI 上两
      告警均正常触发）；④ 全新目录建库 + 两次连续备份增量断言 6 条（上游
      030 等价：目录+.git 创建、1→2 个 revision；mode==0700 子断言在 OHOS
      FUSE 下无法复现——mkdir 0700 实际落盘 0771）；⑤ 在包内测试树以
      perl 核心模块 App::Prove 等价执行上游其余 8 个用例原样全过
      （mock-slapcat 假 LDAP 导出 + 临时 git 仓库端到端；不用 prove 脚本
      本身——conan perl 包自带的 prove shebang 坏，真机实测
      "//bin/perl: bad interpreter"，CI Linux 同样会挂）。
    command: "test_ldap_git_backup.sh <package-folder> <writable-work-root>"
assertion_count: 20
