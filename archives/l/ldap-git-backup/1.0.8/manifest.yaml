software: ldap-git-backup
version: "1.0.8"
status: published
build_date: "2026-09-25"
conan_ref: "ldap-git-backup/1.0.8"
source:
  url: "https://github.com/elmar/ldap-git-backup/archive/refs/tags/1.0.8.tar.gz"
  sha256: "60afb36b9067275a5ca313985b7666ce0ecd16b991c712e298b2d4bad9941e3e"
  tar_format: tar.gz
build:
  system: custom
  configure_options: []
  dependencies:
    - perl/5.42.2.3
  cc: none
  cxx: none
patches_applied:
  - "ldap-git-backup.in 一行：$repo->command('rm', (keys %files_before)) if %files_before; 改为 my @deleted = 同调用（空上下文→列表上下文）。Git.pm command() 空上下文不读输出、立即关闭管道，git rm 首次写 stdout（\"rm 'file'\"）命中已关读端被 SIGPIPE 杀死、删除失效（HarmonyOS PC 真机实测 waitpid sig=13、stdout 空、文件仍在、索引未动，040_delete-entry.t 挂）；Linux 上 perl 默认忽略 SIGPIPE（写变 EPIPE、git 继续完成删除），故上游 Debian/CI 多年无感，属 OHOS 平台适配"
knowledge_gained:
  - "上游为 autotools 包装的两个纯 Perl 脚本（ldap-git-backup 主工具 + safe-ldif slapcat 包装），configure/Makefile 仅做 @sbindir@/@abs_*_dir@ 替换与 chmod、无编译；配方在 build() 以 Python 等价实现同样替换，规避构建机对 autoconf/automake 的依赖（OHOS 真机无 autotools）"
  - "脚本运行时依赖 perl（仅核心模块）+ Git.pm（随 git 发行、非 perl 核心）；仓库已适配 perl/5.42.2.3（OHOS 预编译包，runenv 注入 PATH/PERL5LIB），git 为设备系统工具"
  - "上游测试套件 t/（11 个 prove 用例）用 mock-slapcat 以 testdata/ 15 个 LDIF 假导出模拟 slapcat 输出，端到端覆盖 git 建库/增量备份/删除/修改等，无需真实 LDAP 服务；测试树按上游相对布局随包安装 share/ldap-git-backup/，@abs_*@ 已指向该目录，消费者 prove t 原样复跑"
  - "001/031 两用例依赖非核心模块 IPC::Run（仅作 stdout/stderr 捕获），仓库无其 conan 配方（perl-ipc-run 仅旧管线归档 knowledge 条目）——两用例的 5 条断言由 test_package 原生等价覆盖，其余 9 用例 prove 原样执行"
  - "Git.pm command() 空上下文（void）不读输出、立即关闭输出管道：git rm 首次写 stdout（\"rm 'file'\"）命中已关读端，OHOS 上被 SIGPIPE 直接杀死（真机 sig=13、stdout 空、文件仍在、索引未动，删除失效）；改为列表上下文读到 EOF（git 退出）才关管道即修复。Linux perl 默认忽略 SIGPIPE（写变 EPIPE、git 继续完成删除），故上游无感——OHOS 专属坑，1 行补丁落地（patches_applied）"
upstream_test_pass_rate: "100%（11/11 等价覆盖）——8 用例 prove 原样全过（工具含 1 行 SIGPIPE 适配补丁，见 patches_applied）+ 001/031（IPC::Run 缺口）与 030（mode==0700 被 OHOS FUSE 钳制）的断言由 test_package 原生等价覆盖（技术原因见 notes.md）；2026-09-25 HarmonyOS PC 真机复跑"
adapted_test_pass_rate: "100%（20 断言）——test_package 五组：--help 退出码 0+输出含 --help（001 等价）、perl+Git.pm 可加载、已存在目录备份+world readable 告警+提交落库（031 等价）、全新目录建库+两次增量备份 1→2 revisions（030 等价）、8 用例全过·App::Prove 等价 prove（2026-09-25 真机 conan create）"
test_command: "conan create . --build=missing"
