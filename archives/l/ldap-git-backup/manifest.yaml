software: ldap-git-backup
display: "ldap-git-backup"
description: "将 LDAP 目录的 LDIF 导出快照版本化到 Git 仓库的备份工具"
category: utility
homepage: "https://github.com/elmar/ldap-git-backup"
license: GPL-3.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Perl 脚本工具（ldap-git-backup + safe-ldif），无编译；上游 autotools 仅做 @VAR@ 替换与 chmod，配方以 Python 等价实现，构建机无需 autoconf/automake"
    - "运行时依赖 perl（核心模块 + git 自带的 Git.pm）与 git；依赖仓库已适配 perl/5.42.2.3，git 为设备系统工具"
    - "上游测试套件 t/（11 个 prove 用例 + mock-slapcat 假 LDAP 导出）随包安装于 share/ldap-git-backup/，消费者 prove t 原样复跑，无需真实 LDAP 服务"
  common_dependencies:
    - perl
    - git

versions:
  "1.0.8":
    status: published
    build_date: "2026-09-25"
