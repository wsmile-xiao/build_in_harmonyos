# 版本级 manifest — libportal-gtk4 0.10.0
# 遵循 ARCHIVE-SPEC v2.0

version: "0.10.0"
software: libportal-gtk4

# published | built | failed | archived
status: built

build_date: "2026-09-23"
build_system: meson

source:
  url: "https://github.com/flatpak/libportal/releases/download/0.10.0/libportal-0.10.0.tar.xz"
  upstream_url: "https://github.com/flatpak/libportal"
  sha256: "1c74a3f7becbd4ff745d7f565afd06e97e50eb080a0e268cb14bb55289a745bf"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dbackend-gtk4=enabled"
    - "-Dbackend-gtk3=disabled"
    - "-Dbackend-qt5=disabled"
    - "-Dbackend-qt6=disabled"
    - "-Dintrospection=false"
    - "-Dvapi=false"
    - "-Ddocs=false"
    - "-Dtests=false"
  dependencies:
    - glib/2.84.0.1.1
    - gtk4/4.22.4
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "libportal 0.10.0 gtk4 backend（libportal-gtk4.so/pc）：与 gtk3 backend 共存于同一源码树，仅 meson feature 开关不同；glib 需对齐 gtk4/4.22.4 依赖图用 2.84.0.1.1，避免闭包内出现两个 glib 版本"
  - "portal-gtk4.c 的 X11/Wayland 代码全部在 GDK_WINDOWING_* 守卫内，broadway flavor 的 gtk4 下自然编译排除，无需平台补丁"
