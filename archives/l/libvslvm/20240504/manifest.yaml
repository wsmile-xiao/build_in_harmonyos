# 与测试脚本；唯一例外是 OHOS 构建期（在 Conan 缓存副本上）把随包 configure 内 2 处
# `umask 077` 改为 `022`（HMDFS 必需，E011）——详见 notes.md「R6 声明」。
patches_applied: []

knowledge_gained:
  - "HMDFS 上 autotools configure 的 umask 077 会生成连创建者都无法写入的 0700 临时目录；OHOS 构建期把源码树 configure 内 2 处 umask 077 改为 022 并全程 umask 022 即通过（同族 libvsgpt/libvslvm 两代发行包 configure 各有 2 处该形态）"  # knowledge_ref: E011
  - "合成合法 LVM2 物理卷镜像做消费者测试的最小口径（设备实测可被 libvslvm 完整读回）：LABELONE 标签按 LVM2 默认 labelsector=1 放扇区 1——libvslvm 的 check_volume_signature_file_io_handle 只探测固定偏移 512，而 handle open 扫描 0/512/1024/1536 四个扇区，放扇区 1 才能同时通过两者；pv_header 32 字节标识符 + 数据/元数据区描述符各以 16 字节全零项终止（元数据区描述符须恰 1 条）；元数据区头 512 字节（校验和在 +0、签名「 LVM2 x[5A%r0N*>」在 +4、raw location descriptor 在 +40 以 24 字节全零项终止，其 offset 按真 LVM2 语义为元数据区相对偏移——libvslvm 解析时存 file_offset+offset）；LVM2 元数据文本的 id 必须是 38 字符 6-4-4-4-4-4-6 连字符 UUID（解析器要求 identifier_size == 39 含终止符）；解析器把 extent_size 按 ×512 存储（元数据写 8192 则 get_extent_size 读 4194304），段 offset/size 按 start_extent/extent_count × 存储值换算"  # knowledge_ref: DRAFT-E593-libvslvm-lvm2-image-fixture-and-api-contract
  - "libvslvm 公共 API 消费边界与返回值约定：initialize/getters/set_codepage 成功返回 1、close 成功返回 0、free 成功返回 1、关闭未打开句柄按设计返回 -1；error_sprint 只打最外层帧（空白卷打开的最外层文案是 unable to open handle，内层 unsupported number of metadata area descriptors 要用 error_backtrace_fprint 才可见）；check_volume_signature 返回 1/0/-1；逻辑卷数据读取（read_chunk_data）是内部 API（入参为 libfdata vector 内部对象），消费者可达的最深链路是签名→打开→卷组→物理卷→逻辑卷→段→条带的元数据链"  # knowledge_ref: DRAFT-E593-libvslvm-lvm2-image-fixture-and-api-contract
  - "libvslvm 的 vslvmmount 全部 fuse 代码在 HAVE_LIBFUSE 守卫内，无 libfuse 的 OHOS 按上游设计编译为无挂载支持形态（-V/-h 可用），bin_PROGRAMS 无条件含 vslvminfo/vslvmmount，两者都交付并在 commands.json 声明"  # knowledge_ref: DRAFT-E593-libvslvm-lvm2-image-fixture-and-api-contract

