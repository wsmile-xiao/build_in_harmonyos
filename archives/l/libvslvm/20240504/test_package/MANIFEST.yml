package: libvslvm/20240504
homepage: https://github.com/libyal/libvslvm

# 上游测试入口（在 build() 内执行，见 conanfile.py 与 notes.md）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游注册的可执行测试单元（口径：automake 的 TESTS + check_PROGRAMS 两个注册面）
upstream_tests:
  - name: "test_library.sh"
    source: tests/test_library.sh
    description: "库测试入口：驱动 15 个无输入 C 测试程序（checksum chunk_data data_area_descriptor error io_handle logical_volume logical_volume_values metadata metadata_area notify physical_volume raw_location_descriptor segment stripe volume_group）；LIBRARY_TESTS_WITH_INPUT 的 handle/support 在无 input/ 时按上游逻辑退化为无输入运行"
    command: "./tests/test_library.sh"
  - name: "test_tools.sh"
    source: tests/test_tools.sh
    description: "工具函数测试入口：驱动 info_handle / output / signal 3 个 C 测试程序"
    command: "./tests/test_tools.sh"
  - name: "test_vslvminfo.sh"
    source: tests/test_vslvminfo.sh
    description: "vslvminfo 元数据输出测试入口：依赖 tests/input/ 夹具；发布用 release tarball 不含该目录，按上游规则 SKIP（exit 77）"
    command: "./tests/test_vslvminfo.sh"
  - name: "check_PROGRAMS (20)"
    source: tests/Makefile.am
    description: "20 个 C 测试程序（checksum chunk_data data_area_descriptor error handle io_handle logical_volume logical_volume_values metadata metadata_area notify physical_volume raw_location_descriptor segment stripe support tools_info_handle tools_output tools_signal volume_group）"
    command: "make check"

test_package_tests:
  - file: test_libvslvm.c
    description: "通用消费者断言：版本串（上游 20240504）、访问标志、codepage 正常/错误路径与 error_sprint、空白卷 check_volume_signature==0、handle 生命周期（close 未打开句柄按设计 -1）、无标签打开失败、缺文件打开失败（21 项断言）"
    command: "./test_libvslvm"
  - file: test_ohos.c
    description: "鸿蒙专项消费者测试：__OHOS__ 编译目标、TMPDIR 语义（存在/非 /tmp/可写）、在 TMPDIR 下合成合法 LVM2 物理卷镜像（扇区 1 的 LABELONE 标签 + pv_header + 数据/元数据区描述符 + 元数据区头 + raw location descriptor 相对偏移 + LVM2 元数据文本，weak CRC-32 全部正确）并用已安装库读回全链路：签名→打开→卷组→物理卷→逻辑卷→段→条带（31 项断言）"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  # 计数口径：本列表逐项给出**互不重叠**的消费者测试程序与断言数，
  # assertion_count = test_libvslvm.c 的 21 项 + test_ohos.c 的 31 项 = 52。
  - name: "ohos-consumer-tests"
    description: "test_ohos.c（鸿蒙专项消费者测试）：__OHOS__ 编译目标、TMPDIR 语义、在 TMPDIR 下合成合法 LVM2 物理卷镜像（LABELONE 标签按 LVM2 默认 labelsector=1 放扇区 1——libvslvm 的 check_volume_signature 只探测固定偏移 512，而 handle open 扫描前 4 个扇区；raw location descriptor 的 offset 按 LVM2 语义为元数据区相对偏移；weak CRC-32 初值 0xf597a6cf 无终 XOR）并用已安装库读回：签名→打开→卷组（名/标识符/seqno/extent）→物理卷（名/标识符/设备路径）→逻辑卷（名/标识符/段数）→段（offset/size）→条带（指向 pv0）"
    command: "./test_ohos"
    assertions: 31
    platform: OHOS
  - name: "generic-consumer-tests"
    description: "test_libvslvm.c（通用消费者断言）：版本串、访问标志、codepage 正常/错误路径、check_volume_signature 的 0/-1 路径、handle 生命周期（该程序在 OHOS 上同样编译运行，但断言内容不依赖平台特性）"
    command: "./test_libvslvm"
    assertions: 21
  - name: "installed-cli-load"
    description: "安装后的 bin/vslvminfo -V 与 bin/vslvmmount -V 必须能加载共享库并输出版本串（含 20240504）（运行/加载验证，在 test() 内执行；是运行检查，不计断言数）"
    command: "vslvminfo -V && vslvmmount -V"
    assertions: 0
    platform: OHOS

assertion_count: 52
