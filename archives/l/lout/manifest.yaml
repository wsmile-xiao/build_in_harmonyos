# lout 软件级 manifest
software: lout
display: "Lout"
description: "Basser Lout 文档排版系统（Jeffrey H. Kingston），将 Lout 源文档排版为 PostScript/PDF/纯文本输出"
homepage: "https://savannah.nongnu.org/projects/lout/"
license: GPL-2.0-only
repository: https://github.com/william8000/lout
category: publishing
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "catopen() 失败返回 (nl_catd)-1 哨兵（非 NULL），musl catgets() 解引用即 SIGSEGV —— condcatgets 宏须同时判 0 与 -1"
    - "运行时树（include/data/hyph/maps/font）按 $LOUTLIB > argv0 相对 ../../lib > 编译期 LIB_DIR 解析，交叉部署必须设 LOUTLIB"
    - "makefile 自带 CFLAGS（-ansi -std=c99），CC 变量是唯一工具链注入口（R33：从 tools.build:compiler_executables conf 读取）"
    - "上游 make test 需上一版（3.40）参照二进制做 diff；可运行核心 = lout -r3 all 全量手册 3 遍格式化"
  common_dependencies: []

# 版本索引
versions:
  "3.43.4":
    status: built
    build_date: "2026-09-15"
