# 版本级 manifest — lout/3.43.4
# 遵循 ARCHIVE-SPEC v2.0

version: "3.43.4"
software: lout

status: built
build_date: "2026-09-16"
build_system: makefile
test_passed: 10
test_failed: 0

source:
  url: "https://codeload.github.com/william8000/lout/tar.gz/refs/tags/3.43.4"
  sha256: "5cc2700f842860dd4d0af95ef5aff8cf9fe1e155d04ee951f790697aa27e7807"
  tar_format: tar.gz
  upstream_note: >
    3.43.4 的官方分发源是作者 Jeffrey Kingston 的 GitHub 仓库
    william8000/lout（FreeBSD ports print/lout distinfo 同样指向该
    GitHub tag）；Savannah 与 SourceForge 仅托管到 3.40，作者个人主页
    www.it.usyd.edu.au/~jeff/ 已失效（大学网站改版）。

build:
  system: makefile
  configure_options:
    - "无 configure；通过 make 变量注入：CC（OHOS 交叉工具链）、DESTDIR/BINDIR/LOUTLIBDIR/MANDIR"
  dependencies: []
  cc: clang
  cxx: ""

patches_applied:
  - patches/0001-guard-catgets-against-invalid-nl_catd-sentinel.patch

product:
  executables:
    - bin/lout
    - bin/prg2lout
  shared_library: none
  shared_note: >
    上游 makefile 唯一链接规则是 lout: $(OBJS)（纯可执行文件），
    make install 仅安装 bin + 数据树；不存在 .so 产物，故无 shared 选项。

knowledge_gained:
  - "catopen() 失败返回 (nl_catd)-1 哨兵而非 NULL；lout 的 condcatgets 宏只判 NULL，OHOS musl 的 catgets() 会解引用无效描述符直接 SIGSEGV（glibc 容忍并返回 fallback 字符串）——参照上游 3.43 对 catclose 的同类修复加哨兵检查 → DRAFT-E577"
  - "lout 运行时树（include/data/hyph/maps/font）通过 $LOUTLIB > argv0 相对路径 > 编译期 LIB_DIR 解析；-I/-H/-D 只是前缀追加且不覆盖 maps/font，干净布局必须用 LOUTLIB"
  - "OHOS conan：独立 conan test 时 settings_build 被强制 Linux/x86_64，can_run() 恒 False，test_package 若用其门控会静默跳过并使 L1e 负测试假通过"
  - "make install 会执行 lout -x 重建 hyph packed 数据库（依赖 LC_ALL=C 环境）"
  - "上游 make test 需要 lout-3.40 参照二进制做 diff 对比（OHOS 不存在）；其可运行核心 = lout -r3 all 全量用户手册 3 遍 PS 格式化（约 400 页 / 327 页输出）；plain 后端多遍（-p -r2+）会截断为前页，是上游固有行为（未打补丁的原版二进制输出逐字节相同），plain 验证用 -p -r1 单遍完整输出"
  - "doc/user 文件无扩展名（all/mybook/bas...），@Include 从 cwd 解析，测试必须在输入副本目录中运行"
