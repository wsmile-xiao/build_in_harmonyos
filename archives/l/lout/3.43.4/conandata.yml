patches:
  - patch_file: "patches/0001-guard-catgets-against-invalid-nl_catd-sentinel.patch"
    patch_description: "OHOS musl: catopen() 失败返回 (nl_catd)-1 哨兵，lout 的 condcatgets 宏只判 NULL，-1 传入 catgets() 后 OHOS musl 直接解引用无效描述符导致 SIGSEGV（glibc 容忍并返回 fallback 字符串，上游因此未察觉）；参照上游 3.43 对 catclose 的同类修复方式增加哨兵检查"
    patch_type: "bugfix"
