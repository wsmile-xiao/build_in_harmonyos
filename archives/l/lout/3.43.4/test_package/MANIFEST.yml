# test_package/MANIFEST.yml — lout/3.43.4
scope: consumer
purpose: >
  验证 Conan 包可被独立消费者安装并完整使用：二进制可达、版本冒烟、
  真实文档格式化（PS + plain text 双后端，通过 LOUTLIB 指向包内 res/lib
  运行时树）、prg2lout 伴随工具可用。

ohos_specific:
  - id: ohos-elf
    what: ELF 架构与解释器
    how: file + readelf -l 断言 arm64 ELF 且 INTERP 为 /ld-musl-aarch64
  - id: ohos-hardening
    what: 安全加固
    how: readelf -lW 断言 GNU_RELRO 段存在且 GNU_STACK 无 RWE（NX）
  - id: ohos-link
    how: readelf -d 断言 NEEDED 仅为 musl libc/ld
  - id: ohos-runtime
    what: 运行时错误处理回归
    how: 缺失输入文件必须非零退出且无信号（rc<128，防 SIGSEGV 回归——
      patch 0001 catgets (nl_catd)-1 哨兵修复的回归守卫）

upstream_test_coupling:
  relation: derived
  detail: >
    hello.lout 触发的排版管线（字体/映射/数据库加载 + 分页输出）与上游
    make test 用 user 手册驱动的管线相同；build() 内已运行上游测试核心
    （lout -r3 all 全量用户手册 PS 后端 + lout -p -r1 all 全量用户手册 plain 后端），此处为消费者侧最小
    等价复验。

counts:
  new_tests: 8
  upstream_tests_used: 0
  notes: 上游 make test 的对比部分需 lout-3.40 参照二进制（OHOS 不存在），
    其可运行核心（-r3 全手册格式化）在配方 build() 中执行。
