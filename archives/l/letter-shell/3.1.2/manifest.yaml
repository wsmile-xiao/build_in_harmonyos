# 版本级 manifest — letter-shell 3.1.2
# 遵循 ARCHIVE-SPEC v2.0

version: "3.1.2"
software: "letter-shell"
status: built
build_date: "2026-09-22"
build_system: custom

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/NevermindZZT/letter-shell"
  sha256: "d98d62749c5112327ed95c247fedb234f569c7981cc6d13c1afc15b871a20daf"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 嵌入式 shell 库，上游为 copy-into-project 风格（无独立构建系统），
  # 配方直接编译 src/*.c 并用 llvm-ar 归档静态库。
  system: custom
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "嵌入式库（copy-into-project 风格）无构建系统时，配方可用 clang 直接编译 src/*.c + llvm-ar 归档静态库（参考 micro-ecc 模式）"
  - "letter-shell 的 SHELL_EXPORT_CMD 依赖 shellCommand 链接段符号 _shell_command_start/_shell_command_end，消费者链接须提供 KEEP(*shellCommand) 链接脚本片段（INSERT AFTER .data 可复用默认脚本）"
  - "shellRun 执行 SHELL_TYPE_CMD_MAIN 命令时以 (argc, argv) 调用；SHELL_TYPE_CMD_FUNC 则以解析后的 int 参数调用，消费者测试需按 main 型命令导出"
