# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
# letter-shell 3.1.2 官方 tag 源码为嵌入式库（copy-into-project 风格），
# 无独立测试框架：无 tests/ 目录、无 ctest/make check 注册、无测试断言。
# 上游唯一构建入口 demo/x86-gcc/CMakeLists.txt 是可交互终端 demo（非自动化测试）。
# 详见最终回报中的上游测试枚举台账（完整文件清单逐项分类）。

package: letter-shell/3.1.2
homepage: "https://github.com/NevermindZZT/letter-shell"

# 上游无测试命令（无 configure/make/ctest 测试目标）
upstream_check_command: ""

# conanfile.py build() 中未集成上游测试（上游无测试框架）
upstream_test_in_build: false
upstream_test_command: ""

# 上游无独立自动化测试程序（demo 为交互式演示，不计入测试用例）
upstream_tests: []

# test_package 自带测试（消费者视角验证 + OHOS 专项验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：shellInit/shellRun/SHELL_EXPORT_CMD 真实调用公开 API"
    command: "./test_letter-shell"
  - file: test_ohos.c
    description: "HarmonyOS 专项测试：aarch64 平台断言 + shell 命令执行验证"
    command: "./test_letter-shell_ohos"

# 测试断言总数（两个自建用例的运行时断言之和，近似值）
assertion_count: 8