package: libfsxfs/20240501
homepage: https://github.com/libyal/libfsxfs

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - name: "libfsxfs library tests"
    source: tests/test_library.sh
    description: "Upstream shell runner for the library unit tests (20 argument-only programs plus support and volume)"
    command: "./tests/test_library.sh"
  - name: "fsxfstools tests"
    source: tests/test_tools.sh
    description: "Upstream fsxfstools helper tests: info_handle, output, signal"
    command: "./tests/test_tools.sh"
  - name: "fsxfsinfo tests"
    source: tests/test_fsxfsinfo.sh
    description: "fsxfsinfo metadata output checks; skips (exit 77) because the release archive ships no tests/input directory"
    command: "./tests/test_fsxfsinfo.sh"

test_package_tests:
  - file: test_libfsxfs.c
    description: "Consumer API version, flags, codepage, error, and volume lifecycle checks"
    command: "./test_libfsxfs"
  - file: test_ohos.c
    description: "OHOS-specific consumer test: compile-time OHOS target check and writable TMPDIR file lifecycle"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "ohos-tmpdir-file-lifecycle"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、TMPDIR 非 /tmp、临时文件读写和清理"
    command: "./test_ohos"
    assertions: 5
    platform: OHOS

assertion_count: 14
