license: LGPL-3.0-or-later
status: built
build_system: autotools
build_date: "2026-09-19"
conan_ref: "libfsxfs/20240501"

source:
  url: "https://deb.debian.org/debian/pool/main/libf/libfsxfs/libfsxfs_20240501.orig.tar.gz"
  sha256: "b2abc65377fcffefdcf2d426b86b5fc06322380b3766d61b7074048fa1cf4717"
  tar_format: tar.gz
  upstream_release_url: null
  upstream_tag: null
  upstream_commit: null
  release_artifact: >-
    Debian pristine orig tarball（无 +dfsg、无重打包）。上游 GitHub 仓库已重置：
    2026-09-19 实测 `git ls-remote --tags https://github.com/libyal/libfsxfs` 只剩
    refs/tags/20260703 与 refs/tags/20260901，20240501 的 tag 与 release 资产均不存在
    （releases/download/20240501/... 与 archive/refs/tags/20240501.tar.gz 实测均 HTTP 404），
    因此无法给出上游 tag/commit 与 release 资产名。tarball 的内容哈希由 Debian PGP 签名的
    libfsxfs_20240501-1.dsc 锚定：Checksums-Sha256 声明
    b2abc65377fcffefdcf2d426b86b5fc06322380b3766d61b7074048fa1cf4717  1714269
    libfsxfs_20240501.orig.tar.gz，与本任务下载件 sha256sum 逐字节一致；
    文件魔术 1f 8b、`gzip -t` 通过。属权威发行版镜像口径，非「Debian 重打包」——
    这就是 libyal 的发布包本身（自带 15 个 bundled libyal 组件与生成好的 Autotools 文件）。

build:
  system: autotools
  configure_options:
    - "--disable-python"
    - "--with-libfuse=no"
    - "--enable-static-executables=no"
    - "--enable-shared"
    - "--disable-static"
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfdatetime
    - libfguid
    - libhmac
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 平台适配全部内联在 conanfile.py 的 generate()/build()（平台三元组、umask、测试运行方式），
# 不修改任何上游 C 源文件，故本列表为空。
patches_applied: []

knowledge_gained:
  # 每条行尾引用最接近的条目（写法遵循容器层口径：# knowledge_ref: <条目/新草稿号>）。
  - "发布包自带 config.guess（2024）不识别 HarmonyOS（uname -s = HarmonyOS），必须显式传 --build/--host；且自带 config.sub 里 `grep -c ohos` = 0，实测 ./config.sub aarch64-unknown-linux-ohos rc=1（OS 'ohos' not recognized）→ 回落 aarch64-unknown-linux-gnu，且 --build 与 --host 必须相同（build==host 时 configure 打印 cross compiling... no，AC_RUN_IFELSE 正常执行）。"  # knowledge_ref: E007
  - "同族不同版本的 config.sub 能力不同（libvhdi 20251119 接受 linux-ohos，libfsxfs 20240501 不接受）——三元组必须现场用 ./config.sub <triplet> 取证，不能按族照抄。"  # knowledge_ref: DRAFT-E587-libyal-ohos-triplet-variance
  - "HMDFS 下 Autoconf 的 umask 077 临时目录不可用；构建期把 configure 里的 umask 077 改成 022，全程 umask 022。"  # knowledge_ref: E011
  - "HMDFS 禁止直接执行源码树脚本；用 CONFIG_SHELL 解释 configure，并给 make check 传 LOG_COMPILER=/data/service/hnp/bin/bash（设备无 /bin/bash）。"  # knowledge_ref: E087
  - "libfsxfs 发布包是自包含闭包：15 个本地 libyal 组件 + 生成好的 configure/aclocal.m4/config.guess/config.sub/Makefile.in 全在 tarball 内；配方在 build() 早期校验闭包，缺失即报错，不调用 synclibs.sh。"  # knowledge_ref: E277
  - "libtool 的 check_PROGRAMS 是包装脚本、真实 ELF 在 .libs/：构建期给 tests/test_runner.sh 加 .libs 解析并注入 LD_LIBRARY_PATH（只改测试运行方式，不改上游用例语义）。"  # knowledge_ref: E228
  - "上游 release archive 不含 tests/input/：test_fsxfsinfo.sh 按上游规则 SKIP（exit 77，'Test input directory not found.'）；test_library.sh 的 support/volume 在无 input/ 时以无参数模式真实执行并通过（22/22）。"  # knowledge_ref: E370
  - "上游测试清点有两个注册面：runner 面（automake TESTS=3：test_library.sh/test_tools.sh/test_fsxfsinfo.sh）与程序面（check_PROGRAMS：被审版本 25、上游当前 HEAD 31）。两者单位不同必须分列；声明 N 取程序面最大值（HEAD 下界 31），差额 6 项逐条归因。"  # knowledge_ref: E328

tests:
  upstream:
    command: "make check"
    counting_unit: "tests/Makefile.am 注册的 C 测试程序（check_PROGRAMS）"
    unit_programs: 25
    declared_n_head_lower_bound: 31
    executed: 25
    passed: 25
    failed: 0
    skipped: 0
    not_run: 6
    runner_cases: 3
    runner_passed: 2
    runner_skipped: 1
    note: >-
      被审版本 20240501 自带 25 个 check_PROGRAMS，本次全部编译并真实执行，25/25 PASS
      （test_library.sh 驱动 22 个、test_tools.sh 驱动 3 个，覆盖全部 25 个注册项）。
      声明 N 取下界口径的最大值 = 上游当前 HEAD（2026-09-19 取数）的 31 个 check_PROGRAMS；
      差额 6 项 fsxfs_test_attributes / fsxfs_test_block_directory / fsxfs_test_directory_table /
      fsxfs_test_file_entry / fsxfs_test_file_system_block / fsxfs_test_tools_mount_path_string
      均为 20240501 之后上游新增，被审版本源码树内不存在（NOT_RUN，非失败）。
      runner 面（另一计数单位，不并入 N）：automake 汇总 # TOTAL: 3 / PASS: 2 / SKIP: 1 / FAIL: 0，
      test_fsxfsinfo.sh 因 release archive 不含 tests/input/ 按上游规则 SKIP（exit 77）。
  adapted:
    command: "Conan test_package"
    cases: 14
    passed: 14
    pass_rate: "14/14 (100%)"
    breakdown:
      generic_consumer_assertions: 9
      harmony_specific_assertions: 5
    note: >-
      test_libfsxfs.c 9 项：版本串 20240501、读访问标志、get_codepage 正常/错误路径、
      set_codepage、check_volume_signature(NULL) 错误路径、volume_initialize/volume_free；
      test_ohos.c 5 项：__OHOS__ 编译目标、TMPDIR 非 /tmp、临时路径构造、临时文件
      写读往返比对、清理后 access+errno=ENOENT。

