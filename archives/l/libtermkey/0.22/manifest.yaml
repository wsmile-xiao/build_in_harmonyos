software: libtermkey
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.22/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.22"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.leonerd.org.uk/code/libtermkey/libtermkey-0.22.tar.gz"

  # 源码校验和
  sha256: "6945bd3c4aaa83da83d80a045c5563da4edd7d0374c62c0d35aec09eb3014600"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "PKG_CONFIG_PATH=$DEFAULT_PREFIX/lib/pkgconfig"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "unibilium/2.1.2"
    - "libtool/2.4.7"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
