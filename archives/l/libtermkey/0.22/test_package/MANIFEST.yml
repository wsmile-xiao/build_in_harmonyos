# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libtermkey/0.22
homepage: "https://www.leonerd.org.uk/code/libtermkey/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（t/*.c → t/*.t，由 make test 驱动，prove 执行）
upstream_tests:
  - file: t/01base.t
    source: libtermkey-0.22/t/01base.c
    description: "基础 API 生命周期测试"
    command: "./t/01base.t"
  - file: t/02getkey.t
    source: libtermkey-0.22/t/02getkey.c
    description: "termkey_getkey 按键读取测试"
    command: "./t/02getkey.t"
  - file: t/03utf8.t
    source: libtermkey-0.22/t/03utf8.c
    description: "UTF-8 输入解码测试"
    command: "./t/03utf8.t"
  - file: t/04flags.t
    source: libtermkey-0.22/t/04flags.c
    description: "flags/修饰键测试"
    command: "./t/04flags.t"
  - file: t/05read.t
    source: libtermkey-0.22/t/05read.c
    description: "termkey_read 读取测试"
    command: "./t/05read.t"
  - file: t/06buffer.t
    source: libtermkey-0.22/t/06buffer.c
    description: "输入缓冲测试"
    command: "./t/06buffer.t"
  - file: t/10keyname.t
    source: libtermkey-0.22/t/10keyname.c
    description: "keyname 转换测试"
    command: "./t/10keyname.t"
  - file: t/11strfkey.t
    source: libtermkey-0.22/t/11strfkey.c
    description: "format key 测试"
    command: "./t/11strfkey.t"
  - file: t/12strpkey.t
    source: libtermkey-0.22/t/12strpkey.c
    description: "parse key 测试"
    command: "./t/12strpkey.t"
  - file: t/13cmpkey.t
    source: libtermkey-0.22/t/13cmpkey.c
    description: "key 比较测试"
    command: "./t/13cmpkey.t"
  - file: t/20canon.t
    source: libtermkey-0.22/t/20canon.c
    description: "canonical 模式测试"
    command: "./t/20canon.t"
  - file: t/30mouse.t
    source: libtermkey-0.22/t/30mouse.c
    description: "鼠标输入测试"
    command: "./t/30mouse.t"
  - file: t/31position.t
    source: libtermkey-0.22/t/31position.c
    description: "光标位置报告测试"
    command: "./t/31position.t"
  - file: t/32modereport.t
    source: libtermkey-0.22/t/32modereport.c
    description: "模式报告测试"
    command: "./t/32modereport.t"
  - file: t/38csi.t
    source: libtermkey-0.22/t/38csi.c
    description: "CSI 序列解析测试"
    command: "./t/38csi.t"
  - file: t/39dcs.t
    source: libtermkey-0.22/t/39dcs.c
    description: "DCS 序列解析测试"
    command: "./t/39dcs.t"
  - file: t/40ti-override.t
    source: libtermkey-0.22/t/40ti-override.c
    description: "terminfo override 测试"
    command: "./t/40ti-override.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：termkey_new/getkey/strfkey 基本调用"
    command: "./test_libtermkey"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 433
