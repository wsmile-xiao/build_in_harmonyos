software: libigloo
display: "libigloo"
description: "Common framework library by the Icecast project (ro, sp, tap, prng, uuid, digest, time)"
category: base
homepage: "https://gitlab.xiph.org/xiph/icecast-libigloo"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "Compiled shared/static C library (LT_INIT; NOT header-only, NOT test-framework-only)"
    - "Official tag tarball ships no generated configure; recipe bootstraps with autogen.sh (autoreconf -isf) then applies HarmonyOS config.guess/config.sub patches"
    - "m4/pkg.m4 must be copied into m4/ before autoreconf so PKG_CHECK_MODULES expands (E089 root cause covered)"
    - "Hard dependency on rhash/1.4.6 (digest backend, configure.ac:105); ohpcd rhash is static-only so the recipe links statically"
    - "HMDFS umask workaround (E136) kept defensively: no-op locally (autoconf 2.71 umask 000), effective in CI sandbox"
    - "make check requires SHELL=/bin/sh: OHOS bash 5.3 breaks tap-driver.sh fd-3 pipeline ({ ... | cat >&3; } 3>log -> Bad file descriptor), all 10 tests ERROR under bash; /bin/sh (mksh) runs the full 763-assertion suite green (DRAFT-E553)"
  common_dependencies:
    - rhash

versions:
  "0.9.5":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libigloo/0.9.5"
    note: "Upstream TAP suite 763/763 PASS via make check; consumer test_package exercises igloo_initialize/version/sp/uuid/tap APIs"
