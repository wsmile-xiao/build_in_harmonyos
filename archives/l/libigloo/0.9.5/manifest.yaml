version: "0.9.5"
software: libigloo
status: built
build_date: "2026-09-16"
build_system: autotools

source:
  url: "https://gitlab.xiph.org/xiph/icecast-libigloo/-/archive/v0.9.5/icecast-libigloo-v0.9.5.tar.gz"
  sha256: "67a9a1d667033eda06adb1306d3a80e9125246f616d1ffe362395fb2b32aae61"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  dependencies:
    - "rhash/1.4.6"
    - "automake/1.18"   # tool_requires (autogen.sh: autoreconf -isf)
    - "libtool/2.5.4"   # tool_requires
  cc: clang

patches_applied:
  - "0002-build-aux-config.guess.patch"
  - "0003-build-aux-config.sub.patch"

upstream_tests:
  command: "make check"
  test_count: 10
  assertion_count: 763
  notes: "10 TAP programs driven by make check inside build(); requires SHELL=/bin/sh on OHOS (see knowledge_gained)."

test_package:
  assertion_count: 7
  description: "Real consumer checks: igloo_initialize, version_get/version_check (0.9.5), sp_replace/sp_unref, uuid_new_random_cstr/uuid_is_valid (incl. malformed rejection), TAP mini-framework stats, igloo_ro_unref shutdown; ctest 1/1."

knowledge_gained:
  - "Official tag tarball ships no generated configure; recipe bootstraps via autogen.sh (autoreconf -isf) with automake/1.18 + libtool/2.5.4 as tool_requires."
  - "m4/pkg.m4 must be copied into m4/ before autoreconf, otherwise PKG_CHECK_MODULES does not expand (E089 root cause)."
  - "HarmonyOS config.guess/config.sub patches must be applied AFTER autoreconf --install, which otherwise overwrites them with stock automake-1.18 copies."
  - "OHOS bash 5.3 fails to propagate group-command fd-3 redirection into pipeline elements, breaking tap-driver.sh (all tests ERROR 'missing test plan'); fixed by overriding SHELL=/bin/sh on the make check command line (DRAFT-E553)."
  - "rhash/1.4.6 is static-only non-PIC and cannot be linked into a shared libigloo.so; validated configuration is static (shared=False)."
