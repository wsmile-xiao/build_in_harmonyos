# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: libigloo/0.9.5
homepage: "https://gitlab.xiph.org/xiph/icecast-libigloo"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\")"

# 上游实际运行的测试程序 (make check 驱动, TAP driver; 台账见 notes.md)
upstream_tests:
  - file: tests/tap_suite
    source: libigloo-0.9.5/tests/tap_suite.c
    description: "TAP 框架自检 (5 PASS)"
    command: "./tests/tap_suite"
  - file: tests/init_igloo_test
    source: libigloo-0.9.5/tests/init_igloo_test.c
    description: "库初始化/关闭生命周期 (23 PASS)"
    command: "./tests/init_igloo_test"
  - file: tests/feature
    source: libigloo-0.9.5/tests/feature.c
    description: "feature 接口 (12 PASS)"
    command: "./tests/feature"
  - file: tests/ro
    source: libigloo-0.9.5/tests/ro.c
    description: "引用计数对象 (50 PASS)"
    command: "./tests/ro"
  - file: tests/digest
    source: libigloo-0.9.5/tests/digest.c
    description: "摘要计算 (rhash 后端, 259 PASS)"
    command: "./tests/digest"
  - file: tests/error
    source: libigloo-0.9.5/tests/error.c
    description: "错误码接口 (57 PASS)"
    command: "./tests/error"
  - file: tests/prng
    source: libigloo-0.9.5/tests/prng.c
    description: "随机数发生器 (20 PASS, OHOS 敏感: /dev/urandom, getrandom)"
    command: "./tests/prng"
  - file: tests/cs
    source: libigloo-0.9.5/tests/cs.c
    description: "字符串比较 (162 PASS)"
    command: "./tests/cs"
  - file: tests/time
    source: libigloo-0.9.5/tests/time.c
    description: "时间接口 (118 PASS, OHOS 敏感: clock_gettime)"
    command: "./tests/time"
  - file: tests/uuid
    source: libigloo-0.9.5/tests/uuid.c
    description: "UUID 生成/校验 (57 PASS, OHOS 敏感: prng 依赖)"
    command: "./tests/uuid"

# test_package 中自带的测试 (消费者视角验证, 真实调用 libigloo API, R34)
test_package_tests:
  - file: test.c
    description: "消费者测试: initialize -> version_get/check -> sp_replace/unref -> uuid_new_random_cstr/is_valid -> tap 自检 -> shutdown"
    command: "./test_libigloo"
  - file: ohos_elf_check.c
    description: "OHOS 专项: consumer 二进制 (test_libigloo) 必须是 ELF64 + 小端 + e_machine=183 (EM_AArch64); 任何不符返回非 0, 无 stub/skip"
    command: "./check_ohos_elf $<TARGET_FILE:test_libigloo>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 763
