software: libscrypt
version: "1.22"
status: built
build_system: makefile
build_date: '2026-08-26'
source:
  url: https://github.com/technion/libscrypt/archive/refs/tags/v1.22.tar.gz
  # SHA-256 verified against the upstream v1.22 release archive (64 hex characters).
  sha256: a2d30ea16e6d288772791de68be56153965fe4fd4bcd787777618b8048708936
  tar_format: tar.gz
  license: BSD-2-Clause
  homepage: https://github.com/technion/libscrypt
build:
  system: makefile
  configure_options:
  - PREFIX=$DEFAULT_PREFIX
  - DESTDIR=$TEST_PREFIX
  env_vars:
  - CC
  - AR
  - RANLIB
  - CFLAGS
  - LDFLAGS
  dependencies: []
  cc: clang
  cxx: clang++
  make_target: reference
  upstream_test: make check
  upstream_tests_executed: 13
patches_applied:
- 0001-Makefile-cross-compile.patch
patch_classification:
- file: 0001-Makefile-cross-compile.patch
  type: platform_adaptation
  platform_only: false
  reason: "Upstream Makefile hardcodes literal `ar` when building libscrypt.a; patch adds AR ?= ar defaults and uses $(AR) so the cross toolchain archiver is honoured."
knowledge_gained:
- libscrypt 1.22 上游为纯 Makefile（无 configure），BSD-2-Clause 许可。
- Makefile 的 CC/CFLAGS/LDFLAGS/PREFIX/DESTDIR 均用 ?= 可被命令行覆盖；唯独 `ar` 硬编码，故需最小 patch 改为 $(AR)。
- 上游 CFLAGS 默认含 -D_FORTIFY_SOURCE=2（glibc 专用）与 -fstack-protector、-Wl,-rpath=.；交叉编译时通过整体覆盖 CFLAGS/LDFLAGS 丢弃，保留 -fPIC。
- 库目标 libscrypt.so.0 同时产出 libscrypt.a（ar 副产物）；演示程序 reference 不构建（OHOS 需 ELF 签名才能执行且非交付物）。
- 已知答案向量（native clang 实测）：scrypt("password","salt", N=2,r=1,p=1, 32B) = 6d1bb878eee9ce4a7b77d7a44103574d4cbfe3c15ae3940f0ffe75cd5e1e0afa，ret=0。
