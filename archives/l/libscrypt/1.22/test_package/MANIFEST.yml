# test_package/MANIFEST.yml
# Upstream and consumer-test declarations for CI quality gates.

package: libscrypt/1.22
homepage: "https://github.com/technion/libscrypt"

# Upstream `make check` runs `LD_LIBRARY_PATH=. ./reference` — a 13-test
# suite in main.c (two RFC-7914 scrypt KAT vectors, hexconvert, base64, MCF
# encoding, password verify, salt generation, hash+check round-trip).
# It IS executed in build() (see conanfile.build). The heaviest case uses
# N=16384,r=8,p=16 (~16 MiB), which is fast and CI-safe. On OHOS the PATH
# clang auto-signs the ELF via its -Wl,--code-sign wrapper, so ./reference
# runs without manual binary-sign-tool.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "LD_LIBRARY_PATH=. ./reference"
upstream_tests:
  - name: "reference (make check)"
    command: "LD_LIBRARY_PATH=. ./reference"
    description: "13-test suite in main.c: RFC-7914 scrypt KAT x2, hexconvert, b64, MCF, check, salt, hash round-trip"

test_package_tests:
  - file: test.c
    description: "Call libscrypt_scrypt() with tiny params (N=2,r=1,p=1,32B) and verify byte-exact known-answer vector + determinism"
    command: "ctest --output-on-failure"

# ret=0 assertion + KAT match assertion + determinism assertion.
assertion_count: 3
