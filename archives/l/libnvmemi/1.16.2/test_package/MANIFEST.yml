package: libnvmemi/1.16.2
homepage: "https://github.com/linux-nvme/libnvme"

# 上游官方测试在 recipe 的 build() 里真跑（CI 的 host/build profile 同为
# ohos-aarch64 → 原生构建 → 真跑；交叉构建时由 cross_building() 跳过）。
upstream_check_command: "meson test -C <build_folder> --print-errorlogs"
upstream_test_in_build: true
# build() 另会现场生成一个 --wrapper 脚本传入（见 notes.md「OHOS shebang 适配」）：
# OHOS 无 /bin/bash，test/sysfs 与 test/config 的 helper（#!/bin/bash -e）必须转交
# 真实 bash，否则 meson 抛 OSError 中断整轮；doc 的 kdoc 还需 perl → exit 77 记 SKIP。
upstream_test_command: "meson test -C <build_folder> --wrapper <build_folder>/ohos-meson-test-wrapper.sh --print-errorlogs --timeout-multiplier=16"
# 另打 1 个补丁改测试辅助工具（不改用例集、不改断言）：
# patches/0001-ohos-tmpdir-aware-test-tmpfile.patch —— test/utils.c 的
# test_setup_log() 用 libc tmpfile()，OHOS 的 /tmp 只读且 tmpfile() 无视 $TMPDIR
# → err(EXIT_FAILURE) 退出码 1；补丁改为 $TMPDIR→$TMP→$TEMP→$HOME 逐个试
# mkstemp（成功后立即 unlink 保持匿名语义），全不可用才回退 libc tmpfile()。
patches_applied: ["patches/0001-ohos-tmpdir-aware-test-tmpfile.patch"]

upstream_tests:
  - file: test/mi.c
    source: libnvme-1.16.2/test/mi.c
    description: "NVMe-MI 协议层官方用例（282 条断言）：自定义 transport 注入，覆盖控制器列表扫描、MI Read MI Data、Admin Identify、MI/NVMe 双路错误、MPR 重试、AEM"
    command: "meson test -C <build_folder> libnvme:mi"
  - file: test/mi-mctp.c
    source: libnvme-1.16.2/test/mi-mctp.c
    description: "MCTP 传输层官方用例（96 条断言）：伪造 MCTP 对端拦截 sendmsg/recvmsg/poll，覆盖 tag 分配、MPR/MPRT 超时钳制、AEM 同步"
    command: "meson test -C <build_folder> libnvme:mi-mctp"

upstream_summary:
  registered: 31
  executed: 31
  ok: 29
  expected_fail: 2
  fail: 0
  skipped_on_ohos: 1
  note: "本机原生复现（同一份源码 + 配方同款 meson 选项）实测 31 个用例全部执行，29 通过 / 2 预期失败 / 0 失败；MI 相关断言 378 条。OHOS CI 侧同一 31 条全部注册执行，唯一差别是文档 lint `kdoc`（需 /bin/bash + perl）按 GNU 约定 exit 77 记 SKIP（skipped=1，非通过非失败）。CI #65437 曾暴露 test/mi 与 test/mi-mctp 因 tmpfile() 硬编码只读 /tmp 而 exit 1，已由补丁 0001 修复（本机以 LD_PRELOAD 强制 tmpfile() 失败复现出与 CI 完全一致的 exit 1 签名，打补丁后两条用例均 exit 0）"

test_package_tests:
  - file: test_libnvme_mi.c
    description: "完整消费者用例（rule12 端到端业务流程）：只链接交付的 libnvme-mi.so + <libnvme-mi.h>，在进程内用 ELF 符号介入伪造 MCTP 设备（介入 socket/sendmsg，响应经 AF_UNIX socketpair 注入，库自身 poll/recvmsg 走真实内核路径），跑完 ① 建立 MI 端点 ② MI Control Primitive 读控制器列表并枚举 3 个控制器 ③ 逐个 MI Admin Identify Controller 并把 SN/MN/FR/VID/SSVID/RAB/CNTLID 逐字段与设备侧注入数据比对 ④ 两条错误路径（不支持的 MI 数据结构回 NVME_MI_RESP_INVALID_CMD_SIZE、不支持的 Admin 命令回 SF=0x4006），共 32 项可核对结果"
    command: "./test_libnvmemi"
  - file: test_layout.py
    description: "适配自检（M=21）：MI 共享库与 soname 链、未误带同源码树的 libnvme.so/.h、公共头包含闭包（libnvme-mi.h + nvme/{mi,types,tree,log,util,ioctl}.h）、pkg-config 契约可重定位（prefix=${pcfiledir}/../..）、LGPL COPYING、无上游测试程序与构建产物、无隐藏文件（JC5）"
    command: "python3 test_layout.py <package_folder>"

assertion_count: 32
