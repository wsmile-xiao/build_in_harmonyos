sources:
  "1.16.2":
    url: "https://github.com/linux-nvme/libnvme/archive/refs/tags/v1.16.2.tar.gz"
    sha256: "1d850d5a871559abf641d6e6b63bb86047e4cb26f3ad144597c2c64b3cff7231"
patches:
  "1.16.2":
    # conan 2 的 apply_conandata_patches/export_conandata_patches 只认 dict 条目
    # （内部用 it.get("patch_file")）；写成裸字符串会在 export_sources() 阶段
    # 直接抛异常/AttributeError。dict 形态且省略 strip（patch_ng 能自动处理
    # a/ b/ 前缀，实测 strip=0/1 均可）。
    - patch_file: "patches/0001-ohos-tmpdir-aware-test-tmpfile.patch"
      patch_description: "OHOS/musl: tmpfile() 硬编码只读 /tmp → test/utils.c 改用 $TMPDIR 感知的匿名临时文件"
      patch_type: "portability"
