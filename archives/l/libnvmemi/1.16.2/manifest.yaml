patches_applied:
  - "patches/0001-ohos-tmpdir-aware-test-tmpfile.patch"
  # 只改上游 test/utils.c（测试辅助工具，不进 package 产物）：
  # test_setup_log() 用 libc tmpfile()，musl 的 tmpfile() 硬编码只读的 /tmp
  # （OHOS /tmp 只读挂载，CI 侧 ci/conan/build_and_test.sh 亦注明）
  # → err(EXIT_FAILURE) 退出码 1（CI #65437：libnvme:mi / libnvme:mi-mctp FAIL exit 1）。
  # 补丁新增 test_tmpfile()：$TMPDIR → $TMP → $TEMP → $HOME 依次试 mkstemp
  # （不可写的候选用 mkstemp 失败自然跳过），成功后立即 unlink 保持匿名语义，
  # 全不可用时才回退 libc tmpfile()；上游用例与断言一条未动。
  # 真机实测：OHOS tmpfile() 无视 $TMPDIR（TMPDIR 指向可写目录仍 NULL/EACCES）。
  # 仓库先例：enscript/1.6.6 patches/0003-ohos-tmpdir-aware-tmpfile.patch。

