# test_package/MANIFEST.yml — lfortran-runtime 0.61.0
# CI L0e 要求此文件存在；R51 上游测试三步法（清点/运行/回填）证据声明。

package: lfortran-runtime/0.61.0
homepage: "https://lfortran.org"

# 上游测试审计（源码包 lfortran-0.61.0.tar.gz, sha256
# 7bb5c609dfff1aef3ef1c75c82fba9889da9949bc5055612e6f1d039f4f2d4ce）：
#   - 本包范围 = C 运行时库 src/libasr/runtime/lfortran_intrinsics.c（纯 C，无自带测试）。
#   - 上游运行时库测试 src/runtime/tests/ 共 12 个 .f90（test_abs/test_bit/test_cos/
#     test_hyperbolics/test_inverse_trig/test_iso_c_binding/test_iso_fortran_env/
#     test_kind/test_sin/test_sin2/test_strings/test_tan），由 src/runtime/tests/CMakeLists.txt
#     以 CMAKE_Fortran_COMPILER=lfortran（LFortran 自身）编译运行。
#   - 这些 .f90 用例需要 LFortran 编译器做 Fortran 前端编译 → 需先自举出 lfortran 二进制；
#     OHOS 设备无 LFortran 编译器（本包只交付 C 运行时库，不含编译器前端），无法运行。
#   - 顶层 tests/ 为 LFortran 编译器测试套件（需 LLVM 后端全量构建），与本运行时库无关。
upstream_tests_exist: true
upstream_test_audit: "审计 lfortran-0.61.0 官方归档（github.com/lfortran/lfortran tag v0.61.0，sha256 7bb5c609dfff1aef3ef1c75c82fba9889da9949bc5055612e6f1d039f4f2d4ce）：本包覆盖的 C 运行时库 src/libasr/runtime/ 无自带测试；上游运行时测试为 src/runtime/tests/ 下 12 个 .f90（Fortran 用例），需 LFortran 编译器（CMAKE_Fortran_COMPILER=lfortran）编译运行，OHOS 无该编译器无法执行（discovered=12/executed=0）。test_package 以 C 消费者视角真实链接并调用运行时 API 接入。"

# 上游测试命令（需 LFortran 编译器，OHOS 不可用）
upstream_check_command: "cmake --build <build>/src/runtime && ctest -R runtime（src/runtime/tests/CMakeLists.txt，CMAKE_Fortran_COMPILER=lfortran）"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（本包范围内无；以下为上游存在但不可运行的 Fortran 用例计数依据）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_lfortran_runtime.c
    description: "链接 liblfortran_runtime(_static) 并真实调用 C 运行时 API：①_lfortran_dsin(0)=0 与 _lfortran_dcos(0)=1；②_lfortran_sum(4,[1,2,3,4])=10；③_lfortran_init_random_seed(42) 后 _lfortran_random()∈[0,1)；④_lfortran_enable_fpe_traps(1)（覆盖 musl feenableexcept 补丁路径）不崩溃且后续 intrinsic 正常。断言失败则返回非 0。"
    command: "./test_lfortran_runtime"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 6
