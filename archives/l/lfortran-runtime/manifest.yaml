# 软件级 manifest — lfortran-runtime
# 遵循 ARCHIVE-SPEC v3.0

software: lfortran-runtime
display: "LFortran Runtime"
description: "LFortran（LLVM 系现代 Fortran 编译器）的 C 运行时库 liblfortran_runtime，供 LFortran 编译产物在链接/运行期使用"
category: system
homepage: "https://lfortran.org"
license: BSD-3-Clause
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "运行库为纯 C（src/libasr/runtime/lfortran_intrinsics.c），可独立编译，无需 LLVM/MLIR 全量工程"
    - "编译期需 <libasr/config.h>（上游由顶层 CMake configure_file(config.h.in) 生成，全特性关闭时仅版本宏），配方私有生成"
    - "OHOS 使用 musl libc，不提供 GNU 扩展 feenableexcept → _lfortran_enable_fpe_traps 需按 ARMv8-A FPCR trap 位直写替代（不可移植符号，链接/加载会失败）"
    - "上游 Fortran 侧运行时模块（src/runtime/{pure,impure,openmp}/*.f90）需 LFortran 编译器自举，OHOS 无该编译器，不在本包范围"
    - "上游产物命名：shared=liblfortran_runtime.so（SOVERSION 0），static=liblfortran_runtime_static.a；头文件装 include/lfortran/impure/"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.61.0":
    status: built
    build_date: "2026-09-20"
    conan_ref: "lfortran-runtime/0.61.0"
    note: "首个适配版本（HarmonyOS PC aarch64）"
