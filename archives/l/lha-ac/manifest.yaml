software: lha-ac
display: "lha-ac"
description: "LHa for UNIX，LZH 归档命令行工具（Autotools 分支）"
category: archiver
homepage: "https://github.com/jca02266/lha"
license: LHa-license
build_system: autotools
package_type: application

ohos_adaptation:
  key_points:
    - "上游 Git 源码包不含 configure/Makefile.in，配方以 base64 文本（prebuilt-autotools.tar.gz.b64）携带固定 commit 的 autoreconf 生成物并在 OHOS 上刷新时间戳（直接提交二进制 tar.gz 无法被 CI 的 diff 应用）"
    - "为 config.sub 补充 aarch64-unknown-linux-ohos 识别"
    - "上游 lha-test18 的硬编码目录权限断言在鸿蒙 /storage 上不可能成立（目录 chmod 不生效），补丁改为与源目录权限做等价比较"
    - "消费者测试对安装后的 bin/lha 执行 15 条归档、列表、校验、解包与模式往返断言"
  common_dependencies: []

versions:
