difficulty: B
adaptation_path: 路径 A（基础适配）

source:
  url: "https://github.com/jca02266/lha/archive/0a07ec7fcc8014d0a4a3fa844abf1ea4f8278a28.tar.gz"
  sha256: "711fee59f71081f492b16125a5e0fd1069e44522be788ce4b6e851eeb42da42d"
  tar_format: tar.gz

build:
  system: autotools
  bootstrap: "预生成的 autoreconf 输出以 base64 文本（prebuilt-autotools.tar.gz.b64）随配方携带；OHOS Worker 只有 autoconf、没有 automake/aclocal，且 CI 以统一 diff 应用 PR，二进制 tar.gz 无法被 git apply 应用"
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies: []
  cc: clang
  env:
    CONFIG_SHELL: "/data/service/hnp/bin/bash"
    SHELL: "/data/service/hnp/bin/bash"

patches_applied:
  - file: "patches/0001-ohos-compare-preserved-modes.patch"
    target: "tests/lha-test18"
    type: portability
    reason: >-
      OHOS 的 /storage 文件系统不保留目录 chmod 结果（真机实测 chmod 544 与 chmod 766 的目录都报告
      drwxrws--x / 2771），因此上游硬编码的 'dr-xr--r--'、'drwxr--r--'、'drwxrw-rw-' 目录权限断言
      在本平台不可能成立。补丁只把 lha-test18 中三处目录权限断言由“硬编码 POSIX 权限字符串”改成
      “解包后目录权限与源目录权限一致”的等价比较，不删除、不跳过任何用例。

knowledge_gained:
  - "lha 的 Git 源码发布包不包含 configure/Makefile.in，需要完整 autotools 才能 autoreconf；OHOS Worker 缺少 automake/aclocal，所以配方改为携带固定 commit 的 autoreconf 生成物，解包后刷新时间戳以避免 make 触发缺失工具链。"
  - "上游 tests/lha-test 使用 Bash 语法和 typeset，鸿蒙默认 /bin/sh 不可直接执行；CONFIG_SHELL 与显式 Bash 调用是稳定入口。"
  - "tests/lha-test 默认运行常规功能套件；tests/lha-test all 还会运行 2G/4G 大文件归档的 test51/test52，两个测试只读取上游固定归档，不创建超大文件。"
  - "上游归档文件名和成员可能包含非 ASCII 字符，消费者测试只检查架构归档和 payload 往返，不对无关历史编码用例作断言。"

tests:
  upstream:
    framework: custom-autotools
    test_runner: "tests/lha-test"
    test_count: 23
    note: >-
      tests/ 目录包含 lha-test1 至 lha-test20、lha-test7_lv0/lv1/lvg、lha-test51、lha-test52。
      其中 lha-test6 与 lha-test9 被上游脚本注释为移除/不完整，不计入执行集合；
      tests/lha-test all 运行上游启用的 23 个测试执行项（lha-test1 作初始化，后续 2、3、4、5、7、
      7_lv0、7_lv1、7_lvg、8、10-20、51、52），覆盖常规功能与 2G/4G 大文件校验。
      make check 运行上游默认集合（21 项，不含 51/52）；tests/lha-test all 补上 lha-test51/lha-test52，合计 23 项。
  adapted:
    command: Conan test_package
    programs: 1
    assertions: 16
    passed: 16
    failed: 0
    pass_rate: "100%"
    measured_by: "test.sh 运行输出 TEST_PACKAGE_RESULT total=16 passed=16 failed=0 与 CONSUMER_WORKFLOW_RESULT total=1 passed=1 failed=0（OpenDesk 真机任务 20260924-205214-68cd55-lha-evidence13 强制重建全程）"
    consumer_workflow_count: 1
    consumer_workflow: "安装后 bin/lha 的完整 archive -> list -> test -> extract -> byte-compare 流程"
    note: 消费者测试调用安装后的 bin/lha，覆盖用法横幅、单文件与多成员归档、列表、完整性校验、解压往返、删除成员，并执行一个独立的完整端到端消费者流程。

