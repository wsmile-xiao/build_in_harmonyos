upstream_test_source_sha256: "711fee59f71081f492b16125a5e0fd1069e44522be788ce4b6e851eeb42da42d"

# 上游 runner 默认执行 lha-test1 至 lha-test20（含 lha-test7 的三个变体），
# 并在参数为 all 时追加 lha-test51/lha-test52 的 2G/4G 归档测试。
# lha-test6 与 lha-test9 已被上游 runner 注释，不属于执行集合。
upstream_test_files:
  - lha-test1
  - lha-test2
  - lha-test3
  - lha-test4
  - lha-test5
  - lha-test7
  - lha-test7_lv0
  - lha-test7_lv1
  - lha-test7_lvg
  - lha-test8
  - lha-test10
  - lha-test11
  - lha-test12
  - lha-test13
  - lha-test14
  - lha-test15
  - lha-test16
  - lha-test17
  - lha-test18
  - lha-test19
  - lha-test20
  - lha-test51
  - lha-test52

upstream_tests:
  - file: tests/lha-test
    description: "上游 Autotools shell runner；make check 运行默认集合，tests/lha-test all 追加 2G/4G 大文件用例"
    command: "tests/lha-test all"

test_package_tests:
  - file: test.sh
    description: "调用安装后的 bin/lha 完成使用说明、归档、列表与详细列表、完整性、解压往返、成员删除、权限保留，以及一个完整的 archive -> list -> test -> extract -> byte-compare 消费者端到端流程（共 16 条检查，其中 1 条为端到端流程）"
    command: "bash test.sh <package>/bin/lha"
  - file: conanfile.py
    description: "Conan consumer entry point using VirtualRunEnv and target execution checks"
    command: "conan test test_package"

assertion_count: 16
consumer_workflow_count: 1
consumer_workflow: "安装后 bin/lha: create archive -> list members -> test archive -> extract -> byte-compare"
