version: "3.7.6"
software: lttoolbox
status: built
build_date: "2026-08-11"
build_system: autotools

source:
  url: "https://github.com/apertium/lttoolbox/archive/refs/tags/v3.7.6.tar.gz"
  tar_format: tar.gz
  sha256: "06cae70c8a0c93a358b84f95e287009ca4d7e732e05b782ac27156bc8ded4762"

build:
  system: autotools
  configure_args:
    - "--enable-static"
    - "--disable-shared"

dependencies:
  - libxml2/2.15.3.1
  - icu4c/77
  - boost/1.91.0
  - utf8cpp/4.1.1

knowledge_gained:
  - "lttoolbox 3.7.6 是最后基于 autotools 的稳定版本（3.8.0+ 迁移到 CMake）"
  - "release tarball 不含预生成 configure，需 autoreconf -fi 生成"
  - "configure.ac 通过 PKG_CHECK_MODULES 检测 libxml-2.0 和 ICU（icu-i18n/icu-io/icu-uc）"
  - "构建产物: liblttoolbox（静态库）+ lt-comp/lt-proc/lt-print 等命令行工具"
  - "P0 阻塞依赖: apertium-core 3.9.12 configure.ac:71 PKG_CHECK_MODULES(LTTOOLBOX, [lttoolbox >= 3.7.2])"

upstream:
  release_tag: "v3.7.6"
  release_url: "https://github.com/apertium/lttoolbox/releases/tag/v3.7.6"
  license: "GPL-2.0-or-later"
