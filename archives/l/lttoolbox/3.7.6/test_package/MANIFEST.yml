package: lttoolbox/3.7.6
homepage: "https://github.com/apertium/lttoolbox"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_note: >-
  lttoolbox 3.7.6 ships no dedicated test suite in the release tarball
  (unit tests were added in 3.8.0+ CMake migration). The C++ test_package
  verifies liblttoolbox linkability and core Transducer/Alphabet API.

test_package_tests:
  - file: test.cpp
    description: "Link liblttoolbox and invoke core types (Transducer/Alphabet) to verify the library is usable"
    command: "test"

assertion_count: 4
