  - "The delivered package is a static libsndfile library without command-line programs"
  - "The device gate selects 12 deterministic core CTest entries from 143 source declarations"
  - "CMakeAutoGen must resolve its helper relative to CMAKE_CURRENT_LIST_DIR because Conan makes CMAKE_MODULE_PATH a list"

test_results:
