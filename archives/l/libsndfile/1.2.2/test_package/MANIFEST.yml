package: libsndfile/1.2.2
homepage: https://libsndfile.github.io/libsndfile/

upstream_tests_exist: true
upstream_test_in_build: true
upstream_check_command: >-
  ctest --output-on-failure -j 1 -R
  '^(test_main|sfversion|error_test|ulaw_test|alaw_test|command_test|checksum_test|headerless_test|rdwr_test|format_check_test|channel_test|virtual_io_test)$'
upstream_test_audit:
  declared_ctest_entries: 143
  selected_ctest_entries: 12
  reason: >-
    The selected core tests exercise the internal codecs, API errors, commands,
    headers, channel handling, virtual I/O, and version reporting without the
    disabled FLAC/Vorbis/Opus/MPEG dependencies. Format-matrix and pipe/stdio
    cases are trimmed from the device gate to keep one-package CI bounded.
upstream_tests:
  - file: "src/test_*.c and tests/*.c"
    source: "libsndfile-1.2.2 CMakeLists.txt"
    description: "Twelve deterministic core CTest entries selected from 143 declarations."
    count: 12

test_package_tests:
  - file: test_libsndfile.c
    description: "Link the installed target and perform an exact WAV/PCM file round trip."
    count: 1

assertion_count: 12
