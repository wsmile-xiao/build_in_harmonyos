package: lazperf
version: "3.4.0"
homepage: "https://github.com/hobuinc/laz-perf"
license: Apache-2.0
status: built
build_system: cmake
build_date: "2026-09-19"

source:
  url: "https://github.com/hobuinc/laz-perf/archive/refs/tags/3.4.0.tar.gz"
  sha256: "ddc1219cac345aee53a33b52dde6b28892e85708b848ab6831dc0c9aa795534d"
  notes: "tag 3.4.0 无 v 前缀；解出目录 laz-perf-3.4.0，配方用 strip_root=True 拉平。gtest 1.10.0 随 tarball 内置（cpp/test/gtest/gtest-10-06-21/），configure 期不联网拉测试框架。"

build:
  system: cmake
  configure_options:
    - "-DWITH_TESTS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_BUILD_TYPE=Release"
  extra_cxxflags:
    - "-Wno-unused-command-line-argument"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-tests-honour-tmpdir-for-scratch-las-laz-files.patch"
  - "0002-cmake-make-autzen-test-data-fetch-opt-in.patch"

knowledge_gained:
  - "ref: E002 家族. 上游测试夹具 cpp/test/io_tests.cpp::makeTempFileName() 把临时 LAS/LAZ 文件写死在 /var/tmp/fnXXXXXX，且忽略 mkstemp() 的返回值。OHOS 上根文件系统只读（/var/tmp 甚至可能不存在）→ mkstemp 失败被忽略，随后的 ofstream 静默产出空文件，用例以'读回来的内容不对'的形式失败，与库本身无关。实测（mount -t tmpfs -o ro /var/tmp）：未打补丁 21 ran / 14 PASSED / 7 FAILED，失败名恰为调用 makeTempFileName() 的那 7 个（extrabytes、issue44、can_encode_large_files、variable_chunks、compression_decompression_is_symmetric、writes_bbox_to_header、write_laz_with_no_points_and_read_back）；打上 0001 后 21/21。属通用 POSIX 可移植性修复（P005），可直接上游。"
  - "新条目（草稿 DRAFT-lazperf-3.4.0-tests-hardcoded-var-tmp-readonly-rootfs）：'硬编码 /var/tmp + 忽略 mkstemp 返回值'比单纯的 /tmp 只读（E002）更隐蔽——失败信息指向的是数据不匹配而不是路径不可写，容易误判为编解码器 bug。识别信号是上面那 7 个用例名成组失败，且 TMPDIR 对它们完全无效。"
  - "ref: DRAFT-isutf8-cmake-configure-download-benchmarks（同类先例）. 顶层 CMakeLists 在 WITH_TESTS 打开时用 file(DOWNLOAD) 从 github.com 拉 autzen.laz，而该文件只有 cpp/benchmarks/laszip.cpp 用，且该目标仅在 LASZIP_FOUND（外部 LASzip）时才 add_executable。CI 只经镜像取 tarball，不应直连 github.com。0002 补丁加 LAZPERF_FETCH_TEST_DATA 选项（默认 OFF）守卫，guard: none。"
  - "vendored gtest cpp/test/gtest/gtest-10-06-21/googletest/CMakeLists.txt 仍写 cmake_minimum_required(VERSION 2.8.12)，CMake >= 4 直接报错；配方钉 CMAKE_POLICY_VERSION_MINIMUM=3.5（cache variables），新旧 CMake 都能配置。"
  - "gtest 以 -Wall -Wshadow -Werror -Wconversion 编译；OHOS clang driver 会对自己注入的 flag 报 -Wunused-command-line-argument，遂只关这一条诊断（E293 模式，不用 blanket -Wno-error），不动任何断言。"
  - "上游 install() 只装 shared 一种 flavour + 6 个 stream 级头文件（lazperf_user_base.hpp 改名成 lazperf_base.hpp）；默认的 static 构建若走 cmake.install() 会一个库都装不出来，故 package() 直接从 build 树取 liblazperf_s.a / liblazperf.so*，头文件集合与上游 install() 逐一对齐。"
  - "ctest 的 add_test() 用 WORKING_DIRECTORY \"${CMAKE_RUNTIME_OUTPUT_DIRECTORY}/../..\"，而 CMAKE_RUNTIME_OUTPUT_DIRECTORY 全树未设置 → 解析成 /。用例进程的 cwd 因此是根目录；配方在 build_folder/tmp 建可写目录并把 TMPDIR/TMP/TEMP 指过去（Conan 的 CMake.ctest() 在 build_folder 里执行，无需 --test-dir）。"

patch_generation:
  method: manual
  patches_count: 2

patch_classification:
  - file: 0001-tests-honour-tmpdir-for-scratch-las-laz-files.patch
    type: portability
    platform_only: false
    guard: 'none'
    upstreamable: true
    note: "只动 cpp/test/io_tests.cpp 的 makeTempFileName()，不触碰被安装的库代码。$TMPDIR 是 POSIX 约定，与 HarmonyOS 无关（P005/P014）。"
  - file: 0002-cmake-make-autzen-test-data-fetch-opt-in.patch
    type: build-portability
    platform_only: false
    guard: 'none'
    upstreamable: true
    note: "只动顶层 CMakeLists.txt，把 configure 期对 github.com 的 file(DOWNLOAD) 收进默认 OFF 的 LAZPERF_FETCH_TEST_DATA 选项；离线/镜像构建本就不该在 configure 期取测试数据，可上游。"

upstream_tests:
  command: "ctest --output-on-failure"
  registrations: 3
  test_count: 39
  executed: 37
  not_executed: 2
  notes: "rule4 口径：对上游默认分支 master 做朴素扫描（含被注释掉的宏），^TEST( 命中 io_tests.cpp 22 + lazperf_tests.cpp 16 + stream_tests.cpp 1 = 39；master 与 tag 3.4.0 在这三个文件上逐字节相同。真实可执行 37（io_tests 21 + lazperf_tests 16），未执行 2：io_tests.fast（第 657–688 行被 /** **/ 块注释）、stream_tests.streams_are_sane（第 34–147 行同样被块注释，因此 stream_tests 可执行断言为 0，但仍真实编译、真实被 ctest 运行）。ctest -N 注册 3 个可执行测试：io_tests、lazperf_tests、stream_tests。"

test_package:
  assertion_count: 40
  description: "消费者测试 test_lazperf.cpp（C++17，CMake 链接 lazperf::lazperf + Threads::Threads），5 个场景共 40 条断言，只用已安装头文件。场景一为鸿蒙特有：在只读根文件系统语义下按 $TMPDIR → $HOME → . 解析可写 scratch 目录（不写死 /var/tmp），并断言该目录可写且不是 /var/tmp，然后整条 LAZ 写-读走一遍；场景四为 4 线程并发压缩与单线程基线逐字节一致（上游无线程测试）。运行期由 test_package/conanfile.py 跑 ctest 后直接执行二进制。"

ci:
  profile: ci/conan/profiles/ohos-aarch64
  package_type: library
  shared_default: false
