# conandata.yml — lazperf 3.4.0
# R39: 只写官方 GitHub URL，镜像由 CI (build_and_test.sh) 自动改写为镜像列表。
#      url 必须是单值字符串，列表格式会跳过 mirror rewrite。
sources:
  url: "https://github.com/hobuinc/laz-perf/archive/refs/tags/3.4.0.tar.gz"
  sha256: "ddc1219cac345aee53a33b52dde6b28892e85708b848ab6831dc0c9aa795534d"

patches:
  - patch_file: "patches/0001-tests-honour-tmpdir-for-scratch-las-laz-files.patch"
    patch_description: >
      测试夹具把临时 LAS/LAZ 文件写死在 /var/tmp。OHOS 上根文件系统只读或根本没有
      /var/tmp，mkstemp() 失败且返回值被忽略，后续 ofstream 静默产出空文件，
      io_tests 的 7 个用例因此失败（实测：/var/tmp 挂成只读 tmpfs 后，未打补丁的
      io_tests 报 21 ran / 14 PASSED / 7 FAILED，失败名即该 7 个）。
      改为按 POSIX 约定解析 $TMPDIR，退回当前目录。只动
      cpp/test/io_tests.cpp 的 makeTempFileName()，用例数/用例体/断言全部不变。
    patch_type: "test-portability"
  - patch_file: "patches/0002-cmake-make-autzen-test-data-fetch-opt-in.patch"
    patch_description: >
      顶层 CMakeLists 在 WITH_TESTS 打开时用 file(DOWNLOAD) 从 github.com 拉
      autzen.laz。CI 干净环境只能走镜像拿 tarball，直连 github.com 只会超时或失败；
      而且这个文件全构建无人消费——只有 cpp/benchmarks/laszip.cpp 读它，而该目标仅在
      找到外部 LASzip（LASZIP_FOUND）时才建立，实际不建立；所有 ctest 用例用的是
      tarball 自带的 autzen_trim.las/.laz。改为新增 LAZPERF_FETCH_TEST_DATA 选项
      （默认 OFF）把下载包起来，配方不打开。只动 CMakeLists.txt，用例/断言/源码不变。
    patch_type: "build-portability"
