# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法: 解压上游源码包 → cmake -DWITH_TESTS=ON 配置 → make → ctest -N
#           （lazperf 的测试目标在 cpp/test/CMakeLists.txt 中由 LAZPERF_ADD_TEST 注册）
#
# 两个补丁（均不改用例数/用例体/断言）:
#   0001  cpp/test/io_tests.cpp 的 makeTempFileName() 由写死 /var/tmp 改为按 POSIX
#         解析 $TMPDIR（退回当前目录）。修复 7 个 io_tests 用例在只读根文件系统下
#         必然失败的问题（实测 /var/tmp 只读时 21 ran / 14 PASSED / 7 FAILED）。
#   0002  顶层 CMakeLists.txt 的 configure 期 file(DOWNLOAD)
#         （github.com/PDAL/data ... autzen.laz）改为 LAZPERF_FETCH_TEST_DATA
#         选项守卫，默认 OFF；该文件只被 cpp/benchmarks/laszip.cpp 使用，而该
#         目标要求外部 LASzip（LASZIP_FOUND）才会建立。

package: lazperf/3.4.0
homepage: "https://github.com/hobuinc/laz-perf"

# 上游测试命令
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# ctest -N 注册的 3 个可执行测试；其中 stream_tests 的用例体被上游用块注释
# 注释掉了，可执行断言为 0，但仍真实编译、真实运行（见 notes.md 第 4 节）。
upstream_tests:
  - file: cpp/test/io_tests.cpp
    source: laz-perf-3.4.0.tar.gz/cpp/test/io_tests.cpp
    description: "LAS/LAZ 文件读写：header 解析、LASzip VLR、大文件、变长 chunk、bbox 回写等 21 个用例"
    command: "./cpp/test/io_tests"
  - file: cpp/test/lazperf_tests.cpp
    source: laz-perf-3.4.0.tar.gz/cpp/test/lazperf_tests.cpp
    description: "编解码器与 LASzip 逐字节一致性：16 个用例（packers/dynamic compressor/laszip 比对）"
    command: "./cpp/test/lazperf_tests"
  - file: cpp/test/stream_tests.cpp
    source: laz-perf-3.4.0.tar.gz/cpp/test/stream_tests.cpp
    description: "流式 API 冒烟：上游把唯一用例 streams_are_sane 用块注释注释掉，可执行断言 0（已如实计入未执行）"
    command: "./cpp/test/stream_tests"

# test_package 中自带的测试 (消费者视角验证, R34: 真实链接并调用 lazperf API)
test_package_tests:
  - file: test_lazperf.cpp
    description: >
      消费者视角 5 个场景 / 40 条断言：
      (1) 只读根文件系统下的临时路径解析（鸿蒙特有，$TMPDIR → $HOME → . ，不依赖 /var/tmp）；
      (2) LAZ 写-读往返 + LAZ VLR 元数据 + header 尺寸契约；
      (3) aarch64/LP64 与非对齐点记录访问；
      (4) 4 线程并发压缩结果与单线程基线逐字节一致（上游无线程测试）；
      (5) HMDFS 语义：写盘-关闭-立即重开字节一致。
    command: "./test_lazperf"

# 鸿蒙特有测试条数 (rule12)
ohos_specific_tests: 1
ohos_specific_description: >
  场景一：OHOS 的 / 与 /var/tmp 可能不存在或只读（E002 家族）。断言在只读根文件系统下，
  $TMPDIR（退回 $HOME、最后当前目录）即可支撑整条 LAZ 写-读链路，且所用目录
  不是写死的 /var/tmp——上游 io_tests 的 makeTempFileName() 正因写死该路径而使
  7 个用例在 OHOS 上必然失败（实测：/var/tmp 挂成只读 tmpfs 后，未打补丁的
  io_tests 报 21 ran / 14 PASSED / 7 FAILED；打上 patches/0001 后 21/21）。

# 测试断言总数 (实测: 40/40 通过)
assertion_count: 40
