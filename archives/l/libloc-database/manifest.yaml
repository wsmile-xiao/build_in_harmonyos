software: libloc-database
display: "IPFire Location Database"
description: "IPFire Location Database — compiled location.db consumed by the libloc IP geolocation library"
category: data
homepage: "https://location.ipfire.org/databases/"
license: CC-BY-NC-SA-4.0
# 纯数据包：上游无构建系统，custom 为如实取值（code-style §14 枚举不含该场景）
build_system: custom

ohos_adaptation:
  key_points:
    - "纯数据包：上游无构建系统、无编译产物、无自动化测试（Debian Architecture: all）"
    - "上游发布物是单个 .xz 压缩数据文件而非 tar 归档；conan 的 get()/unzip() 会走 zipfile 分支抛 BadZipFile，必须 download() + Python lzma 手工解压"
    - "上游文件名含冒号（location-<date>.db.xz），conandata.yml 用 filename 归一化落盘名"
    - "安装路径 share/libloc-location/location.db，与 Debian 官方二进制包一致（libloc 库的数据库查找目录）"
    - "无 CLI 工具 → 不需要 commands.json（R38 不适用）"
    - "conan-verify G4 只查 bin/lib/include，纯数据包会被误判'无产物'"
  common_dependencies: []

versions:
  "0-20260628-0345":
    status: built
    build_date: "2026-09-15"
    conan_ref: "libloc-database/0-20260628-0345"
