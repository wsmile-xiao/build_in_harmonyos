knowledge_gained:
  - "libloc-database 是纯数据包：上游无构建系统、无编译产物、无自动化测试（Debian Architecture: all，Build-Depends 仅 debhelper-compat）"
  - "上游发布物是单个 .xz 压缩数据文件而非 tar 归档，conan 的 get()/unzip() 只认 tar/zip，裸 .xz 会落到 zipfile 分支抛 BadZipFile —— 必须 download() + lzma 手工解压"
  - "上游文件名含冒号（location-2026-06-28-03:45.db.xz），conandata.yml 用 filename: location.db.xz 归一化落盘名，规避冒号路径风险"
  - "安装路径对齐 Debian 官方包：share/libloc-location/location.db（libloc 库的数据库查找目录）"
  - "解压后 location.db：48,930,795 字节，sha256=819748dd33a18aecbbce624bc10b0b685cb292e95377bb2b434665b5afc69ffd，魔数 LOCDBXX\\x01，头部时间戳 1782621203 = 2026-06-28T04:33:23Z"
  - "与 Debian 官方二进制包 libloc-database_0~20260628~0345-1_all.deb 内的 location.db 逐字节一致（cmp rc=0）"
  - "conan-verify 的 G4（产物完整性）在 @ohpcd/stable 引用下恒报 '无法找到程序包 ID' 并提前 PASS：代码取 listing['Local Cache'][software]，而 JSON 键是完整引用 name/ver@user/channel —— 存量 116 份报告 104 份如此，0 份出现'无任何产物'；本次 PASS 不能作为产物完整性证据"
