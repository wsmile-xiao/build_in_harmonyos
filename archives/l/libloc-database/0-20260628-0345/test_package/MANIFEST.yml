    description: "消费侧校验 6 项：安装路径 / 字节数 / SHA256 / DB 魔数 / 头部时间戳 / 尾部可读"
    command: "python3 test_database.py <package_folder>"

# test_package 断言数（非上游测试用例数——上游用例数为 0）
# 注: 用例 2/3（字节数/SHA256）与配方 package() 的完整性校验共用同一组上游锚定常量
