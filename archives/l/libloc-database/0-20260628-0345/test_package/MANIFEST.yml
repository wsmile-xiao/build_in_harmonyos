#    → 无 Makefile / CMakeLists.txt / configure / meson.build / setup.py，
#      无 tests/ 或 t/ 目录，无任何测试套件。
# 2) Debian 打包仓（mirror of salsa.debian.org/debian/libloc-database.git，
