software: libtar
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.2.20/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.20"

# 构建系统（扁平字段，用于 G4 门禁）
build_system: autotools

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/libtar/libtar-1.2.20.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Git仓库源码缺少预生成文件，需手动运行 autoreconf 或创建 Makefile.in"
  - "HMDFS文件系统上 libtoolize 可能失败，使用 LIBTOOLIZE=true 环境变量绕过"
  - "automake 在 HMDFS 上可能无法访问 autoconf，需手动从子目录 Makefile.in 构建"
  - "manifest.yaml 需要顶级 build_system 字段用于 G4 门禁检查"
  - "动态库需要 ELF 签名才能在 OpenHarmony 上执行"
  - "libtar 无 make check 目标，需手动功能性测试验证"
