software: libvhdi
display: "libvhdi"
description: "Library to access the Virtual Hard Disk (VHD) image format"
category: data
homepage: "https://github.com/libyal/libvhdi"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "发布包自包含：13 个本地 libyal 组件与生成好的 configure/aclocal.m4/config.guess/config.sub/Makefile.in 都在 tarball 内，配方拒绝执行 synclibs.sh。"
    - "自带 config.guess (2024-07-27) 不识别 HarmonyOS（uname -s = HarmonyOS），必须显式传 --build/--host=aarch64-unknown-linux-ohos。"
    - "HMDFS 下 Autoconf 的 umask 077 临时目录不可用：构建期把 configure 里的 umask 077 改成 022，并以 CONFIG_SHELL 显式解释 configure 与 make check 的 runner 脚本。"
    - "libtool 测试目标是包装脚本，真实 ELF 在 .libs/：OHOS 构建期给 test_runner.sh 打运行期适配（不改上游测试用例语义）并注入 libvhdi/.libs 的 LD_LIBRARY_PATH。"
    - "release archive 不含 input/ 测试夹具，test_vhdiinfo.sh 按上游规则 skip；其余上游 runner 正常执行。"
  common_dependencies: []

versions:
  "20251119":
    status: built
    build_date: "2026-09-16"
    conan_ref: "libvhdi/20251119"
