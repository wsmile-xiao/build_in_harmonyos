# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
# 上游测试入口来自 release archive 的 tests/Makefile.am（TESTS 变量）。

package: libvhdi/20251119
homepage: https://github.com/libyal/libvhdi

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - name: "libvhdi library tests"
    file: test_library.sh
    source: tests/test_library.sh
    description: "21 个 library 单元测试程序（+ file/support 两个 input 驱动程序）"
    command: "./tests/test_library.sh"
  - name: "vhditools library tests"
    file: test_tools.sh
    source: tests/test_tools.sh
    description: "vhditools 的 info_handle/output/signal 三个测试程序"
    command: "./tests/test_tools.sh"
  - name: "vhdiinfo end-to-end tests"
    file: test_vhdiinfo.sh
    source: tests/test_vhdiinfo.sh
    description: "input 驱动的 vhdiinfo 端到端比对；release archive 不含 input/ 夹具，按上游规则 skip"
    command: "./tests/test_vhdiinfo.sh"

test_package_tests:
  - file: test_libvhdi.c
    description: "消费者 API 断言：版本、读写访问标志、codepage 正常/错误路径、check_file_signature 错误路径、file 初始化/释放"
    command: "./test_libvhdi"
  - file: test_ohos.c
    description: "鸿蒙特有消费者测试：__OHOS__ 编译目标、可写 TMPDIR（宿主 /tmp 可写时按 SKIP 记录，不计为通过）、临时文件读写清理、合成 VHD footer 的正向签名识别"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  - name: "ohos-tmpdir-file-lifecycle-and-vhd-signature"
    description: "在 OHOS 真机上确认 __OHOS__ 编译目标、可写 TMPDIR（非只读 /tmp）、临时文件读写与清理，并用 1024 字节合成 VHD footer 触发打包库的正向签名识别路径"
    command: "./test_ohos"
    assertions: 6
    platform: OHOS

assertion_count: 17
