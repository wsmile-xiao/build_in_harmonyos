package: libvhdi
version: "20251119"
homepage: "https://github.com/libyal/libvhdi"
license: LGPL-3.0-or-later
status: built
build_system: autotools
build_date: "2026-09-16"
conan_ref: "libvhdi/20251119"

source:
  url: "https://deb.debian.org/debian/pool/main/libv/libvhdi/libvhdi_20251119.orig.tar.gz"
  sha256: "026cc41e506bef433999090a777519a3cb471510dc352fa44d6867cf6a0e7990"
  tar_format: tar.gz
  upstream_release_url: "https://github.com/libyal/libvhdi/releases/download/20251119/libvhdi-alpha-20251119.tar.gz"
  upstream_tag: "20251119"
  upstream_commit: "2c1ce1a8fd2fd62049579d0bfaf5ac1a3eff1429"
  upstream_commit_date: "2025-11-19T14:50:55Z"
  release_artifact: >-
    Debian orig tarball mirror; the upstream GitHub release asset
    (libvhdi-alpha-20251119.tar.gz) is not reachable from the device network.
    Release identity verified byte-for-byte against the upstream tag commit
    through the GitHub contents API for 11 key files (configure.ac,
    Makefile.am, libvhdi/Makefile.am, include/libvhdi.h.in, tests/Makefile.am,
    libvhdi/libvhdi_file.c, libvhdi/libvhdi_support.c,
    libvhdi/libvhdi_file_footer.c, vhditools/Makefile.am, README,
    include/libvhdi/definitions.h.in - all identical). The upstream release
    asset itself is unreachable from the device network, so no whole-archive
    comparison was possible.

build:
  system: autotools
  configure_options:
    - "--disable-python"
    - "--with-libfuse=no"
    - "--enable-static-executables=no"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfguid
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

patches_applied: []

knowledge_gained:
  # 每条行尾引用最接近的既有条目（写法遵循容器层口径：# knowledge_ref: E###）。
  - "发布包自带 config.guess (2024-07-27) 不识别 HarmonyOS（uname -s = HarmonyOS），必须显式传 --build/--host=aarch64-unknown-linux-ohos；自带 config.sub 接受该三元组。"  # knowledge_ref: E007
  - "HMDFS 下 Autoconf 的 umask 077 临时目录不可用；构建期把 configure 里的 umask 077 改成 022，全程 umask 022。"  # knowledge_ref: E011
  - "HMDFS 禁止直接执行源码树脚本；用 CONFIG_SHELL 解释 configure，并给 make check 传 LOG_COMPILER。"  # knowledge_ref: E087
  - "libvhdi 发布包是自包含闭包：13 个本地 libyal 组件 + 生成好的 configure/aclocal.m4/config.guess/config.sub/Makefile.in 全在 tarball 内；配方在 build() 早期校验闭包，缺失即报错，不调用 synclibs.sh。"  # knowledge_ref: E277
  - "libtool 的 check_PROGRAMS 是包装脚本、真实 ELF 在 .libs/：构建期给 tests/test_runner.sh 加 .libs 解析并注入 LD_LIBRARY_PATH（只改测试运行方式，不改上游用例语义）。"  # knowledge_ref: E228
  - "上游 release archive 不含 input/ 夹具：test_vhdiinfo.sh 按上游规则 SKIP（exit 77）；test_library.sh 的 file/support 在无 input/ 时以无参数模式真实执行并通过。"  # knowledge_ref: E370
  - "上游 release 资产名 libvhdi-alpha-20251119.tar.gz 不能从版本号或同族包推断（libfsntfs 是 -experimental-）；设备网络不可达 github.com 时用 Debian orig 镜像 + 固定 sha256 + 上游 tag 提交逐字节核验。"  # knowledge_ref: E335
  - "包内含 vhdiinfo/vhdimount 可执行文件，但 package_type=library 且配方未声明 cpp_info.bindirs，CI L0k 按库类型处理，不新增 commands.json。"  # knowledge_ref: E424

tests:
  upstream:
    command: "make check"
    counting_unit: "tests/Makefile.am 注册的 C 测试程序（check_PROGRAMS）"
    unit_programs: 23
    integration_programs: 3
    program_total: 26
    executed: 26
    passed: 26
    failed: 0
    skipped: 0
    runner_cases: 3
    runner_passed: 2
    runner_skipped: 1
    note: >-
      test_library.sh 23/23 PASS（21 个 library 程序 + 无 input/ 时按 runner
      规则无参数真实执行的 file/support）；test_tools.sh 3/3 PASS；
      test_vhdiinfo.sh 因 release archive 不含 input/ 按上游规则 SKIP（exit 77），
      属上游测试数据能力边界，不是构建失败。automake 汇总 # TOTAL: 3 / PASS: 2 /
      SKIP: 1 / FAIL: 0。
  adapted:
    command: "Conan test_package"
    cases: 17
    passed: 17
    pass_rate: "17/17 (100%)"
    breakdown:
      generic_consumer_assertions: 11
      harmony_specific_assertions: 6
    note: >-
      通用消费者断言覆盖版本、读写访问标志、codepage 正常/错误路径、
      check_file_signature 错误路径、libvhdi_file 初始化/释放；鸿蒙专项断言覆盖
      __OHOS__ 编译目标、TMPDIR 非 /tmp、临时文件读写与清理，以及 1024 字节合成
      VHD footer 的正向签名识别。

blockers: []

