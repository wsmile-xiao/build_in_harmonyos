# test_package/MANIFEST.yml — libonvif 1.4.4
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求）

package: libonvif/1.4.4
homepage: "https://github.com/sr99622/libonvif"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
# 上游 v1.4.4 源码树没有任何测试资产：无 tests/ 目录、无 CTest add_test()、
# 无 test_* 源文件（find 全树核对，见 notes.md 测试清点证据），因此无
# 上游测试命令可声明。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（上游测试资产为 0，无可运行项）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_onvif_api.c
    description: "消费者测试：编译链接 onvif 库，调用 getUUID/prefix2mask/mask2prefix/initializeSession/closeSession/clearData 并断言行为（UUID 格式、掩码换算、字段清零）"
    command: "./test_libonvif"

# 测试断言总数（近似值, 用于质量评估）
assertion_count: 10
