# 版本级 manifest — libonvif 1.4.4
# 遵循 ARCHIVE-SPEC v2.0

version: "1.4.4"
software: "libonvif"
status: built
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://github.com/sr99622/libonvif/archive/refs/tags/v1.4.4.tar.gz"
  sha256: "01b0311f885967d679f979d278aca1b203eabf478ffc3c75af4a43cd638a1444"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_GUI=OFF（默认关，避免 Qt/ffmpeg 子项目）"
    - "-DCMAKE_SKIP_INSTALL_RPATH=ON"
  dependencies:
    - "libxml2/2.15.3.1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 CMakeLists 用 set(CMAKE_CXX_FLAGS ...) 硬化旗标整体覆盖了 Conan 工具链注入的旗标（-stdlib=libc++ 等），改为 add_compile_options 等价形式后构建正常"
  - "上游 CMAKE_INSTALL_INCLUDEDIR 含 CMAKE_LIBRARY_ARCHITECTURE 目标架构子目录，会把 onvif.h 埋进多层 include 路径，package() 归一化为 include/"
  - "公共头 onvif.h 不自带 libxml2 include（消费端需先包含 libxml 头），cpp_info.requires 传播 libxml2::libxml2"
