software: lavalauncher
display: "LavaLauncher"
description: "A simple and highly configurable launcher for Wayland（Wayland 启动器）"
category: utilities
homepage: "https://git.sr.ht/~leon_plickat/lavalauncher"
license: GPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "Wayland 启动器（lavabar），C 语言 meson 构建"
    - "依赖链：wayland/1.22.0 + wayland-protocols/1.36 + cairo/1.18.4 + libxkbcommon/1.6.0 + librsvg/2.62.3（均为本仓库/制品仓已有适配）"
    - "wayland-scanner 需从 wayland 源码静态编译替代（OHOS 沙箱禁止动态加载共享库工具）"
    - "noop() 旧式声明被赋给多种不同签名回调，需 clang 警告白名单"
    - "上游无测试套件，以 --version 冒烟测试验证"
  common_dependencies:
    - "wayland/1.22.0"
    - "wayland-protocols/1.36"
    - "cairo/1.18.4"
    - "libxkbcommon/1.6.0"
    - "librsvg/2.62.3"

versions:
  "2.1.1":
    status: published
    build_date: "2026-09-24"
    source_url: "https://git.sr.ht/~leon_plickat/lavalauncher/archive/v2.1.1.tar.gz"
    packaging: "packaging/"
