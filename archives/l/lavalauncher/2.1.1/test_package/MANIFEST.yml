# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: lavalauncher/2.1.1
homepage: "https://git.sr.ht/~leon_plickat/lavalauncher"

# 上游测试命令 (用于 meson test --list 分析)
upstream_check_command: "meson test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（lavalauncher 2.1.1 无测试目标）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证：可执行文件冒烟)
test_package_tests:
  - file: src/test_lavalauncher.sh
    description: "验证 bin/lavalauncher 存在并可执行（--version 冒烟）"
    command: "bash src/test_lavalauncher.sh <bin_dir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
