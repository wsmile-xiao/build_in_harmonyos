software: libtraceevent
display: "libtraceevent"
description: "Linux trace event handling library"
category: system
homepage: "https://git.kernel.org/pub/scm/libs/libtrace/libtraceevent.git/"
license: LGPL-2.1/GPL-2.0
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "纯Makefile项目，无configure脚本"
    - "需补丁解决BTF类型定义缺失和qsort_r兼容性"
    - "生成动态库+静态库+14个插件"
  common_dependencies: []
  known_issues:
    - "OHOS内核BTF缺少FLOAT/DECL_TAG/TYPE_TAG/ENUM64类型定义"
    - "musl libc不提供qsort_r函数"

# 版本索引
versions:
  "1.9.0":
    status: built
    build_date: "2026-06-12"