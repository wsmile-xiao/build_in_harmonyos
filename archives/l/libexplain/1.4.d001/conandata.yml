sources:
  url: "https://downloads.sourceforge.net/project/libexplain/1.4/libexplain-1.4.tar.gz"
  sha256: "28863b65eccc74934e237cac41364cb3c1802c36c9e2318ed0417460fee83f80"
patches:
  "1.4.d001":
    - patch_file: "patches/0001-config-guess-harmonyos.patch"
      patch_description: "config.guess（2012 版）不认识 HarmonyOS（uname -s=HarmonyOS）导致 configure 无法判定 build 类型——新增 aarch64:HarmonyOS 分支输出 aarch64-unknown-linux-gnu（配套 config.sub 2012 只接受 gnu 后缀，三元组仅用于构建树命名，实际编译器为 musl clang）"
      patch_type: "portability"
    - patch_file: "patches/0002-acl-stub-no-sysacl.patch"
      patch_description: "ac/acl/libacl.c 的 acl_entries 回退体在无 sys/acl.h 的平台引用了不存在的 acl_entry_t/acl_get_entry/ACL_FIRST_ENTRY——平台无 ACL（SDK 无 sys/acl.h），回退体改返回 0（此平台上不可能产生有效 acl_t，行为等价）"
      patch_type: "portability"
    - patch_file: "patches/0003-enfile-sysctl-guard.patch"
      patch_description: "buffer/enfile.c 与 buffer/errno/listen.c 的 __linux__ 分支改用 defined(SYS__sysctl) 加护——musl 移除了已废弃的 _sysctl（SYS__sysctl 未定义），分支体引用它导致编译失败（两文件同模式）"
      patch_type: "portability"
    - patch_file: "patches/0004-sizeof-opaque-file.patch"
      patch_description: "4 处对不透明 FILE 取 sizeof(*fp)（glibc 的 FILE 是完整类型，musl 不透明）改为 sizeof(char)——仅用于指针有效性探查的字节数，行为等价"
      patch_type: "portability"
    - patch_file: "patches/0005-fs-flags-guard.patch"
      patch_description: "buffer/file_inode_flags.c 的 FS_ECOMPR_FL/FS_DIRECTIO_FL 表项加 #ifdef——musl 的 linux/fs.h 是子集，无这两个常量"
      patch_type: "portability"
    - patch_file: "patches/0006-socket-include-order.patch"
      patch_description: "buffer/ifreq_data/hwtstamp_config.c 调整 include 顺序（ac/net/if.h 先于 ac/linux/net_tstamp.h，即 musl sys/socket.h 先于内核 linux/socket.h）+ 配方 -D__UAPI_DEF_SOCKADDR=0 配套——SDK 的 linux/libc-compat.h 不认识 musl 的 sys/socket.h 守卫，两侧都会重复定义 sockaddr_storage，须 libc 在前且显式告知 uapi 跳过"
      patch_type: "portability"
    - patch_file: "patches/0007-open-flags-oexec.patch"
      patch_description: "buffer/open_flags.c 的 case O_EXEC 加 O_SEARCH 排重——musl 上 O_EXEC==O_SEARCH==O_PATH==010000000，switch 出现重复 case 值"
      patch_type: "portability"
    - patch_file: "patches/0008-ppp-idle-linux-header.patch"
      patch_description: "buffer/ppp_idle.c 在无 net/ppp_defs.h 时改用 ac/linux/ppp_defs.h（SDK 只有 linux/ppp_defs.h 且含 struct ppp_idle；上游只认 net/ 变体导致 struct ppp_idle 不完整）"
      patch_type: "portability"
    - patch_file: "patches/0009-signal-rtmin-constant.patch"
      patch_description: "buffer/signal.c 的 SIGRTMIN/SIGRTMAX 表项加 defined(__GLIBC__)——musl 上这两个是运行时调用（__libc_current_sigrtmin()）非编译期常量，静态表初始化报错（libc 探针，非平台宏）"
      patch_type: "portability"
    - patch_file: "patches/0010-sockaddr-rose-ash-ec.patch"
      patch_description: "buffer/sockaddr.c 的 AF_ROSE/AF_ASH/AF_ECONET 段守卫从单看 AF 宏改为同时要求对应协议头存在（HAVE_NETROSE_ROSE_H/HAVE_NETASH_ASH_H/HAVE_NETECONET_EC_H）——musl 有 AF_* 常量但无这些协议的结构体定义，sizeof 不完整类型报错"
      patch_type: "portability"
    - patch_file: "patches/0011-termio-guard.patch"
      patch_description: "iocontrol/tcgeta|tcseta|tcsetaf|tcsetaw.c 的 TCxxx 守卫加 HAVE_SYS_TERMIO_H/HAVE_TERMIO_H 条件——musl 有 TCGETA 等 ioctl 常量但无 struct termio（只有 termios），sizeof 不完整类型报错"
      patch_type: "portability"
    - patch_file: "patches/0012-yacc-sed-case.patch"
      patch_description: "Makefile.in 的 4 条语法器符号重命名 sed 从 s/[yY][yY]/ 改 s/yy/——bison 3.x 生成的 y.tab.c 有 YYerror 枚举值（=256），大写 YY 也被改名后与重命名后的 yyerror 函数撞名（called object type 'int'）；小写 yy 精确匹配即可，YYSTYPE 等两侧一致不破坏"
      patch_type: "portability"
    - patch_file: "patches/0013-stderr-extern.patch"
      patch_description: "output/stderr.h 的 explain_output_static_stderr 声明补 extern——旧 C 头文件暂定定义惯例在现代链接器（-fno-common 默认）下与 stderr.c 的实体定义撞车（duplicate symbol）"
      patch_type: "portability"
    - patch_file: "patches/0014-getw-musl.patch"
      patch_description: "getw_or_die.c：musl 无 getw(3)，非 glibc 时按规范用 getc 循环实现（本机字节序 int）"
      patch_type: "portability"
    - patch_file: "patches/0015-adjtime-enosys.patch"
      patch_description: "adjtime_on_error.c：musl/OHOS 无 adjtime(2)（已废弃被移除），非 glibc 时返回 ENOSYS（调用方得到可解释的失败而非链接错误）"
      patch_type: "portability"
    - patch_file: "patches/0016-test-iconv-textdomain.patch"
      patch_description: "test/iconv_open/main.c 的 textdomain() 调用加 HAVE_LIBINTL 守卫——平台有 libintl.h 头但无 libintl 库实现（头探测过、链接缺符号；守卫须用库级宏）"
      patch_type: "portability"
