# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: libexplain/1.4.d001
homepage: "https://sourceforge.net/projects/libexplain/"

# 上游测试执行（真机实测，2026-09-23）：
#   - 上游 119 个测试程序（test/*/main.c，与审查实测 N 一致）经
#     `make -k bin/test_*` 构建后 118 个就位（bin/ 含套件前置 test_prelude）；
#     test_iconv_open 链接失败（平台 iconv 差异，Error 1）。
#   - 上游回归套件经 `make check`（sure 目标，Makefile 自带聚合入口）
#     同口径真机全量执行：t0001a–t9999a 共 706 个 golden 用例，
#     668 通过 / 38 失败（94.6%），失败逐类归因（平台权限模型 / 路径
#     布局 / 文件系统语义 / 消息措辞，详见 PR 描述）。
#   - 环境适配（不改用例断言）：test_prelude 的临时目录 /tmp 在本平台
#     只读，真机执行时重写为应用可写目录；golden 与判据零改动。
upstream_check_command: "make check（sure 目标，上游自带聚合 runner）"
upstream_test_in_build: false
upstream_test_command: "真机已执行：706 用例 668 过 / 38 败（94.6%），失败逐类归因见 PR 描述"

upstream_tests:
  - file: "test/00..07,99（t0001a–t9999a golden 套件）"
    description: >-
      上游回归套件全量 706 个用例，真机按 make check 口径逐个执行
      （PATH=bin sh test/DD/tNNNNa.sh，与上游 Makefile 规则一致），
      668 通过 / 38 失败。
  - file: "test/*/main.c（119 个测试程序）"
    description: >-
      套件依赖的按系统调用测试程序，118 个构建成功并参与套件执行；
      test_iconv_open 链接失败（平台 iconv 差异）。

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_explain.c
    description: >-
      库级消费者测试（2 项断言）：对失败的 open(2) 调 explain_open——
      解释文本含 errno 原文（No such file or directory）且含系统调用名 open；
      失败即非零退出。
  - file: test_package/test_explain_cli.sh
    description: >-
      CLI 消费者测试（3 项断言）：explain -V 版本输出含 "libexplain version 1.4"（1 项）→
      explain -e ENOENT open /nonexistent 输出含 ENOENT 原文（1 项）与系统调用名 open（1 项）；
      失败即非零退出。
