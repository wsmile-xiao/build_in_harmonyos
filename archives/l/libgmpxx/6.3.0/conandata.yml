# conandata.yml — libgmpxx 6.3.0
# 源码即 GMP 6.3.0 官方 tarball（与 archives/g/gmp/6.3.0 同一份，sha256 一致）。
# CI worker 直连 ftpmirror.gnu.org（302 → mirror2.evolution-host.com）连接超时，
# 故给出有序 URL 列表：前三项为国内权威 GNU 镜像（同一份官方 tarball，逐个尝试，
# 任一命中后仍按 sha256 校验），末项 GNU 官方 ftp.gnu.org 兜底。

sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/gnu/gmp/gmp-6.3.0.tar.xz"
    - "https://mirrors.ustc.edu.cn/gnu/gmp/gmp-6.3.0.tar.xz"
    - "https://mirrors.aliyun.com/gnu/gmp/gmp-6.3.0.tar.xz"
    - "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz"
  sha256: "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"

patches:
  - patch_file: "patches/0001-configfsf.guess.patch"
    patch_description: "configfsf.guess 识别 HarmonyOS/OHOS 三元组"
    patch_type: "portability"
  - patch_file: "patches/0002-configfsf.sub.patch"
    patch_description: "configfsf.sub 接受 ohos-linux 系统别名"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure 临时目录改用 TMPDIR，去除 umask 假设"
    patch_type: "portability"
