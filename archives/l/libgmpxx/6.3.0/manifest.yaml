software: libgmpxx
version: "6.3.0"
build_system: autotools
status: built
build_date: "2026-09-19"
source:
  url: "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz"
  sha256: "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898"
  tar_format: tar.xz
build:
  system: autotools
  configure_options:
    - "--enable-cxx"
    - "--disable-shared"
    - "--enable-static"
    - "--with-pic"
    - "ABI=64"
  dependencies:
    - gmp/6.3.0
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-configfsf.guess.patch"
  - "0002-configfsf.sub.patch"
  - "0003-configure.patch"
knowledge_gained:
  - "libgmpxx 是 GMP 源码树内 C++ 绑定的打包名而非独立上游项目：cxx/*.cc 全部 include 内部头 gmp-impl.h，必须完整 configure 后随树构建，无法只挑 gmpxx.h 头文件打包"  # knowledge_ref: E585
  - "libgmpxx 静态包与 gmp/6.3.0（纯静态 C 包）同构配置（--enable-cxx 增量），config.h 与内部符号 ABI 天然一致；打包阶段裁剪 libgmp 本体避免与 gmp 包双份安装"  # knowledge_ref: E585
  - "共享链需求由 gmp/6.3.0.1（--enable-cxx + shared=True 整包）覆盖，libgmpxx/6.3.0 保持静态专用，二者形成生态分工"  # knowledge_ref: E585
