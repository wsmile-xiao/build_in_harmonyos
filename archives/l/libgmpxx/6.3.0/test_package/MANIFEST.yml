# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: libgmpxx/6.3.0
homepage: "https://gmplib.org/"

# ── 上游测试总量 N（框架注册口径 = tests/*/Makefile.am 的 check_PROGRAMS 注册项）──
# GMP 6.3.0 官方 tarball tests/** = 200：
#   = 190 个 t-* 命名项（外部审查「实测 N=190」口径）+ 10 个具名项
#     （mpz: reuse/dive/dive_ui/convert/io/logic；mpq: io/reuse；mpn: logic；mpf: reuse）
#   逐目录：tests/ 8、tests/cxx 22、tests/misc 3、tests/mpf 28、tests/mpn 53、
#           tests/mpq 15、tests/mpz 64、tests/rand 7 → 合计 200
#   自洽式：TOTAL 200 = PASS 22（tests/cxx 全部）+ FAIL 0 + SKIP 0 + NOT_RUN 178
#   （NOT_RUN 不写 PASS）；逐目录 PASS/NOT_RUN 分解见 reports/test-report.md §1.1。
#   范围边界（不计入 N）：tests/devel 只有 EXTRA_PROGRAMS（不属 make check）；
#   mini-gmp/tests 的 31 个 t-* 用独立手写 Makefile + run-tests（非 check_PROGRAMS
#   注册、主 configure 不构建）。
# N 取数命令（设备可直接执行；S = GMP 官方 tarball 解包根，sha256 a3c2b802…8898）：
#   python3 -c "
#   import os,re
#   S='<gmp-6.3.0 解包根>'; tot=0; t=0
#   for dp,_,fs in os.walk(os.path.join(S,'tests')):
#       if 'devel' in dp.split(os.sep) or 'Makefile.am' not in fs: continue
#       x=open(os.path.join(dp,'Makefile.am')).read().splitlines()
#       for i,l in enumerate(x):
#           if re.match(r'\s*check_PROGRAMS\s*=',l):
#               b=l.split('=',1)[1]
#               while b.rstrip().endswith('\\'): i+=1; b=b.rstrip()[:-1]+' '+x[i]
#               p=[w for w in b.split() if '$' not in w]; tot+=len(p)
#               t+=len([w for w in p if w.startswith('t-')]); break
#   print('TOTAL=%d T_STAR=%d'%(tot,t))"
#   实测输出：TOTAL=200  T_STAR=190
# 本次实际运行 N′ = 22（tests/cxx 全部，22/22 PASS）。未运行 178 项的测试对象是
#   libgmp C API，不在本包 install 面（package() 裁剪 libgmp.a/gmp.h/gmp.pc，C 库由
#   gmp/6.3.0 包交付），按 NOT_RUN 记账、不写 PASS。设备 HMDFS getcwd(2) 缺陷使
#   libtool 链接测试可执行文件确定性失败，无法纳入 in-build check；22 个程序已用
#   直接静态链接 harness 在设备实跑，逐程序记录见 reports/upstream-tests-cxx-log.md
upstream_check_command: "直接静态链接 harness 实跑"
upstream_test_total: 200
upstream_test_total_unit: "check_PROGRAMS 框架注册项（GMP 6.3.0 tests/** 含 tests/cxx 22；审方 t-* 口径 190 为本值子集）"
upstream_test_total_command: "见上方注释中的 python 取数命令（实测输出 TOTAL=200 T_STAR=190）"
upstream_test_run: 22
upstream_test_not_run: 178
upstream_test_not_run_reason: "未运行项测试对象为 libgmp C API，不在本包 install 面（package() 裁剪 libgmp.a/gmp.h/gmp.pc，C 库由 gmp/6.3.0 包交付）"
upstream_test_in_build: false
upstream_test_command: "直接静态链接 harness（clang++ -DNDEBUG -O3 -stdlib=libc++ -std=c++17，逐程序链 libtests.a/libgmpxx.a/libgmp.a 实跑）"

