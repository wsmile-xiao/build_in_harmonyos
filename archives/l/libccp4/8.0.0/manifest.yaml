# 版本级 manifest — libccp4 8.0.0
# 遵循 ARCHIVE-SPEC v2.0

version: "8.0.0"
software: "libccp4"
status: published
build_date: "2026-09-15"
build_system: "cmake"

source:
  url: "https://github.com/ndevenish/libccp4/archive/refs/tags/v8.0.0.tar.gz"
  sha256: "298d1517723d95548c3d916c326d8054b2fa1e11b2a5e44822fe7a2bada50178"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DFORTRAN_LIB=OFF"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: portability
    platform_only: True
    guard: 'none'

knowledge_gained:
  - "CMake 4.x 移除了 cmake_minimum_required < 3.5 的兼容（E103）：补丁 bump 至 3.5"
  - "project() 声明 Fortran 语言时 CMake 强制探测编译器（即便 FORTRAN_LIB=OFF）：从 project() 语言列表移除 Fortran（E577 草稿）"
  - "OHOS 无 Platform/HarmonyOS.cmake 导致 CMAKE_SHARED_LIBRARY_SONAME_C_FLAG 为空、.so 无 DT_SONAME（E383）：conanfile generate() 注入 -Wl,-soname, flag，L5 soname 门禁通过"