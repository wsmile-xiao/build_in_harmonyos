# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: libccp4/8.0.0
homepage: "https://gitlab.com/CCP4/libccp4"

# 上游测试命令（用于分析）
# libccp4 8.0.0 的 CMake 构建无测试目标（CMakeLists.txt 无 enable_testing/add_test，
# configure.ac 亦无测试目标）；仓库内仅有 fortran/testlib.f（Fortran 机器相关例程
# 测试程序，属 ccp4f/FORTRAN_LIB 部分）。本适配关闭 FORTRAN_LIB（OHOS 无 Fortran
# 编译器、mmdb2 未发布），故上游无可执行测试用例。
upstream_check_command: "ctest -N"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无，声明 0 个）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用 ccp4c API）
test_package_tests:
  - file: test.c
    description: "调用 ccp4uc_calc_rcell 计算倒格子参数并断言 a*/b*/c*/角度/倒格子体积；ccp4uc_frac_orth_mat 构建正交化矩阵并断言晶胞体积；ccp4uc_orth_to_frac/ccp4uc_frac_to_orth 正反变换 roundtrip；ccp4_liberr_verbosity/ccp4_strerror 错误处理 API"
    command: "./test_libccp4"

# 测试断言总数（test.c 中 CHECK 计数：7倒格子+2矩阵+3roundtrip+2错误API=14）
assertion_count: 14
