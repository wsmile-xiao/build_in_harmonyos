software: lib1541img
display: "lib1541img"
description: "处理 Commodore 1541 磁盘镜像（.d64）的 C 库"
category: library
homepage: "https://github.com/excess-c64/lib1541img"
license: BSD-2-Clause
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 C（C11），无外部依赖（仅标准 C 库）"
    - "上游用 zimk 子模块构建，发布包不含；本仓库直接编译 src/lib/1541img/*.c 为 lib1541img.a"
    - "安装 include/1541img/*.h 与 lib/lib1541img.a；CMake 目标 1541img::1541img"
    - "上游无测试；test_package 端到端验证（建盘→加文件→写→读回）"
  common_dependencies: []

versions:
