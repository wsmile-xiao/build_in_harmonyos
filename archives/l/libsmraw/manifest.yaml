software: libsmraw
display: "libsmraw"
description: "Library to access the (Windows) Split RAW image format"
category: system
homepage: "https://github.com/libyal/libsmraw"
license: LGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "纯 C libyal 库：14 个 libyal 组件（libbfio/libcdata/libcerror/libcfile/libclocale/libcnotify/libcpath/libcsplit/libcthreads/libfcache/libfdata/libfvalue/libhmac/libuna，另含顶层 common/ 共享支撑代码）以 standalone 形式内嵌在发布包内，无外部 Conan 依赖"
    - "随包 configure 有 2 处 umask 077，在 HMDFS 上会生成连创建者都无法写入的 0700 临时目录（E011）；构建期改为 umask 022 并全程保持"
    - "本版本随包 config.sub 为 2023-06-23 vintage（同 libvsgpt 0-20240504 世代），不识别 linux-ohos，OHOS 下显式使用 --build/--host=aarch64-unknown-linux-gnu"
    - "源码树内脚本不能直接执行，configure 经 CONFIG_SHELL（/data/service/hnp/bin/bash）启动，make check 经 LOG_COMPILER 用同一解释器"
    - "上游 make check 的 5 个 shell 入口 + 11 个 C 测试程序在 build() 内真实执行（发布包不含 tests/input/ 夹具，test_smrawverify.sh 按上游规则 SKIP）"
  common_dependencies: []

versions:
  "20240506":
    status: built
    build_date: "2026-09-20"
    conan_ref: "libsmraw/20240506"
