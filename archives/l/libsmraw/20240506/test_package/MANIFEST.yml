# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游清点口径（libyal 家族，同 libvsgpt/0-20240504 先例）：automake 的
# TESTS（shell 入口）+ check_PROGRAMS（C 测试程序）两个注册面，共 16 项。
# 发布用 orig tarball 不含 tests/input/ 夹具（tar tzf | grep -c '/input/' = 0）。

package: libsmraw/20240506
homepage: https://github.com/libyal/libsmraw

# 上游测试入口（在 build() 内执行，见 conanfile.py 与 notes.md）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check LOG_COMPILER=<bash>"

# 上游注册的可执行测试单元（口径：automake 的 TESTS + check_PROGRAMS 两个注册面）
upstream_tests:
  - name: "test_library.sh"
    source: tests/test_library.sh
    description: "库测试入口：驱动 7 个 C 测试程序（error filename information_file io_handle notify support 无输入 + handle 走 LIBRARY_TESTS_WITH_INPUT，input/ 缺失时按脚本内 if test -d input 分支退化为无输入运行）"
    command: "./tests/test_library.sh"
  - name: "test_glob.sh"
    source: tests/test_glob.sh
    description: "segment 文件名 glob 测试入口：自建 TMPDIR 输入，驱动 smraw_test_glob"
    command: "./tests/test_glob.sh"
  - name: "test_write_functions.sh"
    source: tests/test_write_functions.sh
    description: "写函数测试入口：以 ${TMPDIR} 为输出目录驱动 smraw_test_write"
    command: "./tests/test_write_functions.sh"
  - name: "test_tools.sh"
    source: tests/test_tools.sh
    description: "工具函数测试入口：驱动 tools_output / tools_signal 2 个 C 测试程序"
    command: "./tests/test_tools.sh"
  - name: "test_smrawverify.sh"
    source: tests/test_smrawverify.sh
    description: "smrawverify 端到端测试入口：依赖 tests/input/ 夹具；发布用 orig tarball 不含该目录，按上游规则 exit 77 → automake SKIP"
    command: "./tests/test_smrawverify.sh"
  - name: "check_PROGRAMS (11)"
    source: tests/Makefile.am
    description: "11 个 C 测试程序（error filename glob handle information_file io_handle notify support tools_output tools_signal write）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libsmraw.c
    description: "通用消费者断言：版本串（上游 20240506，非 Conan ref）、codepage 正常/错误路径、单段 RAW 打开/读回、seek 后读、offset 推进、handle 生命周期（22 项断言）"
    command: "./test_libsmraw"
  - file: test_ohos.c
    description: "鸿蒙专项消费者测试：__OHOS__ 编译目标、TMPDIR 语义（存在/非 /tmp/可写）、在 TMPDIR 下合成 8 KiB 双段 Split RAW 镜像（2×4 KiB segment）并经多文件名入口读回全链路（打开→media size→全量读→段内 marker→跨段边界 32 字节读→offset→signal_abort→关闭释放）（23 项断言）"
    command: "./test_ohos"
    platform: OHOS

harmony_specific_tests:
  # 计数口径：本列表逐项给出**互不重叠**的消费者测试程序与断言数，
  # assertion_count = test_libsmraw.c 的 22 项 + test_ohos.c 的 23 项 = 45。
  - name: "ohos-consumer-tests"
    description: "test_ohos.c（鸿蒙专项消费者测试）：__OHOS__ 编译目标、TMPDIR 语义（存在/非只读 /tmp/可写）、在 TMPDIR 下合成 8 KiB 双段 Split RAW 镜像并读回全链路（含跨段边界读）"
    command: "./test_ohos"
    assertions: 23
    platform: OHOS
  - name: "generic-consumer-tests"
    description: "test_libsmraw.c（通用消费者断言）：版本串、codepage 正常/错误路径、单段 RAW 打开/读回、seek 后读、offset 推进、handle 生命周期（该程序在 OHOS 上同样编译运行，但断言内容不依赖平台特性）"
    command: "./test_libsmraw"
    assertions: 22
  - name: "installed-cli-load"
    description: "安装后的 bin/smrawverify -V 必须能加载共享库并输出版本串（含 20240506）（运行/加载验证，在 test() 内执行；是运行检查，不计断言数）"
    command: "smrawverify -V"
    assertions: 0
    platform: OHOS

assertion_count: 45
