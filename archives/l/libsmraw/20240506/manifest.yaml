software: libsmraw
version: "20240506"
status: built
build_date: "2026-09-20"
difficulty: "B"
adaptation_path: "路径 A（基础适配）"

source:
  # 上游 GitHub（libyal/libsmraw）实测（2026-09-20）：git ls-remote 有 refs/tags/20240506
  # （commit 995b9e200ae8c836439f14741253143803fecb0c），但对应 release 资产实测 404
  # （libsmraw-experimental-20240506.tar.gz，响应体 "Not Found" 9 字节）；使用权威发行版
  # 归档的 pristine orig tarball，sha256 与 PGP 签名的 libsmraw_20240506-2.dsc 逐字一致。
  url: "https://deb.debian.org/debian/pool/main/libs/libsmraw/libsmraw_20240506.orig.tar.gz"
  sha256: "1d928be52646d4e8283e452824c1839b0f844438848efe7888cc2c5613d12d58"
  tar_format: tar.gz
  upstream_repo: "https://github.com/libyal/libsmraw"
  upstream_tag: "https://github.com/libyal/libsmraw/releases/tag/20240506"
  release_artifact: "upstream release asset absent (404, tag exists); Debian pristine orig tarball used"

build:
  system: autotools
  # 单行 flow 列表：clean_verify 的 G0 原生探测按行解析该字段，
  # 块列表形态会被截成裸 `-` 传给 configure（"unrecognized option: '-'"）
  configure_options: ["--enable-shared", "--disable-static", "--disable-python", "--enable-static-executables=no", "--build=aarch64-unknown-linux-gnu", "--host=aarch64-unknown-linux-gnu"]
  dependencies: []
  bundled_dependencies:
    - libbfio
    - libcdata
    - libcerror
    - libcfile
    - libclocale
    - libcnotify
    - libcpath
    - libcsplit
    - libcthreads
    - libfcache
    - libfdata
    - libfvalue
    - libhmac
    - libuna
  cc: clang
  cxx: clang++
  env_vars:
    - "CONFIG_SHELL=/data/service/hnp/bin/bash"
    - "SHELL=/data/service/hnp/bin/bash"

# 平台适配全部内联在 conanfile.py build()，不新增 patches/ 文件，也不改上游任何 C/H 源文件
# 与测试脚本；唯一例外是 OHOS 构建期（在 Conan 缓存副本上）把随包 configure 内 2 处
# `umask 077` 改为 `022`（HMDFS 必需，E011）——详见 notes.md。
patches_applied: []

knowledge_gained:
  - "HMDFS 上 autotools configure 的 umask 077 会生成连创建者都无法写入的 0700 临时目录；OHOS 构建期把源码树 configure 内 2 处 umask 077 改为 022 并全程 umask 022 即通过"  # knowledge_ref: E011
  - "libyal 同族 config.sub 对 linux-ohos 的接受度随发行版年代变化，三元组必须先实测再写配方；libsmraw 20240506 与 libvsgpt 0-20240504 同为 2023-06-23 vintage，显式 aarch64-unknown-linux-gnu"  # knowledge_ref: DRAFT-E591-libvsgpt-gpt-consumer-test-and-triplet-vintage
  - "libyal 上游 N 必须按 automake 两个注册面分别清点并披露（TESTS shell 入口 + check_PROGRAMS C 程序）；libsmraw 20240506 为 TESTS 5 + check_PROGRAMS 11 = 16，其中 test_smrawverify.sh 依赖 tests/input/ 夹具（发布包不含）按上游规则 exit 77 SKIP，test_library.sh 的 WITH_INPUT 项（handle）在 input/ 缺失时退化为无输入运行"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api
  - "lang-preflight 对「纯 C 库 + 绑定模块打包元数据在源码根」的 libyal 形态判 mixed→env_unsupported 属假阳性（继 libvsgpt 后家族第 5 次独立复现）：根目录 pyproject.toml/setup.py 只是 pysmraw 绑定打包元数据，主体 c:216/222 占 97%，构建入口是 configure/Makefile.am"  # knowledge_ref: DRAFT-E586-libyal-ohos-false-signals-langdetect-and-api
  - "conandata.yml sources 段带 filename 键时，配方 get() 调用点不得再显式传 filename=——两者并存必抛 TypeError: got multiple values for keyword argument 'filename'，正确写法 get(self, strip_root=True, **self.conan_data[\"sources\"])（键的单一事实来源在 conandata）"  # knowledge_ref: DRAFT-E597-libsmraw-get-filename-duplicate-kwarg

tests:
  upstream:
    command: "make check"
    registration: "tests/Makefile.am: TESTS + check_PROGRAMS"
    cases: 16
    passed: 15
    skipped: 1
    failed: 0
    not_run: 0
    note: "round-4 干净轮（SHA 310ccd0ba）实测：runner 级 TOTAL 5 / PASS 4 / SKIP 1 / FAIL 0（test_smrawverify.sh 依赖发布包不含的 tests/input/ 夹具，按上游规则 exit 77 SKIP）；其内部驱动的 11 个 check_PROGRAMS 全部真实执行且通过。权威副本 $TASK_DIR/evidence-310ccd0/conan-create.log（sha256 cfd1f924…），逐字读数见 reports/test-report.md"
  adapted:
    command: "conan create（W3）内 test_package"
    cases: 2
    passed: 2
    pass_rate: "2/2 (100%)"
    assertions: 45
    breakdown:
      generic_consumer_assertions: 22
      harmony_specific_assertions: 23
    note: "test_libsmraw.c 22 项通用断言；test_ohos.c 23 项鸿蒙专项断言（在 TMPDIR 下合成 8 KiB 双段 Split RAW 镜像并读回全链路，含跨段边界读）；另在 test() 内以安装后的 bin/smrawverify -V 做 CLI 加载验证"

blockers: []
