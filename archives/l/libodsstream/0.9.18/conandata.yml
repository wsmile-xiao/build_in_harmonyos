# conandata.yml — libodsstream 0.9.18

sources:
  "0.9.18":
    url: "https://forgemia.inra.fr/pappso/libodsstream/-/archive/upstream/0.9.18/libodsstream-upstream-0.9.18.tar.gz"
    sha256: "a0df7c7b55aaf199824dc7d4064a4b8c7bd0549fc6252b51875718da73a4ca60"

patches:
  "0.9.18":
    - patch_file: "patches/0001-test_ods-fix-cwd-relative-data-path.patch"
      patch_description: "test_ods uses a cwd-relative '../' path for xic.ods; switch to CMAKE_SOURCE_DIR so ctest (any working directory) finds test/data."
      patch_type: "portability"
    - patch_file: "patches/0002-unix-toolchain-quazip-config-name-compat.patch"
      patch_description: "Upstream requires find_package(QuaZip-Qt6); the OHOS conan registry ships quazip linked to Qt5 (conan CMakeDeps target QuaZip-Qt5::quazip1-qt5). Try Qt6 first, fall back to Qt5 and alias to the canonical QuaZip::QuaZip target."
      patch_type: "portability"
    - patch_file: "patches/0003-cmake-harmonyos-unix-toolchain-include.patch"
      patch_description: "CMAKE_SYSTEM_NAME=HarmonyOS has no Platform/HarmonyOS.cmake in CMake 4.1, so the UNIX variable is never defined and upstream's elseif(UNIX AND NOT APPLE) platform branch is skipped - unix-toolchain.cmake (ZLIB/Catch2/QuaZip find_package) never runs. Match SYSTEM_UNAME_S=HarmonyOS too."
      patch_type: "portability"
    - patch_file: "patches/0004-src-cmake-build-shared-libs-honor.patch"
      patch_description: "Upstream hardcodes add_library(Core SHARED): the registry zlib/1.3.1 static archive is non-PIC and cannot be linked into a shared lib on aarch64 (R_AARCH64_ADD_ABS_LO12_NC). Honour BUILD_SHARED_LIBS so conan shared=False builds the static lib."
      patch_type: "portability"
    - patch_file: "patches/0005-test-cmake-static-fallback-and-env-modification.patch"
      patch_description: "Three test-side fixes: (1) OdsStream_LIBRARY hardcoded .so - fall back to libodsstream.a for static builds; (2) set_tests_properties ENVIRONMENT replaces LD_LIBRARY_PATH hiding conan dependency lib dirs at test runtime (Qt libs fail to load) - switch to ENVIRONMENT_MODIFICATION path_list_prepend (CMake >= 3.22); (3) add_dependencies on odsstream-static/Core - the tests link a plain file path so parallel make would not otherwise order the library build before the test link (CI failure: No rule to make target src/libodsstream.a)."
      patch_type: "portability"

