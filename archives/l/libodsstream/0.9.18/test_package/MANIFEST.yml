# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: libodsstream/0.9.18
homepage: https://forgemia.inra.fr/pappso/libodsstream

# 上游测试命令 (用于 make -n check 分析)
# 上游用 CTest + Catch2：cmake -DMAKE_TEST=1 后 make test / ctest
upstream_check_command: "ctest --output-on-failure  # 需要 -DMAKE_TEST=1 配置"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

# 上游 add_test 注册的测试程序（N=5 TEST_CASE 口径）
upstream_tests:
  - file: test/test_ods.cpp
    source: libodsstream-upstream-0.9.18.tar.gz/test/test_ods.cpp
    description: "ODS 读取测试（Catch2）：metadata bug files + xic.ods 解析，2 TEST_CASE"
    command: "./test_ods"
  - file: test/test_tsv.cpp
    source: libodsstream-upstream-0.9.18.tar.gz/test/test_tsv.cpp
    description: "TSV 写入测试（Catch2）：TsvDirectoryWriter + ZipTsvOutputStream，2 TEST_CASE"
    command: "./test_tsv"
  - file: test/test_zlib.cpp
    source: libodsstream-upstream-0.9.18.tar.gz/test/test_zlib.cpp
    description: "zlib 合规测试（Catch2）：ODS zip 头解析，1 TEST_CASE"
    command: "./test_zlib"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_odsstream.cpp
    description: "OdsDocWriter 写 → OdsDocReader 读回往返：sheet 名/数值/文本 cell 完整性，11 项断言"
    command: "./test_odsstream"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 Catch2：test_ods 2 case（REQUIRE_NOTHROW×2）+ test_tsv 2 case + test_zlib 1 case = 5 TEST_CASE
# test_package：11 check() 断言
assertion_count: 16
