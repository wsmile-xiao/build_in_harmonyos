version: "0.9.18"
status: built
build_date: "2026-09-22"

source:
  url: "https://forgemia.inra.fr/pappso/libodsstream/-/archive/upstream/0.9.18/libodsstream-upstream-0.9.18.tar.gz"
  tar_format: tar.gz

build:
  system: cmake
  cc: clang

patches_applied:
  - "0001-test_ods-fix-cwd-relative-data-path.patch"
  - "0002-unix-toolchain-quazip-config-name-compat.patch"
  - "0003-cmake-harmonyos-unix-toolchain-include.patch"
  - "0004-src-cmake-build-shared-libs-honor.patch"
  - "0005-test-cmake-static-fallback-and-env-modification.patch"

knowledge_gained:
  - "Qt5 线 quazip 包与 Qt6 代码 ABI 断裂：Qt6 把 OpenModeFlag 移入 QIODeviceBase，mangled 名变化（_ZN9QIODevice12OpenModeFlagE vs _ZN13QIODeviceBase12OpenModeFlagE）——Qt6 消费者必须用 Qt6 线 QuaZip，本配方 vendor quazip 1.4 源码以 Qt6 构建（fceux vendored-minizip 先例）"
  - "CMAKE_SYSTEM_NAME=HarmonyOS 下 UNIX 变量未定义（CMake 4.1 无 Platform/HarmonyOS.cmake），上游 elseif(UNIX AND NOT APPLE) 平台分支整段跳过——补 SYSTEM_UNAME_S MATCHES HarmonyOS 条件"
  - "set_tests_properties ENVIRONMENT 会整体替换 LD_LIBRARY_PATH，藏掉 conan 依赖库目录（Qt 库加载失败）——改用 ENVIRONMENT_MODIFICATION path_list_prepend"
  - "zlib/1.3.1 制品仓二进制非 PIC，链入共享库报 R_AARCH64_ADD_ABS_LO12_NC（z_errmsg）；override 成 PIC 版会连锁触发 qtbase 全量源码重建——本包改静态库交付"
  - "qt5-qtbase 5.15.2.2 包内 Qt5CoreConfigExtrasMkspecDir.cmake 引用构建期路径 p/../b//mkspecs/linux-clang（包内断链），官方 config 不可用——必须用 CMakeDeps 生成的 config"
  - "conan OHOS toolchain 的 CMAKE_PREFIX_PATH 注入对 find_dependency 链不稳——conan_cmakedeps_paths.cmake 手写 PREPEND generators 目录兜底"
