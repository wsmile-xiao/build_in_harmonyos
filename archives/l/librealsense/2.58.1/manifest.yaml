# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/realsenseai/librealsense/tarball/v2.58.1"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=HarmonyOS"
    - "-DFORCE_RSUSB_BACKEND=ON"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_GRAPHICAL_EXAMPLES=OFF"
    - "-DBUILD_TOOLS=OFF"
    - "-DBUILD_UNIT_TESTS=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-CMake-external_libusb.cmake.patch"
  - "0002-CMake-json-download.cmake.in.patch"
  - "0003-CMake-unix_config.cmake.patch"
  - "0004-CMakeLists.txt.patch"
  - "0005-third-party-rsutils-src-network-adapter-watcher.cpp.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "librealsense 在 HarmonyOS 上需要强制使用 RSUSB_BACKEND（绕过 libudev）"
  - "libusb-cmake 不识别 HarmonyOS，需要在 PATCH_COMMAND 中将 HarmonyOS 视为 Linux"
  - "HarmonyOS 缺少 netlink 定义（sockaddr_nl, NETLINK_ROUTE），需要禁用 network-adapter-watcher"
  - "添加 __OHOS__ 宏可禁用 HarmonyOS 不支持的 Linux 特有功能"

