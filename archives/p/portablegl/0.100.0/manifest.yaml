# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.100.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.100.0"

# 软件名
software: "portablegl"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: header-only

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag tarball，R39）
  url: "https://github.com/rswinkle/PortableGL/archive/refs/tags/0.100.0.tar.gz"

  # 源码校验和（实测）
  sha256: "ac47faa34435f856422f4ba8ce3ddbb8122d593abdee7cf854b72fae9648d39a"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: header-only 库（stb 风格单头文件，无上游构建系统产物要求）
  system: header-only

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（零第三方依赖，纯 C99）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无补丁，源码未修改）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PortableGL 为 stb 风格 header-only 库：单头 portablegl.h + PORTABLEGL_IMPLEMENTATION 宏模式，src/ 为头文件内联实现源"
  - "上游 testing/ 全部为离屏（内存帧缓冲）渲染测试，无需窗口系统即可全量运行"
  - "init-build F068 嵌套源码检测对无顶层构建文件的仓库（header-only）会误提升含 Makefile 的子目录（demos/），需手工干预"
