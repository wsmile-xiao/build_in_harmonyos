# test_package/MANIFEST.yml — portablegl 0.100.0
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
#
# 上游 testing/ 为离屏渲染单元测试套件（渲染到内存帧缓冲，输出 PNG 与
# expected_output/ 逐像素对比），在适配过程中已全量实测（见 notes.md）。
# 适配机实测：6 套件 625 项全部通过（clang 15.0.4, OHOS arm64 原生）。

package: portablegl/0.100.0
homepage: "https://github.com/rswinkle/PortableGL"

# 上游测试命令（上游 testing/ 使用 premake 生成的 makefile，无 autotools check 目标）
upstream_check_command: "cd testing && make -f run_tests.make config=release && ./run_tests"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 库无构建步骤；上游测试在适配阶段实测（见版本级 notes.md 验证结果）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（适配机已实测全过）
upstream_tests:
  - file: testing/run_tests.cpp
    source: portablegl-0.100.0/testing/run_tests.cpp
    description: "上游离屏渲染测试套件（105 项，PNG 像素对比）"
    command: "./run_tests"
  - file: testing/run_tests_d16.cpp
    source: portablegl-0.100.0/testing/run_tests_d16.cpp
    description: "D16 深度缓冲变体（105 项）"
    command: "./run_tests_d16"
  - file: testing/run_tests_d16_no_stencil.cpp
    source: portablegl-0.100.0/testing/run_tests_d16_no_stencil.cpp
    description: "D16 无模板缓冲变体（104 项）"
    command: "./run_tests_d16_no_stencil"
  - file: testing/run_tests_rgb565.cpp
    source: portablegl-0.100.0/testing/run_tests_rgb565.cpp
    description: "RGB565 16 位帧缓冲变体（105 项）"
    command: "./run_tests_rgb565"
  - file: testing/run_tests_clamp_border.cpp
    source: portablegl-0.100.0/testing/run_tests_clamp_border.cpp
    description: "clamp-to-border 纹理变体（107 项）"
    command: "./run_tests_clamp_border"
  - file: testing/run_tests_no_depth_no_stencil.cpp
    source: portablegl-0.100.0/testing/run_tests_no_depth_no_stencil.cpp
    description: "无深度无模板变体（99 项）"
    command: "./run_tests_no_depth_no_stencil"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "离屏渲染像素断言测试：init_glContext 内存帧缓冲 → glClear 蓝色断言 → glDrawElements 红色四边形断言 → free_glContext（5 项像素断言）"
    command: "./test_portablegl"

# 测试断言总数（上游 625 项像素对比 + test_package 5 项像素断言）
assertion_count: 630
