software: portablegl
display: "PortableGL"
description: "OpenGL 3.x core subset software rasterizer implemented in portable C99 as a single-header library (stb style)"
category: graphics
homepage: "https://github.com/rswinkle/PortableGL"
license: MIT
build_system: header-only

ohos_adaptation:
  key_points:
    - "Header-only 库（stb 风格）：单头 portablegl.h，PORTABLEGL_IMPLEMENTATION 宏内联实现，无构建产物"
    - "纯 CPU 软件光栅化，无 GPU/窗口系统依赖，离屏渲染到内存帧缓冲，OHOS PC 天然适配"
    - "上游 testing/ 为离屏单元测试（PNG 像素对比），适配机 6 套件 625 项全部通过"
    - "demos/examples 需 SDL2/GLFW 等窗口后端，OHOS PC 跳过（非库本体路径）"
  common_dependencies: []

versions:
  "0.100.0":
    status: built
    build_date: "2026-09-03"
    published_as: portablegl
