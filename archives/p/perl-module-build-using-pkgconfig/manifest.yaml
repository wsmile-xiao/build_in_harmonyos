software: perl-module-build-using-pkgconfig
display: "Module::Build::Using::PkgConfig"
description: "Extend Module::Build to use platform libraries via pkg-config"
category: build-tool
homepage: "https://metacpan.org/dist/Module-Build-Using-PkgConfig"
license: GPL-1.0-or-later OR Artistic-1.0
build_system: module-build

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无 XS/C 代码，无 SELinux 限制问题"
    - "依赖 ExtUtils::PkgConfig (1.16)，需手动安装"
    - "使用 Module::Build (Build.PL) 构建系统，非 autotools"
    - "依赖 pkg-config 命令运行时可用"
  common_dependencies:
    - perl
    - pkg-config
    - ExtUtils::PkgConfig

versions:
  "0.03":
    status: published
    build_date: "2026-06-18"
