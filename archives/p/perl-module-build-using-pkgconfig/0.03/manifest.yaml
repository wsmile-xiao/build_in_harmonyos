software: perl-module-build-using-pkgconfig
version: "0.03"
build_system: module-build
status: published
build_date: "2026-06-18"
compile_date: "2026-06-18"

source:
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Module-Build-Using-PkgConfig-0.03.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: module-build
  configure_options: []
  dependencies:
    - perl/5.42.0
    - ExtUtils-PkgConfig/1.16
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯 Perl 模块使用 Module::Build (Build.PL) 构建系统，非 autotools，无需 configure/make"
  - "Module::Build 构建流程：perl Build.PL → ./Build → ./Build test → ./Build install"
  - "依赖 ExtUtils::PkgConfig 模块需从 CPAN 手动安装（默认未预装）"
  - "纯 Perl 模块不受 SELinux HMDFS 限制影响，安装后立即可用（与 perl-dbd-pg XS 模块不同）"
  - "pkg-config 命令预装于 /data/service/hnp/bin/pkg-config (v0.29.2)，运行时正常工作"
