software: perl-module-runtime

# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.018/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.018"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# 构建系统类型（顶层字段）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/H/HA/HAARG/Module-Runtime-0.018.tar.gz"

  # 源码校验和
  sha256: "0bf77ef68e53721914ff554eada20973596310b4e2cf1401fc958601807de577"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无额外依赖，仅需 Perl 5.42.0 核心模块 ExtUtils::MakeMaker

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 Perl 模块，无需任何补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在 OpenHarmony 上无需任何平台适配修改，开箱即用"
  - "与 XS 模块（如 perl-dbd-pg）不同，纯 Perl 模块不受 SELinux HMDFS 限制"
  - "Module::Runtime 使用 ExtUtils::MakeMaker 构建系统，INSTALL_BASE 指定安装路径"
  - "taint 模式下需显式 -I 路径加载用户安装的模块（Perl 安全特性，非平台限制）"
  - "365 个核心测试全部通过，覆盖 use_module/require_module/is_module_name 等全部 API"
