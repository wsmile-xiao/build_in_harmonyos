# test_package/MANIFEST.yml
# picomemo 1.2.0 - upstream test declaration.

package: picomemo/1.2.0
homepage: "https://github.com/mierenhoop/picomemo"

upstream_tests_exist: true
upstream_test_audit: >-
  `test/omemo.c` is the upstream unit suite; it is compiled twice by the
  upstream Makefile (test/build.mk): `o/test-omemo` (OMEMO 0.3, 16 RunTest
  cases) and `o/test-omemo2` (-DOMEMO2, OMEMO 0.9, the same 16 cases), giving
  32 upstream cases. Count command:
  `grep -cE '^  RunTest\(' test/omemo.c` (=16). 15 of the 16 cases run for
  real in `build()`; `TestSessionIntegration` needs `o/msg.bin`, a message
  fixture produced by an external XMPP OMEMO bot (test/initsession.py +
  slixmpp-omemo in a prosody Docker container) and is skipped only when that
  fixture is absent (declared in conandata patches/0001). test-xmpp (TLS/XMPP
  networking) is likewise not runnable.
upstream_check_command: "make test-omemo test-omemo2"
upstream_test_in_build: true
upstream_test_command: "./o/test-omemo ; ./o/test-omemo2"
upstream_tests:
  - "test/omemo.c (OMEMO 0.3): 16 cases, 15 run, 1 skipped (external XMPP fixture)"
  - "test/omemo.c (OMEMO 0.9, -DOMEMO2): 16 cases, 15 run, 1 skipped"

test_package_tests:
  - file: test_picomemo.c
    description: "consumer linked against the installed libpicomemo.so + headers; store setup, serialization round-trip, signed-prekey rotation, message encrypt/decrypt round-trip"
    command: "<cc> -I <pkg>/include test_picomemo.c -L <pkg>/lib -lpicomemo"

test_files:
  - path: "test_package/test_picomemo.c"
    test_type: "R34"
    assertion_count: 10

test_package_test_count: 1
consumer_assertion_count: 10
upstream_test_cases: 32
upstream_executed: 30
upstream_passed: 30
upstream_skipped: 2
assertion_count: 10
