software: picomemo
display: "picomemo"
description: "XMPP OMEMO 端到端加密所需的紧凑可移植密码学实现（X3DH + Double Ratchet + OMEMO protobuf）"
category: library
homepage: "https://github.com/mierenhoop/picomemo"
license: ISC
build_system: makefile

ohos_adaptation:
  key_points:
    - "发布包已含拆分生成的 gen/omemo0.c（OMEMO 0.3）与 gen/omemo2.c（OMEMO 0.9），无需 Lua"
    - "曲线后端 hacl.c；AEAD 后端 openssl.c（制品仓 openssl 为静态 no-shared，故 .so 内嵌 crypto）"
    - "上游 test/omemo.c 编两次（OMEMO 0.3/0.9）共 32 用例；build() 内实跑 30，TestSessionIntegration 需外部 XMPP bot 的 o/msg.bin → 补丁仅对该用例做存在性守卫"
    - "产物为共享库 libpicomemo.so.1：同含 omemo0+omemo2 符号"
  common_dependencies:
    - openssl/3.5.8.1

versions:
  - version: "1.2.0"
    status: built
    build_date: "2026-09-29"
