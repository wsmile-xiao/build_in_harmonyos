# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS /proc 数据源选择性暴露：diskstats root-only、PSI cpu/io 缺失、cmdline 受限；PMDA 按维度优雅降级（草稿 E1005）"
  - "glibc/BSD 专属符号 musl 缺口：rindex→strrchr、re_comp/re_exec→regcomp/regexec、versionsort→NULL、HZ→fallback 100、qsort_r→sort_r_simple（注意 sort_r.h 双副本全改，草稿 E1006）"
  - "autotools install-sh 无条件调 id 判非 root；OHOS 无 id/chown 命令 → REAL_UID 空 → test 语法错 → chown 127 → make install Error 127；修复 [ -n $REAL_UID ] || REAL_UID=1（草稿 E1007）"
  - "install :: default_pcp 前置重查 build 目标——package() 的 make install 必须重传 CROSS_COMPILING 等 build 变量，conanfile 抽共享方法防漂移（草稿 E1008）"
  - "sysroot libc ≠ 设备 libc：pthread_cancel/setcancelstate 设备有、sysroot 无 → 构建与消费都需 -Wl,--allow-shlib-undefined（package_info exelinkflags 传播）"

