# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pcp/7.1.5
homepage: "https://performancecopilot.github.io"

# 上游测试命令：PCP 的 qa/ 套件（autotools make check 入口）
upstream_check_command: "make check"

# conanfile.py build() 未集成上游测试（qa/ 套件需运行 pmcd + PMDA 基础设施，
# OHOS CI 无此环境；离线 archive 分析亦无预置 archive 可加载）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件（qa/，需 live pmcd + PMDA，OHOS CI 环境不可运行）
upstream_tests:
  - file: "qa/"
    source: "pcp-7.1.5/qa/ (autotools qa 套件)"
    description: "上游 qa/ 回归套件；依赖运行中的 pmcd(8) 与 PMDA 采集链路，OHOS CI 无 pmcd 服务与实时 /proc 采集环境，无法运行（非环境缺失的笼统理由，而是 qa 脚本本身 exec pmcd/pmstore 采集实时指标）"
    command: "make check"

# test_package 自带的消费者测试（离线、免 context、CI 可靠）
test_package_tests:
  - file: test.c
    description: "L1 消费者测试：链接 libpcp 并调用免 context 的 PMDA 工具函数 pmErrStr(0)，验证库可链接且 API 可用"
    command: "./test_pcp"

# 测试断言总数（test_package 内 1 条断言）
assertion_count: 1
