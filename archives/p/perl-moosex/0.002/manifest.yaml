software: perl-moosex
version: "0.002"
status: published
build_date: "2026-06-24"
compile_date: "2026-06-24"
build_system: perl

source:
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/MooseX-0.002.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: perl
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"
  dependencies:
    - "perl/5.42.0"
    - "Carp-Clan/6.08"
    - "Sub-Exporter-ForMethods/0.100052"
    - "Context-Preserve/0.01"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "MooseX 0.002是纯Perl命名空间占位模块，无C/XS代码，无源码修改"
  - "MooseX::Types 0.51依赖Carp::Clan>=6.00和Sub::Exporter::ForMethods>=0.100052，需额外安装"
  - "纯Perl模块在HMDFS上无SELinux限制，与perl-dbd-pg的XS模块不同"
  - "xt/author和xt/release测试失败属于预期行为，缺少可选测试依赖(Pod::Coverage等)"
