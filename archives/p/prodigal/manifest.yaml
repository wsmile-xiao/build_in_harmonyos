software: prodigal
display: "Prodigal"
description: "Microbial gene prediction algorithm (PROkaryotic DynamIc Programming Genefinding ALgorithm)"
category: bioinformatics
homepage: "https://github.com/hyattpd/Prodigal"
license: GPL-3.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯Makefile项目，无configure脚本，需通过make变量传递编译参数"
    - "必须使用GNU ld替代lld（-fuse-ld=/data/service/hnp/bin/ld.bfd）"
    - "Makefile不支持DESTDIR，需修改INSTALLDIR实现staging安装"
    - "版本信息使用-v而非--version"

versions:
  "2.6.3":
    status: published
    build_date: "2026-06-09"