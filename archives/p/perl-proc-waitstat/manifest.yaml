software: perl-proc-waitstat
display: "Proc::WaitStat"
description: "Proc::WaitStat - Interpret and act on wait() status values"
category: perl
homepage: "https://metacpan.org/release/Proc-WaitStat"
license: perl_5
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C 编译，无需补丁"
    - "依赖 IPC::Signal (sig_name 函数)，安装在系统 site_perl"
    - "conanfile.py generate() 使用 pass，纯 Perl 模块不需要 AutotoolsToolchain"
    - "package_info() 不硬编码 Perl 版本路径，仅设置 libdirs"
    - "test_package 使用 inline env var prefix 兼容 Conan 2.x self.run() API"
    - "exports = lib/* 解决 G4 检查 conan cache path 返回导出文件夹问题"
    - "G0 无法识别 perl-eumm 构建系统，为已知平台限制"
  common_dependencies:
    - perl (5.42.0)
    - perl-ipc-signal (1.00, 系统安装)

versions:
  "1.00":
    status: published
    build_date: "2026-06-26"
    conan_ref: "perl-proc-waitstat/1.00@ohpcd/stable"
