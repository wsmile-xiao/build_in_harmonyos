software: perl-proc-waitstat
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.00/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.00"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"
compile_date: "2026-06-26"
build_system: perl-eumm

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RO/ROSCH/Proc-WaitStat-1.00.tar.gz"

  # 源码校验和
  sha256: "d07563f5e787909d16e7390241e877f49ab739b1de9d0e2ea1a41bd0bf4474bc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl-eumm
  system: perl-eumm

  # 配置选项列表
  configure_options:
    - "INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-ipc-signal/1.00"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块 conanfile.py 的 generate() 应使用 pass，不需要 AutotoolsToolchain"
  - "Conan 2.x self.run() 的 env 参数需要 list 而非 dict，使用 inline env var prefix 更兼容"
  - "纯 Perl 模块 G4 检查失败：conan cache path <recipe_ref> 返回导出文件夹而非二进制包文件夹，通过 exports 属性解决"
  - "package_info() 不应硬编码 Perl 版本路径，仅设置 libdirs"
