software: pmailq
display: "pmailq"
description: "Postfix mail queue manager (list/parse/delete queued messages in batches)"
category: system
homepage: "https://github.com/k0lter/pmailq"
license: WTFPL
build_system: custom

ohos_adaptation:
  key_points:
    - "单文件 Python 3 脚本，无编译，py_compile 即构建校验"
    - "运行时调用 postqueue/postsuper，OHOS 上为可选运行时依赖"
    - "上游无测试套件，test_package 用垫片做 fixture 全链路验证"
  common_dependencies: []

versions:
  "0.7":
    status: built
    build_date: "2026-10-12"
    conan_ref: "pmailq/0.7"
