# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-sort-key/1.33
homepage: https://metacpan.org/dist/Sort-Key

# 上游测试命令 (Perl 标准 make test)
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游源码自带的测试 (t/ 目录)
upstream_tests:
  - file: t/strings.t
    description: "字符串排序测试 (4 项断言: keysort, nkeysort)"
    command: "perl -Iblib/lib -Iblib/arch t/strings.t"
  - file: t/ints.t
    description: "整数/无符号排序测试 (9 项断言: nkeysort, ikeysort, ukeysort 等)"
    command: "perl -Iblib/lib -Iblib/arch t/ints.t"
  - file: t/floats.t
    description: "浮点数排序测试 (6 项断言: nkeysort, rnkeysort, nsort, rnsort)"
    command: "perl -Iblib/lib -Iblib/arch t/floats.t"
  - file: t/multi.t
    description: "多键排序测试 (8 项断言: Sort::Key::Maker, Sort::Key::Register, Sort::Key::Multi)"
    command: "perl -Iblib/lib -Iblib/arch t/multi.t"
  - file: t/natural.t
    description: "自然排序测试 (9 项断言: natkeysort, natsort, rnatsort 等)"
    command: "perl -Iblib/lib -Iblib/arch t/natural.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sortkey.pl
    description: "Sort::Key 模块加载 + 版本验证 + keysort/nkeysort/ikeysort/ukeysort/natural/multi 功能测试 (11 项)"
    command: "perl test_sortkey.pl"

# 测试断言总数 (上游 36 + test_package 11)
assertion_count: 47
