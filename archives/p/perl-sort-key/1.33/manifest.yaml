software: perl-sort-key
# 版本级 manifest
# 文件位置: archives/p/perl-sort-key/1.33/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.33"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SA/SALVA/Sort-Key-1.33.tar.gz"

  # 源码校验和
  sha256: "ed6a4ccfab094c9cd164f564024e98bd21d94f4312ccac4d6246d22b34081acf"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"

  # 特殊链接参数（绕过 CRT 文件缺失）
  link_options:
    - "-nostartfiles -nodefaultlibs -lc"

  # 编译依赖列表
  dependencies:
    - perl (提供 perl 解释器和 ExtUtils::MakeMaker)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "Makefile.PL: 添加 dynamic_lib => { OTHERLDFLAGS => '-nostartfiles -nodefaultlibs -lc' } 绕过鸿蒙 CRT 文件缺失"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块编译在鸿蒙系统需要 -nostartfiles -nodefaultlibs -lc 链接参数（与 perl-dbd-pg 相同）"
  - "鸿蒙系统缺少 CRT 文件（crti.o, crtn.o, crtbeginS.o, crtendS.o）"
  - "Sort::Key 是 XS 模块，编译 Key.xs 生成 Key.so 共享库"
  - "Makefile.PL 中可通过 dynamic_lib => { OTHERLDFLAGS => ... } 添加链接参数"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/perl-sort-key-1.33.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/perl-sort-key-1.33.work
  generated_at: '2026-07-02'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.PL.patch
    type: auto
    platform_only: True
    guard: 'pending'
