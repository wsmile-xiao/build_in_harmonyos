software: poselib
display: "PoseLib"
description: "Minimal solvers for camera pose estimation (P3P, GP3P, relative pose, homography) plus robust RANSAC/bundle estimators"
category: vision-library
homepage: "https://github.com/PoseLib/PoseLib"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "根 CMakeLists.txt 非分支强加 -Werror，clang 15 + Eigen 3.4 头文件告警变致命错误（portability 补丁移除 -Werror，保留 -Wall）"
    - "上游 tag v2.0.5 但 project(VERSION 2.0.4)，version.h/poselib_info() 报 2.0.4 属上游疏漏，未修改（R37 conan 版本用 tag 2.0.5）"
    - "header-only 依赖 eigen/3.4.0（PUBLIC：公共头直接 #include <Eigen/...>，CMakeDeps + visible requires 传播）"
    - "上游默认静态库（BUILD_SHARED_LIBS=OFF）；MARCH_NATIVE/WITH_BENCHMARK/PYTHON_PACKAGE 全保持默认 OFF（R1）"
    - "观测向量必须是 unit-length bearing（README 约定，x.homogeneous().normalized()），z=1 形式会使 P3P 解错"

versions:
  "2.0.5":
    status: built
    build_date: "2026-09-03"
