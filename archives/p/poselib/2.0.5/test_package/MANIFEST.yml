# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: poselib/2.0.5
homepage: "https://github.com/PoseLib/PoseLib"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游仓库 tests/ 仅含 Python 绑端测试 (pytest test_poselib.py)，CMake 构建
# 不产生任何测试目标 (ctest -N 为空)，无 C++ 测试套件可集成
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 C++ 层无测试目标；Python 套件依赖 PYTHON_PACKAGE=ON（pybind11 +
# python-dev，超 R1 最少化范围，且 CI 无 Python 环境），不集成
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (无 C++ 测试；Python 套件说明如下)
upstream_tests:
  - file: tests/test_poselib.py
    source: PoseLib-2.0.5/tests/test_poselib.py
    description: "上游 Python pytest 套件（随机场景下 p3p/relpose/homography 等 14 项求解器一致性 + RANSAC 精度测试）；依赖 pybind11 绑定构建（PYTHON_PACKAGE=ON），本适配不构建"
    command: "python -m pytest tests/test_poselib.py"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "C++ 消费者测试：链接 libPoseLib.a，1) poselib_info() 版本串断言（PoseLib/2.0.4/RELEASE，上游 project VERSION 疏漏如实断言）；2) P3P 合成数据位姿还原——已知旋转+平移、3 个正深度相机系点反投影到世界系，p3p() 返回解中存在与真值平移误差<1e-6、旋转角误差<1e-6 度的解；3) homography_4pt 合成数据还原——已知 H 生成 4 点平面对应，求解 H 归一化误差<1e-9"
    command: "./test_package"
  - file: conanfile.py (test)
    description: "ctest 执行 C++ 消费者测试 + 直接运行 test_package 二进制断言 HMBS_TEST_PACKAGE_RESULT: PASS、三个 [PASS] 断言行齐全"
    command: "self.run(test_package > out && assert HMBS_TEST_PACKAGE_RESULT: PASS)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
