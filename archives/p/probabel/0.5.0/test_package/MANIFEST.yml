package: probabel/0.5.0
homepage: "https://github.com/GenABEL-Project/ProbABEL"

upstream_check_command: "make check（checks/Makefile.am TESTS：11 项 shell 测试；R-tests 3 项仅 HAVE_R 注册，本环境无 R 注册 0）"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - name: checks TESTS (make check)
    command: "make -j1 check"
    expected: "11 项 shell 测试全部通过（check_probabel_chunk.sh/check_dose_input.sh/test_qt.sh/test_mms.sh/test_flipmaf_palinear.sh/test_bt.sh/test_flipmaf_palogist.sh/test_cox.sh/test_cox_nocovar.sh/test_cox_interactions.sh/test_flipmaf_pacoxph.sh）；Testsuite summary SKIP/XFAIL/FAIL/ERROR 均 0；R 参照测试仅在 HAVE_R 时接线，本环境无 R 注册 0 项（静态声明 3 项，原因=环境无 R 解释器，非本次适配造成）"

test_package_tests:
  - file: test.sh
    description: "消费者测试：以使用者身份运行已安装交付物，9 组断言——1) probabel 包装器可执行并输出用法；2) palinear 真实输入跑通并产出结果；3) 结构断言（表头关键列、SNP 数/名称/顺序与 map 一致）；4) dose 与 dose.fvi 输入结果逐字节一致（上游 test_qt.sh 契约）；5) 与上游 verified_results 按列名对齐的数值锚点（容差 1e-9，跳过 -c 的 chrom 列）；6) -c 19 去列语义与不带 -c 输出逐字节一致；7) 缺 -d 必须非零退出；8) palogist/pacoxph 已装且响应；9) probabel.pl 相对别名可解析可执行"
  - file: input/height.txt
  - file: input/test.mldose
  - file: input/test.mlinfo
  - file: input/test.map
  - file: input/test.dose.fvi
  - file: input/test.dose.fvd
  - file: expected/height_add.out.txt
