patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: "Rewrite four non-POSIX CPPFLAGS/CXXFLAGS += appendices in configure.ac as POSIX assignments, removing the dependency on shell dialect. On this device /bin/sh and /system/bin/sh are both MirBSD KSH R59, which accepts += fine (verified: VAR+=' x', empty and unset cases), so this patch is not a prerequisite for the local build to pass; it is kept to eliminate dialect dependence (CI worker /bin/sh untested)."
    patch_type: "portability"
    sha256: "1e2f49a1938cf7a3f3fb6ea9288431c9c6897a820cee410b8032a104ac66fee7"
  - patch_file: "patches/0002-static-constexpr.patch"
    patch_description: "In-class static const double initializers require constexpr under clang C++14 (EPS/CHOLTOL in coxph_data.h, reg1.h)"
    patch_type: "portability"
    sha256: "d035c2e6408143a8a8983c0a6c1f29dc1878e3cd8a6be49ba58d623d6174e067"
