# manifest.yaml - probabel 0.5.0 版本级元数据
software: probabel
version: "0.5.0"
status: built
build_date: "2026-09-22"
task_id: 9728
build_system: autotools (autoreconf -fi)

# 软件描述
description: "ProbABEL：GWAS 全基因组关联分析命令行工具集（palinear/palogist/pacoxph + probabel perl 包装器），支持线性/逻辑/Cox 回归与剂量文件的分块并行分析"
category: bioinformatics
license: GPL-2.0-or-later

# 编译信息
compiler: clang (OHOS NDK)
target_arch: aarch64
target_os: ohos

# 配置选项
configure_options:
  - "--prefix=$DEFAULT_PREFIX"
  - "CXXFLAGS=-std=gnu++14（bundled Eigen 3.2.1 使用 C++17 已删除的 std::binder1st/std::bind2nd）"

# 构建命令序列（配方 build() 内真实执行）
build_commands:
  - "autoreconf -fi（tarball 未带生成版 configure）"
  - "env -u CONFIG_SHELL SHELL=/bin/sh ./configure（E386 路由）"
  - "make -j2"
  - "env SHELL=/data/service/hnp/bin/bash make -j1 check（上游套件真实执行）"

# 测试信息（五维账本，口径与 notes.md/pr_body 一致）
test_result: PASS
test_summary: "upstream_static: 14（checks 11 + R-tests 3）；upstream_executed: 11（全 PASS，SKIP/XFAIL/FAIL/ERROR 均 0）；upstream_not_executed: 3（环境无 R 解释器，其中 2 项上游自标 XFAIL）；consumer: 1 程序 / 9 组断言 PASS"
test_commands:
  - "make -j1 check"
  - "test_package/test.sh（9 组消费者断言）"

# 安装产物（工具型包，无头文件/库）
artifacts:
  - bin/palinear
  - bin/palogist
  - bin/pacoxph
  - bin/probabel（perl 包装器）
  - bin/probabel.pl（相对符号链接别名，package() 内改写为相对目标，见知识草稿）

# 补丁信息
patches_applied:
  - "0001-configure.ac.patch（VAR+= 非 POSIX 追加改写为 POSIX 等价，消除对 shell 方言的依赖）"
  - "0002-static-constexpr.patch（类内 static const double 初值化在 clang C++14 下需 constexpr）"

# 知识沉淀
knowledge_gained:
  - "DRAFT-probabel-0.5.0-destdir-baked-symlink-alias-non-relocatable：上游 install 钩子 ln -s $(DESTDIR)$(bindir)/x 造别名，conan package() 无 DESTDIR 安装会把构建期绝对路径烙进链接目标 ⇒ 交付包不可重定位；修法=package() 内改写相对链接，HMDFS 拒绝软链时退化为复制；ref: knowledge/drafts/DRAFT-probabel-0.5.0-destdir-baked-symlink-alias-non-relocatable.kv"

# 质量门禁（conan-verify + 干净重建 conan create，2026-09-22）
quality_gates:
  G1_binary_integrity: PASS
  G2_functionality: PASS
  G3_portability: PASS
  G4_archive_integrity: PASS

# 源码信息
source_url: https://github.com/GenABEL-Project/ProbABEL/archive/refs/tags/v0.5.0.tar.gz
source_sha256: "883f618cce4e08f25bc90faa68d47c3e548d56c177760288fbd8368df0636917"


knowledge_ref: [DRAFT-probabel-0.5.0-destdir-baked-symlink-alias-non-relocatable]
