# manifest.yaml - probabel 软件级元数据
software: probabel
display: "ProbABEL"
description: "GWAS 全基因组关联分析命令行工具集：palinear（线性回归）、palogist（逻辑回归）、pacoxph（Cox 比例风险），经 probabel perl 包装器统一调用，支持剂量文件分块并行"
category: bioinformatics
homepage: "https://github.com/GenABEL-Project/ProbABEL"
license: GPL-2.0-or-later
build_system: autotools (autoreconf -fi)

ohos_adaptation:
  key_points:
    - "tarball 未带生成版 configure，构建期先 autoreconf -fi"
    - "configure umask 077 在 HMDFS 上需移除（E011/E114）"
    - "configure/make/install 以 env -u CONFIG_SHELL SHELL=/bin/sh 路由（E386）；上游套件按上游写法以 hnp bash 驱动 make check"
    - "checks/*.sh 的 fd-3 惯用法（exec 3>/dev/null、>& 3）在 hnp bash 下 Bad file descriptor，需改写为等价重定向"
    - "src/probabel 包装器 shebang 指向 /usr/bin/perl，需改 hnp perl"
    - "install 钩子以 ln -s $(DESTDIR)$(bindir)/probabel 造 probabel.pl 别名，conan package() 下不可重定位，package() 内改写为相对链接（知识草稿 DRAFT-probabel-0.5.0-destdir-baked-symlink-alias-non-relocatable）"
    - "bundled Eigen 3.2.1 需要 -std=gnu++14（std::binder1st 在 C++17 已删除）"
  common_dependencies: []

versions:
  "0.5.0":
    status: built
    build_date: "2026-09-22"
    source_url: "https://github.com/GenABEL-Project/ProbABEL/archive/refs/tags/v0.5.0.tar.gz"
    source_sha256: "883f618cce4e08f25bc90faa68d47c3e548d56c177760288fbd8368df0636917"
