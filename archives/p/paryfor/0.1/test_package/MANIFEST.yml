package: paryfor/0.1
homepage: "https://github.com/ekg/paryfor"

upstream_tests_exist: true
upstream_check_command: "cmake -S . -B build && cmake --build build && ./build/bin/paryfor-test 1024 4 16"
upstream_test_in_build: true
upstream_test_command: "./paryfor-upstream-test 1024 4 16"
upstream_test_count: 1

upstream_tests:
  - file: test.cpp
    source: paryfor-0.1/test.cpp
    description: "官方唯一测试程序：执行分块 parallel_for，汇总工作线程处理数并校验总数等于请求的 1024 次迭代。"
    command: "./paryfor-upstream-test 1024 4 16"
    tests: 1

consumer_test_count: 2
test_package_tests:
  - file: test_paryfor.cpp
    description: "通用消费者测试：三种 parallel_for 重载的精确一次执行、求和与线程编号，以及公开 AtomicQueue2 push/pop API（8 个检查）。"
    command: "./test_paryfor"
    tests: 8
  - file: test_paryfor_ohos.cpp
    description: "鸿蒙专有测试：强制 __OHOS__ 与 AArch64 编译路径，验证 yield 自旋路径上的原子队列突发/FIFO及并行压力（6 个检查）。"
    command: "./test_paryfor_ohos"
    tests: 6

assertion_count: 15
