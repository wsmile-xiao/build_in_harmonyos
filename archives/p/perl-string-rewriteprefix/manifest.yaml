# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-string-rewriteprefix

# 软件描述
description: "Rewrite strings based on a set of known prefixes"

# 分类
category: perl

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "0.009-r1"
    status: built
    build_date: "2026-07-06"
    path: archives/p/perl-string-rewriteprefix/0.009-r1

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/dist/String-RewritePrefix

# 源码仓库
repository: https://github.com/rjbs/String-RewritePrefix

# 许可证
license: Perl_5

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl
  - perl-sub-exporter (>= 0.972)
  - perl-params-util (需 PERL_PARAMS_UTIL_PP=1 on OHOS)

# 编译依赖
build_dependencies:
  - perl (ExtUtils::MakeMaker)
