software: perl-string-rewriteprefix
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.009-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.009-r1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RJ/RJBS/String-RewritePrefix-0.009.tar.gz"

  # 源码校验和
  sha256: "44918bec96a54af8ca37ca897e436709ec284a07b28516ef3cce4666869646d5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 环境变量（OHOS 平台必需）
  env:
    PERL_PARAMS_UTIL_PP: "1"
    PERL5LIB: "/storage/Users/currentUser/usr/local/perl5/lib/perl5:/storage/Users/currentUser/usr/local/lib/site_perl/5.42.0/aarch64-linux:/storage/Users/currentUser/usr/local/lib/site_perl/5.42.0"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - perl-sub-exporter/0.972 (通过系统 Perl 本地库提供)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块无需处理 CRT 文件缺失问题（与 XS 模块 perl-dbd-pg 不同）"
  - "Params::Util XS .so 在鸿蒙 HMDFS 上加载受限（SELinux），需设置 PERL_PARAMS_UTIL_PP=1 启用纯 Perl 模式"
  - "Sub::Exporter 依赖链需要通过 PERL5LIB 指定路径，系统 Perl @INC 不包含用户本地库"
  - "纯 Perl 模块的 test_package 应使用 Perl 测试脚本，不能使用 C/CMake 模板"
  - "系统 Perl 路径 /data/service/hnp/ 为只读，需使用 DESTDIR 或复制到用户本地库"
