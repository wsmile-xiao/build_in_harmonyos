software: pcb2gcode
display: "pcb2gcode"
description: "Isolation routing and drilling G-code generator for PCBs (Gerber/Excellon -> G-code)"
category: cad
homepage: "https://github.com/pcb2gcode/pcb2gcode"
license: GPL-3.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "pcb2gcode 本体是纯命令行工具（CAD Gerber/Excellon -> G-code），自身无 GUI；GTK 依赖来自依赖库 gerbv（pkg-config 模块 libgerbv>=2.1.0）"
    - "ohpcd 制品仓既无 gerbv 也无 GTK-2.0（只有 gtk/3.24.38 = GTK3，gerbv 需要 gtk+-2.0）-> vendor gerbv v2.13.0 源码并去 GUI 裁剪（GERBV_WITH_GUI=OFF），只保留 Gerber/Excellon 解析库，静态链入 pcb2gcode 可执行文件"
    - "gerbv v2.13.0 顶层 CMake 用 pkg_check_modules(GTK REQUIRED gtk+-2.0) 硬依赖且无 GUI 开关；GDK 调用仅集中在 gerbv.c 的 GDK 渲染函数一处；裁剪后需补 <stdio.h>、显式 cairo 依赖、用 -std=gnu2x 恢复 fileno 等 POSIX 声明"
    - "ohpcd 的 boost 单包无法同时提供 program_options 与 unit_test_framework -> 用 boost/1.84.0 并将上游测试改为 header-only Boost.Test"
    - "zlib 三方冲突（boost 1.3.1 / cairo 1.3.1.1 / glib 1.3.2）-> glib 选 2.84.0.2 + self.requires('zlib/1.3.1.1', override=True)"
    - "pcb2gcode 用 geos-config 探 GEOS，而 conan 包内 geos-config 硬编码 prefix=/usr/local -> 配方生成 wrapper geos-config"
    - "OHOS 可执行文件需代码签名（否则 Operation not permitted 126）-> package() 用 binary-sign-tool 重签 bin/"
    - "上游测试实测：ctest 执行 32/32 通过（16 个 Boost.Test 单元套件共 126 用例 + 16 个集成预期失败用例）；90 项集成用例被上游自身按 Boost 版本门闸禁用（要求 1.83，仓内 1.84）"

versions:
  "3.0.4":
    status: built
    build_date: "2026-09-24"
    packaging: conan
    notes: "conan recipe (os=OHOS arch=armv8)，vendor gerbv v2.13.0 去 GTK 裁剪并静态链接；deps boost/1.84.0 + geos/3.14.1 + glib/2.84.0.2 + cairo/1.18.4 + zlib/1.3.1.1"
    dependencies:
      - boost/1.84.0
      - geos/3.14.1
      - glib/2.84.0.2
      - cairo/1.18.4
      - zlib/1.3.1.1
