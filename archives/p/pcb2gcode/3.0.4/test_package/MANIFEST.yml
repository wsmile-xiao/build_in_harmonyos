# test_package/MANIFEST.yml
# Upstream official test declaration file

package: pcb2gcode/3.0.4
homepage: "https://github.com/pcb2gcode/pcb2gcode"

# 上游测试入口（CTest；tests/ 目录的 Boost.Test 单元套件 + integration 脚本测试）
upstream_check_command: "ctest"

# conanfile.py 的 build() 中已集成并执行上游测试（cmake.test -> ctest）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游单元测试（tests/*.cpp，Boost.Test；header-only 模式，见 patches/pcb2gcode-0002）
# 统计口径 = test_package 构建期实测 ctest 注册/执行数（见 notes.md）
upstream_tests:
  - name: "unit_tests"
    source: "tests/*.cpp"
    count: 16
    description: "Boost.Test 单元套件（每个 *_tests.cpp 一个可执行文件）：voronoi / eulerian_paths / segmentize / path_finding / tsp_solver / units / available_drills / options / autoleveller / common / backtrack / trim_paths / outline_bridges / geos_helpers / disjoint_set / segment_tree。覆盖几何（Boost.Geometry/GEOS）、路径规划、单位换算、钻孔、选项解析等核心逻辑"
    command: "ctest --output-on-failure -L unit_test"
  - name: "gerberimporter_tests"
    source: "tests/gerberimporter_tests.cpp"
    count: 1
    description: "GerberImporter 栅格化对比 golden 图的成像测试；需 GTK/GNOME 成像栈（glibmm-2.4/gdkmm-2.4/librsvg-2.0）。HarmonyOS PC 制品仓无 gdkmm-2.4，故本测试在裁剪后不注册（patch pcb2gcode-0001），不计入执行数"
    skipped: true
    skip_reason: "requires glibmm-2.4/gdkmm-2.4/librsvg-2.0 (GTK/GNOME imaging stack), unavailable on HarmonyOS PC"
  - name: "integration_script_tests"
    source: "tests/data/"
    count: 0
    description: "Python 集成脚本测试（tools/run_gerbv_example_test.py 跑 pcb2gcode 并与期望输出比对）；上游自身门闸要求 Boost==1.83 且 GEOS 与 ci.yml 钉版本一致才启用，用其它 boost 版本时上游自行 DISABLED"
    skipped: true
    skip_reason: "upstream gates these on Boost 1.83 exactly (ohpcd provides 1.84+)"

# test_package 测试（消费者视角）
test_package_tests:
  - file: test_package/test_pcb2gcode.sh
    description: "消费者端到端：对样例 KiCad Gerber（tests/data/gerbv_example/backtrack 的 outline + F.Cu + millproject）真实执行 pcb2gcode --config=millproject 的 Gerber->G-code 转换，校验产出的 .nc 文件非空且含 G-code 运动指令（--version 横幅同时验证打包件可执行并打印 gerbv/Boost/GEOS 链接版本）"
    command: "pcb2gcode --config=millproject"
  - file: test_package/conanfile.py
    description: "鸿蒙特有：校验交付二进制为 AArch64/LP64 小端 ELF64（EI_CLASS=2 / EI_DATA=1 / e_machine=0xB7）；随后驱动 test_pcb2gcode.sh 完成端到端转换"
    command: "conan test_package"

# Approximate assertion count
assertion_count: 4
