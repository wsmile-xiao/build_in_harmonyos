# conandata.yml — pcb2gcode 3.0.4 (HarmonyOS PC)
#
# pcb2gcode 本体是纯命令行工具（CAD Gerber/Excellon -> G-code），自身无 GUI。
# 其唯一图形依赖来自 libgerbv（Gerber 解析库，pkg-config 模块 libgerbv>=2.1.0），
# 而 gerbv 是 GTK 应用。ohpcd 制品仓既无 gerbv 也无 GTK-2.0（仅 GTK3，且无
# gdkmm-2.4），故在此 vendor gerbv 源码并做“去 GUI”裁剪（见 patches/gerbv-*）。
#
# sha256 均为本地对官方 GitHub archive 计算（上游未旁挂 checksum）：
#   pcb2gcode v3.0.4 (2026-04-05, commit a5604c4)
#   gerbv v2.13.0    (上游 pcb2gcode CI 固定版本，见 release note "Pin gerbv to v2.13.0")

sources:
  pcb2gcode:
    url: "https://github.com/pcb2gcode/pcb2gcode/archive/refs/tags/v3.0.4.tar.gz"
    sha256: "46351d4b7479059becae064cc68f2d1d68d42ae314ff7a1d9a240c71a3c0c98c"
  gerbv:
    url: "https://github.com/gerbv/gerbv/archive/refs/tags/v2.13.0.tar.gz"
    sha256: "0479b333efffadc118b7e3080be5621d8890fdcd2376edbe40a686d5c3642784"

patches:
  - patch_file: "patches/pcb2gcode-0001-tests-make-gtk-imaging-and-boost-test-optional.patch"
    patch_description: "tests/CMakeLists.txt：① GTK/GNOME 成像栈（glibmm-2.4 / gdkmm-2.4 / librsvg-2.0）由 REQUIRED 改为可选，仅在全部存在时才注册 gerberimporter_tests（该测试把导入结果栅格化后与 golden 图对比）——HarmonyOS PC 制品仓无 gdkmm-2.4；② Boost.Test 改成 header-only 形态后不再需要已编译的 boost_test 组件"
    patch_type: "portability"
  - patch_file: "patches/pcb2gcode-0002-tests-boost-test-header-only.patch"
    patch_description: "tests/*.cpp（17 个）：<boost/test/unit_test.hpp> 改为 <boost/test/included/unit_test.hpp>，改用 Boost.Test 的 header-only 模式。ohpcd 的 boost/1.84.0 提供 program_options 但不含已编译的 boost_unit_test_framework，header-only 模式无需该库即可运行全部上游单元测试"
    patch_type: "portability"
  - patch_file: "patches/gerbv-0001-cmake-library-only.patch"
    patch_description: "gerbv 顶层 CMake：GTK 改为 GERBV_WITH_GUI 可选（默认 OFF）、共享库改 GERBV_BUILD_SHARED 可选（默认 ON）；GUI 关闭时不进入 locale/man/desktop/test 子目录；语言标准由 C23/C++23 降为 C17/C++17（OHOS clang 15 不接受 -std=c23/-std=c++23）"
    patch_type: "portability"
  - patch_file: "patches/gerbv-0002-thirdparty-library-only.patch"
    patch_description: "gerbv thirdparty：dxflib/tinyscheme 仅供 GUI 使用，GUI 关闭时不再构建"
    patch_type: "portability"
  - patch_file: "patches/gerbv-0003-src-cmake-library-only.patch"
    patch_description: "gerbv src CMake：GUI 关闭时剔除 GTK/GDK 源（draw-gdk.c、export-image.c、export-dxf.cpp）与 GUI 可执行文件 gerbv-app，只保留 Gerber/Excellon 解析库；静态库同时安装 gerbv.h"
    patch_type: "portability"
  - patch_file: "patches/gerbv-0004-gerbv-h-drop-gtk.patch"
    patch_description: "gerbv.h：去掉 <gtk/gtk.h>/<gdk/gdk.h>/<gdk/gdkkeysyms.h>，公共结构仍用到的 GdkColor/GdkPixmap 以最小本地类型代替；GDK 渲染声明加 GERBV_WITH_GDK_RENDER 门控"
    patch_type: "portability"
  - patch_file: "patches/gerbv-0005-draw-h-drop-gdk.patch"
    patch_description: "draw.h：去掉 <gdk/gdk.h>，改用 <glib.h>"
    patch_type: "portability"
  - patch_file: "patches/gerbv-0006-drill-stats-h-drop-gdk.patch"
    patch_description: "drill_stats.h：仅需 gboolean 类型，<gdk/gdk.h> 换成 <glib.h>"
    patch_type: "portability"
  - patch_file: "patches/gerbv-0007-gerbv-c-drop-gdk-render.patch"
    patch_description: "gerbv.c：去掉无用的 <pango/pango.h> 与 draw-gdk.h include；GDK 渲染后端 gerbv_render_to_pixmap_using_gdk()（唯一使用 gdk_* 的地方）加 GERBV_WITH_GDK_RENDER 门控，裁剪后不编译"
    patch_type: "portability"
  - patch_file: "patches/gerbv-0008-libgerbv-pc-requires.patch"
    patch_description: "libgerbv.pc.in：Requires 由 glib-2.0 + gtk+-2.0 改为 glib-2.0 + cairo（去 GUI 后公共头只暴露 glib/cairo 类型）"
    patch_type: "portability"
