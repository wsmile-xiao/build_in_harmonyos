# 版本级 manifest
# 文件位置: archives/p/pcb2gcode/3.0.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "3.0.4"
software: "pcb2gcode"
status: built
build_date: "2026-09-24"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/pcb2gcode/pcb2gcode/archive/refs/tags/v3.0.4.tar.gz"
  sha256: "46351d4b7479059becae064cc68f2d1d68d42ae314ff7a1d9a240c71a3c0c98c"
  tar_format: tar.gz
  upstream_release: "v3.0.4 (2026-04-05, commit a5604c4)"

# 随配方 vendor 的依赖源码（ohpcd 无 gerbv 制品，GTK-2.0 不可得）
vendored:
  gerbv:
    url: "https://github.com/gerbv/gerbv/archive/refs/tags/v2.13.0.tar.gz"
    sha256: "0479b333efffadc118b7e3080be5621d8890fdcd2376edbe40a686d5c3642784"
    upstream_pin: "pcb2gcode CI 固定 gerbv v2.13.0（release note: Pin gerbv to v2.13.0）"
    usage: "只取 Gerber/Excellon 解析库，静态链接进 pcb2gcode 可执行文件"

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DPCB2GCODE_WITH_GEOS=ON"
    - "-DPCB2GCODE_COMPILE_WARNING_AS_ERROR=OFF"
    - "-DPCB2GCODE_USE_CCACHE=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DGERBV_WITH_GUI=OFF"
    - "-DGERBV_BUILD_SHARED=OFF"
    - "-DGERBV_WITH_GUI=OFF (gerbv 子构建，去 GTK)"
  dependencies:
    - boost/1.84.0
    - geos/3.14.1
    - glib/2.84.0.2
    - cairo/1.18.4
    - zlib/1.3.1.1 (override)
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/pcb2gcode-0001-tests-make-gtk-imaging-and-boost-test-optional.patch"
  - "patches/pcb2gcode-0002-tests-boost-test-header-only.patch"
  - "patches/gerbv-0001-cmake-library-only.patch"
  - "patches/gerbv-0002-thirdparty-library-only.patch"
  - "patches/gerbv-0003-src-cmake-library-only.patch"
  - "patches/gerbv-0004-gerbv-h-drop-gtk.patch"
  - "patches/gerbv-0005-draw-h-drop-gdk.patch"
  - "patches/gerbv-0006-drill-stats-h-drop-gdk.patch"
  - "patches/gerbv-0007-gerbv-c-drop-gdk-render.patch"
  - "patches/gerbv-0008-libgerbv-pc-requires.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "pcb2gcode 本体是纯命令行工具（CAD Gerber/Excellon -> G-code），自身无 GUI；GTK 依赖唯一来源是依赖库 gerbv（pkg-config 模块 libgerbv>=2.1.0），gerbv 是 GTK-2.0 应用"
  - "ohpcd 制品仓既无 gerbv 也无 GTK-2.0（只有 gtk/3.24.38 = GTK3；gerbv 需要 gtk+-2.0）；gerbv 源码 vendor 后按 GERBV_WITH_GUI=OFF 裁剪，只编译 Gerber/Excellon 解析库并静态链入可执行文件"
  - "gerbv v2.13.0 顶层 CMake 用 pkg_check_modules(GTK REQUIRED gtk+-2.0) 硬依赖，无任何关闭 GUI 的开关（任务提示词预期与上游实际不符，以 tarball 为准）；GDK 调用仅集中在 gerbv.c 的 gerbv_render_to_pixmap_using_gdk() 一处"
  - "裁剪 GTK 后 gerbv 的三个连带坑：公共头不再传递 <stdio.h>（gerbv.h 显式 include）；-std=c2x 严格 ISO 隐藏 fileno（改 CMAKE_C_EXTENSIONS ON 用 -std=gnu2x）；cairo 原本由 GTK 传递带入，需显式 pkg_check_modules(CAIRO)"
  - "clang 15 不接受 -std=c23/-std=c++23，但 CMake 4.1.2 会把 C_STANDARD 23 正确映射为 -std=gnu2x（C++23 -> -std=gnu++2b），因此保留上游 23 即可；降标到 C17 反而会让 [[fallthrough]] 语法报错"
  - "ohpcd 的 boost 单包无法同时提供 program_options 与 unit_test_framework（1.84.0 有前者无后者，1.90.0 反之）-> 用 boost/1.84.0 并把上游 17 个测试改为 header-only Boost.Test（<boost/test/included/unit_test.hpp>）"
  - "zlib 三方冲突（boost 1.3.1 / cairo 1.3.1.1 / glib 1.3.2）：glib 选 2.84.0.2 并用 self.requires('zlib/1.3.1.1', override=True) 强制；Conan 2 直接 require 不覆盖传递精确版本，必须 override=True"
  - "conan_toolchain.cmake 会以普通 set() 把 CMAKE_INSTALL_PREFIX 强制为 package_folder（-D 无效）-> 子构建（gerbv）直接装进 package 目录，打包时再清理 lib/ include/"
  - "pcb2gcode 通过 find_program(geos-config) + --cflags/--ldflags 探 GEOS，而 conan geos 包里的 geos-config 硬编码 prefix=/usr/local 不可重定位 -> 配方生成 wrapper geos-config 指向包路径"
  - "OHOS 可执行文件必须代码签名，否则运行报 Operation not permitted(126)；package() 里用 llvm-objcopy --remove-section .codesign + binary-sign-tool sign -selfSign 1 重签"
  - "上游测试：ctest 注册 122 项，执行 32 项（16 个 Boost.Test 单元套件 + 16 个集成预期失败用例）全部通过；90 项集成用例被上游自身按 boost 版本门闸禁用（要求 Boost==1.83，仓内为 1.84）；gerberimporter_tests 因需 gdkmm-2.4/librsvg 而成像测试未注册"
