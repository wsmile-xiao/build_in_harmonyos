software: patchutils
version: "0.4.5"
status: published
build_date: "2026-05-27"

source:
  url: "https://github.com/twaugh/patchutils/releases/download/0.4.5/patchutils-0.4.5.tar.xz"
  sha256: "8386a35a4d2d3cbc28fdcc93c5be007c382c78e3ee079070139f0d822e013325"
  tar_format: tar.xz

build:
  system: autotools
  build_system: autotools
  configure_options:
    - "HELP2MAN=/bin/true"
    - "ac_cv_sizeof_long=8"
    - "ac_cv_sizeof_long_long=8"
    - "ac_cv_sizeof_off_t=8"
    - "ac_cv_sizeof_int=4"
    - "ac_cv_sizeof_void_p=8"
  make_options:
    - "AUTOCONF=true"
    - "AUTOMAKE=true"
    - "ACLOCAL=true"
    - "AUTOHEADER=true"
  dependencies: []
  cc: clang
  cxx: clang++
  platform_issues:
    - "E007: config.guess 无法识别 HarmonyOS (__OHOS__ libc)"
    - "E072: config.sub 需添加 ohos-linux 三元组"
    - "E073: config.status umask 077 导致 HMDFS 权限问题"

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"

knowledge_gained:
  - "E007: config.guess 无法识别 HarmonyOS，需用 patch-autotools-ohos.pl 补丁"
  - "E072: config.sub 需添加 ohos-linux 三元组支持"
  - "E073: config.status umask 077 在 HMDFS 上导致 Permission denied，需改为 umask 000"
  - "toybox patch 与 interdiff 不兼容，导致部分测试失败（135/199 PASS）"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/patchutils-0.4.5.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/patchutils-0.4.5.work
  source_orig_hash: f34e8bd2e38b0283
  source_work_hash: 08b325cb37dadada
  generated_at: '2026-05-27T19:48:22'
  patches_count: 3

patch_classification:
  - file: 0001-config.guess.patch
    type: platform_adaptation
    platform_only: true
    guard: "defined(__OHOS__)"
    error_id: E007
    description: "添加 __OHOS__ libc 检测分支和 HarmonyOS 系统标识分支"
  - file: 0002-config.sub.patch
    type: platform_adaptation
    platform_only: true
    guard: "defined(__OHOS__)"
    error_id: E072
    description: "添加 ohos-linux 三元组支持"
  - file: 0003-configure.patch
    type: platform_fix
    platform_only: true
    guard: "defined(__OHOS__)"
    error_id: E073
    description: "修复 config.status umask 077 → 000 解决 HMDFS 临时目录权限问题"

test_results:
  total: 199
  pass: 135
  fail: 58
  xfail: 6
  skip: 0
  fail_reason: "toybox patch (v0.8.12) 与 GNU patch 不兼容"
  pass_categories: "filterdiff, lsdiff, grepdiff, rediff, recountdiff, git-related"

installed_binaries:
  elf:
    - interdiff
    - filterdiff
    - rediff
  script:
    - fixcvsdiff
    - splitdiff
    - editdiff
    - recountdiff
    - unwrapdiff
    - dehtmldiff
    - move-to-front
    - espdiff
    - patchview-wrapper
  symlink:
    - combinediff → interdiff
    - flipdiff → interdiff
    - lsdiff → filterdiff
    - grepdiff → filterdiff
    - patchview → filterdiff
    - gitdiff → patchview-wrapper
    - svndiff → patchview-wrapper
