# test_package/MANIFEST.yml — perl-test-simple 1.302224
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-test-simple/1.302224
homepage: "https://metacpan.org/pod/Test::Simple"

# 上游测试套件：t/ 目录 374 个 .t 测试文件（prove -lr t/ 递归运行）
# 注：prove -l t/ 的 -l 只加 lib 路径、不递归子目录——必须 -lr 才能跑
# 全量（t/Test2/、t/Legacy/ 等子目录），评审实测 N=3554 即全量递归口径。
upstream_check_command: "prove -lr t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Test-Simple-1.302224/t/*.t
    description: "374 个 .t 测试文件（含 t/Test2/、t/Legacy/ 子目录）：本地实测 **3554 个断言 3554/3554（100%）**（prove -lr t/ 递归全量，零失败）"
    command: "prove -lr t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Test::Simple + ok 断言）
test_package_tests:
  - file: test_test_simple.py
    description: "Loads packaged Test::Simple via perl -I<lib> and runs a real ok() assertion"
    command: "python3 test_test_simple.py"

# 断言总数：1（ok 断言校验）
assertion_count: 1
