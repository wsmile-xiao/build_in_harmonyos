software: perl-io-socket-inet6
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.73-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.73-r2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SH/SHLOMIF/IO-Socket-INET6-2.73.tar.gz"

  # 源码校验和（待补充）
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  system: perl

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 注意：Socket6 依赖通过内置兼容模块解决，无需安装外部模块

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "Socket6-compat-layer"
# 通过新增 lib/Socket6.pm 和修改 lib/IO/Socket/INET6.pm 实现

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl 5.42+ 内置 Socket 模块已提供完整 IPv6 支持"
  - "Socket6 模块 API 与 Perl 5.42+ Socket API 存在差异"
  - "getaddrinfo 旧 API（列表参数）需要转换为新 API（hash 参数）"
  - "NI_NUMERICSERVER 常量在 Socket 中称为 NI_NUMERICSERV"
  - "in6addr_any 在 Socket6 是函数，在 Socket 中是常量 IN6ADDR_ANY"