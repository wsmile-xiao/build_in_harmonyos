software: perl-namespace-clean
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.27-r4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.27-r4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# 构建系统类型（顶层字段，G4 门禁检查）
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RI/RIBASUSHI/namespace-clean-0.27.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-package-stash/0.40"
    - "perl-b-hooks-endofscope/0.28"
    - "perl-extutils-makemaker"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 ExtUtils::MakeMaker 构建，命令为 perl Makefile.PL PREFIX=$DEFAULT_PREFIX"
  - "Perl 模块安装使用 DESTDIR 模式：make install DESTDIR=$TEST_PREFIX"
  - "G0 干净构建验证脚本不支持 Perl 构建系统（尝试运行 ./configure），对纯 Perl 模块属平台限制"
  - "Sub::Identify 是可选依赖，缺失不影响 namespace::clean 核心功能（Package::Stash PP 实现可用）"
  - "namespace::clean 的 -except 功能支持数组引用和单值字符串两种形式，不支持正则表达式"
  - "Perl 5.42.0 内置 Sub::Util 1.6801，提供子程序信息查询功能"
