software: perl-net-jabber
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.0-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.0-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
compile_date: "2026-06-26"
build_date: "2026-06-26"

# 构建系统类型 (submit 自检必填)
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RE/REATMON/Net-Jabber-2.0.tar.gz"

  # 源码校验和
  sha256: "dfba394a6166a5a5e35ce763f408f97788047cc39ce5acad802e281432c88011"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # Perl-level dependencies (not Conan-managed):
  # - Net::XMPP >= 1.0 (installed via CPAN)
  # - XML::Stream >= 1.0 (installed via CPAN)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块打包: 使用临时 DESTDIR + glob 查找 .pm + 复制到 lib/perl5/ (参考 perl-net-ip/perl-net-domain-tld)"
  - "conanfile.py package() 方法: 使用 glob.glob(recursive=True) 替代 os.walk() 更可靠地查找 .pm 文件"
  - "package_info() 必须设置 runenv_info.append_path('PERL5LIB', lib/perl5) 以便消费者正确加载模块"
  - "conan-verify G4 已知限制: conan cache path 返回 export 目录而非包二进制目录，需手动验证产物完整性"
  - "纯 Perl 模块不受 SELinux/HMDFS 限制，可直接通过 PERL5LIB 使用 (与 perl-dbd-pg 的 XS 模块不同)"
  - "Net::Jabber 依赖 Net::XMPP 和 XML::Stream，需预先安装到用户可写路径 /storage/Users/currentUser/usr/local/lib/site_perl/"
  - "test_package 应使用独立 test.pl 脚本而非内联 perl -e 命令，便于验证模块 API 功能"
