software: pulsemixer
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型
build_system: python

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/GeorgeFilipkin/pulsemixer/archive/refs/tags/1.5.1.tar.gz"

  # 源码校验和
  sha256: "2ccc850d2e414300f7513ac36334c0be16ef300fef6f45a3e3f05f83c50fd19d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: python

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--root=$TEST_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E999-draft: Python-only 包无 configure/make — 使用 setup.py install --prefix --root (knowledge_ref: E999)"
  - "E999-draft: 纯 Python 脚本工具无 ELF 二进制 — 不需要签名 (knowledge_ref: E999)"
  - "E999-draft: G0 干净构建验证不适用于 Python-only 包 (knowledge_ref: E999)"
  - "E999-draft: pulsemixer 运行时依赖 libpulse.so.0 — OpenHarmony 不提供 (knowledge_ref: E999)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
