software: perl-regexp-tr
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.05/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.05"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/C/CH/CHIA/Regexp-Tr-0.05.tar.gz"

  # 源码校验和
  sha256: "d3e1563cb2eb04419715407766c402e702b351648edf2630fe7b6ee4ecfd81cd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl
  build_system: perl

  # CPAN 模块名
  cpan_module: "Regexp::Tr"

  # 配置选项列表
  configure_options:
    - "INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块，使用 EUMM (ExtUtils::MakeMaker) 构建系统，无需 C/XS 编译"
  - "package() 从 blib/lib 复制 .pm 文件即可，适合纯 Perl 模块打包"
  - "模块使用 eval 动态编译 tr///，运行时创建匿名子例程作为对象"
  - "SYNOPSIS 中 'z-a' 范围无效（Perl tr/// 要求升序），使用完整反向字母表替代"
  - "CPAN 作者: CHIA (Robert Fischer)，许可证: Perl (同 Perl 本身)"
