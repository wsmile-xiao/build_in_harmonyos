software: postgresql-temporal_tables
# 版本级 manifest 模板
# 文件位置: archives/p/postgresql-temporal_tables/1.2.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.2.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mlt/temporal_tables/archive/refs/tags/v1.2.2.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: pgxs

  # 配置选项列表
  configure_options:
    - "PG_CONFIG=/storage/Users/currentUser/usr/local/bin/pg_config"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - postgresql/17.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: skipped
  total: 0
  passed: 0
  failed: 0
  note: "PGXS扩展无标准测试套件"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PGXS构建系统无需configure步骤"
  - "时态表扩展支持SQL:2011标准"