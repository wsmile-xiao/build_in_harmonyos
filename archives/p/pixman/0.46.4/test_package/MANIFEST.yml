# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
package: pixman/0.46.4
homepage: https://www.pixman.org/

# 上游测试情况：官方 tarball test/ 目录递归统计为 48 个文件，其中 42 个 .c 源文件。
# 为最小化鸿蒙 PC 构建，conanfile.py 当前 meson -Dtests=disabled，不在 build() 内运行上游测试。
upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: "meson test"
upstream_test_file_count: 48
upstream_c_test_source_count: 42
upstream_tests:
  - file: "test/region-contains-test.c"
    source: "pixman-0.46.4/test/region-contains-test.c"
    description: "Official upstream region containment test; deterministic portable subset is adapted into 3 OHOS test_package cases"
    command: "./test_probe"
    executed_in_test_package: true
  - file: "test/**/*.c"
    source: "pixman-0.46.4/test/"
    description: "Remaining official upstream test C sources and helpers: 42 .c files under test/ and test/utils/ in total"
    command: "meson test"
    executed_in_test_package: false

# test_package 自带测试（消费者视角：公开头/API 类型编译 + dlopen/dlsym 运行期可加载）
test_package_tests:
  - file: test.c
    description: "执行上游 region-contains 可移植适配用例：3 组确定性场景覆盖单矩形、双矩形、空区域，并在运行期 dlopen/dlsym 包内 pixman 共享库验证 version/region API"
    command: "./test_probe"

assertion_count: 25
