software: perl-moo
# 版本级 manifest
# 文件位置: archives/p/perl-moo/2.005005/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.005005"

# 编译状态
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-23"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/H/HA/HAARG/Moo-2.005005.tar.gz"

  # 源码校验和
  sha256: "fb5a2952649faed07373f220b78004a9c6aba387739133740c1770e9b1f4b108"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  build_system: perl
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - "Class::Method::Modifiers"
    - "Role::Tiny/2.002004"
    - "Sub::Defer/2.006006"
    - "Sub::Quote/2.006006"
    - "ExtUtils::MakeMaker"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Moo 是纯 Perl 模块，无需 C/XS 编译，使用 perl Makefile.PL 构建"
  - "纯 Perl 模块在鸿蒙平台上可直接安装使用，无 SELinux/ELF 签名限制"
  - "perl Makefile.PL PREFIX=路径 可指定安装前缀，与 DESTDIR 模式兼容"
  - "Moo 依赖链: Class::Method::Modifiers → Role::Tiny → Sub::Defer → Sub::Quote 均为纯 Perl"
