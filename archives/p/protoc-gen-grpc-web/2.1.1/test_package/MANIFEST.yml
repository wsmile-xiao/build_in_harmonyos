package: protoc-gen-grpc-web/2.1.1
homepage: "https://github.com/grpc/grpc-web"

upstream_check_command: "protoc-gen-grpc-web --version"
upstream_test_in_build: false
upstream_test_command: "protoc --plugin=protoc-gen-grpc-web=<bin> --grpc-web_out=import_style=commonjs,mode=grpcweb:<dir> sample.proto"
upstream_test_reason: "Upstream grpc-web has no test harness for the plugin binary itself (Bazel-driven JavaScript tests are not runnable here); the plugin is validated by end-to-end code generation through protoc, which is its sole production use case."
upstream_tests: []

test_package_tests:
  - file: conanfile.py
    description: "Test driver: resolves plugin/protoc paths from Conan deps and invokes the assertion suite (test_type=explicit, direct protobuf require for protoc access)"
    command: "conan test . protoc-gen-grpc-web/2.1.1@ohpcd/stable"
  - file: test_grpc_web.py
    description: "R34 end-to-end assertions (T1-T9): --version smoke, protoc --plugin code generation, generated JS content asserts (service stubs, method descriptor, import directives, version banner), negative test for missing mode option"
    command: "python3 test_grpc_web.py --plugin-bin <bin> --protoc <protoc> --workdir <dir>"
  - file: sample.proto
    description: "Input schema defining service EchoService with rpc Echo(EchoRequest) returns (EchoResponse)"
    command: "protoc --plugin=protoc-gen-grpc-web=<bin> --grpc-web_out=import_style=commonjs,mode=grpcweb:<dir> sample.proto"

assertion_count: 9
