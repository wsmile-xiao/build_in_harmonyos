software: protoc-gen-grpc-web
version: "2.1.1"
status: published
build_date: "2026-09-07"
build_system: cmake
source:
  url: "https://github.com/grpc/grpc-web/archive/refs/tags/2.1.1.tar.gz"
  sha256: "7766763275c6bf99115c9b535aaa3c507566847d47ea72a1f70da7fe427a98d3"
  tar_format: tar.gz
build:
  system: cmake
  configure_options: []
  dependencies:
    - protobuf/33.6.1
  cc: clang
  cxx: clang++
patches_applied:
  - "patches/0001-grpc-generator-protobuf-33-absl-string_view-compat.patch"
knowledge_gained:
  - "grpc-web 2.1.1 pins protobuf 29.1 upstream; building against protobuf 33 needs a string_view compatibility patch for grpc_generator.cc (51 errors otherwise) — ref: knowledge/drafts/E543-draft-A2AC"
  - "protobuf 30+ descriptor accessors return absl::string_view; fix by switching read-only helper signatures to absl::string_view and wrapping accessor results in std::string() at map keys/concatenation sites — ref: knowledge/drafts/E543-draft-A2AC"
  - "protobuf 33 splits utf8 validation into libutf8_range.a/libutf8_validity.a; link via the protobuf::libprotoc CMake imported target so the dependency graph resolves utf8_range/validity/absl automatically — ref: knowledge/drafts/E544-draft-5EC1"
  - "Upstream builds the plugin with Bazel; since the plugin is a single translation unit, a minimal CMakeLists.txt compiling grpc_generator.cc against protobuf::libprotoc avoids the Bazel toolchain entirely — ref: notes.md"
test:
  type: e2e-codegen
  coverage:
    - "--version smoke"
    - "protoc --plugin=protoc-gen-grpc-web end-to-end code generation"
    - "generated JS content asserts (service stubs, method descriptor, imports, version banner)"
    - "negative test: missing mode option rejected"
