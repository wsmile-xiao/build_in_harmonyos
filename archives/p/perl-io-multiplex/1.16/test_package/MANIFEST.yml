# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-io-multiplex/1.16
homepage: "https://metacpan.org/pod/IO::Multiplex"

# 上游测试命令 — IO::Multiplex 上游 t/ 测试套件（make test）
upstream_check_command: "perl Makefile.PL && make && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test"

# 上游实际运行的测试程序（2026-09-08 实测记录）：
# - t/ 目录：4 个 .t 测试文件（100_load.t / 110_ntest.t / 110_test.t / 200_udp.t）
# - 实测结果：**Files=4, Tests=32, All tests successful（100%）**——
#   全部测试真实运行通过，无受阻无失败
upstream_tests:
  - file: t/
    source: IO-Multiplex-1.16/t/
    description: "上游 perl 测试套件（4 文件 32 用例；实测 32/32 100% 通过，无受阻无失败）"
    command: "perl Makefile.PL && make && make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_io_multiplex.py
    description: "消费者测试：真实 API（R34）——IO::Multiplex->new + add(IO::Socket::INET) + handles() + remove"
    command: "python3 test_io_multiplex.py <site-perl-dir>"

# 测试断言总数（test_package 消费者测试断言数；上游 32 用例已在
# upstream_tests 独立申报，口径分离避免歧义）
assertion_count: 4
