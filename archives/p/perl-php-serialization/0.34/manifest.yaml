software: perl-php-serialization
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.34/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.34"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"
compile_date: "2026-06-24"

# 构建系统（verify-build G4 检查字段）
build_system: perl-extutils

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/B/BO/BOBTFISH/PHP-Serialization-0.34.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl-extutils | custom
  system: perl-extutils

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 纯 Perl 模块，无外部依赖

  # 编译器（纯 Perl 模块，无 C 编译）
  cc: n/a
  cxx: n/a

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块，构建系统为 ExtUtils::MakeMaker (Makefile.PL)，无需 C 编译器 (ref: L3-software-specific)"
  - "安装路径取决于 Perl 自身 prefix，而非 --prefix 参数 (ref: L3-software-specific)"
  - "Perl 模块安装到 /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0/ (ref: L3-software-specific)"
  - "package --prefix 需指定 Perl 库路径而非 $DEFAULT_PREFIX (ref: L3-software-specific)"
