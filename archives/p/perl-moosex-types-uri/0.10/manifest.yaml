software: perl-moosex-types-uri
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10"

# 编译状态
# published | built | failed | archived
status: published
build_system: perl

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/MooseX-Types-URI-0.10.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "perl Build.PL --install_base=$DEFAULT_PREFIX"
    - "./Build"
    - "./Build install --destdir=$TEST_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - moose/2.4000
    - moosex-types/0.51
    - uri/5.21
    - uri-fromhash/0.05
    - params-validate/1.31
    - namespace-autoclean/0.31

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl 模块使用 Module::Build::Tiny (Build.PL) 时，ohc-run.py 模式A 会尝试 Makefile.PL 失败，需切换模式B手动运行 perl Build.PL"
  - "纯 Perl 模块的测试可能因运行时依赖缺失而失败，需逐个排查并安装缺失的 Perl 模块"
  - "Params::Validate 可通过 --pp 选项以纯 Perl 模式安装，避免 XS 编译依赖"
  - "perl-dbd-pg 编译经验中 musl 1.2.5 提供的 C 库头文件解决了 Moose XS 组件的编译问题"
  - "Moose 2.4000 已在系统中可用，后续 Perl 模块编译无需额外处理 Moose 依赖"
