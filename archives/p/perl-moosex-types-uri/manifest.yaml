software: perl-moosex-types-uri
display: "MooseX::Types::URI"
description: "为 Moose 提供 URI 类型约束，支持 URI、URI::file、URI::data 类型和字符串/HashRef 自动强制转换"
category: perl
homepage: "https://github.com/moose/MooseX-Types-URI"
license: GPL-1.0-or-later OR Artistic-1.0
build_system: perl

ohos_adaptation:
  key_points:
    - "使用 Module::Build::Tiny (Build.PL) 构建，ohc-run.py 模式A 不兼容，需模式B手动运行 perl Build.PL"
    - "纯 Perl 模块无 XS 组件，不涉及 SELinux HMDFS 限制"
    - "运行时依赖 Moose 含 XS 组件，需系统 C 头文件支持（musl 1.2.5 提供）"
    - "Params::Validate 可用 --pp 选项纯 Perl 安装，避免 XS 编译依赖"
  common_dependencies:
    - perl/5.42.0
    - moose/2.4000
    - moosex-types/0.51
    - uri/5.21

versions:
  "0.10":
    status: published
    build_date: "2026-06-24"
    published_as: perl-moosex-types-uri
    source_url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/MooseX-Types-URI-0.10.tar.gz"
