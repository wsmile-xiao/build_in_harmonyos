# test_package/MANIFEST.yml — plotutils 2.6
package: plotutils/2.6
homepage: "https://www.gnu.org/software/plotutils/"

upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - file: test/ctest.c
    source: plotutils-2.6/test/ctest.c
    description: "C binding smoke test: creates PNG Plotter, draws primitives, verifies PNG signature"
    command: "./ctest"
  - file: test/ekma.c
    source: plotutils-2.6/test/ekma.c
    description: "Ellipse/kite/merge/arctest — vector primitive regression test"
    command: "./ekma"
  - file: test/test_norm.c
    source: plotutils-2.6/test/test_norm.c
    description: "Path normalization test"
    command: "./test_norm"

test_package_tests:
  - file: test_plot.c
    description: "Consumer test: link libplot, create PNG Plotter, draw primitives, verify 8-byte PNG signature (R40)"
    command: "./test_probe"

assertion_count: 9
