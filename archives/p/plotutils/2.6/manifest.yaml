version: "2.6"
status: adapting

source:
  url: "https://ftp.gnu.org/gnu/plotutils/plotutils-2.6.tar.gz"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--without-x"
    - "--enable-libplotter=no"
    - "--enable-libxmi"
  dependencies:
    - "libpng/1.6.58.2"
  cc: clang

patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
  - "0003-configure-umask.patch"
  - "0004-z_write-libpng16.patch"

knowledge_gained:
  - "plotutils 2.6 使用极老 libtool 1.5.22，需补丁修复 config.guess/config.sub (E007)"
  - "--without-x 模式跳过 X11 依赖（libXaw/libXmu 缺失），PNG/PS/SVG 等非 X11 输出仍可用"
  - "libxmi 源码内嵌编译进 libplot，--enable-libxmi 额外产出独立 libxmi.a"
  - "产物含 libplot + 7 个 CLI 工具，需 commands.json (R38)"
  - "z_write.c 直接访问 png_ptr->jmpbuf，libpng 1.6 起不透明需用 png_jmpbuf() 宏"
  - "pic2plot/gram.cc 含上古 bison register 关键字，C++17/20 下需降级为 -std=gnu++14"
  - "OHOS /tmp 只读文件系统，tmpfile() 失败，需用 cwd 具名文件替代"

package_contract:
  libraries: ["plot", "xmi"]
  pkg_config: ["libplot.pc"]
  tools: ["graph", "plot", "spline", "ode", "tek2plot", "plotfont", "pic2plot"]
