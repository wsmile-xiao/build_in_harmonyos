# test_package/MANIFEST.yml — perl-text-diff 1.45
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-text-diff/1.45
homepage: "https://metacpan.org/pod/Text::Diff"

# 上游测试套件：t/ 目录 9 个 .t 测试文件（prove -l t/ 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Text-Diff-1.45/t/*.t
    description: "9 个 .t 测试文件：本地实测 33/33（100%），6 个运行 + 3 个 author 测试跳过（97_meta/98_pod/99_pmv），零失败"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Text::Diff + diff 计算）
test_package_tests:
  - file: test_text_diff.py
    description: "Loads packaged Text::Diff via perl -I<lib> and computes a real diff between two text strings"
    command: "python3 test_text_diff.py"

# 断言总数：1（diff 计算校验）
assertion_count: 1
