sources:
  url: "https://github.com/stack-of-tasks/pinocchio/archive/refs/tags/v4.1.0.tar.gz"
  sha256: "6088e6954883af233489cbabc391bc70b884f9a7a57cd79f11dd28bcad62e08d"
# pinocchio 的 cmake/ 是 git submodule（jrl-cmakemodules），
# **GitHub 的 archive tarball 从不包含 submodule 内容**——解出来只有 2 个空壳文件，
# 直接 configure 会因找不到 jrl-cmakemodules 的宏而失败。
# 故按 v4.1.0 指向的确切 commit 单独拉一份，解进 cmake/。（coal 当初踩过同一个坑。）
# 注：URL 为官方源（R39），CI 会自动追加镜像 fallback，不手动加镜像前缀。
cmake_submodule:
  url: "https://github.com/jrl-umi3218/jrl-cmakemodules/archive/648efca10ffc9081c633e5d23d8b069e89eee341.tar.gz"
  sha256: "4a0a7948a7daa64d614ada0a3c5334c939975312adafb8e23b316dfd1c187820"
# models/example-robot-data 在上游也是 git submodule（Gepetto/example-robot-data），
# archive tarball 里是空壳；BUILD_TESTING=ON 时顶层 CMakeLists 会检测
# models/example-robot-data/CMakeLists.txt 是否存在（存在则用本地模型，
# 否则 find_package(example-robot-data REQUIRED CONFIG) 会失败——该包未发布 ohpcd）。
# 故按 v4.0.0 官方 release 单独拉一份，解进 models/example-robot-data/。
example_robot_data:
  url: "https://github.com/Gepetto/example-robot-data/releases/download/v4.0.0/example-robot-data-4.0.0.tar.gz"
  sha256: "11147de937c8b00c590264ad03a41befdae2b9c24959e19972cba1be839f86f6"
patches: {}
