version: "4.1.0.2"
status: built
build_date: "2026-08-11"
conan_ref: "pinocchio/4.1.0.2"

source:
  url: "https://github.com/stack-of-tasks/pinocchio/archive/refs/tags/v4.1.0.tar.gz"
  sha256: "6088e6954883af233489cbabc391bc70b884f9a7a57cd79f11dd28bcad62e08d"
  tar_format: tar.gz
# cmake/ 为 git submodule（jrl-cmakemodules），archive tarball 不含，须单独拉取：
cmake_submodule:
  url: "https://github.com/jrl-umi3218/jrl-cmakemodules/archive/648efca10ffc9081c633e5d23d8b069e89eee341.tar.gz"
  sha256: "4a0a7948a7daa64d614ada0a3c5334c939975312adafb8e23b316dfd1c187820"

build:
  system: cmake
  configure_options:
    - "-DCMAKE_TOOLCHAIN_FILE=ohos.toolchain.cmake (SDK 自发现)"
    - "-DOHOS_ARCH=arm64-v8a"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_PYTHON_INTERFACE=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_EXAMPLES=OFF"
    - "-DBUILD_BENCHMARK=OFF"
    - "-DBUILD_WITH_COLLISION_SUPPORT=ON"
    - "-DBUILD_WITH_URDF_SUPPORT=ON"
    - "-DEXAMPLE_ROBOT_DATA_MODEL_DIR=<src>/models/example-robot-data/robots"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
  dependencies:
    - eigen/3.4.0
    - boost/1.90.0.4.1
    - urdfdom/6.0.0
    - coal/3.0.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "GitHub archive tarball 不含 git submodule（jrl-cmakemodules），须按钉的 commit 单独拉取解进 cmake/"
  - "ohos.toolchain 默认 64 位装 lib64/，须 -DCMAKE_INSTALL_LIBDIR=lib 改回 lib"
  - "OHOS SDK llvm/bin 无 llvm-ranlib，造静态库报 'Error running link command'，须补 CMAKE_RANLIB"
  - "ohos.toolchain FIND_ROOT_PATH_MODE_*=ONLY，依赖 find_package 须用 CMAKE_PROJECT_TOP_LEVEL_INCLUDES 放开成 BOTH"
  - "SDK toolchain 自签对 dlopen 无效，须 llvm-objcopy --remove-section .codesign + binary-sign-tool 重签"
  - "package_info 必须导出 BOOST_MPL_LIMIT_*/PINOCCHIO_ENABLE_TEMPLATE_INSTANTIATION 等 defines，否则消费方编不过"
  - "已发布 coal/3.0.3 钉 boost/1.90.0.1，须 boost/1.90.0.4.1 force=True 压过传递冲突"
  - "BUILD_TESTING=ON 跑上游 ctest：models/example-robot-data 是 submodule 空壳，须单独拉官方 release 解进该目录 + 显式 -DEXAMPLE_ROBOT_DATA_MODEL_DIR，否则 find_package(example-robot-data REQUIRED) 失败"
  - "上游 unittest 需要 Boost unit_test_framework 组件（BOOST_TEST_DYN_LINK），已发布 boost 均无，须发布含 test 组件的 boost/1.90.0.4.1"
  - "鸿蒙 exec/dlopen 需 .codesign：build 树里的测试可执行文件/动态库也要先签名再跑 ctest，签名后补 chmod +x"
