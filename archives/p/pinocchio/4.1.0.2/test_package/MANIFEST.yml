# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pinocchio/4.1.0.2
homepage: "https://stack-of-tasks.github.io/pinocchio/"

# 上游测试命令（build() 中 BUILD_TESTING=ON，构建全部 unittest 目标后由 ctest 实际运行）
upstream_check_command: "ctest --test-dir build-ohos --output-on-failure -j4"
upstream_test_in_build: true
upstream_test_command: "ctest"

# 上游实际运行的测试程序（BUILD_TESTING=ON，ctest 实跑 128 个）
# 统计：128 个实跑，122 通过（95%），6 失败（5 SEGFAULT 平台相关 + 1 数值断言）
# 失败明细：
#   sample-models / urdf / geometry-algorithms / model / serialization-multibody → SEGFAULT
#   （已排除：LD_LIBRARY_PATH 缺失、栈溢出 ulimit -s 131072、内存不足 17GB free；疑似平台相关崩溃）
#   liegroups → Failed: liegroups.cpp(92) "Error when integrating JointModelPrismaticUnaligned"（数值/精度断言）
upstream_tests:
  total: 128
  passed: 122
  failed: 6
  skipped: 0
  pass_rate: "95%"
  failures:
    - test: pinocchio-test-cpp-sample-models
      result: SEGFAULT
      note: 平台相关崩溃（非栈/内存/依赖缺失，根因待知识沉淀）
    - test: pinocchio-test-cpp-urdf
      result: SEGFAULT
      note: 平台相关崩溃
    - test: pinocchio-test-cpp-geometry-algorithms
      result: SEGFAULT
      note: 平台相关崩溃
    - test: pinocchio-test-cpp-model
      result: SEGFAULT
      note: 平台相关崩溃
    - test: pinocchio-test-cpp-serialization-multibody
      result: SEGFAULT
      note: 平台相关崩溃（13.57s 后崩溃，疑似序列化 IO 边界）
    - test: pinocchio-test-cpp-liegroups
      result: Failed
      note: liegroups.cpp(92) Error when integrating JointModelPrismaticUnaligned（数值断言）

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.cpp
    description: >
      Real rigid-body dynamics verification (not a link-only stub): builds a
      3-revolute-joint serial chain model (Model/Data, forwardKinematics),
      asserts model dimension invariants (njoints/nq/nv) and forward
      kinematics numerics — zero pose tip at X==3L, and with joint 2 rotated
      90 degrees the tip folds to X==L / Y==2L (proves q actually participates).
    command: "./test_probe"

# 测试断言总数（test.cpp 中 CHECK 断言数）
assertion_count: 7
