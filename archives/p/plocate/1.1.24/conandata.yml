sources:
  url: "https://plocate.sesse.net/download/plocate-1.1.24.tar.gz"
  sha256: "e55a757af1d7efb15ea674993224da4f0258479f8f720bd3dae0925d27dc04a2"

patches:
  - patch_file: "patches/0001-conf-program-invocation-name.patch"
    patch_description: "conf.cpp: musl/OHOS has no glibc program_invocation_name; map it to __progname under !__GLIBC__"
    patch_type: "portability"
  - patch_file: "patches/0002-plocate-root-probe-x-only.patch"
    patch_description: "plocate.cpp: OHOS mounts / drwx--x--x, so the access(\"/\", R_OK|X_OK) bail-out probe silently zeroed all query results; X_OK is what the visibility model actually needs"
    patch_type: "portability"
  - patch_file: "patches/0003-access-rx-cache-x-only.patch"
    patch_description: "access_rx_cache.cpp: per-directory visibility check must use X_OK too; with R_OK every ancestor chain died at the unreadable / and all files became invisible"
    patch_type: "portability"
  - patch_file: "patches/0004-meson-ic-probe-fs-is-file.patch"
    patch_description: "meson.build: the optional TurboPFor probe invokes the '[' external program, which OHOS/HarmonyOS workers have no executable for (configure aborts with 'Program or command [ not found or not executable'); replaced with fs.is_file() from the fs module this file already imports"
    patch_type: "portability"
