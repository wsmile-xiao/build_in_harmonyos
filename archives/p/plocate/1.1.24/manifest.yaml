upstream_tests:
  command: "none"
  test_count: 0
  notes: "The official release tarball registers zero tests: meson.build contains no test() call and no tests/ directory ships (independently confirmed on the 1.1.23 Debian .orig). Upstream git (git.sesse.net) was TLS-unreachable on 2026-09-24, so the in-tree state is unverifiable; the packaged artifact is the tarball, whose honest count is 0. Behavioral coverage ships as the end-to-end test_package suite."

test_package:
  assertion_count: 10
  description: "End-to-end consumer run of the installed CLI trio: version, plocate-build -p database build from a plaintext list, exact 2-file match, -i/-c/-b/-r/-l semantics, empty no-match, 4-file regex sweep."

knowledge_gained:
  - "HongMeng seccomp splits io_uring per-syscall: io_uring_setup succeeds (fd) but io_uring_register is killed with uncatchable SIGSYS (exit 159) — a setup-only capability probe is a false positive, and any normal liburing init (queue_init registers a PROBE) dies; default optional uring paths to the required:false fallback on OHOS (DRAFT-plocate-1.1.24-io_uring-hongmeng-seccomp-sigsys)"
  - "OHOS mounts / drwx--x--x: visibility probes using access(R_OK|X_OK) on / (plocate.cpp) or ancestor chains (access_rx_cache.cpp) silently degrade to 'no results' instead of erroring; locating a known name only needs X_OK"
  - "meson recipes on this device: MesonToolchain writes no [binaries] ar entry and conan's build PATH lacks the toolchain dir — pin ar/ranlib/strip/pkgconfig absolute paths into the native file"
  - "upstream expects liburing.h in a distro system include and does not attach the uring dep to the updatedb target; the conan dep's include dir must be injected globally via MesonToolchain.extra_cxxflags"
  - "OHOS kernels only exec ELFs with a valid .codesign section; meson+lld leaves the placeholder empty — sign packaged binaries in package() with binary-sign-tool -selfSign 1 (abx/0.1 flow)"
