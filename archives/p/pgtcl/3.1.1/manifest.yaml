software: pgtcl
# 版本级 manifest
# 文件位置: archives/p/pgtcl/3.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/flightaware/Pgtcl/tarball/v3.1.1"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统描述（G4 要求）
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-tcl=/storage/Users/currentUser/usr/local/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - tcl/8.6.14
    - postgresql/17.10
    - sqlite3/3.49.1

  # 编译器
  cc: clang
  cxx: clang++

  # TEA 扩展特有：源码不包含 configure，需先运行 autoconf
  pre_configure_steps:
    - "autoconf (生成 configure 脚本)"
    - "sed 移除 configure 中 umask 077 (HarmonyOS HMDFS 限制)"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-harmonyos-platform.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "TEA 扩展不识别 HarmonyOS 平台（uname -s 返回 HarmonyOS），需添加 HarmonyOS* 到 Linux 模式匹配"
  - "autoconf 生成的 config.status 使用 umask 077 创建临时目录，在 HarmonyOS HMDFS 上不可写"
  - "GitHub tarball 使用 commit hash 作为子目录名，需提升到正确位置"
  - "pgtcl 测试需要 PostgreSQL 服务和 Tcl 动态加载，在 HarmonyOS 上受限"