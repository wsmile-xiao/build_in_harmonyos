# test_package/MANIFEST.yml — perl-config-tiny 2.30
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-config-tiny/2.30
homepage: "https://metacpan.org/pod/Config::Tiny"

# 上游测试套件：t/ 目录 9 个 .t 测试文件（prove -l t/ 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（t/ 下 9 个 .t 测试文件，逐个声明）
upstream_tests:
  - file: t/00.versions.t
    source: Config-Tiny-2.30/t/00.versions.t
    description: "版本一致性检查（prove -l t/ 实测通过）"
    command: "prove -l t/00.versions.t"
  - file: t/01.compile.t
    source: Config-Tiny-2.30/t/01.compile.t
    description: "编译加载检查（prove -l t/ 实测通过，1 断言）"
    command: "prove -l t/01.compile.t"
  - file: t/02.main.t
    source: Config-Tiny-2.30/t/02.main.t
    description: "主功能测试（prove -l t/ 实测通过，33 断言）"
    command: "prove -l t/02.main.t"
  - file: t/03.read.string.t
    source: Config-Tiny-2.30/t/03.read.string.t
    description: "read_string 测试（prove -l t/ 实测通过，2 断言）"
    command: "prove -l t/03.read.string.t"
  - file: t/04.utf8.t
    source: Config-Tiny-2.30/t/04.utf8.t
    description: "UTF-8 测试（prove -l t/ 实测通过，7 断言）"
    command: "prove -l t/04.utf8.t"
  - file: t/05.zero.t
    source: Config-Tiny-2.30/t/05.zero.t
    description: "零值/空值测试（prove -l t/ 实测通过，6 断言）"
    command: "prove -l t/05.zero.t"
  - file: t/06.repeat.key.t
    source: Config-Tiny-2.30/t/06.repeat.key.t
    description: "重复 key 测试（prove -l t/ 实测通过，3 断言）"
    command: "prove -l t/06.repeat.key.t"
  - file: t/07.trailing.comment.t
    source: Config-Tiny-2.30/t/07.trailing.comment.t
    description: "行尾注释测试（prove -l t/ 实测通过，4 断言）"
    command: "prove -l t/07.trailing.comment.t"
  - file: t/08.constructor.t
    source: Config-Tiny-2.30/t/08.constructor.t
    description: "构造函数测试（prove -l t/ 实测通过，4 断言）"
    command: "prove -l t/08.constructor.t"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Config::Tiny + read_string 真实 .ini 配置）
test_package_tests:
  - file: test_config_tiny.py
    description: "Loads packaged Config::Tiny via perl -I<lib> and reads a real .ini config string via read_string(), asserting a parsed value"
    command: "python3 test_config_tiny.py"

# 断言总数：1（.ini 解析校验）
assertion_count: 1
