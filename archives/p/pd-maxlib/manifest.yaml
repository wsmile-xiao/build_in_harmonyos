software: pd-maxlib
display: "pd-maxlib"
description: "Pure Data 外部对象集合 maxlib（58 个类：数学/随机分布/序列节拍/列表路由/自动机）"
category: audio
homepage: "https://puredata.info"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "制品仓 puredata/0.54.1 是 application，不装 Pd API 头 m_pd.h → 配方 source() 额外拉取 pure-data 0.54-1 源码树，PDINCLUDEDIR 指向其 src"
    - "上游 pd-lib-builder 依据 $(CC) -dumpmachine 选中 Linux 分支与 pd_linux 扩展名；CC 由 compiler_executables 显式传入"
    - "上游 Makefile 已注释排除依赖 Pd 内部头 m_imp.h/s_stuff.h 的 net* 类；本次构建 58 个 .pd_linux"
    - "消费者测试用真机 OHOS pd 无头加载安装后的外部对象并驱动 [divide]/[plus]"
  common_dependencies: []

versions:
  - version: "1.6.0"
    status: built
    build_date: "2026-09-29"
