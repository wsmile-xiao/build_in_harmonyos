# test_package/MANIFEST.yml
# pd-maxlib 1.6.0 - upstream test declaration.

package: pd-maxlib/1.6.0
homepage: "https://puredata.info"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships only Pd help patches (help/*.pd) and a test/all_maxlib.pd
  smoke patch; there is no make check/ctest and no automated test harness.
  The externals can only be exercised by loading them into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_maxlib.sh
    description: "headless OHOS pd loads the installed maxlib externals and drives [divide 10 20]->0.5 and [plus 3 4]->7"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_maxlib.pd sh test_pd_maxlib.sh"

test_files:
  - path: "test_package/test_pd_maxlib.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_maxlib.sh"
    test_type: "R34"
    assertion_count: 2

test_package_test_count: 1
consumer_assertion_count: 2
upstream_test_cases: 0
assertion_count: 2
