# 软件级 manifest
# 文件位置: archives/p/perl-net-async-xmpp/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: perl-net-async-xmpp

# 显示名
display: "Net::Async::XMPP"

# 一句话描述
description: "Asynchronous support for the Extensible Message Passing Protocol (XMPP) for Perl"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: network

# 官网 URL
homepage: "https://metacpan.org/release/Net-Async-XMPP"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯 Perl 模块，使用 ExtUtils::MakeMaker (Makefile.PL) 构建，无需 C/C++ 编译"
    - "Makefile.PL 开箱即用，无需补丁修改"
    - "运行时依赖链中包含 XS 模块 (Net::SSLeay, XML::LibXML)，受 SELinux HMDFS 限制无法在用户路径加载"
    - "需管理员将 XS 依赖安装到 /data/service/hnp/ 系统目录获取 hnp_file:s0 标签"
    - "CPAN 下载需手动从 cpan.metacpan.org 获取，cpan 命令会超时"

  # 跨版本通用依赖
  common_dependencies:
    - perl
    - perl-io-async
    - perl-protocol-xmpp
    - perl-future

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.003-r0":
    status: built
    build_date: 2026-06-25