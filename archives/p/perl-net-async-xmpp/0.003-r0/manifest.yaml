software: perl-net-async-xmpp
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.003-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.003-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/T/TE/TEAM/Net-Async-XMPP-0.003.tar.gz"

  # 源码校验和
  sha256: "da4d15691f76901002791fa76f18ff0750c9db6594d2cacdff375be486a3a619"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - perl-future/0.29+
    - perl-future-utils/0.29+
    - perl-io-async/0.60+
    - perl-io-async-ssl/0.14+
    - perl-io-async-resolver-dns/0.04+
    - perl-protocol-xmpp/0.006+
    - perl-mixin-event-dispatch/1.000+
    - perl-curry/2.000001+
    - perl-socket/2.000+

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Net::Async::XMPP 是纯 Perl 模块，使用 ExtUtils::MakeMaker (Makefile.PL) 构建，无需 C/C++ 编译"
  - "Makefile.PL 开箱即用，无需任何补丁修改，perl Makefile.PL && make && make install 全部通过"
  - "运行时依赖链: Client → Protocol → IO::Async::SSL → IO::Socket::SSL → Net::SSLeay (XS .so) → SELinux HMDFS Permission denied"
  - "Protocol::XMPP 依赖 XML::LibXML::SAX::ChunkParser (XS)，同样受 SELinux 限制"
  - "主模块 Net::Async::XMPP 和 Net::Async::XMPP::Server 可正常加载，不直接依赖 XS 模块"
  - "与 perl-dbd-pg 共享相同的 SELinux HMDFS 限制根因: hmdfs:s0 标签的 .so 文件无法被 hishell_hap domain 加载"
  - "CPAN 下载需手动从 cpan.metacpan.org 获取，cpan 命令会超时"
