software: ptl
display: "PTL"
description: "Lightweight C++11 multithreading tasking system"
category: library
homepage: "https://github.com/jrmadsen/PTL"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the Conan CMake toolchain for HarmonyOS arm64"
    - "Patch the missing cstring include required by modern C++ compilers"
    - "Use sched_setaffinity from each worker when pthread_setaffinity_np is unavailable"
    - "Run all six upstream native and TBB example tests"
  common_dependencies:
    - tbb

versions:
  "2.3.3":
    status: built
    build_date: "2026-09-29"
    conan_ref: "ptl/2.3.3"
