patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Detect available CPU affinity APIs"
    patch_type: "portability"
  - patch_file: "patches/0002-cmake-Templates-Config.hh.in.patch"
    patch_description: "Expose detected CPU affinity capabilities"
    patch_type: "portability"
  - patch_file: "patches/0003-source-PTL-Backtrace.hh.patch"
    patch_description: "Include cstring for strlen declaration"
    patch_type: "portability"
  - patch_file: "patches/0004-source-PTL-ThreadPool.hh.patch"
    patch_description: "Pass CPU affinity target to worker startup"
    patch_type: "portability"
  - patch_file: "patches/0005-source-ThreadPool.cc.patch"
    patch_description: "Apply sched affinity from the worker thread"
    patch_type: "portability"
  - patch_file: "patches/0006-source-Threading.cc.patch"
    patch_description: "Use sched_setaffinity when pthread API is unavailable"
    patch_type: "portability"
