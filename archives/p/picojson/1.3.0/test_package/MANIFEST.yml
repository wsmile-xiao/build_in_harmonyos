# test_package/MANIFEST.yml
# 上游官方测试声明文件 — picojson 1.3.0
# 依据：官方 tag 源码 Makefile + test.cc（picotest 框架）实测枚举

package: picojson/1.3.0
homepage: "https://github.com/kazuho/picojson"

# 上游测试命令 (make check -> test: test-core + test-core-int64)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# header-only 无 build()；上游测试在适配阶段已单独编译运行（见 notes.md 台账）
upstream_test_in_build: false
upstream_test_command: "clang++ -Wall test.cc picotest/picotest.c -o test-core && clang++ -Wall -DPICOJSON_USE_INT64 test.cc picotest/picotest.c -o test-core-int64"

# 上游实际运行的测试程序（同一 test.cc 的两个配置变体）
upstream_tests:
  - file: test.cc
    source: picojson-1.3.0/test.cc
    description: "主测试源（默认配置，99 项断言，TAP 1..99 全部通过）"
    command: "./test-core"
  - file: test.cc
    source: picojson-1.3.0/test.cc
    description: "主测试源（-DPICOJSON_USE_INT64 配置，125 项断言，TAP 1..125 全部通过）"
    command: "./test-core-int64"

# test_package 中自带的测试 (消费者视角验证, 真实调用 picojson API: parse/inspect/serialize)
test_package_tests:
  - file: test.cc
    description: "消费者测试：解析+类型检查+序列化 picojson 数据"
    command: "./test_picojson"
  - file: test_ohos.cc
    description: "OHOS 专项测试：int64 精确往返/UTF-8 解码往返/畸形输入错误处理/浮点序列化稳定/C++17 string_view 交互（OHOS clang15+libc++17 编译运行）"
    command: "./test_ohos"

# 测试断言总数（运行时 TAP 计划行统计：test-core=99, test-core-int64=125；源内静态 ok()=58，循环展开后运行时 99/125）
assertion_count: 224
