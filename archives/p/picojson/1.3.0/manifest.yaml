# 版本级 manifest — picojson 1.3.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.0"

# 软件名
software: "picojson"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-06"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方源）
  url: "https://codeload.github.com/kazuho/picojson/tar.gz/refs/tags/v1.3.0"

  # 源码校验和
  sha256: "056805ca2691798f5545935a14bb477f2e1d827c9fb862e6e449dbea22801c7d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（header-only，无编译；上游仅 Makefile 构建测试）
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）— header-only 无第三方依赖
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本适配无需补丁）
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "header-only 包用 package_type=header-library（Conan 2），避免 library 缺 shared option 报错（复用 E283/E321/E322）"
  - "codeload.github.com 归档 URL 末段无扩展名时，conandata sources 须显式 filename=，否则 get() 按 zip 解压报 BadZipFile（复用 E276/E483）"
  - "test_package C++ 消费者源码须 .cc 后缀；.c 在 CXX-only 工程触发 Cannot determine link language（新增草稿 DRAFT-picojson-1.3.0-test-package-source-language）"
  - "conan copy() 的 dst 必须 package_folder 绝对路径；相对路径按 CWD 解析致空包（新增草稿 DRAFT-picojson-1.3.0-conan-copy-absolute-dst）"
