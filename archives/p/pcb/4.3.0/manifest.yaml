# 版本级 manifest
# pcb 4.3.0 — printed circuit board layout CAD (geda-pcb)

version: "4.3.0"

software: "pcb"

status: built

build_date: "2026-09-05"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://github.com/bert/pcb/archive/refs/tags/v4.3.0.tar.gz"
  sha256: "3a2e8305b27a24ea8108645ce364113e33c07a67598656ab97e28b78fe1dfd16"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  bootstrap: "./autogen.sh (autopoint + intltoolize + aclocal + autoheader + automake + autoconf)"

  configure_options:
    - "--with-gui=batch"
    - "--disable-toporouter"
    - "--disable-update-desktop-database"
    - "--disable-update-mime-database"
    - "--disable-doc"
    - "--enable-static"
    - "--disable-shared"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"

  # conan 制品仓依赖（requirements）
  dependencies:
    - "glib/2.84.0.1"

  # conan 工具链依赖（tool_requires，CI 沙箱无系统 automake/intltool）
  tool_dependencies:
    - "automake/1.18"
    - "intltool/0.51.0"

  # 镜像自带 (CI 沙箱 /data/service/hnp/bin + gettext.org)
  image_tools:
    - "autoconf 2.72 (autoreconf/autoheader/autom4te)"
    - "gettext_0.26 autopoint (gettext_datadir 覆盖)"
    - "pkg-config"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - "patches/0001-config.sub-linux-ohos.patch"

# ============================================================
# 测试统计（与 test_package/MANIFEST.yml、run_pcb_tests.sh、
# conanfile.py docstring、test_package/CMakeLists.txt、PR 描述同步）
# ============================================================
tests:
  upstream_total: 112
  upstream_adapted_scenarios: 3
  upstream_adapted_assertions: 7
  new_assertions: 7
  total_assertions: 14

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "pcb git 归档不含 configure，autogen.sh = autopoint+intltoolize+aclocal+autoheader+automake+autoconf 七步"
  - "glib-2.0 是硬依赖（src/global.h:66 无条件 include glib.h），configure 对 glib 检查是软提示是陷阱——编译期必然失败"
  - "--with-gui=batch 无显示依赖（pcbtest.sh.in 注释确认），-x gerber/bom/gcode/IPC-D-356/ps 导出全可用"
  - "--disable-toporouter 连带跳过 cairo/gts 依赖探测"
  - "CI 沙箱只有 autoconf 套件（/data/service/hnp/bin），automake/aclocal 需 tool_requires automake/1.18（自带 ACLOCAL/AUTOMAKE/PERL5LIB/ACLOCAL_PATH buildenv）"
  - "intltoolize 需 tool_requires intltool/0.51.0"
  - "autopoint 由镜像 gettext_0.26 提供，其编译期硬编码 lycium 路径需 gettext_datadir 环境变量覆盖"
  - "conan automake 脚本内 @am_AUTOM4TE@ 占位符需 AUTOM4TE/SED/AUTOCONF/AUTOHEADER 环境变量覆盖（E089）"
  - "HMDFS: configure 生成的 ac_tmp 需 sed 固定到 ./fixed_tmp 并预建目录（E129），make 用 -j1 避开 jobserver fifo EPERM（E074）"
  - "LDFLAGS 需覆盖剔除 -L/usr/local/lib 防误链旧静态 glib（E107/E142）"
  - "config.sub 2015 无 linux-ohos 识别，提前 echo 短路补丁可过 --host=aarch64-unknown-linux-ohos"
  - "pcb configure.ac 无 AC_RUN_IFELSE，只有 compile/link 探测，--build/--host 同 triplet 安全"
  - "上游 112 场景回归套件：PNG 比对依赖 ImageMagick、action 依赖 display，CI 沙箱只能跑文本导出子集"
