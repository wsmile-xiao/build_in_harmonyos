sources:
  url: "https://github.com/bert/pcb/archive/refs/tags/v4.3.0.tar.gz"
  sha256: "3a2e8305b27a24ea8108645ce364113e33c07a67598656ab97e28b78fe1dfd16"

patches:
  - patch_file: "patches/0001-config.sub-linux-ohos.patch"
    patch_description: "config.sub (vendored 2015) 增加 aarch64-*-linux-ohos 识别，configure --host=aarch64-unknown-linux-ohos 可过校验"
    patch_type: "portability"
  - patch_file: "patches/0002-configure.ac-version.patch"
    patch_description: "GitHub tag 归档无 git 元数据，git describe 版本推导为空 → 硬编码上游版本 4.3.0"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.ac-intltool-no-xml.patch"
    patch_description: "intltool.m4 的 XML::Parser 检查在 OHOS 沙箱必败（XS 模块 dlopen 限制），IT_PROG_INTLTOOL 传 no-xml 跳过"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.ac-wish-optional.patch"
    patch_description: "tcl/tk wish 为硬错误但 batch 构建不需要（仅 m4lib png 预览/文档用）→ 未找到时降级警告继续"
    patch_type: "portability"
  - patch_file: "patches/0005-data-makefile-no-intltool-merge.patch"
    patch_description: "桌面元数据(.desktop/.appdata/mime)生成依赖 intltool-merge(XML::Parser XS 在 OHOS 不可用)→ 关闭派生目标"
    patch_type: "portability"
  - patch_file: "patches/0006-misc.c-pcb-author-null.patch"
    patch_description: "上游 bug 修复：getpwuid() 返回 NULL（沙箱无 passwd 条目）时 pcb_author() 无条件解引用致 SIGSEGV（bom/bom_md/gerber/ps 导出全崩）→ 回退 $USER/空串"
    patch_type: "portability"
  - patch_file: "patches/0007-gerber.c-getpwuid-null.patch"
    patch_description: "上游 bug 修复（与 0006 同类第二处）：src/hid/gerber/gerber.c RS-274X 文件头无条件解引用 getpwuid() 返回值（NULL 时 SIGSEGV，gerber 导出 0 字节即崩）→ 回退 $USER/空串"
    patch_type: "portability"
