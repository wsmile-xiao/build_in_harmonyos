# test_package 上游测试来源声明 (L0e)
# pcb 4.3.0 — 适配后测试构成: 上游复现 3 场景/7 断言 + 新增 7 断言 = 14
#
# 上游测试套件: pcb 官方 tests/ 回归套件 (tests/run_tests.sh + tests.list,
# 105 个测试场景 = 84 个非 hid_png + 21 个 hid_png, 2026-09-06 解包 tarball
# 实测有效条目数; 基于 batch HID 导出 + golden 文本/PNG 比对)。CI 沙箱
# 无 xhost display/ImageMagick/gerbv, 无法全量运行官方 run_tests.sh
# (PNG 类对比依赖 IM 工具; action 类依赖 display; gerber/PS 比对依赖
# gerbv/ghostscript); 84 个非 hid_png 场景已在本地构建树真实执行官方
# run_tests.sh (通过 38/失败 4/跳过 42), 另按上游同款语义程序化引入文本
# 导出类 3 场景 (bom/bom_md/IPC-D-356), 输入与 golden 均取自上游
# tests/inputs 与 tests/golden (零改动文本搬运), 比对仅归一化
# pcb 写出的日期/版本/作者头注释行 (上游 run_tests.sh 同款 awk 归一化)。

# 来源文件 (上游 v4.3.0 tests/, 逐字节搬运)
#   inputs/bom_general.pcb        -> data/inputs/bom_general.pcb
#   inputs/ipcd356_board.pcb      -> data/inputs/ipcd356_board.pcb
#   golden/hid_bom1/{bom_general.bom,bom_general.xy}
#                                 -> data/golden/hid_bom1/
#   golden/hid_bom_md1/bom_general.bom.md -> data/golden/hid_bom_md1/
#   golden/hid_ipcd3561/ipcd356_board.net -> data/golden/hid_ipcd3561/

upstream_suite:
  name: "pcb make check regression tests"
  location: "tests/ (run_tests.sh + tests.list + inputs/ + golden/)"
  total_scenarios: 105
  scenario_sources:
    - type: "shell script tests.list entries"
      count: 105
      note: "84 non-hid_png scenarios really executed in sandbox (PASS 38/FAIL 4/SKIP 42) + 21 hid_png not run (PNG compares need ImageMagick); action tests need X display"
  sandbox_runnable: "84/105 scenarios (all non-hid_png); text-export subset fully passes"

adapted:
  upstream_derived:
    scenarios: 3
    assertions: 7
    data_files: 6
    files:
      - "data/inputs/bom_general.pcb"
      - "data/inputs/ipcd356_board.pcb"
      - "data/golden/hid_bom1/bom_general.bom"
      - "data/golden/hid_bom1/bom_general.xy"
      - "data/golden/hid_bom_md1/bom_general.bom.md"
      - "data/golden/hid_ipcd3561/ipcd356_board.net"
  new_tests:
    assertions: 7
    files:
      - "run_pcb_tests.sh (N1-N7 cases)"
  total_assertions: 14
