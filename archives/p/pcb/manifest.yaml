# 软件级 manifest — pcb (geda-pcb)

software: pcb
display: "pcb (geda-pcb)"
description: "Interactive printed circuit board layout tool — batch HID export/DRC for HarmonyOS PC"
category: gfx

homepage: "https://git.geda-project.org/pcb"

license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "--with-gui=batch: 无显示 batch HID，导出动作（gerber/bom/gcode/IPC-D-356/ps）全可用"
    - "glib-2.0 为硬依赖（代码无条件 include glib.h），版本 2.84.0.1"
    - "--disable-toporouter 跳过 cairo/gts 依赖链"
    - "autogen.sh 引导: automake/1.18+intltool/0.51.0 走 tool_requires；autopoint 由镜像 gettext_0.26 提供"
    - "config.sub 补丁增加 *-linux-ohos 识别"

  common_dependencies:
    - "glib/2.84.0.1"

versions:
  "4.3.0":
    status: built
    build_date: "2026-09-05"
    source_url: "https://github.com/bert/pcb/archive/refs/tags/v4.3.0.tar.gz"
    source_sha256: "3a2e8305b27a24ea8108645ce364113e33c07a67598656ab97e28b78fe1dfd16"
