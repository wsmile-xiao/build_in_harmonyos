software: perl-log-any-adapter-tap
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.003003-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.003003-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-16"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://www.cpan.org/authors/id/N/NE/NERDVANA/Log-Any-Adapter-TAP-0.003003.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-log-any/1.718-r0"
    - "try-tiny/latest"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 Perl 模块，无源码修改，无需补丁

# ============================================================
# 交付物信息
# ============================================================

package:
  file: "perl-log-any-adapter-tap-0.003003-r0-ohos-aarch64.tar.gz"
  size: "16K"
  content:
    - "usr/local/lib/site_perl/5.42.0/Log/Any/Adapter/TAP.pm"
  install_script: "cmd-pkgs 公共安装脚本"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块无需 ELF 签名"
  - "纯 Perl 模块无需补丁，直接安装即可"
  - "PERL5LIB 环境变量或 -I 参数指定用户安装路径"