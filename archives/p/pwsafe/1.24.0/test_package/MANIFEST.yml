# test_package/MANIFEST.yml
# Upstream test declaration for CI (L0e requirement)
package: pwsafe/1.24.0
homepage: "https://pwsafe.org/"

# Upstream test command (pwsafe uses CMake + gtest, disabled with NO_GTEST=ON for OHOS)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test programs (gtest-based, not available in CLI-only build)
upstream_tests: []

# test_package tests (consumer verification)
test_package_tests:
  - file: test_pwsafe.c
    description: "Smoke test: invoke pwsafe-cli --help and verify supported arguments"
    command: "./test_pwsafe"

assertion_count: 2
