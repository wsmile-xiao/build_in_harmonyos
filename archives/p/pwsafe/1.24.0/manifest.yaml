software: pwsafe
version: "1.24.0"
status: built
build_system: cmake
build_date: "2026-08-08"

source:
  url: "https://github.com/pwsafe/pwsafe/archive/refs/tags/1.24.0.tar.gz"
  sha256: "234f88f7c224c9dcaea5650afca5957fcf3f80ea411d92a34f26468e7ecd0485"
  tar_format: tar.gz

build:
  system: cmake
  configure_options: ["-DNO_WX=ON", "-DNO_GTEST=ON", "-DNO_YUBI=ON", "-DHARDEN_USE_SAFE_STACK=OFF"]
  dependencies: ["openssl/3.5.6.1", "uuid/2.40.1", "curl/8.15.0"]
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"
  - "0002-CMakeModules-pws-version.cmake.patch"
  - "0003-src-core-StringX.cpp.patch"
  - "0004-src-core-XML-Pugi-PFilterXMLProcessor.cpp.patch"
  - "0005-src-os-CMakeLists.txt.patch"
  - "0006-src-os-unix-keystub.cpp.patch"
  - "0007-src-os-unix-run.cpp.patch"
  - "0008-src-ui-cli-CMakeLists.txt.patch"
  - "0009-src-ui-cli-version.in.patch"
  - "0010-src-core-XML-Pugi-PFileXMLProcessor.cpp.patch"
  - "0011-make-libmagic-optional.patch"
  - "0012-fix-uuid-detection.patch"
  - "0013-fix-includes-and-magic-guard.patch"

knowledge_gained:
  - "CMake 项目需添加 __OHOS__ 平台条件宏"
  - "secure_getenv 在 OHOS 上不可用，需用 getenv 替代"
  - "PFileXMLProcessor.cpp 需添加 NO_WX 守卫（与 PFilterXMLProcessor.cpp 一致）"
  - "clang-15 SafeStack 在 AArch64 上触发 ICE，需 HARDEN_USE_SAFE_STACK=OFF"
  - "libmagic 无 conan 配方时需 make optional，guard target_link_libraries with HAVE_MAGIC"
  - "src/os/unix/ 下的 syscall（seteuid 等）需要 __OHOS__ 守卫适配"
  - "mbstate_t 在 OHOS musl 上需要显式包含"
