# test_package/MANIFEST.yml
package: plzip/1.13
homepage: "https://www.nongnu.org/lzip/plzip.html"

upstream_check_command: "make check"

upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: testsuite
    source: plzip-1.13/testsuite
    description: "plzip test suite (decompression, compression, bad input)"
    command: "make check"

test_package_tests:
  - file: conanfile.py
    description: "Consumer test: compress + decompress round-trip via plzip binary"
    command: "conan create test_package"

assertion_count: 3
