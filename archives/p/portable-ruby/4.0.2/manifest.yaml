    - openssl/system
  cc: "clang -B/storage/Users/currentUser/tmp/ld-wrapper/"
  cxx: clang++

required_env:
  CC: "clang -B/storage/Users/currentUser/tmp/ld-wrapper/"
  CONFIG_SHELL: "/storage/Users/currentUser/usr/local/bin/bash"
  SHELL: "/storage/Users/currentUser/usr/local/bin/bash"

install_target: install-nodoc

patches_applied:
  - "0001-configure.patch"
  - "0002-tool-config.guess.patch"
  - "0003-tool-config.sub.patch"

knowledge_gained:
  - "E007: config.guess/config.sub 需替换为支持 aarch64-linux-ohos 的版本"
  - "E011: configure 中 umask 077 导致 HMDFS Permission denied，需替换为 umask 022"
  - "OHOS ld.lld 不支持 --compress-debug-sections=zlib，需从所有 Makefile 移除"
  - "psych/fiddle 扩展不可用（缺少 libyaml/FFI），需使用 install-nodoc"
  - "pthread_cancel/mremap/ppoll 在 OHOS musl 未实现，configure 自动检测禁用"

