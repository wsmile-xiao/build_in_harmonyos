package: pystring/1.2.0
homepage: "https://github.com/imageworks/pystring"

upstream_check_command: "ctest --output-on-failure --verbose"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --verbose"

upstream_tests:
  - file: test.cpp
    source: pystring-1.2.0/test.cpp
    description: "56 registered pystring unit test groups, run against the compiled and header-only targets"
    command: "ctest --output-on-failure --verbose"
  - file: test_header_only_define.cpp
    source: pystring-1.2.0/test_header_only_define.cpp
    description: "Compile-time check that the header-only target defines PYSTRING_HEADER_ONLY"
    command: "cmake --build . --target pystring_test_header_only_define"

test_package_tests:
  - file: test.cpp
    description: "Consumer checks for pystring::split, pystring::join, pystring::strip, and pystring::upper"
    command: "./test_pystring"

assertion_count: 4
