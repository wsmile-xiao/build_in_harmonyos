# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: pystring/1.1.4
homepage: "https://github.com/imageworks/pystring"

# Upstream test command (used for make -n check / ctest -N analysis)
upstream_check_command: "make test"

# Whether upstream test is integrated in conanfile.py build() method
upstream_test_in_build: true
upstream_test_command: "make test"

# Upstream test programs actually run
upstream_tests:
  - file: test.cpp
    source: pystring-1.1.4/test.cpp
    description: "pystring unit tests (endswith, find, rfind, replace, slice, split, rsplit, startswith, strip, translate, abspath, splitdrive, isabs, join, normpath, split, splitext)"
    command: "./pystring_test"

# Tests in test_package (consumer perspective verification)
test_package_tests:
  - file: test.cpp
    description: "Consumer test calling pystring::split, pystring::join, pystring::strip, pystring::upper"
    command: "./test_pystring"

# Total assertion count (approximate, for quality assessment)
assertion_count: 4
