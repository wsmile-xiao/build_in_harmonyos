# 版本级 manifest
# 文件位置: archives/p/pystring/1.1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.4"

# 软件名
software: "pystring"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-28"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/imageworks/pystring/tar.gz/refs/tags/v1.1.4"

  # 源码校验和
  sha256: "49da0fe2a049340d3c45cce530df63a2278af936003642330287b68cefd788fb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x requires CMAKE_POLICY_VERSION_MINIMUM=3.5 for cmake_minimum_required(VERSION 3.2)"
  - "conan get() needs filename param when URL lacks .tar.gz extension"
  - "CMakeLists.txt doesn't install headers; must copy pystring.h manually in package()"
