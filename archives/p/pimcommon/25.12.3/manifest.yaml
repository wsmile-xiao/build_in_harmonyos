version: "25.12.3"
software: "pimcommon"
status: built
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://download.kde.org/Attic/release-service/25.12.3/src/pimcommon-25.12.3.tar.xz"
  sha256: "6496e293294e23c6db8a19e4774313426bcdc8478defb2141ec4f6653f9f4b2f"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DBUILD_QCH=OFF"
    - "-DBUILD_DESIGNERPLUGIN=OFF"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
  dependencies:
    - qtbase-sql-dbus/6.11.1
    - kio/6.14.0
    - kcodecs/6.14.0
    - kcolorscheme/6.14.0
    - kconfig/6.14.0
    - kcoreaddons/6.14.0
    - ki18n/6.14.0
    - kitemviews/6.14.0
    - kjobwidgets/6.14.0
    - kwidgetsaddons/6.14.0
    - kxmlgui/6.14.0
    - libxml2/2.15.3
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-ohos-adaptation.patch"

knowledge_gained:
  - "Core-library-only port: pimcommonakonadi / pimcommon-activities are not built (KPim6 stack not published on the OHOS PC conan remote)."
  - "SpellCheckLineEdit / TemplateEditDialog fall back to QPlainTextEdit; PurposeMenuWidget falls back to an empty QMenu; autocorrection is a documented no-op (KF6TextAddons / KF6Purpose not published)."
  - "KDEInstallDirs6 ECMQueryQt executes the packaged qtpaths host tool; LD_LIBRARY_PATH must include /system/lib64 (sandbox libc++_shared.so shadow) plus the SDK llvm/lib dirs (kconfig 6.26.0 / kcrash 6.26.0 precedent)."
  - "Upstream CTest entries resolve build-tree-relative DT_NEEDED entries from the per-test cwd; symlink farms around every CTestTestfile.cmake dir make the published KF6 binaries loadable (keditbookmarks 26.04.0 precedent)."
