software: perl
version: "5.42.2.3"
status: built
build_date: "2026-09-03"
issue: "https://gitcode.com/OpenHarmonyPCDeveloper/build_in_harmonyos/issues/1478"

source:
  upstream_version: "5.42.2"
  url: "https://www.cpan.org/src/5.0/perl-5.42.2.tar.gz"
  mirrors:
    - "https://mirrors.tuna.tsinghua.edu.cn/CPAN/src/5.0/perl-5.42.2.tar.gz"
    - "https://mirrors.ustc.edu.cn/CPAN/src/5.0/perl-5.42.2.tar.gz"
    - "https://mirrors.aliyun.com/CPAN/src/5.0/perl-5.42.2.tar.gz"
  sha256: "9384e8deb75b7b1695e5637971b752281aaecd025a3d5d4734d33c1d0adfee47"

build:
  system: "perl Configure"
  target: "OHOS/aarch64 native"
  dependencies: []
  compatibility_fix: "Sign Perl executables and XS shared modules in the build tree before installation, then verify .codesign sections in the final Conan package."
  patches:
    - "patches/0001-miniperl-touch-noop.patch"
    - "patches/0002-extutils-install-write-probe.patch"
    - "patches/0003-installperl-write-probe.patch"

test_package:
  type: "tool runtime smoke"
  assertions:
    - "perl reports upstream runtime version 5.42.2"
    - "Config and File::Spec load from the packaged core library"
    - "native XS modules Fcntl and POSIX load from the Conan package"
    - "a strict/warnings Perl script executes successfully"

validation:
  command: "conan create . --profile:host=ci/conan/profiles/ohos-aarch64 --profile:build=ci/conan/profiles/ohos-aarch64 --build=missing"
  result: "pass"
  package_reference: "perl/5.42.2.3#6474fabffb5d718e09b6bde664df8fe4:6b129b068851896169fae42d399fa922d239ce8a#d74ece8b494b81e19da6e2e149c1bef9"
  package_created: true
  clean_source_run: "2026-09-03, true HarmonyOS aarch64 device, --build='perl*' forced local build, sha256 verified, exit 0"
  xs_runtime: "pass: Fcntl and POSIX loaded; output contained 'XS modules ok'"
  script_runtime: "pass: output contained 'script ok'"

upstream_suite:
  command: "TEST_JOBS=4 HARNESS_NOTTY=1 make test_harness_notty"
  run_date: "2026-09-03"
  result: "fail (platform limits, all documented with evidence)"
  test_programs_run: 2902
  assertions_run: 1349481
  passing_programs: 2714
  failed_programs: 25
  harness_skipped_programs: 163
  wallclock_seconds: 472
  evidence: "see w3-5.42.2.3/ logs and qc-logs/evidence/ (25 failures identical to validated 5.42.2.1 run on same device)"

known_limits:
  - "The full upstream Perl test suite does not pass 100% on the OHOS device: 25 test programs fail on platform semantics (HMDFS hardlink/chmod/owner behavior, seccomp blocking AF_UNIX and SIGRTMIN, OHOS libc tz/locale/termios/setitimer/errno differences, clang emulated-TLS symbol naming). Each failure is reproduced and evidenced in qc-logs/evidence/ and qc-logs/failed-details/."
  - "The consumer smoke test (test_package) passes: interpreter, core modules, XS modules and script execution all work from the packaged tool."
