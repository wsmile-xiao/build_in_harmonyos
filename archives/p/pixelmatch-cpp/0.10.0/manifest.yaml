# 版本级 manifest — pixelmatch-cpp 0.10.0

# 版本号
version: "0.10.0"

# 软件名
software: "pixelmatch-cpp"

# 编译状态
# published | built | failed | archived
# built：conan-verify + W3 本地 CI 通过；远端 upload 由 CI release 流水线在 PR 合并后执行
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: gyp

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag）
  url: "https://github.com/mapbox/pixelmatch-cpp/archive/refs/tags/v0.10.0.tar.gz"

  # 源码校验和（SHA-256，官方 v0.10.0 tarball 实测）
  sha256: "f93365a21f4d25813621cab993116212ee74ee078871a5c7db3a6ae8a9f28d28"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型（header-only 库，上游 gyp 仅构建测试；配方按 header-library 交付头文件）
  system: custom

  # 配置选项列表（header-only，无 configure）
  configure_options: []

  # 编译依赖列表（header-only 库，无运行时依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "上游 gyp 生成器依赖 Python 2 时代语法（print 语句），环境仅 Python 3 时按 pixelmatch.gyp 的 cflags_cc 等价参数直接编译测试，不阻塞适配"
- "header-only 库配方用 package_type=header-library，package() 仅 copy 公开头文件，test_package 用真实公开 API 调用验证（禁止 print-only 空壳）"
