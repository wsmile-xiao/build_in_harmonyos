# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pixelmatch-cpp/0.10.0
homepage: "https://github.com/mapbox/pixelmatch-cpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游无 ctest/meson/autotools check；gyp 生成 build/Makefile 后
# `BUILDTYPE=Debug make -C build test && build/Debug/test` 运行测试。
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (header-only 库，测试由上游 test.cpp 4 个 diffTest 用例构成)
upstream_tests:
  - file: test/test.cpp
    source: pixelmatch-cpp-0.10.0/test/test.cpp
    description: "上游用户测试源：4 个独立 diffTest 用例（1a/1b、2a/2b、3a/3b、4a/4b，期望 mismatch 143/12439/212/36089），本机 clang 等价参数编译运行全部通过（4/4, exit 0）"
    command: "./build_test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：仅通过已安装公开头文件 mapbox/pixelmatch.hpp 调用 mapbox::pixelmatch() 公开 API，验证差异像素计数（1）与相同图像零差异（0）"
    command: "./test_pixelmatch_cpp"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
