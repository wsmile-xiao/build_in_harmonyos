# 版本级 manifest — pktanon 1.4.0

software: pktanon
version: "1.4.0"
# published | built | failed | archived（finish 时确认）
status: built
build_date: "2026-09-04"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================
source:
  # 官方 1.4.0 系唯一发行物 = 官网 -dev tarball（configure.ac 自报 1.4.0-dev）
  url: "https://www.tm.kit.edu/software/pktanon/download/pktanon-1.4.0-dev.tar.gz"
  sha256: "db3f437bcb8ddb40323ddef7a9de25a465c5f6b4cce078202060f661d4b97ba3"
  tar_format: tar.gz
  version_background: >-
    上游 1.4.0 系仅发布官方 -dev 标记 tarball（configure.ac 自报 1.4.0-dev）；
    GitHub 镜像 KIT-Telematics/pktanon master 为 2.0-beta（无 tag/release）。
    归档版本号=1.4.0（用户指定），source url 指向官方 -dev tarball。

# ============================================================
# 构建配置
# ============================================================
build:
  system: autotools
  configure_options: []
  dependencies:
    - boost/1.84.0        # 仅头文件（cstdint.hpp / pool/object_pool.hpp 检查）
    - xerces-c/3.2.5      # 静态 XML 解析库（profile 解析）
  cc: clang
  cxx: clang++

# 应用的补丁列表（本配方以内联修复方式处理，无静态 patch 文件）
patches_applied: []

# 编译中学到的知识
knowledge_gained:
  - "configure/config.status 临时目录 umask 077 在 HMDFS 上不可写（E129），构建前改写为 umask 022"
  - "Timer.h LINUX 分支缺 #include <unistd.h>（musl 暴露 sleep 未声明）"
  - "pktanon 链接仅需 -lxerces-c -lpthread；xerces-c 静态库不需要 -lz"
  - "pcap 解析为 pktanon 自实现，不依赖 libpcap"
