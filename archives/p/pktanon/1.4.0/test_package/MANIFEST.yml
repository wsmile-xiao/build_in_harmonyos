# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pktanon/1.4.0
homepage: "http://www.tm.kit.edu/software/pktanon/"

# 上游测试命令 (make -n check 分析结果)
upstream_check_command: "make check"

# conanfile.py build() 中是否已集成上游测试
# 上游 Makefile.am 未声明 TESTS/check_PROGRAMS，"make check" 为空操作 (no-op)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无上游测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角, 真实调用 pktanon 二进制)
test_package_tests:
  - file: test_pktanon.sh
    description: "端到端匿名化：解析 identity profile XML + 读取 1 包 pcap + 写出 out.pcap"
    command: "bash test_pktanon.sh"
    assertions:
      - "pktanon 退出码为 0"
      - "stderr 输出包含 'anonymization done'"
      - "out.pcap 存在且非空，魔数 d4c3b2a1 (pcap little-endian)"

# 测试断言总数 (近似值)
assertion_count: 3
