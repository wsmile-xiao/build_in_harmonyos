software: pcc
display: "Portable C Compiler"
description: "pcc —— 轻量级可移植 C 编译器，本包将其适配为可在 HarmonyOS PC（aarch64）上运行的原生编译器"
category: build-tool
homepage: "https://github.com/IanHarvey/pcc"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "pcc 无 aarch64 后端（arch/ 下 16 个后端里 arm 是 32 位）；本包交付『在鸿蒙上运行的编译器』，显式 --target=amd64-linux（与已合入的 chibicc 同构），不传 --host"
    - "host 三元组交给 config.guess 原生识别：上游 config.guess（2014-11-04）在鸿蒙上直接失败，需补 HarmonyOS 分支（每个分支必须自带 echo+exit）"
    - "config.sub 需补 linux-ohos 到 kernel-OS 与 OS 类型列表（官方 patch-autotools-ohos.pl 对本项目只命中 1/5）"
    - "驱动 gettmp() 硬编码 /tmp/ctm.XXXXXX，而鸿蒙 /tmp 是 erofs 只读（知识库 E002），需改为遵循 $TMPDIR"
    - "arch/amd64/code.c 的 x87 内联汇编需限定到 x86 主机，否则 aarch64 主机 clang 报 unrecognized instruction mnemonic"
    - "需 -fcommon 编译（老式 tentative definition，现代 clang 默认 -fno-common；实测去掉即 duplicate symbol: lineno）"
    - "静态链接以便被测平台之外也能运行（绕开 E544）"
  common_dependencies: []

versions:
  "1.2.0-devel-20220331":
    status: built
    build_date: "2026-10-02"
    conan_ref: "pcc/1.2.0-devel-20220331"
