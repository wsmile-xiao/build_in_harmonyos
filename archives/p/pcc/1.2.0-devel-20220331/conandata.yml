# conandata.yml — pcc 1.2.0-devel-20220331
# Single source of truth for the tarball URL, its checksum and the patch list.
#
# R39: the URL points at the official upstream repository.  Upstream publishes
# no tagged releases for pcc; the project's distribution model is "whatever is
# on master", and master has not moved since 2018-09-21 (verified via the
# GitHub API: branch head 05a6d549952f, commit date 2018-09-21).  The archive
# ref for master is therefore the authoritative source, and the checksum below
# pins the exact tree.  The platform's version label (20220331) is the snapshot
# date carried by the task, while the tree itself reports 1.2.0.DEVEL /
# DATESTAMP 20180916.

sources:
  url: "https://github.com/IanHarvey/pcc/archive/refs/heads/master.tar.gz"
  sha256: "f4fc6586e71097bfe188264412e40e909ccc3324e9635bd509e61582dfc46daf"

patches:
  - patch_file: "patches/0001-teach-config-guess-sub-about-harmonyos.patch"
    patch_description: "Teach the bundled config.guess/config.sub the HarmonyOS system and the linux-ohos kernel-OS combination, so configure resolves the host natively instead of being told with --host."
    patch_type: "portability"
  - patch_file: "patches/0002-honour-tmpdir-for-temporary-files.patch"
    patch_description: "Make the driver's intermediate files follow $TMPDIR. Upstream hardcodes /tmp, which HarmonyOS mounts read-only (erofs), so every compilation that is not -E only fails there."
    patch_type: "portability"
  - patch_file: "patches/0003-guard-x87-fpu-setup-to-x86-hosts.patch"
    patch_description: "Guard the x87 control-word setup in arch/amd64/code.c to __i386__/__x86_64__ hosts so a non-x86 host compiler can build the amd64 back end."
    patch_type: "portability"
  - patch_file: "patches/0004-drop-umask-077-from-configure-tmpdir.patch"
    patch_description: "Drop `umask 077` from configure's temporary-directory creation (E114). HarmonyOS/HMDFS forces setgid, so the drwx--S--- directory mktemp -d makes under umask 077 cannot be written even by its owner, and config.status then dies with 'could not setup config files machinery'."
    patch_type: "portability"
