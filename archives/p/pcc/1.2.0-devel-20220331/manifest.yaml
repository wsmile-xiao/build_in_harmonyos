version: "1.2.0-devel-20220331"
software: "pcc"
status: built
build_date: "2026-10-02"
conan_ref: "pcc/1.2.0-devel-20220331"
build_system: autotools

source:
  url: "https://github.com/IanHarvey/pcc/archive/refs/heads/master.tar.gz"
  sha256: "f4fc6586e71097bfe188264412e40e909ccc3324e9635bd509e61582dfc46daf"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--target=amd64-linux"
  dependencies: []
  cc: clang

patches_applied:
  - "0001-teach-config-guess-sub-about-harmonyos.patch"
  - "0002-honour-tmpdir-for-temporary-files.patch"
  - "0003-guard-x87-fpu-setup-to-x86-hosts.patch"
  - "0004-drop-umask-077-from-configure-tmpdir.patch"

knowledge_gained:
  - "pcc 没有 aarch64 代码生成后端（arch/ 下只有 amd64 与 32 位 arm 等 16 个后端），configure.ac 在无法映射目标 CPU 时会直接报 \"'$target' is not (yet) supported by pcc\"；因此本包把 pcc 本体作为 HarmonyOS 原生工具交付，显式 --target=amd64-linux"
  - "上游自带 config.guess 是 2014-11-04 版，在鸿蒙上直接失败（uname -s 返回 HarmonyOS，脚本报 unable to guess system type）；官方 scripts/patch-autotools-ohos.pl 对本项目只命中 1/5（config.sub 三处全不命中，config.guess 插入的块缺 echo/exit 而不生效），需按本文件风格手工最小改写"
  - "config.guess 的 host 三元组一旦能原生解析，configure 就不再走交叉分支，CC_FOR_BUILD 自动解析为 $CC，构建期生成器 mkext 无需任何额外处理（原先用 --host 时需要手工 chmod + 显式传 CC_FOR_BUILD）"
  - "鸿蒙 /tmp 是 erofs 只读挂载（知识库 E002）；pcc 驱动把中间文件硬编码写到 /tmp/ctm.XXXXXX，导致除 -E 外任何编译都失败，需让 gettmp() 遵循 $TMPDIR（上游未启用的 cc/driver/driver.c 本就读 TMPDIR）"
  - "arch/amd64/code.c 顶部的 x87 内联汇编（fstcw/fldcw）在 aarch64 主机上编不过，上游自己标注了 XXX cross-compiling will fail here，需限定到 x86 主机"
  - "pcc 是 1990 年代风格的 C 代码，多个翻译单元依赖 tentative definition，需要 -fcommon（GCC>=10 / clang>=11 默认 -fno-common）"
  - "静态链接后产物可直接执行，不受 OHOS 动态产物 E544（缺 /lib/ld-musl-aarch64.so.1）约束"
  - "上游测试收敛在 cc/cpp/tests：make -C cc/cpp test 驱动 test1..test18 对 res1..res18，另有 res15C/res16C 两个 -C 变体，共 20 次比较；该 test 目标用 ';' 串联比较，失败也返回 0，必须自行判定通过率"
