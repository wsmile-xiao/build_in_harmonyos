# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 脚本 L0e 强制要求此文件存在）

package: pcc/1.2.0-devel-20220331
homepage: "https://github.com/IanHarvey/pcc"

# 上游测试命令。pcc 的顶层 Makefile 与 cc/Makefile 都没有 check/test 目标，
# 也没有 `make check`；可运行的测试套件位于 cc/cpp/tests，由 cc/cpp/Makefile.in
# 的 `test` 目标驱动（该规则的目标名就叫 test，上游并不存在 check 目标）。
upstream_check_command: "make -C cc/cpp test"

# conanfile.py 的 build() 中已集成上游测试：是。
# build() 在 make 之后调用 _run_upstream_tests()：先把上游 tests/ 语料复制到
# 构建树（上游规则用 `> tests/run<N>` 写结果，假定 in-tree 构建），再原样执行
# 上游 test 目标，最后重新做一次逐项比较判定 —— 因为上游规则用 ';' 串联比较，
# 即使不一致也返回 0，不能靠它的退出码。
upstream_test_in_build: true
upstream_test_command: "make -C cc/cpp test"

# 清点（真实核查依据：cc/cpp/Makefile.in 的 test 目标 for n in 1..18）：
#   - 编号用例 test1..test18，期望输出 res1..res18           → 18 次比较
#   - 其中 res15C / res16C 存在，test 目标会对同一输入再跑一次 -C（保留注释）→ 2 次比较
#   合计 20 次比较。
# 目录里另有 test19/test20/test21 三个输入，但无对应期望输出、上游也不遍历，不计入。
upstream_tests:
  - name: "cc/cpp tests 1-18"
    source: "cc/cpp/tests/test1 .. test18"
    description: "预处理器宏展开/条件编译/记号粘贴等 18 个回归用例，逐项与 res1..res18 比对"
  - name: "cc/cpp tests 15C, 16C"
    source: "cc/cpp/tests/test15, test16 (再以 -C 运行)"
    description: "res15C / res16C 存在，上游 test 目标对同一输入追加一次 -C（保留注释）运行并比对"

# 上游断言总数：18 + 2 = 20 次比较（以 cc/cpp/Makefile.in 的 test 目标为准）
upstream_assertion_count: 20

test_package_tests:
  harmonyos_end_to_end:
    runner: "test_pcc_cases.sh"
    cases_dir: "cases/"
    count: 4
    cases:
      - name: arith
        source: "cases/case_arith.c"
        description: "两个整型函数互相调用；驱动编译为 x86-64 汇编，真汇编器汇编，ld.lld 链接为真 x86-64 ELF 可执行文件"
      - name: loop
        source: "cases/case_loop.c"
        description: "循环累加 + 循环体内函数调用；同上端到端到 ELF"
      - name: ptr
        source: "cases/case_ptr.c"
        description: "指针形参 + 全局数组下标；同上端到端到 ELF"
      - name: struct
        source: "cases/case_struct.c"
        description: "结构体按值传参并读回字段；同上端到端到 ELF"
    chain: "打包的 amd64-linux-pcc -S → clang -target x86_64-linux-gnu -c → ld.lld -m elf_x86_64 → readelf 校验 ELF64/X86-64/EXEC"
    why_not_assertion: "只断言汇编文本含某些记号，无法证明生成代码可用；本测试让真汇编器与链接器做裁判，代码生成错误会在汇编或链接阶段失败"
  consumer:
    - file: main.c
      description: "自足消费者翻译单元（两个函数，其一在循环中调用另一个），不依赖目标平台 C 库头文件"
    - file: conanfile.py
      description: "用打包后的 amd64-linux-pcc 真实编译 main.c，并断言生成的汇编含 x86-64 目标代码"
      command: "conan test"

# 鸿蒙特有测试（端到端用例数，按用例计，不按断言计）：4
harmonyos_specific_tests: 4
# 用例内断言点（每例 4 项：pcc 成功 / 汇编非空 / 汇编器接受 / 链接并校验 ELF）
assertion_count: 16

