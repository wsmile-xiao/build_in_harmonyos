# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: popt/1.19
homepage: "https://github.com/rpm-software-management/popt"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/testit.sh
    source: popt-1.19/tests/testit.sh
    description: "popt 上游测试套件 (62x test1 + 3x test3 diff 用例)"
    command: "cd tests && make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_popt.c
    description: "消费者测试: 验证 popt 命令行解析 API (poptGetContext, poptGetNextOpt, poptStrerror, poptBadOption, poptFreeContext) + 断言解析结果"
    command: "./test_popt -v -i 42 -o out.txt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
