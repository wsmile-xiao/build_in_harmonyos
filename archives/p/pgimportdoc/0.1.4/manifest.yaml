software: pgimportdoc
build_system: makefile
# 版本级 manifest
# 文件位置: archives/p/pgimportdoc/0.1.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/okbob/pgimportdoc/archive/refs/tags/0.1.4.tar.gz"
  sha256: "35c011aa9b10f3afafb767d130783530e52b379838e0abb34f4250eb35efa56c"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # pgimportdoc 本体无 configure（PGXS 项目）；以下为构建时对 PostgreSQL 18.1 辅助源码的 configure 旗标
  configure_options: "--disable-rpath --without-icu --without-readline --without-zlib --without-openssl --without-libxml --without-libxslt --without-ldap --without-gssapi --without-pam --without-systemd --without-lz4 --without-zstd"
  dependencies:
    - "libpq/18.1"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PGXS-based PostgreSQL client tools don't have configure scripts; need to create a configure wrapper in conanfile build()"
  - "PGXS uses pg_config to determine build settings; need to build and install PostgreSQL from source for PGXS makefiles"
  - "PostgreSQL configure needs umask 000 and TMPDIR fix on HMDFS (same as libpq 0003 patch)"
  - "libpq/18.1 conan package provides libpq library and basic headers; full PostgreSQL source needed for frontend headers (postgres_fe.h, pg_get_opt.h, etc.)"
  - "pgimportdoc links against libpq, libpgport, and libpgcommon from PostgreSQL source tree"
