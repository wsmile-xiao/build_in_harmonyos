# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pgimportdoc/0.1.4
homepage: "https://github.com/okbob/pgimportdoc"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# pgimportdoc 的 make check 需要运行中的 PostgreSQL 服务器，在编译环境中不可用
upstream_tests:
  - file: pgimportdoc.c
    source: pgimportdoc-0.1.4.tar.gz/pgimportdoc.c
    description: "pgimportdoc tool source - requires running PostgreSQL server for make check"
    command: "./pgimportdoc --help"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "Smoke test: verify pgimportdoc --version works"
    command: "./test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
