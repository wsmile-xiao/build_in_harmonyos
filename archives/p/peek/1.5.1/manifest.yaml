software: peek
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/phw/peek/archive/refs/tags/1.5.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gtk3/3.24.38  # NOW AVAILABLE (pkg-config gtk+-3.0 = 3.24.38)
    - glib-2.0/2.88.0
    - gio-2.0/2.88.0
    - gmodule-2.0/2.88.0
    - cairo/1.18.2  # NOW AVAILABLE
    - pango/1.56.0
    - atk/2.38.0
    - gdk-pixbuf-2.0/2.42.10
    - epoxy/1.5.10
    - vala/0.56.18  # build-time dependency

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-disable-cmake-force-meson.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GTK3 (gtk+-3.0 3.24.38) NOW available on OpenHarmony"
  - "Cairo dev headers NOW available"
  - "Vala precompiled binary requires ELF signing (ohc-run.py sign-elf) and LD_LIBRARY_PATH setup to work on OpenHarmony"
  - "Vala precompiled package installs valac-0.56, needs symlink to valac for meson detection"
  - "Peek is fundamentally a GTK3 application"
  - "When project has both CMakeLists.txt and meson.build, ohc-run.py detects cmake first; rename CMakeLists.txt to force meson detection"
  - "OHOS SDK lld linker requires libxml2.so.16 in LD_LIBRARY_PATH; add /data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/lib"
