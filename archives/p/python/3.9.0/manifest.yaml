# Python 3.9.0 编译档案

software: python
version: 3.9.0
status: partial
build_system: autotools
compile_date: 2024-03-20

dependencies:
  required: []
  optional: [zlib, openssl, ncurses, readline, gdbm]

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --enable-optimizations
  cflags: "-fPIC -O2"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib

patches_applied:
  - file: patches/0001-configure-ac-harmonyos-support.patch
    purpose: 添加 HarmonyOS 平台检测和配置
    lines_changed: 200
  - file: patches/0002-Lib-sysconfig-py-platform-string-fix.patch
    purpose: 修复平台字符串包含空格的问题
    lines_changed: 10
  - file: patches/0003-subprocess-pipe-workaround.patch
    purpose: 使用管道语法绕过 SELinux 域转换限制
    lines_changed: 50

compatibility:
  level: medium
  issues:
    - 扩展模块需要特殊处理（musl BIND_NOW）
    - 部分 C 加速模块需要手动编译
    - PTY 功能不可用（系统限制）
  notes: |
    - 主程序正常工作
    - 60 个扩展模块中约 40 个可用
    - _ssl 模块需要手动链接 libssl
    - subprocess 需要使用管道语法
  syscalls:
    available: [pthread, dl, socket, mmap]
    missing: [openpty, forkpty]
    workaround: [subprocess_pipe]

test_results:
  type: official
  total: 425
  passed: 314
  failed: 80
  skipped: 25
  excluded: 6
  note: |
    核心功能正常，失败测试主要涉及：
    - PTY 相关（系统限制）
    - locale 相关（平台差异）
    - 部分 multiprocessing 测试
    - 6 个测试因卡住或崩溃被排除（详见 reports/TEST_REPORT.md）
  key_features:
    - 基本语法
    - 文件操作
    - 网络编程
    - 多线程
    - SSL/HTTPS（需要 OpenSSL）
  report: reports/TEST_REPORT.md

knowledge_gained:
  - "Python 使用 autotools 构建系统"
  - "musl BIND_NOW 要求扩展模块链接 libpython"
  - "HarmonyOS SELinux 域转换需要管道语法绕过"
  - "平台字符串可能包含空格需要处理"
  - "许多 C 加速模块需要 Py_BUILD_CORE_MODULE 宏"

references:
  - title: Python 官方网站
    url: https://www.python.org/
  - title: Python 3.9.0 下载
    url: https://www.python.org/ftp/python/3.9.0/Python-3.9.0.tgz

maintainer: OpenHarmony PC Developer社区
last_updated: "2026-03-25"
