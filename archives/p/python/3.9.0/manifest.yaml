software: python
version: 3.9.0
status: partial
build_system: autotools
compile_date: "2026-03-26"

dependencies:
  required: []
  optional: [zlib, openssl, ncurses, readline, gdbm]

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --disable-ipv6
    - ac_cv_file__dev_ptmx=no
    - ac_cv_file__dev_ptc=no
    - --with-openssl=$HOME/usr/local
  cflags: "-fPIC -O2"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib

