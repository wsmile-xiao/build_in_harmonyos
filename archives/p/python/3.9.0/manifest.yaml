knowledge_gained:
  - "Python 使用 autotools 构建系统"
  - "musl BIND_NOW 要求扩展模块链接 libpython"
  - "HarmonyOS SELinux 域转换需要管道语法绕过"
  - "平台字符串可能包含空格需要处理"
  - "许多 C 加速模块需要 Py_BUILD_CORE_MODULE 宏"
  - "HarmonyOS 内核不支持 fork()，subprocess 必须走 posix_spawn 路径"
  - "_use_posix_spawn() 对非 glibc 系统返回 False，需要为鸿蒙添加 musl 分支"
  - "pipe workaround (cmd | cat) 只解决 SELinux 域转换问题，不解决 fork 不可用问题"

