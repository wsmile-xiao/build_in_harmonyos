  total: 425
  passed: 314
  failed: 80
  skipped: 25
  excluded: 6
  note: |
    核心功能正常，失败测试主要涉及：
    - PTY 相关（系统限制）
    - locale 相关（平台差异）
    - 部分 multiprocessing 测试（fork 不可用）
