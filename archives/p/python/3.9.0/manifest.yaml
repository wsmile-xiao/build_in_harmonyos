compatibility:
  level: medium
  issues:
    - 扩展模块需要特殊处理（musl BIND_NOW，静态链接 libpython）
    - 部分 C 加速模块需要手动编译
    - PTY 功能不可用（系统限制）
    - 多进程部分测试受限（POSIX 信号量 sem_unlink、Unix domain socket bind 权限）
    - 终端交互受限（readline、openpty 权限）
    - locale 支持不完整
  notes: |
    - 主程序正常工作
    - 72 个扩展模块（.so）编译成功，73 个成功导入
    - _ssl 模块需要手动链接 libssl
    - subprocess 需要使用管道语法绕过 SELinux（_harmonyos_compat.py 已内置）
    - fork() 在 HarmonyOS 上可用（T0 测试验证），但默认使用 spawn 模式以提高兼容性
    - posix_spawn 路径已稳定，pip install 正常工作
  syscalls:
    available: [pthread, dl, socket, mmap, posix_spawn, fork]
    missing: [openpty, forkpty]
    workaround: [subprocess_pipe]
  upstream_contribution_plan:
    phase1_can_pr:
      - configure.ac 平台识别（新平台支持）
      - Lib/sysconfig.py 平台字符串
      - Lib/distutils/util.py 平台字符串
      - Lib/venv/__init__.py symlink 回退（需 errno 改进）
      - Include/pythread.h PY_HAVE_THREAD_NATIVE_ID（0012）
      - Lib/multiprocessing/context.py spawn 默认值（0013）
      - Lib/multiprocessing/util.py 抽象 socket（0014）
      - Lib/posixpath.py defpath（0015）
      - Modules/_posixsubprocess.c FD_DIR（0017）
      - Modules/timemodule.c musl 时区（0019）
      - Lib/subprocess.py _use_posix_spawn musl 分支（0016 部分）
      - Lib/subprocess.py shell 路径鸿蒙检测（0016 部分）
    phase2_needs_refactor:
      - setup.py SDK root（参考 macosx_sdk_root 模式）
      - Makefile.pre.in HARDLINK 检测（移入 configure）
      - configure CAN_RAW 检测（改为通用 autoconf 检测）
      - Lib/subprocess.py _python_fork_exec（考虑更优雅的 upstream 方案）
    downstream_only:
      - _harmonyos_compat.py（monkey-patch 侵入性太强）
      - site.py compat 导入（配套 downstream 修改）
      - _bootsubprocess.py pipe workaround（SELinux 特有）
      - Lib/subprocess.py OHOS pipe workaround（0016 部分，待评估是否可移除）
  missing_adaptations:
    # Phase 1 已修复项
    p0_critical:
      - id: P0-1
        file: "Include/pythread.h, Python/thread_pthread.h"
        issue: "threading.get_native_id() 不工作（__OHOS__ 未在 PY_HAVE_THREAD_NATIVE_ID 条件中）"
        fix: "添加 || defined(__OHOS__)"
        status: fixed
        patch: 0012
      - id: P0-2
        file: "Lib/multiprocessing/context.py"
        issue: "默认使用 fork 启动方式"
        fix: "改为 hasattr(os, 'fork') 动态检测，无 fork 时使用 spawn；ohos 平台默认 spawn"
        status: fixed
        patch: 0013
      - id: P0-3
        file: "Modules/_posixsubprocess.c, Lib/subprocess.py"
        issue: "/proc/self/fd 依赖，鸿蒙可能不挂载 /proc"
        fix: "C 层: __OHOS__ 定义 FD_DIR 为 /dev/fd；Python 层: _python_fork_exec fallback + /proc/self/fd 优先、brute-force 后备"
        status: fixed
        patch: "0017, 0016"
      - id: P0-4
        file: "Python/pylifecycle.c"
        issue: "fd 验证缺少 __OHOS__"
        fix: "添加 || defined(__OHOS__)"
        status: fixed
      - id: P0-5
        file: "Lib/subprocess.py"
        issue: "/bin/sh 硬编码路径"
        fix: "添加鸿蒙平台检测，使用 /system/bin/sh"
        status: fixed
        patch: 0016
    p1_recommended:
      - id: P1-1
        file: "Modules/timemodule.c"
        issue: "musl 时区处理条件缺少 __OHOS__"
        fix: "条件改为 (defined(__linux__) || defined(__OHOS__)) && !defined(__GLIBC__)"
        status: fixed
        patch: 0019
      - id: P1-2
        file: "Lib/shutil.py"
        issue: "sendfile 优化未覆盖鸿蒙"
        fix: "_USE_CP_SENDFILE 平台检测添加鸿蒙"
        status: fixed
      - id: P1-3
        file: "Modules/posixmodule.c"
        issue: "sendfile Linux 特定处理未覆盖鸿蒙"
        fix: "条件添加 __OHOS__"
        status: fixed
        patch: 0018
      - id: P1-4
        file: "Lib/multiprocessing/util.py"
        issue: "抽象 socket 支持检测未覆盖鸿蒙"
        fix: "平台检测添加 ohos/harmonyos"
        status: fixed
        patch: 0014
      - id: P1-5
        file: "Lib/multiprocessing/heap.py"
        issue: "共享内存路径 /dev/shm 可能不可用"
        fix: "平台检测添加鸿蒙"
        status: open
      - id: P1-6
        file: "Modules/posixmodule.c, Modules/signalmodule.c"
        issue: "pidfd_open/pidfd_send_signal 未覆盖鸿蒙"
        fix: "暂不处理，等鸿蒙内核支持后添加"
        status: deferred
      - id: P1-7
        file: "Modules/socketmodule.c"
        issue: "Linux 抽象 socket 命名空间"
        fix: "根据鸿蒙内核实际能力决定"
        status: open
      - id: P1-8
        file: "Lib/posixpath.py"
        issue: "defpath = '/bin:/usr/bin' 不适用鸿蒙"
        fix: "改为 '/system/bin:/bin:/usr/bin:/usr/local/bin'"
        status: fixed
        patch: 0015
      - id: P1-9
        file: "Lib/tempfile.py"
        issue: "硬编码临时目录路径"
        fix: "添加鸿蒙候选目录 /data/local/tmp"
        status: open
      - id: P1-10
        file: "configure"
        issue: "lchmod 检测应排除鸿蒙"
        fix: "MACHDEP != ohos 时跳过"
        status: open
      - id: P1-11
        file: "Lib/subprocess.py"
        issue: "_use_posix_spawn() 未覆盖鸿蒙 musl — pip 安装阻塞根因"
        fix: "非 glibc 系统返回 True（musl posix_spawn 实现质量良好）"
        status: fixed
        patch: "0016, 0020"
    # P2 项暂不展开，详见 reports/MISSING_ADAPTATION_SCAN.md
    # P2 共 8 项: ossaudiodev, mimetypes, uuid, pty, linux headers, getpass, libmpdec, asyncio unix_events

