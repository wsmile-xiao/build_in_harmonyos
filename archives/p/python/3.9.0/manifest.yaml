ctypes_status:
  last_checked: "2026-03-29"
  issue: "libffi ffi_closure_alloc → mmap(RWX) → 鸿蒙 W^X EINVAL"
  solution: "libffi 3.5.2 补丁修复 closure 分配，兼容鸿蒙 W^X 策略"
  result: "test_ctypes 0 ERROR 0 FAIL 95 skipped — 全部通过"
  backup_solution: |
    py_trampoline 备用方案：预编译 C trampoline 替代 ffi_closure，零 mmap(PROT_EXEC)。
    已实现并验证（63 ERROR → 46 ERROR + 1 FAIL），代码归档于 extras/py_trampoline/。
    可通过 setup.py 中 USE_PY_TRAMPOLINE=True 切换启用。
  reference: "archives/p/python/3.9.0/extras/py_trampoline/README.md"

knowledge_gained:
  - "Python 使用 autotools 构建系统"
  - "musl BIND_NOW 要求扩展模块链接 libpython"
  - "HarmonyOS SELinux 域转换需要管道语法绕过"
  - "平台字符串可能包含空格需要处理"
  - "许多 C 加速模块需要 Py_BUILD_CORE_MODULE 宏"
  - "fork() 在 HarmonyOS 上可用（T0 测试验证），但默认使用 spawn 模式以提高 seccomp 兼容性"
  - "musl 的 posix_spawn() 实现质量良好，正确报告 exec 错误，可作为 fork+exec 的替代路径"
  - "pipe workaround (cmd | cat) 解决 SELinux 域转换问题；后续通过 _use_posix_spawn() + _python_fork_exec 替代"
  - "鸿蒙 pipe 内核 bug 可通过临时文件替代管道方案绕过，但 posix_spawn 路径更稳定"
  - "鸿蒙 OpenDesk 运行时 fd 0/1/2 可能指向 socket，需要在子进程中重定向到 /dev/null"
  - "HMDFS 不支持 hardlink(2) 返回 EPERM，symlink(2) 返回 EACCES，compileall hardlink_dupes 需 fallback 到 shutil.copy2"
  - "compileall.py os.unlink+os.link 原子替换模式在 hardlink 不可用时会导致文件丢失（unlink 成功但 link 失败）"
  - "HMDFS 权限模型与标准 POSIX 不同：强制 group read 位、umask 下仍允许创建文件、忽略 chmod 权限位"
  - "HMDFS 三个硬性规律：other固定为0, group固定为6, owner保底rw-"
  - "importlib_metadata 8.6.1 的 entry_points() 返回 dict 格式，与 Python 3.9.0 测试代码期望的 list of tuples 不兼容"
  - "setuptools _distutils_hack、docutils、sphinx 等第三方包在启动时注入 warnings filter 和 meta path finder，干扰 bdb tracer 和 warnings 测试"
  - "HMDFS 忽略 os.chmod 设置的文件权限位，chmod 0o400 后文件仍可写（只读文件打开写模式不报错）"
  - "Hmmac MAC 策略阻止 adhoc_bin 域访问 /dev/ptmx（EACCES），导致 os.openpty() 失败"
  - "鸿蒙内核未实现/无权限的 syscall 发送 SIGSYS 而非返回 EPERM/ENOSYS（setreuid/setregid/chroot/clock_settime 等）"
  - "鸿蒙内核 poll() 对 /dev/null 不报告 POLLOUT 事件，对 pipe/regular file 行为正常（仅影响 mock 测试）"
  - "libffi 3.5.2 修复了 closure 分配的 W^X 兼容性问题，使 ctypes 在鸿蒙上完全可用"

