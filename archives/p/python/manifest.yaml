software: python
display: "Python"
description: "Python programming language interpreter"
category: foundation
homepage: "https://www.python.org/"
license: PSF-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Python 3.12 使用 PY_STDLIB_MOD 宏系统替代 setup.py"
    - "musl BIND_NOW 要求扩展模块链接 libpython"
    - "HMDFS 不支持 symlink/hardlink，需 cp 替代"
    - "config.status umask 077 问题需 sed 修复"
    - "HarmonyOS SELinux 域转换需要管道语法绕过"
    - "必须设置 PKG_CONFIG_PATH 指向 $HOME/usr/local/lib/pkgconfig"
    - "PKG_CONFIG_PATH 不设置时 configure 无法检测已安装的三方库"
  common_dependencies:
    - libffi
    - openssl
    - zlib
    - ncurses
    - readline

versions:
