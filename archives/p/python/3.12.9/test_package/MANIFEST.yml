package: python/3.12.9
homepage: "https://www.python.org/"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test TESTOPTS='--timeout 60 -j0'"
upstream_tests:
  - name: regrtest
    command: "make test"
    expected: "417 OK / 13 failed (platform limitations: SELinux, HMDFS, musl locale)"

test_package_tests:
  - file: test_python.py
    description: "Run built python3.12 and verify version 3.12.9 + key C extension module imports (ssl, hashlib, sqlite3, zlib, bz2, lzma, ctypes, readline)"
    command: "python3 test_python.py <package>/bin/python3.12 <package>"

assertion_count: 10
