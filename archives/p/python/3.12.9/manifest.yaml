knowledge_gained:
  - "Python 3.12 使用 PY_STDLIB_MOD 宏系统（105处）替代 setup.py 进行模块构建，configure.ac + Modules/Setup.stdlib.in 控制启用/禁用"
  - "3.12 源码树中 __OHOS__ 出现次数为 0，需从零开始适配"
  - "distutils 在 3.12 中完全移除，setuptools 成为唯一扩展模块编译方案"
  - "setup.py 的 SDK sysroot 搜索逻辑需迁移到 Modules/Setup.stdlib.in"
  - "_posixsubprocess.c 在 3.12 中仍作为 C 扩展存在（1251行），未内联到 subprocess.py"
  - "3.12 新增 C 扩展：_zoneinfo、_hacl/（HACL* 哈希库）、_uuid、_typing、_xxinterpchannels"
  - "venv 的 symlink_or_copy() 已有 try/except 回退，但 lib64 symlink 仍需适配"
  - "3.12 subprocess.py 新增 _use_posix_spawn() 和 _can_fork_exec 守卫，需重新适配"
  - "从 3.9.0 的 24 个补丁评估：5 可直接复用 / 7 需修改 / 6 不再需要 / 6 需重写，另新增 4 个 3.12 专属需求"
  - "musl BIND_NOW 扩展模块加载失败问题仍存在（E004），LDSHARED 传递机制在 3.12 中变化"
  - "HMDFS symlink 问题（E050）在 3.12 中 make install + pip install 阶段仍会出现"
  - "ctypes malloc_closure.c 的 RWX mmap 问题（E045）在 3.12 中仍存在，依赖 libffi ffi_closure_alloc"

risk_summary:
  high_risk:
    - id: R1
      description: "configure 平台识别失败（100% 会发生）"
      mitigation: "补丁 0001-0003"
    - id: R2
      description: "模块构建系统缺失 SDK sysroot（80% 概率）"
      mitigation: "补丁 0005 Setup.stdlib.in sysroot 搜索"
    - id: R3
      description: "musl BIND_NOW 扩展模块 ImportError（90% 概率）"
      mitigation: "LDSHARED 添加 -lpython"
    - id: R4
      description: "subprocess 模块不可用（80% 概率）"
      mitigation: "补丁 0013-0015 subprocess 适配"
    - id: R5
      description: "ctypes CFUNCTYPE MemoryError（70% 概率）"
      mitigation: "依赖 libffi 3.5.2 ffi_closure_alloc"
    - id: R6
      description: "HMDFS symlink 问题（90% 概率）"
      mitigation: "补丁 0021 cp -p 替代"
  medium_risk:
    - id: R7
      description: "MACHDEP 检测异常（含内核版本）"
    - id: R8
      description: "BUILDEXEEXT 误判为 .exe"
    - id: R9
      description: "cpu_count() 读取 /proc/self/stat 失败"
    - id: R10
      description: "timemodule musl 时区处理异常"
    - id: R11
      description: "CAN socket 编译失败"
    - id: R12
      description: "setuptools 不兼容"
    - id: R13
      description: "venv lib64 symlink 失败"
  low_risk:
    - "/tmp 只读（export TMPDIR 解决）"
    - "LLVM 工具链路径（沿用 3.9 环境）"
    - "pidfd/getrandom/memfd_create（条件编译自动排除）"
    - "abstract sockets（条件编译自动排除）"

