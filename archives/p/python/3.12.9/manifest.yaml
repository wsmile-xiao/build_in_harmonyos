# ============================================================
# 兼容性评估
# ============================================================
compatibility:
  level: high
  issues:
    - id: C1
      scope: SELinux/HMAC 安全策略
      impact: medium
      description: "socket(AF_UNIX) bind、mkfifo、部分 posix syscall 被 SELinux 阻止"
      workaround: "AF_UNIX→AF_INET 回退(0113); mkfifo skip(0119)"
      user_impact: "pytest-xdist worker 通信需用 TCP; named pipe 不可用"
    - id: C2
      scope: HMDFS 文件系统
      impact: low
      description: "不支持硬链接(os.link)和软链接(ln -s)的部分语义"
      workaround: "compileall hardlink→copy 回退(0022+0118); cp 替代 ln"
      user_impact: "compileall 去重降级为复制; install 用 cp 替代 symlink"
    - id: C3
      scope: posix_spawn vs fork+exec
      impact: medium
      description: "subprocess 默认使用 posix_spawn()，errpipe/vfork/PATH 查找行为与 fork+exec 不同"
      workaround: "测试层 skipIf(_USE_POSIX_SPAWN)(0116)"
      user_impact: "mock _fork_exec 的测试不适用; shell 内建命令(true)不可执行"
    - id: C4
      scope: 平台功能缺失
      impact: low
      description: "PTY/seccomp UDP-LITE/locale/fr_CA/de_DE 等未实现或不完整"
      workaround: "已正确 skip（60 个 platform skip）"
      user_impact: "pexpect/paramiko 等 PTY 库不可用; locale 敏感操作受限"
  notes: |
    119 个补丁覆盖 27 个源文件。111/114 模块可用（31 built-in + 76 shared + 1 n/a + 3 缺失）。
    0 导入失败。3 个缺失模块（_tkinter/nis/spwd）均为平台限制。
    剩余 4 个测试失败均为内核级安全策略限制，Python 层面无法进一步消减。

# ============================================================
# 本次编译知识沉淀（L3 — 仅与本版本相关）
# ============================================================
knowledge_gained:
  - "Python 3.12 PY_STDLIB_MOD 宏系统替代 setup.py（105处），configure.ac + Modules/Setup.stdlib.in 控制"
  - "distutils 完全移除，setuptools 成唯一扩展编译方案"
  - "_posixsubprocess.c 仍为 C 扩展（1251行），未内联到 subprocess.py"
  - "3.12 新增 _use_posix_spawn() 路径，鸿蒙上非 glibc 系统自动启用"
  - "musl BIND_NOW 扩展加载问题仍存在，LDSHARED 需传递 -lpython"
  - "HMDFS symlink/hardlink 限制贯穿编译/install/测试全流程"
  - "SELinux/HMAC 安全策略是最大障碍：socket bind/mkfifo/chown/scheduler/unshare 均受影响"
  - "make test 在鸿蒙上必须 MAKEFLAGS=-j1（FIFO 限制）；regrtest 默认多 worker 导致竞态"
  - "@unittest.skipIf 装饰器 reason 参数换行反转是 P0 级缩进错误根因（test_os/test_site）"
  - "posix_spawn 与 fork+exec 的行为差异影响：errpipe 机制不生效、shell 内建命令不可执行、PATH 查找不同"
  - "从 87.4%(test1) 到 99.1%(test9)：通过 P0→P1→P2 三轮递进修复实现"

