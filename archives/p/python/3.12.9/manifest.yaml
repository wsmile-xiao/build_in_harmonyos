status: packaged  # 417 OK / 13 failed, 74 shared+31 builtin, 117MB纯净包, _ssl+_hashlib+_sqlite3 enabled

build_modules: "111 checked (31 built-in, 70 shared, 1 n/a on ohos-aarch64, 1 disabled, 7 missing, 1 failed on import)"
missing_modules: [_curses_panel, _hashlib, _ssl, _tkinter, _uuid, nis, spwd]
disabled_modules: [_sqlite3]
failed_import: [_bz2]  # libbz2.so.1.0 runtime path
build_system: autotools (PY_STDLIB_MOD 宏系统)
compile_date: "2026-04-15"
build_variant: PY_STDLIB_MOD

platform:
  target: aarch64-unknown-linux-ohos
  kernel: HarmonyOS-HongMeng_Kernel_1.12.0-aarch64
  libc: musl
  compiler: Clang 15.0.4

dependencies:
  required: []
  optional: [libffi-3.5.2, openssl-3.0.16, zlib-1.3.1, ncurses-6.4, readline-8.2, gdbm-1.23, bzip2-1.0.8, lzma-5.6.2, gettext-0.26]
  optional_not_installed: [sqlite3, libuuid]
  notes: |
    openssl 已安装但 configure 未检测到（需 PKG_CONFIG_PATH 或 --with-openssl）。
    sqlite3 需 >= 3.7.15，推荐 3.46.x（最新稳定版，amalgamation 方式编译）。
    libuuid 来自 util-linux，鸿蒙上无 pkg-config 文件，需手动编译。

build_config:
  configure_options:
    - --prefix=$HOME/usr/local
    - --enable-shared
    - --with-openssl=$HOME/usr/local
  cflags: "-fPIC -O2"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib
    PKG_CONFIG_PATH: "$HOME/usr/local/lib/pkgconfig"
    PYTHONDONTWRITEBYTECODE: "1"
  env_critical: |
    ⚠️ PKG_CONFIG_PATH 必须设置！否则 configure 无法通过 pkg-config 检测已安装的三方库：
    - OpenSSL（_ssl, _hashlib）→ pkg-config 找 openssl/libssl/libcrypto
    - libffi（_ctypes）→ pkg-config 找 libffi
    - liblzma（_lzma）→ pkg-config 找 liblzma
    - zlib（zlib）→ pkg-config 找 zlib
    不设置时，configure 在标准路径 /usr/local /usr 中搜索，找不到 $HOME/usr/local 下的库。
    对于 OpenSSL，还可显式传 --with-openssl=$HOME/usr/local。
  notes: |
    Python 3.12 使用 PY_STDLIB_MOD 宏系统（105处）替代 setup.py。
    Kernel 1.12.0 新增 /proc/self/fd、vfork、完整 mmap、IPv6、posix_spawn 等能力。
    相比 Kernel 1.11.0 减少了 12 个补丁（-14→恢复3→净减少9个）。
    config.status 需 umask workaround（HMDFS 限制）。
    CAN_RAW_FD_FRAMES/CAN_RAW_JOIN_FILTERS 需 CFLAGS 定义（OHOS SDK 双 sysroot 问题）。
    TEST_MODULES=no 可跳过 test/ 目录安装（减小包体积约 150MB）。
    PYTHONDONTWRITEBYTECODE=1 防止安装时生成 .pyc（减小约 17MB）。

sqlite3_build_guide: |
  # SQLite3 编译（Python 要求 >= 3.7.15，推荐最新稳定版）
  # 下载 amalgamation: https://sqlite.org/download.html
  # 当前最新: 3.46.1 (2024-08-13)
  
  tar xzf sqlite-amalgamation-3460100.tar.gz
  cd sqlite-amalgamation-3460100
  
  # 方式1: 直接编译为共享库（推荐，最简单）
  export CC=clang AR=llvm-ar RANLIB=llvm-ranlib
  clang -fPIC -O2 -DSQLITE_ENABLE_COLUMN_METADATA \
    -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_RTREE \
    -DSQLITE_ENABLE_SESSION \
    -c sqlite3.c -o sqlite3.o
  clang -shared -o libsqlite3.so sqlite3.o -lpthread -ldl
  cp libsqlite3.so* $HOME/usr/local/lib/
  cp sqlite3.h $HOME/usr/local/include/
  
  # 生成 pkg-config 文件
  cat > $HOME/usr/local/lib/pkgconfig/sqlite3.pc << 'EOF'
  prefix=$HOME/usr/local
  exec_prefix=${prefix}
  libdir=${exec_prefix}/lib
  includedir=${prefix}/include
  Name: SQLite3
  Description: SQLite is a software library that implements a self-contained, serverless, zero-configuration, transactional SQL database engine.
  Version: 3.46.1
  Libs: -L${libdir} -lsqlite3
  Libs.private: -lpthread -ldl
  Cflags: -I${includedir}
  EOF

