# Python 3.12.9 鸿蒙适配 — 编译档案
# 状态: test_verified (99.1% 通过率) | 最后更新: 2026-04-02

software: python
version: 3.12.9
status: test_verified  # 9轮测试完成，426 OK / 4 failed (99.1%)

build_modules: "111 checked (31 built-in, 76 shared, 1 n/a on ohos-aarch64, 0 disabled, 3 missing, 0 failed on import)"
missing_modules: [_tkinter, nis, spwd]  # 平台限制，非编译错误
build_system: autotools (PY_STDLIB_MOD 宏系统)
compile_date: "2026-03-27"
build_variant: PY_STDLIB_MOD

platform:
  target: aarch64-unknown-linux-ohos
  kernel: HarmonyOS-HongMeng_Kernel_1.11.0-aarch64
  libc: musl
  compiler: Clang 15.0.4

dependencies:
  required: []
  optional: [openssl-1.1.1w, libffi-3.5.2, zlib-1.3.1, ncurses-6.4, readline-8.2, gdbm-1.23, bzip2-1.0.8, lzma-5.6.2]

build_config:
  configure_options:
    - --prefix=$HOME/usr/local
    - --enable-shared
    - --disable-ipv6
  cflags: "-fPIC -O2"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib
  notes: |
    Python 3.12 使用 PY_STDLIB_MOD 宏系统（105处）替代 setup.py。
    distutils 已完全移除。subprocess 默认使用 posix_spawn()。

