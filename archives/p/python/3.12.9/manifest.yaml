# ============================================================
# 兼容性评估
# ============================================================
compatibility:
  level: high
  issues:
    - id: C1
      scope: SELinux/HMAC 安全策略
      impact: medium
      description: "socket(AF_UNIX) bind、mkfifo、部分 posix syscall 被 SELinux 阻止"
      workaround: "AF_UNIX→AF_INET 回退(0113); mkfifo skip(0119)"
    - id: C2
      scope: HMDFS 文件系统
      impact: low
      description: "不支持硬链接(os.link)和软链接的部分语义"
      workaround: "compileall hardlink→copy 回退(0022+0118); cp 替代 ln"
    - id: C3
      scope: posix_spawn vs fork+exec
      impact: low
      description: "subprocess 默认使用 posix_spawn()，errpipe 行为与 fork+exec 不同"
      workaround: "测试层 skipIf(_USE_POSIX_SPAWN)(0116)"
    - id: C4
      scope: OHOS SDK 双 sysroot
      impact: low
      description: "CAN_RAW_FD_FRAMES 等宏在 native/sysroot 有但 llvm/sysroot 没有"
      workaround: "CFLAGS 添加 -DCAN_RAW_FD_FRAMES=5 -DCAN_RAW_JOIN_FILTERS=6"
    - id: C5
      scope: config.status umask
      impact: low
      description: "HMDFS 上 umask 077 + mktemp -d 创建不可写目录"
      workaround: "sed 移除 umask 077"

# ============================================================
# 构建步骤（可复现）
# ============================================================
build_steps: |
  # 1. 解压 + 打补丁
  tar -xzf Python-3.12.9.tgz --strip-components=1
  for f in patches/*.patch; do patch -p1 --fuzz=5 < "$f"; done

  # 2. Configure（⚠️ PKG_CONFIG_PATH 必须设置）
  export TMPDIR=$HOME/tmp
  export CC=clang AR=llvm-ar RANLIB=llvm-ranlib CFLAGS="-fPIC -O2"
  export PKG_CONFIG_PATH=$HOME/usr/local/lib/pkgconfig
  export PYTHONDONTWRITEBYTECODE=1
  ./configure --prefix=$HOME/usr/local --enable-shared \
    --with-openssl=$HOME/usr/local \
    CPPFLAGS="-I$HOME/usr/local/include" \
    LDFLAGS="-L$HOME/usr/local/lib"

  # 3. Fix config.status umask (HMDFS)
  sed -i 's|umask 077 && mktemp -d|mktemp -d|g' config.status
  sed -i 's|(umask 077 && mkdir "$tmp")|(mkdir "$tmp")|g' config.status
  sh config.status

  # 4. Make
  make -j1

  # 5. Install（TEST_MODULES=no 跳过 test/ 目录，减小约 150MB）
  make install DESTDIR=<install_dir> TEST_MODULES=no

  # 6. Test
  export LD_LIBRARY_PATH=<install_dir>/lib:.
  python3.12 -m test --timeout 60 -j0

