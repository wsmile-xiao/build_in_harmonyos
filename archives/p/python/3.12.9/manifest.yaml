# Python 3.12.9 编译档案
# 生成日期: 2026-03-30
# 状态: partial — 仅完成 Phase 2 补丁开发，尚未编译验证

software: python
version: 3.12.9
status: test_verified  # 5轮测试完成，97.5% 通过率，P0 已修复
build_modules: "111 checked (31 built-in, 76 shared, 1 n/a, 0 disabled, 3 missing, 0 failed on import)"
missing_modules: [_tkinter, nis, spwd]
build_system: autotools
compile_date: "2026-03-27"
build_variant: PY_STDLIB_MOD

dependencies:
  required: []
  optional: [zlib, openssl, ncurses, readline, gdbm, libffi]

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
  cflags: "-fPIC -O2"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib
  notes: |
    Python 3.12 使用 PY_STDLIB_MOD 宏系统（105处使用）替代 setup.py 进行扩展模块构建。
    模块构建由 configure.ac + Modules/Setup.stdlib.in 机制控制。
    与 3.9 的关键差异：distutils 已完全移除，setuptools 成为主方案。

patches_applied:
  # Phase 2A: 平台检测层 (3)
  - file: patches/0001-config.guess-HarmonyOS-support.patch
    purpose: config.guess 添加 HarmonyOS 平台检测（aarch64-unknown-linux-ohos）
  - file: patches/0002-config.sub-HarmonyOS-support.patch
    purpose: config.sub 添加 ohos 操作系统支持和 linux-ohos 验证
  - file: patches/0003-configure.ac-HarmonyOS-support.patch
    purpose: |
      configure.ac 全面 HarmonyOS 支持（20+ 处修改）：
      host case 新增 *-*-ohos*、MACHDEP 映射、_PYTHON_HOST_PLATFORM、
      LDSHARED/LDLIBRARY/LINKFORSHARED、XOPEN_SOURCE 控制、
      PY_STDLIB_MOD_SET_NA 平台模块禁用、CAN_RAW 检测跳过

  # Phase 2B: 构建系统层 (2)
  - file: patches/0004-Makefile.pre.in-HarmonyOS-ln-fix.patch
    purpose: Makefile 链接规则修复（HARDLINK 检测、LN_FORCE 替换 ln -s）
  - file: patches/0005-Modules-Setup.stdlib.in-HarmonyOS-sysroot.patch
    purpose: Modules/Setup.stdlib.in 添加 SDK sysroot 搜索路径（替代 3.9 的 setup.py）

  # Phase 2C: C 扩展模块层 (5)
  - file: patches/0006-Include-pythread.h-OHOS-native-thread-id.patch
    purpose: PY_HAVE_THREAD_NATIVE_ID 条件添加 __OHOS__
  - file: patches/0007-Python-thread_pthread.h-OHOS-native-thread-id.patch
    purpose: PyThread_get_thread_native_id() 添加 __OHOS__ gettid() 分支
  - file: patches/0008-Modules-_posixsubprocess.c-OHOS-fd-dir.patch
    purpose: _posixsubprocess.c FD_DIR 改为 /dev/fd（鸿蒙无 /proc）
  - file: patches/0009-Modules-timemodule.c-OHOS-musl-timezone.patch
    purpose: timemodule.c musl 时区处理条件添加 __OHOS__（3处修改）
  - file: patches/0010-Modules-posixmodule.c-OHOS-cpu_count.patch
    purpose: posixmodule.c cpu_count 添加 __OHOS__ 回退到 sysconf

  # Phase 2D: Lib/ 标准库层 (8)
  - file: patches/0011-Lib-sysconfig.py-HarmonyOS-platform.patch
    purpose: sysconfig.py get_platform() 添加鸿蒙平台字符串
  - file: patches/0012-Lib-posixpath.py-OHOS-default-path.patch
    purpose: posixpath.py defpath 添加鸿蒙路径 /system/bin
  - file: patches/0013-Lib-subprocess.py-HarmonyOS-posix-spawn.patch
    purpose: |
      subprocess.py 鸿蒙适配：
      (1) _use_posix_spawn() 非 glibc 系统返回 True
      (2) HarmonyOS 平台检测
      (3) shell 路径 /system/bin/sh
  - file: patches/0014-Lib-_harmonyos_compat.py-HarmonyOS-subprocess-compat.patch
    purpose: 新建 _harmonyos_compat.py 兼容层模块（monkey-patch 子进程）
  - file: patches/0015-Lib-site.py-HarmonyOS-compat-layer.patch
    purpose: site.py 自动加载 _harmonyos_compat 兼容层
  - file: patches/0016-Lib-multiprocessing-context.py-OHOS-spawn-default.patch
    purpose: multiprocessing 默认 spawn 启动方式（鸿蒙平台）
  - file: patches/0017-Lib-multiprocessing-util.py-OHOS-abstract-sockets.patch
    purpose: multiprocessing 抽象 socket 检测添加鸿蒙平台
  - file: patches/0018-Lib-venv-__init__.py-HarmonyOS-symlink-fix.patch
    purpose: venv lib64 symlink 添加 try/except 回退

  # Phase 2F: 补充遗漏修复 (3)
  - file: patches/0019-Modules-posixmodule.c-OHOS-fallocate.patch
    purpose: posixmodule.c fallocate/sendfile 条件添加 __OHOS__
  - file: patches/0020-missing-scan-fixups-HarmonyOS.patch
    purpose: 多文件遗漏修复（ pylifecycle fd 验证、uuid.py 等）
  - file: patches/0021-Makefile.pre.in-HarmonyOS-hmdfs-symlink.patch
    purpose: Makefile HMDFS symlink 处理（cp -p 替代 ln -s）

  # Phase 3: 编译验证修复
  - file: patches/0022-Lib-compileall.py-OHOS-hmdfs-hardlink.patch
    purpose: compileall.py hardlink 回退（3.9.25 实战经验）
  - file: patches/0023-Lib-ctypes-util.py-OHOS-ldconfig.patch
    purpose: ctypes.util ldconfig 守卫（3.9.25 实战经验）
  - file: patches/0024-configure.ac-fix-uuid-h-detection.patch
    purpose: |
      修复 _uuidmodule.c 编译失败：pkg-config 找到 libuuid 后无条件定义 HAVE_UUID_H，
      但 HarmonyOS 只有 uuid/uuid.h 没有 uuid.h。改为 AC_CHECK_HEADERS 条件检查。
  - file: patches/0025-Makefile.pre.in-HarmonyOS-sharedmods-cp.patch
    purpose: |
      sharedmods 目标用 cp -p 替代 symlink（HMDFS 不支持 symlink）。
      路径从 ../../$$mod 改为 $$mod（cp 和 ln -sf 路径解析方式不同）。
  - file: patches/0026-Modules-Setup.stdlib.in-fix-harmonyos-var-parsing.patch
    purpose: |
      移除 Setup.stdlib.in 中 HARMONYOS_* 变量定义（被 makesetup 误解析为模块）。
      移除模块行中的 $(HARMONYOS_SDK_*) 引用，改用 CFLAGS/LDFLAGS。

  # Phase 3.5: 测试修复 — P0 缩进错误 (2)
  - file: patches/0111-Fix-test_os.py-OHOS-indentation-errors.patch
    purpose: |
      test_os.py P0 修复：6处 @unittest.skipIf 装饰器 reason 参数换行被反转到装饰器声明之前，
      导致 IndentationError。涉及 TestInvalidHardlink、TestGetRandom、TestSendfile 等测试类。
  - file: patches/0112-Fix-test_site.py-OHOS-indentation-errors.patch
    purpose: |
      test_site.py P0 修复：4处 @unittest.skipIf 装饰器 reason 参数换行被反转到装饰器声明之前，
      导致 IndentationError。涉及 SiteImport、PthFile、HelperStuffTests 等测试类。

  # Phase 3.5: 测试修复 — P1 平台限制适配 (3)
  - file: patches/0113-Fix-multiprocessing-connection-AF_UNIX-fallback-to-AF_INET-OHOS.patch
    purpose: |
      multiprocessing.connection.py SocketListener AF_UNIX bind EPERM 时自动回退 AF_INET。
      解决 test_socket(UDS)、test_asyncio.unix_events、test_concurrent_futures.process_pool
      三大模块失败，同时修复 pytest-xdist 等三方库在鸿蒙上的通信问题。
  - file: patches/0114-Fix-test_time-monotonic_settime-SIGSYS-skip-OHOS.patch
    purpose: |
      test_time.py test_monotonic_settime 添加 OHOS skip（clock_settime 触发 SIGSYS 崩溃）。
      此前 test_clock_settime 已有 skip，test_monotonic_settime 是遗漏项。
  - file: patches/0115-Fix-test_posix-SELinux-seccomp-skips-OHOS.patch
    purpose: |
      test_posix.py 为被 SELinux/seccomp 阻断的 syscall 添加 OHOS skip：
      getgroups、getgrouplist（SELinux）、sched_setscheduler/setparam（seccomp）、
      unshare/setns（seccomp）、readlink_dir_fd（HMDFS）。共 5 处新增 skip。

compatibility:
