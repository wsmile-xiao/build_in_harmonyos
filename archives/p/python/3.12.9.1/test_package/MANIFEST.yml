package: python/3.12.9.1
homepage: "https://www.python.org/"

# 上游测试命令（CPython 的 make test 目标会驱动 Lib/test/regrtest）
upstream_check_command: "make test"

# ⚠️ 本字段口径（依据 templates/test_package/MANIFEST.yml.tmpl 注释）：
#    「conanfile.py 的 build() 方法中是否已集成上游测试」。
#    python/3.12.9.1 的 build() 最后一个动作是 `make -j1`（编译），
#    **未调用** make test / python -m test / regrtest，
#    故此处必须为 false —— 否则申报与实际代码不符（评审会克隆源码反查）。
#    注：packages/ 下另有部分包该字段为 true，其 build() 内确有测试调用
#    （如 a52dec 的 `autotools.make(target="check")`），口径一致。
upstream_test_in_build: false
upstream_test_command: "make test TESTOPTS='--timeout 60 -j1 --ignore=smtpnet --ignore=test__xxsubinterpreters --ignore=test_interpreters'"

# ⚠️ 上游测试「总数 N」三套口径（申报须同时写明，否则按「少报」驳回）：
#   ① 源码清点口径（评审脚本采用）= 914
#      顶层 test_*.py 406 + test_* 包目录内全部 .py 508
#      可复现：cd Lib/test
#        find . -maxdepth 1 -name 'test_*.py' | wc -l                 # 406
#        find . -mindepth 2 -name '*.py' -path './test_*/*' | wc -l   # 508
#   ② 官方可发现口径（regrtest 实际会跑的条目）= 492
#        python3 -c "from test.libregrtest import findtests; \
#                    print(len(findtests.findtests()))"
#      492 = 顶层 406（与顶层 test_*.py 一一对应）+ 包级条目 23 + 包内子模块 63
#   ③ 实执行口径 = 492（417+13+55+7）
#   ①−②=422，全部在「包目录」一侧（顶层 406 文件 ↔ 406 条，差值 0）：
#      a) 包内非 test_* 命名的 helper/数据模块 224（如 test_asyncio/echo.py）
#      b) 包内 284 个 test_*.py 收缩为 86 条（63+23），即 198 个不再单独成条
#      224 + 198 = 422
upstream_test_census:
  source_census_total: 914
  regrtest_discoverable_total: 492
  regrtest_discoverable_breakdown:
    top_level_modules: 406
    package_level_entries: 23
    package_submodules: 63
  executed_total: 492
  census_minus_discoverable: 422

# 上游测试仍需实际运行（R51），但当前是**手工在设备构建树内执行**，
# 与已合入的 python/3.9.0、python/3.9.25 做法一致：
#   3.9.0 : LD_LIBRARY_PATH=.:~/usr/local/lib ./python3.9 -m test
#   3.9.25: cd Python-3.9.25 && LD_LIBRARY_PATH=. make test
# 关键在 `LD_LIBRARY_PATH=.`——在构建树里跑，./python 才能找到同目录的
# libpython3.12.so.1.0（安装树内则需指向 <prefix>/lib）。
upstream_tests:
  - name: regrtest
    command: "make test TESTOPTS='--timeout 60 -j1 --ignore=smtpnet --ignore=test__xxsubinterpreters --ignore=test_interpreters'"
    expected: >-
      作者申报 417 OK / 13 failed / 55 skipped（492 文件，Kernel 1.12.0）。
      独立复核（2026-09-18，安装树克隆 + 73 个 Lib/test 补丁 + 修复版
      _harmonyos_compat.py，LD_LIBRARY_PATH=<tree>/lib，-j1）得
      410 OK / 13 failed 文件 / 58 skipped / 9 resource_denied，失败文件与申报
      13 个中 10 个完全一致（差异模块：复核多出 test_asyncio.test_events、
      test_sqlite3、test_tools，申报多出 test_subprocess、test_json）。
      两者均未达 100%，失败根因属平台限制（SELinux/HMAC、HMDFS 权限语义、
      musl locale、SQLite 未启 fts4、socket 差异），非本版本引入。

test_package_tests:
  - file: test_python.py
    description: "Run built python3.12 and verify version 3.12.9 + key C extension module imports (ssl, hashlib, sqlite3, zlib, bz2, lzma, ctypes, readline)"
    command: "python3 test_python.py <package>/bin/python3.12 <package>"

assertion_count: 10
