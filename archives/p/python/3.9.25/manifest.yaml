# === 3.9.25 编译记录 ===
build_notes:
  core_build: |
    核心编译（make python3.9）正常完成，生成 python3.9 和 libpython3.9.so。
    无需任何额外介入。
  extension_modules: |
    扩展模块编译（make sharedmods / setup.py build）受 SELinux 限制：
    python3.9（adhoc_bin 域）无法 fork/exec SDK 二进制（clang 等），
    所有子进程创建方式（fork+exec, posix_spawn, os.system）均返回 exit 1。
    需要使用补丁 0027 的 HARMONYOS_BUILD_SCRIPT 方案：
    1) setup.py build 将命令写入脚本文件（不执行）
    2) 从 shell 直接执行脚本文件
    成果：72 个 .so 文件全部编译成功，48/48 扩展模块加载成功。
  selinux_context: |
    - python3.9 进程运行在 adhoc_bin SELinux 域
    - shell 运行在 hishell_hap 域
    - adhoc_bin → hnp_file (clang) 的 exec 被 SELinux 策略阻止
    - hishell_hap → hnp_file (clang) 的 exec 正常
    - 知识库声称 posix_spawn 可绕过，但实测同样失败
    - 知识库声称 pipe workaround (cmd | cat) 可绕过，但实测同样失败

# === 与 3.9.0 补丁差异 ===
