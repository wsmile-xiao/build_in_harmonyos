# Python 3.9.25 编译档案
# 基于 3.9.0 补丁集升级，适配 3.9.0→3.9.25 源码差异
# 初始生成: 2026-03-28
# 三目录法重新生成: 2026-03-30 (diff clean vs patched)

software: python
version: 3.9.25
status: tested
build_system: autotools
compile_date: "2026-03-28"
base_version: "3.9.0"

dependencies:
  required: []
  optional: [zlib, openssl, ncurses, readline, gdbm]

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --disable-ipv6
    - --enable-shared
    - ac_cv_file__dev_ptmx=no
    - ac_cv_file__dev_ptc=no
  important_notes:
    - "不能使用 --enable-optimizations（PGO 在 HarmonyOS 上不工作）"
    - "必须 make clean 后重新 make（增量编译会丢失链接步骤）"
    - "configure 后需检查 HAVE_LIBUUID 在 pyconfig.h 中存在"

# === 补丁信息 ===
patches_applied: 104
patch_generation:
  method: "三目录 diff 法"
  dir_a: "Python-3.9.25-clean（tgz 解压）"
  dir_b: "Python-3.9.25-full-patch（手动修改+编译验证）"
  dir_c: "archives/p/python/3.9.25/patches（diff -ruN 生成）"
  date: "2026-03-30"
  verified: true  # 104/104 patch -p1 验证通过

patches_structure:
  total: 104
  by_category:
    core_source: 14  # configure.ac, Makefile.pre.in, setup.py, config.guess/config.sub, C source
