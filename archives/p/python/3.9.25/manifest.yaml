# === 编译记录 ===
build_notes:
  core_build: |
    核心编译（make python3.9）正常完成，生成 python3.9 和 libpython3.9.so。
    无需任何额外介入。
  extension_modules: |
    扩展模块编译：72 个 .so 全部成功。
    关键补丁：0027（旧编号，现为 0006）的 HARMONYOS_BUILD_SCRIPT 方案。
  important_warnings:
    - "HMDFS 不支持 symlink（ln -s 产生随机后缀文件，非真正符号链接）"
    - "patch -p1 命令在 HMDFS 上有 fstat 问题，补丁应用后 exit code 不可靠"
    - "必须从 tgz 全新解压后打补丁，不能在已有编译产物的目录上操作"
    - "make clean 后才能正确重新编译（增量编译可能丢失 .so 链接步骤）"

