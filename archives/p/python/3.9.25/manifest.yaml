    purpose: |
      ★ 3.9.25 新增补丁 ★
      distutils/spawn.py SELinux bypass：
      当设置 HARMONYOS_BUILD_SCRIPT 环境变量时，spawn() 不执行命令，
      而是将命令写入脚本文件。构建脚本随后从 shell（hishell_hap 域）执行。
      根因：当前 SELinux 策略下 python3.9（adhoc_bin 域）无法 fork/exec 任何二进制，
      包括 posix_spawn、os.system() 等所有子进程创建方式均被阻止。
    source: "3.9.25 新增（3.9.0 无此补丁）"
    category: runtime
    note: "这是编译扩展模块的关键补丁。没有它，setup.py build 阶段所有 .so 链接会静默失败"

