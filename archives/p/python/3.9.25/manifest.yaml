compile_date: "2026-03-28"
base_version: "3.9.0"

dependencies:
  required: []
  optional: [zlib, openssl, ncurses, readline, gdbm]

build_config:
  target: aarch64-unknown-linux-ohos
  configure_options:
    - --prefix=$HOME/usr/local
    - --disable-ipv6
    - --enable-shared
    - ac_cv_file__dev_ptmx=no
    - ac_cv_file__dev_ptc=no
  cflags: "-fPIC -O2"
  cppflags: "-I$HOME/usr/local/include"
  ldflags: "-L$HOME/usr/local/lib"
  env:
    CC: clang
    AR: llvm-ar
    RANLIB: llvm-ranlib

patches_applied: 39

