software: perl-digest-sha3
version: "1.01"
status: built
build_date: "2026-06-10"

source:
  url: "https://cpan.metacpan.org/authors/id/M/MS/MSHELOR/Digest-SHA3-1.01.tar.gz"
  tar_format: tar.gz

build_system: perl_xs
build:
  system: perl_xs
  configure_options:
    - "CCFLAGS=-D_GNU_SOURCE -I/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/include"
    - "LDDLFLAGS=-nostartfiles -nodefaultlibs -L/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/lib/aarch64-linux-ohos"
  dependencies:
    - perl/5.42.0
  cc: clang

knowledge_gained:
  - "L2: Perl XS模块需要OHOS SDK头文件路径"
  - "L2: CRT文件缺失需要-nostartfiles -nodefaultlibs"
  - "L2: SELinux HMDFS限制阻塞功能验证"
  - "L3: 功能未验证，需管理员安装确认"

functional_test:
  verification_status: "pending"
  guarantee_level: "compile_only"
  unverified_risks:
    - "SHA-3算法输出正确性未验证"
    - "所有API函数可用性未确认"
    - "运行时链接库依赖未验证"
  conclusion: "编译成功，功能未验证，不承诺可用"
  warning: "⚠️ 需管理员安装后验证SHA-3功能"