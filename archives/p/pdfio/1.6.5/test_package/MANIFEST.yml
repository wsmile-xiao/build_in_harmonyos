test_package_tests:
  - name: "test_pdfio 公共 API 链接验证"
    description: "调用 pdfio 公共 API 覆盖上游 testpdfio.c do_unit_tests() 核心测试项：pdfioFileCreate 创建 PDF、pdfioDictCreate + pdfioDictSetBoolean/Name/Number/String + pdfioDictIterateKeys 字典操作、pdfioFileSetPermissions RC4-128 权限设置、pdfioFileClose 关闭、pdfioFileOpen 打开已创建 PDF、PDFIO_VERSION/PDFIO_VERSION_MAJOR/MINOR 宏校验"
    assertion_count: 12
upstream_test_source: "https://github.com/michaelrsweet/pdfio/blob/v1.6.5/testpdfio.c"
upstream_test_coverage:
  covered:
    - "pdfioFileCreate（上游 testBegin \"pdfioFileCreate(...)\"）"
    - "pdfioDictCreate（上游 testBegin \"pdfioDictCreate\"）"
    - "pdfioDictSetBoolean/Name/Number/String（上游 testBegin \"pdfioDictSet*\"）"
    - "pdfioDictIterateKeys（上游 testBegin \"pdfioDictIterateKeys\" + iterate_cb）"
    - "pdfioFileSetPermissions RC4-128（上游 testBegin \"pdfioFileSetPermissions(...)\"）"
    - "pdfioFileClose（上游 testBegin \"pdfioFileClose\"）"
    - "pdfioFileOpen（上游 testBegin \"pdfioFileOpen(...)\"）"
    - "PDFIO_VERSION/PDFIO_VERSION_MAJOR/MINOR 宏校验"
  not_covered:
    - "_pdfioCrypto* AES/MD5/RC4/SHA-256 加密测试（私有 API pdfio-private.h，test_package 无法访问）"
    - "_pdfioValueRead 复杂字典/CID 字体值解析（私有 API）"
    - "write_unit_file/write_alpha_test/write_color_test 等 PDF 写入测试（依赖 testfiles/ 目录的字体、图片、ICC 配置等 20+ 测试用例数据，不在 pdfio 包安装树内）"
    - "testttf TrueType 字体测试（依赖 testfiles/ 目录字体文件）"
