software: perl-net-openssh
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.84-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.84-r1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SA/SALVA/Net-OpenSSH-0.84.tar.gz"

  # 源码校验和
  sha256: "8780e62f01b1cf0db43c9cb705c94ff4949b032233be4be91fc91abc791539f8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块在HMDFS上可直接通过PERL5LIB加载，无SELinux限制（与XS模块不同）"
  - "conan-init默认生成autotools/CMake模板，Perl模块需手动改写conanfile.py为Makefile.PL构建"
  - "test_package需从C/C++模板改写为Perl测试脚本，使用perl -M<Module>命令"
  - "HMDFS文件系统chmod不生效(E046)，ctl_dir安全检查失败，需strict_mode=>0绕过"
  - "Net::OpenSSH通过shell调用ssh命令，需要系统安装openssh-client(/usr/bin/ssh)"
  - "package()方法使用glob匹配.pm文件复制到lib/perl5/，需正确处理site_perl版本路径"
