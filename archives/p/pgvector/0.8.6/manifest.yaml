version: "0.8.6"
software: "pgvector"
status: built
build_date: "2026-09-21"
build_system: pgxs

source:
  url: "https://github.com/pgvector/pgvector/archive/refs/tags/v0.8.6.tar.gz"
  sha256: "10bf9938906e5d643bbc4a7eea104b6f57ba4898e5b76b20e60484ea1d5a7f8f"
  tar_format: tar.gz

build:
  system: pgxs
  configure_options:
    - "PG_CONFIG=<postgresql/18.3 package>/bin/pg_config"
    - "OPTFLAGS="
    - "enable_rpath="
  dependencies:
    - postgresql/18.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PG 扩展的 PGXS 构建只需 postgresql 制品包：pg_config + lib/postgresql/pgxs + include/postgresql/server 齐全，无需 vendored PG 源码树"
  - "PG 18 起可用 extension_control_path 指向包目录（PG 查找 <path>/extension/<name>.control）+ dynamic_library_path 指向包 lib/，即可在不写入 PG 安装目录的前提下加载扩展"
  - "PGXS 会把构建机 <postgresql 包>/lib 写进模块 RUNPATH（Makefile.global: LDFLAGS += $(rpath)，rpathdir = $(libdir)）；make enable_rpath= 可去掉"
  - "上游 -march=native（OPTFLAGS 默认）会把产物绑定到构建机 CPU；发布型产物用 `make OPTFLAGS=` 走上游文档的 portable 路径"
  - "pg_regress 的口径 = psql -X -a -q 从 stdin 读脚本 + 与 expected 逐字节比对；用 -f 传文件会让 psql 给 ERROR 加 file:line: 前缀从而全部失配"
  - "pgvector 的 test/t/*.pl TAP 套件依赖 Perl IPC::Run，OHOS perl 5.42 无此模块，平台不可执行"
