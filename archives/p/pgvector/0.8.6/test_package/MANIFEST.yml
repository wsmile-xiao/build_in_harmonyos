# test_package/MANIFEST.yml
package: pgvector/0.8.6
homepage: "https://github.com/pgvector/pgvector"

upstream_check_command: "make installcheck"
upstream_test_in_build: false
upstream_test_command: "make installcheck (pg_regress: 14 groups)"

upstream_tests_exist: true
upstream_test_framework: pg_regress
upstream_test_count: 62
upstream_test_count_breakdown: "14 pg_regress groups (test/sql/*.sql) + 48 Perl TAP scripts (test/t/*.pl)"
upstream_test_groups:
  - vector_type
  - bit
  - cast
  - copy
  - halfvec
  - sparsevec
  - btree
  - hnsw_vector
  - hnsw_halfvec
  - hnsw_bit
  - hnsw_sparsevec
  - ivfflat_vector
  - ivfflat_halfvec
  - ivfflat_bit
upstream_test_runner: "test_package/pgvector_test.py: initdb cluster (TCP loopback, unix_socket_directories='') -> pg_ctl start -> CREATE EXTENSION vector -> psql -X -a -q stdin per group -> byte-exact diff against test/expected/*.out"
upstream_test_dependency: "running PostgreSQL 18 server from postgresql/18.3 (postgres + initdb + pg_ctl + createdb + psql)"

upstream_test_audit: |
  Audited the upstream v0.8.6 source tree.

  Upstream test inventory (62 entries):
    * 14 pg_regress groups: Makefile REGRESS = $(patsubst test/sql/%.sql,%,
      $(wildcard test/sql/*.sql)); each group has a non-empty
      test/sql/<name>.sql and a non-empty test/expected/<name>.out.
    * 48 Perl TAP scripts in test/t/*.pl (ivfflat/hnsw recall, WAL,
      vacuum, storage, aggregates, ...).

  Executed here: the 14 pg_regress groups, byte-exactly.  pg_regress drives
  every group with "psql -X -a -q -d <db>" reading the script from stdin and
  diffing the merged stdout+stderr against test/expected/<name>.out; the
  runner replicates exactly that invocation (the pg_regress binary itself is
  not shipped inside the postgresql/18.3 package, and building it would mean
  vendoring the PostgreSQL source tree into this archive).

  Not executed: the 48 TAP scripts.  PostgreSQL::Test::Cluster requires the
  Perl module IPC::Run, which is not present in the OHOS perl 5.42
  installation and is not available as a build dependency, so the TAP suite
  cannot be driven on this platform.  Recorded as a known limitation.

test_package_tests:
  - file: test_package/pgvector_test.py
    description: "Artifact assertions (ELF64/AArch64, .codesign, DT_NEEDED == musl libc.so, no RUNPATH) + consumer SQL assertions against a live server (CREATE EXTENSION, vector/halfvec/sparsevec/bit types, <->/<#>/<=> distances, ivfflat + hnsw index build and exact nearest-neighbour query, pg_am registration) + upstream pg_regress groups byte-exact"
    command: "conan test test_package pgvector/0.8.6"
    assertions: 13
    executed: true
    passed: true

assertion_count: 13
assertion_executed: 13
assertion_skipped: 0
