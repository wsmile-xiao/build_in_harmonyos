software: pgvector
display: "pgvector"
description: "PostgreSQL extension for vector similarity search (vector/halfvec/sparsevec/bit types, ivfflat and hnsw index access methods)"
category: db
homepage: "https://github.com/pgvector/pgvector"
license: PostgreSQL
build_system: pgxs

ohos_adaptation:
  key_points:
    - "PGXS 扩展：需要 postgresql 制品包提供 pg_config + lib/postgresql/pgxs + include/postgresql/server；仅 libpq 客户端包装不下"
    - "以 tool_requires(postgresql/18.3) 复用 ohpcd 已发布的 OHOS 适配 PostgreSQL，无需 vendor PG 源码树、无需携带第三方补丁"
    - "make OPTFLAGS= 去掉上游默认的 -march=native（上游 README 的 portable 路径），避免制品绑定构建机 CPU"
    - "make enable_rpath= 去掉 PGXS 默认注入 RUNPATH（Makefile.global: LDFLAGS += $(rpath)），保持模块可重定位"
    - "OHOS Unix domain socket bind 被拒（EPERM）：服务端只能 TCP loopback，unix_socket_directories=''"
    - "PG 18 起用 extension_control_path（填 share 目录，PG 自拼 /extension）+ dynamic_library_path 指向包目录，可在不写入 PG 安装目录的前提下加载扩展"
    - "pg_regress 口径 = psql -X -a -q 从 stdin 读脚本 + 与 expected 逐字节比对；用 -f 传文件会因 psql 加 file:line: 前缀而全组失配"
  common_dependencies:
    - postgresql

versions:
  "0.8.6":
    status: built
    build_date: "2026-09-21"
