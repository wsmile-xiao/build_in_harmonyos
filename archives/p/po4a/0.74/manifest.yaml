name: po4a
version: 0.74
status: published
build_system: perl-module-build
configure_options:
  - --prefix=$HOME/usr/local
  - --install_base=$HOME/usr/local
dependencies:
  required:
    - Module::Build >= 0.42
  recommended:
    - Locale::gettext >= 1.01
    - Pod::Parser
    - SGMLS
    - Term::ReadKey
    - Text::WrapI18N
    - Unicode::GCString
    - YAML::Tiny
  test_requires:
    - SGMLS
    - Unicode::GCString
installed_dependencies:
  - Module::Build 0.4234
  - gettext 0.22.5
  - perl 5.42.2
build_date: 2026-06-02
build_duration: ~10min
compiler: perl 5.42.2
target_platform: harmonyos-aarch64
