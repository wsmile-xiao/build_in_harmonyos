software: pmars
display: "pMARS"
description: "可移植 Core War 模拟器，实现 ICWS'94 Redcode 标准并提供扩展指令，带终端 curses 核心画面与红码调试器"
category: game
homepage: "http://www.koth.org/pmars/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "官方发布物是 zip 且无公共顶层目录（src/ doc/ config/ warriors/），解压不能用 strip_root；tar_format 只在版本级 manifest.yaml 的 source 段声明，conandata.yml 只有 url 与 sha256 两枚键，解压由 get() 按 .zip 后缀识别（conan-create.log:90 的 Unzipping 即该路径）"
    - "版本串以 ChangeLog「Release 0.9.5」+ doc/pmars.6「PMARS v0.9.5」+ src/global.h「PMARSVER 95」三处互证；README 首行的 0.9.0 是上游陈旧文本，不作依据"
    - "src/config.h 把全部显示开关留在注释里，显示层纯由 CFLAGS 选择 ⇒ OHOS 关 X11 靠不定义 -DXWINGRAPHX，不改源码、不用平台宏"
    - "驱动 src/Makefile.clang 而非 src/Makefile：后者 CFLAGS += -DXWINGRAPHX 且硬编 -L/usr/X11R6/lib -lX11，命令行只能追加不能移除"
    - "ncurses 6.x WINDOW 为不完整类型，curdisp.c 5 处 curwin->_curx/_cury 直接读字段是硬编译错误；补丁改用公共函数 getcurx()/getcury()"
    - "制品仓 ncurses/6.6 只发宽字符静态库 ⇒ 链接用 -lncursesw；产物 readelf -d 仅 NEEDED libc.so"
    - "运行期需要 ncurses 的 runenv_info 提供 TERMINFO/TERMINFO_DIRS，故 requires 写 ncurses/6.6 run=True；缺失时 pmars 进显示即 exit 1"
    - "上游无 check/test 目标、无 tests/ 目录（成体系测试数=0）；可申报的作者写成就是 6 条战士 ;assert 装配期断言"
  common_dependencies:
    - ncurses/6.6
    - libc

versions:
  "0.9.5":
    status: built
    build_date: "2026-09-26"
