# test_package/MANIFEST.yml
# pmars 0.9.5 — 上游测试声明（L0e 强制文件）
# 口径：docs/TEST_QUALITY_SPEC.md + AGENTS「测试口径两套都要给、不许混用」

package: pmars/0.9.5
homepage: "http://www.koth.org/pmars/"

# ─────────────────────────────────────────────────────────────
# 一、上游是否有成体系测试：没有（附清点证据，R51）
# ─────────────────────────────────────────────────────────────
# 证据（在 0.9.5 官方 zip 解出的完整源码树上实测，非推断）：
#   1) find . -name 'Makefile*' -exec grep -Hn "^check\|^test\|check:" {} \;
#      -> 无任何输出；src/Makefile、src/Makefile.clang、src/Makefile.djg、
#         src/Makefile.wat、doc/Makefile 五个 makefile 里都没有 check/test 目标
#      （src/Makefile 只有 all/flags/clean；doc/Makefile 只有 man/doc 目标）
#   2) test -d tests -> 不存在（NO_TESTS_DIR）
#   3) 上游原始源码树文件总数 68，顶层目录只有 config/ doc/ src/ warriors/
#      口径披露（棒-66f 复验批次 2026-09-26 10:14 CST，B 机）：find 在实际被扫的那棵 conan
#      工作树上原始输出 69，多出的 1 枚是 conan 经 export_conandata_patches() 注入的
#      patches/0001-curdisp-opaque-window-accessors.patch，那棵树顶层因此另有 patches/；
#      68 = 排除 patches/ 后的复算值，原文见 reports/upstream-test-scan.txt §0 与 §结论 5
# 因此 upstream_test_in_build=false，build() 中不执行 `make check`
# （执行会得到 "No rule to make target 'check'"，不是"测试通过"）。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游成体系测试用例数（准确整数）：0
upstream_test_cases: 0

# ─────────────────────────────────────────────────────────────
# 二、上游作者确实写了、且可在本平台求值的断言（申报数=静态全量）
# ─────────────────────────────────────────────────────────────
# pMARS 的 Redcode 战士自带 `;assert` 装配期断言，是上游唯一的"作者写的检查"。
# 静态全量清点：grep -h ";assert" warriors/*.red | wc -l  =>  6
#   warriors/artofcorewar.red:6    ;assert CORESIZE == 8000
#   warriors/excalibur.red:5       ;assert CORESIZE == 8000
#   warriors/forgottenloreii.red:2 ;assert CORESIZE==8000
#   warriors/sonofvain.red:5       ;assert 1
#   warriors/sunset.red:2          ;assert CORESIZE==8000
#   warriors/validate.red:24       ;assert MAXLENGTH >= 90
# 可执行数 = 6（`pmars -A` 装配期求值，逐只断言其配置前提）
# 实测通过数 = 6/6（见 reports/ 下 conan-verify 日志的 PASS 行）
# 跳过数 = 0；失败数 = 0
upstream_authored_assertions_static: 6
upstream_authored_assertions_executable: 6
upstream_authored_assertions_passed: 6

# 另有一件上游作者写的"系统一致性程序"：warriors/validate.red
#   ;strategy System validation program - based on Mark Durham's validation suite
#   头部列出 7 类检查（全部 opcode/寻址模式、ICWS'88 ADD/SUB、SPL、计时、
#   in-memory vs in-register 求值、core 初始化）；合规则自和局、不合规则自杀。
# 本机已实际跑到该程序（-b -r 1 -s 8000 -c 60000 -l 100 validate.red，rc=0，
# 输出 "Validate 1.1R by Stefan Strack scores 0"），但**单战士模式下上游不打印
# "Results:" 行**，"自和局 vs 自杀"的机器判据不确定，故不纳入自动断言计数，
# 只作为已观察行为留档（申报口径里也不把它算进"通过数"）。

# ─────────────────────────────────────────────────────────────
# 三、消费者自建测试（test_package/），与上面分开计数、不混用
# ─────────────────────────────────────────────────────────────
test_package_tests:
  - file: test_pmars.sh
    description: "Executes the packaged pmars by absolute path (never via $PATH, so a same-named harmonybrew binary cannot fake a pass): packaged-binary check; -Q 1000 exit 95 (PMARSVER of 0.9.5); banner contains 'pMARS v0.9.5'; -Q 1002 exit 184 (0.9.5 + graphical/curses VARIANT=2, i.e. X11 variant not built); -Q 1003 exit 4 (32-bit ADDR_T, proves -DSMALLMEM off); assemble all 6 shipped warriors so their upstream `;assert` directives are evaluated; a real two-warrior fight through the ncurses display layer (only passes when ncurses is required with run=True, because that dependency publishes TERMINFO/TERMINFO_DIRS); and a negative control where a deliberately false `;assert` must make assembly exit 3 with 1 error."
    command: "sh test_pmars.sh <package>/bin/pmars <package>/res"

# test_package 断言总数（准确整数，与 test_pmars.sh 的 SUMMARY 同源）
assertion_count: 13

# 适配后通过率：消费者断言 13/13 + 上游作者断言 6/6 = 19/19 (100%)
pass_rate: "19/19 (100%)"

# ─────────────────────────────────────────────────────────────
# 口径披露（棒-66f 收口复验时补，2026-09-26，B 机）：
# 上面 pass_rate 的 19/19 是「按执行载体相加」的口径：test_pmars.sh 的 13 条里，
# 编号 10..15 那 6 条正是上游 6 条 `;assert` 的求值载体，故**互不相同的断言总数是 13**
# （上游作者所写 6 条 + 消费者自建 7 条：00/01/02/03/04/20/21）。
# 两套分类计数不混用、0 失败 0 跳过；version-level manifest.yaml 的 test_summary 用的是
# 分类口径（upstream 6 + consumer 13，未相加），与本文件同源。
# 本轮 W3 复验（2026-09-26 10:12 CST，先 conan remove 强制源码重建）实测：
#   reports/conan-create.log:102 Calling build() / :103 Apply patch / :620 SUMMARY: 13/13 passed, 0 failed
