# conandata.yml — pmars 0.9.5
#
# Source URL is the official upstream release on the project's own host
# (koth.org is the pMARS home; the file name was read from the directory
# listing's href="pmars-0.9.5.zip", verified on-device 3/3 samples).
#
# NOTE for reviewers (R39 / PF7): koth.org serves plain HTTP only — port 443
# times out (3/3 samples, both www.koth.org and the koth.org apex, on the
# HarmonyOS build host). No mirror prefix is added here: per R39 the recipe
# must carry the single official URL, and CI appends mirror fallback itself.
# See notes.md "已试过的失败方案 / 适用边界" for the probe evidence.
#
# sha256 below was produced on the build host by `sha256sum` over the
# downloaded artifact (not copied from any third-party page).

sources:
  url: "http://www.koth.org/pmars/pmars-0.9.5.zip"
  sha256: "6c7c72dbd2a6670d36ba7a96b113d2b54557508afdd99573dfa1da6557700d37"

patches:
  - patch_file: "patches/0001-curdisp-opaque-window-accessors.patch"
    patch_description: "curdisp.c: replace five direct reads of the opaque WINDOW struct (curwin->_curx/_cury) with the public getcurx()/getcury() accessors that libncursesw.a exports as functions; ncurses 6.x declares WINDOW as an incomplete type, so the direct field reads are a hard compile error."
    patch_type: "portability"
