# 版本级 manifest — pmars 0.9.5
# 遵循 ARCHIVE-SPEC v2.0/v3.0（字段口径对齐 archives/a/aeolus/0.10.4/manifest.yaml）

version: "0.9.5"
software: pmars
status: built
build_date: "2026-09-26"
build_system: makefile

source:
  url: "http://www.koth.org/pmars/pmars-0.9.5.zip"
  sha256: "6c7c72dbd2a6670d36ba7a96b113d2b54557508afdd99573dfa1da6557700d37"
  tar_format: zip

build:
  system: makefile
  configure_options: []
  dependencies:
    - ncurses/6.6
  cc: clang
  cxx: ""

# 编译期开关（本项目没有 configure，"配置"就是 CFLAGS 的选择，全部可核对）
compile_flags:
  applied:
    - "-DEXT94"
    - "-DCURSESGRAPHX"
    - "-DPERMUTATE"
    - "-DRWLIMIT"
    - "-O"
  # 名称取自 src/Makefile 顶部的选项矩阵（1 SERVER / 2 GRAPHX / 3 KEYPRESS /
  # 4 EXT94 / 5 SMALLMEM / 6 XWINGRAPHX / 7 CURSESGRAPHX / 8 PERMUTATE /
  # 9 RWLIMIT / 10 SAFECOLORS）；GRAPHX 由 config.h 从 CURSESGRAPHX 自动蕴含。
  deliberately_not_applied:
    - "-DXWINGRAPHX"
    - "-DSERVER"
    - "-DSMALLMEM"
    - "-DKEYPRESS"
    - "-DSAFECOLORS"
  makefile_used: "src/Makefile.clang"
  link_flags: "-lncursesw"

patches_applied:
  - "0001-curdisp-opaque-window-accessors.patch"

test_summary:
  upstream_test_cases: 0
  upstream_authored_assertions_static: 6
  upstream_authored_assertions_executable: 6
  upstream_authored_assertions_passed: 6
  consumer_assertions: 13
  consumer_assertions_passed: 13
  failed: 0
  skipped: 0

knowledge_gained:
  - "上游官方发布物是 .zip 且**无公共顶层目录**（解压直接得 src/ doc/ config/ warriors/）：get() 不能用 strip_root=True，须 destination=self.source_folder；文件名也不能按 tar.gz 惯例猜（登记表里 SCT 写的 pmars_0.9.4.orig.tar.xz 是上一版的 Debian 池件）"
  - "版本串三处独立互证：ChangeLog「Release 0.9.5」、doc/pmars.6「.TH PMARS 6 ... PMARS v0.9.5」、src/global.h「#define PMARSVER 95」；README 首行仍写 version 0.9.0，是上游自己没更新的陈旧文本，不作为版本依据"
  - "src/config.h 把所有显示开关（GRAPHX/SERVER/XWINGRAPHX/CURSESGRAPHX/...）都留在 /* */ 注释里 ⇒ 显示层纯由 CFLAGS 决定，关 X11 只需**不定义 XWINGRAPHX**，无需改源码、无需平台宏（R8/PF5 合规）"
  - "四个 makefile 里只有 src/Makefile.clang 的 CFLAGS 是普通赋值（可被 make 命令行整体替换）；src/Makefile 用 CFLAGS += -DXWINGRAPHX 且 LIB=-L/usr/X11R6/lib -lX11，命令行只能追加不能移除 ⇒ 想干净关掉 X11 必须走 Makefile.clang"
  - "ncurses 6.x 的 WINDOW 是不完整类型：pmars curdisp.c 5 处直接读 curwin->_curx/_cury 是硬编译错误（incomplete definition of type 'struct _win_st'）。正解是公共访问器 getcurx()/getcury()——它们在 libncursesw.a 里是真函数（nm 可见 T getcury），不受 NCURSES_OPAQUE 影响；curdisp.c 第 478 行本来就用了同类公共宏 getyx()，补丁只是把遗留的 5 处对齐到上游自己的写法"
  - "制品仓 ncurses/6.6 只发宽字符静态库（libncursesw.a / libformw.a / libmenuw.a / libpanelw.a / libncurses++w.a，无 libncurses.a、无任何 .so）⇒ 必须 -lncursesw；产物 readelf -d 只有 NEEDED libc.so，ncurses 依赖数为 0"
  - "运行期 terminfo 是**真依赖**：pmars 一进入 curses 显示就要解析 TERM 对应的 terminfo 条目，而设备上 /usr/share/terminfo 只有 2 项、发布件 ncurses 的内置搜索路径不指向它 ⇒ 没有 ncurses 的 runenv_info（该配方 L406-407 define_path TERMINFO/TERMINFO_DIRS）时 pmars 直接 exit 1「ncurses: cannot initialize terminal type」。requires 必须写 run=True，tool_requires/普通 requires 都不解决运行期装载（与 presage 同族）"
  - "上游 curses 显示结束后停在「Press any key ..」等按键：接 pty 且不应键会永久阻塞；测试一律 </dev/null（wgetch 立即返回 ERR），已在 notes.md 记为已知交互行为"
  - "pmars 没有 --version；机器可读探针是 -Q（returninfo() 把值当**退出码**返回，源码注释 'useful mainly in scripts'）：-Q 1000→95(PMARSVER)、-Q 1001→2(GRAPHX/curses VARIANT)、-Q 1002→952%256=184、-Q 1003→4(ADDR_T 宽，证 SMALLMEM 未开)"
  - "上游四个 makefile 全无 check/test 目标、无 tests/ 目录 ⇒ 上游测试用例数=0；可申报的「作者写的检查」是 6 条战士内 `;assert`（装配期求值），另有 validate.red（Mark Durham validation suite）作行为级留档但不计入通过数"
