software: perl-metrics-any
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.10-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.10-r1"

# 编译状态
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/Metrics-Any-0.10-no-ssl.tar.gz"

  # 源码校验和
  sha256: "a90eadf9c8af24a516bb9a1b67061f641853f90b8fee9ffc24d2bb9720e8b99b"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: module-build

  # 配置选项
  configure_options:
    - "perl Build.PL --prefix ~/usr/local"

  # 编译依赖列表
  dependencies:
    - perl/5.42.0
    - Module-Build/0.4004

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Metrics::Any 是纯 Perl 模块，使用 Module::Build 构建，无需 XS/C 编译"
  - "纯 Perl 模块在 OpenHarmony 平台完全兼容，无 SELinux 限制问题"
  - "Module::Build 的 perl Build.PL + perl Build install --prefix 方式可用于纯 Perl 模块部署"
  - "与 perl-dbd-pg (XS 模块) 不同，纯 Perl 模块可直接安装到 site_perl 目录，用户可立即使用"
