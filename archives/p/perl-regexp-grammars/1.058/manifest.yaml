# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS/C 代码）在鸿蒙平台可直接编译，无需 CRT 链接参数修复"
  - "ExtUtils::MakeMaker 构建系统在鸿蒙平台兼容良好，perl Makefile.PL && make && make install 流程无需修改"
  - "与 perl-dbd-pg 等 XS 模块不同，纯 Perl 模块不涉及 CRT 文件缺失问题"
  - "conan-verify G0 可能匹配到 E007 (autotools 平台检测) 警告，但对纯 Perl 模块为非阻塞"
  - "test_package 通过 PERL5LIB 环境变量和 subprocess 调用系统 perl 验证模块加载"

