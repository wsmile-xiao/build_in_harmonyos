software: perl-moosex-types
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.51/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.51"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统（顶层字段，供 verify-build 检查）
build_system: perl

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"
compile_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/downloads/MooseX-Types-0.51.tar.gz"

  # 源码校验和
  sha256: "a5374c7b0273220239b19dda88b824dd73b95398c913c5c9e305edbdb5e0270f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Build.PL --install_base /storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "Module::Build::Tiny/0.052"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 运行时依赖
# ============================================================

runtime_dependencies:
  - "Moose >= 1.06 (installed 2.4000)"
  - "Carp::Clan >= 6.00 (installed 6.08)"
  - "Sub::Exporter::ForMethods >= 0.100052 (installed 0.100052)"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
