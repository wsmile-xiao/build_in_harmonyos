software: perl-json-xs
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.04/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.04"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"
compile_date: "2026-06-12"

# 构建系统类型
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/M/ML/MLEHMANN/JSON-XS-4.04.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options:
    - "PERL5LIB=/storage/Users/currentUser/usr/local/lib/site_perl/5.42.0:/storage/Users/currentUser/usr/local/lib/site_perl/5.42.0/aarch64-linux"
    - "PERL_CANARY_STABILITY_NOPROMPT=1"
    - "CPATH=/storage/Users/currentUser/usr/local/include"
    - "LIBRARY_PATH=/storage/Users/currentUser/usr/local/lib"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "canary-stability/2013"
    - "common-sense/3.75"
    - "types-serialiser/1.01"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无补丁，源码无需修改即可编译

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块需要手动安装 Perl 模块依赖（Canary::Stability, common::sense, Types::Serialiser）"
  - "必须设置 PERL5LIB 环境变量包含 Perl 模块安装路径"
  - "必须设置 PERL_CANARY_STABILITY_NOPROMPT=1 跳过 Canary 稳定性检查提示"
  - "编译时需要 OTHERLDFLAGS='-nostartfiles -nodefaultlibs' 参数"
  - "XS 模块在 HMDFS 上有 SELinux 限制，需要管理员安装到系统目录"
