software: perl-module-implementation
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.09/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.09"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://backpan.perl.org/authors/id/D/DR/DROLSKY/Module-Implementation-0.09.tar.gz"

  # 源码校验和
  sha256: "c15f1a12f0c2130c9efff3c2e1afe5887b08ccd033bd132186d1e7d5087fd66d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
    # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 顶层构建系统（verify-build 需要的扁平字段）
  build_system: perl-makefile-pl

  # 配置选项列表
  configure_options:
    - "PREFIX=~/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "perl-module-runtime/0.018"
    - "perl-try-tiny/0.31"
    - "perl-extutils-makemaker/7.76"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在 OpenHarmony 上无需任何平台适配补丁，直接 perl Makefile.PL && make && make install 即可"
  - "与 perl-dbd-pg 等 XS 模块不同，纯 Perl 模块不受 SELinux HMDFS 限制影响"
  - "taint 模式下 PERL5LIB 被忽略，需用 -I 显式指定模块安装路径"
  - "Module::Implementation 是 Package::Stash 等模块的依赖，用于选择 XS/PurePerl 实现"
  - "Makefile.PL (ExtUtils::MakeMaker) 是 Perl 模块标准构建系统，OpenHarmony 兼容良好"
