software: perl-module-implementation
description: "Loads one of several alternate underlying implementations for a module (e.g. XS vs PurePerl)"
homepage: "https://metacpan.org/pod/Module::Implementation"
repository: "https://github.com/houseabsolute/Module-Implementation"
license: "Artistic-2.0"

# 版本索引
versions:
  "0.09":
    status: published
    build_date: "2026-06-18"
    build_system: perl-makefile-pl

# 运行时依赖
runtime_dependencies:
  - "perl/5.42.0"
  - "perl-module-runtime/0.012+"
  - "perl-try-tiny"

# 构建依赖
build_dependencies:
  - "perl/5.42.0"
  - "perl-extutils-makemaker/6.63+"
