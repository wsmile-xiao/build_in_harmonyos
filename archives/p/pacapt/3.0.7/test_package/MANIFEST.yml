# test_package manifest — pacapt 3.0.7
# R35 test presence gate: this file must exist.

tests:
  - name: smoke_pacapt
    type: shell_script
    script: test_pacapt.sh
    description: >
      4 层分层测试：产物完整性（文件存在/可执行/shebang/大小）→
      语法验证（sh -n / bash -n）→ 运行时调用（版本/帮助/PACMAN_detect 失败路径）→
      上游测试覆盖（12 个测试文件全部跳过，原因：OHOS 无系统包管理器）。
    upstream: false
    upstream_note: >
      上游 12 个测试文件（dpkg/apk/yum/dnf/zypper/homebrew/xbps/pkgng/opkg/
      sun_tools/swupd/slitaz40）共 310 条命令，全部需要 Docker 容器+真实
      系统包管理器，OHOS CI 环境无法运行。

  - name: pip_backend_functional
    type: shell_script
    script: test_pacapt.sh (Layer 4)
    description: >
      通过 pacman-pip 命名法绕过 _PACMAN_detect，利用 OHOS 上已有的
      pip 24.3.1 真实调用 pacapt 的 pip 后端，验证命令解析→分发→执行链路。
      9 项测试：6 通过（-V/-h/-P/-Q/-Qs/-Sc），3 失败（-Qi/-Ss/-Si
      属于 pacapt pip 后端未实现的操作，非适配缺陷）。
    upstream: false
    upstream_note: >
      上游无 pip.txt 测试文件。本测试为适配时新增，验证 OHOS 上可执行的
      外部包管理器后端功能。
