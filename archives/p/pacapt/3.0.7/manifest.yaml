version: "3.0.7"
software: "pacapt"
status: built
build_date: "2026-09-07"
build_system: custom

source:
  url: "https://github.com/icy/pacapt/archive/refs/tags/v3.0.7.tar.gz"
  sha256: "d1081b639466de7650ed66c7bb5a522482c60c24b03c292c46b86a3983e66234"
  tar_format: tar.gz

build:
  # pacapt is a pure shell script — no C/C++ compilation.
  # bin/compile.sh concatenates lib/*.sh into a single script.
  system: custom
  configure_options: []
  dependencies: []
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "pacapt is a pure POSIX shell script (56KB), not a compiled binary"
  - "bin/compile.sh uses 'git log' for version hash; tarball has no .git, set VERSION=3.0.7 env"
  - "Upstream tests require Docker + real package managers (dpkg/yum/apk); cannot run in OHOS CI"
  - "pacapt shebang is '#!/usr/bin/env sh', OHOS must have /usr/bin/env available"
  - "pacapt wraps system package managers; functional testing requires actual pkg managers on target"
