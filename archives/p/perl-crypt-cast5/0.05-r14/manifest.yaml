software: perl-crypt-cast5
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.05-r14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.05-r14"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# 构建系统类型 (顶层字段, 供 submit 自检扁平解析)
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/B/BO/BOBMATH/Crypt-CAST5-0.05.tar.gz"

  # 源码校验和
  sha256: "9b51fc769c34ebb7b605927705af31af277e2532f0c03ed53755d064cdde1307"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块构建系统为 ExtUtils::MakeMaker (Makefile.PL), 非 autotools"
  - "OpenHarmony hmmac 安全标签限制: 用户路径的 .so 无法 dlopen, 只有 /data/service/hnp/ 下的 .so (hnp_file 标签) 可加载"
  - "perl-dbd-pg 3.18.0 已记录相同问题(称为 SELinux HMDFS 限制), 本次通过 ls -Z 确认根因为 hmmac 安全标签"
  - "Perl 5.42.0 安装在 /data/service/hnp/, 由 installs 组拥有, 普通用户无写权限"
  - "CPAN 模块名大小写敏感: Crypt-CAST5 (非 Crypt-Cast5)"
  - "Conan basic_layout 会创建 build-release 子目录, 需用 cwd=self.source_folder"
  - "Conan 2.x self.run() 的 env 参数需要 list 格式, 不能用 dict"
  - "E131 (LD 环境变量干扰 dlopen) 在本案例中非主因: env -u CC -u LD 后仍因 hmmac 标签失败"
  - "binary-sign-tool -selfSign 1 签名不能解决 hmmac 标签问题: 标签由文件系统挂载属性决定"
  - "CAST5.so 技术验证通过: 导出 boot_Crypt__CAST5/cast5_encrypt/cast5_decrypt/cast5_init, 仅依赖 libc.so"
  - "与 perl-dbd-pg 的编译差异: CAST5 不需要 -nostartfiles -nodefaultlibs -lc (E208), 推测因 C 代码较简单不依赖 CRT 启动代码"
  - "功能测试报告: reports/functional-test-report.md"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
