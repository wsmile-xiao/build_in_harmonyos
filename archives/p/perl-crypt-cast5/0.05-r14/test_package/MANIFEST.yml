# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-crypt-cast5/0.05-r14
homepage: "https://metacpan.org/dist/Crypt-CAST5"

# 上游测试命令 (Perl Makefile.PL 测试体系)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/1cast5.t
    source: Crypt-CAST5-0.05/t/1cast5.t
    description: "CAST5 加密/解密基本功能测试"
    command: "perl -Mblib t/1cast5.t"
  - file: t/2cbc.t
    source: Crypt-CAST5-0.05/t/2cbc.t
    description: "CBC 模式测试 (需要 Crypt::CBC)"
    command: "perl -Mblib t/2cbc.t"
  - file: t/3utf.t
    source: Crypt-CAST5-0.05/t/3utf.t
    description: "UTF-8 编码测试"
    command: "perl -Mblib t/3utf.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "验证包产物完整性 (CAST5.so ELF + CAST5.pm 存在性)"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
