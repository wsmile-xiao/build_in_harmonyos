# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-crypt-cast5

# 软件描述
description: "CAST5 block cipher for Perl (Crypt::CAST5)"

# 分类
category: cryptography

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "0.05-r14"
    status: built
    build_date: "2026-07-02"
    path: archives/p/perl-crypt-cast5/0.05-r14

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/dist/Crypt-CAST5

# 源码仓库
repository: https://cpan.metacpan.org/authors/id/B/BO/BOBMATH/Crypt-CAST5-0.05.tar.gz

# 许可证
license: Artistic-1.0-Perl OR GPL-1.0-or-later

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl

# 编译依赖
build_dependencies:
  - perl (Perl XS 开发头文件)
  - clang (Harmonybrew OHOS LLVM)
