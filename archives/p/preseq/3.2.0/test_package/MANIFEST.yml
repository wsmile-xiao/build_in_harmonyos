package: preseq/3.2.0
homepage: "https://github.com/smithlabcode/preseq"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "preseq README examples"
upstream_tests:
  - file: "data/SRR1003759_5M_subset.mr"
    source: "preseq-3.2.0 release"
    description: "lc_extrap mapped-read example"
    command: "preseq lc_extrap -o preseq-mapped.tsv SRR1003759_5M_subset.mr"
  - file: "data/SRR1106616_5M_subset.bam"
    source: "preseq-3.2.0 release"
    description: "lc_extrap BAM example"
    command: "preseq lc_extrap -B -o preseq-bam.tsv SRR1106616_5M_subset.bam"
  - file: "data/SRR1301329_1M_hist.txt"
    source: "preseq-3.2.0 release"
    description: "lc_extrap histogram example, correcting the README-only filename"
    command: "preseq lc_extrap -H -o preseq-hist.tsv SRR1301329_1M_hist.txt"
  - file: "data/SRR1003759_5M_subset.mr"
    source: "preseq-3.2.0 release"
    description: "gc_extrap mapped-read example"
    command: "preseq gc_extrap -B -o preseq-coverage.tsv SRR1003759_5M_subset.mr"
test_package_tests:
  - file: "verify_output.py"
    description: "Installed preseq creates and formats an extrapolation table"
    command: "preseq lc_extrap -H -o preseq-consumer.tsv SRR1301329_1M_hist.txt"
assertion_count: 3
