software: perl-moosex-test-role
display: "MooseX::Test::Role"
description: "用于测试 Moose/Moo 角色的工具模块，提供便捷函数创建消费角色的类和对象"
category: perl-module
homepage: "https://github.com/pboyd/MooseX-Test::Role"
license: GPL-1.0-or-later OR Artistic-1.0
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需平台适配，标准 perl Makefile.PL 流程"
    - "测试套件依赖 Moose，需先安装 perl-moose 才能通过全部测试"
    - "模块内部 $VERSION (0.07) 与 tarball 版本 (0.08) 不一致，属上游打包问题"
  common_dependencies:
    - perl
    - perl-class-load
    - perl-moose (测试时需要)

versions:
  "0.08":
    status: published
    build_date: "2026-06-23"
    published_as: perl-moosex-test-role
    source_url: "https://cpan.metacpan.org/authors/id/P/PB/PBOYD/MooseX-Test-Role-0.08.tar.gz"
