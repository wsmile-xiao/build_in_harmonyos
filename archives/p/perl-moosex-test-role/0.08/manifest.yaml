software: perl-moosex-test-role
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.08/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.08"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-23"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/P/PB/PBOYD/MooseX-Test-Role-0.08.tar.gz"

  # 源码校验和
  sha256: "fe116ae838803f001441bd401cacd2fddd0f051dce95c91c23e69cdd443d0440"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  build_system: perl
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl-class-load/0.25
    - perl-test-simple/1.302183
  # 运行时可选依赖（用于测试）
  runtime_optional:
    - perl-moose/2.4000
    - perl-moo/2.005005
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块, ExtUtils::MakeMaker 构建系统, 编译无障碍"
  - "测试套件依赖 Moose, 需先安装 perl-moose 才能通过全部测试"
  - "模块 $VERSION (0.07) 与 tarball 版本 (0.08) 不一致, 属上游打包问题"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
