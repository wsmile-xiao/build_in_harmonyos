software: perl-net-telnet
display: "Net::Telnet"
description: "Perl module to interact with TELNET port or other TCP ports"
category: network
homepage: "https://metacpan.org/dist/Net-Telnet"
license: Artistic-1.0-Perl
build_system: perl

ohos_adaptation:
  key_points:
    - "纯Perl模块，无需C编译器，无需任何源码修改"
    - "Savannah URL已失效，需从CPAN下载源码"
    - "conanfile.py需自定义build()方法，不能用Autotools模板"
    - "test_package不能用CMake，需用Perl命令直接测试模块加载"
    - "不受SELinux HMDFS限制影响（纯Perl模块无ELF文件）"
    - "make -j2的mkfifo警告在鸿蒙平台非致命"
  common_dependencies: []

versions:
  "3.05-r1":
    status: published
    build_date: "2026-06-29"
    conan_ref: "perl-net-telnet/3.05-r1@ohpcd/stable"
