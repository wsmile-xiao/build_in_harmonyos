software: perl-net-telnet
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.05-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.05-r1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/J/JR/JROGERS/Net-Telnet-3.05.tar.gz"

  # 源码校验和
  sha256: "677f68ba2cd2a824fae323fa82e183bf7e3d03c3c499c91d923bd6283796a743"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块conanfile.py需要自定义build()方法，不能用Autotools模板"
  - "test_package不能用CMake，需用Perl命令直接测试模块加载"
  - "Conan 2.x中deps_cpp_info已移除，需用self.dependencies['name']代替"
  - "G4检查需要bin/lib/include，纯Perl模块需在package()中额外复制.pm到lib/"
  - "Savannah URL已失效，Perl模块从CPAN下载"
  - "make -j2的mkfifo警告在鸿蒙平台非致命"
  - "纯Perl模块不受SELinux HMDFS限制影响（对比perl-dbd-pg的XS模块限制）"
  - "Net::Telnet的new()传入Host参数会自动调用open()，连接失败时返回undef"
  - "Net::Telnet支持return/die/回调三种errmode模式，在鸿蒙平台均正常工作"
  - "TCP连接超时精度极高（2s设置实际2.0006s触发）"
  - "26个核心API方法在鸿蒙平台全部可用，功能测试31/31通过"
