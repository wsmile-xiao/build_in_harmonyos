software: perl-module-pluggable
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.3"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SI/SIMONW/Module-Pluggable-6.3.tar.gz"

  # 源码校验和
  sha256: "58512bb9c654746d0937770b98b559b30872d85ac24073485e5830890dd1b2a0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 构建系统命令
  build_system: perl-makemaker

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块，无需编译 C/XS 代码，无 SELinux/HMDFS 限制问题"
  - "OpenHarmony 不强制 POSIX 文件权限（chmod(0200) 不会使文件不可读），导致 t/29unreadable.t 测试失败，但不影响模块功能"
  - "从 cpan.metacpan.org 下载源码时可能遇到 SSL 证书验证失败，使用 curl --insecure 或 --no-download 参数解决"
  - "PERL5LIB 环境变量需设置为 $DEFAULT_PREFIX/lib/site_perl/5.42.0:$DEFAULT_PREFIX/lib/perl5 以正确加载 site_perl 模块"
  - "make test 运行 45 个测试文件 192 个子测试，44/45 文件通过，190/192 子测试通过"
