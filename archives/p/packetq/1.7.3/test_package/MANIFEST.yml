package: packetq/1.7.3
homepage: "https://github.com/DNS-OARC/PacketQ"

# R51 upstream test inventory (evidence): the official dist tarball
# packetq-1.7.3.tar.gz (sha256 faa9a370…d7718) ships a REAL regression
# suite — src/test/test1.sh..test8.sh registered as automake TESTS
# (src/test/Makefile.am), POSIX-sh scripts with golden files (test1.gold…
# test8.gold) over bundled fixtures dns.pcap/dns6.pcap/../../pcap/
# sample.pcap.gz; `make check` executes all eight on the built binary.
# The recipe runs `make check` in build() (see conanfile.py) — a golden
# mismatch fails G2.
upstream_tests:
  - suite: "src/test (make check)"
    count: 8
    kind: golden-file regression (SQL engine + pcap fixtures)

test_package_tests:
  - file: conanfile.py (test())
    description: |
      Consumer-level execution of the INSTALLED tool: --version banner
      check, then real SQL queries over the bundled sample.pcap (upstream
      pcap/sample.pcap.gz, uncompressed): `select count(*) from dns`
      must yield [8], and the qname aggregation must contain www.se.
      Golden cross-checked with homebrew packetq 1.7.3 on macOS
      (2026-09-05); pcap parsing is deterministic and platform-independent.
