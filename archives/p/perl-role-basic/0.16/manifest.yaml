software: perl-role-basic
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.16/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.16"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"
compile_date: "2026-06-29"
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/O/OV/OVID/Role-Basic-0.16.tar.gz"

  # 源码校验和
  sha256: "4717d700caa7bfdef9d7b4ec2f48a0df06ece758afeaa9e8b3f04961b9c368a6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS 代码）在鸿蒙平台可直接编译，无需特殊适配"
  - "ExtUtils::MakeMaker 构建系统在鸿蒙平台工作正常，使用标准 perl Makefile.PL + make + make install 流程"
  - "test_package 应使用 Perl smoke test 而非 C/C++ 测试框架，conan-init 自动生成的 CMakeLists.txt/test.c 需删除"
  - "Conan 配方通过 runenv_info.append_path('PERL5LIB', ...) 设置模块搜索路径"
  - "Role::Basic 的 with 关键字导出到调用者命名空间而非 Role::Basic 包本身，smoke test 应测试实际角色组合功能而非 can('with')"
  - "with 只能对同一包调用一次，多角色需在单次 with 调用中传入"
  - "与 perl-dbd-pg 等 XS 模块不同，纯 Perl 模块无需处理 CRT 文件缺失、链接参数等问题"
