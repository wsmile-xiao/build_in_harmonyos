software: perl-net-cidr-lite
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.23-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.23-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/ST/STIGTSP/Net-CIDR-Lite-0.23.tar.gz"

  # 源码校验和
  sha256: "9a58278e49a08cdeb9bec01cecdd3a95be736d0e7d4d05d13f908e3a3fe10d32"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（Makefile.PL 驱动）在 OpenHarmony 平台编译无需任何修改，perl Makefile.PL + make + make install 即可"
  - "Net::CIDR::Lite 的 add() 方法要求 CIDR 格式（IP/mask），裸 IP 应使用 add_any() 或 add_ip() 方法"
  - "clean() 方法用于合并重叠/相邻 CIDR 范围，不是清空操作，调用后范围数据仍然存在"
  - "纯 Perl 模块不受 SELinux HMDFS 限制影响，安装后立即可用（与 perl-dbd-pg 的 XS 模块形成对比）"
  - "性能: 10000 个 /32 IP 添加 0.073s，100000 次 find 查找 0.809s，适合高频率 CIDR 操作场景"
