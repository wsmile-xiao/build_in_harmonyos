# 软件级 manifest
# 文件位置: archives/p/pangene/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: pangene

# 显示名
display: "pangene"

# 一句话描述
description: "Construct a pangenome gene graph in GFA from miniprot protein-to-genome alignments"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: data

# 官网 URL
homepage: "https://github.com/lh3/pangene"

# 开源许可证（SPDX 标识）
license: MIT

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Plain Makefile 构建（无 configure / 无 install 规则），默认 CC=gcc，需命令行覆盖为 clang（R33：从 Conan conf 获取编译器）"
    - "唯一外部依赖 zlib（read.c KSTREAM_INIT + kseq.h 读 .paf/.paf.gz 输入），经 Conan zlib/1.3.2 引入，build() 用 -L<zlib libdir> -lz 覆盖默认 LIBS（R26）"
    - "纯 C99，无 pthread 实调用（-lpthread 为遗留链接标志）、无 SIMD、仅 getrusage/gettimeofday，OHOS clang 15 + musl 零 patch（同作者 miniprot 0.18 已实证）"
    - "上游无正式测试（Makefile 无 test/check 目标）；README quick-start（test/C4 fixtures）已重实现于 test_package 作为功能验证"
    - "上游无 install 目标，package() 手工 copy pangene 可执行文件到 bin/"
  common_dependencies:
    - "zlib/1.3.2"

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.1":
    status: built
    build_date: "2026-09-11"
