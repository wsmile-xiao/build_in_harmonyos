software: pangene
# 版本级 manifest
# 文件位置: archives/p/pangene/1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-11"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag v1.1，对应 r231）
  url: "https://github.com/lh3/pangene/archive/refs/tags/v1.1.tar.gz"

  # 源码校验和
  sha256: "9fbb6faa4d53b1e163a186375ca01bbac4395aa4c88d1ca00d155e751fb89cf8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "LIBS=-lpthread -L<zlib_pkg_libdir> -lz -lm"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零 patch）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pangene 1.1（v1.1 tag = r231，2024-02-22 发布）为纯 C99 泛基因组基因图构建工具，上游仅 lh3/pangene 官方仓库（MIT License，GitHub API license.spdx_id=MIT；tarball 内无 LICENSE 文件）。"
  - "构建系统为 plain Makefile（无 configure、无 install 规则），默认 CC=gcc；CFLAGS=-std=c99 -g -Wall -O2，同作者 miniprot 0.18 已实证 OHOS clang 15 零 patch 通过。"
  - "依赖：libc + libpthread（仅链接标志，源码无 pthread 调用）+ libm + zlib（read.c KSTREAM_INIT + kseq.h 读 .paf/.paf.gz 输入需要 <zlib.h>）。zlib 经 Conan 依赖引入（zlib/1.3.2，制品仓 recipe+binary 均实测可消费），build() 用 -L<zlib libdir> -lz 覆盖 Makefile 默认 LIBS（R26）。"
  - "源码风险审计：全部 11 个 .c + 2 个头文件无 syscall/mmap/dlopen/popen/system 调用；仅 getrusage/gettimeofday（musl 完整支持）；无 SIMD intrinsics；内嵌 ketopt.h 替代 getopt_long。"
  - "上游无正式测试：Makefile 无 test/check 目标；test/C4 仅 33 个 PAF fixture；test/bubble 属 pangene.js（node，不在 CI 矩阵）。README quick-start 已在 test_package 重实现。"
  - "CLI 行为：--version 输出含 '1.1-r231'（pangene.h PG_VERSION）；默认输出 GFA 至 stdout。"
