# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: pangene/1.1
homepage: "https://github.com/lh3/pangene"

# 上游测试命令（经核实不存在正式测试入口）
upstream_check_command: "make test"

# 上游无正式测试（见下方 evidence）；make test/make check 均无构建目标
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 —— 证据如下）
upstream_tests: []

# 上游无测试的证据：
#   - Makefile 仅有 all/clean/depend 目标，无 test/check；实际执行
#     make test / make check 均报
#     "make: *** No rule to make target 'test'.  Stop."
#   - test/C4/ 目录仅含 33 个 fixture 数据文件（*.paf.gz，miniprot PAF
#     比对，8 个灵长类基因组），无脚本、无期望输出文件
#   - test/bubble/ 为 pangene.js（node 辅助脚本）的测试数据，node 不在
#     CI 能力矩阵，pangene.js 非 C 构建产物
#   - 无 tests/ 目录、无 .sh/.py 测试脚本
#   - 仓库无 .github/workflows（v1.1 源码树无 CI 配置）
#   - README quick-start（./pangene test/C4/*.paf.gz > C4.gfa）为唯一
#     官方演示用法，本适配将其重实现于 test_package（C4 fixture 解压为
#     纯文本，zlib gzopen 透明读取），不计入上游正式测试

# test_package 中自带的测试（消费者视角，覆盖上游 quick-start + 核心能力）
test_package_tests:
  - file: "test_pangene.sh"
    description: "5 条断言：--version（1.1-r231）；官方 C4 fixture（33 个 PAF）quick-start 运行 rc=0；输出 GFA 含 S 段行 / L 边行 / W 路径行"
    command: "bash test_pangene.sh"

# 测试断言总数：5
assertion_count: 5
