sources:
  url: "https://github.com/intel/pcm/archive/refs/tags/202502.tar.gz"
  sha256: "431bd5f7122ec909634b02a05ce1eb898834f5c2b19d2804e27f5496cc6eba49"

patches:
  - patch_file: "patches/0001-src-types-h-pcm-cpuid-arch-guard.patch"
    patch_description: "pcm_cpuid(): keep the CPUID instruction on x86 only, report the reserved zero leaf elsewhere"
    patch_type: "portability"
  - patch_file: "patches/0002-src-cpucounters-h-rdtsc-rdtscp-aarch64.patch"
    patch_description: "RDTSC()/RDTSCP(): read the AArch64 virtual counter (CNTVCT_EL0) and TPIDR_EL0 when x86 is unavailable"
    patch_type: "portability"
  - patch_file: "patches/0003-src-utils-h-posix-thread-affinity.patch"
    patch_description: "TemporalThreadAffinity: use POSIX sched_getaffinity()/sched_setaffinity() instead of the glibc-only pthread_*_affinity_np()"
    patch_type: "portability"
  - patch_file: "patches/0004-pthread-cancel-build-time-probe.patch"
    patch_description: "Probe pthread_cancel() at configure time and report the limitation in AsynchronCounterState when the C library omits it"
    patch_type: "portability"
  - patch_file: "patches/0005-examples-c-example-portable-cpu-id.patch"
    patch_description: "examples/c_example.c: keep the RDTSCP CPU-id probe on x86 and use POSIX sched_getcpu() elsewhere"
    patch_type: "portability"
