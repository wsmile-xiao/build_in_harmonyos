# ============================================================
# Build
# ============================================================

build:
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # Conan-provided CMake options
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DCMAKE_INSTALL_SBINDIR=bin"
    - "-DPCM_NO_ASAN=ON"
    - "-DPCM_NO_STATIC_LIBASAN=ON"
    - "-DPCM_BUILD_EXECUTABLES=ON"

  # Declared Conan dependencies (name/version)
  dependencies:
    - simdjson/3.9.5
    - openssl/3.0.21

  # Effective compilers
  cc: clang
  cxx: clang++

