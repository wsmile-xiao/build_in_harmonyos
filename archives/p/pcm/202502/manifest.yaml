# ============================================================

version: "202502"

software: "pcm"

# published | built | failed | archived
# `published` additionally requires `conan upload`, which happens after the PR is
# merged by the release pipeline.
status: built

# YYYY-MM-DD
build_date: "2026-10-04"
build_system: "cmake"

# ============================================================
# Source
# ============================================================

source:
  # Official upstream source (GitHub tag archive 202502)
  url: "https://github.com/intel/pcm/archive/refs/tags/202502.tar.gz"

  # Tarball SHA-256, verified by download on 2026-10-04
  sha256: "431bd5f7122ec909634b02a05ce1eb898834f5c2b19d2804e27f5496cc6eba49"

  # tar.gz | tar.xz | tar.bz2 | zip
