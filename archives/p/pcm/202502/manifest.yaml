  - "0002-src-cpucounters-h-rdtsc-rdtscp-aarch64.patch"
  - "0003-src-utils-h-posix-thread-affinity.patch"
  - "0004-pthread-cancel-build-time-probe.patch"
  - "0005-examples-c-example-portable-cpu-id.patch"

# ============================================================
# Knowledge gained
# ============================================================

knowledge_gained:
  - "Conan 的 CMakeToolchain 把 os=OHOS 映射成 CMAKE_SYSTEM_NAME=HarmonyOS，而 CMake 不认识这个值，上游所有 if(UNIX) 分支会整段消失。配方必须显式 cache_variables['CMAKE_SYSTEM_NAME']='Linux'，因为 HarmonyOS PC 跑的是 Linux 内核与 musl libc，这正是那些分支描述的环境。"
  - "Intel PCM 的 CPU 识别完全建立在 CPUID 指令上。aarch64 没有等价指令，交付必须让 pcm_cpuid() 返回保留的零叶子（而不是编造一个 x86 CPU），工具因此如实打印 'Error: unsupported processor. Only Intel(R) processors are supported'——这条输出本身就是适配正确性的最强断言。"
  - "RDTSC/RDTSCP 在 aarch64 上的架构等价物是虚拟计数器 CNTVCT_EL0；RDTSCP 附带的 TSC_AUX 角色由每线程寄存器 TPIDR_EL0 承担。两次 mrs 之间要插 isb，否则重排可能让读到的是旧上下文里的计数器。"
  - "上游 utils.h 的 TemporalThreadAffinity 用 glibc 专有的 pthread_getaffinity_np()/pthread_setaffinity_np()；musl 系 libc 不提供。POSIX 的 sched_getaffinity(0, ...) / sched_setaffinity(0, ...) 语义等价（pid 0 即调用线程），任何 libc 都有。"
  - "pthread_cancel() 在部分 musl 派生 libc 上不存在，不能假设。把它变成 configure 期的 check_symbol_exists() 探测，缺失时让 AsynchronCounterState 析构函数如实打印限制，比让整个构建失败或假装线程已停更诚实。"
  - "上游 tarball 里 src/simdjson 是空的 git 子模块目录，pcm-raw 必须从制品仓取 simdjson 依赖；否则 CMake 会静默切到 'compiled without simdjson library' 的降级路径，构建照样成功但能力缺失。断言要检查降级提示不出现，而不是检查有提示出现。"
  - "上游把命令行工具装进 CMAKE_INSTALL_SBINDIR，Conan 消费者按标准 bindir 查找；用 tc.cache_variables['CMAKE_INSTALL_SBINDIR']='bin' 拍平，不用打补丁改上游安装规则。"
  - "上游 AddressSanitizer 默认开启，OHOS 镜像不带 sanitizer runtime；用上游自带的 PCM_NO_ASAN / PCM_NO_STATIC_LIBASAN 开关关掉，不需要 patch。"
  - "上游 cmake_minimum_required 低于 CMake 4 的兼容下限，用 CMAKE_POLICY_VERSION_MINIMUM 显式压住，避免为了升 CMake 去改上游工程文件。"
  - "20 个打包产物都只 NEEDED libc.so：Conan 的 simdjson/openssl 发布件提供的是静态库，libc++ 同样是静态的。因此不需要对任何 .so 做 OHOS codesign（codesign 只在包内落地 .so 时才是必需的）。"