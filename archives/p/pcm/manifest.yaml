software: pcm
display: "Intel(R) PCM"
description: "Platform Characterization Monitor: a portable API and tools to monitor performance and energy metrics"
category: utility
homepage: "https://github.com/intel/pcm"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "Intel PCM 面向 Intel x86 CPU：CPU 识别走 CPUID 指令，周期计数器走 RDTSC/RDTSCP，Linux 构建用 glibc 专有的 pthread_getaffinity_np()/pthread_setaffinity_np()。HarmonyOS PC 是 aarch64 + musl 系 libc，需要 5 个可移植性补丁。"
    - "0001 pcm_cpuid() 把 CPUID 指令限制在 x86，非 x86 返回保留的零叶子，绝不伪造 Intel CPU 身份。"
    - "0002 RDTSC()/RDTSCP() 在 aarch64 上改读架构虚拟计数器 CNTVCT_EL0（辅助值取 TPIDR_EL0）。"
    - "0003 TemporalThreadAffinity 改用 POSIX sched_getaffinity()/sched_setaffinity()，这是所有 libc 都有的接口。"
    - "0004 pthread_cancel() 的可用性改为 configure 期特性探测；C 库不提供时 AsynchronCounterState 析构函数如实报告该限制，而不是假装线程已被停掉。"
    - "0005 examples/c_example.c 的 RDTSCP CPU-id 探针在非 x86 上改用 POSIX sched_getcpu()。"
    - "Conan 的 CMakeToolchain 把 OHOS 映射成 CMAKE_SYSTEM_NAME=HarmonyOS，CMake 不认识这个值，UNIX/LINUX 分支会整段消失；配方显式配置成 CMAKE_SYSTEM_NAME=Linux（与 jthread-lite / json11 / qxlsx 同一处置），HarmonyOS PC 跑的是 Linux 内核与 musl libc，正是那些分支描述的环境。"
    - "上游 cmake_minimum_required 低于 CMake 4 的兼容下限，用 CMAKE_POLICY_VERSION_MINIMUM 显式压住，不改上游工程文件。"
    - "上游把命令行工具装进 CMAKE_INSTALL_SBINDIR，配方改成 bin，让 Conan 消费者按标准 bindir 找到。"
  common_dependencies:
    - simdjson
    - openssl

versions:
  "202502":
    status: built
    build_date: "2026-10-04"