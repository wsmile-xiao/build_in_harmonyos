# test_package/MANIFEST.yml
package: pngtools/1.2
homepage: "https://github.com/mikalstill/pngtools"

upstream_check_command: "python3 test_package/run_upstream_tests.py --source . --build-dir ."
upstream_test_in_build: true
upstream_test_command: "python3 test_package/run_upstream_tests.py --source . --build-dir ."

upstream_tests:
  - file: tests/test_pngchunkdesc.py
    source: pngtools-1.2/tests/test_pngchunkdesc.py
    description: "pngchunkdesc chunk-name property tests"
    command: "python3 test_package/run_upstream_tests.py --source . --build-dir ."
  - file: tests/test_pngchunks.py
    source: pngtools-1.2/tests/test_pngchunks.py
    description: "pngchunks raw chunk parser tests"
    command: "python3 test_package/run_upstream_tests.py --source . --build-dir ."
  - file: tests/test_pngcp.py
    source: pngtools-1.2/tests/test_pngcp.py
    description: "pngcp copy and conversion tests"
    command: "python3 test_package/run_upstream_tests.py --source . --build-dir ."
  - file: tests/test_pnginfo.py
    source: pngtools-1.2/tests/test_pnginfo.py
    description: "pnginfo metadata and bitmap tests"
    command: "python3 test_package/run_upstream_tests.py --source . --build-dir ."

test_package_tests:
  - file: test_smoke.py
    description: "installed four-tool consumer smoke test"
    command: "python3 test_smoke.py <package>/bin"

assertion_count: 139
