  - ref: E004
    note: "四个工具动态链接 libpng；测试运行期若不提供 libpng 的库目录，会以 'Error loading shared library libpng16.so.16' 与 'symbol not found' 失败。test_package 通过 conanrun 运行环境提供运行时库路径。"
  - ref: E077
    note: "HarmonyOS 需要有效 ELF 签名才能执行；打包阶段在 binary-sign-tool 与 llvm-objcopy 可用时执行去签名 + 自签，签名后重新 chmod 0755。"
  - "上游测试使用 testtools + stestr + fixtures + Pillow，而不是 make check；设备未提供这些 Python 包，配方附带最小 stdlib 兼容层并生成等价 PNG fixture，测试模块与断言原样执行。"
  - "上游源码只发布 configure.ac，未附生成的 configure；配方直接调用 Conan profile 中的 OHOS clang 编译四个工具，不硬编码 SDK 路径。"

