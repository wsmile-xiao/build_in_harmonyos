software: pngtools
display: "pngtools"
description: "Command-line tools for inspecting and manipulating PNG files"
category: utility
homepage: "https://github.com/mikalstill/pngtools"
license: GPL-2.0-only
build_system: custom

ohos_adaptation:
  key_points:
    - "上游发布包只带 configure.ac，未附生成的 configure；配方直接使用 Conan profile 提供的 OHOS clang 编译 pnginfo、pngchunks、pngchunkdesc、pngcp 四个工具。"
    - "四个工具动态链接 libpng；test_package 在 conanrun 运行环境下执行，避免 'Error loading shared library libpng16.so.16' 与 'symbol not found'。"
    - "上游测试基于 testtools + stestr + fixtures + Pillow；配方附带最小 stdlib 兼容层与等价 PNG fixture 生成器，tests/test_*.py 不做改动。"
    - "HarmonyOS 需要有效 ELF 签名，打包时在签名工具可用的情况下对四个 ELF 自签并恢复 0755 权限。"
  common_dependencies:
    - libpng

versions:
  "1.2":
    status: built
    build_date: "2026-09-24"
    conan_ref: "pngtools/1.2"
