# test_package/MANIFEST.yml — pathie-cpp 0.1.1 上游测试声明
# CI 脚本 (ci/conan/build_and_test.sh L0e/L1) 强制要求此文件存在
# 详见 docs/TEST_QUALITY_SPEC.md §3 / §4
#
# 统计口径（四口径不混用，N 取候选数法最大值，见 AGENTS §3.5）:
#   1) 源码断言点数   = test/*.cpp 中 EQUAL/IS_TRUE/IS_FALSE/SKIP/assert_exception
#                       宏调用 306 + 手写 std::cout<<"Expecting…" 行 1        = 307
#   2) 本平台构建产物可达断言点（UNIX 预处理可达，encodings.cpp 已按上游
#      Rakefile 同款理由剔除）                                            = 248
#   3) 实跑断言点数（build() 逐行统计，剔除手写行后为宏 245 + 手写 1）      = 246
#   4) 消费者断言数（test_package/consumer.cpp 的 check() 条目）            = 14
#      （不进上游分母）
#   N = max(307, 248, 246, 14) = 307；N′ = 246；差额 61 逐项归因见下。

package: pathie-cpp/0.1.1
homepage: "https://github.com/Quintus/pathie-cpp"

# 上游测试入口（上游 CMake 未注册 CTest；test/*.cpp 由 patch 0001 接到
# CMake 目标上，conanfile.py build() 内执行，见 notes.md「测试怎么跑」）
upstream_check_command: "./path.test && ./pathie_streams.test"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./path.test && ./pathie_streams.test"

# 上游实际运行的测试（按源文件分组；行值 = 该文件的断言点数 / 实跑数）
upstream_tests:
  - file: test/path.cpp
    source: pathie-cpp-0.1.1/test/path.cpp
    description: "Path 类单元测试（27 个 test_* 函数；源码断言点 285 = 宏 284 + 手写 1，实跑 226，其余 59 条为 _WIN32 分支 57 + 运行期互斥分支 2）"
    command: "./path.test"
  - file: test/pathie_streams.cpp
    source: pathie-cpp-0.1.1/test/pathie_streams.cpp
    description: "流替换组件（Pathie::ifstream/ofstream）读写回环（源码断言点 20，实跑 20，需 PATHIE_BUILD_STREAM_REPLACEMENTS=ON 才链接得上）"
    command: "./pathie_streams.test"
  - file: test/encodings.cpp
    source: pathie-cpp-0.1.1/test/encodings.cpp
    description: "iconv 转码测试（源码断言点 2）——上游 test/Rakefile 无条件 SOURCES.delete(\"encodings.test\")；该 TU 独立编译实测 2 errors（testhelpers.hpp 缺 <fstream> 与 Pathie::Path 前置包含），与上游剔除行为一致 → NOT_RUN 2"

# test_package 中自带的测试（消费者视角验证，计入「鸿蒙特有测试」行，不进上游分母）
test_package_tests:
  - file: consumer.cpp
    description: "消费者测试：经 CMakeDeps 目标 Pathie::Pathie 链接并运行——版本接口 / 路径归一 / basename·dirname·extension / 绝对相对 / join·prune / native 回转 / iconv 转码 / 流替换读写回环 / 目录建删（14 条 check 断言）"
    command: "./test_pathie_cpp"

# ── 计数（同一统计单位；上游/适配后两表同口径）──
upstream_test_case_count: 307
upstream_test_case_count_unit: "断言点（test/*.cpp：EQUAL 224 + IS_TRUE 43 + IS_FALSE 34 + SKIP 1 + assert_exception 4 = 306 宏，加 test/path.cpp 手写 Expecting 行 1）"
upstream_test_count_command: 'grep -o -E "\b(EQUAL|IS_TRUE|IS_FALSE|SKIP|assert_exception)[[:space:]]*\(" test/*.cpp | wc -l   # 306；grep -c "Expecting" test/path.cpp # 1'
upstream_runner_registered_case_count: 248
upstream_runner_registered_case_count_unit: "本平台构建产物可达断言点（UNIX 预处理可达 250，扣除上游剔除且不可独立编译的 encodings.cpp 2）"
upstream_test_passed_count: 245
upstream_test_failed_count: 1
upstream_test_skipped_count: 0
upstream_test_not_run_count: 61
upstream_test_not_run_breakdown: "_WIN32/条件编译分支 57（test_system_paths 28 / test_prune 10 / test_relative_absolute 4 / test_expand 4 / test_unc_path_sanitize 4 / test_stat 2 / test_parent 2 / test_sanitizer 1 / test_root 1 / test_native 1）+ 上游剔除的 encodings.cpp 2 + 运行期互斥分支 2（XDG_RUNTIME_DIR 有无二选一、/run 存在与否二选一）"
upstream_test_executed_count: 246
upstream_test_total_count: 307
upstream_assertion_count: 307
upstream_assertion_count_unit: "同 upstream_test_case_count_unit（本套件每条断言恰输出一行结果，无独立 assertion 框架）"
test_package_case_count: 14
test_package_case_count_unit: "test_package/consumer.cpp 的 check() 断言条目（鸿蒙特有测试行）"
test_package_passed_count: 14
test_package_failed_count: 0
test_package_not_run_count: 0

# 已知平台限制（唯一 1 条 FAIL，勿改写为 PASS）
known_platform_failures:
  - assertion: "test/system_paths: IS_FALSE(p_stat->st_mode & S_IRGRP)（test/path.cpp:504）"
    evidence: "本设备用户可写文件系统目录恒为 2771 且 chmod() 无效：mkdir→2771、chmod(0700)→仍 2771（python3 实测 IRGRP=True）；/data/local/tmp、/dev/shm、/mnt、/data/app 全部 EACCES 不可写，不存在可规避的挂载点"
    impact: "1 条断言（占上游 307 的 0.33%），同一 mktmpdir() 的其余 6 条断言（exists / S_ISDIR / IRWXU / IROTH / rmtree）全部通过"

# 测试断言总数（>0 是提交前 checklist 项；= 上游 307 + 消费者 14）
assertion_count: 321
