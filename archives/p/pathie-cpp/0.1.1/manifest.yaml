# 版本级 manifest — pathie-cpp 0.1.1
# 文件位置: archives/p/pathie-cpp/0.1.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1.1"

# 软件名
software: "pathie-cpp"

# 编译状态
# published | built | failed | archived
# （O5: 未合并且未确认 release upload 前一律 built）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档，唯一 URL、无镜像域名）
  url: "https://github.com/Quintus/pathie-cpp/archive/refs/tags/v0.1.1.tar.gz"

  # 源码校验和（与 CCI conan-center-index recipes/pathie-cpp/all/conandata.yml 逐字一致）
  sha256: "7c2cca0c52ad80792bf6dbeb74213c1791fe9e599058765f5b81fd00f53eb2d3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表（conanfile.py generate() 注入的 CMake 缓存变量）
  configure_options:
    - "-DCMAKE_BUILD_SHARED_LIBS=OFF"
    - "-DPATHIE_BUILD_STREAM_REPLACEMENTS=ON"
    - "-DPATHIE_BUILD_TESTS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  # 上游 0 运行时依赖（W0: ci/scripts/preflight_check.sh 实测「预检通过（无依赖需要检查」）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本版本 2 个，均为测试接线/测试可运行性，零平台宏注入）
patches_applied:
  - "0001-enable-cmake-upstream-tests.patch"
  - "0002-test-prefix-increment-readable-dir.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（§3.8: engine 未命中 ⇒ 才写草稿；全程零草稿为正常终态）
knowledge_gained: []
