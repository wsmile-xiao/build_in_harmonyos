software: perl-net-sftp-foreign
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.93-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.93-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"
compile_date: "2026-06-26"

# 构建系统类型（顶级字段，供自检使用）
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SA/SALVA/Net-SFTP-Foreign-1.93.tar.gz"

  # 源码校验和
  sha256: "6c7d64250876873da434800e5060a8bef7a46451d81f817e37e43cfda51a0f7a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # Net::SFTP::Foreign 是纯 Perl 模块，所有依赖（Scalar::Util,
  # Time::HiRes, Test::More 等）均为 Perl 核心模块，无需外部依赖

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 Perl 模块，无需任何补丁即可在鸿蒙平台编译

# ============================================================
# 知识沉淀
# ============================================================

# 测试结果
test_results:
  passed: 14
  failed: 0
  note: "全部 14 项功能测试通过 (模块加载、API方法、对象创建、Backend、常量、属性、本地文件、Compat、Buffer、错误处理、核心依赖、SELinux、SFTP命令)"

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS/C 代码）在鸿蒙平台可直接编译，无需补丁或平台适配"
  - "ExtUtils::MakeMaker 构建系统通过 perl Makefile PL && make && make install 即可完成安装"
  - "纯 Perl 模块不受 SELinux HMDFS 限制影响（与 perl-dbd-pg 的 XS 模块不同），可从用户目录直接加载"
  - "Conan 配方中 package() 需从 site_perl 目录提取 .pm 文件到 lib/，通过 PERL5LIB 环境变量实现模块发现"
  - "conan-verify 全部门禁通过（G0-G4, L2/L4/L5），纯 Perl 包无 ELF 产物，G3/L4 自动跳过"
