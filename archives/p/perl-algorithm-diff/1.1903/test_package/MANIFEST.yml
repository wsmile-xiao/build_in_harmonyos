# test_package/MANIFEST.yml — perl-algorithm-diff 1.1903
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-algorithm-diff/1.1903
homepage: "https://metacpan.org/pod/Algorithm::Diff"

# 上游测试套件：t/ 目录 2 个 .t 测试文件（base.t + oo.t，prove 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Algorithm-Diff-1.1903/t/*.t
    description: "2 个 .t 测试文件：本地实测 1004/1004（100%），零失败"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Algorithm::Diff + diff）
test_package_tests:
  - file: test_algorithm_diff.py
    description: "Loads packaged Algorithm::Diff via perl -I<lib> and computes a real diff between two arrays"
    command: "python3 test_algorithm_diff.py"

# 断言总数：1（diff 计算校验）
assertion_count: 1
