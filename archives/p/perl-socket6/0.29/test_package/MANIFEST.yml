# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-socket6/0.29
homepage: https://metacpan.org/release/Socket6

# 上游测试命令 (Perl 标准 make test)
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游源码自带的测试 (t/ 目录)
upstream_tests:
  - file: t/use.t
    description: "Socket6 模块加载 + getaddrinfo + getnameinfo + inet_pton/inet_ntop IPv6 地址转换测试 (9 项断言)"
    command: "perl -Iblib/lib -Iblib/arch t/use.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Conan L1 测试: 验证包包含 Socket6.pm 和 Socket6.so，ELF 头检查，运行时模块加载尝试"
    command: "conan test test_package/conanfile.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
