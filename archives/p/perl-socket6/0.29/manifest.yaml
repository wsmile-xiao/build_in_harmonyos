software: perl-socket6
# 版本级 manifest
# 文件位置: archives/p/perl-socket6/0.29/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.29"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/U/UM/UMEMOTO/Socket6-0.29.tar.gz"

  # 源码校验和
  sha256: "468915fa3a04dcf6574fc957eff495915e24569434970c91ee8e4e1459fc9114"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 特殊链接参数（绕过 CRT 文件缺失）
  link_options:
    - "-nostartfiles -nodefaultlibs -lc"

  # 编译依赖列表
  dependencies:
    - perl/5.42.0 (Perl 运行时和 ExtUtils::MakeMaker)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "Makefile.PL: 跳过 autotools configure（HMDFS config.status 问题），手动创建 config.pl 和 config.h"
  - "Makefile.PL: 添加 dynamic_lib => { OTHERLDFLAGS => '-nostartfiles -nodefaultlibs -lc' }（绕过 CRT 文件缺失）"

patch_generation:
  method: diff
  source_orig_dir: conan-cache-source
  source_work_dir: conan-cache-build
  generated_at: '2026-07-02'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.PL.patch
    type: auto
    platform_only: True
    guard: 'pending'

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Socket6 使用 autotools configure 检测系统功能，但 config.status 在 HMDFS 上失败"
  - "手动创建 config.pl 和 config.h 可绕过 autotools configure 失败"
  - "鸿蒙系统缺少 CRT 文件（crti.o, crtn.o），XS 模块链接需要 -nostartfiles -nodefaultlibs -lc"
  - "SELinux HMDFS 限制：动态库只能从 /data/service/hnp/ 路径加载（hnp_file 上下文）"
  - "Socket6.so 仅依赖 libc.so，符号包括 getaddrinfo/getnameinfo/inet_pton/inet_ntop 等 IPv6 函数"
