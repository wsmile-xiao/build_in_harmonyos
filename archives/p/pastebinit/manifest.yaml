software: pastebinit
display: "pastebinit"
description: "命令行 pastebin 客户端"
category: tools
homepage: "https://launchpad.net/pastebinit"
license: GPL-2.0+
build_system: make

ohos_adaptation:
  key_points:
    - "纯 Python3 脚本工具，无 C/C++ 编译步骤"
    - "使用 msgfmt 编译 .po 翻译文件为 .mo"
    - "可选依赖 distro 模块用于检测 OS 并设置默认 pastebin"
  common_dependencies:
    - "distro/1.9.0"

versions:
  "1.8.0":
    status: built
    build_date: "2026-09-04"
    published_as: pastebinit
    source_url: "https://deb.debian.org/debian/pool/main/p/pastebinit/pastebinit_1.8.0.orig.tar.gz"
