# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md 与 docs/ADAPTATION_GUIDE.md §6

package: pastebinit/1.8.0
homepage: "https://launchpad.net/pastebinit"

# 上游测试命令 — pastebinit 上游使用 test.sh (shell 集成测试)
upstream_check_command: "bash test.sh"
upstream_test_in_build: true
upstream_test_command: "sh test.sh"

# 上游实际运行的测试程序
upstream_tests:
  - file: test.sh
    source: pastebinit_1.8.0.orig.tar.gz/test.sh
    description: "上游 shell 集成测试: 遍历 13 个 pastebin 服务，发送文本并验证 (patched: python->python3, wget->curl)"
    command: "sh test.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pastebinit.sh
    description: "消费者测试 — 验证 pastebinit -h (帮助), -v (版本), -l (列表) 正常工作"
    command: "sh test_pastebinit.sh <pastebinit binary>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
