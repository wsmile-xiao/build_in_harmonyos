notes: |
  Pure Python3 command-line script tool; no C/C++ compilation.
  Build step compiles .po translation files to .mo via msgfmt.
  Depends on distro/1.9.0 for OS detection (optional at runtime,
  declared as Conan requirement per task specification).
  Upstream Makefile uses `install` command (unavailable on OHOS);
  conanfile uses shutil for manual packaging instead.
