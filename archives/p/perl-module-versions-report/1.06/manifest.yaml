software: perl-module-versions-report
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.06/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.06"

# 构建系统类型（顶层字段，供 verify 检查）
build_system: perl-makefile-pl

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"
compile_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/J/JE/JESSE/Module-Versions-Report-1.06.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl-makefile-pl

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Pure Perl 模块在 OpenHarmony 上无需特殊适配，perl Makefile.PL PREFIX=... && make && make install 即可"
  - "参考 perl-dbd-pg 经验：纯 Perl 模块不受 SELinux/HMDFS 限制，仅 XS 模块需要 -nostartfiles -nodefaultlibs -lc 链接参数"
  - "模块通过 END block 自动输出报告，use Module::Versions::Report () 不触发，use Module::Versions::Report 触发"
  - "Perl 5.42.0 在 OpenHarmony 上完整支持模块的 report() 和 print_report() 函数"
