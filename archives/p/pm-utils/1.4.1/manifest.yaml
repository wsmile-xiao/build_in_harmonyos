software: pm-utils
display: "pm-utils"
description: "Power-management utilities for Intel platforms: pm-pmu reads the intel_pstate runtime status, pm-reset-swap clears a stale swap signature"
category: utils
homepage: "https://sources.debian.org/src/pm-utils/1.4.1/"
license: GPL-2.0-or-later
build_system: make  # 上游 autotools 只为生成 config.h 探测 HAVE_* 宏；两个程序无条件编译分支，故不跑 configure 直编

ohos_adaptation:
  key_points:
    - "两个源文件（src/pm-pmu.c 2.7KB + src/pm-reset-swap.c 4.4KB），零外部依赖"
    - "仅 libc：stdio、stdlib、string、unistd、errno，全部由 OHOS sysroot 自带"
    - "★ 零 patch：两个二进制一次 clang-ohos 交叉编译通过，产物 ELF64/AArch64，NEEDED 均仅 libc.so"
    - "★ 不跑上游 configure：autotools 的 configure 阶段唯一作用是生成 config.h 探测 HAVE_* 宏，而两个程序都没有条件编译分支。少一层 configure 依赖，也少一层跨编译不确定性"
    - "★ 工作目标 /sys/devices/system/cpu/intel_pstate/ 是 Intel P-state 专用节点，OHOS PC 上不存在；两个工具走的是优雅降级分支，这是真实行为而非缺陷，测试正是把它钉死"
    - "★ pm-reset-swap 的退出码分三档：0（可读且像合法 swap 签名，如 /dev/zero）/ 1（打不开，如 -h 被当设备节点、/nonexistent）/ 2（能打开但取签名失败，如 /dev/null）"
    - "★ pm-pmu 只接受长选项 --help，-h 不被接受（退出码 1）"
    - "不安装 systemd unit / udev 规则：那些是发行版打包的事"
  common_dependencies:
    - libc (stdio, stdlib, string, unistd, errno)

patches: []

versions:
  "1.4.1":
    status: built
    build_date: "2026-10-04"
    source_url: "https://deb.debian.org/debian/pool/main/p/pm-utils/pm-utils_1.4.1.orig.tar.gz"
    source_sha256: "8ed899032866d88b2933a1d34cc75e8ae42dcde20e1cc21836baaae3d4370c0b"
    test_assertions: 22
