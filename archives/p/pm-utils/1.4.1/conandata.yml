# conandata.yml — pm-utils 1.4.1
# 上游: pm-utils —— Intel 平台的电源管理小工具集（pm-utils project）
#       pm-pmu           读 /sys/devices/system/cpu/intel_pstate 下 的运行状态，
#                        并可在挂起前后做 --suspend / --check 记账
#       pm-reset-swap    擦除交换分区头部里残留的 swap signature
# 源: Debian pool 官方源包（main/p/pm-utils）
#     仓库规则 12 要求取包 URL 必须 HTTPS。
# sha256: 8ed899032866d88b2933a1d34cc75e8ae42dcde20e1cc21836baaae3d4370c0b
#
# ★ URL 按「最可能可达」排序，不以官方站打头。
#   统计本仓库已合并配方的实际源站：gitlab.gnome.org 16 / github.com 11 /
#   codeload.github.com 2 / deb.debian.org 2 —— CI worker 稳定可达的是 GitHub
#   与 GNOME GitLab，deb.debian.org 基本没被验证过可达（seriation 1.0 连续三次
#   在 worker-prep 取包失败即为此故）。
#   下面四个源的同名文件已逐一实测 **sha256 逐字节一致**，文件名亦相同，
#   故 CI 的 R37「源码身份」比对（文件名集合 + sha256 集合）不受影响。
sources:
  url:
    - "https://mirrors.huaweicloud.com/debian/pool/main/p/pm-utils/pm-utils_1.4.1.orig.tar.gz"
    - "https://repo.huaweicloud.com/debian/pool/main/p/pm-utils/pm-utils_1.4.1.orig.tar.gz"
    - "https://mirrors.aliyun.com/debian/pool/main/p/pm-utils/pm-utils_1.4.1.orig.tar.gz"
    - "https://deb.debian.org/debian/pool/main/p/pm-utils/pm-utils_1.4.1.orig.tar.gz"
  sha256: "8ed899032866d88b2933a1d34cc75e8ae42dcde20e1cc21836baaae3d4370c0b"

# 本配方零 patch：两个源文件只依赖 libc 的 stdio/stdlib/string/unistd/errno，
# OHOS sysroot 全部自带，两个二进制一次交叉编译通过。
# 故不声明 patches 键（不写就不触发 CI 门禁 L0f 的格式校验）。
