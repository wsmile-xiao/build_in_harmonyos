# test_package/MANIFEST.yml — pm-utils 1.4.1
package: pm-utils/1.4.1
homepage: "https://sources.debian.org/src/pm-utils/1.4.1/"

# 上游无独立测试套件：pm-utils 的 autotools 只有 pm-pmu / pm-reset-swap 两个
# 程序目标，没有 check/test 目标，原包也没有任何测试脚本或期望输出。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_pm_utils.c
    description: >-
      消费者测试 22 条断言。两个产物都是可执行程序、没有可链接的库 API，所以
      用例按"该程序的真实调用方式"验证：把包内 bin/ 下的 pm-pmu 与
      pm-reset-swap 以子进程拉起，断言其诊断文本与退出码。
      ★ 零特权、零硬件：pm-pmu 的工作目标 /sys/devices/system/cpu/intel_pstate/
        是 Intel P-state 专用节点，OHOS PC 上并不存在，所以走的正是"优雅降级"
        分支——这不是缺陷而是真实行为，本组用例正是把它钉死。
      (A) pm-pmu 参数解析：无参数 → 退出码 1 + `usage: pm-pmu --suspend |
          --check`；--help → 退出码 0（OHOS 上唯一成功的参数）且仍打印用法行；
          -h **不被接受**（退出码 1）—— 只有长选项 --help 有效；未知选项
          退出码 1；
      (B) pm-pmu 的降级路径：--suspend 与 --check 均退出码 1 且**不打印用法行**
          （是"执行失败"而非"参数没解析对"，靠这条把两种失败区分开）；
          连跑两次 --check 退出码必须一致（不 flaky）；
      (C) pm-reset-swap 的**三档退出码阶梯**——本组最值得断言的地方：
          · 无参数 → 退出码 1 + `usage: pm-reset-swap <device node>`；
            --help → 退出码 0；
          · -h 不被当成帮助：pm-reset-swap 把参数一律当设备节点，故
            退出码 1 + `Could not open "-h": No such file or directory`
            （诊断里带引号且带 errno 文本）；/nonexistent 同为退出码 1；
          · /dev/null 能打开但取 swap 签名失败 → **第三档退出码 2** +
            `for swap signature` 诊断；
          · /dev/zero 读出来全是零，恰好匹配合法 swap 签名 → **退出码 0**。
      全部期望文本与期望退出码取自 qemu-aarch64 + OHOS sysroot 下的**实测输出**。
    command: "test_pm_utils <package_root>"

# 测试断言总数
assertion_count: 22
