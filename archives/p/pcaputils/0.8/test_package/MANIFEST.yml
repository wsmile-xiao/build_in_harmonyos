# test_package/MANIFEST.yml — pcaputils 0.8
# CI L0e 强制要求本文件存在并声明上游测试类型
package: pcaputils/0.8
homepage: "https://download.savannah.nongnu.org/releases/pcaputils/"

# 上游构建系统（CI 据此选择测试执行方式）
upstream:
  build_system: makefile
  # 测试类型: make_check | ctest | meson_test | pytest | none
  # pcaputils 上游无 tests/ 目录、无 make check 目标，仅提供 CLI 工具
  test_type: none
  test_command: "make"
  test_directory: "."

# OHOS 平台兼容性
ohos_compatibility:
  status: full
  detail: "真机 conan create 通过，4 个 ELF aarch64 动态链接二进制产出，L1 冒烟全部打印 Usage 并退出（2026-09-26）"
  verified_features:
    - "pcapdump/pcapip/pcappick/pcapuc 均链接 libpcap+libJudy 成功启动"
    - "无 patch 编译通过（OHOS clang/musl 提供 execinfo.h）"

# Conan test_package 测试（L1 最小冒烟，CI 通过 conan create 自动执行）
conan_test:
  type: smoke
  description: "逐个运行 pcapdump/pcapip/pcappick/pcapuc 无参数，断言打印 Usage banner"
  test_method: "工具检测到缺少抓包源后打印 Usage 并退出非零；证明二进制动态链接 libpcap/Judy 成功并到达自身代码路径"
