software: pcaputils
display: "pcaputils"
description: "nongnu/Savannah pcap 抓包命令行工具集"
category: network-tool
homepage: "https://download.savannah.nongnu.org/releases/pcaputils/"
license: "MIT"
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile（无 configure/CMake），CC 硬编码 gcc、无 install 目标，配方在命令行覆盖 CC/AR/CFLAGS/LF_ALL 并手工拷贝 4 个 CLI 到 bin/"
    - "依赖 libpcap/1.10.6 + judy/1.0.5（均已发布）；pcapdump/pcappick 仅 -lpcap，pcapip/pcapuc 额外 -lJudy"
    - "真机 conan create + L1 冒烟已通过（2026-09-26，OHOS aarch64），无需 patch"
  common_dependencies:
    - "libpcap"
    - "judy"

versions:
  "0.8":
    status: built
    build_date: "2026-09-26"
    conan_ref: "pcaputils/0.8"
