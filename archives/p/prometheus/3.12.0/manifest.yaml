software: prometheus
# 版本级 manifest 模板
# 文件位置: archives/p/prometheus/3.12.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.12.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: prebuilt/go

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/prometheus/prometheus/archive/refs/tags/v3.12.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | go | prebuilt/go
  system: prebuilt/go

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOPROXY=https://goproxy.cn,direct"
    - "GOTOOLCHAIN=local"
    - "GONOSUMCHECK=*"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "goenv/3.1.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无源码补丁，使用官方预编译二进制适配方案

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go runtime 内部冲突导致本地编译失败，需使用预编译二进制适配 (ref: E001)"
  - "HarmonyOS hmdfs/tmpfs 不支持 fallocate，Go linker mmap 失败 (ref: E008)"
  - "prometheus 是 Go 项目，使用官方预编译 linux-arm64 二进制 + sign-elf 签名 (ref: E077)"