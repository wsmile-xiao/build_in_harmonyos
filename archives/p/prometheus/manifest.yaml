software: prometheus
# 软件级 manifest
# 文件位置: archives/p/prometheus/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

description: "Prometheus is an open-source monitoring and alerting toolkit designed for reliability and scalability"
category: network

homepage: "https://prometheus.io/"
license: Apache-2.0

build_system: prebuilt/go

ohos_adaptation:
  key_points:
    - "Go runtime 内部冲突导致本地编译失败"
    - "HMDFS fallocate 限制导致 Go linker mmap 失败"
    - "使用官方预编译 linux-arm64 二进制 + sign-elf 签名"
  common_dependencies:
    - goenv

versions:
  "3.12.0":
    status: built
    build_date: "2026-06-09"
    notes: "使用官方预编译二进制，本地编译因 runtime 冲突和 HMDFS 限制失败"
