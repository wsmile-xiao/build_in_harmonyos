software: perl-protocol-http2
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/C/CR/CRUX/Protocol-HTTP2-1.11.tar.gz"

  # 源码校验和
  sha256: "569f05b1abe997b507c8251530cc81d1ee96bd932cc682534b6ce48653500913"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl-eumm
  system: perl-eumm

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Module::Build::Tiny 在鸿蒙平台不可用时，可创建标准 Makefile.PL 使用 ExtUtils::MakeMaker 替代"
  - "纯 Perl 模块无 C/XS 编译，无需静态链接检查，G3/L4 门禁自动跳过"
  - "SSL 证书验证失败时可用 curl -k 下载 CPAN tarball"
  - "可选测试依赖（AnyEvent, Test::LeakTrace）未安装不影响模块核心功能，测试跳过可接受"
  - "conanfile.py 的 build() 方法应自动检测 Makefile.PL 是否存在，不存在则动态创建"
  - "Perl 模块 package_info 应设置 cpp_info.libs=[] 和 runenv_info PERL5LIB 路径"
