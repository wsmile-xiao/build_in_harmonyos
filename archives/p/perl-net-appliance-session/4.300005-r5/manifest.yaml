software: perl-net-appliance-session
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.300005-r5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.300005-r5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/O/OL/OLIVER/Net-Appliance-Session-4.300005.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl-module-build
  system: perl-module-build
  build_system: perl-module-build

  # 配置选项列表
  configure_options:
    - "perl Build.PL --prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-net-cli-interact/2.300003"
    - "perl-io-prompt-tiny/0.003"
    - "perl-term-readpassword/0.11"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（Module::Build 构建）在鸿蒙平台编译无需修改源码"
  - "IO::Tty XS 依赖受 SELinux HMDFS 限制，与 perl-dbd-pg 的 DBI.so/Pg.so 限制相同"
  - "PurePerl 模块本身不受 SELinux 限制，模块加载和 API 调用正常"
  - "G0 clean-verify 的 configure 步骤因 Python subprocess shell 引号问题失败，手动验证通过"
  - "IPC::Run waitpid 警告为平台 syscall 差异，非致命不影响功能"
  - "Net::CLI::Interact 后端可用，SSH/Serial 传输对象创建成功"
