# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: performance/0.6.0
homepage: "https://gnustep.github.io/"

# 上游测试命令 (GNUstep Performance 无 make check 测试套件)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# Performance 0.6.0 源码包仅含库源码与头文件（GSCache/GSTicker/GSFIFO 等），
# 无独立测试目录或 make check 目标。按积分赛模板"上游无测试用例需补全"要求，
# 由 test_package 提供消费者测试验证核心功能。
upstream_tests:
  - name: "upstream-test-suite"
    discovered: 0
    note: "GNUstep Performance 上游无独立自动化测试套件"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_performance.m
    description: "消费者测试: GSCache 缓存操作/GSTicker 类解析/C 支撑函数引用"
    command: "./test_performance"

# 构建方式说明: 本 test_package 使用直接 clang 编译(本机 cmake 需系统
# libc++_shared.so 而加载失败), 与主配方验证过的工具链一致
build_method: direct-clang

# 测试断言总数
assertion_count: 7