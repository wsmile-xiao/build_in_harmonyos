version: "0.6.0"
software: "performance"
status: adapted
build_date: "2026-09-08"
build_system: "gnustep-make"

source:
  url: "https://github.com/gnustep/libs-performance/releases/download/performance-0_6_0/Performance-0.6.0.tar.gz"
  sha256: "cc1ec0dbc6157eb5680bfedbe5d47f45f94772bca41a782d587d1b994f42a66f"
  tar_format: tar.gz

build:
  system: "gnustep-make"
  dependencies:
    - "gnustep-base/1.31.1"
    - "libobjc2/2.2.1"
  tool_requires:
    - "gnustep-make/2.9.2.1"

tests:
  upstream_tests_discovered: false
  upstream_tests_count: 0
  upstream_tests_note: "GNUstep Performance 上游无独立自动化测试套件（源码包仅含库源码与头文件），以 test_package 消费者测试验证核心功能"
  upstream_tests_executed: 0
  consumer_test: "Objective-C consumer test in test_package (GSCache/GSTicker 核心功能断言)"

notes:
  - "Performance 是 SQLClient 的硬依赖（-lPerformance，源码 #import <Performance/GSCache.h>），须先于 SQLClient 合入发布"
  - "纯 GNUstep make 构建（无 autotools configure），仅依赖 Foundation（gnustep-base）与 libobjc2"
  - "主库 libPerformance.so 由 gnustep-make 构建，产物别名用 copyfile 生成（hmdfs ln 限制）"