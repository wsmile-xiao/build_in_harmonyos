# conandata.yml — paxtest 0.9.15
# 上游: PaX Team（grsecurity）官方仓库 opensrcsec/paxtest，tag paxtest-0.9.15
# 源码 URL: codeload.github.com 是 GitHub 官方归档端点（/archive/refs/tags/ 的直达下载域）。
# 版本口径: 上游官网 pax.grsecurity.net 只列到 0.9.7-pre4；0.9.15 的官方发布位于 Git 仓库
#           tag（0.9.15 为上游末版，2016）。该 tag 的归档与 Debian 的 orig 解包后逐文件一致
#           （真机 diff -r 实测仅差 gzip 封装），故采用官方 tag 归档端点作为源。
# 补丁: 0001-0004 为 chpax-0.7 的 a.out 支持移除（musl 系 sysroot 无 <a.out.h>）；
#       0005 为 shellcode.h 的 aarch64 分支（ARM64 ret，恢复 exec 系测试的正判定能力）。

sources:
  url: "https://codeload.github.com/opensrcsec/paxtest/tar.gz/refs/tags/paxtest-0.9.15"
  # codeload URL 末段是 tag（无扩展名），显式 filename 保证按 tar.gz 解压（与仓库 codeload 先例同法）
  filename: "paxtest-0.9.15.tar.gz"
  sha256: "51fe6c1eef8050fa73f2a8e620cf70a5a34a79d68cb22d07b941cf8e6c0677e7"

patches:
  - patch_file: "patches/0001-chpax-0.7-aout.c.patch"
    patch_description: >-
      移除 chpax-0.7 中已废弃的 a.out（pre-ELF）支持：aout.c 的 get_flags_aout/
      put_flags_aout 函数体删除（musl 系 sysroot 不提供 <a.out.h>，且 aarch64 上
      不存在 a.out 二进制）。文件保留以维持上游 Makefile.psm 的源列表不变。
    patch_type: "portability"
  - patch_file: "patches/0002-chpax-0.7-chpax.c.patch"
    patch_description: >-
      chpax.c 侧：删除全局 `struct exec header_aout;` 定义（a.out 支持移除的组成
      部分，见 0001）。
    patch_type: "portability"
  - patch_file: "patches/0003-chpax-0.7-chpax.h.patch"
    patch_description: >-
      chpax.h 侧：删除 `#include <a.out.h>` 与 header_aout 外部声明及
      get_flags_aout/put_flags_aout 原型（a.out 支持移除的组成部分，见 0001）。
    patch_type: "portability"
  - patch_file: "patches/0004-chpax-0.7-io.c.patch"
    patch_description: >-
      io.c 侧：删除 header_aout 拷贝与 a.out 魔数（NMAGIC/ZMAGIC/QMAGIC）检测分支
      （a.out 支持移除的组成部分，见 0001）；未知格式现统一按 “Unknown file type”
      处理。
    patch_type: "portability"
  - patch_file: "patches/0005-shellcode.h.patch"
    patch_description: >-
      shellcode.h 补齐缺失的 aarch64 分支：ARM64 的 `ret`（0xd65f03c0，小端
      c0 03 5f d6）。上游对未知架构回退到 x86 的 RET(0xC3)：在 ARM64 上无论内存
      页是否可执行都以信号终止，exec 系测试（anonmap/execbss/execdata/execheap/
      execstack 及其 mprotect 变体）失去正判定能力；补丁恢复“可执行页返回
      （Vulnerable）/不可执行页 Killed”的判定语义。
    patch_type: "portability"
