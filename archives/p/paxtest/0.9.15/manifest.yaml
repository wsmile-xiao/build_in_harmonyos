knowledge_gained:
  - knowledge_ref: "notes.md#编译步骤"
    text: "Makefile.psm 构建逻辑零改动：make -f Makefile.psm CC=<clang> LD=<ld>（编译器取 Conan conf）；aarch64 上 THEARCH 为空，x86 专用探针（-m32/-m64/-msecure-plt/-ftrampolines/specs）自然失效不产生强制标志；LD_PIE 由构建机 ld 的 pie 支持决定"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "chpax-0.7/aout.c 依赖 <a.out.h>（musl 系 sysroot 无此头，aarch64 亦无 a.out 二进制）导致构建失败：补丁 0001-0004 移除 chpax 的 a.out 支持（函数体/全局变量/声明/io.c 检测分支），保留 aout.c 空文件以维持上游 Makefile 源列表"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "shellcode.h 无 aarch64 分支，回退到 x86 RET(0xC3)：ARM64 上可执行页与不可执行页均以信号终止（Killed），exec 系 15 项失去正判定能力；补丁 0005 增补 __aarch64__ 的 ARM64 ret(0xd65f03c0) 恢复判定语义"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "blackhat 模式在 clang 构建下按上游 body.c 实现回退 kiddie 语义并打印 INFO（GCC 嵌套函数 trampoline 不可用）；两个模式均可完整运行，结果口径需在报告中说明"
  - knowledge_ref: "notes.md#遇到的问题与解决方案"
    text: "chpax 在 OHOS 上为惰性工具：内核无 PaX 标志可设，且上游 ELF 架构列表不含 EM_AARCH64（任何 aarch64 ELF 都报 Wrong architecture）；Makefile 生成的 paxbin 调用失败被 ||: 吞掉，不影响测试默认路径"
  - knowledge_ref: "notes.md#验证结果"
    text: "真机结果解读：Killed=攻击尝试被信号终止（目标内存不可执行/不可写）；Vulnerable=攻击代码实际执行成功（保护缺失，需关注）；随机化项输出 quality bits（ASLR 熵估计，非安全保证）；driver 会把 CC 作为 genpaxtest 首参带入测试列表（上游同款行为，运行时产生一行 './clang: inaccessible or not found'，无影响）"

