# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）
package: paxtest/0.9.15
homepage: "https://github.com/opensrcsec/paxtest"

# 上游即安全回归套件本体：无独立断言式测试框架，测试面 = 34 个测试程序 +
# randbody/fastrandbody 驱动的随机化采样。通过口径 = 每个测试项运行成功并给出
# 结果（Killed/Ok/Vulnerable 或 quality bits 行）。
upstream_check_command: "make linux (构建全部测试程序) + ./paxtest kiddie|blackhat [logfile] (运行全部测试)"

# 构建阶段只编译（make all）；测试程序真机执行证据在 reports/，消费者回归在 test_package/。
upstream_test_in_build: false

upstream_tests:
  - file: "paxtest (genpaxtest 生成的驱动) + 34 个测试程序 + 15 个 helper"
    source: paxtest-paxtest-0.9.15
    description: "exec/mprotect/writetext 攻击面 15 项 + 随机化 15 项 + rettofunc 4 项；本适配真机 kiddie 与 blackhat 两模式完整运行（blackhat 在 clang 构建下按上游实现回退 kiddie 语义），逐项原始输出见 reports/device-kiddie.log、reports/device-blackhat.log"
    command: "./paxtest kiddie [logfile]"

# test_package 中自带的消费者测试（鸿蒙特有 // 消费者视角）
test_package_tests:
  - file: test_paxtest.sh
    description: "包结构与 34 个测试程序可执行；execstack/anonmap/mprotstack/writetext 探测真实执行且非 Vulnerable；getamap/getstack1 地址输出；randexhaust1 随机化质量行；驱动无参数负向对照"
    command: "sh test_paxtest.sh <suite-dir> <work-dir>"

# 测试断言总数 (用于质量评估)
assertion_count: 21
