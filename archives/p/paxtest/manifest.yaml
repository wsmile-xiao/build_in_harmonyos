# 软件级 manifest — paxtest
software: paxtest
display: "paxtest (PaX/GrSecurity memory protection regression suite)"
description: "PaX/GrSecurity 内存保护回归测试套件：exec/mprotect/writetext 攻击面探测 + 地址空间随机化质量测量（aarch64/OHOS 适配）"
category: utility
homepage: "https://github.com/opensrcsec/paxtest"
license: GPL-2.0-or-later

build_system: makefile

ohos_adaptation:
  key_points:
    - "构建逻辑零改动：make -f Makefile.psm CC=<clang> LD=<ld> 覆盖硬编码 CC=gcc/LD=ld（R33：编译器取 Conan conf）；aarch64 上 THEARCH 为空、x86 专用探针（-m32/-m64/-msecure-plt/-ftrampolines/specs）自然失效不生效"
    - "portability 补丁 0001-0004：chpax-0.7 移除 a.out（pre-ELF）支持——musl 系 sysroot 无 <a.out.h>；chpax 在 OHOS 上本就是惰性工具（内核无 PaX 标志），paxbin 调用为无害 no-op"
    - "portability 补丁 0005：shellcode.h 补 __aarch64__ 分支（ARM64 ret, 0xd65f03c0）——上游回退 x86 RET(0xC3) 时 ARM64 上 exec 系测试无正判定能力（可执行/不可执行页都表现为 Killed）"
    - "blackhat 模式在 clang 构建下按上游实现回退为 kiddie 语义并打印 INFO（body.c 依赖 GCC 嵌套函数）；实测两模式均完整运行"
    - "测试结果对内核与运行环境敏感：结论以真机原始输出为准（reports/device-*.log）；Killed=攻击尝试被信号终止（内存不可执行/不可写），Vulnerable=攻击代码实际执行成功"
  common_dependencies: []

versions:
  "0.9.15":
    status: built
    build_date: "2026-09-27"
    conan_ref: "paxtest/0.9.15"
