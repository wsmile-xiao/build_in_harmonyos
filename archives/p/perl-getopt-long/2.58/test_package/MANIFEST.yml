# test_package/MANIFEST.yml — perl-getopt-long 2.58
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-getopt-long/2.58
homepage: "https://metacpan.org/pod/Getopt::Long"

# 上游测试套件：t/ 目录 8 个 .t 测试文件（prove -l t/ 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Getopt-Long-2.58/t/*.t
    description: "8 个 .t 测试文件：本地实测 **109/109（100%）**（prove -l t/，全部运行，零失败）"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Getopt::Long + GetOptions 解析真实命令行参数）
test_package_tests:
  - file: test_getopt_long.py
    description: "Loads packaged Getopt::Long via perl -I<lib> and parses real command-line options (GetOptions with -v -f)"
    command: "python3 test_getopt_long.py"

# 断言总数：1（GetOptions 解析校验）
assertion_count: 1
