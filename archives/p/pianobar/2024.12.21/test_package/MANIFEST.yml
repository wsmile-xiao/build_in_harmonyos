# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pianobar/2024.12.21
homepage: "https://6xq.net/projects/pianobar/"

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: pianobar-2024.12.21.tar.bz2, sha256 16f4dd2d64da38690946a9670e59bc72a789cf6a323f792e159bb3a39cf4a7f5)
upstream_test_audit:
  source_tarball: "pianobar-2024.12.21.tar.bz2"
  source_sha256: "16f4dd2d64da38690946a9670e59bc72a789cf6a323f792e159bb3a39cf4a7f5"
  top_level_files:
    - Makefile          # 仅 all/clean/install/install-libpiano/uninstall 目标; .PHONY 含无规则 test, 无 check 目标
    - src/              # main.c/player.c/settings.c/terminal.c/ui*.c + libpiano/crypt.c/piano.c/request.c/response.c/list.c, 无 TEST()/TEST_F/def test_
    - src/config.h      # 版本特性宏, 非测试
    - src/libpiano/piano.h  # C API 头文件, 非测试
    - contrib/          # config-example/pianobar.1/eventcmd 示例, 非测试
    - .github/workflows/build.yml  # 上游 CI 仅执行 make 编译, 不运行任何测试
    - COPYING           # 许可证
    - ChangeLog         # 发布注记, 无测试说明
    - README.rst        # 文档, 无测试说明
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check/test/check_PROGRAMS/TESTS 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "ctest / meson test 目标"
    - "find . -name '*test*' (全树)"
    - ".github/workflows 测试步骤"
  scan_result: "0 matches — 全树无 tests/ 目录; 55 个文件无 *test* 测试源; Makefile 无 check 目标 (test 为无规则 .PHONY); 无 gtest/pytest/ctest 注册; 上游 CI 仅 make"
  make_check_output: "make -n check 无规则 (No rule to make target 'check') — Makefile 无 check 目标, 仅 all/clean/install/install-libpiano/uninstall, make check 执行 0 用例"
  reason: "pianobar 2024.12.21 为 raw Makefile 工具, 官方源码包不含任何测试套件: 无 tests/ 目录、无测试源文件、无 check 目标、无 configure; 上游 CI 仅编译。功能验证由 test_package 消费者测试完成 (14 个 libpiano C API + 4 个 CLI 交付检查)"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用 (保持空串: 非空会被清单器判为上游存在测试命令)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_libpiano.c
    description: "Link packaged libpiano.a and check 14 offline C API assertions (error strings, list helpers, station lookup, PianoInit/PianoDestroy)"
    command: "./test_libpiano"
  - file: test_pianobar.sh
    description: "Statically verify packaged pianobar delivery with 4 CLI assertions (executable bit, linked-in welcome banner string, version string, installed man page); the binary is not executed because upstream BarReadline blocks forever on EOF stdin and the device reaps the hung process as Signal 9"
    command: "sh test_pianobar.sh <pianobar>"

# 测试断言总数 (14 libpiano + 4 CLI)
assertion_count: 18
