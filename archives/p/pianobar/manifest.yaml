software: pianobar
display: "pianobar"
description: "Console-based client for the Pandora online radio"
category: utility
homepage: "https://6xq.net/projects/pianobar/"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "raw Makefile 项目：源码树内构建，PkgConfigDeps 暴露依赖"
    - "DYNLINK=0 默认不产出 libpiano.a，需手工 ar 归档以交付 C API"
    - "上游无测试套件，以 test_package 消费者测试补位"
    - "OHOS 下对最终 CLI 二进制做 binary-sign-tool 自签名"
  common_dependencies:
    - libao
    - curl
    - json-c
    - libgcrypt
    - ffmpeg

versions:
  "2024.12.21":
    status: built
    build_date: "2026-09-14"
    patches_count: 0
