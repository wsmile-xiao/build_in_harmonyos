software: polyml
display: "Poly/ML"
description: "Poly/ML is an implementation of Standard ML."
category: build-tool
homepage: "https://polyml.org/"
license: LGPL-2.1-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - "为 GNU config 脚本增加 HarmonyOS triplet 识别"
    - "将 config.status 临时目录放入 mode 0700 且受应用数据 MAC 标签保护的私有缓存，避开 HMDFS mode 2771"
    - "在拥有者线程退出时注销 alternate signal stack，再由主线程释放"
    - "OS.FileSys.tmpName 优先使用 TMPDIR"
    - "pathname AF_UNIX bind 被沙盒拒绝时按运行时能力标记不适用"
  common_dependencies:
    - automake/1.18
    - libtool/2.5.4
versions:
  "5.9.2":
    status: built
    build_date: "2026-08-06"
    conan_ref: "polyml/5.9.2"
