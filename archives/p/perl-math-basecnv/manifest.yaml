software: perl-math-basecnv
display: "Math::BaseCnv"
description: "Perl模块，提供不同进制（2-64或96）之间的数字转换功能"
category: perl
homepage: "https://metacpan.org/pod/Math::BaseCnv"
license: GPL-3.0
build_system: perl

ohos_adaptation:
  key_points:
    - "纯Perl模块，无平台相关代码，无需特殊适配"
    - "依赖均为Perl核心模块（Carp, Math::BigInt, Memoize）"
    - "使用ExtUtils::MakeMaker构建系统"
    - "提供命令行工具cnv用于进制转换"
  common_dependencies:
    - perl-core (>= 5.42.0)

versions:
  "1.14":
    status: published
    build_date: "2026-06-15"
    published_as: perl-math-basecnv
    source_url: "https://cpan.metacpan.org/authors/id/P/PI/PIP/Math-BaseCnv-1.14.tgz"