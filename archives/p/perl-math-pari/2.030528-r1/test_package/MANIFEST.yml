# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: perl-math-pari/2.030528-r1
homepage: "https://metacpan.org/pod/Math::Pari"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.pl
    source: Math-Pari-2.030528/test.pl
    description: "Math::Pari upstream test suite"
    command: "perl -Iblib/lib -Iblib/arch test.pl"

# test_package 中自带的测试
test_package_tests:
  - file: test.sh
    description: "Consumer test: verify Pari.pm is installed in package"
    command: "sh test.sh"

# 测试断言总数 (近似值)
assertion_count: 1
