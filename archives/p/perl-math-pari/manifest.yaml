# perl-math-pari 软件元数据

name: perl-math-pari
category: perl_xs
description: Perl interface to PARI/GP mathematical library for number theory computations

homepage: https://metacpan.org/pod/Math::Pari
license: GPL-2.0-or-later AND Artistic-1.0-Perl

maintainer: OpenHarmonyPCDeveloper Team

# 版本索引
versions:
  2.030528-r1:
    status: built
    release_date: 2026-06-17
    notes: First successful build on OpenHarmony platform
    artifacts:
      - perl-math-pari-2.030528-r1-ohos-aarch64.tar.gz

# 平台支持
platforms:
  - aarch64-unknown-linux-ohos

# 关键特性
features:
  - PARI/GP mathematical computations
  - Number theory functions (factorization, elliptic curves, Galois theory)
  - Polynomial and algebraic number field operations

# 依赖关系
dependencies:
  runtime:
    - perl >= 5.42.0
  build:
    - clang >= 18.1.8
    - make

# 安装说明
installation:
  method: hnp_package
  target_path: /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0/aarch64-linux
  notes: |
    XS modules require HNP installation due to SELinux HMDFS restrictions.
    Cannot be loaded from ~/usr/local/lib on OpenHarmony.

# 编译注意事项
build_notes:
  crt_issue: OpenHarmony musl does not provide standard CRT startup files
  solution: Add -nostartfiles and -L/path -lc to LDDLFLAGS in Makefile
  reference: archives/c/Crypt-OpenSSL-Random/0.15/notes.md

# 知识图谱关联
knowledge_links:
  - E002: CRT files missing on musl-based systems
  - XS_SELinux_HMDFS: XS modules cannot load from HMDFS directories