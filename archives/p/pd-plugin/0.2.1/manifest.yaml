version: "0.2.1"
software: "pd-plugin"
status: built
build_date: "2026-10-08"
build_system: "custom"

source:
  url: "https://sourceforge.net/projects/pure-data/files/libraries/plugin~/plugin~-0.2.1.tar.gz/download"
  sha256: "3135ef0bfc2e42976104ad1dbd0b8e9e2d6db4caa74a63814636373ab957d928"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "CC=<OHOS clang from tools.build:compiler_executables>"
    - "-std=gnu11 -fPIC -DPD -DUNIX -DHAVE_LOCALE_H"
    - "-shared -Wl,-soname,plugin~.pd_linux"
  dependencies:
    - puredata/0.54.1
    - ladspa-sdk/1.17
  cc: clang

patches_applied:
  - "0001-plugin~.c.patch"

knowledge_gained:
  - "plugin~ is a Pd external: it intentionally retains unresolved Pd symbols that are supplied by the -rdynamic Pure Data process at dlopen time"
  - "puredata/0.54.1 is an application package and does not publish includedirs, so m_pd.h must be resolved from its package_folder"
  - "The legacy Pd error() API used by plugin~ 0.2.1 is absent from current m_pd.h; pd_error(owner, ...) is its compatible replacement"
  - "A meaningful runtime test can provide a minimal Pd ABI shim, dlopen the external with RTLD_NOW, then exercise its real LADSPA loader against ladspa-sdk's amp_mono plugin"
