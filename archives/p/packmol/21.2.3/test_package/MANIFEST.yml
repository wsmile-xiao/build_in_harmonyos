# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）
package: packmol/21.2.3
homepage: "https://m3g.github.io/packmol/"

# 上游测试命令（用于 CI 分析测试构成）
upstream_check_command: "sh testing/test.sh      # Julia 驱动，需 julia；CI 无 Julia 工具链"
upstream_test_in_build: false
upstream_test_command: "sh testing/test_cli.sh /path/to/packmol"

# 上游实际运行的测试程序
upstream_tests:
  - file: testing/test_cli.sh
    source: packmol-21.2.3/testing/test_cli.sh
    description: "CLI 调用方式一致性：stdin/-i/-o 三种调用产出一致 PDB（自动固定 seed=1024，纯 shell+gawk/sed/grep/diff，HarmonyOS 可运行）"
    command: "sh testing/test_cli.sh ../packmol"
  - file: testing/test_connectivity.sh
    source: packmol-21.2.3/testing/test_connectivity.sh
    description: "CONECT 连接性输出校验（纯 shell，HarmonyOS 可运行）"
    command: "sh testing/test_connectivity.sh"
  - file: testing/test_failed.sh
    source: packmol-21.2.3/testing/test_failed.sh
    description: "预期失败的输入必须产生指定错误关键字（FORCED / outside）"
    command: "sh testing/test_failed.sh <input> packmol.log <keyword>"
  - file: testing/runtests.jl
    source: packmol-21.2.3/testing/runtests.jl
    description: "Julia 驱动的 17 个输入文件回归（需要 Julia 工具链，CI 无 Julia，未运行——受限原因见 notes.md）"
    command: "julia runtests.jl ./input_files/*.inp"

  - file: python/tests/test_packmol.py
    source: packmol-21.2.3/python/tests/test_packmol.py
    description: "Python 集成测试：PATH 中调用 packmol 打包 10 个水分子到 box，断言 output.xyz 生成（设备无 pytest，用例已等价复现于 test_package PATH 消费步骤）"
    command: "pytest python/tests/test_packmol.py"

# test_package 自带测试（消费者视角实质验证）
test_package_tests:
  - file: run_smoke.sh
    description: "固定 seed 水盒打包冒烟：stdin 输入真实打包生成 PDB + 断言 TITLE/HETATM/Success（packmol 无 --version，见 notes.md）"
    command: "sh run_smoke.sh <packmol>"
  - file: conanfile.py (test 步骤 2)
    description: "消费端 PATH 调用：conanrun 注入 PATH 后以命令名 packmol 直接调用（等价上游 python/tests/test_packmol.py），断言 output.xyz 生成"
    command: "packmol < packmol_xyz.inp"

# 断言总数近似值（上游 shell 断言 + 冒烟断言）
assertion_count: 40