version: "21.2.3"
software: packmol
display: "Packmol"
status: built
build_date: "2026-09-05"
build_system: make
conan_ref: "packmol/21.2.3"

source:
  url: "https://github.com/m3g/packmol/archive/refs/tags/v21.2.3.tar.gz"
  sha256: "b26af58d407b1c8d786aa6c2bb6bfa40d741aaa0424db51300fdd6fd66dd4813"
  tar_format: tar.gz

build:
  system: make
  configure_options:
    - "FORTRAN=<flang-ohos bin>/flang (LLVM Flang 前端，编译 .f90/.f)"
    - "LINKER=<OHOS clang> (最终链接驱动，见 patches/0001)"
    - "FLAGS=-O3 -funroll-loops -march=armv8-a (覆盖上游默认 -march=native)"
    - "LIBS=-lFortranRuntime -lFortranDecimal -lm (静态 Fortran 运行时)"
  dependencies:
    - "flang-ohos/20.1.0"
  cc: clang
  fc: flang

patches_applied:
  - "0001-linker-variable.patch"

knowledge_gained:
  - "packmol 为纯 Fortran 命令行工具、无外部库依赖（内嵌 GENCAN 优化器，不需 BLAS/LAPACK/MPI）；仅需 flang-ohos/20.1.0 工具链"
  - "flang 按源文件扩展名自动选择自由/固定格式，F77 的 gencan.f 直接编译通过"
  - "flang-ohos 是前端工具包（无 OHOS CRT/sysroot），最终链接必须由 ohos clang 驱动 + 静态 Fortran 运行时完成（同 fortran-shlex/2.0.1 方案）"
  - "上游默认 -march=native 不可复现，需以 -march=armv8-a 覆盖（与 profile arch=armv8 一致）"
  - "上游 Makefile 无 install 目标，配方直接打包 bin/packmol；packmol 从 stdin 读输入、输出写当前目录，非交互适配良好"
  - "seed -1 表示按时间取种，测试/冒烟必须固定 seed 才能可复现"

test_results:
  type: local
  conan_create: "PASS（packmol/21.2.3#b50ee3f8d6705007498fcfd91ecfa6dd:6b129b068851896169fae42d399fa922d239ce8a，test_package 双消费路径通过）"
  upstream_shell: "test_cli.sh 19/19、test_connectivity.sh 1/1、test_failed.sh 2/2 全部通过（HarmonyOS aarch64 实测，合计 22/22）"
  upstream_julia: "runtests.jl/test.sh 需 Julia 工具链，CI 无 Julia，未运行（受限原因见 notes.md，17 个输入均已由 test_cli.sh 功能路径覆盖）"
  upstream_python: "python/tests/test_packmol.py 需 pytest（设备 Python 3.12.9 无此模块），未直接运行；其 subprocess 用例已在 test_package PATH 消费步骤中等价复现并通过"
  ci_simulation: "CI_PACKAGES=archives/p/packmol/21.2.3 + ci/conan/build_and_test.sh → total 1/1 success，L0/L1/L4/L5 pass，L2 skip（packmol 无 --version/--help，非阻塞）"