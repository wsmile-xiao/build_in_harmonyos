knowledge_gained:
  - "msgpack-python sdist 自带可选 C 扩展（_cmsgpack.c/_cmsgpack.pyx）；本移植
    copytree 时剔除 C 扩展源文件，只装纯 Python 实现——msgpack/__init__.py 在
    ImportError 时回退 msgpack.fallback，公共 API 不变（cachecontrol 消费面
    packb/unpackb/Packer/Unpacker 实测通过）。"
  - "conan 包名 python-msgpack 与 ohpcd 既有 msgpack/7.0.1（msgpack-c）隔离，
    避免 C 库与 Python 模块名冲突（R36 依赖映射）。R38：纯库无 commands.json。"

