    count: "N/A"
    description: "本轮未在 OHOS 上全量运行（N/A）——上游为 pytest 套件，CI 纯
      conan 流程不引入 pytest；不伪造通过数（WR-006）。等效验证以 test_package
      对打包产物的真实序列化 API 调用为准（R34）。"

test_package_tests:
  - file: test_python_msgpack.py
    description: "消费者测试（R34）：packb/unpackb 往返、use_bin_type/raw/
      strict_map_key 选项（cachecontrol Serializer 同款）、纯 Python fallback
      实现断言（无 _cmsgpack）。全离线。"
    command: "python3 test_python_msgpack.py <site-packages>"

assertion_count: 6
