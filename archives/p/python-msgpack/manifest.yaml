# 软件级 manifest — python-msgpack
# 遵循 ARCHIVE-SPEC v3.0

software: python-msgpack
display: "python-msgpack"
description: "MessagePack 序列化器的 Python 绑定（纯 Python fallback 实现，cachecontrol 依赖）"
category: library
homepage: "https://github.com/msgpack/msgpack-python"
license: Apache-2.0
build_system: none

ohos_adaptation:
  key_points:
    - "conan 包名取 python-msgpack：ohpcd 上 msgpack/7.0.1 已被 msgpack-c（C 库）
      占用，不提供 Python 模块；本包提供 msgpack Python 模块"
    - "只承载纯 Python 实现（msgpack.fallback），不编 C 扩展 _cmsgpack；
      公共 API（Packer/Unpacker/packb/unpackb）一致，msgpack/__init__.py 对
      _cmsgpack ImportError 自动回退 fallback"

versions:
