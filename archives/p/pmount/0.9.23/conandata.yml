sources:
  url: "https://alioth-archive.debian.org/releases/pmount/pmount/0.9.23/pmount-0.9.23.tar.bz2"
  sha256: "db38fc290b710e8e9e9d442da2fb627d41e13b3ee80326c15cc2595ba00ea036"

patches:
  - patch_file: "patches/0001-config-sub-ohos.patch"
    patch_description: "Teach the 2008 config.sub that linux-ohos is a kernel-OS pair so --host/--build=aarch64-unknown-linux-ohos is accepted"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-xmlparser-not-fatal.patch"
    patch_description: "Demote the intltool XML::Parser hard gate to a warning: this tree has no .xml/.desktop/.server template, so intltool -x mode is never invoked (klavaro/3.14 precedent)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-include-limits-h.patch"
    patch_description: "Add #include <limits.h> to src/utils.c and src/policy.c: both use PATH_MAX but relied on glibc pulling it in transitively, so musl/OHOS fails with 'use of undeclared identifier PATH_MAX'"
    patch_type: "portability"
