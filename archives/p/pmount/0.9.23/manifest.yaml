knowledge_gained:
  - "2008 年 config.sub 交叉接受 aarch64 全写三元组却拒绝 *-linux-ohos，根因不在 CPU 白名单而在 maybe_os 的 KERNEL-OS 组合表：`aarch64-unknown-linux-gnu` 本地实测 rc=0（grep 全文 0 次 aarch64 仍能过，因走的是 cpu-vendor 两段式回退），而 `aarch64-unknown-linux-ohos` 报 `machine 'aarch64-unknown-linux' not recognized`——即 `linux-ohos` 未列进 maybe_os 导致切分错位。故补丁只需在 maybe_os(:122) 与 os 归一化表(:1253) 各加 `linux-ohos`，不必像 aalib 那样再补第三处 CPU hunk。同时 klavaro 用的简写形态 `aarch64-linux-ohos` 补丁后仍 rc=1（`machine 'aarch64' not recognized`）⇒ 老 config.sub 只认全写三元组，交叉参数必须用 conan OHOS 版 get_gnu_triplet 生成的 aarch64-unknown-linux-ohos"
  - "autotools 包自带 configure 时，'禁用 autoreconf' 的判据是 configure.ac 里的宏是否已被新版工具链删除：pmount 同时命中 AM_CONFIG_HEADER(automake≥1.16 删)、AC_HEADER_STDC(autoconf≥2.70 删)、AC_PROG_INTLTOOL(intltool 宏已退役) 三处，重生成必炸；配方以 --disable-maintainer-mode 兜住 make 侧的隐式重建规则（待 create 实证）"
  - "configure 期的 intltool 版本闸门与 NLS 开关无关：AC_PROG_INTLTOOL 展开出的 `INTLTOOL_APPLIED_VERSION=intltool-update --version | head -1 | cut -d' ' -f3`（本包 configure:3902）不受 --disable-nls 保护，因此 intltool 是 tool_requires 而非可省项；同族先例见 klavaro/3.14 build_requirements 注释"
  - "上游测试夹具漏发（dist bug）的判法：tests/Makefile.am 无 EXTRA_DIST 且夹具目录不在 tarball，被测函数以 exit(100) 硬退而非返回失败，故 `make check` 在打印任何结果前即中断；Debian debian/rules `override_dh_auto_test: echo \"skipping tests (buggy in upstream tarball)\"` 提供同源外部佐证。此类不得记成 OHOS 适配缺陷，也不得缩分母——按 test_policy.c 四条断言 + policy.c:393-455（返回 entry->mnt_fsname、realpath 失败退回原串）反推夹具内容补回，归'补全测试用例说明'逐项交代"
  - "PENDING（未证，设备恢复后先核）：gettext/0.22.5.1 包内是否同时提供 include/libintl.h 与可链接的 libintl；若无则退路是 glib 的 proxy-libintl（klavaro 的 `-L<glib libdir> -lintl` 手法）"

