package: pmount/0.9.23
homepage: https://alioth-archive.debian.org/releases/pmount/pmount

# 上游只有一套 automake 注册的测试：tests/Makefile.am:1 `TESTS = test_policy`
# （1 个测试项 / 内部 4 条断言）。test_sysfs 是 check_PROGRAMS 但不在 TESTS 里，
# tests/README 自注 "This is not a real test"（遍历 /sys 找真实可移动块设备）。
# 详见 archives/p/pmount/0.9.23/notes.md §7 五维账本。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: 'autotools.make(target="check", args=["-j1"])'
upstream_tests:
  - name: test_policy
    file: tests/test_policy.c
    assertions: 4
    note: >-
      纯策略函数断言（fstab_has_device 的符号链接解析），不触 mount/setuid/root。
      pristine tarball 下无法执行：夹具目录 tests/check_fstab/ 未随包发布，
      而 src/policy.c:406-409 打不开文件即 exit(100)；Debian debian/rules 以
      "skipping tests (buggy in upstream tarball)" 同源佐证。本配方在 build() 内
      按 test_policy.c 四条断言 + policy.c:411-427/:444 的返回语义重建夹具
      （真实文件 a、d；符号链接 b->a、c->d、e->d；fstab 两行且 a 在前），
      不改上游任何测试代码，也不缩分母。
  - name: test_sysfs
    file: tests/test_sysfs.c
    assertions: 0
    note: >-
      不在 TESTS 中（上游自注"不是真测试"），需真实可移动块设备与 /sys 遍历，
      构建但不执行；计入未执行分类，不计入通过率分母之外的任何口径。

# 真实执行读数（create-10 CREATE_RC=0 首个完整构建轮；create-11 为 test_package 复跑）：
#   create-10.log:795  执行行 = LD_LIBRARY_PATH="<libblkid>:<gettext>:..." make check -j1
#   create-10.log:869  make test_policy test_sysfs（两者都编出来）
#   create-10.log:925  make check-TESTS
#   create-10.log:931  "4 tests, 0 failed"
#   create-10.log:932  "PASS: test_policy"
upstream_tests_executed: 1
upstream_assertions_executed: 4
upstream_verdict_line: "PASS: test_policy / 4 tests, 0 failed"
# max_rss_probe_mb / max_rss_mb：本包 test_package 只跑 6 组 CLI 断言、无大输入，
# 但仍按 §14.1④ 先探针再预算；探针读数待补，补之前不得写预算值。
# max_rss_probe_mb: PENDING
# max_rss_mb: PENDING

test_package_tests:
  - file: test.sh
    description: >-
      以真实使用者身份驱动打包的两个可执行文件，共 6 组行为 / 15 条断言：
      无参枚举必须 rc=0 且打印 "Printing mounted removable devices"（真实解析 /proc/mounts）；
      pmount -h / pmount --version / pumount -h / pmount /dev/definitely-not-a-device
      四条路径必须非 0 退出并给出 "needs to be installed suid root"，其中设备参数那条
      还断言绝不出现 "could not execute mount"（即未特权调用根本触不到 mount(8)）；
      外加两个程序在 PATH 上且首 4 字节为 ELF 魔数。依据是 src/pmount.c:665-668 与
      src/pumount.c:186-188 的 geteuid() 特权门早于 getopt，OHOS 打包件拿不到 setuid，
      因此挂载能力不可用属如实标注而非测试放过。
    command: /data/service/hnp/bin/bash test.sh

assertion_count: 15
consumer_programs: 1
# max_rss_probe_mb: PENDING   # memcap-run.py --probe 实测后回填
# max_rss_mb: PENDING         # 预算按探针值放大后设硬顶，超限即 rc=90 止损（§14.1④）
