# test_package/MANIFEST.yml
# test_package consumer-side test declaration
# CI script (build_and_test.sh L0e) requires this file

package: pyjson5/0.15.0
homepage: "https://github.com/dpranke/pyjson5"

# Upstream test command（如实申报实际运行命令，含运行时环境恢复：
# out-of-proc 子进程需 PYTHONPATH=源码根，详见 notes.md）
upstream_check_command: "PYTHONPATH=<src> TMPDIR=<writable> python3 -m doctest json5/lib.py && PYTHONPATH=<src> TMPDIR=<writable> python3 -m unittest discover -p '*_test.py' -v"

# Upstream test suite（双口径：源码声明 75 个 unittest 用例 + 1 个 doctest 入口）
upstream_tests_total: 75
upstream_tests_passed: 75
upstream_tests_skipped_reason: "无跳过/未运行项：75/75 全部实际运行并通过（首轮 15 例因缺 PYTHONPATH 环境失败，按运行时环境恢复规则注入精确路径后重跑 75/75 通过，未修改任何上游测试）"

# Upstream tests run inside conan build
upstream_test_in_build: false
upstream_test_in_build_reason: "纯 Python 无编译包，build() 不定义；上游测试在任务流程内对官方源码实际运行（命令/退出码/日志见 reports/），test_package 对已安装制品做实质执行验证"

# test_package consumer-side tests（R34 实质执行）
test_package_tests:
  - file: test_json5_ohos.py
    description: "HarmonyOS 专项测试：json5.loads/dump/dumps 公开 API + 中文注释 JSON5 解析 + 真实文件 IO + round-trip 断言（python3.12 实际运行，exit 0）"
  - file: conanfile.py
    description: "CLI 实际运行：pyjson5 --indent=None -c '{a:1,b:[true,null]}' 解析并输出（R34 不空壳）"

# Test assertion count（上游 75 用例断言数不计入；此处为鸿蒙专项测试断言数 8）
assertion_count: 8
