sources:
  "1.1.8":
    url: "https://ftp.samba.org/pub/cwrap/pam_wrapper-1.1.8.tar.gz"
    sha256: "6549c0b3e41d1ebe0c94a1be63c25eec918191462b602ab6f47d4a5fa709c3e4"
requirements:
  cmocka: "cmocka/2.0.2"
patches:
  - patch_file: "patches/0001-ConfigureChecks.cmake.patch"
    patch_description: "Use Conan-provided PAM headers during feature checks and tolerate an implicit dl library"
    patch_type: "portability"
  - patch_file: "patches/0002-src-CMakeLists.txt.patch"
    patch_description: "Use Conan-provided PAM include and library paths for pam_wrapper and pamtest"
    patch_type: "portability"
  - patch_file: "patches/0003-src-modules-CMakeLists.txt.patch"
    patch_description: "Use Conan-provided PAM include and library paths for test PAM modules"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-CMakeLists.txt.patch"
    patch_description: "Use Conan-provided PAM include and library paths for the upstream CMocka test"
    patch_type: "portability"
