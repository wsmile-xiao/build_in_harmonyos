version: "3.25.4"
software: "petsc-complex"
status: built
build_date: "2026-09-20"
build_system: custom

source:
  url: "https://web.cels.anl.gov/projects/petsc/download/release-snapshots/petsc-3.25.4.tar.gz"
  sha256: "12c990fb39a5764ac8311211d09c01ed80fb983136c75bf7b558312b2509dbbd"
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "--with-cc=clang"
    - "--with-cxx=clang++"
    - "--with-fc=0"
    - "--with-mpi=0"
    - "--with-petsc-arch=arch-ohos-c-opt"
    - "--with-x=0"
    - "--with-scalar-type=complex"
    - "--with-precision=double"
    - "--with-shared-libraries=0"
    - "--with-debugging=0"
    - "--download-f2cblaslapack=1"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PETSc uses a Python configure script; generic autotools clean-verify is not suitable."
  - "--with-scalar-type=complex changes the ABI (PetscScalar becomes double _Complex, 2x PetscReal) and rewrites petscconf.h, so it must live in its own Conan package rather than being an option of petsc."
  - "PETSC_USE_COMPLEX is generated into the installed petscconf.h, which petscsys.h includes, so downstream consumers automatically see the variant ABI without any -D from the recipe."
  - "PETSc's bundled f2cblaslapack already carries the complex BLAS/LAPACK routines (zgemm/zdotc/zheev), so a complex build stays fully self-contained - no OpenBLAS/MKL provider is needed."
  - "The complex variant only compiles with a C99-capable compiler; PETSc's configure raises a RuntimeError for real-only C dialects."
  - "PETSc derives its default build tree name from the build host: nativeArch = 'arch-' + sys.platform + '-' + clang + '-opt'. A recipe that wants 'arch-ohos-c-opt' must also pass --with-petsc-arch=arch-ohos-c-opt to configure, otherwise configure creates arch-linux-c-opt and 'make PETSC_ARCH=arch-ohos-c-opt' fails with 'arch-ohos-c-opt/lib/petsc/conf/files: No such file or directory'."
  - "--with-x=0 is required: PETSc's --with-x auto-detects the BUILD HOST's X11 headers, so on a worker with libX11-dev the X draw backends get compiled into libpetsc.a and every consumer link then needs -lX11."

conan:
  ref: "petsc-complex/3.25.4"
  verify: pass
  package_type: library

test:
  smoke: pass
  test_package: pass
