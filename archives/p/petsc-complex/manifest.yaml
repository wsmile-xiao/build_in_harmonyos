software: petsc-complex
display: "PETSc (complex scalars)"
description: "PETSc complex-scalar build — Portable, Extensible Toolkit for Scientific Computation"
category: scientific-computing
homepage: "https://petsc.org/"
license: BSD-2-Clause
build_system: custom

versions:
  "3.25.4":
    status: built
    build_date: "2026-09-20"
    notes: "Complex-scalar PETSc (PetscScalar = double _Complex) built with the self-contained f2cblaslapack provider; acceptance test asserts variant-distinguishing behaviour."

ohos_adaptation:
  key_points:
    - "Use PETSc Python configure instead of generic autotools flow."
    - "Use --with-mpi=0 for MPIUNI to avoid unpublished MPI dependency."
    - "Use --download-f2cblaslapack=1 to keep recipe self-contained; its bundled z-routines (zgemm/zdotc/zheev) cover the complex case, so no OpenBLAS/MKL is needed."
    - "Build static library with --with-shared-libraries=0."
    - "--with-scalar-type=complex is an ABI change, not an option: PetscScalar doubles in width and petscconf.h is rewritten. Keep it in its own Conan package (petsc-complex) so a graph can resolve real and complex consumers at once."
    - "PETSC_USE_COMPLEX is baked into the installed petscconf.h (included via petscsys.h), so downstream consumers see the correct variant without extra -D flags."
  common_dependencies: []
