# 编译中学到的知识
knowledge_gained:
  - "musl/HarmonyOS: res_query and res_search are in libc itself, no separate libresolv needed"
  - "ExtUtils::CChecker linker fails on HarmonyOS due to stale libpth and ld.lld not understanding -fstack-protector-strong"
  - "xsubpp outputs PROTOTYPES warning into C file; fix with PROTOTYPES: DISABLE directive in .xs"
  - "SELinux HMDFS limitation: .so on HMDFS (hmdfs:s0) cannot be loaded by Perl (hishell_hap domain); needs admin install to system directory"
  - "Perl XS modules on HarmonyOS: manual xsubpp + clang compilation bypasses Build.PL/CChecker issues"
  - "Binary signing: use /data/service/hnp/bin/binary-sign-tool for .so signing to get correct SELinux type"

