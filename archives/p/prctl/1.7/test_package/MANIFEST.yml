# test_package/MANIFEST.yml — prctl 1.7
package: prctl/1.7
homepage: "https://tracker.debian.org/pkg/prctl"

# 上游无独立测试套件：prctl 1.7 是单 .c 工具（prctl.c ~10.5KB）
# 上游是 autotools 工程但 tarball **不含生成的 configure**；
# 无论 configure.ac / Makefile.in 都没有 check 或 test 目标，
# 源码 tarball 内也不含测试源文件。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_prctl.c
    description: >-
      消费者测试 66 条断言，按平台能力分三层：
      ① 平台专有选项 --unaligned={silent,signal,default} 与 --fpemu={silent,signal}
         采用**运行时分级断言**：平台不实现时必须打印
         "does not implement set_<feat> prctl feature" 且退出非 0；平台实现时
         必须退出 0 且 -v 回显 Set "<feat>" to "<val>"。**不假定任何一端**
         （本地 Linux aarch64 内核返回 EINVAL、OpenHarmony 内核成功执行）；
      ② 能力探测 + 显式跳过 —— 先用 -q 探测平台是否列出 mcekill，列出才断言
         Set "mcekill" to "early|late|default" 与"不出现 Failed to"，
         未列出则打印 [SKIP] 并说明原因（绝不静默跳过）；
      ③ 与平台无关的稳定基线 —— 用法块完整性、--version/-h/--help 退出码、
         无动作时 rc=1、非法取值回落用法、非法选项报 invalid option。
      并区分"取值非法"（rc=1 + 用法块）与"平台不实现"（rc=1 + ERROR 行，无用法块）。
    command: "test_prctl <bin/prctl>"

# 测试断言总数
assertion_count: 66
