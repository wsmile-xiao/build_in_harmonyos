software: prctl
display: "prctl"
description: "Query or control process behavior via prctl(2): unaligned access / FP emulation / MCE kill policy, GPL-2.0-or-later"
category: system
homepage: "https://tracker.debian.org/pkg/prctl"
license: GPL-2.0-or-later
build_system: custom  # autotools 工程但 tarball 不含 configure；prctl.c 不依赖 config.h，conanfile 直驱 clang

ohos_adaptation:
  key_points:
    - "单 .c 文件（prctl.c ~10.5KB），无 config.h 依赖"
    - "仅 libc：unistd/stdio/stdlib/getopt/errno/pwd/sys/prctl/string"
    - "musl 全支持，无 patch"
    - "上游 tarball 不含生成的 configure（仅 configure.ac + Makefile.in），且 AC_INIT 仍是模板占位 → build() 直驱 clang 绕开整条 autotools 链路"
    - "版本串由源码内 #define VERSION \"1.7\" 硬编码，不依赖 configure"
    - "编译产出单可执行文件 bin/prctl（约 20KB）"
    - "★ --unaligned / --fpemu 是 ia64 专有操作：aarch64 上内核返回 EINVAL，工具打印明确的平台不实现错误并以 1 退出（测试把这作为正式断言）"
    - "★ --mcekill 是架构无关操作，其成功依赖内核支持 PR_MCE_KILL（测试用 -q 做能力探测）"
  common_dependencies:
    - libc (unistd, stdio, stdlib, getopt, errno, pwd, sys/prctl, string)

versions:
  "1.7":
    status: built
    build_date: "2026-09-17"
    source_url: "https://deb.debian.org/debian/pool/main/p/prctl/prctl_1.7.orig.tar.gz"
    source_sha256: "87a2a2a6d2b0d3a697fcaf0902ff944c87cd3c10b9cd2f120db79fcc19e90173"
    test_assertions: 66
