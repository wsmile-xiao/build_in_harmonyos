software: perl-sql-abstract
# 版本级 manifest
# 文件位置: archives/p/perl-sql-abstract/2.000001/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.000001"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.cpan.org/authors/id/M/MS/MSTROUT/SQL-Abstract-2.000001.tar.gz"

  # 源码校验和
  sha256: "35a642662c349420d44be6e0ef7d8765ea743eb12ad14399aa3a232bb94e6e9a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl (运行时)
    - perl-moo/2.005005 (运行时依赖)
    - perl-sub-quote/2.006009 (运行时依赖)
    - perl-hash-merge/0.302 (运行时依赖)
    - perl-mro-compat/0.15 (运行时依赖)
    - perl-text-balanced/2.06 (运行时依赖)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS/C 代码）编译不需要 CRT 链接修复"
  - "Perl EUMM 构建系统中，INSTALL_BASE 和 DESTDIR 不能设为同一路径，否则产生嵌套路径导致 G4 产物检查失败"
  - "package() 方法应使用 DESTDIR 安装后展平目录结构，将 .pm 文件移到 lib/ 下"
  - "Perl 模块产物为 .pm 文件，无需 ELF 签名"
