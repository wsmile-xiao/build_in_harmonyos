# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-sql-abstract/2.000001
homepage: "https://metacpan.org/dist/SQL-Abstract"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00new.t
    source: SQL-Abstract-2.000001.tar.gz/t/00new.t
    description: "模块加载测试"
    command: "perl -Iblib/lib t/00new.t"
  - file: t/01generate.t
    source: SQL-Abstract-2.000001.tar.gz/t/01generate.t
    description: "SQL生成测试（SELECT/INSERT/UPDATE/DELETE）"
    command: "perl -Iblib/lib t/01generate.t"
  - file: t/02where.t
    source: SQL-Abstract-2.000001.tar.gz/t/02where.t
    description: "WHERE子句生成测试"
    command: "perl -Iblib/lib t/02where.t"
  - file: t/03values.t
    source: SQL-Abstract-2.000001.tar.gz/t/03values.t
    description: "VALUES子句测试"
    command: "perl -Iblib/lib t/03values.t"
  - file: t/04modifiers.t
    source: SQL-Abstract-2.000001.tar.gz/t/04modifiers.t
    description: "SQL修饰符测试"
    command: "perl -Iblib/lib t/04modifiers.t"
  - file: t/10test.t
    source: SQL-Abstract-2.000001.tar.gz/t/10test.t
    description: "SQL::Abstract::Test工具模块测试"
    command: "perl -Iblib/lib t/10test.t"
  - file: t/20injection_guard.t
    source: SQL-Abstract-2.000001.tar.gz/t/20injection_guard.t
    description: "SQL注入防护测试"
    command: "perl -Iblib/lib t/20injection_guard.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/run_smoke_test.sh
    description: "SQL::Abstract smoke test wrapper: 设置PERL5LIB并调用perl"
    command: "conan create . -pr:h=ohos-aarch64"
  - file: test_package/smoke_test.pl
    description: "SQL::Abstract smoke test: WHERE/SELECT/INSERT/UPDATE/DELETE生成验证"
    command: "perl smoke_test.pl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 13
