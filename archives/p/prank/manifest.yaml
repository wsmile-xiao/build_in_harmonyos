software: prank
display: "PRANK"
description: "Probabilistic multiple sequence alignment engine with an explicit model of insertions and deletions"
category: data
homepage: "https://ariloytynoja.github.io/prank-msa/"
license: GPL-2.0-or-later
build_system: makefile

# 跨版本通用的 OHOS 适配知识（版本特定配置见 {version}/conanfile.py）
ohos_adaptation:
  key_points:
    - "src/Makefile 把 CC=gcc / CXX=g++ / LINK=g++ 硬编码进规则体，OHOS SDK 只提供 clang/clang++，须以 make 命令行变量覆盖"
    - "CFLAGS/CXXFLAGS/LFLAGS 带 x86-64 专有的 -m64，aarch64 下必须按 build_type 重建"
    - "INCPATH = -I. -I/usr/include 指向构建主机的 /usr/include（不是 OHOS sysroot），缩减为 -I."
    - "install/uninstall 是 FORCE 空规则，上游没有任何安装逻辑，package() 必须自己放置 bin/prank 与 man/man1/prank.1"
    - "默认目标 all 会用 pod2man 从 prank.1.pod 重生成 man 页，直接构建 prank 目标即可把 perl 摘出关键路径"
    - "运行时用 mkdtemp(TMPDIR|TMP|TEMPDIR|TEMP) 建临时目录；OHOS 上 /tmp 只读，调用方必须给可写 TMPDIR"
    - "-version（单横线）会真的去联网 prank-msa.googlecode.com 检查更新并在失败时 exit(1)，CI smoke 只能用 --version"
  common_dependencies: []

versions:
  "250331":
    status: built
    build_date: "2026-09-26"
    conan_ref: "prank/250331"
