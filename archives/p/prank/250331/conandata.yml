# conandata.yml — prank 250331
#
# Source = upstream's own published source snapshot, carried inside the official
# PRANK repository (ariloytynoja/prank-msa). Upstream documents exactly this
# retrieval pattern on its installation page (docs/prank_installation.html):
#     wget https://github.com/ariloytynoja/prank-msa/raw/refs/heads/master/binaries/prank.source.<ver>.tgz
# 250331 is no longer the newest release, so upstream keeps the artifact under
# binaries/previous_version/ (confirmed through the repository contents API).
# There is no GitHub Release for 250331 — the repository carries a single
# release (v.251117) whose only asset is a Linux x86-64 binary package.
#
# sha256 cross-verification: the identical digest is the one published for
# prank 250331 upstream tarball by the Debian package index, i.e. the pool
# artifact is a byte-for-byte copy of this upstream snapshot. The Debian pool
# URL itself is deliberately NOT used here (downstream repack source).
sources:
  url: "https://github.com/ariloytynoja/prank-msa/raw/refs/heads/master/binaries/previous_version/prank.source.250331.tgz"
  sha256: "4847b565eae3b99feaee2f53c0583a384c8fe3552b00cd019fca9ce4bff113b9"

patches: {}
