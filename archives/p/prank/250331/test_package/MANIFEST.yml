# MANIFEST.yml — prank/250331 上游官方测试声明
#
# CI 门禁 L0e 要求此文件存在（见 docs/TEST_QUALITY_SPEC.md §4.3）。
# 上游测试数量是**一手清点结论**，不是环境判定：下列命令与命中数均在
# prank.source.250331.tgz 解压树上实跑取回（2026-09-26，A 机）。

package: prank/250331
homepage: "https://ariloytynoja.github.io/prank-msa/"

# ── 上游测试命令 ─────────────────────────────────────────────
# Makefile 里确实有 check 目标，但它**不指向任何测试程序**：
#   第 119 行  first: all
#   第 142 行  all: Makefile $(TARGET) $(MANPAGES)
#   第 160 行  check: first
# 实测 `make -n check`（在干净解压树 src/ 内，2026-09-26 A 机）展开为 **37 条命令行
# = 36 条 g++ -c 编译 + 1 条 g++ -o prank 链接**，其中 0 条测试执行命令
# （pod2man 也未出现：快照自带的 prank.1 比 prank.1.pod 新，man 页规则已是 up-to-date）。
# 即 `make check` 只是把整个程序重编一遍，跑完等于没跑任何用例。
upstream_check_command: "make check"

# 配方 build() 里**没有**跑上游测试：跑它等于再编一遍 prank（0 个用例），
# 而且 check→first→all 会重新依赖 $(MANPAGES)，可能把 pod2man 拽回关键路径。
upstream_test_in_build: false
upstream_test_command: ""

# ── 一手清点命令与命中数（上游测试程序 = 0）──────────────────
# 在**干净解压树** prank-msa/ 根目录执行（取自下载缓存里的字节级校验包
# sha256=4847b565…113b9，2026-09-26 A 机实测；括号内为实测输出）：
#   find . -iname 'test*' -o -iname '*test*'          → 0 行
#   find . -iname '*check*'                           → src/check_version.cpp、src/check_version.h（源码树内 2 个；
#         构建树另有产物 check_version.o）——二者**是生产目标不是测试**：名字里的 check 是“版本自检”功能，
#         check_version.cpp 列于 src/Makefile:71 SOURCES、check_version.o 列于 :107 OBJECTS、check_version.h 列于 :346 头文件依赖清单，
#         编译规则在 :497（`check_version.o: check_version.cpp check_version.h`）、链接进 prank 二进制；
#         故此 *check* 形态虽在 *test* 面之外，仍已逐一核实为非测试用例（清点面已补齐）
#   ls -d tests test                                  → No such file or directory（两个目录都不存在）
#   grep -nE '^check:|TESTS|add_test' src/Makefile    → 1 行（src/Makefile:160: check: first）
#   grep -rn 'add_test\|CTest' .                      → 0 行（无 CTest/测试注册）
#   grep -rn 'ASSERT_\|EXPECT_\|TEST(\|TEST_F(' src/*.cpp src/*.h → 0 行（无测试框架用例）
#   grep -rn 'assert(\|FAIL\|EXPECT' src/*.cpp        → **61 行**，逐条核实**全部不是测试用例**：
#       · 60 行 `assert(xa>0)` 维度前置条件**调用**集中在 boolmatrix.cpp / dbmatrix.cpp /
#         flmatrix.cpp / intmatrix.cpp 这 4 个生产源文件（实测 `grep -rc assert( src/*.cpp` 每文件 15 条）；
#         而 `#include <cassert>` 的**实际主语是同名 4 个头文件** boolmatrix.h / dbmatrix.h /
#         flmatrix.h / intmatrix.h（各 1 次，均在 src/*.h 第 32 行；`grep -rln cassert src` 只命中这 4 个
#         .h、`.cpp` 内为 0），且构建带 `-DNDEBUG`（Makefile 第 9 行 DEFINES），这些 assert 在产物里被编译掉；
#       · 余下 1 行是 prank.cpp:78 的 `exit(EXIT_FAILURE)`，是错误退出码常量，不是断言宏。
#   find . -name '*.fas' -o -name '*.fasta' -o -name '*.tre' -o -name '*.dnd' → 0 行（上游不带样例语料）
# 文件普查：77 个文件 = 36 *.cpp + 37 *.h + src/Makefile + src/prank.1
#            + src/prank.1.pod + VERSION_HISTORY（c=0 py=0 sh=0 pl=0）
upstream_tests: []

# 显式声明：不是"环境跑不了"，而是上游根本没有测试可跑。
upstream_tests_exist: false
upstream_test_exemption_reason: >
  PRANK 250331 上游不发测试套件：官方源码快照 77 个文件里没有任何测试/基准程序、
  没有样例语料，Makefile 的 check 目标不依赖任何测试程序
  （check: first → first: all → all: Makefile prank prank.1；实测 `make -n check`
  展开为 37 条构建命令、0 条测试命令）。
  因此层 1 无对象可执行，行为证据全部由层 2 的消费者测试
  （test_package/msa_check.py）承担。

# ── 层 2：test_package 消费者测试 ────────────────────────────
test_package_tests:
  - file: msa_check.py
    description: >
      以使用者身份运行**打包后的** prank 二进制，7 个场景共 37 条断言，
      每条同时判退出码与输出内容：
      S1 版本/帮助界面 4 条（--version 与 -help 的退出码 + 版本横幅 v.250331
      + 文档化选项）；
      S2 DNA 多序列比对 15 条（退出码、PRANK v.250331 横幅、似然得分行、
      输入回显、dna_aln.best.fas 落盘、记录数=4、记录名、列宽一致、列宽不短于
      最长输入、缺口列确实产生、缺口分布与序列长度自洽、4 条序列去缺口后与输入
      逐字节相同）；
      S3 指导树 4 条（-showtree 退出码、tree_aln.best.dnd 落盘、Newick 括号
      平衡、4 个叶标签齐全）；
      S4 蛋白模型 3 条（-protein 退出码、记录数、列宽一致且不短于最长输入）；
      S5 格式转换 5 条（-convert 到 phylip/nexus 的退出码、conv.phy 落盘、
      phylip 计数表头=4、nexus 首行 #NEXUS）；
      S6 输出量控制 3 条（-quiet 退出码、报告确实变短且非空、比对产物仍在）；
      S7 负向对照 3 条（输入文件缺失必须非零退出、必须打印
      "Failed to open sequence file"、且不得留下比对产物）。
      空壳二进制、只打印不干活、或把缺口模型跑飞的产物都无法通过。
    command: "python3 msa_check.py --prank <package>/bin/prank --work <tmp>"

# 上游静态声明的测试程序数 = 0（Makefile 里没有任何测试程序，见上面的逐条清点）。
# 消费者断言数 = 37（N_consumer = 1 个程序 msa_check.py），上游实测执行 = 0（与 notes.md 五维表、
# manifest.yaml tests 段三处同源）；判决行的**权威锚点**是 sha 锁定的 reports/w3-local-ci.log：
#   reports/w3-local-ci.log        —— 实算 sha256=9c9c009b…e1c4，与 .ci-result.json.log_sha256 逐字相同；
#         :188 Calling build()、:1273 Calling package()、:1345 MSA_CHECK_RESULT=、:1347 HMBS_TEST_PACKAGE_RESULT=、
#         :1348 consumer MSA harness 37/37；且 :170 打印 Forced build from source ⇒ 真编译。
#   reports/conan-create.log       —— 现仅 131 行、是其**后**一次缓存命中（G2 复跑）的单轮日志
#         （:62/:77 Already installed、Calling build 计数 0），虽也印上述两条机器可读行，但**只作旁证、
#         不作** build()/package()/判决的行号锚。
upstream_test_case_count: 0
assertion_count: 37
