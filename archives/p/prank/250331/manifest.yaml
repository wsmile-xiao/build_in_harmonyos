# 版本级 manifest — prank 250331
# 文件位置: archives/p/prank/250331/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "250331"

software: "prank"

# built = conanfile 已生成且 conan verify 通过、未上传制品仓
# （conan-verify/finish 的实测判决见 reports/conan-verify-report.md）
status: built

build_date: "2026-09-26"
build_system: "makefile"

conan_ref: "prank/250331"

# ============================================================
# 源码信息
# ============================================================

source:
  # 上游自己发布的源码快照（官方仓库内 binaries/previous_version/），
  # 取法见 conandata.yml 注释；sha256 与 Debian 索引公布的 prank 250331
  # 上游包逐字相同，作为交叉核验。Debian 池址本身不用作取源。
  url: "https://github.com/ariloytynoja/prank-msa/raw/refs/heads/master/binaries/previous_version/prank.source.250331.tgz"
  sha256: "4847b565eae3b99feaee2f53c0583a384c8fe3552b00cd019fca9ce4bff113b9"
  tar_format: tar.gz
  # 解压后唯一顶层目录 = prank-msa/，配方用 strip_root=True 剥掉
  root_dir: "prank-msa"
  # 版本串一致性一手证据：src/prank.cpp:41 `version = 250331;`
  version_stamp_evidence: "src/prank.cpp:41  version = 250331;"

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  # 无 configure/cmake/meson 层：全部通过 make 命令行变量覆盖注入
  configure_options: []
  make_arguments:
    - "-j1"
    - "-C <source_folder>/src"
    - 'CC="<conf tools.build:compiler_executables:c>"'
    - 'CXX="<conf tools.build:compiler_executables:cpp>"'
    - 'LINK="<same as CXX>"'
    - "DEFINES=-DNDEBUG"
    - 'CFLAGS="-O3 -DNDEBUG"'
    - 'CXXFLAGS="-O3 -DNDEBUG"'
    - 'INCPATH="-I."'
    - "LFLAGS="
    - "prank"

  # 精确依赖：无。preflight_check.sh 与 conanfile 均无 requires；
  # mafft/exonerate/bppancestor/raxmlHPC 只是上游按命令行选项外部调用的
  # 可选辅助程序，默认比对路径不依赖它们。
  dependencies: []

  cc: clang
  cxx: clang++
  compiler_version: "clang 15.0.4 (OHOS SDK 26.0.0.18), target aarch64-unknown-linux-ohos"
  profile: "ci/conan/profiles/ohos-aarch64"

  # 产物
  outputs:
    - "bin/prank"
    - "man/man1/prank.1"

# ============================================================
# 补丁信息
# ============================================================

# 零补丁：所有 OHOS 需要的改动都是 make 变量覆盖（见 build.make_arguments）
patches_applied: []

# ============================================================
# 测试台账（数字与 test_package/MANIFEST.yml、notes.md、
# reports/w3-local-ci.log 同源；口径 = docs/TEST_QUALITY_SPEC.md + R51）
# ============================================================

tests:
  # 上游静态声明的测试程序数（Makefile 里没有任何测试程序）
  upstream_declared: 0
  # 上游注册/可执行的测试数（`make -n check` 展开后仍为 0）
  upstream_registered_executable: 0
  # 上游实测执行的测试数 —— 上游无任何测试用例可执行（make -n check = 36 编译 + 1 链接、0 条测试命令）
  executed: 0
  # 消费者测试程序数（N_consumer，§10.1；与 notes.md 五维表、test_package/MANIFEST.yml 三处同源）
  consumer_programs: 1
  # test_package 消费者断言数（同一次 conan create 内实测，属消费者口径，不并入上游 executed）
  consumer_assertions: 37
  # 跳过数（技术原因：无 —— 本机即 OHOS 真机，交叉构建不适用于本 profile）
  skipped: 0
  # 失败数
  failed: 0
  # 实测证据行（可在 reports/w3-local-ci.log 内检索）
  evidence_marker: "MSA_CHECK_RESULT="
  evidence_marker_second: "HMBS_TEST_PACKAGE_RESULT="

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "裸 Makefile 的 CC/CXX/LINK/CFLAGS/CXXFLAGS/LFLAGS/INCPATH 全部用 make 命令行覆盖即可适配，不需要补丁（R1 参数最少化）"
  - "上游 Makefile 的 install/uninstall 是 FORCE 空规则，package() 必须自己放二进制，`make install` 是静默空操作"
  - "上游默认目标 all 依赖 $(MANPAGES)=prank.1 并用 pod2man 重生成；直接 make prank 目标可把 perl 摘出关键路径"
  - "prank 用 mkdtemp(TMPDIR|TMP|TEMPDIR|TEMP) 建临时目录；OHOS 上 /tmp 只读，测试与运行时必须给可写 TMPDIR"
  - "prank -version 走真实 TCP 连接去 prank-msa.googlecode.com 取更新（域已停），失败即 exit(1)；CI 的 L2 smoke 用 --version（未知选项分支）才会 exit(0)"
