# 版本级 manifest
# 文件位置: archives/p/pd-syslog/0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.1"

# 软件名
software: "pd-syslog"

# 编译状态
# published | built | failed | archived
# built = conan verify/本地 conan create 通过，尚未 conan upload 到制品仓
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-04"

# 构建系统
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 官方源码池，R39）。上游 GitHub 仓库自述为临时打包
  # 镜像且未对 0.1 打 tag，0.1 的发行 tarball 由 Debian multimedia 团队再分发，
  # 故以官方 pool 为该版本的权威来源。
  url: "https://deb.debian.org/debian/pool/main/p/pd-syslog/pd-syslog_0.1.orig.tar.gz"

  # 源码校验和（取自同 pool 中 GPG 签名的 pd-syslog_0.1-8.dsc）
  sha256: "7553a7c7601fca5488a0939d1784d0c0329515d454f9f4d02ba70b91f8319e09"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 构建选项（上游 Pd library template Makefile 未做任何平台补丁，仅命令行覆盖变量）
  configure_options:
    - 'UNAME=Linux  # 模板按 uname -s 全串匹配判定平台，OHOS worker 报 HarmonyOS，无 OHOS 分支'
    - 'CC=<OHOS clang，来自 tools.build:compiler_executables>'
    - 'PD_INCLUDE=<puredata 包>/include/pd'
    - 'prefix=<package_folder>  # 安装到 lib/pd-externals/syslog/，不落 /usr/local'
    - 'LDFLAGS=-Wl,-soname,syslog.pd_linux -Wl,-s'
    - 'STRIP=:  # 宿主 binutils strip 读不了 aarch64 ELF，改在链接期 -Wl,-s 完成 strip'

  # 编译依赖列表（格式: name/version）
  dependencies:
    - puredata/0.54.1

  # 编译器
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Pd 插件的 Pd 符号来自 Pd 进程映像（Pd 自身 -rdynamic），因此 package_info() 不导出任何 libs；实测 pd-syslog 只 GLOBAL UND 9 个 Pd 符号 gensym/class_new/class_addanything/floatinlet_new/getbytes/freebytes/atom_string/pd_new/s_，加 libc 的 syslog/openlog/closelog"
  - "未定义 PDINSTANCE 时 m_pd.h 把 s_ 声明为全局 t_symbol 结构体（&s_ 即取地址）；定义 PDINSTANCE 后同名标识符变成宏 (pd_this->pd_s_)，此时 shim 不应再为它定义符号——写 Pd 测试 shim 前必须先确认这两个分支"
  - "m_pd.h 带一个自引用的 legacy 宏 `#define class_addanything(x, y) class_addanything((x), (t_method)(y))`，它会改写同名函数的**定义**本身（两个形参正好匹配宏的两个参数），报「function cannot return function type」；shim 里定义前必须 #undef"
  - "Pd library template Makefile 按 uname -s 全串匹配选平台且无 OHOS 分支，OHOS worker 报 HarmonyOS ⇒ EXTENSION 空、链接退化成 -o syslog. 且无 -shared；必须命令行覆盖 UNAME=Linux。该故障在 WSL2（uname=Linux）上不可复现，本地全绿不能证明"
  - "该模板在 make install 阶段硬编码宿主 binutils `strip`，交叉编译时读不了刚生成的 aarch64 ELF（strip: Unable to recognise the format of the input file）⇒ 覆盖 STRIP=: 并改用链接期 -Wl,-s，同一份命令在 WSL 与 worker 行为一致"
  - "HarmonyOS PC 无 syslogd、/dev/log 不存在，musl 的 syslog() 静默失败：任何依赖真实日志行的测试都不可能通过。可行做法是让测试可执行文件自己定义 openlog/syslog/closelog（可执行文件在动态符号查找序中优先），断言插件实际转发的优先级/ident/格式化文本"
  - "puredata/0.54.1 是 application 包、cpp_info.includedirs 为空，但确实带 include/pd/m_pd.h：下游需从依赖 package_folder 探测 include/pd 与 include 并自行再导出（pd-libdir/1.11 已确立此模式）"
  - "pd-syslog 的 LICENSE.txt 是 GPL-2.0-or-later，不是 Pd 生态常见的 BSD——按 neighbors 推断许可证会写错配方 license 字段"
  - "Pd library template 的 -Wl,-rpath,\"\\$$ORIGIN\" 在 make+shell 双重转义后落成字面量 $ORIGIN 的 RUNPATH（不是 PID），对按绝对路径 dlopen 的插件无害，无需打补丁"
