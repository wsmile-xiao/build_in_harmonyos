# Test manifest for pd-syslog 0.1.
package: pd-syslog/0.1
homepage: "https://github.com/umlaeute/pd-syslog"
upstream_tarball: "https://deb.debian.org/debian/pool/main/p/pd-syslog/pd-syslog_0.1.orig.tar.gz"

# ── Upstream test inventory (pd-syslog 0.1) ─────────────────────────────────
# Counting unit: test CASES. pd-syslog 0.1 ships **no tests at all**, so the
# inventory is empty. Evidence (complete file list of the upstream tarball,
# 6 files, `tar tzf`):
#   syslog-0.1/Makefile
#   syslog-0.1/LICENSE.txt
#   syslog-0.1/README.txt
#   syslog-0.1/syslog.c
#   syslog-0.1/syslog-meta.pd
#   syslog-0.1/syslog-help.pd
# There is no tests/ or test/ directory and no assertion-bearing source; the
# Makefile is the Pd library template 1.0.14, whose only phony targets are
# install / dist / clean / etags — `grep -nE '^[a-z_-]+:' Makefile` finds no
# `check`/`test` target. The whole library is one 155-line source file
# (syslog.c) whose behaviour is registered into Pd at load time, so upstream has
# nothing to assert without a running Pd. Note also that the *only* observable
# effect of the library is a call to libc syslog(3), which on a build machine
# goes to the host's syslogd — not something a test could read back.
upstream_test_in_build: false
upstream_test_count: 0
upstream_passed: 0
upstream_failed: 0
upstream_run: 0
upstream_not_run: 0
upstream_test_sources: []
upstream_no_test_evidence: >-
  Upstream tarball contains 6 files (Makefile, LICENSE.txt, README.txt,
  syslog.c, syslog-meta.pd, syslog-help.pd) and no test directory; the Pd
  library template Makefile 1.0.14 defines no check: or test: target. The
  library's only effect is a libc syslog(3) call, so no assertion is possible
  upstream without a live Pd plus a syslog daemon to read back.

# ── HarmonyOS-specific test added by this adaptation ────────────────────────
# There is no upstream test to port, so the behaviour is pinned by a consumer
# test that drives the packaged plugin exactly the way Pd does. It is specific
# to this adaptation in two ways: (a) it embeds a minimal Pure Data runtime
# shim so the delivered OHOS aarch64 shared object can be exercised without a Pd
# process, which is impossible for a host-native Pd build; and (b) it interposes
# openlog/syslog/closelog so the assertions read back what the plugin actually
# forwarded — necessary because HarmonyOS PC has no syslogd and /dev/log does
# not exist, so musl's syslog() fails silently and no log line can ever be read.
test_files:
  - path: "test_package/pd_syslog_test.c"
    test_type: "R34"
    harmonyos_specific: true
    assertion_count: 35
    description: >-
      Consumer program that provides the nine Pure Data entry points the plugin
      imports (gensym, class_new, class_addanything, floatinlet_new, getbytes,
      freebytes, atom_string, pd_new and the global s_) in an -rdynamic
      executable, dlopen()s the packaged syslog.pd_linux with RTLD_NOW, then
      calls the real syslog_setup() and drives the real object lifecycle.
      Asserts that the four packaged data files (syslog-meta.pd, syslog-help.pd,
      README.txt, LICENSE.txt) ship next to the plugin; that dlsym resolves
      syslog_setup while no bare `setup` exists; that exactly one class named
      `syslog` is registered with A_DEFSYM and both constructor and destructor;
      that class_addanything registers the message handler; that constructing
      with the empty selector openlog()s as "puredata" and with a named selector
      as that name, always with option 0 and facility LOG_USER; that the
      severity inlet lives inside the object's own storage; that the default
      severity is LOG_NOTICE and that writing LOG_ERR into the inlet changes the
      forwarded priority; that a float+symbol message is forwarded once as
      "bang 42 hello"; that the message buffer is requested at exactly
      strlen(message)+1 bytes and released again; that consecutive messages keep
      their order and their individual severities; that a selector-less message
      forwards only the atom text; that an empty message is dropped before any
      allocation; and that the destructor closes the log exactly once.

test_package_test_count: 1
consumer_assertion_count: 35
assertion_count: 35
