# conandata.yml — pd-syslog 0.1
#
# Source: the Debian *official* source pool for pd-syslog.  The canonical
# upstream home is the pd-syslog packaging repository
# (https://github.com/umlaeute/pd-syslog), which is explicitly marked as a
# temporary mirror "to be moved to pkg-multimedia" and carries no release
# tag for 0.1; the released 0.1 tarball is the one Debian's multimedia team
# redistributed, so deb.debian.org's pool is the authoritative origin for this
# exact version (R39).
#
# NOTE the tarball's root directory is `syslog-0.1`, not `pd-syslog-0.1`;
# source() uses strip_root=True so the recipe never has to care.
#
# sha256 taken from the GPG-signed pd-syslog_0.1-8.dsc in the same pool.

sources:
  "0.1":
    url: "https://deb.debian.org/debian/pool/main/p/pd-syslog/pd-syslog_0.1.orig.tar.gz"
    sha256: "7553a7c7601fca5488a0939d1784d0c0329515d454f9f4d02ba70b91f8319e09"

# No patches: the upstream Pd library template Makefile is driven entirely from
# make command-line variable assignments (UNAME / CC / PD_INCLUDE / prefix /
# LDFLAGS / STRIP).  See conanfile.py::_make_args() and notes.md.
