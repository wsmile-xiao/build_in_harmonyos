software: pth
display: "GNU Pth"
description: "GNU Portable Threads：基于 POSIX 线程/信号实现的协作式（非抢占）线程调度库，含 libpth、pth.h 与 pth-config"
category: library
homepage: "https://www.gnu.org/software/pth/"
license: LGPL-2.1-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 由 2006 年的老 autoconf 生成，硬编码 /tmp 作为参数文件暂存；OHOS 的 /tmp 只读 → 补丁改为 ${TMPDIR:-/tmp}"
    - "老 config.sub（2005）不识别 aarch64；pth 的机器上下文代码与方法相关（mcsc/sjlj）且无 aarch64 汇编，故用老 config.sub 认识的等价三元组 arm-unknown-linux-gnu 配置"
    - "OHOS bionic 不提供 makecontext/swapcontext → 强制 sjlj 方法 + sjlje 派发 + sas（sigaltstack）栈设置"
    - "生成脚本 config.status 用 `umask 077 && mktemp -d` 建暂存目录（mode 0700），在 HMDFS setgid 目录下不可写且 mktemp 恒 0700（umask 无效）→ 复用知识库 E011 / DRAFT-6507-cln-mktemp-0700-hmdfs，放弃 mktemp 改用 `umask 000 && mkdir`"
    - "CLI 工具：装 bin/pth-config，并提供软件级 commands.json"

versions:
  "2.0.7":
    status: built
    build_date: "2026-09-20"
    conan_ref: "pth/2.0.7"
