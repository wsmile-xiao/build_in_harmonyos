# test_package/MANIFEST.yml
# pth 2.0.7.

package: pth/2.0.7
homepage: https://www.gnu.org/software/pth/

upstream_tests_exist: true
upstream_test_audit: "上游 tarball 共 10 个测试程序（test_*.c，不含 test_common.c）：TARGET_TEST = test_std/test_mp/test_misc/test_philo/test_sig，另可选 test_select/test_sfio/test_uctx/test_pthread/test_httpd。`make test` 跑 test_std；build() 另以 `make test-mp test-misc < /dev/null` 跑 test_mp/test_misc（交互式程序，stdin 重定向到 /dev/null 读到 EOF 后退出）。"
upstream_check_command: "make test (test_std); make test-mp test-misc < /dev/null"
upstream_test_in_build: true
upstream_test_command: "timeout 300 make test; timeout 300 make test-mp test-misc < /dev/null"

# 上游共 10 个测试程序；其中 3 个在 build() 中真实运行并通过，
# 其余 7 个因交互/平台限制/非断言无法在 CI 判定，声明豁免（见下）。
upstream_tests_total: 10
upstream_tests_passed: 3
upstream_tests_skipped_reason: "test_sig 交互式（需 3 次 CTRL-C）；test_select 不退出；test_httpd 需网络服务器；test_pthread 本配置编译失败；test_sfio 未启用 --with-sfio（仅打印提示，非测试）；test_uctx 为性能基准（#define DO_SWITCHES 10000000，1000 万次上下文切换，非断言）；test_philo 为 60 秒观测型演示（无断言）"

upstream_tests:
  - name: "test_std"
    description: "standard Pth test suite: scheduler, spawn/join, events, message queues, mutexes, condition variables, cleanup handlers"
  - name: "test_mp"
    description: "multi-pool scheduler test (message ports)"
  - name: "test_misc"
    description: "miscellaneous API coverage"
  - name: "test_philo"
    description: "classic dining philosophers (60 s observation demo, no assertions) — exempted"
  - name: "test_sfio"
    description: "SFIO (stdio replacement) integration test (only built/run with --with-sfio; otherwise prints a notice) — exempted"
  - name: "test_uctx"
    description: "user-space context sub-API performance benchmark (10,000,000 switches; not an assertion test) — exempted"
  - name: "test_sig"
    description: "interactive signal handling test (waits for 3x CTRL-C) — exempted"
  - name: "test_select"
    description: "select()-based test (does not terminate) — exempted"
  - name: "test_pthread"
    description: "pthread wrapper test (does not build in this configuration) — exempted"
  - name: "test_httpd"
    description: "HTTP server test (needs network/bind) — exempted"

# 豁免声明（TEST_QUALITY_SPEC.md 3.3 / 平台限制）
exemptions:
  - rule: "upstream_test_full_run"
    reason: "test_sig 交互式（3x CTRL-C）、test_select 不退出、test_httpd 需网络服务器、test_pthread 本配置编译失败、test_sfio 未启用 --with-sfio、test_uctx 为 1000 万次切换的性能基准、test_philo 为 60s 观测型演示（后两者无断言），均无法在 CI 判定通过与否"

test_package_tests:
  - file: test_pth.c
    description: "compiles and runs a program that pth_init/pth_spawn/pth_join on OHOS, checking the mctx switch"
    command: "./test_pth"

test_files:
  - path: "test_package/test_pth.c"
    test_type: "R34"
    assertion_count: 1

test_package_test_count: 1
consumer_assertion_count: 1
assertion_count: 1
