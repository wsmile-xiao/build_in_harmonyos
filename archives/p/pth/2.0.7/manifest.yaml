software: pth
version: "2.0.7"
status: built
build_date: "2026-09-20"
build_system: autotools (old autoconf/libtool)
conan_ref: "pth/2.0.7"

source:
  url: "https://deb.debian.org/debian/pool/main/p/pth/pth_2.0.7.orig.tar.gz"
  sha256: "72353660c5a2caafd601b20e12e75d865fd88f6cf1a088b306a3963f0bc77232"
  tar_format: tar.gz

build:
  system: autotools
  build_command: "./configure --host=arm-unknown-linux-gnu --build=arm-unknown-linux-gnu --disable-shared --enable-static --with-mctx-mth=sjlj --with-mctx-dsp=sjlje --with-mctx-stk=sas; make; timeout 300 make test; timeout 300 make test-mp test-misc < /dev/null"
  dependencies: []
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "in-tree C 测试程序（上游共 10 个 test_*.c：test_std/test_mp/test_misc/test_philo/test_sig/test_select/test_sfio/test_uctx/test_pthread/test_httpd）"
  upstream_discovered: 10
  upstream_passed: 3
  upstream_failed: 0
  upstream_note: "上游共 10 个测试程序（test_*.c）：build() 中真实运行 3 个并通过（`make test`→test_std；`make test-mp test-misc < /dev/null`→test_mp/test_misc，二者为交互式程序，重定向 stdin 到 /dev/null 使其读到 EOF 后正常退出）；其余 7 个声明豁免：test_sig 交互式（需 3 次 CTRL-C）、test_select 不退出、test_httpd 需网络服务器、test_pthread 本配置编译失败、test_sfio 未启用 --with-sfio（仅打印提示）、test_uctx 为性能基准（10,000,000 次上下文切换，非断言）、test_philo 为 60 秒观测型演示（无断言）"
  test_package_passed: 1
  test_package_failed: 0
  test_package_assertions: 1
  execution: "conan create rc=0 + 上游 3/3（test_std/test_mp/test_misc）+ 消费者 1 条断言（pth_init/pth_spawn/pth_join 返回 42）"

test_passed: 2
test_failed: 0

patches_applied:
  - "0001-configure-writable-tmpdir.patch（configure 的 pconf 由 /tmp 改为 ${TMPDIR:-/tmp}）"

knowledge_gained:
  - "OHOS 的 /tmp 只读；autoconf 的暂存文件必须改到 ${TMPDIR:-/tmp}（设备 TMPDIR=$HOME）"
  - "老 config.sub 不认 aarch64（知识库 E007）；pth 无架构汇编（仅 1 处 __i386__），用 arm-unknown-linux-gnu 三元组即可"
  - "OHOS bionic 无 makecontext/swapcontext；pth 的 sjlj 方法（sigsetjmp/siglongjmp + sigaltstack）在 aarch64 可用"
  - "复用知识库 E011 / DRAFT-6507-cln-mktemp-0700-hmdfs：HMDFS setgid 父目录下 mode 0700 目录不可写，且 mktemp -d 恒 0700（umask 无效）→ 放弃 mktemp，改用 `tmp=./confstat$$-$RANDOM; (umask 000 && mkdir \"$tmp\")`"
  - "构建环境无 make -j（jobserver mkfifo 不被支持），去掉 -j 串行 make"
