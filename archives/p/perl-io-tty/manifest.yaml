software: perl-io-tty
display: "IO::Tty"
description: "Perl module for PTY/TTY operations - pseudo terminal interfaces"
category: system
homepage: "https://metacpan.org/pod/IO::Tty"
license: GPL-1.0-or-later
build_system: perl-Makefile.PL

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "Perl XS 模块需要 PERL_MM_OPT='LDFLAGS=-nostartfiles -nodefaultlibs'"
    - "配置检测需要硬编码 PTY/TTY 函数结果（CRT 文件缺失）"
    - "XS 模块在 HMDFS 无法加载，需管理员安装到 /data/service/hnp/"
  common_dependencies:
    - perl/5.42.0
    - musl/1.2.5

# 版本索引
versions:
  "1.20-r2":
    status: published
    build_date: "2026-06-12"