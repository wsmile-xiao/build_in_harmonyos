software: patch
display: "GNU Patch"
description: "GNU patch utility for applying diff files to original files"
category: build-tool
homepage: "https://ftp.gnu.org/gnu/patch/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "核心补丁功能已验证可用（apply/reverse/dry-run/unified diff/context diff）"
    - "32/44 测试通过，失败项为环境兼容性问题（umask差异/SELinux软链接限制）"
    - "无 xattr 支持（libattr 不可用）"

versions:
  "2.7.6":
    status: published
    build_date: "2026-03-23"
