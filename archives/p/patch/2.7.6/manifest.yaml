software: patch
version: 2.7.6
status: partial
build_system: autotools
category: development
description: GNU Patch - Apply a diff file to an original

harmonyos:
  triplet: aarch64-unknown-linux-ohos
  libc: musl
  compiler: clang 15.0.4

build:
  source: https://ftp.gnu.org/gnu/patch/patch-2.7.6.tar.xz
  system: autotools
  dependencies:
    - clang
    - make
  
  configure_flags:
    - --prefix=${HOME}/usr/local
  
  patches:
    - 0001-config-guess-harmonyos-support.patch
    - 0002-config-sub-harmonyos-support.patch

test:
  total: 44
  passed: 32
  failed: 9
  skipped: 1
  failures:
    - file-create-modes
    - file-modes
    - merge
    - no-mode-change-git-diff
    - preserve-mode-and-timestamp
    - remember-backup-files
    - symlinks
    - unmodified-files
  failure_reasons:
    - "file-modes: 鸿蒙默认 umask 不同"
    - "merge: shell shift 命令行为差异"
    - "symlinks: SELinux 软链接访问限制"

install:
  binaries:
    - $HOME/usr/local/bin/patch
  manuals:
    - $HOME/usr/local/share/man/man1/patch.1

notes:
  - 测试失败为环境兼容性问题，核心功能正常
  - 无 xattr 支持（libattr 不可用）
  - 核心补丁功能已验证可用

build_date: 2026-03-23