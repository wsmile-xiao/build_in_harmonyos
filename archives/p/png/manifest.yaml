software: png
display: "png++"
description: "Header-only C++ wrapper for libpng"
category: graphics
homepage: "https://www.nongnu.org/pngpp/"
license: BSD-3-Clause
build_system: make

ohos_adaptation:
  key_points:
    - "Header-only package installs 29 public headers under include/png++."
    - "Compiler-provided byte-order macros add musl/HarmonyOS portability without architecture hard-coding."
    - "Conan target png::png propagates the exact libpng/1.6.58.2 dependency."
  common_dependencies:
    - libpng

versions:
  "0.2.10":
    packaging: conan
    status: built
    build_date: "2026-09-07"
    published_as: png
    source_url: "https://download-mirror.savannah.gnu.org/releases/pngpp/png++-0.2.10.tar.gz"
