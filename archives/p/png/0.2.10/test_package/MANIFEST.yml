package: png/0.2.10
homepage: "https://www.nongnu.org/pngpp/"

upstream_check_command: "make test && make test-compile-headers && make examples"
upstream_test_in_build: false
upstream_test_command: "make test"
upstream_tests:
  - file: "test/test.sh"
    source: "png++-0.2.10/test/test.sh"
    description: "Seven upstream executables exercise 97 PngSuite images across pixel formats and buffer implementations."
    command: "make test"
    result: "1492/1566 byte-exact comparisons passed. The remaining 74 are PB/PB2 duplicates of 37 legacy golden files: 5 decode identically and 32 RGB-to-gray outputs differ by at most one output LSB. The identical result was reproduced on WSL, so it is not OHOS-specific."
  - file: "*.hpp"
    source: "png++-0.2.10/*.hpp"
    description: "Each of the 29 public headers is compiled independently."
    command: "make test-compile-headers"
    result: "29/29 compiled with OHOS Clang 15 for x86_64-linux-ohos."
  - file: "example/pixel_generator.cpp"
    source: "png++-0.2.10/example/pixel_generator.cpp"
    description: "Official consumer example compile and link check."
    command: "make examples"
    result: "Compiled and ran on HarmonyOS 6.0 x86_64; generated a valid 32x512 1-bit grayscale PNG."

test_package_tests:
  - file: "test_png.cpp"
    description: "Consumer-side RGB image write/read round trip with dimensions and exact pixel validation."
    command: "test_png"
    result: "9/9 passed on HarmonyOS 6.0 x86_64; arm64 OHOS Conan cross-build compiled and linked successfully."

upstream_assertion_count: 1566
upstream_assertion_passed: 1492
upstream_legacy_golden_mismatch_count: 74
upstream_compile_check_count: 30
test_package_assertion_count: 9
assertion_count: 1575
