software: png
version: "0.2.10"
build_system: make
package_type: header-only
status: built
build_date: "2026-09-07"

source:
  url: "https://download-mirror.savannah.gnu.org/releases/pngpp/png++-0.2.10.tar.gz"
  sha256: "998af216ab16ebb88543fbaa2dbb9175855e944775b66f2996fc945c8444eee1"
  tar_format: tar.gz

build:
  system: header-only
  dependencies:
    - "libpng/1.6.58.2"
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-detect-compiler-byte-order.patch"
    description: "Use compiler-provided byte-order macros on OHOS and other non-glibc platforms."

knowledge_gained:
  - "The repository archive and Conan reference are png/0.2.10, while the corresponding Conan Center recipe is pngpp/0.2.10."
  - "png++ is header-only but links transitively to libpng; the package contains 29 public headers under include/png++."
  - "OHOS Clang defines __BYTE_ORDER__ and __ORDER_*_ENDIAN__, while png++ 0.2.10 only recognizes glibc, Windows, Apple, FreeBSD, and Solaris."
  - "The 2019 byte-exact upstream goldens have 74 reproducible mismatches with contemporary build environments; all RGB-to-gray pixel deltas are bounded to one output LSB and are not OHOS-specific."
