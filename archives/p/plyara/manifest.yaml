# 软件级 manifest — plyara
# 遵循 ARCHIVE-SPEC v3.0

software: plyara
display: "plyara"
description: "plyara — 把 YARA 规则解析为 Python 字典表示（纯 Python，内嵌 PLY 词法/语法分析器）"
category: library
homepage: "https://github.com/plyara/plyara"
license: Apache-2.0
build_system: none

ohos_adaptation:
  key_points:
    - "纯 Python noarch（package_type=python-require）：无 C/C++ 编译；产物 =
      lib/python3.12/site-packages/{plyara,ply} + bin/plyara（R38 命令行工具声明）"
    - "上游内嵌 git submodule third_party/ply（github.com/plyara/ply）+ src/ply
      符号链接；GitHub 归档不含 submodule 内容 → conanfile.py source() 按 pin 死的
      commit 单独获取并落位，package() 拷贝真实内容（不依赖符号链接存续）"
    - "内嵌 PLY 为 4.x（2022.10.27）：yacc() 无 write_tables → 运行时不写
      parsetab.py/parser.out，可交付到只读工作目录/文件系统（OHOS 专项测试断言）"
    - "源码零平台分支 → 无需任何 OHOS 源码补丁；适配集中在交付形态与运行时契约"
    - "OHOS /tmp 不可写且不可读（E002）——plyara 本体不依赖 tempfile"

versions:
  "2.2.8":
    status: built
    build_date: "2026-09-27"
    conan_ref: "plyara/2.2.8"
    note: "上游 unittest 107/107 通过（0 失败/0 错误/0 跳过，Ran 107 tests in 913.6s）
      + test_package 消费者/鸿蒙专项测试通过"
