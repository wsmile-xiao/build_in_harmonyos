# 版本级 manifest — plyara 2.2.8
# 遵循 ARCHIVE-SPEC v3.0

version: "2.2.8"
software: "plyara"
status: built
build_date: "2026-09-27"
build_system: none

source:
  url: "https://github.com/plyara/plyara/archive/refs/tags/v2.2.8.tar.gz"
  sha256: "0d546061140fe11edcabae9cbb9ae417496a07288464c0bfd036892a1da096a1"
  tar_format: tar.gz

# 上游 .gitmodules 内嵌 submodule（GitHub 归档不含其内容，单独获取）
submodule_sources:
  - path: "third_party/ply"
    url: "https://github.com/plyara/ply/archive/5c4dc94d4c6d059ec127ee1493c735963a5d2645.tar.gz"
    sha256: "31bf86a459026e5abfa9ef4312d75922a6c69df52ca322238b670ca4f35892cd"
    commit: "5c4dc94d4c6d059ec127ee1493c735963a5d2645"
    version: "2022.10.27"

build:
  # 纯 Python noarch：无 C/C++ 编译，无 configure/make 阶段
  system: none
  configure_options: []
  dependencies: []
  cc: ""
  cxx: ""

# 无源码补丁：源码零平台分支（grep 零命中 sys.platform / os.name / platform.*）
patches_applied: []

knowledge_gained:
  - "plyara 是纯 Python YARA 规则解析器（lex/yacc 生成），零运行时第三方依赖"
  - "上游把 PLY 以 git submodule 内嵌（third_party/ply），并用 src/ply 符号链接暴露给 plyara.core；GitHub tag 归档不含 submodule 内容 → 归档/打包会因悬空符号链接失败，必须按 pin 死的 commit 单独获取并落位（ableton-link 3.1.2 同类先例）"
  - "内嵌 PLY 为 4.x（__version__=2022.10.27，yacc() 已无 write_tables 参数）→ 运行时不再向 cwd / 包目录写 parsetab.py，可安全交付到只读文件系统"
  - "R38：上游 pyproject.toml 声明 [project.scripts] plyara = plyara.command_line:main → 产物含可执行文件，需软件级 commands.json 并生成 bin/plyara 入口"
  - "OHOS /tmp 既不可写也不可读（E002 加强版：/tmp Permission denied 且 Read-only file system）→ 依赖 tempfile 默认目录的工具需显式 TMPDIR 回退；plyara 本体不使用 tempfile"
  - "框架缺陷（可稳定复现，已在本归档 notes.md 第八节留证）：ci/conan/build_and_test.sh 的 Mirror fallback 改写先于预下载段备份执行，导致 EXIT 还原写回的是已污染快照 → 每次 finish/conan-verify/W3 后 conandata.yml 都被改成 [gh-proxy.com 镜像, 官方] 列表，违反 R39/PF7，提交前必须人工还原为单 URL 官方源"
  - "框架缺陷：init-build 的 _create_dual_track 在本机 HMDFS 上必然失败（os.link EPERM），兜底 copy2 又因上游 tarball 不含 submodule 造成 src/ply 悬空符号链接而报 ENOENT → 含 submodule 的包无法走 Mode A，需手动模式"
