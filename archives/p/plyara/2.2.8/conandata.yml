# conandata.yml — plyara 2.2.8
# 源码来自上游官方 GitHub tag archive（R39 合规：仅官方源，不手动加镜像前缀；
# CI 的 build_and_test.sh 会在构建期自动追加镜像 fallback）
#
# ⚠️ 本地执行 finish/conan-verify/W3 后，框架会临时把官方 URL 改写为
#    [gh-proxy.com 镜像, 官方] 列表；若发现本文件被改写，属框架还原缺陷
#    （见 notes.md 第四节 #6），需人工还原为下方单 URL 官方源形态再提交。

sources:
  url: "https://github.com/plyara/plyara/archive/refs/tags/v2.2.8.tar.gz"
  sha256: "0d546061140fe11edcabae9cbb9ae417496a07288464c0bfd036892a1da096a1"

# GitHub 归档不含 git submodule 内容（ableton-link 3.1.2 先例）。
# 上游 .gitmodules（path = third_party/ply）指向 github.com/plyara/ply，
# 且 src/ply 是指向 ../third_party/ply/src/ply 的符号链接 —— plyara/core.py
# 顶层 `import ply.lex / ply.yacc` 依赖它。submodule 缺失时该符号链接悬空，
# 归档/打包会直接失败（init-build 实测 [Errno 2] No such file or directory）。
# 故按上游 pin 死的 commit 单独获取并落位到 third_party/ply。
ply:
  url: "https://github.com/plyara/ply/archive/5c4dc94d4c6d059ec127ee1493c735963a5d2645.tar.gz"
  sha256: "31bf86a459026e5abfa9ef4312d75922a6c69df52ca322238b670ca4f35892cd"
  commit: "5c4dc94d4c6d059ec127ee1493c735963a5d2645"
  version: "2022.10.27"

patches: {}
