# test_package/MANIFEST.yml — plyara/2.2.8
# CI 脚本 build_and_test.sh L0e 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: plyara/2.2.8
homepage: "https://github.com/plyara/plyara"

# ── 上游测试（唯一官方入口）────────────────────────────────────────────
# 上游 .github/workflows/test-action.yaml 的命令：
#   pip install .[tests] && python -m unittest discover
# 本机实测（2026-09-27，Python 3.12.9 / OHOS aarch64）：
#   Ran 107 tests in 913.568s
#   OK            ← 107 passed / 0 failed / 0 error / 0 skipped
upstream_check_command: "python3 -m unittest discover"

upstream_test_in_build: true
upstream_test_command: >-
  PYTHONPATH=<src>:<test-extras> python3 -m unittest discover -v
  （在 conanfile.py build() 中执行；缺失 [tests] extra 时尽力装到
  build_folder 私有目录）

upstream_tests:
  - file: tests/test_command_line.py
    description: >-
      CLI 套件 3 用例（nolog / withlog / filenotfound；输出 sha256 与上游
      期望集合比对）
    command: "PYTHONPATH=<src> python3 -m unittest -v tests.test_command_line"
  - file: tests/test_core.py
    description: >-
      解析核心套件 80 用例（TestRuleParser 24 / TestYaraRules 43 /
      TestImports 8 / TestStoreRawSections 4 / TestRuleParserKVMeta 1，
      含多线程解析）
    command: "PYTHONPATH=<src> python3 -m unittest -v tests.test_core"
  - file: tests/test_issues.py
    description: >-
      GitHub issue 回归 15 用例（issue 63/99/107/109/112/115/118/141×2/143/
      144/145/150/153/156）
    command: "PYTHONPATH=<src> python3 -m unittest -v tests.test_issues"
  - file: tests/test_utils.py
    description: "语义工具套件 5 用例（generate_hash / rebuild_yara_rule / legacy 哈希）"
    command: "PYTHONPATH=<src> python3 -m unittest -v tests.test_utils"
  - file: tests/test_linters.py
    description: >-
      PEP-8 / PEP-257 / pyflakes 静态检查 3 用例（需要上游 [tests] extra：
      pycodestyle / pydocstyle / pyflakes）
    command: "PYTHONPATH=<src>:<test-extras> python3 -m unittest -v tests.test_linters"
  - file: tests/test_third_party_repositories.py
    description: >-
      真实克隆 14 个公开 YARA 规则仓库并逐条解析（网络依赖；本机实测
      git clone github.com 可用，该用例实跑非空壳）
    command: "PYTHONPATH=<src> python3 -m unittest -v tests.test_third_party_repositories"

# ── test_package 自带测试（消费者视角 + 鸿蒙专项）─────────────────────
test_package_tests:
  - file: test_plyara.py
    description: >-
      R34 消费者测试：从包内 site-packages 导入 plyara + 内嵌 PLY，真实调用
      parse_string / parse_file / store_raw_sections / meta_as_kv /
      utils.generate_hash / utils.rebuild_yara_rule
    command: "python3 test_plyara.py <package_folder> <site_packages>"
  - file: test_ohos_plyara.py
    description: >-
      鸿蒙专项测试（本适配新增，上游无对应用例）：OHOS-1 平台身份
      (HarmonyOS/aarch64)、OHOS-2 vendored PLY 落位包内、OHOS-3 只读工作目录
      与只读 TMPDIR 下 CLI 输出一致且零生成物、OHOS-4 TMPDIR 指向
      /data/storage/el2 沙箱可用、OHOS-5 包内 bin/plyara 对上游官方 CLI 夹具
      的输出 sha256 命中上游期望基线
    command: "python3 test_ohos_plyara.py <package_folder> <site_packages>"

# 上游测试总数（本机实测，含全部 6 个模块）
upstream_test_count: 107
upstream_test_result: "107/107 通过（0 失败 / 0 错误 / 0 跳过）"

# test_package 断言数（近似值，用于质量评估）
assertion_count: 17
