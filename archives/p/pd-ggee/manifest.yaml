software: pd-ggee
display: "pd-ggee"
description: "Pure Data 外部对象库 ggee（控制/实验/滤波/GUI/信号 五类共 42 个类，Guenter Geiger）"
category: audio
homepage: "https://github.com/pd-externals/ggee"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游自带 pd-lib-builder(Makefile.pdlibbuilder v0.6.0)，按 class.sources 逐类产出 <class>.pd_linux 共享对象；本次构建 42 个"
    - "pd-lib-builder 依 $(CC) -dumpmachine 判定平台（不是 uname）：aarch64-...-linux-ohos 命中 linux 分支 → .pd_linux 扩展名 + -DUNIX；配方仍显式传 system=Linux 兜底"
    - "Pd API 头来自制品仓 puredata/0.54.1（application 类型不导出 includedirs，但 include/pd/ 下有 m_pd.h 与 g_canvas.h），配方从依赖包目录解析 PDINCLUDEDIR"
    - "上游源码零改动零补丁即可在 OHOS aarch64 编译通过（仅 unused/implicit-declaration 警告）"
    - "消费者测试用真机/仿真 OHOS pd 无头加载安装后的 42 个外部对象中的 3 个并驱动 [constant pi]/[sinh]/[inv]"
  common_dependencies:
    - "puredata/0.54.1"

versions:
  - version: "0.28"
    status: built
    build_date: "2026-10-04"
