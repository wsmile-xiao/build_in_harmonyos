# test_package/MANIFEST.yml
# pd-ggee 0.28 - upstream test declaration.

package: pd-ggee/0.28
homepage: "https://github.com/pd-externals/ggee"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships only Pd help patches (45 *-help.pd files), a library meta
  patch (ggee-meta.pd) and two data files (gui/state.list, gui/logo100.gif).
  There is no make check / ctest / pytest registration and no automated test
  harness anywhere in the tarball; the classes can only be exercised by loading
  them into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_ggee.sh
    description: "headless OHOS pd loads the installed ggee externals and drives [constant pi]->3.14159, [sinh 2]->3.62686, [inv 10]->0.1"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_ggee.pd sh test_pd_ggee.sh"

test_files:
  - path: "test_package/test_pd_ggee.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_ggee.sh"
    test_type: "R34"
    assertion_count: 3

test_package_test_count: 1
consumer_assertion_count: 3
upstream_test_cases: 0
assertion_count: 3
