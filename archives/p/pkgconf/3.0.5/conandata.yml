sources:
  url:
    - "https://distfiles.ariadne.space/pkgconf/pkgconf-3.0.5.tar.xz"
    - "https://distfiles.alpinelinux.org/distfiles/edge/pkgconf-3.0.5.tar.xz"
  sha256: "3acd3a8a3cce65a8d620321855d92fb602e026cbe8e13ee36bdec58483b59ace"

patches:
  - patch_file: "patches/0001-meson_options.txt.patch"
    patch_description: "0001 Add an opt-in reallocarray shim for validation executables"
    patch_type: "portability"
  - patch_file: "patches/0002-fuzzer-parser-fuzzer.c.patch"
    patch_description: "0002 Use TMPDIR for parser replay and fail closed on temporary-file errors"
    patch_type: "portability"
  - patch_file: "patches/0003-fuzzer-replay.c.patch"
    patch_description: "0003 Make corpus replay fail closed and report the exact replayed input count"
    patch_type: "portability"
  - patch_file: "patches/0004-fuzzer-solver-fuzzer.c.patch"
    patch_description: "0004 Use TMPDIR for solver replay and propagate temporary-file failures"
    patch_type: "portability"
  - patch_file: "patches/0005-tests-api-reallocarray-shim.c.patch"
    patch_description: "0005 Provide an overflow-safe reallocarray only to validation executables"
    patch_type: "portability"
  - patch_file: "patches/0006-meson.build.patch"
    patch_description: "0006 Bind wrap semantics, shared OOM boundaries, and replay regressions"
    patch_type: "portability"
  - patch_file: "patches/0007-tests-api-tmpfile.patch"
    patch_description: "0007 Use TMPDIR-backed anonymous streams for API tests"
    patch_type: "portability"
