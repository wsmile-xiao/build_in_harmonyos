software: pkgconf
display: pkgconf
description: pkg-config compatible dependency metadata resolver and library
category: build-tool
homepage: https://github.com/pkgconf/pkgconf
license: ISC
build_system: meson

ohos_adaptation:
  library: static
  commands:
    - pkgconf
    - bomtool
    - spdxtool
    - pccritic
  pkg_config_alias: false
  external_dependencies: []

versions:
  "2.5.1":
    status: published
    archive: archives/p/pkgconf/2.5.1
  "3.0.4":
    status: published
    conan_ref: pkgconf/3.0.4
    archive: archives/p/pkgconf/3.0.4
  "3.0.5":
    status: built
    conan_ref: pkgconf/3.0.5
    archive: archives/p/pkgconf/3.0.5
  "3.0.6":
    status: built
    conan_ref: pkgconf/3.0.6
    archive: archives/p/pkgconf/3.0.6
