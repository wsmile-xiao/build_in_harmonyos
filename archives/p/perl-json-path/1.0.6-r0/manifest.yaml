software: perl-json-path
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.6-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.6-r0"

# 构建系统类型（顶层字段，G4 门禁检查）
build_system: perl-extutils-makemaker

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-13"

# 测试日期（YYYY-MM-DD）
test_date: "2026-06-13"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/downloads/JSON-Path-1.0.6.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - perl-carp-assert/0.21
    - perl-exporter-tiny/1.006002
    - perl-json-maybexs/1.004008
    - perl-lv/0.006
    - perl-readonly/2.05
    - perl-try-tiny/0.31
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 编译环境变量
  environment:
    PERL5LIB: "/storage/Users/currentUser/usr/local/lib/site_perl/5.42.0:/storage/Users/currentUser/usr/local/lib/5.42.0"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块（无XS组件）使用 perl Makefile.PL PREFIX=$DEFAULT_PREFIX 编译"
  - "纯Perl模块无需特殊链接参数（如 -nostartfiles -nodefaultlibs）"
  - "纯Perl模块无SELinux HMDFS加载限制，可在用户目录直接使用"
  - "JSON::Path依赖多个纯Perl模块（Carp::Assert, Exporter::Tiny, LV, Readonly等）需预先安装"
  - "使用metacpan.org API可获取正确的CPAN模块下载URL"
  - "JSON::Path安全模式限制复杂过滤器表达式，建议使用简单路径查询"
  - "纯Perl模块功能测试通过率90%，核心功能正常"
  - "纯Perl模块打包后体积小（64KB），易于部署"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
