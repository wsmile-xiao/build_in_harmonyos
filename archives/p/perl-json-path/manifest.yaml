software: perl-json-path
display: "JSON::Path"
description: "Perl module for JSONPath query - search nested hashref/arrayref structures using JSONPath"
category: data
homepage: "https://metacpan.org/pod/JSON::Path"
license: Perl
build_system: perl-extutils-makemaker

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "纯Perl模块，无XS组件，无需特殊编译参数"
    - "无SELinux HMDFS加载限制，可在用户目录直接使用"
    - "依赖多个纯Perl模块需预先安装"
    - "JSON::Path安全模式限制复杂过滤器表达式"
  common_dependencies:
    - perl-carp-assert
    - perl-exporter-tiny
    - perl-json-maybexs
    - perl-lv
    - perl-readonly
    - perl-try-tiny

# 版本索引
versions:
  "1.0.6-r0":
    status: built
    build_date: "2026-06-13"
    test_date: "2026-06-13"