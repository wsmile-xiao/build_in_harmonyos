# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在。
#
# 上游测试清点（ppsmall-1.0.tar.Z，逐文件核对）：
#
#   upstream_test_targets = 1   Makefile 的 "check" 目标（all: ppunpack check）
#   upstream_case_total   = 1   check: ppunpack sf.pp sf && diff sf sf.chk
#   upstream_executed     = 1   test_package U1，1/1 通过
#
# 依据：ppsmall-1.0.tar.Z 只有 5 个文件 —— README(963 B)、Makefile(393 B)、
# depack.c、depack.h、ppunpack.c，不含测试数据（readme："This small archive does
# not include any test file."）。check 用的 sf.pp(78060 B)/sf.chk(140095 B) 随 Aminet
# 的 long 版 ppunpack-1.0.tar.Z 分发（sha256 1b06fd4d...9f13be，其 5 个程序文件与
# short 版逐字节相同）。包源码仍只用 short 版；test_package 下载 long 版只取这两个
# 数据文件，原样执行 check 目标的两条命令。上游测试未做修改。

package: ppunpack/1.0
homepage: "https://aminet.net/package/misc/unix/ppsmall-1.0"

upstream_tests_exist: true
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "ppunpack sf.pp sf && diff sf sf.chk（在 test_package/conanfile.py 的 _upstream_check 中执行，比较为逐字节）"

upstream_tests:
  - file: Makefile
    source: ppsmall-1.0/PPUnpack/Makefile (target "check")；数据 ppunpack-1.0.tar.Z 中的 PPUnpack/sf.pp、PPUnpack/sf.chk
    description: "U1：ppunpack sf.pp sf 后 sf 必须与 sf.chk 逐字节相同（140095 字节）"
    command: "ppunpack sf.pp sf && diff sf sf.chk"
    runnable: true

# 我们补的验证：现场生成 PP20 文件，让安装后的 bin/ppunpack 还原并逐字节比对
test_package_tests:
  - file: test_package/conanfile.py + test_package/pp20.py
    description: >-
      pp20.py 是按 depack.c 位流逆推的 PP20 编码器（逆序 LZ77、字节尾部向前按 LSB 读位、
      尾部 3 字节大端长度 + 1 字节 skip 位数），并报告用到了哪些码路径。
      ① 无参数 → exit 1 且输出 "ppunpack 1.0"/"Usage:"；② 1320 字节文本往返；
      ③ 700000 字节往返，断言用到字面量串、2/3/4 字节匹配、5+ 字节匹配的 7 位与 13 位偏移全部 6 条码路径；
      ④ 1 字节载荷往返；⑤ 非 PP20 文件 → exit 10 + "not a powerpacked file" 且不产生输出文件；
      ⑥ 输入不存在 → exit 10 + "can't open input file"；
      ⑦【鸿蒙特有】消费者流程（test_package/consumer.c）：前置确认 bin/ppunpack 为 ELF64 AArch64、带 OHOS NDK
      .note.ohos.ident、static PIE（无 PT_INTERP）；a) consumer.c 编成 PP20 后由 ppunpack 还原，逐字节等于原文件；
      b) 用 profile 的 OHOS clang 把还原出的源码编成 AArch64 static PIE；c) 运行消费者，它在 OHOS musl 上
      fork/execv/waitpid 调用 ppunpack 还原 700000 字节文件并 memcmp 校验，且普通文件被拒（exit 10、无输出）。
  - file: test_package/consumer.c
    description: "用例 ⑦ 的消费者程序：由 ppunpack 还原后编译运行，以子进程方式调用 ppunpack 并校验输出"
    command: "ppunpack <in.pp> <out>（AArch64 runner 原生执行；其他架构经 qemu-aarch64，缺 qemu 即失败）"

assertion_count: 8   # 上游 U1 + 新增 7
