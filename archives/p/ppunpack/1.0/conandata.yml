# conandata.yml — ppunpack 1.0
# Source: Aminet (the project's original distribution point), FAU mirror.
#   Aminet package page misc/unix/ppsmall-1.0 ("PowerPacker decruncher 1.0,
#   short version", Marc Espie / Nico Francois).
# Aminet lists two archives for this program; this recipe uses the SHORT one,
# ppsmall-1.0.tar.Z (5251 bytes: README, Makefile, depack.c, depack.h,
# ppunpack.c).  The long ppunpack-1.0.tar.Z (~198 KB) only adds the sf.pp /
# sf.chk sample pair (verified: the five program files are byte-identical);
# test_package fetches that pair to run upstream's "make check".
# The archive is Unix compress(1) (.Z, LZW), which conan's get() cannot
# unpack — see source() in conanfile.py.

