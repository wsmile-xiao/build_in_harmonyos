version: "1.0"
software: ppunpack
status: built
build_date: "2026-09-25"
build_system: makefile

source:
  url: "https://ftp.fau.de/aminet/misc/unix/ppsmall-1.0.tar.Z"
  sha256: "d305c14162f9039e65c0a2fea0087ba190e7e5732e3f8efacee8187892e603a9"
  tar_format: tar.Z   # Unix compress(1), LZW —— 由配方 source() 内置解码

build:
  system: makefile
  configure_options:
    - "make -j1 ppunpack CC=<tools.build:compiler_executables.c> COPTS='-O3 -fPIE -static-pie'"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - ".tar.Z 是 compress(1) LZW（魔数 1f 9d）：conan unzip() 对它落入 zip 分支报 BadZipFile；init-build 默认按 tar.gz 解报 'not a gzip file'；鸿蒙 toybox gzip 无 LZW。配方内置 Python unlzw（与 GNU zcat 逐字节一致）—— 草稿 E6417-draft-CC63"
  - "上游 Makefile 写死 CC=acc（Makefile 内赋值会压过环境变量 CC，只有命令行赋值能覆盖），且 all: ppunpack check；check 用的 sf.pp/sf.chk 只在 long 版 ppunpack-1.0.tar.Z 中。构建显式目标 ppunpack 即可，无需补丁"
  - "PP20 位流：从尾部 4 字节 trailer 之前向文件头方向逐字节读，字节内 LSB 先出，n 位值 MSB 先组装；输出从文件末尾向前写，因此编码器对逆序载荷做 LZ77；trailer = 3 字节大端解包长度 + 1 字节需跳过的位数"
  - "-static-pie 让 libc-only 的 CLI 保留 PIE/RELRO，同时去掉对 /lib/ld-musl-aarch64.so.1 的依赖，x86 runner 上的 qemu-aarch64 可以直接执行交付产物本身（E544 系草稿同思路，whichman 先例用 -static）"
  - "OHOS NDK 链接出的 ELF 带 .note.ohos.ident（owner 'OHOS'，desc=1），可用来断言产物确实来自 OHOS 工具链"

test_results:
  type: consumer
  total: 8
  passed: 8
  failed: 0
  skipped: 0
  note: "conan create（ohos-aarch64 profile，x86_64 runner）中 test_package 经 qemu-aarch64 执行交付产物 8/8 通过：上游 make check 1/1（sf.pp/sf.chk 取自 Aminet long 版 ppunpack-1.0.tar.Z，sha256 固定，其程序源码与 short 版逐字节相同）+ 新增 7/7"
