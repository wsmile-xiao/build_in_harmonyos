# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-sql-abstract-pg/1.0
homepage: https://mojologicious.org

# SQL::Abstract::Pg 上游使用 Test::More + Test::Deep 运行测试
# 但 Test::Deep 在鸿蒙平台不可用，故采用消费者侧功能测试
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests_skipped: "Test::Deep 依赖不可用，上游 t/sql.t 无法在鸿蒙环境运行"

upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: run_test.sh
    description: "SQL::Abstract::Pg 模块加载+版本验证, INSERT/SELECT/UPDATE, ON CONFLICT (DO NOTHING/DO UPDATE), LIMIT/OFFSET, GROUP BY/HAVING, JOIN, FOR UPDATE, JSON 操作符, 错误处理 (16 assertions)"
    command: "sh run_test.sh"

# 测试断言总数
assertion_count: 16
