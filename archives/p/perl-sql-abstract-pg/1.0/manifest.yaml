software: perl-sql-abstract-pg
# 版本级 manifest
# 文件位置: archives/p/perl-sql-abstract-pg/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/S/SR/SRI/SQL-Abstract-Pg-1.0.tar.gz"
  sha256: "3e27360df37b8d88f3c52dac9b03493f9bd3eeff6c8d88f9b086d2711553f547"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  build_system: perl
  configure_options:
    - "perl Makefile.PL"
  dependencies:
    - perl-sql-abstract/2.000001 (运行时依赖，未发布到 conan)
    - perl/5.42.0 (系统自带)
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Perl 模块在鸿蒙平台无需特殊适配，ExtUtils::MakeMaker 构建系统完全兼容"
  - "SQL::Abstract 2.000001 的 SQL 格式化与旧版有差异（WHERE 子句不加括号等），不影响语义正确性"
  - "perl-dbd-pg 的 CRT workaround 经验仅适用于 XS 模块，纯 Perl 模块不受影响"
  - "conan cache 中的导出配方可用于恢复 finish 步骤失败时丢失的归档文件"

# ============================================================
# Conan 验证信息
# ============================================================

conan:
  reference: "perl-sql-abstract-pg/1.0@ohpcd/stable"
  profile: "ohos-aarch64"
  verified: true
  verify_date: "2026-07-01T10:12:23"

# ============================================================
# 功能测试信息
# ============================================================

functional_test:
  test_date: "2026-07-03"
  test_cases: 72
  passed: 72
  failed: 0
  coverage:
    - "INSERT (基础 + ON CONFLICT 6种模式)"
    - "SELECT (基础 + 多表)"
    - "UPDATE (基础 + JSON)"
    - "DELETE"
    - "LIMIT/OFFSET"
    - "GROUP BY/HAVING"
    - "ORDER BY (legacy + hashref)"
    - "FOR UPDATE (含 SKIP LOCKED)"
    - "AS (字段别名 + 字面SQL + 绑定值)"
    - "JSON 操作符"
    - "JOIN (INNER/LEFT/RIGHT/多表/多条件)"
    - "错误处理 (7种无效输入场景)"
    - "组合查询 (WHERE+GROUP BY+HAVING+ORDER BY+LIMIT+OFFSET)"
