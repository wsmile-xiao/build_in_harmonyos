software: pforth
display: "pForth"
description: "Portable ANS-like Forth interpreter written in ANSI C."
category: utility
homepage: "https://github.com/philburk/pforth"
license: 0BSD
build_system: makefile

ohos_adaptation:
  key_points:
    - "bootstrap 构建需在生成 dictionary 前对 pforth 做 ELF 签名"
    - "无第三方依赖，仅链接系统 libm"
    - "编译器路径从 Conan conf 获取（R33）"
  common_dependencies: []

versions:
  "2.0.1":
    status: built
    build_date: "2026-09-20"
