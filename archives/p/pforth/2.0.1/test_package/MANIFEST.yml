package: pforth/2.0.1
homepage: "https://github.com/philburk/pforth"

# 上游测试命令（platforms/unix 下 make test）
upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test"

# make test 实际运行的 6 个 Forth 测试脚本（失败时 pforth 以退出码 40 结束）
upstream_tests:
  - file: t_corex.fth
    source: pforth-2.0.1/fth/t_corex.fth
    description: "ANS Forth Core Extensions 测试"
    command: "./pforth_standalone -q t_corex.fth"
  - file: t_strings.fth
    source: pforth-2.0.1/fth/t_strings.fth
    description: "字符串 words 测试"
    command: "./pforth_standalone -q t_strings.fth"
  - file: t_locals.fth
    source: pforth-2.0.1/fth/t_locals.fth
    description: "局部变量 words 测试"
    command: "./pforth_standalone -q t_locals.fth"
  - file: t_alloc.fth
    source: pforth-2.0.1/fth/t_alloc.fth
    description: "内存分配 words 测试"
    command: "./pforth_standalone -q t_alloc.fth"
  - file: t_floats.fth
    source: pforth-2.0.1/fth/t_floats.fth
    description: "浮点 words 测试"
    command: "./pforth_standalone -q t_floats.fth"
  - file: t_file.fth
    source: pforth-2.0.1/fth/t_file.fth
    description: "文件 I/O words 测试"
    command: "./pforth_standalone -q t_file.fth"

# test_package 自带测试（消费者视角，R34：真实执行 Forth 求值）
test_package_tests:
  - file: test_pforth.py
    description: "运行 pforth_standalone，断言 Forth 求值（3 4 + . => 7，2 3 * . => 6）"
    command: "python3 test_pforth.py <package>/bin/pforth_standalone"

assertion_count: 3
