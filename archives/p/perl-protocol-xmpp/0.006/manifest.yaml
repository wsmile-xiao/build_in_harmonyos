software: perl-protocol-xmpp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.006/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.006"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/T/TE/TEAM/Protocol-XMPP-0.006.tar.gz"

  # 源码校验和
  sha256: "0c99684610a767e1a581b7c375bbfee4d10554ac30b90e566b7bf47c613dc921"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"

  # 运行时依赖（非编译依赖，安装后使用时需要）
  runtime_dependencies:
    - "Mixin::Event::Dispatch/1.000"
    - "Future/0.29"
    - "XML::SAX"
    - "XML::LibXML::SAX::ChunkParser/0.00003"
    - "Authen::SASL/2.000"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块使用 ExtUtils::MakeMaker (Makefile.PL) 构建，无需C编译"
  - "Protocol::XMPP::Base 的父类 Mixin::Event::Dispatch 是必须的运行时依赖，未安装会导致模块加载失败"
  - "G0 命中 E007 (config.guess) 对 perl-eumm 构建系统为误报"
  - "网络受限环境下可使用 stub 模块替代缺失的 Perl 运行时依赖进行功能测试"
  - "深度功能测试覆盖156项：XML生成(_ref_to_xml)、元素映射(24种)、JID解析、写缓冲区、Preamble、消息/联系人管理、IQ请求管理"
  - "make test 32/34 失败均为运行时依赖问题，非编译问题，conan-verify 8项门禁全部通过"
