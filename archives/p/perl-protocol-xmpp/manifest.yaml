# 软件级 manifest
# 文件位置: archives/p/perl-protocol-xmpp/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: perl-protocol-xmpp
display: "Protocol::XMPP"
description: "XMPP/Jabber protocol API (RFC 3920/3921) - Pure Perl module"
category: network
homepage: "https://metacpan.org/dist/Protocol-XMPP"
license: "perl_5"
build_system: perl-eumm

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无 XS/C 编译，使用 ExtUtils::MakeMaker (Makefile.PL) 构建"
    - "运行时依赖 Mixin::Event::Dispatch (Base.pm 父类)、Future、XML::SAX、XML::LibXML::SAX::ChunkParser、Authen::SASL"
    - "G0 命中 E007 (config.guess) 为误报，perl-eumm 不受影响"
    - "网络受限环境可用 stub 模块替代缺失依赖进行功能测试"
  common_dependencies:
    - perl
    - Mixin::Event::Dispatch
    - Future
    - XML::SAX
    - XML::LibXML::SAX::ChunkParser
    - Authen::SASL

# 版本索引
versions:
  "0.006":
    status: published
    build_date: "2026-06-29"
    build_system: perl-eumm
    conan_ref: "perl-protocol-xmpp/0.006"
