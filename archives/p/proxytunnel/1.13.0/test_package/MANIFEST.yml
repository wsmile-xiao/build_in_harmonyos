# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: proxytunnel/1.13.0
homepage: "https://github.com/proxytunnel/proxytunnel"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 上游 Makefile 无 check/test 目标（纯命令行工具，无测试套件）
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 v1.13.0 未附带任何测试套件（Makefile 仅 all/docs/install/clean/dist/rpm/srpm）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "二进制功能测试：-V 版本横幅、--help 用法、经本地 mock 代理的真实 CONNECT 隧道（请求格式+双向数据转发回环）、-e SSL_connect 失败路径（证明 libssl 真实链接）、连接拒绝错误路径"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
