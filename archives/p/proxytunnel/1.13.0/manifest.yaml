# 版本级 manifest — proxytunnel 1.13.0
# 文件位置: archives/p/proxytunnel/1.13.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.13.0"
software: "proxytunnel"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/proxytunnel/proxytunnel/archive/refs/tags/v1.13.0.tar.gz"
  sha256: "1b1ae36327254cac351aa5358767c177b050ab4ce4a75fa100244da7816849e9"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 无 configure 脚本：编译变量直接在 make 命令行注入
  # CC 来自 conan conf tools.build:compiler_executables；
  # CFLAGS=-fPIC -O2 -I<openssl>/include；
  # LDFLAGS=-L<openssl>/lib -lssl -lcrypto（命令行传入使 Makefile 内
  # LDFLAGS += $(SSL_LIBS) 的 pkg-config 回退失效，显式指向 conan openssl）
  configure_options:
    - "make CC=<conan-clang> CFLAGS=-fPIC -O2 -I<openssl>/include LDFLAGS=-L<openssl>/lib -lssl -lcrypto"
  dependencies:
    - openssl/3.5.6.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 零补丁适配：上游 Makefile 的 CC/CFLAGS/LDFLAGS 均为可覆盖 make 变量，
# musl/libc++ 兼容层（strlcpy/strlcat/readpassphrase/setproctitle）上游已内置
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 C 工具 + GNU Makefile 零补丁适配：CC/CFLAGS/LDFLAGS 走 make 命令行覆盖即可完成交叉编译"
  - "Makefile 内 LDFLAGS += $(SSL_LIBS) 的 pkg-config 探测在无系统 openssl 时回退裸 -lssl -lcrypto；命令行传入 LDFLAGS 可整体接管链接参数（make 命令行变量优先级高于 Makefile 内 += 赋值）"
  - "make install 依赖 docs/ 的 man 页生成（asciidoc+xmlto），OHOS/CI 无此工具链，打包阶段直接 copy 单一可执行文件"
  - "proxytunnel 主循环 cpio() 在 stdin EOF 时立即退出，测试隧道回环需在发送数据后保持 stdin 打开"
