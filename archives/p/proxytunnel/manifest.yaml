# 软件级 manifest — proxytunnel
# 遵循 ARCHIVE-SPEC v2.0

software: proxytunnel
display: "proxytunnel"
description: "通过 HTTPS 代理建立通用隧道的 CLI 工具（CONNECT + Basic/NTLM 认证 + 可选 SSL/TLS）"
category: network
homepage: "https://github.com/proxytunnel/proxytunnel"
license: GPL-2.0-only
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C + GNU Makefile 零补丁适配：CC/CFLAGS/LDFLAGS 均为可覆盖 make 变量，make 命令行注入交叉工具链与 openssl 头文件/库路径即可"
    - "Makefile 的 pkg-config openssl 探测在 OHOS（无系统 openssl）回退裸 -lssl -lcrypto；用命令行 LDFLAGS 显式指向 conan openssl 静态库（libssl.a/libcrypto.a）"
    - "make install 依赖 docs/ man 页生成（asciidoc+xmlto，CI 无此工具链），打包直接 copy 单一可执行文件"
    - "上游自带 musl 兼容层：strlcpy/strlcat/readpassphrase/setproctitle(SPT_REUSEARGV) 无需改动"
    - "主循环 cpio() 在 stdin EOF 时立即退出——隧道回环测试需发送后保持 stdin 打开"
  common_dependencies:
    - "openssl/3.5.6.1"

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.13.0":
    status: built
    build_date: "2026-09-07"
