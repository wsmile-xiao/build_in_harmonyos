# conandata.yml - procinfo 2.0.304
# Source: Debian pool carries the pristine upstream orig tarball of
# procinfo-ng 2.0.304 (sourceforge upstream is offline; Debian is the
# authoritative mirror still shipping this tarball unmodified).

sources:
  url: "https://deb.debian.org/debian/pool/main/p/procinfo/procinfo_2.0.304.orig.tar.gz"
  sha256: "cedec54b7b13fafc9703b23e3516287cc96f51e9036639951933d58797f8305c"

patches:
  - patch_file: "patches/0001-configure-umask-022.patch"
    patch_description: "Use umask 022 for the config.status tmp dir (OHOS/HMDFS sandbox makes umask-077 dirs unwritable; same fix as ncurses/a52dec recipes)"
    patch_type: "portability"
  - patch_file: "patches/0002-graceful-proc-access.patch"
    patch_description: "Skip sections gracefully when hardened /proc or /sys entries are unreadable (readFile/findInterfaces/getDiskStats return empty instead of throw/abort)"
    patch_type: "portability"
