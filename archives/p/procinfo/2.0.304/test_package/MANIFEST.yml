# test_package/MANIFEST.yml
# 上游官方测试声明文件 (R51 上游测试三步法申报)
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: procinfo/2.0.304
homepage: "http://procinfo-ng.sourceforge.net"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 实测: `make -n check` 无该目标 —— Makefile.in 只定义 all/clean/distclean/
# procinfo/install, 没有任何 test/check 目标, 上游无正式测试套件。
upstream_check_command: "make check (target does not exist; no upstream test suite)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游源码含 tests/ 目录, 内有 3 个演示/探针程序, 但均未接入 Makefile,
# 无法通过任何上游命令运行; 清点如下 (源码实测 2026-09-25):
upstream_tests:
  - file: tests/select.c
    source: procinfo-ng-2.0.304/tests/select.c
    description: "select() 演示程序 (stdin fd 读演示), 未接入构建, 非库/程序测试"
    command: "(not wired into any build/test runner)"
  - file: tests/sizes.c
    source: procinfo-ng-2.0.304/tests/sizes.c
    description: "打印 sizeof(long)/sizeof(long long) 的探针, 未接入构建"
    command: "(not wired into any build/test runner)"
  - file: tests/testTime.cpp
    source: procinfo-ng-2.0.304/tests/testTime.cpp
    description: "lib/timeRoutines 时间格式化函数的手工探针, 未接入构建"
    command: "(not wired into any build/test runner)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者冒烟: 执行安装的 procinfo 二进制, -v/-h/一次性报告 (stdin=/dev/null), 校验退出码与输出内容"
    command: "bash test.sh (via test_package conanfile.py test())"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
