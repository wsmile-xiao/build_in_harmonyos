# 版本级 manifest — procinfo/2.0.304
# 遵循 ARCHIVE-SPEC v2.0

version: "2.0.304"
software: "procinfo"
status: built
build_date: "2026-09-25"
build_system: "autotools"

source:
  url: "https://deb.debian.org/debian/pool/main/p/procinfo/procinfo_2.0.304.orig.tar.gz"
  sha256: "cedec54b7b13fafc9703b23e3516287cc96f51e9036639951933d58797f8305c"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
  - "--prefix=<package_folder>"
  - "ac_cv_build=<arch>-unknown-linux-gnu (2009 config.guess cannot classify HarmonyOS)"
  dependencies:
  - "ncurses/6.5"
  cc: clang
  cxx: clang++

patches_applied:
- "0001-configure-umask-022.patch"
- "0002-graceful-proc-access.patch"

knowledge_gained:
- "autoconf 2.61 内联 config.guess 不识别 uname -s=HarmonyOS，命令行 ac_cv_build=<triple> 绕过，无需改源码"
- "config.status 的 (umask 077 && mkdir $tmp) 在 OHOS/HMDFS 沙箱下 0700 目录不可写，补丁改 umask 022（ncurses/a52dec 同款先例）"
- "上游 configure.in 无条件覆盖 LDFLAGS=-s -lncurses，用 make 命令行变量覆盖注入 -L<libdir> -lncursesw（命令行赋值优先于 Makefile）"
- "2009 年 C++ 源码初始化列表收窄在新 clang 下为硬错误，加 -Wno-c++11-narrowing 即可（上游无 -Werror）"
- "OHOS 策略拒绝读 /proc/interrupts、/proc/diskstats、/sys/class/net，读取方需优雅降级（返回空数据跳过对应渲染节）"
