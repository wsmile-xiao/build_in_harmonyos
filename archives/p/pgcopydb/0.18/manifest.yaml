version: "0.18"
software: pgcopydb
status: built
build_date: "2026-09-24"
build_system: makefile

source:
  url: "https://github.com/dimitri/pgcopydb/archive/refs/tags/v0.18.tar.gz"
  sha256: "d1fbc729b3d6aabbebd64f515a956130adf42a0e9104886084d76d5702fb99d0"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make bin -j1"
    - "PG_CONFIG=<postgresql/18.3>/bin/pg_config"
    - "CFLAGS=-DHAVE_BROKEN_SYSV_SEM -DHAVE_BROKEN_SYSV_MSG -I<gc>/include"
    - "LIBS=-lpq -lpgcommon -lpgport -lgc -lm"
  dependencies:
    - postgresql/18.3
    - gc/8.2.12
  cc: clang

patches_applied:
  - "0001-ohos-platform-adaptation.patch"

knowledge_gained:
  - "HarmonyOS rejects the System V IPC syscalls (semget/semctl/semop, msgget/msgsnd/msgrcv/msgctl) with SIGSYS; pgcopydb died with 'Bad system call' in semaphore_init() before printing anything"
  - "POSIX named semaphores (sem_open/sem_wait/sem_post) and MAP_SHARED|MAP_ANONYMOUS memory with process-shared sem_init(&sem, 1, ...) work fine and replace the SysV facilities"
  - "musl's getopt_long() ignores POSIXLY_CORRECT (unlike glibc's), so root option parsing permuted past the sub-command name and rejected the sub-command options; a '+' prefix in the root option string fixes it"
  - "The postgresql/18.3 package is the only published provider of pg_config together with the server headers pgcopydb includes and of libpgcommon/libpgport"
  - "The packaged libpq.a is not self-sufficient (undefined pg_encoding_to_char) so libpq is linked as a shared library"
  - "Upstream links -lncurses although no ncurses symbol is referenced outside the vendored sqlite3.c"
