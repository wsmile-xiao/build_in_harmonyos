# test_package/MANIFEST.yml
package: pgcopydb/0.18
homepage: "https://github.com/dimitri/pgcopydb"

upstream_check_command: "make test (tests/Makefile -> make -C tests all)"
upstream_test_in_build: false
upstream_test_command: "make tests/<name> -> tests/<name>/Makefile -> docker compose run --remove-orphans test"

upstream_tests_exist: true
upstream_test_framework: "docker compose driven shell/SQL suites (tests/run-test)"
upstream_test_count: 40
upstream_test_count_breakdown: "25 docker-compose integration suites (tests/<name>/compose.yaml, driven through tests/<name>/Makefile) + 15 pg_regress style regression cases in tests/unit (9 tests/unit/sql/*.sql + 6 tests/unit/script/*.sh, each with a non-empty tests/unit/expected/<name>.out)"
upstream_test_groups:
  - all-databases
  - blobs
  - cdc-endpos-in-multi-wal-txn
  - cdc-endpos-mid-txn
  - cdc-file-rotation
  - cdc-filtering-pgoutput
  - cdc-low-level
  - cdc-matview
  - cdc-partitioned-target
  - cdc-pgoutput
  - cdc-replica-identity-index
  - cdc-test-decoding
  - cdc-wal2json
  - extensions
  - filtering
  - follow-9.6
  - follow-data-only
  - follow-filtering
  - follow-pgoutput
  - follow-wal2json
  - pagila
  - pagila-multi-steps
  - pagila-standby
  - partitioned-target
  - three-databases
upstream_test_runner: "tests/unit: two live PostgreSQL 18.3 instances (initdb + postgres, TCP loopback, unix_socket_directories='') driven through the tests/unit/copydb.sh method (ping -> setup/*.sql -> pgcopydb fork -> each sql/*.sql and script/*.sh diffed against expected/*.out), plus the inline issue-894 regression block; integration suites: docker compose (unavailable on this platform). test_package/pgcopydb_test.py: pgcopydb ping/clone/compare against both instances"
upstream_test_result: "tests/unit 12/15 executed and passing (9 sql + 3 script), 3 blocked (2 need ICU collations, 1 needs pg_stat_statements); inline issue-894 binary tsvector regression passing; 25 docker compose integration suites not executable (no container runtime / upstream CI images and logical-decoding plugins unavailable). Details: reports/upstream-tests.md"
upstream_test_dependency: "postgresql/18.3 (initdb + postgres + psql + pg_dump + pg_restore)"

upstream_test_audit: |
  Audited the upstream v0.18 source tree (tests/Makefile, tests/run-test,
  tests/<name>/Makefile, tests/unit/copydb.sh).

  Upstream test inventory (40 entries):
    * 25 integration suites have a tests/<name>/compose.yaml; their
      tests/<name>/Makefile only runs `docker compose run --remove-orphans
      test` around a Dockerfile, i.e. the whole suite is docker-orchestrated.
      tests/Makefile drives them from the top level (and exposes the
      timescaledb/citus targets).
    * 15 regression cases in tests/unit: 9 tests/unit/sql/*.sql and 6
      tests/unit/script/*.sh, each compared against a non-empty
      tests/unit/expected/<name>.out.  tests/unit/copydb.sh loads
      tests/unit/setup/setup.sql, runs `pgcopydb fork`, then diffs every case
      (the SQL cases through psql, the script cases through bash).

  Not executed: the 25 integration suites and 3 of the 15 tests/unit cases.
    * the 25 suites need a working docker + docker compose engine and several
      PostgreSQL container images built by the upstream CI (pagila, multi,
      pgcopydb, cdc-wal2json, cdc-pgoutput, follow-*); their data plane also
      needs postgres-wal2json/postgres-pgoutput/postgres:9.6/timescaledb/citus
      images and servers configured with ssl=on + wal_level=logical.  HarmonyOS
      PC has no container runtime and none of those images/plugins can be
      reproduced locally.
    * tests/unit/script/3-collations.sh and
      tests/unit/script/5-exclusion-constraint-index-jobs.sh need an ICU enabled
      server (fr-FR-x-icu / provider 'icu'); postgresql/18.3 is --without-icu.
    * tests/unit/script/8-pg-stat-statements-acl.sh needs the contrib extension
      pg_stat_statements, not shipped by postgresql/18.3.

  Executed for real: 12 of the 15 tests/unit cases plus the inline issue-894
  regression block at the end of tests/unit/copydb.sh.
    * driver: two live PostgreSQL 18.3 instances (initdb + postgres from the
      postgresql/18.3 package, TCP loopback, unix_socket_directories=''),
      following the tests/unit/copydb.sh three-step method: pgcopydb ping ->
      load setup/*.sql -> pgcopydb fork -> run each sql/*.sql (psql
      --single-transaction --no-psqlrc --expanded) and script/*.sh (bash) and
      diff against the upstream expected/<case>.out baseline.
    * result: 12 passed / 0 failed / 3 blocked, identical on two consecutive
      runs.  sql/1-exclusion-constraints, sql/2-inherit, sql/3-string-escape,
      sql/4-parent-data, sql/5-attgenerated, sql/6-sequences, sql/9-tsvector,
      sql/17-exclusion-with-pkey, sql/18-collation-multi-use,
      script/4-list-table-split, script/6-list-databases-stale-catalog,
      script/7-function-acl.
    * issue-894 block: pgcopydb clone --use-copy-binary with an include-only
      filter on public.tsv -> rc=0, target row count 1, "not safe for COPY
      BINARY" fallback warning present (tsvector binary-COPY blocklist path).
    * platform-only deviations (no test logic touched): /tmp is read-only on
      HarmonyOS PC (rewritten to a writable scratch dir), the sqlite3 CLI is
      absent (same-named adapter over Python's real SQLite engine),
      posix_fallocate() is denied with EPERM (equivalent ftruncate-based
      pre-extension provided to the *server* via LD_PRELOAD), and the two
      setup files that need ICU / pg_stat_statements were skipped together with
      the two dependent pre-creation lines.

  Executed instead (consumer side): an equivalent consumer harness that drives
  the same code paths the upstream suites exercise (schema dump and restore,
  data copy, index creation, vacuum, sequence reset, source/target comparison)
  against two real PostgreSQL 18.3 instances.  The heavy lifting of the tool itself -
  forking worker processes, serialising log output through a semaphore and
  routing vacuum/index jobs through message queues - is exercised by every
  `clone` and `compare` run.

test_package_tests:
  - file: test_package/pgcopydb_test.py
    description: "Artifact assertions (ELF64/AArch64, musl loader, no System V IPC symbol referenced, .codesign section, DT_NEEDED == libpq.so.5 + libc.so) + a full clone between two live PostgreSQL 18.3 instances (ping, clone, row/sum equality, schema objects, compare schema/data, repeated run into a fresh database)"
    command: "conan test test_package pgcopydb/0.18"
    assertions: 16
    executed: true
    passed: true

assertion_count: 16
assertion_executed: 16
assertion_skipped: 0
