software: pgcopydb
display: "pgcopydb"
description: "Command line tool to copy a full Postgres database to another Postgres database (clone, CDC follow, compare)"
category: db
homepage: "https://github.com/dimitri/pgcopydb"
license: PostgreSQL
build_system: makefile

ohos_adaptation:
  key_points:
    - "The platform sandbox rejects every System V IPC syscall: semget()/semctl()/semop() and msgget()/msgsnd()/msgrcv()/msgctl() raise SIGSYS and kill the process with \"Bad system call\"; the inter-process locking and queueing facilities are rebuilt on POSIX named semaphores and on an anonymous MAP_SHARED ring buffer"
    - "musl's getopt_long() ignores POSIXLY_CORRECT and keeps permuting arguments, so the root command swallowed the sub-command options and dispatching broke; the root option string is prefixed with '+' to stop parsing at the sub-command name"
    - "The build is driven by pg_config from the postgresql/18.3 package (server headers + libpq + libpgcommon/libpgport + pg_dump/pg_restore); the upstream -lncurses link flag is dropped because no ncurses symbol is used"
    - "Boehm-Demers-Weiser garbage collector (gc/8.2.12) provides malloc/free/strdup for the whole program"

  common_dependencies:
    - postgresql
    - gc

versions:
  "0.18":
    status: built
    build_date: "2026-09-24"
    published_as: pgcopydb
