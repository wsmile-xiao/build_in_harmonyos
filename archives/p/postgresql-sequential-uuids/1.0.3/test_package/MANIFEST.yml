# test_package/MANIFEST.yml
package: postgresql-sequential-uuids/1.0.3
homepage: "https://github.com/tvondra/sequential-uuids"

upstream_check_command: "make installcheck"
upstream_test_in_build: true
upstream_test_command: "make installcheck"

upstream_tests_exist: true
upstream_test_framework: pg_regress
upstream_test_count: 1
upstream_test_groups:
  - uuids
upstream_test_runner: "make installcheck (via pg_regress: initdb cluster → pg_ctl start → make install DESTDIR → createdb → make installcheck)"
upstream_test_dependency: "running PostgreSQL 16+ server (postgres + initdb + pg_ctl + createdb binaries)"

upstream_test_audit: |
  Audited upstream v1.0.3 source tree.
  Upstream has 1 pg_regress group (uuids) listed in Makefile REGRESS,
  with matching non-empty test/sql/uuids.sql + test/expected/uuids.out.
  These are the ONLY upstream tests.

  pg_regress for a PG extension needs a RUNNING PostgreSQL 16+ server.
  The vendored postgresql-18.3 in this recipe is built FULLY by
  conanfile.py::_bootstrap_pgxs: configure → make → make install produces
  postgres/initdb/pg_ctl/createdb server binaries under <pg_install>/bin/.
  test_package _run_pg_regress() drives the upstream OWN pg_regress flow:
  initdb cluster (--user=hmbstest, TCP loopback) → pg_ctl start →
  make install DESTDIR=<staging> → createdb contrib_regression →
  make installcheck (pg_regress runs test/sql/uuids.sql against the live
  server, diffs output vs test/expected/uuids.out).

test_package_tests:
  - file: test_package/conanfile.py
    description: "Smoke test: verify .so ELF magic + control/SQL files present; pg_regress: make installcheck against live PG 18.3 server"
    command: "conan test test_package postgresql-sequential-uuids/1.0.3"
    assertions: 2
    executed: true
    passed: true

assertion_count: 2
assertion_executed: 2
assertion_skipped: 0
