software: pdfcpu
version: "0.12.1"
category: utility
status: built

build_system: go
compiler: go 1.25.10
linker: go linker

dependencies: []

configure_options:
  - CGO_ENABLED=0
  - GOOS=linux
  - GOARCH=arm64

build_notes:
  - Go 静态编译，CGO_ENABLED=0，无外部 C 依赖
  - 需修补 go.sum 中的依赖版本冲突（x/crypto, x/text, x/image, go-runewidth）
  - 编译后二进制已 ELF 签名，可在 HarmonyOS 上执行

source_url: https://github.com/pdfcpu/pdfcpu/archive/refs/tags/v0.12.1.tar.gz