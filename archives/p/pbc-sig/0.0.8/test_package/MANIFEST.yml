# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pbc-sig/0.0.8
homepage: "https://github.com/mag1c1an1/pbc_sig"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (4 个 demo 程序, 读 pairing 参数文件)
upstream_tests:
  - file: test/bls.c
    source: pbc_sig-0.0.8/test/bls.c
    description: "Boneh-Lynn-Shacham short signature demo"
    command: "./test/bls a.param"
  - file: test/bb.c
    source: pbc_sig-0.0.8/test/bb.c
    description: "Boneh-Boyen signature demo"
    command: "./test/bb a.param"
  - file: test/ibs.c
    source: pbc_sig-0.0.8/test/ibs.c
    description: "Cha-Cheon identity-based signature demo"
    command: "./test/ibs a.param"
  - file: test/bbs.c
    source: pbc_sig-0.0.8/test/bbs.c
    description: "Boneh-Boyen-Shacham group signature demo"
    command: "./test/bbs a.param"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "BLS sign+verify with Type A pairing (substantive API test)"
    command: "./test_pbc_sig"

# 测试断言总数
assertion_count: 1
