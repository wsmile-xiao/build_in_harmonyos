software: pit
display: "pit"
description: "Project manager from hell (integrates with Git)"
category: utility
homepage: "https://github.com/michaeldv/pit"
license: BSD-2-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "Pure C single-binary Makefile project with no external dependencies"
    - "Compiler overridden via tools.build:compiler_executables (upstream Makefile defaults to gcc)"
    - "Binary packaged directly from bin/pit; upstream install target has no DESTDIR support"
  common_dependencies: []

versions:
  "0.1.0":
    status: built
    build_date: "2026-09-17"
    conan_ref: "pit/0.1.0"
