# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pit/0.1.0
homepage: "https://github.com/michaeldv/pit"

# 上游测试命令 (Makefile test 目标)
upstream_check_command: "make test"

# 上游测试套件存在性 (经上游仓库与构建文件审计确认)
# pit 上游通过 Makefile 的 test 目标运行 Ruby 测试套件 test/pit_test.rb
# (源码树含 src/*.c 11 个文件、test/pit_test.rb、Makefile 的 test 目标),
# 需要 ruby 解释器；HarmonyOS PC 真机由 HNP 提供 system Ruby。
upstream_tests_exist: true
upstream_test_audit: >
  pit-0.1.0.tar.gz (sha256 ddf78b2734c6dd3967ce215291c3f2e48030e0f3033b568eb080a22f041c7a0e)
  解包顶层含 Makefile / src/ / test/ / tools/ / LICENSE / README.md。
  Makefile 定义 test 目标: ./test/pit_test.rb + rm -f ./test/test.pitfile,
  即上游测试为 Ruby 套件 test/pit_test.rb（自研 tiny_should 断言，非 Test::Unit；
  成功打印 '.'，失败只打印 match/equal failed 且退出码恒 0）。
  源码 src/ 为纯 C11 个文件，无 gtest/pytest/ctest 注册。
  配方 build() 用计数包装 load 同一 test/pit_test.rb 全量运行（不断言删减），
  按 HMBS_UPSTREAM_SUMMARY + 失败行双重计数后写入 res/upstream_test_result.json
  并打印 HMBS_UPSTREAM_TEST_RESULT 标记。

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ruby hmbs_run_upstream.rb（load 上游 test/pit_test.rb，与 make test 同一 Ruby 套件，加 HMBS 计数包装）"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/pit_test.rb
    source: pit-0.1.0/test/pit_test.rb
    description: "上游 Ruby 测试套件, 通过 make test 运行"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者功能测试: version/help/init/project/task/note/list/log/info 共 9 个断言, PITFILE 隔离"
    command: "bash test.sh <pit_binary_path>"

# 测试断言总数: test.sh 9 个消费者断言; 上游 Ruby 套件用例数以真机实跑解析为准
assertion_count: 9
