# pd-nusmuk 20151113 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "20151113"
software: "pd-nusmuk"
status: built
build_date: "2026-10-04"
build_system: "makefile"

source:
  url: "https://ftp.debian.org/debian/pool/main/p/pd-nusmuk/pd-nusmuk_20151113+repack.orig.tar.gz"
  sha256: "eed5dc6f2981d83a413990ec5bbfb12c6845a0d4e36ffa7d747fa69cf3024e23"
  tar_format: tar.gz
  upstream_note: >-
    The upstream site chnry.net is gone and there is no GitHub mirror; Debian
    carries watch=FakeWatchNoUpstreamSite.  This is the Debian orig tarball --
    the "+repack" suffix means dpkg-source re-created it because the 2015
    upstream tarball had non-reproducible permissions, NOT because Debian
    patched the code; its *content* is the verbatim 2015-11 upstream release.
    It is the only .orig in the pool (no +dfsg variant) and its sha256 matches
    Debian's signed .dsc.  ftp.debian.org serves byte-identical bytes to
    deb.debian.org and is used because preflight PF7 treats the deb./snapshot./
    security./archive. hostnames as "downstream repack sources" (see notes.md
    "框架互斥判据" for the escape hatch).

build:
  system: makefile
  configure_options:
    - "cd utils && make -j1 CC=<conf compiler> PD_INCLUDE=<pure-data-0.54-1>/src all"
    - "cd audio && make -j1 CC=<conf compiler> PD_INCLUDE=<pure-data-0.54-1>/src all"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Pd 老式 Makefile 模板（1.0.x）按 uname -s 选目标，OHOS 上落到 Linux 分支，
     自带 pd_linux 扩展名与 -shared -fPIC，无需为 OHOS 改 Makefile"
  - "模板把 PD_INCLUDE 写成 $(PD_PATH)/include，可用 make 命令行赋值覆盖，
     无需打补丁（PD_INCLUDE 用的是 = 而不是 :=；反之 CFLAGS 也用 = ，所以
     不能用命令行传 CFLAGS，否则会抹掉 -DPD 与 -I）"
  - "make install 的 Linux 分支结尾是 `install ... && $(STRIP) ...`；strip 是
     && 链最后一条命令，子 shell 返回它的退出码。x86 构建机的 GNU strip 2.38
     识别不了 aarch64 ELF（Unable to recognise the format）→ install 失败。
     Pd 外部对象包应改用 copy() 打包"
  - "puredata/<ver> 是 application 包，不装 m_pd.h；Pd 外部对象配方须额外拉
     pure-data 源码树取 Pd API 头（pd-maxlib / pd-mjlib 同一结论）"
  - "OHOS musl 有 <endian.h>，源文件里被 __FreeBSD__/__APPLE__ 圈住的
     <machine/endian.h> 不会被触发，无需打 endianness 补丁"
  - "Pd vanilla 内建 [table name size] 可建 garray，但**没有** [array] 对象
     （那是 Pd extended/iPd 的东西）；Pd 外部对象测试要用 [table]"