# test_package/MANIFEST.yml
# pd-nusmuk 20151113 - upstream test declaration.
#
# The assertion counts below are the ones the test script actually emits at
# run time (its NUSMUK_CHECK_SUMMARY line).  test_package/conanfile.py does
# not hard-code a count: it reads total/passes/fails back from the script and
# reports those measured numbers, so a declared number can never drift from
# what really ran.

package: pd-nusmuk/20151113
homepage: "https://github.com/pure-data/pure-data"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships no automated test harness: nusmuk-utils and nusmuk-audio
  contain only C externals plus Pd help patches (*-help.pd), the two meta
  files and a couple of example patches.  There is no make check, no ctest
  and no unittests/ directory (the Pd Makefile template only declares
  MANUAL and EXAMPLES).  The externals can therefore only be exercised by
  loading them into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_nusmuk.sh
    description: >-
      headless OHOS pd loads the installed nusmuk-utils and nusmuk-audio
      externals and drives them through test_pd_nusmuk.pd.  51 checks:
      19 artifact-presence (13+4 externals + both library counts),
      17 aarch64-ELF-shared-object checks, 2 pd-binary ELF checks,
      1 Pd load-error scan (non-empty log required), and 12 functional
      Pd-driven assertions (ten array-processing completion bangs + two
      [line3] float pass-throughs).  The script prints
      NUSMUK_CHECK_SUMMARY total=/passes=/fails= and writes the same
      numbers to $SUMMARY_FILE; the conanfile reports those measured
      values and fails the build when total=0, so a skipped Pd run can
      never be reported as a pass.
    command: "PD_BIN=... UTILS_DIR=... AUDIO_DIR=... PATCH=test_pd_nusmuk.pd sh test_pd_nusmuk.sh"

test_files:
  - path: "test_package/test_pd_nusmuk.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_nusmuk.sh"
    test_type: "R34"
    assertion_count: 51

test_package_test_count: 1
consumer_assertion_count: 51
harmony_specific_test_count: 1
harmony_specific_assertion_count: 1
upstream_test_cases: 0
assertion_count: 51
