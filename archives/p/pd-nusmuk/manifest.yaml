software: "pd-nusmuk"
display_name: "pd-nusmuk — Pure Data 外部对象集合"
description: >-
  Cyrille Henry 的 Pure Data（Pd）外部对象与抽象补丁合集，GPL-2.0-only。
  上游用老式 Pd Makefile 模板分成 nusmuk-utils（13 个外部对象）与
  nusmuk-audio（4 个外部对象）两个库，共 17 个 .pd_linux 外部对象，
  外加 95 个 .pd 抽象/帮助补丁、3 个 wav 采样与 1 个 pbank 数据文件。
category: "audio"
homepage: "https://puredata.info"
license: "GPL-2.0-only"
build_system: "makefile"

ohos_adaptation:
  platform: "aarch64-linux-ohos"
  patches: 0
  key_points:
    - "零补丁：Pd 老式 Makefile 模板按 uname -s 选目标，OHOS 落 Linux 分支，自带 pd_linux 扩展名与 -shared -fPIC"
    - "PD_INCLUDE 用 make 命令行赋值指向 pure-data 0.54-1 源码树（puredata/0.54.1 是 application 包，不装 m_pd.h）"
    - "不用 make install：其 Linux 分支结尾的 strip 认不出 aarch64 ELF，改用 conan copy() 打包"
    - "端序走 musl <endian.h>，源码里被 __FreeBSD__/__APPLE__ 圈住的 <machine/endian.h> 不触发"
    - "无命令行可执行文件产物，故不需要软件级 commands.json（R38）"

versions:
  - version: "20151113"
    status: built
    date: "2026-10-04"
    notes: "首次适配；17 个外部对象零补丁通过；消费者测试 51/51 断言通过（2026-10-11 复核：断言数由脚本运行时自报、conanfile 读回实测值上报，不再写死常量）"