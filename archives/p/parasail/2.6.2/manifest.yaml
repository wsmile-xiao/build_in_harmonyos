knowledge_gained:
  - "GitHub tag archive without generated configure: bootstrap in build() with autoreconf -fi; provide automake/1.18 + libtool/2.5.4 as tool_requires and generate VirtualBuildEnv so aclocal/automake/libtoolize land on PATH" # knowledge_ref: DRAFT-E652-parasail-2.6.2-conan-autoreconf-triplet-pin
  - "AC_INIT with m4_esyscmd(./version.sh) runs version.sh during autoreconf; requires egrep/awk/tr in build PATH (available via /data/service/hnp/bin and /system/bin on OHOS); config.guess cannot identify HarmonyOS — pin equal tools.gnu:host_triplet/build_triplet=aarch64-linux-ohos to skip guessing while keeping cross_compiling=no (TESTS and AC_RUN_IFELSE preserved)" # knowledge_ref: DRAFT-E652-parasail-2.6.2-conan-autoreconf-triplet-pin
  - "E011: normalize umask 077 to umask 022 in generated configure/Makefile.in for HMDFS compatibility" # knowledge_ref: E011
