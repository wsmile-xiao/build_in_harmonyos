software: parasail
display: "parasail"
description: "SIMD pairwise sequence alignment library (NW/SG/SW) with SSE2/SSE41/AVX2/AltiVec/NEON backends and runtime CPU dispatch"
category: bioinformatics
homepage: "https://github.com/jeffdaily/parasail"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "GitHub tag archive ships no generated configure; build() bootstraps with autoreconf -fi"
    - "automake/1.18 + libtool/2.5.4 provided via tool_requires (CI worker has no automake/libtoolize)"
    - "NEON backend auto-enabled by configure probe on aarch64 (no hand-picked SIMD flags)"
    - "Optional zlib disabled via --without-zlib (zero runtime dependencies)"
    - "AC_INIT extracts version via m4_esyscmd(./version.sh); egrep/awk/tr available in build PATH"
    - "E011: umask 077 -> 022 normalization applied to generated configure/Makefile.in"
  common_dependencies: []

versions:
  "2.6.2":
    status: built
    build_date: "2026-09-21"
