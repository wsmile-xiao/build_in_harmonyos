# 软件级 manifest — python-magic
# 遵循 ARCHIVE-SPEC v3.0

software: python-magic
display: "python-magic"
description: "python-magic — 基于 libmagic 的文件类型/MIME 检测（纯 Python 绑定）"
category: library
homepage: "https://github.com/ahupp/python-magic"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Python noarch 包——无 C/C++ 编译，shutil.copytree 拷贝 magic/ 模块到 site-packages（pip/setuptools 构建不可用——同 python-magic/rich 模式）"
    - "运行时依赖 libmagic（file 包按 R26 只出静态库 libmagic.a——需构建 libmagic.so.1 供 ctypes 加载）——requires file/5.48.1"
    - "上游测试 build() 集成实测：12/20 = 60%（GitHub test/ 下载跑 unittest——sdist 不含）"
  common_dependencies:
    - file

versions:
  "0.4.27":
    status: built
    build_date: "2026-08-28"
    conan_ref: "python-magic/0.4.27"
