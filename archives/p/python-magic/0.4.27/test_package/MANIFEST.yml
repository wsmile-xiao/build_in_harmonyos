# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: python-magic/0.4.27
homepage: "https://github.com/ahupp/python-magic"

# 上游测试在 GitHub test/ 目录（python_magic_test.py + libmagic_test.py +
# testdata/——需运行时 libmagic）；PyPI sdist 不含 test/（18 文件纯包）
upstream_test_in_build: true
upstream_test_command: "unittest test.python_magic_test test.libmagic_test"

upstream_tests:
  - name: test/（python_magic_test.py 17 + libmagic_test.py 3 = 20 用例，GitHub 0.4.27 tag 下载）
    count: "20"
    description: "上游测试实测（rule 4，分母=全部 20 用例）：12 passed / 6 failed / 2 skipped（60%）——build() 构建 libmagic.so.1（file 包 libmagic.a 静态库）+ sitecustomize 修 sys.platform（OHOS 报 'ohos' 致 loader 不搜 libmagic.so.1）+ magic.mgc 数据库（~/.magic.mgc 默认路径）；6 failed 为 libmagic 5.48 输出格式差异（如 '2 page(s)' vs 上游期望 '2 pages'）、2 skipped 为上游标记（SKIP_FROM_DESCRIPTOR）"

test_package_tests:
  - file: test_python_magic.py
    description: "R34：import magic + magic.from_buffer 真实 MIME 识别（image/png）"
    command: "python3 test_python_magic.py <package>"

assertion_count: 2
