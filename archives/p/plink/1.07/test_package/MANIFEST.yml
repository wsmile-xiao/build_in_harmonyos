# test_package/MANIFEST.yml
# PLINK 1.07
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: plink/1.07
homepage: "http://pngu.mgh.harvard.edu/purcell/plink/"

# 上游测试命令
# PLINK 1.07 是 2009 年的手写 Makefile 项目：没有 configure/ctest/add_test，
# 也没有任何 make check 目标。N_static = 0 是核对过整个归档后的诚实计数，
# 不是「跳过」。构建日志里保留 build() 真实跑一次 make check 的逐字报错。
upstream_check_command: "make check"

upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests_skip_reason: >-
  Upstream PLINK 1.07 ships no automated test suite and no 'check' target;
  build() runs 'make check' once and the build log carries the verbatim
  "make: *** No rule to make target 'check'.  Stop." error
  (N_static = 0, honestly zero, not a skip).

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_plink.py
    description: >-
      平台产物身份与可执行性（鸿蒙特有）：读取 ELF 头断言 EI_CLASS=ELF64、
      e_machine=EM_AARCH64(183)，并真实执行二进制打印 v1.07 横幅（CI worker
      原生 aarch64 执行，异构主机经 qemu-aarch64 执行静态产物）
    command: "conan test"
  - file: test_plink.py
    description: >-
      --freq 等位基因频率计算：用上游自带 test.ped/test.map 真实计算，断言
      .frq 表头 schema、2 行 SNP 记录、snp1 MAF=0.3333/NCHROBS=12、
      snp2 MAF=0.4167/NCHROBS=12
    command: "conan test"
  - file: test_plink.py
    description: >-
      --assoc 病例-对照关联统计：断言 .assoc 表头、2 行结果、
      snp1 CHISQ=1.5/P=0.2207、snp2 CHISQ=3.086/P=0.07898
    command: "conan test"
  - file: test_plink.py
    description: >-
      --make-bed 二进制格式转换 + 往返读回：断言 .bed magic 0x6c 0x1b 0x01、
      .bim 两行与源 .map 一致、.fam 6 个样本，再用 --bfile 读回并断言
      MAF 与 PED 路径计算结果完全一致
    command: "conan test"
  - file: test_plink.py
    description: >-
      错误处理：1.07 不支持的 --summarize 选项与不存在的数据集都必须
      非零退出并在 stderr 给出可定位的 ERROR 文案
    command: "conan test"
  - file: test_plink.py
    description: >-
      声明依赖真实生效：从产物二进制里匹配 zlib inflate/deflate 版本横幅，
      证明 conan zlib/1.3.1 被静态链进 plink，而不是靠 PATH 上的系统 zlib 蒙混
    command: "conan test"

# 测试断言总数（test_plink.py 全部通过路径上 check() 的调用数：T1 6 + T2 8 + T3 8
# + T4 5 + T5 3 + T6 4 + T7 3 = 37；脚本结尾会自行打印实测断言数/通过数）
assertion_count: 37

# 消费者测试内存预算（PLINK 把整份基因型载入内存；上游 test.ped 仅 6 样本 2 SNP，
# 实测峰值 RSS <20MB，预算取 128MB 留足余量）
max_rss_mb: 128
