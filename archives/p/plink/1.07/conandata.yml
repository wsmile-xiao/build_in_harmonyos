# conandata.yml — PLINK 1.07
#
# 源码来源（R39 权威镜像，可校验）：
# PLINK 1.07 是 2009-08-10 发布的基因组关联分析工具（Harvard/BWH，Shaun Purcell）。
# 上游历来只公开预编译二进制（zzz.bwh.harvard.edu/~zhou/plink/），源码 tarball 自
# 2010 年起因 DFSG 重打包约定仅由 Debian 一侧长期再分发。本配方取 Debian 官方
# 权威镜像的 orig 归档，sha256 直接取自 GPG 签名的 plink_1.07+dfsg-5.dsc：
#   Checksums-Sha256: e11a1573101ca1a930f44db02050cd27790fec055fc6abcc0ebaad59fc99a5dd
# 归档顶层目录 plink-1.07-src/ → recipe 用 strip_root=True 剥掉。
sources:
  url: "https://deb.debian.org/debian/pool/main/p/plink/plink_1.07+dfsg.orig.tar.xz"
  sha256: "e11a1573101ca1a930f44db02050cd27790fec055fc6abcc0ebaad59fc99a5dd"

patches:
  # 与 OHOS 无关的编译器代际问题：2009 年代码在现代 clang 上是 hard error。
  # 沿用 Debian 已转发上游的同一修复（debian/patches/gcc-4.7.patch，
  # Bug-Closed bugs.debian.org/667325；出处全文见 patches/0001 的文件头），
  # 仅重命名被遮蔽的迭代器变量。
  # 注意：此处刻意不写裸 URL —— CI 的 Pre-download 步骤会正则抓 conandata 里
  # 任何 http(s):// 串当成源码地址去下载，注释里的裸链接会被当成第二个待下载文件。
  - patch_file: "patches/0001-nested-iterator-shadowing.patch"
    patch_description: "重命名 sets.cpp/elf.cpp/idhelp.cpp 中遮蔽外层 for 循环 int 变量的容器迭代器（i→i_iter、j→j_iter），修现代 clang 的 redefinition of 'i' with a different type 硬错误；算法与输出零变化"
    patch_type: "compat"
