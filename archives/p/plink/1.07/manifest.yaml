# 版本级 manifest — plink 1.07
# 遵循 ARCHIVE-SPEC v2.0

version: "1.07"
software: "plink"
status: built
build_date: "2026-10-03"
build_system: "makefile"

source:
  url: "https://deb.debian.org/debian/pool/main/p/plink/plink_1.07+dfsg.orig.tar.xz"
  sha256: "e11a1573101ca1a930f44db02050cd27790fec055fc6abcc0ebaad59fc99a5dd"
  tar_format: xz

build:
  system: makefile
  configure_options:
    # 只有这一项是本配方在 make 命令行显式传入的
    - "SYS=UNIX"
  makefile_defaults_kept:
    # 以下开关是上游 Makefile 的默认值，本配方刻意不覆盖（保持不裁剪软件）
    - "WITH_R_PLUGINS=1   # 编 r.cpp/Rconnection.cpp（Rserve 客户端）"
    - "WITH_ZLIB=1        # 编 zfstream.cpp，链 conan zlib"
    - "WITH_LAPACK=       # 上游默认不链（LIB_LAPACK 写死宿主路径）"
    - "FORCE_DYNAMIC= 空  # Makefile 用 ifndef FORCE_DYNAMIC 判定，故 CXXFLAGS 含 -static，产物静态链接"
  dependencies:
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-nested-iterator-shadowing.patch"

knowledge_gained:
  - "PLINK 1.07（Harvard/BWH 基因组关联工具，2009）与 PuTTY 的 plink 无关：PuTTY 最新 0.85、无 1.x 系列，the.earth.li/~sgtatham/putty/1.07/ 实测 404；任务池无 URL 时按 Debian 源码包元数据（Homepage zzz.bwh.harvard.edu、Section science、Build-Depends libcrypt-dev+zlib1g-dev）确认真身"
  - "1.07 源码仅由 Debian 一侧长期再分发（上游只发二进制），conandata 应取 deb.debian.org 权威镜像的 orig 归档并直接采用 GPG 签名 .dsc 里的 sha256，而不是自行计算"
  - "2009 年代码在现代 clang 上的硬错误：Set::profileTestScore() 里 for(int i=..) 的 i 仍在作用域，后续 vector<Individual*>::iterator i 触发 redefinition of 'i' with a different type；elf.cpp/idhelp.cpp 同型。用 Debian gcc-4.7.patch 的变量改名即可，算法与输出零变化"
  - "Conan 2 里 apply_conandata_patches() 必须写在 source()：写在 build() 会改到导出树 p/<rid>/s，而 make 编的是未打补丁的副本 p/b/<pid>/b，报错看起来「补丁没生效」"
  - "手写 unified diff 的隐蔽坑：描述段末尾缺一个换行会让散文最后一行与 '--- a/<file>' 粘连，GNU patch 容忍但 Conan 解析器静默跳过；补丁一律 diff -u --label 机器生成并校验 ^--- / ^++ 成对存在"
  - "Conan 2 没有 settings.threads（那是 1.x）；用 conf.get('tools.build:jobs')。PLINK 的 elf.cpp/model.cpp/sets.cpp 是超大 TU，-O3 下单进程数百 MB，-j 需封顶（本次 4）防 OOM 掉内存小的 CI worker"
  - "OHOS/musl 的 crypt/dlopen 本就在 libc.a 里，sysroot 的 libcrypt.a/libdl.a 只是 8 字节空壳归档，-lcrypt/-ldl 直接可用，无需引入 libcrypt 包"
  - "OHOS NDK 的 zlib 只有 libz.so 没有 libz.a，而上游 Makefile 默认 -static，zlib 必须走制品仓（zlib/1.3.1 提供 libz.a）"
  - "PLINK 1.07 --version 打完横幅后继续走参数解析并以 rc=1 退出，只有 --help 是 rc=0；消费者测试断言退出码要用 --help，且须带 --noweb 关掉联网版本检查"
  - "按固定列号断言 PLINK 输出极易错位（A2 之后才是 CHISQ/P）；改用表头名→列号映射，同类错误不会再静默通过"

test:
  upstream_total: 0
  upstream_executed: 0
  upstream_note: >-
    Upstream PLINK 1.07 ships no test suite and no 'check' target (129 files
    audited). build() still runs 'make check' once with ignore_errors=True and
    the conan log carries the verbatim "make: *** No rule to make target
    'check'.  Stop." — N_static = 0 is an audited count, not a skip.
  consumer_total: 37
  consumer_note: >-
    test_package/test_plink.py, 7 groups / 37 assertions, all executed and
    passing: T1 aarch64 ELF identity + real execution (HarmonyOS-specific, 6),
    T2 --freq MAF/NCHROBS (8), T3 --assoc CHISQ/P (8), T4 --make-bed magic/bim/fam
    (5), T5 BED round-trip (3), T6 error handling (4), T7 zlib banner proves the
    declared dependency is really linked (3). Columns are resolved by header
    name, never by fixed index. L1e reverse test: removing or truncating
    bin/plink, or removing the shared dataset, each makes the suite exit
    non-zero; the unmodified package still passes 37/37.
