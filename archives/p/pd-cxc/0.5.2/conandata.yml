# conandata.yml -- pd-cxc 0.5.2
#
# Source provenance (R39):
#   Upstream-Name   : cxc ("cxc pd externals library powered by zt0ln d4ta")
#   Upstream-Contact: jdl@xdv.org  (cxc-meta.pd: "AUTHOR jdl@xdv.org";
#                     11 source files carry "cxc@web.fm", 3 carry "@xdv.org")
#   Upstream page   : https://puredata.info/downloads/cxc  (the Pd community
#                     site's release page for cxc; category "Libraries and
#                     externals".  It documents no downloadable archive and
#                     names no VCS repository.)
#   Release         : 0.5.2, upstream's own release date; every one of the 65
#                     entries in the tarball is stamped 2013-01-18, i.e. the
#                     archive is upstream's, not a repack.
#
#   Why the Debian pool copy: upstream never published a release archive that
#   is reachable over plain HTTP.  Each of the following was probed and
#   returns 404 (or, in git.iem.at's case, an anti-scraper HTML page rather
#   than a tarball):
#     https://api.github.com/repos/pd-externals/cxc        -> 404
#     https://api.github.com/repos/pure-data/cxc           -> 404
#     https://codeload.github.com/pd-externals/cxc/tar.gz/refs/tags/v0.5.2
#                                                           -> 404
#     http://www.xdv.org/~jdl/cxc/cxc-0.5.2.tar.gz         -> 404
#     https://downloads.sourceforge.net/pure-data/pd-cxc.tar.gz
#                                                           -> 404
#     https://git.iem.at/cm/a/pd/cxc/snapshot/cxc-0.5.2.tar.gz
#                                                           -> 200 but HTML
#       ("If you are an AI scraper ... we would rather ban you"; a 2353 byte
#        HTML page, not a gzip stream -- verified with `tar tzf`, which
#        reports "not in gzip format")
#   deb.debian.org is the official Debian source pool, not a third-party
#   mirror, and pd-cxc 0.5.2-9 there is maintained by Debian Multimedia
#   Maintainers <debian-multimedia@lists.debian.org> (IOhannes m zmölnig).
#   Its orig tarball is by definition the pristine upstream archive: Debian's
#   own changes live in the separate pd-cxc_0.5.2-9.debian.tar.xz (10296
#   bytes), which the platform's W3 pre-download step never injects.  The
#   source this recipe builds is that pristine orig archive; the single source
#   patch it applies is likewise *taken from* Debian's patch series (see
#   `patches:` below) instead of being written here.
#
#   Integrity is attested, not merely asserted: the sha256 below is the one
#   recorded in the PGP-signed source description
#   https://deb.debian.org/debian/pool/main/p/pd-cxc/pd-cxc_0.5.2-9.dsc
#   ("Checksums-Sha256", signed by IOhannes m zmölnig <umlaeute@debian.org>,
#   Git-Tag-Info tag=eb7dff6b64e4812856980d9b555600b6b33a76e3), and the same
#   .dsc lists the Vcs-Git location of the Debian packaging:
#   salsa.debian.org/multimedia-team/pd/pd-cxc.  The .dsc also pins
#   md5sum b61bcaabd018f1e076f4edfd1bf3b17a and size 49033 for the same file.
#
#   The tarball is self-contained: it ships upstream's own "Pd library
#   template version 1.0.11" Makefile, 27 .c files + cxc.h + cxc.c, 27 help
#   patches, fader.pd, cxc-meta.pd, README.txt, REFERENCES, TODO and
#   LICENSE.txt.  (cxc predates pd-lib-builder, so unlike e.g. pd-ekext there
#   is no submodule to substitute and no reason to prefer a repack here.)
#
#   Cross-checks that the archive really is upstream 0.5.2 and not something
#   patched:
#     - top-level directory is `cxc-0.5.2/`, upstream's own name for the
#       release;
#     - cxc-meta.pd carries "#X text 10 110 VERSION 0.5.2;", which is also
#       what the Makefile's LIBRARY_VERSION sed extracts (the recipe asserts
#       the two agree);
#     - all 65 entries are dated 2013-01-18, upstream's release date, not a
#       2025 import date;
#     - LICENSE.txt is the verbatim GNU GPL v2 text that the source headers
#       refer to ("THIS IS GPL SOFTWARE ... see gpl.txt").
#
# One portability patch, taken from Debian's own packaging of this very
# version.  Source of the patch text:
#   https://deb.debian.org/debian/pool/main/p/pd-cxc/pd-cxc_0.5.2-9.debian.tar.xz
#   (sha256 3140537a8a54694b83d0b729ab584e0241b62810bd397e0e8ac435a57d66ef76)
#   -> debian/patches/array64.patch
#      sha256 adf938389664a0dadc954708fad9350eed1b33075705deabea1632e624488f40
#      Subject: make array-access 64bit safe
#      From: Debian Multimedia Maintainers <debian-multimedia@lists.debian.org>
#      Last-Update: 2018-02-01, Forwarded: no
#   It fixes a genuine upstream defect (nothing OHOS-specific, no platform
#   macro in the original): garray_getfloatarray() casts the array's t_word
#   storage to t_float*, which is only sound where sizeof(t_word) ==
#   sizeof(t_float).  On an LP64 target t_word is an 8-byte union while t_float
#   is 4 bytes, so Pd logs "failed since it uses garray_getfloatarray while
#   running 64-bit" and cxmean/cxavgdev/cxstddev/mean~ read interleaved garbage
#   (measured before the fix: [cxmean buf] reported 1.25 for a buffer holding
#   1..8).
#
# Deliberate local changes on top of Debian's file (documented in notes.md):
#   1. the word-based accessor is used unconditionally instead of being put
#      behind `#if PD_FLOATSIZE == 64`: upstream's classic template Makefile
#      never defines PD_FLOATSIZE, so m_pd.h falls back to its 32-bit default
#      and such a switch would always take the wrong branch (verified: the
#      first version of this patch was a no-op that still imported
#      garray_getfloatarray).  The property that matters belongs to the hosting
#      Pd process, not to the external;
#   2. the three compute methods `return` after reporting a missing or
#      unreadable array.  Upstream fell through to the summation loop with an
#      unset sample pointer; measured on the unpatched package, a patch holding
#      [cxmean typo] with a `mean` message takes the whole pd process down
#      (rc=139, SIGSEGV).
patches:
  "0.5.2":
    - patch_file: "patches/0001-array-access-64bit-safe.patch"
      patch_description: >-
        Read arrays through the LP64-safe garray_getfloatwords() instead of
        garray_getfloatarray() (Debian debian/patches/array64.patch "make
        array-access 64bit safe") and return instead of walking an unset array
        pointer when the table is missing or unreadable.
      patch_type: "portability"

sources:
  "0.5.2":
    url: "https://deb.debian.org/debian/pool/main/p/pd-cxc/pd-cxc_0.5.2.orig.tar.gz"
    sha256: "18d752af27582ba18df30a1ce6d759c3c08c82b6e9dcd3ea38d098d1874e6bc8"
