# 版本级 manifest
# 文件位置: archives/p/pd-cxc/0.5.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5.2"

# 软件名
software: "pd-cxc"

# 编译状态
# published | built | failed | archived
# built = conan verify/本地 conan create（含 test_package）通过，尚未 conan upload 到制品仓
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-05"

# 构建系统
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 官方源码池，R39；见 conandata.yml 的完整取证）
  url: "https://deb.debian.org/debian/pool/main/p/pd-cxc/pd-cxc_0.5.2.orig.tar.gz"

  # 源码校验和
  sha256: "18d752af27582ba18df30a1ce6d759c3c08c82b6e9dcd3ea38d098d1874e6bc8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

  # 上游发布位置（上游无可用归档：pd-externals/cxc、pure-data/cxc、xdv.org、
  # SourceForge 均 404，git.iem.at 返回反爬 HTML，见 conandata.yml）
  upstream_tag: "https://puredata.info/downloads/cxc （Pd 官方社区站的 cxc 发布页，未提供可下载归档）"
  upstream_contact: "jdl@xdv.org"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 构建选项（源码零改动，仅命令行覆写 make 变量）
  configure_options:
    - 'CC=<OHOS clang，来自 tools.build:compiler_executables>'
    - 'PD_INCLUDE=<puredata 包>/include/pd   # 上游默认 /usr/include/pd'
    - 'LIBS=-lm                            # 上游只链 -lc，但 sqrt/pow/log/fabs 需要 libm'
    - 'STRIP=true                          # 上游用宿主 strip，认不出 aarch64 ELF'
    - 'objectsdir=/lib/pd-externals        # 上游默认 $(prefix)/lib/pd-externals'

  # 编译依赖列表（格式 name/version）
  dependencies:
    - puredata/0.54.1

  # 编译器
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

# 一个可移植性补丁，取自 Debian 对本版本的打包（debian/patches/array64.patch，
# Subject: make array-access 64bit safe）。它修的是上游真实缺陷，不是 OHOS 专有：
# garray_getfloatarray() 会把数组的 t_word 存储强转成 t_float*，只有
# sizeof(t_word) == sizeof(t_float) 时才成立；LP64 上 t_word 是 8 字节 union 而
# t_float 是 4 字节，Pd 会打印 "... uses garray_getfloatarray while running
# 64-bit" 并把 words 数组照旧交出去，于是 cxmean/cxavgdev/cxstddev/mean~ 按 4 字节
# 步长读 8 字节数据（实测未修前 [cxmean buf] 对 1..8 的缓冲区报 1.25 而非 4.5）。
# 另外「no such table」错误路径没有 return，会走未初始化的采样指针（实测未打补丁
# 的包会让 pd 段错误，rc=139）。补丁无条件改用 garray_getfloatwords()：本构建系统
# （上游模板 Makefile 1.0.11）从不定义 PD_FLOATSIZE，条件编译会永远走错分支。
patches_applied:
  - file: "patches/0001-array-access-64bit-safe.patch"
    type: "portability"
    origin: "Debian pd-cxc 0.5.2-9 debian/patches/array64.patch（Debian Multimedia Maintainers，Last-Update 2018-02-01）"
    description: "改用 LP64 安全的 garray_getfloatwords() 读数组；数组缺失/不可读时直接返回，不再走未初始化指针"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Pd 库模板 1.0.11（cxc 用的那代 Makefile）不是 pd-lib-builder：它没有 class.sources / datafiles / install-datafiles 目标，class 清单要从 make showsetup 打印的 SOURCES: 行读（那已经是 Linux 分支 SOURCES += $(SOURCES_linux) 之后的完整结果），这比在 makefile 里重新解析变量可靠"
  - "该模板按构建主机 $(UNAME) 选平台，所以在 Linux 主机上交叉编译到 OHOS/aarch64 会自动走 Linux 分支：EXTENSION=pd_linux、ALL_LDFLAGS += -rdynamic -shared -fPIC，正是 Pd 加载外部对象要的形态"
  - "该模板的 install 规则会用宿主 strip 处理每个产物（STRIP = strip --strip-unneeded -R .note -R .comment）；x86_64 宿主对刚编出的 aarch64 ELF 报 'Unable to recognise the format of the input file' 并让 make 失败，必须用命令行覆写 STRIP"
  - "该模板的链接行是 $(CC) $(ALL_LDFLAGS) -o x.$(EXTENSION) x.o $(ALL_LIBS)，ALL_LIBS 只有 -lc；glibc 上 sqrt/pow/log/fabs 能从 libc 拿到，OHOS(musl) 上 libm 是独立库，所以 LIBS=-lm 是必需的"
  - "该模板装到 $(DESTDIR)$(objectsdir)/$(LIBRARY_NAME)，objectsdir 是普通 make 变量（默认 $(prefix)/lib/pd-externals，prefix=/usr/local），命令行覆写成 /lib/pd-externals 即可把外部对象放到 <package>/lib/pd-externals/cxc"
  - "cxavgdev.c / cxmean.c / cxstddev.c 三个文件都只有一行 #include \"mean~.c\"，所以 mean~.pd_linux、cxmean.pd_linux、cxstddev.pd_linux、cxavgdev.pd_linux 四个产物内容相同、且各自都导出 mean_tilde_setup / cxmean_setup / cxstddev_setup / cxavgdev_setup 四个入口；按文件名做符号检查时不能假设「一个文件一个入口」"
  - "m_pd.h 0.54 里没有声明 Pd 的 error()，cxc_counter.c 因此是隐式声明调用它的（-Wimplicit-function-declaration，属上游自带告警）；自建 Pd 运行时 shim 时要自己补一个 error() 定义，否则 dlopen 解析不到"
  - "cxc_split_new()/cxc_prepend_new() 会把创建参数和 Pd 的空符号 &s_ 比较，所以 shim 里的 t_symbol s_ 必须真的 s_name == NULL（零初始化全局即可），不能用普通 gensym 条目顶替"
  - "cxc_split 的分隔符只取第一个字符（u[0] == x->x_splitter->s_name[0]），且 split_string_isnum(\"\") 返回 1、atof(\"\") == 0.0，所以以分隔符结尾的串会在列表尾部多出一个 float 0.0；这是上游真实行为，测试按源码逐行推导后照此断言"
  - "干净构建 0 error / warning 全部上游自带（未用参数、未使用但已赋值的局部变量、error() 隐式声明），未为消警改上游代码，也未加 -Werror"
