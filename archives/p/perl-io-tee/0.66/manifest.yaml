software: perl-io-tee
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.66/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.66"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/N/NE/NEILB/IO-Tee-0.66.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl_xs | perl
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options:
    - "INSTALL_BASE=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无补丁：纯 Perl 模块，无需源码修改

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块编译简单：perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX && make && make test"
  - "不能同时使用 PREFIX 和 INSTALL_BASE 参数，Perl Makefile.PL 只接受 INSTALL_BASE"
  - "CPAN 发布的 tarball 版本号可能与内部版本不一致（IO-Tee-0.66.tar.gz 实际版本 0.65）"
  - "使用时需通过 -I 参数指定模块路径，或设置 PERL5LIB 环境变量"
  - "纯 Perl 模块无二进制文件，质量门禁 G4 '无二进制文件' 是正常情况"
