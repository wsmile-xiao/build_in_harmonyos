software: py3-pypdf
# 版本级 manifest 模板
# 文件位置: archives/p/py3-pypdf/6.12.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.12.2"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: python3

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/py-pdf/pypdf/archive/refs/tags/6.12.2.tar.gz"

  # 源码校验和
  sha256: "e80e336b2d44bc999cf572dfd385c725190e4e1d6eee8a646056753827a11be6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # python3 (flit-core / pip wheel)
  system: python3

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - flit_core/3.12.0
    - gpep517/19
    - installer/1.0.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pypdf是纯Python(noarch)包，wheel名为pypdf-x.x.x-py3-none-any.whl"
  - "gpep517 build-wheel需要--output-fd参数，使用pip wheel fallback替代"
  - "installer需要--prefix=$DEFAULT_PREFIX指定安装路径，否则使用sys.prefix"
  - "SSL证书问题可使用curl -k手动下载后init-build检测已有tarball跳过下载"