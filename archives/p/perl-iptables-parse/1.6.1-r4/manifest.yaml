software: perl-iptables-parse
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.1-r4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.1-r4"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/M/MR/MRASH/IPTables-Parse-1.6.1.tar.gz"

  # 源码校验和
  sha256: "08693799a39c0907313194199b027dc326159ec25bf82cdd57cb1ac15033f87c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "INSTALLDIRS=vendor"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器（纯 Perl 模块无需编译器）
  cc: none
  cxx: none

  # Perl 模块特性
  perl_module_type: pure  # pure | xs

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
