knowledge_gained:
  - "OHOS musl 的 fopencookie 回调不同步触发（写回调延迟到进程退出、close 回调从不触发、fclose 返回 -9/EBADF），cookie 指针传递正确——cookie 式 FILE 虚拟化在该平台不可用，须 #if defined(__GLIBC__) 门控后经 dlsym(RTLD_NEXT) 回退 libc（见 DRAFT-purelibc-1.0.8-ohos-musl-fopencookie-deviation）"
  - "glibc 系统调用包装库移植 OHOS/musl 通用模式：LFS 别名宏 #undef（open64/creat64/stat64/fstat64/lstat64/pread64/pwrite64/preadv64/pwritev64/lseek64/openat64/fopen64/tmpfile64/freopen64/getdents64/readdir64/scandir64）、__off_t/__off64_t/__ssize_t 等 typedef 补齐、__GNUC_PREREQ 与 __WORDSIZE 按编译器/ABI 派生、musl 声明为裸 int 的函数（ptrace/prlimit/rlimit 系）签名随 musl 用 int"
  - "find_library(dl) 在 OHOS sysroot 落空（dl* 在 libc 内），CMake 项目用 CMAKE_DL_LIBS 代替"
  - "musl stdio 刷缓冲走 writev 而非 write：截获 write 的测试若断言不到流量，优先检查 writev 路径"

