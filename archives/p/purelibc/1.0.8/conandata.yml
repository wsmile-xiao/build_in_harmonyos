patches:
  - patch_file: "patches/0001-CMakeLists.txt.patch"
    patch_description: "Use CMAKE_DL_LIBS instead of find_library(dl): OHOS/musl provides dl* in libc, no standalone libdl to find"
    patch_type: "portability"
    sha256: "22a94b112efc9ee34354638e889884cbd744e679f28247637bcffd4d28fc0e49"
  - patch_file: "patches/0002-dir.c.patch"
    patch_description: "Drop musl dirent.h *64 aliases (forward-declare readdir64) and use off_t instead of glibc-internal __off_t (OHOS portability)"
    patch_type: "portability"
    sha256: "e5ac4f75644cc2ed3e9668c1692ecc6514037aefb81c841e6ad989a475d82741"
  - patch_file: "patches/0003-socketcalls.c.patch"
    patch_description: "musl: define glibc socket-arg macros if missing and rename kernel sockaddr_storage around <linux/net.h> to avoid redefinition (OHOS)"
    patch_type: "portability"
    sha256: "4780b3cd5e3374fc9bc1e0afce5c0c8108dc251e7034b0de80e071032f7b48f8"
  - patch_file: "patches/0004-stdio.c.patch"
    patch_description: "musl portability: stdio *64 alias #undef, std-stream reseat degraded, fopencookie overlay falls through to libc via dlsym (OHOS limitation, see notes.md)"
    patch_type: "portability"
    sha256: "505acc2e3d09dd1e01eaa666e4ef9ba7f5ead799e322296040a0bbedbbf3e40a"
  - patch_file: "patches/0005-syscalls.c.patch"
    patch_description: "musl portability: LFS alias #undef, __GNUC_PREREQ/__WORDSIZE derived, __off_t-family typedefs, mremap/ptrace/prlimit signatures matched to musl"
    patch_type: "portability"
    sha256: "b0dafddea9c315a68833d3a59ad6652c79811aa19ceae351e99d13afd4b1e469"
