# 软件级 manifest
# 文件位置: archives/p/perl-protocol-websocket/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: perl-protocol-websocket
display: "Protocol::WebSocket"
description: "WebSocket protocol implementation (RFC 6455) - Pure Perl module"
category: network
homepage: "https://github.com/vti/protocol-websocket"
license: "perl_5"
build_system: perl-eumm

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "源码使用 Module::Build::Tiny (Build.PL)，平台无此模块，需在 conanfile.py build() 中动态创建 Makefile.PL"
    - "纯 Perl 模块，无 XS/C 编译，无外部库依赖"
    - "PREREQ_PM 声明 Carp/Digest::MD5/Digest::SHA/Scalar::Util，均为 Perl 核心模块"
  common_dependencies:
    - perl

# 版本索引
versions:
  "0.26":
    status: published
    build_date: "2026-06-26"
    build_system: perl-eumm
    conan_ref: "perl-protocol-websocket/0.26"
