software: perl-protocol-websocket
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.26/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.26"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"
compile_date: "2026-06-26"

# 构建系统
build_system: perl-eumm

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/V/VT/VTI/Protocol-WebSocket-0.26.tar.gz"

  # 源码校验和
  sha256: "5837d03711a7a3254f0afecb7e409e8b09376060c38a5b8295e8ee9af7575522"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl-eumm | perl-makemaker
  system: perl-eumm

  # 配置选项列表
  configure_options:
    - "INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 构建命令
  build_commands:
    - "perl Makefile.PL INSTALLDIRS=site"
    - "make -j1"
    - "make install DESTDIR=$TEST_PREFIX"

  # 测试命令
  test_commands:
    - "make test"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "源码使用 Module::Build::Tiny (Build.PL)，平台无此模块，需在 conanfile.py build() 中动态创建 Makefile.PL 使用 ExtUtils::MakeMaker"
  - "纯 Perl 模块，无 XS/C 编译，无外部库依赖"
  - "PREREQ_PM 声明 Carp/Digest::MD5/Digest::SHA/Scalar::Util，均为 Perl 核心模块"
  - "conanfile.py package() 从 staging 目录遍历 site_perl 路径复制 .pm 文件到 lib/perl5/"
  - "test_package 需用 glob 查找 .pm 路径并设置 PERL5LIB 环境变量"
  - "原始测试套件 8 个测试文件 124 个测试全部通过 (make test)"
  - "功能测试覆盖 frame 编解码(text/binary/close/ping/pong/masked)、handshake(client/server round-trip)、URL 解析、Cookie 解析"
  - "G0 知识图谱命中 E007 (autotools config.guess) 为误报，实际构建系统为 perl-eumm 不受影响"
  - "conan-verify 全部门禁通过: G0-G4 + L2/L4/L5"
