# ============================================================
# Knowledge gained
# ============================================================

knowledge_gained:
  - "E011: HMDFS umask 077 breaks autoconf 2.59 configure mktemp, sed umask 077 to 022 at build time (same as pv/1.7.24)"
  - "Upstream Makefile.in has no VPATH support, in-source build via chdir(source_folder) required"
  - "Upstream make install uses GNU install -Dp -t, replaced with direct copy() of binary + man page"
  - "No upstream automated tests: Makefile.in has no check target, testscript.sh is a manual mail-in benchmark"
