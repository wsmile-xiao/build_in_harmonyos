  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile.in check / TESTS / check_PROGRAMS targets"
    - "tests/ / test/ / spec/ / t/ directories"
    - "ctest / meson test targets"
