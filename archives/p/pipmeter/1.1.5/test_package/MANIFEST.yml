  source_sha256: "e470ac5f3e71b5eee1a925d7174a6fa8f0753f2107e067fbca3f383fab2e87d8"
  top_level_files:
    - pipemeter.c         # single-file implementation, no TEST()/TEST_F/gtest markers
    - configure.in        # AC_INIT/AC_PROG_CC only, no test harness macros
    - Makefile.in         # targets: all/debug/clean/distclean/install/dist, no check/TESTS target
    - testscript.sh       # manual benchmark: builds 200M file, needs /usr/bin/time + /proc/cpuinfo, mails results.txt to author
