  make_check_output: "make -n check: no rule to make target 'check'; testscript.sh requires interactive 200M benchmark with /usr/bin/time and mails results, not automatable"
  reason: "pipemeter 1.1.5 is a single-file C pipe-throughput CLI; upstream ships no automated test suite, only a manual benchmark script"

# Upstream test integration (no automated suite, nothing to run in build)
upstream_check_command: ""
upstream_test_in_build: false
