# 软件级 manifest — pdcurses
# 遵循 ARCHIVE-SPEC v3.0

software: pdcurses
display: "PDCurses"
description: "PDCurses 跨平台 curses 实现（Public Domain），本适配采用 SDL2 后端"
category: library
homepage: "https://github.com/wmcbrine/PDCurses"
license: Public Domain

build_system: makefile

ohos_adaptation:
  key_points:
    - "PDCurses 3.9 无无显示 POSIX port（仅 x11/sdl1/sdl2/wincon/dos/os2），OHOS 可行后端为 SDL2（sdl2/2.32.10 已发布）"
    - "sdl2 port 无 configure：make 直接构建，CC/AR/SFLAGS 显式传入（SFLAGS 注入 conan 依赖 sdl2 的 include 与 include/SDL2）"
    - "仅构建静态库 pdcurses.a（上游未实现该 port 的动态库目标，options.shared=True 直接拒绝）；SDL2 链接由消费方完成"
    - "无显示运行：消费者测试经 SDL_VIDEODRIVER=dummy 无头执行，断言 initscr/printw/refresh/timeout-getch/endwin 真实行为"
    - "上游无自动化测试（demos 为交互式演示，R51 如实申报 0）"
  common_dependencies:
    - sdl2

versions:
  "3.9":
    status: built
    build_date: 2026-09-13
