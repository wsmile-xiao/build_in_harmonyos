# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）

package: pdcurses/3.9
homepage: "https://github.com/wmcbrine/PDCurses"

# 上游无自动化测试（R51 如实申报 0）：tag 3.9 源码树的 demos/ 为交互式
# 演示程序（firework/rain/testcurs/tuidemo/worm/xmas/ozdemo/ptest 等，
# 人工视觉检查、无断言），sdltest 为 SDL 后端演示；无 test/ 目录、
# 无 ctest/check/make test 目标、无任何测试框架。
upstream_check_command: ""
upstream_test_in_build: false

upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者测试：SDL dummy 无显示驱动下 initscr/printw/refresh/timeout-getch/endwin 真实行为断言（链接 libpdcurses+libSDL2）"
    command: "SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./test_probe"

assertion_count: 4
