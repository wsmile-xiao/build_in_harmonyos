# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-dbd-pg

# 软件描述
description: "Perl DBI driver for PostgreSQL databases"

# 分类
category: database

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "3.18.0"
    status: built
    build_date: "2026-06-10"
    path: archives/p/perl-dbd-pg/3.18.0

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/pod/DBD::Pg

# 源码仓库
repository: https://github.com/bucardo/dbdpg

# 许可证
license: Artistic-2.0

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl
  - postgresql (libpq)
  - perl-dbi

# 编译依赖
build_dependencies:
  - musl (提供标准 C 库头文件)
  - postgresql-client (pg_config)
  - perl-dbi