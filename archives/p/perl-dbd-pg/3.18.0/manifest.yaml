# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 特殊链接参数（绕过 CRT 文件缺失）
  link_options:
    - "-nostartfiles -nodefaultlibs -lc"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - musl/1.2.x (提供标准 C 库头文件)
    - postgresql-client (提供 pg_config)
    - perl-dbi/1.643 (DBI 模块)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "Makefile.PL: 添加 dynamic_lib => { OTHERLDFLAGS => '-nostartfiles -nodefaultlibs -lc' }"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块编译需要标准 C 库头文件（musl 提供的 stdio.h, ctype.h, sys/types.h, wchar.h 等）"
  - "鸿蒙系统缺少 CRT 文件（crti.o, crtn.o, crtbeginS.o, crtendS.o），链接需要 -nostartfiles -nodefaultlibs -lc 参数"
  - "SELinux HMDFS 文件系统限制动态库加载，需要将模块安装到系统目录"
  - "pg_config 包装器可以解决 PostgreSQL 版本检测问题"
  - "Makefile.PL 中可通过 dynamic_lib => { OTHERLDFLAGS => ... } 添加链接参数"
