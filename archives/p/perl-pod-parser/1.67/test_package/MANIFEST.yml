# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-pod-parser/1.67
homepage: "https://metacpan.org/pod/Pod::Parser"

# 上游测试命令 — prove（t/pod/ 下 16 个 .t 文件）
upstream_check_command: "perl -Ilib -S prove -l t/pod"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "perl -Ilib -S prove -l t/pod"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - t/pod/ 下 16 个 .t 文件 + 同名 .xr 参照数据，共 25 个用例
# - 依赖 Test::More（perl 核心模块，随解释器分发）
# - 纯 Perl，无编译、无外部 CPAN 依赖
upstream_tests:
  - file: t/pod/
    source: Pod-Parser-1.67/t/pod/
    description: "上游 POD 解析测试套件（16 个 .t 文件，25 用例；依赖核心模块 Test::More）"
    command: "perl -Ilib -S prove -l t/pod"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_pod_parser.py
    description: >-
      消费者测试：真实 API（R34），经 perl 解释器驱动——① 6 个模块逐个存在并
      require 成功；② 逐模块校验版本（Parser/Select/InputObjects/Find/ParseUtils
      = 1.67，而 PlainText = 2.07，**上游不一致，显式固化**）；
      ③ 子类化 Pod::Parser（实现 command/verbatim/textblock/interior_sequence）
      并用 parse_from_file 解析真实 POD 文档，校验 =head1/=head2 回调与行号；
      ④ 固化回调第 3 参为**纯字符串**（ref() 为空，非 Pod::InputObjects 对象）；
      ⑤ Pod::Select::podselect 抽取 NAME 节（首行须为 =head1 NAME）；
      ⑥ Pod::Find 提供 pod_where/contains_pod（且**无** find_pod）；
      ⑦ 若 bin/podselect 存在则校验可执行且可运行。
    command: "python3 test_pod_parser.py <pkg_dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 18
