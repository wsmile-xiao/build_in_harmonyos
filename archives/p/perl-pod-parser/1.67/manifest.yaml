# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: >-
    package_type=application（perl-carp 1.50 先例）；纯 Perl 模块（lib/Pod/ 下 6 个 .pm），
    package() 拷 lib/ 到 lib/perl5；scripts/podselect.PL 由配方生成可执行 podselect
    （替换 shebang 为真实解释器路径，因不跑 MakeMaker）；配套软件级 commands.json（R38）

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: >-
    纯 Perl，无编译、无外部 CPAN 依赖。META.json 的 runtime requires 仅
    Cwd / File::Basename / Test::More（均为 perl 核心模块，随解释器分发）。
    6 个模块：Parser.pm / Select.pm / PlainText.pm / InputObjects.pm /
    Find.pm / ParseUtils.pm

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 25
  failed: 0
  note: |
    上游测试：t/pod/ 下 16 个 .t 文件（prove -l t/pod），
    本地实测 **25/25（100%）**——All tests successful，零失败，全部运行。
    适配后：test_package R34 真实 perl 加载打包的 6 个 Pod::* 模块、
    以子类解析真实 POD 文档、Pod::Select::podselect 抽取 section 校验。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - >-
    Pod::Parser 的回调（command/verbatim/textblock）第 3 个参数是**纯字符串**
    （ref() 为空），而非如命名暗示的 Pod::InputObjects 对象——实测确认
  - >-
    同一发行版内模块版本可**不一致**：PlainText.pm 为 2.07，其余 5 个模块
    （Parser/Select/InputObjects/Find/ParseUtils）均为 1.67
  - >-
    CPAN 发行名（Pod-Parser）与模块名（Pod::Parser）、conan 包名
    （perl-pod-parser）三者不同，包名按仓内 perl-* 命名法归一

references:
  - https://metacpan.org/pod/Pod::Parser
