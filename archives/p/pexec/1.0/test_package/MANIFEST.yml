# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pexec/1.0
homepage: "https://www.gnu.org/software/pexec/"

# 上游测试命令: 上游 Makefile.in 的 check 目标（自测：pexec 并行执行自身）
#   Makefile.in:126  check: src
#   Makefile.in:127      ./src/pexec -n 2 -r 1 2 3 4 -e x -c -R -- 'echo $x'
# 取数: grep -nE '^check:' Makefile.in  （注意目标行没有等号，只 grep
#       '^(TESTS|check)[[:space:]]*[:+]?=' 会漏掉这一条）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

# 上游实际运行的测试程序
upstream_tests:
  - file: Makefile.in
    source: "check 目标（1.0 系列唯一已发布源码 pexec-1.0rc8）"
    description: "pexec 自检：-n 2 并行跑 4 个参数 (-r 1 2 3 4)，经 -e x 注入环境变量、
      -c 走 shell、-R 合并 stdout，断言退出码并核对输出 1/2/3/4 四行"
    command: "./src/pexec -n 2 -r 1 2 3 4 -e x -c -R -- 'echo $x'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pexec.sh
    description: "消费者测试：运行安装后的 pexec 二进制，断言 --help/--version、未知选项退出码、
      并行 (-n 3) 与串行 (-n 1) 的逐参数输出文件、参数文件 (-f) 驱动、合并 stdout (-R) 行数；
      并就地探测 OHOS 上可用的 shell 并以 -s 显式传给 pexec"
    command: "sh test_pexec.sh <pexec 路径>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 16
