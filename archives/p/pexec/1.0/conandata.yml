# conandata.yml — pexec 1.0
#
# 版本坐标说明（务必先读，勿改成 "1.0rc8" 之外的任何猜测）：
# 上游 GNU pexec 从未发布过 1.0 正式版。发布链只到 1.0rc8（NEWS 自证：
# 1.0pre1 -> 1.0pre2 -> 1.0rc0 ... -> 1.0rc8，无 "1.0:" 条目；
# doc/version.texi 与 configure 的 PACKAGE_VERSION 均为 1.0rc8，
# 打包日期 2008-11-04）。GNU 发布目录 gnu/pexec 下仅存在
# pexec-1.0rc7.tar.gz 与 pexec-1.0rc8.tar.gz 两个源码包。
# Debian 侧的最高版本同样记作 1.0~rc8，即 "1.0" 系列唯一的已发布字节
# 就是 1.0rc8 这一份 tarball。
# 因此本配方按任务指定的版本键 "1.0" 打包该唯一可用的 1.0 系列源码，
# 源码校验和与已合入的 pexec/1.0rc8 完全一致（不做任何源码改动）。
sources:
  url:
    - "https://mirrors.tuna.tsinghua.edu.cn/gnu/pexec/pexec-1.0rc8.tar.gz"
    - "https://mirrors.ustc.edu.cn/gnu/pexec/pexec-1.0rc8.tar.gz"
    - "https://mirrors.aliyun.com/gnu/pexec/pexec-1.0rc8.tar.gz"
    - "https://ftp.gnu.org/gnu/pexec/pexec-1.0rc8.tar.gz"
  sha256: "a968e4774eef80b8b1de3c10e6c0ad2ebeeb732b10e438596f110aa6aaf94a64"

patches: {}
