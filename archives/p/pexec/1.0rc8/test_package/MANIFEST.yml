# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pexec/1.0rc8
homepage: "https://www.gnu.org/software/pexec/"

# 上游测试命令: 上游无自动化测试（configure.ac/Makefile.in 无 TESTS/check 目标）
upstream_check_command: "无（上游无测试套件，清点证据见 notes.md）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: "(无)"
    source: "pexec-1.0rc8 全树无 TESTS/check_PROGRAMS/测试脚本"
    description: "上游无自动化测试（N_static=0，仅消费者测试补位）"
    command: "(无)"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pexec.sh
    description: "消费者测试：运行安装的 pexec 二进制，断言 --help/--version 输出与未知选项退出码"
    command: "sh test_pexec.sh <pexec 路径>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
