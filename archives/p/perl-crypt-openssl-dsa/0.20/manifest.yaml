software: perl-crypt-openssl-dsa
# 版本级 manifest
# 文件位置: archives/p/perl-crypt-openssl-dsa/0.20/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.20"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-22"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/KM/KMX/perl-Crypt-OpenSSL-DSA-0.20.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: custom

build:
  # 构建系统类型（冗余字段，保持兼容性）
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=$HOME/usr/local INC="-I$HOME/usr/local/include" LIBS="-L$HOME/usr/local/lib -lcrypto""

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - openssl/3.5.6

  # 编译器
  cc: clang
  cxx: clang++

  # 环境变量
  env:
    PKG_CONFIG_PATH: "$HOME/usr/local/lib/pkgconfig:$HOME/usr/local/libressl/lib/pkgconfig"
    OPENSSL_PREFIX: "$HOME/usr/local"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl Makefile.PL 需要使用 $HOME 变量，不能使用 ~ 符号"
  - "ExtUtils::MakeMaker 需要通过 INC 和 LIBS 参数指定 OpenSSL 路径"
  - "编译产物需要 ELF 签名才能在鸿蒙系统加载"
  - "用户安装目录下的 .so 文件可能因 SELinux 限制无法加载（E046）"

# ============================================================
# 预编译包信息
# ============================================================

# 预编译包文件名
package_file: "perl-crypt-openssl-dsa-0.20-ohos-aarch64.tar.gz"

# 预编译包大小（字节）
package_size: 70K

# 预编译包内容摘要
package_contents:
  - "lib/site_perl/5.42.0/aarch64-linux/Crypt/OpenSSL/DSA.pm"
  - "lib/site_perl/5.42.0/aarch64-linux/auto/Crypt/OpenSSL/DSA/DSA.so (已签名)"

# 安装方法
install_method: "解压到 ~/usr/local，然后设置 PERL5LIB 环境变量"