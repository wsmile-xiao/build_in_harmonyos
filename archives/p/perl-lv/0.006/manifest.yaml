version: "0.006"
status: built
build_date: "2026-06-15"

source:
  url: "https://cpan.metacpan.org/authors/id/T/TO/TOBYINK/LV-0.006.tar.gz"
  sha256: "fa88c2d4af0b1126d46401e6355a65496d033cfc2a6a944653011a638adfa75c"
  tar_format: tar.gz

build:
  system: perl-module
  configure_options:
    - "perl Makefile.PL"
  dependencies:
    - perl/5.42.0
  cc: ""
  cxx: ""

patches_applied: []

packaging:
  - name: "perl-lv-0.006-ohos-aarch64.tar.gz"
    size: "13K"
    type: "pure-perl"
    install_path: "/usr/local/lib/perl5/site_perl/5.42.0"

knowledge_gained:
  - "LV 是纯 Perl 模块，无 XS 扩展，编译过程无需处理平台差异"
  - "Sentinel 和 Magic 后端需要 XS 扩展支持（Sentinel.pm、Variable::Magic），鸿蒙平台不可用"
  - "只能使用 Tie 后端，性能较低但功能完整（核心 lvalue 子程序功能可用）"
  - "安装路径为 site_perl_merge，需要设置 PERL5LIB 才能加载"

test_results:
  - test: "t/01basic.t"
    result: "PASS"
    note: "基本功能测试通过"
  - test: "t/02tie.t"
    result: "PASS"
    note: "Tie 后端测试通过"
  - test: "t/03sentinel.t"
    result: "skipped"
    note: "Sentinel 后端不可用（需要 XS 扩展 Sentinel.pm）"
  - test: "t/04magic.t"
    result: "skipped"
    note: "Magic 后端不可用（需要 XS 扩展 Variable::Magic）"

functional_status:
  core_features: "available"
  tie_backend: "available"
  sentinel_backend: "unavailable"
  magic_backend: "unavailable"
  performance_note: "只能使用 Tie 后端，性能较低但功能完整"