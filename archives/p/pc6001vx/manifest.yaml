software: pc6001vx
display: "PC6001VX"
description: "PC-6001/PC-6001mkII/PC-6601 模拟器（Qt6 跨平台版，含 SDL2 手柄输入）"
category: emulation
homepage: "https://github.com/eighttails/PC6001VX"
license: "LGPL-2.1-or-later"
build_system: qmake

ohos_adaptation:
  key_points:
    - "Qt6 + qmake 工程：依赖制品仓 qtbase/6.11.1、qtmultimedia/6.11.1、sdl2/2.30.10，tool_requires qttools/6.11.1（lrelease）"
    - "qtbase 无 OpenGL、QPA 插件只有 minimal/offscreen：定义 NO_HWACCEL；补丁让 X11(xcb) 后端可关闭（P6VX_NO_X11）"
    - "split-prefix Qt 下 `QT += multimedia` 无法解析模块路径，补丁/配方改为显式 INCLUDEPATH+LIBS"
    - "OHOS 无 SysV 信号量（semget 不可用）→ QSharedMemory/SingleApplication 不可用，定义上游开关 NOSINGLEAPP"
    - "musl 无 <libintl.h>：定义 NOLIBINTL（上游 Android 同款开关）"
    - "无头冒烟走 offscreen/minimal QPA 下的 --version/--help/参数错误/缺插件诊断路径，不跑会常驻事件循环的正常启动路径"
  common_dependencies:
    - qtbase
    - qtmultimedia
    - sdl2
    - qttools

versions:
  "4.3.0":
    status: built
    build_date: "2026-09-28"
