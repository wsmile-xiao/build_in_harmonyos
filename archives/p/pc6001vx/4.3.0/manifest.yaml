# ============================================================
# 必须字段
# ============================================================

version: "4.3.0"
software: "pc6001vx"
status: built
build_date: "2026-09-28"
build_system: "qmake"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/eighttails/PC6001VX/archive/refs/tags/v4.3.0.tar.gz"
  sha256: "aee8c8175d81314ebf8698b861b76cc30ae5c1ffae2265799b6204f5e7a9990c"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: qmake
  configure_options:
    - "qmake6 PC6001VX.pro DEFINES+=NO_HWACCEL DEFINES+=NOLIBINTL DEFINES+=P6VX_NO_X11 DEFINES+=NOSINGLEAPP"
    - "P6VX_QTMULTIMEDIA_INCDIR=<qtmultimedia>/include P6VX_QTMULTIMEDIA_LIBDIR=<qtmultimedia>/lib"
    - "QT_TOOL.lrelease.binary=<qttools>/bin/lrelease"
    - "make -j8（shadow build）"
  dependencies:
    - "qtbase/6.11.1"
    - "qtmultimedia/6.11.1"
    - "sdl2/2.30.10"
    - "qttools/6.11.1（tool_requires，lrelease）"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-PC6001VX.pro-ohos-qmake.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Qt6 qmake 工程在 split-prefix Qt 安装（conan 每个 Qt 模块独立包）下无法用 `QT += multimedia`：模块 .pri 里的 $$[QT_INSTALL_LIBS]/$$[QT_INSTALL_HEADERS] 指向 qtbase 前缀，必须由配方把真实 include/lib 目录经 qmake 变量传入"
  - "harmonyos-clang mkspec 复用 linux.conf，QMAKE_PLATFORM=linux 且没有 ohos/harmonyos scope，平台判定只能用自定义 DEFINES 开关，不能靠 qmake scope"
  - "OHOS SysV 信号量（semget）不可用 → Qt QSharedMemory 无法初始化 → 上游 SingleApplication 单实例逻辑必然 SIGSYS(159)；NOSINGLEAPP 是上游支持的配置（Android 同款）"
  - "qttools 的 lrelease 未设 RUNPATH（qtbase 的 moc/uic/rcc 有 $ORIGIN/../lib），构建时须给 LD_LIBRARY_PATH，否则 lrelease 报 Error relocating ... symbol not found"
  - "OHOS clang 链接出的可执行文件已带空 .codesign 段，binary-sign-tool 自签后可正常执行"
