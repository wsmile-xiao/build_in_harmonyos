# test_package/MANIFEST.yml — pc6001vx 4.3.0
# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pc6001vx/4.3.0
homepage: "https://github.com/eighttails/PC6001VX"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "PC6001VX-4.3.0.tar.gz（GitHub 官方 tag v4.3.0 归档，sha256=aee8c817...990c）"
    finding: "顶层只有 LICENSE/PC6001VX.pro/README.adoc/VERSION.PC6001VX/setversion.sh 与 android、appimage、code_style、compatible_rom、data、doc、fonts、src、win32 目录；没有 tests/、test/、unittest/ 目录，也没有 .github/ 工作流或 CI 测试定义"
  - path: "PC6001VX.pro（qmake 工程定义，唯一的构建入口）"
    finding: "只有一个 TEMPLATE = app 目标；TRANSLATIONS/lrelease 只生成翻译资源，无 CONFIG(testcase)、无 check/test 目标、无 QTest 相关 SOURCES/HEADERS，也未 include 任何测试 .pri"
  - path: "README.adoc（77 KB 上游文档）"
    finding: "构建章节只描述 `qmake6 PC6001VX.pro && make`（Windows/MSYS2、Linux、Android 三套环境）与依赖包列表，未提供任何测试命令、测试套件或测试数据说明"
  - path: "src/ 与 src/Qt/（约 120 个源文件）"
    finding: "无 QTest/QtTest 引入，无 testcase/tst_* 文件；src/Qt/SingleApplication/examples/ 仅为该子模块自带示例工程（basic/calculator/sending_arguments），不属于应用测试且不参与本工程构建"
  - path: "appimage/build_appimage.sh（上游发布脚本）"
    finding: "仅执行 qmake6 + make + linuxdeploy 打包 AppImage，不做任何测试或自检，佐证上游发布链无测试环节"

test_package_tests:
  - file: test_pc6001vx.sh
    description: >-
      消费者冒烟测试：真实执行包内 bin/PC6001VX —— offscreen QPA 下 --version 横幅与退出码、
      --help 选项清单（-s/--safemode、-l/--loadstate、-v/--version）、minimal QPA 下 --version、
      未知选项的优雅报错（rc=1 + 诊断文本）、缺失平台插件时的优雅失败（非零退出 + Qt 诊断 +
      可用插件列表 minimal/offscreen）
    command: "<bash> test_pc6001vx.sh <package_folder>/bin"
  - file: conanfile.py
    description: >-
      打包/平台断言：bin/PC6001VX 为 AArch64 ELF64 小端 PIE、musl 解释器、GNU_RELRO +
      不可执行栈、存在 .codesign 段（OHOS 重签名）、DT_NEEDED 白名单（五个 Qt6 库 +
      无绝对路径 + SDL2 必须静态链接不出现）、SDL2 手柄符号已链入
    command: "conan test_package（conan create 的 test 阶段自动执行）"

# 测试断言总数 (近似值, 用于质量评估)
# = test_pc6001vx.sh 14 项（实测 RESULT: 14 passed, 0 failed）
# + test_package/conanfile.py 6 项 ELF/打包断言
assertion_count: 20
