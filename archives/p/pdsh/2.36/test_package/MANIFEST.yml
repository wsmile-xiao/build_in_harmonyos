# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pdsh/2.36
homepage: "https://github.com/chaos/pdsh"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/t0001-basic.sh
    source: pdsh-2.36/tests/t0001-basic.sh
    description: "Basic pdsh functionality tests"
    command: "make check"
  - file: tests/t0002-internal.sh
    source: pdsh-2.36/tests/t0002-internal.sh
    description: "Internal function tests (xstrerrorcat, pipecmd)"
    command: "make check"
  - file: tests/t0003-wcoll.sh
    source: pdsh-2.36/tests/t0003-wcoll.sh
    description: "Host list / wcoll file parsing tests"
    command: "make check"
  - file: tests/t5000-dshbak.sh
    source: pdsh-2.36/tests/t5000-dshbak.sh
    description: "dshbak output formatting tests"
    command: "make check"
  - file: tests/t6036-long-output-lines.sh
    source: pdsh-2.36/tests/t6036-long-output-lines.sh
    description: "Long output line handling tests"
    command: "make check"
  - file: tests/t6114-no-newline-corruption.sh
    source: pdsh-2.36/tests/t6114-no-newline-corruption.sh
    description: "No-newline output corruption tests"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pdsh.c
    description: "验证 pdsh 二进制可执行 (pdsh -V)"
    command: "./test_pdsh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 125
