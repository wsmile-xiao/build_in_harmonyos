# conandata.yml — palbart 2.14
# 上游: GNU barcode 2.14 的 PostScript 驱动（palbart）—— 条码描述语言解释器
#       输入一份「符号表 + 字模定义」的文本文件，输出可打印的符号清单
#       （.lst）与编码后的条码位流（.bin），供排版流水线转成 PostScript。
#       原项目主页 https://www.gnu.org/software/barcode/
# 源: Debian pool 官方源包（main/p/palbart）
#     仓库规则 12 要求取包 URL 必须 HTTPS；CI 侧对 http:// 前缀不做镜像 fallback。
# sha256: 6e2ecee67fa98715aacfdc287604a0c0d24b5dc0f9b9461c57f0ec050b487d4b
sources:
  url: "https://deb.debian.org/debian/pool/main/p/palbart/palbart_2.14.orig.tar.xz"
  sha256: "6e2ecee67fa98715aacfdc287604a0c0d24b5dc0f9b9461c57f0ec050b487d4b"

