# test_package/MANIFEST.yml — palbart 2.14
package: palbart/2.14
homepage: "https://www.gnu.org/software/barcode/"

# 上游无独立测试套件：palbart 2.14 是 GNU barcode 的单个驱动源文件
# （palbart.c 4353 行），Debian 原包只取 palbart.c + README + palbart.1，
# 连 Makefile 都没有，遑论 check/target。GNU barcode 上游的测试是
# 驱动间的 diff 比对，依赖本配方不安装的排版后端，不可直接复用。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_palbart.c
    description: >-
      消费者测试 23 条断言。palbart 是可执行程序、没有可链接的库 API，
      因此用例按"该程序的真实调用方式"验证：把包内 bin/palbart 以子进程
      拉起，喂入条码描述语言文件，对其产出的符号清单(.lst)、条码位流
      (.bin) 与诊断输出做确定性断言。五组用例全部零网络、零渲染器依赖、
      零设备节点：palbart 只做解释与编码，不调用 gnuplot / ghostscript。
      (A) 不给输入文件 -> 退出码 255 + `no input file specified`，且不产 .bin；
      (B) 完整字模 4 定义 + $HELLO 字面文本 + *0 5 收尾 -> 退出码 0，
          .lst 含 `*4 2 100 50` / `Page 1` / 偏移长度对 `00004  0152` /
          `$HELLO` / `No detected errors` / `No links generated`，.bin 恰好 256 字节；
      (C) 未定义符号 + 缺 $ 收尾 -> 退出码 1，.lst 含 `UD undefined` 与
          `ND no $ at EOF`，stdout 汇总复数形式 `2 detected errors`，
          .bin 262 字节（错误记录本身也占位），且 .lst 不得出现干净的解析结论；
      (D) 省略 *0 5 收尾 -> 解释器自动补页，退出码 0 且 .bin 与 B 组一致(256)，
          证明收尾伪操作是可选的；
      (E) 空输入文件 -> 退出码 1，stdout 报告**单数**形式 `1 detected error`
          （与 C 组的复数形成对照，验证错误计数随数量变化），
          .lst 标记 `ND no $ at EOF`。
      所有断言文本均取自 qemu-aarch64 + OHOS sysroot 下的**实测输出**，
      并额外校验各次调用均未被信号杀死（rc<0 / >=128 判失败）。
    command: "test_palbart <package_root>"

# 测试断言总数
assertion_count: 23
