software: palbart
display: "palbart"
description: "GNU barcode 2.14 PostScript driver: interprets a barcode description language file and emits a printable symbol listing plus the encoded barcode bitstream"
category: utils
homepage: "https://www.gnu.org/software/barcode/"
license: GPL-3.0-or-later
build_system: custom  # Debian 原包只有 palbart.c + README + palbart.1，无 Makefile/configure/CMakeLists，conanfile 直驱 clang

ohos_adaptation:
  key_points:
    - "单源文件 4353 行（170KB）+ README + man page，零外部依赖，零构建脚本"
    - "仅 libc：ctype、errno、stdio、stdlib、string 五个头文件，全部由 OHOS sysroot 自带"
    - "★ 零 patch：一次 clang-ohos 交叉编译通过，无符号冲突、无缺失 API、无需平台分支"
    - "产物 ELF64 / AArch64，NEEDED 仅 libc.so；可执行文件 63.8KB"
    - "palbart 只做条码描述语言的解释与编码，不调用 gnuplot / ghostscript 渲染，也不触碰网络或设备节点，因此解释阶段完全可移植"
    - "★ 产出可确定性断言的两份产物：<输入>.lst 符号清单（含逐行字节偏移与诊断汇总）与 <输入>.bin 条码位流（固定 252/256/262 字节，随诊断数变化）"
    - "★ 单复数诊断随错误数切换（`1 detected error` / `2 detected errors`），退出码区分 0=干净 / 1=有诊断 / 255=无输入文件，构成三条可断言的状态机"
  common_dependencies:
    - libc (ctype, errno, stdio, stdlib, string)

patches: []

versions:
  "2.14":
    status: built
    build_date: "2026-10-01"
    source_url: "https://deb.debian.org/debian/pool/main/p/palbart/palbart_2.14.orig.tar.xz"
    source_sha256: "6e2ecee67fa98715aacfdc287604a0c0d24b5dc0f9b9461c57f0ec050b487d4b"
    test_assertions: 23
