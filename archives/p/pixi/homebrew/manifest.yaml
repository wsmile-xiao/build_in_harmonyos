software: pixi
version: "homebrew"
status: built
build_date: "2026-06-03"

source:
  url: "https://github.com/prefix-dev/pixi/archive/refs/tags/v0.70.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  build_system: cargo
  configure_options:
    - "precompiled-musl-binary"
  dependencies: []
  cc: clang
  cxx: clang++
  build_method: "pre-compiled-musl-binary"
  build_notes: "Rust项目，GitHub v0.70.0 aarch64-unknown-linux-musl 预编译static二进制经过ELF self-sign后可在HarmonyOS上运行。pixi static musl binary不像xh/duf等Rust项目会SIGSEGV，pixi的static binary正常工作。Alpine/Chimera无pixi包，使用GitHub release static binary(经ELF签名)作为部署方案。"

patches_applied: []

test_report:
  status: built
  notes: "预编译二进制，验证pixi --version执行成功"

knowledge_gained:
  - "pixi static musl binary经ELF self-sign后可在HarmonyOS上正常运行(exit 0)"
  - "Rust static musl二进制在HarmonyOS上的行为因项目而异: xh/duf等SIGSEGV, pixi正常"
  - "Alpine Linux和Chimera Linux均无pixi包"
  - "GitHub pixi-aarch64-unknown-linux-musl static binary约61MB, ELF签名后可正常执行"
