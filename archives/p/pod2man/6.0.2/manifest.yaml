software: pod2man
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.0.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://archives.eyrie.org/software/perl/podlators-v6.0.2.tar.xz"

  # 源码校验和
  sha256: "22f5941c848756c05396356437dc799b32703f4fc282f0f281b9c83696500183"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

  # 源码包名称（实际软件包名称）
  package_name: "podlators"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 实际构建系统
  actual_build_system: "ExtUtils::MakeMaker"

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "Pod::Simple/3.45"

  # 编译器（Perl 脚本不需要编译器）
  cc: none
  cxx: none

  # 构建命令
  build_commands:
    - "perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX"
    - "make -j1"
    - "make test"
    - "make install DESTDIR=$TEST_PREFIX"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl 模块使用 ExtUtils::MakeMaker 构建系统，不是 autotools"
  - "pod2man/pod2text 是 Perl 脚本，不是 ELF 二进制文件"
  - "非二进制软件不需要 ELF 签名、RPATH、strip debug 符号"
  - "Perl 软件包名称可能与工具名称不同（pod2man 属于 podlators）"
  - "质量门禁 G4 对非二进制软件应特殊处理"

# ============================================================
# 测试信息
# ============================================================

test:
  result: PASS
  files: 31
  tests: 391
  passed: 391
  failed: 0
  skipped: 16
  duration: "6 seconds"

# ============================================================
# 安装产物
# ============================================================

install_products:
  executables:
    - "bin/pod2man (Perl script)"
    - "bin/pod2text (Perl script)"

  libraries:
    - "lib/perl5/Pod/Man.pm"
    - "lib/perl5/Pod/Text.pm"
    - "lib/perl5/Pod/ParseLink.pm"
    - "lib/perl5/Pod/Text/Color.pm"
    - "lib/perl5/Pod/Text/Overstrike.pm"
    - "lib/perl5/Pod/Text/Termcap.pm"

  documentation:
    - "man pages: pod2man.1, pod2text.1, perlpodstyle.1"

# ============================================================
# 特殊说明
# ============================================================

special_notes:
  - "这是首个使用 ExtUtils::MakeMaker 构建系统的软件"
  - "Perl 脚本不需要编译，直接安装即可"
  - "测试全部通过，功能完全可用"
  - "适合作为 Perl 模块编译流程的参考案例"
