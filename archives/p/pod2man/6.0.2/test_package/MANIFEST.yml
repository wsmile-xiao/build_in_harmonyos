# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: pod2man/6.0.2
homepage: "https://www.eyrie.org/~eagle/software/podlators/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/pod/man.t
    source: podlators-6.0.2/t/pod/man.t
    description: "Pod::Man 转换测试"
    command: "perl -Iblib/lib -Iblib/arch t/pod/man.t"
  - file: t/pod/text.t
    source: podlators-6.0.2/t/pod/text.t
    description: "Pod::Text 转换测试"
    command: "perl -Iblib/lib -Iblib/arch t/pod/text.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pod2man.sh
    description: "消费者测试 - 运行 pod2man 转换 POD 文件并验证 .TH 标记"
    command: 'sh test_pod2man.sh <pod2man_bin>'
  - file: conanfile.py
    description: "Conan test_package 入口 - 调用 test_pod2man.sh"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 391
