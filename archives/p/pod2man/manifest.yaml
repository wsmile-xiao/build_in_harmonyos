# podlators（pod2man/pod2text）软件级元数据
# 文件位置: archives/p/pod2man/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: pod2man
description: "Perl 文档生成工具 - 将 POD 格式转换为 man page 和纯文本格式"

# ============================================================
# 软件信息
# ============================================================

name: podlators
category: documentation
license: "Artistic-1.0-Perl OR GPL-1.0-or-later"
homepage: "https://www.eyrie.org/~eagle/software/podlators/"

# ============================================================
# 功能描述
# ============================================================

features:
  - "将 POD（Plain Old Documentation）转换为 man page 格式（pod2man）"
  - "将 POD 转换为纯文本格式（pod2text）"
  - "支持多种编码（UTF-8, ISO-8859-1）"
  - "支持终端控制输出（颜色、加粗）"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  runtime:
    - "perl >= 5.12"
    - "Pod::Simple >= 3.26"

  build:
    - "perl >= 5.12"
    - "ExtUtils::MakeMaker"

# ============================================================
# 鸿蒙适配信息
# ============================================================

ohos_adaptation:
  difficulty: easy
  build_system: "ExtUtils::MakeMaker"
  notes:
    - "Perl 脚本，不是编译的二进制文件"
    - "不需要 ELF 签名、RPATH、strip"
    - "需要 Perl 环境"

# ============================================================
# 版本索引
# ============================================================

versions:
  "6.0.2":
    status: built
    build_date: "2026-06-08"
    notes: "首次编译，测试全部通过"
    archive_path: "archives/p/pod2man/6.0.2"