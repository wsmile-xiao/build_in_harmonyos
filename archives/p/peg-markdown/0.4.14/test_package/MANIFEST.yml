# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制）
package: peg-markdown/0.4.14
homepage: "https://github.com/jgm/peg-markdown"

# 上游测试命令（顶层 Makefile:43-45 的 test 目标，无 check 目标）
upstream_check_command: "make test   # cd MarkdownTest_1.0.3 && ./MarkdownTest.pl --script=../markdown --tidy"

# conanfile.py build() 中是否已集成上游测试（上游测试需要 perl + tidy CLI，
# 二者非本包依赖，故不在 conan create 内跑，改由探索阶段实跑并记录 reports/）
upstream_test_in_build: false
upstream_test_command: "cd MarkdownTest_1.0.3 && perl ./MarkdownTest.pl --script=../markdown --tidy"

# 上游实际运行的测试程序（John Gruber Markdown 1.0.3 官方用例集）
upstream_tests:
  - file: MarkdownTest_1.0.3/MarkdownTest.pl
    source: peg-markdown-0.4.14/MarkdownTest_1.0.3/MarkdownTest.pl
    description: "John Gruber Markdown 1.0.3 一致性测试，Tests/*.text → *.html 逐用例 diff（--tidy 时经 HTML Tidy 归一化）"
    command: "perl ./MarkdownTest.pl --script=../markdown --tidy"

# test_package 中自带的测试（消费者视角）
test_package_tests:
  - file: test.sh
    description: "执行打包后的 markdown 二进制：--version、文件入参转 HTML、stdin 转 HTML（EOF 死循环回归护栏）、--to latex"
    command: "bash test.sh"

# 断言总数：上游 22 个用例 + test.sh 6 个断言
assertion_count: 28
