software: perl-parallel-prefork
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.18/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.18"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/K/KA/KAZUHO/Parallel-Prefork-0.18.tar.gz"

  # 源码校验和
  sha256: "f1c1f48f1ae147a58bc88f9cb2f570d6bb15ea4c0d589abd4c3084ddc961596e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # 运行时 Perl 模块依赖（非 Conan 包）:
  #   Class::Accessor::Lite >= 0.04
  #   List::MoreUtils
  #   Proc::Wait3 >= 0.03 (XS模块，.so需安装到系统目录)
  #   Scope::Guard
  #   Signal::Mask
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Parallel::Prefork 是纯 Perl 模块，无 XS/C 代码，编译无需特殊链接参数"
  - "运行时依赖 Proc::Wait3 是 XS 模块，其 .so 在 HMDFS 上无法加载（SELinux 限制）"
  - "Proc::Wait3.so 需要安装到 /data/service/hnp 系统目录才能正常加载（与 perl-dbd-pg 相同问题）"
  - "使用 POSIX::waitpid 可作为 Proc::Wait3::wait3 的纯 Perl 替代方案用于功能验证"
  - "Perl 模块 Makefile.PL 使用 PREFIX=/usr/local 确保安装到标准路径"

patch_generation:
  method: none
  patches_count: 0

patch_classification: []
