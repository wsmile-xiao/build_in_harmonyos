# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: perl-parallel-prefork/0.18
homepage: "https://metacpan.org/dist/Parallel-Prefork"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: t/01-base.t
    description: "Basic prefork functionality tests"
    command: "perl -Iblib/lib -Iblib/arch t/01-base.t"
  - file: t/02-reconfigure.t
    description: "Reconfigure worker count tests"
    command: "perl -Iblib/lib -Iblib/arch t/02-reconfigure.t"
  - file: t/03-spareworkers.t
    description: "Spare workers functionality tests"
    command: "perl -Iblib/lib -Iblib/arch t/03-spareworkers.t"
  - file: t/04-interval.t
    description: "Spawn interval tests"
    command: "perl -Iblib/lib -Iblib/arch t/04-interval.t"
  - file: t/05-before_after_fork.t
    description: "Before/after fork callback tests"
    command: "perl -Iblib/lib -Iblib/arch t/05-before_after_fork.t"
  - file: t/06-wait-all-children-with-timeout.t
    description: "Wait all children with timeout tests"
    command: "perl -Iblib/lib -Iblib/arch t/06-wait-all-children-with-timeout.t"
  - file: t/07-wait-all-children-does-not-block.t
    description: "Wait all children non-blocking tests"
    command: "perl -Iblib/lib -Iblib/arch t/07-wait-all-children-does-not-block.t"

test_package_tests:
  - file: conanfile.py
    description: "Perl module file existence and version verification"
    command: "perl -e 'use Parallel::Prefork; print \"OK\\n\";'"

assertion_count: 22
