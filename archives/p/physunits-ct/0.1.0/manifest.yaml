version: "0.1.0"
software: "physunits-ct"
status: built
build_date: "2026-09-04"
build_system: "cmake"

source:
  url: "https://github.com/martinmoene/PhysUnits-CT/archive/refs/tags/v0.1.0.tar.gz"
  sha256: "c6480f445ad43cc2b76fef1336f692185017ea1a13b795ab944a9ccd2eaf8b7e"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DPHYS_UNITS_OPT_BUILD_TESTS=ON"
    - "-DPHYS_UNITS_OPT_BUILD_EXAMPLES=OFF"
    - "-DCMAKE_SYSTEM_NAME=Linux"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-CMakeLists.txt.patch"

patch_generation:
  method: "refresh-patch --auto"
  baseline_sha: "8e758faaaef6d6feae894b31e9ca9cc90c57e513"
  patches_count: 1

patch_classification:
  - file: "0001-CMakeLists.txt.patch"
    type: "portability"
    description: "Upstream v0.1.0 ships no build system; adds a CMake layer that exposes the header-only INTERFACE target, installs phys/ headers, and registers the upstream projects/Test Catch programs with CTest. No upstream file is modified."

test_framework:
  name: "Catch v1.12.2 (catch.hpp single header)"
  source: "https://raw.githubusercontent.com/catchorg/Catch2/v1.12.2/single_include/catch.hpp"
  sha256: "0c50b1f17c7a9056850c9cb8c6c7c46a4d3d754c2f87941d0d1d16aeb14927e3"
  reason: "Upstream makefiles expect an externally provided CATCH_INCLUDE; Catch is a test-only input, not a package dependency."

knowledge_gained:
  - "PhysUnits-CT 0.1.0 is a header-only C++98 library with no build system and no dependencies beyond the C++ standard library; tests are ad-hoc Catch v1 programs under projects/Test."
  - "Upstream tests need an external catch.hpp via CATCH_INCLUDE; the recipe fetches the official Catch2 v1.12.2 single header with SHA-256 verification as a test-only input."
  - "On the current OHOS device, make's own exec of /bin/sh is denied by HMMAC policy (make: /bin/sh: Permission denied); CMake with the Ninja generator bypasses make entirely and works."

test_results:
  type: "official-and-consumer"
  ctest_total: 6
  ctest_passed: 6
  distinct_upstream_cases: 17
  upstream_assertions: 421
  consumer_tests: 1
  consumer_passed: 1
  skipped: 0
