software: pipexec
display: "pipexec"
description: "把一棵进程树按给定的 fd 连线组合成单条命令运行（shell 管道的超集）"
category: utility
homepage: "https://github.com/flonatel/pipexec"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游仓库已从 florath/pipexec 迁至 flonatel/pipexec（同名项目，2024-10 发布 2.6.2）"
    - "源码获取用 GitHub release asset pipexec-2.6.2.tar.xz（内含生成好的 configure/Makefile.in）；tag archive 不含生成文件，CI 镜像无 autoconf/automake，会强制 autoreconf 而失败"
    - "E007：上游 config.guess (2018) 不认识 HarmonyOS，configure 在 'checking host system type' 中断；补 0001 加 HarmonyOS 分支与 linux-ohos/ohos-linux 三元组（禁止 --build/--host 绕行）"
    - "configure.ac 末尾无条件覆盖 CFLAGS/CXXFLAGS，丢掉 conan 注入的 --target/--sysroot/-fPIC；补 0002 改为追加"
    - "src/Makefile.inc 字面 /bin/sh + version.sh 的 #!/bin/sh 在 HarmonyOS 无 /bin 时不可用（E165）；补 0003 改用 $(SHELL) 并直接读 version.txt"
    - "补丁刷新 autotools 输入 mtime 会触发 make 重跑缺失的 autoconf/automake（Error 127）；build() 固定输入/生成物时间戳规避"
    - "零 Conan 依赖（仅 libc）；产物为三个 CLI 可执行文件 pipexec/ptee/peet；上游 test/basic_tests.sh 4/4 真跑"
    - "pipexec 以 execv 绝对路径拉起子进程且禁止重复 pipe 端；test_package 自带 helper 子进程程序，11 项断言真跑"
  common_dependencies: []

versions:
  "2.6.2":
    status: built
    build_date: "2026-09-27"
    conan_ref: "pipexec/2.6.2"
