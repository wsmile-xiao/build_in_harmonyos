# conandata.yml — pipexec 2.6.2
# 官方源码：upstream GitHub release asset（flonatel/pipexec，原 florath/pipexec）
#   https://github.com/flonatel/pipexec/releases/tag/2.6.2
#
# 选 release asset 而非 tag archive：只有 release tarball 内含生成好的
# configure / Makefile.in / aclocal.m4 / config.h.in（build/create_tar.sh 在
# 发布时跑过 autotools）。CI 镜像没有 autoconf/automake，用 tag archive 会
# 触发无法执行的 autoreconf。带 .tar.xz 后缀，归档格式可被 Conan 正确识别。

sources:
  url: "https://github.com/flonatel/pipexec/releases/download/2.6.2/pipexec-2.6.2.tar.xz"
  sha256: "d3ba6802a9dc4e5f336e840958c4ddaf3de427fa70a62430688c91e4d46e3d1d"

patches:
  - patch_file: "patches/0001-config-guess-sub-ohos.patch"
    patch_description: "teach config.guess/config.sub HarmonyOS: add the HarmonyOS uname branch (-> aarch64-unknown-linux-ohos) and the linux-ohos/ohos-linux triplets (E007)"
    patch_type: "portability"
    sha256: "592d55adfbd991419256c3babba46fd0fe886fb450798cde902b1df11a6d7f30"

  - patch_file: "patches/0002-configure-respect-user-cflags.patch"
    patch_description: "make configure.ac/configure append to CFLAGS/CXXFLAGS instead of overwriting them, so the Conan AutotoolsToolchain flags (--target=aarch64-linux-ohos, --sysroot, -fPIC) survive"
    patch_type: "portability"
    sha256: "459a7b8247e8b3f274d0454e7d6e843529488e2970e73dc11ba220eb648c0c30"

  - patch_file: "patches/0003-version-gen-portable-shell.patch"
    patch_description: "generate src/app_version.c via $(SHELL) instead of a literal /bin/sh, and read version.txt directly so version.sh's #!/bin/sh shebang is never needed (HarmonyOS has no /bin; E165)"
    patch_type: "portability"
    sha256: "f83f877371adb129d6f82bf188b3513974dd5d6d8735b941af5b9614bd6a3b9a"

  - patch_file: "patches/0004-configure-hmdfs-mktemp.patch"
    patch_description: "replace autoconf's mktemp -d bootstrap with a plain mkdir -p: on HMDFS the setgid dirs mktemp creates (drwx--S---) are not writable by their owner, so config.status dies with './confXXXXXX/subs1.awk: Permission denied' (E114)"
    patch_type: "portability"
    sha256: "c97edaf355813e7ac10bb9de3e37a651c63c5263e1013555c1f527a6a23f7379"
