# test_package/MANIFEST.yml — pipexec 2.6.2
# 上游官方测试声明（CI L0e 读取；R51 上游测试三步法的清点结果）

package: pipexec/2.6.2
homepage: "https://github.com/flonatel/pipexec"

# ── 上游测试清点（R51 第 1 步）────────────────────────────────────────────
# 源码树（release tarball pipexec-2.6.2.tar.xz）中没有 tests/ 目录，也没有
# CTest / pytest / automake TESTS 注册：Makefile.am 只有 `TESTS =`（空）。
# 唯一的测试入口是上游 CI 在 `make` 之后显式调用的一次性脚本
# test/basic_tests.sh（4 项检查，见下）。test/ptest.c 只是示例用的
# stdin/stdout 回环辅助程序，本身 0 断言，不构成测试。
upstream_check_command: null          # 上游 make 无 check 目标（automake TESTS 为空）
upstream_test_in_build: true          # conanfile.py build() 内真实执行 basic_tests.sh
upstream_test_command: "bash test/basic_tests.sh   # 在 build 目录运行，读取 ./bin/pipexec"

upstream_tests:
  - file: test/basic_tests.sh
    source: pipexec-2.6.2/test/basic_tests.sh
    description: "上游唯一测试入口（4 项检查）：T1 无参数必失败；T2 子进程全成功时退出码 0；T3 任一子进程失败时退出码非 0；T4 '{ECHO:1>CAT:0}{CAT:1>GREP:0}' 三段管道回传 'Hello World'"
    command: "bash test/basic_tests.sh   # cwd = conan build 目录，脚本用 ./bin/pipexec"
    assertion_count: 4
    ohos_caveat: "脚本把子进程写成绝对路径 /bin/true、/bin/false、/bin/echo、/bin/cat、/bin/grep；HarmonyOS 无传统 /bin（E165），conanfile.py 的 build() 在运行前把这些 token 重定向到本机 shutil.which() 解析出的绝对路径，其余内容与上游逐字一致，不跳过任何检查"

# ── 适配层补充测试（test_package L1）──────────────────────────────────────
test_package_tests:
  - file: CMakeLists.txt
    description: "编译 pipehelper.c；不写 find_package/target_link_libraries —— pipexec 是 application 包，不导出库与 CMake config"
    command: "cmake -S . -B <build>"
  - file: pipehelper.c
    description: "消费者测试子进程（produce/pass/consume/echo/exit/sleep/abort-once）。pipexec 以 execv 按绝对路径拉起子进程，故测试自带辅助程序；辅助程序不依赖任何平台宏，Linux 与 OHOS 同一份源码"
    command: "cmake --build <build>"
  - file: smoke.sh
    description: "真实驱动包内 pipexec 的 11 项断言，任何一项不满足即非零退出"
    command: "sh smoke.sh <pkg>/bin/pipexec <pipehelper> <workdir>"

# smoke.sh 11 项断言（R34：真实执行被测二进制，非空壳）
#   T1  -h 打印 'pipexec version 2.6.2'
#   T2  无参数 → exit 1
#   T3  所有子进程成功 → exit 0
#   T4  子进程失败 → 非零退出码
#   T5  fd 连线 '{ECHO:1>CAT:0}' 回传 'Hello World'
#   T6  三段链路 A->B->C（两条 pipe）字节一致（4096 B）
#   T7  65536 B 确定性负荷经 produce|consume 逐字节一致
#   T8  -j json 日志输出一个 JSON 对象
#   T9  -p 写出的 pidfile 内容等于 pipexec 自身 pid（运行期观测）
#   T10 -s 异常终止的子进程被重启（SIGABRT 一次 → 观测到两轮运行）
#   T11 子进程参数逐字透传
assertion_count: 11

ohos_note: "test_package 自带 CMake 测试源（L0c）；helper 与断言均由 self.run() 真实驱动（L0d）。OHOS 上新链接的 ELF 需 binary-sign-tool 自签名并置于非 HMDFS 的 /data 路径才可执行（与 archives/l/libxext/1.3.7、archives/p/pipemeter/1.1.5 同构）"
