# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E007 复现：上游 config.guess (2018-02-24) 无 HarmonyOS 分支，uname -s=HarmonyOS 时 configure 在 'checking host system type' 处 'unable to guess system type' 直接中断；须给 config.guess 加 *:HarmonyOS:*:*) 分支并让 config.sub 认识 linux-ohos/ohos-linux（补 0001）  (knowledge_ref: E007)"
  - "该版本 config.guess 的分支必须 'echo <triplet>; exit' 收尾（不是赋值 GUESS 变量）——照抄新版 config.git 的 GUESS=… 写法会静默失效、仍然报 unable to guess system type  (knowledge_ref: E007)"
  - "autoconf 末尾无条件赋值 CFLAGS/CXXFLAGS 会丢掉 AutotoolsToolchain 注入的 --target/--sysroot/-fPIC，编译实际按宿主/默认目标进行；须把赋值改成追加 CFLAGS=\"$CFLAGS …\"（补 0002，同 archives/l/libnova/0.16 respect-user-cflags）  (knowledge_ref: notes)"
  - "src/Makefile.inc 以字面 /bin/sh 生成 app_version.c，且生成的 version-gen.sh 会经 #!/bin/sh 的 version.sh；HarmonyOS 无 /bin（E165）。改用 configure 填充的 $(SHELL) 并直接读 version.txt（补 0003）  (knowledge_ref: E165)"
  - "补丁改写 configure.ac/Makefile.inc/config.guess 会给 autotools 输入刷新 mtime，触发 make 重跑不存在的 autoconf/automake（Error 127）；build() 沿依赖链赋三个递增过去时间戳（输入 < aclocal.m4 < configure/Makefile.in）即可。注意 aclocal.m4 既是 configure.ac 的产物又是 Makefile.in 的依赖，给全部生成物同一「当前时间」会让它反超 Makefile.in 而再次触发 aclocal  (knowledge_ref: notes)"
  - "pipexec 2.6.2 以 execv 按绝对路径拉起子进程，且禁止重复 pipe 端（同一 source/target fd 只能出现一次，fan-in/fan-out 不可表达）；test_package 因此自带 pipehelper 子进程程序，并用三段链路 A->B->C 验证多管道  (knowledge_ref: notes)"
  - "上游 test/basic_tests.sh 用 /bin/true|cat|grep 等绝对路径；HarmonyOS 无 /bin（E165），build() 运行前按 shutil.which() 重定向这些 token，断言数量与脚本其余内容保持不变  (knowledge_ref: E165)"
  - "E232 复现（真机实测）：HMDFS 上的源码树无法直接 exec 生成的 configure（autotools.configure() 报 Error 126 'Permission denied'），且 CONFIG_SHELL 只能影响 Autoconf 后续子 shell、包不住首次启动；当 settings_build.os==OHOS 时改为 /system/bin/sh <configure> <autotools._configure_args>（同 archives/o/opusfile/0.12 的权威实现）  (knowledge_ref: E232)"
  - "E114 复现（真机实测）：HMDFS 上 autoconf 的 `(umask 077 && mktemp -d ./confXXXXXX)` 产出 drwx--S--- 目录，属主亦不可写，config.status 报 './confXX/subs1.awk: Permission denied'；补 0004 把 mktemp 引导换成 plain mkdir -p（同 archives/p/pipemeter/1.1.5 补 0002）。实测修 configure 后生成的 config.status 同步继承该修复  (knowledge_ref: E114)"

