software: perl-math-round

# ============================================================
# 必须字段
# ============================================================

version: "0.08-r1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# 构建系统（顶级字段，供 verify-build 检查）
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/perl-math-round-0.08-r1.tar.gz"

  # 源码校验和
  sha256: "7b4d2775ad3b859a5fd61f7f3fc5cfba42b1a10df086d2ed15a0ae712c8fd402"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=~/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块，无 XS/C 代码，无需 ELF 签名"
  - "使用 ExtUtils::MakeMaker 构建：perl Makefile.PL PREFIX=~/usr/local && make && make install"
  - "Perl 模块安装路径为 ~/usr/local/lib/site_perl/5.42.0/Math/Round.pm"
  - "与 perl-dbd-pg 不同，纯 Perl 模块不受 SELinux HMDFS 限制，可直接加载"
  - "所有 10 个官方测试全部通过，无平台适配问题"
