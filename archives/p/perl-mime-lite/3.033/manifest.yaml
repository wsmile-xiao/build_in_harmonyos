software: perl-mime-lite
version: "3.033"
status: built
build_date: "2026-06-17"
build_system: perl

source:
  url: "https://cpan.metacpan.org/authors/id/R/RJ/RJBS/MIME-Lite-3.033.tar.gz"
  sha256: "78a279f1d2e242551c347ef97a13fc675766602cb84c2a80c569400f4f368bab"
  tar_format: tar.gz

build:
  system: perl
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX"
  dependencies:
    - "Email::Date::Format/1.005 (运行时依赖, 需单独安装)"
    - "MIME::Types/2.29"
    - "MIME::Base64/3.16 (Perl核心模块)"
    - "Mail::Address/2.22 (perl-mailtools)"
    - "Mail::Header/2.22 (perl-mailtools)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯Perl模块，使用 perl Makefile.PL 替代 ./configure"
  - "G0干净构建验证不适用于Perl模块（无configure脚本）"
  - "make test 需要 Email::Date::Format 运行时依赖"
  - "纯Perl模块不受SELinux HMDFS限制（与XS模块如perl-dbd-pg不同）"
  - "官方测试套件48项全通过, 自定义18项功能测试全通过"
  - "支持: 文本/HTML邮件, multipart嵌套, Base64/QP编码, UTF-8, 文件附件"
