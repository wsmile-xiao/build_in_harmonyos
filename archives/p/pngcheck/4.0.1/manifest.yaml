software: pngcheck
build_system: cmake
version: "4.0.1"
status: built
build_date: "2026-05-25"

source:
  url: "https://github.com/pnggroup/pngcheck/archive/refs/tags/v4.0.1.tar.gz"
  sha256: "a24ac2348efca5895e9d6f53fd316f3d5c409ab92a74b2b8106541759304da53"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DPNGCHECK_USE_SYSTEM_ZLIB=ON"
  dependencies:
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - ref: E075
    note: "cmake find_package(ZLIB) 需预编译zlib包+PKG_CONFIG_PATH设置"
  - note: "pngcheck 不支持 --version 参数(L3)，版本信息通过直接运行获取"
  - note: "zlib 以静态方式链接(L3)，inflate/deflate为local T符号，运行时仅依赖libc.so"