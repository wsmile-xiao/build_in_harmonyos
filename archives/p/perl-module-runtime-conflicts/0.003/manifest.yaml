software: perl-module-runtime-conflicts
# 版本级 manifest
# 文件位置: archives/p/perl-module-runtime-conflicts/0.003/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.003"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# 构建系统
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/Module-Runtime-Conflicts-0.003.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "dist-checkconflicts/0.11"
    - "module-runtime/0.018"
    - "extutils-makemaker/7.76"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 ExtUtils::MakeMaker (Makefile.PL) 构建，无需 C 编译，不需要 ELF 签名"
  - "纯 Perl 模块不涉及 XS/.so 文件，不受 SELinux HMDFS 限制影响（参考 perl-dbd-pg 经验）"
  - "Module::Runtime::Conflicts 使用 Dist::CheckConflicts 框架，提供 check_conflicts/conflicts 方法检测模块版本冲突"
  - "纯 Perl 模块打包仅包含 .pm 文件和 .packlist，体积小（11KB），安装路径与运行时路径一致"
