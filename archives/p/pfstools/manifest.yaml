# 软件级 manifest — pfstools
# 遵循 ARCHIVE-SPEC v2.0

software: pfstools
display: "pfstools"
description: "HDR image processing tools — PFS pipeline converters, filters and tone-mapping operators"
category: gfx
homepage: "https://pfstools.sourceforge.net/"
license: LGPL-2.1-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "核心库 libpfs 零外部依赖；全部第三方库为可选且均有 -D WITH_*=OFF 开关（本包走最小面，requirements() 为空）"
    - "上游 cmake_minimum_required(VERSION 2.8.8) 在 cmake 4.1.2（设备与 CI 同版本）下直接 FATAL（E103/E187）；"
    - "  必须以 tc.cache_variables 注入 CMAKE_POLICY_VERSION_MINIMUM=3.5 —— tc.variables 只写进 toolchain 的 set()，"
    - "  cmake_minimum_required() 读不到（实测两轮 G2 对比），删掉该行 CI 必红"
    - "上游无测试入口（0 enable_testing / 0 add_test，无 tests/ 目录）—— R51 清点证据见 2.2.0/notes.md；"
    - "  可运行验证全部由 test_package 消费者测试承担（真机 44/44 断言，含 L1e 破坏性反向验证）"
    - "pfsin/pfsout/pfsindcraw 及 camera 脚本由 .in 模板 sed 注入 @BASH_PATH@/@PERL_PATH@ 生成：实测 CMake 命中 "
    - "  BASH_EXECUTABLE=/data/service/hnp/bin/bash、PERL_EXECUTABLE=/data/service/hnp/bin/perl，无未替换占位符"
    - "例外：pfs_automerge(#!/bin/bash) 与 pfs_split_exposures.py(#!/usr/bin/python3) 为上游硬编码 shebang，"
    - "  本设备无 /bin/bash 与 /usr/bin/python3 ⇒ 执行返回 rc=127，已从 commands.json 剔除（未申报不可用命令）"
    - "BUILD_SHARED_LIBS=OFF（R26），产物为静态 libpfs.a + include/pfs/*.h + bin/ 40 个文件（其中 38 个实测可执行，见 commands.json）"
  common_dependencies: []

versions:
  "2.2.0":
    status: built
    build_date: "2026-09-24"
    packaging: conan
    notes: "conan recipe（os=OHOS arch=armv8 clang-15 libc++ cppstd=17），requirements() 为空（可选依赖全关）；源 SourceForge 官方 tarball，sha256 9bf68449…；构建段真机通过 conan-verify（RC=0）与 W3 本地 CI 模拟（.ci-result.json exit_code=0）；38 个 CLI 见 commands.json，消费者断言 44/44 见 2.2.0/reports/test-report.md"
    dependencies: []
