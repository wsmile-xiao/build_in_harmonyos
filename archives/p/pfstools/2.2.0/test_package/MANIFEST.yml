# test_package/MANIFEST.yml — pfstools 2.2.0
# CI L0e requires this file to exist.

package: pfstools/2.2.0
homepage: "https://pfstools.sourceforge.net/"

# pfstools 上游 2.2.0 无任何测试套件（R51 第 1 步清点证据，详见 ../../notes.md）：
#   顶层 CMakeLists.txt: enable_testing=0 / add_test=0 / include(CTest)=0
#   无 test/ 与 tests/ 目录；全仓含 test 字样的仅 src/matlab/pfs_test_shell.m（Matlab 手工脚本）
#   与 doc/pfs_format_spec.tex（格式规范文档），均非测试套件。
# ⇒ 上游静态声明 0、可执行 0、实测 0、跳过 0、失败 0（是真 0，不是省略）。
# ⇒ 不存在可运行的上游 check/ctest 命令，故下列 command 字段为空。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游不存在可运行的测试程序
upstream_tests: []

# test_package tests (consumer perspective)
# 构建段真机实测校正版（2026-09-24，构建机 B）：初稿的 pfsoutpfm 管道方向、
# `-h`=help 与 pfssize --xsize 三处均与上游实际行为不符，已按实测改写。
test_package_tests:
  - file: test.sh
    description: "消费者测试（44 条断言，全部真实执行被测包二进制）：38 个申报 CLI 存在性+可执行性（--help 有 usage 且 rc∉{126,127}）+ PFM->PFS->PFM 往返 16 字节像素 payload 逐字节保真 + pfsgamma --gamma 2.2 数值校验（0.25^(1/2.2)=0.5318 -> 小端 44 53 08 3f）+ pfssize --x/--y 与 pfscat --vertical 尺寸链"
    command: "bash test.sh"

# 断言数（真机同源：reports/w3-local-ci.log 的 ASSERT_TOTAL=44 / ASSERT_PASS=44 / ASSERT_FAIL=0）
#   38 CLI 可执行性 + 3 PFM 往返保真 + 1 pfsgamma 数值 + 2 尺寸链 = 44
assertion_count: 44
