# 版本级 manifest — pfstools 2.2.0
# 遵循 ARCHIVE-SPEC v2.0
# 非构建前置段：主理-11（取证 + 依赖只读核验 + 配方初稿）
# 构建段与门禁：主理-23（conan create / conan-verify / W3 / finish，构建机 B 真机）

version: "2.2.0"
software: "pfstools"

status: built
build_date: "2026-09-24"
build_system: "cmake"

source:
  url: "https://sourceforge.net/projects/pfstools/files/pfstools/2.2.0/pfstools-2.2.0.tgz"
  sha256: "9bf6844985663226c21998eeb43c261acb8e4b3891b9a91b729554406289d7ca"
  tar_format: tar.gz   # 扩展名 .tgz = gzip tar

build:
  system: cmake
  configure_options:
    # 关闭全部可选依赖（逐字对应顶层 CMakeLists.txt 的 OPTION 名）
    - "-DWITH_OpenEXR=OFF"
    - "-DWITH_ImageMagick=OFF"
    - "-DWITH_NetPBM=OFF"
    - "-DWITH_TIFF=OFF"
    - "-DWITH_QT=OFF"
    - "-DWITH_MATLAB=OFF"
    - "-DWITH_Octave=OFF"
    - "-DWITH_pfsglview=OFF"
    - "-DWITH_FFTW=OFF"
    - "-DWITH_GSL=OFF"
    - "-DWITH_OpenCV=OFF"
    - "-DWITH_HDRVC=OFF"
    # 上游 cmake_minimum_required(2.8.8) vs 设备/CI cmake 4.1.2（E103/E187）
    # ⚠ 必须以 cache 变量（命令行 -D）注入：tc.variables 只写 toolchain set()，
    #   cmake_minimum_required() 读不到 → 实测 G2 直接 FATAL
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DBUILD_SHARED_LIBS=OFF"
  dependencies: []    # requirements() 为空：核心构建零外部依赖
  cc: clang
  cxx: clang++
  notes: "conan 2.29.1 + cmake 4.1.2 + clang-15/libc++/cppstd=17（profile ohos-aarch64）；产物 = 静态 libpfs.a + include/pfs/pfs.h 与 array2d.h + bin/ 40 个可执行文件；pfsin/pfsout 等 8 个脚本的 @BASH_PATH@/@PERL_PATH@ 由 CMake find_program 注入为 /data/service/hnp/bin/bash 与 perl（实测命中）"

test:
  upstream_cases: 0
  upstream_suite: "上游 2.2.0 无测试框架：顶层 CMakeLists.txt 中 enable_testing=0 / add_test=0 / include(CTest)=0，无 test/ 与 tests/ 目录（全仓含 test 字样的仅 src/matlab/pfs_test_shell.m 手工脚本与 doc/pfs_format_spec.tex）—— R51 清点证据见 notes.md"
  runnable: 0
  runnable_note: "上游无任何可运行测试用例（不是跳过，是不存在）"
  pass_rate: "0/0 = 不适用（上游无测试用例）"
  consumer_test: "test_package/test.sh 真机实测 44/44 断言通过（38 CLI 存在性+可执行性 rc∉{126,127} + PFM→PFS→PFM 往返 16B 像素 payload 逐字节保真 + pfsgamma 0.25^(1/2.2)=0.5318 数值校验 + pfssize --x/--y 与 pfscat --vertical 尺寸链）；证据 reports/w3-local-ci.log 内 ASSERT_TOTAL=44/ASSERT_PASS=44/ASSERT_FAIL=0，且 L1e 破坏性反向验证通过（R34）"

patches_applied: []

knowledge_ref: [E092, E103, E187, E447]

knowledge_gained:
  - "CMake 4.x 下 tc.variables['CMAKE_POLICY_VERSION_MINIMUM'] 无效：cmake_minimum_required() 读 cache，必须用 tc.cache_variables 才会以 -D 出现在命令行（实测两轮 G2 对比）"
  - "pfstools 2.2.0 的 CLI 无 --version 选项且 --help 返回 rc=1；CI 的 L2 以 --version 探测，40 个产物中仅 6 个被判 OK（门禁按宽松规则仍 pass）⇒ 可执行性断言须用 rc（127=解释器缺失）而非 usage 文本匹配"
  - "pfsoutpfm 从 stdin 读 PFS、把 PFM 写到位置参数（`pfsoutpfm out.pfm < in.pfs`）；`pfsoutpfm in.pfs > out.pfm` 这种反写会静默产出空文件"
  - "上游 pfsinpfm 对 Pf(3 通道) 头部实际按 1 通道读取，pfsoutpfm 恒写 Pf 魔数 ⇒ PFM 往返断言只能锁像素 payload 保真，不能声明通道语义"
  - "conan 以 test_package 目录为 cwd 执行 test()，bash 在该 cwd 下 getcwd() 失败并打印含 'No such file or directory' 的噪声，会与'解释器缺失'的错误串撞车 ⇒ self.run(..., cwd=) 显式指定可解析目录"
  - "SourceForge canonical URL 302 后按请求轮转镜像，本例落到死镜像导致 conan source() 停滞零字节；CI 的 mirror fallback 对 SourceForge 分支不加镜像（build_and_test.sh L1117-1120）⇒ 环境侧用 core.sources:download_cache（键 sha256）命中，不改 CI 输入"
