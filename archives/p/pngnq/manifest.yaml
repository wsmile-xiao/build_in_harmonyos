software: pngnq
display: "pngnq"
description: "PNG NeuQuant 图像量化命令行工具，将 32 位 RGBA PNG 量化为 8 位调色板 PNG（pngnq 量化器 + pngcomp 对比器）"
category: graphics
homepage: "https://pngnq.sourceforge.net/"
license: Libpng
build_system: autotools

ohos_adaptation:
  key_points:
    - "E129：configure 内 umask 077 与 HMDFS setgid 目录权限冲突，需改 umask 022"
    - "libpng ≥1.5 的 png.h 不再内嵌 zlib.h，src/rwpng.c 需补 #include <zlib.h> 与 <string.h>"
    - "上游 Makefile.am 用 libpng-config 反引号取编译链接参数，conan 包内该脚本 prefix=\"\" 不可用，配方需生成 wrapper"
    - "configure 用 PKG_CHECK_MODULES 找 libpng，配方用 PkgConfigDeps 生成器满足"
    - "无测试套件，test_package 以内嵌 PNG 的真实量化测试补偿（R34）"
  common_dependencies:
    - libpng
    - zlib

versions:
  - version: "1.1"
    status: published
    build_date: "2026-09-03"
