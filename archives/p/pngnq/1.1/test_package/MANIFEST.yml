# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh) 要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pngnq/1.1
homepage: "https://pngnq.sourceforge.net/"

# 上游测试存在性审计（hmbs 硬门禁要求）
# 审计结论：pngnq 1.1 上游正式测试为 0
upstream_tests_exist: false
upstream_test_audit: |
  审计结论：pngnq 1.1 上游正式测试为 0，证据完整。
  1. SourceForge 官方 release tarball（pngnq-1.1.tar.gz，2011-02 发布）文件清单
     仅含：AUTHORS COPYING ChangeLog INSTALL Makefile.am Makefile.in NEWS README
     aclocal.m4 configure configure.ac depcomp freegetopt/ install-sh missing
     pngnq.1 src/。无 tests/、test/、regress/ 目录。
  2. configure.ac 无任何测试框架宏（无 AC_CONFIG_TESTDIR / AM_TESTS）。顶层
     Makefile.am 仅 SUBDIRS + dist_man_MANS；src/Makefile.am 仅 bin_PROGRAMS
     （pngnq、pngcomp），无 check_PROGRAMS / TESTS / test 目标。
  3. 实测 `make check`：递归进入 src/ 与顶层均 "Nothing to be done for
     'check-am'"，无任何测试执行（automake 默认空 check 目标）。
  4. 上游 SourceForge 仓库（svn）与 README 均无测试套件说明；README 仅描述
     命令行用法。
  5. 上游不在 no_official_test.txt 白名单中。

# 上游测试命令（pngnq 无 make check 实质测试）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（pngnq 上游无测试）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "内嵌 8x8 RGBA PNG，真实执行 pngnq 量化并验证输出为合法调色板 PNG（色彩类型 3、尺寸缩小），pngcomp 对比两图，非法输入/缺参数错误处理"
    command: "sh test.sh <bin>"

# 测试断言总数（test_package 8 条断言）
assertion_count: 8

# 测试套件覆盖说明
test_suite_gaps:
  none: "上游无正式测试套件；test_package 覆盖核心功能：PNG 量化（RGBA→调色板）、输出合法性（PNG 魔数/IHDR 色彩类型）、尺寸缩减、pngcomp 图像对比、版本输出、非法输入与缺参错误处理"
