# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E129（知识图谱命中）：HMDFS 对新建目录强制 setgid，configure 的 umask 077 生成 drwx--S--- 导致 config.status 无写权限，sed 改 umask 022 修复"
  - "libpng ≥1.5 的 png.h 不再内嵌 zlib.h，老代码用 Z_BEST_COMPRESSION 需自行 #include <zlib.h>"
  - "conan 打包的 libpng-config 脚本 prefix=\"/\" 不可用；上游 Makefile.am 反引号调用 libpng-config 时需生成指向 conan 依赖包的 wrapper 并前置 PATH"
  - "pngnq 是 CLI 工具（pngnq/pngcomp 双二进制），R38 需要 commands.json；package_type=application，cpp_info 只声明 bindirs"

