software: pan
display: "pan"
description: "GNOME Usenet 新闻组阅读器（GTK3 GUI + nzb 批处理模式）"
category: network
homepage: "https://gitlab.gnome.org/GNOME/pan"
license: GPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 3.25+（hnp cmake 4.1.2 满足；不 tool_requires cmake——ohpcd 无 cmake 配方且 CI 禁 conancenter，L0i 会硬拦）"
    - "pkg_check_modules 发现依赖：PkgConfigDeps 生成 pc 文件链"
    - "glib 统一：gmime(glib2/2.88.0 static) 与 gtk(glib/2.84.0.1 shared) 共图，pkg_config_name 冲突时 Conan 2.29 输出单一 glib-2.0.pc 指向 shared glib"
    - "WANT_GSPELL=OFF（gspell 未发布）、WANT_GNUTLS=OFF（上游有合法 no-TLS CertStore 空壳降级）、ENABLE_MANUAL=OFF（需 itstool）"

common_dependencies:
  - gtk/3.24.43
  - gmime/3.0.5
  - zlib/1.3.1.1

versions:
  "0.165":
    status: in_progress
    build_date: ""
    note: >-
      配方先行开发（等 gmime 3.0.5 PR #7971 合入间隙）。本地已用
      本地缓存 gmime/3.0.5 完成 conan create 预验证；W3 终验
      （gmime 从制品仓解析）必须等 #7971 合入后执行。
