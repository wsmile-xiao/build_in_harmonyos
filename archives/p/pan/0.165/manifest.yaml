# pan 0.165 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

version: "0.165"

software: pan

# 编译状态
# published | built | failed | archived | in_progress
# in_progress：配方开发完成 + 本地 conan create 完整通过（编译+链接+
# test_package 三 smoke，gmime 走本地缓存，见 notes.md 附录 A）；
# 最终 W3 终验（gmime 从制品仓解析）等 PR #7971 合入。
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（GNOME GitLab 官方 archive；tag 名带 v 前缀：
  # v0.165 → pan-v0.165.tar.gz，与 gmime 同款通道，实测可达 2.7MB）
  url: "https://gitlab.gnome.org/GNOME/pan/-/archive/v0.165/pan-v0.165.tar.gz"

  # 源码校验和（本地实测）
  sha256: "c9eeeff363908bb4c7f2d305e651b618d729a5ea3b9e5756525ce9dd0da118e4"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: cmake

  # CMake 变量（pan 0.165 全部为 option 开关）
  configure_options:
    - "CMAKE_SYSTEM_NAME=Linux（OHOS 无 CMake 平台模块，设备原生编译）"
    - "WANT_DBUS=OFF"
    - "WANT_GMIME_CRYPTO=OFF（默认即关）"
    - "WANT_GSPELL=OFF（默认开→强制关，gspell 未发布到 ohpcd）"
    - "WANT_WEBKIT=OFF（默认即关）"
    - "WANT_GNUTLS=OFF（默认开→强制关，见 notes 降级分析）"
    - "WANT_NOTIFY=OFF"
    - "WANT_GKR=OFF"
    - "ENABLE_MANUAL=OFF（需 itstool）"
    - "BUILD_TESTING=OFF（上游无活动测试，见 test_package/MANIFEST.yml）"
    - "SOURCE_DATE_EPOCH=1（可复现构建，不嵌 git rev/uname）"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - gtk/3.24.43
    - gmime/3.0.5
    - zlib/1.3.1.1

  # 构建工具依赖（无 conan 侧 tool_requires；cmake 4.1.2/pkg-config/msgfmt
  # 均由 hnp 工具链提供，ohos-aarch64 profile 已注入 PATH）
  tool_dependencies: []

  cc: clang
  cxx: clang++

  build_notes: |
    详见 notes.md。关键决策：
    1. CMake min 3.25 —— hnp cmake 4.1.2 满足；不 tool_requires cmake
       （ohpcd 无 cmake 配方 + CI 禁 conancenter，L0i 硬拦）。
    2. glib 双树统一 —— gmime 用 glib2/2.88.0(static)，gtk 用
       glib/2.84.0.1(shared)；共图时 Conan 2.29 的 PkgConfigDeps 输出
       单一 glib-2.0.pc 指向 gtk 树的 shared glib，静态 libgmime-3.0.a
       链接同一 shared libglib 运行（符号兼容，pan 政策
       GLIB_VERSION_MAX_ALLOWED=2.36）。
    3. 关闭 WANT_GNUTLS 后上游 CertStore 有完整 #else 空壳降级
       （pan/data/cert-store.h:166），非 stub 注入，合法编译路径。
    4. pan 为应用（bin/pan 可执行文件）——软件级 commands.json 已建（R38）。

patches_applied: []

knowledge_gained:
  - "CMake 3.25+ 包不 tool_requires cmake 的判定：ohpcd 无 cmake 配方且 CI setup.sh 显式禁用 conancenter，tool_requires 会被 L0i 依赖闸拦"
  - "glib 与 glib2 双包共图：pkg_config_name 同为 glib-2.0 时 PkgConfigDeps 输出指向 requires 树优先解析的那个，实测指向 gtk 树 shared glib"
  - "pan --version 在参数解析阶段 return，先于 gtk_init——headless 环境可安全 smoke"
