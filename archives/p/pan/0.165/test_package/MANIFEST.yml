package: pan/0.165
homepage: "https://gitlab.gnome.org/GNOME/pan"

upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_note: >-
  pan 0.165 has no active upstream tests: CMakeLists includes CTest but no
  add_test() is ever issued (the only candidate, pan/data/article-test,
  is commented out upstream as "this test is broken"). BUILD_TESTING is
  therefore OFF and the smoke coverage comes from test_package.

upstream_tests:
  - name: article-test
    command: "pan/data/article-test (commented out upstream)"
    expected: "disabled upstream — 'this test is broken'"

test_package_tests:
  - file: test_pan.cxx
    description: "Link gmime-3.0 + gtk+-3.0 the way pan does (pkg_check_modules) and call g_mime_init/g_mime_version_string + gtk_get_*_version"
    command: "./test_pan"
  - file: conanfile.py (test())
    description: "Execute packaged pan binary: --version (exits before gtk_init, headless-safe) and --help"
    command: "pan --version; pan --help"

assertion_count: 5
