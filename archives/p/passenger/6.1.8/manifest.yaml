# 版本级 manifest —— passenger 6.1.8
# 遵循 ARCHIVE-SPEC v2.0

version: "6.1.8"
software: passenger

status: built
build_date: "2026-09-29"
build_system: custom

source:
  url: "https://github.com/phusion/passenger/archive/refs/tags/release-6.1.8.tar.gz"
  sha256: "a812771f9d3278519cd0c75f556732cdf4199c12ae972cf9bc172b06c55421cc"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
  package_layout:
    - "package/bin/: passenger、passenger-config 等六个用户命令的包内转发脚本"
    - "package/libexec/passenger/: 上游 native-packaging 源码树、Ruby/Node 支持库和资源配置"
    - "package/licenses/LICENSE: 上游 MIT 许可证"
  upstream_tests:
    framework: Rake / Minitest
    command: "rake test"
    in_build: true
    integrated_suite:
      name: OXT
      command: "rake test:oxt"
      declared: 12
      executed: 12
      result: "ok:12，exit 0"
    declared_scope:
      oxt: 12
      cxx: 846
      ruby: 145
      node: 33
      integration: 85
      total: 1121
      count_method: "按上游测试文件中 TEST_METHOD / it 声明计数"
    not_executed:
      cxx: "设备缺少 OpenSSL 与 curl 开发头文件时无法完成编译；已通过 Conan 缓存补齐，并为 OHOS linux/net.h 头文件冲突加入最小平台补丁后继续验证"
      ruby: "Ruby 套件依赖 cgi、logger、json、rspec、rack、webrick 等 gems，当前真机 Ruby 环境未安装"
      node: "Node 套件需要 node_modules、mocha、should、sinon 等依赖，当前真机源码树未安装"
      integration: "集成套件需要 Apache/NGINX、可写运行目录和多进程环境，当前受限真机环境未满足"
  package_test:
    command: "conan create archives/p/passenger/6.1.8"
    consumer_checks: 47
    result: "真机 conan create 通过；consumer checks 47/47，exit 0"

patches_applied:
  - patches/0001-IOUtils-avoid-ohos-linux-net-header-conflict.patch

knowledge_gained:
  - "Passenger 的 GitHub release 资产不包含完整 test/ 目录，必须使用 release-6.1.8 tag archive，才能保留上游 OXT、C++、Ruby、Node 和 Integration 测试源码。"
  - "Passenger 的 Ruby 命令依赖 locations.ini 与应用树相对布局；包内生成绝对路径元数据后，再通过 bin/ 转发脚本调用 libexec/passenger/bin 下的上游命令，可避免安装路径漂移。"
  - "上游 OXT 套件是当前真机环境下可直接离线执行的稳定子集，结果按 ok:12 原样记录；未执行的套件不能计为通过。"
