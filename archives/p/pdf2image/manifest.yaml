software: pdf2image
display: "pdf2image"
description: "A wrapper around the poppler pdftoppm and pdftocairo command line tools to convert PDF to a PIL Image list"
category: doc
homepage: "https://github.com/Belval/pdf2image"
license: MIT
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python 包，无需编译器"
    - "运行时依赖 poppler-utils (pdftoppm/pdftocairo/pdfinfo)"
    - "Python 依赖 Pillow"
    - "安装后需设置 PYTHONPATH 包含 $DEFAULT_PREFIX/lib/python3.12/site-packages"
  common_dependencies:
    - poppler-utils
    - pillow

versions:
  "1.17.0":
    status: published
    build_date: "2026-05-27"