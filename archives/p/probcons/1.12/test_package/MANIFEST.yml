# test_package/MANIFEST.yml - probcons 1.12 upstream test declaration (R51)
package: probcons/1.12
homepage: "http://probcons.stanford.edu/"

# Upstream test inventory: the 1.12 tarball contains 16 files, all sources or
# headers; there is no tests/ directory and the Makefile has no check/test
# target ("make -n check" -> No rule to make target 'check').
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_probcons.py
    description: "consumer test: --version/--help smoke (K0) plus a real 3-sequence protein MSA"
    command: "python3 test_probcons.py <bindir>"

assertion_count: 9
