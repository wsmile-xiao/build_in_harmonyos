# ------------------------------------------------------------
# 知识沉淀
# ------------------------------------------------------------
knowledge_gained:
  - "BSD make 语法（.ifdef/.else/.endif）在 GNU make 下报 'missing separator'；需改写为 ifdef/else/endif"
  - "BSD make 的变量定义选项 -DWITH_X 在 GNU make 中是保留选项（-D 未定义），递归子 make 会打印 usage；应改为命令行变量 WITH_X=1 传递"
  - "OHOS 无 install(1)：Makefile install 目标须用 mkdir -p + cp -f + chmod 替代"
  - "BSD 专有 dirent.d_namlen 在 OHOS(musl) 不存在；用 strlen(d_name) 等价替换，无需平台宏"
  - "OSDN 停服后 FreeBSD distcache 是唯一权威 distfile 来源；主站(distcache.FreeBSD.org, Fastly)在本机不可达，区域站点 distcache.{eu,us-east,us-west}.FreeBSD.org 可用 HTTP 访问"
  - "运行期依赖 FreeBSD umidi/uaudio /dev/umidi*.*；OHOS 无该设备，但 -0 <dev> 可指定任意设备节点（/dev/null）完成 SMF 解析端到端验证"
  - "上游提供 -DWITH_DEBUG（含 VERIFY_EVENT）自校验构建：Veryfy_Event() 逐事件比对解析结果与源字节，可用于无自动化测试项目的行为验证；注意 -r（禁用 auto-append GM/XG/GS RESET）否则 verify 会报 SysEx 差异"

