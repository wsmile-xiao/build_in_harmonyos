# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: playumidi/0.8.3
homepage: "https://osdn.net/projects/playumidi/"

# 上游测试命令
# 事实：上游 tarball 内无 tests/ 目录，两个 Makefile 均无 test/check 目标
#      （见 0.8.3/notes.md「上游测试入口核验」节的 tar 清单与 grep 证据）。
upstream_check_command: ""

# 上游是否已有自动化测试集成进 build()
upstream_test_in_build: false
upstream_test_command: ""

# 上游自动化测试用例：无（上游未提供任何自动化测试框架/样例）
upstream_tests: []

# test_package 自带测试（消费者视角验证，实质运行被测包可执行文件）
test_package_tests:
  - file: test.sh
    description: "消费者冒烟：usage 输出 / OHOS 无 umidi 设备行为 / SMF 解析+事件播放(-0 null)。
      SMF 样例（71 字节，format 0）由脚本内联文本转义序列生成到 $TMPDIR，不在仓库/PR 中保留二进制文件
      （平台 pull/<N>.diff 不携带二进制 patch 数据，会致 CI checkout-pr 无法应用 diff，实测 #66143/#66146）"
    command: "./test.sh"

# 断言总数（**仅指 test_package 自身**的 3 条断言：usage / OHOS 无设备行为 / SMF 解析+播放）。
# 与「上游测试 12 用例（9 上游入口 + 3 verify 自校验）」**不是同一口径**，
# 后者见 notes.md「验证结果」表与 reports/test-report.md。
assertion_count: 3
