# conandata.yml — playumidi 0.8.3
#
# 源码来源说明（R39）：
#   上游原站 OSDN（osdn.net / ja.osdn.net，SourceForge.JP 后继）已于 2024 年终止服务，
#   域名 DNS 不再解析（实测 `curl https://ja.osdn.net/...` -> rc=6 Could not resolve host）。
#   现存唯一权威来源为 FreeBSD 项目官方 distcache 中缓存的原始上游 tarball：
#     https://distcache.FreeBSD.org/ports-distfiles/playumidi-0.8.3.tar.gz
#   该文件即 FreeBSD ports audio/playumidi（PORTVERSION=0.8.3）所引用的上游原件，
#   sha256 与 ports distinfo 完全一致，并已实测下载 + sha256sum 校验通过。
#
# ⚠️ CI 可达性实测（2026-10-01，PR !14131 CI #66149）：
#   CI worker 侧访问 distcache.FreeBSD.org（Fastly 段）失败：
#     network: Error downloading https://distcache.FreeBSD.org/... :
#       HTTPSConnectionPool(host='distcache.freebsd.org', port=443): Max retries exceeded
#   因此把 FreeBSD **自建区域站点**（非 Fastly）纳入 url 列表作为回退。
#   区域站点的 TLS 证书为 *.freebsd.org 通配、**不覆盖二级子域**，严格校验必失败，
#   故显式设 verify: false 跳过证书校验；完整性由 sha256 强校验保证
#   （与 FreeBSD ports distinfo 逐字节一致，SIZE 22160）。

sources:
  url:
    - "https://distcache.FreeBSD.org/ports-distfiles/playumidi-0.8.3.tar.gz"
    - "https://distcache.eu.FreeBSD.org/ports-distfiles/playumidi-0.8.3.tar.gz"
    - "https://distcache.us-east.FreeBSD.org/ports-distfiles/playumidi-0.8.3.tar.gz"
    - "https://distcache.us-west.FreeBSD.org/ports-distfiles/playumidi-0.8.3.tar.gz"
  sha256: "518e6cefc77d057ab7a802041c4d250a208f93d1bd054fed42a76d6a387dfb1e"
  verify: false

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: >-
      顶层 Makefile：BSD make 条件语法（.ifdef/.else/.endif）改为 GNU make 语法；
      新增 prefix/DESTDIR 变量；install 目标改用 mkdir + cp + chmod（OHOS 无 install(1)）。
      另将 WITH_* 宏传递方式由 BSD make 的 -DWITH_X 改为 GNU make 的 WITH_X=1。
    patch_type: "portability"
  - patch_file: "patches/0002-src-Makefile.patch"
    patch_description: >-
      src/Makefile：BSD make 条件语法（.ifdef/.else/.endif）改为 GNU make 语法
      （OHOS 构建环境仅有 GNU make 4.4.1）。
    patch_type: "portability"
  - patch_file: "patches/0003-src-midi_device.c.patch"
    patch_description: >-
      midi_device.c：dirent 的 d_namlen 成员为 BSD/FreeBSD 专有，Linux/OHOS(musl)
      未提供；改用可移植的 strlen(d_name)，语义等价（d_name 以 NUL 结尾），未引入平台宏。
    patch_type: "portability"
