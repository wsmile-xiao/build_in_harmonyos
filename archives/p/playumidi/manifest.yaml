# 软件级 manifest — playumidi
# 文件位置: archives/p/playumidi/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: playumidi
display: "playumidi"
description: "FreeBSD RAW-MIDI(USB-MIDI) 设备(/dev/umidi*.*)的简易 MIDI 文件播放器，支持 SMF format 0/1"
category: utility
homepage: "https://osdn.net/projects/playumidi/"
license: BSD-2-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 使用 BSD make 条件语法（.ifdef/.else/.endif），OHOS 只有 GNU make 4.4.1，需补丁改写并补 prefix/DESTDIR"
    - "OHOS 无 install(1)，install 目标改用 mkdir + cp + chmod"
    - "dirent.d_namlen 为 BSD/FreeBSD 专有成员，OHOS(musl) 无此字段，改用 strlen(d_name)"
    - "上游原站 OSDN 已于 2024 年停服（域名 DNS 不再解析），源码取自 FreeBSD 官方 distcache 缓存的原始 tarball（sha256 与 ports distinfo 一致）"
    - "运行期依赖 FreeBSD umidi(4)/uaudio 的 /dev/umidi*.*；OHOS 无此设备节点，默认调用报 Can't Open RawMidi Device；MIDI 解析链可用 -0 <dev>（如 /dev/null）端到端验证"
  common_dependencies: []

versions:
  "0.8.3":
    status: built
    build_date: "2026-10-01"
    upstream_version: "0.8.3"
    notes: "首次适配；无强制第三方依赖（可选 libiconv 编码转换特性默认关闭）"
