# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: projectm/3.1.12
homepage: "https://github.com/projectM-visualizer/projectm"

# 上游测试命令 — projectM TestRunner（src/libprojectM/TestRunner）+ presets 数据
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - src/libprojectM/TestRunner.cpp（单元测试入口）+ presets/tests/（.milk
#   预设测试数据，50 个相关文件）
# - 实测受阻记录：3.1.12 为 autotools 构建（无预生成 configure，需
#   autogen.sh → autoreconf 生成），**本机 automake 安装残缺**
#   （Automake/Config.pm 缺失——aclocal 无法运行，autoreconf 失败，
#   全系统无完整 automake、sdist 无 configure）——构建阻塞，上游测试
#   无法实测运行，如实记录不臆造（CI 环境若 automake 完整则可构建实测）
upstream_tests:
  - file: src/libprojectM/
    source: projectm-3.1.12/src/libprojectM/
    description: "上游 TestRunner 单元测试（.milk 预设数据 + TestRunner；autotools 构建受阻于 automake 残缺，如实记录）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_projectm.cpp
    description: "消费者测试：真实 API（R34）——projectM 实例 + PCM 渲染 + 预设选择"
    command: "clang++ test_projectm.cpp -std=c++17 -I<include> -L<lib> -lprojectM -o test_projectm_cpp && ./test_projectm_cpp"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
