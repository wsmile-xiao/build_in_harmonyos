# 软件级 manifest（AI 元数据，CI 不读）
software: pal
display: "pal"
description: "文本模式日历与日程管理器，按月显示公历并列出节日、生日、纪念日等事件"
category: utility
homepage: "https://palcal.sourceforge.net"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游是裸 Makefile（顶层 + src/Makefile + src/Makefile.defs），没有 configure/CMake/meson"
    - "Makefile.defs 全部用普通 =，make 忽略环境变量 CFLAGS/LDFLAGS ⇒ Conan 的旗标必须用命令行整体表达式注入（本包走 OPT=）"
    - "ncurses 制品只提供宽字符库（有 libncursesw.a，无 libncurses.a）⇒ 写死的 -lncurses 链不上；gettext/textdomain 另需 glib 包内的 -lintl"
    - "manage.c 用 readline 私有宏 Function ⇒ clang 报错，改公开类型 rl_hook_func_t *"
    - "OHOS 上被 strip 过的 ELF 不可执行（execve EPERM / rc 126）⇒ 别 strip（STRIP=true），不要去走重签"
    - "设备没有 install 命令且非 root，上游 make install 还带交互式 rm -ri 与 msgfmt/gzip 依赖 ⇒ package() 自己拷"
    - "-DPREFIX 编进二进制，数据回落到 PREFIX/share/pal/*.pal ⇒ prefix 与交付安装路径绑定，包不可跨机重定位"
  common_dependencies:
    - glib
    - readline
    - ncurses

versions:
  "0.4.3":
    status: built
    build_date: "2026-09-26"
