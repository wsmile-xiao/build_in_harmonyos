package: pal/0.4.3
homepage: https://palcal.sourceforge.net

# 上游没有测试套件：src/Makefile 的目标只有
# info / debug / install* / uninstall* / pot / clean* / dist / srpm / splint / libpal.a。
# 一手证据（真机）：
#   $ make -C src check
#   make: *** No rule to make target 'check'.  Stop.
# 也没有 add_test / ctest / meson test / automake TESTS（裸 Makefile，无构建系统生成器）。
upstream_check_command: "none -- 'make -C src check' => \"No rule to make target 'check'\""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: >-
      5 consumer assertions executed against the packaged ELF: --version, --help,
      -h banner, a rendered month grid for "-d 09/2026", and the empty-HOME
      fallback that must read the shipped share/pal/*.pal through the compiled-in
      PREFIX (verbose log shows "Done reading data (N events, 4 files)").
    command: "bash test.sh"

# 五维账本（上游无测试 ⇒ 静态总数 0，分母不缩不造）
upstream_tests_static_total: 0
upstream_tests_executable: 0
upstream_tests_passed: 0
upstream_tests_skipped: 0
upstream_tests_failed: 0

assertion_count: 5
