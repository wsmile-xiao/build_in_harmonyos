# pal 0.4.3 -- 源码与补丁清单（本包的唯一真相源）
#
# 货源是 upstream 的 canonical SourceForge 发布位（⛔ 不用 Debian pool 址、
# 不用镜像前缀）。sha256 为一手实测值，与 Debian 池里记录的 upstream 值逐字相等。
sources:
  url: "https://downloads.sourceforge.net/project/palcal/pal/0.4.3/pal-0.4.3.tgz"
  sha256: "ce470cb7be76522ff58cd0325ad7817b6cc2132a5e0cea55de8c9eb63b54551c"

patches:
  - patch_file: "patches/0001-Makefile-pkg-config-deps-and-strip-override.patch"
    patch_description: >-
      src/Makefile: resolve glib/readline cflags+libs through pkg-config and add
      -lintl (the ncurses package only ships libncursesw.a, so the hard-coded
      -lncurses never links, and gettext/textdomain live in glib's libintl);
      src/Makefile.defs: add a STRIP ?= style variable so the unconditional
      `strip $(NAME)` right after linking can be turned off -- a stripped ELF is
      not executable on OpenHarmony (execve -> EPERM, rc 126).
    patch_type: "portability"
  - patch_file: "patches/0002-manage.c-readline-public-hook-type.patch"
    patch_description: >-
      src/manage.c: use the public rl_hook_func_t * instead of readline's private
      `Function` macro for rl_pre_input_hook; clang rejects the macro use here
      ("expected expression" / "use of undeclared identifier").
    patch_type: "portability"
