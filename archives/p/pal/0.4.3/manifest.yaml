# 版本级 manifest（AI 元数据，CI 不读）
# 遵循 ARCHIVE-SPEC v2.0；占位串已全部换成本机真机实测值。
version: "0.4.3"
software: pal

# 编译状态：由 `ohc-run.py finish pal 0.4.3` 落值（EXIT_REASON=finish_success，
# 归档报告打印 "状态: built"），非手工预标。
status: built
build_date: "2026-09-26"
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # upstream canonical 发布位（⛔ Debian pool 址 / ⛔ 镜像前缀 / ⛔ file://）
  url: "https://downloads.sourceforge.net/project/palcal/pal/0.4.3/pal-0.4.3.tgz"
  # 一手实测：130865 B，与 Debian 池记录的 upstream 值逐字相等
  sha256: "ce470cb7be76522ff58cd0325ad7817b6cc2132a5e0cea55de8c9eb63b54551c"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  # 裸 Makefile，无 configure/cmake/meson；这些是 make 的命令行变量赋值
  # （Makefile.defs 全用普通 = ⇒ 环境变量 CFLAGS/LDFLAGS 被 make 忽略，
  #   只能整体覆盖；详见 notes.md 适配点 1）
  configure_options:
    - "-C src -j1"
    - "CC=/data/service/hnp/bin/clang"      # 取自 tools.build:compiler_executables
    - "STRIP=true"                          # OHOS 上 strip 过的 ELF 不可执行
    - "OPT=\"-O2 -Wall\""                    # CFLAGS 的唯一来源
    - "prefix=<package_folder>"              # 编进二进制（-DPREFIX），与交付安装路径绑定
  # 精确版本钉（preflight_check.sh pal/0.4.3 => 四个全 [OK] 已发布）
  dependencies:
    - glib/2.84.0.1
    - readline/8.3
    - ncurses/6.6
    - pkgconf/3.0.5    # tool_requires：Makefile 用反引号跑 pkg-config 解析旗标
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息（与 patches/ 下 000*.patch 数量一致）
# ============================================================

patches_applied:
  - "0001-Makefile-pkg-config-deps-and-strip-override.patch"
  - "0002-manage.c-readline-public-hook-type.patch"

# ============================================================
# 测试账本（五维 + 消费者用例；数字全部来自真机执行日志）
# ============================================================

test_results:
  type: consumer
  total: 5
  passed: 5
  failed: 0
  skipped: 0
  note: >-
    上游无成体系测试面（src/Makefile 无 check/test 目标，静态合计 0，分母不缩不造）。
    5 条为消费者用例，全部在 conan create 的 test_package 阶段真实执行：
    HMBS_TEST_PACKAGE_RESULT={"executed":true,"passed":true,"command":"bash test.sh","discovered":5,"passedCount":5}
    见 reports/conan-create.log 与 reports/w3-local-ci.log。

# 上游测试五维账本（全 0 是实测结论，不是没数）
upstream_test_ledger:
  static_total: 0        # grep 上游 Makefile 无 TESTS/add_test/ctest 目标
  executable: 0          # make -C src check => "No rule to make target 'check'. Stop."
  passed: 0
  skipped: 0
  failed: 0
  evidence: "reports/w3-local-ci.log (L1_RESULT=pass: test_package executed)"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS 上被 strip 过的 ELF 不可执行（execve 报 Operation not permitted / rc 126）；上游链完即 strip 时必须让它别 strip（STRIP=true），处方优先序在事后重签之前"
  - "裸 Makefile 的 Makefile.defs 用普通 = 赋值时，make 忽略环境变量 CFLAGS/LDFLAGS；Conan 旗标只能用命令行整体表达式注入（本包注入点是 OPT，因为 CFLAGS 的定义就是 OPT 这一个变量）"
  - "Conan ncurses 制品只提供宽字符库（有 libncursesw.a、无 libncurses.a）⇒ 上游写死的 -lncurses 永远链不上；改由 pkg-config 解析，另需 glib 包内的 -lintl 提供 gettext/textdomain"
  - "readline 的私有宏 Function 在 clang 下不可用，rl_pre_input_hook 要换公开类型 rl_hook_func_t *"
  - "pal 的 ~/.pal/pal.conf 引导回落顺序是 /etc/pal.conf ⇒ PREFIX/share/pal/pal.conf（src/input.c:570-582）。上游 install-share 把模板装到 DESTDIR/etc（与 prefix 完全无关的路径），在 conan 包/非 root 场景不可达 ⇒ 打包时若不把 pal.conf 同时放进 PREFIX/share/pal/，运行即报 'ERROR: This indicates an improper installation.' 且一条日历数据都不读"
  - "设备没有 install 命令且非 root，上游 make install 还带交互式 rm -ri 与 msgfmt/gzip 依赖 ⇒ package() 自己拷交付物"
  - "Conan 2.29 不接受 self.conf.get('tools.build:compiler_executables:c')（报 does not exist in configuration list），必须取 dict 再索引；仓内 templates/conanfile-makefile.py.tmpl 用的是坏形式"
  - "动态链接 glib 的可执行包：conanrun 环境内正常执行，但按绝对路径裸 exec 会 'Error loading shared library libglib-2.0.so.0'，且 OHOS loader 忽略 DT_RUNPATH ⇒ 本地 CI 的 L2 探针记 skip（见 reports/w3-local-ci.log）"

knowledge_ref: []
