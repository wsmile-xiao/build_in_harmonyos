# 版本级 manifest
# 文件位置: archives/p/pd-libdir/1.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.11"

# 软件名
software: "pd-libdir"

# 编译状态
# published | built | failed | archived
# built = conan verify/本地 conan create 通过，尚未 conan upload 到制品仓
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-01"

# 构建系统
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 官方源码池，R39）
  url: "https://deb.debian.org/debian/pool/main/p/pd-libdir/pd-libdir_1.11.orig.tar.gz"

  # 源码校验和
  sha256: "ee32bd5f4fa4a21504d51a9fb72634084a40615a0b83942f396f417deb1666f5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 构建选项（上游 Makefile 未做任何平台补丁，仅命令行覆盖变量）
  configure_options:
    - 'CC=<OHOS clang，来自 tools.build:compiler_executables>'
    - 'arch.c.flags=  # 清空 uname -m 在 x86_64 worker 上注入的 -march=core2 -msse*'
    - 'PDINCLUDEDIR=<puredata 包>/include/pd'
    - 'PDLIBDIR=/lib'
    - 'lib.version=1.11'
    - 'LDFLAGS=-Wl,-soname,libdir.pd_linux'

  # 编译依赖列表（格式: name/version）
  dependencies:
    - puredata/0.54.1

  # 编译器
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-ship-help-patch.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Pd 的 API 没有可链接库：Pd 以 -rdynamic 链接，插件的 Pd 符号在 dlopen 时从 Pd 进程映像解析；测试 Pd 插件需自带最小 Pd 运行时 shim 并用 -rdynamic 导出符号"
  - "pd-lib-builder 按 uname 全串匹配判定平台，Linux CI worker 自动走 Linux 分支产出 pd_linux，无需平台补丁；但其 arch.c.flags 由 uname -m 推导，x86_64 worker 会注入 -march=core2 -msse*，交叉编译 aarch64 必须清空"
  - "puredata/0.54.1 是 application 包，cpp_info.includedirs 为空：下游需自行从依赖 package_folder 解析 include/pd，改 application 包的配方须单独 PR"
  - "Pd 的 gensym 按名字驻留，复用同一槽位的 shim 会覆盖插件已存入 atom 的 symbol；sys_trytoopenone 的 dirresult 是找到文件的目录而非传入的搜索条目（见 Pd s_path.c:265）"
  - "puredata 制品的 bin/pd 在部分 OHOS 运行环境报 __fd_chk: symbol not found（musl 版本不匹配），端到端 pd -lib 验证受阻，属环境侧限制"
  - "pd-lib-builder 的 PDLIBDIR 是字符串直接拼接（installpath=$(DESTDIR)$(PDLIBDIR)/$(lib.name)），必须写成 /lib 而非 lib"
