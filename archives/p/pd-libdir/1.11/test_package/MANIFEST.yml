# Test manifest for pd-libdir 1.11.
package: pd-libdir/1.11
homepage: "https://puredata.info/docs/developer/Libdir"
upstream_tarball: "https://deb.debian.org/debian/pool/main/p/pd-libdir/pd-libdir_1.11.orig.tar.gz"

# ── Upstream test inventory (pd-libdir 1.11) ─────────────────────────────────
# Counting unit: test CASES. pd-libdir 1.11 ships **no tests at all**, so the
# inventory is empty. Evidence (complete file list of the upstream tarball, 8
# files, `tar tzf`):
#   libdir-1.11/LICENSE.txt
#   libdir-1.11/Makefile
#   libdir-1.11/Makefile.pdlibbuilder
#   libdir-1.11/README.txt
#   libdir-1.11/TODO.txt
#   libdir-1.11/libdir-help.pd
#   libdir-1.11/libdir-meta.pd
#   libdir-1.11/libdir.c
# There is no tests/ or test/ directory, no assertion-bearing source, and
# neither Makefile nor Makefile.pdlibbuilder (pd-lib-builder 0.4.4, the
# generator libdir is derived from) defines a `check:` target — grep for
# '^check' over both files matches nothing. The library is a single loader
# source file (libdir.c, 194 lines) whose entire behaviour is registered into
# Pd at load time, so upstream has nothing to assert without a running Pd.
upstream_test_in_build: false
upstream_test_count: 0
upstream_passed: 0
upstream_failed: 0
upstream_run: 0
upstream_not_run: 0
upstream_test_sources: []
upstream_no_test_evidence: >-
  Upstream tarball contains 8 files (LICENSE.txt, Makefile,
  Makefile.pdlibbuilder, README.txt, TODO.txt, libdir-help.pd, libdir-meta.pd,
  libdir.c) and no test directory; neither the library Makefile nor
  pd-lib-builder 0.4.4's Makefile.pdlibbuilder defines a check: target.
  Upstream CI (pd-lib-builder) does not run any test for this library either.

# ── HarmonyOS-specific test added by this adaptation ────────────────────────
# There is no upstream test to port, so the behaviour is pinned by a consumer
# test that drives the packaged plugin the same way Pd does. It is specific to
# this adaptation: it embeds a minimal Pure Data runtime shim so the delivered
# OHOS aarch64 shared object can be exercised on the build host without a Pd
# process, which is not possible for the upstream/Linux artifact.
test_files:
  - path: "test_package/pd_libdir_test.c"
    test_type: "R34"
    harmonyos_specific: true
    assertion_count: 22
    description: >-
      Consumer program that dlopen()s the packaged libdir.pd_linux with
      RTLD_NOW and drives its real code against a minimal Pure Data runtime
      shim (the 15 Pd symbols the plugin imports, which Pd itself supplies
      from its -rdynamic image): asserts the packaged data files ship
      alongside the plugin, that dlsym resolves setup/libdir_setup, that
      setup() registers exactly one loader and logs its "libdir loader" and
      "compiled against Pd version" banners, that the loader finds a real
      <lib>/<lib>-meta.pd directory and asks Pd to "add-to-path" it encoded as
      "+<library-dir>", that a library without a meta file is rejected without
      touching the global path, and that a relative directory is filtered out
      by sys_isabsolutepath().

test_package_test_count: 1
consumer_assertion_count: 22
assertion_count: 22
