# test_package/MANIFEST.yml
# pd-osc 0.3.1 - upstream test declaration.

package: pd-osc/0.3.1
homepage: "https://github.com/pd-externals/osc"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships only Pd help patches (packOSC-help.pd, unpackOSC-help.pd,
  routeOSC-help.pd, pipelist-help.pd, packOSCstream-help.pd,
  unpackOSCstream-help.pd) plus the abstract patches packOSCstream.pd /
  unpackOSCstream.pd and osc-meta.pd.  There is no make check, no ctest and
  no automated test harness; the objects can only be exercised by loading them
  into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_osc.sh
    description: "headless OHOS pd loads the installed osc externals and round-trips /ping 1 2 through [packOSC]/[unpackOSC] plus one [routeOSC] check"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_osc.pd sh test_pd_osc.sh"

test_files:
  - path: "test_package/test_pd_osc.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_osc.sh"
    test_type: "R34"
    assertion_count: 4

test_package_test_count: 1
consumer_assertion_count: 4
upstream_test_cases: 0
assertion_count: 4