software: pd-osc
display: "pd-osc"
description: "Pure Data 的 OpenSoundControl 外部对象集合 osc（packOSC/unpackOSC/routeOSC/pipelist）"
category: audio
homepage: "https://github.com/pd-externals/osc"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "制品仓 puredata/0.54.1 是 application，不装 Pd API 头 m_pd.h → 配方 source() 额外拉取 pure-data 0.54-1 源码树，PDINCLUDEDIR 指向其 src"
    - "上游 pd-lib-builder 依据 $(CC) -dumpmachine 选中 Linux 分支与 pd_linux 扩展名；CC 由 compiler_executables 显式传入"
    - "上游 pd-lib-builder 会把裸 class.sources 拆成每个源文件一个 <basename>.class.sources → 共 4 个 .pd_linux（packOSC/unpackOSC/routeOSC/pipelist），lib.name=osc 不产生合并的 osc.pd_linux 库 blob，四类均可按类名自动加载"
    - "消费者测试用真机 OHOS pd 无头加载安装后的外部对象，把 /ping 1 2 走一遍 [packOSC]→[unpackOSC] 往返并做一次 [routeOSC] 路由"
  common_dependencies: []

versions:
  - version: "0.3.1"
    status: built
    build_date: "2026-10-05"