software: perl-mixin-event-dispatch
version: "2.000"
status: published
build_date: "2026-06-18"
build_system: perl

# ============================================================
# 源码信息
# ============================================================
source:
  url: "https://cpan.metacpan.org/authors/id/T/TE/TEAM/Mixin-Event-Dispatch-2.000.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: perl
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX"
  dependencies:
    - "List::UtilsBy/0.12"
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "纯 Perl 模块使用 perl Makefile.PL 构建，无 configure/make 复杂流程"
  - "运行时依赖 List::UtilsBy 必须包含在打包产物中（初版遗漏导致运行时失败）"
  - "纯 Perl 模块不受 SELinux HMDFS 限制（与 perl-dbd-pg XS 模块不同），用户可直接使用"
  - "Perl 模块测试套件中 Test::CheckDeps/Test::Refcount/Test::Memory::Cycle 为可选测试基础设施，不影响运行时功能"
