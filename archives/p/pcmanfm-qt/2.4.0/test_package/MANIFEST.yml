# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: pcmanfm-qt/2.4.0
homepage: "https://github.com/lxde/pcmanfm-qt"

# 上游测试命令
upstream_check_command: ""

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（pcmanfm-qt 为 GUI 文件管理器，上游无自动化测试套件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角)
test_package_tests:
  - file: test.c
    description: "编译 smoke-test 二进制（CI L0c 门禁要求的可编译测试源），验证打包产物 bin/pcmanfm-qt 存在，并在 QT_QPA_PLATFORM=offscreen 下执行 --version 与 --help 均正常退出（退出码 0）"
    command: "conan create 内置 test_package：cmake 编译 test.c → 运行 test_pcmanfm_qt"

# 测试断言总数（应用型包：3 项断言 = 可执行文件存在 + --version 退出码 0 + --help 退出码 0）
assertion_count: 3