# 软件级 manifest — podiff
# 遵循 ARCHIVE-SPEC v2.0

software: podiff
display: "podiff"
description: "GNU gettext PO 文件智能比对工具 — 剔除注释/排序/规范化后仅比对译文差异，可用作 git 外部 diff 驱动"
category: utility
homepage: "https://puszcza.gnu.org.ua/software/podiff/"
license: GPL-3.0-or-later
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 C 平铺 Makefile 项目（无 configure），y.tab.c/lex.yy.c 随 tarball 预生成，无需 yacc/flex"
    - "上游临时目录硬编码 /tmp（OHOS 只读，E002）：比对模式 mkstemp 失败后 SIGABRT，适配为优先读 TMPDIR 环境变量"
    - "上游 1.4 存在 ignore_rc 未初始化 UB：命令行比对模式退出码恒 0，文档语义 1=有差异 失效，需初始化修复"
    - "上游仅短选项 -v/-h，无 GNU 长选项；为过 L2 冒烟门禁补 --version/--help（getopt_long，musl 支持）"
    - "Makefile 硬编码 cc 且 CFLAGS=-ggdb 覆盖环境：改为 CC ?= cc / CFLAGS ?= -ggdb + $(CC) 规则，让 Conan conanbuild 环境注入工具链（R33）"
    - "运行时依赖系统 diff（system() 调用），设备在 /data/service/hnp/bin/diff，CI profile buildenv PATH 已覆盖"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.4":
    status: built
    build_date: "2026-09-03"
