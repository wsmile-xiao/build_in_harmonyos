# test_package/MANIFEST.yml — podiff 1.4
# CI L0e requires this file to exist.

package: podiff/1.4
homepage: "https://puszcza.gnu.org.ua/software/podiff/"

# podiff 1.4 ships no upstream test suite: the tarball has no tests/ directory
# and the flat Makefile has no `check` target (verified by tarball inspection:
# `tar tzf podiff-1.4.tar.gz` lists only sources + podiff.1 + docs, and
# `make check` fails with "No rule to make target 'check'").
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective, R34: invoke the packaged binary)
test_package_tests:
  - file: test.sh
    description: "Invokes packaged podiff: --version smoke; identical PO pair => exit 0; differing translation pair => exit 1 with diff output; invalid PO => exit 3 (podiff.l yyparse exit(3)); invalid option => exit 2 (man RETURN VALUE)"
    command: "bash test.sh <path-to-podiff>"

# --version grep + rc=0 + rc=1 + diff output grep + rc=3 + rc=2
assertion_count: 6
