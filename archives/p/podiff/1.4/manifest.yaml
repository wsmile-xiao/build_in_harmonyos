# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "OHOS /tmp 只读：podiff 比对模式 mkstemp(/tmp/podiff.XXXXXX) 必然失败并 SIGABRT；适配为优先读 TMPDIR 环境变量（GNU 惯例）（ref: E002; 新模式草稿 E999，与 E002/E482 区别在于上游根本不读 TMPDIR、set-env-var 无效）"
- "上游 main.c 的 int ignore_rc 未初始化（UB）：命令行比对模式退出码恒为 0，文档语义“1=有差异”失效；初始化为 0 修复（ref: draft E999 验证命令，退出码契约另见 E310）"
- "CLI 工具建议补 GNU 长选项 --version/--help（getopt_long），满足 L2 冒烟测试惯例（ref: E503，libubox jshn 先例）"
- "本机 conan 2.29.1 手动执行 conan create/test 时 profile 必须用绝对路径；相对路径 -pr:h=ci/conan/... 会导致 settings.os.version 解析失败（ref: 本机环境怪癖，暂无图谱条目，复现与规避详见 notes.md）"

