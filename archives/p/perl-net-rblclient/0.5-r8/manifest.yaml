software: perl-net-rblclient
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.5-r8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.5-r8"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/A/AB/ABLUM/Net-RBLClient-0.5.tar.gz"

  # 源码校验和
  sha256: "9d2626351f8577f05fc8b5cb1d3d7bd9cdf3e7efbaec2207ed38d8e5c8c82153"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=/"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "perl-net-dns/1.55"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-spamalyze-syntax-error.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块编译流程: perl Makefile.PL INSTALL_BASE=/ → make → make install DESTDIR"
  - "INSTALL_BASE=/ 使安装路径为相对路径 (lib/, bin/)，DESTDIR 在 package() 中预置 Conan 包目录"
  - "spamalyze 脚本原始源码有语法错误：foreach ... qw() 缺少括号，位于 return 后的死代码中"
  - "conan-verify L2 smoke test 对 Perl 脚本（非 ELF 二进制）是误报：脚本不支持 --version/--help"
  - "纯 Perl 模块不受 SELinux HMDFS 限制（对比 perl-dbd-pg 的 XS 模块限制）"
  - "PERL5LIB 需追加而非替换，否则丢失系统已安装的模块路径（如 Net::DNS）"
  - "package_info() 中通过 runenv_info.append_path('PERL5LIB', ...) 设置消费者环境变量"
  - "纯 Perl 模块无 ELF 产物，G3/L4 自动通过"
