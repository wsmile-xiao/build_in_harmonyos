# test_package/MANIFEST.yml — pari-seadata/20090618
# CI L0e 要求此文件存在（上游测试声明）。

package: pari-seadata/20090618
homepage: "https://pari.math.u-bordeaux.fr/packages.html#seadata"

# ── 上游测试套件：无（实证） ──────────────────────────────────────────
# pari-seadata 是纯数据包（Debian Architecture: all）。上游没有任何自动化测试：
#   1) 官方源 seadata.tgz 内 53 个条目全为 data/seadata/sea<p> + README，
#      `grep -icE 'Makefile|configure|CMake|test|\.c$|\.h$|\.gp$|\.py$'` == 0；
#   2) Debian debian/rules 的 build 目标仅 `touch build-stamp`，install 仅
#      `dh_install seadata /usr/share/pari` + `gzip`，**无 check / test 目标**；
#   3) README 只说明数据用途（“for use with ellsea”）。
# 真实的功能“测试入口”是消费方 PARI/GP：gp -q 里 ellsea()/ellap() 读取本目录的
# sea<p> 数据。该入口属于 pari 包的验证职责，不在本数据包内运行。
upstream_check_command: ""          # 无上游自动化测试可运行
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests_present: false
upstream_test_count: 0

# ── test_package 消费者测试（R34：对真实打包内容做校验，非空壳）──────────
# 注意：test_package 不能替代上游测试统计；此处上游统计如实记为 0，
#       并附“无自动化测试”的证据（见上）。
test_package_tests:
  - file: test_verify.py
    description: >-
      校验 <pkg>/res/pari/seadata：README 存在、51 个 sea<p> 数据文件齐全、
      每个为 GP 文本向量格式（首字符 '['）且非空、拼接 sha256 ==
      c055c577d25f7f0e1a9cf90d699df846b4ecde5b7cb64debae1dc2f50f1aa738
    command: "python3 test_verify.py <seadata_dir>"

# 断言总数：上游 0 + test_package 6（目录存在/README/文件数/逐文件GP格式/逐文件非空/拼接哈希）= 6
assertion_count: 6
