software: perl-module-install-authortests
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.002/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.002"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RJ/RJBS/Module-Install-AuthorTests-0.002.tar.gz"

  # 源码校验和
  sha256: "4025722de6357edf53c28501b00e7da92cd2f9fc611ba0753761a0e1dff32d88"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: Makefile.PL

  # 配置选项列表
  configure_options:
    - "INSTALL_BASE=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-module-install/1.21"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在 OpenHarmony 上无需特殊适配，Makefile.PL 可直接运行"
  - "Perl 5.42.0 (OpenHarmony aarch64) 完全兼容 Module::Install::AuthorTests 0.002"
  - "纯 Perl 模块不涉及 XS/ELF 签名问题，可直接从 HMDFS 加载"
  - "author_tests 功能在鸿蒙平台正常工作，标准测试和作者测试均通过"
  - "打包使用 INSTALL_BASE 路径结构，与 cmd-pkgs 公共安装脚本兼容"
