package: pari-seadata-big/20170418
homepage: "https://pari.math.u-bordeaux.fr/packages.html#seadata"

upstream_check_command: "gp: ellmodulareqn(503)"
upstream_test_in_build: false
upstream_test_command: "gp ellmodulareqn(503)"
upstream_tests:
  counting_basis: "Upstream ships no build system and no test suite: the archive holds 46 members (1 directory + 44 sea<p>.gz + README.big) with zero configure/Makefile/*.c/tests/ entries. The data is exercised by the consumer PARI/GP interpreter (ellmodulareqn/ellcard)."
  total: 1
  executed: 0
  passed: 0
  not_run_reason: "The PARI/GP interpreter (gp) is not a test_package dependency (it would pull the whole PARI stack and needs the base seadata sea0 index); the data package has no API, so the consumer test validates data completeness, payload identity and gzip stream integrity instead (R34 data-package exemption)"

test_package_tests:
  - file: verify_seadata_big.py
    scenario: structural
    description: "The 44 data files (sea503.gz..sea797.gz) plus README.big exist in data/seadata (source) / share/pari/seadata holds exactly the 44 data files (package), and none is empty"
    command: "python3 verify_seadata_big.py --package-root <package-folder>"
  - file: verify_seadata_big.py
    scenario: payload-identity
    description: "Every data file matches the pinned SHA-256 of the official 20170418 release payload"
    command: "python3 verify_seadata_big.py --package-root <package-folder>"
  - file: verify_seadata_big.py
    scenario: stream-integrity
    description: "Every data file decompresses completely with a valid gzip CRC/trailer"
    command: "python3 verify_seadata_big.py --package-root <package-folder>"
  - file: verify_seadata_big.py
    scenario: content-sanity
    description: "sea503.gz decompresses to the known p=503 Atkin polynomial record; README.big documents the 500 < p < 800 dataset used by ellcard"
    command: "python3 verify_seadata_big.py --package-root <package-folder>"

assertion_count: 7
