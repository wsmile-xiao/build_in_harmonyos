software: pari-seadata-big
display: "PARI/GP seadata-big (Atkin modular polynomials)"
description: "PARI/GP 大阶 Atkin 模多项式数据包：素数阶 500 < p < 800 的 44 个 sea<p>.gz，供 ellcard/ellmodulareqn 使用"
category: data
homepage: "https://pari.math.u-bordeaux.fr/packages.html#seadata"
license: GPL-2.0-or-later
build_system: data

ohos_adaptation:
  key_points:
    - "纯数据包：归档解包即数据文件，无编译无链接，noarch 打包（package_id cleared）"
    - "数据装到 share/pari/seadata/，PARI_SEADATA_BIG_DIR 环境变量导出数据目录"
    - "98.7 MB 单源归档：source() 用精确字节区间并发下载（复用已合入的 pari-seadate-big 手法），避免 CI conan create 单连接下载超时"
    - "R34 数据包豁免：无 API 可调用，test_package 以数据完整性验证（文件集 + pin sha256 + gzip 全量解压）等效替代"
    - "消费方需同时提供基础 seadata 的 sea0（pari-seadata/seadata-small），big 为增补数据"
  common_dependencies: []

versions:
  "20170418":
    status: built
    build_date: "2026-09-21"
    conan_ref: "pari-seadata-big/20170418"
    notes: "noarch 数据包；conan create + test_package 7/7 数据完整性断言通过；官方 CI 提供最终 OHOS 验证"
