software: prometheus-postgres-exporter
display: "Prometheus PostgreSQL Exporter"
description: "Prometheus exporter for PostgreSQL server metrics"
category: db
homepage: "https://github.com/prometheus-community/postgres_exporter"
license: Apache-2.0

build_system: autotools

ohos_adaptation:
  key_points:
    - "Go 程序在 HarmonyOS 上需要特殊处理 linker mmap 问题"
    - "使用静态编译避免动态链接依赖"
  common_dependencies:
    - postgresql

versions:
  "0.19.1":
    status: published
    build_date: "2026-06-10"
