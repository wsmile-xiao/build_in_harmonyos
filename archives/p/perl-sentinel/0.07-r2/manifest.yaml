# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "原包使用 Build.PL/Module::Build, OHOS 上改用 ExtUtils::MakeMaker 创建 Makefile.PL"
  - "Sentinel.xs 在 lib/ 子目录, 需符号链接到根目录供 Makefile.PL 编译"
  - "参考 perl-dbd-pg 编译经验: XS 模块在 OHOS 上 .so 有 dlopen 加载限制"
  - ".so dlopen Permission denied 是 OHOS HMDFS SELinux 限制, 编译成功即可标记 built"
  - "Sentinel.pm 自动回退到 Sentinel::PP (tied scalar), get 回调正常, set 回调因 magic 丢失不工作"
  - "conanfile.py 内联生成 Makefile.PL + 符号链接 XS 文件, 避免依赖 Module::Build"

