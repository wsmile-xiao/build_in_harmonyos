software: pd-flext
display: "pd-flext"
description: "Pure Data 的 C++ 外接框架 flext（外接对象所依赖的框架库）"
category: audio
homepage: "http://grrrr.org/research/software/flext/"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "上游 autotools（orig 无 configure）与 build.sh 均不适配，改为直接编译 SRCS_FLEXT 的 24 个 .cpp，用上游 pd-flext.pc 同款选择符 -DFLEXT_SYS=2 -DFLEXT_SHARED -DFLEXT_EXPORTS"
    - "OHOS clang 同级无 ld.lld，链接器在 ohos-sdk native/llvm/bin；Conan profile buildenv 已入 PATH，全部走 conanbuild 环境"
    - "flext.h 还需 Pd 内部头 g_canvas.h/m_imp.h；puredata(application) 装了头但 includedirs=[]，故随包附带 Pd API 头"
    - "补丁 0001 修 PDGUI_DELETEKEY 宏形参错用（Pd<0.55 分支）；0002 宏保护 OHOS 缺失的 pthread_cancel"
    - "消费者测试：真机 OHOS pd 无头加载 flext 编译的外接，驱动 [flextest 100] 得 105（3/3）"
  common_dependencies: []

versions:
  - version: "0.6.4"
    status: built
    build_date: "2026-10-12"
