# 版本级 manifest
# 文件位置: archives/p/pd-flext/0.6.4/manifest.yaml

version: "0.6.4"
software: "pd-flext"
status: built
build_date: "2026-10-12"
build_system: "custom"

source:
  url: "https://mirrors.aliyun.com/debian/pool/main/p/pd-flext/pd-flext_0.6.4.orig.tar.xz"
  sha256: "b804fa5ef14d19cc0b64dc1fbf2bf4feefcad39b3190e88c1f7fc1f6f4d4d941"
  tar_format: tar.xz

build:
  system: custom
  configure_options:
    - '-DFLEXT_SYS=2 -DFLEXT_SHARED -DFLEXT_EXPORTS  # 编译期 ABI/导出选择符（同上游 pd-flext.pc）'
    - '-std=c++17 -fPIC -O2 -I<source>/pd-api/src'
    - 'clang++ -shared -Wl,-soname,libflext-pd.so.0.6'
  dependencies: []
  cc: clang

patches_applied:
  - "0001-fix-pdgui-deletekey-macro.patch"
  - "0002-ohos-no-pthread-cancel.patch"

knowledge_gained:
  - "flext 是宿主加载型 C++ 框架库：libflext-pd.so 不链接 Pd，Pd 侧符号保持 UND，由 -rdynamic 的 pd 进程在 dlopen 时绑定；OHOS clang 默认 -z now，加载即需全部就地解析"
  - "框架库与消费者之间存在编译期 ABI 变体宏：库用 -DFLEXT_EXPORTS、消费者用 -DFLEXT_SHARED，类名被 FLEXT_CLASSDEF 加后缀（flext_base_shared）；变体不匹配 → 链接期 undefined（flext_base_single）"
  - "flext.h 需要 Pd 内部头 g_canvas.h / m_imp.h，不止 m_pd.h；puredata(application) 包物理装了这些头却 includedirs=[]，需自行取用或随包附带"
  - "OHOS libc 定义 PTHREAD_CANCELED 但无 pthread_cancel：flext 0.6.4 的硬终止回退路径需宏保护"
  - "flext 0.6.4 的 PDGUI_DELETEKEY 宏在 Pd<0.55 分支误用字面量 key（应为形参），对 pure-data 0.54-1 直接编译失败"
