sources:
  url: "https://mirrors.aliyun.com/debian/pool/main/p/pd-flext/pd-flext_0.6.4.orig.tar.xz"
  sha256: "b804fa5ef14d19cc0b64dc1fbf2bf4feefcad39b3190e88c1f7fc1f6f4d4d941"
  filename: "pd-flext-0.6.4.tar.xz"

patches:
  - patch_file: "patches/0001-fix-pdgui-deletekey-macro.patch"
    patch_description: "PDGUI_DELETEKEY macro references the literal name 'key' instead of its parameter, so flext 0.6.4 fails to compile against Pd < 0.55 (pure-data 0.54-1)"
    patch_type: "portability"
  - patch_file: "patches/0002-ohos-no-pthread-cancel.patch"
    patch_description: "OHOS libc declares PTHREAD_CANCELED but has no pthread_cancel; guard the hard thread-termination path behind FLEXT_HAVE_PTHREAD_CANCEL"
    patch_type: "portability"
