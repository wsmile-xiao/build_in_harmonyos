# test_package/MANIFEST.yml
# pd-flext 0.6.4 - upstream/consumer test declaration.

package: pd-flext/0.6.4
homepage: "http://grrrr.org/research/software/flext/"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships no automated test suite: the release contains build scripts
  (build.sh/bootstrap.sh/configure.ac), the flext sources and a tutorial/
  tree of example externals. There is no `make check`/ctest target and no
  regression harness. The framework can only be exercised by building a
  flext-based external and loading it into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_flext.sh
    description: "headless OHOS pd loads a flext-built external and drives [flextest 100] with float 5"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_flext.pd FLEXT_LIBDIR=... sh test_pd_flext.sh"

test_files:
  - path: "test_package/test_flext.cpp"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_flext.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_flext.sh"
    test_type: "R34"
    assertion_count: 3

test_package_test_count: 1
consumer_assertion_count: 3
upstream_test_cases: 0
assertion_count: 3
