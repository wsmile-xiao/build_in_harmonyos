# test_package/MANIFEST.yml — perl-exporter 5.79
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-exporter/5.79
homepage: "https://metacpan.org/pod/Exporter"

# 上游测试套件：t/ 目录 4 个 .t 测试文件（prove -l t/ 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Exporter-5.79/t/*.t
    description: "4 个 .t 测试文件：本地实测 **37/37（100%）**（prove -l t/，3 个运行 + 1 个 pod 测试跳过——pod 需 Test::Pod 1.18），零失败"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Exporter + 定义导出包并 import 符号）
test_package_tests:
  - file: test_exporter.py
    description: "Loads packaged Exporter via perl -I<lib>, defines a package inheriting Exporter, and imports a symbol (greet)"
    command: "python3 test_exporter.py"

# 断言总数：1（Exporter import 校验）
assertion_count: 1
