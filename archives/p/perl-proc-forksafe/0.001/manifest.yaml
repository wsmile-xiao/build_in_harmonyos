software: perl-proc-forksafe
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.001/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.001"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"
compile_date: "2026-06-26"

# 构建系统
build_system: perl-eumm

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/skaji/perl-Proc-ForkSafe/tar.gz/refs/tags/0.001"

  # 源码校验和
  sha256: "765f9f360ae7e9f60d47aa0f182a47266b64c81a2bad85c436793e40ca4963b4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl-eumm | perl-makemaker
  system: perl-eumm

  # 配置选项列表
  configure_options:
    - "INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # 构建命令
  build_commands:
    - "perl Makefile.PL INSTALLDIRS=site"
    - "make -j1"
    - "make install DESTDIR=$TEST_PREFIX"

  # 测试命令
  test_commands:
    - "make test"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "源码来自 GitHub skaji/perl-Proc-ForkSafe tag 0.001，CPAN 上仅发布 v1.0.0"
  - "源码不含 Makefile.PL/Build.PL，原始使用 Dist::Zilla + Module::Build::Tiny"
  - "需要手动创建 Makefile PL 使用 ExtUtils::MakeMaker，在 conanfile.py build() 中动态生成"
  - "纯 Perl 模块，无外部依赖，编译安装简单"
  - "conandata.yml URL 必须使用 GitHub codeload 地址供 CI 下载，不能用本地 file:// URL"
  - "settings 应为 os+arch，纯 Perl 模块无需 compiler/build_type"
  - "conanfile.py package() 从 blib/lib 复制 .pm 到 lib/ 供 Conan G4 产物检测"
  - "test_package 需用 glob 查找 .pm 路径并设置 PERL5LIB"
  - "fork() 功能测试取决于鸿蒙环境是否支持 fork() 系统调用"
