software: perl-proc-forksafe
display: "Proc::ForkSafe"
description: "Help make objects fork safe - wrap objects to auto-reinitialize after fork()"
category: perl
homepage: "https://github.com/skaji/perl-Proc-ForkSafe"
license: perl
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无 XS/C 编译，无需静态链接配置"
    - "源码不含 Makefile.PL（使用 Dist::Zilla + Module::Build::Tiny），conanfile.py build() 中动态创建"
    - "CPAN 上仅发布 v1.0.0，0.001 版本从 GitHub tag 下载"
    - "conanfile.py package() 从 blib/lib 复制 .pm 到 lib/ 供 Conan G4 产物检测"
    - "test_package 需用 glob+subprocess 显式设置 PERL5LIB"
    - "fork() 功能测试取决于鸿蒙环境是否支持 fork() 系统调用"
    - "G0 无法识别 perl-eumm 构建系统，为已知平台限制"
  common_dependencies:
    - perl (5.42.0)

versions:
  "0.001":
    status: published
    build_date: "2026-06-26"
    conan_ref: "perl-proc-forksafe/0.001@ohpcd/stable"