# 编译中学到的知识
knowledge_gained:
  - "纯 Makefile 项目（无 configure/install target）需要添加 dummy configure 和 install target 补丁 (ref:E105)"
  - "G0 clean-verify 对 makefile 项目会尝试 ./configure，需补丁添加 configure wrapper (ref:E105)"
  - "SSL certificate issue on sourceforge requires curl -k fallback (ref:E030)"
  - "HMDFS 不能 ln -sf/cp 覆盖，需要 rm -f 再 cp (ref:E101)"
