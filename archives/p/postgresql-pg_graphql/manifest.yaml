software: postgresql-pg_graphql
display: "pg_graphql"
description: "GraphQL support for PostgreSQL — reflect GraphQL schema from SQL schema (Rust/PGRX)"
category: db
homepage: "https://github.com/supabase/pg_graphql"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "PGRX (Rust) 项目，需要 Cargo 构建工具链和 Rust 编译器"
    - "需要配置 .cargo/config.toml 以适配 OpenHarmony 目标平台"
    - "Cargo.lock 和 Cargo.toml 需补丁以使用兼容的依赖版本"
    - "pg_graphql.control 需补丁以设置正确的模块路径"
  common_dependencies:
    - postgresql
    - rust
    - pgrx

versions:
  "1.6.1":
    status: published
    build_date: "2026-06-10"