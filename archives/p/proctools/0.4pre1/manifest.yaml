# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "BSD 进程枚举后端 (kvm_openfiles/kvm_getprocs + sysctl KERN_PROC*) 在 Linux/musl 全缺失，用 /proc 完整重写：stat 解析 (strrchr ')') 定位 comm、status Uid:/Gid: 四列、cmdline NUL join"
  - "保持 API 面不变的关键：proctools.h 内做 OpenBSD 形状 kinfo_proc shim + `#define p_starttime p_starttime` 对象宏，使 getProcList 匹配主循环与 -n lastonly 分支零改动"
  - "musl constructor 不传参数 (glibc 才传 argc/argv/envp)：__progname 不能用 constructor 抓 argv[0]，必须在前端 main() 首行赋值，否则解引用寄存器垃圾值启动即崩"
  - "regexec eflags (int 型) 传 NULL 是 BSD 遗留写法，musl/clang15 -Wint-conversion 硬错误：改为传 0"
  - "OpenBSD REG_NOSPEC (字面量正则) musl 无：转义 ERE 元字符等价模拟，保持 xflag 子串匹配语义"
  - "上游 DUMPOUT/UNDUMP 宏对 32 位 int 移位最多 56 位是 UB：-O2 下 clang 读出垃圾值导致 pfind -f 回读失败，显式转 u_int64_t 修复 (dump 文件格式不变)"
  - "BSD make (bsd.prog.mk/bsd.lib.mk/bsd.subdir.mk) 重写为 GNU make：根 Makefile 全量规则 + 子目录 thin wrapper 委托，man 页 raw 安装 man1/ + .so 伴生页 share/man/proctools/ (不依赖 soelim)"
  - "沙箱环境禁止 ptrace attach (gdb 同样被拒)，pfind -result/-wait 如实报错属环境限制非代码问题"
  - "skill 框架: PYTHONPATH 设 ohos-pysubsys-fix 时会覆盖默认 pip-global，需两者合并 (冒号分隔) 否则 refresh-patch 尾部 import yaml 崩溃"
  - "track-edit scan 只识别 baseline 内编辑文件，新增源文件必须显式 track-edit add 登记，否则 refresh-patch --auto 漏掉新文件补丁"

