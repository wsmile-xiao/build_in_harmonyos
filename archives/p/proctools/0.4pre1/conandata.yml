# conandata.yml — proctools 0.4pre1
# Upstream SourceForge tarball (final release, 2003-12-07)

sources:
  url: "https://downloads.sourceforge.net/project/proctools/proctools/0.4pre1/proctools-0.4pre1.tar.gz"
  sha256: "4553b9c6eda959b12913bc39b6e048a8a66dad18f888f983697fece155ec5538"

patches:
  "0.4pre1":
    - patch_file: "patches/0001-Makefile.patch"
      patch_description: "Root Makefile: BSD bsd.subdir.mk orchestration rewritten as a GNU make top-level rule set that builds libproctools + pgrep/pkill/pfind and provides a DESTDIR/PREFIX-aware install target."
      patch_type: "portability"
    - patch_file: "patches/0002-Makefile.inc.patch"
      patch_description: "Makefile.inc: shared definitions rewritten for GNU make (CC/CFLAGS/LD rules, man page install paths man1/ + share/man/proctools/ .so companion pages)."
      patch_type: "portability"
    - patch_file: "patches/0003-pfind-Makefile.patch"
      patch_description: "pfind/Makefile: bsd.prog.mk program definition rewritten as a thin GNU make wrapper delegating to the top-level rules."
      patch_type: "portability"
    - patch_file: "patches/0004-pfind-pfind.c.patch"
      patch_description: "pfind.c: OpenBSD REG_NOSPEC (literal-string regex mode) is absent from musl — emulated with an ERE-metacharacter escaping helper behind a #if guard, preserving xflag substring-match semantics. Also fixes regexec()'s int-typed eflags argument (7 sites pass NULL, a -Wint-conversion hard error on clang15/musl; changed to 0)."
      patch_type: "portability"
    - patch_file: "patches/0005-pgrep-Makefile.patch"
      patch_description: "pgrep/Makefile: bsd.prog.mk rewritten as GNU make thin wrapper."
      patch_type: "portability"
    - patch_file: "patches/0006-pgrep-pgrep.c.patch"
      patch_description: "pgrep.c: set __progname = cmdpart(argv[0]) at the top of main() — musl does not pass argc/argv/envp to constructors (glibc-only extension), so the original constructor read a garbage register value and crashed at startup."
      patch_type: "platform"
    - patch_file: "patches/0007-pkill-Makefile.patch"
      patch_description: "pkill/Makefile: bsd.prog.mk rewritten as GNU make thin wrapper."
      patch_type: "portability"
    - patch_file: "patches/0008-pkill-pkill.c.patch"
      patch_description: "pkill.c: __progname = cmdpart(argv[0]) in main() — same musl-constructor fix as pgrep.c."
      patch_type: "platform"
    - patch_file: "patches/0009-proctools-Makefile.patch"
      patch_description: "proctools/Makefile: bsd.lib.mk static-library definition rewritten for GNU make (libproctools.a + objects list)."
      patch_type: "portability"
    - patch_file: "patches/0010-proctools-bsd_compat.c.patch"
      patch_description: "NEW FILE bsd_compat.c: BSD compatibility layer for musl — faithful vis(3) implementation (strvis, VIS_OCTAL/VIS_CSTYLE), sys_signame[65] table (1-31 standard names, 35-64 RTMIN..RTMAX matching musl), __progname definition fed by each frontend's main()."
      patch_type: "platform"
    - patch_file: "patches/0011-proctools-fmt.c.patch"
      patch_description: "fmt.c: fmt_argv gains a USE_PROCFS branch reading /proc/<pid>/cmdline itself (per-argument fmt_puts + space join, argv[0]-basename-vs-comm '(comm)' suffix) — replaces the kvm_getargv path on Linux."
      patch_type: "platform"
    - patch_file: "patches/0012-proctools-procfs.c.patch"
      patch_description: "NEW FILE procfs.c (~300 lines): /proc-based process backend replacing kvm/sysctl on Linux — readdir('/proc') numeric-dir enumeration with kvm_getprocs-equivalent raciness tolerance; /proc/<pid>/stat parsing (strrchr(')') comm location handling embedded spaces, state-token skip, ppid/pgrp/session/tty_nr/starttime with _SC_CLK_TCK conversion); /proc/<pid>/status Uid:/Gid: real/effective/saved/fs columns; /proc/<pid>/cmdline NUL-separated argv join."
      patch_type: "platform"
    - patch_file: "patches/0013-proctools-proctools.c.patch"
      patch_description: "proctools.c: getProcList gains a third USE_PROCFS collection branch (argmax from sysconf(_SC_ARG_MAX), -M corefile honestly returns EX_UNAVAILABLE since kernel cores are a kvm feature); procArgs/getProcArgs/printProcInfoNative USE_PROCFS branches; DUMPOUT/UNDUMP macros fixed for LP64 — upstream shifted a 32-bit int by up to 56 bits (UB), at -O2 clang read garbage PIDs breaking pfind -f dump readback, now cast to u_int64_t (dump format unchanged); regexec eflags NULL→0."
      patch_type: "platform"
    - patch_file: "patches/0014-proctools-proctools.h.patch"
      patch_description: "proctools.h: __linux__ auto-defines USE_PROCFS alongside the existing USE_KVM/USE_SYSCTL backends; OpenBSD-shaped kinfo_proc shim (kp_proc.p_pid/p_comm[64]/p_wmesg/p_starttime, kp_eproc.e_ppid/e_pgid/e_tdev/e_ucred.cr_gid/e_pcred.p_ruid/p_svuid) so the matching main loop is untouched; '#define p_starttime p_starttime' object-macro enables the -n lastonly branch; musl compat typedefs (caddr_t) and cmdpart() declaration."
      patch_type: "platform"
