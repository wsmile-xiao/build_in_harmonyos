# test_package/MANIFEST.yml — proctools 0.4pre1
# CI L0e requires this file to exist.

package: proctools/0.4pre1
homepage: "https://proctools.sourceforge.net/"

# proctools 0.4pre1 has no upstream test suite (2003 BSD-make package,
# no `make check` target in bsd.prog.mk/bsd.lib.mk layout)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Spawns real sleep processes and verifies pgrep/pkill/pfind end-to-end: -x/-l/-f/-n/-d/-P options, pkill default TERM + numeric -9 + -s signal-name resolution, pfind -name/-args/-uid/-gid/-kill, -dump/-f roundtrip, and -x literal matching of brace-containing patterns (REG_NOSPEC emulation)"
    command: "bash test.sh"

# Assertion count (see test.sh): 3 version banners + 16 functional assertions
assertion_count: 19
