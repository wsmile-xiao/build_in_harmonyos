# 软件级 manifest — proctools
# 遵循 ARCHIVE-SPEC v2.0

software: proctools
display: "proctools"
description: "BSD 进程工具套件 — pgrep/pkill/pfind（/proc 后端 OHOS 适配版）"
category: utility
homepage: "https://proctools.sourceforge.net/"
license: BSD-3-Clause AND BSD-4-Clause-UC
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游为 OpenBSD 原生 + Darwin 移植版（2003 年最终版 0.4pre1），进程后端 kvm/sysctl 在 Linux/musl 全缺失，用 /proc 完整重写（新文件 procfs.c）"
    - "proctools.h 提供 OpenBSD 形状 kinfo_proc shim + p_starttime 对象宏，getProcList 匹配主循环与三个前端零改动（API 面不变）"
    - "musl 无 vis(3)/sys_signame[]/__progname：bsd_compat.c 忠实实现（strvis 全语义、65 项信号名表、__progname 由前端 main() 赋值——musl constructor 不传参）"
    - "BSD make (bsd.prog.mk) 重写为 GNU make；man 页 raw+companion 安装（.so 伴生页进 share/man/proctools/），不依赖 soelim"
    - "上游 DUMPOUT/UNDUMP 32 位 int 移 56 位为 UB，-O2 下读 dump 乱码：显式转 u_int64_t（格式不变向后兼容）"
    - "pfind -result/-wait 依赖 ptrace attach，沙箱环境禁 ptrace 时如实报错（环境限制非代码问题）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.4pre1":
    status: published
    build_date: "2026-09-04"
