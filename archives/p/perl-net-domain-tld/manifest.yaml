software: perl-net-domain-tld
display: "Net::Domain::TLD"
description: "TLD (Top Level Domain) 查询模块，提供 tld_exists/tlds 函数，支持 1906 个顶级域名"
category: perl
homepage: "https://metacpan.org/dist/Net-Domain-TLD"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，使用 Makefile.PL (ExtUtils::MakeMaker) 构建"
    - "package() 需使用临时 DESTDIR + glob 查找 .pm 文件，复制到 lib/perl5/"
    - "package_info() 需设置 PERL5LIB 环境变量指向 lib/perl5/"
    - "无 C/XS 代码，不受 SELinux/HMDFS 限制"
    - "上游 bug: %tld_profile 声明为 my 而非 our，无法通过 Exporter 导出"
  common_dependencies:
    - perl/5.42.0

versions:
  "1.75-r0":
    status: published
    build_date: "2026-06-26"
    source_url: "https://cpan.metacpan.org/authors/id/A/AL/ALEXP/Net-Domain-TLD-1.75.tar.gz"
