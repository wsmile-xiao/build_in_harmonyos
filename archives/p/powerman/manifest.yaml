# 软件级 manifest — powerman
# 遵循 ARCHIVE-SPEC v2.0

software: powerman
display: "PowerMan (LLNL cluster power management)"
description: "LLNL PowerMan — HPC 集群远程电源管理：powermand 守护进程、powerman 客户端、plmpower 并行控制、libpowerman API 库；支持 baytech/icebox/cyclades/openbmc/redfish 等 60+ 设备协议"
category: system
homepage: "https://github.com/chaos/powerman"
license: "GPL-2.0-or-later"
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "GitHub tarball 无预生成 configure 且解析器只有 .l/.y 源码：build() 内 libtoolize --automake --copy + autoreconf -fi 自举（上游 autogen.sh 同款）；CI 缺 automake/libtool/flex/bison → 四件全 tool_requires（captagent 先例）"
    - "AC_INIT 用 m4_esyscmd(git describe)：release tarball（无 .git）版本为空 → autoconf 硬错误，须固定为 tag 版本号"
    - "AC_CONFIG_AUX_DIR([config])：E007 的 config.guess/config.sub 注入路径在 config/ 子目录（posh 在根目录）"
    - "CONFIG_SHELL 必须绝对路径：裸名 bash 会让 libtool 给 check 程序 wrapper 写 '#! bash' shebang，kernel 不查 PATH → bad interpreter"
    - "上游从不 NDEBUG 构建：assert 是大量局部变量的唯一消费者（device_tcp.c 的 tcp、liblsd/cbuf.c 的 l/n），conan Release 默认注入的 -DNDEBUG 会引发 -Wunused-variable/-Wunused-but-set-variable 错误 → generate() 内剥除 conanautotoolstoolchain.sh 的 NDEBUG 行（语义保真优先于扩警告豁免）"
    - "可选设备守护进程用上游官方开关禁用（--without-httppower/redfishpower/snmppower，免 libcurl/jansson/net-snmp）：核心 powermand/powerman/plmpower/libpowerman 零外部依赖；上游测试套件的 redfish 系查询断言会因此 FAIL（预期归因）"
    - "OHOS clang 15 对 telnet.h compound literal 宏报 -Wmissing-braces、字符算术报 -Wstring-plus-int 等：clang 分支 WARNING_CFLAGS 按需 -Wno-error= 豁免（只降 -Werror 提升不关诊断）"
    - "shell 脚本 shebang 全树排查 '#!/bin/bash'（heartbeat stonith 助手、测试模拟器等）：OHOS 无 /bin/bash → '#!/usr/bin/env bash'"
    - "make check 的 tap-driver.sh 必须用 /bin/sh 跑（OHOS hnp bash 复合命令 fd3 bug）；sharness 测试全量跑时长被 redfish 设备超时重试主导（单 .t 20-55 分钟）"
    - "设备脚本 %s 替换传 hostlist 压缩串（如 '[0-3]'，vpcd 用 hostlist 库解析）：自写模拟器须展开方括号区间"
    - "make 用 -j1 规避 HMDFS jobserver fifo EPERM（E074）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.4.4":
    status: built
    build_date: "2026-09-04"
