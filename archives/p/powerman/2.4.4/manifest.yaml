build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>（conan Autotools 默认）"
    - "--without-httppower --without-redfishpower --without-snmppower（上游官方开关：可选设备守护进程禁用，避免 libcurl/jansson/net-snmp 依赖；核心 powermand/powerman/plmpower/libpowerman 零外部依赖）"
    - "libtoolize --automake --copy && autoreconf -fi（build() 内自举：tarball 无 configure，上游 autogen.sh 同款）"
    - "CONFIG_SHELL=<绝对路径 bash>（裸名 bash 会让 libtool 给 check 程序 wrapper 写 '#! bash' shebang → kernel bad interpreter，t0003 教训）"
    - "生成后修正：configure umask 077→022×2（E011/E114）；config/config.guess+config.sub E007 HarmonyOS 三件套（注意 AC_CONFIG_AUX_DIR([config]) 子目录，与 posh 根目录不同）"
    - "make -j1（E074：并行构建 jobserver fifo EPERM）"
    - "generate() 内剥除 conan Release 注入的 -DNDEBUG（conanautotoolstoolchain.sh 整行删除）：上游从不 NDEBUG 构建，assert 是大量局部变量的唯一消费者（device_tcp.c 的 tcp 等），NDEBUG 下变 -Wunused-variable/-Wunused-but-set-variable 错误"
  build_requires:
    - automake/1.18
    - libtool/2.5.4
    - flex/2.6.4
    - bison/3.8.2
  dependencies: []
  cc: clang
  cxx: clang++

