# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "AC_INIT 用 m4_esyscmd(git describe) 的项目，release tarball（无 .git）下版本为空 → autoconf 硬错误（'AC_INIT: not enough arguments'）；固化为 AC_INIT([powerman], [2.4.4])（patch 0001，值与 tag 一致非发明）"
  - "OHOS musl 严格最小 include：struct timeval 需显式 <sys/time.h>（xpoll.h，glibc 靠间接 include 掩盖）；<sys/poll.h> musl 重定向并 #warning → 用 <poll.h>（xpoll.c，HAVE_POLL_H 守卫语义对齐）"
  - "OHOS clang 对 telnet.h 的 compound literal 宏报 -Wmissing-braces、vpcd.c 的字符算术报 -Wstring-plus-int 等 5 类，上游 gcc 不报 → clang 分支 WARNING_CFLAGS 追加 5 项 -Wno-error=（missing-braces/parentheses-equality/deprecated-non-prototype/string-plus-int/unused-but-set-variable，patch 0001）"
  - "shebang 陷阱（2 处，patch 0002/0005）：heartbeat/powerman stonith 脚本与 t/scripts/pm-sim.sh 均 '#!/bin/bash'，OHOS 无 /bin/bash 且 kernel 不查 PATH → bad interpreter rc=126，t0030 全挂；改 '#!/usr/bin/env bash' 后 12/12 PASS"
  - "libtool wrapper shebang 陷阱（非补丁、配方内修复）：CONFIG_SHELL=bash 裸名 → wrapper '#! bash' → t0003 全挂；CONFIG_SHELL 绝对路径（/data/service/hnp/bin/bash）→ wrapper '#! /data/.../bash' → 10/10 PASS"
  - "上游 sharness 套件 39 个 t/*.t + libcommon 2 个单测；make check 需 SHELL=/bin/sh 跑 tap-driver.sh（OHOS hnp bash 复合命令 fd3 bug）；redfish 系测试因 redfishpower 禁用而 FAIL 属预期（t0029 13F/16、t0034 查询断言、t0037-39 未跑同归因）；t0033 valgrind SKIP；t0027-redfish-httppower 不依赖被禁二进制全 PASS"
  - "powermand 无 -f 选项、默认前台运行（上游 sharness 用 'powermand -c conf &' 后台化）；%s 设备脚本替换传 hostlist 压缩串（如 '[0-3]'，vpcd 用 hostlist 库解析）——自写模拟器须展开方括号区间"
  - "E007 变体：powerman 的 AC_CONFIG_AUX_DIR([config]) 使 autoreconf 生成的 config.guess/config.sub 落在 config/ 子目录（posh 在根目录），conanfile 注入逻辑的路径要跟着变"
  - "conan Release 工具链默认给 CPPFLAGS 注入 -DNDEBUG（conanautotoolstoolchain.sh 独立 export 行），上游从不 NDEBUG 构建——assert 消费的局部变量全变 -Wunused-variable/-Werror 错误（liblsd/cbuf.c 的 l/n、powerman/device_tcp.c 的 tcp 等）；解法=generate() 后剥除该行（上游语义保真，非扩警告豁免）"
  - "上游全套件真实结果（本机探索编译树）：非 redfish 系 100% PASS（含 t0030/t0003 两个修复后的平台缺陷验证）；redfish 系 FAIL 全部归因 redfishpower 守护进程按设计禁用；详见 test_package/MANIFEST.yml"

