sources:
  # Official upstream URL only; mirrors (gh-proxy etc.) are auto-injected by
  # CI/build_and_test.sh mirror fallback (R39: recipe keeps official source).
  url: "https://github.com/chaos/powerman/archive/refs/tags/v2.4.4.tar.gz"
  sha256: "3f46cf5feecdd06e1f2de966becf9100ef8e6690d20f9fbe2431f51465e7205a"
patches:
  - patch_file: "patches/0001-configure.ac.patch"
    patch_description: "AC_INIT: m4_esyscmd(git describe) is empty in the release tarball (no .git) which is a hard autoconf error; pin the version to 2.4.4. clang branch: relax five -Werror categories that fire on OHOS musl/clang but not on upstream gcc (missing-braces: telnet.h compound-literal macros; parentheses-equality, deprecated-non-prototype, string-plus-int, unused-but-set-variable)."
    patch_type: "portability"
  - patch_file: "patches/0002-heartbeat-powerman.patch"
    patch_description: "heartbeat/powerman stonith helper: '#!/bin/bash' -> '#!/usr/bin/env bash'; OHOS has no /bin/bash (bash lives in /data/service/hnp/bin), kernel does not PATH-search shebang interpreters (fixes upstream t0030-heartbeat-stonith)."
    patch_type: "platform"
  - patch_file: "patches/0003-src-libcommon-xpoll.c.patch"
    patch_description: "xpoll.c: include <poll.h> instead of <sys/poll.h>; musl redirects sys/poll.h with a #warning and HAVE_POLL_H guard semantics match the plain path."
    patch_type: "portability"
  - patch_file: "patches/0004-src-libcommon-xpoll.h.patch"
    patch_description: "xpoll.h: add <sys/time.h>; struct timeval must be explicitly included under strict musl minimal-include policy (glibc hides the issue via indirect includes)."
    patch_type: "portability"
  - patch_file: "patches/0005-t-scripts-pm-sim.sh.patch"
    patch_description: "test helper pm-sim.sh: '#!/bin/bash' -> '#!/usr/bin/env bash' (same /bin/bash absence as 0002; fixes upstream t0030-heartbeat-stonith)."
    patch_type: "platform"
