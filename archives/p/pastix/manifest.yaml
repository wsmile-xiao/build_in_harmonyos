software: pastix
display: "PaStiX"
description: "并行稀疏直接求解器（Inria/LaBRI，supernodal，SMP 静态库组合面）"
category: library
homepage: "https://gitlab.inria.fr/solverstack/pastix"
license: LGPL-3.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS libc 的 getopt_long 会置换非选项参数：上游 -i/-d 值 token 直读 argv[optind] 不推进 optind，多参数用例段错误，需 0001 补丁显式消费值 token"
    - "上游 project() 声明 Fortran 必需：tool_requires flang-ohos/20.1.0，须全参调用 + 链接期 -L<SDK>/llvm/lib/aarch64-linux-ohos"
    - "morse Find 模块需模块模式查找：conf 关闭 find_package_prefer_config"
    - "FindHWLOC 只走 pkg-config：配方生成可重定位 hwloc.pc shim（Libs 携带静态闭包 -lxml2 -lm -lpthread -ldl）"
    - "scotch 与 hwloc/cairo 链的 zlib 跨版本冲突：override 收敛到 zlib/1.3.1.1（两版本 OHOS 二进制 package_id 一致）"
    - "真机 ctest 须 OPENBLAS_NUM_THREADS=1/OMP_NUM_THREADS=1 防 -j8 线程超卖"
  common_dependencies:
    - openblas/0.3.34
    - scotch/7.0.12
    - hwloc/2.14.0

versions:
  "6.4.0":
    status: built
    build_date: "2026-10-04"
    conan_ref: "pastix/6.4.0"
