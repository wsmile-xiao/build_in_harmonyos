# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pastix/6.4.0
homepage: "https://gitlab.inria.fr/solverstack/pastix"

# 上游测试命令 (ctest -N / ctest --output-on-failure)
upstream_check_command: "ctest --test-dir build/Release -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build/Release --output-on-failure -j8（OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1；实测 1815/1815 = 100%）"

# 上游实际运行的测试（注册数权威来源：构建树内 ctest -N 实测 1815）
upstream_tests:
  - file: example/CTestLists.txt
    source: pastix-6.4.0/example/CTestLists.txt
    description: "example 套件：18 个 C 示例 × 精度/分解/调度/压缩参数矩阵，1781 用例（shm 单机模式，simple/analyze/schur 族）"
    command: "ctest -R 'shm_example|c_shm_example'"
  - file: test/CMakeLists.txt
    source: pastix-6.4.0/test/CMakeLists.txt
    description: "PaStiX 库 bcsc 单元测试（spmv/norm），27 用例"
    command: "ctest -R 'bcsc_shm_test'"
  - file: wrappers/fortran90/examples/fmultilap.F90
    source: pastix-6.4.0/wrappers/fortran90/examples/fmultilap.F90
    description: "Fortran 包装示例 7 用例（fsimple / fmultilap[seq+mt] / fstep-by-step / fmultidof / flaplacian / fusermat_csr）"
    command: "ctest -R 'fortran_shm'"

# test_package 中自带的测试 (消费者视角验证，真机运行)
test_package_tests:
  - file: test_pastix_solve.c
    description: "E2E 求解 2D 拉普拉斯稀疏系统（分析→分解→求解→收敛校验；driver 串 d:30:30:1:2 显式 alpha=2，与上游用例口径一致），10 项 CHECK，逐项 CHECK PASS/FAIL + TEST SUMMARY + 非零退出码"
    command: "./test_pastix_solve"
  - file: test_pastix_contract.c
    description: "6.4.0 宏/ABI 契约（版本/整型位宽/后端开关/SCOTCH/hwloc/Fortran），16 项 CHECK，逐项 CHECK PASS/FAIL + TEST SUMMARY + 非零退出码"
    command: "./test_pastix_contract"

# 测试断言总数 (近似值, 用于质量评估；消费者双执行器 CHECK 合计 10+16)
assertion_count: 26
