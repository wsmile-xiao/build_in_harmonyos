source:
  url: "https://gitlab.inria.fr/solverstack/pastix/uploads/53fd21905d2ce2a782ee7508b6115898/pastix-6.4.0.tar.gz"
  sha256: "891d426188eed56c1075fb34d2d80132593a1536ffc05cf333567f68a4811e55"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DPASTIX_WITH_MPI=OFF"
    - "-DPASTIX_WITH_FORTRAN=ON"
    - "-DPASTIX_INT64=OFF"
    - "-DPASTIX_ORDERING_SCOTCH=ON"
    - "-DPASTIX_ORDERING_METIS=OFF"
    - "-DPASTIX_WITH_STARPU=OFF"
    - "-DPASTIX_WITH_PARSEC=OFF"
    - "-DPASTIX_WITH_CUDA=OFF"
    - "-DPASTIX_WITH_EZTRACE=OFF"
    - "-DPASTIX_WITH_PAPI=OFF"
    - "-DPASTIX_WITH_EXTERNAL_SPM=OFF"
    - "-DPASTIX_GENERATE_MODEL=OFF"
  dependencies:
    - openblas/0.3.34
    - scotch/7.0.12
    - hwloc/2.14.0
    - zlib/1.3.1.1
    - flang-ohos/20.1.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-get-options-consume-value-token.patch"

knowledge_gained:
  - "OHOS libc 的 getopt_long 会置换非选项参数；上游 common/get_options.c 用 argv[optind] 直读 -i/-d 的值却从不推进 optind，多个 -i 对出现时每一对都读到陈旧 token，iparm 枚举越界后 Compress 表头打印越界访问，是 1536/1815 用例段错误的根因"
  - "补丁 0001 在读到值后显式 optind += 1：两种 libc 语义（置换/不置换）下均正确，属可移植性修复"
  - "上游 project() 声明 Fortran 为必需语言：设备与 NDK 均无 Fortran 编译器，须 tool_requires flang-ohos/20.1.0 且给全 --target/--sysroot/-resource-dir，链接期另加 -L<SDK>/llvm/lib/aarch64-linux-ohos（libunwind.a 仅在该目录）"
  - "上游 morse Find 模块依赖模块模式查找：需 conf 关闭 find_package_prefer_config，否则 find_package(SCOTCH) 命中 Conan 生成 config 而绕过 SCOTCH_Num 位宽探测"
  - "FindHWLOC 仅走 pkg-config，而依赖包内 hwloc.pc 不可重定位（prefix=/）：需自写 shim（Libs 行携带静态闭包 -lxml2 -lm -lpthread -ldl）"
  - "scotch 钉 zlib/1.3.1 与 hwloc/cairo 链钉 zlib/1.3.1.1 无法同图共存：两版本 OHOS 二进制 package_id 一致，override 到 1.3.1.1"
  - "conanfile.py 内 self.run(env=...) 必须传 KEY=VALUE 列表而非 dict（Conan 2 口径），ctest 以 OPENBLAS_NUM_THREADS=1/OMP_NUM_THREADS=1 规避 -j8 线程超卖"
  - "spm Laplacian 驱动缺省 alpha=1 生成 M = D − A 图 Laplacian（恒奇异，常数向量在零空间）：右端相容时残差完美但 x0 前向校验必然假失败；测试矩阵需显式 pin alpha=2（上游全部注册用例同款），上游 example 同参数对照可证与移植面无关"

