patches:
  "6.4.0":
    - patch_file: "patches/0001-get-options-consume-value-token.patch"
      patch_description: "common/get_options.c: after reading the separate value token of -i/-d through argv[optind], advance optind past it; without this the parser only works with non-permuting getopt_long(), and a permuting implementation (glibc-style reordering present in the OHOS libc) makes every later -i pair read a stale token, setting invalid enum indices and crashing in the Compress header print"
      patch_type: "portability"
