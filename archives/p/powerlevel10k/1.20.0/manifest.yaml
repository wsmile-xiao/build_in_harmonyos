# 版本级 manifest — powerlevel10k 1.20.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.20.0"
software: "powerlevel10k"

# 编译状态
# published | built | failed | archived
# share-only 纯脚本包：conan-verify G4（bin/lib/include 产物检查）预期降级，
# 终态 built（papirus-icon/theme 先例）
status: built

build_date: "2026-09-03"
build_system: "custom"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/romkatv/powerlevel10k/archive/refs/tags/v1.20.0.tar.gz"
  sha256: "d8187d44b697b3a37a8c4896678b4380e717cbf2850179529358348780a2d3d7"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 纯 zsh 脚本主题：无编译步骤，package() 整树复制到 share/powerlevel10k/
  system: custom

  configure_options: []

  # 无任何 Conan 依赖（运行时仅需 zsh ≥ 5.1；zsh/5.9 未发布到 ohpcd 制品仓，
  # 见 notes.md —— 不声明 requires，测试用系统 /usr/bin/zsh）
  dependencies: []

  # 纯脚本无编译器参与
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 无补丁：tarball 源码零修改（gitstatusd 不打包是打包范围决策，非源码修改）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 zsh 主题类软件适配范式（zimfw 1.20.0 / zsh-autopair 1.0 先例）：package_type=application + settings 四属性 + package_id() self.info.clear()，整树安装到 share/<name>/，bindirs 留空"
  - "powerlevel10k v1.20.0 tarball 不含任何预编译 gitstatusd 二进制（gitstatus/usrbin 与 deps 仅 .gitkeep 占位）；gitstatusd 二进制在 gitstatus 项目的独立 release assets 中，且源码构建依赖 romkatv fork 的 libgit2（OHOS 制品仓未发布），整条 C++ 依赖链不可行"
  - "gitstatusd 缺席时主题优雅降级是上游设计内行为：internal/p10k.zsh:4165 仅当 GITSTATUS_DAEMON_PID_POWERLEVEL9K 已设置才走 gitstatus 快路径，否则回退 zsh 原生 vcs_info；gitstatus.plugin.zsh:55-58 zmodload zsh/files 失败即静默 return（本机 zsh 5.9 musl 缺 zsh/files 模块，正好触发降级路径）"
  - "JC2 门禁禁止向仓库提交二进制产物 → 不入库 gitstatusd 预编译二进制；share-only 包 conan-verify G4 预期降级，manifest 终态 built（papirus-icon/theme 先例）"
  - "zsh/5.9 在 ohpcd 制品仓未发布（conan download 报平台策略错误 + API 404）→ conanfile 不声明 requires('zsh/5.9')（R36 未发布依赖 Hard Fail），test_package 用系统 /usr/bin/zsh（5.9 aarch64-musl）"
  - "测试断言环境鲁棒性设计：vcs 后端就绪断言接受 gitstatus_query 与 _p9k_vcs_info_init 二者之一（有 zsh/files 模块的主机走 gitstatus 路径，无模块主机走 vcs_info 回退），避免断言绑定特定主机的模块可用性"
