# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: powerlevel10k/1.20.0
homepage: "https://github.com/romkatv/powerlevel10k"

# 上游为纯 zsh 脚本项目，无正式测试套件（无 check/test 目标，无 CI 测试框架；
# 上游仓库仅对 gitstatus 子项目有独立测试，不在本 tarball 范围内）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（无）
upstream_tests: []

# test_package 自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "调用 test.sh 实际加载安装后的主题（布局完整性 + zsh 语法检查 + 干净 zsh 内真实 source 验证）"
    command: "conan create (test_package: bash test.sh <share/powerlevel10k>)"
  - file: test.sh
    description: "真实冒烟测试: 8 个上游关键文件在位; 3 个核心脚本 zsh -n 语法检查; GITSTATUS_AUTO_INSTALL=0 下干净 zsh (zsh -df +m) 加载主题退出码 0、p10k 入口函数已定义、vcs 后端就绪（gitstatusd 未打包时回退 zsh 原生 vcs_info，两种后端均计为就绪）"
    command: "bash test.sh <package share/powerlevel10k dir>"

assertion_count: 14
