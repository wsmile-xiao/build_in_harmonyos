software: perl-mail-sendmail
version: 0.82
status: published
publish_status: published
category: perl
build_system: perl_makefile
license: perl_artistic

# 编译信息
compile_date: 2026-06-15
compiler: clang 18.1.8
perl_version: 5.42.2

# 依赖关系
dependencies:
  runtime:
    - perl (>= 5.008)
    - Socket (core)
    - Time::Local (core)
    - Sys::Hostname (core)
  optional:
    - Sys::Hostname::Long
    - MIME::QuotedPrint
  build:
    - musl-headers
    - clang

# 构建选项
configure_options: []
make_options: []

# 平台适配
platform_notes: |
  Mail::Sendmail 是纯 Perl SMTP 邮件发送模块。

  鸿蒙平台适配：
  1. Sys::Hostname::Long 模块设为可选（原为硬依赖）
  2. 使用 eval require + fallback 机制处理可选依赖
  3. 纯 Perl 模块，无 SELinux 加载限制
  4. 所有测试通过 (t/original.t 2/2)

  补丁说明：
  - 0001-lib-Mail-Sendmail.pm.patch: 将 Sys::Hostname::Long 设为可选

# 质量门禁
quality_checks:
  g0_clean_build: pass
  g1_binary_integrity: pass  # 无二进制文件
  g2_functional: pass  # 邮件发送功能正常
  g3_portability: pass  # 无 ELF 文件
  g4_archive: pass

# 产物信息
artifacts:
  package: perl-mail-sendmail-0.82-ohos-aarch64.tar.gz
  xs_module: none  # PurePerl 模块
  patches: 1
  test_result: PASS (2/2 tests)

# 知识提取
knowledge_gained:
  - Perl 硬依赖模块可通过 eval require 变为可选
  - 纯 Perl 模块无平台加载限制
  - hostname_long() fallback 策略
