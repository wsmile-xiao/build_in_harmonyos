software: perltidy
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/20260204/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "20260204"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# 构建系统类型（verify-build G4 必检项）
# cmake | autotools | makefile | meson | custom | custom-perl
build_system: custom-perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/perltidy/20260204/Perl-Tidy-20260204.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 配置选项列表（configure wrapper脚本会自动转换 --prefix 到 PREFIX）
  configure_options: ""

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-bin-perltidy.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "perltidy 是纯 Perl 软件，使用 Makefile.PL (ExtUtils::MakeMaker) 构建系统"
  - "Perl 模块安装在 $DEFAULT_PREFIX/lib/site_perl/5.42.0/ 下，不在系统 Perl @INC 中"
  - "在 bin/perltidy 中添加 use lib '/.../site_perl/5.42.0' 指令解决模块路径问题"
  - "G0 clean-verify 需要 hints/configure 包装脚本适配 Perl Makefile.PL 项目"
  - "blib/ 是构建产物目录，不应作为补丁追踪（R6: 只改源文件）"
patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/perltidy-20260204.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/perltidy-20260204.work
  source_orig_hash: 59fe2259160b81a9
  source_work_hash: 31d4c9230fdf99eb
  generated_at: '2026-05-27T10:35:25'
  patches_count: 2

patch_classification:
  - file: 0001-bin-perltidy.patch
    type: platform_path
    platform_only: True
    guard: '#ifdef __OHOS__'
    description: "添加 use lib 指令让 perltidy 找到 Perl::Tidy 模块"
  - file: 0004-configure.patch
    type: build_system_adapter
    platform_only: True
    guard: ''
    description: "添加 configure 包装脚本适配 Makefile.PL 项目供 clean-verify 使用"
ly: True
    guard: 'pending'
