software: polyglot
display: "polyglot"
description: "PolyGlot — UCI↔XBoard 协议适配器及国际象棋开局库工具 (make-book/merge-book/dump-book)"
category: game
homepage: "https://www.gnu.org/software/xboard/"
license: GPL-2.0
build_system: autotools

ohos_adaptation:
  key_points:
    - "Pure C autotools project (37 .c files into a single polyglot binary), zero conan dependencies (only system libm)"
    - "E129: shipped configure uses umask 077 which breaks config.status temp dirs on HMDFS (setgid) — sed to umask 022 in build()"
    - "configure/config.guess are pre-generated in the 2.0.4 tarball (2008-era), no autoconf regeneration needed"
    - "Book tool subcommands (make-book/merge-book/dump-book) run standalone without a chess engine — used for R34 test_package"
  common_dependencies: []

versions:
  "2.0.4":
    status: built
    build_date: "2026-09-03"
    conan_ref: "polyglot/2.0.4"
