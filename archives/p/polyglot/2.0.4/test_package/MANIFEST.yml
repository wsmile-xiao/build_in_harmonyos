# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: polyglot/2.0.4
homepage: "https://www.gnu.org/software/xboard/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# polyglot 2.0.4 上游 autotools 无 TESTS 定义（check-am 仅依赖 all-am），无测试套件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_polyglot.py
    description: "消费者测试: make-book 生成开局库(16字节entry格式断言) + dump-book 走子记谱断言 + merge-book + 无参数 usage banner"
    command: "python3 test_polyglot.py <bin/polyglot>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 9
