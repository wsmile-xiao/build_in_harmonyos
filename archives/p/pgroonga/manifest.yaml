# 软件级 manifest — pgroonga
# 文件位置: archives/p/pgroonga/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: pgroonga
display: "PGroonga"
description: "Super fast and all languages supported full text search index for PostgreSQL, based on Groonga"
category: db
homepage: "https://pgroonga.github.io/"
license: PostgreSQL
build_system: meson

ohos_adaptation:
  key_points:
    - "PostgreSQL 走 tool_requires(\"postgresql/18.3\")：CI 的 -pr:b 与 -pr:h 是同一个 OHOS profile，直接解析到已发布的 OHOS 制品，构建期即有服务端头 + pgxs + initdb/pg_ctl/psql/pg_regress"
    - "Conan 的 postgresql 前缀为空（DESTDIR 可重定位），pg_config 回的 //include/postgresql/server 是坏路径 → generate() 生成只重定向路径类查询的 pg_config shim 给 meson 的 -Dpg_config="
    - "groonga 的 .pc 烘焙了构建机前缀 → generators=\"PkgConfigDeps\" 重新生成；MesonToolchain 自动把 generators 目录写进 pkg_config_path"
    - "-Dinstall_to_postgresql=false + -Ddatadir=share：产物落包内 lib/ 与 share/extension/，不往 PG 安装目录写；ConanToolchain 默认 datadir=resdirs[0]，不显式改回 share 会得到 share/res/extension"
    - "运行期靠集群参数 extension_control_path（PG 18+）+ dynamic_library_path 指向包内目录来发现扩展；PG 的 load_external_function 对「简单名」$libdir/pgroonga 会剥前缀交给 dynamic_library_path 搜索，所以 control 无需改"
    - "-Dtest=false：上游 test=true 会硬 find_program('ruby')；回归改在 test_package 里用 pg_regress 驱动，schedule 由 Python 复刻 test/prepare.rb 生成"
    - "运行期需要 GRN_PLUGINS_DIR 覆盖 groonga 编译期烘焙的插件目录（那是构建机路径）；mecab/stem 属 groonga 外部插件，OHOS groonga 未编入 → 2 例上游用例必然 unsupported，已在 regress-skip.txt 逐条注明"
    - "仓库打包的 postgresql/18.3 定义了 HAVE_NO_UNIX_SOCKETS：测试集群必须 TCP（listen_addresses + 显式端口），pg_regress 不能用 --temp-instance"
  common_dependencies:
    - groonga
    - msgpack
    - libxxhash
    - postgresql

versions:
  "4.0.8":
    status: built
    build_date: "2026-09-20"
    notes: "Meson 构建，产物为 7 个 PostgreSQL shared module + share/extension 下 control/SQL；上游 pg_regress 实跑 1598 例（钉版 1600 − regress-skip.txt 逐条注明的 2 例需 groonga 外部 mecab/stem 插件；上游默认分支 main 的朴素扫描为 1608，rule4 声明值按 1608 报）"
