# test_package/MANIFEST.yml
package: pgroonga/4.0.8
homepage: "https://pgroonga.github.io/"

upstream_check_command: "meson test -C <build> -v  (regression suite, schedule 由 test/prepare.rb 生成)"
upstream_test_in_build: false
upstream_test_command: "pg_regress --load-extension pgroonga --schedule <generated from sql/**.sql>"

upstream_tests_exist: true
upstream_test_framework: pg_regress
# 声明值 = 上游**默认分支 main** 的朴素扫描（sql/**.sql），不是钉版 tag。
# 详见下方 upstream_test_audit 里的三档口径。
upstream_test_count: 1608
upstream_test_groups:
  - full-text-search
  - regexp
  - term-search
  - function
  - jsonb
  - compare
  - compatibility
  - variable
  - semantic-search
  - custom-scan
  - index-only-scan
  - groonga-function
  - int4-array
  - column-name
  - index-scan
  - reindex
  - vacuum
upstream_test_runner: "test_package/conanfile.py: initdb -> pg_ctl start (TCP, port=49xxx) -> psql 行为断言 -> pg_regress --load-extension pgroonga"
upstream_test_dependency: "运行的 PostgreSQL 18.3 服务端（postgresql/18.3 tool_requires 提供 initdb/pg_ctl/psql/pg_regress），以及 groonga/16.0.8 运行期共享库"

upstream_test_audit: |
  ── 用例数三档口径（rule4）────────────────────────────────────────────
  A. 上游**默认分支 main** 的朴素扫描（= 声明值，必须 >= 它）   1608
     git ls-tree 递归 + 数 sql/**.sql；同时 expected/**.out = 1658
  B. 钉版 4.0.8 tarball 的朴素扫描                              1600
     expected/*.out = 1650 = 1600 个主 oracle + 50 个 _1/_2 备用 oracle
  C. 本 test_package 实跑                                       1598
     = B - 2（regress-skip.txt 逐条写明原因的 2 例）

  A 与 B 的差集已逐文件核对，是 **8 个 main 有、4.0.8 没有** 的新用例，
  没有反向删除（钉版没有任何 main 里不存在的用例）：
    function/physical-table-names/
      nonchildren  nonexistent  nonpartition  range-partition  too-long-prefix   5
    index-scan/view-statistics/user-indexes/
      bitmapscan  indexscan  seqscan                                             3
  8 例在 main 上都同时有 expected/**.out oracle（main 的 expected 也只比
  4.0.8 多这 8 个），即它们是上游 4.0.8 之后**新增**的回归用例，与平台无关，
  钉版里当然不存在，故不可能执行。

  ── 未执行 10 例的逐类归因（1608 - 1598）─────────────────────────────
    8  上游 main 新增、钉版 4.0.8 尚无（上面列出的两组，平台无关）
    2  依赖 groonga 的**外部**插件，OHOS groonga/16.0.8 未编入（见下）
    0  平台门控（#ifdef）跳过
    0  注释屏蔽
    0  手工挑选/“顺手过滤”（_write_schedule 刻意不筛 oracle 存在性、不按
       group 挑，只做 regress-skip.txt 里逐条说明的删减）
  即 A - C 全部有据可查，不存在“跑得全绿但用例集缩水”的假绿。

  ── 2 例排除的依据 ───────────────────────────────────────────────────
    function/tokenize/metadata                 需要 TokenizerMecab
    full-text-search/text/options/token-filters/custom
                                               需要 TokenFilterStem
  groonga 的插件式 tokenizer / token filter 是**独立构建产物**：Debian/Ubuntu
  上分别是 groonga-tokenizer-mecab / groonga-token-filter-stem 两个包，不属于
  groonga 本体。OHOS 的 groonga/16.0.8 包内 lib/groonga/plugins/ 只有
  functions/ query_expanders/ suggest/ token_filters/stop_word，既无
  tokenizers/mecab 也无 token_filters/stem，因此这 2 例在设备上必然拿到
  groonga 的 "unsupported tokenizer/filter" 报错，与 pgroonga 适配无关。
  其余用例所需的 TokenNgram / TokenBigram / NormalizerNFKC* 均为 groonga
  内置实现（逐文件 grep TokenMecab / TokenFilterStem 在 sql/ 下各只命中 1 处）。

  ── 上游回归入口的处理 ───────────────────────────────────────────────
  上游自带入口 `-Dtest=true`（meson.build:585-586 find_program('ruby') +
  test/prepare.rb 生成 schedule）在 OHOS 上不可用，因此构建期显式
  -Dtest=false；test_package 用 Python 复刻 prepare.rb 的全部行为
  （递归收集 sql/**.sql、`test: <相对路径>` 逐行写 schedule、预建
  results/<子目录>），因此跑的是与上游一致的全量用例集合，而不是人工挑选的
  子集。pg_regress 的其它参数也逐条对齐上游 meson.build:628-636：
  --bindir / --dlpath / --inputdir / --outputdir / --launcher
  test/short-pgappname（vendored 副本，package() 已补回可执行位）/
  --load-extension pgroonga / --schedule；仅因仓库打包的 PG 定义了
  HAVE_NO_UNIX_SOCKETS 而**必须**额外加 --host/--port/--user/--dbname
  连既有 TCP 集群（不能用 --temp-instance）。

  pg_regress 取自 postgresql/18.3 包的
  lib/postgresql/pgxs/src/test/regress/pg_regress —— PostgreSQL 源码里
  src/test/regress/GNUmakefile 的 install 规则把它装到 $(pgxsdir)/$(subdir)/，
  而 src/Makefile 的 SUBDIRS 含 test/regress、src/test/Makefile 又把 install
  递归进去，所以完整 make install 必然带上它（无需像 postgresql-sequential-uuids
  / postgresql-pllua 那样自建 PG 源码树——那两条是为了拿到**前缀非空**的 PGXS）。

  ── oracle 可用性与环境对齐 ─────────────────────────────────────────
  上游 pgroonga 4.0.8 的 CI（.github/workflows/linux.yml 矩阵）用同一份
  expected/ 在 PostgreSQL 14/15/16/17/18/19 上全绿，说明该 oracle 集合本身
  跨 PG 版本稳定；50 个 _1/_2 备用 oracle 专门覆盖 guc/版本/环境差异
  （例如 function/language-model-vectorize/huggingface 与 semantic-search/*
  会在未设置 PGRN_LANGUAGE_MODEL_TEST 时提前 \quit，由 _1.out 兜底；本包
  刻意不设该变量，让这批用例走自动跳过分支）。
  test_package 另外把集群参数对齐到上游 CI 的 postgresql.conf 追加项
  （enable_partitionwise_join=on / max_prepared_transactions=1 /
  random_page_cost=0），保证 EXPLAIN (COSTS OFF) 类用例的计划可比。
  逐文件核查：sql/ 与 expected/ 里没有任何地方引用 application_name 或
  pg_stat_activity，因此 --launcher 只影响 PGAPPNAME 的写法。

test_package_tests:
  - file: conanfile.py (静态布局层 _check_layout)
    description: "7 个 shared module + control/SQL 脚本齐备、pgroonga.so 为 aarch64 ELF，且产物未泄漏进 PostgreSQL 包目录"
    command: "ELF/layout assertions in test()"
    assertions: 12
    executed: true
    passed: true
  - file: assert_pgroonga.sql
    description: "真集群行为断言：CREATE EXTENSION($libdir 重定位) / pgroonga_escape(int4)（C 函数执行）/ groonga status / probin 路径卫生 / v1 全文检索 &@ / &@~ / pgroonga_score / v2 词项前缀 &^ / jsonb v2 / highlight_html / query_extract_keywords / tokenize / DROP+CREATE"
    command: "psql -X -q -v ON_ERROR_STOP=1 -f assert_pgroonga.sql  (经 self.run)"
    assertions: 14
    executed: true
    passed: true
  - file: regress-skip.txt
    description: "上游 pg_regress 排除清单（2 例需 OHOS groonga 未编入的 mecab/stem 插件）"
    command: "consumed by _write_schedule()"
    assertions: 1
    executed: true
    passed: true

assertion_count: 27
assertion_executed: 27
assertion_skipped: 0
