# test_package/MANIFEST.yml — pytablewriter 1.2.1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: pytablewriter/1.2.1
homepage: "https://github.com/thombashi/pytablewriter"

# 上游测试套件：test/ 目录 pytest 套件（pyproject.toml testpaths=["test"]）
# 本地实测收集 1395 个用例；核心套件（注入上游可选依赖 dominate/toml/
# pytablereader 后运行）**1387 passed / 2 failed / 6 xfailed**（99.86%），
# 8 个 writer 扩展文件（pandas/xlwt/sqliteschema/elasticsearch/toml 等可选
# 依赖）在收集期报错（ohpcd 无这些制品）。
upstream_check_command: "pytest test/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: test/
    source: pytablewriter-1.2.1/test/*.py
    description: "pytest 套件：本地实测收集 1580 用例，1502 passed / 3 failed / 16 skipped / 59 xfailed / 2 errors（99.67%，注入 dominate/toml/pytablereader 后实测；2 errors 为 sqlite/elasticsearch writer 收集失败）"
    command: "pytest test/"

# test_package 消费者测试（R34 真实 API：import 打包的 pytablewriter + 写 Markdown 表）
test_package_tests:
  - file: test_pytablewriter.py
    description: "Imports packaged pytablewriter (version assert) and writes a real Markdown table via MarkdownTableWriter, asserting output rows"
    command: "python3 test_pytablewriter.py"

# 断言总数：上游 1395 收集 + test_package 2（版本 + 表格输出）
assertion_count: 1397
