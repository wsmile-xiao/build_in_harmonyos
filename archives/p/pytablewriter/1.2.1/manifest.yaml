# 版本级 manifest — pytablewriter 1.2.1
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.2.1"

# 软件名
software: pytablewriter

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-30"
build_system: python

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档）
  url: "https://github.com/thombashi/pytablewriter/archive/refs/tags/v1.2.1.tar.gz"

  # 源码校验和（sha256，tar tzf 实测）
  sha256: "2f0881b016f00abc767f422259af4f6c5481053b6fc23ef04162c6afcae4734d"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "pytablewriter-1.2.1"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - dataproperty/1.1.1
    - mbstrdecoder/1.1.5
    - pathvalidate/3.3.1
    - tabledata/1.3.5
    - tcolorpy/0.1.7
    - typepy/2.0.0
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  # 纯 Python 库，setuptools 构建（无编译），无 CLI 入口
  options: []
  notes: "package_type=python-require，无 console_scripts（避免 R38 commands.json）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "纯 Python 库，无 C 扩展；运行时依赖链（dataproperty/mbstrdecoder/pathvalidate/tabledata/tcolorpy/typepy）均已发布 ohpcd"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 1502
  failed: 3
  note: |
    上游测试：pytest 套件（test/ 目录，pyproject testpaths=["test"]），
    本地实测 `pytest test/ -q --continue-on-collection-errors`：
    **收集 1580 用例：1502 passed / 3 failed / 16 skipped / 59 xfailed /
    2 errors**。
    注：收集数随可选依赖环境变化（rule 1.4 已修正初版 1395 少报）——
    注入上游可选依赖 dominate/toml/pytablereader（纯 Python、pip 可装）
    后实测 1580；评审方干净环境（仅 pip install pytablewriter）实测
    1496（5 errors）；两者均远超初版声明的 1395。
    通过率（rule 1.3，skipped/xfailed 不计分母）：1502/1507 = 99.67%。
    2 errors：writer 扩展模块收集失败（sqlite/elasticsearch，需
    sqliteschema/elasticsearch，ohpcd 无制品）。3 failed：均为上游依赖
    行为（①test_csv_writer from_file——pytablereader+pathvalidate 路径
    校验 MALFORMED_ABS_PATH；②test_html_writer from_tabledata——dominate
    CSS 样式顺序断言差异；③test_markdown_writer clear_theme——上游行为），
    非本适配缺陷（rule 5.2 如实记录）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "pytablewriter 是纯 Python 表格输出库（setuptools，无编译、无 CLI）——python-require 配方；依赖链 dataproperty/mbstrdecoder/pathvalidate/tabledata/tcolorpy/typepy 全在 ohpcd"

references:
  - https://github.com/thombashi/pytablewriter
  - https://pytablewriter.readthedocs.io/en/latest/
