software: perl-mojolicious
build_system: makefile
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/9.42/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.42"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-23"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SR/SRI/Mojolicious-9.42.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL --prefix=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "perl-extutils-makemaker/7.76"
    - "perl-io-socket-ip/0.37"
    - "perl-sub-util/1.41"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lib-Mojo-Server.pm.patch"
  - "0002-lib-Mojo-Server-Hypnotoad.pm.patch"
  - "0003-lib-Mojo-Server-Morbo.pm.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OpenHarmony prctl(PR_SET_NAME) 返回 EINVAL，导致 Perl $0 赋值失败"
  - "local $0 也会触发 prctl 调用，不能用于 OpenHarmony 平台"
  - "解决方案：用 eval 包裹 $0 赋值，手动保存/恢复代替 local $0"
  - "Perl 模块构建系统应标记为 makefile 而非 autotools"

