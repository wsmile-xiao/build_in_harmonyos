software: percona-server
display: "Percona Server for MySQL"
description: "MySQL-compatible database server and client library maintained by Percona"
category: database
homepage: "https://www.percona.com/software/mysql-database/percona-server"
license: GPL-2.0-only
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the upstream CMake build, not the init-build autotools guess."
    - "Build the client/library subset with WITHOUT_SERVER=ON before attempting full mysqld."
    - "Use ncurses/6.6 for bundled editline's FindCurses dependency."
    - "Treat the OHOS target as Linux/aarch64 for upstream CMake OS modules while keeping the OHOS compiler profile."

versions:
