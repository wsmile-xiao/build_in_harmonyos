software: percona-server
version: "8.4.10-10"
status: built
build_date: "2026-09-23"
build_system: cmake
conan_ref: "percona-server/8.4.10-10"

source:
  url: "https://codeload.github.com/percona/percona-server/tar.gz/refs/tags/Percona-Server-8.4.10-10"
  sha256: "caa8318c2dfb4930eb27f0dbed882e3a869f0412efc674589cb10ab35c8c9617"
  tar_format: tar.gz

dependencies:
  required:
    - "openssl/3.5.6.1.1"
    - "ncurses/6.6"
  bundled:
    - "zlib"
    - "lz4"
    - "zstd"
    - "icu"
    - "protobuf"
    - "curl"
    - "boost"
  optional_disabled:
    - "server"
    - "router"
    - "ndb"
    - "pam"
    - "ldap"
    - "kerberos"
    - "sasl"
    - "fido/webauthn"
    - "keyring_kmip"

build_config:
  target: aarch64-linux-ohos
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
    - "-DOHOS=ON"
    - "-DHAVE_SETNS_EXITCODE=1"
    - "-DHAVE_CLOCK_GETTIME_EXITCODE=0"
    - "-DHAVE_CLOCK_REALTIME_EXITCODE=0"
    - "-DWITH_BUILD_ID=OFF"
    - "-DWITHOUT_SERVER=ON"
    - "-DWITH_ROUTER=OFF"
    - "-DWITH_NDB=OFF"
    - "-DWITH_UNIT_TESTS=OFF"
    - "-DWITH_EDITLINE=bundled"
    - "-DWITH_SSL=system"
    - "-DWITH_ZLIB=bundled"
    - "-DWITH_LZ4=bundled"
    - "-DWITH_ZSTD=bundled"
    - "-DWITH_ICU=bundled"
    - "-DWITH_PROTOBUF=bundled"
    - "-DWITH_CURL=bundled"
    - "-DWITH_COREDUMPER=OFF"
    - "-DWITH_COMPONENT_KEYRING_KMIP=OFF"
    - "-DWITHOUT_COMPONENT_KEYRING_KMIP=ON"
    - "-DWITH_AUTHENTICATION_CLIENT_PLUGINS=OFF"

upstream_test_inventory:
  status: built
  framework: "mysql-test-run.pl (MTR)"
  mtr_test_files: 10422
  mtr_result_files: 10261
  mysql_test_files_total: 26980
  unittest_files: 583
  unittest_cc_cpp_sources: 431

adaptation_history:
  prior_archive: "archives/p/percona-server/8.4.10_10 (merged main 4c6e1eea2, 2026-08-29)"
  note: >-
    This 8.4.10-10 archive is the canonical upstream-version-string adaptation of the
    same Percona-Server-8.4.10-10 tag previously archived as conan-incompatible
    underscore variant 8.4.10_10. Recipe, patches, build options and test package are
    carried over 1:1 from the verified 8.4.10_10 archive (W0b-compliant), with only the
    Conan version string changed to the conan-legal hyphen form. All 54 portability
    patches apply to the identical upstream tag.
