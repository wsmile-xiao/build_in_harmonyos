sources:
  url: "https://codeload.github.com/percona/percona-server/tar.gz/refs/tags/Percona-Server-8.4.10-10"
  filename: "percona-server-8.4.10-10.tar.gz"
  sha256: "caa8318c2dfb4930eb27f0dbed882e3a869f0412efc674589cb10ab35c8c9617"

patches:
  "8.4.10-10":
    - patch_file: "patches/0001-ohos-dns-srv-and-optional-kmip.patch"
      patch_type: "portability"
      patch_description: "0001 ohos dns srv optional kmip and client build"
    - patch_file: "patches/0002-ohos-vendored-boost-pthread-cancel.patch"
      patch_type: "portability"
      patch_description: "0002 skip unavailable pthread cancellation state in vendored Boost"
    - patch_file: "patches/0003-ohos-myisam-bit-ceil-compat.patch"
      patch_type: "portability"
      patch_description: "0003 provide bit_ceil fallback for OHOS standard library"
    - patch_file: "patches/0004-ohos-server-components-cxx20.patch"
      patch_type: "portability"
      patch_description: "0004 compile server component services as C++20 on OHOS"
    - patch_file: "patches/0005-ohos-ndb-algorithm-compat.patch"
      patch_type: "portability"
      patch_description: "0005 use iterator algorithms unavailable from OHOS ranges"
    - patch_file: "patches/0006-ohos-crc32-builtin.patch"
      patch_type: "portability"
      patch_description: "0006 use OHOS-compatible ARM target attributes for CRC32 intrinsics"
    - patch_file: "patches/0007-ohos-thread-id-compat.patch"
      patch_type: "portability"
      patch_description: "0007 avoid unavailable OHOS SYS_gettid"
    - patch_file: "patches/0008-ohos-resource-group-platform.patch"
      patch_type: "portability"
      patch_description: "0008 provide OHOS resource group platform fallback"
    - patch_file: "patches/0009-ohos-server-generators-and-innodb-platform.patch"
      patch_type: "portability"
      patch_description: "0009 use target generator paths, bundled SunRPC sources, and skip Linux-only InnoDB paths on OHOS"
    - patch_file: "patches/0010-ohos-mask-umask-to-posix-bits.patch"
      patch_type: "portability"
      patch_description: "0010 mask RSA key umask to POSIX permission bits on OHOS"
    - patch_file: "patches/0011-ohos-keyring-vault-uint-include.patch"
      patch_type: "portability"
      patch_description: "0011 include my_inttypes for keyring_vault config timeout"
    - patch_file: "patches/0012-ohos-build-id-dl-iterate.patch"
      patch_type: "portability"
      patch_description: "0012 accept OHOS main program metadata in build id iteration"
    - patch_file: "patches/0013-ohos-uuid-udf-no-libatomic.patch"
      patch_type: "portability"
      patch_description: "0013 avoid unavailable libatomic for OHOS uuid udf"
    - patch_file: "patches/0014-ohos-manifest-instance-path.patch"
      patch_type: "portability"
      patch_description: "0014 add a separator when resolving an instance manifest path"
    - patch_file: "patches/0015-ohos-manifest-use-runtime-datadir.patch"
      patch_type: "portability"
      patch_description: "0015 resolve instance manifests from the runtime data directory"
    - patch_file: "patches/0016-ohos-preserve-absolute-datadir.patch"
      patch_type: "portability"
      patch_description: "0016 clear stale OHOS data directory bytes during early component setup"
    - patch_file: "patches/0018-ohos-clone-mysqld-safe-tmpdir.patch"
      patch_type: "portability"
      patch_description: "0018 preserve the writable MTR temporary directory across clone mysqld_safe restarts"
    - patch_file: "patches/0019-ohos-group-replication-status-string.patch"
      patch_type: "portability"
      patch_description: "0019 expose Group Replication flow-control strings without relying on std::string object layout"
    - patch_file: "patches/0020-portable-mysqlbinlog-raw-shell.patch"
      patch_type: "portability"
      patch_description: "0020 resolve bash through PATH for the mysqlbinlog raw helper"
    - patch_file: "patches/0021-stabilize-connection-control-processlist.patch"
      patch_type: "portability"
      patch_description: "0021 wait for the delayed connection before checking processlist"
    - patch_file: "patches/0022-portable-address-in-use-suppression.patch"
      patch_type: "portability"
      patch_description: "0022 accept Musl and glibc address-in-use error text in the X Plugin test"
    - patch_file: "patches/0023-use-injected-udf-registration-service.patch"
      patch_type: "portability"
      patch_description: "0023 keep audit component required services available during component shutdown"
    - patch_file: "patches/0024-portable-mtr-capabilities.patch"
      patch_type: "portability"
      patch_description: "0024 make upstream MTR capability checks portable to OHOS"
    - patch_file: "patches/0025-ohos-upstream-mtr-portability.patch"
      patch_type: "portability"
      patch_description: "0025 make server-side upstream MTR paths, capability checks, output matching, and atomic probes portable to OHOS"
    - patch_file: "patches/0026-ohos-current-pthread-stack-origin.patch"
      patch_type: "portability"
      patch_description: "0026 measure stack use from the active OHOS thread-pool worker stack"
    - patch_file: "patches/0027-serialize-threadpool-connection-events.patch"
      patch_type: "portability"
      patch_description: "0027 serialize duplicate thread-pool socket events before processing a connection"
    - patch_file: "patches/0028-create-parallel-mtr-tmpdir.patch"
      patch_type: "portability"
      patch_description: "0028 create each parallel MTR worker temporary directory before server initialization"
    - patch_file: "patches/0029-ignore-visible-internal-myisam-temp-files.patch"
      patch_type: "portability"
      patch_description: "0029 ignore visible internal MyISAM temporary files in MTR side-effect snapshots"
    - patch_file: "patches/0030-clean-audit-xml-query-files.patch"
      patch_type: "portability"
      patch_description: "0030 remove generated audit XML query files after MTR consumes them"
    - patch_file: "patches/0031-use-available-cxx-for-dlopen-checker.patch"
      patch_type: "portability"
      patch_description: "0031 compile the keyring dlopen checker with an available C++ driver"
    - patch_file: "patches/0032-use-mtr-tmpdir-for-secure-file-test.patch"
      patch_type: "portability"
      patch_description: "0032 use the writable MTR temporary directory for the unrestricted secure-file test"
    - patch_file: "patches/0033-bound-slow-log-digest-formatting.patch"
      patch_type: "portability"
      patch_description: "0033 bound each slow-log digest write by the remaining destination capacity"
    - patch_file: "patches/0034-format-fixed-gmt-suffix-portably.patch"
      patch_type: "portability"
      patch_description: "0034 format the UUID timestamp GMT suffix independently of libc timezone metadata"
    - patch_file: "patches/0035-clean-secure-log-path-test-files.patch"
      patch_type: "portability"
      patch_description: "0035 remove temporary general and slow logs created by the secure-log-path test"
    - patch_file: "patches/0036-detect-readable-procfs-test-files.patch"
      patch_type: "portability"
      patch_description: "0036 compare procfs plugin rows with files readable in the target process context"
    - patch_file: "patches/0037-use-portable-ps-thread-list.patch"
      patch_type: "portability"
      patch_description: "0037 list process threads with ps syntax shared by procps and Toybox"
    - patch_file: "patches/0038-parse-utility-privileges-without-regex.patch"
      patch_type: "portability"
      patch_description: "0038 parse utility-user dynamic privileges without libc++ regex complexity failures"
    - patch_file: "patches/0039-wait-for-audit-client-disconnects.patch"
      patch_type: "portability"
      patch_description: "0039 wait for audit test clients to disconnect before unloading the event service"
    - patch_file: "patches/0040-detect-lowercase-sed-usage.patch"
      patch_type: "portability"
      patch_description: "0040 recognize Toybox sed and probe it before MTR state changes"
    - patch_file: "patches/0041-reset-replica-before-read-only-restart.patch"
      patch_type: "portability"
      patch_description: "0041 clear reused MTR worker replication metadata before an InnoDB read-only restart"
    - patch_file: "patches/0042-isolate-audit-bookmark-after-rotate.patch"
      patch_type: "portability"
      patch_description: "0042 isolate audit bookmark reads from parallel worker lifecycle events"
    - patch_file: "patches/0043-link-keyring-vault-test-to-curl.patch"
      patch_type: "portability"
      patch_description: "0043 propagate bundled curl headers to the keyring vault unit-test library"
    - patch_file: "patches/0044-use-bundled-sunrpc-headers-in-gcs-tests.patch"
      patch_type: "portability"
      patch_description: "0044 expose bundled SunRPC headers to the libmysqlgcs unit tests on OHOS"
    - patch_file: "patches/0045-ohos-upstream-ctest-portability.patch"
      patch_type: "portability"
      patch_description: "0045 use writable temporary paths, avoid unavailable procfs initialization, and skip unsupported HMDFS symlink coverage in upstream CTest"
    - patch_file: "patches/0046-ohos-sync0rw-writable-tempfile.patch"
      patch_type: "portability"
      patch_description: "0046 use the configured writable test directory for the InnoDB sync wait-array diagnostic stream on OHOS"
    - patch_file: "patches/0047-ohos-bgc-test-thread-local-random.patch"
      patch_type: "test-portability"
      patch_description: "0047 isolate BGC random state and avoid OHOS busy-wait starvation"
    - patch_file: "patches/0048-ohos-procfs-capability-diagnostic.patch"
      patch_type: "portability"
      patch_description: "0048 skip Linux procfs-dependent NDB hardware initialization on OHOS"
    - patch_file: "patches/0049-ohos-ndb-hw-test-capability.patch"
      patch_type: "test-portability"
      patch_description: "0049 retain synthetic NDB CPU-map coverage when OHOS procfs sampling is unavailable"
    - patch_file: "patches/0050-ohos-ndbdir-no-symlink-test.patch"
      patch_type: "test-portability"
      patch_description: "0050 omit the HMDFS-incompatible NDB directory symlink subtest on OHOS"
    - patch_file: "patches/0051-ohos-ndb-ipv6-localhost-test.patch"
      patch_type: "test-portability"
      patch_description: "0051 avoid asserting IPv6 localhost when no IPv6 localhost alias resolves"
    - patch_file: "patches/0052-ohos-outputstream-mkstemp.patch"
      patch_type: "test-portability"
      patch_description: "0052 use a writable named temporary file for the OHOS OutputStream test"
    - patch_file: "patches/0053-ohos-ndb-tempdir-home-fallback.patch"
      patch_type: "portability"
      patch_description: "0053 fall back to the writable user home when OHOS has no usable TMPDIR"
    - patch_file: "patches/0054-ohos-ndb-csr-version.patch"
      patch_type: "portability"
      patch_description: "0054 set the CSR version required by the OHOS OpenSSL verifier"
    - patch_file: "patches/0055-ohos-innodb-thread-priority-noop.patch"
      patch_type: "portability"
      patch_description: "0055 disable unsupported OHOS InnoDB thread priority changes"
