knowledge_gained:
  - "Percona bundled editline still calls CMake FindCurses; use published ncurses/6.6 and pass CURSES_* cache variables."
  - "Percona upstream has no cmake/os/HarmonyOS.cmake; set CMAKE_SYSTEM_NAME=Linux for upstream CMake while using the OHOS compiler profile."
  - "Skip RPC/tirpc for OHOS client-only builds and disable coredumper to avoid server-only probes during the client-only OHOS build."
  - "OHOS libc provides res_search/res_init but not res_nsearch/res_ninit; patch libmysql DNS SRV support to use the existing single-state resolver path behind an explicit capability macro."
  - "Skip configure-time convenience symlinks on OHOS/HMDFS; use the real runtime_output_directory, library_output_directory, and plugin_output_directory paths."
  - "Preset OHOS cross-compile try_run results for setns and clock_gettime/CLOCK_REALTIME so CMake configure does not stop in cross mode."
  - "Use TARGET_FILE for the libcno cno_huffman_generator build-time tool so the custom command does not depend on PATH/current-directory lookup."
  - "OHOS clang uses a 32-bit wchar_t but does not define __STDC_ISO_10646__; allow libedit's chartype.h check to proceed behind an explicit capability macro."
  - "OHOS libedit terminal.c needs explicit termcap prototypes for tgoto/tgetstr/tputs when building against the Conan ncurses headers."
  - "OHOS SDK linux/tcp.h conflicts with sys/socket.h in bundled curl; disable HAVE_LINUX_TCP_H so curl uses netinet/tcp.h."
  - "OHOS client-only builds do not consume ext::rpc; skip MYSQL_CHECK_RPC under OHOS AND WITHOUT_SERVER instead of patching bundled generated tirpc configure files."
  - "Percona shared-only helper targets can still create HMDFS-blocked .so symlinks; skip shared libmysql and json_binlog targets for the static client package surface."
  - "Static libperconaserverclient.a contains C++ objects; propagate c++, c++abi, and unwind system libraries so a C consumer can link."
  - "A unit-test helper that compiles bundled dependency sources must link the dependency target itself; linking ext::curl only from downstream tests does not provide curl headers while the helper is compiled."
  - "A unit-test directory that includes generated XCom RPC headers must enable the bundled SunRPC include paths under the same OHOS condition as the production libmysqlgcs target."
