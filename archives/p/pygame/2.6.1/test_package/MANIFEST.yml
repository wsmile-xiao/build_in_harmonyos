package: pygame/2.6.1
homepage: "https://www.pygame.org/"

upstream_tests_exist: true
upstream_test_audit: "Official pygame 2.6.1 sdist contains 45 top-level *_test.py modules and the pygame.tests unittest runner. The runner schedules 44 modules because scrap_test carries the upstream ignore tag. Static source inventory has 1,773 test methods; parameterization produces 1,855 runtime cases. The OHOS runner locks that inventory, uses SDL dummy video/audio, and probes real target capabilities without injecting replacement providers."
upstream_check_command: "SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy python3 $BUILD_FOLDER/upstream-test-work/pygame-upstream-runner.py -v; on the HNP AppSpawn E212 fingerprint, signed artifact verification is reported instead"
upstream_test_in_build: true
upstream_source_patches:
  - file: "patches/0001-src_c-mixer.c.patch"
    description: "Clear queued Channel sound before SDL_mixer's finished callback during Channel.stop"
    validation: "refresh-patch generated; patch --dry-run passed against pygame-2.6.1 sdist"
upstream_test_command: "generated capability runner invokes pygame.tests.__main__ against the staged signed wheel, with the pinned NumPy 2.2.6 OHOS wheel; E212 fallback validates the signed wheel without claiming runtime cases"

upstream_tests:
  - file: "test/*_test.py"
    source: "pygame-2.6.1 sdist"
    framework: unittest
    modules: 45
    executed_modules_reference: 44
    upstream_excluded_modules: ["scrap_test: ignore tag"]
    discovered_reference: 1855
    description: "Complete upstream suite covering SDL lifecycle, surfaces, draw/transform, image codecs, fonts, audio mixer, events, input APIs, sprites, math, buffers, NumPy arrays, and test machinery; the recipe parser requires 1,855 cases and the exact 44-module inventory"

upstream_adjustments:
  - file: "test/font_test.py"
    scope: "test_font_set_script only"
    behavior: "runs the original type/value checks and validates pygame.error for a valid script when SDL_ttf lacks shaping support"
  - file: "test/midi_test.py"
    scope: "8 MidiModuleNonInteractiveTest cases"
    behavior: "explicit skip when pygame.midi import proves PortMidi is absent"
  - file: "test/mixer_music_test.py"
    scope: "5 pure OGG cases plus 3 mixed OGG/WAV cases"
    behavior: "pure OGG cases explicitly skip when the decoder is absent; mixed cases retain and execute their WAV branches"
  - file: "test/font_test.py, test/ftfont_test.py, test/sysfont_test.py"
    scope: "15 cases requiring a nonempty system-font provider"
    behavior: "explicit skip when pygame.font.get_fonts returns empty; builtin-font fallback tests continue to execute"

test_package_tests:
  - file: "test_pygame.py"
    description: "Imports required native modules and performs 34 core assertions across dummy SDL video/event initialization, pixel drawing and presentation, PNG load/save plus invalid input, font rendering, audio mixing, immediate channel stop with a queued sound, and package metadata. If HNP AppSpawn rejects the user-path dlopen with E212, the test emits an honest static artifact result instead."
    command: "unset SDL_DYNAMIC_API && python3 test_pygame.py --work-dir /data/local/tmp/pygame-test"
    framework: python
    discovered: 34
    negative_control: "--self-test-failure runs all functional checks, injects assertion 35, and must return exit_code=1"
    result_marker: "HMBS_TEST_PACKAGE_RESULT reports the live 34 assertions or the actual read-only static E212 artifact checks; HMBS_UPSTREAM_TEST_RESULT is re-emitted from res/tests/upstream-test-summary.json; the final command layer unsets SDL_DYNAMIC_API and any SDL override failure diagnostic fails the test"

assertion_count: 34
e212_static_check_count: 10
