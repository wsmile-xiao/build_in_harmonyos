software: pygame
display: "pygame"
description: "Python game and multimedia framework built on SDL2"
category: gfx
homepage: "https://www.pygame.org/"
license: LGPL-2.1-or-later
build_system: setuptools

ohos_adaptation:
  key_points:
    - "Builds CPython 3.12 native extensions and a cp312-ohos_aarch64 wheel"
    - "Derives private shared SDL2 and SDL_mixer runtimes from published PIC-static packages"
    - "Signs packaged extension and bundled runtime ELF files for HarmonyOS"
    - "Runs upstream tests with SDL dummy video and audio drivers"
  common_dependencies:
    - sdl2
    - sdl2-image
    - sdl2_mixer
    - sdl2_ttf
  limitations:
    - "PortMidi, X11 clipboard, and Linux V4L2 camera modules are not built"
    - "Visible windows require an ArkUI surface provider and a future migration to the SDL2 NativeWindow dependency line"

versions:
  "2.6.1":
    status: built
    build_date: "2026-09-06"
    conan_ref: "pygame/2.6.1"
