software: perl-module-cpmfile
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.006/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.006"

# 构建系统类型（顶层字段，供 verify 检查）
build_system: perl-build-tiny

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"
compile_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SK/SKAJI/Module-cpmfile-0.006.tar.gz"

  # 源码校验和
  sha256: "1bc976e2937724896c9f6eae9e5dca981e27f98430b92de270ee3514fd00ac0f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Build.PL"
    - "./Build"
    - "./Build test"
    - "./Build install"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "Module::Build::Tiny/0.047"
    - "YAML::PP/0.036"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块，无需 C/XS 编译，不受 SELinux HMDFS 限制"
  - "Module::Build::Tiny 构建系统在鸿蒙平台正常工作"
  - "YAML::PP 依赖正常解析，不影响 cpmfile 功能"
  - "Perl 5.42.0 系统环境满足模块运行要求"
