# 软件级 manifest — perl-module-cpmfile
# 文件位置: archives/p/perl-module-cpmfile/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: perl-module-cpmfile
description: "Perl module for parsing cpmfile (cpm.yml) dependency format"

homepage: https://metacpan.org/pod/Module::cpmfile
repository: https://github.com/skaji/cpmfile
license: perl_5

# 运行时依赖
runtime_dependencies:
  - "perl >= 5.008001"
  - "YAML::PP >= 0.036"
  - "CPAN::Meta (core)"
  - "Scalar::Util (core)"

# 构建依赖
build_dependencies:
  - "Module::Build::Tiny >= 0.047"
  - "perl >= 5.008001"

# 版本索引
versions:
  - version: "0.006"
    status: published
    build_date: "2026-06-18"
    build_system: perl-build-tiny
