knowledge_gained:
  - "autotools 项目的平台白名单可能在预生成的 configure 里，只改 configure.ac 无效"
  - "config.sub 把 aarch64-linux-ohos 规范化成 aarch64-unknown-linux-ohos，configure 的 case 分支要按 linux-ohos 匹配"
  - "shell 的 case 模式是前缀匹配，linux*) 会吞掉 linux-ohos，OHOS 分支必须写在前面"
  - "2021 年代 config.guess 的分支是 echo/exit 风格，末尾没有 echo $GUESS，移植旧补丁时不能沿用 GUESS= 写法"
  - "clang 不定义 __FLOAT_WORD_ORDER__（gcc 定义），依赖它的字节序判断会静默退化"
  - "clang 在 aarch64 上 long double 为 IEEE binary128，x87 位操作惯例不适用"
  - "softfloat 的 __VFP_FP__/__ARMEB__ 是 32 位 ARM 宏，aarch64 编译器都不定义，FPA 字交换分支被误选导致双精度算术全错"
  - "conan 的 patch() 需要 git 风格补丁头才能创建新文件，diff -uN 的裸头会报 target file does not exist"
