package: pcc-libs/1.2.0-devel-20211015
homepage: "https://github.com/PortableCC/pcc-libs"

# Upstream test discovery:
#   the tree ships no tests/ directory, no ctest/pytest suite and no
#   `make check` target - only the runtime sources and their Makefiles.
#   See notes.md ("Upstream test inventory") for the census evidence.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package's own assertions (R34: real API calls, not prints).
test_package_tests:
  - file: consumer.c
    description: >-
      Calls libpcc (64-bit integer helpers, signbit family, complex
      long-double multiply/divide) and libpccsoftfloat (IEEE arithmetic,
      conversions, ordering comparisons, rounding-mode control) and asserts
      on the returned values: 46 portable consumer assertions, plus 14
      HarmonyOS-specific cases (prefixes OHOS_01..OHOS_03) that verify the
      properties of the *packaged* runtime on HarmonyOS PC / AArch64 rather
      than portable arithmetic.  Every OHOS case performs a real runtime call
      or reads an installed artifact — no print-only or environment-echo
      checks:
        OHOS_01 (6) LP64 + IEEE binary128 ABI layout the patches target, with
                    binary128 operands driven through __signbitl/__mulxc3
        OHOS_02 (4) the installed artifacts carry the AArch64 ABI: ELF64/
                    AArch64 class of libpcc.a, libpccsoftfloat.a and the
                    csu/ohos startup objects (crtbegin.o/crtend.o), read from
                    PCC_LIBS_ROOT exported by the recipe
        OHOS_03 (4) target libc/ABI the runtime is built for (binary128 long
                    double, AArch64 char signedness, special-value encoding
                    recognised by the compiler's own builtins)
    command: "./consumer"

# Total assertions executed by test_package/consumer.c: 46 portable + 14 OHOS.
assertion_count: 60
# OHOS-specific subset of the cases above (OHOS_01..OHOS_03).
ohos_specific_cases: 14
# Machine-readable summary emitted by consumer.c for log parsers:
#   HMBS_TEST_PACKAGE_RESULT={"total":60,"passed":60,"failed":0,"skipped":0,
#                             "ohosCases":14,"ohosPassed":14}