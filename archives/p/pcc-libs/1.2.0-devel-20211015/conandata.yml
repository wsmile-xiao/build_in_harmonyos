# Source URL + SHA256 + patches.  Single source of truth for the recipe.
#
# R39: the URL points at the OFFICIAL upstream repository, PortableCC/pcc-libs,
# which is maintained by the pcc project itself (all commits by
# Anders Magnusson <ragge@tethuvudet.se>, the pcc maintainer; Wikipedia and the
# project listings name github.com/portablecc as the pcc repository).  The
# historical distribution site pcc.ludd.ltu.se is no longer resolvable
# (verified 2026-10-02: DNS failure), so the GitHub org is the only official
# source that remains reachable.  Upstream publishes no release/tag for the
# devel line, so the recipe pins the archive of commit 5fd7d9e34419 (2021-10-14)
# -- the last tree before the 2021-10-15 CVS cutoff that the task version
# `1.2.0-devel-20211015` refers to.  The sha256 pins the exact tree, so the
# archive is reproducible regardless of any later movement on the branch.

sources:
  "1.2.0-devel-20211015":
    url: "https://github.com/PortableCC/pcc-libs/archive/5fd7d9e3441968c03914cdc1e963ea55a943284b.tar.gz"
    sha256: "1ec80c4adacb09a22fa04e8abde4f0a014b6f3c77945794da5a0ea31d468744d"
    tar_format: "tar.gz"

patches:
  "1.2.0-devel-20211015":
    - patch_file: "patches/0001-autotools-ohos-triplet.patch"
      patch_description: >-
        Teach the bundled config.guess/config.sub the HarmonyOS target triple,
        so configure accepts aarch64-linux-ohos instead of aborting with
        "system `ohos' not recognized".  config.guess is extended with a
        HarmonyOS branch (echo/exit style, as this vintage requires) so the
        build side also resolves on real hardware.
      patch_type: "portability"
    - patch_file: "patches/0002-configure-ohos-platform.patch"
      patch_description: >-
        Add the linux-ohos target-OS branch to configure.ac and to the
        pre-generated configure script that the build actually executes.
      patch_type: "portability"
    - patch_file: "patches/0003-libpcc-aarch64-long-double.patch"
      patch_description: >-
        Add the AArch64 IEEE binary128 layout to the long-double half of
        libpcc/cxmuldiv.c; upstream only implemented x87 and 128-bit big-endian
        layouts and errored out for anything else.
      patch_type: "portability"
    - patch_file: "patches/0004-libpcc-float-word-order.patch"
      patch_description: >-
        Derive libpcc/signbit.c's float word order from __BYTE_ORDER__ when the
        compiler does not define __FLOAT_WORD_ORDER__ (clang does not).  Without
        it every little-endian target read mantissa bits instead of the sign,
        which made the complex helpers crash on ordinary finite inputs.
      patch_type: "bugfix"
    - patch_file: "patches/0005-libsoftfloat-aarch64-natural-order.patch"
      patch_description: >-
        Keep AArch64 softfloat doubles in natural (low word first) order.  The
        upstream aarch64-gcc.h selects the FPA word-swap branch with the 32-bit
        ARM macros __VFP_FP__/__ARMEB__, neither of which an AArch64 compiler
        defines, so every double-precision bit pattern was word-swapped and all
        double arithmetic returned garbage.
      patch_type: "bugfix"
    - patch_file: "patches/0006-csu-ohos-startup.patch"
      patch_description: >-
        Add the csu/ohos startup objects, reusing the Linux sources but sizing
        both the ctor and dtor tables from __SIZEOF_POINTER__ rather than the
        x86-only __x86_64__ macro (aarch64 has no __x86_64__, which would leave
        the dtor table with 32-bit entries on a 64-bit target).
      patch_type: "portability"
    - patch_file: "patches/0007-configure-umask-022.patch"
      patch_description: >-
        Create config.status's temporary directory with umask 022 instead of
        077.  Autoconf creates `./confXXXXXX` via `umask 077 && mktemp -d`, and
        on the HarmonyOS HMDFS-backed storage the resulting 2700 directory is
        not writable by the very process that created it, so config.status dies
        with "./confXXXXXX/subs1.awk: Permission denied" / "could not setup
        config files machinery".  Repeated for the mkdir fallback branch.
      patch_type: "portability"
