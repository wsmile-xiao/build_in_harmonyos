software: pcc-libs
display: "pcc 运行时库"
description: "Portable C Compiler 的运行时库（libpcc / libpccsoftfloat / csu）"
category: build-tool
homepage: "https://github.com/PortableCC/pcc-libs"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游平台白名单不含 OHOS，且真正执行的是预生成的 configure 脚本，configure.ac 与 configure 两处都要加 linux-ohos 分支。"
    - "config.sub 把目标 OS 规范化为 linux-ohos；shell case 是前缀匹配，分支必须写成 linux-ohos* 并排在 linux*) 之前。"
    - "clang 不定义 __FLOAT_WORD_ORDER__，signbit.c 的字节序判断失效，导致 __signbitl 读错位、复数例程崩溃，需回退到 __BYTE_ORDER__。"
    - "AArch64 的 long double 是 IEEE binary128，上游 cxmuldiv.c 只实现了 x87 与 128 位大端布局。"
    - "libsoftfloat 没有 aarch64 架构目录（arm/ 是 32 位 ARM，且 FPA 双字序不适用）。"
    - "csu 没有 ohos 目录；直接复用 linux/ 会因 __x86_64__ 未定义而生成 32 位 ctor/dtor 表项。"
  common_dependencies: []

versions:
  "1.2.0-devel-20211015":
    status: built
    build_date: "2026-10-02"
    conan_ref: "pcc-libs/1.2.0-devel-20211015"