package: plod/1.9
homepage: "https://web.archive.org/web/20160821040241/https://deer-run.com/~hal/plod/"

# The release contains eight files. There is no tests/ directory and its
# Makefile exposes only all, plod, install and clean targets.
upstream_test_source: false
upstream_test_url: ""
upstream_tests_exist: false
upstream_test_audit: "PLOD 1.9 release audited: 8 files; no test/tests directory, no test source files, no CTest/pytest registrations, and Makefile exposes only all, plod, install and clean targets."
upstream_check_command: "none (no upstream test target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_type: functional-smoke
test_sources:
  - "test_plod.sh"

test_package_tests:
  - file: test_plod.sh
    description: "Verify executable mode + OHOS HNP shebang, Perl syntax, one-line log write, -C readback, and OHOS adaptation markers (no host perl/crypt paths, cleared encryption default)"
    command: "sh test_plod.sh <perl> <plod> (run directly on HarmonyOS)"

assertion_count: 5
