# test_package/MANIFEST.yml — pipemeter 1.1.5
# 上游官方测试声明（CI L0e 读取，R51 上游测试三步法第 1 步的清点结果）

package: pipemeter/1.1.5
homepage: "https://launchpad.net/pipemeter"

# ── 上游测试清点 ─────────────────────────────────────────────
# tarball 内容清单（22 个条目 = 20 个普通文件 + 2 个目录项）里没有 tests/ 目录、
# 没有 spec 测试、
# Makefile.in 里没有 check 目标，configure 也不生成 CTest/pytest 注册项。
# 唯一的测试入口是根目录的 testscript.sh —— 它把 200M 样本的计时采样
# 追加进 results.txt 并要求执行人“把结果邮件给作者”，属于性能基准
# 采集脚本，脚本内 0 条断言，除开头 `[ ! -x ./pipemeter ] → exit 1` 这一条前置
# 守卫外没有任何失败判定（计时命令失败不会中断也不会改退出码），不是回归测试。
upstream_check_command: null          # 上游没有 make check
upstream_test_in_build: false         # testscript.sh 未集成进 conanfile build()
upstream_test_command: "sh testscript.sh"

upstream_tests:
  - file: testscript.sh
    source: pipemeter-1.1.5/testscript.sh
    description: "上游唯一测试入口：dd 造 200M 样本 → /usr/bin/time 计时裸 cat ×2 → 计时 cat|pipemeter ×2 → 采集 /proc/cpuinfo、free -m、uname -a 追加进 results.txt；无断言，结果靠人工回寄作者"
    command: "sh testscript.sh"
    assertion_count: 0
    ohos_caveat: "OHOS toybox time 只支持 -p/-v，不支持上游脚本使用的 GNU -a/-o，原样执行时 4 个计时步骤全部报 time: Unknown option 'a'，采样数据缺失；已在本地以语义等价的 /usr/bin/time -p … 2>>results 逐步实跑（见 notes.md §上游测试）"

# ── 适配层补充测试（test_package L1）─────────────────────────
test_package_tests:
  - file: pump.c
    description: "测试源码：经 CMake 编译为 OHOS aarch64 可执行文件 pump，按参数精确产出已知字节数的可校验数据流（默认 524288 B），充当 pipemeter 的上游生产者（R34 实质依赖：必须编译+执行才产断言输入）"
    command: "cmake --build <build> && pump [bytes]"
  - file: CMakeLists.txt
    description: "编译 pump.c；刻意不 find_package/target_link_libraries —— pipemeter 是 application 包，不导出库与 CMake config"
    command: "cmake -S . -B <build>"
  - file: smoke.sh
    description: "真实驱动包内 pipemeter 二进制的 8 项断言：T1 版本串 v1.1.5、T2 512KiB 流经管道后计量列精确为 512.00k、T3 stdout 透传字节精确 65536（不吞不改数据面）、T4 -f 多文件累加 1M+512k 报 1.50M、T5 -b 64k 块大小回显 64.00k、T6 非法 -i 0 退出码 1、T7 缺失 -f 文件退出码 2、T8 pump→pipemeter 端到端计量三方一致（pump 自报 = 文件字节 = 计量列 512.00k = 透传字节）"
    command: "sh smoke.sh <pkg>/bin/pipemeter <pump> 524288"

ohos_note: "pump 是新编译的 ELF，在设备上须经 binary-sign-tool 自签名且放到非 HMDFS 的 /data 路径下才能执行（与 archives/l/libxext/1.3.7/test_package 同构做法）；conanfile.py 的 test() 完成签名、staging 与清理"

# 上游 testscript.sh 0 断言 + test_package 8 项断言
assertion_count: 8
