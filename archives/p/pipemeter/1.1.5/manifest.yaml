# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E114 复现：HMDFS 上 (umask 077 && mktemp -d ./confXXXXXX) 产出 drwx--S--- 目录，属主亦不可写，configure 报 'could not setup config files machinery'；把 mktemp 换成普通 mkdir -p 即可，chmod 无法作为对策  (knowledge_ref: E114)"
  - "OHOS 无 GNU install：/bin 不在 PATH 且 toybox install 不支持 -D/-t。带 install-sh 的 autotools 源码包应把安装规则改写成 sh ./install-sh -c -m MODE src dst  (knowledge_ref: E174)"
  - "手写 Makefile.in（无 VPATH/@srcdir@）的 autoconf 项目在 conan2 basic_layout 下必然 out-of-tree 失败（No rule to make target '<x>.c'），需 self.folders.build = self.folders.source 强制 in-tree  (knowledge_ref: E519)"
  - "OHOS toybox time 仅支持 -p/-v；上游 testscript.sh 依赖 GNU time 的 -a/-o，原样执行会静默丢采样（脚本无 set -e，退出码恒 0），需按步骤用 `time -p … 2>>file` 等价实跑  (knowledge_ref: E402)"
  - "pipemeter 在传输不足 1 秒时速率列显示 -1.00B/s（上游 avg_bytes 除法在 elapsed<1 时的显示行为），字节计数仍准确；把样本放大到 >1s（32M 加 sleep）速率显示正常  (knowledge_ref: notes)"

