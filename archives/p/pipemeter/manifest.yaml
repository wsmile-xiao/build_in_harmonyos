software: pipemeter
display: "pipemeter"
description: "Command-line pipe throughput / ETA meter (stdin -> stdout progress reporter)"
category: utility
homepage: "https://launchpad.net/pipemeter"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "单文件 C CLI 工具（pipemeter.c），autoconf configure + 手写 Makefile.in，无 automake、无 config.guess/config.sub、无 AC_CANONICAL_HOST"
    - "零 Conan 依赖：configure 只探测 getopt.h/getopt_long 与 pow，OHOS musl sysroot 全部满足"
    - "HMDFS 忽略 umask/chmod，configure 的 mktemp -d 临时目录（drwx--S---）连属主都写不进去 → config.status 崩在 'could not setup config files machinery'（E114），补丁改用普通 mkdir -p"
    - "OHOS 没有可用的 install（/bin 不在 PATH，toybox install 不支持 GNU -D/-t）→ 安装规则改走 tarball 自带的 autoconf install-sh"
    - "上游 Makefile.in 无 VPATH，必须 in-tree 构建（folders.build = folders.source），否则 make 报 No rule to make target 'pipemeter.c'"
    - "上游唯一测试入口 testscript.sh 是 0 断言的性能采样脚本，且依赖 GNU time 的 -a/-o（OHOS toybox 只支持 -p/-v）"
  common_dependencies: []

versions:
  "1.1.5":
    status: built
    build_date: "2026-09-07"
    conan_ref: "pipemeter/1.1.5"
