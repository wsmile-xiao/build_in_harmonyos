# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS：config.status 以 umask 077 创建 ./confXXXXXX 临时目录后，构建进程对 0700 目录没有写权限（Permission denied），Makefile 生成失败——configure 需改为 umask 022 创建临时目录（ref: E011；retry/asterisk 类同款修法）"
  - "autoconf 2.60 生成的 configure 内联处理 build/host（无 AC_CANONICAL_HOST 时不需要 config.guess/config.sub）；上游发行包缺这两个辅助文件也不影响 configure 与交叉/本机构建（ref: E490 同类、本包 0001-configure.patch）"
  - "pasmo 0.5.3 无 --version/--help 开关（仅无参数时打印版本横幅 'Pasmo v. 0.5.3'）；平台 CI L2 冒烟探测 --version/--help 失败为非阻塞告警（L2_RESULT=skip），不影响 CI 判定（ref: test_package/MANIFEST.yml、reports/test-report.md）"
  - "pasmo 0.5.3 无任何上游测试（无 tests/、无 TESTS/check_PROGRAMS，make check 为空目标执行 0 用例）；上游自 0.5.5 起才有 make check 测试套件（ref: test_package/MANIFEST.yml upstream_test_inventory）"
  - "pasmo.speccy.org 对 Python 默认 User-Agent（python-requests/python-urllib）直接断开连接（RemoteDisconnected），curl/wget 形态可用；conan get() 需以 headers 传 curl UA 才能下载该官方源（ref: conanfile.py source()、notes.md 问题记录）"
  - "--prl 格式对未铺满 0x100-0x1FF 页的程序会报 'PRL genration failed: out of sync'（上游行为，与平台无关），不作为消费者测试断言（ref: reports/test-report.md 2.4）"

