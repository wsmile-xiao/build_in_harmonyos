# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: pasmo/0.5.3
homepage: "https://pasmo.speccy.org/"

# 上游测试命令（用于 make -n check / ctest -N / meson test --list 分析）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 0.5.3 不含任何测试套件；build() 仍执行 make check 作为"零用例"证据
upstream_test_in_build: false
upstream_test_command: "make check（automake 空目标，实测 0 用例：Nothing to be done for 'check'）"

# 上游实际运行的测试程序：无（清点证据见 upstream_test_inventory）
upstream_tests: []

# R51 上游测试清点证据（适配前申报）
upstream_test_inventory:
  tests_directory: false
  makefile_am_tests: false
  makefile_am_check_programs: false
  configure_test_options: 0
  make_check_cases: 0
  evidence:
    - "解压树（.orig，69 个文件）无 tests/、test/、Test/ 目录；34 个 *.asm 均为 Makefile.am EXAMPLE_ASM 示例（EXTRA_DIST），非自动化测试"
    - "Makefile.am 仅 bin_PROGRAMS = pasmo；无 TESTS / check_PROGRAMS / check-local / TESTS_ENVIRONMENT"
    - "configure.ac 仅 AC_PROG_CXX + AC_CONFIG_FILES([Makefile])；configure 无 --enable-test* 开关"
    - "make check 退出码 0 且不执行任何用例（automake check-am 空目标，日志 'Nothing to be done for check'）"
    - "上游测试套件自 0.5.5 起才加入（官网发布说明：'Test suite: use make check'），0.5.3 无同类入口"

# test_package 中自带的测试（消费者视角验证，R51 无上游测试场景）
test_package_tests:
  - file: test_pasmo.sh
    description: >-
      22 条 TAP 断言，真实执行已安装二进制：无参数用法横幅与非零退出；
      --bin 与默认格式的逐字节比对；Intel HEX 记录与校验和；多指令程序
      （手工核验操作码）；IN/OUT 固定端口编码；未定义符号的 stderr 诊断与
      非零退出（0.5.3 退出码修复）；--err 重定向；INCLUDE (-I)；符号表；
      --nocase；--bracket；Spectrum TAP（33 字节逐字节，含双块校验和）；
      TZX（49 字节逐字节）；+3DOS（PLUS3DOS 魔数 + 代码偏移）；--tapbas
      BASIC loader 块；Amsdos 头文件名与代码尾部；MSX 15 字节逐字节；
      CP/M 86 CMD 载荷；--86 8086 后端逐字节；非法操作数组合非零退出
    command: "sh test_pasmo.sh"

# 测试断言总数（= test_pasmo.sh 输出的 TAP 行数）
assertion_count: 22
