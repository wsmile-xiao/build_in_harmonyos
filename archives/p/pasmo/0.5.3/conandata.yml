# conandata.yml — pasmo 0.5.3
# 官方源：作者项目站 pasmo.speccy.org（R39/PF7；CI 自动追加镜像 fallback）。
# sha256 已对官方 .tgz 逐字节核验（设备下载后 sha256sum，
# 与 builds/pasmo-0.5.3.work/.tarball-sha256 记录一致）。

sources:
  url: "https://pasmo.speccy.org/bin/pasmo-0.5.3.tgz"
  sha256: "db3c41cac16df5966fcca4719bb218af78224de13785b222d1d8e292fc87f1eb"

patches:
  - patch_file: "patches/0001-configure.patch"
    patch_description: >-
      configure 生成的 config.status 以 umask 077 创建临时目录；HMDFS 上
      0700 目录对构建进程不可写（知识 E011），导致 Makefile 生成失败
      （Permission denied）。改为 umask 022 创建，使 setgid 共享目录保持可写。
      POSIX 可移植性修复：无平台宏、无系统前缀注入（R8/PF5/PF6 合规）。
    patch_type: "portability"
