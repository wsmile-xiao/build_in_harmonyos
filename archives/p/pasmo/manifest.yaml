# 软件级 manifest — pasmo
# 文件位置: archives/p/pasmo/manifest.yaml

software: pasmo
display: "pasmo"
description: "便携式 Z80 交叉汇编器（多格式输出 + 8086 代码生成）"
category: utility
homepage: "https://pasmo.speccy.org/"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "上游自带 autoconf 2.60 生成的 configure（configure.ac 仅 AC_PROG_CXX，无 AC_CANONICAL_HOST）——无需 config.guess/config.sub，直接用 Conan 工具链的 OHOS clang 执行 configure && make"
    - "configure 生成的 config.status 以 umask 077 创建临时目录，HMDFS 上不可写（E011）→ 补丁 0001-configure.patch 改为 umask 022"
    - "上游 0.5.3 无测试套件（make check 为空目标，0 用例）；test_package 补全 22 条消费者回归（逐字节比对）"
    - "pasmo 0.5.3 无 --version/--help（无参数打印版本横幅），平台 CI L2 探测为非阻塞告警"
    - "make -j1：HMDFS jobserver FIFO 不支持并行 make（E074）"
  common_dependencies: []

versions:
  "0.5.3":
    status: built
    build_date: "2026-09-21"
    conan_ref: "pasmo/0.5.3"
