# test_package/MANIFEST.yml
package: postgresql-pllua/2.0.12
homepage: "https://github.com/pllua/pllua"

upstream_check_command: "make installcheck"
upstream_test_in_build: true
upstream_test_command: "make installcheck"

upstream_tests_exist: true
upstream_test_framework: pg_regress
upstream_test_count: 9
upstream_test_groups:
  - pllua
  - trusted
  - arrays
  - types
  - numerics
  - rowdatum
  - spi
  - triggers
  - paths
upstream_test_runner: "make installcheck (initdb cluster -> pg_ctl start -> make install DESTDIR -> createdb -> make installcheck)"
upstream_test_dependency: "running PostgreSQL 18.3 server (postgres + initdb + pg_ctl + createdb binaries)"

upstream_test_audit: |
  Audited upstream REL_2_0_12 source tree. Upstream has pg_regress groups
  listed in serial_schedule, each with matching non-empty sql/<name>.sql
  and expected/<name>.out oracle. pg_regress needs a running PostgreSQL
  server. The vendored PG 18.3 is built fully (configure -> make -> make
  install) producing postgres/initdb/pg_ctl/createdb server binaries.

test_package_tests:
  - file: test_pllua.c
    description: "Smoke test: verifies pllua.so exists and is a valid ELF shared library, plus control/SQL files present"
    command: "test_pllua"
    assertions: 4
    executed: true
    passed: true

assertion_count: 13
assertion_executed: 13
assertion_skipped: 0
