software: perl-module-install
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.21/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.21"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/Module-Install-1.21.tar.gz"

  # 源码校验和
  sha256: "fbf91007f30565f3920e106055fd0d4287981d5e7dad8b35323ce4b733f15a7b"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: perl

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=~/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "YAML-Tiny/1.76"
    - "File-Remove/1.61"
    - "Module-ScanDeps/1.37"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Pure Perl module using Makefile.PL + ExtUtils::MakeMaker — no C compilation required"
  - "Must use INSTALL_BASE (not PREFIX) to control install path for Perl modules"
  - "Runtime dependencies (YAML::Tiny, File::Remove, Module::ScanDeps) must be installed before make test"
  - "Module::Install is loaded via 'use inc::Module::Install' not 'use Module::Install' — by design"
  - "auto_install directive generates interactive prompts — use 'echo y | perl Makefile.PL' for automation"
  - "No patches or source modifications needed for OpenHarmony platform — fully compatible"
