# test_package/MANIFEST.yml — pmix 5.0.11
# 上游官方测试声明文件（CI build_and_test.sh L0e 强制要求）
package: pmix/5.0.11
homepage: "https://pmix.org/"

# 上游测试命令（上游源码树支持 make check，含 simple/单元测试）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 make check 依赖完整测试基础设施（test/run_tests*.pl，需要 perl + mpirun 环境），
# OHOS CI 环境不可用；以 test_package 消费者视角的 API 端到端测试替代。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（参考，不在 CI 执行）
upstream_tests:
  - file: test/simple/simptest.c
    source: pmix-5.0.11/test/simple/simptest.c
    description: "上游 server+client 单进程端到端握手测试（本配方 test_pmix.c 采用同模式）"
    command: "./test/simple/simptest"
  - file: test/simple/simpclient.c
    source: pmix-5.0.11/test/simple/simpclient.c
    description: "上游客户端 API 测试（PMIx_Init/Put/Commit/Fence/Get/Finalize）"
    command: "./test/simple/simpclient"
  - file: test/simple/simpdmodex.c
    source: pmix-5.0.11/test/simple/simpdmodex.c
    description: "上游直接 modex 测试"
    command: "./test/simple/simpdmodex"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_pmix.c
    description: "端到端 API 握手：PMIx_Get_version 断言 5.0.11 + PMIx_server_init/setup_fork + fork 子进程 PMIx_Init(PMIX_SUCCESS, nspace/rank 合法)/PMIx_Finalize + PMIx_server_finalize（simptest 模式，8 断言）"
    command: "./test_package/test_pmix"
  - file: conanfile.py::test()
    description: "pmix_info 版本冒烟（断言输出含 'PMIX: 5.0.11'）+ 包布局断言（include/pmix.h、lib/libpmix.so、bin/pmix_info）"
    command: "conan create -tf"

# 测试断言总数（C 程序 8 项 + Python 侧 5 项）
assertion_count: 13
