patches:
  - patch_file: "patches/0001-config-config.guess.patch"
    patch_description: "config.guess: recognize HarmonyOS (aarch64-unknown-linux-ohos) and relax umask 077→022 for HMDFS mktemp compatibility"
    patch_type: "portability"
  - patch_file: "patches/0002-config-config.sub.patch"
    patch_description: "config.sub: accept ohos OS (ohos-linux map, OS whitelist, kernel-os whitelist) so linux-ohos triplets validate"
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: "configure: relax embedded config.status umask 077→022 so mktemp -d temp dir is writable on HMDFS (E011)"
    patch_type: "portability"
