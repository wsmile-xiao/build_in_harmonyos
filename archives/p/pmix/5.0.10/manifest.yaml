software: pmix
version: "5.0.10"
build_system: autotools
status: built
build_date: "2026-05-29"

source:
  url: "https://ghfast.top/https://github.com/openpmix/openpmix/releases/download/v5.0.10/pmix-5.0.10.tar.bz2"
  original_url: "https://github.com/openpmix/openpmix/releases/download/v5.0.10/pmix-5.0.10.tar.bz2"
  mirror_used: ghfast.top
  sha256: ""
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
    - "--prefix=$HOME/usr/local"
    - "CPPFLAGS=-I$HOME/usr/local/include"
    - "LDFLAGS=-L$HOME/usr/local/lib"
  dependencies:
    - libevent/2.1.12
    - hwloc/2.11.0
  cc: clang
  cxx: clang++

patches_applied: []

platform_adaptation:
  config_status_fix: "修改 config.status 第888-896行，将 tmp=`mktemp -d` 替换为 tmp=\".\"，避免临时子目录创建"

knowledge_gained:
  - "pmix 5.0.10 使用 autotools 构建系统"
  - "config.status 临时子目录创建失败是鸿蒙系统权限限制"
  - "绕过方案：修改 config.status 的 tmp 变量赋值，临时文件直接在当前目录创建"
  - "平台识别补丁成功：config.guess/config.sub 可识别 aarch64-unknown-linux-ohos"
  - "configure 成功但原始 config.status 失败，修改后可成功执行"
  - "适用范围：所有使用 mktemp -d 创建临时子目录的 autoconf 生成脚本"

install_paths:
  bin: bin/
  lib: lib/libpmix.so.2.13.10
  include: include/pmix.h
  pkgconfig: lib/pkgconfig/pmix.pc
