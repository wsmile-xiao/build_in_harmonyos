software: pmix
display: "pmix"
description: "Process Management Interface for Exascale — portable PMI library for HPC and MPI runtimes"
category: parallel
homepage: "https://pmix.org/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "tarball 自带 config.guess/config.sub (2021-01-25) 不识别 HarmonyOS，需平台识别补丁（config.guess 加 HarmonyOS 分支 + config.sub 三处 ohos 白名单，E007/E072）"
    - "HMDFS 上 umask 077 创建的 0700 属主目录连属主都不可写，config.guess 与 configure 内嵌 config.status 模板的 mktemp 临时目录创建失败，umask 077→022 补丁修复（E011）"
    - "PMIx 5.x 客户端 PMIx_Init 无服务器时返回 PMIX_ERR_UNREACH(-25)，端到端 API 测试须按上游 simptest 模式（server_init + register_client + setup_fork + fork client）"
    - "pmix_info --version 走 CLI help 机制只打印帮助文本，版本断言用无参数输出的 'PMIX: 5.0.11' 行"
    - "依赖 libevent 与 hwloc 通过 Conan 管理依赖链（--with-libevent/--with-hwloc 指向 conan package_folder）"
  common_dependencies:
    - libevent
    - hwloc

versions:
  "5.0.11":
    status: built
    build_date: "2026-09-07"
