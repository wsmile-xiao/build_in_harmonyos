# test_package/MANIFEST.yml — pchar 1.5
# CI L0e requires this file to exist.

package: pchar/1.5
homepage: "https://www.kitchenlab.org/www/bmah/Software/pchar/"

# pchar has no upstream test suite (no `make check` target)
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: conanfile.py
    method: test
    description: "Runs pchar --version (prints version, exit 0) and pchar --help (prints usage, exit 0) against the installed binary"
