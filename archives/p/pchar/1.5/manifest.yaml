software: pchar
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://www.kitchenlab.org/www/bmah/Software/pchar/pchar-1.5.tar.gz"

  # 源码校验和
  sha256: "7019297084f1000557a019501532ecae67772851717329cc02227f5c17e36d27"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表（--prefix=/ 由 AutotoolsToolchain 默认注入）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
  - "0003-pc-h-cxx-bool-typedef.patch"
  - "0004-makefile-srcdir-dest-install.patch"
  - "0005-resulttable-abs-long-cast.patch"
  - "0006-pctest-remove-register.patch"
  - "0007-main-cc-long-options.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pchar 是命令行工具(application)，package_info 使用 bindirs 而非 libs"
  - "2001 年 autoconf 2.13 代 config.guess/config.sub 不认识 HarmonyOS(aarch64)：需同时打 guess 与 sub 补丁"
  - "OHOS 设备文件系统大小写不敏感：tar 包内 VERSION 文件会被 -I$(srcdir) 下的 C++ <version> 头解析命中，必须去掉 -I$(srcdir)"
  - "pchar Makefile.in 不支持 DESTDIR 且装到 sbindir：改 install 规则为 ${DESTDIR}${bindir} 才能让 conan 的 DESTDIR 安装落入包 bin/"
  - "configure 的 sizeof bool 探测对 C++ 报告 0，pc.h 会重定义内建 bool，需 !defined(__cplusplus) 保护"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/.tmp/pchar-src/gen/pristine/pchar-1.5
  source_work_dir: /storage/Users/currentUser/.tmp/pchar-src/gen/patched/pchar-1.5
  source_orig_hash: bda9020e00cd0c5c
  source_work_hash: a6ad94881345b55c
  generated_at: '2026-10-11T19:54:26'
  patches_count: 7

patch_classification:
