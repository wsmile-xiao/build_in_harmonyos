software: pchar
version: "1.5"
status: built
build_date: "2026-10-11"
homepage: "https://www.kitchenlab.org/www/bmah/Software/pchar/"
license: "public-domain"
source:
  url: "http://www.kitchenlab.org/www/bmah/Software/pchar/pchar-1.5.tar.gz"
  sha256: "7019297084f1000557a019501532ecae67772851717329cc02227f5c17e36d27"
  tar_format: tar.gz
build:
  system: autotools
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
  - "0003-pc-h-cxx-bool-typedef.patch"
  - "0004-makefile-srcdir-dest-install.patch"
  - "0005-resulttable-abs-long-cast.patch"
  - "0006-pctest-remove-register.patch"
  - "0007-main-cc-long-options.patch"

knowledge_gained:
  - "pchar 是命令行工具(application)，package_info 使用 bindirs 而非 libs"
  - "2001 年 autoconf 2.13 代 config.guess/config.sub 不认识 HarmonyOS(aarch64)：需同时打 guess 与 sub 补丁"
  - "OHOS 设备文件系统大小写不敏感：tar 包内 VERSION 文件会被 -I$(srcdir) 下的 C++ <version> 头解析命中，必须去掉 -I$(srcdir)"
  - "pchar Makefile.in 不支持 DESTDIR 且装到 sbindir：改 install 规则为 ${DESTDIR}${bindir} 才能让 conan 的 DESTDIR 安装落入包 bin/"
  - "configure 的 sizeof bool 探测对 C++ 报告 0，pc.h 会重定义内建 bool，需 !defined(__cplusplus) 保护"

patch_classification:
  - file: 0001-config-config.guess.patch
    type: platform
    platform_only: True
    guard: 'none'
  - file: 0002-config-config.sub.patch
    type: platform
    platform_only: True
    guard: 'none'
  - file: 0003-pc-h-cxx-bool-typedef.patch
    type: portability
    platform_only: False
    guard: '__cplusplus'
  - file: 0004-makefile-srcdir-dest-install.patch
    type: portability
    platform_only: False
    guard: 'none'
  - file: 0005-resulttable-abs-long-cast.patch
    type: portability
    platform_only: False
    guard: 'none'
  - file: 0006-pctest-remove-register.patch
    type: portability
    platform_only: False
    guard: 'none'
  - file: 0007-main-cc-long-options.patch
    type: feature
    platform_only: False
    guard: 'none'

build_system: autotools

test_results:
  build_regression_cases: 1
  consumer_assertions: 3
  details: "The upstream tarball has no bundled test suite; the recipe runs a repository-added saved-trace functional regression against pchar."
