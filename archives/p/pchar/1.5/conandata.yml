# conandata.yml — pchar 1.5
# Source: https://www.kitchenlab.org/www/bmah/Software/pchar/

sources:
  url: "http://www.kitchenlab.org/www/bmah/Software/pchar/pchar-1.5.tar.gz"
  sha256: "7019297084f1000557a019501532ecae67772851717329cc02227f5c17e36d27"

patches:
  - patch_file: "patches/0001-config-config.guess.patch"
    patch_description: "Teach 2001-era config.guess to emit aarch64-*-linux-ohos on HarmonyOS"
    patch_type: "portability"
  - patch_file: "patches/0002-config-config.sub.patch"
    patch_description: "Accept aarch64/arm64 CPUs and linux-ohos in config.sub"
    patch_type: "portability"
  - patch_file: "patches/0003-pc-h-cxx-bool-typedef.patch"
    patch_description: "Skip the enum {false,true} bool fallback when compiling as C++ (built-in bool)"
    patch_type: "portability"
  - patch_file: "patches/0004-makefile-srcdir-dest-install.patch"
    patch_description: "Drop -I$(srcdir) (tarball VERSION shadows C++ <version> on case-insensitive FS); install to ${DESTDIR}${bindir} / ${DESTDIR}${mandir}"
    patch_type: "portability"
  - patch_file: "patches/0005-resulttable-abs-long-cast.patch"
    patch_description: "Cast abs() arguments to long to resolve the int/long overload ambiguity under libc++"
    patch_type: "portability"
  - patch_file: "patches/0006-pctest-remove-register.patch"
    patch_description: "Remove the 'register' storage class specifier (removed in C++17)"
    patch_type: "portability"
  - patch_file: "patches/0007-main-cc-long-options.patch"
    patch_description: "Add --version/--help long options via getopt_long for the CI smoke test"
    patch_type: "feature"
