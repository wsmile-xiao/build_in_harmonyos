# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-cgi/4.72
homepage: "https://metacpan.org/pod/CGI"

# 上游测试命令 — CGI 上游 t/ 测试套件（make test）
upstream_check_command: "perl Makefile.PL && make && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - t/ 目录：64 个 .t 测试文件（command_line/html/http/multipart 等）
# - 实测结果：**Files=64, Tests=1603, All tests successful（100%）**——
#   全部测试真实运行通过；首轮 param_list_context.t 缺 Test::Warn
#   测试依赖（退出 2），按"依赖可装则装"cpan 安装 Test::Warn 后
#   1603/1603 全通过（Test::Warn 为测试依赖非运行时，如实记录）
upstream_tests:
  - file: t/
    source: CGI-4.72/t/
    description: "上游 perl 测试套件（64 文件 1603 用例；实测 1603/1603 100% 通过——Test::Warn 测试依赖安装后全过，无受阻）"
    command: "perl Makefile.PL && make && make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_cgi.pl
    description: "消费者测试：真实 API（R34）——CGI->new + param（上游 t/ 核心用法）"
    command: "perl test_cgi.pl <site-perl-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
