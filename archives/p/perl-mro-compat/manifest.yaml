software: perl-mro-compat
display: "MRO::Compat"
description: "Perl extension for Method Resolution Order (MRO) compatibility across Perl versions"
category: system
homepage: "https://metacpan.org/pod/MRO::Compat"
license: Artistic-1.0-Perl
build_system: perl-extutils

ohos_adaptation:
  key_points:
    - "纯Perl模块，无需C编译，无ELF二进制产物"
    - "使用 perl Makefile.PL PREFIX=$DEFAULT_PREFIX 而非 ./configure --prefix="
    - "G0 clean-verify不适用于Perl模块(无./configure脚本)，需手动验证"
    - "MakeMaker生成Makefile后直接 make && make install"
  common_dependencies:
    - perl/5.42.0

versions:
  "0.15-r2":
    status: published
    build_date: "2026-06-24"
    published_as: perl-mro-compat
