software: perl-mro-compat
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.15-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.15-r2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/H/HA/HAARG/MRO-Compat-0.15.tar.gz"

  # 源码校验和
  sha256: "0d4535f88e43babd84ab604866215fc4d04398bd4db7b21852d4a31b1c15ef61"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: perl-extutils
build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl模块使用perl Makefile.PL PREFIX=而非./configure --prefix="
  - "G0 clean-verify不适用于Perl模块(无./configure脚本)，需手动验证"
  - "纯Perl模块无需C编译，make只复制.pm文件到blib"
  - "纯Perl模块不受SELinux HMDFS限制，用户目录可直接加载（对比XS模块需系统目录）"
  - "mro::invalidate_method_cache在Perl 5.42中已更名为mro::method_changed_in"
  - "纯Perl模块零补丁即可在OpenHarmony平台编译安装"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
