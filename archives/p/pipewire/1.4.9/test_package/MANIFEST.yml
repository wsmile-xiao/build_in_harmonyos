# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pipewire/1.4.9
homepage: "https://gitlab.freedesktop.org/pipewire/pipewire"

# 上游测试命令 (用于 meson test 分析)
upstream_check_command: "meson test"
upstream_test_in_build: false
upstream_test_command: "meson test -C build"

# 上游实际运行的测试程序（本 task 探索构建 48 项全通过）
upstream_tests:
  - file: test/test-pwtest.c
    source: pipewire-1.4.9/test/test-pwtest.c
    description: "pwtest 框架自测"
    command: "./test/test-pwtest"
  - file: test/test-properties.c,test/test-array.c,test/test-map.c,test/test-mempool.c,test/test-utils.c
    source: pipewire-1.4.9/test/
    description: "pw utils/properties/map/mempool 单元测试"
    command: "./test/test-pw-utils"
  - file: test/test-lib.c
    source: pipewire-1.4.9/test/test-lib.c
    description: "pipewire 库核心测试"
    command: "./test/test-lib"
  - file: test/test-client.c
    source: pipewire-1.4.9/test/test-client.c
    description: "client 测试"
    command: "./test/test-client"
  - file: test/test-loop.c
    source: pipewire-1.4.9/test/test-loop.c
    description: "loop/data-loop 测试（含 OHOS cancel 回退）"
    command: "./test/test-loop"
  - file: test/test-context.c,test/test-config.c
    source: pipewire-1.4.9/test/
    description: "context/config 测试"
    command: "./test/test-context"
  - file: test/test-support.c,test/test-logger.c
    source: pipewire-1.4.9/test/
    description: "support/logger 测试（含 OHOS 显式 flush）"
    command: "./test/test-support"
  - file: test/test-spa-buffer.c,test/test-spa-control.c,test/test-spa-json.c,test/test-spa-utils.c,test/test-spa-log.c,test/test-spa-node.c,test/test-spa-pod.c
    source: pipewire-1.4.9/test/
    description: "SPA buffer/json/pod/utils 测试"
    command: "./test/test-spa"
  - file: spa/plugins/audioconvert/test-*.c
    source: pipewire-1.4.9/spa/plugins/audioconvert/
    description: "SPA audioconvert 插件测试（7 项）"
    command: "./spa/plugins/audioconvert/test-audioadapter 等"
  - file: spa/plugins/audiomixer/test-mix-ops.c
    source: pipewire-1.4.9/spa/plugins/audiomixer/test-mix-ops.c
    description: "SPA audiomixer 插件测试"
    command: "./spa/plugins/audiomixer/test-mix-ops"
  - file: src/tests/test-filter.c
    source: pipewire-1.4.9/src/tests/test-filter.c
    description: "pw-test-filter（daemon 依赖）"
    command: "./src/tests/pw-test-filter"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：公开 API pw_init/pw_get_library_version/pw_deinit"
    command: "./test_pipewire"
  - file: test_ohos.c
    description: "鸿蒙专项测试：memfd 映射回退 + data-loop cancel 回退"
    command: "./test_ohos"

# 测试断言总数 (近似值)
assertion_count: 2000
