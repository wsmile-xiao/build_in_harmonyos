# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 实测记录 (2026-08-28, pc1-41):
#   cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
#   ctest: 100% tests passed, 0 tests failed out of 9
#   writer_tests 依赖 protobuf(protozero 上游 test/CMakeLists.txt 中
#   PROTOBUF_FOUND 才启用)；本机未安装 protobuf，writer_tests 未启用。
#   完整台账见 reports/.

package: protozero/1.8.2
homepage: "https://github.com/mapbox/protozero"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test/reader_tests.cpp
    source: protozero-1.8.2/test/reader_tests.cpp
    description: "PBF reader 测试 (t/*/reader_test_cases.cpp, Catch2)"
    command: "./reader_tests"
  - file: test/unit/main.cpp
    source: protozero-1.8.2/test/unit/main.cpp
    description: "单元测试 (data_view/basic/buffer/endian/exceptions/iterators/varint/zigzag, Catch2)"
    command: "./unit_tests"
  - file: tools/pbf-decoder.cpp
    source: protozero-1.8.2/tools/pbf-decoder.cpp
    description: "pbf-decoder CLI 工具 + 5 个 ctest 用例 (no-args/help/empty/data/vt + 2 fail 用例)"
    command: "./pbf-decoder"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pbf.cpp
    description: "消费者测试: pbf_writer 编码 → pbf_reader 解码回环断言"
    command: "./test_protozero"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 397