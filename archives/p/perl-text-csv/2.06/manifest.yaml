# 版本级 manifest — perl-text-csv 2.06
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "2.06"

# 软件名
software: perl-text-csv

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-31"
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（CPAN/meta::cpan 官方发行）
  url: "https://cpan.metacpan.org/authors/id/I/IS/ISHIGAKI/Text-CSV-2.06.tar.gz"

  # 源码校验和（sha256，实测）
  sha256: "dfcaec925a788b0ba41e51bc6d16e21b0e98b4c7af9b79395090add75f5e506f"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "Text-CSV-2.06"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required: []
  optional:
    - Text::CSV_XS (recommends，未安装——本配方用捆绑的纯 Perl PP 后端)

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: "package_type=application（python-require 型 conan create 静默跳过构建——perl-algorithm-diff/dataproperty/pytablewriter 先例）；纯 Perl 模块（lib/Text/CSV.pm + CSV_PP.pm），package() 拷 lib/ 到 perl site-lib；运行时 PERL_TEXT_CSV=0 强制 PP 后端（无 XS 编译，规避 hmmac dlopen .so 限制——E212 类问题）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: "纯 Perl 模块（lib/Text/CSV.pm + CSV_PP.pm），META runtime requires 仅核心模块（IO::Handle/Test::Harness/Test::More/perl）；Text::CSV_XS 是 recommends（可选）"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 52723
  failed: 0
  note: |
    上游测试：t/ 目录 41 个 .t 测试文件（prove -l t/ + PERL_TEXT_CSV=0 强制 PP 后端），
    本地实测 **52723/52723（100%）**——All tests successful，零失败。
    其中 40 个 .t 运行，1 个跳过（00_pod 需 Test::Pod 1.00，非安装必需）。
    适配后：test_package R34 真实 perl 加载打包的 Text::CSV + parse CSV
    字符串校验（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Text::CSV 是 CSV 处理薄封装：默认加载 Text::CSV_XS（XS），不可用回退捆绑的纯 Perl Text::CSV_PP——本配方打包 PP 后端并用 PERL_TEXT_CSV=0 强制，规避 XS .so 的 hmmac dlopen 限制（E212 类）；perl site-lib 打包 + application 型配方 + commands.json（R38）"

references:
  - https://metacpan.org/pod/Text::CSV
