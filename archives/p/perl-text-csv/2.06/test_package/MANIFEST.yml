# test_package/MANIFEST.yml — perl-text-csv 2.06
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-text-csv/2.06
homepage: "https://metacpan.org/pod/Text::CSV"

# 上游测试套件：t/ 目录 41 个 .t 测试文件（prove -l t/ 运行，PERL_TEXT_CSV=0 强制 PP 后端）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Text-CSV-2.06/t/*.t
    description: "41 个 .t 测试文件：本地实测 **52723/52723（100%）**（prove -l t/，40 个运行 + 1 个 pod 测试跳过——00_pod 需 Test::Pod 1.00），零失败"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Text::CSV + parse CSV 字符串）
test_package_tests:
  - file: test_text_csv.py
    description: "Loads packaged Text::CSV via perl -I<lib> (PERL_TEXT_CSV=0 forces PP backend) and parses a real CSV string, asserting 3 fields"
    command: "python3 test_text_csv.py"

# 断言总数：1（CSV parse 校验）
assertion_count: 1
