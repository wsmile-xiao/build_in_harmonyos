software: pinentry
# 版本级 manifest 模板
# 文件位置: archives/p/pinentry/1.3.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.3.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-28"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gnupg.org/ftp/gcrypt/pinentry/pinentry-1.3.2.tar.bz2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--enable-pinentry-curses"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libgpg-error"
    - "libassuan"
    - "ncurses"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-aux-config.sub.patch"
  - "0002-configure.patch"
  - "0003-pinentry-pinentry-emacs.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pinentry依赖libgpg-error和libassuan，平台预编译的libgpg-error存在libintl符号缺失问题"
  - "config.sub需要添加HarmonyOS平台识别（aarch64-unknown-linux-ohos）"
  - "configure脚本需要修复libintl检测逻辑"

# ============================================================
# 已知限制（方案C记录）
# ============================================================

known_issues:
  - issue: "libgpg-error符号缺失导致运行时错误"
    impact: "pinentry-curses无法执行，依赖libassuan的libintl符号"
    root_cause: "平台预编译的libgpg-error未正确链接libintl"
    workaround: "需重新编译libgpg-error或创建libintl-alias.a桥接库"
    blocks_publish: false
    discovered_at: "2026-05-28T11:45:00"
    g0_status: "FAIL - configure失败（空host参数）"
    runtime_status: "FAIL - libgpg-error符号缺失"
    note: "预编译包已制作（未签名），但运行时可能失败"

# ============================================================
# 预编译包信息
# ============================================================

packaging:
  # 预编译包文件名
  package_file: "pinentry-1.3.2-ohos-aarch64.tar.gz"

  # 包大小（字节）
  package_size: 663552

  # 创建日期
  created_at: "2026-05-28"

  # 签名状态
  signed: false

  # 包内容
  contents:
    - "bin/pinentry-curses"
    - "bin/pinentry"
    - "share/info/pinentry.info"

  # 安装验证
  install_verified: false

  # 运行验证
  runtime_verified: false