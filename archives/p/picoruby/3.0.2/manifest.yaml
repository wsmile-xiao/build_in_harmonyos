software: picoruby
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.2"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶层字段，质量门禁检查用）
build_system: custom

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/picoruby/picoruby/archive/refs/tags/3.0.2.tar.gz"

  # 源码校验和
  sha256: "33b951be8969570726bc34632fa5e0f332ee6e8ed782b5ec0f8fd5629a6be959"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建命令（非 autotools/cmake 软件的自定义构建命令）
  build_command: "CC=clang CXX=clang++ CFLAGS='-fPIC -O2' LD=clang rake"

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - ruby/4.0.2
    - git/2.45.2
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 环境变量（构建必需）
  env:
    LD: clang
    CC: clang
    CXX: clang++
    CFLAGS: "-fPIC -O2"

  # 编译器
  cc: clang
  cxx: clang++

  # 构建产物（无 make install，手动安装）
  install_method: manual
  binaries:
    - picoruby
    - picorbc
    - picoirb
  libraries:
    - libmruby.a
    - libmruby_core.a

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-picorbc-tmpfile-ohos.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "picoruby 使用 mruby 的 Rake 构建系统，非 autotools/cmake"
  - "构建需要 Ruby 解释器 + git（克隆 GitHub gems）"
  - "LD=clang 必需：避免裸 ld.lld 不链接 libc"
  - "musl 无独立 libm，需创建空 stub libm.a"
  - "tmpfile() 在 OHOS 失败：/tmp 只读，用 mkstemp+TMPDIR 替代"
