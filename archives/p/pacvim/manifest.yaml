software: pacvim
display: "pacvim"
description: "PacVim — an ncurses-based game that teaches Vim commands"
category: game
homepage: "https://github.com/jmoon018/PacVim"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "C++ ncurses game built by raw Makefile (no configure script)"
    - "ncurses is a system-level precompiled package (~/usr/local), not a conan dependency"
    - "OHOS ncurses only provides curses.h (no wide-char cursesw.h) — header patches required"
    - "Makefile patched for DESTDIR support, CXX/PREFIX override, and EXTRA_INC/EXTRA_LIB for ncurses paths"
  common_dependencies:
    - ncurses

versions:
  "1.1.1":
    status: built
    build_date: "2026-06-15"
    conan_ref: "pacvim/1.1.1"
