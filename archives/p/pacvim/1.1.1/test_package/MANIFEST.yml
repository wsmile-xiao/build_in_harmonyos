test_package:
  type: binary-inspection
  entry: conanfile.py
  requires:
    - pacvim/1.1.1
  checks:
    - "binary is AArch64 ELF"
    - "pacvim binary executed (ncurses terminal init detected)"
    - "dynamic dependencies parsed from ELF (ncurses statically linked, R26)"
    - "map data files present in package"
