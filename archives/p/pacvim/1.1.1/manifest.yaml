software: pacvim

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/jmoon018/PacVim/archive/refs/tags/v1.1.1.tar.gz"
  sha256: "c869c5450fbafdfe8ba8a8a9bba3718775926f276f0552052dcfa090d21acb28"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  build_system: makefile
  system: makefile

  # Makefile变量覆盖选项（非autotools configure选项）
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "DESTDIR=$TEST_PREFIX"
    - "CXX=clang++"

  # 编译依赖列表
  dependencies:
    - ncurses

  # 编译器
  cc: clang
  cxx: clang++

  # 编译输出产物
  outputs:
    - bin/pacvim

  # 编译警告
  warnings:
    - "format-security: printw/mvprintw参数非字符串字面量（3处，不影响功能）"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Makefile.patch"
  - "0002-src-globals.h.patch"
  - "0003-src-helperFns.h.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯Makefile项目无configure脚本，需要手动修改Makefile适配：添加DESTDIR、修改CXX/PREFIX为可覆盖、添加EXTRA_INC/EXTRA_LIB指向依赖头文件/库路径"
  - "鸿蒙平台ncurses仅提供curses.h（非wide-char版cursesw.h），需将源码中cursesw.h替换为curses.h"
  - "clang++默认搜索路径不包含~/usr/local/include，需显式添加-I参数"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/pacvim-1.1.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/pacvim-1.1.1.work
