# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-spreadsheet-xlsx/0.18
homepage: "https://metacpan.org/dist/Spreadsheet-XLSX"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/0____________use.t
    source: Spreadsheet-XLSX-0.18.tar.gz/t/0____________use.t
    description: "模块加载测试 (Archive::Zip + Spreadsheet::XLSX)"
    command: "perl -Iblib/lib t/0____________use.t"
  - file: t/1_____loreyna126.t
    source: Spreadsheet-XLSX-0.18.tar.gz/t/1_____loreyna126.t
    description: "读取 XLSX 文件并验证工作表和单元格内容"
    command: "perl -Iblib/lib t/1_____loreyna126.t"
  - file: t/2_____with_chart.t
    source: Spreadsheet-XLSX-0.18.tar.gz/t/2_____with_chart.t
    description: "读取含图表的 XLSX 文件"
    command: "perl -Iblib/lib t/2_____with_chart.t"
  - file: t/3_____invalid_formular.t
    source: Spreadsheet-XLSX-0.18.tar.gz/t/3_____invalid_formular.t
    description: "无效公式处理测试 (SKIP: 发布候选测试)"
    command: "perl -Iblib/lib t/3_____invalid_formular.t"
  - file: t/empty_v_tag.t
    source: Spreadsheet-XLSX-0.18.tar.gz/t/empty_v_tag.t
    description: "空值标签处理测试"
    command: "perl -Iblib/lib t/empty_v_tag.t"
  - file: t/formats.t
    source: Spreadsheet-XLSX-0.18.tar.gz/t/formats.t
    description: "日期/时间/数字/文本格式化测试"
    command: "perl -Iblib/lib t/formats.t"
  - file: t/kwalitee.t
    source: Spreadsheet-XLSX-0.18.tar.gz/t/kwalitee.t
    description: "代码质量测试 (SKIP: 发布候选测试)"
    command: "perl -Iblib/lib t/kwalitee.t"
  - file: t/missing_styles.t
    source: Spreadsheet-XLSX-0.18.tar.gz/t/missing_styles.t
    description: "缺失样式处理测试"
    command: "perl -Iblib/lib t/missing_styles.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/test_spreadsheet_xlsx.sh
    description: "Spreadsheet::XLSX smoke test: 模块加载 + XLSX 解析验证"
    command: "sh test_spreadsheet_xlsx.sh <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 23
