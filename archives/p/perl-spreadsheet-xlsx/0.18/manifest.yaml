software: perl-spreadsheet-xlsx
# 版本级 manifest
# 文件位置: archives/p/perl-spreadsheet-xlsx/0.18/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.18"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/A/AS/ASB/Spreadsheet-XLSX-0.18.tar.gz"

  # 源码校验和
  sha256: "fde689da209df6d3ea96009ff3622075c2c09b59d8837e3bdb14805a955156d7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=/"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl (ExtUtils::MakeMaker)
    - perl-archive-zip (Archive::Zip >= 1.18)
    - perl-spreadsheet-parseexcel (Spreadsheet::ParseExcel)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Spreadsheet::XLSX 是纯 Perl 模块，无需 C 编译，使用 ExtUtils::MakeMaker 构建"
  - "INSTALL_BASE=/ 使文件安装到 DESTDIR/lib/perl5/ 路径"
  - "运行时依赖 Archive::Zip 和 Spreadsheet::ParseExcel 通过 PERL5LIB 环境变量解析"
  - "Spreadsheet::ParseExcel 的子依赖 (OLE::Storage_Lite, Crypt::RC4, Digest::Perl::MD5, IO::Scalar) 需要单独安装"
  - "CI L0e 门禁要求 test_package/MANIFEST.yml 文件存在，需声明上游测试列表"
  - "OpenHarmony /tmp 为只读文件系统，测试中写临时文件需使用 Conan build_folder 或 ~/.opendesk-tmp"
  - "test_package/conanfile.py 必须声明 requirements() 并使用 self.tested_reference_str 引用被测包"

