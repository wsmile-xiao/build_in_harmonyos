package: pgreplay/1.5.0
homepage: "https://github.com/laurenz/pgreplay"

upstream_check_command: "make test"
upstream_test_in_build: true
upstream_test_command: "make test（test/runtest.sh 4 节：stderr 解析 / CSV 解析 / replay（需活动 PostgreSQL 实例）/ dry run；replay 节在无服务器环境下显式跳过，其余 3 节原样执行）"

upstream_tests:
  - name: stderr-log-parsing
    command: "test/runtest.sh 第 1 节（pgreplay -f 解析 errlog，3 条 diff/cmp 断言）"
    expected: "pass"
  - name: csv-log-parsing
    command: "test/runtest.sh 第 2 节（解析 CSV 日志）"
    expected: "pass"
  - name: replay
    command: "test/runtest.sh 第 3 节（需 psql -U postgres 连接活动实例）"
    expected: "pass with live server; test_skipped（构建环境无法提供活动 PostgreSQL 实例）otherwise"
  - name: dry-run
    command: "test/runtest.sh 第 4 节（pgreplay -r -n 离线重放）"
    expected: "pass"

test_package_tests:
  - file: test_pgreplay.sh
    description: "消费者测试：对打包后 pgreplay 二进制执行日志解析(-f)、重放文件产物校验与离线 dry-run(-r -n) 统计断言"
    command: "bash test_pgreplay.sh"

assertion_count: 16
