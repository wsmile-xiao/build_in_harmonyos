software: perl-module-install-authorrequires

# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.02/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.02"

# 构建系统
build_system: perl

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"
compile_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/F/FL/FLORA/Module-Install-AuthorRequires-0.02.tar.gz"

  # 源码校验和
  sha256: "cc6321537d745d2a83a8286f85ef3346745939cc3b34102045bec8560e8f4cec"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "Module::Install/0.91"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS/C 编译），使用 Makefile.PL + Module::Install 构建系统，无需特殊平台适配"
  - "Module::Install 框架的扩展模块，通过 inc::Module::Install 自动引导，构建过程零平台适配"
  - "OpenHarmony Perl 5.42.0 (aarch64-linux) 环境完全兼容 CPAN 纯 Perl 模块"
  - "纯 Perl 模块无 ELF 二进制产物，不涉及签名问题，质量门禁 G1/G3 自动 PASS"
  - "SELinux HMDFS 上下文 (hmdfs:s0) 不影响纯 Perl .pm 文件加载，与 XS 模块（需 hnp_file:s0）不同"
