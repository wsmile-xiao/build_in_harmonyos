software: pd-smlib
display: "pd-smlib"
description: "SMLib：把 DSP 数据映射为控制数据的 Pure Data 外部对象集合（40 个类）"
category: audio
homepage: "https://puredata.info"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "制品仓 puredata/0.54.1 是 application，不装 Pd API 头 m_pd.h → 配方 source() 额外拉 pure-data 0.54-1 源码树，PDINCLUDEDIR 指向其 src"
    - "上游 pd-lib-builder 依据 $(CC) -dumpmachine 选中 Linux 分支与 pd_linux 扩展名；CC 由 tools.build:compiler_executables 显式传入"
    - "零三方依赖、零补丁：40 个 SMLib 类在 OHOS aarch64 上原样编译通过"
    - "上游 37 个 unittests/*-unittest.pd 真跑：框架 testtools/unit-test-frame 来自 pd-testtools 0.1，由 test_package 按 sha256 拉取（不 vendored、不入库），无头 pd 里逐个与上游参考 .wav 比较，37/37 通过"
    - "Pd 走 smlib/ 命名空间需要 <externals-root>/smlib/ 布局；测试工作目录据此还原安装布局"
    - "消费者测试用真机 OHOS pd 无头加载安装后的外部对象，驱动 13 个确定性 list 类共 15 项结果断言，外加 2 项鸿蒙特有断言（aarch64 ELF + 40 类完整安装）"
  common_dependencies: []

versions:
  - version: "0.13.0"
    status: built
    build_date: "2026-10-03"
