# 版本级 manifest 模板
# 文件位置: archives/p/pd-smlib/0.13.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.13.0"
software: "pd-smlib"
status: built
build_date: "2026-10-03"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://deb.debian.org/debian/pool/main/p/pd-smlib/pd-smlib_0.13.0.orig.tar.gz"
  sha256: "5b587c44a42b3721379460f06340937d302e5a5a58a550e7aab8f5414c7d9064"
  tar_format: tar.gz
  upstream_homepage: "https://puredata.info"
  pd_api_source:
    url: "https://codeload.github.com/pure-data/pure-data/tar.gz/refs/tags/0.54-1"
    sha256: "19a0e2bfcbb5bad5e6dd016d1cda35464db6de008d1803a14c7e1f1625f31353"
    note: "puredata/0.54.1 是 application，不含 m_pd.h；构建需同版本 Pd API 头"
  test_framework:
    url: "https://deb.debian.org/debian/pool/main/p/pd-testtools/pd-testtools_0.1.orig.tar.gz"
    sha256: "068284e645db0aed0ff1372690e368f501fd59e1af891040f7aba9d971bbc914"
    note: "pd-testtools 0.1 提供上游 37 个 unittest 所需的 testtools/unit-test-frame；由 test_package 按 sha256 拉取，既不打包也不入库"

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  builder: "pd-lib-builder (tarball 内置 Makefile.pdlibbuilder)"
  configure_options:
    - "CC=<tools.build:compiler_executables.c>"
    - "PDINCLUDEDIR=<pure-data-0.54-1>/src"
  dependencies: []
  cc: clang
  externals_built: 40

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 产物
# ============================================================

artifacts:
  - "lib/pd-externals/*.pd_linux (40 个 SMLib 外部对象)"
  - "lib/pd-externals/*-help.pd (41 个帮助补丁)"
  - "lib/pd-externals/SMLib.pd, smlib-meta.pd, README.txt"
  - "lib/pd-externals/examples/*.pd"
  - "licenses/LICENSE.txt"

# ============================================================
# 测试
# ============================================================

tests:
  upstream_patches: 37
  upstream_executed: 37
  upstream_note: "37 个 unittests/*-unittest.pd 经 pd-testtools 0.1 的 testtools/unit-test-frame 无头执行，判据为上游自己的参考 .wav 比较（STDDEV-ZERO/STDDEV-SMALL 通过，STDDEV-LARGE 失败）；两份归档由 test_package 按 sha256 拉取，既不打包也不入库"
  consumer_assertions: 17
  ohos_specific_assertions: 2

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "制品仓 puredata/0.54.1 是 application，只装 pd 与数据目录，不装 Pd API 头 m_pd.h → 配方 source() 额外拉 pure-data 0.54-1 源码树，PDINCLUDEDIR 指向其 src"
  - "pd-lib-builder 依据 $(CC) -dumpmachine 选 Linux 分支与 pd_linux 扩展名；CC 须从 tools.build:compiler_executables 显式传入（R33）"
  - "SMLib 的 list 类只注册 class_addlist，创建参数不会触发；补丁必须用 [list ...] 消息框送入"
  - "[vvplus a b c]（带创建参数）才是双缓冲向量加法版本；无参 [vvplus] 是标量版，右入口为 float inlet"
  - "本地 WSL 用 qemu 跑 OHOS musl 程序时缺 __fd_chk，需 LD_PRELOAD=/opt/ohos-guest/lib/libfdchkshim.so（CI 原生 OHOS 无需）"
  - "上游 unittests 用 pd-testtools 的 testtools/unit-test-frame（纯 Pd：soundfiler + tabread/tabwrite + 标准差），无音频图、无 ggee 也能无头跑；两份归档由 test_package 按 sha256 拉取，不 vendored、不打包"
  - "Pd 用 smlib/ 命名空间找类要求 <externals-root>/smlib/*.pd_linux 布局（pd-lib-builder 的默认安装位置），拍平到 lib/pd-externals/ 会导致上游补丁 couldn't create"
  - "拼多个 .pd 进一个 Pd 文件必须给每段补 #X restore 0 0 pd <name>;，否则只算未 restore 的 subpatch，loadbang 不触发"
  - "Pd 的 stdout 块缓冲：靠 timeout 发 SIGTERM 结束会丢掉尾部结果，要让 Pd 自己 [; pd quit( 退出"
