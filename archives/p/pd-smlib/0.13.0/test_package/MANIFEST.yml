# test_package/MANIFEST.yml
# pd-smlib 0.13.0 - upstream test declaration.

package: pd-smlib/0.13.0
homepage: "https://puredata.info"

upstream_tests_exist: true
upstream_test_audit: >-
  The 0.13.0 tarball ships 37 unit-test patches under unittests/
  (*-unittest.pd), each next to its 512-sample reference render (*.wav).
  Every patch instantiates [testtools/unit-test-frame] from the pd-testtools
  library and names the class through the smlib/ namespace. The frame is
  pure Pd (soundfiler + tabread/tabwrite + arithmetic): it reads the
  reference render, records 512 values produced by the object under test and
  prints the rms of the difference (STDDEV-ZERO / STDDEV-SMALL = pass,
  STDDEV-LARGE = fail). No audio graph and no ggee are required -- the frame
  falls back to a patch-relative reference path when ggee/getdir is absent --
  so all 37 run headless. There is no make check/ctest target upstream.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: >-
  pd -nogui -nosound -path <workdir> unittests/<class>-unittest.pd
  (one process for all 37; verdicts are STDDEV-ZERO / STDDEV-SMALL / STDDEV-LARGE)
upstream_test_framework:
  name: pd-testtools
  version: "0.1"
  provides: "testtools/unit-test-frame, testtools/unit-test-frame~"
  url: "https://deb.debian.org/debian/pool/main/p/pd-testtools/pd-testtools_0.1.orig.tar.gz"
  sha256: "068284e645db0aed0ff1372690e368f501fd59e1af891040f7aba9d971bbc914"
  license: BSD-3-Clause
  fetched_by: "test_package conanfile (_upstream_fixture), sha256 pinned; nothing vendored into the repo"
upstream_tests:
  - "unittests/*-unittest.pd (37 patches, DSP output compared against the sibling reference .wav)"

test_package_tests:
  - file: run_upstream_unittests.sh
    description: >-
      headless OHOS pd loads all 37 upstream unittest patches (as subpatches
      of one canvas) through the upstream unit-test-frame and checks, per
      test, that the object loaded from the installed package and that the
      verdict is STDDEV-ZERO or STDDEV-SMALL, plus 3 harness-level checks
      (no smlib object failed to load, every reference render found, result
      count == reference count)
    command: "PD_BIN=... EXT_DIR=... SMLIB_SRC=... TESTTOOLS_DIR=... sh run_upstream_unittests.sh"
  - file: test_pd_smlib.sh
    description: >-
      headless OHOS pd loads the installed SMLib externals and checks 15
      deterministic DSP->control results (vmax/vmin/vsum/vmtof/vftom/vclip/
      vvplus/vrms/vstd/vabs/vcog/vdbtorms/vnmax) plus 2 OHOS specific checks
      (every external is an aarch64 ELF object; the full 40 class set is
      installed)
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_smlib.pd sh test_pd_smlib.sh"

test_files:
  - path: "test_package/test_pd_smlib.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/run_upstream_unittests.sh"
    test_type: "R34"
    assertion_count: 40
  - path: "test_package/test_pd_smlib.sh"
    test_type: "R34"
    assertion_count: 17

test_package_test_count: 2
consumer_assertion_count: 17
ohos_specific_assertion_count: 2
upstream_test_cases: 37
upstream_tests_executed: 37
upstream_harness_assertions: 40
assertion_count: 57