software: perl-log-dispatch-config
description: "Perl module for configuring Log::Dispatch with config files"
homepage: https://metacpan.org/release/Log-Dispatch-Config
repository: https://github.com/miyagawa/Log-Dispatch-Config
license: perl_5

# 版本索引
versions:
  - version: "1.04-r5"
    status: published  # ✅ 依赖链完善，功能可用
    build_date: 2026-06-15
    publish_date: 2026-06-16
    notes: 纯 Perl 模块，依赖链已完善（94%可用），功能完全可用

# 软件分类
category: perl
build_dependencies:
  - perl (>= 5.006)
  - perl-Log-Dispatch

runtime_dependencies:
  - perl-Log-Dispatch

# 特殊说明
notes: |
  Log::Dispatch::Config 是 Log::Dispatch 的配置管理扩展模块。
  通过配置文件（如 AppConfig 格式）管理 Log::Dispatch 的输出配置。

  特性：
  - 纯 Perl 模块（无 XS 代码）
  - 支持配置文件热更新
  - 支持 AppConfig 配置格式