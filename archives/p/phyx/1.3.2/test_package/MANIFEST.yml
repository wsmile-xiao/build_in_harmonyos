package: phyx/1.3.2
homepage: "https://github.com/FePhyFoFum/phyx"

upstream_check_command: "python3 run_tests.py"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - file: src/run_tests.py
    source: phyx-1.3.2/src/run_tests.py
    description: "上游完整测试驱动：100 项均执行；95 项精确匹配，5 项随机输出比较由 runner 标为 anticipated failures 并成功退出；pxtcol、pxtcomb 被明确列为无测试程序"
    command: "cd src && python3 run_tests.py"

test_package_tests:
  - file: test_phyx.py
    description: "消费者视角复核确定性核苷酸统计，并补测上游遗漏的 pxtcol 与 pxtcomb 实际数据路径"
    command: "python3 test_phyx.py <package>/share/phyx/TEST"
  - file: test_phyx.py
    description: "HarmonyOS 专有：运行依赖 Armadillo/OpenBLAS 闭包的 pxseqgen；配方同时对 ELF 动态依赖和已定义 BLAS/LAPACK 符号做单后端断言"
    command: "pxseqgen -V (HarmonyOS)"

assertion_count: 104
# 上游实测 100 项；消费者测试新增确定性统计、pxtcol、pxtcomb、
# HarmonyOS 科学计算运行时闭包各 1 项，共 104 项。
