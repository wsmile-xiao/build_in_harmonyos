knowledge_gained:
  - "Autoconf AS_TMPDIR 的 umask 077 在 HMDFS 沙箱属主映射下会使 config.status 无法写入 conf*/subs1.awk；OHOS 构建需在 autoreconf 后将生成脚本调整为 umask 002（knowledge_ref: E011）"
  - "不得同时硬链接 reference BLAS/LAPACK 与经 Armadillo 引入的 OpenBLAS；应使用 Autoconf 探测所得 @LIBS@ 保持单一数值后端（knowledge_ref: E14851-draft-C5E9）"
  - "仅补齐 FortranRuntime 可让链接通过，但会把 BLAS/LAPACK 符号静态嵌入可执行文件并与动态 OpenBLAS 共存，需同时审查 ELF NEEDED 与已定义符号（knowledge_ref: E14851-draft-C5E9）"
  - "上游执行 100 项测试（95 项精确匹配、5 项随机输出由上游标为 anticipated failures）；新增 4 项确定性/HarmonyOS 测试通过（knowledge_ref: E14851-draft-C5E9）"

knowledge_ref:
  - "knowledge/graph/E011.kv"
  - "knowledge/doc/E011.md"
  - "knowledge/drafts/E14851-draft-C5E9.kv"
  - "knowledge/drafts/E14851-draft-C5E9.md"
