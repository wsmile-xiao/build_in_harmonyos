software: phyx
display: "phyx"
description: "用于系统发育树、序列与连续性状分析的命令行工具集"
category: data
homepage: "https://github.com/FePhyFoFum/phyx"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "为 GNU config.guess 补充 HarmonyOS 原生识别，保留 configure 运行探针"
    - "最终链接线消费 Autoconf 探测生成的 LIBS，避免 reference BLAS/LAPACK 与 Armadillo 的 OpenBLAS 后端共存"
    - "同时审计 ELF 动态依赖与普通符号表，验证科学计算后端唯一"
    - "固定输入数据测试覆盖数值结果，并执行完整上游测试集"
  common_dependencies:
    - armadillo
    - nlopt

versions:
  "1.3.2":
    status: built
    build_date: "2026-10-11"
    conan_ref: "phyx/1.3.2"
