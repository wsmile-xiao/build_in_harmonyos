# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pajeng/1.3.10
homepage: "https://github.com/schnorr/pajeng"

# 上游测试入口：src/tools/CMakeLists.txt 的 ADD_TESH/ADD_TEST 注册 12 个
# tesh 套件（tests/*.tesh 共 50 条命令级断言，perl 版 tesh 驱动）
upstream_check_command: "ctest -N (on upstream build tree)"

# conanfile.py build() 方法中已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest -V --output-on-failure"

# 上游实际运行的测试程序（12 个 tesh 套件，50 条命令）
upstream_tests:
  - file: tests/*.tesh
    source: pajeng-1.3.10/tests/*.tesh
    description: "12 个 tesh 套件（pj_dump_*/pj_validate_*/pj_equals），逐条执行命令并比对期望输出"
    command: "perl tesh <file.tesh>（经 CTest 驱动）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：链接 libpaje 断言 PajeColor 公开 API + 运行包内 pj_dump 解析随包 trace 断言行为"
    command: "./test_pajeng"

# 测试断言总数 (tesh 命令级断言)
assertion_count: 50
