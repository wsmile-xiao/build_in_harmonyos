sources:
  "9.0.0":
    url: "https://codeload.github.com/workhorsy/py-cpuinfo/tar.gz/refs/tags/v9.0.0"
    sha256: "21dfd34d85f4d1419aad63f4945d7356025794fd1529c95644f618aac390625c"

patches:
  "9.0.0":
    - patch_file: "patches/0001-ohos-platform-compat.patch"
      patch_description: "Treat HarmonyOS as Linux platform in test_actual.py"
      patch_type: "src"
    - patch_file: "patches/0002-disable-subprocess-on-harmonyos.patch"
      patch_description: "Disable subprocess in get_cpu_info_json() on HarmonyOS to avoid installed package execution issues"
      patch_type: "src"
    - patch_file: "patches/0003-tolerate-missing-platform-probes.patch"
      patch_description: "Treat unavailable optional platform probe commands as empty results"
      patch_type: "src"
