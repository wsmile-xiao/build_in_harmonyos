# 版本级 manifest
# 文件位置: archives/p/py-cpuinfo/9.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "9.0.0"

# 软件名
software: py-cpuinfo

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: python3

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 GitHub 官方标签归档）
  url: "https://codeload.github.com/workhorsy/py-cpuinfo/tar.gz/refs/tags/v9.0.0"

  # 源码校验和
  sha256: "21dfd34d85f4d1419aad63f4945d7356025794fd1529c95644f618aac390625c"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
