    - python3

  # 编译器（纯 Python 包，实际未使用）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-ohos-platform-compat.patch"
  - "0002-disable-subprocess-on-harmonyos.patch"
  - "0003-tolerate-missing-platform-probes.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "py-cpuinfo 为纯 Python noarch 包，构建用 pip --no-deps 安装到私有 staging"
  - "上游提供完整测试套件 159 个单元测试（tests/ 目录），通过 test_suite.py 执行"
  - "HarmonyOS platform.system() 返回 'HarmonyOS'，上游测试辅助函数需补充识别并映射到 Linux 分支"
  - "适配补丁仅修改 tests/helpers.py 2 行，保留全部 159 个上游测试不删减，HarmonyOS aarch64 实测 158 passed + 1 skipped"
  - "提供 console script cpuinfo（entry_point），安装到 bin/ 目录"
  - "Worker 缺少 dmesg/curl 等可选探测命令时，补丁容错处理避免 get_cpu_info() 中断"
  - "品牌字段 brand_raw 依赖 Worker 暴露的 CPU 信息源，消费者测试应作为可选字段验证"
  - "pip 生成的 console script shebang 指向构建机 Python 路径，不可迁移；Conan 包需改写为 /bin/sh wrapper 调用 python3 -m"
  - "消费者测试的 CLI 验证应通过包内绝对路径（Path(__file__).parents[4]/bin/cpuinfo）而非 PATH 环境变量"
