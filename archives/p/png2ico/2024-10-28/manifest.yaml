software: png2ico
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2024-10-28/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2024-10-28"

# 构建系统
build_system: cmake

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/dkfans/png2ico/archive/refs/tags/2024-10-28.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
  - "-DCMAKE_CXX_COMPILER=clang++"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-VERSION.patch"
  - "0002-CMakeLists.txt.patch"
  - "0003-png2ico.cpp-replace-spng-with-direct-ihdr.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "png2ico 2024-10-28 uses libspng (not libpng), which is not available as precompiled package on HarmonyOS"
  - "Replaced libspng dependency with direct PNG IHDR chunk parsing - only needed width/height from IHDR"
  - "version macro in VERSION file conflicts with png.h struct member 'version' - renamed to PNG2ICO_VERSION"
  - "libpng.so on HarmonyOS has NEON ARM SIMD symbol issues at runtime (png_riffle_palette_neon undefined)"
  - "No CMakeLists.txt in original source - created one for CMake build system support"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/png2ico-2024-10-28.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/png2ico-2024-10-28.work
  source_orig_hash: c59ee5a691264642
  source_work_hash: e73a15c59fb130f9
  generated_at: '2026-05-29T11:06:48'
  patches_count: 2

patch_classification:
  - file: 0001-CMakeLists.txt.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-VERSION.patch
    type: auto
    platform_only: True
    guard: 'pending'
