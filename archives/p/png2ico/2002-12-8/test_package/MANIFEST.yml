# test_package/MANIFEST.yml
# Consumer-side tests for png2ico; upstream has no automated test suite.
package: png2ico/2002-12-8
homepage: "https://www.winterdrache.de/freeware/png2ico/"

# Upstream test audit
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_test_audit:
  tests_directory_present: false
  registered_test_count: 0
  reason: "The upstream archive contains no tests directory and its Makefile has no test/check target."

# Consumer-side verification
test_package_tests:
  - file: test_png2ico.c
    description: "Executes png2ico with two 8x8 PNG inputs and validates the generated ICO header and directory."
    command: "conan test ."
  - file: test_ohos.c
    description: "OHOS-only no-root test using __OHOS__ and a private writable TMPDIR directory."
    command: "conan test . -pr:h ci/conan/profiles/ohos-aarch64"

# Approximate assertion count across both consumer programs.
assertion_count: 16
