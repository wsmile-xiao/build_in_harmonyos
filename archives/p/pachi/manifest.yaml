software: pachi
display: "Pachi Go Engine"
description: "Modular framework and strong engine for the game of Go/Weiqi/Baduk (UCT + MCTS)"
category: utility
homepage: "https://github.com/pasky/pachi"
license: GPL-2.0-only
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile project, no configure/CMake; build with DCNN=0 JOSEKIFIX=0 to drop Caffe/Boost/KataGo deps"
    - "Use GENERIC=1 for distributable binaries (avoid -march=native)"
    - "Get CC/CXX/AR from Conan tools.build:compiler_executables (R33), always make -j1 (R9)"
    - "Upstream t-unit suite runs via make test; tarball has no .git so enumerate t-unit/*.t directly"
  common_dependencies: []

versions:
  "12.9":
    status: built
    build_date: "2026-09-10"
