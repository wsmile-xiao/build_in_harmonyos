  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Pachi Makefile defaults pull Caffe/KataGo; OHOS must build nodcnn (DCNN=0 JOSEKIFIX=0)"
  - "Tarball lacks .git so t-unit/run_tests git ls-files enumerates nothing; enumerate t-unit/*.t directly"
