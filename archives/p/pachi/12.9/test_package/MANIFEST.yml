# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pachi/12.9
homepage: "https://github.com/pasky/pachi"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "./pachi --kgs -d2 -u t-unit/<name>.t + t-unit/gtp_check + genmove smoke"

# 上游实际运行的测试程序
upstream_tests:
  - file: t-unit/*.t
    source: pachi-12.90/t-unit/*.t
    description: "上游 t-unit 单元脚本（atari/bent4/pass_is_safe 等），由 pachi 二进制直接驱动"
    command: "./pachi --kgs -d2 -u t-unit/<name>.t"
  - file: t-unit/gtp_check
    source: pachi-12.90/t-unit/gtp_check
    description: "上游 GTP 协议一致性检查（nodcnn+nojosekifix 过滤 dcnn/josekifix/external_engine 行）"
    command: "./t-unit/gtp_check ./pachi -t =1000 -o /dev/null < t-unit/gtp_test.gtp"
  - file: genmove smoke
    source: pachi-12.90/gtp/genmove.gtp
    description: "上游 genmove 回归的轻量等价（9x9 =500 playouts，上游 GJ_MINGAMES 下限，断言含 = 应答）"
    command: "printf 'boardsize 9\\nclear_board\\ngenmove b\\nquit\\n' | ./pachi -d0 -t =500"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者视角验证 --version/--help/GTP genmove 三个真实用例"
    command: "bash test.sh <pachi binary>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
