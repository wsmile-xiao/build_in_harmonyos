software: perl-lingua-en-inflect
# 软件级 manifest 模板
# 文件位置: archives/p/perl-lingua-en-inflect/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（与目录名一致）
name: "perl-lingua-en-inflect"

# 软件描述（简短）
description: "Perl模块 - 英语单词词形变化（复数、动词变位、数字转单词等）"

# 软件分类
# library | tool | utility | development | system
category: library

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方源码仓库/下载页
  homepage: "https://metacpan.org/pod/Lingua::EN::Inflect"

  # CPAN作者ID
  cpan_author: "DCONWAY"

# ============================================================
# 版本索引（软件级维护）
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "1.905-r1"
    build_date: "2026-06-12"
    status: published
    notes: "纯Perl模块，测试100%通过（2147/2147），已发布"

# ============================================================
# 依赖信息
# ============================================================

# 运行时依赖
runtime_dependencies:
  - perl/5.42.0

# 编译时依赖
build_dependencies: []

# ============================================================
# 平台兼容性
# ============================================================

# 已验证平台列表
platforms:
  - aarch64-unknown-linux-ohos

# ============================================================
# 软件特性
# ============================================================

# 模块类型
module_type: pure_perl  # pure_perl | xs | hybrid

# 是否需要XS编译
requires_xs: false

# 是否受SELinux HMDFS限制
selinux_restricted: false

# ============================================================
# 备注
# ============================================================

notes: |
  Lingua::EN::Inflect是纯Perl实现，无XS依赖，编译简单。
  提供英语单词的词形变化功能：
  - 名词复数化 (PL, PL_N)
  - 动词变位 (PL_V, PL_ADJ)
  - 数字转单词 (NUMWORDS)
  - 单词列表处理 (WORDLIST)
  - 古典模式支持

  对比XS模块（如perl-dbd-pg），纯Perl模块优势：
  1. 无需编译C代码，编译复杂度低
  2. 不受SELinux HMDFS限制，可用户目录加载
  3. 平台适配性好，跨平台兼容性强
  4. 维护成本低，测试套件可直接运行