configure_options:
  - -GNinja
  - -DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX
  - -DCMAKE_BUILD_WITH_INSTALL_RPATH=TRUE
  - -DCMAKE_INSTALL_RPATH=$DEFAULT_PREFIX/lib
  - -DPAHO_WITH_SSL=ON
  - -DPAHO_BUILD_SHARED=ON
  - -DPAHO_BUILD_STATIC=ON
  - -DPAHO_BUILD_DOCUMENTATION=OFF
  - -DPAHO_BUILD_SAMPLES=OFF
dependencies:
  - openssl (1.1.1w, 预编译包已安装)
knowledge_gained:
  - CMake RPATH 配置：HarmonyOS 平台使用 Ninja generator 时必须设置 CMAKE_BUILD_WITH_INSTALL_RPATH=TRUE
  - HMDFS 软链接权限：必须使用 rm -f && ln -s 方式，不能使用 ln -sf 或 cmake_symlink_library
