# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-mouse/2.6.0-r0
homepage: "https://metacpan.org/pod/Mouse"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Build.PL && ./Build test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/000-load.t
    source: Mouse-v2.6.0/t/000-load.t
    description: "上游模块加载测试"
    command: "perl -Ilib t/000-load.t"
  - file: t/001_mouse/007-attributes.t
    source: Mouse-v2.6.0/t/001_mouse/007-attributes.t
    description: "上游属性功能测试 (has, accessor, default)"
    command: "perl -Ilib t/001_mouse/007-attributes.t"
  - file: t/001_mouse/027-modifiers.t
    source: Mouse-v2.6.0/t/001_mouse/027-modifiers.t
    description: "上游方法修饰符测试 (before/after/around)"
    command: "perl -Ilib t/001_mouse/027-modifiers.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_mouse.sh
    description: "消费者测试：加载 Mouse 模块并调用 has/new/accessor/extends API"
    command: "sh test_mouse.sh <package_folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
