software: perl-mouse

version: "2.6.0-r0"

status: built

build_date: "2026-08-07"

source:
  url: "https://cpan.metacpan.org/authors/id/S/SY/SYOHEX/Mouse-v2.6.0.tar.gz"
  sha256: "1527e6486570b3abdbcc23f8f17fa413083e58d841f07f184d198077ebddff35"
  tar_format: tar.gz

build:
  system: makefile-pl
  build_system: extutils-makemaker
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=$PACKAGE_DIR"
  dependencies:
    - "perl/5.42.0"
    - "Devel::PPPort/3.73"
    - "ExtUtils::MakeMaker (core)"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Mouse原始构建系统为Module::Build+XSUtil,OHOS CI无此模块,改用ExtUtils::MakeMaker替代"
  - "MakeMaker的suffix rules不支持子目录的.c→.o编译,需用MY::postamble添加自定义规则"
  - "xshelper.h不在源码包中,由Module::Build::XSUtil生成,需在build()中预生成"
  - "INSTALL_BASE需设为package_folder而非package_folder/lib/perl5,避免路径重复"
  - "XS模块编译需要OHOS SDK sysroot头文件路径(clang自动包含,无需额外CFLAGS)"
  - "PurePerl模式功能完整: has/new/accessor/setter/type constraint/inheritance全部通过"
