# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pcsclite/2.5.2
homepage: "https://pcsc-lite.apdu.fr/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# pcsc-lite 2.5.2 的 meson.build 无任何 test() 注册，meson test --list 输出
# "No tests defined"。上游测试位于 UnitaryTests/（43 项文件：6 个 .c +
# 35 个 .py + 1 个子目录 SCardGetStatusChange/ 含 5 个 .py + Makefile），
# 全部由独立 Makefile 驱动，且运行前置条件为：已运行的 pcscd 守护进程 +
# 实体智能卡读卡器（SCardEstablishContext 成功 + SCardConnect 到真实读卡器），
# CI 无卡环境不可执行。SConfigTest 等 .c 单测同样链接 SCard* API 后需要
# daemon-ctx 才能推进到断言主体。
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（CI 环境不可执行，见上）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
# test.c 只使用公共安装头 <winscard.h> 及其 API：
# SCardEstablishContext / SCardReleaseContext / SCardIsValidContext /
# pcsc_stringify_error / SCARD_PCI_T0|T1|RAW 全局 / MAX_ATR_SIZE。
# 断言策略（无读卡器环境返回错误码也是有效断言——验证库可链接可调用）：
#   - daemon-less（CI）：EstablishContext == SCARD_E_NO_SERVICE 且 ctx 保持 0；
#     Release/IsValidContext(bogus handle) == SCARD_E_INVALID_HANDLE（本地
#     参数校验，不依赖 daemon）；
#   - daemon 可达（开发机）：EstablishContext 成功 + ReleaseContext 成功。
#   两条路径均为精确断言，覆盖 SCardEstablishContext/SCardReleaseContext 往返。
test_package_tests:
  - file: test.c
    description: "消费者测试：SCardEstablishContext/SCardReleaseContext 往返 + 无 daemon 错误码契约 + 错误字符串 + PCI 全局导出 + ABI 常量"
    command: "./test_pcsc"

# 测试断言总数（实测：daemon-less 路径 11 项编号 CHECK 全 PASS；
# daemon 可达路径同为 11 项——Establish/Release 往返按分支双路径精确断言）
assertion_count: 11
