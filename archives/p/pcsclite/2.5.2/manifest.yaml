# 版本级 manifest — pcsclite 2.5.2
# 文件位置: archives/p/pcsclite/2.5.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一构建输入，本文件为人读交叉校验）

version: "2.5.2"
software: "pcsclite"
status: built
build_date: "2026-10-05"
build_system: meson

source:
  url: "https://github.com/LudovicRousseau/PCSC/archive/refs/tags/2.5.2.tar.gz"
  sha256: "ca52f420194cef335114a10ca3b6369b64046f3d61d5b621595e0d487df18ce1"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Ddefault_library=shared|static（conan options.shared 驱动）"
    - "-Dpcscd=false"
    - "-Dlibudev=false"
    - "-Dlibusb=false"
    - "-Dlibsystemd=false"
    - "-Dpolkit=false"
    - "-Dusb=false"
    - "-Dserial=false"
  dependencies: []   # 零外部依赖：libc + pthread + dl（musl 内建）
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-meson.options-add-pcscd-option.patch"
  - "0002-meson.build-guard-pcscd-targets.patch"

knowledge_gained:
  - "pcsc-lite 2.5.2 上游已从 autotools 迁移到 Meson（tarball 无 configure.ac，仅 meson.build/meson.options）——任务情报中的 autotools 路径需修正为 MesonToolchain"
  - "OHOS musl libc 无 pthread_cancel(3)（pcscd 的 eventhandler.c EHDestroyEventHandler 引用，ld.lld undefined symbol）→ pcscd 守护进程不可交付，用 meson 选项守卫裁剪，只交付客户端库+头文件"
  - "OHOS sysroot 无 secure_getenv(3) 但有 issetugid(2) → 上游 meson.build 的 compiler.has_function fallback 分支自动通过，该检查零补丁"
  - "客户端库三件套结构：libpcsclite（SCard* facade，dlopen libpcsclite_real.so.1 委托）+ libpcsclite_real（真实客户端实现）+ libpcscspy（spy 垫片）；静态库时 libpcsclite.a 直接包含真实实现（无 dlopen）"
  - "无 daemon 环境 API 契约（本机 OHOS aarch64 实测）：SCardEstablishContext → SCARD_E_NO_SERVICE(0x8010001D)；SCardReleaseContext/SCardIsValidContext(bogus) → SCARD_E_INVALID_HANDLE(0x80100003)——无读卡器环境错误码即有效断言"
  - "构建期工具依赖：flex 2.6.4（生成 configfile.c/tokenparser.c）+ pod2man（生成 pcsc-spy.1 manpage）均在 /data/service/hnp/bin，CI profile PATH 已含"

notes: "首次适配；交付 libpcsclite(+real/spy) + include/PCSC 头文件 + libpcsclite.pc；test_package 11 断言（daemon-less 错误码契约，实测全 PASS）；本地 conan create 预验证通过"
