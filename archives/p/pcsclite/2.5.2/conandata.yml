# conandata.yml — pcsclite 2.5.2
# 源码 URL：GitHub 正主仓官方 tag tarball（R39 单条官方 URL）
# sha256 双源实测：GitHub archive 与 salsa.debian.org/rousseau/PCSC（同一上游镜像）
# 的 tag tarball 逐字节一致，均为下方值
sources:
  url: "https://github.com/LudovicRousseau/PCSC/archive/refs/tags/2.5.2.tar.gz"
  filename: "pcsclite-2.5.2.tar.gz"
  sha256: "ca52f420194cef335114a10ca3b6369b64046f3d61d5b621595e0d487df18ce1"

patches:
  - patch_file: "patches/0001-meson.options-add-pcscd-option.patch"
    patch_description: "Add meson option 'pcscd' (default true, upstream behaviour unchanged) so library-only consumers can disable the daemon"
    patch_type: "portability"
  - patch_file: "patches/0002-meson.build-guard-pcscd-targets.patch"
    patch_description: "Guard pcscd executable + its sysconf/systemd-unit/manpage installs behind the pcscd option (OHOS musl libc has no pthread_cancel, and udev/systemd/polkit are unavailable on OHOS)"
    patch_type: "portability"
