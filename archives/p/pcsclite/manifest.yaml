software: pcsclite
display: "pcsc-lite"
description: "PC/SC 智能卡中间件：SCard* 客户端库（winscard API）与头文件"
category: system
homepage: "https://pcsc-lite.apdu.fr/"
license: BSD-3-Clause
build_system: meson

ohos_adaptation:
  key_points:
    - "上游 2.5.2 起已从 autotools 迁移到 Meson（tarball 无 configure.ac），配方走 MesonToolchain"
    - "OHOS musl libc 无 pthread_cancel(3) → pcscd 守护进程不可交付（选项化裁剪 -Dpcscd=false），只交付客户端库+头文件"
    - "OHOS 无 secure_getenv(3) 但有 issetugid(2)：上游 meson.build 特性检测 fallback 自动通过，零补丁"
    - "shared 库为 facade 结构：libpcsclite.so dlopen libpcsclite_real.so.1 委托，两库须同装；static 单库直含实现"
    - "无 daemon 环境 API 契约：SCardEstablishContext → SCARD_E_NO_SERVICE；bogus handle → SCARD_E_INVALID_HANDLE（本地校验，可作 CI 断言）"
  common_dependencies: []

versions:
  "2.5.2":
    status: built
    build_date: "2026-10-05"
    conan_ref: "pcsclite/2.5.2"
