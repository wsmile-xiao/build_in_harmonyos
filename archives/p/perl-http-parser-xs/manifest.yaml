software: perl-http-parser-xs
display: "HTTP::Parser::XS"
description: "A fast, primitive HTTP request/parser Perl XS module using picohttpparser"
category: extension
homepage: https://metacpan.org/pod/HTTP::Parser::XS
license: perl_5
build_system: perl

# OpenHarmony 适配要点
ohos_adaptation:
  key_points:
    - "Perl XS 模块需要特殊链接参数: -nostartfiles -nodefaultlibs -lc"
    - "Module::Install 构建系统不能直接在 Makefile.PL 中添加 dynamic_lib 参数"
    - "需通过命令行传递 OTHERLDFLAGS 或修改生成的 Makefile"
  common_dependencies:
    - perl

# 版本索引
versions:
  "0.17-r9":
    status: built
    build_date: "2026-06-11"
    notes: "首次成功编译，参考 perl-dbd-pg 链接参数解决 CRT 缺失问题"

# 依赖信息
runtime_dependencies:
  - perl/5.42.0

build_dependencies:
  - perl/5.42.0