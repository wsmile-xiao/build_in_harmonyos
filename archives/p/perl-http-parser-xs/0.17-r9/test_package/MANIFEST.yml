# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-http-parser-xs/0.17-r9
homepage: "https://metacpan.org/dist/HTTP-Parser-XS"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00base.t
    source: HTTP-Parser-XS-0.17/t/00base.t
    description: "基础模块加载测试"
    command: "perl -Mblib t/00base.t"
  - file: t/01simple.t
    source: HTTP-Parser-XS-0.17/t/01simple.t
    description: "HTTP 请求解析基本功能测试"
    command: "perl -Mblib t/01simple.t"
  - file: t/02response.t
    source: HTTP-Parser-XS-0.17/t/02response.t
    description: "HTTP 响应解析测试"
    command: "perl -Mblib t/02response.t"
  - file: t/03response-error.t
    source: HTTP-Parser-XS-0.17/t/03response-error.t
    description: "HTTP 响应错误处理测试"
    command: "perl -Mblib t/03response-error.t"
  - file: t/04response-format.t
    source: HTTP-Parser-XS-0.17/t/04response-format.t
    description: "HTTP 响应格式化测试"
    command: "perl -Mblib t/04response-format.t"
  - file: t/05too-much.t
    source: HTTP-Parser-XS-0.17/t/05too-much.t
    description: "超大请求处理测试 (PP 回退)"
    command: "perl -Mblib t/05too-much.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_http_parser_xs.sh
    description: "消费者测试：加载 HTTP::Parser::XS 模块并调用 parse_http_request + parse_http_response API"
    command: "sh test_http_parser_xs.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 81
