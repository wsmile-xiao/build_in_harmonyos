# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pangomm-2.46/2.46.5
homepage: "https://gitlab.gnome.org/GNOME/pangomm"

# 上游测试命令 (meson test)
# pangomm 2.46.5 的 meson 未注册 test()：tests/ 仅为 autotools Makefile.am，
# 无 meson.build 入口，无上游 meson 测试可执行。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (pangomm 2.46.5 meson 无注册测试；0 个)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：Pango::init + FontDescription + AttrList change() 插入校验 + 版本宏（真实编译链接运行）"
    command: "./test_probe"

# 测试断言总数（test.cpp 中 check 调用：FontDescription::get_family、
# FontDescription::get_size、AttrList change() 插入 AttrInt 段数、PANGOMM_MAJOR_VERSION 共 4 项）
assertion_count: 4
