software: pangomm-2.46
# 版本级 manifest
# 文件位置: archives/p/pangomm-2.46/2.46.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "2.46.5"
status: published
build_system: meson
build_date: "2026-09-27"

# Conan 引用
conan_ref: "pangomm-2.46/2.46.5@ohpcd/stable"

source:
  url: "https://download.gnome.org/sources/pangomm/2.46/pangomm-2.46.5.tar.xz"
  sha256: "38ca0b050b065de4e3da0c182df657437757063bbf0c4b6c9567ddba019b1d68"
  tar_format: tar.xz

build:
  system: meson
  cc: clang
  cxx: clang++
  configure_options:
    - "default_library=shared"
    - "maintainer-mode=false"
    - "build-documentation=false"
    - "wrap_mode=nodownload"
  dependencies:
    - "glibmm/[>=2.48.0] (glibmm-2.4 旧 ABI, sigc++-2.0)"
    - "cairomm/[>=1.2.2] (cairomm-1.0 旧 ABI)"
    - "pango/1.56.4 (pangocairo >= 1.45.1)"

patches_applied: []

knowledge_gained:
  - "GNOME C++ 绑定家族双 ABI 线并行发布：pangomm-1.4（2.46.x 封顶）/glibmm-2.4（2.66.x）/cairomm-1.0（1.14.x）为旧线，版本号高低与 ABI 线新旧无关，依赖必须按 dependency('<pc名>') 精确字符串反查 repo 匹配（configure.ac MM_INIT_MODULE 取证）"
  - "conan 2 PkgConfigDeps 只写标准 pc 变量：上游 meson get_variable('gmmprocdir')/dependency('pangocairo') 别名/find_library(extra_defs 工具库) 三类缺口一律在配方 generate() 补齐（转发 pc 四行 + pc 变量追加 + -L 注入），不改上游"
  - "OHOS /storage 禁 symlink（EPERM）：meson install 的 libfoo.so/.so.N 链静默缺失致加载器报 Error loading shared library，package() 物化（copyfile 幂等）"
  - "OHOS 无 binfmt_script：任何 #!/bin/sh 脚本 exec 即 EACCES(126)，meson configure_file/custom_target 的 find_program('*.py') 执行点必须经 python3 改道（仅真机验证用，CI 不启用）"
  - "conan 2.29 每次 create 新建 build 容器（源树重新解包），设备侧源树手改不存活；缓存配方 export 目录改动跨容器存活"

upstream_test_pass_rate: "N/A——上游 2.46.5 tarball 的 meson 未注册 test()（tests/ 无 meson.build 入口），build() 仅 configure+compile；真机 conan create 编译全过（G2 干净构建 PASS）"
adapted_test_pass_rate: "100%（4/4）——2026-09-27 HarmonyOS PC aarch64 真机 conan-verify 八门禁 Verdict PASS（G0-G4 + L2/L4/L5 全绿，G2 干净构建 + 消费者 test_package 4 项断言全过：pangomm-1.4 头/链接/API 实跑）"
test_command: "python3 scripts/ohc-run.py conan-verify pangomm-2.46 2.46.5"
