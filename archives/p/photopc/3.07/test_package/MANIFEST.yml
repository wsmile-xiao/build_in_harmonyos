# test_package/MANIFEST.yml
# 上游官方测试声明文件（photopc 3.07，DS-12 实测 2026-09-21）

package: photopc/3.07
homepage: "http://photopc.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "无（上游无测试套件）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游无测试套件：Makefile.am 无 TESTS/check_PROGRAMS，树内无测试目录/框架
# （清点证据：Makefile.am 全文 + 树内 grep，见 notes.md 五维账本）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "消费者测试：对打包后的 photopc/epinfo 二进制做 4 组行为断言——①epinfo -V 版本横幅；②epinfo 非 EPSON 文件解析路径（No camera-specific information）；③epinfo 无参数 usage；④photopc 设备 open/termios 错误路径（eph_open failed）。ELF 签名后真机执行，任一断言失败即非 0"
    command: "./consumer 行为断言（经 conanrun 环境执行）"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 6
# 口径: 消费者 4 组行为断言（内部共 6 个相等/包含检查）
