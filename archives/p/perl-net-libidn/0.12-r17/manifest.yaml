software: perl-net-libidn
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.12-r17/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.12-r17"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/T/TH/THOR/Net-LibIDN-0.12.tar.gz"

  # 源码校验和
  sha256: "2f8acc9442b3866ec7dc63cd449fc693ae3e930d5d3e5e9430fbb6f393bdbb17"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "--with-libidn=/storage/Users/currentUser/usr/local/lib"
    - "--with-libidn-inc=/storage/Users/currentUser/usr/local/include"

  # 编译依赖列表
  dependencies:
    - "libidn/1.43"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.PL-ohos-linker.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块使用 perl Makefile.PL（非 autotools），需要特殊的 conanfile.py 处理"
  - "OHOS 平台缺少 CRT 文件（crti.o, crtn.o, crtbeginS.o, crtendS.o），需用 -nostartfiles -nodefaultlibs -lc 绕过"
  - "Makefile.PL 的 LINK 阶段需要通过 OTHERLDFLAGS 注入 OHOS 链接器标志"
  - "conan settings.yml 需要手动添加 OHOS 枚举值（os.version: [null, 5.0, 6.0]）"
  - "ConanInvalidConfiguration 应从 conan.errors 导入"
  - "package_info 中 libdirs 应使用赋值而非 append，避免多元素导致 libdir 属性异常"
  - "SELinux HMDFS 限制：hishell_hap domain 只能加载 hnp_file 类型 .so，用户路径 hmdfs:s0 被拒绝"
  - "binary-sign-tool 可用于签名 .so 文件，添加 .codesign ELF section"
  - "HNP 包格式用于管理员安装到 /data/service/hnp/ 系统目录"
