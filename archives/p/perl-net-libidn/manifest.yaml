software: perl-net-libidn
display: "Perl Net::LibIDN"
description: "Perl XS 绑定模块，封装 GNU Libidn 库，提供 IDNA 域名编解码、Punycode 编解码和 Stringprep 字符串预处理功能"
category: perl
homepage: "https://metacpan.org/dist/Net-LibIDN"
license: LGPL-2.1+
build_system: makefile

ohos_adaptation:
  key_points:
    - "Perl XS 模块使用 perl Makefile.PL（非 autotools），需特殊 conanfile.py 处理"
    - "OHOS 平台缺少 CRT 文件 (crti.o, crtn.o, crtbeginS.o, crtendS.o)，需通过 OTHERLDFLAGS 注入 -nostartfiles -nodefaultlibs -lc"
    - "conan settings.yml 需手动添加 OHOS 枚举值（os.version: [null, 5.0, 6.0]）"
    - "SELinux HMDFS 限制：XS .so 只能从 /data/service/hnp/ (hnp_file:s0) 加载，用户路径 (hmdfs:s0) 被拒绝"
    - "需使用 binary-sign-tool 对 .so 签名后通过 HNP 包安装到系统目录"
  common_dependencies:
    - "libidn/1.43"

versions:
  "0.12-r17":
    status: published
    build_date: "2026-06-29"
    published_as: perl-net-libidn
    source_url: "https://cpan.metacpan.org/authors/id/T/TH/THOR/Net-LibIDN-0.12.tar.gz"
