# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
#
# 上游官方测试核实（make -n check 于探索构建树验证）：
# POV-Ray 3.7 Unix 构建系统只有【一个】check 目标 —— 渲染
# scenes/advanced/biscuit.pov（320x240，多线程光追），成功判据为
# "POV-Ray finished" 且 make check 退出码 0。探索构建树实测：
# CHECK_RC=0，Trace Time 0.186s（20 线程），已通过。
# 无单元测试框架（无 ctest/meson test）。

package: povray/3.7.0.10
homepage: "https://www.povray.org/"

# 上游测试命令（Unix 唯一 check 目标）
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（make check 的 check target，见 unix/Makefile.am：
# check: all → $(POVRAY) $(TEST_SRCDIR)biscuit.pov -geometry 320x240 +L... ）
upstream_tests:
  - file: scenes/advanced/biscuit.pov
    source: povray-3.7.0.10/scenes/advanced/biscuit.pov
    description: "上游光追渲染冒烟测试：渲染 biscuit.pov 场景 320x240，make check 退出码 0 即通过（探索树实测 0.186s）"
    command: "make check"

# test_package 中自带的测试（消费者视角验证，OHOS 适配自研断言）
# 测试逻辑集中在独立驱动 test_povray.py（conanfile.py test() 经 self.run 调用）
test_package_tests:
  - file: test_package/test_povray.py
    description: "独立测试驱动：banner 断言（--version 输出含 Persistence of Vision 与 3.7.0.10）+ 真实渲染断言（test.pov 场景 → 64x64 PNG；断言退出码 0、PNG 魔数、IHDR 64x64、bit_depth=8、color_type=2、Trace Time 统计行、包内场景库布局）。断言失败非零退出"
    command: "python3 test_povray.py <package>/bin/povray test.pov <package>/share/povray-3.7/include"
  - file: test_package/test.pov
    description: "渲染测试场景：相机+光源+棋盘格平面+红球（#include colors.inc 场景库），被 test_povray.py 驱动渲染"
    command: 'povray +Itest.pov +Otest.png +W64 +H64 -D -L<package>/share/povray-3.7/include'
  - file: test_package/conanfile.py
    description: "conan 测试入口：test() 经 self.run 调用 test_povray.py 驱动（断言逻辑不在 conanfile 内，L0c 按扩展名认测试源）"
    command: "conan test test_package povray/3.7.0.10"

# 测试断言总数（test() 内 assert 语句：banner 2 + colors.inc 1 + povray 存在 1 + PNG 魔数 1 + IHDR 1 + 尺寸 1 + bit_depth 1 + color_type 1 + Trace Time 1 + 无 Parse Error 1 + test.png 存在 1）
assertion_count: 12
