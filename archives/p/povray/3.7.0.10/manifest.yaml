# 版本级 manifest
# 文件位置: archives/p/povray/3.7.0.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.7.0.10"

# 软件名
software: "povray"

# 编译状态
# published | built | failed | archived | pending_ci
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/POV-Ray/povray/archive/refs/tags/v3.7.0.10.tar.gz"

  # 源码校验和
  sha256: "7bee83d9296b98b7956eb94210cf30aa5c1bbeada8ef6b93bb52228bbc83abff"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "COMPILED_BY=OHOS PC Adaptation <dev@opendesk.local>"
    - "NON_REDISTRIBUTABLE_BUILD=yes"
    - "--with-boost=<conan boost 1.90.0.4 pkg>"
    - "--with-boost-libdir=<conan boost pkg>/lib"
    - "--without-openexr"
    - "--with-libjpeg=no"
    - "--with-libtiff=no"
    - "CXXFLAGS=-std=gnu++11"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - boost/1.90.0.4
    - libpng/1.6.39
    - zlib/1.3.1
    - "automake/1.18 (tool_requires, 生成 configure 用)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（零源码补丁；E129 umask 修复在配方 build() 内联完成）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "GitHub tag 无预生成 configure：unix/prebuild.sh 生成（aclocal/autoheader/automake/autoconf），CI 缺 automake 用 tool_requires automake/1.18 补齐"
  - "E129：autoconf 2.72 configure 内 umask 077 + HMDFS setgid → config.status 临时目录不可写，去掉 umask 077 即可"
  - "2013 年 C++ 代码（auto_ptr/register/throw()）：-std=gnu++11 全部 deprecated-but-available，零源码补丁"
  - "ohpcd boost 选型：1.84.0 无 libboost_thread、1.91.0 头文件缺 flyweight，1.90.0.4 两者兼得"
  - "libjpeg/libtiff 干净禁用需 NON_REDISTRIBUTABLE_BUILD=yes（upstream 分发条款）+ --with-libjpeg=no --with-libtiff=no"
  - "configure 必填 COMPILED_BY；make check 渲染 scenes/advanced/biscuit.pov 是 Unix 唯一上游测试"
  - "install-data-local 会写 $HOME/.povray，安装时重定向 HOME"
