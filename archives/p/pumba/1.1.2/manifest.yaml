software: pumba
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-04"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ghfast.top/https://github.com/alexei-led/pumba/archive/refs/heads/master.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.26.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: go
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go 项目在 HMDFS 上受 SELinux 限制，无法编译（E103）"
  - "Go link 工具需要 ELF 签名才能执行"
  - "GOPROXY=https://goproxy.cn,direct 加速依赖下载"
  - "Go 依赖包可能要求特定版本（如 golang.org/x/sync@v0.20.0 要求 Go >= 1.25.0）"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
