software: pumba
# 软件级 manifest 模板
# 文件位置: archives/p/pumba/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: pumba

# 软件描述
description: Chaos testing tool for Docker, containerd, and Podman containers. Inspired by Netflix Chaos Monkey, Pumba brings chaos engineering to the container level — kill, stop, pause, and remove containers, inject network delays and packet loss, or stress-test container resources.

# 官方网站/源码
homepage: https://github.com/alexei-led/pumba

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  1.1.2:
    status: built
    build_date: "2026-06-04"
    notes: 在 /data/storage/el2/base/cache 目录编译成功，绕过 HMDFS SELinux 限制

# ============================================================
# 分类信息
# ============================================================

# 软件分类
category: testing

# 标签
tags:
  - chaos-testing
  - docker
  - containerd
  - podman
  - network-emulation

# ============================================================
# 构建特性
# ============================================================

# 构建系统类型（主要）
build_system: makefile

# 编译器要求
compiler: go

# 依赖关系
dependencies:
  - go >= 1.25.0

# ============================================================
# 平台限制
# ============================================================

# 平台限制说明
platform_limitations:
  - "Go 项目在 HMDFS 上受 SELinux 限制，无法编译（E103）"
  - "建议在其他环境（非 HMDFS）编译"