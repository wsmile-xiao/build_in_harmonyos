software: psftools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.0.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.14"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.seasip.info/Unix/PSF/psftools-1.0.14.tar.gz"

  # 源码校验和
  sha256: "dcf8308fa414b486e6df7c48a2626e8dcb3c8a472c94ff04816ba95c6c51d19e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--disable-shared"
    - "-static"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "E007: config.guess (2002年版本) 不识别 HarmonyOS，需替换为新版或添加 HarmonyOS 检测分支"
    - "HMDFS 文件系统 umask 077 导致权限问题，需替换为 umask 022"
    - "HMDFS 不支持 mkfifo，make 必须用 -j1 串行构建"
    - "HarmonyOS OpenSSL 未配置 CA 证书，HTTPS 下载需用 curl -kL"
    - "Conan 2 profile 中 arch=armv8 (非 os.cpu.arch)，compiler_executables 为 dict 格式"
    - "conan cache path 返回 export 文件夹，需符号链接到包二进制文件夹才能通过 G4 检查"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/psftools-1.0.14.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/psftools-1.0.14.work
  source_orig_hash: 2bcd6d204ad15ad3
  source_work_hash: b776ed7295ae2a9d
  generated_at: '2026-06-26T01:33:07'
  patches_count: 3

patch_classification:
  - file: 0001-config-config.guess.patch
    type: platform-support
    platform_only: True
    guard: 'config.guess HarmonyOS detection'
  - file: 0002-config-config.sub.patch
    type: platform-support
    platform_only: True
    guard: 'config.sub HarmonyOS support'
  - file: 0003-configure.patch
    type: bugfix
    platform_only: True
    guard: 'umask 077 to 022 for HMDFS'
