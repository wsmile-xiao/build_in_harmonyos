software: pgtap
display: "pgTAP"
description: "PostgreSQL unit testing: TAP-emitting SQL/PLpgSQL assertion functions and TAP harness (pg_prove compatible)"
category: db
homepage: "https://pgtap.org/"
license: PostgreSQL
build_system: pgxs

ohos_adaptation:
  key_points:
    - "纯 SQL/PLpgSQL 扩展（无 C 模块、无编译产物）：PGXS make all 生成安装 SQL，package() 按上游 make install 的 DATA 清单复制到 extension/"
    - "tool_requires(postgresql/18.3)：pg_config + lib/postgresql/pgxs + 回归测试用服务端；无需 vendor PG 源码树、无需第三方补丁"
    - "tool_requires(perl/5.42.2.3)：上游 compat/gencore 与 uninstall SQL 生成需要 Perl；conan perl 包空前缀安装，内建 @INC 指向 //lib/perl5，需前置 PERL5LIB=<perl包>/lib/perl5"
    - "OSNAME=harmonyos 显式钉住：上游 tools/getos.sh（Perl Configure uname 解析器）在 OHOS shell 下失败会生成空 os_name()，破坏上游 util.sql 的 matches(os_name(),'^[[:alnum:]]+$')"
    - "上游回归驱动复刻 pg_regress 口径：psql -X -a -q 从 stdin 读脚本 + 与 test/expected 逐字节比对（postgresql/18.3 制品包不含 pg_regress）；extension.sql 因缺 citext/isn/ltree 按上游 MISSING_EXTENSIONS 规则跳过"
    - "PG 18 起用 extension_control_path=<包目录>:$system 免拷贝加载扩展（纯 SQL 扩展无需 dynamic_library_path）"
  common_dependencies:
    - postgresql
    - perl

versions:
  "1.3.4":
    status: built
    build_date: "2026-10-01"
