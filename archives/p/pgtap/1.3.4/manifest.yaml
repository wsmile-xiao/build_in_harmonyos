version: "1.3.4"
software: "pgtap"
status: built
build_date: "2026-10-01"
build_system: pgxs

source:
  url: "https://github.com/theory/pgtap/archive/refs/tags/v1.3.4.tar.gz"
  sha256: "d2c951afb296a001d21785611a8e966e3f8fa3f5bfbd929396a5130c0152f314"
  tar_format: tar.gz

build:
  system: pgxs
  configure_options:
    - "PG_CONFIG=<postgresql/18.3 package>/bin/pg_config"
    - "PERL=<perl/5.42.2.3 package>/bin/perl"
    - "PERL5LIB=<perl package>/lib/perl5"
    - "OSNAME=harmonyos"
  dependencies:
    - postgresql/18.3
    - perl/5.42.2.3
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PG 扩展的 PGXS 构建只需 postgresql 制品包：pg_config + lib/postgresql/pgxs + include/postgresql/server 齐全，无需 vendored PG 源码树"
  - "conan perl 包为空前缀安装，内建 @INC 指向 //lib/perl5/...；消费方必须把 PERL5LIB 指到 <perl包>/lib/perl5 才能加载 strict/warnings 等核心模块"
  - "上游 tools/getos.sh（Perl Configure uname 解析器）在 OHOS toybox sh 下因 command -v sed 返回别名定义而失败、输出空串；Makefile 生成 __OS__ 类变量时须显式钉住（OSNAME=harmonyos），否则生成物含空值并破坏上游断言"
  - "postgresql/18.3 制品包不含 pg_regress 与 contrib 扩展（citext/isn/ltree）；回归驱动需以 psql -X -a -q 从 stdin 读脚本 + 逐字节比对 expected 的方式等价复刻"
  - "ohc conan-verify 会在本地把 github.com URL 前缀注入 ghfast.top 镜像（E017 预防）；镜像不可达的环境下，source() 需提供剥离前缀改用内嵌官方 URL 的回退"
  - "PG 18 起可用 extension_control_path=<包目录>:$system + dynamic_library_path 免拷贝加载扩展，测试 harness 无需写入 PostgreSQL 安装目录"
