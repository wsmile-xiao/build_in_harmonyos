upstream_test_count_breakdown: "37 pg_regress groups (test/sql/*.sql + test/expected/*.out) + 2 schedule-generated setup groups (build/create) + update.sql (updatecheck only, needs pgxn install of pgtap 0.95.0 - not runnable offline)"
