upstream_test_dependency: "running PostgreSQL 18.3 server from postgresql/18.3 (postgres + initdb + pg_ctl + createdb + psql)"

upstream_test_audit: |
  Audited the upstream v1.3.4 source tree (tag v1.3.4).

  Upstream test inventory (as shipped by `make installcheck`):
    * 37 pg_regress groups in test/sql/*.sql; every group has a non-empty
      test/expected/<name>.out (54 .out files include the per-version
      alternates _1.._6 and the schedule-generated build/create/update
      expectations).
    * The Makefile generates two setup groups from test/schedule/:
      build.sql (syntax-check of sql/pgtap.sql inside a rolled-back
      transaction) and create.sql (CREATE EXTENSION pgtap).  Both are
      executed and compared byte-exactly by this harness.
    * update.sql belongs to `make updatecheck` only: it installs pgtap
      0.95.0 from PGXN (network) and then ALTER EXTENSION UPDATEs.  It is
      not part of `make installcheck` and cannot run offline, so it is not
      executed.

  Executed here: 38 groups byte-exactly (36 tests + build + create).
  extension.sql is excluded exactly like the upstream Makefile excludes it
  when citext/isn/ltree are missing (MISSING_EXTENSIONS branch): the
  postgresql/18.3 package ships no contrib extensions, so those three are
  unavailable and the group is skipped, matching upstream behaviour instead
  of silently ignoring it.

  pg_regress itself is not shipped inside postgresql/18.3 (bin/ has 35 tools
  and none of them is pg_regress).  The harness replicates the exact
  invocation pg_regress performs: `psql -X -a -q -d <db>` reading the script
  from stdin, merging stdout+stderr, and comparing byte-for-byte against
  test/expected/<name>.out (trying _N.out alternates).  Using `psql -f`
  instead of stdin would prefix errors with `<file>:<line>:` and produce
  false mismatches, so stdin is used.

