software: perl-mail-dkim
description: "Perl module for DKIM (DomainKeys Identified Mail) signature verification and signing"

# 软件元信息
homepage: https://metacpan.org/pod/Mail::DKIM
repository: https://github.com/msimerson/mail-dkim
license: perl_artistic

# 依赖关系
runtime_dependencies:
  - perl (>= 5.008)
  - Crypt::OpenSSL::RSA 0.33 (运行时签名验证依赖，已编译)
  - Crypt::OpenSSL::Random 0.11 (RSA 依赖，已编译)
  - Crypt::OpenSSL::Guess 0.15 (配置依赖，已编译并可加载)
  - Crypt::PK::Ed25519 (可选，用于 ed25519 签名)

build_dependencies:
  - perl

# 版本索引
versions:
  - version: "1.20240923"
    status: published
    build_date: "2026-06-15"