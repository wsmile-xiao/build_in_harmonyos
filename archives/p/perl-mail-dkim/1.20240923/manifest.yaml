software: perl-mail-dkim
version: "1.20240923"
status: published  # 纯 Perl 模块编译成功，依赖已编译
publish_status: published
category: perl
build_system: perl_makefile
license: perl_artistic

# 编译信息
compile_date: 2026-06-15
compiler: clang 18.1.8
perl_version: 5.42.0

# 依赖关系
dependencies:
  runtime:
    - perl (>= 5.008)
    - Crypt::OpenSSL::RSA 0.33 (签名功能必需，已编译XS模块)
    - Crypt::OpenSSL::Random 0.11 (RSA依赖，已编译XS模块)
    - Crypt::OpenSSL::Guess 0.15 (配置依赖，已编译可加载)
    - Crypt::PK::Ed25519 (ed25519 签名，可选)
  build:
    - perl

# 构建选项
configure_options: []
make_options: []

# 源码信息
source:
  url: "https://cpan.metacpan.org/authors/id/M/MS/MSIMERSON/Mail-DKIM-1.20240923.tar.gz"
  sha256: ""  # 建议填充
  tar_format: tar.gz

# 平台适配
platform_notes: |
  Mail::DKIM 是纯 Perl 模块，无 XS 组件，编译简单。

  鸿蒙平台适配：
  1. 主模块为纯 Perl 实现，编译无平台问题 ✅
  2. 运行时依赖 Crypt::OpenSSL::RSA 已成功编译 ✅
  3. XS 模块编译需要特殊链接参数 (-nostartfiles -nodefaultlibs -lc)
  4. XS 模块受 SELinux HMDFS 限制，需要 HNP 包安装

  依赖编译状态：
  - Crypt::OpenSSL::Guess 0.15: 纯Perl，编译成功，可加载 ✅
  - Crypt::OpenSSL::Random 0.11: XS模块，编译成功，SELinux限制 ⚠️
  - Crypt::OpenSSL::RSA 0.33: XS模块，编译成功，SELinux限制 ⚠️

  当前可用功能：
  - 模块加载和版本查询 ✅
  - OpenSSL 路径检测 (Guess) ✅
  - DKIM 签名/验证需管理员安装 XS 模块 ⚠️

# 质量门禁
quality_checks:
  g0_clean_build: pass
  g1_binary_integrity: pass  # 无二进制
  g2_functional: pass  # 基础模块加载
  g3_portability: pass
  g4_archive: pass

# 产物信息
artifacts:
  package: perl-mail-dkim-1.20240923-ohos-aarch64.tar.gz
  size: 336KB
  patches: 0
  dependencies_compiled:
    - Crypt-OpenSSL-Guess-0.15 (纯Perl)
    - Crypt-OpenSSL-Random-0.11 (XS, 13696 bytes)
    - Crypt-OpenSSL-RSA-0.33 (XS, 42368 bytes)

# 知识提取
knowledge_gained:
  - Mail::DKIM 是纯 Perl 模块，编译无平台问题
  - 签名功能依赖 Crypt::OpenSSL::RSA（XS 模块链）
  - XS 模块编译需要 -nostartfiles -nodefaultlibs -lc（绕过CRT缺失）
  - OpenSSL XS 模块需要显式指定 LIBS 和 INC 参数
  - SELinux HMDFS 限制 XS 模块加载，需要 HNP 包安装
  - Crypt::OpenSSL::Guess 纯 Perl 可直接使用