software: perl-module-cpanfile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.1004/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1004"

# 构建系统
build_system: perl-makemaker

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/M/MI/MIYAGAWA/Module-CPANfile-1.1004.tar.gz"

  # 源码校验和
  sha256: "88efbe2e9a642dceaa186430fedfcf999aaf0e06f6cced28a714b8e56b514921"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl-makemaker

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - CPAN::Meta/2.150010
    - CPAN::Meta::Prereqs/2.150010
    - parent/0.236
    - ExtUtils::MakeMaker/7.76

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 perl Makefile.PL 而非 ./configure，G0 clean-verify 因构建系统差异会失败，不影响实际功能"
  - "Perl 模块编译需要设置环境变量: PERL5LIB, CPATH, LIBRARY_PATH, PERL_CANARY_STABILITY_NOPROMPT"
  - "CPAN SSL 证书验证在鸿蒙系统上可能失败，需手动 curl 下载源码"
  - "CPAN 上分布名为 Module-CPANfile，注册名 perl-module-cpanfile 是 OpenDesk 命名规范"
  - "Module::CPANfile::Prereqs merged_requirements 方法存在内部数据结构 bug，非平台特定"
  - "纯 Perl 模块在鸿蒙平台上无 SELinux/HMDFS 限制，可完全正常工作"
