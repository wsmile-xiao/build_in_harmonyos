build:
  cc: clang
  configure_options: []
  cxx: clang++
  dependencies:
  - postgresql/17.10
  - zlib/1.3.1
  system: makefile
build_date: '2026-06-09'
build_system: makefile
software: pg_probackup
version: "2.5.16"
status: built
knowledge_gained:
- PGXS build needs borrowed PG source files copied directly (symlinks fail with precompiled
  PG)
- PG_LIBS needs -lz for zlib linking
- srchome must be overridden in PGXS mode (abs_top_srcdir is not set)
