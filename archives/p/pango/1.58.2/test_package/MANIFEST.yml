# test_package/MANIFEST.yml — CI L0e
package: pango/1.58.2
homepage: https://www.pango.org/

# ── 上游测试声明（TEST_QUALITY_SPEC §4.3） ───────────────────────
# 29 cases enumerated from pango-1.58.2/tests/meson.build
# (build_pangoft2=true + cairo=enabled + host_system != darwin +
# cairo png backend → test-pangocairo-threads included).
# `testrandom` is gated by `if false` → never built, not counted.
# sha256 of the audited tarball: 342385b6ca3b7c73455d7c80a13b7dbe4489e00bc3bd4c5bd6ed4dce421e374a
upstream_test_in_build: true
upstream_check_command: "meson test --no-rebuild --print-errorlogs --num-processes 1 --timeout-multiplier 16"
upstream_test_command: "meson test --no-rebuild --print-errorlogs --num-processes 1 --timeout-multiplier 16"
# 总数口径：tests/meson.build 注册的 meson 测试（单一框架，用 auto；testrandom
# 被 `if false` 守卫不编译，未计入；tarball sha256 见文件头注释）。
upstream_test_total: 29
upstream_test_count_method: auto

upstream_tests:
  # ── 基础 8 例 (always enabled) ──
  - file: test-coverage.c
    source: pango-1.58.2/tests/test-coverage.c
    description: "GLib test harness 覆盖率桩，验证 PangoCoverageLevel 枚举到级别映射"
    command: "./test-coverage -k --tap"
  - file: testboundaries.c
    source: pango-1.58.2/tests/testboundaries.c
    description: "GraphemeBreakTest/WordBreakTest 等 ICU 边界样本的字符边界推进"
    command: "./testboundaries -k --tap"
  - file: testboundaries_ucd.c
    source: pango-1.58.2/tests/testboundaries_ucd.c
    description: "Unicode 标准附件字符边界推进（与 testboundaries 互为补充）"
    command: "./testboundaries_ucd -k --tap"
  - file: testcolor.c
    source: pango-1.58.2/tests/testcolor.c
    description: "PangoColor / parse API 颜色解析与转换"
    command: "./testcolor -k --tap"
  - file: testscript.c
    source: pango-1.58.2/tests/testscript.c
    description: "ISO 15924 script 代码识别"
    command: "./testscript -k --tap"
  - file: testlanguage.c
    source: pango-1.58.2/tests/testlanguage.c
    description: "ISO 639 / BCP-47 language tag 解析"
    command: "./testlanguage -k --tap"
  - file: testmatrix.c
    source: pango-1.58.2/tests/testmatrix.c
    description: "PangoMatrix 线性代数运算（rotate/scale/concat）"
    command: "./testmatrix -k --tap"
  - file: testtabs.c
    source: pango-1.58.2/tests/testtabs.c
    description: "PangoTabStop 解析、对齐与位置计算"
    command: "./testtabs -k --tap"
  # ── pangoft2 1 例 ──
  - file: test-ot-tags.c
    source: pango-1.58.2/tests/test-ot-tags.c
    description: "OpenType 标签枚举（FT_Face 服务查询）"
    command: "./test-ot-tags -k --tap"
  # ── pangocairo 13 例 ──
  - file: test-font-data.c
    source: pango-1.58.2/tests/test-font-data.c
    description: "PangoFontData 字体数据加载（1.57+ 新增）"
    command: "./test-font-data -k --tap"
  - file: test-bidi.c
    source: pango-1.58.2/tests/test-bidi.c
    description: "PangoBidiType 与 fribidi 双向文本分类"
    command: "./test-bidi -k --tap"
  - file: testcontext.c
    source: pango-1.58.2/tests/testcontext.c
    description: "PangoContext / PangoFont / PangoGlyphString 创建、度量与渲染"
    command: "./testcontext -k --tap"
  - file: testiter.c
    source: pango-1.58.2/tests/testiter.c
    description: "PangoGlyphIter / PangoLayoutIter 像素级迭代"
    command: "./testiter -k --tap"
  - file: test-ellipsize.c
    source: pango-1.58.2/tests/test-ellipsize.c
    description: "PangoLayout 省略号（start/middle/end/none）布局"
    command: "./test-ellipsize -k --tap"
  - file: markup-parse.c
    source: pango-1.58.2/tests/markup-parse.c
    description: "PangoMarkup 解析：markups/{valid,fail}-* 用例集"
    command: "./markup-parse -k --tap"
  - file: test-itemize.c
    source: pango-1.58.2/tests/test-itemize.c
    description: "PangoLayout itemize：itemize/{one,two}.items 文本分词（缺 Cantarell 时上游自 SKIP）"
    command: "./test-itemize -k --tap"
  - file: test-shape.c
    source: pango-1.58.2/tests/test-shape.c
    description: "pango_shape / pango_shape_full HarfBuzz 整形结果回归"
    command: "./test-shape -k --tap"
  - file: test-font.c
    source: pango-1.58.2/tests/test-font.c
    description: "PangoFont / PangoFontMap / PangoFontDescription 查找与覆盖"
    command: "./test-font -k --tap"
  - file: testattributes.c
    source: pango-1.58.2/tests/testattributes.c
    description: "PangoAttrList / pango_attr_list_filter 属性过滤回归"
    command: "./testattributes -k --tap"
  - file: cxx-test.cpp
    source: pango-1.58.2/tests/cxx-test.cpp
    description: "C++ 编译冒烟（pangomm 未适配时上游行为以实测为准）"
    command: "./cxx-test -k --tap"
  - file: test-harfbuzz.c
    source: pango-1.58.2/tests/test-harfbuzz.c
    description: "Pango-HarfBuzz 桥接（hb_buffer / pango_shape）"
    command: "./test-harfbuzz -k --tap"
  - file: test-break.c
    source: pango-1.58.2/tests/test-break.c
    description: "log attrs 推进 + validate-log-attrs.c 比对 breaks/*.expected"
    command: "./test-break -k --tap"
  # ── pangocairo + pangoft2 2 例 ──
  - file: testmisc.c
    source: pango-1.58.2/tests/testmisc.c
    description: "字体度量、baseline、extent 与 cairo 渲染对齐"
    command: "./testmisc -k --tap"
  - file: testserialize.c
    source: pango-1.58.2/tests/testserialize.c
    description: "PangoContext / Layout / AttrList 的 serialize→deserialize 往返"
    command: "./testserialize -k --tap"
  # ── pangocairo + pangoft2 + 非 darwin 4 例 ──
  - file: test-layout.c
    source: pango-1.58.2/tests/test-layout.c
    description: "PangoLayout 整行布局（layouts/*.layout 集）"
    command: "./test-layout -k --tap"
  - file: test-layout2.c
    source: pango-1.58.2/tests/test-layout2.c
    description: "新布局引擎回归（1.57+ 新增，与 test-layout 同集）"
    command: "./test-layout2 -k --tap"
  - file: test-fonts.c
    source: pango-1.58.2/tests/test-fonts.c
    description: "FontConfig / fonts.conf 多字体回退与字形覆盖"
    command: "./test-fonts -k --tap"
  - file: test-no-fonts.c
    source: pango-1.58.2/tests/test-no-fonts.c
    description: "无字体配置下的错误路径（nofonts/fonts.conf）"
    command: "./test-no-fonts -k --tap"
  # ── cairo png 后端 1 例 ──
  - file: test-pangocairo-threads.c
    source: pango-1.58.2/tests/test-pangocairo-threads.c
    description: "pangocairo 多线程渲染（cairo png 后端启用时注册）"
    command: "./test-pangocairo-threads -k --tap"

# ── 字体策略（低成本补齐，无资源门控剔除） ─────────────────────
# OHOS 无 /etc/fonts/fonts.conf（上游 tests/meson.build 曾硬编码该路径）。
# 本配方：① patches/0001 改为环境继承（测试逻辑未动）；
# ② build 期生成 OHOS 专用 fonts.conf（本机真实字体目录 + 可写 cachedir）；
# ③ 按需 vendor DejaVu/Cantarell 参考字体（下载失败只告警、回退系统字体，
#    从不中断构建）。因此 excluded=0，全量 29 例进入门禁。

# ── 消费者视角测试（test_package/，R34 / TEST_QUALITY_SPEC 层 2） ──
test_package_tests:
  - file: test.c
    description: "真实功能断言：版本一致性、PangoLanguage 往返、英/泰文断行（libthai 接入判据）"
    command: "./test_probe"

assertion_count: 4

# ── 实测结果 ───────────────────────────────────────────────────
