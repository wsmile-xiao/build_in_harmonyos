software: "pango"
version: "1.58.2"
status: recipe
build_date: "2026-09-19"
build_system: meson

source:
  url: "https://download.gnome.org/sources/pango/1.58/pango-1.58.2.tar.xz"
  sha256: "342385b6ca3b7c73455d7c80a13b7dbe4489e00bc3bd4c5bd6ed4dce421e374a"
  tar_format: tar.xz
  upstream_version: "1.58.2"

configure_options:
  - "-Dwrap_mode=nodownload"
  - "-Dfontconfig=enabled"
  - "-Dcairo=enabled"
  - "-Dfreetype=enabled"
  - "-Dlibthai=enabled"
  - "-Dxft=disabled"
  - "-Dsysprof=disabled"
  - "-Dintrospection=disabled"
  - "-Ddocumentation=false"
  - "-Dman-pages=false"
  - "-Dbuild-testsuite=true"
  - "-Dbuild-examples=false"

build:
  system: meson
  dependencies:
    - glib/2.84.0.1 (shared=True 默认，对齐远端已发布二进制；要求 zlib/1.3.1.1，与 cairo 原生闭包同版本，全图零冲突零 override；上游 2.88 地板仅为消 deprecation 警告，见补丁 0002)
    - harfbuzz/14.4.0 (仅依赖 freetype，无 glib 边，打破 True/False 配对死锁；面向 pango 消费者交付)
    - fribidi/1.0.16
    - cairo/1.18.4.2 (同上游 1.18.4 tarball 的 R37 后缀重建：自带 tool_requires meson/1.11.0；本轮不再 override 其闭包，原生 package_id 即已发布二进制)
    - fontconfig/2.18.1.1 (与 cairo 对齐；2.18.1 的 .so DT_NEEDED 烤死构建机绝对路径)
    - freetype/2.14.3
    - libthai/0.1.29
  tool_dependencies:
    - meson/1.11.0

patches_applied:
  - "patches/0001-tests-fontconfig-env.patch"
  - "patches/0002-glib-floor-2.84.patch"
  - "patches/0003-tests-fonts-cache.patch"

# 测试摘要（与 test_package/MANIFEST.yml 对齐；数字以真机预检日志为准，本轮不预填）
test_summary:
  framework: "meson test (tests/)"
  total_cases: 29
  upstream_tests_modified: true
  upstream_tests_modification: "测试环境补丁 0001（FONTCONFIG_FILE 改为环境继承）+ 依赖地板补丁 0002（meson.build glib 2.88→2.84 一行，上游 bump 仅为消警告，break.c 自带回退，行为不变）+ 缓存补丁 0003（tests/fonts/fonts.conf 硬编码 /tmp/cache 改为 prefix=xdg，OHOS 的 /tmp 只读）；29 例测试逻辑未改"
  report: "test_package/MANIFEST.yml"
  verification: "待真机预检回填"

knowledge_gained:
  - "1.58.2 上游已自带 fontconfig/fcfreetype.h（1.56.4 的 0001-include-fcfreetype 补丁已过时，无需再打）"
  - "tests/meson.build 共注册 29 例（testrandom 被 if false 守卫不编译）；test-font-data/test-layout2/test-pangocairo-threads 为 1.57+ 新增"
  - "2026-09-20（第 10 策略周期）：上游 2.88 地板仅为消 deprecation 警告（Otte 提交原文），break.c 自带 <2.87 回退分支；glib 对齐 2.84.0.1（zlib/1.3.1.1）后全图零冲突零 override，cairo 取原生二进制"
  - "meson 最低要求 1.2.0；tool_requires meson/1.11.0 满足（11 > 2 按构件比较）"
  - "2026-09-20（第 9 策略周期）：移除消费者侧工具链回退三分支（前缀驱动名/SDK-glob/回退 ar）——排序证明其对 cairo 重建不可见（cairo 自有 generate 无 stale-clang 处理）；钉点冻结，仅 cairo 一处 meson 重建，健康 worker 可建"
  - "上游 tests/meson.build 把 FONTCONFIG_FILE 钉在 /etc/fonts/fonts.conf（OHOS 不存在）→ 改为环境继承 + build 期生成 OHOS 专用 fonts.conf + vendor DejaVu/Cantarell，excluded=0 全量进门禁"

notes: |
  Meson recipe for pango 1.58.2 (text layout + pangocairo), based on the
  proven 1.56.4 recipe: same dependency pins, same PkgConfigDeps .pc fixes
  (fribidi cflags / glib tool vars / cairo-ft+fc aliases), same llvm-ar
  injection, same post-install re-signing for OHOS XPM.
  New in 1.58.2: upstream test suite (29 meson cases) is enabled and executed
  in build() with HMBS_UPSTREAM_TEST_RESULT; fonts are provided via a
  generated fonts.conf plus vendored DejaVu/Cantarell reference fonts
  (best-effort download, graceful fallback to system fonts).
  Upstream test sources unmodified except the FONTCONFIG_FILE env patch.
