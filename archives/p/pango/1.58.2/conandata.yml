sources:
  url:
    - "https://mirror.nju.edu.cn/gnome/sources/pango/1.58/pango-1.58.2.tar.xz"
    - "https://download.gnome.org/sources/pango/1.58/pango-1.58.2.tar.xz"
  sha256: "342385b6ca3b7c73455d7c80a13b7dbe4489e00bc3bd4c5bd6ed4dce421e374a"
patches:
  "1.58.2":
    - patch_file: "patches/0001-tests-fontconfig-env.patch"
      patch_description: "tests/meson.build FONTCONFIG_FILE 改为环境继承，OHOS 无 /etc/fonts 时可指向生成的 fonts.conf；测试逻辑未动"
      patch_type: "portability"
    - patch_file: "patches/0002-glib-floor-2.84.patch"
      patch_description: "meson.build glib 地板 2.88→2.84 一行：上游 bump 仅为消 deprecation 警告（Otte 提交原文），break.c 自带旧版回退分支，行为不变；使全图对齐已发布二进制、零重建"
      patch_type: "portability"
    - patch_file: "patches/0003-tests-fonts-cache.patch"
      patch_description: "tests/fonts/fonts.conf 硬编码 /tmp/cache 改为 prefix=xdg：OHOS 的 /tmp 只读，真机 test-fonts 报 No writable cache directories；改走 XDG_CACHE_HOME 可写目录，测试逻辑未动"
      patch_type: "portability"
