software: pango
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.50.14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.50.14"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# 构建系统类型（顶级字段，用于 verify_build）
# cmake | autotools | makefile | meson | custom
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp2.osuosl.org/pub/blfs/conglomeration/pango/pango-1.50.14.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "-Dcairo=enabled"
    - "-Dxft=disabled"
    - "-Dintrospection=disabled"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib-2.0/2.88.0"
    - "harfbuzz/14.2.0"
    - "freetype2/26.6.20"
    - "fontconfig/2.16.0"
    - "fribidi/1.0.13"
    - "libpng/1.6.43"
    - "cairo/1.18.2"
    - "pixman-1/0.44.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
