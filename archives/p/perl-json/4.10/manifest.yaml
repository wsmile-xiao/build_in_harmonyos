software: perl-json
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.10"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/I/IS/ISHIGAKI/JSON-4.10.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器
  cc: clang
  cxx: clang++

  # 环境变量
  env_vars:
    - "CPATH=/storage/Users/currentUser/usr/local/include"
    - "LIBRARY_PATH=/storage/Users/currentUser/usr/local/lib"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块编译简单，无需 XS 编译参数"
  - "JSON 4.10 使用 JSON::backportPP backend，完全纯 Perl 实现"
  - "测试套件完整（68个文件，26111个测试用例），质量可靠"
  - "Makefile 是生成文件，不应作为补丁保存"

# ============================================================
# 产物信息
# ============================================================

packaging:
  files:
    - name: perl-json-4.10-ohos-aarch64.tar.gz
      size: 183K
      type: precompiled
