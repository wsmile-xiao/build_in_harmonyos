software: perl-crypt-openssl-random
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.17-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.17-r1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RU/RURBAN/Crypt-OpenSSL-Random-0.17.tar.gz"

  # 源码校验和
  sha256: "a571b24181baaa76c96704e92acffc6934ff593e380dade274db4e43c140ad51"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # Perl XS module uses Makefile.PL (ExtUtils::MakeMaker), not ./configure

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl-crypt-openssl-guess/0.15-r1
    - openssl/3.5.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块使用 Makefile.PL (ExtUtils::MakeMaker) 而非 ./configure"
  - "Makefile.PL 依赖 Crypt::OpenSSL::Guess 模块定位 OpenSSL 路径，需作为 Conan 依赖 (R27 @ohpcd/stable)"
  - "make test 失败因 HMDFS SELinux 限制 (E073/E166): hmdfs:s0 context 阻止 DynaLoader dlopen .so，标记为平台限制"
  - "conan-verify 8 道门禁全部通过 (G0-G4 + L2/L4/L5)"
  - "CPAN 下载 SSL 证书验证失败，需手动下载 tarball 到本地用 file:// URL"
  - "OHOS 系统 OpenSSL 库使用 'oh' 后缀命名: libssloh.so.3 / libcryptooh.so.3，非标准 libssl.so.3 / libcrypto.so.3"
  - "需用 patchelf 在 package() 阶段修复 NEEDED 条目 (libssl.so.3→libssloh.so.3) 并设置 RPATH 指向系统库目录"
  - "SELinux 上下文: hmdfs:s0 和 dev_shm:s0 阻止 dlopen，仅 hnp_file:s0 允许 dlopen"
  - "功能测试通过 C 程序直接链接 libcryptooh.so.3 验证 RAND_bytes/RAND_seed/RAND_status API (7/7 通过)"
  - "test_package 增加 NEEDED 条目验证和导出符号验证，不再仅依赖文件存在性检查"
