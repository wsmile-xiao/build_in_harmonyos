software: protoc-gen-go
build_system: custom
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.36.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.36.11"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/protocolbuffers/protobuf-go/archive/refs/tags/v1.36.11.tar.gz"

  # 源码校验和
  sha256: "517b935001f3d43640489cd1aab531a3ed5927fb34379fa6cb1c1a514e9cb8e8"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "CGO_ENABLED=0"
    - "GOOS=linux"
    - "GOARCH=arm64"
    - "GOPROXY=https://goproxy.cn,direct"
    - "go build -ldflags=-s -w"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - go/1.24.2

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Go项目在OpenHarmony使用CGO_ENABLED=0静态编译"
  - "Go安装必须版本自洽(GOROOT源码与go二进制版本一致)，否则compile报版本不匹配"
  - "Go工具链二进制需ELF签名才能在OpenHarmony上执行"
  - "Go linker mmap在HMDFS失败，TMPDIR和GOCACHE需指向/data/storage/el2/base/cache"
  - "GOPROXY=https://goproxy.cn,direct加速模块下载"
  - "protoc-gen-go源码在cmd/protoc-gen-go目录下，从protobuf-go仓库构建"
