# test_package/MANIFEST.yml
# pps-tools 1.0.3 - upstream test declaration and consumer-test audit.

package: pps-tools/1.0.3
homepage: "https://github.com/redlab-i/pps-tools"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream pps-tools 1.0.3 ships no test suite: the release tarball contains only
  ppstest.c, ppsctl.c, ppswatch.c, ppsldisc.c, ppsfind, timepps.h, a Makefile,
  README.md and COPYING.  There is no `check`/`test` target and no tests/
  directory.  The programs are PPSAPI diagnostics that require a live LinuxPPS
  device (/dev/ppsN) at run time, which OHOS does not provide; only the
  usage/error paths can be exercised without PPS hardware.
upstream_check_command: "n/a (no test target)"
upstream_test_in_build: false
upstream_test_command: "n/a"

# No upstream test cases to declare.
upstream_tests: []

test_package_tests:
  - file: test_pps_tools.sh
    description: >-
      installed-program consumer checks: presence/executability of ppstest,
      ppsctl, ppswatch, ppsldisc and ppsfind, plus the argument/usage error
      paths shared by all four programs and the installed PPSAPI header.
    command: "sh test_pps_tools.sh"
  - file: test_header.c
    description: >-
      compiles against the installed include/sys/timepps.h and exercises the
      inline PPSAPI wrappers (time_pps_create() on an invalid descriptor must
      fail); proves the header and <linux/pps.h> agree on OHOS.
    command: "<c compiler> -I <prefix>/include test_header.c -o test_header && ./test_header"

test_files:
  - path: "test_package/test_pps_tools.sh"
    test_type: "R34"
    assertion_count: 12
  - path: "test_package/test_header.c"
    test_type: "R34"
    assertion_count: 1

test_package_test_count: 2
consumer_assertion_count: 12
upstream_test_cases: 0
assertion_count: 12
