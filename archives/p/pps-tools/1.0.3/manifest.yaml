knowledge_gained:
  - "OHOS SDK sysroot 已提供 LinuxPPS 用户态所需的全部内核 uapi 头（<linux/pps.h>、<linux/types.h>、<linux/tty.h>），pps-tools 零补丁直接编译"
  - "pps-tools 的 4 个工具在运行时依赖真实 /dev/ppsN 与 /sys/class/pps（OHOS 无 PPS 时钟源），因此验证只能覆盖编译 + 参数/用法错误路径 + 头文件消费"
  - "该包既提供可执行程序又提供公共头 sys/timepps.h，属于工具包（package_type=application）但需在 cpp_info 暴露 includedirs，消费者才能 #include <sys/timepps.h>"
