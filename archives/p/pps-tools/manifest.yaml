software: pps-tools
display: "pps-tools"
description: "LinuxPPS 用户态工具集与 PPSAPI 头（ppstest/ppsctl/ppswatch/ppsldisc/ppsfind）"
category: utility
homepage: "https://github.com/redlab-i/pps-tools"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目，无 configure；CC 由 Conan buildenv 注入的 OHOS SDK clang 提供，LD=ld.lld"
    - "OHOS sysroot 已提供 <linux/pps.h>、<linux/types.h>、<linux/tty.h>，源码零改动、零补丁"
    - "运行期依赖真实 /dev/ppsN 与 /sys/class/pps（OHOS 无 PPS 时钟源），功能级测试不可行；消费者测试覆盖编译、参数/用法错误路径与头文件 API"
    - "工具包同时安装公共头 include/sys/timepps.h，cpp_info 需暴露 includedirs 供消费者 #include <sys/timepps.h>"
  common_dependencies: []

versions:
  - version: "1.0.3"
    status: built
    build_date: "2026-10-03"
