# test_package/MANIFEST.yml — paxctl 0.9
package: paxctl/0.9
homepage: "https://pax.grsecurity.net/"

# 上游无独立测试套件：paxctl 0.9 是 2014 年前后的 C 工具（paxctl.c 内含
# paxctl-elf.c），上游 Makefile 只有 all / install / clean 三个目标，
# **没有 check 或 test 目标**，源码 tarball 内也不含测试源文件。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 自带消费者测试（OHOS aarch64 上真实执行）
test_package_tests:
  - file: test_paxctl.c
    description: >-
      消费者测试 74 条断言。夹具用**被测程序自身的二进制副本**（避免引入
      外部样本，并顺带证明产物是结构完好、可被工具解析的 ELF）。覆盖：
      ① 用法与错误路径（无参数 / --help / 非法选项 / 不存在文件 / 非 ELF 文件 /
      未转换 ELF）；② -c 把 PT_GNU_STACK 转成 PT_PAX_FLAGS（含二次 -c 幂等）；
      ③ 10 个成对标志 -p/-P -e/-E -m/-M -r/-R -s/-S 的精确 12 字符标志串；
      ④ 两个组合标志串；⑤ 属性：-z 从任意前置状态都复位回基准串；
      ⑥ 属性：标志串恒为 12 字符且字符集合法；⑦ 属性：标志串与逐条说明行
      一致（偶下标=enabled、奇下标=disabled）；⑧ 多轮改写后夹具仍是合法 ELF。
      改动与读取分两次独立调用，scratch 目录由 argv 传入并显式探测可写性。
    command: "test_paxctl <bin/paxctl> <scratch-dir>"

# 测试断言总数
assertion_count: 74
