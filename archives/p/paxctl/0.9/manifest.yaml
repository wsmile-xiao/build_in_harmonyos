software: paxctl
display: "paxctl"
description: "PaX flag control for ELF binaries (view/convert/modify PT_PAX_FLAGS), GPL-2.0-or-later"
category: security
homepage: "https://pax.grsecurity.net/"
license: GPL-2.0-or-later
build_system: custom  # 单编译单元（paxctl.c 内含 paxctl-elf.c），上游 Makefile 用 gcc + 大量告警开关，conanfile 直驱 clang

ohos_adaptation:
  key_points:
    - "单编译单元：paxctl.c 直接 #include \"paxctl-elf.c\"，故只需 clang -o paxctl paxctl.c"
    - "无外部库依赖（仅 libc：stdio/stdlib/unistd/getopt/elf/fcntl/errno/sys/mman）"
    - "musl 全支持，无 patch"
    - "上游 Makefile 用 CC:=gcc 且 CFLAGS 含 -Wconversion 等一长串告警开关 → build() 直驱 clang 绕开"
    - "编译产出单可执行文件 bin/paxctl（约 30KB）"
    - "PaX 的运行时语义取决于内核配置，但 paxctl 的 ELF 文件读写行为是纯用户态操作，与内核无关"
  common_dependencies:
    - libc (stdio/stdlib/unistd/getopt/elf/fcntl/errno/sys/mman)

versions:
  "0.9":
    status: built
    build_date: "2026-09-17"
    source_url: "https://deb.debian.org/debian/pool/main/p/paxctl/paxctl_0.9.orig.tar.gz"
    source_sha256: "a330ddd812688169802a3ba29e5e3b19956376b8f6f73b8d7e9586eb04423c2e"
    test_assertions: 74
