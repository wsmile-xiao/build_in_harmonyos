software: pdal
description: >-
  PDAL (Point Data Abstraction Library) is a C++ library for translating and
  processing point cloud data (LAS/LAZ, EPT, COPC, BPF, GDAL-backed formats
  and more), providing the pdalcpp shared library plus the `pdal` command
  line application.
