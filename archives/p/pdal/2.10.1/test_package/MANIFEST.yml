package: pdal/2.10.1
homepage: "https://github.com/PDAL/PDAL"

upstream_check_command: "cmake -S . -B build -DWITH_TESTS=ON && cmake --build build && ctest --test-dir build"
upstream_test_in_build: true
upstream_test_command: >-
  ctest --test-dir build (requires PDAL test/data tree with remote fixtures;
  unit suite is not part of the packaged build, see notes.md)
upstream_test_exemption: >-
  The full upstream unit suite (pdal_test binary + ctest) requires the 149 MB
  test/data directory which references autzen/lanier datasets and additional
  remote downloads; it is disabled in the packaged build (WITH_TESTS=OFF) and
  validated instead through a programmatic point-cloud write/read roundtrip in
  test_package.
upstream_test_environment: {}
upstream_source_translation_units: 962
upstream_ctest_result: "not run in packaged build (WITH_TESTS=OFF); see exemption"
upstream_ctest_cases:
  discovered: 0
  passed: 0
  failed: 0
  not_run: 0
  exempted: 0
  evidence: "conan create log; upstream suite requires test/data fixtures"

upstream_tests:
  - file: test/unit/io/LasWriterTest.cpp
    source: PDAL-2.10.1/test/unit/io/LasWriterTest.cpp
    description: >-
      Upstream LAS write/read regression suite (BufferReader + LasWriter +
      LasReader pattern, including the auto_offset programmatic point test).
    command: "covered by test_package.cpp programmatic LAS write/read roundtrip"
  - file: test/unit/PdalConfigTest.cpp
    source: PDAL-2.10.1/test/unit/PdalConfigTest.cpp
    description: "Version string API checks."
    command: "covered by test_package.cpp pdal::Config::fullVersionString() check"

test_package_tests:
  - file: test_package.cpp
    description: >-
      Consumer-side C++17 test that registers X/Y/Z dimensions, generates 5
      points in memory through BufferReader, writes them to a LAS file with
      LasWriter, reads the file back with LasReader and verifies the point
      count and coordinate roundtrip (max error < 0.01), plus a version API
      sanity check.
    command: "./test_package"

assertion_count: 3
assertion_count_unit: "consumer assertions; separate from the upstream ctest suite"
