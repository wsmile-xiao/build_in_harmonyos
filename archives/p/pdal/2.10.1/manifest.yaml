software: pdal
version: "2.10.1"
status: built
build_date: "2026-09-03"
build_system: cmake
conan_ref: "pdal/2.10.1@ohpcd/stable"

source:
  url: "https://github.com/PDAL/PDAL/archive/refs/tags/2.10.1.tar.gz"
  sha256: "957e9f1755ac82441f99fe077b519c50ccf32f134e2e621f99a318daf1146a5d"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DWITH_TESTS=OFF"
    - "-DWITH_ZSTD=OFF"
    - "-DWITH_ZLIB=ON"
    - "-DWITH_LZMA=ON"
    - "-DWITH_BACKTRACE=OFF"
    - "-DWITH_GCS=OFF"
    - "-DWITH_COMPLETION=OFF"
    - "-DBUILD_DOCS=OFF"
    - "-DBUILD_TOOLS_LASDUMP=OFF"
    - "-DBUILD_PLUGIN_*=OFF (all optional plugins)"
  dependencies:
    - gdal/3.9.2.3
    - libcurl/8.5.0
    - libgeotiff/1.7.4
    - libtiff/4.7.2
    - proj/9.3.1.1
    - zlib/1.3.1.1
    - libxml2/2.15.3
    - xz/5.6.2
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-conan-rpath.patch"
  - "0002-avoid-openssl-relink.patch"
  - "0003-geotiff-config-target.patch"

test_results:
  validation_round: 1
  test_package: "3/3 assertions PASSED (point count roundtrip, coordinate roundtrip max error 0.000098, version API)"
  upstream_ctest_discovered: 0
  upstream_ctest_passed: 0
  upstream_ctest_failed: 0
  upstream_ctest_not_run: 0
  upstream_ctest_exempted: 0
  upstream_ctest_note: >-
    WITH_TESTS=OFF in the packaged build; the upstream unit suite
    (pdal_test) requires the 149 MB test/data fixture tree. The consumer
    test_package exercises the real PDAL API end-to-end instead
    (programmatic point generation -> LAS write -> LAS read -> verify).
knowledge_gained:
  - "dimbuilder (build-time code generator) fails under the OHOS loader because libc++_shared.so is not on the default search path; prepend the SDK runtime dir (clang++ -print-file-name=libc++_shared.so) to LD_LIBRARY_PATH in the build scope."
  - "Do NOT add conan dependency libdirs to LD_LIBRARY_PATH for this package: the SDK linker lld resolves its own libxml2.so.16 via RUNPATH and a LD_LIBRARY_PATH pointing at conan's libxml2 breaks lld."
  - "libgeotiff's public headers include <tiffio.h> but the registry's libgeotiff package does not aggregate libtiff include dirs, so consumers must link libtiff::libtiff explicitly."
  - "Upstream installs a lib/cmake/PDAL config that conflicts with CMakeDeps' generated PDALConfig; remove it in package()."
