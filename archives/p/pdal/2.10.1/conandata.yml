sources:
  url: "https://github.com/PDAL/PDAL/archive/refs/tags/2.10.1.tar.gz"
  sha256: "957e9f1755ac82441f99fe077b519c50ccf32f134e2e621f99a318daf1146a5d"

patches:
  - patch_file: "patches/0001-cmake-conan-rpath.patch"
    patch_description: "Let Conan configure RPATH instead of the upstream custom rpath module"
    patch_type: "conan"
    patch_source: "conan-center-index"
  - patch_file: "patches/0002-avoid-openssl-relink.patch"
    patch_description: "Skip relinking OpenSSL found transitively through CURL into arbiter"
    patch_type: "conan"
    patch_source: "conan-center-index"
  - patch_file: "patches/0003-geotiff-config-target.patch"
    patch_description: "Link GeoTIFF::geotiff and libtiff::libtiff targets plus GeoTIFF_INCLUDE_DIRS from the CMakeDeps config package (upstream FindGeoTIFF module variables are bypassed in CONFIG mode)"
    patch_type: "portability"
    patch_source: "local"
