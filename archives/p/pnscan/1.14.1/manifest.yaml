# 版本级 manifest 模板
# 文件位置: archives/p/pnscan/1.14.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.14.1"
software: "pnscan"
status: built
build_date: "2026-09-17"
build_system: "autotools"

source:
  url: "https://github.com/ptrrkssn/pnscan/archive/refs/tags/v1.14.1.tar.gz"
  sha256: "d7c569900cd7cdcaafdc0de74de12cc44988f7ad76917b5a2c224aa9de5fc3f8"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--host=aarch64-unknown-linux-gnu"
    - "--build=aarch64-unknown-linux-gnu"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "conan 聚合 env（conanbuild.sh）在首次 self.run 时 lazy 生成，配方内 patch env 文件会被聚合过程重写——绕开方法是显式 source conanbuildenv-*.sh 后以 env -u CONFIG_SHELL SHELL=/bin/sh 前缀逐命令路由"
  - "autoconf 2.69 config.status 的临时目录由 (umask 077 && mktemp/mkdir) 创建，0700 权限在 HMDFS 上导致 can't create subs1.awk: Permission denied（E011/E114）；build 时 sed 's/umask 077/umask 022/g' configure 保留目录创建逻辑仅放宽权限位"
  - "HMDFS getcwd 缺陷（E386）的根因是登录 shell（hnp bash）经 conanbuildenv 进入 CONFIG_SHELL/SHELL，autoconf re-exec 时触发"
