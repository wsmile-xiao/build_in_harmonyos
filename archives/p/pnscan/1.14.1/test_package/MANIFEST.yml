# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pnscan/1.14.1
homepage: "https://github.com/ptrrkssn/pnscan"

# 上游测试清点（R51）：pnscan 1.14.1 的 Makefile.in 定义
# check: check-simple check-verbose check-hostname check-response check-response-fail
# 共 5 个测试子目标（每个启动 t_listen 回显守护进程并对 127.0.0.1 执行真实扫描）。
# check-valgrind 需 valgrind（非 check 依赖链，不计入）。静态声明 N_static = 5。
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check（Autotools helper，build() 中真实执行；5 个子目标全部退出码 0）"

# 上游实际运行的测试（build() 中 make check 逐项执行）
upstream_tests:
  - file: Makefile.in (check-simple)
    source: pnscan-1.14.1/Makefile.in
    description: "./pnscan 127.0.0.1 `./t_listen`：基础扫描，t_listen 守护进程回显，pnscan 报告结果"
    command: "make check-simple"
  - file: Makefile.in (check-verbose)
    source: pnscan-1.14.1/Makefile.in
    description: "./pnscan -v ...：verbose 模式扫描"
    command: "make check-verbose"
  - file: Makefile.in (check-hostname)
    source: pnscan-1.14.1/Makefile.in
    description: "./pnscan -s ...：字符串/banner 匹配模式"
    command: "make check-hostname"
  - file: Makefile.in (check-response)
    source: pnscan-1.14.1/Makefile.in
    description: "./pnscan -r \"Hello\" ...：响应匹配 \"Hello, World!\" 命中场景"
    command: "make check-response"
  - file: Makefile.in (check-response-fail)
    source: pnscan-1.14.1/Makefile.in
    description: "./pnscan -r \"Hejsan\" ...：响应不匹配场景。注意：pnscan main 以 pthread_exit(NULL)（退出码 0）结束，无响应命中不产生非零退出码——该目标与 check-response 一样以 make 退出码判定通过，属上游测试语义的固有弱点，如实记录；其反向场景由消费者测试的断言口径补强（消费者显式断言命中串存在）"
    command: "make check-response-fail"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: dd_consumer.c
    description: "消费者测试：以使用者身份编译独立 C 程序，真实执行打包产物 bin/t_listen（读取监听端口）与 bin/pnscan -r \"Hello\" 127.0.0.1 <port>，断言 ①t_listen 输出合法端口、②pnscan 退出码 0、③扫描报告中包含 'Hello, World!' banner，任一失败退出码非 0"
    command: 'PNSCAN_BIN=<package_folder>/bin ./dd_consumer'

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
