software: pcre2
display: "PCRE2"
description: "Perl Compatible Regular Expressions library (version 2, current)"
category: foundation
homepage: "https://www.pcre.org/"
license: BSD-3-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 构建需以能力探测选择可执行 shell，并只解释源码树中无法直接执行的 shell 测试入口"
    - "静态包必须移除固化构建路径的 libtool .la，并让 pkg-config 与 *-config 元数据从安装位置解析前缀"
    - "config.guess/config.sub 需识别 HarmonyOS 内核名称和 linux-ohos 规范三元组"

versions:
