software: pcre2
version: "10.47"
status: built
build_date: "2026-08-08"
build_system: autotools

source:
  url: "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.47/pcre2-10.47.tar.gz"
  sha256: "c08ae2388ef333e8403e670ad70c0a11f1eed021fd88308d7e02f596fcd9dc16"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--enable-jit"
    - "--enable-pcre2-16"
    - "--enable-pcre2-32"
    - "--disable-pcre2grep-libz"
    - "--disable-pcre2grep-libbz2"
  dependencies: []
  cc: clang

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-config.status-hmdfs-umask.patch"

knowledge_gained:
  - "PCRE2 10.47 registers four official Automake test entries; the native reference run passed 4/4 with no skips or expected failures."
  - "The static 8/16/32-bit libraries must be PIC so GLib and other shared consumers can link them safely."
  - "PCRE2 config.sub still rejects the aarch64-linux-ohos canonical triplet."
  - "Conan 2.29.1 requires a shared option for package_type=library; a fixed-static recipe must declare package_type=static-library."
  - "HMDFS is noexec for extracted configure scripts; invoke configure through a capability-selected executable POSIX shell."
  - "Conan buildenv may be absent from the recipe Python environment; derive the shell from configured compiler tools and executable capability probes."
  - "An executable shell may still corrupt getcwd on a restricted target path; require a clean child-process pwd capability probe before running configure."
  - "Autoconf may re-exec through CONFIG_SHELL; bind CONFIG_SHELL and SHELL to the capability-tested configure shell within the invocation scope."
  - "Conan self.run sources conanbuild by default; source a package shell environment afterward for configure, make, check, and install."
  - "Automake may select a noexec build-tree install-sh for MKDIR_P; bind /system/bin/mkdir -p on OHOS so config.status can generate dependency fragments."
  - "Automake directly executes suffixless RunTest drivers; a LOG_COMPILER dispatcher interprets only the two official shell drivers while preserving direct execution of ELF tests."
  - "Installed pkg-config and pcre2-config metadata must resolve paths from the package location; remove libtool archives that retain the configure-time /lib path."
  - "E330: a capability-tested shell plus a selective LOG_COMPILER dispatcher preserves mixed shell-driver and direct-ELF Automake tests on noexec source trees; Conan buildenv is reasserted after conanbuild."
  - "CI config.status failure on HMDFS was traced to umask 077 creating an unwritable confXXXXXX directory; patch 0003 changes only the two generated configure temporary-directory masks to 022."

validation:
  status: pending_fresh_target_run
  required_upstream_tests:
    total: 4
  required_consumer_tests:
    total: 8
    assertion_count: 55
  required_metadata_relocation_checks:
    total: 6
  build_jobs: 1

patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: True
    guard: 'HarmonyOS|OpenHarmony uname capability'
  - file: 0002-config.sub.patch
    type: portability
    platform_only: True
    guard: 'linux-ohos* triplet validation'
