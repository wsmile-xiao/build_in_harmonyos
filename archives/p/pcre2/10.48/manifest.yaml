software: pcre2
version: "10.48"
status: built
build_date: "2026-09-05"
build_system: autotools

source:
  url: "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.48/pcre2-10.48.tar.gz"
  sha256: "ebcc25aadf2a51fa1fefa9b8bc9e7a79b3dae86870a0f1152a22e42befd46888"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
    - "--enable-jit"
    - "--enable-pcre2-16"
    - "--enable-pcre2-32"
    - "--disable-pcre2grep-libz"
    - "--disable-pcre2grep-libbz2"
  dependencies: []
  cc: clang

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure-hmdfs-umask.patch"

knowledge_gained:
  - "PCRE2 10.48 上游 make check 注册 4 个条目（pcre2posix_test/pcre2_jit_test/RunTest/RunGrepTest），本地实测 4/4 通过（LOG_COMPILER 分派 RunTest/RunGrepTest）"
  - "10.48 自带 config.guess（2026-08）仍无 HarmonyOS 分支、config.sub 仍无 linux-ohos 三元组——0001/0002 补丁按 10.48 实际上下文重新生成"
  - "10.48 configure 的 HMDFS 临时目录 umask 077 问题依旧（confXXXXXX/subs1.awk Permission denied），0003 补丁将两处改为 022"
  - "复用 10.47 验证过的完整 recipe：能力探测 shell + CONFIG_SHELL 绑定 + MKDIR_P + LOG_COMPILER + .pc/pcre2-config 前缀重定位 + 去 .la"
  - "本机直接访问 github.com release 下载超时（connect timeout），配方保持官方 URL（R39），本地验证经镜像拉取同一官方包（sha256 一致）"

validation:
  status: passed
  required_upstream_tests:
    total: 4
  required_consumer_tests:
    total: 8
    assertion_count: 55
  required_metadata_relocation_checks:
    total: 6
  build_jobs: 1

patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: True
    guard: 'HarmonyOS|OpenHarmony uname capability'
  - file: 0002-config.sub.patch
    type: portability
    platform_only: True
    guard: 'linux-ohos* triplet validation'
  - file: 0003-configure-hmdfs-umask.patch
    type: portability
    platform_only: True
    guard: 'HMDFS temporary-directory permissions'
