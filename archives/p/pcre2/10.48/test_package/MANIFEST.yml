package: pcre2/10.48
homepage: "https://www.pcre.org/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - file: "src/pcre2posix_test.c"
    source: "pcre2-10.48/src/pcre2posix_test.c"
    description: "Official POSIX wrapper unit test"
    command: "./pcre2posix_test"
  - file: "src/pcre2_jit_test.c"
    source: "pcre2-10.48/src/pcre2_jit_test.c"
    description: "Official JIT regression test across enabled code-unit widths"
    command: "./pcre2_jit_test"
  - file: "RunTest"
    source: "pcre2-10.48/RunTest"
    description: "Official 8/16/32-bit interpreter and JIT regression driver"
    command: "./RunTest"
  - file: "RunGrepTest"
    source: "pcre2-10.48/RunGrepTest"
    description: "Official pcre2grep command-line regression driver"
    command: "./RunGrepTest"

test_package_tests:
  - file: "test_pcre2.c"
    description: "8-bit API compile, JIT, match, offsets, and capture flow"
    command: "./test_pcre2_8"
  - file: "test_pcre2.c"
    description: "16-bit API compile, JIT, match, offsets, and capture flow"
    command: "./test_pcre2_16"
  - file: "test_pcre2.c"
    description: "32-bit API compile, JIT, match, offsets, and capture flow"
    command: "./test_pcre2_32"
  - file: "test_posix.c"
    description: "POSIX compile, match, capture, non-match, and error flow"
    command: "./test_pcre2_posix"
  - file: "grep-input.txt"
    description: "Packaged pcre2grep exact-line match flow"
    command: "pcre2grep -q '^alpha-[0-9]+$' grep-input.txt"
  - file: "conanfile.py"
    description: "Packaged pcre2test full configuration query"
    command: "pcre2test -C"
  - file: "test_pcre2.c"
    description: "Installed libpcre2-8.pc relocation and static-link consumer"
    command: "./test_pcre2_pkgconfig"
  - file: "conanfile.py"
    description: "Installed pcre2-config prefix, Cflags, and Libs relocation"
    command: "pcre2-config --prefix --cflags --libs8"

assertion_count: 55
