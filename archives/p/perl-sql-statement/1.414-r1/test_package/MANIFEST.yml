# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-sql-statement/1.414-r1
homepage: "https://metacpan.org/dist/SQL-Statement"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00error.t
    source: perl-sql-statement-1.414-r1/t/00error.t
    description: "SQL error handling tests"
    command: "perl t/00error.t"
  - file: t/01prepare.t
    source: perl-sql-statement-1.414-r1/t/01prepare.t
    description: "SQL prepare tests"
    command: "perl t/01prepare.t"
  - file: t/02execute.t
    source: perl-sql-statement-1.414-r1/t/02execute.t
    description: "SQL execute tests"
    command: "perl t/02execute.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_sql_statement.sh
    description: "SQL::Statement packaging verification + syntax check + module load attempt"
    command: "sh test_sql_statement.sh"
  - file: conanfile.py
    description: "Conan test_package entry — invokes test_sql_statement.sh via self.run()"
    command: "self.run('sh test_sql_statement.sh')"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 100
