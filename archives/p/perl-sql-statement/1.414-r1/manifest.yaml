software: perl-sql-statement
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.414-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.414-r1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# 构建系统类型 (顶级字段，用于 verify_build)
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RE/REHSACK/SQL-Statement-1.414.tar.gz"

  # 源码校验和
  sha256: "dde8bdcfa6a136eedda06519ba0f3efaec085c39db0df9c472dc0ec6cd781a49"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0 (系统 Perl)
    - perl-params-util/1.102 (运行时依赖, Params::Util)
    - perl-clone/0.47 (运行时依赖, Clone)
    - perl-module-runtime/0.016 (运行时依赖, Module::Runtime)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "SQL::Statement 是纯 Perl 模块，无需 C 编译，无 CRT 文件缺失问题（与 perl-dbd-pg 的 XS 模块不同）"
  - "纯 Perl 模块编译流程: perl Makefile.PL && make && make install DESTDIR=..."
  - "运行时依赖 Params::Util 包含 XS 组件(.so)，在 HMDFS 文件系统上加载受限，需设置 PERL_PARAMS_UTIL_PP=1 启用纯 Perl 模式"
  - "conanfile.py 中纯 Perl 模块不应声明 cpp_info.libs（无编译库可供链接）"
  - "Conan test_package 中 perl -c 语法检查可在无运行时依赖的隔离环境中验证模块可编译性"
  - "模块安装路径由 Perl 的 ExtUtils::MakeMaker 决定，DESTDIR 模式下文件安装到 {DESTDIR}/data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0/"
