# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求此文件存在）
package: pg-crash/0.3
homepage: "https://github.com/cybertec-postgresql/pg_crash"

# 上游 tarball 共 21 个文件，无 test/ 或 tests/ 目录（仅 Makefile 构建的
# 扩展源码 + debian 打包元数据）。上游验证依赖 debian/tests（autopkgtest，
# 需真实集群与共享存储环境），不属于可离线执行的上游测试套件。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: N/A
    source: N/A
    description: "上游无独立测试套件（tarball 21 文件，无 test/、tests/；debian/tests 依赖真实集群环境不可离线跑）"
    command: "N/A"

# test_package 自带测试（鸿蒙独有消费者用例，N=1）：
# pgcrash_test.py 驱动完整生产链路——
#   1. 产物断言：ELF64/AArch64/musl-only NEEDED/无 RUNPATH/导出符号契约；
#   2. 真实消费：initdb 起一次性 postgres 集群，shared_preload_libraries
#      预加载包内 pg_crash.so（postmaster 真实 dlopen）；
#   3. 功能断言：_PG_init 注册的 GUC 可见（SHOW crash.delay/crash.signals）、
#      背景 worker 在 pg_stat_bgworker 可查、server.log 有 worker 启动 LOG 行、
#      SQL 往返正常（crash.signals='0' + delay=3600s 保证 worker 无害运行）。
test_package_tests:
  - file: pgcrash_test.py
    description: "实质测试：真实 postgres 集群经 shared_preload_libraries 加载 pg_crash.so，断言 GUC 注册、背景 worker 运行、启动 LOG 与 SQL 往返（9 项检查，非纯断言）"
    command: "python3 pgcrash_test.py --package <pkg> --pg-bindir <postgresql bindir>"

assertion_count: 9
