version: "0.3"
software: "pg-crash"
status: built
build_date: "2026-10-01"
build_system: pgxs

source:
  url: "https://github.com/cybertec-postgresql/pg_crash/archive/refs/tags/v0.3.tar.gz"
  sha256: "a426b46eee20071fd16df23f19392a3be70859e1c0ca8e15902ee36e20fefe51"
  tar_format: tar.gz

build:
  system: pgxs
  configure_options:
    - "PG_CONFIG=<postgresql/16.10 package>/bin/pg_config"
    - "enable_rpath="
  dependencies:
    - postgresql/16.10
  cc: clang

package:
  deliverables:
    - lib/pg_crash.so
  note: "upstream Makefile builds the loadable module only (MODULE_big, no EXTENSION/DATA rule); loading is via shared_preload_libraries, _PG_init registers GUCs"

test:
  upstream_tests:
    count: 0
    note: "upstream tarball has no test/ suite (21 files total, Makefile-only)"
  harmonyos_tests:
    - test_pgcrash.c
    note: "HarmonyOS-exclusive consumer test: dlopen module, verify PG magic block + _PG_init, drive a live postgres instance with CREATE EXTENSION"
