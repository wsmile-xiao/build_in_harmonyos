# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: paperkey/1.6
homepage: "https://www.jabberwocky.com/software/paperkey/"

# 上游测试命令 (make check 运行 6 个测试)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/roundtrip.sh
    source: paperkey-1.6.tar.gz/tests/roundtrip.sh
    description: "RSA/DSA-ElGamal/ECC/EdDSA 密钥提取+恢复往返测试"
    command: "./roundtrip.sh"
  - file: tests/roundtrip-raw.sh
    source: paperkey-1.6.tar.gz/tests/roundtrip-raw.sh
    description: "原始格式密钥提取+恢复往返测试"
    command: "./roundtrip-raw.sh"
  - file: tests/bad-crc-base16.sh
    source: paperkey-1.6.tar.gz/tests/bad-crc-base16.sh
    description: "CRC 校验失败检测 (base16 格式)"
    command: "./bad-crc-base16.sh"
  - file: tests/bad-crc-raw.sh
    source: paperkey-1.6.tar.gz/tests/bad-crc-raw.sh
    description: "CRC 校验失败检测 (原始格式)"
    command: "./bad-crc-raw.sh"
  - file: tests/bad-primary.sh
    source: paperkey-1.6.tar.gz/tests/bad-primary.sh
    description: "主密钥损坏检测"
    command: "./bad-primary.sh"
  - file: tests/bad-subkey.sh
    source: paperkey-1.6.tar.gz/tests/bad-subkey.sh
    description: "子密钥损坏检测"
    command: "./bad-subkey.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "运行 paperkey --version 验证二进制可执行 (smoke test)"
    command: "PAPERKEY_BIN=paperkey bash test.sh"
  - file: conanfile.py
    description: "Conan test_package 入口，调用 test.sh 执行冒烟测试"
    command: "conan test"

# 测试断言总数 (上游 6 个测试 + 版本验证 1 个)
assertion_count: 7
