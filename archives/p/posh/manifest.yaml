# 软件级 manifest — posh
# 遵循 ARCHIVE-SPEC v2.0

software: posh
display: "posh (Policy-compliant Ordinary SHell)"
description: "posh — pdksh 的剥离版衍生 shell，目标是严格 POSIX 合规（Debian 维护）。单一可执行文件 posh，零外部依赖"
category: shell
homepage: "https://salsa.debian.org/debian/posh"
license: "GPL-3.0-only, BSD-3-Clause, Public Domain"
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游 tarball 不带预生成 configure（Debian 用 debian/rules 里 autoreconf -fi 构建）：build() 内自举 autoreconf，CI 缺 automake → tool_requires automake/1.18（无 libtool 需求，configure.ac 无 LT_INIT）"
    - "E011/E114：autoreconf 生成的 configure 用 `umask 077` 建 config.status 临时目录，HMDFS UID 映射 setgid 下不可写 → 'could not setup config files machinery'；configure 是生成文件（tarball 不含）无法做 patch，固化在 build() 内生成后改写 umask 077→022（poke 0001 补丁同款文本变更）"
    - "config.guess/config.sub 分两种环境：本机 OHOS 适配版 autoconf 生成的原生识别 aarch64-unknown-linux-ohos；conan 构建取 tool_requires automake/1.18 的原版 GNU 脚本，不含 HarmonyOS 支持且用 umask 077（E007+E011）→ build() 内 autoreconf 后就地注入 HarmonyOS 分支/ohos-linux 三元组/放宽 umask（带标记校验防静默失败）；两种环境均无需 --build/--host"
    - "上游 quirk：acinclude.m4 的 POSH_VERSION 忘 bump（0.14.6 发布仍定义 0.14.5），二进制 $POSH_VERSION=0.14.5，上游 tests/version.t 同样期望 0.14.5——保持与上游一致，不修改"
    - "posh 无 -version/-V/--version 选项：版本经 $POSH_VERSION 变量查询（测试断言写法需兼容 0.14.5 事实）"
    - "heredoc 临时文件路径由 TMPDIR 环境变量决定（var.c V_TMPDIR）：/tmp 只读（E002）环境必须设置 TMPDIR，上游 th 框架的环境白名单不含 TMPDIR，需 -e 注入"
    - "make 用 -j1 规避 HMDFS jobserver fifo EPERM（E074，abiword-plugin 先例；posh 体量小无性能损失）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.14.6":
    status: built
    build_date: "2026-09-03"
