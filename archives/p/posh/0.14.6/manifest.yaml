# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E011/E114（生成文件变体）：tarball 无 configure 的 autotools 项目（Debian autoreconf -fi 构建模式），umask 077 修复无法以补丁固化——固化为 build() 内 autoreconf 之后的文本改写（poke 0001 同款变更 umask 077→022，abiword-plugin/adplay 同款手法）"
  - "上游 quirk：POSH_VERSION=0.14.5 定义未随 0.14.6 发布 bump（acinclude.m4），二进制 $POSH_VERSION 报 0.14.5，上游 tests/version.t 期望值同为 0.14.5——保持上游一致不修改，测试断言兼容两种值"
  - "posh 版本查询无 -version 选项，只有 $POSH_VERSION 变量（上游 version.t 的测法）"
  - "上游 th 测试框架（perl）两个平台坑：①硬编码 /tmp 路径（OHOS 只读 E002）→ 复制 th 到可写位置重定向 /tmp 字面量（不动源码树）；②子进程环境白名单（HOME/LD_LIBRARY_PATH/LOCPATH/LOGNAME/PATH/SHELL/USER）不含 TMPDIR → -e TMPDIR=... 注入，否则 posh heredoc 临时文件创建失败（27 个假失败）"
  - "th 真实结果：216 pass / 12 expected-fail / 2 unexpected-fail（getopts OPTARG 不重置=上游实现分歧；utilities-8 umask 报错消息 musl getopt 格式=libc 差异）"
  - "autoconf 2.72 的 config.guess 原生识别 aarch64-unknown-linux-ohos，零三元组补丁"

patch_generation:
  method: none-required
  note: >
    tarball 源码零修改（.orig 基线 93 文件逐一 diff 验证）。唯一必要的构建修正
    （umask 077→022）作用于 autoreconf 生成的 configure——该文件不在 tarball 中，
    无法作为常规补丁交付，已在 conanfile.py build() 内以生成后文本改写固化
    （abiword-plugin-clarisworks/adplay 同款先例）。config.guess/config.sub
    由 autoconf 2.72 生成、原生识别 ohos 三元组，无需 E007 补丁。patches/ 为空，
    无需双工具验证。
patch_classification: []
