# test_package/MANIFEST.yml — posh 0.14.6
# CI L0e requires this file to exist.

package: posh/0.14.6
homepage: "https://salsa.debian.org/debian/posh"

# Upstream test suite: tests/th-sh runs the `th` perl framework over the
# *.t files (categories sh,posix,pdksh,posh,debian,no-history,no-typeset,
# no-aliases,no-arrays,no-coprocs,no-herestrings,no-ulimit — exactly the
# CATEGORIES_TO_TEST from tests/Makefile.am `make check`).  It was run
# FOR REAL on the porting machine during this adaptation:
#   - the framework hardcodes /tmp paths and OHOS /tmp is read-only
#     (E002), so `th` was copied to a writable location with the /tmp
#     literals redirected (the tests/ tree itself was left untouched);
#   - `th` only passes a HOME/LD_LIBRARY_PATH/LOCPATH/LOGNAME/PATH/
#     SHELL/USER whitelist to the tested shell, so TMPDIR had to be
#     injected with `-e TMPDIR=...` for posh's heredoc temp files
#     (posh honours $TMPDIR, var.c V_TMPDIR);
#   - result: 216 passed / 12 expected-failures / 2 unexpected-failures.
#     The 2 unexpected failures are attributed and non-blocking:
#       * mksh.t:utilities-getopts-2 — posh's getopts does not reset
#         OPTARG after `?` (upstream getopts implementation divergence
#         vs the mksh/pdksh semantics the test expects; libc-independent);
#       * utilities.t:utilities-8 — the umask builtin's error message
#         uses the musl getopt format ("unrecognized option: r") while
#         the test expects the glibc format ("invalid option -- 'r'")
#         (platform libc message difference, not a functional failure).
# The CI sandbox cannot reproduce this run (th needs a writable /tmp
# plus perl); the consumer-side R34 smoke suite below is what CI runs.
upstream_check_command: "tests/th-sh (th perl framework, categories per tests/Makefile.am)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: tests/th
    source: posh_0.14.6/tests/th
    description: "th perl test framework over *.t suites (arithmetic/error/exec/expand/mksh/nonposix/parameters/quoting/token/trap/utilities/variables/version); run during the port with TMPDIR injected and /tmp literals redirected to a writable dir: 216 pass / 12 expected-fail / 2 unexpected-fail (getopts OPTARG reset divergence + musl getopt error message format)"
    command: "perl th -s . -p ../posh -C sh,posix,pdksh,posh,debian,no-history,no-typeset,no-aliases,no-arrays,no-coprocs,no-herestrings,no-ulimit -e TMPDIR=<writable tmp>"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "R34 smoke suite via the installed posh: $POSH_VERSION assertion (accepts 0.14.5 = upstream forgot-to-bump quirk, and 0.14.6); arithmetic and variable/default expansion; sort|uniq pipeline; output redirection + read-back (writable $PWD, /tmp is read-only E002); exit-code propagation (exit 42, false->1, true->0); functions; if/else; case; for accumulation; script-file mode (posh script.sh with function+for+exit 7, output and exit code asserted) and #!/usr/bin/env posh shebang execution"
    command: "bash test.sh"

# T1(1) + T2(2) + T3(2) + T4(1) + T5(1) + T6(3) + T7(1) + T8(2) + T9(2)
# + T10(1) + T11a(2) + T11b(1)
assertion_count: 19
