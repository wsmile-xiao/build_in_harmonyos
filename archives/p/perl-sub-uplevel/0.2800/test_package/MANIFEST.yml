# test_package/MANIFEST.yml — perl-sub-uplevel 0.2800
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-sub-uplevel/0.2800
homepage: "https://metacpan.org/pod/Sub::Uplevel"

# 上游测试套件：t/ 目录 10 个 .t 测试文件（prove 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Sub-Uplevel-0.2800/t/*.t
    description: "10 个 .t 测试文件：本地实测 158/158（100%），零失败"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Sub::Uplevel + uplevel_level）
test_package_tests:
  - file: test_sub_uplevel.py
    description: "Loads packaged Sub::Uplevel via perl -I<lib> and calls uplevel_level() (real API)"
    command: "python3 test_sub_uplevel.py"

# 断言总数：1（模块加载 + API 调用校验）
assertion_count: 1
