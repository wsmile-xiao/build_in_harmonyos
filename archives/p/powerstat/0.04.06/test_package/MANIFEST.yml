# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: powerstat/0.04.06
homepage: "https://github.com/ColinIanKing/powerstat"

# 上游测试命令：官方源码无任何测试目标（已核对 tag V0.04.06 全部 22 个文件：
# Makefile 无 check/test 目标，无 tests/ 目录、无 ctest/GTest 注册项）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：官方源码声明 0 个测试入口（无测试源文件）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证：真实调用已安装 CLI 二进制)
test_package_tests:
  - file: test.c
    description: "消费者测试：运行已安装的 powerstat 二进制，核验 -h 输出版本行"
    command: "powerstat -h && powerstat -h | grep -q 'version 0.04.06'"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2