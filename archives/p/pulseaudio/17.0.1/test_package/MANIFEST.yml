# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pulseaudio/17.0.1
homepage: "https://www.freedesktop.org/wiki/Software/PulseAudio/"

# 上游测试命令
upstream_check_command: "meson test --list"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test.c
    source: test_package/test.c
    description: "Consumer test: verify pa_get_library_version() returns 17.x version"
    command: "./test_pulseaudio"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "Call pa_get_library_version() to verify the library is functional"
    command: "./test_pulseaudio"

# 测试断言总数
assertion_count: 3
