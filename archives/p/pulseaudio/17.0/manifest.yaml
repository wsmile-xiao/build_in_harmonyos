software: pulseaudio
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/17.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "17.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.freedesktop.org/pulseaudio/pulseaudio/-/archive/v17.0/pulseaudio-v17.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: meson

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-.tarball-version.patch"
  - "0002-meson.build.patch"
  - "0003-src-meson.build.patch"
  - "0004-src-pulsecore-core-util.c.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PulseAudio 17.0 uses Meson build system, not autotools"
  - "Glib's libintl.h proxy header redefines dgettext to g_libintl_dgettext, causing linker errors. Disable ENABLE_NLS on HarmonyOS to avoid this"
  - "glib_dep.partial_dependency(compile_args: true) doesn't link glib library, need full glib_dep for libpulsecommon"
  - "gethostid() is not available on HarmonyOS, add __OHOS__ guard similar to __ANDROID__"
  - ".tarball-version file must contain '17.0' (no v prefix) for git-version-gen script"
  - "libsndfile 1.2.2 is a required dependency, built with CMake"

patch_generation:
