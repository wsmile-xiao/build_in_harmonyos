software: pkg-config
display: "pkg-config"
description: "Helper tool for querying library compile/link flags"
category: build-tool
homepage: "https://gitlab.freedesktop.org/pkg-config/pkg-config"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "内嵌 glib 2.56.0 子目录，需同时修复主目录和 glib 子目录的构建文件"
    - "configure 生成 config.status 时用 umask 077 建临时目录，HMDFS 下该权限（drwx--S---）不可写，需改 022"
    - "glib/configure 需追加 -Wno-error=int-conversion/-Wno-error=incompatible-pointer-types 抑制旧 glib 类型警告"
    - "install-exec-hook 的 ln -f 建 triplet 硬链接在 HMDFS 上不可用，改为 wrapper 脚本"
    - "10个补丁：config.guess/config.sub × 2 + configure × 2 + umask × 2 + warnflags × 1 + ln-hook × 1"
    - "configure 需 --with-internal-glib（OHOS 无独立 glib-2.0.pc）"

versions:
  "0.29.2":
    status: built
    build_date: "2026-04-06"
    adapted_date: "2026-09-21"
    patches_count: 10
    upstream_tests: "30/30 passed"
