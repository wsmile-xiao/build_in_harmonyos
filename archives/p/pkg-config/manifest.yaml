software: pkg-config
display: "pkg-config"
description: "Helper tool for querying library compile/link flags"
category: build-tool
homepage: "https://gitlab.freedesktop.org/pkg-config/pkg-config"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "内嵌 glib 2.56.0 子目录，需同时修复主目录和 glib 子目录的构建文件"
    - "glib/glib/Makefile 需添加 -Wno-error=int-conversion 抑制类型警告"
    - "triplet wrapper 使用脚本而非软链接（HMDFS限制）"
    - "6个补丁：config.guess/config.sub × 2 + configure × 2 + Makefile × 1"

versions:
  "0.29.2":
    status: published
    build_date: "2026-04-06"
