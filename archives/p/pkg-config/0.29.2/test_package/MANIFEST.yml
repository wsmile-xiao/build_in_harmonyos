# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pkg-config/0.29.2
homepage: "https://gitlab.freedesktop.org/pkg-config/pkg-config"

# 上游测试命令 (make check；上游 check/ 目录注册了 30 个 shell 测试脚本)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游 make check 需与顶层 make 分离执行（避免 build() 阶段把测试失败误判为编译失败），
# 故不集成进 build()，由本地 W3 流程与 CI 单独执行并记录。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（make check 驱动 check/*.sh，共 30 项，本地实测全通过）
upstream_tests:
  - file: "check/check-cflags"
    source: "pkg-config-0.29.2/check/check-cflags"
    description: "校验 --cflags 输出的 include 标志"
    command: "make check"
  - file: "check/check-libs"
    source: "pkg-config-0.29.2/check/check-libs"
    description: "校验 --libs 输出的链接标志"
    command: "make check"
  - file: "check/check-mixed-flags"
    source: "pkg-config-0.29.2/check/check-mixed-flags"
    description: "校验 cflags/libs 混合标志处理"
    command: "make check"
  - file: "check/check-non-l-flags"
    source: "pkg-config-0.29.2/check/check-non-l-flags"
    description: "校验非 -l 形式的链接标志"
    command: "make check"
  - file: "check/check-define-variable"
    source: "pkg-config-0.29.2/check/check-define-variable"
    description: "校验 --define-variable 变量覆盖"
    command: "make check"
  - file: "check/check-libs-private"
    source: "pkg-config-0.29.2/check/check-libs-private"
    description: "校验 --libs-only-l 与私有库处理"
    command: "make check"
  - file: "check/check-requires-private"
    source: "pkg-config-0.29.2/check/check-requires-private"
    description: "校验 Requires.private 递归解析"
    command: "make check"
  - file: "check/check-circular-requires"
    source: "pkg-config-0.29.2/check/check-circular-requires"
    description: "校验循环 Requires 的检测与报错"
    command: "make check"
  - file: "check/check-includedir"
    source: "pkg-config-0.29.2/check/check-includedir"
    description: "校验 includedir 变量与 cflags 拼接"
    command: "make check"
  - file: "check/check-conflicts"
    source: "pkg-config-0.29.2/check/check-conflicts"
    description: "校验 Conflicts 字段处理"
    command: "make check"
  - file: "check/check-missing"
    source: "pkg-config-0.29.2/check/check-missing"
    description: "校验缺失模块的退出码与报错信息"
    command: "make check"
  - file: "check/check-special-flags"
    source: "pkg-config-0.29.2/check/check-special-flags"
    description: "校验含特殊字符的标志传递"
    command: "make check"
  - file: "check/check-sort-order"
    source: "pkg-config-0.29.2/check/check-sort-order"
    description: "校验链接标志的去重与顺序"
    command: "make check"
  - file: "check/check-duplicate-flags"
    source: "pkg-config-0.29.2/check/check-duplicate-flags"
    description: "校验重复标志去重"
    command: "make check"
  - file: "check/check-whitespace"
    source: "pkg-config-0.29.2/check/check-whitespace"
    description: "校验 .pc 文件空白字符容错"
    command: "make check"
  - file: "check/check-cmd-options"
    source: "pkg-config-0.29.2/check/check-cmd-options"
    description: "校验命令行选项解析"
    command: "make check"
  - file: "check/check-version"
    source: "pkg-config-0.29.2/check/check-version"
    description: "校验 --atleast-version/--exact-version 等版本比较"
    command: "make check"
  - file: "check/check-requires-version"
    source: "pkg-config-0.29.2/check/check-requires-version"
    description: "校验 Requires 中的版本约束"
    command: "make check"
  - file: "check/check-print-options"
    source: "pkg-config-0.29.2/check/check-print-options"
    description: "校验 --print-requires/--print-provides 等输出"
    command: "make check"
  - file: "check/check-path"
    source: "pkg-config-0.29.2/check/check-path"
    description: "校验 PKG_CONFIG_PATH 搜索路径"
    command: "make check"
  - file: "check/check-sysroot"
    source: "pkg-config-0.29.2/check/check-sysroot"
    description: "校验 --sysroot 路径前缀处理"
    command: "make check"
  - file: "check/check-uninstalled"
    source: "pkg-config-0.29.2/check/check-uninstalled"
    description: "校验 -uninstalled .pc 优先查找"
    command: "make check"
  - file: "check/check-debug"
    source: "pkg-config-0.29.2/check/check-debug"
    description: "校验 --debug 诊断输出"
    command: "make check"
  - file: "check/check-gtk"
    source: "pkg-config-0.29.2/check/check-gtk"
    description: "校验 GTK+ 典型 .pc 组合场景"
    command: "make check"
  - file: "check/check-tilde"
    source: "pkg-config-0.29.2/check/check-tilde"
    description: "校验 ~ 展开处理"
    command: "make check"
  - file: "check/check-relocatable"
    source: "pkg-config-0.29.2/check/check-relocatable"
    description: "校验 --define-prefix 可重定位前缀"
    command: "make check"
  - file: "check/check-variable-override"
    source: "pkg-config-0.29.2/check/check-variable-override"
    description: "校验变量覆盖优先级"
    command: "make check"
  - file: "check/check-variables"
    source: "pkg-config-0.29.2/check/check-variables"
    description: "校验 --variable 取值与递归展开"
    command: "make check"
  - file: "check/check-dependencies"
    source: "pkg-config-0.29.2/check/check-dependencies"
    description: "校验依赖链递归与顺序"
    command: "make check"
  - file: "check/check-system-flags"
    source: "pkg-config-0.29.2/check/check-system-flags"
    description: "校验系统路径标志过滤（--dont-define-prefix 等）"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pkg_config.py
    description: "消费者功能测试主体：以 tool_requires 消费后真实执行 pkg-config（--version/--modversion/--libs/--cflags/--variable 往返 + 变量递归展开 + 未知名模块非 0 退出的错误语义），并验证鸿蒙特有三项：triplet wrapper 脚本、pkg.m4 随包分发、产物为 aarch64 ELF"
    command: "python3 test_pkg_config.py <pkg-config-prefix>"
  - file: conanfile.py
    description: "Conan 测试驱动：定位被测工具的 package_folder，以 conanbuild 环境拉起 test_pkg_config.py 并透出失败"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 30 项 shell 测试脚本，每项含多条断言；此处按测试脚本数计 30。
assertion_count: 30
