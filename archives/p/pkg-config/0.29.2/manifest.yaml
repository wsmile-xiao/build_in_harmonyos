# 编译档案 manifest
# 生成时间: 2026-04-04

software: pkg-config
version: 0.29.2
status: completed

build_system: autotools
source_url: https://pkg-config.freedesktop.org/releases/pkg-config-0.29.2.tar.gz

# 编译环境信息
created_at: 2026-04-04
completed_at: 2026-04-04

# 编译选项
configure_options:
  - "--prefix=$HOME/usr/local"
  - "--with-internal-glib"
  - "--build=aarch64-unknown-linux-ohos"
  - "--host=aarch64-unknown-linux-ohos"
  - "--target=aarch64-unknown-linux-ohos"

# 编译器环境
compiler: clang 15.0.4
cflags: "-fPIC -O2 -Wno-error"

# 补丁列表
patches_applied:
  - name: "glib-Makefile-remove-Werror"
    description: "移除 glib/glib/Makefile 中的 -Werror=* 标志（clang 15 不兼容）"
    files:
      - "glib/Makefile"
      - "glib/glib/Makefile"
  - name: "glib-Makefile-add-Wno-int-conversion"
    description: "添加 -Wno-int-conversion -Wno-incompatible-pointer-types 到 GLIB_WARN_CFLAGS（修复 gatomic.c 类型错误）"
    files:
      - "glib/glib/Makefile"
  - name: "config.sub-update"
    description: "更新 config.sub 和 config.guess 以支持 aarch64-unknown-linux-ohos 三元组"
    source: "https://git.savannah.gnu.org/gitweb/?p=config.git"
    files:
      - "config.sub"
      - "config.guess"
      - "glib/config.sub"
      - "glib/config.guess"

# 知识积累
knowledge_gained:
  - "HarmonyOS config.guess 无法识别系统，必须显式指定 --build/--host/--target 三元组"
  - "pkg-config 内置 glib 2.38.2 的 gatomic.c 与 clang 15 不兼容（整数到指针转换错误）"
  - "glib configure 脚本会自动检测编译器并添加大量 -Werror 标志，需在 Makefile 中移除"
  - "make install 的 install-exec-hook 尝试创建硬链接，鸿蒙不支持，需用 cp 替代"

# 预编译包信息
prebuilt_package:
  path: prebuild_packages/pkg-config-0.29.2-ohos-aarch64.tar.gz
  size: "1.4M"
  files: 6
  debug_package: prebuild_packages/pkg-config-0.29.2-ohos-aarch64-debug.tar.gz
  debug_size: "236K"
  external_dependencies: []  # 仅依赖 musl libc

# 编译日志
build_log: logs/build.log
