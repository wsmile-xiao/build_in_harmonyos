# 软件级 manifest
# 文件位置: archives/p/postgresql-url_encode/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: postgresql-url_encode

# 显示名
display: "PostgreSQL URL Encode"

# 一句话描述
description: "URL encoding and decoding functions for PostgreSQL"

# 分类标签
category: db

# 官网 URL
homepage: "https://api.pgxn.org/dist/url_encode/"

# 开源许可证（SPDX 标识）
license: PostgreSQL

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: pgxs

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - PostgreSQL 17 API变更：需添加varatt.h头文件
  # 跨版本通用依赖
  common_dependencies:
    - postgresql

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.2.3":
    status: published
    build_date: 2026-06-04