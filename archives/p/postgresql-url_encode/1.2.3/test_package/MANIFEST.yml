package: postgresql-url_encode/1.2.3
homepage: "https://github.com/okbob/url_encode"
upstream_check_command: "make installcheck"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: test/sql/url_encode.sql
    description: "Upstream regression test: 5 SQL statements covering url_encode/url_decode/uri_encode/uri_decode (expected output in test/expected/url_encode.out)"
test_package_tests:
  - file: run_pg_test.sh
    description: "Live-server functional test: initdb a PostgreSQL 18.3 cluster, install the packaged extension files, CREATE EXTENSION, then execute all 5 upstream test statements via psql and assert the exact expected outputs (including the 5-row unnest result and the md5 digest)"
    command: "bash run_pg_test.sh <pg_bindir> <pkg_libdir> <pkg_sharedir>"
assertion_count: 6
