# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - PostgreSQL 17+ moved varlena macros to varatt.h; 2015-era extension sources need #include "varatt.h"
  - PG extension builds should depend on the conan postgresql package (server headers + PGXS + relocatable pg_config), not build PG source in build()
  - PGXS resolves all paths through pg_config at make time; pg_config (PG 18) is relocatable via /proc/self/exe
  - CI workers cannot reach api.pgxn.org / ftp.postgresql.org; use github.com archive URLs (CI auto-injects gh-proxy fallback, R39)
  - PG extension .so has undefined server symbols (pg_detoast_datum etc.) so plain dlopen fails; real verification requires a running postgres server
  - postgres 18.3 server + initdb + pg_ctl run natively on OHOS PC; extensions load and work (no ELF signing blocker for user-built .so)
