# 版本级 manifest — polyseed 1.0.0
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.0"

# 软件名
software: "polyseed"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-19"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tevador/polyseed/archive/refs/tags/v1.0.0.tar.gz"

  # 源码校验和
  sha256: "45f1e6c08575286581079e6e26d341a3a33abe1f1ee2d026bd098cf632ea2349"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "AArch64 ELF ABI 默认 char 无符号 (CHAR_MIN=0)，utf8_nfkd_lazy 的 *p<0 非ASCII分支被禁用 → conanfile generate() 追加 -fsigned-char (DRAFT-9645)"
  - "上游测试为 main() 自驱动 libc assert 无 CTest 注册 → 配方 build() 内 glob 定位并直接运行 polyseed-tests"
  - "polyseed 消费者必须注入完整 DI 依赖且 u8_nfkd 需做空白归一 (对齐上游 u8_nfkd_spaces)，恒等实现会导致日语 U+3000 分词失败 (ERR_NUM_WORDS)"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
