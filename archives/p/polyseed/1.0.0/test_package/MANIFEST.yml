# test_package/MANIFEST.yml
# 上游官方测试声明文件 (L0e 要求)
# 详见: docs/TEST_QUALITY_SPEC.md

package: polyseed/1.0.0
homepage: "https://github.com/tevador/polyseed"

# 上游无 ctest 注册 (CMakeLists 仅 add_executable(polyseed-tests tests/tests.c)),
# 官方测试程序为自研 assert 驱动套件, main() 逐条 RUN_TEST/RUN_MULT。
upstream_check_command: "./polyseed-tests"

# conanfile.py build() 中已集成上游测试 (构建后直接运行 polyseed-tests)
upstream_test_in_build: true
upstream_test_command: "./polyseed-tests"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tests.c
    source: polyseed-1.0.0/tests/tests.c
    description: "上游官方套件: main() 中 51 个测试用例 (48 个 RUN_TEST + 3 个 RUN_MULT 多语言子测试, 各展开 10 个语言 subtest, 设备日志共 78 行 PASSED), libc assert() 驱动, 源码断言点 83 处; 真机实测 51/51 用例全过, exit 0"
    command: "./polyseed-tests"

# test_package 消费者测试 (真实调用被测库公开 API)
test_package_tests:
  - file: test.c
    description: "消费者回归测试: 注入依赖后执行 create/encode/decode/keygen/store/load/crypt 全流程 + 全部 10 种语言 encode/decode 往返 (覆盖 AArch64 char 符号性回归路径), 实际执行断言 51 条"
    command: "./test_polyseed"

# 断言总数口径: 上游源码断言点 83 + 消费者测试实际执行断言 51 = 134
# (上游使用 libc assert(), 无运行时计数器, 以源码断言点计; 消费者侧为真实执行数)
assertion_count: 134
assertion_count_breakdown:
  upstream_source_assert_sites: 83
  upstream_test_cases: 51
  consumer_executed_assertions: 51
