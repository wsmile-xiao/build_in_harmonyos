# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pffft/1.1.0
homepage: "https://github.com/marton78/pffft"

# 上游测试命令（CMake 顶层默认形态：tests + benchmarks ON，ctest 注册 9 项）
upstream_check_command: "ctest"

# conanfile.py build() 方法中已集成上游测试（ctest 9 项全量执行）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure (9 registered entries)"

# 上游实际运行的测试程序（tests/CMakeLists.txt 注册的 ctest 项，上游顶层默认形态：
# PFFFT_BUILD_TESTS=ON + PFFFT_BUILD_BENCHMARKS=ON + PFFFT_USE_FFTPACK=ON；
# bench 对照子模块 greenffts/kissfft/pocketfft 不在 release tarball 内，
# 与上游 CI 一致显式关闭 —— 同款豁免口径）
upstream_tests:
  - file: test_fft_factors
    source: pffft-1.1.0/tests/test_fft_factors.c
    description: "FFT 因子分解辅助函数测试（pffft_next_power_of_two/pffft_is_power_of_two/pffft_nearest_transform_size 等边界值表驱动校验，float+double 双精度变体）"
    command: "ctest (test_fft_factors)"
  - file: test_fftpack_float
    source: pffft-1.1.0/src/fftpack.c
    description: "树内 FFTPACK 参考实现自测试（float 精度，TESTING_FFTPACK 编译，用于上游 test_pffft 的对照基准有效性验证）"
    command: "ctest (test_fftpack_float)"
  - file: test_fftpack_double
    source: pffft-1.1.0/src/fftpack.c
    description: "树内 FFTPACK 参考实现自测试（double 精度，FFTPACK_DOUBLE_PRECISION 编译）"
    command: "ctest (test_fftpack_double)"
  - file: test_pfconv_lens_symetric
    source: pffft-1.1.0/tests/test_pffastconv.c
    description: "PFFASTCONV 快速卷积长度扫描测试（对称卷积核 --quick --sym 模式，与 PFFFT 变换结果一致性校验）"
    command: "ctest (test_pfconv_lens_symetric)"
  - file: test_pfconv_lens_non_sym
    source: pffft-1.1.0/tests/test_pffastconv.c
    description: "PFFASTCONV 快速卷积长度扫描测试（非对称卷积核 --quick 模式）"
    command: "ctest (test_pfconv_lens_non_sym)"
  - file: bench_pfconv_symetric
    source: pffft-1.1.0/tests/test_pffastconv.c
    description: "PFFASTCONV 卷积基准（--no-len --quick --sym，ctest 注册的 bench 类入口，含正确性校验路径）"
    command: "ctest (bench_pfconv_symetric)"
  - file: bench_pfconv_non_sym
    source: pffft-1.1.0/tests/test_pffastconv.c
    description: "PFFASTCONV 卷积基准（--no-len --quick，非对称核）"
    command: "ctest (bench_pfconv_non_sym)"
  - file: bench_pffft_pow2
    source: pffft-1.1.0/benchmarks/bench_pffft.c
    description: "PFFFT 性能基准（pow2 长度 --max-len 128 --quick；内部含与 FFTPACK 参考实现的正确性对照）"
    command: "ctest (bench_pffft_pow2)"
  - file: bench_pffft_non2
    source: pffft-1.1.0/benchmarks/bench_pffft.c
    description: "PFFFT 性能基准（非 pow2 长度 --non-pow2 --max-len 192 --quick）"
    command: "ctest (bench_pffft_non2)"
