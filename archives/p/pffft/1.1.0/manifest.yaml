# 归档 manifest（版本级）
# 文件位置: archives/p/pffft/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "1.1.0"

# 软件名
software: "pffft"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-04"
build_system: cmake

# 源码信息
source:
  # 源码下载 URL（镜像前置 + 官方兜底，双源 sha256 实测一致）
  url: "https://github.com/marton78/pffft/archive/refs/tags/v1.1.0.tar.gz"

  # 源码校验和（本机双源下载实测，ghfast.top 镜像与官方逐字节一致）
  sha256: "ea0701a6bc256405b03975908a6a92d0ffecdd18579e8484b8d789c8bd561787"

  # 压缩格式
  tar_format: tar.gz

# 构建配置
build:
  # 构建系统类型
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DPFFFT_BUILD_TESTS=ON"
  - "-DPFFFT_BUILD_BENCHMARKS=ON"
  - "-DPFFFT_BUILD_EXAMPLES=OFF"
  - "-DPFFFT_USE_FFTPACK=ON"
  - "-DPFFFT_USE_BENCH_GREEN=OFF"
  - "-DPFFFT_USE_BENCH_KISS=OFF"
  - "-DPFFFT_USE_BENCH_POCKET=OFF"
  - "-DCMAKE_C_FLAGS=-DPFFFT_ENABLE_NEON=1 (aarch64 NEON 激活，见 notes.md)"

  # 编译依赖列表（格式: name/version）
  # 无：上游零第三方依赖（FFPACK 对照实现为树内源码；bench 对照子模块不在 tarball 内）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# 应用的补丁列表
patches_applied: []

# 编译中学到的知识
knowledge_gained:
- "PFFFT_ENABLE_NEON 在 v1.1.0 中不经任何默认 CMake 选项激活（README 提及的
  PFFFT_USE_SIMD_NEON 选项实际不存在）；target_optimizations.cmake 仅在
  TARGET_C_EXTRA=neon_* 分支注入该宏，而 neon_* extra 值仅 arm32 环境提供，
  非 Apple aarch64 的 GCC_EXTRA_VALUES 为空——aarch64 需经 CMAKE_C_FLAGS
  注入 -DPFFFT_ENABLE_NEON=1（NEON 为 aarch64 基线指令集，无需 -march）"
- "上游 ctest 注册 9 项（tests/CMakeLists.txt：1 因子分解 + 2 FFTPACK 自测 +
  4 卷积 + 2 bench），另有 ctest 未注册的 --test-simd SIMD 自检 main 分支
  （validate_pffft_simd_ex/validate_pffftd_simd_ex）"
