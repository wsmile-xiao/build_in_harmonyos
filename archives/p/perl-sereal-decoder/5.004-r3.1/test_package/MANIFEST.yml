# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package/conanfile.py
    description: "Conan L1 测试: 包结构验证 (Decoder.pm/Constants.pm/Decoder.so) + ELF 签名验证 + Perl 语法检查"
    command: "conan test test_package/ perl-sereal-decoder/5.004-r3.1@ohpcd/stable"

# 测试断言总数 (近似值, 用于质量评估)
# 上游 95 个 .t 文件 (含 t/700_roundtrip 子目录 66 个 + t/ 顶层 28 个 + xt/ 1 个)
# 每个测试文件约 5-50 个断言, 估算约 1000+
# 鸿蒙平台 SELinux 限制无法运行时验证, 通过文件验证+语法检查+ELF签名验证替代
assertion_count: 1000
