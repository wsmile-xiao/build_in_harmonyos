# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-sereal-decoder/5.004-r3.1
homepage: "https://metacpan.org/dist/Sereal-Decoder"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# OHOS 平台 SELinux HMDFS 限制 (E046) 导致 .so 运行时 dlopen 被阻止,
# 所有 Perl XS 模块的 make test 均无法在编译阶段执行。
# 此为 OHOS 平台已知限制, 影响 perl-sereal-encoder/perl-dbd-pg/perl-set-object 等所有 XS 模块。
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
# 注: 鸿蒙平台 SELinux HMDFS 限制导致 make test 无法加载 Decoder.so
# 测试在模块安装到 /data/service/hnp/ 后可正常运行
upstream_tests:
  - file: t/001_load.t
    source: Sereal-Decoder-5.004.tar.gz/t/001_load.t
    description: "模块加载测试 (use Sereal::Decoder)"
    command: "perl -MTest::Harness -e 'test_harness(0, \"blib/lib\", \"blib/arch\")' t/001_load.t"
  - file: t/002_have_enc_and_dec.t
    source: Sereal-Decoder-5.004.tar.gz/t/002_have_enc_and_dec.t
