software: perl-sereal-decoder
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/5.004-r3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "5.004-r3.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL (GitHub archive, CPAN URL unreachable from some CI workers)
  url: "https://github.com/Sereal/Sereal/archive/refs/tags/Sereal-Decoder-5.004.tar.gz"

  # 源码校验和
  sha256: "4701cf80ab7814a495b2799e5967d4285d93bc0865ffbfc9d912bcf9b551a14a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"
    - "make -j1"
    - "make install DESTDIR=$PACKAGE_FOLDER"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

  # ELF 签名 (OHOS 必需)
  elf_signing:
    tool: binary-sign-tool
    method: selfSign
    steps:
      - "llvm-objcopy --remove-section .codesign"
      - "binary-sign-tool sign -selfSign 1"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块 (Sereal::Decoder) 使用 ExtUtils::MakeMaker (Makefile.PL) 构建"
  - "内嵌 miniz/csnappy/zstd 静态库编译进 .so，无外部 C 依赖"
  - "环境变量 USE_UNALIGNED=1 NO_ASM=1 CPAN_COMPAT=1 SEREAL_USE_BUNDLED_LIBS=1 用于跨编译安全"
  - "OHOS 平台 .so 必须签名 (binary-sign-tool -selfSign)，否则 musl 动态链接器拒绝加载"
  - "ELF 签名流程: llvm-objcopy --remove-section .codesign → binary-sign-tool sign -selfSign 1"
  - "OHOS HMDFS/SELinux 限制 .so 运行时 dlopen (E046)，影响所有 Perl XS 模块，非本软件特有"
  - "test_package 应使用文件验证 + perl -c 语法检查模式，不做 runtime .so 加载"
  - "package_info() 应从 settings 计算 perl_arch 和 perl_ver，使用 self.package_folder 构造绝对路径"
  - "参照 perl-sereal-encoder (已 published) 的成熟方案: ELF 签名 + 文件验证测试模式"
  - "参照 perl-dbd-pg 编译经验: XS 模块在 OHOS 上 .so 有加载限制，编译阶段不受影响"
  - "conan-verify 全部通过 (G0-G4 + L2/L4/L5)，可标记 published"
  - "CI L0e 门禁要求 test_package/MANIFEST.yml, 已创建并声明 95 个上游测试"
  - "OHOS SELinux 上下文区分: hnp_file (系统路径, 允许 .so dlopen) vs hmdfs (用户路径, 拒绝 dlopen)"
  - "系统 XS 模块 (Fcntl/IO/POSIX/Socket) 从 hnp_file 路径加载成功, 验证 .so 加载机制本身正常"
  - "make -j1 避免 OHOS FIFO 限制 (E074), -j2 会触发 jobserver mkfifo Permission denied"
  - "CPAN URL (cpan.metacpan.org) 在部分 CI Worker 不可达, 改用 GitHub 归档 URL (github.com 可达)"
  - "GitHub 归档目录结构不同于 CPAN tarball: Perl/Decoder/ 子目录包含构建文件, Perl/shared/ 包含共享头文件和构建工具"
  - "conanfile.py build() 中复制 Perl/shared/ 到 Perl/Decoder/ 模拟 Makefile.PL 的 link_files() (OHOS 不用 symlink)"
