package: php85-enchant/8.5.8
homepage: "https://www.php.net/manual/en/book.enchant.php"
upstream_check_command: "php -n run-tests.php -n -d extension=modules/enchant.so tests"
upstream_test_in_build: true
upstream_test_command: "php -n run-tests.php -n -d extension=modules/enchant.so --show-diff tests"
upstream_tests:
  - file: tests/*.phpt
    source: php-8.5.8/ext/enchant/tests/*.phpt
    description: "All 33 original Enchant PHPT cases; prerequisite SKIPIF behavior preserved"
    command: "php -n run-tests.php -n -d extension=modules/enchant.so --show-diff tests"
test_package_tests:
  - file: test.sh
    description: "12 OHOS consumer assertions: module, broker, empty tag, personal dictionary, session add/remove"
    command: "php -n -d extension=<packaged-enchant.so> test_enchant.php"
assertion_count: 12
