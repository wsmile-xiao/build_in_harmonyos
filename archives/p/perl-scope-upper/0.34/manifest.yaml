software: perl-scope-upper
# 版本级 manifest — perl-scope-upper 0.34
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.34"

# 编译状态: published (conan-verify 全部门禁通过)
status: published

build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/V/VP/VPIT/Scope-Upper-0.34.tar.gz"
  sha256: "581d8bc510debd0c456a5fc7952cb7138ae667bf38f3a77e96d773dc3196a41e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统: Perl XS (ExtUtils::MakeMaker + xsubpp + clang)
  system: perl-xs
  build_system: perl-xs

  # 配置选项
  configure_options:
    - "INSTALLDIRS=site"

  # 编译依赖
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "XS模块编译链路: perl Makefile.PL → xsubpp → clang -c → clang -shared → .so"
  - "ELF签名: .so需llvm-objcopy移除旧.codesign + binary-sign-tool -selfSign 1重新签名 (P-SIGN-001, 参考perl-sereal-encoder经验)"
  - "SELinux路径限制: hmdfs上下文的.so无法dlopen, hnp_file上下文(系统perl路径)可正常加载"
  - "Scope::Upper在BEGIN块调用XSLoader::load(), perl -c会触发dlopen失败, test_package改用文件验证"
  - "conanfile.py: make install DESTDIR直接安装到package_folder, .so签名后复制到lib/满足G4检查"
  - "package_info()使用self.package_folder绝对路径设置PERL5LIB"
