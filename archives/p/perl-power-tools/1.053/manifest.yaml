software: perl-power-tools
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.053/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.053"

# 构建系统类型（顶层字段，G4 检查需要）
build_system: perl-eumm

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"
compile_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/B/BR/BRIANDFOY/PerlPowerTools-1.053.tar.gz"

  # 源码校验和
  sha256: "38bb7598a92b1ecb364478f5945a7926046846b9a34a8032e3dcb8de0662c76a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl-eumm
  system: perl-eumm

  # 配置选项列表
  configure_options:
    - "INSTALL_BASE=$DEFAULT_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 运行时无外部依赖（纯 Perl）
  # 测试依赖（非运行时，已安装用于完整测试）:
  # - perl-test-warnings/0.038 (test-only)
  # - perl-test-pod/1.52 (test-only)
  # - perl-ipc-run3/0.049 (test-only)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Makefile.PL 使用 INSTALL_BASE 而非 PREFIX (ExtUtils::MakeMaker)"
  - "测试依赖 Test::Warnings 0.038, Test::Pod 1.52, IPC::Run3 0.049 缺失导致部分测试跳过 (非运行时依赖)，安装后测试通过率从 14/27 提升至 26/27"
  - "uudecode 测试因平台 umask 差异失败 (660 vs 664/444, OpenHarmony SELinux 限制, E046)"
  - "CPAN 下载 URL 需要正确的作者 ID 路径 (Test::Warnings 作者为 ETHER 非 DAGOLDEN, IPC::Run3 作者为 RJBS 非 RSCHUPP)"
  - "perl-power-tools 安装后 ~/usr/local/bin/ 下的 tar/grep/sort 等会覆盖系统命令，测试时需设置 PATH=/system/bin 避免冲突"
  - "make test 在某些交互式测试上会卡住 (如 cp/cut)，需逐个运行并设置 timeout"
  - "纯 Perl 模块，无 C 编译器参与，无需处理 CRT/ELF 签名/musl BIND_NOW 等 XS 问题 (ref: perl-dbd-pg 编译经验)"
  - "与 perl-dbd-pg (XS 模块) 不同，纯 Perl 模块仅需 PERL5LIB 环境变量提供依赖路径"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
