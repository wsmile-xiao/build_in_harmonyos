software: perl-power-tools
display: "Perl Power Tools"
description: "Pure Perl implementation of 100+ BSD utilities (cat, echo, grep, sort, wc, seq, factor, etc.)"
category: perl
homepage: "https://metacpan.org/dist/PerlPowerTools"
license: GPL-1.0-or-later OR Artistic-1.0
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "纯 Perl 模块集合，无需 C 编译，无需 CRT 补丁、ELF 签名或 musl BIND_NOW 修复"
    - "Makefile.PL 使用 INSTALL_BASE 而非 PREFIX（ExtUtils::MakeMaker 约定）"
    - "安装后 ~/usr/local/bin/ 下 100+ 工具会覆盖系统同名命令，需注意 PATH 顺序"
    - "uudecode 文件权限受 SELinux 限制（E046），解码功能正常"
    - "测试依赖 Test::Warnings/Test::Pod/IPC::Run3 为非运行时依赖"

versions:
  "1.053":
    status: published
    build_date: "2026-06-25"
