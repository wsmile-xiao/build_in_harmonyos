software: perl-digest-sha1
display: "Digest::SHA1"
description: "Perl interface to the SHA-1 algorithm"
category: crypto
homepage: "https://metacpan.org/pod/Digest::SHA1"
license: "Artistic-1.0-Perl OR GPL-1.0-or-later"
build_system: autotools

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Perl XS 模块需要 -nostartfiles -nodefaultlibs 链接参数"
    - "必须添加 -I~/usr/local/include 指定 musl 头文件路径"
    - "SELinux HMDFS 限制，XS 模块无法在用户目录加载"
  common_dependencies:
    - perl/5.42.0
    - musl/1.2.5

# 版本索引
versions:
  "2.13":
    status: built
    build_date: "2026-06-10"