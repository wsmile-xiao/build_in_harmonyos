software: perl-net-dns
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.53-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.53-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/N/NL/NLNETLABS/Net-DNS-1.53.tar.gz"

  # 源码校验和
  sha256: "04acb4f177d57c147dcedc4bd70e23806af3db75a532f46f95461b2bc9a94959"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块的 conanfile.py 不需要 compiler 和 build_type 设置，只需 settings = os, arch 即可避免 settings.os.cpu 错误"
  - "Net::DNS 包含大量 .pm 文件（DNS.pm + DNS/ 子目录 + DNS/RR/ 子目录），package() 方法需要递归复制整个 Net/ 树而非单个文件"
  - "Net::DNS 是纯 Perl 实现，不受 SELinux/HMDFS 限制，可直接安装使用"
