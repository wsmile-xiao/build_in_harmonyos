software: perl-encode-hanextra
display: "Encode::HanExtra"
description: "Perl Encode 模块扩展，提供额外的中文编码支持（Big5变体、CNS标准、CCCII等）"
category: data                     # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://metacpan.org/pod/Encode::HanExtra"
license: MIT
build_system: makefile             # Perl XS 模块使用 Makefile.PL

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Perl XS 模块需要用 -I . 添加当前目录到 @INC"
    - "CCFLAGS 需要包含 Perl CORE 头文件路径"
    - "LDDLFLAGS 使用 -shared -nostdlib 参数"
    - "SELinux 限制：用户路径 .so 无法加载，需安装到系统 Perl 目录"
  common_dependencies:
    - perl/5.42.0
    - Encode (核心模块)
    - enc2xs

# 平台限制说明
platform_limitations:
  - feature: "SELinux 共享库标签"
    impact: "用户路径(hmdfs:s0)的.so无法被Perl DynaLoader加载"
    workaround: "安装到系统Perl目录: /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/"

# 版本索引（所有已归档版本，含状态）
versions:
  "0.23":
    status: built
    build_date: "2026-06-10"
    notes: "编译成功，结构验证通过，SELinux限制导致用户路径运行时测试受阻"