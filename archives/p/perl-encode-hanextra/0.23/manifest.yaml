software: perl-encode-hanextra
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.23/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-encode-hanextra

# 版本号
version: "0.23"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶级字段，用于 verify-build）
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/A/AU/AUDREYT/Encode-HanExtra-0.23.tar.gz"

  # 源码校验和
  sha256: "1fd4b06cada70858003af153f94c863b3b95f2e3d03ba18d0451a81d51db443a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "perl -I . Makefile.PL PREFIX=$DEFAULT_PREFIX"
    - "CCFLAGS=-D_GNU_SOURCE -fno-strict-aliasing -pipe -fstack-protector-strong -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 -I$DEFAULT_PREFIX/include"
    - "LDDLFLAGS=-shared -nostdlib -B$DEFAULT_PREFIX/lib -L$DEFAULT_PREFIX/lib -lc"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "Encode/3.21"
    - "enc2xs/2.25"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块需要用 -I . 添加当前目录到 @INC，让 inc::Module::Install 可找到"
  - "Perl XS 模块的 CCFLAGS 需要包含 Perl CORE 头文件路径"
  - "LDDLFLAGS 需要使用 -shared -nostdlib 参数"
  - "SELinux 限制: 用户路径(hmdfs:s0)的.so无法加载，需要安装到系统Perl目录(hnp_file:s0)"
