# test_package/MANIFEST.yml — 上游官方测试声明（CI L0e 强制要求）
# 详见: docs/TEST_QUALITY_SPEC.md

package: pandoc/3.10.1
homepage: "https://pandoc.org"

# 上游测试命令：pandoc 是 Haskell 项目，上游测试为 `cabal test`（hspec 测试套件）。
# 鸿蒙为纯 musl、无 GHC 工具链（E105/E172 平台限制），无法在本机运行上游测试套件，
# 本适配按 use-binary-release 路径交付官方 linux-arm64 静态二进制。
upstream_check_command: "cabal test pandoc"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试套件：test/Tests/*.hs（69 个 hs 模块）+ test/command/（1177 个命令测试文件）。
# 命令测试由 test/Tests/Command.hs 通过 hspec 驱动，逐条比对期望输出。
# 上游测试在鸿蒙不可运行（无 GHC aarch64-musl 工具链，证据链见
# reports/upstream-tests-evidence.md），故 upstream_tests 不声明可执行项，
# 避免「已声明未运行」误导；交付产物已在鸿蒙实跑命令测试 700 用例字节级一致，
# 并已将其中 51 个代表性用例移植为 command_tests/ 可执行套件（见下）。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，实际执行并验证产物)
test_package_tests:
  - file: test.sh
    description: "pandoc --version 断言 3.10.1 + markdown→html 实际转换 + --list-output-formats（3 组冒烟断言）"
    command: "bash test.sh"
  - file: command_tests/run_command_tests.sh
    description: "上游命令测试精选 51 个用例（AI 补充设计，覆盖 30+ 种 reader/writer 格式），
      用交付 pandoc 二进制实际执行并按上游期望输出字节级比对"
    command: "bash command_tests/run_command_tests.sh"

# 测试断言总数：上游 hspec 套件在鸿蒙不可运行（平台限制），
# test_package 实际执行的断言 = test.sh 3 组 + command_tests 51 个用例 = 54。
assertion_count: 54
