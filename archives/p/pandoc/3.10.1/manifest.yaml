# 版本级 manifest — pandoc 3.10.1
version: "3.10.1"
software: pandoc
status: built
build_date: "2026-08-15"
build_system: custom

source:
  # 上游源码（Haskell 项目，本适配按 use-binary-release 交付官方静态二进制，不编译源码）
  url: "https://github.com/jgm/pandoc/archive/refs/tags/3.10.1.tar.gz"
  sha256: "faee98f42ed1592b2feb8da7fdfa87a23b679ca27ff883e06030f89c25c91ba9"
  tar_format: tar.gz

# 实际打包来源：官方 linux-arm64 静态 musl 二进制 release
binary:
  url: "https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-linux-arm64.tar.gz"
  sha256: "cd3963da375793a4804c65ae538b4f7b9c23f87cac7f6c74a1cf5e2fff7e8d59"
  tar_format: tar.gz

build:
  system: custom
  build_system: binary-release
  configure_options: []
  dependencies: []
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "pandoc 是 Haskell 项目（cabal/ghc 构建）。鸿蒙 PC 为纯 musl（无 /lib/ld-linux-aarch64.so.1），GHC 官方 bindist 均为 glibc 动态链接（aarch64-deb10/11/12-linux），无法运行；ghcup 也无 aarch64-musl GHC → 从源码编译不可行（E105/E172 平台限制）"
  - "回退路径 use-binary-release：pandoc 官方发布 linux-arm64 静态 musl 二进制（无解释器、纯静态），在鸿蒙上可直接运行，仅需 ELF 签名（binary-sign-tool selfSign）"
  - "ELF 签名是鸿蒙执行必需：未签名二进制执行报 Permission denied（与 E105 同类工具链先例一致）"
  - "conan copy() 默认 keep_path=True：目标目录应传 package_folder 根，否则产生 bin/bin 双层嵌套，导致 VirtualRunEnv PATH 找不到可执行文件"
  - "conan-verify G2 会对 GitHub URL 临时注入 ghfast.top 镜像（E017 预防）；该镜像不可达时会挂起，conandata.yml 显式声明官方 URL + ghfast.top fallback 列表可避免"
