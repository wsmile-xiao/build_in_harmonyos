# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-package-deprecationmanager/0.18-r1
homepage: "https://metacpan.org/dist/Package-DeprecationManager"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/basic.t
    source: Package-DeprecationManager-0.18/t/basic.t
    description: "Basic deprecation warning tests"
    command: "perl -Iblib/lib t/basic.t"
  - file: t/export.t
    source: Package-DeprecationManager-0.18/t/export.t
    description: "Export-related deprecation tests"
    command: "perl -Iblib/lib t/export.t"
  - file: t/00-report-prereqs.t
    source: Package-DeprecationManager-0.18/t/00-report-prereqs.t
    description: "Prerequisites report test"
    command: "perl -Iblib/lib t/00-report-prereqs.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "L1 smoke test: load Package::DeprecationManager and use import()"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 30
