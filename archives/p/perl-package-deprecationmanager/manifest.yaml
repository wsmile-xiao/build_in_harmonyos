# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-package-deprecationmanager

# 软件描述
description: "Manage deprecation warnings for your Perl distribution (Package::DeprecationManager CPAN module)"

# 分类
category: perl-module

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "0.18-r1"
    status: built
    build_date: "2026-07-02"
    path: archives/p/perl-package-deprecationmanager/0.18-r1

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/dist/Package-DeprecationManager

# 源码仓库
repository: https://github.com/moose/Package-DeprecationManager

# 许可证
license: Artistic-2.0

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl
  - perl-package-stash (Conan: 0.40-r1@ohpcd/stable)
  - Module::Implementation (系统 Perl)
  - Params::Util (系统 Perl)
  - Sub::Install (系统 Perl)

# 编译依赖
build_dependencies:
  - perl (Makefile.PL / ExtUtils::MakeMaker)
