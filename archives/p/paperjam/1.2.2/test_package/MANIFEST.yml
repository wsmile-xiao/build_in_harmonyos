# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: paperjam/1.2.2
homepage: https://mj.ucw.cz/sw/paperjam/

# 上游测试套件存在性 (经审计源码 tar 包确认)
upstream_tests_exist: false

# 上游测试审计 (源码: paperjam-1.2.2.tar.gz, sha256 a281912d00a935f490ce20873e87b82d5203bb6180326be1bec60184acab30fc)
upstream_test_audit:
  source_tarball: "paperjam-1.2.2.tar.gz"
  source_sha256: "a281912d00a935f490ce20873e87b82d5203bb6180326be1bec60184acab30fc"
  top_level_files:
    - Makefile          # 仅 all/paperjam/paperjam.1/paperjam.1.html/clean/install/release, 无 check/test 目标; .PHONY 仅 all/clean/release
    - paperjam.cc       # 纯实现源, 无 TEST()/TEST_F (gtest) / def test_ (pytest)
    - cmds.cc           # 纯实现源, 无测试宏
    - parse.cc          # 纯实现源, 无测试宏
    - pdf.cc            # 纯实现源, 无测试宏
    - pdf-tools.cc      # 纯实现源, 无测试宏
    - jam.h             # 纯头文件
    - pdf-tools.h       # 纯头文件
    - paperjam.1.txt    # 手册页源码 (需 a2x, 非测试)
    - README.md         # 文档, 无测试说明
    - NEWS              # 发布注记, 无测试说明
    - TODO              # 待办, 无测试说明
    - LICENSE           # 许可证
    - debian/           # 仅 control/copyright/rules/mk (dh 构建), 无 tests/autopkgtest
  scanned_for:
    - "TEST( / TEST_F (gtest)"
    - "def test_ (pytest)"
    - "Makefile check/test/check_PROGRAMS/TESTS 目标"
    - "tests/ / test/ / spec/ / t/ 目录"
    - "ctest / meson test 目标"
    - "find . -name '*test*' (全树)"
    - "debian/tests / autopkgtest"
  scan_result: "0 matches — 全树无 tests/ 目录; find -name '*test*' 零命中; Makefile 无 check/test 目标; 无 gtest/pytest/ctest 注册; debian/ 无 tests/autopkgtest"
  make_check_output: "make -n check 无规则 (No rule to make target 'check') — Makefile 无 check 目标, .PHONY 仅 all/clean/release, make check 执行 0 用例"
  reason: "paperjam 1.2.2 为纯手写 Makefile 工具, 官方源码包不含任何测试套件: 无 tests/ 目录、无测试源文件、无 check/test 目标、无 configure; make check 无规则。功能验证由 test_package 真实执行 paperjam 二进制完成"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 无测试套件, 故 check 命令不适用 (保持空串: 非空会被清单器判为上游存在测试命令)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (upstream_tests_exist: false, 见上方审计)
# 上游无测试, 真机预检输出 HMBS_UPSTREAM_TEST_RESULT status:"no_tests" discovered:0 executed:0
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "--version/--help/未知纸张拒绝/null 往返/a4 命名纸张路径"
    command: "bash test.sh"
  - file: test.sh
    description: "未知纸张名触发 vendored shim 错误路径 No paper（非桩）"
    command: "bash test.sh (case 3)"
  - file: test.sh
    description: "paper(paper=a4) 命中 shim 内置 ISO 纸张表（非空 %PDF 输出）"
    command: "bash test.sh (case 5)"

# 测试断言总数 (test.sh 内 6 个 report 检查)
assertion_count: 6
