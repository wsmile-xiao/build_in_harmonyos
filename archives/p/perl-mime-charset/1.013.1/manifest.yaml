software: perl-mime-charset
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.013.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.013.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# ============================================================
# 源码信息
# ============================================================

build_system: perl

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/N/NE/NEZUMI/MIME-Charset-1.013.1.tar.gz"

  # 源码校验和
  sha256: "1bb7a6e0c0d251f23d6e60bf84c9adefc5b74eec58475bfee4d39107e60870f0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - perl-encode/3.21

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块使用perl Makefile.PL构建，无原生二进制，无需configure/make传统流程"
  - "CPAN模块从cpan.metacpan.org下载，作者目录格式为id/N/NE/作者名"
  - "Python urllib SSL验证可能失败，需要用curl下载后通过file:// URL加载"
  - "G4门禁检查manifest中build_system顶层字段，需与build.system并存"
  - "纯Perl模块G0 clean-verify因无./configure而跳过(127)，需手动验证作为替代"
  - "MIME::Charset依赖Encode核心模块(>=1.98)，OpenHarmony Perl 5.42.0已内置Encode 3.21"
