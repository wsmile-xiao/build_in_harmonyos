# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在鸿蒙平台上可直接编译安装，无需 C 编译器"
  - "Perl 模块通过 perl Makefile.PL && make && make test && make install 流程编译"
  - "纯 Perl 模块不受 SELinux HMDFS 限制，可直接在 ~/usr/local/lib 上加载（与 XS 模块不同）"
