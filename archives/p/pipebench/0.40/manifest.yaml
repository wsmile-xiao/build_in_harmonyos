knowledge_gained:
  - "pipebench 0.40 上游 Makefile 硬编码 CC=gcc，install 目标写死 /usr/local —— conan 用 make CC=<clang> 覆盖编译器、自行打包 bin 与 man，不调 make install"
  - "单文件 C 工具（pipebench.c），无 configure/autotools，无编译/运行依赖"
  - "源码使用 legacy BSD 类型 u_int64_t 等（仅 #ifdef sun 定义）；musl/OHOS 由 sys/types.h 不提供 -> 补 stdint.h，定义块改 #if defined(sun)||!defined(__GLIBC__) 映射 uint*_t"
  - "源码缺 <stdlib.h>/<string.h>（malloc/strlen/strcpy 隐式声明），补齐（Debian gcc-14 FTBFS 报道同类）"
  - "上游无任何测试目标/目录（Makefile 仅 all/doc/install/clean）；如实记录 upstream_test=0，冒烟放 test_package（-h 用法、-q 直通字节一致 + Summary 输出）"
