# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pipebench/0.40
homepage: "https://www.habets.pp.se/synscan/programs.html#pipebench"

# 上游测试命令 — 经源码核查：0.40 发布包 Makefile 仅 all/doc/install/clean 四个目标，
# 无 check/test 目标，源码 6 文件（LICENSE/Makefile/README/pipebench.1/pipebench.c/pipebench.yodl）无 tests/ 目录。
upstream_check_command: "none (upstream Makefile has no check/test target)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pipebench.sh
    description: "打包产物冒烟：pipebench -h 用法退出码、-q 模式 ~6.2KB stdin→stdout 直通字节一致（cmp）、stderr 出现 Summary 速率行（B/second）"
    command: "bash test_pipebench.sh <pkg_bin>"

# 测试断言总数 (近似值, 用于质量评估)
# -h 退出码、输入非空、-q 运行、cmp 字节一致、Summary 出现 = 5 个检查点
assertion_count: 5
