# pipebench/0.4 test_package
# Verifies the pipebench binary is installed and passes data through correctly

package: pipebench/0.4
homepage: "https://github.com/ThomasHabets/pipebench"

# 上游测试审计：pipebench 0.40（ThomasHabets/pipebench，单文件 C 程序）不存在测试套件
# — Makefile 仅有 all/doc/install/uninstall/distclean/clean 目标，无 check/test 目标
#   （https://raw.githubusercontent.com/ThomasHabets/pipebench/master/Makefile 全文件核对）；
# — 源码树仅 pipebench.c/pipebench.yodl/pipebench.1/README/LICENSE，无 tests/ 目录、
#   无 ctest/gtest/pytest 注册；
# — 作者主页 tarball（pipebench-0.40.tar.gz，11542 字节）解包同样无任何测试文件。
# 结论：上游无测试，按 no_tests 处理（HMBS_UPSTREAM_TEST_RESULT status=no_tests，
# 由主配方 build() 输出、test_package test() 每轮复发以应对包缓存命中场景）。
upstream_tests_exist: false
upstream_test_audit: "审计 pipebench 0.40 上游（Makefile/pipebench.c/tarball 解包）：1) Makefile 仅 all/doc/install/uninstall/distclean/clean 目标，无 check/test 目标；2) 源码树仅 pipebench.c/pipebench.yodl/pipebench.1/README/LICENSE，无 tests/ 目录、无 ctest/gtest/pytest 注册；3) 官方 tarball 解包（11542 字节，sha256 ca764003446222ad9dbd33bbc7d94cdb96fa72608705299b6cc8734cd3562211）同样无测试文件。上游确实无测试套件。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

test_package_tests:
  - file: test_pipebench.sh
    description: "消费者功能测试：-h 横幅校验、-q/-Q 管道直通 cmp 一致性（R34：真实执行被测二进制并校验退出码与数据）"
    command: "bash test_pipebench.sh <pipebench_bin>  # test_package/conanfile.py test() 经 self.run() 真实执行，3 个用例逐字节比对"
  - file: test_pipebench.c
    description: "消费者冒烟测试：经 system() 执行 pipebench -h 并校验退出码（L0c 门禁测试源文件，CMake 构建）"
    command: "test_pipebench <pipebench_bin>  # system('<bin> -h') 退出码 0 即通过"

assertion_count: 4
