software: pipebench
display: "pipebench"
description: "Measure the speed of stdin/stdout communication through a pipe"
category: utility
homepage: "https://github.com/ThomasHabets/pipebench"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C 程序 + 裸 Makefile（无 configure），配方直接 make CC=<conan 编译器> 构建"
    - "不调用上游 make install（依赖 GNU install -D），package() 手动 copy 二进制与 man 页"
    - "上游无测试套件，按 no_tests 审计处理"
  common_dependencies: []

versions:
  "0.4":
    status: built
    conan_ref: "pipebench/0.4"
