software: pipebench
display: "pipebench"
description: "Pipe through-put benchmark tool（测 stdin/stdout 管道吞吐速率）"
category: utils
homepage: "https://www.habets.pp.se/synscan/programs.html#pipebench"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 硬编码 CC=gcc，且 install 目标固定写入 /usr/local —— conan 以 make CC=<clang> 覆盖编译、自行打包，不使用 make install"
    - "单文件 C 工具（pipebench.c），无 configure/autotools、无编译期依赖，产物仅一个 pipebench 可执行文件"
    - "源码使用 legacy BSD 类型 u_int64_t（#ifdef sun 才定义）：musl/OHOS 不提供，需补 #include <stdint.h> 并以 #define 映射到 uint64_t 等"
    - "缺少 #include <stdlib.h>/<string.h>（malloc/strlen/strcpy 隐式声明），需补齐（Debian gcc-14 FTBFS 同类问题）"
    - "上游无任何测试目标/测试目录（Makefile 无 check/test）；冒烟在 test_package 验证（-h 用法、-q 直通字节一致 + Summary 输出）"
  common_dependencies: []

versions:
  "0.40":
    status: pending
    build_date: ""
