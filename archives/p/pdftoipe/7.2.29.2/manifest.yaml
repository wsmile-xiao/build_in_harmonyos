# ── 测试结果 ────────────────────────────────────────────────────────────
test_result: PASS_WITH_UPSTREAM_NO_TESTS
test_passed: 11
test_failed: 0
test_note: >-
  上游 pdftoipe 组件无测试目标（Makefile 仅 all/clean；make -n check 与 make -n test
  均返回 "No rule to make target"，组件目录内无任何 test/check 文件），故上游用例数
  为 0，未修改任何上游测试。适配后新增 11 项消费者/平台断言全部通过：
  消费者用例 7/7（CLI 契约 3 项 + Ipe XML 骨架 1 项 + 图形保真 1 项 + 文字保真与
  -notext 1 项 + 包 bin/ 经 VirtualRunEnv 导出消费者 PATH 1 项）、
  鸿蒙特有测试 2/2（musl libc.so + libc++_shared.so 且无 glibc libc.so.6；
  ELF64 / little endian / AArch64）、
  PC 特有测试 2/2（鸿蒙 PC 必需 ELF 代码签名段 .codesign 存在；产物为 PIE 且带可执行权限）。

# ── 源码信息 ────────────────────────────────────────────────────────────
source:
  url: "https://github.com/otfried/ipe-tools/archive/refs/tags/v7.2.29.2.tar.gz"
  sha256: "c8de0dc7eb8fa959c96539fb19ebfb8e16f459e9b4ef9259aeb30b76072cd083"
  tar_format: tar.gz
  # pdftoipe 无独立仓库；源码位于 ipe-tools 单仓 pdftoipe/ 子目录，strip_root 后构建
  upstream_repo: "https://github.com/otfried/ipe-tools"
  subdirectory: pdftoipe

# ── 构建配置 ────────────────────────────────────────────────────────────
build:
  system: makefile
  configure_options:
    - "make -j1 CXX=<clang++> CPPFLAGS=-I<poppler>/include/poppler CXXFLAGS='-O2 -fPIC -std=c++20 -Wno-write-strings' LDFLAGS='' LIBS='-L<poppler>/lib -L<freetype>/lib -lpoppler'"
  dependencies:
    - poppler/25.12.0
  cc: clang
  cxx: clang++

# ── 补丁信息 ────────────────────────────────────────────────────────────
# 源码零补丁：上游 Makefile 已提供 CXX / POPPLER_CFLAGS / POPPLER_LIBS 覆盖变量，
# 交叉编译所需的一切都能在 make 命令行注入。
patches_applied: []
patch_classification: []

# ── 知识沉淀 ────────────────────────────────────────────────────────────
knowledge_gained:
  - "pdftoipe 消费 poppler 的 C++ 私有头（Object.h / OutputDev.h / GfxState.h / goo/GooString.h），位于 <poppler 包>/include/poppler，与 poppler.pc 的 Cflags 一致；用 poppler-cpp 公共头无法编译。"
  - "Makefile 型上游若用 '?=' 或 '+= ' 提供编译钩子：命令行变量会整条覆盖 makefile 内的 '+='，故命令行注入 CPPFLAGS/LIBS 时不能再依赖 POPPLER_CFLAGS/POPPLER_LIBS 生效，须二者取其一并显式补齐被覆盖的 CXXFLAGS 内容（-std=c++20）。"
  - "conan 的 tools.build:compiler_executables 是 dict，只能 self.conf.get(\"tools.build:compiler_executables\", default={}) 后取 ['cpp']；写成 \"...:cpp\" 会抛 ConanException。"
  - "OHOS 上 /tmp 只读；test_package 现场生成的中间文件必须落在 ${TMPDIR:-$HOME} 下（本机 TMPDIR 默认为 $HOME/tmp）。"
  - "OHOS SDK 的 clang 链接可执行文件时会自动写入 .codesign 段，源码直连链接不会被破坏；该段缺失时产物在鸿蒙 PC 上加载会 Permission denied。"
