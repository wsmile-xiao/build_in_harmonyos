# 只写官方原始 URL：CI 的 build_and_test.sh 会在构建期自行追加 gh-proxy 等镜像 fallback，
# 提交版不要手工写镜像前缀。
sources:
  url: "https://github.com/otfried/ipe-tools/archive/refs/tags/v7.2.29.2.tar.gz"
  sha256: "c8de0dc7eb8fa959c96539fb19ebfb8e16f459e9b4ef9259aeb30b76072cd083"
  strip_root: true

# 源码零补丁：上游 Makefile 已提供 POPPLER_CFLAGS / POPPLER_LIBS 与 CXX 覆盖变量，
# 交叉编译所需的 clang++ 与 poppler/freetype 绝对路径由配方在 make 命令行注入。
patches: {}
