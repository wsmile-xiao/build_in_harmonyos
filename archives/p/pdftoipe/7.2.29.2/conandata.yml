# conandata.yml — pdftoipe 7.2.29.2 (ipe-tools)
#
# 官方 GitHub 标签归档 v7.2.29.2（tarball 已本地下载并计算 sha256）
# 注意：pdftoipe 无独立仓库，源码位于 ipe-tools 单仓的 pdftoipe/ 子目录，
#       故 tarball 整包下载后用 strip_root 去掉顶层目录，构建只在 pdftoipe/ 内进行。
