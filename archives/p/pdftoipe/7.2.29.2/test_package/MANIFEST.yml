# test_package/MANIFEST.yml
# 上游官方测试声明（CI L0e 强制要求；详见 docs/TEST_QUALITY_SPEC.md）
#
# 上游测试实况（已实测）：
#   pdftoipe 组件自身没有测试目标 —— ipe-tools 单仓中 pdftoipe/Makefile 只有
#   all / clean 两个目标，无 check / test target，也无 pdftoipe 的测试目录。
#   全仓 grep 到的 tests/ 与 run_test.py 均属其它组件（matplotlib backend、
#   ipepython），与 pdftoipe 无关，且它们的执行需要 matplotlib + Ipe 自身的
#   Python 模块（非本包依赖）。因此上游可执行用例数为 0，未做任何上游测试修改。
package: pdftoipe/7.2.29.2
homepage: "https://github.com/otfried/ipe-tools"

# 上游无可用测试入口
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: conanfile.py
    description: "消费者测试入口：requirements() 依赖被测包，test() 在 conanrun 环境下执行 test.sh。不经 can_run() 门控——本环境 tools.build.cross_building:can_run=False 会让 can_run() 恒为 False 而静默跳过测试。"
    command: "conan test"
  - file: test.sh
    description: "消费者视角端到端验证（现场合成单页 PDF：红色斜线描边 + 绿色矩形填充 + 24pt 文字）：A 组 7 项断言 CLI 契约（-h 输出与退出码、无参数失败、默认输出名、XML 骨架、图形颜色/线宽/坐标保真、文字字号/变换矩阵保真、-notext 丢弃文字、包 bin/ 经 VirtualRunEnv 导出到消费者 PATH）；B 组 2 项鸿蒙事实断言（musl libc.so + libc++_shared.so 且无 glibc libc.so.6；ELF64/AArch64/小端）；C 组 2 项鸿蒙 PC 断言（ELF 代码签名 .codesign 段存在；产物为 PIE 且带可执行权限）。"
    command: "bash test.sh <package_folder>/bin/pdftoipe"

# 断言总数：消费者用例 7 + 鸿蒙特有 2 + PC 特有 2
assertion_count: 11
