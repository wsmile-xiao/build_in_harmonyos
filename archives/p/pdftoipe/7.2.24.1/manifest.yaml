software: pdftoipe
version: 7.2.24.1
category: graphics
status: built

build_system: makefile
compiler: clang
linker: GNU ld

dependencies:
  poppler: 25.11.0
  xpdf: system

configure_options:
  - "手动 Makefile 方式编译"
  - "CFLAGS 包含 poppler 头文件路径"
  - "LDFLAGS 包含 poppler 库路径"

build_notes:
  - pdftoipe 使用简单的 Makefile 构建系统
  - 依赖 poppler 库进行 PDF 解析
  - 需要 1 个补丁修复平台兼容性问题

artifacts:
  - pdftoipe binary

source_url: https://github.com/potentialgradient/pdftoipe/archive/refs/heads/master.tar.gz