software: perl-proc-processtable
display: "Proc::ProcessTable"
description: "Perl XS 模块，通过 /proc 读取进程表信息（PID、CPU、内存、命令等）"
category: system
homepage: "https://metacpan.org/dist/Proc-ProcessTable"
license: Artistic-2.0
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "musl libc 不提供 obstack.h，需从源码 os/ 目录复制 bundled obstack.c/obstack.h 到根目录"
    - "Makefile.PL 需 patch：移除 -lobstack 链接，改用 bundled obstack.c；修正 LDFROM；添加 -Ios include 路径"
    - "Perl XS 模块打包使用 DESTDIR staging 方式：make install DESTDIR=<tmpdir> 后遍历提取 lib/ 路径"
    - "SELinux E046：hmdfs context 的 .so 无法被 dlopen，部署时需安装到系统 Perl 目录（hnp_file context）"
    - "Conan profile 必须使用 arch=armv8 而非 os.cpu.arch=armv8"
  common_dependencies:
    - perl

versions:
  "0.637":
    status: published
    build_date: "2026-06-26"
    conan_ref: "perl-proc-processtable/0.637"
    source_url: "https://cpan.metacpan.org/authors/id/J/JW/JWB/Proc-ProcessTable-0.637.tar.gz"
