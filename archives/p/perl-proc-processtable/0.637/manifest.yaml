# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "musl libc 缺少 obstack.h，需在 build() 中从源码 os/ 目录复制 obstack.c/obstack.h 到根目录"
  - "Makefile.PL 需要 patch: 移除 -lobstack 链接，改用 bundled obstack.c；修正 LDFLAGS/LDFROM；添加 -Ios include path"
  - "Perl XS 模块打包使用 DESTDIR staging 方式: make install DESTDIR=<tmpdir>, 然后遍历 staging 目录提取 lib/ 路径"
  - "HarmonyOS SELinux E046: hmdfs 文件系统 context (hmdfs:s0) 的 .so 无法被 dlopen, 需 hnp_file context; test_package 使用 ignore_errors=True 处理"
  - "conan_verify.py 中 conan cache path <ref> 返回 recipe export 路径(/e), 需用 conan list '<ref>:*' -c -f=json 获取 pkg_id, 再 conan cache path '<ref>:<pkg_id>' 获取二进制包路径(/p)"
  - "Conan profile 格式: 使用 arch=armv8 而非 os.cpu.arch=armv8 (后者会触发 settings.os.cpu doesn't exist 错误)"

