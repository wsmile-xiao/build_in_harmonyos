# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 上游测试三步法 + 积分赛测试用例对比口径）
# 详见: docs/TEST_QUALITY_SPEC.md

package: pioneers/15.6
homepage: "https://pio.sourceforge.net/"

# ── 上游测试清点（R51 / 积分赛口径）───────────────
# pioneers 15.6 发布包不含任何自动化测试（上游 N = 0）：
#   - 全树 Makefile.am（24 个）逐一核查无 TESTS / check_PROGRAMS / XFAIL
#     声明（find 全部 24 个 Makefile.am，grep -cE 'TESTS|check_PROGRAMS'
#     均为 0 命中；顶层 Makefile.am 仅 noinst_PROGRAMS = 空占位）
#   - 源码树无 tests/ 目录、无 *test*.c 单元测试源文件
#     （find -iname '*test*' 仅匹配到 common/gtk/pioneers-checkmark.svg
#      图标资源；含 assert 的 .c 均为运行时前置断言而非测试程序）
#   - 无 ctest/pytest/其他框架注册（C/autotools 项目）
# 故上游测试统计：单元测试 0 / 集成测试 0 / 其他测试 0，合计 N = 0。

# 上游测试命令 (用于 make -n check 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
# 上游注册测试为 0；make check 会递归进 po/ 并因缺少 intltool/msgmerge
# 中止（OHOS 无 NLS 工具链，--disable-nls 后仍生成 po/Makefile 的 check
# 目标），实际无任何测试程序可执行 —— 见 notes.md 验证结果节。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无 —— 清点证据见上）
upstream_tests: []

# ── 适配后测试（积分赛补全口径）────────────────────
# 上游无测试用例 → 适配后由本包补全 8 条实断言（随 conan create 执行）：
#   契约冒烟 6 条 —— 全部 6 个打包二进制真实执行
#     · 3 个无头程序（server-console/metaserver/pioneersai）--version
#       exit 0 且横幅含 "15.6"
#     · 3 个 GTK3 程序（pioneers/editor/server-gtk）GOption --help 于
#       gtk_init 前 exit 0（OHOS 无显示环境可测的 CLI 契约）
#   集成测试 2 条（鸿蒙特有补全，上游 .game fixture 驱动真实代码路径）
#     · pioneers-server-console 加载上游 small.game 进入 "Preparing game"
#       状态（游戏初始化真实执行，非仅版本横幅）
#     · pioneers-metaserver 以端口范围启动并保持存活（游戏目录服务）
# fixture: fixtures/small.game（上游 server/small.game 原样，31 行）
test_package_tests:
  - file: test_pioneers.sh
    description: >
      契约冒烟 6/6：3 无头程序 --version 验证 "15.6" 横幅；3 GTK3 程序
      GOption --help 于 gtk_init 前 exit 0。集成测试 2/2：server-console
      加载上游 small.game 进入 Preparing game；metaserver 启动存活。
    command: "sh test_pioneers.sh <pkg>/bin <result> <fixtures_dir>"

# 测试断言总数（6 契约 + 2 集成 = 8）
assertion_count: 8
