knowledge_ref:
  - "pioneers: C/autotools GTK3 game application; released tarball carries a generated configure whose unconditional IT_PROG_INTLTOOL probes cannot run on OHOS (no perl/XML::Parser/intltool) -> --disable-nls + build-time text neutralisation of the 6 intltool/gettext/perl/xml-parser hard errors in configure (libgsf/avahi precedent)"
  - "glib/2.84.0.1 conan package installs a proxy libintl whose public libintl.h maps gettext()->g_libintl_gettext; any consumer of <glib/gi18n.h> must link <glib>/lib/libintl.so (avahi-ui-tools precedent; glib-2.0.pc does not carry it)"
  - "autoconf AS_TMPDIR `umask 077 && mktemp -d` creates 2700+setgid dirs HMFS refuses to write (E011/E112/E118); strip the umask in configure before config.status runs"
  - "config.guess (2018) cannot guess HarmonyOS; native OHOS/arm64 builds pass --build=aarch64-unknown-linux-gnu --host=aarch64-unknown-linux-gnu (avahi-ui-tools/libgsf precedent)"
