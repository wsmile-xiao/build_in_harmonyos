software: perl-io-prompt-tiny
display: "IO::Prompt::Tiny"
description: "Simple prompting module with default option, based on ExtUtils::MakeMaker"
category: perl                     # perl 模块分类
homepage: "https://metacpan.org/pod/IO::Prompt::Tiny"
license: Apache-2.0
build_system: perl                 # Perl 模块构建系统

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需源码修改"
    - "安装路径不在 Perl 默认 @INC 中，需设置 PERL5LIB"
    - "测试依赖 Capture::Tiny 未安装，测试失败但非阻塞"
  common_dependencies:
    - perl/5.42.0                  # 核心 Perl

# 版本索引（所有已归档版本，含状态）
versions:
  "0.003":
    status: published             # 已编译并发布
    build_date: "2026-06-12"
    published_as: perl-io-prompt-tiny