knowledge_gained:
  - "OHOS sysroot 无独立 libm.so（数学函数在 libc）：CMake find_library(m) 在 HarmonyOS 平台返回 NOTFOUND，必须空置后再交给 target_link_libraries，否则全部链接行变成 -lMATH_LIBRARY-NOTFOUND（zxcvbn-c 2.6 同款先例）"
  - "上游 install(TARGETS plfit LIBRARY ...) 只声明动态库 artifact kind；shared=False 静态构建时 .a 不会被安装，需显式追加 ARCHIVE DESTINATION"
  - "上游 CTest 9 项测试均为数据驱动且质量小（test/CMakeLists.txt 注册，DATADIR 指向源码树 data/），可直接在 conan create 内 ctest 全跑；测试显式使用 p_value_method=SKIP，无随机性"
  - "clang 15 (OHOS) 实测接受 -lm 链接（LM-OK），但 CMake find_library 找不到文件，故走空置 MATH_LIBRARY 路线"

