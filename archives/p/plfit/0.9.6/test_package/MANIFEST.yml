# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: "plfit/0.9.6"
homepage: "https://github.com/ntamas/plfit"

# 上游测试命令：test/CMakeLists.txt 通过 add_test 注册 9 项，ctest 直接执行
upstream_check_command: "ctest"

# 上游 CTest 套件在 conanfile.py build() 内经 cmake.test() 全量执行
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序（9 项，全部通过）
upstream_tests:
  - file: test/test_discrete.c
    source: plfit-0.9.6/test/test_discrete.c
    description: "离散幂律 MLE：log-likelihood / PRETEND_CONTINUOUS / LBFGS / LINEAR_SCAN / 默认方法（10 项断言）"
    command: "./test_discrete"
  - file: test/test_continuous.c
    source: plfit-0.9.6/test/test_continuous.c
    description: "连续幂律拟合（5 项断言）"
    command: "./test_continuous"
  - file: test/test_real.c
    source: plfit-0.9.6/test/test_real.c
    description: "真实数据集拟合（karate/celegans/condmat2005，20 项断言）"
    command: "./test_real"
  - file: test/test_sampling.c
    source: plfit-0.9.6/test/test_sampling.c
    description: "采样例程（zeta 等）回归（1 项断言）"
    command: "./test_sampling"
  - file: test/test_underflow_handling.c
    source: plfit-0.9.6/test/test_underflow_handling.c
    description: "下溢回归数据拟合（2 项断言）"
    command: "./test_underflow_handling"
  - file: test/test_xmin_too_low.c
    source: plfit-0.9.6/test/test_xmin_too_low.c
    description: "xmin 过低/离散值不足边界（3 个用例、6 项内部检查）"
    command: "./test_xmin_too_low"
  - file: test/test_hzeta.c
    source: plfit-0.9.6/test/test_hzeta.c
    description: "Hurwitz zeta 函数（1 项断言）"
    command: "./test_hzeta"
  - file: test/test_kolmogorov.c
    source: plfit-0.9.6/test/test_kolmogorov.c
    description: "Kolmogorov-Smirnov 统计量（10 项断言）"
    command: "./test_kolmogorov"
  - file: test/test_gss.c
    source: plfit-0.9.6/test/test_gss.c
    description: "黄金分割搜索（24 项断言）"
    command: "./test_gss"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者 API 测试：确定性 zeta/Pareto 采样 → plfit_discrete/continuous 拟合 → plfit_moments + 版本头（11 项检查）"
    command: "./plfit_consumer"
  - file: test.sh
    description: "CLI 冒烟：packaged plfit/plgen 生成 2000 样本并拟合，校验 D/C 输出与 alpha 区间（8 项检查）"
    command: "bash test.sh"

# 测试断言总数：上游 ASSERT_* 73 + test_xmin_too_low 内部检查 6
#                + 消费者 11 + CLI 冒烟 8 = 98
assertion_count: 98
