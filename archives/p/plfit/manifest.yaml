# 软件级 manifest — plfit
# 遵循 ARCHIVE-SPEC v2.0

software: plfit
display: "plfit"
description: "幂律分布拟合库与命令行工具（Clauset-Shalizi-Newman 方法）"
category: library
homepage: "https://github.com/ntamas/plfit"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS sysroot 无独立 libm.so（数学函数在 libc）：CMake find_library(m) 返回 NOTFOUND，需在 CMakeLists 中空置 MATH_LIBRARY（补丁 0001，zxcvbn-c 2.6 先例）"
    - "上游 install(TARGETS plfit LIBRARY ...) 只覆盖动态库；默认静态构建需显式 ARCHIVE DESTINATION 才会安装 libplfit.a（补丁 0002）"
    - "上游 CTest 9 项测试（数据驱动、p_value=SKIP 无随机性）在 conan create 中全量执行；test_package 提供 C 消费者 API 测试 + CLI 冒烟"
    - "并行 make 在 HMDFS 上触发 E074：conanfile.py 固定 -j1"
  common_dependencies: []

versions:
  "0.9.6":
    status: built
    build_date: "2026-09-17"
    conan_ref: "plfit/0.9.6"
