schema_version: 1
package: pugixml/1.16
homepage: 'https://pugixml.org/'
upstream_check_command: 'ctest --output-on-failure'
upstream_test_in_build: false
upstream_tests:
  - file: tests/main.cpp
    source: pugixml-1.16/tests/main.cpp
    description: 'Official pugixml CTest executable'
    command: './pugixml-check'
test_package_tests:
  - file: consumer.cpp
    description: 'Consumer parses XML and evaluates XPath'
    command: './pugixml_consumer'
assertion_count: 4
