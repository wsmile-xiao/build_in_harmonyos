software: postgresql-tsearch-czech
# 版本级 manifest 模板
# 文件位置: archives/p/postgresql-tsearch-czech/latest/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "latest"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-19"

# 构建系统类型（顶级字段，用于 verify_build）
# cmake | autotools | makefile | meson | custom
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/tvondra/ispell_czech/archive/refs/heads/master.zip"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: zip

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.38"
    - "postgresql/17.0"

  # 编译器（纯数据文件，不适用）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯数据文件项目，使用 Perl 生成词典文件"
  - "无需传统编译步骤，直接运行 make_config 脚本"
  - "生成的词典文件可直接安装到 PostgreSQL"