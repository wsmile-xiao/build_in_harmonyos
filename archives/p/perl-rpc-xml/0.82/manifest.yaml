software: perl-rpc-xml
# 版本级 manifest
# 文件位置: archives/p/perl-rpc-xml/0.82/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.82"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mirrors.tuna.tsinghua.edu.cn/CPAN/authors/id/R/RJ/RJRAY/RPC-XML-0.82.tar.gz"

  # 源码校验和
  sha256: "5279eb0d136c533ff897f6934c3aad6f20504b997fb2606e52c5dbbd92758e73"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  system: perl
  build_system: perl

  # CPAN 模块名
  cpan_module: "RPC::XML"

  # 配置选项列表
  configure_options:
    - "INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 运行时依赖（尚未编译为 conan 包）
  runtime_dependencies:
    - "XML::Parser >= 2.46"
    - "LWP (libwww-perl) >= 6.51"
    - "HTTP::Daemon >= 6.12"
    - "HTTP::Message >= 6.26"
    - "Module::Load >= 0.36"
    - "Scalar::Util >= 1.55"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块 (RPC::XML) 在鸿蒙平台无需特殊适配，使用标准 Makefile.PL 流程即可编译"
  - "Perl 5.42.0 (aarch64-linux) 系统预装版本可直接使用，路径 /data/service/hnp/bin/perl"
  - "RPC::XML 的完整功能（客户端、服务器、XML 解析）依赖 XML::Parser、LWP、HTTP::Daemon 等运行时模块，这些尚未编译为 conan 包"
  - "核心数据类型创建、序列化、smart_encode 功能无需任何运行时依赖，可直接使用"
  - "模块内部 $VERSION 为 1.61，CPAN 发行版本为 0.82，这是 Perl 模块的常见做法"
  - "t/11_base64_fh.t 中 2 个测试因鸿蒙平台临时目录清理行为差异而失败，不影响 base64 功能本身"
  - "conanfile.py package_info 中通过 runenv_info.append_path 设置 PERL5LIB，消费者自动获取 Perl 模块路径"
  - "参考 perl-dbd-pg / perl-role-tiny 经验：纯 Perl 模块的 test_package 使用 perl -MModule 的 smoke test + 功能测试模式"
  - "refresh-patch --auto 可能将构建产物（MYMETA.json、.xpl 文件）误识别为补丁，需手动清理"
