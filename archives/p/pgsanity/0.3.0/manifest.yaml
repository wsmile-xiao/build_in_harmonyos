software: pgsanity
version: "0.3.0"
status: published
build_date: "2026-06-12"
build_system: python

source:
  url: "https://files.pythonhosted.org/packages/53/8f/0ede629c7aeb587c284a7bb1375424af430bf4af4385036303456430f56c/pgsanity-0.3.0.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: python
  configure_options:
    - "pip install pgsanity-0.3.0-py3-none-any.whl --target=$DEFAULT_PREFIX/lib/python3.12/site-packages --no-deps"
  dependencies:
    - python/3.12.8
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Pure Python package installed via pip wheel, no C/C++ compilation needed"
  - "pip-generated entry point script uses /data/service/hnp/python.org/python_3.12/bin/python3.12 shebang which fails on HarmonyOS due to missing shared libs; must use /usr/bin/env python3 instead"
  - "pip --target install doesn't create console_scripts in bin/, must manually create entry point"
  - "On HarmonyOS, python3 is a bash wrapper script that sets up LD_LIBRARY_PATH before invoking the raw Python ELF binary; scripts must use /usr/bin/env python3 instead of direct path"