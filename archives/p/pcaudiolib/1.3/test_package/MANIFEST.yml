# test_package/MANIFEST.yml — pcaudiolib 1.3
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: pcaudiolib/1.3
homepage: "https://github.com/espeak-ng/pcaudiolib"

# 上游测试：pcaudiolib 无独立测试套件（configure.ac 无 check_PROGRAMS/TESTS、
# 顶层无 test/ 目录）——按 rule 1.2 如实声明（非跳过）；make check 尝试执行
# 并记录结果。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests: []

# test_package 消费者测试（R34 真实产物校验：libpcaudiolib.so + pcaudiolib.h）
test_package_tests:
  - file: test_pcaudiolib.py
    description: "Verifies lib/libpcaudiolib.so exists + is valid aarch64 ELF shared object (ET_DYN); include/pcaudiolib.h present"
    command: "python3 test_pcaudiolib.py"

# 断言总数：3（.so 存在 + ELF + 头文件存在）
assertion_count: 3
