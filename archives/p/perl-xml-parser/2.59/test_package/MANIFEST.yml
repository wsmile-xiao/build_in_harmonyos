# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-xml-parser/2.59
homepage: "https://metacpan.org/dist/XML-Parser"

# 上游测试命令 — XML-Parser 自带 t/ 测试套件（ExtUtils::MakeMaker `make test`）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（实测 2026-08-16，OHOS 环境）：
# - t/ 目录 62 个 .t 测试文件（t/load_encoding.t、t/finish.t、
#   t/element_inspection.t 等）
# - make test 运行（部分测试需网络/外部服务，受限环境按实际运行情况记录）
upstream_tests:
  - file: t/
    source: XML-Parser-2.59/t/
    description: "上游 Perl 测试套件（62 个 .t 文件，make test 运行）"
    command: "make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_xml_parser.py
    description: "消费者测试：加载 XML::Parser::Expat（版本 2.59 精确校验）+ 真实 XML 解析（R34）"
    command: "python3 test_xml_parser.py <site_perl-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
