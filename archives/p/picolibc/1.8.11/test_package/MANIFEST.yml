# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: picolibc/1.8.11
homepage: "https://keithp.com/picolibc/"

# 上游测试命令：picolibc 用 meson test（需 -Dtests=true + exe_wrapper=qemu-system-aarch64）。
# 本轮 -Dtests=false 不构建/运行上游 bare-metal semihosting 测试（OHOS 真机无 qemu/FVP）。
upstream_check_command: "meson test -C build --print-errorlogs"

# conanfile.py build() 是否集成上游测试：否（上游测试为 bare-metal semihosting 测试，
# 需 qemu/FVP 模拟器，OHOS 真机无法原生执行；以 test_package 编译+链接验证替代）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（test/ 目录 209 个 .c/.cpp，bare-metal semihosting，本轮不运行）
upstream_tests:
  - file: "test/**/*.c"
    source: "picolibc-1.8.11/test/"
    description: "picolibc 上游测试套件：209 个测试源文件（test/ 顶层 46 + test-math 51 + test-stdio 28 + semihost 32 + test-string 16 + libc-testsuite 10 + test-ctype 5 + testsuite/newlib.* 19 + test-iconv 1 + test-monetary 1），为 bare-metal semihosting 测试，需 qemu/FVP 运行"
    command: "meson test（需 exe_wrapper=qemu-system-aarch64 -semihosting，OHOS 真机不可用）"

# test_package 自带测试（消费者视角，R34：真实调用 picolibc API）
test_package_tests:
  - file: test_picolibc.c
    description: "消费者视角：strcpy/strcat/strcmp/strlen/memcpy/memcmp/malloc/free 验证 picolibc 头文件与静态库可编译链接（bare-metal，只验链接不运行）"
    command: "./test_probe（仅链接验证，不运行裸机 ELF）"

# 测试断言总数（test_package 6 项断言；上游测试为独立程序，本轮不运行不计入）
assertion_count: 6
