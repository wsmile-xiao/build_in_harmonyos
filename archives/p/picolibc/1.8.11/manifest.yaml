# 版本级 manifest
# 文件位置: archives/p/picolibc/1.8.11/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.8.11"
software: "picolibc"
status: built
build_date: "2026-09-20"
build_system: meson

source:
  url: "https://github.com/picolibc/picolibc/releases/download/1.8.11/picolibc-1.8.11.tar.xz"
  sha256: "b4671ddeecbe427b77fa9a863be92c74a9059e0373a5b31343c791ff2337db64"
  tar_format: tar.xz

build:
  system: meson
  configure_options:
    - "-Dmultilib=false"
    - "-Dtests=false"
    - "-Dspecsdir=none"
    - "-Dprefix=/"
    - "-Dincludedir=include"
    - "-Dlibdir=lib"
    - "-Dbuildtype=release"
    - "-Dnewlib-global-errno=true"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-disable-duplicate-names-check.patch"

knowledge_gained:
  - "picolibc 是嵌入式 bare-metal C 库（libc+libm+picocrt+semihost），Meson 构建（要求 >= 0.61），须手写 cross file 交叉编译（-nostdlib 自举，标准 Conan MesonToolchain 不适用）"
  - "clang 不支持 picolibc 的 built-in multilib（--print-multi-lib 无效），必须 -Dmultilib=false"
  - "OHOS clang 无 libgcc，运行时库用 compiler-rt builtins（clang -print-libgcc-file-name 返回 libclang_rt.builtins-*.a 路径），通过 cross file 的 librt external property 注入"
  - "上游产物 libc.a 与系统 musl -lc 同名，package 时重命名为 libpicolibc.a（同 klibc 先例）；1.8.11 起 libm 已合并进 libc.a，无独立 libm.a"
  - "-Dspecsdir=none 避免 picolibc 探测 GCC 安装目录（OHOS clang 无该目录，specs 文件对 clang 无意义）"
  - "picolibc 上游测试为 bare-metal semihosting 测试（crt0 + picolibc.ld 链接到 0x10000000 flash），需 qemu-system-aarch64/FVP 运行，OHOS 真机无法原生执行"
  - "picolibc 1.8.11 重构了目录：libc/libm 移到顶层，测试移到 test/，最低 meson 版本从 0.53 升到 0.61"
  - "scripts/duplicate-names 脚本在 HMDFS 上无执行位（ninja 直接执行报 Permission denied exit 126），用 patch 0001 禁用 check_duplicate_names 重复符号质量检查（非构建必需）"
