software: packcc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.1.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/arithy/packcc/archive/refs/tags/v3.1.0.tar.gz"

  # 源码校验和
  sha256: "26fa5c99ea36c4632fcb231479d01f354d016d2d8d97d74c44c08bc1924ae0a6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "packcc 是 CMake 项目，单一可执行文件，无库文件，BUILD_SHARED_LIBS=OFF 参数虽被 CMake 警告未使用但无害保留"
  - "GitHub 下载需用 curl -kSL 绕过 SSL 证书问题"
  - "make check 测试中 CMakeLists.txt 的 ENVIRONMENT 属性设置 CC 变量带字面双引号导致 status 127，是测试基础设施兼容性问题非软件缺陷"
  - "packcc 是终端工具（可执行文件），Conan 配方 package_info 应设置 bindirs 而非 libs"
  - "CMake 检测到 HarmonyOS 系统时输出 unknown platform 警告但不影响编译"
