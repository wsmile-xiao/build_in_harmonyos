# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "packcc 是 PEG 解析器生成器：src/packcc.c 单文件实现整个工具，CMake 编译出 bin/packcc（install 同时带 share/packcc/import 的 -I 引入 grammar 目录）；无 configure/无第三方依赖"
- "上游 check target 依赖 Bats-core（bats）与 Uncrustify 两个外部测试工具，且 test.sh 会编译并运行生成的 parser ELF——OHOS 沙箱两者皆不可用（无 bats、生成的 ELF 需签名才能执行），故不在 conan build() 内集成，改由 test_package 实跑安装产物做端到端验证（R34），原因写入 test_package/MANIFEST.yml"
- "conan CMakeToolchain 驱动 OHOS SDK clang 链接时自动写入 .codesign 签名，产出的 packcc 可执行文件在 HMDFS 上保持可执行（无需 cdargs 式手工重签名）"
- "packcc --version 输出 'packcc version 3.1.0'（g_cmdname/PACKCC_VERSION），生成的 parser.c/h 首行带 'A parser generated by PackCC 3.1.0' 标识，均可作为产物冒烟断言锚点"
- "上游 CMake 对 GNU/Clang 一律 -pedantic -Werror（Release 无 sanitizer，Debug 才加 ASan/UBSan）；CI 用 ohos-aarch64 Release profile，避开 sanitizer 库依赖"
