# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: packcc/3.1.0
homepage: "https://github.com/arithy/packcc"

# 上游测试命令（packcc 的 CMake check target 驱动 bash tests/test.sh + Bats）
upstream_check_command: "cmake --build . --target check"

# conanfile.py build() 中未集成上游测试：
#   upstream check = bash tests/test.sh → 为 46 个 tests/*.d 动态生成 .bats 并经
#   Bats-core 运行；其中 test_compile/run_for_input 还需用宿主 C 编译器编译并
#   执行生成的 parser ELF 再与 expected.txt diff。OHOS CI 沙箱无 bats；沙箱内新
#   编译 ELF 无 .codesign 签名无法执行（平台限制，vala 0.56.19 先例同）。
# 由 test_package 承担消费者视角的实质验证（R34）。
upstream_test_in_build: false
upstream_test_command: "make check = tests/test.sh via Bats-core (46 dirs, 27+.bats; needs bats + C compiler ELF exec)"

# 上游实际运行的测试程序（代表性抽样，全量见 tests/ 46 个 *.d 目录）
upstream_tests:
  - file: input.peg
    source: packcc-3.1.0/tests/basic.d/input.peg
    description: "基础 grammar：包住每个 test_generate 的 packcc 运行（生成 parser.c/h）"
    command: "packcc -I <ROOT>/import -o parser input.peg"
  - file: test.sh
    source: packcc-3.1.0/tests/test.sh
    description: "bats 驱动入口：对每个 *.d 生成 .bats 并跑 generation/compile/run 断言"
    command: "bash tests/test.sh"

# test_package 中自带的测试（消费者视角验证）：运行安装产物真实生成 parser
test_package_tests:
  - file: run_test.sh
    description: "真实测试脚本（L0c 源文件 + R34 实质验证）：packcc --version → 对 vendored 上游 calc.peg 生成 parser → 断言 calc_parser.c/.h 落盘且头含 PackCC 标识"
    command: "bash run_test.sh"
  - file: calc.peg
    description: "上游 tests/basic.d/input.peg 逐字 vendored（v3.1.0 tag，76 字节原文，含 WORD 的 PRINT action）"
    command: "packcc -o calc_parser calc.peg"
  - file: conanfile.py
    description: "test() 以 self.run('bash run_test.sh') 调用上述脚本（R34，门禁 L0c/L0d/L0e）"
    command: "bash run_test.sh"

# 测试断言总数（近似值, 用于质量评估）：上游 46 目录回归(需 bats+编译) 未实跑
# + test_package 3 步断言
assertion_count: 3
