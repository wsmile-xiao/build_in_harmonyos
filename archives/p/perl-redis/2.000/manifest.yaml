software: perl-redis
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.000/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.000"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DA/DAMS/Redis-2.000.tar.gz"

  # 源码校验和
  sha256: "14cb899797212615b4e93f916dcbdafb48d01c5eaab2038fe6cb179bf95c6feb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-io-socket-timeout/0.32"
    - "perl-try-tiny/0.31"
  # For example:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Pure Perl module, uses ExtUtils::MakeMaker (Makefile.PL) as fallback for Module::Build::Tiny"
  - "Runtime dependencies: IO::Socket::Timeout (requires PerlIO::via::Timeout), Try::Tiny"
  - "Tests require redis-server binary (not available on platform), skipped appropriately"
  - "Set PERL_MM_FALLBACK_SILENCE_WARNING=1 to suppress Module::Build::Tiny warning and 10s sleep"
  - "Redis 2.000 uses AUTOLOAD mechanism for command dispatch (set/get/del not explicitly defined)"
  - "Conan 2 Environment API used in generate() to set PERL_MM_FALLBACK_SILENCE_WARNING (not inline shell)"
  - "package_info() uses glob to dynamically discover Perl version path (no hardcoded version)"
  - "CI profile ci/conan/profiles/ohos-aarch64 has invalid os.cpu.arch setting, manual verification used"
