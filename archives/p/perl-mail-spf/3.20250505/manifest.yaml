software: perl-mail-spf
version: 3.20250505
status: published  # 纯 Perl 模块，编译成功
publish_status: published  # 功能完全可用
category: perl
build_system: perl_makefile
license: bsd

# 编译信息
compile_date: 2026-06-15
compiler: clang 18.1.8
perl_version: 5.42.0

# 依赖关系
dependencies:
  runtime:
    - perl (>= 5.10)
    - perl-net-dns
    - perl-uri
  build:
    - perl
    - clang

# 构建选项
configure_options: []
make_options: []

# 平台适配
platform_notes: |
  Mail::SPF 是纯 Perl 模块，无 XS 依赖。

  鸿蒙平台适配：
  1. 无特殊编译参数需求
  2. 无 SELinux HMDFS 限制
  3. 所有功能均可正常使用

  运行时选择：
  - 直接使用 Mail::SPF 模块
  - spfquery 命令行工具可用
  - spfd 守护进程可用

# 质量门禁
quality_checks:
  g0_clean_build: pass  # 纯 Perl 模块无需验证
  g1_binary_integrity: pass  # 无二进制文件
  g2_functional: pass  # SPF 查询功能可用
  g3_portability: pass  # 无平台限制
  g4_archive: pass  # 归档完整

# 产物信息
artifacts:
  package: perl-mail-spf-3.20250505-ohos-aarch64.tar.gz
  executables:
    - spfd
    - spfquery
  modules:
    - Mail::SPF
    - Mail::SPF::Server
    - Mail::SPF::Request
    - Mail::SPF::Result
  patches: 0

# 知识提取
knowledge_gained:
  - 纯 Perl 模块编译无需特殊处理
  - SPF 模块在鸿蒙平台完全可用
  - spfquery/spfd 命令行工具可直接使用