software: perl-meta
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.015-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.015-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-17"

# 构建系统（顶层字段，供 verify-build G4 检查）
build_system: module-build

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/meta-0.015.tar.gz"

  # 源码校验和
  sha256: "04eae3e0a124eb2479ebd9a167319f4db4d920be65e59e16ae0cd6cf7e59e6a5"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: module-build

  # 配置选项列表
  configure_options:
    - "perl Build.PL --prefix=$DEFAULT_PREFIX"
  # Module::Build based Perl XS module

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
  # Runtime: perl >= 5.14

  # 编译器
  cc: cc
  cxx: clang++

  # 环境变量覆盖（解决 clang 18 无 sysroot 问题）
  env_overrides:
    CC: cc
    LD: cc

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Build.PL.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块需要 CC=cc LD=cc 编译（使用 OpenHarmony SDK 的 clang 15 而非 perl 默认的 clang 18）"
  - "ExtUtils::CBuilder 检查 $ENV{CC} 和 $ENV{LD} 覆盖 Perl Config（Base.pm line 40/45）"
  - "LD 环境变量在运行时干扰 musl 动态链接器加载 .so，需要在运行 Perl 脚本前 unset LD"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/perl-meta-0.015-r0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/perl-meta-0.015-r0.work
  source_orig_hash: 32d62b2248aeacb7
  source_work_hash: 1ec066ed27e4d0b9
  generated_at: '2026-06-17T18:07:20'
  patches_count: 1

patch_classification:
  - file: 0001-Build.PL.patch
    type: auto
    platform_only: True
    guard: 'pending'
