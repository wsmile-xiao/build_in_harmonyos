# test_package/MANIFEST.yml — perl-path-class 0.37
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-path-class/0.37
homepage: "https://metacpan.org/pod/Path::Class"

# 上游测试套件：t/ 目录 8 个 .t 测试文件（prove -l t/ 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Path-Class-0.37/t/*.t
    description: "8 个 .t 测试文件：本地实测 **248/248（100%）**（prove -l t/，7 个运行 + 1 个 author 测试跳过——author-critic 仅供作者），零失败"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Path::Class + 真实路径操作）
test_package_tests:
  - file: test_path_class.py
    description: "Loads packaged Path::Class via perl -I<lib> and performs a real path operation (file->parent->stringify)"
    command: "python3 test_path_class.py"

# 断言总数：1（路径操作校验）
assertion_count: 1
