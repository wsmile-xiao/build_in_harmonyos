# 软件级 manifest — poke
# 遵循 ARCHIVE-SPEC v2.0

software: poke
display: "GNU poke"
description: "GNU poke — 结构化二进制数据可扩展编辑器（Poke 语言 REPL、pokefmt 模板处理器、libpoke 与 pickles）"
category: utility
homepage: "https://www.gnu.org/software/poke/"
license: GPL-3.0-or-later
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "依赖仅 bdw-gc + readline（Guile 支持上游 5.0 已移除，无需 --without-guile）；libnbd 用 --disable-libnbd 关闭"
    - "configure 通过 pkg-config 模块名 bdw-gc 查找 Boehm GC，而 conan 包名为 gc：用 BDW_GC_CFLAGS/BDW_GC_LIBS precious 变量绕过（guile 先例）"
    - "makeinfo 缺失：tarball 自带预构建 poke.info/pokeint.info/poke.text；doc/stamp-* 依赖 configure（补丁重写后 mtime 变新）会触发 mdate-sh，而 mdate-sh 在 OHOS 输出为空导致 bash `set` 把环境转储进 version.texi —— 配方在 configure 后按依赖顺序钉扎时间戳，并向 make 传 MAKEINFO=true"
    - "运行时数据重定位：POKEDATADIR（主开关，含 pkl-rt.pk/pkl-config.pk/std.pk）、POKECONFIGDIR、POKEPICKLESDIR（默认不随 POKEDATADIR 派生）、POKEFMTAPPDIR（pokefmt 独立使用）"
    - "poke 5.0 pickles 无 elf.pk；Poke 语法位移符为 <<. 与 .>>，printf 用 %v/%u16x 而非 C 的 %d"
    - "poke -c/-s 求值输出可靠；stdin 管道 REPL 与裸文件参数模式在 OHOS 上静默无输出（测试用 -c/-s）；-s 模式断言失败不传播退出码，用精确输出匹配断言"
    - "bin/ 下脚本（pk-strings 等）shebang 硬编码 prefix 路径，prefix=/ 打包后需手工调整或经 poke -L 调用"
  common_dependencies:
    - "gc"
    - "readline"

# ============================================================
# 版本索引
# ============================================================

versions:
  "5.0":
    status: built
    build_date: "2026-09-03"
