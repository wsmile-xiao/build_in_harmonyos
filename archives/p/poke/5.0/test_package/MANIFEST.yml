# test_package/MANIFEST.yml — poke 5.0
# CI L0e requires this file to exist.

package: poke/5.0
homepage: "https://www.gnu.org/software/poke/"

# Upstream test suite is DejaGnu-based (testsuite/*.exp).  DejaGnu
# (runtest/expect/tclsh) is not available on OHOS, so HAVE_DEJAGNU is
# undefined and `make check` skips the DejaGnu part; it still builds the
# four standalone C tests in testsuite/poke.libpoke (values, api,
# foreign-iod, decls), which were run manually during the port with
# LD_LIBRARY_PATH+POKEDATADIR against the build tree: 181 checks passed
# (values=116, api=57, foreign-iod=7, decls=1), 0 failed.
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: testsuite/poke.libpoke/values.c
    source: poke-5.0/testsuite/poke.libpoke/values.c
    description: "Standalone libpoke value API tests (116 checks) — built by make check, run manually during the port"
    command: "./testsuite/poke.libpoke/values"
  - file: testsuite/poke.libpoke/api.c
    source: poke-5.0/testsuite/poke.libpoke/api.c
    description: "Standalone libpoke compiler API tests (57 checks) — built by make check, run manually during the port"
    command: "./testsuite/poke.libpoke/api"
  - file: testsuite/poke.libpoke/foreign-iod.c
    source: poke-5.0/testsuite/poke.libpoke/foreign-iod.c
    description: "Standalone libpoke foreign IO device tests (7 checks) — built by make check, run manually during the port"
    command: "./testsuite/poke.libpoke/foreign-iod"
  - file: testsuite/poke.libpoke/decls.c
    source: poke-5.0/testsuite/poke.libpoke/decls.c
    description: "Standalone libpoke declaration tests (1 check) — built by make check, run manually during the port"
    command: "./testsuite/poke.libpoke/decls"

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "R34 smoke suite: poke --version; pk non-interactive evaluation (arithmetic/shift/bitwise, exact-output assertion); load crc16.pk pickle with CRC-16/CCITT standard vector '123456789'->0x29b1; pokefmt template with %{ }%/%( )% including pickle load"
    command: "bash test.sh"

# T1(1) + T2(7 exact-output lines) + T2b(1) + T3(1) + T4a/b/c(3)
assertion_count: 13
