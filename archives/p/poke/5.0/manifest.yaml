# 版本级 manifest — poke 5.0
# 遵循 ARCHIVE-SPEC v2.0

version: "5.0"
software: "poke"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://ftp.gnu.org/gnu/poke/poke-5.0.tar.gz"
  sha256: "6873d59abe821c8111b88623ea7ad9e090892fa95c75562606dd88374e2f5b8f"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--disable-libnbd"
    - "--with-libreadline-prefix=<conan readline pkg>"
    - "BDW_GC_CFLAGS=<conan gc includes>"
    - "BDW_GC_LIBS=<conan gc libs>"
    - "--enable-static --disable-shared (R26)"
  dependencies:
    - gc/8.2.12
    - readline/8.3
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-configure-hmdfs-umask-022.patch"
  - "0002-config-guess-sub-ohos-triplet.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E011/HMDFS: configure 与 jitter/configure 的 `(umask 077 && mktemp -d \"./confXXXXXX\")` 在 HMDFS UID 映射下创建 0700+setgid 不可写目录 → sed 全局 umask 077→022（顶层 4 处 + jitter 3 处）"
  - "E007: 顶层与 jitter/build-aux 的 config.guess/config.sub 增加 aarch64-unknown-linux-ohos 三元组识别"
  - "makeinfo 缺失 + stamp-vti 依赖 configure 的组合坑：补丁重写 configure 后 doc/stamp-* 判过期，mdate-sh 在 OHOS 输出为空 → bash `set` 无参会把整个环境转储进 version.texi → .info 过期 → makeinfo 127；对策=钉扎时间戳 + MAKEINFO=true"
  - "bdw-gc pkg-config 模块名与 conan 包名不一致：BDW_GC_CFLAGS/BDW_GC_LIBS precious 变量注入（guile/2.2.7 先例）"
  - "Poke 语言：位移 <<. 与 .>>；printf 标签 %v/%u16x；-s 模式断言失败不传播退出码"

patch_generation:
  method: manual-curated
  note: >
    探索构建树的全部必要源码改动已固化为两个手工补丁（0001 umask / 0002 OHOS 三元组），
    均在干净 tarball 树用 git apply --check 与 patch --dry-run 双工具验证。
    doc/stamp-* 与 version*.texi 的时间戳问题不作为补丁固化，由配方 build() 内
    _pin_prebuilt_docs() 钉扎 mtime + MAKEINFO=true 兜底处理；libpoke/poke.pc 为
    configure 生成文件，不固化。
patch_classification:
  - file: 0001-configure-hmdfs-umask-022.patch
    type: manual
    platform_only: True
    guard: none
    covers: [configure, jitter/configure]
  - file: 0002-config-guess-sub-ohos-triplet.patch
    type: manual
    platform_only: True
    guard: none
    covers: [build-aux/config.guess, build-aux/config.sub, jitter/build-aux/config.guess, jitter/build-aux/config.sub]
