software: php-pecl-memcache
version: "8.2"
status: published
build_system: phpize
build_date: "2026-06-12"

source:
  url: "https://pecl.php.net/get/memcache-8.2.tgz"
  sha256: "4dc6ddf7a4c4f5996c585b93d5159d56a9e9c49c08e29b04b4b97da5fec1ddc7"
  tar_format: tar.gz

build:
  system: phpize
  configure_options:
    - "--with-php-config=/storage/Users/currentUser/usr/local/bin/php-config85"
    - "--with-zlib-dir=/storage/Users/currentUser/usr/local"
  dependencies:
    - "php85/8.5.7"
    - "zlib/1.3.1"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PHP PECL extensions use phpize build system, not standard autotools"
  - "config.status heredoc fails on HMDFS due to Permission denied in temp directory creation"
  - "PHP extensions built with --disable-all lack session support; memcache session handler requires session extension"
  - "DESTDIR mode doesn't properly work for PHP extension make install; need manual staging"
