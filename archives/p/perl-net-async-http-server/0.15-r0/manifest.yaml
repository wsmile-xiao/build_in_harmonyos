software: perl-net-async-http-server
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.15-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.15-r0"

# 构建系统
build_system: perl

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"
compile_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Net-Async-HTTP-Server-0.15.tar.gz"

  # 源码校验和
  sha256: "43f1ef13eeae1132266578372837c4e4bdfb0556b1f4b45d7f5d97d4ce9fe99a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Build.PL --install_base=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-io-async/0.805"
    - "perl-http-message/0"
    - "perl-metrics-any/0.10"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CPAN模块使用Module::Build（perl Build.PL/./Build）而非Makefile.PL/make，需根据Build.PL判断构建系统"
  - "IO::Async不在cmd-pkgs预编译包列表中，需从CPAN手动下载安装"
  - "系统CA证书过期/缺失导致curl SSL验证失败，使用curl --insecure + init-build --no-download绕过"
  - "纯Perl模块无XS组件，不受SELinux HMDFS限制，用户可直接使用（对比perl-dbd-pg的XS模块需管理员安装HNP包）"
  - "IO::Async::Loop listen方法的addr格式不支持host键，应使用{family,socktype,port}格式"
