software: postgresql-pg_cron
display: "pg_cron"
description: "Cron-like scheduled job runner for PostgreSQL as a background worker"
category: db
homepage: "https://github.com/citusdata/pg_cron"
license: PostgreSQL
build_system: pgxs

ohos_adaptation:
  key_points:
    - "PGXS 扩展使用 make USE_PGXS=1 编译，无需 configure 步骤 [E200]"
    - "pg_cron 作为 background worker 运行，需在 shared_preload_libraries 中加载"
  common_dependencies:
    - postgresql

versions:
  "1.6.7":
    status: published
    build_date: "2026-06-10"