software: postgresql-pg_cron
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6.7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6.7"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/citusdata/pg_cron/tarball/v1.6.7"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: pgxs

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: pgxs

  # 配置选项列表 (pg_cron 使用 PGXS，无需 configure)
  configure_options:
    - "make (PGXS via pg_config)"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - postgresql/17.10

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
