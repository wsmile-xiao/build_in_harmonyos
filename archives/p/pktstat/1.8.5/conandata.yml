# conandata.yml — pktstat 1.8.5
# 官方源：GitHub 标签 v1.8.5。
#
# R39 取源说明：pktstat 原站 www.adaptive-enterprises.com.au/~d/software/pktstat/
# 早已下线（实测 http 301 到 https 后连接失败 code=000，Gentoo distfiles 镜像
# ftp.ussg.iu.edu 与 macports distfiles 对 1.8.5 均 404）。dleonard0/pktstat 是
# Gentoo 包数据库登记的 Upstream（Remote-Id: https://github.com/dleonard0/pktstat），
# 即原作者停止维护后的权威延续仓库，v1.8.5 标签内容与 Debian/Ubuntu 的
# pktstat_1.8.5.orig.tar.gz 同一版本线，非个人 fork/网盘/CDN。

sources:
  "1.8.5":
    url: "https://github.com/dleonard0/pktstat/archive/refs/tags/v1.8.5.tar.gz"
    sha256: "9a365668d9c5d22484702a858ad1892ae6c7b904b5d0bc9ae075bd88a145b9cd"

patches:
  # 0001 tcp.c: musl's <netinet/in.h> keeps IPPORT_RESERVED but dropped the
  # historical IPPORT_USERRESERVED macro, so tcp_lookup() fails with
  # "use of undeclared identifier 'IPPORT_USERRESERVED'". Restore the BSD/glibc
  # value 1023 behind a plain #ifndef guard, so the guard is driven by the libc's
  # macro set instead of a platform test (R8) and libcs that do define the macro
  # keep their own value. Behaviour is unchanged: the getservbyport() name
  # lookup stays restricted to ports <= 1023.
  - patch_file: "patches/0001-tcp-port-reserved-constant.patch"
    patch_type: "portability"
    patch_description: "0001 tcp port reserved constant"
