# 版本级 manifest — pktstat 1.8.5
# 文件位置: archives/p/pktstat/1.8.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "1.8.5"
software: "pktstat"
status: built
build_date: "2026-10-01"
build_system: autotools

source:
  url: "https://github.com/dleonard0/pktstat/archive/refs/tags/v1.8.5.tar.gz"
  sha256: "9a365668d9c5d22484702a858ad1892ae6c7b904b5d0bc9ae075bd88a145b9cd"
  tar_format: tar.gz
  upstream_url_note: >-
    原站 www.adaptive-enterprises.com.au/~d/software/pktstat/ 已下线（实测 301 后连接失败）；
    dleonard0/pktstat 是 Gentoo 包数据库登记的 Upstream Remote-Id，即原作者停维后的权威延续仓库，
    v1.8.5 与 Debian/Ubuntu 的 pktstat_1.8.5.orig.tar.gz 同一版本线。

build:
  system: autotools
  bootstrap: >-
    标签内只有 configure.ac + Makefile.am（无 configure、无 autogen），故 build() 先跑
    autoreconf -fi 生成 configure/Makefile.in。**必须 tool_requires automake**：
    CI worker 镜像自带 autoconf_2.72 但**没有 automake**，裸 autoreconf 会报
    Can't exec "aclocal"（CI 构建 #66008）。automake/1.18 在制品仓有 OHOS/armv8
    预编译包，且 CI worker 本身就是 aarch64 HarmonyOS，可原生执行（此前担心的
    "armv8 工具在 x86 worker 上跑不了"不成立——worker 不是 x86）。选 1.18 是
    因为已合入的 abiword-plugin-*/3.0.8 用的就是它（CI 已验证绿）。
  configure_options:
    - "仅 Autotools._configure_args（默认 --prefix），配方不追加任何 feature/编译开关"
    - "同一条命令内 unset CONFIG_SHELL（E386）"
  build_command: >-
    autoreconf -fi && unset CONFIG_SHELL; ./configure <Autotools._configure_args> && make -j1
  install_method: "make install DESTDIR=<package_folder>（Autotools.install target=install）"
  dependencies:
    - "libpcap/1.10.6（configure.ac:85 硬依赖，缺 pcap_open_live 即 AC_MSG_ERROR；仓内为纯静态包）"
    - "ncurses/6.6（configure.ac:87 硬依赖，缺 initscr 即 AC_MSG_ERROR；仓内只有 libncursesw.a）"
  dependency_track_note: >-
    不需要像 lft 那样的 --with-pcap 强钉：pktstat 的 configure 只有
    AC_SEARCH_LIBS/AC_CHECK_FUNC 弱探测，没有带路径的 --with-* 开关可钉；
    AutotoolsDeps 把 -l 闭包注入 $LIBS，ncurses 的 -lncursesw 使
    AC_SEARCH_LIBS(tgoto/initscr, [... curses ncurses ...]) 直接命中
    （实测 checking for initscr... yes），无需任何手工干预。
  cc: clang
  cxx: clang++

patches_applied: ["0001-tcp-port-reserved-constant.patch"]

patch_classification:
  - file: "0001-tcp-port-reserved-constant.patch"
    target: "tcp.c"
    type: portability
    reason: >-
      补回 musl 缺失的 IPPORT_USERRESERVED 宏（BSD/glibc 历史上均为 1023）。
      守卫条件取自 libc 自身宏集合，无任何平台宏；不改变语义，
      getservbyport() 名称解析仍限定端口 <= 1023。

in_build_source_transformations: []

knowledge_ref:
  - "E386"   # CONFIG_SHELL 指向 HMDFS bash，getcwd 失败 → 同命令内 unset
  - "E011"   # 同族：autotools 生成文件的就地改写形态（本包未触发，仅对照确认无需改写）
  - "E160"   # 同族：本包不触发（autoreconf 重新生成 config.guess，自带 OHOS 分支）

knowledge_gained:
  - "musl 移除 IPPORT_USERRESERVED 导致 tcp_lookup() 编译失败；按 libc 宏集做 #ifndef 兜底（草稿见 knowledge/drafts/）"

