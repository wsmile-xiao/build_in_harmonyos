# test_package/MANIFEST.yml
# 上游测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pktstat/1.8.5
homepage: "https://github.com/dleonard0/pktstat"

# 上游测试命令声明
# 清点结论：v1.8.5 标签内**不存在**任何自动化测试。四条独立证据（全部实测）：
#   1) 解包后的源码树里 `find -type d -iname 'test*'` 与 `find -type f -iname '*test*'`
#      命中数均为 0；也没有 .github/ / .gitlab-ci.yml / autopkgtest 之类测试驱动；
#   2) configure.ac(100 行) 与 Makefile.am(37 行) 中 TESTS / check_PROGRAMS /
#      check_SCRIPTS / add_test / AC_*_TEST 的命中数均为 0；
#   3) `autoreconf -fi` 后 automake 生成的 Makefile.in(969 行) 里没有 TESTS /
#      TEST_LOGS / check_PROGRAMS 变量，`check-am` 的配方为空（`check-am: all-am`
#      后面没有任何命令行）；
#   4) 打好本包补丁使树可编译后真跑 `make check`：rc=0、输出 0 行、没有生成
#      test-suite.log、也没有任何 .trs —— 即"跑 0 个用例"。
# 注意：上游**确实有** `check` 目标（automake 无条件生成），但它是空壳，
# 等价于 `make all`。早前版本的本文件曾把它写成 "No rule to make target 'check'"，
# 该说法经实测证伪，已订正（详见 archives/p/pktstat/1.8.5/notes.md 注意事项）。
upstream_check_command: "make check（存在但为空壳：TESTS 为空、rc=0、跑 0 个用例）"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "N/A — 上游无测试目标，build() 只执行 make（跑了 check 会直接中断构建）"

# 上游测试用例清单：空（附清点证据如上）
upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: "test.sh"
    description: >-
      真实执行已安装的 bin/pktstat，8 个清点用例：getopt 拒绝未知选项 + 退出码 1、
      版本横幅输出 1.8.5、usage 行完整列出全部选项组、-l/-t 互斥拒绝 + 退出码 1、
      -m 0 数值校验拒绝 + 退出码 1、坏网卡的 libpcap 错误路径确实被走到（rc=1 且
      回显 nosuchif0）、loopback 一次性抓包（构建容器无 packet socket 时按实测
      stderr 记 skip 而非 pass）。
    command: "sh test.sh <pkg>/bin/pktstat <scratch>/behaviour.txt"

# test_package/conanfile.py 内额外断言（不依赖 test.sh）
test_package_static_assertions:
  - file: "test_package/conanfile.py"
    description: >-
      纯 Python ELF 解析（不依赖 readelf/llvm-readelf）核验交付面不变量 11 项：
      aarch64 / PIE / PT_INTERP 属于 OHOS 64 位用户态加载器接受集
      {/lib/ld-musl-aarch64.so.1（CI #66055 实测值）, /lib/ld-linux-aarch64.so.1
      （部分 OHOS sysroot 拼法）}（断言名 interp-is-ohos-64bit-loader）/
      栈不可执行 NX / 存在 GNU_RELRO / DT_NEEDED 均为裸 soname /
      libpcap 与 ncurses 未出现在 DT_NEEDED（证明两者静态链接）/
      无宿主路径泄漏 / man page 已安装 / license 已安装。
    command: "conan create 自动触发（test_package 的 test()）"

# 测试断言总数
#   上游用例   0（清点结论，非环境结论）
#   消费者用例 8（7 通过 + 1 按技术原因 skip）
#   静态断言  11
assertion_count: 19
