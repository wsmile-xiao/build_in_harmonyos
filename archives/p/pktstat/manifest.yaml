# 软件级 manifest — pktstat
# 遵循 ARCHIVE-SPEC v3.0

software: pktstat
display: "pktstat"
description: "top 风格的网络连接流量实时查看器：用 libpcap 抓取指定网卡报文，按协议与端口聚合成 flow，再以 ncurses 全屏界面定时刷新"
category: network
homepage: "https://github.com/dleonard0/pktstat"
license: public-domain
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "package_type=application 的 CLI 网络工具：package_info 不导出 cpp_info.libs（只声明 bindirs=bin、resdirs=share），可执行命令由软件级 commands.json 声明为 [pktstat]（R38/L0k）"
    - "BPF 过滤器全部由 libpcap 提供：main.c 走 pcap_compile/pcap_setfilter，struct bpf_program 与 bpf_u_int32 直接来自 <pcap.h>。ether.c/ip.c/tcp.c/udp.c/sll.c/ppp.c/loop.c/frag.c/ipx.c/wol.c 是按 DLT 分派的**打标函数**（ether_tag/ip_tag/...），不是 BPF 字节码——适配时别被文件名误导去找自带 BPF 编译器"
    - "libpcap 与 ncurses 都是 configure 期的**硬依赖**（pcap_open_live / initscr 缺失即 AC_MSG_ERROR），但探测是 AC_SEARCH_LIBS/AC_CHECK_FUNC 弱探测，没有 --with-pcap 之类可钉路径的开关。配方因此不必追加 feature 参数：AutotoolsDeps 把依赖 -l 闭包注入 $LIBS 即可让探测全部命中"
    - "仓内 ncurses/6.6 只产出 libncursesw.a（无 libncurses.a / libcurses.a），而 configure 的 AC_SEARCH_LIBS 短名列表是 [termlib termcap curses ncurses ocurses]。**短名一个都链不到**，能过的唯一原因是 $LIBS 里已经有 ncurses 导出的 -lncursesw。若换 ncurses 版本或改 options.shared，务必复验这条"
    - "上游标签只带 configure.ac + Makefile.am（无 configure、无 autogen）⇒ 必须 autoreconf -fi，而 autoreconf 强制要求 aclocal（来自 automake）。**worker 镜像不能假定有 automake**：CI 实证（HNP 有 autoconf_2.72、无 automake）裸 autoreconf 直接报 Can't exec \"aclocal\"（构建 #66008）。因此声明 tool_requires(\"automake/1.18\")：制品仓有 OHOS/armv8 预编译包，CI worker 本身是 aarch64 HarmonyOS 可原生执行，该包同时带入 aclocal 脚本所需的 perl。选 1.18 因为已合入的 abiword-plugin-*/3.0.8 用的就是它（CI 已验证）"
    - "layout 用 basic_layout(build_folder='.') 保持 in-tree：autoreconf 在源码树内重新生成 configure/Makefile.in/config.h.in，in-tree 让 bootstrap→configure→make 都在同一棵树里，形状与 lft/3.98 一致"
    - "E386：profile [buildenv] 导出 CONFIG_SHELL=/data/service/hnp/bin/bash，该 bash 在 HMDFS 上 getcwd 失败，autoconf 的 configure 会用 $CONFIG_SHELL 重新 exec 自身并在启动期报 working directory cannot be determined；必须在**同一条命令**里 unset（generate() 期 env.unset 会被运行期重注入击败），configure 参数仍取 Autotools._configure_args，配方只追开关不拼编译参数（R1/R33/R49）"
    - "libpcap 与 ncurses 在仓内都是**纯静态包**，产出的 ELF 的 DT_NEEDED 只有 libc.so 一项 ⇒ 运行期无 loader 路径依赖；这也让 test_package 能用一条「libpcap/ncurses 不出现在 DT_NEEDED」的断言钉住静态链接事实"
    - "musl 已删除历史宏 IPPORT_USERRESERVED（只保留 IPPORT_RESERVED），tcp_lookup() 会报 use of undeclared identifier。处方是 #ifndef 兜底回 BSD/glibc 的 1023——守卫条件取自 libc 宏集而非平台宏，符合 R8，且 libc 自带该宏时保持原值"
    - "上游源码是 K&R 风格（函数定义无原型 + K&R 参数表，如 upcall_from_pcap(context, hdr, data) u_char *context;），clang 15 默认 gnu17 下合法，只有 -Wdeprecated-non-prototype 警告，不需要为新编译器改源码"
    - "configure.ac 用了 4 个已过时宏（AM_CONFIG_HEADER / AC_HEADER_STDC / AC_HEADER_TIME / AC_TYPE_SIGNAL），autoconf 2.71 只 warn 不报错（不自动跑 autoupdate），无需补丁"
    - "能力边界（网络诊断类通用）：实时抓包类用例在构建容器里受内核能力限制——pktstat -1 -i lo -P -w 1 实测被拒（lo: can't get TPACKET_V3 header len on packet socket: Not supported，容器缺 AF_PACKET/TPACKET_V3），pcap_lookupdev 也可能失败（eth0: SIOCETHTOOL(ETHTOOL_GLINK) ioctl failed: Function not implemented）。能稳定断言的是选项解析/校验/错误路径，以及『libpcap 确实被链入并被调用』（坏网卡时回显 libpcap 自己的错误串）；受限用例必须按实测技术原因记 skip，不得记成通过"
    - "main.c 的 VERSION 宏：configure.ac 第 10 行的 AC_SUBST(VERSION,...) 是注释掉的（注释写明为修 automake-1.4 的 brokenness），但实测版本横幅仍正确输出 1.8.5，适配时不必补"
  common_dependencies:
    - libpcap
    - ncurses

# ============================================================
# 版本索引
# ============================================================

versions:
