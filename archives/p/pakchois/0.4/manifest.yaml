knowledge_gained:
  - "pakchois 0.4 为 libtool/autoconf 2.61 时代 C 库：lib_LTLIBRARIES=libpakchois.la（pakchois.c+errors.c），头文件装到 include/pakchois/，产出 pakchois.pc；configure.ac 硬检查 -lpthread/-ldl 且带 GNU gettext po/"
  - "config.sub（2006-09-20）无 aarch64（grep 计数=0）；以 replace_in_file 在两处识别列表补入 aarch64/aarch64_be（与 arm/arm-* 同构），配合 --build=aarch64-unknown-linux-gnu 跳过 config.guess（旧版无法识别 HarmonyOS）"
  - "configure.ac 的 AC_CHECK_LIB(pthread/dl)+AC_MSG_ERROR 在 OHOS musl（dl*/pthread* 并入 libc）下需以 ac_cv_lib_* 缓存变量跳过实链探针；libtool 共享库链接不传 --no-undefined，未定义符号运行期由 libc 解析"
  - "HMDFS 上 config.status mktemp 临时目录因 umask 077 无组写权限失败 → configure/config.guess umask 077→022；TMPDIR 指到 conan build 目录（同 p11-kit/encript 配方）"
  - "GNU gettext po/ 子树在 --disable-nls 下无碍（po/Makefile.in.in 空 all-no: 目标）"
  - "上游无自动化测试（Makefile.am 无 TESTS，Makefile.in check 为 automake 空转）；test 为 noinst_PROGRAMS 演示程序需运行期 PKCS#11 token，无法离线自动执行 → 如实 upstream_test=0；test_package 行为测试（8 断言）：dlopen libpakchois.so + dlsym 真实调用 pakchois_module_load 负路径（无 provider → CKR_GENERAL_ERROR，*module 保持 NULL）+ pakchois_error 错误表 3 分支"
  - "正向功能链路（槽位/会话/对象转发）无法离线验证：/lib→/system/lib 为只读系统分区，无法向编译期烘焙的 MODPATH（//lib://lib/pkcs11）注入 stub provider fixture → stub 方案已否决并记录于 notes.md，留待真机具备真实 token 时补充"
