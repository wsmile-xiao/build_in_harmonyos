# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pakchois/0.4
homepage: "http://www.manyfish.co.uk/pakchois/"

# 上游测试命令 — 经源码核查：0.4 的 Makefile.am 未注册任何 TESTS/check_PROGRAMS。
# 目录下的 `test` 是 noinst_PROGRAMS 演示/手动程序（test.c），运行期需真实
# PKCS#11 token（--pkcs11module <token.so>），不属于 make check 自动测试。
# automake 会生成一个空 `check` 目标（无 TESTS → no-op）。
upstream_check_command: "none (upstream Makefile.am registers no TESTS; `make check` is an automake no-op)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（test 为 noinst 手动示例，离线不可自动执行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, R34 反空壳)
test_package_tests:
  - file: test.c
    description: "dlopen lib/libpakchois.so + dlsym pakchois_module_load/pakchois_get_info/pakchois_module_destroy（R34 反空壳，真实导出符号）"
    command: "./test_probe"

# 测试断言总数 (test_package 实际执行的断言: 3 个符号检查)
assertion_count: 3
