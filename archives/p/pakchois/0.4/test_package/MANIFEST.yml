# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pakchois/0.4
homepage: "https://www.manyfish.co.uk/pakchois/"

# 上游测试命令 — 经源码核查：0.4 的 Makefile.am 未注册任何 TESTS/check_PROGRAMS。
# 官方 tarball 预生成的 Makefile.in 中 `check: check-recursive` 为 automake 空转，
# `grep '^TESTS' Makefile.in` 为空 → `make check` 无自动化测试可跑。
# 目录下的 `test` 是 noinst_PROGRAMS 演示/手动程序（test.c），运行期需真实
# PKCS#11 token（--pkcs11module <token.so> 等价语义：pakchois_module_load 按
# 编译期 MODPATH 搜索 provider），不属于 make check 自动测试，离线不可自动执行。
upstream_check_command: "none (upstream Makefile.am registers no TESTS; `make check` is an automake no-op)"

# conanfile.py build() 方法中是否已集成上游测试（无测试可集成，如实 false）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无（test 为 noinst 手动示例，离线不可自动执行）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, R34 反空壳 + 无 token 行为测试)
test_package_tests:
  - file: test.c
    description: "dlopen lib/libpakchois.so + dlsym pakchois_module_load/pakchois_error/pakchois_module_destroy（R34 反空壳）；再经 dlsym 函数指针真实调用：pakchois_module_load 负路径（无 provider → CKR_GENERAL_ERROR，完整走通 provider_mutex/MODPATH 遍历/dlopen 失败/错误传播）+ *module 保持 NULL（无悬空句柄）；pakchois_error 错误表 3 项（CKR_OK/CKR_GENERAL_ERROR/CKR_VENDOR_DEFINED 分支，--disable-nls 下 _(x)=x）"
    command: "./test_probe"

# 限制（如实记录，不伪造测试）：成功路径（槽位/会话/对象转发）需运行期真实
# PKCS#11 token。仓库内无 token provider 配方，且 OHOS 上 /lib→/system/lib
# 为只读系统分区，无法向编译期烘焙的 MODPATH（//lib://lib/pkcs11）注入
# 测试 provider fixture → 以负路径行为测试覆盖加载/错误链路，成功路径留待
# 真机环境具备 token 时补充。
test_limitations:
  - "正向功能链路（C_Initialize/GetSlotList/OpenSession 转发）需真实 PKCS#11 token，测试环境不可得（/lib 只读，无 token 配方）"

# 测试断言总数 (test_package 实际执行的断言: 3 个符号检查 + 5 个行为断言)
assertion_count: 8
