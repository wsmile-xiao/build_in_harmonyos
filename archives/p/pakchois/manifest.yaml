software: pakchois
display: "pakchois"
description: "PKCS#11 薄封装库（DSO 模块加载 + 面向对象 C 接口），不依赖特定密码工具包"
category: security
homepage: "http://www.manyfish.co.uk/pakchois/"
license: LGPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "2008 年 autotools/libtool 时代工程（autoconf 2.61，config.sub 2006-09-20）：config.sub 不认识 aarch64 → build() 打最小补丁（裸 CPU 列表 + 带厂商名列表补入 aarch64/aarch64_be，与 arm/arm-* 同构）；configure 显式 --build=aarch64-unknown-linux-gnu 跳过 config.guess（无法识别 uname -s=HarmonyOS）"
    - "configure.ac 硬检查 -lpthread/-ldl（AC_CHECK_LIB + AC_MSG_ERROR）：OHOS musl 并入 libc → 注入 ac_cv_lib_pthread_pthread_mutex_lock=yes / ac_cv_lib_dl_dlopen=yes 跳过实链探针"
    - "GNU gettext po/ 子树（AM_GNU_GETTEXT external）→ --disable-nls（po/Makefile.in.in 提供空 all-no: 目标）"
    - "HMDFS：configure/config.guess 中 umask 077→022 放宽（config.status mktemp 临时目录无组写权限）；TMPDIR 指向 conan 可写 build 目录"
    - "上游无自动化测试：Makefile.am 无 TESTS；test 为 noinst_PROGRAMS 手动/演示程序（需运行期 PKCS#11 token）；如实 upstream_test=0，反空壳验证在 test_package（dlopen libpakchois.so + dlsym）"
  common_dependencies: []

versions:
  "0.4":
    status: pending
    build_date: ""
