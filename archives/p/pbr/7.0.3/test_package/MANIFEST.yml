# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pbr/7.0.3
homepage: "https://docs.openstack.org/pbr/latest/"

# 上游测试命令 — pbr pytest 套件
upstream_check_command: "python3 -m pytest -o addopts=""" ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - pbr/tests/ 目录（单元测试 test_version/test_easy_install 等 +
#   functional 系列）
# - 实测结果：**33 passed（100%，排除受阻部分）**——test_version 等
#   单元测试全过；受阻：test_files/test_packaging/test_pbr_json/
#   test_git/test_setupcfg + functional 系列（13 文件）缺 `virtualenv`
#   （隔离测试依赖，usr/local python3 未安装）——如实记录不臆造
upstream_tests:
  - file: pbr/tests/
    source: pbr-7.0.3/pbr/tests/
    description: "上游 pytest 套件（实测 33 passed；test_files/functional 等 13 文件缺 virtualenv 受阻）"
    command: "python3 -m pytest -o addopts=""" ""

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_pbr.py
    description: "消费者测试：真实 API（R34）——import pbr + pbr.version.VersionInfo 版本解析 + pbr.packaging 可导入"
    command: "python3 test_pbr.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
