software: perl-list-someutils
# 版本级 manifest 模板
# 文件位置: archives/p/perl-list-someutils/0.59-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.59-r1"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: perl

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DR/DROLSKY/List-SomeUtils-0.59.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"
    - "PUREPERL_ONLY=1"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "Module-Implementation/0.09"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块编译需要设置 CPATH 环境变量指向 musl 头文件目录"
  - "纯 Perl 模式（PUREPERL_ONLY=1）可跳过 XS 编译，避免平台兼容性问题"
  - "Perl 模块无二进制文件是正常情况，质量门禁 G4 的无二进制警告可忽略"
