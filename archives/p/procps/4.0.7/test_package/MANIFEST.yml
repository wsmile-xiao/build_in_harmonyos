# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游测试列表来源: procps-ng 4.0.7 源码树 library/tests/ 下 8 个
# CUnit 测试程序 (make check 实际执行, 前任探索构建已验证)。
# OHOS 实测统计: 7 PASS / 1 FAIL (test_version 的
# procps_linux_version() 子用例为环境性失败, 详见版本目录 notes.md)。

package: procps/4.0.7
homepage: "https://gitlab.com/procps-ng/procps"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make check (try/except: OHOS 环境 test_version 子用例已知失败不阻塞构建)"

# 上游实际运行的测试程序 (8 个, library/tests/)
upstream_tests:
  - file: library/tests/test_escape.c
    source: procps-ng-4.0.7/library/tests/test_escape.c
    description: "escape 序列处理 (procps_data_escape/unescape 等)"
    command: "./library/tests/test_escape"
  - file: library/tests/test_pids.c
    source: procps-ng-4.0.7/library/tests/test_pids.c
    description: "pids API (procps_pids_new/get/unref, PIDS_VAL)"
    command: "./library/tests/test_pids"
  - file: library/tests/test_uptime.c
    source: procps-ng-4.0.7/library/tests/test_uptime.c
    description: "uptime/loadavg API (procps_uptime)"
    command: "./library/tests/test_uptime"
  - file: library/tests/test_sysinfo.c
    source: procps-ng-4.0.7/library/tests/test_sysinfo.c
    description: "sysinfo API (procps_sysinfo)"
    command: "./library/tests/test_sysinfo"
  - file: library/tests/test_version.c
    source: procps-ng-4.0.7/library/tests/test_version.c
    description: "版本 API (LINUX_VERSION macro / procps_linux_version; OHOS 上后者因 HongMeng 内核版本串非标准而环境性失败)"
    command: "./library/tests/test_version"
  - file: library/tests/test_namespace.c
    source: procps-ng-4.0.7/library/tests/test_namespace.c
    description: "namespace API"
    command: "./library/tests/test_namespace"
  - file: src/tests/test_fileutils.c
    source: procps-ng-4.0.7/src/tests/test_fileutils.c
    description: "文件工具 API"
    command: "./src/tests/test_fileutils"
  - file: src/tests/test_strtod_nol.c
    source: procps-ng-4.0.7/src/tests/test_strtod_nol.c
    description: "strtod_nol 数值解析"
    command: "./src/tests/test_strtod_nol"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_procps.c
    description: "链接 libproc2 调用真实 C API: procps_uptime/procps_loadavg/procps_pids_new+get+unref (PIDS_VAL(EU_PID,s_int,stack)), 断言 uptime>0 与 PID 获取成功"
    command: "./test_procps"
  - file: conanfile.py
    description: "运行打包真实二进制并断言输出: ps --version 含 procps-ng / free 含 Mem / uptime 含 load average (can_run 时)"
    command: "ps --version; free; uptime"

# 测试断言总数 (近似值, 用于质量评估)
# test_procps.c: uptime(rc==0, up>0, idle>0)=3 + loadavg(rc==0, av1>=0)=2
#              + pids(new==0, pid>0, unref==0, seen>0)=4
# conanfile.py: ps/free/uptime 输出断言=3
assertion_count: 12
