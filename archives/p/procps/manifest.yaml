software: procps
display: "procps-ng"
description: "procps-ng — system monitoring tools (ps, top, free, uptime, vmstat, w, watch, ...) built on libproc2, a library to control and query process state via /proc"
category: system
homepage: "https://gitlab.com/procps-ng/procps"
license: "GPL-2.0-or-later"
build_system: autotools

ohos_adaptation:
  key_points:
    - "musl libc 无 strverscmp：local/strverscmp.c 补入 libproc2 源列表（Makefile.am/.in，E534）"
    - "config.guess/sub 增加 HarmonyOS 识别（__OHOS__ → LIBC=ohos → aarch64-unknown-linux-ohos，E007）"
    - "configure 两处 umask 077 移除：HMDFS 拒绝 drwx------ 临时目录（E011/E114）"
    - "w.c 的 utmpx 在 OHOS 不可用：stat.h include 后 __OHOS__ 下 #undef HAVE_UTMPX_H（E121）"
    - "top/slabtop/watch 链接静态 conan ncurses/6.6（ncursesw）：系统 shell 依赖系统 libncursesw.so.6，共享库会引发 RPATH 冲突（R4/R26）"
    - "上游 make check 8 程序：7 PASS / 1 FAIL — test_version 的 procps_linux_version() 因 HongMeng Kernel 1.12.0 非标准版本串 + /proc/version 不可读（Permission denied）而环境性失败（sscanf 解析不出），禁改断言，如实记录"
  common_dependencies:
    - ncurses

versions:
  "4.0.7":
    status: built
    build_date: "2026-09-04"
    conan_ref: "procps/4.0.7"
