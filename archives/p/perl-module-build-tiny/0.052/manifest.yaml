software: perl-module-build-tiny
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.052/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.052"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/Module-Build-Tiny-0.052.tar.gz"

  # 源码校验和
  sha256: "bd10452c9f24d4b4fe594126e3ad231bab6cebf16acda40a4e8dc784907eb87f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom
  build_system: Module::Build::Tiny (perl Build.PL)

  # 配置选项列表
  configure_options:
    - "perl Build.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "ExtUtils-Config/0.010"
    - "ExtUtils-Helpers/0.027"
    - "ExtUtils-InstallPaths/0.015"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Module::Build::Tiny 是纯 Perl 模块，无需 C 编译器，构建过程仅需 perl Build.PL + perl Build"
  - "OpenHarmony chmod 限制 (E046): chmod 无法设置 readonly，实际 mode 固定为 660，导致测试套件中 2 个 readonly 测试失败"
  - "Module::Build::Tiny install 使用 Perl 默认安装路径 (/data/service/hnp/)，该路径不可写，需通过 ~/usr/local 或 cmd-pkgs 安装"
  - "纯 Perl 模块不受 SELinux HMDFS 限制影响（与 perl-dbd-pg 的 XS 模块不同），模块加载无需 HNP 安装"
  - "ld.lld 不支持 -fstack-protector-strong 参数，来自 XS 测试而非模块本身"
