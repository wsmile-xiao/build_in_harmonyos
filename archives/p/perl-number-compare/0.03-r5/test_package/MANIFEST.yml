# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-number-compare/0.03-r5
homepage: "https://metacpan.org/dist/Number-Compare"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
# Number::Compare 0.03 上游无独立测试套件 (t/ 目录为空)
# test_package 自带测试覆盖核心功能
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_compare.pl
    description: "Number::Compare 数值比较功能测试 (大于/小于/等于/后缀)"
    command: "perl test_compare.pl"
  - file: run_test.sh
    description: "L0c 合规包装器 — 调用 test_compare.pl"
    command: "bash run_test.sh"

# 测试断言总数 (近似值)
# test_package: 15 个断言 (6 组比较测试)
assertion_count: 15
