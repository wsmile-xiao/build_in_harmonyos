software: perl-number-compare
# 版本级 manifest
# 文件位置: archives/p/perl-number-compare/0.03-r5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.03-r5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RC/RCLAMP/Number-Compare-0.03.tar.gz"

  # 源码校验和
  sha256: "83293737e803b43112830443fb5208ec5208a2e6ea512ed54ef8e4dd2b880827"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # perl Makefile.PL 使用 ExtUtils::MakeMaker，无需额外 configure 参数

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 纯 Perl 模块，无外部依赖（仅需 perl 本身）

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Number::Compare 是纯 Perl 模块，无需 C 编译器，使用 ExtUtils::MakeMaker 构建"
  - "纯 Perl 模块在 OpenHarmony 上无需处理 SELinux HMDFS 限制（与 XS 模块不同）"
  - "Perl 模块 Conan 配方使用 package_info 的 libdirs 指向 .pm 文件目录，无 C 库/头文件/二进制"
  - "Conan test_package 通过 glob 查找 Compare.pm 并动态生成测试脚本验证模块加载"
  - "Number::Compare 支持 >, <, >=, <= 比较和裸数字(==)，支持 k/ki/m/mi/g/gi 数量级后缀"
