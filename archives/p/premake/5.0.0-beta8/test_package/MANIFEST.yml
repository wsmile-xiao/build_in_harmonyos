# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: premake/5.0.0-beta8
homepage: "https://premake.github.io/"

# 上游测试命令（premake 测试 = 对 tests/ 运行 premake5 test，91 个 Lua 测试文件）
upstream_check_command: "premake5 test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（实测 2026-08-15，OHOS 环境）：
# - 上游 tests/ 91 个 Lua 测试文件（_tests.lua 61 项入口），需 premake5 test 运行
# - 本地以 test_package 冒烟替代：--version + 真实 gmake2 项目生成
# - 完整 tests/ 套件在受限环境运行情况待本地验证时实测记录
upstream_tests:
  - file: tests/
    source: premake-core-5.0.0-beta8/tests/
    description: "premake 自身 Lua 测试套件（91 文件，_tests.lua 61 项入口，premake5 test 运行）"
    command: "premake5 test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_premake.py
    description: "消费者测试：premake5 --version（5.0.0）+ 真实 gmake2 项目生成冒烟（premake5.lua → Makefile）"
    command: "python3 test_premake.py <premake5-bin>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
