software: perl-package-variant
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.003002-r4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.003002-r4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/M/MS/MSTROUT/Package-Variant-1.003002.tar.gz"

  # 源码校验和
  sha256: "b2ed849d2f4cdd66467512daa3f143266d6df810c5fae9175b252c57bc1536dc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl-makemaker

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器（纯 Perl 模块，未使用 C 编译器）
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 ExtUtils::MakeMaker 构建系统，编译过程仅复制 .pm 文件到 blib，无需 C 编译器"
  - "Makefile.PL 使用 INSTALL_BASE 而非 PREFIX+DESTDIR 安装，可避免 Conan 打包时路径双重嵌套"
  - "纯 Perl 模块不产生 .so 动态库，不受 SELinux HMDFS 限制，可在任意目录加载"
  - "CPAN 源码下载在鸿蒙环境可能遇到 SSL 证书验证失败，需配置 CA 证书或使用 conandata.yml 的 SHA256 校验替代"
  - "运行时依赖 strictures 和 Import::Into 需手动从 CPAN 下载安装"
  - "conanfile.py 对纯 Perl 模块无需设置 cpp_info.libs，应通过 runenv_info 设置 PERL5LIB 路径"
  - "conan-verify G0 clean-build 验证对 Perl 模块会失败（无 configure 脚本），记录为已知限制不阻塞"
