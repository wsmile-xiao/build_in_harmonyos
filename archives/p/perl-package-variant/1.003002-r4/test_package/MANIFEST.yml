# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-package-variant/1.003002-r4
homepage: https://metacpan.org/dist/Package-Variant

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游 make test 实际运行的测试套件
upstream_tests:
  - name: "01simple"
    source: t/01simple.t
    description: "基本功能测试"
  - name: "10argument-types"
    source: t/10argument-types.t
    description: "参数类型测试"
  - name: "11dynamic-build"
    source: t/11dynamic-build.t
    description: "动态构建测试"
  - name: "20moo-param-role"
    source: t/20moo-param-role.t
    description: "Moo 参数角色测试"
  - name: "30-pragma-leak"
    source: t/30-pragma-leak.t
    description: "pragma 泄漏测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_variant.sh
    description: "Package::Variant 模块加载 + 版本验证 + build_variant API 测试"
    command: "sh test_variant.sh"

# 测试断言总数
assertion_count: 3
