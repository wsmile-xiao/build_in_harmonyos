software: protobuf-c
display: "Protocol Buffers C implementation"
description: "Protocol Buffers implementation in C (libprotobuf-c runtime)"
category: serialization
homepage: "https://github.com/protobuf-c/protobuf-c"
license: BSD-2-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "构建走上游 build-cmake/ 子目录的 CMake 工程（与已合入的 1.5.2 一致）"
    - "上游 11 个官方测试程序的 .pb-c.[ch] 夹具 tarball 与 git 都没有，必须用 protoc + 自编 protoc-gen-c 现场生成 → protobuf 只作 build context 依赖"
    - "上游 CMake 只登记了 11 个测试中的 6 个，且 test-full-cxx-output.inc 规则把 \">file\" 当参数传；两处都在本配方里补做"
    - "CMake Release 自带 -DNDEBUG 会把上游 assert() 全编译掉，需覆盖 CMAKE_C_FLAGS_RELEASE"

versions:
  "1.5.1":
    status: built
    build_date: "2026-09-22"
  "1.5.2":
    status: built
    build_date: "2026-08-08"
