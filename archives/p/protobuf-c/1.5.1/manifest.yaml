software: protobuf-c
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-22"

# 构建系统（顶层字段，用于自检）
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://codeload.github.com/protobuf-c/protobuf-c/tar.gz/refs/tags/v1.5.1"

  # 源码校验和
  sha256: "f3046f94ef6f85cf4311f6c4c51e2095c381ce7bb7fd4f90ea8d9cd99fca3c04"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DBUILD_PROTOC=ON"
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DCMAKE_C_FLAGS_RELEASE=-O2"
    - "-DCMAKE_CXX_FLAGS_RELEASE=-O2"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - protobuf/3.17.3
  # protobuf 只作为 build context 依赖（tool_requires）：它的 protoc 与本仓库
  # 编译出来的 protoc-gen-c 插件负责生成上游测试需要的 *.pb-c.[ch] 夹具。
  # 发布的 libprotobuf-c 不链接 protobuf，消费者不需要它。

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-build-cmake-add-upstream-tests.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 build-cmake/CMakeLists.txt 只登记了 Makefile.am TESTS 11 个程序中的 6 个，issue204/330/375/440/745 从未被 CMake 构建（补丁 0001 补齐）"
  - "上游 CMake 的 test-full-cxx-output.inc 规则把 \">file\" 当参数传给 cxx-generate-packed-data，不是 shell 重定向，文件永远不生成 → test-generated-code2 编不过；必须在构建阶段按 Makefile.am 的做法自己跑一次"
  - "11 个 .pb-c.[ch] 夹具在 release tarball 与 git tag 中都不存在（Makefile.am 的 dist-hook 显式删除），只能由 protoc + protoc-gen-c 现场生成"
  - "CMake 的 Release flags 自带 -DNDEBUG，会把上游 t/ 里所有 assert() 编译掉；本项目用 CMAKE_C_FLAGS_RELEASE=-O2 覆盖以保留断言"
  - "protoc-gen-c 只在构建期使用，package() 删掉 bin/，否则库包里混入 CLI 产物"

patch_generation:
  method: per-file-difflib
  patches_count: 1

patch_classification:
  - file: 0001-build-cmake-add-upstream-tests.patch
    type: auto
    platform_only: False
    guard: 'pending'
