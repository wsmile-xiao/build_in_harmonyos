# conandata.yml — protobuf-c 1.5.1

sources:
  # github.com times out from the HarmonyOS device, so use the codeload archive
  # of the same tag: it differs only in the autotools-generated files
  # (configure, Makefile.in, build-aux/, m4/ libtool macros) that this CMake
  # build never touches -- verified byte-identical for build-cmake/, protobuf-c/,
  # protoc-gen-c/ and t/.
  url: "https://codeload.github.com/protobuf-c/protobuf-c/tar.gz/refs/tags/v1.5.1"
  sha256: "f3046f94ef6f85cf4311f6c4c51e2095c381ce7bb7fd4f90ea8d9cd99fca3c04"
  # The URL ends in the tag name, so conan's get() would hand the file to the
  # zip reader and die with BadZipFile without an explicit archive name.
  filename: "protobuf-c-1.5.1.tar.gz"

patches:
  - patch_file: "patches/0001-build-cmake-add-upstream-tests.patch"
    patch_description: "0001 build-cmake: register the 5 upstream TESTS programs that only Makefile.am knows about"
    patch_type: "portability"
