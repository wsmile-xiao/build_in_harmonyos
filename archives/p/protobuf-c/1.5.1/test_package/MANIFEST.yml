# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: protobuf-c/1.5.1
homepage: "https://github.com/protobuf-c/protobuf-c"

# 上游测试命令：Makefile.am 的 TESTS 由 automake 驱动
# 上游用例数取数（顶层 Makefile.am 的 8 个 `TESTS +=` 块，行 147/224/241/258/275/301/318/335）：
#   grep -n '^TESTS' Makefile.am            -> 1 个空声明 + 8 个 TESTS += 块
#   块内条目去重后共 11 个 t/... 程序（见下方 upstream_tests），与本配方 ctest 实跑的 11 个一致
# 本配方在 build() 里用 ctest 跑同一批测试程序（上游 config.status 在
# HarmonyOS PC 上 EACCES，且上游 CMake 只登记了 11 个中的 6 个，见 patch 0001）
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --timeout 120 (run from the recipe's build() phase)"

# 上游实际运行的测试程序（11 个，与顶层 Makefile.am 的 TESTS 一一对应）
upstream_tests:
  - file: t/generated-code/test-generated-code.c
    description: "proto2 round-trip: pack/unpack/get_packed_size against t/test.pb-c.c"
    command: "./test-generated-code"
  - file: t/generated-code2/test-generated-code2.c
    description: "full-coverage round-trip against t/test-full.pb-c.c + t/test-optimized.pb-c.c and the C++-produced packed fixtures"
    command: "./test-generated-code2"
  - file: t/generated-code/test-generated-code.c
    description: "same suite compiled with -DPROTO3 against t/test-proto3.pb-c.c"
    command: "./test-generated-code3"
  - file: t/version/version.c
    description: "PACKAGE_VERSION / PROTOBUF_C_VERSION(_NUMBER) agree with the runtime accessors"
    command: "./test-version"
  - file: t/issue204/issue204.c
    description: "regression #204（断言见源码）"
    command: "./test-issue204"
  - file: t/issue220/issue220.c
    description: "regression #220（断言见源码）"
    command: "./test-issue220"
  - file: t/issue251/issue251.c
    description: "regression #251（断言见源码）"
    command: "./test-issue251"
  - file: t/issue330/issue330.c
    description: "regression #330，并链入 t/issue389 的生成码（上游 Makefile.am 即如此）"
    command: "./test-issue330"
  - file: t/issue375/issue375.c
    description: "regression #375（断言见源码）"
    command: "./test-issue375"
  - file: t/issue440/issue440.c
    description: "regression #440（断言见源码）"
    command: "./test-issue440"
  - file: t/issue745/issue745.c
    description: "regression #745（断言见源码）"
    command: "./test-issue745"

# 测试夹具的前置条件（不是本库的测试，是上游生成代码链）
upstream_test_prerequisites:
  - "11 个 .pb-c.[ch] 夹具由 protoc + 本仓库自己编译出来的 protoc-gen-c 插件现场生成：release tarball 与 git tag 里都没有这些文件，Makefile.am 的 dist-hook 显式删除它们"
  - "t/generated-code2/test-full-cxx-output.inc 由 cxx-generate-packed-data（C++/libprotobuf）生成；上游 CMake 的 add_custom_command 把 \">file\" 当参数传，从不产生该文件，故由 conanfile.build() 补做（等价于 Makefile.am 的同名规则）"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试：版本字符串/编号、ProtobufCBufferSimple 扩容与realloc归属、枚举描述器按号/按名二分查找"
    command: "./test_protobuf_c"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 14
