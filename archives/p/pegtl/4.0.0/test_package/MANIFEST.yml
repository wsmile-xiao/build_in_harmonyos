# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pegtl/4.0.0
homepage: "https://github.com/taocpp/pegtl"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（257 个独立 pegtl-test-* 可执行，详见 reports/upstream-test-ledger.md）
upstream_tests:
  - file: src/test/CMakeLists.txt
    source: pegtl-4.0.0/src/test/CMakeLists.txt
    description: "上游测试注册清单：257 个独立用户用例（每个 .cpp 一个 pegtl-test-* 可执行）"
    command: "ctest -N"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package_consumer.cpp
    description: "消费者用例：仅通过公开头文件 tao/pegtl.hpp 与公开 API 解析键=值配置并断言结果"
    command: "./test_pegtl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 257

# 双口径台账（完整统计见 reports/upstream-test-ledger.md）
double_caliber:
  source_declared_total: 257
  configured_executable_total: 257
  executed_passed_total: 257
  failed: 0
  not_run: 0
  full_pass_rate: "257/257 (100%)"