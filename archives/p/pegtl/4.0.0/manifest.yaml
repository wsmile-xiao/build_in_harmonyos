software: pegtl
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 预编译包
package:
  name: pegtl-4.0.0-ohos-aarch64.tar.gz
  size: 1009KB
  sha256: "28cf48d3f6a2e99676e4c72e10d1ced55a00ded21d57832ce539abbdf5654313"

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/taocpp/pegtl/archive/refs/tags/4.0.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DPEGTL_BUILD_TESTS=OFF"
    - "-DPEGTL_BUILD_EXAMPLES=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
