# 版本级 manifest
# 文件位置: archives/p/prover9/2017-11A/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2017-11a"  # conan slug（CI L0m-5 全小写）；上游版本字符串为 2017-11A (LADR-2017-11A)

# 软件名
software: "prover9"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-07"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（R39：官方站 cs.unm.edu 不可达，ai4reason 承载末代维护人
  # Bob Veroff 的 LADR-2017-11A 延续线，为权威镜像源）
  url: "https://github.com/ai4reason/Prover9/archive/cdca95a51d3c3459b8fd2ebbb5ac1504be2172e3.tar.gz"

  # 源码校验和
  sha256: "3a2f7a15367a8a438db0a08349a42204b5a4f08002bd84c29fd202eba1a56f04"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（无 configure，纯手搓递归 Makefile）
  configure_options: []

  # 编译依赖列表（格式: name/version）— 零依赖，纯 C + libc
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（0 补丁，仅命令行变量覆盖）
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识（ref: 指向本 PR 提交的知识草稿 knowledge/drafts/E999-draft-*.kv）
knowledge_gained:
  - "上游为手搓递归 Makefile（无 autoconf/configure），init-build 误判 autotools 需纠正，配方用自定义 build()（ref: E999-draft-66AE 草稿）"
  - "make all -j1 CC=clang XFLAGS='-fPIC -O2' 一次通过；-j2 触发上游 install 目标并行竞态（apps.src 与 provers.src 争抢 ../bin/），必须串行（ref: E999-draft-B839 草稿）"
  - "43 个产物全部落在源码树 bin/，无 include/lib，package_type=application，策略 B 手动 package() 布局（ref: R19/R20 v3.0 配方模式）"
  - "prooftrans 断 PROOF 段而非 THEOREM PROVED 横幅（后者是 prover9 的输出行）（ref: R34 消费者测试断言口径）"
  - "上游版本字符串 2017-11A 含大写，conan 引用 must be all lowercase：目录/分支/引用三处小写化为 2017-11a；本机 HMDFS 大小写不敏感，仅差大小写改名须两步中转（ref: E999-draft-35E4 草稿）"
  - "上游官方站死亡（cs.unm.edu 不可达，McCune 2023 去世）按 R39 四步论证链认定 ai4reason 承继仓 archive commit 为源（ref: E999-draft-A90F 草稿）"
