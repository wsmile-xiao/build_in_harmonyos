# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: prover9/2017-11a
homepage: "https://github.com/ai4reason/Prover9"

# 上游测试命令 (顶层 Makefile 自带 test1/test2/test3 自测目标)
upstream_check_command: "make test1 test2 test3"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test1 test2 test3"

# 上游实际运行的测试程序 (顶层 Makefile test1/test2/test3)
upstream_tests:
  - file: prover9.examples/x2.in
    source: prover9-2017-11A/prover9.examples/x2.in
    description: "prover9 限时证明群论定理（由左单位元+左逆元+结合律+幂等推出交换性），管道经 prooftrans parents_only，16 步证明"
    command: "make test1"
  - file: mace4.examples/group2.in
    source: prover9-2017-11A/mace4.examples/group2.in
    description: "mace4 搜索非交换群最小模型（域 2-6 迭代），6 元群模型，管道经 interpformat tabular"
    command: "make test2"
  - file: apps.examples/qg.in
    source: prover9-2017-11A/apps.examples/qg.in
    description: "mace4 拟群枚举（-n3 -m -1），管道经 interpformat + isofilter，5 个 interpretation"
    command: "make test3"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_prover9.py
    description: "消费者测试：--version 冒烟 + prover9 限时定理证明（THEOREM PROVED）+ mace4 有限模型搜索（Interpretation of size 6）+ prooftrans 转换（PROOF 段）"
    command: "python3 test_prover9.py <bindir>"

# 测试断言总数 (test_prover9.py 中 Results.check() 调用数)
assertion_count: 11
