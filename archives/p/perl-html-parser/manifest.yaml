software: perl-html-parser
display: "HTML::Parser"
description: "Perl module for parsing HTML documents with event-driven interface"
category: data

homepage: "https://metacpan.org/pod/HTML::Parser"
license: "Artistic-1.0-Perl OR GPL-1.0-or-later"

build_system: perl

ohos_adaptation:
  key_points:
    - "Perl XS 模块需要特殊链接参数 -nostartfiles -nodefaultlibs"
    - "必须设置 CPATH=/storage/Users/currentUser/usr/local/include（musl 头文件）"
    - "XS 模块用户目录无法加载（SELinux HMDFS hmdfs:s0）"
    - "通过 cmd-pkgs 公共安装脚本安装后可获得正确标签 hnp_file:s0"
  known_issues:
    - "XS 模块用户空间无法加载（Permission denied）"
    - "依赖 HTML::Tagset、HTTP::Headers、URI 需额外安装"
  resolution:
    - "预编译包上库后，用户通过 cmd-pkgs 公共安装脚本安装"
    - "安装后 XS 模块自动获得 hnp_file:s0 标签，可正常加载"
    - "验证命令: perl -MHTML::Parser -e 'print $HTML::Parser::VERSION'"
  common_dependencies:
    - HTML-Tagset
    - HTTP-Message
    - URI
    - Clone

versions:
  "3.83-r1":
    status: built
    build_date: "2026-06-11"
    functional_test: "用户空间受限（SELinux HMDFS）"
    test_date: "2026-06-11"
    verification_method: "上库后用户通过 cmd-pkgs 安装验证"
    patches_applied: []
    notes: "编译成功，SELinux HMDFS 限制可通过 cmd-pkgs 公共安装脚本解决"