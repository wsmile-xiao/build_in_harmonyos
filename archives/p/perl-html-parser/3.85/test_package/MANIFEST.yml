# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-html-parser/3.85
homepage: "https://metacpan.org/dist/HTML-Parser"

# 上游测试命令 — HTML-Parser 自带 t/ 测试套件（ExtUtils::MakeMaker `make test`）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（实测 2026-08-16，OHOS 环境）：
# - t/ 目录 50 个 .t 测试文件（t/free.t、t/cases.t、t/dtext.t、
#   t/magic.t、t/filter.t 等）
# - make test 运行（部分测试需网络/外部服务，受限环境按实际运行情况记录）
upstream_tests:
  - file: t/
    source: HTML-Parser-3.85/t/
    description: "上游 Perl 测试套件（50 个 .t 文件，make test 运行）"
    command: "make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_html_parser.py
    description: "消费者测试：加载 HTML::Parser（版本 3.85 精确校验）+ 真实 HTML 解析（R34，handler 触发）"
    command: "python3 test_html_parser.py <site_perl-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
