software: perl-html-parser
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.83-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.83-r1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/HTML-Parser-3.83.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "HTML-Tagset/3.24"
    - "Clone/0.46"
    - "HTTP-Message/6.46"
    - "URI/5.31"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

  # 特殊编译参数（用于 Perl XS 模块）
  special_flags:
    cpath: "/storage/Users/currentUser/usr/local/include"
    library_path: "/storage/Users/currentUser/usr/local/lib"
    other_ldflags: "-nostartfiles -nodefaultlibs"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 预编译包信息
# ============================================================

packaging:
  tarball: "perl-html-parser-3.83-r1-ohos-aarch64.tar.gz"
  size: "159K"
  contents:
    - "Parser.so (XS 模块, 57KB)"
    - "HTML/*.pm (7 个纯 Perl 模块)"
    - ".packlist"
    - "perllocal.pod"
  install_method: "cmd-pkgs 公共安装脚本"
  install_command: "curl install.sh | sh -s -- perl-html-parser 3.83-r1"
  readme: "packaging/README.txt"
  e078_status: "不是问题（与系统 XS 模块配置一致）"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块需要特殊链接参数 -nostartfiles -nodefaultlibs"
  - "CPATH 必须设置为 musl 头文件路径"
  - "XS 模块在 HMDFS 上无法加载，需管理员安装到系统目录"
  - "Parser.so 存在 E078 风险：BIND_NOW 无 NEEDED（缺少 libperl 链接）"

# ============================================================
# 功能测试结果
# ============================================================

functional_test:
  test_date: "2026-06-11"
  verdict: "用户空间受限"
  results:
    xs_module_loading_user: "FAIL - SELinux HMDFS Permission denied"
    xs_module_loading_system: "PASS - 通过 cmd-pkgs 安装后可正常加载"
    e078_bind_now: "PASS - 与系统 XS 模块配置一致"
    elf_integrity: "PASS - Parser.so 58KB 编译完整"
  selinux_limitation: "用户目录 hmdfs:s0 无法加载，cmd-pkgs 安装后 hnp_file:s0 可加载"
  resolution: "预编译包上库后，用户通过 cmd-pkgs 公共安装脚本安装即可验证"
  verification_flow:
    - "预编译包上库到 cmd-pkgs"
    - "用户执行: curl install.sh | sh -s -- perl-html-parser 3.83-r1"
    - "验证: perl -MHTML::Parser -e 'print $HTML::Parser::VERSION'"
    - "验证成功后状态升级为 published"
