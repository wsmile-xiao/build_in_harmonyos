# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-html-parser/3.83-r1
homepage: "https://metacpan.org/pod/HTML::Parser"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/01-version.t
    source: HTML-Parser-3.83/t/01-version.t
    description: "Version check test"
    command: "perl -Mblib t/01-version.t"
  - file: t/03-comment.t
    source: HTML-Parser-3.83/t/03-comment.t
    description: "Comment parsing test"
    command: "perl -Mblib t/03-comment.t"
  - file: t/14-callbacks.t
    source: HTML-Parser-3.83/t/14-callbacks.t
    description: "Callback interface test"
    command: "perl -Mblib t/14-callbacks.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_html_parser.sh
    description: "消费者测试：加载 HTML::Parser 模块并调用 parse HTML + encode/decode entities API"
    command: "sh test_html_parser.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
