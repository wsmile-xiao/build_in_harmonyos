# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "perl-module-refresh 是纯 Perl 模块，无需任何源码修改即可在 OpenHarmony 平台编译运行"
  - "纯 Perl 模块不受 SELinux HMDFS 限制，与 XS 模块（如 perl-dbd-pg）不同，可直接从用户目录加载"
  - "Perl 5.42 的 $^P |= 0x10 调试标志正常工作，%DB::sub 符号表追踪功能正常"
  - "HMDFS 文件系统的 stat() 返回正确的 mtime，Module::Refresh 的文件变更检测功能正常"
  - "Perl 编译器缓存直接函数调用（编译时绑定），refresh 后方法调用（$obj->method）能正确看到刷新后的值"
  - "Path::Class 作为测试依赖需要通过 CPAN 安装"
