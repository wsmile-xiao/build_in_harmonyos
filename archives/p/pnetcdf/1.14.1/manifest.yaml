software: pnetcdf
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.14.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.14.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://parallel-netcdf.github.io/Release/pnetcdf-1.14.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--build=aarch64-unknown-linux-gnu"
    - "--disable-cxx"
    - "--disable-fortran"
    - "MPICC=/storage/Users/currentUser/usr/local/bin/mpicc"
    - "MPICXX=/storage/Users/currentUser/usr/local/bin/mpicxx"
    - "MPIF90="
    - "MPIF77="

  # 编译依赖列表（格式: name/version）
  dependencies:
    - mpich/4.0.3

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pnetCDF 需要 MPI 库支持（MPICH 或 OpenMPI）"
  - "在 HMDFS 受限环境下需要在不受限目录运行 configure"
  - "禁用 C++ 和 Fortran 绑定可减少编译时间和依赖"
patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/pnetcdf-1.14.1.orig
  source_work_dir: /storage/Users/currentUser/builds/pnetcdf-1.14.1.work
  source_orig_hash: 0346edf0790a7d5c
  source_work_hash: 7f0798254bb431e8
  generated_at: '2026-06-11T18:47:07'
  patches_count: 1

patch_classification:
  - file: 0001-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
