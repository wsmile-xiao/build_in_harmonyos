software: pnetcdf
# 软件级 manifest 模板
# 文件位置: archives/p/pnetcdf/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: pnetcdf

# 软件描述
description: "Parallel NetCDF - Parallel I/O library for NetCDF format"

# 软件分类
# library | tool | application | framework
category: library

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间排序，最新在前）
versions:
  - version: "1.14.1"
    status: built
    build_date: "2026-06-11"
    notes: "首次成功编译，需要 MPICH 4.0.3 依赖"

# ============================================================
# 外部链接
# ============================================================

# 官方网站
website: "https://parallel-netcdf.github.io/"

# 文档链接
documentation: "https://parallel-netcdf.github.io/wiki/"

# 源码仓库
repository: "https://github.com/Parallel-NetCDF/PnetCDF"

# ============================================================
# 依赖信息
# ============================================================

# 运行时依赖
runtime_dependencies:
  - mpich/4.0.3

# 构建时依赖（通常与运行时依赖相同）
build_dependencies:
  - mpich/4.0.3

# ============================================================
# 特殊说明
# ============================================================

# 平台适配要点
platform_notes:
  - "需要 MPI 库支持（MPICH 或 OpenMPI）"
  - "在 HMDFS 环境下需要在不受限目录运行 configure"
  - "禁用 C++ 和 Fortran 绑定可减少编译时间"