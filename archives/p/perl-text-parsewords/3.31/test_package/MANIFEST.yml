# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-text-parsewords/3.31
homepage: "https://metacpan.org/pod/Text::ParseWords"

# 上游测试命令 — Text::ParseWords 上游 t/ 测试套件（make test）
upstream_check_command: "perl Makefile.PL && make && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - t/ 目录：ParseWords.t + taint.t（2 个 .t 测试文件）
# - 实测结果：**Files=2, Tests=29, All tests successful（100%）**——
#   全部测试真实运行通过，无受阻无失败
upstream_tests:
  - file: t/
    source: Text-ParseWords-3.31/t/
    description: "上游 perl 测试套件（2 文件 29 用例；实测 29/29 100% 通过，无受阻无失败）"
    command: "perl Makefile.PL && make && make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_parsewords.pl
    description: "消费者测试：真实 API（R34）——quotewords/shellwords 解析（上游 t/ParseWords.t 核心用法）"
    command: "perl test_parsewords.pl <site-perl-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
