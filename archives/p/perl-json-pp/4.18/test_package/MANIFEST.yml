# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-json-pp/4.18
homepage: "https://metacpan.org/pod/JSON::PP"

# 上游测试命令 — JSON::PP 上游 t/ 测试套件（make test）
upstream_check_command: "perl Makefile.PL && make && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - t/ 目录：65 个 .t 测试文件（010_pc_keysort/099_binary*/incr_parse 等）
# - 实测结果：**Files=65, Tests=25891, All tests successful（100%）**——
#   全部测试真实运行通过，无受阻无失败
upstream_tests:
  - file: t/
    source: JSON-PP-4.18/t/
    description: "上游 perl 测试套件（65 文件 25891 用例；实测 25891/25891 100% 通过，无受阻无失败）"
    command: "perl Makefile.PL && make && make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_jsonpp.pl
    description: "消费者测试：真实 API（R34）——JSON::PP decode/encode round-trip（上游 t/ 核心用法）"
    command: "perl test_jsonpp.pl <site-perl-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
