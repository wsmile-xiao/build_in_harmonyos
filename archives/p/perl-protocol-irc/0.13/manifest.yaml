software: perl-protocol-irc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.13"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Protocol-IRC-0.13.tar.gz"

  # 源码校验和
  sha256: "3748deec2457dec9e2755afddf67ade0961403a4acf94df8fe2d5ec5012337f4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "原始源码使用 Module::Build (Build.PL)，平台未安装 Module::Build，需创建 Makefile.PL 使用 ExtUtils::MakeMaker"
  - "conanfile.py 的 build() 方法应自动检测 Makefile.PL 是否存在，不存在则动态创建"
  - "Perl 模块 package_info 应设置 cpp_info.libs=[] 和 runenv_info PERL5LIB 路径"
  - "可选测试依赖 (Test::Fatal, Future) 未安装不影响模块核心功能，测试跳过可接受"
  - "纯 Perl 模块无 C/XS 编译，无需静态链接检查，G3/L4 门禁自动跳过"
  - "conanfile.py generate() 方法包含 AutotoolsToolchain 静态链接配置，但纯 Perl 模块无二进制产物"
  - "功能测试覆盖 150 项，包括 IRC 消息解析、IRCv3 标签、门控机制、合成事件、ISUPPORT 处理、MODE 解析等"
