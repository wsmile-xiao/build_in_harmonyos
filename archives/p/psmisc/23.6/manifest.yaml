software: psmisc
version: 23.6
category: utils
status: partial
description: Process management utilities (pstree, killall, fuser, etc.)
website: https://gitlab.com/psmisc/psmisc
dependencies:
  - ncurses
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - --build=aarch64-linux-gnu
build_system: autotools
compiler: clang
notes: |
  Manual compilation required due to HMDFS permission issues.
  Created config.h manually and compiled pstree with:
    clang -include config.h -I~/usr/local/include -L~/usr/local/lib -o pstree src/pstree.c -lncursesw
  
  Platform limitations discovered:
  - /proc/uptime not accessible (Permission denied)
  - HMDFS temp file creation issues