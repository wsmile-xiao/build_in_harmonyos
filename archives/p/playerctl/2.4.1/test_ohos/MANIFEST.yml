# test_ohos/MANIFEST.yml — playerctl 2.4.1 HarmonyOS PC 消费者专项用例（适配方新增）
#
# 背景（R51）：上游 playerctl 的自动化测试是 test/ 下的 pytest 套件（18 用例），
# 运行前提是真实可用的 D-Bus session bus（test/conftest.py 用 dbus-launch 拉起，
# 再向该 bus export org.mpris.MediaPlayer2.<name> 服务）。OHOS 构建/CI 沙箱无
# machine-id、/etc 与 /var 只读、无 dbus-daemon 服务目录，pytest 套件无法在其中
# 执行。故适配后新增本组自包含消费者用例，直接消费最终 Conan 包验证产物可用性。
#
# 运行方式（无需 session bus / pytest / 网络）：
#   python3 test_ohos/run_ohos_test.py <conan_package_folder> [glib_package_folder]
#   glib 省略时自动在 conan 缓存探测，可用 PLAYERCTL_GLIB_FOLDER 显式指定。

runner: run_ohos_test.py
invocation: "python3 test_ohos/run_ohos_test.py <conan_package_folder> [glib_package_folder]"
exit_code: "0=全部通过；1=有失败（打印首个失败详情）；2=用法错误"

checks:
  - id: T1_aarch64_elf
    desc: "bin/playerctl、bin/playerctld、lib/libplayerctl.so.2.4.1 均为 ELF64 AArch64"
    command: "readelf -h <each elf>"
  - id: T2_musl_no_glibc
    desc: "musl libc：NEEDED 无 GLIBC 符号版本、无 ld-linux；含 libc.so"
    command: "readelf -d <each elf>"
  - id: T3_codesign
    desc: ".codesign 段存在（OHOS 签名管线产出，三个 ELF 均需有）"
    command: "readelf -S <each elf>"
  - id: T4_no_host_paths
    desc: "动态段无 RPATH/RUNPATH；strings 无宿主绝对路径泄漏（/storage//Users//data/storage//home//playerctl-2.4.1）"
    command: "readelf -d + strings <each elf>"
  - id: T5_so_alias_materialized
    desc: "libplayerctl.so / libplayerctl.so.2 已物化为常规文件且与 libplayerctl.so.2.4.1 同尺寸（构建沙箱不支持 symlinkat）"
    command: "os.path.isfile + os.path.islink + getsize"
  - id: T6_pkgconfig_metadata
    desc: "lib/pkgconfig/playerctl.pc 的 Name=Playerctl、Version=2.4.1、Libs 含 -lplayerctl"
    command: "解析 <pkg>/lib/pkgconfig/playerctl.pc"
  - id: T7_cli_real_execution
    desc: "真实执行安装后的 CLI：bin/playerctl --version 输出 v2.4.1、--help 含 'Controller for media players'、bin/playerctld --help 含 'Playerctl Daemon'，三者 exit 0"
    command: "<pkg>/bin/playerctl --version | --help ; <pkg>/bin/playerctld --help"
  - id: T8_linked_consumer
    desc: "真实编译+链接+运行 C 消费者（只经公开头 <playerctl/playerctl.h> 与 -lplayerctl -lgobject-2.0 -lglib-2.0）：版本宏契约、PlayerctlPlayerName boxed 类型注册、PlayerctlSource GEnum 注册、playerctl_player_name_copy() 深拷贝语义、free() 后正常返回"
    command: "clang -I<pkg>/include -I<glib>/include[-/glib-2.0|-/lib/glib-2.0/include] <src> -L<pkg>/lib -L<glib>/lib -lplayerctl -lgobject-2.0 -lglib-2.0 -lm 然后运行"

assertion_count: 57
assertion_count_note: >-
  机器级 49 条：T1 3（每 ELF 1）+ T2 6（每 ELF 2：无 GLIBC/ld-linux + 有 libc.so）
  + T3 3 + T4 21（每 ELF 2 个动态段关键字 + 5 个宿主路径模式）+ T5 7（3 常规文件
  判定 + 3 尺寸读取 + 1 尺寸相等）+ T6 3（Name/Version/Libs）+ T7 6（3 用例 ×
  退出码与输出关键字）；消费者程序内 8 条：T8 的 7 个失败返回点 + 1 个 PASS 标记。

test_language: c + python
test_framework: bare
framework_flavor: bare
session_bus_required: false
network_required: false
