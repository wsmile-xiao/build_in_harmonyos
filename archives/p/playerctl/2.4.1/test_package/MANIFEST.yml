# test_package/MANIFEST.yml — playerctl 2.4.1
# CI L0e 要求本文件存在；同时按 TEST_QUALITY_SPEC §4.3 声明上游测试来源。

package: playerctl/2.4.1
homepage: "https://github.com/altdesktop/playerctl"

# ── 上游测试命令（清点见 notes.md「R51 上游测试申报表」） ───────────────────
# 上游 Makefile:
#   test:
#       dbus-run-session python3 -m pytest -sq
# 上游 pytest.ini: timeout = 5（pytest-timeout）
# 上游 requirements.txt: dbus-next, meson, pytest, pytest-timeout, pytest-asyncio
# 上游 meson.build 无 test() 注册（subdir 仅 playerctl/data/doc，共 7 个构建目标），
# 故 `meson test` 目标为空；上游自动化测试全部在 test/ 目录的 pytest 套件内。
upstream_check_command: "make test  # => dbus-run-session python3 -m pytest -sq"
upstream_test_in_build: false
upstream_test_command: "dbus-run-session python3 -m pytest -sq   # test/, 18 用例"

# conanfile.py 的 build() 内未集成上游测试：上游 pytest 套件要求一个真实可用的
# D-Bus session bus —— test/conftest.py 用 asyncio.create_subprocess_shell('dbus-launch')
# 拉起（依赖 machine-id 与可写 /var），test/mpris.py 再向该 bus export
# org.mpris.MediaPlayer2.<name> 服务；此外还需 pytest / pytest-asyncio / dbus-next。
# OHOS 构建沙箱不具备这些条件（无 machine-id、/etc 与 /var 只读、无 system bus），
# 故按 TEST_QUALITY_SPEC §3.3 声明豁免，改由适配方在具备 session bus 的运行环境
# 独立执行并如实回填实测结果（notes.md R51 申报表：18 用例 / 11 通过 / 7 失败）。
upstream_test_exemption: >-
  上游 18 个 pytest 用例需 D-Bus session bus + pytest-asyncio + dbus-next；
  OHOS 构建沙箱无 machine-id、/etc 与 /var 只读、无 dbus-daemon 服务目录，
  conan build() 内无法拉起 session bus。已在具备 session bus 的环境实跑并
  逐项回填结果与失败根因（notes.md）。

upstream_tests:
  - file: test/test_basics.py
    source: playerctl-2.4.1/test/test_basics.py
    description: "test_basics / test_list_names / test_system_list_players / test_queries"
    command: "dbus-run-session python3 -m pytest -sq test/test_basics.py"
  - file: test/test_commands.py
    source: playerctl-2.4.1/test/test_commands.py
    description: "test_commands（命令字面量与播放器交互）"
    command: "dbus-run-session python3 -m pytest -sq test/test_commands.py"
  - file: test/test_daemon.py
    source: playerctl-2.4.1/test/test_daemon.py
    description: "test_daemon_commands / _follow / _shift_simple / _shift_no_player / test_active_player_change"
    command: "dbus-run-session python3 -m pytest -sq test/test_daemon.py"
  - file: test/test_follow.py
    source: playerctl-2.4.1/test/test_follow.py
    description: "test_follow / _selection / _selection_any / _all_players"
    command: "dbus-run-session python3 -m pytest -sq test/test_follow.py"
  - file: test/test_format.py
    source: playerctl-2.4.1/test/test_format.py
    description: "test_emoji / test_format（--format 模板展开）"
    command: "dbus-run-session python3 -m pytest -sq test/test_format.py"
  - file: test/test_selection.py
    source: playerctl-2.4.1/test/test_selection.py
    description: "test_selection / test_daemon_selection（活动播放器选择）"
    command: "dbus-run-session python3 -m pytest -sq test/test_selection.py"

upstream_tests_declared: 18
upstream_tests_executed: 18
upstream_tests_passed: 11
upstream_tests_failed: 7
upstream_tests_skipped: 0

# ── test_package 自带验证（消费者视角） ──────────────────────────────────
test_package_tests:
  - file: test_playerctl.c
    description: >-
      14 条断言 / 退出码硬约束：A1-A3 版本宏契约；B1-B3 公共 GObject 类型注册
      （PlayerctlPlayerName boxed / PlayerctlSource GEnum）；C1-C6
      playerctl_player_name_copy() 深拷贝与 free()；D1-D7 真实执行安装后的
      bin/playerctl --version|--help 与 bin/playerctld --help。
    command: "conan create 内 test_package 阶段自动编译、链接、运行（conanrun 环境）"

# 断言数：A 3 + B 3 + C 6 + D 7 = 19 条运行时断言；另有编译期/链接期约束
# （公开头 include、-lplayerctl 链接成功）作为前置硬约束。
assertion_count: 19
assertion_count_note: "A1-A3 + B1-B3 + C1-C6 + D1-D7 = 19 运行时断言；失败即非零退出"

# ── 鸿蒙专项测试（适配方新增的消费者用例，非上游内容） ────────────────────
ohos_test_dir: test_ohos/
ohos_test_runner: test_ohos/run_ohos_test.py
ohos_test_note: >-
  适配后新增的鸿蒙消费者用例集合，自包含可直接执行：
  python3 test_ohos/run_ohos_test.py <conan_package_folder>。
  逐项清单与断言数见 test_ohos/MANIFEST.yml。
