software: playerctl
# 版本级 manifest（ARCHIVE-SPEC v2.0）
# 文件位置: archives/p/playerctl/2.4.1/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "2.4.1"

# 编译状态
# published | built | failed | archived
# built: conan-verify / W3 本地模拟全绿；upload 由 PR 合并 main 后的 CI 执行（R29）
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"

# 构建系统
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/altdesktop/playerctl/archive/refs/tags/v2.4.1.tar.gz"
  sha256: "75957ad5071956f563542c7557af16a57e40b4a7f66bc9b6373d022ec5eef548"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: meson
  configure_options:
    - "-Dintrospection=false"
    - "-Dgtk-doc=false"
    - "-Dbash-completions=false"
    - "-Dzsh-completions=false"
    - "-Dwrap_mode=nodownload"
  dependencies:
    - glib/2.84.0.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 源码零补丁：上游仅依赖 GLib/GObject/GIO(gio-unix-2.0)，无 gudev / 无 Linux
# 专有 syscall / 无 glibc 专有宏。全部适配均落在 conanfile.py 内
# （run() 改写 meson 解释器形式、.so 别名物化、ELF 自签）。
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "E232 泛化到 meson：conan Meson helper 把命令硬编码为 `meson <args>`，OHOS 下 exec HMDFS 上的 bin/meson（#!/bin/sh）报 Permission denied + Error 126；配方 run() 内改写为 `<python> <meson.py> <args>` 即通过（实测唯一可用的 shebang 解释器是 conan 侧 python3） (ref: DRAFT-PLAYERCTL-2.4.1-MESON-HELPER-SHEBANG-RUN-REWRITE)"
  - "conan Meson helper 方法名为 configure()/build()/install()，不存在 compile() (ref: DRAFT-PLAYERCTL-2.4.1-MESON-HELPER-SHEBANG-RUN-REWRITE)"
  - "glib 公开头需 -I<prefix>/include/glib-2.0 -I<prefix>/lib/glib-2.0/include；conan 组件化包在根 cpp_info 不暴露目录，消费者 test_package 必须补齐 (ref: DRAFT-PLAYERCTL-2.4.1-GLIB-HEADERS-CPP-INFO-LAYOUT)"
  - "上游 pytest 套件需 D-Bus session bus（dbus-launch 拉起 + 向 bus export org.mpris.MediaPlayer2.<name>），OHOS 构建沙箱无 machine-id 且 /etc、/var 只读 → 按 TEST_QUALITY_SPEC §3.3 声明豁免并独立实跑 (reference: test_package/MANIFEST.yml 豁免声明；失败逐项归因另见 knowledge/drafts/DRAFT-PLAYERCTL-2.4.1-GLIB-GOBJECT-BIT-UNLOCK-ASSERT-OHOS-MUSL)"
