software: playerctl
display: "playerctl"
description: "MPRIS media player controller (playerctl CLI + playerctld daemon + libplayerctl)"
category: multimedia
homepage: "https://github.com/altdesktop/playerctl"
license: LGPL-3.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "glib/2.84.0.1 共享库（GObject 类型系统一致性）；gio-unix-2.0 转发 .pc 生成层"
    - "禁用 introspection/gtk-doc/bash-completions/zsh-completions（OHOS worker 无 g-ir-scanner / gtkdoc-scan，属绑定与文档产物）"
    - "OHOS 无法 exec HMDFS 上的 shebang 脚本（E232/E055，Error 126）→ 配方覆写 run()，把 conan Meson helper 硬编码的 `meson <args>` 改写为 `<python> <meson.py> <args>`"
    - "构建沙箱不支持 symlinkat/linkat（仅 cp/copy2 可用）→ meson install 跳过全部符号链接，libplayerctl.so / libplayerctl.so.2 由实体文件物化补齐"
    - "安装后 llvm-objcopy 剥旧 .codesign + binary-sign-tool 自签全部 ELF（bin/ ×2 + lib/ ×3）"
    - "上游 pytest 套件（18 用例）需 D-Bus session bus，构建沙箱不可用 → 按 TEST_QUALITY_SPEC §3.3 豁免并在具备 session bus 的环境独立实跑，另新增 test_ohos 消费者用例"
  common_dependencies:
    - glib/2.84.0.1

versions:
  "2.4.1":
    status: built
    build_date: "2026-09-25"
    knowledge_gained:
      - "E232 泛化到 meson：conan Meson helper 硬编码 `meson <args>`（conan/tools/meson/meson.py 无挂钩），OHOS 下须在配方 run() 内改写为 `<python> <meson.py> <args>`；实测唯一可用的 shebang 解释器是 conan 侧的 python3"
      - "HMDFS 不支持 symlinkat/linkat：meson install 打印 'Symlink creation does not work on this platform. Skipping all symlinking.'，须在 package() 用 shutil.copy2 把 libX.so / libX.so.<major> 物化为同尺寸实体文件（与已发布 glib 包形态一致）"
      - "conan Meson helper 无 compile() 方法，构建调用为 configure()/build()/install()"
      - "glib 的公开头不在 <prefix>/include 子目录（需 -I<prefix>/include/glib-2.0 -I<prefix>/lib/glib-2.0/include），消费者 test_package 必须补齐，否则 <playerctl/playerctl.h> 编译失败"
      - "上游 meson 未设 RUNPATH → 动态链接的 CLI 裸跑报 'Error loading shared library'，须依赖 conanrun/VirtualRunEnv 的 LD_LIBRARY_PATH"
