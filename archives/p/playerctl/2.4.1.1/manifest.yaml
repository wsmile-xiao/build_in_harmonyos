software: playerctl
# 版本级 manifest（ARCHIVE-SPEC v2.0）
# 文件位置: archives/p/playerctl/2.4.1.1/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "2.4.1.1"

# 编译状态
# published | built | failed | archived
# built: conan-verify / W3 本地模拟全绿；upload 由 PR 合并 main 后的 CI 执行（R29）
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"

# 构建系统
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian pool 镜像，内容与上游 v2.4.1 tag 完全一致；GitHub release 仅提供
  # .deb/.rpm 无源码包，且 github.com 大文件下载在本环境被掐断，故以 Debian pool 为权威源）
  url: "https://deb.debian.org/debian/pool/main/p/playerctl/playerctl_2.4.1.orig.tar.gz"
  # 源码校验和
  sha256: "75957ad5071956f563542c7557af16a57e40b4a7f66bc9b6373d022ec5eef548"
  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: meson
  # 配置选项列表
  configure_options:
    - "-Dintrospection=false"
    - "-Dgtk-doc=false"
    - "-Dbash-completions=false"
    - "-Dzsh-completions=false"
    - "-Dwrap_mode=nodownload"
  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0.1
    - meson/1.11.0
  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 源码零补丁：上游仅依赖 GLib/GObject/GIO（gio-unix-2.0），无 gudev / 无 Linux 专有
# syscall / 无 glibc 专有宏。全部适配均落在 conanfile.py 内
#（python3 预生成 glib codegen 静态文件 + patch meson.build 改 files()、.so 别名物化、
# ELF 自签、gio-unix-2.0.pc 转发）。上游 2.4.1 已先于本适配发布，依 R37/L0j 规范
# bump X.Y.Z.N 新建 2.4.1.1 目录。
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HMDFS 对 glib codegen 工具（gdbus-codegen/glib-mkenums）间歇性 EACCES：用 python3 <tool> 预生成 4 个静态文件 + patch meson.build 改 files()，构建期零 exec 工具，规避信任延迟"
  - "glib 配方无 gio-unix-2.0 组件：配方生成转发型 gio-unix-2.0.pc（版本从 gio-2.0.pc 读取），满足上游 dependency('gio-unix-2.0')"
  - "构建沙箱不支持 symlink/link：package() 用 shutil.copy2 物化 libplayerctl.so / .so.<major> 为同尺寸实体文件（对齐已发布 glib 包形态）"
  - "鸿蒙 PC XPM 要求 ELF 自签：package() 用 llvm-objcopy --remove-section .codesign + binary-sign-tool -selfSign 1 重签 bin/×2 与 lib/*.so（工具缺失时告警不阻塞）"
  - "test_package 不依赖 pkg-config：OHOS worker 上 PKG_CONFIG_PATH 不可靠，消费者测试直接遍历 cpp_info 拼 clang 命令行"
  - "已发布版本 2.4.1 改配方须 bump X.Y.Z.N（R37/L0j）：本版本 2.4.1.1 为 2.4.1 的合规修订位；origin/main 已有完整的 playerctl/2.4.1 适配（test_ohos + ELF 自签 + .so 物化），2.4.1.1 在此基础补强为同形态"
