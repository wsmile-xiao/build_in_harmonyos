patches:
  - patch_file: "patches/0001-pconsole.c-seteuid-noop-guard.patch"
    patch_description: "Skip the privileged seteuid() calls when the effective uid already equals the real uid: unguarded they abort startup on OpenHarmony/HarmonyOS with an uncatchable SIGSYS (exit 159) although there is no privilege to drop. Pure POSIX predicate (geteuid()/getuid()), no platform macro, transparent on other platforms"
    patch_type: "portability"
