# test_package/MANIFEST.yml — pconsole 1.2.0
# CI L0e requires this file to exist.

package: pconsole/1.2.0
homepage: "https://walterdejong.github.io/pconsole/"

# Upstream ships no test suite at all.  Verified against the v1.2.0 tag
# (commit 1a00ed5b2c8c9b18f4ad7799c0191c6ad8e56fe6), whose complete file list is:
#   .gitignore ChangeLog Conn.c GPL List.c Makefile Makefile.in README.md
#   _config.yml commands.c config.h.in configure configure.in cstring.c
#   index.html install-sh pconsole.c pconsole.sh.in ssh.sh stamp-h.in
#   terminal.c include/{Conn,List,commands,cstring,pconsole,terminal}.h
#   images/screenshot.jpg
# - Makefile.in has no `check`/`test` target (targets: all, neat, clean,
#   mrproper, depend/dep/.depend, install, uninstall)
# - no tests/ or testsuite/ directory, no automake TESTS/check_PROGRAMS,
#   no CUnit/check/criterion/gtest binding, no dejagnu integration
# - `make check` is therefore undefined upstream
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: >-
      Installed-artifact checks (pconsole, pconsole.sh, ssh.sh present and
      executable; GPL text packaged; configure baked the package bindir into
      pconsole.sh), pconsole.sh usage path exits non-zero and prints its usage
      line, both scripts pass `sh -n`, and ssh.sh takes the telnet fallback
      branch when ssh is not on PATH.
    command: "sh test.sh <bindir>"
  - file: pconsole_pty_test.py
    description: >-
      pty-driven functional test of the pconsole binary: banner/command mode,
      version, help table, help warranty, list with no connections, unknown
      command, attach usage, attach ENOENT, echo toggle, connect with no
      connections, plus the core multiplexing feature (attach a real pty and
      type into it through ioctl(TIOCSTI)).  Also inspects the ELF directly:
      ELF64/EM_AARCH64 and DT_NEEDED limited to libc; and H5 arms a seccomp-bpf
      filter in the child before exec so the HarmonyOS privileged-id-syscall
      boundary (E051) is actually enforced on that injection path.
    command: "python3 pconsole_pty_test.py <bindir>"

# Independent check items, counted one per separately-decidable assertion.
# Functional / consumer (F* + M* + S*): 25
# HarmonyOS-specific (H*): 5
assertion_count: 30

harmonyos_specific_tests:
  - id: H1_elf64_aarch64
    description: "Artifact is ELF64 little-endian with e_machine == EM_AARCH64 (183)"
  - id: H2_libc_only_needed
    description: "DT_NEEDED is limited to libc (R26: no same-named system library shipped)"
  - id: H3_no_sigsys_on_startup
    description: "Startup never dies with the uncatchable SIGSYS / exit 159 that an unguarded seteuid() produces under the OpenHarmony/HarmonyOS seccomp whitelist (E051)"
  - id: H4_non_tty_invocation_refused
    description: "Without a tty on stdin pconsole exits non-zero with its own guard message instead of being killed by the kernel"
  - id: H5_no_setid_syscall_on_injection_path
    description: >-
      Regression guard for the third seteuid() call site (the "drop root privs
      again" tail of put_conn(), traversed by every injected keystroke).  The
      harness arms a seccomp-bpf filter that traps the whole set*-id syscall
      family in the child before execve, reproducing the HarmonyOS uncatchable
      SIGSYS, then drives a real keystroke injection.  A build that still emits
      a privileged-id syscall on that path dies by SIGSYS and the case fails; a
      fully guarded build emits none and survives.  Verified to fail against
      unpatched upstream and against a build guarding only 2 of the 3 sites,
      and to pass with all 3 guarded.  Reported as `skip:` (never as a pass) on
      a host whose kernel or container refuses the filter.
