package: puremagic/2.2.0
homepage: "https://github.com/cdgriffith/puremagic"
upstream_check_command: "python3 -m pytest test/test_scanners.py test/test_common_extensions.py"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest test/test_scanners.py test/test_common_extensions.py"
upstream_tests:
  - file: test/test_scanners.py
    source: puremagic-2.2.0.tar.gz/test/test_scanners.py
    description: "66 unmodified pytest tests; Python 3.12.14 local and H1 Python 3.12.9 each passed 66/66 with pytest 9.0.2; H1 #003 used the pinned test-only runtime zip"
    command: "python3 -m pytest test/test_scanners.py"
  - file: test/test_common_extensions.py
    source: puremagic-2.2.0.tar.gz/test/test_common_extensions.py
    description: "29 unmodified pytest tests; Python 3.12.14 local and H1 Python 3.12.9 each passed 29/29 with pytest 9.0.2; H1 #003 used the pinned test-only runtime zip"
    command: "python3 -m pytest test/test_common_extensions.py"
test_package_tests:
  - file: functional.py
    description: "Four consumer scenarios passed on the actual OHOS armv8 Conan package using H1 Python 3.12.9"
    command: "python3 functional.py <absolute-package-folder> <results-json>"
assertion_count: 4
