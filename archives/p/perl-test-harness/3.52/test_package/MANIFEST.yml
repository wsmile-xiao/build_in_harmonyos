# test_package/MANIFEST.yml — perl-test-harness 3.52
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-test-harness/3.52
homepage: "https://metacpan.org/pod/Test::Harness"

# 上游测试套件：t/ 目录 59 个 .t 测试文件（prove 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Test-Harness-3.52/t/*.t
    description: "47 个 .t 测试文件：本地实测 12017/12017（100%），零失败（无空格目录实测）"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 TAP::Harness + 运行 bin/prove）
test_package_tests:
  - file: test_test_harness.py
    description: "Loads packaged TAP::Harness via perl -I<lib> and constructs a real instance; runs bin/prove --version"
    command: "python3 test_test_harness.py"

# 断言总数：2（TAP::Harness 加载 + prove 运行）
assertion_count: 2
