name: test_periphery
version: "1.0"
description: "L1 test for periphery 2.5.0 — consumer-style verification of the packaged public API"
language: C
source: test.c

upstream_test:
  name: "make all tests (upstream CI build.yml)"
  file: "tests/*.c (upstream)"
  description: >
    Upstream CI (.github/workflows/build.yml) compiles the 8 hardware-dependent
    test programs but never executes them — they require real GPIO/I2C EEPROM/
    PWM/SPI/serial loopback hardware (test_mmio even assumes a BeagleBone
    Black). The PC has none of these devices (probed: /dev/i2c-*, /dev/spidev*,
    /dev/pwmchip*, /dev/ttyS*, /dev/mem absent; /dev/gpiochip* EACCES).
    This consumer test replicates the compile-and-link verification for all
    modules plus API behavior checks that need no hardware: new/close/free
    round-trips and documented error codes for absent devices across all 7
    modules (gpio/i2c/led/mmio/pwm/serial/spi) and the version API.
  comparison: >
    Same public API surface as upstream tests (gpio_new/gpio_open/gpio_free,
    i2c_new/i2c_open/i2c_errno/i2c_close, led_new/led_open, mmio_new/mmio_open,
    pwm_new/pwm_open, serial_new/serial_open, spi_new/spi_open,
    periphery_version/periphery_version_info); 29 checks, 0 hardware required.
