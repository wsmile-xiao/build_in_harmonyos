# 版本级 manifest
# 文件位置: archives/p/periphery/2.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5.0"

# 软件名
software: "periphery"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-27"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（codeload.github.com 为 GitHub 官方归档 CDN，
  # 与 github.com/archive/refs/tags/v2.5.0.tar.gz 同内容同 sha256；
  # 仓库既有惯例，见 afsctool/parson/papirus-icon 等配方）
  url: "https://codeload.github.com/vsergeev/c-periphery/tar.gz/refs/tags/v2.5.0"

  # 源码校验和
  sha256: "065d304d289a691bf2f685f3d80ff9dc26ba69bb2d463b2f279397908f5ec9ae"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
  - "-DBUILD_SHARED_LIBS=ON"
  - "-DBUILD_TESTS=OFF"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游测试 8 套件全部依赖真实外设（GPIO 回环/I2C EEPROM/PWM/SPI/串口自环/物理 MMIO，test_mmio 假设 BeagleBone Black），上游 CI 仅编译不运行；PC 平台验证等价执行编译口径（8/8 通过）+ test_package 消费者用例 29/29 通过"
  - "任务平台登记版本 3.8.0 属 Swift 同名工具 peripheryapp/periphery，C 库上游（vsergeev/c-periphery）最新 tag 为 v2.5.0，按 C 库适配"
  - "conan get() 对无扩展名 URL（codeload /tar.gz/ 路径）须显式 filename 参数，否则误判 zip（BadZipFile）"
