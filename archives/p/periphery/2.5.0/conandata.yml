# conandata.yml — periphery 2.5.0
# Single source of truth for source URL + SHA256 + patches.
#
# Upstream: vsergeev/c-periphery (formerly hawkninja/periphery, repo 404 after
# the author's namespace migration). v2.5.0 is the latest C-library tag
# (2025-11-02). The task platform's "3.8.0" refers to the unrelated Swift
# tool peripheryapp/periphery and has no C source.

sources:
  # codeload.github.com 为 GitHub 官方归档 CDN，与
  # github.com/vsergeev/c-periphery/archive/refs/tags/v2.5.0.tar.gz 同内容同
  # sha256；本仓库既有惯例（afsctool/parson/papirus-icon 等配方同款）。
  url: "https://codeload.github.com/vsergeev/c-periphery/tar.gz/refs/tags/v2.5.0"
  sha256: "065d304d289a691bf2f685f3d80ff9dc26ba69bb2d463b2f279397908f5ec9ae"

patches:
  # No patches needed: CMake cross-compiles to aarch64-linux-ohos as-is.
  # The GPIO cdev capability probe (check_source_compiles / check_symbol_exists)
  # runs against the OHOS SDK kernel headers at configure time and selects
  # PERIPHERY_GPIO_CDEV_SUPPORT automatically.
