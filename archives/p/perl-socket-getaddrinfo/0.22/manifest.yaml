software: perl-socket-getaddrinfo
# 版本级 manifest
# 文件位置: archives/p/perl-socket-getaddrinfo/0.22/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.22"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统 (顶层字段, 供 _parse_yaml_simple 解析)
build_system: perl

# 编译日期
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Socket-GetAddrInfo-0.22.tar.gz"
  sha256: "097c4c02bfda4f3042fb2978f6e4ca5991202ef26ceb782bb76430a01812fcbe"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL (rewritten from Module::Build to EUMM)"

  # 特殊链接参数（绕过 CRT 文件缺失）
  link_options:
    - "-nostartfiles -nodefaultlibs -lc"

  # 编译依赖列表
  dependencies:
    - perl 5.42.0
    - musl/1.2.x (提供标准 C 库头文件)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "无外部补丁文件，所有修改在 conanfile.py build() 中内联完成"
  - "Makefile.PL: 从 Module::Build::Compat 重写为 ExtUtils::MakeMaker (EUMM)"
  - "socket-gai-config.h: 手动生成（替代 ExtUtils::CChecker），定义 HAS_GETADDRINFO"
  - "Makefile.PL: 添加 dynamic_lib => { OTHERLDFLAGS => '-nostartfiles -nodefaultlibs -lc' }"
  - "修复 EUMM 生成的 .o 文件路径不匹配问题"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Perl XS 模块编译需要标准 C 库头文件（musl 提供）"
  - "鸿蒙系统缺少 CRT 文件（crti.o, crtn.o, crtbeginS.o, crtendS.o），链接需要 -nostartfiles -nodefaultlibs -lc"
  - "Module::Build 在鸿蒙系统不可用，需将 Makefile.PL 重写为 ExtUtils::MakeMaker"
  - "ExtUtils::CChecker 在鸿蒙系统不可用，需手动生成 socket-gai-config.h"
  - "EUMM 生成 .o 文件在 CWD 而非 lib/Socket/ 目录，需手动复制修复"
  - "SELinux HMDFS 文件系统限制动态库加载，需安装到系统目录"
