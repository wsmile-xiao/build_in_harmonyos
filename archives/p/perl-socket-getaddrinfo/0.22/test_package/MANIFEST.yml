# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-socket-getaddrinfo/0.22
homepage: https://metacpan.org/pod/Socket::GetAddrInfo

# 上游测试命令 (Perl 标准 make test)
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游源码自带的测试 (t/ 目录)
upstream_tests:
  - file: t/00use.t
    description: "模块加载基本测试"
    command: "perl -Iblib/lib -Iblib/arch t/00use.t"
  - file: t/01getaddrinfo.t
    description: "getaddrinfo 功能测试 (39 项断言)"
    command: "perl -Iblib/lib -Iblib/arch t/01getaddrinfo.t"
  - file: t/02getnameinfo.t
    description: "getnameinfo 功能测试"
    command: "perl -Iblib/lib -Iblib/arch t/02getnameinfo.t"
  - file: t/03Socket6api.t
    description: "Socket6 API 兼容性测试"
    command: "perl -Iblib/lib -Iblib/arch t/03Socket6api.t"
  - file: t/04Strict.t
    description: "Strict 模式测试"
    command: "perl -Iblib/lib -Iblib/arch t/04Strict.t"
  - file: t/05emulation.t
    description: "Emulation 模式测试"
    command: "perl -Iblib/lib -Iblib/arch t/05emulation.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: run_test.sh
    description: "Shell 测试包装脚本，调用 test_getaddrinfo.pl 验证 Socket::GetAddrInfo 模块"
    command: "sh run_test.sh"
  - file: test_getaddrinfo.pl
    description: "Socket::GetAddrInfo 模块加载 + 版本验证 + getaddrinfo(127.0.0.1:80) 功能测试"
    command: "perl test_getaddrinfo.pl"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 45
