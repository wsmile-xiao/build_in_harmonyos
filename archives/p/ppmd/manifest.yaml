software: ppmd
display: "ppmd"
description: "PPMd variant I 文件到文件压缩器（prediction by partial matching），以高压缩比与高速率处理文本数据"
category: utility
homepage: "https://packages.debian.org/unstable/utils/ppmd/"
license: Public Domain
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 port 标注 ONLY_FOR_ARCHS=i386：子分配器以 UNIT_SIZE=12 为粒度假设 i386 的 4+4+4 结构布局，aarch64/LP64 下 PPM_CONTEXT(20)/MEM_BLK(24) 字节全部溢出单元边界，编码即段错误；补丁 0002 按 __LP64__ 把粒度提到 24 并保持每单元 2 个 packed STATE 的寻址不变量"
    - "carryless 区间编码器状态 low/code/range 依赖 32 位回绕，LP64 下 DWORD 变 64 位使 range 初值为 2^64-1、首个符号即编解码失步；补丁 0003 把编码器状态与 SUBRANGE 钉死 unsigned int"
    - "C++11 起紧邻字符串字面量的 __DATE__ 被 lex 成 UDL 后缀，补丁 0001 加空格修复；补丁 0004 把档案头 signature/attrib 钉死 32 位，保持 canonical ppmdi1 16 字节档案头；补丁 0005 把 FreeBSD pmake 专属 Makefile 改写为普通 GNU make Makefile"
    - "上游 CLI 无 --version/--help 发现旗标（平台 smoke 探针要求 rc=0），补丁 0006 在旗标为唯一参数时返回 0，其余调用路径保持上游行为（含无参用法错误 255）"
    - "无外部库依赖（仅标准 C/C++ 头），build_requirements 无需 automake/meson 等工具注入"
  common_dependencies: []

versions:
  "20050811":
    status: built
    build_date: "2026-09-21"
    conan_ref: "ppmd/20050811"
