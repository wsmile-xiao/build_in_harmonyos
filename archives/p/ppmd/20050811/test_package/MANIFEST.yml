# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ppmd/20050811
homepage: "https://packages.debian.org/unstable/utils/ppmd/"

# 上游测试命令：上游 tarball 没有任何测试设施 —— Makefile 无 check 目标，
# 源码树无 test/ 目录、无 *test* 源文件、无断言宏使用。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false

# 上游测试清点（R51：上游确无测试须附清点证据）
# 取数命令（对源码树）:
#   tar tzf ppmd-20050811.tar.gz            # 11 个条目：6 个源文件/头 + Makefile
#                                           # + ppmd.1 + read_me.txt + README-PACKAGE
#   grep -rn "TEST\|check:" ppmd-20050811/Makefile   # 无 check 目标
#   ls ppmd-20050811/test 2>&1                       # No such file or directory
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "以已安装的 bin/ppmd 真实驱动 CLI：版本/用法发现旗标与退出码契约（--version/-h 返回 0、无参 255）、文本/二进制文件通往返逐字节一致、-o/-m/-r 参数矩阵、档案头 16 字节 canonical 布局（magic 84ACAF8F 小端 + 偏移 16 处存原文件名）、非静默统计行 bpb、-f 自定义档案名、-d 处理后删源文件、通配符批量、损坏档案优雅拒绝（无 SIGSEGV）"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 23
