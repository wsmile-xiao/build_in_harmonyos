# conandata.yml — ppmd 20050811
# 源码为 PPMd variant I（Dmitry Shkarin，public domain）经 Debian 补丁与 FreeBSD
# ports 重打包的 ppmd-20050811.tar.gz；SHA256 与 FreeBSD ports distinfo 逐字一致。

sources:
  url: "https://www.mirrorservice.org/sites/distfiles.macports.org/ppmd/ppmd-20050811.tar.gz"
  sha256: "81fc0cd13b1a6277959f52f9215e62ce71824ff652b28b2a754e469b9fa4ba22"

patches:
  - patch_file: "patches/0001-fix-cxx11-user-defined-literal.patch"
    patch_description: "Put a space between the string literal and __DATE__ so C++11 lexing does not treat __DATE__ as a user-defined-literal suffix"
    patch_type: "portability"
  - patch_file: "patches/0002-lp64-suballocator-granule.patch"
    patch_description: "Grow the suballocator unit granule to 24 bytes on LP64 so packed PPM_CONTEXT/MEM_BLK fit inside one unit (upstream ships i386-only builds)"
    patch_type: "portability"
  - patch_file: "patches/0003-pin-range-coder-to-32-bit.patch"
    patch_description: "Pin the carryless range coder state (low/code/range and SUBRANGE) to exactly 32 bits; the coder's carryless trick relies on 32-bit wraparound"
    patch_type: "portability"
  - patch_file: "patches/0004-fixed-width-archive-header.patch"
    patch_description: "Declare ARC_INFO signature/attrib as fixed 32-bit so the on-disk ppmdi1 header stays 16 bytes on LP64 hosts"
    patch_type: "portability"
  - patch_file: "patches/0005-gnu-makefile.patch"
    patch_description: "Rewrite the FreeBSD pmake-only Makefile (.for loops, :C substitution) as a plain GNU make Makefile"
    patch_type: "portability"
  - patch_file: "patches/0006-add-standard-version-help-flags.patch"
    patch_description: "Accept --version/--help/-V/-h when they are the only argument (platform smoke probes require rc=0); all other invocations keep upstream behaviour"
    patch_type: "portability"
