  - "0005-gnu-makefile.patch"
  - "0006-add-standard-version-help-flags.patch"

knowledge_gained:
  - "2005 年前后 i386-only 的 C++ 压缩器在 aarch64/LP64 上有两类系统性雷区：①自定义子分配器以枚举 UNIT_SIZE=12 为粒度并假设 4+4+4 结构布局（Stamp+指针+计数），LP64 下指针 8 字节使结构溢出单元边界直接段错误；修法是按 __LP64__ 把粒度提到 3*sizeof(DWORD)=24 并让 2×STATE(=20) ≤ 粒度保持每单元 2 个状态的不变量"  # knowledge_ref: E638（knowledge/drafts/E638-ppmd-20050811-lp64-i386-era-cpp-port，本 PR 携带）
  - "手写 carryless 区间编码器的状态变量（low/code/range）必须钉死 32 位：算法依赖 32 位回绕丢弃进位，LP64 下 unsigned long 让 range 初值变成 2^64-1，首个符号即编解码失步（文本解出乱码、二进制偶发侥幸一致）；修法是把编码器状态与 SUBRANGE 计数从 DWORD 改成 unsigned int"  # knowledge_ref: E638（knowledge/drafts/E638-ppmd-20050811-lp64-i386-era-cpp-port，本 PR 携带）
  - "C++11 起紧邻字符串字面量的宏（如 \"%c, \"__DATE__）会被词法分析当成用户自定义字面量后缀而报 no matching literal operator；在宏名前加一个空格即可，这是老 C++ 源码在新 clang 上的确定性编译错误，ppmd 以补丁 0001 修复"  # knowledge_ref: E638（knowledge/drafts/E638-ppmd-20050811-lp64-i386-era-cpp-port，本 PR 携带）
  - "FreeBSD ONLY_FOR_ARCHS=i386 的移植提示值得当编译前哨：它往往同时预言分配器宽度假设与回绕语义两类问题；ppmd 的子分配器段错误与区间编码器失步都被该标注命中，镜像选型时用 ports distinfo 交叉核对 SHA256"  # knowledge_ref: E638（knowledge/drafts/E638-ppmd-20050811-lp64-i386-era-cpp-port，本 PR 携带）
  - "平台 smoke 探针只试 --version/--help/-V/-h 并要求 rc=0，2005 年前后的老 CLI 普遍没有这些旗标（upstream 用法错误返回 -1）；与 libgig 同族的既定解法是以可移植性补丁接受「旗标为唯一参数」的标准发现旗标并退出 0，其余调用路径保持上游行为不变"  # knowledge_ref: E638（knowledge/drafts/E638-ppmd-20050811-lp64-i386-era-cpp-port，本 PR 携带）

