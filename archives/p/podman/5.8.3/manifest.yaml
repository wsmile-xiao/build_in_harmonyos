version: "5.8.3"
software: podman
build_system: golang
status: built
build_date: "2026-06-26"

source:
  url: "https://github.com/containers/podman/archive/refs/tags/v5.8.3.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: makefile (golang)
  configure_options: []
  dependencies:
    - go (1.26.4+)
    - libseccomp (seccomp support)
    - ohos-sdk (binary-sign-tool)
    - llvm-gcc-compat (cc for CGO)
  cc: clang (ohos-sdk)

patches_applied:
  - libpod/lock/shm/shm_lock.c: HarmonyOS pthread compat (robust mutex stubs)

knowledge_gained:
  - "Go linker: -linkmode=internal required on HarmonyOS to avoid mmap security restrictions"
  - "Buildmode: default (not PIE) required when using -linkmode=internal"
  - "go-sqlite3: CGO stub driver replaces bundled C source for internal linking"
