# 版本级 manifest — platform.equality 0.0.1
# 遵循 ARCHIVE-SPEC v2.0

version: "0.0.1"
software: platform.equality
status: built
build_date: "2026-10-04"
build_system: cmake

# header-only（package_type = header-library），产物为 4 个公共头 + LICENSE
package_type: header-library

source:
  url: "https://github.com/linksplatform/Equality/archive/refs/tags/0.0.1.zip"
  sha256: "84c363152ab7eef69a9d72a1aebcfabcd63fc889efce591350ec56ddec544981"
  tar_format: zip

build:
  system: cmake
  configure_options: []
  dependencies: []
  # 库本体零依赖；gtest/1.17.0 仅 test_requires（跑上游测试用），不进产物
  test_requires:
    - "gtest/1.17.0"

ohos:
  os: OHOS
  os_version: "6.0"
  arch: armv8
  compiler: clang
  compiler_version: "15"
  compiler_libcxx: libc++
  profile: ohos-aarch64

patches:
  - file: "patches/0001-self-contained-headers-ohos.patch"
    type: portability
    description: >-
      Any.h 补齐 <string>/<unordered_map>（用了却未包含，GCC 靠 <gtest/gtest.h>
      传递包含侥幸编过，OHOS libc++ 报 undefined template std::basic_string）；
      Range.h 补 <ranges>。

extra_definitions:
  - "-D_LIBCPP_ENABLE_EXPERIMENTAL"
extra_definitions_reason: >-
  OHOS libc++ 默认以 _LIBCPP_HAS_NO_INCOMPLETE_RANGES 裁剪整个 std::ranges
  算法族，本库 Range.h 依赖 std::ranges::equal，必须打开该实验特性开关。

test:
  upstream:
    file: "cpp/Platform.Equality.Tests/Platform.Equality.Tests.cpp"
    command: "ctest --output-on-failure"
    suites: 1
    cases: 5
    assertions: 15
  test_package:
    file: "test_package/test.cpp"
    command: "./test_platform_equality"
    checks: 9
    # 非原生宿主（x86_64 开发机）上 can_run() 为 False，本层打印可见 WARNING 后
    # 跳过执行；本地实跑需 -c tools.build.cross_building:can_run=True。
    # CI 的 OHOS worker 是原生构建，本层真实执行。
    note: "skipped on non-native hosts unless cross_building:can_run=True"
