# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: platform.equality/0.0.1
homepage: "https://github.com/linksplatform/Equality"

# 上游测试工程 cpp/Platform.Equality.Tests 用 FetchContent 从 GitHub 拉
# googletest（OHOS CI 不可达），故未沿用上游 CMake 工程；改为配方自带
# CMakeLists.txt，用 Conan 制品仓的 gtest/1.17.0 编译**同一份上游测试源文件**。
upstream_check_command: "ctest -N"
upstream_test_in_build: true
# build() 中经 ctest 执行；交叉编译时由 profile 的 CMAKE_CROSSCOMPILING_EMULATOR
# (qemu) 承载，CI 原生 worker 上直接执行。
upstream_test_command: "ctest --output-on-failure"

# 上游真实测试：cpp/Platform.Equality.Tests/Platform.Equality.Tests.cpp
# 5 个 TEST 用例 / 15 条断言，GTest 单个二进制定义。
upstream_tests:
  - file: cpp/Platform.Equality.Tests/Platform.Equality.Tests.cpp
    source: Equality-0.0.1.zip/cpp/Platform.Equality.Tests/Platform.Equality.Tests.cpp
    description: >-
      上游 GTest 套件 5 个用例：BaseAnyEqual / AdvancedAnyEqual /
      AggressiveAnyTest / RegisterTest / RangeEquality
    command: "./Platform.Equality.Tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: >-
      消费者端到端用例 9 项：any 内建分派 / 类型不匹配 / string 比较 /
      any 与裸值混比 / 未注册类型抛异常 / RegisterEqualityComparer 运行期注册 /
      range 逐元素相等与不等 / 长度不同
    command: "./test_platform_equality"

# 断言/检查数（分开声明，避免与 notes.md 口径不一致）
# 上游 GTest：5 个 TEST 用例共 15 条断言（EXPECT_*/ASSERT_*）
# test_package：9 条自研 CHECK 检查，失败即非零退出码
upstream_assertions: 15
test_package_checks: 9
assertion_count: 24          # = upstream_assertions + test_package_checks
