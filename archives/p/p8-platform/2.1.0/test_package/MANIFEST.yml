# test_package/MANIFEST.yml
# Upstream test declaration file
# CI script (build_and_test.sh L0e) requires this file

package: p8-platform/2.1.0
homepage: "https://github.com/Pulse-Eight/platform"

# Upstream has no test suite
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# Upstream has no test programs
upstream_tests: []

# test_package consumer-side tests
test_package_tests:
  - file: test.cpp
    description: "Tests StringUtils::ToUpper, StringUtils::Trim, StringUtils::EqualsNoCase"
    command: "./test_p8_platform"

# Approximate assertion count
assertion_count: 3
