software: p8-platform
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.0.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 构建系统类型（验证脚本要求）
build_system: cmake

# 版本号
version: "2.1.0.1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/downloads/p8-platform-2.1.0.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器（使用 OHOS SDK 工具链）
  cc: /data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/bin/aarch64-unknown-linux-ohos-clang
  cxx: /data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/bin/aarch64-unknown-linux-ohos-clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "使用 OHOS SDK 编译器解决链接器找不到 libc++ 的问题"
  - "CMake 3.30 需要添加 CMAKE_POLICY_VERSION_MINIMUM 解决版本兼容警告"
  - "ThreadsCreate 使用 PTHREAD_CREATE_DETACHED，线程无需 join"

# ============================================================
# 功能测试
# ============================================================

# 功能测试状态
test:
  # 是否执行功能测试
  executed: true

  # 测试日期
  date: "2026-06-09"

  # 测试结果
  result: pass

  # 测试统计
  total_tests: 11
  passed: 11
  failed: 0

  # 测试覆盖的功能模块
  modules:
    - timeutils     # 时间工具
    - mutex         # 互斥锁
    - event         # 事件机制
    - threads       # 线程管理
    - buffer        # 缓冲区

  # 测试报告路径
  report: reports/test-report.md
