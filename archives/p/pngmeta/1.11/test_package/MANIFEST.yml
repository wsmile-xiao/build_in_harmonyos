# test_package/MANIFEST.yml — pngmeta 1.11
package: pngmeta/1.11
homepage: "https://pmt.sourceforge.io/pngmeta/"

# 上游测试入口核验（R51 清点）：
# - Makefile.am 声明 `TESTS = test1 test2 test3 test4`，automake 的
#   `make check` 是上游唯一测试入口
# - 仓库无 tests/ 目录；4 个测试脚本与 4 份期望输出（*.xpt）位于源码根目录
# - 每个脚本跑一种输出格式，并与期望输出做 diff 比对（上游写的是 `diff -c`，
#   OHOS 的 toybox diff 不支持 -c，patches/0002..0005 改为 POSIX `diff -u`，比对语义不变）
# - 总计 4 个测试，配方 build() 在能执行目标二进制的构建机上实跑 `make check`
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

upstream_tests:
  - file: test1
    description: "未压缩文本块 tEXt，plain 格式输出，diff -u 比对 test1.xpt"
  - file: test2
    description: "压缩文本块 zTXt，SOIF 格式输出，diff -u 比对 test2.xpt"
  - file: test3
    description: "ISO-8859 文本块，HTML 格式输出，diff -u 比对 test3.xpt"
  - file: test4
    description: "RDF/XML 格式输出，diff -u 比对 test4.xpt（期望输出随 rdf:about 修正更新）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.py
    description: "构造含 tEXt/tIME 的 PNG，校验 pngmeta 四种输出格式的元数据提取结果，并验证非 PNG 输入被拒绝"
    command: "python3 test.py <bindir>"
    runtime_smoke:
      - cmd: pngmeta --version
        expected: 输出 banner 含 "built with libpng"（同时用作可执行性探针：探不通时异构 SKIP、同构 FAIL）
      - cmd: pngmeta -quiet sample.png
        expected: 输出含 Title/Author 两个 tEXt 键值与 Modification Time
      - cmd: pngmeta -soif -quiet -all sample.png
        expected: 输出含 image-format{3}/image-width{1} 与 SOIF 长度前缀
      - cmd: pngmeta -xrdf -quiet sample.png
        expected: 输出含 rdf:RDF 根元素与 png:Image rdf:about 主语
      - cmd: pngmeta -html -quiet sample.png
        expected: 输出为 HTML 骨架且含 dd 包裹的 Title
      - cmd: pngmeta -quiet junk.png
        expected: 非 PNG 输入退出码非 0

# 测试断言总数（artifact 2 + 运行时 12）；不用 os.access(X_OK)，HMDFS 上它恒为 False
#
# 注：构建机与产物架构不同且无法执行时（如 x86 runner 上的 aarch64 产物），
# artifact 断言照常执行，运行时检查打印 [SKIP] 并说明原因，不会伪装成通过；
# 同架构却跑不起来直接判 FAIL。CI 为 aarch64 原生构建机，全部检查均实际运行。
assertion_count: 14
