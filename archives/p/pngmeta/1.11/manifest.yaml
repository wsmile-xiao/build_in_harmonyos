# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools

  # configure 由 autoconf 2.13 生成，只接受下列安装目录/三元组选项；
  # Conan 默认注入的 --datarootdir 等更晚的选项会让它 "invalid option" 退出，
  # 因此 conanfile.py 的 generate() 用白名单过滤 configure_args。
  configure_options:
    - "--prefix"
    - "--bindir"
    - "--libdir"
    - "--includedir"
    - "--host"
    - "--build"

  dependencies:
    - libpng/1.6.58.3
    - zlib/1.3.2

  cc: clang
  cxx: clang++

