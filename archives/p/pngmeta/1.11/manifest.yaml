# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "针对 libpng ≤1.2 编写的程序在 libpng ≥1.4 下无法编译：PNG_INTERNAL 不再暴露内部头，png_handle_* 与 png_struct/png_info 字段全部私有化，需整体迁移到 png_read_png/png_get_IHDR/png_get_tIME/png_jmpbuf 等公共 API"
  - "libpng 1.6 的 png.h 不再间接包含 zlib.h，旧代码引用 ZLIB_VERSION 会报 undeclared identifier，需显式 #include <zlib.h>"
  - "png_convert_to_rfc1123() 在 libpng 1.6 带 PNG_DEPRECATED 属性，应改用 png_convert_to_rfc1123_buffer()，并处理其返回 0（tIME 非法）的情形"
  - "autoconf 2.13 时代的 configure 不认识 --datarootdir，需要在 Conan 配方里按白名单过滤 AutotoolsToolchain 注入的 configure_args"
  - "上游 automake 测试脚本用 `for dir in . ..` 定位期望输出，VPATH 构建时须先把测试数据复制到 build 目录，make check 才能工作"
  - "qemu-user 能执行静态链接的 aarch64 OHOS 二进制，但 OHOS musl 动态加载器在 qemu 下入口即 SIGSEGV；x86 runner 上验证动态产物需改用静态链接构建"
  - "OHOS 的 diff 是 toybox 实现，只输出 unified 格式、不认识 -c（报 diff: Unknown option 'c'），上游测试脚本里的 diff -c 需改为 POSIX 的 diff -u（与 GNU diffutils 同样兼容；giflib 5.2.2 的已合并配方在 CI 上用过 diff -u FILE -）"
  - "HMDFS 上 os.access(path, os.X_OK) 恒为 False（模式位固定），test_package 不能用它判断二进制可执行，应以实际执行结果为准"

