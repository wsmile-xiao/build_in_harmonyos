software: pngmeta
display: "pngmeta"
description: "PNG 元数据提取命令行工具，把 PNG 的 IHDR 几何信息、tEXt/zTXt/iTXt 关键字与 tIME 时间戳输出为纯文本、SOIF、HTML 或 RDF/XML"
category: graphics
homepage: "https://pmt.sourceforge.io/pngmeta/"
license: Libpng
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游写于 libpng 1.0 时代，用 #define PNG_INTERNAL 直接调用 png_handle_IHDR/tEXt/zTXt/iTXt 并读取 png_ptr/info_ptr 内部字段；libpng ≥1.4 起这些全部私有化，需整体迁移到 png_read_png/png_get_IHDR/png_get_tIME/png_jmpbuf 公共 API（知识草稿 E600）"
    - "libpng ≥1.5 的 png.h 不再内嵌 zlib.h，引用 ZLIB_VERSION 需显式 #include <zlib.h>（pngnq 1.1 曾在 src/rwpng.c 踩过同一点）"
    - "png_convert_to_rfc1123() 在 libpng 1.6 带 PNG_DEPRECATED，改用 png_convert_to_rfc1123_buffer() 并处理 tIME 非法时的返回 0"
    - "configure 由 autoconf 2.13 生成，不认识 --datarootdir，需在 generate() 中按白名单过滤 Conan 注入的 configure_args"
    - "上游 automake 测试脚本用 `for dir in . ..` 定位期望输出，VPATH 构建须先把 *.xpt / *.png 复制到 build 目录，make check 才能工作"
    - "修正上游 RDF/XML 输出的两个缺陷：主语属性 about= → rdf:about=，元素名去除空白字符（test4.xpt 期望输出同步更新）"
    - "OHOS 的 diff 是 toybox 实现，不支持 -c（context 格式）；上游测试脚本 test1..test4 的 diff -c 改为 POSIX diff -u"
  common_dependencies:
    - libpng
    - zlib

versions:
  - version: "1.11"
    status: built
    build_date: "2026-09-20"
