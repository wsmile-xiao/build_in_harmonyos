software: podofo
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.9.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.9.5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/podofo/podofo/archive/refs/tags/0.9.5.tar.gz"

  # 源码校验和
  sha256: "3e47646e6059a46ab5e20b35cc2b6de9c2d6db2443fc27808bbe764351220370"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: cmake

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "-DFREETYPE_INCLUDE_DIR_FT2BUILD=$DEFAULT_PREFIX/include/freetype2"
    - "-DFREETYPE_INCLUDE_DIR_FTHEADER=$DEFAULT_PREFIX/include/freetype2/freetype"
    - "-DFREETYPE_LIBRARY=$DEFAULT_PREFIX/lib/libfreetype.a"
    - "-DFONTCONFIG_INCLUDE_DIR=$DEFAULT_PREFIX/include"
    - "-DFONTCONFIG_LIBRARIES=$DEFAULT_PREFIX/lib/libfontconfig.so"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - zlib/1.3.1
    - freetype/2.14.3
    - fontconfig/2.16.0
    - libpng/1.6.43
    - openssl/1.1.1w
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
    - "ref: E103 — CMake 4.x 需要 -DCMAKE_POLICY_VERSION_MINIMUM=3.5 兼容 cmake_minimum_required(VERSION 2.6)"
    - "ref: E092 — CMake 不识别 HarmonyOS 为 UNIX，导致 WANT_FONTCONFIG=FALSE，fontconfig 功能未启用"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
