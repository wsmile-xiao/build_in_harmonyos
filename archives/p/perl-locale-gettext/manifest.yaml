software: perl-locale-gettext
display: "Locale::gettext"
description: "Perl bindings for POSIX i18n gettext functions"
category: doc                     # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://metacpan.org/pod/Locale::gettext"
license: Artistic-1.0-Perl OR GPL-1.0-or-later
build_system: perl                # autotools | cmake | meson | makefile | custom | perl

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "OHOS 使用 glib 的 gettext 包装器（libintl_glib.so），而非传统 libintl.so"
    - "Makefile.PL 的 conftest 函数检测在 OHOS 会失败（CRT 文件问题）"
    - "XS 模块需要 OTHERLDFLAGS=\"-nostartfiles -nodefaultlibs\" 参数"
    - "必须设置 CPATH 和 LIBRARY_PATH 环境变量"
    - "SELinux HMDFS 限制：XS 模块在用户目录无法加载，需安装到系统目录"
  common_dependencies:
    - gettext (provides libintl_glib.so)
    - perl

# 版本索引（所有已归档版本，含状态）
versions:
  "1.07-r2":
    status: built
    build_date: "2026-06-13"
    notes: "完整的 OHOS 平台适配，包含补丁和测试报告"