# archives/p/polylib/manifest.yaml — 软件级元数据
software: polylib
display: "PolyLib"
description: "IRISA 多面体运算库：多面体并集上的 Ehrhart 多项式、格点计数与参数化分解"
category: library
homepage: "https://icps.u-strasbg.fr/polylib/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 发布版本停留在 2018，需补 HarmonyOS/linux-ohos 识别（E007；老式 echo 风格文件官方脚本不适用）"
    - "config.status 的 confXXXXXX 临时目录在 HMDFS 上必须用 umask 022 创建（E011/E136）"
    - "Conan Release 注入 -DNDEBUG，需显式保留 errors.c 中 assert 内的 pthread 异常栈初始化"
    - "configure 显式 --with-libgmp=DIR 会只建 gmp 变体；让 configure 自行探测才能得到 32/64/gmp 三套"
  common_dependencies:
    - gmp

versions:
  "6.01":
    status: built
    build_date: 2026-09-18
    conan_ref: "polylib/6.01"
