# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: polylib/6.01
homepage: "https://icps.u-strasbg.fr/polylib/"

# 上游测试入口：Test/<子目录> 把每个 <case>.in 输入喂给对应程序，并与仓库内
# <case>.out 基线逐行 diff。顶层 `make check` 只有 `check: all`（不跑用例），
# 因此使用 `make -C Test check`。
upstream_check_command: "make -C Test check"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make -C Test check"

# 上游实际运行的测试目录（设备原生 aarch64 实测 426/426 通过，0 FAIL 0 SKIP；
# 32/64/gmp 三套整数表示各跑一遍：134 + 146 + 146）
upstream_tests:
  - file: Test/Zpolytest/Makefile.am
    source: polylib-6.01/Test/Zpolytest
    description: "Zpolytest：格（Lattice）与多面体核心运算用例（32 位 71 例；64/gmp 各 78 例）"
    command: "make -C Test/Zpolytest TEST_BITS=<32|64|gmp> tests"
  - file: Test/general/Makefile.am
    source: polylib-6.01/Test/general
    description: "general：多面体通用运算用例（polytest，各整数表示 14 例）"
    command: "make -C Test/general TEST_BITS=<bits> tests"
  - file: Test/pp/Makefile.am
    source: polylib-6.01/Test/pp
    description: "pp：参数化多面体分解用例（各整数表示 8 例）"
    command: "make -C Test/pp TEST_BITS=<bits> tests"
  - file: Test/ehrhart/Makefile.am
    source: polylib-6.01/Test/ehrhart
    description: "ehrhart：Ehrhart 多项式用例（32 位 38 例；64/gmp 各 43 例）"
    command: "make -C Test/ehrhart TEST_BITS=<bits> tests"
  - file: Test/ehrhart_union/Makefile.am
    source: polylib-6.01/Test/ehrhart_union
    description: "ehrhart_union：多面体并集的 Ehrhart 用例（各整数表示 2 例）"
    command: "make -C Test/ehrhart_union TEST_BITS=<bits> tests"
  - file: Test/ranking/Makefile.am
    source: polylib-6.01/Test/ranking
    description: "ranking：多面体顶点排序用例（各整数表示 1 例）"
    command: "make -C Test/ranking TEST_BITS=<bits> tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_polylib.c
    description: "消费者 C API 测试：单位正方形约束矩阵 → Constraints2Polyhedron → 断言 dimension=2、4 facets、无隐式等式、4 顶点/射线、Polyhedron2Constraints 往返 4 facets（6 项断言）"
    command: "./test_polylib"
  - file: test_c2p.sh
    description: "消费者 CLI 测试：安装后的 c2p 复现同一 polyhedron（断言 Dimension:2、Constraints/Equations/Rays/Lines 计数、顶点 (0,0) 与 (1,1)，4 项断言）"
    command: "sh test_c2p.sh <pkg>/bin/c2p square.in"

# 测试断言总数 (test_package 的 CHECK 项数：6 + 4)
assertion_count: 10
