# archives/p/polylib/6.01/manifest.yaml — 版本级元数据
version: "6.01"
software: polylib
status: built
build_date: "2026-09-18"
build_system: autotools

source:
  url: "https://icps.u-strasbg.fr/polylib/polylib_src/polylib-6.01.tar.gz"
  sha256: "ba2f42aa2b342a565c346e717c4a4bdc08c16ca4d113eda6a7d4e95d978343d3"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-static"
    - "--disable-shared"
  # configure 自行探测由 AutotoolsDeps 注入的 gmp，随后按上游默认构建全部整数表示：
  # libpolylib32、libpolylib64、libpolylibgmp（32/64/gmp 三套测试随之运行）
  dependencies:
    - "gmp/6.3.0.1"
  cc: clang
  cxx: clang++
  artifacts:
    # 默认 shared=False（静态交付）；-o polylib/*:shared=True 时改产 *.so.10
    libs:
      - "lib/libpolylib32.a"
      - "lib/libpolylib64.a"
      - "lib/libpolylibgmp.a"
    headers:
      - "include/polylib/*.h"
    tools:
      - "bin/c2p、r2p、findv、disjoint_union_sep、disjoint_union_adj"
      - "bin/ehrhart_quick_apx、ehrhart_upper_bound、ehrhart_lower_bound"
      - "bin/ehrhart_ranking{32,64,gmp}、ehrhart_union{32,64,gmp}"
      - "bin/pp{32,64,gmp}、testehrhart{32,64,gmp}"
    pkgconfig:
      - "lib/pkgconfig/polylibgmp.pc"  # 静态与共享构建均安装

patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-source-arith-errors.c.patch"

knowledge_gained:
  - "polylib 6.01 发布包自带 configure/Makefile.in，但 config.guess/config.sub 仍是 2018 版本，无 HarmonyOS 分支；官方 patch-autotools-ohos.pl 只适配新版 GUESS 风格脚本，对老式 echo 风格只改文件不产生输出，需按等价语义手工补 echo 分支（E007）。"
  - "config.sub 老式（2018）结构需同时修改 maybe_os 内核列表（linux-ohos*）与 KERNEL-OS 校验列表（-linux-ohos*），只加一处仍报 'system ohos not recognized'。"
  - "HMDFS 下 autoconf config.status 的 ./confXXXXXX 目录在 umask 077 时不可写，报 subs1.awk Permission denied（E011/E136）；configure 内两处 umask 077→022 后配置成功，与 adns/aespipe/barvinok 先例一致。"
  - "Conan Release 构建注入 -DNDEBUG，使 errors.c 中 assert(pthread_once(...)) 的副作用消失，TLS 异常栈永不初始化——设备实测首个用例目录 71 次执行全部崩溃（68 例与基线不符）；补丁显式化 pthread_once/pthread_setspecific 后 426/426 全通过。"
  - "configure 显式 --with-libgmp=DIR 会关闭「构建全部整数表示」的默认分支（只出 gmp 库）；要保留 32/64/gmp 三套需让 configure 通过 AutotoolsDeps 注入的 CPPFLAGS/LDFLAGS 自行探测 gmp。"
  - "上游回归入口是 make -C Test check（顶层 make check 只构建不跑用例）；Test/<子目录> 对每个 .in 输入与 .out 基线做 diff，Test 目录再用 TEST_FILES_32 为 32 位整数表示提供子集。"

patch_generation:
  method: per-file-difflib  # 探索阶段 refresh-patch --auto（编辑追踪器精准模式）记录；
                            # finish/W3 重生成的补丁与这 4 个文件逐字节一致（W4 已核）
  source_orig_dir: /storage/Users/currentUser/ws/tmp/polylib-6.01/builds/polylib-6.01.orig
  source_work_dir: /storage/Users/currentUser/ws/tmp/polylib-6.01/builds/polylib-6.01.work
  source_orig_hash: 1134aaab4535630b
  source_work_hash: 6d322f9288ddc413
  generated_at: '2026-09-18T01:39:00'
  patches_count: 4

patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: true
    guard: 'HarmonyOS uname 分支 + __OHOS__ libc 探针（E007）'
  - file: 0002-config.sub.patch
    type: portability
    platform_only: true
    guard: 'linux-ohos 内核-OS 组合（E007）'
  - file: 0003-configure.patch
    type: portability
    platform_only: true
    guard: 'HMDFS 上 config.status 临时目录 umask 022（E011/E136）'
  - file: 0004-source-arith-errors.c.patch
    type: bugfix
    platform_only: false
    guard: 'NDEBUG（Release）下保留 pthread 异常栈初始化'
