# conandata.yml — polylib 6.01
# Official IRISA PolyLib distribution site (the same source referenced by the
# AUR polylib 6.01 package; sha256 matches its recorded checksum).
sources:
  url: "https://icps.u-strasbg.fr/polylib/polylib_src/polylib-6.01.tar.gz"
  sha256: "ba2f42aa2b342a565c346e717c4a4bdc08c16ca4d113eda6a7d4e95d978343d3"

patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_type: "portability"
    patch_description: >-
      config.guess: recognise HarmonyOS (uname -s) and the __OHOS__ libc probe,
      so native configure reports aarch64-unknown-linux-ohos instead of failing
      with "unable to guess system type" (E007)
  - patch_file: "patches/0002-config.sub.patch"
    patch_type: "portability"
    patch_description: >-
      config.sub: accept the linux-ohos kernel-OS pair used by the OHOS
      triplet (E007)
  - patch_file: "patches/0003-configure.patch"
    patch_type: "portability"
    patch_description: >-
      configure/config.status: create the private confXXXXXX directory with
      umask 022; the autoconf default umask 077 directory is not writable on
      HMDFS and config.status aborts with "Permission denied (subs1.awk)"
      (E011/E136)
  - patch_file: "patches/0004-source-arith-errors.c.patch"
    patch_type: "bugfix"
    patch_description: >-
      errors.c: keep the pthread exception-stack initialisation when NDEBUG is
      defined (Release builds); the upstream code hides pthread_once inside
      assert() side effects, so the thread-local exception stack is never
      created and every regression case aborts
