# test_package/MANIFEST.yml
# pd-ekext 0.3.1 — upstream test declaration.
package: pd-ekext/0.3.1
homepage: "https://puredata.info/downloads/ekext"
upstream_tarball: "https://deb.debian.org/debian/pool/main/p/pd-ekext/pd-ekext_0.3.1.orig.tar.xz"
upstream_repo: "https://github.com/pd-externals/ekext (tag v0.3.1)"

# ── Upstream test inventory ────────────────────────────────────────────────
# Counting unit: test CASES.  Upstream ships no automated test at all.
# Evidence: the orig tarball has 98 entries; the only build inputs are
# `Makefile` (lib.name + class.sources + datafiles + `include
# pd-lib-builder/Makefile.pdlibbuilder`), 43 *.c, two local headers
# (rand48.h, saturate.h), 37 Pd patches and pd-lib-builder/.  Neither the
# library Makefile nor pd-lib-builder 0.7.0's Makefile.pdlibbuilder defines a
# `check:` target (`grep -n '^check' Makefile pd-lib-builder/Makefile.pdlibbuilder`
# matches nothing), and the repository has no CI workflow running one.
#
# What does ship are three *demo* patches, which are Pd patches a human opens in
# Pd, not assertions: maskxor-test.pd, test_scalefilter.pd, isoWrap~-test.pd.
# There is no reference output to compare against, so they cannot be ported to
# an automated gate; they are listed below as evidence of what upstream tests.
upstream_tests_exist: false
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_test_cases: 0
upstream_demo_patches:
  - file: maskxor-test.pd
    description: "interactive demo patch for [maskxor]; opens in Pd, no assertions"
  - file: test_scalefilter.pd
    description: "interactive demo patch for [scalefilter]; opens in Pd, no assertions"
  - file: isoWrap~-test.pd
    description: "interactive demo patch for [isoWrap~]; opens in Pd, no assertions"
upstream_test_audit: >-
  No automated upstream suite exists (no `check` target in Makefile or in
  pd-lib-builder 0.7.0's Makefile.pdlibbuilder, no CI).  The only upstream
  test-like artefacts are three interactive Pd patches with no reference
  output, so nothing can be ported to a gate; the behaviour is pinned by the
  consumer test below instead.

# ── HarmonyOS-specific test added by this adaptation ───────────────────────
# Exercising a Pd external requires a Pure Data runtime.  The `pd` binary in
# puredata/0.54.1 cannot be used as the harness here: it is an aarch64 OHOS musl
# executable whose dynamic imports are not all satisfiable off-device (running
# it locally dies with `__fd_chk: symbol not found`), and it would also require
# a running Pd DSP/GUI event loop, which a build gate must not depend on.
# So the test embeds a minimal Pure Data runtime shim that provides exactly the
# 38 Pd symbols the 43 externals import (measured with `nm -u` over the built
# objects), and drives the packaged externals through the same entry points Pd
# uses: dlopen(RTLD_NOW|RTLD_LOCAL) -> dlsym("setup") -> setup() ->
# class_new/class_add* -> creation function -> methods.
test_package_tests:
  - file: test_package/pd_ekext_test.c
    description: >-
      Consumer program that, for all 43 packaged externals, verifies the file
      is a 64-bit little-endian aarch64 ELF shared object, dlopen()s it with
      RTLD_NOW|RTLD_LOCAL (so every imported Pd symbol must be resolvable from
      the loading image alone), calls setup() and asserts a Pd class named after
      the object got registered with a non-zero instance size and at least one
      method.  It then instantiates four externals through their creation
      function and asserts the exact outlet values of their real methods:
      [positive] float 3 -> 3, float -5 -> 1, float -1 -> 1, float 2.5 -> 2.5,
      bang repeats 2.5; [cup] float sets the counter silently, bang emits
      10 then 11, setbang 5 emits 5 and the next bang emits 6; [doubledelta]
      float 10 emits doubledelta 10 then delta 10, float 13 emits doubledelta
      -7 then delta 3, bang repeats both; [list_sum] "all 1 2 3 4" emits length
      4 then sum 10, "all 10 20" emits length 2 then sum 30, "clear" emits
      nothing and "all 5 6" then emits length 2 then sum 11.  It finally checks
      that ekext-meta.pd, a help patch, README.txt and the BSD LICENSE are
      installed beside the externals.
    command: "./pd_ekext_test <package>/lib/pd-externals/ekext"

test_files:
  - path: "test_package/pd_ekext_test.c"
    test_type: "R34"
    harmonyos_specific: true
    assertion_count: 269

test_package_test_count: 1
consumer_assertion_count: 269
assertion_count: 269