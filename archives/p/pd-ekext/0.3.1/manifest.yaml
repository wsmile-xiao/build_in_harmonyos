# 版本级 manifest
# 文件位置: archives/p/pd-ekext/0.3.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.3.1"

# 软件名
software: "pd-ekext"

# 编译状态
# published | built | failed | archived
# built = conan verify/本地 conan create（含 test_package）通过，尚未 conan upload 到制品仓
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-04"

# 构建系统
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（Debian 官方源码池，R39）
  url: "https://deb.debian.org/debian/pool/main/p/pd-ekext/pd-ekext_0.3.1.orig.tar.xz"

  # 源码校验和
  sha256: "57abb9cb3f75883a535a90b6d903f550f227a275c5c293b679aedc65e3cab833"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

  # 上游发布位置（仅 GitHub tag，归档里 pd-lib-builder/ 为空，见 conandata.yml）
  upstream_tag: "https://github.com/pd-externals/ekext (tag v0.3.1)"
  upstream_contact: "Ed Kelly <morph_2016@yahoo.co.uk>"

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 构建选项（源码零改动，仅命令行覆盖 make 变量）
  configure_options:
    - 'system=Linux'
    - 'CC=<OHOS clang，来自 tools.build:compiler_executables>'
    - 'arch.c.flags=  # 清空 pd-lib-builder 对 aarch64 的 -mcpu=cortex-a53 猜测'
    - 'PDINCLUDEDIR=<puredata 包>/include/pd'
    - 'PDLIBDIR=/lib/pd-externals'

  # 编译依赖列表（格式: name/version）
  dependencies:
    - puredata/0.54.1

  # 编译器
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-fix-license-datafile-name.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Pd 外部对象的入口符号不是纯 setup：Pd 的 src/s_loader.c 会把类名按 C 符号规则 mangle（字母数字与 _ 原样、结尾 ~ 变 _tilde、其它字符 hex 成 0x?? 并把前缀换成 setup_），先 dlsym(<mangled>_setup) 再退回 dlsym(\"setup\")。所以 bmt~.pd_linux 导出的是 bmt_tilde_setup，测试必须复刻这段 mangle 才是真的在验 Pd 会调的符号"
  - "Pd 是 -rdynamic 链接的，外部对象 nm -D --defined-only 只看到 <mangled>_setup 与若干非 static 的类函数；它 import 的 Pd 符号实测共 38 个（class_new/class_add*/pd_new/outlet_*/gensym/atom_getfloat…），在测试里内嵌一份最小 Pd 运行时 shim 就能把 43 个对象全部 dlopen 并驱动"
  - "m_pd.h 把 class_addfloat(x,y) 定义成 class_doaddfloat((x),(t_method)(y)) 宏，所以外部对象 import 的是 class_doaddfloat，不是 class_addfloat；自带 shim 时必须 #undef 这四个宏（class_addbang/addfloat/addlist/addsymbol）否则函数定义会被宏吃掉"
  - "t_floatarg 在 PD_FLOATSIZE=32 下是 float 不是 double：测试里用 void(*)(void*,double) 去调一个收 float 的 Pd 方法，按 AAPCS 传的是 double，callee 读 w0 拿到的是 double 的低 32 位（3.0 → 0），断言会集体变错而不报 ABI 错"
  - "puredata/0.54.1 的 bin/pd 在 OHOS 运行环境里会报 __fd_chk: symbol not found（musl 版本不匹配），端到端 pd -lib 验证受阻；本次改用自带 Pd shim 的消费者测试，在 aarch64 OHOS 上不依赖 pd 进程即可验外部对象"
  - "pd-lib-builder 的 PDLIBDIR 是字符串拼接（installpath=$(DESTDIR)$(PDLIBDIR)/$(lib.name)），必须写成 /lib/pd-externals 而非 lib/pd-externals"
  - "pd-lib-builder 的 class.sources 列表就是一份完整的产物清单：配方 build() 用它反查 43 个 .pd_linux 是否都产出，避免缺类也照样打包成功"
  - "干净构建 0 error / 88 warning，全部是上游自带（未用参数、CLASS_MAINSIGNALIN 的空指针相减、phasorbars~.c 两处把赋值写成了相等比较、copyarray 未用 static 函数），未为消警而改上游代码，也未加 -Werror"