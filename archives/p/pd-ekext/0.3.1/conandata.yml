# conandata.yml — pd-ekext 0.3.1
#
# Source provenance (R39):
#   Upstream-Name   : ekext
#   Upstream-Contact: Ed Kelly <morph_2016@yahoo.co.uk>
#   Upstream release: https://github.com/pd-externals/ekext tag v0.3.1
#                     (= upstream commit of 2025-09-29, the same day Debian
#                     imported it; see pd-ekext_0.3.1-1.dsc)
#
#   Why the Debian pool copy and not the upstream GitHub tag archive:
#   upstream keeps `pd-lib-builder/` as a git *submodule*, and a GitHub tag
#   archive never contains submodule content, so
#   https://codeload.github.com/pd-externals/ekext/tar.gz/refs/tags/v0.3.1
#   (HTTP 200, 5014398 bytes,
#    sha256 1cfc8dbd906f7b37a8d2c804629125247fcec102a582ba7caa84371e89324670)
#   ships an *empty* pd-lib-builder/ directory and the build dies immediately
#   at `include $(PDLIBBUILDER_DIR)/Makefile.pdlibbuilder`.
#   Debian's multimedia-team Pd packaging substitutes that submodule with the
#   released pd-lib-builder tree, so
#   https://deb.debian.org/debian/pool/main/p/pd-ekext/pd-ekext_0.3.1.orig.tar.xz
#   is the only tarball of this exact upstream version that is self-contained.
#   Per R39 (deb.debian.org pool is the authoritative origin when upstream
#   publishes no usable release archive) it is the source used here.
#   Cross-check: the tarball's top level is byte-for-byte the same file set as
#   the upstream tag (43 C sources + Makefile + help patches), and its
#   pd-lib-builder/ carries Makefile.pdlibbuilder version 0.7.0 dated
#   2019-12-21, i.e. the released pd-lib-builder, not a local edit.
#   The platform task record for #9369 independently pins this same artifact:
#   it lists src = 57abb9cb...cb833, which is the leading/trailing 8 hex of this
#   tarball's sha256.

sources:
  "0.3.1":
    url: "https://deb.debian.org/debian/pool/main/p/pd-ekext/pd-ekext_0.3.1.orig.tar.xz"
    sha256: "57abb9cb3f75883a535a90b6d903f550f227a275c5c293b679aedc65e3cab833"

patches:
  "0.3.1":
    - patch_file: "patches/0001-fix-license-datafile-name.patch"
      patch_description: "Install the licence text: the Makefile lists LICENSE.txt in datafiles but the tarball ships the file as LICENSE, so `make install` aborts on `install: cannot stat 'LICENSE.txt'`"
      patch_type: "packaging"