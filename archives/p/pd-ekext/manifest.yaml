software: pd-ekext
display: "pd-ekext"
description: "ekext — Pure Data 外部对象集合（43 个类：节拍标记/相位条/包络直方图/马尔可夫链/掩码异或/MIDI 音名与音阶分析等），面向音乐信息检索与复音控制"
category: audio
homepage: "https://puredata.info/downloads/ekext"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游用 git submodule 引 pd-lib-builder，GitHub tag 归档里该目录是空的（构建第一步 include Makefile.pdlibbuilder 就失败），因此源码取 Debian 官方池的 pd-ekext_0.3.1.orig.tar.xz（Debian 打包时已把 submodule 替换为发布版 pd-lib-builder 0.7.0）——这也是平台任务 #9369 里 src=57abb9cb…cb833 指向的那份产物"
    - "pd-lib-builder 依 $(CC) -dumpmachine 选平台分支：OHOS clang 报 aarch64-unknown-linux-ohos，命中 linux 分支 → 产物名 pd_linux、-fPIC -shared -rdynamic；配方仍显式传 system=Linux，不让选择依赖构建主机"
    - "arch.c.flags 必须清空：pd-lib-builder 对 aarch64 的猜测是 -mcpu=cortex-a53（上游注释写着 not tested yet），交给 OHOS clang 自己的 aarch64 默认目标更稳"
    - "puredata/0.54.1 是 application 包，不导出 cpp_info.includedirs；配方从依赖 package_folder 解析 include/pd 并在 package_info() 里再导出一次，下游（含 test_package）才能编 Pd 代码"
    - "Pd 无可链接库（-rdynamic，插件的 Pd 符号在 dlopen 时从 Pd 进程映像解析），所以 43 个 .pd_linux 只链 -lc -lm"
    - "上游 Makefile 把 LICENSE.txt 列进 datafiles，但 tarball 里文件叫 LICENSE，不打补丁则 make install 报 install: cannot stat 'LICENSE.txt'"
  common_dependencies:
    - puredata

versions:
  - version: "0.3.1"
    status: built
    build_date: "2026-10-04"