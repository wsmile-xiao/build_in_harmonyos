software: perl-net-ip
display: "Net::IP"
description: "IPv4/IPv6 地址操作模块，提供 IP 地址解析、验证、压缩、展开、子网计算等功能"
category: perl
homepage: "https://metacpan.org/dist/Net-IP"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，使用 Makefile.PL (ExtUtils::MakeMaker) 构建"
    - "package() 需使用临时 DESTDIR + glob 查找 .pm 文件，复制到 lib/perl5/"
    - "package() 还需复制脚本 ipcount/iptab 到 bin/"
    - "package_info() 需设置 PERL5LIB 环境变量指向 lib/perl5/"
    - "无 C/XS 代码，不受 SELinux/HMDFS 限制，可直接安装使用"
    - "conan-verify G4 检查存在已知限制: conan cache path 返回 export 目录而非包二进制目录"
  common_dependencies:
    - perl/5.42.0

versions:
  "1.26-r7":
    status: published
    build_date: "2026-06-26"
    source_url: "https://cpan.metacpan.org/authors/id/M/MA/MANU/Net-IP-1.26.tar.gz"
