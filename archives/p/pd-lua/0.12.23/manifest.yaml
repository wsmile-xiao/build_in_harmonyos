# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.12.23/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.12.23"
software: "pd-lua"
status: built
build_date: "2026-09-30"
build_system: "makefile"

source:
  url: "https://github.com/agraef/pd-lua/archive/refs/tags/0.12.23.tar.gz"
  sha256: "79a76612983e6aaa2c28895d2fffc315e120ffe5b0b71a61258156cd0dbaa713"
  tar_format: tar.gz

build:
  system: makefile
  configure_options: []
  dependencies:
    - lua/5.4.8.1
    - puredata/0.54.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "pd-lua 是纯 Makefile 构建（Makefile.pdlibbuilder，无 configure）；tarball 的 lua/ 子目录为空，Makefile 走 pkg-config lua 分支，直接以 make 命令行覆盖 luaflags/lualibs 即可免去 lua.pc"
  - "pd 头文件（m_pd.h/s_stuff.h）位于 puredata 包 include/pd/（pd.pc 的 Cflags: -I${includedir}/pd）"
  - "puredata 配方 cpp_info.includedirs 为空，下游需用 dependencies['puredata'].package_folder 拼 include/pd 路径"
  - "HMDFS 上 make -jN 并行 jobserver mkfifo 被拒（Operation not permitted），必须 -j1"
  - "上游无 make check 目标（No rule to make target 'check'），测试以 headless Pd 逐个实例化示例外部替代"
  - "lua/5.4.8.1 制品仓同时存在旧修订的 non-PIC 静态包与新修订的 PIC 包，conan 解析到最新修订（PIC）；若再次出现 R_AARCH64_ADR_PREL_PG_HI21 链接错误需先 conan remove 旧二进制再拉取"
  - "pdlua.pd_linux 由 Pd dlopen 加载（-lib pdlua），属库/外部类型，无 bin/ 可执行产物，不需要 commands.json"
