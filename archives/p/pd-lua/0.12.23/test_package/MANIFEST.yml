# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: pd-lua/0.12.23
homepage: "https://github.com/agraef/pd-lua"

# 上游 pd-lua 0.12.23 无自动化测试套件：
# - 无 tests/ 目录（根目录仅 tutorial/ pdlua/ doc/ debian/）
# - Makefile/Makefile.pdlibbuilder 无 check/test 目标
# - `make check` 实跑报 "No rule to make target 'check'"
# 上游可运行测试 = tutorial/ 与 pdlua/ 下的示例外部（.pd_lua/.pd_luax）、
#   教程补丁（.pd）与 Lua 脚本（.lua），本次在 OHOS PC 上逐个实跑验证。
upstream_check_command: "make check (no such target; runs fail by design)"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: pdlua/examples/*.pd_lua + *.pd_luax (37 files: 32 .pd_lua + 5 .pd_luax)
    source: pd-lua-0.12.23/pdlua/examples/
    description: "headless Pd instantiates each example external via the pdlua loader"
    command: "pd -batch -nogui -nrt -lib pdlua <test-patch>"
  - file: pdlua/tutorial/examples/*.pd (14 patches)
    source: pd-lua-0.12.23/pdlua/tutorial/examples/
    description: "pd-lua-intro tutorial patches load and run (foo/fibs/loadtest/luatab/...)"
    command: "pd -batch -nogui -nrt -lib pdlua <patch>"
  - file: pdlua/hello.lua + pdlua/tutorial/examples/loadtest.lua + pdx.lua
    source: pd-lua-0.12.23/pdlua/
    description: "Lua scripts executed inside the pdlua runtime (hello/loadtest) and as a module (pdx)"
    command: "pd [pdlua load ...] / lua -e require('pdx')"
  - file: pdlua-help.pd / pdluax-help.pd
    source: pd-lua-0.12.23/
    description: "top-level help patches load and run the hello examples"
    command: "pd -batch -nogui -nrt -lib pdlua <patch>"

test_package_tests:
  - file: test_pdlua.c
    description: "end-to-end: boots headless pd with -lib pdlua and checks the loader banner + Lua version, then instantiates hello.pd_lua through the loader and verifies it executes"
    command: "./test_pdlua <pd-binary> <pdlua-install-dir>"

test_counting:
  # 实测上游可运行项：37 示例外部 + 14 教程补丁 + 3 Lua 脚本 + 2 顶层 help = 56
  upstream_independent_total: 56
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

assertion_count: 58
