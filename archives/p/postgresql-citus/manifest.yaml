software: postgresql-citus
display: "Citus"
description: "Distributed PostgreSQL extension — transforms Postgres into a distributed database"
category: db
homepage: "https://github.com/citusdata/citus"
license: AGPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "config.guess 需要 HarmonyOS 识别补丁 (aarch64-unknown-linux-ohos) [E007]"
    - "config.status 在 HMDFS 上因 mktemp 问题失败，需指定固定临时目录 [E011]"
    - "需要 cpp (C preprocessor) wrapper，使用 clang -E 替代 [E200]"
    - "SHELL=bash 必须设置，避免 musl sh heredoc 问题 [E200]"
  common_dependencies:
    - postgresql
    - lz4
    - zstd
    - curl

versions:
  "14.0.0":
    status: published
    build_date: "2026-06-10"