# test_package/MANIFEST.yml — planetblupi 1.15.1 上游测试声明
#
# 上游测试清点（R51 三步法）：
#   1) 上游 v1.15.1 tarball 含 resources/po/*.po 翻译文件与 CMake 构建体系，
#      但无 tests/ 目录、无 CTest 注册（enable_testing 未出现）；
#   2) CMakeLists.txt 无 add_test 调用（grep 实证 0 命中）；
#   3) 结论：上游无自动化测试套件，test_package 采用消费者验证替代。

package: planetblupi/1.15.1
homepage: "https://github.com/blupi-games/planetblupi"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_planetblupi_e2e.c
    description: "鸿蒙特有端到端消费者用例（rule12）：dlopen(planetblupi) 校验 ELF 动态结构 → fork+exec 真实运行 `planetblupi --help`（真实进程退出码断言，无图形路径）→ resources 资源目录消费验证（关卡/图形/声音目录可读）"
    command: "./test_planetblupi_e2e <planetblupi> <resources_dir>"

# 测试断言总数
assertion_count: 8
