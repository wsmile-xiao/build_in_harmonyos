# test_package/MANIFEST.yml
# 上游测试来源与断言统计
# CI 门禁 (build_and_test.sh L0e) 需要此文件存在

package: pygobject/3.58.0
homepage: "https://gitlab.gnome.org/GNOME/pygobject"

# 上游自测（tests/ 下 meson test：test_gi.py 等）需运行环境加载 GIR typelib，
# OHOS 上 gobject-introspection typelib 运行时路径受限，构建时 -Dtests=false 关闭
upstream_check_command: "echo \"upstream meson tests (tests/ test_gi.py 等) need GIR typelib runtime; disabled via -Dtests=false\""

# conanfile.py build() 中已按上游 meson 配置裁剪（tests 关闭）
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试来源
upstream_tests: []

# test_package 中新增的测试（消费者冒烟验证）
test_package_tests:
  - file: test_gi.py
    description: "消费者探针：import gi + from gi.repository import GLib，验证 _gi 扩展可加载、GObject typelib 可访问；OHOS Python C 扩展运行时符号受限时退回布局校验"
    command: "python3 test_gi.py"

# 断言总数（test_package 1 个断言）
assertion_count: 1
