software: pygobject
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.58.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.58.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: meson

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-08"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/GNOME/pygobject/archive/refs/tags/3.58.0.tar.gz"

  # 源码校验和
  sha256: "7bb205d4623c73ee654fe4ee6cb46f990f14cdf00b20118b058e92f415e8d29d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 编译器
compiler: clang

# 依赖列表（conan package refs 或系统包名）
requires:
  - "glib/2.84.0.1"
  - "gobject-introspection/1.78.1"
  - "libffi/3.4.4"

# 构建配置选项
build_options:
  - "-Dpycairo=disabled -Dtests=false -Dwheel=false"

# ============================================================
# 测试信息
# ============================================================

# 测试结果状态
# passed | failed | skipped | not_run
test_status: passed

# 测试说明
test_note: "上游 meson test（tests/ test_gi.py 等）需 GIR typelib 运行时，OHOS 受限已关闭；test_package 消费者探针（import gi + from gi.repository import GLib）验证扩展可加载、typelib 可访问"
