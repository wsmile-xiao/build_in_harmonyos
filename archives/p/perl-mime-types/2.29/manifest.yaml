software: perl-mime-types
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/2.29/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.29"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
compile_date: "2026-06-17"

# 构建系统类型（扁平字段，供 verify-build G4 检查）
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/MIME-Types-2.29.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器（纯 Perl 模块不涉及 C 编译）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁，纯 Perl 模块直接编译通过）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "MIME::Types 是纯 Perl 模块，使用 perl Makefile.PL + make 构建，无 C/XS 组件"
  - "纯 Perl 模块在鸿蒙平台无 SELinux 限制，可直接安装到 ~/usr/local 使用"
  - "types.db 使用 Storable 序列化格式，在 aarch64 平台正常加载"
  - "对比 perl-dbd-pg 的 XS 模块限制，纯 Perl 模块无需 ELF 签名和 HNP 安装包"
  - "模块自带测试套件 170 个测试全部通过，覆盖类型查找、Accept 头解析、导出功能"
