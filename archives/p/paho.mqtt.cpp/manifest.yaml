software: paho.mqtt.cpp
display: "Eclipse Paho C++"
description: "Eclipse Paho C++ client library for the MQTT protocol"
category: network
homepage: "https://github.com/eclipse/paho.mqtt.cpp"
license: EPL-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "默认构建静态 C++17 库并关闭 SSL、samples、examples 和 documentation。"
    - "上游 eclipse-paho-mqtt-c target 通过包内 CMake build module 兼容仓库 paho.mqtt.c target。"
    - "OHOS 无可达 MQTT broker 时显式排除 broker 标签用例，支持子集单独统计。"
    - "test_package/test_ohos.cpp 仅在 OHOS 构建，验证 HarmonyOS uname 与 Paho async_client consumer 初始化。"
  common_dependencies:
    - "paho.mqtt.c/1.3.14"
  ohos_build_constraint: "tools.build:jobs=1; HMDFS does not permit GNU make jobserver FIFO"

versions:
  "1.6.0":
    status: built
    build_date: "2026-09-10"
    conan_ref: "paho.mqtt.cpp/1.6.0"
