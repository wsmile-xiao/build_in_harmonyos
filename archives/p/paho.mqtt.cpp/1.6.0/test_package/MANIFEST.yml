name: test_paho_mqtt_cpp
version: "1.0"
description: "L1 test for paho.mqtt.cpp 1.6.0 — verifies C++ API and link integration"
language: C++
source: test.cpp

upstream_test:
  name: "message and connect_options API"
  file: "test/unit/test_message.cpp, test/unit/test_connect_options.cpp (upstream)"
  runner: "test/unit/unit_tests.cpp"
  description: "Consumer smoke test constructs connect_options and an MQTT message, then checks topic, payload, and QoS through the public C++ API."
  comparison: "Exercises the same public message/options API used by the upstream unit tests without requiring a broker."

upstream_tests:
  - file: "test/unit/*.cpp"
    source: "paho.mqtt.cpp-1.6.0/test/unit/"
    description: "Official Catch2 unit suite; source inventory contains 240 TEST_CASE-family test cases, with 231 compiled by the current CMake target. The 9 cases in test_ssl_options.cpp are not compiled because SSL is disabled; legacy test_async_client_v3.cpp uses CppUnit and is outside this Catch2 target."
    count_command: "rg -n '^[[:space:]]*(TEST_CASE|TEST_CASE_METHOD|TEMPLATE_TEST_CASE|TEMPLATE_PRODUCT_TEST_CASE|TEMPLATE_LIST_TEST_CASE|TEST_CASE_P)' test/unit --glob '*.cpp' | wc -l"
    command: "ctest --output-on-failure"
    result: "Default OHOS CTest: 194/194 supported cases passed; 37 [broker] cases explicitly excluded because no reachable MQTT broker was available; 0 failures. Supplemental local Mosquitto run: 231/231 compiled cases passed, 1470 assertions, 0 failures."

test_package_tests:
  - file: test.cpp
    description: "Consumer test: construct connect_options and an MQTT message, then verify topic, payload, and QoS."
    command: "./test_paho_mqtt_cpp"
    assertions: 3
  - file: test_ohos.cpp
    platform: OHOS
    description: "OHOS-only test: verify uname reports HarmonyOS and construct the Paho async_client consumer on the target runtime, checking its server URI and client id."
    command: "./test_paho_mqtt_cpp_ohos"
    assertions: 4

assertion_count: 7

validation:
  status: "built"
  consumer_result: "paho.mqtt.cpp API/link test: OK"
  ohos_specific_result: "paho.mqtt.cpp OHOS platform test: OK"
  dependency_release: >-
    R36 device preflight connected to Conan remote ohpcd and ran
    conan download "paho.mqtt.c/1.3.14" --only-recipe -r=ohpcd and
    conan download "catch2/2.13.10-r0" --only-recipe -r=ohpcd; both returned 0.
    Recipe revisions were 090a2e13b9cda856bb4f3bf1f71ea2ee and
    536c52afeab4ea7925bea4d71b59ec48; both reported already in cache after
    connecting to ohpcd, so the result is not described as a fresh download.
  evidence: "Exact W0/W3 run IDs, requested SHA, plan SHA, and raw logs are maintained in external hash-bound task evidence; this manifest avoids self-recording a run identity that would be invalidated by its own commit."
