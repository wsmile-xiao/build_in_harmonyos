software: paho.mqtt.cpp
version: "1.6.0"
status: built
build_date: "2026-09-10"
conan_ref: "paho.mqtt.cpp/1.6.0"
build_system: cmake

source:
  url: "https://github.com/eclipse/paho.mqtt.cpp/archive/refs/tags/v1.6.0.tar.gz"
  sha256: "73bdb408ae98812c5c2b7f00b2ae7c4fdb9798424abe5a7f7afb13c8fd462156"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DPAHO_BUILD_STATIC=TRUE"
    - "-DPAHO_BUILD_SHARED=FALSE"
    - "-DPAHO_WITH_SSL=FALSE"
    - "-DPAHO_BUILD_SAMPLES=FALSE"
    - "-DPAHO_BUILD_EXAMPLES=FALSE"
    - "-DPAHO_BUILD_TESTS=TRUE"
    - "-DPAHO_BUILD_DOCUMENTATION=FALSE"
    - "-DPAHO_WITH_MQTT_C=FALSE"
  dependencies:
    - "paho.mqtt.c/1.3.14"
  test_dependencies:
    - "catch2/2.13.10-r0"
  cc: clang
  cxx: clang++
  parallelism:
    ohos_jobs: 1
    rationale: "HMDFS does not permit GNU make jobserver FIFO; both package and consumer recipes force serial CMake builds."

patches_applied:
  - "0001-CMakeLists.txt-cmake-PahoMqttCppConfig.cmake.in.patch"
  - "0002-test-unit-test_async_client.cpp-test-unit-test_client.cpp.patch"

test_results:
  type: conan-verify
  counting:
    unit: "TEST_CASE-family registrations in test/unit/*.cpp"
    command: "rg -n '^[[:space:]]*(TEST_CASE|TEST_CASE_METHOD|TEMPLATE_TEST_CASE|TEMPLATE_PRODUCT_TEST_CASE|TEMPLATE_LIST_TEST_CASE|TEST_CASE_P)' test/unit --glob '*.cpp' | wc -l"
    source_total: 240
    current_cmake_target: 231
    ssl_not_compiled: 9
    broker_tagged: 37
  total: 240
  compiled: 231
  passed: 194
  skipped: 37
  not_compiled: 9
  failed: 0
  supplemental_broker_run:
    total: 231
    passed: 231
    failed: 0
    skipped: 0
    assertions: 1470
    endpoint: "127.0.0.1:1883"
  ohos_specific_test:
    total: 1
    passed: 1
    failed: 0
    name: "test_paho_mqtt_cpp_ohos"
  note: >-
    当前提交的 W3 设备证据保存在任务外的 hash-bound evidence 目录中；其中
    OHOS CTest 显式排除 37 个依赖 broker 的 [broker] 用例，支持子集 194/194
    通过，0 失败；启动临时本地 Mosquitto 后，未过滤的当前已编译目标为
    231/231、1470 assertions、0 失败。另有 1 个 OHOS-only test_package
    测试验证 HarmonyOS uname 与 Paho async_client consumer 初始化。最终清缓存轮
    的 conan-verify 另记录 G2/G3/G4/L2/L4/L5 结构化报告、package ID、package
    revision、包目录和产物清单 SHA-256。

verification:
  status: "built; CI and publication not completed"
  evidence: "Exact W0/W3 run IDs, requested SHA, plan SHA, and raw logs are maintained in external hash-bound task evidence."

knowledge_gained:
  - "上游 v1.6.0 的 CMake 默认项偏向 shared + SSL，本配方显式关闭二者以匹配 OHOS 现有 paho.mqtt.c/1.3.14 适配范围；上游 Catch2 单元测试显式打开。"
  - "上游查找 eclipse-paho-mqtt-c targets，而本仓库 Conan 包提供 paho.mqtt.c::paho.mqtt.c；补丁在配置阶段建立兼容别名。"
  - "上游 test/unit 中按 TEST_CASE 宏统计有 240 个 Catch2 测试用例，使用仓库已有 catch2/2.13.10-r0，仅作为 test-only 依赖。"
  - "paho.mqtt.c/1.3.14 包含 MQTTAsync.h 但缺少 cpp_info.includedirs；通过 paho.mqtt.cpp 包内 CMake build module 从 CMakeDeps package-folder 元数据恢复 include 路径。"
  - "OHOS 设备无默认可达 MQTT broker；37 个 broker 依赖用例显式标记并排除，194 个默认支持用例全部通过；临时本地 Mosquitto 下 231 个已编译用例全部通过。"
  - "test_package/test_ohos.cpp 仅在 CMAKE_SYSTEM_NAME=HarmonyOS/OHOS 时构建，验证 uname 系统标识及 Paho async_client consumer 初始化。"
