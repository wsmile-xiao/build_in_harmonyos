# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pathspec/0.6.0
homepage: "https://github.com/cpburnz/python-path-specification"

# 上游测试命令 — 测试位于包内（pathspec/tests/），unittest 风格，
# setup.py 中 test_suite='pathspec.tests'
upstream_check_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest pathspec/tests -q --assert=plain"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<src> python3 -m pytest pathspec/tests -q --assert=plain -p no:cacheprovider（pytest 不可用时回退 python3 -m unittest discover）"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - pathspec/tests/（3 个测试文件：test_gitwildmatch.py / test_pathspec.py /
#   test_util.py），unittest 风格，共 44 项
# - 实测结果：**42 passed, 2 skipped**（无失败）
# - 兼容性核验：pathspec/compat.py 在 py3.6+ 优先用 collections.abc.Collection，
#   仅 py2.7-3.5 才回退 collections.Container → py3.12 下无 import 障碍，
#   故本包无需源码补丁
upstream_tests:
  - file: pathspec/tests/
    source: pathspec-0.6.0/pathspec/tests/
    description: "上游 unittest 套件（3 个测试文件，44 项；实测 42 passed / 2 skipped，无失败）"
    command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=<src> python3 -m pytest pathspec/tests -q --assert=plain -p no:cacheprovider"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_pathspec.py
    description: "消费者测试：真实 API（R34）——gitwildmatch/gitignore 匹配语义、否定模式、Pattern.compile、anchored 模式 + py3.12 兼容契约"
    command: "python3 test_pathspec.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 14
