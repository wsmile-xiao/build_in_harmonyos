# test_package/MANIFEST.yml — pgbackrest 2.59.0 上游测试与消费者测试声明
#
# 上游测试入口：test/meson.build 用 meson 的 test() 注册了唯一一个测试套件 "smoke"
#   test('smoke', python, args: [files('smoke.py'), '--pgbackrest', pgbackrest_exe], suite: 'smoke', timeout: 1800)
# 发布用分发 tarball（根目录带 dist 标记）不包含 doc/src 与 test/src 的代码生成器，
# 因此发行包里的上游测试面就是这一套 smoke（对系统上发现的每套 PostgreSQL 跑一遍
# initdb → stanza-create → check → full backup → 加载数据 → incr backup → 抹掉数据目录
# → restore → 校验行数）。

package: pgbackrest/2.59.0
homepage: "https://pgbackrest.org"

upstream_check_command: "meson test"

upstream_test_in_build: true
upstream_test_command: "meson test -C <builddir> --print-errorlogs"

upstream_tests:
  - file: test/smoke.py
    source: pgbackrest-2.59.0/test/smoke.py
    description: "smoke 套件——针对每套可用 PostgreSQL 执行完整的备份/恢复循环并校验恢复后的行数"
    command: "meson test -C build --print-errorlogs smoke"

# test_package 中自带的消费者/平台断言（安装后的包树视角）
test_package_tests:
  - file: test.sh
    description: "消费者与平台断言：C1 --version / C2 version 命令 / C3 --help 命令表 / C4 非法选项被拒；H1 ELF64 小端 AArch64；H2 musl 动态加载器；P1 .codesign 段存在；P2 无 RPATH/RUNPATH"
    command: "bash test.sh (conanrun env)"

# 断言总数 = test.sh 中真实执行并校验的断言条数
assertion_count: 8

# 上游套件内建的超时（test/meson.build 的 timeout: 1800）
upstream_timeout_seconds: 1800
