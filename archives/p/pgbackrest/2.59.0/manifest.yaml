version: "2.59.0"
software: "pgbackrest"
status: built
build_date: "2026-09-28"
build_system: "meson"

source:
  url: "https://github.com/pgbackrest/pgbackrest/releases/download/release/2.59.0/pgbackrest-2.59.0.tar.gz"
  sha256: "faaf8faa14a6392279654ee216a493fcd07b0c513af4b55fe34faec062cb8875"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Dwrap_mode=nodownload"
    - "-Dlibssh2=enabled"
    - "-Dlibzstd=enabled"
    - "-Dlibsystemd=disabled"
  dependencies:
    - libpq/18.6
    - openssl/3.5.6.1
    - libxml2/2.15.3.1
    - lz4/1.10.0.3
    - zstd/1.5.7.1
    - bzip2/1.0.8.2
    - zlib/1.3.1.1
    - libssh2/1.11.1
  makedepends:
    - meson/1.11.0
    - postgresql/18.3
  cc: clang
  cxx: none

patches_applied:
  - "0001-meson-define-posix-c-source-on-harmonyos.patch"
  - "0002-smoke-test-loopback-tcp-and-numeric-uid.patch"

knowledge_gained:
  - "pgbackrest 2.59.0 用 Meson 构建；GitHub release 资产是 meson dist 产出的分发 tarball（根目录有 dist 标记），已随包携带生成的 help/interface 头，因此构建纯 C 核心不需要上游的代码生成工具链、libyaml，也不调用 Perl（上游文档/辅助脚本内嵌的 perl 只在 git 检出树里构建 doc/src、test/src 时才需要）"
  - "Meson 把 OHOS 目标报成 host_machine.system()='harmonyos'，上游只对 'linux' 定义 _POSIX_C_SOURCE=200809L，导致 gmtime_r/localtime_r/nanosleep 未声明——按平台补一个分支即可"
  - "上游 meson.build 用 cc.find_library('bz2')，不走 pkg-config；Conan 侧必须把 bzip2 的 include/lib 目录显式加进编译器与链接参数"
  - "Conan 的 lz4 包提供的是 lz4.pc，而上游找的是 liblz4；生成一个转发 .pc 即可"
  - "OHOS 上 AF_UNIX bind() 返回 EPERM（postgresql/18.3 归档已记录同一限制），因此上游 smoke 套件必须改走 127.0.0.1 回环 TCP 才能起 PostgreSQL"
  - "OHOS 应用 uid（20000000+）没有 /etc/passwd 记录，pwd.getpwuid() 抛 KeyError；PostgreSQL 自身对同样情况回退到数字 uid，smoke 套件的 run user 需同样回退"
  - "meson install 会重写 RUNPATH，导致链接器写进 .codesign 段的签名失效，OHOS 拒绝执行（EPERM）；安装后必须用 binary-sign-tool 以 -selfSign 1 重新签名"
  - "pgbackrest restore 会校验目标目录属主必须等于 geteuid()；HMDFS 的 /storage 挂载对新文件上报的属主是 20001006，因此 smoke 套件的工作目录要落在上报真实 uid 的目录（如 /data/storage/el2/base）"

test_results:
  type: official
  total: 1
  passed: 1
  failed: 0
  reason: "上游 smoke 套件（meson test 注册的唯一测试）在 OHOS 上真实执行 1/1 通过；test_package 消费者/平台断言 8/8 通过"

# 扁平键（submission 审计读取口径）
