sources:
  url: "https://github.com/pgbackrest/pgbackrest/releases/download/release/2.59.0/pgbackrest-2.59.0.tar.gz"
  sha256: "faaf8faa14a6392279654ee216a493fcd07b0c513af4b55fe34faec062cb8875"

patches:
  "2.59.0":
    - patch_file: "patches/0001-meson-define-posix-c-source-on-harmonyos.patch"
      patch_description: "Define _POSIX_C_SOURCE=200809L for the harmonyos target so the POSIX 2008 interfaces (gmtime_r, localtime_r, nanosleep) are declared"
      patch_type: "portability"
    - patch_file: "patches/0002-smoke-test-loopback-tcp-and-numeric-uid.patch"
      patch_description: "Run the upstream smoke suite on HarmonyOS: fall back to the numeric uid when /etc/passwd has no entry and reach PostgreSQL over loopback TCP because AF_UNIX bind() is denied"
      patch_type: "portability"
