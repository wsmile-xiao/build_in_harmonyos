software: pgbackrest
display: "pgBackRest"
description: "Reliable PostgreSQL backup and restore (command line tool)"
category: db
homepage: "https://pgbackrest.org"
license: "MIT"
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 把 OHOS 目标报成 harmonyos，需要为 host_machine.system()='harmonyos' 补 _POSIX_C_SOURCE=200809L"
    - "上游用 cc.find_library('bz2') 找 bzip2，需把 Conan bzip2 的 include/lib 目录显式注入 Meson 的 c_args/c_link_args"
    - "上游找 liblz4，Conan lz4 包提供 lz4.pc，用一个转发 .pc 桥接"
    - "OHOS 拒绝 AF_UNIX bind()（EPERM），上游 smoke 套件改走回环 TCP"
    - "OHOS 应用 uid 无 /etc/passwd 记录，用户识别需回退到数字 uid"
    - "meson install 重写 RUNPATH 会使 .codesign 签名失效，安装后须用 binary-sign-tool 重新签名"
  common_dependencies:
    - libpq
    - openssl
    - libxml2
    - libssh2
    - lz4
    - zstd
    - bzip2
    - zlib

versions:
  "2.59.0":
    status: built
    build_date: "2026-09-28"
