# test_package/MANIFEST.yml — perl-xml-sax 1.02
# CI L0e requires this file to exist.

package: perl-xml-sax/1.02
homepage: "https://metacpan.org/pod/XML::SAX"

# 上游测试套件：t/ 目录 16 个 .t 文件（113 个断言，本地 make test
# 注入依赖 PERL5LIB 后实测 113/113 通过）
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: "t/00basic.t"
    count: 113

# test_package 自带的验证（消费者视角）
test_package_verification:
  - command: "perl -e 'use XML::SAX::Exception; ...'"
    expect: "OK: XML::SAX::Exception API ok"
