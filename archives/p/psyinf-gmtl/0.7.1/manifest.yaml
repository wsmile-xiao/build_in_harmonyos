known_issues:
  - "上游测试套件与其自身头文件脱节（0.7.1 冻结后未同步）：AABoxTest.cpp 引用已改名的 AABox::mEmpty、SphereTest.cpp 把 unsigned int& 形参写成 int、OutputTest.cpp 的 AABox 流输出期望值仍按旧 mEmpty 取反语义。补丁内已按语义修正，未改动 gmtl/ 下任何库头文件"
  - "CppUnit 1.12.x 之后删除了 MetricRegistry 与全部 CPPUNIT_METRIC_* 宏，GMTL 0.7.1 中 CPPUNIT_METRIC* 宏仍出现 596 次（涉及 29 个文件）；补丁新增兼容头让 metric 套件得以真实注册并参与编译（而非删除用例）；但本配方执行的 `noninteractive` 路径不运行它们，217 条不计入通过率"
  - "上游 Test/TestSuite/TestCases/ParametricCurveTest.cpp 不在 TestCases/SConscript 清单内（且其 include 的 ParametriCurveTest.h 拼写错误、文件不存在），上游从不编译；本配方忠实复现上游清单，同样不编译"
