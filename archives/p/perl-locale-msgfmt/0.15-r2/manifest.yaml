software: perl-locale-msgfmt
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.15-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.15-r2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-13"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/A/AZ/AZAWAWI/Locale-Msgfmt-0.15.tar.gz"

  # 源码校验和
  sha256: "c3276831cbeecf58be02081bcc180bd348daa35da21a7737b7b038a59f643ab4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl -I. Makefile.PL PREFIX=$DEFAULT_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: N/A
  cxx: N/A

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 Perl 模块不需要补丁，Makefile 由 Makefile.PL 动态生成（R6: 不改生成文件）

# Perl 模块构建提示
build_hints:
  perl_makefile_pl_args: "-I. Makefile.PL PREFIX=$DEFAULT_PREFIX"
  reason: "Module::Install DSL 需要 -I. 参数来找到 inc 目录中的模块；PREFIX 而非 INSTALL_BASE 使模块安装到 site_perl 路径（Perl @INC 可自动搜索）"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 Module::Install DSL 构建系统，无需 configure 步骤"
  - "Perl 模块安装路径: ~/usr/local/lib/site_perl/5.42.0/（PREFIX 参数）"
  - "鸿蒙 Perl @INC 不含 ~/usr/local 路径，必须在 .zshrc 设置 PERL5LIB"
  - "Makefile 是 Makefile.PL 生成的文件，不应作为补丁（R6）"
  - "构建参数 -I. 用于让 Module::Install DSL 找到 inc 目录"

# 补丁生成信息已移除（纯 Perl 模块无源码级补丁，Makefile 为生成文件）
