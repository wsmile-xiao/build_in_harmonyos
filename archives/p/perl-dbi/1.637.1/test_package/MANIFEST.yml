# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-dbi/1.637.1
homepage: "https://metacpan.org/dist/DBI"

# 上游测试命令 (Perl Makefile.PL 测试体系)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/*.t
    source: DBI-1.637/t/
    description: "DBI 上游测试套件"
    command: "perl -Mblib t/*.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.py
    description: "验证包产物完整性 (.so ELF + .pm 存在性)"
    command: "python3 test_package.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
