software: perl-dbi
display: "Perl DBI (Database Interface)"
description: "Perl database interface module - DBI"
category: db
homepage: "https://dbi.perl.org/"
license: "Perl Artistic License"
build_system: perl_xs

ohos_adaptation:
  key_points:
    - "Perl XS 模块编译需要 musl 头文件: CCFLAGS=-I$DEFAULT_PREFIX/include"
    - "系统缺少 CRT 文件，链接需要 -nostartfiles -nodefaultlibs"
    - "XS 模块无法在 HMDFS 加载，DBI::PurePerl 模式可用"
    - "编译有 306 个 STMT_START/STMT_END 宏警告，不影响功能"
  common_dependencies:
    - perl/5.42.0

versions:
  "1.637":
    status: archived
    build_date: "2026-06-10"
    source_url: "http://www.cpan.org/authors/id/T/TI/TIMB/DBI-1.637.tar.gz"
  "1.637.1":
    status: built
    build_date: "2026-09-07"
    source_url: "https://cpan.metacpan.org/authors/id/T/TI/TIMB/DBI-1.637.tar.gz"