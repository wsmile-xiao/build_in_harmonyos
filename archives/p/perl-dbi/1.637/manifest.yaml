software: perl-dbi
# 版本级 manifest 模板
# 文件位置: archives/p/perl-dbi/1.637/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.637"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://www.cpan.org/authors/id/T/TI/TIMB/DBI-1.637.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl_xs
  system: perl_xs
  build_system: perl_xs

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX"
    - "make"
    - "make install"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块编译需要 musl 头文件: CCFLAGS=-I$DEFAULT_PREFIX/include"
  - "系统缺少 CRT 文件，链接需要 -nostartfiles -nodefaultlibs"
  - "perl Makefile.PL 不能同时使用 PREFIX 和 INSTALL_BASE"
  - "XS 模块无法在 HMDFS 加载，DBI::PurePerl 模式可用"
  - "编译有 306 个 STMT_START/STMT_END 宏警告，不影响功能"