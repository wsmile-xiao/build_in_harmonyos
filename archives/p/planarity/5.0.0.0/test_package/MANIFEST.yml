# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: planarity/5.0.0.0
homepage: "https://github.com/graph-algorithms/edge-addition-planarity-suite"

# 上游测试命令（autotools：Makefile.am 的 TESTS = test-samples.sh）
# `make check` 经 automake test-driver 运行 test-samples.sh，
# 后者调用 `./planarity -test <abs_top_srcdir>/c/samples`。
upstream_check_command: "make check"

# conanfile.py build() 方法中已集成上游测试（autotools.make(target="check")）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试程序（框架注册数 = 1，见 PR 说明的计数口径）
upstream_tests:
  - file: test-samples.sh.in
    source: planarity-5.0.0.0/test-samples.sh.in
    description: "autotools TESTS 注册的唯一测试程序；驱动 ./planarity -test c/samples 执行完整上游回归（1-based/0-based 嵌入与障碍隔离、g6/邻接表/邻接矩阵图变换比对、n8.mALL.g6 全图批量）"
    command: "./planarity -test c/samples"

# test_package 中自带的测试（消费者视角验证，鸿蒙特有）
test_package_tests:
  - file: test_planarity.c
    description: "libplanarity 公共 API 消费者断言测试（42 条断言：图解析/程序化构图/平面性判定/平面与外平面嵌入/Kuratowski 障碍子图隔离/嵌入完整性校验/图序列化）"
    command: "./test_planarity"
  - file: test_cli.sh
    description: "planarity CLI 消费者测试（7 条断言：-h 帮助与版本、安装树 samples 上完整上游 -test、平面/非平面功能性出口码）"
    command: "bash test_cli.sh"

# 测试断言总数（42 库消费者 + 7 CLI 消费者 = 49）
assertion_count: 49
