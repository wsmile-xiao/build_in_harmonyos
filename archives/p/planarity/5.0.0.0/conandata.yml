# conandata.yml — planarity 5.0.0.0
# 源码：上游官方 GitHub Release 资产；镜像回退由 CI 自动追加，故只登记官方源。
# 补丁：由 refresh-patch --auto 从编辑追踪器生成（对原始树逐字节可复现）。

sources:
  url: "https://github.com/graph-algorithms/edge-addition-planarity-suite/releases/download/Version_5.0.0.0/planarity-5.0.0.0.tar.gz"
  sha256: "8aa3958f92e3fbbc63815e5b6b454abe40889af5aa35da8306659c58ec16a2d0"

patches:
  - patch_file: "patches/0001-c-planarityApp-planarityCommandLine.c.patch"
    patch_description: "Accept GNU-style --help / --version long options (standard CLI smoke-test compatibility; upstream only had -h/-help)"
    patch_type: "portability"
  - patch_file: "patches/0002-config.guess.patch"
    patch_description: "config.guess: add a HarmonyOS system-identification case so configure guesses aarch64-unknown-linux-ohos (E007; POSIX shell only, no platform macro)"
    patch_type: "portability"
  - patch_file: "patches/0003-config.sub.patch"
    patch_description: "config.sub: accept the linux-ohos triplet (E007)"
    patch_type: "portability"
  - patch_file: "patches/0004-configure.patch"
    patch_description: "configure: create config.status temp dirs with umask 022 instead of 077 (HMDFS setgid + owner mapping makes drwx--S--- unwritable; E011/E129)"
    patch_type: "platform"
