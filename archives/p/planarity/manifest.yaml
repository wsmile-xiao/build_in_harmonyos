# 软件级 manifest — planarity
# 遵循 ARCHIVE-SPEC v2.0

software: planarity
display: "Edge Addition Planarity Suite"
description: "图的平面性判定/平面嵌入/障碍子图隔离与平面绘制算法套件 — libplanarity 图算法库 + planarity 命令行工具"
category: library
homepage: "https://github.com/graph-algorithms/edge-addition-planarity-suite"
license: BSD-3-Clause
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "config.guess/config.sub 无 HarmonyOS 分支 → `cannot guess build type`；用官方 scripts/patch-autotools-ohos.pl 打补丁，使 config.guess 输出 aarch64-unknown-linux-ohos（E007）"
    - "configure 生成 config.status 时用 `umask 077 && mktemp -d ./confXXXXXX`；HMDFS 会把新目录置 setgid 且属主映射为 20001006，drwx--S--- 目录连创建者都写不进去 → `can't create ./confXXXXXX/subs1.awk: Permission denied`（E011/E129）；补丁把 configure 内两处 umask 077 改为 022"
    - "libtool 默认同时产出共享库与静态库；配方按 shared 选项显式 --enable/disable-static/shared"
    - "CLI 与库同名同包：bin/planarity + lib/libplanarity.{a,so} + include/planarity/ + pkgconfig/libplanarity.pc，属 CLI 包，软件级 commands.json 必需（R38）"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "5.0.0.0":
    status: built
    build_date: "2026-09-16"
