# test_package/MANIFEST.yml — perl-file-which 1.27
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-file-which/1.27
homepage: "https://metacpan.org/pod/File::Which"

# 上游测试套件：t/ 目录 3 个 .t 测试文件（prove -lr t/ 递归运行）
# 注：prove -l t/ 的 -l 只加 lib 路径、不递归子目录——须 -lr 全量递归；
# 评审 rule 3 按 t/ 下 .t 文件数（3）核验声明 N，此处文件数/断言数分列。
upstream_check_command: "prove -lr t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/00_diag.t
    source: File-Which-1.27/t/00_diag.t
    description: "诊断检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/00_diag.t"
  - file: t/01_use.t
    source: File-Which-1.27/t/01_use.t
    description: "加载检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/01_use.t"
  - file: t/file_which.t
    source: File-Which-1.27/t/file_which.t
    description: "主功能测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/file_which.t"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 File::Which + which 解析真实可执行文件）
test_package_tests:
  - file: test_file_which.py
    description: "Loads packaged File::Which via perl -I<lib> and resolves a real executable (perl) from PATH via which()"
    command: "python3 test_file_which.py"

# 断言总数：1（which 解析校验）
assertion_count: 1
