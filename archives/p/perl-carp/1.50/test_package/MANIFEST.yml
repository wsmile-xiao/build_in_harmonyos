# test_package/MANIFEST.yml — perl-carp 1.50
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-carp/1.50
homepage: "https://metacpan.org/pod/Carp"

# 上游测试套件：t/ 目录 18 个 .t 测试文件（prove -l t/ 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Carp-1.50/t/*.t
    description: "18 个 .t 测试文件：本地实测 **210/210（100%）**（prove -l t/，全部运行，零失败）"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Carp + croak 真实调用）
test_package_tests:
  - file: test_carp.py
    description: "Loads packaged Carp via perl -I<lib> and calls croak(), asserting the error message contains the expected text"
    command: "python3 test_carp.py"

# 断言总数：1（croak 调用校验）
assertion_count: 1
