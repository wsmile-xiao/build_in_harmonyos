# 软件级 manifest — palp
# 遵循 ARCHIVE-SPEC v2.0

software: palp
display: "PALP"
description: "格点多胞形分析工具集 — 计算多胞形的顶点/格点/面、反射性、Newton 多面体分类，环面几何与 Calabi-Yau 研究的标准工具"
category: math
homepage: "http://hep.itp.tuwien.ac.at/~kreuzer/CY/"
license: GPL-2.0-or-later
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 GNU Makefile 项目，无 configure；GNUmakefile 的 `all-dims` 目标已展开「5 个程序 × 4 个维度」的构建矩阵，不必照 sage 的 spkg-install 自己 sed Global.h 循环 5 遍"
    - "POLY_Dmax 是编译期常量，同一份 .o 不能跨维度复用（用 POLY_Dmax=4 编的目标文件链进 foo-11d.x，程序只有 ≤4 维的代码），故 25 个可执行文件缺一不可，package() 逐个硬核对"
    - "CFLAGS 不得含 -DNDEBUG：源码在 assert() 里写了有副作用的表达式，NDEBUG 会整条预处理掉、改变程序语义（上游 spkg-install.in 专门 sed 掉它）"
    - "需要 GNU make ≥ 3.82（`define VAR =` 语法），老 make 报 \"No rule to make target 'poly-d.x'\"，措辞看不出真因；build() 里先打印 make 版本"
    - "产可执行文件的包必须对 bin/ 下 ELF 做 XPM 自签，否则设备上 exec 报 Permission denied"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.21":
    status: built
    build_date: "2026-08-16"
    notes: >-
      passagemath 系列（passagemath-palp）适配鸿蒙 PC 所需的 C 底座；wheel 把
      bin/{class,cws,mori,nef,poly}*.x 整组塞进 sage_wheels/bin/。
      test_package 用上游 tests/2.1 的例子做真实断言（poly.x 与 poly-11d.x 输出恒为 M:6 3 F:3）。
