software: perl-io-string
# 版本级 manifest
# 文件位置: archives/p/perl-io-string/1.08/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.08"

# 编译状态
# published | built | failed | archived
status: published
# 注：纯 Perl 模块，功能验证通过（64/64 测试通过），已发布到 cmd-pkgs

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/G/GA/GAAS/IO-String-1.08.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl
  build_system: perl-Makefile.PL

  # 配置选项列表
  configure_options:
    - "INSTALL_BASE=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器（纯 Perl 模块无需编译器）
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "IO::String 是纯 Perl 模块，无需 XS 编译"
  - "使用 INSTALL_BASE 参数指定 Perl 模块安装路径"
  - "DESTDIR 模式可用于 Perl 模块打包"