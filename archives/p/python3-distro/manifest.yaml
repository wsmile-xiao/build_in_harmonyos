software: python3-distro
display: "python3-distro (distro)"
description: "Linux/Unix OS distribution information API (os-release / *-release / lsb_release parsing)"
category: tool
homepage: "https://github.com/python-distro/distro"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure Python sources (src/distro) installed under lib/python3.12/site-packages, noarch pattern (alabaster precedent)."
    - "console_script entry point distro=distro.distro:main packaged into bin/; python -m distro also works."
    - "Upstream 158-case pytest suite measured on OHOS: 1 passed, 233 skipped by upstream IS_LINUX guard (sys.platform=='ohos'); root_dir simulation classes re-asserted in test_package (12/12 pass)."
    - "Host detection on OHOS returns empty values (no /etc/os-release) — unknown branch, expected platform behavior, not a defect."
  common_dependencies: []

versions:
  "1.9.0":
    status: published
    build_date: "2026-09-05"
    path: archives/p/python3-distro/1.9.0
