knowledge_gained:
  - "python3-distro 是纯 Python 发行版识别库（src/distro 布局），setuptools 后端，pip install --prefix staging 即可打包（alabaster noarch 模式）"
  - "上游 158 测试用例中 root_dir 模拟解析类平台无关，test_package 携带 resources/distros 子集（arch/ubuntu14/centos7/centos5）在 OHOS 执行同源断言"
  - "OHOS sys.platform=='ohos'：上游 IS_LINUX 门卫（startswith('linux')）跳过 233 项；库本机无 /etc/os-release 走 unknown 分支返回空值——合理平台行为非缺陷"
  - "console_scripts 入口 distro=distro.distro:main 随包安装到 bin/，python -m distro 亦可用（__main__.py）"
  - "本机 pip-global 环境可能已装同名 distro——test_package 用首参传 site-packages 并在测试脚本内 sys.path.insert(0) 保证被测包优先"

