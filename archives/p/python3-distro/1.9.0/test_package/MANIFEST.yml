# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: python3-distro/1.9.0
homepage: "https://github.com/python-distro/distro"

# 上游测试命令（GitHub Makefile: test -> pytest tests/）——OHOS 本地实测见
# reports/test-report.md：1 passed, 233 skipped（IS_LINUX 门卫：OHOS
# sys.platform=='ohos' 不以 'linux' 开头，host 相关用例被上游跳过）
upstream_check_command: "python3 -m pytest tests/test_distro.py -v"
upstream_test_in_build: false
upstream_test_command: ""

# 补全测试说明：上游 158 用例中 root_dir 模拟解析类平台无关，
# test_package 携带上游 resources 子集在 OHOS 上执行同源断言
supplementary_tests:
  - file: test_package/test_distro_consumer.py
    count: 12
    description: >-
      import 与版本校验、os-release 解析（arch/ubuntu14/centos7：id/name/
      version/like/codename/version_parts/os_release_attr）、distro-release
      文件解析（centos5 无 os-release 场景）、unknown 发行版空值语义、
      best_version 语义、repr、linux_distribution() 兼容 API、
      OHOS 本机行为（无 /etc/os-release 走 unknown 分支不抛异常）、
      CLI 入口（python -m distro rc=0）。
