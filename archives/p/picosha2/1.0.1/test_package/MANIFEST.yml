# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: picosha2/1.0.1
homepage: "https://github.com/okdshin/PicoSHA2"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "cmake -DPICOSHA2_TEST=ON && ctest"

# conanfile.py build() 方法中是否已集成上游测试（header-only：无 build()，测试在本地 gate 运行）
upstream_test_in_build: false
upstream_test_command: "cmake --build build && ./build/test/unittest (cwd=test/)"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test.cpp
    source: PicoSHA2-1.0.1/test/test.cpp
    description: "SHA-256 官方向量测试（10 组 NIST/RFC 字符串 + 增量 hash256_one_by_one 一致性，202 断言全部通过）"
    command: "./unittest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_picosha2.cpp
    description: "消费者测试：include picosha2.h，对 NIST/RFC 4 组已知向量断言 hash256_hex_string 输出（R34 真实调用接口）"
    command: "./test_picosha2"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 206