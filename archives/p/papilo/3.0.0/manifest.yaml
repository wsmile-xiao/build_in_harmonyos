software: papilo
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-16"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/scipopt/papilo/archive/refs/tags/v3.0.0.tar.gz"

  # 源码校验和
  sha256: "04e2437c41404782fa31cd74a881b475d75a6e692e4c88a24bf48cf5d263a93d"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake
  build_system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DBOOST_ROOT=/storage/Users/currentUser/usr/local"
    - "-DTBB=off"
    - "-DGMP=on"
    - "-DGMP_DIR=/storage/Users/currentUser/usr/local"
    - "-DQUADMATH=off"
    - "-DBUILD_TESTING=off"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
