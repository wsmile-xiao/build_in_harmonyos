# 软件级 manifest 模板
# 文件位置: archives/p/papilo/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: papilo

# 显示名
display: "PaPILO - Parallel Presolve for Integer and Linear Optimization"

# 一句话描述
description: "C++ header-only library providing parallel presolve routines for MIP and LP problems"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: library

# 官网 URL
homepage: "https://scipopt.org/"

# 开源许可证（SPDX 标识）
license: LGPL-3.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "系统未知（HarmonyOS），cmake 会警告但可继续"
    - "TBB 默认未安装，建议使用 -DTBB=off 或安装 TBB"
    - "GMP 需手动指定路径（-DGMP_DIR=/path/to/gmp）"
    - "单元测试链接失败（libc++ 符号缺失），建议禁用测试 -DBUILD_TESTING=off"
    - "Boost iostreams/serialization/program_options 未找到，可执行文件不会构建"

  # 跨版本通用依赖
  common_dependencies:
    - boost
    - gmp

# ============================================================
# 版本索引
# ============================================================

versions:
  "3.0.0":
    status: built
    build_date: 2026-06-16