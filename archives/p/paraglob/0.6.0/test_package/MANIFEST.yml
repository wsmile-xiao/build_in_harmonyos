# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: paraglob/0.6.0
homepage: "https://github.com/zeek/paraglob"

# 上游无 autotools/meson/ctest 测试目标：测试面是 btest 套件
# （testing/driver/* + testing/Baseline/*，由 btest.cfg 驱动），
# 被测程序是本包安装的 bin/paraglob-test。
upstream_check_command: "btest -c testing/btest.cfg -d   # TestDirs=driver，4 个用例"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: testing/driver/basic_matches
    source: paraglob-0.6.0/testing/driver/basic_matches
    description: "2 条 @TEST-EXEC（paraglob-test -n ... > out；btest-diff out）"
    command: "btest-diff out"
  - file: testing/driver/empty_patterns
    source: paraglob-0.6.0/testing/driver/empty_patterns
    description: "2 条 @TEST-EXEC（paraglob-test -n ... > out；btest-diff out）"
    command: "btest-diff out"
  - file: testing/driver/serial
    source: paraglob-0.6.0/testing/driver/serial
    description: "4 条 @TEST-EXEC（两条 paraglob-test -s 产出 + 两条 btest-diff）"
    command: "btest-diff out / btest-diff out2"
  - file: testing/driver/time
    source: paraglob-0.6.0/testing/driver/time
    description: "2 条 @TEST-EXEC（paraglob-test -b 10000 20000 10 3 > out；btest-diff out）"
    command: "btest-diff out"

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_paraglob.cpp
    description: "库消费者 7 条 API 断言（A1-A5 + A6a/A6b）：README 示例计数 / 上游两条基线计数 / 无匹配空集 / 序列化往返等价 / add+compile 路径"
    command: "./test_paraglob"
  - file: test_package/test_cli.sh
    description: "CLI 消费者 4 条断言（C1-C4）：直跑安装的 paraglob-test，期望值逐条对齐上游 btest Baseline"
    command: "sh test_cli.sh <pkg>/bin"

# 测试断言总数（用于质量评估）：库消费者 7 + CLI 消费者 4 = 11
assertion_count: 11
