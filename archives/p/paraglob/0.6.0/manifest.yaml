# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "init-build 把上游根目录的 CMake 便捷包装 ./configure 误判为 autotools（_detect_build_system 中 BUILD_SYSTEM env 优先级高于 manifest.build.system，错误值被固化）；须先把 manifest build_system/build.system 改 cmake 并显式 export BUILD_SYSTEM=cmake 再跑 conan-init" # knowledge_ref: E707
  - 'btest-diff 硬编码 /tmp/test-diff.$$.tmp（第 189/204 行），/tmp 只读设备上 btest 套件恒 4/4 失败于 TEST_DIFF_CANONIFIER——规范化输出写不进去、比对从未执行；处置=任务私有副本把 /tmp/ 改为 ${TMPDIR:-/tmp}/，原 conan 缓存文件不动' # knowledge_ref: E706
  - "上游 driver.time 是墙钟性能阈值断言（paraglob-test -b 10000 20000 10 3 要求 build+search <= 3s），非功能断言；aarch64 实测合计 3.028-3.068s 骑在阈值上，Passed/Failed 随 std::random_device 随机工作负载抖动（20 连跑 2/20）；归因+替代验证口径见 notes.md 非 PASS 段" # knowledge_ref: E708
