# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pcg-c/0.94
homepage: "https://www.pcg-random.org"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: test-low/run-tests.sh
    source: pcg-c-0.94/test-low/run-tests.sh
    description: "Low-level PCG variant tests (60+ check-* executables)"
    command: "cd test-low && sh run-tests.sh"
  - file: test-high/run-tests.sh
    source: pcg-c-0.94/test-high/run-tests.sh
    description: "High-level PCG API tests (20+ check-pcg* executables)"
    command: "cd test-high && sh run-tests.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "消费者测试: PCG32 基本随机数生成"
    command: "./test_pcg-c"

# 测试断言总数 (近似值, 用于质量评估)
# 上游有 80+ 测试可执行文件，每个测试多个随机序列，断言数 > 1000
assertion_count: 1000
