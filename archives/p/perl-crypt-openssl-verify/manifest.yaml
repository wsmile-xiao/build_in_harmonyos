software: perl-crypt-openssl-verify
display: "Crypt::OpenSSL::Verify"
description: "OpenSSL X509 certificate verification (Perl XS module)"
category: crypto
homepage: "https://metacpan.org/dist/Crypt-OpenSSL-Verify"
license: "Artistic-1.0-Perl OR GPL-1.0-or-later"
build_system: custom

ohos_adaptation:
  key_points:
    - "Crypt::OpenSSL::Guess 不可用, 补丁内联检测 OpenSSL 版本和路径"
    - "OHOS SELinux 阻止 dlopen tmpfs 上的 .so (hmdfs 上下文), 需部署到 /data/service/hnp/ 系统目录"
    - "L4 扫描器 NX=disabled 为误报, readelf 确认 GNU_STACK=RW"
    - "通过 OPENSSL_PREFIX 环境变量传递 OpenSSL 安装路径"
  common_dependencies:
    - openssl
    - perl
    - perl-crypt-openssl-x509

versions:
  "0.36-r2":
    status: built
    build_date: "2026-07-06"
