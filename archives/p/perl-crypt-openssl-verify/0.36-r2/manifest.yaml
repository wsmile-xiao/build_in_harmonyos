knowledge_gained:
  - "Bypass Crypt::OpenSSL::Guess by inline OpenSSL version detection (openssl version command) and $ENV{OPENSSL_PREFIX} path resolution"
  - "OHOS SELinux blocks dlopen of .so files with hmdfs context (tmpfs); only hnp_file context (/data/service/hnp/) allows dlopen — deployment must install to system Perl lib dir"
  - "conan-verify L4 scanner reports NX=disabled as false positive; readelf -lW confirms GNU_STACK=RW (NX enabled), matching system Perl .so"
  - "Conan 2.x generate() should use buildenv_info to set OPENSSL_PREFIX/LD_LIBRARY_PATH/PERL5LIB/CC/CXX"
  - "package_info() should declare OpenSSL system library dependencies (ssl, crypto) via system_libs"
  - "Patch LDFLAGS: add -Wl,-z,noexecstack -Wl,-z,relro -Wl,-z,now for explicit security flags in Makefile.PL"

