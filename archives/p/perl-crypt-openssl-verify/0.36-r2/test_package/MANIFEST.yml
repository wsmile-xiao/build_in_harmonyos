# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-crypt-openssl-verify/0.36-r2
homepage: "https://metacpan.org/dist/Crypt-OpenSSL-Verify"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00-basic.t
    source: perl-crypt-openssl-verify-0.36-r2/t/00-basic.t
    description: "Basic module load test"
    command: "perl -Iblib/lib -Iblib/arch t/00-basic.t"
  - file: t/01-load-ca.t
    source: perl-crypt-openssl-verify-0.36-r2/t/01-load-ca.t
    description: "Load CA certificate test"
    command: "perl -Iblib/lib -Iblib/arch t/01-load-ca.t"
  - file: t/02-verify-good-cert.t
    source: perl-crypt-openssl-verify-0.36-r2/t/02-verify-good-cert.t
    description: "Verify good certificate test"
    command: "perl -Iblib/lib -Iblib/arch t/02-verify-good-cert.t"
  - file: t/03-verify-bad-cert.t
    source: perl-crypt-openssl-verify-0.36-r2/t/03-verify-bad-cert.t
    description: "Verify bad certificate test"
    command: "perl -Iblib/lib -Iblib/arch t/03-verify-bad-cert.t"
  - file: t/04-load-broken-cert.t
    source: perl-crypt-openssl-verify-0.36-r2/t/04-load-broken-cert.t
    description: "Load broken certificate test"
    command: "perl -Iblib/lib -Iblib/arch t/04-load-broken-cert.t"
  - file: t/05-verify-not-a-cert.t
    source: perl-crypt-openssl-verify-0.36-r2/t/05-verify-not-a-cert.t
    description: "Verify non-certificate test"
    command: "perl -Iblib/lib -Iblib/arch t/05-verify-not-a-cert.t"
  - file: t/06-verify-expired-cert.t
    source: perl-crypt-openssl-verify-0.36-r2/t/06-verify-expired-cert.t
    description: "Verify expired certificate test"
    command: "perl -Iblib/lib -Iblib/arch t/06-verify-expired-cert.t"
  - file: t/bug-null-operation.t
    source: perl-crypt-openssl-verify-0.36-r2/t/bug-null-operation.t
    description: "Null operation bug regression test"
    command: "perl -Iblib/lib -Iblib/arch t/bug-null-operation.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Consumer package structure verification (Verify.pm/Verify.so presence)"
    command: "conan test"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 8
