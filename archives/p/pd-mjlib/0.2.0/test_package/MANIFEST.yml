# test_package/MANIFEST.yml
# pd-mjlib 0.2.0 - upstream test declaration.

package: pd-mjlib/0.2.0
homepage: "https://puredata.info"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships only Pd help patches (help/*.pd) and a test/prob-test.pd
  smoke patch; there is no make check/ctest and no automated test harness.
  The externals can only be exercised by loading them into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_mjlib.sh
    description: "headless OHOS pd loads the installed mjlib externals and drives [n2m]: note C5 -> 72, note D#3 -> 51"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_mjlib.pd sh test_pd_mjlib.sh"

test_files:
  - path: "test_package/test_pd_mjlib.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_mjlib.sh"
    test_type: "R34"
    assertion_count: 2

test_package_test_count: 1
consumer_assertion_count: 2
upstream_test_cases: 0
assertion_count: 2
