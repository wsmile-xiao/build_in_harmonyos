software: pd-mjlib
display: "pd-mjlib"
description: "Pure Data 外部对象集合 mjlib（8 个类：随机/节奏/摩尔斯/音名转 MIDI/信号路由等）"
category: audio
homepage: "https://puredata.info"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "制品仓 puredata/0.54.1 是 application，不装 Pd API 头 m_pd.h → 配方 source() 额外拉取 pure-data 0.54-1 源码树，PDINCLUDEDIR 指向其 src"
    - "上游 pd-lib-builder 依据 $(CC) -dumpmachine 选中 Linux 分支与 pd_linux 扩展名；CC 由 compiler_executables 显式传入"
    - "构建 8 个 .pd_linux（about/metroplus/monorhythm/morse/n2m/pin~/prob/synapseA~）"
    - "消费者测试用真机 OHOS pd 无头加载安装后的外部对象并驱动 [n2m]（note C5→72、note D#3→51）"
  common_dependencies: []

versions:
  - version: "0.2.0"
    status: built
    build_date: "2026-09-29"
