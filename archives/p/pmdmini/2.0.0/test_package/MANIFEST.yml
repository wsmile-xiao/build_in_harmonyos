# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pmdmini/2.0.0
homepage: "https://github.com/mistydemeo/pmdmini"

# 上游测试命令
# pmdmini 上游无 check/test 目标（Makefile 仅 all/clean，Makefile.lib 仅 all/clean），
# 无 ctest/meson/automake 测试注册，无自动化测试套件。
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（无自动化测试，唯一"测试入口"为示例播放器 pmdplay，
# 其依赖 SDL2 音频与 PMD 音乐文件，无法在无头 CI 环境自动化执行，故不在此列）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证，不替代上游测试统计)
test_package_tests:
  - file: test.cpp
    description: "消费者 API 冒烟测试 (pmd_init/pmd_setrate/pmd_is_pmd/pmd_stop)"
    command: "./test_pmdmini"

# 测试断言总数 (近似值)
assertion_count: 3
