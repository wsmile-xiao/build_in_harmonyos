build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "pmdmini 核心库 (libpmdmini.a) 为纯 C/C++03 代码，无外部依赖；播放器 pmdplay 需要 SDL2 (sdl2-config)，但配方只打包核心库，不打包播放器（依赖分析阶段已确认 sdl2 可选）。"
  - "源码为 C++03 时代代码，clang 默认 C++17 下 src/fmgen/psg.cpp:121 的 -1 窄化到 uint8 触发 -Wc++11-narrowing 错误，需用 -std=c++03 编译（对齐 Homebrew 配方的 CXX='... -std=c++03'）。"
  - "fmgen / pmdwin / ppz8 均为内嵌 (vendored) 源码，非外部依赖，随源码包分发。"
