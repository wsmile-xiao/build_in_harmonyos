# 软件级 manifest — pmdmini
# 文件位置: archives/p/pmdmini/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: pmdmini
display: "PMD mini"
description: "C library for playing PMD/MDX chiptunes (NEC PC-98)"
category: audio
homepage: "https://github.com/mistydemeo/pmdmini"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 C/C++03 源码，无外部依赖（fmgen / pmdwin / ppz8 均为内嵌 vendored 源码）"
    - "用 Makefile.lib 只编译核心静态库 libpmdmini.a，不打包依赖 SDL2 的示例播放器 pmdplay"
    - "上游为 C++03 时代代码：clang 默认 C++17 下 src/fmgen/psg.cpp:121 的 -1 窄化到 uint8 触发 -Wc++11-narrowing，C++ 对象需用 -std=c++03 编译"
    - "上游无自动化测试套件（Makefile 仅 all/clean，无 check/test 目标），test_package 自建消费者 API 冒烟测试（pmd_init/pmd_setrate/pmd_is_pmd/pmd_stop）"
  common_dependencies: []

versions:
  "2.0.0":
    status: built
    build_date: "2026-09-04"
    conan_ref: "pmdmini/2.0.0"
