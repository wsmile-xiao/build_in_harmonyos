software: perl-pod-coverage
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.23/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.23"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
# perl | cmake | autotools | makefile | meson | custom
build_system: perl

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"
compile_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://backpan.perl.org/authors/id/R/RC/RCLAMP/Pod-Coverage-0.23.tar.gz"

  # 源码校验和
  sha256: "30b7a0b0c942f44a7552c0d34e9b1f2e0ba0b67955c61e3b1589ec369074b107"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # perl | cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"
    - "PERL5LIB=$HOME/usr/local/lib/site_perl/5.42.0:$HOME/usr/local/lib/5.42.0"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-devel-symdump/2.18"
    - "perl-pod-parser/1.67"

  # 编译器（纯 Perl 模块，无 C 编译器参与）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 ExtUtils::MakeMaker，构建系统为 perl（perl Makefile.PL PREFIX=... && make && make install）(ref: L2-build-pattern, E097)"
  - "依赖 Devel::Symdump 和 Pod::Parser 需手动安装到 ~/usr/local，并通过 PERL5LIB 环境变量提供给构建和测试 (ref: L3-software-specific)"
  - "DESTDIR 模式：PREFIX=$DEFAULT_PREFIX + DESTDIR=$TEST_PREFIX，产物安装到 $TEST_PREFIX/$DEFAULT_PREFIX/ (ref: R20)"
  - "make test 全部通过（69 tests, 1 skipped - Test::Pod 未安装）(ref: L3-software-specific)"
  - "无 C 编译器参与，无 ELF 二进制，G1/G3 门禁自动 PASS (ref: L2-build-pattern)"
  - "source URL: backpan.perl.org (CPAN 归档)，原始 savannah URL 404 (ref: L3-software-specific)"
  - "功能测试 20 项全部通过（18 PASS + 2 预期边界情况），包括模块加载、覆盖率计算、构造参数、子模块、CLI 工具 (ref: L3-software-specific)"
  - "Pod::Coverage::ExportOnly 对 OO 模块返回 undef（按设计：仅检查 @EXPORT/@EXPORT_OK 符号）(ref: L3-software-specific)"
  - "pod_cover CLI 工具需从含 MANIFEST 的源码目录运行（按设计）(ref: L3-software-specific)"
