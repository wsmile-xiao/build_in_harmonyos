software: perl-log-dispatch-configurator-any
version: 1.122640-r4
status: published  # ✅ 所有测试通过，符合上库要求
publish_status: published  # ✅ 依赖就绪，可以发布
category: perl
build_system: perl_makefile
license: perl_5

# 编译信息
compile_date: 2026-06-15
compiler: perl
perl_version: 5.42.2

# 依赖关系
dependencies:
  runtime:
    - perl-Carp
    - perl-Config-Any (>= 0.15)
    - perl-Log-Dispatch (>= 2.23)
    - perl-Log-Dispatch-Configurator
    - perl-Sys-Syslog (>= 0.25)
  test:
    - perl-Config-Tiny
    - perl-Log-Dispatch-Config
    - perl-Test-More

# 构建选项
configure_options: []
make_options: []

# 平台适配
platform_notes: |
  Perl 模块使用 Makefile.PL 构建，通过 ExtUtils::MakeMaker 生成 Makefile。
  这是一个纯 Perl 模块，不需要编译 C 代码。
  鸿蒙平台 Perl 已正确安装，可以直接使用 Makefile.PL 构建。

  构建命令：
  perl Makefile.PL
  make
  make test
  make install

  注意：Perl模块测试使用 'make test'，而非 'make check'

# 质量门禁
quality_checks:
  g0_clean_build: skip  # Perl 模块无 configure，使用 Makefile.PL
  g1_binary_integrity: pass  # 纯Perl模块无二进制文件
  g2_functional: pass  # ✅ 所有测试通过 (9/9)
  g3_portability: pass  # 纯Perl模块，平台无关
  g4_archive: pass  # ✅ 文档完整

# 产物信息
artifacts:
  package: perl-log-dispatch-configurator-any-1.122640-r4-ohos-aarch64.tar.gz
  patches: 0
  module_file: Any.pm

# 知识提取
knowledge_gained: []