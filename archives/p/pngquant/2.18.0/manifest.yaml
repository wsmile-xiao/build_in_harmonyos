software: pngquant
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.18.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.18.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-20"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/pngquant-2.18.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: autotools

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--with-libpng=$DEFAULT_PREFIX"
  # 注：需设置 CC=clang, PKG_CONFIG_PATH=$DEFAULT_PREFIX/lib/pkgconfig
  # 静态编译：修改 config.mk，将 -lz 替换为静态库路径

  # 编译依赖列表（格式: name/version）
  dependencies:
    - libpng/1.6.43
    - zlib/1.3.1

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config.mk.patch"
  - "0002-lib-config.mk.patch"
  - "0003-configure.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "configure 脚本使用 bash =~ 操作符，Python subprocess 使用 toybox sh 不支持，需创建补丁替换"
  - "HMDFS 软链接限制：ln -sf 不工作，需用 rm -f && cp -a 替代"
  - "静态编译可避免 RPATH 问题：CFLAGS=-static LDFLAGS=-static"
  - "ELF 文件必须签名才能在鸿蒙系统执行"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/builds/pngquant-2.18.0.orig
  source_work_dir: /storage/Users/currentUser/builds/pngquant-2.18.0.work
  source_orig_hash: dac0caef496af046
  source_work_hash: 9f1a66d3960df6c4
  generated_at: '2026-05-20T20:10:57'
  patches_count: 3

patch_classification:
  - file: 0001-config.mk.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-lib-config.mk.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
