    scenario: payload-identity
    description: "Every one of the 344 files matches the pinned SHA-256 of the official 20080411 release payload"
    command: "python3 test_pari_galdata.py --package-root <package-folder>"
  - file: test_pari_galdata.py
    scenario: content-sanity
    description: "NAM8/NAM11 name tables parse as GP list literals (C(8)=8 first record, M(11)/S11 present); COS10_10_4 binary header and alphanumeric coset body are well-formed"
    command: "python3 test_pari_galdata.py --package-root <package-folder>"

