software: pari-galdata
display: "PARI/GP galdata (Galois group data)"
description: "PARI/GP Galois 群数据包：polgalois 计算度 8..11 多项式 Galois 群所需的群名表（NAM）与陪集（COS）/预解式（RES）数据"
category: data
homepage: "https://pari.math.u-bordeaux.fr/"
license: GPL-2.0-or-later
build_system: data

ohos_adaptation:
  key_points:
    - "纯数据包：tarball 解包即数据文件（344 个），无编译无链接，noarch 打包"
    - "数据装到 share/pari/galdata/，PARI_GALDATA_DIR 环境变量导出数据目录"
    - "R34 数据包豁免：无 API 可调用，test_package 以数据完整性验证等效替代（344 文件 census + pin sha256 + NAM/COS 内容健全性，9/9 断言）"
  common_dependencies: []

versions:
  "20080411":
    status: built
    build_date: "2026-09-04"
    conan_ref: "pari-galdata/20080411"
    notes: "noarch 数据包；conan create + test_package 9/9 数据完整性断言通过；官方 CI 提供最终 OHOS 验证"
