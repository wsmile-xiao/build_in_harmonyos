# 编译中学到的知识
knowledge_gained:
  - "E127: OHOS musl 无 pthread_setcancelstate，boost smart_ptr 头需要 BOOST_SP_NO_PTHREAD_SETCANCELSTATE（根 CMakeLists 平台守卫 define，DRAFT 知识图谱已有 E127 条目）"
  - "Conan 2 CMakeDeps 消费端对传递依赖生成 include 为空：test_package 显式 requires 传递依赖（草稿 DRAFT-conan2-cmakedeps-transitive-include-strip）"
  - "上游捆绑 googletest 的 INSTALL_GTEST 须 OFF，否则 gtest 头/库污染包"
  - "cmake 4.x 需 CMAKE_POLICY_VERSION_MINIMUM=3.5 兼容上游 cmake_minimum_required(3.0)（既有知识 E321）"

