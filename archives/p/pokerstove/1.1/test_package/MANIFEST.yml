# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pokerstove/1.1
homepage: "https://github.com/andrewprock/pokerstove"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
# 上游测试基于捆绑 googletest 1.14.0 (src/ext/googletest)，随 conan create
# 一并构建为 peval_tests/penum_tests/util_tests；探索阶段 ctest 3/3 通过
# （W3 日志留档于 reports/）
upstream_test_in_build: false
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试程序 (ctest -N: TestPeval / TestPenum / TestUtil)
upstream_tests:
  - file: src/lib/pokerstove/peval/*.test.cpp
    source: pokerstove-1.1/src/lib/pokerstove/peval/
    description: "peval googletest 套件 (CardSet/CardSetGenerators/HoldemHandEvaluator/OmahaHighHandEvaluator/PokerHandEvaluator/Rank/Suit/UniversalHandEvaluator, 8 文件)"
    command: "./peval_tests"
  - file: src/lib/pokerstove/penum/*.test.cpp
    source: pokerstove-1.1/src/lib/pokerstove/penum/
    description: "penum googletest 套件 (PartitionEnumerator/SimpleDeck, 2 文件)"
    command: "./penum_tests"
  - file: src/lib/pokerstove/util/lastbit.test.cpp
    source: pokerstove-1.1/src/lib/pokerstove/util/
    description: "util googletest 套件 (lastbit)"
    command: "./util_tests"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "C++ 消费者测试：链接 peval+penum，Card/CardSet 解析、HoldemHandEvaluator 评估、ShowdownEnumerator 权益枚举断言（AcAs=967/990）"
    command: "./test_package"
  - file: conanfile.py (test)
    description: "执行包内 ps-eval 二进制验证 97.6768%/2.32323% 权益输出 + ps-colex colex 索引输出"
    command: "self.run(ps-eval --game h AcAs Kh4d --board 5c8s9h)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 20
