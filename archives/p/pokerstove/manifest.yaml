software: pokerstove
display: "pokerstove"
description: "C++ poker hand evaluator and equity calculator (peval/penum libs + ps-eval/ps-colex/ps-lut CLI tools)"
category: game-library
homepage: "https://github.com/andrewprock/pokerstove"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "OHOS musl 无 pthread_setcancelstate，boost 头需要 BOOST_SP_NO_PTHREAD_SETCANCELSTATE（E127，CMakeLists 补丁）"
    - "cmake >= 4 移除 <3.5 兼容，配方注入 CMAKE_POLICY_VERSION_MINIMUM=3.5"
    - "仅需 boost program_options 组件；googletest 1.14.0 源码捆绑无需外部依赖"
    - "上游不安装头文件，package() 手动拷贝 src/lib/pokerstove → include/pokerstove"

versions:
  "1.1":
    status: built
    build_date: "2026-09-03"
