# 版本级 manifest — platform_folders 4.2.0
# 遵循 ARCHIVE-SPEC v2.0

version: "4.2.0"
software: platform_folders

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-03"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/sago007/PlatformFolders/archive/refs/tags/4.2.0.tar.gz"
  sha256: "31bb0f64a27315aec8994f226332aaafe9888d00bb69a2ff2dff9912e2f4ccf4"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake

  configure_options:
  - "-DPLATFORMFOLDERS_BUILD_TESTING=ON"   # 层1 上游官方测试
  - "-DPLATFORMFOLDERS_ENABLE_INSTALL=ON"
  - "-DBUILD_SHARED_LIBS=OFF"              # 默认静态
  - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"   # 上游 min 3.1，CMake4 兼容

  # 零第三方依赖
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "platform_folders 为特殊目录查询库：单 cpp+头，OHOS 走非 Windows/非 Apple 的 XDG/Linux 实现（getenv HOME + XDG_* 变量），非 root 用户 HOME 存在即返回非空"
- "上游 CMakeLists 以 PLATFORMFOLDERS_BUILD_TESTING 开关注册 16 个 ctest 用例（每个 test/*.cpp 一个 _def_test 可执行文件，值非空断言 + internal 分词器纯逻辑），可 cmake.test() 直接集成"
- "上游 cmake_minimum_required=3.1，CMake 4 下必须 CMAKE_POLICY_VERSION_MINIMUM=3.5"
- "install(EXPORT) 以 NAMESPACE sago:: 导出 platform_foldersConfig，consumer 用 find_package(platform_folders)+sago::platform_folders"
