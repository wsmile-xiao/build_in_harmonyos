# test_package/MANIFEST.yml — platform_folders 4.2.0
# CI L0e 强制要求此文件存在，声明上游测试来源。详见 docs/TEST_QUALITY_SPEC.md。

package: platform_folders/4.2.0
homepage: "https://github.com/sago007/PlatformFolders"

# 上游测试命令（手动复现：全新 checkout 顶层 cmake 配置+构建+ctest）
upstream_check_command: "cmake -S . -B build -DPLATFORMFOLDERS_BUILD_TESTING=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build build && ctest --test-dir build"

# conanfile.py build() 中是否已集成上游测试（cmake.test()，层1）
upstream_test_in_build: true
upstream_test_command: "ctest (conanfile.py build() 末尾 cmake.test())"

upstream_test_count: 16
upstream_test_cases_skipped: 0

# 上游实际运行的 16 个测试程序（test/CMakeLists.txt _def_test 注册的 ctest 用例）
upstream_tests:
  - file: test/appendAdditionalConfigDirectories.cpp
    source: PlatformFolders-4.2.0/test/appendAdditionalConfigDirectories.cpp
    description: "附加配置目录（/etc/xdg 默认）"
    command: "./appendAdditionalConfigDirectories"
  - file: test/appendAdditionalDataDirectories.cpp
    source: PlatformFolders-4.2.0/test/appendAdditionalDataDirectories.cpp
    description: "附加数据目录（/usr/local/share:/usr/share 默认）"
    command: "./appendAdditionalDataDirectories"
  - file: test/getCacheDir.cpp
    source: PlatformFolders-4.2.0/test/getCacheDir.cpp
    description: "缓存目录"
    command: "./getCacheDir"
  - file: test/getConfigHome.cpp
    source: PlatformFolders-4.2.0/test/getConfigHome.cpp
    description: "配置主目录"
    command: "./getConfigHome"
  - file: test/getDataHome.cpp
    source: PlatformFolders-4.2.0/test/getDataHome.cpp
    description: "数据主目录"
    command: "./getDataHome"
  - file: test/getDesktopFolder.cpp
    source: PlatformFolders-4.2.0/test/getDesktopFolder.cpp
    description: "桌面目录"
    command: "./getDesktopFolder"
  - file: test/getDocumentsFolder.cpp
    source: PlatformFolders-4.2.0/test/getDocumentsFolder.cpp
    description: "文档目录"
    command: "./getDocumentsFolder"
  - file: test/getDownloadFolder1.cpp
    source: PlatformFolders-4.2.0/test/getDownloadFolder1.cpp
    description: "下载目录（函数+类方法）"
    command: "./getDownloadFolder1"
  - file: test/getMusicFolder.cpp
    source: PlatformFolders-4.2.0/test/getMusicFolder.cpp
    description: "音乐目录"
    command: "./getMusicFolder"
  - file: test/getPicturesFolder.cpp
    source: PlatformFolders-4.2.0/test/getPicturesFolder.cpp
    description: "图片目录"
    command: "./getPicturesFolder"
  - file: test/getPublicFolder.cpp
    source: PlatformFolders-4.2.0/test/getPublicFolder.cpp
    description: "公共目录"
    command: "./getPublicFolder"
  - file: test/getSaveGamesFolder1.cpp
    source: PlatformFolders-4.2.0/test/getSaveGamesFolder1.cpp
    description: "存档目录（函数+类方法）"
    command: "./getSaveGamesFolder1"
  - file: test/getStateDir.cpp
    source: PlatformFolders-4.2.0/test/getStateDir.cpp
    description: "状态目录"
    command: "./getStateDir"
  - file: test/getVideoFolder.cpp
    source: PlatformFolders-4.2.0/test/getVideoFolder.cpp
    description: "视频目录"
    command: "./getVideoFolder"
  - file: test/integration.cpp
    source: PlatformFolders-4.2.0/test/integration.cpp
    description: "集成：全部函数+类方法+附加目录（20+ 断言）"
    command: "./integration"
  - file: test/internalTest.cpp
    source: PlatformFolders-4.2.0/test/internalTest.cpp
    description: "internal tokenizer 纯逻辑断言"
    command: "./internalTest"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_platform_folders.cpp
    description: "消费者测试：公开 API 20 项非空断言 + internal tokenizer"
    command: "./test_platform_folders"

# 测试断言总数（上游 16 程序 ≈ 值非空断言×N；integration 内含 20+ 断言，近似）
assertion_count: ~60
