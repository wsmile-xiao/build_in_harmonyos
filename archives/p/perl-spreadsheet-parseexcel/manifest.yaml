# 软件级 manifest
# 文件位置: archives/p/perl-spreadsheet-parseexcel/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: perl-spreadsheet-parseexcel

# 显示名
display: "Spreadsheet::ParseExcel"

# 一句话描述
description: "Read information from an Excel .xls file"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: data

# 官网 URL
homepage: "https://metacpan.org/dist/Spreadsheet-ParseExcel"

# 开源许可证（SPDX 标识）
license: "Artistic-1.0-Perl OR GPL-1.0-or-later"

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "纯 Perl 模块，无需 C 编译器和 CRT 文件 workaround"
    - "通过 perl Makefile.PL && make && make install DESTDIR 编译安装"
    - "conan-verify G4 检查不适用于纯 Perl 模块（产物为 .pm 文件而非 bin/lib/include）"
    - "运行时需要 OLE::Storage_Lite、Crypt::RC4、Digest::Perl::MD5、IO::Scalar 模块"

  # 跨版本通用依赖
  common_dependencies:
    - perl
    - perl-ole-storage-lite
    - perl-crypt-rc4
    - perl-digest-perl-md5
    - perl-io-stringy

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.66":
    status: built
    build_date: 2026-07-01
