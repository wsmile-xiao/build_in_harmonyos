# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-spreadsheet-parseexcel/0.66
homepage: https://metacpan.org/dist/Spreadsheet-ParseExcel

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游测试套件 (Perl MakeMaker make test)
upstream_tests:
  - file: t/*.t
    source: Spreadsheet-ParseExcel-0.66.tar.gz/t/
    description: "32 个测试文件，1605 个子测试，覆盖 Excel 97/95 解析、单元格、工作表、SaveParser 等"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "加载模块 + 验证版本号 + Utility 函数测试 + 错误处理"
    command: "bash test.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1605
