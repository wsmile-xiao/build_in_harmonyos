software: perl-spreadsheet-parseexcel
# 版本级 manifest
# 文件位置: archives/p/perl-spreadsheet-parseexcel/0.66/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.66"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/J/JM/JMCNAMARA/Spreadsheet-ParseExcel-0.66.tar.gz"

  # 源码校验和
  sha256: "bfd76acfba988601dc051bda73b4bb25f6839a006dd960b6a7401c249245f65b"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0 (Perl 解释器)
    - perl-ole-storage-lite/0.19 (OLE::Storage_Lite 模块)

  # 编译器（纯 Perl 模块无需编译器）
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（纯 Perl 模块，无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Spreadsheet::ParseExcel 是纯 Perl 模块，无需 C/XS 编译，不需要 CRT 文件 workaround"
  - "纯 Perl 模块通过 perl Makefile.PL && make && make install DESTDIR 编译安装"
  - "conan-verify G4 检查对纯 Perl 模块不适用（无 bin/lib/include 产物），产物为 .pm 文件"
  - "Perl 模块安装路径: data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0/"
  - "与 perl-dbd-pg 不同，纯 Perl 模块无需 -nostartfiles -nodefaultlibs 链接参数"
  - "运行时依赖: OLE::Storage_Lite(必需)、Crypt::RC4+Digest::Perl::MD5(加密支持)、IO::Scalar(OLE依赖)"
  - "官方测试套件 32 文件 1605 子测试全部通过，功能测试验证 Excel 97/95 解析正常"
  - "测试依赖模块安装路径: /storage/Users/currentUser/tmp/ole-storage-lite-install/"
