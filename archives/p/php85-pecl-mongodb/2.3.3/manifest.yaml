software: php85-pecl-mongodb
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.3.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.3.3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/mongodb/mongo-php-driver/releases/download/2.3.3/mongodb-2.3.3.tgz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools
  build_system: autotools

  # 配置选项列表
  configure_options:
    - "--enable-mongodb"
    - "--with-php-config=/storage/Users/currentUser/usr/local/bin/php-config85"
    - "--with-mongodb-client-side-encryption=no"
    - "--build=aarch64-unknown-linux-gnu"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - openssl/3.5.6
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PHP PECL扩展需要phpize+php-config+开发头文件，需先从PHP源码configure并install headers"
  - "HarmonyOS setgid文件系统导致config.status的umask 077创建临时目录权限不足，需sed移除umask 077"
  - "config.guess/config.sub需替换为支持HarmonyOS的版本"
  - "PHP扩展的DESTDIR安装使用INSTALL_ROOT而非DESTDIR变量"
  - "mongodb PECL扩展默认捆绑libmongoc/libbson，不需要系统安装这些库"
