# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.56.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.56.5"

# 软件名
software: "puredata"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-29"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/pure-data/pure-data/archive/refs/tags/0.56-5.tar.gz"

  # 源码校验和
  sha256: "95d3e31cc095190a66bdd0eb77760eaf4d26ccae1322c3325aa05b3457d7b66a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/"
    - "--disable-alsa"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-portaudio-alsa-guard.patch"
  - "0002-portaudio-pthread-cancel-feature-gate.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "CI worker 的 PATH 有 autoconf 2.72 但没有 automake/libtool，裸 autoreconf -fi 死在 Can't exec \"aclocal\"（E178），而开发机通常整套都有；配方只在 shutil.which(\"automake\")/which(\"libtoolize\") 探不到时才 tool_requires automake/1.18 与 libtool/2.5.4，同一份代码在真机走宿主分支、在 CI worker 走制品仓分支"
  - "不要把 m4/1.4.19、autoconf/2.72 写进 tool_requires：本 profile 解析到的是 conancenter 的 recipe revision（m4#1727f439 → 包 579a4b17…、autoconf#e2324a34 → 包 8c781e33…），制品仓没有这两个包的二进制（它们的 OHOS 包挂在 m4#9a84a566/autoconf#ded5821b → 6b129b06…），于是转入源码构建并死在依赖自身的 config.guess(2021-05-24) 往 TMPDIR 写 dummy.c（cannot guess build type，E114/E136 同类）"
  - "制品仓 automake 包的 bin/aclocal 等包装脚本 shebang 写死 #!/data/service/hnp/bin/perl（worker 侧 HNP perl）；没有 /data/service/hnp/bin 的桌面真机会报 No such file or directory、autoreconf 退 126，所以宿主探测分支也是本机可复验的前提"
  - "上游 14 个 Makefile.am 没注册 TESTS/check_PROGRAMS，automake 生成的 check 目标跑 0 项用例；配方仍在 make -j1 后实际执行 make check（真机退出 0）再断言为 0，而不是凭推断"
  - "上游 tarball 不含生成的 configure（仅 configure.ac），需 autoreconf -fi"
  - "HMDFS 上 config.status 内嵌 mktemp -d ./confXXXXXX 后重定向写入被拒，需将 umask 放宽并把 TMPDIR 指向构建目录"
  - "线程取消能力是 libc 特性而非平台属性：用 AC_CHECK_FUNCS([pthread_cancel]) 生成 -DHAVE_PTHREAD_CANCEL 门控 portaudio 取消路径，不引入平台条件编译宏（E407/R8）"
  - "portaudio/Makefile.am 在 if LINUX 下无条件编 ALSA hostapi，--without-alsa 时需 if ALSA 守卫"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
