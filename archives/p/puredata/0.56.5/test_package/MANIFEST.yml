# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: puredata/0.56.5
homepage: "https://puredata.info"

# 上游 0.56-5 无自动化测试套件（见 notes.md）：
# - 无 tests/ 目录；顶层 Makefile.am 无 TESTS/check_PROGRAMS 注册
# - libpd/test_libpd/ 属 libpd 子项目，不在本构建树 Makefile 范围
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []
upstream_zero_evidence: >-
  Upstream pure-data 0.56-5 registers no automated test suite. Take-count
  command: `grep -rn -E '(^|[^A-Za-z_])(TESTS|check_PROGRAMS|noinst_PROGRAMS)[[:space:]]*[+]?=' --include=Makefile.am .` -> 0 matches across all
  14 Makefile.am files, so the automake-generated `check` target runs no test
  program; the recipe still runs `make check` after `make -j1` and it exits 0 with
  zero cases executed. There is no tests/ or test/ directory. `libpd/test_libpd/` is a
  standalone hand-written makefile (its own header says it assumes libpd is
  already built in ../): no Makefile.am or AC_CONFIG_FILES entry references it,
  and libpd itself is gated behind `--enable-libpd` (AM_CONDITIONAL LIBPD),
  which this recipe does not pass - so nothing in this build tree compiles or
  runs it. The recipe nevertheless runs the generated `make check` target after
  `make -j1`; it exits 0 and confirms that zero test programs are registered.
  `upstream_test_in_build: true` records this execution; zero registered cases
  are reported as 0/0, not as a passing non-empty suite.

upstream_zero_take_command: "grep -rn -E '(^|[^A-Za-z_])(TESTS|check_PROGRAMS|noinst_PROGRAMS)[[:space:]]*[+]?=' --include=Makefile.am . | wc -l"

test_package_tests:
  - file: test.sh
    description: "4 consumer assertions against the installed package: pd -version exits 0; headless pd (-nogui -nosound -send '; pd quit;') boots its scheduler, parses FUDI and exits 0; pdsend and pdreceive are on PATH; the runtime data dir lib/pd is installed"
    command: "bash test.sh"
  - file: test_ohos/run_ohos_test.sh
    description: "HarmonyOS PC ABI check: installed executable is AArch64 and uses the musl dynamic loader"
    command: "bash test_ohos/run_ohos_test.sh"

# 口径：每条脚本自己打印的 "PASS:" 行即一个用例，一个文件不等于一个用例。
# 取数命令（对 create/test 日志）：grep -c '^PASS:' -> 5
#   test.sh -> 4 条（版本命令 / headless FUDI quit / pdsend+pdreceive / lib/pd 数据目录）
#   test_ohos/run_ohos_test.sh -> 1 条（AArch64 ELF + ld-musl-aarch64.so.1）
test_counting:
  upstream_independent_total: 0
  integration_independent_total: 4
  harmonyos_specific_total: 1
  total_after_adaptation: 5
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false
  take_count_command: "grep -c '^PASS:' <conan create 日志>"

assertion_count: 5
