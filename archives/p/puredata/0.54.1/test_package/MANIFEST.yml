# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在

package: puredata/0.54.1
homepage: "https://puredata.info"

# 上游 0.54-1 无自动化测试套件（R51 清点，见 notes.md）：
# - 无 tests/ 目录；顶层 Makefile.am 无 TESTS/check_PROGRAMS 注册
# - make check 实跑 rc=0 但对所有目标输出 "Nothing to be done for 'check'"
# - libpd/test_libpd/ 属 libpd 子项目，不在本构建树 Makefile 范围
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests: []
upstream_zero_evidence: >-
  Upstream pure-data 0.54-1 ships no automated test suite: no tests/
  directory, no TESTS/check_PROGRAMS in any Makefile.am, `make check`
  completes with "Nothing to be done for 'check'" on every target.
  libpd/test_libpd/ belongs to the separate libpd project and is not built
  by this build tree.

test_package_tests:
  - file: test.sh
    description: "pd -version reports Pd-0.54; headless pd boots its scheduler and exits cleanly on a FUDI 'pd quit' message over stdin; pdsend/pdreceive installed"
    command: "bash test.sh"

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

assertion_count: 2
