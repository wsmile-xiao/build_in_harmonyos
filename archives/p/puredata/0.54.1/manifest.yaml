# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.54.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.54.1"

# 软件名
software: "puredata"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-17"
build_system: "autotools"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/pure-data/pure-data/archive/refs/tags/0.54-1.tar.gz"

  # 源码校验和
  sha256: "19a0e2bfcbb5bad5e6dd016d1cda35464db6de008d1803a14c7e1f1625f31353"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--without-alsa"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-portaudio-alsa-guard.patch"
  - "0002-portaudio-no-pthread-cancel-ohos.patch"
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "上游 tarball 不含生成的 configure（仅 configure.ac），需 autoreconf -fi"
  - "HMDFS 上 config.status 内嵌 mktemp -d ./confXXXXXX 后重定向写入被拒，需补丁为 ${TMPDIR:-.}/confXXXXXX 并 export TMPDIR 指向普通目录"
  - "OHOS musl 无 pthread_cancel 但 sysroot pthread.h 定义 PTHREAD_CANCELED，portaudio 探测需 !__OHOS__ 走无 cancel 回退"
  - "portaudio/Makefile.am 在 if LINUX 下无条件编 ALSA hostapi，--without-alsa 时需 if ALSA 守卫"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
