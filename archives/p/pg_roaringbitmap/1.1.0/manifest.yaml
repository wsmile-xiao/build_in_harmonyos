software: pg_roaringbitmap
# 版本级 manifest 模板
# 文件位置: archives/p/pg_roaringbitmap/1.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/ChenHuajun/pg_roaringbitmap/archive/refs/tags/v1.1.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: pgxs

  # 配置选项列表
  configure_options: []
  # PGXS 扩展不需要 configure

  # 编译依赖列表（格式: name/version）
  dependencies:
    - postgresql/17.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 无需补丁，源码可直接编译

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PostgreSQL 扩展使用 PGXS 构建系统，需要 pg_config 命令"
  - "PGXS 扩展直接使用 make 编译，无需 configure 步骤"
  - "Clang 不支持 GCC 的 -Werror=maybe-uninitialized 选项，但 Makefile 已用 -Wno-error=maybe-uninitialized 覆盖"