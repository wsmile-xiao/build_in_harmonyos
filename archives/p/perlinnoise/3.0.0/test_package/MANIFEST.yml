# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perlinnoise/3.0.0
homepage: "https://github.com/Reputeless/PerlinNoise"

# 上游测试命令 (用于 ctest -N / make check 分析)
upstream_check_command: "make -C . example && ./example"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (example.cpp 演示程序, 生成噪声图, 无单元测试套件)
upstream_tests:
  - file: example.cpp
    source: PerlinNoise-3.0.0/example.cpp
    description: "官方示例：生成 Perlin 噪声 BMP 图并做一致性断言（无注册单元测试）"
    command: "make example && ./example"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.cpp
    description: "消费者测试：siv::PerlinNoise 构造/noise2D/octave2D 确定性验证"
    command: "./test_package"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 10
