version: "13.2"
status: built
build_date: "2026-06-12"

source:
  url: "https://github.com/darold/pgbadger/archive/refs/tags/v13.2.tar.gz"
  tar_format: tar.gz

build:
  system: perl_makemaker
  configure_options:
    - "perl Makefile.PL PREFIX=$HOME/usr/local"
  dependencies:
    - perl >= 5.10.0

patches_applied: []

knowledge_gained:
  - "pgbadger 是纯 Perl 脚本，使用 Perl MakeMaker 构建流程"
  - "鸿蒙 date 不支持 --date=@timestamp，需手动 pod2man 生成 man page"
  - "需设置 PERL5LIB=$HOME/usr/local/lib/perl5"
  - "测试套件部分失败由平台限制引起（E002 /tmp 只读、缺少 JSON::XS），非编译问题"