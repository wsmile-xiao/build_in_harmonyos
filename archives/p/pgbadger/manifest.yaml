software: pgbadger
display: "pgBadger"
description: "PostgreSQL log analyzer and performance report generator"
category: db
homepage: "https://github.com/darold/pgbadger"
license: PostgreSQL
build_system: perl_makemaker

ohos_adaptation:
  key_points:
    - "Perl MakeMaker 构建：perl Makefile.PL PREFIX → make → make install"
    - "pgbadger 是纯 Perl 脚本，无需传统编译"
    - "鸿蒙 date 命令不支持 --date=@timestamp 语法，需手动运行 pod2man"
    - "需设置 PERL5LIB=$HOME/usr/local/lib/perl5 环境变量"
    - "测试套件部分失败由平台限制引起（E002 /tmp 只读、缺少 JSON::XS、toybox stat），不影响核心功能"
  common_dependencies:
    - perl

versions:
  "13.2":
    status: built
    build_date: "2026-06-12"