# 编译中学到的知识
knowledge_gained:
  - "上游 Makefile 唯一构建规则硬编码 gcc 字面量（非 $(CC)），make CC 覆盖无效（实测 Error 127）；build() 直接以 Toolchain 环境 ${CC} ${CFLAGS} 单行编译 poster.c"
  - "上游 make install 硬编码 strip + /usr/local 绝对路径；package() 手动布局 bin/ + share/man/man1/ + share/doc/"
  - "运行时坑：poster 管道模式经 tmpinfile() 把 stdin 落临时文件，读 TEMP 环境变量（非 TMPDIR），未设置用 /tmp（OHOS 只读 E002）→ 必须 export TEMP=<可写目录>"
  - "-p 选项需完整介质名（如 2x2A4）；裸 -p2x2 报 box spec not unique"
  - "2005 年 K&R 风格 C 在 clang 15 -Wall 下零告警，零补丁；tarball 内 getopt.c 不参与构建，无 getopt 冲突"
