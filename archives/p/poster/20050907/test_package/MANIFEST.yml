# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: poster/20050907
homepage: "https://ftp.debian.org/debian/pool/main/p/poster/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# poster 20050907 上游为 plain Makefile，无 check/test 目标，无测试套件
upstream_check_command: "make -n check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 上游 tarball（1995/2005 年代）仅含 Makefile（poster/install/clean/tar 四个目标），
# 无任何测试框架或测试程序；manual.ps 为用户手册非测试资产
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_poster.py
    description: "消费者测试: stdin→stdout 管道模式执行 poster 二进制——默认 A4 1:1 输出结构断言 + -p2x2A4 平铺(%%Pages:4/4个tile标记/2x2 tiles) + -mA2 介质切换(A4→A2 1190x1684) + -s2 线性放大(4x2 tiles/%%Pages:8)"
    command: "python3 test_poster.py <bin/poster>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 18
