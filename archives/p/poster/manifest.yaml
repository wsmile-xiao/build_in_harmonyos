software: poster
display: "poster"
description: "poster — PostScript 海报缩放/分块打印工具：将单页 PS 放大到大幅面并平铺多页打印（含裁剪标记）"
category: printing
homepage: "https://ftp.debian.org/debian/pool/main/p/poster/"
license: GPL-2.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "Plain hand-written Makefile (no configure): single build rule hardcodes `gcc` (not $(CC)), so `make CC=<cc>` is a no-op — build() rewrites the rule to $(CC) via sed and drives make -e with the toolchain CC/CFLAGS (R33; verified Error 127 otherwise)"
    - "Upstream `make install` hardcodes `strip` + absolute /usr/local paths — package() stages bin/ + share/man/man1 + share/doc manually"
    - "Runtime: tmpinfile() honours the TEMP env var (not TMPDIR); on OHOS /tmp is read-only (E002) so consumers must export TEMP to a writable dir when using stdin pipe mode"
    - "2005-era K&R C compiles clean with clang 15 -Wall: zero warnings, zero patches needed; getopt.c in tarball is unused (Makefile only builds poster.c)"
    - "Single CLI binary, package_type=application, zero conan requirements (libc + libm only, musl provides both)"
  common_dependencies: []

versions:
  "20050907":
    status: built
    build_date: "2026-09-03"
    conan_ref: "poster/20050907"
