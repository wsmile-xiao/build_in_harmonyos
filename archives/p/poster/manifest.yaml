software: poster
display: "poster"
description: "将 PostScript 文件缩放打印为大尺寸海报的工具，可将单页 PostScript 缩放并分割为多页以便拼接"
category: doc                     # foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data
homepage: "https://github.com/schrfr/poster"
license: GPL-2.0-or-later
build_system: makefile            # 常用构建系统

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "原始 Makefile 硬编码 gcc 和 /usr/local，需补丁添加 CC/CFLAGS/PREFIX/DESTDIR 变量"
    - "poster.c 使用已弃用 gets() 函数，仅产生编译警告，不影响运行"
    - "无 configure 脚本，直接 make 编译"
  common_dependencies: []

# 版本索引
versions:
  "1.0.0":
    status: published
    build_date: "2026-06-13"
