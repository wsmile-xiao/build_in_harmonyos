# 版本级 manifest.yaml
# 文件位置: archives/{letter}/{name}/1.163170-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.163170-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/B/BE/BEANZ/Net-MQTT-1.163170.tar.gz"

  # 源码校验和
  sha256: "ebad56b9b28b0fa67b2983382fc1838a361b663e604cf4f982cd2fc36c4b039c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 构建系统说明: perl Makefile.PL + make + make install
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "patches/0001-add-findbin.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块通过 perl Makefile.PL + make + make install 构建，无需 C/C++ 编译"
  - "Perl 模块安装路径为 /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0/，conanfile.py package() 需将 .pm 文件复制到 lib/ 目录"
  - "Perl 脚本通过 make install DESTDIR 安装后 shebang 被自动修改为 /data/service/hnp/perl.org/perl_5.42.0/bin/perl"
  - "Conan 包中 bin/ 目录的 Perl 脚本无法直接找到 lib/ 中的模块，需通过 FindBin 添加 use lib '$FindBin::Bin/../lib' 补丁修复"
  - "Pod::Usage 的 pod2usage(1) 退出码为 1，conan-verify L2 smoke test 期望 --help 返回 0，需改为 pod2usage(-exitstatus => 0, -verbose => 1)"
  - "net-mqtt-trace 依赖 Net::Pcap 模块，若无此依赖需改为条件加载 eval { require Net::Pcap } 以支持 --help"
  - "纯 Perl 模块不受 SELinux HMDFS 限制影响（与 perl-dbd-pg 的 XS 模块不同），可直接通过 PERL5LIB 使用"
