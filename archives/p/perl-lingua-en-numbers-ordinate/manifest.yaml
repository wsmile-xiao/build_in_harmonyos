# perl-lingua-en-numbers-ordinate 软件级元数据

software: perl-lingua-en-numbers-ordinate
category: perl
description: "将基数数字转换为英语序数形式的 Perl 模块"

# 版本索引
# 只记录 published 状态的版本，按时间倒序
versions:
  published:
    - version: "1.05-r2"
      date: "2026-06-15"
      status: published

  # built 状态（有产物但未发布）
  built: []

  # archived 状态（旧版本归档）
  archived: []

  # failed 状态（编译失败）
  failed: []

# 软件级依赖
dependencies:
  required:
    - "perl/5.42.0"
  optional: []

# 许可证
license: "Artistic-1.0-Perl OR GPL-1.0+"

# 关键词
keywords:
  - perl
  - numbers
  - ordinal
  - english
  - linguistics

# 维护者
maintainer: "NEILB"

# CPAN 信息
cpan:
  distribution: "Lingua-EN-Numbers-Ordinate"
  author: "NEILB"
  latest_version: "1.05"