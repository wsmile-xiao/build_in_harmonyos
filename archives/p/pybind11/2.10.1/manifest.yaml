# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.10.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.10.1"

# 软件名
software: "pybind11"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-05"
build_system: "cmake"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/pybind/pybind11/archive/refs/tags/v2.10.1.tar.gz"

  # 源码校验和
  sha256: "111014b516b625083bef701df7880f78c2243835abdb263065b6b59b960b6bad"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "pybind11 是 header-only CMake 库：配方用 package_type=header-library + PYBIND11_NOPYTHON=ON，构建阶段零 Python 依赖" (ref: pybind11-2.10.1-notes)
- "pybind11 头文件无条件 #include <Python.h>（detail/common.h），test_package 编译需注入宿主 Python include（sysconfig），非包级依赖" (ref: pybind11-2.10.1-notes)
- "R47 语言判定：pybind11 绑定包判 cpp（lang_detect D.4-2 边界规则），仓库内 .py 为 tests 驱动与打包脚本，不构成 python 主体" (ref: pybind11-2.10.1-notes)
- "conanfile.py 若定义 export_sources() 必须导入 export_conandata_patches，否则 G2 NameError" (ref: pybind11-2.10.1-notes)
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
