# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pybind11/3.1.0
homepage: "https://github.com/pybind/pybind11"

# 上游测试命令：pybind11 官方测试套件由 pytest 驱动（tests/ 目录，
# 大量 .cpp 测试模块 + .py 驱动），需宿主 Python + pytest 环境，
# 且以 PYBIND11_TEST=ON 的 cmake 构建生成测试二进制。本配方为
# header-only 交付，构建阶段 PYBIND11_TEST=OFF（不构建上游测试套件，
# 亦不引入 Python 运行时依赖），上游测试在 test_package 阶段以消费者
# 视角编译探测程序验证；完整上游测试枚举台账见 notes.md。
upstream_check_command: "ctest -N  (recipes: PYBIND11_TEST=OFF for header-only)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（header-only 交付不构建上游测试套件，留空）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者编译探测：包含 pybind11.h、校验 PYBIND11_VERSION_* 宏并实例化 detail 编译期接口"
    command: "./test_pybind11"

# 测试断言总数 (版本宏 static_assert ×3 + 运行期版本打印校验)
assertion_count: 4