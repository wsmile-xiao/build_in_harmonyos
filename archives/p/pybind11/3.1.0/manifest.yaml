# 版本级 manifest — pybind11 3.1.0
# 遵循 ARCHIVE-SPEC v2.0

version: "3.1.0"
software: "pybind11"

# 编译状态
# published | built | failed
status: built
build_date: "2026-09-20"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================
source:
  # 源码下载 URL（官方源，CI 构建期由 build_and_test.sh 注入镜像 fallback）
  url: "https://github.com/pybind/pybind11/archive/refs/tags/v3.1.0.tar.gz"
  # 源码校验和（官方 v3.1.0.tar.gz 实测 sha256）
  sha256: "ef712655692a2e9bf7bb7874c022564a45f91d847ddee987e720cd9e28849665"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: cmake
  configure_options:
    - "-DPYBIND11_TEST=OFF"
    - "-DPYBIND11_INSTALL=ON"
    - "-DPYBIND11_NOPYTHON=ON"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "pybind11 绑定包按 R47 边界规则判 cpp；lang-preflight 对 'C++ 头文件库 + Python 绑定/打包' 仓库的 python 误判为已知工具缺陷（绑定标记命中但 cpp 占比 <70% 不触发绑定覆盖），交付物语言以 CMake 安装目标为准"
  - "PYBIND11_NOPYTHON=ON 使配方构建阶段零 Python 依赖；Python.h 仅为消费者编译期硬依赖，由 test_package 注入宿主 sysconfig include 目录"
