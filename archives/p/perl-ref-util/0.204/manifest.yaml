software: perl-ref-util
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.204/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.204"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/A/AR/ARC/Ref-Util-0.204.tar.gz"

  # 源码校验和
  sha256: "415fa73dbacf44f3d5d79c14888cc994562720ab468e6f71f91cd1f769f105e1"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "PUREPERL_ONLY=1"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Pure Perl module, uses ExtUtils::MakeMaker (Makefile.PL) with PUREPERL_ONLY=1 to avoid optional Ref::Util::XS dependency"
  - "No runtime dependencies beyond Perl core (Exporter >= 5.57 is core in Perl 5.42)"
  - "468 tests total, 465 pass, 3 skipped (optional deps: Readonly, custom ops) — all expected with PUREPERL_ONLY=1"
  - "Conan 2 Environment API used in generate() to set PUREPERL_ONLY (not inline shell)"
  - "package_info() uses glob to dynamically discover Perl version path (no hardcoded version)"
  - "G0 门禁 E007 (autotools config.guess) 警告为误报 — 本模块不使用 autotools"
  - "test_package uses dynamic PERL5LIB detection for both package lib and system site_perl"
