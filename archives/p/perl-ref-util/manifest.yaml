software: perl-ref-util
display: "Ref::Util"
description: "Utility functions for checking references - Pure Perl module (Ref::Util)"
category: perl
homepage: "https://metacpan.org/dist/Ref-Util"
license: MIT
build_system: makefile

ohos_adaptation:
  key_points:
    - "Pure Perl module, no XS/C code, no cross-compilation needed"
    - "Uses PUREPERL_ONLY=1 to avoid optional Ref::Util::XS dependency"
    - "Uses Conan 2 Environment API in generate() to set PUREPERL_ONLY"
    - "package_info() uses glob to dynamically discover Perl version path"
  common_dependencies: []

versions:
  "0.204":
    status: published
    build_date: "2026-06-29"
    published_as: perl-ref-util
