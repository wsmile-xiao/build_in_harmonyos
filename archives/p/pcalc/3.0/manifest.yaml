software: pcalc
build_system: makefile
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/alt-romes/programmer-calculator/archive/refs/tags/v3.0.tar.gz"

  # 源码校验和
  sha256: "6ede71e1442710e73edb99eb1742452e67ad5095cad328526633722850aa1136"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（make 变量覆盖）
  configure_options:
    - "CC=clang"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "ncurses/6.5"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
# 0001-Makefile.patch: 将CC改为clang，CFLAGS加-fPIC/-O2/ncurses头文件路径，
# LFLAGS加ncurses库路径和-fuse-ld=bfd（鸿蒙lld缺失libxml2问题）

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "lld链接器在鸿蒙上缺失libxml2.so.16，需使用-fuse-ld=bfd绕过"
  - "HMDFS文件系统上patch命令无法修改文件内容，sed可以；G0验证需注意此限制"
  - "pcalc是makefile项目而非autotools，init-build默认猜测为autotools需手动修正"
  - "简单Makefile项目无install目标时，需手动cp到DESTDIR staging目录"
  - "G4质量门禁检查顶级build_system字段而非嵌套build.system，需补充顶级字段"
  - "鸿蒙平台二进制必须ELF签名(sign-elf)才能执行，未签名会permission denied"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

