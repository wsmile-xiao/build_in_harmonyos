software: perl-readonly
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.05/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.05"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SA/SANKO/Readonly-2.05.tar.gz"

  # 源码校验和
  sha256: "4b23542491af010d44a5c7c861244738acc74ababae6b8838d354dfb19462b5e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 Module::Build::Tiny (Build.PL) 时，可在 conanfile.py build() 中自动生成 Makefile.PL (ExtUtils::MakeMaker) 作为 fallback"
  - "test_package 中不应保留 C/CMake 模板文件，纯 Perl 模块只需 conanfile.py 使用 subprocess 调用 perl 进行测试"
  - "conan-verify 脚本使用 CI profile (os=OHOS) 在本地 Conan 不支持，需使用 default profile (os=HarmonyOS) 手动验证"
  - "Perl taint 模式 (-T) 忽略 PERL5LIB 环境变量，纯 Perl 模块需安装到系统 @INC 才能在 taint 模式下使用"
