# test_package/MANIFEST.yml
# pdqsort 0.0.0-git20180419.
#
# Upstream is a single header (pdqsort.h) plus a benchmark directory: there is
# no build system and no test suite, so the upstream step of R51 reports
# "not applicable" and coverage is provided by a CMake consumer program that
# includes the installed header and compares pdqsort with std::sort.

package: pdqsort/0.0.0-git20180419
homepage: https://github.com/orlp/pdqsort

upstream_tests_exist: false
upstream_test_audit: "tarball contains pdqsort.h, bench/ and license.txt only; no CMakeLists/Makefile, no tests"
upstream_check_command: "n/a"
upstream_test_in_build: false
upstream_test_command: "n/a (header-only, no upstream tests)"

test_package_tests:
  - file: test_pdqsort.cpp
    description: "includes the installed header and checks pdqsort/pdqsort_branchless against std::sort: ints, custom comparator, 20000 pseudo-random ints, 5000 equal keys, sorted/reverse-sorted input, std::string, empty/single ranges"
    command: "./pdqsort_consumer"

test_files:
  - path: "test_package/test_pdqsort.cpp"
    test_type: "R34"
    assertion_count: 8

test_package_test_count: 1
consumer_assertion_count: 8
assertion_count: 8
