package: probalign/1.4
homepage: "https://web.njit.edu/~usman/probalign/"

# Evidence for the zero-test claim (all of it hand-verified against the unpacked
# upstream tarball, sha256 b221a27c5cbc3e5c707b0514c71301806074a2bf54047b57bd2d40497b663c29):
# the archive holds 14 files (4 .cc, 7 .h, Makefile, README, RELEASE_NOTES) and its
# Makefile defines only three rules -- all (L5), probalign (L7), clean (L10) -- with no
# check or test target; `make -n check` and `make -n test` both report
# "No rule to make target", and `grep -niE "check|test|TESTS" Makefile` is empty.
# A cross-framework rescan of the whole tree (Test::More, use_ok(, def test_, TEST_CASE,
# add_test(, enable_testing) returns zero hits and `find -type d` for t/tests/test/spec
# returns nothing, so nothing is hidden behind a switch: there is no configure script,
# no tests/ directory and no ctest or similar registration anywhere.
# Evidence file on the build host: ~/tmp/uc2/z33-probalign/cross-framework-test-scan.log
# (the framework helper ci/tools/extract_upstream_tests.sh is NOT cited here -- it cannot
# run on this device because it hardcodes the read-only /tmp, so its log records only a
# mkdir failure and proves nothing either way).
upstream_check_command: "N/A: upstream Makefile has no check or test target"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_probalign.py
    description: >-
      Run the installed, self-signed probalign binary as a real user: align a
      3-sequence protein set and a 3-sequence nucleotide set, verify the
      reported alignments against goldens captured on the target, check that
      the alignment is rectangular and that stripping gaps recovers every
      input sequence, show that temperature and gap costs move the reported
      indel, exercise -clustalw/-prot/-nuc/-a/-v/-score_matrix, and confirm
      the four documented failure paths exit non-zero.
    command: "python3 test_probalign.py <package>/bin <work_dir>"

assertion_count: 29
