software: probalign
version: "1.4"
status: built
build_date: "2026-09-25"
build_system: makefile

source:
  url: "https://deb.debian.org/debian/pool/main/p/probalign/probalign_1.4.orig.tar.gz"
  sha256: "b221a27c5cbc3e5c707b0514c71301806074a2bf54047b57bd2d40497b663c29"
  tar_format: tar.gz
  source_identity: "probalign 1.4 (Nov 2010) pristine upstream drop published as the Debian .orig tarball"

build:
  system: makefile
  configure_options:
    - "no configure: raw Makefile, invoked as `make -j1 CXX=<conan clang++>`"
    - "CXXFLAGS left at upstream's -O3 -W -Wall -funroll-loops (compiles clean under clang 15)"
    - "OHOS: bin/probalign is self-signed in package() with llvm-objcopy + binary-sign-tool"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Upstream hard-codes CXX = g++; a make command-line definition outranks the in-file assignment, so the Conan toolchain is injected with no source patch."
  - "The upstream link line puts -lm before the object files; clang 15 with lld still links it, so no reordering patch is warranted."
  - "HarmonyOS refuses to exec an unsigned ELF out of the Conan package cache, so package() adds a .codesign section before the consumer test runs."
  - "probalign computes posterior probabilities rather than sampling, so its alignment output is byte-for-byte reproducible and safe to pin as a golden."
  - "Putting ~/usr/local/bin on PATH makes ohc check_env resolve automake, whose shebang points at a nonexistent perl; the resulting FileNotFoundError trips a NameError in check_env._check_cmd and aborts init-build."

upstream_tests:
  exists: false
  test_count: 0
  command: "N/A: upstream Makefile has only `all`/probalign and `clean`; `make -n check` reports no rule to make target"
  notes: "14 files in the unpacked tree (4 .cc, 7 .h, Makefile, README, RELEASE_NOTES); no tests/ directory, no configure, no registered test of any kind -- cross-framework rescan (Test::More, use_ok(, def test_, TEST_CASE, add_test(, enable_testing) returns zero hits and the only Makefile rules are all/probalign/clean."

test_package:
  assertion_count: 29
  description: "Consumer test runs the installed self-signed binary on protein and nucleotide inputs, verifies golden alignments, rectangularity, gap reversibility, parameter sensitivity, CLUSTAL W rendering and four failure paths."

quality_gates:
  W0_dependencies: "Passed: preflight_check.sh probalign/1.4 reports no dependency to check."
  W1_source: "Passed: C++ project with a raw Makefile, single `probalign` executable, zero third-party dependencies."
  W2_structure: "Passed: finish Step 9/10 reports only recipe changes (8 files, no framework files); G1 completeness passed after wiring the export/apply patch hooks."
  W3_local_ci: "Passed 2026-09-25 02:21 on the HarmonyOS target: ci/conan/build_and_test.sh ran conan create, L1a/L1b saw the 29-assertion consumer test execute, L1e negative test confirmed the dependency on the package, L0/L1/L4/L5 pass with Total 1 / Success 1; .ci-result.json exit_code=0."
  L2_smoke: "skip: probalign has no --version/--help (upstream parses only short options); framework-expected for a tool without a version flag, and not counted as executed tests."
  R38_commands_json: "Declared at software level: archives/p/probalign/commands.json lists probalign/1.4 as a CLI tool with binary=true."

blockers: []
