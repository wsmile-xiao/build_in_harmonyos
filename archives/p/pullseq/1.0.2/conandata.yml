- patch_file: patches/0001-file-read-int-ch-eof.patch
  patch_description: 'aarch64 clang plain char unsigned: EOF(-1) stored into char never equals EOF, getl() read loop reallocs unbounded (GB-level RSS on tiny input)'
  patch_reason: OHOS aarch64 toolchain treats plain char as unsigned; upstream works only on signed-char platforms
  patch_type: portability
