package: pullseq/1.0.2
homepage: "https://github.com/bcthomas/pullseq"

upstream_tests_exist: false
upstream_test_audit:
  - source: "pullseq-1.0.2 source tree"
    reason: "src/test_linked_list.c is a standalone main() program (manual linked-list exercise), not registered in src/Makefile.am's bin_PROGRAMS (pullseq, seqdiff) nor wired into any test runner."
  - source: "top-level *.fa/*.txt/.rb files"
    reason: "utest_*.fa/test.fa/test.txt are sample FASTA inputs for manual runs; pull_header.rb is a ruby helper. No test/ directory and no check target exists (top-level Makefile.am has SUBDIRS and changelog only)."
  - conclusion: "Upstream 1.0.2 provides no automated tests (N_static=0); the consumer smoke test below provides real behavior coverage and is not presented as upstream coverage."

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: smoke.sh
    description: "Build a two-record FASTA fixture; run packaged pullseq with -n (name list) and assert seq2 bases are extracted, seq1 is absent."
    command: "sh smoke.sh <package>/bin"
  - file: smoke.sh
    description: "Run packaged pullseq with -g SEQ1 (case-insensitive regex) and assert seq1 bases are extracted, seq2 is absent."
    command: "sh smoke.sh <package>/bin"

test_scenario_count: 2
assertion_count: 6
assertion_count_basis:
  name_list_extraction: 3
  regex_extraction: 3

# GLM-72: 消费者冒烟内存预算（memcap-run.py 实测峰值 197MB）
max_rss_mb: 2500
