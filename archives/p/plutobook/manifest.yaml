software: plutobook
display: "PlutoBook"
description: "分页 HTML 渲染库（HTML/CSS/SVG → PDF/PNG，基于 Cairo/FreeType/HarfBuzz/ICU）"
category: gfx
homepage: "https://github.com/plutoprint/plutobook"
license: MIT
build_system: meson

ohos_adaptation:
  key_points:
    - "Meson 项目：依赖全部走 Conan（PkgConfigDeps + MesonToolchain），wrap_mode=nodownload 禁止下载 wrap 子项目"
    - "上游要求 C++20（meson.build:5；源码用 std::span），CI profile cppstd=17 → 配方 tc.cpp_std='c++20' 显式覆盖"
    - "上游 meson 依赖 cairo-pdf/cairo-png/cairo-ft/cairo-fc 与 libturbojpeg 的 .pc；Conan 每包只生成一个 .pc → generate() 转发生成（知识 E348 手法）"
    - "顶层 requires 版本必须与 cairo/1.18.4 链路逐字一致（expat/2.8.2.1、freetype/2.14.3、fontconfig/2.18.1.1、libpng/1.6.58、zlib/1.3.1.1），否则 Conan 报 Version conflict"
    - "产物含 html2pdf/html2png 可执行文件 → 软件级 commands.json（R38）"
    - "上游无自动化测试套件（无 tests/ 目录、meson 无 test()）→ test_package 自建真实 API 测试（R34）"
  common_dependencies:
    - cairo
    - harfbuzz
    - freetype
    - fontconfig
    - expat
    - icu4c

versions:
  "0.19.0":
    status: built
    build_date: "2026-09-08"
