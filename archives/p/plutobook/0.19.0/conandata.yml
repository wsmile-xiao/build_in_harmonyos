# conandata.yml — plutobook 0.19.0
# 官方源（R39）：GitHub 上游 tag 归档；sha256 为实测值
# 注：只写官方 URL，不要手动加镜像前缀（CI 自动加 fallback）
sources:
  url: "https://github.com/plutoprint/plutobook/archive/refs/tags/v0.19.0.tar.gz"
  sha256: "8f344b446d62a1aa43855e0b0b142aaa192f85ed16b07f9791715da5e3343c3e"

patches:
  # OHOS libc++ 无 <memory_resource> / std::pmr（容器别名与具体资源均缺失），
  # 上游 heapstring.h 直接 #include <memory_resource> 导致编译失败。
  # 补丁内容：新增 ohos_pmr_compat.h（最小 pmr 子集）+ 改一行 include。
  # 无平台宏（__OHOS__），是纯头文件兼容层，符合 R8。
  - patch_file: "patches/0001-source-heapstring.h.patch"
    patch_description: "heapstring.h: <memory_resource> -> ohos_pmr_compat.h（OHOS libc++ 无 pmr）"
    patch_type: "portability"
  - patch_file: "patches/0002-source-ohos_pmr_compat.h.patch"
    patch_description: "新增 ohos_pmr_compat.h：为 OHOS libc++ 补齐最小 pmr（memory_resource 别名 + monotonic_buffer_resource + 容器别名）"
    patch_type: "portability"
