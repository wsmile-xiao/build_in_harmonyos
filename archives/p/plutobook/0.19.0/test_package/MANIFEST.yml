# test_package/MANIFEST.yml — plutobook 0.19.0
# CI L0e 要求本文件存在。

package: plutobook/0.19.0
homepage: "https://github.com/plutoprint/plutobook"

# 上游 0.19.0 无自动化测试套件：
#   - tarball 内无 tests/ 目录（find . -iname '*test*' 为空）
#   - meson.build 无任何 test() 调用
#   - meson_options.txt:9 的 option('tests') 是上游残留，未接入任何子目录
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游无测试程序
upstream_tests: []

# test_package 消费者测试（真实调用 C API 渲染 PDF）
test_package_tests:
  - file: test.c
    description: "plutobook_create/load_html/pdf_canvas_create/render_document 渲染 PDF，校验 %PDF 魔数与体积"
    command: "./test_plutobook"

# 断言数：version/build_info/create/load_html/page_count/canvas/file/magic/size
assertion_count: 8
