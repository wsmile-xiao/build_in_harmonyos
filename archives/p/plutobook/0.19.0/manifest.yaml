version: '0.19.0'
software: plutobook
status: built
build_date: '2026-09-08'
build_system: meson
# conan-verify G2 在本机 WSL 交叉环境受限（设备原生 profile 必挂）；等价验证见 notes.md
# 「关于 conan-verify G2 的环境说明」，设备原生 verify 由 CI 在鸿蒙电脑执行
verify: env_limited

source:
  url: 'https://github.com/plutoprint/plutobook/archive/refs/tags/v0.19.0.tar.gz'
  sha256: '8f344b446d62a1aa43855e0b0b142aaa192f85ed16b07f9791715da5e3343c3e'
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - '-Dwrap_mode=nodownload'
    - '-Ddefault_library=shared'
    # 注：curl 走 meson feature=auto（依赖在则自动 enabled），配方不显式传 -Dcurl
    - '-Dturbojpeg=enabled'
    - '-Dwebp=enabled'
    - '-Dexamples=disabled'
    - '-Dtests=disabled'
    - '-Dtools=enabled'
    - '-Dcpp_std=c++20'
  dependencies:
    - 'cairo/1.18.4'
    - 'harfbuzz/14.3.0'
    - 'freetype/2.14.3'
    - 'fontconfig/2.18.1.1'
    - 'expat/2.8.2.1'
    - 'icu4c/77'
    - 'curl/8.15.0'
    - 'libjpeg-turbo/3.2.0'
    - 'libwebp/1.6.0'
  cc: clang
  cxx: clang++

patches_applied:
  - '0001-source-heapstring.h.patch'
  - '0002-source-ohos_pmr_compat.h.patch'

knowledge_gained:
  - 'OHOS libc++ 裁剪版无 <memory_resource>/std::pmr：需补 std::pmr 别名 + monotonic_buffer_resource 实现，并 -lc++experimental（get_default_resource 在 libc++experimental.a）'
  - 'OHOS libc++ __config 默认定义 _LIBCPP_HAS_NO_INCOMPLETE_RANGES → std::views/std::ranges 不可用，需 -D_LIBCPP_ENABLE_EXPERIMENTAL'
  - 'meson 交叉构建要求 pkg-config 二进制显式给出（cross file [binaries]），conan 侧用 tools.gnu:pkg_config conf 注入'
  - 'MesonToolchain.cpp_std 由 settings.compiler.cppstd 决定（toolchain.py:165-168,559），CI profile=17 → 必须 tc.cpp_std="c++20"'
  - 'Conan PkgConfigDeps 每包只生成一个 .pc：cairo 只有 cairo.pc、libjpeg-turbo 只有 libjpeg.pc；上游 required 的 cairo-pdf/png/ft/fc 与 libturbojpeg 需转发 .pc（E348）'
  - '顶层 requires 版本必须与 cairo/1.18.4 链路一致，否则 conan 图报 Version conflict（实测 expat/2.8.2.1.1 冲突）'
  - '包内自带 .pc 的 prefix=/ 不可直接进 PKG_CONFIG_PATH，转发型 .pc 只写 Requires 并继承版本'
  - '上游 0.19.0 无测试套件，test_package 用真实 C API 渲染 PDF 校验'

patch_generation:
  method: per-file-difflib
  source_orig_dir: /home/qianxia/tmp/builds/plutobook-0.19.0.orig
  source_work_dir: /home/qianxia/tmp/builds/plutobook-0.19.0.work
  source_orig_hash: b7d4642f061640de
  source_work_hash: b406d0caff8bb10c
  generated_at: '2026-09-09T00:58:44'
  patches_count: 2

patch_classification:
  # AI 回填（refresh_patch 只给默认值）：两个补丁均为可移植的特性探测/兼容层，非平台宏
  - file: 0001-source-heapstring.h.patch
    type: portability
