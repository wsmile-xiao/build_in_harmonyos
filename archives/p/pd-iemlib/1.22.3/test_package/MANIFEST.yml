# test_package/MANIFEST.yml
# pd-iemlib 1.22.3 - upstream test declaration.

package: pd-iemlib/1.22.3
homepage: "https://git.iem.at/pd/iemlib"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream ships only Pd help patches (help/*.pd, abs/*-help.pd) and a few
  example patches under examples/; there is no make check, no ctest and no
  automated test harness. The externals can only be exercised by loading the
  library into a running Pd.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_pd_iemlib.sh
    description: "headless OHOS pd loads the installed iemlib library; A) drives five iemlib classes ([db2v 0]->1, [v2db 1]->0, [split 0] -3/3 to the less-than and greater-equal outlets, [modulo_counter 3 0] counting to 2 and wrapping to 0) plus the load banner; B) end-to-end consumer round trip through the packaged abstractions, MIDI-dB 40 --[dbtofad]--> 6 --[fadtodb]--> 40; C) guards against a silently unloaded library (no \"couldn't create\", no \"unknown function\", no unexpected \"error:\" line)"
    command: "PD_BIN=... EXT_DIR=... PATCH=test_pd_iemlib.pd sh test_pd_iemlib.sh"

test_files:
  - path: "test_package/test_pd_iemlib.pd"
    test_type: "R34"
    assertion_count: 0
  - path: "test_package/test_pd_iemlib.sh"
    test_type: "R34"
    assertion_count: 12

test_package_test_count: 1
consumer_assertion_count: 12
upstream_test_cases: 0
assertion_count: 12