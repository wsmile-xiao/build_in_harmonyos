software: pd-iemlib
display: "pd-iemlib"
description: "Pure Data 外部对象集合 iemlib（单位换算 db2v/v2db/wrap、递归滤波 prvu~/rvu~/pvu~、t3 系列，78 类 + 165 abstraction）"
category: audio
homepage: "https://git.iem.at/pd/iemlib"
license: LGPL-2.1-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 make-lib-executable=yes → 整个集合只产出一个多对象库 iemlib.pd_linux（导出 iemlib_setup 入口点），Pd 侧需 -lib iemlib 或补丁里放 [iemlib] 才会装载"
    - "制品仓 puredata/0.54.1 是 application，不装 Pd API 头 m_pd.h/g_canvas.h → 配方 source() 额外拉取 pure-data 0.54-1 源码树，PDINCLUDEDIR 指向其 src"
    - "pd-lib-builder 依据 $(CC) -dumpmachine 选中 Linux 分支与 pd_linux 扩展名；CC 由 compiler_executables 显式传入"
    - "全树只用公开 m_pd.h，不依赖 Pd 内部头 m_imp.h/s_stuff.h，无 autotools → 无需任何源码补丁"
    - "外部对象故意不链接 libpd：Pd API 符号保持 undefined 由运行中的 pd 解析，readelf -d 只有 NEEDED=libc.so"
    - "消费者测试用真机 OHOS pd 无头加载安装后的 iemlib 库：直接驱动 [db2v]/[v2db]/[split]/[modulo_counter] 五个类，并用打包出去的 [dbtofad]/[fadtodb] 抽象跑通 MIDI-dB↔推子刻度的端到端往返（MIDI-dB 40 → 6 → 40）"
    - "反假绿守卫 + L1e 反向破坏：库文件被替换成 0 字节后 12 项断言里 11 项转红；[wrap] 曾因 Pd vanilla 内建同名对象而成为不依赖本包的空壳断言，已换成只由 src/iemlib.c 注册的类"
  common_dependencies: []

versions:
  - version: "1.22.3"
    status: built
    build_date: "2026-10-05"
