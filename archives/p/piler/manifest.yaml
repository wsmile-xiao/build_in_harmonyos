software: piler
display: "PILER"
description: "基因组重复序列分析工具（piler2）：散在重复 / CRISPR / LTR / 串联重复检测"
category: science
homepage: "https://www.drive5.com/piler/"
license: public-domain

build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 Makefile 硬编码 GPP=g++；OHOS 只有 clang++，必须改为 $(CXX) 并由 tools.build:compiler_executables 注入（否则 make Error 127）"
    - "上游 CFLAGS/LDLIBS 为硬赋值，需改为 += / $(LDFLAGS) 才能让工具链标志生效"
    - "上游 -static 产出非 PIE 的 ET_EXEC；改用 -static-pie 兼顾自包含与 PIE/RELRO/NX 硬化基线"
    - "上游 tarball 无目录包裹，get() 需 strip_root=True（无可剥离前缀时为 no-op）"
    - "无第三方依赖，仅 libc/libm；产物为单个静态自包含可执行文件 bin/piler2"
  common_dependencies: []

versions:
  - version: "0-20140707"
    status: built
    build_date: "2026-10-01"
