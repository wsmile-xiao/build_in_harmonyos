# conandata.yml — piler 0-20140707 (PILER 1.0)
#
# 上游官方源：https://www.drive5.com/piler/
#   tarball 无顶层目录包裹（解压后源码直接位于根），与 Debian orig
#   piler_0~20140707.orig.tar.gz 逐字节相同
#   sha256 = 3b1be91c497bdb22eac8032a60c9f815bdcd03edc5b25d925314a02f54bec44f
#
# 任务声明的版本 "0-20140707" 对应 Debian 源包版本 0~20140707
# （上游 2014-07-07 快照）。

sources:
  url: "https://www.drive5.com/piler/piler_source.tar.gz"
  sha256: "3b1be91c497bdb22eac8032a60c9f815bdcd03edc5b25d925314a02f54bec44f"

patches:
  - patch_file: "patches/0001-Makefile.patch"
    patch_description: >
      OHOS aarch64 适配：上游 Makefile 硬编码 g++（OHOS 工具链只有 clang++，
      构建直接失败 Error 127）；CFLAGS/LDLIBS 为硬赋值会丢弃工具链传入的
      CFLAGS/LDFLAGS；-static 产出非 PIE 的 ET_EXEC 不满足鸿蒙硬化基线。
      改为 GPP=$(CXX)、CFLAGS+=、LDLIBS=$(LDFLAGS) -lm -static-pie。
    patch_type: "portability"
