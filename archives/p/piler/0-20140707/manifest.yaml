    patch_type: portability
    description: "GPP=g++ -> $(CXX)；CFLAGS/LDLIBS 硬赋值 -> +=/$(LDFLAGS)；-static -> -static-pie"

knowledge_gained:
  - "OHOS aarch64 工具链不提供 g++：任何 Makefile 硬编码 GPP=g++ 的包都会以 make Error 127 失败，必须改为 $(CXX) 并由 tools.build:compiler_executables 注入"
  - "上游 -static 产出 ET_EXEC（非 PIE）；鸿蒙硬化基线要求 PIE，改用 -static-pie 可同时满足自包含（DT_NEEDED=0）与 PIE + full RELRO + NX"
  - "无目录包裹的 flat tarball 可安全使用 get(..., strip_root=True)：无可剥离前缀时为 no-op"

