# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI 门禁 L0e 强制要求）
#
# 结论：上游 PILER tarball 不含任何自动化测试基础设施，也不提供样例数据。
#       探测证据见 reports/test-report.md §2（真实命令 + 原始输出 + 退出码）。
#       因此 upstream_tests 为空列表，功能覆盖由 test_package 补全。

package: piler/0-20140707
homepage: "https://www.drive5.com/piler/"

# 上游测试命令探测结果
upstream_check_command: "无 —— Makefile 仅有 all/piler2 目标，无 check/test；无 tests/ 目录；无 ctest/pytest"
upstream_test_in_build: false
upstream_test_command: "无"

# 上游实际运行的测试程序（上游未提供）
upstream_tests: []

# test_package 补全的测试（消费者视角 + 上游手册工作流）
test_package_tests:
  - file: test_package/test.sh
    description: >-
      按上游 User Guide 记载的全部工作流覆盖 10 个子命令
      (-version/-help/-crisp/-trs/-trs2fasta/-tr/-tan/-tanmotif2fasta/
       -cons/-annot/-annotedge)、2 个负向用例，以及 3 个上游可选行为修饰
      flag（-multihit/-quiet/-exact）；共 16 项
    command: "bash test.sh test_package/data <out-dir>"
  - file: test_package/conanfile.py
    description: >-
      OHOS 适配专项 2 项：ELF 硬化（PIE + full RELRO + NX）与自包含性
      （DT_NEEDED=0 且在清空 LD_LIBRARY_PATH 下仍可执行）
    command: "conan test_package（python stdlib ELF 解析）"

# 上游可选 flag 覆盖情况（options.cpp 的 FLAG_OPT 表）
optional_flags:
  covered: ["-version", "-help", "-multihit", "-quiet", "-exact"]
  # -edge / -pilesonly 声明于 FLAG_OPT 表但全工程无任何引用（死选项），无可测行为
  dead_options: ["-edge", "-pilesonly"]

# 测试规模统计（用于质量评估）
test_case_count: 18
ohos_specific_case_count: 2
assertion_count: 66
data_fixtures: 11
