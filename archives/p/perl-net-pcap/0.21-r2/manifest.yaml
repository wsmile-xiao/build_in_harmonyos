# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Perl XS 模块 Makefile.PL 中的 have_library() 在 HMDFS 上无法运行测试程序"
  - "需要跳过运行时检测，改用静态函数列表和硬编码版本"
  - "XS .so 在 HMDFS 上受 SELinux 限制，运行时加载需要管理员安装到 /data/service/hnp/"
  - "SELinux hishell_hap domain 只能加载 hnp_file 类型文件，HMDFS hmdfs:s0 类型被拒绝"
  - "conanfile.py 中不应使用硬编码绝对路径，应使用 os.path.expanduser() 保证可移植性"
  - "libpcap 1.10.6 系统安装路径通过 pkg-config 确认可用"

