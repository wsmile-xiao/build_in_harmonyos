software: pmccabe
display: "pmccabe"
description: "McCabe cyclomatic complexity analysis tool for C/C++ source code"
category: build-tool
homepage: "https://gitlab.com/pmccabe/pmccabe"
license: GPL-2.0-or-later
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "构建系统为纯 Makefile，无 configure 脚本，直接 make CC=clang"
    - "Makefile 中 INSTALL=-o root -g root 需覆盖为 INSTALL=install"
    - "make -j 在 HMDFS 上 mkfifo 失败，使用单线程 make"
    - "pmccabe 无参数时读 stdin 会挂起，测试需传文件参数"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "2.8":
    status: published
    build_date: "2026-06-29"
    conan_ref: "pmccabe/2.8"
