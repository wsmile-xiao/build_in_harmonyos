software: pmccabe
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.8"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://gitlab.com/pmccabe/pmccabe/-/archive/v2.8/pmccabe-v2.8.tar.bz2"

  # 源码校验和
  sha256: "d37cafadfb64507c32d75297193f99f1afcf12289b7fcc1ddde4a852f0f2ac8a"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pmccabe 使用纯 Makefile（无 configure 脚本），不是 autotools  ref: E080"
  - "INSTALL 变量需覆盖为 'install' 以避免 -o root -g root 在鸿蒙上失败  ref: E111"
  - "make -j2 在 HMDFS 上 mkfifo 失败，改用单线程 make  ref: E097"
  - "pmccabe 无参数时读 stdin 导致超时，测试需传文件参数  ref: E080"
  - "conanfile.py 需用 cwd=self.source_folder 指定 make 工作目录  ref: E091"
  - "package() 需将 usr/bin 重整为 bin/ 以符合 Conan 布局  ref: E091"
  - "test_package 用 self.dependencies[...].package_folder 获取二进制路径  ref: E091"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
