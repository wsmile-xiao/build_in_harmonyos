# test_package/MANIFEST.yml
# postsrsd/2.0.11 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 要求此文件存在

package: postsrsd/2.0.11
homepage: "https://github.com/roehling/postsrsd"

# 上游测试命令 (CTest 注册)
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 中未集成上游测试（本配方 with_upstream_tests=False 默认关闭，
# 上游测试在本地适配阶段实际执行并记录，见 reports/）
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (源码注册清单 7 项，OHOS 实测 7 项全部尝试运行)
upstream_tests:
  - file: "tests/unit/test_netstring.c -> tests/unit/test_netstring_executable"
    source: "postsrsd-2.0.11/tests/unit"
    description: "netstring 编解码与 IO 单元测试 (Check 框架)；tmpfile() 硬编码 /tmp 只读问题已修，3/3 通过"
    command: "ctest -R test_netstring"
  - file: "tests/unit/test_sha1.c -> tests/unit/test_sha1_executable"
    source: "postsrsd-2.0.11/tests/unit"
    description: "SHA1 哈希单元测试 (Check 框架)"
    command: "ctest -R test_sha1"
  - file: "tests/unit/test_util.c -> tests/unit/test_util_executable"
    source: "postsrsd-2.0.11/tests/unit"
    description: "工具函数单元测试 (Check 框架)"
    command: "ctest -R test_util"
  - file: "tests/unit/test_database.c -> tests/unit/test_database_executable"
    source: "postsrsd-2.0.11/tests/unit"
    description: "数据库抽象层单元测试 (Check 框架)"
    command: "ctest -R test_database"
  - file: "tests/unit/test_srs2.c -> tests/unit/test_srs2_executable"
    source: "postsrsd-2.0.11/tests/unit"
    description: "SRS2 地址编解码单元测试 (Check 框架)"
    command: "ctest -R test_srs2"
  - file: "tests/unit/test_config.c -> tests/unit/test_config_executable"
    source: "postsrsd-2.0.11/tests/unit"
    description: "配置文件解析单元测试 (Check 框架)"
    command: "ctest -R test_config"
  - file: "tests/blackbox/socketmap.py"
    source: "postsrsd-2.0.11/tests/blackbox"
    description: "socketmap 端到端黑盒测试 (Python)；OHOS 上改用 unix:abstract:name abstract socket（E461：路径 socket bind EPERM，abstract 可 bind），7/7 通过"
    command: "python3 tests/blackbox/socketmap.py postsrsd 0"

# test_package 中自带的测试 (消费者视角验证，真实调用安装后的二进制)
test_package_tests:
  - file: test.sh
    description: "运行安装后 postsrsd -v 校验版本号输出；运行 -h 校验帮助输出含 PostSRSd"
    command: "postsrsd -v / postsrsd -h"

# 测试断言总数 (近似值)
assertion_count: 3