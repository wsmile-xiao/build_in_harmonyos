# conandata.yml — postsrsd 2.0.11
sources:
  url: "https://github.com/roehling/postsrsd/archive/refs/tags/2.0.11.tar.gz"
  sha256: "49e3699f30f6f5f92b34da931c525c8f1e3e93c00be2c11d64329eea1d428d14"

# libConfuse 3.3 is a hard, unconditional build dependency of postsrsd but is
# not published to the artifact repository; CMake builds it via FetchContent +
# ExternalProject (add_autotools_dependency). Vendor its source locally so the
# build works offline/CI without hitting GitHub at configure time.
confuse:
  url: "https://github.com/libconfuse/libconfuse/releases/download/v3.3/confuse-3.3.tar.gz"
  sha256: "3a59ded20bc652eaa8e6261ab46f7e483bc13dad79263c15af42ecbb329707b8"

# Check 0.15.2 is the upstream unit-test framework (BUILD_TESTING); vendored
# the same way so FETCHCONTENT_SOURCE_DIR_CHECK can point at local sources.
check:
  url: "https://github.com/libcheck/check/releases/download/0.15.2/check-0.15.2.tar.gz"
  sha256: "a8de4e0bacfb4d76dd1c618ded263523b53b85d92a146d8835eb1a52932fa20a"

patches:
  - patch_file: "patches/0001-cmake-utils.cmake.patch"
    patch_description: "OHOS: pass --build/--host (aarch64-unknown-linux-ohos) to FetchContent ExternalProject autotools deps and drop the autoreconf PATCH_COMMAND so the shipped generated configure is used"
    patch_type: "portability"
  - patch_file: "patches/0002-src-endpoint.c.patch"
    patch_description: "OHOS: unix endpoint supports unix:abstract:name (abstract AF_UNIX socket, E461) since filesystem-path bind is EPERM; abstract bind uses offsetof+1+namelen address length"
    patch_type: "portability"
  - patch_file: "patches/0003-tests-blackbox-socketmap.py.patch"
    patch_description: "OHOS: blackbox socketmap test uses unix:abstract:name and probes connection instead of watching socket file"
    patch_type: "portability"
  - patch_file: "patches/0004-tests-unit-test_netstring.c.patch"
    patch_description: "OHOS: tmpfile() hardcodes /tmp (read-only) -> create the temp file under $TMPDIR instead"
    patch_type: "portability"