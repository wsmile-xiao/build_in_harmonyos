# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  total: 222
  passed: 220
  failed: 2
  note: |
    上游测试（perl Makefile.PL && make test，File-Remove-1.61/t 下 11 个 .t）：
    222 用例 220 通过 2 失败 0 跳过（Files=11, Tests=222, Result: FAIL，
    2/222 subtests failed）。2 处失败同为平台级（OHOS/HMDFS 文件系统不执行
    chmod 去写位）：t/03_deep_readonly.t 与 t/04_can_delete.t 各自仅第 10
    号断言 "Created ... f3.txt ! -w"（chmod 0400 后 -w 仍为真）失败；
    两文件的 File::Remove 功能断言（remove(\1,$dir) 递归删除含只读文件目录树、
    $dir 不存在等 11/12）全部通过。证据见本地结果目录
    /storage/Users/currentUser/perl-file-remove-results/upstream_make_test.log 与
    notes.md。适配后：test_package R34 真实 perl 加载打包 File::Remove，
    临时目录造文件/目录树后 remove()/rm() 删除并断言不存在（13/13）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "File::Remove 是纯 Perl 的文件/目录删除模块（remove/rm/clear，无 remove_tree 函数；递归删除用 remove(\\1, @paths)），仅依赖 perl core（Cwd/File::Path/File::Spec/File::Glob），EUMM 构建 + lib/perl5 打包 + PERL5LIB 注入即可鸿蒙 conan 化"
  - "OHOS/HMDFS 文件系统不执行 chmod 去写位（chmod 0400 后 -w 仍为真），File-Remove 上游 t/03_deep_readonly.t、t/04_can_delete.t 的 '! -w' 前置断言必然失败——属平台级差异，功能断言不受影响；与既有平台限制 E046 同类"

references:
  - https://metacpan.org/dist/File-Remove
