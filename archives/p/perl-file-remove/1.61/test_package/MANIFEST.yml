# test_package/MANIFEST.yml — perl-file-remove 1.61
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-file-remove/1.61
homepage: "https://metacpan.org/dist/File-Remove"

# 上游测试套件：t/ 目录 11 个 .t 文件（EUMM: perl Makefile.PL && make test）
upstream_check_command: "perl Makefile.PL && make test"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序（11 个文件全部声明）
upstream_tests:
  - file: t/00-compile.t
    source: File-Remove-1.61/t/00-compile.t
    description: "stdin 编译诊断（实测通过）"
    command: "prove -lr t/00-compile.t"
  - file: t/01_compile.t
    source: File-Remove-1.61/t/01_compile.t
    description: "use File::Remove 编译检查（实测通过）"
    command: "prove -lr t/01_compile.t"
  - file: t/02_directories.t
    source: File-Remove-1.61/t/02_directories.t
    description: "目录删除功能（实测通过）"
    command: "prove -lr t/02_directories.t"
  - file: t/03_deep_readonly.t
    source: File-Remove-1.61/t/03_deep_readonly.t
    description: "含只读文件深目录的递归删除（功能断言通过；1 项 chmod 前置断言因 OHOS 文件系统不执行 chmod 去写位而失败，见 notes.md）"
    command: "prove -lr t/03_deep_readonly.t"
  - file: t/04_can_delete.t
    source: File-Remove-1.61/t/04_can_delete.t
    description: "可删除性（功能断言通过；1 项 chmod 前置断言同上失败）"
    command: "prove -lr t/04_can_delete.t"
  - file: t/05_links.t
    source: File-Remove-1.61/t/05_links.t
    description: "符号链接删除（实测通过）"
    command: "prove -lr t/05_links.t"
  - file: t/06_curly.t
    source: File-Remove-1.61/t/06_curly.t
    description: "花括号字面路径删除（实测通过）"
    command: "prove -lr t/06_curly.t"
  - file: t/07_cwd.t
    source: File-Remove-1.61/t/07_cwd.t
    description: "删除当前工作目录语义（实测通过）"
    command: "prove -lr t/07_cwd.t"
  - file: t/08_spaces.t
    source: File-Remove-1.61/t/08_spaces.t
    description: "含空格路径删除（实测通过）"
    command: "prove -lr t/08_spaces.t"
  - file: t/09_fork.t
    source: File-Remove-1.61/t/09_fork.t
    description: "fork 场景 END 清理（实测通过）"
    command: "prove -lr t/09_fork.t"
  - file: t/10_noglob.t
    source: File-Remove-1.61/t/10_noglob.t
    description: "glob=>0 无通配删除（实测通过）"
    command: "prove -lr t/10_noglob.t"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 File::Remove，
# 在临时目录造文件/目录树后以 remove()/rm() 删除并断言不存在）
test_package_tests:
  - file: test_remove.pl
    description: "Creates a temp file/dir tree, removes it with File::Remove::remove(\\1, root) / remove(file) / rm(\\1, tree) and asserts the paths no longer exist"
    command: "perl test_remove.pl"

# 断言总数：13（1 单文件 remove 返回+消失、递归树删除、rm 别名删除、fixture 前置断言）
assertion_count: 13
