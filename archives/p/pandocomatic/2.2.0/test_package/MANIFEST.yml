# test_package/MANIFEST.yml — pandocomatic/2.2.0
# CI L0e gate: upstream test declaration.

package: pandocomatic/2.2.0
homepage: "https://heerdebeer.org/Software/markdown/pandocomatic/"

# Upstream uses Rake + Minitest. test/unit/*.rb require test_helper;
# upstream check command is `rake test`.
upstream_check_command: "rake test"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests:
  - file: test/unit/*.rb
    source: "https://github.com/htdebeer/pandocomatic (tag 2.2.0)"
    description: "Rake::TestTask (Rakefile): test/unit/*.rb via Minitest"
    command: "rake test"

test_package_tests:
  - file: test_pandocomatic.sh
    description: >-
      Real runtime smoke on HarmonyOS PC: pandocomatic --version contains
      '2.2.0', --help prints usage, and a markdown -> HTML conversion
      succeeds through pandoc (requires pandoc/3.10.1).
    command: "bash test_pandocomatic.sh"

assertion_count: 4
