# 软件级 manifest
# 文件位置: archives/p/paps/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: paps
display: "paps"
description: "paps — text to PostScript/PDF/SVG converter using Pango for text layout and Cairo vector backends"
category: text-processing
homepage: "https://github.com/dov/paps"
license: LGPL-2.0-or-later
build_system: meson

ohos_adaptation:
  key_points:
    - "meson 构建（C++17）；package_type=application，产物为 bin/paps 可执行文件（R38 commands.json 已声明）"
    - ".pc 解析回归 conan 标准流：PkgConfigDeps 组件级 .pc 全链干净可解析；勿复制包内原始 .pc（其跨包 Requires 链会断：glib-2.0.pc → pcre2 包）"
    - "fmt 12 移除 fmt::localtime → 补丁改 fmt::gmtime；glib 2.78+ const g_utf8_skip → 补丁 const char* next"
    - "glib 包 proxy-libintl：extra_ldflags 显式 -lintl + -Wl,-rpath（meson sanity check 需运行测试二进制）"
    - "subprojects/fmt.wrap 用 wrap_mode=nodownload 禁用，fmt 经 pkg-config 解析 conan fmt/12.2.0"
    - "AR/AS/STRIP/NM/RANLIB 坏环境变量 pop + which 钉真实工具（gssdp 先例）；tc.strip=None 防 .codesign 哈希失配"
    - "运行时自包含：共享库随包 lib/ 拷贝 + patchelf DT_RUNPATH '\\$ORIGIN/../lib'（self.run 走 shell 必须转义）+ binary-sign-tool 重签名"
    - "fontconfig 在 OHOS 无默认字体目录：包内 res/fonts.conf 加 /system/fonts，runenv 导出 FONTCONFIG_FILE（否则 pango 零渲染输出空白）"
  common_dependencies:
    - "fmt"
    - "pango"
    - "glib"

versions:
  "0.8.0":
    status: built
    build_date: "2026-09-04"
