# conandata.yml — paps 0.8.0
# Official source: GitHub automatic archive for tag v0.8.0 (commit
# f4052cac47583969f4839b384d21d315e6da188d). SHA-256 verified on device
# (curl download + sha256sum).
# R39: 第一项为官方 GitHub 源；列表含 ghfast.top 使本地 conan-verify E017
# 注入跳过；后续为 gh-proxy.com / mirror.ghproxy.com / gitclone.com 镜像
# fallback（CI/设备网络对 github.com 直连不稳定）。

sources:
  url:
    - "https://github.com/dov/paps/archive/refs/tags/v0.8.0.tar.gz"
    - "https://ghfast.top/https://github.com/dov/paps/archive/refs/tags/v0.8.0.tar.gz"
    - "https://gh-proxy.com/https://github.com/dov/paps/archive/refs/tags/v0.8.0.tar.gz"
    - "https://mirror.ghproxy.com/https://github.com/dov/paps/archive/refs/tags/v0.8.0.tar.gz"
    - "https://gitclone.com/github.com/dov/paps/archive/refs/tags/v0.8.0.tar.gz"
  sha256: "8fd8db04e6f8c5c164806d2c1b5fea6096daf583f83f06d1e4813ea61edc291f"

patches:
  - patch_file: "patches/fmt12-localtime-gmtime.patch"
    patch_description: "fmt 12 removed fmt::localtime(); use fmt::gmtime() for the header {mtime}/{now} time_t formatting (only timezone semantics change; fmt::gmtime remains in fmt 12.2.0 as the thread-safe variant)"
    patch_type: "conan"
  - patch_file: "patches/glib-const-g_utf8_next_char.patch"
    patch_description: "glib >= 2.78 declares g_utf8_skip as const; g_utf8_next_char(p) therefore yields const char* and the 'char *next' local in split_text_into_paragraphs fails with 'assigning to char* from const char* discards qualifiers' under clang 15; make the pointer const (usage is read-only)"
    patch_type: "portability"
