# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pla/1.3
homepage: "https://www.arpalert.org/pla.html"

# 上游测试命令: pla 1.3 只提供普通 Makefile（目标 all/clean/pla），
# 没有任何 make check / 自动化测试入口。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的消费者侧适配测试
test_package_tests:
  - file: test.sh
    description: "消费者侧 smoke test：真实执行 pla 二进制（-h CLI + 用 cairo 渲染真实 Gantt 图并校验 PNG magic），验证打包可执行文件可运行"
    command: "bash test.sh"

# test.sh 中实际执行的断言/检查点总数
assertion_count: 6
