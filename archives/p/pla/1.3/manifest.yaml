patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
- "pla 用普通 Makefile + pkg-config 发现 cairo；配方 generate() 用 PkgConfigDeps 生成 .pc 并设置 PKG_CONFIG_PATH"
- "构建期需清空宿主 LD_LIBRARY_PATH，避免 /usr/local 下冲突 libxml2 干扰 OHOS SDK lld（E132）"
- "HMDFS 动态加载器无法加载 .so 符号链接（E073）：工具型共享库程序运行期验证需实体文件 staging"
- "cairo 依赖链 pixman/libpng/fontconfig/freetype/expat 已发布 ohpcd，pla 仅需声明 cairo/1.18.4（R36 满足）"
