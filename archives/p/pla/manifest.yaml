# 软件级 manifest — pla
# 遵循 ARCHIVE-SPEC v2.0

# 软件名称（小写，与目录名一致）
software: pla

# 显示名
display: "pla"

# 一句话描述
description: "从任务描述文件生成甘特图（Gantt chart）的命令行工具，可输出 PNG/EPS/PDF/SVG"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: gfx

# 官网 URL
homepage: "https://www.arpalert.org/pla.html"

# 开源许可证（SPDX 标识）
license: GPL-2.0-only

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
  - "普通 Makefile + pkg-config 发现 cairo，无需 configure"
  - "generate() 用 PkgConfigDeps 提供 cairo .pc 并设 PKG_CONFIG_PATH"
  - "构建时清空宿主 LD_LIBRARY_PATH 避免干扰 OHOS SDK lld（E132）"
  - "test_package 需对 .so 符号链接做真实文件 staging（E073）"

  # 跨版本通用依赖
  common_dependencies:
  - cairo

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.3":
    status: built
    build_date: "2026-09-02"
