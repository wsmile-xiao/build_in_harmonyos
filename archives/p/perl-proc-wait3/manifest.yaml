software: perl-proc-wait3
display: "Proc::Wait3"
description: "Perl extension for the wait3() system call (XS/C module)"
category: perl
homepage: "https://metacpan.org/pod/Proc::Wait3"
license: perl_5
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "XS/C 模块，编译为 Wait3.so 共享库供 Perl DynaLoader 加载"
    - "wait3() 系统调用在鸿蒙 musl libc 中可用，无需补丁"
    - "仅依赖 libc.so，无外部动态依赖"
    - "conanfile.py package() 使用 DESTDIR + copy() 将 .pm/.so 复制到 lib/ 供 Conan G4 检测"
    - "test_package 需设置 PERL5LIB 并用 glob 查找 .pm 文件（参照 perl-probe-perl 模式）"
    - "HMDFS 存储 SELinux 上下文不允许 dlopen，系统路径 hnp_file 可以，test_package 需检测并标记 SKIP"
    - "G4 检查失败是 Conan 2.12.0 cache path 行为变更导致，非产物缺失"
    - "G0 无法识别 perl-eumm 构建系统，为已知平台限制"
  common_dependencies:
    - perl (5.42.0)
    - libc (musl, wait3 + getrusage)

versions:
  "0.05":
    status: published
    build_date: "2026-06-26"
    conan_ref: "perl-proc-wait3/0.05"
