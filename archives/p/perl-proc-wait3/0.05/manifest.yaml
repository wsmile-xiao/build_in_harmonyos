software: perl-proc-wait3
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.05/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.05"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/C/CT/CTILMES/Proc-Wait3-0.05.tar.gz"

  # 源码校验和
  sha256: "1a907f5db6933dc2939bbfeffe19eeae7ed39ef1b97a2bc9b723f2f25f81caf3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl-eumm
  system: perl-eumm

  # 配置选项列表
  configure_options:
    - "INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块 test_package 必须设置 PERL5LIB 并使用 glob 查找 .pm 文件（参照 perl-probe-perl 模式）"
  - "HMDFS 存储 SELinux 上下文 hmdfs 不允许 dlopen，系统路径 hnp_file 可以，test_package 需检测并标记为 SKIP"
  - "conan cache path 在 Conan 2.12.0 中返回 recipe export 路径而非 binary package 路径，导致 G4 误报"
  - "Perl EUMM 模块 package() 应直接 DESTDIR=package_folder 并用 copy() 复制 .pm/.so 到 lib/ 供 G4 检测"
  - "wait3() 系统调用在鸿蒙 musl libc 中可用，Proc::Wait3 XS 模块可正常编译"
