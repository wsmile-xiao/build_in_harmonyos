package: p0f/3.09b
homepage: https://lcamtuf.coredump.cx/p0f3/

upstream_check_command: "bash build.sh all"
upstream_test_in_build: false
upstream_test_command: "none (upstream has no automated test target)"
upstream_tests: []

build_checks:
  - name: "production build"
    command: "bash build.sh all"
  - name: "debug build"
    command: "bash build.sh debug"
  - name: "helper tools build"
    command: "make -C tools -j1"

test_package_tests:
  - file: test_p0f.py
    description: "Run p0f with the packaged fingerprint database and an empty offline pcap"
    command: "test_p0f.py <package>"
  - file: test_p0f.py
    description: "Run p0f-client argument validation and usage path"
    command: "test_p0f.py <package>"
  - file: test_p0f.py
    description: "Run p0f-sendsyn argument validation and usage path"
    command: "test_p0f.py <package>"
  - file: test_p0f.py
    description: "Run p0f-sendsyn6 argument validation and usage path"
    command: "test_p0f.py <package>"

assertion_count: 4
