# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-xml-libxml/2.0213
homepage: "https://metacpan.org/pod/XML::LibXML"

# 上游测试命令 — XML::LibXML 上游 t/ 测试套件（make test）
upstream_check_command: "perl Makefile.PL && make && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - t/ 目录：86 个 .t 测试文件（02parse/14sax/48_SAX_Builder/90stack 等）
# - 实测结果：**Files=86, Tests=2634, All tests successful（100%）**——
#   全部测试真实运行通过（tidyall.t 为上游默认 skip：XML_LIBXML_ENABLE_TIDYALL
#   未设置——安装时不需要，非受阻）；SAX 生态测试依赖（XML::SAX::Exception/
#   XML::SAX::ParserFactory/XML::NamespaceSupport）按"依赖可装则装"补齐后全过
upstream_tests:
  - file: t/
    source: XML-LibXML-2.0213/t/
    description: "上游 perl 测试套件（86 文件 2634 用例；实测 2634/2634 100% 通过——SAX 测试依赖补齐后全过，tidyall 上游默认 skip）"
    command: "perl Makefile.PL && make && make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_xmllibxml.pl
    description: "消费者测试：真实 API（R34）——XML::LibXML load_xml + findnodes（上游 t/ 核心用法）"
    command: "perl test_xmllibxml.pl <site-perl-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
