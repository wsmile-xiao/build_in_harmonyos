# test_package/MANIFEST.yml — CI L0e
package: proj/9.8.1
homepage: https://proj.org/

# build() 里以 BUILD_TESTING=ON 运行完整上游 ctest 套件（含 gie/gigs、CLI、
# 以及由本地 googletest 1.15.2 源码树驱动的 test/unit 单元测试）。
# 详见 conandata.yml 的 googletest 段与 patches/0002。
upstream_test_in_build: true
upstream_check_command: "ctest --test-dir build-ohos --output-on-failure"
upstream_test_command: "ctest --test-dir build-ohos --output-on-failure"
upstream_tests: []

test_package_tests:
  - file: test.c
    description: "proj_info version / proj_context_create / proj_create_crs_to_crs(EPSG:4326→EPSG:4326) / dlopen libproj.so"
    command: "./test_probe"

assertion_count: 4
