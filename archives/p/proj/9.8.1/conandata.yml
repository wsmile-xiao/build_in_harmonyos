sources:
  # GitHub releases are reachable from the OHOS worker; download.osgeo.org is
  # the upstream fallback (byte-identical tarball, sha256 verified).
  url:
    - "https://github.com/OSGeo/PROJ/releases/download/9.8.1/proj-9.8.1.tar.gz"
    - "https://download.osgeo.org/proj/proj-9.8.1.tar.gz"
  sha256: "af5b731c145c1d13c4e3b4eeb7d167e94e845e440f71e3496b4ed8dae0291960"

# googletest for BUILD_TESTING.
# PROJ 9.8.1 obtains GTest through CMake FetchContent (v1.15.2). The recipe
# pre-fetches that exact release and points FETCHCONTENT_SOURCE_DIR_GOOGLETEST
# at the extracted tree, so the upstream unit tests build without network
# access. The archive is never vendored in git: GitCode PR CI applies a text
# .diff, and binary blobs cannot be patched.
googletest:
  url:
    - "https://codeload.github.com/google/googletest/zip/refs/tags/v1.15.2"
    - "https://github.com/google/googletest/archive/refs/tags/v1.15.2.zip"
  sha256: "f179ec217f9b3b3f3c6e8b02d3e7eda997b49e4ce26d6b235c9053bec9c0bf9f"

patches:
  # Builtins (gie test, test/gie/builtins.gie): the Vandg roundtrip numerical
  # deviation on aarch64 with clang reaches 0.32 mm, while upstream hard-codes
  # 0.25 mm for the +a=6400000 case. Relax to 0.5 mm for a safe margin.
  # (The +over variant already carries an upstream 0.35 mm ARM64 tolerance.)
  - patch_file: "patches/0001-fix-builtins-vandg-tolerance.patch"
    patch_description: "Relax Vandg roundtrip tolerance 0.25mm→0.5mm (aarch64/clang numerical precision)"
    patch_type: "upstream_test_fix"
  # test/unit: upstream only builds the GTest unit tests when it can fetch
  # googletest from GitHub (HAS_NETWORK). The OHOS worker has no route to the
  # connectivity probe host, so accept a locally supplied GTest source tree
  # (FETCHCONTENT_SOURCE_DIR_GOOGLETEST, injected by the recipe) instead.
  - patch_file: "patches/0002-test-unit-cmake-offline-gtest.patch"
    patch_description: "test/unit: accept a locally supplied GTest source (FETCHCONTENT_SOURCE_DIR_GOOGLETEST) so upstream unit tests build on offline workers"
    patch_type: "portability"
  # test/cli/test_projinfo.sh: the PROJ_AUX_DB sub-test creates
  # tmp_projinfo_aux.db in the cwd via the sqlite3 CLI and then points
  # PROJ_AUX_DB at that relative path. Under ctest on HMDFS, libproj.so
  # sqlite3_open_v2(relative) fails, so the ATTACH of proj.db breaks and all
  # downstream queries return empty. Write the aux db under an absolute
  # writable directory (PROJ_TEST_TMPDIR, injected by the recipe) instead.
  - patch_file: "patches/0003-fix-testprojinfo-aux-db-path.patch"
    patch_description: "testprojinfo.sh: aux db via PROJ_TEST_TMPDIR (HMDFS cwd breaks relative sqlite3_open_v2)"
    patch_type: "upstream_test_fix"
  # test/cli/test_projinfo.yaml --remote-data: the expected "Reason:" line is
  # printed by a CURL-enabled projinfo. This package is built with
  # ENABLE_CURL=OFF (no curl Conan recipe in the registry), so projinfo reports
  # "build without Curl support" instead. The case still runs and still asserts
  # projinfo's full --remote-data output for this build configuration.
  - patch_file: "patches/0004-fix-projinfo-remote-data-no-curl-expected.patch"
    patch_description: "test_projinfo.yaml: --remote-data expectation for a build without Curl support (ENABLE_CURL=OFF)"
    patch_type: "upstream_test_fix"
