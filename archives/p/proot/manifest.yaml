# 软件级 manifest — proot（ARCHIVE-SPEC v3.0 人读索引）

software: proot
display: "proot"
description: "用户态实现的 chroot / mount --bind / binfmt_misc（基于 ptrace 的隔离执行，无需特权）"
category: utility
homepage: "https://proot-me.github.io"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "CIRCLEQ 家族缺失：OHOS <sys/queue.h>（FreeBSD 衍生）无 CIRCLEQ_*；#ifndef 守卫下补标准宏（特性检测，无平台宏）"
    - "get_current_dir_name 为 GNU 扩展，OHOS C 库不提供；改用上游 __ANDROID__ 分支的可移植 getcwd() 写法"
    - "musl 系 sockaddr_storage 双重定义：包含 linux UAPI 头期间重命名内核侧结构（E091 同类）"
    - "上游测试支持：test/ptrace-2.c 的 enum __ptrace_request 为 glibc 专属，回退 int（Alpine 相同修法）"
    - "平台边界：OHOS 对非特权进程禁用 ptrace（TRACEME 被拒），proot 的隔离执行功能不可用；CLI 表面可用，消费侧 16 条断言覆盖"
  common_dependencies:
    - "talloc/2.4.4"

versions:
  "5.4.0":
    status: built
    build_date: "2026-10-12"
    conan_ref: "proot/5.4.0"
