# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求）

package: proot/5.4.0
homepage: "https://proot-me.github.io"

# 上游测试命令（test/GNUmakefile 的 check 目标；clean_failure → check_failure 逐项执行）
upstream_check_command: "make -C test check"

# conanfile.py build() 方法中是否已集成上游测试
# 未集成：套件要求 proot 能创建并跟踪 tracee，而 OHOS 内核对非特权进程禁用 ptrace(2)，
# 在 conan create 环境里整体无法通过；已在本机真机执行并按 R51 逐项如实记录
upstream_test_in_build: false
upstream_test_command: "make -C test check CC=<OHOS SDK clang>（真机执行：134 项检查 = 2 ok / 110 FAILED / 22 skipped；失败全部源自 OHOS 非特权 ptrace 平台边界，1 项无输出挂死被监督器击杀；逐项见 reports/test-report.md）"

upstream_tests:
  - program: "test/test-*.sh（94 个脚本）"
    description: "shell 用例：在 rootfs 静态测试程序上驱动 proot，断言路径/绑定/chroot/execve 等行为"
    result_on_ohos: "按 sh -ex 语义运行；重跑不受外因可达的用例均以 proot 的 ptrace(TRACEME) 被拒告终（见 reports/test-report.md §三）"
    technical_reason: "OHOS 内核对非特权进程禁用 ptrace：TRACEME/ATTACH/SEIZE 与 process_vm_readv 全部被拒（EACCES），CapEff 无 CAP_SYS_PTRACE，Seccomp filter 生效"
  - program: "test/test-*.c（36 个测试程序）"
    description: "C 用例：编译为静态测试程序放进 rootfs 后经 proot 运行（check_c 规则）"
    result_on_ohos: "同平台边界；2 项反向断言（非 root 使用 -i 必须失败）因 proot 整体不可用而按断言口径通过（与上游预期原因不同，如实记录）"
    technical_reason: "同 test/test-*.sh；另有 4 项因前置程序未编译出（-static）按 check_c 语义跳过"

upstream_test_inventory:
  tests_directory: true
  makefile_test_targets: "make -C test check → check_failure → check-<name>（.sh：sh -ex；.c：静态程序经 proot 运行）"
  make_check_cases: 134
  upstream_registered_cases: 130
  evidence:
    - "test/ 目录：94 个 test-*.sh + 36 个 test-*.c；4 项多重断言用例（82ba4ba1/c5a7a0f0/16573e73/5bed7143 的 .c 规则）各执行两次 → 134 项检查"
    - "真机执行日志：upstream-test3.log（本任务工作区；监督器逐项记录，仅对挂死叶子进程设 120s 看门狗，套件语义不变）"
    - "跳过 22 项按上游守卫 exit 125：缺 gdb/strace/ldd/setcap/domainname/docker、CARE 未构建、需 root、前置程序缺失（逐项清单见 reports/test-report.md §3.3）"
    - "代表样本：tmp/proot-explore/upstream-rep-00000000.log（proot 输出 ptrace(TRACEME) 被拒，rc=1）"

test_package_tests:
  - file: test_proot.sh
    description: >-
      16 条 TAP 断言，真实执行已安装二进制：PATH 可见性；--version/-V/--help 退出码与输出
      （含加速器检测行）；缺命令/未知选项/不可用 rootfs 的参数校验与报错；
      tracee 运行的平台策略一致性（OHOS 拒绝 ptrace 时校验拒绝文案与退出码；
      内核允许 ptrace 时校验成功路径）
    command: "sh test_proot.sh"

# 测试断言总数（= test_proot.sh 输出的 TAP 行数）
assertion_count: 16
