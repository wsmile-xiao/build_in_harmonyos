knowledge_gained:
  - "CIRCLEQ 家族缺失：OHOS 的 <sys/queue.h> 为 FreeBSD 衍生版且已移除 CIRCLEQ_*（FreeBSD 2018 删除、musl 系不提供）；proot 绑定链表依赖它，在 #ifndef CIRCLEQ_HEAD 守卫下补标准宏（纯特性检测，无平台宏，R8/PF5 干净）（knowledge_ref: DRAFT-9752-proot-circleq-missing）"
  - "get_current_dir_name() 为 GNU 扩展，OHOS C 库不提供；上游已有 __ANDROID__ 分支的可移植 getcwd() 写法，将其适用面扩展到无该扩展的 C 库"
  - "musl 系 <linux/socket.h>（经 <linux/net.h>）内核侧 struct sockaddr_storage 与 <sys/socket.h> 冲突；包含 UAPI 头期间重命名内核侧结构（knowledge_ref: E091，accel-ppp/reptyr 同族处置）"
  - "上游测试支持：test/ptrace-2.c 使用 glibc 专属 enum __ptrace_request；无该类型时以 int 声明（Alpine Linux 对同一上游测试的相同修法，记入 PR 的「上游测试用例修改说明」）"
  - "平台能力边界（本任务核心事实）：OHOS 内核对非特权进程禁用 ptrace——proot 的每次 tracee 执行在 ptrace(TRACEME) 即被拒（'ptrace(TRACEME): Permission denied'，rc=1），隔离执行功能不可用；与 reptyr 任务记录的平台边界一致（knowledge_ref: DRAFT-10103-reptyr-ptrace-capability-boundary），本任务以上游测试全量实测 + 16 条消费侧断言双重留证"
  - "手写 GNUmakefile 的版本号来自 git describe，发行 tarball 无 .git 时退化为 '-'；以 VERSION=<release> 显式传入固定（Alpine 同法）"

