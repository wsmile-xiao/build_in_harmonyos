# conandata.yml — proot 5.4.0
# 官方源：GitHub tag 归档（R39；CI 自动追加镜像 fallback）

sources:
  url: "https://codeload.github.com/proot-me/proot/tar.gz/refs/tags/v5.4.0"
  filename: "proot-5.4.0.tar.gz"
  sha256: "29248aac2a7ce10c3bd5ee5602742ec33b2532310ff9cf73b79f3c133e5a5f68"

patches:
  - patch_file: "patches/0001-src-extension-portmap-portmap.c.patch"
    patch_description: "<linux/net.h> pulls in <linux/socket.h>, whose kernel-side struct sockaddr_storage collides with the C library's definition in <sys/socket.h> on musl-based systems such as OHOS; the kernel-side struct is renamed while the UAPI headers are included, glibc builds are unaffected (knowledge E091)"
    patch_type: "portability"
  - patch_file: "patches/0002-src-path-binding.h.patch"
    patch_description: "provide the standard CIRCLEQ_* macros when the C library's <sys/queue.h> does not ship them (FreeBSD removed the family in 2018; musl-based systems such as OHOS do not provide it); plain feature detection guarded by #ifndef CIRCLEQ_HEAD, no platform macro (R8/PF5 clean)"
    patch_type: "portability"
  - patch_file: "patches/0003-src-path-temp.c.patch"
    patch_description: "get_current_dir_name() is a GNU extension absent from the OHOS C library; use the portable getcwd() form already used by the upstream __ANDROID__ branch"
    patch_type: "portability"
  - patch_file: "patches/0004-test-ptrace-2.c.patch"
    patch_description: "test/ptrace-2.c uses the glibc-only enum __ptrace_request; declare the restart_how parameter as int on C libraries without that type (the same fix is applied by the Alpine Linux package of proot to this upstream test)"
    patch_type: "portability"
