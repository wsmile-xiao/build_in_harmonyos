knowledge_gained:
  - "pex is a pure POSIX shell application; no C/C++ compiler or Conan library dependency is required (knowledge_ref: knowledge/drafts/DRAFT-pex-1.20140409-ohos-shell-entrypoint.kv; narrative: knowledge/drafts/DRAFT-pex-1.20140409-ohos-shell-entrypoint.md; used in archives/p/pex/1.20140409/source-analysis.md and path-b-difficulty-analysis.md)"
  - "The OHOS package must use /system/bin/sh because the upstream script declares /bin/sh (knowledge_ref: knowledge/drafts/DRAFT-pex-1.20140409-ohos-shell-entrypoint.kv; narrative: knowledge/drafts/DRAFT-pex-1.20140409-ohos-shell-entrypoint.md; used in archives/p/pex/1.20140409/conanfile.py and test_package/conanfile.py)"
  - "The upstream suite needs Perl/Test::Harness and uses PostgreSQL tools only for extension-management paths (knowledge_ref: knowledge/drafts/DRAFT-pex-1.20140409-tap-evidence-boundary.kv; narrative: knowledge/drafts/DRAFT-pex-1.20140409-tap-evidence-boundary.md; used in archives/p/pex/1.20140409/README.md, notes.md, and test_package/MANIFEST.yml)"
  - "The OHOS chmod a-r permission boundary requires a mode-bit probe and a conditional single-assertion TAP skip only when read bits remain (knowledge_ref: knowledge/drafts/DRAFT-pex-1.20140409-permission-semantics.kv; narrative: knowledge/drafts/DRAFT-pex-1.20140409-permission-semantics.md; used in archives/p/pex/1.20140409/conanfile.py, README.md, notes.md, and path-b-difficulty-analysis.md)"
  - "The Conan consumer contract must be audited separately from the upstream TAP suite: test_package/test_pex.sh has 15 assertions for installed layout, shell entrypoint, XDG paths, local repository behavior, and diagnostics (knowledge_ref: knowledge/drafts/DRAFT-pex-1.20140409-consumer-package-contract.kv; narrative: knowledge/drafts/DRAFT-pex-1.20140409-consumer-package-contract.md; used in archives/p/pex/1.20140409/test_package/MANIFEST.yml, README.md, notes.md, and reports/test-report.md)"
