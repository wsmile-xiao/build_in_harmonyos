software: perl-ppix-utils
display: "PPIx::Utils"
description: "Utility functions for PPI documents (classification, traversal, language)"
category: data
homepage: "https://github.com/Grinnz/PPIx-Utils"
license: perl
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无 XS/C 编译，无需静态链接配置"
    - "依赖 PPI 模块，需设置 PERL5LIB 包含 $DEFAULT_PREFIX/lib/site_perl/5.42.0"
    - "需设置 PERL_PARAMS_UTIL_PP=1 使用纯 Perl 版本的 Params::Util（PPI 依赖链）"
    - "conanfile.py package() 需将 .pm 从嵌套 site_perl 路径复制到 lib/ 供 Conan G4 产物检测"
    - "test_package 需用 glob+subprocess 显式设置 PERL5LIB，不能依赖 conanrun env"
    - "G0 无法识别 perl-eumm 构建系统，为已知平台限制"
  common_dependencies:
    - perl-ppi
    - perl (5.42.0)

versions:
  "0.004":
    status: published
    build_date: "2026-06-26"
    conan_ref: "perl-ppix-utils/0.004"
