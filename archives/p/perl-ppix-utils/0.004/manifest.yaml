software: perl-ppix-utils
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.004/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.004"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"
compile_date: "2026-06-26"

# 构建系统
build_system: perl-eumm

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/D/DB/DBOOK/PPIx-Utils-0.004.tar.gz"

  # 源码校验和
  sha256: "336918d56ac9482d248d2ca6e79ed7f2cc67403fbdecdd73a9c414a034adb3cf"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl-eumm

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块使用 ExtUtils::MakeMaker (Makefile.PL) 构建，无需C编译器"
  - "PERL5LIB 必须包含 $DEFAULT_PREFIX/lib/site_perl/5.42.0 以找到已安装的PPI依赖"
  - "设置 PERL_PARAMS_UTIL_PP=1 使 Params::Util 使用纯Perl模式，避免XS .so在HMDFS上dlopen失败"
  - "conanfile.py package() 需将 .pm 从嵌套 site_perl 路径复制到 lib/ 供 Conan G4 产物检测"
  - "G0 无法识别 perl-eumm 构建系统，为已知平台限制，手动验证通过即可"
  - "make test 159个测试全部通过，功能测试10项全部通过"
