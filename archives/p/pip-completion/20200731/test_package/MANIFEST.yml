package: pip-completion/20200731
homepage: "https://github.com/ekalinin/pip-bash-completion"

# ── R51 上游测试清点（真实执行结果，非占位符）──────────────────────
# 清点方式: find <src> -type f \( -iname '*test*' -o -iname '*.bats' -o -iname '*spec*' \)
#           → 命中 0；源码共 5 个文件（.gitignore LICENSE Makefile README.md pip）
# Makefile 目标: release / install / install-local（无 test、无 check）
# `make check` → "No rule to make target 'check'" (rc=2)
# 无 tests/ 目录、无 .github/.travis 等 CI 配置、无 bats/shellcheck/pytest 注册
# 结论: 上游**没有自动化测试入口**（0 个官方用例）。
# upstream_check_command 取真实可执行的静态检查（与同族先例 docker-completion 同口径）；
# 上面的 `make check`（rc=2）只作为「上游无测试目标」的清点证据，不作为 check 命令。
upstream_check_command: "bash -n pip"

# conanfile.py build() 中是否集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游可实际执行的验证入口（上游唯一“测试”= README 里人工按 TAB；
# 下面是可机器化的等价入口，均在适配阶段真实执行过，rc=0）
upstream_tests:
  - file: Makefile
    source: pip-completion-20200731/Makefile
    description: "上游安装入口核验：make install-local 将 pip 脚本安装到 HOME/bash_completion.d（本包改用包内 share/…，见 notes.md）"
    command: "HOME=<staging> make -C <src> install-local"
  - file: pip
    source: pip-completion-20200731/pip
    description: "静态检查（同族先例 docker-completion 口径）"
    command: "bash -n pip"
  - file: pip
    source: pip-completion-20200731/pip
    description: "Homebrew Formula test do 等价断言（assert_match '-F _pip'）"
    command: "bash -c 'source <installed>/pip && complete -p pip'"
  - file: pip
    source: pip-completion-20200731/pip
    description: "功能核验：pip <TAB> 生成子命令候选、pip install -<TAB> 生成选项候选（需真实 pip，实测 pip 24.3.1）"
    command: "bash -c \"source <installed>/pip; COMP_WORDS=(pip ''); COMP_CWORD=1; _pip; printf '%s\\n' \"${COMPREPLY[@]}\"\""

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_completion.sh
    description: "A1 产物存在 / A2 大小合理 / A3 bash -n / A4 complete -p pip 注册 / A5 pip2+pip3 注册 / A6 _pip() 真实产出补全候选（pip 桩驱动 awk+grep+tr 链路）/ A7 bash-only 边界：宿主 sh 非 bash 时做动态负断言，sh 即 bash 时降级为 [[ ]] + complete 静态断言（避免 runner 差异导致假失败）"
    command: "bash test_completion.sh <completion_file_path>"

# assertion_count 只计 test_package 的 A1–A7；上游入口实跑 T1–T6 另行统计
# （见 notes.md「R51 上游测试清点申报表」与 PR 正文的测试用例对比表）
assertion_count: 7
