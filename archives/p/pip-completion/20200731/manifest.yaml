software: pip-completion
# 版本级 manifest — archives/p/pip-completion/20200731/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================
version: "20200731"

# published | built | failed | archived
status: built

build_date: "2026-09-08"
build_system: custom

# ============================================================
# 源码信息
# ============================================================
source:
  # 上游无 release/tag（GET /repos/ekalinin/pip-bash-completion/tags -> []），
  # 版本号 20200731 由 Homebrew 依 commit 日期自编，故取官方 commit archive。
  url: "https://github.com/ekalinin/pip-bash-completion/archive/321d8bd2c56bb1565ac20210367bd272a111a1aa.tar.gz"
  sha256: "b991ebd31fa7cd65f87391280b69ce4d86ff8d4c30c8f0b3fd6207775ce13168"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  # 上游只有 Makefile（release/install/install-local 三个目标），无 configure、
  # 无编译动作；本包 build() 仅做脚本存在性核验，安装由 package() 复制完成，
  # 配方全程不调用 make → custom（与先例 docker-completion 一致）。
  system: custom

  configure_options: []

  # 无 conan 编译依赖。运行期依赖（bash / pip / awk / grep / tr）见
  # notes.md「依赖」节，均已在 ohpcd 制品仓或设备 hnp 侧可消费。
  dependencies: []

  # 纯脚本包不消费编译器；保留字段以与归档 schema 一致
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  # 本次适配新错误模式已入知识图谱草稿（R31）：knowledge/drafts/E429-draft-AEA2.kv
  - "纯脚本包（无编译、Makefile 仅 install 目标）会被 conan-init 误判 autotools，须改用 templates/conanfile-headeronly.py.tmpl 变体 C（knowledge_ref: E429 草稿）"
  - "conan-verify G1 以字符串字面量判定 export_sources / apply_conandata_patches，patches 为空也必须保留这两个调用（knowledge_ref: E429 草稿）"
  - "bash 补全脚本包安装必须落包内 share/bash-completion/completions/，禁止上游 `sudo cp … /etc/bash_completion.d`（R49；先例 docker-completion/29.5.2、brew-cask-completion/2.1）（knowledge_ref: E524）"
  - "上游版本 20200731 非上游发布：tags 为空、由 Homebrew 依 commit 日期自编，源码只能取 GitHub 官方 commit archive（R39）（knowledge_ref: notes.md#遇到的问题与解决方案）"
