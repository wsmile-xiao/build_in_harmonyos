software: pip-completion
display: "Pip Completion"
description: "pip 命令的 bash 补全脚本（补全子命令与各子命令选项）"
category: utilities
homepage: "https://github.com/ekalinin/pip-bash-completion"
license: MIT
# 上游 Makefile 只有 release/install/install-local 三个目标、无任何编译规则，
# 配方也从不调用 make（安装由 package() 的 copy 完成）→ 取 custom，
# 与同族先例 docker-completion（build_system: custom）一致。
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 bash 脚本包（单文件 pip，861B，无 shebang、非可执行），无 configure/编译，安装 = 复制脚本"
    - "上游 Makefile 的 install 目标硬编码 `sudo cp pip /etc/bash_completion.d/`：CI clean env 不可用（sudo + 共享系统前缀，R49），必须改落包内 share/bash-completion/completions/pip"
    - "运行期强制依赖 bash（complete/compgen 为 bash 内建、脚本使用 [[ ]] 与 [ x == 1 ] bashism），POSIX sh source 直接报 complete: not found"
    - "补全候选由 `$first --help | awk '/Commands:/,/General Options:/' | \\grep -E -o | tr -d ' '` 生成，故运行期还需 pip（被补全对象）、awk、grep、tr"
    - "bash-completion 只是加载框架，脚本自身不调用任何 helper（无 _init_completion/have/__ltrim_colon_completions），与 docker-completion/brew-cask-completion 一致：不写入 requires"
    - "上游 tags 为空、版本号 20200731 由 Homebrew 依 commit 日期自编，源码只能取 GitHub 官方 commit archive"
  common_dependencies:
    - bash-completion

# 版本索引（所有已归档版本，含状态）
versions:
  "20200731":
    status: built
    build_date: "2026-09-08"
    conan_ref: "pip-completion/20200731"
