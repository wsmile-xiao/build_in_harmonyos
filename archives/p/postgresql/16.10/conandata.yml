  sha256: "de8485f4ce9c32e3ddfeef0b7c261eed1cecb54c9bcd170e437ff454cb292b42"

patches:
  - patch_file: "patches/0001-ohos-platform-adaptation.patch"
    patch_description: "Platform adaptation for capability-limited systems (13 files), guarded by SEMANTIC capability macros — not platform macros (R8): SysV shared memory bypass via mmap (HAVE_BROKEN_SHMGET), shm_open -> mmap DSM (HAVE_BROKEN_SHM_OPEN), getpwuid numeric-UID fallback (HAVE_BROKEN_GETPWUID; in 16.10 the libpq client path uses pg_get_user_name() from src/port/thread.c), relaxed data-directory ownership/permission checks + mkdir S-bit chmod correction (HAVE_BROKEN_UMASK), Unix-domain sockets disabled by default (HAVE_NO_UNIX_SOCKETS), plus config.sub/config.guess/configure updates: aarch64-linux-ohos triplet recognition (16.10's bundled config.sub predates OHOS support, unlike 18.3) and umask 077 -> 022 for the HMDFS temp-dir quirk (E002/E046: config.status temp dirs created under umask 077 are not writable on hmdfs, and chmod cannot repair them). The macros are injected by conanfile.py generate() for OHOS builds only; on Linux every guarded branch compiles out. Patch regenerated with git diff from the 18.3 adaptation semantics, adapted to 16.10 source."
    patch_type: "portability"
