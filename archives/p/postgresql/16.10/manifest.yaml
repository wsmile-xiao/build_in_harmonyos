software: postgresql
version: '16.10'
status: built
build_date: '2026-09-16'
build_system: autotools

source:
  url: https://ftp.postgresql.org/pub/source/v16.10/postgresql-16.10.tar.bz2
  sha256: de8485f4ce9c32e3ddfeef0b7c261eed1cecb54c9bcd170e437ff454cb292b42
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
  - --build=aarch64-linux-ohos
  - --without-icu
  - --without-readline
  - --without-zlib
  - --without-openssl
  dependencies: []
  makedepends: []
  cc: clang
  cxx: clang++
  parallel: -j8
  install_variant: make install use_install_sh=yes

patches_applied:
  - 0001-ohos-platform-adaptation.patch

knowledge_gained:
  - "本机 PATH 首位的 install shim 不支持分离参数形式（install -c -m 755 src dst → cp: bad '755'），PG 用 make install use_install_sh=yes 切换自带 config/install-sh 规避（继承自 18.3 配方验证）"
  - "conan 2.29.1 用 patch_ng 应用补丁：补丁必须由 git diff 从已验证树生成并双引擎（git apply / patch_ng strip=0）在干净树验证通过（继承自 18.3 配方验证）"
  - "PG 16.10 自带 config.sub 不识别 aarch64-linux-ohos（与 18.3 不同）：必须给 config/config.sub 增加 ohos OS 支持（3 处列表 + kernel-os 组合校验）并在 configure 脚本内修复 umask 077（config.status 用 umask 077+mktemp 建临时目录，hmdfs 上创建 drwx--S--- 目录且 chmod 无法修复（E046），段内写文件 Permission denied → configure 必须改为 umask 022）"
  - "conan Autotools.make 的 args 纯拼接经 sh -c 执行，单引号被剥离、$ORIGIN 在子 shell 被展开为空串；rpath 等需字面量进入产物的需求应在 configure 后直接改写 Makefile.global (ref: DRAFT-postgresql-18.3-make-args-shell-quote)"

patch_generation:
  method: regenerated (git diff from the 18.3 adaptation semantics, adapted to 16.10 source; __OHOS__ guards renamed to semantic capability macros; adds config.sub/config.guess/configure aarch64-linux-ohos recognition and umask 022 fix for 16.10)
  patches_count: 1

patch_classification:
  - file: 0001-ohos-platform-adaptation.patch
    type: portability
    platform_only: false
    guard: 'semantic capability macros (HAVE_BROKEN_SHMGET / HAVE_BROKEN_SHM_OPEN / HAVE_BROKEN_GETPWUID / HAVE_BROKEN_UMASK / HAVE_NO_UNIX_SOCKETS), defined by conanfile.py generate() for OHOS builds only; guarded code compiles out on Linux'

test_results:
  type: functional
  total: 217
  passed: 216
  failed: 1
  failed_case: opr_sanity (OHOS ELF 签名机制阻止服务端加载未签名扩展 .so，已知平台限制，非源码 bug；另见 reports/test-report.md 完整枚举台账)
  skipped: 0
  test_package: PASS (PQlibVersion=160010 major=16 断言 + pg_config --version)
  w3_local_ci: PASS (conan create 本地验证通过，L2 smoke 全绿，L1e 负测试确认)

# 扁平键（submission 审计读取口径）
test_passed: 229
test_failed: 1
