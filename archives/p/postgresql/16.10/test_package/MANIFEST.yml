package: postgresql/16.10
homepage: "https://www.postgresql.org"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check (manual run on OHOS PC arm64; final R04 verification 2026-09-17: source_declared_total=503 — regress 219 + isolation 118 + ecpg 64 + TAP 102, see reports/double-caliber-ledger-r04.md; executed 487: regress make check 217/217 passed (opr_sanity fixed via ELF signing of extension .so) + numeric_big/reindex_catalog minimal-inclusion 2/2, isolation check-prepared-txns 118/118, ecpg check 64/64, TAP 84 passed + 2 platform-limit failed (test_pg_dump tar temp file on read-only /tmp; recovery 017_shm SIGQUIT semantics) + 16 upstream-real-skipped (authentication requires unix sockets, ICU/kerberos/LDAP/OpenSSL not built, unstable-disabled); full pass rate 485/503 = 96.4%, configured set 485/487 = 99.6%, see reports/double-caliber-ledger-r04.md)"
upstream_tests:
  - file: "src/test/regress/pg_regress.c"
    source: "postgresql-16.10/src/test/regress/pg_regress.c"
    description: "Upstream regression suite (make check). Manually verified on OHOS PC arm64 (R04 rerun 2026-09-17: 217/217 passed — opr_sanity was failing on OHOS ELF .so signing and was fixed in R04 by ELF-signing all extension .so with the repo sign-elf toolchain, see reports/double-caliber-ledger-r04.md; full 503-item declared ledger in reports/reconciliation-498-vs-declared-r03.md). Not run inside conan build(): it needs a full server runtime (initdb, TCP sockets, many subprocesses) which is not suitable for the clean CI sandbox; libpq API validation in test_package replaces it."
    command: "make check"
  - file: "src/test/isolation/isolation_schedule"
    source: "postgresql-16.10/src/test/isolation/isolation_schedule"
    description: "Upstream isolation suite (make check-prepared-txns with TEMP_CONFIG max_prepared_transactions=2). Manually verified on OHOS PC arm64 (R04 rerun 2026-09-17: 118/118 passed, incl. upstream non-default targets prepared-transactions/prepared-transactions-cic)."
    command: "make check-prepared-txns"
  - file: "src/interfaces/ecpg/test/ecpg_schedule"
    source: "postgresql-16.10/src/interfaces/ecpg/test/ecpg_schedule"
    description: "Upstream ecpg suite (make check: ecpg_schedule 63 entries + sql/twophase = 64 executed). Manually verified on OHOS PC arm64 (R04 rerun 2026-09-17: 64/64 passed)."
    command: "make check"
  - file: "src/test/perl/PostgreSQL/Test/Utils.pm"
    source: "postgresql-16.10/src/test/perl/PostgreSQL/Test/Utils.pm"
    description: "Upstream TAP suite (102 t/*.pl). Manually verified on OHOS PC arm64 (R04, 2026-09-17): PG_TEST_USE_UNIX_SOCKETS has no effect on OHOS/Linux (Utils.pm 164-165, !$windows_os short-circuits), so the equivalent TCP mode was exercised via a run-only local shim forcing use_unix_sockets=0 (Cluster.pm use_tcp=1, listen 127.0.0.1); results 84 passed + 2 platform-limit failed (test_pg_dump tar temp file /tmp read-only, recovery 017_shm SIGQUIT semantics) + 16 upstream-real skipped; evidence reports/tap-blocked-platform-socket-r03.md and double-caliber-ledger-r04.md."
    command: "prove (TCP shim)"
test_package_tests:
  - file: "test_libpq.c"
    description: "Calls PQlibVersion() and asserts major version 16 — proves libpq is linkable and functional; additionally smoke-tests packaged pg_config --version."
    command: "./test_libpq"

# R40 adaptation-completeness boundary (declared):
# test_package exercises the CLIENT path only (libpq API + pg_config). The
# server-side platform adaptations in 0001-ohos-platform-adaptation.patch
# (mmap DSM instead of SysV shm / shm_open, Unix-socket disable, data-dir
# permission relaxations) are NOT reachable from libpq and require a live
# server run: their evidence is the `make check` baseline in reports/
# test-report.md, not the consumer smoke test. initdb/postgres runtime on
# the CI sandbox is out of scope for test_package by design.
assertion_count: 3