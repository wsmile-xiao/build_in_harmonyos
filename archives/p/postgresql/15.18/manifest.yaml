software: postgresql
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/15.18/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "15.18"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.postgresql.org/pub/source/v15.18/postgresql-15.18.tar.bz2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-ssl=openssl"
    - "--with-readline"
    - "--with-zlib"
    - "--with-lz4"
    - "--with-zstd"
    - "--without-icu"
    - "--without-llvm"
    - "--without-gssapi"
    - "--without-ldap"
    - "--without-pam"
    - "--without-systemd"
    - "--without-bonjour"
    - "--without-libxml"
    - "--without-libxslt"
    - "--without-tcl"
    - "--without-perl"
    - "--without-python"
    - "--with-includes=/storage/Users/currentUser/usr/local/include"
    - "--with-libraries=/storage/Users/currentUser/usr/local/lib"
  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/postgresql-15.18.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/postgresql-15.18.work
  source_orig_hash: eb3e67bee8783a56
  source_work_hash: 6f117789f7a4f2ba
  generated_at: '2026-06-09T16:41:40'
  patches_count: 3

patch_classification:
  - file: 0001-config-config.guess.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-config-config.sub.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
