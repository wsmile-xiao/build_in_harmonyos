software: postgresql
build_system: autotools
# 版本级 manifest 模板
# 文件位置: archives/p/postgresql/17.10/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "17.10"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.postgresql.org/pub/source/v17.10/postgresql-17.10.tar.bz2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--enable-thread-safety"
    - "--without-icu"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - readline
    - openssl
    - zlib
    - zstd

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PG 17.x uses newer config.guess (GUESS-style) requiring *:HarmonyOS:*:* pattern"
  - "PG 17.x config.sub has different structure with maybe_os and kernel-os sections"
  - "--enable-thread-safety is unrecognized in PG 17.x (already default)"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/postgresql-17.10.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/postgresql-17.10.work
  source_orig_hash: 35bcd2e8eb280929
  source_work_hash: 6d130c9046c23d69
  generated_at: '2026-06-09T19:26:34'
  patches_count: 3

patch_classification:
  - file: 0001-config-config.guess.patch
    type: platform
    platform_only: True
    guard: 'always'
  - file: 0002-config-config.sub.patch
    type: platform
    platform_only: True
    guard: 'always'
  - file: 0003-configure.patch
