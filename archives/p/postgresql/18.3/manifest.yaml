software: postgresql
version: '18.3'
status: built
build_date: '2026-09-03'
build_system: autotools

source:
  url: https://ftp.postgresql.org/pub/source/v18.3/postgresql-18.3.tar.bz2
  sha256: d95663fbbf3a80f81a9d98d895266bdcb74ba274bcc04ef6d76630a72dee016f
  tar_format: tar.bz2

build:
  system: autotools
  configure_options:
  - --build=aarch64-linux-ohos
  - --without-icu
  - --without-readline
  - --without-zlib
  - --without-openssl
  dependencies: []
  makedepends: []
  cc: clang
  cxx: clang++
  parallel: -j8
  install_variant: make install use_install_sh=yes

patches_applied:
  - 0001-ohos-platform-adaptation.patch

knowledge_gained:
  - "本机 PATH 首位的 install shim 不支持分离参数形式（install -c -m 755 src dst → cp: bad '755'），PG 用 make install use_install_sh=yes 切换自带 config/install-sh 规避 (ref: DRAFT-postgresql-18.3-install-shim-separate-args)"
  - "conan 2.29.1 用 patch_ng（纯 Python）应用补丁：历史补丁中 miscinit.c 的重复 hunk 段 GNU patch 可容忍、patch_ng 也可正确应用（恰好应用一次），但 git apply --check 在干净树上失败（重复 hunk 语义冲突 + 手写 hunk 计数偏差）；评审轮已用 git diff 从已验证树重新生成补丁，双引擎（git apply / patch_ng strip=0）均干净通过 (ref: DRAFT-postgresql-18.3-patchng-duplicate-hunk)"
  - "PG 18.3 自带 config.sub 已识别 aarch64-linux-ohos；显式 --build 使 configure 跳过 config.guess（其数据库不识别 OHOS 且受 hmdfs umask 077 限制），无需外置 config.sub/guess (ref: DRAFT-postgresql-18.3-config-sub-ohos-native-build)"
  - "conan Autotools.make 的 args 纯拼接经 sh -c 执行，单引号被剥离、$ORIGIN 在子 shell 被展开为空串；rpath 等需字面量进入产物的需求应在 configure 后直接改写 Makefile.global (ref: DRAFT-postgresql-18.3-make-args-shell-quote)"

patch_generation:
  method: regenerated (git diff from the historically verified tree of commit 149f3b650; code byte-equivalent, __OHOS__ guards renamed to semantic capability macros, miscinit.c duplicate-hunk section removed)
  patches_count: 1

patch_classification:
  - file: 0001-ohos-platform-adaptation.patch
    type: portability
    platform_only: false
    guard: 'semantic capability macros (HAVE_BROKEN_SHMGET / HAVE_BROKEN_SHM_OPEN / HAVE_BROKEN_GETPWUID / HAVE_BROKEN_UMASK / HAVE_NO_UNIX_SOCKETS), defined by conanfile.py generate() for OHOS builds only; guarded code compiles out on Linux'

test_results:
  type: functional
  total: 230
  passed: 229
  failed: 1
  failed_case: opr_sanity (OHOS ELF 签名机制阻止服务端加载未签名扩展 .so，已知平台限制，非源码 bug，2026-06-12 手动构建基线)
  skipped: 0
  test_package: PASS (PQlibVersion=180003 major=18 断言 + pg_config --version)
  w3_local_ci: PASS (Build Summary 100%, L2 smoke 35/35, L1e 负测试确认)

