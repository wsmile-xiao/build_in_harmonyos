package: postgresql/18.3
homepage: "https://www.postgresql.org"
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: "make check (manual run, 2026-06-12: 229/230 passed; opr_sanity fails due to OHOS ELF signing of .so loading — known platform limitation)"
upstream_tests:
  - file: "src/test/regress/pg_regress.c"
    source: "postgresql-18.3/src/test/regress/pg_regress.c"
    description: "Upstream regression suite (make check). Manually verified on OHOS PC arm64 (229/230). Not run inside conan build(): it needs a full server runtime (initdb, TCP sockets, many subprocesses) which is not suitable for the clean CI sandbox; libpq API validation in test_package replaces it."
    command: "make check"
test_package_tests:
  - file: "test_libpq.c"
    description: "Calls PQlibVersion() and asserts major version 18 — proves libpq is linkable and functional; additionally smoke-tests packaged pg_config --version."
    command: "./test_libpq"

# R40 adaptation-completeness boundary (needs human confirmation, declared):
# test_package exercises the CLIENT path only (libpq API + pg_config). The
# server-side platform adaptations in 0001-ohos-platform-adaptation.patch
# (mmap DSM instead of SysV shm / shm_open, Unix-socket disable, data-dir
# permission relaxations) are NOT reachable from libpq and require a live
# server run: their evidence is the historical manual `make check` baseline
# (229/230, 2026-06-12, same patch semantics) recorded above, not the
# consumer smoke test. initdb/postgres runtime on the CI sandbox is out of
# scope for test_package by design.
assertion_count: 3
