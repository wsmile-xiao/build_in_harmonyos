patches:
  - patch_file: "patches/0001-ohos-platform-adaptation.patch"
    patch_description: "Platform adaptation for capability-limited systems (10 files), guarded by SEMANTIC capability macros — not platform macros (R8): SysV shared memory bypass via mmap (HAVE_BROKEN_SHMGET), shm_open -> mmap DSM (HAVE_BROKEN_SHM_OPEN), getpwuid numeric-UID fallback (HAVE_BROKEN_GETPWUID), relaxed data-directory ownership/permission checks + mkdir S-bit chmod correction (HAVE_BROKEN_UMASK), Unix-domain sockets disabled by default (HAVE_NO_UNIX_SOCKETS). The macros are injected by conanfile.py generate() for OHOS builds only; on Linux every guarded branch compiles out. Patch regenerated with git diff from the historically verified tree (commit 149f3b650 semantics, byte-equivalent code, comments/guards renamed), which also removes the miscinit.c duplicate-hunk fragility of the original hand-written patch (git apply now passes on a clean tree)."
    patch_type: "portability"
