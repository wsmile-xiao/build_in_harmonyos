    type: platform
    platform_only: True
    guard: 'always'
  - file: 0002-config-config.sub.patch
    type: platform
    platform_only: True
    guard: 'always'
  - file: 0003-configure.patch
    type: platform
    platform_only: True
    guard: 'always'
