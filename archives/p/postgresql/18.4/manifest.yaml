software: postgresql
build_system: autotools
# 版本级 manifest 模板
# 文件位置: archives/p/postgresql/18.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "18.4"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.bz2

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
    - "--enable-thread-safety"
    - "--without-icu"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - readline
    - openssl
    - zlib
    - zstd

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-config-config.guess.patch"
  - "0002-config-config.sub.patch"
  - "0003-configure.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "PG 18.x config.sub already has ohos* in basic system types and linux-ohos* in kernel-os validation"
  - "PG 18.x still needs ohos* in libc suffix validation and ohos-linux in maybe_os"
  - "PG 18.x uses newer config.sub (2024) with different structure from PG 14.x"
  - "PG 18.x postgres binary is ELF shared object (not stripped) - new build structure"
  - "--enable-thread-safety is unrecognized in PG 18.x (already default)"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/postgresql-18.4.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/postgresql-18.4.work
  source_orig_hash: 8c103a1703128fb5
  source_work_hash: 96b7b7572dd3413c
  generated_at: '2026-06-09T19:52:18'
  patches_count: 3

patch_classification:
