software: postgresql
display: "PostgreSQL"
description: "PostgreSQL — powerful open source object-relational database system (server, client tools and libpq client library)"
category: database
homepage: "https://www.postgresql.org"
license: "PostgreSQL"
build_system: autotools

ohos_adaptation:
  key_points:
    - "SysV 共享内存 syscall 不可用（SIGSYS）→ 跳过并依赖 mmap-based DSM"
    - "shm_open configure 检测成功但实际调用 SIGSYS → 强制 DSM_IMPL_MMAP"
    - "hmdfs 目录所有权/权限/mkdir S-bit 异常 → 放宽检查 + mkdir 后 chmod"
    - "getpwuid 对非 /etc/passwd 用户失败 → 数字 UID fallback"
    - "Unix-domain socket 不支持（bind EPERM）→ DEFAULT_PGSOCKET_DIR 置空，仅 TCP"
    - "autoconf umask 077 在 hmdfs 上导致临时目录不可写 → 替换为 umask 022"
    - "PATH 首位 install shim 不支持分离参数 → make install use_install_sh=yes"
    - "显式 --build=aarch64-linux-ohos 跳过无法识别 OHOS 的 config.guess"
  common_dependencies: []

versions:
  "18.3":
    ref: "postgresql/18.3"
    binary: true
