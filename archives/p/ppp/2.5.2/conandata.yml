sources:
  url: "https://download.samba.org/pub/ppp/ppp-2.5.2.tar.gz"
  sha256: "47da358de54a10cb10bf6ff2cf9b1c03c0d3555518f6182e8f701b8e55733cb2"

patches:
  - patch_file: "patches/0001-pppoe-define-packed-for-ohos.patch"
    patch_description: "Provide a scoped __packed fallback for Linux if_pppox.h (E163)"
    patch_type: "portability"
  - patch_file: "patches/0002-config-sub-accept-linux-ohos.patch"
    patch_description: "Teach the release config.sub to accept linux-ohos tuples (E007)"
    patch_type: "portability"
  - patch_file: "patches/0003-netlink-avoid-ohos-sockaddr-storage-redefinition.patch"
    patch_description: "Avoid non-glibc Linux UAPI sockaddr_storage conflicts (E091)"
    patch_type: "portability"
  - patch_file: "patches/0004-session-disable-shadow-api-on-ohos.patch"
    patch_description: "Gate shadow lookup on detected getspnam and endspent functions"
    patch_type: "portability"
  - patch_file: "patches/0005-utest-pppcrypt-provide-ohos-error-stub.patch"
    patch_description: "Provide a unit-test-local pppcrypt error logger"
    patch_type: "portability"
  - patch_file: "patches/0006-utils-utest-respect-tmpdir.patch"
    patch_description: "Let the utils unit test use the writable TMPDIR on OHOS"
    patch_type: "portability"
  - patch_file: "patches/0007-pppd-handle-info-options-before-system-config.patch"
    patch_description: "Handle pure informational options before required system configuration"
    patch_type: "portability"
