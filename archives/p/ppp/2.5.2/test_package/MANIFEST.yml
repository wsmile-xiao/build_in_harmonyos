package: ppp/2.5.2
homepage: "https://ppp.samba.org/"

upstream_check_command: "make -j1 check"
upstream_test_in_build: true
upstream_test_command: "make -j1 check"

upstream_tests:
  - name: utest_crypto
    description: "Crypto backend lifecycle and error handling"
  - name: utest_utils
    description: "Core utility helpers"
  - name: utest_chap
    description: "Microsoft CHAP calculations"
  - name: utest_pppcrypt
    description: "PPP Microsoft crypto primitives"
  - name: utest_peap
    description: "PEAP packet handling"

test_package_tests:
  - file: conanfile.py
    description: "Assert five commands and the PPPoE plugin exist, validate side-effect-free version/help probes, and prove a missing explicit options file still fails closed"
    command: "sh test.sh <package>/bin/pppd"

assertion_count: 9
