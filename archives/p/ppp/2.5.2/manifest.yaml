software: ppp
version: "2.5.2"
status: success
build_date: "2026-08-13"
build_system: autotools

source:
  url: "https://download.samba.org/pub/ppp/ppp-2.5.2.tar.gz"
  sha256: "47da358de54a10cb10bf6ff2cf9b1c03c0d3555518f6182e8f701b8e55733cb2"
  tar_format: tar.gz

build:
  dependencies:
    - openssl/3.5.6
  tool_requires: []
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    - "--with-openssl=<conan-openssl-package>"
    - "--disable-openssl-engine"
    - "--without-atm"
    - "--without-pam"
    - "--without-pcap"
    - "--without-srp"
    - "--disable-systemd"
    - "--disable-multilink"
  cc: clang
  cxx: clang++

patches_applied:
  - file: "patches/0001-pppoe-define-packed-for-ohos.patch"
    knowledge_ref: E163
    description: "Provide a scoped __packed fallback while including if_pppox.h"
  - file: "patches/0002-config-sub-accept-linux-ohos.patch"
    knowledge_ref: E007
    description: "Accept aarch64-unknown-linux-ohos in the release config.sub"
  - file: "patches/0003-netlink-avoid-ohos-sockaddr-storage-redefinition.patch"
    knowledge_ref: E091
    description: "Avoid non-glibc Linux UAPI socket conflicts in netlink and pppstats"
  - file: "patches/0004-session-disable-shadow-api-on-ohos.patch"
    description: "Enable shadow lookup only when its header and functions are detected"
  - file: "patches/0005-utest-pppcrypt-provide-ohos-error-stub.patch"
    description: "Provide a unit-test-local error logger for standalone pppcrypt"
  - file: "patches/0006-utils-utest-respect-tmpdir.patch"
    description: "Let the utils unit test use the writable Conan TMPDIR on OHOS"
  - file: "patches/0007-pppd-handle-info-options-before-system-config.patch"
    knowledge_ref: "knowledge/drafts/E325-draft-C0DX-privileged-daemon-informational-probe"
    description: "Allow standalone pppd version and help queries before /etc/ppp is deployed"

artifacts_expected:
  commands:
    - pppd
    - chat
    - pppstats
    - pppdump
    - pppoe-discovery
  plugins:
    - lib/pppd/2.5.2/pppoe.so

test_results:
  status: pending
  upstream_expected:
    command: "make -j1 check"
    total: 5
    passed: 5
    failed: 0
  test_package:
    command: "sh test.sh <package>/bin/pppd"
    assertions: 9
    output:
      - "pppd --version reports exactly pppd version 2.5.2"
      - "pppd --help prints the upstream usage surface"
      - "pppd file <missing> remains rejected by normal option processing"
    status: pending
    reason: "The two added information-dispatch assertions await the current candidate HEAD official CI because the direct true-device SSH window is unavailable."

validation:
  w0:
    status: passed
    remote: ohpcd
    dependencies:
      - openssl/3.5.6
  local_static:
    status: passed
    checks:
      - "source SHA-256"
      - "Python syntax"
      - "YAML parse"
      - "patch series apply"
      - "patched config.sub OHOS canonicalization"
      - "Conan inspect/export/install/graph info"
      - "git diff --check"
  ohos_shadow_ci:
    status: passed
    date: "2026-08-13"
    mode: single-package-heavy
    gates:
      L0: passed
      L1: passed
      L4: passed
      L5: passed

known_constraints:
  - "PPPoE link tests require kernel PPP/PPPoX support, /dev/ppp and privilege; they are not part of test_package."
  - "R38 commands.json is software-level, outside the user-authorized version directory, so it is not added in this branch."

knowledge_contribution:
  path: B
  status: requested
  candidate: "knowledge/drafts/E325-draft-C0DX-privileged-daemon-informational-probe"
  evidence:
    - "patches/0007-pppd-handle-info-options-before-system-config.patch"
    - "test_package/test.sh"
    - "reports/knowledge-contribution-evidence.md"
  novelty: "Define a fail-closed control-flow contract for privileged daemons whose informational CLI options are otherwise blocked by mandatory global configuration loading: exact argc/allowlist dispatch, reuse of the upstream parser, and a negative operational-path check."
  differs_from:
    - "E214 handles an interactive shell read that blocks non-interactive execution."
    - "E246 handles SIGSYS/seccomp failures after a restricted syscall is attempted."
    - "E091 and E163 address compile/link failures in OHOS Linux compatibility headers."
