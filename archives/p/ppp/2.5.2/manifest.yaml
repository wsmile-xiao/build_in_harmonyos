# PPP 2.5.2 OpenHarmony 编译归档清单
# PPP (Point-to-Point Protocol) 拨号协议实现

software:
  name: ppp
  version: 2.5.2
  description: PPP (Point-to-Point Protocol) - 点对点协议实现
  homepage: https://ppp.samba.org/
  license: BSD-3-Clause AND GPL-2.0

build:
  status: partial_success
  date: 2025-06-17
  platform: OpenHarmony
  architecture: aarch64
  compiler: llvm
  sdk_version: ohos-sdk_26.0.0.18
  build_env:
    TMPDIR: /data/storage/el2/base/cache
  build_dir: /data/storage/el2/base/cache/builds/ppp-2.5.2.work
  configure_options:
    - --prefix=/usr
    - --build=aarch64-linux-gnu
    - --host=aarch64-linux-ohos
  notes: |
    核心组件编译成功：pppd、chat、pppstats
    PPPOE 插件编译失败：内核头文件定义冲突
    PPPOE 功能需要额外适配或内核头文件更新

artifacts:
  binaries:
    - name: pppd
      path: bin/pppd
      description: PPP 守护进程主程序
      required: true
    - name: chat
      path: bin/chat
      description: 拨号对话脚本工具
      required: true
    - name: pppstats
      path: bin/pppstats
      description: PPP 连接统计工具
      required: false
  libraries: []
  headers: []
  plugins:
    - name: pppoe
      status: failed
      description: PPPOE 插件编译失败

dependencies:
  runtime:
    - name: openssl
      version: ">=1.1.0"
      description: SSL 加密库
    - name: glibc
      version: ">=2.28"
      description: C 标准库
  build:
    - name: openssl-dev
      version: ">=1.1.0"
      description: SSL 开发头文件

features:
  pppd:
    - PPP over serial
    - PPP over Ethernet (需要 PPPOE 插件)
    - PAP/CHAP 认证
    - IP 地址协商
    - DNS 自动配置
  chat:
    - AT 命令对话脚本
    - Modem 拨号支持
    - 超时控制
  pppstats:
    - 连接状态监控
    - 流量统计
    - 性能指标显示

permissions:
  required:
    - ohos.permission.INTERNET
    - ohos.permission.GET_NETWORK_INFO
  notes: |
    PPP 需要 root 权限运行
    需要访问 /dev/ppp 设备节点
    需要创建网络接口权限

compatibility:
  ohos_version: ">=4.0"
  architectures:
    - aarch64
  tested: false

installation:
  prefix: /usr
  bin_dir: /usr/bin
  config_dir: /etc/ppp
  notes: |
    安装后需要配置：
    1. 创建 /etc/ppp/peers/ 目录
    2. 配置拨号脚本和认证信息
    3. 设置正确的文件权限（600）

notes:
  - PPPOE 插件需要额外适配 OpenHarmony 内核头文件
  - 建议在真实设备上测试 PPP 连接功能
  - chat 工具可用于调制解调器拨号场景
  - pppstats 用于监控连接状态和性能

troubleshooting:
  - issue: "PPPOE 插件编译失败"
    solution: "需要更新 OpenHarmony 内核头文件或修改 if_pppox.h 定义"
  - issue: "PPP 连接失败"
    solution: "检查设备权限、网络配置和认证信息"
  - issue: "无法创建 /dev/ppp"
    solution: "确保内核支持 PPP 设备，加载相应模块"