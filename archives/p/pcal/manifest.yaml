# manifest.yaml — pcal 软件级元数据
# 交叉校验用，CI 不依赖此文件

software: pcal
display: "pcal"
description: "命令行 PostScript/HTML 日历生成工具"
category: calendar
homepage: "https://pcal.sourceforge.net"
license: custom-permissive
build_system: makefile

ohos_adaptation:
  key_points:
    - "Makefile 默认 CC=/usr/bin/gcc，OHOS 上必须覆盖为 clang"
    - "上游 install 目标依赖 nroff/groff/compress，Conan package 阶段手动复制二进制和 man 源文件"
    - "OHOS 用户目录不支持 GNU make jobserver FIFO，recipe 使用 make -j1"
    - "pcal 是 CLI 工具，package_info 只声明 bindirs，不声明 libs"
  common_dependencies: []

versions:
  "4.11.0":
    status: built
    build_date: "2026-09-04"
    published_as: pcal
    source_url: "https://downloads.sourceforge.net/project/pcal/pcal/pcal-4.11.0/pcal-4.11.0.tgz"
