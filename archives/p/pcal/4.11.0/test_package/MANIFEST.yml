# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: pcal/4.11.0
homepage: "https://pcal.sourceforge.net"

# pcal uses a plain Makefile and has no upstream test suite.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "Run pcal version check and generate PostScript, HTML, and calendar-format output"
    command: "zsh test.sh"

assertion_count: 5
