# test_package/MANIFEST.yml
# php83-pecl-timezonedb/3.4.0

package: php83-pecl-timezonedb/3.4.0
homepage: "https://pecl.php.net/package/timezonedb"

# PHP PECL extensions don't have a standard make check target
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test suite for this simple data extension
upstream_tests: []

# Consumer-side test: load the .so and verify get_module symbol
test_package_tests:
  - file: test.c
    description: "Load timezonedb.so via dlopen and verify get_module symbol (PHP extension entry point)"
    command: "./test_timezonedb"

# Assertions: dlopen success + dlsym success + symbol not NULL
assertion_count: 3
