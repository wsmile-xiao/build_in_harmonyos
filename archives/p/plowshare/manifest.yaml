software: plowshare
display: "Plowshare"
description: "Command-line tool and engine for managing file-sharing websites (download/upload/delete/run module scripts)"
category: network
homepage: "https://github.com/mcrapet/plowshare"
license: GPL-3.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "plowshare is a pure Bash script suite (no C/C++ compilation, no ELF binaries, no signing needed)"
    - "Packaged as a script tool: src/*.sh scripts are copied into Conan package bin/ with version injected"
    - "Runtime requires bash>=4.1 (system tool, provided by PATH e.g. /data/service/hnp/bin/bash, not a Conan dep) and curl>=7.24 with SSL (curl/8.15.0 recipe); curl's transitive openssl is pinned via override=True to openssl/3.5.6.1.1 (CI-verified)"
    - "Upstream 2.1.7 ships NO host modules anymore; modules live in a separate repo pulled by plowmod --install, so real download/upload is limited without modules"
    - "Scripts locate core.sh via the directory of $0 (absolute_path), so all scripts must sit together in one flat bin/ layout"
versions:
  "2.1.7":
    status: built
    build_date: "2026-09-04"
    conan_ref: "plowshare/2.1.7"