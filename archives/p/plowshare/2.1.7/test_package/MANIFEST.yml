# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: plowshare/2.1.7
homepage: "https://github.com/mcrapet/plowshare"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "N/A — upstream provides no test directory and no make check/test target (pure Makefile install-only)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "bash -n core.sh && bash -n {download,upload,delete,list,probe,mod}.sh (6 CLIs) && VERSION injection verification"

# 上游实际运行的测试程序（此处为配方内等价校验）
upstream_tests:
  - file: src/core.sh
    source: plowshare-2.1.7/src/core.sh
    description: "Bash syntax validation for the shared core.sh library"
    command: "bash -n src/core.sh"
  - file: src/download.sh
    source: plowshare-2.1.7/src/download.sh
    description: "Bash syntax validation for plowdown (download.sh)"
    command: "bash -n src/download.sh"
  - file: src/upload.sh
    source: plowshare-2.1.7/src/upload.sh
    description: "Bash syntax validation for plowup (upload.sh)"
    command: "bash -n src/upload.sh"
  - file: src/delete.sh
    source: plowshare-2.1.7/src/delete.sh
    description: "Bash syntax validation for plowdel (delete.sh)"
    command: "bash -n src/delete.sh"
  - file: src/list.sh
    source: plowshare-2.1.7/src/list.sh
    description: "Bash syntax validation for plowlist (list.sh)"
    command: "bash -n src/list.sh"
  - file: src/probe.sh
    source: plowshare-2.1.7/src/probe.sh
    description: "Bash syntax validation for plowprobe (probe.sh)"
    command: "bash -n src/probe.sh"
  - file: src/mod.sh
    source: plowshare-2.1.7/src/mod.sh
    description: "Bash syntax validation for plowmod (mod.sh)"
    command: "bash -n src/mod.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.sh
    description: "消费者 smoke test: 6 CLIs 存在/可执行/bash -n/--version=2.1.7/--help Usage"
    command: "bash test.sh (per-CLI: command -v, -x, bash -n, --version, --help)"
  - file: conanfile.py (inline Python assertions)
    description: "消费者测试: 系统 bash 执行 --version、command -v 存在性、plowdown --help、test.sh 深度断言；bash 作为系统工具(PATH)不声明 Conan 依赖"
    command: "conan test (bash --version + 6 CLIs command -v + plowdown --help + test.sh)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 36

# 已知限制：上游 2.1.7 不再随包分发 host 模块（模块拆至 plowshare-modules-legacy 独立仓库，
# 由 plowmod --install 运行时拉取），因此真实下载/上传不在本包验证范围内。