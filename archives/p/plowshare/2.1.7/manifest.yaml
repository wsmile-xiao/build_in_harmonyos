software: plowshare
version: "2.1.7"
status: built
build_date: "2026-09-04"
build_system: "custom (pure Bash scripts, upstream ships a Makefile for install)"
conan_ref: "plowshare/2.1.7"

source:
  url: "https://codeload.github.com/mcrapet/plowshare/tar.gz/refs/tags/v2.1.7"
  sha256: "c17d0cc1b3323f72b2c1a5b183a9fcef04e8bfc53c9679a4e1523642310d22ad"
  tar_format: tar.gz

build:
  system: custom
  configure_options: []
  dependencies:
    - curl/8.15.0
    - openssl/3.5.6.1.1 (override=True)
  cc: N/A
  cxx: N/A

patches_applied: []

knowledge_gained:
  - "plowshare is a pure Bash script suite; no compiler, linker, ELF signing, strip or RPATH step is required"
  - "Each CLI sources core.sh via \"source $(absolute_path $0)/core.sh\", so all scripts must be installed flat in one directory (bin/)"
  - "Version is injected by replacing \"declare -r VERSION='GIT-snapshot'\" with the release version; --version prints it"
  - "Upstream 2.1.7 ships no host modules (src/modules only has a config placeholder); modules are pulled at runtime by plowmod --install, so offline download/upload is not testable"
  - "bash is a system tool on HarmonyOS (PATH, e.g. /data/service/hnp/bin/bash), not a Conan dependency; curl>=7.24(SSL) is covered by curl/8.15.0"
  - "curl's transitive openssl is pinned to openssl/3.5.6.1.1 via override=True (R37 adaptation-fix revision, conan-verify + W3 passed)"