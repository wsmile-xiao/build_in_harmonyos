software: perl-net-mpd
display: "Net::MPD"
description: "Perl 模块，提供面向对象接口与 MPD (Music Player Daemon) 服务器通信"
category: perl
homepage: "https://metacpan.org/pod/Net::MPD"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，使用 Module::Build::Tiny 构建 (perl Build.PL && ./Build)，无 C/XS 编译"
    - "Conan package() 需将产物从深层 site_perl 路径重组到 lib/ 根目录以通过 G4 检查"
    - "test_package 中 Perl 命令须用单引号包裹，避免 shell 对 $Module::Variable 的误插值"
    - "纯 Perl 模块不存在 SELinux HMDFS 限制，用户安装后即用，无需管理员权限"
  common_dependencies: []

versions:
  "0.07-r3":
    status: published
    build_date: "2026-06-29"
    published_as: perl-net-mpd
    source_url: "https://cpan.metacpan.org/authors/id/A/AB/ABERNDT/Net-MPD-0.07.tar.gz"
