# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 Module::Build::Tiny (perl Build.PL && ./Build)，不使用 Makefile.PL (ref: L3-build-system)"
  - "Conan G4 产物完整性检查不适用于纯 Perl 模块默认安装路径（深层 site_perl 路径），需在 package() 中将产物重组到 lib/ 根目录 (ref: L3-conan-package)"
  - "CPAN 是 Perl 模块的可靠下载源，Savannah 服务器不稳定 (ref: L3-source)"
  - "test_package 中的 Perl 命令必须用单引号包裹，避免 shell 对 $Module::Variable 的误插值 (ref: L3-test-escaping)"
  - "纯 Perl 模块无需 C 编译器，settings 只需 os 和 arch，无需 compiler/build_type (ref: L3-settings)"
