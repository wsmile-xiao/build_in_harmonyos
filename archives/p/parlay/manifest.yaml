# 软件级 manifest — parlay
software: parlay
display: "parlay"
description: "Enrich SBOMs with data from third party services（纯 Go CLI）"
category: build-tool
homepage: "https://github.com/snyk/parlay"
license: Apache-2.0
build_system: custom

ohos_adaptation:
  key_points:
    - "纯 Go 静态编译（CGO_ENABLED=0，GOOS=linux，GOARCH=arm64）"
    - "Go linker mmap 在 HMDFS 上 permission denied，链接输出需放在 ext2 可写分区（/data/storage/el2/base/haps/entry/files）"
    - "OHOS 上每个被 fork/exec 的 ELF 必须用 binary-sign-tool 自签名（含 .codesign section）"
  common_dependencies: []

versions:
  "0.11.0":
    status: built
    build_date: "2026-10-02"
    conan_ref: "parlay/0.11.0"
