# test_package/MANIFEST.yml — parlay 0.11.0
# Upstream and consumer test declaration (CI L0e + HMBS evidence gate).

package: parlay/0.11.0
homepage: "https://github.com/snyk/parlay"

# Upstream test entry: Makefile `test: lint` + `go test -cover -v ./...`.
# lint needs golangci-lint (not run in conan); conan runs the go test part.
upstream_check_command: "go test -v -count=1 ./..."
upstream_test_in_build: true
upstream_test_command: "go test -v -count=1 ./..."

# Official registered total: 72 Test functions across 13 *_test.go files.
# Counting command (run at tag v0.11.0 root):
#   grep -rhoE '^func (Test[A-Za-z0-9_]+)' --include='*_test.go' . | wc -l  -> 72
# Single Go test framework, therefore method is auto.
upstream_test_total: 72
upstream_test_count_method: "auto"
upstream_tests_exist: true
upstream_test_audit:
  - source: "v0.11.0 source tree (`grep -rhoE '^func (Test[A-Za-z0-9_]+)' --include='*_test.go' . | wc -l` -> 72, 13 files)"
    reason: "13 *_test.go files (internal/utils x3, lib/ecosystems x5, lib/sbom x1, lib/scorecard x1, lib/snyk x3) contain 72 top-level func TestXxx; `go test -v` --- PASS: lines map 1:1 to this count."
  - source: "Makefile (`test: lint` + `@go test -cover -v ./...`)"
    reason: "Official unit-test entry is go test; lint step needs golangci-lint and is not run in conan (declared, not skipped silently)."
  - source: "acceptance.bats (6 @test cases)"
    reason: "Bats acceptance needs bats runner + live ecosyste.ms API (5 enrich cases hit network) + built binary; not part of the `go test` 72-count, documented here instead of counted."
  - source: ".github/workflows/ci.yml"
    reason: "CI runs the go test suite; release.yml is GoReleaser-only. No ctest/pytest/make check entry exists."
  - conclusion: "Upstream 0.11.0 provides 72 automated Go unit tests; the recipe runs `go test -v -count=1 ./...` in build() and parses --- PASS:/--- FAIL:/--- SKIP: lines for HMBS_UPSTREAM_TEST_RESULT (discovered=72)."

