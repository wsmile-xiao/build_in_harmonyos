# Consumer tests bundled in test_package (binary smoke test, not upstream).
test_package_tests:
  - file: test.sh
    description: "冒烟测试: --version 断言 0.11.0 + --help 核心子命令 + 无效文件失败闭合 + SBOM 提及"
    command: "sh test.sh <bin/parlay>"

# test.sh assertions:
#   1. `parlay --version` exit 0 + output contains 0.11.0
#   2. `parlay --help` contains ecosystems + snyk + scorecard
#   3. `parlay ecosystems enrich not-here` exits nonzero
#   4. `parlay --help` mentions SBOM
test_package_test_count: 4
assertion_count: 4
