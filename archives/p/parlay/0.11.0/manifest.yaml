# manifest.yaml — parlay 0.11.0 (HarmonyOS PC)
version: "0.11.0"
software: "parlay"
status: "built"
arch:
  - "armv8"
  - "x86_64"
build_system:
  - "conan2"
  - "go1.24.0"
toolchain:
  go: "1.24.0"
  cgo: false
source:
  upstream: "https://github.com/snyk/parlay"
  tag: "v0.11.0"
  url: "https://github.com/snyk/parlay/archive/refs/tags/v0.11.0.tar.gz"
  sha256: "c1f9eaa073b6c958a0722b145fcea9fa3579c9b5552f3359d86f91917441253b"
  license: "Apache-2.0"
build:
  entry: "go build -trimpath ."
  output_binary: "parlay"
  ldflags: "-s -w -X github.com/snyk/parlay/internal/commands.version=0.11.0 -X github.com/snyk/parlay/lib/ecosystems.Version=0.11.0 -X github.com/snyk/parlay/lib/snyk.Version=0.11.0"
patches_applied: []
knowledge_gained:
  - "parlay is a pure-Go CLI (module github.com/snyk/parlay, main.go at repo root); CGO disabled, GOOS=linux, static binary for OHOS/arm64 and x86_64."
  - "go.mod declares go 1.23, so Go >= 1.24.0 SDK satisfies the toolchain; GOTOOLCHAIN=local pins the local SDK."
  - "Go linker mmap fails on HMDFS/tmpfs: link output must be placed on an ext2-like writable workspace (/data/storage/el2/base/haps/entry/files)."
  - "On OHOS every executed ELF (the parlay binary and Go SDK tool binaries) must carry a .codesign section; sign with binary-sign-tool."
  - "Upstream 0.11.0 ships 13 *_test.go files with 72 Test functions; official entry is `make test` -> `go test -cover -v ./...` (lint needs golangci-lint, skipped)."
