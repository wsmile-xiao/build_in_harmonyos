knowledge_gained:
  - "PCCTS 非单构建根：根 makefile 仅递归 cd，四个子目录 makefile 各自硬编码 CC=cc/COPT 且无 configure/install —— 配方须自写按依赖序的构建步骤（antlr→dlg→sorcerer→sorcerer/lib→genmk），OHOS 无 cc 必须显式 CC=clang # knowledge_ref: E679"
  - "sorcerer/lib/{sorlist,sintstack}.c 缺 #include pcctscfg.h 致 PCCTS_USE_STDARG 不生效掉进 <varargs.h>，clang 15 shim 直接 #error —— 同目录 astlib.c/sstack.c 带了该头故正常，是单文件级头缺失而非全局配置问题 # knowledge_ref: E679"
  - "PCCTS 上游测试三类端口性失败：老式头 <iostream.h>/<stream.h>（libc++ 无）、K&R 内嵌 main() 缺返回类型、rexpr 静态/非静态声明冲突（两分支都要改）—— 补丁后 testcpp 3/13→13/13、sorcerer 族 12/12、rexpr 1/1 # knowledge_ref: E679"

