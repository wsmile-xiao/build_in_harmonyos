# 版本级 manifest — pccts 1.33mr33
# 文件位置: archives/p/pccts/1.33mr33/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.33mr33"

# 软件名
software: "pccts"

# 编译状态
# O5 口径：只有合并后 release upload 已确认才 published，此前一律 built
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-23"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL：Ubuntu 官方 pool 中的**上游 pristine .orig.tar.gz**（https）。
  # 上游 antlr.org 下载面已 404、polhode.com 无 tarball、无官方 git tag —— 属非 git 上游，
  # 按「官方渠道存在该版本可构建发行物」判据取用发行版 pristine 打包（非 dfsg 重打包）。
  # 三方同源交叉验证：本 sha256 == Debian .dsc（PGP 签名）Checksums-Sha256 == 本机对
  # Ubuntu pool 下载物实算（550186 B），逐字节一致（W0 实核锚定）。
  # URL 取 Ubuntu 而非 deb.debian.org：后者在官方 PF7 的 _PF7_DEBIAN_HOSTS 名单内会被判
  # 「Debian 下游重打包源」；Ubuntu 主机不在名单内，且两者是同一份 pristine tarball。
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/p/pccts/pccts_1.33MR33.orig.tar.gz"

  # 源码校验和
  sha256: "49556ae11851391ca124d3beef15f3969f65524c29714770a1a22b51106e1c7a"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型：上游**不是单构建根** —— 根 makefile 只是依次 cd 进子目录，
  # 四个子目录 makefile 各自带 CC=cc / COPT=-O 硬编码默认值，且无 configure、无 install 目标。
  # 配方 build() 因此自写按依赖序的构建步骤（antlr → dlg → sorcerer → sorcerer/lib → genmk）。
  system: makefile

  # 无 configure 阶段（纯 make 工程）
  configure_options: []

  # 编译依赖：无硬依赖（W0-2 实核：无外部 -l、无 pkg-config、无 AC_CHECK_LIB，纯标准 C/C++）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
