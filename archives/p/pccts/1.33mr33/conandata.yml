# conandata.yml — pccts 1.33mr33
#
# 源 = Ubuntu 官方 pool 中的**上游 pristine .orig.tar.gz**（即上游 1.33MR33 原样发行物）。
# 为什么不是上游自有渠道：pccts 上游**没有 git 仓库/tag**，官方下载面 antlr.org 已 404、
# polhode.com 只留文档不再分发 tarball —— 属非 git 上游，按「官方渠道存在该版本可构建
# 发行物」判据取用**发行版 pristine 打包**。
#
# 三方同源交叉验证（sha256 锚定，W0 实核）：
#   1) 本文件 sha256        49556ae1...6e1c7a
#   2) Debian .dsc（PGP 签名）Checksums-Sha256 + size 550186 逐字节一致
#   3) 本机对 Ubuntu pool 下载物实算          逐字节一致（550186 B）
# 即 Ubuntu 与 Debian 的 .orig.tar.gz 是同一份上游 pristine tarball（均非 dfsg 重打包）。
# URL 用 Ubuntu pool：它同样 https、同样 pristine，且 PF7 源 URL 闸对 Debian 下游主机
# （_PF7_DEBIAN_HOSTS）会命中「Debian 下游重打包源」，Ubuntu 主机不在该名单内。

sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/p/pccts/pccts_1.33MR33.orig.tar.gz"
  sha256: "49556ae11851391ca124d3beef15f3969f65524c29714770a1a22b51106e1c7a"
patches:
- patch_file: patches/0001-sorcerer-lib-sintstack.c.patch
  patch_description: '补 #include pcctscfg.h：该文件头部只有 stdio.h/setjmp.h，缺此头则 PCCTS_USE_STDARG 不生效而掉进 varargs.h 分支，clang 15 shim 直接 #error（与同目录已带头的 astlib.c/sstack.c 对齐）'
  patch_type: portability
- patch_file: patches/0002-sorcerer-lib-sorlist.c.patch
  patch_description: '同 0001：补 #include pcctscfg.h，根治 varargs.h 端口性错误'
  patch_type: portability
- patch_file: patches/0003-sorcerer-testcpp-test.sor.patch
  patch_description: 内嵌 main() 补 int 返回类型（C++ 不允许隐式 int）
  patch_type: portability
- patch_file: patches/0004-sorcerer-testcpp-test2.sor.patch
  patch_description: 同 0003：main() 改为 int main()
  patch_type: portability
- patch_file: patches/0005-sorcerer-testcpp-test3.sor.patch
  patch_description: 同 0003：main() 改为 int main()
  patch_type: portability
- patch_file: patches/0006-sorcerer-testcpp-test4-main.cpp.patch
  patch_description: 同 0003：main() 改为 int main()
  patch_type: portability
- patch_file: patches/0007-sorcerer-testcpp-test5.sor.patch
  patch_description: 同 0003：main() 改为 int main()
  patch_type: portability
- patch_file: patches/0008-support-rexpr-makefile.patch
  patch_description: 链接命令硬编码 cc 改为 $(CC) 并补 CC=cc 默认值（OHOS 无 cc，原样必 Error 127）
  patch_type: portability
- patch_file: patches/0009-support-rexpr-rexpr.c.patch
  patch_description: rexpr/match 去 static：与 rexpr.h 的非 static 声明冲突（static declaration follows non-static declaration），且 test.c 需外部可见
  patch_type: portability
- patch_file: patches/0010-testcpp-13-test.g.patch
  patch_description: 删除冗余 include stream.h（老式头 libc++ 无；该内嵌 main 全文 0 处流符号使用）
  patch_type: portability
- patch_file: patches/0011-testcpp-2-MyLexer.cpp.patch
  patch_description: include iostream.h 改为 iostream + using namespace std（libc++ 无老式头；该文件直接 include，不经过有宏保护的 pccts_iostream.h）
  patch_type: portability
- patch_file: patches/0012-testcpp-3-MyLexer.cpp.patch
  patch_description: 同 0011：iostream.h 改为 iostream + using namespace std
  patch_type: portability
