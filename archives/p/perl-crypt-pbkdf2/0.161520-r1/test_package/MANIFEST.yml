# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-crypt-pbkdf2/0.161520-r1
homepage: "https://metacpan.org/dist/Crypt-PBKDF2"

upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: t/01-raeburn.t
    description: "PBKDF2 RFC 6070 test vectors and basic functionality"
    command: "perl -Iblib/lib -Iblib/arch t/01-raeburn.t"
  - file: t/02-validate.t
    description: "Password validation tests"
    command: "perl -Iblib/lib -Iblib/arch t/02-validate.t"
  - file: t/03-clone.t
    description: "Object cloning tests"
    command: "perl -Iblib/lib -Iblib/arch t/03-clone.t"
  - file: t/04-params.t
    description: "Constructor parameter tests"
    command: "perl -Iblib/lib -Iblib/arch t/04-params.t"
  - file: t/05-crypt-ldap.t
    description: "LDAP and crypt encoding tests"
    command: "perl -Iblib/lib -Iblib/arch t/05-crypt-ldap.t"
  - file: t/06-length-limit.t
    description: "Password length limit tests"
    command: "perl -Iblib/lib -Iblib/arch t/06-length-limit.t"

test_package_tests:
  - file: test_pbkdf2.sh
    description: "Crypt::PBKDF2 functional test (generate, validate, RFC 6070 vectors, HMAC-SHA1/SHA256)"
    command: "bash test_pbkdf2.sh"

assertion_count: 48
