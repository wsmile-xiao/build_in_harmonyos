# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Perl 模块使用 Makefile.PL 构建系统，conanfile.py build() 用 self.run('perl Makefile.PL') + self.run('make -j1')"
  - "HMDFS 安全模块 (hmmac) 阻止从 /storage 路径加载未签名 .so 文件，影响所有 XS 模块"
  - "B::Hooks::EndOfScope 可通过 PERL_B_HOOKS_ENDOFSCOPE_BACKEND=PP 环境变量回退到纯 Perl 实现"
  - "Conan 2.x self.run() 的 env 参数需要 list 格式 ['KEY=VAL']，非 dict；内联环境变量更可靠"
  - "Conan test_package 分层测试策略：文件检查(必须)+语法检查(非致命)+功能测试(可选)，适配有外部依赖的纯 Perl 模块"
  - "cpanm 在鸿蒙不可用 (prctl bug)，需手动从 CPAN 下载安装依赖"
  - "RFC 6070 PBKDF2 测试向量可用于验证 HMAC-SHA1 实现正确性"
