software: perl-crypt-pbkdf2
display: "Crypt::PBKDF2"
description: "PBKDF2 password hash algorithm (pure Perl module)"
category: crypto
homepage: "https://metacpan.org/dist/Crypt-PBKDF2"
license: "GPL-1.0-or-later OR Artistic-1.0"
build_system: custom

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Perl 模块，使用 Makefile.PL (ExtUtils::MakeMaker) 构建，无 C/XS 编译"
    - "Perl 运行时依赖 (Moo, Type::Tiny 等) 由 CPAN 管理，不在 Conan requirements 中声明"
    - "cpanm 在鸿蒙不可用 (prctl bug)，需手动从 CPAN 下载安装依赖到 $HOME/perl5"
    - "XS 模块 .so 文件无法从 HMDFS (/storage) 路径加载 (hmmac 安全模块限制)"
    - "B::Hooks::EndOfScope 需设置 PERL_B_HOOKS_ENDOFSCOPE_BACKEND=PP 回退到纯 Perl 实现"
    - "Digest::SHA3 不可用 (XS only)，HMAC-SHA3 功能受限；HMAC-SHA1/SHA256/SHA512 完全可用"
    - "test_package 使用分层测试：文件检查(必须)+语法检查(非致命)+功能测试(可选)"
  common_dependencies:
    - perl (5.42.0+)
    - cpan-modules (Moo, Type::Tiny, Try::Tiny, Module::Runtime, Digest::HMAC, namespace::autoclean, strictures)

# 版本索引
versions:
  "0.161520-r1":
    status: built
    build_date: "2026-07-06"
    conan_ref: "perl-crypt-pbkdf2/0.161520-r1@ohpcd/stable"
