software: perl-local-lib
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.000029-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.000029-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-13"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/H/HA/HAARG/local-lib-2.000029.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 构建系统（用于质量门禁检查）
  build_system: perl

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 perl Makefile.PL PREFIX=~/usr/local 构建"
  - "无 make check 目标是 Perl 模块常见情况，跳过测试并记录原因"
  - "质量门禁 G4 '无二进制文件' 对纯 Perl 模块是正常现象"
  - "DESTDIR 模式：--prefix=$DEFAULT_PREFIX + DESTDIR=$TEST_PREFIX"
  - "Perl 模块本地安装设置参考 E-PERL-LOCAL-LIB 知识条目"
