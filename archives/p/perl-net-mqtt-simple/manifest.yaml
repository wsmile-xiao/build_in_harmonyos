software: perl-net-mqtt-simple
description: "Minimal MQTT version 3.1.1 interface (Net::MQTT::Simple) — pure Perl module"
homepage: "https://metacpan.org/release/Net-MQTT-Simple"
repository: "https://github.com/Juerd/Net-MQTT-Simple.git"
license: "unknown"

# 版本索引
versions:
  - version: "1.33-r0"
    status: built
    build_date: "2026-06-26"
    notes: "纯 Perl 模块，无需补丁，conan-verify 全部通过，功能测试 15/15 通过"

# 运行时依赖
runtime_dependencies:
  - "perl >= 5.10"

# 构建依赖
build_dependencies:
  - "perl >= 5.10"
  - "ExtUtils::MakeMaker >= 6.58"

# 可选依赖
optional_dependencies:
  - "IO::Socket::SSL (for Net::MQTT::Simple::SSL TLS support)"
