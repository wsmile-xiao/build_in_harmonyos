software: perl-net-mqtt-simple
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.33-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.33-r0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/J/JU/JUERD/Net-MQTT-Simple-1.33.tar.gz"

  # 源码校验和
  sha256: "58539c1c2794d25872652d78a26c9fd26b627bdad1b9134a159869c1b2822aa7"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 纯 Perl 模块，使用 perl Makefile.PL 生成 Makefile

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无外部依赖，仅依赖 Perl 核心模块

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 Perl 模块，无需补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在鸿蒙平台可直接编译运行，无需处理 SELinux/HMDFS 限制"
  - "Net::MQTT::Simple 使用 Makefile.PL (ExtUtils::MakeMaker) 构建系统，与 perl-dbd-pg 类似但无需 XS 编译"
  - "纯 Perl 模块不受 SELinux HMDFS 限制影响，与 XS 模块 (如 perl-dbd-pg) 形成鲜明对比"
  - "SSL 子模块 (Net::MQTT::Simple::SSL) 依赖 IO::Socket::SSL，当前平台未安装，为可选功能"
  - "conan-verify 全部通过 (G0-G4, L2, L4, L5)，产物基线一致"
  - "功能测试 15/15 通过，包括 publish/subscribe/通配符/大消息/二进制/UTF-8 等场景"
