software: pnglite
display: "pnglite"
description: "A lightweight C library for reading and writing PNG images"
category: gfx
homepage: "https://sourceforge.net/projects/pnglite/"
license: Zlib
build_system: cmake

ohos_adaptation:
  key_points:
    - "Use the public zlib header instead of the upstream sibling-directory include"
    - "Build a static archive because the published zlib dependency is static-only and non-PIC"
    - "Exercise encoding and decoding on HarmonyOS AArch64 through callback IO"
  common_dependencies:
    - zlib

versions:
  "0.1.17":
    status: built
    build_date: "2026-09-15"
    conan_ref: "pnglite/0.1.17"
