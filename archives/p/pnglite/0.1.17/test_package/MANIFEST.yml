package: pnglite/0.1.17
homepage: "https://sourceforge.net/projects/pnglite/"

upstream_check_command: "find . -maxdepth 3 -type f; find . -maxdepth 3 -type d -iname '*test*'; rg -n -i 'test|check|ctest|assert|main\\s*\\(' ."
upstream_test_in_build: false
upstream_test_command: ""

# The official 0.1.17 zip contains only pnglite.c and pnglite.h. It has no
# test directory, registered tests, example program, or build/test command.
upstream_tests: []

test_package_tests:
  - file: test_pnglite.c
    description: "Twenty-assertion public API test covering callback IO, PNG encode/decode round-trip, metadata, errors, and malformed input"
    command: "./test_pnglite"
  - file: harmonyos_specific_test.c
    description: "HarmonyOS-only OHOS/AArch64 compile-time checks plus five runtime assertions for callback IO and zlib-backed PNG encoding"
    command: "./harmonyos_specific_test"

assertion_count: 25
