knowledge_gained:
  - "官方 zip 仅包含两个源码文件，无构建系统和测试套件，需要配方侧提供最小 CMake 构建描述。"
  - "上游写入函数必须按 zlib compressBound 分配 IDAT 缓冲区，否则真实编码路径发生堆越界。"
  - "PNG 大端字段解析必须在左移前提升为 unsigned，避免高字节触发有符号左移未定义行为。"
  - "已发布的 zlib/1.3.1 是非 PIC 静态库，因此 pnglite 采用静态交付并通过 Conan 传播 zlib 依赖。"

