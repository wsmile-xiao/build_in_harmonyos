knowledge_gained:
  - usd_cmake_target: USD uses pxr_library() macro to define CMake targets, build target "vt" pulls in arch, tf, gf, trace, work
  - usd_generated_headers: USD generates api.h headers in build/include/, must be packaged alongside source headers
  - usd_python_disabled: Python support disabled via PXR_ENABLE_PYTHON_SUPPORT=OFF and CMAKE_DISABLE_FIND_PACKAGE_Python
  - usd_lib_prefix: USD static libraries are named libusd_<name>.a (not lib<name>.a), located in build/pxr/base/<name>/ subdirectories
  - usd_work_headeronly: The work library is header-only, no .a file produced
  - ohos_environ: On OHOS, __environ is not available; use environ (declared in unistd.h) instead
  - ohos_sysconf: _SC_LEVEL1_DCACHE_LINESIZE is not defined on OHOS; use default 64
  - ohos_strerror_r: On OHOS, strerror_r returns int (POSIX), not char* (GNU); avoid _GNU_SOURCE path
  - ohos_deffilemode: DEFFILEMODE is not defined in sys/stat.h on OHOS; define it as 0666
patches_applied:
  - patch_file: "patches/0001-arch-fixes-for-ohos.patch"
    description: "Fix arch library build errors on OHOS: _SC_LEVEL1_DCACHE_LINESIZE undefined, strerror_r return type mismatch, __environ to environ, DEFFILEMODE undefined in tf"
source_url: https://github.com/PixarAnimationStudios/OpenUSD/archive/refs/tags/v26.08.tar.gz
