version: "0.4.8"
software: "pslib"
status: built
build_date: "2026-09-26"
build_system: autotools
source:
  url: "https://deb.debian.org/debian/pool/main/p/pslib/pslib_0.4.8.orig.tar.gz"
  sha256: "4806d1b9f2cfa6245b2ba54735ce9d306570e891a75621cafe7c8079bce01c17"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--with-png=<Conan libpng package>"
    - "--with-jpeg=<Conan libjpeg package>"
    - "--with-gif=no"
    - "--with-tiff=no"
    - "--disable-nls"
  dependencies:
    - "libpng/1.6.58.3"
    - "libjpeg/10"
  build_tools:
    - "intltool/0.51.0"
    - "gettext/0.22.5.1"
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "NLS=no 不保证旧 intltool 宏跳过 XML::Parser，也不保证 po/check 不运行；只按 USE_NLS 条件化模块检查，保留真实工具。"
