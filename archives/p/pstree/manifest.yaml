software: pstree
version: "23.7"
status: success
build_system: manual
compile_date: "2026-04-28"

dependencies:
  required: [clang, ncursesw]
  optional: []

build_config:
  target: aarch64-unknown-linux-ohos
  source: https://gitlab.com/psmisc/psmisc.git
  build_method: single_file
  compile_command: clang -DVERSION="23.7" -o pstree pstree.c -I$HOME/usr/local/include -L$HOME/usr/local/lib -lncursesw

patches_applied: []

compatibility:
  level: full
  issues: []
  notes: "单文件编译成功，依赖 ncursesw 静态库"

test_results:
  type: manual
  command: "pstree --version"
  result: "success"

knowledge_gained:
  - "psmisc 整包编译失败时，可单独编译 pstree.c"
  - "需要手动定义 VERSION 宏"
  - "使用 libncursesw.a（带宽字符支持）"

notes: "从 psmisc 仓库单独编译 pstree 工具，跳过完整的 autotools 构建流程"