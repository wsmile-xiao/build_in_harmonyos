# 软件级 manifest — pasco
# 文件位置: archives/p/pasco/manifest.yaml
software: pasco
display: "Pasco"
description: "Forensic parser that dumps Windows Internet Explorer index.dat cache/store records as delimited text"
category: utility
homepage: "https://sourceforge.net/projects/odessa/"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游 src/Makefile 把编译器字面量写死为 gcc，本平台无 gcc，需以 $(CC) 变量形式出补丁"
    - "上游 install 目标 cp 到 ../bin，而发行包内没有 bin/ 目录，需 mkdir -p ../bin 兜底"
    - "纯格式解析器，无平台相关系统调用（pread/open/localtime），无外部依赖"
    - "输入是 Windows index.dat 专有格式样本，Forensics 场景文件在本平台不可得，测试输入由源码偏移表合成"
  common_dependencies: []

versions:
  "20040505":
    status: built
    build_date: "2026-09-27"
    conan_ref: "pasco/20040505"
