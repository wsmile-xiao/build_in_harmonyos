# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pasco/20040505
homepage: "https://sourceforge.net/projects/odessa/"

# 上游 Makefile 只有 4 个目标：all / install / installwin / clean（实测 grep 见 notes.md），
# 既无 check 目标，树内也无任何测试源文件（发行包共 4 个文件：CHANGES、Readme.txt、
# src/Makefile、src/pasco.c）。故上游测试数 = 0，此处不填假命令。
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序：无
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 直接调用已安装二进制)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 7 组场景真执行 pasco：无参数 usage(254)、合成 index.dat 解析(0)、-t 自定义分隔符、-d undelete、非法选项(255)、文件打不开(253)、非 index.dat 输入的上游死循环(timeout 兜住,124)；断言退出码 + stdout/stderr 归属 + 分隔字段数"
    command: "sh test.sh"
  - file: gen_index_dat.py
    description: "合成样本生成器 — 按 pasco.c 的偏移表构造 index.dat v5.2（哈希表 1 块 + 一条 URL 记录），771 字节"
    command: "python3 gen_index_dat.py <out>"

# 测试断言总数（test.sh 自计并打印 ASSERTIONS=，与实测一致）
assertion_count: 27
