software: perl-mozilla-ca
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/20250602-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "20250602-r0"

# 编译状态
