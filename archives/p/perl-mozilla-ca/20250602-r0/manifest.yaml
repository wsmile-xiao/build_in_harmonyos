# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"
compile_date: "2026-06-24"

# 构建系统（顶层字段，用于自检）
build_system: perl-makefile-pl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/downloads/Mozilla-CA-20250602.tar.gz"

  # 源码校验和
  sha256: "adeac0752440b2da094e8036bab6c857e22172457658868f5ac364f0c7b35481"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
