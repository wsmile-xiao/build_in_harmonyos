# 软件级 manifest
# 文件位置: archives/p/protomol/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0（软件级元数据 + 版本索引）

software: protomol
display: "ProtoMol"
description: "Object-oriented framework for prototyping novel molecular dynamics algorithms"
category: science
homepage: "https://protomol.sourceforge.net/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游发布包名为 protomol-2.0.3-tar.gz；conandata sources 需用 filename 覆盖为 .tar.gz，否则 conan unzip() 只解 gzip 而不解 tar。"
    - "上游完全不支持源外构建：configure 的偏特化探测用源码根相对 include，故 layout() 置 folders.build='.' 就地构建。"
    - "11 个补丁：clang 两阶段名字查找需显式 this->；libc++ 无 std::set 迭代器空指针构造；MyStreamer 自插入流；configure/configure.in 由 Latin-1 无损转 UTF-8 以绕过 OHOS toybox sed 丢弃非法 UTF-8 行的缺陷；configure 内建 config.status 临时目录的 umask 077→022（CI worker 的 HMDFS 上 0700 目录不可写，否则 configure exit 2）。"
    - "无第三方 Conan 依赖：FFT 用内置 ZFFT，--with-glut=no，libpng 关闭（PNG 写出路径为不可达死代码）。"
    - "make install 仅产出 bin/ 下 6 个可执行文件（全部框架库为 noinst_LIBRARIES，无 _HEADERS 安装目标）。"
  common_dependencies: []

versions:
  "2.0.3":
    status: published
    build_date: "2026-09-27"
