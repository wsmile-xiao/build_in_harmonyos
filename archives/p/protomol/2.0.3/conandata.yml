sources:
  # Upstream SourceForge project page.  NOTE: the distributed file name is
  # "protomol-2.0.3-tar.gz" — there is a HYPHEN instead of a dot before "tar",
  # which is upstream's own naming, not a typo.
  #
  # `filename` is mandatory here.  Conan's `tools.files.get()` derives the saved
  # name from the URL and then calls `unzip()`, whose archive detection is:
  #   endswith((".tar.gz", ".tgz", ".tbz2", ".tar.bz2", ".tar"))  -> untargz()
  #   endswith(".gz")                                            -> gzip only
  # "...-tar.gz" matches NEITHER ".tar.gz" (the char before "tar.gz" is '-' and
  # not '.') so it falls into the plain ".gz" branch: the gzip stream is
  # decompressed into a bare `protomol-2.0.3-tar` file and the tar is never
  # unpacked.  The source folder then contains no sources at all and
  # apply_conandata_patches() fails with
  #   "source/target file does not exist".
  # Saving it under a name ending in ".tar.gz" restores the untargz() path.
  url: "https://downloads.sourceforge.net/project/protomol/ProtoMol/2.0.3/protomol-2.0.3-tar.gz"
  filename: "protomol-2.0.3.tar.gz"
  sha256: "52c5faf69c717516a2b071dabbaed089ae7e9944b706e391e74604946a69c183"

patches:
  - patch_file: "patches/0001-applications-iSGProtomol-app-forces-iSGDihedralSystemForce.h.patch"
    patch_description: "Qualify calcTorsion() with this-> — clang is stricter than the ancient gcc this code targets and requires explicit qualification for members inherited from a dependent base class in a class template"
    patch_type: "portability"
  - patch_file: "patches/0002-applications-iSGProtomol-app-forces-iSGImproperSystemForce.h.patch"
    patch_description: "Qualify calcTorsion() with this-> — same two-phase name lookup requirement as the dihedral force"
    patch_type: "portability"
  - patch_file: "patches/0003-framework-base-Report.cpp.patch"
    patch_description: "MyStreamer::operator<<(const ostream&) re-inserted its ostream operand into itself, which libc++ does not overload; insert the operand address instead so the diagnostic path streams a comparable value"
    patch_type: "portability"
  - patch_file: "patches/0004-framework-forces-DihedralSystemForce.h.patch"
    patch_description: "Qualify calcTorsion() with this-> — clang two-phase name lookup for dependent base class members"
    patch_type: "portability"
  - patch_file: "patches/0005-framework-forces-HarmDihedralSystemForce.h.patch"
    patch_description: "Qualify calcTorsion() with this-> — clang two-phase name lookup for dependent base class members"
    patch_type: "portability"
  - patch_file: "patches/0006-framework-forces-ImproperSystemForce.h.patch"
    patch_description: "Qualify calcTorsion() with this-> — clang two-phase name lookup for dependent base class members"
    patch_type: "portability"
  - patch_file: "patches/0007-framework-forces-NonbondedCutoffMollyForce.h.patch"
    patch_description: "Qualify numberOfBlocks() with this-> — clang two-phase name lookup for dependent base class members"
    patch_type: "portability"
  - patch_file: "patches/0008-framework-forces-NonbondedCutoffSystemForce.h.patch"
    patch_description: "Qualify numberOfBlocks() with this-> — clang two-phase name lookup for dependent base class members"
    patch_type: "portability"
  - patch_file: "patches/0009-framework-frontend-OutputDihedrals.cpp.patch"
    patch_description: "Drop the invalid ' = NULL' initialiser from four std::set<int>::iterator locals — libc++ has no iterator constructor from a null pointer constant (matches the long-standing FreeBSD port patch)"
    patch_type: "portability"
  - patch_file: "patches/0010-ohos-autotools-latin1-to-utf8.patch"
    patch_description: "Convert configure.in and the shipped configure from Latin-1 to UTF-8: the PACKAGE_CITE definition embeds a 0xAD byte and the OHOS userland sed (toybox) drops any line containing an invalid UTF-8 sequence, so AC_DEFINE_UNQUOTED(PACKAGE_CITE,...) silently vanished from the generated protomol_config.h and three binaries failed to compile with 'use of undeclared identifier PACKAGE_CITE'. Conversion is lossless (same character, U+00AD) and matches knowledge entry DRAFT-E549"
    patch_type: "portability"
  - patch_file: "patches/0011-configure-umask-022.patch"
    patch_description: "Use umask 022 instead of 077 when configure/config.status creates its temporary ./confstatXXXXXX directory. On the CI worker's HMDFS the 0700 directory created under umask 077 is not writable, so every config.status write into it fails with 'Permission denied' (subs.sed/subs.frag/out/in/undefs.sed/config.h) and configure exits 2. Same fix as a52dec/0.7.4, teseq/1.1.1 and vttest/2.7-20251205"
    patch_type: "portability"
