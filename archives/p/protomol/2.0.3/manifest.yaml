# 版本级 manifest
# 文件位置: archives/p/protomol/2.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "2.0.3"
software: "protomol"
status: published
build_date: "2026-09-27"
build_system: "autotools"

source:
  url: "https://downloads.sourceforge.net/project/protomol/ProtoMol/2.0.3/protomol-2.0.3-tar.gz"
  # 上游分发包名在 tar 前用连字符（protomol-2.0.3-tar.gz）而非点。
  # conan tools.files.get() 会把 `...-tar.gz` 落到 unzip() 的 `endswith(".gz")` 分支:
  #   endswith((".tar.gz",".tgz",".tbz2",".tar.bz2",".tar")) -> untargz()
  #   endswith(".gz")                                        -> 仅 gzip 解压
  # "...-tar.gz" 不匹配 ".tar.gz"(tar.gz 前一位是 '-' 不是 '.')，于是 gzip 流被解成
  # 裸文件 protomol-2.0.3-tar，tar 从未解开 => source_folder 内无源码 =>
  # apply_conandata_patches 报 "source/target file does not exist"。
  # 用 filename 覆盖保存名，恢复 untargz() 路径。
  filename: "protomol-2.0.3.tar.gz"
  sha256: "52c5faf69c717516a2b071dabbaed089ae7e9944b706e391e74604946a69c183"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--with-glut=no"
    - "--with-fft=zfft"
    - "ac_cv_header_png_h=no"
    - "ac_cv_lib_png_png_create_write_struct=no"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-applications-iSGProtomol-app-forces-iSGDihedralSystemForce.h.patch"
  - "0002-applications-iSGProtomol-app-forces-iSGImproperSystemForce.h.patch"
  - "0003-framework-base-Report.cpp.patch"
  - "0004-framework-forces-DihedralSystemForce.h.patch"
  - "0005-framework-forces-HarmDihedralSystemForce.h.patch"
  - "0006-framework-forces-ImproperSystemForce.h.patch"
  - "0007-framework-forces-NonbondedCutoffMollyForce.h.patch"
  - "0008-framework-forces-NonbondedCutoffSystemForce.h.patch"
  - "0009-framework-frontend-OutputDihedrals.cpp.patch"
  - "0010-ohos-autotools-latin1-to-utf8.patch"
  - "0011-configure-umask-022.patch"

knowledge_gained:
  - "toybox sed 无法对含非法 UTF-8 字节的行做正则匹配,autoconf 的 confdefs.h→defines.sed 管线会静默丢弃该行 => AC_DEFINE_UNQUOTED(PACKAGE_CITE,...) 从 protomol_config.h 消失,3 个 main 报 use of undeclared identifier 'PACKAGE_CITE';把 configure.in/configure 由 Latin-1 无损转 UTF-8 修复 (knowledge_ref: knowledge/drafts/DRAFT-E549-ohos-toybox-sed-invalid-utf8-configure.md)"
  - "本包无 config.guess/config.sub,configure 不做 host/build 三元组探测,因此无需 --build/--host (不同于 boolstuff/texinfo 类包) (reference: archives/b/boolstuff/0.1.16/notes.md)"
  - "补丁改写 configure/configure.in 后 mtime 会触发 automake 1.6 maintainer 重建链(aclocal→autoconf→autoheader,经 missing fallback);若在设备上落到 autoconf 2.72 会重新生成出一个 27k 行的 configure 并覆盖补丁。按 boolstuff 既有做法把 autotools 依赖链文件统一 pin 到同一旧时间戳(978307200)使 make 判定 up-to-date (reference: archives/b/boolstuff/0.1.16/notes.md)"
  - "clang 两阶段名字查找要求派生类模板中显式 this-> 限定依赖基类成员(calcTorsion/numberOfBlocks),2005 年的 gcc 默认接受不限定写法 (reference: notes.md#遇到的问题与解决方案 第 2 条; patches/0001..0008)"
  - "framework/io/PNGWriter.cpp 在整棵树中零调用者(仅出现在 Makefile.am/.vcproj),libpng 代码路径由 AC_CHECK_LIB(png,...) 定义的 HAVE_LIBPNG 控制;无 png.h 时该分支被编译掉且目标文件不会被静态库链接拉入,故 PNG 输出为不可达死代码,启用无收益 (reference: notes.md#依赖版本; conanfile.py::generate())"
  - "protomol 全部框架库均为 noinst_LIBRARIES 且无任何 _HEADERS 安装目标,make install 只产出 bin/ 下的 6 个可执行文件 => package_type 为 application,需软件级 commands.json (R38) (reference: SKILL.md §1.3 R38; archives/a/abduco/0.6)"
  - "上游分发包名 protomol-2.0.3-tar.gz 在 tar 前是连字符而非点;conan tools.files.get()/unzip() 的归档探测只认 .tar.gz/.tgz/.tbz2/.tar.bz2/.tar,落空后走 endswith('.gz') 仅解 gzip,得到裸 tar 文件而不解 tar => source_folder 为空,apply_conandata_patches 报 source/target file does not exist;在 conandata sources 中加 filename: protomol-2.0.3.tar.gz 即可 (仓库内 429 个包使用同一手法) (reference: knowledge/graph/E276.kv)"
  - "protomol 的 2005 年代 configure 探测用源码根相对 include(configure.in:644 #include \"framework/base/Array_Fastest.h\"),conan 默认源外构建(build-release/)下该探测定位失败 => autoconf 误定义 NO_PARTIAL_TEMPLATE_SPECIALIZATION,转而编译 framework/base/Array_NoPartialSpecialization.h,该头文件在现代 clang 下直接编译失败('N' shadows template parameter);上游完全不支持源外构建,故 layout() 中 basic_layout(self) 后置 self.folders.build = '.'(仓库内 479 个包同款做法,样例 archives/a/abduco/0.6) (reference: knowledge/graph/E519.kv; archives/a/abduco/0.6)"
  - "OHOS 宿主 IDE shell runtime 经 PATH(safe-bin/rm 垫片,shebang #!/bin/bash 在 OHOS 不存在)/BASH_FUNC_rm%% 等导出函数/BASH_ENV(每个 bash 子进程重新 source)三通道注入 safe-delete rm 垫片;Makefile 中 SHELL=/data/service/hnp/bin/bash 且 automake 程序链接规则以 @rm -f $@ 开头,导致全量编译通过但链接规则以 126 失败;须同时清 PATH 中的 safe-bin、BASH_FUNC_*、BASH_ENV、CODEBUDDY_SAFE_DELETE_*(参考 archives/c/cryptsetup/2.8.8, archives/l/libnl3-cli/3.11.0) (reference: archives/c/cryptsetup/2.8.8; archives/l/libnl3-cli/3.11.0; notes.md#遇到的问题与解决方案 第 6 条)"

# ============================================================
# 补丁生成溯源（由 ohc-run.py refresh-patch --auto 写入）
# ============================================================
patch_generation:
  method: per-file-difflib
  source_orig_dir: /data/storage/el2/base/cache/builds/protomol-2.0.3.orig
  source_work_dir: /data/storage/el2/base/cache/builds/protomol-2.0.3.work
  source_orig_hash: 05a4257e8e9e39af
  source_work_hash: 3ef004322cb00711
  generated_at: '2026-09-27T02:32:33'
  # 9 个源码补丁由 refresh-patch --auto 从 orig/work 差异自动生成；
  # 第 10 个（0010-ohos-autotools-latin1-to-utf8.patch）与第 11 个
  # （0011-configure-umask-022.patch）为手工编写：
  #   0010 做 configure.in/configure 的 Latin-1→UTF-8 字节级转码，
  #        refresh-patch 的 per-file-difflib 对该转码无法产出可 dry-run 通过的补丁
  #        （会打印 "0003-configure.patch: dry-run 失败" 并丢弃）；
  #   0011 把 configure 内建 config.status 临时目录的两处 umask 077 改为 022，
  #        纯构建期平台适配，与源码差异无关。
  # 故这两个补丁不在自动生成计数内，但必须随配方一同提交。
  patches_count: 9
  patches_count_total: 11
  extra_patches:
    - file: "0010-ohos-autotools-latin1-to-utf8.patch"
      authored_by: "manual (GNU diff -u)"
      reason: "configure.in/configure 的 Latin-1→UTF-8 字节级转码；refresh-patch 的 per-file-difflib 以 errors='replace' 读取 0xAD 行，转成 U+FFFD 后补丁必然不匹配，dry-run 失败即被丢弃"
      must_keep: true
    - file: "0011-configure-umask-022.patch"
      authored_by: "manual (GNU diff -u)"
      reason: "CI worker 的 HMDFS 上 umask 077 新建的 0700 临时目录 `./confstatXXXXXX` 不可写，config.status 全部写入报 Permission denied 致 configure exit 2；改为 umask 022（同 a52dec/0.7.4、teseq/1.1.1、vttest/2.7-20251205）。构建期平台适配，不改上游 C 源码"
      must_keep: true

