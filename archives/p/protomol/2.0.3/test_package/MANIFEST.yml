# test_package/MANIFEST.yml
# 上游官方测试声明文件 (CI: ci/conan/build_and_test.sh L0e 强制要求存在)
#
# 上游测试入口核验结论 (详见 reports/upstream-tests.md 与 notes.md):
#   1) `make check` 存在，但只是 automake 样板目标 (check-am: all-am)；
#      全树没有任何 TESTS= / check_PROGRAMS= / check_SCRIPTS= 声明，
#      Makefile 中也不存在 check-TESTS 目标 => 上游没有自动化测试套件。
#   2) 真实测试入口是 examples/ 下的算例配置：36 个 *.conf 通过
#      `protomol <conf> --numsteps N` 驱动真实分子动力学计算。
#   3) examples/testset/test.tcsh 是 tcsh 对比框架，且 12 个 conf 的
#      posfile/psffile/parfile 均被注释掉 (README 说明数据需自行提供)
#      => 本环境跳过。
#   4) examples/butane_4/runButaneTests.sh 是 PBS(qsub) 批处理脚本，
#      需要 gawk/xmgrace，单次 1e6 步 => 不可在 CI 内自动化，跳过。

package: protomol/2.0.3
homepage: "https://protomol.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际可运行的测试入口 (算例驱动) —— 本次全部实跑, 结果见 reports/upstream-tests.md
upstream_tests:
  - file: examples/argon_400/argon.lf.conf
    source: protomol-2.0.3-tar.gz/examples/argon_400/argon.lf.conf
    description: "Argon 400 原子 Lennard-Jones + 周期边界 (Leapfrog) 真实 MD 算例"
    command: "protomol argon.lf.conf --numsteps 20"
  - file: examples/butane_4/UA_butane.lf.conf
    source: protomol-2.0.3-tar.gz/examples/butane_4/UA_butane.lf.conf
    description: "联合原子丁烷键合+二面角+LJ (Leapfrog) 真实 MD 算例"
    command: "protomol UA_butane.lf.conf --numsteps 20"
  - file: examples/butane_4/runButaneTests.sh
    source: protomol-2.0.3-tar.gz/examples/butane_4/runButaneTests.sh
    description: "上游批处理测试驱动 (PBS/qsub, 需 gawk+xmgrace, 1e6 步) — 本环境跳过"
    command: "SKIPPED (需要 PBS 集群与 gawk/xmgrace)"
  - file: examples/testset/test.tcsh
    source: protomol-2.0.3-tar.gz/examples/testset/test.tcsh
    description: "上游 tcsh 结果对比框架 — 本环境无 tcsh 且 data 需自行提供, 跳过"
    command: "SKIPPED (无 tcsh, conf 中输入文件被注释)"

# test_package 中自带的测试 (消费者视角验证) —— 新增的鸿蒙消费者用例
test_package_tests:
  - file: test.sh
    description: "鸿蒙消费者测试: 6 个已安装程序冒烟 + 版本校验 + argon_400 与 butane_4 两个上游算例真实跑 20 步 MD 并校验步数/能量表/能量守恒/末步总能对参考值"
    command: "bash test.sh  (conan test / conan create 自动执行)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 17
