software: pgbouncer
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.22.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.22.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/pgbouncer/pgbouncer/releases/download/pgbouncer_1_22_1/pgbouncer-1.22.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=$DEFAULT_PREFIX"
  
  # 编译依赖列表（格式: name/version）
  dependencies:
    - "libevent/2.1.12"
    - "openssl/3.5.6"
    - "c-ares/1.34.4"

  # 编译器
  cc: clang
  cxx: clang++

  # 编译环境变量
  env:
    CFLAGS: "-I$DEFAULT_PREFIX/include"
    LDFLAGS: "-L$DEFAULT_PREFIX/lib"
    PKG_CONFIG_PATH: "$DEFAULT_PREFIX/lib/pkgconfig"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-configure-umask.patch"
  - "0002-config.guess.patch"
  - "0003-config.sub.patch"
# 补丁说明:
# 0001: 移除 configure 中 umask 077，解决 HMDFS owner 不匹配导致的权限问题
# 0002: 更新 config.guess 支持 OpenHarmony 平台识别
# 0003: 更新 config.sub 支持 OpenHarmony 平台识别

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

