# 软件级 manifest 模板
# 文件位置: archives/p/pgbouncer/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: pgbouncer

# 显示名
display: "PgBouncer"

# 一句话描述
description: "PostgreSQL轻量级连接池管理器"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: db

# 官网 URL
homepage: "https://www.pgbouncer.org/"

# 开源许可证（SPDX 标识）
license: ISC

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "E007: config.guess 需添加 HarmonyOS 平台识别"
    - "E072: config.sub kernel-os 组合需添加 linux-ohos* 支持"
    - "HMDFS owner 不匹配问题：umask 077 && mktemp -d 创建的临时目录无法被当前用户访问"

  # 跨版本通用依赖
  common_dependencies:
    - openssl
    - libevent
    - c-ares

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.22.1":
    status: built
    build_date: 2026-05-27