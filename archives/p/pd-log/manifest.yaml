software: pd-log
display: "pd-log"
description: "Small Pure Data (Pd) library for logging: the logpost, debug, normal, error and fatal externals"
category: audio
homepage: "https://download.puredata.info/log"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游只发按平台打包的二进制 tarball、不发源码 tarball，配方取 Debian pool 里同一份上游 orig tarball（sha256 已校验）"
    - "Pd API 头文件 m_pd.h 来自 puredata/0.54.1；make 命令行传 PD_PATH=<puredata 包目录> 覆盖模板里硬编码的 PD_PATH=/usr（GNU make 命令行变量优先于 makefile 赋值，派生出的 PD_INCLUDE 随之改变）"
    - "模板的 objectsdir 由 install 规则自己追加库名，配方只传父目录 objectsdir=/lib/pd-externals，否则会落到 lib/pd-externals/log/log"
    - "install 规则里的 strip 会破坏 OHOS clang wrapper 写入的 ELF code signature，传 STRIP=: 短路（abduco / jamnntpd / tty-clock 同一处置）"
    - "零补丁：模板在 uname=Linux 分支已选中 .pd_linux 后缀，正是 Pd 在 OHOS 上用的后缀，因此不需要任何平台宏"
    - "externals 不链接 libpd：只导出 <name>_setup 并 UND logpost(3)，由 Pd 进程在 dlopen 时提供，NEEDED 只有 libc.so"
  common_dependencies:
    - puredata/0.54.1

versions:
  - version: "0.1"
    status: built
    build_date: "2026-10-03"