# test_package/MANIFEST.yml
# CI L0e requires this file: it declares what upstream ships as tests and what
# the integration test actually runs.

package: pd-log/0.1
homepage: "https://download.puredata.info/log"

# --- upstream test inventory (honest accounting) ---------------------------
# pd-log 0.1 ships the stock Pd "Makefile template" 1.0.12.  In that template
# the UNITTESTS variable is empty, there is no `check` target, and the only
# shipped Pd patches are the help patches (logpost-help.pd and friends).
# There is therefore no upstream automated test to run.
upstream_check_command: "none (template Makefile has no check target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []
upstream_zero_evidence: >-
  Verified against the pd-log 0.1 orig tarball
  (sha256 39fdba04176db9979f32ac04d36fac6e76ff15e7cc8d7cfa0cde13b853eefde2):
  the Makefile declares "UNITTESTS =" with no entries, provides no `check`
  target, and the only .pd files in the tarball are log-meta.pd plus the five
  help patches. Debian's debian/rules builds with pd_lib_builder and also
  registers no test suite.

# --- integration tests shipped here -----------------------------------------
test_package_tests:
  - file: test_package/test.sh
    description: >-
      Package layout assertions (5 externals, 5 help patches, log-meta.pd,
      README.txt, LICENSE.txt in lib/pd-externals/log plus licenses/) and the
      meta file's VERSION 0.1 declaration, then runs the natively compiled
      pdlog_dlopen_test.
    command: "bash test.sh"
  - file: test_package/pdlog_dlopen_test.c
    description: >-
      Native test program. For each of the five objects it checks the packaged
      file is an ELF64 object for the expected machine, dlopen()s it with
      RTLD_NOW against a stub Pd host, and resolves its "<name>_setup" entry
      point. The binary defines the 18 Pd symbols the externals import (17
      API functions plus the data symbol s_) and links with -rdynamic so the
      loader can bind them — the same export contract the real pd binary
      honours; OHOS musl binds every relocation of a dlopen()ed object
      eagerly, so a loader that exports nothing can never load a correct
      external on the device (CI build #73602). RTLD_NOW makes the glibc path
      prove the same full resolution instead of deferring it.
      15 assertions (3 per object).

# --- OHOS-specific coverage -------------------------------------------------
ohos_specific_tests: 1
ohos_specific_detail: >-
  The dlopen/dlsym test is compiled for the OHOS aarch64 target and executed on
  it, and it asserts e_machine == EM_AARCH64 (183) for all five externals. It
  therefore fails for a host x86_64 build, for a stripped-of-architecture
  artefact, or for a package that ships text placeholders instead of loadable
  Pd externals — exactly the failure modes that a file-listing test would miss.
  The RTLD_NOW load also reproduces the device loader's eager relocation
  semantics (OHOS musl has no lazy binding), which is what makes the host
  export contract testable at all.

# Known coverage gap (stated, not hidden): the dlopen test resolves
# "<name>_setup" and closes the handle without calling it, so the actual
# logging behaviour of [logpost] is not exercised. Driving the real OHOS `pd`
# binary (the approach used by pd-maxlib/1.6.0) is not reproducible on the
# WSL host - qemu-aarch64 there uses a glibc loader while OHOS `pd` needs
# /lib/ld-musl-aarch64.so.1 and fails to start with
# "Error relocating .../bin/pd: __fd_chk: symbol not found" - and the OHOS
# sysroot libc does export __fd_chk, so this is a host loader mismatch, not
# an artefact defect. An unverifiable assertion is not added to test_package.
coverage_gap: "Pd object behaviour ([logpost] printing) is not exercised; see notes.md"

test_counting:
  upstream_independent_total: 0
  integration_independent_total: 2
  shared_static_counted_once: true
  internal_assertions_counted_as_cases: false

# 18 assertions from test.sh (1 ext dir + 5 externals + 5 help patches +
# 4 doc/licence files + 1 meta VERSION + 1 native binary built +
# 1 native run verdict) + 15 from pdlog_dlopen_test.c (3 per object).
assertion_count: 33
