# conandata.yml — pd-log 0.1
#
# Source: the orig tarball that Debian repackages for pd-log 0.1-8.
# Upstream's own download.puredata.info only serves the per-platform binary
# tarballs (log-0.1-linux-aarch64.tar.gz and friends), never a source tarball,
# so the Debian pool copy of the very same upstream orig tarball is used.
# sha256 verified against the local download.

sources:
  url: "https://deb.debian.org/debian/pool/main/p/pd-log/pd-log_0.1.orig.tar.gz"
  sha256: "39fdba04176db9979f32ac04d36fac6e76ff15e7cc8d7cfa0cde13b853eefde2"

# No patches: the stock Pd Makefile template cross-compiles cleanly for
# OHOS aarch64 with PD_PATH pointed at the puredata package (see notes.md).
