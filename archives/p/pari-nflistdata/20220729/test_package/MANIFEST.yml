# test_package/MANIFEST.yml — pari-nflistdata/20220729
# CI L0e 要求此文件存在（上游测试声明）。
#
# 本文件内所有路径引用都指向**随 PR 入仓**的文件（版本目录同级），不留任何
# 只在本地存在、评审者无法访问的路径。运行时原始日志（conan create、gp 全量输出）
# 留在本地 reports/ 下，被仓库 .gitignore 的 `reports/` 条目排除，见文末脚注。

package: pari-nflistdata/20220729
homepage: "https://pari.math.u-bordeaux.fr/packages.html#nflistdata"

# ── 上游测试套件：包内无自动化测试（实证） ─────────────────────────────────
# pari-nflistdata 是纯数据包（Debian `Architecture: all`、`Multi-Arch: foreign`）。
# **包内**没有任何可运行测试，四项实证：
#   1) 官方源 nflistdata.tgz（sha256 2c19a3e0…44bc，3623252 B，Last-Modified
#      Fri, 29 Jul 2022 —— 与本包版本号 20220729 同源）解包为 `data/nflistdata/`，
#      非目录条目 678 个 = 650 `<deg>/<idx>/QT` + 27 `5/4/…` A5 分片 + 1 `README`；
#      `grep -icE '(^|/)(Makefile|configure|CMakeLists.txt|setup.py|meson.build)$'` == 0，
#      `.c/.h/.cpp/.gp/.py/.sh` 与 `test` 计数 == 0；
#   2) Debian `debian/rules` 的 build 目标仅 `dh_testdir; touch build-stamp`，
#      install 仅 `dh_install nflistdata /usr/share/pari` + 对 >4096 字节的文件
#      `gzip --no-name --best`，**无 check / test 目标**；
#   3) `debian/` 文件清单仅 changelog/control/copyright/dirs/rules/source/format/
#      upstream/signing-key.asc，**无 debian/tests/（无 autopkgtest）**；
#   4) 上游 `data/nflistdata/README`（sha256 2df162ac…124b44，已随包安装为
#      res/pari/nflistdata/README）只描述数据用途与完备性边界，无测试说明。
upstream_check_command: ""          # 包内无 make check / 无测试脚本可跑
upstream_test_in_build: false
upstream_tests_present: false
upstream_test_count: 0

# ── 真实上游测试入口：消费方 gp 的 nflist（已实际执行，逐用例记录入仓） ─────────
# 数据包的功能入口天然在消费者侧（上游 README 自述 "to be used by the 'nflist'
# function"）。本包没有以"属 pari 包的职责"为由跳过，而是用**制品仓已发布的
# pari/2.17.4.1 二进制**（OHOS arm64 的 bin/gp）对打包产物实跑 685 项断言，
# 逐用例名 + 结果已随 PR 入仓：../upstream-test-cases.txt
#
# 用例集由被测目录枚举而来，不硬编码（../upstream-gp-sweep-generator.py）；
# gp 侧只做真实读取与比较，统计与归因由 ../run-upstream-gp-sweep.py 驱动。
#
# 断言定义：
#   qt_<deg>_<idx>            ×650   nflist([deg,idx],'t) 命中 <deg>/<idx>/QT，
#                                    断言 type=="t_POL" ∧ poldegree==deg ∧ 变量为 x
#   a5_default_count          ×1     nflist("A5") 返回 10 个域
#   a5_r2_0_full_table        ×1     nflist("A5",[1,524286^2],0) 返回 15184
#                                    == 5/4/0/{0..5} 六分片的数据行数（15185 行含
#                                    末片哨兵 `[0,0]`）——表与函数返回值逐项自洽
#   a5_r2_2_full_table        ×1     nflist("A5",[1,10^8],2) 返回 2336 == 5/4/2/0
#                                    的 2337 行去掉 `[0,0]` 哨兵
#   a5_r2_0_subrange_monotone ×1     子范围结果数严格小于全表
#   a5_single_discriminant_roundtrip ×1
#                                    表首行 `[…],1762]` ↔ disc=1762^2 可精确检索，
#                                    返回多项式 == x^5-11x^3-5x^2+18x+9
#                                    （证实表内第二字段是 sqrt(|disc|)）
#   a5_6_regular_extension    ×1     nflist([6,4],'t)（= A5(6)=6T4）返回 6 次 t_POL
#   a5_signature_r2_1_absent  ×1     5 次域无 r2=1 签名，查询返回空
#   a5_out_of_range_domain_error ×1  超出 [1,10^8] 上界时 gp 报
#                                    `domain error in nflist(A5): sqrt(N) > 10000`，
#                                    断言赋值确实未产出数据
#   a5_read_<path>            ×27    分文件**归因**（../run-upstream-gp-sweep.py 的
#                                    attribution 阶段）：在数据树副本上逐个移开该文件，
#                                    用 12 条 nflist 探测调用（含带子域 F 的
#                                    nflist("A5",[1,10^8],-2,x^2-5)）计算输出指纹，
#                                    指纹改变 ⇒ 该文件确被 gp 读取（PASS）
#
# 复现三步：
#   1) conan install --requires=pari/2.17.4.1 -r=ohpcd \
#        -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 \
#        --deployer=full_deploy
#   2) export LD_LIBRARY_PATH=full_deploy/host/pari/2.17.4.1/Release/armv8/lib:\
#        full_deploy/host/gmp/6.3.0.1/Release/armv8/lib
#   3) python3 ../run-upstream-gp-sweep.py <pkg>/res/pari \
#        --gp full_deploy/host/pari/2.17.4.1/Release/armv8/bin/gp \
#        --lib full_deploy/host/pari/2.17.4.1/Release/armv8/lib \
#        --lib full_deploy/host/gmp/6.3.0.1/Release/armv8/lib \
#        --out-cases upstream-test-cases.txt

consumer_functional_test:
  command: >-
    python3 ../run-upstream-gp-sweep.py <pkg>/res/pari --gp <pari>/bin/gp
    --lib <pari>/lib --lib <gmp>/lib --out-cases upstream-test-cases.txt
  driver: ../run-upstream-gp-sweep.py        # 随 PR 入仓
  case_generator: ../upstream-gp-sweep-generator.py   # 随 PR 入仓
  cases_log: ../upstream-test-cases.txt      # 随 PR 入仓，685 行逐用例名+PASS/SKIP
  cases_total: 685
  cases_pass: 665
  cases_fail: 0
  cases_skip: 20
  pass_rate: "97.1%（665/685）；计入 SKIP 后无失败项：665/665 = 100%"
  duration: "10s（三族合计，gp_rc=0，driver rc=0）"
  # 685 个用例名互不重复；下列 sha256 = 用例名**升序、每行一个**后的摘要，
  # 与 ../upstream-test-cases.txt 正文复算结果一致，重跑可自行核对。
  case_names_sha256: 14ca8540e254e1ef3aef18f7859dc2022f13bf316e4a917295f29b56ea9791d8
  case_families:
    - {prefix: "qt_",        count: 650, lexical_first: "qt_10_1",  lexical_last: "qt_9_9"}
    - {prefix: "a5_",        count: 8,   lexical_first: "a5_6_regular_extension", lexical_last: "a5_single_discriminant_roundtrip"}
    - {prefix: "a5_read_",   count: 27,  lexical_first: "a5_read_5_4_0_0",        lexical_last: "a5_read_5_4_2cond_9"}
  skip_explanation: >-
    20 个 SKIP 全部是 Allombert–Page 的按 conductor 排序表（5/4/0cond/0..9 与
    5/4/2cond/0..9）：在 pari/2.17.4.1 下移开这些文件后，12 条 nflist 探测调用
    （含带子域 F 的三种签名组合）的输出指纹**逐位不变**，即当前 gp 版本没有
    触达该路径的公开调用形式。libpari 里存在读取模板
    `%s/nflistdata/%ld/%ld/%ld%s/%ld` 与 `nflist_CL_worker(Fcond,bnf,ellprec)`
    符号，说明入口在类域/conductor 检索路径（需 bnf 级入参）。这些表仍按上游
    原样打包（内容一致性由 test_package 的 81 项字节级断言覆盖），不作 SKIP
    之外的任何声明。
  negative_control:
    - name: empty_datadir
      method: 同一 650 条 QT 用例、datadir 指向不含任何表的空目录
      result: >-
        PASS=52 FAIL=598（合计 650）。52 条构成（逐条从反向对照日志提取）：
        度 2..7 的**全部**索引 1+2+5+5+16+7=36 条，加度 8..15 每度的**末两个**索引 16 条
        —— 它们在不含任何表的 datadir 下仍返回满足断言的 t_POL，即该结果不依赖本包数据
        （gp 侧另有可得路径）；其余 598 条的 PASS 确由本包数据驱动。
        不对其成因作超出证据的定性（上游 README 只声明表"needed by nflist(G,'t) for
        groups of degree 8 or more"，与度 8..15 仅末两个不受影响并不矛盾）。
      builtin_case_list: >-
        qt_2_1 qt_3_1 qt_3_2 qt_4_1 qt_4_2 qt_4_3 qt_4_4 qt_4_5 qt_5_1 qt_5_2 qt_5_3 qt_5_4
        qt_5_5 qt_6_1 qt_6_2 qt_6_3 qt_6_4 qt_6_5 qt_6_6 qt_6_7 qt_6_8 qt_6_9 qt_6_10 qt_6_11
        qt_6_12 qt_6_13 qt_6_14 qt_6_15 qt_6_16 qt_7_1 qt_7_2 qt_7_3 qt_7_4 qt_7_5 qt_7_6
        qt_7_7 qt_8_49 qt_8_50 qt_9_33 qt_9_34 qt_10_44 qt_10_45 qt_11_7 qt_11_8 qt_12_300
        qt_12_301 qt_13_8 qt_13_9 qt_14_62 qt_14_63 qt_15_103 qt_15_104
      builtin_case_count: 52
      log: ../upstream-test-cases.txt 头部说明 + 本地 reports/upstream-gp-sweep-qt-negative.log
    - name: upstreamdir_cross_check
      method: 同一 driver 对上游原始解包目录（未经 conan 打包）重跑
      result: "TOTAL=685 PASS=665 FAIL=0 SKIP=20，与打包产物逐用例 diff 为空 ⇒ 打包零改动"
      log: ../upstream-test-cases.txt 头部说明

# ── test_package 打包内容级校验（R34：对真实打包字节，非空壳） ────────────────
# 注意：test_package 不替代上面的上游测试统计；两侧数字分别申报。
# 这些用例不放进 test_package 的原因：跑 gp 首次执行外部二进制会触发平台安全确认
# 弹窗（R7），可能挂住 CI；test_package 只做确定性的字节级校验（无需外部二进制）。
test_package_tests:
  - file: test_pari_nflistdata.py
    description: >-
      校验 <pkg>/res/pari/nflistdata：678 条目/8845045 总字节/14 个度目录/
      每度 QT 计数（14 项）/QT 总数 650/27 个 A5 分片存在性/总字节与 6 个分类字节数/
      整体与 6 个分类的按路径排序拼接 sha256/14 个单文件 sha256 抽查/
      650 个 QT 与 27 个 A5 分片的 GP 语法全量校验/JR 表完备性哨兵（5/4/0/5 末条
      524286、5/4/2/0 末条 10000，与上游 README 声明的边界一致）/
      cond 表无哨兵/无意外文件/无空文件/README 含 nflist 与 GPL 声明
    command: "python3 test_pari_nflistdata.py --package-root <packaged_pkg>"
    checks_total: 81
    checks_pass: 81
    checks_fail: 0
    fault_injection: >-
      篡改 8/1/QT 任一字节 → concat_sha256_ALL / concat_sha256_QT / spot 三项 FAIL，
      脚本真实退出码 1；删除 12/1/QT → file_count、total_bytes、qt_count_degree_12、
      qt_count_total、class_bytes_QT、concat_sha256_ALL、concat_sha256_QT、
      spot_sha256_12_1_QT 共 8 项 FAIL，真实退出码 1（不用管道取码，规避同族
      pari-galdata notes.md 问题#2 记录的退出码误读坑）。

# 断言总数：上游包内自动化 0 + 消费方功能入口 685 + test_package 81 = 766
assertion_count: 766

# 脚注：conan create 原始日志、gp 全量原始输出、W3 本地 CI 日志、staging 验证输出等
# 运行时产物留在本地 reports/ 目录，被仓库 .gitignore 的 `reports/`、`packaging/`
# 条目排除，不属于本 PR——上文所有可核验数字均能由 ../upstream-test-cases.txt +
# ../upstream-gp-sweep-generator.py + ../run-upstream-gp-sweep.py +
# test_pari_nflistdata.py 复算。
