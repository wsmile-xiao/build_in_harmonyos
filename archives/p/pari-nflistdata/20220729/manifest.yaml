source:
  url: "https://pari.math.u-bordeaux.fr/pub/pari/packages/nflistdata.tgz"
  sha256: "2c19a3e02afd3bba2af3071a7faa80924a75b00bb9713286c886b7fb460944bc"
  tar_format: tgz

build:
  system: custom
  configure_options: []
  dependencies: []
  cc: N/A
  cxx: N/A
  notes: >-
    Data-only package (PARI/GP nflist database, 2022-07-29 release: 650 regular
    Q(T)-extension tables for transitive groups of degrees 2..15 plus 27 A5=5T4
    number-field table shards in four families, 678 files / 8845045 bytes) consumed
    by the GP function nflist. No compilation, no configure, no in-package automated
    test. build() runs the deterministic data validator (--source-root) so a corrupt
    download fails conan create mid-way; package() copies the nflistdata/ tree
    keeping its <degree>/<index>/QT hierarchy into <pkg>/res/pari/nflistdata,
    mirroring Debian "dh_install nflistdata /usr/share/pari" but keeping files
    uncompressed (PARI reads them directly, so no gzip build tool is pulled in).
    Official upstream nflistdata.tgz is byte-identical to Debian
    pari-nflistdata_0.20220729-2.orig.tar.gz (same 3623252 bytes and sha256). Real
    functional entry point was executed with the published pari/2.17.4.1 gp binary:
    685 assertions, 665 pass, 0 fail, 20 skip (skip reason: conductor-ordered
    Allombert-Page shards have no gp-visible entry in 2.17.4.1). Commands, per-case
    families and reproduction steps in notes.md and test_package/MANIFEST.yml; raw
    logs kept locally under reports/, which .gitignore excludes from the PR.

patches_applied: []

knowledge_gained:
  - "pari-nflistdata is Architecture:all pure data: only Debian packaging tools (debhelper-compat=13), zero third-party library deps; Depends: ${misc:Depends} resolves empty, only Suggests: pari-gp — knowledge_ref: notes.md#依赖结论w0-实测"
  - "gp locates the database via default(datadir): templates '%s/nflistdata/%ld/%ld/QT' and '%s/nflistdata/%ld/%ld/%ld%s/%ld' are present in libpari-gmp-tls, so the packaged tree must keep its hierarchy (unlike flat galdata, keep_path cannot be off) — knowledge_ref: notes.md#打包决策"
  - "A5 table second field is sqrt(|disc|), proven by round-trip: table head '[[9,18,-5,-11,0,1],1762]' is retrieved by nflist(\"A5\",1762^2,0) as x^5-11x^3-5x^2+18x+9; JR last shards end with a '[0,0]' sentinel matching the README completeness bounds 524286 / 10000 — knowledge_ref: notes.md#上游数据语义实证"
  - "In one gp process, 650 nflist([d,i],'t) queries pollute nflist's internal A5 table state: a5_r2_0_full_table drops from 15184 and must run in a separate gp process (same symptom on the raw upstream tree, so it is not a packaging difference) — knowledge_ref: notes.md#遇到的问题与解决方案"
  - "this gp build has no catch/file_exists/is_file/wildcards/Polx primitives, so enumeration and attribution live on the Python side; same restriction already recorded by sibling pari-galpol — knowledge_ref: notes.md#遇到的问题与解决方案"
  - "packaged as application + software-level commands.json binary:false (pari-galpol/pari-seadata precedent) so conan create really runs package() for res/ artifacts; package_id cleared (8.8 MB data is profile-independent) — knowledge_ref: notes.md#打包决策"
  - "pure data packages have no statable source language: lang-preflight default (task=cpp) exits 2 and auto-writes env_unsupported; data packages must declare --lang other (legal enum), same handling as sibling pari-galpol/pari-seadate-big — knowledge_ref: notes.md#遇到的问题与解决方案"
