software: pari-nflistdata
display: "PARI/GP nflistdata (number field tables)"
description: "PARI/GP nflist database: A5 (5T4/6T4) number field tables and regular Q(T)-extension tables for transitive groups of degrees up to 15"
category: math
homepage: "https://pari.math.u-bordeaux.fr/packages.html#nflistdata"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "纯数据包（Debian Architecture: all / Multi-Arch: foreign），无编译、无 configure、包内无自动化测试"
    - "无任何强制第三方库依赖；仅可选消费者 pari-gp（Suggests），GP 函数 nflist 是功能入口"
    - "package() 把 nflistdata/ 树（678 文件 / 8845045 字节）**按上游层级**落到 <pkg>/res/pari/nflistdata/"
    - "gp 靠 default(datadir) 命中 <datadir>/nflistdata/<deg>/<idx>/QT，故 keep_path 不可关（与扁平的 galdata 不同）"
    - "功能入口用制品仓已发布的 pari/2.17.4.1 gp 二进制实跑 685 项断言：665 PASS / 0 FAIL / 20 SKIP"
    - "package_id 清空（数据与 arch/compiler/build_type 无关），避免 8.8 MB 数据按 profile 重复"
  common_dependencies: []

versions:
  "20220729":
    status: built
    build_date: "2026-09-10"
