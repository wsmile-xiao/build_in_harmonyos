version: "1.14.31"
software: "pupnp"
status: built
build_date: "2026-09-24"
build_system: cmake

source:
  url: "https://github.com/pupnp/pupnp/releases/download/release-1.14.31/libupnp-1.14.31.tar.bz2"
  sha256: "e72c7690d5df862c07e9014f99513f5a94b55f80d916120655f73e11863edf3f"
  tar_format: tar.bz2

build:
  system: cmake
  configure_options:
    - "-DUPNP_BUILD_SHARED=ON (upstream default; shared linkage)"
    - "-DUPNP_BUILD_STATIC=ON (upstream default; static linkage)"
    - "-DBUILD_TESTING=ON (upstream default; 18 ctest entries)"
    - "-DUPNP_BUILD_SAMPLES=OFF (demo programs are not library API)"
    - "-DUPNP_ENABLE_OPEN_SSL=OFF (upstream default; no extra dependency)"
    - "-DDOWNLOAD_AND_BUILD_DEPS=OFF (no network fetch during configure)"
    - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON (static archives stay linkable)"
  dependencies:
    - "gtest/1.17.0.1 (test_requires, build-time test framework only)"
  build_tool:
    name: cmake
    version: "HMBS-injected (HMBS_CMAKE)"
  cc: clang
  cxx: clang++
  compiler: clang
  parallelism: 1

patches_applied: []

knowledge_gained:
  - "pupnp 1.14.31 上游 CMake 在双链接默认下注册 18 个 ctest 条目:upnp 10 项(4 个 UPNP_Add_Unit_Test 各分 shared/-static 加 parse-uri 双条目)+ixml 4 项(2 个测试各分 shared/-static)+gtest test_template.cpp 内 2 个 TEST 经 gtest_add_tests 展开为 4 条目(shared/static 各 2);单包双产物即跑满全量,真机 ctest -N 实测 Total Tests: 18 (reference: archives/p/pupnp/1.14.31/notes.md 上游测试盘点)"
  - "gtest 类可选测试用 test_requires 补齐最干净:不进运行时依赖图,CMakeDeps 生成的 GTest config 与上游 find_package(GTest CONFIG) 直接匹配 (reference: archives/o/openrct2/0.5.3/conanfile.py)"
  - "UPNP_BUILD_SAMPLES 默认为 ON 会产出 tv_ctrlpt/tv_combo/tv_device 演示程序;纯库交付设 OFF 即可,无测试条目依赖 samples (reference: archives/p/pupnp/1.14.31/notes.md 配方实现)"

upstream_test_total: 18
upstream_test_count_method: ctest_entries

validation:
  upstream_tests:
    command: "ctest --output-on-failure"
    statistical_unit: "ctest 条目(10 upnp + 4 ixml + 4 gtest,双链接各半)"
    suites: 18
    total: 18
    result: pending
    note: "首轮工作树;执行/通过/失败/跳过计数待 hmbs 真机预检回填,不猜测"
  conan_create:
    command: "conan create archives/p/pupnp/1.14.31 -pr:h=<ohos-aarch64 profile> -pr:b=<ohos-aarch64 profile> --build=missing"
    result: pending
    note: "待 hmbs 真机预检"
  test_package:
    command: "./test_pupnp"
    assertions: 24
    result: pending
    note: "待 hmbs 真机预检"
