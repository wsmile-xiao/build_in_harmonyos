# test_package/MANIFEST.yml — pupnp 1.14.31
# Upstream and consumer test declaration required by CI L0e.

package: pupnp/1.14.31
homepage: "https://github.com/pupnp/pupnp"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "libupnp-1.14.31.tar.bz2 (official GitHub release asset)"
  source_sha256: "e72c7690d5df862c07e9014f99513f5a94b55f80d916120655f73e11863edf3f"
  build_system: "CMake"
  test_definition: >
    With upstream defaults (UPNP_BUILD_SHARED=ON, UPNP_BUILD_STATIC=ON,
    BUILD_TESTING=ON) every unit test is registered twice by ctest, once
    per linkage: upnp/test/CMakeLists.txt registers 4 tests via
    UPNP_Add_Unit_Test (each yields a shared and a -static entry) plus
    test-upnp-parse-uri and test-upnp-parse-uri-static;
    ixml/test/CMakeLists.txt registers test-ixml and test-ixml-poc-gh-506
    via ixml_add_unit_test (each yields a shared and a -static entry);
    gtest/CMakeLists.txt registers test_template.cpp via UPNP_addGTest,
    which calls gtest_add_tests: the 2 TESTs inside (EmptyTestSuite.
    empty_gtest and EmptyFixtureTestSuite.empty_gtest_with_fixture)
    each expand to a shared and a -static entry (4 total).
    Counting unit is the ctest entry (ctest -N); true-device
    ctest -N reports Total Tests: 18.
  dependency: "gtest/1.17.0.1 supplemented via test_requires (ohpcd
    registry); without it upstream silently skips only the 4 gtest
    entries, all 14 C tests still run"
  portability_changes: []
  samples_note: >
    UPNP_BUILD_SAMPLES defaults ON but only builds demo programs
    (tv_ctrlpt/tv_combo/tv_device); the recipe sets it OFF because demos
    are not library API and no test entry depends on them.

upstream_check_command: "ctest -N (count) + ctest --output-on-failure (run)"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# Counting unit: one ctest entry. Take-number commands:
#   ctest -N  -> "Total Tests: 18"
#   hmbs_ctest_run.log (ctest --output-on-failure stdout) ->
#     per-test "N/M Test #K: <name> Passed|Failed|Timeout|Skipped"
upstream_tests:
  - test_name: "test-upnp-list"
    source: "upnp/test/test_list.c"
    kind: unit
  - test_name: "test-upnp-list-static"
    source: "upnp/test/test_list.c"
    kind: unit
  - test_name: "test-upnp-init"
    source: "upnp/test/test_init.c"
    kind: unit
  - test_name: "test-upnp-init-static"
    source: "upnp/test/test_init.c"
    kind: unit
  - test_name: "test-upnp-log"
    source: "upnp/test/test_log.c"
    kind: unit
  - test_name: "test-upnp-log-static"
    source: "upnp/test/test_log.c"
    kind: unit
  - test_name: "test-upnp-url"
    source: "upnp/test/test_url.c"
    kind: unit
  - test_name: "test-upnp-url-static"
    source: "upnp/test/test_url.c"
    kind: unit
  - test_name: "test-upnp-parse-uri"
    source: "upnp/test/test_parse_uri.c + test_parse_uri_impl.c"
    kind: unit
  - test_name: "test-upnp-parse-uri-static"
    source: "upnp/test/test_parse_uri.c + test_parse_uri_impl.c"
    kind: unit
  - test_name: "test-ixml"
    source: "ixml/test/test_document.c"
    kind: unit
  - test_name: "test-ixml-static"
    source: "ixml/test/test_document.c"
    kind: unit
  - test_name: "test-ixml-poc-gh-506"
    source: "ixml/test/poc_gh_506.c"
    kind: unit
  - test_name: "test-ixml-poc-gh-506-static"
    source: "ixml/test/poc_gh_506.c"
    kind: unit
  - test_name: "test-upnp-EmptyTestSuite.empty_gtest"
    source: "gtest/test_template.cpp (TEST(EmptyTestSuite, empty_gtest))"
    kind: gtest
  - test_name: "test-upnp-EmptyTestSuite.empty_gtest-static"
    source: "gtest/test_template.cpp (TEST(EmptyTestSuite, empty_gtest))"
    kind: gtest
  - test_name: "test-upnp-EmptyFixtureTestSuite.empty_gtest_with_fixture"
    source: "gtest/test_template.cpp (TEST_F(EmptyFixtureTestSuite, empty_gtest_with_fixture))"
    kind: gtest
  - test_name: "test-upnp-EmptyFixtureTestSuite.empty_gtest_with_fixture-static"
    source: "gtest/test_template.cpp (TEST_F(EmptyFixtureTestSuite, empty_gtest_with_fixture))"
    kind: gtest

upstream_test_total: 18
upstream_test_count_method: ctest_entries
# Upstream pass/fail counts are filled from true-device ctest output
# (hmbs preflight evidence round); they are intentionally left unset here.

# Consumer-perspective checks: three scenarios in one executable, each
# ending in a `SCENARIO <name> PASS` line parsed for the
# HMBS_TEST_PACKAGE_RESULT marker (24 CHECK assertions total).
test_package_tests:
  - file: test_pupnp.c
    scenario: "ixml_dom"
    description: >
      Parse an embedded UPnP device-description document with
      ixmlParseBuffer, verify deviceType/friendlyName lookup, node text
      and ixmlDocumenttoString roundtrip (14 assertions).
    command: "./test_pupnp"
    assertions: 14
  - file: test_pupnp.c
    scenario: "upnp_preinit"
    description: >
      Verify pre-init server accessors (port 0, NULL IP) and that
      UpnpGetErrorMessage(UPNP_E_SUCCESS) returns a message (4 assertions).
    command: "./test_pupnp"
    assertions: 4
  - file: test_pupnp.c
    scenario: "upnp_init"
    description: >
      Full SDK lifecycle UpnpInit2(NULL, 0) then UpnpFinish, checking the
      bound port/IP and post-finish reset (6 assertions).
    command: "./test_pupnp"
    assertions: 6

assertion_count: 24
