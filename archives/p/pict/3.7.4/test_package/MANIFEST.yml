package: pict/3.7.4
homepage: "https://github.com/microsoft/pict"

upstream_check_command: "ctest -v"
upstream_test_in_build: false
upstream_test_command: ""

# Upstream test suite is test/test.pl (perl) + committed baselines and requires
# executing the `pict` binary; on OHOS unsigned ELF cannot run until sign-elf
# signed, so the upstream suite is exercised natively during adaptation and the
# packaged-binary smoke test below is the CI L1 gate.
upstream_tests: []

test_package_tests:
  - file: test.sh
    description: "PICT 打包二进制 smoke 测试（存在性 + aarch64 ELF 校验，未签名 ELF 报 SKIP）"
    command: "./test.sh"

assertion_count: 2
