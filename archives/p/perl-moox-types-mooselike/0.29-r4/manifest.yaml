software: perl-moox-types-mooselike
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.29-r4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.29-r4"

# 编译状态
# published | built | failed | archived
status: published
build_system: perl

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/M/MA/MATEU/MooX-Types-MooseLike-0.29.tar.gz"

  # 源码校验和
  sha256: "1d3780aa9bea430afbe65aa8c76e718f1045ce788aadda4116f59d3b7a7ad2b4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "Module-Runtime/0.016"
    - "Moo/2.005005"
    - "Test-More/0.96"
    - "Test-Fatal/0.003"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  # 官方测试套件
  official_tests:
    total: 196
    passed: 196
    failed: 0
    files: 14
    result: PASS

# ============================================================
# 质量门禁
# ============================================================

quality_gates:
  G0_clean_build: "SKIP (纯 Perl 模块, 手动验证通过)"
  G1_binary_integrity: PASS
  G2_functional: PASS
  G3_portability: PASS
  G4_archive: PASS

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块，使用 ExtUtils::MakeMaker (Makefile.PL) 构建系统"
  - "使用 INSTALL_BASE=$DEFAULT_PREFIX 确保 DESTDIR 模式下文件安装到正确的 staging 目录"
  - "无 C/XS 组件，无需编译器，仅复制 .pm 文件"
  - "196 个测试全部通过，14 个测试文件"
  - "纯 Perl 模块不受 SELinux HMDFS 限制影响，无需 ELF 签名，开箱即用"
  - "Perl 中数字即字符串 (autoboxing)，is_Str(123) 返回 true 是正确行为"
  - "MooX::Types::MooseLike::Numeric 是独立发行版，不在本包中"
