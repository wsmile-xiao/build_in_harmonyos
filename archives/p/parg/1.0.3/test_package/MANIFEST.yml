# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: parg/1.0.3
homepage: "https://github.com/jibsen/parg"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "ctest -N   # 源码树内为 ctest --test-dir <build> -N，注册名 test_parg"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure   # conanfile.py build() 内 can_run(self) 时执行 CMake.test()"

# 上游实际运行的测试程序
upstream_tests:
  - file: test/test_parg.c
    source: parg-1.0.3/test/test_parg.c
    description: "greatest 单头测试框架套件（CTest 注册名 test_parg）：parg_getopt_tests 11 + parg_getopt_long_tests 16 + parg_reorder_tests 5 = 32 用例 / 196 断言"
    command: "./test_parg   # 或 ctest --output-on-failure"
    result: "PASS 32/32（沙箱 HOME $TASK_DIR/test-home 实测，Total: 32 tests, 196 assertions）"

# test_package 中自带的测试 (消费者视角验证) —— 计入 PR 正文「鸿蒙特有测试」行
test_package_tests:
  - file: test.c
    description: "消费者测试（对已安装 parg 制品的 4 个用例）：link=版本宏+parg_init 初始态、short=短选项/必需参数/内联参数、long=长选项/必需参数缺失/前缀消歧、reorder=非选项后置换位"
    command: "./test_parg link|short|long|reorder   # CMakeLists.txt 注册为 4 个 CTest 条目"

# 测试断言总数 (近似值, 用于质量评估) —— 消费者用例断言数（link 8 + short 10 + long 14 + reorder 12）
assertion_count: 44
