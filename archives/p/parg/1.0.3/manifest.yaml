# 版本级 manifest 模板
# 文件位置: archives/p/parg/1.0.3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0.3"

# 软件名
software: "parg"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-25"
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/jibsen/parg/archive/refs/tags/v1.0.3.tar.gz"

  # 源码校验和
  sha256: "cd54a94b4138735f6c9fbdf426a9caa8ffd5bc90988eb02f493bc86de61ce5ad"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_TESTING=ON（上游 greatest 单头套件经 CTest 注册，build() 内 ctest 执行）"

  # 编译依赖列表（格式: name/version）
  # 零运行依赖：上游 CMakeLists.txt 无 find_package / 无外部链接库（W0 实核）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（本包零补丁：不改上游任何文件）
patches_applied: []

# ============================================================
# 测试结果（设备实测，来源 reports/conan-create.log 与沙箱 HOME 上游跑）
# ============================================================

test_results:
  type: upstream_and_consumer
  upstream_command: "ctest --output-on-failure（源码 test/test_parg.c，greatest 单头框架）"
  upstream_tests: 32
  upstream_assertions: 196
  consumer_tests: 4
  consumer_assertions: 44
  total: 36
  passed: 36
  failed: 0
  skipped: 0
  status: passed

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "init-build 的 BUILD_SYSTEM 只按 URL 关键词猜（无 cmake 字样即回落 autotools），纯 CMake 项目会拿到 autotools 模板配方——以 lang-preflight/prescan 的 build_system=cmake 读数纠偏" # knowledge_ref: DRAFT-E734-parg-cmake-buildsystem-guess-no-install-package
  - "上游 CMakeLists.txt 无 install() 规则：cmake.install() 是空操作，package() 按构建树 copy parg.h/libparg*/LICENSE，免加补丁" # knowledge_ref: DRAFT-E734-parg-cmake-buildsystem-guess-no-install-package
  - "greatest 单头套件经 include(CTest) 注册单二进制 test_parg：源码 TEST 宏数=RUN_TEST 注册数=框架报告 Total（32），assertion 196 单列不与用例数混口径" # knowledge_ref: DRAFT-E734-parg-cmake-buildsystem-guess-no-install-package

knowledge_ref:
  - "knowledge/drafts/DRAFT-E734-parg-cmake-buildsystem-guess-no-install-package.md"
