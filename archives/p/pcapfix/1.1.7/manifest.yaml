software: pcapfix
# 版本级 manifest
# 文件位置: archives/p/pcapfix/1.1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC

# ============================================================
# 必须字段
# ============================================================

version: "1.1.7"

# 编译状态
# published | built | failed | archived
# 本文件为前置适配阶段产物：配方已就绪，真机 conan create 验证通过后
# 由 ohc-run.py finish 更新为最终状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/Rup0rt/pcapfix/archive/refs/tags/v1.1.7.tar.gz"
  sha256: "dcaf0e7104572f14b56ea3406663cedc5df7cf732af451adab02e523bc24905b"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options: []
  dependencies: []   # libc only（全部 include 为标准头）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-musl-legacy-uint-types.patch"   # musl 无 glibc 的 legacy BSD u_int* 类型

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "musl/OHOS 不提供 legacy BSD 类型 u_int8_t..u_int64_t（glibc 经 sys/types.h 提供）；上游仅在 __WIN32__ 分支兜底 → pcapfix.h 非 Windows 分支加 typedef 补丁（真机首编实测 10 处 unknown type name）"
  - "上游默认 CFLAGS 的 --param=ssp-buffer-size=4 与 $(shell getconf LFS_CFLAGS) 为 gcc/coreutils 专属，须整体显式覆盖 CFLAGS（命令行变量优先于 Makefile 内 CFLAGS+=）"
  - "上游 make install 用 GNU-only install -pDm755，打包改为手动复制 bin/share/man/licenses"
  - "pcapfix 无 --version/-h/--help 选项：无参数触发 usage 且返回非零（CI L2 smoke 为非阻塞 warn）"
  - "修复成功路径输出 [+] SUCCESS: N Corruption(s) fixed! 且 return 0，可作功能测试断言（pcapfix.c res>0 分支）"
  - "全局头修复判定：仅 magic 损坏时 hdr_integ=1 <4 走 'corrupt!==>CORRECTED' 分支，确定性可测"
