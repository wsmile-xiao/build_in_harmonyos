# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pcapfix/1.1.7
homepage: "https://github.com/Rup0rt/pcapfix"

# 上游测试命令 — 经源码核查：v1.1.7 发布包共 16 个文件（.gitignore/COPYING/Changelog/
# INSTALL/Makefile/README/pcap.c/pcap.h/pcap_kuznet.c/pcap_kuznet.h/pcapfix.1/pcapfix.c/
# pcapfix.h/pcapng.c/pcapng.h/winfunc.c），Makefile 仅 all/pcap/pcap_kuznet/pcapng/
# install/uninstall/clean 目标，无 check/test 目标，无 tests/ 目录，上游仓库亦无 CI。
upstream_check_command: "none (upstream Makefile has no check/test target)"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pcapfix.sh
    description: "打包产物功能测试：无参数调用打印 Usage 且非零退出；对 4 字节 magic 被清零的 pcap（24B 全局头 + 2×76B 包，共 176B）执行修复，断言退出码 0、stdout 含 SUCCESS: 1 Corruption(s) fixed、输出文件 magic 恢复为 d4c3b2a1/a1b2c3d4、文件大小不变"
    command: "bash test_pcapfix.sh <pkg_bin>"
  - file: consumer_pcap_repair_pipeline.sh
    description: "消费者用例：模拟下游抓包分析流水线——358B 夹具（24B 全局头 + 4 包，caplen 60/80/60/70，payload 各异）magic 清零→pcapfix 修复→下游读取器按 pcap 记录链逐包消费（dd+od 读 u32 LE caplen、步进 16B+caplen），断言每包 caplen 正确、payload 与原始写入逐字节一致（cmp）、4 包后位置恰等于文件大小（记录链完整无尾部垃圾）"
    command: "bash consumer_pcap_repair_pipeline.sh <pkg_bin>"

# 测试断言总数 (近似值, 用于质量评估)
# test_pcapfix.sh：二进制存在可执行、no-args 非零、Usage 出现、夹具尺寸 176、修复退出 0、
# SUCCESS 横幅、输出存在、magic 恢复、大小一致 = 9 个检查点
# consumer_pcap_repair_pipeline.sh：二进制存在、夹具尺寸 358、损坏夹具尺寸、修复退出 0、
# SUCCESS 横幅、4×caplen、4×payload cmp、记录链终点=文件大小 = 13 个检查点
assertion_count: 22
