software: pcapfix
display: "pcapfix"
description: "Repair damaged or corrupted pcap and pcapng capture files"
category: network-tool
homepage: "https://f00l.de/pcapfix/"
license: GPL-3.0-or-later
build_system: makefile

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Makefile 单二进制（无 configure），libc-only 零依赖，make CC=clang 即可构建"
    - "musl/OHOS 无 glibc 的 legacy BSD u_int8_t..64_t 类型（上游仅 __WIN32__ 兜底），需 pcapfix.h 加 typedef 补丁"
    - "上游默认 CFLAGS 含 gcc 专属 --param=ssp-buffer-size=4 与 getconf 调用，须整体显式覆盖"
    - "上游 make install 用 GNU-only install -pD，打包改为手动复制 bin/share/man/licenses"
    - "无 --version/-h/--help 选项，无参数触发 usage 且非零退出（CI L2 为非阻塞 warn）"
    - "上游无测试套件（无 check/test 目标），test_package 自带功能测试（magic 清零修复场景）"
  common_dependencies: []

# 版本索引（所有已归档版本，含状态）
versions:
  "1.1.7":
    status: built
    build_date: "2026-09-18"
    conan_ref: "pcapfix/1.1.7"
