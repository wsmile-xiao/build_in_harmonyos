manifest:
  package: pyenchant
  version: 3.3.0
  upstream_test_source: "PyPI sdist tests/ 目录（9 个文件：test_broker / test_checker / test_dict / test_docstrings / test_misc / test_multiprocessing / test_pwl / test_tokenize / test_utils）"
  upstream_test_result: "**实测 36 passed / 17 failed / 10 errors**（口径 `pytest tests --assert=plain -p no:cacheprovider`，PYTEST_DISABLE_PLUGIN_AUTOLOAD=1；PYENCHANT_LIBRARY_PATH 指向 conan 依赖 enchant/2.8.2 的 lib/libenchant-2.so，LD_LIBRARY_PATH 含整条依赖链 lib 目录）。27 项失败/错误**全部**为词典相关：本环境无任何拼写词典（/usr/share/hunspell、/usr/share/myspell、/usr/share/aspell 均不存在；enchant/2.8.2 包内也不含 .dic/.aff），故报 `enchant.errors.DictNotFoundError` 或断言词典存在失败 —— 属**环境缺失**，非 pyenchant 缺陷，已逐项列入 ALLOWED_TEST_FAILURES 并在构建日志显式告警"
  consumer_test: "test_pyenchant.py（R34：验证 ctypes→libenchant-2 绑定真实可用 —— import enchant、enchant.Broker() 实例化、enchant.tokenize.unit_tokenize('hello world') 与 ('hello') 纯 Python 分词、enchant.list_languages() 类型；均不依赖系统拼写词典。实测 list_languages -> 0 langs，符合无词典环境）"
