knowledge_gained:
  - "pyenchant 3.x 纯 Python，无编译；运行期通过 ctypes 加载系统 libenchant-2，故 conan 侧 requires(\"enchant/2.8.2\") 并把其 lib/ 经 PYENCHANT_LIBRARY_PATH（pyenchant 首选途径）与 LD_LIBRARY_PATH 暴露"
  - "pyenchant 的 setup.cfg 用 `packages = find:`（自动发现），staging 目录必须放在源码树之外，否则可能被一并纳入包发现"
  - "本机 pytest 环境两处缺陷需绕开：typeguard 插件与 pytest 版本不兼容 → 禁插件自动加载；断言重写抛 TypeError → --assert=plain"
