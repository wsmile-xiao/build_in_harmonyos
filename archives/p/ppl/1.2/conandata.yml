sources:
  url: "http://deb.debian.org/debian/pool/main/p/ppl/ppl_1.2.orig.tar.xz"
  sha256: "691f0d5a4fb0e206f4e132fc9132c71d6e33cdda168470d40ac3cf62340e9a60"
patches:
  # 上游修 clang 的提交 c39f6a07（Homebrew 也在用同一份；Debian 那边拿 g++ 编所以不需要）：
  # PPL 1.2 有两处模板省了 `typename`/`template`，GCC 放行、clang 直接报
  #   error: missing 'typename' prior to dependent type template name
  # C++20 的 P0634R3 本可免掉这些 typename，但设备上的 clang-15 还没实现（clang 16 才有）——
  # 实测 -std=c++20 报同样的错，所以只能打补丁。
  # ⚠️ 这份补丁是按真实文件用 difflib 重生成、并用 **patch_ng**（conan 自己的补丁引擎）验过的：
  # 上游/Homebrew 的原始 diff 直接拿来会被 patch_ng 判 can_patch=False（它比 git apply 严）。
  "1.2":
    - patch_file: "patches/0001-clang5-typename.patch"
      patch_description: "上游 c39f6a07：补齐两处模板里省掉的 typename/template（clang 必需）"
      patch_type: "portability"
