# test_package/MANIFEST.yml
# PlutoVG upstream has no standalone test suite; its official workflow builds
# the smiley example. The recipe builds and runs that example as the upstream
# functional check, then test_package validates consumer linkage and rendering.

package: plutovg/1.3.3
homepage: "https://github.com/sammycage/plutovg"

upstream_check_command: "cmake --build . --target smiley"
upstream_test_in_build: true
upstream_test_command: "self.run(./examples/smiley)"

upstream_tests:
  - file: examples/smiley.c
    source: plutovg-1.3.3/examples/smiley.c
    description: "Upstream example renders a 150x150 smiley PNG"
    command: "./smiley"

test_package_tests:
  - file: test.c
    description: "Consumer test checks version, matrix operations, rasterization, and PNG output"
    command: "./test_plutovg"

assertion_count: 25
