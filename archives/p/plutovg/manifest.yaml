software: plutovg
display: "PlutoVG"
description: "Tiny 2D vector graphics library in C, providing canvas drawing, gradients, blend modes, font rendering and PNG output"
category: gfx
homepage: "https://github.com/sammycage/plutovg"
license: MIT
build_system: cmake

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "cmake 在 HarmonyOS 平台识别为 unknown，不影响编译（pthread 检测正常通过）"
    - "纯 C 静态库，无可执行二进制，无需 ELF 签名"
    - "pkg-config 文件使用 ${pcfiledir} 相对路径，天然适配 DESTDIR 模式"
  common_dependencies: []

# 版本索引
versions:
  "1.3.2":
    status: published
    build_date: "2026-06-13"
