software: plutovg

# ============================================================
# 必须字段
# ============================================================

version: "1.3.2"
status: published
build_date: "2026-06-13"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/sammycage/plutovg/archive/refs/tags/v1.3.2.tar.gz"
  sha256: "7bd4e79ce18b1d47517e7e91fbb7cf19d4f01942804a519bc7c0bf32b6325dd5"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: cmake
  build_system: cmake
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_C_COMPILER=clang"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "HarmonyOS平台Python SSL证书验证失败，需用curl -kL手动下载源码后以file://URL初始化"
  - "cmake在HarmonyOS平台识别为unknown，但pthread检测通过，不影响编译"
  - "plutovg是纯C静态库，无可执行二进制，无需ELF签名"
  - "pkg-config文件使用${pcfiledir}相对路径，适配DESTDIR部署模式"
