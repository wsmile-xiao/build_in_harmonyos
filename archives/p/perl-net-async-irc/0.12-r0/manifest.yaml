software: perl-net-async-irc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.12-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.12-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Net-Async-IRC-0.12.tar.gz"

  # 源码校验和
  sha256: "c7326d78b04be86ddbf645bf5c29b2a41b09cc01e10953982b8906bb13124487"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Build.PL --install_base=$PACKAGE_FOLDER/perl5"
    - "./Build"
    - "./Build install"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "perl-io-async/0.805"
    - "perl-protocol-irc/0.13"
    - "perl-future/0.52"
    - "perl-future-asyncawait/0.47 (XS, 需系统安装)"
    - "perl-xs-parse-sublike/0.10 (XS, 需系统安装)"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 Module::Build (Build.PL) 构建，无需 configure/make"
  - "PERL5LIB 环境变量会覆盖系统 site_perl 编译时路径，导致系统 Perl 模块不可用；应使用 -I 参数代替"
  - "musl 1.2.5 安装可能缺少标准头文件（68 个），需从源码补全到 ~/usr/local/include/"
  - "Perl 5.42 的 embed.h 定义了 newPADxVOP(a,b,c) 宏，与 Future::AsyncAwait 0.47 的 4 参数函数冲突，需 #undef"
  - "XS 模块编译参数：-nostartfiles -L~/usr/local/lib -lc 链接，绕过缺失的 CRT 文件"
  - "SELinux HMDFS 限制：hishell_hap 只能加载 hnp_file 类型的 .so，需安装到 /data/service/hnp/（与 perl-dbd-pg 相同）"
