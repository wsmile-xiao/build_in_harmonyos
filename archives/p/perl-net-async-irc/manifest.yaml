software: perl-net-async-irc
description: "Net::Async::IRC - Use IRC with IO::Async"

homepage: "https://metacpan.org/release/Net-Async-IRC"
repository: ""
license: "GPL-1.0-or-later OR Artistic-1.0-Perl"

# 运行时依赖（Perl 模块）
runtime_dependencies:
  - "perl >= 5.14"
  - "perl-io-async >= 0.54"
  - "perl-protocol-irc >= 0.13"
  - "perl-future >= 0.43"
  - "perl-future-asyncawait >= 0.47 (XS)"

# 编译依赖
build_dependencies:
  - "perl >= 5.14"
  - "perl Module::Build"

# 版本索引
versions:
  - version: "0.12-r0"
    status: published
    build_date: "2026-06-25"
    conan_ref: "perl-net-async-irc/0.12-r0@ohpcd/stable"
