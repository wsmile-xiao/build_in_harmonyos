sources:
  # 上游项目已由 merces/pev 迁移至 mentebinaria/readpe（merces/pev 已清空为指针仓库，
  # 无任何 tag；v0.82 为 mentebinaria/readpe 的真实 tag，git ls-remote 实测存在）
  url: "https://github.com/mentebinaria/readpe/archive/refs/tags/v0.82.tar.gz"
  sha256: "6ee625acedb3cbe636afe41f854b6eed5aac466d7fad52e3a48557083f8acecc"

patches:
  - patch_file: "patches/0001-lib-libpe-error.c.patch"
    patch_description: "musl 的 strerror_r 恒为 POSIX 形态（返回 int），即使定义 _GNU_SOURCE；GNU 专用分支改为以 __GLIBC__ 判据，musl/OHOS 走 XSI 形态"
    patch_type: "portability"
  - patch_file: "patches/0002-relocatable-pluginsdir-sharedir.patch"
    patch_description: "插件目录与 userdb 路径编译期烘焙为绝对路径，重定位安装（Conan 包缓存会在构建后搬移包目录）必然悬空：烘焙路径存在时保持原行为，否则回退到可执行文件相对路径（/proc/self/exe 推导）"
    patch_type: "portability"
  - patch_file: "patches/0003-libpe-static-r26.patch"
    patch_description: "R26：设备系统 /lib64 已有 libpe.so，本包不得输出同名动态库；libpe 改为静态库链接进每个工具，工具加 -Wl,--export-dynamic 使 dlopen 的输出插件仍能解析 pe_* 符号"
    patch_type: "portability"
