# pev 0.82 编译档案
# 版本级 manifest
# 文件位置: archives/p/pev/0.82/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.82"

# 软件名
software: pev

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"

# 构建系统类型
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  # 项目已由 merces/pev 迁移至 mentebinaria/readpe（merces/pev 无任何 tag，
  # v0.82 为 mentebinaria/readpe 真实 tag，git ls-remote 实测）
  url: "https://github.com/mentebinaria/readpe/archive/refs/tags/v0.82.tar.gz"

  # 源码校验和
  sha256: "6ee625acedb3cbe636afe41f854b6eed5aac466d7fad52e3a48557083f8acecc"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（纯 Makefile 工程，无 configure；以下为 make 命令行变量）
  configure_options:
    - "PLATFORM_OS=Linux"
    - "AR=llvm-ar（0003 静态库归档用）"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "openssl/3.5.6"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-lib-libpe-error.c.patch"
  - "0002-relocatable-pluginsdir-sharedir.patch"
  - "0003-libpe-static-r26.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 设备 uname -s 返回 HarmonyOS，上游按 PLATFORM_OS:=$(shell uname|cut -d_ -f1) 分支的 Makefile（pev 顶层/libpe/plugins 三处）全部落空：libpe.so 与输出插件不会被链接；PLATFORM_OS 为非 override 变量，make 命令行传 PLATFORM_OS=Linux 即可"  # knowledge_ref: DRAFT-E640
  - "musl（OHOS libc）的 strerror_r 恒为 POSIX 形态（返回 int），_GNU_SOURCE 不改变它：GNU 形态分支必须以 __GLIBC__ 判据（glibc 专属宏），否则 clang 报 incompatible integer to pointer 硬错误"  # knowledge_ref: DRAFT-E643
  - "编译期烘焙绝对路径（-DPLUGINSDIR/-DSHAREDIR）在 Conan 包内必然悬空：conan create 的 package_folder 在构建期位于 p/b/<hash>/p 临时区、成功后搬移到 p/<hash>/p；稳健做法是运行期回退到可执行文件相对路径（/proc/self/exe）；插件依赖进程内 libpe 符号时，系统已有同名库（/lib64/libpe.so）可走「静态库 + -Wl,--export-dynamic」组合满足 R26，包内不输出任何同名 .so"  # knowledge_ref: DRAFT-E641

