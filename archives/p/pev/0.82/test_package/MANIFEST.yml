test_package:
  type: smoke
  description: "验证 pev 工具链在 HarmonyOS 上可运行：readpe -V 版本烟测、readpe/pehash 解析 pe32_sample.py 运行期生成的最小 PE32 样本、readpe -f json 验证 dlopen 输出插件目录"
  test_command: "python3 pe32_sample.py <scratch>/pev_smoke.exe; readpe -V; readpe pev_smoke.exe; pehash -a sha512 pev_smoke.exe; readpe -f json pev_smoke.exe"

# 提交面文件清单（test_package/ 下全部 git 跟踪文件，与提交面一一对应）
files:
  - conanfile.py
  - pe32_sample.py
  - MANIFEST.yml
