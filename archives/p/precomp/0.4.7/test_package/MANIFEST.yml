# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: precomp/0.4.7
homepage: "https://github.com/schnaader/precomp-cpp"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# precomp 上游无自动化测试套件：无 check/test 目标、无 CTest 配置；
# 仅有 appveyor.yml（Windows CI 构建冒烟，不跑功能测试）
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_precomp.py
    description: "消费者测试: 驱动 precomp 二进制——--version/--help 返回码与输出断言 + 弱压缩(级别1)gzip 输入预压缩生成 .pcf(1/1 流) + -r 还原 sha256 字节一致 round-trip + gzip(.pcf)<gzip(原文件) 压缩增益断言(precomp 核心价值主张)"
    command: "python3 test_precomp.py <bin/precomp>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 5
