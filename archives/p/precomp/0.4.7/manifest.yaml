# 编译中学到的知识
knowledge_gained:
  - "CMake 4.x 对 CMAKE_SYSTEM_NAME=HarmonyOS（本机自动探测）不设置 UNIX 变量（实测 if(UNIX) 为假）→ 上游 if(UNIX) 平台分支失效、代码走 Windows 路径；解法：配方注入 CMAKE_SYSTEM_NAME=Linux（原生构建、musl/libc++、无 Linux 专有 API），abcmidi 同款先例（ref: E092）"
  - "上游 cmake_minimum_required(VERSION 3.2) 被 CMake 4.x 拒绝 → CMAKE_POLICY_VERSION_MINIMUM=3.5 经 cache_variables 注入即可，无需动上游 CMakeLists（ref: DRAFT-E321-cmake4-policy-version-minimum 草稿）"
  - "precomp 的 -o 开关与文件名之间不能有空格（error 10）；-r 还原默认输出名取自 PCF 头内记录的原文件名，输出已存在时会交互式询问覆盖——脚本化场景必须 -o 显式指定输出（ref: DRAFT-precomp-cli-scripting-traps 草稿）"
  - "precomp 对完全随机/高重复内容的小文件，pcf 元数据开销会吞掉增益；压缩增益断言需用弱压缩（gzip level 1）+ 中等熵内容（~115KiB 词级文本）构造（ref: DRAFT-precomp-roundtrip-test-design 草稿）"
  - "上游 exit code 语义：0=成功、1=各类错误、2=无流可解；无参运行走 usage 路径 exit(1)——L2 冒烟（--version/--help 探测）需要适配补丁提供 rc=0 出口（ref: E503）"

# 知识引用（提交审计第 8 项校验路径存在性）
