software: precomp
display: "precomp"
description: "precomp — 压缩再压缩命令行工具：解出文件内已压缩流（deflate/zlib/gzip、bZip2、GIF、JPG、MP3、ZIP、PDF、SWF、MIME Base64、LZMA）生成 .pcf，使更强压缩器获得更好压缩比，支持 -r 位对位无损还原"
category: compression
homepage: "https://github.com/schnaader/precomp-cpp"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMakeLists.txt 用 if(UNIX) 守卫平台分支（-DUNIX/-DLINUX 定义 + find_package(Threads)），而 CMake 4.x 对 HarmonyOS 系统名不设置 UNIX 变量（实测 UNIX 为空）→ 代码会走 Windows 路径；配方 generate() 以 CMAKE_SYSTEM_NAME=Linux 配置（本机原生构建，musl/libc++，无 Linux 专有 API），UNIX 分支正常生效（abcmidi 同款先例）"
    - "上游 cmake_minimum_required(VERSION 3.2) 被 CMake 4.x 拒绝（<3.5 兼容已移除）→ 注入 CMAKE_POLICY_VERSION_MINIMUM=3.5，无需改上游 CMakeLists"
    - "上游无 install() 规则（仅 add_executable）→ package() 手动布局 bin/precomp"
    - "补丁仅一处（precomp.cpp）：新增 GNU 风格 --version/--help 长选项（原样打印已输出的横幅/usage 后 exit(0)），使脚本与制品冒烟能探测工具；不改变任何既有开关行为"
    - "全部第三方编解码器 vendored 于 contrib/（bzip2/zlib/giflib/liblzma/packJPG/packMP3/preflate）编进单二进制 → requirements 为空；唯一外部依赖 pthreads 由 musl libc 提供"
    - "2010 年代 vendored C 库在 clang 15 下仅 -Wformat-security/-Wformat 告警（无 -Werror），零源码修改即可编译"
  common_dependencies: []

versions:
  "0.4.7":
    status: built
    build_date: "2026-09-04"
    conan_ref: "precomp/0.4.7"
