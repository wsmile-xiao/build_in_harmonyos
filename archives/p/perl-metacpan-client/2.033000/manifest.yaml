software: perl-metacpan-client
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.033000/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.033000"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/MetaCPAN-Client-2.033000.tar.gz"

  # 源码校验和
  sha256: "6574147140119c114d1a9f5b92c34a0c2421ff69968137329afd1353b7a11323"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: makefile

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX"
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "Moo/2.005005"
    - "Ref::Util/0.204"
    - "Safe::Isa/1.000010"
    - "Type::Tiny/2.010001"
    - "JSON::MaybeXS/1.004008"
    - "Test::Needs/0.002010"
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 ExtUtils::MakeMaker 构建系统"
  - "CPAN 安装 XS 依赖失败（sys/types.h 缺失），需手动从 .cpan/build 目录 make install"
  - "Net::SSLeay.so 因 HMDFS SELinux 标签 hmdfs 禁止 .so 加载，导致 HTTPS 不可用；通过 METACPAN_DOMAIN=http://fastapi.metacpan.org 环境变量降级为 HTTP，全部 261 个测试通过"
  - "CPAN 需配置 INSTALL_BASE 安装到用户可写目录"
