# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-number-misc/1.2
homepage: https://metacpan.org/dist/Number-Misc

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# make test 实际运行的测试套件
upstream_tests:
  - name: "test.t"
    source: t/test.t
    description: "Number::Misc 全部 API 功能测试 (31 项)"

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "Number::Misc::is_numeric() API 验证 (exit code)"
    command: "perl -MNumber::Misc -e \"exit(Number::Misc::is_numeric(q{123}) ? 0 : 1)\""

# 测试断言总数 (近似值)
assertion_count: 32
