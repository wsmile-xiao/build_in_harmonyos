software: perl-number-misc
# 版本级 manifest
# 文件位置: archives/p/perl-number-misc/1.2/manifest.yaml

# ============================================================
# 必须字段
# ============================================================

version: "1.2"
status: built
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/M/MI/MIKO/Number-Misc-1.2.tar.gz"
  sha256: "77b9b68c600a069cf16f4d8126ecb32151e6bcd34b0edb17b78adee689dc91d8"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: perl (ExtUtils::MakeMaker)
  system: perl
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX"
  dependencies: []
  # 纯 Perl 模块，无 C/XS 代码，不需要编译器

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯Perl模块(Number::Misc)，使用ExtUtils::MakeMaker构建，无C/XS代码"
  - "SSL证书验证失败时建议安装ca-certificates解决根因，手动下载后须通过sha256校验确认文件完整性"
  - "Conan配方需从Autotools模板改为Perl专用：build()用perl Makefile.PL+make，package_info() libs为空，设置PERL5LIB路径"
  - "conan-verify G1-G4+L2/L4/L5全部通过，纯Perl模块无ELF可扫描文件"
  - "纯Perl模块不受SELinux HMDFS限制，与perl-dbd-pg的XS模块不同，可直接从用户目录加载使用"
  - "is_numeric()实现内部移除逗号后检查(POD文档示例标注为false但实际返回true)，为模块上游已知问题"
  - "功能测试73项全部通过(原始31项+自定义42项)，覆盖所有API函数及边界条件"
  - "Conan消费者安装验证通过，conanrun.sh正确设置PERL5LIB环境变量"
