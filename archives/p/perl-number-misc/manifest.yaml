software: perl-number-misc
display: "Number::Misc"
description: "Perl 模块，提供数字处理的便捷工具函数（判断、转换、格式化、随机数等）"
category: foundation
homepage: "https://metacpan.org/dist/Number-Misc"
license: perl_5
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，使用 ExtUtils::MakeMaker 构建，无 C/XS 代码"
    - "不受 SELinux HMDFS 限制，可直接从用户目录加载（与 XS 模块如 perl-dbd-pg 不同）"
    - "Conan 配方需使用 Perl 专用模板：build() 用 perl Makefile.PL + make，package_info() libs 为空，通过 PERL5LIB 提供模块路径"
    - "CPAN 源码下载可能遇到 SSL 证书问题，建议安装 ca-certificates 解决根因；临时绕过仅限开发环境且须通过 sha256 校验"
  common_dependencies: []

versions:
  "1.2":
    status: built
    build_date: "2026-06-29"
    conan_ref: "perl-number-misc/1.2@ohpcd/stable"
