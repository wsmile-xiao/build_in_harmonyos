software: perl-log-dispatch
version: 2.71
status: published  # 依赖已满足，功能可用
publish_status: published  # 已完成依赖编译并验证
category: perl
build_system: perl_makefile
license: artistic_2

# 编译信息
compile_date: 2026-06-15
compiler: perl
perl_version: 5.32.1

# 依赖关系
dependencies:
  runtime:
    - perl-Carp
    - perl-Devel-GlobalDestruction
    - perl-Dist-CheckConflicts (>= 0.02)
    - perl-Encode
    - perl-Module-Runtime
    - perl-Params-ValidationCompiler
    - perl-Scalar-Util
    - perl-Specio (>= 0.32)
    - perl-Sys-Syslog (>= 0.28)
    - perl-Try-Tiny
    - perl-namespace-autoclean

# 构建选项
configure_options: []
make_options: []

# 平台适配
platform_notes: |
  Perl 模块使用 Makefile.PL 构建，通过 ExtUtils::MakeMaker 生成 Makefile。
  鸿蒙平台 Perl 已正确安装，可以直接使用 Makefile.PL 构建。

  构建命令：
  perl Makefile.PL
  make
  make test
  make install

# 质量门禁
quality_checks:
  g0_clean_build: skip  # Perl 模块无 configure，使用 Makefile.PL
  g1_binary_integrity: pass
  g2_functional: pass
  g3_portability: pass
  g4_archive: pass

# 产物信息
artifacts:
  package: perl-log-dispatch-2.71-ohos-aarch64.tar.gz
  patches: 0

# 知识提取
knowledge_gained: []