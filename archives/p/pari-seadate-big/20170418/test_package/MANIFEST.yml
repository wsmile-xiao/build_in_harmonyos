package: "pari-seadate-big/20170418"
homepage: "https://pari.math.u-bordeaux.fr/packages.html"
upstream_test_in_build: false
upstream_tests: []
upstream_test_count: 0
upstream_test_evidence: "Official seadata-big.tar contains 44 sea*.gz files and README.big; no test scripts or build system. PARI's separate make test-all belongs to the consumer distribution."
test_package_tests:
  - file: "test_data.py"
    description: "44 compressed SHA256 checks, gzip CRC validation, Atkin vector and integer coefficient structure, and exact 45-file inventory"
    command: "python3 test_data.py <package>/share/pari --consumer <build>/test_seadata"
  - file: "test_seadata.c"
    description: "44 target-side complete polynomial reads with expected header, length and CRC32; one truncated-input rejection"
    command: "test_seadata <level> <bytes> <crc32> < polynomial"
  - file: "test_seadata.c"
    description: "One OHOS-only writable TMPDIR relocation test: copy real sea503 data to a space-containing path, rename, reopen and verify full CRC"
    command: "test_seadata --sandbox <sea503> <bytes> <crc32>"
test_package_assertion_count: 90
harmonyos_test_count: 1
assertion_count: 91
supplementary_host_tests:
  - file: "test_native.py"
    count: 2
    description: "Native OHOS runner without shell tools: sandbox is executed and its failure propagates; target subprocess is simulated on the host"
    command: "python3 test_package/test_native.py"
    included_in_conan_count: false
  - file: "test_download.py"
    count: 8
    description: "Real local HTTP server: bounded parallel ranges, transient retry, ignored/wrong ranges, truncation, SHA256 corruption, initial and in-transfer deadline expiry"
    command: "python3 test_package/test_download.py"
    included_in_conan_count: false
  - file: "test_pari.py"
    count: 44
    description: "Linux PARI/GP ellmodulareqn for every packaged level: Atkin type, degree and independent modular evaluation; requires official base sea0 fixture"
    command: "python3 test_pari.py --gp <gp> --datadir <package>/share/pari --base-sea0 <official-base>/sea0"
    included_in_conan_count: false
