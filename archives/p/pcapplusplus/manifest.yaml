software: pcapplusplus
display: "PcapPlusPlus"
description: "Multiplatform C++ library for capturing, parsing and crafting of network packets"
category: network
homepage: "https://pcapplusplus.github.io/"
license: MIT
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 项目；抓包后端使用制品仓 libpcap/1.10.6（armv8/OHOS/静态）"
    - "上游用自带 FindPCAP.cmake（find_path/find_library），配方把依赖包 include 与 libpcap.a 写入 PCAP_INCLUDE_DIR / PCAP_LIBRARY"
    - "强制 CMAKE_SYSTEM_NAME=Linux（CMake 无 HarmonyOS 平台模块，否则 if(UNIX) 分支不成立导致 LinuxNicInformationSocket.cpp 被丢弃）"
    - "上游测试为自研 PTF 框架，build() 内运行 Packet++Test 与 Pcap++Test -n -x live_device"
    - "无上游补丁"
  common_dependencies:
    - libpcap

versions:
  "26.07":
    status: built
    build_date: "2026-09-24"
    format: conan
    note: "PcapPlusPlus v26.07；静态库；依赖 libpcap/1.10.6；上游测试 328/328 执行用例通过"
