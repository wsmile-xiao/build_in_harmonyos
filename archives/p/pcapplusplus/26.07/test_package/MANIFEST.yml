# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 门禁强制要求存在）
#
# 填写依据：
#   1. 解压上游源码包 PcapPlusPlus-26.07
#   2. ctest -N 查看上游注册的测试（Tests/Packet++Test、Tests/Pcap++Test）
#   3. 记录本配方 build() 中实际运行的上游测试与消费者测试

package: pcapplusplus/26.07
homepage: "https://pcapplusplus.github.io/"

# 上游测试命令（用于 ctest -N / make check 分析）
upstream_check_command: "cmake -DPCAPPP_BUILD_TESTS=ON .. && ctest -N"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "Tests/Packet++Test/Packet++Test; Tests/Pcap++Test/Pcap++Test -n -x live_device"

# 上游实际运行的测试程序
# 上游使用自研 PTF（PcppTestFramework）框架，无 gtest 依赖，两个可执行文件：
#   Packet++Test  —— 259 个已注册用例，全部离线（解析 PacketExamples/*.dat 固件）
#   Pcap++Test    —— 113 个已注册用例；-n 只跑 no_network 用例，
#                    再 -x live_device 排除 2 个需要真实网卡枚举的用例
#                    （构建沙箱 /sys/class/net 与 ETHTOOL_GLINK ioctl 均无权限，
#                     libpcap pcap_findalldevs 返回 EPERM，详见 notes.md）
upstream_tests:
  - file: Tests/Packet++Test/main.cpp
    source: PcapPlusPlus-26.07/Tests/Packet++Test/main.cpp
    description: "PTF：Packet++ 报文解析/构造用例（259 个），数据来自 Tests/Packet++Test/PacketExamples/*.dat"
    command: "./Packet++Test"
  - file: Tests/Pcap++Test/main.cpp
    source: PcapPlusPlus-26.07/Tests/Pcap++Test/main.cpp
    description: "PTF：Pcap++ 离线用例（pcap/pcapng 文件读写、BPF 过滤、TCP 重组、IP 分片、logger 等 69 个）"
    command: "./Pcap++Test -n -x live_device"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_pcapplusplus.cpp
    description: "消费者测试：IPv4/Mac 地址类型、Eth/IPv4/TCP/Payload 构造 + 序列化 + 再解析、libpcap 离线 BPF 过滤、pcap 文件写入/读取往返、鸿蒙 aarch64 平台属性（LP64/小端/64 位 timespec）"
    command: "./test_pcapplusplus"

# 测试断言总数（消费者测试实测值：test_pcapplusplus 打印 "36/36 checks passed"）
assertion_count: 36
