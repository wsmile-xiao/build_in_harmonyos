version: "26.07"
software: "pcapplusplus"
status: built
build_date: "2026-09-24"
build_system: "cmake"

source:
  url: "https://github.com/seladb/PcapPlusPlus/archive/refs/tags/v26.07.tar.gz"
  sha256: "58efbebde9df37134ca6abffdc585562155b7fc0937ced1fd6569a8c93a22ba6"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_SYSTEM_NAME=Linux"
    - "-DBUILD_SHARED_LIBS=OFF"
    - "-DPCAPPP_BUILD_PCAPPP=ON"
    - "-DPCAPPP_BUILD_EXAMPLES=OFF"
    - "-DPCAPPP_BUILD_TESTS=ON"
    - "-DPCAPPP_USE_PCAP=ON"
    - "-DPCAPPP_INSTALL=ON"
    - "-DPCAP_INCLUDE_DIR=<libpcap pkg>/include"
    - "-DPCAP_LIBRARY=<libpcap pkg>/lib/libpcap.a"
  dependencies:
    - libpcap/1.10.6
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "CMake 无 Platform/HarmonyOS.cmake：不强制 CMAKE_SYSTEM_NAME=Linux 时 if(UNIX) 为假，Pcap++/src/LinuxNicInformationSocket.cpp 会被静默丢弃"
  - "上游用自带 cmake/modules/FindPCAP.cmake（find_path/find_library），需把 Conan libpcap 包的 include 目录与 libpcap.a 直接写进 PCAP_INCLUDE_DIR / PCAP_LIBRARY"
  - "上游测试为自研 PTF 框架（PTF_TEST_CASE + PTF_RUN_TEST），无 gtest 依赖；summary 行格式为 'Test cases: N, Passed: P, Failed: F, Skipped: S'"
  - "构建沙箱禁止 /sys/class/net 与 SIOCETHTOOL(ETHTOOL_GLINK)，libpcap pcap_findalldevs 返回 EPERM，live_device 类上游用例不可用"
