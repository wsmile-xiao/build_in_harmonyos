software: php85-pecl-memcache
display: "PHP 8.5 PECL Memcache"
description: "PHP memcache extension for caching via memcached servers"
category: db
homepage: "https://pecl.php.net/package/memcache"
license: PHP-3.01

build_system: phpize

ohos_adaptation:
  key_points:
    - "Fix smart_string include paths for PHP 8.5+ (ext/standard/ → Zend/)"
    - "Fix phpize prefix replacement sed for non-root prefix"
    - "Fix config.status umask 077 issue on HarmonyOS HMDFS"
    - "Disable session support (PHP built with --disable-all)"
    - "Build local zlib with -fPIC (conan zlib static without -fPIC)"
  common_dependencies:
    - php
    - zlib

versions:
  "2.3.3":
    status: built
    build_date: "2026-08-24"
