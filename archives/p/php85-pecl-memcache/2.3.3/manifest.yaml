software: php85-pecl-memcache
version: "2.3.3"
status: built
build_date: "2026-08-24"
build_system: phpize

source:
  url: "https://pecl.php.net/get/memcache-8.2.tgz"
  sha256: "b3f0640eacdeb9046c6c86a1546d7fb8a4e9f219e5d9a36a287e59b2dd8208e5"
  tar_format: tar.gz

build:
  configure_options:
  configure_options:
    - "--with-php-config"
    - "--with-zlib-dir"
    - "--disable-memcache-session"
  dependencies:
    - php/8.5.8
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PHP smart_string include paths moved from ext/standard/ to Zend/ in PHP 8.5+"
  - "phpize prefix replacement needs fix for non-root conan prefix"
  - "config.status umask 077 issue on HarmonyOS HMDFS requires umask 000"
  - "zlib conan package is static without -fPIC, must build local zlib with -fPIC for shared .so"
