# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-object-insideout/4.05-r7
homepage: "https://metacpan.org/release/Object-InsideOut"

# 上游测试命令 (Perl 模块使用 make test / make check)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序 (Object-InsideOut 自带 67 个测试文件)
upstream_tests:
  - file: t/01_INHERIT.t
    source: Object-InsideOut-4.05/t/01_INHERIT.t
    description: "继承机制测试"
    command: "perl -Ilib t/01_INHERIT.t"
  - file: t/02_HASH.t
    source: Object-InsideOut-4.05/t/02_HASH.t
    description: "哈希类型对象测试"
    command: "perl -Ilib t/02_HASH.t"
  - file: t/03_ARRAY.t
    source: Object-InsideOut-4.05/t/03_ARRAY.t
    description: "数组类型对象测试"
    command: "perl -Ilib t/03_ARRAY.t"
  - file: t/04_SCALAR.t
    source: Object-InsideOut-4.05/t/04_SCALAR.t
    description: "标量类型对象测试"
    command: "perl -Ilib t/04_SCALAR.t"
  - file: t/10_CONSTANT.t
    source: Object-InsideOut-4.05/t/10_CONSTANT.t
    description: "常量字段测试"
    command: "perl -Ilib t/10_CONSTANT.t"
  - file: t/20_PERMISSIONS.t
    source: Object-InsideOut-4.05/t/20_PERMISSIONS.t
    description: "权限控制测试"
    command: "perl -Ilib t/20_PERMISSIONS.t"
  - file: t/30_INITIALIZE.t
    source: Object-InsideOut-4.05/t/30_INITIALIZE.t
    description: "初始化方法测试"
    command: "perl -Ilib t/30_INITIALIZE.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_oio.py
    description: "消费者测试: 验证 Object::InsideOut 包结构、内容完整性、运行时模块加载与功能验证"
    command: "python3 test_oio.py"

# 测试断言总数 (上游 67 个测试文件共 793 个测试断言)
assertion_count: 793
