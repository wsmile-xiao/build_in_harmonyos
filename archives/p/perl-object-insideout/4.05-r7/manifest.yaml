software: perl-object-insideout
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.05-r7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.05-r7"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# 构建系统类型（顶层，CI G4 门禁识别用）
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/J/JD/JDHEDDEN/Object-InsideOut-4.05.tar.gz"

  # 源码校验和
  sha256: "9dfd6ca2822724347e0eb6759d00709425814703ad5c66bdb6214579868bcac4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "DESTDIR 与 INSTALL_BASE 绝对路径组合导致 copy() 路径嵌套：make install DESTDIR + INSTALL_BASE=绝对路径 时，文件安装到 staging/绝对路径/ 下，Conan copy() 保留完整路径结构导致产物路径错误"
  - "纯 Perl 模块应使用 build_folder 下的临时 prefix（非 self.package_folder）+ 直接 make install（不用 DESTDIR），避免路径嵌套问题"
  - "test_package/MANIFEST.yml 是 CI L0e 门禁强制要求，conan-init --force 会生成模板，需手动填写上游测试声明"
  - "conan-init --force 会用通用模板覆盖已有的定制配方，对 Perl 模块需恢复手动定制的 conanfile.py（非 autotools/CMake 模板）"
  - "系统已安装旧版 Perl 模块时，test_package 的 copy() 路径错误会导致 Perl 回退到系统旧版本，掩盖 Conan 包的实际版本"
