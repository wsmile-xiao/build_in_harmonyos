package: pbc/1.0.0
homepage: "https://crypto.stanford.edu/pbc/"

upstream_check_command: "make check VERBOSE=1"
upstream_test_in_build: true
upstream_test_command: "make check VERBOSE=1 && ./gtest --gtest_brief=1 && ./pbc_test --gtest_brief=1"

upstream_tests:
  - file: unittests/gtest.cpp
    source: pbc-1.0.0/unittests/gtest.cpp
    description: "GoogleTest integration sanity suite (1 runtime test)"
    command: "./gtest --gtest_brief=1"
  - file: unittests/pbc_test.cpp
    source: pbc-1.0.0/unittests/pbc_test.cpp
    description: "C++ element and pairing suite (133 expanded runtime tests)"
    command: "./pbc_test --gtest_brief=1"

test_package_tests:
  - file: test.cpp
    description: "C and C++ consumer test covering parameter parsing, field/group arithmetic, serialization, and bilinear pairing identities"
    command: "./test_pbc"

assertion_count: 16
