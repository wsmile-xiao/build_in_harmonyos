version: "1.0.0"
software: "pbc"
status: built
build_date: "2026-09-09"
build_system: "autotools"
conan_ref: "pbc/1.0.0"

source:
  url: "https://crypto.stanford.edu/pbc/files/pbc-1.0.0.tar.gz"
  sha256: "18275a367283077bafe35f443200499e3b19c4a3754953da2a1b2f0d6b5922dc"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--enable-cxx"
    - "--enable-shared"
    - "--disable-static"
  dependencies:
    - "gmp/6.3.0"
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-include-pbcxx.h.patch"
  - "0002-autotools-harmonyos.patch"

knowledge_gained:
  - "官方 1.0.0 tarball 保留空 googletest 目录，必须按上游 gitlink 提交补入测试源码"
  - "pbcxx.h 的匿名命名空间模板无法被 Pairing 的友元模板声明匹配"
  - "同目录引号包含使 pbcxx.h 在源码树和安装后的 include/pbc 布局中均可用"
  - "HarmonyOS HMFS 在 umask 077 下创建的 Autotools 临时目录可能不可写，需使用可写权限并让 config.guess/config.sub 原生识别 linux-ohos"

patch_classification:
  - file: 0001-include-pbcxx.h.patch
    type: portability
    platform_only: false
    guard: none
  - file: 0002-autotools-harmonyos.patch
    type: portability
    platform_only: true
    guard: uname
