software: pbc
display: "Pairing-Based Cryptography Library"
description: "C library providing low-level operations for pairing-based cryptosystems"
category: crypto
homepage: "https://crypto.stanford.edu/pbc/"
license: "LGPL-3.0-or-later OR Apache-2.0"
build_system: autotools

ohos_adaptation:
  key_points:
    - "Recognizes HarmonyOS in the release Autotools configuration scripts"
    - "Builds shared and static libraries while preserving the upstream public API"
    - "Runs all 134 upstream test cases and an installed-package consumer test"
  common_dependencies:
    - gmp

versions:
  "1.0.0":
    status: built
    build_date: "2026-09-09"
    conan_ref: "pbc/1.0.0"
