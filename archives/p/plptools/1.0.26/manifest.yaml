  sha256: "5a7faf45e268a5717d0b4e79ba8648983fba1d3629923b371e5ee3dbc80f2a58"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-musl"
