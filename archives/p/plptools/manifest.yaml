software: plptools
display: "plptools"
description: "EPOC/Psion serial-link command-line tools"
category: utility
homepage: "https://github.com/plptools/plptools"
license: GPL-2.0-or-later
build_system: autotools
ohos_adaptation:
  key_points:
    - "Use release Autotools scripts and cross-style configure probes on OHOS."
    - "Verify the readline dependency header before pre-seeding AX_LIB_READLINE's cross result."
    - "Replace ncpd pthread cancellation with cooperative stop and join."
    - "Exclude optional FUSE because published libfuse 2 requires unavailable pthread cancellation."
  common_dependencies:
    - readline
versions:
  "1.0.26":
    status: built
    build_date: 2026-10-01
