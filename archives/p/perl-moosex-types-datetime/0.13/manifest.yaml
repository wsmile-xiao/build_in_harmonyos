software: perl-moosex-types-datetime
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.13/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.13"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://backpan.perl.org/authors/id/E/ET/ETHER/MooseX-Types-DateTime-0.13.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "perl-moose/2.4000"
    - "perl-moosex-types/0.51"
    - "perl-datetime/1.66"
    - "perl-datetime-locale/1.45"
    - "perl-datetime-timezone/2.68"
    - "perl-namespace-clean/0.27"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块通过 Makefile.PL 编译，无 XS 组件，无编译风险"
  - "DateTime 1.66 XS 编译因 musl 头文件不完整(endian.h) 失败，但纯 Perl 回退模式(DateTime::PP)功能完整"
  - "运行时依赖需通过 CPAN 安装 DateTime/DateTime::Locale/DateTime::TimeZone，这些模块本身为纯 Perl"
