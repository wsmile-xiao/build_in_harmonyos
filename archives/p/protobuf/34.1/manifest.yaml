software: protobuf
version: 34.1
status: success
build_system: cmake
created_at: 2026-04-22
knowledge_gained:
  - protobuf 使用 CMake 构建系统，需要依赖 abseil-cpp
  - CMake 配置参数: -DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX -Dprotobuf_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
  - abseil-cpp 通过 absl_DIR cmake 变量自动找到（$DEFAULT_PREFIX/lib/cmake/absl）
  - 编译有 deprecated 警告（abseil MutexLock/Lock/Unlock API），不影响功能
patches_applied: []
build_log: logs/build.log
source_url: https://github.com/protocolbuffers/protobuf/releases/download/v34.1/protobuf-34.1.tar.gz
configure_options:
  - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
  - "-Dprotobuf_BUILD_TESTS=OFF"
  - "-DCMAKE_BUILD_TYPE=Release"
dependencies:
  - abseil-cpp (20260107.1)
