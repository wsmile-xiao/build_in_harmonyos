sources:
  protobuf:
    url: "https://codeload.github.com/protocolbuffers/protobuf/tar.gz/refs/tags/v3.17.3"
    filename: "protobuf-3.17.3.tar.gz"
    sha256: "c6003e1d2e7fefa78a3039f19f383b4f3a61e81be8c19356f85b6461998ad3db"
  googletest:
    url: "https://codeload.github.com/google/googletest/tar.gz/refs/tags/release-1.10.0"
    filename: "googletest-1.10.0.tar.gz"
    sha256: "9dc9157a9a1551ec7a7e43daea9a694a0bb5fb8bec81235d8a1e6ef64c716dcb"

patches:
  - patch_file: "patches/0001-disable-protoc-version-symlink.patch"
    patch_description: "Drop protoc's VERSION property so CMake does not attempt to create a version symlink on OHOS, where symlink creation is forbidden. The target executable is installed as a plain 'protoc'."
    patch_type: "portability"
  - patch_file: "patches/0002-tests-link-zlib.patch"
    patch_description: "Link the upstream gtest test targets (tests/test_plugin/lite-test/lite-arena-test) to zlib when protobuf_WITH_ZLIB=ON, since protobuf static libs reference zlib symbols (deflate) at test-link time under OHOS."
    patch_type: "portability"
