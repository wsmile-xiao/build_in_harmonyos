software: protobuf
version: "3.17.3"
status: built
build_date: "2026-09-03"
build_system: cmake
source:
  url: "https://github.com/protocolbuffers/protobuf/releases/download/v3.17.3/protobuf-cpp-3.17.3.tar.gz"
  sha256: "c6003e1d2e7fefa78a3039f19f383b4f3a61e81be8c19356f85b6461998ad3db"
  tar_format: tar.gz
build:
  system: cmake
  build_script_folder: cmake
  configure_options:
    - "-Dprotobuf_BUILD_TESTS=ON"
    - "-Dprotobuf_BUILD_CONFORMANCE=OFF"
    - "-Dprotobuf_BUILD_EXAMPLES=OFF"
    - "-Dprotobuf_BUILD_SHARED_LIBS=OFF"
    - "-Dprotobuf_BUILD_PROTOC_BINARIES=ON"
    - "-Dprotobuf_BUILD_LIBPROTOC=ON"
    - "-Dprotobuf_WITH_ZLIB=ON"
    - "-DZLIB_LIBRARIES=zlib::zlib"
    - "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON"
  dependencies:
    - zlib/1.3.1
    - googletest/1.10.0 (build-time test only, from conandata)
  cc: clang
  cxx: clang++
patches_applied:
  - "patches/0001-disable-protoc-version-symlink.patch"
  - "patches/0002-tests-link-zlib.patch"
knowledge_gained:
  - "protobuf 3.17.3 (2021-05) does not depend on abseil-cpp; only the optional zlib external dependency."
  - "protobuf 3.17.3's CMake entry point lives in the top-level cmake/ subdirectory, so the recipe must use build_script_folder=cmake."
  - "The upstream source ships pre-generated src/google/protobuf/*.pb.cc, so building libprotobuf/libprotoc does not require running a host protoc."
  - "The installed protobuf-config.cmake exports protobuf::libprotobuf/protoc/libprotobuf-lite targets via NAMESPACE protobuf::."
  - "Upstream gtest targets (tests/lite-test/lite-arena-test) build+pass on the OHOS aarch64 device (2330/2330) when protobuf_BUILD_TESTS=ON, googletest v1.10.0 is provided, ZLIB_LIBRARIES is set to zlib::zlib, and LD_LIBRARY_PATH points to the OHOS SDK aarch64-linux-ohos dir for the libc++_shared.so dependency."
  - "Conan zlib's CMake target is the lowercase zlib::zlib; upstream checks ZLIB::ZLIB so ZLIB_LIBRARIES must be injected explicitly."
