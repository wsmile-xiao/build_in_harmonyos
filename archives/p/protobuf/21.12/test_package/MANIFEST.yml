package: protobuf/21.12
homepage: "https://github.com/protocolbuffers/protobuf"

upstream_check_command: "none (upstream unit tests not built)"
upstream_test_in_build: false
upstream_test_reason: >-
  Upstream 21.12 unit tests are gtest based (~9000 cases across
  google/protobuf). Enabling protobuf_BUILD_TESTS requires a pinned
  googletest checkout that upstream fetches at CMake configure time and
  roughly doubles the build of a dependency package; runtime behaviour
  is therefore verified by the test_package programmatic tests which
  reproduce upstream semantics (descriptor pool, dynamic messages,
  reflection round-trips, arena, corrupt-input error paths) plus the
  protoc CLI version check.
upstream_tests: []

test_package_tests:
  - file: test_protobuf.cpp
    description: "dynamic: descriptor-pool schema + dynamic message binary round-trip with string/int32/bytes/repeated fields via reflection; pool: built-in descriptor lookup + duplicate-registration and unknown-type error paths; arena: arena allocation and serialization; parse_error: truncated/corrupt payload rejection and unknown-field survival"
    command: "ctest --output-on-failure --no-tests=error"
  - file: CMakeLists.txt
    description: "Runs the packaged protobuf::protoc imported executable with --version"
    command: "ctest --output-on-failure --no-tests=error"

assertion_count: 41
