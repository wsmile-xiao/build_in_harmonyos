package: protobuf/21.12
homepage: "https://github.com/protocolbuffers/protobuf"

upstream_check_command: >-
  conan create 阶段内执行上游 ctest（build() 中 ctest --timeout 900
  --output-on-failure）：3 个注册测试目标
  lite-test / lite-arena-test / check（monolithic `tests` 二进制，
  含 core/io/compiler/plugin/util 全部 gtest 用例）；每个目标带
  --gtest_output=xml（protobuf_TEST_XML_OUTDIR）逐用例可数。
upstream_test_in_build: true
upstream_test_reason: >-
  R51 三步法：上游 21.12 无独立 tests/ 目录，测试源为
  src/google/protobuf/ 下 *_unittest.cc/*_test.cc 共 72 个 .cc（由
  cmake/tests.cmake 编译进 tests / lite-test / lite-arena-test 三个
  gtest 二进制）。启用上游自带 protobuf_USE_EXTERNAL_GTEST=ON 路径
  （cmake/tests.cmake: if (protobuf_USE_EXTERNAL_GTEST)
  find_package(GTest REQUIRED)），gtest 由已发布的 googletest/1.12.1
  提供（test_require，GTest::gmock/GTest::gmock_main 组件目标齐全，
  与 3.21 同期版本 API 兼容）。实测全量 2421 用例：通过 2421、失败 0、
  跳过 0（见 notes.md 申报表与测试报告）。
upstream_tests:
  - name: lite-test (google/protobuf lite unittest)
    count: 55
    result: "55/55 PASS"
  - name: lite-arena-test
    count: 2
    result: "2/2 PASS"
  - name: check (monolithic `tests`, ~90 test .cc)
    count: 2364
    result: "2364/2364 PASS"

test_package_tests:
  - file: test_protobuf.cpp
    description: "dynamic: descriptor-pool schema + dynamic message binary round-trip with string/int32/bytes/repeated fields via reflection; pool: built-in descriptor lookup + duplicate-registration and unknown-type error paths; arena: arena allocation and serialization; parse_error: truncated/corrupt payload rejection and unknown-field survival"
    command: "ctest --output-on-failure --no-tests=error"
  - file: CMakeLists.txt
    description: "Runs the packaged protobuf::protoc imported executable with --version"
    command: "ctest --output-on-failure --no-tests=error"

assertion_count: 2421
