package: protobuf/21.12
homepage: "https://github.com/protocolbuffers/protobuf"

upstream_check_command: >-
  conan create 阶段内执行上游 ctest（build() 中 ctest --timeout 900
  --output-on-failure）：3 个注册测试目标
  lite-test / lite-arena-test / check（monolithic `tests` 二进制，
  含 core/io/compiler/plugin/util 全部 gtest 用例）；每个目标带
  --gtest_output=xml（protobuf_TEST_XML_OUTDIR）逐用例可数。
upstream_test_in_build: true
upstream_test_reason: >-
  R51 三步法：上游 21.12 无独立 tests/ 目录，测试源为
  src/google/protobuf/ 下 *_unittest.cc/*_test.cc 共 72 个 .cc（由
  cmake/tests.cmake 编译进 tests / lite-test / lite-arena-test 三个
  gtest 二进制）。启用上游自带 protobuf_USE_EXTERNAL_GTEST=ON 路径
  （cmake/tests.cmake: if (protobuf_USE_EXTERNAL_GTEST)
  find_package(GTest REQUIRED)），gtest 由已发布的 googletest/1.12.1
  提供（test_require，GTest::gmock/GTest::gmock_main 组件目标齐全，
  与 3.21 同期版本 API 兼容）。实测全量 2421 用例：通过 2421、失败 0、
  跳过 0（见 notes.md 申报表与测试报告）。
upstream_tests:
  - name: lite-test (google/protobuf lite unittest)
    count: 55
    result: "55/55 PASS"
  - name: lite-arena-test
    count: 2
    result: "2/2 PASS"
  - name: check (monolithic `tests`, ~90 test .cc)
    count: 2364
    result: "2364/2364 PASS"

test_package_tests:
  - file: test_protobuf.cpp
    description: "dynamic: descriptor-pool schema + dynamic message binary round-trip with string/int32/bytes/repeated fields via reflection; pool: built-in descriptor lookup + duplicate-registration and unknown-type error paths; arena: arena allocation and serialization; parse_error: truncated/corrupt payload rejection and unknown-field survival"
    command: "ctest --output-on-failure --no-tests=error"
  - file: CMakeLists.txt
    description: "Runs the packaged protobuf::protoc imported executable with --version"
    command: "ctest --output-on-failure --no-tests=error"
  - file: test_ohos.py
    name: ohos-specific
    description: >-
      R53 鸿蒙特有测试（pure-python stdlib ELF 解析，零外部工具依赖，
      CI worker 无 readelf/objdump）：① libprotobuf.a 为有效 ar 归档且
      含核心对象 arena.cc.obj（≥50 个 ELF 对象成员）② 归档内全部 ELF
      成员为 ELF64 little-endian + e_machine=AArch64(183) ③ bin/protoc
      为 ELF64/AArch64 ④ protoc PT_INTERP=/lib/ld-musl-aarch64.so.1
      ⑤ protoc 含 OpenHarmony .codesign 段 ⑥ protoc 无 DT_RPATH/
      DT_RUNPATH ⑦ protoc --version 实跑输出 libprotoc 3.21.12 ⑧ protoc
      实跑 fixture .proto --cpp_out 生成 .pb.cc/.pb.h 且非空。
    assertion_count: 8
    command: >-
      python3 test_ohos.py --tmp-dir <build>/ohos-specific-test
      <pkg>/bin/protoc <pkg>/lib/libprotobuf.a

ohos_specific_tests:
  - file: test_ohos.py
    name: ohos-specific
    description: >-
      独立 HarmonyOS 断言套件（fail closed，任何解析/执行异常均记为
      失败并非零退出；无静默跳过）。同时检查并真实运行包内产物：
      静态归档 libprotobuf.a（ELF64/AArch64 成员）与可执行 bin/protoc
      （OHOS musl 解释器 / .codesign / 无 RPATH·RUNPATH / --version /
      --cpp_out 代码生成）。
    assertion_count: 8
    command: >-
      python3 test_ohos.py --tmp-dir <build>/ohos-specific-test
      <pkg>/bin/protoc <pkg>/lib/libprotobuf.a

ohos_specific_checkpoints:
  - file: test_ohos.py
    name: ohos-static-archive
    description: "libprotobuf.a 为有效 ar 归档，含 arena.cc.obj 核心对象成员，ELF 对象成员数 ≥50。"
    command: "python3 test_ohos.py <protoc> <libprotobuf.a>"
  - file: test_ohos.py
    name: ohos-archive-members-elf64-aarch64
    description: "纯 python 解析归档内全部 ELF 成员头：EI_CLASS=ELFCLASS64、EI_DATA=ELFDATA2LSB、e_machine=EM_AARCH64(183)。"
    command: "python3 test_ohos.py <protoc> <libprotobuf.a>"
  - file: test_ohos.py
    name: ohos-protoc-elf-identity
    description: "纯 python 解析 bin/protoc ELF 头：ELF64 little-endian、e_machine=EM_AARCH64(183)。"
    command: "python3 test_ohos.py <protoc> <libprotobuf.a>"
  - file: test_ohos.py
    name: ohos-protoc-musl-interpreter
    description: "解析 PT_INTERP：解释器为 OHOS musl 加载器 /lib/ld-musl-aarch64.so.1。"
    command: "python3 test_ohos.py <protoc> <libprotobuf.a>"
  - file: test_ohos.py
    name: ohos-protoc-codesign
    description: "bin/protoc 含 OpenHarmony 签名段 .codesign。"
    command: "python3 test_ohos.py <protoc> <libprotobuf.a>"
  - file: test_ohos.py
    name: ohos-protoc-no-rpath
    description: "解析 PT_DYNAMIC：无 DT_RPATH/DT_RUNPATH 构建树路径泄漏。"
    command: "python3 test_ohos.py <protoc> <libprotobuf.a>"
  - file: test_ohos.py
    name: ohos-protoc-version-exec
    description: "在鸿蒙 PC 上真实执行 bin/protoc --version，断言 rc=0 且输出含 libprotoc 3.21.12。"
    command: "python3 test_ohos.py <protoc> <libprotobuf.a>"
  - file: test_ohos.py
    name: ohos-protoc-codegen-exec
    description: "在鸿蒙 PC 上真实执行 protoc --cpp_out 编译 fixture .proto，断言生成的 .pb.cc/.pb.h 存在、非空且含目标消息。"
    command: "python3 test_ohos.py <protoc> <libprotobuf.a>"

ohos_specific_test_count: 1
ohos_checkpoint_count: 8
ohos_checkpoint_basis:
  static_archive_valid_and_core_member: 1
  archive_members_elf64_lsb_aarch64: 1
  protoc_elf64_lsb_aarch64: 1
  protoc_musl_interpreter: 1
  protoc_codesign_section: 1
  protoc_no_rpath_runpath: 1
  protoc_version_execution: 1
  protoc_cpp_codegen_execution: 1

# 测试断言总数（上游 gtest 2421；test_package 消费者场景 5 项；
# 鸿蒙特有断言 8 项 —— 见上 ohos_checkpoint_basis）
assertion_count: 2421
