knowledge_gained:
  - "protobuf >= 22 headers hard-require C++17 via Abseil; the pre-Abseil 21.12 line keeps public headers C++11-compatible for consumers like OLA"
  - "21.12 CMake installs protobuf.pc/protobuf-lite.pc with absolute prefix; must relocate to ${pcfiledir}/../.. for cache portability"
  - "21.12 cmake/tests.cmake natively supports external GoogleTest (protobuf_USE_EXTERNAL_GTEST -> find_package(GTest REQUIRED)); upstream tests need only a googletest package exposing GTest::gmock/GTest::gmock_main component targets (googletest/1.12.1), no vendored checkout"
  - "protobuf test temp logic (testing/googletest.cc) honours Bazel-style TEST_TMPDIR else falls back to tmpnam()/tmp; OHOS sandbox /tmp is read-only so recipes running upstream tests must export TEST_TMPDIR to a writable dir"
