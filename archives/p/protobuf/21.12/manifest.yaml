software: protobuf
version: '21.12'
status: built
build_date: '2026-09-05'
source:
  url: https://github.com/protocolbuffers/protobuf/archive/refs/tags/v21.12.tar.gz
  sha256: 22fdaf641b31655d4b2297f9981fa5203b2866f8332d3c6333f6b0107bb320de
  tar_format: tar.gz
build:
  system: cmake
  configure_options:
    - -Dprotobuf_BUILD_TESTS=OFF
    - -Dprotobuf_BUILD_CONFORMANCE=OFF
    - -Dprotobuf_BUILD_EXAMPLES=OFF
    - -Dprotobuf_BUILD_PROTOC_BINARIES=ON
    - -Dprotobuf_BUILD_LIBPROTOC=ON
    - -Dprotobuf_WITH_ZLIB=OFF
  dependencies: []
  makedepends: []
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "protobuf >= 22 headers hard-require C++17 via Abseil; the pre-Abseil 21.12 line keeps public headers C++11-compatible for consumers like OLA"
  - "21.12 CMake installs protobuf.pc/protobuf-lite.pc with absolute prefix; must relocate to ${pcfiledir}/../.. for cache portability"
