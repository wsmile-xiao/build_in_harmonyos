software: perl-net-server
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.014-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.014-r2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# Conan 引用
conan_ref: "perl-net-server/2.014-r2"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RH/RHANDOM/Net-Server-2.014.tar.gz"

  # 源码校验和
  sha256: "3406b9ca5a662a0075eed47fb78de1316b601c94f62a0ee34a5544db9baa3720"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 perl Makefile.PL + make 构建，无需 C 编译器"
  - "INSTALL_BASE 参数控制 Perl 模块安装路径，模块安装到 lib/perl5/"
  - "纯 Perl 模块不受 SELinux HMDFS 限制，与 XS 模块（如 perl-dbd-pg）形成对比"
  - "可选依赖（threads/IO::Multiplex/IO::Socket::SSL/Net::SSLeay）缺失不影响核心服务器功能"
