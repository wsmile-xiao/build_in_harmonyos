software: perl-net-server
display: "Net::Server"
description: "Extensible Perl internet server — supports multiple server types (Fork, PreFork, PreForkSimple, HTTP, PSGI, etc.)"
category: network
homepage: "https://metacpan.org/dist/Net-Server"
license: MIT
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C/XS 编译，无平台特异性问题"
    - "使用 perl Makefile.PL + make 构建，INSTALL_BASE 控制安装路径"
    - "所有核心依赖均为 Perl 核心模块，无需额外 Conan 依赖"
    - "可选模块 (Thread, Multiplex, SSL, SSLEAY) 依赖外部 Perl 模块，缺失不影响核心功能"
  common_dependencies:
    - perl

versions:
  "2.014-r2":
    status: published
    build_date: "2026-06-26"
    conan_ref: "perl-net-server/2.014-r2"
