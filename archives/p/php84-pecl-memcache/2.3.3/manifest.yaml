software: php84-pecl-memcache
version: "2.3.3"
status: built
build_date: "2026-08-22"
build_system: phpize

source:
  url: "https://pecl.php.net/get/memcache-8.2.tgz"
  sha256: "b3f0640eacdeb9046c6c86a1546d7fb8a4e9f219e5d9a36a287e59b2dd8208e5"
  tar_format: tar.gz

build:
  configure_options:
    - "--with-php-config=<php_prefix>/bin/php-config"
    - "--with-zlib-dir=<zlib_prefix>"
    - "--disable-memcache-session"
  dependencies:
    - php/8.5.8
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "PHP 8.5 moved smart_string headers from ext/standard/ to Zend/"
  - "phpize prefix replacement sed breaks when prefix contains '/' - use cp instead"
  - "config.status umask 077 creates drwx--S--- on HMDFS which prevents file writes"
  - "zlib static library without -fPIC cannot be linked into shared PHP extension"
