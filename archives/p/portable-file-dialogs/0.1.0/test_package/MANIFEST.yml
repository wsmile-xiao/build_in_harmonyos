# test_package/MANIFEST.yml — portable-file-dialogs 0.1.0
# CI L0e requires this file to exist.

package: portable-file-dialogs/0.1.0
homepage: "https://github.com/samhocevar/portable-file-dialogs"

# portable-file-dialogs 0.1.0 ships no test suite: the tarball has only the
# header, CMakeLists (INTERFACE target), examples and doc (verified against
# the 0.1.0 tag). Header-only project, nothing to run upstream.
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the tarball
upstream_tests: []

# test_package tests (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "Compiles a consumer program against the installed header (clang++ -std=c++11) and runs it; the program includes portable-file-dialogs.h and exercises the public API (settings::verbose, settings::rescan, pfd::choice enum, pfd::message completeness)"
    command: "bash test.sh"

# compile + run assertion groups
assertion_count: 2
