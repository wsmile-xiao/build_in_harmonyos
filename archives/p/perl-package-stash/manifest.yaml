# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-package-stash

# 软件描述
description: "Routines for manipulating stashes (Package::Stash CPAN module)"

# 分类
category: perl

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "0.40-r1"
    status: built
    build_date: "2026-07-02"
    path: archives/p/perl-package-stash/0.40-r1

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/dist/Package-Stash

# 源码仓库
repository: https://github.com/moose/Package-Stash

# 许可证
license: perl

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl
  - perl-module-implementation
  - perl-dist-checkconflicts

# 编译依赖
build_dependencies:
  - perl (5.42.0+)
  - perl-module-implementation (>= 0.06)
  - perl-dist-checkconflicts (>= 0.02)
