software: perl-package-stash
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.40-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.40-r1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/Package-Stash-0.40.tar.gz"

  # 源码校验和
  sha256: "5a9722c6d9cb29ee133e5f7b08a5362762a0b5633ff5170642a5b0686e95e066"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-module-implementation/0.09"
    - "perl-dist-checkconflicts/0.11"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 平台 XS .so 因 SELinux HMDFS 限制无法从用户目录加载，PP 实现是完整功能替代"
  - "Perl Makefile.PL 构建时 INSTALL_BASE 必须在 Makefile.PL 阶段设置，不能在 make install 阶段设置"
  - "纯 Perl 模块使用 --pureperl-only 标志跳过 XS 编译检查，避免 sys/types.h not found 错误 (E190)"
  - "Perl ExtUtils::MakeMaker 构建系统适配: perl Makefile.PL -> make -> make install"
  - "Package::Stash PP 实现通过全部 268 项 CPAN 测试，功能与 XS 实现完全等价"
