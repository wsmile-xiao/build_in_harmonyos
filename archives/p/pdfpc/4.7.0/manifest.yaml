software: pdfpc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.7.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.7.0"

# 编译状态
# published | built | failed | archived
status: built

build_system: cmake

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-27"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://download.savannah.nongnu.org/releases/pdfpc/pdfpc-4.7.0.tar.gz"

  # 源码校验和
  sha256: "0083a958a2e9288a15c31aabb76b3eadf104672b4e815017f31ffa0d87db02ec"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=$DEFAULT_PREFIX"
    - "-DMOVIES=OFF"
    - "-DMDVIEW=OFF"
    - "-DREST=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0
    - gtk+3/3.24.43
    - cairo/1.18.4
    - pango/1.50.14
    - json-glib/1.10.1
    - poppler-glib/23.12.0
    - vala/0.56.18
    - libgee/0.20.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained: []
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
