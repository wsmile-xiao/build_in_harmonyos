version: "1.10"
software: proxsmtp
status: built
build_date: "2026-09-26"
build_system: autotools
source:
  url: "http://thewalter.net/stef/software/proxsmtp/proxsmtp-1.10.tar.gz"
  sha256: "33b13cb4cbbebd784768893404c992d6cc2e8d057c27c012e3a69f24ac60c4b5"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-ohos"
    - "--host=aarch64-unknown-ohos"
    - "--disable-capabilities"
    - "--enable-tproxy"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
  - "patches/0001-terminate-full-line-within-buffer.patch"
  - "patches/0002-log-pointer-thread-id-with-p.patch"
knowledge_gained:
  - "上游 2009 年 config.sub 无法识别 AArch64/HarmonyOS，需使用新版 GNU config.sub"
  - "所测鸿蒙 PC 缺少 libcap，需禁用 capabilities；IP_TRANSPARENT 可编译，但特权透明代理运行未验证"
  - "上游满行终止符越过固定缓冲区边界一字节，需修复并保留诊断"
  - "目标机 pthread_t 为指针，上游以 %x/ int 记录会截断线程标识"
