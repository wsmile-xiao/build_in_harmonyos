software: proxsmtp
display: ProxSMTP
description: "可在转发前过滤邮件的 SMTP 代理程序"
category: tool
homepage: "http://thewalter.net/stef/software/proxsmtp/"
license: BSD-3-Clause
build_system: autotools
ohos_adaptation:
  key_points:
    - "替换过旧的 GNU config.sub，使 configure 识别 aarch64-unknown-ohos"
    - "目标机缺少 libcap，禁用 capabilities；保留 IP_TRANSPARENT 编译，特权运行模式未验证"
    - "修复满行缓冲区终止符的一字节越界写入"
    - "修复 pthread_t 在目标机为指针时的日志格式截断"
  common_dependencies: []
versions:
  "1.10":
    status: built
    build_date: 2026-09-26
