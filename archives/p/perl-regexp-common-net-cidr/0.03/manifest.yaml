software: perl-regexp-common-net-cidr
version: "0.03"
status: published
build_date: "2026-06-26"

source:
  url: "https://cpan.metacpan.org/authors/id/B/BP/BPS/Regexp-Common-net-CIDR-0.03.tar.gz"
  sha256: "39606a57aab20d4f4468300f2ec3fa2ab557fcc9cb7880ec7c6e07d80162da33"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"
  dependencies:
    - "perl-regexp-common/2024080801"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Pure Perl module using ExtUtils::MakeMaker (replacement for Module::Install)"
  - "Original Makefile.PL uses inc::Module::Install which triggers auto-install in isolated environments — replaced with standard ExtUtils::MakeMaker"
  - "Requires Regexp::Common as runtime dependency, declared via Conan requirements()"
  - "No tests defined in the distribution — functional tests via test_package"
  - "Supports IPv4 CIDR patterns including abbreviated forms (10.0/8), minimum 2 octets required"
  - "-keep option captures address in $1 and prefix length in $2"
