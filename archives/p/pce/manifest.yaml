software: pce
display: "PCE"
description: "Collection of microcomputer emulators (IBM PC, Mac Plus, RC759 and simulators)"
category: system
homepage: "http://www.hampa.ch/pce/"
license: GPL-2.0-only
build_system: autotools

ohos_adaptation:
  key_points:
    - "Autotools 原生构建，关闭 X11/SDL/readline/tun/OSS，做到零 Conan 依赖"
    - "用标准 aarch64-unknown-linux-gnu triplet 兼容 2013 版 config.sub，无需补丁"
    - "e68000 目标需 -fcommon，否则 clang 15 报 multiple definition"
  common_dependencies: []

versions:
  "0.2.2":
    status: built
    build_date: "2026-09-15"
    conan_ref: "pce/0.2.2"
