software: perl-encode-jis2k
display: "Encode::JIS2K"
description: "Perl XS 扩展，提供 JIS X 0212 和 JIS X 0213 编码支持"
category: data
homepage: "https://metacpan.org/pod/Encode::JIS2K"
license: Artistic-1.0-Perl OR GPL-1.0-or-later
build_system: perl_xs

ohos_adaptation:
  key_points:
    - "Perl XS 扩展需要修改 Makefile 添加 Ohos SDK sysroot 路径"
    - "CCFLAGS 需添加 -I/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/include"
    - "LDDLFLAGS 需添加 -nostartfiles 和 LLVM lib 路径"
    - "共享库需要 ELF 签名才能加载"
  common_dependencies:
    - perl
    - Encode

versions:
  "0.05-r2":
    status: built
    build_date: "2026-06-11"