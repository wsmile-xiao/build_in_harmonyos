# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-encode-jis2k/0.05-r2
homepage: "https://metacpan.org/dist/Encode-JIS2K"

# 上游测试命令
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
# Note: make test requires loading JIS2K.so which needs ELF signature + hnp_file SELinux context
# On CI buildbot (non-device), make test runs successfully (19 tests)
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/JIS2K.t
    source: Encode-JIS2K-0.05/t/JIS2K.t
    description: "Perl test suite for Encode::JIS2K (19 subtests: encoding/decoding JIS X 0212/0213)"
    command: "make test"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_package.py
    description: "Verifies JIS2K.so is valid ELF and JIS2K.pm contains version 0.05"
    command: "python3 test_package.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 19
