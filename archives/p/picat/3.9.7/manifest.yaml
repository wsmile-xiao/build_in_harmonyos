software: picat
build_system: makefile
version: "3.9.7"
status: published
build_date: "2026-06-11"

source:
  url: "https://picat-lang.org/download/picat397_src.tar.gz"
  sha256: "517d9c91ad2aa5f4d8052e4daa0bf21fe967278ec054d7eeb0f4f92db9edd250"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "make -f Makefile.ohos"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-emu-file.c.patch"
  - "0002-emu-Makefile.ohos.patch"

knowledge_gained:
  - "musl libc 不暴露 struct _IO_FILE 内部字段，需用 fileno() 替代 f->_fileno"
  - "picat 使用自定义 Makefile（Makefile.linux64），需创建 Makefile.ohos 适配 clang/OpenHarmony"
  - "picat 的 -DGCC 宏启用 computed goto 等 GCC 扩展，clang 兼容这些扩展，应保留"