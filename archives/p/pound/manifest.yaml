software: pound
# 软件级 manifest 模板
# 文件位置: archives/p/pound/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（显示名）
display_name: "Pound"

# 软件描述（一句话）
description: "轻量级HTTP/HTTPS反向代理和负载均衡器"

# 主分类
# shell | network | dev | system | editor | utils | ssl | database | multimedia
category: network

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "4.22"
    status: published
    date: "2026-05-21"
    notes: "所有质量门禁通过，功能验证成功"

# ============================================================
# 软件级元数据
# ============================================================

# 主页 URL
homepage: "https://www.apsis.ch/pound"

# 许可证
license: "GPL-3.0"

# 语言
language: "C"

# 构建系统
build_system: "autotools"

# 功能特性
features:
  - "HTTP/HTTPS反向代理"
  - "负载均衡"
  - "SSL/TLS终止"
  - "请求路由"
  - "健康检查"