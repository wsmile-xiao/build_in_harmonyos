# test_package/MANIFEST.yml
package: pound/4.22
homepage: "https://www.apsis.ch/pound"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/tmplrun.c
    source: pound-4.22/tests/tmplrun.c
    description: "Template runner test from upstream test suite"
    command: "./tmplrun"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "Verify pound binary is installed and is a valid ELF"
    command: "file sbin/pound"

# 测试断言总数
assertion_count: 2
