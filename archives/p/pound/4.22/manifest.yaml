software: pound
version: "4.22"
status: built
build_date: "2026-08-18"
build_system: autotools

source:
  url: "https://github.com/graygnuorg/pound/releases/download/v4.22/pound-4.22.tar.gz"
  sha256: "aba3aa86223f67b0f9b950688e48be3511b517607534bea25b537049adb971d0"
  tar_format: tar.gz

configure_options:
  - "--disable-lua"
dependencies:
  - openssl/1.1.1w
  - pcre2/10.45
cc: clang
cxx: clang++

patches_applied:
  - "0001-openharmony-pthread-cancel.patch (cooperative dispatcher shutdown: sig_atomic_t flag + 500ms poll timeout + join)"
  - "0002-openharmony-tmpdir-fix.patch (TMPDIR + umask 022 for configure temp dirs on HMDFS)"
knowledge_gained:
  - "pthread_cancel not available on OpenHarmony musl; use cooperative shutdown (volatile sig_atomic_t flag + finite poll timeout + join)"
  - "umask 077 creates dirs with setgid-without-execute on HMDFS, use umask 022 + TMPDIR"
  - "pcre2-config from conan package returns wrong .la paths; generate a wrapper returning conan cache paths and prepend to PATH"
