sources:
  url: "https://github.com/graygnuorg/pound/releases/download/v4.22/pound-4.22.tar.gz"
  sha256: "aba3aa86223f67b0f9b950688e48be3511b517607534bea25b537049adb971d0"

patches:
  - patch_file: "patches/0001-openharmony-pthread-cancel.patch"
    patch_description: "Cooperative dispatcher shutdown on OpenHarmony: musl libc has no pthread_cancel, so replace cancel+join with a volatile sig_atomic_t flag checked by the dispatcher poll loop (500 ms timeout) plus pthread_join"
    patch_type: "portability"
  - patch_file: "patches/0002-openharmony-tmpdir-fix.patch"
    patch_description: "Use TMPDIR for config.status temp dir (HMDFS mktemp dirs have setuid attr making them unwritable)"
    patch_type: "portability"
  - patch_file: "patches/0003-openharmony-config-guess.patch"
    patch_description: "Teach build-aux config.guess/config.sub about HarmonyOS (uname -s = HarmonyOS) so configure detects aarch64-unknown-linux-ohos without --build/--host flags (E007/E160)"
    patch_type: "portability"
