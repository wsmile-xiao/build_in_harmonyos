# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 与 conan-verify G1 强制要求）
package: pscan/1.3
homepage: "http://deployingradius.com/pscan/"

# 上游无测试套件(README 自述:约 100 行 C 的小工具,无 autoconf/测试);
# 自带 test.c 为故意标注 good/bad 的演示输入、wu-ftpd.pscan 为历史样例
# 输出(需 wu-ftpd 源码,不可复现)。验证由 test_package 消费者测试承担:
# 以上游自带 test.c 为扫描输入,断言两处 problematic 用例(test.c:64/75)
# 被检出、干净文件零告警(jpnevulator 0/0 申报先例)。
upstream_check_command: "上游无测试套件;消费者测试扫描上游自带 test.c 断言检出行为"
upstream_test_in_build: false
upstream_test_command: "上游 0/0;消费者测试 2/2(检出断言 + 零告警断言)"

upstream_tests: []

# test_package 中自带的测试（消费者视角验证交付产物本身）
test_package_tests:
  - file: test_package/test_pscan_cli.sh
    description: >-
      CLI 消费者测试（2 项断言）：扫描上游自带 test.c 检出 test.c:64/75
      两处格式串问题（1）；干净文件零告警（2）。上游 test.c 随包交付。
