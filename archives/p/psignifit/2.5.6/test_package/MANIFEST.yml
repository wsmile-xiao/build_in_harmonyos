# test_package/MANIFEST.yml — psignifit 2.5.6
# CI L0e 要求本文件存在且非空。

package: psignifit/2.5.6
homepage: "https://uni-tuebingen.de/fakultaeten/mathematisch-naturwissenschaftliche-fakultaet/fachbereiche/informatik/lehrstuehle/neuronale-informationsverarbeitung/research/software/psignifit-legacy/"

# 上游无 `make check` / 测试框架（psig-src/Makefile 无 check 目标、无 TESTS 注册）；
# 唯一上游测试入口是引擎内嵌自检 `psignifit -t`（内嵌 8×3 数据 + 4 金值判据 + IEEE 行为组）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: "psignifit -t"

upstream_tests:
  - file: "psig-src/psignifit.c :: SelfTest()"
    description: "引擎内嵌自检：内嵌 8×3 数据拟合 Weibull，4 参数金值相对误差 ≤0.1% + TestFloatingPointBehaviour IEEE 行为组，rc=EXIT_SUCCESS 当且仅当 floatOK && accurate"
    command: "psignifit -t"
    assertions: 5

# test_package 测试（消费者视角，不计入上游分母）
test_package_tests:
  - file: test.sh
    description: "14 断言：--version/--help 冒烟；`-t` 4 金值与成功标记（含非 tty stdin 形态与 isatty 短路形态）；文件输入面与 Debian run-unit-test 同形管道输入面（aarch64 signed char 修复验证）"
    command: "bash test.sh"

assertion_count: 14
