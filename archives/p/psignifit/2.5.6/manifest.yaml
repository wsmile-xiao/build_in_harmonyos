knowledge_gained:
  - "aarch64 plain char 为 unsigned：fgetc 返回值存入 char 后与 EOF(-1) 永不相等，输入流被无限读入直到 8192B 上限，报 input stream is too big（Debian #975467 / arm64.patch 同款，signed char 修复）"  # knowledge_ref: DRAFT-E713
  - "上游仅内置 -t 自检、无 --version/--help：顶层选项由包内补丁补上以过 Conan L2 冒烟门禁（先例 aa3d / backlog #95）"  # knowledge_ref: DRAFT-E713
  - "手写 Makefile 字面量 CC=gcc、OUTDIR=~/bin、LDFLAGS 不带 -lm：make 调用行一次性钉死 CC/LD/CFLAGS/CXXFLAGS/CYGFLAG/DBFLAG/LDFLAGS/OUTDIR（R33 + 先例4 双钉），并做 rc=0 产物存在性核对"  # knowledge_ref: DRAFT-E714
  - "psignifit -t 自检判据在 isatty(0) stdin 装载分支之前由 doSelfTest 短路，非 tty 沙箱/CI 下照常执行；4 金值容差为相对误差 0.1%（psig-src/psignifit.c SelfTest）"  # knowledge_ref: DRAFT-E713

patch_generation:
