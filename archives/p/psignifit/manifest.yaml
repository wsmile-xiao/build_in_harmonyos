# 软件级 manifest — psignifit
# 遵循 ARCHIVE-SPEC v3.0

software: psignifit
display: "psignifit"
description: "心理物理函数拟合与假设检验命令行引擎（2.x 遗留版，纯 C 零依赖）"
category: data
homepage: "https://uni-tuebingen.de/fakultaeten/mathematisch-naturwissenschaftliche-fakultaet/fachbereiche/informatik/lehrstuehle/neuronale-informationsverarbeitung/research/software/psignifit-legacy/"
license: GPL-2.0-or-later
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "源码内手写 psig-src/Makefile：CC/LD 写死 gcc、OUTDIR=~/bin、LDFLAGS 不带 -lm —— 全部在 make 调用行钉死（R33 + 先例4 双钉）"
    - "aarch64 plain char 为 unsigned：fgetc/EOF 判据失效使文件输入面报 input stream is too big（Debian #975467/arm64.patch 同款 signed char 修复）"
    - "上游无 --version/--help，Conan L2 冒烟需要包内补丁加顶层选项（先例 aa3d）"
    - "唯一上游测试入口 psignifit -t：内嵌数据 + 4 金值（相对误差 ≤0.1%），且在 isatty(0) stdin 装载判定之前由 doSelfTest 短路执行"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.5.6":
    status: built
    build_date: "2026-09-24"
