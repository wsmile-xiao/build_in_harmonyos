# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pidcat/2.1.0
homepage: "https://github.com/JakeWharton/pidcat"

# pidcat is a pure Python script — no upstream C/C++ test suite
upstream_check_command: "N/A (Python script, no build system)"
upstream_test_in_build: false
upstream_test_command: ""

# pidcat has no upstream C/C++ tests (single Python script)
upstream_tests: []

# test_package smoke test (consumer perspective)
test_package_tests:
  - file: test.sh
    description: "pidcat --version smoke test"
    command: "bash test.sh"

assertion_count: 1
