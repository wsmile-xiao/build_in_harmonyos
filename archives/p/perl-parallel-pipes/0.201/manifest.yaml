software: perl-parallel-pipes
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.201/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.201"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-06"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "http://cpan.metacpan.org/authors/id/S/SK/SKAJI/Parallel-Pipes-0.201.tar.gz"

  # 源码校验和
  sha256: "b73cbdd4202b29eab97e0c08dcd59d9273633610e8721cf449078656bd591a7c"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: perl

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器（纯 Perl 模块，无需 C 编译器）
  cc: ""
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 Module::Build::Tiny (Build.PL) 构建时，conanfile.py 中 layout() 应使用 pass 而非 basic_layout，避免 conan 创建的 build/ 目录与 Build 脚本在大小写不敏感文件系统上冲突"
  - "Parallel::Pipes 安装两个 .pm 文件: Parallel/Pipes.pm 和 Parallel/Pipes/App.pm"
  - "CI worker 上未安装 Module::Build::Tiny，需改用 ExtUtils::MakeMaker (Makefile.PL) 作为回退构建系统，参照 perl-readonly/perl-proc-forksafe 模式"
