# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-parallel-pipes/0.201
homepage: "https://github.com/skaji/Parallel-Pipes"

# 上游测试命令 (Module::Build::Tiny: ./Build test)
upstream_check_command: "./Build test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "./Build test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00_use.t
    source: perl-parallel-pipes-0.201/t/00_use.t
    description: "Module load test"
    command: "perl t/00_use.t"
  - file: t/01_basic.t
    source: perl-parallel-pipes-0.201/t/01_basic.t
    description: "Basic parallel processing test"
    command: "perl t/01_basic.t"
  - file: t/02_big.t
    source: perl-parallel-pipes-0.201/t/02_big.t
    description: "Big data parallel processing test"
    command: "perl t/02_big.t"
  - file: t/03_app.t
    source: perl-parallel-pipes-0.201/t/03_app.t
    description: "App interface test"
    command: "perl t/03_app.t"
  - file: t/04_idle.t
    source: perl-parallel-pipes-0.201/t/04_idle.t
    description: "Idle state test"
    command: "perl t/04_idle.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pipes.sh
    description: "Consumer test: load Parallel::Pipes and Parallel::Pipes::App, create instance"
    command: "sh test_pipes.sh"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 46
