# test_package/MANIFEST.yml
#
# pigeonhole 2.4.4 — OHOS 适配验证清单
#
# 验证方式：
#   - conanfile build() 执行 `make check -k`（上游测试：lib-sieve/util 的
#     test-edit-mail / test-rfc2822 / test-urn 三个 test 程序）
#   - test_package 消费者冒烟（链接 libdovecot-sieve.a + 头文件包含性）
#
# 上游测试（lib-sieve/util，3 个 test 程序）：
#   - 需链接 libdovecot 静态库并在沙箱运行；若沙箱运行时受限（socket/0700
#     等 dovecot 同款限制），归入 expected_fails 口径
#
# 消费者冒烟断言（test_pigeonhole.c）：
#   1. sieve/sieve-common.h + sieve/sieve.h 可包含（-DHAVE_CONFIG_H）
#   2. libdovecot-sieve.a 可链接（依赖链 libdovecot-storage + libdovecot
#      + openssl + zlib 完整；mail_get_* 等符号在 libdovecot-storage，
#      CI #63654 undefined symbol 根因）
#   3. SIEVE_MAX_NUMBER 常量存在（sieve-common.h 核心宏；上游
#      SIEVE_VERSION_MAJOR 未定义在公共头，CI #59648 报 undeclared）
#   4. 真实引用库内符号 sieve_close（sieve.h 公共 API，src/lib-sieve/sieve.c），
#      强制链接器按需抽取 .a 对象，验证静态库非零引用可链接
