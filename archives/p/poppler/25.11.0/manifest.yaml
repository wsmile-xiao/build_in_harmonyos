software: poppler
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/25.11.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "25.11.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-05-26"

# 构建系统类型（必填）
# cmake | autotools | makefile | meson | custom
build_system: cmake

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://poppler.freedesktop.org/poppler-25.11.0.tar.xz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: cmake

  # 配置选项列表
  configure_options:
    - "-DCMAKE_INSTALL_PREFIX=/storage/Users/currentUser/usr/local"
    - "-DCMAKE_PREFIX_PATH=/storage/Users/currentUser/usr/local"
    - "-DIconv_INCLUDE_DIR=/storage/Users/currentUser/usr/local/include"
    - "-DIconv_LIBRARY=/storage/Users/currentUser/usr/local/lib/libiconv.so"
    - "-DENABLE_NSS3=OFF"
    - "-DENABLE_GPGME=OFF"
    - "-DENABLE_BOOST=OFF"
    - "-DENABLE_GLIB=OFF"
    - "-DENABLE_QT5=OFF"
    - "-DENABLE_QT6=OFF"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "freetype2/26.1.20"
    - "fontconfig/2.16.0"
    - "zlib/1.3.1"
    - "libopenjp2/2.5.2"
    - "libjpeg/2.1.5.1"
    - "lcms2/2.19"
    - "libcurl/8.19.0"
    - "libtiff/4.7.1"
    - "libpng/1.6.39"
    - "libiconv/1.17"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-cpp-poppler-document.cpp.patch"
  - "0002-cpp-poppler-image.cpp.patch"
  - "0003-fofi-FoFiTrueType.cc.patch"
  - "0004-poppler-Annot.cc.patch"
  - "0005-poppler-CIDFontsWidthsBuilder.h.patch"
  - "0006-poppler-Catalog.cc.patch"
  - "0007-poppler-Dict.cc.patch"
  - "0008-poppler-Gfx.cc.patch"
  - "0009-poppler-GfxFont.cc.patch"
  - "0010-poppler-GlobalParams.cc.patch"
  - "0011-poppler-PDFDoc.cc.patch"
  - "0012-poppler-TextOutputDev.cc.patch"
  - "0013-splash-SplashClip.cc.patch"
  - "0014-splash-SplashFontEngine.cc.patch"
  - "0015-splash-SplashXPathScanner.cc.patch"
  - "0016-utils-pdfsig.cc.patch"
  - "0017-utils-printencodings.cc.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "poppler 25.11.0 强制要求 C++20，使用大量 std::ranges 特性"
  - "Clang 15 对 C++20 ranges 支持有限，需替换为传统 std:: 算法"
  - "cmake 的 FindIconv 模块需要显式指定路径（缺少 .pc 文件）"
  - "std::ranges::sort → std::sort(container.begin(), container.end())"
  - "std::ranges::find → std::find(container.begin(), container.end())"
  - "std::ranges::reverse_view → 使用 rbegin()/rend()"
  - "C 数组不能调用 .begin()/.end()，需使用 std::begin/std::end"