# Poppler 软件级 manifest
# 文件位置: archives/p/poppler/manifest.yaml

software: poppler
description: PDF 渲染库，基于 xpdf
category: library

# 构建系统（通用）
build_system: cmake

# 官网和源码
homepage: https://poppler.freedesktop.org/
source_url: https://poppler.freedesktop.org/releases.html

# 核心依赖
dependencies:
  - freetype2
  - fontconfig
  - libjpeg
  - libpng
  - libtiff
  - libopenjpeg2
  - lcms2
  - zlib
  - curl

# 版本索引
versions:
  - version: "24.03.0"
    status: published
    build_date: "2026-05-26"
    cpp_standard: C++17
    
  - version: "25.11.0"
    status: built
    build_date: "2026-05-26"
    cpp_standard: C++20
    patches: 17
    notes: std::ranges 兼容性补丁