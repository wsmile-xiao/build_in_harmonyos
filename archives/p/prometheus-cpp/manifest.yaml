software: prometheus-cpp
display: "prometheus-cpp"
description: "C++ library for Prometheus metrics"
category: network
homepage: "https://github.com/jupp0r/prometheus-cpp"
license: Apache-2.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "必须静态编译（BUILD_SHARED_LIBS=OFF），OpenHarmony不支持RUNPATH加载共享库"
    - "需要设置 CMAKE_SYSTEM_NAME=Linux 绕过cmake平台检测"
    - "Push模块依赖curl，Compression依赖zlib；若不可用则需禁用（ENABLE_PUSH=OFF, ENABLE_COMPRESSION=OFF）"
    - "init-build可能误识别构建系统为autotools，需手动修正为cmake"
  common_dependencies: []

versions:
  "1.3.0":
    status: published
    build_date: "2026-06-02"
