version: "0.0.8"
software: "plutosvg"
status: built
build_date: "2026-09-13"
build_system: "cmake"
license: "MIT"
conan_ref: "plutosvg/0.0.8"

source:
  url: "https://github.com/sammycage/plutosvg/archive/refs/tags/v0.0.8.tar.gz"
  sha256: "49d5cfe772d3aa10cd4879f2f6e189f5083c08e4c8ea01bf3d5b87c97dfca7d2"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "BUILD_SHARED_LIBS=OFF (default_options shared=False)"
    - "PLUTOSVG_BUILD_EXAMPLES=OFF"
    - "PLUTOSVG_ENABLE_FREETYPE=OFF"
    - "PLUTOVG_BUILD_EXAMPLES=OFF (vendored plutovg)"
  dependencies: []
  cc: clang
  cxx: clang++
  profile: "ci/conan/profiles/ohos-aarch64"

patches_applied: []

tests:
  upstream: "no_tests (upstream 0.0.8 ships no tests/, no ctest, no check target; audit in test_package/MANIFEST.yml)"
  test_package: "test.c (17 content-level checks over the real plutosvg/plutovg API via ctest)"

knowledge_gained:
  - "Upstream 0.0.8 is a dependency-free CMake library except for plutovg, which arrives as an empty-submodule pointer; the GitHub archive omits it, so the recipe vendors the official plutovg 1.3.3 tarball into plutovg/ for add_subdirectory fallback (ableton-link asio precedent)."
  - "plutosvgConfig.cmake runs find_dependency(plutovg); the vendored build installs both plutovg and plutosvg configs into one package prefix, so consumers resolve both from a single requirement."
  - "Headers install to include/plutosvg and include/plutovg; package_info() exposes both plus include for compatibility with upstream <plutosvg.h> and <plutovg.h> spellings."
  - "Static builds need PLUTOSVG_BUILD_STATIC and PLUTOVG_BUILD_STATIC defines; shared/static is driven by one `shared` option via BUILD_SHARED_LIBS."
