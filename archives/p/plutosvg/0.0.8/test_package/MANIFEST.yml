# test_package/MANIFEST.yml — plutosvg 0.0.8 上游测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 上游无测试套件：显式审计（upstream_tests_exist: false + 非空 upstream_test_audit）

package: plutosvg/0.0.8
homepage: "https://github.com/sammycage/plutosvg"

upstream_check_command: null
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests: []
upstream_tests_exist: false
upstream_test_audit:
  - path: "plutosvg-0.0.8.tar.gz（GitHub 官方 v0.0.8 发布包，sha256=49d5cfe772d3aa10cd4879f2f6e189f5083c08e4c8ea01bf3d5b87c97dfca7d2）"
    finding: "顶层仅 source/、examples/、cmake/、subprojects/、meson.build、CMakeLists.txt 等构建文件；无 tests/、test/ 目录，无任何 *test* 源文件（大小写不敏感全包搜索）"
  - path: "CMakeLists.txt（v0.0.8）"
    finding: "仅定义 plutosvg 库目标、plutosvgConfig 安装与 PLUTOSVG_BUILD_EXAMPLES 示例开关；无 enable_testing()、add_test()、ctest 接线，无 check 目标"
  - path: "meson.build / examples/meson.build（v0.0.8）"
    finding: "仅定义 plutosvg library() 与 2-3 个示例可执行文件（svg2png/camera2png，freetype 开启时加 emoji2png）；无 test() 声明，无 meson test 入口"
  - path: "examples/（svg2png.c、camera2png.c、emoji2png.c、camera.svg）"
    finding: "3 个演示程序均为手工运行的渲染演示（加载 SVG、渲染、写 PNG），无断言 harness、无 PASS/FAIL 判定、无与预期输出的比对逻辑，不构成测试套件"
  - path: "Conan Center plutosvg/all（conanfile.py，Meson 构建）"
    finding: "佐证：官方社区配方同样以 examples=disabled、tests=disabled 构建，未接入任何上游测试；Nixpkgs 与 BLFS 亦仅构建安装，无测试执行"
  - path: "subprojects/ 与 .gitmodules"
    finding: "仅含 plutovg 子模块指针（构建依赖），无测试框架子模块（无 gtest/catch2/pytest 引入）"

test_package_tests:
  - file: test.c
    description: "消费者功能测试：真实调用库 API 完成 17 项内容级验证——版本号与版本字符串、内存 SVG 加载、宽高几何、文档 extents、surface 渲染与尺寸、像素内容（中心已绘制）、canvas 路径渲染、PNG 写出与文件头魔数校验（R34 合规）"
    command: "ctest --output-on-failure -R test_plutosvg"

assertion_count: 17
