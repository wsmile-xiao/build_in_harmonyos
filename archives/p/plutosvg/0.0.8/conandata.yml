# conandata.yml — plutosvg 0.0.8
# Single source of truth for source URLs + SHA256.
# plutovg is vendored because the GitHub plutosvg archive ships an empty
# plutovg submodule; upstream CMake falls back to add_subdirectory(plutovg).
#
# NOTE (download-reliability exception): both archives are GitHub-hosted
# and the preflight worker repeatedly hits ConnectTimeoutError on
# github.com inside source() (three consecutive 30s timeouts, 2026-09-12).
# Per the task rules this exception requires url as an ordered list that
# reuses the exact mapping ci/conan/build_and_test.sh applies automatically
# to GitHub sources: gh-proxy.com mirror first, official URL last as
# fallback. Conan 2 tries list entries in order. sha256 values are
# unchanged (the proxy serves the byte-identical archive). The CI rewrite
# step only touches single-value urls, so this list passes through
# untouched, and L0j normalizes mirror prefixes when comparing revisions.

sources:
  url:
    - "https://gh-proxy.com/https://github.com/sammycage/plutosvg/archive/refs/tags/v0.0.8.tar.gz"
    - "https://github.com/sammycage/plutosvg/archive/refs/tags/v0.0.8.tar.gz"
  sha256: "49d5cfe772d3aa10cd4879f2f6e189f5083c08e4c8ea01bf3d5b87c97dfca7d2"

plutovg:
  url:
    - "https://gh-proxy.com/https://github.com/sammycage/plutovg/archive/refs/tags/v1.3.3.tar.gz"
    - "https://github.com/sammycage/plutovg/archive/refs/tags/v1.3.3.tar.gz"
  sha256: "2b0d17a6e016f47b86f9c00e2cb82600041b1ea1f7d2a00c2d46ae542cbfed3c"
