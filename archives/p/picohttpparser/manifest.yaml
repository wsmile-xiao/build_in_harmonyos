software: picohttpparser
display: "picohttpparser"
description: "极简 HTTP 请求/响应解析库；单文件 C 实现，零外部依赖"
category: network
homepage: "https://github.com/h2o/picohttpparser"
license: MIT
build_system: custom

ohos_adaptation:
  key_points:
    - "上游没有库本体的构建系统：Makefile 只有 test 目标（test-bin + prove -v），因此配方直接用 Conan conf 提供的 clang / llvm-ar 编译单一翻译单元（R33，不依赖裸 shell 变量）"
    - "上游测试依赖 picotest 测试框架，它是 .gitmodules 声明的子模块；GitHub 源码 tarball 不含子模块内容（picotest/ 为空目录），因此 conandata.yml 用第二个 source 从 h2o/picotest 的钉定 commit 获取，保证可复现"
    - "build() 内按上游 Makefile 的编译方式构建 test-bin（-Wall -fsanitize=address,undefined）并直接执行；picotest 的 done_testing() 返回失败数，等价于上游的 prove 判定"
    - "OHOS 上运行 ELF 测试二进制经 bash 包装（/system/bin/sh 可能无法直接 exec），与 zlib 配方同款做法"
    - "本库无系统同名库（不存在 /lib/libpicohttpparser.so），不触发 R26 静态约束；沿用 1.2 的纯静态打包形态，保持下游 lib 名解析一致"
  common_dependencies: []

versions:
  "1.2":
    status: archived
    build_date: "2026-08-29"
    note: "已被 1.4 取代（superseded by 1.4）；早期模板产物，manifest/notes 含未替换占位符且未集成上游测试。制品仓保留 picohttpparser/1.2 配方供历史消费者引用。注：1.2 版本级 manifest.yaml 为历史模板产物，其 status/sha256/build_system 字段未回填（与本次未改动的历史文件保持一致），本软件级声明为状态事实源"
  "1.4":
    status: built
    build_date: "2026-10-11"
    conan_ref: "picohttpparser/1.4"
    supersedes: "1.2"
    changes: "上游 1.2 → 1.4 公共 API 与测试用例完全不变：头文件仅有版本宏更新（PICOHTTPPARSER_VERSION 1.2→1.4、MINOR 2→4），实现 10 行改动（likely/unlikely 宏加 #ifndef 守卫、chunked 开销阈值 100*1024 写法归一为 102400），test.c 逐字节未变；本次同时把配方升级到现行规范——build() 内集成上游 TAP 测试套件（299 条断言实测全通过）、补齐 test_package（35 项消费者 API 断言）、补建软件级 manifest 与 README"
