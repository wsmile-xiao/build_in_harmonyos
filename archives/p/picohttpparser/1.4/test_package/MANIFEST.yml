# test_package/MANIFEST.yml
# 上游官方测试声明文件 — CI 门禁 L0e 强制要求（docs/TEST_QUALITY_SPEC.md）
#
# 清点方式（R51 第一步，实测非推断）：
#   1. 上游 Makefile 只有 test 目标：`test-bin: picohttpparser.c picotest/picotest.c test.c`
#      随后 `env UBSAN_OPTIONS=... prove -v ./test-bin`
#   2. 实测 `make test`（prove 方式）与直接执行 test-bin 结果一致：
#      TAP 计划 1..8，299 条 ok，0 条 not ok，退出码 0

package: picohttpparser/1.4
homepage: https://github.com/h2o/picohttpparser

# 上游测试入口（upstream Makefile 的 test 目标）
upstream_check_command: "make test"

# conanfile.py build() 中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "make test（build() 内按上游 Makefile 的 CFLAGS 与 TEST_ENV 构建 test-bin 并直接执行；上游原命令为 prove -v ./test-bin）"

# 与上游判定的等价性说明：
#   - test-bin 本身即 TAP 生产者，picotest 的 done_testing() 返回失败数、main() 以其为退出码，
#     子测试失败会上浮，故直接执行的退出码与 prove 判定一致
#   - TEST_ENV（UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1）已按上游传入，
#     因此 UBSan 报告会让构建失败，与上游行为相同
#   - 未使用 prove 的理由：避免依赖 Perl TAP 工具链；如需完全复刻，可将该行替换为 self.run("make test")

# 上游测试实际运行的测试程序
upstream_tests:
  - file: test.c
    source: picohttpparser-1.4/test.c
    description: "上游 TAP 测试套件：8 个顶层条目（request / response / headers / chunked / chunked-consume-trailer / chunked-leftdata / chunked-overhead + 1 个顶层 mmap 内存检查），共 299 条 ok 断言"
    command: "./test-bin"
  - file: picotest/picotest.c
    source: "h2o/picotest @ 70b9797596d81896cba49e5918fd5b1edf57269b（picohttpparser v1.4 的 .gitmodules 钉定 commit）"
    description: "上游 TAP 测试框架；GitHub 源码 tarball 不含子模块内容，故由 conandata.yml 的第二个 source 获取"
    command: "（编译链接进 test-bin）"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: "消费者 API 测试：版本宏 + phr_parse_request / phr_parse_response / phr_parse_headers / phr_decode_chunked（覆盖 partial=-2、非法输入=-1、consume_trailer 两种取值）"
    command: "./test_picohttpparser"

# 断言总数：上游 299（实测 8/8 顶层条目通过）+ 消费者 35 = 334
assertion_count: 334
