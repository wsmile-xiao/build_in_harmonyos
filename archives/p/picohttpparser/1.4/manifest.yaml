build:
  system: custom
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 Makefile 只承载测试目标（test-bin + prove -v），库本体没有构建系统：配方直接用 Conan conf 提供的 clang/llvm-ar 编译单一翻译单元（R33，不依赖裸 shell 变量）"
  - "GitHub 源码 tarball 不含 git submodule 内容：picotest/ 是空目录，上游测试所需的 picotest.c/picotest.h 必须作为第二个 source 从 h2o/picotest 的钉定 commit 获取（conandata.yml）"
  - "phr_decode_chunked 语义：consume_trailer 未置位时，完整分块消息的尾部 CRLF 作为未解码字节返回（实测返回值 2）；置位后返回 0、bufsz 均为 5"
  - "OHOS 运行 ELF 测试二进制需经 bash 包装（/system/bin/sh 可能无法直接 exec），与 zlib 配方同款做法"
