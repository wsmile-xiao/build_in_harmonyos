# conandata.yml — picohttpparser 1.4
#
# R39: 两个 URL 均为上游官方 GitHub archive 端点，镜像 fallback 由 CI 自动注入，
#      此处不写镜像域名。
#
# picotest 是上游声明的测试框架（.gitmodules: https://github.com/h2o/picotest.git），
# 钉在 picohttpparser v1.4 的子模块 commit 上。GitHub 的源码 tarball 不含子模块内容，
# 因此作为第二个 source 单独获取，供 build() 编译并运行上游测试使用。

sources:
  picohttpparser:
    url: "https://github.com/h2o/picohttpparser/archive/refs/tags/v1.4.tar.gz"
    sha256: "5d4a2f11d8596843ebb485d6b66a354368aa64a0007cd817219c3f03aaf5a712"
  picotest:
    # h2o/picotest @ 70b9797596d81896cba49e5918fd5b1edf57269b（picohttpparser v1.4 的
    # .gitmodules 子模块钉定 commit，固定到 commit 保证 sha256 永久可复现）
    url: "https://github.com/h2o/picotest/archive/70b9797596d81896cba49e5918fd5b1edf57269b.tar.gz"
    sha256: "b7dae81c4dc20019c9e465d055c55e3a2963ada9433fc6e90fe15d1b70d2fa62"

patches: {}
