    - perl/5.42.0
    - libx11/6.4.0
    - libxau/6.0.0
    - xorgproto/2024.1
    - libxext/6.4.0
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
