software: pdfgrep
version: "2.2.0"
category: utility
status: built

build_system: autotools
compiler: clang 15.0.4 / clang++ 15.0.4

dependencies:
  poppler-cpp: 23.12.0
  poppler: 23.12.0
  libgcrypt: 1.11.0
  libgpg-error: 1.55
  libpcre2-8: 10.40

configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - --with-libpcre
  - --disable-doc
  - HELP2MAN=/bin/true
  - SED=/bin/sed

build_notes:
  - config.status无法运行(HMDFS限制)，采用手动创建config.h + 手动编译
  - libgpg-error预编译包只有静态库(.a)，需静态链接libgcrypt.a + libgpg-error.a
  - poppler 26.05.0需要C++20(clang 15不支持)，降级使用23.12.0(C++17)

source_url: https://pdfgrep.org/download/pdfgrep-2.2.0.tar.gz