# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-spiffy/0.46
homepage: https://metacpan.org/dist/Spiffy

# 上游测试命令 (Perl 标准 make test)
upstream_check_command: "make test"
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游源码自带的测试 (t/ 目录)
upstream_tests:
  - file: t/base.t
    description: "Spiffy -base 基类继承测试"
  - file: t/base2.t
    description: "Spiffy -base 多层继承测试"
  - file: t/cascade.t
    description: "Spiffy 级联方法调用测试"
  - file: t/const.t
    description: "Spiffy const 常量声明测试"
  - file: t/early.t
    description: "Spiffy 早期加载测试"
  - file: t/export1.t
    description: "Spiffy export 导出功能测试 1"
  - file: t/export2.t
    description: "Spiffy export 导出功能测试 2"
  - file: t/export3.t
    description: "Spiffy export 导出功能测试 3"
  - file: t/export4.t
    description: "Spiffy export 导出功能测试 4"
  - file: t/export5.t
    description: "Spiffy export 导出功能测试 5"
  - file: t/export6.t
    description: "Spiffy export 导出功能测试 6"
  - file: t/export7.t
    description: "Spiffy export 导出功能测试 7"
  - file: t/exporter.t
    description: "Spiffy Exporter 兼容性测试"
  - file: t/field.t
    description: "Spiffy field 属性声明测试"
  - file: t/field2.t
    description: "Spiffy field 属性声明测试 2"
  - file: t/field3.t
    description: "Spiffy field 属性声明测试 3"
  - file: t/filter.t
    description: "Spiffy Filter 过滤器测试"
  - file: t/filter2.t
    description: "Spiffy Filter 过滤器测试 2"
  - file: t/filter3.t
    description: "Spiffy Filter 过滤器测试 3"
  - file: t/filter4.t
    description: "Spiffy Filter 过滤器测试 4"
  - file: t/filter5.t
    description: "Spiffy Filter 过滤器测试 5"
  - file: t/mixin.t
    description: "Spiffy mixin 混入功能测试"
  - file: t/mixin2.t
    description: "Spiffy mixin 混入功能测试 2"
  - file: t/mixin3.t
    description: "Spiffy mixin 混入功能测试 3"
  - file: t/new.t
    description: "Spiffy new 构造器测试"
  - file: t/package.t
    description: "Spiffy package 包操作测试"
  - file: t/parse.t
    description: "Spiffy parse 解析测试"
  - file: t/stub.t
    description: "Spiffy stub 存根测试"
  - file: t/super.t
    description: "Spiffy super 父类方法调用测试"
  - file: t/super2.t
    description: "Spiffy super 父类方法调用测试 2"
  - file: t/autoload.t
    description: "Spiffy AUTOLOAD 自动加载测试"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_spiffy.sh
    description: "Shell 脚本: 6 项 Perl 测试 (load+version, field, const, mixin, super, export)"
    command: "sh test_spiffy.sh"
  - file: conanfile.py
    description: "Conan L1 测试: 查找 Spiffy.pm/mixin.pm，设置 PERL5LIB，通过 self.run() 调用 test_spiffy.sh"
    command: "conan test test_package/conanfile.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 60
