software: perl-spiffy
# 版本级 manifest
# 文件位置: archives/p/perl-spiffy/0.46/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.46"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-01"

# 构建系统（顶级字段，供自检解析）
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/I/IN/INGY/Spiffy-0.46.tar.gz"

  # 源码校验和
  sha256: "8f58620a8420255c49b6c43c5ff5802bd25e4f09240c51e5bf2b022833d41da3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=/"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl (5.42.0, 系统预装)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Spiffy 是纯 Perl 模块，无需 C 编译，不需要处理 CRT 文件缺失问题"
  - "纯 Perl 模块使用 INSTALL_BASE=/ 安装到 DESTDIR/lib/perl5/ 目录"
  - "ExtUtils::MakeMaker 在鸿蒙平台上正常工作，无需额外适配"
  - "与 perl-dbd-pg 等 XS 模块不同，纯 Perl 模块不受 SELinux HMDFS 动态库加载限制"
  - "Spiffy 重写了 base::import 和 mixin::import，inline package 测试需使用 use base/use mixin 语法"

# 测试结果
test_results:
  conan_verify: "PASS (G0-G4 + L2/L4/L5 全门禁通过)"
  conan_l1_tests: "6/6 PASS (load, field, const, mixin, super, export)"
  upstream_tests: "32 文件 198 用例全部通过 (1 skipped)"
  submit_check: "6/6 PASS"
  verify_date: "2026-07-02"
