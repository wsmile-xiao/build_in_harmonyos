# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-io-async/0.805
homepage: "https://metacpan.org/pod/IO::Async"

# 上游测试命令 — prove（t/ 下 64 个 .t 文件）
# 注意：47/64 个文件在 BEGIN 期 import 缺失的非核心测试依赖
# （Test::Metrics::Any / Test::Future::IO::Impl 等），prove 会**收集失败整体中断**；
# 故配方先用 `perl -c` 逐个预检，仅对可运行子集执行 prove，并**显式输出理由**（R51）。
upstream_check_command: "perl -Ilib -S prove -l t/<可运行子集>"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "perl -Ilib -S prove -l t/<runnable subset>（配方内以 perl -c 预检筛选）"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - t/ 下 64 个 .t 文件
# - 47 个在 BEGIN 期 import 缺失依赖 → 无法收集（配方显式排除并输出理由）
# - 可运行子集：10 通过（另有 7 个可运行但失败，均因非核心运行时依赖 Future 缺失）
# - 纯 Perl，无编译
upstream_tests:
  - file: t/
    source: IO-Async-0.805/t/
    description: "上游测试套件（64 个 .t 文件）；47 个因 BEGIN 期 import 缺失测试依赖不可收集，配方以 perl -c 预检后仅跑可运行子集"
    command: "perl -Ilib -S prove -l t/<runnable subset>"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_io_async.py
    description: >-
      消费者测试：真实 API（R34），经 perl 解释器驱动——① 校验打包的 .pm
      模块数**恰为 39**（含 IO::Async/Loop.pm、Notifier.pm 与
      Future/IO/Impl/IOAsync.pm）；② 校验 **Future-free 子集真实加载**
      （IO::Async::OS / Loop / Debug / Time）；③ 读取 IO::Async::Loop 的
      VERSION 为 0.805；④ 执行真实 API 调用 `IO::Async::Loop->new` 并校验
      返回对象类型；⑤ 校验 **Future 依赖缺口行为与实测一致**
      （Notifier 报 `Can't locate Future.pm`）——若将来 Future 可用则输出提示
      而非误判失败。
    command: "python3 test_io_async.py <pkg_dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 14
