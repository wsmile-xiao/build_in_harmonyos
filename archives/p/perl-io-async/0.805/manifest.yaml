# 版本级 manifest — perl-io-async 0.805
# 遵循 ARCHIVE-SPEC v3.0

version: "0.805"

software: perl-io-async

status: built

build_date: "2026-09-16"
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/IO-Async-0.805.tar.gz"
  sha256: "77f997b74953dbdf63a750fcff4338d1bfacd89100e1fb27c3473f0a222a9a0c"
  compression: tar.gz
  archive_root: "IO-Async-0.805"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "Future >= 0.44（非核心，**当前未发布**；12 个 lib/ 文件 use Future）"
    - "Future::Utils >= 0.18（由 Future 发行版提供；**当前未发布**）"
    - "Struct::Dumb（非核心，**当前未发布**）"
  optional:
    - "IO::Socket::IP（META 中为 recommends）"

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options: []
  notes: >-
    package_type=application（perl-carp 1.50 先例）；纯 Perl（lib/ 下 39 个 .pm），
    package() 递归拷 lib/ 到 lib/perl5 并断言 39 个模块齐全；配套软件级
    commands.json（R38）。不跑 Build.PL（纯 Perl 无需构建步骤）。
    按仓内 perl-* 惯例**不声明 conan requires**（30 个样本中仅 1 个声明），
    非核心依赖在配方内探测并如实输出（R51）。

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: medium
  issues:
    - "非核心运行时依赖 Future / Future::Utils / Struct::Dumb 在当前解释器中缺失"
  notes: >-
    39 个模块中 **12 个可加载、27 个失败**（实测）；失败原因全部是
    `Can't locate Future.pm`——属**依赖环境缺口，非打包缺陷**。
    待 Future 等依赖适配并发布后，框架功能即完整可用。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 10
  failed: 7
  note: |
    上游测试：t/ 下 64 个 .t 文件。其中 **44 个在 BEGIN 期 import 缺失的非核心
    测试依赖**（Test::Future::IO::Impl / Test::Metrics::Any 等），无法收集；
    配方按 R51 **显式排除并输出理由**，仅对可运行子集执行 prove。
    实测可运行 17 个中：**10 通过、7 失败**；7 个失败**均因非核心运行时依赖
    Future 缺失**（在用例体内用到而非仅 BEGIN 期 import，故 perl -c 预检无法
    提前筛出），属环境依赖缺口、**非本适配引入**。配方已显式输出
    "upstream prove reported failures in the runnable subset"，未做静默处理。
    上游无 make check 之外的其他测试；纯 Perl 无编译。
    适配后：test_package R34 校验 39 个模块齐全、Future-free 子集真实加载、
    IO::Async::Loop->new 真实构造成功、并固化 Future 缺口行为。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - >-
    IO::Async 的 META recommends（IO::Socket::IP）与 requires（Future）需严格区分：
    本环境缺的是 **requires** 而非 recommends，故框架实质性不可用（12/39 可加载）
  - >-
    纯净的 `Can't locate X.pm` 报错应作为**环境依赖缺口**处理，而非改造上游源码；
    仓内 perl-* 惯例是探测 + 如实申报（R51），不声明 conan requires
  - >-
    上游测试的 BEGIN 期 import 缺失会使 prove **整体中断**（收集失败），
    需用 `perl -c` 逐个预检筛出可运行子集，而非直接 prove 全目录

references:
  - https://metacpan.org/pod/IO::Async
