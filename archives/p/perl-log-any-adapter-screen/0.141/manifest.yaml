software: perl-log-any-adapter-screen
# 版本级 manifest 模板
# 文件位置: archives/p/perl-log-any-adapter-screen/0.141/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.141"

# 编译状态
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-16"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/P/PE/PERLANCAR/Log-Any-Adapter-Screen-0.141.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表
  dependencies:
    - perl-log-any/1.718

  # 编译器
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯 Perl 模块使用 ExtUtils::MakeMaker 构建，无需 C 编译"
  - "纯 Perl 模块无需 ELF 签名"
  - "Log::Any 适配器模块需要 Log::Any 作为基础依赖"

# ============================================================
# 测试结果
# ============================================================

test_result: passed
test_summary: "All tests successful. Files=4, Tests=1. 模块功能正常，鸿蒙平台可用。"