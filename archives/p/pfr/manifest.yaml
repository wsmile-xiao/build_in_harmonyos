software: pfr
display: "Boost.PFR"
description: "Header-only C++14 reflection utilities for aggregate types"
category: library
homepage: "https://github.com/boostorg/pfr"
license: BSL-1.0
build_system: cmake

ohos_adaptation:
  key_points:
    - "Boost.PFR is header-only and has no runtime dependencies."
    - "The standalone release CMakeLists.txt defines an INTERFACE target but no install rules; the recipe copies include/boost and the Boost license."
    - "The upstream test suite is Boost.Build-based and is run in the Boost superproject, separate from the standalone package archive."
  common_dependencies: []

versions:
  "2.2.0":
    status: built
    build_date: "2026-09-10"
    conan_ref: "pfr/2.2.0"
    notes: "Conan/W3 consumer checks and the device Boost.Build upstream matrix passed. The final b2 run covered cxxstd=14,17,20 with debug/release variants and exited 0 after the OHOS Clang portability patch and package-header include ordering fix."
