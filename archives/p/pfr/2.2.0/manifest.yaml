software: pfr
version: "2.2.0"
status: built
build_date: "2026-09-10"
build_system: cmake

source:
  url: "https://github.com/boostorg/pfr/archive/refs/tags/2.2.0.tar.gz"
  sha256: "6f490ec1383de5855dcf801c23f0a967f888eb6e1440b6ca0bf36c12d4ae7ac7"
  tar_format: tar.gz

build:
  system: header-only-copy
  configure_options:
    - "copy include/boost"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-clang-aarch64-layout-and-addressof-include.patch"

upstream_tests:
  framework: "Boost.Build (b2) in the Boost superproject"
  status: "passed on device"
  test_count: 191
  skipped_count: 0
  not_run_count: 0
  failed_target_count: 0
  count_unit: "Boost.Build boost-test rows emitted by --dump-tests (117 RUN, 73 COMPILE_FAIL, 1 RUN_PYD); execution gate is the full b2 target matrix"
  result: "The r34 final full matrix exited 0 for cxxstd=14,17,20 and debug,release with the Conan-installed package include directory forced before the Boost root headers; the log contains no 'failed updating' marker."
  source_note: "The standalone 2.2.0 archive has Jamfiles and test sources but no Boost superproject headers or test driver."

test_package:
  test_count: 2
  assertion_count: 8
  description: "Two CMake consumer executables exercise tuple access, field iteration, formatted I/O, and C++20 field-name reflection."

knowledge_gained:
  - "Boost.PFR is header-only and does not depend on the Boost runtime or compiled libraries."
  - "The package exports CMake target boost::pfr through Conan CMakeDeps."
  - "The Boost superproject test harness must put the Conan-installed pfr include directory before the superproject Boost headers; otherwise it tests a different pfr header tree."
  - "On OHOS aarch64, Clang defines GCC compatibility macros; excluding Clang from pfr's GCC<8 layout workaround preserves the native double alignment."
  - "The upstream test harness needs four diagnostic-only warning suppressions on this device for expected upstream warnings; no warning flags are embedded in the package recipe."
