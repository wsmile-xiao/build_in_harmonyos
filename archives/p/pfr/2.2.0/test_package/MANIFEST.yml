package: pfr/2.2.0
homepage: "https://github.com/boostorg/pfr"

# The standalone release uses Boost.Build Jamfiles. The upstream CI copies
# this library into the Boost superproject before invoking b2.
upstream_check_command: "./b2 --dump-tests -d0 libs/pfr/test toolset=clang cxxstd=20 variant=debug cxxflags=\"$PFR_OHOS_CXXFLAGS -I$PFR_PACKAGE_INCLUDE -Wno-unused-value -Wno-unused-private-field -Wno-unused-variable -Wno-undefined-var-template\" linkflags=\"$PFR_OHOS_LINKFLAGS\""
upstream_test_in_build: false
upstream_test_command: "./b2 -d0 -j1 -a libs/pfr/test toolset=clang cxxstd=14,17,20 variant=debug,release cxxflags=\"$PFR_OHOS_CXXFLAGS -I$PFR_PACKAGE_INCLUDE -Wno-unused-value -Wno-unused-private-field -Wno-unused-variable -Wno-undefined-var-template\" linkflags=\"$PFR_OHOS_LINKFLAGS\""

upstream_test_statistics:
  total: 191
  pass: 191
  fail: 0
  skip: 0
  not_run: 0
  count_unit: "Boost.Build boost-test rows emitted by --dump-tests; 117 RUN, 73 COMPILE_FAIL, and 1 RUN_PYD"
  discovery_result: "The final package-header discovery command exited 0 and emitted 191 rows."
  execution_result: "The final full matrix exited 0; no 'failed updating' marker was present in the captured log."
  evidence: "Task-local final discovery and execution logs; full device paths are retained outside the package sources"

upstream_tests:
  - subdir: test/config
    description: "Boost.PFR configuration and feature-report checks."
  - subdir: test/core
    description: "Core tuple access, aggregate reflection, operations, examples, and compile-fail checks."
  - subdir: test/core_name
    description: "C++20 aggregate field-name reflection and negative checks."

test_package_tests:
  - file: test.cpp
    description: "CMake consumer checks tuple size, indexed field access, for_each_field, and formatted I/O."
    command: "./test_pfr"
  - file: test_cxx20.cpp
    description: "C++20 consumer checks constexpr get_name for two aggregate fields."
    command: "./test_pfr_cxx20"

assertion_count: 8
