# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-libwww/6.83
homepage: "https://metacpan.org/dist/libwww-perl"

# 上游测试命令 — libwww-perl 自带 t/ 测试套件（ExtUtils::MakeMaker `make test`）
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（实测 2026-08-16，OHOS 环境）：
# - t/ 目录 23 个 .t 测试文件（t/base/ua.t、t/10-attrs.t、t/redirect.t 等）
# - make test 运行（部分测试需网络/外部服务，受限环境按实际运行情况记录）
upstream_tests:
  - file: t/
    source: libwww-perl-6.83/t/
    description: "上游 Perl 测试套件（23 个 .t 文件，make test 运行）"
    command: "make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_libwww.py
    description: "消费者测试：PERL5LIB 指向 site_perl，加载 LWP::UserAgent 并验证版本 6.x"
    command: "python3 test_libwww.py <site_perl-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
