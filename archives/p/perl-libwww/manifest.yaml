software: perl-libwww
display: "LWP (libwww-perl)"
description: "Perl HTTP/HTTPS client library - LWP::UserAgent, LWP::Simple"
category: network
homepage: "https://metacpan.org/pod/LWP"
license: Artistic-1.0-Perl OR GPL-1.0-or-later
build_system: perl

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "纯 Perl 模块，编译简单，无需平台适配"
    - "Clone 模块 XS 版本受 SELinux 限制，使用纯 Perl 替代"
    - "HTTPS 功能需管理员安装 Net::SSLeay XS 模块到系统目录"
    - "用户需设置 PERL5LIB 或安装到系统 Perl 目录"
  common_dependencies:
    - perl
    - openssl

# 版本索引
versions:
  "6.81-r0":
    status: published
    build_date: "2026-06-12"
    published_as: perl-libwww