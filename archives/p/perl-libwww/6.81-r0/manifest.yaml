software: perl-libwww
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/6.81-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "6.81-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/O/OA/OALDERS/libwww-perl-6.81.tar.gz"

  # 源码校验和
  sha256: "ab30552f194e8b5ae3ac0885132fd1d4ea04c4c7fe6555765b98f01af70c1736"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  system: perl

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "Clone/0.46"
    - "URI/5.28"
    - "HTTP-Message/6.46"
    - "Net-HTTP/6.23"
    - "Try-Tiny/0.31"
    - "IO-HTML/1.004"
    - "HTTP-Date/6.06"
    - "LWP-MediaTypes/6.04"
    - "Encode-Locale/1.05"

  # HTTPS 依赖（需管理员安装 XS 模块）
  https_dependencies:
    - "LWP-Protocol-https/6.14"
    - "IO-Socket-SSL/2.085"
    - "Net-SSLeay/1.92"

  # 编译器
  cc: clang
  cxx: clang++

  # 模块类型
  # pure_perl | xs | mixed
  module_type: pure_perl

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl libwww-perl 依赖链较长，需手动安装 9 个依赖模块"
  - "Clone 模块 XS 版本受 SELinux HMDFS 限制，需用纯 Perl 版本替代"
  - "纯 Perl 模块编译简单，无需平台适配"
  - "HTTP 功能正常，HTTPS 需额外安装 LWP::Protocol::https"

# ============================================================
# 特殊说明
# ============================================================

notes:
  - "SELinux 限制解决: Clone.pm 纯 Perl 版本替代 XS 版本"
  - "HTTPS 未实现: 需安装 LWP::Protocol::https + IO::Socket::SSL"
  - "环境变量: 用户需设置 PERL5LIB 或安装到系统目录"

# ============================================================
# 功能测试结果
# ============================================================

test_results:
  module_load: PASS
  http_function: PASS
  https_function: FAIL
  dependency_complete: PASS