package: phat/1.7
homepage: "https://bitbucket.org/phat-code/phat"

upstream_tests_exist: true
upstream_check_command: "c++ -std=c++11 -O2 -pthread -Iinclude src/self_test.cpp -o self_test && ./self_test examples/torus.bin"
upstream_test_in_build: true
upstream_test_command: "./phat-upstream-self-test examples/torus.bin"
upstream_test_count: 1

upstream_tests:
  - file: src/self_test.cpp
    source: phat-code-phat-a74705e4628e/src/self_test.cpp
    description: "官方 C++ 自测入口：20 项结果比较覆盖 8 种表示法、8 种算法、对偶计算、vector 接口与 unordered-map 表示。"
    command: "./phat-upstream-self-test examples/torus.bin"
    tests: 1

consumer_test_count: 3
test_package_tests:
  - file: test_phat.cpp
    description: "通用消费者测试：三角形边界矩阵元数据、精确 persistence pairs 与多算法一致性（8 个检查）。"
    command: "./test_phat"
    tests: 8
  - file: conanfile.py
    description: "命令行集成测试：执行已打包 phat 工具并校验 ASCII 输出中的 3 个精确 persistence pairs。"
    command: "phat --ascii triangle.dat triangle-pairs.dat"
    tests: 1
  - file: test_phat_ohos.cpp
    description: "鸿蒙专有测试：强制 OHOS AArch64 编译路径并比较 standard、twist、chunk reductions（6 个检查）。"
    command: "./test_phat_ohos"
    tests: 6

assertion_count: 35
