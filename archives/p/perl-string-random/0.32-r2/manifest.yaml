software: perl-string-random
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.32-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.32-r2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"
verify_date: "2026-07-06"

# ============================================================
# 源码信息
# ============================================================

