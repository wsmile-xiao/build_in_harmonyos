# ============================================================
# 构建配置
# ============================================================

# 构建系统类型 (顶层字段，供 submit 自检)
# cmake | autotools | makefile | meson | custom
build_system: custom

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
