  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Upstream uses Module::Build (Build.PL), but OHOS Perl lacks Module::Build; created Makefile.PL using ExtUtils::MakeMaker"
  - "Pure Perl module — no C compilation needed"
  - "SSL certificate verification fails in Python urllib on OHOS; workaround: manually download source tarball"
  - "Source URL: CPAN (SHLOMIF/String-Random-0.32.tar.gz)"
