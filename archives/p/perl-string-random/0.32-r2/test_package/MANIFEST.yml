# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-string-random/0.32-r2
homepage: "https://metacpan.org/release/String-Random"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/00-compile.t
    source: String-Random-0.32/t/00-compile.t
    description: "Compile check test"
    command: "perl -Iblib/lib t/00-compile.t"
  - file: t/01_use.t
    source: String-Random-0.32/t/01_use.t
    description: "Basic use/require test"
    command: "perl -Iblib/lib t/01_use.t"
  - file: t/02_new.t
    source: String-Random-0.32/t/02_new.t
    description: "Constructor test"
    command: "perl -Iblib/lib t/02_new.t"
  - file: t/03_random_string.t
    source: String-Random-0.32/t/03_random_string.t
    description: "Random string generation test"
    command: "perl -Iblib/lib t/03_random_string.t"
  - file: t/04_randpattern.t
    source: String-Random-0.32/t/04_randpattern.t
    description: "randpattern method test"
    command: "perl -Iblib/lib t/04_randpattern.t"
  - file: t/05_randregex.t
    source: String-Random-0.32/t/05_randregex.t
    description: "randregex method test"
    command: "perl -Iblib/lib t/05_randregex.t"
  - file: t/06_random_regex.t
    source: String-Random-0.32/t/06_random_regex.t
    description: "Random regex generation test"
    command: "perl -Iblib/lib t/06_random_regex.t"
  - file: t/07_rand_gen.t
    source: String-Random-0.32/t/07_rand_gen.t
    description: "Random generator test"
    command: "perl -Iblib/lib t/07_rand_gen.t"
  - file: t/08_get_set.t
    source: String-Random-0.32/t/08_get_set.t
    description: "Get/set accessor test"
    command: "perl -Iblib/lib t/08_get_set.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_string_random.sh
    description: "Shell 脚本: 4 项 Perl 测试 (load+version, randpattern, randregex, random_string)"
    command: "sh test_string_random.sh"
  - file: conanfile.py
    description: "Conan L1 测试: 查找 String::Random.pm，设置 PERL5LIB，通过 self.run() 调用 test_string_random.sh"
    command: "conan test test_package/conanfile.py"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 202
