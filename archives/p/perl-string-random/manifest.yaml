# 软件级 manifest 模板
# 文件位置: archives/{letter}/{name}/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
software: perl-string-random

# 软件描述
description: "Perl module to generate random strings based on a pattern"

# 分类
category: text

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "0.32-r2"
    status: published
    build_date: "2026-07-03"
    path: archives/p/perl-string-random/0.32-r2

# ============================================================
# 软件信息
# ============================================================

# 官方网站
homepage: https://metacpan.org/release/String-Random

# 源码仓库
repository: https://github.com/shlomif/string-random

# 许可证
license: "Artistic-1.0-Perl OR GPL-1.0-or-later"

# ============================================================
# 依赖信息
# ============================================================

# 运行依赖
runtime_dependencies:
  - perl (>=5.10)

# 编译依赖
build_dependencies:
  - perl (ExtUtils::MakeMaker)
