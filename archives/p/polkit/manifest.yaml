# 软件级 manifest — polkit
# 遵循 ARCHIVE-SPEC v2.0

software: polkit

display: "polkit"

description: "D-Bus 权限认证框架，本适配发布 libpolkit-gobject-1 客户端库"

category: system

homepage: "https://gitlab.freedesktop.org/polkit/polkit"

license: LGPL-2.0-or-later

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
build_system: meson

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "-Dlibs-only=true 仅构建 libpolkit-gobject-1 客户端库，跳过 polkitd/backend/agent/programs（OHOS 无 systemd/dbus-daemon 服务场景）"
    - "meson 构建需关闭 introspection/gtk-doc，避免 gobject-introspection 依赖"

  common_dependencies:
    - glib
    - libgobject

# ============================================================
# 版本索引
# ============================================================

versions:
  "124":
    status: built
    build_date: "2026-09-03"
