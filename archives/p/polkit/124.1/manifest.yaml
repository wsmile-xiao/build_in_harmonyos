# 版本级 manifest — polkit 124.1
# 遵循 ARCHIVE-SPEC v2.0
# 124.1 = polkit 124 的适配修复版本（R37 版本号策略）：
#   -Dlibs-only=true 下同时构建 src/polkitagent，补出下游 agent 需要的
#   libpolkit-agent-1 + polkit-agent-1.pc + polkitagent/ 头文件。

version: "124.1"
software: polkit

# 编译状态
# published | built | failed | archived
# 本版本以 -Dlibs-only=true 构建 libpolkit-gobject-1 + libpolkit-agent-1
# 客户端库（跳过 polkitd 守护进程与特权 helper）
status: built
build_date: "2026-09-25"
build_system: meson

# ============================================================
# 源码信息
# ============================================================
source:
  # 上游官方源（gitlab.freedesktop.org）；124.1 与 124 同源同 sha256，
  # 版本后缀仅表示适配修复（R37），不引入新的上游代码
  url: "https://gitlab.freedesktop.org/polkit/polkit/-/archive/124/polkit-124.tar.gz"
  upstream_url: "https://gitlab.freedesktop.org/polkit/polkit/-/archive/124/polkit-124.tar.gz"
  sha256: "72457d96a0538fd03a3ca96a6bf9b7faf82184d4d67c793eb759168e4fd49e20"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: meson

  configure_options:
    - "-Dlibs-only=true"          # 只构建库；124.1 下产出 gobject + agent 两个库
    - "-Dauthfw=shadow"           # 顶层 meson 无条件探测 authfw；避开 OHOS 不存在的 libpam
    - "-Dintrospection=false"
    - "-Dtests=true"               # 构建并运行上游 4 个单元测试（test/polkit/，LD_PRELOAD mocklibc）
    - "-Dexamples=false"
    - "-Dman=false"
    - "-Dgtk_doc=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0.1               # glib-2.0/gobject-2.0/gio-2.0/gio-unix-2.0
    - expat/2.8.2                 # 顶层 meson.build 无条件 assert，库本体不链接（visible=False）

  missing_dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied:
  - file: "patches/mocklibc-ohos-fgetgrent-fgetpwent.patch"
    description: "mocklibc: 本地实现 OHOS (musl-based) libc 头文件缺失的 fgetgrent/fgetpwent（沿用 polkit/124）"
  - file: "patches/polkitagent-libs-only.patch"
    description: "meson: libs-only 模式也构建 src/polkitagent（产出 libpolkit-agent-1 + polkit-agent-1.pc），polkitbackend/programs 仍跳过；特权 agent helper 留给 full 构建（OHOS musl libc 无 shadow 口令 API）"

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "polkit 124 的 libs-only 模式会一次性跳过 polkitbackend/polkitagent/programs（src/meson.build: if not get_option('libs-only')），因此制品仓 polkit/124 只有 polkit-gobject-1.pc；下游 agent（如 lomiri-polkit-agent，CMake 里 pkg_check_modules polkit-agent-1）链接 libpolkit-agent-1，需要 polkit-agent-1.pc → 派生 124.1，libs-only 下也 subdir('polkitagent')，补出 libpolkit-agent-1.so + polkit-agent-1.pc + include/polkit-1/polkitagent/ 6 个头（含 mkenums 生成的 polkitagentenumtypes.h）"
  - "OHOS (musl-based) libc 完全没有 shadow 口令 API：sysroot/usr/include/shadow.h 无 getspnam 声明，libc.so 无 getspnam 符号（对照组 getpwnam 存在）→ polkit-agent-helper-1（authfw=shadow 特权 helper，polkitagenthelper-shadow.c:100 调 getspnam）无法构建；libs-only 语义下 helper 留给 full 构建。该类缺口与 polkit/124 已有的 mocklibc 补丁（fgetgrent/fgetpwent 缺失，subprojects/mocklibc）同源，属 OHOS musl 口令/组数据库 API 缺口的「一类共性问题」，具备知识库拓展价值"
  - "Conan CMakeDeps 组件可用于 libpolkit-agent-1：test_package 用 find_package(polkit CONFIG) + polkit::agent 链接并包含 <polkitagent/polkitagent.h>；agent 头有 API 稳定性守卫，消费者必须在 include 前定义 POLKIT_AGENT_I_KNOW_API_IS_SUBJECT_TO_CHANGE"
  - "polkit_agent_text_listener_new() 走 GInitable（initable_init 用 ctermid()+fopen 打开控制终端），CI 无 tty 必然返回 NULL；agent 库的消费者测试应改走类型系统 + g_object_new()（类型名/继承关系/实例化），既不需要 tty 也不需要 D-Bus/polkitd"
  - "配方在 source() 与 build() 各调用一次 apply_conandata_patches（沿用 polkit/124 既有结构），第二次为幂等重放，conan 输出 'already patched' WARN 但不失败、产物正确——阅读构建日志时不应把该 WARN 误判为补丁失败"
