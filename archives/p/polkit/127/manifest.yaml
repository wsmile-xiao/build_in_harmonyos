# 版本级 manifest — polkit 127
# 遵循 ARCHIVE-SPEC v3.0

# 版本号
version: "127"

# 软件名
software: polkit

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-02"
build_system: meson

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（上游 tag 为 127，无 v 前缀；gh-proxy/codeload 实测可用）
  url: "https://gh-proxy.com/https://github.com/polkit-org/polkit/archive/refs/tags/127.tar.gz"

  # 源码校验和（sha256，实测）
  sha256: "9b7bc16f086479dcc626c575976568ba4a85d34297a750d8ab3d2e57f6d8b988"

  # 压缩格式
  compression: tar.gz

  # 压缩包内源码目录名（strip_root 前）
  archive_root: "polkit-127"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "glib/2.84.0"
    - "expat/2.8.2"
    - "duktape/2.7.0"
  optional: []

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - "authfw=shadow（pam 在 ohpcd 无，用 shadow 口令文件认证）"
    - "session_tracking=ConsoleKit（libsystemd/libelogind 在 ohpcd 无，规避）"
  notes: "meson 构建（dconf 同款模式）：PkgConfigDeps 补 glib 子 .pc（gio-2.0/gio-unix-2.0/gobject-2.0）+ 改写 prefix=/；注入 meson 归档器 ar/ranlib 全路径（E012 变体）；关闭 man/introspection/examples/gettext"

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-polkitagenthelper-shadow-getspnam-stub.patch"
  - "0002-polkitbackend-statx-guard.patch"
  - "0003-polkitbackendduktape-pthread-cancel-stub.patch"

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: medium
  issues: []
  notes: "polkitd 依赖运行中的 D-Bus session/system bus——OHOS 无，daemon 运行类用例按平台限制声明；库与 CLI 编译可用"

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 0
  failed: 0
  note: |
    上游测试：test/polkit 4 个单元测试（polkitunixusertest/polkitunixgrouptest/
    polkitunixnetgrouptest/polkitidentitytest）+ test/polkitbackend 1 个
    test-polkitbackendjsauthority。所有测试经 test/wrapper.py 运行，其模块级
    `import dbus`/`import dbusmock` 硬依赖 Python dbusmock（OHOS pip 镜像
    pypi.cnb.cool 无此包，versions: none 实测）+ mock system D-Bus；且 C 测试
    二进制绕过 wrapper 直接运行也 GLib-FATAL-CRITICAL
    （g_datalist_id_set_data_full: assertion 'key_id > 0' failed，需 mock
    D-Bus 环境初始化）——上游测试按 rule 1.2 如实声明为平台限制（非跳过）。
    本地验证：conan create 通过（exit=0），94/94 目标编译链接成功（含三个
    portability 补丁 + gettext 恒等宏），libpolkit-gobject-1/libpolkit-agent-1
    与 pkaction/pkcheck/pkexec 等 CLI 打包到 lib//bin/。
    适配后：test_package R34 真实产物校验——libpolkit-gobject-1.so 存在 +
    ELF shared object + pkaction 存在 + ELF executable（1/1 = 100%）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "polkit 是 meson 构建的应用授权框架（daemon + libpolkit-gobject + CLI），依赖 glib/expat/duktape；pam/systemd/elogind 在 ohpcd 无——用 authfw=shadow + session_tracking=ConsoleKit 规避"
  - "meson 库的依赖注入沿用 dconf 0.40.0 模式：PkgConfigDeps 补 glib 子 .pc + 改写 prefix=/ + 注入 ar/ranlib 全路径（E012 变体）"

references:
  - https://www.freedesktop.org/software/polkit/
  - https://github.com/polkit-org/polkit
