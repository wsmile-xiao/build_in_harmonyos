# test_package/MANIFEST.yml — polkit 127
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: polkit/127
homepage: "https://www.freedesktop.org/software/polkit/"

# 上游测试：test/polkit 4 个单元测试（unixuser/unixgroup/unixnetgroup/identity）
# + test/polkitbackend 1 个（test-polkitbackendjsauthority）。所有测试经
# test/wrapper.py 运行，其模块级 `import dbus`/`import dbusmock` 硬依赖 Python
# dbusmock（OHOS pip 镜像 pypi.cnb.cool 无此包，versions: none 实测）+ mock
# system D-Bus；C 测试二进制绕过 wrapper 直接运行也 GLib-FATAL-CRITICAL
# （g_datalist_id_set_data_full: assertion 'key_id > 0' failed，需 mock D-Bus
# 环境初始化）——上游测试按 rule 1.2 如实声明为平台限制（非跳过）。
upstream_check_command: "meson test"
upstream_test_in_build: true
upstream_test_command: "meson test -C build"

upstream_tests:
  - file: test/polkit/
    source: polkit-127/test/polkit/*.c
    description: "polkit 单元测试（polkitunixusertest/polkitunixgrouptest/polkitunixnetgrouptest/polkitidentitytest）——经 wrapper.py 运行，依赖 Python dbusmock（OHOS 镜像无包）+ mock D-Bus，按 rule 1.2 平台限制声明"
    command: "meson test"

# test_package 消费者测试（R34 真实产物校验：libpolkit-gobject-1.so + pkaction）
test_package_tests:
  - file: test_polkit.py
    description: "Verifies libpolkit-gobject-1.so under lib/ is valid aarch64 ELF shared object; pkaction under bin/ is valid ELF executable"
    command: "python3 test_polkit.py"

# 断言总数：3（libpolkit-gobject-1.so 存在 + ELF + pkaction 存在/ELF）
assertion_count: 3
