patches:
  "127":
    - patch_file: "patches/0001-polkitagenthelper-shadow-getspnam-stub.patch"
      patch_description: "polkitagenthelper-shadow.c：OHOS musl 的 shadow.h 只声明 struct spwd 未声明 getspnam()，且 OHOS 无 /etc/shadow 口令体系——提供存根返回 NULL（认证必然失败，如实反映平台能力）"
      patch_type: "portability"
    - patch_file: "patches/0002-polkitbackend-statx-guard.patch"
      patch_description: "polkitbackendinteractiveauthority.c：OHOS musl 缺 struct statx/STATX_CTIME（incomplete type）——用 #if defined(__linux__) && defined(STATX_CTIME) 守卫 statx 控制终端 ctime 安全检查块"
      patch_type: "portability"
    - patch_file: "patches/0003-polkitbackendduktape-pthread-cancel-stub.patch"
      patch_description: "polkitbackendduktapeauthority.c：OHOS musl 不实现 POSIX 线程取消族（E085，同 asterisk libohosshim 场景）——pthread_cancel/pthread_setcanceltype/pthread_setcancelstate/pthread_testcancel 提供存根（ENOSYS）使 runaway-killer 线程机制可编译链接"
      patch_type: "portability"
