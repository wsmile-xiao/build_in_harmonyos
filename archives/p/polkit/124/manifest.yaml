# 版本级 manifest — polkit 124
# 遵循 ARCHIVE-SPEC v2.0

version: "124"
software: polkit

# 编译状态
# published | built | failed | archived
# 本版本以 -Dlibs-only=true 构建 libpolkit-gobject-1 客户端库（跳过 polkitd 守护进程）
status: built
build_date: "2026-09-03"
build_system: meson

# ============================================================
# 源码信息
# ============================================================
source:
  # 上游官方源（gitlab.freedesktop.org；GitHub 沙箱不可达，本环境实测
  # gitlab 官方 archive 可达，sha256 已实测）
  url: "https://gitlab.freedesktop.org/polkit/polkit/-/archive/124/polkit-124.tar.gz"
  upstream_url: "https://gitlab.freedesktop.org/polkit/polkit/-/archive/124/polkit-124.tar.gz"
  sha256: "72457d96a0538fd03a3ca96a6bf9b7faf82184d4d67c793eb759168e4fd49e20"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================
build:
  system: meson

  configure_options:
    - "-Dlibs-only=true"          # 只构建库，跳过 polkitd/polkitbackend/polkitagent/programs
    - "-Dauthfw=shadow"           # 跳过 PAM（polkitd 鉴权框架，未构建），使用 sysroot libcrypt
    - "-Dintrospection=false"
    - "-Dtests=true"               # 构建并运行上游 4 个单元测试（test/polkit/，LD_PRELOAD mocklibc）
    - "-Dexamples=false"
    - "-Dman=false"
    - "-Dgtk_doc=false"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - glib/2.84.0.1               # glib-2.0/gobject-2.0/gio-2.0/gio-unix-2.0
    - expat/2.8.2                 # 顶层 meson.build 无条件 assert，库本体不链接（visible=False）

  missing_dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - "polkit 124（Meson）libpolkit-gobject-1 客户端库可独立构建发布：-Dlibs-only=true 跳过 polkitd/polkitbackend/polkitagent/programs，仅产出 GObject 客户端库；下游 accountsservice meson.build:161 只链接该库，构建依赖即满足"
  - "libs-only 模式下 js_engine 被上游自动置空（-Dlibs-only=true → js_engine=''），无需 mozjs/duktape；session_tracking 默认 ConsoleKit，无需 systemd/libelogind；dbus-1 为 optional（required:false）"
  - "polkit 顶层 meson.build 无条件 assert expat.h/XML_ParserCreate，即使 libs-only 也需 expat 在 configure 期可见；但 libpolkit-gobject-1 不链接 expat（仅 polkitd 后端解析 policy XML 用）→ conan requires expat/2.8.2 visible=False（私有依赖不向消费者传播，同 at-spi2-core libxml2 模式），否则 Conan 'direct dependency not used by cpp_info.requires' 报错"
  - "polkit 顶层 meson.build 无条件执行 authfw 检测：默认 -Dauthfw=pam 需 libpam（OHOS 无）→ 必须 -Dauthfw=shadow，cc.find_library('crypt') 命中 OHOS sysroot libcrypt.a；libs-only 下 auth_deps 实际不被链接，仅 configure 期探测"
  - "polkit 库构建需 gnome.mkenums_simple，其依赖 glib-2.0.pc 的 glib_mkenums pkg-config 变量，PkgConfigDeps 不生成 → 在 generate() 增补 glib-2.0.pc/gobject-2.0.pc 的 glib_mkenums/glib_genmarshal/gobject_query 变量（指向 conan glib 包 bin/ 工具的 python wrapper，同 atk 配方模式）"
  - "polkit meson dependency('gio-unix-2.0') 需 gio-unix-2.0.pc：glib/2.84.0.1 conan 包在 lib/pkgconfig/ 内置 gio-unix-2.0.pc（非 component），需把依赖包 lib/pkgconfig 追加进 meson native 文件 pkg_config_path（_append_dependency_pkg_config_paths，atk 模式）"
  - "OHOS 共享库 .so 必须签名（binary-sign-tool）动态链接器才能加载：conan create 后 test_package 实测可运行（identity=unix-user:root subject=system-bus-name::1.42），消费者 meson 解析 polkit-gobject-1/gio-unix-2.0 全 YES"
