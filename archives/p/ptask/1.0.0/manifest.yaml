patch_classification:
  - file: 0001-config.guess.patch
    type: portability
    platform_only: true
    guard: "new *:HarmonyOS:*:* branch echoes <machine>-unknown-linux-ohos and exits; other platforms are untouched"
  - file: 0002-config.sub.patch
    type: portability
    platform_only: true
    guard: "adds linux-ohos* to the maybe_os and kernel-OS lists; only linux-ohos triples match"
  - file: 0003-configure.patch
    type: portability
    platform_only: false
    guard: "config.status temporary directory umask 077 -> 022 (generic; the directory is created in the build tree, not in a shared /tmp)"
  - file: 0004-src-Makefile.in.patch
    type: portability
    platform_only: false
    guard: "spells the upstream link flag as -Wl,--export-dynamic; the flag itself is preserved, only the driver-safe spelling changes"
  - file: 0005-src-main.c.patch
    type: test
    platform_only: false
    guard: "adds the headless -S/--selftest entry point (no __OHOS__ macro); it exits before gtk_init() and is only reachable when the option is passed"
  - file: 0006-src-pstr.c.patch
    type: bugfix
    platform_only: false
    guard: "copies the terminating NUL in trim(); behaviour for already-trimmed strings is unchanged"
  - file: 0007-src-tw.c.patch
    type: portability
    platform_only: false
    guard: "drops the is_error() guard removed in json-c >= 0.13 (was a no-op) and accepts taskwarrior 2.x; no platform macro is involved"
