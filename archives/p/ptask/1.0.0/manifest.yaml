knowledge_gained:
  - "ptask 1.0.0 是 Jean-Philippe Orsini 的 GTK+ 3 taskwarrior 客户端，不是 glipari/ptask（POSIX 实时周期任务库，最高版本 0.5、仓库无任何 tag）。平台任务清单来自 Debian 源包，携带的是 Debian 包的上游版本号，故 ptask 1.0.0 对应 GTK 客户端。"
  - "上游官网 wpitchoune.net 已死（curl 空响应），Debian d/watch 标记 Untrackable，作者 Launchpad PPA 只到 0.0.9/0.0.5。原始发行物只剩各发行版池里的 ptask_1.0.0.orig.tar.gz：deb.debian.org、archive.ubuntu.com、mirrors.kernel.org、http.kali.org 四处 sha256 完全一致（b8cde0f7…），证明不是 repack。"
  - "2012 版 config.guess 不认 uname -s=HarmonyOS，不打补丁 configure 会得到不可用的主机三元组；config.sub 另需在 maybe_os 与 kernel-OS 表里加入 linux-ohos。"
  - "json-c >= 0.13 移除了 is_error()，ptask 1.0.0 的 src/tw.c 仍在调用，对 json-c/0.18 必须去掉该（语义为 no-op 的）守卫才能链接；Debian 携带同样的补丁。"
  - "PkgConfigDeps 按 cpp_info 重建 .pc，会丢掉上游 .pc 里的三处信息：glib-2.0.pc 的 Libs 里自带 libintl.so（glib 的公开 libintl.h 把 gettext 宏成 g_libintl_gettext，不补就 undefined symbol）、json-c.pc 的 -I${includedir}/json-c（头文件在 include/json-c/，不补就 fatal error: 'json.h' file not found）、gio-2.0.pc 的自定义变量 glib_compile_schemas（glib-2.0.m4 的 GLIB_GSETTINGS 在非交叉编译分支靠它定位 schema 编译器，为空即 configure: error: glib-compile-schemas not found.）。"
  - "ptask 1.0.0 上游 src/Makefile.am 里 AM_LDFLAGS 把 --export-dynamic 写成裸 -export-dynamic：GCC 驱动接受，OHOS clang 驱动不接受并原样转给链接器，链接器按 -e xport-dynamic 解析 ⇒ lld 只打一行 cannot find entry symbol xport-dynamic 警告、ELF 入口点留空 ⇒ 产物每次执行都在任何输出之前 SIGSEGV（rc=139），而构建全程 rc=0。判据是 readelf -h 的 Entry point。"
  - "上游 pstr.c 的 trim() 用 memmove(str, p, strlen(p)) 搬移，漏拷结尾 NUL：带前导空白的输入会残留原缓冲区尾部（'  spaced  ' → 'spaceded'），纯空白串永远不为空。该缺陷由本包新增的无头 --selftest 抓到，patch 0006 修正。"
  - "glib 在 OHOS 上自带 libintl，并且 glib-compile-schemas 等 host 工具在 conan 包里是未签名 ELF：必须复制进 build 树自签名后才能执行，且执行时依赖 libdir 要在 LD_LIBRARY_PATH 上。"
  - "src/ptask.1 随发行包分发；打了 src/main.c 后它变旧，make install 会调用 help2man（本设备无此工具）重生成。build() 内 os.utime() 保持随包 man page 为最新即可，无需引入 help2man 依赖。"
  - "鸿蒙 PC 无 X server：GTK 窗口无法打开，验收只能走无头路径（--version/--help、新增 --selftest、以及 fail-closed 的无显示失败路径）。"

