sources:
  url: "https://archive.ubuntu.com/ubuntu/pool/universe/p/ptask/ptask_1.0.0.orig.tar.gz"
  sha256: "b8cde0f7994bd91410a13284188c865e255621bcfd23f6051f7b25b14eced18e"
patches:
  - patch_file: "patches/0001-config.guess.patch"
    patch_description: >-
      Teach the bundled (2012) config.guess about HarmonyOS: uname -s reports
      HarmonyOS on OHOS, which the script did not recognize, so configure fell
      back to an unusable host triple.
    patch_type: "portability"
  - patch_file: "patches/0002-config.sub.patch"
    patch_description: >-
      Accept the linux-ohos OS component in config.sub so that the
      aarch64-unknown-linux-ohos triplet produced by config.guess is a valid
      canonical host triple.
    patch_type: "portability"
  - patch_file: "patches/0003-configure.patch"
    patch_description: >-
      Create configure's temporary config.status directory with umask 022
      instead of 077: on HMDFS setgid directories a 0700 mode is not usable by
      the build, which made configure fail while writing config.status.
    patch_type: "portability"
  - patch_file: "patches/0004-src-Makefile.in.patch"
    patch_description: >-
      Spell the upstream link flag as -Wl,--export-dynamic.  The release
      tarball's generated src/Makefile.in sets AM_LDFLAGS to a bare
      -export-dynamic, which the GCC driver accepts but the OHOS clang driver
      forwards to the linker, where it is parsed as "-e xport-dynamic" (lld
      then warns "cannot find entry symbol xport-dynamic" and leaves the
      ELF entry point unset, so every invocation dies with SIGSEGV before
      main()).  Only the generated Makefile.in is patched; Makefile.am is
      left alone so that the shipped pre-generated Autotools files stay
      usable without automake.
    patch_type: "portability"
  - patch_file: "patches/0005-src-main.c.patch"
    patch_description: >-
      Add the headless -S/--selftest entry point used by the HarmonyOS PC
      package test: HarmonyOS PC has no X server, so the GTK window cannot be
      opened; the self test covers the pstr/ptime helpers and the whole
      taskwarrior import path (version gate, task export JSON parsing, tag and
      project extraction) through a stub task command, before gtk_init().
    patch_type: "test"
  - patch_file: "patches/0006-src-pstr.c.patch"
    patch_description: >-
      Fix trim(): upstream moves the trimmed string with
      memmove(str, p, strlen(p)) and therefore does not copy the terminating
      NUL, so any input with leading blanks keeps the tail of the original
      buffer ("  spaced  " becomes "spaceded" instead of "spaced", and a
      blanks-only string never becomes empty).  trim() is the helper
      task_get_version() runs over the output of the taskwarrior executable.
      The defect was found by the headless -S/--selftest added in patch 0005
      and is fixed here so that the packaged self test asserts the documented
      behaviour.
    patch_type: "bugfix"
  - patch_file: "patches/0007-src-tw.c.patch"
    patch_description: >-
      Two taskwarrior/json-c updates: drop the is_error() guard removed in
      json-c >= 0.13 (it was a no-op), and accept the taskwarrior 2.x series
      (2.0 and 2.2+) so that the interface also works with the 2.6.x release
      published in the HarmonyPC artifact repository.
    patch_type: "portability"
