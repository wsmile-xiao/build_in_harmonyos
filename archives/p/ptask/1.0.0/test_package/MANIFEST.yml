package: ptask/1.0.0
homepage: "https://web.archive.org/web/20160608075549/http://wpitchoune.net/blog/ptask/"

upstream_tests_exist: false
upstream_test_audit:
  - source: "ptask-1.0.0 release tarball (tests/)"
    reason: "The release tests/ directory contains only two lint helpers, checkpatch.pl (Linux kernel style checker) and test-cppcheck.sh. There is no test program, no test data and no test framework."
  - source: "tests/Makefile.am (release tarball)"
    reason: "`TESTS=` is empty; the only defined target is `check-local`, which shells out to checkpatch.pl over src/*.c and src/*.h. TESTS is extended with test-cppcheck.sh only when the optional cppcheck program is present (AM_CONDITIONAL(CPPCHECK)). `make check` was executed in this build and produced no behavioural coverage at all: check-TESTS summarised an empty suite (`# TOTAL: 0` / `# XFAIL: 0`) and check-local's `find src -name '*.c' -exec tests/checkpatch.pl ...` failed for every file with 'No such file or directory'. The script itself is shipped and does get located; it starts with `#!/usr/bin/perl -w` and this device has no /usr/bin/perl — perl is only reachable through the harmonybrew path — so execve returns ENOENT and find reports it against the script path. The linter never ran."
  - source: "top level Makefile.am / configure.ac"
    reason: "No AC_CONFIG_TESTDIR, no check_PROGRAMS, no XTEST and no test framework are declared anywhere in the tree."
  - source: "Debian source package ptask 1.0.0 (debian/patches, debian/rules)"
    reason: "The Debian packaging adds no upstream test either; its patches only relax the taskwarrior version check and drop the removed json-c is_error() guard."
  - conclusion: "Upstream ships no functional test suite, so N = 0 with the evidence above; the adaptation adds its own headless tests and does not present them as upstream coverage."
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

test_package_tests:
  - file: test_ptask.sh
    description: "Package presence: bin/ptask is executable, share/ptask/ptask.glade is a GtkBuilder file, the desktop entry, the compiled gsettings schema and the hicolor icon are installed."
    command: "test_ptask.sh <package>/bin/ptask <package>"
  - file: test_ptask.sh
    description: "Upstream CLI contract: --version exits 0 and prints the exact 'ptask 1.0.0' banner; --help exits 0 and documents the upstream and the adaptation options."
    command: "ptask --version ; ptask --help"
  - file: test_ptask.sh
    description: "Argument handling: an unknown option and an unexpected positional argument are both rejected with a non-zero exit status."
    command: "ptask --no-such-option ; ptask unexpected-argument"
  - file: test_ptask.sh
    description: "New headless --selftest: the programmatic checks over the production pstr/ptime helpers and the complete taskwarrior import path (version gate, task export JSON parsing, tag/project extraction) must all pass and the summary must report 'selftest: 23/23 checks passed'."
    command: "GSETTINGS_SCHEMA_DIR=<package>/share/glib-2.0/schemas ptask --selftest"
  - file: test_ptask.sh
    description: "Packaged gsettings schema: the schema compiled into the package is found and loaded by the packaged binary (GSettings schema 'ptask' found)."
    command: "GSETTINGS_SCHEMA_DIR=<package>/share/glib-2.0/schemas ptask --selftest"
  - file: test_ptask.sh
    description: "No-display error path: without an X server (the HarmonyOS PC reality) the GUI launch must fail closed with the GTK display diagnostic, proving the packaged binary loads and initialises the GTK3/GLib stack it links."
    command: "DISPLAY=:99 GDK_BACKEND=x11 ptask -f"
  - file: test_ptask.sh
    description: "HarmonyOS packaging facts: the executable carries exactly one ELF .codesign section and links against libgtk-3."
    command: "readelf -SW <package>/bin/ptask ; readelf -d <package>/bin/ptask"

test_scenario_count: 7
assertion_count: 37
assertion_count_basis:
  shell_harness: 14
  package_presence: 5
  upstream_cli_contract: 2
  argument_handling: 2
  adaptation_selftest: 1
  packaged_gsettings_schema: 1
  no_display_error_path: 1
  harmonyos_packaging_facts: 2
  selftest_internal_checks: 23
  notes: >-
    The shell harness performs 14 assertions (5 package presence, 2 upstream
    CLI contract, 2 argument handling, the --selftest exit status plus its
    ok/FAIL line counts, 1 packaged gsettings schema assertion, 1 no-display
    error path and 2 ELF section checks) and the 23 individual checks printed
    by `ptask --selftest` are counted separately, giving 37 in total.  The
    14 + 23 = 37 split was reproduced on the device run whose log is quoted in
    reports/test-report.md.
