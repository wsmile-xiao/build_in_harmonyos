software: ptask
display: "ptask — GTK+ 3 task manager for Taskwarrior"
description: "ptask is a GTK+ 3 graphical user interface for managing taskwarrior tasks"
category: productivity
homepage: "https://web.archive.org/web/20160608075549/http://wpitchoune.net/blog/ptask/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "ptask 1.0.0 is Jean-Philippe Orsini's GTK+ 3 taskwarrior client (the Debian/Ubuntu/AUR 'ptask' source package); it is NOT glipari/ptask, the POSIX real-time periodic task library, which has no 1.0.0 release (its latest version is 0.5 and it has no tags at all)"
    - "The upstream web site (wpitchoune.net) is dead and Debian marks its watch file Untrackable; the pristine upstream release tarball is taken from the Ubuntu archive and its sha256 matches the Debian/Kali/mirrors.kernel.org copies byte for byte"
    - "Builds from the release tarball with its shipped Autotools files (no autoreconf)"
    - "Adds OHOS support to the 2012 config.guess/config.sub and an HMDFS-safe umask to configure"
    - "PkgConfigDeps rebuilds every .pc from cpp_info, so the recipe restores three things the upstream .pc files carry: the bundled libintl.so in glib-2.0.pc Libs, -I${includedir}/json-c in json-c.pc Cflags, and the glib_compile_schemas variable in gio-2.0.pc"
    - "Upstream src/Makefile.am spells --export-dynamic as a bare -export-dynamic; the OHOS clang driver forwards it to the linker as '-e xport-dynamic', which leaves the ELF entry point unset so every run dies with SIGSEGV before main() — patched to -Wl,--export-dynamic"
    - "src/tw.c drops the json-c is_error() guard removed in json-c >= 0.13 and accepts the taskwarrior 2.x series, so the package works with task/2.6.2 from the artifact repository"
    - "Adds a headless --selftest option (23 production-code checks) because HarmonyOS PC has no X server for GUI testing; it also found that upstream trim() drops the terminating NUL (fixed by a bugfix patch)"
    - "Installs the gschema through upstream's own GSETTINGS_RULES block (make install) and compiles gschemas.compiled itself, because that rule skips the compile step whenever DESTDIR is set; glib-compile-schemas is an unsigned ELF inside the Conan package and must be copied into the build tree and self-signed before it can run on OHOS"
  common_dependencies:
    - gtk
    - libx11
    - libxext
    - json-c
    - task

versions:
  "1.0.0":
    status: built
    build_date: "2026-10-06"
    conan_ref: "ptask/1.0.0"
    note: "GTK3 taskwarrior client; runtime GUI requires a display server which HarmonyOS PC does not provide — delivered and verified at compile/link level plus the headless self test; taskwarrior (task/2.6.2) is a runtime requirement"
