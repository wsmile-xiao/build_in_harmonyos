# conandata.yml — pytorch 2.13.0
# Official PyTorch source tarball. GitHub release tarballs do NOT bundle the
# third_party git submodules; the recipe's build() populates the required
# submodules from their official per-commit codeload archives (see conanfile).

sources:
  url: "https://github.com/pytorch/pytorch/archive/refs/tags/v2.13.0.tar.gz"
  sha256: "b36fbbc96f89185666047c44167e7f8ebc9cadaf7a3e7ef75c85d25b1285c0b4"

patches:
  - patch_file: "patches/0001-pytorch-ohos-adapt.patch"
  - patch_file: "patches/0002-cpuinfo-ohos.patch"
  - patch_file: "patches/0003-sleef-ohos-aarch64.patch"
  # c10/util/Enumerate.h uses ssize_t without including <sys/types.h>; musl does
  # not provide it transitively (glibc does), so c10_Enumerate_test fails to
  # compile. Test-infrastructure fix, no behaviour change.
  - patch_file: "patches/0004-c10-enumerate-ssize-musl.patch"
  # googletest CapturedStream hardcodes /tmp, which is read-only on HarmonyOS
  # PC, so every death test aborts (c10_exception/logging/nofatal/small_vector).
  # Use testing::TempDir() so TEST_TMPDIR/TMPDIR is honored, as on Android.
  - patch_file: "patches/0005-googletest-captured-stream-tmpdir.patch"
  # The Conan toolchain pins CMAKE_CXX_STANDARD to the profile value (17) and
  # pytorch's project-wide CACHE assignment cannot override it, while the
  # upstream tests are written for the C++20 baseline (std::unordered_set and
  # std::set .contains) -> c10_DispatchKeySet_test / c10_ThreadLocalDebugInfo_test
  # fail to compile. Request C++20 for the c10 test targets only; the library
  # targets keep the toolchain standard.
  - patch_file: "patches/0006-c10-test-targets-cxx20.patch"
