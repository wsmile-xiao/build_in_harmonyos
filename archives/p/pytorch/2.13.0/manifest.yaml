knowledge_gained:
  - "pytorch 源码 tarball 不含 37 个 third_party 子模块，需按 pinned commit 从 codeload 逐个子模块补齐；本环境 codeload 被阻断，改用 gh-proxy.com 镜像（ghfast.top 对 cutlass 等大 repo 限速）"
  - "pybind11 绑定包按 cpp 适配（R47 D.4-2）；pytorch 产出 C++ libtorch（libtorch.so/libtorch_cpu.so/libc10.so），非 python 包"
  - "CMAKE_SYSTEM_NAME 用 HarmonyOS 时 CMake 不生成 SONAME（NEEDED 记相对路径 ../lib/xxx 无法解析）；改 OHOS + 不设 SOVERSION → 纯名 SONAME，musl 可加载"
  - "HMDFS 上 cmake --install 写入的 .so 无法被 musl mmap(PROT_EXEC)（Permission denied），需在 package() 从 build 目录复制 .so 覆盖"
  - "交叉编译需 tool_requires clang/22.1.8（SDK 仅 clang 15 不满足 pytorch Clang>=16），保留 SDK libc++15（__n1 ABI）+ -D__MUSL__"
  - "CI worker 沙箱不允许从 conan 缓存路径加载 .so（HMDFS 执行限制），且 musl 命中不可加载的候选后不再回退；libc++/zlib 等宿主库必须走 /system/lib64 等平台路径（环境变量 LD_PRELOAD 也无效），故工具链须显式固定 LD_LIBRARY_PATH 到平台目录"
  - "CMake 的 LINK_WHAT_YOU_USE（pytorch 顶层默认开启 CMAKE_LINK_WHAT_YOU_USE TRUE）会在每次链接后调用 ldd；OHOS 无 ldd，需提供 readelf 实现的 ldd 兼容 shim 并设置 CMAKE_LINK_WHAT_YOU_USE_CHECK，否则所有链接目标失败（Error running 'ldd'）"
  - "上游测试集成方式：主构建 BUILD_TEST=OFF，build() 末尾重新配置 -DBUILD_TEST=ON 并按上游 c10/test/CMakeLists.txt 的 file(GLOB_RECURSE) 口径发现并构建全部 c10_* 目标（51 个），再用 ctest -R 执行；既保持包内容不含测试二进制，又能让上游用例以与库完全相同的工具链运行（test/cpp 全量 2700 宏等因编译量超 CI 预算未接入）"
  - "HarmonyOS PC 的 /tmp 只读：googletest CapturedStream 在非 Android/iOS 分支硬编码 \"/tmp/\"，导致所有 death test（EXPECT_DEATH）在 OHOS 上 abort；上游仅 Android 分支用 testing::TempDir() 读 TEST_TMPDIR/TMPDIR。需补丁改为 TempDir() 并在 ctest 前设置可写 TEST_TMPDIR"
  - "musl 不透传提供 ssize_t：c10/util/Enumerate.h 使用 ssize_t 但未 include <sys/types.h>（glibc 下经其它头传递可见），交叉编译到 OHOS/musl 时编译失败；同类 POSIX 类型头文件依赖在 musl 移植时需逐个补 include"
  - "conan_toolchain.cmake 以普通变量 set(CMAKE_CXX_STANDARD <profile cppstd>)，会遮蔽下层的 CACHE 写法，故 pytorch 顶层 set(CMAKE_CXX_STANDARD 20 CACHE ...) 在 compiler.cppstd=17 的 profile 下不生效；上游测试按 C++20 基线编写（std::unordered_set/.contains），需对测试目标单独设 CXX_STANDARD 20（不影响库目标，避免全量重编）"
  - "在既有构建目录里重新 configure 时改全局 CMAKE_CXX_STANDARD 会导致所有目标 flag 变化并触发全量重编（torch_cpu 数千文件）；给单个目标设 CXX_STANDARD 属性可只影响该目标，是增量接入上游测试的正确做法"
  - "cmake_dependent_option(INSTALL_TEST ... ON \"BUILD_TEST\" OFF)：BUILD_TEST=ON 会使 INSTALL_TEST 自动变 ON，从而让 c10/test 与 c10/benchmark 的 install() 规则全部生效；只构建测试目标而未构建 benchmark 时，package() 的 cmake.install() 会因找不到 bin/c10_intrusive_ptr_benchmark 而失败，需显式 -DINSTALL_TEST=OFF"
