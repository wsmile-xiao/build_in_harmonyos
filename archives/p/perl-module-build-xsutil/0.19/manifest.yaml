software: perl-module-build-xsutil
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.19/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.19"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/H/HI/HIDEAKIO/Module-Build-XSUtil-0.19.tar.gz"

  # 源码校验和
  sha256: "9063b3c346edeb422807ffe49ffb23038c4f900d4a77b845ce4b53d97bf29400"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: perl-modulebuild

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl-modulebuild
  system: perl-modulebuild

  # 配置选项列表
  configure_options:
    - "perl Build.PL --install_base=$DEFAULT_PREFIX"
    - "./Build"
    - "./Build install"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - perl-module-build/0.4234

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-ohos-linker-flags.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Pure Perl module (Module::Build subclass), no XS compilation for this module itself"
  - "Build.PL + ./Build + ./Build install workflow"
  - "OpenHarmony ld.lld does not support -fstack-protector-strong in ldflags/lddlflags (compiler flag, not linker flag)"
  - "ExtUtils::CBuilder reads config values from hash directly, bypassing Module::Build::Config->get() method"
  - "Module::Build caches have_c_compiler() result in _have_c_compiler property during SUPER::new(), must clear cache after config fix"
  - "OpenHarmony system libraries (libc, libunwind) need explicit -L paths: -L/system/lib64 -L$HOME/usr/local/lib"
  - "musl headers need explicit -I path: -I$HOME/usr/local/include"
  - "SELinux HMDFS restriction: XS .so files can only be loaded from hnp_file type (system directory), not hmdfs:s0 (user directory)"
