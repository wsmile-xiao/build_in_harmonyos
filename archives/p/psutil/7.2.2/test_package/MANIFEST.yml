# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: psutil/7.2.2
homepage: "https://github.com/giampaolo/psutil"

# 上游测试命令 — 上游 Makefile 的 RUN_TEST 为：
#   PYTHONWARNINGS=always PYTHONUNBUFFERED=1 PSUTIL_DEBUG=1 PSUTIL_TESTING=1 \
#     PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 <python> -m pytest
# 等价的最简跑法即 `python3 -m pytest tests`；本配方另加两个必需参数（见下）。
upstream_check_command: "python3 -m pytest tests -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest tests -q --no-header -p no:cacheprovider -p instafail --ignore=tests/test_sudo.py --deselect 'tests/test_linux.py::TestProcess::test_open_files_mode' -rf --basetemp=<build_folder>/pytest-basetemp（cwd=源码根；测试依赖自平台 pip 镜像取到 <build_folder>/test-deps 后置于 PYTHONPATH；串行，全套约 33 秒）"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/
    source: psutil-7.2.2/tests/
    description: >-
      上游 pytest 套件（test_linux / test_process / test_system / test_posix /
      test_connections / test_contracts / test_misc / test_memleaks /
      test_unicode / test_scripts / test_testutils / test_process_all 等），
      实测收集 **700 项**（含 parametrize 展开）
    command: "python3 -m pytest tests -q"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_psutil.py
    description: >-
      消费者视角真实 API（R34）：版本、**C 扩展 .so 真实 dlopen**（验证 HMDFS
      签名）、平台映射（LINUX/POSIX）、cpu_count/cpu_times、virtual_memory、
      swap_memory、pids（含自身 pid）、Process 的 name/status/memory_info/
      cpu_times、disk_usage/disk_partitions、net_if_addrs/net_io_counters、
      boot_time、users() 守卫类型、STATUSES 常量
    command: "python3 test_psutil.py <site-packages-dir>"

# 测试断言总数（实测计数，非近似值）
#   实测 `psutil 7.2.2 consumer API: 18/18 passed`（运行时硬失败点总数，
#   任一条失败即 sys.exit(1)）。
assertion_count: 18

# 上游测试实测结果（R51 如实申报）
upstream_test_note: >-
  上游 pytest 套件在 build() 内真实运行，实测收集 700 项；逐项结果以
  <build_folder>/upstream-pytest-report.txt 为准。
  实测口径（2026-09-19，profile ohos-aarch64）：**152 failed, 278 passed,
  279 skipped, 1 deselected, 1 error**（串行 33 秒；失败计数在多轮间有
  149/152/160 的小幅波动，允许清单按多轮并集给出）。
  失败**全部**为 OHOS 系统接口收紧所致，已按四类根因逐项归因并入
  ALLOWED_TEST_FAILURES：① /proc 以 hidepid=invisible 挂载（读其它进程
  /proc/<pid>/* 一律 Permission denied）；② OHOS 无 /proc/self/fdinfo、
  /proc/filesystems、/proc/net/tcp、/sys/block 等语义文件，且 AF_UNIX bind
  返回 EPERM；③ 内核版本串 'HongMeng Kernel 1.12.0' 无数字前缀；
  ④ OHOS 自有 smaps 段 [anon:native_heap:meta] 不被解析器识别。
  **不是"缺依赖"，也不是适配缺陷**。
  另有 2 项会毁掉整个 run（非仅失败一项），已在命令行排除并逐条给出实测
  复现方式：tests/test_sudo.py（clock_settime 触发 seccomp SIGSYS(31) 硬杀
  进程）整体 --ignore；test_open_files_mode（因缺 fdinfo 导致上游 giveup
  判定落在空 for 循环体内 → 无限循环）单独 --deselect。
  **未豁免任何清单外失败**：suite 退出码非 0（含超时）时 conan create 直接
  抛 ConanException 失败，避免"测试没跑通但构建成功"的状态脱节。
  测试依赖（pytest>=6 / pytest-instafail / pytest-xdist / psleak）未发布到
  ohpcd（PF4 禁止写成 test_requires），故构建期从平台 pip 镜像取到
  <build_folder>/test-deps 后作为 PYTHONPATH 运行；取依赖失败则显式抛错并
  附 pip 尾部输出，不以"跳过"冒充通过。
