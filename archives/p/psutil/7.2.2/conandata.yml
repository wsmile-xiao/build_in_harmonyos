# conandata.yml — psutil 7.2.2
# 源码来自 PyPI 官方托管（R39 合规，单一官方 URL，镜像由 CI 自动加）
# sha256 取自 PyPI JSON API 的 sdist digests 字段

sources:
  url: "https://files.pythonhosted.org/packages/aa/c6/d1ddf4abb55e93cebc4f2ed8b5d6dbad109ecb8d63748dd2b20ab5e57ebe/psutil-7.2.2.tar.gz"
  sha256: "0746f5f8d406af344fd547f1c8daa5f5c33dbc293bb8d6a16d80b4bb88f59372"

patches:
  - patch_file: "patches/0001-ohos-linux-platform-support.patch"
    patch_description: >-
      Add OHOS support: map sys.platform "ohos" onto the Linux branch (psutil's
      setup.py otherwise exits with "platform ohos is not supported"); use libc
      <net/if.h> instead of <linux/if.h> to avoid a sockaddr_storage
      redefinition against the OHOS sysroot; guard out the POSIX users module
      (OHOS sysroot has no <utmpx.h>) via a new PSUTIL_OHOS macro
    patch_type: "portability"
