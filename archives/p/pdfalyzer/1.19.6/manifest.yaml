software: pdfalyzer
# 版本级 manifest
# 文件位置: archives/p/pdfalyzer/1.19.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "1.19.6"
status: published
build_date: "2026-05-25"

source:
  url: "https://pypi.org/packages/source/p/pdfalyzer/pdfalyzer-1.19.6.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: python
  configure_options:
    - "pip install --target=$DESTDIR_SITE_PKGS -i https://pypi.tuna.tsinghua.edu.cn/simple/ pdfalyzer==1.19.6"
  dependencies:
    - "yara-python/4.5.4"
    - "yaralyzer/1.3.17"
    - "anytree/2.13.0"
    - "pypdf/6.6.0"
    - "rich/14.2.0"
    - "poetry-core/2.4.1"
  cc: ""
  cxx: ""

patches_applied: []

knowledge_gained:
  - "Python包使用 pip install --target DESTDIR 模式安装，而非传统的 make install DESTDIR"
  - "pip --prefix 与 --home 不兼容（Cannot set --home and --prefix together），需用 --target 替代"
  - "yara-python 是 C 扩展，需从源码编译 libyara，耗时约7分钟"
  - "PyPI 官方源下载可能超时，建议使用清华镜像 pypi.tuna.tsinghua.edu.cn"
