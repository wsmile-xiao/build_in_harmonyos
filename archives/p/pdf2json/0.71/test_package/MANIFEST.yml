# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pdf2json/0.71
homepage: "https://github.com/flexpaper/pdf2json"

# 上游测试命令
upstream_check_command: "make check"

# pdf2json 没有 make check 测试套件
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: conanfile.py
    description: "运行 pdf2json -v 验证二进制功能正常"
    command: "conan test"

# 测试断言总数
assertion_count: 1
