software: perl-mime-base64
# 版本级 manifest
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.16"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶层字段，G4门禁检查）
build_system: perl-xs

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.cpan.org/modules/by-module/MIME/MIME-Base64-3.16.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: perl-xs
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX"
  dependencies:
    - perl/5.42.0
    - extutils-makemaker/7.76
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 运行时部署
# ============================================================

runtime_deployment:
  # 系统目录已有同名模块 (3.16_01)
  # 编译产物的 .so 安装到用户目录后因 HMDFS SELinux 限制无法 dlopen
  # 正确使用方式: 安装到 /data/service/hnp/ (hnp_file SELinux context)
  system_path: "/data/service/hnp/perl.org/perl_5.42.0/lib/5.42.0/aarch64-linux/"
  hnp_package: "packaging/perl-mime-base64-3.16.hnp"
  note: "系统预装版本 3.16_01 可直接使用；自定义安装需 HNP 包部署到系统目录"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Perl XS 模块使用 perl Makefile.PL 而非 configure 构建"
  - "HMDFS SELinux 限制: hishell_hap 域只能 dlopen hnp_file 类型的 .so，无法加载 hmdfs:s0 类型的用户目录 .so"
  - "用户目录中编译安装的 .so 会影子加载系统目录中的同名模块，需移除用户目录 .so 才能使用系统版本"
  - "系统预装的 Perl 5.42.0 已包含 MIME::Base64 3.16_01，功能完整可用"
  - "HNP 包格式 (zip) 用于将 .so 部署到 /data/service/hnp/ 系统目录"
  - "Base64.so 编译产物: ELF64 AArch64, 依赖 libc.so, BIND_NOW, 含 .codesign 签名段"
