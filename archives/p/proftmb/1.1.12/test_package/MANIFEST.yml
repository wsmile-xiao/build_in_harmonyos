# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# proftmb 1.1.12 上游测试：无。顶层与 src/Makefile.am 只声明 bin_PROGRAMS/
# dist_pkgdata_DATA/dist_man_MANS 等，无 check 目标、无 tests/ 目录、无
# TESTS/check_PROGRAMS。automake 的 canonical 空 `make check` 实测输出
# "Nothing to be done for 'check'" 且 exit 0 —— 上游不存在自动化测试入口。

package: proftmb/1.1.12
homepage: "http://rostlab.org/"

# 上游测试命令 (make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (上游无自动化测试：无 tests/ 目录、无 check 程序)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制; 均为本次适配
# 新增的 HarmonyOS 消费者用例)
test_package_tests:
  - file: test.sh
    description: "HarmonyOS 消费者用例 HC-1 — 调用已安装 proftmb 二进制执行 --version，断言上游版本 banner（验证 ELF 签名可执行 + musl 加载器 + gsl/libc++ 共享库闭包）"
    command: "bash test.sh"
  - file: test.sh
    description: "HarmonyOS 消费者用例 HC-2 — @options 加载 Swiss8.arch/Swiss8.params/StateRedux4 等全部模型数据，-d 覆盖 options 硬编码的 //share/proftmb，对上游样例 PSSM example.Q 完整跑通 HMM 预测流程，断言 Successfully finished Prediction"
    command: "bash test.sh"
  - file: test.sh
    description: "HarmonyOS 消费者用例 HC-3 — 预测输出（tabular + 逐残基 .dat）与上游随源码发布的参考输出 example_proftmb_tabular.txt / example_dat.txt 逐字节比对（cmp）"
    command: "bash test.sh"

# 上游测试断言总数 (上游 0 + test_package 消费者判定 3：HC-1/HC-2/HC-3 各一项 report 判定)
assertion_count: 3
