patches_applied: []

knowledge_gained:
  - "HarmonyOS 动态加载器不跟随符号链接解析 DT_NEEDED：gsl 包安装的 libgsl.so.28 -> libgsl.so.28.0.0 软链会让 proftmb 运行期报 Error loading shared library；配方在 package() 把实体 .so 摊平拷入 <pkg>/lib 并用 patchelf 设 RUNPATH=$ORIGIN/../lib（ref: E050）"
  - "OHOS HMDFS 拒绝 execve 未签名 ELF（Permission denied / Operation not permitted），需 binary-sign-tool sign -selfSign 1 自签名；工具链在链接期已插入空 .codesign 段导致 sign 报 WriteCodeSignBlock already exists 退出 1，须先 objcopy --remove-section=.codesign 剥离再签；且签名产物丢失可执行位，须 chmod +x 恢复，否则 shell 报 can't execute: Permission denied（ref: E077，适配实测补充 objcopy 剥离与 chmod 两步）"
  - "proftmb 顶层 src/Makefile 直接调用 help2man 而非 $(HELP2MAN)，OHOS 无该工具导致 man 页步骤失败；HELP2MAN=/bin/true 传参不够，需在 PATH 前置 no-op help2man wrapper 解析 --output= 生成最小 man 页（ref: E289）"
  - "toybox sed 不支持 --in-place，顶层 Makefile install 规则的 sed --in-place 会失败；在 build() 把该规则改写为 sed -e … > tmp && mv 临时文件方案（ref: E010，适配实测）"
  - "proftmb 的 configure 用 AC_CHECK_LIB(opt)/AC_CHECK_HEADER(gsl/gsl_errno.h) 探测依赖，AutotoolsToolchain 不下发依赖 -I/-L，须在 build() 显式向 CPPFLAGS/LDFLAGS 拼接依赖 includedirs/libdirs 后再 configure（ref: 适配实测）"
  - "上游 options 文件把 -d 硬编码为 //share/proftmb 且 -s/-t 等 默认空串：不带 @options 运行时 ReadStatic 会把数据目录本身当 arch 文件打开，报 ReadMap: Reached EOF without an ENDRECORD；消费者须以 @options -d <datadir> 次序调用（ref: 适配实测）"
  - "上游老 tarball 的 autotools 助手脚本缺执行位（install-sh/missing=644）：本地 PATH 有 pip coreutils 时 MKDIR_P 探测为 mkdir -p 掩盖问题，CI worker PATH 无 coreutils 时 AC_PROG_MKDIR_P 回退 install-sh -c -d，make install execve 644 脚本报 Permission denied；build() 须对 configure/config.guess/config.sub/install-sh/missing/depcomp 等已知 helper 恢复执行位（ref: E490，CI #65812 实证）"
  - "HMDFS 工作树上 conanbuild.sh 注入的 CONFIG_SHELL=hnp bash 读 stdin（cat -）失败，config.status 报 could not setup config files machinery；须在 build() 把 conanbuild.sh 尾部追加 export CONFIG_SHELL/SHELL=/system/bin/sh（buildenv 在其后 source，只有尾部追加生效）；/storage 挂载点不触发、el2 cache worktree 复现（ref: E386，适配实测）"

