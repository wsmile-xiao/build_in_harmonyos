software: proftmb
display: "proftmb"
description: "ProfTMB — Profile fed HMM 预测器，从 PSSM 序列谱预测革兰氏阴性菌外膜 β 桶蛋白的跨膜区"
category: bioinformatics
homepage: "http://rostlab.org/"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "configure 用 AC_CHECK_LIB(opt)/AC_CHECK_HEADER(gsl/gsl_errno.h) 探测依赖，AutotoolsToolchain 不下发 -I/-L，build() 显式拼 CPPFLAGS/LDFLAGS"
    - "src/Makefile 直接调用 help2man（非 $(HELP2MAN)），PATH 前置 no-op wrapper 生成最小 man 页（E289）"
    - "toybox sed 不支持 --in-place，顶层 Makefile install 规则改临时文件方案（E010）"
    - "OHOS musl 加载器不跟随符号链接解析 DT_NEEDED：gsl 的 libgsl.so.28/libgslcblas.so.0 摊平为实体副本拷入 <pkg>/lib，patchelf 设 RUNPATH=$ORIGIN/../lib（E050）"
    - "HMDFS 拒绝 execve 未签名 ELF：binary-sign-tool sign -selfSign 1 自签名；先 objcopy 剥离工具链插入的空 .codesign 段，签名后 chmod 恢复可执行位；patchelf 必须在签名前（E077）"
    - "上游 options 文件 -d 硬编码 //share/proftmb，消费者须 @options -d <datadir> 次序调用"
  common_dependencies:
    - "opt"
    - "gsl"

versions:
  "1.1.12":
    status: built
    build_date: "2026-09-30"
