software: perl-net-cidr
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.27-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.27-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/M/MR/MRSAM/Net-CIDR-0.27.tar.gz"

  # 源码校验和
  sha256: "9e950fef4422264dc8efab30dbbd3ce2be125e61b3f5c50111d15506d3b570e3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块的 conanfile.py 不需要 compiler 和 build_type 设置，只需 settings = os, arch 即可避免 settings.os.cpu 错误"
  - "纯 Perl 模块不受 SELinux/HMDFS 限制，可直接安装使用，无需管理员权限"
  - "Net::CIDR 0.27 在 OpenHarmony aarch64 上性能优异: 30834 ops/s (range2cidr)"
  - "Conan profile os=Linux 在 settings.yml 中没有 cpu 子属性，包含 compiler 设置的 conanfile 会触发此错误"
