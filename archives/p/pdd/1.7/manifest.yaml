# 版本级 manifest — pdd 1.7

version: "1.7"
software: "pdd"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-18"
build_system: custom

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 PyPI sdist（版本化归档，files.pythonhosted.org 为 PyPI 官方 CDN，
  # 同 python-dateutil/2.9.0.post0 先例）
  url: "https://files.pythonhosted.org/packages/97/bb/c36c635fb76dd41f153adcbc43cc4f39208a6bee9be0dcac926d7af85b6e/pdd-1.7.tar.gz"

  # 源码校验和（SHA-256，本地复算与 PyPI 记录逐字一致）
  sha256: "c532faf070fc98c5d1e81df953450f54dc8d96b243fbe06a29c5c979182113a5"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: custom

  # 配置选项列表（纯 Python 包：staging 复制 + console_scripts launcher）
  configure_options:
  - "staging copy pdd.py -> lib/python3.12/site-packages/"
  - "generate bin/pdd launcher (setup.py entry_points: pdd = pdd:main)"

  # 编译依赖列表（格式: name/version）
  dependencies:
  - "python-dateutil/2.9.0.post0"

  # 编译器（纯 Python，无 C 扩展，无编译器参与）
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "pdd 为纯 Python 单文件 CLI（py3-none-any wheel），无 C 扩展，application 类型打包"
- "上游 setup.py entry_points console_scripts: pdd = pdd:main；sdist 内只有 pdd.py（无 pdd 可执行文件），launcher 需自生成"
- "运行时依赖 python-dateutil（裸名无版本下限）→ 传递 six/1.17.0；两者 ohpcd 均已发布可消费"
- "python-dateutil（python-require 类型）未导出 runenv PYTHONPATH，消费方需代为传播或显式收集依赖 site-packages"
- "上游测试 test.py 为 pytest 参数化 15 用例，期望输出与 TZ/locale 无关，在 OHOS aarch64 全量通过"
- "OHOS 无 --version 类参数命令的 staging 校验不适用 .staging-verified 标记（legacy autotools driver 专属）"

# ============================================================
# 本地验证（validation 段为纯文档，scripts 不消费；数值抄自真实日志）
# ============================================================

validation:
  local:
    conan_create: passed
    conan_verify: passed
    test_package: passed
    upstream_tests: passed
    reason: "本地全绿：conan create EXIT=0（15+3 检查全过）；上游 pytest 15/15；详见 reports/（不入库）"
  ohos:
    platform: "OHOS aarch64 (HarmonyOS, HongMeng Kernel 1.12.0)"
    python: "Python 3.12.9（/data/storage/el1/bundle/libs/arm64/python/bin/python3）"
    notes: "纯 Python 包，musl/libc 差异不触及；dateutil/six 经 conan 依赖链交付，import 真实可达"
