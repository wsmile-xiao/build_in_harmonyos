package: pdd/1.7
homepage: "https://github.com/jarun/pdd"

upstream_check_command: "python3 -m pytest test.py"
upstream_test_in_build: true
upstream_test_command: "python3 -m pytest test.py -v"

upstream_tests:
- name: test.py（pytest 参数化 15 用例：日期差/时间差/加/减/闰年边界）
  count: 15
  description: "**实测 15 passed / 0 failed / 0 skipped / 0 xfailed（pytest 9.1.1，platform ohos，Python 3.12.9）**——python3 -m pytest test.py -v 在 OHOS aarch64 真实执行，EXIT=0；期望输出与 TZ/locale 无关；执行前置：sdist 仅含 pdd.py，测试以 ./pdd 调用故需 cp pdd.py pdd && chmod 755 pdd（不修改上游代码）；pytest 为测试期工具临时 pip 装入 .workbuddy/tmp（不入库不进包）"

test_package_tests:
- file: test_pdd.py
  description: "OHOS 消费者测试（纯 stdlib）：上游等价 6 用例 + 鸿蒙可行性 3 用例（test_ohos_platform 平台断言 / test_ohos_consumer_entrypoint launcher 自定位直调 / test_ohos_dateutil_from_conan 依赖经 conan 交付可 import）"
  command: "python3 test_pdd.py <bin/pdd> <site_all> <site_deps> <dateutil_site>"

assertion_count: 9
