software: pdd
display: "pdd"
description: "Tiny date, time diff calculator with timers — 纯 Python 日期/时间差计算器"
category: utilities
homepage: "https://github.com/jarun/pdd"
license: GPLv3
build_system: custom

ohos_adaptation:
  key_points:
  - "纯 Python 单文件 CLI（py3-none-any），application 类型，无 C 扩展/编译器参与"
  - "sdist 无 pdd 可执行文件，需按 setup.py entry_points（pdd = pdd:main）自生成 bin/pdd launcher（自定位 site-packages）"
  - "python-dateutil（python-require）未导出 runenv PYTHONPATH，本包 package_info 代为传播依赖 site-packages"
  common_dependencies:
  - "python-dateutil/2.9.0.post0"

versions:
  "1.7":
    status: built
    build_date: "2026-09-18"
    published_as: pdd
    source_url: "https://files.pythonhosted.org/packages/97/bb/c36c635fb76dd41f153adcbc43cc4f39208a6bee9be0dcac926d7af85b6e/pdd-1.7.tar.gz"
