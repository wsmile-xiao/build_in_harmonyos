software: postgresql-timescaledb
version: "2.27.2"
status: built
build_system: cmake
build_date: "2026-06-10"

source:
  url: "https://github.com/timescale/timescaledb/archive/refs/tags/2.27.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DPG_CONFIG=/storage/Users/currentUser/usr/local/bin/pg_config"
    - "-DSEND_TELEMETRY_DEFAULT=false"
    - "-DREGRESS_CHECKS=OFF"
    - "-DUSE_OPENSSL=0"
  dependencies:
    - "postgresql/17.10"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "TimescaleDB 2.27.2 编译需要 PG 15-18, 当前 PG 17.10"
  - "需要将 PG 的 pg_config 和头文件库文件安装到 ~/usr/local/"
  - "PG 编译时未带 OpenSSL 支持, 需使用 -DUSE_OPENSSL=0 编译 TimescaleDB"
  - "HMDFS 文件系统不允许 cp 覆盖已有文件, 需 rm -f 后再 cp"
  - "TimescaleDB 2.27.2 的 cmake 支持 PG17"
