software: postgresql-hll
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.19/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.19"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/citusdata/postgresql-hll/archive/refs/tags/v2.19.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | pgxs
  system: pgxs
  build_system: pgxs

  # 配置选项列表
  configure_options:
    - "USE_PGXS=1"
    - "SQLPP=clang-cpp"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "postgresql/16.4"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "postgresql-hll 使用 PGXS 构建系统（不是标准 autotools），编译命令为 make USE_PGXS=1"
  - "OHOS 平台无 PostgreSQL 预编译包，需从源码编译 PostgreSQL 16.4 获取 pg_config 和 PGXS"
  - "PGXS 扩展需要设置 SQLPP=clang-cpp 以处理 SQL 文件中的预处理器指令"
  - "PostgreSQL config.sub 需手动添加 linux-ohos* 到 kernel-os 验证列表（第1787行）"
  - "HMDFS 文件系统不支持硬链接，PostgreSQL make install 需手动复制关键文件"
  - "pg_config_os.h 是软链接，指向 linux.h，需手动创建 pg_config_os.h -> linux.h 软链接"
  - "postgresql-hll 仅依赖 libc.so，无外部库依赖"
  - "回归测试需要运行中的 PostgreSQL 服务器，编译时跳过"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
