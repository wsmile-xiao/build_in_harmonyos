software: pg_activity
display: "pg_activity"
description: "Command line tool for PostgreSQL server activity monitoring"
category: db
homepage: "https://github.com/dalibo/pg_activity"
license: PostgreSQL
build_system: python

ohos_adaptation:
  key_points:
    - "纯 Python 项目，无 C 扩展，无需平台源码适配"
    - "pip --prefix + --root 冲突，使用 --target 替代 DESTDIR 模式"
    - "PYTHONPATH 在此系统不生效，需创建 .pth 文件"
    - "psycopg/psycopg2 是可选运行时依赖，无 aarch64-ohos 二进制 wheel"
  common_dependencies:
    - attrs
    - blessed
    - humanize
    - psutil
    - psycopg (可选运行时)

versions:
  "3.6.2":
    status: built
    build_date: "2026-06-09"