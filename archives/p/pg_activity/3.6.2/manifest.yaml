software: pg_activity
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/3.6.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "3.6.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# 构建系统类型
build_system: python

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/dalibo/pg_activity/archive/refs/tags/v3.6.2.tar.gz"

  # 源码校验和
  sha256: "8889755212271cc0ec7311d1e51a550cc0821f0b99b93d3e97a13bb5e221c7dd"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: python

  # 配置选项列表
  configure_options:
    - "pip_wheel_target"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "attrs/26.1.0"
    - "blessed/1.44.0"
    - "humanize/4.15.0"
    - "psutil/6.1.1"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "ref:E035 pip --prefix + --root 冲突，需用 --target 替代"
  - "ref:local PYTHONPATH 在此系统不生效，需创建 .pth 文件"
  - "ref:local psycopg/psycopg2 是可选运行时依赖，无 aarch64-ohos wheel"