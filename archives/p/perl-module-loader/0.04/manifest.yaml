software: perl-module-loader
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.04/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.04"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"
compile_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/N/NE/NEILB/Module-Loader-0.04.tar.gz"

  # 源码校验和
  sha256: "d80a5e2f2194f2192d7ccadbf791bcdd804ae3742d38a664b5a40ce87972503f"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build_system: perl-makemaker

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl-makemaker

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "Path-Iterator-Rule/1.015"
    - "Number-Compare/0.03"
    - "Text-Glob/0.11"
    - "Path-Tiny/0.150"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在 OpenHarmony 上可直接编译，无需补丁或特殊参数"
  - "perl-makemaker 构建系统使用 `perl Makefile.PL PREFIX=$DEFAULT_PREFIX` 进行配置，与 autotools 的 ./configure 不同"
  - "G0 clean-verify 脚本不支持 perl-makemaker 构建系统（默认使用 /bin/sh ./configure），需手动验证"
  - "SSL 证书验证失败时可用 curl --insecure 下载 tarball，再 --no-download 初始化"
  - "make test 需要运行时依赖 Path::Iterator::Rule 及其依赖链，需在测试前安装"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
