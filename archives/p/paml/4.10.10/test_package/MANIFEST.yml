# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游 paml 4.10.10 无测试套件（无 make check / tests 目录），
# 但 tarball 自带 examples/ 样例数据（abglobin.nuc + yn00.ctl +
# 参考结果 YN00abglobin.result.txt），test_package 据此做端到端比对。

package: paml/4.10.10
homepage: "https://github.com/abacus-gene/paml"

# 上游测试命令 (已核验: 顶层 Makefile 无 check/test target，无 tests 目录)
upstream_check_command: "make check"
upstream_check_available: false

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "chi2 交互运行并断言 DF=1 p=0.05 临界值 3.8415 出现（实质执行被测包代码路径）"
    command: "printf 'q\\n' | chi2 && grep -q 3.8415 chi2.out"
  - file: conanfile.py + yn00.ctl + abglobin.nuc
    description: "yn00 在 upstream abglobin.nuc 样例（5 序列 x 285 codon）上端到端 ML 运行，断言 ns=5 / ls=285 / NG86 dN/dS=0.2507(0.0863 0.3443) / YN2000 S=183.7 / kappa=1.5804 / LWL85 参考行，全部与上游 YN00abglobin.result.txt 一致"
    command: "yn00 yn00.ctl && grep -E -q '<6 patterns>' yn.result"
  - file: conanfile.py
    description: "校验包内 10 个 CLI 二进制（baseml/basemlg/codeml/evolver/pamp/yn00/mcmctree/infinitesites/chi2/ds）均可执行"
    command: "test -x bin/<tool> for each of the 10 tools"
  - file: conanfile.py + run_tests.sh (Test 4)
    description: "鸿蒙特有：校验 10 个二进制均为原生 OHOS aarch64 ELF 可执行文件（ELF magic 7f454c46 + ELFCLASS64 + e_machine=EM_AARCH64，od 字节级校验，无 readelf 依赖）"
    command: "od byte check ELF magic/class/e_machine for each of the 10 tools"

# 鸿蒙特有测试断言数
ohos_specific_assertion_count: 10

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 27
