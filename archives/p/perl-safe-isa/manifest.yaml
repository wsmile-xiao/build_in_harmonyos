software: perl-safe-isa
display: "Safe::Isa (Perl)"
description: "安全调用 isa/can/does/DOES 于可能非对象的数据"
category: perl
homepage: "https://metacpan.org/dist/Safe-Isa"
license: perl_5
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，使用 ExtUtils::MakeMaker (Makefile.PL) 构建"
    - "无 XS 代码，不受鸿蒙 SELinux .so 加载限制影响"
    - "使用 Scalar::Util::blessed() 判断目标是否为对象，非对象安全返回 false"
    - "参考 perl-dbd-pg 编译经验：纯 Perl 模块无需特殊链接参数"
    - "conanfile.py package_info() 设置 PERL5LIB 环境变量"
  common_dependencies:
    - "perl 5.42.0 (系统预装)"
    - "Scalar::Util (核心模块)"
    - "Exporter >= 5.57 (核心模块)"

versions:
  "1.000010":
    status: published
    build_date: "2026-06-30"
    published_as: perl-safe-isa
    source_url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/Safe-Isa-1.000010.tar.gz"
