software: perl-safe-isa
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.000010/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "1.000010"

# 编译状态: published | built | failed | archived
status: published

build_date: "2026-06-30"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/Safe-Isa-1.000010.tar.gz"
  sha256: "87f4148aa0ff1d5e652723322eab7dafa3801c967d6f91ac9147a3c467b8a66a"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: perl
  build_system: perl
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"
    - "make -j1"
    - "make install DESTDIR=$TEST_PREFIX"
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Pure Perl module using ExtUtils::MakeMaker (Makefile.PL)"
  - "CPAN author: ETHER (Karen Etheridge), original author: MSTROUT (Matt S. Trout)"
  - "License: perl_5 (Artistic or GPL)"
  - "Dependencies: Scalar::Util, Exporter >= 5.57, perl 5.006"
  - "No native compilation needed — pure Perl .pm file"
  - "SSL certificate issue: use curl -k to download from CPAN"
  - "PERL5LIB must include site_perl/5.42.0 path for module resolution"
  - "参考 perl-dbd-pg 编译经验：纯 Perl 模块在鸿蒙平台无需特殊链接参数，仅需标准 Makefile.PL 流程"
  - "参考 perl-dbd-pg 编译经验：XS 模块在 OHOS 上 .so 有加载限制，Safe::Isa 是纯 Perl 不受影响"
  - "test_package 的 conan-init 模板会默认生成 C 文件 (test.c, CMakeLists.txt)，纯 Perl 模块应删除"
  - "Safe::Isa 使用 Scalar::Util::blessed() 判断对象，非 blessed 引用也返回 false（设计如此）"
  - "功能测试 15/15 通过，含原始 CPAN 测试套件 (safe_isa.t, safe_does.t)"
