software: perl-pod-spell
display: "Pod::Spell"
description: "Perl module to format POD for spell-checking — strips POD markup and stopwords, outputs plain text"
category: perl
homepage: "https://metacpan.org/dist/Pod-Spell"
license: Artistic-2.0
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C 编译，无需 CRT 补丁、ELF 签名或 musl BIND_NOW 修复"
    - "依赖 Lingua::EN::Inflect、Class::Tiny、File::ShareDir 等 Perl 模块，需通过 PERL5LIB 提供路径"
    - "File::ShareDir 共享 wordlist 文件需安装到 auto/share/dist/Pod-Spell/wordlist"
    - "与 perl-dbd-pg (XS 模块) 不同，纯 Perl 模块在鸿蒙平台上无需任何平台适配补丁"

versions:
  "1.27":
    status: published
    build_date: "2026-06-25"
