software: perl-pod-spell
version: "1.27"
status: published
build_system: perl-eumm
compile_date: "2026-06-25"
build_date: "2026-06-25"
created_at: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/Pod-Spell-1.27.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: perl-eumm

  configure_options:
  - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX INSTALLDIRS=site"

  dependencies:
  - "perl-class-tiny/1.008"
  - "perl-class-inspector/1.36"
  - "perl-file-sharedir/1.118"
  - "perl-file-sharedir-install/0.14"
  - "perl-lingua-en-inflect/1.905"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_passed: 54
test_failed: 0

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（ExtUtils::MakeMaker），无 XS/C 编译，无需 CRT 补丁、ELF 签名或 musl BIND_NOW 修复 (ref: L3-software-specific)"
  - "File::ShareDir 共享 wordlist 文件需安装到 auto/share/dist/Pod-Spell/wordlist，包含 2431 个停止词 (ref: L3-software-specific)"
  - "与 perl-dbd-pg (XS 模块) 不同，纯 Perl 模块在鸿蒙平台上无需任何平台适配补丁 (ref: L3-software-specific)"
  - "G0 干净构建验证因 toybox tar 不支持 'tar xf' 语法而失败（需 'tar -xf'），这是平台工具限制，不影响软件质量 (ref: L2-build-pattern)"
