# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "MIME::Base32 是纯 Perl 模块，无需 C/XS 编译，OpenHarmony 平台零适配即可编译通过"
  - "与 perl-dbd-pg 等 XS 模块不同，纯 Perl 模块不受 SELinux HMDFS 限制，安装后即时可用"
  - "ExtUtils::MakeMaker 构建系统在 OpenHarmony 上工作正常，perl Makefile.PL + make + make install 标准流程完全兼容"
  - "模块操作基于字节而非字符，UTF-8 文本需先用 Encode::encode() 转换为字节再编码"
  - "模块编码输出不含 = 填充字符，与 RFC 4648 标准格式略有差异但不影响功能"
