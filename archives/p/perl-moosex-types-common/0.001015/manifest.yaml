software: perl-moosex-types-common
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.001015/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.001015"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"

# 构建系统类型
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/MooseX-Types-Common-0.001015.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Build.PL --install_base=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "Module-Build-Tiny/0.052"
    - "MooseX-Types/0.51"

  # 运行时依赖（测试需要）
  runtime_dependencies:
    - "Moose/2.4000"
    - "Params-Util/1.07"
    - "Try-Tiny/0.31"
    - "Dist-CheckConflicts/0.11"
    - "Sub-Exporter/0.988"
    - "Data-OptList/0.114"
    - "Module-Implementation/0.09"
    - "Package-Stash/0.40"
    - "Class-Load/0.25"
    - "Carp-Clan/6.08"
    - "Sub-Exporter-ForMethods/0.000289"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 测试结果
# ============================================================

test_results:
  # 官方测试套件
  official_tests:
    total: 98
    passed: 98
    failed: 0
    files: 8
    result: PASS
  # 功能测试
  functional_tests:
    total: 24
    passed: 24
    failed: 0
    result: PASS

# ============================================================
# 质量门禁
# ============================================================

quality_gates:
  G0_clean_build: "SKIP (脚本不支持 perl Build.PL, 手动验证通过)"
  G1_binary_integrity: PASS
  G2_functional: PASS
  G3_portability: PASS
  G4_archive: PASS

# ============================================================
# 上库评估
# ============================================================

repository_ready: true
repository_ready_reason: "纯 Perl 模块，98/98 测试通过，无 SELinux 限制，可直接上库"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块，使用Module::Build::Tiny构建系统（perl Build.PL + ./Build）"
  - "Moose 依赖链需要 10 个纯 Perl 模块（Params::Util, Try::Tiny, Dist::CheckConflicts, Sub::Exporter, Data::OptList, Module::Implementation, Package::Stash, Class::Load, Carp::Clan, Sub::Exporter::ForMethods）"
  - "Package::Stash 和 Class::Load 使用 PP 实现替代 XS 版本，功能不受影响"
  - "纯 Perl 模块在鸿蒙平台不受 SELinux/HMDFS 限制（与 XS 模块如 perl-dbd-pg 不同）"
  - "安装依赖后全部 98 个官方测试通过，模块功能完整可用"
