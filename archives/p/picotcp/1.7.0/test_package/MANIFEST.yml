package: picotcp/1.7.0
homepage: "https://github.com/TASS-Belgium/picotcp"

upstream_check_command: "make units UNITS=1"
upstream_test_in_build: true
upstream_test_command: "make units UNITS=1 ... units（check 框架套件编译后逐个执行，退出码=失败用例数）"

upstream_tests:
  - name: units（25 个 check 套件二进制：units + modunit_*.elf）
    command: "make units UNITS=1 后逐个执行 build/test/ 下的 25 个套件"
    expected: "pass"
  - name: picoapp/picoapp6 冒烟（test 目标，TEST=1）
    command: "make test TEST=1（依赖 Linux vdeplug 虚拟网络）"
    expected: "平台不可执行：需 vdeplug/vde TAP 网络设备，OHOS 环境无此内核设施"

test_package_tests:
  - file: test.c
