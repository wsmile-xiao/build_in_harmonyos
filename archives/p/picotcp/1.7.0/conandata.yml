# conandata.yml — picotcp 1.7.0

sources:
  url: "https://github.com/tass-belgium/picotcp/archive/refs/tags/v1.7.0.tar.gz"
  sha256: "8d4a2062360abb7e1334192511ffbaf7b2b6d02b8801ae70e9536926d28d8b18"

patches:
  - patch_file: "patches/0001-makefile-unit-flags-conan-hook.patch"
    patch_description: "Unit-test flag lines gain $(CONAN_UNIT_LDFLAGS)/$(CONAN_UNIT_CFLAGS) hooks and drop -lsubunit: the recipe links the check framework from the Conan-provided check/0.15.2 package (built without subunit) while preserving upstream CFLAGS inheritance (module defines such as -DPICO_6LOWPAN_LLS stay in place)"
    patch_type: "portability"
  - patch_file: "patches/0002-modunit-mld-i-redecl.patch"
    patch_description: "check 0.15.2 START_TEST passes an (int _i) parameter; the local 'uint8_t _i' redeclaration in modunit_pico_mld.c fails to compile against it, so the local is dropped and the test uses the framework-provided parameter"
    patch_type: "portability"
  - patch_file: "patches/0003-modunit-igmp-i-redecl.patch"
    patch_description: "Same START_TEST (int _i) incompatibility as 0002, for modunit_pico_igmp.c"
    patch_type: "portability"
