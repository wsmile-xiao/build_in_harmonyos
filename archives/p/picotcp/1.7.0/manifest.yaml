# 版本级 manifest — picotcp 1.7.0
# 遵循 ARCHIVE-SPEC v2.0

version: "1.7.0"
software: "picotcp"

status: built
build_date: "2026-09-17"
build_system: makefile

source:
  url: "https://github.com/tass-belgium/picotcp/archive/refs/tags/v1.7.0.tar.gz"
  sha256: "8d4a2062360abb7e1334192511ffbaf7b2b6d02b8801ae70e9536926d28d8b18"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "CC=<profile clang> AR=llvm-ar"
    - "DEBUG=0 ADDRESS_SANITIZER=0 GCOV=0"
    - "UNITS=1 6LOWPAN=1 IEEE802154=1（仅测试构建；打包库用上游默认模块集）"
    - "UNIT_LDFLAGS/UNIT_CFLAGS 覆盖：接 check/0.15.2、去掉 -lsubunit"
  dependencies:
    - check/0.15.2
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "picotcp 无 configure；根 Makefile 直建静态库，CC/AR/PREFIX 等全部可用 make 命令行变量覆盖"
  - "上游 make clean 只删 PREFIX 树，不清 stack/*.o modules/*.o（编译在树内、完成后 mv 进 PREFIX）——换配置重建必须先清树内 .o"
  - "pico_defines.h 由 mkdeps.sh 生成到 PREFIX/include，打包需带上"
  - "units 目标硬编码链接 modunit_802154/6lowpan，但两模块默认关闭：测试构建需 6LOWPAN=1 IEEE802154=1"
  - "check/0.15.2 包无 subunit，UNIT_LDFLAGS 覆盖去掉 -lsubunit；-lrt 在 OHOS 可用"
