# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: phonon4qt6/4.12.0
homepage: "https://invent.kde.org/phonon/phonon"

# 上游测试命令
upstream_check_command: "ctest -N (no tests registered)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# 清点结论 (R51): 上游源码树 phonon-4.12.0 无 tests/ 目录、
# 无 ctest 注册测试、无单独测试程序；仅 demos/（默认 OFF）。
# 故上游测试数为 0。
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_phonon.cpp
    description: "消费者链接 libphonon4qt6.so 并调用 Phonon 公开 API（phononVersion/BackendCapabilities::availableBackends/availableAudioOutputDevices）"
    command: "./test_phonon4qt6"

# 测试断言总数
assertion_count: 3
