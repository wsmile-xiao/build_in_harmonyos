software: perl-module-metadata

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.000038"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# 构建系统类型: autotools | cmake | meson | makefile | custom-perl
build_system: custom-perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/E/ET/ETHER/Module-Metadata-1.000038.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom-perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0
    - ExtUtils-MakeMaker/7.76
    - version/0.9933
    - Encode/3.21
    - Carp/1.54
    - Fcntl/1.20
    - File-Spec/3.94
    - File-Find/1.44

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Module::Metadata 是纯 Perl 模块，无需编译 XS/C 代码，使用 perl Makefile.PL + make 即可完成安装"
  - "纯 Perl 模块在 OpenHarmony 平台上无需担心 SELinux HMDFS 限制（与 perl-dbd-pg 的 XS 模块不同），模块可直接从 ~/usr/local/lib/perl5 加载"
  - "模块测试套件（9 个文件 385 项测试）在鸿蒙平台上全部通过，包括 taint 模式测试 t/taint.t"
  - "构建系统为 ExtUtils::MakeMaker (Makefile.PL)，与 autotools 不同，使用 DESTDIR 模式 staging 安装时需要 perl Makefile.PL && make && make install DESTDIR=..."
  - "pod() 方法需要 new_from_file 传入 collect_pod => 1 参数才会收集 POD 内容，否则返回 undef"
  - "package_versions_from_directory() 方法可用于批量扫描目录下所有 Perl 模块的版本信息，在鸿蒙平台正常工作"
