software: pg_partman
version: "5.4.3"
status: published
build_date: "2026-06-02"

source:
  url: "https://github.com/pgpartman/pg_partman/archive/refs/tags/v5.4.3.tar.gz"
  sha256: "ad7355874f0a20ae1a3e7dd3b1f0248160e4f2928f4a1d8e3d6e2d92a2a8e5d9"
  tar_format: tar.gz

build:
  system: pgxs
  build_system: pgxs
  configure_options:
    - "USE_PGXS=1"
  dependencies:
    - "postgresql/16.4"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "pg_partman 使用 PGXS 构建系统，编译命令为 make USE_PGXS=1，不需要 configure"
  - "OHOS 平台无 PostgreSQL 预编译包，需从源码编译 PostgreSQL 获取 pg_config 和 PGXS"
  - "HMDFS 文件系统不支持 hardlink，导致 PostgreSQL make install 部分失败，需手动复制 headers"
  - "patch-autotools-ohos.pl 生成的 ohos-linux 块有重复行 bug，需手动 sed 修复"
  - "umask 077 + mktemp 在 HMDFS 创建的目录权限问题，需改用 $TMPDIR + umask 022"
