  - "pdfgen 0.1.0 is a single-translation-unit C library (pdfgen.c + pdfgen.h), zero external dependencies — recipe compiles pdfgen.c directly and archives libpdfgen.a"
  - "upstream tag is '0.1.0' (no v prefix); v0.1.0 returns 404 — W0 exact-tag check must use the real tag name"
  - "upstream Makefile's tests/penguin.c target uses `xxd -i`, but the toybox xxd (0.8.12) on the device emits the byte array WITHOUT the variable declaration line — the generated .c is invalid; regenerating with a small python snippet produces the correct array"
  - "upstream tests.sh needs valgrind/pdftotext/pdftk (absent on device); the artifact asserts were re-expressed first with pypdf locally, then re-implemented as pure-stdlib Python raw-PDF byte checks (CI workers have no pypdf): pdfgen encodes utf8 supplementary chars as single-byte WinAnsi (€ = \\200 octal), control chars as PDF string escapes (\\( \\))"
  - "testprog runs clean on aarch64 OHOS (exit 0); pdf_save output verified as valid %PDF-1.3 with 4 pages"

