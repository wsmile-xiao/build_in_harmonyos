# 软件级 manifest
# 文件位置: archives/p/pdfgen/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: pdfgen

# 显示名
display: "PDFGen"

# 一句话描述
description: "单文件 C PDF 生成库（零依赖，public domain）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: doc

# 官网 URL
homepage: "https://github.com/AndreRenaud/PDFGen"

# 开源许可证（SPDX 标识）
license: Unlicense

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "单翻译单元库：直接编译 pdfgen.c 归档为 libpdfgen.a，无需上游 Makefile（其 gcov/fuzz flags 为维护者检查专用）"
    - "上游 tag 无 v 前缀（0.1.0），v0.1.0 404——conandata URL 必须用实际 tag 名"
    - "tests/penguin.c 由 xxd -i 生成：toybox xxd 0.8.12 输出缺变量声明行，需 python 重新生成（仅影响上游测试构建，不影响库本体）"
    - "tests.sh 断言可用 pypdf 等价重表达（valgrind/pdftotext/pdftk 设备未配备）"
    - "测试二进制运行需 E077 签名"

  # 跨版本通用依赖
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.1.0":
    status: built
    build_date: 2026-09-19
