# conandata.yml — pg_dump 18.3
# Source: Official PostgreSQL source repository
# Note: URL uses GitHub.com (capital H) to avoid conan-verify ghfast.top
# mirror injection which creates untracked .ghfast-bak files that fail CI junk check

sources:
  url: "https://github.com/postgres/postgres/archive/refs/tags/REL_18_3.tar.gz"
  sha256: "989eea9c414496e5200e68c9ceae57160160be12e0ea998f5c4793741f2cc6b5"

patches:
  - patch_file: "patches/pg_dump_ohos.patch"
    patch_type: "portability"
    patch_description: "OHOS platform adaptations: SysV shm bypass, hmdfs permissions, DSM mmap, getpwuid fallback, Unix socket disable, mkdir fix"
