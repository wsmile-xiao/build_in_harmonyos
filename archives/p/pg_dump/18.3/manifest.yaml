# 版本级 manifest — pg_dump 18.3
version: "18.3"
software: "pg_dump"
status: built
build_date: "2026-08-25"
build_system: "autotools"
source:
  url: "https://github.com/postgres/postgres/archive/refs/tags/REL_18_3.tar.gz"
  sha256: "989eea9c414496e5200e68c9ceae57160160be12e0ea998f5c4793741f2cc6b5"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--without-icu"
    - "--without-readline"
    - "--without-zlib"
    - "--without-openssl"
    - "--build=aarch64-unknown-linux-ohos"
  dependencies: []
  cc: clang
  cxx: clang++
patches_applied:
  - "patches/pg_dump_ohos.patch"
knowledge_gained:
  - "SysV shared memory syscalls return SIGSYS on OHOS, must bypass"
  - "config.guess cannot compile test programs on OHOS, must pass --build explicitly"
  - "shm_open detected by configure but causes SIGSYS at runtime, force mmap DSM"
  - "hmdfs filesystem has abnormal permission/ownership behavior, needs relaxed checks"
  - "getpwuid fails for users not in /etc/passwd, needs numeric UID fallback"
  - "Unix-domain sockets not supported (EPERM), must disable and use TCP/IP"
  - "umask 077 in configure causes temp dirs unwritable on hmdfs, change to 067"
