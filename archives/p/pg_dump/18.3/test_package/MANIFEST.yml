# test_package MANIFEST — pg_dump 18.3
upstream_tests:
  - name: "pg_dump --version"
    description: "Verify pg_dump binary reports correct version"
    upstream_command: "pg_dump --version"
    expected_output: "pg_dump (PostgreSQL) 18.3"
  - name: "pg_dumpall --version"
    description: "Verify pg_dumpall binary reports correct version"
    upstream_command: "pg_dumpall --version"
    expected_output: "pg_dumpall (PostgreSQL) 18.3"
  - name: "pg_restore --version"
    description: "Verify pg_restore binary reports correct version"
    upstream_command: "pg_restore --version"
    expected_output: "pg_restore (PostgreSQL) 18.3"
test_type: binary_version_check
build_system: none
