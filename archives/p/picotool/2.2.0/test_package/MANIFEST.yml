# test_package/MANIFEST.yml
# 测试声明文件（L0e 强制要求存在）
# 上游 picotool 2.2.0 自带测试套件（test/ 目录 + ctest），本次适配未
# 迁移运行（依赖 Pico 硬件/模拟器）；test_package 为 OHOS 适配自研的
# L1 验证。

package: picotool/2.2.0
homepage: "https://github.com/raspberrypi/picotool"

# 上游官方测试：test/ 目录 + ctest
upstream_official_tests:
  - suite: "ctest"
    count: 10
    kind: "unit"
    command: "ctest"

# 构建阶段执行的测试命令：上游 ctest（本次适配未运行）
upstream_check_command: "ctest"
upstream_test_in_build: false
upstream_test_command: "ctest"

# 适配补全测试（自研，非上游）：无（未迁移 ctest，消费者验证集中在
# test_package 的 L1 验证）
adapted_tests: []

# test_package 中自带的测试 (消费者视角验证，同样为适配自研)
test_package_tests:
  - file: test.c
    origin: ohos-adaptation (self-authored)
    description: "消费者测试：校验包内 bin/picotool 存在且为有效 64 位 ELF（真实读取产物）"
    command: "./test_picotool"

# 测试断言总数 (实际统计：1 项断言，全部为适配自研断言：
# ELF magic + EI_CLASS 64-bit)
assertion_count: 1
