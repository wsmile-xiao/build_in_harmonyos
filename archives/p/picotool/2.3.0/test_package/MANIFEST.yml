# test_package/MANIFEST.yml — picotool 2.3.0 上游测试清点（R51）
#
# 清点方法：解压上游源码包 picotool-2.3.0.tar.gz（sha256
# 97aaf36800d2317683528cba5762e3d4e7a5de0cba729d28011a6ee94b3b7538），
# 全目录检索 *test*：无 tests/ 目录、无 ctest/pytest 注册（CMakeLists.txt
# 无 enable_testing/add_test）。上游实际验证 = .github/workflows/test.yml
# 无硬件冒烟 + bdev_test.sh（需真实 RP2040/RP2350 设备）。

package: picotool/2.3.0
homepage: "https://github.com/raspberrypi/picotool"

# 上游测试命令（bdev_test.sh 为上游唯一直接可执行测试脚本，需硬件）
upstream_check_command: "bash bdev_test.sh  # SKIP: 需真实 RP2040/RP2350 设备"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试（.github/workflows/test.yml 逐 step 清点）
upstream_tests:
  - file: .github/workflows/test.yml (job build, step Test)
    source: picotool-2.3.0/.github/workflows/test.yml
    description: "无硬件冒烟：picotool help + info -a 解析官方 blink/hello_world/flash_nuke UF2 固件"
    command: "picotool help && picotool info -a blink.uf2 && picotool info -a hello_world.uf2 && picotool info -a flash_nuke.uf2"
  - file: .github/workflows/test.yml (job build, step Test libusb compiled)
    source: picotool-2.3.0/.github/workflows/test.yml
    description: "libusb 编译变体帮助文本自检（本适配即 libusb 变体）"
    command: "picotool help load && picotool help save && picotool help erase"
  - file: .github/workflows/test.yml (job test-older-sdk, step Test)
    source: picotool-2.3.0/.github/workflows/test.yml
    description: "版本兼容断言 picotool version <X.Y.Z>（本适配同款：picotool version 2.3.0）"
    command: "picotool version 2.3.0"
  - file: bdev_test.sh
    source: picotool-2.3.0/bdev_test.sh
    description: "分区表/bdev 端到端测试——picotool erase/reboot/load 经 USB 读写真实 RP2350 设备"
    command: "bash bdev_test.sh  # SKIP: 需真实 RP2040/RP2350 硬件，CI 环境无设备"
  - file: .github/workflows/test.yml (job test-examples)
    source: picotool-2.3.0/.github/workflows/test.yml
    description: "构建 pico-examples（验 picotool 供 SDK 构建可用，非 picotool 自身功能测试）"
    command: "SKIP: 需 arm-none-eabi 交叉工具链构建 Pico 固件示例，属 pico-examples 仓库功能"

# test_package 中自带的测试（消费者视角验证，复刻上游 CI 无硬件冒烟）
test_package_tests:
  - file: test.c
    description: "消费者测试：bin/picotool 存在且为有效 64 位 ELF"
    command: "./test_picotool"
  - file: conanfile.py (test())
    description: "上游 CI 同款无硬件冒烟：version / version 2.3.0 / help / help load|save|erase / info -a ×3 UF2"
    command: "picotool version 2.3.0 && picotool help && picotool info -a <uf2>"

# 测试断言总数（test.c ELF 校验 4 处 + test() 实际运行 10 项命令）
assertion_count: 14
