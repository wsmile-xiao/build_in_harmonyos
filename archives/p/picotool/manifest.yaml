software: picotool
display: "picotool"
description: "Raspberry Pi Pico USB/UF2/ELF tool (device interaction, partition tables, bdev)"
category: tools
homepage: "https://github.com/raspberrypi/picotool"
license: BSD-3-Clause
build_system: cmake

ohos_adaptation:
  key_points:
    - "CMake 构建，bundled 依赖（nlohmann_json/littlefs/oofatfs/whereami）源码自带"
    - "pico-sdk 以 PICO_SDK_PATH 方式从上游官方源 vendor 配套版本（2.2.0 先例）"
    - "SDK lld 依赖 libxml2.so.16，generate() buildenv_info 注入 LD_LIBRARY_PATH（2.2.0 先例）"
    - "USB 设备访问依赖 libusb/1.0.27（制品仓）"
  common_dependencies:
    - libusb/1.0.27

versions:
  "2.2.0":
    status: published
    build_date: "2026-09-19"
  "2.3.0":
    status: published
    build_date: "2026-09-21"
