software: perl-ldap
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.68-r2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.68-r2"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/downloads/perl-ldap-0.68.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 XS 代码）在鸿蒙平台可直接安装使用，无需特殊编译参数"
  - "Perl 模块使用 PREFIX 参数而非 INSTALL_BASE 进行本地安装"
  - "Text::Soundex 等可选 XS 依赖编译失败不影响核心 Perl 模块功能"
  - "PERL5LIB 环境变量必须指向 site_perl 和 lib/perl5 两个目录"
  - "Module::AutoInstall 可自动处理 CPAN 模块依赖下载"
  - "纯 Perl 模块无传统二进制产物，质量门禁 G4 检查需手动验证模块加载"

# ============================================================
# 打包信息
# ============================================================

packaging:
  # 预编译包名称
  package_name: "perl-ldap-0.68-r2-ohos-aarch64.tar.gz"

  # 包大小
  package_size: "564K"

  # 包内容统计
  pm_files: 49
  pod_files: 12

  # 安装路径
  install_path: "lib/site_perl/5.42.0/Net/"

  # 打包日期
  package_date: "2026-06-13"
