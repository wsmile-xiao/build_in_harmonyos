software: perl-net-jabber-bot
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.7-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.7-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/T/TO/TODDR/Net-Jabber-Bot-2.1.7.tar.gz"

  # 源码校验和
  sha256: "4a552c35044d8563deb95f906845f819b91288f84ba834eda1746f247ae74393"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []
  # perl Makefile.PL (ExtUtils::MakeMaker)

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-net-jabber/2.0-r0"
    - "perl-moose"
    - "perl-xml-stream"
    - "perl-lwp"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - ref: E011
    note: "纯 Perl 模块使用 perl Makefile.PL 构建，无 C 编译步骤，make 仅复制 .pm 文件"
  - ref: E011
    note: "conan cache path 返回 recipe 导出文件夹而非二进制包文件夹，conan_verify.py G4 需用 ref:pkg_id 获取正确路径"
  - ref: E011
    note: "纯 Perl 模块无 SELinux 限制，可从 HMDFS 路径加载（与 XS 模块不同）"
  - ref: internal
    note: "make install DESTDIR 安装到 data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/5.42.0/ 路径"
  - ref: internal
    note: "Parallel::ForkManager 是 StartParallel 模式的可选依赖，未安装不影响基本功能"
  - ref: internal
    note: "XML::Stream::Parser 有非致命警告: precedence between ! and ==，不影响功能"
