software: perl-extutils-cchecker
display: "ExtUtils::CChecker"
description: "Configure-time utilities for using C headers, libraries, or OS features in Perl modules"
category: build-tool
homepage: "https://metacpan.org/pod/ExtUtils::CChecker"
license: Artistic-1.0-Perl OR GPL-1.0-or-later
build_system: perl-build

ohos_adaptation:
  key_points:
    - "Pure Perl module, no XS compilation required"
    - "Tests require C runtime libs (crt*.o, libunwind) which OHOS lacks"
    - "Can be installed without tests for OHOS compatibility"
  common_dependencies:
    - perl
    - Module::Build

versions:
  "0.12":
    status: published
    build_date: "2026-06-10"
    functional_test_date: "2026-06-11"
    functional_test_status: PASS
