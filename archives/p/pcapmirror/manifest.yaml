software: pcapmirror
display: "pcapmirror"
description: "远程网络流量镜像工具，通过 TZSP 或 ERSPAN 协议捕获并镜像网络流量"
category: network
homepage: "https://git.freestone.net/cramer/pcapmirror"
license: BSD-3-Clause
build_system: makefile
source_sha256: "d5efbb9b8526b8b319f3040f6a7c9532c0ca9d862b1d21100e7fc8665d0bb638"

ohos_adaptation:
  key_points:
    - "该项目使用简单 Makefile 而非 autotools，无 configure 脚本，需通过 make 变量覆盖适配"
    - "鸿蒙平台无 cc 命令，需 make CC=clang 覆盖默认 CC=cc"
    - "pcap.h 在 $DEFAULT_PREFIX/include，需 CFLAGS 加 -I$DEFAULT_PREFIX/include"
    - "libpcap 在 $DEFAULT_PREFIX/lib，需 LIBS 加 -L$DEFAULT_PREFIX/lib"
    - "Makefile install 未创建 share/man/man8 目录，需手动 mkdir 预创建"
    - "无 make check 目标，功能验证通过 -h/-l 实际运行确认"
    - "-l 选项因平台权限限制（SIOCETHTOOL ioctl）返回错误，属预期行为"
  common_dependencies:
    - libpcap
  warnings:
    - "注册信息标记为 autotools 但实际为简单 Makefile（无 configure 脚本）"

versions:
  "0.6.1":
    status: built
    build_date: "2026-06-24"
    source_url: "https://git.freestone.net/cramer/pcapmirror/-/archive/0.6.1/pcapmirror-0.6.1.tar.gz"
    patches: []
    install_files:
      - "bin/pcapmirror (22144 字节, stripped)"
      - "share/man/man8/pcapmirror.8"
    package: "pcapmirror-0.6.1-ohos-aarch64.tar.gz (440KB, 450648 字节)"