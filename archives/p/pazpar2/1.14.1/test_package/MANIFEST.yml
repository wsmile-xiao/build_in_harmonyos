# test_package/MANIFEST.yml — pazpar2 1.14.1
package: pazpar2/1.14.1
homepage: "https://www.indexdata.com/resources/software/pazpar2"

# 上游测试入口（autotools：make check → automake TESTS）
upstream_check_command: "make check"
# build() 不运行上游测试：14 个 test/*.sh 是网络集成脚本（外部 Z39.50 服务器
# z3950.indexdata.com 与本地 Solr），CI worker 无外部网络，跑必红；
# 上游测试在本地 OHOS PC 实测，结果见 1.14.1/notes.md。
upstream_test_in_build: false
upstream_test_command: "make check"

upstream_tests:
  - file: "src/test_sel_thread, src/test_normalize"
    source: "pazpar2-1.14.1/src/"
    description: "src/ 下 2 个 C 单元测试（automake check_PROGRAMS，TESTS 注册）"
    command: "make check (src/)"
  - file: "etc/xsl/test_xsl.sh"
    source: "pazpar2-1.14.1/etc/xsl/"
    description: "etc/xsl 下 1 个 XSLT 回归脚本（TESTS 注册）"
    command: "make check (etc/xsl/)"
  - file: "test/test_*.sh"
    source: "pazpar2-1.14.1/test/"
    description: "test/ 下 14 个 automake TESTS 脚本，逐个由 run_pazpar2.sh 驱动：起 pazpar2 → curl 本地 9763 端口 → 与 test_*.res 基线 diff；其中 7 个用本地 yaz-ztest 作目标，6 个因 yaz 无 ICU 支持自动 skip，2 个依赖外部 z3950.indexdata.com 现网数据"
    command: "make check (test/)"

test_package_tests:
  - file: "test_pazpar2.py"
    description: "消费者驱动 15 断言 / 三组：(H) 鸿蒙特有 3 —— H1 ELF64 小端 AArch64、H2 解释器 /lib/ld-musl-aarch64.so.1、H3 无独立 libpthread/libdl/librt DT_NEEDED；(C) 消费者功能 10 —— pazpar2 -V 版本/运行库、守护进程绑回环高位端口、command=init 建会话、command=search 触发对本地 mock SRU 目标的真实 searchRetrieve、command=show 聚合 1 条命中、md-title 经 libxslt 归一化渲染、command=ping 会话存活、SIGTERM 干净退出；(P) 鸿蒙 PC 特有 2 —— P1 第三方 DT_NEEDED 仅 libxml2.so.16、P2 RUNPATH 可离线解析 libxml2.so.16"
    command: "bash -c 'python3 -u test_pazpar2.py'"

assertion_count: 15
