software: pazpar2
# 版本级 manifest — pazpar2 1.14.1（HarmonyOS PC 适配）
# 遵循 ARCHIVE-SPEC v2.0

version: "1.14.1"
status: built
build_date: "2026-09-28"
build_system: autotools

source:
  url: "https://ftp.indexdata.com/pub/pazpar2/pazpar2-1.14.1.tar.gz"
  sha256: "9baf590adb52cd796eccf01144eeaaf7353db1fd05ae436bdb174fe24362db53"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/（AutotoolsToolchain 默认；install 走 DESTDIR=<package_folder>）"
    - "--disable-dependency-tracking"
    - "--with-yaz=<yaz package_folder>/bin（上游 YAZ_INIT 通过 yaz-config 定位 YAZ；yaz 包未导出 buildenv_info，故显式给出）"
    - "extra_ldflags: -Wl,-rpath,<各依赖 package_folder>/lib（libxml2 为制品仓共享库 libxml2.so.16，configure 期 conftest 需可加载）"
  dependencies:
    - yaz/5.37.3
    - libxslt/1.1.45.2
    - libxml2/2.15.3
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-config-guess-sub-ohos.patch"
  - "0002-configure-hmdfs-umask.patch"
  - "0003-configure-yaz-xslt-optional.patch"

knowledge_gained:
  - "pazpar2 官方 ftp（ftp.indexdata.com，与 yaz 同源）提供 autotools make dist 发行包：自带 configure/aclocal.m4/Makefile.in/m4/yaz.m4/config/ 与 doc/common 子模块内容，因此本机/CI 都无需 autoreconf（本机也只有 autoreconf+autoconf 2.72，无 automake/libtool）"
  - "config.guess 2018 版不认识 HarmonyOS（uname -s=HarmonyOS → unable to guess system type）；按仓内 acpid/acpitool 先例给 config.guess 加 *:HarmonyOS:* 分支输出 ${MACHINE}-unknown-linux-ohos，config.sub 加 linux-ohos*（kernel-os 组合段 + basic OS 类型段）两处，configure 即可零 --build/--host 参数自识别（R1/R23）"
  - "configure 内 2 处 'umask 077 && mktemp -d/mkdir' 需改 022（HMDFS 忽略 owner-only 模式，configure 生成的 confXXXX 目录后续不可读 → config.status 崩），与 yaz/ngircd 同款"
  - "configure.ac 硬性要求 YAZ 带 libxslt（case $YAZINC in *YAZ_HAVE_XSLT=1*））：制品仓 yaz/5.37.3 是 --with-xslt=no 构建，yaz-config --cflags 不出 -DYAZ_HAVE_XSLT=1。核对源码后确认 pazpar2 自身直接 include <libxslt/xslt.h>/<libxml/tree.h> 并链接 libxslt/libxml2，所用 yaz API（含 yaz_log_xml_errors，其定义不受 YAZ_HAVE_XSLT 守卫）全部来自 libyaz.a 无条件导出 → 该检查是历史一致性断言而非功能依赖，故 patch 0003 把硬错误降级为警告，并由配方显式声明 libxslt/libxml2"
  - "YAZ 定位走 yaz-config（configure.ac → YAZ_INIT → YAZ_CONFIG）：yaz 配方未设置 buildenv_info/runenv_info，其 bin/ 不进 PATH（conanrun 也不含），必须 --with-yaz=<yaz package_folder>/bin 显式给出，否则 configure 报 'YAZ development libraries missing'"
  - "制品仓 libxml2/2.15.3 是共享库（libxml2.so.16，yaz 与 libxslt 都动态链接它）；autotools 的 conftest 要被执行，构建期没有 LD_LIBRARY_PATH，故用 AutotoolsToolchain.extra_ldflags 注入 -Wl,-rpath 指向各依赖 lib，configure 才过（否则 'cannot run C compiled programs'）"
  - "patch configure.ac 会让 vendored aclocal.m4/configure/Makefile.in 变'旧'，make 触发 aclocal-1.16/automake 重生成（CI 无 automake → Error 127）。source() 里把 configure/aclocal.m4/*.in 等生成物统一 utime 到最新，掐断重生成触发（仓内先例 babeltrace2/2.1.2、lttoolbox）"
  - "无 libtool：configure.ac 不含 LT_INIT，产物只有 bin/pazpar2（sbin）+ bin/pazpar2_play + share/{man,doc,pazpar2/js}，无 .la/.so，避开 libtool .la 依赖地狱"
  - "上游 make check 共 17 个 TESTS（src 2 + etc/xsl 1 + test 14，automake serial-tests）；test/ 下 14 个是网络集成脚本（run_pazpar2.sh 起 pazpar2 打本地 9763 再 curl 对比 .res 基线）：7 个用本地 yaz-ztest 做目标、6 个因 yaz 无 ICU 自动 skip（PASS 但实为 skip）、2 个（test_http/test_post）对比外部 z3950.indexdata.com 现网数据已漂移而失败（多出记录、merge 计数/checksum 变化），非适配缺陷"
  - "上游安装规则不安装 etc/（无 Makefile.am，仅进 dist 包）与 etc/xsl/*.xsl，故包里没有默认样式表/设置模板；消费者需自带 service 定义与归一化 XSLT —— test_package 据此自建最小 service + pz:xslt 验证 libxslt 归一化链路"

patch_generation:
  method: per-file-diff
  source_orig_dir: /storage/Users/currentUser/Hawkninja/learninglog/20260920pazpar2-1.14.1/_raw/.orig/pazpar2-1.14.1
  source_work_dir: /storage/Users/currentUser/Hawkninja/learninglog/20260920pazpar2-1.14.1/_raw/.work/pazpar2-1.14.1
  patches_count: 3

patch_classification:
  - file: 0001-config-guess-sub-ohos.patch
    type: manual
    platform_only: true
    guard: "config.guess/config.sub 平台识别（R8/R23 允许的 POSIX 兼容修法，无 __OHOS__ 宏）"
  - file: 0002-configure-hmdfs-umask.patch
    type: manual
    platform_only: true
    guard: "HMDFS 权限（与 yaz/ngircd 同款 umask 022）"
  - file: 0003-configure-yaz-xslt-optional.patch
    type: manual
    platform_only: false
    guard: "依赖能力放宽：制品仓 yaz 无 libxslt，pazpar2 自身直连 libxslt/libxml2；非平台宏"

verification:
  local_conan_create: "exit 0（conan create . --build=missing，含 test_package 11/11 断言通过）"
  upstream_tests_local: "17 注册：PASS 15 / FAIL 2（15 中 6 个为 ICU 自动 skip）；失败 2 项归因外部 z3950.indexdata.com 现网数据漂移"
  official_ci: pending
