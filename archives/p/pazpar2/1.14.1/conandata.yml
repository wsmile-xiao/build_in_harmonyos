sources:
  url: "https://ftp.indexdata.com/pub/pazpar2/pazpar2-1.14.1.tar.gz"
  sha256: "9baf590adb52cd796eccf01144eeaaf7353db1fd05ae436bdb174fe24362db53"
patches:
  - patch_file: "patches/0001-config-guess-sub-ohos.patch"
    patch_description: "Teach config.guess/config.sub the HarmonyOS (ohos) target so autotools can identify build/host without extra flags"
    patch_type: "portability"
  - patch_file: "patches/0002-configure-hmdfs-umask.patch"
    patch_description: "Use umask 022 instead of 077 when configure creates its temporary directory (HMDFS ignores the owner-only mode)"
    patch_type: "portability"
  - patch_file: "patches/0003-configure-yaz-xslt-optional.patch"
    patch_description: "Relax the hard requirement that YAZ be built with libxslt: pazpar2 links libxslt/libxml2 directly and only needs the YAZ Z39.50/SRU API"
    patch_type: "portability"
