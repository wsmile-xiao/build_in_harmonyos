# 软件级 manifest — pazpar2
# 遵循 ARCHIVE-SPEC v2.0

software: pazpar2
display: "Pazpar2"
description: "Index Data 元搜索引擎：并发查询 Z39.50/SRU/Solr 目标、合并结果集并以 HTTP /search.pz2 协议对外提供检索会话"
category: network
homepage: "https://www.indexdata.com/resources/software/pazpar2"
license: GPL-2.0-or-later

build_system: autotools

ohos_adaptation:
  key_points:
    - "上游 ftp（ftp.indexdata.com，与 yaz 同源）的 make dist 发行包自带 configure/aclocal.m4/Makefile.in，免 autoreconf（本机/CI 均无 automake/libtool）"
    - "config.guess(2018) 不识别 HarmonyOS → 加 *:HarmonyOS:* 分支输出 ${MACHINE}-unknown-linux-ohos；config.sub 加 linux-ohos* 两处；configure 零 --build/--host 参数"
    - "configure 2 处 umask 077 需改 022（HMDFS）"
    - "configure.ac 硬性要求 YAZ 带 libxslt，而制品仓 yaz/5.37.3 为 --with-xslt=no → 检查降级为警告；pazpar2 自身直连 libxslt/libxml2，所用 yaz API 全部由 libyaz.a 无条件导出"
    - "YAZ 通过 yaz-config 定位：yaz 包未导出 buildenv_info → 必须 --with-yaz=<yaz>/bin"
    - "libxml2/2.15.3 是共享库（libxml2.so.16）→ 构建期需 -Wl,-rpath，否则 configure conftest 无法运行"
    - "patch configure.ac 后需 utime 生成物，掐断 make 的 aclocal/automake 重生成（无 automake → Error 127）"
    - "无 libtool，产物为 bin/ 下可执行 + man/doc；package_type=application"
    - "上游 make install 不装 etc/ 与 etc/xsl/*.xsl，消费者需自备配置与归一化 XSLT"
  common_dependencies:
    - yaz
    - libxslt
    - libxml2

versions:
  "1.14.1":
    status: built
    build_date: "2026-09-28"
