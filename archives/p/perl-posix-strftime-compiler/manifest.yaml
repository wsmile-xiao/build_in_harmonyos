software: perl-posix-strftime-compiler
display: "POSIX::strftime::Compiler"
description: "GNU C library compatible strftime that compiles format strings for better performance"
category: perl
homepage: "https://metacpan.org/release/POSIX-strftime-Compiler"
license: Artistic-1.0 OR GPL-1.0-or-later
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C 编译，无需 CRT 补丁、ELF 签名或 musl BIND_NOW 修复"
    - "原发行版使用 Module::Build::Tiny (Build.PL)，系统未安装，改用 Makefile.PL (ExtUtils::MakeMaker)"
    - "修复 12-hour clock 逻辑 bug：%I/%l 使用 `%12 || 12` 而非 `%12 || 1`，%p/%P AM/PM 条件反转"
    - "运行时依赖均为 Perl 核心模块（Carp, Exporter, POSIX, Time::Local）"

versions:
  "0.46":
    status: published
    build_date: "2026-06-25"
