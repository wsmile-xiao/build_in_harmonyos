# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "原发行版使用 Module::Build::Tiny (Build.PL)，系统未安装该模块。创建 Makefile.PL 使用 ExtUtils::MakeMaker 替代构建，纯Perl模块兼容 (ref: L2-build-pattern)"
  - "x_static_install=1 的纯Perl模块可安全地从 Build.PL 切换到 Makefile.PL 构建 (ref: L2-build-pattern)"
  - "发现并修复12小时制逻辑bug: %I/%l使用`%12 || 1`应为`%12 || 12`(hours 0和12给出01而非12); %p/%P使用`> 0 && < 13`应为`< 12`(noon给AM应为PM, midnight给PM应为AM) (ref: L3-software-specific)"
  - "纯 Perl 模块在鸿蒙平台上无需处理 CRT 缺失、ELF 签名、musl BIND_NOW 等 XS 问题 (ref: perl-dbd-pg 编译经验)"
  - "PERL5LIB 必需：系统 Perl @INC 不包含 ~/usr/local，需设置 PERL5LIB=~/usr/local/lib/site_perl/5.42.0:~/usr/local/lib/5.42.0 (ref: L1-platform-truth)"

