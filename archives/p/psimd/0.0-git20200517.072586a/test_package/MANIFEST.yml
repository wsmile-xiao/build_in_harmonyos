# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: psimd/0.0-git20200517.072586a
homepage: "https://github.com/Maratyszcza/psimd"

# 上游测试清点（R51 三步法第 1 步，2026-09-19 实测）：
#   源码包共 6 个文件：CMakeLists.txt, configure.py, confu.yaml,
#   include/psimd.h, LICENSE, README.md。
#   - 无 test/ 目录，无任何 *test* 源文件；
#   - CMakeLists.txt 无 enable_testing()/add_test()，仅定义 INTERFACE
#     目标 psimd 并 INSTALL(FILES include/psimd.h)；
#   - 无 pytest/ctest/make check 入口。
# 结论：上游零测试（清点证据见 notes.md 与 reports/knowledge-evidence.md）。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# test_package 中自带的测试（消费者视角验证，真实调用 psimd API）
test_package_tests:
  - file: test.cc
    description: "消费者测试: 编译期 NEON 后端门禁 + splat/add/sub/mul/min/max/abs/blend/signblend/load/store/qfma 已知值断言"
    command: "./test_psimd"

# 测试断言总数（12 个 CHECK；编译期 #error 门禁不计入运行期断言）
assertion_count: 12
