knowledge_gained:
  - "header-only 无构建系统库：conanfile.py 显式 no-op build() + apply_conandata_patches 以满足 conan-verify G1 结构门禁（E257 复用）"
  - "上游 CMakeLists 仍声明 cmake_minimum_required(2.8.12)（CMake 4.x 拒绝，E103/E321）；header-only 配方不调用上游 CMake，仅复制头文件，该不兼容不触发"
  - "OHOS SDK clang 仅预定义 __ARM_NEON（无 __ARM_NEON__，C/C++ 一致）：只查带尾下划线拼写的 NEON 探针会误判；psimd.h 自身双拼写守卫不受影响（真机实测）"
  - "单头 SIMD 封装库后端激活验证契约：先于 include 的双拼写编译期门禁 + 不透明输入（-O3 常量折叠会抹掉全部向量指令）+ llvm-objdump bsl 族指令计数；fmla/融合数值不可作后端判据（回退形态同收缩为 fmla，真机实测）（DRAFT-psimd-0.0-simd-backend-activation-evidence）"
  - "psimd.h 上游潜在缺陷：aarch64 无 NEON 宏时 qfma 守卫（__aarch64__）与 arm_neon.h include 守卫不匹配 → 665 行 float32x4_t 未声明硬编译错误（自毁），aarch64 上不存在静默退化路径（真机实测）"
  - "上游零测试（R51 清点：6 文件、无 test/、无 ctest 注册），消费者测试为唯一运行期验证"
