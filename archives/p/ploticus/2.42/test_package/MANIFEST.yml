# test_package/MANIFEST.yml
# 上游测试声明 + 本次适配实测结果
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: ploticus/2.42
homepage: "https://ploticus.sourceforge.net/"

# 上游测试入口（手写 Makefile，无 configure/ctest；入口都是 shell 脚本 + 样例脚本）
upstream_check_command: "make -C pltestsuite runtest   # == ./run_script_test"

# 配方 build() 不构建上游测试（上游出厂即带 pltestsuite，且测试依赖源码树内的样例
# 数据与 prefabs）；上游套件在本次适配中独立实测，结果见 measured_results。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试入口（pltestsuite/）
upstream_tests:
  - file: "pltestsuite/run_script_test"
    source: ploticus-2.42/pltestsuite/run_script_test
    description: "30 个脚本样例（stock2/kmslide/propbars1/.../sar-cpu），逐个执行并出图"
    command: "pl -png <sample>.htm"
  - file: "pltestsuite/run_all_scripts"
    source: ploticus-2.42/pltestsuite/run_all_scripts
    description: "批量脚本样例（bigcsv.pl / windbarbs.pl）"
    command: "pl <script>.pl"
  - file: "pltestsuite/run_prefabs_test"
    source: ploticus-2.42/pltestsuite/run_prefabs_test
    description: "13 个 testpf_* 脚本，覆盖全部 prefab（chron/lines/pie/scat/stack/vbars/vdist/...）"
    command: "./testpf_<name> png"
  - file: "src/apitest.c"
    source: ploticus-2.42/src/apitest.c
    description: "libploticus 嵌入 API 测试（脚本文件方式 + 内嵌脚本行方式）"
    command: "src/apitest <script>"

# 本次适配对上游套件的实测结果（2026-10-01，HarmonyOS PC aarch64 真机）
# 执行方式：逐用例独立执行（读取上游脚本中的用例清单），rc + error 行 + 产物三重判定
measured_results:
  mode: "png"
  command: "bash run_upstream_suite.sh <src> <tsv> png   # 每用例 env -u TMPDIR"
  registered: 46
  passed: 44
  failed: 0
  skipped: 2
  skipped_detail:
    - "run_all_scripts/windbarbs.pl —— 上游 2.42 源码包中不存在该文件（同目录仅有 windbarbs.htm）；
       属上游 run_all_scripts 自身缺陷，等价样例 windbarbs.htm 已在套件 1 中通过"
    - "run_prefabs_test/testpf_compare —— 上游脚本即为空壳（只打印
       \"the 'compare' prefab is no longer available.\" 后 exit），无产物"
  known_messages:
    - "errbar5.htm：8 条 'error 72036: out-of-bounds data access' —— 该样例 getdata 仅 6 列
       而脚本使用 errbarfield: 6，属上游样例自身的数据越界提示；补丁前后完全一致（非适配引入）"
  logs:
    - "reports/test-report.md（逐用例明细与日志路径）"

# test_package 中自带的消费者视角测试
test_package_tests:
  - file: test.sh
    description: >-
      7 用例：version_banner / png_render / svg_render / libploticus_api /
      ohos_tmpdir_readonly（鸿蒙特有）/ ohos_elf_abi（鸿蒙特有）/ ohos_prefab_render（鸿蒙特有）
    command: "bash test.sh <pkg>/bin/pl <pkg> [cc]"

# 测试断言总数（test.sh 中 7 个用例，各自含 2~4 项断言）
assertion_count: 7
ohos_specific_test_count: 3
