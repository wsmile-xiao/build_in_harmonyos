# ============================================================
# 源码
# ============================================================
source:
  url: "https://downloads.sourceforge.net/project/ploticus/ploticus/2.42/ploticus242_src.tar.gz"
  sha256: "3f29e4b9f405203a93efec900e5816d9e1b4381821881e241c08cab7dd66e0b0"
  tar_format: tar.gz
  note: >-
    上游 tarball 535755 字节；sha512 620232942096f73050633cdc37587833809b82dfb5965e4e9e977565925939c01a5e904c14faed3abe88bff2ae6e063494ed08e650708785c106673091befc6a
    与 pkgsrc graphics/ploticus/distinfo 记录完全一致（同字节的官方发布）。本机直连
    SourceForge 被 Cloudflare 522 阻断，取源改用 pkgsrc distfiles 镜像并做上述交叉核对。

# ============================================================
# 构建
# ============================================================
build:
  system: makefile
  # src/Makefile 变量（上游唯一构建入口；无 configure/CMake）
  configure_options:
    - "exetarget: plpng            # 上游默认 Setting 2/Option 1：bundled GD16，PNG + SVGZ"
    - "ZFLAG = -DWZ                # 压缩 SVG（svgz）"
    - "NOX11 = -DNOX11            # 无 X11（上游默认，且 HarmonyOS PC 无 X11 服务）"
    - "NOSWF = -DNOSWF            # 无 SWF/Flash 输出（上游默认）"
    - "PLATFORM = UNIX"
    - "GD16H = <libpng/zlib include dirs>"
    - "GD16LIBS = <libpng/zlib lib dirs> -lpng -lz"
    - "CC = clang（取自 tools.build:compiler_executables，R33）"
    - "make LIBEXT=a ARCOM=\"<ar> r\" libploticus-static   # 嵌入 API 静态库"
  dependencies:
    - libpng/1.6.58.3
    - zlib/1.3.2
  cc: clang
  cxx: clang++

# ============================================================
# 产物
# ============================================================
products:
  executables:
    - name: bin/pl
      verified: true
      description: "主程序，输出设备：PS / EPS / SVG / SVGZ / PNG（-version 横幅实测）"
  libraries:
    - name: lib/libploticus.a
      verified: true
    - name: include/libploticus.h
      verified: true
  data:
    - name: share/ploticus/prefabs/
      verified: true
      description: "上游 prefab 库（chron/lines/pie/scat/stack/vbars/vdist/...）；配方 runenv 设置 PLOTICUS_PREFABS"
  elf:
    class: ELF64
    machine: AArch64
    needed: ["libpng16.so.16", "libc.so"]
    note: "zlib 静态链接（系统同名库，R26），无 libz.so 运行时依赖"

# ============================================================
