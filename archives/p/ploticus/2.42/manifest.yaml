# ============================================================
# 知识沉淀
# ============================================================
knowledge_gained:
  - ref: "knowledge/drafts/E543-draft-40EF.kv"
    id: K001
    category: platform_tmpdir
    description: >-
      上游 ploticus 把编译期宏 TMPDIR(/tmp) 直接作为临时目录，运行期不读环境变量；
      HarmonyOS PC 的 /tmp 为只读挂载 → proc drawcommands / proc processdata / cgi
      诊断全部失败（error 522），且进程仍返回 0（静默降级、图元丢失）。修法：运行期
      目录选择（$TMPDIR → 编译期默认 → 当前目录），可用性用“实际创建探测文件”判定
      （access() 在 HMDFS 不可靠）。
    severity: high
  - ref: "knowledge/drafts/E544-draft-B58F.kv"
    id: K002
    category: api_contract
    description: >-
      libploticus 的 ploticus_init()/ploticus_execline() 会就地修改传入的字符串
      （按脚本语言解析），调用方必须传可写缓冲区；传字符串字面量 → SIGSEGV(139)。
      且仅用 execline 而不先经过一次 execscript 循环时也会崩溃——应照搬上游 apitest.c 的
      调用序列（init→arg→execscript→end→init→arg→execline*→end）。
    severity: medium
  - ref: "archives/p/ploticus/2.42/notes.md（问题与解决方案 #2）"
    id: K003
    category: build_system
    description: >-
      ploticus 2.42 是手写 Makefile 工程：构建标记在 src/ 而不是包根，框架 F068
      “嵌套源码提升”会把 pltestsuite（含 Makefile）误判为源码根 → 本地探索构建需
      手工固定源码树；配方侧 build() 用 cwd=src 显式执行 make。
    severity: low
  - ref: "reports/test-report.md（§2.5 上游自身缺陷）"
    id: K004
    category: upstream_test_defect
    description: >-
      上游 2.42 测试套件自带两处缺陷：run_all_scripts 引用不存在的 windbarbs.pl；
      testpf_compare 是空壳（无产物）。逐用例统计时应记为“上游缺陷跳过”，不计入失败。
    severity: low
  - ref: "archives/p/ploticus/2.42/README.md（源码获取）"
    id: K005
    category: source_acquisition
    description: >-
      SourceForge 主站/镜像在本机被 Cloudflare 522 全量阻断时，可用 pkgsrc distfiles
      镜像获取上游原始 tarball，并以 pkgsrc graphics/<pkg>/distinfo 的 SHA512+Size
      交叉核对确认与官方发布同字节（conandata.yml 仍写官方 URL+sha256）。
    severity: medium

# ============================================================
# 使用建议
# ============================================================
usage_notes:
  - "运行期需要 libpng 动态库：conan install 后用 VirtualRunEnv 的 conanrun.sh（提供 LD_LIBRARY_PATH 与 PLOTICUS_PREFABS）"
  - "出图：pl -png script.pl / -svg / -svgz / -eps（-version 可作为可执行性冒烟检查，注意上游返回码为 1）"
  - "嵌入 API：-I<prefix>/include 且链接 <prefix>/lib/libploticus.a -lpng -lz -lm；execline 入参需可写缓冲区"

