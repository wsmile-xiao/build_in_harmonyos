patches:
  - patch_file: "patches/0001-src-preliminaries.c.patch"
    patch_description: >-
      运行时选择临时目录：优先 $TMPDIR，其次编译期默认目录，最后当前工作目录；
      可用性通过在候选目录内实际创建探测文件来判定。OpenHarmony/HarmonyOS PC
      将 /tmp 挂载为只读，上游写死的 /tmp 会使 proc drawcommands、proc processdata
      与 cgi 诊断的临时文件无法创建（error 522）。补丁不含任何平台宏。
    patch_type: "portability"
    sha256: "3d710fa3b871120d3daa8c6020a33e88d8031967fcde995fad4caa2d813439d5"
