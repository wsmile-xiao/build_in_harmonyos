software: ploticus
display: "Ploticus"
description: "Ploticus 数据展示引擎：从 ploticus 脚本渲染图表（PS/EPS/SVG/SVGZ/PNG）"
category: gfx
homepage: "https://ploticus.sourceforge.net/"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游用编译期宏 TMPDIR(/tmp) 作为临时目录；鸿蒙 /tmp 只读，必须改为运行期可选目录（补丁 0001）"
    - "构建面只用 make：src/Makefile 是上游唯一构建入口（无 configure/CMake）；Makefile 变量 GD16H/GD16LIBS 承载依赖头/库路径"
    - "libploticus 的 ploticus_init()/ploticus_execline() 会就地修改入参，必须传可写缓冲区"
    - "zlib 为系统同名库：链接静态 libz.a（R26）；libpng 系统无同名库，动态链接由 Conan 管理"
    - "官方 SourceForge 源在本机被 Cloudflare 522 阻断，取源需镜像 + distinfo 哈希交叉核对"
  common_dependencies:
    - libpng
    - zlib

versions:
  "2.42":
    status: built
    build_date: "2026-10-01"
