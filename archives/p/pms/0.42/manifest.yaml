# 版本级 manifest
# 文件位置: archives/p/pms/0.42/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# 版本号
version: "0.42"

# 软件名
software: "pms"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统
build_system: autotools

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://downloads.sourceforge.net/project/pms/pms/0.42/pms-0.42.tar.gz"

  # 源码校验和
  sha256: "044871a44250f8abe010c169d08760ca2da80caa593370f27d927d3165ab8e00"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: autotools

  # 配置选项列表
  configure_options:
    - "--prefix=/"
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "glib/2.88.0.1"
    - "ncurses/6.6"
    - "gettext/0.22.5.1"
    - "pkgconf/3.0.5"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息（本版本无补丁，OHOS 适配全部在 conanfile.py 内联完成）
# ============================================================

patches_applied: []

# ============================================================
# 测试信息（用例数以真机预检 evidence 为准）
# ============================================================

tests:
  upstream:
    command: "make check + built-binary --help/-v smoke (OHOS synthetic; upstream registers no TESTS)"
    cases: 1
    passed: 1
    pass_rate: "100% (OHOS synthetic 1/1; upstream ships no native suite, audit in test_package/MANIFEST.yml)"
    notes: "上游发布包无 tests/ 目录、无 TESTS/check_PROGRAMS 接线（92 条目逐条清点）；HMBS 门禁驳回 no_tests/0 后按 audtty/0.1.12 已验证模式接入 OHOS synthetic 检查"

knowledge_gained:
  - "AM_GLIB_GNU_GETTEXT 时代的老 configure 不提供 --disable-nls，必须 requires gettext/0.22.5.1（libintl + msgfmt）并把它的 bin/ 前置到 PATH"
  - "autoconf 2.65 的 config.guess 在 HMDFS 上无法建探测文件，必须显式 --build/--host=aarch64-unknown-linux-ohos"
  - "configure 内 umask 077 在 HMDFS 上建不出临时目录，改为 022"
  - "固定 configure.ac/Makefile.am/m4 < aclocal.m4 < configure < Makefile.in 时间戳，避免 make 重调 aclocal/automake"
  - "make 命令行透传 CC/CXX（R33），覆盖老 Makefile.in 里写死的 cc"
  - "HMBS 证据门禁对无原生测试套件的 autotools 包会判 incomplete（清单要求 discovered>0）：按 audtty/0.1.12 已合入模式，在配方 build() 内对刚构建出的二进制做 OHOS synthetic 检查（--help/-v 真实验证，discovered=1），结果持久化到包内 res/ 供 test_package 每轮双通道复发；automake 单冒号 check 目标不可追加竞争规则，验证放 build() 内而非注入 Makefile"
