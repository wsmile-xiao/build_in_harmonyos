software: perl-set-intspan
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.19-r5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.19-r5"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/S/SW/SWMCD/Set-IntSpan-1.19.tar.gz"

  # 源码校验和
  sha256: "11b7549b13ec5d87cc695dd4c777cd02983dd5fe9866012877fb530f48b3dfd0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 纯 Perl 模块，无外部依赖

  # 纯 Perl 模块，无 C/C++ 编译器
  cc: none
  cxx: none

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在鸿蒙平台原生兼容，ExtUtils::MakeMaker 构建系统无需任何适配"
  - "与 XS 模块（如 perl-dbd-pg）不同，纯 Perl 模块不受 CRT 文件缺失、SELinux HMDFS 限制等鸿蒙特有问题影响"
  - "Conan 配方中 package() 方法需将 .pm 文件从深层 Perl 安装路径展平到 lib/perl5/ 目录，便于 G4 产物检查"
  - "insert($n) 和 remove($n) 只接受单个整数参数，范围操作应使用 union() 方法"
  - "消费者通过 PERL5LIB 环境变量找到模块，Conan VirtualRunEnv 生成器自动设置"
