# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/ADAPTATION_GUIDE.md#6-manifestyml

package: perl-set-intspan/1.19-r5
homepage: https://metacpan.org/release/Set-IntSpan

# 上游测试命令 (Perl 标准测试目标)
upstream_check_command: "make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游测试套件 (CPAN Set-IntSpan 1.19)
upstream_tests:
  - name: "t/IntSpan.t"
    source: Set-IntSpan-1.19/t/IntSpan.t
    description: "Set::IntSpan 核心功能测试 (new/run/union/intersect/complement 等)"

# test_package 中自带的测试
test_package_tests:
  - file: test_intspan.sh
    description: "Perl 模块加载与基本操作验证 (cardinality/member check)"
    command: "sh test_intspan.sh"

# 测试断言总数 (近似值)
assertion_count: 10
