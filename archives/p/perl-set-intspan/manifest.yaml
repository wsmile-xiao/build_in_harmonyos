# 软件级 manifest — perl-set-intspan
# 文件位置: archives/p/perl-set-intspan/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

software: perl-set-intspan
display: "Set::IntSpan"
description: "Perl module for managing sets of integers, newsrc style"
category: perl
homepage: https://metacpan.org/release/Set-IntSpan
license: unknown
build_system: perl

# ============================================================
# 跨版本 OHOS 适配知识
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，ExtUtils::MakeMaker 构建系统原生兼容鸿蒙，无需任何补丁"
    - "与 XS 模块不同，不受 CRT 文件缺失、SELinux HMDFS 限制等鸿蒙特有问题影响"
    - "Conan 配方中 package() 方法需将 .pm 文件展平到 lib/perl5/ 目录"
    - "消费者通过 PERL5LIB 环境变量找到模块"
  common_dependencies:
    - perl

# ============================================================
# 版本索引
# ============================================================

versions:
  "1.19-r5":
    status: published
    build_date: "2026-06-29"
    conan_ref: "perl-set-intspan/1.19-r5@ohpcd/stable"
