software: perl-list-moreutils-xs
# 软件级 manifest 模板
# 文件位置: archives/p/perl-list-moreutils-xs/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称
name: perl-list-moreutils-xs

# 软件描述
description: "List::MoreUtils::XS - Provide the stuff missing in List::Util in XS (high-performance Perl list utilities)"

# 软件分类
category: perl_xs

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表
versions:
  - version: "0.430-r6"
    status: built
    build_date: "2026-06-15"
    notes: "G0 干净构建验证通过，Perl XS 模块"

# ============================================================
# 依赖关系
# ============================================================

# 运行时依赖
runtime_dependencies:
  - perl/5.42.0

# 构建依赖
build_dependencies:
  - perl/5.42.0
  - musl/1.2.5

# ============================================================
# OHOS 适配说明
# ============================================================

ohos_adaptation:
  key_points:
    - "Perl XS 模块，需要特殊链接参数 -nostartfiles -nodefaultlibs"
    - "Config::AutoConf::LMU 无法在 OpenHarmony 上正确检测，需跳过检查并手动生成 LMUconfig.h"
    - "CPATH 和 LIBRARY_PATH 必须设置为 musl 头文件和库路径"
    - "XS 模块在 HMDFS 上无法加载（SELinux 限制），需管理员安装到系统目录"
  common_dependencies: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Perl XS 模块需要 OTHERLDFLAGS=-nostartfiles -nodefaultlibs 参数"
  - "Config::AutoConf 模块在 OpenHarmony 上无法正确编译测试程序（-fstack-protector-strong 问题）"
  - "需要重写 write_config_h 方法来生成正确的配置文件"