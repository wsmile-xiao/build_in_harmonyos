# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

# 上游测试结论（pgdbf 0.6.2）:
#   - 上游 tarball 不含 tests/ 目录；Makefile.am 无 TESTS 变量；
#   - `make check` 仅执行 automake 空转目标（"Nothing to be done for 'check'"），
#     无任何自动化测试用例可统计。
#   - 真实测试入口 = 命令行工具自身：将 .dbf 转换为 PostgreSQL SQL。
#     test_package/test_pgdbf.sh 构造 dBase III 样例并断言转换输出
#     （CREATE TABLE / COPY 数据行 / -s LATIN1 iconv 转 UTF-8）。

package: pgdbf/0.6.2
homepage: "http://pgdbf.sourceforge.net/"

# 上游测试命令探测结果: make check 存在但为空转目标
upstream_check_command: "make check"
# recipe build() 未集成上游测试（上游无测试用例）
upstream_test_in_build: false
upstream_test_command: ""
# 上游无自动化测试，列表为空
upstream_tests: []

# test_package 中自带的测试（消费者视角功能验证）
test_package_tests:
  - file: test_pgdbf.sh
    description: "构造 dBase III 样例(sample.dbf: NAME C10/AGE N3, 记录 Café/42)，断言 pgdbf 默认转换输出 CREATE TABLE 与 COPY 行，且 -s LATIN1 经 iconv 输出 UTF-8 的 Café"
    command: "bash test_pgdbf.sh"

# 测试断言总数: 默认转换含建表 + COPY 数据行 + iconv UTF-8 三个断言
assertion_count: 3
