source:
  url: "https://pari.math.u-bordeaux.fr/pub/pari/packages/galpol.tgz"
  sha256: "562af28316ee335ee38c1172c2d5ecccb79f55c368fb9f2c6f40fc0f416bb01b"
  tar_format: tgz

build:
  system: custom
  configure_options: []
  dependencies: []
  cc: N/A
  cxx: N/A
  notes: >-
    Data-only package (GALPOL 4.0 database: 3657 groups / 7194 Galois polynomials,
    orders up to 143) consumed by PARI/GP galoisgetpol. No compilation, no configure,
    no in-package automated test. Build is a no-op; package() copies the 14681-file
    galpol/ tree (28536355 data bytes) into <pkg>/res/pari/galpol, mirroring Debian
    "dh_install galpol /usr/share/pari" but keeping files uncompressed (PARI reads them
    directly, so no gzip build tool is pulled in). Upstream galpol.tgz is byte-identical
    to galpol-4.0.tar.gz and to Debian pari-galpol_4.0.orig.tar.gz (same size 10049371
    and sha256). Real functional entry point was executed with the published
    pari/2.17.4 gp binary: 7337 assertions, 7337 pass, 0 fail (commands and per-case
    families documented in notes.md and test_package/MANIFEST.yml; raw logs kept
    locally under reports/, which .gitignore excludes from the PR).

patches_applied: []

knowledge_gained:
  - "pari-galpol is Architecture:all pure data: only Debian packaging tools (debhelper-compat=13/make/gzip), zero third-party library deps — knowledge_ref: notes.md#依赖结论w0-前置全新-conan-缓存实测未用本地缓存build-missing-绕过"
  - "runtime Depends: ${misc:Depends} is empty; only Suggests: pari-gp (consumer reading <datadir>/galpol via galoisgetpol) — knowledge_ref: notes.md#依赖结论w0-前置全新-conan-缓存实测未用本地缓存build-missing-绕过"
  - "GAP4 in the upstream README is data provenance (SmallGroup indexing), NOT a build/runtime dependency; group files ship pre-converted for galoischartable — knowledge_ref: notes.md#这个包是什么"
  - "gp locates the database through default(datadir): '<datadir>/galpol/<order>/nb'; polgalois for degree 8 additionally needs the separate galdata package, so galoisgetpol round-trip is the correct galpol-specific test — knowledge_ref: notes.md#注意事项"
  - "galoisgetpol(n,k,1) returns the real entry and (n,k,2) the complex one as [Pol,d]; flag 0 is rejected as invalid, and galoisgetpolnumber/galoisgetpolname no longer exist in 2.17 — knowledge_ref: notes.md#注意事项"
  - "GP batch drivers must not end comment lines with a backslash (lexer line-continuation silently eats function definitions and yields 0 cases with rc=0), and this gp build has no file_exists/is_file/wildcards — knowledge_ref: knowledge/drafts/E429-draft-5A6B.kv"
  - "packaged as application + commands.json binary:false (pari-seadata/ca-certificates precedent) so conan create really runs package() for res/ artifacts; package_id cleared (28 MB data is profile-independent) — knowledge_ref: notes.md#打包决策"
