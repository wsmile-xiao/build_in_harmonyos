# test_package/MANIFEST.yml — pari-galpol/20180625
# CI L0e 要求此文件存在（上游测试声明）。
#
# 本文件内所有路径引用都指向**随 PR 入仓**的文件（版本目录同级），不留任何
# 只在本地存在、评审者无法访问的路径。本地运行日志的位置见文末脚注。

package: pari-galpol/20180625
homepage: "https://pari.math.u-bordeaux.fr/galpol"

# ── 上游测试套件：包内无自动化测试（实证） ─────────────────────────────────
# pari-galpol 是纯数据包（Debian `Architecture: all`）。**包内**没有任何可运行测试：
#   1) 官方源 galpol.tgz（sha256 562af283…16bb01b，18483 条目）全部位于 data/galpol/ 下；
#      `grep -icE '(^|/)(Makefile|configure|CMakeLists.txt|setup.py|meson.build)$'` == 0，
#      `.c/.h/.cpp/.gp/.py/.sh/test` 计数 == 0（清点命令与原始输出见 ../notes.md
#      「构建/测试入口核验」一节）；
#   2) Debian debian/rules 的 build 目标仅 `touch build-stamp`，install 仅
#      `dh_install galpol /usr/share/pari` + 对 real/complex/group `gzip`，
#      **无 check / test 目标**；
#   3) debian/ 内文件清单仅 changelog/control/copyright/dirs/rules/source/format/watch，
#      **无 debian/tests/（无 autopkgtest）**；
#   4) 上游 galpol README（已随包安装为 res/pari/galpol/README，sha256 bd749aad…ac8e1a）
#      只描述数据用途与索引规则（3657 群 / 7194 多项式，阶 ≤ 143）。
upstream_check_command: ""          # 包内无 make check / 无测试脚本可跑
upstream_test_in_build: false
upstream_tests_present: false
upstream_test_count: 0

# ── 真实上游测试入口：消费方 gp 的 galoisgetpol（已实际执行，逐用例记录入仓） ────
# 数据包的功能入口天然在消费者侧。本包没有把它写成"属 pari 包的职责"而跳过，而是用
# **制品仓已发布的 pari/2.17.4 二进制**（OHOS arm64 的 bin/gp-2.17）对打包产物实跑全量断言，
# 7337 行逐用例名+结果已随 PR 入仓：../upstream-test-cases.txt
#
# 复现三步（用例集由被测目录枚举而来，不硬编码）：
#   1) conan install --requires=pari/2.17.4 -r=ohpcd \
#        -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64 --deployer=full_deploy
#   2) export LD_LIBRARY_PATH=full_deploy/host/pari/2.17.4/Release/armv8/lib:full_deploy/host/gmp/6.3.0.1/Release/armv8/lib
#   3) python3 ../upstream-gp-sweep-generator.py <pkg>/res/pari > sweep.gp
#      full_deploy/host/pari/2.17.4/Release/armv8/bin/gp-2.17 -f -q -s 500000000 < sweep.gp
#      （生成脚本自带 default(datadir,"<pkg>/res/pari")）
#
# 断言定义（对包内全部条目，非抽样）：
#   nb_count_<n>                readvec(<n>/nb)[1] == 该阶下组目录数              ×143
#   roundtrip_real_<n>_<k>      galoisgetpol(n,k,1) == read(<n>/<k>/real)
#                               且 poldegree(返回多项式) == n                      ×3657
#   roundtrip_complex_<n>_<k>   galoisgetpol(n,k,2) == read(<n>/<k>/complex)
#                               且 poldegree(返回多项式) == n                      ×3537
#
# 反向对照（证明 PASS 由本包数据驱动、而非 gp 内建）：同一 gp 二进制、同一调用，
# 把 datadir 指向不含 galpol/ 的空目录时 gp 报
#   *** galoisgetpol: error opening galpol file: '<datadir>/galpol/8/nb'.
# 另用同一生成器对**官方 tarball 未打包目录**跑过一次，同样 7337/7337（说明打包零改动）。

consumer_functional_test:
  command: >-
    python3 upstream-gp-sweep-generator.py <pkg>/res/pari | gp-2.17 -f -q -s 500000000
  driver: ../upstream-gp-sweep-generator.py       # 随 PR 入仓
  cases_log: ../upstream-test-cases.txt           # 随 PR 入仓，7337 行逐用例名+PASS/FAIL
  cases_total: 7337
  cases_pass: 7337
  cases_fail: 0
  cases_skip: 0
  pass_rate: "100%"
  duration: "2.4s (rc=0)"
  # 7337 个用例名互不重复；下列 sha256 = 用例名**升序、每行一个**后的摘要，
  # 与 ../upstream-test-cases.txt 正文复算结果一致，重跑可自行核对。
  case_names_sha256: d02fab1954b2c24f788d7acb0bd14661485e6003d3e1627cc2e750d31e16f534
  case_families:
    - {prefix: "nb_count_",          count: 143,  lexical_first: "nb_count_1",              lexical_last: "nb_count_99"}
    - {prefix: "roundtrip_real_",    count: 3657, lexical_first: "roundtrip_real_100_1",    lexical_last: "roundtrip_real_9_2"}
    - {prefix: "roundtrip_complex_", count: 3537, lexical_first: "roundtrip_complex_100_1", lexical_last: "roundtrip_complex_98_5"}

# ── test_package 打包内容级校验（R34：对真实打包字节，非空壳） ────────────────
# 注意：test_package 不替代上面的上游测试统计；两侧数字分别申报。
# 这些用例不放进 test_package 的原因：跑 gp 首次执行二进制会触发平台安全确认弹窗
# （R7），可能挂住 CI；test_package 只做确定性的字节级校验（下方，无需外部二进制）。
test_package_tests:
  - file: test_verify.py
    description: >-
      校验 <pkg>/res/pari/galpol：14681 条目/143 阶目录/6 类文件计数、nb 与组目录数自洽、
      数据总字节 28536355、整体拼接 sha256 08b4b31d…c8e52c、6 个分类拼接 sha256、
      8 个单文件 sha256 抽查、GP 文本语法全量校验、无 gzip 等意外文件混入
    command: "python3 test_verify.py <packaged_galpol_dir>"
    checks_total: 32
    checks_pass: 32
    checks_fail: 0

# 断言总数：上游包内自动化 0 + 消费方功能入口 7337 + test_package 32 = 7369
assertion_count: 7369

