software: pari-galpol
display: "PARI/GP galpol (Galois polynomial database)"
description: "Galois polynomial database (GALPOL 4.0) for PARI/GP galoisgetpol, all groups of order up to 143"
category: math
homepage: "https://pari.math.u-bordeaux.fr/galpol"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "纯数据包（Debian Architecture: all），无编译、无 configure、包内无自动化测试"
    - "无任何强制第三方库依赖；仅可选消费者 pari-gp（Suggests），GAP4 只是数据归属声明"
    - "package() 把 galpol/ 树（14681 文件 / 28536355 字节）落到 <pkg>/res/pari/galpol/"
    - "功能入口用制品仓已发布的 pari/2.17.4 gp 二进制实跑 7337 断言全通过"
    - "package_id 清空（数据与 arch/compiler/build_type 无关），避免 28MB 数据按 profile 重复"
  common_dependencies: []

versions:
  "20180625":
    status: built
    build_date: "2026-09-06"
