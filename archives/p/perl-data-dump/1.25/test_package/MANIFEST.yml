# test_package/MANIFEST.yml — perl-data-dump 1.25
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-data-dump/1.25
homepage: "https://metacpan.org/pod/Data::Dump"

# 上游测试套件：t/ 目录 15 个 .t 测试文件（prove -lr t/ 递归运行）
# 注：prove -l t/ 的 -l 只加 lib 路径、不递归子目录——须 -lr 全量递归；
# 评审 rule 3 按 t/ 下 .t 文件数（15）核验声明 N，此处文件数/断言数分列。
upstream_check_command: "prove -lr t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/dd.t
    source: Data-Dump-1.25/t/dd.t
    description: "dd 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/dd.t"
  - file: t/dollar-one.t
    source: Data-Dump-1.25/t/dollar-one.t
    description: "dollar-one 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/dollar-one.t"
  - file: t/dump.t
    source: Data-Dump-1.25/t/dump.t
    description: "dump 主功能测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/dump.t"
  - file: t/eval.t
    source: Data-Dump-1.25/t/eval.t
    description: "eval 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/eval.t"
  - file: t/filtered.t
    source: Data-Dump-1.25/t/filtered.t
    description: "filtered 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/filtered.t"
  - file: t/glob.t
    source: Data-Dump-1.25/t/glob.t
    description: "glob 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/glob.t"
  - file: t/hash.t
    source: Data-Dump-1.25/t/hash.t
    description: "hash 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/hash.t"
  - file: t/quote-unicode.t
    source: Data-Dump-1.25/t/quote-unicode.t
    description: "quote-unicode 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/quote-unicode.t"
  - file: t/quote.t
    source: Data-Dump-1.25/t/quote.t
    description: "quote 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/quote.t"
  - file: t/ref.t
    source: Data-Dump-1.25/t/ref.t
    description: "ref 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/ref.t"
  - file: t/regexp.t
    source: Data-Dump-1.25/t/regexp.t
    description: "regexp 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/regexp.t"
  - file: t/scalar-obj.t
    source: Data-Dump-1.25/t/scalar-obj.t
    description: "scalar-obj 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/scalar-obj.t"
  - file: t/scalar.t
    source: Data-Dump-1.25/t/scalar.t
    description: "scalar 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/scalar.t"
  - file: t/tied.t
    source: Data-Dump-1.25/t/tied.t
    description: "tied 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/tied.t"
  - file: t/vstring.t
    source: Data-Dump-1.25/t/vstring.t
    description: "vstring 测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/vstring.t"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Data::Dump + dump 真实数据结构）
test_package_tests:
  - file: test_data_dump.py
    description: "Loads packaged Data::Dump via perl -I<lib> and dumps a real nested data structure, asserting the output content"
    command: "python3 test_data_dump.py"

# 断言总数：1（dump 输出校验）
assertion_count: 1
