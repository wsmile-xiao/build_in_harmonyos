knowledge_gained:
  - "prison 5.116.0 is a tier-1 KF5 library whose only hard runtime deps are Qt5Core/Qt5Gui plus qrencode; Dmtx (DataMatrix) and ZXing (PDF417/EAN13/scanner) are optional and cleanly compiled out via CMAKE_DISABLE_FIND_PACKAGE_Dmtx/ZXing, which also naturally disables the Qt5Quick/Qt5Multimedia-gated subdirectories."
  - "Upstream consumes qrencode through a manual FindQRencode.cmake (module mode); the qrencode conan package is wired by pre-setting the QRencode_INCLUDE_DIRS / QRencode_LIBRARIES cache variables in the toolchain (prison/6.18.0 precedent) plus the package prefix on CMAKE_PREFIX_PATH/CMAKE_LIBRARY_PATH."
  - "All six upstream autotests are QTEST_APPLESS_MAIN (no GUI event loop, .qrc-embedded reference images, no D-Bus and no QStandardPaths data), so with the optional backends cut off the remaining four targets run for real on OHOS through ctest with QT_QPA_PLATFORM=offscreen."
  - "KF5 chain conventions carried over from kpeople5/5.116.0: QT_MAJOR_VERSION=5, qt5-qtbase/5.15.2.2 force-normalised graph, native Qt5 configs consumed with cmake_find_mode=none + CMAKE_PREFIX_PATH, the ../b/mkspecs tree recreated for Qt5CoreConfigExtrasMkspecDir, CMAKE_SYSTEM_NAME=Linux double override (toolchain + cache), KF_SKIP_PO_PROCESSING=ON, unversioned DT_SONAME and CMAKE_BUILD_WITH_INSTALL_RPATH=ON."
