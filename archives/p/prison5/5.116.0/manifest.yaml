    (prison-datamatrixtest, prison-zxingutiltest) are compiled out by
    upstream's own TARGET guards with Dmtx/ZXing disabled.
  test_package: >-
    passed: 1/1 CTest test (test_prison5, 21 assertions) plus direct binary
    execution - drives the real public API (Prison::createBarcode factory for
    QRCode/Code39/Code93/Code128/Aztec, setData/toImage round-trips,
    Null/DataMatrix/PDF417/EAN13 null-pointer contract) and asserts the
    HarmonyOS ELF adaptation (unversioned DT_SONAME + DT_RUNPATH).
