version: 1
package: prison5/5.116.0
homepage: https://invent.kde.org/frameworks/prison

tests:
  upstream:
    status: planned
    command: "ctest --test-dir <build_folder> --output-on-failure --no-tests=error"
    source: "prison-5.116.0/autotests/"
    expected:
      - prison-aztecbarcodetest
      - prison-code128barcodetest
      - prison-qrtest
      - prison-reedsolomontest
  package:
    status: planned
    source: test.cpp
    command: "./test_prison5"
    description: >-
      Drives the real Prison public API (createBarcode factory for
      QRCode/Code39/Code93/Code128/Aztec, Null/DataMatrix/PDF417/EAN13
      null-pointer contract of the optional-backend cut, setData/data and
      setData(QByteArray)/byteArrayData round-trips, toImage rendering
      through the QPainter path and the qrencode backend) and asserts
      HarmonyOS-specific behaviour: the loaded libKF5Prison.so carries
      the unversioned DT_SONAME plus a DT_RUNPATH (E537 install-RPATH
      adaptation).

notes:
  - "prison5 is a pure library package (the KF5Prison shared library plus
     the upstream prison-datamatrix demo tool); no commands.json is
     required (R38)."
  - "All six upstream autotests are QTEST_APPLESS_MAIN binaries with
     .qrc-embedded reference images - no GUI event loop, no D-Bus and no
     QStandardPaths data are needed, so with Dmtx/ZXing disabled the four
     remaining targets run for real on OHOS; the datamatrix/zxingutil
     tests are compiled out by upstream's own TARGET guards."
  - "Upstream tests are run from build() with ctest; any test that cannot
     run in the headless sandbox is listed in notes.md with the concrete
     reason."
