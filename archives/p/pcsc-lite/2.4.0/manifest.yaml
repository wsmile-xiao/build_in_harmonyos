software: pcsc-lite
version: 2.4.0
status: published
build_system: meson
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - -Dlibsystemd=false
  - -Dlibudev=false
  - -Dlibusb=true
  - -Dpolkit=false
  - -Dusb=true
  - -Dserial=true
build_date: 2026-05-25
compiler: clang 15.0.4
platform: HarmonyOS aarch64
dependencies:
  - libusb-1.0 >= 1.0.27
features:
  - USB
  - serial
  - libusb
  - filter_names
url_source: https://pcsclite.apdu.fr/files/pcsc-lite-2.4.0.tar.xz
url_download: https://pcsclite.apdu.fr/
license: GPL-3.0
description: Middleware to access a smart card using SCard API (PC/SC)
notes: |
  Compiled successfully on HarmonyOS aarch64.
  - Used meson build system instead of autotools (autoreconf failed due to macro issues)
  - Applied patch for pthread_cancel (not implemented on HarmonyOS)
  - ELF signed with OpenHarmony self-sign certificate
  - All binaries verified working: pcscd --version shows 2.4.0
patches:
  - 0001-pthread_cancel-harmonyos.patch
artifacts:
  - pcsc-lite-2.4.0-ohos-aarch64.tar.gz
quality_gate:
  G0_clean_build: PASS
  G1_binary_complete: PASS
  G2_functional: PASS
  G3_portable: PASS (ELF signed)
  G4_archive: PASS