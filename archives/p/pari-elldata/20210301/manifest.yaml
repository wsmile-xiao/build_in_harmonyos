knowledge_gained:
  - "Pure data package pattern: package_type=unknown + package_id.clear() (noarch), source() unpacks, package() copies data files to share/pari/<pkg>/"
  - "R34 data-package exemption: with no callable API, test_package runs a deterministic data-integrity validator (file set + pinned per-file SHA-256 + content sanity) instead of compiling a consumer"
