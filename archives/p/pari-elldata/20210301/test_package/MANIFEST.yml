package: pari-elldata/20210301
homepage: "https://pari.math.u-bordeaux.fr/"

upstream_check_command: "gp: defaultellsearch(\"11a1\")"
upstream_test_in_build: false
upstream_test_command: "gp ellsearch(\"11a1\")"
upstream_tests:
  counting_basis: "Upstream exercises the data through gp itself (ellsearch/ellidentify/ellgenerators); no standalone upstream test suite exists for the data package"
  total: 1
  executed: 0
  passed: 0
  not_run_reason: "The PARI/GP interpreter (gp) is not a test_package dependency; the data package has no API, so the consumer test validates data completeness and payload identity instead (R34 data-package exemption)"

test_package_tests:
  - file: test_pari_elldata.py
    scenario: structural
    description: "All 500 data files (ell0..ell499) plus README exist in share/pari/elldata and none is empty"
    command: "python3 test_pari_elldata.py --package-root <package-folder>"
  - file: test_pari_elldata.py
    scenario: payload-identity
    description: "Every data file matches the pinned SHA-256 of the official 20210301 release payload"
    command: "python3 test_pari_elldata.py --package-root <package-folder>"
  - file: test_pari_elldata.py
    scenario: content-sanity
    description: "ell0 contains curve 11a1 (smallest conductor) with its Weierstrass coefficients; README documents the 500000 conductor range"
    command: "python3 test_pari_elldata.py --package-root <package-folder>"

assertion_count: 6
