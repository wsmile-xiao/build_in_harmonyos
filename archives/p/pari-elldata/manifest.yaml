software: pari-elldata
display: "PARI/GP elldata (Cremona elliptic curve database)"
description: "PARI/GP 椭圆曲线数据包：J. E. Cremona 数据库（导数 < 500000 全部有理椭圆曲线等度同类），供 ellsearch/ellidentify/ellgenerators 使用"
category: data
homepage: "https://pari.math.u-bordeaux.fr/"
license: GPL-2.0-or-later
build_system: data

ohos_adaptation:
  key_points:
    - "纯数据包：tarball 解包即数据文件，无编译无链接，noarch 打包"
    - "数据装到 share/pari/elldata/，PARI_ELLDATA_DIR 环境变量导出数据目录"
    - "R34 数据包豁免：无 API 可调用，test_package 以数据完整性验证（文件集 + pin sha256 + 内容健全性）等效替代"
  common_dependencies: []

versions:
  "20210301":
    status: built
    build_date: "2026-09-04"
    conan_ref: "pari-elldata/20210301"
    notes: "noarch 数据包；conan create + test_package 6/6 数据完整性断言通过；官方 CI 提供最终 OHOS 验证"
