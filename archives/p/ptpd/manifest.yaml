software: ptpd
display: "PTPd"
description: "IEEE 1588 精密时间协议（PTP）守护进程，主/从时钟模式，支持 SO_TIMESTAMPING 与 libpcap"
category: utility
homepage: "https://sourceforge.net/projects/ptpd/"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游自带生成的 configure：直接运行，不 autoreconf"
    - "显式 --build/--host=aarch64-unknown-linux-gnu：OHOS 上 host==build，Conan 不下发三元组，避免 config.guess"
    - "HMDFS 下 configure 的 umask 077 会让 config.status 失败 → 改 022"
    - "bionic 有 <utmpx.h> 但无 setutxent/pututxline/endutxent → ac_cv_header_utmpx_h=no"
    - "bionic 无 ether_ntohost() → 降级数字 MAC（补丁）"
    - "<linux/socket.h> 与 <sys/socket.h> sockaddr_storage 重定义 → 预定义 UAPI 防重复宏（补丁）"
  common_dependencies:
    - "libpcap/1.10.6（可选，默认开启）"

versions:
  "2.3.1-debian1":
    status: built
    build_date: "2026-09-26"
    conan_ref: "ptpd/2.3.1-debian1"
