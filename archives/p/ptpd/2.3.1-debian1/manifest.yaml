# 版本级 manifest — archives/p/ptpd/2.3.1-debian1/manifest.yaml

version: "2.3.1-debian1"
software: ptpd
status: built
build_date: "2026-09-26"
build_system: autotools
conan_ref: "ptpd/2.3.1-debian1"

source:
  url: "https://deb.debian.org/debian/pool/main/p/ptpd/ptpd_2.3.1-debian1.orig.tar.xz"
  sha256: "c37e6f5233b534a1c650f8985b32b171adcfcd922bd3af43e8e9fa2d4bc1ae22"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-gnu"
    - "--host=aarch64-unknown-linux-gnu"
    - "--disable-snmp"
    - "--disable-pcap (when the pcap option is off)"
    - "ac_cv_header_utmpx_h=no"
    - "ac_cv_header_utmp_h=no"
  dependencies:
    - "libpcap/1.10.6 (optional, pcap option, default on)"
  cc: clang

test_results:
  target: "OpenHarmony aarch64"
  upstream_framework: "none (no upstream test suite)"
  upstream_passed: 0
  upstream_failed: 0
  test_package_passed: 12
  test_package_failed: 0
  test_package_assertions: 12
  execution: "conan create rc=0; 12 consumer CLI assertions"

test_passed: 12
test_failed: 0

patches_applied:
  - "patches/0001-net-c-ohos-sockaddr-storage.patch"
  - "patches/0002-sys-c-ether-ntohost.patch"

knowledge_gained:
  - "上游自带生成的 configure/Makefile.in：直接跑随包 configure，不 autoreconf"
  - "OHOS 侧 host==build 时 Conan 不发 --build/--host，须显式传 aarch64-unknown-linux-gnu 避免 config.guess"
  - "configure 的 umask 077 在 HMDFS 上会让 config.status 无法建临时文件 → 改 022"
  - "bionic <utmpx.h> 存在但无 setutxent/pututxline/endutxent（E121），用 ac_cv_header_utmpx_h=no 关掉"
  - "bionic 无 ether_ntohost()（有 ether_aton/ether_ntoa）→ 按 R8 用 configure 的 AC_CHECK_FUNCS 探测 + HAVE_ETHER_NTOHOST 守卫，不用平台宏"
  - "<linux/socket.h> 与 <sys/socket.h> 的 sockaddr_storage 重定义（E091/E119）"
