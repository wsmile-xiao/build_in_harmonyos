# test_package/MANIFEST.yml
# ptpd 2.3.1-debian1
#
# Upstream ships NO automated test suite: test/ only contains three sample
# PTP configuration files and testing.org (a hand-run interoperability guide).
# There is no `make check` target and no test binary, so upstream_test_count is
# 0 and the adaptation supplies consumer tests instead (CI rule8/rule9/rule12).

package: ptpd/2.3.1-debian1
homepage: https://sourceforge.net/projects/ptpd/

upstream_tests_exist: false
upstream_test_audit: "test/ holds client-e2e-8023.conf, client-e2e-pcap.conf, client-e2e-socket.conf and testing.org only; no Makefile check target, no test program"
upstream_check_command: "none (no `make check`)"
upstream_test_in_build: false
upstream_test_count: 0
upstream_passed: 0
upstream_failed: 0

test_package_tests:
  - file: test_ptpd.sh
    description: "installed ptpd2 CLI: version, short/long help, default-config dump, setting help, unknown-option error path"
    command: "PTPD_BIN=<pkg>/bin/ptpd2 sh test_ptpd.sh"

test_files:
  - path: "test_package/test_ptpd.sh"
    test_type: "OHOS consumer"
    assertion_count: 12
    description: "12 CLI assertions against the installed binary (no filesystem writes)"

test_package_test_count: 12
consumer_assertion_count: 12
assertion_count: 12
