# conandata.yml - ptpd 2.3.1-debian1
#
# The platform task version "2.3.1-debian1" is the Debian source-package
# release identity: the upstream orig tarball is named
# ptpd_2.3.1-debian1.orig.tar.xz and configure.ac's AC_INIT version is 2.3.1.
# Debian is the only publication point for this release (sourceforge hosts a
# different, older tree), so the HTTPS Debian pool URL is used and the sha256
# is checked character-for-character against ptpd_2.3.1-debian1-6.dsc.

sources:
  url: "https://deb.debian.org/debian/pool/main/p/ptpd/ptpd_2.3.1-debian1.orig.tar.xz"
  sha256: "c37e6f5233b534a1c650f8985b32b171adcfcd922bd3af43e8e9fa2d4bc1ae22"

patches:
  - patch_file: "patches/0001-net-c-ohos-sockaddr-storage.patch"
    patch_description: "Predefine the _UAPI_LINUX_SOCKET_H include guard so <linux/socket.h> (pulled in via <linux/net_tstamp.h>) does not redefine sockaddr_storage on bionic"
    patch_type: "portability"
  - patch_file: "patches/0002-sys-c-ether-ntohost.patch"
    patch_description: "Detect ether_ntohost() with configure's AC_CHECK_FUNCS and guard the call with HAVE_ETHER_NTOHOST"
    patch_type: "portability"
