# test_package/MANIFEST.yml
# PBSIM 1.0.3-git20180330.e014b1d - upstream test declaration and consumer audit.

package: pbsim/1.0.3-git20180330.e014b1d
homepage: "https://github.com/pfaucon/PBSIM-PacBio-Simulator"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream PBSIM ships no test suite: the tarball contains only the autotools
  build files (configure.ac, Makefile.am, src/Makefile.am), the C++ sources
  (pbsim.cpp, helpers.cpp, output.cpp and headers), plus data/sample files.
  There is no `check`/`test` target and no tests/ directory.
upstream_check_command: "n/a (no test target)"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests: []

test_package_tests:
  - file: test_pbsim.sh
    description: >-
      installed-program consumer checks: presence/executability of pbsim, the
      --version and --help banners, the no-argument usage path and the invalid
      --data-type error path.
    command: "sh test_pbsim.sh"

test_files:
  - path: "test_package/test_pbsim.sh"
    test_type: "R34"
    assertion_count: 7

test_package_test_count: 1
consumer_assertion_count: 7
upstream_test_cases: 0
assertion_count: 7
