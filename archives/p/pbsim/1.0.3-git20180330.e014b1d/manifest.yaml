knowledge_gained:
  - "PBSIM 发布包不含预生成 configure；真机 autoconf 的 config.status 在 OHOS 上执行其临时 awk 辅助脚本会 Permission denied（config.status: .../subs1.awk），因此改为直接用 clang++ 编译 3 个 .cpp"
  - "pbsim.cpp 仅在定义 HAVE_CONFIG_H 时 #include \"../config.h\"；不定义该宏即可完全绕开 autotools config.h"
  - "C++ 项目，零三方依赖；版本坐标为 Debian 上游快照 1.0.3+git20180330.e014b1d，用 dfsg orig tarball sha256 固定"
