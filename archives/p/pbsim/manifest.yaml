software: pbsim
display: "PBSIM"
description: "PacBio 长读长/CCS 测序模拟器"
category: utility
homepage: "https://github.com/pfaucon/PBSIM-PacBio-Simulator"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "发布包无预生成 configure，需 autoreconf -i 后再 configure"
    - "C++ 项目，零三方依赖；显式传 CXX=<ohos clang++>"
    - "版本坐标为 Debian 上游快照 1.0.3+git20180330.e014b1d，以 dfsg orig tarball sha256 固定"
  common_dependencies: []

versions:
  - version: "1.0.3-git20180330.e014b1d"
    status: built
    build_date: "2026-10-03"
