software: parse
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.22.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.22.2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-21"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 PyPI sdist，1.22.2）
  url: "https://files.pythonhosted.org/packages/c6/ee/0d009de843577b7a4893517fe517b54791e576dedd00ed9209c8498eddc2/parse-1.22.2.tar.gz"

  # 源码校验和（实测）
  sha256: "8ff0b98202798b8cefa4f8fac06b670d6d00e5ec6ecbbacaf97ac0d0e93a54e6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "pip install --break-system-packages --timeout 120 --retries 3 setuptools (build() 首步, r02 PEP 517 后端保障)"
    - "pip install --no-deps --no-build-isolation --target=install"

  # 编译依赖列表（格式: name/version）——parse 纯标准库，无运行时依赖
  dependencies: []

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "parse is a pure Python package (no C extension to compile), single package parse/ + typing stub"
  - "No runtime dependencies (PyPI requires_dist empty for 1.22.2); build backend setuptools>=61.2"
  - "Built using pip install --target --no-deps (gitpython/python-dateutil precedent pattern)"
  - "Not a CLI: no console_scripts / entry_points, no bin/ executables -> no commands.json needed (R38/L0k)"
  - "Upstream pytest suite: 98 collected, 97 passed / 1 skipped (Python 3.5 removed 100-named-groups limit -> version-condition skip) on local OHOS env, see test-report.md"
  - "parse default '{}' field type is non-greedy .+? (matches 1 char in findall); use explicit type like {:w} or {:ti} for word/ISO-date fields"