# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist
# See: docs/TEST_QUALITY_SPEC.md

package: parse/1.22.2
homepage: "https://github.com/r1chardj0n3s/parse"

# Upstream test command
upstream_check_command: "python3 -m pytest tests/ -p no:cacheprovider -o addopts=''"

# conanfile.py build() method - upstream test integration
upstream_test_in_build: false
upstream_test_command: ""

# Upstream actual test programs（parse 1.22.2 tag tests/ 目录 pytest 套件，
# 98 collected：本地 OHOS 环境实跑 97 passed + 1 skipped（版本条件 skip——
# Python 3.5 removed the limit of 100 named groups in a regex，python3.12 下
# 该限制已不存在，无需恢复）。详见 test-report.md 双口径台账。）
upstream_tests:
  - file: tests/test_parse.py
    source: parse-1.22.2 tag tests/test_parse.py
    description: "核心解析功能：parse/search/findall/compile/类型转换/边界"
    command: "python3 -m pytest tests/test_parse.py -o addopts=''"
  - file: tests/test_bugs.py
    source: parse-1.22.2 tag tests/test_bugs.py
    description: "历史 bug 回归用例"
    command: "python3 -m pytest tests/test_bugs.py -o addopts=''"
  - file: tests/test_parsetype.py
    source: parse-1.22.2 tag tests/test_parsetype.py
    description: "类型转换器（int/float/date/time 等）解析测试"
    command: "python3 -m pytest tests/test_parsetype.py -o addopts=''"
  - file: tests/test_pattern.py
    source: parse-1.22.2 tag tests/test_pattern.py
    description: "格式模式（命名/位置/宽度/对齐）解析测试"
    command: "python3 -m pytest tests/test_pattern.py -o addopts=''"
  - file: tests/test_result.py
    source: parse-1.22.2 tag tests/test_result.py
    description: "Result 对象（fixed/named/spans）测试"
    command: "python3 -m pytest tests/test_result.py -o addopts=''"
  - file: tests/test_search.py
    source: parse-1.22.2 tag tests/test_search.py
    description: "search() 定位查找测试"
    command: "python3 -m pytest tests/test_search.py -o addopts=''"
  - file: tests/test_findall.py
    source: parse-1.22.2 tag tests/test_findall.py
    description: "findall() 多匹配迭代测试"
    command: "python3 -m pytest tests/test_findall.py -o addopts=''"
  - file: tests/check_typing.py
    source: parse-1.22.2 tag tests/check_typing.py
    description: "mypy 类型检查脚本（文件头声明 not to be run with pytest）——不计入独立用例"
    command: ""

# test_package tests (consumer perspective verification)
test_package_tests:
  - file: test_parse.py
    description: "消费者视角冒烟：import parse、版本核对、公开 API 表面（parse/search/findall/compile/with_pattern）、位置/命名解析、int/float 类型转换、search/findall、compile+with_pattern 自定义类型"
    command: "python3 test_parse.py"
  - file: conanfile.py
    description: "Conan test_package entrypoint — runs test_parse.py"

# 上游 98 collected：97 passed + 1 skipped（版本条件 skip）
# + test_package 15 组断言 + 鸿蒙专项 8 组断言（ohos 专项独立计数，不并入 assertion_count）
upstream_case_count: 98
upstream_passed_case_count: 97
upstream_skipped_case_count: 1
test_package_assertion_count: 15
assertion_count: 113