software: perl-mixin-linewise
# 版本级 manifest
# 文件位置: archives/p/perl-mixin-linewise/0.111/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.111"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# 构建系统（顶层字段，供质量门禁检查）
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RJ/RJBS/Mixin-Linewise-0.111.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "Sub-Exporter/0.987"
    - "PerlIO-utf8_strict/0.010"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块链接需要 OHOS SDK sysroot 和 LLVM lib 路径: LDDLFLAGS 追加 -L$SYSROOT/usr/lib/aarch64-linux-ohos -L$LLVM_LIB -nodefaultlibs -lunwind -lc"
  - "Perl Makefile.PL 不接受命令行 LDFLAGS 参数，需直接修改生成的 Makefile 中 LDDLFLAGS 行"
  - "PerlIO::utf8_strict XS 模块因 SELinux HMDFS 限制无法从 ~/usr/local 加载，需创建 HNP 包安装到系统目录（与 perl-dbd-pg 同类问题）"
  - "Mixin::Linewise::Writers 为纯 Perl 模块，完全可用；Readers 硬依赖 PerlIO::utf8_strict XS 模块"
