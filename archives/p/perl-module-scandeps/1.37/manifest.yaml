software: perl-module-scandeps

# 版本级 manifest
# 文件位置: archives/{letter}/{name}/1.37/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.37"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"
compile_date: "2026-06-18"

# 构建系统类型（顶层字段）
build_system: perl

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RS/RSCHUPP/Module-ScanDeps-1.37.tar.gz"

  # 源码校验和
  sha256: "1f5e119cade1466c39c71e5bc35a8d4f4e672635db03d79a5a0dcf08c4e2b5a3"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无额外依赖，仅需 Perl 5.42.0 核心模块 ExtUtils::MakeMaker

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 Perl 模块，无需任何补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块在 OpenHarmony 上无需任何平台适配修改，开箱即用"
  - "与 XS 模块（如 perl-dbd-pg）不同，纯 Perl 模块不受 SELinux HMDFS 限制"
  - "Module::ScanDeps 使用 ExtUtils::MakeMaker 构建系统，PREFIX+INSTALLDIRS=site 指定安装路径"
  - "scan_deps() 函数能正确识别 XS 模块（.so 共享库）的依赖关系（type=shared）"
  - "Cache 功能正常工作，可加速重复依赖扫描"
  - "scandeps.pl 命令行工具支持 -B(bundle)、-R(recursive)、-C(cache) 等选项，功能完整"
  - "201 个核心测试全部通过，覆盖静态扫描、OO接口、插件、dynaloader 检测等全部 API"
  - "OO 接口 new() 方法需传入 hashref（上游 API 设计，非平台限制）"
