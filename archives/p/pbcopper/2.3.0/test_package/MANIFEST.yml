# test_package/MANIFEST.yml — pbcopper 2.3.0
# Upstream and consumer test declaration required by CI L0e.

package: pbcopper/2.3.0
homepage: "https://github.com/PacificBiosciences/pbcopper"

upstream_tests_exist: true
upstream_test_audit:
  source_tarball: "v2.3.0.tar.gz (official GitHub tag archive, SHA-256 verified)"
  source_sha256: "5a183e4a4c860b7e4616b7dda6a3e04fc447d91aa8d75cfbe9b66bebc909c631"
  build_system: "Meson (>= 0.57, C++20/C17)"
  test_definition: >
    Upstream tests are 79 gtest source files under tests/src/*.cpp
    (static macro scan ~700 TEST/TEST_F instances; true-machine gtest XML
    reports tests="697"). tests/meson.build compiles them into a single
    pbcopper_test binary and registers 2 meson test() entries:
    'pbcopper formatting check' (clang-format lint) and
    'pbcopper gtest unittests' (the binary, with
    --gtest_output=xml:pbcopper-gtest-unittests.xml). Counting unit is
    one gtest case, observed at runtime as one
    '[ RUN ] Suite.Case' line and summarized in the XML report
    (tests/failures/skipped attributes) and as '[  PASSED  ] N tests.'
    Take-number commands: gtest XML tests attribute -> discovered,
    failures + errors -> failed, skipped -> skipped;
    passed = discovered - failed - skipped. The formatting lint is not
    a gtest case and contributes 0 to the totals, but meson test exit
    code gates the build. Preflight 2026-09-25: discovered=697,
    executed=697, passed=697.
  dependency: "gtest (Conan host requirement gtest/1.17.0.1 when tests=True, exposed to Meson via hand-written gtest.pc/gtest_main.pc plus PKG_CONFIG_PATH; meson fallback subproject disabled with wrap_mode=nodownload)"
  portability_changes:
    - "构建时从官方 boost 1.91.0-1 cmake 包 (与 boost/1.91.0.1.1 同 URL/sha256, BSL-1.0) "
    - "合并全部 libs/*/include/boost 为 overlay 并 -I 置顶, 覆盖 icl/ublas 等 header-only 缺口; "
    - "boost/1.91.0.1.1 只安装过滤子集; 无仓库内 vendor, 不改 boost 配方与算法代码"
  examples_note: >
    Upstream has no separate example test entries; tools/ holds helper
    scripts (check-formatting) used by the lint entry, not test cases.

upstream_check_command: "meson test -C <build-folder> --no-rebuild --print-errorlogs"
upstream_test_in_build: true
upstream_test_command: "meson test -C <build-folder> --no-rebuild --print-errorlogs"

upstream_test_total: 697
upstream_test_count_method: gtest_macros
upstream_test_passed: 697
upstream_test_failed: 0
upstream_test_skipped: 0

# Representative sample (all 79 files follow the same pattern; full list in
# notes: 700 macros). Each entry below is one file built into pbcopper_test.
upstream_tests:
  - file: tests/src/data/test_Cigar.cpp
    source: pbcopper-2.3.0/tests/src/data/test_Cigar.cpp
    description: "Cigar/CigarOperation unit tests (21 cases)"
    command: "./pbcopper_test --gtest_filter=Data_Cigar*"
  - file: tests/src/data/test_Interval.cpp
    source: pbcopper-2.3.0/tests/src/data/test_Interval.cpp
    description: "Interval unit tests (26 cases)"
    command: "./pbcopper_test --gtest_filter=Data_Interval*"
  - file: tests/src/utility/test_StringUtils.cpp
    source: pbcopper-2.3.0/tests/src/utility/test_StringUtils.cpp
    description: "StringUtils unit tests (10 cases)"
    command: "./pbcopper_test --gtest_filter=Utility_StringUtils*"
  - file: tests/src/container/test_BitContainer.cpp
    source: pbcopper-2.3.0/tests/src/container/test_BitContainer.cpp
    description: "BitContainer unit tests (41 cases)"
    command: "./pbcopper_test --gtest_filter=*BitContainer*"
  - file: tests/src/pbmer/test_Dbg.cpp
    source: pbcopper-2.3.0/tests/src/pbmer/test_Dbg.cpp
    description: "Dbg unit tests (29 cases)"
    command: "./pbcopper_test --gtest_filter=*Dbg*"

test_package_tests:
  - file: test_pbcopper.cpp
    scenario: "consumer-api"
    description: >
      Build and run a Conan consumer that constructs Data::Interval,
      round-trips Data::Cigar through FromStdString/ToStdString, checks
      CigarOperation::TypeToChar, joins strings and parses SI/scientific
      notation via Utility, and reads Pbcopper::LibraryInfo. Each of the
      8 CHECKs has a failure exit path.
    command: "./test_pbcopper"
    assertions: 8

assertion_count: 8
