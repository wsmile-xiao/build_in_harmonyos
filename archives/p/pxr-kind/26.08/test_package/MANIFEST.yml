# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
#
# 上游测试: pxr/usd/kind/testenv/testKindRegistry.py (Python, 依赖
# PXR_ENABLE_PYTHON_SUPPORT 与 python 插件机制)。本构建禁用 Python
# (静态库、纯 C++ 交付)，上游 Python 测试无法在目标环境运行。
# 本包为 Conan 自定义测试（L1 级别），以 C++ 复刻上游用例:
# test_Basic 的内置 kind 校验 + 经 plugInfo.json 注册扩展 kind 的校验
# (上游 TestKindModule 的 test_model_kind/test_root_kind，改用
# resource 型插件以脱离 Python)。

test_level: L1
test_type: conan_test_package
upstream_tests: pxr/usd/kind/testenv/testKindRegistry.py
description: "C++ port of upstream testKindRegistry.py: builtin kinds, base-kind hierarchy, IsA queries, plugInfo.json-contributed kinds"
