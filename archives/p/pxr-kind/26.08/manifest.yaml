  - "-DPXR_BUILD_IMAGING=OFF"
  - "-DPXR_BUILD_USD_IMAGING=OFF"
  - "-DPXR_BUILD_USDVIEW=OFF"
  - "-DPXR_BUILD_TESTS=OFF"
  - "-DPXR_BUILD_EXAMPLES=OFF"
  - "-DPXR_BUILD_TUTORIALS=OFF"
  - "-DPXR_BUILD_USD_TOOLS=OFF"
  - "-DPXR_ENABLE_PYTHON_SUPPORT=OFF"
  - "-DPXR_BUILD_EXEC=OFF"
  - "-DPXR_BUILD_USD_VALIDATION=OFF"
  - "-DPXR_BUILD_USD=OFF"
  - "-DCMAKE_DISABLE_FIND_PACKAGE_Python=ON"
  - "-DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON"
source:
  url: "https://github.com/PixarAnimationStudios/OpenUSD/archive/refs/tags/v26.08.tar.gz"
  sha256: "4bccbb95cddda1dbeef2f74a08b9456352f2aa91bfd4578c0c613009c7950149"
  tar_format: tar.gz
build:
  system: cmake
  dependencies:
    - tbb/2023.0.0
  cc: clang
  cxx: clang++
knowledge_gained:
  - usd_kind_location: kind library lives in pxr/usd/kind (not pxr/base); its lib lands in build/pxr/usd/kind/libusd_kind.a
  - usd_kind_deps: building target 'kind' pulls in plug, js, tf, trace, arch (work is header-only), matching pxr_library(kind LIBRARIES tf plug) and plug's LIBRARIES arch tf js trace work TBB::tbb
  - usd_plug_resource_type: plugInfo.json with Type 'resource' registers metadata-only plugins without Python; Type 'python' is rejected when PXR_PYTHON_SUPPORT_ENABLED is off (info.cpp)
  - usd_registerplugins_trailing_slash: PlugRegistry::RegisterPlugins(path) appends 'plugInfo.json' only when the path ends in a slash
  - usd_tbb_module_fallback: Packages.cmake falls back to the bundled FindTBB.cmake module; it resolves conan's tbb via CMAKE_LIBRARY_PATH/CMAKE_INCLUDE_PATH injected by CMakeToolchain for direct requirements (no CMakeDeps needed)
patches_applied:
  - patch_file: "patches/0001-arch-fixes-for-ohos.patch"
    description: "Fix arch library build errors on OHOS: _SC_LEVEL1_DCACHE_LINESIZE undefined, strerror_r return type mismatch, __environ to environ, DEFFILEMODE undefined in tf"
