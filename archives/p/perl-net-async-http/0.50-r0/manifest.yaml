software: perl-net-async-http
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.50-r0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.50-r0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-24"
compile_date: "2026-06-24"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/P/PE/PEVANS/Net-Async-HTTP-0.50.tar.gz"

  # 源码校验和
  sha256: "009bd1005458539a558638c555a9736011198aa7d58c21baee0c55e7c993dfd6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型 (顶层字段，verify-build G4 检查)
# cmake | autotools | makefile | meson | perl | python | custom
build_system: perl

build:
  # 构建系统类型（兼容旧格式）
  system: perl

  # 配置选项列表
  configure_options:
    - "--install_base=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-io-async/0.805"
    - "perl-http-cookies/6.11"
    - "perl-test-metrics-any/0.01"

  # 编译器
  cc: clang
  cxx: clang++

  # 构建命令（Module::Build 方式）
  build_commands:
    configure: "perl Build.PL --install_base=$DEFAULT_PREFIX"
    build: "./Build"
    test: "./Build test"
    install: "./Build install --destdir=$TEST_PREFIX"
    install_real: "./Build install"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（Module::Build）在鸿蒙平台可直接编译通过，无需修改源码"
  - "Net::Async::HTTP 使用 Module::Build 而非 ExtUtils::MakeMaker，构建命令为 ./Build 而非 make"
  - "纯 Perl 模块不存在 SELinux/HMDFS 限制问题（与 XS 模块如 perl-dbd-pg 不同）"
  - "SSL/SOCKS 为可选依赖，跳过的 5 项测试不影响核心 HTTP 功能"
  - "异步 HTTP 请求经本地服务器验证完全可用（非阻塞 IO::Async 事件循环）"
