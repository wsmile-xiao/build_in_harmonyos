software: perl-net-async-http
description: "HTTP client library for Perl using IO::Async - asynchronous HTTP/1.1 client with connection pooling, pipelining, streaming, and cookie support"

homepage: https://metacpan.org/pod/Net::Async::HTTP
repository: https://github.com/PEVANS/Net-Async-HTTP
license: perl5

categories:
  - perl-module
  - networking
  - async

runtime_dependencies:
  - perl/5.42.0
  - perl-io-async/0.805
  - perl-http-message/6.46
  - perl-http-cookies/6.11
  - perl-uri/5.21

build_dependencies:
  - perl/5.42.0
  - perl-module-build/0.4234
  - perl-io-async/0.805
  - perl-http-cookies/6.11
  - perl-test-metrics-any/0.01

versions:
  - version: "0.50-r0"
    status: published
    build_date: "2026-06-24"
    notes: "纯 Perl 模块（Module::Build），无 XS 组件，直接编译通过。556 项测试全部通过，功能测试验证模块在鸿蒙平台可正常发起异步 HTTP 请求。"
