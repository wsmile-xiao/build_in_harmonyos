package: python-dateutil/2.9.0.post0
homepage: "https://github.com/dateutil/dateutil"

upstream_check_command: "python3 -m pytest tests/"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest tests/"

upstream_tests:
  - name: tests/（test_*.py + property/ 子集——日期/时间解析测试套件）
    count: 2095
    description: "**实测 2026 passed / 5 failed / 47 skipped / 17 xfailed（2095 收集）**——python3 -m pytest tests/（忽略 PytestRemovedIn10Warning——parametrize generator 弃用警告被新 pytest 当 error；测试依赖 hypothesis 已装——依赖可装则装）；5 failed 全在 test_tz.py（OHOS 无系统 tzdata——gettz 返回 None/tzlocal 无本地时区——环境受限如实分类，同 absl time 组件教训）；0 errors；**通过率口径：2026/2078=97.5%（passed/(passed+failed+errors+skipped)——跳过项计入分母**——xfailed（预期失败）不计入分母、单列；47 skipped 全为上游显式 skipif 设计（31 Requires Windows + 2 Sub-minute 互斥 + 3 Known failure，无环境可满足项）"

test_package_tests:
  - file: test_dateutil.py
    description: "冒烟测试：真实调用 parser.parse + relativedelta（R34——纯用户态）"
    command: "python3 test_dateutil.py <site-packages>"

assertion_count: 2
