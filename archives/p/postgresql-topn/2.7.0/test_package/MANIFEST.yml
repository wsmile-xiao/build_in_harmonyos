# test_package/MANIFEST.yml
package: postgresql-topn/2.7.0
homepage: "https://github.com/citusdata/postgresql-topn"

upstream_check_command: "make installcheck"
upstream_test_in_build: true
upstream_test_command: "make installcheck"

upstream_tests_exist: true
upstream_test_framework: pg_regress
upstream_test_count: 8
upstream_test_groups:
  - add_agg
  - union_agg
  - char_tests
  - null_tests
  - add_union_tests
  - copy_data
  - customer_reviews_query
  - join_tests
upstream_test_runner: "make installcheck (initdb cluster -> pg_ctl start -> make install DESTDIR -> createdb -> make installcheck)"
upstream_test_dependency: "running PostgreSQL 18.3 server (postgres + initdb + pg_ctl + createdb binaries)"

upstream_test_audit: |
  Audited upstream v2.7.0 source tree. Upstream has 8 pg_regress groups
  listed in Makefile REGRESS, each with matching non-empty sql/<name>.sql
  and expected/<name>.out oracle. pg_regress needs a running PostgreSQL
  server. The vendored PG 18.3 is built fully (configure -> make -> make
  install) producing postgres/initdb/pg_ctl/createdb server binaries.

test_package_tests:
  - file: test_topn.c
    description: "Smoke test: verifies topn.so exists and is a valid ELF shared library"
    command: "test_topn"
    assertions: 2
    executed: true
    passed: true

assertion_count: 10
assertion_executed: 10
assertion_skipped: 0
