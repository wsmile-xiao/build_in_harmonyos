software: postgresql-topn
display: "PostgreSQL TopN Extension"
description: "PostgreSQL extension for fast top-N queries using approximate algorithm"
category: db
homepage: "https://github.com/citusdata/postgresql-topn"
license: PostgreSQL
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "使用 PGXS 构建系统，无需 configure 步骤"
    - "需要 pg_config 提供 PostgreSQL 安装路径"
    - "编译产物：topn.so（共享库）+ SQL 文件 + control 文件"
  common_dependencies:
    - postgresql

# 版本索引
versions:
  "2.7.0":
    status: built
    build_date: "2026-06-03"
    notes: "编译成功，预编译包已制作"