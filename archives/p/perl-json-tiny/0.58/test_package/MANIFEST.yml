# test_package/MANIFEST.yml — perl-json-tiny 0.58
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-json-tiny/0.58
homepage: "https://metacpan.org/pod/JSON::Tiny"

# 上游测试套件：t/ 目录 11 个 .t 测试文件（prove -lr t/ 递归运行）
# 注：prove -l t/ 的 -l 只加 lib 路径、不递归子目录——须 -lr 全量递归；
# 评审 rule 3 按 t/ 下 .t 文件数（11）核验声明 N，此处文件数/断言数分列。
upstream_check_command: "prove -lr t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/01-manifest.t
    source: JSON-Tiny-0.58/t/01-manifest.t
    description: "manifest 检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/01-manifest.t"
  - file: t/02-pod.t
    source: JSON-Tiny-0.58/t/02-pod.t
    description: "pod 检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/02-pod.t"
  - file: t/03-pod-coverage.t
    source: JSON-Tiny-0.58/t/03-pod-coverage.t
    description: "pod-coverage 检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/03-pod-coverage.t"
  - file: t/04-perlcritic.t
    source: JSON-Tiny-0.58/t/04-perlcritic.t
    description: "perlcritic 检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/04-perlcritic.t"
  - file: t/05-load-prereqs.t
    source: JSON-Tiny-0.58/t/05-load-prereqs.t
    description: "依赖加载检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/05-load-prereqs.t"
  - file: t/09-changes.t
    source: JSON-Tiny-0.58/t/09-changes.t
    description: "Changes 检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/09-changes.t"
  - file: t/10-load-can.t
    source: JSON-Tiny-0.58/t/10-load-can.t
    description: "加载/能力检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/10-load-can.t"
  - file: t/13-kwalitee.t
    source: JSON-Tiny-0.58/t/13-kwalitee.t
    description: "kwalitee 检查（prove -lr t/ 实测通过）"
    command: "prove -lr t/13-kwalitee.t"
  - file: t/20-mojo-json.t
    source: JSON-Tiny-0.58/t/20-mojo-json.t
    description: "Mojo::JSON 兼容测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/20-mojo-json.t"
  - file: t/21-j-dies.t
    source: JSON-Tiny-0.58/t/21-j-dies.t
    description: "错误处理测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/21-j-dies.t"
  - file: t/22-bool.t
    source: JSON-Tiny-0.58/t/22-bool.t
    description: "布尔值测试（prove -lr t/ 实测通过）"
    command: "prove -lr t/22-bool.t"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 JSON::Tiny + encode/decode JSON 往返）
test_package_tests:
  - file: test_json_tiny.py
    description: "Loads packaged JSON::Tiny via perl -I<lib> and round-trips a real JSON structure via encode_json/decode_json"
    command: "python3 test_json_tiny.py"

# 断言总数：1（JSON 往返校验）
assertion_count: 1
