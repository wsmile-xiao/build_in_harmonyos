# 软件级 manifest — pdf2svg
# 遵循 ARCHIVE-SPEC v3.0

software: pdf2svg
display: "pdf2svg"
description: "PDF 转 SVG 转换器，基于 Poppler 与 Cairo，支持单页与整本多页转换"
category: gfx
homepage: "https://github.com/dawbarton/pdf2svg"
license: "GPL-2.0-or-later"
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游 configure.ac 用 PKG_CHECK_MODULES 声明 cairo / poppler-glib；本配方不调用 pkg-config，走 AC_ARG_VAR 逃生口（CFLAGS/LIBS 非空即直接采用）"
    - "制品仓各依赖包自带的 .pc 记录了**构建机前缀**（cairo.pc prefix=/、poppler-glib.pc 指向另一台构建机的 .conan2 hash 目录、glib-2.0.pc prefix=/ 且 Libs 含 -lintl）——放进 PKG_CONFIG_PATH 会静默成功并给出错误路径，禁止使用"
    - "-I/-L 必须由 cpp_info.aggregated_components() 计算：glib 的 include/glib-2.0、lib/glib-2.0/include（glibconfig.h）、include/gio-unix-2.0 只存在于组件里，根 cpp_info 只有一层 include"
    - "不照抄 poppler 根级 cpp_info.libs（['poppler','poppler-glib','poppler-cpp'] 并集），按实际 include 只链 -lpoppler-glib"
    - "conan 的 Autotools.configure() 不会 chdir，配方必须显式 os.chdir(build_folder) 才是 out-of-source 构建"
    - "HMFS getcwd 不可达（E002/[shell_getcwd]）：生成的 configure 里 ac_pwd=`pwd` 需兜底为 `pwd` 2>/dev/null || $PWD，并预置 os.environ['PWD']"
    - "HMDFS 下 umask 077 建出的临时目录不可写/不可执行（E002/E114）：把 configure 里的 umask 077 就地改写为 022"
    - "OHOS /tmp 是 erofs 只读（E002）：test_package 的夹具写进 <build_folder> 的 scratch 目录，并设 TMPDIR/TMP/TEMP"
    - "OHOS loader 可能忽略 LD_LIBRARY_PATH（HMBS [stale_runtime_library]）：从 bin/pdf2svg 的 DT_NEEDED 出发 BFS，把闭包内 .so 的绝对路径经 LD_PRELOAD 注入"
    - "程序无 --version/-V 选项（且上游 tag v0.2.4 与 AC_INIT 0.2.1 不一致）：L2 的 --version 冒烟只给 non-blocking warn，被测行为由 test_package 的 6 项确定性断言承担"
    - "上游无测试套件（tarball 无 tests/，Makefile.am 无 TESTS/check_* 目标，无 meson.build）"
  common_dependencies:
    - poppler
    - cairo
    - glib
    - fontconfig

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.2.4":
    status: built
    build_date: "2026-09-20"
    conan_ref: "pdf2svg/0.2.4"
