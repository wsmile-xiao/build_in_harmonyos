# 版本级 manifest — pdf2svg 0.2.4
# 文件位置: archives/p/pdf2svg/0.2.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0（conanfile.py 为 CI 唯一输入，本文件为交叉校验元数据）

# ============================================================
# 必须字段
# ============================================================

version: "0.2.4"
software: "pdf2svg"
upstream_name: pdf2svg
upstream_version: "0.2.4"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-20"
compile_date: 2026-09-20

# 注意：tarball 的 git tag 是 v0.2.4，但上游 configure.ac 里
# `AC_INIT(pdf2svg, 0.2.1, ...)` 从未随发布递增（自带的 configure 更陈旧，
# 还在查 cairo >= 1.2.6，而 configure.ac 已改成 1.16）。Conan 包版本按
# **tag** 记为 0.2.4；程序自身不打印版本号（无 --version/-V 选项）。
build_system: autotools
target_platform: aarch64-unknown-linux-ohos
conan_ref: "pdf2svg/0.2.4"
source_pr: 11397

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/dawbarton/pdf2svg/archive/refs/tags/v0.2.4.tar.gz"
  sha256: "fd765256f18b5890639e93cabdf631b640966ed1ea9ebd561aede9d3be2155e4"
  tar_format: tar.gz
  version_mapping: >
    Conan pdf2svg/0.2.4 ↔ 上游 tag v0.2.4 一一对应；产物为 bin/pdf2svg
    （package_type = application，无可链接库、无可 include 头）。
    上游 configure.ac 的 AC_INIT 版本号（0.2.1）与 tag 不一致是上游历史遗留，
    R37 的首次适配版本以 tag 为准。

# ============================================================
# 构建配置
# ============================================================

build:
  system: autotools
  configure_options:
    - "--build=aarch64-linux --host=aarch64-linux（本包 configure.ac 没有 AC_CANONICAL_*，不跑 config.guess/config.sub；给本机三元组只是让 host_alias 有值、configure 走 non-cross 分支，同时挡住 profile 可能注入的 linux-ohos 三元组。不是把 OHOS 伪装成别的系统）"
    - "CAIRO_CFLAGS / CAIRO_LIBS / POPPLERGLIB_CFLAGS / POPPLERGLIB_LIBS —— PKG_CHECK_MODULES 的 AC_ARG_VAR 逃生口，四个变量非空即**完全不调用 pkg-config**，改由 cpp_info.aggregated_components() 直接算出 -I/-L/-l"
    - "不跑 autoreconf：tarball 自带 configure / Makefile.in / install-sh / depcomp / missing 配套齐全（AM_INIT_AUTOMAKE([foreign])）"
    - "build() 内 os.chdir(self.build_folder) —— conan 的 Autotools.configure() 不会自己 chdir，不显式切换就是 in-source 构建"
  environment:
    - "PWD 预置为 build_folder：HMFS 下 getcwd 不可达（E002 / HMBS [shell_getcwd]），configure 的 ac_pwd=`pwd` 需兜底（配方就地改写为 ac_pwd=`pwd` 2>/dev/null || ac_pwd=\"$PWD\"）"
    - "os.umask(0)：config.status 在 HMDFS 下用 umask 077 建临时目录会得到不可写/不可执行的目录（E002/E114），配方把 configure 里的 umask 077 就地改写为 umask 022"
    - "TMPDIR/TMP/TEMP（test_package 侧）指向 build_folder 下的 scratch 目录 —— OHOS /tmp 是 erofs 只读（E002）"
  dependencies:
    - "poppler/25.12.0.2（transitive_headers + transitive_libs：提供 poppler.h / poppler-document.h / poppler-page.h 与 poppler_* 符号）"
    - "cairo/1.18.4（transitive_headers + transitive_libs：提供 cairo.h / cairo-svg.h 与 cairo_show_page 等符号）"
    - "glib/2.84.0.1（transitive_headers：pdf2svg.c 直接 include <glib.h> 并调用 g_path_is_absolute / g_get_current_dir / g_build_filename / g_filename_to_uri / g_type_init / g_object_unref）"
    - "fontconfig/2.18.1.1（override=True：poppler 钉 2.18.1、cairo 钉 2.18.1.1，两精确钉在图里直接 version conflict；取较新者，minor_mode 下 poppler 的 package_id 不变，制品仓已发布二进制原样复用）"
    - "传递依赖（运行期闭包，共 15 个 host 包）：boost / expat / freetype / lcms2 / libjpeg-turbo / libpng / libtiff / libwebp / openjpeg / pixman / zstd 等；build 依赖：无"
  cc: clang
  cxx: ""

# ============================================================
# 补丁信息
# ============================================================

# 无 patches/ 目录：不改上游任何源码。对 configure 的两处就地改写
# （umask 077 → 022、ac_pwd 兜底）在 build() 的 _patch_configure() 里做，
# 不产生补丁文件，因此 conandata.yml 的 patches 为空。
patches_applied: []

# ============================================================
# 验证
# ============================================================

validation:
  local:
    - "Python AST 语法检查通过（conanfile.py / test_package/conanfile.py）"
    - "YAML 解析通过（conandata.yml / manifest.yaml / test_package/MANIFEST.yml）"
    - "JSON 解析通过（commands.json）"
    - "官方源 sha256 本地核验：pdf2svg v0.2.4 tarball = fd765256f18b5890639e93cabdf631b640966ed1ea9ebd561aede9d3be2155e4"
    - "conan list 'poppler/*' / 'cairo/*' / 'glib/*' / 'fontconfig/*' -r ohpcd → 四条 requires 全部命中（L0i）"
    - "conan list 'pdf2svg/*' -r ohpcd → Found 0（L0j：本版本尚未发布，无需 bump）"
    - "依赖图求解实测通过（15 个 host 包，fontconfig override 消解 version conflict）"
    - "cpp_info 实探（probe 配方）：poppler aggregated includedirs 含 include/poppler/glib；cairo 含 include/cairo；glib 含 include/glib-2.0 + lib/glib-2.0/include（glibconfig.h）+ include/gio-unix-2.0"
    - "头文件布局实查：glib.h 在 <glib>/include/glib-2.0/glib.h；glibconfig.h 在 <glib>/lib/glib-2.0/include/；poppler.h/poppler-page.h 在 <poppler>/include/poppler/glib/"
    - "依赖包自带 .pc 污染实测：cairo.pc → prefix=/（-I/include/cairo -L/lib）；poppler-glib.pc → prefix=/storage/Users/currentUser/.conan2/p/b/poppl74bba25eec764/p（构建机 hash 目录）；glib-2.0.pc → prefix=/ + Libs 含 -lintl —— 定案不把 <dep>/lib/pkgconfig 放进 PKG_CONFIG_PATH"
    - "configure 逃生口核对：CAIRO 在生成 configure 第 3674/3691 行、POPPLERGLIB 在 3766/3783 行，`if test -n \"$PREFIX_CFLAGS\"` 为真即直接采用"
    - "上游测试审计：tarball 无 tests/ 目录；Makefile.am 只有 bin_PROGRAMS = pdf2svg（无 TESTS/check_PROGRAMS/check-local）；无 meson.build / CMakeLists.txt → upstream_tests_exist: false"
  remote:
    - "待 CI 流水线实跑（见本 PR 的 CI-BOT 结论）"
  pending:
    - "PR validation / REL upload"

upstream_tests:
  exists: false
  framework: none
  command: ""
  run_in_build: false
  automake_tests: 0
  scenarios: 0
  result: "无上游测试套件（tarball 无 tests/，Makefile.am 无 check 目标，无 meson.build/CMakeLists.txt）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "制品仓里各依赖包**自带的 .pc 文件记录了构建机的前缀**（cairo.pc prefix=/ → -I/include/cairo -L/lib；poppler-glib.pc prefix=/storage/Users/currentUser/.conan2/p/b/poppl74bba25eec764/p；glib-2.0.pc prefix=/ 且 Libs 含 -lintl）。把它们放进 PKG_CONFIG_PATH 会让 pkg-config **静默成功**却给出错误路径，失败从 configure 后移到 compile/link，更难定位。对这类包应走 PKG_CHECK_MODULES 的 AC_ARG_VAR 逃生口（或 conan 生成的 .pc），不要用依赖包自带的 lib/pkgconfig。"
  - "AutotoolsToolchain 在 host profile == build profile（CI 是原生 OHOS 构建）时**不发出任何 --host/--build/--target**；显式追加本机三元组 aarch64-linux 的目的是挡住 profile 可能注入的 linux-ohos 三元组（本包自带的 config.sub 不认 ohos），同时保持 cross_compiling=no。"
  - "conan 的 Autotools.configure() 不会自己 chdir —— configure 在进程当前目录执行，配方必须显式 os.chdir(self.build_folder) 才是真正的 out-of-source 构建。"
  - "选逃生口时要按**具体依赖**而不是按上游的 pkg-config 模块名去算 -I：glib 的 include/glib-2.0、lib/glib-2.0/include（glibconfig.h）、include/gio-unix-2.0 只存在于 cpp_info **组件**里，根 cpp_info.includedirs 只有一层 include，用它拼 CFLAGS 会让 #include <glib.h> 失败，必须用 aggregated_components()。"
  - "poppler 的 cpp_info.libs 是 ['poppler','poppler-glib','poppler-cpp'] 的根级并集，直接抄会白白拖进 poppler-cpp；按消费者实际 include 的头文件（<poppler.h> → poppler-glib）只链 -lpoppler-glib 即可。"
  - "上游 tag 版本与 AC_INIT 版本号不一致（v0.2.4 vs 0.2.1）、且 tarball 自带的 configure 比 configure.ac 更陈旧（查 cairo >= 1.2.6 vs 1.16）时，包版本按 tag 记，且**不要 autoreconf** —— 重新生成会把『生成的 configure 与上游交付物一致』这一前提打破。"
  - "命令行工具无 --version 选项（pdf2svg 无 --version/-V）时，CI L2 的 --version/--help 冒烟探测只给 non-blocking warn；test_package 必须自带确定性功能断言（本项目：无参数用法输出/单页转换/all 多页/打不开/页标签不存在/两页产物不同 共 6 项）。"

references:
  - "https://github.com/dawbarton/pdf2svg"
  - "https://poppler.freedesktop.org/"
