# test_package/MANIFEST.yml
# 上游官方测试声明文件
# 详见: docs/TEST_QUALITY_SPEC.md

package: pdf2svg/0.2.4
homepage: "https://github.com/dawbarton/pdf2svg"

# 上游源码审计：pdf2svg 0.2.4 发布包**没有**任何自动化测试，故 build() 内无
# make check 可跑；被测行为全部由 test_package/test_pdf2svg.sh 对**已安装的**
# bin/pdf2svg 做端到端断言（R34：二进制即被测 API）。
upstream_tests_exist: false
upstream_test_audit:
  - source: "tar tzf pdf2svg-0.2.4.tar.gz（顶层文件清单）"
    reason: "解包后顶层只有 AUTHORS / COPYING / ChangeLog / INSTALL / LICENSE / Makefile.am / Makefile.in / NEWS / README / README.md / aclocal.m4 / compile / config.guess / config.h.in / config.sub / configure / configure.ac / depcomp / install-sh / missing / pdf2svg.c，**无 tests/ 目录、无 test/ 目录、无 check/ 目录**。"
  - source: "Makefile.am"
    reason: "全文只有 `bin_PROGRAMS = pdf2svg` 与 `pdf2svg_SOURCES = pdf2svg.c`、`pdf2svg_CFLAGS`、`pdf2svg_LDADD`，**没有 TESTS、check_PROGRAMS、check-local、TESTS_ENVIRONMENT 任何一项**；AM_INIT_AUTOMAKE([foreign]) 本身也不启用默认测试。"
  - source: "configure.ac"
    reason: "AC_INIT + AC_PROG_CC + AM_INIT_AUTOMAKE + AC_CONFIG_HEADERS + 两个 PKG_CHECK_MODULES(CAIRO / POPPLERGLIB) + AC_OUTPUT(Makefile)，无 AC_CONFIG_TESTDIR / AC_CONFIG_FILES(tests/Makefile)。"
  - source: "meson.build / CMakeLists.txt / Makefile（非 automake）"
    reason: "三者均不存在，不存在另一套构建系统携带测试的可能。"
  - conclusion: "上游无测试套件（判据：tarball 无 tests/ 目录 + Makefile.am 无 TESTS/check_* 目标 + 无 meson.build/CMakeLists.txt）。因此 build() 只做 configure + make，不调用 make check —— 调用会以 'No rule to make target check' 失败，而非「跳过测试」。被测行为改由 test_package 对已安装二进制断言覆盖。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游用例数：0（无测试套件）。与 conanfile.py 尾部输出的
# HMBS_UPSTREAM_TEST_RESULT {"status":"no_tests",...} 口径一致。
upstream_tests: []

test_package_tests:
  - file: "test_pdf2svg.sh"
    description: >
      真实执行**已安装的** bin/pdf2svg，对 6 项可观测行为做端到端断言：
      ① 无参数 → 用法输出到 stdout 且退出码 254（main() return -2）；
      ② 单页转换 `pdf2svg fixture.pdf out1.svg`（不给页号 → 默认第 1 页）exit 0
         且产物非空、含 `<svg`；
      ③ `all` 多页模式 → 输出参数按 printf 格式串展开，2 页 PDF 产出
         all-1.svg + all-2.svg 两份非空文件；
      ④ 输入文件不存在 → stderr 有 "Unable to open file" 且退出码 253（-3）；
      ⑤ 页标签不存在 → "Page does not exist" 且退出码 252（-4）；
      ⑥ 两页渲染结果必须不同（证明按页取页，而不是把第 1 页重复 N 次）。
      夹具是 conanfile 用纯 Python 写出的 2 页纯矢量 PDF（矩形/折线，无字体），
      xref 字节偏移现算，渲染路径不经过 fontconfig/freetype 字体匹配，CI worker
      上没有字体也不影响断言。scratch 目录由 conanfile 传入（OHOS /tmp 是
      erofs 只读，E002）；脚本用注入的 $SHELL 执行 POSIX sh，不硬编码
      /data/service/hnp/bin/bash（HMBS [shell_getcwd]）。
    command: "$SHELL test_pdf2svg.sh <package>/bin/pdf2svg <LD_PRELOAD_libs> <scratch_dir>"

assertion_count: 6
