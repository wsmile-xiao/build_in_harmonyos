software: pdf2svg
version: v0.2.4
category: graphics
status: built

build_system: makefile
compiler: clang
linker: GNU ld

dependencies:
  poppler: 25.11.0
  cairo: 1.18.4
  glib2: 2.84.0

configure_options:
  - "手动 Makefile 方式编译"
  - "CFLAGS 包含 poppler/cairo/glib 头文件路径"
  - "LDFLAGS 包含对应库路径"

build_notes:
  - pdf2svg 使用简单的 Makefile 构建系统，不支持 configure
  - 需要手动创建 config.h 和 Makefile 补丁（添加 OHOS 头文件路径和库路径）
  - config.guess/config.sub 补丁用于平台检测（E007）
  - 依赖 poppler-glib、cairo、glib2 等 GTK 系库

artifacts:
  - pdf2svg binary

source_url: https://github.com/dbar/pdf2svg/archive/refs/tags/v0.2.4.tar.gz