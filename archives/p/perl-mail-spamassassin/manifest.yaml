software: perl-mail-spamassassin
description: "SpamAssassin - 垃圾邮件过滤器，使用多种检测机制识别垃圾邮件"
homepage: https://spamassassin.apache.org/
repository: https://github.com/apache/spamassassin
license: Apache-2.0
category: mail
versions:
  - version: "4.0.2"
    status: built
    build_date: "2026-06-15"
runtime_dependencies:
  - perl (>= 5.42.0)
  - perl-mail-dkim
  - perl-mail-domainkeys
  - perl-net-dns
  - perl-http-date
  - perl-io-socket-ssl
  - perl-mailtools
  - perl-mime-base64
build_dependencies:
  - perl
  - perl-dbi (可选，用于 SQL 后端)
notes: |
  SpamAssassin 是 Apache 基金会的开源垃圾邮件过滤器，使用贝叶斯分类器、
  网络黑名单、DNS 查询等多种技术检测垃圾邮件。

  主要功能:
  - 邓普斯规则集 (默认规则)
  - 贝叶斯学习 (sa-learn)
  - 规则更新 (sa-update)
  - C 客户端 (spamc) 快速扫描
  - 守护进程 (spamd) 服务模式