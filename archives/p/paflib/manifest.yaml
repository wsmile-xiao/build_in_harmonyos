software: paflib
display: "PAFLib"
description: "IBM Power Architecture Facilities Library（DSCR / EBB / PPR / Time Base）"
category: library
homepage: "https://github.com/paflib/paflib"
license: MIT
build_system: makefile

ohos_adaptation:
  path: "C 【高难度挑战】"
  key_points:
    - "Power 专属库：DSCR/EBB/PPR/TB 全部为 PowerPC 硬件设施（mfspr/mtspr、or Rx,Rx,Rx、rfebb、23KB Power 汇编回调），上游只允许 PowerPC 主机"
    - "DSCR 做成线程局部软件寄存器模型（完整 ISA 2.07 掩码），set/get 状态机完全可用；TB 回退 CLOCK_MONOTONIC"
    - "EBB 因 OHOS 禁用 perf_event_open（EACCES）而采用可用替代事件源：setitimer/SIGALRM interval timer 驱动公开 API 注册的 handler，完整实现 register/enable/disable/reset/close"
    - "12/13 上游测试在 aarch64 真实执行并通过（10 个 EBB 测试实际触发回调），仅 save-area 脚本跳过（依赖 Power-only .interp 入口）"
    - "产物为静态库 libpaf-dsc.a / libpaf-ebb.a + 公开头 paf/{dsc,ebb,ppr,tb}.h"
  common_dependencies: []

versions:
  - version: "0.3.0"
    status: built
    build_date: "2026-10-03"
