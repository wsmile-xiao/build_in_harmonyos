sources:
  url: "https://github.com/paflib/paflib/archive/refs/tags/0.3.0.tar.gz"
  sha256: "5f846979f63e56f393280cb2a098a1c7aa61e4a5e03098291c5cf0ee83d7a6e4"
  filename: "paflib-0.3.0.tar.gz"

patches:
  - patch_file: "patches/0001-common-portable-spr-and-barrier.patch"
    patch_description: >-
      Guard the PowerPC mfspr/mtspr/sync primitives behind __powerpc__ and add
      portable fallbacks. Guard the auxv walk used for hardware capability
      detection; on aarch64 __paf_get_hwcap reports "no Power facilities".
    patch_type: "portability"
  - patch_file: "patches/0002-dsc-portable-software-model.patch"
    patch_description: >-
      On non-PowerPC there is no Data Stream Control Register. Skip the SIGILL
      probe (which pokes the POWER SPR and inspects the MCONTEXT PC) and provide
      a software DSCR model: a per-thread register image advertising the full
      ISA 2.07 feature mask, so the public set/get state machine (set/get
      round-trip and out-of-mask EINVAL validation) is fully functional.
    patch_type: "portability"
  - patch_file: "patches/0003-tb-portable-timebase.patch"
    patch_description: >-
      The Time Base Register (mfspr 268/269) does not exist on aarch64.
      paf_timing_now() falls back to clock_gettime(CLOCK_MONOTONIC) in
      nanoseconds, preserving the monotonic tick semantics of the API.
    patch_type: "portability"
  - patch_file: "patches/0004-ppr-portable-noop.patch"
    patch_description: >-
      The Program Priority Register and the shared-processor hints are spelled
      with 'or Rx,Rx,Rx' on Power and have no aarch64 equivalent. Make the
      inline helpers portable no-ops on non-PowerPC.
    patch_type: "portability"
  - patch_file: "patches/0005-ebb-emulated-event-source.patch"
    patch_description: >-
      Non-PowerPC has no Event-Based Branching facility and OHOS denies
      perf_event_open with EACCES for every event type, so no hardware PMU event
      can be attached. Guard the Power assembly TCB accessors, the MMCR0/PMC
      reset and the assembly hook callback behind __powerpc__, and provide a
      functional emulated event source: a process interval timer
      (setitimer/SIGALRM) whose period comes from the requested sample period,
      invoking the per-thread EBB handler registered through the public API with
      full register/enable/disable/reset/close semantics. Also avoid glibc-only
      headers (<gnu/libc-version.h>, <link.h>) on OHOS bionic.
    patch_type: "portability"
  - patch_file: "patches/0006-tests-port-emulated.patch"
    patch_description: >-
      Port the upstream EBB tests to run against the emulated event source:
      guard the Power-only register probes and the assembly register-clobber
      hooks and keep the original Power bodies verbatim. Only the save-area
      script (which drives the Power-only libpaf-ebb .interp entry point) is
      skipped, with an explicit reason.
    patch_type: "portability"
