version: "0.3.0"
software: paflib
status: built
build_date: "2026-10-03"
build_system: makefile-direct-clang

source:
  url: "https://codeload.github.com/paflib/paflib/tar.gz/refs/tags/0.3.0"
  sha256: "5f846979f63e56f393280cb2a098a1c7aa61e4a5e03098291c5cf0ee83d7a6e4"
  tar_format: tar.gz
  note: >-
    The GitHub tag tarball is byte-identical (same sha256) to the Debian
    orig tarball paflib_0.3.0.orig.tar.gz.

build:
  system: makefile
  configure_options: []
  dependencies: []
  cc: clang
  archive_tool: llvm-ar
  targets:
    - "libpaf-dsc.a"
    - "libpaf-ebb.a"
  artifacts:
    - "lib/libpaf-dsc.a"
    - "lib/libpaf-ebb.a"
    - "include/paf/{dsc,ebb,ppr,tb}.h"

patches_applied:
  - "0001-common-portable-spr-and-barrier.patch"
  - "0002-dsc-portable-software-model.patch"
  - "0003-tb-portable-timebase.patch"
  - "0004-ppr-portable-noop.patch"
  - "0005-ebb-emulated-event-source.patch"
  - "0006-tests-port-emulated.patch"

ohos_adaptation:
  path: "C 【高难度挑战】"
  key_points:
    - "paflib 是 IBM 的 Power 专属库：DSCR/EBB/PPR/TB 全部基于 mfspr/mtspr、or Rx,Rx,Rx、rfebb 及 23KB PowerPC 汇编回调；上游 configure.ac 对非 PowerPC 主机直接 AC_MSG_ERROR"
    - "DSCR：无寄存器 → 线程局部**软件 DSCR 模型**，暴露完整 ISA 2.07 掩码，paf_dsc_set/get 的状态机（往返 + 越界 EINVAL）完全可用；上游 test_dsc 全量跑通"
    - "PPR：无对应寄存器 → inline 帮助函数降级为无副作用 no-op"
    - "TB：无 Time Base 寄存器 → paf_timing_now() 回退 clock_gettime(CLOCK_MONOTONIC)（纳秒），保持单调 tick 语义"
    - "EBB：OHOS/aarch64 无 EBB 设施，且 perf_event_open 对所有事件类型返回 EACCES（seccomp）→ 提供**可用的仿真事件源**：进程级 interval timer（setitimer/SIGALRM），周期取自请求的 sample period，触发时调用公开 API 注册的每线程 EBB handler，完整实现 register/enable/disable/reset/close 语义"
    - "12/13 上游测试在 aarch64 真实执行并通过（含 10 个 EBB 测试实际触发回调）；仅 save-area 脚本因依赖 Power-only 的 libpaf-ebb .interp 入口而跳过（有明确技术原因）"

knowledge_gained:
  - "强绑定私有硬件的库移植到异构架构：能用软件状态机/替代事件源复现 API 语义的（DSCR 寄存器模型、EBB 事件源），应做实而不是一律返回 unsupported；只有确实无法复现的才降级"
  - "OHOS/aarch64 上 perf_event_open 对所有事件类型（HW/SW/RAW）返回 EACCES（即使 /proc/sys/kernel/perf_event_paranoid=-1），硬件 PMU 采样不可用；需要 PMU 的功能必须另找事件源"
  - "作为 EBB 的替代事件源，进程级 setitimer(ITIMER_REAL)+SIGALRM 在 OHOS 可用；而 POSIX timer_create(SIGEV_SIGNAL, SIGRTMIN) 实测会挂起，不可用"
  - "PowerPC 的 mfspr/mtspr/sync inline asm 必须用 __powerpc__/__powerpc64__ 守卫；非 Power 平台用 __sync_synchronize() 作为 mb() 移植"
  - "aarch64 无 Time Base Register；paf_timing_now() 用 clock_gettime(CLOCK_MONOTONIC) 提供等价的单调时间源"
  - "OHOS bionic 无 glibc 专有头 <gnu/libc-version.h>；使用 glibc TCB EBB 字段的探测需改为平台分支，回退到 TLS 保存区"
  - "上游测试直接内联 Power 汇编或依赖 Power 汇编 hook 时，需要逐文件做架构守卫/移植，才能让测试在目标架构真实运行"
