# test_package/MANIFEST.yml
# paflib 0.3.0 - upstream and consumer test declaration.

package: paflib/0.3.0
homepage: "https://github.com/paflib/paflib"

upstream_tests_exist: true
upstream_test_audit: >-
  Upstream `make check` registers 13 tests: dsc/tests/test_dsc, ten EBB tests
  (test_ebb, test_ebb_pmu, test_ebb_pmu_reset, test_ebb_backtrace,
  test_ebb_pmu_multi, test_ebb_pmu_clobber, test_ebb_child,
  test_ebb_clear_on_close, test_ebb_nohandler, test_ebb_cpu), the
  test_ebb_save_area_env.sh script, and tb/tests/test_tb.  On aarch64 the
  library provides a software DSCR model and an emulated EBB event source
  (interval timer), so 12 of the 13 tests execute and pass; only the save-area
  script is skipped.
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: >-
  build() compiles and runs test_dsc, test_tb and the ten EBB tests, then runs
  test_ebb_save_area_env.sh
upstream_tests_modified: true
upstream_tests_modified_reason: >-
  paflib is a Power-only library: the EBB tests read/write Power SPRs directly
  (mfspr/mtspr of BESCR/MMCR0/PMC1) and link the Power assembly callback /
  register-clobber hooks.  Patch 0005 adds an emulated event source and patch
  0006 guards the Power-only register probes and replaces the assembly clobber
  hooks with C equivalents so the tests execute against the emulation; the
  original Power bodies are kept verbatim behind #if defined(__powerpc__).

upstream_tests:
  - file: dsc/tests/test_dsc.c
    source: paflib-0.3.0/dsc/tests/test_dsc.c
    description: >-
      DSCR API: software DSCR model on aarch64; set/get round-trip and
      out-of-mask validation run end to end
    command: "./test_dsc"
  - file: tb/tests/test_tb.c
    source: paflib-0.3.0/tb/tests/test_tb.c
    description: "Time Base API: prints three tick deltas and the total"
    command: "./test_tb"
  - file: ebb/tests/test_ebb.c
    source: paflib-0.3.0/ebb/tests/test_ebb.c
    description: "EBB handler/enable/disable interface (emulated)"
    command: "./test_ebb"
  - file: ebb/tests/test_ebb_pmu.c
    source: paflib-0.3.0/ebb/tests/test_ebb_pmu.c
    description: "EBB callback across register save sets (emulated)"
    command: "./test_ebb_pmu"
  - file: ebb/tests/test_ebb_pmu_reset.c
    source: paflib-0.3.0/ebb/tests/test_ebb_pmu_reset.c
    description: "EBB periodic reset (emulated)"
    command: "./test_ebb_pmu_reset"
  - file: ebb/tests/test_ebb_backtrace.c
    source: paflib-0.3.0/ebb/tests/test_ebb_backtrace.c
    description: "EBB handler invocation (emulated; backtrace frame names are build-specific)"
    command: "./test_ebb_backtrace"
  - file: ebb/tests/test_ebb_pmu_multi.c
    source: paflib-0.3.0/ebb/tests/test_ebb_pmu_multi.c
    description: "EBB multi-counter group (emulated)"
    command: "./test_ebb_pmu_multi"
  - file: ebb/tests/test_ebb_pmu_clobber.c
    source: paflib-0.3.0/ebb/tests/test_ebb_pmu_clobber.c
    description: "EBB register clobbering (emulated; C hooks replace Power asm)"
    command: "./test_ebb_pmu_clobber"
  - file: ebb/tests/test_ebb_child.c
    source: paflib-0.3.0/ebb/tests/test_ebb_child.c
    description: "EBB inherited by a child process (emulated)"
    command: "./test_ebb_child"
  - file: ebb/tests/test_ebb_clear_on_close.c
    source: paflib-0.3.0/ebb/tests/test_ebb_clear_on_close.c
    description: "closing the EBB event stops delivery (emulated)"
    command: "./test_ebb_clear_on_close"
  - file: ebb/tests/test_ebb_nohandler.c
    source: paflib-0.3.0/ebb/tests/test_ebb_nohandler.c
    description: "enable/disable without a handler is safe (emulated)"
    command: "./test_ebb_nohandler"
  - file: ebb/tests/test_ebb_cpu.c
    source: paflib-0.3.0/ebb/tests/test_ebb_cpu.c
    description: "EBB per-CPU event (emulated)"
    command: "./test_ebb_cpu"
  - file: ebb/tests/test_ebb_save_area_env.sh
    source: paflib-0.3.0/ebb/tests/test_ebb_save_area_env.sh
    description: >-
      save-area env var test driving the libpaf-ebb version entry point - SKIP
    command: "sh test_ebb_save_area_env.sh"

upstream_registered_tests: 13
upstream_executed_native: 12
upstream_platform_skipped: 1
upstream_skip_reason: >-
  test_ebb_save_area_env.sh executes the libpaf-ebb shared object directly and
  relies on the Power-only .interp version entry point (paf-interp.c).  The
  aarch64 port builds static libraries and does not create that entry, so the
  script is skipped with an explicit notice.
upstream_failed: 0

test_package_tests:
  - file: test_paflib.c
    description: >-
      installed paflib consumer: software DSCR model (mask/round-trip/EINVAL),
      portable Time Base, and the emulated EBB event source actually firing the
      registered callback (register/enable/fire/disable/close)
    command: "test_paflib"

test_files:
  - path: "test_package/test_paflib.c"
    test_type: "R34"
    assertion_count: 19

test_package_test_count: 1
consumer_assertion_count: 19
upstream_test_cases: 13
assertion_count: 32
