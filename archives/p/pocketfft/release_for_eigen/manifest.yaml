# 版本级 manifest — pocketfft release_for_eigen
# 遵循 ARCHIVE-SPEC v2.0

version: "release_for_eigen"
software: "pocketfft"

# 编译状态: published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-16"
build_system: "headeronly"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方 GitHub tag 归档）
  url: "https://github.com/mreineck/pocketfft/archive/refs/tags/release_for_eigen.tar.gz"

  # 源码校验和
  sha256: "e8e495811077109198b2653f0c85fd34defa5b6a21551a538465445118bb7f7b"

  # 压缩格式
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型: cmake | autotools | makefile | meson | custom | headeronly
  system: headeronly

  # 配置选项列表
  configure_options: []
  # 编译依赖列表（header-only 零依赖）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（无）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only 库无构建系统，conanfile 采用 headeronly 模板（v12.21）：package() 复制头文件到 include/，无 build() 编译阶段；G1 门禁要求 build()/export_sources()/apply_conandata_patches 声明存在，header-only 配方需显式声明空 build() 并调用 apply_conandata_patches 以通过 G1"
  - "conanfile package_type=library 时 Conan 2 强制要求 shared option 声明，否则 conan create 报 'Package type is library, but no shared option declared'"
  - "header-only 配方 package() 中 copy() 的 dst 必须用 os.path.join(self.package_folder, 'include') 绝对路径，相对路径 'include' 在 Conan 2.29 下不生效导致 'No files in this package!'"
