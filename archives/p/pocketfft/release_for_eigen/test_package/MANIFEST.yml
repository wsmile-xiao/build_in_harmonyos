# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pocketfft/release_for_eigen
homepage: "https://github.com/mreineck/pocketfft"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
# 官方 tag release_for_eigen 仅含 README/LICENSE/pocketfft_demo.cc/pocketfft_hdronly.h，
# 无构建系统、无 ctest/make check 入口；唯一可独立编译的测试源为 pocketfft_demo.cc（自测 demo）。
upstream_check_command: "none (header-only, no build system)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: pocketfft_demo.cc
    source: pocketfft-release_for_eigen/pocketfft_demo.cc
    description: "上游自测 demo：对 len=1..8191 全长度做 float/double/long double 正反变换并比对误差"
    command: "clang++ -std=c++11 -O2 pocketfft_demo.cc -o pocketfft_demo && ./pocketfft_demo"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pocketfft.cc
    description: "消费者测试：include pocketfft_hdronly.h，调用 c2c 做 16 点 FFT 正反变换，校验往返误差 < 1e-10"
    command: "./test_pocketfft"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 1
