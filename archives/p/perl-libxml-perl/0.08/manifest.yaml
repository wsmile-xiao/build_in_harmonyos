software: perl-libxml-perl
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.08/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.08"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://mirrors.tuna.tsinghua.edu.cn/CPAN/modules/by-module/XML/KMACLEOD/libxml-perl-0.08.tar.gz"

  # 源码校验和
  sha256: "4571059b7b5d48b7ce52b01389e95d798bf5cf2020523c153ff27b498153c9cb"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | perl | custom
  system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "xml-parser/2.19"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []  # 无补丁：纯 Perl 模块，Makefile 由 Makefile.PL 动态生成

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块无需 C 编译器，直接使用 perl Makefile.PL 配置"
  - "预编译包只包含 .pm 文件，无二进制产物"
  - "建议安装 XML::Parser 依赖以获得完整功能"
