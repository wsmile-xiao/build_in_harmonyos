software: pspg
display: "pspg"
description: "面向表格数据的 Unix pager（psql/CSV/TSV 表格浏览器）"
category: tool
homepage: "https://github.com/okbob/pspg"
license: BSD-2-Clause
build_system: autotools

ohos_adaptation:
  key_points:
    - "tag tarball 自带预生成 configure（autoconf 2.72），无 AC_CANONICAL → 无需 bootstrap/config.guess/--build"
    - "手写根 Makefile + config.make → in-source 构建；make install 经 tools/install.sh"
    - "ncurses/6.6 平铺头 vs HAVE_NCURSESW_CURSES_H → compat-include/ncursesw/ 镜像层 + 前置 -I（gtypist 先例）"
    - "readline/8.3 可选依赖显式 require；PostgreSQL 可选未命中仅 NOTICE，不需要 libpq"
    - "消费者测试走 pspg 非 tty 非交互渲染路径（--csv/--tsv 打印后退出），离线确定性验证真实数据管线"
    - "CONFIG_SHELL 缺陷 env -u 处理 + E114 umask 替换 + E074 make -j1；CLI 门禁 commands.json（R38）"

versions:
  "5.8.16":
    status: prepared
    conan_ref: "pspg/5.8.16"
