# 版本级 manifest — pspg 5.8.16
# 遵循 ARCHIVE-SPEC v2.0

version: "5.8.16"
software: "pspg"
status: built
build_date: ''
build_system: autotools

source:
  url: "https://codeload.github.com/okbob/pspg/tar.gz/refs/tags/5.8.16"
  sha256: "3dcfb810cc6675cac6e3ea53775a6f819e0e12e0d2bde8122e3136b740f38ae5"
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=<package_folder>"
    - "（无 AC_CANONICAL，不需要 config.guess/--build；configure 由上游 autoconf 2.72 预生成）"
    - "CPPFLAGS 注入 compat-include/ncursesw 镜像层 + readline 头路径"
  dependencies:
    - ncurses/6.6
    - readline/8.3
  cc: clang
  upstream_test_command: "（上游无自动化测试：Makefile 无 test 目标，tests/test.sh 为交互式观察工具；由 test_package 消费者测试补足）"

patches_applied: []  # 无补丁文件；平台适配（umask/CONFIG_SHELL/compat-include）在配方内完成

knowledge_gained:
  - "手写根 Makefile（非 automake）不把命令行 CPPFLAGS 落盘进 config.make：configure 阶段传的 CPPFLAGS 到 make 阶段即丢失（非 automake 项目无 AC_SUBST 变量落盘），make/make install 命令行必须显式重传 —— 首错表现为编译期找不到注入路径的头文件（真机首验实测）"
  - "pspg 构建体系是手写根 Makefile + configure 生成 config.make（非 automake），必须 in-source 构建；make install 经 tools/install.sh 装 bin/pspg"
  - "ax_with_curses 在 pkg-config 命中 ncursesw 后直接 AC_DEFINE HAVE_NCURSESW_CURSES_H，而 ncurses/6.6 包头文件平铺 → compat-include/ncursesw/ 镜像层 + 前置 -I（gtypist/2.10.1 已验证方案）；平铺镜像同时兜底 pkg-config 缺失分支"
  - "AX_LIB_READLINE 仅 -lreadline 链接探测（还尝试 edit/editline），LDFLAGS 注入即命中；readline/8.3 为可选依赖，require 保留完整功能"
  - "pspg 非 tty stdout + --csv/--tsv 走非交互渲染路径（pspg.c:2997）直接打印并退出 → 消费者测试可离线确定性验证真实数据管线，无需 TERM/terminfo"
  - "CONFIG_SHELL 缺陷（§12.38①）→ env -u CONFIG_SHELL SHELL=/bin/sh + 绝对路径（gtypist 同款）；E114 umask 077→022 替换；E074 make -j1"
