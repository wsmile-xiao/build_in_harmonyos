# test_package/MANIFEST.yml
# pspg 5.8.16
# 上游没有可自动化运行的测试套件：根 Makefile 为手写 makefile（非
# automake），只有 all/clean/distclean/install/man/strip-install 目标，
# 无 test/check 目标；tests/ 目录内容是交互式会话的数据流生成器与
# 手工观察用的表格文本样例（test.sh 为 100 轮循环的 psql 输出模拟器，
# 设计为人工管道观察，不可离线断言）。按赛事规则说明原因并自补
# 消费者测试。

package: pspg/5.8.16
homepage: "https://github.com/okbob/pspg"

upstream_tests_exist: false
upstream_test_audit: >
  pspg 5.8.16 tag tarball 的构建体系为手写根 Makefile + configure 生成
  config.make，Makefile 无 test/check 目标；tests/ 下的 test.sh 是
  100 轮循环的 psql 输出流生成器（供人工 | pspg 观察交互行为），其余
  为观察用表格文本样例，均非可离线自动断言的测试套件。上游测试计数
  为 0 属"上游不存在"，非"未运行"。自补消费者测试走 pspg 的非交互
  渲染路径（pspg.c:2997：stdout 非 tty 且 --csv/--tsv 时打印全部
  数据并退出，不初始化 ncurses），真实执行数据管线。
upstream_test_count: 0
upstream_check_command: "（上游无自动化测试；tests/test.sh 为交互式观察工具）"
upstream_test_in_build: false

# test_package 中自带的测试（消费者视角, R34: 真实执行被适配工具）
test_package_tests:
  - file: test_pspg.sh
    description: >
      消费者视角: 真实执行包内 pspg，6 项断言（-V 版本 / --about /
      --help / 未知选项报错 / --csv 非 tty 渲染 fixtures/sample.csv /
      --tsv 渲染 fixtures/sample.tsv），全部离线
    command: "bash test_pspg.sh <package>/bin/pspg"

test_fixtures:
  - file: fixtures/sample.csv
    description: 3 行 CSV（name,city / alice,prague / bob,brno）
  - file: fixtures/sample.tsv
    description: 3 行 TSV（同名数据），验证 --tsv 解析路径

# 断言总数（消费者 6 项）
assertion_count: 6
