software: perl-regexp-common
version: "2024080801"
status: published
build_date: "2026-06-26"

source:
  url: "https://cpan.metacpan.org/authors/id/A/AB/ABIGAIL/Regexp-Common-2024080801.tar.gz"
  sha256: "0677afaec8e1300cefe246b4d809e75cdf55e2cc0f77c486d13073b69ab4fbdd"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "Pure Perl module using ExtUtils::MakeMaker, no XS/C code"
  - "make check target not available, use make test instead"
  - "Test::Regexp is optional test dependency, tests skipped when not installed"
  - "conanfile.py generate() should not use AutotoolsToolchain for pure Perl modules"
  - "package_info() should use glob to dynamically discover Perl version path, not hardcode"
  - "test_package should not hardcode local paths, use dynamic detection"
  - "Conan test environment may cause URI submodule registration conflict with multiple PERL5LIB paths"
  - "use Regexp::Common; (no import list) loads all standard submodules; use Regexp::Common qw/URI/; for URI submodule"
