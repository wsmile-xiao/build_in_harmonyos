package: parson/1.5.3
homepage: "https://github.com/kgabis/parson"

upstream_check_command: "make all"
upstream_test_in_build: true
upstream_test_command: "test, testcpp, test_hash_collisions"

upstream_tests:
  - file: tests.c
    source: parson-1.5.3/tests.c
    description: "Strict C89 parsing, serialization, schema, allocation and API test suite"
    command: "./test tests"
    assertions: 349
  - file: tests.c
    source: parson-1.5.3/tests.c
    description: "C++ compatibility run of the complete upstream suite"
    command: "./testcpp tests"
    assertions: 349
  - file: tests.c
    source: parson-1.5.3/tests.c
    description: "Complete upstream suite with forced object hash collisions"
    command: "./test_hash_collisions tests"
    assertions: 349

test_package_tests:
  - file: test_parson.c
    description: "One consumer boundary covering parse, typed access, mutation, serialization, schema validation, deep copy and malformed input"
    command: "./test_parson"
    assertions: 11

upstream_target_count: 3
upstream_assertion_count: 1047
consumer_test_count: 1
consumer_assertion_count: 11
assertion_count: 1058
