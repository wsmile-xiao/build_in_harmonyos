software: pix
display: "Pix"
description: "Image viewer and organizer from Linux Mint, based on gthumb"
category: gfx
homepage: "https://github.com/linuxmint/pix"
license: GPL-2.0
build_system: meson

ohos_adaptation:
  key_points:
    - "x11, xapp, gsettings-desktop-schemas are not available on OHOS - made optional via meson options"
