# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-xml-sax-base/1.09
homepage: "https://metacpan.org/pod/XML::SAX::Base"

# 上游测试命令 — XML::SAX::Base 上游 t/ 测试套件（make test）
upstream_check_command: "perl Makefile.PL && make && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-18 实测记录）：
# - t/ 目录：19 个 .t 测试文件（00basic/01exception/02simplefilter/…）
# - 实测结果：**Files=19, Tests=137, All tests successful（100%）**——
#   全部测试真实运行通过（release-pod-syntax.t 为上游默认 skip：
#   release candidate testing——安装时不需要，非受阻，如实记录）
upstream_tests:
  - file: t/
    source: XML-SAX-Base-1.09/t/
    description: "上游 perl 测试套件（19 文件 137 用例；实测 137/137 100% 通过 + release-pod-syntax 上游默认 skip）"
    command: "perl Makefile.PL && make && make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_saxbase.py
    description: "消费者测试（L0c 识别）：Python 驱动 test_saxbase.pl——XML::SAX::Base 子类 + SAX 事件方法（start_element/characters/end_element）"
    command: "python3 test_saxbase.py <site-perl-dir>"
  - file: test_saxbase.pl
    description: "真实 API（R34）：XML::SAX::Base 子类 + 事件方法（上游 t/00basic.t 用法）"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
