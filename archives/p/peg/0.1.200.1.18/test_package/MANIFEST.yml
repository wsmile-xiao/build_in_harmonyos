package: peg/0.1.200.1.18
homepage: "https://www.piumarta.com/software/peg/"
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make test"
upstream_tests:
  - name: "examples"
    source: "peg-0.1.18/examples/Makefile"
    description: "Builds PEG and LEG examples and compares output with reference files"
    command: "make test"
  - name: "bootstrap"
    source: "peg-0.1.18/Makefile"
    description: "Self-bootstrap consistency (check-peg/check-leg diff)"
    command: "make check"
test_package_tests:
  - file: test.sh
    description: "Checks peg and leg versions and generates C from a PEG grammar"
    command: "bash test.sh"
assertion_count: 5
