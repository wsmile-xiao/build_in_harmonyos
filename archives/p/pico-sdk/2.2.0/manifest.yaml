software: pico-sdk
version: "2.2.0"
status: built
build_system: cmake
build_date: "2026-08-25"

source:
  url: "https://deb.debian.org/debian/pool/main/p/pico-sdk/pico-sdk_2.2.0.orig.tar.gz"
  sha256: "dbd8db79015aced4ef35cbaa88051b0d451775010d20202e1c7d2bee69c25b35"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DPIOASM_VERSION_STRING=2.2.0"
    - "-DPIOASM_GENERATE_PARSER=OFF"
    - "build_script_folder=tools/pioasm"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "pico-sdk is an RP-series microcontroller SDK; the OHOS-native package builds only the host-side pioasm tool and packages the SDK source tree under share/pico-sdk."
  - "The Debian 2.2.0 orig tarball preserves upstream submodule directories as empty placeholders, so TinyUSB/CYW43/LwIP/MbedTLS/BTstack are not bundled into this adaptation."
  - "Full SDK target builds require a bare-metal RP2040/RP2350 toolchain and are not part of the OHOS-native L1 smoke."
