# test_package/MANIFEST.yml
package: pico-sdk/2.2.0
homepage: "https://github.com/raspberrypi/pico-sdk"

upstream_check_command: "cmake --build <build-dir> --target test"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: test/CMakeLists.txt
    source: pico-sdk-2.2.0/test/CMakeLists.txt
    description: "Top-level RP-series firmware test collection; not executed in OHOS-native packaging because it requires a bare-metal RP2040/RP2350 toolchain."
    command: "not run"
  - file: tools/pioasm/CMakeLists.txt
    source: pico-sdk-2.2.0/tools/pioasm/CMakeLists.txt
    description: "Standalone pioasm host-tool build; recipe runs pioasm --version and assembles a smoke .pio file after build."
    command: "pioasm --version && pioasm -o c-sdk -v 0 conan_smoke.pio conan_smoke.pio.h"

test_package_tests:
  - file: test_package/conandata_smoke.pio
    description: "Consumer-side pioasm smoke input assembled to a C SDK header."
    command: "pioasm -o c-sdk -v 0 conandata_smoke.pio conandata_smoke.pio.h"
  - file: test_package/conanfile.py
    description: "Verifies packaged SDK metadata, then invokes smoke.py under the Conan run environment."
    command: "conan test test_package"
  - file: test_package/smoke.py
    description: "Runs pioasm --version and assembles conandata_smoke.pio into a C SDK header."
    command: "python3 smoke.py <package>/bin/pioasm conandata_smoke.pio conandata_smoke.pio.h"

assertion_count: 6
