software: php83-pecl-memcache
display: "PHP 8.3 PECL Memcache"
description: "PHP memcache extension for PHP 8.3 caching via memcached servers"
category: db
homepage: "https://pecl.php.net/package/memcache"
license: PHP-3.01

build_system: autotools

ohos_adaptation:
  key_points:
    - "config.h.in 和 configure.ac 需添加 __OHOS__ 条件宏"
    - "memcache 源码需要 zend_string 适配"
    - "Makefile.objects 需添加 .dep 依赖文件列表"
    - "memcache_pool.h 需要 reallocarray extern 声明"
  common_dependencies:
    - php83

versions:
  "2.3.3":
    status: published
    build_date: "2026-06-10"
