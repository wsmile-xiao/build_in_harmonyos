package: proda/1.0
homepage: "http://proda.stanford.edu/"

# ─────────────────────────────────────────────────────────────
# 上游测试清点（R51 三步法之第一步：静态清点，给证据不给结论）
# ─────────────────────────────────────────────────────────────
upstream_tests_exist: false
upstream_test_audit:
  - source: "proda_1.0.orig.tar.gz 全量文件清单（36 个文件）"
    reason: "tarball 解包后只有 17 个 .cc + 18 个 .h + 1 个 Makefile。按名字筛 test/check/spec 的命中数为 0 —— 没有任何测试代码、没有 tests/ 目录、没有测试数据文件。"
  - source: "Makefile 的目标清单"
    reason: "整份 Makefile 共 61 行，可执行目标只有 all、proda、clean 三个（.PHONY 只声明了 all 和 clean）。既没有 check / test 目标，也没有 TESTS / check_PROGRAMS 之类的注册，因此不存在'可执行但没跑'的上游用例。"
  - source: "链接行"
    reason: "唯一的链接命令是 `$(CXX) $(CXXFLAGS) -lm $(OBJECTS) -o proda`，产出单个可执行文件 proda，不产出任何测试程序或库。"
  - conclusion: "上游 1.0 提供 0 个自动化测试，且不存在可迁移的测试入口。本次适配不假装覆盖上游测试，改为补 14 个场景 / 31 条消费者断言（见下方 test_package_tests），并把 5 维账本如实写成 0/0/0/0/0。"

upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""
upstream_tests: []

# ─────────────────────────────────────────────────────────────
# test_package 消费者测试（以使用者身份真实调用包内 proda）
# ─────────────────────────────────────────────────────────────
test_package_tests:
  - file: run_tests.sh
    description: "S1-S3 版本横幅/用法行、默认参数下的真实概率多序列比对（比对块报告 alpha(1-105) gamma(1-105) + 保守性标注行 >=60 个 '*'）、-L 选项确实改写生效阈值。"
    command: 'proda pair.fa ; proda -L 20 all3.fa'
  - file: run_tests.sh
    description: "S4-S5 两组负向对照：-L 999 阈值超过序列长度、以及 alpha/beta 两条互不相关的序列，两种情况下 proda 都**不得**产出比对块 —— 只有 HMM 概率判定真的在 aarch64 上执行才成立，固定字符串匹配骗不过去。"
    command: 'proda -L 999 all3.fa ; proda unrelated.fa'
  - file: run_tests.sh
    description: "S6-S10 filename(s) 多文件输入语义、-silent / -posterior / -tran / -fasta 四个选项。其中 -posterior 断言的是**更宽的块边界 alpha(1-106) gamma(1-106)**（后验模式把末端不一致残基按概率纳入，保守性行尾由 '*' 变 ':'），以此证明开关不是解析后空转。"
    command: 'proda alpha.fa gamma.fa ; proda -posterior all3.fa'
  - file: run_tests.sh
    description: "S11-S14 错误路径与确定性：未知选项按上游语义'忽略并继续'且点名报告、-L abc 以退出码 1 终止并给诊断、输入文件缺失以非 0 退出（实测 134，上游 ASSERT 主动 abort）、同一输入两次运行逐字节一致。"
    command: 'proda -zzz pair.fa ; proda -L abc pair.fa ; proda no-such-file.fa'

test_scenario_count: 14
assertion_count: 31
assertion_count_basis:
  version_usage_and_default_alignment: 7
  block_length_option_and_negative_controls: 7
  input_forms_and_mode_switches: 10
  error_paths_and_determinism: 7
# 账面自检：run_tests.sh 结尾自己打印
#   SCENARIOS=14 ASSERTIONS=31 PASS=.. FAIL=.. MIN_PASS=31
# 并在 SCENARIOS!=14 或 ASSERTIONS!=31 时自行判失败；
# 通过下限 MIN_PASS=31 由 test_package/conanfile.py 注入。
# 这四个数与 notes.md 的五维账本必须逐字相同。
hardware_playback_required: false
