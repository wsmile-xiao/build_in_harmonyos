# conandata.yml — proda 1.0
#
# 官方上游：http://proda.stanford.edu/proda_1_0.tar.gz （**只有 http，无 https**）
# 本配方取 Debian 官方池里的 **pristine orig** 作为 https 载体：
#   https://deb.debian.org/debian/pool/main/p/proda/proda_1.0.orig.tar.gz
# Debian 的 `.orig.tar.gz`（非 +dfsg、非 repack）按定义就是上游原始包，
# 实测两端 sha256 逐字相同：
#   439a93bf35e1a29ac1d5dde51e61f2cb174618596afaaaaa27d33a8ea1868a08
# 该哈希同时命中 deb.debian.org 的 `proda_1.0-13.dsc` 里的 Checksums-Sha256，
# 因此本 URL 与官方上游是**同一份字节**，只是换了 https 通道。
# ⇒ 见 notes.md『R39/PF7 源 URL 张力』一节（需 PR 说明 + --no-preflight）。
sources:
  url: "https://deb.debian.org/debian/pool/main/p/proda/proda_1.0.orig.tar.gz"
  sha256: "439a93bf35e1a29ac1d5dde51e61f2cb174618596afaaaaa27d33a8ea1868a08"

patches:
  - patch_file: "patches/0001-Main.cc-name-shadowed-libc-errno.patch"
    patch_description: "Main.cc 的 GetInteger() 里 `int errno = 0;` 声明了一个与 libc errno 同名的局部变量；musl/OHOS 上 errno 是宏，展开成 `int (*__errno_location()) = 0;` 直接编译失败。显式 #include <errno.h> 并改成对真 errno 赋值。"
    patch_type: "portability"
  - patch_file: "patches/0002-Sequence.cc-missing-stdio-h-include.patch"
    patch_description: "Sequence.cc 用了 fprintf/FILE 却没有直接 #include <stdio.h>，靠 glibc 头文件的传递包含侥幸通过；musl 的传递包含面更窄，报 use of undeclared identifier 'fprintf'。补直接包含（IWYU）。"
    patch_type: "portability"
  - patch_file: "patches/0003-Utilities.cc-fgetc-EOF-into-unsigned-char.patch"
    patch_description: "GetData() 用 `char ch;` 接 fgetc() 再和 EOF 比较。aarch64/clang 上 char 默认 unsigned，EOF(-1) 折成 255 永远不相等 → 读文件死循环、缓冲区倍增到抛 std::bad_alloc（x86-64 上 char 默认 signed，故上游无此症状）。改 int ch。"
    patch_type: "portability"
