# test_package/MANIFEST.yml
# 上游官方测试声明（CI build_and_test.sh L0e 要求）
# 全部数字来自本机 make check 实测，日志见 notes.md「验证结果」节。

package: pianod/420
homepage: "https://deviousfish.com/pianod"

# 上游测试命令：automake 递归 check（顶层 + 4 个子目录）
upstream_check_command: "make check"

# conanfile.py build() 已集成上游测试：autotools make check（make 之后执行）
upstream_test_in_build: true
upstream_test_command: "make check"

# ---- 上游实际运行的测试程序（automake 注册的 7 个 TESTS）----
upstream_tests:
  - file: src/common/callback_test.cpp
    source: pianod2-420/src/common/callback_test.cpp
    description: "回调注册/派发与优先级顺序（PASS，exit status 0）"
    command: "./src/common/callback_test"

  - file: src/common/utility.cpp
    source: pianod2-420/src/common/utility.cpp
    description: "通用工具函数：utility.cpp 以 -DUNIT_TEST 编译出内置 main 的用例，配合 failurecounter.h 计数（PASS，43 tests run: 43 passed）"
    command: "./src/common/utility_test"

  - file: src/parsnip/parsnip_test.cpp
    source: pianod2-420/src/parsnip/parsnip_test.cpp
    description: "自带 JSON/XML 解析器 parsnip（精简版 libparsnip.a，PASS，conan create 实测 Tests performed: 415 / passed 414 / skipped 1）"
    command: "./src/parsnip/parsnip_test"

  - file: src/parsnip/parsnip_test.cpp
    source: pianod2-420/src/parsnip/parsnip_test.cpp
    description: "同一测试源改链富化变体 libparrich.a（保留 JSON 注释与位置跟踪，parsnip_test_2_SOURCES = $(parsnip_test_SOURCES)，PASS，conan create 实测 Tests performed: 442 / passed 441 / skipped 1）"
    command: "./src/parsnip/parsnip_test_2"

  - file: src/mediaunits/metadata/tagreader.cpp
    source: pianod2-420/src/mediaunits/metadata/tagreader.cpp
    description: "taglib 元数据读取器，以测试音频 cookies.mp3 走 taglib 读取路径，进程级 PASS（automake 日志正文仅含文件名，无内建计数器）"
    command: "./src/mediaunits/metadata/tagreader"

  - file: src/mediaunits/pandora/blowfish_test.cpp
    source: pianod2-420/src/mediaunits/pandora/blowfish_test.cpp
    description: "Pandora 协议 Blowfish 加密向量（PASS，34 组向量全部 Passed）"
    command: "./src/mediaunits/pandora/blowfish_test"

  - file: pianod_unittest
    source: pianod2-420/pianod_unittest
    description: "端到端集成测试（AT&T ksh93 脚本，需 /bin/ksh + 真实 Pandora 账号 + 预置播放列表）；OHOS 生态无 ksh93（cmd-pkgs 仅 dash/zsh），脚本自身守卫以 exit 77 上报 SKIP"
    command: "./pianod_unittest"

# ---- test_package 的消费者视角测试 ----
test_package_tests:
  - file: test_pianod.cpp
    description: >-
      驱动打包后的 pianod：(a) 10 项依赖链接/自省断言（版本 banner、OpenSSL 后端、
      curl 编译期与运行期、gstreamer、taglib、三源、TLS 监听选项）；
      (b) 5 项 R40 运行时服务断言（启动守护进程 → TCP 连接 → 行协议 200 Success →
      pianod2 420 会话 banner → Privileges/SelectedSource 状态）
    command: "./test_pianod"

# ---- 上游断言计数（逐项给出，每项都可在构建日志里 grep 到原文）----
# 配方 build() 的 _report_upstream_assertions() 把 automake 的 <test>.log 断言行
# 以 "[upstream-test]" 前缀提升到 conan 构建日志，故下表数字均有原始行支撑。
# 注意：数字取自 conan create（与 CI 同源）环境；早前手工探索构建得到的
# 573/600 与此处 415/442 不同——parsnip 的用例集随编译宏（rich_flags / schema
# 测试是否可用）而增减，交付一律以 conan create 实测为准。
assertion_breakdown:
  utility_test: 43         # "43 tests run: 43 passed"
  parsnip_test: 415        # "Tests performed:         415"（passed 414 / skipped 1）
  parsnip_test_2: 442      # "Tests performed:         442"（passed 441 / skipped 1）
  blowfish_test: 34        # 34 行 "Passed: <vector>" + "All tests passed."
  callback_test: 0         # 仅进程级 PASS，上游无内建计数器
  tagreader: 0             # 仅进程级 PASS（automake 日志正文只有被测文件名）
  pianod_unittest: 0       # SKIP（退出码 77）
# = 43 + 415 + 442 + 34 + 0 + 0 + 0
assertion_count: 934
