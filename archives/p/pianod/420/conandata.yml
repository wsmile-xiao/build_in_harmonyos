# conandata.yml — pianod2 420
# 官方发布源（R39）：deviousfish.com 为 pianod2 项目唯一官方 tarball 发布点（SVN 项目，无 GitHub/GitLab 镜像）。
# 校验和来自本地下载实测：sha256sum pianod2-420.tar.gz

sources:
  url: "https://deviousfish.com/Downloads/pianod2/pianod2-420.tar.gz"
  sha256: "9fa739cf28d5f554d982acecb94857b9fe0d0fd839d238dfca90f143c9fab216"

patches:
  "420":
    - patch_file: "patches/0001-config.guess.patch"
      patch_description: "config.guess: 增加 *:HarmonyOS:*:* 分支，产出 aarch64-unknown-linux-ohos（uname -s=HarmonyOS 不被 GNU config 识别）"
      patch_type: "portability"
    - patch_file: "patches/0002-config.sub.patch"
      patch_description: "config.sub: 接受 ohos triplet，并在内核-OS 兼容表登记 linux-ohos*（否则 aarch64-unknown-linux-ohos 被拒）"
      patch_type: "portability"
    - patch_file: "patches/0003-pianod_unittest.patch"
      patch_description: "pianod_unittest: shebang /bin/ksh -> /bin/sh，使上游自有的 ksh93 守卫可执行并按 automake exit 77 上报 SKIP（OHOS 无 ksh93）"
      patch_type: "compatibility"
    - patch_file: "patches/0004-src-common-callback_test.cpp.patch"
      patch_description: "callback_test.cpp: 修正上游 typo `#undefine NDEBUG` -> `#undef NDEBUG`（Release 构建定义 NDEBUG 时该分支必然编译失败）"
      patch_type: "bugfix"
