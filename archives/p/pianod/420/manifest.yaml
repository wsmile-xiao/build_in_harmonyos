# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHPCD libcurl/8.5.0 以 CURL_USE_OPENSSL=OFF 构建，需要 TLS 的消费方必须改用 curl/8.15.0.x"  # knowledge_ref: E429-draft-68A9
  - "curl 与 gstreamer/ffmpeg 同图时 zlib/openssl pin 不一致，用 self.requires(..., override=True) 归一"  # knowledge_ref: notes.md#问题8
  - "gstreamer 配方未设 pkg_config_name，PkgConfigDeps 产物为 gstreamer.pc，autotools 消费方需 gstreamer-1.0.pc 别名"  # knowledge_ref: E432-draft-B649
  - "ohpcd ncurses 只有 libncursesw.a，硬编码 -lncurses 的探测需要窄字符库别名"  # knowledge_ref: notes.md#问题6
  - "conan Autotools.install() 的 DESTDIR 与绝对 prefix 会拼接成嵌套路径，application 包应配 --prefix=/"  # knowledge_ref: E430-draft-E7E8
  - "AutotoolsDeps 把 shared 依赖注入 autoconf 运行期探测，导致 cannot run C compiled programs"  # knowledge_ref: E431-draft-0EFD

