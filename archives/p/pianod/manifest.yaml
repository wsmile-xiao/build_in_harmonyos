# 软件级 manifest — pianod2
# 遵循 ARCHIVE-SPEC v2.0

software: pianod
display: "pianod"
description: "多源网络音乐播放守护进程 — 支持 Pandora/本地文件/音频发生器，内置 Web 客户端"
category: media
homepage: "https://deviousfish.com/pianod"
license: MIT
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游用 SVN 发布，官方唯一 tarball 源为 https://deviousfish.com/Downloads/pianod2/（无 GitHub/GitLab 镜像）"
    - "configure.ac 用 m4_esyscmd(svn info ...) 生成版本号，tarball 里 AC_INIT 版本为空，automake 的 TESTS 与包名不受影响"
    - "媒体引擎二选一（--with-engine=gstreamer|ffmpeg），gstreamer 路线自带音频输出，可完全避开 libao/libsdl/libavdevice"
    - "TLS 五选一（gnutls/mbedtls/libressl/openssl/osx），实现在自带库 football 的 fb_transport_*.c 中"
    - "Pandora source 必须用带 TLS 的 curl：ohpcd 的 libcurl/8.5.0 以 CURL_USE_OPENSSL=OFF 构建，需改用 curl/8.15.0.1"
    - "ncurses 在 ohpcd 只发布宽字符库（libncursesw.a），而 m4/dfcheckncurses.m4 硬编码 -lncurses，需本地库别名"
    - "测试入口 pianod_unittest 是 AT&T ksh93 脚本，OHOS 生态无 ksh93，脚本自带守卫以 exit 77 上报 SKIP"
  common_dependencies:
    - "curl/8.15.0.1"
    - "openssl/3.5.6.1"
    - "gstreamer/1.28.3"
    - "taglib/1.13.1"
    - "zlib/1.3.1.1"
    - "ncurses/6.6"

# ============================================================
# 版本索引
# ============================================================

versions:
  "420":
    status: built
    notes: "沿用 421 适配（r420 与 r421 仅差 ffmpeg 构建改动，补丁集逐字节复用并经 git apply --check 验证）；上游 make check 6 PASS / 1 SKIP / 0 FAIL"
  "421":
    status: built
    notes: "首次适配；autotools configure+make+make install 全通过，上游 make check 6 PASS / 1 SKIP / 0 FAIL"
