package: parso/0.8.7
homepage: "https://github.com/davidhalter/parso"

upstream_check_command: "python3 -m pytest -q"
upstream_test_in_build: false
upstream_test_command: "python3 -m pytest -q"
upstream_tests:
  - file: test/
    source: parso-0.8.7/test/
    description: "Unmodified upstream pytest tests and fixtures from the fixed sdist"
    command: "python3 -m pytest -q"

test_package_tests:
  - file: functional.py
    description: "Consumer checks packaged grammar resources, parse round-trip, and error recovery"
    command: "python3 functional.py <absolute-package-folder> <results-json>"

assertion_count: 10
