# pop-icon 3.5.1 — 上游测试状态
#
# pop-os/icon-theme 是纯资源仓库：仓库里只有渲染好的图标树（Pop/、Pop-Dark/）、
# SVG 源稿（src/）、渲染脚本（master-render.py）与 meson 安装脚本。
# meson.build 里没有 test() 注册，没有测试目录，也没有 CI 测试阶段。
# 因此上游测试用例数 N=0。
upstream_tests:
  total: 0
  passed: 0
  failed: 0
  skipped: 0
  type: "none"

# 适配后新增的自检断言（test_package/test_pop_icon.py）
#
# 其中 3 条专门覆盖 OHOS 大小写不敏感文件系统带来的差异：上游 tarball 有 8 组
# 「大小写折叠后同名」的条目（7 个 Pop/<N>x<N>/mimetypes/text-x-R.svg 别名 +
# Pop/scalable/apps 的两条 GNOME 大小写别名），一组只能落成 1 个目录项，故
# 可交付条目数 = 上游 6534 − 8 = 6526；断言验证每个别名名字仍可被大小写不敏感
# 地解析到且内容与实体文件一致。
added_tests:
  framework: "python-unittest-free script (test_package/test_pop_icon.py)"
  total: 35
  passed: 35
  failed: 0
  type: "resource-integrity"

# 完整消费者用例（平台 rule12：鸿蒙特有测试不能只有断言，必须有真正跑通
# 功能/流程的端到端用例）。consumer_icontheme.py 按 freedesktop 图标查找机制
# 消费交付产物：XDG 契约定位 share/icons/<主题> → 解析 index.theme 的
# Directories=（逗号分隔）/Size/Type(Threshold|Fixed|Scalable)/Context →
# 按"名称 + 尺寸"查找算法解析到实体文件（含 Scalable 放大回退）。
# 探针自派生（不硬编码图标名）：实测 Pop 20/20 次查找、Pop-Dark 10/10 次查找。
consumer_case:
  file: "test_package/consumer_icontheme.py"
  kind: "end-to-end consumer (freedesktop icon lookup over the installed theme)"
  themes: 2
  lookups_resolved: 30
  declared_dirs: 158
  missing_declared_dirs: 90   # 上游 index.theme 声明多于交付，消费者按缺失跳过
