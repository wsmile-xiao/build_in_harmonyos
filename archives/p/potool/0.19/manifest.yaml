# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.19"

# 软件名
software: "potool"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-24"
# 任务特性：纯 C 裸 Makefile（非 autotools/CMake）。G0 探测链
# （CMake > meson > configure > Makefile）与 init-build 的模板选择都按
# build_system 走，此处显式覆盖为 makefile，避免被猜成 autotools。
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL（官方站点，https；http:// 同路径会 301 到本地址，sha256 一致）
  url: "https://marcin.owsiany.pl/potool/potool-0.19.tar.gz"

  # 源码校验和（官方站点 / Debian orig tarball / git tag 源树 三重同源）
  sha256: "1251621b5e69b660987e8c9497df9e75e0b3e40bcf8304bdbd26a4fbd37c4384"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表（裸 Makefile 无 configure 步）
  configure_options: []

  # 编译依赖列表（格式: name/version）
  # glib=运行期链接 + pkg-config 查询对象；flex/bison=生成 lex.po.c/po.tab.c；
  # gettext=msgfmt（scripts/poupdate）；pkgconf=Makefile 的 $(shell pkg-config …)
  dependencies:
    - glib/2.88.3
    - flex/2.6.4
    - bison/3.8.2
    - gettext/0.22.5
    - pkgconf/3.0.6

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"
  - "0002-change-po-charset.patch"
  - "0003-scripts-poedit.patch"
  - "0004-scripts-postats.patch"
  - "0005-scripts-poupdate.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS=musl libc，getopt() 严格 POSIX 不做 GNU 参数置换：上游 scripts/poedit 以 potool <file> <opts> 形态调用时 -fnth 被当第二个输入文件（Can't open input file: -fnth）；一手探针 gpprobe：选项后置 optind=1、positional[2]=-fnth，选项前置 optind=2 正常。修法=脚本改选项前置，不动 potool.c 解析器"  # knowledge_ref: E696
  - "设备与 CI worker 均无 /bin/bash、/usr/bin/perl：上游 shebang 硬编码绝对解释器路径直接 bad interpreter(126/ENOENT)；改 #!/usr/bin/env bash|perl 后经 PATH 解析到 /data/service/hnp/bin/{bash,perl}（/usr/bin/env 存在）"  # knowledge_ref: E696
  - "OHOS 全机无 locale 命令（/system /data/app /data/service/hnp /vendor ~/.harmonybrew 五路 MISS），poedit 的 locale charmap 必断；环境 shim 须返回 UTF-8 而非 locale 名——返回 C.UTF-8 会被 iconv 判 conversion unsupported（实测）"  # knowledge_ref: E696
  - "纯 C 裸 Makefile 包：G0/init-build 模板按 autotools 猜测，manifest 须显式 build.system=makefile；设备 PATH 无 cc 别名与 /system/bin（make: cc/install No such file），配方须显式 CC=clang 与 INSTALL 绝对路径"  # knowledge_ref: E696

