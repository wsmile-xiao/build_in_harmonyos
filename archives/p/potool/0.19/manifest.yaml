  source_orig_dir: /storage/Users/currentUser/ws/tmp/builds/potool-0.19.orig
  source_work_dir: /storage/Users/currentUser/ws/tmp/builds/potool-0.19.work
  source_orig_hash: d0c1ce65f626c8a9
  source_work_hash: 7a93e8742b03c4d5
  generated_at: '2026-09-24T02:10:15'
  patches_count: 5

