# test_package/MANIFEST.yml — potool 0.19
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: potool/0.19
homepage: "https://marcin.owsiany.pl/potool-page"

# 上游测试命令（裸 Makefile: `check: potool` → `cd tests && bash test`）
upstream_check_command: "make check"

# 上游测试已集成进 conanfile.py build()（N=10，见 notes.md「上游测试」表）
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际运行的测试（tests/test 单驱动脚本，set -e 下逐条 diff -u 断言，共 10 条）
upstream_tests:
  - file: tests/test
    source: potool-0.19/tests/test
    description: "no filter：potool 1/in.po 输出等于 in.po"
    command: "../potool 1/in.po > 1/out.po && diff -u 1/in.po 1/out.po"
  - file: tests/test
    source: potool-0.19/tests/test
    description: "-f no：只留未翻译条目，输出等于 tests/1/f no.po"
    command: "../potool -f no 1/in.po > 1/out.po && diff -u '1/f no.po' 1/out.po"
  - file: tests/test
    source: potool-0.19/tests/test
    description: "-f nt：未翻译（含复数）条目，输出等于 tests/1/f nt.po"
    command: "../potool -f nt 1/in.po > 1/out.po && diff -u '1/f nt.po' 1/out.po"
  - file: tests/test
    source: potool-0.19/tests/test
    description: "-f nth：翻译与未翻译混合，输出等于 tests/1/f nth.po"
    command: "../potool -f nth 1/in.po > 1/out.po && diff -u '1/f nth.po' 1/out.po"
  - file: tests/test
    source: potool-0.19/tests/test
    description: "-f o：只留已翻译条目，输出等于 tests/1/f o.po"
    command: "../potool -f o 1/in.po > 1/out.po && diff -u '1/f o.po' 1/out.po"
  - file: tests/test
    source: potool-0.19/tests/test
    description: "-f t：只留已翻译（含复数）条目，输出等于 tests/1/f t.po"
    command: "../potool -f t 1/in.po > 1/out.po && diff -u '1/f t.po' 1/out.po"
  - file: tests/test
    source: potool-0.19/tests/test
    description: "双文件合并模式：potool 2/in.po 2/work.po 输出等于 work.po"
    command: "../potool 2/in.po 2/work.po > 2/out.po && diff -u 2/work.po 2/out.po"
  - file: tests/test
    source: potool-0.19/tests/test
    description: "poedit 无选项：过滤后回写，文件内容不变"
    command: "cp 3/in.po 3/work.po && EDITOR=: poedit 3/work.po && diff -u 3/in.po 3/work.po"
  - file: tests/test
    source: potool-0.19/tests/test
    description: "poedit -a：包含全部消息后回写，文件内容不变"
    command: "cp 3/in.po 3/work.po && EDITOR=: poedit -a 3/work.po && diff -u 3/in.po 3/work.po"
  - file: tests/test
    source: potool-0.19/tests/test
    description: "poedit -p：保留换行后回写，文件内容不变"
    command: "cp 4-wrapping/in.po 4-wrapping/work.po && EDITOR=: poedit -p 4-wrapping/work.po && diff -u 4-wrapping/in.po 4-wrapping/work.po"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.sh
    description: "5 条断言：-h 用法、-f t 输出与上游 golden 逐字节一致、-s 统计=9、4 个辅助脚本随包可执行、poedit/change-po-charset 可移植 shebang 已进产物"
    command: "bash test.sh"

# test_package 消费者断言数（上游 10 条另计，不进本字段）
assertion_count: 5
