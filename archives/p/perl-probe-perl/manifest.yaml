software: perl-probe-perl
display: "Probe::Perl"
description: "Information about the currently running perl interpreter"
category: data
homepage: "https://metacpan.org/release/Probe-Perl"
license: perl_5
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无 XS/C 编译，无需静态链接配置"
    - "依赖 Config 和 File::Spec，均为 Perl 核心模块，无外部依赖"
    - "conanfile.py package() 需将 .pm 从嵌套 site_perl 路径复制到 lib/ 供 Conan G4 产物检测"
    - "test_package 使用 conanrun env 设置 PERL5LIB 验证模块加载"
    - "G0 无法识别 perl-eumm 构建系统，为已知平台限制"
  common_dependencies:
    - perl (5.42.0)

versions:
  "0.03":
    status: published
    build_date: "2026-06-26"
    conan_ref: "perl-probe-perl/0.03"
