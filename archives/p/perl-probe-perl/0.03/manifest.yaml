software: perl-probe-perl
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.03/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.03"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"
compile_date: "2026-06-26"

# 构建系统
build_system: perl-eumm

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/K/KW/KWILLIAMS/Probe-Perl-0.03.tar.gz"

  # 源码校验和
  sha256: "d9e4d21e2e77638559045fa09046b1b6fff6c403b949929db213e30abe8a3c31"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl-eumm

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯Perl模块使用 ExtUtils::MakeMaker (Makefile.PL) 构建，无需C编译器"
  - "仅依赖 Perl 核心模块 (Config, File::Spec)，无外部依赖"
  - "conanfile.py settings 应简化为 os+arch，纯Perl模块不需要 compiler/build_type"
  - "conanfile.py self.run() 应使用 env=conanrun 以正确传递环境变量"
  - "conanfile.py package() 应使用 copy() 从已知 site_perl 路径复制 .pm 到 lib/ 供 G4 检测"
  - "不应依赖 exports lib/** workaround，应在 package() 中处理产物复制"
  - "G0 无法识别 perl-eumm 构建系统，为已知平台限制，手动验证通过即可"
  - "make test 19个测试全部通过（1个author测试跳过），功能测试通过"
