software: perl-ppix-regexp
display: "PPIx::Regexp"
description: "Parse regular expressions the way PPI parses Perl"
category: data
homepage: "https://metacpan.org/dist/PPIx-Regexp"
license: mit
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无 XS/C 编译，无需静态链接配置"
    - "依赖 PPI 模块，需设置 PERL5LIB 包含 $DEFAULT_PREFIX/lib/site_perl/5.42.0"
    - "需设置 PERL_PARAMS_UTIL_PP=1 使用纯 Perl 版本的 Params::Util"
    - "PPIx::Regexp::Tokenizer->new() 不接受 qr// 对象，必须使用字符串形式如 'qr/foo/'"
    - "SSL 证书验证失败时用 curl -k 下载 tarball（参考 perl-dbd-pg 经验）"
  common_dependencies:
    - perl-ppi
    - perl (5.42.0)

versions:
  "0.091":
    status: published
    build_date: "2026-06-26"
    conan_ref: "perl-ppix-regexp/0.091"
