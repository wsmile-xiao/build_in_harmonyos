patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "PPIx::Regexp is a pure Perl module using ExtUtils::MakeMaker (Makefile.PL)"
  - "Depends on PPI >= 1.238 (satisfied by perl-ppi 1.284)"
  - "PERL5LIB must include $DEFAULT_PREFIX/lib/site_perl/5.42.0 to find PPI"
  - "PERL_PARAMS_UTIL_PP=1 needed for Params::Util pure-perl fallback (XS .so cannot dlopen on HMDFS)"
  - "All 13264 tests pass on HarmonyOS"
  - "PPIx::Regexp::Tokenizer::new() does NOT accept qr// (Regexp ref) objects — must use string form like 'qr/foo/'"
  - "test_package must use string form and strict failure checking to avoid false PASS"
