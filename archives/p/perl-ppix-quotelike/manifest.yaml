software: perl-ppix-quotelike
display: "PPIx::QuoteLike"
description: "Parse Perl string literals and string-literal-like things"
category: data
homepage: "https://metacpan.org/dist/PPIx-QuoteLike"
license: perl
build_system: perl-eumm

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无 XS/C 编译，无需静态链接配置"
    - "依赖 PPI 模块，需设置 PERL5LIB 包含 $DEFAULT_PREFIX/lib/site_perl/5.42.0"
    - "Readonly 模块需手动安装（Module::Build::Tiny 不可用，直接拷贝 .pm 文件）"
    - "需设置 PERL_PARAMS_UTIL_PP=1 使用纯 Perl 版本的 Params::Util"
    - "SSL 证书验证失败时用 curl -k 下载 tarball（参考 perl-dbd-pg 经验）"
  common_dependencies:
    - perl-ppi
    - perl (5.42.0)

versions:
  "0.023":
    status: published
    build_date: "2026-06-26"
    conan_ref: "perl-ppix-quotelike/0.023@ohpcd/stable"
