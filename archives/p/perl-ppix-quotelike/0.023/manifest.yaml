software: perl-ppix-quotelike
# 版本级 manifest
# 文件位置: archives/{letter}/{name}/0.023/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.023"

# 编译状态
# published | built | failed | archived
status: built

# Conan 引用格式
conan_ref: "perl-ppix-quotelike/0.023"

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"
compile_date: "2026-06-26"

# 构建系统（顶层字段，供 submit 自检）
build_system: perl-eumm

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/W/WY/WYANT/PPIx-QuoteLike-0.023.tar.gz"

  # 源码校验和
  sha256: "3576a3149d2c53e07e9737b7892be5cfb84a499a6ef1df090b713b0544234d21"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: perl-eumm

  # 配置选项列表
  configure_options:
    - "INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-ppi/1.284"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Readonly 模块需要手动安装（Module::Build::Tiny 不可用，直接拷贝 .pm 文件）"
  - "PERL5LIB 需要包含 $DEFAULT_PREFIX/lib/site_perl/5.42.0 以找到 PPI 模块"
  - "PERL_PARAMS_UTIL_PP=1 需要设置以使用纯 Perl 版本的 Params::Util"
