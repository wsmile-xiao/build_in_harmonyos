software: perl-reply
display: "Reply (Perl REPL)"
description: "Perl 交互式 REPL 工具，提供即时代码求值环境"
category: perl
homepage: "https://metacpan.org/pod/Reply"
license: MIT
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，使用 ExtUtils::MakeMaker (Makefile.PL) 构建"
    - "OHOS SELinux 限制 .so 加载，XS 模块无法使用，需强制纯 Perl 模式"
    - "Bundle 15 个纯 Perl 依赖模块到 lib/perl5 (OHOS 无独立 Conan 包)"
    - "修补 Mixin::Linewise::Readers 使 PerlIO::utf8_strict (XS) 可选"
    - "修补 Eval::Closure 使 Devel::LexAlias (XS) 可选"
    - "移除默认配置中 LexicalPersistence/ReadLine/FancyPrompt 插件 (依赖 XS)"
    - "reply 脚本 BEGIN 块自定位 lib + 设置 PERL_PARAMS_UTIL_PP=1, PACKAGE_STASH_IMPLEMENTATION=PP"
  common_dependencies:
    - "perl 5.42.0 (系统预装)"

versions:
  "0.42":
    status: published
    build_date: "2026-06-29"
    published_as: perl-reply
    source_url: "https://cpan.metacpan.org/authors/id/D/DO/DOY/Reply-0.42.tar.gz"
