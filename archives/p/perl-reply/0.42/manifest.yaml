software: perl-reply
# 版本级 manifest
# 文件位置: archives/p/perl-reply/0.42/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "0.42"
status: published
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/D/DO/DOY/Reply-0.42.tar.gz"
  sha256: "4ada2a45a77a54ae10c4e9a48144ea826d5d79ad050cb9626e9f783d03ab79f2"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: perl
  build_system: perl
  configure_options:
    - "INSTALLDIRS=site"
  dependencies:
    - "Module::Runtime 0.016 (bundled, pure Perl)"
    - "Try::Tiny 0.32 (bundled, pure Perl)"
    - "Config::INI 0.025 + Config::INI::Reader::Ordered 0.022 (bundled, pure Perl)"
    - "File::HomeDir 1.006 + File::Which 1.27 (bundled, pure Perl)"
    - "Eval::Closure 0.14 (bundled, pure Perl)"
    - "Package::Stash 0.40 + Package::Stash::PP (bundled, PP fallback)"
    - "Dist::CheckConflicts 0.11 (bundled, pure Perl)"
    - "Module::Implementation 0.09 (bundled, pure Perl)"
    - "Mixin::Linewise 0.111 (bundled, patched for PerlIO::utf8_strict)"
    - "Sub::Exporter 0.991 + Sub::Install 0.929 (bundled, pure Perl)"
    - "Params::Util 1.102 + Params::Util::PP (bundled, PP fallback)"
    - "Data::OptList 0.114 (bundled, pure Perl)"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "conanfile.py: 内联修补 Mixin::Linewise::Readers 使 PerlIO::utf8_strict 可选"
  - "conanfile.py: 内联修补 Eval::Closure 使 Devel::LexAlias 可选 (eval require)"
  - "conanfile.py: 内联修补 Reply::App 默认配置移除 [LexicalPersistence]/[ReadLine]/[FancyPrompt]"
  - "conanfile.py: 内联修补 reply 脚本自定位 lib + 强制纯 Perl 模式"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "纯Perl模块，使用Makefile.PL (EUMM)构建系统"
  - "XS依赖模块(PadWalker, Devel::LexAlias)的.so在OHOS上无法加载(SELinux限制)，通过修补使其可选"
  - "PerlIO::utf8_strict为XS模块，通过修补Mixin::Linewise::Readers回退到:utf8"
  - "Params::Util和Package::Stash有XS后端，通过环境变量PERL_PARAMS_UTIL_PP=1和PACKAGE_STASH_IMPLEMENTATION=PP强制纯Perl"
  - "Eval::Closure使用Devel::LexAlias实现词法变量别名，通过eval require使其可选"
  - "Reply::App默认配置(__DATA__段)含LexicalPersistence/ReadLine/FancyPrompt三个XS依赖插件，需移除"
  - "Term::ReadLine在OHOS管道输入场景下阻塞，导致REPL挂起"
  - "reply脚本通过BEGIN块自定位lib/perl5目录，无需依赖PERL5LIB环境变量"
  - "Conan配方bundled 15个纯Perl依赖模块，因为OHOS平台无独立Conan包"
  - "REPL功能测试通过:算术/字符串/JSON/Data::Dumper/map-grep/正则/子程序/模块加载"
  - "已知限制:词法变量(my)不跨行持久(LexicalPersistence不可用)，全局变量($main::x)可持久"
  - "conan-verify全部通过(G0-G4 + L2/L4/L5)，可标记published"
