software: perl-pod-wrap
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.01/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.01"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型
# perl | cmake | autotools | makefile | meson | custom
build_system: perl

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"
compile_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/N/NU/NUFFIN/Pod-Wrap-0.01.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX INSTALLDIRS=site"
    - "PERL5LIB=$HOME/usr/local/lib/site_perl/5.42.0:$HOME/usr/local/lib/5.42.0"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl-pod-parser/1.67"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 测试结果
test_passed: 77
test_failed: 0
test_note: "All tests passed (t/deparse_cmp.t, 77 tests)"

# 编译中学到的知识
knowledge_gained:
  - "Pod::Parser在Perl 5.36+已从核心移除，需确保PERL5LIB包含正确路径 (ref: L3-software-specific)"
  - "纯Perl模块构建系统类型应为perl而非autotools (ref: L2-build-pattern)"
  - "clean-verify脚本硬编码./configure，不支持perl Makefile.PL，但finish中G0为非阻塞 (ref: L3-software-specific)"
  - "DESTDIR模式：PREFIX=$DEFAULT_PREFIX + DESTDIR=$TEST_PREFIX，产物安装到$TEST_PREFIX/$DEFAULT_PREFIX/ (ref: R20)"
  - "无C编译器参与，无ELF二进制，G1/G3门禁自动PASS (ref: L2-build-pattern)"
  - "功能测试覆盖模块加载、POD文本换行、verbatim保留、编码处理等场景 (ref: L3-software-specific)"
