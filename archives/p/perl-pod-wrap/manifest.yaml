software: perl-pod-wrap
display: "Pod::Wrap"
description: "Perl module to wrap POD paragraphs, leaving verbatim text and code alone"
category: perl
homepage: "https://metacpan.org/dist/Pod-Wrap"
license: GPL-1.0-or-later OR Artistic-1.0
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C 编译，无需 CRT 补丁、ELF 签名或 musl BIND_NOW 修复"
    - "依赖 Pod::Parser（Perl 5.36+ 已从核心移除），需通过 PERL5LIB 提供路径"
    - "使用 Text::Wrap（Perl 核心模块）进行文本换行"
    - "与 perl-dbd-pg (XS 模块) 不同，纯 Perl 模块在鸿蒙平台上无需任何平台适配补丁"

versions:
  "0.01":
    status: published
    build_date: "2026-06-25"
