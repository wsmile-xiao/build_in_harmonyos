# Test manifest for pd-chaos 0.2.
package: pd-chaos/0.2
homepage: "https://puredata.info"
upstream_tarball: "https://downloads.sourceforge.net/project/pure-data/libraries/chaos/chaos-0.2.tar.gz"

# ── Upstream test inventory (pd-chaos 0.2) ─────────────────────────────────
# Counting unit: test CASES.  pd-chaos 0.2 ships **no automated tests**: the
# tarball root `chaos-0.2/` contains 28 attractor sources, libchaos.c,
# chaos.h, the Pd Makefile template 1.0.11 (plus Makefile.nt and the Visual
# Studio project files), 28 <class>-help.pd patches, chaos-meta.pd, two
# utility patches (fractal-tools.pd, search-tools.pd), eleven example patches
# under examples/, README.txt and LICENSE.txt.  There is no tests/ or test/
# directory, and the Makefile defines no `check:` target — `grep '^check'`
# over it matches nothing.  The attractor objects can only be exercised by
# loading them into a running Pd, which upstream never automates.
upstream_tests_exist: false
upstream_test_in_build: false
upstream_test_count: 0
upstream_passed: 0
upstream_failed: 0
upstream_run: 0
upstream_not_run: 0
upstream_test_sources: []
upstream_no_test_evidence: >-
  Upstream tarball root chaos-0.2/ holds the 28 attractor C sources,
  libchaos.c, chaos.h, the Pd Makefile template 1.0.11, 28 <class>-help.pd
  help patches, chaos-meta.pd, fractal-tools.pd, search-tools.pd, eleven
  examples/*.pd patches, README.txt and LICENSE.txt.  No tests/ or test/
  directory exists and the Makefile has no `check:` target, so there is no
  runnable upstream test case; upstream CI (none for this library) does not
  run any test either.

# ── HarmonyOS-specific test added by this adaptation ────────────────────────
# There is no upstream test to port, so the delivered behaviour is pinned by a
# consumer test that drives the packaged OHOS aarch64 artifacts the same way Pd
# does: dlopen(RTLD_NOW) + <class>_setup() for every plugin, the real
# libchaos.so lyapunov API, and real object construction/message dispatch — all
# against a minimal Pure Data runtime shim, because Pd's own runtime is a
# separate package and its symbols are what a plugin resolves at load time.
test_package_tests:
  - file: pd_chaos_test.c
    description: >-
      Consumer program that dlopen()s all 28 packaged <class>.pd_linux plugins
      with RTLD_NOW, calls their real <class>_setup() entry points and checks
      each class registers exactly once with a non-zero instance size plus a
      bang and a reset method; dlopen()s libchaos.so and drives lyapunov() on
      a chaotic (a=4, positive exponent) and a stable (a=1.5, negative
      exponent) logistic map, checks determinism and that lyapunov_full()
      fills and returns the caller's buffer; creates real `logistic` and
      `martin` objects through their constructors, bangs them and compares the
      emitted floats against the closed-form iteration 4*x*(1-x) and
      y-sin(x)/a-x, including a `reset 0.25` message round trip and the
      two-distinct-outlets ordering of martin.

test_files:
  - path: "test_package/pd_chaos_test.c"
    test_type: "R34"
    harmonyos_specific: true
    assertion_count: 80

test_package_test_count: 1
consumer_assertion_count: 80
assertion_count: 80