# 版本级 manifest
# 文件位置: archives/p/pd-chaos/0.2/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.2"

# 软件名
software: "pd-chaos"

# 编译状态
# published | built | failed | archived
# built = conan verify/本地 conan create 通过，尚未 conan upload 到制品仓
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-04"

# 构建系统
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # 官方 SourceForge 发布（Pure Data 传统托管点），即
  # https://download.puredata.info/chaos/ 目录列表所指向的地址 —— R39 合规，
  # 无需任何例外。2026-10-04 实测：该 tarball 与 Debian 官方源码池的
  # pd-chaos_0.2.orig.tar.gz 逐字节相同，Debian 侧仅用作独立交叉校验。
  url: "https://downloads.sourceforge.net/project/pure-data/libraries/chaos/chaos-0.2.tar.gz"

  # 源码校验和（与 pd-chaos_0.2-5.dsc 的 Checksums-Sha256 一致）
  sha256: "c9f10c5d37d83c0af823c722421b7b4173ef1896c97e103f26cd2bb3963a6fe4"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 构建选项（上游 Makefile 未做任何补丁，仅命令行覆盖变量）
  configure_options:
    - 'CC=<OHOS clang，来自 tools.build:compiler_executables>'
    - 'PD_INCLUDE=<puredata 包>/include/pd'
    - 'UNAME=Linux  # 必需：OHOS worker 的 uname -s 是 HarmonyOS，上游 Makefile 无该分支'
    - 'prefix=      # 清空后 objectsdir=/lib/pd-externals，产物落到包内 lib/ 下'
    - 'STRIP=true   # libdir_install 不依赖宿主 strip（宿主未必有 aarch64 strip）'

  # 编译依赖列表（格式: name/version）
  dependencies:
    - puredata/0.54.1

  # 编译器
  cc: clang

# ============================================================
# 补丁信息
# ============================================================

# 零补丁：平台差异全部由 make 命令行变量覆盖，源码与 Makefile 保持上游原样
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Pd 的老式 Makefile template 1.0.11 按 UNAME := $(shell uname -s) 全串匹配判平台，无 OHOS 分支；CI worker 的 uname -s 是 HarmonyOS，会静默丢掉 EXTENSION/-fPIC/-shared，链接报 undefined symbol: main。修复是命令行 UNAME=Linux，不需要补丁"
  - "同族的坑第二次出现：make libdir_install 在 package() 阶段会重链过期的插件，CC 若只在 build() 传就会回落宿主 cc，报 'Relocations in generic ELF (EM: 183)'。make 命令行覆盖必须 build()/package() 共用"
  - "Pd 外部对象没有 setup() 分发函数也能被 Pd 0.54 加载：28 个 <class>_setup 各自导出，实测真机 pd -path 可按类名实例化全部 28 类"
  - "Pd 的 pd_new() 是「按 c_classsize 分配并写 ob_pd」的分配原语，构造函数自己调它；shim 若在 pd_new 里回调 c_new 会无限递归爆栈。带创建参数的实例化走 newobject() 语义 (*c_new)(sym, argc, argv)"
  - "m_pd.h 把 class_addbang 声明成自调用宏，提供同名 shim 符号前必须 #undef，否则函数定义本身被展开"
  - "t_float 在 puredata 构建里是 32 位 float：吸引子在 double 上迭代但 outlet_float 会收窄，测试期望值必须同样过一道 (t_float)"
  - "struct _class / struct _outlet 在 m_pd.h 里只有前置声明（完整定义在私有 m_globals.h），插件从不解引用它们，测试侧补一个够用的定义即可；t_object(struct _text) 有完整定义"
  - "puredata/0.54.1 的 bin/pd 在部分 OHOS/guest 环境报 __fd_chk: symbol not found，端到端 pd 加载受阻；改用「消费者程序 + 最小 Pd 运行时 shim」驱动真实插件代码"
  - "上游缺陷如实复现未改：gingerbreadman 用 int abs(int) 处理 double，|x|<1 时该项恒为 0；部分类构造函数只初始化 vars_init[] 不初始化 vars[]"

# ============================================================
# 产物
# ============================================================

artifacts:
  - "lib/pd-externals/chaos/<class>.pd_linux × 28  # Pd dlopen 插件，NEEDED libc.so + libchaos.so，RUNPATH=$ORIGIN"
  - "lib/pd-externals/chaos/libchaos.so            # Lyapunov 指数辅助库，DT_SONAME=libchaos.so"
  - "lib/pd-externals/chaos/*-help.pd × 30 (28 吸引子 + fractal-tools-help.pd + search-tools-help.pd)"
  - "lib/pd-externals/chaos/chaos-meta.pd + fractal-tools.pd + search-tools.pd"
  - "lib/pd-externals/chaos/examples/*.pd × 11 + README.txt + LICENSE.txt"
  - "include/chaos.h                               # lyapunov()/lyapunov_full() 公共头"
  - "licenses/LICENSE.txt"