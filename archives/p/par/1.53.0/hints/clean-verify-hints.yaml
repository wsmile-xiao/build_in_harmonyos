build_system: makefile
configure_command: null
build_command: "make -f protoMakefile CC='clang -fPIC -O2 -c' LINK1=clang LINK2=-o"
install_command: "mkdir -p __DESTDIR__/$DEFAULT_PREFIX/bin && cp par __DESTDIR__/$DEFAULT_PREFIX/bin/par && mkdir -p __DESTDIR__/$DEFAULT_PREFIX/share/man/man1 && cp par.1 __DESTDIR__/$DEFAULT_PREFIX/share/man/man1/par.1"
