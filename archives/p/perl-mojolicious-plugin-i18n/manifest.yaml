software: perl-mojolicious-plugin-i18n
display: "Mojolicious::Plugin::I18N"
description: "Mojolicious 国际化插件，基于 I18N::LangTags 提供多语言本地化支持"
category: perl
homepage: "https://github.com/sharifulin/mojolicious-plugin-i18n"
repository: "https://github.com/sharifulin/mojolicious-plugin-i18n"
license: Artistic-2.0
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C/XS 编译，编译过程简单"
    - "模式 A 自动构建脚本对纯 Perl 模块产物检测有局限性，需使用模式 B 手动编译"
    - "无 SELinux HMDFS 限制（无 XS .so 文件需要加载）"
  common_dependencies:
    - "perl/5.42.0"
    - "perl-mojolicious/9.42"
    - "perl-i18n-langtags/0.45"

versions:
  "1.6":
    status: published
    build_date: "2026-06-23"
    published_as: perl-mojolicious-plugin-i18n
    source_url: "https://backpan.perl.org/authors/id/S/SH/SHARIFULN/Mojolicious-Plugin-I18N-1.6.tar.gz"
