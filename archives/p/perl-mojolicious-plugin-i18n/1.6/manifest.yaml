software: perl-mojolicious-plugin-i18n

version: "1.6"

status: published

build_date: "2026-06-23"

source:
  url: "https://backpan.perl.org/authors/id/S/SH/SHARIFULN/Mojolicious-Plugin-I18N-1.6.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: perl
  build_system: perl
  configure_options:
    - "perl Makefile.PL PREFIX=/storage/Users/currentUser/usr/local"
  dependencies:
    - "perl/5.42.0"
    - "Mojolicious/9.42"
    - "I18N-LangTags/0.45"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "纯Perl模块，模式A自动构建脚本无法识别.pm产物，需模式B手动编译"
  - "perl Makefile.PL PREFIX=$DEFAULT_PREFIX + make + make install DESTDIR=$TEST_PREFIX"
  - "纯Perl模块不受SELinux HMDFS限制，与XS模块(如perl-dbd-pg)不同，无需管理员安装"
  - "软件级manifest.yaml是ARCHIVE-SPEC必填文件，初始编译时容易遗漏"
