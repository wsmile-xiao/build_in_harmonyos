software: perl-locale-codes
display: "Locale::Codes"
description: "Pure Perl module for locale codes (country, language, currency, script)"
category: perl_module
homepage: "https://metacpan.org/release/Locale-Codes"
license: "Perl Artistic License"
build_system: perl_makemaker

ohos_adaptation:
  key_points:
    - "Pure Perl module, no XS code"
    - "No SELinux HMDFS restrictions"
    - "Works with PERL5LIB environment variable"
    - "Test dependency Test::Inter available from CPAN"
  common_dependencies:
    - perl >= 5.42.0

versions:
  "3.85-r0":
    status: published
    build_date: "2026-06-15"
    published_date: "2026-06-15"
    package: perl-locale-codes-3.85-r0-ohos-aarch64.tar.gz
    package_size: 2.2M
    notes:
      - Pure Perl module
      - All 1230 unit tests pass
      - All 33 functional tests pass
      - No SELinux HMDFS restrictions
      - Requires PERL5LIB configuration after installation

dependencies:
  runtime:
    - perl >= 5.42.0
  test:
    - Test::Inter >= 1.09 (optional, for running tests)

keywords:
  - locale
  - codes
  - country
  - language
  - currency
  - script
  - ISO
  - perl