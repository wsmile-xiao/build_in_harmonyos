# test_package/MANIFEST.yml — 上游官方测试声明
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在；详见 docs/TEST_QUALITY_SPEC.md
#
# 计数口径（实数实测，非估计）：
#   - tests/ 目录下 .cc 用例文件：29 个（本文件以此为主口径）
#   - tests/meson.build 中 pistache_test_files 注册的测试目标：26 个
#     （其中 net_test 属 network 套件，需网络访问；flaky 套件为空）
package: pistache/0.4.26
homepage: "https://github.com/pistacheio/pistache"

upstream_check_command: "meson test --list"

# 本配方默认 PISTACHE_BUILD_TESTS=false，构建期不集成上游测试：
# 上游 Meson 的测试开关同时强制要求 rapidjson；且 tests/ 下含 TLS、网络、邮件等
# 需要证书与端口绑定的用例，不适合放进包构建阶段。上游测试以实跑方式单独取证。
upstream_test_in_build: false
upstream_test_command: "meson test -v"
upstream_test_file_count: 29
upstream_test_registered_count: 26

# 上游测试程序（tests/ 下的实际用例文件，列举代表性条目）
upstream_tests:
  - file: tests/http_parsing_test.cc
    source: pistache-0.4.26/tests/http_parsing_test.cc
    description: "HTTP 请求/响应报文解析用例"
    command: "./tests/run_http_parsing_test"
  - file: tests/headers_test.cc
    source: pistache-0.4.26/tests/headers_test.cc
    description: "HTTP 头部集合增删查改用例"
    command: "./tests/run_headers_test"
  - file: tests/http_uri_test.cc
    source: pistache-0.4.26/tests/http_uri_test.cc
    description: "URI 解析与查询串用例"
    command: "./tests/run_http_uri_test"
  - file: tests/router_test.cc
    source: pistache-0.4.26/tests/router_test.cc
    description: "路由注册与匹配用例"
    command: "./tests/run_router_test"
  - file: tests/cookie_test.cc
    source: pistache-0.4.26/tests/cookie_test.cc
    description: "Cookie 解析与序列化用例"
    command: "./tests/run_cookie_test"

# test_package 自带的消费者测试
test_package_tests:
  - file: test_consumer.cpp
    description: "真实调用 pistache 公共 API：Uri::Query 取值、Address/IP/Port 构造、
Endpoint 构造与版本枚举，断言编译与运行退出码、输出内容"
    command: "bash test_pistache.sh"

assertion_count: 10
