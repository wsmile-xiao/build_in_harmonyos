# 版本级 manifest —— pistache 0.4.26
# 遵循 ARCHIVE-SPEC v2.0

version: "0.4.26"
software: pistache

# 本机原生构建已通过 conan create 与八门禁；制品发布由平台 release 流水线在合入后执行
status: built
build_date: "2026-09-11"

source:
  url: "https://github.com/pistacheio/pistache/archive/refs/tags/v0.4.26.tar.gz"
  sha256: "29af6562547497acf6f49170661786fe8cf1ed3712ad80e69c53da4661c59544"
  tar_format: tar.gz

build:
  # 上游 CMake 在顶层项目时 install() 主动 FATAL_ERROR，故用上游 Meson 路径
  build_system: meson
  configure_options:
    - "PISTACHE_BUILD_TESTS=false"
    - "PISTACHE_BUILD_EXAMPLES=false"
    - "PISTACHE_BUILD_DOCS=false"
    - "PISTACHE_INSTALL=true"
    - "PISTACHE_USE_SSL=false"
  dependencies:
    - rapidjson/1.1.0
    - date/3.0.5
  tool_requires:
    - meson/1.11.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-meson-accept-harmonyos-platform.patch"
  - "0002-strerror-r-use-glibc-variant-check.patch"

knowledge_gained: []
