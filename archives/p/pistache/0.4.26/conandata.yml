# conandata.yml — pistache 0.4.26
# 官方源：pistacheio/pistache 的 GitHub 官方归档（tag v0.4.26）。
# 版本号依据：上游 version.txt = 0.4.26.20241222（Meson project() 里的 0.3.0 是陈旧字面量，
# 真实版本由 version.txt 在构建期读入，安装出的头文件版本随之）。
# tag 无 v 前缀以外的变体；本条目 URL 与 sha256 均为官方产物实测值。

sources:
  url: "https://github.com/pistacheio/pistache/archive/refs/tags/v0.4.26.tar.gz"
  sha256: "29af6562547497acf6f49170661786fe8cf1ed3712ad80e69c53da4661c59544"

patches:
  # 平台识别补丁：上游 meson.build 的平台白名单只接受 linux/darwin/windows/*bsd，
  # 而 Conan 的 OHOS 适配把 host_machine.system() 映射为 'harmonyos'，导致 configure
  # 阶段直接 error('Pistache currenly only supports Linux, macOS, Free/Open/NetBSD and Windows.')。
  # 本补丁仅把 'harmonyos' 加入该白名单，不改变任何构建行为：
  # 其余 system() 判断都是 == 'windows' 或 .endswith('bsd') 分支，在 harmonyos 下
  # 自然走 Linux 路径（epoll / pthread / dl），与平台语义一致。
  - patch_file: "patches/0001-meson-accept-harmonyos-platform.patch"
    patch_description: "Add 'harmonyos' to the supported-platform allow-list in meson.build"
    patch_type: "portability"
  # libc 探针修正：strerror_r 的 GNU 变体（返回 char*）是 glibc 特性，不是"linux"特性。
  # 上游在三处用 defined(__linux__) 判断 GNU 变体，导致 musl 系 libc（OHOS 亦属此类）上：
  #   ① winornix.h 选错实现 → 把 int 返回值当 char* 用，报一串类型错误
  #      （http.cc: no matching constructor for initialization of 'std::string'；
  #        listener.cc/client.cc: no matching conversion from 'int'）
  #   ② pist_strerror_r.h 的声明守卫与 ③ pist_strerror_r.cc 的实现守卫同样不成立
  #      → 即使选到上游自带的 pist_strerror_r，也报 undeclared identifier
  # 三处统一改判 __GLIBC__，语义自洽：非 glibc 平台落到上游自带的 pist_strerror_r 包装
  # （macOS 走的正是该分支），既修正 OHOS 也修正其他 musl Linux 场景，且不引入平台宏。
  - patch_file: "patches/0002-strerror-r-use-glibc-variant-check.patch"
    patch_description: "Detect GNU strerror_r by __GLIBC__ instead of __linux__ (selection, declaration and implementation guards kept consistent)"
    patch_type: "portability"

