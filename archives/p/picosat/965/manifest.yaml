version: "965"
software: "picosat"
status: built
build_date: "2026-09-19"
build_system: "makefile"
conan_ref: "picosat/965"

source:
  url: "https://fmv.jku.at/picosat/picosat-965.tar.gz"
  sha256: "15169b4f28ba8f628f353f6f75a100845cdef4a2244f101a02b6e5a26e46a754"
  tar_format: tar.gz

build:
  system: makefile
  configure_options:
    - "sh ./configure.sh (plus --shared when shared=True, -g for Debug)"
    - "CFLAGS from Conan tools.build:compiler_executables (Release -O2 -DNDEBUG, Debug -g3 -ggdb, plus -fPIC)"
    - "make -j1 CC from Conan conf"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "picosat uses custom configure.sh + makefile.in (lowercase makefile), not autotools/cmake; invoke via sh ./configure.sh for OHOS without /bin/sh exec dependence"
  - "Upstream default TARGETS build libpicosat.a plus picosat/picomcs/picomus/picogcnf CLIs; recipe validates the full build but packages only the library plus header"
  - "Upstream makefile hardcodes ar/ranlib and runs ./mkconfig.sh; build rewrites it to sh ./mkconfig.sh for HMDFS without exec-bit dependence"
  - "Upstream 965 has no tests directory and no check/test make target, so HMBS_UPSTREAM_TEST_RESULT is no_tests with source-tree audit evidence"
