# conandata.yml — pax-utils 1.3.10
#
# 单值带引号的 url：CI 的 replace_url() 只重写这种形式（写成 list 会关掉镜像注入），
# 注释里也不放任何带 scheme 的地址（预下载扫描会把它当源码去抓）。
#
# 端点选 codeload.github.com：真机直连 github.com/archive 会 connect/read 超时
# （2026-09-20 实测两条 ReadTimeout/ConnectTimeout），而 codeload 是 GitHub 官方
# tag 制品端点、可达。两者字节一致（各下载一次，均 148315 B、
# sha256 4ee86899b0cb8b702f443908dc4e9e5e19a2bd870d0520cbae4066658c89df14）。
# 上游没有独立 release 附件，tag archive 即官方制品；tag 名带 v 前缀（不带 v 是 404）。
# codeload 路径没有 .tar.gz 后缀，故 source() 显式传 filename=，否则 conan 误判 zip。

sources:
  url: "https://codeload.github.com/gentoo/pax-utils/tar.gz/refs/tags/v1.3.10"
  sha256: "4ee86899b0cb8b702f443908dc4e9e5e19a2bd870d0520cbae4066658c89df14"

patches:
  - patch_file: "patches/0001-use-portable-interpreter-shebangs.patch"
    patch_description: "OHOS has no /bin/bash and no bare `python` interpreter (bash lives in the harmonybrew prefix, only python3 is on PATH), so execve of these hard-coded shebangs fails with ENOENT — which meson then misreports as the dotest scripts themselves missing. Point the 10 upstream shell/python scripts at /usr/bin/env bash and /usr/bin/env python3."
    patch_type: "portability"
  - patch_file: "patches/0002-security-unshare-sigsys-guard.patch"
    patch_description: "ns_unshare(): unshare(2) does not always fail as an ordinary syscall.  Under a seccomp filter that traps the call (SECCOMP_RET_TRAP) the kernel delivers SIGSYS to the caller instead of returning -1/EPERM, and the default disposition kills the process, so upstream's EPERM-only fallback never sees the failure and every tool dies inside security_init() before doing any work.  Take SIGSYS for the duration of the unshare() calls only and translate a trap into EPERM, the one failure ns_unshare() already degrades into 'no namespaces available'.  Detection is at runtime, so the fallback is neither tied to a specific toolchain macro nor silently skippable; where unshare() succeeds or returns its own errno, behaviour is unchanged."
    patch_type: "portability"
