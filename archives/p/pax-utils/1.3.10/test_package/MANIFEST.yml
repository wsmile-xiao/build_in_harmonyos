# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pax-utils/1.3.10
homepage: "https://github.com/gentoo/pax-utils"

# 上游测试入口：meson 注册的 dotest 套件（.github/workflows/build-test-ci.yml
# 用 `ninja -C build test` 跑同一批用例）。上游没有 make check / ctest。
upstream_check_command: "meson test -C <builddir>  (需 -Dtests=true)"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "meson test -v -C <builddir>  (由 conan.tools.meson.Meson.test() 调用)"

# 上游实际运行的测试程序（-Dtests=true 注册 6 条；-Duse_fuzzing=true 会再加 2 条
# libFuzzer 探针，那不是功能测试，本配方显式关闭）
upstream_tests:
  - file: tests/scanelf/dotest
    source: pax-utils-1.3.10/tests/scanelf/dotest
    description: "scanelf -qsmain -F'%s %f' 的输出与 golden tests/scanelf/scanelf.simple.good 逐字节比对。真机有效用例。"
    command: "meson test scanelf-test"
  - file: tests/pspax/dotest
    source: pax-utils-1.3.10/tests/pspax/dotest
    description: "pspax 跑一遍 /proc，要求 stderr 为空。真机有效用例（直接考验 OHOS procfs 与进程枚举）。"
    command: "meson test pspax-test"
  - file: tests/lddtree/dotest-sh
    source: pax-utils-1.3.10/tests/lddtree/dotest-sh（尾部 include dotest-sfx）
    description: "lddtree.sh /bin/bash | grep -i none 期望空。OHOS 上 /bin/bash 不存在，空输出恰好满足期望 → 该用例在本平台是空跑（上游用例把 /bin/bash 当固定输入的自身局限，非移植引入）。"
    command: "meson test lddtree-sh"
  - file: tests/lddtree/dotest-py
    source: pax-utils-1.3.10/tests/lddtree/dotest-py
    description: "同上，走 lddtree.py；本机 python 无 elftools（pyelftools）模块，报 ModuleNotFoundError 到 stderr 后 stdout 仍空 → 同样空跑。"
    command: "meson test lddtree-py"
  - file: tests/lddtree/dotest-cmp
    source: pax-utils-1.3.10/tests/lddtree/dotest-cmp
    description: "比较 lddtree.py 与 lddtree.sh 对 /bin/bash 的 -l / -l -a 列表输出。两端输入都不存在 → 比的是「两个空文件相同」，成立但无效。"
    command: "meson test lddtree-cmp"
  - file: tests/source/dotest
    source: pax-utils-1.3.10/tests/source/dotest
    description: "源码风格/禁用函数扫描。上游 tests/*/meson.build 只导出 builddir/srcdir/current_srcdir，脚本却用未定义的 top_srcdir，find '' 直接报错、产出空文件，7 条 PASS 全为空跑（上游自身缺陷）。"
    command: "meson test 'source tests'"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_pax_utils.sh
    description: "27 条消费者断言：4 个可执行 + 2 个脚本产物的安装性、三个工具的 -V 版本自证、scanelf 符号解析与 golden 格式、dumpelf 解出 EM_AARCH64(183)、pspax 读 /proc 出 PID 表头、lddtree 解析出 libc.so、递归扫描、打包 LICENSE，另含 2 条负向对照（缺失文件不得产出符号匹配、非 ELF 输入不得解出 ELF 头）防止假绿。"
    command: "sh test_pax_utils.sh <package bin dir> <package folder>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 27
