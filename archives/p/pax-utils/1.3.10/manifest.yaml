# pax-utils 1.3.10 版本级 manifest
# 位置: archives/p/pax-utils/1.3.10/manifest.yaml

version: "1.3.10"
software: "pax-utils"
status: built
build_date: "2026-09-20"
build_system: meson

source:
  url: "https://github.com/gentoo/pax-utils/archive/refs/tags/v1.3.10.tar.gz"
  sha256: "4ee86899b0cb8b702f443908dc4e9e5e19a2bd870d0520cbae4066658c89df14"
  tag: "v1.3.10"
  tar_format: tar.gz

build:
  system: meson
  configure_options:
    - "-Ddefault_library=static"
    - "-Dtests=true"
    - "-Duse_fuzzing=false"
    - "-Duse_libcap=disabled"
    - "-Duse_seccomp=false"
    - "-Dbuild_manpages=disabled"
    - "-Dlddtree_implementation=sh"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "patches/0001-use-portable-interpreter-shebangs.patch"
  - "patches/0002-security-no-namespace-unshare-on-ohos.patch"

knowledge_gained:
  - "conan 2.29.1 的 conan.tools.meson 只导出 Meson 与 MesonToolchain——仓内模板 archives/u/unudhcpd/0.2.1-r2/conanfile.py 里的 `from conan.tools.meson import ... meson_layout` 会直接 ImportError，`meson.compile()` 也不存在（真名 Meson.build()）。用 basic_layout + configure/build/test/install 四件套。"
  - "真机 PATH 上没有 meson（harmonybrew 只给 ninja/python3/bash/git/pkg-config），但 ohpcd 远端确实有 meson/1.11.0、ninja/1.12.1、pkgconf/3.0.5（`conan download <ref> -r=ohpcd --only-recipe` 三条都 rc=0 并打出 revision）→ tool_requires 可用，archives/a/astroterm/1.0.9 记的「远端没有 meson 工具包、必须 vendored」结论已不成立。"
  - "meson.build 用 `vcs_tag(input:'version.h.in', output:'pax_utils_version.h')` 且没写 fallback；GitHub 的 tag archive 没有 .git，但 meson 在 fallback 缺省时自动取 project_version（mesonbuild/interpreter/interpreter.py:2089 `fallback = kwargs['fallback'] or self.project_version`），所以从 tarball 构建无需补丁。"
  - "上游 tests/source/dotest 用 `${top_srcdir}`，而 tests/*/meson.build 只导出 builddir/srcdir/current_srcdir，lib.sh 也不定义 top_srcdir → `find ''` 报错、输出文件为空、testit 判 PASS，这套「源码风格检查」实际是静默空跑（上游自身行为，非本移植引入）。"
  - "scanelf/dumpelf/pspax 的 `-V` 打印 `pax-utils-<VERSION>: <VCSID>`，VERSION 取自 meson.project_version()，是无 git 环境下可靠的版本自证锚点。"
