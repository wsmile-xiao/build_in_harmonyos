# test_package/MANIFEST.yml — perl-class-tiny 1.008
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-class-tiny/1.008
homepage: "https://metacpan.org/pod/Class::Tiny"

# 上游测试套件：t/ 目录 12 个 .t 测试文件（prove -l t/ 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Class-Tiny-1.008/t/*.t
    description: "12 个 .t 测试文件：本地实测 **51/51（100%）**（prove -l t/，10 个运行，零失败）"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Class::Tiny + 类构造/访问器）
test_package_tests:
  - file: test_class_tiny.py
    description: "Loads packaged Class::Tiny via perl -I<lib>, declares a class with a field, and reads the accessor"
    command: "python3 test_class_tiny.py"

# 断言总数：1（类构造/访问器校验）
assertion_count: 1
