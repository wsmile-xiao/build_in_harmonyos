software: pangomm
# 版本级 manifest
# 文件位置: archives/p/pangomm/2.46.5/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

version: "2.46.5"
status: built
build_system: meson
build_date: "2026-10-08"

# Conan 引用
conan_ref: "pangomm/2.46.5@ohpcd/stable"

source:
  url: "https://download.gnome.org/sources/pangomm/2.46/pangomm-2.46.5.tar.xz"
  sha256: "38ca0b050b065de4e3da0c182df657437757063bbf0c4b6c9567ddba019b1d68"
  tar_format: tar.xz

build:
  system: meson
  cc: clang
  cxx: clang++
  configure_options:
    - "default_library=shared"
    - "maintainer-mode=false"
    - "build-documentation=false"
    - "wrap_mode=nodownload"
  dependencies:
    - "glibmm/2.66.9 (glibmm-2.4 旧 ABI 线, sigc++-2.0)"
    - "cairomm/1.14.5.1 (cairomm-1.0 旧 ABI 线, sigc++-2.0)"
    - "pango/1.50.14.1.1 (提供 pangocairo >= 1.45.1)"
    - "libsigc/2.12.1 (override: glibmm 钉 2.10.8 vs cairomm 钉 2.12.1 的 Conan 2 版本冲突归一)"

patches_applied: []

knowledge_gained:
  - "pangomm 2.46.x 是 legacy mm ABI 线末版：pkg-config 名 pangomm-1.4，依赖 glibmm-2.4(2.66.x) + cairomm-1.0(1.14.x) + pangocairo；与 pangomm 2.50/2.56（pangomm-2.48 + glibmm-2.68 + cairomm-1.16/1.18）是两条独立 ABI 线，不能混用"
  - "Conan 2 跨族依赖冲突：glibmm/2.66.9 钉 libsigc/2.10.8，cairomm/1.14.5.1 钉 libsigc/2.12.1，同一图内必须 override；override 改变 package_id 使被覆盖侧（glibmm）无可用预编译 binary，需 --build=missing 重建（CI 同款行为），故 glibmm 源码须可从官方 GNOME 源/源备份缓存获取"
  - "PkgConfigDeps 只写标准 pc 变量，GNOME mm 家族上游 meson 的三类缺口需在 generate() 补齐：get_variable('gmmprocdir') 变量追加、dependency('pangocairo')/('pangoft2') 组件转发 pc、find_library('glibmm_generate_extra_defs-2.4') 的 -L 注入"
  - "OHOS 挂载点禁 symlink（EPERM）：meson install 的 libpangomm-1.4.so / .so.1 链接可能静默缺失，package() 内以 copyfile 物化 SONAME 链（幂等，不改变 Linux CI 的真符号链接行为）"
  - "原生 OHOS 上 meson install 改写 rpath，.so 必须用 binary-sign-tool 重新 codesign 才能被 dlopen（E135）；未签名 .so 在 OHOS 上 dlopen 报 Permission denied"
  - "新增知识草稿：conan 2 override 改被覆盖依赖 package_id → 制品仓 binary 失配 → 源码重建 → 官源不可达时用 core.sources:download_cache + 官方镜像按 sha256 预取兜底（knowledge_ref: DRAFT-24650-conan2-override-dep-rebuild-source-cache-fallback）"

knowledge_refs:
  - "knowledge/drafts/DRAFT-24650-conan2-override-dep-rebuild-source-cache-fallback.kv"
  - "knowledge/drafts/DRAFT-24650-conan2-override-dep-rebuild-source-cache-fallback.md"

upstream_test_pass_rate: "N/A——上游 2.46.5 无自动化测试入口（meson 未注册 test()，tests/Makefile.am 的 SUBDIRS 为空，无 meson.build 入口；用例总数 0）"
