# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pangomm/2.46.5
homepage: "https://gitlab.gnome.org/GNOME/pangomm"

# ── R51 上游测试三步法：清点 → 运行 → 如实回填 ──────────────────────
# pangomm 2.46.5 **上游没有自动化测试入口**，证据（清点结论，非静默跳过）：
#   1. 源码树全部 meson.build（根 / pango/ / pango/pangomm/ /
#      tools/extra_defs_gen/ / MSVC_NMake/ / docs/reference/，共 7 个）
#      grep 'test(' 零命中 —— meson 未注册任何 test()；
#   2. meson_options.txt 无 build-tests / tests 选项
#      （选项全集：maintainer-mode / warnings / dist-warnings /
#       build-deprecated-api / build-documentation / msvc14x-parallel-installable）；
#   3. tests/ 目录仅含 autotools Makefile.am，内容为 'SUBDIRS ='（空壳），
#      无 meson.build 入口、无任何测试源文件；
#   4. 上游 CI（gitlab.gnome.org GNOME/pangomm）无独立可复用测试套件。
# 结论：上游测试用例总数 = 0（不存在），不存在"因 HarmonyOS 平台限制被跳过"
#       的上游测试；运行命令不存在，故 upstream_test_command 为空。
upstream_check_command: "grep -rn 'test(' --include=meson.build . ; cat tests/Makefile.am ; cat meson_options.txt"
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（pangomm 2.46.5 meson 未注册测试；0 个）
upstream_tests: []

# ── test_package 自带测试（消费者视角 + 鸿蒙特有，均真实编译/链接/运行）──
test_package_tests:
  - file: test.cpp
    description: "消费者 L1 测试（4 条断言）：Pango::init() + FontDescription::get_family/get_size + AttrList::change() 插入 AttrInt 后迭代器段数 + PANGOMM_MAJOR_VERSION（真实编译链接运行）"
    command: "./test_probe"
    assertions: 4
  - file: test_ohos.sh
    description: "鸿蒙特有测试（14 条断言）：平台身份(HarmonyOS/aarch64)、SONAME 链物化(.so/.so.1/.so.1.0.30，OHOS 禁 symlink)、ELF64/AArch64/DYN、SONAME、.note.ohos.ident、.codesign 签名段、完整 7 项 DT_NEEDED、无 glibc 专有 NEEDED、无指向系统库目录的 RUNPATH/RPATH(R26，输出实测观测值)、开发头文件、pangomm-1.4.pc 版本/Requires、运行时 dlopen 探针(RTLD_NOW+dlsym+Pango::init()，校验其断言数≥5)、包载荷完整；末尾自校验 PASS 计数 == 14"
    command: "bash test_ohos.sh <package_folder> <test_ohos_probe>"
    assertions: 14
  - file: test_ohos.cpp
    description: "鸿蒙运行时探针：不链接 libpangomm-1.4，运行时 dlopen(\"libpangomm-1.4.so.1\", RTLD_NOW|RTLD_GLOBAL) + dlsym(Pango::init / FontDescription ctor / get_family) + dladdr 镜像路径校验 + 真实调用 Pango::init() + 阴性对照（对不存在符号 dlsym 必报错）；由 test_ohos.sh 断言 13 执行，共 7 条子断言"
    command: "./test_ohos_probe <package_folder>"
    assertions: 7

# 测试断言总数 = 消费者 4 + 鸿蒙特有 14 + 探针子断言 7（探针由 test_ohos.sh 断言 13 调用）
assertion_count: 25

# 其中鸿蒙平台特有测试用例数（ELF/ABI、OHOS 签名段、SONAME 物化、加载器 dlopen、
# 依赖链可解析性、系统库隔离、阴性对照等）= 14 + 7
ohos_specific_assertions: 21
