# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pangomm/2.56.2
homepage: "https://gitlab.gnome.org/GNOME/pangomm"

# 上游测试命令 (meson test)
# pangomm 2.56.2 无任何可执行的上游测试（非静默跳过，证据如下）：
#   1. 全部 meson.build（根/pango/pangomm/tools/extra_defs_gen/docs）grep test( 零注册；
#   2. meson_options.txt 无 build-tests 选项；
#   3. tests/ 仅含 autotools Makefile.am 且 SUBDIRS 为空（空壳），
#      无 meson.build 入口 → meson test 无事可做。
# 与 2.50.1 结论一致；测试体系由 meson 构建系统承载，故无法单独运行。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (pangomm 2.56.2 meson 无注册测试；0 个)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.cpp
    description: "消费者测试：Pango::init + FontDescription + AttrList 声明 + 版本宏（真实编译链接运行）"
    command: "./test_probe"

# 测试断言总数（test.cpp 中 check 调用：FontDescription::get_family、
# FontDescription::get_size、AttrList 默认构造为空（get_iter().next() == false，
# 真实可失败断言）、PANGOMM_MAJOR_VERSION 共 4 项；4 项均无恒真/兜底逻辑）
assertion_count: 4
