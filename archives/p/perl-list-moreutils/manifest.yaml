software: perl-list-moreutils
description: "Perl module providing additional list utilities beyond List::Util"
category: perl
license: GPL-1.0-or-later OR Artistic-1.0

# 版本索引
versions:
  - version: "0.430-r1"
    status: built
    build_date: "2026-06-15"
    features:
      - pure_perl: true
      - xs_available: false  # 需管理员安装 perl-list-moreutils-xs
    notes: "纯 Perl 模式功能完整，XS 加速模块因 SELinux 限制需管理员安装"

# 依赖关系
dependencies:
  required:
    - perl/5.42.0
  optional:
    - perl-list-moreutils-xs/0.430-r6  # XS 加速模块

# 功能列表
provides:
  - junction: [any, all, none, notall, one]
  - counting: [true, false]
  - indexing: [firstidx, lastidx, onlyidx, insert_after, insert_after_string]
  - retrieval: [firstval, lastval, onlyval, firstres, lastres, onlyres]
  - array_ops: [uniq, minmax, part, mesh, zip6]
  - search: [bsearch, bsearchidx, binsert, bremove]
  - pair_ops: [pairwise, natatime, each_array, each_arrayref]
  - sorting: [sort_by, nsort_by]
  - misc: [apply, after, after_incl, before, before_incl]