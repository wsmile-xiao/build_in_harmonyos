# 软件级 manifest — ptunnel
# 文件位置: archives/p/ptunnel/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

software: ptunnel
display: "ptunnel"
description: "Tunnel TCP connections over ICMP echo request/reply (ping) packets"
category: network
homepage: "https://www.cs.uit.no/~daniels/PingTunnel/"
license: BSD-3-Clause

build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 单二进制工具（无 configure），CC=gcc 硬编码：make CC=<clang>（命令行变量优先）即可构建；pcap 头路径注入 CFLAGS、库路径注入 LDOPTS（该 Makefile 编译/链接规则只用 CFLAGS/LDOPTS）"
    - "依赖 libpcap/1.10.6（-lpcap）：CPPFLAGS 注入其 include 与 include/pcap 目录（ptunnel 用 <pcap.h>），LDFLAGS 注入其 lib 目录"
    - "上游无测试目标，test_package 以 -h 冒烟验证（Usage 横幅 + 非零退出）"
    - "完整隧穿需 root + 抓包设备 + 实时 ICMP，构建沙箱不可运行"
  common_dependencies:
    - libpcap

versions:
  "0.72":
    status: built
    build_date: "2026-10-07"
    conan_ref: "ptunnel/0.72"
