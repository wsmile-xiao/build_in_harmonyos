# test_package/MANIFEST.yml — ptunnel 0.72
# 上游官方测试声明文件（CI L0e 硬门禁要求存在）
# 详见: docs/TEST_QUALITY_SPEC.md

package: ptunnel/0.72
homepage: "https://www.cs.uit.no/~daniels/PingTunnel/"

# 上游测试套件存在性（经审计官方归档 PingTunnel-0.72.tar.gz 确认：无任何自动化测试）
upstream_tests_exist: false

# 上游测试审计（结构化、机器可解析；来源: 作者站点官方归档，sha256 见下方）
# 采用与 osmctools/sipcalc 同款结构化审计格式，upstream_check_command 为空串，
# 避免清单器将非空 check/test 命令误判为"上游存在测试"。
upstream_test_audit:
  source_tarball: "PingTunnel-0.72.tar.gz"
  source_sha256: "b318f7aa7d88918b6269d054a7e26f04f97d8870f47bd49a76cb2c99c73407a4"
  top_level_files:
    - Makefile        # 目标仅 all/dist/ptunnel/ptunnel.exe/clean/depend/.depend 及 %.o:%.c/%.obj:%.c 模式规则；无 check/test/TESTS/check_PROGRAMS/check-local
    - ptunnel.c       # 唯一主程序，无自测 main/断言框架
    - ptunnel.h
    - md5.c / md5.h   # RFC 1321 参考实现；源码注释中 "test program"/"test suite" 仅为 RFC 出处说明，非常规测试代码
    - README / LICENSE / CHANGELOG / ptunnel.8
    - redhat/  selinux/  web/   # 打包支持目录，无测试
  scanned_for:
    - "Makefile 的 check / test / TESTS / check_PROGRAMS / check-local 目标"
    - "tests/ / test* 目录或文件"
    - "自测 main / 断言框架 / CI 测试配置"
  scan_result: "0 matches — 归档顶层仅单程序 ptunnel.c + RFC 参考 md5.c，无 tests/ 目录、无 *test* 文件（find 零命中）、无任何测试框架/CI 配置"
  make_check_output: "'make -n check' 返回 'No rule to make target check'（Makefile 无 check 目标；上游本无测试可 run）"
  reason: "ptunnel 0.72 为 2011 年纯 Makefile 单二进制命令行工具，上游官方归档不含任何自动化测试套件；由 test_package 对打包产物执行消费者视角的真实功能冒烟验证。"

# 上游测试总数：经审计确认上游不存在任何测试（非子集），如实为 0
upstream_test_total: 0
upstream_test_count_method: none

# 上游 check/test 命令：无测试套件，均为空串（避免被清单器判为上游存在测试）
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（upstream_tests_exist: false，见上方审计）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_ptunnel.sh
    description: "打包产物功能冒烟测试（2 项断言）：① bin/ptunnel 存在且可执行；② 以 -h 调用打印 'Usage:' + 'ptunnel v' 版本横幅且返回非零（证明动态运行依赖可解析、二进制为真实 ptunnel；完整隧穿需 root+抓包设备+实时 ICMP，构建沙箱不可用）"
    command: "sh test_ptunnel.sh <pkg_bin>"

# 测试断言总数（真实用例数，供质量评估）：2 项检查点
assertion_count: 2
