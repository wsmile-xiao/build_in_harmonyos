# conandata.yml — ptunnel 0.72
# Ping Tunnel：利用 ICMP echo request/reply（ping）报文把 TCP 连接可靠地隧穿
# 到远端主机的命令行工具（客户端 + 代理双模式，单二进制）。
# 官方源：作者站点 https://www.cs.uit.no/~daniels/PingTunnel/ 的发布归档
# （非 GitHub，无 tag 归档；R39 权威官方源即作者站点）。
# sha256 于 2026-10-07 对官方归档 PingTunnel-0.72.tar.gz 计算。
# tar 顶层目录为 PingTunnel/，含 ptunnel.c/ptunnel.h/md5.c/md5.h/Makefile/
# README/LICENSE/CHANGELOG/ptunnel.8 及 redhat/selinux/web 打包支持子目录。

sources:
  url: "https://www.cs.uit.no/~daniels/PingTunnel/PingTunnel-0.72.tar.gz"
  sha256: "b318f7aa7d88918b6269d054a7e26f04f97d8870f47bd49a76cb2c99c73407a4"

patches:
  - patch_file: "patches/0001-ptunnel.h-sys-unistd.patch"
