version: "0.72"

# 编译状态
# published | built | failed | archived
# 本文件为前置适配阶段产物：配方已就绪，真机 conan create 验证通过后
# 由 ohc-run.py finish 更新为最终状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-10-07"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://www.cs.uit.no/~daniels/PingTunnel/PingTunnel-0.72.tar.gz"
  sha256: "b318f7aa7d88918b6269d054a7e26f04f97d8870f47bd49a76cb2c99c73407a4"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  configure_options: []
  dependencies:
    - libpcap/1.10.6   # 链接 -lpcap（ptunnel 核心抓包依赖）
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []
# 暂无补丁（当前配方为纯 Makefile + libpcap 前向适配，可能按真机预检补齐）

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游为 2011 年纯 Makefile 单二进制工具，CC 硬编码 gcc：以 make CC=clang（命令行变量优先）适配；ptunnel Makefile 编译规则用 CFLAGS、链接规则用 LDOPTS（从不引用 CPPFLAGS/LDFLAGS），故 pcap 头路径注入 CFLAGS、库路径注入 LDOPTS"
  - "ptunnel.h 以 <pcap.h> 引入 libpcap；libpcap 头安装于 include/pcap/pcap.h，需同时 -Iinclude 与 -Iinclude/pcap 令 <pcap.h> 解析"
  - "上游无任何测试目标（Makefile 仅 all/dist/ptunnel/clean/depend/install），test_package 以 -h 冒烟验证（usage 横幅 + 非零退出）"
  - "完整运行需 root + 抓包设备 + 实时 ICMP，构建沙箱不可用，功能验证限于二进制存在与 usage 行为"
