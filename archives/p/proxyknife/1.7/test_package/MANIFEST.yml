# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: proxyknife/1.7
homepage: "https://www.gnu.org/software/proxyknife/"

# 上游测试清点 (R51): proxyknife 1.7 源码树无任何测试资产 —— 无 tests/
# 目录、无 *.c 测试文件、无 dejagnu/autotest 注册; Makefile.in 由 automake
# 生成, 含空的 `check` 目标但未注册任何测试 (make check 无操作)。
# 上游静态用例总数: 0。
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序: 无 (上游无自动化测试)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_proxyknife.py
    description: "消费者测试: 运行打包后的 proxyknife 工具, 断言 --version 横幅、--help 用法输出与未知选项非零退出"
    command: "python3 test_proxyknife.py <bindir>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 3
