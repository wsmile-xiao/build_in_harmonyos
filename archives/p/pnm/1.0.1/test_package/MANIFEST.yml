package: pnm/1.0.1
homepage: "https://github.com/ToruNiina/pnm"
upstream_check_command: "cmake -S . -B build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 && cmake --build build -j2"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build/test --output-on-failure"
