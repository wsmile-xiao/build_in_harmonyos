    count: 10
test_package_tests:
  - file: test_package/test.cpp
    description: "消费者通过 pnm::write/read 验证 RGB PPM 二进制图像往返"
    count: 1
upstream_test_count: 10
test_package_test_count: 1
upstream_assertion_count: 1263
consumer_assertion_count: 4
assertion_count: 1267
