software: perl-net-snpp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.17-r7/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.17-r7"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/T/TO/TOBEYA/Net-SNPP-1.17.tar.gz"

  # 源码校验和
  sha256: "06b851d64596625e866359fb017dd0d08973e0ebc50c323f4a1d50ecdd868e76"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Net::SNPP 是纯 Perl 模块，使用 ExtUtils::MakeMaker 构建，无需 C/XS 编译"
  - "纯 Perl 模块在 HMDFS 上不受 SELinux 限制，可直接通过 PERL5LIB 加载"
  - "Net::SNPP::Server->new() 需要绑定端口，受 SELinux HMDFS 限制（与 perl-dbd-pg 相同的平台限制）"
  - "Net::SNPP 继承自 Net::Cmd 和 IO::Socket::INET，系统 Perl 5.42.0 自带 Net::Cmd v3.15"
  - "Conan 配方中 package_info() 应设置 PERL5LIB 环境变量而非 cpp_info.libs"
