software: perl-net-snpp
display: "Net::SNPP"
description: "Simple Network Pager Protocol (RFC 1861) client and server Perl module"
category: network
homepage: "https://metacpan.org/dist/Net-SNPP"
license: MIT
build_system: custom               # ExtUtils::MakeMaker (perl Makefile.PL)

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C/XS 编译，无需平台适配补丁"
    - "不受 SELinux HMDFS 限制，可通过 PERL5LIB 直接加载"
    - "依赖系统 Perl 自带的 Net::Cmd (libnet)"
  common_dependencies:
    - perl

# 版本索引（所有已归档版本，含状态）
versions:
  "1.17-r7":
    status: built
    build_date: "2026-06-26"
    conan_ref: "perl-net-snpp/1.17-r7@ohpcd/stable"
