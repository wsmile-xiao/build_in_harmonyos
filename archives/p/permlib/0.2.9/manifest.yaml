# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "header-only 包的接口依赖必须按**组件**传递：boost 配方声明 components 后，包级目标 boost::boost 的 include 目录为空，只有 Boost::headers 带 include ⇒ 配方要写 cpp_info.requires = [\"boost::headers\"]，只写 transitive_headers=True 会让消费者编译期 file not found（先例 liborigin2/20110117）"  # knowledge_ref: E629
  - "Boost 1.90 起 boost::next()/prior() 不再由 boost/utility.hpp 等头间接引入：permlib 这类 2011 年 C++98 库的 4 个使用点必须显式 #include <boost/next_prior.hpp>，否则模板实例化深处报 no member named 'next' in namespace 'boost'"  # knowledge_ref: E629
  - "上游 abstract_bsgs.h 的 setStabilizer() 调用了未声明的『已算好 support』构造重载（模板方法不被实例化时不报错）⇒ 补语义等价重载；这类上游死代码路径只有真正编译全部上游用例才会暴露"  # knowledge_ref: E629
  - "上游 test/CMakeLists.txt 用 legacy 变量 ${Boost_UNIT_TEST_FRAMEWORK_LIBRARY} 链接 Boost.Test，与 Conan 生成的 BoostConfig（只有 imported target）不兼容 ⇒ header-only 包的测试驱动应以配方自带 files/CMakeLists.txt 构建同一批上游源文件，避免 find_package 命中设备里其它 Boost 配置造成假绿"  # knowledge_ref: E629
