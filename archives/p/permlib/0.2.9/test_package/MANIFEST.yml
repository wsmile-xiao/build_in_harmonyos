# test_package/MANIFEST.yml — permlib 0.2.9
# 上游官方测试声明（CI 的 L0e 门禁要求此文件存在；conan-verify G1 同时校验）
# 计数口径：上游以 **Boost.Test test case** 为单位（= BOOST_AUTO_TEST_CASE 宏数
# = 运行时 "Running N test cases" 之和 = 59）；13 个 ctest 可执行文件是承载它们的
# 另一单位，断言级宏（BOOST_CHECK*/BOOST_REQUIRE* 系列）330 个是第三种单位——三者不得混用，故分别列出。

package: permlib/0.2.9
homepage: "https://github.com/tremlin/PermLib"

# 上游测试入口（上游自带的 test/CMakeLists.txt 用 legacy 变量
# ${Boost_UNIT_TEST_FRAMEWORK_LIBRARY} 链接 Boost.Test，与 Conan 生成的
# BoostConfig.cmake（只有 imported target）不兼容；因此配方用自带的
# files/CMakeLists.txt 构建**同一批**上游源文件并注册 ctest，上游文件未改）
upstream_check_command: "ctest --output-on-failure -j2"

# 上游测试已集成进 conanfile.py 的 build()（编译 + 真实执行）
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure -j2"

# 上游测试规模（三行分属三个单位，勿相加）
upstream_test_case_count: 59
upstream_test_executable_count: 13
upstream_assertion_macro_count: 330

upstream_passed: 59
upstream_failed: 0
upstream_skipped: 0
upstream_not_run: 0

# 上游用例源文件（13 个 Boost.Test 可执行文件 + 3 个共享头；语料 data/ 共 39 个文件 = 37 个 G_* + 2 个 .pl）
upstream_test_sources:
  - test/test-base.cpp
  - test/test-trans.cpp
  - test/test-generators.cpp
  - test/test-partition.cpp
  - test/test-permutation.cpp
  - test/test-search-setstabilizer.cpp
  - test/test-symmetric-group.cpp
  - test/test-search-matrixauto.cpp
  - test/test-orbit-lex-min.cpp
  - test/test-api.cpp
  - test/test-test.cpp
  - test/test-export.cpp
  - test/test-abstract-groups.cpp
  - test/test-common.h
  - test/group_data.h
  - test/group_reader.h

# test_package 中自带的测试（消费者视角验证，鸿蒙特有测试）
test_files:
  - path: "test_package/test.cpp"
    test_type: "R34"
    assertion_count: 18
    description: >-
      Real consumer of the installed headers: find_package(permlib CONFIG) +
      permlib::permlib, no boost path written by the consumer (boost::headers is
      propagated by permlib's cpp_info.requires). 18 assertions whose references
      are computed independently in the test itself (closed forms 10! and 4!*6!,
      a self-written BFS brute force for S_4, and the SymmetricGroup transversal
      product). Run twice: conanrun and bare env (env -u LD_LIBRARY_PATH).

test_package_test_count: 1
consumer_assertion_count: 18
assertion_count: 18
