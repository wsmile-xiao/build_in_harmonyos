# Conan source data for permlib 0.2.9.
#
# 上游官方源：GitHub 官方仓库（作者 Thomas Rehn）tremlin/PermLib 的 v0.2.9 tag 归档。
# v0.2.9 是轻量 tag，指向 master 提交 2b4e468e24a059e3659bc095293df0cd363a22f5；
# tarball 由 GitHub 官方归档端点生成，sha256 为下面这一条（本地两次独立下载一致）。
sources:
  url: "https://github.com/tremlin/PermLib/archive/refs/tags/v0.2.9.tar.gz"
  sha256: "40b9c03df57d73412d75ee4098937706d95e252b4f40d091cc13633a0c56d20e"

# 两个逻辑改动，按文件拆分（refresh-patch --auto 的 per-file 形态）：
#   0002–0005：Boost 1.90 不再经其它头间接提供 boost::next() 声明，补 <boost/next_prior.hpp>；
#   0001     ：上游 AbstractBSGS 缺「用已算好的 support 构造」的重载（setStabilizer() 一直在调它）。
# 补丁内不含任何平台宏（无 __OHOS__ / 平台分支），对任意平台都是同一份修正。
patches:
  "0.2.9":
    - patch_file: "patches/0001-include-permlib-abstract_bsgs.h.patch"
      patch_description: "补上 AbstractBSGS 缺失的 support 构造重载：setStabilizer() 传入的是已算好的 support（boost::shared_ptr<std::set<dom_int> >），而上游只声明了 bool computeSupport 版本，模板实例化必然失败（上游潜在缺陷，非平台差异）"
      patch_type: "portability"
    - patch_file: "patches/0002-include-permlib-bsgs.h.patch"
      patch_description: "bsgs.h 显式 #include <boost/next_prior.hpp>：Boost 1.90 起 boost::next() 不再由 boost/utility.hpp 等头间接引入，缺声明导致多处实例化报错"
      patch_type: "portability"
    - patch_file: "patches/0003-include-permlib-change-base_transpose.h.patch"
      patch_description: "change/base_transpose.h 显式 #include <boost/next_prior.hpp>（boost::next 使用点，同上）"
      patch_type: "portability"
    - patch_file: "patches/0004-include-permlib-generator-schreier_generator.h.patch"
      patch_description: "generator/schreier_generator.h 显式 #include <boost/next_prior.hpp>（boost::next 使用点，同上）"
      patch_type: "portability"
    - patch_file: "patches/0005-include-permlib-test-primitivity_sgs_test.h.patch"
      patch_description: "test/primitivity_sgs_test.h 显式 #include <boost/next_prior.hpp>（boost::next 使用点，同上）"
      patch_type: "portability"
