# 软件级 manifest — permlib
# 文件位置: archives/p/permlib/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: "permlib"
display: "PermLib"
description: "C++ header-only template library for permutation computations (BSGS data structures, orbits/stabilizers, set image and lexicographically minimal set search)"
category: library
homepage: "https://github.com/tremlin/PermLib"
license: BSD-3-Clause
build_system: cmake

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯头文件库（header-only）：包内只有 include/permlib/** 的 84 个公共头 + LICENSE，没有 .a/.so，也没有可执行产物；验证靠真实消费者编译+运行与上游 Boost.Test 套件（见版本目录 test_package/ 与 notes.md）"
    - "公共头直接 #include <boost/...>（84 个头里 47 个）⇒ boost 是**接口依赖**：配方 requires(\"boost/1.90.0.4.1\") + cpp_info.requires = [\"boost::headers\"]。必须写组件级目标——boost 配方声明了 components 之后，包级 boost::boost 的 include 目录为空，只传包级目标会让消费者编译期找不到 boost 头（先例 archives/l/liborigin2/20110117）"
    - "Boost 1.90 起 boost::next() 的声明不再由 boost/utility.hpp 等头间接引入 ⇒ 4 个使用点补 <boost/next_prior.hpp>（补丁不含任何平台宏）"
    - "上游 abstract_bsgs.h 的 setStabilizer() 调用了未声明的「已算好 support」构造重载 ⇒ 补一个语义等价的构造重载（上游潜在缺陷，与平台无关）"
    - "上游自带 CMakeLists 用 legacy 变量 ${Boost_UNIT_TEST_FRAMEWORK_LIBRARY} 链接 Boost.Test；Conan 生成的 BoostConfig.cmake 只有 imported target ⇒ 测试驱动改用配方自带 files/CMakeLists.txt（上游源文件一字未改）"
  common_dependencies:
    - boost

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.2.9":
    status: built
    build_date: "2026-09-20"
    conan_ref: "permlib/0.2.9"
