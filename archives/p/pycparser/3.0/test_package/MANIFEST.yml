# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pycparser/3.0
homepage: "https://github.com/eliben/pycparser"

# 上游测试命令 — pytest（tests/ 目录，tests/__init__.py 存在故支持包内相对导入）
upstream_check_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest tests -q"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python3 -m pytest tests -q --assert=plain -p no:cacheprovider"

# 上游实际运行的测试程序（2026-09-16 实测记录）：
# - tests/ 目录 7 个测试文件：test_c_ast / test_c_generator / test_c_lexer /
#   test_c_parser / test_examples / test_general / test_util
# - 其中 test_c_generator 与 test_general 部分用例 `use_cpp=True`，需外部 cpp
#   （tests/test_util.py 提供 cpp_supported() 探测）；若构建机无 cpp，
#   上游自身的 skipif 会跳过这些用例
# - 纯 Python 包（3.0 已移除 ply 依赖），无 C 扩展需编译
upstream_tests:
  - file: tests/
    source: pycparser-3.0/tests/
    description: "上游 pytest 套件（7 个测试文件）；test_c_generator / test_general 中 use_cpp=True 的用例需外部 cpp，由上游 cpp_supported() 探测决定跳过"
    command: "PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 PYTHONPATH=. python3 -m pytest tests -q --assert=plain -p no:cacheprovider"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_pycparser.py
    description: >-
      消费者测试：真实 API（R34）——用 CParser() 解析一段真实 C 源码
      （typedef + static 函数 + main），断言 FileAST 结构与顶层声明种类、
      定位 FuncDef（add/main）并校验 static 存储类、遍历函数体的
      Compound/Return/BinaryOp 节点、用 CGenerator 回生成 C 代码并比对关键字，
      最后验证畸形输入抛 ParseError。另固化两个上游事实：
      __version__ 为 "3.00"（与发行版 3.0 不一致）、__all__ 为三模块名。
    command: "python3 test_pycparser.py <site-packages-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 22
