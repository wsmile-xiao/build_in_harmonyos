software: perl-provide
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.03/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.03"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/B/BE/BELDEN/provide-0.03.tar.gz"

  # 源码校验和
  sha256: "565c8a5e4b09e6724bf8a2df33a4364e98c05dd7d2835821457a2f787cfe2446"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALLDIRS=site"

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块使用 ExtUtils::MakeMaker (Makefile.PL) 构建，conanfile.py build() 应直接调用 perl Makefile.PL + make"
  - "package() 需使用 glob 递归查找 .pm 文件并映射到 lib/perl5 目录，处理 site_perl 路径"
  - "package_info() 应设置 cpp_info.libs=[] 和 runenv_info PERL5LIB，符合纯 Perl 模块的 Conan 规范"
  - "test_package 需设置 PERL5LIB 环境变量指向 Conan 包的 .pm 文件目录"
  - "use provide 必须带 if/elsif/else 参数，无参数会 die；test_package 应使用 require 加载模块"
