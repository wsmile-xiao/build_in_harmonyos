# test_package/MANIFEST.yml
package: procenv/0.51
homepage: https://github.com/jamesodhunt/procenv

upstream_tests_exist: true
upstream_test_audit: "automake TESTS = tests/show_machine_details（shell）、check_pr_list（libcheck，7 个 START_TEST 用例，取数 grep -c START_TEST src/tests/check_pr_list.c = 7）、check_all_args（shell）、procenv（无参数全量 dump）"
upstream_check_command: "make check（配方 build() 中执行，见 conanfile.py）"
upstream_test_in_build: true
upstream_test_command: "make check TESTS=\"tests/show_machine_details check_pr_list check_all_args\""
upstream_test_count: 4
upstream_tests_ran: 3
upstream_tests_passed: 3
upstream_tests_note: "check_pr_list 的 7 个 libcheck 用例已实跑通过：100%: Checks: 7, Failures: 0, Errors: 0。关键：libcheck 选临时目录的顺序是 TEMP > P_tmpdir(编译期 \"/tmp\") > TMPDIR > \".\"，P_tmpdir 优先于 TMPDIR，而 OHOS 的 /tmp 只读，所以必须在 build() 里设置 TEMP 指向可写目录（仅设 TMPDIR 无效）。"
upstream_tests_excluded:
  - test: procenv (no arguments)
    reason: "无参数全量 dump 在 OHOS 上忙等挂起（-b/--libs 与 -i/--misc 两节自旋，持 AF_INET socket）；已用 timeout 3 procenv -b / -i 复现。配方从 make check 的 TESTS 中排除该项，并以 timeout 15 实跑记录退出码（124）；其余 3 项上游测试全部实跑通过。"

test_package_tests:
  - file: test_procenv.sh
    description: "消费者侧真实执行安装后的 bin/procenv：--version（含 0.51）、--format=json --uname（JSON）、--format=xml --sysconf（含 <procenv）、--limits、--environment（含 PATH），共 5 项断言"
    command: "conan test test_package procenv/0.51（test() 中传 PROCENV_BIN 并 self.run 执行该脚本）"

test_package_test_count: 1
consumer_assertion_count: 5
assertion_count: 5
