sources:
  url:
    - "https://codeload.github.com/jamesodhunt/procenv/tar.gz/refs/tags/0.51"
    - "https://github.com/jamesodhunt/procenv/archive/refs/tags/0.51.tar.gz"
  filename: "procenv-0.51.tar.gz"
  sha256: "b831c14729e06a285cc13eba095817ce3b6d0ddf484b1264951b03ee4fe25bc9"

patches:
  - patch_file: "patches/0001-configure-relax-umask-for-hmdfs.patch"
    patch_description: "Relax autoconf temp-dir umask 077 -> 022 so config.status can create files on HMDFS (E011)"
    patch_type: "portability"
  - patch_file: "patches/0002-check-all-args-honour-TMPDIR.patch"
    patch_description: "Upstream test script check_all_args hardcodes /tmp (read-only on OHOS); honour TMPDIR when set"
    patch_type: "portability"
  - patch_file: "patches/0003-platform-headers-ohos-portability.patch"
    patch_description: "Include <sys/sysmacros.h> for major/minor on musl; guard <linux/if.h> against sockaddr_storage redefinition (E091); guard pthread_getconcurrency (glibc extension) usage"
    patch_type: "portability"
  - patch_file: "patches/0004-src-makefile-precise-werror-relax.patch"
    patch_description: "Precisely relax -Werror for -Wunused-but-set-variable only (P007), not a blanket -Wno-error"
    patch_type: "portability"
  - patch_file: "patches/0005-platform-linux-affinity-musl.patch"
    patch_description: "musl/OHOS lacks pthread_getaffinity_np; fall back to sched_getaffinity(0, ...) on non-glibc"
    patch_type: "portability"
  - patch_file: "patches/0006-getpwuid-tolerate-missing-uid.patch"
    patch_description: "OHOS does not populate /etc/passwd for its numeric uids; report user details as unknown instead of aborting"
    patch_type: "portability"
  - patch_file: "patches/0007-check-all-args-skip-without-groff.patch"
    patch_description: "Upstream test check_all_args renders the man page with groff; skip the man-page option cross-check when groff is unavailable (OHOS)"
    patch_type: "portability"
