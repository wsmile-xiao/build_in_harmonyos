knowledge_gained:
  - "OHOS 自带 <sys/capability.h> 只有 48 行、是裁剪内核头，不含 libcap API（cap_t/cap_get_proc/CAP_*）；AC_CHECK_HEADERS 会误通过 → 用 ac_cv_header_sys_capability_h=no 关闭"
  - "musl 下 major()/minor() 需要 <sys/sysmacros.h>；代码若只在 __GLIBC__ 时包含会编译失败"
  - "OHOS 的 /etc/passwd 只有 root/bin/system，进程 uid 查不到 → getpwuid() NULL+errno 0，需降级为'未知用户'"
  - "libcheck 选临时目录的顺序为 TEMP > P_tmpdir(编译期 \"/tmp\") > TMPDIR > \".\"：P_tmpdir 优先于 TMPDIR，OHOS 的 /tmp 只读 → 必须设 TEMP 指向可写目录，check_pr_list 才能跑（7/7）"
  - "procenv 的 -b/--libs 与 -i/--misc 在 OHOS 上忙等自旋（持 AF_INET socket）；无参数全量 dump 因此挂起"
