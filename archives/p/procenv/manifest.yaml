software: procenv
display: "procenv"
description: "转储进程与系统环境属性（进程、CPU、内存、limits、sysconf、网络接口、能力等）的平台能力探测工具"
category: tool
homepage: "https://github.com/jamesodhunt/procenv"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "autotools；configure 预生成且 config.guess 不认 HarmonyOS → 显式 --build/--host=aarch64-unknown-linux-ohos（E007）"
    - "autoconf 的 config.status 用 umask 077 建临时目录，HMDFS 上不可用 → 补丁放宽为 022（E011）"
    - "OHOS 的 <sys/capability.h> 是裁剪内核头、无 libcap API → ac_cv_header_sys_capability_h=no"
    - "musl 差异：major/minor 需 <sys/sysmacros.h>；无 pthread_getconcurrency、pthread_getaffinity_np（退回 sched_getaffinity）"
    - "OHOS /etc/passwd 不含进程 uid → getpwuid 失败需降级为'未知用户'"
    - "上游测试：show_machine_details / check_all_args 通过；check_pr_list（libcheck IPC）与无参数全量 dump（-b/-i 忙等）为平台限制，已如实记录（见 notes.md）"
  common_dependencies:
    - check

versions:
  "0.51":
    status: built
    build_date: "2026-09-16"
    conan_ref: "procenv/0.51"
