software: perl-mime-tools
display: "MIME::Tools - Perl MIME 消息处理工具包"
description: "MIME-tools 是一组用于创建、解析和处理 MIME 格式邮件消息的 Perl 模块集合，支持 multipart、附件、编码转换等功能"
category: perl
homepage: "https://metacpan.org/dist/MIME-tools"
repository: "https://github.com/DianneSkoll/MIME-tools"
license: GPL-1.0-or-later 或 Artistic-1.0
build_system: perl

ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 C 编译，无 XS 组件"
    - "使用 Module::Install 构建系统（inc::Module::Install）"
    - "首次打包遗漏了 MIME::Decoder::Base64.pm，已修复"
    - "所有依赖模块（Mail::Header, Mail::Internet, MIME::Base64 等）在 OpenHarmony 上可用"
  common_dependencies:
    - perl-mailtools
    - perl-mime-base64

versions:
  "5.515":
    status: built
    build_date: "2026-06-17"
    published_as: perl-mime-tools
    source_url: "https://cpan.metacpan.org/authors/id/D/DS/DSKOLL/MIME-tools-5.515.tar.gz"
