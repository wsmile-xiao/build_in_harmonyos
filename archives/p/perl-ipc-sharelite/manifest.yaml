software: perl-ipc-sharelite
display: "IPC::ShareLite"
description: "Perl module for lightweight SysV shared memory segments"
category: system

homepage: "https://metacpan.org/pod/IPC::ShareLite"
license: Artistic-1.0-Perl OR GPL-1.0-or-later

build_system: perl

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "Perl XS 模块需要修改 Makefile.PL 添加 musl 头文件和库路径"
    - "LDDLFLAGS 参数需要包含 -L 和 -B 选项指定 musl 库路径"
    - "XS 模块（.so）在 HMDFS 上受 SELinux 限制无法加载，需管理员安装"
    - "依赖 SysV IPC（共享内存和信号量），鸿蒙系统已完整支持"
  common_dependencies:
    - perl
    - musl

# 版本索引
versions:
  "0.17-r14":
    status: built
    build_date: "2026-06-12"
    notes: "编译成功，功能测试受限（SELinux HMDFS）"