software: perl-ipc-sharelite
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/0.17-r14/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.17-r14"

# 编译状态
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/A/AN/ANDYA/IPC-ShareLite-0.17.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: perl
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"
  dependencies:
    - "perl/5.42.0"
    - "musl/1.2.5"
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-Makefile.PL.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Perl XS 模块需要修改 Makefile.PL 添加 musl 头文件和库路径"
  - "LDDLFLAGS 参数需要包含 -L 和 -B 选项指定 musl 库路径"
  - "XS 模块（.so）在 HMDFS 上受 SELinux 限制无法加载，需管理员安装"
  - "IPC::ShareLite 依赖 SysV IPC（共享内存和信号量），目标系统需支持"

patch_classification:
  - file: 0001-Makefile.PL.patch
    type: build-config
    platform_only: true
    guard: "#ifdef __OHOS__"