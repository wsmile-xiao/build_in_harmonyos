# test_package/MANIFEST.yml
package: puzzles/20260720.3c36322
homepage: "https://www.chiark.greenend.org.uk/~sgtatham/puzzles/"

# Upstream test command
upstream_check_command: "ctest --test-dir build"
upstream_test_in_build: true
upstream_test_command: ""

# Upstream tests: the collection ships no CTest registration; its
# self-checks are the standalone auxiliary test programs (unit tests
# for the shared algorithms) plus each game's internal solver
# exercised through the front end's --test-solve mode and the
# fuzzpuzz harness.
upstream_tests:
  - name: "auxiliary unit tests"
    count: 10
    programs: [combi-test, divvy-test, findloop-test, hat-test, latin-test, penrose-legacy-test, penrose-test, sort-test, spectre-test, tree234-test]
  - name: "in-game --test-solve"
    count: 34
    games: [blackbox, bridges, dominosa, fifteen, filling, flip, flood, guess, inertia, keen, lightup, loopy, magnets, map, mines, mosaic, net, netslide, palisade, pattern, pearl, rect, signpost, singles, sixteen, slant, solo, tents, towers, tracks, twiddle, undead, unequal, unruly]
  - name: "fuzzpuzz harness"
    count: 1
    programs: [fuzzpuzz]

excluded_upstream_tests:
  - command: "ctest"
    reason: "the upstream tree registers no CTest tests; the self-check surface is the auxiliary programs + --test-solve + fuzzpuzz listed above"

# Tests shipped in test_package (consumer-side verification)
test_package_tests:
  - file: test_puzzles.sh
    description: "50 场景测试套件：单元测试 10 + 集成测试 34（游戏 --test-solve）+ fuzzpuzz 1 + 鸿蒙特有 5（OHOS 前端 CLI 全链路）"
    command: "bash test_puzzles.sh"

# Total assertion count (50 scenarios in test_puzzles.sh)
assertion_count: 50
