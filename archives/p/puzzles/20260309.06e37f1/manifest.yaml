# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "puzzles 使用 CMake 构建系统，unix.cmake 要求 GTK（鸿蒙无 GTK），需创建 ohos.cmake 平台配置替代"
  - "前端实现必须使用 vtable-based drawing_api 架构，避免与 drawing.c 中间层函数的符号冲突"
  - "nullfe.c 的 stub 函数名与 drawing.c 中间层同名（draw_text 等），仅 cliprogram 可安全使用，puzzle() 函数不能直接使用"
  - "document_add_puzzle 是独立 frontend 函数（非 vtable），需单独提供 stub 实现"
  - "version.h 需手动设置版本号（git checkout 无自动生成的 version.h，发布 tarball 由 Buildscr 自动生成）"
  - "puzzles headless 构建需 OHOS 平台前端文件（ohos_fe.c）提供 drawing_api vtable + frontend 函数 + main()"

