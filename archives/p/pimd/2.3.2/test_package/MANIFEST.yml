# test_package/MANIFEST.yml
# pimd 2.3.2 - upstream test declaration and consumer-test audit.

package: pimd/2.3.2
homepage: "https://github.com/troglobit/pimd"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream pimd 2.3.2 ships no test suite: the tarball contains the C sources,
  the hand-written configure script + Makefile, bundled libite, docs and
  pimd.conf, but no `check`/`test` target and no tests/ directory.
upstream_check_command: "n/a (no test target)"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests: []

test_package_tests:
  - file: test_pimd.sh
    description: >-
      installed-program consumer checks: presence/executability of pimd, the -v
      and --version banners, and the --help usage block.
    command: "sh test_pimd.sh"

test_files:
  - path: "test_package/test_pimd.sh"
    test_type: "R34"
    assertion_count: 6

test_package_test_count: 1
consumer_assertion_count: 6
upstream_test_cases: 0
assertion_count: 6
