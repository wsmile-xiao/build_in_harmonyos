version: "2.3.2"
software: "pimd"
status: built
build_date: "2026-10-03"
build_system: "custom-configure"

source:
  url: "https://deb.debian.org/debian/pool/main/p/pimd/pimd_2.3.2.orig.tar.gz"
  sha256: "5d62cc7c325fee21ea0c38b24b9f0d7bd26ebe36e9b7f6dc12cbf59e59514953"
  tar_format: tar.gz

build:
  system: custom-configure
  configure_options: []
  dependencies: []
  cc: clang

patches_applied:
  - "0001-ohos-support.patch"

knowledge_gained:
  - "pimd 的 configure 是手写脚本（非 autoconf）：只认 Linux/*BSD，遇 HarmonyOS 直接报 unsupported；补丁加上 HarmonyOS 分支复用 Linux 设置即可"
  - "该 configure 用 `mktemp /tmp/XXXXXX`，OHOS /tmp 只读 → 改为在构建目录建临时文件（config.mk.XXXXXX）"
  - "零三方依赖：Linux/HarmonyOS 下只需编译自带 libite 的 strlcpy/strlcat/pidfile/strtonum 四个对象"
