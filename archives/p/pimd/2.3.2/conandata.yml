sources:
  url: "https://mirrors.aliyun.com/debian/pool/main/p/pimd/pimd_2.3.2.orig.tar.gz"
  sha256: "5d62cc7c325fee21ea0c38b24b9f0d7bd26ebe36e9b7f6dc12cbf59e59514953"
  filename: "pimd-2.3.2.tar.gz"

patches:
  - patch_file: "patches/0001-ohos-support.patch"
    patch_description: >-
      pimd's hand-written configure script (a) creates its temporary file with
      `mktemp /tmp/XXXXXX`, but /tmp is read-only on OHOS, and (b) only knows
      Linux/FreeBSD/NetBSD/OpenBSD and aborts with "HarmonyOS is currently
      unsupported". This patch creates the temp file in the build directory and
      treats HarmonyOS exactly like Linux (same DEFS/EXTRA_OBJS/ROUTER_OBJS).
    patch_type: "platform"
  - patch_file: "patches/0002-ohos-sockaddr-storage.patch"
    patch_description: >-
      On OHOS both sys/socket.h and linux/socket.h define struct
      sockaddr_storage, so including <linux/mroute.h> (which pulls in
      linux/socket.h) after netinet/igmp.h redefines it. This patch renames the
      token around the kernel-header include under __OHOS__ so only libc's
      definition remains visible (KB E091/E119).
    patch_type: "portability"
  - patch_file: "patches/0003-ohos-no-gethostid.patch"
    patch_description: >-
      OHOS bionic does not provide gethostid(), which main.c uses for its
      fallback random seed. Reuse the existing SYSV fallback (time(NULL);
      /dev/urandom is still used for the real seed).
    patch_type: "portability"
