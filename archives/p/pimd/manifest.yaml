software: pimd
display: "pimd"
description: "PIM-SM 组播路由守护进程（Protocol Independent Multicast）"
category: utility
homepage: "https://github.com/troglobit/pimd"
license: BSD-3-Clause
build_system: custom-configure

ohos_adaptation:
  key_points:
    - "手写 configure 只认 Linux/*BSD；补丁加 HarmonyOS 分支复用 Linux 设置"
    - "configure 用 mktemp /tmp/XXXXXX，OHOS /tmp 只读 → 补丁改为在构建目录建临时文件"
    - "零三方依赖；自带 libite 的 strlcpy/strlcat/pidfile/strtonum 直接编入 pimd"
  common_dependencies: []

versions:
  - version: "2.3.2"
    status: built
    build_date: "2026-10-03"
