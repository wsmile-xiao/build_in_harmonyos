# test_package/MANIFEST.yml
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: partimage/0.6.9
homepage: "https://www.partimage.org/"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests: []

# test_package 中自带的测试
test_package_tests:
  - file: test_partimage.sh
    description: "Smoke test: verify partimage binary runs"
    command: "./test_partimage.sh"

# 测试断言总数
assertion_count: 1
