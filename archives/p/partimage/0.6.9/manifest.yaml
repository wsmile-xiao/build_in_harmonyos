# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "HarmonyOS 无 getspnam/shadow password API，需用 getpwnam 替代（在 access.cpp 中用 #ifdef __OHOS__ 守卫）"
  - "OHOS zlib 的 gzFile 是 gzFile_s*（指针类型），原代码声明为 gzFile*（双重指针），需改为 gzFile m_gzImageFile"
  - "C++11 要求字符串字面量与宏之间有空格：\"%\"PRId64 → \"%\" PRId64"
  - "partimage 依赖 newt/slang（交互式GUI），OHOS 无此库，需用 --disable-newt 跳过，并提供 dummy 替代类"
  - "gui_text.h 含 newt 类型，需 HAVE_LIBNEWT 守卫或提供 dummy 替代类"
  - "HarmonyOS 无 makedev 宏定义（需手动 #include <sys/sysmacros.h>）"
  - "configure/config.status 中 umask 077 与 HMDFS 不兼容（mkdir 创建的目录无法 touch 文件）"
  - "libintl/gettext 函数需显式链接 -lintl（configure 未自动将 INTLLIBS 加入 LIBS）"

