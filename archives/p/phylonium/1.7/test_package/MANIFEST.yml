# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI build_and_test.sh L0e 要求此文件存在）
# 口径：AGENTS §10.1 五维账本 / SKILL R51 上游测试三步法。
#
# N_static / N_registered 的来源是 v1.7 tag 源码本身，不是日志回填：
#   顶层 Makefile.am:10  ->  TESTS=test/simple.sh test/unittests     => 注册 2 项
#   test/Makefile.am:1    ->  check_PROGRAMS = simf unittests        => simf 只被构建
#   test/Tprocess.cxx + test/Tsequence.cxx                           -> 6 个 TEST_CASE
#                                                                  (43 个 REQUIRE)
# simf 未注册为 TESTS，它是 simple.sh 内部调用的数据生成器，因此不得计入分母。

package: phylonium/1.7
homepage: "https://github.com/EvolBioInf/phylonium"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"

# automake 注册的上游测试（2 项，SUBDIRS = libs src test . 使顶层 check 生效）
upstream_tests:
  - name: simple
    command: "test/simple.sh"
    expected: "pass"
    note: >-
      端到端冒烟：先跑 ./src/phylonium --version 与 ./test/simf -h，再用
      simf -s $RANDOM_SEED -l 100000 -p simple 生成 simple0/simple1.fasta，
      最后断言 phylonium 对二者的输出 rc=0。依赖构建树内路径，故只能在
      make check（VPATH 顶层构建目录）里跑，不能当成交付后的消费者测试。
  - name: unittests
    command: "test/unittests"
    expected: "pass"
    note: >-
      Catch runner（test/catch.hpp），内含 6 个 TEST_CASE / 43 个 REQUIRE，
      覆盖 Homology basics、Homology filtering、Complete deletion、
      Sequence basics、Revcomp、Filtering nucleotides。automake 侧算 1 个
      注册项，原子用例数在括号中另记，两种口径不得互相顶替。

# test_package 中自带的消费者测试（适配补全，真实执行交付后的 bin/phylonium）
test_package_tests:
  - file: test.sh
    description: >-
      对交付二行为的 12 条断言：--version 文本、三基因组长距离矩阵运行、
      stdout 非空、PHYLIP 首行 = 3 个分类单元、行 ID 为去扩展名文件名且无多余行、
      对角线为 0、相同基因组距离恰为 0.0000e+00、2.5% 分歧对的 JC 距离为有限正数、
      矩阵对称、无 --bootstrap 时两次运行逐字节一致、缺失输入文件非零退出、
      仅 1 个文件时按 usage 非零退出。断言决定退出码（R34）。
    command: "/bin/sh test.sh"

assertion_count: 12
max_rss_mb: 64
