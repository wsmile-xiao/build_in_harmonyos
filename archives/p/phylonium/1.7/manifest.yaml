  recipe_revision: "d32d95f04d56c8a9a4f50aadad914072"
  package_id: "5700eb7cf8b7e169106d648238533d988254538d"
  package_revision: "cbfe169d27a52b7dd6685af17d578d33"
  dependency_package_id: "83bf02d1dba113206f930938aa488b92249a1825"

knowledge_gained:
  - "DRAFT-6049（perl 双架构）新变体实证：conanbuild 的 PERL5LIB 指向 conan perl 的 aarch64-linux-thread-multi 库目录、而 PATH 先解析到 hnp 的 autoreconf（跑系统 perl）时，报 'Error relocating Cwd.so: Perl_my_cxt_init: symbol not found'（原条目签名是 Cwd.c handshake mismatch）。同一 rec_approach 有效：PERL=perl + PERL5LIB 收窄为 automake/share/automake-1.18 与 autoconf/share/autoconf 两个纯 Perl 模块目录 + autoconf/m4 bin 前置"
  - "exports_sources 的文件在真机缓存里落在 p/<h>/es/，而 self.recipe_folder 是 p/<h>/e/ —— package() 里从 recipe_folder 取许可证文本会**静默匹配 0 个文件**、包树缺 licenses/。必须用 self.export_sources_folder，并对打包产物加存在性断言"
  - "AC_CONFIG_HEADERS([config.h:config.hin]) 且 tarball 不含 config.hin 时，只有 autoreconf 触发的 autoheader 会生成该模板（7 个源文件 #include \"config.h\"）；同族判据：tag 件既无 configure 也无 config.hin ⇒ 必须自举，不能直接 ./configure"
  - "E386 复确认：用 env CONFIG_SHELL=/bin/sh SHELL=/bin/sh + load_toolchain_args() 取回 configure_args 的写法，可让 Autotools 系配方在保留 conanbuild（CPPFLAGS/LIBS/CC/CXX）的同时绕开 hnp bash 的 getcwd 失败（ConanFile.run 在 scope=build 时默认套 conanbuild，故 self.run 前缀 env 不丢依赖 flags）"
  - "phylonium 的 x86simd/avx512 两个 AC_ARG_ENABLE 默认 enabled 且无 CPU 探测，aarch64 必须显式双关；libs/Makefile.am 会据此决定是否编 -msse2/-mavx2/-mavx512bw 源文件"
  - "HMDFS 无 mkfifo ⇒ make -j>1 的 jobserver 不可用，连 autotools.install() 也要显式 -j1（否则 conan 按 tools.build:jobs 追加 -j2）"
  - "E543：交付二进制需 chmod 0755 才可执行；真机实测 package 内 bin/phylonium 为 -rwxrwx--- 且可直接运行"
  - "libtool/2.5.4 在远端可列包但归档树无该版本目录、automake/1.17 目录在而无 conanfile.py —— 二者都会让 graph 解析期失败，tool_requires 必须 pin libtool/2.5.4.1 + automake/1.18"
