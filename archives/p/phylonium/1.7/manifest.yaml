# 版本级 manifest — phylonium 1.7
# 文件位置: archives/p/phylonium/1.7/manifest.yaml
# 遵循 ARCHIVE-SPEC；数字口径与 notes.md / test_package/MANIFEST.yml / PR 正文同源（§10.1）

version: "1.7"
software: "phylonium"

# published | built | failed | archived
# built = conan create（W3）真机通过但未 upload（AGENTS §8.1：不得标 published）
status: built

build_date: "2026-09-27"
build_system: autotools

source:
  url: "https://github.com/EvolBioInf/phylonium/archive/refs/tags/v1.7.tar.gz"
  sha256: "87fc0828c4c96dc9b84e0bac640e7e1aaba749a9f218e1d4c4fbaa02d80412a0"
  tar_format: tar.gz
  strip_root: true
  top_level_dir: "phylonium-1.7/"

build:
  system: autotools
  # 官方 tag 件不含 configure/aclocal.m4/Makefile.in，且 configure.ac:85 引用的
  # config.h:config.hin 模板也不在包里 —— 由 autoreconf 的 autoheader 生成。
  bootstrap: "autoreconf -fi -Im4（perl 解释器统一，见 conanfile.py _autoreconf_command）"
  configure_options:
    - "--disable-x86simd"
    - "--disable-avx512"
    - "--prefix=/ （连同 bindir 等由 AutotoolsToolchain 注入，参数用 load_toolchain_args 取回）"
    - "--build/--host 均未传：configure.ac 无 AC_CANONICAL_HOST 且 -pr:b 与 -pr:h 同为 OHOS，三元组校验不发生（本机 uname -s=HarmonyOS，免 E007/E122/E072 族）"
    - "configure 以 env CONFIG_SHELL=/bin/sh SHELL=/bin/sh 路由执行（E386：profile 钉的 hnp bash 在 HMDFS 构建目录 getcwd 必挂）"
  dependencies:
    - "libdivsufsort/2.0.1"
  tool_dependencies:
    - "autoconf/2.72"
    - "automake/1.18"
    - "libtool/2.5.4.1"
  make_options:
    - "-j1"          # HMDFS 无 mkfifo，jobserver 在 -j>1 不可用
  upstream_tests_in_build: true
  upstream_test_command: "make check"
  cc: clang
  cxx: clang++
  openmp: detected-and-enabled

patches_applied: []

artifacts:
  - "bin/phylonium"
  - "share/man/man1/phylonium.1"
  - "share/doc/phylonium/manual.pdf"
  - "licenses/GPL-3.0-or-later.txt"

test_results:
  # 上游注册测试 = 顶层 Makefile.am:10 `TESTS=test/simple.sh test/unittests` → 2 项。
  # test/Makefile.am 的 check_PROGRAMS 里 simf **未注册为 TESTS**（它是 simple.sh 的
  # 数据生成器），因此不计入分母；unittests 为 Catch runner，内含 6 个 TEST_CASE /
  # 43 个 REQUIRE，随该注册项一次跑完（原子口径另记，不与注册口径互相顶替）。
  # 真机证据：logs/create-full-20260927-132858.log
  #   PASS: test/simple.sh / PASS: test/unittests
  #   # TOTAL: 2  # PASS: 2  # SKIP: 0  # XFAIL: 0  # FAIL: 0  # ERROR: 0
  type: autotools_testsuite
  static_total: 2
  registered_total: 2
  total: 2
  passed: 2
  failed: 0
  skip: 0
  upstream_atom_cases: 6
  upstream_atom_assertions: 43
  # 消费者测试（test_package/test.sh）：真跑交付后的 bin/phylonium，12 条断言全通过；
  # 实测峰值 4MB（memcap-run --probe），按上游 simple.sh 输入规模外推 ≈500MB；
  # test_package/MANIFEST.yml 记的 max_rss_mb: 64 是**预算**（覆盖实测并留余量），
  # 与本行 measured_peak_rss_mb 是两个不同语义的字段，不是两份互相矛盾的实测数。
