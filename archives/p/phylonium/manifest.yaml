# 软件级 manifest — phylonium
# 文件位置: archives/p/phylonium/manifest.yaml

software: phylonium
display: "phylonium"
description: "快速估算亲缘基因组间进化距离的命令行工具（输出 PHYLIP 格式距离矩阵）"
category: bioinformatics
homepage: "https://github.com/EvolBioInf/phylonium"
license: GPL-3.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "显式 --disable-x86simd --disable-avx512：上游两个开关默认 enabled 且无 CPU 探测，否则 aarch64 上会编 x86 SIMD 目标码"
    - "官方 tag 件无 configure 亦无 config.hin，构建期 autoreconf -fi -Im4 自举（autoheader 生成 configure.ac 引用的 config.hin 模板）"
    - "硬依赖 libdivsufsort64（configure.ac 无 --disable 退路），用已发布的 libdivsufsort/2.0.1 static 制品，靠 AutotoolsDeps 注入 -ldivsufsort64 与头文件路径"
    - "自举期 perl 双架构坑按 DRAFT-6049 统一解释器解（PERL=perl + PERL5LIB 收窄为纯 Perl 模块目录）"
    - "configure 以 CONFIG_SHELL/SHELL=/bin/sh 路由执行（E386），并对生成 configure 放宽 umask（E011/E114）"
    - "不传 --build/--host：configure.ac 无 AC_CANONICAL_HOST，避开本机 HarmonyOS 下 config.guess 失败族"
    - "许可证文本随配方发布（上游无任何许可证文件），package() 从 export_sources_folder 取"
    - "上游 2 个 automake 注册测试在 build() 内 make check 真执行；交付后的 12 条消费者断言在 test_package/"

versions:
  "1.7":
    status: built
    build_date: "2026-09-27"
