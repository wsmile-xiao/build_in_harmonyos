# 版本级 manifest — pillow 10.4.0
# 遵循 ARCHIVE-SPEC v2.0

version: "10.4.0"
software: "pillow"
status: "published"
build_date: "2026-09-02"
build_system: "setuptools (setup.py build_ext)"

source:
  url: "https://pypi.tuna.tsinghua.edu.cn/packages/cd/74/ad3d526f3bf7b6d3f408b73fde271ec69dfac8b81341a318ce825f2b3812/pillow-10.4.0.tar.gz"
  sha256: "166c1cd4d24309b30d61f79f4a9114b7b2313d7450912277855ff5dfd7cd4a06"
  tar_format: tar.gz

build:
  system: setuptools
  configure_options:
    - "--disable-tiff"
    - "--disable-lcms"
    - "--disable-webp"
    - "--disable-webpmux"
    - "--disable-jpeg2000"
    - "--disable-imagequant"
    - "--disable-raqm"
    - "--disable-xcb"
  dependencies:
    - "zlib/1.3.1"
    - "libjpeg/10"
    - "freetype/2.14.3"
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "pillow 用 setup.py build_ext 构建，依赖发现走 XXX_ROOT 环境变量（JPEG_ROOT/ZLIB_ROOT/FREETYPE_ROOT 指向 conan 包 prefix）"
  - "特性裁剪：tiff/lcms/webp/jpeg2000/imagequant/raqm/xcb 全部 --disable-*，保 zlib+libjpeg+freetype（matplotlib 关心的组合）"
  - "package() 用 pip install --no-deps --no-build-isolation --no-index --prefix=<pkg> 复用 build 阶段产物，不重编译"
  - "OHOS 适配点与 numpy/contourpy 配方同族（posix_spawn shim / lld 自动签名 / -lpython3.12）"
