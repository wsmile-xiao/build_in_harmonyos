# test_package/MANIFEST.yml
# Upstream test declaration (required by CI L0e, see docs/TEST_QUALITY_SPEC.md)

package: pillow/10.4.0
homepage: "https://python-pillow.org"

upstream_check_command: "python3 -m pytest Tests/"
upstream_test_in_build: false
upstream_test_command: ""

upstream_tests:
  - file: Tests/test_image.py
    source: Pillow-10.4.0/Tests/test_image.py
    description: "Core Image object tests"
    command: "python3 -m pytest Tests/test_image.py"
  - file: Tests/test_file_png.py
    source: Pillow-10.4.0/Tests/test_file_png.py
    description: "PNG codec tests (zlib)"
    command: "python3 -m pytest Tests/test_file_png.py"
  - file: Tests/test_file_jpeg.py
    source: Pillow-10.4.0/Tests/test_file_jpeg.py
    description: "JPEG codec tests (libjpeg)"
    command: "python3 -m pytest Tests/test_file_jpeg.py"
  - file: Tests/test_imagefont.py
    source: Pillow-10.4.0/Tests/test_imagefont.py
    description: "Font rendering tests (freetype)"
    command: "python3 -m pytest Tests/test_imagefont.py"

test_package_tests:
  - file: test_pillow.py
    description: "Import PIL, version, pixel access, PNG/JPEG round trip, freetype text rendering"
    command: "python3 -S test_pillow.py"

assertion_count: 14
