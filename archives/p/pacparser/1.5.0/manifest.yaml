software: pacparser
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5.0"

# 编译状态
# published | built | failed | archived
status: built

# 构建系统类型（顶层字段，G4门禁必需）
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/manugarg/pacparser/archive/refs/tags/v1.5.0.tar.gz"

  # 源码校验和
  sha256: "2601a0e58e87caba6f4866aebefde2f5a44a277c05f01f17541ba8857c7a566e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
  - "VERSION=v1.5.0"
  - "PREFIX=$DEFAULT_PREFIX"
  - "NO_INTERNET=1"
  # pacparser使用自定义Makefile（make -C src），不是autotools
  # 构建命令: make -C src VERSION=v1.5.0 PREFIX=$DEFAULT_PREFIX pactester libpacparser.so.1

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 无外部依赖，内嵌QuickJS JS引擎

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
- "0001-Makefile.patch"
- "0002-configure.patch"
- "0003-src-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
- "pacparser使用自定义Makefile（非autotools），构建命令为make -C src (ref: L3-pacparser)"
- "SHELL=/bin/bash在OpenHarmony不可用，需改为/bin/sh (ref: E015)"
- "GNU install命令在OpenHarmony不可用，需用mkdir+cp替代 (ref: E098)"
- "pacparser内嵌QuickJS JS引擎（v1.5.0从SpiderMonkey迁移到QuickJS） (ref: L3-pacparser)"
- "version.mk需通过configure脚本创建，因为tarball无git (ref: L3-pacparser)"
- "顶层Makefile默认目标需改为build（原为docker_multiarch） (ref: L3-pacparser)"
- "install目标的ln -sf需改为rm -f && ln -s（R5铁律） (ref: E006)"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/pacparser-1.5.0.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/pacparser-1.5.0.work
  source_orig_hash: 70d98e0279bd7abc
  source_work_hash: 2605903cd602dc19
  generated_at: '2026-06-11T14:24:06'
  patches_count: 3

patch_classification:
  - file: 0001-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0002-configure.patch
    type: auto
    platform_only: True
    guard: 'pending'
  - file: 0003-src-Makefile.patch
    type: auto
    platform_only: True
    guard: 'pending'
