# 软件级 manifest - pinfo
# 文件位置: archives/p/pinfo/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 软件名称（小写，与目录名一致）
software: pinfo

# 显示名
display: "Przemek's Info Viewer"

# 一句话描述
description: "Info 文件查看器，类似 info 命令但提供更友好的用户界面"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: doc

# 官网 URL
homepage: "https://github.com/baszoetekouw/pinfo"

# 开源许可证（SPDX 标识）
license: GPL-2.0

# ============================================================
# 构建信息
# ============================================================

# 常用构建系统（可被版本级覆盖）
# cmake | autotools | makefile | meson | custom
build_system: autotools

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  # 关键适配要点
  key_points:
    - "Bootstrap 项目：tarball 中无 configure，需要 autoreconf 生成"
    - "clean_verify.py 已支持 autoreconf（2026-06-15）"
    - "HMDFS 临时文件限制：config.status 可能失败，在其他环境可通过"

  # 跨版本通用依赖
  common_dependencies:
    - ncurses
    - gettext

# ============================================================
# 版本索引
# ============================================================

versions:
  "0.6.13":
    status: built
    build_date: "2026-06-15"
    # published_as: pinfo  # 仅 published 时需要