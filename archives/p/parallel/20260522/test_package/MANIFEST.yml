package: parallel/20260522
homepage: "https://www.gnu.org/software/parallel/"

# GNU's release tarball omits testsuite/. The complete testsuite is obtained
# from the matching upstream Git tag. A SHA256-pinned Forgejo mirror snapshot
# transports all 390 files, including binary fixtures and the hidden marker
# that GitCode's textual PR diff cannot carry.
upstream_source:
  repository: "https://git.savannah.gnu.org/git/parallel.git"
  mirror: "https://git.data.coop/tange/parallel"
  tag: "20260522"
  commit: "d913adb63fd4d8f28ed82cd9c519d0e017a763a2"
  snapshot_url: "https://git.data.coop/api/v1/repos/tange/parallel/archive/20260522.tar.gz"
  snapshot_sha256: "45863b673356bb524e068d122bfbe20fd7bafe5bb26f6519e931942926faade6"
  upstream_files: 390
  retained_files: 390
  reviewable_text_files: 365
  binary_and_nontext_files_in_snapshot: 24
  hidden_markers_in_snapshot: 1
  retained_test_scripts: 108
  retained_wanted_results: 109

upstream_test_command: "bash test_upstream_all.sh <package bin> <complete upstream snapshot> <Conan Perl> <results directory>"
upstream_test_in_build: false

upstream_test_inventory:
  discovered_scripts: 108
  retained_scripts: 108
  executed_scripts: 108
  unexecuted_scripts: 0
  retained_wanted_results: 109
  discovered_function_definitions: 773

# Full OHOS run on 2026-08-24. Every original tests-to-run/*.sh script was
# invoked and compared with its unmodified wanted-results file. BLOCKED_ENV is
# not counted as a pass; it records a real invocation that could not complete
# because the Conan Worker lacks an upstream prerequisite.
upstream_test_results:
  executed: 108
  passed: 13
  failed_output_mismatch: 0
  blocked_environment: 95
  missing_expected: 0
  unexecuted: 0
  strict_pass_rate: "13/108 (12.04%)"
  result_file: "<Conan build folder>/upstream_test_results/summary.tsv"
  passing_scripts:
    - parallel-install
    - parallel-local-sql
    - parallel-local108
    - parallel-local129
    - parallel-local140
    - parallel-local154
    - parallel-local157
    - parallel-local19
    - parallel-local6
    - parallel-remote-ssh-polarhome
    - test13
    - test32
    - test46

blocked_environment_categories:
  - category: "upstream helper commands and optional language runtimes"
    examples: ["stdout", "G", "field", "niceload", "pv", "expect", "tcsh", "gawk", "database drivers"]
    reason: "The upstream REQUIREMENTS file expects a large Debian test host; these commands and modules are not package runtime dependencies and are unavailable on the OHOS Worker."
  - category: "remote and virtualized hosts"
    examples: ["SSH servers", "Vagrant", "VirtualBox", "CentOS", "FreeBSD", "OpenIndiana", "macOS", "Android"]
    reason: "The named remote hosts and virtual machines used by upstream are not provisioned in the isolated Conan Worker."
  - category: "database services"
    examples: ["PostgreSQL", "MySQL", "Oracle", "SQLite drivers"]
    reason: "Upstream SQL tests require external database clients, Perl DBI drivers, credentials, and running database services."
  - category: "privileged and host-mutating operations"
    examples: ["sudo", "kernel modules", "host installation", "writable /tmp", "service control"]
    reason: "The application sandbox does not provide root privileges or unrestricted host filesystem and service access."
  - category: "resource-intensive, long-running, and interactive checks"
    examples: [">4 GiB output", "multi-gigabyte memory", "100s/300s timing", "manual visual checks"]
    reason: "The Worker enforces bounded resources and non-interactive execution; each script is still invoked and its timeout or prerequisite failure is recorded."

upstream_test_integrity:
  tests_modified: false
  expected_results_modified: false
  skipped_by_runner: 0
  result_policy: "PASS only when actual output exactly matches the unmodified upstream wanted-result; all other outcomes are reported without changing expectations."

supplemental_ohos_tests:
  count: 2
  tests:
    - file: conanfile.py
      type: "package integrity"
      description: "Checks that the packaged GPL-3.0-or-later license exists and is non-empty."
      command: "test_package.test() license assertion"
    - file: test_parallel.sh
      type: "consumer integration"
      description: "Runs the packaged CLI with Conan Perl, checks its version, and proves two three-second jobs overlap with two workers."
      command: "zsh test_parallel.sh <package bin/parallel> <Conan Perl>"

resource_integrity_checks:
  - file: test_upstream_all.sh
    description: "Asserts 390 files, 108 scripts, and 109 wanted-results, then invokes every upstream script and writes a 108-row summary."

executed_upstream_test_count: 108
supplemental_ohos_test_count: 2
total_executed_test_count: 110
