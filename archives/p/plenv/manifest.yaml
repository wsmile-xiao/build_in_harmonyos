software: plenv
display: "plenv Perl Version Manager"
description: "Simple Perl version management (rbenv-style, pure Bash)"
category: build-tool
homepage: "https://github.com/tokuhirom/plenv"
license: Artistic-1.0-Perl OR GPL-1.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "Pure Bash tool, no native compilation; package copies libexec/completions/plenv.d and keeps the bin/plenv relative symlink"
    - "Consumer tests run with an isolated PLENV_ROOT so nothing is written to the user HOME"
    - "Upstream `make test` needs network (git clone) plus prove/real perl, so build() runs an offline hermetic mirror of test/shim.t instead"
  common_dependencies: []

versions:
  "2.3.1":
    status: built
    build_date: "2026-09-12"
    conan_ref: "plenv/2.3.1"
