knowledge_gained:
  - "Pure Bash rbenv-style tools package by copying libexec/completions/plenv.d and keeping the bin/plenv -> ../libexec/plenv relative symlink."
  - "Generated shims re-exec `plenv` via PATH lookup, so tests must put a plenv wrapper (or the packaged bin/) on PATH before rehash and before running shims."
  - "Upstream `make test` git-clones ext/test-simple-bash at test time and needs prove plus a real perl; mirrored offline with a stub perl (prints PLENV_DIR) and PLENV_VERSION=dummy so the single test/shim.t assertion runs hermetically."
  - "Consumer tests must use an isolated PLENV_ROOT to avoid writing to the user HOME."
