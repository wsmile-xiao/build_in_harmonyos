package: plenv/2.3.1
homepage: "https://github.com/tokuhirom/plenv"

upstream_check_command: "make test (prove -v test/)"
upstream_test_in_build: true
upstream_test_command: "offline hermetic mirror of test/shim.t in conanfile.py build() (stub perl + PLENV_VERSION=dummy, no network/prove/real perl)"

upstream_tests:
  - file: test/shim.t
    source: plenv-2.3.1/test/shim.t
    description: "上游唯一用例：rehash 后的 shim 能透传 -E 并观察到 PLENV_DIR（plan 1）"
    command: "bash test_package/run_upstream_shim_test.sh <plenv-bin> <work-dir>"

test_package_tests:
  - file: test.sh
    description: "消费者 smoke test：--version、root、commands、init、rehash、global 回写（6 项断言）"
    command: "bash test.sh <plenv-bin> <isolated-root>"
  - file: run_upstream_shim_test.sh
    description: "上游 test/shim.t 的离线等效验证：stub perl + rehash + shim 透传断言（1 项断言）"
    command: "bash run_upstream_shim_test.sh <work-dir>"
  - file: conanfile.py
    description: "消费者测试入口：依次执行两脚本并输出 HMBS 双标记"
    command: "conan test"

assertion_count: 7
