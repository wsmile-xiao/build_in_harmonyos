# 版本级 manifest
# 文件位置: archives/p/parted/3.8/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "3.8"

software: "parted"

# 编译状态（conan-verify 通过；finish W3 后维持 built）
status: built

build_date: "2026-10-01"
build_system: autotools

source:
  url: "https://ftp.gnu.org/gnu/parted/parted-3.8.tar.xz"
  sha256: "a2b7811f47b0ddb1f7b1d0aa456f7c1270da70708ce231c2fe054c7199eafa63"
  tar_format: tar.xz

build:
  system: autotools
  configure_options:
    - "--build=aarch64-unknown-linux-ohos"
    - "--host=aarch64-unknown-linux-ohos"
    # 路径布局不由 configure 传参：sbin→bin 迁移与 lib/include 布局由
    # conanfile.py package() 兜底完成（与实际构建行为一致）
    - "--disable-nls"
    - "--disable-rpath"
  dependencies:
    - "libuuid/2.42.2"
    - "libblkid/2.42.2"
    - "readline/8.3"
    - "libdevmapper/1.02.198"
  cc: clang
  cxx: clang++

knowledge_gained:
  - "E011: configure/config.status 的 umask 077 在 HMDFS 上建出不可写临时目录，配方内替换为 022"
  - "E074: HMDFS 上 make jobserver fifo EPERM，固定 autotools.make(args=['-j1'])"
  - "E316: OHOS musl 无法加载 SONAME 为软链的库，package() 将 lib/ 软链实体化"
  - "E490: autotools 辅助脚本需保持可执行位；config.guess 在 HMDFS 上不可用，显式 --build/--host=aarch64-unknown-linux-ohos 绕开"
  - "profile buildenv 的 CONFIG_SHELL(hnp bash) 在 HMDFS 上 getcwd 失败，build() 在 conanbuild.sh 末尾覆盖 CONFIG_SHELL/SHELL=/bin/sh"
  - "make install 因 version.texi/stamp-vti 缺失触发 makeinfo（设备无 texinfo），_prep_doc_info() 预置 stamp 并按 mtime 安装上游 parted.info"
  - "R26/R53: libtool 2.5.4 的 hardcode_libdir_flag_spec 会把 automake -rpath $(libdir) 硬编码为 DT_RUNPATH=//lib；configure --disable-rpath 属 gnulib m4/lib-link.m4（gettext 探测），不影响 libtool；build() 在 configure 后清空构建树 libtool 的 hardcode_libdir_flag_spec/hardcode_libdir_separator，readelf 实测 bin/parted、bin/partprobe、libparted.so.2、libparted-fs-resize.so.0 均无 DT_RUNPATH/DT_RPATH"
  - "P3: package() 删除 libtool .la（内含 libdir='//lib' 与失效的构建树绝对路径；消费者走 pkg-config/conan 注入）"
  - "禁止 patchelf 后处理：改写 ELF 会破坏 .codesign 段，实测产物 rc=126"
  - "R38: sbin/{parted,partprobe} 合并至 bin/ 并提供软件级 commands.json"
  - "R49: 依赖注入走 build_folder/prefix 私有视图（跳过 .la，补 libncurses.a 别名）"
