# test_package/MANIFEST.yml
# CI L0e 强制要求此文件存在
# R51 上游测试三步法：清点 -> 实际运行 -> 如实回填

package: parted/3.8
homepage: "https://www.gnu.org/software/parted/"

# ── 上游测试清点结论（R51 第一步）─────────────────────────────
# parted 3.8 源码树 tests/ 共 119 个条目：
#   * tests/Makefile.am 注册 TESTS = 101 项（含 help-version.sh，parted 二进制行为驱动）
#     磁盘 tests/t*.sh 共 103 个 = 101 个注册项 + t-lib-helpers.sh（框架 helper，
#     随测试 source）+ t-local.sh/t-lvm.sh（条件辅助脚本，不入 TESTS，仅 EXTRA_DIST）；
#     另有 init.sh 为框架脚本（非 t*.sh）。辅助/条件脚本均不计入运行统计
#   * check_PROGRAMS = 6 个 check 库 C 单测（print-align/print-flags/print-max/
#     dup-clobber/duplicate/fs-resize）
#   * 其余为测试框架/辅助脚本（init.sh/init.cfg/t-lib-helpers.sh、
#     gpt-header-munge/gpt-header-move/msdos-overlap/gpt-attrs/sun-badlabel 等）
#   * libparted/tests/ 另有 6 个 check 集成测试（t1000-label/t1001-flags/
#     t2000-disk/t2100-zerolen/t3000-symlink/t4000-volser）
# 上游统一入口：`make check`（automake parallel-tests）。
upstream_check_command: "make check（顶层默认套件）+ make -C libparted/tests check"
upstream_test_in_build: true
upstream_test_command: "make -j4 check（需 git bash 环境修正，见 reports/test-report.md 与 notes.md）"

# 设备实测（2026-10-01，HarmonyOS PC aarch64）：
# A) 原样运行（环境未修正）：
#    tests/        : TOTAL 101  PASS 42  SKIP 37  FAIL 22
#    libparted/tests: TOTAL 6   PASS 1   SKIP 2   FAIL 3（后经环境修正复跑）
# B) 环境修正后复跑（去探索构建误加的 -DNDEBUG；harness 用 bash 规避 toybox sh
#    的 [^0-9] 误匹配；PATH 补 truncate --size 垫片与 id 垫片；python3/perl
#    shebang 指向设备实装路径）：
#    tests/        : TOTAL 101  PASS 59  SKIP 37  FAIL 5
#    libparted/tests: TOTAL 6   PASS 4   SKIP 2   FAIL 0
# 剩余 5 个 FAIL 的具体技术原因（逐项）：
#   * t0000-basic   : 非交互 stdin 下静态 readline 8.3 不回显键入的 "y"
#                     （上游期望 "Yes/No? y"）；仅断言回显文本，非功能缺陷
#   * t0251-gpt-unicode: toybox 无 locale 命令 + od/字节比对差异（环境工具缺口）
#   * t0350-mac-PT-increases-sector-size: `---pretend-input-tty` 配合静态
#                     readline 的 TTY 模拟回显差异（与 t0000 同族）
#   * t3310-flags  : 设备无 mke2fs（e2fsprogs 未提供）
#   * t9050-partition-table-types: 设备无 mkswap（util-linux 工具未提供）
# 37 个 SKIP 的分类：must be run as root ×30（loop/dm/mdadm/挂载等），
#   Perl Digest::CRC ×2，缺 mkswap/mkfs.vfat/mkfs.ext3/hexdump ×4，
#   DEVICE_TO_ERASE 环境变量 ×1（如需擦盘设备）。
upstream_tests:
  - name: "tests/ (注册 101 项)"
    result: "PASS 59 / SKIP 37 / FAIL 5（环境修正后复跑；原样 42/37/22）"
  - name: "tests/ check_PROGRAMS (6 C 单测)"
    result: "全部构建；dup-clobber/duplicate/print-* 经去 NDEBUG 重编后通过（个别随套件统计）"
  - name: "libparted/tests (6 check 测试)"
    result: "PASS 4 / SKIP 2（zerolen、symlink 跳过）/ FAIL 0（环境修正后）"

# ── test_package 自带测试（消费者视角，均真实执行包内二进制）──
test_package_tests:
  - file: test.sh
    description: "功能 E2E（10 条断言）：parted/partprobe --version；64MiB sparse 镜像；mklabel gpt + print(gpt/Disk)；mkpart primary ext4 + print；unit MiB print；rm 1 后分区消失；--json 输出含 disk；mklabel msdos + mkpart fat32"
    command: "bash test.sh <pkg>/bin"
    assertions: 10
  - file: test_ohos.sh
    description: "鸿蒙特有测试（13 条断言）：平台身份(HarmonyOS/aarch64)；bin/{parted,partprobe}；ELF64 AArch64；PIE；musl 解释器 /lib/ld-musl-aarch64.so.1；无 glibc 专有 NEEDED；.note.ohos.ident；.codesign；RUNPATH/RPATH 归一化重复斜杠后无系统库目录(R26/R53)；parted NEEDED 含 libparted.so.2 且包内实体化；libparted.so.2 ELF64/AArch64/SONAME；任意 cwd 可运行；载荷完整"
    command: "bash test_ohos.sh <pkg>"
    assertions: 13

# 测试断言总数 = 功能 10 + 鸿蒙特有 13
assertion_count: 23

# 其中鸿蒙平台特有测试用例数（ELF/ABI、musl/OHOS 标记、RUNPATH、平台能力缺口等）
ohos_specific_assertions: 13
