software: perceptualdiff
version: "2.1"
status: built
build_date: "2026-09-21"
conan_ref: "perceptualdiff/2.1"
build_system: cmake

source:
  url: "https://github.com/myint/perceptualdiff/archive/refs/tags/v2.1.tar.gz"
  sha256: "0dea51046601e4d23dc45a3ec342f1a305baf3bf3328e9ccdae115fe1942f041"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "CMAKE_POLICY_VERSION_MINIMUM not needed (patch 0001 raises cmake_minimum_required to 3.5)"
  dependencies:
    - freeimage/3.18.0
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-cmake-ohos-conan-adaptation.patch"

knowledge_gained:
  - "CMake 4.x 拒绝 cmake_minimum_required(VERSION 2.4)：需抬到 >= 3.5 并与 project() 顺序正确"
  - "上游 CMakeLists 硬写 set(CMAKE_BUILD_TYPE Debug)，会覆盖 Conan 传入的 Release，须条件化"
  - "Conan CMakeDeps 只提供 freeimage::freeimage imported target，上游 FindFreeImage.cmake 的 FREEIMAGE_INCLUDE_DIRS/FREEIMAGE_LIBRARIES 变量不会填充，须改走 target"
  - "上游 CMakeLists 只给可执行文件挂 FreeImage，pdiff 静态库同样需要其头文件与链接关系"
  - "OHOS 上 find_package(OpenMP) 可命中 SDK 自带 libomp 5.0（-fopenmp=libomp），上游 OpenMP 加速无需裁剪"
  - "test/run_tests.bash 从 ../build 等相对路径查找二进制，build() 中须先把产物投放到 <source>/build"
  - "test/run_tests.bash 全部 26 项（7 图像对 + 19 CLI 断言）在 OHOS 上原样通过，无需修改上游测试"
