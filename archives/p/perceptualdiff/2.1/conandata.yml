sources:
  url: "https://github.com/myint/perceptualdiff/archive/refs/tags/v2.1.tar.gz"
  sha256: "0dea51046601e4d23dc45a3ec342f1a305baf3bf3328e9ccdae115fe1942f041"

patches:
  - patch_file: "patches/0001-cmake-ohos-conan-adaptation.patch"
    patch_description: >-
      Adapt CMakeLists.txt for OHOS/Conan builds: hoist and raise
      cmake_minimum_required (CMake 4.x rejects compatibility with < 3.5),
      respect an externally provided CMAKE_BUILD_TYPE, consume the
      Conan-provided freeimage::freeimage imported target (CMakeDeps) for both
      targets, and install the pdiff library plus the public headers so the
      package is usable as a library in addition to the CLI.
    patch_type: "portability"
