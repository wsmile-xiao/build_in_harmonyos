package: perceptualdiff/2.1
homepage: "https://github.com/myint/perceptualdiff"

# 上游测试入口：test/run_tests.bash（bash -e 回归脚本，任何断言失败即非零退出）
upstream_check_command: "bash test/run_tests.bash"
upstream_test_in_build: true
upstream_test_command: "bash test/run_tests.bash"

# 上游实际运行的测试：7 个图像对回归期望 + 19 个 CLI 行为断言（同一脚本内）
upstream_tests:
  - name: image_pair_regressions
    file: test/run_tests.bash
    source: perceptualdiff-2.1/test/run_tests.bash
    description: >-
      7 个图像对期望值（FAIL Bug1102605_ref.tif/Bug1102605.tif、PASS
      Bug1471457_ref.tif/Bug1471457.tif、PASS cam_mb_ref.tif/cam_mb.tif、FAIL
      fish2.png/fish1.png、PASS square.png/square_scaled.png、FAIL
      Aqsis_vase.png/Aqsis_vase_ref.png、FAIL alpha1.png/alpha2.png）
    command: '"$pdiff" --verbose --scale <image1> <image2> | grep -q "^<PASS|FAIL>"'
  - name: cli_behaviour_assertions
    file: test/run_tests.bash
    source: perceptualdiff-2.1/test/run_tests.bash
    description: >-
      19 个 CLI 行为断言：OpenMP 横幅、--version、--help、--output 写差分图、
      损坏输入 "Failed to load"、不可写输出 "Failed to save"、未知扩展名
      "unknown filetype"、单图 "Not enough"、--downsample/-3、--threshold -3、
      未知选项忽略、--scale/--downsample 比较、/dev/null "Unknown filetype"、
      --sum-errors、多选项组合、--fov 非法值 "Invalid argument"
    command: 'bash test/run_tests.bash'

# test_package 自带的消费者视角测试
test_package_tests:
  - file: test.cpp
    description: >-
      消费者探针：链接包导出的 perceptualdiff::perceptualdiff（pdiff 静态库）
      调用 pdiff::yee_compare 与 FreeImage 支持的 read_from_file/write_to_file，
      并断言 OHOS 平台特性（LP64、小端、musl/libc++、ABGR 打包、API 生命周期）
    command: "./test_probe"
  - file: conanfile.py
    description: >-
      CLI 消费者验证：运行打包的 bin/perceptualdiff --version / --help
    command: '"<package_folder>/bin/perceptualdiff" --version'

# 测试断言总数（test.cpp 11 条断言 + CLI 2 项）
assertion_count: 13
