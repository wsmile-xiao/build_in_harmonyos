software: perceptualdiff
display: "PerceptualDiff"
description: "Image comparison utility using a perceptually based image metric"
category: gfx
homepage: "https://github.com/myint/perceptualdiff"
license: GPL-2.0-or-later
build_system: cmake

ohos_adaptation:
  key_points:
    - "图像 IO 依赖 FreeImage，直接使用制品仓 freeimage/3.18.0 成品包，无需重写 IO 后端"
    - "CMake 4.x 拒绝 cmake_minimum_required(VERSION 2.4)，补丁抬到 3.5 并前移到 project() 之前"
    - "上游硬写 set(CMAKE_BUILD_TYPE Debug) 会覆盖 Conan 的 Release，补丁条件化"
    - "Conan CMakeDeps 只提供 freeimage::freeimage imported target，上游 FindFreeImage.cmake 的变量不会填充，补丁改走 target"
    - "上游回归脚本 test/run_tests.bash 从 ../build 查找二进制，配方 build() 中先把产物投放到源码树 build/ 再运行"
    - "可执行产物无 RPATH，运行时需 conanrun 环境提供 libfreeimage.so.3 路径"
  common_dependencies:
    - freeimage

versions:
  "2.1":
    status: built
    build_date: "2026-09-21"
    conan_ref: "perceptualdiff/2.1"
