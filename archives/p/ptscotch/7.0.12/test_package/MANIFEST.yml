# test_package/MANIFEST.yml
# 上游官方测试声明文件（R51 实测申报）

package: ptscotch/7.0.12
homepage: "https://gitlab.inria.fr/scotch/scotch"

# 上游测试命令：CMake 构建后由 ctest 注册（src/check/ 下的 test_scotch_*）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py 的 build() 中是否已集成上游测试
# 上游 src/check/ 的测试驱动需要外部矩阵数据文件，且多数要以 mpiexec 多进程运行；
# 本环境的 mpiexec 被沙箱拦截（见 notes.md），故 ENABLE_TESTS=False 保持包构建精简，
# 消费者侧验证走 test_package 的真实并行 API 调用。
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（src/check/ 下按功能分列的驱动）
upstream_tests:
  - file: src/check/test_scotch_dgraph_check.c
    source: scotch-7.0.12/src/check/test_scotch_dgraph_check.c
    description: "分布式图结构校验（SCOTCH_dgraphCheck）"
    command: "mpiexec -n 2 ./test_scotch_dgraph_check"
  - file: src/check/test_scotch_dgraph_order.c
    source: scotch-7.0.12/src/check/test_scotch_dgraph_order.c
    description: "分布式图嵌套剖分排序（SCOTCH_dgraphOrder）"
    command: "mpiexec -n 2 ./test_scotch_dgraph_order <graph>"
  - file: src/check/test_scotch_dgraph_band.c
    source: scotch-7.0.12/src/check/test_scotch_dgraph_band.c
    description: "分布式图带宽压缩（SCOTCH_dgraphBand）"
    command: "mpiexec -n 2 ./test_scotch_dgraph_band <graph>"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test.c
    description: >
      真实调用并行 API：SCOTCH_dgraphInit 建立分布式图 →
      SCOTCH_dgraphBuildGrid3D 在内存生成 4x4x1 网格图 → SCOTCH_dgraphCheck
      校验结构 → SCOTCH_stratDgraphMap 设定策略 → SCOTCH_dgraphPart 求划分；
      断言各步返回码为 0 且顶点数 > 0。无需外部数据文件。
    command: "./test_ptscotch"

# 测试断言总数
# test_package 的判定 = 8 项条件断言（五个返回码 init/build/check/strat/part
# 均为 0，且全局顶点数/本地顶点数/实际用到的分区数均 > 0），
# 外加对**每个本地顶点**的分区号范围校验（必须落在 [0, NPART)），
# 出现未分配(-1)或越界即判失败。
assertion_count: 8
assertion_detail: "5 个返回码 == 0；vertglbnbr/vertlocnbr/partnbr > 0；逐顶点分区号 ∈ [0, NPART)"
