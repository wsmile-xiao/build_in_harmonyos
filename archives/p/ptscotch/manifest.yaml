software: ptscotch
display: "PT-SCOTCH"
description: "Parallel (MPI) graph and mesh partitioning library — the distributed-memory companion of SCOTCH"
category: scientific
homepage: "https://gitlab.inria.fr/scotch/scotch"
license: CECILL-C
build_system: cmake

ohos_adaptation:
  key_points:
    - "与串行 scotch 出自同一上游源码树，但产物不同（本包含 ptscotch.h 与 libptscotch*）；本包不修改他人归档 archives/s/scotch"
    - "BUILD_PTSCOTCH 恒为 ON，MPI 用 mpich/5.0.1.2（与仓内 trilinos 同选）"
    - "CMake 的 FindMPI 在 OHOS 上无法自行解析，需显式给 MPI_C_COMPILER/MPIEXEC_EXECUTABLE 指向 mpich 的 wrapper"
    - "构建期上游会运行 dummysizes/ptdummysizes 生成头文件，需 LD_LIBRARY_PATH 指向 mpich/lib，否则 libmpi.so 加载失败致 make Error 127"
    - "Fortran 接口关闭（设备无 gfortran）；C 接口完整可用"
  common_dependencies:
    - cmake
    - mpich
    - bzip2
    - xz
    - zlib

versions:
  "7.0.12":
    status: built
    build_date: "2026-09-26"
