software: perl-padwalker
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.5-r5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.5-r5"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-02"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/R/RO/ROBIN/PadWalker-2.5.tar.gz"

  # 源码校验和
  sha256: "07b26abb841146af32072a8d68cb90176ffb176fd9268e6f2f7d106f817a0cd0"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"

  # 特殊链接参数（绕过 CRT 文件缺失）
  link_options:
    - "-nostartfiles -nodefaultlibs -L/system/lib64 -lc"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - musl/1.2.x (提供标准 C 库头文件)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块编译需要标准 C 库头文件（musl 提供的 sys/types.h, endian.h 等）"
  - "鸿蒙系统缺少 CRT 文件（crti.o, crtn.o, crtbeginS.o, crtendS.o），链接需要 -nostartfiles -nodefaultlibs -lc 参数"
  - "SELinux HMDFS 文件系统限制动态库加载，需要将模块安装到系统目录 /data/service/hnp/"
  - "Makefile.PL 中可通过 dynamic_lib => { OTHERLDFLAGS => ... } 添加链接参数"
  - "PadWalker.so 仅依赖 libc.so，无额外库依赖，编译相对简单"
  - "binary-sign-tool 可为 .so 添加 .codesign section，但不改变 SELinux 上下文"
  - "HNP 包 (hnpcli pack) 是安装 Perl XS 模块到系统目录的标准方式"

patch_generation:
  method: none
  notes: "Makefile.PL 修改由 conanfile.py build() 动态完成，无需 patch 文件"

patch_classification: []
