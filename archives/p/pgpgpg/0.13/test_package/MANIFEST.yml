package: pgpgpg/0.13
homepage: "https://mroth.net/pgpgpg/"

# 上游名义上的测试命令。Makefile.in:285 是 check-am: all-am，且 grep -n TESTS
# Makefile.in 零命中 => 该目标空转，上游没有注册任何用例。
upstream_check_command: "make check"

# build() 里确实调用了 make check（rc=0），但它是空转，不构成上游测试集成，
# 因此按 false 记账（上游注册用例 = upstream_tests 的条数 = 0）。
upstream_test_in_build: false
upstream_tests: []

test_package_tests:
  - file: test_pgpgpg.sh
    description: "T 组：PGP 2.6 选项到 gpg 命令行的翻译面（用 /proc/<pid>/cmdline 记录 execve 实际 argv，不依赖 agent/密钥/网络，任何机器必跑）；E 组：GNUPGHOME 落在支持路径型 socket inode 的可写根上做真 keygen -> pgpgpg -e -> pgpgpg -d -> 明文逐字节回比，环境不支持时逐条显式 SKIP 并计入 skip 维"
    command: "bash test_pgpgpg.sh <pgpgpg> <gpg>"

assertion_count: 32   # T 组 17 + E 组 15（与 W3 实测 discovered=32 同源）
