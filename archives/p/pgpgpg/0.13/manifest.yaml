version: "0.13"
software: pgpgpg
status: built
build_date: "2026-09-25"
build_system: autotools
source:
  url: "https://mroth.net/pgpgpg/pgpgpg-0.13.tar.gz"
  sha256: "905e1d2c60715a733f30e7469e9255370d69858abfe0c7d4972b10cb0165cbc3"
  tar_format: tar.gz
build:
  system: autotools
  configure_options:
    - "--with-gpg-path=<gnupg/2.4.9.1 依赖的 package_folder>/bin/gpg"
  dependencies:
    - gnupg/2.4.9.1
  cc: clang
  cxx: clang++
patches_applied: []
knowledge_gained:
  - "E428"   # knowledge_ref: E428 — test_package 以 package_folder 绝对路径递交被打包的工具，绕开 OHOS bash 丢 PATH（本 PR 的 B 判定=hit；pgpgpg 与 gpg 两个二进制都按绝对路径传入）
test_results:
  type: manual
  total: 32
  passed: 32
  failed: 0
notes: |
  - Upstream release tarball already ships configure and Makefile.in; no
    Autotools regeneration happens on the device.
  - pgpgpg execs gpg via execv() with the GPG_PATH macro frozen at configure
    time (configure.in:69, pgpopts.c:725, main.c:147), so the recipe must hand
    configure an executable absolute path; it takes gnupg/2.4.9.1 from the
    Conan cache as a tool_requires.
  - That absolute path is a build-time Conan cache path, which is a documented
    delivery limitation (see notes.md 已知限制), not a claim of portability.
  - Upstream registers zero test cases (no TESTS in Makefile.in, check-am is a
    no-op); correctness is proven by the consumer test doing a real gpg
    encrypt/decrypt round trip.
