# test_package/MANIFEST.yml — perl-xml-namespacesupport 1.12
# CI L0e requires this file to exist.

package: perl-xml-namespacesupport/1.12
homepage: "https://metacpan.org/pod/XML::NamespaceSupport"

# 上游测试套件：t/00base.t（1 个 .t，49 个断言，本地 make test 实测 49/49 通过）
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: "t/00base.t"
    count: 49

# test_package 自带的验证（消费者视角）
test_package_verification:
  - command: "perl -e 'use XML::NamespaceSupport; ...'"
    expect: "OK: XML::NamespaceSupport API ok"
