# test_package/MANIFEST.yml
# 上游官方测试声明文件

package: physunits/1.4.0
homepage: "https://github.com/martinmoene/PhysUnits-CT-Cpp11"

# 上游测试命令 (用于 ctest -N 分析)
upstream_check_command: "ctest -N"

# conanfile.py build() 方法中已集成上游测试 (cmake.test())
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure"

# 上游实际运行的测试: lest 框架, CMake 按 c++11/14/17/20 生成 4 个可执行文件
# (physunits-cpp{11,14,17,20}.t); 每个可执行文件运行同一 30 个 lest 用例
# (456 条 passed expectation, 0 failed, 0 skipped), ctest 4/4 通过
upstream_tests:
  - file: test/physunits.t.cpp
    source: PhysUnits-CT-Cpp11-1.4.0/test/physunits.t.cpp
    description: "physunits 核心单元测试 (30 lest 用例: construction/assignment/arithmetic/comparison/function/prefix/literal/units)"
    command: "ctest -R test-cpp11"
  - file: test/physunits-main.t.cpp
    source: PhysUnits-CT-Cpp11-1.4.0/test/physunits-main.t.cpp
    description: "测试主函数入口 (lest 框架 main)"
    command: "ctest -R test-cpp11"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_physunits.cpp
    description: "消费者测试: include phys/units/quantity.hpp, 量纲字面量 + 量纲加减乘除 + .to(unit) + magnitude() API"
    command: "./test_physunits"

# 断言总数: 每个标准可执行文件 456 条 passed expectation (4 标准合计 1824)
assertion_count: 456
