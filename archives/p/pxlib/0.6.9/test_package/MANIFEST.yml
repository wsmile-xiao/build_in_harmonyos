# test_package MANIFEST — pxlib 0.6.9
# 声明上游官方测试来源。pxlib 上游无自动化测试入口：
#   - CMakeLists.txt 无 enable_testing() / add_test()
#   - Makefile.am 无 TESTS=
#   - 仓库无 tests/ 目录
# 故 upstream 声明为 none；test_package 提供 2 个测试（1 通用 C ABI 冒烟
# PX_new + PX_open_file，1 鸿蒙特有 test_ohos）。

package: pxlib
version: 0.6.9
build_system: cmake

upstream:
  has_tests: false
  test_framework: none
  note: >-
    Upstream pxlib 0.6.9 ships no automated test suite
    (no CTest registration, no tests/ directory, no TESTS= target
    in Makefile.am). See PR #11216 for evidence.

test_package:
  framework: cmake
  type: smoke
  count: 2
  harmony_specific_count: 1   # test_ohos: OHOS toolchain identity + read-only /tmp (HMDFS) + $HOME/tmp fallback
  files:
    - test_pxlib.c   # PX_new() + PX_open_file() against a minimal valid Paradox 4.x header
    - test_ohos.c    # HarmonyOS PC native: OHOS_TARGET identity, EROFS on /tmp, $HOME/tmp scratch via PX_open_file()
