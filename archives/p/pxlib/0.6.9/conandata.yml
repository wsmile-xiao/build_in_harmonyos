sources:
  url: "https://deb.debian.org/debian/pool/main/p/pxlib/pxlib_0.6.9.orig.tar.gz"
  sha256: "ab1ac57ed55a7cf5c0f8dbe5c053088120e3adcbb1950bd36dc5d8995258fcaa"

# Upstream CMakeLists.txt fixes are applied via the patches below
# (no install() rules are handled separately in conanfile.py package()).
patches:
  - patch_file: "patches/0001-fix-version-macro-0.6.9.patch"
    patch_description: "Release tarball pins PXLIB_MICRO_VERSION to 8; the 0.6.9 tag must be used"
    patch_type: "portability"
  - patch_file: "patches/0002-honor-BUILD_SHARED_LIBS.patch"
    patch_description: "Upstream add_library() hardcodes SHARED; drop it so the conan shared option is honored"
    patch_type: "portability"
