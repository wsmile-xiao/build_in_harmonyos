version: "0.6.9"
software: "pxlib"
status: built
build_date: "2026-09-19"
build_system: "cmake"

source:
  url: "https://deb.debian.org/debian/pool/main/p/pxlib/pxlib_0.6.9.orig.tar.gz"
  sha256: "ab1ac57ed55a7cf5c0f8dbe5c053088120e3adcbb1950bd36dc5d8995258fcaa"
  tar_format: tar.gz

build:
  system: cmake
  configure_options:
    - "-DCMAKE_BUILD_TYPE=Release"
  dependencies: []
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-fix-version-macro-0.6.9.patch"
  - "0002-honor-BUILD_SHARED_LIBS.patch"

knowledge_gained:
  - "No install() rules in upstream CMakeLists.txt -> manual copy in package()"
  - "Upstream version macro pinned to 0.6.8, patched to 0.6.9"
  - "Generated public headers (paradox.h, paradox-gsf.h, pxversion.h) must ship from CMAKE_BINARY_DIR/include"
  - "OHOS /tmp is read-only (HMDFS); test scratch paths must use $HOME/tmp, asserted by test_ohos"

tests:
  upstream: 0
  test_package: 2
  harmony_specific: 1   # test_ohos: OHOS toolchain identity, EROFS /tmp, $HOME/tmp fallback
