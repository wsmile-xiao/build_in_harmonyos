software: pxlib
display: "pxlib Paradox database library"
description: "C library for reading and writing Paradox database files"
category: database
homepage: "https://pxlib.sourceforge.net/"
license: LGPL-2.1
build_system: cmake

ohos_adaptation:
  key_points:
    - "No mandatory third-party conan dependencies (iconv is the OHOS musl system library)"
    - "Optional libgsf-1 support stays disabled (ENABLE_GSF=OFF, upstream default)"
    - "Upstream CMakeLists.txt has no install() rules and hardcodes version 0.6.8; both fixed via patches"
    - "Public headers paradox.h / paradox-gsf.h / pxversion.h are generated at build time from *.h.in"
  common_dependencies:
    - iconv (system)

versions:
  "0.6.9":
    status: built
    build_date: "2026-09-19"
    upstream_version: "0.6.9"
    source_url: "https://deb.debian.org/debian/pool/main/p/pxlib/pxlib_0.6.9.orig.tar.gz"
