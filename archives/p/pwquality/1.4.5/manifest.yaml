# 版本级 manifest — pwquality 1.4.5
# 遵循 ARCHIVE-SPEC v3.0

version: "1.4.5"

software: pwquality

status: built

build_date: "2026-09-16"
build_system: autotools

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/libpwquality/libpwquality/releases/download/libpwquality-1.4.5/libpwquality-1.4.5.tar.bz2"
  sha256: "6fcf18b75d305d99d04d2e42982ed5b787a081af2842220ed63287a2d6a10988"
  compression: tar.bz2
  archive_root: "libpwquality-1.4.5"

# ============================================================
# 依赖信息
# ============================================================

dependencies:
  required:
    - "cracklib/2.10.3（configure 默认必需：AC_CHECK_LIB([crack],[FascistCheck])，缺失即报 No or unusable cracklib library）"
  optional:
    - "linux-pam/1.7.2（PAM 模块；本适配显式 --disable-pam，见 build_config.notes）"
  rejected:
    - "libintl/0.26.1（曾引入；实测 ohpcd 的 libintl.so.8 把 gettext/dgettext/bindtextdomain 全列为**未定义符号**，-lintl 链接即报 undefined reference；本构建本就 --disable-nls，故移除）"

# ============================================================
# 构建配置
# ============================================================

build_config:
  target: aarch64-unknown-linux-ohos
  options:
    - "shared=True（默认）"
    - "--disable-nls（libintl 经 AutotoolsDeps 注入）"
    - "--disable-pam（PAM 模块属系统 secure-lib，含消费方配置，超出本包范围）"
    - "--disable-python-bindings（上游默认 yes；binding 另在 Python 侧覆盖）"
    - "--disable-static"
    - "make -j1（R9：HMDFS jobserver fifo EPERM，见 E074）"
  notes: >-
    不用 --build/--host 硬编码（本仓铁律，scripts/patch-autotools-ohos.pl 头部明确禁止），
    改为 patch config.guess/config.sub 让其自行识别 OHOS；另把 configure 内 umask 077
    放宽为 022（HMDFS 拒绝向 700 临时目录写入，cracklib 同款陷阱）。

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "patches/0001-config-guess-sub-ohos.patch（portability，旧版 2018 世代格式）"

# ============================================================
# 兼容性
# ============================================================

compatibility:
  level: low
  issues: []
  notes: >-
    纯 C（autotools），依赖 cracklib 与 libintl 均已发布到 ohpcd，无缺口。
    交付 libpwquality.so + pwquality.h + pwquality.pc + pwscore/pwmake。

# ============================================================
# 测试结果
# ============================================================

test_results:
  type: manual
  passed: 0
  failed: 0
  note: |
    上游**未提供 make check 测试**（顶层与 src/Makefile.am 均无 TESTS / check_PROGRAMS，
    实测确认）——如实申报，非"环境不可用"。
    适配后：test_package R34 以真实 C 程序链接打包的头与库，覆盖
    pwquality_default_settings / set-get_int_value 往返 / pwquality_check
    （强密码通过、过短密码拒绝并产出 strerror 消息）/ pwquality_generate
    的 generate→check 闭环 / free_settings；并实测 pkg-config 契约
    （--modversion=1.4.5、--libs 含 -lpwquality）与 CLI 工具 pwscore/pwmake 真实输出。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - >-
    上游 release 资产是 .tar.bz2（含预生成 configure），而 codeload 的
    /archive/refs/tags/*.tar.gz **不含** configure（需 autoreconf）——优先取 release 资产
  - >-
    仓内 scripts/patch-autotools-ohos.pl 只适配新版 config.guess/config.sub；
    2018 世代（无 GUESS= 变量、config.sub 无 linux-ohos 模式）只打中 1/5，
    需按旧版格式手工补（config.guess 分支自行 echo+exit）
  - >-
    pwquality 的 cracklib 依赖是**默认必需**（configure 直接 error），
    不能靠"没找到就跳过"；PAM 依赖才是可选（enable_pam=check）

references:
  - https://github.com/libpwquality/libpwquality
