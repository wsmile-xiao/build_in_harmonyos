# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: pwquality/1.4.5
homepage: "https://github.com/libpwquality/libpwquality"

# 上游测试命令 — **上游未提供测试**（经深度核查，非"环境不可用"）
#
# 六项独立证据（2026-09-17 实测）：
#   ① 目录树无测试目录：顶层 SUBDIRS = po src doc（+ python），全树无 tests/ 或 check/
#   ② 全树无测试声明：grep -rnE '^\s*(TESTS|check_PROGRAMS|check_SCRIPTS|
#      check_LTLIBRARIES|dist_check_SCRIPTS|TEST_EXTENSIONS)' 所有 Makefile.am → 0 命中
#   ③ configure.ac 无测试基础设施：无 AC_CONFIG_TESTDIR / --enable-test / TESTS
#   ④ 实际跑 make check：全部子目录报 "Nothing to be done for 'check'"，rc=0
#   ⑤ 无测试源文件：find 全树 *.t / test* / *test* / check* 仅得
#      m4/progtest.m4（autoconf 宏）与 src/check.c（**主力 API 实现**，非测试）
#   ⑥ python/ 绑定目录只有 setup.py + pwquality.c，无任何 py 测试
# 即 `make check` 结构性无可跑用例——如实申报，且**不是**因环境缺失而跳过。
upstream_check_command: ""  # 上游未提供测试（结构性缺失，证据见上）
upstream_test_in_build: false
upstream_test_command: ""   # 同上

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_pwquality.py
    description: >-
      消费者测试：真实 API（R34）——用 C 编译器链接**打包的** pwquality.h 与
      libpwquality.so 编译并运行一个 C 程序，覆盖：pwquality_default_settings；
      set/get PWQ_SETTING_MIN_LENGTH 往返（12）；pwquality_check 对强密码返回
      score>=0；对过短密码返回负值并经 pwquality_strerror 产出非空消息；
      pwquality_generate 生成密码后**回灌 pwquality_check 验证**（generate→check
      闭环）；free_settings。另实测 pkg-config 契约（--modversion 为 1.4.5、
      --libs 含 -lpwquality），并真实执行 CLI 工具 pwscore（stdin 喂密码得分数）
      与 pwmake 64（产出密码长度校验）。
    command: "python3 test_pwquality.py <pkg_dir>"

# 测试断言总数
# 口径 = C 侧 23 个断言点（failures++）+ Python 侧 9 个 assert + 7 个前置守护检查 = 39
assertion_count: 39
