# conandata.yml — pwquality 1.4.5
# 源码来自 GitHub 官方 release 资产（.tar.bz2，含**预生成 configure**，R39 合规）

sources:
  url: "https://github.com/libpwquality/libpwquality/releases/download/libpwquality-1.4.5/libpwquality-1.4.5.tar.bz2"
  sha256: "6fcf18b75d305d99d04d2e42982ed5b787a081af2842220ed63287a2d6a10988"

patches:
  # 上游 config.guess 是 2018 世代（无 GUESS= 变量、config.sub 无 linux-ohos 模式），
  # 仓内 scripts/patch-autotools-ohos.pl 对该世代只打中 1/5，故按**旧版格式**手工补：
  #   config.guess 插入自行 echo+exit 的 *:HarmonyOS:*:*) 分支；
  #   config.sub 在 maybe_os 列表与 os 合法性列表各加 linux-ohos*。
  # 目的：让 configure 自行识别 aarch64-unknown-linux-ohos，
  # 从而**不必**用 --build/--host 硬编码（本仓铁律，见该脚本头部注释）。
  # 实测：补丁后 config.guess 输出 aarch64-unknown-linux-ohos，
  #      config.sub 同时接受 aarch64-unknown-linux-ohos 与 aarch64-linux-ohos。
  - patch_file: "patches/0001-config-guess-sub-ohos.patch"
    patch_description: "config.guess/config.sub 增加 HarmonyOS/linux-ohos 识别（旧版 2018 世代格式）"
    patch_type: "portability"
