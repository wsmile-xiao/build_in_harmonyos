# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: presage/0.9.1
homepage: "https://presage.sourceforge.net/"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "autotools.make(target=\"check\")（build() 内，configure && make -j1 && make check 全链）"

# 上游实际运行的测试程序（automake TESTS 单元共 9 个：8 个 cppunit runner + 1 个 integration 脚本，
# 本机 make check 全部 PASS）
upstream_tests:
  - file: test/testRunner.cpp
    source: presage-0.9.1/test/testRunner.cpp
    description: "CppUnit 默认 registry 聚合 runner（该 TU 自身注册 0 用例，空跑通过）"
    command: "./test/testRunner"
  - file: test/lib/core/coreTestRunner.cpp
    source: presage-0.9.1/test/lib/core/coreTestRunner.cpp
    description: "core 套件 31 用例（suggestion/prediction/selector/profile/profileManager/meritocracy/logger/variable/configuration/combiner/predictorRegistry）"
    command: "./test/lib/core/coreTestRunner"
  - file: test/lib/core/context_tracker/contextTrackerTestRunner
    source: presage-0.9.1/test/lib/core/context_tracker/
    description: "context tracker 套件 11 用例（contextTracker 8 + contextChangeDetector 3）"
    command: "./test/lib/core/context_tracker/contextTrackerTestRunner"
  - file: test/lib/core/tokenizer/tokenizerTestRunner
    source: presage-0.9.1/test/lib/core/tokenizer/
    description: "tokenizer 套件 16 用例（forward 6 + reverse 6 + crossCheck 3 + stringForward 1）"
    command: "./test/lib/core/tokenizer/tokenizerTestRunner"
  - file: test/lib/predictors/predictorsTestRunner
    source: presage-0.9.1/test/lib/predictors/
    description: "predictor 套件 11 用例（smoothedNgram 8 + abbreviationExpansion 3）"
    command: "./test/lib/predictors/predictorsTestRunner"
  - file: test/lib/predictors/newPredictorsTestRunner
    source: presage-0.9.1/test/lib/predictors/
    description: "new predictor 套件 7 用例（recency 3 + newSmoothedNgram 3 + dejavu 1）"
    command: "./test/lib/predictors/newPredictorsTestRunner"
  - file: test/lib/predictors/dbconnector/dbconnectorTestRunner
    source: presage-0.9.1/test/lib/predictors/dbconnector/
    description: "sqlite dbconnector 套件 14 用例（databaseConnector 7 + sqliteDatabaseConnector 7；databaseConnectorTest.h 另有 1 个上游注释停用宏 testSanitizeString）"
    command: "./test/lib/predictors/dbconnector/dbconnectorTestRunner"
  - file: test/tools/toolsTestRunner
    source: presage-0.9.1/test/tools/
    description: "text2ngram 工具套件 3 用例"
    command: "./test/tools/toolsTestRunner"
  - file: test/integration/integration.sh
    source: presage-0.9.1/test/integration/integration.sh
    description: "端到端集成：训练语料=随包 COPYING（TRAINING_CORPUS=${srcdir}/../../COPYING，非 fixture 捏造），text2ngram 建 n=1/2/3 sqlite 库 → presage_simulator 跑 KSR 打分，本机 KSR=81.6364 PASS"
    command: "./test/integration/integration.sh"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "真实消费者 6 断言：presage_new_with_config 建上下文 / presage_predict 返回恰好 6 个候选（训练 DB 内容指纹）/ 首候选非空 / presage_config 指纹 SUGGESTIONS==6 / presage_learn 在线学习往返"
    command: "./test_presage <生成的 profile.xml>（test() 内 self.run 直跑，HOME 隔离到 build 目录）"

# 测试断言总数
# cppunit 源码断言宏静态清点（近似值, 用于质量评估）:
#   CPPUNIT_ASSERT 91 + CPPUNIT_ASSERT_EQUAL 188 + CPPUNIT_ASSERT_EQUAL_MESSAGE 3
#   + CPPUNIT_ASSERT_NO_THROW 7 + CPPUNIT_ASSERT_THROW 3 = 292
# （cppunit 成功路径不打印运行期断言总数，故登记静态宏数并注明口径）
assertion_count: 292
