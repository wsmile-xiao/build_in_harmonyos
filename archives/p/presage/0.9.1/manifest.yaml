# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "AM_PATH_CPPUNIT（m4/cppunit.m4）只认 cppunit-config 可执行；conan cppunit 无此文件时 HAVE_CPPUNIT 静默为空、94 上游单测不构建而 make check 仍绿（假绿面）——配方生成 cppunit-config shim" # knowledge_ref: E694
  - "ProfileManager::get_user_home_dir 把 getpwuid 判空写反（!my_passwd 分支解引用 pw_dir）；OHOS 无 passwd 库必崩、常规 Linux 因 getpwuid 命中而掩盖——上游 bug 删 !" # knowledge_ref: E702
  - "config.status (umask 077 && mktemp -d ./confXXXXXX) 产出 0700 临时目录在 HMDFS uid 映射下拒写（subs1.awk Permission denied）；GNU mktemp 恒 0700 不吃 umask 放宽，须禁 mktemp 分支走 mkdir fallback + umask 002 双保险" # knowledge_ref: E011
  - "config.guess（2012）不识 uname -s=HarmonyOS → cannot guess build type；并入 aarch64:Linux 分支即可（config.sub 已认 aarch64-unknown-linux-gnu）" # knowledge_ref: DRAFT-libicns-0.9.0-modern-config-guess-ohos-hmdfs
  - "AC_PROG_CXX 候选表不含 clang++，14 候选落空后回退 g++ → g++: inaccessible or not found（设备仅 clang）；须显式 CC/CXX（conan 面由 profile compiler_executables 覆盖）" # knowledge_ref: E095
  - "conan ncurses 6.6 仅交付 *w 库名，上游 AC_CHECK_LIB([curses]) 求 -lcurses 基名会静默跳过 presage_demo——libcurses.a→libncursesw.a symlink shim（LIBRARY_PATH 已探针验证）" # knowledge_ref: E694

