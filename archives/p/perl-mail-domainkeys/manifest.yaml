software: perl-mail-domainkeys
# 软件级 manifest 模板
# 文件位置: archives/p/perl-mail-domainkeys/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件描述
# ============================================================

description: |
  Yahoo DomainKeys 邹件签名协议的 Perl 实现。
  ⚠️ 已弃用（UNSUPPORTED），推荐使用 Mail::DKIM。

category: perl-mail
license: GPL/Artistic

# ============================================================
# 替代方案
# ============================================================

deprecated: true
recommended_alternative: perl-mail-dkim
alternative_version: 1.20240923

# ============================================================
# 版本索引
# ============================================================

versions:
  - version: "1.0"
    build_date: "2026-06-15"
    status: built
    package: perl-mail-domainkeys-1.0-ohos-aarch64.tar.gz
    notes: |
      编译成功，但运行时依赖 XS 模块（Crypt::OpenSSL::RSA）
      需管理员安装 XS 模块到系统目录

# ============================================================
# 关键依赖
# ============================================================

runtime_dependencies:
  required:
    - name: Crypt-OpenSSL-RSA
      version: "0.33"
      type: xs_module
      note: "需管理员安装到系统目录（SELinux HMDFS 限制）"
    - name: Crypt-OpenSSL-Random
      version: "0.15"
      type: xs_module
      note: "需管理员安装到系统目录"
  optional: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_points:
  - id: "XS_HMDFS_LIMIT"
    category: platform_limitation
    description: "XS 模块在 HMDFS 上受 SELinux 限制，hishell_hap 只能加载 hnp_file 类型"
    affected_modules:
      - Crypt::OpenSSL::RSA
      - Crypt::OpenSSL::Random
    solution: "管理员安装到 /data/service/hnp/"