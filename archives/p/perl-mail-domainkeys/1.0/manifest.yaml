software: perl-mail-domainkeys
# 版本级 manifest 模板
# 文件位置: archives/p/perl-mail-domainkeys/1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.0"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/A/AD/ADURSO/Mail-DomainKeys-1.0.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl
  build_system: ExtUtils-MakeMaker

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL"
    - "PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  # ⚠️ 运行时依赖 Crypt::OpenSSL::RSA 和 Crypt::OpenSSL::Random
  dependencies:
    - "perl-mailtools/2.22"       # Mail::Address
    - "perl-mime-base64/3.16"     # MIME::Base64
    - "perl-net-dns/1.55"         # Net::DNS >= 0.34
    - "Crypt-OpenSSL-RSA/0.33"    # XS 模块，需管理员安装
    - "Crypt-OpenSSL-Random/0.15" # XS 模块，需管理员安装

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 纯 Perl 模块，无补丁

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Mail::DomainKeys 已弃用（UNSUPPORTED），建议迁移到 Mail::DKIM"
  - "XS 模块 Crypt::OpenSSL::RSA 在 HMDFS 上受 SELinux 限制，需管理员安装"
  - "perl-mail-dkim 1.20240923 是现代替代方案"

# ============================================================
# 运行时限制
# ============================================================

runtime_limitations:
  - "XS 模块依赖: Crypt::OpenSSL::RSA 和 Crypt::OpenSSL::Random"
  - "SELinux HMDFS 限制: hishell_hap domain 只能加载 hnp_file 类型文件"
  - "解决方案: 需管理员将 XS 模块安装到系统目录 /data/service/hnp/"