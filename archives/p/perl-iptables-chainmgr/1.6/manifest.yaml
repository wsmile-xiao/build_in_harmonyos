software: perl-iptables-chainmgr
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.6"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-12"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/builds/IPTables-ChainMgr-1.6.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "PREFIX=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "perl-iptables-parse/1.6.1-r4"
    - "perl-netaddr-ip/4.079"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表（纯 Perl 模块，无需补丁）
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块编译简单：perl Makefile.PL + make"
  - "Perl 模块无 XS 代码时无需 OTHERLDFLAGS 参数"
  - "CPAN 模块命名格式：IPTables-ChainMgr（大写）而非 perl-iptables-chainmgr"
  - "版本号差异：任务要求 1.6-r4，CPAN 只有 1.6 版本"
  - "依赖缺失不影响编译，但影响测试和运行时功能"
  - "NetAddr::IP 纯 Perl 模式（-noxs）更简单，无需 XS 编译"
  - "Socket6 兼容包装器需要添加 getipnodebyname 函数支持"
  - "用户目录安装 + PERL5LIB 可绕过系统目录权限限制"
  - "依赖模块需从打包产物安装或单独编译"
