    pixd 1.0.0 为纯 C 单文件 CLI 工具（pixd.c），仅依赖标准 C 库（libc），无外部三方依赖。
    构建系统为上游 Makefile（非 autotools）：直接以 $(CC) $(CFLAGS) 编译 pixd.c 生成可执行文件 pixd，
