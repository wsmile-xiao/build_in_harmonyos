# test_package/MANIFEST.yml — pixd 1.0.0
# CI L0e requires this file to exist.

package: pixd/1.0.0
homepage: "https://github.com/FireyFly/pixd"

# pixd has no upstream test suite (plain-Makefile C project, no `make check` target)
upstream_check_command: "make check"
upstream_test_in_build: false
upstream_test_command: ""

# No upstream test programs exist in the v1.0.0 tarball
upstream_tests: []

# test_package tests (consumer + functional, all against the real pixd binary)
test_package_tests:
  - file: test_pixd.sh
    description: "Runs the installed pixd binary and asserts on real output. 消费者组 C1-C4（可执行性/PATH、--version 含 'pixd 1.0.0'、--help 含 'usage: pixd'、空 stdin 静默 exit 0）+ 功能组 F1-F12（stdin/文件渲染偏移列与 24-bit SGR、未知选项拒绝、-w 宽度改行结构 0010/0020、多文件 banner、-r 绝对 16-31 与相对 16+8 范围、-r 非法入参 stderr、PIXD_COLORS 256 色合法覆盖与非法拒绝、0xFF 字节→颜色映射、300 字节跨行偏移 0080/0100）。共 16 用例 / 38 断言，任一失败 exit != 0"
    command: "bash test_pixd.sh"

# Real assertion count performed by test_pixd.sh (16 cases, 38 low-level asserts)
assertion_count: 38
