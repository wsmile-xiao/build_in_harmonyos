name: python-gssapi
version: 1.8.3
status: built
date_compiled: 2026-05-21

# 编译环境
build_env:
  compiler: clang
  python: 3.12
  cython: 3.0.11
  platform: harmonyos-aarch64

# 依赖
dependencies:
  - krb5 1.22.2 (MIT Kerberos)
  - cffi 1.17.1
  - six 1.17.0
  - pyasn1 0.6.1

# 编译配置
configure_options:
  - GSSAPI_KRB5CONFIG=/storage/Users/currentUser/usr/local/bin/krb5-config
  - GSSAPI_SUPPORT_DETECT=false
  - CFLAGS=-I/storage/Users/currentUser/usr/local/include
  - LDFLAGS=-L/storage/Users/currentUser/usr/local/lib

# 构建系统
build_system: python_wheel

# 产物
artifacts:
  - python-gssapi-1.8.3-ohos-aarch64.tar.gz

# 质量门禁
quality_gates:
  G0: passed (clean build verification)
  G1: passed (binary integrity)
  G2: skipped (functional test requires krb5 setup)
  G3: passed (RPATH set correctly)
  G4: passed (archive integrity)

# 特殊处理
special_handling:
  - Disabled GSSAPI_SUPPORT_DETECT to avoid SELinux permission issues
  - Used Cython instead of cffi for better compatibility
  - Requires LD_LIBRARY_PATH to include Python lib directory