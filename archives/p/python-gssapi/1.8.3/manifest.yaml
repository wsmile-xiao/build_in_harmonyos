software: python-gssapi
version: 1.8.3
status: built
build_date: 2026-08-25

# 编译环境
build_env:
  compiler: clang 15
  python: 3.12.9
  cython: 3.3.0
  platform: harmonyos-aarch64

# 依赖
dependencies:
  - krb5/1.22.1 (MIT Kerberos, Conan)

# 编译配置
configure_options:
  - GSSAPI_KRB5CONFIG=<krb5_pkg>/bin/krb5-config
  - GSSAPI_SUPPORT_DETECT=false
  - GSSAPI_COMPILER_ARGS=-I<krb5_pkg>/include -DHAS_GSSAPI_EXT_H
  - GSSAPI_LINKER_ARGS=-L<krb5_pkg>/lib -L<python_prefix>/lib -lgssapi_krb5 -lkrb5 -lk5crypto -lcom_err

# 构建系统
build_system: python_setuptools_cython

# 质量门禁
quality_gates:
  W3_local_ci: passed (exit_code=0)
  conan_create: passed
  test_package: passed (30 .so modules + 11 .py files verified)

# 特殊处理
special_handling:
  - GSSAPI_SUPPORT_DETECT=false to avoid HarmonyOS SELinux permission issues (E046)
  - Compiler/linker args overridden via GSSAPI_COMPILER_ARGS/GSSAPI_LINKER_ARGS (krb5-config returns wrong paths)
  - Python lib path added to linker args for libpython3.12.so resolution
  - Runtime import test not possible due to MAC policy on newly-compiled .so files
  - test_package uses file existence check instead of runtime import
