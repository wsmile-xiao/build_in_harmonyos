# conandata.yml — pd-creb 0.10.0
#
# Source provenance (R39):
#   Upstream-Name   : CREB
#   Upstream-Contact: Tom Schouten <tom@zwizwa.be>
#   Canonical upstream VCS (Debian debian/copyright): http://zwizwa.be/darcs/creb/
#     -> darcs publishes no HTTP tarball service, so the canonical VCS itself cannot
#        serve a release archive.
#   The release tarball is published as the GitHub tag archive v0.10.0 of
#   https://github.com/electrickery/pd-creb, which is exactly the location Debian's own
#   debian/watch tracks for upstream releases:
#       https://github.com/electrickery/pd-creb/tags .*/v?@ANY_VERSION@@ARCHIVE_EXT@
#   Verified: that tag archive and Debian's pd-creb_0.10.0.orig.tar.gz are byte-identical
#   (cmp reports no difference; both sha256 = 64708aed...cd14), both unpack to
#   pd-creb-0.10.0/ and neither contains a debian/ directory. The sha256 below was
#   recomputed from both downloads.

sources:
  url: "https://github.com/electrickery/pd-creb/archive/refs/tags/v0.10.0.tar.gz"
  sha256: "64708aed9f585853dbe9b26d790c1084c378759707c84dc33ac04eefb8adcd14"

# Portability patches from Debian pd-creb 0.10.0-4 (debian/patches/series,
# applied in series order).  Author of the Debian patch set: IOhannes m zmölnig.
# They fix genuine upstream defects, nothing OHOS-specific, and contain no
# platform macros (R8):
#   0001 fix_spelling     - typo in a user-visible message
#   0002 fix-invalid-t_int - t_int was used where a plain int is meant; on Pd64 the
#                            two differ, so the original code mis-sized allocations
#   0003 error             - error() was removed from the Pd API, use pd_error()
#   0004 creb_object       - add the [creb] object that registers the abstraction path
#   0005 garray_getfloat   - garray_getfloatarray() is broken on LP64, use
#                            garray_getfloatwords()
#   0006 pd64              - float vs t_float under Pd64, use t_sample
#
# Only the unified-diff headers were regenerated, with
# `diff -u --label a/<path> --label b/<path>`, because Debian's own headers use
# a `pd-creb.orig/` -> `pd-creb/` prefix that Conan's patch_ng (strip=0 by
# default) cannot locate.  Hunk equivalence is proven, not assumed:
#   diff -r <patched with Debian originals, patch -p1> \
#          <patched with this series>   ->  trees identical
#
# The OHOS-specific work (toolchain injection, -lstdc++ removal, PDINCLUDEDIR)
# needs no patch at all and is done through make variables — see conanfile.py.
patches:
  "0.10.0":
    - patch_file: "patches/0001-fix-spelling.patch"
      patch_description: "Fix spelling mistake in the bdiag~ blocksize error message (IOhannes m zmölnig)"
      patch_type: "portability"
    - patch_file: "patches/0002-fix-invalid-t-int-use.patch"
      patch_description: "Use int instead of t_int where a plain int is meant (mis-sized allocations on Pd64) (IOhannes m zmölnig)"
      patch_type: "portability"
    - patch_file: "patches/0003-error.patch"
      patch_description: "Replace the removed error() Pd API with pd_error() (IOhannes m zmölnig)"
      patch_type: "portability"
    - patch_file: "patches/0004-creb-object.patch"
      patch_description: "Provide the [creb] object so the abstraction search path is registered on load (IOhannes m zmölnig)"
      patch_type: "portability"
    - patch_file: "patches/0005-garray-getfloat.patch"
      patch_description: "Use garray_getfloatwords() instead of the LP64-broken garray_getfloatarray() (IOhannes m zmölnig)"
      patch_type: "portability"
    - patch_file: "patches/0006-pd64.patch"
      patch_description: "Use t_sample instead of float so the code builds when t_float != float (Pd64) (IOhannes m zmölnig)"
      patch_type: "portability"