# test_package/MANIFEST.yml
# 上游测试用例声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
package: pd-creb/0.10.0
homepage: "https://zwizwa.be/creb"

# ---------------------------------------------------------------------------
# 上游测试清点（R51 证据 + 本轮复核更正）
# ---------------------------------------------------------------------------
# pd-creb 0.10.0 的发布 tarball 里带 unittests/：35 个单元测试补丁（.pd）与
# 35 个参考 .wav。其中 32 个文件名的后缀严格是 `-unittest.pd`（评审脚本实测的
# N=32 就是这一批），另外 3 个上游命名不规则：statwav~unittest.pd、
# tabreadmix~unittest.pd，以及文件名里带空格的那个
# "filterortho~subnormal-unittest .pd"。
#
# **更正上一版声明**：上一版写的是「上游可自动化执行的测试用例数 = 0」，
# 理由是「每个补丁都要在 Pd GUI 里打开、靠人耳判断，没有任何命令行 runner」。
# 这个结论是错的，评审 rule4 判 0/32 少报是对的。测量设备就是补丁里引用的
# `testtools/unit-test-frame~` 抽象：它在补丁加载时自动跑一遍，把被测对象的
# 输出录 512 个采样，和同目录的参考 .wav 逐点相减算标准差，然后自己把判定
# 打进 Pd 的 stdout：
#     STDDEV-ZERO / STDDEV-SMALL <v>   -> 通过（阈值 1e-05 是上游定的）
#     STDDEV-LARGE <v>                 -> 不通过
# 也就是说上游用例本来就能无头自动判定，缺的只是「谁来起 Pd、谁来读 stdout」。
# 详见 notes.md。
upstream_check_command: "none (upstream declares no make check/test target)"
upstream_test_in_build: false
upstream_test_command: >
  由 test_package/run_creb_unittests.py 驱动：每个补丁起一次无头 Pd
  （pd -nogui -noaudio -r 44100），等上游自己的判定行出现在 stdout 上。
