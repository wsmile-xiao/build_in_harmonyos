# 版本级 manifest
# 文件位置: archives/p/pd-creb/0.10.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

version: "0.10.0"
software: "pd-creb"

# published | built | failed | archived
status: built

build_date: "2026-10-04"

# 上游是 GNU make + vendored pd-lib-builder（无 configure/CMake）
build_system: makefile

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/electrickery/pd-creb/archive/refs/tags/v0.10.0.tar.gz"
  sha256: "64708aed9f585853dbe9b26d790c1084c378759707c84dc33ac04eefb8adcd14"
  tar_format: tar.gz
  upstream_root: "pd-creb-0.10.0"
  # 源码 URL 论证见 conandata.yml 头部与 notes.md：GitHub tag archive v0.10.0 就是
  # 上游发布归档，也正是 Debian debian/watch 跟踪的上游发布位置；实测它与 Debian
  # 的 pd-creb_0.10.0.orig.tar.gz 逐字节相同（cmp 无差异，sha256 一致，均解包为
  # pd-creb-0.10.0/ 且不含 debian/）。
  upstream_contact: "Tom Schouten <tom@zwizwa.be>"
  canonical_upstream_vcs: "http://zwizwa.be/darcs/creb/ (darcs, 不提供 HTTP tarball)"
  release_home: "https://github.com/electrickery/pd-creb/releases/tag/v0.10.0"
  verified_equivalent_to_debian_orig: >-
    cmp 无差异；两者 sha256 均为 64708aed...cd14；均解包为 pd-creb-0.10.0/ 且不含 debian/

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile
  entry: "Makefile -> pd-lib-builder/Makefile.pdlibbuilder"
  # 配方在 make 命令行上注入的变量（不使用 PLATFORM，也不打 vendored 补丁）
  make_variables:
    CC: "<tools.build:compiler_executables.c>"
    CXX: "<tools.build:compiler_executables.cpp>"
    PDINCLUDEDIR: "<puredata package_folder>/include/pd"
    cxx.ldlibs: "-lc -lm"
  make_variables_notes:
    cxx.ldlibs: "去掉 pd-lib-builder Linux 分支硬编码的 -lstdc++（OHOS 只有 libc++）"
    CC: "profile conf 里的 OHOS 工具链；缺失或路径不存在时配方直接抛异常，不回落宿主 gcc"
  # 刻意不设的变量及原因
  not_set:
    PLATFORM: "会让 pd-libbuilder 把 CC 改写成 $(PLATFORM)-gcc（OHOS 三联体无此工具）"
    PDDIR: "一旦定义，pd-libbuilder 会把 PDINCLUDEDIR 重算成 $(PDDIR)/src"
    CFLAGS: "pd-libbuilder 用 `CFLAGS = ...` 无条件赋值，env 里的 CFLAGS 会被覆盖"
  jobs: "tools.build:jobs，默认 1（本仓 make 配方惯例，CI profile 未设置该 conf）"
  dependencies:
    - puredata/0.54.1
  cc: clang
  cxx: clang++
  toolchain: "OHOS aarch64-linux-ohos clang 15（tools.build:compiler_executables 注入）"
  # 刻意偏离 code-style 的 library：载荷是 46 个 ET_DYN 的 dlopen 对象，无可链接归档（见 notes.md）
  package_type: shared-library

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-fix-spelling.patch"
  - "0002-fix-invalid-t-int-use.patch"
  - "0003-error.patch"
  - "0004-creb-object.patch"
  - "0005-garray-getfloat.patch"
  - "0006-pd64.patch"
patches_source: "Debian pd-creb 0.10.0-4 debian/patches（series 顺序，作者 IOhannes m zmölnig）"
patches_provenance: >-
  六个补丁的 hunk 内容与 Debian 原补丁等价，仅 unified-diff 头用
  `diff -u --label a/<path> --label b/<path>` 机器重生成（Debian 原文件用
  pd-creb.orig/ -> pd-creb/ 前缀，Conan patch() 默认 strip=0 找不到源文件）。
  等价性已证明而非假设：把 Debian 原补丁（patch -p1）与本系列分别打到两份
  原始树上再 `diff -r`，结果为 trees identical。
patches_platform_macros: "无（补丁新增行内不含 __OHOS__ 等平台宏，R8 合规）"

# ============================================================
# 产物
# ============================================================

artifacts:
  payload_dir: "lib/pd-externals/creb/"
  total_files: 182   # 递归口径（顶层 179）
  pd_objects: 46        # <class>.pd_linux，ELF64 / EM_AARCH64 / ET_DYN
  pd_files_total: 129   # 顶层口径（= 纯抽象 49 + *-help.pd 80；递归口径 131，另有 2 个 .pd 在 examples/ 下）
  abstractions: 49      # *.pd，不含 *-help.pd
  help_patches: 80      # *-help.pd
  extra_dirs: ["manual/", "examples/"]
  data_files: ["creb-meta.pd", "COPYING", "TODO", "CHANGES.LOG", "README"]
  licenses: ["licenses/COPYING"]
  package_size: "整包 5.6M（载荷目录 5.5M）"
  link_deps:                 # 两种合法的 OHOS C++ 运行时链接模型（见 notes.md）
    local_profile: ["libc.so"]                     # driver 静态附 libc++abi.a + libc++.a
    ci_profile:   ["libc.so", "libc++_shared.so"] # NDK driver 动态链接 libc++_shared.so
  never:                     # 出现即说明链到了 glibc 宿主
    - "libc.so.6"
    - "libm.so.6"
    - "libpthread.so.0"
    - "libdl.so.2"
  rpath: "$ORIGIN"
  entry_symbol: "<class>_setup（Pd dlsym 查找；~ → _tilde）"
  no_commands_json: >-
    R38 只要求「产物含可执行文件」时声明 commands.json。载荷是 46 个
    dlopen 用的共享对象（ELF Type=DYN，非可执行文件），配方
    cpp_info.bindirs 为空，故不声明 commands.json（本地门禁 L0k 亦判
    "library package, commands.json not required"）。

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "Conan 2 的 VirtualBuildEnv 不会把 tools.build:compiler_executables 变成 CC/CXX，且 conan create 阶段 env=\"conanbuild\" 拿不到聚合后的 conanbuild.sh —— 裸 make 会静默回落宿主 /usr/bin/cc 打出 x86-64 产物"
  - "pd-lib-builder 的 Linux 分支把 C++ 链接库硬编码为 -lc -lm -lstdc++；OHOS 只有 libc++，必须用 make 命令行覆盖 cxx.ldlibs"
  - "pd-lib-builder 一旦定义 PDDIR 就把 PDINCLUDEDIR 重算为 $(PDDIR)/src，交叉编译只应传 PDINCLUDEDIR"
  - "PLATFORM= 不能用于 OHOS：pd-lib-builder 会据此把 CC 改写成 $(PLATFORM)-gcc"
  - "Pd externals 的加载契约：每个 <class>.pd_linux 需导出 <class>_setup（~→_tilde），其余 Pd C API 由宿主 pd 进程在 dlopen 时解析"
  - "Debian 的 a:b 前缀补丁（pkg.orig/ -> pkg/）与 Conan patch() 默认 strip=0 不兼容，须用 diff -u --label a/ --label b/ 机器重生成并用 diff -r 证明等价"
  - "upstream modules/eblosc~.c 没有 *_setup 入口（Debian 官方 arm64 包同样如此），属上游缺陷而非适配缺陷"
  - "creb 的规范上游是 darcs 仓库，无 HTTP tarball；这类包的源码只能取权威发行版镜像并按 R39 例外说明"