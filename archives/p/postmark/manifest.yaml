software: postmark
display: "NetApp PostMark filesystem benchmark"
description: "NetApp PostMark 磁盘 I/O 基准工具：模拟小文件密集工作负载（创建/读/追加/删除），输出吞吐与延迟报告"
category: tool
homepage: "https://packages.debian.org/source/sid/postmark"
license: Artistic-1.0
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 构建（单文件 C，make CC=clang -j1 postmark），无 configure"
    - "getwd() 为废弃 POSIX API，OHOS bionic libc 无此符号，改用标准 getcwd(x,MAX_LINE)（E727）"
    - "上游官方 SLAC 网页源已从互联网消失，采用 Debian 权威快照源（snapshot.debian.org orig tarball）"
    - "上游无测试套件，由 test_package 端到端 benchmark 验证（4 项断言）"
    - "Windows 专属头（direct.h/io.h）在 #ifdef _WIN32 保护下，OHOS 走 #else 分支（getwd→getcwd）"
  common_dependencies: []

versions:
  "1.53":
    status: built
    build_date: "2026-09-26"
    source_url: "https://snapshot.debian.org/archive/debian/20120803T161656Z/pool/main/p/postmark/postmark_1.53.orig.tar.gz"
