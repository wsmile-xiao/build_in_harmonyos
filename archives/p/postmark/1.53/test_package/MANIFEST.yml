# test_package/MANIFEST.yml
# 上游官方测试声明文件
# postmark 1.53 上游：NetApp PostMark 磁盘基准，单文件 C 程序（postmark-1.53.c + Makefile）。
# 上游无独立测试目录、无 ctest/pytest 注册、Makefile 无 check/test 目标（已实测 grep 无命中）。

package: postmark/1.53
homepage: "https://packages.debian.org/source/sid/postmark"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: ""

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (上游无测试, 声明为空)
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证, 调用已安装二进制)
test_package_tests:
  - file: test.sh
    description: "消费者测试 — 用最小配置（20 文件/10 事务）运行 postmark 完整 benchmark，验证 banner、事务摘要、Files 块与退出码 0"
    command: "bash test.sh"

# 测试断言总数 (test.sh 内 4 项检查: banner / transactions per-second 摘要 / Files 块 / exit 0)
assertion_count: 4
