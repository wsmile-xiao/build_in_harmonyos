software: pacman
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/7.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "7.1"

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: meson

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "/storage/Users/currentUser/pacman-7.1.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: meson

  # 配置选项列表
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "openssl/3.4.0"
    - "curl/8.14.1"
    - "libarchive/3.7.4"
    - "gettext/0.22.5"
    - "xz/5.6.3"
    - "gpgme/1.24.0"
    - "libgpg-error/1.55"

  # 编译器
  cc: /data/service/hnp/bin/clang
  cxx: /data/service/hnp/bin/clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "pacman 使用 meson 构建系统，需要 OHOS SDK clang wrapper"
  - "libintl.h 将 dgettext 重定义为 g_libintl_dgettext，需要链接 libintl_glib.so 而非 libintl.so"
  - "libcurl.pc 错误声明 libunwind.a 依赖，需要手动移除"
  - "liblzma.so.5 缺失时 libarchive 无法运行，需要从预编译包安装"
  - "GPGME 签名支持可通过安装 gpgme 预编译包启用"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"
