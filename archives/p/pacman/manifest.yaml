software: pacman
# 软件级 manifest - 归档索引
# 文件位置: archives/p/pacman/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件描述
# ============================================================

description: |
  pacman 是 Arch Linux 的官方包管理器，提供完整的包管理功能，
  包括安装、删除、查询、升级等操作。

# ============================================================
# 版本索引
# ============================================================

versions:
  7.1:
    status: published
    build_date: "2026-06-09"
    build_system: meson
    features:
      - GPGME 签名支持已启用
      - libalpm 库 API
      - pacman-conf 配置工具
    dependencies:
      - openssl/3.4.0
      - curl/8.14.1
      - libarchive/3.7.4
      - gettext/0.22.5
      - xz/5.6.3
      - gpgme/1.24.0
      - libgpg-error/1.55

# ============================================================
# 分类信息
# ============================================================

category: system
tags:
  - package-manager
  - arch-linux
  - libalpm

# ============================================================
# 来源信息
# ============================================================

homepage: https://archlinux.org/pacman/
source_url: https://gitlab.archlinux.org/pacman/pacman