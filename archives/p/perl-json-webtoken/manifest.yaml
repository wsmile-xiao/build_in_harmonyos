software: perl-json-webtoken
display: "JSON::WebToken"
description: "Perl module for JSON Web Token (JWT) encoding and decoding"
category: crypto
homepage: "https://metacpan.org/pod/JSON::WebToken"
license: Artistic-2.0
build_system: perl

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无需 XS 编译"
    - "使用 ExtUtils::MakeMaker 替代 Module::Build"
    - "无 HMDFS 加载限制，预编译包可直接使用"
  common_dependencies:
    - perl
    - json
    - module-runtime

# 版本索引（所有已归档版本，含状态）
versions:
  "0.10-r5":
    status: published
    build_date: "2026-06-12"
    published_as: perl-json-webtoken