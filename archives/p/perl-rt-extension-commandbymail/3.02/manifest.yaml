# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "RT::Extension::CommandByMail 是纯 Perl 模块，无需 XS 编译，不受鸿蒙 CRT 文件缺失影响"
  - "原始 Makefile.PL 使用 Module::Install + RTx()，需要 RT 在 configure 时已安装；替换为标准 EUMM Makefile.PL 可绕过此限制"
  - "参考 perl-dbd-pg 编译经验：纯 Perl 模块在鸿蒙平台无需特殊链接参数（-nostartfiles 等），仅需标准 Makefile.PL 流程"
  - "模块运行时依赖 RT (Request Tracker)，打包阶段仅需安装 .pm 文件，RT 在运行时由用户环境提供"
  - "Conan 2.29.1 (OHOS 适配版) 的 apply_conandata_patches 可能不正确传递补丁文件，需在 build() 中添加 fallback 机制"

