package: parafly/0.1.0
homepage: "https://github.com/ParaFly/ParaFly"

upstream_check_command: "make -C test test"
upstream_test_in_build: true
upstream_test_command: "make -C test test"
upstream_tests:
  - file: test/Makefile
    source: ParaFly-0.1.0/test/Makefile
    description: "Runs 10 upstream command entries; the recipe replaces the build copy's bin/ParaFly with the rebuilt HarmonyOS executable before invoking test/Makefile"
    command: "make -C test test"

test_package_tests:
  - file: test.sh
    description: "Consumer dispatches three commands through the installed ParaFly and checks completion records"
    command: "bash test.sh"

assertion_count: 15
