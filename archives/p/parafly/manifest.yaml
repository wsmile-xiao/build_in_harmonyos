software: parafly
display: "ParaFly"
description: "Parallel command processing utility using OpenMP"
category: build-tool
homepage: "https://github.com/ParaFly/ParaFly"
license: BSD-3-Clause
build_system: autotools
ohos_adaptation:
  key_points:
    - "E127: use the SDK-provided OpenMP runtime instead of building libomp, whose pthread_cancel APIs are unavailable on OHOS"
    - "The SDK omp.h is outside Clang's default include path; derive its include directory from the configured compiler sysroot"
  common_dependencies: []
versions:
  "0.1.0":
    status: built
    build_date: "2026-09-29"
    conan_ref: "parafly/0.1.0"
