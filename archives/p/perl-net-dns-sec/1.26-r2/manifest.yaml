software: perl-net-dns-sec
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.26-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.26-r2"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-25"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/N/NL/NLNETLABS/Net-DNS-SEC-1.26.tar.gz"

  # 源码校验和
  sha256: "88592c65487fb7b4d05134f2f9c48e649a9cd533a8493c50189b649b4ea711a6"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: autotools

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "clang 18 无 sysroot，CCFLAGS 需添加 -isystem <sysroot>/include 解决 sys/types.h 等头文件找不到"
  - "OpenHarmony 缺 crti.o/crtn.o，XS .so 链接需 -nostartfiles -nodefaultlibs -lc workaround"
  - "XS .so 运行时因 SELinux 限制无法 dlopen 加载（所有用户可写路径均被阻止）"
  - "加密子模块 (RSA/ECDSA/DSA/EdDSA/Digest) 在 BEGIN 块中 die 如果 XS 不可用，无纯 Perl 加密回退"
  - "功能测试结论: 编译成功但核心 DNSSEC 加密功能不可用，仅模块加载/工具函数/DS/DNSKEY/Keyset/Private 可用"
