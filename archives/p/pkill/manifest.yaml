software: pkill
display: "pkill"
description: "按进程名发送信号的工具（来自 procps-ng）"
category: system
homepage: "https://gitlab.com/procps-ng/procps"
license: GPL-2.0-or-later
build_system: custom

ohos_adaptation:
  key_points:
    - "autotools config.status 在 HMDFS 上失败，改用手动编译"
    - "musl libc 下 __fpending 宏需要补丁修复"
    - "sort.h 缺少 #include <stddef.h>，musl 下 size_t 未定义"
    - "library/meminfo.c 和 vmstat.c 使用 hsearch_data，musl 不支持，编译时跳过"
    - "终端工具静态链接 (R26)"
  common_dependencies: []

versions:
  "4.0.6":
    status: built
    build_date: "2026-07-08"
    conan_ref: "pkill/4.0.6"
