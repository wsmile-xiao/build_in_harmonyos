# test_package/MANIFEST.yml — pkill 4.0.6
package: pkill/4.0.6
homepage: "https://gitlab.com/procps-ng/procps"

# 上游测试命令
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: testsuite/pkill.test
    source: procps-ng-4.0.6/testsuite/pkill.test
    description: "上游 pkill 功能测试"
    command: "make check TESTS=pkill.test"

# test_package 中自带的测试
test_package_tests:
  - file: test.c
    description: "消费者测试: 验证包可消费 + pkill -V 可执行"
    command: "./test_pkill"

# 测试断言总数
assertion_count: 2
