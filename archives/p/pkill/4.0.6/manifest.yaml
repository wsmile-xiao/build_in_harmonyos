# 版本级 manifest
# 文件位置: archives/{letter}/{name}/4.0.6/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

# ============================================================
# 必须字段
# ============================================================

version: "4.0.6"
status: published
build_date: "2026-07-08"
conan_ref: "pkill/4.0.6"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://sourceforge.net/projects/procps-ng/files/Production/procps-ng-4.0.6.tar.xz/download"
  sha256: "67bea6fbc3a42a535a0230c9e891e5ddfb4d9d39422d46565a2990d1ace15216"
  tar_format: tar.xz

# ============================================================
# 构建配置
# ============================================================

build:
  # custom: autotools config.status 在 HMDFS 上失败，改用手动编译
  system: custom
  configure_options: []
  dependencies: []
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied:
  - "0001-fileutils-fpending-musl.patch"
  - "0002-sort-h-stddef.patch"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "autotools config.status 在 HMDFS 文件系统上失败，需改用手动编译"
  - "musl libc 下 __fpending 宏不可用，需补丁修复 (fileutils.c)"
  - "sort.h 缺少 #include <stddef.h>，musl 下 size_t 未定义"
  - "library/meminfo.c 和 vmstat.c 使用 hsearch_data，musl 不支持，编译时跳过"
  - "终端工具静态链接 (R26)，从 src/pgrep.c + local/*.c + library/*.c 编译"
  - "config.h 必须定义 HAVE_PROGRAM_INVOCATION_SHORT_NAME，否则 local/c.h 用 __FILE__ 替代 argv[0] 导致二进制始终在 pgrep 模式"
