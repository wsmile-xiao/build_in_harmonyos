# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: python-dotenv/1.2.3
homepage: "https://github.com/theskumar/python-dotenv"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "pytest tests/ -q"

upstream_tests:
  - name: tests/（pytest 套件——12 个测试文件，sdist 自带；239 collected）
    count: "239"
    description: "上游测试实测（rule 4，分母=全部 239 用例）：238 passed / 1 skipped / 0 failed（99.6%）——三轮提升：①TMPDIR 指向 /data/storage/el2/base/cache（沙箱 /tmp 只读 + pytest-of-uid 属主检查——150 errors 修复）②dotenv shim + sitecustomize（run_dotenv 调相对名 'dotenv'，OHOS posix_spawn 不搜 PATH——12 failed 修复）③shim prog_name（-c + sys.argv[0]='dotenv'）+ PATH 前置 usr/local/bin（--version 前缀与 printenv GNU 输出——2 failed 修复）；剩余 1 skipped 为上游标记"

test_package_tests:
  - file: test_python_dotenv.py
    description: "R34：模块存在 + import dotenv 真实调用 load_dotenv"
    command: "python3 test_python_dotenv.py <package>"

assertion_count: 2
