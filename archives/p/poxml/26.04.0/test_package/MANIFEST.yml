# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: poxml/26.04.0
homepage: "https://invent.kde.org/sdk/poxml"

# 上游测试命令：CMake + CTest（tests/CMakeLists.txt）
upstream_check_command: "ctest --output-on-failure"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build> --output-on-failure"

# 上游实际运行的测试程序
upstream_tests:
  - file: tests/lauri_de
    source: poxml-26.04.0/tests/CMakeLists.txt
    description: "checkXML6 校验 po2xml 生成的德语译文 XML 结构合法（依赖 GETTEXT_FOUND 门控）"
    command: "ctest"
  - file: tests/split2po
    source: poxml-26.04.0/tests/CMakeLists.txt
    description: "split2po 对已翻译文档的真实往返转换"
    command: "ctest"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_poxml.py
    description: "消费者视角：四个转换器全部存在可执行；xml2pot 真实抽取 DocBook 字符串成 POT；po2xml 把译文合回 XML；split2po 再把译文拆分回 PO"
    command: "conan create . (test_package)"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
