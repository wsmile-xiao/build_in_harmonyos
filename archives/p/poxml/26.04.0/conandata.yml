sources:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/poxml-26.04.0.tar.xz"
  sha256: "dce68a16977ed0bc5b3e6d17600e2b58e15f336a731b403b4b2aaa0d13fc1055"
patches:
  - patch_file: "patches/0001-ohos-drop-kf6doctools-chain.patch"
    patch_description: "CMakeLists.txt: drop the KF6 DocTools chain (find_package(KF6 ... DocTools) + add_subdirectory(doc) + kdoctools_install(po)). Generating/validating the DocBook man pages requires the DocBook XML 4.5 DTD, which no package in this platform provides (the KDE variant DTD pulls it by an absolute file:/// URI, so no catalog overlay resolves it); none of the four converter tools depend on it (kfourinline / kgoldrunner / audiocd-kio precedent)"
    patch_type: "portability"
    strip: 1
  - patch_file: "patches/0002-tests-drop-checkxml6-docbook-dtd.patch"
    patch_description: "tests/CMakeLists.txt: drop the two checkXML6 invocations (the lauri.pot generation step and the lauri_de ctest) for the same missing-DocBook-DTD reason. The real conversion chain of those custom commands (xml2pot -> msgmerge -> msgfmt, po2xml -> split2po) and the split2po ctest are kept, so the upstream test data still exercises the converters end to end"
    patch_type: "portability"
    strip: 1
