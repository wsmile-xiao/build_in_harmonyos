version: "26.04.0"
software: "poxml"
status: built
build_date: "2026-09-29"
build_system: "cmake"

source:
  url: "https://download.kde.org/stable/release-service/26.04.0/src/poxml-26.04.0.tar.xz"
  sha256: "dce68a16977ed0bc5b3e6d17600e2b58e15f336a731b403b4b2aaa0d13fc1055"
  tar_format: tar.xz

build:
  system: cmake
  configure_options:
    - "-DBUILD_TESTING=ON"
    - "-DKF_IGNORE_PLATFORM_CHECK=TRUE"
    - "-DKF_SKIP_PO_PROCESSING=ON"
  dependencies:
    - qtbase/6.11.1
    - kdoctools/6.19.0
    - gettext/0.22.5.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "上游 cmake/modules/FindGettextPO.cmake 是裸 find_path/find_library 探测（无 config 包）——gettext 包前缀必须进 CMAKE_PREFIX_PATH，否则 GettextPO REQUIRED 直接失败"
  - "ECM 工程在 OHOS 需 KF_IGNORE_PLATFORM_CHECK=TRUE（ECM 平台检查不含 HarmonyOS）与 KF_SKIP_PO_PROCESSING=ON（跳过鸿蒙无关的翻译目录流水线）"
  - "kdoctools 同时提供运行时命令 checkXML6 与 CMake 宏 kdoctools_install/kdoctools_create_manpage——文档安装与测试都依赖它，不能只当 build-requires"
  - "OHOS 无 Platform/HarmonyOS CMake 模块，共享库需显式 CMAKE_SHARED_LIBRARY_SONAME_*_FLAG=-Wl,-soname,"
