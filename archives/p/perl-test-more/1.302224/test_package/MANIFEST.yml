# test_package/MANIFEST.yml — perl-test-more 1.302224
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-test-more/1.302224
homepage: "https://metacpan.org/pod/Test::More"

# 上游测试套件：t/ 目录 5 个 .t 测试文件（prove -l t/ 运行，同源 Test-Simple 发行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Test-Simple-1.302224/t/*.t
    description: "5 个 .t 测试文件：本地实测 **85/85（100%）**（prove -l t/，全部运行，零失败）"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Test::More + is 断言）
test_package_tests:
  - file: test_test_more.py
    description: "Loads packaged Test::More via perl -I<lib> and runs a real is() assertion"
    command: "python3 test_test_more.py"

# 断言总数：1（is 断言校验）
assertion_count: 1
