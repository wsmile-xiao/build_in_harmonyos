software: protoc-gen-go-grpc
version: 1.6.2
status: published
build_system: go
url: https://github.com/grpc/grpc-go/archive/refs/tags/cmd/protoc-gen-go-grpc/v1.6.2.tar.gz
sha256: ""
license: Apache-2.0
description: "Protoc plugin that generates Go gRPC service code"
configure_options: ""
build_options: "CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOPROXY=https://goproxy.cn,direct go build -ldflags=-s -w"
dependencies:
  build:
    - go >= 1.25.0
  runtime: []
products:
  - bin/protoc-gen-go-grpc
knowledge_gained:
  - go_static_build: "Go项目在鸿蒙使用 CGO_ENABLED=0 静态编译"
  - go_version_1263: "Go 1.26.0 有 corrupted runtime source，使用 1.26.3"
  - go_submodule_build: "protoc-gen-go-grpc 是 grpc-go 的 cmd/ 子模块，需 cd cmd/protoc-gen-go-grpc 编译"
