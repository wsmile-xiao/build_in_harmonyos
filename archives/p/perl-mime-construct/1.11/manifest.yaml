software: perl-mime-construct
version: "1.11"
build_system: perl-module

# ============================================================
# 必须字段
# ============================================================

version: "1.11"
build_system: perl-module

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-18"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://cpan.metacpan.org/authors/id/R/RO/ROSCH/mime-construct-1.11.tar.gz"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  system: perl-module

  # 配置选项列表
  configure_options:
    - "PREFIX=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl-mime-base64/3.16
    - perl-mime-types/2.29
    - perl-proc-waitstat/latest

  # 编译器 (纯 Perl 脚本，无 C 编译)
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "mime-construct 是纯 Perl 脚本工具（27KB 单文件），不涉及 C/XS 编译，无需特殊适配"
  - "纯 Perl 模块在 OpenHarmony 上编译不受 SELinux HMDFS 限制影响（与 perl-dbd-pg 等 XS 模块不同）"
  - "ExtUtils::MakeMaker + PREFIX=$DEFAULT_PREFIX 是 Perl 模块的标准编译方式，DESTDIR 模式同样适用"
  - "依赖模块 MIME::Base64/MIME::QuotedPrint/MIME::Types/Proc::WaitStat 全部需预先安装"
