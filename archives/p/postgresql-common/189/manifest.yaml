software: postgresql-common
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/189/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "189"

# 编译状态
# published | built | failed | archived
status: published

# 构建系统类型（顶层字段）
build_system: makefile

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-10"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://api.github.com/repos/petere/postgresql-common/tarball/189"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "E202: postgresql-common 是 Perl/shell 项目，无 configure 步骤，使用简单 Makefile（仅生成 man pages） [knowledge_ref: E202]"
  - "E202: 安装需手动处理：基于 debian .install 文件列表，用 cp+chmod 替代 make install [knowledge_ref: E202]"
  - "pg_wrapper 创建 symlinks 替代 PostgreSQL 客户端命令（psql, pg_dump 等） [knowledge_ref: E200]"
# 例如:
# - "Bootstrap 需要 -- -DCMAKE_SYSTEM_NAME=OHOS"
# - "内嵌 libuv 需要禁用，使用系统 libuv"

