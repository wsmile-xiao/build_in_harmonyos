software: postgresql-common
display: "postgresql-common"
description: "Perl/shell PostgreSQL cluster manager — create, drop, and manage PG clusters"
category: system
homepage: "https://github.com/petere/postgresql-common"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "postgresql-common 是 Perl/shell 项目，无 configure 步骤，使用简单 Makefile（仅生成 man pages） [E202]"
    - "安装需手动处理：基于 debian .install 文件列表，用 cp+chmod 替代 make install [E202]"
    - "pg_wrapper 创建 symlinks 替代 PostgreSQL 客户端命令（psql, pg_dump 等） [E200]"
    - "需要 12 个平台补丁以适配 OpenHarmony 环境变量和路径差异"
  common_dependencies:
    - perl

versions:
  "189":
    status: published
    build_date: "2026-06-10"