# test_package/MANIFEST.yml
# 上游官方测试声明文件（CI L0e 强制要求存在）

package: pcg-cpp/0.98.1
homepage: https://www.pcg-random.org

upstream_check_command: "make -C test-high -j1 CXX=<profile cpp> CPPFLAGS=-I../include CXXFLAGS='-std=c++11 -O1' && sh run-tests.sh"
upstream_test_in_build: true
upstream_test_command: "make -C test-high -j1 ...; sh run-tests.sh; python 逐文件字节级对比 expected/ vs actual/（40 个 golden，非空守卫；脚本自身恒退出 0，配方式内以字节级对比为机械判据）; ./check-pcg32_unique + ./check-pcg64_unique 冒烟（退出码判据）；聚合计数写入包内 res/upstream_test_summary.json，test_package 阶段原样透传 HMBS_UPSTREAM_TEST_RESULT（conan 缓存命中轮次会跳过主 build，门禁只扫描 test_package 阶段 stdout）"

upstream_tests:
  - file: test-high/Makefile
    source: test-high/
    description: "上游 Makefile TARGETS 注册 42 个 check-* 测试程序，全部编译并全部执行：40 个输出与 expected/ golden 逐文件字节级对比全部一致且非空，check-pcg32_unique 与 check-pcg64_unique 以退出码为判据冒烟运行（前者从未被上游 run-tests.sh 调用，由配方显式补跑；sample/ 下 6 个演示程序无断言，不属于上游测试边界，未计入）"
    command: "conan create 内由 OHOS profile 编译器（tools.build:compiler_executables cpp）编译并运行"

test_package_tests:
  - file: test_package/test_pcg.cpp
    description: "消费者测试：以库使用者身份编译链接已安装包，4 项断言（pcg32(42u,54u) 与 pcg64(42u,54u) 复现上游 golden 序列、backstep(3) 回退重放一致、pcg_extras::seed_seq_from 重播种生效）"
    command: "conan create（编译并运行 test_pcg_cpp）"

assertion_count: 4
upstream_discovered: 42
upstream_compiled: 42
upstream_executed: 42
upstream_passed: 42
upstream_skipped: 0
