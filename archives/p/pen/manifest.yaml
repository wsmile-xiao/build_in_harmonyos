# 软件级 manifest — pen（HarmonyOS PC 适配）
# 文件位置: archives/p/pen/manifest.yaml
# 遵循 ARCHIVE-SPEC v3.0

software: pen
display: "pen"
description: "负载均衡器，让多台后端服务器对外表现为一个；支持 tcp/udp（http、dns、smtp 等），带客户端会话保持与后端故障自动转移"
category: network
homepage: "https://siag.nu/pen/"
license: GPL-2.0-or-later
build_system: autotools

ohos_adaptation:
  key_points:
    - "上游发布包自带预生成的 configure（autoconf 2.69）+ Makefile.in，不需要 autoreconf；但**不含 config.guess/config.sub**，必须显式 --build=aarch64-linux-ohos 跳过三元组猜测"
    - "上游 configure 默认开 -DDEBUGGING（每次请求打调试日志），打包时必须 --disable-debugging"
    - "OpenSSL 是唯一依赖，走 AutotoolsDeps 注入 -I/-L（Conan 2.29 AutotoolsToolchain 不下发依赖路径）；--with-ssl 命中后 HAVE_LIBSSL 打开 ssl.c"
    - "libgeoip（--with-geoip）与 netmap DSR（--with-dsr）无 OHOS 对应实现且未发布到制品仓，显式关闭"
    - "源码 URL 的官方站 siag.nu 由托管代理返回 Content-Encoding: x-gzip + 压缩前长度，Conan 下载器只认 \"gzip\" 字面量会中断，需在 url 列表里带权威 distfile 镜像"
    - "纯可执行交付（bin/pen、penctl、penlog、penlogd、mergelogs），无库产物，无需 --enable-static/--disable-shared"

  common_dependencies:
    - openssl

versions:
  "0.34.1":
    status: published
    build_date: "2026-09-28"
    conan_ref: "pen/0.34.1"
