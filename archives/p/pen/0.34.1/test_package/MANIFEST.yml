# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pen/0.34.1
homepage: "https://siag.nu/pen/"

# 上游测试清点结论：pen 0.34.1 没有任何自动化测试入口。
#   - 无 tests/ 目录（tarball 内 74 个文件，无任何 test* 目录）
#   - Makefile.am / configure.ac 无 TESTS / check_PROGRAMS / check_SCRIPTS 注册
#   - Makefile.in 只有 automake 生成的空壳 `check-am: all-am`（make check 是 no-op）
#   - 源码中唯一的 <assert.h> 出现在 pen.c 的运行时防御性断言，非测试套件
# 因此上游测试命令声明为 make check（实际 0 用例），并新增鸿蒙消费者用例补足。
upstream_check_command: "make check"

# conanfile.py 的 build() 方法中已集成该入口（conanfile.py:87 autotools.make(target="check")），
# 因此 in_build = true；CI 侧可见 `pen/0.34.1: RUN: make check -j20`（reports/w3-local-ci.log）。
# 注意：in_build 描述的是"build() 内是否调用了上游声明的测试入口"，与"该入口是否有用例可跑"
# 是两件事 —— 此处入口被调用（true），但它展开为 automake 空目标（upstream_tests: []，0 用例）。
upstream_test_in_build: true
upstream_test_command: "make check"

# 上游实际存在的测试入口（空 —— 如实申报"无测试入口"）
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: "test.sh"
    description: "OHOS-T1 UDP 数据面：penlog -> pen(-U) -> penlogd，日志行真实穿越负载均衡器并落盘"
    command: "bash test.sh"
  - file: "test.sh"
    description: "OHOS-T2 TCP 控制面：penctl 连运行中 pen 的控制口取回实时服务表"
    command: "bash test.sh"
  - file: "test.sh"
    description: "OHOS-T3 TCP 数据面：penctl -> pen(A) 数据口 -> pen(B) 控制口，双跳转发结果与直连逐字节一致"
    command: "bash test.sh"
  - file: "test.sh"
    description: "OHOS-T4 统计面：USR1 + -w 生成 HTML 状态页并列出在线后端"
    command: "bash test.sh"

# 新增鸿蒙消费者用例数（非断言型，均为真实数据面/控制面跑通）
ohos_consumer_cases: 4
assertion_count: 0
