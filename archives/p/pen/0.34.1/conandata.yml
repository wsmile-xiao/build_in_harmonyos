# conandata.yml — pen 0.34.1
#
# Source of truth for the source archive + patches.
#
# URL #1 is the author's own release directory (official upstream source).
# URLs #2/#3 are authoritative *distfile mirrors* kept by the OpenBSD ports and
# NetBSD pkgsrc trees; they carry the byte-identical upstream tarball
# (sha256 verified for all three URLs, see notes.md).
#
# The mirror entries are not cosmetic: https://siag.nu is served through a
# hosting proxy that answers with "Content-Encoding: x-gzip" and a
# Content-Length taken from the compressed file while shipping the *decoded*
# tar stream. Conan's downloader only tolerates the exact string "gzip"
# (conan/internal/rest/file_downloader.py) and therefore aborts that URL with
# "Transfer interrupted before complete: 686080 < 184622" after its retries;
# the CI pre-download step (curl) is unaffected. Keeping the mirrors in the
# list makes `conan create` work locally as well as in CI.
sources:
  url:
    - "https://siag.nu/pub/pen/pen-0.34.1.tar.gz"
    - "https://ftp.openbsd.org/pub/OpenBSD/distfiles/pen-0.34.1.tar.gz"
    - "https://cdn.netbsd.org/pub/pkgsrc/distfiles/pen-0.34.1.tar.gz"
  sha256: "2b640795029df9d1672e17202c109cc5d42538f6754a6070dc27da640881e864"
