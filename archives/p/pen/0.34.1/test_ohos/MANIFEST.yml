# test_ohos/MANIFEST.yml
# pen 0.34.1 HarmonyOS 专项测试声明

package: pen/0.34.1

# 测试类型: 鸿蒙专项测试（真机 aarch64-ohos 独立验证，自包含目录）
test_type: ohos_special

# 测试文件
test_files:
  - run_ohos_test.sh

# 覆盖的二进制面（真实调用并可观察结果，非断言）
covered_binaries:
  - pen          # 负载均衡主体（-U UDP 模式 / TCP 数据口 / -w 状态页）
  - penlogd      # 日志汇聚守护进程（-U UDP 监听）
  - penlog       # 本地日志产生器（-U 向 penlogd 投递）
  - penctl       # 控制口客户端（取服务表、写控制口）

# 运行方式（<prefix> 为含 bin/ 的安装前缀；省略则用 PATH 上的二进制）
run_command: "bash run_ohos_test.sh [<prefix>]"

# 用例清单（与 test_package/test.sh 同源，仅此一份实现）
cases:
  - id: OHOS-T1
    plane: UDP 数据面
    path: "penlog -U -> pen(-U) -> penlogd"
  - id: OHOS-T2
    plane: TCP 控制面
    path: "penctl -> 运行中 pen 的控制口，取回实时服务表"
  - id: OHOS-T3
    plane: TCP 数据面双跳
    path: "penctl -> pen(A) 数据口 -> pen(B) 控制口，转发结果与直连逐字节一致"
  - id: OHOS-T4
    plane: 统计面
    path: "USR1 + -w -> 生成 HTML 状态页并列出在线后端"

# 用例性质：全部为可行性消费者用例（跑通即通过），不含 assert 断言
assertion_count: 0

# 与上游测试 / 消费者测试的区别
distinct_from: "上游无任何自动化测试入口（tarball 无 tests/，configure.ac/Makefile.am 未注册 TESTS/check_PROGRAMS，make check 为空目标）；test_package 为 conan create 内的 L1 消费者 smoke（同一脚本），本目录提供脱离 conan 的手工安装前缀复跑入口"
