  date: "2026-09-28"
  evidence: "conan-verify G1/G2/G3 PASS + W3 本地 CI 模拟 1/1 (100%) PASS（L0/L1/L2/L4/L5 全绿、L1e 反向验证、cases=4 failed=0）→ reports/w3-local-ci.log、reports/test-report.md"

knowledge_gained:
  - "siag.nu 官方站经托管代理返回 Content-Encoding: x-gzip（Content-Length 为压缩前尺寸、实际下发解压后的 tar 流）；Conan 的 file_downloader 只把字面量 \"gzip\" 视为可容忍的编码，其余编码会在尺寸比对处中断（Transfer interrupted before complete: 686080 < 184622）。CI 的 curl 预下载不受影响，但本地 conan create 必须靠 url 列表里的权威 distfile 镜像（OpenBSD ports / NetBSD pkgsrc，sha256 与官方包一致）兜底"
  - "pen 0.34.1 发布包自带 configure 却不带 config.guess/config.sub：普通 ./configure 只需显式给 --build/--host 三元组即可通过，无需打补丁补脚本"
  - "上游 configure 的 AC_CHECK_LIB(crypto, main)/AC_CHECK_LIB(ssl, main) 走 conftest 自递归 main，实际只验证库是否存在，静态 libssl.a/libcrypto.a 照样命中 HAVE_LIBSSL，ssl.c 得以参与编译"
  - "Conan 2.29 的 AutotoolsToolchain 不下发依赖 -I/-L，OpenSSL 的可见性完全依赖 AutotoolsDeps（否则 HAVE_LIBSSL 探测失败、ssl.c 退化为空翻译单元，且最终链接缺符号）"
  - "autotools 工程 make check 语义确认：automake 未注册 TESTS 时 check-am 依赖 all-am 而为空目标，`make check` 退出 0 且无任何输出——这是判断『上游确无测试』的判据，而非失败"
  - "纯可执行包的消费者测试可以完全自洽：pen 自带 penlog/penlogd（UDP 数据面）与 penctl（TCP 控制面），无需外部 HTTP 服务或 python/curl 即可构造真实的负载均衡数据往返用例"
