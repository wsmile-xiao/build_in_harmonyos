# test_package/MANIFEST.yml — perl-test-exception 0.43
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: perl-test-exception/0.43
homepage: "https://metacpan.org/pod/Test::Exception"

# 上游测试套件：t/ 目录 11 个 .t 测试文件（prove -l t/ 运行）
upstream_check_command: "prove -l t/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: t/
    source: Test-Exception-0.43/t/*.t
    description: "11 个 .t 测试文件：本地实测 **53/53（100%）**（prove -l t/，10 个运行 + 1 个跳过 edge-cases——上游未修复 RT#24678），零失败"
    command: "prove -l t/"

# test_package 消费者测试（R34 真实 API：perl 加载打包的 Test::Exception + dies_ok 真实异常测试）
test_package_tests:
  - file: test_test_exception.py
    description: "Loads packaged Test::Exception via perl -I<lib> and runs dies_ok() to verify a real exception"
    command: "python3 test_test_exception.py"

# 断言总数：1（异常测试校验）
assertion_count: 1
