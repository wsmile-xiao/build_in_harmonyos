  - "Perl XS 模块编译需要添加 OpenHarmony SDK sysroot 的 include 路径（aarch64-linux-ohos 和 usr/include）"
  - "OpenHarmony musl 不提供标准 CRT 文件，需要使用 `-nostartfiles -nodefaultlibs -lc` 链接参数"
  - "Perl Makefile.PL 可通过 INC 参数添加额外的 include 路径"
  - "Perl Makefile.PL 可通过 dynamic_lib OTHERLDFLAGS 参数添加额外的链接参数"
  - "XS 模块 .so 文件在 HMDFS 上无法被 dlopen（SELinux 限制），需安装到 /data/service/hnp/ 系统目录"
  - "与 perl-dbd-pg 相同的 SELinux 平台限制，需通过 HNP 包进行系统级安装"

