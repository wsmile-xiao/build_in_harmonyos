  - "pybeam 上游测试用**内联合成 BEAM 数据**（setUp 里 b'FOR1...'），不需要外部 fixture；因此 test_package 无需二进制数据（后者会触发 CI 的 missing binary patch data 失败）"
  - "本机 pytest 环境两处缺陷需绕开：typeguard 插件与 pytest 版本不兼容 → 禁插件自动加载；断言重写抛 TypeError → --assert=plain"
