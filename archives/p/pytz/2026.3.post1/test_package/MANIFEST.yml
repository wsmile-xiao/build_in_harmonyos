# test_package/MANIFEST.yml — pytz 2026.3.post1
# CI L0e 强制要求此文件存在（上游测试声明文件）

package: pytz/2026.3.post1
homepage: "https://pythonhosted.org/pytz/"

# 上游测试套件：pytz/tests/ 目录 pytest 套件（pytz 零依赖，可本地运行）
upstream_check_command: "pytest pytz/tests/"
upstream_test_in_build: false
upstream_test_command: ""

# 上游测试程序
upstream_tests:
  - file: pytz/tests/
    source: pytz-2026.3.post1/pytz/tests/*.py
    description: "pytest 套件：本地实测 234/234（100%），零失败"
    command: "pytest pytz/tests/"

# test_package 消费者测试（R34 真实 API：import 打包的 pytz + timezone()/utcoffset()）
test_package_tests:
  - file: test_pytz.py
    description: "Imports packaged pytz, fetches Asia/Shanghai via timezone() and asserts utcoffset = +8h (exercises zoneinfo data)"
    command: "python3 test_pytz.py"

# 断言总数：上游 234 + test_package 1 = 235
assertion_count: 235
