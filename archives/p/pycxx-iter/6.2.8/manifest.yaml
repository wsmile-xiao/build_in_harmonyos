knowledge_gained:
- Python 3.12 移除了 Py_UNICODE 类型及相关 API，需替换为 wchar_t 和 PyUnicode_FromWideChar 等
- 'Python 3.9 移除了 tp_print 字段，需用 #if PY_VERSION_HEX 保护'
- Python 3.12 移除了 _Py_PackageContext 全局变量，需返回 nullptr
- OHOS HMDFS 文件系统缺少标准 C/C++ 头文件，需从 LLVM 源码树获取 libc++ 头文件并创建 __config_site
- 链接时需使用 -nostdlib++ 和显式 -L 路径指向 libc++.so
- 'sys/time.h 在 OHOS 上需要 #if defined(__OHOS__) 保护'
