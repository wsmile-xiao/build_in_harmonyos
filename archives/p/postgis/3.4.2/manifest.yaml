software: postgis
version: "3.4.2"
status: built
build_date: "2026-05-28"

source:
  url: "https://github.com/postgis/postgis/archive/refs/tags/3.4.2.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: autotools
  configure_options:
    - "--prefix=/storage/Users/currentUser/usr/local"
    - "--with-pgconfig=/storage/Users/currentUser/usr/local/bin/pg_config"
    - "--with-libiconv-prefix=/storage/Users/currentUser/usr/local"
    - "--with-geosconfig=/storage/Users/currentUser/usr/local/bin/geos-config"
    - "--without-protobuf"
    - "--without-raster"
    - "--without-topology"
    - "--without-json"
  
  dependencies:
    - postgresql/17.2
    - geos/3.13.0
    - proj/9.8.1
    - libxml2/2.11.9
    - libiconv/1.17
  
  cc: clang
  cxx: clang++

patches_applied:
  - "0001-configure.ac.patch"

knowledge_gained:
  - "GEOS静态库需要添加-lgeos -lc++到GEOS_LDFLAGS"
  - "libiconv需要显式链接，使用--with-libiconv-prefix参数"
  - "PostGIS需要完整的PostgreSQL安装（包括pg_config和PGXS）"
  - "创建libiconv.so软链接指向libiconv.so.2.6.1"