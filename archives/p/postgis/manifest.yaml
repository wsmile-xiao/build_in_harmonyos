software: postgis
display: "PostGIS"
description: "Spatial database extender for PostgreSQL"
category: db
homepage: "https://postgis.net"
license: GPL-2.0+
build_system: autotools

ohos_adaptation:
  key_points:
    - "GEOS静态库需要添加-lgeos -lc++到GEOS_LDFLAGS"
    - "libiconv需要显式链接，使用--with-libiconv-prefix参数"
    - "需要完整的PostgreSQL安装（包括pg_config和PGXS）"
  common_dependencies:
    - postgresql
    - geos
    - proj
    - libxml2

versions:
  "3.4.2":
    status: built
    build_date: "2026-05-28"