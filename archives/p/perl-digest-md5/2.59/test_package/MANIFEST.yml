# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-digest-md5/2.59
homepage: "https://metacpan.org/dist/Digest-MD5"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: "make test"

# 上游实际运行的测试程序
upstream_tests:
  - file: t/align.t
    source: Digest-MD5-2.59/t/align.t
    description: "Try unaligned memory blocks"
    command: "perl -Mblib t/align.t"
  - file: t/badfile.t
    source: Digest-MD5-2.59/t/badfile.t
    description: "Try addfile() on unopened file"
    command: "perl -Mblib t/badfile.t"
  - file: t/bits.t
    source: Digest-MD5-2.59/t/bits.t
    description: "Try add_bits method"
    command: "perl -Mblib t/bits.t"
  - file: t/clone.t
    source: Digest-MD5-2.59/t/clone.t
    description: "Try clone() method"
    command: "perl -Mblib t/clone.t"
  - file: t/files.t
    source: Digest-MD5-2.59/t/files.t
    description: "Check a few files"
    command: "perl -Mblib t/files.t"
  - file: t/md5-aaa.t
    source: Digest-MD5-2.59/t/md5-aaa.t
    description: "Exercise padding code"
    command: "perl -Mblib t/md5-aaa.t"
  - file: t/threads.t
    source: Digest-MD5-2.59/t/threads.t
    description: "Test if threads confuse things"
    command: "perl -Mblib t/threads.t"
  - file: t/utf8.t
    source: Digest-MD5-2.59/t/utf8.t
    description: "Try some Unicode strings"
    command: "perl -Mblib t/utf8.t"
  - file: t/warns.t
    source: Digest-MD5-2.59/t/warns.t
    description: "Warning tests"
    command: "perl -Mblib t/warns.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_md5.sh
    description: "消费者测试：加载 Digest::MD5 模块并调用 md5_hex API 验证 RFC 1321 测试向量"
    command: "sh test_md5.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
