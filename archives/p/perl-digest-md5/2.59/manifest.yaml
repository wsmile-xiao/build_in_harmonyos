software: perl-digest-md5
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.59/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 构建系统类型
build_system: perl_xs

# 版本号
version: "2.59"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-08-07"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/T/TO/TODDR/Digest-MD5-2.59.tar.gz"

  # 源码校验和
  sha256: "b5ecba079bd5907d52663a659cd977b6247526abe6aed9b818d083dd99af77d2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl_xs
  system: perl_xs

  # 配置选项列表
  configure_options:
    - "CCFLAGS=-D_GNU_SOURCE -fno-strict-aliasing -pipe -fstack-protector-strong -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 -I/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/include -I/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/include/aarch64-linux-ohos"
    - "LDDLFLAGS=-shared -nostartfiles -nodefaultlibs -L/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/sysroot/usr/lib/aarch64-linux-ohos -L/data/service/hnp/ohos-sdk.org/ohos-sdk_26.0.0.18/ohos/native/llvm/lib/aarch64-linux-ohos -lc -l:libunwind.a"
  # 说明: Perl XS 模块使用 Makefile.PL，非传统 configure

  # 编译依赖列表（格式: name/version）
  # Perl is a system tool (not a Conan package), installed at /data/service/hnp/bin/perl
  # Digest::base and XSLoader are Perl core modules bundled with Perl 5.42.0
  system_dependencies:
    - perl 5.42.0 (system tool, not a Conan package)
    - Digest::base 1.00 (Perl core module)
    - XSLoader (Perl core module)

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 说明: Digest::MD5 是 Perl 核心模块，编译无需补丁

# ============================================================
# 预编译包信息
# ============================================================

packaging:
  # tar.gz 预编译包（用户安装模式）
  tar_gz:
    file: "perl-digest-md5-2.59-ohos-aarch64.tar.gz"
    size: "40KB"
    format: "tar.gz"
    install_target: "$DEFAULT_PREFIX (~/usr/local)"
    contents:
      - "lib/site_perl/5.42.0/aarch64-linux/Digest/MD5.pm"
      - "lib/site_perl/5.42.0/aarch64-linux/auto/Digest/MD5/MD5.so"
      - "lib/site_perl/5.42.0/aarch64-linux/auto/Digest/MD5/.packlist"

  # HNP 包（系统安装模式）
  hnp:
    file: "perl-digest-md5-2.59-ohos-aarch64.hnp"
    size: "14KB"
    format: "zip"
    install_target: "/data/service/hnp/perl.org/perl_5.42.0/"
    contents:
      - "lib/site_perl/5.42.0/aarch64-linux/Digest/MD5.pm"
      - "lib/site_perl/5.42.0/aarch64-linux/auto/Digest/MD5/MD5.so"
      - "lib/site_perl/5.42.0/aarch64-linux/auto/Digest/MD5/.packlist"

  # 编译产物详情
  artifacts:
    MD5_so:
      original_size: "25KB"
      stripped_size: "16KB"
      signed_size: "21KB"
      elf_signed: true
      selinux_type: "hnp_file:s0"
    MD5_pm:
      size: "11KB"
      type: "perl_module"

# ============================================================
# 知识沉淀
# ============================================================

# 功能测试结果
functional_test:
  date: "2026-06-10"
  result: "PASS"
  test_count: 17
  pass_count: 17
  pass_rate: "100%"
  key_findings:
    - "所有功能测试通过，模块可正常使用"
    - "XS 实现提供高性能（10000次计算0.016秒）"
    - "临时目录需使用 $TMPDIR（/tmp 只读）"
    - "Unicode 字符串需 UTF-8 编码处理"

# 编译中学到的知识
knowledge_gained:
  - "L2: Perl XS 模块使用 Makefile.PL 而非 configure"
  - "L2: 需要添加 OHOS SDK 头文件路径到 CCFLAGS"
  - "L2: CRT 文件缺失需要 -nostartfiles -nodefaultlibs 绕过"
  - "L2: XS 模块需要 ELF 签名才能在鸿蒙上运行"
  - "L2: SELinux HMDFS 限制导致 XS 模块无法从用户目录加载"
  - "L3: XS 模块安装到 /data/service/hnp/perl.org/... 系统目录"
  - "L3: 参考 perl-dbd-pg 3.18.0 的链接方案"
  - "L3: 使用 HNP 包格式而非 tar.gz"
  - "L3: Digest::MD5 是 Perl 5.42.0 核心模块，已预装"
  - "L3: 功能完整，高性能 XS 实现"
