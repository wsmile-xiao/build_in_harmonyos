software: perl-digest-md5
# 软件级 manifest 模板
# 文件位置: archives/p/perl-digest-md5/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 软件基本信息
# ============================================================

# 软件描述
description: "Perl interface to the MD-5 algorithm - Digest::MD5 XS module"

# 软件分类
category: perl_xs

# 主页 URL
homepage: "https://metacpan.org/pod/Digest::MD5"

# ============================================================
# 版本索引
# ============================================================

# 已编译版本列表（按时间倒序）
versions:
  - version: "2.59"
    status: published
    build_date: "2026-06-10"
    functional_test: "PASS (17/17)"
    notes: "功能测试通过，可在鸿蒙平台正常使用"

# ============================================================
# 编译模式摘要
# ============================================================

# 构建系统类型
build_system: perl_xs

# 典型编译参数（供参考）
typical_configure_options:
  - "CCFLAGS=-I${OHOS_SDK}/usr/include -I${OHOS_SDK}/usr/include/aarch64-linux-ohos"
  - "LDDLFLAGS=-shared -nostartfiles -nodefaultlibs -L${OHOS_SDK}/usr/lib/aarch64-linux-ohos -L${OHOS_LLVM}/lib/aarch64-linux-ohos -lc -l:libunwind.a"

# ============================================================
# 平台特性
# ============================================================

# SELinux 限制说明
selinux_notes:
  - "XS 模块无法从 HMDFS 用户目录加载"
  - "需要安装到 /data/service/hnp/perl.org/... 系统目录"
  - "需要 ELF 签名"

# ============================================================
# 知识沉淀
# ============================================================

# Perl XS 模块编译知识
perl_xs_knowledge:
  - "使用 Makefile.PL 而非 configure"
  - "需要 OHOS SDK 头文件路径"
  - "CRT 文件缺失需要特殊链接参数"
  - "XS 模块安装到 Perl 系统架构目录"
  - "使用 HNP 包格式"

# 参考
references:
  - "perl-dbd-pg 3.18.0 - 类似的 XS 模块编译经验"