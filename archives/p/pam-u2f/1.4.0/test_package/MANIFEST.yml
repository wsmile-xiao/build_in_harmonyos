# test_package/MANIFEST.yml
# pam-u2f 1.4.0 上游官方测试声明文件 (CI L0e 强制要求)

package: pam-u2f/1.4.0
homepage: "https://developers.yubico.com/pam-u2f/"

upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --output-on-failure --verbose"

# Upstream 1.4.0 registers 4 ctest tests (tests/CMakeLists.txt):
# dlsym_check (needs built pam_u2f module), get_devices, expand, cfg.
upstream_tests:
  - file: tests/dlsym_check.c
    source: pam_u2f-1.4.0/tests/dlsym_check.c
    description: "Upstream ctest: dlopen built pam_u2f module and check symbols"
    command: "ctest -R dlsym_check --output-on-failure"
  - file: tests/get_devices.c
    source: pam_u2f-1.4.0/tests/get_devices.c
    description: "Upstream ctest: device enumeration helper test"
    command: "ctest -R get_devices --output-on-failure"
  - file: tests/expand.c
    source: pam_u2f-1.4.0/tests/expand.c
    description: "Upstream ctest: config-credential expansion unit test"
    command: "ctest -R expand --output-on-failure"
  - file: tests/cfg.c
    source: pam_u2f-1.4.0/tests/cfg.c
    description: "Upstream ctest: config parsing unit test"
    command: "ctest -R cfg --output-on-failure"

test_package_tests:
  - file: test_package/test_pam-u2f.sh
    description: "Consumer test: pamu2fcfg --version runs"
    command: "pamu2fcfg --version"
  - file: test_package/test_pam-u2f.sh
    description: "Consumer test: pam_u2f.so exports pam_sm_authenticate"
    command: "sh test_pam-u2f.sh"

assertion_count: 2
