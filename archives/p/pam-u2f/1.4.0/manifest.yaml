version: "1.4.0"
software: "pam-u2f"
status: built
build_date: "2026-09-12"
build_system: cmake

source:
  url: "https://developers.yubico.com/pam-u2f/Releases/pam_u2f-1.4.0.tar.gz"
  sha256: "a59927cea38ea8d91a6836a04e20fc629edde4204b16082f703f6db378e9c634"
  tar_format: tar.gz

vendor_sources:
  libfido2-1.15.0:
    url: "https://developers.yubico.com/libfido2/Releases/libfido2-1.15.0.tar.gz"
    sha256: "abaab1318d21d262ece416fb8a7132fa9374bda89f6fa52b86a98a2f5712b61e"
    usage: "private static helper built into build_folder/vendor, not packaged"

build:
  system: cmake
  configure_options:
    - "-DBUILD_MODULE=ON"
    - "-DBUILD_PAMU2FCFG=ON"
    - "-DBUILD_MANPAGES=OFF"
    - "-DBUILD_TESTING=ON"
    - "-DPAM_DIR=lib/security"
  dependencies:
    - linux-pam/1.7.2
    - openssl/1.1.1w
    - libcbor/0.10.2
    - zlib/1.3.1
  cc: clang
  cxx: clang++

patches_applied: []

knowledge_gained:
  - "pam-u2f 1.4.0 supports CMake (>=3.18); Autotools is deprecated upstream"
  - "BUILD_MANPAGES=OFF avoids asciidoc/xsltproc on OHOS workers"
  - "PAM_DIR must be relative (lib/security) so the module installs under the Conan package"
  - "Upstream ctest suite has 4 tests: dlsym_check, get_devices, expand, cfg"
  - "libfido2/1.15.0 unpublished on ohpcd: vendored as private static helper (official tarball, Linux HID backend, libudev stub fallback, ppoll->poll); remove vendor block once libfido2 publishes"
  - "vendored static libfido2 requires explicit libcbor+zlib on pam_u2f_base and pamu2fcfg link lines"

test_results:
  type: ctest
  total: 4
  passed: 4
  failed: 0
  notes: "ctest --output-on-failure in build(); test_package runs pamu2fcfg --version + pam_u2f.so symbol check"

knowledge_ref: []
