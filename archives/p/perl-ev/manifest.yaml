software: perl-ev
display: "EV"
description: "Perl interface to libev, a high performance full-featured event loop"
category: data
homepage: "https://metacpan.org/pod/EV"
license: GPL-2.0-or-later
build_system: perl

ohos_adaptation:
  key_points:
    - "Perl XS 模块需要 musl 头文件路径和特殊链接参数"
    - "交互式 Makefile.PL 可通过 auto_prompt 包装器实现非交互模式"
    - "SELinux HMDFS 限制 XS 模块加载，需安装到系统目录"
    - "支持两种版本：通用版(select)和高性能版(epoll)"
  common_dependencies:
    - "common::sense >= 3.75"
    - "musl >= 1.2.5"

versions:
  "4.35":
    status: built
    build_date: "2026-06-11"
    notes: "XS 模块编译成功，提供通用版和高性能版 HNP 包"