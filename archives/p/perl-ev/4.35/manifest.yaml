software: perl-ev
# 版本级 manifest
# 文件位置: archives/p/perl-ev/4.35/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.35"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-11"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/M/ML/MLEHMANN/EV-4.35.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl

  # 配置选项列表
  configure_options:
    - "PERL_MM_USE_DEFAULT=1"
    - "PERL_CANARY_STABILITY_NOPROMPT=1"
    - "PERL5LIB=/storage/Users/currentUser/usr/local/lib/perl5"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "common::sense/3.75"
    - "musl/1.2.5"

  # 编译器
  cc: clang
  cxx: clang++

  # 特殊链接参数
  link_flags: "-nostartfiles -nodefaultlibs -L/storage/Users/currentUser/usr/local/lib -lc"

  # 头文件路径
  include_flags: "-I/storage/Users/currentUser/usr/local/include"

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.PL.patch"

# 补丁分类标注
patch_types:
  0001-Makefile.PL.patch:
    type: "platform"
    guard: "__OHOS__"
    description: "添加 auto_prompt 函数支持非交互式配置，添加 musl 头文件路径和 OpenHarmony 链接参数"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "Perl XS 模块需要 musl 头文件路径和特殊链接参数"
  - "交互式 Makefile.PL 可通过 auto_prompt 包装器实现非交互模式"
  - "SELinux HMDFS 限制 XS 模块加载，需安装到系统目录"

# ============================================================
# 运行时备注
# ============================================================

runtime_notes: |
  XS 模块编译成功，但由于 SELinux HMDFS 限制，无法从 HMDFS 加载。
  需管理员安装到系统目录 /data/service/hnp/perl.org/perl_5.42.0/lib/site_perl/

  功能测试结果:
  - 编译验证: PASS (EV.so 144KB, 已签名)
  - 用户空间加载: FAIL (SELinux HMDFS 限制)
  - 系统目录参照测试: PASS (Cwd, Encode 等可加载)
  - HNP 包: PASS (64KB, 包含所有必要文件)

# ============================================================
# 打包信息
# ============================================================

packaging:
  hnp_packages:
    - name: "perl-ev-4.35-ohos-aarch64.hnp"
      size: "64KB"
      backend: "select only"
      description: "通用版本，适合少量连接场景"
    - name: "perl-ev-4.35-epoll-ohos-aarch64.hnp"
      size: "67KB"
      backend: "epoll + select + inotify + eventfd + signalfd"
      description: "高性能版本，适合高并发场景"

