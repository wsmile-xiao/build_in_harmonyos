patches_applied:
  - "0001-config.guess.patch"
  - "0002-config.sub.patch"
  - "0003-configure.patch"
  - "0004-src-include-config.h.patch"

knowledge_gained:
  - "HMDFS SGID inheritance + umask 077 creates drwx--S--- dirs that block file creation; must remove umask 077 from configure"
  - "OHOS sysroot defines __MUSL__ guard in sys/socket.h for sockaddr_storage; compiler does not define __MUSL__ so both sys/socket.h and linux/socket.h define sockaddr_storage causing redefinition error; add -D__MUSL__ to CFLAGS"
  - "CONFIG_SHELL must be bash (not zsh/sh) to prevent autoconf ECHO detection selecting 'print -r --' (zsh builtin)"
  - "config.guess/config.sub need HarmonyOS/__OHOS__ detection via patch-autotools-ohos.pl"
  - "libmd.so development symlink missing after libmd install; must create manually"

