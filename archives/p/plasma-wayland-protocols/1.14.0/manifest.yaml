knowledge_gained:
  - "data-only（无编译产物）包应设 package_type=build-scripts 且 package_id() 调 self.info.clear()，使单一 package ID 跨工具链共享（ECM 6.26.0 先例）"
  - "上游自带 CMake 包配置（PlasmaWaylandProtocolsConfig.cmake）时，package_info() 必须设 cmake_find_mode='none'——否则 CMakeDeps 会在 generators/ 生成同名 config 并因 CMAKE_PREFIX_PATH 中 generators 目录优先而遮蔽原生 config；此时消费者拿到的 PLASMA_WAYLAND_PROTOCOLS_DIR 为空"
  - "再以 builddirs=['lib/cmake'] 把原生 config 所在目录（其父目录）加入 CMAKE_PREFIX_PATH，find_package(PlasmaWaylandProtocols CONFIG) 即可命中原生 config（libkscreen/6.7.2 同款做法）"
  - "configure_package_config_file(PATH_VARS KDE_INSTALL_DATADIR) 生成的 config 用 PACKAGE_PREFIX_DIR（由 CMAKE_CURRENT_LIST_DIR 相对 INSTALL_DESTINATION 推导）重定位，故 PLASMA_WAYLAND_PROTOCOLS_DIR 恒指向包内 <pkg>/share/plasma-wayland-protocols，而非共享前缀"
  - "CMake 脚本模式（cmake -P）下 message() 输出到 stderr；跨进程取变量值应 file(WRITE) 落盘而非 grep stdout"

test_results:
  type: target-device
  conan_create: >-
    conan create archives/p/plasma-wayland-protocols/1.14.0
    -pr:h=ci/conan/profiles/ohos-aarch64 -pr:b=ci/conan/profiles/ohos-aarch64
    --build=missing → exit 0，test_package 执行完毕 (assertions=143 failures=0)
  upstream: >-
    plasma-wayland-protocols 1.14.0 上游确无测试套件（upstream_tests=0）：
    源码树无 tests/ 目录，CMakeLists.txt 无 enable_testing/add_test/ctest。
    清点证据见 notes.md 与 test_package/MANIFEST.yml。
  package: >-
    32 个协议 XML（30 原始 + plasma-virtual-desktop.xml / screencast.xml 两个
    向后兼容重命名）安装到 share/plasma-wayland-protocols/；
    lib/cmake/PlasmaWaylandProtocols/ 下安装 PlasmaWaylandProtocolsConfig.cmake
    与 ConfigVersion.cmake。
  consumer: >-
    test_package 真实消费：(1) CMake 工程 find_package(PlasmaWaylandProtocols
    1.9.0 CONFIG REQUIRED) 成功且 22 个 kwayland5 需要的协议 XML 全部存在；
    (2) 用 cmake -P 求值原生 config 得到 PLASMA_WAYLAND_PROTOCOLS_DIR，
    再断言 143 项（目录存在 + 该目录位于包内 + 目录名正确；22 个消费协议
    逐文件 存在/非空/合式 XML/根元素 <protocol>/name 非空/有 interface/
    interface 均有 name+version；两处向后兼容重命名的 <protocol name> 正确），
    assertions=143 failures=0。
  hongmeng_e2e_flow: >-
    鸿蒙特有测试 / 完整消费者用例（rule 12，ctest 用例 plasma_keystate_e2e）：
    构建期用 e2e/gen_protocol.py 把**本包安装的** keystate.xml 翻译成协议绑定
    （wl_interface 表 + 客户端/服务端调用包装；XML 缺失、非合式、接口版本不符、
    参数类型无法精确翻译或产出空文件即让构建失败）；运行期生成的代码在真实
    libwayland 上完成一次 client<->server 交换——server: wl_display_create +
    wl_client_create(fd) + wl_global_create(org_kde_kwin_keystate v4)；
    client: wl_display_connect_to_fd + wl_display_get_registry + wl_registry_bind
    + 生成的 fetchStates()；服务端 handler 被解出后经生成的事件发送器回
    stateChanged(key=1, state=2)，客户端监听器收到并逐字节比对载荷；随后生成的
    destructor 请求也被服务端 handler 解出。用例另行校验包内实际安装的 XML 与
    生成绑定所依据的 XML 为同一文件（FNV-1a 指纹比对）。
    实测：assertions=22 failures=0，hongmeng_e2e_flow=PASS，退出码 0。
    本机 wayland/1.22.0 包内 wayland-scanner 为 OHOS 加载器拒绝的 ELF（#13500 修复），
    故测试构建期无法调用上游 scanner；生成规则已用真实 wayland-scanner 1.22.0 的
    同 XML 输出逐项对齐核对（消息签名 {"fetchStates",""}/{"destroy","4"}/
    {"stateChanged","uu"}、2 requests / 1 event 完全一致）。
  pass_rate: "ctest 100% (1/1); conan create exit 0"
