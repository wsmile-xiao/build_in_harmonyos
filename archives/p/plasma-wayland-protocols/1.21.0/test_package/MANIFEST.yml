# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: plasma-wayland-protocols/1.21.0
homepage: "https://invent.kde.org/plasma/plasma-wayland-protocols"

# 上游测试命令
upstream_check_command: "ctest -N"
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir <build_dir> --output-on-failure --no-tests=error --timeout 90"

# 上游实际运行的测试（BUILD_TESTING=ON 时 autotests/CMakeLists.txt 逐协议
# 注册，30 协议 x 4 = 120 项；conan create build() 内 ctest 直跑，
# 静态 wayland-scanner 注入 WaylandScanner_EXECUTABLE（仅依赖 libc，
# wayland-protocols 1.47/1.48 同款机制））
upstream_tests:
  - category: scan-client-header
    count: 30
    description: "每个协议 XML: wayland-scanner --strict client-header 生成客户端头；FAIL_REGULAR_EXPRESSION \".+\" 拦截任何告警（plasma-window-management 豁免，上游已知既有问题）；FIXTURES_SETUP"
    status: executed
    condition: "conan create build() 内 ctest 直跑，scanner 为静态编译（仅 libc）"
  - category: scan-server-header
    count: 30
    description: "每个协议 XML: wayland-scanner --strict client-header 生成服务端头（上游以 client-header 传参，沿用原样）；同样告警拦截 + FIXTURES_SETUP"
    status: executed
    condition: "conan create build() 内 ctest 直跑，scanner 为静态编译（仅 libc）"
  - category: scan-private-code
    count: 30
    description: "每个协议 XML: wayland-scanner --strict private-code 生成协议实现代码；同样告警拦截 + FIXTURES_SETUP"
    status: executed
    condition: "conan create build() 内 ctest 直跑，scanner 为静态编译（仅 libc）"
  - category: build-c
    count: 30
    description: "build.c（include 生成的 client/server 头 + 空 main）与生成的 protocol.c 用 ${CMAKE_C_COMPILER} 编译链接（-I Wayland_INCLUDE_DIRS -Wl,--unresolved-symbols=ignore-all），验证生成代码可编译；FIXTURES_REQUIRED"
    status: executed
    condition: "conan create build() 内 ctest 直跑，编译器为 conan 同一 clang"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: CMakeLists.txt
    description: "CMake 消费者: find_package(PlasmaWaylandProtocols 1.21 CONFIG REQUIRED) + PLASMA_WAYLAND_PROTOCOLS_DIR 有效 + 32 XML + 5 个代表性文件在场（configure 阶段 4 组断言）"
    command: "conan test"
  - file: src/test_plasma-wayland-protocols.sh
    description: "XML 清单深检: 32 个 XML、2 个改名兼容文件与原文件逐字节一致、协议 name 声明有效（3 组断言）"
    command: "bash test_plasma-wayland-protocols.sh <pkg_dir>"

# 测试断言总数：上游 120 项（build() 内 ctest 实测），test_package 7 组断言
assertion_count: 7
