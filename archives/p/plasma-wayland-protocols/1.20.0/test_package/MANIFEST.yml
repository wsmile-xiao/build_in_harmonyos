# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: plasma-wayland-protocols/1.20.0
homepage: "https://invent.kde.org/libraries/plasma-wayland-protocols"

# 上游测试命令：cmake -DBUILD_TESTING=ON && ctest（需 WaylandScanner + Wayland Client）
upstream_check_command: "cmake -DBUILD_TESTING=ON"
upstream_test_in_build: false
upstream_test_command: "ctest"

# 上游实际测试程序（30 协议 × 4 项 = 120 项）
upstream_tests:
  - category: scanner-strict
    count: 90
    description: "每个协议 XML 通过 wayland-scanner --strict 生成 client/server header 与 private-code（30×3）"
    status: adapted-pass
    reason: >-
      上游 ctest 无法运行（HMDFS 禁止动态加载共享库：制品仓 scanner 二进制链
      libexpat.so/libxml2.so 不可执行，Wayland Client 共享库同理）。
      等价实现：conanfile.py 从 wayland 1.22.0 源码静态编译 scanner（仅依赖
      libc.so，wayland-protocols/1.36.1 已验证方案）随包发布到 bin/，
      test_package 对全部 30 个协议 XML 执行 --strict client-header/
      server-header/private-code——90 项全部实跑通过
      （plasma-window-management 与上游 CMakeLists 同口径豁免 strict 告警失败）
  - category: build
    count: 30
    description: "每个协议生成代码用 C 编译器编译（-Wl,--unresolved-symbols=ignore-all，include Wayland 头）"
    status: skipped
    reason: "依赖 Wayland Client 头文件路径与 libwayland-client 共享库链接，HMDFS 禁止动态加载，无法在鸿蒙环境执行"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: src/test_plasma-wayland-protocols.sh
    description: "验证 CMake Config / 32 个协议 XML 完整性与良构性 / PLASMA_WAYLAND_PROTOCOLS_DIR 变量（14 组断言）"
    command: "bash test_plasma-wayland-protocols.sh <pkg_dir>"
  - file: conanfile.py
    description: "Config.cmake 存在 + 协议目录/XML 数量核对 + 静态 scanner 对 30 XML × 3 模式 --strict 扫描（90 项上游等价测试实跑）"
    command: "conan test"

# 测试断言总数：上游等价覆盖 90/90（scanner 扫描实跑通过），
# build 30 项平台限制 skipped，test_package 17 个断言
assertion_count: 17
