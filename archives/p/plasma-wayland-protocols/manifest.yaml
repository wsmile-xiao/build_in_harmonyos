# 软件级 manifest — plasma-wayland-protocols
# 文件位置: archives/p/plasma-wayland-protocols/manifest.yaml
software: plasma-wayland-protocols
display: "Plasma Wayland Protocols"
description: "XML descriptions of the non-standard Wayland protocols used by Plasma (data-only package)"
license: "LGPL-2.1-or-later AND BSD-3-Clause"
category: data
homepage: "https://invent.kde.org/libraries/plasma-wayland-protocols"
upstream_repo: "https://invent.kde.org/libraries/plasma-wayland-protocols"
build_system: cmake
type: data  # 无编译产物：仅安装协议 XML + CMake 包配置

ohos_adaptation:
  key_points:
    - "data-only 包（package_type=build-scripts）：无编译/链接产物，package_id() 用 self.info.clear() 使单一 package ID 跨工具链共享"
    - "构建工具依赖 ecm/6.26.0（tool_requires，KDEInstallDirs/ECMSetupVersion）"
    - "package_info() 设 cmake_find_mode=none + builddirs=['lib/cmake']，避免 CMakeDeps 生成同名 config 遮蔽上游原生 PlasmaWaylandProtocolsConfig.cmake"
    - "上游原生 config 的 PLASMA_WAYLAND_PROTOCOLS_DIR 解析到本 conan 包内（<pkg>/share/plasma-wayland-protocols）"
  common_dependencies:
    - ecm

versions:
  "1.14.0":
    state: built
    conanfile: conanfile.py
    conandata: conandata.yml
    test_package: test_package/
    build_date: 2026-09-27
    notes: notes.md
  "1.20.0":
    state: built
    conanfile: conanfile.py
    conandata: conandata.yml
    test_package: test_package/
    build_date: 2026-09-28
    notes: notes.md
