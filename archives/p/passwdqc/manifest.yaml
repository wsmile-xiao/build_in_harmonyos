# 软件级 manifest — passwdqc
# 遵循 ARCHIVE-SPEC v2.0

software: passwdqc
display: "passwdqc"
description: "密码和密码短语强度检查及策略执行工具集"
category: utility
homepage: "https://www.openwall.com/passwdqc/"
license: BSD-3-Clause
build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "纯 GNU Makefile 项目（无 autotools/cmake/meson），编译器通过命令行 CC/LD 注入"
    - "OHOS 无 Linux-PAM 生态：pam_passwdqc.so 跳过，仅构建 libpasswdqc.so.1 + pwqgen/pwqcheck/pwqfilter"
    - "核心库零外部依赖（LDLIBS_lib 为空），工具仅链接 -lpasswdqc"
    - "Makefile 默认 CC=gcc，OHOS 用 clang（tools.build:compiler_executables）"
    - "make 需 -j1 避免 jobserver FIFO 限制"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.1.0":
    status: built
    build_date: "2026-09-04"
