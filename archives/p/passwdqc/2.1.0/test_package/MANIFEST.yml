package: passwdqc/2.1.0
homepage: "https://www.openwall.com/passwdqc/"

upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "LD_LIBRARY_PATH=. sh -c 'set -e; for test in tests/*.sh; do sh \"$test\"; done'"

upstream_tests:
  - file: tests/*.sh
    source: passwdqc-2.1.0/tests/*.sh
    description: "Upstream passwdqc shell test suite (6 scripts, 81 sub-tests)"
    command: "make check"

test_package_tests:
  - file: test_passwdqc.c
    description: "API consumer tests: check/random/similarity/config-load (11 assertions)"
    command: "./test_passwdqc"
  - file: pwqgen
    description: "CLI tool: pwqgen generates a passphrase"
    command: "pwqgen"
  - file: pwqcheck
    description: "CLI tool: pwqcheck accepts strong passphrase, rejects weak password"
    command: "sh -c 'echo correct horse battery staple | pwqcheck -1'"
  - file: pwqcheck
    description: "CLI tool: pwqcheck rejects weak password (expected non-zero exit)"
    command: "sh -c 'echo 123 | pwqcheck -1'"

assertion_count: 14
