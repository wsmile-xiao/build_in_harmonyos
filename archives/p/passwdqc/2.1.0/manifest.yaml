software: passwdqc
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.1.0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.1.0"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-22"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://www.openwall.com/passwdqc/passwdqc-2.1.0.tar.gz"

  # 源码校验和
  sha256: "52fa12271104e74126145c6224b22b4a8dd32cc47de04c1e9fb8f348340df4d2"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型
# cmake | autotools | makefile | meson | custom
build_system: makefile

# 配置选项列表
configure_options:
  - "make utils CC=clang"
  - "sed -e s|@VERSION@|2.1.0|g passwdqc.pc.in > passwdqc.pc"
  - "make install_lib install_utils CC=clang DESTDIR=$TEST_PREFIX BINDIR=$DEFAULT_PREFIX/bin SHARED_LIBDIR=$DEFAULT_PREFIX/lib DEVEL_LIBDIR=$DEFAULT_PREFIX/lib INCLUDEDIR=$DEFAULT_PREFIX/include MANDIR=$DEFAULT_PREFIX/share/man CONFDIR=$DEFAULT_PREFIX/etc PKGCONFIGDIR=$DEFAULT_PREFIX/lib/pkgconfig"

# 编译依赖列表（格式: name/version）
dependencies: []

# 编译器
cc: clang
cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "passwdqc 使用纯 Makefile（非 autotools），无 configure 脚本，通过 uname -s 检测平台"
  - "HarmonyOS 的 uname -s 返回 'HarmonyOS'，匹配 Makefile 的 *) fallback 分支，不设置 Linux 加固参数"
  - "无 PAM 框架时使用 'make utils' 替代 'make all'，用 'make install_lib install_utils' 替代 'make install'"
  - "make utils 不生成 passwdqc.pc，需手动 sed 从 .in 模板生成"
  - "Makefile 的 SHARED_LIBDIR_REL 公式在绝对路径下生成错误相对符号链接，需手动修复为 libpasswdqc.so.1"
  - "make check 依赖 PAM 构建（check→default→all_wrapped→pam_wrapped），无 PAM 时需手动运行 tests/*.sh"
