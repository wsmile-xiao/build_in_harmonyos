# 软件级 manifest — primer3
# 文件位置: archives/p/primer3/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

software: primer3

display: "Primer3"

description: "PCR 引物/杂交探针设计工具集（引物对设计、Tm 计算、热力学比对、序列掩蔽）"

# 分类标签
# foundation|build-tool|compress|crypto|db|network|system|doc|gfx|data|library|utility
category: utility

homepage: "https://primer3.org"

# 开源许可证（SPDX 标识）
license: GPL-2.0

# ============================================================
# 构建信息
# ============================================================

build_system: makefile

# ============================================================
# OHOS 适配知识（跨版本通用）
# ============================================================

ohos_adaptation:
  key_points:
    - "上游 tarball 顶层无 configure，Makefile 在 src/ 子目录；build 须 make -C <source>/src"
    - "CC/CXX/AR/RANLIB 为 Makefile 变量，命令行注入 OHOS 工具链即可零补丁交叉编译"
    - "上游 install 只装可执行文件；库与头文件需配方 package() 手动复制"
    - "libprimer3.cc 为唯一 C++ 源（-std=c++11），链接 libprimer3.a 须用 C++ 链接器"
    - "thal.c 的 -ffloat-store 为 x86 专用 flag，clang/arm64 忽略仅告警，测试无差异"
  common_dependencies: []

# ============================================================
# 版本索引
# ============================================================

versions:
  "2.6.1":
    status: built
    build_date: 2026-09-04
