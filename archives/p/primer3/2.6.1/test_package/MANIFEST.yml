# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: primer3/2.6.1
homepage: "https://primer3.org"

# 上游测试命令 (上游无 configure/check 目标；测试为 perl 回归脚本)
upstream_check_command: "cd test && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序 (在完整 tarball 结构下 cd test && make test)
upstream_tests:
  - file: test/p3test.pl
    source: primer3-2.6.1/test/p3test.pl
    description: "primer3_core Boulder IO 回归测试驱动"
    command: "perl p3test.pl"
  - file: test/dpal_test.pl
    source: primer3-2.6.1/test/dpal_test.pl
    description: "dpal 序列比对库回归测试"
    command: "perl dpal_test.pl"
  - file: test/ntthal_test.pl
    source: primer3-2.6.1/test/ntthal_test.pl
    description: "ntthal 热力学比对测试"
    command: "perl ntthal_test.pl"
  - file: test/oligotm_test.pl
    source: primer3-2.6.1/test/oligotm_test.pl
    description: "oligotm 解链温度测试"
    command: "perl oligotm_test.pl"
  - file: test/masker_test.pl
    source: primer3-2.6.1/test/masker_test.pl
    description: "libmasker 序列掩蔽测试"
    command: "perl masker_test.pl"
  - file: test/a3test.pl
    source: primer3-2.6.1/test/a3test.pl
    description: "amplicon3_core 测试"
    command: "perl a3test.pl"
  - file: test/cmdline_test.pl
    source: primer3-2.6.1/test/cmdline_test.pl
    description: "命令行参数处理测试"
    command: "perl cmdline_test.pl"
  - file: test/long_seq_tm_test.pl
    source: primer3-2.6.1/test/long_seq_tm_test.pl
    description: "长序列 Tm 计算测试"
    command: "perl long_seq_tm_test.pl"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test.c
    description: "libprimer3/oligotm 真实 API 链接测试 (p3_create_global_settings + oligotm)"
    command: "./test_primer3"
  - file: test_package/conanfile.py test()
    description: "primer3_core Boulder IO 端到端测试 (断言 PRIMER_LEFT_0/PRIMER_PAIR_0_PRODUCT_SIZE)"
    command: "primer3_core boulder_in.txt"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
