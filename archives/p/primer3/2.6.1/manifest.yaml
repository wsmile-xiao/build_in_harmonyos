# 版本级 manifest — primer3 2.6.1
# 文件位置: archives/p/primer3/2.6.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.6.1"

software: "primer3"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-09-04"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/primer3-org/primer3/archive/refs/tags/v2.6.1.tar.gz"
  sha256: "805cef7ef39607cd40f0f5bb8b32e35e20007153a0a55131dd430ce644c8fb9e"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  # Makefile 变量注入（零补丁交叉编译），无 configure 阶段
  configure_options:
    - "CC=/data/service/hnp/bin/clang"
    - "CXX=/data/service/hnp/bin/clang++"
    - "AR=llvm-ar"
    - "RANLIB=llvm-ranlib"
    - "-j2"

  # 编译依赖列表（无任何第三方依赖）
  dependencies: []

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 产物清单
# ============================================================

artifacts:
  executables:
    - primer3_core
    - ntdpal
    - ntthal
    - oligotm
    - amplicon3_core
    - long_seq_tm_test
    - primer3_masker
  static_libraries:
    - libprimer3.a
    - libdpal.a
    - libthal.a
    - libthalpara.a
    - liboligotm.a
    - libamplicontm.a
    - libmasker.a
  headers: "11 个公共头文件（libprimer3.h / oligotm.h / dpal.h / thal.h 等）"

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "上游 tarball 顶层无 configure（非 autotools），Makefile 在 src/ 子目录；conanfile 必须按完整结构 make -C <source>/src（E350 类坑，勿照抄 src 提升版 .work 路径）"
  - "CC/CXX/AR/RANLIB 均为 Makefile 变量可命令行覆盖 → 零补丁交叉编译；无 x86 专属 flag（-ffloat-store 仅告警被 clang 忽略）"
  - "OHOS 版 conan 2.29.1 中 self.conf.get('tools.build:compiler_executables:c', check_type=str) 会抛异常，须整体读 dict 再取子键"
  - "basic_layout 下 build() cwd 是 build-release/ 子目录，make -C 须用 self.source_folder 绝对路径"
  - "can_run 在本 conan 版本位于 conan.tools.build（非 conan.tools.can_run）"
  - "上游 install 只装 EXES，库与头文件须 package() 手动 copy"
  - "libprimer3.cc 为唯一 C++ 源（-std=c++11），消费方链接 libprimer3.a 须用 C++ 链接器"
