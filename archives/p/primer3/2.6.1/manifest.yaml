software: primer3
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.6.1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.6.1"

# 编译状态
# published | built | failed | archived
status: built

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-15"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://github.com/primer3-org/primer3/archive/refs/tags/v2.6.1.tar.gz"

  # 源码校验和
  sha256: "805cef7ef39607cd40f0f5bb8b32e35e20007153a0a55131dd430ce644c8fb9e"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

# 构建系统类型 (flat field for verify-build G4)
build_system: makefile

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options:
    - "CC=clang"
    - "CXX=clang++"
    - "PREFIX=/storage/Users/currentUser/usr/local"
    - "CFLAGS=-fPIC -g -Wall -O2"
    - "CXXFLAGS=-fPIC -g -Wall -O2 -std=c++11"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # primer3 无外部依赖，仅依赖系统数学库 -lm

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-Makefile.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "primer3 源码在 tarball 中嵌套于 src/ 子目录，init-build 自动提升到顶层；测试目录需创建符号链接 ../test/ → primer3-2.6.1/test，以及 ../src/ → primer3-2.6.1.work 才能运行测试"
  - "系统无 gcc/g++，必须修改 Makefile 将 CC=gcc→clang, CXX=g++→clang++"
  - "Makefile 的 install 目标不支持 DESTDIR，需修改为 $(DESTDIR)$(PREFIX)/bin 并增加 lib 安装行"
  - "primer3_config/ 热力学参数文件和 kmer_lists/ 是运行时必需的数据目录，Makefile 不自动安装，需手动复制到 $PREFIX/share/"
  - "primer3_masker 默认查找 ../kmer_lists/ 目录，测试时需从 tarball 解压并创建符号链接"
  - "primer3 只生成静态库 (.a)，不生成共享库 (.so)；G2 功能验证中多数工具 --version 返回用法而非版本号"

patch_generation:
  method: per-file-difflib
  source_orig_dir: /storage/Users/currentUser/tmp/builds/primer3-2.6.1.orig
  source_work_dir: /storage/Users/currentUser/tmp/builds/primer3-2.6.1.work
  source_orig_hash: 4dd92a758c17249f
  source_work_hash: 08ea78ecde7d8cfc
  generated_at: '2026-06-15T13:17:24'
  patches_count: 1

patch_classification:
  - file: 0001-Makefile.patch
    type: toolchain
    platform_only: True
    guard: 'CC=gcc'
