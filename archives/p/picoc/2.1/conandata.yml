# conandata.yml — picoc 2.1
# 官方源码: picoc-2.1.tar.bz2 (googlecode 官方归档; googlecode 关闭后由
# Google Code Archive 权威镜像提供，pkgsrc distinfo SIZE=69991 一致)

sources:
  url: "https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/picoc/picoc-2.1.tar.bz2"
  sha256: "bfed355fab810b337ccfa9e3215679d0b9886c00d9cb5e691f7e7363fd388b7e"

patches:
  - patch_file: "patches/0001-cstdlib-stdio.c.patch"
    patch_description: "musl portability: FILE is opaque so sizeof(FILE) is invalid; use PICOC_SYSTEM_FILE_SIZE (glibc exact / fixed 512 upper bound elsewhere)"
    patch_type: "portability"
  - patch_file: "patches/0002-cstdlib-string.c.patch"
    patch_description: "musl portability: replace BSD index/rindex aliases (missing on musl) with strchr/strrchr"
    patch_type: "portability"
  - patch_file: "patches/0003-cstdlib-unistd.c.patch"
    patch_description: "musl portability: gethostid/getpass/ualarm are glibc-only (missing headers+symbols on musl); guard them with __GLIBC__"
    patch_type: "portability"
