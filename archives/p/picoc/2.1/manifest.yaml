build:
  cc: clang
  ldlibs: "-lreadline -lncursesw -lm"

knowledge_gained:
  - "picoc 2.1 为纯 Makefile 项目（无 configure），产物为单个 picoc 可执行文件（knowledge_ref: notes.md#知识积累）"
  - "UNIX_HOST 默认启用 USE_READLINE，链接 GNU readline；静态 readline 需同时链 -lncursesw（knowledge_ref: notes.md#知识积累）"
  - "OHOS/musl 下 FILE 为不透明类型 sizeof(FILE) 非法 → 用 PICOC_SYSTEM_FILE_SIZE（glibc 精确值/其他固定上限）（knowledge_ref: notes.md#知识积累）"
  - "gethostid/getpass/ualarm 为 glibc 专有、musl 头文件与符号均缺失 → __GLIBC__ 守卫剔除对应内建函数（knowledge_ref: notes.md#知识积累）"
  - "rindex/index BSD 别名在 musl 缺失 → 底层改用 strrchr/strchr（注册名不变）（knowledge_ref: notes.md#知识积累）"
  - "上游测试入口 make test：51 个 .test 用例（.c 运行输出与 .expect diff），全部通过（knowledge_ref: notes.md#知识积累）"

