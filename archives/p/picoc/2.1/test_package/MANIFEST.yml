# test_package/MANIFEST.yml — picoc 2.1
# 上游官方测试声明（CI L0e 读取）

package: picoc/2.1
homepage: "https://gitlab.com/zsaleeba/picoc"

# 上游测试入口（顶层 Makefile 的 test target 委派到 tests/Makefile）
upstream_check_command: "make test"
# 上游测试未集成进 conanfile.py build()，另行在本地完整执行（51/51 通过）
upstream_test_in_build: false
upstream_test_command: "make test"

upstream_tests:
  - file: tests/Makefile
    source: picoc-2.1/tests/Makefile
    description: "51 个上游回归用例：picoc 运行各 NN_xxx.c，stdout 与 NN_xxx.expect 用 diff 比对"
    command: "make test"

test_package_tests:
  - file: smoke.c
    description: "真实 picoc 程序（main 入口 + stdio include + 算术）；test() 运行包内 picoc 解释它并断言输出 'picoc-test-ok 42'"
    command: "picoc smoke.c"

# 上游 51 用例 + test_package 1 项冒烟
assertion_count: 52
