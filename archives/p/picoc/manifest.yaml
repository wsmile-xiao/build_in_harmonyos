software: picoc
display: "picoc (PicoC)"
description: "A very small C interpreter for scripting"
category: lang
homepage: "https://gitlab.com/zsaleeba/picoc"
license: BSD-3-Clause
build_system: makefile

ohos_adaptation:
  key_points:
    - "纯 Makefile 项目（无 configure），产物为单个 picoc 可执行文件（bin/picoc）"
    - "UNIX_HOST 默认启用 USE_READLINE，链接 GNU readline（静态，需同时 -lncursesw）"
    - "musl 下 FILE 不透明 sizeof(FILE) 非法 → PICOC_SYSTEM_FILE_SIZE（glibc 精确值/其他固定上限 512）"
    - "gethostid/getpass/ualarm 为 glibc 专有、OHOS musl 声明与符号均缺失 → __GLIBC__ 守卫剔除"
    - "index/rindex BSD 别名 musl 缺失 → 底层改用 strchr/strrchr，解释器可见注册名不变"
    - "上游 51 项回归测试（make test）在 OHOS 上全部通过"
  common_dependencies:
    - readline

versions:
  "2.1":
    status: built
    build_date: "2026-09-06"
