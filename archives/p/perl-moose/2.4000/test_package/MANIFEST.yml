# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 填写方法:
#   1. 解压上游源码包
#   2. 运行 make -n check (或 ctest -N / meson test --list) 查看测试列表
#   3. 把实际运行的测试记录到下方

package: perl-moose/2.4000
homepage: "https://metacpan.org/dist/Moose"

# 上游测试命令 (用于 make -n check / ctest -N / meson test --list 分析)
upstream_check_command: "perl Makefile.PL && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
upstream_tests:
  - file: t/000_load.t
    source: Moose-2.4000/t/000_load.t
    description: "Moose 基本加载测试"
    command: "perl -Ilib t/000_load.t"
  - file: t/basics/basic_class_setup.t
    source: Moose-2.4000/t/basics/basic_class_setup.t
    description: "Moose 基础类定义、属性、方法测试 (29 tests)"
    command: "perl -Ilib t/basics/basic_class_setup.t"
  - file: t/attributes/attribute_delegation.t
    source: Moose-2.4000/t/attributes/attribute_delegation.t
    description: "Moose 属性委托测试 (107 tests)"
    command: "perl -Ilib t/attributes/attribute_delegation.t"

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: test_moose.sh
    description: "消费者测试：加载 Moose 模块并定义类、属性、继承、类型约束、元类"
    command: "sh test_moose.sh <perl_lib>"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 12
