category: perl
build_system: perl_makefile
license: perl_artistic
build_date: "2026-06-23"
compile_date: "2026-06-23"
compiler: clang 18.1.8
perl_version: 5.42.0

platform_notes: |
  Moose 是 Perl 5 的完整面向对象系统。
  在 OpenHarmony 上，HMDFS 阻止 dlopen 加载 /storage 路径下的 .so 文件。
  通过纯 Perl 回退补丁使 Moose 在无 XS 环境下完整可用。
  XS .so 已编译签名，安装到 /data/service/hnp/ 后可自动启用 XS 加速。

