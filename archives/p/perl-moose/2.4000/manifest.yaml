  url: "http://www.cpan.org/authors/id/E/ET/ETHER/Moose-2.4000.tar.gz"
  sha256: ""
  tar_format: tar.gz

build:
  system: custom
  configure_options:
    - "INSTALL_BASE=/storage/Users/currentUser/usr/local"
  dependencies:
    - "perl/5.42.0"
    - "Class-Load-XS/0.10"
    - "Package-Stash-XS/0.30"
    - "Sub-Name/0.28"
    - "Devel-OverloadInfo/0.008"
    - "Package-DeprecationManager/0.17"
  cc: clang
  cxx: clang++

