  - "0002-lib-Class-MOP.pm.patch"
  - "0003-lib-Class-MOP-PurePerl.pm.patch"

knowledge_gained:
  - "HMDFS dlopen restriction ref:E097"
  - "OHOS SDK sysroot paths ref:E001"
  - "libunwind.a location ref:E002"
  - "ExtUtils can_compile_loadable_object failure ref:E097"
  - "Sub::Util set_subname replacement ref:E003"
  - "Moose XS bootstrap: pure Perl fallback for all INSTALL_SIMPLE_READER methods"
  - "Moose is_stub: B::CV ROOT returns B::NULL for stubs, B::UNOP for real methods"

