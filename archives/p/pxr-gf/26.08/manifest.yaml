knowledge_gained:
  - usd_cmake_target: building CMake target "gf" pulls in its dependency closure arch and tf (same pattern as pxr-vt target "vt")
  - usd_lib_prefix: USD static libraries are named libusd_<name>.a, located in build/pxr/base/<name>/ subdirectories
  - usd_generated_headers: USD generates pxr/pxr.h version header in build/include/, must be packaged alongside source headers
  - ohos_sysconf: _SC_LEVEL1_DCACHE_LINESIZE is not defined on OHOS musl; feature-based #ifdef guard with fallback 64 (same as pxr-vt)
  - ohos_strerror_r: On OHOS musl, strerror_r returns int (POSIX), not char* (GNU); removing the _GNU_SOURCE branch makes the POSIX path portable
  - ohos_environ: On OHOS musl, __environ is not available; use environ instead
  - ohos_deffilemode: DEFFILEMODE is not defined in sys/stat.h on OHOS musl; define as 0666 under feature guard
  - conan_cmakedeps_note: find_package(TBB) resolves without CMakeDeps because CMakeToolchain adds deps' builddirs to CMAKE_PREFIX_PATH and tbb package ships its own TBBConfig.cmake
patches_applied:
  - patch_file: "patches/0001-arch-tf-fixes-for-ohos.patch"
    description: "Fix arch/tf build errors on OHOS using feature-based guards (no platform macros): _SC_LEVEL1_DCACHE_LINESIZE undefined, strerror_r return type mismatch, __environ to environ, DEFFILEMODE undefined"
source_url: https://github.com/PixarAnimationStudios/OpenUSD/archive/refs/tags/v26.08.tar.gz
