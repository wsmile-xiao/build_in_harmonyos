# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md
#
# 上游清点结论（四口径，详见 reports/test-report.md）：N = 111

package: plusaes/1.0.0
homepage: "https://github.com/kkAyataka/plusaes"

# 上游没有 `make check` 测试目标：lin/Makefile.am 只用 bin_PROGRAMS 构建
# unit_test（内嵌 GoogleTest），上游的测试入口就是执行该二进制
# （lin/build.sh = bootstrap && configure && make 之后 ./unit_test/unit_test）。
upstream_check_command: "cd lin && ./build.sh && ./unit_test/unit_test"

# conanfile.py build() 方法中是否已集成上游测试
# （lin/ 的 autotools 骨架要求 bootstrap 工具链，CI worker PATH 无 automake，
#  因此配方按 lin/unit_test/Makefile.am 的 TU 清单直接编译同一组源文件）
upstream_test_in_build: true
upstream_test_command: "clang++ -std=c++11 -O2 -Wall -I include -I unit_test/lib/include -I unit_test/src/gtest unit_test/src/gtest/gtest-all.cc unit_test/src/main.cpp unit_test/src/test-ctr.cpp unit_test/src/test-gcm.cpp unit_test/src/test-inc.cpp unit_test/src/test-plusaes.cpp -lpthread -o plusaes_unit_test && ./plusaes_unit_test --gtest_list_tests && ./plusaes_unit_test"

# GoogleTest 实际运行的测试（统计口径 = 框架注册用例数，
# test-inc.cpp 只 #include 头文件、0 注册，属编译覆盖）
upstream_tests:
  - file: test-plusaes.cpp
    source: plusaes-1.0.0/unit_test/src/test-plusaes.cpp
    description: "GoogleTest AES core: key schedule / ECB / CBC / key helper / error paths (32 registered cases, TEST()×32)"
    command: "./plusaes_unit_test --gtest_filter=AES.*"
    total: 32
    passed: 32
  - file: test-ctr.cpp
    source: plusaes-1.0.0/unit_test/src/test-ctr.cpp
    description: "GoogleTest CTR mode: TEST_P×2 instantiated to 22 cases (Ctr/CtrTest 12 + InvalidSize/CtrInvalidSizeTest 10)"
    command: "./plusaes_unit_test --gtest_filter=Ctr/*:InvalidSize/CtrInvalidSizeTest.*"
    total: 22
    passed: 22
  - file: test-gcm.cpp
    source: plusaes-1.0.0/unit_test/src/test-gcm.cpp
    description: "GoogleTest GCM mode: 3 TEST_P + 1 TEST instantiated to 57 cases (DocDef 4 + LenCombo 26 + FixedSizeIvTag 3 + InvalidSize 23 + GcmInvalidTag 1)"
    command: "./plusaes_unit_test --gtest_filter=DocDef/*:LenCombo/*:FixedSizeIvTag/*:InvalidSize/GcmInvalidSizeTest.*:GcmInvalidTag.*"
    total: 57
    passed: 57
  - file: test-inc.cpp
    source: plusaes-1.0.0/unit_test/src/test-inc.cpp
    description: "translation unit that only #includes plusaes/plusaes.hpp — compilation coverage, 0 registered cases"
    command: "(compiled into plusaes_unit_test, no run)"
    total: 0
    passed: 0

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: example.cpp
    description: "消费者视角 25 项断言：PLUSAES_VERSION 指纹、ECB(CBC) NIST SP 800-38A 已知答案、CTR 密钥流与独立 OpenSSL 交叉核验、GCM 规范空报文标签向量、四种模式往返 + PKCS padding 记账、非法密钥尺寸与篡改标签错误路径"
    command: "./test_package"
    assertion_count: 25

# 测试断言总数 (上游 70 断言/111 用例 + 消费者 25 断言)
assertion_count: 25
