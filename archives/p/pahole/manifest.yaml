software: pahole
display: "pahole"
description: "pahole 及 DWARF/CTF/BTF 调试信息分析工具集（pahole/codiff/pfunct 等 CLI）"
category: developer-tools
homepage: "https://github.com/acmel/dwarves"
license: GPL-2.0-or-later
build_system: cmake

# 命名说明：平台任务名为 pahole，上游项目/库/Linux 发行版包名仍为 dwarves
# （上游仓库 https://github.com/acmel/dwarves，最新 tag v1.31）。Conan 包名与
# 目录名取任务名 pahole，以保证 CI 分支门禁（R40/L0m-4）与平台任务关联一致；
# 编译产物仍为 libdwarves*.so 与公开头 dwarves.h，与上游一致。

ohos_adaptation:
  key_points:
    - "LIBBPF_EMBEDDED=ON 默认编译内嵌 libbpf；GitHub release tarball 不含 lib/bpf 子模块，需在 source() 单独拉取锁定 commit"
    - "非 glibc 的 Linux libc（OHOS musl）下 linux/socket.h 与 sys/socket.h 均定义 sockaddr_storage（E091）：libbpf netlink.c/nlattr.c 在 include 期间重命名规避"
    - "musl 无 glibc argp/obstack：requires argp-standalone/1.5.0 与 musl-obstack/1.2.3，Findargp/Findobstack 经 CMAKE_LIBRARY_PATH 注入"
    - "上游自定义 FindDWARF 只查 /usr 路径：依赖 include/lib 目录需经 CMAKE_INCLUDE_PATH/CMAKE_LIBRARY_PATH/CMAKE_C_FLAGS 注入"
    - "dwarves.h 公开头直接 include obstack.h/argp.h/dwarf.h：消费者需显式链接 musl-obstack/argp-standalone/elfutils（CMakeDeps 不展开传递依赖 include）"
  common_dependencies:
    - elfutils/0.195
    - zlib/1.3.1.1
    - argp-standalone/1.5.0
    - musl-obstack/1.2.3

versions:
  "1.31":
    status: built
    build_date: "2026-09-26"
