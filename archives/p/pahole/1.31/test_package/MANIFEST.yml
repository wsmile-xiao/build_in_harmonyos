---
package: pahole/1.31
homepage: "https://github.com/acmel/dwarves"

upstream_check_command: "tests/tests"
upstream_test_in_build: false
upstream_test_command: "tests/tests"

upstream_tests:
  - name: btf_functions
    command: "tests/btf_functions.sh"
    expected: "skip (exit 2) when no vmlinux matches running kernel"
  - name: default_vmlinux_btf
    command: "tests/default_vmlinux_btf.sh"
    expected: "pass on systems without kernel BTF"
  - name: flexible_arrays
    command: "tests/flexible_arrays.sh"
    expected: "skip (exit 2) when no vmlinux file available"
  - name: pfunct_btf_decl_tags
    command: "tests/pfunct-btf-decl-tags.sh"
    expected: "pass when /tmp writable and clang bpf target available"
  - name: prettify_perf_data
    command: "tests/prettify_perf.data.sh"
    expected: "skip (exit 2) when no perf binary available"
  - name: reproducible_build
    command: "tests/reproducible_build.sh"
    expected: "skip (exit 2) when no vmlinux + bpftool available"

test_package_tests:
  - file: consumer_pahole.c
    description: "Call dwarves__init/dwarves_print_numeric_version public API via libdwarves"
    command: "./consumer_pahole"
  - file: conanfile.py
    description: "Installed pahole CLI runs (pahole --version) under the conanrun runtime env"
    command: "pahole --version"
  - file: ohos_btf_sample.c
    description: "clang --target=bpf 生成 BTF 对象后 pahole -F btf 解析出结构体类型（OHOS aarch64 专项）"
    command: "pahole -F btf sample.o"

assertion_count: 3
