software: perl-list-utilsby
display: "List::UtilsBy"
description: "Perl module providing higher-order list manipulation functions"
category: data                     # data-processing library
homepage: "https://metacpan.org/pod/List::UtilsBy"
license: Artistic-1.0-Perl OR GPL-1.0-or-later
build_system: perl                 # Perl Makefile.PL

# 跨版本通用的 OHOS 适配知识
ohos_adaptation:
  key_points:
    - "纯 Perl 模块，无 XS/C 代码，编译简单"
    - "只需 perl Makefile.PL PREFIX=~/usr/local"
    - "无补丁，无特殊编译参数"
    - "用户需设置 PERL5LIB 环境变量才能使用"
  common_dependencies:
    - perl/5.42.0
  notes:
    - "不受 SELinux HMDFS 限制（纯 Perl 模块）"
    - "安装路径: ~/usr/local/lib/site_perl/5.42.0/List/UtilsBy.pm"

# 版本索引（所有已归档版本，含状态）
versions:
  "0.12":
    status: published
    build_date: "2026-06-12"
    test_result: "100% PASS (14/14)"
    package: "perl-list-utilsby-0.12-ohos-aarch64.tar.gz"