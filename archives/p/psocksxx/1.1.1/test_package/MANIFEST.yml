# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: psocksxx/1.1.1
homepage: "https://github.com/uditha-atukorala/psocksxx"

# 上游测试套件：test/ 下 7 个 CppUnit 测试套件经 tap-runner 执行（TAP 输出，
# aux-build/tap-driver.sh 驱动），由 AM_PATH_CPPUNIT 条件启用（HAVE_CPPUNIT），
# `make check` 构建并运行。
upstream_check_command: "make check"
upstream_test_in_build: true
upstream_test_command: "make check"
upstream_tests:
  - file: test/tap-runner.cpp
    source: psocksxx-1.1.1.tar.gz/test/tap-runner.cpp
    description: "Run the upstream CppUnit TAP suite: 7 suites / 49 atomic cases (loopback TCP/UDP echo, unix-domain sockets, timeouts, exception types)"
    command: "make check"

# test_package 中自带的测试 (消费者视角验证，R34: 实质驱动被测库)
test_package_tests:
  - file: test_consumer.cpp
    description: "Compile a real client against the packaged headers/static archive, drive psocksxx::tcpnsockstream + nsockaddr over a loopback TCP echo round-trip, and assert the echoed payload"
    command: "./test_consumer"

# 测试断言总数：上游 49 个 CPPUNIT_TEST 声明（原子用例口径）+ 消费者 3 断言
assertion_count: 52
