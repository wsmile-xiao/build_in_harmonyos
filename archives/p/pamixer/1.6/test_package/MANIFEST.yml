# test_package/MANIFEST.yml
# Upstream official test declaration file
# CI script (build_and_test.sh L0e) requires this file to exist

package: pamixer/1.6
homepage: "https://github.com/cdemoulins/pamixer"

# pamixer has no upstream test suite (no `make check` / `meson test`)
upstream_check_command: ""
upstream_test_in_build: false
upstream_test_command: ""

# No upstream tests exist — pamixer is a CLI tool without a test suite
upstream_tests: []

# Consumer-side tests in test_package
test_package_tests:
  - file: test_pamixer.sh
    description: "Verifies pamixer binary exists, is valid ELF, and runs --version"
    command: "bash test_pamixer.sh"

# Approximate assertion count for quality assessment
assertion_count: 3
