patches_applied: []

knowledge_gained:
  - "pamixer 1.6 uses meson build system but can be compiled directly with clang++"
  - "cxxopts/3.3.1.1 published in ohpcd registry — use as dependency instead of vendoring the header"
  - "E501: OHOS SDK lld loads libxml2.so.16 via RUNPATH; any LD_LIBRARY_PATH entry shadowing it with an unloadable copy (e.g. Conan-cached shared lib) breaks all link commands — fix: prepend SDK ohos/native/llvm/lib to LD_LIBRARY_PATH around link commands"
  - "Conan 2 self.run(env=...) only accepts env script names (str/list), a raw dict raises AssertionError"

