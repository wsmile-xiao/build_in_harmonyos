# 知识沉淀
knowledge_gained:
  - "纯 Perl 模块（仅 .pm）在 OpenHarmony 上直接编译通过，无需 patch 或特殊链接参数"
  - "纯 Perl 模块不受 SELinux HMDFS 限制影响，与 XS 模块（如 perl-dbd-pg）形成对比"
  - "Net::HTTP 的 HTTPS 功能依赖 Net::SSLeay XS 模块，受 SELinux 限制不可用（平台限制，非模块缺陷）"
  - "Conan 配方对纯 Perl 模块：build() 用 perl Makefile.PL + make，package() 复制 blib/lib/*.pm，package_info() 设 cpp_info.libs=[]"
  - "R26 静态链接规则对纯 Perl 模块不适用（无二进制产物），conan-verify G1 会警告但整体 PASS"
  - "Net::HTTP 完整 HTTP/1.1 功能（请求格式化、响应解析、chunked 编码、keep-alive）在 OpenHarmony 上端到端测试通过"
