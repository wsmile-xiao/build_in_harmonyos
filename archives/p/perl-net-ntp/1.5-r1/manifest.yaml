software: perl-net-ntp
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/1.5-r1/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "1.5-r1"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-26"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/A/AB/ABH/Net-NTP-1.5.tar.gz"

  # 源码校验和
  sha256: "b16817f88ecc75f155aea3dcf8874d4b8bcc0c9d249e1bc1e12ce7cfa5e7d9aa"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: custom

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies:
    - perl/5.42.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied:
  - "0001-fix-ohos-getservbyname-segfault.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "OHOS 平台 getservbyname() 对某些 UDP 服务名查询存在段错误缺陷，eval 无法捕获（C 级 SIGSEGV）"
  - "修复方案：将 IO::Socket::INET 的 PeerPort 从服务名改为数字端口，功能等价"
  - "Net::NTP 是纯 Perl 模块（无 XS/C 编译），不受 SELinux HMDFS 限制影响，安装后可直接使用"
  - "Perl 模块构建系统为 ExtUtils::MakeMaker (perl Makefile.PL + make)，Conan 配方需适配此构建系统"
  - "纯 Perl 模块的 Conan 配方 package() 需额外复制 .pm 文件到 lib/ 目录以满足 G4 产物完整性检查"
