software: picolisp
display: "PicoLisp"
description: "A pragmatic Lisp programming language focused on data manipulation"
category: language
homepage: "https://software-lab.de"
license: MIT/X11
build_system: makefile

# OHOS 适配要点
ohos_adaptation:
  key_points:
    - "PicoLisp 是引导编译器，需要预生成的 LLVM IR (.ll 文件)"
    - "pkg-config 中 libffi 包名实际为 ffi"
    - "需禁用 bootstrap 规则以保护预生成的 IR 文件"
    - "需要正确设置 PKG_CONFIG_PATH 以找到预编译依赖"
  common_dependencies:
    - readline
    - libffi
    - openssl

# 版本索引
versions:
  "26.3":
    status: built
    build_date: "2026-05-26"