software: perl-role-tiny
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/2.002004/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "2.002004"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-29"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://cpan.metacpan.org/authors/id/H/HA/HAARG/Role-Tiny-2.002004.tar.gz"

  # 源码校验和
  sha256: "d7bdee9e138a4f83aa52d0a981625644bda87ff16642dfa845dcb44d9a242b45"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom | perl
  system: perl
  build_system: perl

  # 配置选项列表
  configure_options: []
  # 例如:
  # - "-DCMAKE_BUILD_TYPE=Release"
  # - "-DCMAKE_SYSTEM_NAME=OHOS"

  # 编译依赖列表（格式: name/version）
  dependencies: []
  # 例如:
  # - openssl/1.1.1w
  # - curl/8.19.0

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []
# 例如:
# - "0001-bootstrap-ohos-toolchain.patch"

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块 (Role::Tiny) 在鸿蒙平台无需特殊适配，使用标准 Makefile.PL 流程即可编译"
  - "Perl 5.42.0 (aarch64-linux) 系统预装版本可直接使用，路径 /data/service/hnp/bin/perl"
  - "Role::Tiny 的 before/after/around 修饰符依赖 Class::Method::Modifiers (可选依赖)，xt/ 扩展测试需此模块"
  - "conanfile.py package_info 中通过 runenv_info.append_path 设置 PERL5LIB，消费者自动获取 Perl 模块路径"
  - "参考 perl-dbd-pg 经验：纯 Perl 模块的 test_package 使用 perl -MModule 的 smoke test 模式"
