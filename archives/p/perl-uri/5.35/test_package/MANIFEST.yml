# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在
# 详见: docs/TEST_QUALITY_SPEC.md

package: perl-uri/5.35
homepage: "https://metacpan.org/pod/URI"

# 上游测试命令 — URI 上游 t/ 测试套件（make test）
upstream_check_command: "perl Makefile.PL && make && make test"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序（2026-08-17 实测记录）：
# - t/ 目录：64 个 .t 测试文件（abs/ftp/iri/mailto/rel/sip 等）
# - 实测结果：**Files=64, Tests=1021, All tests successful（100%）**——
#   全部测试真实运行通过（mailto.t 的 16 个 TODO passed 为正常预期），
#   无受阻无失败
upstream_tests:
  - file: t/
    source: URI-5.35/t/
    description: "上游 perl 测试套件（64 文件 1021 用例；实测 1021/1021 100% 通过，无受阻无失败）"
    command: "perl Makefile.PL && make && make test"

# test_package 中自带的测试（消费者视角验证）
test_package_tests:
  - file: test_uri.pl
    description: "消费者测试：真实 API（R34）——URI->new + scheme/host/port/path 访问器"
    command: "perl test_uri.pl <site-perl-dir>"

# 测试断言总数（近似值，用于质量评估）
assertion_count: 2
