software: postgresql-uint
# 版本级 manifest
# 文件位置: archives/p/postgresql-uint/0/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0"
status: built
build_system: pgxs
build_date: "2026-06-09"

# ============================================================
# 源码信息
# ============================================================

source:
  url: "https://github.com/adjust/pguint"
  sha256: ""
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  system: makefile

  configure_options:
    - "USE_PGXS=1"
    - "PG_CONFIG=/storage/Users/currentUser/usr/local/bin/pg_config"

  dependencies:
    - "postgresql/16.14"

  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "pguint 是 PostgreSQL 无符号整数扩展, 使用 PGXS 构建系统"
  - "pguint 需要先运行 python generate.py 16 生成 operators.c 和 operators.sql"
  - "pguint 版本号为 0 (uint.control default_version=0)"
  - "源码从 GitHub (adjust/pguint) 克隆下载, GitHub API 和直接 git clone 在本平台可能超时"