software: postgresql-uint
description: "PostgreSQL unsigned integer type extension - provides uint1, uint2, and uint4 data types"

versions:
  3.0.0:
    status: built
    build_date: "2026-06-03"
    dependencies:
      - "postgresql/17.0"

category: database-extension
license: PostgreSQL
homepage: "https://github.com/nad2000/postgresql-contrib-uint"

ohos_adaptation:
  key_points:
    - "Uses PGXS build system (PostgreSQL Extension Building Infrastructure)"
    - "No source code modifications required"
    - "Requires pg_config from PostgreSQL installation"
  common_dependencies:
    - postgresql