software: perl-mojo-pg
# 版本级 manifest 模板
# 文件位置: archives/{letter}/{name}/4.28/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "4.28"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-06-23"
compile_date: "2026-06-23"

# 构建系统（顶级字段，用于脚本解析）
build_system: perl-makemaker

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "file:///storage/Users/currentUser/tmp/Mojo-Pg-4.28.tar.gz"

  # 源码校验和
  sha256: ""

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile
  build_system: perl-makemaker

  # 配置选项列表
  configure_options:
    - "perl Makefile.PL INSTALL_BASE=$DEFAULT_PREFIX"

  # 编译依赖列表（格式: name/version）
  dependencies:
    - "perl/5.42.0"
    - "perl-mojolicious/9.42"
    - "perl-dbi/1.637"
    - "perl-dbd-pg/3.18.0"
    - "perl-sql-abstract/2.000001"
    - "perl-sql-abstract-pg/1.0"

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "纯 Perl 模块（无 C/XS 代码），构建仅复制 .pm 文件，无需补丁"
  - "DBD::Pg XS 模块 .so 在 HMDFS 上无法 dlopen（SELinux 限制），需安装到系统目录 /data/service/hnp/"
  - "DBI 在 PurePerl 模式下自动回退，但 DBD::Pg 无 PurePerl 后备"
  - "SQL::Abstract 2.000001 和 SQL::Abstract::Pg 1.0 为运行时依赖，需单独安装"
  - "Mojo::Pg 加载 DBD::Pg 时使用 use DBD::Pg qw(:async)，需要 :async 标签导出常量"
  - "MakeMaker INSTALL_BASE 安装路径 (lib/perl5/site_perl/5.42.0) 与 Perl 默认 @INC 路径 (lib/site_perl/5.42.0) 不匹配"
