software: postgresql-mysql_fdw
display: "mysql_fdw"
description: "MySQL Foreign Data Wrapper for PostgreSQL — query MySQL/MariaDB tables as foreign tables"
category: db
homepage: "https://github.com/EnterpriseDB/mysql_fdw"
license: PostgreSQL
build_system: pgxs

ohos_adaptation:
  key_points:
    - "RTLD_DEEPBIND 不可用于 OpenHarmony musl libc，需在 dlopen 调用中添加 __OHOS__ 平台守卫 [E201]"
    - "mariadb-connector-c 的 mysql_config --libs 输出 -lmariadb，Makefile 需额外检测 mariadb（不含 client 后缀） [E201]"
    - "PGXS 扩展无 configure 步骤，直接 make USE_PGXS=1 编译 [E200]"
  common_dependencies:
    - postgresql
    - mariadb-connector-c

versions:
  "REL-2_9_3":
    status: published
    build_date: "2026-06-10"