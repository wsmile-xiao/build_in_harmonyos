# 版本级 manifest
# 文件位置: archives/p/pd-zexy/2.4.4/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

version: "2.4.4"
software: "pd-zexy"
status: published
build_date: "2026-09-29"
build_system: "makefile"

# ============================================================
# 源码信息
# ============================================================

source:
  # GitHub 官方 tarball 投递主机（codeload），tag v2.4.4，与
  # https://github.com/iem-projects/pd-zexy/archive/refs/tags/v2.4.4.tar.gz 同字节。
  # 上游主站 git.iem.at 对自动抓取返回 HTML（非 tarball），故取官方 org 镜像。
  url: "https://codeload.github.com/iem-projects/pd-zexy/tar.gz/refs/tags/v2.4.4"
  sha256: "94d96833c43647c11f51e7218947d8122267135490e656ef558d81b4a1abb5cb"
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 上游 vendored 的 pd-lib-builder（Makefile.pdlibbuilder 0.7.0）
  system: makefile
  configure_options:
    - 'CC=<clang from tools.build:compiler_executables>'
    - 'PDINCLUDEDIR=<puredata package>/include/pd'
    - 'with-lpt=no'
    - '-j1'
  dependencies:
    - puredata/0.54.1
  # 仅 test_package 使用：puredata 包的 bin/pd 作为上游回归套件宿主
  test_dependencies:
    - puredata/0.54.1
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

knowledge_gained:
  - "OHOS sysroot 装着 <sys/io.h>，但 musl 不提供 ioperm/inb/outb —— zexy 的 $(CPP) 头探针在此必然假阳性（头存在 ≠ 接口存在）"
  - "假阳性的代价被『单产物库』放大：x86 并口对象被链进同一个 zexy.pd_linux，未解析符号在链接期放行、在 dlopen 全量重定位时爆炸，一个符号让全部约 90 个类不可用（上游回归 36 项挂 19 项）"
  - "处理用上游自带开关 with-lpt=no（→ -DZ_WANT_LPT=0），零补丁；关闭后 nm -uD 符号清点精确归零，上游回归 13 PASS/19 FAIL → 32 PASS/0 FAIL/4 XFAIL"
  - "插件类产物的验收不能停在『编译/链接成功』：必须做符号层清点 + 真实 dlopen 冒烟 + 上游全套回归"
  - "上游 tests/testrunner.sh 的补丁参数必须用相对路径（等价 make check 从源码根跑 find tests/*/）：绝对路径会让 tests/absgn~/abs.pd 报 can't load abstraction within itself（同一产物实测：绝对 FAIL=1 / 相对 PASS=32）"
  - "上游回归套件依赖非 .pd 数据（tests/msgfile/*.txt、runtests.sh/bat、README.txt）→ package() 须整目录拷贝 tests//abs//reference/，只按 *.pd 拷贝会掉 2 个 msgfile 用例"
  - "conandata 的 sources 需按 self.version 取键：get(self, **self.conan_data['sources'][self.version], strip_root=True, filename=...)"
  - "与 pd-vbap 同族但缺口不同：vbap 是『构建不起来』（无 cc / 头集 / musl 符号作用域），zexy 是『构建成功但产物整体不可加载』——已沉淀为知识条目草稿 E998"
