# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: pd-zexy/2.4.4
homepage: "https://github.com/iem-projects/pd-zexy"

# 上游测试命令：Makefile 有 check 目标，把 tests/*/ 下的补丁逐个交给
# tests/testrunner.sh（需 Pd 宿主与已构建产物）。
upstream_check_command: "make check  # Makefile:226 -> find tests/*/ -name '*.pd' -exec tests/testrunner.sh -v -Xls {} +"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际存在的测试用例（清点结果：16 个测试目录 / tests 下 40 个 .pd 文件，
# 其中 36 个为可运行回归补丁、4 个为套件框架补丁 / 1 个驱动脚本）
upstream_tests:
  - file: tests/testrunner.sh
    source: pd-zexy-2.4.4/tests/testrunner.sh
    description: "上游回归框架驱动脚本：每个补丁须向 outlet 回送 1，超时/无结果判失败；-X 模式下 fail*.pd 记为 XFAIL"
    command: "PD=<pd> LIBDIR=<built> ABSDIR=<built>/abs tests/testrunner.sh -v -Xls tests/*/*.pd"
  - file: tests/run1.pd
    source: pd-zexy-2.4.4/tests/run1.pd
    description: "上游单补丁测试宿主（按 -send test <patch> 装载被测补丁）"
    command: "pd -noprefs -nostdpath -oss -nosound -nrt -nogui -batch -path <built> -lib <built>/zexy -open tests/run1.pd -send 'test tests/sgn~/simple'"
  - file: tests/*/*.pd
    source: pd-zexy-2.4.4/tests/*/*.pd
    description: "36 个可运行上游回归补丁（= tests/testrunner.sh 收集口径 `find tests -mindepth 2 -name '*.pd'`，等价上游 make check；tests/ 下另有 run1.pd / runtests.pd / runtests_nogui.pd / testunit.pd 4 个套件框架补丁不计入），分布于 abs~ / absgn~ / and~ / eq~ / gt~ / lt~ / l2s / s2l / list2lists / lister / msgfile / or~ / relay / repeat / sgn~ / testtests 等 16 个目录；其中 4 个 fail*.pd 为预期失败（XFAIL）"
    command: "同上（testrunner.sh 一次收集全部补丁）"

# test_package 中自带的测试（消费者视角验证）——以 puredata/0.54.1 的 bin/pd 为宿主跑上游套件
test_package_tests:
  - file: run_upstream_suite.sh
    description: "以打包后的 zexy.pd_linux + pd 宿主执行上游 36 个可运行回归补丁，输出 Testsuite 汇总供 conanfile.py 断言"
    command: "bash run_upstream_suite.sh <stage> <pd>  # 由 conanfile.py test() 调用"
  - file: conanfile.py
    description: "断言 TOTAL>=36 且 FAIL==0 且 PASS>=32（实测 32 PASS / 0 FAIL / 4 XFAIL）；package 的 lib/pd-externals 被移除时（CI L1e/R34 破坏性验证）zexy.pd_linux 缺失即硬失败"
    command: "conan test test_package pd-zexy/2.4.4"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 36
