software: pd-zexy
display: "pd-zexy"
description: "zexy external object set for Pure Data: list/symbol/message utilities, time and random helpers, file and MIDI aids, plus DSP classes (~90 objects)"
category: library
homepage: "https://github.com/iem-projects/pd-zexy"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "上游随源码 vendored pd-lib-builder（Makefile.pdlibbuilder 0.7.0），89 个 .c 链成单一 lib/pd-externals/zexy.pd_linux；该构建器用 `cc -dumpmachine` 探测三元组，而 OHOS 的 clang 不接受裸 `gcc` 名，需经 tools.build:compiler_executables 注入 CC"
    - "zexy 用 `$(CPP) -E` 探测 <sys/io.h> 决定是否编译并口子系统，但 OHOS sysroot 装了该头而 musl 不提供 ioperm/inb/outb：头存在 != 接口存在，探针必然假阳性"
    - "假阳性的代价被『单产物库』放大——x86 并口对象链进同一个 zexy.pd_linux，未解析符号在链接期放行、在宿主 dlopen 全量重定位时爆炸，一个符号让全部约 90 个类不可用（上游回归 36 项挂 19 项）"
    - "处理走上游自带开关 with-lpt=no（-> -DZ_WANT_LPT=0），零补丁；关闭后 nm -uD 符号精确归零，上游回归由 13 PASS/19 FAIL 变为 32 PASS/0 FAIL/4 XFAIL"
    - "上游 tests/testrunner.sh 的补丁参数必须用相对路径（等价 make check 从源码根跑 find tests/*/）：绝对路径会让 tests/absgn~/abs.pd 报 can't load abstraction within itself"
    - "上游回归套件依赖非 .pd 数据（tests/msgfile/*.txt、runtests.sh/bat、README.txt），package() 须整目录拷贝 tests//abs//reference/，只按 *.pd 拷贝会掉 2 个 msgfile 用例"
    - "验收不能停在编译/链接成功：必须做符号层清点（nm -uD）+ 真实 dlopen 冒烟 + 上游全套回归"
  common_dependencies:
    - "puredata/0.54.1"
  knowledge_refs:
    - "knowledge/drafts/E998-draft-B183-pd-external-unresolved-symbol.kv"

versions:
  "2.4.4":
    status: published
    build_date: "2026-09-29"
    conan_ref: "pd-zexy/2.4.4"
