knowledge_gained:
- PyCXX 是 Python distutils 项目，使用 setup.py install 而非 configure/make
- DESTDIR 模式使用 --root 参数替代 DESTDIR
- Header-only + source 库，无编译二进制，产物为 .hxx 头文件和 .cxx/.c 源码
- 安装到 include/python3.12/CXX/ 和 share/python3.12/CXX/
