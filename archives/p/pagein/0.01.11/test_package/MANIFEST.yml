# test_package/MANIFEST.yml
# pagein 0.01.11 - upstream test declaration and consumer-test audit.

package: pagein/0.01.11
homepage: "https://github.com/ColinIanKing/pagein"

upstream_tests_exist: false
upstream_test_audit: >-
  Upstream pagein 0.01.11 ships no test suite: the release tarball contains only
  pagein.c, a Makefile, pagein.1, bash-completion/, README.md and COPYING.
  There is no `check`/`test` target and no tests/ directory.
upstream_check_command: "n/a (no test target)"
upstream_test_in_build: false
upstream_test_command: "n/a"

upstream_tests: []

test_package_tests:
  - file: test_pagein.sh
    description: >-
      installed-program consumer checks: presence/executability of pagein, the
      -h usage banner, and the three argument-validation error paths (no -a/-p,
      mutually exclusive -a/-p, invalid pid).
    command: "sh test_pagein.sh"

test_files:
  - path: "test_package/test_pagein.sh"
    test_type: "R34"
    assertion_count: 7

test_package_test_count: 1
consumer_assertion_count: 7
upstream_test_cases: 0
assertion_count: 7
