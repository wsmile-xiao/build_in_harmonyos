software: pagein
display: "pagein"
description: "把运行中进程的页强制换入内存的小工具"
category: utility
homepage: "https://github.com/ColinIanKing/pagein"
license: GPL-2.0-or-later
build_system: makefile

ohos_adaptation:
  key_points:
    - "单文件 C，纯 Makefile，零三方依赖"
    - "只覆盖 CC=<ohos clang>，保留上游 CFLAGS（含 -DVERSION 宏）"
    - "功能需 CAP_SYS_PTRACE；消费者测试覆盖用法与参数校验错误路径"
  common_dependencies: []

versions:
  - version: "0.01.11"
    status: built
    build_date: "2026-10-03"
