software: php
version: 8.3.11
status: built
build_system: autotools
configure_options:
  - --prefix=/storage/Users/currentUser/usr/local
  - --disable-all
  - --enable-cli
url: https://www.php.net/distributions/php-8.3.11.tar.gz
dependencies: []
platform_patches:
  - 0001-phpdbg-watch-pthread-cancel.patch
notes:
  - PHP源码包缺少build目录文件，需要从GitHub手动下载
  - pthread_cancel在musl/OHOS上不支持，使用__OHOS__宏跳过
  - 预编译包包含PHP CLI、phpdbg、php-cgi
