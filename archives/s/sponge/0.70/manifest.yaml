software: sponge
# 版本级 manifest
# 文件位置: archives/s/sponge/0.70/manifest.yaml
# 遵循 ARCHIVE-SPEC v2.0

# ============================================================
# 必须字段
# ============================================================

# 版本号
version: "0.70"

# 编译状态
# published | built | failed | archived
status: published

# 编译日期（YYYY-MM-DD）
build_date: "2026-07-03"

# ============================================================
# 源码信息
# ============================================================

source:
  # 源码下载 URL
  url: "https://git.joeyh.name/index.cgi/moreutils.git/snapshot/moreutils-0.70.tar.gz"

  # 源码校验和
  sha256: "f2bf46d410ba567cc8d01507e94916994e48742722e690dc498fab59f5250132"

  # 压缩格式
  # tar.gz | tar.xz | tar.bz2 | zip
  tar_format: tar.gz

# ============================================================
# 构建配置
# ============================================================

build:
  # 构建系统类型
  # cmake | autotools | makefile | meson | custom
  system: makefile

  # 配置选项列表
  configure_options: []

  # 编译依赖列表（格式: name/version）
  dependencies: []

  # 编译器
  cc: clang
  cxx: clang++

# ============================================================
# 补丁信息
# ============================================================

# 应用的补丁列表
patches_applied: []

# ============================================================
# 知识沉淀
# ============================================================

# 编译中学到的知识
knowledge_gained:
  - "sponge 来自 moreutils 项目，纯 Makefile 构建，make sponge 即可"
  - "sponge.c 内嵌 #include physmem.c，无需单独编译"
  - "make check 测试 is_utf8 组件而非 sponge，可安全跳过"
  - "鸿蒙平台原生编译通过，无需源码修改"
