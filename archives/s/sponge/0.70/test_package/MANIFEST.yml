# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: sponge/0.70
homepage: "https://joeyh.name/code/moreutils/"

# 上游测试命令 (make check 测试整个 moreutils 套件，sponge 无独立测试)
upstream_check_command: "make check"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: false
upstream_test_command: ""

# 上游实际运行的测试程序
# sponge 无独立上游测试，make check 测试的是 is_utf8 组件
upstream_tests: []

# test_package 中自带的测试 (消费者视角验证)
test_package_tests:
  - file: conanfile.py
    description: "sponge 基本功能测试：stdin → file 写入"
    command: "echo hello | sponge outfile && cat outfile"

# 测试断言总数 (近似值, 用于质量评估)
assertion_count: 2
