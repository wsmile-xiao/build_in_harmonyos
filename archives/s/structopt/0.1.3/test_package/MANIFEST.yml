# test_package/MANIFEST.yml
# 上游官方测试声明文件
# CI 脚本 (build_and_test.sh L0e) 强制要求此文件存在

package: structopt/0.1.3
homepage: "https://github.com/p-ranav/structopt"

# conanfile.py build() 方法中是否已集成上游测试
upstream_test_in_build: true
upstream_test_command: "ctest --test-dir build-tests"

upstream_tests:
  - name: tests/（doctest 单元测试——54 test cases / 393 assertions，直接运行 structopt_tests 可执行）
    count: "54"
    description: "上游测试实测（rule 4，分母=全部 54 用例）：54 passed / 0 failed / 0 skipped（100%，393 assertions 全过）——tests/ 自带 doctest.hpp 无需网络；structopt 测试未注册 ctest 用例（'No tests were found' 实测，与 argparse 同源）——直接运行 structopt_tests 二进制（doctest 自带统计）"

test_package_tests:
  - file: test_structopt.py
    description: "R34：头文件存在 + 编译运行使用 structopt 的 smoke（structopt::app 解析结构体）"
    command: "python3 test_structopt.py <package>"

assertion_count: 2
